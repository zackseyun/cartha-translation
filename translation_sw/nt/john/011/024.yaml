source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: sw
  text: Martha akamwambia, “Ninajua kwamba atafufuka wakati wa ufufuo, siku ya mwisho.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika ufufuo wa siku ya mwisho.”
    reason: Mfuatano wa vishazi viwili vya Kiyunani unaweza pia kueleweka kwa kuunganisha ‘siku ya mwisho’ moja kwa moja na ‘ufufuo.’
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ Μάρθα
  choice: Martha akamwambia
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, ‘akamwambia’ ni simulizi la kawaida na la asili katika Kiswahili. Kiambishi ‘-mw-’ kinawasilisha αὐτῷ bila kurudia kiwakilishi kisichohitajika.
- source_word: Οἶδα
  choice: Ninajua
  rationale: Hutoa kauli ya moja kwa moja ya ujuzi na uhakika wa Martha bila kuongeza mkazo usio katika matini.
- source_word: ἀναστήσεται
  choice: atafufuka
  rationale: Katika muktadha wa ufufuo, kitenzi hiki cha wakati ujao humaanisha kuinuka kutoka kwa wafu. ‘Atafufuka’ ni usemi wa kawaida wa Kiswahili na huhifadhi mtazamo wa kitenzi badala ya kukifanya wazi kuwa cha kutendwa.
- source_word: ἐν τῇ ἀναστάσει
  choice: wakati wa ufufuo
  rationale: Hapa ἐν ina maana ya wakati au mazingira ya tukio. ‘Wakati wa ufufuo’ ni Kiswahili cha asili kuliko tafsiri kavu ya ‘katika ufufuo,’ huku kikihifadhi rejeo mahususi la ufufuo wa wakati ujao.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: siku ya mwisho
  rationale: Kiswahili hakihitaji kihusishi katika usemi huu wa wakati. ‘Siku ya mwisho’ ni fasiri iliyo wazi na ya kawaida ya kishazi cha Kiyunani.
theological_decisions:
- issue: Rejeo la ufufuo wa mwisho
  choice: Martha anazungumzia ufufuo wa wakati ujao ‘siku ya mwisho.’
  alternative: Tumaini la jumla tu la kuendelea kuishi baada ya kifo.
  rationale: Kurudiwa kwa lugha ya ufufuo (ἀναστήσεται ... ἐν τῇ ἀναστάσει), pamoja na ‘siku ya mwisho,’ kunaelekeza kwenye ufufuo wa kieskatolojia. Tafsiri haiongezi maelezo ya kimadhehebu kuhusu namna ya tukio hilo.
- issue: Uhusiano wa ‘ufufuo’ na ‘siku ya mwisho’
  choice: Koma katika ‘wakati wa ufufuo, siku ya mwisho’ inaonyesha kuwa siku ya mwisho ndiyo wakati unaofafanua ufufuo huo.
  alternative: ‘Katika ufufuo wa siku ya mwisho,’ ambapo ‘wa siku ya mwisho’ linaunganishwa moja kwa moja na nomino ‘ufufuo.’
  rationale: Kiyunani kina vishazi viwili vya ἐν vinavyofuatana. Uandishi mkuu huhifadhi tofauti hiyo kwa njia ya asili ya Kiswahili, na tanbihi inatoa uwezekano wa kuviunganisha kwa karibu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamwambia’ linafaa kwa mtiririko wa simulizi, na ‘wakati wa ufufuo’ huepuka usemi mgumu wa neno kwa neno huku likidumisha maana ya chanzo.
