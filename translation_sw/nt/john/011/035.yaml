  footnotes:
  - marker: a
    text: Au, “Yesu akalia.” Kitenzi cha Kigiriki hapa humaanisha hasa kutoa machozi, na ni tofauti na neno linaloeleza kilio cha sauti kubwa mahali pengine katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: akatoa machozi
  rationale: Kitenzi δακρύω humaanisha kutoa machozi. Tafsiri hii ni ya kawaida na yenye staha, na inaonyesha tendo lenyewe bila kuongeza wazo la kuanza kulia au kilio cha sauti kubwa.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Ni jina maalumu lenye kibainishi katika Kigiriki na ndilo kiima cha sentensi. Kiswahili kwa kawaida hakihitaji kibainishi kabla ya jina hili.
theological_decisions:
- issue: Maelezo ya hisia za Yesu
  choice: Yesu akatoa machozi
  alternative: Yesu akalia
  rationale: Tafsiri inaonyesha moja kwa moja hisia halisi za kibinadamu za Yesu, huku ikiepuka kupunguza huzuni yake au kuifanya kuwa kilio kikubwa kuliko kitenzi cha Kigiriki kinavyosema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; sentensi fupi, ya asili, yenye staha na inayoeleweka kwa urahisi. Muundo wa wakati wa usimulizi “aka-” unaendana na mwendelezo wa simulizi.
