  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: sw
  text: Basi Wayahudi walikuwa wakisema[a], “Tazama jinsi alivyompenda!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea,” ikiwa neno hili linaeleweka kwa maana ya kieneo zaidi, likiwahusu watazamaji Wayahudi waliokuwapo hapo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Kauli ya wakati uliopita usiotimilika huonyesha usemi uliokuwa ukiendelea au kurudiwa katika tukio; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Basi
  rationale: Inaunganisha kauli hii na kulia kwa Yesu katika mstari uliotangulia, kwa namna ya hitimisho au mwendelezo wa simulizi.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo jina la moja kwa moja la Kiyunani. Katika muktadha huu linawahusu watazamaji au waombolezaji Wayahudi waliokuwapo, si Wayahudi wote kwa ujumla.
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni amri ya kuelekeza uangalifu na inafaa katika usemi wenye heshima na wa asili.
- source_word: πῶς
  choice: jinsi
  rationale: Huhifadhi wazo la namna au kiwango cha upendo bila kulifafanua kupita kiasi.
- source_word: ἐφίλει
  choice: alivyompenda
  rationale: φιλέω hapa huonyesha upendo wa binafsi. ‘Alivyompenda’ ni ya asili katika Kiswahili na huhifadhi uzito wa hisia.
- source_word: αὐτόν
  choice: -m- katika “alivyompenda”
  rationale: Kiambishi cha yambwa kinamrejelea Lazaro kwa njia ya kawaida ya kisarufi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: Matini kuu inafuata jina la moja kwa moja la chanzo, huku tanbihi ikihifadhi uwezekano wa maana ya kieneo. Muktadha unaonyesha kuwa wanaorejelewa ni Wayahudi waliokuwapo hapo, wala si hukumu ya jumla juu ya jamii nzima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wakisema’ huhifadhi hali endelevu ya ἔλεγον; ‘Tazama jinsi’ ni wazi na ya kawaida bila kuondoa utata wa πῶς kuhusu namna au kiwango.
