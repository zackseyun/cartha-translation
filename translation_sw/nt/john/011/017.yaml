  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: sw
  text: Basi Yesu alipofika, alikuta Lazaro amekuwa kaburini kwa siku nne tayari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: alipofika
  rationale: Kishiriki timilifu kinaonyesha tendo lililotangulia tendo kuu; muundo wa Kiswahili “alipofika” ni wa kawaida na huhifadhi uhusiano huo wa wakati.
- source_word: οὖν
  choice: Basi
  rationale: Hapa neno hili ni kiunganishi cha simulizi kinachounganisha tukio hili na yaliyotangulia, wala si hitimisho kali la kimantiki.
- source_word: εὗρεν
  choice: alikuta kwamba
  rationale: “Alikuta” ni tafsiri ya kawaida ya εὗρεν katika simulizi; “kwamba” huleta kwa Kiswahili hali aliyobaini Yesu.
- source_word: αὐτὸν
  choice: Lazaro
  rationale: Kiwakilishi cha Kiyunani kinamrejelea Lazaro. Kutaja jina lake huondoa utata katika Kiswahili bila kuongeza habari mpya.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: alikuwa tayari amekaa ... siku nne
  rationale: Muundo wa Kiyunani unaeleza muda uliokuwa umepita. Kiswahili cha kawaida hutumia “alikuwa tayari amekaa ... siku nne” kuonyesha hali hiyo ya kudumu hadi wakati Yesu alipofika.
- source_word: μνημείῳ
  choice: kaburini
  rationale: Katika muktadha huu μνημεῖον ni mahali pa kuzikia; “kaburini” ni neno sahihi, la kawaida, na lenye hadhi katika Kiswahili.
theological_decisions:
- issue: Kutaja wazi anayerejelewa na αὐτόν
  choice: Kutumia jina “Lazaro”
  alternative: Kuhifadhi kiwakilishi “yeye” au “alimkuta”
  rationale: Muktadha unaonyesha wazi kuwa kiwakilishi kinamrejelea Lazaro. Kutaja jina kunafanya sentensi iwe wazi kwa msomaji wa Kiswahili bila kutatua suala lolote la kimafundisho au kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye hadhi. “Basi” hudumisha mtiririko wa simulizi, na “kaburini” ni ya asili zaidi hapa kuliko maelezo marefu ya mahali pa kuzikia.
