lexical_decisions:
- source_word: οὔπω
  choice: bado haja-
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida kwamba jambo halikuwa limetokea kufikia wakati huo.
- source_word: δὲ
  choice: bali (kwa mtiririko wa sentensi pamoja na ἀλλά)
  rationale: δέ ni kiunganishi hafifu cha simulizi; hakihitaji neno tofauti mwanzoni mwa sentensi kwa Kiswahili, huku tofauti ya mawazo ikionyeshwa wazi na ἀλλά.
- source_word: ἐληλύθει ... εἰς τὴν κώμην
  choice: alikuwa ... hajafika kijijini
  rationale: Huwasilisha hali iliyotangulia katika simulizi na mwendo kuelekea kijijini kwa Kiswahili cha kawaida bila kudai kwa lazima kwamba Yesu alikuwa amevuka mpaka wake.
- source_word: κώμην
  choice: kijijini
  rationale: κώμη kwa kawaida ni kijiji au makazi madogo; ‘kijijini’ pia huonyesha maana ya εἰς katika muktadha huu.
- source_word: ἀλλ’
  choice: bali
  rationale: Huonyesha tofauti kati ya kutokuwa amefika kijijini na kuendelea kuwapo mahali pale.
- source_word: ἔτι
  choice: angali
  rationale: Huonyesha kuendelea kuwapo katika mahali hapo; ni neno la heshima na linaloeleweka katika Kiswahili sanifu.
- source_word: τόπῳ
  choice: mahali
  rationale: Ni tafsiri ya kawaida na pana ya τόπος.
- source_word: ὅπου
  choice: ambapo
  rationale: Huanzisha kishazi cha mahali kwa Kiswahili sanifu na cha asili.
- source_word: ὑπήντησεν αὐτῷ
  choice: alikuwa amekutana naye
  rationale: Huhifadhi maana ya msingi ya kukutana naye na wakati uliotangulia, bila kulazimisha katika matini kuu maana iliyo wazi zaidi ya kwenda kumlaki.
- source_word: Μάρθα
  choice: Martha
  rationale: Hifadhi tahajia ya jina la kibiblia inayotambulika sana katika matumizi ya Kiswahili.
