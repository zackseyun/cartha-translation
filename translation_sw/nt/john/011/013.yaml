  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: sw
  text: Yesu alikuwa amesema kuhusu kifo cha Lazaro, lakini wao walidhani kwamba alikuwa akisema kuhusu kulala usingizi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “usingizi wa usingizi,” yaani usingizi halisi, wala si kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: alikuwa amesema
  rationale: Wakati timilifu uliopita unaonyesha kuwa Yesu alikuwa tayari amesema jambo hilo kabla ya wanafunzi kulielewa vibaya.
- source_word: δὲ ... δὲ
  choice: lakini
  rationale: δὲ ya kwanza ni kiunganishi chepesi kisichohitaji neno tofauti katika Kiswahili; ya pili inaonyesha wazi tofauti kati ya maana ya Yesu na dhana ya wanafunzi.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: kuhusu kifo chake
  rationale: Hutoa kwa njia ya kawaida maana ya περί pamoja na genitivi na kudumisha rejeo kwa kifo cha Lazaro.
- source_word: ἐκεῖνοι
  choice: wao
  rationale: Kiwakilishi hiki kinawarejelea wanafunzi waliotajwa katika muktadha na pia kinasisitiza tofauti yao na Yesu.
- source_word: ἔδοξαν
  choice: walidhani
  rationale: Katika muktadha huu kitenzi kinaonyesha fikira yao iliyokuwa na makosa.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: akizungumzia kulala usingizi
  rationale: Usemi wa Kiswahili ‘kulala usingizi’ ni wa kawaida na unaonyesha kuwa wanafunzi walielewa usingizi halisi; pia unaakisi muundo wa Kigiriki bila usemi mgumu kama ‘usingizi wa usingizi.’
- source_word: λέγει
  choice: alikuwa akizungumzia
  rationale: Ingawa umbo la Kigiriki ni la wakati uliopo wa kihistoria, usemi wa taarifa katika Kiswahili unahitaji wakati uliopita ili kusimulia kwa kawaida walichodhani wanafunzi.
theological_decisions:
- issue: Iwapo tashbihi ya usingizi kwa kifo ifafanuliwe kama fundisho kuhusu hali ya wafu
  choice: Kutaja wazi ‘kifo chake’ na kuonyesha kuwa wanafunzi walifikiri Yesu alisema kuhusu usingizi halisi
  alternative: Kutumia maneno yanayoweza kudokeza fundisho maalumu kuhusu hali ya roho baada ya kifo
  rationale: Mstari unatofautisha maana ya Yesu na kutokuelewa kwa wanafunzi; haupaswi kupanuliwa kuwa tamko la kimadhehebu kuhusu hali ya wafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kulala usingizi’ ni usemi wa kawaida unaoeleweka kwa urahisi, huku tanbihi ikihifadhi muundo usio wa kawaida wa Kigiriki.
