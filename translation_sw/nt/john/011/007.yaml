  text: Kisha, baada ya hayo, anawaambia wanafunzi, “Twende tena Yudea.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα
  choice: Kisha
  rationale: Huonyesha mfuatano wa simulizi kwa Kiswahili cha kawaida na cha sasa.
- source_word: μετὰ τοῦτο
  choice: baada ya hayo
  rationale: Huhifadhi rejeo la wakati baada ya matukio yaliyotangulia; “baada ya hayo” ni ya asili zaidi katika muktadha huu kuliko tafsiri ya neno kwa neno “baada ya hili.”
- source_word: λέγει
  choice: anawaambia
  rationale: Huhifadhi wakati uliopo wa kihistoria unaotumiwa na Yohana na pia huonyesha kwa kawaida kwamba maneno yanaelekezwa kwa wanafunzi.
- source_word: τοῖς μαθηταῖς
  choice: wanafunzi
  rationale: Hutoa walengwa wa kitenzi bila kuongeza kimilikishi “wake,” ambacho hakijaandikwa wazi katika Kigiriki.
- source_word: Ἄγωμεν
  choice: Twende
  rationale: Ni umbo la kawaida la Kiswahili kwa wito wa nafsi ya kwanza wingi, likihifadhi maana ya ‘na twende’ bila kuongeza msisitizo.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: Uyahudi
  rationale: Pamoja na kitenzi “twende,” Kiswahili huonyesha kwa kawaida mwendo kuelekea eneo bila kuhitaji kihusishi tofauti cha ‘to/into.’
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudi katika eneo walilokuwa wamefika hapo awali kwa neno la moja kwa moja na la kawaida.
theological_decisions:
- issue: Wakati uliopo wa kihistoria katika simulizi la Yohana
  choice: Kuhifadhi wakati uliopo kwa “anawaambia”
  alternative: 'Kulainisha simulizi kwa wakati uliopita: “aliwaambia”'
  rationale: Kuhifadhi wakati uliopo kunaakisi mtindo wa simulizi wa Yohana bila kuingiza maana ya kiteolojia isiyokuwamo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “Kisha baada ya hayo” umehifadhi vipengele vyote viwili vya mpangilio wa wakati katika Kigiriki. Hakuna tanbihi kuhusu εἰς kwa sababu Kiswahili “twende Uyahudi” hakilazimishi uchaguzi tofauti kati ya ‘kwenda hadi’ na ‘kwenda ndani ya’ eneo hilo.
