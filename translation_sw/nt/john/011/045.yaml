  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: sw
  text: Kwa hiyo, Wayahudi wengi waliomjia Maria na kuona yale aliyoyafanya walimwamini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wengi kutoka miongoni mwa Wayahudi.” Katika baadhi ya miktadha ya Injili ya Yohana, Ἰουδαῖοι pia linaweza kutafsiriwa “Wayudea” (watu wa Yudea).
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: wengi
  rationale: Huhifadhi idadi isiyoainishwa lakini kubwa kwa lugha ya kawaida ya Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha uhusiano wa matokeo na simulizi lililotangulia, hasa tendo la Yesu la kumfufua Lazaro.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: Wayahudi wengi
  rationale: Muundo huu wa Kiswahili huwasilisha maana ya sehemu ya kundi kwa kawaida; tanbihi inahifadhi uwezekano wa kutafsiri Ἰουδαῖοι kuwa watu wa Uyahudi.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: waliokuwa wamekuja kwa Maria
  rationale: Huwatambulisha Wayahudi wanaokusudiwa na kudumisha kwamba kuja kwao kulitangulia kitendo kikuu.
- source_word: θεασάμενοι
  choice: na kuona
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba walishuhudia tendo la Yesu; mfuatano wa simulizi unaweka kuona huko kabla ya kuamini.
- source_word: ἃ ἐποίησεν
  choice: yale aliyoyafanya
  rationale: Huwasilisha kwa kawaida kiwakilishi cha wingi kisicho na jinsia pamoja na kitenzi ποιέω, bila kubainisha zaidi ya chanzo.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: walimwamini
  rationale: Ni usemi wa kawaida wa Kiswahili kwa imani iliyoelekezwa kwa mtu, na unahifadhi mwelekeo binafsi wa εἰς αὐτόν bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Uwasilishaji wa πιστεύω εἰς αὐτόν katika muktadha wa Yohana
  choice: walimwamini
  alternative: waliweka imani yao kwake
  rationale: “Walimwamini” ni wazi, fupi, na ya kawaida, huku ikihifadhi imani iliyoelekezwa kwa Yesu. Mbadala ni mpana zaidi na unaweza kuongeza mkazo usio lazima.
- issue: Utambulisho wa Ἰουδαῖοι
  choice: Wayahudi
  alternative: watu wa Uyahudi
  rationale: “Wayahudi” ndilo neno la kawaida na linafaa katika muktadha huu, lakini tanbihi inahifadhi uwezekano wa maana ya kikanda unaojadiliwa katika baadhi ya sehemu za Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imewekwa nyepesi na ya kawaida, huku ikihifadhi uhusiano wa matokeo, utambulisho wa kundi, na lugha ya imani ya Yohana.
