  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: sw
  text: Baada ya kusema hayo, aliondoka, akamwita Maria, dada yake, kwa faragha[a], akisema, “Mwalimu yupo hapa, naye anakuita[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa siri.” Neno la Kigiriki linaweza kumaanisha kusema pasipo kusikiwa na watu wengine.
    reason: lexical_alternative
  - marker: b
    text: 'Yaani, anataka uende kwake. Kwa maana iliyo karibu zaidi na muundo wa Kigiriki: “anakuita.”'
    reason: lexical_clarification
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Baada ya kusema hayo
  rationale: Kirai cha kishirikishi cha wakati uliopita kinaonyesha kwamba tendo la kusema lilitangulia kuondoka; muundo huu ni wa kawaida na huhifadhi mfuatano wa matukio.
- source_word: ἀπῆλθεν
  choice: aliondoka
  rationale: Kitenzi kinaonyesha kuondoka mahali alipokuwa; ‘aliondoka’ ni tafsiri fupi na ya kawaida katika simulizi.
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: akamwita Maria dada yake
  rationale: φωνέω hapa ni kumwita mtu aje, huku kirai kinachofuata kikimtambulisha Maria kuwa dada yake.
- source_word: λάθρᾳ
  choice: kwa faragha
  rationale: Kielezi kinaonyesha kwamba alimwambia pasipo kusikiwa na watu wengine. ‘Kwa faragha’ huhifadhi hali ya mawasiliano bila kudokeza kwa lazima hila au udanganyifu.
- source_word: εἰποῦσα
  choice: akisema
  rationale: Kishirikishi hiki kinaanzisha maneno ya moja kwa moja na kinaunganishwa kwa kawaida na kitendo cha kumwita.
- source_word: Ὁ διδάσκαλος
  choice: Mwalimu
  rationale: διδάσκαλος humaanisha mwalimu na hapa limetumiwa kama jina la heshima kwa Yesu; tafsiri hii haiongezi dhana ya mamlaka ambayo si lazima iwe katika neno lenyewe.
- source_word: πάρεστιν
  choice: yupo hapa
  rationale: Kitenzi kina maana ya kuwapo au kuwa mahali hapa. ‘Yupo hapa’ ni usemi wa kawaida kwa mtu katika Kiswahili.
- source_word: φωνεῖ σε
  choice: anakuita
  rationale: Wakati uliopo unaonyesha mwito unaohusika kwa sasa. Katika muktadha, usemi huu unaeleweka kuwa anataka Maria aje, si kwamba anatamka jina lake tu.
theological_decisions:
- issue: Tafsiri ya cheo διδάσκαλος cha Yesu
  choice: Mwalimu
  alternative: Bwana mkubwa
  rationale: ‘Mwalimu’ huhifadhi maana ya kawaida ya neno la Kigiriki na heshima iliyomo bila kuingiza maana pana ya kiutawala isiyoelezwa wazi hapa.
- issue: Dhana ya λάθρᾳ
  choice: kwa faragha
  alternative: kwa siri
  rationale: Muktadha unaonyesha mawasiliano yasiyokusudiwa kusikiwa na wengine, lakini hauthibitishi nia ya udanganyifu au kuficha jambo kwa hila. ‘Kwa faragha’ huhifadhi uwazi huo.
- issue: Nguvu ya wakati uliopo katika φωνεῖ σε
  choice: anakuita
  alternative: amekuita
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa kwa usemi wa sasa. Katika Kiswahili, ‘anakuita’ pia huweza kumaanisha kwamba anataka uende kwake, bila kulazimisha ufafanuzi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye staha. Muundo ‘akamwita’ unaendeleza mfuatano wa matendo, huku ‘kwa faragha’ ikiwekwa karibu na kitendo inachofafanua. Hakuna alama ya tanbihi iliyowekwa baada ya ‘Mwalimu’ kwa sababu tafsiri ya moja kwa moja ‘Mwalimu’ ni wazi na mbadala kama ‘Bwana mkubwa’ si lazima uingizwe katika matini.
