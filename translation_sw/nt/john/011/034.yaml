translation:
  language: sw
  text: Akasema, “Mmemweka wapi?” Wakamwambia, “Bwana[a], njoo uone.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana” kama mwito wa heshima. Neno la Kigiriki κύριε linaweza kutumiwa kama namna ya heshima ya kumwita mtu; hapa limetafsiriwa “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: Akasema
  rationale: Kitenzi λέγω humaanisha kusema. Ingawa maneno yanayofuata ni swali, “akasema” kinafuata kwa karibu usemi wa Kigiriki bila kutafsiri kwa ufafanuzi zaidi kuwa “akauliza.”
- source_word: Ποῦ
  choice: wapi
  rationale: Kielezi cha kuuliza moja kwa moja kuhusu mahali.
- source_word: τεθείκατε
  choice: mmemweka
  rationale: Kauli hii ni hali timilifu ya τίθημι na inaonyesha tendo lililokwisha la kuuweka mwili wa Lazaro. “Mmemweka” ni Kiswahili cha kawaida na huhifadhi hali hiyo bila kuongeza maelezo yasiyokuwamo katika mstari.
- source_word: αὐτόν
  choice: -m- katika “mmemweka”
  rationale: Kiwakilishi cha nafsi ya tatu, umoja, kinachomrejelea Lazaro, huwakilishwa kiasili na kiambishi cha yambwa -m-.
- source_word: λέγουσιν
  choice: Wakamwambia
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umetolewa kwa wakati wa masimulizi wa Kiswahili. “Wakamwambia” pia huonyesha kwa kawaida kwamba maneno yao yalimwelekea Yesu.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida kwa κύριε na linaweza kuhifadhi maana ya heshima pamoja na uwezekano wa uzito wa kitheolojia.
- source_word: ἔρχου
  choice: njoo
  rationale: Agizo au mwaliko wa moja kwa moja wa ἔρχομαι umetolewa kwa Kiswahili cha kawaida.
- source_word: ἴδε
  choice: uone
  rationale: Agizo la ὁράω limetafsiriwa “uone,” ambalo linaungana kiasili na “njoo” na kuhifadhi msemo “njoo uone.”
theological_decisions:
- issue: Tafsiri ya κύριε kama namna ya kumwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi uwezekano kwamba neno hilo ni zaidi ya heshima ya kawaida, lakini halilazimishi maana hiyo pekee. “Mheshimiwa” lingeweka mkazo zaidi kwenye heshima ya kijamii na kupunguza uwezekano wa maana ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. “Mmemweka” ni wazi na cha kawaida katika muktadha, huku tanbihi ikihifadhi wigo wa maana wa κύριε.
