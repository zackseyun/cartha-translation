base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: sw
  text: Nao makuhani wakuu na Mafarisayo walikuwa wametoa maagizo kwamba mtu yeyote akijua aliko, atoe taarifa, ili wamkamate[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtia nguvuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: walikuwa wametoa
  rationale: Wakati timilifu uliopita unaonyesha kwamba maagizo yalikuwa yametolewa kabla ya hatua ya simulizi inayotajwa.
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha upinzani mkali; “Nao” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Katika muktadha huu wingi huu unamaanisha viongozi wa ukuhani, si makuhani wakuu wengi waliokuwa wakishika cheo hicho kwa wakati mmoja.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo umbo la kawaida la jina la kundi hili katika Kiswahili.
- source_word: ἐντολὰς
  choice: maagizo
  rationale: Neno hili linaonyesha maelekezo yenye mamlaka; “maagizo” ni la asili na linafaa kwa muktadha wa viongozi.
- source_word: ἵνα ἐάν τις γνῷ
  choice: kwamba mtu yeyote akijua
  rationale: Muundo huu unawasilisha yaliyomo katika maagizo pamoja na sharti la mtu kuwa na habari hiyo.
- source_word: ποῦ ἐστιν
  choice: aliko
  rationale: Uhusiano wa mahali wa Kiswahili unadumisha hali ya wakati wa sasa ya Kigiriki kwa njia ya kawaida, bila kulazimisha ubadilishaji wa wakati.
- source_word: μηνύσῃ
  choice: atoe taarifa
  rationale: Katika muktadha wa mamlaka, kitenzi hiki humaanisha kutoa habari au kuripoti; usemi huu hauongezi mpokeaji ambaye Kigiriki hakumtaji wazi.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: ili wapate kumkamata
  rationale: Huhifadhi kusudi la taarifa hiyo na maana ya πιάζω ya kumshika au kumtia mtu mikononi mwa wenye mamlaka.
