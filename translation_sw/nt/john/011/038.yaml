review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative connective, repetition, strong inward emotional response, arrival at the tomb, cave setting, and stone. However, “amefadhika” can readily suggest being confused or perplexed in current Swahili, which is not the likely force of ἐμβριμώμενος. “Kwenye mwingilio wake” also makes the entrance explicit where the Greek says only that the stone lay upon/against the tomb.
  naturalness: The narrative is generally fluent. “Akiwa tena ametaabika sana moyoni mwake” is more idiomatic and communicates intense inward distress without specifying its precise emotional valence. “Jiwe lilikuwa limewekwa juu yake” follows the Greek wording directly and avoids an unnecessary explanatory addition.
  terminology: Kaburi, pango, and jiwe are appropriate standard East African Swahili terms. “Moyoni mwake” is a natural idiom for ἐν ἑαυτῷ in this emotional context. The footnote retains the significant possible nuance of indignation.
  issues:
  - severity: medium
    issue: “amefadhika sana” may imply confusion or perplexity.
    rationale: In modern Standard East African Swahili, -fadhaika can denote being bewildered or at a loss. The Greek ἐμβριμώμενος denotes powerful inward agitation and may include indignation, but does not naturally mean intellectual confusion.
  - severity: low
    issue: “kwenye mwingilio wake” explicitly supplies an entrance.
    rationale: The Greek states that the stone was lying upon/against the tomb. Although an entrance is contextually likely, it is not stated in the verse and need not be added in the main text.
  revised_text: Basi Yesu, akiwa tena ametaabika sana moyoni mwake[a], akafika kaburini. Kaburi hilo lilikuwa pango, na jiwe lilikuwa limewekwa juu yake.
  revised_footnotes:
