  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: sw
  text: Basi Yesu, akiwa tena ametaabika sana moyoni mwake[a], akafika kaburini. Kaburi hilo lilikuwa pango, na jiwe lilikuwa limewekwa juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa amekasirika moyoni mwake” au “akiwa amesumbuka sana moyoni mwake.” Kitenzi cha Kigiriki kina nguvu isiyo ya kawaida na huenda kikaonyesha zaidi ya huzuni peke yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huendeleza simulizi kutokana na yaliyotangulia bila kufanya uhusiano huo usikike kama hitimisho rasmi.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudiwa kwa msukosuko mkali wa ndani wa Yesu uliotajwa awali.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: akiwa amefadhaika sana ndani yake
  rationale: Huhifadhi nguvu ya hisia na hali yake ya ndani bila kuamua kwamba ilikuwa huzuni pekee au hasira pekee.
- source_word: ἔρχεται
  choice: akafika
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa namna ya kawaida ya usimulizi wa Kiswahili; hapa kitenzi kinaonyesha kufika kwake kaburini.
- source_word: μνημεῖον
  choice: kaburi
  rationale: Ni neno la kawaida na lenye heshima kwa mahali pa kuzikia, na maelezo yanayofuata yanaonyesha kuwa lilikuwa kaburi la pangoni.
- source_word: σπήλαιον
  choice: pango
  rationale: Ni kisawe cha moja kwa moja na cha kawaida katika Kiswahili cha sasa.
- source_word: λίθος
  choice: jiwe
  rationale: Ni tafsiri ya kawaida katika muktadha wa jiwe lililofunga kaburi.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: lilikuwa limewekwa kwenye mwingilio wake
  rationale: Hueleza kwa Kiswahili cha kawaida nafasi ya jiwe dhidi ya uwazi wa kaburi la pangoni, bila kudokeza kwamba lililala juu ya sehemu tambarare.
theological_decisions:
- issue: Nguvu na aina ya hisia katika ἐμβριμώμενος kuhusu Yesu
  choice: Yesu anaonyeshwa akiwa amefadhaika sana ndani yake, bila kubainisha hisia hiyo kuwa huzuni au hasira pekee.
  alternative: Yesu alikuwa amekasirika ndani yake; au alikuwa amesumbuka sana ndani yake.
  rationale: Kitenzi cha Kigiriki kina nguvu isiyo ya kawaida na kinaweza kuonyesha msukosuko mkubwa, hata ghadhabu. Tafsiri kuu inahifadhi uzito na utata huo, huku tanbihi ikitoa maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa simulizi, na tanbihi huhifadhi utata wa hisia kali za Yesu.
