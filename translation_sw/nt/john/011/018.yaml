lexical_decisions:
- source_word: δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Ni kiunganishi hafifu kinachoendeleza simulizi; mtiririko wa Kiswahili hauhitaji ‘basi’ au ‘lakini’ hapa.
- source_word: Βηθανία
  choice: Bethania
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: karibu na Yerusalemu
  rationale: Hutoa kwa kawaida maana ya ukaribu wa mahali, huku jina la Yerusalemu likifuata matumizi ya kawaida ya Kiswahili.
- source_word: ὡς
  choice: kama
  rationale: Katika kipimo, neno hili huonyesha ukadiriaji, si umbali kamili.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: umbali wa kama stadia kumi na tano
  rationale: Imehifadhi kipimo cha kale cha matini chanzo, huku muundo wa Kiswahili ukieleza wazi kwamba ni umbali.
