  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: sw
  text: Bethania ilikuwa karibu na Yerusalemu, umbali wa kama stadia kumi na tano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
