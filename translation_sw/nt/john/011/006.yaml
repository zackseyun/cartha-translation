  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: sw
  text: Basi, aliposikia kwamba Lazaro ni mgonjwa[a], ndipo akakaa siku mbili mahali alipokuwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lazaro alikuwa mgonjwa.” Kigiriki kinatumia wakati wa sasa, yaani, “ni mgonjwa.”
    reason: Mbadala wa wakati wa kitenzi katika taarifa iliyosimuliwa.
lexical_decisions:
- source_word: ὡς οὖν
  choice: Basi, aliposikia
  rationale: “Basi” linaendeleza simulizi na kudokeza uhusiano na yaliyotangulia, huku “aliposikia” likitoa maana ya wakati ya ὡς kwa Kiswahili cha kawaida.
- source_word: ἤκουσεν
  choice: aliposikia
  rationale: Kitenzi ἀκούω hapa kina maana ya kawaida ya kusikia; umbo hili pia linaunganisha kwa ufasaha sentensi ya wakati.
- source_word: ὅτι ἀσθενεῖ
  choice: kwamba Lazaro ni mgonjwa[a]
  rationale: ἀσθενέω katika muktadha huu hurejelea ugonjwa wa mwili. Jina “Lazaro” linaweka wazi mhusika wa kitenzi kilicho na kiima kisichotajwa katika Kigiriki na kuzuia dhana kwamba Yesu ndiye mgonjwa. Wakati uliopo “ni mgonjwa” unahifadhi wakati wa sasa wa Kigiriki.
- source_word: τότε μὲν
  choice: ndipo
  rationale: “Ndipo” linaonyesha kwa mkazo hatua iliyofuata baada ya Yesu kusikia habari hiyo. Linahifadhi nguvu ya τότε na mkazo hafifu wa μέν bila kuunda Kiswahili kizito.
- source_word: ἔμεινεν
  choice: akakaa
  rationale: μένω hapa ni kubaki mahali fulani. “Akakaa” ni la kawaida na la asili katika masimulizi ya Kiswahili.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: mahali alipokuwa
  rationale: Tafsiri hii inahifadhi msisitizo wa mahali uliomo katika Kigiriki bila kuongeza kwamba alikuwa akifanya jambo jingine huko.
- source_word: δύο ἡμέρας
  choice: siku mbili
  rationale: Ni muda wa moja kwa moja na usio na utata.
theological_decisions:
- issue: Dokezo la Yesu kuchelewa baada ya kusikia kuhusu ugonjwa wa Lazaro
  choice: 'Kauli imetafsiriwa wazi: baada ya kusikia, ndipo akakaa huko siku mbili.'
  alternative: Kuongeza maelezo kwamba alichelewa kwa kusudi la huruma au kulainisha uhusiano wa matukio hayo.
  rationale: Andiko lenyewe linaacha mvutano huu wa kisimulizi na kiteolojia wazi; tafsiri haipaswi kuutatua kwa maelezo yasiyomo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi … ndipo” linaendeleza simulizi kwa ufasaha huku likihifadhi uhusiano wenye mkazo kati ya kusikia habari na kukaa siku mbili.
