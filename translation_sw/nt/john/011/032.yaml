  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: sw
  text: Basi Maria alipofika mahali Yesu alipokuwa, na kumwona, alianguka miguuni pake, akamwambia, “Bwana,[a] kama ungalikuwa hapa, ndugu yangu hangalikufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki κύριε linaweza pia kutumiwa kama mwito wa heshima kwa mtu. Hapa limetafsiriwa “Bwana” kwa kuzingatia matumizi ya kawaida ya κύριος na jinsi Injili hii inavyomwasilisha Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaendeleza simulizi kwa kuunganisha tukio hili na yaliyotangulia bila kudokeza hitimisho zito kupita kiasi.
- source_word: ὡς ἦλθεν
  choice: alipofika
  rationale: Muundo wa wakati unaonyesha kwamba tendo linalofuata lilitokea Maria alipowasili; “alipofika” ni Kiswahili cha kawaida na sahihi.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: mahali alipokuwa Yesu
  rationale: Inahifadhi maana ya mahali ya Kigiriki kwa Kiswahili cha asili.
- source_word: ἰδοῦσα αὐτόν
  choice: na kumwona
  rationale: Kirai tegemezi kinaonyesha tendo linalohusiana kwa karibu na kufika kwake; muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: alianguka miguuni pake
  rationale: Ni namna ya asili ya kueleza kuanguka au kujitupa mbele ya mtu karibu na miguu yake.
- source_word: λέγουσα αὐτῷ
  choice: akamwambia
  rationale: Kitenzi cha Kiswahili kinaendeleza mfuatano wa simulizi na kutambulisha maneno ya Maria kwa kawaida.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la Kiswahili kwa κύριε na linahifadhi uwezekano wa heshima pamoja na uzito mkubwa zaidi wa kimafundisho katika Injili ya Yohana.
- source_word: εἰ ἦς ὧδε
  choice: kama ungalikuwa hapa
  rationale: Hali ya masharti isiyotimia katika wakati uliopita inaonyeshwa wazi kwa “ungalikuwa.”
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: hangalikufa
  rationale: Muundo huu unaonyesha matokeo ya wakati uliopita ambayo Maria anasema yasingetokea.
- source_word: μου ὁ ἀδελφός
  choice: ndugu yangu
  rationale: Inawasilisha umilikaji wa μου kwa Kiswahili cha kawaida; “ndugu” linafaa kwa ἀδελφός katika muktadha huu unaomhusu Lazaro, kaka au ndugu yake wa kiume.
theological_decisions:
- issue: Tafsiri ya κύριε katika maneno ya Maria kwa Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” hudumisha uzito wa neno κύριε na uwasilishaji wa Yesu katika Injili ya Yohana, bila kulazimisha kwamba Maria hapa anatamka ungamo kamili la kimafundisho. “Mheshimiwa” ingeweza kuifanya kauli kuwa ya heshima ya kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Miundo “ungalikuwa” na “hangalikufa” imetumiwa kuonyesha kwa uwazi sharti lisilotimia la wakati uliopita. Alama ya tanbihi [a] imewekwa mara baada ya “Bwana” kwa sababu tanbihi inahusu neno hilo.
