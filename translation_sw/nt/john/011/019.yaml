base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: sw
  text: Wengi miongoni mwa Wayahudi[a] walikuwa wamekuja kwa Martha na Maria ili kuwafariji kuhusu ndugu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wengi miongoni mwa Wayudea walikuwa wamekuja kwa Martha na Maria.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au, katika baadhi ya miktadha ya Yohana, watu wa Yudea hasa.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Wengi
  rationale: πολλοί ni “wengi.” δέ ni kiunganishi hafifu cha mwendelezo; hapa hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili, kwa kuwa kufanya hivyo kungeweza kudokeza tofauti au wakati usiotajwa wazi.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: miongoni mwa Wayahudi
  rationale: 'Muundo huu una maana ya sehemu ya kundi: “wengi miongoni mwa Wayahudi.” Ἰουδαῖοι inaweza kumaanisha Wayahudi kwa ujumla au, katika baadhi ya miktadha ya Yohana, watu wa Yudea; uwezekano huo umehifadhiwa katika tanbihi.'
- source_word: ἐληλύθεισαν
  choice: walikuwa wamekuja
  rationale: Wakati timilifu uliopita unaonyesha kwamba kuja kwao kulitangulia hali ya simulizi inayozungumziwa.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: kwa Martha na Maria
  rationale: πρός pamoja na hali ya kushutumiwa hapa inaonyesha kwenda au kufika kwa watu fulani. Martha na Maria ni maumbo ya majina yanayotumika kwa kawaida katika Kiswahili.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: ili kuwafariji
  rationale: ἵνα pamoja na hali tegemezi inaonyesha kusudi. παραμυθέομαι hapa ni kufariji au kutuliza wenye huzuni.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: kwa kufiwa na ndugu yao
  rationale: Kihalisi ni “kuhusu ndugu huyo.” Katika muktadha wa maombolezo, Kiswahili cha kawaida hueleza sababu ya faraja kuwa kufiwa na ndugu yao; “yao” huonyesha kwa kawaida kwamba alikuwa ndugu wa Martha na Maria.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika Injili ya Yohana
  choice: Wayahudi
  alternative: Wayudea
  rationale: Mstari huu unaeleza watu waliokuja kuwafariji dada hao, si kundi la viongozi wenye uhasama. Kwa hiyo maana pana ya “Wayahudi” inafaa zaidi katika muktadha huu, huku uwezekano wa kijiografia wa “Wayudea” ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli “kwa kufiwa na ndugu yao” ni ya kawaida na wazi katika muktadha wa maombolezo; tanbihi imewekwa baada ya “Wayahudi” ili ionyeshe moja kwa moja neno linalohusika.
