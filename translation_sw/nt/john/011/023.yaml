  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: sw
  text: Yesu akamwambia, “Ndugu yako atafufuka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kisimulizi, Kiswahili sanifu kwa kawaida hutumia wakati uliopita wa kisimulizi hapa; “akamwambia” ni ya asili na inaendeleza mtiririko wa simulizi.
- source_word: αὐτῇ
  choice: -mw-
  rationale: Kiwakilishi cha yambwa katika “akamwambia” kinawakilisha kwa kawaida maana ya ‘kwake/yeye’ bila kurudia jina.
- source_word: Ἀναστήσεται
  choice: atafufuka
  rationale: Kitenzi hiki katika muktadha wa kifo cha Lazaro humaanisha kuinuka kutoka kwa wafu. “Atafufuka” ni usemi wa kawaida wa Kiswahili na hauongezi kwa lazima wazo la mtendaji wa nje lililo katika “atafufuliwa.”
- source_word: ὁ ἀδελφός σου
  choice: ndugu yako
  rationale: “Ndugu yako” ni tafsiri ya kawaida na ya asili; muktadha unaonyesha kuwa anayezungumziwa ni ndugu wa kiume wa Martha, yaani Lazaro.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili; kibainishi cha Kigiriki hakihitaji kutafsiriwa kando.
theological_decisions:
- issue: Usemi wa ufufuo
  choice: atafufuka
  alternative: atafufuliwa
  rationale: “Atafufuka” huhifadhi kauli kwamba ndugu yake atainuka kutoka kwa wafu bila kutaja wazi mtendaji wala kuamua katika mstari huu ikiwa Yesu anamaanisha kufufuliwa mara moja au ufufuo wa siku ya mwisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, rahisi na chenye heshima. Wakati wa sasa wa kisimulizi wa Kigiriki umetolewa kwa wakati uliopita wa kisimulizi unaosikika wa kawaida katika Kiswahili.
