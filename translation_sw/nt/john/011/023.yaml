  source_fidelity: “Yesu akamwambia, ‘Ndugu yako atafufuka.’” accurately renders the sense of λέγει αὐτῇ ὁ Ἰησοῦς and Ἀναστήσεται ὁ ἀδελφός σου. The Swahili narrative past is idiomatic, and atafufuka appropriately conveys future resurrection without changing the Greek voice to a passive.
