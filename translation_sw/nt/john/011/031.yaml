review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents the narrative connective, the mourners' presence and consolation of Mary, their following her, and their supposition concerning the tomb. However, “amesimama” normally means “has stood/is standing” and does not naturally convey the completed action of getting up and going out required by ἀνέστη καὶ ἐξῆλθεν.
  naturalness: The verse is generally clear and idiomatic, but replacing “amesimama” with “akiinuka” gives natural modern Standard East African Swahili and directly expresses Mary’s rising from where she was.
  terminology: “Wayahudi” is a defensible contextual rendering of Ἰουδαῖοι, with the geographic alternative appropriately retained in the footnote. “Kaburini” is suitable for μνημεῖον in this context, and “wakimfariji” accurately renders the consoling activity.
  issues:
  - severity: medium
    issue: “Maria amesimama upesi” does not accurately or naturally render ἀνέστη.
    rationale: The perfect form “amesimama” ordinarily describes Maria as standing or having stood, whereas the Greek narrates that she got up quickly. “Maria akiinuka upesi” directly conveys the action and preserves the event sequence.
  revised_text: Basi, Wayahudi[a] waliokuwa pamoja naye ndani ya nyumba wakimfariji, walipomwona Maria akiinuka upesi na kutoka nje, walimfuata, wakidhani kwamba alikuwa akienda kaburini ili kulia huko.
  revised_footnotes:
