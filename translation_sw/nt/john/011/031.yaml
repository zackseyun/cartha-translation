  to: Basi, Wayahudi[a] waliokuwa pamoja naye ndani ya nyumba wakimfariji, walipomwona Maria akiinuka upesi na kutoka nje, walimfuata, wakidhani kwamba alikuwa akienda kaburini ili kulia huko.
  rationale: The revision corrects the rendering of Mary’s rising while retaining the draft’s faithful handling of all other source elements, including the contextual ambiguity of Ἰουδαῖοι and its footnote anchor.
