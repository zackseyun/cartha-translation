id: JHN.11.31
reference: John 11:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: sw
  text: Basi, Wayahudi[a] waliokuwa pamoja naye ndani ya nyumba wakimfariji, walipomwona Maria akiinuka upesi na kutoka nje, walimfuata, wakidhani kwamba alikuwa akienda kaburini ili kulia huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watu wa Yudea.” Katika Yohana, neno la Kigiriki Ἰουδαῖοι wakati mwingine linaweza kumaanisha hasa watu wa Yudea au viongozi wa Kiyahudi; lakini hapa linarejelea kundi lililokuwa likiomboleza pamoja na Maria.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Basi Wayahudi[a]
  rationale: οὖν inaendeleza simulizi kwa njia ya kawaida kama “Basi.” Ἰουδαῖοι hapa inawataja waombolezaji waliokuwa pamoja na Maria; “Wayahudi” ni tafsiri ya moja kwa moja, huku uwezekano wa “Watu wa Yudea” ukihifadhiwa katika tanbihi.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ
  choice: waliokuwa pamoja naye ndani ya nyumba
  rationale: Kirai hiki kinabainisha kundi linalozungumziwa, na ἐν τῇ οἰκίᾳ kwa kawaida ni “ndani ya nyumba.”
- source_word: παραμυθούμενοι αὐτήν
  choice: wakimfariji
  rationale: Kitenzi hiki humaanisha kumpa mtu faraja; “wakimfariji” ni Kiswahili cha kawaida na kinafaa katika mazingira ya maombolezo.
- source_word: ἰδόντες
  choice: walipomwona
  rationale: Kauli shirikishi ya wakati uliopita imetafsiriwa kwa kishazi cha wakati ili kuonyesha vizuri mfuatano wa matukio.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: amesimama upesi na kutoka nje
  rationale: Hapa ἀνέστη humaanisha kuinuka au kusimama kutoka alipokuwa, si kufufuka; muundo wa Kiswahili unaonyesha vitendo walivyomwona akiwa amefanya.
- source_word: ἠκολούθησαν αὐτῇ
  choice: walimfuata
  rationale: Maana hapa ni kumfuata kimwili, bila kulazimisha dhana maalumu ya uanafunzi.
- source_word: δόξαντες
  choice: wakidhani
  rationale: Neno hili linaonyesha dhana au hitimisho lao lisilo na uhakika.
- source_word: ὑπάγει
  choice: alikuwa akienda
  rationale: Wakati uliopo wa Kigiriki katika usemi tegemezi umeelezwa kwa hali ya wakati uliopita inayoendelea, inayosikika kwa kawaida katika Kiswahili.
- source_word: εἰς τὸ μνημεῖον
  choice: kaburini
  rationale: μνημεῖον katika muktadha huu ni kaburi la kuzikia; “kaburini” ni tafsiri ya kawaida na sahihi.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: ili kulia huko
  rationale: ἵνα pamoja na hali tegemezi huonyesha kusudi; “ili kulia huko” hulihifadhi wazi.
theological_decisions:
- issue: Maana ya Ἰουδαῖοι katika simulizi la Yohana
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: Matumizi ya Ἰουδαῖοι katika Yohana hutegemea muktadha. Hapa ni kundi la waombolezaji waliokuwa na Maria, si lazima taifa lote wala viongozi wa Kiyahudi. Tafsiri ya moja kwa moja imewekwa katika andiko, huku maana mbadala ya kijiografia ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa kawaida kwa usomaji wa simulizi, huku utata halisi wa Ἰουδαῖοι ukihifadhiwa kwa tanbihi.
