  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: sw
  text: Basi, wale dada wakatuma ujumbe kwake wakisema, “Bwana, tazama, yule unayempenda ni mgonjwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν
  choice: wakatuma ujumbe kwake
  rationale: Kitenzi ‘kutuma’ pamoja na muktadha wa maneno yanayofuata huonyesha kwa Kiswahili cha kawaida kwamba walituma ujumbe, bila kulazimisha kwamba dada wenyewe walikwenda.
- source_word: ἴδε
  choice: tazama
  rationale: Inahifadhi wito wa moja kwa moja wa kumwelekeza Bwana kwenye hali hiyo, huku ikiwa na uzito wa lugha yenye heshima.
- source_word: ὃν φιλεῖς
  choice: yule unayempenda
  rationale: Ni tafsiri ya kawaida na ya asili ya upendo wa karibu unaoonyeshwa na φιλέω, bila kuongeza kiwango au aina ya upendo ambayo haijaelezwa wazi.
- source_word: ἀσθενεῖ
  choice: ni mgonjwa
  rationale: Katika muktadha huu kitenzi kinaeleza hali ya ugonjwa; Kiswahili ‘ni mgonjwa’ ni wazi na cha kawaida.
theological_decisions:
- issue: Tofauti inayoweza kudhaniwa kati ya φιλέω hapa na ἀγαπάω katika muktadha mpana
  choice: unayempenda
  alternative: unayemjali sana
  rationale: Tafsiri haijengi tofauti ya kiteolojia isiyothibitishwa kati ya vitenzi vya Kigiriki vya upendo, wala haiongezi ‘sana’ ambayo haipo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wale dada’ hurejelea dada wawili waliotajwa katika muktadha; ‘Basi’ huendeleza uhusiano wa οὖν na yaliyotangulia.
