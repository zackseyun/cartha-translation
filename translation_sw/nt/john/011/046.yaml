  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: sw
  text: Lakini baadhi yao wakaenda kwa Mafarisayo, wakawaambia yale aliyofanya Yesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawaarifu kuhusu yale aliyofanya Yesu.” Kigiriki hakisemi wazi nia ya wale waliokwenda kwa Mafarisayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Lakini baadhi yao
  rationale: “Baadhi yao” huonyesha kwa kawaida kwamba hawa walikuwa sehemu ya kundi lililotajwa awali, huku “Lakini” ikihifadhi utofautishaji unaoletwa na δέ katika muktadha.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: wakaenda kwa Mafarisayo
  rationale: “Wakaenda” ni simulizi la kawaida la Kiswahili linaloonyesha kuondoka kwao kwenda kwa watu waliolengwa; “kwa Mafarisayo” huonyesha mwendo kuelekea kwao.
- source_word: εἶπαν αὐτοῖς
  choice: na kuwaambia
  rationale: Kitenzi hiki katika muktadha wa kutoa habari kinaweza kutafsiriwa kwa kawaida kuwa “kuwaambia,” bila kuongeza nia ya uadui au shtaka.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: yale ambayo Yesu alikuwa amefanya
  rationale: “Yale ambayo” hurejelea matendo ya Yesu, na “alikuwa amefanya” huweka wazi kwamba matendo hayo yalitangulia taarifa yao.
theological_decisions:
- issue: Nia ya wale waliokwenda kwa Mafarisayo
  choice: 'Lugha isiyoegemea upande wowote: “kuwaambia”'
  alternative: Kuwashtakia Yesu au kumsaliti Yesu
  rationale: Kigiriki kinaeleza tu kwamba waliwaambia Mafarisayo yale Yesu aliyofanya; hakisemi wazi kwamba nia yao ilikuwa ya uadui. Tafsiri haiongezi nia ambayo mstari wenyewe hauitaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa heshima, na unaoeleweka kwa urahisi. Muundo wa “wakaenda” umechaguliwa kwa mtiririko wa kawaida wa masimulizi.
