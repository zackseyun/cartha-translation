base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: sw
  text: Baada ya kusema hayo, kisha akawaambia, “Lazaro, rafiki yetu, amelala[a], lakini ninakwenda kumwamsha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya kisitiari, “amekufa.” Hapa Yesu anatumia kulala kama sitiari ya kifo; wanafunzi wake hawaelewi maana hiyo mwanzoni katika mistari inayofuata.
    reason: Ufafanuzi wa maana ya kisitiari bila kuiondoa katika matini kuu.
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: Baada ya kusema hayo
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kwamba Yesu alimaliza kusema mambo yaliyotangulia kabla ya kuendelea; “hayo” pia huhifadhi rejeleo la wingi la ταῦτα bila kufanya sentensi kuwa nzito.
- source_word: λέγει αὐτοῖς
  choice: akawaambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi ni wa kawaida katika Kiswahili. “Akawaambia” huendeleza mfuatano wa matukio kwa ufasaha.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: Rafiki yetu Lazaro
  rationale: Huu ni mpangilio wa kawaida wa Kiswahili unaohifadhi msisitizo wa uhusiano wa kirafiki unaopatikana katika Kigiriki.
- source_word: κεκοίμηται
  choice: amelala
  rationale: Neno hili linahifadhi sitiari ya kulala inayotumiwa kumaanisha kifo katika muktadha huu. Pia linaacha kutokuelewa kwa wanafunzi katika mistari inayofuata kujitokeza kwa kawaida.
- source_word: ἀλλὰ πορεύομαι
  choice: lakini ninakwenda
  rationale: “Lakini” huonyesha utofautishaji, na “ninakwenda” huhifadhi tendo la sasa lenye kusudi bila kudokeza zaidi ya maandishi.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: kumwamsha
  rationale: Kitenzi-jina chenye kiambishi cha kusudi ni njia ya asili ya Kiswahili ya kuonyesha lengo linaloletwa na ἵνα, huku “kumwamsha” ikiendeleza sitiari ya usingizi.
theological_decisions:
- issue: Iwapo κεκοίμηται itafsiriwe moja kwa moja kuwa kifo au sitiari ya kulala ihifadhiwe
  choice: amelala
  alternative: amekufa
  rationale: Yesu anatumia sitiari ambayo wanafunzi wanaielewa vibaya katika mistari inayofuata. Kuihifadhi katika matini kuu hudumisha mvutano wa kisimulizi na maana ya kitheolojia bila kutoa ufafanuzi mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. Sitiari ya usingizi imehifadhiwa, na alama ya tanbihi imewekwa mara tu baada ya neno linalofafanuliwa.
