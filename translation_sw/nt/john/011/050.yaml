id: JHN.11.50
reference: John 11:50
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: sw
  text: Wala hamfikirii kwamba ni afadhali kwenu mtu mmoja afe kwa ajili ya watu[a], badala ya taifa lote kuangamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa niaba ya watu”; kirai hiki kinaweza pia kumaanisha “badala ya watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Wala hamfikirii
  rationale: “Wala” huendeleza kemeo la sentensi iliyotangulia na kuunganisha maana hasi kwa Kiswahili cha kawaida.
- source_word: λογίζεσθε
  choice: hamfikirii
  rationale: Kitenzi hiki hapa kinamaanisha kufikiri kwa makini au kuzingatia jambo katika mashauriano; “hamfikirii” ni cha asili na kinaeleweka.
- source_word: συμφέρει ὑμῖν
  choice: ni afadhali kwenu
  rationale: Kauli hii inaonyesha manufaa ya kiutendaji kwa wasemeshwa; “ni afadhali kwenu” huhifadhi maana ya faida inayolinganishwa na pia maslahi yao binafsi.
- source_word: ἵνα εἷς ἄνθρωπος ἀποθάνῃ
  choice: mtu mmoja afe
  rationale: Muundo huu wa Kiswahili huwasilisha kwa asili yaliyomo katika jambo linalodaiwa kuwa la manufaa, huku ukihifadhi msisitizo wa mtu mmoja.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: kwa ajili ya watu
  rationale: “Kwa ajili ya” ni pana vya kutosha kubeba maana ya kwa manufaa/niaba ya watu na mwangwi wa kufa badala yao bila kuamua maana moja pekee katika matini kuu.
- source_word: ὅλον τὸ ἔθνος
  choice: taifa lote
  rationale: Hapa ἔθνος ni jamii nzima ya kitaifa na kisiasa; “taifa lote” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἀπόληται
  choice: kuangamia
  rationale: Neno hili linaonyesha maangamizi au uharibifu mkubwa bila kubainisha namna yake; “kuangamia” huhifadhi uzito huo.
theological_decisions:
- issue: Maana ya ὑπὲρ kuhusiana na kifo cha Yesu
  choice: “kwa ajili ya watu” katika matini kuu
  alternative: “kwa niaba ya watu” au “badala ya watu”
  rationale: Kayafa anazungumzia manufaa ya kisiasa, lakini mwandishi baadaye anaonyesha maneno yake kuwa unabii asioukusudia. Tafsiri pana huhifadhi maana ya haraka pamoja na uwezekano wa maana ya uwakilishi au ubadala bila kulazimisha moja katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Badala ya taifa lote kuangamia” ni muundo wa asili unaoweka wazi ulinganisho wa matokeo bila kubadili hoja ya Kayafa.
