  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: sw
  text: Basi wanafunzi wakamwambia, “Bwana, ikiwa amelala[a], atapona[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa ukaribu zaidi na muundo wa Kigiriki, “ameingia usingizini.” Yesu alikuwa amesema kwa mfano kwamba Lazaro amekufa, lakini wanafunzi walidhani anazungumzia usingizi wa kawaida.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kigiriki kinaweza pia kutafsiriwa “ataokolewa,” lakini hapa kinamaanisha kurudia afya, yaani, “atapona” au “atapata nafuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha hitimisho la wanafunzi kutokana na maneno ya Yesu yaliyotangulia, kwa mtiririko wa kawaida wa masimulizi ya Kiswahili.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Nomino yenye kibainishi inarejelea wanafunzi wanaojulikana tayari katika muktadha; Kiswahili hakihitaji kuongeza ‘wake’.
- source_word: αὐτῷ
  choice: wakamwambia
  rationale: Kiambishi ‘-mw-’ katika kitenzi kinawakilisha ‘huyo/yeye’ na kuhifadhi rejeo la kiwakilishi kwa Yesu bila kuongeza jina lake.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya heshima ya κύριος na pia inadumisha uzito wa kikristolojia unaowezekana katika Injili ya Yohana.
- source_word: εἰ
  choice: ikiwa
  rationale: Inawasilisha sharti la moja kwa moja linalotokana na jinsi wanafunzi walivyoelewa maneno ya Yesu.
- source_word: κεκοίμηται
  choice: amelala
  rationale: Huwasilisha hali iliyotokana na kuingia usingizini na, katika kinywa cha wanafunzi, inaeleweka kuwa usingizi wa kawaida; maana ya mfano kuhusu kifo inaelezwa na muktadha unaofuata.
- source_word: σωθήσεται
  choice: atapona
  rationale: Katika muktadha wa ugonjwa, σῴζω inaweza kumaanisha kurudia afya. ‘Atapona’ ni Kiswahili cha kawaida na huepuka kuingiza hapa maana ya wokovu wa kiroho.
theological_decisions:
- issue: Tafsiri ya κύριος wanafunzi wanapomwambia Yesu moja kwa moja
  choice: Bwana
  alternative: Mheshimiwa; Mwalimu
  rationale: ‘Bwana’ huhifadhi maana ya heshima na uwezekano wa uzito wa kikristolojia bila kulazimisha mojawapo kuwa maana pekee.
- issue: 'Kudumisha maana mbili zinazowezekana za κεκοίμηται: usingizi au kifo'
  choice: Kutumia lugha ya usingizi wa kawaida katika matini kuu
  alternative: amepumzika
  rationale: Wanafunzi walidhani Yesu alimaanisha usingizi wa kawaida, ingawa Yesu alikuwa amesema kuhusu kifo cha Lazaro kwa lugha ya mfano. ‘Amelala’ hudumisha kutokuelewa huko ili mistari inayofuata ilifafanue.
- issue: Maana ya σωθήσεται katika muktadha wa ugonjwa
  choice: atapona
  alternative: ataokolewa
  rationale: Maana inayokusudiwa na wanafunzi ni kupona kutokana na ugonjwa. Tafsiri hii haiondoi maana pana ya kitenzi cha Kigiriki, ambayo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘wakamwambia’ ni wa kawaida katika masimulizi na unaunganisha kauli hii na yaliyotangulia. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
