  source_fidelity: 'Matini ya Kiswahili huwakilisha kwa uaminifu sentensi ya Kigiriki: οὖν ni “Basi,” οἱ μαθηταὶ αὐτῷ ni “wanafunzi wakamwambia,” Κύριε ni “Bwana,” na sharti εἰ κεκοίμηται σωθήσεται limetafsiriwa kwa maana inayokusudiwa katika muktadha wa ugonjwa: “ikiwa amelala, atapona.” “Amelala” hudumisha ufahamu wa wanafunzi wa usingizi wa kawaida, huku “atapona” huwakilisha σωθήσεται katika muktadha huu.'
  naturalness: Kiswahili ni sanifu, cha sasa, na cha kawaida katika masimulizi. “Basi wanafunzi wakamwambia” na “Bwana, ikiwa amelala, atapona” vina mtiririko wa asili na register inayofaa.
