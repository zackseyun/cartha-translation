base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: sw
  text: Basi Yesu alipomwona akilia, na Wayahudi[a] waliokuwa wamekuja pamoja naye wakilia, aliugua sana rohoni[b] na akataabika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wayudea.” Hapa neno hili linawahusu waombolezaji Wayahudi waliokuja pamoja na Maria, si Wayahudi wote kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi hiki kinaweza pia kumaanisha “alikasirika,” “alighadhibika,” au “alisisimka sana ndani.” Huonyesha msukosuko mkali wa ndani.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuonyesha uhusiano wake na yaliyotangulia bila kufanya hoja ya kimantiki kuwa nzito kupita kiasi.
- source_word: ὡς εἶδεν
  choice: alipomwona
  rationale: ὡς pamoja na kitenzi cha wakati uliopita ina maana ya wakati hapa; ‘alipomwona’ ni Kiswahili cha kawaida kinachohifadhi mfuatano wa tukio.
- source_word: κλαίουσαν / κλαίοντας
  choice: akilia / wakilia
  rationale: κλαίω humaanisha kulia kwa sauti. ‘Kulia’ ni neno la kawaida na lenye heshima, bila kulazimisha wazo mahususi la maombolezo ya kimila.
- source_word: συνελθόντας αὐτῇ
  choice: waliokuwa wamekuja pamoja naye
  rationale: Kauli hii inaonyesha wale waliokuja pamoja na Maria; tafsiri hii ni wazi na ya kawaida katika muktadha.
- source_word: Ἰουδαίους
  choice: Wayahudi
  rationale: Hili ndilo neno la moja kwa moja la Kiswahili. Katika muktadha huu linawahusu waombolezaji Wayahudi waliokuwa pamoja na Maria, si Wayahudi wote; tanbihi inazuia uelewa mpana usiokusudiwa.
- source_word: ἐνεβριμήσατο
  choice: aliguswa sana
  rationale: Kitenzi kinaonyesha msukosuko mkali wa ndani na kinaweza pia kudokeza ghadhabu au kukasirika. ‘Aliguswa sana’ huhifadhi uzito wa hisia bila kuamua chanzo au aina yake; uwezekano mkali zaidi umeelezwa katika tanbihi.
- source_word: τῷ πνεύματι
  choice: rohoni
  rationale: Hapa hali ya ndani ndiyo eneo la msukosuko huo. ‘Rohoni’ ni fupi, ya kawaida, na inahifadhi lugha ya chanzo.
- source_word: ἐτάραξεν ἑαυτόν
  choice: akajifadhaisha mwenyewe
  rationale: Kauli ya Kigiriki ni rejeshi waziwazi. Tafsiri hii inaihifadhi badala ya kuigeuza tu kuwa ‘akafadhaika,’ ingawa umbo hilo lina uzito wa kimtindo katika Kiswahili.
theological_decisions:
- issue: Maelezo ya hisia za Yesu katika ἐνεβριμήσατο
  choice: Kutumia ‘aliguswa sana’ ili kuonyesha hisia kali bila kuamua ikiwa hasa ni huzuni, ghadhabu, au msukosuko mwingine wa ndani.
  alternative: ‘alikasirika,’ ‘alighadhibika,’ au ‘alifadhaika sana’
  rationale: Kitenzi kina nguvu kuliko kuguswa kihisia kwa kawaida, lakini maana yake mahususi katika muktadha huu inajadiliwa. Tafsiri kuu haipaswi kutatua mvutano huo wa kifasiri kuliko Kigiriki chenyewe.
- issue: Kauli rejeshi katika ἐτάραξεν ἑαυτόν
  choice: Kuhifadhi urejeshi kwa ‘akajifadhaisha mwenyewe.’
  alternative: ‘akafadhaika’
  rationale: Chanzo kinasema kwa uwazi kwamba Yesu alijifadhaisha mwenyewe. Kuhifadhi umbo hilo kunazuia kufuta namna ya pekee ambayo tendo hilo limeelezwa, bila kueleza kwa nini alifanya hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata kwa karibu mfuatano wa Kigiriki huku ikibaki wazi kwa msomaji wa kawaida. ‘Akajifadhaisha mwenyewe’ ni kauli yenye uzito kidogo kimtindo, iliyochaguliwa kwa makusudi ili kuhifadhi urejeshi wa Kigiriki.
