base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: sw
  text: Yesu akasema, “Liondoeni jiwe.” Martha, dada ya yule aliyekuwa amekufa[a], akamwambia, “Bwana, kufikia sasa ananuka[b], kwa maana ni siku ya nne tangu afe[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule aliyekufa.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kigiriki humaanisha “kutoa harufu”; hapa muktadha unaonyesha harufu mbaya.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi zaidi, “kwa maana yeye ni wa siku ya nne,” yaani, ilikuwa siku ya nne tangu afe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: Liondoeni
  rationale: Kitenzi hiki ni agizo la wingi kwa watu waliokuwapo waondoe jiwe. “Liondoeni” ni Kiswahili cha kawaida na kinafaa kwa jiwe lililofunika kaburi.
- source_word: τὸν λίθον
  choice: jiwe
  rationale: Katika muktadha wa kaburi, λίθος ni jiwe lililowekwa kwenye mwingilio; “jiwe” ni tafsiri ya kawaida na iliyo wazi.
- source_word: τοῦ τετελευτηκότος
  choice: yule aliyekuwa amekufa
  rationale: Kauli hii humtaja mtu aliyekufa na ambaye hali yake ya kifo inaendelea. Tafsiri hii ni ya asili katika Kiswahili na inaepuka neno rasmi zaidi “marehemu” katika simulizi hili.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi uzito wa κύριος katika Injili ya Yohana na pia inafaa kama namna ya Martha kumwambia Yesu kwa heshima.
- source_word: ἤδη
  choice: kufikia sasa
  rationale: Kauli hii huonyesha kwamba hali hiyo ilikuwapo tayari wakati huo; “kufikia sasa” huwasilisha maana hiyo ya wakati kwa kawaida.
- source_word: ὄζει
  choice: ananuka
  rationale: Kitenzi humaanisha kutoa harufu, na muktadha wa kifo unaonyesha harufu mbaya. “Ananuka” ni wazi, fupi, na ya kawaida bila kubadili mhusika wa sentensi.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: kwa maana leo ni siku ya nne tangu afe
  rationale: Kivumishi τεταρταῖος humaanisha kuwa katika siku ya nne. Tafsiri hii ni ya kawaida katika Kiswahili na haidai kwamba siku nne kamili zimekwisha.
theological_decisions:
- issue: Namna ya kutafsiri κύριος katika maneno ya Martha kwa Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi uzito unaoweza kuwa zaidi ya heshima ya kijamii katika matumizi ya Yohana, bila kulazimisha mstari huu pekee kuwa tamko kamili la kiimani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wa heshima, na unaoeleweka kwa wasomaji wa leo. “Liondoeni” linaonyesha kwamba Yesu aliwaagiza watu zaidi ya mmoja. “Leo ni siku ya nne tangu afe” huhifadhi kwa usahihi wazo la Kigiriki la kuwa katika siku ya nne.
