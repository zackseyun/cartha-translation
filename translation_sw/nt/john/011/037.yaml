  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: sw
  text: Lakini baadhi yao wakasema, “Je, huyu aliyefumbua macho ya yule kipofu hangeweza pia kumzuia huyu mtu asife?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Lakini baadhi yao
  rationale: ‘Baadhi yao’ huwasilisha kwa kawaida maana ya ‘wengine miongoni mwao,’ huku ‘lakini’ ikiendeleza utofautishaji wa δέ na mwitikio uliotangulia.
- source_word: εἶπαν
  choice: wakasema
  rationale: Aoristi katika simulizi imetafsiriwa kwa wakati uliopita wa mfululizo, ambao ni wa kawaida katika masimulizi ya Kiswahili.
- source_word: Οὐκ ἐδύνατο
  choice: Je, ... hangeweza
  rationale: Muundo huu unahifadhi swali la balagha linalodokeza kuwa, kwa maoni ya wasemaji, alikuwa na uwezo wa kufanya hivyo.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: huyu aliyemfumbua macho yule kipofu
  rationale: ‘Huyu’ huhifadhi nguvu ya kiashiria kinachomwelekezea Yesu; ‘aliyemfumbua macho’ ni usemi wa kawaida wa Kiswahili kwa kurejesha uwezo wa kuona. ‘Yule kipofu’ humrejelea mtu maalumu wa Yohana 9.
- source_word: ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ
  choice: pia kumzuia huyu mtu asife
  rationale: Katika muktadha huu, muundo wa kusababisha matokeo unaelezwa kwa Kiswahili cha kawaida kama ‘kumzuia ... asife.’ ‘Pia’ huhifadhi καί, na ‘huyu mtu’ humtambulisha Lazaro tofauti na Yesu.
theological_decisions:
- issue: Toni ya swali la wasemaji
  choice: Swali la balagha lenye dokezo la lawama kuhusu uwezo wa Yesu wa kuzuia kifo cha Lazaro
  alternative: Swali la kawaida lisiloonyesha mashaka au lawama
  rationale: Οὐκ ἐδύνατο katika swali hili hudokeza matarajio kwamba Yesu angeweza kutenda. Tafsiri inahifadhi mvutano huo bila kuongeza shtaka lisilosemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kumzuia ... asife’ ni wa asili zaidi kuliko tafsiri ya neno kwa neno kama ‘kufanya ili ... asife,’ huku ukihifadhi maana ya kisababishi ya ποιῆσαι ἵνα. Hakuna tanbihi iliyohitajika kwa kuwa mbadala wa Kiingereza unalingana na uwasilishaji mkuu wa Kiswahili.
