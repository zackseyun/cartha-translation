id: JHN.2.25
reference: John 2:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: sw
  text: wala hakuhitaji mtu yeyote atoe ushahidi kuhusu mwanadamu[a], kwa maana yeye mwenyewe alijua kilichokuwa ndani ya mwanadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuhusu mtu”; vivyo hivyo, “kilichokuwa ndani ya mtu.” Neno la Kigiriki liko katika umoja lakini limetumiwa kwa maana ya jumla kumaanisha binadamu au wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: hakuhitaji
  rationale: Muundo wa Kigiriki una maana ya ‘kuwa na haja/hitaji.’ ‘Hakuhitaji’ ni Kiswahili cha kawaida na huwasilisha maana hiyo kwa uwazi.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: mtu yeyote atoe ushahidi
  rationale: μαρτυρέω humaanisha kutoa ushahidi au kushuhudia. ‘Atoe ushahidi’ huhifadhi dhana ya ushuhuda, na τις katika muktadha hasi imewasilishwa kwa ‘mtu yeyote.’
- source_word: περὶ τοῦ ἀνθρώπου
  choice: kuhusu mwanadamu
  rationale: ἄνθρωπος iko katika umoja lakini imetumiwa kwa maana ya jumla. ‘Mwanadamu’ huhifadhi umoja wa kiwakilishi na inaweza kumaanisha binadamu kwa jumla bila kuifanya iwe mtu mmoja maalumu.
- source_word: αὐτὸς γὰρ
  choice: kwa maana yeye mwenyewe
  rationale: ‘Yeye mwenyewe’ huhifadhi msisitizo wa αὐτός, huku ‘kwa maana’ ikionyesha kwamba kifungu hiki kinaeleza sababu.
- source_word: ἐγίνωσκεν
  choice: alijua
  rationale: Ingawa njeo isiyotimilika inaweza kuonyesha hali ya kudumu au inayoendelea, kitenzi cha hali ‘alijua’ ni cha asili katika Kiswahili na muktadha unaonyesha maarifa yake yasiyotegemea ushahidi wa wengine.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: kilichokuwa ndani ya mwanadamu
  rationale: Tafsiri hii huhifadhi upana wa usemi kuhusu hali ya ndani ya mwanadamu na kurudia neno lilelile kama katika kifungu cha awali.
theological_decisions:
- issue: Upeo wa maarifa ya Yesu kuhusu mwanadamu
  choice: Kauli imetafsiriwa moja kwa moja kuwa Yesu alijua kilichokuwa ndani ya mwanadamu.
  alternative: Alijua yaliyokuwa ndani ya kila mtu mmoja mmoja; au alijua asili ya wanadamu kwa jumla.
  rationale: Umoja wa ἀνθρώπου/ἀνθρώπῳ unaweza kuwa wa kiwakilishi na kuhusisha mtu mmoja mmoja pamoja na wanadamu kwa jumla. Tafsiri haibani maana kwa upande mmoja wala kuongeza ufafanuzi wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiunganishi ‘wala’ kinaendeleza muundo wa sentensi kutoka mstari uliotangulia. ‘Mwanadamu’ kimetumiwa kwa maana ya jumla na kurudiwa ili kuhifadhi mwangwi wa Kigiriki.
