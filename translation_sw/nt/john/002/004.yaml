  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: sw
  text: Yesu akamwambia, “Inatuhusu nini mimi na wewe?[a] Mwanamke,[b] saa yangu bado haijafika.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Ni nini kwangu na kwako?” Huu ni msemo unaoonyesha umbali wa mahangaiko, si lazima uadui.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linamaanisha kihalisi “mwanamke.” Katika mazingira hayo lilikuwa namna ya kawaida na yenye heshima ya kumwita mwanamke, ingawa linaweza kusikika kali katika Kiswahili cha leo.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kisimulizi, Kiswahili cha masimulizi hutumia kwa kawaida mfululizo wa wakati uliopita; “akamwambia” linaendeleza simulizi kwa ufasaha.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Jambo hilo linatuhusu nini, mimi na wewe?
  rationale: Huu ni msemo unaoweka umbali au tofauti ya mahangaiko, si lazima uadui. Tafsiri hii ni ya kawaida katika Kiswahili na haifanyi kauli iwe kali kuliko Kigiriki.
- source_word: γύναι
  choice: Mama
  rationale: Nomino hii humaanisha kihalisi “mwanamke,” lakini hapa ni neno la heshima la kumwita mwanamke mzima. “Mama” hutekeleza kazi hiyo kwa kawaida katika Kiswahili cha Afrika Mashariki bila kuongeza upole wa hisia usioelezwa wazi.
- source_word: οὔπω
  choice: bado ... haija-
  rationale: Muundo huu unaonyesha kwamba wakati unaotajwa haujafika kufikia sasa, sawa na maana ya “not yet.”
- source_word: ἥκει
  choice: haijafika
  rationale: Kitenzi kinaonyesha kufika au kuwapo; “kufika” huambatana kwa kawaida na “saa” katika Kiswahili.
- source_word: ἡ ὥρα μου
  choice: saa yangu
  rationale: “Saa” inadumisha taswira na dhamira ya Yohane ya wakati maalumu uliowekwa kwa Yesu, badala ya kuifanya kuwa “wakati” wa jumla.
theological_decisions:
- issue: Toni na nguvu ya maneno ya Yesu kwa mama yake
  choice: Jibu la heshima linaloweka umbali, si tusi
  alternative: Kemeo kali; au maneno ya upendo wa wazi
  rationale: Msemo Τί ἐμοὶ καὶ σοί unaweka umbali wa kimahusiano au wa jambo linalozungumziwa, huku γύναι likiweze kuwa neno la kawaida la heshima. Tafsiri inadumisha mvutano huo bila kuingiza ukali au hisia za upendo zisizo wazi katika matini.
- issue: Maana ya “saa yangu” katika teolojia ya Yohane
  choice: Saa ya Yesu iliyowekwa, yenye mwangwi mpana katika ujumbe wake
  alternative: Wakati wa kufanya ishara hii pekee; au muda wa kawaida usio na uzito wa kidhamira
  rationale: Katika Yohane, “saa” mara nyingi huhusishwa na utume na kutukuzwa kwa Yesu. Maneno halisi “saa yangu” yamehifadhiwa ili mwangwi huo ubaki bila kufafanuliwa kupita kiasi katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mama” limetumiwa kama namna ya kawaida ya heshima ya kumwita mwanamke mzima; tanbihi inalinda maana halisi ya γύναι. Muundo wa swali unaweka umbali unaodokezwa na msemo wa Kigiriki bila kuufanya kuwa ugomvi wa wazi.
