  naturalness: “Inatuhusu nini mimi na wewe?” is clear, current Standard East African Swahili and conveys a question of respective concern. “Mwanamke” is marked in contemporary Swahili and can sound abrupt, but it is the direct equivalent required here; the cultural footnote appropriately explains the ancient pragmatic force.
  terminology: Retain “saa yangu” for ἡ ὥρα μου. Render γύναι as “mwanamke,” not “Mama,” and retain a tone note rather than resolving the address as either harsh or affectionate.
