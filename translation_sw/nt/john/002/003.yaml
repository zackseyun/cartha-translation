  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: sw
  text: Divai ilipokwisha[a], mama yake Yesu anamwambia[b], “Hawana divai.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “divai ilipokuwa imepungua.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinatumia wakati uliopo wa kihistoria, “anamwambia.” Baadhi ya tafsiri hutumia wakati uliopita, “alimwambia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: Divai ilipokwisha
  rationale: 'Muundo huu wa Kiswahili unaeleza kwa kawaida hali iliyotokea kabla ya kauli kuu: divai iliisha. Unahifadhi maana ya upungufu bila kufuata muundo wa Kigiriki kwa namna isiyo ya kawaida katika Kiswahili.'
- source_word: λέγει
  choice: anamwambia
  rationale: Wakati uliopo unahifadhi wakati uliopo wa kihistoria wa simulizi la Yohana. Kiambishi cha yambwa -mw- pia kinawakilisha πρὸς αὐτόν kwa njia ya kawaida katika Kiswahili.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: mama yake Yesu
  rationale: Hii ni njia ya kawaida na yenye heshima ya kumtaja mama wa Yesu, huku ikihifadhi namna ya Yohana ya kutomtaja kwa jina katika muktadha huu.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Hawana divai
  rationale: Kauli hii ni ya moja kwa moja na ya kawaida katika Kiswahili. Inaacha rejeo la kiima cha wingi bila kulitaja wazi, kama lilivyo katika Kigiriki.
- source_word: οἶνος
  choice: divai
  rationale: Divai ndiyo maana ya kawaida ya neno hili katika muktadha huu; hakuna msingi wa kulilegeza au kulifafanua kwa neno jingine.
theological_decisions:
- issue: Wakati uliopo wa kihistoria katika simulizi la Yohana
  choice: Kuhifadhi wakati uliopo kwa “anamwambia”
  alternative: Kutumia wakati uliopita, “alimwambia”
  rationale: Uamuzi huu unahifadhi uhai na muundo wa kisanaa wa simulizi la Kigiriki bila kuleta maana ya kimafundisho ambayo haipo katika matini.
- issue: Rejeo la kiima cha wingi katika “Hawana divai”
  choice: Kuacha kiima kikiwa hakijatajwa wazi
  alternative: Kukitaja kuwa wenye sherehe, waandalizi, au watu wa arusi
  rationale: Kigiriki hakisemi wazi ni nani wasio na divai. “Hawana” huhifadhi utata huo badala ya kuongeza maelezo yasiyotajwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, yenye heshima na inayofaa kusomwa kwa sauti. “Mama yake Yesu” na “Hawana divai” ni miundo ya kawaida kwa wasomaji wa jumla.
