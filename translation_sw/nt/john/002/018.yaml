base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: sw
  text: Basi Wayahudi[a] wakamjibu, wakamwambia, “Unatuonyesha ishara gani kwamba unafanya mambo haya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viongozi wa Wayahudi” au “Wayudea.” Katika Injili ya Yohana, “Wayahudi” wakati mwingine humaanisha kundi fulani la wawakilishi, hasa viongozi wa Kiyahudi huko Yudea, kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: Basi ... wakamjibu
  rationale: “Basi” linaonyesha mwendelezo na matokeo ya tendo la Yesu lililotangulia; “wakamjibu” ni simulizi la kawaida la mwitikio wa maneno.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Huhifadhi usemi wa Kigiriki bila kuufanya moja kwa moja kuwa “viongozi wa Wayahudi,” huku tanbihi ikieleza uwezekano wa maana finyu katika muktadha wa Yohana.
- source_word: καὶ εἶπαν αὐτῷ
  choice: wakamwambia
  rationale: Ni tafsiri ya kawaida na ya asili ya utangulizi wa usemi wa moja kwa moja; ingawa inaingiliana kimaana na “wakamjibu,” inahifadhi muundo wa chanzo.
- source_word: Τί σημεῖον
  choice: ishara gani
  rationale: “Ishara” huhifadhi istilahi muhimu ya Yohana ya tendo linalothibitisha na kuelekeza kwenye maana iliyo zaidi ya tendo lenyewe.
- source_word: δεικνύεις ἡμῖν
  choice: unatuonyesha
  rationale: Huwakilisha kitenzi cha wakati uliopo na yambwa “sisi” kwa Kiswahili cha kawaida.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: kuthibitisha kuwa una mamlaka ya kufanya mambo haya
  rationale: Katika muktadha, ombi la ishara linahusu uthibitisho wa haki au mamlaka ya Yesu kufanya matendo hayo. Tafsiri hii huwasilisha uhusiano wa hoja kwa Kiswahili cha asili bila kuifanya ὅτι kuwa ya wakati.
theological_decisions:
- issue: Rejeo la οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Kuhifadhi “Wayahudi” katika matini kuu na kuweka tanbihi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Matini ya Kigiriki haisemi wazi “viongozi,” ingawa muktadha unaweza kulenga kundi wakilishi au wenye mamlaka. Tanbihi huhifadhi upeo huo bila kuwalaumu Wayahudi wote kwa ujumla.
- issue: Kile ambacho ishara inatakiwa kuthibitisha
  choice: Mamlaka ya Yesu kufanya mambo haya
  alternative: “kwa kuwa unafanya mambo haya” au “kwamba unafanya mambo haya”
  rationale: Swali linafuata kitendo chake hekaluni na linadai uthibitisho wa haki yake ya kutenda hivyo. “Mamlaka” ni maana inayodokezwa na muktadha, si neno lililotajwa moja kwa moja katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa asili kwa msomaji wa kawaida, huku istilahi ya Kiyohana “ishara” ikihifadhiwa.
