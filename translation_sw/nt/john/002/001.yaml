id: JHN.2.1
reference: John 2:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: sw
  text: Na siku ya tatu, kulikuwa na arusi[a] huko Kana ya Galilaya, na mama yake Yesu alikuwa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sherehe ya arusi.” Neno la Kigiriki linaweza kutaja tukio la kufunga ndoa au sherehe yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Na
  rationale: Kiunganishi hiki kimehifadhiwa ili kuendeleza mtiririko wa simulizi bila kuongeza maana ya kifafanuzi.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: siku ya tatu
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kielezi cha wakati, huku ikihifadhi rejeo lake mahususi katika mfululizo wa simulizi.
- source_word: γάμος
  choice: arusi
  rationale: Neno hili linaweza kumaanisha ndoa au sherehe ya arusi; “arusi” ni pana, ya kawaida, na inafaa katika muktadha huu.
- source_word: ἐγένετο
  choice: kulikuwa na
  rationale: Katika kifungu hiki kitenzi kinatambulisha tukio; muundo huu ni wa asili katika Kiswahili pamoja na “arusi” na unadumisha usahili wa simulizi.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: huko Kana ya Galilaya
  rationale: “Huko” huonyesha mahali kwa namna ya asili, nayo “Kana ya Galilaya” inafuata uhusiano wa Kigiriki unaoitofautisha Kana hii kwa eneo lake.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: mama yake Yesu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi wazi uhusiano wa kimilikishi wa maandishi ya Kigiriki.
- source_word: ἐκεῖ
  choice: huko
  rationale: Kielezi cha mahali kimetafsiriwa moja kwa moja bila kuongeza wazo la “kuhudhuria” ambalo halijasemwa wazi.
theological_decisions:
- issue: Maana ya “siku ya tatu” katika simulizi
  choice: Imehifadhiwa kama taarifa ya wakati bila kuingiza ishara ya ufufuo katika tafsiri.
  alternative: Kuitafsiri kwa maneno yanayoonyesha moja kwa moja dokezo la ufufuo.
  rationale: Ingawa wasomaji wanaweza kuona maana ya kiishara katika Injili ya Yohana, katika mstari huu maneno yenyewe yanatoa taarifa ya wakati. Tafsiri inahifadhi uwezekano wa usomaji mpana bila kuufanya kuwa maelezo ya lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Tanbihi ya Kiingereza [b] haikuhamishwa kwa kuwa haionyeshi tofauti halisi ya maandishi ya Kigiriki wala tafsiri mbadala yenye maana.
