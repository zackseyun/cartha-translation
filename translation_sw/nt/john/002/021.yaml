  text: Lakini yeye alikuwa akisema kuhusu hekalu la mwili wake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali patakatifu pa mwili wake.” Neno la Kigiriki hapa ni naos, ambalo mara nyingi humaanisha hasa sehemu takatifu ya ndani ya hekalu, badala ya eneo lote la hekalu.
