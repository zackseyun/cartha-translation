lexical_decisions:
- source_word: ἐκεῖνος
  choice: yeye
  rationale: Katika muktadha, kiwakilishi hiki kinamrejelea Yesu. “Yeye” ni cha kawaida katika Kiswahili na kinadumisha msisitizo wa kulinganisha uliopo katika sentensi.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ndogo kati ya kutokuelewa kwao katika mstari uliotangulia na maelezo ya Yohana hapa.
- source_word: ἔλεγεν
  choice: alikuwa akizungumza
  rationale: Muundo huu unaonyesha tendo la wakati uliopita lenye hali ya kuendelea au ya maelezo, bila kutumia tafsiri ya kufasiri zaidi kama “alimaanisha.”
- source_word: περὶ
  choice: kuhusu
  rationale: Hii ni tafsiri ya kawaida na wazi ya περί pamoja na nomino katika hali ya umilikishi.
- source_word: ναοῦ
  choice: hekalu
  rationale: “Hekalu” ni neno linaloeleweka kwa urahisi, huku maana mahususi zaidi ya ναός kama sehemu takatifu ya ndani ikihifadhiwa katika tanbihi.
- source_word: σώματος
  choice: mwili
  rationale: Neno hili linatafsiri moja kwa moja σῶμα na kuhifadhi taswira muhimu ya mwili wa Yesu kuwa hekalu.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi hiki kinaonyesha wazi kwamba unaozungumziwa ni mwili wa Yesu mwenyewe.
theological_decisions:
- issue: Utambulisho wa kisitiari wa mwili wa Yesu na hekalu
  choice: Kuhifadhi moja kwa moja usemi “hekalu la mwili wake.”
  alternative: “mwili wake kuwa hekalu” au “mahali patakatifu pa mwili wake”
  rationale: Muundo wa chanzo unadumisha sitiari bila kuipanua kwa maelezo ya kimafundisho. Tafsiri hii pia haiondoi mvutano wa usemi “hekalu la mwili wake.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo “alikuwa akizungumza” umechaguliwa kuhifadhi hali ya kitenzi cha Kigiriki, na “hekalu la mwili wake” kuhifadhi sitiari ya chanzo.
