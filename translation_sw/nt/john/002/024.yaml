  text: Lakini Yesu mwenyewe hakuwa akijikabidhi kwao[a], kwa sababu aliwajua watu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kinatumia kitenzi kilekile kama katika mstari uliotangulia: wengi “waliamini katika jina lake,” lakini Yesu “hakuwa akijikabidhi” kwao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Lakini Yesu mwenyewe
  rationale: Neno αὐτός limetiliwa mkazo na linaonyesha tofauti kati ya Yesu na wale waliomwamini katika mstari uliotangulia; δέ hapa inaonyesha ugeuko wa kinyume, hivyo limetafsiriwa “Lakini.”
- source_word: οὐκ ἐπίστευεν αὑτὸν αὐτοῖς
  choice: hakujikabidhi kwao
  rationale: Kitenzi πιστεύω kikiwa na kiwakilishi cha kujirejelea na yambwa ya udativu humaanisha kujikabidhi au kujiweka mikononi mwa wengine. “Hakujikabidhi kwao” ni Kiswahili cha asili kinachowasilisha maana hiyo, ingawa marudio ya kitenzi kilekile cha “kuamini” katika mstari wa 23 hayawezi kuhifadhiwa kikamilifu.
- source_word: διὰ τὸ αὐτὸν γινώσκειν
  choice: kwa sababu aliwajua
  rationale: διά pamoja na infinitivu yenye kibainishi inaonyesha sababu. Kiswahili cha kawaida hutumia kishazi kamili “kwa sababu aliwajua.”
- source_word: πάντας
  choice: watu wote
  rationale: Wingi wa kiume hapa unawahusu wanadamu kwa ujumla. “Watu wote” ni wazi, wa asili, na haubani maana kwa kundi fulani.
theological_decisions:
- issue: Uhusiano wa πιστεύω katika mistari ya 23–24
  choice: Kutumia “waliamini” katika muktadha wa mstari wa 23, lakini “hakujikabidhi” katika mstari wa 24, na kueleza uhusiano huo katika tanbihi.
  alternative: Kutumia kitenzi “kuamini” katika mistari yote miwili kwa namna ya moja kwa moja zaidi.
  rationale: 'Kigiriki kinatumia kitenzi kilekile kwa mchezo wa kimakusudi wa maneno: wengi walimwamini Yesu, lakini Yesu hakujikabidhi kwao. Kiswahili hakiwezi kuhifadhi kwa kawaida maana ya nahau na marudio ya kileksia kwa wakati mmoja.'
- issue: Upeo wa πάντας
  choice: “watu wote,” bila kuibana kwa kundi maalumu.
  alternative: “wote” au “kila mtu.”
  rationale: Muktadha unaonyesha ujuzi wa Yesu kuhusu wanadamu kwa ujumla, bila kuongeza dai la kitheolojia lililo pana kuliko maneno ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Kujikabidhi kwao” huhifadhi wazo la kujitoa au kujiweka mikononi mwao bila kuingiza ufafanuzi wa kimadhehebu.
