  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: sw
  text: Mama yake aliwaambia wahudumu, “Lolote atakalowaambia, lifanyeni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: Mama yake
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachowasilisha kwa ufasaha uhusiano wa umilikaji katika Kigiriki.
- source_word: διακόνοις
  choice: wahudumu
  rationale: Katika muktadha wa karamu ya harusi, neno hili linawahusu watu waliokuwa wakihudumia wageni; halimaanishi cheo cha kanisa. “Wahudumu” ni sahihi kuliko “mashemasi,” na linafaa zaidi katika muktadha huu.
- source_word: Ὅ τι ἂν
  choice: Lolote
  rationale: 'Linawasilisha uhusiano usio na kikomo wa ὅ τι pamoja na ἄν: jambo lolote atakalosema.'
- source_word: λέγῃ ὑμῖν
  choice: atakalowaambia
  rationale: Muundo huu wa wakati ujao wa Kiswahili unaeleza kwa kawaida maana ya uwezekano wa baadaye katika subjunktivu ya Kigiriki baada ya ἄν.
- source_word: ποιήσατε
  choice: lifanyeni
  rationale: Amri ya wingi inaelekezwa kwa wahudumu, na kiambishi “li-” kinarejelea kwa kawaida “lolote” alilowaambia.
theological_decisions:
- issue: Mhusika asiyeelezwa wazi katika λέγῃ (“atakayewaambia”)
  choice: Kitenzi “atakalowaambia” kinaacha kiwakilishi cha nafsi ndani ya muundo wa kitenzi, kikimrejelea Yesu kwa muktadha.
  alternative: “Lolote Yesu atakalowaambia, lifanyeni.”
  rationale: Kigiriki hakitaji jina la Yesu hapa, ingawa muktadha unaonyesha wazi kuwa ndiye anayerejelewa. Kutotaja jina kunahifadhi ufupi wa matini bila kupoteza uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, wazi na chenye hadhi. “Mama yake” ni cha kawaida zaidi kuliko “mama yake yeye”; “wahudumu” kinaepuka maana ya cheo maalumu cha kanisa. Hakuna tanbihi iliyohitajika, kwa kuwa maana ya ujenzi wa Kigiriki inaweza kuwasilishwa kwa kawaida katika matini kuu.
