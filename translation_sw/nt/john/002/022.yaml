  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: sw
  text: Basi, alipofufuliwa kutoka kwa wafu,[a] wanafunzi wake walikumbuka kwamba alikuwa akisema jambo hilo,[b] nao wakaamini Andiko na kauli aliyoisema Yesu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipofufuka kutoka kwa wafu.” Kitenzi cha Kigiriki kiko katika kauli tendwa (“alipofufuliwa”), ambayo imehifadhiwa katika matini.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwamba alikuwa amesema jambo hilo” au “kwamba alisema jambo hilo.” Kitenzi cha Kigiriki kiko katika hali isiyotimilifu na kinaweza kuonyesha usemi uliokuwa ukiendelea au uliorudiwa.
    reason: lexical_alternative
  - marker: c
    text: Au, “neno alilosema Yesu.” Neno la Kigiriki linaweza kumaanisha neno, kauli, au ujumbe uliotamkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Basi, alipo-
  rationale: Muundo huu unaunganisha mwendelezo wa simulizi unaoonyeshwa na οὖν na wakati unaoletwa na ὅτε kwa Kiswahili cha kawaida.
- source_word: ἠγέρθη
  choice: alifufuliwa
  rationale: Kauli tendwa ya Kigiriki imehifadhiwa; katika muktadha wa kifo, kufufuliwa hutoa maana ya kuinuliwa kutoka mautini bila kuibadili kuwa kauli tendaji.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Huhifadhi wingi wa Kigiriki na ni usemi wa Kiswahili unaoeleweka katika muktadha wa ufufuo.
- source_word: ἐμνήσθησαν
  choice: walikumbuka
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kurejea akilini kwa jambo la awali.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Ni muundo wa kawaida wa Kiswahili unaohifadhi umilikaji.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: kwamba alikuwa amesema jambo hilo
  rationale: Hurejesha usemi wa Yesu uliotangulia kwa Kiswahili cha asili. Ingawa ἔλεγεν ni wakati usiotimilifu, katika muktadha huu si lazima idokeze kusema mara kwa mara; uwezekano huo umewekwa katika tanbihi.
- source_word: ἐπίστευσαν
  choice: wakaiamini
  rationale: Kitenzi 'amini' kinafaa kwa vipokezi vya sentensi hii bila kuongeza dhana ya kutumaini au kujikabidhi isiyotajwa wazi. Kiambishi cha umoja kinafuata kirai cha kwanza, 'Maandiko', huku vitu viwili vikibaki wazi katika sentensi.
- source_word: τῇ γραφῇ
  choice: Maandiko
  rationale: Katika Kiswahili, 'Maandiko' ni jina lililozoeleka la maandishi matakatifu; umoja wa Kigiriki unaweza kurejelea andiko maalumu au Maandiko kama mamlaka.
- source_word: τῷ λόγῳ
  choice: kauli
  rationale: Hapa λόγος inarejelea jambo maalumu ambalo Yesu alisema. 'Kauli' ni wazi na ya asili kuliko 'neno' katika muktadha huu, bila kulichanganya moja kwa moja na matumizi mengine ya θεολογική ya λόγος katika Yohana.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: ambayo Yesu alikuwa amesema
  rationale: Kishazi hiki kinarekebisha 'kauli' na kinaonyesha kuwa usemi wa Yesu ulitangulia kukumbuka kwa wanafunzi.
theological_decisions:
- issue: Kauli ya kitenzi cha ufufuo
  choice: alifufuliwa kutoka kwa wafu
  alternative: alifufuka kutoka kwa wafu
  rationale: Kigiriki kina kauli tendwa. Kuihifadhi huepuka kuondoa kwa tafsiri namna ambayo mstari wenyewe unaieleza tukio, bila kukanusha misemo mingine ya kibiblia kuhusu Yesu kufufuka.
- issue: Maana ya kuamini pamoja na vipokezi vya dative
  choice: wakaiamini Maandiko na kauli
  alternative: wakayatumainia Maandiko na kauli
  rationale: '''Amini'' ndiyo tafsiri isiyoongeza ufafanuzi wa kimadhehebu; inaacha wazi uhusiano wa imani ya wanafunzi na ushuhuda wa Maandiko pamoja na usemi wa Yesu.'
- issue: Umoja wa γραφή
  choice: Maandiko
  alternative: Andiko
  rationale: Kiswahili kwa kawaida hutumia 'Maandiko' kama jina la maandishi matakatifu. Hata hivyo, umoja wa chanzo unaweza kueleweka kama andiko maalumu, jambo linalobaki kuwa uwezekano wa kimuktadha bila kulazimishwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Basi' huhifadhi mwendelezo wa simulizi; 'alipofufuliwa' huhifadhi kauli tendwa; na 'kauli' huepuka utata usio wa lazima huku tanbihi ikihifadhi chaguo la 'neno'.
