  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: sw
  text: Baada ya hayo, Yesu akashuka kwenda Kapernaumu pamoja na mama yake, ndugu zake[a] na wanafunzi wake; nao wakakaa huko siku chache tu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaka zake” au “jamaa zake.” Neno la Kigiriki linaweza kumaanisha kaka kwa maana finyu au, katika baadhi ya mazingira, watu wenye uhusiano mpana zaidi wa kifamilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha kawaida cha wakati na kinadumisha rejeo la jambo lililotangulia kwa Kiswahili cha asili.
- source_word: κατέβη
  choice: akashuka kwenda
  rationale: Kinahifadhi maana ya mwendo wa kushuka kuelekea Kapernaumu huku kikisomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: εἰς Καφαρναοὺμ
  choice: kwenda Kapernaumu
  rationale: Muundo huu unaonyesha mahali pa kwenda kwa Kiswahili sanifu; jina la mahali limetoholewa kwa tahajia iliyozoeleka.
- source_word: αὐτὸς
  choice: Yesu
  rationale: Kiswahili huhitaji rejeo lililo wazi hapa; kurudia jina la Yesu huondoa utata bila kuongeza msisitizo wa neno 'mwenyewe' usiokusudiwa.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: mama yake
  rationale: Inafuata chanzo bila kuongeza jina Maria, ambalo halimo katika mstari huu.
- source_word: οἱ ἀδελφοὶ
  choice: ndugu zake
  rationale: Neno 'ndugu' ni la kawaida kwa kaka au ndugu wa ukoo katika Kiswahili na kwa hiyo linadumisha upana halisi wa ἀδελφοί; tanbihi inabainisha uwezekano huo bila kuamua mjadala wa kifamilia au kiteolojia.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Hili ndilo neno la kawaida la Injili kwa μαθηταί na linahifadhi wazo la wanaojifunza na kumfuata mwalimu.
- source_word: ἐκεῖ ἔμειναν
  choice: nao wakakaa huko
  rationale: Kitenzi cha wingi kinahusu kundi lote; usemi huu ni wa asili katika simulizi la Kiswahili.
- source_word: οὐ πολλὰς ἡμέρας
  choice: siku chache tu
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa usemi hasi wa Kigiriki 'si siku nyingi,' bila kubadili maana ya muda mfupi.
theological_decisions:
- issue: Uhusiano unaokusudiwa na neno ἀδελφοί kuhusu familia ya Yesu
  choice: ndugu zake
  alternative: kaka zake; jamaa zake
  rationale: Kigiriki kinaweza kumaanisha kaka kwa maana finyu au watu wa ukoo katika baadhi ya mazingira. Kiswahili 'ndugu' kinahifadhi mvutano huo badala ya kuamua mjadala wa baadaye kuhusu familia ya Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mtindo wa simulizi umetumia mfuatano wa vitenzi vya ka-, na maneno ya kawaida yanayoeleweka kwa wasomaji wengi.
