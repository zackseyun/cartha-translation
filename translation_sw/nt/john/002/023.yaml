  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: sw
  text: Alipokuwa Yerusalemu wakati wa Pasaka, katika sikukuu hiyo, watu wengi waliamini katika jina lake[a], walipokuwa wakiziona ishara[b] alizokuwa akifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimwamini.” Kwa tafsiri ya neno kwa neno, “waliamini katika jina lake”; huu ni msemo wa Yohana unaokazia kumtumaini yeye kwa msingi wa utambulisho wake uliofunuliwa.
    reason: lexical_alternative
  - marker: b
    text: “Ishara” ni neno ambalo Yohana hutumia kwa namna ya pekee kuhusu matendo yanayoelekeza zaidi ya yenyewe ili kuonyesha Yesu ni nani; tafsiri nyingine husema “ishara za kimiujiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: Alipokuwa Yerusalemu
  rationale: Muundo huu unaanzisha tukio jipya kwa mwendelezo hafifu na huonyesha wakati kwa Kiswahili cha kawaida bila kuongeza neno lisilokuwamo katika chanzo.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: wakati wa Pasaka, kwenye sikukuu hiyo
  rationale: Huhifadhi marejeo yote mawili ya mazingira ya Pasaka na sikukuu, huku 'hiyo' ikifanya urudiaji huo uwe wazi na wa kawaida kwa Kiswahili.
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Kiswahili huhitaji nomino hapa ili sentensi iwe wazi na ya kawaida; 'watu' inaeleza wale wengi waliotajwa bila kuongeza maana ya kiufafanuzi.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: waliamini katika jina lake
  rationale: Huhifadhi msemo wa Yohana unaoelekeza imani kwa jina, yaani utambulisho wake uliofunuliwa, badala ya kuufupisha kuwa tu 'walimwamini.'
- source_word: θεωροῦντες
  choice: walipoziona
  rationale: Huonyesha kwamba kuona ishara kulihusiana na kuamini kwao; muktadha wa wakati unaoendelea unabebwa pia na kitenzi kinachofuata.
- source_word: τὰ σημεῖα
  choice: ishara
  rationale: Huhifadhi istilahi bainifu ya Yohana kwa matendo yanayoelekeza zaidi ya tendo lenyewe kwa utambulisho wa Yesu, bila kuongeza moja kwa moja 'miujiza.'
- source_word: ἃ ἐποίει
  choice: alizokuwa akifanya
  rationale: Muundo wa 'alizokuwa akifanya' unaonyesha kitendo kilichoendelea katika wakati uliopita, sawasawa na hali ya kitenzi cha Kigiriki.
theological_decisions:
- issue: Aina ya imani inayoelezwa na ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ katika muktadha wa Yohana
  choice: Kutafsiri moja kwa moja kuwa 'watu wengi waliamini katika jina lake' bila kuidhoofisha imani hiyo ndani ya aya hii.
  alternative: Kusema walikuwa na imani ya mwanzo au ya juu juu tu, au kwamba walidai kuamini kwa sababu ya miujiza.
  rationale: Kigiriki kinasema waliamini katika jina lake. Aya inayofuata ndiyo inayoongeza mvutano kuhusu hali ya imani hiyo; tafsiri haipaswi kuamua mapema suala hilo la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio ni wa asili kwa Kiswahili huku ukihifadhi istilahi za Yohana na mvutano wa simulizi.
