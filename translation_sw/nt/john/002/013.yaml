base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: sw
  text: Na Pasaka ya Wayahudi ilikuwa karibu[a], naye Yesu akapanda kwenda Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pasaka ya watu wa Yudea.” Katika Injili ya Yohana, neno la Kigiriki Ἰουδαῖοι katika baadhi ya miktadha linaweza kumaanisha “watu wa Yudea” badala ya “Wayahudi”; lakini hapa kwa kawaida hutambulisha Pasaka kuwa sikukuu ya Wayahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: ilikuwa imekaribia
  rationale: Katika muktadha huu neno linaonyesha ukaribu wa wakati. Kauli hii ni ya kawaida katika Kiswahili cha sasa na inaonyesha kwamba sikukuu ilikuwa karibu kufika.
- source_word: πάσχα
  choice: Pasaka
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa sikukuu ya Kiyahudi inayotajwa hapa.
- source_word: τῶν Ἰουδαίων
  choice: ya Wayahudi
  rationale: Hapa kirai hiki kinaitambulisha Pasaka kuwa sikukuu ya Wayahudi. Ingawa Ἰουδαῖοι katika baadhi ya sehemu za Yohana inaweza kumaanisha watu wa Yudea, maana pana ya Wayahudi ndiyo inayofaa zaidi hapa.
- source_word: ἀνέβη
  choice: akapanda kwenda
  rationale: Kitenzi kina maana ya kwenda juu na pia ni lugha ya kawaida ya safari kuelekea Yerusalemu. 'Akapanda kwenda' huhifadhi maana hiyo bila kudokeza kupaa mbinguni.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mji huu katika Kiswahili.
- source_word: Καὶ
  choice: naye
  rationale: Kiunganishi cha pili kinaunganisha sentensi kwa mtiririko wa kawaida wa simulizi. Kiunganishi cha kwanza hakijawakilishwa kwa neno tofauti, kwa kuwa Kiswahili hakihitaji 'na' mwanzoni hapa ili kuendeleza simulizi kwa ufasaha.
theological_decisions:
- issue: Maana ya Ἰουδαῖοι katika Injili ya Yohana
  choice: ya Wayahudi
  alternative: ya watu wa Yudea
  rationale: Muktadha unaitaja Pasaka kama sikukuu ya Wayahudi kwa ujumla, si kama sikukuu ya kundi la eneo la Yudea pekee. Hata hivyo, uwezekano wa maana ya kikanda umehifadhiwa katika tanbihi kwa sababu neno hilo huwa na maana inayotegemea muktadha katika Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo 'akapanda kwenda Yerusalemu' umechaguliwa ili kuhifadhi taswira ya kwenda juu kuelekea mji huo na lugha ya hija.
