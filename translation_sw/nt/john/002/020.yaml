  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: sw
  text: Basi Wayahudi wakasema[a], “Hekalu hili lilijengwa kwa miaka arobaini na sita, nawe utaliinua[b] katika siku tatu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayudea.” Kigiriki kinasema “Wayahudi,” neno ambalo Yohana hulitumia kwa maana mbalimbali kulingana na muktadha.
    reason: alternative_reading
  - marker: b
    text: Au, “utalijenga upya.” Wasemaji wanaweza kuelewa kitenzi cha Kigiriki kwa maana ya ujenzi, lakini “utaliinua” huhifadhi namna ya usemi ambayo Yohana baadaye anaihusianisha na kufufuka kwa Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha matokeo au mwendelezo unaotokana na kauli ya Yesu iliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hufuata maana ya moja kwa moja ya Kigiriki bila kuibana kuwa viongozi pekee; matumizi ya neno hili katika Yohana hutegemea muktadha.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: kwa miaka arobaini na sita
  rationale: Huonyesha muda uliotumika katika ujenzi, badala ya kudokeza kwamba ujenzi ulifanyika miaka arobaini na sita iliyopita.
- source_word: οἰκοδομήθη
  choice: lilijengwa
  rationale: Ni muhtasari wa tendo la ujenzi katika kauli tendwa, sawasawa na aoristi tendwa ya Kigiriki.
- source_word: ὁ ναὸς οὗτος
  choice: Hekalu hili
  rationale: Ingawa ναός hasa inaweza kumaanisha patakatifu pa hekalu, ‘hekalu’ ndilo neno la kawaida na linaloeleweka katika muktadha huu.
- source_word: καὶ σὺ
  choice: nawe
  rationale: Kiambishi ‘-we’ kinaendeleza kiunganishi na pia kusisitiza ‘wewe’ katika swali la kutoamini.
- source_word: ἐν τρισὶν ἡμέραις
  choice: kwa siku tatu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi ambacho tendo hilo lingetimizwa.
- source_word: ἐγερεῖς
  choice: utaliinua
  rationale: Huhifadhi taswira ya ‘kuinua’ badala ya kuamua mapema kwamba maana ni ‘kujenga upya’; hivyo mvutano kati ya ufahamu wa wasemaji kuhusu hekalu na maelezo ya Yohana kuhusu mwili wa Yesu unabaki wazi.
- source_word: αὐτόν
  choice: -li- katika ‘utaliinua’
  rationale: Kiwakilishi cha yambwa kinarejelea ‘hekalu,’ ambalo ni nomino ya ngeli ya LI-YA katika Kiswahili.
theological_decisions:
- issue: Uwezekano wa neno οἱ Ἰουδαῖοι kueleweka kama lawama kwa Wayahudi wote
  choice: Wayahudi katika matini kuu, pamoja na tanbihi ya kimuktadha
  alternative: Wayudea; viongozi wa Kiyahudi
  rationale: Matini ya Kigiriki haisemi wazi ‘viongozi,’ hivyo tafsiri haiongezi upeo huo. Tanbihi inaonya kwamba matumizi ya Yohana hubadilika kulingana na muktadha na hapa wazungumzaji wako katika mazingira ya hekalu huko Yudea.
- issue: Uhusiano wa ἐγερεῖς na taswira ya ufufuo
  choice: utaliinua
  alternative: utalijenga upya
  rationale: ‘Kujenga upya’ kungeeleza tu jinsi wasemaji walivyoelewa maneno hayo na kufuta mapema kejeli ya kiteolojia ambayo Yohana anaifafanua katika mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nawe’ huhifadhi msisitizo wa swali la mshangao; ‘kwa miaka arobaini na sita’ hueleza muda wa ujenzi bila kuongeza maelezo ya kihistoria yasiyomo katika mstari.
