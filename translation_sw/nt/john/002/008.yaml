  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: sw
  text: Akawaambia, “Tekeni sasa, mkampelekee msimamizi wa karamu[a].” Nao wakampelekea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wa wahudumu” au “mkuu wa karamu.” Neno la Kigiriki humaanisha mtu aliyesimamia karamu.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakamletea.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa kuzingatia upande wa wale waliokipeleka au wa yule aliyekipokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Akawaambia
  rationale: Wakati uliopo wa Kigiriki umetumiwa kama wakati uliopo wa kihistoria katika simulizi. Kiswahili cha masimulizi hutumia kwa ufasaha muundo wa wakati uliopita unaoendeleza matukio.
- source_word: Ἀντλήσατε
  choice: TekenI
  rationale: Kitenzi hiki kinaeleza kuchota kimiminika. ‘Tekeni’ ni amri ya kawaida na yenye kueleweka katika muktadha wa vyombo vilivyojazwa maji.
- source_word: νῦν
  choice: sasa
  rationale: Neno hili linahifadhi maana ya wakati na uharaka wa agizo.
- source_word: φέρετε
  choice: mkampelekee
  rationale: Muundo huu unaonyesha kupeleka kile kilichotekwa kwa mtu aliyetajwa, kwa mtazamo wa watumishi waliotumwa.
- source_word: ἀρχιτρικλίνῳ
  choice: msimamizi wa karamu
  rationale: Neno la Kigiriki humaanisha mtu mwenye jukumu la kusimamia karamu. Tafsiri hii ni ya kawaida, yenye heshima, na haikazii bila msingi kama alikuwa mhudumu mkuu au mwenyeji.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Nao wakampelekea
  rationale: δέ ni kiunganishi chepesi kinachoendeleza simulizi. Kitenzi kinaonyesha kwamba walitekeleza agizo kwa kupeleka kile walichoteka; kitu kinachoeleweka kutokana na muktadha hakitajwi wazi katika Kigiriki wala si lazima kitajwe katika Kiswahili.
