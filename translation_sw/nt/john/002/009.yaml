id: JHN.2.9
reference: John 2:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: sw
  text: Msimamizi wa karamu[a] alipoonja maji yaliyogeuka kuwa divai[b], hakujua yalikotoka (ingawa watumishi waliokuwa wameyateka walijua); msimamizi wa karamu anamwita[c] bwana arusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuu wa wahudumu.” Neno la Kigiriki linamtaja mtu aliyekuwa akisimamia karamu.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “maji yaliyokuwa yamekuwa divai”; pia inaweza kutafsiriwa “maji yaliyobadilika kuwa divai.”'
    reason: lexical_alternative
  - marker: c
    text: 'Yohana hapa anatumia wakati wa sasa kusimulia tukio la zamani: “anamwita”; katika masimulizi ya kawaida ingeweza kuwa “akamwita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: msimamizi wa karamu
  rationale: Neno hili linamtaja mtu aliyesimamia karamu. Tafsiri hii ni ya kawaida na inaeleza wajibu wake bila kumfanya tu kuwa mhudumu mkuu au mtangazaji wa sherehe.
- source_word: ἐγεύσατο
  choice: alipoonja
  rationale: Kitenzi kinamaanisha kuonja au kujaribu ladha; “alipoonja” ni tafsiri ya moja kwa moja na ya asili katika muktadha huu.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: maji yaliyogeuka kuwa divai
  rationale: 'Kauli hii inaonyesha badiliko lililokamilika na matokeo yake yaliyokuwapo: maji sasa yalikuwa divai. “Yaliyogeuka kuwa” ni Kiswahili cha kawaida kisichodhoofisha uhalisi wa badiliko hilo.'
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: hakujua yalikotoka
  rationale: πόθεν huuliza chanzo au asili. “Yalikotoka” hueleza maana hiyo kwa Kiswahili cha kawaida.
- source_word: διάκονοι
  choice: watumishi
  rationale: Katika karamu hii neno linawataja watu waliokuwa wakihudumu, si cheo cha baadaye cha kanisa.
- source_word: ἠντληκότες
  choice: waliokuwa wameyateka
  rationale: Kitenzi kinamaanisha kuteka maji. Kiwakilishi “-ya-” kinarejelea maji na kutoa usemi wa asili wa Kiswahili.
- source_word: φωνεῖ
  choice: anamwita
  rationale: Wakati wa sasa wa Kigiriki umetumiwa kusimulia tukio la wakati uliopita kwa uhai zaidi. Wakati wa sasa umehifadhiwa katika Kiswahili.
- source_word: νυμφίον
  choice: bwana arusi
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa mwanamume anayeoa katika muktadha wa harusi.
- source_word: ὡς δὲ
  choice: alipoonja
  rationale: Muunganiko huu unaanzisha tukio linalofuata. Muundo wa Kiswahili wa “alipo-” hubeba uhusiano wa wakati kwa kawaida bila kuongeza neno lisilokuwamo kama “sasa”.
theological_decisions:
- issue: Maelezo ya kimuujiza ya badiliko la maji
  choice: maji yaliyogeuka kuwa divai
  alternative: maji yaliyofanywa divai
  rationale: Kigiriki kinasema wazi kuwa maji yalikuwa yamekuwa divai. Tafsiri inadumisha badiliko halisi bila kuongeza maelezo ya kimafundisho wala kulifanya kuwa mwonekano tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mabano unahifadhi maelezo ya pembeni kuhusu watumishi, na wakati wa sasa wa kihistoria katika “anamwita” umehifadhiwa kwa kuambatanishwa na tanbihi.
