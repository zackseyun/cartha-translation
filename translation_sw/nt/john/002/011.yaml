  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: sw
  text: Yesu alifanya hili, likiwa mwanzo wa ishara zake, huko Kana ya Galilaya; akaufunua utukufu wake, na wanafunzi wake wakamwamini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: alifanya hili
  rationale: Kiwakilishi cha kuonyesha kinarejelea tendo lililosimuliwa, bila kuongeza neno ‘muujiza’ au ‘ishara’ mahali ambapo Kigiriki kina kiwakilishi tu; ‘alifanya’ huhifadhi upana wa ποιέω.
- source_word: ἀρχὴν τῶν σημείων
  choice: likiwa mwanzo wa ishara zake
  rationale: Muundo huu huhifadhi maana ya ἀρχή kama ‘mwanzo’ na kuonyesha kuwa tendo hili lilianzisha mfululizo wa ishara za Yesu. ‘Zake’ inatokana na muktadha.
- source_word: σημείων
  choice: ishara
  rationale: Katika Yohana, matendo haya yanaelekeza zaidi ya tukio lenyewe na kufunua utambulisho wa Yesu; ‘ishara’ huhifadhi dhana hiyo kuliko ‘miujiza’.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: huko Kana ya Galilaya
  rationale: Ni usemi wa kawaida na wazi wa mahali katika Kiswahili, huku ukihifadhi uhusiano wa Kana na Galilaya.
- source_word: ἐφανέρωσεν
  choice: alifunua
  rationale: Neno hili linaeleza kufanya jambo lionekane au lijulikane; ‘alifunua’ ni la kawaida na linafaa kwa maana ya kifungu.
- source_word: τὴν δόξαν αὐτοῦ
  choice: utukufu wake
  rationale: ‘Utukufu’ ni neno la kawaida kwa δόξα na huhifadhi uzito wake wa kitheolojia katika Yohana.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: wakamwamini
  rationale: Huu ni usemi wa asili wa Kiswahili unaoeleza imani na tegemeo lililoelekezwa kwa Yesu.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai hiki.
theological_decisions:
- issue: Istilahi ya Yohana σημεῖον
  choice: ishara
  alternative: miujiza
  rationale: ‘Ishara’ huhifadhi kazi ya matendo haya kama ufunuo wa utambulisho na utukufu wa Yesu, si maonyesho ya nguvu pekee.
- issue: Nguvu ya ἀρχὴν τῶν σημείων
  choice: mwanzo wa ishara zake
  alternative: ishara yake ya kwanza
  rationale: Chaguo kuu linafuata neno ἀρχή, ‘mwanzo,’ huku chaguo la tanbihi likihifadhi maana nyingine halali na iliyo wazi zaidi kwa baadhi ya wasomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa baada ya sehemu ya Kana ili kuepuka msururu mzito wa viunganishi bila kupoteza uhusiano wa mawazo.
