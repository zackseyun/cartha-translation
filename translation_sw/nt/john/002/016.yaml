  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: sw
  text: Akawaambia wale waliokuwa wakiuza njiwa, “Ondoeni vitu hivi kutoka hapa; msiifanye nyumba ya Baba yangu kuwa nyumba ya biashara.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιστερὰς
  choice: njiwa
  rationale: Neno hili hutaja ndege waliouzwa kwa ajili ya dhabihu. ‘Njiwa’ ni tafsiri ya kawaida na ya asili katika Kiswahili, bila kujaribu kubainisha zaidi aina ya ndege kuliko Kigiriki.
- source_word: πωλοῦσιν
  choice: waliokuwa wakiuza
  rationale: Kirai hiki kinatambulisha kundi kwa shughuli yao ya kuendelea ya kuuza; umbo hili la Kiswahili linaonyesha tendo lililokuwa likiendelea katika tukio hilo.
- source_word: Ἄρατε
  choice: Ondoeni
  rationale: Amri hii inadai hatua ya moja kwa moja na thabiti. ‘Ondoeni’ huwasilisha vizuri maana ya kuvichukua vitu hivyo na kuvitoa mahali hapo.
- source_word: ταῦτα
  choice: vitu hivi
  rationale: Kiwakilishi hiki ni cha wingi wa kijinsia isiyo bainifu na huenda kinarejelea vitu au vifaa vilivyohusiana na wauzaji; ‘vitu hivi’ hakibainishi zaidi ya maandishi.
- source_word: ἐντεῦθεν
  choice: hapa
  rationale: Pamoja na ‘Ondoeni,’ neno ‘hapa’ huleta maana ya kuvitoa kutoka mahali walipokuwa, kwa Kiswahili cha kawaida.
- source_word: μὴ ποιεῖτε
  choice: msiifanye
  rationale: Hii ni amri ya kukataza. ‘Msiifanye’ inafuata moja kwa moja kitenzi ποιεῖτε bila kuongeza wazo la ‘kugeuza’ au kudai wazi kwamba tendo hilo lilikuwa tayari linaendelea.
- source_word: οἶκον τοῦ πατρός μου
  choice: nyumba ya Baba yangu
  rationale: Tafsiri hii huhifadhi rejeo la hekalu kama nyumba na dai la Yesu la uhusiano wa moja kwa moja na Baba yake.
- source_word: οἶκον ἐμπορίου
  choice: nyumba ya biashara
  rationale: ‘Biashara’ huwasilisha wazo la uchuuzi au shughuli za kibiashara, huku ‘nyumba’ ikihifadhi urudiaji wa οἶκος na ulinganisho wa balagha wa ‘nyumba ... nyumba.’
theological_decisions:
- issue: Kauli ya Yesu kuhusu hekalu kuwa ‘nyumba ya Baba yangu’
  choice: Kuhifadhi kauli ya umoja ‘Baba yangu’ bila kuipunguza au kuipanua.
  alternative: ‘nyumba ya Baba yetu’ au ‘nyumba ya Mungu’
  rationale: Kigiriki kina μου, ‘yangu,’ na hivyo kinaonyesha uhusiano wa Yesu na Baba pamoja na mamlaka yake katika muktadha huu. Tafsiri haibadili dai hilo kuwa la pamoja wala kulifafanua kwa maneno mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘nyumba ya Baba yangu ... nyumba ya biashara’ umehifadhiwa ili kuonyesha urudiaji na mkazo wa Kigiriki. Hakuna tanbihi iliyoongezwa kwa sababu mbadala ‘soko’ ungepoteza urudiaji wa ‘nyumba,’ na maana ya msingi inaeleweka katika matini.
