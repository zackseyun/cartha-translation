  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: sw
  text: Wanafunzi wake wakakumbuka kwamba imeandikwa[a], “Wivu kwa ajili ya nyumba yako utanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umenila,” kulingana na maneno ya Zaburi 69:9 katika baadhi ya mapokeo ya maandishi; Kigiriki cha Yohana hapa kinasema “utanila.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: wakakumbuka
  rationale: Kitenzi cha wakati uliopita kinaonyesha kwamba wanafunzi walikumbuka; muundo wa masimulizi wenye ‘waka-’ ni wa asili katika Kiswahili.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida la Agano Jipya kwa wafuasi wanaojifunza kwa mwalimu.
- source_word: γεγραμμένον ἐστίν
  choice: imeandikwa
  rationale: Ni tamko la kawaida la Kiswahili la kutambulisha nukuu ya Maandiko na linadumisha maana ya jambo lililoandikwa lenye matokeo ya kudumu.
- source_word: ζῆλος
  choice: juhudi
  rationale: Katika muktadha huu neno linaonyesha bidii na moyo mkali wa kujitoa kwa nyumba ya Mungu; ‘juhudi’ ni la kawaida na linaeleweka, ingawa haliondoi uzito wa hisia hiyo.
- source_word: οἴκου
  choice: nyumba
  rationale: Nukuu yenyewe inasema ‘nyumba’; kuitafsiri ‘hekalu’ kungefafanua rejeo lakini kungeficha kwa kiasi fulani maneno ya Zaburi.
- source_word: καταφάγεταί
  choice: zitanila
  rationale: Muundo huu unahifadhi taswira halisi ya ‘kula kabisa’ na wakati ujao wa kitenzi cha Kigiriki, huku ukisikika kwa kawaida katika nukuu ya kishairi ya Kiswahili.
- source_word: με
  choice: -ni- (katika zitanila)
  rationale: Kiambishi cha yambwa ‘-ni-’ kinawakilisha ‘mimi,’ anayesema katika nukuu ya Zaburi na ambaye maneno hayo yanahusishwa naye Yesu hapa.
theological_decisions:
- issue: Wakati ujao wa kitenzi katika nukuu ya Zaburi kama unavyomhusu Yesu
  choice: 'Kudumisha wakati ujao: “zitanila”'
  alternative: “zimenila” / “zimeniteketeza”
  rationale: Kigiriki cha Yohana hapa kina καταφάγεταί, kitenzi cha wakati ujao. Tafsiri haipaswi kukisawazisha kimya kimya na mapokeo ya Zaburi yenye maana ya wakati uliopita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa masimulizi ulio wazi na wenye hadhi. Nukuu inadumisha taswira ya kishairi ya kula badala ya kuibadili kuwa maelezo kama ‘kuniteketeza.’ Alama ya tanbihi [a] imewekwa baada ya fomula ya utangulizi kama katika safu ya mashauriano ya Kiingereza.
