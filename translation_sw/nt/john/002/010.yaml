base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: sw
  text: Naye akamwambia, “Kila mtu[a] huanza kwa kutoa divai nzuri, na watu wakisha kulewa[b], hutoa divai iliyo duni. Lakini wewe umehifadhi divai nzuri mpaka sasa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki ni usemi wa umoja wenye maana ya jumla, yaani watu kwa ujumla, si wanaume pekee.
    reason: cultural_note
  - marker: b
    text: Au “wanapokuwa wamelewa.” Kitenzi cha Kigiriki kwa kawaida humaanisha kulewa; tafsiri nyingine hulainisha usemi huu kuwa “wakisha kunywa kwa wingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Kauli ya sasa ya Kigiriki imetumiwa kama wakati wa sasa wa kihistoria; katika usimulizi wa kawaida wa Kiswahili, ‘akamwambia’ huendeleza mfululizo wa matukio kwa ufasaha.
- source_word: Πᾶς ἄνθρωπος
  choice: Kila mtu
  rationale: Huu ni usemi wa umoja wenye maana ya jumla, unaowahusu watu kwa ujumla bila kuwabainisha wanaume pekee.
- source_word: πρῶτον τὸν καλὸν οἶνον τίθησιν
  choice: huanza kwa kutoa divai nzuri
  rationale: ‘Huanza’ huonyesha mpangilio unaodokezwa na πρῶτον, na ‘kutoa’ huwasilisha tendo la kuweka divai mbele ya wageni katika mazingira ya karamu.
- source_word: ὅταν μεθυσθῶσιν
  choice: watu wakisha kulewa
  rationale: Kitenzi μεθύω kwa kawaida humaanisha kulewa. Tafsiri hii inadumisha maana ya wazi ya Kigiriki na pia hali ya tendo lililofikia hatua hiyo.
- source_word: τὸν ἐλάσσω
  choice: ile duni
  rationale: Kivumishi cha kulinganisha kinamaanisha iliyo chini kwa ubora; neno ‘divai’ linaeleweka kutokana na muktadha.
- source_word: τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι
  choice: umeiweka divai nzuri mpaka sasa
  rationale: ‘Umeiweka’ huhifadhi nguvu ya wakati timilifu—divai ilihifadhiwa na bado ipo wakati huu—na ‘mpaka sasa’ ni tafsiri ya moja kwa moja ya ἕως ἄρτι.
theological_decisions:
- issue: Maana ya μεθυσθῶσιν katika simulizi la muujiza unaohusu divai
  choice: watu wakisha kulewa
  alternative: watu wakisha kunywa vya kutosha
  rationale: Maana ya kawaida ya kitenzi ni kulewa. Kauli hii ni uchunguzi wa kijamii wa msemaji, si lazima iwe idhini ya ulevi; kwa hiyo maana yake haijapunguzwa kwa sababu za kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima ya lugha ya Maandiko. ‘Divai’ limetumiwa kwa οἶνος, ‘ile duni’ kwa tofauti ya ubora, na maana ya kulewa imehifadhiwa bila kuificha wala kuifanya kuwa idhini ya kitabia.
