id: JHN.2.14
reference: John 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: sw
  text: Hekaluni[a] akawakuta watu waliokuwa wakiuza ng’ombe, kondoo na njiwa, na wabadili fedha wakiwa wameketi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki hapa ni hieron, yaani eneo lote la hekalu pamoja na nyua zake, si patakatifu pa ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: akawakuta
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu alikuta au alikutana na watu hao alipofika; muundo wa “aka-” pia unaendeleza masimulizi ya kaὶ kwa Kiswahili cha kawaida.
- source_word: ἱερῷ
  choice: hekaluni
  rationale: Ἱερόν hapa ni eneo lote la hekalu, kutia ndani nyua zake, wala si patakatifu pa ndani pekee. “Hekaluni” ni tafsiri fupi na ya kawaida, huku tanbihi ikifafanua upana wa maana.
- source_word: πωλοῦντας
  choice: watu waliokuwa wakiuza
  rationale: Muundo huu unaonyesha shughuli iliyokuwa ikiendelea na kuifanya nomino-shiriki ya Kigiriki ieleweke kwa Kiswahili cha kawaida.
- source_word: βόας
  choice: ng’ombe
  rationale: Βοῦς inaweza kutaja ng’ombe kwa ujumla; “ng’ombe” ni neno la kawaida la Kiswahili na halibainishi jinsia bila msingi wa kutosha.
- source_word: πρόβατα
  choice: kondoo
  rationale: “Kondoo” ndiyo kisawe cha kawaida na kinachofaa zaidi katika muktadha huu wa wanyama wa dhabihu.
- source_word: περιστερὰς
  choice: njiwa
  rationale: Neno la Kigiriki linaweza kumaanisha aina zinazojulikana kama dove au pigeon kwa Kiingereza; “njiwa” ni neno la kawaida la Kiswahili linalofunika maana hiyo.
- source_word: κερματιστὰς
  choice: wabadili fedha
  rationale: Hawa ni watu waliobadili sarafu; “wabadili fedha” ni usemi mfupi, unaoeleweka, na wenye historia katika Kiswahili cha Biblia.
- source_word: καθημένους
  choice: wakiwa wameketi
  rationale: Tafsiri hii inahifadhi hali yao ya kuketi bila kuongeza kwamba walikuwa mezani, jambo ambalo halijasemwa wazi katika mstari.
theological_decisions:
- issue: Upeo wa ἱερόν katika hekalu la Yerusalemu
  choice: “Hekaluni” katika maandishi, ikifafanuliwa katika tanbihi kuwa ni eneo lote la hekalu pamoja na nyua zake
  alternative: “katika nyua za hekalu” au “katika eneo la hekalu”
  rationale: Muktadha wa wauzaji wa wanyama na wabadili fedha unaonyesha eneo pana la hekalu, si patakatifu pa ndani. Tafsiri kuu inabaki ya kawaida na yenye hadhi, huku tanbihi ikihifadhi usahihi wa mahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi “akawakuta” ni wa asili, huku “waliokuwa wakiuza” na “wakiwa wameketi” vikihifadhi vitendo na hali zinazoendelea katika chanzo.
