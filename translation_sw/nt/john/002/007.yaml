  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: sw
  text: Yesu akawaambia, “Jazeni mitungi hiyo kwa maji.” Nao wakayajaza hadi juu kabisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi ukingoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akawaambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi unasikika kwa kawaida katika Kiswahili; kiambishi cha wingi kinaonyesha kwamba aliwaambia watu kadhaa.
- source_word: Γεμίσατε
  choice: Jazeni
  rationale: Ni amri ya moja kwa moja kwa watu wengi, na ‘jazeni’ ni usemi wa kawaida na wazi.
- source_word: τὰς ὑδρίας ὕδατος
  choice: mitungi hiyo ya maji
  rationale: ὑδρία ni mtungi wa kuhifadhia maji. ‘Hiyo’ huonyesha vyombo vilivyotajwa katika muktadha, bila kuongeza tena kwamba vilikuwa vya mawe.
- source_word: ἐγέμισαν αὐτὰς
  choice: wakaijaza
  rationale: Kiswahili kwa kawaida hutumia kiwakilishi cha ngeli kinachorejelea aina ya kitu; umoja hapa unairejelea mitungi hiyo kama jumla ya vyombo vilivyojazwa.
- source_word: ἕως ἄνω
  choice: hadi juu kabisa
  rationale: Kirai hiki huonyesha kwamba mitungi ilijazwa mpaka sehemu yake ya juu kabisa. Tafsiri hii ni wazi na haitegemei umbo maalumu la ukingo wa chombo.
