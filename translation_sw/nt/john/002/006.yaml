base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: sw
  text: Hapo palikuwa na mitungi sita ya mawe ya kuhifadhia maji, iliyokuwa imewekwa kwa mujibu wa desturi za utakaso za Wayahudi[a]; kila mtungi ulikuwa na ujazo wa vipimo viwili au vitatu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyowekwa kwa ajili ya desturi ya utakaso ya Wayahudi.” Maneno hayo yanahusu desturi za kujisafisha kidini.
    reason: lexical_alternative
  - marker: b
    text: “Kipimo” (Kigiriki metretēs) kilikuwa kipimo cha kale cha ujazo wa kimiminika, takriban lita 35–40.
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: Hapo palikuwa na
  rationale: Hapa δέ ni kiunganishi chepesi cha simulizi, kisichohitaji neno la wakati kama ‘sasa’. ‘Hapo palikuwa na’ linaonyesha kuwapo kwa mitungi mahali pale kwa Kiswahili cha kawaida.
- source_word: λίθιναι ὑδρίαι
  choice: mitungi ya mawe ya kuhifadhia maji
  rationale: λίθιναι hutaja nyenzo, yaani mawe, na ὑδρίαι ni vyombo vya maji. Usemi huu ni wazi na unaepuka utata unaoweza kujitokeza katika ‘mitungi ya maji ya mawe’.
- source_word: ἓξ
  choice: sita
  rationale: Ni tafsiri ya moja kwa moja ya nambari ya asili.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: kwa mujibu wa desturi za utakaso za Wayahudi
  rationale: κατά hapa inaweza kuonyesha kufuatana na desturi au matumizi yaliyokusudiwa. ‘Desturi za utakaso’ linafikisha maana ya kujitakasa kidini bila kuongeza maelezo ya kimadhehebu.
- source_word: κείμεναι
  choice: iliyowekwa
  rationale: κεῖμαι hapa hueleza vyombo vilivyokuwa vimewekwa mahali pale. ‘Iliyowekwa’ ni ya kawaida zaidi kwa mitungi kuliko tafsiri halisi ya ‘iliyolala’.
- source_word: χωροῦσαι
  choice: ulikuwa na ujazo wa
  rationale: Kitenzi hiki hapa kinahusu uwezo wa chombo kuchukua kiasi fulani. Kurudia ‘kila mtungi’ kunaonyesha wazi maana ya mgawanyo.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: vipimo viwili au vitatu
  rationale: ἀνά inaonyesha kiasi cha kila mtungi. μετρητής ni kipimo cha kale cha ujazo wa kimiminika; ‘vipimo’ kinahifadhi kipimo cha chanzo bila kulazimisha thamani moja ya kisasa katika matini kuu.
theological_decisions:
- issue: Maana ya τῶν Ἰουδαίων katika simulizi la Yohana
  choice: za Wayahudi
  alternative: za Wayudea
  rationale: Katika muktadha huu neno hilo linahusu desturi ya kidini ya utakaso, si hasa utambulisho wa kijiografia. ‘Wayahudi’ linafikisha maana hiyo ya kitamaduni na kidini bila kuongeza sauti ya mabishano.
- issue: Nguvu ya κατά katika kauli kuhusu utakaso
  choice: kwa mujibu wa desturi za utakaso
  alternative: kwa ajili ya desturi ya utakaso
  rationale: Muundo unaweza kueleweka kama kufuatana na desturi au kama kuonyesha kusudi la matumizi ya mitungi. Matini kuu inatumia maana ya kufuatana na desturi, huku tanbihi ikihifadhi uwezekano wa kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mitungi ya mawe ya kuhifadhia maji’ ni wazi kwa msomaji wa kawaida; ‘utakaso’ huhifadhi muktadha wa kidini, na ufafanuzi mfupi umetolewa katika tanbihi.
