  source_fidelity: Tafsiri inafuata maana ya Kigiriki kwa uaminifu. “Akawajibu” ni uwasilishaji wa kawaida wa ἀπεκρίθη ... καὶ εἶπεν αὐτοῖς bila urudufu usio wa lazima katika Kiswahili. “Libomoeni hekalu hili” hutoa vizuri amri Λύσατε τὸν ναὸν τοῦτον, na “nami katika siku tatu nitaliinua” huhifadhi wakati ujao, kiwakilishi kinachorejelea hekalu, na mvutano wenye mwangwi wa ufufuo wa ἐγερῶ.
  naturalness: Kiswahili ni sanifu, cha kisasa, na chenye mtiririko wa kimaandiko unaosikika asilia. “Libomoeni,” “hekalu hili,” na “katika siku tatu” ni matumizi ya kawaida na yanayoeleweka. “Nitaliinua” ni sahihi kisarufi na kwa makusudi haibani kauli kuwa ujenzi pekee.
  terminology: “Hekalu” ni sawa kwa ναός katika muktadha huu. “Libomoeni” huonyesha kubomoa/kuharibu, si kufungua. “Nitaliinua” hudumisha kwa uangalifu usemi wenye maana ya kuinua na mwangwi wa ufufuo, bila kufichua mapema ufafanuzi wa Yohana 2:21. Tanbihi inaeleza mbadala wa kileksika na muktadha bila kuingiza tafsiri ya kimadhehebu.
