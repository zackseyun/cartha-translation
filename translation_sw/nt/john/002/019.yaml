base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: sw
  text: Yesu akawajibu, “Libomoeni hekalu hili, nami katika siku tatu nitaliinua[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Livunjeni hekalu hili … nitalijenga upya.” Kitenzi cha Kigiriki kilichotafsiriwa “nitaliinua” kinaweza pia kusikika hapa kuwa na mwangwi wa kufufuka; baadaye Yohana anaeleza kwamba Yesu alikuwa akisema juu ya hekalu la mwili wake (2:21).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτοῖς
  choice: akawajibu
  rationale: Muundo huu wa Kigiriki ni namna ya kawaida ya kuanzisha jibu. Kiswahili cha asili hutumia ‘akawajibu’ bila kurudia ‘akasema,’ huku maana yote ikibaki wazi.
- source_word: Λύσατε
  choice: Libomoeni
  rationale: Katika muktadha huu λύω humaanisha kulibomoa au kuliharibu jengo, si kulifungua tu. ‘Libomoeni’ ni amri ya wingi na inafaa kwa hekalu.
- source_word: τὸν ναὸν τοῦτον
  choice: hekalu hili
  rationale: ‘Hekalu’ ni neno la kawaida na lenye heshima kwa ναός. Kiwakilishi ‘hili’ kinahifadhi msisitizo wa kitu kilicho karibu bila kufafanua mapema kuwa ni mwili wa Yesu.
- source_word: ἐν τρισὶν ἡμέραις
  choice: katika siku tatu
  rationale: Huu ni ulinganifu wa moja kwa moja unaohifadhi kiasi fulani cha uwazi wa usemi wa wakati wa Kigiriki; unaweza kueleweka kuwa baada ya siku tatu au ndani ya kipindi hicho kulingana na muktadha.
- source_word: ἐγερῶ αὐτόν
  choice: nitaliinua
  rationale: ‘Nitaliinua’ huhifadhi maana ya msingi ya ἐγείρω, badala ya kuibana kuwa ‘nitalijenga upya.’ Pia haifuti mwangwi wa kufufuka unaofafanuliwa baadaye katika Yohana 2:21. Kiambishi ‘-li-’ kinarejelea ‘hekalu’ kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Ikiwa hekalu litambulishwe wazi kuwa mwili wa Yesu
  choice: Kudumisha ‘hekalu hili’ bila maelezo ya ziada katika matini kuu.
  alternative: ‘Libomoeni hekalu hili, yaani mwili wangu.’
  rationale: Kauli ya Yesu imewasilishwa kwa namna yenye fumbo, na Yohana mwenyewe anaifafanua katika 2:21. Kuitambulisha mapema kungeondoa mvutano wa simulizi.
- issue: Ikiwa ἐγερῶ itafsiriwe kwa lugha ya ujenzi au ya ufufuo
  choice: nitaliinua
  alternative: nitalijenga upya; nitalifufua
  rationale: ‘Nitalijenga upya’ huweka maana ya ujenzi pekee, ilhali ‘nitalifufua’ hufanya maana ya mwili iwe wazi mapema na husikika isivyo kawaida kuhusu jengo. ‘Nitaliinua’ hudumisha uwezekano wa maana zote mbili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. ‘Libomoeni’ ni la kawaida na sahihi kwa kubomoa jengo; ‘nitaliinua’ limechaguliwa ili kuhifadhi fumbo na mwangwi wa ufufuo.
