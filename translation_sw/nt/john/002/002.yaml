  text: Yesu na wanafunzi wake pia walialikwa arusini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: alikuwa amealikwa
  rationale: Katika muktadha wa kuhudhuria sherehe ya kijamii, kitenzi hiki katika hali ya kutendwa humaanisha kualikwa. Wakati timilifu uliopita katika Kiswahili unaonyesha kwamba mwaliko ulikuwa umetolewa kabla ya tukio linalosimuliwa.
- source_word: δὲ καὶ
  choice: pia
  rationale: Muunganiko huu unamwongeza Yesu kwa waliotajwa katika mstari uliotangulia; ‘pia’ ni ya kawaida na hubeba vizuri maana hiyo ya nyongeza.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina hili linatolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: pamoja na wanafunzi wake
  rationale: Hii inadumisha uratibu kati ya Yesu na wanafunzi wake kwa Kiswahili cha kawaida. ‘Wanafunzi’ huhifadhi maana ya watu wanaojifunza kutoka kwa Yesu na utambulisho wao kama kundi lake.
- source_word: εἰς τὸν γάμον
  choice: arusini
  rationale: γάμος hapa ni tukio au sherehe ya arusi. ‘Arusini’ ni usemi wa asili wa Kiswahili kwa mwaliko wa kuhudhuria tukio hilo, bila kuongeza wazi wazo la karamu ambalo halikutajwa katika mstari huu.
