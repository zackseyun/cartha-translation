  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: sw
  text: Baada ya kutengeneza mjeledi wa kamba, akawafukuza wote[a] kutoka katika eneo la Hekalu[b]—kondoo na ng’ombe[c] pia. Akamwaga sarafu za wabadili fedha na kupindua meza zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema “wote,” kisha kinataja kondoo na ng’ombe. Maneno hayo hayasemi wazi kwamba mjeledi ulitumiwa dhidi ya watu.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki ἱερόν linamaanisha eneo lote la Hekalu au nyua zake, si patakatifu pa ndani pekee.
    reason: cultural_note
  - marker: c
    text: Au “mafahali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: Baada ya kutengeneza
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; usemi huu unaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: mjeledi kwa kamba
  rationale: “Mjeledi” ni neno la sasa na linaloeleweka kwa chombo hiki; “kwa kamba” linaonyesha nyenzo iliyotumiwa kuutengeneza.
- source_word: πάντας
  choice: wote
  rationale: Huhifadhi upana wa neno la Kigiriki bila kuamua kimyakimya kama linawahusu watu pamoja na wanyama au wanyama waliotajwa baada yake.
- source_word: ἐξέβαλεν
  choice: akawafukuza ... kutoka
  rationale: Huwasilisha tendo la kuwaondoa kwa nguvu na linafaa pia kwa wanyama katika muktadha huu.
- source_word: τοῦ ἱεροῦ
  choice: eneo la Hekalu
  rationale: ἱερόν ni eneo lote la Hekalu au nyua zake, wala si patakatifu pa ndani pekee.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: kondoo na ng’ombe pia
  rationale: Muundo huu unataja wazi makundi yote mawili ya wanyama. “Ng’ombe” ni neno la kawaida na pana linalofaa kwa βοῦς.
- source_word: κολλυβιστῶν
  choice: wabadili fedha
  rationale: Ni usemi wa kawaida wa Kiswahili kwa watu waliobadili sarafu katika mazingira ya Hekalu.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: akamwaga sarafu
  rationale: “Kumwaga” huhifadhi taswira halisi ya ἐκχέω, na “sarafu” huwasilisha κέρματα kwa usahihi bila ufafanuzi usio wa lazima.
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: kupindua meza zao
  rationale: “Kupindua” huonyesha wazi kuziangusha au kuzigeuza meza; “zao” hufanya uhusiano na wabadili fedha uwe wa kawaida katika Kiswahili.
theological_decisions:
- issue: Waliohusishwa na neno “wote” na matumizi ya mjeledi
  choice: Tafsiri inasema “akawafukuza wote,” kisha inataja kondoo na ng’ombe, bila kusema wazi kwamba Yesu aliwapiga watu kwa mjeledi.
  alternative: Kutafsiri kwamba aliwafukuza watu wote pamoja na wanyama, au kwamba aliwafukuza wanyama pekee.
  rationale: Sarufi ya Kigiriki ina πάντας (“wote”) ikifuatiwa na kondoo na ng’ombe, lakini haisemi wazi kwamba mjeledi ulitumiwa dhidi ya watu. Tafsiri na tanbihi huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi ya pili inaboresha usomaji bila kubadili mfuatano wa matendo. “Hekalu” limeandikwa kwa herufi kubwa kama jina la Hekalu la Yerusalemu.
