  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: sw
  text: Je, Maandiko hayasemi kwamba Masihi[a] anatoka katika uzao wa Daudi, na kutoka Bethlehemu, kijiji alikokuwa Daudi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Cheo cha Kigiriki ni ὁ χριστός.
    reason: Hutoa mbadala uliozoeleka huku ikifafanua kwa usahihi kwamba ὁ χριστός ni cheo.
lexical_decisions:
- source_word: ἡ γραφή
  choice: Maandiko
  rationale: Katika matumizi ya Yohana, neno hili humaanisha Maandiko Matakatifu yenye mamlaka. Ingawa Kigiriki kina umoja wa kisarufi, “Maandiko” ndilo neno la kawaida na la heshima katika Kiswahili kwa ushuhuda wa maandiko hayo.
- source_word: εἶπεν
  choice: hayasemi
  rationale: Wakati uliopita wa Kigiriki unaelekeza kwenye yaliyosemwa na Maandiko, lakini katika swali hili la balagha Kiswahili cha sasa hutumia kwa kawaida wakati wa sasa kuonyesha ushuhuda wa Maandiko unaoendelea kuwa na mamlaka.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: anatoka katika uzao wa Daudi
  rationale: σπέρμα hapa humaanisha ukoo au wazao, si mbegu halisi. “Uzao wa Daudi” ni wa kawaida, unaeleweka, na huhifadhi maana ya nasaba.
- source_word: ἀπὸ Βηθλέεμ
  choice: na kutoka Bethlehemu
  rationale: ἀπό huonyesha mahali pa asili; kurudia “kutoka” kunadumisha muundo wa Kigiriki na kuweka wazi dai la mahali alikotoka Masihi.
- source_word: τῆς κώμης
  choice: kijiji
  rationale: κώμη ni makazi madogo, kwa hiyo “kijiji” ni sahihi zaidi kuliko “mji.”
- source_word: ὅπου ἦν Δαυίδ
  choice: alikokuwa Daudi
  rationale: Tafsiri hii hudumisha usemi mfupi wa Kigiriki, “ambapo Daudi alikuwa,” bila kuongeza kwa uhakika kwamba ndipo alipoishi au alikozaliwa.
- source_word: ἔρχεται
  choice: anatoka
  rationale: Katika muktadha wa asili ya Masihi, “anatoka” huwasilisha kwa kawaida maana ya kuja kutoka katika ukoo na mahali fulani.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni jina la cheo la mkombozi-mfalme aliyetarajiwa katika mjadala wa Kiyahudi; “Masihi” huonyesha kazi hiyo ya cheo badala ya kulifanya neno kuwa jina binafsi.
theological_decisions:
- issue: Tafsiri ya Χριστός kama jina la cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu watu wanajadili asili ya yule mfalme-mkombozi aliyeahidiwa. “Masihi” huhifadhi maana ya cheo hicho; “Kristo” limetolewa katika tanbihi kama tafsiri mbadala iliyozoeleka.
- issue: Maana ya mahali ambapo Daudi “alikuwa”
  choice: alikokuwa Daudi
  alternative: alikoishi Daudi / alikotoka Daudi
  rationale: Kigiriki hakibainishi wazi ikiwa maana ni mahali alipoishi au alikotoka. Tafsiri kuu inadumisha kutobainishwa huko badala ya kuchagua ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limehifadhiwa kwa “Je ... hayasemi?”; maneno ya kawaida “uzao,” “kijiji,” na “Masihi” yanasaidia usomaji wa wazi bila kuongeza maelezo yasiyomo katika chanzo.
