translation:
  language: sw
  text: Walinzi wakajibu, “Kamwe mtu[a] hajawahi kusema hivi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kamwe hakuna yeyote aliyewahi kusema hivi.” Kigiriki kina neno “mtu” katika umoja, likitumiwa kwa maana wakilishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: wakajibu
  rationale: Kitenzi hiki katika muktadha wa mazungumzo humaanisha ‘walijibu.’ Kiunganishi cha kisimulizi wa-...-ka- kinaendeleza kwa kawaida mtiririko wa matukio katika Kiswahili.
- source_word: οἱ ὑπηρέται
  choice: walinzi
  rationale: Katika muktadha wa Yohana 7:32, 45, hawa ni watumishi rasmi waliotumwa kumkamata Yesu. ‘Walinzi’ linaeleza kazi yao kwa lugha ya kawaida bila kuongeza kwa uhakika usiotajwa kwamba walikuwa polisi wa Hekalu.
- source_word: Οὐδέποτε
  choice: Kamwe
  rationale: Neno hili linaonyesha kukanusha kabisa kwa wakati wote; ‘kamwe’ ni fupi, wazi, na la asili katika Kiswahili.
- source_word: ἐλάλησεν
  choice: hajapata kusema
  rationale: Ingawa Kigiriki kina wakati uliopita wa aoristi, muundo huu wa Kiswahili huonyesha kwa kawaida kwamba jambo hilo halijawahi kutokea hadi wakati wa kauli.
- source_word: οὕτως
  choice: hivi
  rationale: Kielezi hiki kinaeleza namna ya kusema. ‘Hivi’ ni cha asili na hakibadili maana kuwa kulinganisha Yesu na mtu mwingine.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: ‘Mtu’ ndilo neno la kawaida la Kiswahili kwa mwanadamu au mtu mmoja na linaweza kutumiwa kwa maana wakilishi kama ilivyo hapa.
theological_decisions:
- issue: Nguvu wakilishi ya ἄνθρωπος katika umoja
  choice: mtu
  alternative: yeyote
  rationale: Kigiriki kinatumia nomino ya umoja ἄνθρωπος kwa maana inayowakilisha wanadamu kwa ujumla. ‘Mtu’ huhifadhi umoja wa chanzo na ni la kawaida katika Kiswahili; ‘yeyote’ huweka wazi zaidi maana ya jumla lakini hubadili nomino kuwa kiwakilishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. ‘Walinzi’ linaeleweka kwa wasomaji wa kawaida, na ‘hajapata kusema’ huwasilisha kwa ufasaha uzoefu unaofikia wakati wa kauli.
