  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: sw
  text: Basi Wayahudi[a] wakaambiana, “Mtu huyu anakaribia kwenda wapi hata sisi tusimpate? Je, anakaribia kwenda kwa Wayahudi waliotawanyika[b] miongoni mwa Wayunani na kuwafundisha Wayunani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au, katika baadhi ya miktadha, watu wa Yudea.
    reason: lexical_alternative
  - marker: b
    text: Hawa ni Wayahudi waliokuwa wametawanyika na kuishi miongoni mwa watu wa lugha na utamaduni wa Kiyunani; si mtawanyiko wa Wayunani wenyewe.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Ni kilinganishi cha moja kwa moja na cha kawaida cha neno la Kigiriki; muktadha hautaji wazi kwamba ni viongozi pekee wala hauhitaji maana ya kieneo ya watu wa Yudea.
- source_word: πρὸς ἑαυτούς
  choice: wakaambiana
  rationale: Huwasilisha maana ya kutendeana—walisema wao kwa wao—kwa Kiswahili cha kawaida na fasaha.
- source_word: Ποῦ οὗτος
  choice: Mtu huyu ... wapi
  rationale: “Mtu huyu” huhifadhi kiasi cha sauti ya kujitenga au kudharau kilichomo katika οὗτος, badala ya kutumia kiwakilishi kisicho na mwelekeo huo.
- source_word: μέλλει πορεύεσθαι
  choice: anakaribia kwenda
  rationale: Huhifadhi wazo la jambo linalotarajiwa au lililo karibu kutokea bila kuongeza nia ambayo haijasemwa wazi.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: hata sisi tusimpate
  rationale: 'Hutoa kwa njia ya kawaida ya Kiswahili matokeo yanayofikiriwa: ataenda mahali ambapo hawatampata, bila kuongeza dhana ya kutokuwa na uwezo.'
- source_word: μὴ
  choice: Je, anakaribia ...?
  rationale: Muundo wa swali wenye “Je” huwasilisha swali la kubashiri ambalo katika Kigiriki linatarajia jibu la kukataa; Kiswahili hakihitaji kuongeza kishazi cha mkia kisicho cha kawaida.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: kwa Wayahudi waliotawanyika miongoni mwa Wayunani
  rationale: Huweka wazi kwa msomaji wa kawaida kwamba διασπορά inawahusu Wayahudi waliotawanyika na kwamba wako miongoni mwa Wayunani, si kwamba Wayunani wenyewe ndio waliotawanyika.
- source_word: Ἕλληνας
  choice: Wayunani
  rationale: Huhifadhi maana ya msingi ya kikabila na kitamaduni ya neno la Kigiriki bila kuipanua kimyakimya kuwa watu wote wasio Wayahudi.
- source_word: καὶ διδάσκειν τοὺς Ἕλληνας
  choice: na kuwafundisha Wayunani
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na inayohifadhi kejeli isiyokusudiwa ya ubashiri wao.
theological_decisions:
- issue: Maana ya Ἰουδαῖοι katika simulizi la Yohana
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: Mstari huu haulazimishi maana ya kieneo, wala hautaji kwamba wanaosema ni viongozi pekee. “Wayahudi” huhifadhi upana wa neno la Kigiriki, huku uwezekano wa “watu wa Yudea” ukibainishwa katika tanbihi.
- issue: Utambulisho wa διασπορά
  choice: Wayahudi waliotawanyika miongoni mwa Wayunani
  alternative: mtawanyiko miongoni mwa Wayunani
  rationale: Tafsiri ya wazi huepusha dhana potovu kwamba ni Wayunani waliotawanyika, huku ikihifadhi tofauti kati ya Wayahudi wa ughaibuni na Wayunani ambao Yesu angeweza kuwafundisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakaambiana” ni ya asili kuliko “wakasema wao kwa wao.” “Wayunani” limetumiwa kuhifadhi marejeo ya kikabila na kitamaduni ya Ἕλληνες; ufafanuzi wa diaspora umewekwa katika maandishi na tanbihi kwa uwazi wa msomaji wa kawaida.
