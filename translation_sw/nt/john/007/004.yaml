  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: sw
  text: Kwa maana hakuna mtu anayefanya chochote kwa siri huku yeye mwenyewe akitaka kuonekana hadharani.[a] Ikiwa unafanya mambo haya, jionyeshe kwa ulimwengu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujulikana wazi” au “kuwa wazi mbele ya watu.” Usemi wa Kigiriki unasisitiza uwazi au kuonekana mbele ya watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: Kwa maana hakuna mtu
  rationale: ‘Kwa maana’ huhifadhi kazi ya γάρ ya kueleza kauli iliyotangulia, na ‘hakuna mtu’ ni tafsiri ya kawaida na ya moja kwa moja ya οὐδεὶς.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: anayefanya jambo kwa siri
  rationale: ‘Jambo’ huwakilisha kiwakilishi kisichodhihirishwa τι, na ‘kwa siri’ huwasilisha nahau ya ἐν κρυπτῷ kwa Kiswahili cha kawaida.
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: huku yeye mwenyewe akitaka kuonekana hadharani
  rationale: ‘Huku’ huonyesha mvutano kati ya kutenda kwa siri na kutaka uwazi wa hadharani; ‘yeye mwenyewe’ huhifadhi msisitizo wa αὐτός. Katika muktadha huu παρρησία linahusu hali ya kuonekana wazi mbele ya watu kuliko ujasiri wa kusema.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Ikiwa unafanya mambo haya
  rationale: Huhifadhi sharti la kawaida la Kigiriki bila kulifanya kuwa hakika wala kuliongezea maana.
- source_word: φανέρωσον σεαυτὸν
  choice: jionyeshe
  rationale: Amri hii fupi na ya moja kwa moja inafaa kwa wito wa kujidhihirisha wazi, huku ikihifadhi nguvu ya kitenzi cha Kigiriki.
- source_word: τῷ κόσμῳ
  choice: kwa ulimwengu
  rationale: ‘Ulimwengu’ huhifadhi istilahi muhimu ya Kiyohana κόσμος na mwangwi wake mpana badala ya kuifupisha kuwa ‘umma’ pekee.
theological_decisions:
- issue: Maana ya κόσμος katika muktadha wa Yohana
  choice: ulimwengu
  alternative: umma / watu wote
  rationale: Ingawa muktadha unahusu kujitokeza hadharani, ‘ulimwengu’ huhifadhi msamiati unaorudiwa katika Yohana na mvutano wake wa kifasihi na kitheolojia bila kuamua maana yake kwa ufafanuzi wa ziada.
- issue: Maana ya ἐν παρρησίᾳ εἶναι
  choice: kuonekana hadharani
  alternative: kujulikana wazi / kuwa wazi mbele ya watu
  rationale: Muktadha unatofautisha siri na udhihirisho wa umma. Tafsiri iliyochaguliwa inatoa maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi upana wa usemi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja lakini wa asili; ‘huku yeye mwenyewe’ huhifadhi msisitizo na tofauti iliyomo katika Kigiriki. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
