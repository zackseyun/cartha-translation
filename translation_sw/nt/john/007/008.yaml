  naturalness: ‘Ninyi nendeni kwenye sikukuu; mimi siendi kwenye sikukuu hii’ ni Kiswahili Sanifu cha sasa, wazi, na kinaendana na matumizi ya kawaida. Mwelekeo wa ‘kwenda juu’ katika ἀναβαίνω hauna kielelezo cha kawaida kisicho cha ziada katika Kiswahili hapa; ‘kwenda kwenye’ huhifadhi tendo la kuelekea kwenye sikukuu bila kuongeza ‘Yerusalemu’ ambayo haimo katika mstari.
