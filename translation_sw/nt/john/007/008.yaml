  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: sw
  text: Ninyi nendeni kwenye sikukuu. Mimi siendi kwenye sikukuu hii[a], kwa sababu wakati wangu bado haujatimia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “Mimi bado siendi kwenye sikukuu hii.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀνάβητε
  choice: pandeni kwenda
  rationale: Inahifadhi maana ya kuelekea juu, yaani kwenda Yerusalemu kwa ajili ya Sikukuu, huku ikiwa kauli ya kawaida na inayoeleweka katika Kiswahili.
- source_word: ἑορτή
  choice: Sikukuu
  rationale: Neno hili linafaa kwa sikukuu ya kidini inayozungumziwa katika muktadha wa Yohana.
- source_word: οὐκ ἀναβαίνω
  choice: sipandi kwenda
  rationale: Inafuata usomaji wa SBLGNT οὐκ, ‘si-/sio,’ bila kuongeza ‘bado’ katika matini kuu; hali ya sasa pia inaweza kutumika kwa tendo linalokusudiwa mara hiyo.
- source_word: ταύτην
  choice: hii
  rationale: Inaonyesha wazi Sikukuu maalumu inayozungumziwa.
- source_word: καιρός
  choice: wakati
  rationale: Ni tafsiri fupi na ya kawaida inayobaki wazi kwa maana ya wakati unaofaa au uliowekwa.
- source_word: πεπλήρωται
  choice: haujatimia
  rationale: Inahifadhi dhana ya kufikia utimilifu katika kauli timilifu ya kutendwa, na ni ya asili zaidi kwa Kiswahili kuliko tafsiri nzito ya moja kwa moja.
theological_decisions:
- issue: Tofauti ya maandishi kuhusu kauli ya Yesu ya kwenda Sikukuu
  choice: 'Matini kuu inafuata οὐκ: “Mimi sipandi kwenda kwenye Sikukuu hii.”'
  alternative: 'Baadhi ya hati zina οὔπω: “Mimi bado sipandi kwenda kwenye Sikukuu hii.”'
  rationale: SBLGNT iliyotolewa ina οὐκ, kwa hiyo usomaji huo umefuatwa bila kuondoa mvutano unaotokea Yesu anapokwenda baadaye; tofauti muhimu imewekwa katika tanbihi.
- issue: Maana ya καιρός
  choice: wakati wangu
  alternative: wakati wangu uliowekwa
  rationale: “Wakati” huhifadhi upana wa neno la Kigiriki; “uliowekwa” ni ufafanuzi unaowezekana lakini si lazima uingizwe katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Pandeni kwenda” na “sipandi kwenda” zinadumisha mwelekeo wa kwenda juu Yerusalemu; herufi kubwa katika “Sikukuu” inaonyesha sikukuu maalumu inayozungumziwa.
