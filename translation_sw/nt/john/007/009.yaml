  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: sw
  text: Baada ya kusema hayo, yeye mwenyewe alibaki katika Galilaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: hayo
  rationale: Kiwakilishi hiki cha wingi kinarejelea mambo ambayo Yesu alikuwa ametoka kusema; “hayo” ni Kiswahili cha kawaida na huhifadhi rejeleo hilo la nyuma.
- source_word: δὲ εἰπὼν
  choice: Baada ya kusema
  rationale: Kishiriki cha wakati uliopita kinaonyesha kwamba kusema kulitangulia tendo kuu. Muundo huu wa Kiswahili unawasilisha kwa kawaida mfuatano huo wa wakati, huku δέ ikifanya kazi ya kuendeleza simulizi.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Kiwakilishi kilichotajwa wazi kinaweza kuwa na mkazo wa kulinganisha tendo la Yesu na tendo la ndugu zake katika muktadha. “Yeye mwenyewe” huhifadhi mkazo huo bila kuongeza maelezo.
- source_word: ἔμεινεν
  choice: alibaki
  rationale: Kitenzi μένω hapa kina maana ya kubaki mahali badala ya kwenda; “alibaki” ni cha asili katika simulizi na kinaendana na muktadha.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: Galilaya
  rationale: Kwa kitenzi “kubaki,” Kiswahili kinaweza kutaja mahali moja kwa moja bila kihusishi; tafsiri hii ni ya kawaida na huhifadhi rejeleo la kijiografia.
