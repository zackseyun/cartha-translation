base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: sw
  text: Kulikuwa na minong’ono mingi kumhusu miongoni mwa makundi ya watu[a]. Baadhi yao walikuwa wakisema, “Yeye ni mwema.” Lakini wengine walikuwa wakisema, “La, bali anaupotosha umati[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “manung’uniko mengi” au “mazungumzo mengi ya kunong’ona” kumhusu.
    reason: lexical_alternative
  - marker: b
    text: Au “anau­danganya umati” au “anauongoza umati upotee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: minong’ono
  rationale: Neno hili linaonyesha mazungumzo ya sauti ya chini, yenye malalamiko au kutoridhika, si mjadala wa wazi. “Minong’ono” ni Kiswahili cha kawaida kinachohifadhi hali hiyo bila kulazimisha maana ya malalamiko pekee.
- source_word: περὶ αὐτοῦ
  choice: kumhusu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya usemi unaomaanisha habari au mazungumzo yanayomhusu Yesu.
- source_word: πολύς
  choice: mingi
  rationale: Hueleza ukubwa au wingi wa minong’ono; upatanisho wa kisarufi na “minong’ono” ni wa asili katika Kiswahili.
- source_word: ἐν τοῖς ὄχλοις
  choice: miongoni mwa umati wa watu
  rationale: Huwasilisha kwamba mazungumzo yalienea miongoni mwa makundi ya watu waliokusanyika. Kiswahili hutumia kwa kawaida “umati wa watu,” hata ambapo Kigiriki kina wingi.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: Baadhi yao ... Lakini wengine ...
  rationale: Muundo huu unaonyesha makundi mawili yenye maoni yanayopingana kwa Kiswahili kilicho wazi na cha kawaida.
- source_word: Ἀγαθός
  choice: mwema
  rationale: 'Kivumishi hiki kimetafsiriwa moja kwa moja bila kuongeza nomino “mtu,” hivyo kuhifadhi ufupi wa Kigiriki: “Yeye ni mwema.”'
- source_word: Οὔ, ἀλλὰ
  choice: Sivyo; badala yake,
  rationale: Huonyesha kwanza kukataa dai lililotangulia, kisha kulisahihisha kwa dai linalopingana nalo.
- source_word: πλανᾷ
  choice: anaupotosha
  rationale: Kitenzi kinaweza kumaanisha kudanganya, kupotosha, au kuongoza katika njia isiyofaa. “Anaupotosha” huhifadhi wazo pana la kupeleka umati katika kosa bila kuamua wazi nia ya udanganyifu.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: Ni usemi wa pamoja unaorejelea kundi kubwa la watu na unaonyesha mabadiliko ya Kigiriki kutoka wingi mapema hadi umoja hapa.
theological_decisions:
- issue: Maoni yanayokinzana kuhusu tabia na kazi ya Yesu
  choice: 'Kauli zote mbili zimeripotiwa moja kwa moja na bila kuzisawazisha: “Yeye ni mwema” na “anaupotosha umati.”'
  alternative: Kufafanua mojawapo kuwa sahihi au kudhoofisha dai hasi.
  rationale: Mstari unaripoti mgawanyiko wa maoni ya watu, wala msimulizi hatamki hapa kwamba kauli mojawapo ni hukumu yake mwenyewe. Tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Minong’ono” huhifadhi hali ya mazungumzo ya sauti ya chini; “anaupotosha” huepuka kuamua kama mkazo ni nia ya kudanganya au matokeo ya kuwaongoza watu katika kosa.
