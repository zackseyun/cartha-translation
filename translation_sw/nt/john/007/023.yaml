  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: sw
  text: Ikiwa mwanamume anatahiriwa[a] siku ya Sabato ili sheria ya Musa isivunjwe[b], je, mnanikasirikia kwa sababu nilimfanya mtu awe mzima kabisa[c] siku ya Sabato?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya neno kwa neno, Kigiriki kinasema, “anapokea tohara.”
    reason: lexical_alternative
  - marker: b
    text: Au “isitenguliwe” au “isibatilishwe.”
    reason: lexical_alternative
  - marker: c
    text: Maneno “mtu awe mzima kabisa” yanakazia tofauti kati ya kutahiri sehemu moja ya mwili na kumrejesha mtu mzima kwa ukamilifu.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: anatahiriwa
  rationale: Ingawa nahau ya Kigiriki kwa neno moja moja ni ‘anapokea tohara,’ Kiswahili cha kawaida na sahihi husema ‘anatahiriwa.’ Hali ya kutendwa imehifadhiwa.
- source_word: ἄνθρωπος
  choice: mwanamume / mtu
  rationale: Katika sehemu ya kwanza ‘mwanamume’ inafaa kwa sababu tohara ya kiume ndiyo inayozungumziwa. Katika sehemu ya pili ‘mtu’ ni ya kawaida na inawasilisha kwamba Yesu alimrejesha mtu huyo kwa ukamilifu, bila kulazimisha maana ya ‘mwanamume mzima’ inayoweza kueleweka kuwa mtu aliyekomaa.
- source_word: ἐν σαββάτῳ
  choice: siku ya Sabato
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha wakati na inaeleweka kuwa ni siku ya Sabato.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: ili sheria ya Musa isivunjwe
  rationale: Kitenzi λύω katika muktadha wa sheria kinaweza kumaanisha kuvunja, kutangua, au kubatilisha. ‘Isivunjwe’ ni wazi na ya kawaida, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: χολᾶτε
  choice: mnanikasirikia
  rationale: Kitenzi hiki kinaonyesha hasira au ghadhabu. ‘Mnanikasirikia’ ni Kiswahili cha moja kwa moja na huhifadhi nafsi ya pili wingi ya Kigiriki.
- source_word: ὅλον ἄνθρωπον
  choice: mtu ... mzima kabisa
  rationale: Usemi huu unahifadhi mkazo wa mtu mzima kwa ukamilifu, kinyume na tendo linalohusu sehemu moja ya mwili. Muundo huu pia huepuka ‘mwanamume mzima,’ ambao kwa Kiswahili unaweza kumaanisha mtu aliyefikia utu uzima.
- source_word: ὑγιῆ ἐποίησα
  choice: nilimfanya ... awe mzima
  rationale: Muundo huu unafuata kwa karibu ‘nilimfanya awe mwenye afya/mzima’ na kuhifadhi mchezo wa maana kati ya ὅλον na ὑγιῆ vizuri kuliko kitenzi rahisi ‘nilimponya.’
theological_decisions:
- issue: Maana ya kulinganisha tohara na uponyaji siku ya Sabato
  choice: Yesu anatumia desturi inayokubalika ya kumtahiri mwanamume siku ya Sabato ili sheria ya Musa isivunjwe, kisha anaonyesha uhalali mkubwa zaidi wa kumrejesha mtu mzima kabisa siku hiyo.
  alternative: Yesu analinganisha sheria ya ibada na tendo la huruma kwa maana ya jumla.
  rationale: Hoja ya mstari inategemea tofauti kati ya tendo linalohusu sehemu moja ya mwili na kumfanya mtu mzima kabisa awe na afya. Tafsiri inahifadhi hoja hiyo bila kudokeza kwamba Yesu anaibatilisha sheria ya Musa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Mnanikasirikia’ huhifadhi wingi wa wasikilizaji; ‘mtu awe mzima kabisa’ huhifadhi kwa kadiri inayowezekana mkazo na mvutano wa maneno ya Kigiriki bila kuleta maana isiyokusudiwa ya mtu aliyekomaa.
