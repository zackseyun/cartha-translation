  text: Nikodemo[a], yule aliyemwendea hapo awali, akiwa mmoja wao, aliwaambia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyemwendea kabla.” Kiwakilishi katika “alimwendea” kinamrejelea Yesu kulingana na muktadha mpana.
