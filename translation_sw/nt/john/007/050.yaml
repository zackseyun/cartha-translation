lexical_decisions:
- source_word: λέγει
  choice: akawaambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa masimulizi, Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita. Kiambishi -wa- kinajumuisha walengwa wa usemi na kutoa mtiririko wa asili.
- source_word: Νικόδημος
  choice: Nikodemo
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: πρὸς αὐτούς
  choice: akawaambia
  rationale: Baada ya kitenzi cha kusema, πρός pamoja na hali ya kushutumiwa humtambulisha anayesemeshwa; maana ya 'kwao' imeunganishwa kwa kawaida katika kitenzi cha Kiswahili.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: yule aliyekuwa amemwendea hapo awali
  rationale: Kirai cha kisifa kinamtambulisha Nikodemo. 'Alikuwa amemwendea' huonyesha tendo lililotangulia tendo kuu, huku 'hapo awali' ikihifadhi maana ya πρότερον.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: akiwa mmoja wao
  rationale: Muundo huu huhifadhi kirai tegemezi cha Kigiriki kama taarifa ya usuli bila kukifanya kuwa sababu.
theological_decisions:
- issue: Mrejelewa wa αὐτόν katika kirai kinachosema Nikodemo alimwendea mtu fulani hapo awali
  choice: Kiwakilishi cha yambwa 'm-' kimehifadhiwa katika 'amemwendea,' na tanbihi inafafanua kuwa kinamrejelea Yesu kulingana na muktadha.
  alternative: 'Kutaja Yesu moja kwa moja katika matini kuu: ''aliyekuwa amemwendea Yesu hapo awali.'''
  rationale: Yohana 3:1–2 humtambulisha Yesu wazi kuwa ndiye aliyefikiwa na Nikodemo, lakini matini ya Kigiriki hapa yenyewe ina kiwakilishi. Tafsiri inahifadhi umbo hilo badala ya kuongeza jina katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umehifadhi muundo wa Kigiriki unaolitambulisha jina kwa virai viwili vya ziada; koma ya mwisho inaonyesha kuwa usemi wa Nikodemo unaendelea katika mstari unaofuata.
