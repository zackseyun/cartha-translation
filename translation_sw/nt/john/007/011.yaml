id: JHN.7.11
reference: John 7:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: sw
  text: Basi Wayahudi[a] walikuwa wakimtafuta katika sikukuu hiyo na walikuwa wakisema, “Yuko wapi huyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yudea”; katika muktadha wa simulizi la Yohana, huenda neno hili linawarejelea hasa viongozi wa Kiyahudi wa Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kuonyesha matokeo au mwendelezo wa yaliyotangulia; “Basi” ni cha kawaida na chenye uzito unaofaa katika Kiswahili.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo neno la moja kwa moja na lisilobana maana kwa viongozi pekee. Kwa kuwa katika Yohana linaweza pia kumaanisha watu wa Yudea au viongozi wa Kiyahudi kulingana na muktadha, uwezekano huo umewekwa katika tanbihi.
- source_word: ἐζήτουν
  choice: walikuwa wakimtafuta
  rationale: Muundo wa wakati usiotimilika unaonyesha tendo lililokuwa likiendelea wakati wa sikukuu; “walikuwa wakimtafuta” huhifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: ἐν τῇ ἑορτῇ
  choice: katika sikukuu hiyo
  rationale: Neno lenye kibainishi linarejelea sikukuu ambayo tayari imetajwa katika muktadha; “sikukuu hiyo” huonyesha rejeo hilo wazi.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Muundo huu huhifadhi hali endelevu au inayojirudia ya kitenzi cha Kigiriki bila kuongeza wazo la marudio ya mara nyingi kuliko maandishi yanavyosema.
- source_word: ἐκεῖνος
  choice: huyo
  rationale: Kiwakilishi “huyo” ni cha asili katika swali hili na huhifadhi umbali au mtazamo wa kumtaja mtu pasipo kutumia jina, bila kuongeza nomino kama “mtu” au “mwanaume.”
theological_decisions:
- issue: Rejeo la Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi katika matini kuu
  alternative: watu wa Yudea; au, kwa kuzingatia muktadha, viongozi wa Kiyahudi wa Yudea
  rationale: Aya yenyewe haitaji wazi kundi dogo kama viongozi. Matini kuu kwa hiyo haibani maana, huku tanbihi ikihifadhi uwezekano wa maana maalumu zaidi katika simulizi la Yohana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “walikuwa waki-” yamehifadhi hali ya kuendelea ya vitenzi vyote viwili vya Kigiriki, na “huyo” limechaguliwa ili kuwasilisha ἐκεῖνος kwa kawaida bila kuongeza maana.
