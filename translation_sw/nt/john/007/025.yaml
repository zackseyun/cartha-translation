  text: Basi baadhi ya wakazi wa Yerusalemu walikuwa wakisema, “Je, huyu si ndiye wanayetafuta kumuua?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: wakawa wakisema
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha usemi uliokuwa ukiendelea au kurudiwa katika tukio; muundo huu unaakisi hali hiyo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Basi
  rationale: Huunganisha simulizi hili na yaliyotangulia kwa namna ya kawaida na yenye hadhi katika Kiswahili.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: baadhi ya wakazi wa Yerusalemu
  rationale: Kirai hiki kinamaanisha watu fulani kutoka miongoni mwa wenyeji wa Yerusalemu; tafsiri hii ni sahihi na ya asili bila kuhitaji tanbihi.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Je, huyu si yule
  rationale: Swali hasi linatarajia jibu la kukubali; muundo huu huhifadhi nguvu yake ya balagha.
- source_word: ζητοῦσιν
  choice: wanayetafuta
  rationale: Wakati uliopo unaonyesha nia au jitihada inayoendelea.
- source_word: ἀποκτεῖναι
  choice: kumuua
  rationale: Hili ndilo maana ya moja kwa moja ya kitenzi, bila kuongeza dhana ya hukumu rasmi ya kifo.
