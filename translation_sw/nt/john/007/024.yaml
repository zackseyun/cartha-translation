  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: sw
  text: Msihukumu kwa mwonekano wa nje[a], bali toeni hukumu ya haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Msihukumu kwa jinsi mambo yanavyoonekana kwa nje.”'
    reason: 'Mbadala huu hueleza maana pana ya κατ’ ὄψιν: kuhukumu kwa kutegemea kile kinachoonekana kwa nje.'
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Msihukumu
  rationale: Kitenzi cha amri pamoja na μή kinatoa katazo. “Msihukumu” ni tafsiri fupi na ya kawaida inayodumisha nguvu ya amri bila kulazimisha maana ya kwamba tendo hilo lilikuwa tayari linaendelea.
- source_word: κατ’ ὄψιν
  choice: kwa kutazama sura ya nje
  rationale: Kirai hiki kinamaanisha kuhukumu kwa msingi wa mwonekano wa nje au hali inavyoonekana juu juu. Tafsiri hii ni ya asili katika Kiswahili na inaweka wazi msingi usiofaa wa hukumu.
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” linaonyesha wazi tofauti kali kati ya namna ya kuhukumu iliyokatazwa na hukumu iliyoamriwa.
- source_word: τὴν δικαίαν κρίσιν
  choice: hukumu ya haki
  rationale: Hifadhi nomino κρίσις kama “hukumu” na sifa δικαία kama “ya haki.” Usemi huu ni wa kawaida katika Kiswahili na hudumisha maana ya kimaadili na kimahakama bila kuibana kuwa usawa wa kiutaratibu pekee.
- source_word: κρίνετε
  choice: toeni hukumu
  rationale: “Toeni hukumu” ni namna ya kawaida ya Kiswahili ya kueleza kitendo cha kutoa uamuzi. Pia inadumisha mwangwi wa mzizi uleule wa kuhukumu katika vifungu vyote viwili.
theological_decisions:
- issue: Maana ya δικαίαν katika muktadha wa kimaadili na kimahakama
  choice: ya haki
  alternative: ya uadilifu
  rationale: “Ya haki” ni usemi wa kawaida na mpana unaoweza kujumuisha usahihi wa kimaadili na uamuzi wa haki, bila kuingiza fundisho maalumu la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Katazo na amri zimewekwa katika wingi kama ilivyo katika Kigiriki.
