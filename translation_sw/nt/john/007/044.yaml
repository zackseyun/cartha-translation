  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: sw
  text: Lakini baadhi yao walitaka kumkamata, ila hakuna mtu aliyemshika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Lakini baadhi yao
  rationale: “Baadhi” linaonyesha kundi lisilotajwa kwa majina ndani ya umati, huku “lakini” likihifadhi utofauti na maoni yaliyotangulia.
- source_word: ἤθελον
  choice: walitaka
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha nia yao ya wakati huo bila kudai kwamba tendo lilitekelezwa.
- source_word: ἐξ αὐτῶν
  choice: yao
  rationale: Katika “baadhi yao,” maana ya watu waliotoka miongoni mwa kundi hilo inawasilishwa kwa ufupi na kwa kawaida.
- source_word: πιάσαι αὐτόν
  choice: kumkamata
  rationale: Katika muktadha huu kitenzi kinaonyesha kumtia mtu mikononi kwa nia ya kumzuia au kumweka chini ya ulinzi; “kumkamata” ni la kawaida na linafaa kuliko tafsiri isiyo ya kawaida ya kushika tu.
- source_word: ἀλλ’ οὐδεὶς
  choice: ila hakuna mtu
  rationale: “Ila” linaonyesha kwa wazi tofauti kati ya nia yao na matokeo, na “hakuna mtu” linahifadhi ukanushi kamili.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: aliyemwekea mikono
  rationale: Linahifadhi taswira ya nahau ya Kigiriki ya kumwekea mtu mikono kwa nguvu, ambayo katika muktadha ina maana ya kumtia nguvuni.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia “kumkamata” kwa nia ya πιάσαι, huku kishazi cha pili kikihifadhi nahau ya asili “kumwekea mikono.” Hakuna tanbihi inayohitajika kwa kuwa maana ya “miongoni mwao” imo kwa kawaida katika “baadhi yao,” na maana ya kukamata imewasilishwa moja kwa moja.
