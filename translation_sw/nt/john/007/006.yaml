  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: sw
  text: Basi Yesu akawaambia, “Wakati wangu bado haujafika,[a] lakini wakati wenu daima uko tayari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakati wangu uliowekwa bado haujafika.” Neno la Kigiriki linaweza kumaanisha wakati unaofaa au uliowekwa, si muda wa kawaida tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha kuwa maneno ya Yesu yanafuata kama jibu au hitimisho kutokana na yaliyotangulia, bila kufanya uhusiano huo kuwa mzito kupita kiasi.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: Yesu akawaambia
  rationale: Ingawa kitenzi cha Kigiriki kiko katika wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi ni wa kawaida na wa asili katika Kiswahili.
- source_word: αὐτοῖς
  choice: akawaambia
  rationale: Kiambishi -wa- kinawakilisha kwa kawaida walengwa wa maneno ya Yesu bila kuwataja kwa ufafanuzi usiokuwamo katika aya.
- source_word: καιρός
  choice: wakati
  rationale: Hapa neno linaweza kumaanisha wakati unaofaa au uliowekwa, si muda kwa ujumla tu. “Wakati” ni neno la kawaida linalohifadhi upana huo; maana iliyo wazi zaidi imewekwa katika tanbihi.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: Wakati wangu
  rationale: Inahifadhi msisitizo wa umilikaji kwa Kiswahili cha kawaida bila kuongeza maelezo ya kiteolojia.
- source_word: οὔπω πάρεστιν
  choice: bado haujafika
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kwamba wakati unaohusika haujawadia mpaka sasa.
- source_word: δὲ
  choice: lakini
  rationale: Inaonyesha wazi utofauti kati ya wakati wa Yesu na wakati wa wale anaosema nao.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: wakati wenu
  rationale: Inalingana na “wakati wangu” na kuhifadhi ulinganisho wa moja kwa moja wa maandishi ya Kigiriki.
- source_word: πάντοτέ
  choice: sikuzote
  rationale: Ni kielezi cha kawaida kinachomaanisha wakati wote au daima.
- source_word: ἕτοιμος
  choice: uko tayari
  rationale: Inawakilisha moja kwa moja maana ya kuwa tayari, huku ikihifadhi usemi wenye mvutano wa “wakati” kuwa tayari.
theological_decisions:
- issue: Maana ya “wakati” wa Yesu katika muktadha wa Yohana
  choice: Wakati wangu
  alternative: Wakati wangu uliowekwa; Saa yangu
  rationale: Aya hii ina καιρός, si ὥρα. Tafsiri haibadili neno kuwa “saa” wala kueleza moja kwa moja kuwa ni wakati wa utukufu au kifo cha Yesu; hivyo inadumisha maana pana na mvutano wa kiteolojia wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku marudio ya “wakati wangu ... wakati wenu” yakihifadhi ulinganisho wa maandishi ya asili.
