id: JHN.7.19
reference: John 7:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: sw
  text: Je, Musa hakuwapa sheria?[a] Lakini hakuna hata mmoja wenu anayeishika sheria.[b] Kwa nini mnatafuta kuniua?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, Musa hajawapa sheria?” Wakati timilifu wa Kigiriki unaweza pia kutafsiriwa kwa namna hii.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “anayeitenda sheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: Je, ... hakuwapa
  rationale: Muundo wa swali hasi unatarajia jibu la kukubali. Wakati timilifu wa Kigiriki unaonyesha tendo la kutoa lenye matokeo yanayoendelea, lakini kwa Musa kama mtu wa kihistoria, wakati uliopita ni wa kawaida na wazi katika Kiswahili.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: τὸν νόμον
  choice: sheria
  rationale: Hapa neno hili linarejelea sheria iliyotolewa kupitia Musa. ‘Sheria’ ni neno la kawaida na linaloeleweka kwa urahisi; muktadha unaonyesha kuwa ni sheria ya Musa.
- source_word: καὶ
  choice: Lakini
  rationale: Ingawa kwa kawaida humaanisha ‘na’, hapa linaonyesha tofauti kati ya kupewa sheria na kutoiishika.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: hakuna hata mmoja wenu
  rationale: Huhifadhi msisitizo wa ukanushaji kamili kwa Kiswahili cha kawaida.
- source_word: ποιεῖ τὸν νόμον
  choice: anayeishika sheria
  rationale: Kwa maana halisi ni ‘anayeitenda sheria’, lakini ‘kuishika sheria’ ni usemi wa kawaida wa Kiswahili unaomaanisha kuitii au kuifuata.
- source_word: τί
  choice: Kwa nini
  rationale: Katika muundo huu wa swali, neno hili linauliza sababu.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: mnatafuta kuniua
  rationale: Huhifadhi wazo la nia au jitihada inayoendelea lililo katika wakati wa sasa wa kitenzi cha Kigiriki, bila kulifanya kuwa wazi zaidi ya maandishi.
- source_word: ἀποκτεῖναι
  choice: kuniua
  rationale: Hili ni neno la moja kwa moja na la kawaida kwa kitendo cha kumuua mtu.
theological_decisions:
- issue: Rejeleo la ‘sheria’
  choice: Sheria ya Musa iliyotolewa kwa Israeli
  alternative: Sheria kwa maana ya jumla ya maadili
  rationale: Kwa kuwa Yesu anamtaja Musa wazi kuwa ndiye aliyewapa sheria, rejeleo ni sheria ya Musa, si sheria kwa maana ya jumla. Tafsiri haiongezi ufafanuzi huo ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kuishika sheria’ ni usemi wa kawaida na unaoeleweka, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kigiriki.
