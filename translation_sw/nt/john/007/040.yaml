  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: sw
  text: Kwa hiyo, baadhi ya watu katika umati waliposikia maneno hayo, walikuwa wakisema, “Huyu kweli ndiye yule Nabii[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yule Nabii” huenda inamrejelea nabii aliyetazamiwa aliye kama Musa (tazama Kumbukumbu la Torati 18:15), ingawa baadhi ya watafsiri wanaelewa usemi huo kwa maana ya jumla zaidi, “nabii.”
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: baadhi ya watu katika umati
  rationale: Kirai hiki kinaonyesha sehemu ya umati, si umati wote. Tafsiri hii inaweka wazi maana hiyo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha mwendelezo wenye matokeo kutoka katika maneno yaliyotangulia, wala si mfuatano wa wakati tu.
- source_word: ἀκούσαντες
  choice: waliposikia
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; ‘waliposikia’ ni la asili na linahifadhi uhusiano huo wa wakati.
- source_word: τῶν λόγων τούτων
  choice: maneno hayo
  rationale: Hurejelea maneno ambayo Yesu alikuwa ametoka kusema; ‘maneno hayo’ ni wazi na ya kawaida katika muktadha huu.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha usemi uliokuwa ukiendelea au kurudiwa miongoni mwa watu; muundo huu unahifadhi hali hiyo.
- source_word: Οὗτός ἐστιν
  choice: Huyu ... ndiye
  rationale: Kiwakilishi hiki kinamwelekeza Yesu moja kwa moja na kwa msisitizo; ‘Huyu ndiye’ ni muundo wa asili wa Kiswahili.
- source_word: ἀληθῶς
  choice: kweli
  rationale: Neno hili linasisitiza kwamba dai hilo ni la hakika; ‘kweli’ lina uzito unaofaa na linaeleweka kwa urahisi.
- source_word: ὁ προφήτης
  choice: yule Nabii
  rationale: Kibainishi cha Kigiriki na muktadha wa Yohana vinaelekeza kwa mtu maalumu aliyekuwa akitazamiwa. ‘Yule Nabii’ linaonyesha nguvu ya jina la cheo bila kumtambulisha moja kwa moja kuwa Masihi.
theological_decisions:
- issue: Utambulisho unaodokezwa na ὁ προφήτης
  choice: Kutafsiri kama jina lenye nguvu ya cheo, ‘yule Nabii,’ bila kulifanya kuwa utambulisho wa wazi na Masihi katika matini kuu.
  alternative: ‘nabii huyo’ kwa maana ya jumla, au kumtambulisha Nabii huyo moja kwa moja kuwa Masihi.
  rationale: Kauli ya umati huenda inadokeza tumaini la nabii aliye kama Musa katika Kumbukumbu la Torati 18:15, lakini aya yenyewe haifafanui cheo hicho wala kukisawazisha waziwazi na Masihi. Tafsiri inadumisha mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘walikuwa wakisema’ umetumiwa kwa makusudi kuhifadhi hali endelevu au ya kurudiwa ya kitenzi cha Kigiriki, huku ‘yule Nabii’ likidumisha upekee na mvuto wa cheo hicho.
