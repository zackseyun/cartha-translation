  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: sw
  text: Lakini tunajua huyu anakotoka; lakini Masihi[a] atakapokuja, hakuna mtu anayejua anakotoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: Kristo.'
    reason: Tafsiri mbadala ya cheo cha Kigiriki χριστός; “Masihi” huonyesha maana ya cheo, na “Kristo” ni umbo jingine lililozoeleka.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofauti na mazungumzo yaliyotangulia kwa lugha ya kawaida na ya moja kwa moja.
- source_word: τοῦτον
  choice: huyu
  rationale: Kiwakilishi hiki kinamrejelea Yesu moja kwa moja na kinahifadhi msisitizo wa usemi wa Kigiriki bila kuongeza neno lisilohitajika.
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Ni tafsiri ya kawaida ya ujuzi ambao wasemaji wanadai kuwa nao.
- source_word: πόθεν ἐστίν
  choice: anakotoka
  rationale: Kiswahili hiki cha asili kinaeleza mahali au asili ya mtu na kinadumisha urudiaji wa wazo hilo katika vifungu vyote viwili.
- source_word: ὁ δὲ χριστός
  choice: lakini Masihi
  rationale: χριστός hapa ni cheo cha yule mkombozi anayetarajiwa, hivyo “Masihi” huhifadhi mazingira ya Kiyahudi; “lakini” huendeleza utofauti wa sentensi.
- source_word: ὅταν ἔρχηται
  choice: atakapokuja
  rationale: Muundo huu wa Kiswahili unaonyesha tukio la wakati ujao linalotarajiwa bila kulifanya kuwa la wakati uliokwisha kuamuliwa kwa maelezo ya ziada.
- source_word: οὐδεὶς γινώσκει
  choice: hakuna mtu anayejua
  rationale: Ni usemi wa kawaida unaohifadhi ukanushaji wa jumla na maana ya kujua.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika kauli hii neno hilo linamtaja mhusika wa Kimasihi anayetarajiwa, si jina la kawaida; “Masihi” huonyesha wazi kazi yake kama cheo.
- issue: Dai la umati kuhusu asili ya Masihi
  choice: Kauli imetafsiriwa moja kwa moja bila kuidhinisha au kuisahihisha
  alternative: Kuongeza maelezo kwamba hili ni wazo au kutoelewa kwa umati
  rationale: Mstari unaripoti maneno ya watu. Tafsiri inahifadhi mvutano wa simulizi bila kuingiza ufafanuzi wa kitheolojia katika matini.
- issue: Maana ya πόθεν
  choice: anakotoka
  alternative: anatoka wapi
  rationale: Chaguo hili linadumisha uwezekano wa kurejelea mahali anapotoka au asili yake kwa upana, bila kuamua jambo ambalo Kigiriki hakiamui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo “tunajua huyu anakotoka” ni wa kawaida na unaweka msisitizo kwa “huyu”; urudiaji wa “lakini” unahifadhi utofauti unaorudiwa katika chanzo.
