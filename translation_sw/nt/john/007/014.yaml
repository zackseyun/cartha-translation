  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: sw
  text: Sikukuu ilipokuwa tayari katikati[a], Yesu alipanda hadi hekaluni[b], akawa akifundisha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilipokuwa karibu katikati ya sikukuu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “hekaluni” hapa ni ἱερόν, yaani eneo au viwanja vya hekalu, si hasa patakatifu pa ndani.
    reason: cultural_note
  - marker: c
    text: Au, “alikuwa akifundisha.” Hali ya kitenzi cha Kigiriki inaweza kukazia kwamba tendo hilo lilikuwa likiendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: tayari
  rationale: Huonyesha kwamba hatua hiyo ya sikukuu ilikuwa tayari imefikiwa; “tayari” ni Kiswahili cha kawaida na kifupi.
- source_word: δὲ
  choice: haikutafsiriwa kwa neno la pekee
  rationale: Hapa ni kiunganishi hafifu cha kuendeleza simulizi, si tofauti yenye mkazo. Mtiririko wa sentensi ya Kiswahili unatosha bila kuongeza “basi” au “lakini”.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: Sikukuu ilipokuwa ... imefika katikati
  rationale: Muundo huu unaonyesha wakati wa tukio na hali ya sikukuu kuwa katikati yake, bila kuamua kwa usahihi zaidi ya Kigiriki.
- source_word: ἀνέβη
  choice: alipanda kwenda
  rationale: Huhifadhi wazo la kwenda juu lililomo katika ἀναβαίνω na linasikika kwa kawaida katika muktadha wa kwenda hekaluni.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: εἰς τὸ ἱερὸν
  choice: kwenda hekaluni
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuingia katika eneo la hekalu; tanbihi inafafanua kwamba ἱερόν ni eneo zima la hekalu, si patakatifu pa ndani pekee.
- source_word: ἐδίδασκεν
  choice: akawa akifundisha
  rationale: Huonyesha tendo lililokuwa likiendelea wakati uliopita, kama inavyoweza kudokezwa na hali ya kitenzi cha Kigiriki, bila kulifanya kuwa tendo la mara moja.
theological_decisions:
- issue: Maana ya ἱερόν
  choice: hekalu likieleweka kuwa eneo au viwanja vya jengo la hekalu
  alternative: patakatifu pa ndani ya hekalu
  rationale: Neno ἱερόν hutaja eneo pana la hekalu, tofauti na ναός, ambalo mara nyingi hutaja jengo au patakatifu pa ndani. Tofauti hii ni ya kileksia na kitamaduni, si ya kimadhehebu.
- issue: Nguvu ya hali ya kitenzi ἐδίδασκεν
  choice: akawa akifundisha
  alternative: akaanza kufundisha
  rationale: Hali isiyotimilifu inaonyesha tendo linaloendelea, lakini yenyewe hailazimishi maana ya kuanza; kwa hiyo tafsiri haiongezi wazi wazo la mwanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “akawa akifundisha” umetumiwa kuhifadhi hali ya tendo linaloendelea bila kuongeza wazi maana ya kuanza.
