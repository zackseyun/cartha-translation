  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: sw
  text: Kwa maana hata ndugu zake hawakumwamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana hata ndugu zake hawakuwa wakimwamini.” Kitenzi cha Kigiriki cha wakati usiotimilika kinaweza kutafsiriwa kama tendo la kawaida la wakati uliopita (“hawakumwamini”) au hali iliyokuwa ikiendelea (“hawakuwa wakimwamini”).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: hata ... hawa-
  rationale: 'Katika muktadha huu οὐδὲ inasisitiza jambo la kushangaza: hata ndugu zake mwenyewe hawakuamini.'
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa sentensi inaeleza sababu ya yaliyotangulia; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ndugu zake
  rationale: “Ndugu zake” ni usemi wa asili wa Kiswahili kwa ndugu wa kiume katika muktadha huu, bila kuongeza ufafanuzi usiotolewa na maandishi.
- source_word: ἐπίστευον
  choice: hawakumwamini
  rationale: Kitenzi cha wakati usiotimilika kinaweza kueleza hali au tendo lililoendelea zamani. Kiswahili cha kawaida hutumia wakati uliopita hapa kwa njia ya asili; uwezekano wa maana endelevu umewekwa katika tanbihi.
- source_word: εἰς αὐτόν
  choice: -mwamini
  rationale: 'Muundo πιστεύω εἰς unaeleza imani au tumaini linaloelekezwa kwa mtu. Kiswahili huonyesha yambwa huyo ndani ya kitenzi: “kumwamini.”'
theological_decisions:
- issue: Maana ya πιστεύω εἰς αὐτόν katika matumizi ya Yohana
  choice: kumwamini Yesu
  alternative: kumtumaini Yesu / kuweka imani katika Yesu
  rationale: Tafsiri inaonyesha imani au tumaini la kibinafsi linaloelekezwa kwa Yesu, bila kufafanua sababu za kutokuamini kwao wala kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya kawaida na yenye hadhi. “Hawakumwamini” ni ya asili zaidi katika mstari mkuu, huku tanbihi ikihifadhi dhana ya uwezekano wa hali endelevu katika kitenzi cha Kigiriki.
