  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: sw
  text: Sikukuu ya Wayahudi[a], yaani Sikukuu ya Vibanda, ilikuwa karibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikukuu ya Mahema.”
    reason: Jina mbadala linalotambulika kwa σκηνοπηγία; maandishi makuu “Sikukuu ya Vibanda” yanaonyesha maana ya neno kwa uwazi zaidi.
lexical_decisions:
- source_word: δὲ
  choice: Haikutafsiriwa kwa neno tofauti
  rationale: Ni kiunganishi chepesi cha simulizi. Katika Kiswahili, kuanza kwa “Basi” au “Sasa” hapa kungeweza kuonyesha mkazo au wakati ambao hauko wazi katika neno la Kigiriki; mtiririko wa sentensi unatosha.
- source_word: ἐγγὺς
  choice: ilikuwa imekaribia
  rationale: Inaonyesha kuwa wakati wa sikukuu ulikuwa karibu kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἑορτὴ
  choice: Sikukuu
  rationale: Neno hili linafaa kwa sherehe rasmi ya kidini na ni la kawaida katika Kiswahili.
- source_word: τῶν Ἰουδαίων
  choice: ya Wayahudi
  rationale: Huhifadhi kwa uwazi muundo na maana ya Kigiriki kwamba ilikuwa sikukuu ya jamii ya Wayahudi, bila kuingiza maana ya mabishano.
- source_word: σκηνοπηγία
  choice: Sikukuu ya Vibanda
  rationale: Hili ni jina la Kiswahili linaloeleweka na pia linaonyesha kwa uwazi maana ya sikukuu iliyohusishwa na kukaa katika vibanda vya muda.
theological_decisions:
- issue: Maana ya τῶν Ἰουδαίων katika jina la sikukuu
  choice: ya Wayahudi
  alternative: ya Kiyahudi
  rationale: “Ya Wayahudi” ni ya asili na huhifadhi uhusiano wa umilikaji/uhusishaji wa Kigiriki bila kuifanya kauli hiyo kuwa ya kipolemiki.
- issue: Jina la σκηνοπηγία
  choice: Sikukuu ya Vibanda
  alternative: Sikukuu ya Mahema
  rationale: “Vibanda” huonyesha kwa usahihi zaidi makao rahisi ya muda yanayokusudiwa hapa; “mahema” yanaweza kueleweka kama tents pekee na hivyo kupunguza upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kawaida lakini chenye heshima. “Yaani” linaweka wazi kwamba “Sikukuu ya Vibanda” ni jina linalofafanua sikukuu iliyotajwa, kama apposition ya Kigiriki.
