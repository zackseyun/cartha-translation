  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: sw
  text: Basi Mafarisayo wakawajibu, “Je, ninyi pia mmepotoshwa?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmedanganywa?” Kitenzi kinaweza kumaanisha kupotoshwa au kudanganywa; “mmepotoshwa” huhifadhi wazo la kuongozwa kuingia katika kosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: wakawajibu
  rationale: Kitenzi hiki ni cha kawaida katika masimulizi ya mazungumzo; hapa kiambishi -wa- kinawakilisha αὐτοῖς, yaani wale waliokuwa wakijibiwa.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaonyesha mwendelezo wenye matokeo katika mazungumzo; “Basi” ni la kawaida na lenye hadhi katika Kiswahili cha masimulizi.
- source_word: αὐτοῖς
  choice: -wa- katika “wakawajibu”
  rationale: Yambwa isiyo ya moja kwa moja inaelezwa kwa kawaida na kiambishi cha yambwa ndani ya kitenzi cha Kiswahili.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi; Kiswahili hakihitaji kibainishi kinacholingana na ὁ.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Je, ninyi pia
  rationale: “Ninyi” inasisitiza kiwakilishi kilichotajwa wazi, na “pia” huhifadhi maana ya καί. Muundo wa swali unabeba nguvu ya swali la balagha bila kuongeza maneno yasiyo katika matini.
- source_word: πεπλάνησθε
  choice: mmepotoshwa
  rationale: Huhifadhi hali ya kutendwa na wazo la kuongozwa kuingia katika kosa; wakati timilifu wa Kiswahili unaonyesha hali iliyotokana na tendo lililotangulia.
theological_decisions:
- issue: Nguvu ya swali linaloanzishwa na μή
  choice: Kulitoa kama swali la balagha linalotarajia jibu la kukataa, bila kuongeza “hakika” au tamko jingine.
  alternative: “Hakika ninyi pia hamjapotoshwa, sivyo?”
  rationale: μή inaonyesha kwamba Mafarisayo wanatarajia jibu la “hapana.” Kiswahili kinaweza kuwasilisha dharau na mshangao huo kwa muundo na muktadha wa swali bila kulipanua kupita matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa kawaida, huku ukihifadhi msisitizo wa “ninyi pia” na utata wa kitenzi πλανάω.
