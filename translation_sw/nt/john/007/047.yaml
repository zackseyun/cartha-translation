  terminology: “Mafarisayo” is the established Swahili name. “Mmekupotoshwa” is not used; the draft’s correct form, “mmepotoshwa,” conveys being led into error. The footnote’s alternative “mmedanganywa” appropriately reflects the semantic range without forcing a narrower interpretation into the main text.
