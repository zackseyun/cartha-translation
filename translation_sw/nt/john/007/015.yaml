  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: sw
  text: Basi Wayahudi[a] walikuwa wakishangaa, wakisema, “Mtu huyu anawezaje kuwa na elimu[b], ilhali hajafundishwa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “Wayahudi” linawahusu Wayahudi waliokuwa wakizungumza na Yesu au kumpinga huko Yerusalemu, huenda wakiwemo viongozi wa Wayahudi; haliwahusu Wayahudi wote kwa ujumla.
    reason: cultural_note
  - marker: b
    text: Au “Mtu huyu anajuaje maandishi?” Kigiriki kwa maana ya karibu ni “anajua herufi”; katika muktadha huo usemi unamaanisha kuwa na elimu au ujuzi wa maandishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: walikuwa wakishangaa
  rationale: Muundo wa wakati usiotimilika unaonyesha mshangao uliokuwa ukiendelea; usemi huu ni wa kawaida na unahifadhi hali hiyo.
- source_word: οὖν
  choice: Basi
  rationale: Huendeleza simulizi na kuunganisha mstari huu na yaliyotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo neno la moja kwa moja la Kigiriki. Muktadha wake umefafanuliwa katika tanbihi ili lisieleweke kuwa linawahusu Wayahudi wote.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi tegemezi kinaonyesha kwamba maneno yanayofuata ndiyo yaliyodhihirisha mshangao wao.
- source_word: Πῶς οὗτος γράμματα οἶδεν
  choice: Huyu amepataje elimu hii
  rationale: γράμματα kwa msingi humaanisha ‘herufi’ au ‘maandishi,’ lakini hapa ni nahau inayohusu elimu ya maandishi na ujuzi wa kitaaluma. Tafsiri hii ni ya kawaida katika Kiswahili, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: μὴ μεμαθηκώς
  choice: bila kuwa amefundishwa
  rationale: Hueleza kwamba hakupitia mafundisho rasmi yaliyotarajiwa; haitaji taasisi fulani ambayo maandishi yenyewe hayajaitaja.
theological_decisions:
- issue: Rejeo la οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Tafsiri kuu inahifadhi neno pana la Kigiriki badala ya kulibana kwa tafsiri ya kimuktadha. Tanbihi inaondoa uwezekano wa kulichukulia kama dai kuhusu Wayahudi wote.
- issue: Maana ya γράμματα katika swali kuhusu elimu ya Yesu
  choice: elimu hii
  alternative: herufi; maandishi; Maandiko
  rationale: Katika muktadha, swali halihusu tu kutambua herufi, bali kuwa na elimu bila kupata mafundisho rasmi. ‘Maandiko’ yangeweza kueleweka kwa namna finyu kuwa ni Maandiko Matakatifu pekee, jambo ambalo neno lenyewe halilazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘walikuwa wakishangaa, wakisema’ unahifadhi mwendelezo wa tendo bila kuwa mzito, na ‘bila kuwa amefundishwa’ hudokeza kutopata elimu rasmi bila kutaja kwa ziada shule au mfumo maalumu.
