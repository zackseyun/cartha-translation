  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: sw
  text: Kwa sababu hiyo, Musa amewapa tohara—si kwamba ilitoka kwa Musa, bali kwa mababu[a]—nanyi humtahiri mtu siku ya Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, tohara haikuanza kwa Musa, bali kwa mababu. Neno “mababu” hapa hurejelea wazee wa kale wa ukoo, bila kuwataja kwa majina.
    reason: Hufafanua hoja ya asili ya kihistoria bila kuongeza utambulisho mahsusi usiotajwa katika Kigiriki.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kiunganishi hiki kinahifadhi nguvu ya maelezo ya sababu na ni cha kawaida katika Kiswahili sanifu.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili na matumizi ya Kiswahili.
- source_word: δέδωκεν ὑμῖν
  choice: amewapa
  rationale: Kauli timilifu inadokeza tendo lililofanyika ambalo matokeo yake bado yana umuhimu kwa wasikilizaji.
- source_word: τὴν περιτομήν
  choice: tohara
  rationale: Neno hili la kawaida la Kiswahili linarejelea desturi au agizo la kutahiri.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: si kwamba ilitoka kwa Musa, bali kwa mababu
  rationale: Kauli hii ya mabano inaeleza asili ya tohara bila kuifanya Musa kuwa mwanzilishi wake; 'mababu' humaanisha waliotangulia, hasa mababu wa kwanza wa Israeli.
- source_word: ἐν σαββάτῳ
  choice: siku ya Sabato
  rationale: Hii ni tafsiri ya kawaida na ya asili ya matumizi ya wakati, ikionyesha desturi ya jumla.
- source_word: περιτέμνετε ἄνθρωπον
  choice: humtahiri mtu
  rationale: Kiambishi 'hu-' kinaonyesha tendo la kawaida linalorudiwa; 'mtu' katika muktadha huu ni mwanamume anayefanyiwa tohara.
theological_decisions:
- issue: Maana ya 'mababu' katika maelezo ya asili ya tohara
  choice: Neno linarejelea mababu wa kwanza wa Israeli, ambao tohara ilianza kwao kabla ya Musa.
  alternative: Linaweza kueleweka kwa upana zaidi kuwa wazee wote wa Israeli waliotangulia.
  rationale: Muktadha unalinganisha asili ya tohara kabla ya Musa na desturi iliyokubaliwa ya kuitenda siku ya Sabato. Tafsiri haiingizi jina maalumu lisilotajwa katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Mabano marefu yanahifadhi muundo wa maelezo ya pembeni katika Kigiriki; 'nanyi humtahiri' huendeleza hoja kwa mtiririko wa kawaida.
