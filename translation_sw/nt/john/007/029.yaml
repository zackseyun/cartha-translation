lexical_decisions:
- source_word: ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi cha nafsi kilichotajwa wazi katika Kigiriki kinahifadhiwa ili kuonyesha msisitizo wa dai la Yesu.
- source_word: οἶδα αὐτόν
  choice: ninamjua
  rationale: Kitenzi οἶδα kina maana ya hali ya sasa, ‘kujua’; umbo lenye yambwa ya mtu, ‘ninamjua,’ ni la kawaida na la moja kwa moja katika Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika muktadha huu kiunganishi kinaeleweka zaidi kuwa kinatoa sababu ya Yesu kumjua, huku uwezekano wa maana ya ‘kwamba’ ukiwekwa katika tanbihi.
- source_word: παρ’ αὐτοῦ εἰμι
  choice: ninatoka kwake
  rationale: παρά pamoja na jenitivi huonyesha chanzo au asili. ‘Ninatoka kwake’ huhifadhi usemi wa hali ya sasa na wazo la chanzo bila kuubana kuwa safari au mahali pekee.
- source_word: κἀκεῖνός
  choice: naye ndiye
  rationale: Muungano wa καί na ἐκεῖνος unaendelezwa kwa Kiswahili cha kawaida; ‘ndiye’ pia huhifadhi uzito wa kiwakilishi cha kuonyesha.
- source_word: με ἀπέστειλεν
  choice: aliyenituma
  rationale: Wakati uliopita wa ἀπέστειλεν unatafsiriwa kwa tendo lililotimia, na yambwa ‘me’ inaunganishwa kiasili katika kitenzi cha Kiswahili.
theological_decisions:
- issue: Maana ya uhusiano wa Yesu na Baba katika παρ’ αὐτοῦ εἰμι
  choice: ninatoka kwake
  alternative: nilikuja kutoka kwake; niko kutoka kwake; ninatoka mbele zake
  rationale: Tafsiri hii inaonyesha chanzo au asili ya Yesu kuhusiana na Baba, huku ikihifadhi kina na mvutano wa kiteolojia wa usemi wa Kigiriki bila kuufanya uwe kauli ya safari pekee au ya mahali pekee.
- issue: Kazi ya ὅτι
  choice: kwa sababu
  alternative: kwamba
  rationale: 'Usomaji wa kisababishi unafaa zaidi katika muktadha: Yesu anamjua kwa sababu anatoka kwake. Hata hivyo, uwezekano wa kisarufi wa kuanzisha maudhui ya kile anachokijua hauondolewi na umeonyeshwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mimi’ huhifadhi msisitizo wa ἐγὼ; ‘naye ndiye aliyenituma’ ni ya asili huku ikidumisha uzito wa ἐκεῖνος. Alama zote za tanbihi zimewekwa katika matini kuu.
