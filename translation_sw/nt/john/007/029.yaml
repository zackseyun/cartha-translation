  text: Mimi namjua[a], kwa sababu natoka kwake[b], naye ndiye aliyenituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninajua kwamba ninatoka kwake.” Kiunganishi cha Kigiriki kinaweza kuanzisha maudhui (“kwamba”) au sababu (“kwa sababu”); muktadha unapendelea maana ya sababu.
    reason: lexical_alternative
