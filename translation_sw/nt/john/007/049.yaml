  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: sw
  text: Lakini umati huu, ambao hauijui Sheria[a], umelaaniwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sheria” hapa inarejelea Sheria ya Kiyahudi, yaani Torati.
    reason: cultural_note
  - marker: b
    text: Au, “uko chini ya laana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na kauli iliyotangulia; “Lakini” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: ὁ ὄχλος οὗτος
  choice: umati huu
  rationale: “Umati” huwasilisha kundi kubwa la watu bila kuongeza dharau ya neno kama “genge.”
- source_word: ὁ μὴ γινώσκων
  choice: ambao hauijui
  rationale: Muundo huu unaeleza hali ya umati huo ya kutoijua Sheria na unasikika kwa kawaida katika Kiswahili.
- source_word: τὸν νόμον
  choice: Sheria
  rationale: Herufi kubwa inaonyesha kwamba hapa neno hilo linarejelea Sheria ya Kiyahudi, yaani Torati, si sheria kwa ujumla.
- source_word: ἐπάρατοί
  choice: umelaaniwa
  rationale: Neno hili linadumisha nguvu ya hukumu kali ya wasemaji; “uko chini ya laana” pia linawezekana.
- source_word: εἰσιν
  choice: umelaaniwa
  rationale: Ingawa kitenzi cha Kigiriki ni cha wingi, “umati” ni nomino ya ngeli ya 3/4 yenye umoja wa kisarufi katika Kiswahili, hivyo upatanisho wa umoja ni wa asili.
theological_decisions:
- issue: Ikiwa hukumu kali ya wasemaji ihifadhiwe bila kuonekana kuwa ni dai la msimulizi
  choice: Kauli imetafsiriwa moja kwa moja kama maneno ya Mafarisayo, bila kuipunguza wala kuongeza maneno ya kujitenga nayo.
  alternative: Kuongeza, “wanasema umati huu umelaaniwa,” ili kumtenga msimulizi na dai hilo.
  rationale: Muktadha tayari unaonyesha kuwa haya ni maneno ya moja kwa moja ya wapinzani wa Yesu. Kuongeza maelezo ya msimulizi kungeingiza maneno yasiyomo katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio unahifadhi ukali wa kauli ya awali bila kuongeza dharau ambayo haikulazimishwi na Kigiriki.
