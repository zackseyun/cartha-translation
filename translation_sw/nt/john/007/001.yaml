  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: sw
  text: Baada ya hayo, Yesu alikuwa akitembea huko Galilaya; kwa maana hakutaka kutembea katika Yudea, kwa sababu Wayahudi[a] walikuwa wakitafuta kumuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wayudea” au “viongozi wa Wayahudi.” Katika Injili ya Yohana, mara nyingi “Wayahudi” huwarejelea hasa Wayahudi wa Yudea waliompinga Yesu, kutia ndani wenye mamlaka, wala si Wayahudi wote kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Baada ya hayo
  rationale: Huhifadhi kiunganishi cha wakati na wingi wa ταῦτα kwa Kiswahili cha kawaida na chenye staha.
- source_word: περιεπάτει
  choice: alikuwa akitembea huku na huku
  rationale: Hali ya wakati usiotimilika inaonyesha tendo lililoendelea; ‘huku na huku’ huonyesha kwa kawaida kuzunguka ndani ya eneo bila kulifanya kuwa safari moja maalumu.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: huko Galilaya
  rationale: Ni tafsiri ya mahali iliyo wazi na ya kawaida, bila kuongeza wazo la eneo lote.
- source_word: οὐ γὰρ ἤθελεν
  choice: kwa maana hakutaka
  rationale: ‘Kwa maana’ huhifadhi kazi ya γάρ ya kutoa maelezo, na ‘hakutaka’ huonyesha nia badala ya kutoweza.
- source_word: ἐν τῇ Ἰουδαίᾳ περιπατεῖν
  choice: kutembea huko Yudea
  rationale: Kurudia ‘kutembea’ huhifadhi urudiaji wa περιπατέω katika Kigiriki, ingawa mara ya kwanza imefafanuliwa kwa ‘huku na huku’ ili iwe ya kawaida katika Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya Yesu kutotaka kutembea Yudea.
- source_word: ἐζήτουν
  choice: walikuwa wakitafuta
  rationale: Huhifadhi hali endelevu ya wakati usiotimilika na maana ya ζητέω, huku kitenzi-jina kinachofuata kikieleza kusudi lao.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Huhifadhi jina la kundi lililo katika matini ya Kigiriki; tanbihi inaeleza upeo wake wa kimuktadha ili lisieleweke kuwa lawama dhidi ya Wayahudi wote.
- source_word: ἀποκτεῖναι
  choice: kumuua
  rationale: Ni tafsiri ya moja kwa moja, ya asili na inayoeleweka kwa urahisi.
theological_decisions:
- issue: Wanaorejelewa kwa οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi katika matini kuu, pamoja na tanbihi ya ufafanuzi wa kimuktadha
  alternative: Viongozi wa Wayahudi; Wayudea
  rationale: Hii huhifadhi usemi wa chanzo na mvutano wake, lakini huzuia dhana potovu kwamba andiko linawalaumu Wayahudi wote bila ubaguzi. Katika muktadha huu, usemi huo unaweza kuwalenga hasa wapinzani Wayahudi wa Yudea, hususan wenye mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘alikuwa akitembea huku na huku’ ni wa kawaida kuliko tafsiri ya neno kwa neno pekee na huhifadhi tendo linaloendelea; urudiaji wa ‘kutembea’ umeachwa ili kuakisi urudiaji wa kitenzi katika chanzo.
