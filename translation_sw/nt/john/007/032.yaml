  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: sw
  text: Mafarisayo walisikia umati ukinong’ona[a] mambo hayo kumhusu, ndipo makuhani wakuu na Mafarisayo wakawatuma maofisa[b] ili wamkamate[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukinung’unika.” Neno la Kigiriki linaonyesha mazungumzo ya sauti ya chini, ambayo yanaweza kuwa na hali ya kutoridhika.
    reason: lexical_alternative
  - marker: b
    text: Au “walinzi” au “walinzi wa Hekalu.” Neno la Kigiriki linawahusu watendaji rasmi waliotumwa na viongozi wa Kiyahudi.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi zaidi, “wamshike.” Katika muktadha huu linaweza pia kutafsiriwa “wamtie nguvuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: walisikia
  rationale: Kitenzi cha wakati uliopita hapa kinaonyesha kwamba Mafarisayo walipata kusikia yaliyokuwa yakisemwa; “walisikia” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: τοῦ ὄχλου
  choice: umati
  rationale: ὄχλος humaanisha kundi kubwa la watu waliokusanyika; “umati” ni Kiswahili cha sasa na cha kawaida.
- source_word: γογγύζοντος
  choice: ukinong’ona
  rationale: Neno hili linaonyesha kusema kwa sauti ya chini, mara nyingi kwa hali ya kutoridhika. “Ukinong’ona” huhifadhi wazo la mazungumzo yaliyofanywa kwa sauti ya chini bila kulazimisha maana ya kulalamika.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: mambo hayo kumhusu
  rationale: Mpangilio huu huhifadhi wingi wa ταῦτα na maana ya περί pamoja na hali ya kumrejelea Yesu.
- source_word: ἀπέστειλαν
  choice: wakawatuma
  rationale: “Wakawatuma” ni tafsiri ya asili ya tendo lililofuata kusikia kwao; kiambishi cha yambwa kinawarejelea maofisa.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Katika mazingira haya wingi huu unawahusu viongozi wa ukuhani, si watu wengi waliokuwa na cheo cha kuhani mkuu kwa wakati mmoja.
- source_word: ὑπηρέτας
  choice: maofisa
  rationale: Katika Injili ya Yohana neno hili linawahusu watendaji rasmi waliokuwa chini ya mamlaka ya viongozi wa Kiyahudi. “Maofisa” huhifadhi hadhi yao rasmi bila kuwabainisha kupita kiasi kuwa polisi wa Hekalu.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: ili wamkamate
  rationale: Muundo wa ἵνα unaonyesha kusudi. Katika muktadha huu “wamkamate” ni Kiswahili cha kawaida kwa kumtia mtu mikononi mwa mamlaka, huku dokezo likihifadhi maana halisi zaidi ya kumshika.
theological_decisions:
- issue: Utambulisho wa ὑπηρέτας kama watendaji wa mamlaka
  choice: maofisa waliotumwa na makuhani wakuu na Mafarisayo
  alternative: watumishi; walinzi wa Hekalu
  rationale: Muktadha unaonyesha hatua rasmi ya kumkamata Yesu. “Maofisa” hudumisha jukumu lao rasmi bila kuongeza dai lisilotajwa wazi kwamba walikuwa polisi wa Hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Ndipo” linaonyesha mfuatano wa matukio kwa urahisi bila kuongeza uhusiano wa kisababishi usioelezwa wazi. Alama zote za maelezo ya chini zimewekwa mara moja katika sehemu husika ya matini.
