id: JHN.7.21
reference: John 7:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: sw
  text: Yesu akawajibu na kuwaambia, “Nilifanya kazi moja[a][b], nanyi nyote mnastaajabu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tendo moja.” Neno la Kigiriki linaweza kumaanisha kazi au tendo, lakini “kazi” inadumisha matumizi ya neno hili yanayojirudia katika Yohana kuhusu matendo ya Yesu.
    reason: lexical_alternative
  - marker: b
    text: Huenda hii inarejelea Yesu kumponya mtu aliyekuwa hawezi kutembea siku ya Sabato katika Yohana 5:1–18.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτοῖς
  choice: akawajibu na kuwaambia
  rationale: Inahifadhi vitenzi vyote viwili vya usemi katika muundo unaoeleweka kwa Kiswahili, bila kuvifupisha kuwa kitenzi kimoja.
- source_word: Ἓν ἔργον
  choice: kazi moja
  rationale: Inadumisha msisitizo wa nambari ‘moja’ na neno muhimu la Kiyohana ‘kazi’; ‘tendo moja’ pia linawezekana.
- source_word: ἐποίησα
  choice: nilifanya
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wakati uliopita, bila kuongeza urasmi usiokuwamo katika Kigiriki.
- source_word: πάντες
  choice: ninyi nyote
  rationale: Inaonyesha wazi kwamba Yesu anazungumza kuhusu kundi lote analolihutubia.
- source_word: θαυμάζετε
  choice: mnastaajabu
  rationale: Inahifadhi wakati wa sasa na maana ya kushangaa au kustaajabu bila kuamua kwamba mwitikio huo ni chanya pekee.
theological_decisions:
- issue: Umuhimu wa ἔργον katika Injili ya Yohana
  choice: kazi
  alternative: tendo
  rationale: ‘Kazi’ inadumisha mwangwi wa matumizi ya mara kwa mara ya neno hili kwa matendo ya Yesu katika Yohana, bila kuingiza ufafanuzi wa ziada ndani ya mstari.
- issue: Kazi moja inayorejelewa
  choice: Kuacha rejeo lenyewe bila kutajwa katika matini kuu
  alternative: Kueleza wazi kuwa ni uponyaji wa Yohana 5
  rationale: Muktadha unaelekea kurejelea uponyaji wa mtu aliyekuwa hawezi kutembea siku ya Sabato, lakini mstari huu wenyewe hautaji tukio hilo wazi; kwa hiyo maelezo yanawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘akawajibu na kuwaambia’ unadumisha fomula ya simulizi ya chanzo, huku ‘mnastaajabu’ ikiwa ya kawaida na kuacha wazi ikiwa mshangao huo ni wa kuvutiwa au wa kutatanishwa.
