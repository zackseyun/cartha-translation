  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: sw
  text: Mtanitafuta, na hamtanipata,[a] na nilipo mimi, ninyi hamna uwezo wa kuja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Mtanitafuta.”'
    reason: Tofauti ya matini inayowakilishwa katika safu ya ushahidi wa chanzo na katika safu ya ushauri ya POB.
  - marker: b
    text: 'Au: “hamwezi kuja.”'
    reason: Tafsiri mbadala ya kawaida zaidi ya οὐ δύνασθε ἐλθεῖν, huku maana ya kutokuwa na uwezo ikibaki.
lexical_decisions:
- source_word: ζητήσετέ
  choice: mtanitafuta
  rationale: Kitenzi cha wakati ujao, nafsi ya pili wingi. “Kutafuta” ni Kiswahili cha kawaida kinachoeleza jaribio la kumtafuta Yesu bila kuongeza maana ya kiroho isiyotajwa wazi hapa.
- source_word: με
  choice: -ni- / mimi
  rationale: Kiwakilishi cha yambwa kinachomrejelea Yesu; katika “mtanitafuta” kinaunganishwa kwa kawaida ndani ya kitenzi.
- source_word: οὐχ εὑρήσετε
  choice: hamtanipata
  rationale: Huhifadhi ukanushi wa wakati ujao kwa lugha ya kawaida bila kuongeza mkazo usiokuwamo wazi katika Kiyunani.
- source_word: ὅπου
  choice: nilipo
  rationale: Muundo wa mahali “nilipo” ni wa asili katika Kiswahili na unalingana na maana ya “mahali nilipo.”
- source_word: εἰμὶ ἐγώ
  choice: nilipo mimi
  rationale: Kiwakilishi huru “mimi” kinahifadhi mkazo na utofautishaji unaotokana na ἐγώ bila kuongeza neno kama “huko,” ambalo halipo katika matini.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi huru “ninyi” kinahifadhi utofautishaji wa wazi kati ya Yesu na wasikilizaji wake.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: hamna uwezo wa kuja
  rationale: Hueleza kutokuwa na uwezo, si kukatazwa. Ingawa “hamwezi kuja” ni ya kawaida zaidi, muundo huu huweka wazi wazo la uwezo lililo katika δύνασθε.
theological_decisions:
- issue: Asili ya kauli kwamba wasikilizaji hawana uwezo wa kuja mahali Yesu alipo
  choice: Kutafsiri kama kutokuwa na uwezo bila kueleza aina au sababu yake
  alternative: “Hairuhusiwi kwenu kuja,” ambayo ingedokeza katazo
  rationale: δύνασθε inaeleza uwezo, si ruhusa. Aya yenyewe haisemi kama kutoweza huko ni kwa sababu ya kiroho, kimaadili, hukumu, au hali ya muda; tafsiri haipaswi kuliamua jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtanitafuta” na “hamtanipata” ni vya kawaida na vinaeleweka kwa urahisi. Viwakilishi huru “mimi” na “ninyi” vimetumiwa kuhifadhi utofautishaji wa Kiyunani. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
