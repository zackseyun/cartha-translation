  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: sw
  text: Kwa hiyo walikuwa wakitafuta kumkamata[a], lakini hakuna mtu aliyenyosha mkono kumshika, kwa sababu saa yake[b] ilikuwa bado haijafika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumshika.” Kitenzi cha Kigiriki kinaweza kumaanisha kushika au kukamata; katika muktadha huu huenda kinadokeza kumtia nguvuni.
    reason: lexical_alternative
  - marker: b
    text: “Saa yake” ni usemi unaojirudia katika Injili ya Yohana kuhusu wakati uliowekwa katika utume wa Yesu, hasa mateso, kifo, ufufuo na kutukuzwa kwake.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: wakawa wanatafuta
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha jitihada iliyokuwa ikiendelea; muundo huu unadumisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha mwendelezo wenye hitimisho kutoka kwa maelezo yaliyotangulia.
- source_word: πιάσαι
  choice: kumkamata
  rationale: Kitenzi hiki kinaweza kumaanisha kumshika au kumtia mtu nguvuni. Katika muktadha huu, “kumkamata” ni cha kawaida na kinaacha wazi ikiwa msisitizo ni kushika au kukamata rasmi.
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kiwakilishi hasi.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: aliyemwekea mkono
  rationale: Inahifadhi taswira ya kumwekea mtu mkono kwa kusudi la kumtia nguvuni, badala ya kuifupisha kuwa kukamata tu.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaeleza sababu ya wao kutomkamata kwa uwazi katika Kiswahili cha sasa.
- source_word: οὔπω
  choice: bado haija-
  rationale: Muundo “ilikuwa bado haijafika” unaonyesha wazi kwamba wakati huo haukuwa umefika.
- source_word: ἐληλύθει
  choice: ilikuwa ... haijafika
  rationale: Muundo huu unawakilisha hali ya wakati ambao, kufikia hatua hiyo ya simulizi, haukuwa umefika.
- source_word: ἡ ὥρα αὐτοῦ
  choice: saa yake
  rationale: Inadumisha istilahi yenye uzito katika Injili ya Yohana bila kuibana kuwa wakati wa kifo pekee.
theological_decisions:
- issue: Maana ya “saa yake” katika Injili ya Yohana
  choice: Kudumisha usemi halisi “saa yake” katika andiko kuu.
  alternative: wakati wake; wakati uliowekwa wa kifo chake
  rationale: Usemi huu una upana wa kitheolojia unaohusu hatua iliyowekwa katika utume wa Yesu, lakini mstari wenyewe hauusemi kuwa kifo chake pekee. Tafsiri halisi inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakawa wanatafuta” kinadumisha tendo lililoendelea, huku “kumkamata” na “kumwekea mkono” zikiwasilisha muktadha wa kumtia nguvuni bila kuongeza taratibu rasmi za kisheria.
