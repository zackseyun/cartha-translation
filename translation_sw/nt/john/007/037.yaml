  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: sw
  text: Katika siku ya mwisho, siku kuu ya sikukuu, Yesu alikuwa amesimama, akapaza sauti akisema, “Mtu yeyote aliye na kiu na aje kwangu, anywe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: Siku ya mwisho
  rationale: Kirai hiki huonyesha wakati. Kiunganishi δέ ni chepesi, na katika Kiswahili mtiririko wa simulizi hauhitaji neno la ziada kama “basi” hapa.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: yaani siku kuu ya sikukuu
  rationale: Hufafanua siku ya mwisho kuwa siku kuu ya sikukuu. “Yaani” huonyesha uhusiano huo kwa Kiswahili cha kawaida bila kupunguza msisitizo wa μέγας.
- source_word: εἱστήκει
  choice: alisimama
  rationale: Hueleza Yesu akiwa katika mkao wa kusimama mbele ya watu; wakati uliopita wa Kiswahili unafaa kwa simulizi hili.
- source_word: ἔκραξεν λέγων
  choice: kupaza sauti akisema
  rationale: κράζω huonyesha kutamka kwa sauti kubwa hadharani, na participio λέγων hutanguliza maneno yanayofuata.
- source_word: Ἐάν τις διψᾷ
  choice: Yeyote aliye na kiu
  rationale: τις ni mtu yeyote kwa maana ya jumla, na διψᾷ inahifadhiwa kama taswira ya kuwa na kiu.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: na aje kwangu anywe
  rationale: Vitenzi viwili vya amri vinaonyesha mwaliko wenye msisitizo. Muundo wa “na aje … anywe” ni wa kawaida, ni umoja wa kijumla, na hauongezi jinsia ambayo Kiswahili hakihitaji.
theological_decisions:
- issue: Maana ya kitamathali ya kiu na kunywa
  choice: Kuhifadhi maneno “kiu” na “anywe” bila kuyafafanua katika matini kuu
  alternative: Kuyafasiri kama kutamani uzima, kuamini, au kumpokea Roho
  rationale: Taswira yenyewe ndiyo inayotumiwa na Yesu na kufafanuliwa zaidi katika muktadha. Kuiacha wazi kunahifadhi upana na mvutano wa kiteolojia wa kifungu.
- issue: Umoja wa kijumla katika τις na amri zinazofuata
  choice: “Yeyote … na aje … anywe”
  alternative: Kutumia maneno yenye jinsia kama “mwanamume yeyote … aje” au umoja uliosisitizwa “mtu huyo”
  rationale: Kigiriki kinatumia umoja wa kijumla, si rejeo maalumu kwa mwanamume. Kiswahili huhifadhi umoja huo kwa kawaida bila kutaja jinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kawaida kwa wasomaji wengi, huku mwaliko wa Yesu na taswira ya kiu vikihifadhiwa bila maelezo ya kimadhehebu. Tanbihi ya Kiingereza kuhusu kiwakilishi cha jinsia haikuhitajika, kwa kuwa Kiswahili huonyesha umoja wa kijumla bila kiwakilishi chenye jinsia.
