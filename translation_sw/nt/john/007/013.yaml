  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: sw
  text: Hata hivyo, hakuna mtu aliyekuwa akisema waziwazi kumhusu kwa sababu ya kuwaogopa Wayahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, katika muktadha huu, “viongozi wa Kiyahudi” au “mamlaka za Kiyahudi huko Yudea.” Katika Injili ya Yohana, neno “Wayahudi” linaweza kumaanisha Wayahudi kwa ujumla au, katika baadhi ya sehemu, mamlaka za Yerusalemu zilizompinga Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Ni kikanushi jumuishi kinachowarejelea watu katika umati; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: μέντοι
  choice: Hata hivyo
  rationale: Huonyesha utofauti mdogo na maoni mbalimbali yaliyotajwa katika mstari uliotangulia.
- source_word: παρρησίᾳ
  choice: waziwazi
  rationale: Katika muktadha huu neno linaonyesha kusema kwa uwazi mbele ya watu bila kuficha, badala ya kulenga tu ujasiri wa ndani.
- source_word: ἐλάλει
  choice: alikuwa akisema
  rationale: Muundo huu unahifadhi hali endelevu au iliyozoeleka ya kitenzi cha wakati usiotimilifu.
- source_word: περὶ αὐτοῦ
  choice: habari zake
  rationale: Ni usemi wa asili wa Kiswahili unaomaanisha kusema kumhusu Yesu bila kuongeza ufafanuzi.
- source_word: διὰ τὸν φόβον
  choice: kwa sababu ya kuwaogopa
  rationale: Huonyesha sababu ya ukimya huo kwa Kiswahili cha kawaida, huku wazo la hofu likibaki wazi.
- source_word: τῶν Ἰουδαίων
  choice: Wayahudi
  rationale: Inahifadhi upana wa neno la Kigiriki katika matini kuu; tanbihi inaeleza kuwa katika muktadha huu huenda likawalenga hasa viongozi au mamlaka za Kiyahudi huko Yerusalemu.
theological_decisions:
- issue: Wanaorejelewa na τῶν Ἰουδαίων katika simulizi la Yohana
  choice: Wayahudi katika matini kuu, pamoja na tanbihi ya muktadha
  alternative: viongozi wa Kiyahudi; mamlaka za Kiyahudi huko Yudea
  rationale: Neno la Yohana linaweza kumaanisha Wayahudi kwa ujumla, watu wa Yudea, au mamlaka za Kiyahudi kulingana na muktadha. Kulihifadhi katika matini kuu hakufungi maana mapema, na tanbihi huzuia dhana potovu kwamba Wayahudi wote bila ubaguzi ndio waliokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “alikuwa akisema” unadumisha hali endelevu ya kitenzi, na “waziwazi” ni wa kawaida kwa usemi usiofichwa hadharani.
