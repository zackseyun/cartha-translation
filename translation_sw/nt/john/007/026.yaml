  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: sw
  text: Na tazama, anazungumza waziwazi, nao hawamwambii lolote. Je, inawezekana[a] kwamba viongozi wamejua kweli kwamba huyu ndiye Masihi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, viongozi wamejua kweli kwamba huyu ndiye Masihi?”
    reason: μήποτε inaweza kuonyesha swali la mshangao lenye mwelekeo wa kiretoria, badala ya swali la uwezekano wa kusitasita lililotolewa katika matini kuu.
lexical_decisions:
- source_word: ἴδε
  choice: tazama
  rationale: Imetafsiriwa kama neno la kuvuta usikivu wa msikilizaji. “Tazama” ni la kawaida, lenye hadhi, na lina nguvu inayofaa kuliko “ona” katika muktadha huu.
- source_word: παρρησίᾳ
  choice: waziwazi
  rationale: Hapa neno linaonyesha kusema hadharani na bila kuficha. “Waziwazi” linafaa kwa mafundisho ya Yesu mbele ya watu bila kusisitiza ujasiri pekee.
- source_word: λαλεῖ
  choice: anazungumza
  rationale: Wakati uliopo wa Kigiriki umeonyeshwa kama tendo linaloendelea katika tukio hili.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: hawamwambii lolote
  rationale: Huhifadhi maana ya moja kwa moja kwamba viongozi hawasemi jambo lolote kwake, bila kuongeza wazo lisilotajwa wazi la kusema dhidi yake.
- source_word: μήποτε
  choice: Je, yawezekana kwamba
  rationale: Huonyesha hitimisho la kusitasita na kushangaa. Kauli hii ya Kiswahili inahifadhi uwezekano huo bila kuifanya kuwa uthibitisho.
- source_word: ἀληθῶς
  choice: kweli
  rationale: Ni tafsiri ya kawaida na yenye uzito unaofaa ya kielezi hiki.
- source_word: ἔγνωσαν
  choice: wamejua
  rationale: Hali timilifu ya Kiswahili inaonyesha kwamba huenda viongozi wamefikia ufahamu huo, huku ikibaki na maana pana ya ‘kujua’ badala ya kuibana kuwa ‘kutambua’.
- source_word: οἱ ἄρχοντες
  choice: viongozi
  rationale: Katika muktadha huu ni viongozi wenye mamlaka wa Wayahudi. “Viongozi” ni la asili katika Kiswahili na halidokezi watawala wa kisiasa pekee.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: kwamba huyu ndiye Masihi
  rationale: Χριστός hapa ni cheo cha yule aliyetiwa mafuta na kutarajiwa na Wayahudi; “Masihi” huhifadhi mazingira hayo ya Kiyahudi kuliko kutumia “Kristo” kama jina.
theological_decisions:
- issue: Tafsiri ya ὁ χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika swali la umati, neno hili linafanya kazi kama cheo cha yule aliyekuwa akitarajiwa, si kama sehemu ya jina la Yesu. “Masihi” huhifadhi maana hiyo bila kuingiza msimamo wa dhehebu.
- issue: Nguvu ya swali lenye μήποτε
  choice: Je, yawezekana kwamba viongozi wamejua kweli... ?
  alternative: Kwani viongozi wamejua kweli... ?
  rationale: Kigiriki kinaweza kusikika kama dhana ya kushangaa au kama swali linalotarajia jibu la kukataa. Matini kuu inatumia dhana ya uwezekano wa kusitasita, na tanbihi inalinda maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo unafuata mazungumzo ya umati kwa lugha ya kawaida bila kuwa wa mtaani; “nao” huunganisha mshangao wao na kutotendewa kwa Yesu.
