  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: sw
  text: Alisema hayo kuhusu Roho[a], ambaye wale waliomwamini walikuwa karibu kumpokea; kwa maana Roho alikuwa bado hajaja[b], kwa sababu Yesu alikuwa bado hajatukuzwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Roho” hapa ni Roho wa Mungu; Kigiriki hakiongezi neno “Mtakatifu.”
    reason: clarification
  - marker: b
    text: Au, kwa kueleza maana zaidi, “Roho alikuwa bado hajatolewa.” Kigiriki kinasema kwa ufupi, “Roho alikuwa bado,” na kinahusianisha jambo hilo na Yesu kutokuwa ametukuzwa bado.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: Roho
  rationale: Muktadha unaonyesha kuwa anayelengwa ni Roho wa Mungu. Herufi kubwa inabainisha rejeleo hilo bila kuongeza neno “Mtakatifu,” ambalo halipo katika Kigiriki.
- source_word: οὗ
  choice: ambaye
  rationale: Kiwakilishi hiki kinamrejelea Roho; “ambaye” ni cha kawaida kwa rejeleo la kibinafsi katika Kiswahili na hakipunguzi Roho kuwa kitu kisicho na utu.
- source_word: ἔμελλον λαμβάνειν
  choice: walikuwa karibu kumpokea
  rationale: Huhifadhi maana ya jambo lililokuwa linatarajiwa kutokea kutoka kwa mtazamo wa simulizi, badala ya kulifanya kuwa wakati ujao usio na ukaribu.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: wale waliomwamini
  rationale: Ni Kiswahili cha kawaida kwa ujenzi wa Kiyohana wa kumwamini Yesu; wakati uliopita unafaa hapa bila kulazimisha utofautishaji wa wakati ambao Kiswahili hakihitaji.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: kwa maana Roho alikuwa bado hajawa
  rationale: Huhifadhi kwa karibu ufupi na mvutano wa Kigiriki, ambacho hakisemi wazi “alikuwa hajapewa.” Ingawa msemo huu si wa kawaida, unaepuka kuingiza ufafanuzi katika matini kuu.
- source_word: ἐδοξάσθη
  choice: hajatukuzwa
  rationale: “Kutukuzwa” huhifadhi istilahi na dhamira ya Kiyohana bila kuibana kuwa kuinuliwa, kufufuliwa, au kuingia utukufuni pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri οὔπω γὰρ ἦν πνεῦμα bila kudokeza kwamba Roho hakuwepo kabla ya Yesu kutukuzwa.
  choice: 'Kuhifadhi mvutano katika matini kuu: “Roho alikuwa bado hajawa,” kisha kueleza maana inayowezekana katika tanbihi.'
  alternative: “Roho alikuwa bado hajatolewa” au “Roho alikuwa bado hajaja.”
  rationale: Kigiriki kinasema kwa ufupi kwamba Roho “alikuwa bado hajawa,” na kinahusianisha hali hiyo na Yesu kutokuwa ametukuzwa bado. Kuongeza “kutolewa” kungeweka wazi maana inayowezekana lakini isiyotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa kiasi kinachowezekana, lakini kifungu kigumu kuhusu Roho kimeachwa na mvutano wake wa asili badala ya kufafanuliwa kimadhehebu.
