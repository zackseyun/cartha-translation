id: JHN.7.28
reference: John 7:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: sw
  text: Basi Yesu akapaza sauti hekaluni alipokuwa akifundisha, akisema, “Mnanijua mimi, na mnajua ninakotoka.[a] Nami sijaja kwa uamuzi wangu mwenyewe,[b] bali aliyenituma ni wa kweli,[c] ambaye ninyi hamumjui.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kauli hii inaweza kusikika katika muktadha kama kejeli au changamoto: “Mnanijua mimi, na mnajua ninakotoka?” Hata hivyo, Kigiriki kina umbo la kauli ya taarifa.'
    reason: alternative_reading
  - marker: b
    text: “Kwa uamuzi wangu mwenyewe” inaweza pia kutafsiriwa “kutoka kwangu mwenyewe”; inaonyesha kwamba Yesu hakuja kwa chanzo au uamuzi wake mwenyewe.
    reason: lexical_alternative
  - marker: c
    text: “Wa kweli” hapa pia linaweza kuwa na maana ya “halisi” au “wa hakika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: akapaza sauti
  rationale: Usemi huu unaonyesha kwamba Yesu alisema kwa sauti kubwa hadharani, bila kudokeza kwamba alikuwa akilia kwa huzuni.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Neno ἱερόν linamaanisha eneo la Hekalu kwa ujumla, si patakatifu pa ndani pekee; “hekaluni” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: διδάσκων ... καὶ λέγων
  choice: alipokuwa akifundisha, akisema
  rationale: Muundo huu unaonyesha mazingira ya tendo linaloendelea la kufundisha na pia unaendeleza kitendo cha kusema kwa Kiswahili cha asili.
- source_word: Κἀμὲ οἴδατε
  choice: Mnanijua mimi
  rationale: Kiwakilishi “mimi” kinahifadhi mkazo uliomo katika Κἀμέ bila kuunda Kiswahili kisicho cha kawaida.
- source_word: οἴδατε ... οἴδατε
  choice: mnanijua ... mnajua
  rationale: Urudiaji umehifadhiwa kwa sababu una uzito wa kibalagha na unachangia mvutano wa kauli ya Yesu.
- source_word: πόθεν εἰμί
  choice: ninakotoka
  rationale: Huu ni usemi wa asili unaohifadhi maana pana ya asili ya Yesu bila kuifafanua kuwa mahali pa kijiografia pekee au asili ya mbinguni pekee.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: kwa hiari yangu mwenyewe
  rationale: Huwasilisha kwa Kiswahili kinachoeleweka wazo la kutokuja kwa uamuzi au msukumo wake mwenyewe, huku dokezo la tafsiri ya karibu zaidi likielezwa katika tanbihi.
- source_word: οὐκ ἐλήλυθα
  choice: sijaja
  rationale: Wakati timilifu wa Kiswahili unafaa kuonyesha kuja ambako kunahusiana na utume wa Yesu unaoendelea wakati huo.
- source_word: ἀληθινὸς
  choice: wa kweli
  rationale: Huhifadhi upeo wa maana unaoweza kumaanisha mwenye ukweli, halisi, au wa kweli, bila kuufunga kwa maana moja tu.
- source_word: ὁ πέμψας με
  choice: aliyenituma
  rationale: Inahifadhi tendo na mhusika binafsi bila kuongeza wazi jina “Baba,” ambalo halipo katika kishazi hiki.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: naye ninyi hamumjui
  rationale: Inahifadhi shtaka la moja kwa moja na msisitizo wa ὑμεῖς kwa kutumia “ninyi.”
theological_decisions:
- issue: Iwapo “Mnanijua mimi, na mnajua ninakotoka” itafsiriwe kama kauli ya kawaida au swali la kejeli/changamoto
  choice: Imewekwa kama kauli ya taarifa, kwa kufuata umbo la Kigiriki.
  alternative: “Mnanijua mimi, na mnajua ninakotoka?” au kuongeza ishara ya kejeli katika matini.
  rationale: Ingawa muktadha unaweza kuifanya isikike kama kejeli au changamoto, Kigiriki kina umbo la kauli. Tafsiri inaacha mvutano huo utambuliwe kutokana na muktadha.
- issue: Maana ya asili ya Yesu katika “ninakotoka” na “sijaja kwa hiari yangu mwenyewe”
  choice: Maneno yameachwa na maana pana inayoweza kugusa asili inayoonekana kwa wanadamu na utume wa kimungu.
  alternative: Kuyafanya yahusu mahali pa kidunia pekee au kutaja wazi kwamba Yesu alitoka mbinguni.
  rationale: Injili ya Yohana mara nyingi huunganisha viwango mbalimbali vya maana kuhusu asili ya Yesu; Kigiriki cha kishazi hiki hakilazimishi tafsiri ibane maana kwa upande mmoja.
- issue: Mhusika anayetajwa kwa maneno “aliyenituma”
  choice: Ameachwa kama “aliyenituma.”
  alternative: “Baba aliyenituma.”
  rationale: Ingawa muktadha mpana wa Yohana unamtambulisha, kishazi hiki hakitumii jina “Baba”; kutoliongeza kunadumisha umbo la matini chanzo.
- issue: Maana ya ἀληθινός kuhusu aliyemtuma Yesu
  choice: “wa kweli”
  alternative: “halisi” au “mwaminifu.”
  rationale: “Wa kweli” huhifadhi uwezekano wa kusisitiza uhalisi au utegemekaji bila kuamua kimya kimya kati ya vivuli hivyo vya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Akapaza sauti” ni ya hadhi lakini ya kawaida; “hekaluni” ni fupi na ya asili. Urudiaji na viwakilishi vya mkazo vimedumishwa pale vinapobeba nguvu ya kibalagha.
