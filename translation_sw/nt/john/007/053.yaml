translation:
  language: sw
  text: Na[a] kila mmoja akaenda nyumbani kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aya hii inaanza simulizi la mwanamke aliyekutwa akizini (Yohana 7:53–8:11). Sehemu hii yote haipatikani katika hati za kale zaidi za Kigiriki, kutia ndani mafunjo ya karne ya tatu na hati za karne ya nne, Sinaiticus na Vaticanus, wala katika tafsiri za kale za Kikopti na Kisiria. Inapatikana katika Codex Bezae ya karne ya tano, mapokeo ya Kilatini, na mapokeo ya baadaye ya hati nyingi za Kibizanti. Katika baadhi ya hati, simulizi hili limewekwa mahali tofauti, kwa mfano baada ya Yohana 21:25 au Luka 21:38; jambo hili laweza kuonyesha kwamba hapo awali lilikuwa simulizi lililojitegemea, lililoingizwa baadaye katika mapokeo ya maandishi. Linajumuishwa hapa kwa kufuata mapokeo ya maandishi ya Kibizanti na kwa kutambua nafasi yake ya muda mrefu katika usomaji wa Kikristo.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza simulizi; “Kisha” ni cha kawaida katika Kiswahili na kinaonyesha hatua inayofuata bila kuongeza uhusiano usio wazi.
- source_word: ἐπορεύθη
  choice: akaenda
  rationale: Kitenzi kinaonyesha kwenda au kuondoka; “akaenda” kinafaa katika mfululizo wa simulizi na ni cha asili katika Kiswahili.
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi msisitizo wa Kigiriki kwamba watu walitawanyika mmoja mmoja.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nyumbani kwake
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza kwenda kwenye nyumba au makao ya mtu mwenyewe.
theological_decisions:
- issue: Mahali pa aya katika mapokeo ya maandishi
  choice: Aya imehifadhiwa katika maandishi huku tofauti muhimu ya ushahidi wa hati ikielezwa katika tanbihi.
  alternative: Kuiondoa aya katika maandishi makuu au kuiweka kwenye mabano.
  rationale: Toleo la chanzo lililotolewa lina aya hii, lakini ushahidi mpana wa hati unahitaji taarifa ya wazi ili wasomaji wajue hali yake ya kimaandishi bila kuamua kimya kimya kuhusu uhalisi wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. “Kila mmoja akaenda nyumbani kwake” ni wazi kwa wasomaji wa kawaida na kinadumisha msisitizo wa kila mtu binafsi.
