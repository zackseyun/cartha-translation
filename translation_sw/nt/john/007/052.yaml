base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: sw
  text: Wakamjibu na kumwambia, “Je, wewe pia unatoka Galilaya?[a] Chunguza, uone kwamba hakuna nabii anayetokea Galilaya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe pia si mtu wa Galilaya, sivyo?” Swali la Kigiriki limeundwa likitarajia jibu la kukataa.
    reason: lexical_alternative
  - marker: b
    text: Wengine hutafsiri, “hakuna nabii anayeinuliwa kutoka Galilaya,” wakihifadhi uwezekano wa maana kwamba Mungu ndiye anayemwinua nabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: Wakamjibu na kumwambia
  rationale: Inahifadhi jozi ya vitenzi ya mtindo wa usimulizi wa Yohana na msisitizo wake, huku ikibaki kuwa Kiswahili cha kawaida.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Je, wewe pia unatoka Galilaya?
  rationale: Swali hili ni la kawaida na la moja kwa moja kwa Kiswahili; muktadha unaonyesha dharau, huku tanbihi ikieleza kwamba μή hutarajia jibu la kukataa.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Chunguza, nawe utaona
  rationale: Kauli hii inaonyesha agizo la kufanya uchunguzi na matokeo yanayodaiwa kufuatia; ni ya asili zaidi kwa Kiswahili kuliko tafsiri ya neno kwa neno.
- source_word: προφήτης
  choice: nabii
  rationale: Nomino haina kibainishi katika Kigiriki, hivyo inaelekea kumaanisha nabii yeyote, si lazima yule Nabii maalumu wa nyakati za mwisho.
- source_word: οὐκ ἐγείρεται
  choice: hakuna nabii anayetokea
  rationale: ‘Anayetokea’ huwasilisha maana ya nabii kujitokeza au kuibuka kutoka eneo fulani bila kulazimisha wazo kwamba Mungu ndiye mtendaji, ingawa uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya kisemantiki ya swali lenye μή
  choice: Je, wewe pia unatoka Galilaya?
  alternative: Hakika wewe pia hutoki Galilaya, sivyo?
  rationale: Kigiriki kinatarajia jibu la kukataa, lakini Kiswahili cha moja kwa moja pamoja na muktadha kinaweza kuonyesha kejeli hiyo bila kufanya sentensi kuwa nzito. Tanbihi inahifadhi nguvu kamili ya muundo.
- issue: Uwezekano wa Mungu kumwinua nabii katika ἐγείρεται
  choice: anayetokea
  alternative: anayeinuliwa
  rationale: Kitenzi kinaweza kueleza kuibuka kwa nabii au kuinuliwa kwake na Mungu. Matini kuu haimtaji mtendaji waziwazi, hivyo tafsiri isiyomlazimisha mtendaji imechaguliwa na mbadala umewekwa tanbihini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Chunguza, nawe utaona’ ni changamoto ya mabishano iliyo ya asili kwa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vipengele vinavyohusika.
