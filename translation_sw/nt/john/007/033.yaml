  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: sw
  text: Basi Yesu akasema, “Bado niko pamoja nanyi kwa muda mfupi[a], na ninaenda kwa yule aliyenituma[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bado kwa muda mfupi niko pamoja nanyi.”
    reason: Mpangilio huu mbadala unaonyesha kwa karibu muundo wa ἔτι χρόνον μικρόν bila kubadili maana.
  - marker: b
    text: Katika muktadha mpana wa Injili ya Yohana, “yule aliyenituma” ni Baba.
    reason: Ufafanuzi wa kimuktadha unaotambua mhusika bila kumwingiza moja kwa moja katika matini kuu.
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo wa kimantiki na wa kisimulizi kutoka mazungumzo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: Ἔτι χρόνον μικρόν
  choice: Bado ... kwa muda mfupi
  rationale: ‘Bado’ linahifadhi maana ya ἔτι, na ‘kwa muda mfupi’ linaonyesha kipindi kifupi kilichobaki.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: niko pamoja nanyi
  rationale: Linahifadhi hali ya sasa ya εἰμι na maana ya kuwapo pamoja na wasikilizaji wake.
- source_word: καὶ ὑπάγω
  choice: nami ninaenda
  rationale: ‘Nami’ linaunganisha kauli bila kuongeza wazi wazo la ‘kisha,’ ambalo halimo katika Kigiriki; ‘ninaenda’ linadumisha urahisi wa kitenzi huku likiruhusu uzito wake katika Injili ya Yohana.
- source_word: πρὸς τὸν πέμψαντά με
  choice: kwa yule aliyenituma
  rationale: Linatunza kirai cha kimahusiano cha Kigiriki bila kumtaja mhusika huyo moja kwa moja katika matini kuu.
theological_decisions:
- issue: Utambulisho wa ‘yule aliyenituma’
  choice: Kudumisha usemi ‘yule aliyenituma’ katika matini kuu
  alternative: kwa Baba aliyenituma
  rationale: Katika muktadha mpana wa Yohana mhusika ni Baba, lakini Kigiriki cha aya hii hakimtii jina moja kwa moja. Tafsiri inadumisha namna ya usemi wa chanzo, huku tanbihi ikitoa ufafanuzi wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nanyi’ linafaa kwa wingi wa ὑμῶν, na ‘nami ninaenda’ huepuka kuongeza ‘kisha’ isiyosemwa wazi katika chanzo.
