  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: sw
  text: Lakini, baada ya ndugu zake kwenda kwenye sikukuu, yeye naye akaenda, lakini si hadharani, bali kana kwamba kwa siri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bali kwa siri.” Usemi wa Kigiriki ni kihalisi “bali kana kwamba kwa siri,” na huenda unafanya kauli hiyo isiwe ya moja kwa moja sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Lakini ... walipokwisha
  rationale: Muundo huu unaonyesha wakati pamoja na mpito wenye utofautishaji mdogo. ‘Walipokwisha’ pia huweka wazi kwamba ndugu zake walitangulia kwenda.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: walipokwisha kwenda ... akaenda
  rationale: Ingawa kitenzi cha Kigiriki kwa kawaida ni ‘kupanda,’ katika Kiswahili ‘kwenda’ ni cha kawaida zaidi hapa na bado kinaeleza safari ya hija kwenda Yerusalemu bila kuleta picha isiyokusudiwa ya kupanda mlima.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ndugu zake
  rationale: Katika muktadha huu neno la Kigiriki linawahusu ndugu wa kiume wa Yesu. Kiswahili ‘ndugu zake’ ni usemi wa kawaida; muktadha wa karibu unabainisha kundi linalokusudiwa.
- source_word: εἰς τὴν ἑορτήν
  choice: kwenye sikukuu
  rationale: ἑορτή ni sikukuu ya kidini, na katika muktadha ni Sikukuu ya Vibanda. Tafsiri haitaji jina hilo tena kwa kuwa tayari limetajwa katika muktadha.
- source_word: τότε καὶ αὐτὸς
  choice: ndipo yeye pia
  rationale: ‘Ndipo’ huhifadhi mfuatano wa wakati, na ‘yeye pia’ huhifadhi mkazo wa nyongeza wa καὶ αὐτός.
- source_word: οὐ φανερῶς
  choice: si waziwazi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kutokwenda hadharani au kwa namna inayoonekana wazi.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: bali kama kwa siri
  rationale: ‘Kama kwa siri’ huhifadhi ὡς, ambayo huipa kauli sifa au upunguzaji mdogo, badala ya kuitafsiri moja kwa moja kuwa ‘kwa siri.’
theological_decisions:
- issue: Uhusiano wa tendo la Yesu hapa na kauli yake ya awali kuhusu kutokwenda kwenye sikukuu
  choice: Kusimulia moja kwa moja kwamba Yesu alienda baadaye, na si waziwazi
  alternative: Kufafanua kwa maneno ya ziada kwamba alibadili nia au kuondoa mvutano na 7:8
  rationale: Kigiriki hakitoi maelezo ya kuupatanisha mvutano huo. Tafsiri inahifadhi mfuatano na namna ya kwenda bila kuingiza hitimisho la kitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Si waziwazi, bali kama kwa siri’ huhifadhi utofautishaji na hali ya tahadhari ya Kigiriki; alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
