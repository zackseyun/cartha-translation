  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: sw
  text: Lakini watu wengi katika umati walimwamini, nao walikuwa wakisema, “Masihi[a] atakapokuja, hatafanya ishara nyingi zaidi kuliko alizofanya mtu huyu, sivyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός limetafsiriwa “Masihi” hapa kwa sababu limetumiwa kama cheo katika muktadha wa matarajio ya Kiyahudi kuhusu Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Lakini watu wengi katika umati
  rationale: δὲ inaonyesha utofautishaji wa kiasi na hali ya kutokuamini na mabishano katika muktadha; ‘Lakini’ huonyesha hilo kwa kawaida. ‘Watu wengi katika umati’ huhifadhi maana ya kundi kubwa lililokuwa sehemu ya umati.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: walimwamini
  rationale: Kitenzi ‘kumwamini’ katika Kiswahili huonyesha imani iliyoelekezwa kwa mtu, na kwa kawaida hubeba maana ya kumtegemea, si kukubali tu kwamba asemalo ni kweli.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Muundo huu huhifadhi hali endelevu au ya kurudiwa-rudiwa ya wakati usiotimilika wa Kigiriki.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo katika mazingira ya matarajio ya Kiyahudi kuhusu yule atakayekuja; ‘Masihi’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: ὅταν ἔλθῃ
  choice: atakapokuja
  rationale: Muundo huu wa Kiswahili unaeleza tukio la wakati ujao linalotarajiwa bila kulibadili kuwa sharti la ‘ikiwa.’
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: hatafanya ishara nyingi zaidi ... sivyo?
  rationale: Kauli hasi pamoja na ‘sivyo?’ huhifadhi swali la balagha linalotarajia jibu hasi, badala ya kulifanya swali lisiloegemea upande wowote.
- source_word: πλείονα σημεῖα
  choice: ishara nyingi zaidi
  rationale: πλείονα inaonyesha wingi zaidi, si lazima ukubwa au ubora zaidi; ‘ishara’ pia huhifadhi istilahi muhimu ya Yohane badala ya kuibadili kuwa ‘miujiza.’
- source_word: ὧν οὗτος ἐποίησεν
  choice: kuliko alizofanya mtu huyu
  rationale: ‘Mtu huyu’ ni njia ya kawaida ya kurejelea Yesu katika usemi wa hadharani, na ‘alizofanya’ huweka wazi ulinganisho na ishara ambazo tayari amefanya.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha unasema kuhusu kuja kwa mwenye cheo hicho, hivyo ‘Masihi’ huhifadhi mazingira ya matarajio ya Kiyahudi. ‘Kristo’ linawekwa katika tanbihi kama tafsiri mbadala ya neno lilelile.
- issue: Nguvu ya swali lenye μή
  choice: Swali hasi linalotarajia jibu ‘hapana,’ likitumia ‘sivyo?’
  alternative: Swali la kawaida lisiloonyesha jibu linalotarajiwa
  rationale: μή katika swali hili kwa kawaida huashiria kuwa msemaji anatarajia jibu hasi. Tafsiri hailazimishi hitimisho la kiteolojia kuhusu kina cha imani ya umati, bali huhifadhi namna yao ya kujenga hoja kutokana na ishara za Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi bila kuwa kigumu. ‘Walikuwa wakisema’ huhifadhi mwendelezo wa usemi, na ‘sivyo?’ hufanya swali la balagha lisikike kwa kawaida huku likihifadhi matarajio ya jibu hasi.
