  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: sw
  text: Je, kuna yeyote miongoni mwa watawala au miongoni mwa Mafarisayo aliyemwamini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: swali lililoanzishwa kwa μή linatarajia jibu la “hapana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: Je, kuna yeyote
  rationale: Muundo huu unahifadhi swali la balagha katika Kiswahili cha kawaida; μή huonyesha kwamba msemaji anatarajia jibu la ‘hapana,’ lakini maana hiyo haigeuzwi kuwa kauli ya wazi katika matini kuu.
- source_word: ἐκ τῶν ἀρχόντων
  choice: miongoni mwa watawala
  rationale: Ἄρχοντες hapa ni viongozi wenye mamlaka katika jamii ya Kiyahudi. ‘Watawala’ huhifadhi maana ya mamlaka, na ‘miongoni mwa’ huonyesha kuwa mtu huyo angekuwa mmoja wa kundi hilo.
- source_word: ἐπίστευσεν
  choice: aliyemwamini
  rationale: Kitenzi cha wakati uliopita kinawasilisha tendo la kuamini kwa njia ya kawaida na yenye kueleweka, huku kishazi rejeshi kikilingana kiasili na ‘yeyote.’
- source_word: εἰς αὐτόν
  choice: -mwamini
  rationale: Katika muundo huu, πιστεύω εἰς humaanisha kumwamini mtu au kuweka imani kwake. Kiswahili huwasilisha maana hiyo kiasili kwa kitenzi ‘kumwamini.’
- source_word: ἢ
  choice: au
  rationale: ‘Au’ ni kiunganishi cha moja kwa moja na cha kawaida, bila kuongeza msisitizo usiotajwa wazi katika Kigiriki.
- source_word: ἐκ τῶν Φαρισαίων
  choice: miongoni mwa Mafarisayo
  rationale: Ukariri wa ‘miongoni mwa’ huhifadhi ulinganifu wa muundo wa Kigiriki na kuonyesha uanachama katika kundi la Mafarisayo.
theological_decisions:
- issue: Nguvu ya balagha ya swali lenye μή
  choice: Kulitoa kama swali linalotarajia jibu la ‘hapana,’ bila kuligeuza kuwa kanusho la moja kwa moja.
  alternative: Hakuna hata mmoja wa watawala au Mafarisayo aliyemwamini.
  rationale: Kigiriki kinaashiria matarajio ya jibu hasi, lakini bado kinatumia swali. Kuhifadhi umbo hilo hudumisha sauti ya dharau ya wasemaji na mvutano wa simulizi bila kueleza zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Ukariri wa ‘miongoni mwa’ umehifadhiwa ili kuonyesha wazi makundi mawili yanayotajwa katika chanzo.
