base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: sw
  text: Basi Yesu akawajibu, akasema, “Mafundisho yangu si yangu, bali ni ya yule aliyenituma.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς
  choice: Basi Yesu akawajibu
  rationale: “Basi” linaendeleza mtiririko wa hoja ya simulizi; “akawajibu” ni Kiswahili cha kawaida kinachowakilisha kitenzi cha kujibu pamoja na kiwakilishi cha walengwa.
- source_word: καὶ εἶπεν
  choice: akasema
  rationale: Muundo wa Kigiriki una vitenzi vyote viwili, “akajibu” na “akasema.” Kuvihifadhi katika Kiswahili ni kwa kawaida na kunafuata kwa karibu ushahidi wa chanzo.
- source_word: διδαχή
  choice: mafundisho
  rationale: “Mafundisho” ni neno la kawaida, lenye heshima, lisilo la kitaalamu kupita kiasi kwa maelekezo yanayofundishwa.
- source_word: Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ
  choice: Mafundisho yangu si yangu
  rationale: Huhifadhi urudiaji wenye msisitizo wa viwakilishi vya umilikaji katika Kigiriki na tofauti inayofuata.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: bali ni ya yule aliyenituma
  rationale: “Ni ya” huakisi umilikaji au chanzo kinachodokezwa na hali milikishi ya Kigiriki bila kulazimisha mojawapo pekee; “aliyenituma” ni tafsiri ya moja kwa moja na ya kawaida ya kishiriki.
theological_decisions:
- issue: Uhusiano wa mafundisho ya Yesu na yule aliyemtuma
  choice: Mafundisho yangu si yangu, bali ni ya yule aliyenituma
  alternative: Mafundisho yangu hayatoki kwangu, bali kwa yule aliyenituma
  rationale: Tafsiri iliyochaguliwa inadumisha tofauti kati ya Yesu na mtumaji, pamoja na utegemezi wa mafundisho hayo kwa mtumaji. Haifafanui kupita maandiko ikiwa hali milikishi inasisitiza umilikaji au chanzo, wala haiingizi hitimisho la kimadhehebu kuhusu asili ya Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa sasa. “Basi” na mfuatano “akawajibu, akasema” huhifadhi viunganishi na vitenzi vya chanzo bila kufanya sentensi kuwa nzito.
