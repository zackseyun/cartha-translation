  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: sw
  text: Umati ukamjibu[a], “Una pepo. Ni nani anayetafuta kukuua?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umepagawa na pepo.” Tafsiri ya neno kwa neno ni, “Una pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ukamjibu
  rationale: Kitenzi hiki cha kawaida cha masimulizi kinaonyesha jibu katika mazungumzo; umoja wa kitenzi unafuata nomino ya mkusanyiko ‘umati’, na kiambishi ‘-m-’ humrejelea Yesu.
- source_word: ὄχλος
  choice: umati
  rationale: ‘Umati’ ni neno la kawaida na lenye heshima kwa kundi kubwa la watu, na linafaa katika tukio hili.
- source_word: Δαιμόνιον ἔχεις
  choice: Una pepo
  rationale: Huhifadhi kwa ukaribu muundo wa Kigiriki, ‘una pepo’, bila kuufasiri zaidi kuwa hali ya kupagawa.
- source_word: τίς
  choice: Ni nani
  rationale: Huhifadhi kiwakilishi cha kuuliza kilicho wazi katika Kigiriki na nguvu ya swali la kukanusha kwa kejeli.
- source_word: ζητεῖ
  choice: anayetafuta
  rationale: Huwasilisha tendo linaloendelea la kutafuta, huku muundo wa Kiswahili ukiwa wa kawaida katika swali hili.
- source_word: ἀποκτεῖναι
  choice: kukuua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya infinitivu ‘kuua’, pamoja na kiambishi cha yambwa kinachomrejelea Yesu.
theological_decisions:
- issue: Jinsi ya kutafsiri δαιμόνιον katika shtaka dhidi ya Yesu
  choice: Una pepo
  alternative: Umepagawa na pepo
  rationale: Kauli hii inaripoti shtaka la umati bila kulithibitisha. Tafsiri ya karibu na maneno ya asili huhifadhi mvutano wa kifungu na haiongezi ufafanuzi wa hali ya kupagawa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, wazi na yenye heshima. ‘Umati’ na ‘Una pepo’ ni rahisi kueleweka, huku tanbihi ikitoa usemi wa kifasiri unaowezekana.
