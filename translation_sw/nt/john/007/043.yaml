  text: So there was a division in the crowd because of him.
translation:
  language: sw
  text: Kwa hiyo, kulitokea mgawanyiko miongoni mwa umati kwa sababu yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: ukagawanyika
  rationale: Nomino ya Kigiriki inaeleza mgawanyiko kati ya watu. Katika Kiswahili, muundo wa kitenzi “umati ukagawanyika” ni wa kawaida na unaonyesha wazi kupasuka kwa maoni ndani ya umati.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha matokeo ya mjadala uliotangulia. “Kwa hiyo” kinaunganisha sentensi kwa uwazi bila kuifanya hoja ionekane kuwa ya kimantiki kupita kiasi.
- source_word: ἐγένετο
  choice: ukagawanyika
  rationale: Pamoja na σχίσμα, kitenzi hiki kinaonyesha kwamba mgawanyiko ulitokea. Kiswahili cha kawaida huwasilisha wazo hilo kwa kitenzi “ukagawanyika” badala ya muundo mzito wa “mgawanyiko ukatokea.”
- source_word: ἐν τῷ ὄχλῳ
  choice: umati
  rationale: ὄχλος ni kundi kubwa la watu waliokusanyika. Kuufanya “umati” kuwa kiima cha kitenzi ni Kiswahili cha asili na huhifadhi maana ya mgawanyiko uliokuwa miongoni mwa watu hao.
- source_word: δι’ αὐτόν
  choice: kwa sababu yake
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu. “Kwa sababu yake” ni tafsiri ya moja kwa moja na ya kawaida, huku ikihifadhi kiwakilishi cha asili.
theological_decisions:
- issue: Rejeleo la αὐτόν
  choice: “yake” linamrejelea Yesu bila kumtaja moja kwa moja
  alternative: kwa sababu ya Yesu
  rationale: Muktadha unaonyesha kwamba kiwakilishi kinamrejelea Yesu, lakini maandishi ya Kigiriki yanatumia kiwakilishi. Kukihifadhi huepuka kuongeza ufafanuzi usio wa lazima na hudumisha mtindo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kawaida kwa wasomaji wa jumla; hakuna alama za tanbihi zinazohitajika.
