id: JHN.7.7
reference: John 7:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: sw
  text: Ulimwengu[a] hauwezi kuwachukia ninyi, lakini unanichukia mimi, kwa sababu ninashuhudia[b] juu yake kwamba matendo yake[c] ni maovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Injili ya Yohana, “ulimwengu” mara nyingi humaanisha wanadamu na mpangilio wao unaompinga Mungu, si ulimwengu ulioumbwa kwa ujumla wake.
    reason: cultural_note
  - marker: b
    text: Au, “ninatoa ushahidi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kazi zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: hauwezi
  rationale: Kitenzi hiki kinahifadhi wazi wazo la kutoweza lililo katika δύναμαι, huku kikitumia Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ὁ κόσμος
  choice: ulimwengu
  rationale: Hili ndilo neno la kawaida kwa κόσμος na linahifadhi upana wa matumizi ya Yohana bila kulifafanua katika matini kuu kuwa mfumo fulani au kundi fulani la watu.
- source_word: μισεῖν / μισεῖ
  choice: kuwachukia / unanichukia
  rationale: Mzizi uleule umetafsiriwa kwa chuki katika sehemu zote mbili ili kuhifadhi ukali wa kauli na ulinganisho kati ya ‘ninyi’ na ‘mimi.’
- source_word: ἐμὲ δὲ
  choice: lakini unanichukia mimi
  rationale: ‘Lakini’ linaonyesha ulinganisho wa δέ, na ‘mimi’ baada ya kitenzi linaendeleza mkazo wa kiwakilishi ἐμέ kwa Kiswahili cha asili.
- source_word: μαρτυρῶ
  choice: ninashuhudia
  rationale: Neno hili linahifadhi maana ya kutoa ushahidi au ushuhuda, ambayo ni muhimu katika msamiati wa Yohana.
- source_word: περὶ αὐτοῦ
  choice: juu yake
  rationale: Usemi huu unaonyesha kwamba ushuhuda unahusu ulimwengu; kiwakilishi kinahifadhi muundo wa chanzo bila kugeuza ulimwengu kuwa mtu.
- source_word: τὰ ἔργα αὐτοῦ
  choice: matendo yake
  rationale: ‘Matendo’ ni Kiswahili cha kawaida kinachoonyesha mambo ambayo ulimwengu unatenda na kinabeba maana ya kimaadili ya ἔργα katika muktadha huu.
- source_word: πονηρά
  choice: maovu
  rationale: Kivumishi hiki kinaonyesha ubaya wa kimaadili, si hali ya kutofaa tu; ‘maovu’ kinahifadhi uzito huo.
theological_decisions:
- issue: Maana ya ‘ulimwengu’ katika muktadha wa Yohana
  choice: Kubakiza ‘ulimwengu’ bila ufafanuzi wa kimadhehebu katika matini kuu
  alternative: mfumo wa ulimwengu; wanadamu wanaompinga Mungu
  rationale: Katika Yohana, κόσμος inaweza kuwa na maana yenye tabaka mbalimbali. Hapa inaonyeshwa kuwa na uadui dhidi ya Yesu kwa sababu anafunua uovu wa matendo yake. Kutumia ‘ulimwengu’ kunahifadhi upana na mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio ‘unanichukia mimi’ umetumiwa kwa makusudi kuhifadhi mkazo wa ulinganisho katika Kigiriki.
