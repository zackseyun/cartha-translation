  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: sw
  text: Mtu yeyote akitaka kufanya mapenzi ya Mungu, atajua kuhusu fundisho hilo, kama linatoka kwa Mungu au kama ninayosema yanatoka kwangu mwenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninasema kwa kujitegemea” au “kwa mamlaka yangu mwenyewe.” Kigiriki kinasema kihalisi “ninasema kutoka kwangu mwenyewe.”
    reason: Kueleza njia nyingine za kutafsiri ἀπ’ ἐμαυτοῦ huku tafsiri kuu ikihifadhi wazo la chanzo.
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Mtu yeyote akitaka
  rationale: Muundo huu unaonyesha sharti la jumla. “Akitaka” ni Kiswahili cha kawaida kinachohifadhi maana ya nia au utayari.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: kufanya mapenzi yake
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaolingana moja kwa moja na kufanya mapenzi ya mtu. Kiwakilishi “yake” kimehifadhiwa kama katika Kigiriki.
- source_word: γνώσεται
  choice: atajua
  rationale: Wakati ujao unaonyesha ujuzi au utambuzi utakaotokana na sharti lililotajwa; “atajua” ni fupi na ya asili.
- source_word: περὶ τῆς διδαχῆς
  choice: kama fundisho hili
  rationale: Katika Kiswahili, kitenzi “atajua” kinaweza kufuatiwa moja kwa moja na kishazi cha “kama ... au kama ...”; “fundisho hili” linaonyesha fundisho la Yesu linalozungumziwa katika muktadha.
- source_word: πότερον ... ἢ
  choice: kama ... au kama
  rationale: Muundo huu unaweka wazi njia mbili zinazotofautishwa.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: linatoka kwa Mungu
  rationale: “Linatoka kwa Mungu” huonyesha asili au chanzo kinachoonyeshwa na ἐκ kwa Kiswahili cha kawaida.
- source_word: ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ
  choice: ninachosema kinatoka kwangu mwenyewe
  rationale: Mpangilio huu ni wa asili zaidi katika Kiswahili kuliko “ninasema kutoka kwangu mwenyewe,” huku ukihifadhi wazo la kwamba chanzo cha maneno hayo kingekuwa Yesu mwenyewe.
theological_decisions:
- issue: Kirejewa cha αὐτοῦ katika “mapenzi yake”
  choice: Kiwakilishi “yake” kimehifadhiwa, huku muktadha ukionyesha kwamba kinamrejelea Mungu.
  alternative: mapenzi ya Mungu
  rationale: Muktadha unaweka wazi kirejewa, lakini kutaja “Mungu” moja kwa moja hapa kungeongeza ufafanuzi ambao haupo katika muundo wa Kigiriki.
- issue: Maana ya ἀπ’ ἐμαυτοῦ
  choice: ninachosema kinatoka kwangu mwenyewe
  alternative: ninasema kwa kujitegemea / kwa mamlaka yangu mwenyewe
  rationale: Tafsiri kuu inadumisha picha ya chanzo au asili ya maneno bila kuamua kimyakimya kwamba kifungu hicho kinamaanisha mamlaka pekee. Maana mbadala zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia mpangilio wa kawaida wa Kiswahili na imehifadhi utofauti kati ya fundisho linalotoka kwa Mungu na maneno yanayotoka kwa Yesu mwenyewe.
