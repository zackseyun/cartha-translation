  source_fidelity: Tafsiri inafuata kwa karibu sharti, matokeo ya kujua, na uchaguzi kati ya asili ya fundisho kutoka kwa Mungu au usemi unaotoka kwa Yesu mwenyewe. Hata hivyo, “mapenzi yake” katika Kiswahili humrejelea kwa kawaida “mtu yeyote” aliyetajwa hivi karibuni, hivyo hubadilisha kirejewa kilichokusudiwa katika muktadha wa Kigiriki. “Fundisho hili” pia huongeza kidokezo cha “hili” ambacho si lazima katika kifungu hiki.
  naturalness: Muundo wa sentensi ni wa asili. “Atajua kuhusu fundisho hilo, kama ...” ni laini na huonyesha wazi zaidi uhusiano wa γνώσεται περὶ τῆς διδαχῆς kuliko “atajua kama fundisho hili ...”.
  terminology: “Mapenzi ya Mungu,” “fundisho,” na “linatoka kwa Mungu” ni istilahi sahihi na za Kiswahili Sanifu. “Ninachosema kinatoka kwangu mwenyewe” huhifadhi maana ya chanzo ya ἀπ’ ἐμαυτοῦ kwa namna ya kawaida; tanbihi hutoa njia mbadala bila kuilazimisha katika matini kuu.
