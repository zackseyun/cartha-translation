  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: sw
  text: Je, sheria yetu humhukumu mtu bila kwanza kumsikiliza na kujua anachofanya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: Je, ... bila ...?
  rationale: Swali lenye μή linatarajia jibu la kukataa. Muundo wa Kiswahili wa “Je, ... bila ...?” unaendeleza nguvu ya swali la balagha bila kuongeza jibu ndani ya mstari.
- source_word: ὁ νόμος ἡμῶν
  choice: sheria yetu
  rationale: Hurejelea kiwango cha kisheria cha jamii ya Nikodemo. Herufi ndogo huepuka kuamua kwamba rejeo ni Torati pekee.
- source_word: κρίνει
  choice: humhukumu
  rationale: Kitenzi hiki huhifadhi mazingira ya kisheria na maana pana ya kutoa hukumu, bila kukaza maana kuwa ‘humtia hatiani.’
- source_word: τὸν ἄνθρωπον
  choice: mtu
  rationale: ἄνθρωπος hapa ni umoja wa uwakilishi wenye maana ya jumla. ‘Mtu’ ni ya kawaida na sahihi katika Kiswahili bila kudokeza mtu maalumu.
- source_word: ἐὰν μὴ
  choice: bila
  rationale: 'Katika swali hili, ‘bila’ huonyesha kwa kawaida sharti la lazima: sheria haitoi hukumu kabla ya hatua zinazotajwa kufanyika.'
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: kwanza kumsikiliza
  rationale: παρ’ αὐτοῦ huonyesha kusikia kutoka kwake mwenyewe. ‘Kumsikiliza’ katika muktadha wa shauri la kisheria hueleweka kuwa kumpa nafasi aseme, huku ‘kwanza’ ikihifadhi mpangilio wa utaratibu.
- source_word: γνῷ
  choice: kujua
  rationale: Hueleza kufikia ufahamu wa ukweli wa shauri; ‘kujua’ ni fupi, wazi, na inaendana na mazingira.
- source_word: τί ποιεῖ
  choice: anachofanya
  rationale: Huhifadhi wakati wa sasa wa ποιεῖ bila kuubadili kuwa tendo lililokwisha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unabaki kuwa swali la balagha linalotarajia jibu la kukataa. Hakuna tanbihi inayohitajika, kwa kuwa ‘mtu’ huwasilisha umoja wa jumla kwa kawaida, na ‘kumsikiliza’ hutoa maana ya kumsikia mhusika mwenyewe katika muktadha huu.
