  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: sw
  text: Yule anayesema kutoka kwake mwenyewe hutafuta utukufu wake mwenyewe; lakini yule anayetafuta utukufu wa yule aliyemtuma, huyo ni wa kweli[a], wala hakuna ukosefu wa haki ndani yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkweli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uovu” au “jambo lisilo la haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: kutokana na nafsi yake
  rationale: Hudumisha kwa kiasi kikubwa taswira ya Kigiriki ya kusema 'kutoka kwake mwenyewe' na utofauti wake na kutumwa na mwingine; pia haiamui kimya kimya kama maana ni 'kwa mamlaka yake mwenyewe'.
- source_word: λαλῶν
  choice: anayesema
  rationale: Kitenzi cha wakati uliopo kinatumika kama nomino ya mtu; 'anayesema' ni Kiswahili cha kawaida na huonyesha kauli ya jumla.
- source_word: δόξαν
  choice: utukufu
  rationale: '''Utukufu'' ni tafsiri iliyozoeleka ya δόξα katika Yohana na hubeba maana ya heshima pamoja na uzito wake wa kitheolojia.'
- source_word: τὴν ἰδίαν
  choice: wake mwenyewe
  rationale: Huonyesha kwa wazi kuwa utukufu huo ni wake binafsi na hudumisha utofauti na utukufu wa aliyemtuma.
- source_word: ζητεῖ
  choice: hutafuta / anayetafuta
  rationale: Hutafsiri maana ya msingi ya ζητέω na kudumisha urudiaji wa kitenzi katika pande zote mbili za sentensi.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: wa yule aliyemtuma
  rationale: Huwakilisha kirai nomino cha kishiriki kwa Kiswahili cha asili huku kikidumisha tendo na mhusika wa kutuma.
- source_word: οὗτος
  choice: huyo
  rationale: Kiwakilishi hiki hudumisha msisitizo wa οὗτος kwa namna ya kawaida katika Kiswahili.
- source_word: ἀληθής
  choice: wa kweli
  rationale: Huhifadhi upana wa ἀληθής na msamiati wa Kiyohana; inaweza kumaanisha pia mwenye kusema kweli, jambo linalowekwa katika tanbihi.
- source_word: ἀδικία
  choice: udhalimu
  rationale: '''Udhalimu'' hubeba wazo pana la kutokuwa sawa au kutenda yasiyo haki, bila kulifunga neno hilo kwenye kosa moja maalumu.'
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: wala ndani yake hamna udhalimu
  rationale: Huhifadhi muundo wa ndani wa maelezo ya tabia katika Kigiriki na ni usemi unaoeleweka katika Kiswahili sanifu.
theological_decisions:
- issue: Utofauti kati ya kusema ἀφ’ ἑαυτοῦ na kutafuta utukufu wa aliyemtuma
  choice: Kutafsiri kwa lugha inayodumisha utofauti kati ya chanzo/lengo la kujitukuza na kutafuta utukufu wa mtumaji.
  alternative: Kufafanua moja kwa moja kuwa ni kusema 'kwa mamlaka yake mwenyewe'.
  rationale: Muktadha unahusu chanzo na kusudi la mafundisho, lakini kirai cha Kigiriki hakilazimishi tafsiri moja tu ya mamlaka; hivyo tafsiri haiongezi mfumo wa mafundisho usiotajwa wazi.
- issue: Maana ya ἀληθής
  choice: wa kweli
  alternative: mkweli
  rationale: '''Wa kweli'' hudumisha upana wa neno, likiwezesha kueleza uhalisi na uaminifu; ''mkweli'' ni chaguo linalowezekana lakini ni jembamba zaidi.'
- issue: Maana ya ἀδικία
  choice: udhalimu
  alternative: uovu au kutenda yasiyo haki
  rationale: Neno la Kigiriki linaweza kuhusisha kutokuwa na haki, uovu, au kosa la kimaadili. 'Udhalimu' hudumisha uzito huo bila kuuweka katika eneo la kijamii au kisheria pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha ulinganifu wa vifungu viwili vya Kigiriki. 'Kutokana na nafsi yake' ni rasmi kidogo, lakini husaidia kuhifadhi utata halisi kati ya kusema kutoka kwake mwenyewe, kwa kujitegemea, au kwa mamlaka yake mwenyewe.
