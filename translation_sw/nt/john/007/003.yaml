  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: sw
  text: Basi ndugu zake wakamwambia, “Ondoka hapa, uende Yudea, ili wanafunzi wako pia waone[a] matendo unayofanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wataona” au “watazame.” Kitenzi cha Kigiriki kinaweza kusisitiza kutazama kwa makini au kuona, na umbo lake la wakati ujao katika kishazi hiki cha kusudi linaweza kutafsiriwa kwa njia tofauti kidogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachoendeleza simulizi na kuhifadhi nguvu ya hitimisho au mfuatano wa οὖν bila kuwa rasmi kupita kiasi.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: ndugu zake
  rationale: Katika muktadha huu wingi wa kiume wa Kigiriki unawahusu ndugu wa kiume wa Yesu. Kiswahili sanifu kwa kawaida hutumia ‘ndugu zake’; muktadha unaweka wazi kuwa hawa ni watu wa familia yake bila kuongeza dai lisilosemwa na mstari.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Ondoka hapa
  rationale: Kauli ya amri ya Kigiriki inadai kuondoka mahali walipo; ‘Ondoka hapa’ ni ya moja kwa moja, ya sasa na ya asili katika Kiswahili.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: uende Uyahudi
  rationale: Huhifadhi amri ya kwenda katika eneo la Ἰουδαία kwa muundo wa Kiswahili unaotiririka baada ya ‘Ondoka hapa.’
- source_word: ἵνα καὶ
  choice: ili ... pia
  rationale: ‘Ili’ huonyesha kusudi, na ‘pia’ huhifadhi maana ya καὶ inayohusiana na wanafunzi wake.
- source_word: οἱ μαθηταί σου
  choice: wanafunzi wako
  rationale: ‘Wanafunzi’ huhifadhi uhusiano wa mwalimu na wanaojifunza unaodokezwa na μαθηταί na ni istilahi ya kawaida katika muktadha wa Yohana.
- source_word: θεωρήσουσιν
  choice: waone
  rationale: Ingawa umbo la Kigiriki ni la wakati ujao, linatokea katika kishazi cha kusudi baada ya ἵνα. ‘Waone’ ni Kiswahili cha kawaida kwa kusudi hilo, huku tanbihi ikihifadhi uwezekano wa kusisitiza kutazama au wakati ujao.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: matendo unayofanya
  rationale: Muundo huu ni wa asili katika Kiswahili na huhifadhi ἔργα kama ‘matendo,’ neno lenye uzito wa kimada katika Injili ya Yohana, bila kurudia umilikishi kwa namna isiyo ya kawaida.
theological_decisions:
- issue: Wanaorejelewa na ‘ndugu zake’
  choice: Watu wa familia ya Yesu ndio wazungumzaji katika simulizi.
  alternative: Neno linaweza kueleweka kwa upana kama jamaa au ndugu wa ukoo.
  rationale: Muktadha wa Yohana 7:3–5 unawasilisha ndugu wa Yesu wakizungumza naye. Tafsiri inabaki na neno la kawaida la kifamilia bila kuingiza hitimisho la kimadhehebu kuhusu uhusiano wao mahususi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Amri ‘Ondoka hapa uende Uyahudi’ ni ya moja kwa moja, na muundo wa kishazi cha kusudi ni wa kawaida katika matumizi ya sasa.
