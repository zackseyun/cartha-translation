  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: sw
  text: Anayeniamini—kama Andiko lilivyosema[a]—mito ya maji yaliyo hai itatiririka kutoka tumboni mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mgawanyo wa sentensi unaweza pia kueleweka hivi: “Anayeniamini kama Andiko lilivyosema, mito ya maji yaliyo hai itatiririka kutoka tumboni mwake.” Kigiriki cha kale hakina alama za uakifishaji zinazotatua jambo hili kabisa.'
    reason: syntactic_ambiguity
  - marker: b
    text: Kwa Kigiriki, “tumbo” au “tumbo la uzazi”; hapa huenda ni usemi wa mfano unaomaanisha undani wa mtu. Baadhi huelewa “mwake” kuwa linamrejelea Masihi badala ya mwamini.
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Anayeniamini
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unaonyesha mtu anayemwamini Yesu; unahifadhi maana ya kishirikishi chenye kibainishi bila kutumia tafsiri nzito isiyo ya kawaida.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: kama Andiko lilivyosema
  rationale: “Andiko” linahifadhi umoja wa ἡ γραφή, na “lilivyosema” linaakisi kitenzi cha wakati uliopita huku likibaki la kawaida katika Kiswahili.
- source_word: ποταμοὶ
  choice: mito
  rationale: Neno hili linahifadhi picha ya wingi na utele wa maji, bila kuipunguza kuwa vijito.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: kutoka tumboni mwake
  rationale: “Tumboni” linawakilisha moja kwa moja κοιλία, ambalo kihalisi ni tumbo au, katika baadhi ya matumizi, tumbo la uzazi; hapa linaweza kutumiwa kwa mfano kuhusu undani wa mtu. Kiwakilishi cha umoja kimehifadhiwa.
- source_word: ῥεύσουσιν
  choice: itatiririka
  rationale: Hii ni tafsiri ya kawaida ya kitenzi cha wakati ujao, bila kuongeza nguvu ya maana kama vile “itabubujika.”
- source_word: ὕδατος ζῶντος
  choice: maji yaliyo hai
  rationale: Usemi huu unahifadhi sitiari ya Kiyohana na mwangwi wake wa kiteolojia badala ya kuufafanua tu kuwa maji yanayotoa uzima.
theological_decisions:
- issue: Kirejeleo cha αὐτοῦ katika “tumboni mwake”
  choice: Katika usomaji wa kawaida wa kisarufi, “mwake” kinamrejelea yule anayemwamini Yesu.
  alternative: Baadhi huona kwamba kinamrejelea Masihi/Yesu, hivyo mito inatoka kwake.
  rationale: Mtangulizi wa karibu wa kisarufi ni “anayeniamini,” na mstari unaofuata unahusisha kauli hii na Roho ambaye waamini wangempokea. Hata hivyo, uwezekano wa kumrejelea Masihi umewekwa katika tanbihi ili kutofunga mvutano wa kifasiri.
- issue: Uhusiano wa “kama Andiko lilivyosema” na sehemu nyingine ya sentensi
  choice: Dashi zimetumiwa kuonyesha kuwa kifungu hiki kinaweza kusomwa kama kauli ya kuingiza ushahidi wa Andiko kabla ya ahadi kuhusu mito.
  alternative: 'Kifungu kinaweza kuunganishwa moja kwa moja na “anayeniamini”: “anayeniamini kama Andiko lilivyosema.”'
  rationale: Nakala ya Kigiriki ya kale haina alama za uakifishaji zinazotatua kabisa mgawanyo huu. Tafsiri kuu inafuata mgawanyo unaoeleweka zaidi katika muktadha, huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Maana ya κοιλία
  choice: tumbo, likiwa na uwezekano wa maana ya mfano kuhusu undani wa mtu
  alternative: ndani yake; utu wake wa ndani; tumbo la uzazi
  rationale: Kutumia “tumboni” kunahifadhi picha halisi ya Kigiriki na kuepuka kuifanya maana ya mfano kuwa tafsiri pekee. Tanbihi inaeleza matumizi yanayowezekana katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa “Anayeniamini” ni wa asili; “Andiko” huhifadhi umoja wa Kigiriki; na “tumboni mwake” huhifadhi sitiari ya chanzo bila kuifafanua kupita kiasi.
