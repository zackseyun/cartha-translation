base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: sw
  text: 'Hii ni kauli gani aliyosema[a]: “Mtanitafuta na hamtanipata, na nilipo mimi[b], ninyi hamwezi kuja”?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno hili” au “usemi huu.” Neno la Kigiriki λόγος linaweza kumaanisha “neno,” “kauli,” “ujumbe,” au “usemi,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya tafsiri husema “ninakokwenda,” lakini maandishi ya Kigiriki hapa yanasema “nilipo,” yakihifadhi mvutano wa kimakusudi katika maneno ya Yohana.
    reason: alternative_reading
  - marker: c
    text: 'Inawezekana pia kuweka alama za kunukuu kana kwamba ni kauli mbili: “Mtanitafuta na hamtanipata,” na, “Nilipo mimi, ninyi hamwezi kuja.” Hata hivyo, Kigiriki kinaunganisha sehemu hizo kwa “na” ndani ya kauli moja.'
    reason: punctuation_alternative
lexical_decisions:
- source_word: λόγος
  choice: kauli
  rationale: Katika muktadha huu, λόγος inarejelea jambo alilosema Yesu, si neno moja tu. “Kauli” ni Kiswahili cha sasa, cha heshima, kinachowasilisha wazo la usemi au tamko bila kulipanua kuwa ujumbe mzima.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: Kauli hii ... ina maana gani
  rationale: Tafsiri ya neno kwa neno, “Ni kauli gani hii,” haisikiki kwa ufasaha katika Kiswahili. Swali hili la kawaida linaonyesha kwamba wasikilizaji wanauliza maana ya kauli hiyo huku likidumisha rejeo la wazi kwa kauli yenyewe.
- source_word: Ζητήσετέ με
  choice: Mtanitafuta
  rationale: Kitenzi “kutafuta” ni ulinganifu wa kawaida na wa moja kwa moja wa ζητέω na hudumisha uzito wa usemi wa Yohana.
- source_word: οὐχ εὑρήσετε
  choice: hamtanipata
  rationale: Huwasilisha ukanushaji wa wakati ujao kwa kawaida katika Kiswahili na kurudia kiambishi cha mtendwa “-ni-” kwa uwazi.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: nilipo mimi
  rationale: Huhifadhi wakati uliopo wa εἰμί na msisitizo wa kiwakilishi ἐγώ. Haibadilishwi kuwa “ninakokwenda,” jambo ambalo lingeondoa mvutano wa kimakusudi wa maneno ya Yohana.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ninyi hamwezi kuja
  rationale: “Hamwezi” huonyesha moja kwa moja kutoweza kulikomo katika δύνασθε; “ninyi” huhifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: εἶπε
  choice: aliyosema
  rationale: Ni tafsiri ya kawaida ya εἶπε katika kishazi kinachoanzisha maneno yaliyonukuliwa.
theological_decisions:
- issue: Wakati uliopo katika kauli ya Yesu, ὅπου εἰμὶ ἐγώ
  choice: nilipo mimi
  alternative: ninakokwenda
  rationale: Maandishi ya Kigiriki yanasema “nilipo,” si “ninakokwenda.” Kuhifadhi wakati uliopo kunadumisha mvutano wa kitheolojia katika Injili ya Yohana kuhusu asili, utambulisho na uhusiano wa Yesu na Baba bila kuufafanua kwa kulazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Kauli hii ... ina maana gani” imetumiwa badala ya muundo mgumu wa neno kwa neno. Wakati uliopo katika “nilipo mimi” umehifadhiwa kwa makusudi.
