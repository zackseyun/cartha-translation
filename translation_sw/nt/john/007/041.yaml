  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: sw
  text: Wengine walikuwa wakisema, “Huyu ndiye Masihi.[a]” Lakini wengine walikuwa wakisema, “Kwani Masihi anatoka Galilaya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι
  choice: Wengine
  rationale: Nomino-kivumishi ya wingi inaonyesha kundi jingine katika umati; ‘Wengine’ ni ya kawaida na huhifadhi utofautishaji.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Wakati usiotimilifu unaonyesha usemi uliokuwa ukiendelea au kurudiwa katika umati.
- source_word: Οὗτός ἐστιν
  choice: Huyu ndiye
  rationale: Huu ni utambulisho wa kawaida na wenye mkazo wa mtu anayezungumziwa.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha yule mtiwa-mafuta aliyetarajiwa, si jina la kawaida.
- source_word: οἱ δὲ
  choice: Lakini wengine
  rationale: Kifungu hiki kinaanzisha kundi tofauti lenye kauli inayopingana.
- source_word: Μὴ γὰρ
  choice: Kwani ...?
  rationale: Swali la Kiswahili lenye ‘Kwani’ hapa huonyesha mshangao au upinzani na kutarajia jibu la kukataa, bila kulifanya kuwa tamko la moja kwa moja.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: anatoka Galilaya
  rationale: ἐκ huonyesha chanzo au mahali anapotoka mtu; ‘kutoka Galilaya’ ni usemi wa kawaida wa Kiswahili.
- source_word: ἔρχεται
  choice: anatoka
  rationale: Katika muktadha wa mahali pa asili, kitenzi pamoja na ἐκ kinaelezwa kwa kawaida kwa ‘anatoka’.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Mjadala wa umati unamhusu mtiwa-mafuta aliyetarajiwa; ‘Masihi’ huhifadhi wazi maana ya cheo, huku ‘Kristo’ ikitajwa katika tanbihi kama namna nyingine iliyozoeleka.
- issue: Nguvu ya swali Μὴ γὰρ
  choice: Kwani Masihi anatoka Galilaya?
  alternative: Hakika Masihi hatoki Galilaya, sivyo?
  rationale: Muundo uliochaguliwa ni wa asili katika Kiswahili na bado unaashiria kwamba wasemaji walitarajia jibu la kukataa; haugeuzi swali kuwa madai yasiyo na utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Tanbihi isiyohitajika kuhusu Galilaya haikurudiwa kwa kuwa toleo lake la Kiingereza lilitoa sentensi ileile badala ya mbadala halisi.
