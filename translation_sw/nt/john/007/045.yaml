  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: sw
  text: Basi wale walinzi wakaja kwa wakuu wa makuhani na Mafarisayo, nao wakawaambia, “Kwa nini hamkumleta?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kuonyesha matokeo ya yaliyotangulia; “Basi” ni cha kawaida na cha asili katika Kiswahili.
- source_word: ὑπηρέται
  choice: walinzi
  rationale: Katika muktadha huu ni maafisa waliotumwa kumkamata Yesu. “Walinzi” linaeleweka kwa urahisi bila kuongeza kwa wazi neno “hekalu,” ambalo halipo katika mstari huu.
- source_word: ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unamaanisha kundi la watawala wakuu wa kikuhani, si makuhani wakuu wengi wenye cheo kilekile. Usemi huu ni wazi katika Kiswahili cha sasa.
- source_word: Φαρισαίους
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi.
- source_word: ἐκεῖνοι
  choice: nao
  rationale: Kiwakilishi hiki kinawarejelea kwa mkazo viongozi wa makuhani na Mafarisayo kama waulizaji. “Nao” hutofautisha kundi hilo na walinzi kwa njia ya asili bila kutumia usemi mzito kama “wale watu.”
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo njia ya kawaida na sahihi ya kuuliza sababu katika Kiswahili.
- source_word: οὐκ ἠγάγετε αὐτόν
  choice: hamkumleta
  rationale: Kitenzi kinaweza kumaanisha kuongoza au kuleta; hapa “kumleta” kinafaa kwa kuwa walinzi walikuwa wametumwa kumkamata Yesu na kumfikisha kwa viongozi.
