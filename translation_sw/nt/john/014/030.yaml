  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: sw
  text: Sitasema tena mengi nanyi, kwa maana mtawala wa ulimwengu anakuja[a]. Naye hana chochote ndani yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtawala wa ulimwengu huu.” Baadhi ya tafsiri huongeza “huu” kwa kuzingatia misemo inayofanana mahali pengine katika Yohana, lakini Kigiriki hapa kinasema tu “wa ulimwengu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hana dai lolote juu yangu” au “hana mshiko wowote juu yangu.” Kigiriki kinasema kihalisi, “hana chochote ndani yangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  choice: Sitasema mengi zaidi nanyi
  rationale: Huwasilisha kukoma kunakodokezwa na οὐκέτι pamoja na maana ya πολλὰ iliyotumiwa kama kielezi. Muundo huu ni wa kawaida katika Kiswahili na unadumisha wazo la Yesu kutosema mengi zaidi pamoja na wanafunzi wake.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati wa sasa wa Kigiriki unaonyesha ujio ulio karibu; ‘anakuja’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: mtawala wa ulimwengu
  rationale: ‘Mtawala’ huwasilisha ἄρχων kwa uwazi kuliko cheo cha kimapokeo ‘mkuu’ au ‘mfalme.’ Hakuna neno linalomaanisha ‘huu’ katika mstari huu wa Kigiriki, kwa hiyo halijaongezwa.
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: hana chochote ndani yangu
  rationale: Huhifadhi kwa makusudi usemi mfupi na wenye maana pana wa Kigiriki badala ya kuufafanua katika matini kuu kuwa hana dai, mamlaka, au nafasi yoyote dhidi ya Yesu.
theological_decisions:
- issue: Utambulisho wa ‘mtawala wa ulimwengu’
  choice: Cheo chenyewe kimetafsiriwa bila kukibadili kuwa ‘Shetani.’
  alternative: Shetani; au uwasilishaji wa jumla wa nguvu ovu za ulimwengu
  rationale: Katika muktadha wa Yohana, cheo hiki humrejelea mpinzani wa kiroho wa Yesu, anayeeleweka kwa kawaida kuwa Shetani. Hata hivyo, matini kuu inadumisha namna halisi ya rejeo la Kigiriki bila kutatua wazi jambo ambalo mstari unaliacha lifahamike kutokana na muktadha.
- issue: Maana ya ‘hana chochote ndani yangu’
  choice: Usemi halisi na wenye maana pana umehifadhiwa.
  alternative: Hana dai lolote juu yangu; hana uwezo wowote juu yangu; hana nafasi yoyote ndani yangu
  rationale: Kigiriki kinaweza kudokeza kwamba mtawala huyo hana dai, mshiko, mamlaka, au msingi wowote katika Yesu. Kutaja maana moja tu katika matini kuu kungepunguza upana wa usemi; hivyo maelezo mbadala yamewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa fupi na wazi, huku nahau yenye uzito wa kiteolojia ‘hana chochote ndani yangu’ ikihifadhiwa na kufafanuliwa katika tanbihi.
