lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi cha kawaida kinachoendeleza maneno yaliyotangulia bila kuongeza mkazo usiokuwamo.
- source_word: ὅπου
  choice: kule ninako-
  rationale: Kielezi cha mahali kimewasilishwa kwa muundo wa kawaida wa Kiswahili unaohusianisha njia na mahali Yesu anakokwenda.
- source_word: ἐγὼ
  choice: ni-
  rationale: Nafsi ya kwanza imeonyeshwa ndani ya kitenzi, kama ilivyo kawaida katika Kiswahili; kutumia “mimi” hapa kungeweza kuongeza mkazo usio wa lazima.
- source_word: ὑπάγω
  choice: ninakokwenda
  rationale: “Kwenda” huhifadhi maana ya mwendo bila kuifasiri zaidi kuwa kuondoka au kufika.
- source_word: οἴδατε
  choice: mnajua
  rationale: 'Ingawa umbo la Kigiriki ni la hali timilifu, οἶδα huwa na maana ya wakati wa sasa: kujua.'
- source_word: τὴν ὁδόν
  choice: njia
  rationale: “Njia” ni tafsiri ya kawaida na pana ya ὁδός, inayofaa hapa bila kuingiza mapema ufafanuzi wa Yohana 14:6.
theological_decisions:
- issue: Mpangilio wa vishazi na uhusiano wa “ninakokwenda” na “njia”
  choice: mnajua njia ya kule ninakokwenda
  alternative: ninakokwenda, mnaijua njia
  rationale: Muundo uliochaguliwa ni wa kawaida katika Kiswahili na unaonyesha kwamba njia inahusiana na mahali Yesu anakokwenda. Hauifafanui njia hiyo wala kuondoa mvutano unaojitokeza katika jibu la Tomaso kwenye mstari unaofuata.
- issue: Tofauti ya maandishi kuhusu kujua mahali na kujua njia
  choice: 'SBLGNT: mnajua njia ya kule ninakokwenda'
  alternative: Na mnajua ninakokwenda, na mnaijua njia
  rationale: Maandishi ya msingi yaliyotolewa yanataja kujua njia kuhusiana na mahali Yesu anakokwenda. Usomaji mrefu wa baadhi ya hati haujawekwa katika matini kuu, bali umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “njia ya kule ninakokwenda” unaeleweka kwa urahisi huku ukibaki karibu na uhusiano wa maneno ya Kigiriki.
