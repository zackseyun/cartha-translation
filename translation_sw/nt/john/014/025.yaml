lexical_decisions:
- source_word: Ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi cha kuonyesha cha wingi kisicho na jinsia kinarejelea mafundisho yaliyotangulia; “mambo haya” huhifadhi wingi na ni Kiswahili cha kawaida.
- source_word: λελάληκα
  choice: nimewaambia
  rationale: Kauli timilifu ya λαλέω inaonyesha maneno ambayo Yesu amekwisha kusema na ambayo yana umuhimu unaoendelea. “Nimewaambia” ni ya asili kwa Kiswahili na pia inajumuisha ὑμῖν bila kubadili maana.
- source_word: ὑμῖν
  choice: -wa-
  rationale: Kiambishi cha yambwa cha wingi katika “nimewaambia” kinaonyesha kuwa Yesu anawaelekea wanafunzi wengi.
- source_word: παρ’ ὑμῖν
  choice: pamoja nanyi
  rationale: παρά pamoja na hali ya dative huonyesha ukaribu au kuwapo; “pamoja nanyi” ni usemi wa kawaida unaoonyesha kuwapo kwa Yesu kwao.
- source_word: μένων
  choice: nikiwa bado
  rationale: Kirai hiki kinaonyesha tendo linaloendelea wakati Yesu anasema akiwa pamoja nao. “Bado” hudokeza kuendelea kwa kuwapo kwake, ingawa hakirudii moja kwa moja msamiati wa Yohane wa μένω; hilo linaelezwa katika tanbihi.
theological_decisions:
- issue: Kuhifadhi mwangwi wa kitenzi cha Kiyohane μένω bila kufanya Kiswahili kuwa kigumu
  choice: nikiwa bado pamoja nanyi
  alternative: nikiwa ninakaa pamoja nanyi
  rationale: “Kukaa” kinaweza kuhifadhi uhusiano wa wazi zaidi na matumizi mengine ya μένω, lakini hapa kinaweza kueleweka kama kuketi au kuishi mahali. “Nikiwa bado pamoja nanyi” hutoa maana ya kuendelea kuwapo kwa lugha ya kawaida bila kuingiza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kawaida; “nanyi” huhifadhi usemi wa pamoja unaofaa kwa hotuba ya Yesu kwa wanafunzi.
