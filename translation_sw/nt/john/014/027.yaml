base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: sw
  text: Amani nawaachieni; amani yangu nawapa. Mimi siwapi kama ulimwengu unavyotoa. Mioyo yenu isifadhaike wala isiwe na woga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala isiogope,” au “wala isipoteze ujasiri.” Kitenzi cha Kiyunani kinaweza kumaanisha kuogopa au kukosa ujasiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: amani
  rationale: ‘Amani’ ndiyo tafsiri ya kawaida na yenye upana unaofaa; haifungi maana katika kutokuwapo kwa vita, utulivu wa ndani, au ukamilifu wa kiagano pekee.
- source_word: ἀφίημι
  choice: nawaachieni
  rationale: Huonyesha Yesu kuwaachia wanafunzi wake amani. Hifadhi maana ya msingi bila kuongeza wazi wazo la urithi ambalo, ingawa linawezekana katika muktadha, halijasemwa moja kwa moja.
- source_word: τὴν ἐμὴν
  choice: amani yangu
  rationale: Hifadhi msisitizo wa umilikaji na tofauti kati ya amani ya Yesu na kile ambacho ulimwengu hutoa.
- source_word: δίδωμι
  choice: nawapa
  rationale: Wakati wa sasa na urudiaji wa kitenzi umehifadhiwa kwa lugha ya kawaida ya Kiswahili.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: Mimi siwapi kama ulimwengu utoavyo
  rationale: ‘Mimi’ huakisi msisitizo wa ἐγώ, na muundo huu huhifadhi ulinganisho wa namna Yesu anavyotoa na namna ulimwengu unavyotoa.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Ni neno pana na la kawaida linalohifadhi mwangwi wa matumizi ya Yohana bila kulifafanua kwa namna finyu kuwa jamii ya wanadamu au mfumo mwovu.
- source_word: μὴ ταρασσέσθω
  choice: Mioyo yenu isifadhaike
  rationale: ‘Kufadhaika’ huwasilisha hali ya kusumbuliwa au kuvurugika, na hulingana kwa kawaida na agizo la Yesu kwa wanafunzi wengi.
- source_word: ὑμῶν ἡ καρδία
  choice: mioyo yenu
  rationale: Kiyunani kina umoja wa kijumla, ‘moyo wenu,’ kwa kundi la wanafunzi. Kiswahili cha kawaida hutumia wingi ‘mioyo yenu’ unapozungumza na watu wengi, bila kubadili maana ya kijumla.
- source_word: μηδὲ δειλιάτω
  choice: wala isiwe na woga
  rationale: Huonyesha kuwa na hofu au kukosa ujasiri bila kutumia neno kali lenye hukumu ya kimaadili kama ‘kuwa mwoga.’
theological_decisions:
- issue: Asili ya amani anayoitoa Yesu
  choice: Kutumia tu ‘amani’ na ‘amani yangu’ bila kuipanua maana katika matini kuu
  alternative: Kuifafanua kuwa utulivu wa ndani, ukamilifu wa kiagano na wa wakati ujao, au upatanisho na Mungu
  rationale: Aya yenyewe haifafanui amani hiyo kwa maana moja finyu. Neno pana huhifadhi utajiri na mvutano wa kitheolojia wa kauli ya Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ‘Amani nawaachieni; amani yangu nawapa’ huhifadhi kutangulizwa kwa ‘amani’ katika Kiyunani na urudiaji wa kishairi. Wingi ‘mioyo yenu’ umetumiwa kwa ufasaha wa kawaida wa Kiswahili ingawa Kiyunani kina umoja wa kijumla.
