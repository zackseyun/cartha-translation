id: JHN.14.24
reference: John 14:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: sw
  text: Yule ambaye hanipendi hayashiki maneno yangu. Nalo neno mnalolisikia si langu, bali ni la Baba aliyenituma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Yule ambaye hanipendi
  rationale: Kirai chenye kiambishi cha nomino kinamtaja kwa ujumla mtu asiye na upendo kwa Yesu; tafsiri hii ni ya kawaida na inadumisha hali ya sasa ya kitenzi.
- source_word: τοὺς λόγους μου
  choice: maneno yangu
  rationale: Wingi wa λόγους umehifadhiwa, na “maneno” ni Kiswahili cha kawaida kinachodumisha uhusiano na mafundisho aliyoyasema Yesu.
- source_word: τηρεῖ
  choice: hayashiki
  rationale: “Kushika” katika muktadha huu hujumuisha kutii na kuyatunza kwa uaminifu, bila kupunguza maana kuwa utiifu wa amri pekee.
- source_word: ὁ λόγος
  choice: neno
  rationale: Umoja umehifadhiwa na unaweza kumaanisha kwa pamoja ujumbe au mafundisho ya Yesu, huku ukidumisha msamiati wa Yohana.
- source_word: ὃν ἀκούετε
  choice: mnalolisikia
  rationale: Huwasilisha wakati wa sasa kwa Kiswahili asilia bila kuongeza wazo lisilotajwa wazi la ‘kutoka kwangu.’
- source_word: οὐκ ἔστιν ἐμὸς
  choice: si langu
  rationale: Hufuata kwa karibu kivumishi milikishi cha Kigiriki na kuhifadhi kauli yenye mvutano kuhusu umiliki au chanzo.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: bali ni la Baba aliyenituma
  rationale: Uhusika wa umilikaji unaonyesha kwamba neno ni la Baba; muundo huu ni wa kawaida katika Kiswahili na unafanya “aliyenituma” imrejelee Baba kwa uwazi.
theological_decisions:
- issue: Uhusiano kati ya mafundisho ya Yesu na mafundisho ya Baba
  choice: si langu, bali ni la Baba aliyenituma
  alternative: halitoki kwangu, bali linatoka kwa Baba aliyenituma
  rationale: Tafsiri inadumisha utofauti kati ya Yesu na Baba pamoja na umoja wa ujumbe wao. Haiamui kimya kimya kama genitivi inaonyesha umiliki au chanzo, wala haidokezi kwamba Yesu anakataa mamlaka ya ujumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yule ambaye” ni wazi kwa wasomaji wa kawaida; “kushika maneno” inadumisha mtindo wa Yohana na maana ya kuyatii na kuyatunza.
