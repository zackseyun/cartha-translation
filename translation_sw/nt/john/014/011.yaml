  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: sw
  text: Niaminini kwamba mimi niko ndani ya Baba, na Baba yuko ndani yangu; lakini kama sivyo[a], aminini kwa sababu ya kazi zenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini msiponiamini, aminini kwa sababu ya kazi zenyewe.” Neno la mwisho “aminini” halina yambwa lililotajwa wazi katika Kigiriki; maana ni kwamba kazi zenyewe zinatoa msingi wa kuamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Niaminini
  rationale: Kitenzi πιστεύω pamoja na kiwakilishi katika hali ya dative humaanisha kwa kawaida ‘niaminini’ au ‘aminini ninachosema.’ ‘Niaminini’ ni usemi wa moja kwa moja na wa kawaida katika Kiswahili, unaohifadhi ombi la kibinafsi bila kulipanua.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι hutambulisha maudhui yanayopaswa kuaminiwa, si sababu ya kuamini; ‘kwamba’ huonyesha hilo wazi.
- source_word: ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί
  choice: mimi niko ndani ya Baba, na Baba yuko ndani yangu
  rationale: Kurudia kwa ἐν kunaonyesha kuwamo kwa kila mmoja ndani ya mwingine. ‘Ndani ya’ huhifadhi taswira na kina cha lugha ya Yohana bila kuibadili kuwa fasiri kama ‘mmoja na.’
- source_word: εἰ δὲ μή
  choice: lakini kama sivyo
  rationale: Nahau hii huleta msingi mwingine wa kuamini iwapo dai lililotangulia halikubaliwi. ‘Lakini kama sivyo’ huhifadhi utofautishaji na hali ya sharti, ingawa rejea yake hubaki kwa kiasi fulani wazi kama ilivyo katika Kigiriki.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: kwa sababu ya kazi zenyewe
  rationale: διά pamoja na accusative huonyesha sababu au msingi. ‘Kwa sababu ya’ ni Kiswahili cha kawaida, ‘kazi’ huhifadhi upana wa ἔργα katika Yohana, na ‘zenyewe’ huleta mkazo wa αὐτά.
- source_word: πιστεύετε
  choice: aminini
  rationale: Amri ya mwisho haina yambwa lililotajwa wazi katika Kigiriki. ‘Aminini’ hudumisha ufupi na kutoweka wazi kwa yambwa badala ya kuongeza ‘niaminini’ au ‘niaminini mimi.’
theological_decisions:
- issue: Kuwamo kwa Mwana ndani ya Baba na Baba ndani ya Mwana
  choice: 'Kuhifadhi lugha ya moja kwa moja: ‘mimi niko ndani ya Baba, na Baba yuko ndani yangu.’'
  alternative: ‘Mimi ni mmoja na Baba’ au ‘nimeungana na Baba.’
  rationale: Maneno haya yanadumisha dai lenye uzito kuhusu uhusiano na umoja wa Yesu na Baba, lakini hayabadilishi usemi halisi wa Yohana kuwa muhtasari wa kimafundisho.
- issue: Msingi wa kuamini kutokana na kazi
  choice: Kuacha ‘aminini’ bila yambwa lililotajwa, huku kazi zenyewe zikitolewa kuwa msingi wa kuamini.
  alternative: ‘Niaminini kwa sababu ya kazi’ au ‘aminini ndani yangu kwa sababu ya kazi.’
  rationale: Kigiriki hakitaji yambwa la πιστεύετε ya mwisho. Kuiacha ikiwa peke yake huhifadhi utata huo na kuepuka kuingiza yambwa ambalo halipo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Niaminini’ na ‘aminini’ ni maumbo ya wingi yanayolingana na amri za Kigiriki. ‘Ndani ya’ limehifadhiwa kwa makusudi ili kutunza lugha bainifu ya Yohana; tanbihi inaeleza uwezekano wa kuifanya hali ya sharti iwe wazi zaidi.
