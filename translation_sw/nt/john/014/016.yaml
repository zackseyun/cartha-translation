  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: sw
  text: Nami nitamwomba Baba, naye atawapa Mtetezi mwingine[a], ili awe pamoja nanyi milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Msaidizi,” “Mshauri,” au kwa mapokeo “Mfariji,” kwa neno la Kigiriki παράκλητος.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Nami
  rationale: Muungano wa καί na ἐγώ unaendeleza mtiririko wa usemi huku ukitilia mkazo kwa kiasi nafsi ya kwanza; “Nami” ni ya kawaida na ya heshima katika Kiswahili.
- source_word: ἐρωτήσω
  choice: nitamwomba
  rationale: Kitenzi hiki hapa humaanisha kuomba jambo kutoka kwa mtu. “Nitamwomba” ni usemi wa asili unaoonyesha ombi kwa Baba bila kuingiza maana ya kiibada isiyolazimishwa na neno la Kigiriki.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Kigiriki kina kibainishi lakini hakina kiwakilishi cha umilikaji. “Baba” hudumisha matumizi ya Yohana bila kuongeza “Baba yangu.”
- source_word: ἄλλον
  choice: mwingine
  rationale: Neno ἄλλος humaanisha mwingine tofauti na yule aliyepo au aliyetajwa. Tafsiri haiongezi maelezo ya “wa aina ileile,” ambayo hayajasemwa wazi.
- source_word: παράκλητον
  choice: Mtetezi
  rationale: Παράκλητος ni neno lenye maana pana ya mtu anayesimama upande wa mwingine, kumsaidia au kumtetea. “Mtetezi” huhifadhi uzito wa kibinafsi na wa uwakilishi; tafsiri nyingine muhimu zimewekwa katika tanbihi.
- source_word: δώσει ὑμῖν
  choice: atawapa
  rationale: Muundo huu ni wa wakati ujao pamoja na yambwa isiyo ya moja kwa moja. “Atawapa” ni Kiswahili cha kawaida na mwaminifu kwa muundo huo.
- source_word: ἵνα ᾖ
  choice: ili awe
  rationale: Ἵνα pamoja na hali tegemezi huonyesha kusudi au matokeo yaliyokusudiwa. “Ili awe” huhifadhi maana hiyo na haitumii kitenzi chenye maana finyu zaidi kama “akae.”
- source_word: μεθ’ ὑμῶν
  choice: pamoja nanyi
  rationale: Μετά pamoja na hali milikishi humaanisha kuwa pamoja na mtu. “Pamoja nanyi” ni ya asili na sahihi kuliko kupanua maana kuwa “miongoni mwenu.”
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Huu ni msemo unaoonyesha kudumu bila mwisho katika muktadha wa Yohana. “Milele” huwasilisha maana ya msemo huo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Tafsiri ya παράκλητος katika ahadi kuhusu Roho
  choice: Mtetezi
  alternative: Msaidizi, Mshauri, au kwa mapokeo Mfariji
  rationale: Kwa kuwa Yesu anaahidi “παράκλητος mwingine,” neno linapaswa kubaki la kibinafsi na lenye uzito bila kumfanya awe msaada usio na nafsi. “Mtetezi” hudumisha wazo la kusimama upande wa mwingine na kumwakilisha, lakini tanbihi huhifadhi upana halisi wa neno badala ya kuufungia katika kazi moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Nami … naye” unaendeleza uhusiano wa vishazi kwa ufasaha; “ili awe pamoja nanyi” hudumisha kwa makusudi maana ya kuwapo badala ya kuibadili kuwa kukaa pekee.
