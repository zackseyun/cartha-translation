  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: sw
  text: Siku hiyo ninyi mtajua kwamba mimi niko ndani ya Baba yangu,[a] nanyi mko ndani yangu, nami niko ndani yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “ndani ya” yamerudiwa kwa makusudi ili kudumisha lugha ya Yohana ya kuwamo ndani ya mwingine. Yangeweza kufafanuliwa “katika umoja na,” lakini huo ungekuwa ufafanuzi zaidi kuliko tafsiri ya moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Siku hiyo
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha wakati maalumu ujao; inadumisha umahususi wa ἐκείνῃ bila kutumia muundo usio wa kawaida wa “katika siku ile.”
- source_word: γνώσεσθε ὑμεῖς
  choice: ninyi mtajua
  rationale: “Mtajua” huwasilisha wakati ujao wa γνώσεσθε kwa upana wake wa kawaida. Kiwakilishi cha wazi “ninyi” kinadumisha mkazo wa ὑμεῖς.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inaanzisha jambo ambalo wanafunzi watalijua, wala si sababu.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: mimi niko ndani ya Baba yangu
  rationale: “Ndani ya” inadumisha taswira ya ἐν, huku “mimi niko” ikiwa muundo wa Kiswahili unaoeleweka na unaobeba mkazo wa ἐγώ.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: nanyi mko ndani yangu
  rationale: Muundo huu unadumisha ἐν na ulinganifu wa kishazi, bila kuufafanua moja kwa moja kuwa “katika umoja nami.”
- source_word: κἀγὼ ἐν ὑμῖν
  choice: nami niko ndani yenu
  rationale: “Nami” huwasilisha κἀγώ, na “ndani yenu” huhifadhi lugha ya ukaaji wa ndani yenye kuelekeana.
theological_decisions:
- issue: Lugha ya Yohana ya kuwamo ndani ya mwingine (ἐν ... ἐν ... ἐν)
  choice: Kurudia “ndani ya/ndani yangu/ndani yenu” katika vishazi vyote vitatu.
  alternative: “Mimi nimeungana na Baba yangu, nanyi mmeungana nami, nami nimeungana nanyi.”
  rationale: Tafsiri ya moja kwa moja inadumisha taswira, utajiri, na mvutano wa kiteolojia wa maandishi bila kuupunguza kuwa aina moja tu ya umoja.
- issue: Uhusiano wa Yesu na Baba
  choice: “mimi niko ndani ya Baba yangu”
  alternative: “mimi ni mmoja na Baba yangu” au “mimi niko pamoja na Baba yangu”
  rationale: Chaguo hili halipunguzi uzito wa kauli wala kuingiza ufafanuzi wa baadaye ambao mstari wenyewe hautamki moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninyi” limetumiwa kwa mkazo unaopatikana katika kiwakilishi cha wazi cha Kigiriki; “nanyi” na “nami” huendeleza mlingano wa vishazi kwa mtiririko wa kawaida.
