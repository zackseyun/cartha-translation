  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: sw
  text: Lakini huyo Mtetezi[a], Roho Mtakatifu, ambaye Baba atamtuma kwa jina langu, huyo atawafundisha mambo yote na kuwakumbusha yote niliyowaambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Msaidizi,” “Mshauri,” au “Mfariji” kwa neno “Mtetezi” (Kigiriki: paraklētos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Mtetezi
  rationale: Neno hili lina maana zinazohusisha kumwakilisha na kumsaidia mtu, hata katika mazingira ya kisheria. “Mtetezi” linaonyesha jukumu hilo la binafsi na tendaji; kwa kuwa halibebi upana wote wa neno la Kigiriki, maana nyingine zimetajwa katika tanbihi.
- source_word: πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, la sasa na linaloeleweka katika Kiswahili, nalo linawakilisha kwa usahihi jina la Kigiriki.
- source_word: ὃ πέμψει
  choice: ambaye ... atamtuma
  rationale: Kiwakilishi cha nafsi na kiambishi cha yambwa “-m-” vinaonyesha kwamba Roho Mtakatifu anatajwa kama nafsi, kulingana na utendaji wa binafsi unaoonekana katika sentensi.
- source_word: ἐν τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Nahau hii ya Kiswahili inadumisha uwezekano wa maana za uwakilishi, utume na mamlaka bila kuifungia katika maana moja tu.
- source_word: ἐκεῖνος
  choice: huyo
  rationale: Kiwakilishi hiki kinadumisha mkazo wa neno la Kigiriki na kumrejelea tena Mtetezi kwa namna ya binafsi.
- source_word: διδάξει
  choice: atawafundisha
  rationale: “Kufundisha” ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi hiki katika muktadha huu.
- source_word: πάντα
  choice: mambo yote
  rationale: Tafsiri hii inadumisha upana wa ahadi ya Kigiriki kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὑπομνήσει
  choice: kuwakumbusha
  rationale: Kitenzi hiki kinaeleza kwa ufupi na kwa kawaida tendo la kuwafanya wakumbuke.
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: yote niliyowaambia
  rationale: Muundo huu wa asili wa Kiswahili unadumisha wazo la mambo yote ambayo Yesu alikuwa amewaambia wanafunzi.
theological_decisions:
- issue: Kumtaja Roho Mtakatifu kwa lugha ya nafsi
  choice: Kutumia “ambaye,” kiambishi cha nafsi “-m-,” na “huyo”
  alternative: Kutumia marejeo yasiyo ya nafsi kwa kufuata tu jinsi nomino πνεῦμα ilivyo katika sarufi ya Kigiriki
  rationale: Ingawa πνεῦμα ni nomino ya jinsia ya kati kisarufi, mstari unaiunganisha na παράκλητος na kiwakilishi cha mkazo ἐκεῖνος, huku ukimpa matendo ya kufundisha na kukumbusha. Lugha ya nafsi inadumisha ushahidi huo bila kumwasilisha kama nguvu isiyo na nafsi.
- issue: Tafsiri ya παράκλητος
  choice: Mtetezi
  alternative: Msaidizi, Mshauri, au Mfariji
  rationale: “Mtetezi” linaonyesha vizuri jukumu la uwakilishi na utendaji wa binafsi, lakini neno la Kigiriki lina maana pana zaidi; kwa hiyo tafsiri nyingine zinazowezekana zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Uradidi wa “huyo” umetumiwa kwa makusudi ili kuhifadhi mkazo wa ἐκεῖνος; “yaani” linaweka wazi kwamba “Roho Mtakatifu” ni ufafanuzi wa “Mtetezi.”
