base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: sw
  text: Yuda, si Iskariote, akamwambia, “Bwana, imekuwaje[a] kwamba unakusudia kujidhihirisha[b] kwetu, wala si kwa ulimwengu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nini kimetokea.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kujifunua” au “kujionyesha wazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umetafsiriwa kwa wakati uliopita wa masimulizi, ambao ni wa kawaida katika Kiswahili; kiambishi cha mtendewa kinaonyesha ‘akamwambia.’
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Yuda (siye Iskariote)
  rationale: Ufafanuzi wa mabano unamtenganisha Yuda huyu na Yuda Iskariote bila kuongeza utambulisho ambao maandishi hayajautoa.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ ni namna ya kawaida, yenye heshima na uzito wa kitheolojia, ya kumwita Yesu kwa κύριος.
- source_word: τί γέγονεν
  choice: imekuwaje
  rationale: Kauli hii ya kawaida ya Kiswahili huuliza ni hali gani iliyotokea au sababu gani iliyopo, huku ikihifadhi matokeo ya tendo lililotangulia yanayoashiriwa na hali timilifu ya Kigiriki.
- source_word: ὅτι
  choice: kwamba
  rationale: 'Hapa ὅτι inaanzisha maudhui yanayoeleza swali: imekuwaje kwamba Yesu anakusudia kufanya hivi.'
- source_word: ἡμῖν
  choice: kwetu
  rationale: Huhifadhi wazi wapokeaji wa kujidhihirisha bila kuongeza neno ‘wanafunzi,’ ambalo halipo katika maandishi.
- source_word: μέλλεις
  choice: unakusudia
  rationale: Neno hili linaonyesha nia au tendo linalotarajiwa; ‘unakusudia’ huhifadhi wazo hilo bila kusisitiza kupita kiasi kwamba jambo hilo litatokea mara moja.
- source_word: ἐμφανίζειν σεαυτόν
  choice: kujidhihirisha
  rationale: Kitenzi cha kujirejelea kinaonyesha kujifanya aonekane au ajulikane. ‘Kujidhihirisha’ ni wazi katika muktadha huu na huhifadhi wazo la ufunuo binafsi.
- source_word: κόσμῳ
  choice: ulimwengu
  rationale: ‘Ulimwengu’ huhifadhi msamiati mpana wa Yohana bila kuufasiri moja kwa moja kuwa wanadamu wote au mfumo wa watu wasiomwamini Mungu.
theological_decisions:
- issue: Matumizi ya κόσμος katika Yohana
  choice: ulimwengu
  alternative: wanadamu kwa ujumla; ulimwengu usioamini
  rationale: Aya yenyewe haifafanui kikamilifu kama neno hilo linawalenga wanadamu kwa ujumla au utaratibu wa kibinadamu uliotengana na Mungu. ‘Ulimwengu’ huhifadhi upana na mvutano huo wa kitheolojia.
- issue: Namna ya Yesu kujifunua katika ἐμφανίζειν σεαυτόν
  choice: kujidhihirisha
  alternative: kujifanya ajulikane; kujionyesha wazi
  rationale: Tafsiri haibainishi ikiwa kujidhihirisha huku ni kwa kuonekana kwa macho pekee au kwa kujulikana kiroho; inahifadhi uwezekano mpana wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘wala si’ unadumisha utofautishaji mkali wa Kigiriki οὐχί bila kuwa mzito; ‘kujidhihirisha’ ni istilahi inayoeleweka katika muktadha wa kidini, na tanbihi inatoa mbadala wa lugha ya kawaida.
