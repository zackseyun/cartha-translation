  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: sw
  text: Roho wa ukweli[a], ambaye ulimwengu hauwezi kumpokea, kwa sababu haumwoni wala haumjui. Ninyi mnamjua, kwa sababu anakaa pamoja nanyi, naye atakuwa ndani yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo ulimwengu hauwezi kuipokea, kwa sababu hauioni wala hauijui.” Kigiriki hutumia sarufi ya jinsia ya kati kwa neno “Roho” (πνεῦμα), ingawa muktadha unamrejelea kama nafsi.
    reason: lexical_alternative
  - marker: b
    text: Au, “atakuwa miongoni mwenu.” ‘Ninyi/yenu’ ni wingi katika Kigiriki, hivyo maana ya kijumuiya inawezekana, ingawa “ndani yenu” huhifadhi vizuri zaidi tofauti na “pamoja nanyi.”
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Roho
  rationale: Herufi kubwa inaonyesha kwamba katika muktadha huu wa Yohana neno hili linamrejelea Roho Mtakatifu, si roho isiyo na nafsi wala mwelekeo wa ndani.
- source_word: τῆς ἀληθείας
  choice: wa ukweli
  rationale: Huhifadhi muundo wa Kigiriki wa umilikaji na maana ya usemi wa Yohana ‘Roho wa ukweli,’ bila kuugeuza kuwa ‘Roho wa kweli’ au ‘Roho ambaye ni ukweli.’
- source_word: ὃ
  choice: ambaye
  rationale: Ingawa πνεῦμα lina jinsia ya kati kisarufi katika Kigiriki, ‘ambaye’ ni ya kawaida katika Kiswahili inapozungumziwa nafsi na inaafikiana na muktadha.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Ni tafsiri ya kawaida ya neno hili katika Yohana na haifupishi maana yake kuwa wanadamu wote pekee au mfumo wa uasi pekee.
- source_word: οὐ δύναται λαβεῖν
  choice: hauwezi kumpokea
  rationale: Huhifadhi kutoweza kunakoonyeshwa na δύναται na maana ya msingi ya λαβεῖν, ‘kupokea.’
- source_word: θεωρεῖ
  choice: hau(m)woni
  rationale: ‘Kuona’ ni Kiswahili cha sasa na huhifadhi mwingiliano wa kuona na kutambua bila kulifafanua kupita kiasi.
- source_word: γινώσκει / γινώσκετε
  choice: hau(m)jui / mnamjua
  rationale: Kutumia mzizi mmoja wa ‘kujua’ huhifadhi ulinganifu kati ya ulimwengu kutomjua na wanafunzi kumjua.
- source_word: ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi kilichotajwa wazi huhifadhi msisitizo na tofauti iliyopo katika Kigiriki.
- source_word: παρ’ ὑμῖν μένει
  choice: anakaa pamoja nanyi
  rationale: ‘Anakaa’ ni usemi wa kawaida unaohifadhi wazo la μένω la kukaa au kudumu; ‘pamoja nanyi’ hutofautishwa wazi na ‘ndani yenu.’
- source_word: ἐν ὑμῖν ἔσται
  choice: atakuwa ndani yenu
  rationale: ‘Ndani’ ndiyo maana ya moja kwa moja ya ἐν na huhifadhi tofauti na παρά, ingawa kwa kiwakilishi cha wingi usemi huo unaweza pia kueleweka kwa maana ya kijumuiya.
theological_decisions:
- issue: Kumrejelea Roho kama nafsi licha ya maumbo ya Kigiriki ya jinsia ya kati
  choice: 'Kutumia marejeo ya nafsi: ‘ambaye,’ ‘-m-,’ na ‘ana-/ata-’'
  alternative: Kutumia marejeo yasiyo ya nafsi, kama ‘ambayo’
  rationale: Sarufi ya Kiswahili inaruhusu kumrejelea Roho kwa lugha ya nafsi, jambo linaloafikiana na namna muktadha unavyomwasilisha kama mtendaji binafsi, bila kutegemea jinsia ya kisarufi ya neno la Kigiriki.
- issue: Uhusiano wa Roho na waamini katika παρ’ ὑμῖν na ἐν ὑμῖν
  choice: Kuhifadhi tofauti kama ‘pamoja nanyi’ na ‘ndani yenu’
  alternative: Kufanya yote kuwa uwepo wa jumla, kama ‘pamoja nanyi’ au ‘miongoni mwenu’
  rationale: Tafsiri inahifadhi viashiria viwili tofauti vya mahali katika Kigiriki na mvutano wake, badala ya kuvifanya viwe wazo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa wasomaji wa kawaida huku ikihifadhi urudiaji wa ‘kujua,’ msisitizo wa ‘Ninyi,’ na tofauti kati ya uwepo pamoja na wanafunzi na uwepo ndani yao.
