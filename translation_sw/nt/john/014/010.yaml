id: JHN.14.10
reference: John 14:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: sw
  text: Je, huamini kwamba mimi niko ndani ya Baba, na Baba yuko ndani yangu? Maneno ninayowaambia siyasemi kutoka kwangu mwenyewe[a], bali Baba anayekaa ndani yangu[b] ndiye anayefanya kazi zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uamuzi wangu mwenyewe” au “kwa mamlaka yangu mwenyewe.”
    reason: ἀπ’ ἐμαυτοῦ inaweza kueleza chanzo cha maneno, uamuzi wa mtu binafsi, au mamlaka yake mwenyewe.
  - marker: b
    text: Au, “anayedumu ndani yangu.”
    reason: μένων ina wazo la kuendelea kukaa au kudumu; ‘anayedumu’ ni mbadala unaosisitiza mwendelezo huo.
lexical_decisions:
- source_word: πιστεύεις
  choice: huamini
  rationale: ‘Kuamini’ ni neno la kawaida katika Kiswahili na linadumisha kiungo cha kimatini na matumizi ya mara kwa mara ya πιστεύω katika Injili ya Yohana.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: ndani ya Baba ... ndani yangu
  rationale: ‘Ndani ya’ huhifadhi lugha ya Kigiriki ya kuwamo kwa kila mmoja ndani ya mwingine bila kuifafanua kuwa ‘umoja na,’ jambo ambalo lingeongeza tafsiri ya kiteolojia.
- source_word: ῥήματα
  choice: maneno
  rationale: ‘Maneno’ ni tafsiri ya moja kwa moja, ya kawaida, na inayoeleweka kuliko ‘semi’ katika muktadha huu.
- source_word: λέγω ὑμῖν
  choice: ninayowaambia
  rationale: Muundo huu ni wa asili katika Kiswahili kwa kitendo cha kusema maneno kwa watu fulani, huku ukihifadhi maana ya mawasiliano iliyo katika kifungu.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: kutoka kwangu mwenyewe
  rationale: Tafsiri hii inahifadhi picha na upana wa usemi wa chanzo, ambao unaweza kumaanisha chanzo, uamuzi binafsi, au mamlaka ya mtu mwenyewe.
- source_word: λαλῶ
  choice: siyasemi
  rationale: Kiswahili hakihitaji kulazimisha tofauti ya λέγω na λαλέω hapa; ‘kusema’ hutoa sentensi ya asili na sahihi.
- source_word: μένων
  choice: anayekaa
  rationale: ‘Anayekaa ndani yangu’ ni lugha ya sasa na wazi kwa wazo la kuendelea kuwamo; tanbihi inatoa ‘anayedumu’ kama mbadala wenye kusisitiza mwendelezo.
- source_word: ποιεῖ
  choice: anayefanya
  rationale: ‘Kufanya’ huandamana kwa kawaida na ‘kazi’ na kutafsiri kitenzi hicho moja kwa moja.
- source_word: τὰ ἔργα αὐτοῦ
  choice: kazi zake
  rationale: ‘Kazi’ huhifadhi msamiati muhimu wa Yohana, na ‘zake’ inawakilisha wazi kiwakilishi αὐτοῦ katika matini ya SBLGNT.
theological_decisions:
- issue: Kuwamo kwa Baba na Mwana ndani ya kila mmoja
  choice: Kuhifadhi usemi ‘mimi niko ndani ya Baba, na Baba yuko ndani yangu.’
  alternative: Mimi ni mmoja na Baba, na Baba ni mmoja nami.
  rationale: Tafsiri ya moja kwa moja huhifadhi uhusiano unaoelezwa na mstari huu bila kuufananisha na misemo mingine ya Yohana au kuingiza istilahi za baadaye za kimafundisho.
- issue: Chanzo na utendaji katika maneno na kazi za Yesu
  choice: ‘Siyasemi kutoka kwangu mwenyewe’ na ‘Baba ... ndiye anayefanya kazi zake.’
  alternative: Siyasemi kwa mamlaka yangu mwenyewe; Baba aliye ndani yangu anazifanya kazi hizi.
  rationale: Muundo huu huhifadhi kwa pamoja umoja wa Baba na Mwana na utofautishaji wao katika utume, bila kuamua kimyakimya kama ἀπ’ ἐμαυτοῦ inalenga hasa chanzo, uamuzi binafsi, au mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. ‘Ndani ya’ imetumiwa kwa ulinganifu ili kuhifadhi taswira ya kuwamo kwa kila mmoja ndani ya mwingine, na ‘ndiye’ inaweka mkazo wa asili kwa Baba kama mtendaji wa kazi zake.
