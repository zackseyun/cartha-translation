  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: sw
  text: Na sasa nimewaambia kabla ya hilo kutokea, ili litakapotokea mpate kuamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi “kuamini” pia kinaweza kuwa na maana ya kutumaini katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Nami sasa
  rationale: Hudumisha kiunganishi καί na kielezi cha wakati νῦν kwa Kiswahili cha kawaida, huku ikiunganisha kauli hii na muktadha uliotangulia.
- source_word: εἴρηκα ὑμῖν
  choice: nimewaambia
  rationale: Kauli timilifu εἴρηκα inaonyesha jambo lililosemwa tayari lenye umuhimu wa sasa; kiambishi -wa- kinawakilisha ὑμῖν kwa ufasaha wa Kiswahili.
- source_word: πρὶν γενέσθαι
  choice: kabla halijatokea
  rationale: πρίν pamoja na kitenzi-jina cha wakati uliopita huonyesha kwamba taarifa imetolewa kabla ya tukio linalodokezwa na muktadha. 'Halijatokea' ni ya kawaida na huweka tukio hilo wazi bila kulifafanua zaidi.
- source_word: ἵνα
  choice: ili
  rationale: '''Ili'' huwasilisha kwa ufupi na kwa kawaida kusudi linaloletwa na ἵνα.'
- source_word: ὅταν γένηται
  choice: litakapotokea
  rationale: Muundo huu unaonyesha tukio la wakati ujao linalotarajiwa; kurudia mzizi 'tokea' kunahifadhi marudio ya γίνομαι katika sentensi.
- source_word: πιστεύσητε
  choice: mpate kuamini
  rationale: Muundo wa ἵνα pamoja na hali tegemezi unaeleza kusudi. 'Kuamini' ni tafsiri ya kawaida ya πιστεύω katika Yohana bila kuamua kama ni kuanza kuamini au kuimarishwa katika imani.
theological_decisions:
- issue: Nguvu ya πιστεύσητε katika muktadha
  choice: mpate kuamini
  alternative: mpate kutumaini; mzidi kuamini
  rationale: Kigiriki hakibainishi wazi kama Yesu anazungumzia kuanza kuamini au kuimarika katika imani. Tafsiri pana 'kuamini' inahifadhi mvutano huo bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Ngeli ya LI-YA inarejelea tukio linalodokezwa na muktadha.
