  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: sw
  text: Kama mngalinijua, mngalimjua Baba yangu pia. Kuanzia sasa mnamjua na mmemwona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / ᾔδειτε / γινώσκετε
  choice: mngalinijua / mngalimjua / mnamjua
  rationale: Vitenzi vya ‘kujua’ vinadumisha uhusiano wa kimsamiati katika sentensi, huku maumbo ya ‘-ngali-’ yakionyesha hali isiyotimia ya wakati uliopita na wakati uliopo ‘mnamjua’ ukionyesha dai la sasa.
- source_word: ἀπ’ ἄρτι
  choice: Kuanzia sasa
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili unaoonyesha mwanzo wa hali mpya tangu wakati huu.
- source_word: ἑωράκατε
  choice: mmemwona
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo la kuona lililotokea na lenye matokeo yanayoendelea sasa.
- source_word: τὸν πατέρα μου
  choice: Baba yangu
  rationale: Huhifadhi lugha ya uhusiano ya Yesu; herufi kubwa inafaa kwa rejeo hili la pekee kwa Mungu.
theological_decisions:
- issue: Maana ya wanafunzi kumjua na kumwona Baba
  choice: mnamjua na mmemwona
  alternative: mnamjua na ni kana kwamba mmemwona
  rationale: Tafsiri ya moja kwa moja inadumisha nguvu na mvutano wa dai la Yesu bila kulifafanua kuwa ni kuona kwa mfano au kwa njia fulani.
- issue: Tofauti kati ya sharti lisilotimia na dai la sasa
  choice: Kama mngalinijua, mngalimjua ... Kuanzia sasa mnamjua
  alternative: Kama mnanijua, mtamjua ...
  rationale: Maumbo haya yanahifadhi sharti la wakati uliopita pamoja na mabadiliko makali kuelekea uhakikisho wa wakati uliopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku ukihifadhi urudiaji wa ‘kujua’ na dai lenye uzito la ‘kumwona’ Baba.
