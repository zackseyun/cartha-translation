id: JHN.14.9
reference: John 14:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: sw
  text: Yesu akamwambia, “Nimekuwa pamoja nanyi kwa muda mrefu hivi, nawe bado hujanijua, Filipo? Aliyeniona mimi amemwona Baba. Unawezaje kusema, ‘Tuonyeshe Baba’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: kwa muda mrefu hivi
  rationale: Kirai hiki katika hali ya utoaji huonyesha muda ulioendelea hadi wakati wa kusema. ‘Kwa muda mrefu hivi’ ni Kiswahili cha kawaida na kinahifadhi msisitizo wa swali la Yesu.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Nimekuwa pamoja nanyi
  rationale: Ingawa kitenzi cha Kigiriki kiko katika wakati wa sasa, muktadha unaonyesha uwepo ulioendelea hadi sasa. Kauli hii ya Kiswahili huwasilisha vizuri maana hiyo; ‘nanyi’ pia huhifadhi wingi wa ὑμῶν.
- source_word: οὐκ ἔγνωκάς με
  choice: nawe bado hujanijua
  rationale: Wakati timilifu wa Kigiriki unaonyesha kwamba Filipo hajafikia hali ya kumjua Yesu licha ya muda waliokuwa pamoja. ‘Bado’ huonyesha nguvu ya karipio katika muktadha, bila kubadili maana ya msingi.
- source_word: Φίλιππε
  choice: Filipo
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Kiswahili, na linawakilisha hali ya mwito ya Kigiriki.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Aliyeniona mimi
  rationale: Kirai hiki cha kiambishi cha wakati timilifu kinamaanisha mtu yeyote ambaye amemwona Yesu. ‘Mimi’ hudumisha msisitizo wa ἐμέ.
- source_word: ἑώρακεν τὸν πατέρα
  choice: amemwona Baba
  rationale: Wakati timilifu umehifadhiwa kwa ‘amemwona,’ na ‘Baba’ hudumisha moja kwa moja jina la kimahusiano la Yohane bila kuongeza ‘yangu.’
- source_word: πῶς σὺ λέγεις
  choice: Unawezaje kusema
  rationale: πῶς hapa ni swali la mshangao na pingamizi, si ombi la kueleza namna tu. ‘Unawezaje kusema’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Tuonyeshe Baba
  rationale: Amri ya Kigiriki imetafsiriwa moja kwa moja kwa ‘tuonyeshe,’ ikihifadhi ombi la Filipo lililonukuliwa na Yesu.
theological_decisions:
- issue: Uhusiano kati ya kumwona Yesu na kumwona Baba
  choice: Aliyeniona mimi amemwona Baba
  alternative: Aliyeniona ameona jinsi Baba alivyo; au ufafanuzi wa moja kwa moja kwa kutumia istilahi za baadaye za kanuni za imani
  rationale: Kauli kali ya Kristo imehifadhiwa kama ilivyo katika Kigiriki. Haijadhoofishwa kuwa ufanano wa uwakilishi tu, wala haijapanuliwa kwa istilahi za kiteolojia ambazo hazimo katika mstari huu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Tofauti ya umoja na wingi imehifadhiwa: ‘nanyi’ ni wingi, huku ‘nawe,’ ‘hujanijua,’ na ‘unasema’ zikimlenga Filipo mmoja. Hakuna tanbihi iliyohitajika kwa kuwa ‘kwa muda mrefu hivi’ huwasilisha vizuri maana ya kirai cha Kigiriki bila kuondoa utata muhimu.'
