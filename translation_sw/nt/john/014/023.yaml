  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: sw
  text: Yesu akamjibu, akamwambia, “Mtu yeyote akinipenda, atalishika neno langu[a]. Baba yangu atampenda, nasi tutakuja kwake na kufanya makao yetu kwake[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafundisho yangu” au “yale ninayosema.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuweka makao yetu pamoja naye” au “kufanya kwake kuwa nyumbani kwetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Yesu akamjibu, akisema
  rationale: Huhifadhi wazo la vitenzi viwili, ‘akajibu’ na ‘akasema,’ kwa muundo wa Kiswahili ulio wa kawaida bila kurudia kwa uzito.
- source_word: Ἐάν τις
  choice: Mtu yeyote aki-
  rationale: Huonyesha sharti la jumla lililo wazi kwa mtu yeyote, huku muundo wa ‘aki-’ ukitoa Kiswahili cha asili.
- source_word: ἀγαπᾷ με
  choice: akinipenda
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya upendo unaoelekezwa kwa Yesu.
- source_word: τὸν λόγον μου
  choice: neno langu
  rationale: Huhifadhi istilahi ya Yohana na upana wa λόγος kama ujumbe, mafundisho, au yale Yesu anayosema.
- source_word: τηρήσει
  choice: atalishika
  rationale: ‘Kulishika’ huhifadhi maana pana ya τηρέω—kutunza na kutii—bila kuifanya iwe utii wa sheria pekee.
- source_word: ὁ πατήρ μου
  choice: Baba yangu
  rationale: Ni jina la kawaida katika Yohana linalomtaja Mungu kama Baba wa Yesu.
- source_word: ἀγαπήσει αὐτόν
  choice: atampenda
  rationale: Huhifadhi kitenzi kilekile cha ‘kupenda’ na rejeo la umoja bila kulazimisha jinsia katika Kiswahili.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: tutakuja kwake
  rationale: Huonyesha mwendo wa Yesu na Baba kuelekea kwa mtu huyo kwa usemi wa kawaida wa Kiswahili.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: kufanya makao yetu kwake
  rationale: ‘Makao’ huonyesha mahali pa kudumu au kukaa; ‘yetu’ huweka wazi kuwa Yesu na Baba ndio wanaokaa, kama inavyodokezwa na kitenzi cha wingi.
theological_decisions:
- issue: Nafsi ya wingi katika ‘tutakuja ... na kufanya makao yetu’
  choice: Kuhifadhi ‘nasi tutakuja’ na ‘makao yetu,’ Yesu na Baba wakitenda pamoja.
  alternative: Kufanya usemi uwe wa nafsi moja au usioeleza wahusika waziwazi.
  rationale: Vitenzi vya Kigiriki vya nafsi ya kwanza wingi vinawaonyesha Yesu na Baba wakija na kukaa pamoja; tafsiri hailainishi wala kuongeza maelezo ya kimadhehebu.
- issue: Rejeo la jumla la τις na αὐτόν
  choice: Kutumia ‘mtu yeyote’ na viambishi vya umoja visivyoonyesha jinsia.
  alternative: Kutaja ‘yeye’ au ‘mwanamume’ kwa namna inayoweza kusikika kuwa ya jinsia maalumu.
  rationale: Kiswahili kinaweza kuhifadhi umoja na upeo wa jumla bila kuingiza jinsia ambayo si kiini cha sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Yesu akamjibu, akisema’ unafuata simulizi la kibiblia bila kuwa mzito; ‘makao’ huhifadhi taswira ya kukaa kwa kudumu.
