id: JHN.14.31
reference: John 14:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: sw
  text: Lakini, ili ulimwengu ujue kwamba ninampenda Baba[a], kama vile Baba alivyoniamuru, ndivyo ninavyofanya. Inukeni, twondoke hapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kama vile Baba alivyoniamuru, ndivyo ninavyofanya.”'
    reason: Njia nyingine ya kuonyesha ulinganifu wa “kama vile ... ndivyo ...” katika sentensi ya Kigiriki.
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Inaendeleza nguvu ya upinzani inayounganisha kauli hii na mstari uliotangulia.
- source_word: ἵνα γνῷ
  choice: ili ... ujue
  rationale: Muundo wa ἵνα pamoja na kitenzi cha hali tegemezi unaonyesha kusudi; “ili ... ujue” ni wa kawaida na sahihi katika Kiswahili.
- source_word: ὁ κόσμος
  choice: ulimwengu
  rationale: Inahifadhi usemi muhimu wa Yohana, ambapo ulimwengu mara nyingi unamaanisha wanadamu kwa ujumla, hasa walio mbali na Mungu.
- source_word: ἀγαπῶ
  choice: ninampenda
  rationale: Wakati uliopo wa Kigiriki unatafsiriwa kwa hali ya sasa ya Kiswahili, huku kiambishi cha yambwa kikionyesha Baba kuwa anayependwa.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Kigiriki hakina kiwakilishi cha umilikaji; “Baba” huhifadhi cheo hicho bila kuongeza “Baba yangu.”
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ ... οὕτως ποιῶ
  choice: kama vile Baba alivyoniamuru, ndivyo ninavyofanya
  rationale: Muundo wa “kama vile ... ndivyo” unahifadhi ulinganifu wa καθώς ... οὕτως, na “aliamuru” inadumisha nguvu ya agizo katika ἐντέλλομαι.
- source_word: Ἐγείρεσθε
  choice: Inukeni
  rationale: Ni amri kwa wingi inayowataka wanafunzi kuinuka; “Inukeni” ni ya kawaida, wazi, na yenye heshima.
- source_word: ἄγωμεν
  choice: twondoke
  rationale: Hali tegemezi ya nafsi ya kwanza wingi yenye maana ya kuhimiza inaelezwa kwa kawaida kwa “twondoke.”
- source_word: ἐντεῦθεν
  choice: hapa
  rationale: Pamoja na kitenzi “twondoke,” neno “hapa” huwasilisha kwa kawaida maana ya kuondoka mahali walipo.
theological_decisions:
- issue: Cheo cha uhusiano πατήρ katika kristolojia ya Yohana
  choice: Baba
  alternative: Baba yangu
  rationale: Tafsiri haiongezi umilikaji ambao haujaelezwa katika Kigiriki, huku ikihifadhi uhusiano wa Yesu na Baba.
- issue: Nguvu ya ἐντέλλομαι kuhusu uhusiano wa Baba na Mwana
  choice: aliamuru
  alternative: alielekeza
  rationale: Kitenzi kina maana ya kutoa amri au agizo. Hakilainishwi kwa sababu za kiteolojia, hivyo utiifu wa Yesu unaelezwa kwa nguvu iliyopo katika chanzo.
- issue: Uhusiano wa kisarufi kati ya kusudi na tendo la Yesu
  choice: Kudumisha muundo “ili ... kama vile ... ndivyo” katika maandishi, pamoja na tanbihi
  alternative: Kusema wazi “na kwamba ninafanya...”
  rationale: Kigiriki kina muundo wenye kubana maneno na uhusiano ambao unaweza kuwasilishwa kwa zaidi ya namna moja. Tanbihi huhifadhi uwezekano huo bila kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Inukeni, twondoke hapa” ni cha kawaida kwa wasomaji wa leo; muundo “kama vile ... ndivyo” huhifadhi ulinganifu wa Kigiriki bila kuwa mgumu kupita kiasi.
