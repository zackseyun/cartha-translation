lexical_decisions:
- source_word: ἐάν
  choice: Mki-
  rationale: Kiambishi cha masharti -ki- kwa nafsi ya pili wingi kinawasilisha kwa kawaida sharti linaloletwa na ἐάν.
- source_word: τι
  choice: jambo lolote
  rationale: Hutoa maana ya wigo usiofungwa ya kiwakilishi kisichodhihirika katika Kiswahili cha kawaida.
- source_word: αἰτήσητέ
  choice: mkiomba
  rationale: Kitenzi 'kuomba' kinafaa kwa ombi linaloelekezwa kwa mtu na pia huhifadhi muktadha wa sala bila kuongeza ufafanuzi.
- source_word: με
  choice: kwangu
  rationale: Kiwakilishi hiki ni yambwa ya αἰτήσητέ katika matini iliyotolewa. Kwa Kiswahili, 'kuomba ... kwangu' ni ya kawaida zaidi kuliko 'kuniomba' hapa, ambayo ingeweza kueleweka kama kuomba nipatikane au nitolewe.
- source_word: ἐν τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Ni usemi wa kawaida na wenye heshima unaohifadhi uhusiano na jina, mamlaka, na nafsi ya Yesu bila kuufafanua kupita kiasi.
- source_word: ἐγὼ
  choice: ni-
  rationale: Kiswahili huonyesha nafsi ya kwanza katika kiambishi cha kitenzi. Hakuna haja ya kuongeza 'mimi', ambayo ingeweka mkazo mkubwa kuliko unaohitajika.
- source_word: ποιήσω
  choice: nitalifanya
  rationale: Wakati ujao umehifadhiwa, na kiambishi -li- kinarejelea kwa kawaida 'jambo lolote' lililotajwa.
theological_decisions:
- issue: Kuwapo kwa με ('mimi/kwangu') na maana yake kwamba ombi linaelekezwa moja kwa moja kwa Yesu
  choice: Kutafsiri με katika matini kuu kwa 'kwangu'
  alternative: Mkiomba jambo lolote kwa jina langu, nitalifanya.
  rationale: SBLGNT iliyotolewa ina με, kwa hiyo matini kuu inaihifadhi. Kwa kuwa baadhi ya hati huiwacha na tofauti hiyo inaweza kuathiri namna anayeombwa anavyoeleweka, usomaji mbadala umeonyeshwa katika tanbihi bila kutatua mvutano wa kiteolojia kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya heshima, na inayoeleweka kwa urahisi. Muundo 'mkiomba ... kwangu' huhifadhi yambwa ya Kigiriki huku ukiepuka utata wa 'mkiniomba'.
