  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: sw
  text: Tomaso akamwambia, “Bwana, hatujui unakokwenda. Tunawezaje kuijua njia?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Tomaso akamwambia
  rationale: Kauli ya sasa ya kihistoria λέγει imetafsiriwa kwa wakati uliopita wa kisimulizi ili Kiswahili kiwe cha kawaida; αὐτῷ imewakilishwa na kiambishi -mw-.
- source_word: Κύριε
  choice: Bwana
  rationale: Neno la mwito κύριε linaweza kuonyesha heshima na utambuzi wa uanafunzi; “Bwana” huhifadhi upana huo bila kulifanya kuwa heshima ya kawaida tu.
- source_word: οὐκ οἴδαμεν
  choice: hatujui
  rationale: οἶδα hapa hueleza kutokuwa na ujuzi, si kutofahamu tu.
- source_word: ποῦ ὑπάγεις
  choice: unakokwenda
  rationale: ὑπάγω inaweza kumaanisha kwenda au kuondoka. “Unakokwenda” ni ya kawaida na huacha wazi uzito wa kiteolojia wa mahali Yesu anakokwenda.
- source_word: πῶς δυνάμεθα
  choice: Tunawezaje
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha swali kuhusu uwezekano au uwezo, bila kuongeza kiunganishi kisichomo katika Kigiriki.
- source_word: τὴν ὁδὸν
  choice: njia
  rationale: ὁδός inaweza kuwa barabara, njia, au namna ya kufika; “njia” huhifadhi maana pana na uhusiano wa kimada na mstari unaofuata.
- source_word: εἰδέναι
  choice: kuijua
  rationale: Kitenzi hiki ni umbo la neno lilelile la msingi lililotumiwa katika οἴδαμεν; kurudia mzizi “-jua” huhifadhi mantiki na mwangwi wa Kigiriki.
theological_decisions:
- issue: Dokezo la kiteolojia la ὑπάγεις katika Injili ya Yohana
  choice: unakokwenda
  alternative: unakoondoka kwenda
  rationale: Mahali Yesu anakokwenda ni muhimu kiteolojia katika Yohana, lakini Tomaso hapa anakiri kuwa hajui. Tafsiri isiyoeleza zaidi huhifadhi mvutano wa simulizi bila kutanguliza ufafanuzi wa kurudi kwa Baba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tunawezaje kuijua njia?” ni cha kawaida na huhifadhi dhana ya uwezo katika δυνάμεθα pamoja na kurudiwa kwa kitenzi cha kujua.
