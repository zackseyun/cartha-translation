id: JHN.14.1
reference: John 14:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: sw
  text: Mioyo yenu isifadhaike. Mwaminini Mungu; niaminini mimi pia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnamwamini Mungu; niaminini mimi pia.” Umbo la Kigiriki πιστεύετε linaweza kuwa kauli elekezi (“mnaamini”) au kauli ya kuamuru (“aminini”).
    reason: alternative_reading
  - marker: b
    text: Au, “Mtumainini Mungu; nitumainini mimi pia.” Kitenzi hiki kinaweza kumaanisha kutumaini au kumtegemea mtu, pamoja na kuamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: isifadhaike
  rationale: Kauli ya kukataza katika nafsi ya tatu imewasilishwa kwa Kiswahili cha kawaida, ikihifadhi maana ya kutotiwa msukosuko au dhiki ya ndani bila kuibana iwe hofu pekee.
- source_word: ὑμῶν ἡ καρδία
  choice: Mioyo yenu
  rationale: Ingawa Kigiriki kina nomino ya umoja yenye kiwakilishi cha wingi, Kiswahili cha kawaida hutumia wingi 'mioyo yenu' linapozungumzia hali ya ndani ya watu wengi mmoja mmoja.
- source_word: πιστεύετε
  choice: Mwaminini / niaminini
  rationale: Kitenzi 'kuamini' kinaweza kueleza kuamini na kumtumainia mtu; kiambishi cha mtendwa kinafaa kwa muundo wa Kiswahili. Hali ya kuamuru imechaguliwa katika matini kuu, huku utata wa kisarufi ukihifadhiwa katika tanbihi.
- source_word: εἰς τὸν θεόν
  choice: Mungu
  rationale: Pamoja na 'kuamini,' Kiswahili hutumia mtendwa moja kwa moja katika 'mwaminini Mungu'; kutafsiri kihalisi kwa kihusishi kungekuwa kusiko kwa kawaida.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: niaminini mimi pia
  rationale: '''Pia'' inahifadhi nguvu ya nyongeza ya καί, na kurudiwa kwa kitenzi kunadumisha usambamba kati ya kumwamini Mungu na kumwamini Yesu.'
theological_decisions:
- issue: Kauli elekezi au kauli ya kuamuru katika matukio mawili ya πιστεύετε
  choice: 'Zote zimetafsiriwa kama amri: “Mwaminini Mungu; niaminini mimi pia.”'
  alternative: “Mnamwamini Mungu; niaminini mimi pia.”
  rationale: Umbo la Kigiriki linaweza kuwa elekezi au la kuamuru. Muktadha wa faraja na katazo la mwanzo unaunga mkono mfululizo wa maagizo, lakini utata halisi umeonyeshwa katika tanbihi badala ya kutatuliwa kimya kimya.
- issue: Maana ya πιστεύω pamoja na εἰς
  choice: kuamini
  alternative: kutumaini
  rationale: '''Kuamini'' ni tafsiri ya moja kwa moja na ya kawaida, lakini katika muundo huu inaweza kuwa na maana ya kumtegemea au kumtumainia mtu; uwezekano huo umehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. 'Mioyo yenu' ni ya asili zaidi katika Kiswahili kuliko umoja wa pamoja wa Kigiriki; 'isifadhaike' huhifadhi taswira ya moyo kama kitovu cha hali ya ndani.
