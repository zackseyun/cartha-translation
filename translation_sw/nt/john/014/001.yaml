  source_fidelity: Matini ya Kiswahili inawakilisha kwa uaminifu katazo la Μὴ ταρασσέσθω pamoja na wito unaorudiwa wa πιστεύετε. “Mioyo yenu isifadhaike” ni utoaji wa asili wa umoja wa pamoja wa Kigiriki kwa wasomaji wengi, na “Mwaminini Mungu; niaminini mimi pia” hudumisha usambamba na nguvu ya nyongeza ya καί.
