id: JHN.14.28
reference: John 14:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: sw
  text: Mlisikia kwamba niliwaambia, “Ninaondoka, nami ninakuja kwenu.” Kama mngenipenda, mngalifurahi[a] kwamba ninaenda kwa Baba, kwa sababu Baba ni mkuu kuliko mimi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mngefurahi.” Muundo wa Kigiriki unaweza kutafsiriwa kwa maana ya jumla zaidi, lakini “mngalifurahi” unaonyesha vizuri zaidi katika muktadha huu jambo ambalo lingalitokea lakini halikutokea.
    reason: lexical_alternative
  - marker: b
    text: Kauli “Baba ni mkuu kuliko mimi” imetafsiriwa kama ilivyoandikwa, bila kuongeza ufafanuzi kama “kwa jukumu” au “kwa cheo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Mlisikia
  rationale: Wakati uliopita wa Kigiriki unaonyesha kusikia kulikokamilika kwa maneno ambayo Yesu alikuwa amekwisha kuwaambia; wakati uliopita rahisi ni wa kawaida na wazi katika Kiswahili.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: kwamba niliwaambia
  rationale: ὅτι inaleta maudhui ya yale waliyosikia, na “kwamba” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: Ὑπάγω
  choice: Ninaondoka
  rationale: Kitenzi kina maana ya kwenda mbali na waliopo na hapa kinaelekea tukio la karibu; “ninaondoka” ni cha asili na huhifadhi mwendo wa kuwaacha wanafunzi.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: nami ninakuja kwenu
  rationale: Kauli ya sasa yenye mwelekeo wa wakati ujao imehifadhiwa kwa usemi hai wa “ninakuja kwenu,” bila kufafanua namna ya kuja.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Kama mngenipenda
  rationale: Muundo wa sharti lisilotimia umeonyeshwa kwa kiambishi -nge-, ambacho ni cha kawaida katika Kiswahili sanifu.
- source_word: ἐχάρητε ἄν
  choice: mngalifurahi
  rationale: Muundo wa -ngali- unaonyesha kwa uwazi furaha ambayo ingalitokea lakini haikutokea, kulingana na aoristi pamoja na ἄν katika jibu la sharti lisilotimia.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: ninaenda kwa Baba
  rationale: Usemi huu unahifadhi tendo la kwenda na Baba kama mwisho wa safari, bila kuongeza maelezo ya kitheolojia.
- source_word: πατέρα / πατὴρ
  choice: Baba
  rationale: “Baba” imehifadhiwa kama jina la heshima la Kiyohana; Kiswahili hakihitaji kibainishi kinacholingana na “the.”
- source_word: μείζων
  choice: mkuu
  rationale: “Mkuu” hutoa maana ya ukubwa au ukuu kwa mtu kwa lugha yenye hadhi, bila kuingiza kigezo maalumu kama cheo, jukumu, au hali.
- source_word: μού
  choice: kuliko mimi
  rationale: Huu ndio muundo wa kawaida wa Kiswahili baada ya neno la kulinganisha na unahifadhi ulinganisho wa moja kwa moja.
theological_decisions:
- issue: Maana ya “Baba ni mkuu kuliko mimi” kuhusiana na mafundisho kuhusu Baba na Mwana
  choice: Baba ni mkuu kuliko mimi
  alternative: Baba ni mkuu kuliko mimi kwa jukumu au cheo; Baba ni mkuu kuliko mimi katika hali yangu ya kuwa mwanadamu
  rationale: Kigiriki kinatoa ulinganisho bila kutaja kipengele chake. Tafsiri inahifadhi kauli hiyo na mvutano wake wa kitheolojia bila kuongeza ufafanuzi unaounga mkono msimamo fulani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mlisikia,” “ninaondoka,” na “ninakuja kwenu” ni vya kawaida na wazi; “mngalifurahi” ni rasmi kidogo lakini husaidia kubainisha sharti lisilotimia la wakati uliopita. Kauli ya mwisho imeachwa bila ufafanuzi wa kimadhehebu.
