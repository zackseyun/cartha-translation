  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: sw
  text: Kama mnanipenda, mtazishika amri zangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtazitii amri zangu.” Kitenzi hiki kinaweza kumaanisha kushika, kutunza, kuzingatia, au kutii; “kushika” hudumisha maana yake pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Kama
  rationale: Huanzisha kishazi cha sharti; “kama” ni tafsiri ya kawaida na ya asili bila kuongeza maana ya kurudiwa-rudiwa.
- source_word: ἀγαπᾶτέ
  choice: mnanipenda
  rationale: Kitenzi cha nafsi ya pili wingi kinaelekezwa kwa wanafunzi wengi; Kiswahili huunganisha kiima na kiwakilishi cha yambwa katika umbo hili la kawaida.
- source_word: με
  choice: -ni- katika “mnanipenda”
  rationale: Kiwakilishi cha yambwa kinachomrejelea Yesu huwakilishwa kwa kiambishi cha yambwa -ni-.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: amri zangu
  rationale: “Amri” ni neno la kawaida, lenye uzito unaofaa, kwa ἐντολή; umilikaji wenye msisitizo unatolewa kwa njia ya asili kama “zangu.”
- source_word: τηρήσετε
  choice: mtazishika
  rationale: Huhifadhi wakati ujao wa kitenzi cha Kigiriki na upana wa τηρέω, unaoweza kujumuisha kutunza, kuzingatia, na kutii, badala ya kuufupisha kuwa utii pekee.
theological_decisions:
- issue: Ikiwa τηρήσετε itafsiriwe kama amri ya moja kwa moja au kauli ya wakati ujao
  choice: 'Kauli ya wakati ujao: “mtazishika”'
  alternative: 'Amri: “zishikeni amri zangu”'
  rationale: Umbo la Kigiriki ni elekezi la wakati ujao, si shurutishi. Tafsiri inadumisha mvutano wa kauli kwamba upendo kwa Yesu huzaa kushika amri zake bila kuibadili kimya kimya kuwa agizo la moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi wa “mna-/mta-” umehifadhiwa, na sentensi ni ya asili kwa wasomaji wa kawaida.
