  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: sw
  text: Yule aliye na amri zangu na kuzishika ndiye anayenipenda. Naye anayenipenda atapendwa na Baba yangu, nami nitampenda, nami nitajifunua kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujionyesha kwake.” Kitenzi cha Kigiriki kinaweza kumaanisha kujidhihirisha, kujifanya ajulikane, au kuonekana; hapa huenda msisitizo ni kujifunua binafsi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Yule aliye na
  rationale: Kirai cha Kigiriki chenye kibainishi na kitenzi-jina kinamtaja mtu mmoja kwa maana ya uwakilishi; “Yule aliye na” kinahifadhi muundo na msisitizo huo kwa Kiswahili cha kawaida.
- source_word: ἐντολάς
  choice: amri
  rationale: “Amri” hudumisha mamlaka ya maneno ya Yesu na inafaa matumizi ya ἐντολή katika Yohana.
- source_word: τηρῶν
  choice: kuzishika
  rationale: τηρέω hapa ni kushika, kutunza, au kuzingatia kwa uaminifu. “Kuzishika” ni ya asili na pana kidogo kuliko “kuzitii,” hivyo inadumisha ladha ya Kiyohana.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: ndiye anayenipenda
  rationale: '“Ndiye” linaonyesha utambulisho wenye msisitizo wa ἐκεῖνος: mtu huyo hasa ndiye anayempenda Yesu.'
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: anayenipenda / atapendwa / nitampenda
  rationale: Marudio ya mzizi wa “penda” yanahifadhi marudio ya kimakusudi ya ἀγαπάω katika Kigiriki.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: Naye anayenipenda
  rationale: δέ ni kiunganishi chepesi hapa, si upinzani mkali; “Naye” kinaendeleza wazo kwa Kiswahili fasaha.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: atapendwa na Baba yangu
  rationale: Huhifadhi kauli tendwa ya wakati ujao na lugha ya uhusiano wa Yesu na Baba.
- source_word: κἀγὼ
  choice: nami
  rationale: κἀγώ huunganisha tendo la Yesu na la Baba; “nami” ni fupi, ya kawaida, na hudumisha nguvu ya nyongeza.
- source_word: ἐμφανίσω
  choice: kujifunua
  rationale: ἐμφανίζω inaweza kumaanisha kujionyesha, kujidhihirisha, au kujifunua. “Kujifunua” huonyesha ufunuo binafsi bila kuufanya lazima kuwa mwonekano wa kimwili.
- source_word: ἐμαυτόν
  choice: -ji- katika kujifunua
  rationale: Kiambishi rejeshi “-ji-” kinaonyesha kwamba Yesu anajifunua mwenyewe, si kutoa habari zake tu.
- source_word: αὐτὸν / αὐτῷ
  choice: -m- / kwake
  rationale: Viambishi vya umoja vinadumisha rejeleo la mtu mmoja wa uwakilishi; Kiswahili hakilazimishi jinsia katika maumbo haya.
theological_decisions:
- issue: Uhusiano kati ya upendo na kushika amri
  choice: Muundo unasema kwamba mwenye amri za Yesu na anayezishika ndiye anayempenda.
  alternative: Kutafsiri kuwa utiifu unathibitisha upendo au unastahili kupata upendo wa Mungu.
  rationale: Kigiriki kinatoa utambulisho wa karibu bila kutaja wazi sababu, uthibitisho, au kustahili. Tafsiri haiongezi uhusiano wa kisababishi ambao maandiko hayausemi.
- issue: Asili ya Yesu kujifunua
  choice: kujifunua kwake
  alternative: kujionyesha kwake
  rationale: Muktadha unaweza kuhusisha kujulikana binafsi, si lazima kuonekana kwa macho. “Kujifunua” huhifadhi upana huo.
- issue: Umoja wa uwakilishi
  choice: Kutumia maumbo ya mtu mmoja katika maandishi makuu.
  alternative: Kubadili kuwa wingi ili kusisitiza ujumuishi.
  rationale: Kigiriki kinatumia umoja wenye maana ya uwakilishi. Kiswahili kinaweza kudumisha umoja bila kuweka jinsia ya kiume wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yule aliye na ... ndiye” hudumisha msisitizo wa Kigiriki; “kuzishika” ni usemi wa kawaida wenye maana ya kuzitii na kuzitunza kwa uaminifu. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
