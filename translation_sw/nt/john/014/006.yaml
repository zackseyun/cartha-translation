  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: sw
  text: Yesu akamwambia[a], “Mimi ndimi njia, na kweli, na uzima. Hakuna mtu anayekuja kwa Baba isipokuwa kupitia kwangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata wakati wa kitenzi cha Kigiriki kwa karibu zaidi, “Yesu anamwambia.” Kigiriki hapa kinatumia wakati uliopo wa kihistoria.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida ka- ya mfululizo wa matukio. Kitenzi ‘mwambia’ pia huonyesha wazi kwamba maneno yanaelekezwa kwake.
- source_word: Ἐγώ εἰμι
  choice: Mimi ndimi
  rationale: Kiwakilishi cha wazi Ἐγώ kina mkazo. ‘Mimi ndimi’ ni usemi wa Kiswahili wenye hadhi unaohifadhi mkazo huo bila kuongeza maana nyingine.
- source_word: ἡ ὁδός
  choice: njia
  rationale: ‘Njia’ huhifadhi maana halisi na ya kimfano ya ὁδός na ni neno la kawaida linaloeleweka kwa urahisi.
- source_word: ἡ ἀλήθεια
  choice: kweli
  rationale: ‘Kweli’ ndiyo tafsiri ya kawaida na pana ya ἀλήθεια katika muktadha huu; haibani maana kuwa ‘uhalisi’ pekee.
- source_word: ἡ ζωή
  choice: uzima
  rationale: ‘Uzima’ katika Kiswahili cha kibiblia na cha kawaida unaweza kubeba maana pana ya ζωή katika Yohana, zaidi ya kuwapo hai kimwili tu.
- source_word: οὐδεὶς
  choice: Hakuna mtu
  rationale: Hii ni njia ya kawaida na yenye hadhi ya kueleza kukanusha kwa jumla kunakopatikana katika οὐδεὶς.
- source_word: ἔρχεται
  choice: anayekuja
  rationale: Muundo wa wakati uliopo unaonyesha ukweli wa jumla na unaoendelea, kama ilivyo katika Kigiriki.
- source_word: πρὸς τὸν πατέρα
  choice: kwa Baba
  rationale: Katika Kiswahili, ‘kuja kwa Baba’ huonyesha kwa kawaida mwendo au ufikaji kwa mtu. ‘Baba’ limetumiwa kama jina la kimahusiano la Mungu katika muktadha huu.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Katika sentensi hasi, ‘isipokuwa’ huwasilisha kwa usahihi nguvu ya kipekee ya εἰ μὴ na ni ya asili katika Kiswahili.
- source_word: δι’ ἐμοῦ
  choice: kupitia kwangu
  rationale: ‘Kupitia kwangu’ huhifadhi maana ya njia au upatanisho ya διά pamoja na umilikishi wa nafsi ya kwanza.
theological_decisions:
- issue: Upekee wa kumfikia Baba kupitia Yesu
  choice: Kauli ya moja kwa moja ‘Hakuna mtu anayekuja kwa Baba isipokuwa kupitia kwangu’ imehifadhiwa bila kulainishwa.
  alternative: Hakuna mtu anayekuja kwa Baba bila kupitia kwangu.
  rationale: Kigiriki kinaeleza wazi kuwa kumfikia Baba ni kupitia Yesu pekee. Tafsiri inahifadhi dai hilo bila kulipanua zaidi ya maneno ya aya.
- issue: Mfuatano wa vihusishi vitatu vya Yohana
  choice: ‘njia, na kweli, na uzima’
  alternative: ‘njia, kweli na uzima’
  rationale: Kurudia ‘na’ kunawakilisha καὶ ... καὶ na kuipa kila sehemu uzito wake. Kiswahili hakiwezi kurudia kibainishi kama Kigiriki, kwa kuwa hakina vibainishi vinavyolingana na ἡ.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. ‘Mimi ndimi’ limechaguliwa ili kuhifadhi mkazo wa Ἐγώ εἰμι; ‘uzima’ huhifadhi upana wa maana ya Yohana. Alama pekee ya tanbihi imewekwa mara moja katika matini kuu.
