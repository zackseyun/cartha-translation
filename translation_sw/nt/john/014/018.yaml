  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: sw
  text: Sitawaacha kama yatima[a]; ninakuja kwenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sitawaacha mkiwa yatima.” Taswira ya Kigiriki ni ya watoto walioachwa bila malezi ya wazazi.
    reason: lexical_alternative
  - marker: b
    text: Kauli “ninakuja kwenu” inaweza kumaanisha kuja kwa Yesu baada ya kufufuka, kuja kwake kwa njia ya Roho Mtakatifu, au kurudi kwake wakati ujao; maneno ya Kigiriki yenyewe hayalazimishi rejeo moja tu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: sitawaacha
  rationale: Kitenzi hiki cha wakati ujao hapa kina maana ya kuwaacha nyuma, si kusamehe wala kuruhusu. “Sitawaacha” ni Kiswahili cha kawaida na huungana vizuri na taswira ya yatima.
- source_word: ὀρφανούς
  choice: kama yatima
  rationale: Neno hili humaanisha kihalisi watu waliopoteza wazazi, na kwa upana walioachwa bila malezi au uangalizi. “Kama yatima” inadumisha taswira halisi ya kifamilia bila kuipunguza kuwa hisia za kuachwa tu.
- source_word: ἔρχομαι
  choice: ninakuja
  rationale: Umbo la wakati uliopo linaweza kuonyesha tukio lililo karibu au uhakika wenye uhai. “Ninakuja” linadumisha uharaka wa usemi wa Kigiriki kuliko kuligeuza moja kwa moja kuwa wakati ujao.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Katika muktadha wa kuja kwa watu, πρός pamoja na hali ya kushutumiwa huonyesha mwendo unaowaelekea. “Kwenu” ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: Οὐκ
  choice: si-
  rationale: Hii ni kanushi ya kawaida ya kitenzi cha wakati ujao; katika Kiswahili inaunganishwa kwa kawaida katika umbo “sitawaacha.”
theological_decisions:
- issue: Anayerejelewa na wakati wa kauli “ninakuja kwenu”
  choice: Kauli imetafsiriwa bila kubainisha kama Yesu anazungumzia kuwatokea baada ya kufufuka, kuja kwake kwa njia ya Roho Mtakatifu, au kurudi kwake wakati ujao.
  alternative: Kuitafsiri wazi kuwa kuwatokea baada ya ufufuo, kuja kwa njia ya Roho Mtakatifu, au kurudi kwake mwisho wa nyakati.
  rationale: Muktadha wa karibu una ahadi kuhusu Roho, lakini maneno yenyewe yanaweza pia kueleweka kuwa kuja kwa Yesu binafsi kwa wanafunzi. Tafsiri inadumisha upana na mvutano wa kiteolojia wa Kigiriki badala ya kuchagua rejeo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. “Kama yatima” inadumisha taswira ya kifamilia, na “ninakuja” inadumisha umbo la sasa na uharaka wa kauli ya asili.
