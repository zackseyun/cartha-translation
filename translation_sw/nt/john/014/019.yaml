  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: sw
  text: Bado muda mfupi tu, ulimwengu hautaniona tena; lakini ninyi mtaniona. Kwa sababu mimi ninaishi, ninyi pia mtaishi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ninyi pia mtaishi” huenda ikarejelea ushiriki wa wanafunzi katika uzima wa ufufuo wa Yesu, uzima wa kiroho katika umoja naye, au yote mawili.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Bado muda mfupi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba umebaki muda mfupi kabla ya mabadiliko yanayotajwa.
- source_word: ὁ κόσμος
  choice: ulimwengu
  rationale: Neno hili linadumisha istilahi pana ya Yohana bila kulifasiri moja kwa moja kuwa watu wote au mfumo unaompinga Mungu.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: hautaniona tena / mtaniona
  rationale: Kitenzi 'kuona' ni cha kawaida na cha asili; kinaacha wazi ikiwa ni kuona kwa macho, kutambua kiroho, au maana zote mbili. Wakati ujao katika Kiswahili unaafikiana na muktadha wa mabadiliko yaliyo karibu.
- source_word: οὐκέτι
  choice: tena
  rationale: Katika muundo hasi 'hautaniona tena,' neno hili linaonyesha kwa ufupi na kwa kawaida kukoma kwa hali iliyokuwapo.
- source_word: δὲ
  choice: lakini
  rationale: Linaonyesha wazi tofauti kati ya ulimwengu na wanafunzi katika uhusiano wao na Yesu.
- source_word: ὅτι
  choice: Kwa sababu
  rationale: Linatambulisha sababu ya wanafunzi kuishi, yaani, uhai wa Yesu mwenyewe.
- source_word: ἐγὼ ζῶ
  choice: mimi ninaishi
  rationale: Wakati wa sasa unadumishwa, na kiwakilishi 'mimi' kinahifadhi msisitizo wa ἐγώ.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: ninyi pia mtaishi
  rationale: Wakati ujao umewekwa wazi; 'pia' linadumisha uhusiano wa maisha ya wanafunzi na maisha ya Yesu, huku 'ninyi' likihifadhi msisitizo.
theological_decisions:
- issue: Maana ya wanafunzi kumwona Yesu
  choice: Imetafsiriwa kwa neno pana 'mtaniona' bila kubainisha namna ya kuona.
  alternative: Kuona kwa macho baada ya ufufuo; kumtambua Yesu aliyefufuka kiroho; au maana yenye tabaka zote mbili.
  rationale: Kigiriki hakilazimishi uchaguzi mmoja, na muktadha wa Yohana unaweza kuwa na maana zaidi ya moja; tafsiri inadumisha mvutano huo.
- issue: Maana ya 'ninyi pia mtaishi'
  choice: Imetafsiriwa kwa upana bila kuifungamanisha na aina moja tu ya uzima.
  alternative: Uzima wa ufufuo; uzima wa kiroho katika umoja na Yesu; au yote mawili.
  rationale: Kitenzi ζήσετε kinaweza kuelekeza kwenye ushiriki wa sasa na wa baadaye katika uzima wa Yesu, hivyo tafsiri haipaswi kupunguza upeo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kupoteza marudio, tofauti, na msisitizo wa Kigiriki.
