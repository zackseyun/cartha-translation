base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: sw
  text: “Amin, amin, nawaambia, yeyote anayeniamini atafanya pia kazi ninazofanya; naye atafanya kazi kubwa kuliko hizi[a], kwa sababu ninaenda kwa Baba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiyunani kinaweza pia kutafsiriwa kwa kufupisha: “naye atafanya yaliyo makubwa kuliko hizi,” huku neno “kazi” likieleweka kutokana na kishazi kilichotangulia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Neno la Kiyunani limedumishwa katika umbo lake lililozoeleka katika Kiswahili cha Biblia, na kurudiwa kwake kunahifadhi mkazo na uzito wa kauli ya Yesu.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: yeyote anayeniamini
  rationale: 'Huwasilisha kwa Kiswahili cha kawaida maana ya umoja wa uwakilishi: mtu yeyote anayemwamini Yesu, bila kuifanya kauli ihusu mwanamume peke yake.'
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: kazi ninazofanya
  rationale: ‘Kazi’ hudumisha msamiati wa Yohana unaojumuisha matendo na ishara za Yesu; wakati wa sasa umetafsiriwa kwa njia ya kawaida ya Kiswahili.
- source_word: κἀκεῖνος ποιήσει
  choice: atafanya pia ... naye atafanya
  rationale: ‘Pia’ huhifadhi mkazo wa κἀκεῖνος, huku ‘naye’ ikiendeleza umoja wa uwakilishi kwa Kiswahili fasaha.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: naye atafanya kazi kubwa kuliko hizi
  rationale: Kivumishi cha wingi μείζονα kinategemea ‘kazi’ katika kishazi kilichotangulia. Kurudia ‘kazi’ kunafanya Kiswahili kiwe wazi na cha kawaida bila kufafanua ni kwa maana gani kazi hizo ni kubwa.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi uhusiano wa kisababishi kati ya kazi kubwa na kwenda kwa Yesu kwa Baba.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: ninaenda kwa Baba
  rationale: Wakati wa sasa wa Kiyunani unaeleweka katika muktadha kama tendo linalokaribia; ‘Baba’ huhifadhi nomino yenye kibainishi bila kuongeza ‘yangu.’
theological_decisions:
- issue: Maana ya ‘kazi kubwa kuliko hizi’
  choice: Kauli imeachwa wazi kuhusu namna kazi hizo zitakavyokuwa kubwa, huku sababu iliyotolewa na mstari—kwenda kwa Yesu kwa Baba—ikihifadhiwa.
  alternative: Kufafanua kuwa ni kubwa kwa kuenea zaidi, kwa umuhimu katika historia ya ukombozi, au kwa huduma inayowezeshwa na Roho.
  rationale: Mstari wenyewe hausemi hasa ubora huo ni wa aina gani. Tafsiri haipaswi kuamua jambo ambalo maandishi yameacha lenye mvutano wa kitheolojia.
- issue: Umoja wa uwakilishi katika ὁ πιστεύων ... κἀκεῖνος
  choice: yeyote anayeniamini ... atafanya ... naye atafanya
  alternative: mwanamume anayeniamini ... yeye atafanya
  rationale: Miundo ya Kiyunani ni ya umoja na kisarufi ni ya kiume, lakini hutumiwa kwa maana ya jumla kumhusu mwamini yeyote. Kiswahili huwasilisha maana hiyo kwa kawaida bila kuingiza jinsia ambayo si kikomo cha rejeleo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya ‘Amin’ na ‘kazi’ yamedumishwa kwa ajili ya mkazo, uwazi na uhusiano wa msamiati ndani ya Injili ya Yohana.
