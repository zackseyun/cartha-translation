  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: sw
  text: Na nikienda na kuwaandalia mahali, nitakuja tena[a][b] na kuwachukua kwangu mimi, ili mahali nilipo mimi, nanyi pia muwepo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninakuja tena.” Kiyunani kimetumia umbo la kitenzi la wakati wa sasa likiwa na maana ya wakati ujao.
    reason: lexical_alternative
  - marker: b
    text: Wafafanuzi hutofautiana kuhusu kama “nitakuja tena” kunamaanisha hasa kuonekana kwa Yesu baada ya kufufuka, kuja kwa Roho, kurudi kwake kwa mwisho, au ahadi yenye matabaka inayojumuisha zaidi ya tukio moja.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: nikienda
  rationale: Muundo wa masharti unaonyesha jambo linalotazamiwa wakati ujao bila kuongeza wazo la kuondoka kabisa.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: kuwaandalia mahali
  rationale: ‘Kuandalia’ ni Kiswahili cha kawaida kinachowasilisha maana ya kutayarisha au kufanya tayari, na ‘mahali’ linaacha wazi aina ya mahali panapokusudiwa.
- source_word: πάλιν ἔρχομαι
  choice: nitakuja tena
  rationale: Ingawa Kiyunani kimetumia umbo la wakati wa sasa kwa maana ya wakati ujao, Kiswahili cha kawaida huhitaji wakati ujao hapa ili ahadi ieleweke wazi. Tanbihi inahifadhi upekee wa umbo la Kiyunani.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: kuwachukua kwangu
  rationale: Huwasilisha kwa lugha ya kawaida tendo la Yesu kuwachukua wanafunzi wawe pamoja naye, bila kupanua namna jambo hilo litakavyotokea.
- source_word: ἵνα
  choice: ili
  rationale: ‘Ili’ linaonyesha kusudi kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: mahali nilipo mimi
  rationale: Kiwakilishi ‘mimi’ kinahifadhi mkazo wa ἐγώ, huku ‘nilipo’ ikiwa njia ya kawaida ya Kiswahili kueleza mahali alipo msemaji.
- source_word: καὶ ὑμεῖς ἦτε
  choice: nanyi pia mwepo
  rationale: ‘Mwepo’ huhifadhi hali ya utegemezi katika kishazi cha kusudi, na ‘pia’ huonyesha ulinganifu unaoletwa na καί.
theological_decisions:
- issue: Maana ya kurudi kwa Yesu katika πάλιν ἔρχομαι
  choice: Ahadi imetafsiriwa kwa mwelekeo wa wakati ujao bila kubainisha namna au wakati hasa wa kuja huko.
  alternative: Kauli hiyo inaweza kueleweka kuwa inahusu kuonekana kwake baada ya kufufuka, kuja kwa Roho, kurudi kwake kwa mwisho, au ahadi yenye matabaka yanayojumuisha zaidi ya tukio moja.
  rationale: Aya inaahidi Yesu kuja tena na kuwachukua wanafunzi wawe pamoja naye, lakini yenyewe haitatui mjadala mpana kuhusu tukio mahususi linalokusudiwa. Tafsiri na tanbihi zinahifadhi uwazi huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kawaida kwa msomaji wa leo; maneno ya kimadhehebu na ufafanuzi usiotolewa wazi na matini yameepukwa.
