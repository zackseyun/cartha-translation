id: JHN.14.13
reference: John 14:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: sw
  text: Na chochote mtakachoomba kwa jina langu, hicho nitafanya, ili Baba atukuzwe katika Mwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia kwa Mwana.” Kigiriki kinasema “katika Mwana,” jambo linaloweza kuonyesha mazingira au njia ambayo kwayo Baba anatukuzwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: chochote
  rationale: Muundo wa kiwakilishi pamoja na ἄν unaonyesha jambo lisiloainishwa na upeo mpana; “chochote” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: αἰτήσητε
  choice: mtakachoomba
  rationale: αἰτέω hapa ni “kuomba”; umbo la nafsi ya pili wingi limehifadhiwa, na muundo “chochote mtakachoomba” unasikika kwa kawaida katika Kiswahili.
- source_word: ἐν τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi maana pana ya kutenda au kuomba kwa kuhusishwa na jina, mamlaka na uwakilishi wa Yesu bila kuifupisha kuwa ufafanuzi mmoja tu.
- source_word: τοῦτο
  choice: hicho
  rationale: Kionyeshi kilicho wazi katika Kigiriki kimehifadhiwa, kikirejelea chochote kitakachoombwa na pia kudumisha msisitizo wa sentensi.
- source_word: ποιήσω
  choice: nitafanya
  rationale: Kitenzi ποιέω kina maana pana na ya moja kwa moja ya “kufanya”; wakati ujao wa nafsi ya kwanza umewakilishwa wazi.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kusudi kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: δοξασθῇ
  choice: atukuzwe
  rationale: “Atukuzwe” huhifadhi kauli tendwa na lugha ya kibiblia ya utukufu bila kuidhoofisha kuwa kuheshimiwa tu.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Kigiriki kinasema “Baba,” si “Baba yangu”; hapa ni jina maalumu la kimahusiano kwa Mungu, hivyo limeandikwa kwa herufi kubwa.
- source_word: ἐν τῷ υἱῷ
  choice: katika Mwana
  rationale: “Katika Mwana” huhifadhi kwa karibu kihusishi ἐν na haifungi maana yake iwe chombo pekee; pia inadumisha mvutano wa maana kati ya mahali au mazingira ya kitendo na njia yake.
theological_decisions:
- issue: Maana ya kuomba “kwa jina langu”
  choice: Usemi umehifadhiwa kama “kwa jina langu” bila ufafanuzi wa ziada ndani ya andiko.
  alternative: kwa mamlaka yangu; katika umoja nami; kulingana na tabia na mapenzi yangu
  rationale: Usemi huu una maana kadhaa zinazohusiana katika Injili ya Yohana. Tafsiri iliyo karibu na usemi wenyewe huhifadhi upana huo bila kuingiza msimamo mmoja wa kimafundisho.
- issue: Nguvu ya ἐν τῷ υἱῷ
  choice: Imetafsiriwa “katika Mwana.”
  alternative: kupitia kwa Mwana
  rationale: Kihusishi ἐν kinaweza kuonyesha mazingira au nyanja ambamo Baba anatukuzwa, na katika muktadha huu huenda pia kikaeleweka kwa maana ya njia. Andiko kuu halilazimishi maana moja, huku tanbihi ikionyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio “hicho nitafanya” umehifadhi msisitizo wa τοῦτο, na “katika Mwana” limeachwa kwa makusudi bila kufafanuliwa kupita kiasi.
