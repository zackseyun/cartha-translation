base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: sw
  text: Filipo akamwambia, “Bwana, tuonyeshe Baba, na hilo linatutosha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita wa mfululizo; umbo hili pia linajumuisha tendo la kusema na yule anayeambiwa.
- source_word: αὐτῷ
  choice: -mw- katika “akamwambia”
  rationale: Kiwakilishi cha yambwa kisicho cha moja kwa moja kimeingizwa kwa njia ya kawaida katika kitenzi cha Kiswahili.
- source_word: Φίλιππος
  choice: Filipo
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: Κύριε
  choice: Bwana
  rationale: Huhifadhi heshima ya neno la kumwita Yesu na uzito unaoweza kuwa wa kikristolojia katika muktadha wa Yohana, bila kulidhoofisha kuwa salamu ya adabu tu.
- source_word: δεῖξον
  choice: tuonyeshe
  rationale: Hutoa ombi la moja kwa moja la kumfanya Baba aonekane au ajulikane; “onyesha” ni ya kawaida na haiongezi ufafanuzi usio katika matini.
- source_word: ἡμῖν
  choice: tu- katika “tuonyeshe”
  rationale: Kiambishi cha yambwa cha nafsi ya kwanza wingi ndicho namna ya kawaida ya kusema “onyesha sisi” kwa Kiswahili.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Katika muktadha huu jina hili linamrejelea Mungu, Baba wa Yesu; herufi kubwa huonyesha rejeo hilo maalumu.
- source_word: καὶ
  choice: nasi
  rationale: Huunganisha ombi na matokeo yanayotarajiwa kwa njia ya kawaida ya Kiswahili, huku ikihifadhi nafsi ya kwanza wingi.
- source_word: ἀρκεῖ ἡμῖν
  choice: tutatosheka
  rationale: Kiswahili cha asili hueleza wazo la “itatosha kwetu” kwa kitenzi “kutosheka.” Wakati ujao unaonyesha matokeo yanayotarajiwa baada ya ombi kutimizwa, bila kubadili maana ya utoshelevu.
theological_decisions:
- issue: Tafsiri ya κύριος kama neno la kumwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi kwa pamoja heshima ya moja kwa moja na uzito mpana wa neno κύριος katika Injili ya Yohana. “Mheshimiwa” linawezekana kileksika katika baadhi ya miktadha, lakini hapa linaweza kudhoofisha maana inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akamwambia” unafaa masimulizi, na “nasi tutatosheka” ni wa kawaida zaidi kuliko “hilo latutosha,” huku ukihifadhi uhusiano wa ombi na matokeo.
