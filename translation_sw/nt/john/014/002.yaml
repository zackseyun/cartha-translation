base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: sw
  text: Katika nyumba ya Baba yangu mna makao mengi[a]. Kama haingekuwa hivyo[b], je, ningewaambia kwamba ninaenda kuwaandalia mahali?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyumba vingi.” Neno la Kigiriki linaweza kumaanisha mahali pa kukaa au kuishi; “makao” ni pana zaidi na linahifadhi uhusiano na wazo la kukaa linalojitokeza katika sura hii.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kama haingekuwa hivyo, ningewaambia; kwa maana ninaenda kuwaandalia mahali.” Kishazi cha Kigiriki kinaweza pia kueleweka kama kauli badala ya swali la balagha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῇ οἰκίᾳ τοῦ πατρός μου
  choice: Katika nyumba ya Baba yangu
  rationale: “Nyumba” huhifadhi taswira halisi ya οἰκία na usemi wa Kiyohana kuhusu nyumba ya Baba, bila kuupanua kuwa “jamaa” au “kaya.”
- source_word: μοναὶ πολλαί
  choice: makao mengi
  rationale: “Makao” ni neno la kawaida na lenye heshima kwa mahali pa kukaa au kuishi; ni pana kuliko “vyumba” na halileti wazo la majumba makubwa lisilomo katika Kigiriki.
- source_word: εἰ δὲ μή
  choice: Kama haingekuwa hivyo
  rationale: Hukamilisha sharti lililodokezwa kwa Kiswahili cha asili na kulihusisha wazi na kauli iliyotangulia.
- source_word: εἶπον ἂν ὑμῖν
  choice: je, ningewaambia
  rationale: “Ningewaambia” huonyesha hali ya masharti, huku “je” ikiweka wazi usomaji wa swali la balagha; kiambishi “-wa-” huhifadhi wingi wa ὑμῖν.
- source_word: ὅτι
  choice: kwamba
  rationale: Katika usomaji mkuu, ὅτι hutambulisha yaliyomo katika kile ambacho Yesu angewaambia.
- source_word: πορεύομαι
  choice: ninaenda
  rationale: Hutoa maana ya sasa yenye mwelekeo wa wakati ujao na kuhifadhi hali ya moja kwa moja ya kauli ya Yesu.
- source_word: ἑτοιμάσαι τόπον ὑμῖν
  choice: kuwaandalia mahali
  rationale: “Kuwaandalia” huonyesha kusudi na manufaa kwao kwa Kiswahili cha kawaida, na “mahali” huhifadhi upana wa τόπος bila kuibana kuwa “chumba.”
theological_decisions:
- issue: Maana ya μονή katika taswira ya wakati ujao
  choice: makao mengi
  alternative: vyumba vingi; majumba mengi
  rationale: “Makao” huhifadhi maana ya mahali pa kukaa bila kudai kuwa ni vyumba ndani ya jengo au majumba makubwa ya kifahari.
- issue: Uakifishaji na nguvu ya kishazi cha pili
  choice: 'Swali la balagha: “Kama haingekuwa hivyo, je, ningewaambia kwamba ninaenda kuwaandalia mahali?”'
  alternative: 'Kauli: “Kama haingekuwa hivyo, ningewaambia; kwa maana ninaenda kuwaandalia mahali.”'
  rationale: Maandishi ya awali hayakuwa na uakifishaji, na muundo wa Kigiriki unaweza kueleweka kama swali au kauli. Usomaji wa swali unafaa katika mtiririko, lakini tanbihi huhifadhi uwezekano mwingine wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mna” linapatana na ngeli ya mahali ya “katika nyumba,” “kuwaandalia” ni la kawaida kuliko muundo mzito wa “kuandaa mahali kwa ajili yenu,” na alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
