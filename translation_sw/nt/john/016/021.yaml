id: JHN.16.21
reference: John 16:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: sw
  text: Mwanamke anapojifungua, huwa na huzuni kwa sababu saa yake imefika; lakini akiisha kumzaa mtoto, hakumbuki tena dhiki hiyo kwa sababu ya furaha kwamba mwanadamu amezaliwa ulimwenguni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυνή
  choice: mwanamke
  rationale: Mfano huu unamhusu mwanamke kwa ujumla katika kujifungua; maana ya ‘mke’ haitakiwi na muktadha.
- source_word: ὅταν τίκτῃ
  choice: anapojifungua
  rationale: Huwasilisha hali ya kawaida na tendo linaloendelea kwa Kiswahili cha asili bila kulifupisha kuwa uchungu wa kuzaa pekee.
- source_word: λύπην ἔχει
  choice: huwa na huzuni
  rationale: Huhifadhi wazo la huzuni au masikitiko, si maumivu ya mwili pekee, na hivyo kuendana na muktadha wa huzuni inayogeuka kuwa furaha.
- source_word: ἡ ὥρα αὐτῆς
  choice: saa yake
  rationale: Huhifadhi picha ya ‘saa’ na mwangwi wake katika Injili ya Yohana huku ikimaanisha wakati wake wa kujifungua.
- source_word: γεννήσῃ τὸ παιδίον
  choice: akiisha kumzaa mtoto
  rationale: Muundo huu unaonyesha kwamba tendo la kumzaa mtoto limekamilika kabla ya kutokumbuka tena dhiki.
- source_word: οὐκέτι μνημονεύει
  choice: hakumbuki tena
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi hicho.
- source_word: τῆς θλίψεως
  choice: dhiki hiyo
  rationale: ‘Dhiki’ huonyesha taabu na mateso makali ya kujifungua bila kuifanya iwe maumivu ya mwili pekee; ‘hiyo’ hurejelea hali iliyotangulia.
- source_word: διὰ τὴν χαράν
  choice: kwa sababu ya furaha
  rationale: Huwasilisha wazi maana ya kisababishi ya διά pamoja na hali ya furaha.
- source_word: ὅτι ἐγεννήθη
  choice: kwamba ... amezaliwa
  rationale: ‘Kwamba’ hutambulisha sababu au maudhui ya furaha bila kulazimisha tofauti hiyo ya kisarufi.
- source_word: ἄνθρωπος
  choice: mwanadamu
  rationale: Neno la Kigiriki hapa ni la kijumla na humaanisha kiumbe wa kibinadamu, si mtoto wa kiume hasa; ‘mwanadamu’ huhifadhi utofauti wake na παιδίον (‘mtoto’).
- source_word: εἰς τὸν κόσμον
  choice: ulimwenguni
  rationale: Ni njia ya kawaida ya Kiswahili ya kusema kwamba mtu amezaliwa na kuingia katika ulimwengu.
theological_decisions:
- issue: Maana ya kijumla ya ἄνθρωπος
  choice: mwanadamu
  alternative: mtu; mwanamume
  rationale: ‘Mwanadamu’ huhifadhi maana ya kijumla ya maisha mapya ya kibinadamu na haidokezi bila msingi kwamba mtoto huyo ni wa kiume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Anapojifungua’ na ‘akiisha kumzaa’ hutofautisha mchakato unaoendelea na tendo lililokamilika. ‘Saa yake’ imehifadhiwa kwa sababu ya uzito wake wa kifasihi katika Yohana.
