translation:
  language: sw
  text: Na kuhusu haki[a], kwa sababu ninakwenda kwa Baba, nanyi hamtaniona tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu.” Neno la Kigiriki linaweza kumaanisha haki au uadilifu; hapa “haki” imetumiwa kwa sababu muktadha unahusu kuthibitishwa kwa Yesu anapokwenda kwa Baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: kuhusu
  rationale: Huhifadhi muundo unaorudiwa katika orodha ya aya 9–11 na ni Kiswahili sanifu na cha kawaida.
- source_word: δικαιοσύνης
  choice: uadilifu
  rationale: ‘Uadilifu’ hapa huonyesha hali ya kuwa sawa au mwenye haki, inayohusishwa na kuthibitishwa kwa Yesu anapokwenda kwa Baba; ‘haki’ imehifadhiwa katika tanbihi kwa sababu neno la Kigiriki linaweza pia kuwa na maana hiyo.
- source_word: δέ
  choice: na
  rationale: Hapa δέ inaendeleza kipengele kinachofuata katika orodha, wala haionyeshi upinzani mkali.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi uhusiano wa kisababishi katika maelezo haya.
- source_word: πρὸς τὸν πατέρα
  choice: kwa Baba
  rationale: Pamoja na kitenzi cha mwendo, πρός hueleza kwenda kwa mtu; ‘Baba’ huhifadhi cheo cha uhusiano kilicho katika Kigiriki bila kuongeza ‘yangu.’
- source_word: ὑπάγω
  choice: ninakwenda
  rationale: Wakati wa sasa una mwelekeo wa wakati ujao katika muktadha, na ‘ninakwenda’ huhifadhi ukaribu wa kuondoka kwa Yesu.
- source_word: οὐκέτι
  choice: tena
  rationale: Katika muundo hasi ‘hamtaniona tena,’ huwasilisha kwa kawaida kukoma kwa tendo kuanzia wakati huo.
- source_word: θεωρεῖτέ
  choice: mtaniona
  rationale: Ingawa θεωρέω inaweza kumaanisha kutazama au kuangalia kwa makini, hapa inahusu kutomwona Yesu tena; ‘kuona’ ni wazi na ya kawaida.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika muktadha wenye uzito wa kitheolojia
  choice: uadilifu
  alternative: haki
  rationale: Muktadha unaunganisha neno hili na kwenda kwa Yesu kwa Baba na hivyo kuthibitishwa kwake kuwa yuko sawa. ‘Uadilifu’ hudokeza sifa au hali ya kuwa sawa bila kuzuia wigo mpana wa ‘haki,’ ambao umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa kwa ‘na kuhusu,’ huku sentensi ikisomeka kwa kawaida.
