base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: sw
  text: Lakini yeye, Roho wa kweli, atakapokuja, atawaongoza katika kweli yote.[a] Kwa maana hatasema kutoka kwake mwenyewe,[b] bali atasema yote atakayosikia, naye atawajulisha mambo yajayo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye kweli yote.” Kigiriki kina kihusishi ambacho kwa kawaida humaanisha “katika,” ingawa pamoja na wazo la kuongoza kinaweza kueleweka kwa maana ya kuelekeza kwenye kweli yote.
    reason: alternative_reading
  - marker: b
    text: 'Au, “hatasema kwa kujitegemea.” Kwa tafsiri ya karibu kabisa: “hatasema kutoka kwake mwenyewe.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “mambo yatakayokuja” au “yale yanayokuja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Lakini atakapokuja
  rationale: ὅταν linaanzisha kishazi cha wakati chenye mtazamo wa wakati ujao, na δέ hapa linaendeleza hoja kwa utofautishaji mdogo; “Lakini atakapokuja” ni Kiswahili cha kawaida na cha wazi.
- source_word: ἔλθῃ ἐκεῖνος
  choice: atakapokuja yeye
  rationale: Muundo huu huhifadhi msisitizo wa ἐκεῖνος na rejeo lake la kibinafsi kwa Roho, huku ukitambulisha vizuri kirai cha ufafanuzi kinachofuata.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Roho wa kweli
  rationale: Hili ni jina la Kiyohana kwa Roho Mtakatifu. “Roho wa kweli” ni muundo wa kawaida wa Kiswahili unaohifadhi uhusiano wa kirai cha Kigiriki bila kulifafanua kupita kiasi.
- source_word: ὁδηγήσει
  choice: atawaongoza
  rationale: ὁδηγέω humaanisha kuongoza au kuelekeza; “atawaongoza” hubeba vizuri taswira ya kuwaelekeza wanafunzi.
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: katika kweli yote
  rationale: “Katika” huhifadhi ἐν kwa karibu na pia ni muundo wa asili wa Kiswahili pamoja na “kuongoza.” πάσῃ pamoja na nomino yenye kibainishi inaelekea kumaanisha kweli kwa ukamilifu wake, yaani “kweli yote.”
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: Kwa maana hatasema kutoka kwake mwenyewe
  rationale: Tafsiri hii huhifadhi kwa karibu maana ya ἀφ’ ἑαυτοῦ, “kutoka kwake mwenyewe,” na utegemezi unaoonyeshwa na muktadha, bila kuongeza wazo la mamlaka ambalo halijaelezwa moja kwa moja.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: bali atasema yote atakayosikia
  rationale: Muundo huu ni wa kawaida katika Kiswahili na huhifadhi ulinganifu wa kusikia kisha kusema pamoja na nguvu ya wakati ujao ya ἀκούσει.
- source_word: τὰ ἐρχόμενα
  choice: mambo yanayokuja
  rationale: Kirai hiki huhifadhi picha ya mambo au matukio yanayokuja bila kukibana kuwa unabii wa aina fulani.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: atawaeleza
  rationale: ἀναγγέλλω hapa ni kutangaza, kuripoti, au kufanya yajulikane. “Atawaeleza” ni ya asili na yenye kueleweka, huku ikibeba tendo la kuwajulisha wanafunzi.
theological_decisions:
- issue: Rejeo la kibinafsi kwa Roho
  choice: Kutumia “yeye” na upatanisho wa nafsi kwa Roho
  alternative: Kuepuka kiwakilishi kwa kurudia “Roho”
  rationale: Ingawa πνεῦμα ni nomino ya jinsia ya kati katika Kigiriki, maandishi yanatumia ἐκεῖνος ya kiume kwa msisitizo wa kibinafsi. Kiswahili hakihitaji kiwakilishi chenye jinsia, lakini “yeye” huhifadhi msisitizo huo bila kuingiza jinsia ya kisarufi isiyokuwapo katika Kiswahili.
- issue: Maana ya ἐν τῇ ἀληθείᾳ πάσῃ
  choice: “katika kweli yote” katika maandishi makuu
  alternative: “kuingia katika kweli yote” au “kwenye kweli yote”
  rationale: “Katika” hufuata ἐν kwa karibu na ni ya kawaida katika Kiswahili. Hivyo huepuka kulazimisha mwelekeo wa “kuingia ndani” ambao unaweza kudokezwa na kitenzi lakini haujaonyeshwa wazi na kihusishi.
- issue: Utegemezi wa usemi wa Roho
  choice: “hatasema kutoka kwake mwenyewe”
  alternative: “hatasema kwa kujitegemea” au “kwa mamlaka yake mwenyewe”
  rationale: Chaguo kuu huhifadhi lugha ya chanzo na mvutano wake wa kiteolojia bila kufasiri ἀφ’ ἑαυτοῦ kuwa hasa suala la uhuru au mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio “atakapokuja yeye, Roho wa kweli” huhifadhi msisitizo wa Kigiriki na bado unasomeka kwa urahisi. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika maandishi makuu.
