  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: sw
  text: Nimewaambia mambo haya ili mpate kuwa na amani ndani yangu. Ulimwenguni mna dhiki[a], lakini jipeni moyo[b]; mimi nimeushinda ulimwengu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, taabu, mateso, au shida.
    reason: lexical_alternative
  - marker: b
    text: Au, iweni jasiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: mambo haya
  rationale: Wingi wa kiwakilishi hiki unarejelea mafundisho ya Yesu yaliyotangulia; “mambo haya” ni Kiswahili cha kawaida na huhifadhi wingi huo.
- source_word: λελάληκα ὑμῖν
  choice: Nimewaambia
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililokamilika lenye umuhimu unaoendelea. “Nimewaambia” ni usemi wa kawaida wa Kiswahili na unajumuisha walengwa wa kauli hiyo.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi kwa wazi na kwa lugha ya kawaida.
- source_word: ἐν ἐμοὶ
  choice: ndani yangu
  rationale: Huhifadhi kwa karibu lugha muhimu ya Yohana kuhusu kuwa “ndani” ya Yesu bila kuipanua kiufafanuzi kuwa “kwa njia yangu” au “katika umoja nami.”
- source_word: εἰρήνην ἔχητε
  choice: mpate kuwa na amani
  rationale: Huwasilisha kusudi la kuwa na amani inayoendelea; “amani” hubeba maana ya utulivu na hali njema katika uhusiano na Yesu.
- source_word: ἐν τῷ κόσμῳ
  choice: Ulimwenguni
  rationale: Ni Kiswahili cha asili kwa “katika ulimwengu” na hakiongezi ufafanuzi kama “ulimwengu huu ulioanguka.”
- source_word: θλῖψιν ἔχετε
  choice: mna dhiki
  rationale: “Dhiki” huonyesha mateso, shida nzito, au hali ya kusongwa, na huhifadhi uzito wa neno la Kigiriki bila kulifunga kwenye aina moja tu ya taabu.
- source_word: θαρσεῖτε
  choice: jipeni moyo
  rationale: Ni amri ya wingi inayowahimiza wasikilizaji kuwa na ujasiri wanapokabili dhiki. Usemi huu ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: νενίκηκα τὸν κόσμον
  choice: mimi nimeushinda ulimwengu
  rationale: '“Nimeushinda” huhifadhi wakati timilifu: ushindi umekamilika na matokeo yake yanaendelea. Kiwakilishi “mimi” kimewekwa ili kuonyesha msisitizo wa ἐγώ.'
theological_decisions:
- issue: Maana ya κόσμος katika muktadha wa Yohana
  choice: ulimwengu
  alternative: mfumo wa ulimwengu; ulimwengu huu ulioanguka
  rationale: '“Ulimwengu” huhifadhi upana na mvutano wa matumizi ya Yohana: ni mahali ambapo wanafunzi wana dhiki na pia kile ambacho Yesu amekishinda, bila kuingiza ufafanuzi wa kimadhehebu.'
- issue: Nguvu ya kauli za wakati timilifu za Yesu
  choice: Nimewaambia; nimeushinda
  alternative: Niliwaambia; niliushinda
  rationale: Miundo ya wakati timilifu wa Kiswahili huonyesha matendo yaliyokamilika yenye umuhimu unaoendelea, hasa tamko la ushindi wa Yesu kabla ya simulizi la msalaba kufikia ukamilifu wake.
- issue: Amani “ndani yangu” ikilinganishwa na dhiki “ulimwenguni”
  choice: Kuhifadhi tofauti hiyo moja kwa moja
  alternative: amani kupitia kwangu; dhiki katika mfumo wa ulimwengu
  rationale: Muundo wa mstari unakusudia kuweka mvutano kati ya mahali pa amani na mazingira ya dhiki. Tafsiri ya karibu huhifadhi teolojia hiyo bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nimewaambia,” “mna dhiki,” na “jipeni moyo” vinaeleweka kwa wasomaji wa kawaida. Alama za tanbihi [a] na [b] zimewekwa baada ya maneno yanayohusika; mpangilio huu unasahihisha kutolingana kwa alama na maelezo katika safu ya Kiingereza.
