  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: sw
  text: Yesu alijua kwamba walitaka kumwuliza, naye akawaambia, “Je, mnajadili hili miongoni mwenu kwamba nilisema[a], ‘Baada ya muda mfupi hamtaniona, na tena baada ya muda mfupi mtaniona’?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu nilisema.” Kiunganishi cha Kigiriki kinaweza kutambulisha maudhui ya jambo walilokuwa wakijadiliana au sababu ya kulijadili.
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki kinatumia vitenzi viwili tofauti vya kuona: kwanza θεωρέω, ambacho kinaweza pia kumaanisha “kutazama” au “kuchunguza,” kisha ὁράω, “kuona.” Hapa vyote vimetafsiriwa kwa mzizi wa “kuona” ili kuhifadhi ulinganifu wa kauli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: alijua
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu alitambua kusudi la wanafunzi; “alijua” ni tafsiri ya kawaida na ya moja kwa moja katika muktadha huu.
- source_word: ἤθελον
  choice: walitaka
  rationale: Huwasilisha nia yao inayoendelea kwa Kiswahili cha kawaida bila kulazimisha hali ya kitenzi cha Kigiriki.
- source_word: ἐρωτᾶν
  choice: kumwuliza
  rationale: Katika mazungumzo haya kitenzi kinamaanisha kumuuliza mtu, si kumhoji kwa uhasama.
- source_word: ζητεῖτε μετ’ ἀλλήλων
  choice: mnaulizana
  rationale: Katika muktadha huu wanafunzi wanajaribu kuelewa kauli ya Yesu kwa kuulizana wao kwa wao. “Mnaulizana” ni ya asili zaidi kuliko tafsiri halisi ya “mnatafuta.”
- source_word: Περὶ τούτου
  choice: kuhusu jambo hili
  rationale: Hutaja wazi mada waliyoizungumzia bila kuongeza maana nyingine.
- source_word: ὅτι εἶπον
  choice: kwa sababu nilisema
  rationale: Muundo huu ni wa asili katika Kiswahili na unawakilisha ὅτι kama ikitaja sababu ya kuulizana kwao; uwezekano kwamba inaingiza maudhui ya mjadala umehifadhiwa katika tanbihi.
- source_word: Μικρὸν
  choice: kitambo kidogo
  rationale: Kivumishi hiki kimetumiwa kama usemi wa kipindi kifupi; “kitambo kidogo” ni cha kueleweka na chenye hadhi.
- source_word: οὐ θεωρεῖτέ με
  choice: hamtaniona tena
  rationale: Ingawa Kigiriki kina wakati wa sasa, mpangilio wa muda unaashiria kwamba baada ya muda mfupi hawatamwona. “Tena” huonyesha kukoma kwa hali ya sasa kwa Kiswahili cha kawaida.
- source_word: πάλιν μικρὸν
  choice: kisha baada ya kitambo kidogo
  rationale: Hutoa hatua inayofuata katika mfuatano wa vipindi viwili vifupi kwa Kiswahili kinachoeleweka.
- source_word: ὄψεσθέ με
  choice: mtaniona
  rationale: Wakati ujao wa ὁράω hutafsiriwa kwa kawaida “mtaniona.”
theological_decisions:
- issue: Maana ya ὅτι baada ya swali la Yesu
  choice: 'Tafsiri kama sababu: “kwa sababu nilisema”'
  alternative: 'Tafsiri kama maudhui: “kwamba nilisema”'
  rationale: Kiunganishi kinaweza kutambulisha sababu ya mjadala au maudhui yake. Kiswahili cha matini kuu kinahitaji mtiririko wa asili, lakini tanbihi inahifadhi uwezekano mwingine bila kutatua kimya kimya utata wa Kigiriki.
- issue: Tofauti kati ya θεωρέω na ὁράω
  choice: Tafsiri zote kwa mzizi wa “kuona”
  alternative: Tofautisha kwa “kutazama” na “kuona”
  rationale: Mkazo wa muktadha ni kutokuwapo kwa muda na kuonekana tena, wala si lazima aina mbili tofauti za kuona. Kutumia “kuona” mara zote huhifadhi ulinganifu; tofauti ya msamiati imeelezwa katika tanbihi.
- issue: Nguvu ya swali la Yesu
  choice: Liwasilishwe kama swali halisi kwa “Je”
  alternative: Liwasilishwe kama taarifa kwamba wanaulizana
  rationale: Muundo wa Kigiriki unaonyesha swali linalofichua mazungumzo ya wanafunzi bila kuongeza lawama au mkazo wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kitambo kidogo” kinadumisha uzito wa kauli huku kikieleweka kwa wasomaji wa kawaida; “mnaulizana” ni cha mazungumzo ya kawaida zaidi kuliko tafsiri halisi ya ζητεῖτε.
