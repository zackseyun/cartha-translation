  text: concerning sin[a], because they do not believe in me;
translation:
  language: sw
  text: kuhusu dhambi[a], kwa sababu hawaniamini;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhusu dhambi kwamba hawaniamini.” Kiunganishi cha Kigiriki kinaweza kutafsiriwa kwa njia zote mbili, lakini “kwa sababu” kinaonyesha vizuri zaidi nguvu yake ya kutoa sababu katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: kuhusu
  rationale: Kihusishi hiki kinatambulisha jambo ambalo Roho atauhakikishia ulimwengu; “kuhusu” ni cha kawaida na kinadumisha muundo sambamba wa mistari 9–11.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: Nomino ya umoja inataja dhambi kama dhana au kundi, bila kuibadili kuwa matendo mengi ya dhambi.
- source_word: μέν
  choice: —
  rationale: Hutambulisha kipengele cha kwanza katika mfululizo wa mistari 9–11. Kiswahili hakihitaji neno la moja kwa moja hapa; mpangilio sambamba unaonyesha kazi yake.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika muktadha huu linaeleza msingi wa maneno “kuhusu dhambi.” Hata hivyo, linaweza pia kueleweka kuwa linatambulisha maelezo yenye maana ya “kwamba,” hivyo mbadala huo umewekwa katika tanbihi.
- source_word: οὐ πιστεύουσιν
  choice: hawaniamini
  rationale: Wakati uliopo unaeleza hali inayoendelea ya kutomwamini Yesu. Muundo huu ni wa asili katika Kiswahili.
- source_word: εἰς ἐμέ
  choice: -niamini
  rationale: Pamoja na πιστεύω, εἰς ἐμέ huonyesha imani au tumaini linaloelekezwa kwa Yesu. Kiswahili huwasilisha maana hiyo kwa kitenzi chenye kiambishi cha yambwa “-ni-” bila kutafsiri kihusishi kwa neno tofauti.
theological_decisions:
- issue: Aina ya dhambi inayotajwa katika mstari
  choice: Mstari unaunganisha dhambi inayozungumziwa hapa moja kwa moja na kutomwamini Yesu.
  alternative: Mstari unazungumzia hali ya dhambi ya wanadamu kwa ujumla, huku kutomwamini Yesu kukiwa mfano mmoja.
  rationale: Kishazi kinachoanza na ὅτι kinaeleza “kuhusu dhambi” kwa kutaja kwamba hawamwamini Yesu. Tafsiri inadumisha uhusiano huo bila kuongeza dai pana la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya nukta mkato inadumisha mwendelezo wa sentensi na mfululizo wa mistari 9–11.
