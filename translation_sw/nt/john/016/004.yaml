  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: sw
  text: Lakini nimewaambia mambo haya ili saa yao itakapofika[a], mkumbuke kwamba niliwaambia mambo hayo. Lakini sikuwaambia mambo haya tangu mwanzo, kwa sababu nilikuwa pamoja nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kigiriki, “saa yao itakapofika, myakumbuke—kwamba niliwaambia.” Kigiriki kina αὐτῶν (“yao/wao”) mara mbili. Ya kwanza iko katika “saa yao”; ya pili inaweza kueleweka “myakumbuke [mambo hayo],” ingawa muundo huo ni mgumu kuuwakilisha kwa ulaini katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: nimewaambia
  rationale: Wakati timilifu unaonyesha tendo lililofanyika na ambalo bado lina umuhimu; kitenzi hiki ni cha kawaida na kinafaa katika muktadha wa Yesu kuwaambia wanafunzi wake mambo yaliyotangulia.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea maonyo yaliyotangulia na kinatafsirika kwa Kiswahili cha kawaida kama “mambo haya.”
- source_word: ἵνα
  choice: ili
  rationale: Neno hili linaonyesha kusudi la Yesu kusema mambo hayo.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: saa yao itakapofika
  rationale: Muundo huu unaonyesha tukio la baadaye. “Saa” linadumisha taswira muhimu katika Injili ya Yohana ya wakati uliowekwa, na “yao” linahifadhi utata wa rejeo la αὐτῶν.
- source_word: μνημονεύητε
  choice: mkumbuke
  rationale: Hili ni neno la kawaida na la moja kwa moja linaloonyesha matokeo yaliyokusudiwa.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: kwamba niliwaambia
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi kishazi cha maudhui kinachoanzishwa na ὅτι bila kuongeza kitu kisichotajwa wazi.
- source_word: ἐξ ἀρχῆς
  choice: tangu mwanzo
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kipindi kinachoanzia mwanzo.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: nilikuwa pamoja nanyi
  rationale: Tafsiri hii inadumisha maana ya uhusiano na uwepo wa Yesu kwa wanafunzi wake.
theological_decisions:
- issue: Rejeo la αὐτῶν katika “saa yao” na baada ya μνημονεύητε
  choice: αὐτῶν ya kwanza imetafsiriwa “yao,” huku ya pili ikiwakilishwa kwa maana ndani ya “mkumbuke kwamba niliwaambia”; tanbihi inatoa muundo wa karibu zaidi na Kigiriki.
  alternative: “Saa yao itakapofika, myakumbuke, kwamba niliwaambia,” au tafsiri isiyotaja “yao” kwa sababu ya tofauti za maandishi.
  rationale: Maandishi ya SBLGNT yana αὐτῶν mara mbili, lakini kuyawakilisha yote wazi katika matini kuu kunaleta Kiswahili kisicho laini na kunaweza kulazimisha rejeo lisilo hakika. Tafsiri kuu inahifadhi “yao” ya kwanza na tanbihi inalinda ugumu na utata wa muundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Saa yao” imedumishwa badala ya “wakati wao” ili kuhifadhi taswira ya Yohana na utata wa matini chanzi.
