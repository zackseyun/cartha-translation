id: JHN.16.1
reference: John 16:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: sw
  text: Nimewaambia mambo haya ili msije mkajikwaa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkaanguka katika imani,” “mkakwazwa,” au “mkachukizwa.” Kitenzi cha Kigiriki kinaweza kumaanisha kutiwa kikwazo kinachomfanya mtu ayumbe au aiache imani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: mambo haya
  rationale: Kiashiria hiki cha wingi wa kati kinarejelea maneno yaliyotangulia ya Yesu; “mambo haya” huhifadhi wingi na ni Kiswahili cha kawaida.
- source_word: λελάληκα
  choice: nimewaambia
  rationale: Kauli ya wakati timilifu inaonyesha kwamba Yesu amekwisha kuwaambia na maneno hayo yana umuhimu wa sasa. “Nimewaambia” ni ya asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno “nimesema kwenu,” huku ikihifadhi maana.
- source_word: ὑμῖν
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” kinaonyesha wazi kwamba wanaoambiwa ni watu wengi.
- source_word: ἵνα μὴ
  choice: ili msije
  rationale: “Ili” huhifadhi kusudi, na muundo “msije” huonyesha kusudi la kuzuia jambo lisitokee kwa Kiswahili cha kawaida.
- source_word: σκανδαλισθῆτε
  choice: mkajikwaa
  rationale: “Kujikwaa” huhifadhi taswira ya kitenzi cha Kigiriki ya kutiwa kikwazo na kuanguka, bila kuamua kimya kimya kwamba maana yake lazima iwe kuasi kabisa. Katika muktadha huu inaweza kumaanisha kuyumba au kuanguka katika imani; ufafanuzi huo umetolewa katika tanbihi.
theological_decisions:
- issue: Maana ya σκανδαλισθῆτε katika muktadha wa uanafunzi na mateso
  choice: msije mkajikwaa
  alternative: msije mkaacha imani; msije mkakwazwa; msije mkachukizwa
  rationale: Onyo linalofuata linahusu mateso, kwa hiyo kitenzi kinaweza kuashiria kuyumba au kuanguka katika imani, si kuchukizwa kihisia tu. Hata hivyo, “mkaacha imani” ingefunga maana kuliko Kigiriki chenyewe. “Mkajikwaa” huhifadhi taswira na uzito wa onyo, huku tanbihi ikionyesha upana wake wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa kawaida; “nimewaambia” huunganisha kitenzi na yambwa kwa ufasaha, na “msije mkajikwaa” huhifadhi taswira pamoja na utata halisi wa chanzo.
