base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: sw
  text: Wanafunzi wake wakasema, “Tazama, sasa unasema waziwazi, na hutumii usemi wowote wa mafumbo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usemi wa mfano,” “methali,” au “usemi uliofichika.” Neno la Kigiriki linaweza kutaja usemi wa mfano au usio wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: wakasema
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati uliopita wa masimulizi, ulio wa asili katika Kiswahili.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Wanafunzi wake
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa umilikaji.
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni neno la kuvuta fikira; “Tazama” lina heshima na linaeleweka katika Kiswahili cha sasa.
- source_word: νῦν
  choice: sasa
  rationale: Linadumisha rejeo la wakati na wazo la mabadiliko ambayo wanafunzi walidhani wameyaona.
- source_word: ἐν παρρησίᾳ
  choice: waziwazi
  rationale: Katika muktadha huu linatofautishwa na usemi wa mafumbo, hivyo maana kuu ni kusema kwa uwazi badala ya kusema kwa njia isiyo ya moja kwa moja.
- source_word: λαλεῖς
  choice: unasema
  rationale: Wakati uliopo unaonyesha namna Yesu anavyosema wakati huo; “unasema” ni ya asili katika Kiswahili.
- source_word: παροιμίαν
  choice: usemi ... wa mafumbo
  rationale: Katika muktadha wa Yohana neno hili linaweza kumaanisha usemi wa mfano, fumbo, au usemi uliofichika, si methali tu.
- source_word: οὐδεμίαν
  choice: wowote
  rationale: Pamoja na ukanushaji “hu-,” linaonyesha kwamba hatumii usemi wa aina hiyo hata mmoja.
- source_word: λέγεις
  choice: hutumii
  rationale: Ingawa maana ya moja kwa moja ni “unasema,” Kiswahili cha kawaida husema “kutumia usemi”; maana ya sentensi inadumishwa bila tafsiri ngumu.
theological_decisions:
- issue: Maana ya ἐν παρρησίᾳ ikilinganishwa na παροιμίαν
  choice: Yesu anaelezwa kuwa anasema waziwazi badala ya kutumia usemi wa mafumbo au usio wa moja kwa moja.
  alternative: Yesu anasema kwa ujasiri au kwa uhuru.
  rationale: Ulinganisho wa moja kwa moja na kutotumia παροιμία unapendelea uwazi wa namna ya kujieleza kuliko ujasiri; tafsiri haiongezi dai la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakasema” linaendeleza masimulizi kwa kawaida; “waziwazi” na “usemi wa mafumbo” vinaweka wazi tofauti ya kimaana bila kuondoa upana wa neno la Kigiriki. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
