base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: sw
  text: Kwa hiyo walikuwa wakisema[a], “Hii ni nini anachosema, ‘Muda mfupi’? Hatujui anachosema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walisema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakiulizana
  rationale: Kauli isiyokamilika inaonyesha mazungumzo yaliyokuwa yakiendelea au kurudiwa. Katika muktadha wanafunzi wanasemezana kwa kuuliza; ‘walikuwa wakiulizana’ ni Kiswahili cha asili, huku tanbihi ikihifadhi tafsiri pana zaidi ya kitenzi.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huunganisha mazungumzo haya na mshangao uliotokana na maneno yaliyotangulia, bila kufanya kiungo hicho kuwa kizito.
- source_word: Τί ἐστιν τοῦτο
  choice: Ni nini hii
  rationale: Huhifadhi muundo wa swali la Kigiriki na hali ya kutokuelewa, badala ya kulifasiri moja kwa moja kuwa ‘Hii ina maana gani?’
- source_word: ὃ λέγει μικρόν
  choice: anayosema, ‘Muda mfupi’
  rationale: Hutaja usemi wenyewe kama nukuu na kuweka mkazo kwenye maneno yaliyowatatiza wanafunzi.
- source_word: μικρόν
  choice: Muda mfupi
  rationale: Katika muktadha huu neno limetumiwa kwa maana ya kipindi kifupi; ‘muda mfupi’ ni wazi na la kawaida katika Kiswahili.
- source_word: οὐκ οἴδαμεν
  choice: Hatujui
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ukanushi wenye maana ya hali ya sasa.
- source_word: τί λαλεῖ
  choice: anachosema
  rationale: Hufuata maana ya msingi ya λαλεῖ kwa ukaribu na huepuka kuamua kimyakimya kuwa tatizo lao lilikuwa maana iliyokusudiwa badala ya maneno yaliyosemwa.
