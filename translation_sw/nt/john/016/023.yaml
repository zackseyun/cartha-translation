  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: sw
  text: Na siku hiyo hamtaniuliza jambo lolote.[a] Amin, amin, nawaambia, chochote mtakachomwomba Baba katika jina langu,[b] atawapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kinatumia vitenzi viwili tofauti: kwanza ἐρωτάω, hapa ‘kuuliza,’ kumhusu Yesu; kisha αἰτέω, hapa ‘kuomba,’ kumhusu Baba.'
    reason: lexical_alternative
  - marker: b
    text: 'Au, kwa kuunganisha kirai hicho na maneno yanayofuata: “chochote mtakachomwomba Baba, atawapa katika jina langu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: siku hiyo
  rationale: Ni usemi wa kawaida wa wakati katika Kiswahili na unadumisha rejeo la siku ambayo Yesu ameizungumzia.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: hamtaniuliza jambo lolote
  rationale: Kitenzi ‘kuuliza’ kinafaa kwa ἐρωτάω katika muktadha wa kumwuliza Yesu maswali, huku kiwakilishi cha yambwa ‘-ni-’ kikihifadhi ἐμέ.
- source_word: ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Mkopo huu umezoeleka katika Kiswahili cha Biblia na unahifadhi marudio yenye mkazo yaliyo tabia ya Injili ya Yohana.
- source_word: ἄν τι αἰτήσητε τὸν πατέρα
  choice: chochote mtakachomwomba Baba
  rationale: ‘Chochote’ kinawasilisha upeo usioainishwa wa ἄν τι, na ‘kumwomba’ linaonyesha ombi linaloelekezwa kwa Baba, tofauti na ‘kuniuliza’ katika kishazi cha kwanza.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Kiswahili hutumia ‘Baba’ kwa kawaida kama jina la cheo katika rejeo hili; hakuna kiwakilishi ‘yangu’ kilichoongezwa kwa kuwa hakipo katika Kigiriki.
- source_word: δώσει ὑμῖν
  choice: atawapa
  rationale: Muundo wa Kiswahili unaonyesha wazi mtendaji na wapokeaji, huku kitu kitakachotolewa kikieleweka kutokana na ‘chochote’ katika kishazi kilichotangulia.
- source_word: ἐν τῷ ὀνόματί μου
  choice: katika jina langu
  rationale: Huu ni usemi wa Kiyohana unaotambulika na unaacha maana yake ya uwakilishi na uhusiano wazi bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Tofauti kati ya ἐρωτάω kwa Yesu na αἰτέω kwa Baba
  choice: Kutumia ‘kuniuliza’ kwa Yesu na ‘kumwomba’ kwa Baba
  alternative: Kutumia ‘kuomba’ au ‘kuuliza’ kwa vitenzi vyote viwili
  rationale: 'Kiswahili kinaweza kudumisha kwa njia ya kawaida tofauti ya kileksia iliyopo katika Kigiriki: cha kwanza kinaelekea kwenye kuuliza swali, na cha pili kwenye kutoa ombi.'
- issue: Upeo wa ahadi ya maombi katika jina la Yesu
  choice: Kuitafsiri ahadi moja kwa moja bila kuongeza masharti
  alternative: Kuongeza kwamba maombi lazima yapatane na mapenzi ya Yesu
  rationale: Masharti hayo yanaweza kujadiliwa kutokana na muktadha mpana wa Yohana, lakini hayajasemwa wazi katika mstari huu; tafsiri inadumisha mvutano wa tamko lenyewe.
- issue: Uhusiano wa ‘katika jina langu’ na vishazi vinavyoizunguka
  choice: Kuiunganisha katika matini kuu na tendo la kumwomba Baba
  alternative: Kuiunganisha na ‘atawapa,’ yaani, ‘atawapa katika jina langu’
  rationale: Mpangilio na matumizi ya Kiyohana yanaunga mkono kwa nguvu uhusiano na ombi, lakini nafasi ya kirai katika Kigiriki inaruhusu kwa kiwango fulani uunganishaji mwingine; huo umeandikwa katika tanbihi bila kuuficha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Tofauti ya ‘kuuliza’ na ‘kuomba’ inadumisha tofauti ya vitenzi vya Kigiriki kwa njia ya kawaida. ‘Amin, amin’ imehifadhiwa kwa sababu ni usemi wa kibiblia unaojulikana na marudio yake yana uzito wa kifasihi katika Yohana.
