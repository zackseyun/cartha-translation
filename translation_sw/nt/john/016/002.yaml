  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: sw
  text: Watawatenga kutoka katika masinagogi[a]. Naam, saa inakuja ambapo kila atakayewaua atadhani kwamba anamtolea Mungu ibada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watawafukuza katika sinagogi” au “watawaondoa katika jumuiya za masinagogi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “anatoa ibada kwa Mungu” au “anamtendea Mungu huduma ya kidini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους
  choice: watawatenga na masinagogi
  rationale: Kivumishi hiki humaanisha kufukuzwa au kutengwa na jumuiya ya sinagogi. Kauli hii ni ya kawaida katika Kiswahili na inahifadhi wazo la kutengwa kijamii na kidini; wingi wa masinagogi unaakisi umbo la Kigiriki.
- source_word: ποιήσουσιν ὑμᾶς
  choice: watawatenga
  rationale: Muundo wa ποιέω pamoja na kivumishi cha kiarifu una nguvu ya kusababisha hali fulani. Katika Kiswahili, kitenzi ‘kutenga’ kinawasilisha matokeo hayo kwa kawaida bila kulazimisha muundo wa neno kwa neno.
- source_word: ἀλλ’
  choice: Naam
  rationale: Hapa kiunganishi kinaongeza uzito wa onyo linalofuata kuliko kuonyesha upinzani wa kawaida tu. ‘Naam’ ni mpito wa heshima unaofaa kwa msisitizo huo.
- source_word: ἔρχεται ὥρα
  choice: saa inakuja
  rationale: Tafsiri hii inahifadhi nahau ya Kiyohana na taswira ya ὥρα badala ya kuifafanua kuwa ‘wakati.’
- source_word: ἵνα
  choice: ambapo
  rationale: Baada ya ‘saa inakuja,’ ἵνα hutambulisha yaliyomo katika saa hiyo. ‘Ambapo’ ni muundo wa kawaida wa Kiswahili unaobeba uhusiano huo wa wakati na tukio.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: kila atakayewaua
  rationale: ‘Kila’ huhifadhi nguvu ya jumla ya πᾶς, na umbo la umoja la mtendaji huhifadhi muundo wa Kigiriki. Kiambishi -wa- katika ‘kuwaua’ kinaonyesha kuwa wanaouawa ni wengi.
- source_word: δόξῃ
  choice: atafikiri
  rationale: δοκέω hapa inaonyesha imani au dhana ya mtendaji mwenyewe. ‘Atafikiri’ ni sawa ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: λατρείαν
  choice: ibada
  rationale: Neno hili linahusu huduma ya kidini inayotolewa kwa Mungu. ‘Ibada’ huwasilisha muktadha wa kidini kwa uwazi, huku tanbihi ikihifadhi maana mbadala ya huduma ya kidini.
- source_word: προσφέρειν
  choice: anamtolea
  rationale: Kitenzi hiki kina maana ya kuwasilisha au kutoa kitu kwa Mungu. ‘Anamtolea’ huhifadhi mwelekeo wa tendo na mwangwi wa kutoa toleo.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Katika muundo ‘anamtolea Mungu,’ nomino hii inaonyesha kwa kawaida mpokeaji wa tendo, sawa na uhusiano wa dative katika Kigiriki.
theological_decisions:
- issue: Kuwasilisha jinsi watesi wanavyoelewa tendo lao kwa lugha ya kidini
  choice: anamtolea Mungu ibada
  alternative: anamtolea Mungu huduma ya kidini
  rationale: Kigiriki kinawaonyesha wauaji wakidhani kuwa mauaji yao ni tendo halali la kujitoa kwa Mungu. Tafsiri inahifadhi kinaya hicho cha kutisha bila kukipunguza wala kudokeza kuwa Mungu anakikubali.
- issue: Jinsia na umoja katika πᾶς ὁ ἀποκτείνας
  choice: kila atakayewaua atafikiri
  alternative: yeyote atakayewaua atafikiri
  rationale: Kiswahili hakihitaji kiwakilishi cha jinsia katika sentensi hii. Umbo la umoja la mtendaji limehifadhiwa bila kuongeza jinsia ambayo haihitajiki kisarufi, na ‘kila’ linaendeleza maana ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Naam’ inaongeza uzito wa onyo linalofuata; ‘masinagogi’ ni istilahi inayoeleweka na inahifadhi wingi wa maandishi chanzi. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
