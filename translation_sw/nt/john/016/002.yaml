- from: Watawatenga na masinagogi[a]. Naam, saa inakuja ambapo kila atakayewaua atafikiri kuwa anamtolea Mungu ibada[b].
  to: Watawatenga kutoka katika masinagogi[a]. Naam, saa inakuja ambapo kila atakayewaua atadhani kwamba anamtolea Mungu ibada[b].
  rationale: The revision makes synagogue exclusion explicit in idiomatic Swahili, slightly sharpens the subjective and erroneous sense of δοκέω with “atadhani kwamba,” and revises footnote b so that its alternatives correspond to the complete cultic phrase without altering its meaning.
