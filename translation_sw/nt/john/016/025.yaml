  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: sw
  text: Nimewaambia mambo haya kwa lugha ya mafumbo[a]. Saa inakuja[b] ambapo sitawaambia tena kwa lugha ya mafumbo, bali nitawaeleza waziwazi[c] kuhusu Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mifano” au “kwa maneno yenye maana iliyofichika”; neno la Kigiriki hapa linahusu usemi wa mfano au usio wa moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Au, “Wakati unakuja.” Mara nyingi Yohana hutumia “saa” ikiwa na umuhimu wa kitheolojia.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa uwazi” au “kwa kusema bila kuficha”; hapa maana yake ni kusema moja kwa moja, bila mafumbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: kwa lugha ya mafumbo
  rationale: Katika matumizi ya Yohana, neno hili linaonyesha usemi wa mfano au usio wa moja kwa moja, si lazima mfano wa hadithi kwa maana ya kitaalamu. “Lugha ya mafumbo” ni ya kawaida na inadumisha wazo la maana iliyofichika kwa kiasi.
- source_word: λελάληκα
  choice: Nimewaambia
  rationale: Wakati timilifu wa Kigiriki unaonyesha maneno yaliyokwisha kusemwa lakini yenye umuhimu wa sasa. “Nimewaambia” ni Kiswahili cha asili kinachofaa kwa kitu kinachoelekezwa kwa wasikilizaji.
- source_word: ἔρχεται ὥρα
  choice: Saa inakuja
  rationale: Tafsiri hii inadumisha taswira ya “saa” ambayo ina uzito maalumu katika Injili ya Yohana, huku ikibaki kueleweka katika Kiswahili cha sasa.
- source_word: οὐκέτι
  choice: tena
  rationale: Katika muundo hasi “sitasema ... tena,” neno hili linaeleza kwa kawaida na kwa usahihi maana ya kutofanya jambo hilo kuanzia wakati huo.
- source_word: λαλήσω
  choice: sitasema nanyi
  rationale: Muundo huu unadumisha tendo la kuzungumza na wanafunzi na unaingia vizuri katika sentensi ya Kiswahili.
- source_word: παρρησίᾳ
  choice: waziwazi
  rationale: Hapa neno hili linatofautishwa na lugha ya mafumbo; kwa hiyo maana kuu ni kusema kwa uwazi na moja kwa moja, si ujasiri wa hadharani.
- source_word: ἀπαγγελῶ
  choice: nitawaeleza
  rationale: Katika muktadha huu Yesu anaahidi kuwafunulia kwa njia ya moja kwa moja habari zinazomhusu Baba. “Nitawaeleza” ni ya asili kuliko “nitawatangazia” katika muundo huu.
- source_word: περὶ τοῦ πατρὸς
  choice: kuhusu Baba
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida, na herufi kubwa katika “Baba” inadumisha rejeo maalumu kwa Mungu.
theological_decisions:
- issue: Maana ya ὥρα katika muktadha wa Yohana
  choice: Saa inakuja
  alternative: Wakati unakuja
  rationale: “Saa” inadumisha msamiati na mwangwi wa kitheolojia wa Yohana bila kuamua kwamba hapa lazima pawe na saa fulani iliyotajwa tayari.
- issue: Maana ya παρρησίᾳ inapolinganishwa na ἐν παροιμίαις
  choice: waziwazi
  alternative: kwa uwazi; kwa uhuru
  rationale: Mlinganisho wa mstari huu unahusu lugha isiyo ya moja kwa moja dhidi ya maelezo ya moja kwa moja. “Waziwazi” inadumisha mlinganisho huo bila kuingiza hasa wazo la ujasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Lugha ya mafumbo” na “waziwazi” huunda mlinganisho wa asili na unaoeleweka; “Saa inakuja” inadumisha mtindo wa Yohana ingawa ni wa kibiblia zaidi kuliko usemi wa kawaida.
