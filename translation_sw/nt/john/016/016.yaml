  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: sw
  text: Baada ya muda mfupi hamtaniona tena; na baada ya muda mfupi tena mtaniona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μικρὸν
  choice: kitambo kidogo
  rationale: Kivumishi hiki cha Kiyunani kimetumiwa kielezi kumaanisha muda mfupi. “Kitambo kidogo” ni Kiswahili cha kawaida kinachohifadhi wazo la muda mfupi bila kulifanya tu kuwa “karibuni.”
- source_word: οὐκέτι
  choice: hamtaniona tena
  rationale: οὐκέτι huonyesha kwamba jambo halitaendelea. Katika Kiswahili maana ya “hamtaniona tena” ni ya asili na inaunganisha kikanushi na kitenzi.
- source_word: θεωρεῖτέ
  choice: mtaniona
  rationale: Ingawa θεωρέω inaweza kuwa na maana ya kutazama au kuchunguza, hapa “kuona” ni tafsiri wazi na ya kawaida. Wakati wa sasa wa Kiyunani unaelekezwa kwa hali iliyo karibu sana kutokana na usemi wa muda, hivyo wakati ujao ni wa asili katika Kiswahili.
- source_word: πάλιν
  choice: tena
  rationale: “Tena” huhifadhi wazo la kurudia au kugeuka kwa hali baada ya muda.
- source_word: ὄψεσθέ
  choice: mtaniona
  rationale: Umbo la wakati ujao la ὁράω hapa humaanisha kuona baadaye. Kutumia pia “kuona” huhifadhi ulinganifu bila kulazimisha tofauti ya kiteolojia kati ya vitenzi viwili.
- source_word: με
  choice: -ni- katika “mtaniona”
  rationale: Kiwakilishi cha yambwa kinachomrejelea Yesu huwasilishwa kwa kiambishi cha yambwa “-ni-” ndani ya kitenzi cha Kiswahili.
- source_word: καὶ
  choice: nanyi; kisha tena
  rationale: Viunganishi vimetafsiriwa kwa namna ya asili katika Kiswahili huku mpangilio wa vipashio viwili ukihifadhiwa. “Kisha” huweka wazi mfuatano ambao muktadha wa καὶ unaruhusu.
theological_decisions:
- issue: Iwapo θεωρέω na ὁράω zitofautishwe kwa vitenzi tofauti vya Kiswahili ili kudokeza namna tofauti za kuona
  choice: Zote zimetafsiriwa kwa kitenzi “kuona” katika matini kuu
  alternative: “hamtanitazama tena ... mtaniona” au “hamtaniona tena ... mtanitazama”
  rationale: Vitenzi hivi viwili vya Kiyunani vina mwingiliano mkubwa wa maana katika matumizi ya Yohana. Kuvitofautisha kwa nguvu katika Kiswahili kungeweza kuingiza tofauti ya kiteolojia isiyothibitishwa na mstari. Tofauti kuu inayosisitizwa ni ya wakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umehifadhi urari wa usemi wa Yesu, huku “kitambo kidogo” ikitumika kwa maana ya muda mfupi.
