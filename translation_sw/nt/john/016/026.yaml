base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: sw
  text: Siku hiyo mtaomba kwa jina langu, na siwaambii kwamba nitamwomba Baba kuhusu ninyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “kwa ajili yenu” au “kwa niaba yenu.” Kigiriki kinatumia vitenzi viwili tofauti vinavyoweza kutafsiriwa “kuomba” katika mstari huu: αἰτέω kwa wanafunzi wanapoomba, na ἐρωτάω Yesu anapomwomba Baba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Siku hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wakati na kudumisha msisitizo wa kiashiria ἐκείνῃ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Huu ni usemi wa kawaida wa Kibiblia katika Kiswahili unaohifadhi uhusiano na nafsi na mamlaka ya Yesu bila kuufafanua kupita kiasi.
- source_word: αἰτήσεσθε
  choice: mtaomba
  rationale: Katika muktadha wa sala, ‘kuomba’ ni kitenzi cha asili na kinaonyesha nafsi ya pili wingi pamoja na wakati ujao.
- source_word: οὐ λέγω ὑμῖν
  choice: wala siwaambii
  rationale: Huhifadhi wakati wa sasa na hufanya muunganiko wa sentensi kuwa wa asili katika Kiswahili.
- source_word: ἐρωτήσω
  choice: nitamwomba
  rationale: ‘Kuomba’ linafaa kwa ombi analolielekeza Yesu kwa Baba; tofauti na αἰτέω imeelezwa katika tanbihi badala ya kulazimisha maneno yasiyo ya asili.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Huhifadhi jina la kimahusiano la Kiyohana bila kuongeza kimilikishi kisichopo katika Kigiriki.
- source_word: περὶ ὑμῶν
  choice: kwa ajili yenu
  rationale: Katika muktadha huu περί pamoja na hali ya umilikishi inaweza kuonyesha ombi linalowahusu au linalofanywa kwa niaba yao; ‘kwa ajili yenu’ ni Kiswahili cha asili, huku maana pana ikibainishwa katika tanbihi.
theological_decisions:
- issue: Iwapo Yesu anakataa kabisa jukumu lolote la baadaye la kuwaombea wanafunzi
  choice: Kauli imetafsiriwa kama jambo ambalo Yesu hasemi hapa, bila kudai kwamba hatawaombea kamwe.
  alternative: Kutafsiri kwa ufafanuzi kwamba Yesu hatawaombea hata kidogo, au kwamba wanafunzi hawahitaji kabisa upatanishi wake.
  rationale: Muktadha unasisitiza kuwa wanafunzi watamwomba Baba kwa jina la Yesu, lakini kifungu hiki peke yake hakipaswi kulazimishwa kutatua mvutano na vifungu vingine vinavyozungumzia utetezi au maombezi ya Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; tanbihi imewekwa baada ya kirai kinachohusika na inahifadhi tofauti ya kileksika pamoja na upana wa περί.
