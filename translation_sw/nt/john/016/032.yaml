base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: sw
  text: Tazama, saa inakuja, nayo tayari imefika, ambayo katika hiyo mtatawanyika, kila mmoja kwa yaliyo yake[a], na kuniacha peke yangu. Lakini siko peke yangu, kwa sababu Baba yuko pamoja nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mmoja nyumbani kwake,” “mahali pake,” au “kwenye mambo yaliyo yake.” Kigiriki kina maana pana kuliko mahali maalumu tu; kinaweza kurejelea kwa ujumla mambo au vitu vya kila mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Neno hili linaelekeza usikivu kwa tangazo zito la Yesu, huku likibaki la kawaida na lenye heshima katika Kiswahili cha sasa.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: saa inakuja, nayo imefika
  rationale: 'Huhifadhi mvutano wa kitenzi cha wakati uliopo na timilifu: wakati huo uko karibu, lakini kwa namna fulani tayari umefika. “Saa” hapa ni wakati maalumu, si lazima dakika sitini.'
- source_word: ἵνα
  choice: mtakapotawanyika
  rationale: Katika muundo huu ἵνα hutambulisha jambo litakalotokea wakati huo. Umbo la “-kapo-” linaeleza wakati na matokeo kwa Kiswahili cha kawaida bila kulazimisha maana ya kusudi.
- source_word: σκορπισθῆτε
  choice: mtakapotawanyika
  rationale: “Kutawanyika” huwasilisha hali ya wanafunzi kutenganishwa na kwenda kila mmoja upande wake; wakati ujao unaonyesha tukio linalotarajiwa.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: kila mmoja akienda kwake mwenyewe[a]
  rationale: Kauli hii ya Kiswahili huhifadhi msisitizo wa mgawanyo wa kila mtu mmoja mmoja. Tanbihi inadumisha upana wa τὰ ἴδια, ambayo haimaanishi nyumba pekee.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: na kuniacha peke yangu
  rationale: Huwasilisha kwa uwazi kuachwa kwa Yesu bila kuongeza nguvu ya maana kama “kunitelekeza kabisa.”
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Lakini siko peke yangu
  rationale: “Lakini” huonyesha kwa kawaida tofauti kati ya kuachwa na wanafunzi na kutokuwa peke yake kwa sababu ya uwepo wa Baba.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: kwa sababu Baba yuko pamoja nami
  rationale: Huhifadhi sababu iliyotolewa na Yesu pamoja na cheo cha uhusiano, “Baba,” bila kuongeza hitimisho la kiteolojia lisilotajwa.
theological_decisions:
- issue: Upana wa maana ya ἕκαστος εἰς τὰ ἴδια
  choice: kila mmoja akienda kwake mwenyewe[a]
  alternative: kila mmoja akienda nyumbani kwake
  rationale: Tafsiri haifungi maana kuwa nyumba tu; tanbihi inaacha wazi kwamba maneno hayo yanaweza kurejelea mahali, nyumba, mali, au mambo ya kila mmoja.
- issue: Uhusiano kati ya kuachwa na wanafunzi na uwepo wa Baba
  choice: Lakini siko peke yangu, kwa sababu Baba yuko pamoja nami
  alternative: Nami siko peke yangu, kwa maana Baba yuko pamoja nami
  rationale: 'Tafsiri huhifadhi mvutano uliomo katika mstari: wanafunzi watamwacha Yesu peke yake, lakini yeye si peke yake kwa sababu Baba yuko pamoja naye. Haiongezi maelezo ya kimadhehebu kuhusu uhusiano huo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “saa inakuja, nayo imefika” umehifadhi kwa makusudi mvutano wa wakati unaokaribia na ambao tayari umefika.
