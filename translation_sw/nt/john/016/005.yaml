  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: sw
  text: Lakini sasa ninaenda kwa yule aliyenituma, na hakuna hata mmoja wenu anayeniuliza, “Unaenda wapi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Lakini sasa
  rationale: Inahifadhi tofauti ya kimawazo inayoletwa na δέ na kuonyesha mpito wa kawaida katika Kiswahili.
- source_word: ὑπάγω
  choice: ninaenda
  rationale: Wakati uliopo una maana ya mwendo unaoendelea au unaokaribia; “ninaenda” ni ya kawaida na hudumisha wazo la kuelekea mahali fulani.
- source_word: πρὸς τὸν πέμψαντά με
  choice: kwa yule aliyenituma
  rationale: Inatafsiri kirai cha kisifa chenye kibainishi kwa njia ya asili bila kuongeza wazi kwamba anayelengwa ni Baba.
- source_word: πέμψαντά
  choice: aliyetuma
  rationale: Kitenzi “tuma” kinadumisha lugha ya utume iliyo muhimu katika Yohana bila tafsiri ya ziada kama “aliyetuma kwa agizo maalumu.”
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: hakuna hata mmoja wenu
  rationale: Inabeba ukanushi wenye msisitizo na maana ya sehemu ya kundi kwa Kiswahili cha kawaida.
- source_word: ἐρωτᾷ με
  choice: anayeniuliza
  rationale: Katika muktadha huu kitenzi kinamaanisha kuuliza swali; “anayeniuliza” ni wazi na ya kawaida.
- source_word: Ποῦ ὑπάγεις;
  choice: Unaenda wapi?
  rationale: Ni swali la kawaida la Kiswahili linalohifadhi maana ya mwendo ya ὑπάγω.
theological_decisions:
- issue: Utambulisho wa “yule aliyenituma”
  choice: kwa yule aliyenituma
  alternative: kwa Baba aliyenituma
  rationale: Kigiriki hakimtaji Baba wazi katika kishazi hiki. Tafsiri inadumisha namna ya jumla ya chanzo badala ya kuingiza utambulisho wa kitheolojia ambao unaeleweka katika muktadha mpana wa Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Wala” linaendeleza kwa kawaida kishazi hasi baada ya kauli yenye tofauti; “hata mmoja” huhifadhi msisitizo wa οὐδεὶς.
