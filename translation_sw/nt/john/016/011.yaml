  yaml_path: translation/nt/john/016/011.yaml
  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: sw
  text: na kuhusu hukumu, kwa sababu mtawala wa ulimwengu huu[a][b] amehukumiwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘mkuu wa ulimwengu huu.’
    reason: lexical_alternative
  - marker: b
    text: Huenda hii inamhusu Shetani; linganisha Yohana 12:31 na 14:30.
    reason: cross_reference
  - marker: c
    text: Au ‘yuko chini ya hukumu.’ Kauli timilifu ya Kigiriki inasisitiza hukumu iliyokamilika ambayo athari yake inaendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: na kuhusu hukumu
  rationale: περί pamoja na jenitivi hutambulisha mada, hivyo ‘kuhusu’ ni ya moja kwa moja na ya kawaida; δέ inaendeleza mfululizo na imewakilishwa kwa ‘na’; κρίσις limetafsiriwa ‘hukumu’ ili kudumisha mfuatano wa ‘dhambi ... haki ... hukumu.’
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inaanzisha sababu inayoeleza kwa nini Roho anathibitisha habari ya hukumu; ‘kwa sababu’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ὁ ἄρχων
  choice: mtawala
  rationale: ἄρχων humaanisha mwenye kutawala au kutumia mamlaka. ‘Mtawala’ ni wazi na halazimishi wazo la ukoo wa kifalme linaloweza kuhusishwa na ‘mwana-mfalme.’
- source_word: τοῦ κόσμου τούτου
  choice: wa ulimwengu huu
  rationale: κόσμος katika Yohana kwa kawaida ni ‘ulimwengu,’ na hapa kirai hiki kinaonyesha eneo la mamlaka ya huyo mtawala bila kulibadili kuwa ‘zama hizi.’
- source_word: κέκριται
  choice: amehukumiwa
  rationale: Hii ni kauli timilifu tendwa ya κρίνω. ‘Amehukumiwa’ huhifadhi sauti tendwa na huonyesha tendo lililokamilika ambalo matokeo yake yanaendelea, bila kulifinya moja kwa moja kuwa ‘ametiwa hatiani.’
theological_decisions:
- issue: Utambulisho na maana ya ‘mtawala wa ulimwengu huu’
  choice: Kuhifadhi cheo hicho bila kumtaja Shetani moja kwa moja katika matini kuu.
  alternative: ‘Shetani, mtawala wa ulimwengu huu’
  rationale: Katika Injili ya Yohana kirai hiki kinaeleweka sana kumhusu Shetani (linganisha Yohana 12:31; 14:30), lakini mstari wenyewe unatumia cheo badala ya jina. Matini kuu kwa hiyo haiongezi utambulisho ambao haujasemwa wazi.
- issue: Maana ya κέκριται
  choice: ‘amehukumiwa’
  alternative: ‘ametiwa hatiani’ au ‘yuko chini ya hukumu’
  rationale: Tafsiri hii huhifadhi upana wa κρίνω pamoja na hali ya tendo lililokamilika lenye matokeo yanayoendelea. ‘Ametiwa hatiani’ huifanya maana kuwa finyu zaidi, ingawa muktadha unaweza kudokeza hukumu ya hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na unaendeleza mfululizo wa mstari uliotangulia; ‘mtawala’ ni wa kawaida kuliko ‘mwana-mfalme,’ na ‘amehukumiwa’ huhifadhi maana pana pamoja na hali timilifu.
