base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: sw
  text: Kwa hiyo, ninyi pia sasa mna huzuni; lakini nitawaona tena[a], na mioyo yenu itafurahi, wala hakuna mtu atakayewanyang'anya furaha yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtaniona tena.” Kigiriki hapa kinasema kihalisi zaidi, “nitawaona tena,” jambo linaloweza kukazia kwamba Yesu ndiye anayechukua hatua ya kurudi kwa wanafunzi wake.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vivyo hivyo
  rationale: Inaonyesha kwamba maneno haya yanatumia mfano wa uchungu wa kuzaa katika mstari uliotangulia kwa hali ya wanafunzi; ni kiunganishi cha kawaida na wazi katika Kiswahili.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: mna huzuni sasa
  rationale: Neno λύπη lina maana ya huzuni, majonzi, au dhiki. Muundo huu ni wa kawaida katika Kiswahili, na tofauti inayoletwa na δέ baadaye inawakilisha kazi ya μέν bila kuongeza neno lisilo la lazima.
- source_word: πάλιν δὲ
  choice: lakini ... tena
  rationale: Neno δέ linaonyesha tofauti kati ya huzuni ya sasa na kukutana tena, huku πάλιν likionyesha kurudiwa kwa kuonana.
- source_word: ὄψομαι ὑμᾶς
  choice: nitawaona
  rationale: Kigiriki kinamtaja Yesu kama mtendaji wa kuona na wanafunzi kama watendewa. Tafsiri hii inalinda mpangilio huo badala ya kuugeuza kuwa ‘mtaniona.’
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: moyo wenu utafurahi
  rationale: Inahifadhi umoja wa ‘moyo’ katika Kigiriki pamoja na umilikishi wa wingi, unaoweza kueleweka kwa kawaida kama moyo wao kwa pamoja. ‘Utafurahi’ inadumisha nguvu ya kitenzi χαρήσεται.
- source_word: τὴν χαρὰν ὑμῶν
  choice: furaha yenu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai hiki, na inadumisha uhusiano wa kileksia na ‘utafurahi.’
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: wala hakuna mtu atakayewaondolea ... yenu
  rationale: ‘Kuwaondolea’ huwasilisha maana ya kuchukua kitu kutoka kwao. Wakati ujao unafaa katika Kiswahili kwa sababu sentensi nzima inaelekea kwenye furaha itakayofuata, ingawa Kigiriki kimetumia wakati wa sasa kwa kauli hii.
theological_decisions:
- issue: Mtendaji na msisitizo wa kuonana tena
  choice: nitawaona tena
  alternative: mtaniona tena
  rationale: Kigiriki kina nafsi ya kwanza kama kiima na wanafunzi kama yambwa. Kudumisha muundo huo huepuka kupatanisha mstari huu kimya kimya na Yohana 16:16 na kunaacha msisitizo unaowezekana wa Yesu mwenyewe kuchukua hatua ya kurudi kwa wanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘moyo wenu’ umehifadhi umoja wa Kigiriki huku ukieleweka kama moyo wa wanafunzi kwa pamoja; alama ya tanbihi [a] ipo katika matini kuu.
