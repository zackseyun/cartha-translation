- from: Vivyo hivyo, ninyi pia mna huzuni sasa; lakini nitawaona tena[a], na moyo wenu utafurahi, wala hakuna mtu atakayewaondolea furaha yenu.
  to: Kwa hiyo, ninyi pia sasa mna huzuni; lakini nitawaona tena[a], na mioyo yenu itafurahi, wala hakuna mtu atakayewanyang'anya furaha yenu.
  rationale: The revision improves the inferential connective, makes the final clause idiomatic and semantically exact in Swahili, and uses the natural plural expression for the disciples’ hearts. It retains the source-text subject-object relationship in “nitawaona tena,” the future-oriented audited rendering of the final clause, and the existing footnote anchor and alternative-reading note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'The principal clauses are accurately represented: the disciples have present sorrow, Jesus says that he will see them again, their hearts will rejoice, and their joy cannot be taken away. The future rendering in the final clause follows the audited contextual rendering, though Greek αἴρει is formally present. The proposed revision preserves this accepted contextual force.'
  naturalness: “Vivyo hivyo” is possible but is less direct than the inferential “Kwa hiyo” for οὖν. More importantly, “hakuna mtu atakayewaondolea furaha yenu” is understandable but less idiomatic and less precise for taking joy away from persons. “Atakayewanyang'anya furaha yenu” is natural Standard East African Swahili. “Mioyo yenu” is the normal idiomatic plural with a plural possessive in this context; the Greek singular is collective and need not be mechanically retained.
  terminology: “Huzuni,” “furaha,” and “nitawaona tena” are appropriate. The latter correctly retains Jesus as the subject, rather than harmonizing the wording to “mtaniona tena.”
  issues:
  - severity: low
    issue: The discourse connective is somewhat imprecise stylistically.
    rationale: Vivyo hivyo primarily means “likewise/in the same way,” whereas οὖν here draws an application or inference from the preceding analogy. “Kwa hiyo” more naturally expresses this connection.
  - severity: medium
    issue: The final verb is awkward for the sense of taking joy away.
    rationale: Although “kuwaondolea” can be understood, “atakayewanyang'anya furaha yenu” more clearly and idiomatically expresses that no one will deprive them of their joy.
  - severity: low
    issue: Singular “moyo wenu” is less idiomatic in this setting.
    rationale: Greek has a collective singular, but Swahili naturally uses “mioyo yenu” for the disciples’ individual yet shared response, without altering the meaning.
  revised_text: Kwa hiyo, ninyi pia sasa mna huzuni; lakini nitawaona tena[a], na mioyo yenu itafurahi, wala hakuna mtu atakayewanyang'anya furaha yenu.
  revised_footnotes:
  - marker: a
    text: Au, “mtaniona tena.” Kigiriki hapa kinasema kihalisi zaidi, “nitawaona tena,” jambo linaloweza kukazia kwamba Yesu ndiye anayechukua hatua ya kurudi kwa wanafunzi wake.
    reason: alternative_reading
  revision_rationale: The revision improves the inferential connective, makes the final clause idiomatic and semantically exact in Swahili, and uses the natural plural expression for the disciples’ hearts. It retains the source-text subject-object relationship in “nitawaona tena,” the future-oriented audited rendering of the final clause, and the existing footnote anchor and alternative-reading note.
