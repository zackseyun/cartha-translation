  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: sw
  text: Nao watafanya mambo haya kwa sababu hawajamjua Baba wala mimi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakumjua Baba wala mimi,” au “hawajapata kumjua Baba wala mimi.” Kitenzi cha Kigiriki hapa kinaweza kutafsiriwa kwa njia zaidi ya moja ya kawaida katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza moja kwa moja maneno yaliyotangulia; “Nao” ni cha kawaida na huunganisha sentensi kwa ufasaha.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Hudumisha wingi na kurejelea matendo ya uadui yaliyotajwa kabla.
- source_word: ποιήσουσιν
  choice: watafanya
  rationale: Ni kitenzi cha wakati ujao; “watafanya” kinaendana kwa kawaida na yambwa “mambo haya.”
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaonyesha sababu ya wao kufanya mambo hayo.
- source_word: οὐκ ἔγνωσαν
  choice: hawajamjua
  rationale: Kauli hii inaonyesha kutomjua kunakoendelea kuwa na matokeo sasa; “kumjua” pia hudumisha maana ya uhusiano, si kufahamu tu habari fulani.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Ni jina la cheo linalomrejelea Mungu katika uhusiano wake na Mwana, hivyo herufi kubwa inafaa.
- source_word: οὐδὲ ἐμέ
  choice: wala mimi
  rationale: “Wala” huunganisha kwa kawaida yambwa la pili chini ya ukanushi na kudumisha maana ya kutomjua Baba wala Yesu.
theological_decisions:
- issue: Lugha ya Yohana kuhusu kumjua Mungu na Yesu
  choice: hawajamjua Baba wala mimi
  alternative: hawakumjua Baba wala mimi; hawajapata kumjua Baba wala mimi
  rationale: Tafsiri inadumisha dai kwamba mateso yanatokana na kutokuwa na ujuzi wa kimahusiano wa Baba na Yesu, bila kulipanua kuwa ufafanuzi wa kimadhehebu. Umbo la Kigiriki linaweza kutafsiriwa kwa njia zaidi ya moja ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa urahisi. “Nao” huendeleza muktadha, huku “hawajamjua” ikihifadhi umuhimu wa sasa na maana ya kimahusiano ya kitenzi.
