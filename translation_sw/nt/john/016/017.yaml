id: JHN.16.17
reference: John 16:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: sw
  text: 'Basi baadhi ya wanafunzi wake wakaambiana, “Ni nini hiki anachotuambia: ‘Muda mfupi, nanyi hamtaniona; na tena muda mfupi, nanyi mtaniona’? Na, ‘Kwa sababu ninaenda kwa Baba’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwamba ninaenda kwa Baba.” Kiunganishi cha Kigiriki kinaweza kueleweka kuwa kinatanguliza yaliyosemwa au kuwa na maana ya kisababishi (“kwa sababu”).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huendeleza simulizi na kuonyesha kuwa maneno yao yanatokana na kauli iliyotangulia.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: baadhi ya wanafunzi wake
  rationale: Muundo wa sehemu unaonyesha kundi dogo kutoka miongoni mwa wanafunzi, si lazima wote.
- source_word: πρὸς ἀλλήλους
  choice: wakaambiana
  rationale: Kitenzi hiki cha Kiswahili huonyesha kwa kawaida kwamba walizungumza wao kwa wao.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Ana maana gani anapotuambia
  rationale: Ni Kiswahili cha kawaida kinachoeleza swali lao la kutofahamu huku kikihifadhi tendo la Yesu kusema nao.
- source_word: Μικρὸν
  choice: kitambo kidogo
  rationale: Katika muktadha huu neno hilo lina maana ya muda mfupi.
- source_word: θεωρεῖτέ με
  choice: hamtaniona
  rationale: Huleta maana ya kuona kwa uwazi na kudumisha ulinganifu wa kisanaa na ὄψεσθέ με.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: kisha tena kitambo kidogo, nanyi mtaniona
  rationale: Huhifadhi marudio ya muda mfupi na tofauti kati ya kutomwona na kumwona tena.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Kwa sababu ninaenda kwa Baba
  rationale: Huhifadhi maana ya kisababishi inayowezekana ya ὅτι na neno halisi 'Baba' bila kuongeza 'yangu'.
theological_decisions:
- issue: Kauli ya Yesu kuhusu kutowonekana na kuonekana tena inarejelea tukio gani
  choice: Haijafafanuliwa katika tafsiri
  alternative: Kifo na ufufuo; kupaa na kuwapo kiroho; au kuwatokea baada ya ufufuo
  rationale: Aya yenyewe inaonyesha mkanganyiko wa wanafunzi na haitambulishi wazi tukio linalokusudiwa.
- issue: Kazi ya ὅτι katika kifungu cha mwisho
  choice: 'Imetafsiriwa kwa maana ya kisababishi: “Kwa sababu”'
  alternative: 'Inaweza kutambulisha yaliyosemwa: “Kwamba ninaenda kwa Baba”'
  rationale: Sarufi na muktadha huruhusu maana zote mbili; tofauti hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kitambo kidogo” ni cha kawaida na kinaonyesha muda mfupi. Alama ya tanbihi [a] imewekwa baada ya swali lote kwa kuwa inahusu namna ya kuelewa kifungu chake cha mwisho.
