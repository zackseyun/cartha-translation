base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: sw
  text: Naye huyo atakapokuja, atauhakikishia ulimwengu kuhusu dhambi, kuhusu haki,[a] na kuhusu hukumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: atakapokuja
  rationale: Kauli ya wakati inaeleza tendo litakalotangulia tendo kuu; ‘atakapokuja’ ni Kiswahili cha kawaida na sahihi kwa muktadha.
- source_word: ἐκεῖνος
  choice: huyo
  rationale: Kiwakilishi kionyeshi cha mkazo kinarejelea Msaidizi aliyetajwa katika muktadha. ‘Huyo’ huhifadhi mkazo kuliko ‘yeye’ peke yake.
- source_word: ἐλέγξει
  choice: atauhakikisha ... kuwa umekosea
  rationale: Kitenzi kina wazo la kufichua kosa na kuthibitisha kwamba mhusika yuko katika makosa; msemo huu unaeleweka kwa Kiswahili na huhifadhi nguvu ya kimaadili na kimahakama.
- source_word: τὸν κόσμον
  choice: ulimwengu
  rationale: Huhifadhi upana na mwangwi wa matumizi ya Yohana bila kuifasiri waziwazi kuwa watu wote au mfumo wa ulimwengu.
- source_word: περὶ
  choice: kuhusu
  rationale: Neno limerudiwa mara tatu ili kudumisha ulinganifu wa vifungu vya Kigiriki.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: Tafsiri ya kawaida ya nomino hii; umoja umehifadhiwa kama katika Kigiriki.
- source_word: δικαιοσύνης
  choice: haki
  rationale: ‘Haki’ ni neno la kawaida la Kiswahili linaloweza kubeba maana za uadilifu na hali ya kuwa mwenye haki katika muktadha huu.
- source_word: κρίσεως
  choice: hukumu
  rationale: Huhifadhi maana pana ya kimahakama na ya mwisho bila kuibana kuwa adhabu au kuhukumiwa tu.
theological_decisions:
- issue: Mrejelewa na mkazo wa ἐκεῖνος
  choice: ‘huyo,’ likimrejelea Msaidizi/Roho katika muktadha
  alternative: ‘yeye,’ bila kuonyesha wazi mkazo wa kiwakilishi kionyeshi
  rationale: Muktadha wa karibu humtambulisha anayekuja, huku ‘huyo’ ikihifadhi mkazo wa Kigiriki bila kuongeza dai jingine la kimafundisho.
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ inafaa muktadha wa Yohana na inaacha wazi upeo wa neno, ambao mstari unaofuata unaufafanua zaidi.
- issue: Nguvu ya ἐλέγξει
  choice: atauhakikisha ulimwengu kuwa umekosea
  alternative: atauthibitishia ulimwengu kuhusu; atauonyesha ulimwengu hatia
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la kuonyesha kosa bila kuamua mapema kama matokeo yake ni kukiri hatia, kusadikishwa moyoni, au kuhukumiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Naye ... huyo’ huhifadhi uhusiano wa sentensi na mkazo wa kiwakilishi bila kuwa mgumu kupita kiasi.
