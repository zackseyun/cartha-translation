  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: sw
  text: Yeye atanitukuza, kwa sababu atachukua kutoka katika yaliyo yangu na kuwatangazia ninyi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Yeye
  rationale: Kiwakilishi hiki kinamrejelea Roho katika muktadha wa karibu. “Yeye” ni ya kawaida na inaendeleza msisitizo wa kiwakilishi cha Kigiriki bila kutumia usemi mzito kama “huyo.”
- source_word: ἐμὲ δοξάσει
  choice: atanitukuza
  rationale: Kitenzi “kutukuza” kinahifadhi uzito wa δοξάζω katika Injili ya Yohana, ambapo maana inazidi heshima ya kawaida.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inaeleza sababu ya Roho kumtukuza Yesu.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: yaliyo yangu
  rationale: Usemi huu wa kawaida wa Kiswahili unaacha wazi ni nini hasa kilicho cha Yesu, bila kukifafanua kuwa mafundisho, mamlaka, au ufunuo. Maana ya chanzo ya ἐκ inaeleweka pamoja na kitenzi “atachukua,” ingawa haijaigwa neno kwa neno ili sentensi ibaki ya kawaida.
- source_word: λήμψεται
  choice: atachukua
  rationale: λαμβάνω inaweza kumaanisha kuchukua au kupokea. “Atachukua” inadumisha maana tendaji na inafaa katika muundo huu; maana mbadala imeonyeshwa katika tanbihi.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: kuwatangazia ninyi
  rationale: “Kuwatangazia” huwasilisha maana ya kuripoti au kujulisha, nayo “ninyi” inaweka wazi wingi wa ὑμῖν na inaleta msisitizo wa asili.
theological_decisions:
- issue: Uhusiano wa Roho na Yesu katika ἐκ τοῦ ἐμοῦ λήμψεται
  choice: atachukua yaliyo yangu
  alternative: atapokea kutoka katika yaliyo yangu
  rationale: Tafsiri kuu inahifadhi maana pana kwamba Roho anawasilisha yaliyo ya Mwana bila kuifanya kauli hii kuwa ufafanuzi maalumu wa kimafundisho. Mbadala unahifadhi maana nyingine halali ya λήμψεται pamoja na nguvu ya ἐκ.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku “kutukuza” na “kutangaza” vikihifadhi uzito wa kifungu.
