base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: sw
  text: Mpaka sasa hamjaomba chochote kwa jina langu.[a] Ombeni,[b] nanyi mtapokea, ili furaha yenu iwe kamili.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kwa jina langu” linaweza kumaanisha kuomba kwa uhusiano na nafsi, mamlaka, na kazi ya Yesu; tafsiri imehifadhi kirai hicho bila kukifungia katika maelezo moja tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Endeleeni kuomba.” Amri ya wakati uliopo inaweza kuashiria tendo linaloendelea au linalorudiwa katika muktadha huu.
    reason: lexical_alternative
  - marker: c
    text: Au, “ili furaha yenu ijazwe kikamilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Mpaka sasa
  rationale: Kirai hiki kinaonyesha kipindi chote hadi wakati wa sasa; “Mpaka sasa” ni Kiswahili cha kawaida na sahihi.
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: hamjaomba chochote
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida maana ya kutokuwa wameomba kitu chochote hadi sasa, bila kunakili kwa ugumu ukanushi maradufu wa Kigiriki.
- source_word: ἐν τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Hiki ndicho kirai cha kawaida cha Kiswahili kinachohifadhi picha na upana wa usemi wa Kiyohana bila kuufupisha kuwa mamlaka, uwakilishi, au muungano pekee.
- source_word: αἰτεῖτε
  choice: Ombeni
  rationale: Amri ya wakati uliopo inaweza kuwa ya jumla au kuashiria tendo linalorudiwa. “Ombeni” ni amri ya kawaida na haifungi maana katika upande mmoja; uwezekano wa mwendelezo umeelezwa katika tanbihi.
- source_word: λήμψεσθε
  choice: mtapokea
  rationale: Kitenzi hiki kinaonyesha kile watakachopokea kwa kuitikia kuomba; “mtapokea” kinafaa katika muktadha wa sala na ni cha heshima kuliko “mtapata.”
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kwa ufupi na kwa kawaida kusudi au tokeo linalokusudiwa.
- source_word: ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: furaha yenu iwe kamili
  rationale: “Iwe kamili” ni Kiswahili cha asili kinachoeleza hali timilifu inayolengwa na usemi wa Kigiriki, bila kutumia muundo usio wa kawaida wa kusema furaha ‘imejaa.’
theological_decisions:
- issue: Maana ya kuomba “kwa jina langu”
  choice: Kuhifadhi kirai “kwa jina langu” katika andiko kuu
  alternative: kwa mamlaka yangu; kwa niaba yangu; katika umoja nami
  rationale: Usemi huo una upana wa kitheolojia unaohusisha nafsi, mamlaka, na kazi ya Yesu. Tafsiri halisi inayosomeka vizuri huhifadhi mvutano huo bila kuufanya uwe maelezo ya upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Ombeni, nanyi mtapokea” unaendeleza uhusiano wa amri na ahadi kwa mtiririko wa asili.
