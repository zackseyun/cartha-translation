  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: sw
  text: Vyote alivyo navyo Baba ni vyangu. Ndiyo maana nilisema kwamba yeye huchukua katika yaliyo yangu[a] na atawajulisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hupokea katika yaliyo yangu.”
    reason: Kigiriki λαμβάνει kinaweza kumaanisha “huchukua” au “hupokea.”
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Kila kitu
  rationale: Usemi huu unajumuisha yote bila ubaguzi. “Kila kitu” ni Kiswahili cha kawaida na chenye nguvu ya ujumla inayopatikana katika Kigiriki.
- source_word: ἔχει
  choice: alicho nacho
  rationale: Muundo huu wa Kiswahili unaonyesha hali ya sasa ya kuwa na kitu kwa njia ya kawaida na wazi.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Katika muktadha wa Yohana, hili ni jina la kumrejelea Mungu kama Baba; herufi kubwa inaonyesha matumizi hayo ya kimajina.
- source_word: ἐμά
  choice: ni changu
  rationale: Huhifadhi dai la moja kwa moja la umiliki bila kuongeza maelezo ya kiteolojia yasiyokuwapo katika matini.
- source_word: διὰ τοῦτο
  choice: Ndiyo maana
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachoonyesha sababu au hitimisho linalotokana na kauli iliyotangulia.
- source_word: εἶπον
  choice: nilisema
  rationale: Huhifadhi wakati uliopita wa aoristi kwa njia ya kawaida katika Kiswahili.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: kutoka katika vilivyo vyangu
  rationale: Huufanya wazi usemi wa Kigiriki uliofupishwa huku ukidumisha wazo kwamba kile kinachochukuliwa kinatoka kwa yaliyo ya Mwana.
- source_word: λαμβάνει
  choice: huchukua
  rationale: λαμβάνω inaweza kumaanisha “kuchukua” au “kupokea.” “Huchukua” hudumisha chaguo la msingi bila kuashiria kunyakua, na maana mbadala imehifadhiwa katika tanbihi.
- source_word: ἀναγγελεῖ
  choice: atawatangazia
  rationale: Huhifadhi wakati ujao na maana ya kutangaza au kufunua ujumbe kwa uzito, huku kiambishi -wa- kikiwaonyesha wanafunzi kama wapokeaji.
- source_word: ὑμῖν
  choice: ninyi
  rationale: Kiwakilishi hiki kinaweka wazi kwamba wanafunzi ndio wanaoambiwa, ingawa tayari wameonyeshwa pia katika kiambishi cha kitenzi.
theological_decisions:
- issue: Uhusiano wa vitu alivyo navyo Baba na Mwana
  choice: Kila kitu alicho nacho Baba ni changu
  alternative: Vyote alivyo navyo Baba ni vyangu
  rationale: Tafsiri inadumisha dai pana na lenye nguvu kuhusu umiliki wa Mwana, bila kuingiza istilahi za mafundisho ya baadaye.
- issue: Roho kuchukua au kupokea kutoka kwa yaliyo ya Mwana
  choice: huchukua kutoka katika vilivyo vyangu
  alternative: hupokea kutoka katika vilivyo vyangu
  rationale: Kigiriki kinakubali maana zote mbili. Matini kuu inatumia “huchukua,” huku tanbihi ikihifadhi “hupokea” ili kutoondoa mvutano wa kimaana na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo ni wa moja kwa moja bila kuwa mgumu; “yeye” limetumiwa kusisitiza na kuweka wazi mhusika anayerejelewa katika muktadha.
