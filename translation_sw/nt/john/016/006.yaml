  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: sw
  text: Lakini kwa sababu nimewaambia mambo haya, huzuni imeujaza moyo wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mioyo yenu.” Kigiriki kina neno “moyo” katika umoja pamoja na “wenu” linalowarejelea watu wengi; muundo huu unaweza kueleza huzuni ya ndani waliyoishiriki kama kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji na kauli iliyotangulia; “Lakini” ni cha kawaida na kina uzito unaofaa.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika muktadha huu ὅτι inaonyesha sababu ya huzuni ya wanafunzi, si maudhui ya usemi tu.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi na kurejelea mambo ambayo Yesu ametoka kusema.
- source_word: λελάληκα ὑμῖν
  choice: nimewaambia
  rationale: Kauli timilifu ya Kigiriki inaeleza tendo lililokamilika lenye athari ya sasa. “Nimewaambia” ni Kiswahili cha asili kinachohifadhi hali hiyo na pia huonyesha walengwa walio wengi.
- source_word: ἡ λύπη
  choice: huzuni
  rationale: “Huzuni” hueleza majonzi mazito kwa lugha ya kawaida, yenye heshima, na inafaa katika muktadha huu.
- source_word: πεπλήρωκεν
  choice: imeujaza
  rationale: Huhifadhi maana halisi ya kitenzi πληρόω, “kujaza,” pamoja na hali timilifu, bila kuongeza tafsiri kama “imewashinda.”
- source_word: ὑμῶν τὴν καρδίαν
  choice: moyo wenu
  rationale: Kigiriki kina kiwakilishi milikishi cha wingi na nomino “moyo” ya umoja. “Moyo wenu” huhifadhi muundo huo wa pamoja kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Umoja wa pamoja “moyo” dhidi ya wingi wa kugawa “mioyo”
  choice: moyo wenu
  alternative: mioyo yenu
  rationale: Muundo wa Kigiriki unaweza kuwaonyesha wanafunzi kama kundi lenye hali moja ya ndani. Umoja umehifadhiwa ili kutatua kimya kimya hali hiyo yenye maana mbili; tanbihi inaonyesha tafsiri nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “moyo wenu” umehifadhi umoja wa Kigiriki bila kusikika kigeni; “nimewaambia” ni wa asili zaidi kuliko “nimesema kwenu” huku ukihifadhi hali timilifu.
