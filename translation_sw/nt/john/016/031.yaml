lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akawajibu
  rationale: Kitenzi hiki cha masimulizi kinaonyesha jibu katika mazungumzo; “akawajibu” ni Kiswahili cha kawaida na huhifadhi wakati pamoja na wale walioelekezewa jibu.
- source_word: αὐτοῖς
  choice: -wa- katika “akawajibu”
  rationale: Kiwakilishi cha wingi cha yambwa kisicho cha moja kwa moja kinawasilishwa kwa kiambishi cha Kiswahili “-wa-” bila kuongeza maana.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili.
- source_word: Ἄρτι
  choice: sasa
  rationale: “Sasa” huhifadhi maana ya wakati wa sasa au wakati huu na ni ya kawaida katika Kiswahili.
- source_word: πιστεύετε
  choice: mnaamini
  rationale: Umbo hili linaonyesha nafsi ya pili wingi na hali ya sasa ya πιστεύω; “kuamini” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha wa Yohana.
theological_decisions:
- issue: Nguvu ya Ἄρτι πιστεύετε;
  choice: 'Kutafsiri kama swali lenye mkazo: “Je, sasa mnaamini?”'
  alternative: “Sasa mnaamini.”
  rationale: Kigiriki kinaweza kusomwa kama swali au kauli kwa kuwa alama za uakifishaji ni za uhariri. Muktadha unaofuata kuhusu wanafunzi kutawanyika unapendelea swali la balagha, lakini uwezekano wa kauli umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Je” inaweka wazi usomaji wa swali, huku tanbihi ikihifadhi uwezekano halisi wa kauli katika Kigiriki.
