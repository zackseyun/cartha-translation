  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: sw
  text: Kwa maana Baba mwenyewe anawapenda, kwa sababu ninyi mmenipenda na mmeamini kwamba nilitoka kwa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilitoka katika uwepo wa Mungu”; maneno ya Kigiriki yanaweza pia kudokeza kutoka katika uwepo wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ὁ πατὴρ
  choice: Baba mwenyewe
  rationale: Neno “mwenyewe” linahifadhi msisitizo wa αὐτός kwa njia ya kawaida katika Kiswahili, likionyesha kwamba Baba binafsi anawapenda wanafunzi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” hudumisha mtiririko huo wa hoja.
- source_word: φιλεῖ ὑμᾶς
  choice: anawapenda
  rationale: φιλέω hapa huonyesha upendo wa karibu; “anawapenda” ni ya asili na yenye uzito unaofaa. Kiambishi -wa- kinaonyesha kwamba “ninyi” ni wingi.
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: kwa sababu ninyi mmenipenda
  rationale: ὅτι ya kwanza inaonyesha sababu. Viwakilishi vya wazi “ninyi” na kiambishi cha yambwa katika “mmenipenda” vinadumisha msisitizo wa ὑμεῖς na ἐμέ; wakati timilifu unaonyesha tendo lenye matokeo yanayoendelea.
- source_word: καὶ πεπιστεύκατε
  choice: na mmeamini
  rationale: Wakati timilifu unaonyesha imani iliyofikiwa na ambayo bado ina umuhimu; “mmeamini” ni tafsiri ya kawaida na ya asili ya Kiswahili.
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: kwamba nilitoka kwa Mungu
  rationale: ὅτι ya pili huanzisha maudhui ya imani. “Nilitoka kwa Mungu” hudumisha lugha ya asili na utume bila kuongeza ufafanuzi wa kimafundisho usiotajwa moja kwa moja.
theological_decisions:
- issue: Maana ya Kikristo ya “nilitoka kwa Mungu”
  choice: nilitoka kwa Mungu
  alternative: nilitoka mbele za Mungu
  rationale: Kauli hiyo inaacha wazi kina cha uhusiano wa asili na utume wa Yesu kwa Mungu, kama ilivyo katika Kigiriki, bila kuibadili kuwa maelezo mapana ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku “Baba mwenyewe” na “ninyi” zikihifadhi misisitizo ya matini ya Kigiriki.
