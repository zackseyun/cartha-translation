source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: sw
  text: 'Lakini mimi nawaambia kweli: ni kwa faida yenu kwamba mimi niondoke. Kwa maana nisipoondoka, Mtetezi[a] hatakuja kwenu kamwe; lakini nikienda, nitamtuma kwenu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Msaidizi,” “Mshauri,” “Mfariji,” au “Parakleto” (kwa Kigiriki).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Inaonyesha utofautishaji na huzuni ya wanafunzi katika muktadha uliotangulia, kwa Kiswahili cha kawaida na wazi.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: mimi nawaambia kweli
  rationale: Inahifadhi msisitizo wa kiwakilishi ἐγώ na kauli ya dhati kwamba Yesu anasema yaliyo kweli.
- source_word: συμφέρει ὑμῖν
  choice: ni kwa faida yenu
  rationale: Kitenzi kinaeleza jambo lenye manufaa au faida kwa mtu; kauli hii ni ya asili na haitafsiri manufaa hayo kwa namna finyu.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: mimi niondoke
  rationale: Inawasilisha jambo ambalo ni kwa faida yao na kudumisha msisitizo wa ἐγώ bila kuongeza maelezo yasiyomo.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: Kwa maana nisipoondoka
  rationale: Inadumisha uhusiano wa maelezo unaoletwa na γάρ, muundo wa sharti, na urudiaji wa wazo la kuondoka.
- source_word: ὁ παράκλητος
  choice: Mtetezi
  rationale: Neno hili linaweza kumaanisha mtu anayeitwa kando ili kusaidia, kutetea, kushauri au kufariji. “Mtetezi” huhifadhi vizuri dhana ya mwakilishi wa kibinafsi, huku upana wa maana ukielezwa katika tanbihi.
- source_word: οὐ μὴ ἔλθῃ
  choice: hatakuja kwenu kamwe
  rationale: “Kamwe” inawasilisha ukanushi wenye nguvu wa οὐ μή pamoja na hali ya kitenzi tegemezi.
- source_word: ἐὰν δὲ πορευθῶ
  choice: lakini nikienda
  rationale: Inaonyesha sharti linalotofautishwa na lile la kwanza; “nikienda” ni Kiswahili cha kawaida kinachofaa katika muktadha huu.
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: nitamtuma kwenu
  rationale: Kiambishi cha ngeli ya mtu “-m-” kinadumisha rejeo la kibinafsi la αὐτόν, na “kwenu” linaonyesha mwendo kuelekea kwa wanafunzi.
theological_decisions:
- issue: Tafsiri ya παράκλητος katika hotuba za Yohana
  choice: Mtetezi
  alternative: Msaidizi; Mshauri; Mfariji; Parakleto
  rationale: Hakuna neno moja la Kiswahili linalobeba maana zote za παράκλητος. “Mtetezi” linaonyesha jukumu la kibinafsi na la uwakilishi bila kumfanya kuwa nguvu isiyo na utu; maana nyingine halali zimehifadhiwa katika tanbihi.
- issue: Rejeo la kibinafsi kwa παράκλητος
  choice: nitamtuma
  alternative: nitaituma
  rationale: αὐτόν ni kiwakilishi cha kiume kinachomrejelea παράκλητος, ambaye kifungu kinamwasilisha kama mtendaji anayekuja na anayetumwa. Kiswahili kimetumia ngeli ya mtu ili kuepuka kumwasilisha kama kitu au nguvu isiyo na utu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa “niondoke/nisipoondoka” umehifadhiwa, na ukanushi wenye msisitizo umetolewa kwa “kamwe.”
