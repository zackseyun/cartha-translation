  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: sw
  text: Sasa tunajua kwamba unajua mambo yote, wala huhitaji mtu yeyote akuulize[a]. Kwa sababu hii tunaamini kwamba ulitoka kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akuhoji.” Kitenzi cha Kigiriki kinaweza kumaanisha kuuliza au kuhoji.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Sasa
  rationale: Inaonyesha wakati wa sasa ambapo wanafunzi wanadai kuwa wamefikia ufahamu huo; ni tafsiri fupi na ya kawaida.
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Ingawa umbo la kitenzi ni la hali timilifu, οἶδα hutumika kwa maana ya wakati wa sasa, ‘kujua.’
- source_word: οἶδας πάντα
  choice: unajua mambo yote
  rationale: πάντα ina upana wa maana ya yote; ‘mambo yote’ ni Kiswahili cha asili, chenye heshima, bila kuongeza ufafanuzi wa kiteolojia.
- source_word: οὐ χρείαν ἔχεις
  choice: wala huhitaji
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo kwamba Yesu hana haja ya jambo hilo, huku ‘wala’ ikiendeleza sentensi kwa ulaini.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: mtu yeyote akuulize
  rationale: ἐρωτάω inaweza kumaanisha kuuliza au kuhoji. ‘Akuulize’ ni pana na ya kawaida katika Kiswahili, bila kudokeza uhasama usiotajwa; maana nyingine imehifadhiwa katika tanbihi.
- source_word: ἐν τούτῳ
  choice: Kwa jambo hili
  rationale: Kirai kinaonyesha msingi au ushahidi wa imani waliyoitamka wanafunzi.
- source_word: πιστεύομεν
  choice: tunaamini
  rationale: Hii ndiyo maana ya kawaida ya πιστεύω katika kauli hii ya kukiri.
- source_word: ἀπὸ θεοῦ
  choice: kwa Mungu
  rationale: Katika muundo ‘ulitoka kwa Mungu,’ ‘kwa Mungu’ huonyesha chimbuko kwa Kiswahili cha kawaida na huhifadhi neno la moja kwa moja ‘Mungu’ bila kulibadili kuwa ‘Baba.’
- source_word: ἐξῆλθες
  choice: ulitoka
  rationale: Huhifadhi kwa uwazi wazo la kutoka au kuja kutoka kwa Mungu; katika Kiswahili, ‘ulitoka kwa Mungu’ ni ya asili na hudumisha nguvu ya kitenzi cha Kigiriki.
theological_decisions:
- issue: Nguvu ya kikristolojia ya ‘unajua mambo yote’
  choice: Kauli ya wanafunzi imehifadhiwa moja kwa moja bila kuipanua.
  alternative: Kutumia maneno ya ufafanuzi yanayotaja wazi kuwa Yesu anajua kila jambo kwa namna ya ujuzi wote.
  rationale: Matini yenyewe inatoa ungamo kuhusu maarifa ya Yesu. Tafsiri inapaswa kuhifadhi uzito huo bila kuongeza tamko la kimafundisho lisilosemwa moja kwa moja hapa.
- issue: Maana ya ἀπὸ θεοῦ ἐξῆλθες
  choice: ulitoka kwa Mungu
  alternative: ulitoka kwa Baba
  rationale: Kigiriki kinasema wazi ‘kwa Mungu.’ Kutaja ‘Baba’ kungeweza kupatana na muktadha wa karibu, lakini kungezidi maneno ya aya hii na kupunguza mvutano wake wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kulegeza upana wa πάντα au dai la kwamba Yesu alitoka kwa Mungu.
