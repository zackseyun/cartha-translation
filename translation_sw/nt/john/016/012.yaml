id: JHN.16.12
reference: John 16:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: sw
  text: Bado nina mambo mengi ya kuwaambia, lakini hamwezi kuyastahimili sasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hamwezi kuyabeba sasa” au “hamwezi kuyavumilia sasa.” Kitenzi cha Kigiriki kinaweza kumaanisha kubeba, kustahimili, au kuvumilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: Bado
  rationale: Huonyesha kwamba Yesu ana mafundisho mengine yaliyobaki; ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: πολλὰ
  choice: mambo mengi
  rationale: Kivumishi hiki cha wingi cha jinsia ya kati kimetumiwa kama nomino; “mambo mengi” huweka wazi maana yake kwa Kiswahili cha kawaida.
- source_word: ἔχω
  choice: nina
  rationale: Katika muundo huu pamoja na kitenzi-jina, huonyesha kwamba Yesu ana mambo yaliyobaki kusema; “nina” huhifadhi muundo huo kwa ufasaha.
- source_word: ὑμῖν λέγειν
  choice: ya kuwaambia
  rationale: Hutoa maana ya kusema jambo kwa watu fulani kwa Kiswahili cha asili bila kuongeza tafsiri ya ziada.
- source_word: ἀλλ’
  choice: lakini
  rationale: Ni kiunganishi cha kawaida kinachoonyesha utofauti kati ya mambo yaliyobaki kusemwa na kutoweza kwa wanafunzi kuyapokea sasa.
- source_word: οὐ δύνασθε
  choice: hamwezi
  rationale: Huonyesha wazi kutokuwa na uwezo kwa wakati huu na ni usemi wa kawaida kuliko muundo mzito wa “hamna uwezo wa.”
- source_word: βαστάζειν
  choice: kuyastahimili
  rationale: Huhifadhi wazo la kubeba au kuvumilia uzito wa mambo hayo bila kulipunguza kuwa kuelewa kiakili pekee.
- source_word: ἄρτι
  choice: sasa
  rationale: Huonyesha wakati wa sasa tofauti na wakati ujao unaozungumziwa katika mistari inayofuata.
theological_decisions:
- issue: Maana ya βαστάζειν kuhusu kutoweza kwa wanafunzi kwa wakati huo
  choice: Wanafunzi hawawezi kwa sasa kustahimili uzito wa mafundisho zaidi.
  alternative: Wanafunzi hawawezi kuyaelewa kikamilifu sasa, au hawawezi kuvumilia kuyasikia sasa.
  rationale: Kitenzi βαστάζω kinaweza kumaanisha kubeba, kustahimili, au kuvumilia. “Kuyastahimili” huhifadhi mvutano kati ya uwezo wa kiakili, kihisia, na kiroho bila kuamua kwamba maana ni kuelewa tu au kuvumilia tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Kuyastahimili” hudumisha sitiari na upana wa maana ya Kigiriki.
