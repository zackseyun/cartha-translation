  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: sw
  text: “Kweli, kweli, nawaambia, ninyi mtalia na kuomboleza, lakini ulimwengu utafurahi; ninyi mtahuzunika, lakini huzuni yenu itageuka kuwa furaha.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huzuni yenu itakuwa furaha.”
    reason: Mbadala wa karibu zaidi na muundo wa Kigiriki εἰς χαρὰν γενήσεται; maandishi makuu hutumia usemi wa kawaida zaidi wa Kiswahili unaoonyesha mabadiliko hayo.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Inahifadhi urudiaji wa msisitizo na uzito wa tamko la Yesu kwa Kiswahili cha kawaida, bila kuacha neno hilo kama mkopo usioeleweka kwa baadhi ya wasomaji.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kauli ya Yesu kwa wale anaowazungumzia.
- source_word: κλαύσετε
  choice: mtalia
  rationale: Kitenzi hiki huonyesha kutoa machozi au kulia kwa huzuni, na kinabaki tofauti na kuomboleza kunakofuata.
- source_word: θρηνήσετε
  choice: kuomboleza
  rationale: Kinawasilisha maonyesho makubwa ya huzuni na kuhifadhi tofauti yake na κλαύσετε.
- source_word: ὁ δὲ κόσμος
  choice: lakini ulimwengu
  rationale: Inahifadhi neno pana la Kiyohana na tofauti inayowekwa na δέ, bila kulifafanua kwa kuongeza kundi maalumu lisilotajwa wazi.
- source_word: χαρήσεται
  choice: utafurahi
  rationale: Ni usemi wa kawaida unaowasilisha tofauti kubwa kati ya furaha ya ulimwengu na huzuni ya wanafunzi.
- source_word: λυπηθήσεσθε
  choice: mtahuzunika
  rationale: Inatoa kwa kawaida hali ya kuingiwa na huzuni na kudumisha uhusiano wa kileksia na nomino huzuni katika kishazi kinachofuata.
- source_word: ἡ λύπη ὑμῶν
  choice: huzuni yenu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi uhusiano na mtahuzunika.
- source_word: εἰς χαρὰν γενήσεται
  choice: itakuwa furaha
  rationale: Inafuata kwa karibu mwendo unaoonyeshwa na εἰς pamoja na γενήσεται, huku ikibaki wazi na kueleweka kwa Kiswahili.
theological_decisions:
- issue: Matumizi ya κόσμος katika Injili ya Yohana
  choice: ulimwengu
  alternative: ulimwengu usioamini; mfumo wa ulimwengu
  rationale: Ingawa κόσμος mara nyingi huwa na maana hasi katika Yohana, mstari huu hauifafanui moja kwa moja zaidi ya kuiweka kinyume na wanafunzi. Tafsiri pana inalinda mvutano huo bila kuingiza ufafanuzi wa kitheolojia katika matini.
- issue: Mabadiliko ya huzuni kuwa furaha
  choice: huzuni yenu itakuwa furaha
  alternative: huzuni yenu itageuka kuwa furaha
  rationale: Muundo wa Kigiriki unaweza kueleweka kama huzuni yenyewe kuwa furaha, si tu kuondolewa na nafasi yake kuchukuliwa na furaha. Tafsiri kuu inafuata muundo huo kwa karibu, huku mbadala wa kawaida zaidi ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “Kweli, kweli” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa pekee wa kauli ya Yesu katika Yohana.
