  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: sw
  text: Nilitoka kwa Baba na nimekuja ulimwenguni. Tena, ninaondoka ulimwenguni na kwenda kwa Baba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Nilitoka kwa Baba
  rationale: Kitenzi pamoja na ἐκ kinaonyesha mwendo na asili kutoka kwa Baba. Kiswahili ‘nilitoka kwa Baba’ ni cha kawaida na kinahifadhi dai hilo bila kuongeza ufafanuzi wa kimafundisho.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: nimekuja ulimwenguni
  rationale: ‘Nimekuja’ linaakisi hali timilifu ya tendo lililokamilika lenye umuhimu wa sasa; ‘ulimwenguni’ huonyesha kuingia katika ulimwengu kwa Kiswahili cha kawaida.
- source_word: πάλιν
  choice: Sasa[a]
  rationale: Katika mfuatano huu πάλιν inaweza kuonyesha hatua inayofuata au kurudi kinyume na mwendo wa kwanza. ‘Sasa’ linaunganisha kwa kawaida kuja ulimwenguni na kuondoka kwake bila kudokeza kwamba ameondoka ulimwenguni mara nyingine hapo awali; ‘tena’ limetolewa katika tanbihi kama uwezekano wa karibu zaidi wa kimuundo.
- source_word: ἀφίημι τὸν κόσμον
  choice: ninaondoka ulimwenguni
  rationale: Wakati wa sasa unaonyesha tendo lililo karibu kutukia. ‘Ninaondoka ulimwenguni’ ni la asili na huwasilisha kuacha mahali hapa.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: na kwenda kwa Baba
  rationale: Huonyesha mwendo wenye mwelekeo kwa Baba. Muundo huu ni wa kawaida katika Kiswahili na hauongezi wazo la ‘kuingia katika uwepo’ ambalo halijasemwa wazi.
theological_decisions:
- issue: Uhusiano wa Yesu na Baba katika kauli ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Kutafsiri moja kwa moja ‘Nilitoka kwa Baba,’ kama dai la asili na mwendo kutoka kwa Baba.
  alternative: Kupanua kuwa maelezo ya wazi zaidi kuhusu kuwako kabla au kufanyika mwili, au kudhoofisha kuwa ‘nilitoka kwa Mungu.’
  rationale: Andiko lenyewe linasema Yesu alitoka kwa Baba na anarudi kwa Baba. Tafsiri inahifadhi uzito huo wa Kikristo bila kuingiza maelezo ya kimafundisho yasiyomo katika maneno ya Kigiriki.
- issue: Maana ya πάλιν katika mpangilio wa kuja na kurudi
  choice: ‘Sasa’ katika maandishi, huku ‘Tena’ likitajwa katika tanbihi.
  alternative: ‘Tena’ katika maandishi makuu.
  rationale: πάλιν linaweza kusomwa kama ‘tena’ au kama kiashiria cha hatua ya pili/ya kurudi. ‘Sasa’ ni cha kawaida zaidi katika muktadha huu, lakini tanbihi inahifadhi uwezekano wa karibu wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo sambamba wa kutoka/kuja na kuondoka/kwenda umehifadhiwa.
