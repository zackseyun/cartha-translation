  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: sw
  text: Kwa hiyo, twaeni silaha kamili za Mungu[a], ili mweze kupinga katika siku ya uovu[b], na baada ya kufanya yote[c], msimame imara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vifaa vyote vya vita vya Mungu.” Neno la Kigiriki humaanisha vifaa kamili vya askari.
    reason: lexical_alternative
  - marker: b
    text: “Siku ya uovu” inaweza kumaanisha kwa ujumla wakati wa uovu mkali au majaribu, si lazima siku moja maalumu ya mwisho.
    reason: alternative_reading
  - marker: c
    text: Au, “baada ya kutekeleza kila kitu” au “baada ya kukamilisha yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na maonyo yaliyotangulia; “Kwa hiyo” ni cha kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: ἀναλάβετε
  choice: twaeni
  rationale: Kitenzi hiki ni amri ya kuchukua au kuinua kitu kwa matumizi. “Twaeni” linafaa kwa taswira ya kijeshi na halibadilishi kitenzi kuwa “vaeni.”
- source_word: τὴν πανοπλίαν
  choice: silaha zote
  rationale: πανοπλία hurejelea vifaa kamili vya askari. “Silaha zote” ni usemi wa asili wa Kiswahili unaosisitiza ukamilifu wa vifaa hivyo.
- source_word: τοῦ θεοῦ
  choice: za Mungu
  rationale: Muundo wa umilikaji umeachwa mpana kama ulivyo katika Kigiriki, bila kuamua kama silaha hizo ni mali ya Mungu, zinatolewa naye, au zina sifa yake.
- source_word: ἵνα δυνηθῆτε
  choice: ili mweze
  rationale: Huhifadhi kusudi la tendo pamoja na uwezo unaokusudiwa.
- source_word: ἀντιστῆναι
  choice: kupinga
  rationale: Katika muktadha wa kijeshi kitenzi humaanisha kukabili au kustahimili shambulio. “Kupinga” ni wazi na pia hutofautisha kitenzi hiki na στῆναι inayofuata.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: katika siku ya uovu
  rationale: Tafsiri hii huhifadhi uzito na upana wa usemi bila kuufanya lazima kuwa siku maalumu ya mwisho.
- source_word: ἅπαντα κατεργασάμενοι
  choice: baada ya kufanya yote
  rationale: Muundo huu huwasilisha tendo lililotangulia la kutekeleza yote yanayohitajika, huku ukiepuka kuongeza wazo la ushindi ambalo halijasemwa wazi.
- source_word: στῆναι
  choice: msimame imara
  rationale: “Msimame” huhifadhi mwangwi wa taswira ya kusimama vitani; “imara” huonyesha katika Kiswahili maana ya kushikilia msimamo katika muktadha huu.
theological_decisions:
- issue: Maana ya “siku ya uovu”
  choice: Imeachwa kuwa wakati wa uovu au mapambano makali kwa ujumla
  alternative: Siku maalumu ya mwisho, au siku binafsi ya jaribu
  rationale: Usemi wa Kigiriki unaweza kuwa na upeo mpana; tafsiri haumlazimishi msomaji kuuchukulia kama istilahi maalumu ya nyakati za mwisho.
- issue: Nguvu ya umilikaji katika “silaha za Mungu”
  choice: Imehifadhiwa kwa muundo mpana “za Mungu”
  alternative: Silaha zinazomilikiwa na Mungu, au silaha anazotoa Mungu
  rationale: Kigiriki hakilazimishi kuchagua nuance moja tu, hivyo tafsiri haiongezi ufafanuzi wa kiteolojia usio dhahiri.
- issue: Uhusiano wa “baada ya kufanya yote” na “kusimama”
  choice: Kufanya yote yanayodaiwa na hali, kisha kubaki imara
  alternative: Kushinda kila kitu kabisa, au kumaliza tu maandalizi yote
  rationale: κατεργάζομαι inaweza kumaanisha kutekeleza au kukamilisha; usemi mpana huhifadhi mvutano huo bila kudai ushindi kamili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Twaeni” limetumiwa kama amri ya wingi yenye uzito unaofaa taswira ya kijeshi; sentensi imebaki na mwendo wa kishairi lakini inaeleweka kwa wasomaji wa kawaida.
