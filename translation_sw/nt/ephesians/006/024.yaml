review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Pauline blessing, its universal scope ('all'), the ongoing character of those loving the Lord, and the title 'Bwana wetu Yesu Masihi.' However, 'katika hali isiyoharibika' recasts the abstract noun ἀφθαρσίᾳ as an adjectivally defined 'state,' which is less direct and can sound as though a particular state is being specified.
  naturalness: The sentence is otherwise clear and suitably formal. 'Katika kutoharibika' is still deliberately marked, as the Greek is, but it is a more direct Kiswahili rendering of the abstract idea than 'katika hali isiyoharibika.' The footnote supplies idiomatic interpretive possibilities.
  terminology: '''Neema,'' ''Bwana,'' and ''Masihi'' are appropriate in Standard East African Swahili and retain the intended blessing register. ''Kutoharibika'' preserves the semantic field of ἀφθαρσία without deciding whether it characterizes the love, the lovers'' manner, or the blessing.'
  issues:
  - severity: low
    issue: The phrase 'katika hali isiyoharibika' introduces 'hali' (state/condition) and renders the Greek abstract noun by an adjective.
    rationale: Although not a serious change of meaning, this is less formally transparent and slightly less natural than using the abstract noun 'kutoharibika.' A revision better preserves the compact, disputed force of ἐν ἀφθαρσίᾳ.
  revised_text: Neema iwe pamoja na wote wanaompenda Bwana wetu Yesu Masihi katika kutoharibika[a].
