    reason: alternative_reading
  revision_rationale: Neno 'hali' limeondolewa ili kutafsiri ἀφθαρσίᾳ kwa karibu zaidi kama nomino dhahania, 'kutoharibika.' Matini kuu inaendelea kuhifadhi utata wa uhusiano wa kishazi hiki, nao ufafanuzi wa tafsiri zinazowezekana unabaki katika tanbihi.
