  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: sw
  text: Neema iwe pamoja na wote wanaompenda Bwana wetu Yesu Masihi katika kutoharibika[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa upendo usioharibika”; pia yaweza kuwa, “kwa unyofu” au “kwa upendo usiokoma.” Usemi wa Kigiriki “katika kutoharibika” ni mfupi na unaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Neema
  rationale: Neno hili linafaa katika baraka ya kufunga barua za Paulo na ni la kawaida katika Kiswahili cha Biblia.
- source_word: μετὰ πάντων
  choice: iwe pamoja na wote
  rationale: Kigiriki hakina kitenzi hapa; 'iwe' huongezwa kwa kawaida katika Kiswahili ili kuwasilisha ombi la baraka, huku 'pamoja na wote' likifuata maana ya μετά pamoja na nomino katika hali ya genitive.
- source_word: ἀγαπώντων
  choice: wanaompenda
  rationale: Kauli ya kushiriki ya wakati uliopo imewasilishwa kwa kishazi tegemezi cha kawaida, ikionyesha sifa endelevu ya watu hao.
- source_word: κύριον
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na inayofaa ya κύριος kama cheo cha Yesu katika muktadha huu.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesu Masihi
  rationale: Χριστός ina maana ya Masihi, yaani Mtiwa-Mafuta; mpangilio huu ni wa asili katika Kiswahili na unadumisha cheo hicho bila kuongeza kibainishi kisichokuwapo katika Kigiriki.
- source_word: ἐν ἀφθαρσίᾳ
  choice: katika hali isiyoharibika
  rationale: Tafsiri hii inabaki karibu na muundo mfupi wa Kigiriki na kuhifadhi utata wa iwapo usemi huu unaeleza upendo wao, namna ya kupenda, au mazingira/sifa ya baraka.
theological_decisions:
- issue: Maana na uhusiano wa kisarufi wa ἐν ἀφθαρσίᾳ
  choice: Kuhifadhi usemi wa kiasi rasmi na wenye utata, 'katika hali isiyoharibika'
  alternative: '''kwa upendo usioharibika''; ''kwa unyofu''; au ''kwa upendo usiokoma'''
  rationale: Kigiriki hakisemi wazi ikiwa ἀφθαρσία linafafanua upendo wa waamini, namna wanavyopenda, au hali ambayo baraka inatolewa. Matini kuu haipaswi kulazimisha mojawapo ya tafsiri hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya baraka ya mwisho lakini kinachoeleweka kwa msomaji wa kawaida. Usemi usio wa kawaida kidogo mwishoni umehifadhiwa kwa makusudi ili kutofuta utata halisi wa Kigiriki.
