id: EPH.6.11
reference: Ephesians 6:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: sw
  text: Vaeni silaha zote za Mungu[a], ili mweze kusimama dhidi ya hila za Ibilisi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vifaa vyote vya vita vya Mungu.” Neno la Kigiriki linamaanisha vifaa kamili vya askari.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbinu za ujanja za Ibilisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Vaeni
  rationale: Kitenzi hiki ni amri ya nafsi ya pili wingi na katika muktadha wa silaha humaanisha kujivika au kuvaa. “Vaeni” ni Kiswahili cha kawaida, cha moja kwa moja, na huhifadhi nguvu ya amri.
- source_word: πανοπλίαν
  choice: silaha zote
  rationale: Neno hili hurejelea vifaa kamili vya askari, si vazi la kujikinga pekee. “Silaha zote” ni usemi wa kawaida unaosisitiza ukamilifu wa vifaa hivyo.
- source_word: τοῦ θεοῦ
  choice: za Mungu
  rationale: 'Huhifadhi upana wa hali ya umilikishi katika Kigiriki: silaha hizo zinahusishwa na Mungu, bila kulazimisha maana kuwa ni mali yake tu au kwamba zinatoka kwake tu.'
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: ili mweze kusimama
  rationale: Muundo huu unaonyesha kusudi. “Ili mweze kusimama” ni wa asili katika Kiswahili na hudumisha dhana ya uwezo pamoja na kusudi la amri.
- source_word: στῆναι
  choice: kusimama
  rationale: Huhifadhi kitenzi cha msingi bila kuongeza wazi “imara.” Katika picha ya vita, maana ya kutokubali kushindwa au kuondolewa mahali tayari inaeleweka kutokana na muktadha.
- source_word: μεθοδείας
  choice: hila
  rationale: Neno hili huonyesha mbinu za ujanja na udanganyifu. “Hila” ni neno la sasa na linaloeleweka kwa urahisi, huku likihifadhi maana hiyo hasi.
- source_word: τοῦ διαβόλου
  choice: Ibilisi
  rationale: Katika muktadha huu διάβολος ni jina la adui binafsi wa kiroho, si tu nomino ya kawaida inayomaanisha mchongezi. “Ibilisi” ndilo jina sanifu la Kiswahili.
theological_decisions:
- issue: Mrejeleo na tafsiri ya διάβολος
  choice: Ibilisi kama adui binafsi mwovu
  alternative: mchongezi
  rationale: Muktadha wa vita vya kiroho katika Waefeso 6 unaunga mkono mrejeleo wa adui binafsi wa kiroho. Tafsiri haiongezi maelezo ya kimafundisho yasiyosemwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa, na unaoeleweka kwa wasomaji wa kawaida. “Silaha zote” limetumiwa badala ya “deraya kamili” kwa sababu neno la Kigiriki linahusu vifaa vyote vya askari, si kinga ya mwili pekee.
