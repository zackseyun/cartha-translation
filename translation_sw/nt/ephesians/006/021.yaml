  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: sw
  text: Ili ninyi pia mjue habari zangu[a] na ninachofanya, Tikiko, ndugu mpendwa na mhudumu mwaminifu katika Bwana[b], atawaeleza kila kitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hali yangu”; kwa maana halisi, usemi wa Kigiriki unasema “mambo yanayonihusu.”
    reason: lexical_alternative
  - marker: b
    text: Au “mtumishi mwaminifu”; neno la Kigiriki διάκονος linaweza pia kutafsiriwa “mtumishi,” au katika baadhi ya miktadha “shemasi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Lakini ili
  rationale: ἵνα inaonyesha kusudi, na δέ ina nguvu ndogo ya kuunganisha; “Lakini ili” huhifadhi yote mawili kwa Kiswahili cha kawaida.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: ninyi pia mjue
  rationale: “Ninyi” pamoja na “pia” huhifadhi msisitizo wa kiwakilishi ὑμεῖς na maana ya nyongeza ya καί.
- source_word: τὰ κατ’ ἐμέ
  choice: habari zangu
  rationale: Nahau hii inahusu mambo au hali zinazomhusu Paulo. “Habari zangu” ni ya asili katika Kiswahili na haibani maana kuwa hali yake tu.
- source_word: τί πράσσω
  choice: ninachofanya
  rationale: Hutoa moja kwa moja maana ya kile Paulo anachofanya au anachoshughulikia.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: atawaeleza kila kitu
  rationale: γνωρίζω hapa ni kufanya jambo lijulikane au kutoa taarifa; “atawaeleza kila kitu” ni wazi na ya kawaida.
- source_word: Τυχικὸς
  choice: Tikiko
  rationale: Jina limetoholewa kwa namna inayofaa mfumo wa sauti na desturi ya majina ya kibiblia katika Kiswahili.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: ndugu mpendwa
  rationale: Huhifadhi lugha ya kifamilia ya Kikristo na upendo unaoonyeshwa na ἀγαπητός.
- source_word: πιστὸς διάκονος
  choice: mhudumu mwaminifu
  rationale: διάκονος hapa inaeleza huduma ya Tikiko bila kuthibitisha wazi cheo rasmi; “mhudumu” huhifadhi maana hiyo ya kiutendaji.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Ni usemi wa kawaida wa Paulo unaoonyesha mahusiano au nyanja ya huduma chini ya Bwana.
theological_decisions:
- issue: Maana ya διάκονος kuhusu Tikiko
  choice: mhudumu
  alternative: mtumishi; shemasi
  rationale: Muktadha unamtambulisha Tikiko kama mfanyakazi mwenza mwaminifu. Neno hilo halionyeshi bila utata kwamba hapa ni cheo rasmi cha shemasi, hivyo “mhudumu” huepuka kuingiza muundo maalumu wa kanisa.
- issue: Maana ya ἀδελφός
  choice: ndugu
  alternative: ndugu wa kiume
  rationale: Tikiko ni mwanamume mmoja, lakini “ndugu” katika Kiswahili ni sahihi, ya asili, na huhifadhi sitiari ya kifamilia bila ufafanuzi usiohitajika.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: Katika usemi wa Paulo ἐν κυρίῳ, hili ni jina la kawaida la Yesu; “Bwana” huhifadhi matumizi hayo ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili bila kuondoa msisitizo wa “ninyi pia” wala utata wa διάκονος.
