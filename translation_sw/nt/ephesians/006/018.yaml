  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: sw
  text: kwa kila sala na ombi, mkisali kila wakati katika Roho[a], na kwa kusudi hili kesheni kwa uvumilivu wote na maombi kwa ajili ya watakatifu wote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika roho.” Kigiriki kinaweza kueleweka kwa maana ya jumla zaidi, lakini katika muktadha huu huenda kinamrejelea Roho Mtakatifu.
    reason: alternative_reading
  - marker: b
    text: “Watakatifu” hapa ni watu wote watakatifu wa Mungu, yaani waamini wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: kwa kila sala na ombi
  rationale: ‘Kwa’ huwasilisha matumizi ya διά yenye genitivi yanayoonyesha njia au namna. ‘Sala’ ni neno la jumla, na ‘ombi’ linaonyesha maombi mahususi.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: mkisali kila wakati
  rationale: ‘Mkisali’ huhifadhi hali ya kitenzi-endelevu inayounganisha mstari huu na agizo lililotangulia; ‘kila wakati’ ni Kiswahili cha kawaida chenye nguvu ya ujumla ya παντί.
- source_word: ἐν πνεύματι
  choice: katika Roho
  rationale: Katika muktadha wa Waefeso, hasa baada ya kutajwa kwa upanga wa Roho, inaelekea kumaanisha Roho Mtakatifu; herufi kubwa inaonyesha uelewa huo huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: εἰς αὐτό
  choice: kwa kusudi hili
  rationale: Hii ni tafsiri ya kawaida na wazi ya nahau inayoonyesha lengo la kusali na kukesha.
- source_word: ἀγρυπνοῦντες
  choice: kesheni
  rationale: Kitenzi hiki huonyesha kuwa macho na kukaa katika hali ya tahadhari. Agizo la Kiswahili linaendeleza kwa kawaida mfululizo wa wito wa kifungu.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: kwa uvumilivu wote na kuwaombea
  rationale: ‘Uvumilivu wote’ hudokeza kudumu bila kukata tamaa. Kugeuza δέησις kuwa ‘kuwaombea’ kunafanya uhusiano wake na walengwa waliofuata uwe wazi na wa asili katika Kiswahili, bila kupoteza maana ya ombi.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: watakatifu wote
  rationale: Katika matumizi ya Paulo, ‘watakatifu’ ni watu wote wa Mungu waliowekwa wakfu, yaani waamini wote, si kundi maalumu lililotangazwa baadaye.
theological_decisions:
- issue: Kirejeo cha πνεύματι
  choice: Roho Mtakatifu (‘katika Roho’)
  alternative: roho ya mwanadamu (‘katika roho’)
  rationale: Muktadha wa karibu na matumizi ya Paulo yanaunga mkono zaidi maana ya Roho Mtakatifu, lakini kukosekana kwa kibainishi katika Kigiriki kunaruhusu usomaji wa jumla zaidi; tanbihi inahifadhi utata huo.
- issue: Maana ya ἅγιοι
  choice: waamini wote (‘watakatifu wote’)
  alternative: watakatifu kwa maana ya kundi maalumu lililotambuliwa rasmi baadaye
  rationale: Kwa kawaida Paulo hutumia neno hili kwa jumuiya nzima ya watu wa Mungu. Tanbihi huzuia maana finyu ya baadaye kuingizwa katika kifungu.
- issue: Uhusiano wa προσκαρτέρησις na δέησις
  choice: uvumilivu katika kukesha pamoja na kuwaombea wengine
  alternative: ‘kwa uvumilivu wote na ombi,’ kama vipengele viwili sambamba
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa njia zote mbili. Tafsiri iliyochaguliwa ni ya asili katika Kiswahili na huhifadhi uvumilivu pamoja na ombi bila kudai kwamba ni neno moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mkisali’ huunganisha mstari na muktadha uliotangulia, huku ‘kesheni’ likitoa wito wa moja kwa moja na wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
