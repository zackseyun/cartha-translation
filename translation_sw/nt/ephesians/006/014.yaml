  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: sw
  text: Basi simameni, mkiwa mmefunga viuno vyenu kwa ukweli[a] na mmevaa dirii ya haki,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkiwa mmejifunga mshipi wa ukweli viunoni.” Kigiriki hakitaji wazi neno “mshipi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: simameni
  rationale: Ni amri ya nafsi ya pili wingi. “Simameni” hutoa maana ya moja kwa moja bila kuongeza kielezi kisichotajwa wazi katika neno lenyewe.
- source_word: οὖν
  choice: basi
  rationale: “Basi” huonyesha hitimisho au mwito unaotokana na maelezo yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ
  choice: mkiwa mmejifunga ukweli kiunoni
  rationale: Muundo huu hudumisha tendo la kujifunga kiunoni na kuunganisha ἀλήθεια nalo bila kuongeza wazi nomino “mshipi,” ambayo haipo katika Kigiriki. “Mkiwa mmejifunga” huonyesha tendo lililokamilishwa linaloandamana na amri ya kusimama.
- source_word: ἐνδυσάμενοι
  choice: mmevaa
  rationale: Kitenzi hiki ni nahau ya kuvaa vazi au silaha. Katika muundo “mkiwa ... mmevaa,” Kiswahili kinaonyesha hali inayotokana na tendo la kuvaa.
- source_word: θώρακα
  choice: dirii
  rationale: “Dirii” ni neno la Kiswahili linalotambulika kwa silaha inayolinda kifua na linahifadhi taswira ya kijeshi kwa ufupi.
- source_word: δικαιοσύνης
  choice: haki
  rationale: “Haki” ni neno la kawaida la Kiswahili linaloweza kubeba maana zinazohusiana za uadilifu na haki ya kutenda kwa usawa, hivyo halilazimishi kutenganisha wigo wa neno la Kigiriki.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika mfano wa silaha
  choice: haki
  alternative: uadilifu
  rationale: “Haki” huacha wazi wigo mpana wa δικαιοσύνη—hali au mwenendo ulio sawa pamoja na upande wa kutenda kwa haki—bila kuingiza ufafanuzi wa kimadhehebu. “Uadilifu” ungeelekeza zaidi kwenye tabia njema ya mtu.
- issue: Uhusiano wa ἐν ἀληθείᾳ na tendo la kujifunga
  choice: mmejifunga ukweli kiunoni
  alternative: mmejifunga mshipi wa ukweli kiunoni
  rationale: Kigiriki kinasema kihalisi kujifunga kiuno “katika/kwa ukweli” bila kutaja mshipi. Matini kuu inahifadhi uhusiano huo, huku tanbihi ikitoa usomaji wa sitiari unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka. “Dirii” huhifadhi taswira maalumu ya silaha, na “haki” huhifadhi upana wa kitheolojia na kimaadili wa δικαιοσύνη.
