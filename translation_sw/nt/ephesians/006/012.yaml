id: EPH.6.12
reference: Ephesians 6:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: sw
  text: Kwa maana pambano letu si dhidi ya damu na nyama[a], bali dhidi ya watawala, dhidi ya wenye mamlaka, dhidi ya watawala wa ulimwengu wa giza hili[b], dhidi ya nguvu za kiroho za uovu katika ulimwengu wa mbinguni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapambano yetu ya mieleka si dhidi ya damu na nyama.” Usemi “damu na nyama” unamaanisha wanadamu.
    reason: lexical_alternative
  - marker: b
    text: Au, “watawala wa ulimwengu wa giza hili la sasa.” Neno “sasa” linaeleza maana inayowezekana lakini halijaelezwa wazi katika Kigiriki.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika mahali pa mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: pambano
  rationale: Neno hili hutaja hasa mieleka au mapambano ya karibu. “Pambano” ni la kawaida na lenye hadhi katika Kiswahili, huku dokezo la “mieleka” likihifadhiwa katika tanbihi.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: dhidi ya damu na mwili
  rationale: Mpangilio wa Kigiriki umehifadhiwa kwa sababu unaeleweka katika muktadha na huepuka kubadili nahau hiyo moja kwa moja kuwa tafsiri ya maana, yaani wanadamu.
- source_word: σάρκα
  choice: mwili
  rationale: Hapa σάρξ ni sehemu ya usemi “damu na mwili” unaorejelea wanadamu wenye mwili, wala si “asili ya dhambi.”
- source_word: ἀρχάς
  choice: watawala
  rationale: Katika muktadha huu neno linataja mamlaka zinazotawala; “watawala” ni wazi na la kawaida kuliko istilahi ya kimapokeo “falme.”
- source_word: ἐξουσίας
  choice: wenye mamlaka
  rationale: Huhifadhi maana ya kuwa na au kutumia mamlaka na hutofautisha kundi hili na “watawala.”
- source_word: κοσμοκράτορας
  choice: watawala wa ulimwengu
  rationale: Huhifadhi kwa uwazi muundo wa neno ambatani linalomaanisha watawala wa ulimwengu, bila kulipanua kuwa “nguvu za anga.”
- source_word: τοῦ σκότους τούτου
  choice: wa giza hili
  rationale: Hufuata uhusiano wa moja kwa moja wa Kigiriki, ambapo watawala hao ni wa au wanatambulishwa na giza hili. Wazo la “sasa” halijaongezwa katika matini.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: majeshi ya kiroho ya uovu
  rationale: Kivumishi cha wingi kilichotumika kama nomino kinarejelea viumbe au nguvu za kiroho. “Majeshi” huonyesha kundi la wapinzani bila kuwafanya kuwa mawazo yasiyo na nafsi.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: katika ulimwengu wa mbinguni
  rationale: Hutoa kwa Kiswahili cha sasa wazo la eneo au nyanja ya mbinguni, na hubaki pana vya kutosha kwa matumizi ya msemo huu katika Waefeso.
theological_decisions:
- issue: Asili ya wapinzani wanaotajwa
  choice: Matini imetafsiriwa kuwa inarejelea hasa mamlaka za kiroho zilizo juu ya wanadamu.
  alternative: Majina hayo yanaweza kueleweka kuwa watawala na mifumo ya kibinadamu, au mamlaka za kiroho pamoja na madhihirisho yake duniani.
  rationale: Mkusanyiko wa majina, hasa κοσμοκράτορας na τὰ πνευματικὰ τῆς πονηρίας, unaelekeza wazi kwa wapinzani wa kiroho. Hata hivyo, tafsiri haikanushi uwezekano wa wao kujidhihirisha kupitia mifumo ya duniani.
- issue: Maana ya σάρξ katika msemo huu
  choice: Imetafsiriwa “mwili” ndani ya usemi “damu na mwili,” si “asili ya dhambi.”
  alternative: asili ya dhambi
  rationale: Katika muktadha huu neno linahusu maisha ya kibinadamu yenye mwili na, katika usemi mzima, wanadamu; halitumiki kwa maana maalumu ya mwelekeo wa dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “dhidi ya” yamehifadhiwa ili kuakisi msisitizo wa Kigiriki. “Damu na mwili” imeachwa katika mpangilio wa chanzo, huku maana yake ikifafanuliwa katika tanbihi.
