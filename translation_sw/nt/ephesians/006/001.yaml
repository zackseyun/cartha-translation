  source_fidelity: The direct address (Τὰ τέκνα), imperative force (ὑπακούετε), collective 'parents' (τοῖς γονεῦσιν), and compact placement of ἐν κυρίῳ are accurately represented. However, 'jambo linalofaa' can denote what is merely suitable or appropriate and somewhat softens δίκαιον, which here states moral rightness.
  naturalness: The wording is clear, idiomatic Standard East African Swahili. 'Enyi watoto' and 'watiini wazazi wenu' are natural for a direct, respectful address. Replacing the expanded final clause with 'hilo ni sawa' is both more direct and closer to the Greek.
  terminology: '''Bwana'' appropriately preserves κύριος, and ''katika Bwana'' rightly retains the Greek phrase without settling its precise scope. ''Wazazi'' and ''watiini'' are accurate, current choices.'
