  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: sw
  text: Enyi watoto, watiini wazazi wenu katika Bwana[a], kwa maana hilo ni sawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama walio wa Bwana” / “katika muungano na Bwana.” Kauli “katika Bwana” inaweza kueleza mazingira au namna ya utii, na pia inaweza kudokeza kwamba utii huo una mipaka inayowekwa na uaminifu kwa Bwana.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: watoto
  rationale: Nomino hii ya wingi inawaita moja kwa moja watoto walio katika familia; “watoto” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: ὑπακούετε
  choice: watiini
  rationale: Amri ya wakati uliopo inataka utii wa kuitikia, si kusikia tu; “watiini” linafikisha nguvu ya agizo hilo.
- source_word: γονεῦσιν
  choice: wazazi
  rationale: Nomino ya wingi inawarejelea wazazi kwa pamoja; “wazazi” ni tafsiri ya kawaida na sahihi.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Kauli fupi ya Paulo imehifadhiwa ili kubakiza uwezekano kwamba inaeleza mazingira, namna, au upeo wa utii unaotawaliwa na uhusiano na Bwana.
- source_word: δίκαιον
  choice: jambo linalofaa
  rationale: Katika muktadha huu neno linaonyesha lililo sawa kimaadili au linalostahili kufanywa; “jambo linalofaa” ni la asili na wazi kwa wasomaji wa sasa.
theological_decisions:
- issue: Upeo wa kauli “katika Bwana”
  choice: 'Imeunganishwa na agizo: “watiini wazazi wenu katika Bwana,” huku uwazi wake wa kitafsiri ukihifadhiwa.'
  alternative: Inaweza kueleweka kuwa watoto walio katika Bwana wawatii wazazi wao, au kwamba wawatii kwa namna inayolingana na uhusiano wao na Bwana.
  rationale: Mpangilio wa Kigiriki unaunganisha ἐν κυρίῳ kwa njia ya kawaida na amri, lakini maana yake mahususi haijaelezwa kikamilifu. Tafsiri hii haiondoi mvutano kati ya utambulisho ndani ya Bwana, mazingira au namna ya utii, na uwezekano wa mpaka unaowekwa na uaminifu kwa Bwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Enyi” limetumiwa kuonyesha mwito wa moja kwa moja wa wingi, na “kufanya hivyo” linafafanua rejeo la τοῦτο bila kubadili hoja.
