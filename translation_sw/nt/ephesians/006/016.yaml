source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: sw
  text: Katika hali zote[a], chukueni ngao ya imani; kwa ngao hiyo mtaweza kuzima mishale[b] yote inayowaka moto ya yule Mwovu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pamoja na hayo yote.” Kirai cha Kigiriki kinaweza kueleweka kuwa katika kila hali au pamoja na silaha zote zilizotajwa.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki linaweza kumaanisha kwa ujumla vitu vinavyorushwa kama silaha, si mishale pekee.
    reason: lexical_alternative
  - marker: c
    text: Au, “uovu.” Kigiriki kinaweza kurejelea yule Mwovu binafsi au uovu kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: Katika hali zote
  rationale: Kirai hiki kimetafsiriwa kwa maana ya kivielezi, yaani katika kila hali. Hii ni Kiswahili cha kawaida na inafaa katika mfululizo wa maagizo kuhusu silaha, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: ἀναλαβόντες
  choice: chukueni
  rationale: Ingawa umbo la Kigiriki ni kitenzi-shirikishi, hapa linaambatana na mfululizo wa maagizo. Amri ya Kiswahili inaonyesha kwa kawaida tendo linalotakiwa bila kufanya sentensi kuwa nzito.
- source_word: θυρεὸν
  choice: ngao
  rationale: Neno hili hutaja ngao kubwa ya kujikinga. 'Ngao' ni neno la kawaida na linalohifadhi taswira ya kijeshi bila kuongeza maelezo yasiyohitajika katika matini kuu.
- source_word: τῆς πίστεως
  choice: ya imani
  rationale: Hapa πίστις inaeleweka vizuri kama imani au kumtegemea Mungu. 'Imani' ni tafsiri iliyo wazi na ya kawaida, nayo inahifadhi upana wa istilahi ya Paulo.
- source_word: ἐν ᾧ
  choice: kwa hiyo
  rationale: Kiwakilishi kinarejelea ngao, na kihusishi kinaonyesha chombo au njia. 'Kwa hiyo' hapa humaanisha kwa kutumia ngao hiyo, si kwa sababu hiyo.
- source_word: δυνήσεσθε
  choice: mtaweza
  rationale: Tafsiri hii huhifadhi wakati ujao na wazo la kuwa na uwezo.
- source_word: βέλη
  choice: mishale
  rationale: βέλη ni neno la jumla kwa vitu vinavyorushwa kama silaha. 'Mishale' inaeleweka mara moja katika taswira hii, huku maana pana zaidi ikitajwa katika tanbihi.
- source_word: τοῦ πονηροῦ
  choice: ya yule Mwovu
  rationale: Kivumishi chenye kibainishi kinaweza kumtaja mtu mwovu. Katika muktadha wa vita vya kiroho, maana ya kibinafsi inafaa zaidi; herufi kubwa inaonyesha matumizi hayo bila kumtaja zaidi.
- source_word: πεπυρωμένα
  choice: inayowaka moto
  rationale: Umbo la Kigiriki linaonyesha mishale iliyowashwa moto. Usemi huu ni wa asili katika Kiswahili na huhifadhi picha ya mishale ikiwa katika hali ya kuwaka.
- source_word: σβέσαι
  choice: kuizima
  rationale: Kitenzi hiki humaanisha kuzima moto. Kiambishi cha ngeli katika 'kuizima' kinarejelea 'mishale' na kudumisha taswira ya kuzima silaha zinazowaka.
theological_decisions:
- issue: Maana ya τοῦ πονηροῦ
  choice: yule Mwovu
  alternative: uovu
  rationale: Muktadha wa mashambulizi na vita vya kiroho unaunga mkono zaidi rejeo la kibinafsi, yaani adui mwovu. Hata hivyo, sarufi inaweza pia kuruhusu maana ya dhana ya uovu, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
- issue: Maana ya πίστις
  choice: imani
  alternative: kumtegemea Mungu; uaminifu
  rationale: Katika mfano wa ngao, 'imani' huonyesha mwitikio wa kumwamini na kumtegemea Mungu bila kufunga neno katika ufafanuzi mwembamba kupita kiasi. 'Uaminifu' unawezekana kileksia lakini haufai sana katika muktadha huu.
- issue: Nguvu ya ἐν πᾶσιν
  choice: katika hali zote
  alternative: pamoja na hayo yote
  rationale: Maana ya kivielezi inafaa na ni ya asili, lakini kirai kinaweza pia kueleweka kuwa ngao ichukuliwe pamoja na silaha zote zilizotajwa. Tanbihi inadumisha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa katika mtindo wa agizo ili kuendelea kwa kawaida na mfululizo wa silaha katika muktadha. Taswira ya ngao, mishale inayowaka, na kuzima moto imehifadhiwa wazi.
