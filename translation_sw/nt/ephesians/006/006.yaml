base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: sw
  text: si kwa utumishi wa kujionyesha[a], kama wanaotafuta kuwapendeza watu, bali kama watumwa wa Masihi[b], mkifanya mapenzi ya Mungu kwa moyo wote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa utumishi wa macho”; Kigiriki ni halisi “utumishi wa macho,” yaani utumishi unaofanywa kwa ajili ya kuonekana au wakati mtu anapoangaliwa tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kristo.” Kigiriki Christos humaanisha “Masihi,” yaani Mtiwa-Mafuta.
    reason: alternative_reading
  - marker: c
    text: Au, “kutoka nafsini”; maana yake ni kufanya kwa dhati kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: kufanya kazi wakati tu mnaangaliwa
  rationale: Kiambatano hiki adimu humaanisha utumishi unaofanywa kwa ajili ya kuonekana na hasa wakati mwenye mamlaka anaangalia. Tafsiri hii ya maana ni ya kawaida na inaeleweka katika Kiswahili; tanbihi inahifadhi taswira halisi ya ‘utumishi wa macho.’
- source_word: ἀνθρωπάρεσκοι
  choice: watu wanaotaka kuwapendeza wanadamu
  rationale: Hueleza watu wanaotafuta kibali cha binadamu. Kauli hii ni ya sasa na wazi, na inahifadhi maana hasi bila kutumia neno linaloweza kudokeza kujipendekeza kwa hila zaidi ya ilivyo katika Kigiriki.
- source_word: δοῦλοι
  choice: watumwa
  rationale: Katika muktadha wa karibu Paulo anazungumza na watumwa halisi, kisha anafafanua upya uhusiano wao kwa Masihi. ‘Watumwa’ huhifadhi uzito wa kuwa chini ya mamlaka na kumilikiwa kuliko ‘watumishi.’
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ni cheo cha mtiwa-mafuta. ‘Masihi’ huhifadhi maana ya cheo hicho badala ya kukitumia tu kama jina.
- source_word: ποιοῦντες
  choice: mkifanya
  rationale: Umbo la kushiriki linaeleza tendo linaloandamana na agizo la muktadha. ‘Mkifanya’ ni la moja kwa moja na huunganisha vizuri kishazi hiki na wasemeshwa walio katika wingi.
- source_word: θέλημα
  choice: mapenzi
  rationale: ‘Mapenzi ya Mungu’ ni usemi wa kawaida wa Kiswahili kwa kile Mungu anachotaka kifanywe, na unafaa katika himizo la kimaadili.
- source_word: ἐκ ψυχῆς
  choice: kwa moyo wote
  rationale: Huu ndio usemi wa kawaida wa Kiswahili unaowasilisha tendo la ndani, la hiari na la dhati. Tanbihi inahifadhi muundo halisi wa Kigiriki, ‘kutoka nafsini,’ bila kuufanya mstari mkuu usikike usio wa kawaida.
theological_decisions:
- issue: Kutafsiri δοῦλοι katika muktadha wa kanuni za nyumbani
  choice: watumwa wa Masihi
  alternative: watumishi wa Masihi
  rationale: Muktadha unawahusu watumwa halisi na unatumia hali hiyo kuonyesha utii na kuwa chini ya mamlaka ya Masihi. ‘Watumwa’ hudumisha mkazo huo badala ya kuupunguza.
- issue: Kutafsiri Χριστοῦ kama cheo au kama jina
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ huonyesha wazi maana ya Χριστός kama Mtiwa-Mafuta na huhifadhi wazo la utiifu kwa mtawala huyo bila kuingiza tofauti ya kimadhehebu.
- issue: Kutafsiri ἐκ ψυχῆς kwa Kiswahili cha kawaida
  choice: kwa moyo wote
  alternative: kutoka nafsini
  rationale: Kigiriki kina maana halisi ya ‘kutoka nafsini,’ lakini katika Kiswahili ‘kwa moyo wote’ huwasilisha kwa kawaida uzito wa ndani na uaminifu wa mtu mzima. Tanbihi inaweka wazi taswira ya asili ili tofauti hiyo isipotee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari umeachwa kama mwendelezo wa sentensi ya aya iliyotangulia. Lugha ya ‘mnaangaliwa’ na ‘mkifanya’ inadumisha wingi wa wasemeshwa; ‘kwa moyo wote’ ni ya kawaida, huku tanbihi ikihifadhi neno ψυχή.
