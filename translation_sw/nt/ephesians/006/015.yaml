lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: mkiisha kuvikwa
  rationale: Kitenzi hiki humaanisha kufunga chini ya mguu au kuvaa kiatu. Tafsiri hii inadumisha umbo la tendo lililotangulia na picha ya miguu inayovaliwa kwa ajili ya vita, bila kuongeza neno “viatu” ambalo halipo wazi katika Kigiriki.
- source_word: τοὺς πόδας
  choice: miguu yenu
  rationale: Maana ya moja kwa moja ni “miguu.” Kiwakilishi “yenu” kinaeleweka kutokana na agizo kwa wingi katika muktadha na hufanya Kiswahili kiwe cha kawaida.
- source_word: ἐν
  choice: utayari wa
  rationale: Hapa ἐν inaonyesha kile ambacho miguu imevikwa au kuandaliwa nacho. Muundo wa Kiswahili “kuvikwa ... utayari” huhifadhi picha hiyo bila kutumia “katika,” ambayo ingekuwa ngumu na isiyo ya kawaida.
- source_word: ἑτοιμασίᾳ
  choice: utayari
  rationale: Neno hili linaweza kumaanisha utayari, maandalizi, au hali ya kuwa tayari. “Utayari” ni tafsiri ya moja kwa moja inayohifadhi kutobainika kama ni utayari wa kutangaza au uthabiti unaotolewa na Injili.
- source_word: εὐαγγελίου
  choice: Injili
  rationale: “Injili” ni istilahi ya kawaida na inayoeleweka katika Kiswahili kwa habari njema ya Kristo, na inadumisha uzito wa matumizi ya Paulo.
- source_word: εἰρήνης
  choice: amani
  rationale: Hii ndiyo tafsiri ya kawaida ya εἰρήνη. Muundo “Injili ya amani” huhifadhi mnyororo wa viambata vya Kigiriki bila kuamua ikiwa Injili inahusu amani au inaleta amani.
theological_decisions:
- issue: Maana ya ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: Miguu ivikwe utayari unaohusiana na Injili ya amani au unaotokana nayo.
  alternative: Utayari wa kuitangaza Injili ya amani; au msingi imara unaotolewa na Injili ya amani.
  rationale: Kifungu cha Kigiriki ni kifupi na kinaweza kueleweka kwa njia zaidi ya moja. Matini kuu inatumia “utayari” na “Injili ya amani” bila kuongeza tendo la kutangaza wala kufasiri neno hilo kama uthabiti, hivyo inadumisha utata halisi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendelea kutoka agizo la kuvaa silaha katika muktadha; “mkiisha kuvikwa miguu yenu” ni wa kimafumbo kwa makusudi ili kuhifadhi picha ya Kigiriki.
