  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: sw
  text: Hatimaye, endeleeni kutiwa nguvu[a] katika Bwana na katika uweza wa nguvu zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iweni hodari katika Bwana.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa namna hii iliyo ya kawaida zaidi, lakini “endeleeni kutiwa nguvu” huhifadhi vizuri zaidi maana ya kutendwa au kupokea nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Hatimaye
  rationale: Ni kiashiria cha mpito kinachoanzisha sehemu ya mwisho ya barua; “Hatimaye” ni ya kawaida na ya asili katika Kiswahili.
- source_word: ἐνδυναμοῦσθε
  choice: imarishweni
  rationale: Amri hii ya wingi inadumisha maana ya kupokea nguvu badala ya kuwahimiza wasomaji wajitie nguvu kwa uwezo wao wenyewe.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: “Katika” huhifadhi lugha ya Paulo kuhusu uhusiano au mazingira ya kuwa ndani ya Bwana bila kuifanya wazi kuwa njia ya kutendewa, jambo ambalo maandishi hayalisemi moja kwa moja.
- source_word: κράτει
  choice: uweza
  rationale: “Uweza” huonyesha nguvu inayodhihirishwa na pia huitofautisha na ἰσχύς katika mkusanyo huu wa maneno ya nguvu.
- source_word: ἰσχύος
  choice: nguvu
  rationale: “Nguvu” ni neno la kawaida na linaloeleweka kwa uwezo au nguvu kuu, huku muundo “uweza wa nguvu zake” ukihifadhi msisitizo wa Kigiriki.
- source_word: αὐτοῦ
  choice: zake
  rationale: Kiwakilishi hiki kinarejelea Bwana na kupatana kisarufi na “nguvu” katika Kiswahili.
theological_decisions:
- issue: Kauli na chanzo cha kutiwa nguvu katika ἐνδυναμοῦσθε
  choice: “Imarishweni” huwasilisha himizo la kupokea nguvu katika Bwana, si kujikusanyia azimio la ndani tu.
  alternative: “Iweni hodari katika Bwana” au “Iweni na nguvu katika Bwana.”
  rationale: Umbo la kitenzi linaweza kueleweka kwa maana ya kati au tendwa, lakini tafsiri ya kutendwa huhifadhi wazi utegemezi wa nguvu zisizotokana na wasomaji wenyewe bila kubainisha zaidi namna Bwana anavyowatia nguvu.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ndiyo tafsiri ya kawaida na inayofaa katika muktadha huu wa Paulo, ambapo neno hilo kwa kawaida linamrejelea Yesu aliyetukuzwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa kwa Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Uweza wa nguvu zake” ni mkusanyo wenye uzito unaoakisi msisitizo wa chanzo cha Kigiriki bila kuufanya kuwa usemi wa kimadhehebu.
