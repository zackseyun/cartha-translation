id: EPH.6.8
reference: Ephesians 6:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: sw
  text: mkijua kwamba kila mmoja, jambo lolote jema analofanya, atalipokea tena kutoka kwa Bwana[a], awe mtumwa au mtu huru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atalipwa na Bwana kwa ajili ya jambo hilo.” Kitenzi cha Kigiriki kinaweza kumaanisha kupokea kile kinacholingana na tendo la mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “awe mtumwa au huru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: mkijua
  rationale: Umbo la kitenzi kishirikishi linaunganisha mstari huu na himizo lililotangulia bila kulazimisha maana ya kisababishi kwa kuweka wazi ‘kwa sababu’.
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi mkazo wa kigawanyo kwa kila mtu mmoja mmoja na ni usemi wa kawaida wa Kiswahili.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: jambo lolote jema analofanya
  rationale: ‘Jambo lolote’ huwasilisha hali ya kutokuwa maalumu inayoletwa na ἄν, huku ‘jema’ ikihifadhi sifa ya kimaadili ya tendo.
- source_word: τοῦτο
  choice: -li- (katika ‘atalipokea’)
  rationale: Kiambishi cha yambwa ‘-li-’ kinarejelea ‘jambo lolote jema’ kwa njia ya asili katika Kiswahili, badala ya kurudia nomino kwa uzito usio wa lazima.
- source_word: κομίσεται
  choice: atalipokea tena
  rationale: Huwasilisha maana ya kupokea kwa kurudishiwa au kwa kulingana na tendo, bila kuifanya lugha iwe ya kibiashara kupita kiasi.
- source_word: παρὰ κυρίου
  choice: kutoka kwa Bwana
  rationale: παρά pamoja na hali ya genitivi huonyesha chanzo; ‘Bwana’ huhifadhi uzito wa cheo hicho na rejeo lake linalowezekana kwa Kristo.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Muktadha unalinganisha moja kwa moja hali ya utumwa na uhuru, hivyo ‘mtumwa’ huhifadhi uhalisi wa kijamii wa neno hilo.
- source_word: ἐλεύθερος
  choice: mtu huru
  rationale: Huonyesha wazi mtu mwenye hali ya kijamii ya uhuru, kwa kulinganisha na ‘mtumwa’.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika muktadha wa watumwa na mabwana
  choice: mtumwa
  alternative: mtumishi
  rationale: Kwa kuwa δοῦλος inatofautishwa wazi na ἐλεύθερος, ‘mtumwa’ hudumisha tofauti ya hali ya kijamii na haipunguzi uzito wa hali iliyozungumziwa.
- issue: Rejeo na tafsiri ya κυρίου
  choice: Bwana
  alternative: bwana mkubwa
  rationale: Ingawa muktadha unawahusu mabwana wa kibinadamu, chanzo cha malipo hapa ni Bwana wa kimungu; ‘Bwana’ huhifadhi uwezekano mkubwa wa rejeo kwa Kristo bila kuufanya kuwa sitiari ya nyumba tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ‘kila mmoja, jambo lolote jema analofanya’ huhifadhi mkazo wa Kigiriki kwa kila mtu mmoja mmoja, ingawa una alama ya kifasihi kidogo. ‘Mtu huru’ huondoa utata wa kutumia kivumishi ‘huru’ peke yake.
