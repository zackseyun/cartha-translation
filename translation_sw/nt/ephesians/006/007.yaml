lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: kwa moyo mwema
  rationale: Kirai hiki kinaonyesha namna na mtazamo wa ndani katika kutumikia. “Kwa moyo mwema” ni Kiswahili cha kawaida kinachoeleza nia njema na utayari bila kuifanya maana kuwa wema unaotendewa mtu tu.
- source_word: δουλεύοντες
  choice: mkitumikia
  rationale: Kitenzi hiki kinaweza kumaanisha kutumikia kama mtumwa. Muktadha wa 6:5 tayari unawatambulisha wanaosemewa kuwa watumwa; hapa umbo la kitenzi linakazia tendo na namna ya utumishi, hivyo “mkitumikia” ni la asili bila kuficha muktadha mpana.
- source_word: ὡς τῷ κυρίῳ
  choice: kama kwamba mnamtumikia Bwana
  rationale: Kigiriki kinaeleza kwamba utumishi wao uelekezwe kwa Bwana. Kitenzi kilichodokezwa kimewekwa wazi kwa Kiswahili ili sentensi iwe ya kawaida, huku “Bwana” ikihifadhi cheo cha κύριος na tofauti na mabwana wa kibinadamu.
- source_word: καὶ οὐκ ἀνθρώποις
  choice: wala si wanadamu
  rationale: Katika muundo huu καί pamoja na οὐ huleta tofauti yenye maana ya “wala si.” ἄνθρωποι ni wanadamu kwa ujumla wakitofautishwa na Bwana; “wanadamu” huhifadhi tofauti hiyo kwa usahihi.
theological_decisions:
- issue: Tafsiri ya κύριος ikilinganishwa na mabwana wa kibinadamu
  choice: Bwana
  alternative: bwana mkubwa
  rationale: “Bwana” huhifadhi cheo kinachomrejelea Kristo na kuzuia kuchanganya Bwana wa kimungu na mabwana wa duniani wanaotajwa katika muktadha.
- issue: Kiwango cha kuonyesha maana ya utumwa katika δουλεύοντες
  choice: mkitumikia
  alternative: mkitumikia kama watumwa
  rationale: Muktadha wa karibu tayari unataja hadhi ya watumwa. Kuongeza “kama watumwa” hapa kungeeleza wazi jambo lililo katika muktadha lakini si tofauti ya msingi inayokaziwa na kishiriki hiki.
- issue: Uhusiano unaoletwa na ὡς
  choice: kama kwamba mnamtumikia Bwana
  alternative: kana kwamba mnamtumikia Bwana
  rationale: Hii inaonyesha namna utumishi unavyopaswa kuelekezwa bila kudokeza kwamba kumtumikia Bwana si jambo halisi; mazingira ya kiteolojia yanaonyesha kuwa utumishi huo hatimaye ni kwake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishiriki umehifadhiwa kwa “mkitumikia,” na kitenzi kinachodokezwa baada ya ὡς kimewekwa wazi ili sentensi isomeke kwa kawaida. Alama ya tanbihi [a] imo katika matini kuu.
