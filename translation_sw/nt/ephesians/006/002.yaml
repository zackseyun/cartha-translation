lexical_decisions:
- source_word: τίμα
  choice: Mheshimu
  rationale: Kauli ya amri ya τιμάω inadai kumtendea mtu kwa heshima, si kuwa na hisia ya heshima moyoni tu. “Mheshimu” ni ya kawaida, yenye uzito wa kimaadili, na inafaa katika nukuu ya Amri Kumi.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: baba yako na mama yako
  rationale: Huu ni ulinganifu wa moja kwa moja na wa kawaida katika Kiswahili kwa majina haya ya kifamilia pamoja na kiwakilishi cha umilikaji.
- source_word: ἥτις ἐστὶν
  choice: hii ndiyo
  rationale: Kiwakilishi hiki kinarejelea amri iliyonukuliwa; “hii ndiyo” huanzisha kwa kawaida maelezo ya Paulo na kurejelea amri nzima.
- source_word: ἐντολὴ
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye uzito unaofaa kwa agizo la Mungu, huku muktadha ukihifadhi uhusiano wake na Amri Kumi.
- source_word: πρώτη
  choice: ya kwanza
  rationale: πρώτη ni namba ya mpangilio hapa; “ya kwanza” huhifadhi dai la Kigiriki bila kulibadili kuwa “iliyo kuu zaidi.”
- source_word: ἐν ἐπαγγελίᾳ
  choice: yenye ahadi
  rationale: Ingawa muundo halisi ni “katika ahadi,” “yenye ahadi” hueleza kwa Kiswahili cha kawaida kwamba amri hii imeambatanishwa na ahadi, bila kupanua mno maana.
theological_decisions:
- issue: Uhusiano wa “amri ya kwanza” na mpangilio wa Amri Kumi
  choice: amri ya kwanza yenye ahadi
  alternative: amri ya kwanza katika ahadi; amri ya kwanza ya sehemu ya pili ya Amri Kumi
  rationale: Tafsiri inahifadhi “ya kwanza” na kueleza ἐν ἐπαγγελίᾳ kwa namna ya kawaida, bila kuingiza mpangilio wa kimadhehebu wa Amri Kumi. Tanbihi inakiri muundo halisi na maana inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama za kudondosha zimetumika kutenga nukuu ya amri na maelezo ya Paulo; alama ya tanbihi [a] imewekwa katika matini.
