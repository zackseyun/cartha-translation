  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: sw
  text: ili mambo yakuendee vizuri, nawe uishi muda mrefu duniani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika nchi,” kwa mwangwi wa maneno ya amri ya tano katika Kutoka 20:12 na Kumbukumbu la Torati 5:16.
