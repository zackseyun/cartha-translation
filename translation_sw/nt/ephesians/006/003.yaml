lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au matokeo ya ahadi iliyoambatanishwa na amri; “ili” ni ya kawaida na yenye nguvu hiyo katika Kiswahili.
- source_word: εὖ σοι γένηται
  choice: mambo yakuendee vizuri
  rationale: Hii ni namna ya asili ya Kiswahili ya kuwasilisha nahau inayomaanisha kwamba hali au mambo yatakuwa mema kwa mhusika.
- source_word: καὶ
  choice: nawe
  rationale: Huunganisha matokeo mawili yaliyoahidiwa huku ikidumisha rejeo la moja kwa moja kwa msomaji.
- source_word: ἔσῃ μακροχρόνιος
  choice: uishi muda mrefu
  rationale: Ingawa muundo halisi ni ‘uwe mwenye maisha marefu,’ Kiswahili cha asili husema ‘uishi muda mrefu,’ bila kupoteza maana.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Hufuata kwa ufupi maana pana ya Kigiriki ‘juu ya dunia,’ bila kuingiza moja kwa moja dhana mahususi ya nchi ya agano.
theological_decisions:
- issue: Upeo wa ἐπὶ τῆς γῆς kuhusiana na ahadi ya amri ya tano
  choice: duniani
  alternative: katika nchi
  rationale: Kigiriki cha Waefeso kina usemi mpana bila umilikishi unaobainisha nchi ya agano. Tafsiri kuu inafuata maandishi hayo, huku tanbihi ikihifadhi mwangwi unaowezekana wa Kutoka 20:12 na Kumbukumbu la Torati 5:16.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “mambo yakuendee vizuri” ni wa kawaida na unaeleweka kwa urahisi; “duniani” hudumisha upana wa maandishi ya Kigiriki.
