base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: sw
  text: Amani iwe kwa ndugu[a], na upendo pamoja na imani[b], kutoka kwa Mungu Baba na Bwana Yesu Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema “ndugu wa kiume,” umbo la wingi wa kiume ambalo linaweza kutumiwa kulihutubia kusanyiko lote la waumini, wanaume na wanawake.
    reason: alternative_reading
  - marker: b
    text: Au “pamoja na uaminifu” au “pamoja na kumtumaini Mungu.” Neno la Kigiriki linaweza kuwa na maana hizo, ingawa “imani” ndiyo tafsiri ya kawaida hapa.
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki: “Yesu Kristo.” Hapa “Masihi” hutafsiri maana ya cheo Χριστός; “Kristo” ni umbo lake la kawaida lililotoholewa.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Amani iwe
  rationale: Nomino hiyo ni tamko fupi la baraka. Kiswahili cha kawaida huhitaji kitenzi ili kuonyesha wazi ombi hilo; “Amani iwe” linaendeleza ufupi na hadhi ya kauli ya Kigiriki.
- source_word: τοῖς ἀδελφοῖς
  choice: kwa ndugu
  rationale: “Ndugu” ni tafsiri ya kawaida ya ἀδελφοί na katika Kiswahili inaweza kuwahusu waumini wa kiume na wa kike bila kupoteza taswira ya kifamilia.
- source_word: ἀγάπη
  choice: upendo
  rationale: Hii ndiyo maana ya kawaida ya ἀγάπη na inadumisha msamiati mkuu wa Paulo.
- source_word: μετὰ πίστεως
  choice: pamoja na imani
  rationale: μετά pamoja na hali milikishi huonyesha uandamani. “Pamoja na imani” ni ya asili zaidi katika Kiswahili kuliko “na imani” hapa, huku ikihifadhi uhusiano ulio wazi katika Kigiriki.
- source_word: ἀπὸ
  choice: kutoka kwa
  rationale: 'Inaonyesha chanzo cha baraka zilizotajwa: Mungu Baba na Bwana Yesu Masihi.'
- source_word: θεοῦ πατρὸς
  choice: Mungu Baba
  rationale: Kigiriki hakina “wetu”; kwa hiyo “Mungu Baba” ni sahihi na fasaha.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye hadhi ya κύριος katika muktadha huu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu, Masihi
  rationale: Yesu ni jina, na Χριστός ni cheo chenye maana ya Masihi. Koma linasaidia kuonyesha kwa Kiswahili kwamba “Masihi” ni cheo cha Yesu.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika baraka ya mwisho
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός lina nguvu ya cheo chenye maana ya mtiwa-mafuta. “Masihi” hutafsiri maana hiyo badala ya kuitamka tu kwa umbo la kimapokeo; “Kristo” linawekwa katika tanbihi kama umbo la kawaida.
- issue: Upeo wa ἀδελφοῖς
  choice: ndugu
  alternative: ndugu wa kiume
  rationale: Neno la Kigiriki ni wingi wa kiume lakini katika matumizi ya Paulo mara nyingi huliita kusanyiko lote la waumini. “Ndugu” katika Kiswahili linaweza kubeba maana hiyo jumuishi, huku tanbihi ikieleza umbo la Kigiriki.
- issue: Maana ya πίστις
  choice: imani
  alternative: uaminifu au tumaini
  rationale: “Imani” ndiyo maana ya msingi hapa, lakini πίστις linaweza pia kumaanisha uaminifu au hali ya kutumaini; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa baraka umewekwa mfupi; “iwe” imeongezwa kwa ulazima wa ufasaha wa Kiswahili, na koma kabla ya “Masihi” inaonyesha kwamba hilo ni cheo.
