  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: sw
  text: Nanyi, mabwana, watendeeni vivyo hivyo[a], huku mkiacha kuwatisha[b], mkijua kwamba Bwana wao na wenu yuko mbinguni[c], na kwake hakuna upendeleo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “wafanyieni mambo hayo hayo” au “watendeeni kwa namna hiyo hiyo.” Kigiriki kinaunganisha kwa karibu agizo hili na maagizo yaliyotangulia, kikisisitiza wajibu wa pande zote.
    reason: lexical_alternative
  - marker: b
    text: Au, “komesheni vitisho vyenu.” Neno la Kigiriki linaweza kumaanisha kuacha au kukomesha desturi ya kutisha.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, Kigiriki kinasema “katika mbingu”; “mbinguni” ndiyo nahau ya kawaida ya Kiswahili hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: mabwana
  rationale: Katika muktadha wa nyumba ya kale, neno hili linawataja wenye mamlaka juu ya watumwa. “Mabwana” huhifadhi jukumu hilo la kihistoria bila kulibadili kuwa la waajiri wa kisasa.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: watendeeni vivyo hivyo
  rationale: Kauli hii ni ya kawaida katika Kiswahili na huhifadhi mwangwi wa agizo lililotangulia pamoja na wazo la kuwatendea kwa usawa na uwajibikaji wa pande zote.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: huku mkiacha kuwatisha
  rationale: Huwasilisha hali ya kuacha kabisa desturi ya kutoa vitisho, huku ikihifadhi uhusiano wa kishiriki na amri kuu.
- source_word: εἰδότες
  choice: mkijua
  rationale: Huhifadhi muundo wa kishiriki wa Kigiriki na kuonyesha msingi wa agizo bila kulazimisha kiunganishi cha sababu.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: Bwana wao na wenu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba wale walio chini na mabwana wao wa duniani wote wako chini ya Bwana mmoja.
- source_word: ἐν οὐρανοῖς
  choice: mbinguni
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza nahau ya Kigiriki yenye umbo la wingi, bila kubadili maana.
- source_word: προσωπολημψία
  choice: upendeleo
  rationale: Neno hili linaeleweka kwa urahisi na linaonyesha kumpendelea mtu isivyo haki kwa kuzingatia cheo au hali yake.
- source_word: παρ’ αὐτῷ
  choice: kwake
  rationale: “Kwake hakuna upendeleo” ni usemi wa asili unaoonyesha kwamba upendeleo haupo katika tabia wala hukumu yake.
theological_decisions:
- issue: Matumizi ya κύριος kwa mabwana wa kibinadamu na kwa Bwana wa mbinguni
  choice: Kutumia “mabwana” kwa wanadamu na “Bwana” kwa yule wa mbinguni
  alternative: Kutumia istilahi tofauti kabisa kwa marejeo hayo mawili
  rationale: 'Kiswahili kinaweza kuhifadhi neno lilelile na wakati huohuo kutofautisha cheo cha Mungu kwa herufi kubwa. Hivyo, mwangwi wa kimakusudi wa Kigiriki unabaki: mabwana wa duniani nao wana Bwana mbinguni.'
- issue: Istilahi ya hadhi ya kijamii katika kanuni za kaya za kale
  choice: mabwana
  alternative: waajiri au wamiliki
  rationale: “Waajiri” ni istilahi ya kisasa inayoweza kuficha mfumo wa utumwa unaozungumziwa, na “wamiliki” ni finyu kuliko uhusiano wa mamlaka unaoonyeshwa na κύριοι.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mwendelezo wa vishiriki vya Kigiriki kwa “huku mkiacha” na “mkijua,” lakini imetumia miundo ya kawaida inayosomeka kwa urahisi. Herufi kubwa katika “Bwana” hutofautisha Bwana wa mbinguni na mabwana wa kibinadamu huku ikihifadhi mchezo wa neno moja katika Kigiriki.
