  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: sw
  text: Nanyi, akina baba, msiwachokoze watoto wenu hata wakasirike,[a] bali waleeni katika nidhamu na maonyo ya Bwana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiwakasirishe watoto wenu.” Kitenzi cha Kigiriki humaanisha kusababisha hasira au kuchochea kinyongo.
    reason: lexical_alternative
  - marker: b
    text: “Ya Bwana” inaweza kumaanisha nidhamu na maonyo yanayotoka kwa Bwana, yaliyo yake, au yanayoongozwa naye.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: akina baba
  rationale: Nomino ya Kigiriki ni ya kiume na ya wingi, ikiwataja hasa baba; ‘akina baba’ ni mwito wa kawaida na sahihi katika Kiswahili bila kuupanua kuwa ‘wazazi.’
- source_word: παροργίζετε
  choice: msiwachokoze ... hata wakasirike
  rationale: Kitenzi kina maana ya kusababisha hasira au kuchochea kinyongo. Muundo huu unaonyesha wazi nguvu yake ya kisababishi kwa Kiswahili cha kawaida.
- source_word: τέκνα
  choice: watoto wenu
  rationale: Hili ndilo neno la kawaida kwa watoto katika uhusiano wa kifamilia, likiwahusisha watoto wa kiume na wa kike.
- source_word: ἐκτρέφετε
  choice: waleeni
  rationale: Katika muktadha wa malezi ya watoto, kitenzi kinamaanisha kuwalea hadi wakue; ‘waleeni’ ni fasaha, wazi, na ya kawaida.
- source_word: παιδείᾳ
  choice: nidhamu
  rationale: Neno linajumuisha malezi yanayofundisha, kuunda tabia, na kusahihisha. ‘Nidhamu’ huhifadhi hasa kipengele cha mafunzo na marekebisho.
- source_word: νουθεσίᾳ
  choice: maonyo
  rationale: Neno linahusu maelekezo ya maneno yenye kusahihisha, kushauri, au kuonya. ‘Maonyo’ hutofautisha maana hii na ‘nidhamu’ huku kikibaki wazi kwa msomaji wa kawaida.
- source_word: κυρίου
  choice: ya Bwana
  rationale: Muundo wa ‘ya Bwana’ huhifadhi ufupi na upana wa hali ya umilikishi katika Kigiriki bila kuamua kama nidhamu na maonyo vinatoka kwa Bwana, ni vyake, au vinaongozwa naye.
theological_decisions:
- issue: Upeo wa πατέρες katika maagizo ya nyumbani
  choice: Imetafsiriwa hasa kama ‘akina baba.’
  alternative: wazazi
  rationale: Kigiriki kinawataja baba moja kwa moja. Ingawa kanuni inaweza kuwahusu wazazi kwa upana, tafsiri haipaswi kupanua rejeo la maandishi yenyewe.
- issue: Maana ya κυρίου katika ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου
  choice: Imetafsiriwa kwa muundo mpana ‘ya Bwana.’
  alternative: kutoka kwa Bwana; kuhusu Bwana; kulingana na Bwana
  rationale: Hali ya umilikishi inaweza kueleza chanzo, umiliki, tabia, au mwelekeo. ‘Ya Bwana’ huhifadhi uwezekano huo wa kimaana badala ya kuuchagua mmoja kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi kueleweka, na yenye hadhi. ‘Nanyi akina baba’ hudumisha kiunganishi Καὶ na mwito wa moja kwa moja. ‘Katika nidhamu na maonyo’ hufuata muundo wa Kigiriki huku ikibaki ya kawaida katika Kiswahili.
