  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: sw
  text: Pokeeni pia kofia ya wokovu[a] na upanga wa Roho, yaani, neno la Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chukueni” kofia ya wokovu.
    reason: lexical_alternative
  - marker: b
    text: Au “tamko la Mungu”; neno la Kigiriki rhēma linaweza kusisitiza neno au ujumbe unaonenwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: pokeeni
  rationale: Kitenzi hiki ni agizo la wingi lenye maana ya kupokea au kuchukua kitu kinachotolewa. “Pokeeni” huhifadhi wazo la kupokea silaha zinazotolewa na Mungu, huku “chukueni” likibaki kuwa chaguo halali.
- source_word: περικεφαλαίαν
  choice: kofia
  rationale: Katika muktadha wa silaha, “kofia” ni neno la kawaida na linaloeleweka kwa kifaa cha kulinda kichwa.
- source_word: τοῦ σωτηρίου
  choice: ya wokovu
  rationale: Huhifadhi muundo wa uhusiano wa Kigiriki bila kuamua kwa undani kama wokovu ndio kofia, chanzo chake, au kile inachowakilisha.
- source_word: μάχαιραν
  choice: upanga
  rationale: Ni tafsiri ya kawaida na ya asili ya silaha yenye makali inayotajwa hapa; kubainisha “upanga mfupi” kungekuwa maalumu kupita ushahidi wa muktadha.
- source_word: τοῦ πνεύματος
  choice: wa Roho
  rationale: Muktadha wa Paulo unaelekeza kwa Roho Mtakatifu. Herufi kubwa katika “Roho” inaonyesha rejeo hilo bila kuongeza jina lisilomo katika kifungu.
- source_word: ὅ ἐστιν
  choice: yaani
  rationale: Kiwakilishi cha Kigiriki ni cha jinsi ya kati na kinafafanua taswira ya upanga kwa kuitambulisha na neno la Mungu. “Yaani” huwasilisha kazi hiyo ya ufafanuzi kwa Kiswahili cha asili bila kuleta utata wa upatanisho wa kisarufi.
- source_word: ῥῆμα θεοῦ
  choice: neno la Mungu
  rationale: “Neno la Mungu” ni la kawaida, lenye heshima, na pana vya kutosha; ῥῆμα pia inaweza kusisitiza tamko au ujumbe unaonenwa, jambo linalowekwa katika tanbihi.
theological_decisions:
- issue: Rejeo la τοῦ πνεύματος
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu au roho kwa maana ya jumla
  rationale: Katika taswira ya silaha za Mungu na kifungu kinachofuata kuhusu neno la Mungu, maana ya kawaida zaidi ni Roho Mtakatifu. Tafsiri “wa Roho” haiamui kama uhusiano huo ni wa umiliki, utoaji, au matumizi.
- issue: Uhusiano wa upanga na neno la Mungu
  choice: 'Kishazi cha ufafanuzi: “yaani, neno la Mungu”'
  alternative: “ambao ni neno la Mungu”
  rationale: Kigiriki hutumia kiwakilishi cha jinsi ya kati kinachofafanua taswira nzima, si lazima kukubaliana moja kwa moja na nomino ya kike “upanga.” “Yaani” huhifadhi ufafanuzi huo na huepuka kulazimisha uhusiano wa kisarufi ambao unaweza kuficha hali ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wingi wa agizo umehifadhiwa katika “pokeeni.” Muundo ni mfupi na unaendeleza taswira ya silaha; tanbihi zinaonyesha chaguo muhimu za kileksika bila kuingiza msimamo wa dhehebu.
