  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: sw
  text: Enyi watumwa, watiini mabwana zenu wa hapa duniani[a] kwa hofu na kutetemeka, kwa unyofu wa mioyo yenu, kama kwa Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mabwana kwa jinsi ya mwili,” yaani, mabwana katika uhusiano wa maisha haya ya duniani.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu neno hilo linatumika kama cheo.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: watumwa
  rationale: Neno hili linawataja watu waliokuwa chini ya umiliki na utumwa katika mfumo wa nyumba; “watumwa” halifichi uhalisi huo wa kijamii kama ambavyo “watumishi” lingeweza kufanya.
- source_word: ὑπακούετε
  choice: watiini
  rationale: Ni agizo la kutii linaloelekezwa kwa kundi; “watiini” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: κατὰ σάρκα
  choice: wa kibinadamu
  rationale: Katika muktadha huu kifungu hiki hutofautisha mabwana wa maisha ya kibinadamu ya sasa na Masihi; hakimaanishi “tabia ya dhambi.” Tanbihi inahifadhi tamathali halisi ya “kwa jinsi ya mwili.”
- source_word: κυρίοις
  choice: mabwana
  rationale: Katika uhusiano huu neno linamaanisha mabwana au wamiliki wa watumwa, si cheo cha Mungu; “mabwana” pia huhifadhi tofauti na Masihi anayetajwa mwishoni.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: kwa hofu na kutetemeka
  rationale: Tafsiri hii inahifadhi usemi wenye mkazo na muundo wake wa kifasihi bila kuufafanua kupita kiasi.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: kwa unyofu wa mioyo yenu
  rationale: ἁπλότης hapa huonyesha unyofu, uaminifu usio na hila, na moyo usiogawanyika; usemi huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: ὡς τῷ Χριστῷ
  choice: kama mnavyomtii Masihi
  rationale: Muundo huu unaeleza namna ya utii kwa kulinganisha na utii kwa Masihi, bila kuwafanya mabwana wa kibinadamu kuwa sawa naye. “Masihi” hutafsiri Χριστός kama cheo.
theological_decisions:
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός inafanya kazi kama cheo chenye maana ya Mpakwa-Mafuta; “Masihi” huitafsiri maana hiyo badala ya kuitumia kama jina tu.
- issue: Tafsiri ya δοῦλοι katika muktadha wa utumwa
  choice: watumwa
  alternative: watumishi
  rationale: Muktadha wa kanuni za nyumbani na kutajwa kwa mabwana unaonyesha hali ya utumwa. “Watumwa” huhifadhi uhalisi huo bila kuupunguza kuwa ajira ya kawaida.
- issue: Maana ya κατὰ σάρκα
  choice: wa kibinadamu
  alternative: kwa jinsi ya mwili
  rationale: Kifungu kinaweka mpaka wa mamlaka yao katika nyanja ya maisha ya kibinadamu ya sasa. Tafsiri kuu ni ya kawaida, huku tanbihi ikihifadhi muundo halisi na uwezekano wake wa kimaana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Enyi” linaonyesha mwito wa moja kwa moja kwa kundi; “mnavyomtii” linaifanya sentensi iwe ya kawaida katika Kiswahili huku likihifadhi nguvu ya ulinganisho wa ὡς.
