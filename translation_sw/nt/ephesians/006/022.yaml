  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: sw
  text: 'Nilimtuma kwenu kwa kusudi hili hasa: ili mjue hali yetu[a], naye awatie moyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo yanayotuhusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: Nilimtuma kwenu
  rationale: Kiwakilishi rejeshi cha Kigiriki kinamrejelea Tikiko katika mstari uliotangulia. Kiswahili cha kawaida kinaweza kukiunganisha kwa asili na kitenzi kuwa “Nilimtuma”; “kwenu” huonyesha mwendo kuelekea kwa wasomaji.
- source_word: εἰς αὐτὸ τοῦτο
  choice: kwa kusudi hili hasa
  rationale: Neno “hasa” linahifadhi msisitizo wa αὐτὸ τοῦτο, huku “kusudi” likionyesha wazi maana ya dhamira.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: ili mjue hali yetu
  rationale: “Ili” linaonyesha kusudi. “Hali yetu” ni usemi wa kawaida unaoweza kujumuisha jinsi Paulo na wenzake walivyo pamoja na mambo yanayowahusu, bila kuifunga maana kwa mazingira ya nje pekee.
- source_word: καὶ παρακαλέσῃ
  choice: naye awatie moyo
  rationale: Muundo “naye” unaratibu kusudi la pili na la kwanza. Katika muktadha huu παρακαλέω huonyesha kutia moyo au kuimarisha zaidi kuliko kuonya.
- source_word: τὰς καρδίας ὑμῶν
  choice: awatie moyo
  rationale: Nahau ya Kiswahili “kutia moyo” huwasilisha kwa kawaida tendo linaloelekezwa kwa “mioyo yenu,” bila tafsiri nzito isiyo ya kawaida kama “afariji mioyo yenu.”
theological_decisions:
- issue: Maana ya τὰ περὶ ἡμῶν
  choice: hali yetu
  alternative: mambo yanayotuhusu
  rationale: Kirai cha Kigiriki kinaweza kumaanisha hali ya Paulo na wenzake au mambo yanayowahusu kwa upana. “Hali yetu” ni cha kawaida na kifupi, huku tanbihi ikihifadhi uwezekano mpana zaidi.
- issue: Maana ya παρακαλέσῃ τὰς καρδίας ὑμῶν
  choice: awatie moyo
  alternative: aifariji mioyo yenu
  rationale: Kitenzi kina wigo wa kutia moyo, kufariji, au kuhimiza. Muktadha wa kichungaji unaunga mkono “kutia moyo,” lakini hauondoi kabisa dhana ya faraja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Koloni linadumisha msisitizo wa kusudi, na nahau “kutia moyo” inaleta usemi wa kawaida wa Kiswahili.
