  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: sw
  text: na pia kwa ajili yangu, ili nipewe maneno[a] ninapofungua kinywa changu[b], niijulishe kwa ujasiri[c] siri ya Injili[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe”; au, “usemi.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “katika kufungua kinywa changu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa uhuru” au “kwa uwazi.”
    reason: lexical_alternative
  - marker: d
    text: Au, “Habari Njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: na pia kwa ajili yangu
  rationale: Katika muktadha wa ombi la sala kutoka mstari uliotangulia, ὑπὲρ ἐμοῦ humaanisha kumwombea Paulo; tafsiri hii inadumisha muunganiko huo bila kuongeza kitenzi kisichokuwamo katika mstari huu.
- source_word: ἵνα μοι δοθῇ λόγος
  choice: ili nipewe maneno
  rationale: λόγος hapa ni usemi au jambo la kusema analopewa Paulo, si cheo cha 'Neno.' Wingi wa Kiswahili 'maneno' unasikika kwa kawaida katika muktadha wa kufungua kinywa na kusema, huku tanbihi ikihifadhi uwezekano wa 'ujumbe' au 'usemi.'
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: ninapofungua kinywa changu
  rationale: Hii inadumisha taswira ya Kigiriki huku ikitoa kwa Kiswahili cha kawaida maana ya wakati au tukio la kuanza kusema.
- source_word: ἐν παρρησίᾳ
  choice: kwa ujasiri
  rationale: παρρησία huhusisha kusema wazi, kwa uhuru na bila woga. 'Kwa ujasiri' ni usemi wa kawaida unaobeba mkazo wa uthabiti katika kutangaza.
- source_word: γνωρίσαι
  choice: niijulishe
  rationale: Kitenzi hiki kinamaanisha kufanya jambo lijulikane. Muundo wa Kiswahili unaunganisha kusudi hili na kupewa maneno bila kuipanua maana kuwa aina maalumu ya mahubiri.
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: siri ya Injili
  rationale: μυστήριον katika matumizi ya Paulo ni kusudi la Mungu lililokuwa limefichwa na sasa linafunuliwa, si fumbo lisilotatulika. 'Injili' ni neno la kawaida la Kikristo la εὐαγγέλιον, huku 'Habari Njema' ikitajwa kama mbadala.
theological_decisions:
- issue: Maana ya λόγος katika ombi la Paulo
  choice: nipewe maneno
  alternative: nipewe ujumbe; nipewe usemi
  rationale: Tafsiri kuu inaonyesha kwamba Paulo anaomba apewe la kusema, bila kudai zaidi ya andiko kuhusu namna ya uvuvio au kuweka mkazo kwa uwezo wa sauti pekee. Tanbihi inadumisha umoja wa nomino ya Kigiriki na uwezekano wa kuielewa kama ujumbe.
- issue: Nguvu ya παρρησία
  choice: kwa ujasiri
  alternative: kwa uhuru; kwa uwazi
  rationale: Uchaguzi huu unadumisha ujasiri wa ushuhuda wa hadharani bila kuufanya kuwa hisia ya kujiamini tu; tanbihi inaonyesha pia wazo la kusema wazi na kwa uhuru.
- issue: Maana ya μυστήριον
  choice: siri
  alternative: fumbo
  rationale: '''Siri'' inaelekea vizuri zaidi kwenye jambo la Mungu lililokuwa limefichwa kisha likafunuliwa. ''Fumbo'' lingeweza kueleweka kimakosa kuwa tatizo linalotakiwa kuteguliwa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa mstari umehifadhi utegemezi wake kwa agizo la kuomba katika mstari uliotangulia. Herufi kubwa katika “Injili” imetumiwa kama jina lililozoeleka la ujumbe wa Kikristo; haitafsiriwi kama jina la kitabu maalumu hapa.
