  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: ombi la sala kwa ajili ya Paulo, kupewa λόγος wa kusema wakati anapoanza kusema, na kusudi la kuifanya siri ya Injili ijulikane kwa παρρησία. “Maneno” ni utoaji wa kawaida wa Kiswahili kwa λόγος katika muktadha huu, huku tanbihi ikihifadhi mbadala wa umoja.'
  naturalness: Kiswahili ni sanifu, cha kawaida, na kina hadhi inayofaa kwa barua ya kitume. “Ninapofungua kinywa changu” hutokeza kwa kawaida nahau ya Kigiriki bila kuifanya kuwa ya kigeni. Muundo “niijulishe ... siri” unaruhusu kiambishi cha yambwa i- kurejelea “siri,” pamoja na yambwa iliyoelezwa wazi.
  terminology: “Kwa ujasiri” huwasilisha vyema παρρησία katika muktadha wa ushuhuda; tanbihi inaonyesha vipengele vya uhuru na uwazi bila kupunguza maana. “Siri ya Injili” ni istilahi sahihi kwa μυστήριον τοῦ εὐαγγελίου, na “Injili” ni matumizi ya kawaida ya Kiswahili cha Kikristo. Tanbihi zote zina alama zinazolingana na mahali pake katika matini.
