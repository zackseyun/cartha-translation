  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: sw
  text: Kwa ajili yake mimi ni balozi, nikiwa nimefungwa kwa mnyororo[a], ili niseme kwa ujasiri katika hilo[b], kama inavyonipasa kusema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “katika mnyororo”; usemi huo unaonyesha hali ya kifungo.'
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi cha Kigiriki kina jinsia ya kati na kwa uwezekano mkubwa kinarejelea Injili au siri yake katika mstari uliotangulia. Pia yaweza kumaanisha, “kuhusu hilo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: ambayo kwa ajili yake
  rationale: Kiwakilishi cha Kigiriki ni cha umoja na jinsi isiyo ya kiume wala ya kike, na kwa kawaida hurejelea “siri ya Injili” katika mstari uliotangulia. Kauli hii inadumisha maana ya kutenda kwa ajili ya ujumbe huo.
- source_word: πρεσβεύω
  choice: mimi ni balozi
  rationale: Kitenzi hiki humaanisha kutenda kama balozi au mjumbe rasmi; “ni balozi” ni Kiswahili cha kawaida kinachohifadhi hadhi ya uwakilishi.
- source_word: ἐν ἁλύσει
  choice: nikiwa nimefungwa kwa mnyororo
  rationale: Kigiriki kina umoja, yaani “katika mnyororo.” Tafsiri hii inahifadhi picha halisi ya kifungo huku ikiwa ya asili katika Kiswahili.
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi; “ili” ni usemi wa kawaida na ulio wazi katika Kiswahili.
- source_word: ἐν αὐτῷ
  choice: niitangaze
  rationale: Kiwakilishi ni cha jinsi isiyo ya kiume wala ya kike na kinaelekea kurejelea siri ya Injili. Kiswahili huhitaji kurekebisha muundo; “niitangaze” huonyesha kwa kawaida kusema kwa ujasiri kuhusu ujumbe huo bila kuufanya urejelee mtu.
- source_word: παρρησιάσωμαι
  choice: kwa ujasiri
  rationale: Kitenzi kina wazo la kusema waziwazi, kwa uhuru na ujasiri. Muundo huu unaunganika kwa kawaida na “niitangaze.”
- source_word: ὡς δεῖ με λαλῆσαι
  choice: kama inipasavyo kusema
  rationale: δεῖ huonyesha ulazima au wajibu. “Inipasavyo” huhifadhi wajibu huo bila kufanya usemi kuwa mgumu.
theological_decisions:
- issue: Kirejelewa cha οὗ na αὐτῷ
  choice: Vyote vinaeleweka kuwa vinarejelea siri ya Injili au ujumbe wa Injili katika mstari wa 19.
  alternative: Baadhi wanaweza kuelewa rejeo la pili kwa maana ya “ndani yake” likimrejelea mtu, au kulichukua la kwanza kwa upana zaidi kuwa kuhusu kazi ya kuitangaza Injili.
  rationale: Maumbo ya Kigiriki yaliyotolewa ni ya jinsi isiyo ya kiume wala ya kike, hivyo yanapendelea kirejelewa kisicho mtu. Tafsiri hailazimishi rejeo la kikristo kwa mtu ambalo sarufi ya kifungu hiki hailionyeshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “mimi ni balozi” unasisitiza hali yenye kushangaza ya balozi aliye kifungoni; “niitangaze kwa ujasiri” ni wa asili na huepuka tafsiri ngumu ya neno kwa neno.
