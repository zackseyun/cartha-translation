  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: sw
  text: ikiwa kwa kweli mmesikia kuhusu uwakili wa neema ya Mungu niliyopewa kwa ajili yenu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa bila shaka mmesikia.” Ingawa Kigiriki kina muundo wa sharti, katika muktadha Paulo yaelekea anadhani jambo hili ni kweli.
    reason: alternative_reading
  - marker: b
    text: Au, “usimamizi” au “jukumu nililokabidhiwa,” badala ya “uwakili.” Neno la Kigiriki linaweza kumaanisha kusimamia jambo lililokabidhiwa au jukumu la kiutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: ikiwa kwa kweli
  rationale: Inahifadhi muundo wa sharti wa Kigiriki na mkazo wake, bila kuondoa uwezekano wa kueleweka kama dhana ambayo Paulo anatarajia kuwa kweli.
- source_word: ἠκούσατε
  choice: mmesikia
  rationale: Kauli hii ni ya kawaida katika Kiswahili na inaonyesha tendo la kusikia lililotokea ambalo bado lina umuhimu katika muktadha.
- source_word: οἰκονομίαν
  choice: uwakili
  rationale: Neno hili linaonyesha wajibu wa kusimamia jambo lililokabidhiwa; hapa linahusu huduma au jukumu alilokabidhiwa Paulo kuhusu neema ya Mungu.
- source_word: χάριτος
  choice: neema
  rationale: Hili ni neno la kawaida na lenye mwendelezo mzuri katika msamiati wa Paulo kwa fadhili na kipawa cha Mungu kisichostahiliwa.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Inahifadhi uhusiano wa umilikaji au chanzo uliomo katika hali ya genitivi.
- source_word: τῆς δοθείσης
  choice: niliyopewa
  rationale: Muundo wa Kiswahili unaweka wazi kwamba Paulo ndiye aliyepokea neema hiyo, huku ukihifadhi hali ya kutendwa. Kisintaksia kishiriki cha Kigiriki kinakubaliana moja kwa moja na ‘neema,’ ingawa wazo zima la uwakili pia linahusishwa kwa karibu.
- source_word: μοι
  choice: ni- ... -pewa
  rationale: Dhamira ya nafsi ya kwanza imeingizwa kwa kawaida katika kitenzi cha Kiswahili na inaonyesha ‘kwangu/mimi.’
- source_word: εἰς ὑμᾶς
  choice: kwa ajili yenu
  rationale: Inaonyesha kwamba neema na huduma aliyokabidhiwa Paulo zilielekezwa kwa manufaa ya wasomaji.
theological_decisions:
- issue: Maana ya ‘uwakili wa neema ya Mungu’
  choice: Jukumu la kusimamia neema ya Mungu alilokabidhiwa Paulo kwa ajili ya wasomaji
  alternative: Mpango au utaratibu wa Mungu wa wokovu kwa maana pana zaidi
  rationale: Muktadha wa karibu unasisitiza huduma aliyokabidhiwa Paulo kwa watu wa mataifa. ‘Uwakili’ huhifadhi wazo la jukumu la kibinafsi lililokabidhiwa bila kukataa mpango mpana wa Mungu.
- issue: Nguvu ya εἴ γε
  choice: Muundo wa sharti unaowasilisha jambo ambalo Paulo anaelekea kudhani kuwa ni kweli
  alternative: 'Sharti halisi linaloonyesha kutokuwa na uhakika: ‘ikiwa kweli’'
  rationale: Tafsiri kuu inahifadhi sharti la Kigiriki badala ya kulitatua kimafundisho; tanbihi inaeleza uwezekano wa nguvu ya kidokezo katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Uwakili’ ni neno fupi lenye uzito wa kibiblia, na tanbihi hutoa visawe vya kawaida zaidi. Alama zote za tanbihi zimewekwa katika matini kuu.
