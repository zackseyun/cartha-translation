  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: sw
  text: Mnaposoma hayo, mnaweza kufahamu ufahamu wangu kuhusu siri ya Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Masihi” au, kwa namna iliyozoeleka, “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: Mkisoma hayo
  rationale: Kirai hiki kinarejelea yale ambayo Paulo ametoka kuandika na kinaonyesha mazingira au njia ya wasomaji kufahamu; Kiswahili hiki ni cha asili na huhifadhi uhusiano huo wa kimuktadha.
- source_word: δύνασθε
  choice: mnaweza
  rationale: Hueleza uwezo wa wasomaji, kwa lugha ya kawaida na yenye heshima.
- source_word: νοῆσαι
  choice: kufahamu
  rationale: Hutoa maana ya kutambua au kuelewa kwa akili, huku kikiepuka kurudia neno lilelile mara moja.
- source_word: τὴν σύνεσίν μου
  choice: ufahamu wangu
  rationale: σύνεσις ni ufahamu au utambuzi wa kina; 'ufahamu wangu' ni wazi na haiongezi wazo lisilokuwamo katika chanzo.
- source_word: ἐν τῷ μυστηρίῳ
  choice: kuhusu siri
  rationale: ἐν hapa inaonyesha eneo au jambo ambalo ufahamu wa Paulo unalihusu; 'kuhusu' ni Kiswahili cha asili kuliko tafsiri ngumu ya moja kwa moja.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hutumika kama cheo kinachomaanisha Mtiwa-Mafuta; 'Masihi' huhifadhi maana ya cheo hicho katika Kiswahili.
theological_decisions:
- issue: Maana ya uhusiano katika 'siri ya Masihi'
  choice: Kudumisha kirai 'siri ya Masihi' bila kulifafanua zaidi
  alternative: siri inayomhusu Masihi
  rationale: Hali ya umilikishi ya τοῦ Χριστοῦ inaweza kuonyesha siri inayomhusu Masihi au inayohusiana naye kwa namna pana. Tafsiri haipaswi kuamua kimya kimya maana moja pekee.
- issue: Utafsiri wa Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki ni cheo; 'Masihi' huwasilisha maana yake, huku namna ya jadi 'Kristo' ikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Koma ya mwisho ya chanzo inaonyesha sentensi inaendelea katika mstari unaofuata, lakini aya hii imetolewa kama kipande kinachojitegemea.
