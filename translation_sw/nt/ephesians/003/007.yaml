  rationale: The revision changes only the expression of ἐγενήθην and the related idiom for service to the gospel. “Nilikuja kuwa” faithfully reflects the transition into the role while leaving the passive nuance available in the footnote. The repeated “kwa kadiri ya” and the final dash are retained to reflect the Greek structure and continuing sentence.
