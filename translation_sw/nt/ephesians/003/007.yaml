  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: sw
  text: ambayo nilikuja kuwa mtumishi wa Injili hiyo, kwa kadiri ya kipawa cha neema ya Mungu nilichopewa, kwa kadiri ya utendaji wa nguvu zake—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilifanywa kuwa mhudumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: ambayo ... wake
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea εὐαγγέλιον (‘injili’) katika mstari uliotangulia. Muundo ‘ambayo nilikuwa mtumishi wake’ ni wa kawaida katika Kiswahili na unaonyesha kuwa Paulo anatumikia injili.
- source_word: ἐγενήθην
  choice: nilikuwa
  rationale: Kitenzi γίνομαι hapa kinaonyesha kuingia katika hali au jukumu fulani. ‘Nilikuwa’ ni Kiswahili cha asili katika muundo huu, huku uwezekano wa maana ya kutendwa ukihifadhiwa katika tanbihi.
- source_word: διάκονος
  choice: mtumishi
  rationale: Neno hili humaanisha mtu anayehudumu. ‘Mtumishi’ linaeleza kazi hiyo bila kuingiza moja kwa moja maana ya cheo rasmi cha kanisa.
- source_word: κατὰ τὴν δωρεὰν
  choice: kwa kadiri ya kipawa
  rationale: κατά pamoja na hali ya kushutumiwa hapa huonyesha kipimo au ulingano. ‘Kwa kadiri ya’ huhifadhi uhusiano huo vizuri kuliko ‘kwa sababu ya’ au ‘kwa njia ya.’
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: cha neema ya Mungu
  rationale: Mlolongo wa vimilikishi umehifadhiwa kwa Kiswahili cha kawaida, ukionyesha kuwa kipawa kinahusiana kwa ndani na neema ya Mungu.
- source_word: τῆς δοθείσης μοι
  choice: nilichopewa
  rationale: 'Muundo huu wa uhusiano unamodifai ‘kipawa’ kwa uwazi na kuhifadhi hali ya kutendwa: Paulo ndiye aliyepokea kipawa hicho.'
- source_word: κατὰ τὴν ἐνέργειαν
  choice: kwa kadiri ya utendaji
  rationale: ἐνέργεια ni nguvu inayofanya kazi kwa ufanisi. ‘Utendaji’ huhifadhi wazo la nguvu inayotenda bila kutumia istilahi nzito isiyo ya kawaida.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: wa nguvu zake
  rationale: ‘Nguvu’ ni tafsiri ya kawaida na wazi ya δύναμις. Kiambishi ‘zake’ kinamrejelea Mungu katika muktadha.
theological_decisions:
- issue: Aina ya jukumu la Paulo kama διάκονος
  choice: mtumishi
  alternative: mhudumu; shemasi
  rationale: Muktadha unaeleza huduma ya Paulo kwa injili, si kwa uwazi cheo rasmi cha kanisa. ‘Mtumishi’ huhifadhi maana ya kiutendaji bila kuingiza muundo wa baadaye wa kikanisa.
- issue: Utendaji katika ἐγενήθην
  choice: nilikuwa
  alternative: nilifanywa kuwa
  rationale: Kigiriki kinaweza kuwa na kivuli cha kutendwa, lakini pia kwa kawaida humaanisha ‘nikawa.’ Tafsiri kuu inaacha kitenzi hicho katika hali yake yenye nafasi ya maana, huku neema na nguvu za Mungu katika sentensi zikionyesha chanzo cha huduma; tanbihi inatoa uwezekano wa kutendwa wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudiwa kwa ‘kwa kadiri ya’ umehifadhiwa ili kuonyesha ulinganifu wa vifungu viwili vya κατά katika Kigiriki. Alama ya kistari mwishoni imehifadhiwa kwa kuwa sentensi inaendelea katika muktadha.
