  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: sw
  text: ya kwamba watu wa Mataifa[a] ni warithi wenza, viungo vya mwili mmoja, na washiriki wenza wa ahadi katika Masihi Yesu[b] kwa njia ya Injili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mataifa.” Hapa neno hilo linamaanisha hasa watu wasio Wayahudi wanaojumuishwa pamoja na Israeli katika ahadi ya Mungu ya wokovu.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya jadi: “katika Kristo Yesu.” Neno la Kigiriki Χριστός limetafsiriwa hapa “Masihi” ili kuhifadhi maana yake ya cheo.'
    reason: alternative_rendering
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu neno hilo linamaanisha hasa watu wasio Wayahudi, si mataifa kama nchi za kisiasa. Kiswahili 'watu wa mataifa' kinaeleweka na pia huhifadhi uhusiano wake na maana ya msingi ya 'mataifa'.
- source_word: συγκληρονόμα
  choice: warithi pamoja
  rationale: Kiambishi σύν- kinasisitiza urithi unaoshirikishwa na wengine. 'Warithi pamoja' ni cha kawaida na huhifadhi nguvu ya ushirika.
- source_word: σύσσωμα
  choice: viungo pamoja vya mwili mmoja
  rationale: Neno hili adimu linaonyesha kuunganishwa katika mwili uleule. Tafsiri hii huhifadhi mfano wa mwili na ulinganifu wa maneno matatu yenye wazo la ushirika.
- source_word: συμμέτοχα
  choice: washiriki pamoja
  rationale: Hueleza kushiriki kitu kwa pamoja; uchaguzi huu ni wa asili katika Kiswahili na unaendeleza mpangilio wa 'pamoja' katika vifungu vitatu.
- source_word: τῆς ἐπαγγελίας
  choice: wa ahadi
  rationale: Huhifadhi umoja wa neno la Kigiriki na utegemezi wake kwa 'washiriki pamoja' bila kuongeza kwa kimya maelezo ya baraka iliyoahidiwa.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Hapa Χριστός bado ina nguvu ya cheo katika hoja ya Paulo kuhusu kutimizwa kwa ahadi na kuingizwa kwa watu wa mataifa.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: kwa njia ya habari njema
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au chombo. 'Kwa njia ya habari njema' ni wazi na huhifadhi maana ya εὐαγγέλιον.
- source_word: εἶναι
  choice: ya kwamba ... ni
  rationale: Kitenzi-jina hiki kinategemea maelezo ya siri katika mstari uliotangulia. 'Ya kwamba' huonyesha kwa kawaida kuwa yafuatayo ndiyo yaliyomo katika siri hiyo.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au umbo lililo kama jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika hoja hii ya historia ya wokovu, cheo cha Kimasihi bado kina uzito wa maana; 'Masihi' hukihifadhi bila kukifanya jina tu.
- issue: Mrejelewa wa ἔθνη
  choice: watu wa mataifa
  alternative: Mataifa
  rationale: Muktadha unahusu watu wasio Wayahudi wanaoshirikishwa pamoja na watu wa Israeli katika ahadi. Kuongeza 'watu wa' huzuia neno kueleweka kama nchi za kisiasa.
- issue: Nguvu ya σύσσωμα
  choice: viungo pamoja vya mwili mmoja
  alternative: wa mwili mmoja
  rationale: Tafsiri iliyochaguliwa huweka wazi mfano wa mwili uliomo katika neno adimu la Kigiriki bila kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya 'pamoja' yamehifadhiwa ili kuakisi muundo wenye nguvu wa maneno matatu ya Kigiriki yenye kiambishi σύν-. Sentensi inaanza kwa 'ya kwamba' kwa sababu mstari huu unaendeleza maelezo ya siri kutoka mstari uliotangulia.
