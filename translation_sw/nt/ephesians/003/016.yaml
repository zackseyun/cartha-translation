id: EPH.3.16
reference: Ephesians 3:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: sw
  text: ili awajalie, kwa kadiri ya utajiri wa utukufu wake, kutiwa nguvu kwa uweza kupitia Roho wake katika utu wenu wa ndani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na Kigiriki, “katika mtu wa ndani.” Usemi huu wa umoja unamaanisha nafsi ya ndani ya kila mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au maudhui ya ombi la Paulo kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: δῷ ὑμῖν
  choice: awajalie
  rationale: Kitenzi hiki kinafaa katika muktadha wa sala na kinadumisha wazo la Mungu kuwapa jambo kwa neema.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: kwa kadiri ya utajiri wa utukufu wake
  rationale: ‘Kwa kadiri ya’ huonyesha kipimo au kiwango, wala si kwamba Mungu anatoa sehemu ndogo tu kutoka katika utajiri wake. ‘Utajiri’ na ‘utukufu’ zinahifadhi uzito wa maneno ya Kigiriki.
- source_word: δυνάμει κραταιωθῆναι
  choice: kutiwa nguvu kwa uweza
  rationale: Hudumisha hali ya kutendwa ya κραταιωθῆναι na kutofautisha kitendo cha kuimarishwa na uweza unaotumika kukitekeleza.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: kupitia Roho wake
  rationale: ‘Kupitia’ huonyesha njia au mtendaji wa kuimarishwa; ‘Roho’ hapa anamrejelea Roho wa Mungu.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: katika utu wenu wa ndani
  rationale: Ni Kiswahili cha asili kinachoeleza nafsi ya ndani ya waamini. Kiwakilishi ‘wenu’ kinaweka wazi kwamba usemi wa umoja wa Kigiriki unawahusu wale wote wanaoombewa.
theological_decisions:
- issue: Anayerejelewa na πνεῦμα
  choice: Roho wa Mungu (‘Roho wake’)
  alternative: roho yake kama nguvu ya kimungu isiyo ya kibinafsi
  rationale: Muktadha unataja njia ambayo Mungu anawatia waamini nguvu, na matumizi ya Paulo yanaunga mkono kwa nguvu kwamba anayerejelewa ni Roho wa Mungu. Herufi kubwa inaonyesha rejeo hilo bila kuongeza cheo kisichopo katika aya.
- issue: Maana ya ἔσω ἄνθρωπον
  choice: utu wenu wa ndani
  alternative: mtu wa ndani
  rationale: ἄνθρωπος hapa ni usemi wa umoja unaowakilisha nafsi ya ndani ya kila mwamini, si wanaume pekee. ‘Utu wenu wa ndani’ ni wazi na jumuishi katika Kiswahili, huku tafsiri ya karibu zaidi na muundo wa Kigiriki ikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inadumisha mtiririko wa ombi la Paulo na hali ya kutendwa, huku ikiepuka usemi mgumu au unaoweza kueleweka kuwa unawahusu wanaume pekee.
