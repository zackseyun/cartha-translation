base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: sw
  text: 'Mimi, niliye mdogo kuliko watakatifu wote, nilipewa neema hii: kuwatangazia watu wa mataifa[a] habari njema kuhusu utajiri wa Masihi[b] usioweza kuchunguzika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wasio Wayahudi.” Neno la Kigiriki linaweza kutafsiriwa pia “mataifa”; katika muktadha huu linawahusu hasa watu wasio Wayahudi, tofauti na Wayahudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kristo.” Neno la Kigiriki Christos ni cheo chenye maana ya “Masihi” au “Mtiwa-Mafuta.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: mdogo kabisa
  rationale: Umbo hili lisilo la kawaida linasisitiza unyenyekevu mkubwa wa Paulo. ‘Mdogo kabisa’ ni Kiswahili cha sasa na cha kawaida kinachohifadhi msisitizo huo bila tungo nzito ya ‘mdogo kuliko aliye mdogo zaidi.’
- source_word: ἁγίων
  choice: watakatifu
  rationale: Katika matumizi ya Paulo, neno hili huwatambulisha waamini kuwa watu waliowekwa wakfu kwa Mungu. ‘Watakatifu’ ni fupi, sahihi, na limezoeleka katika Kiswahili cha Biblia.
- source_word: χάρις
  choice: neema
  rationale: Hapa linahusu fadhili ya Mungu iliyodhihirika kwa kumpa Paulo huduma hii. ‘Neema’ huhifadhi maana ya msingi na mwendelezo wa msamiati wa Paulo.
- source_word: ἔθνεσιν
  choice: watu wa mataifa
  rationale: Katika muktadha huu ni watu wasio Wayahudi, lakini neno la Kigiriki pia lina maana ya ‘mataifa.’ Tungo hii ni ya kawaida na huzuia maana ya kijiografia pekee; ufafanuzi umewekwa katika tanbihi.
- source_word: εὐαγγελίσασθαι
  choice: kuwatangazia ... habari njema
  rationale: Kitenzi chenyewe kina maana ya kutangaza habari njema. Ufafanuzi huu ni wazi kuliko ‘kuhubiri’ pekee na unaonyesha kwamba utajiri wa Masihi ndio habari njema inayotangazwa.
- source_word: ἀνεξιχνίαστον
  choice: usioweza kuchunguzika kikamilifu
  rationale: Neno linaonyesha kitu ambacho hakiwezi kufuatiliwa au kufahamika mpaka mwisho. Tafsiri hii huhifadhi wazo la uchunguzi huku ikiepuka kudokeza kwamba utajiri huo hauwezi kujulikana hata kidogo.
- source_word: πλοῦτος
  choice: utajiri
  rationale: Umoja wa Kigiriki unatumiwa kwa maana ya wingi na ukuu wa mema yaliyo katika Masihi. ‘Utajiri’ ni sitiari ya asili na inayoeleweka kwa Kiswahili.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta. ‘Masihi’ huhifadhi hadhi yake kama cheo badala ya kuitumia tu kama jina; ‘Kristo’ imeonyeshwa kama mbadala katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu neno linaweza kusikika kama cheo au kama jina lililozoeleka. ‘Masihi’ huonyesha maana ya cheo cha Mtiwa-Mafuta bila kuingiza msimamo wa dhehebu, huku ‘Kristo’ ikihifadhiwa katika tanbihi kama tafsiri ya kawaida.
- issue: Walengwa wa ἔθνεσιν
  choice: watu wa mataifa
  alternative: watu wasio Wayahudi
  rationale: Muktadha wa Waefeso unaelekeza hasa kwa wasio Wayahudi, lakini tafsiri kuu huhifadhi upana wa neno ‘mataifa.’ Tanbihi inaeleza rejeo linalowezekana zaidi katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unafuata hoja ya Kigiriki, huku ‘kuwatangazia ... habari njema kuhusu’ ukifanya kazi ya kitenzi εὐαγγελίσασθαι iwe wazi na ya asili kwa Kiswahili.
