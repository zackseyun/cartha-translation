  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: sw
  text: Katika yeye tuna ujasiri na uwezo wa kumkaribia Mungu kwa uhakika, kwa njia ya imani katika yeye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya uaminifu wake.” Kirai cha Kigiriki kinaweza kumaanisha ama imani katika yeye au uaminifu wake mwenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Ndani yake
  rationale: Kiwakilishi hiki cha kiume kinamrejelea Kristo katika muktadha uliotangulia. “Ndani yake” kinahifadhi wazo la kuwa katika umoja na Kristo.
- source_word: παρρησίαν
  choice: ujasiri
  rationale: Neno hili lina maana ya kusema au kutenda kwa uwazi na bila hofu. “Ujasiri” linafaa katika muktadha wa kumkaribia Mungu na linatofautishwa na πεποίθησις.
- source_word: προσαγωγὴν
  choice: njia ya kumkaribia Mungu
  rationale: Katika matumizi ya Paulo, neno hili humaanisha kupewa fursa ya kuingia au kumkaribia Mungu. Kirai hiki ni cha asili na wazi kwa wasomaji wa Kiswahili; “Mungu” limewekwa wazi kutokana na muktadha.
- source_word: ἐν πεποιθήσει
  choice: kwa uhakika
  rationale: 'Kirai hiki kinaonyesha namna ya kumkaribia Mungu: kwa hali ya kuamini kwa uthabiti, bila mashaka au hofu.'
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: kwa njia ya kumwamini yeye
  rationale: Hili linawasilisha usomaji wa genitivi tendwa, yaani imani inayoelekezwa kwa Kristo. Utata halisi wa kisarufi kuhusu uwezekano wa kumaanisha uaminifu wake umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya διὰ τῆς πίστεως αὐτοῦ
  choice: kwa njia ya kumwamini yeye
  alternative: kwa njia ya uaminifu wake
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa imani ya waumini katika Kristo au uaminifu wa Kristo mwenyewe. Matini kuu inafuata usomaji wa kawaida unaolingana na fursa ya waumini kumkaribia Mungu, huku usomaji mwingine ukihifadhiwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni wazi kwa msomaji wa kawaida bila kupoteza tofauti kati ya ujasiri na uhakika; utata wa kitheolojia katika πίστεως αὐτοῦ umehifadhiwa kwa tanbihi.
