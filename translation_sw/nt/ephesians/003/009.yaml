  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: sw
  text: na kuwafanya watu wote waone wazi usimamizi wa siri hiyo ni nini[a]—siri ambayo imefichwa tangu zama za kale[b] ndani ya Mungu, aliyeviumba vitu vyote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwakili wa siri hiyo ni nini,” au “mpango wa siri hiyo ni nini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “iliyofichwa kwa zama nyingi”; kwa tafsiri pana zaidi, “iliyofichwa tangu umilele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: kuwaangazia ... waone
  rationale: Inahifadhi picha ya mwanga iliyomo katika kitenzi cha Kigiriki huku ikieleza kwa Kiswahili cha kawaida kwamba jambo lililofichwa linawekwa wazi.
- source_word: πάντας
  choice: watu wote
  rationale: Ingawa neno lenyewe ni ‘wote,’ hapa linawahusu watu; kuongeza ‘watu’ huifanya maana iwe wazi na ya kawaida katika Kiswahili.
- source_word: τίς ἡ οἰκονομία
  choice: jinsi ... inavyotekelezwa
  rationale: οἰκονομία linaweza kumaanisha usimamizi, uwakili, mpango, au utaratibu wa utekelezaji. Muundo huu wa Kiswahili unaonyesha utendaji wa siri hiyo bila kuingiza maana ya kiufundi ya kimadhehebu.
- source_word: μυστήριον
  choice: siri
  rationale: Katika Kiswahili cha kawaida, ‘siri’ hueleza kusudi la Mungu lililokuwa limefichwa na sasa linafunuliwa; ‘fumbo’ lingeweza kudokeza kitendawili kisichoweza kufahamika.
- source_word: ἀποκεκρυμμένου
  choice: iliyofichwa
  rationale: Inawakilisha hali ya siri hiyo kuwa imefichwa, ambayo inatokana na kitendo cha awali, kulingana na kauli timilifu tendwa ya Kigiriki.
- source_word: ἀπὸ τῶν αἰώνων
  choice: tangu zama za kale
  rationale: Inadumisha wazo la kufichwa katika zama zilizopita bila kulifanya moja kwa moja kuwa ‘tangu umilele,’ ambalo ni tafsiri pana zaidi.
- source_word: ἐν τῷ θεῷ
  choice: ndani ya Mungu
  rationale: Inahifadhi kwa karibu kihusishi ἐν na wazo kwamba siri hiyo ilikuwa imefichwa katika Mungu, si tu ilikuwa pamoja naye.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: aliyeviumba vitu vyote
  rationale: Kishazi rejeshi ni cha kawaida katika Kiswahili na kinaonyesha wazi kwamba Mungu ndiye Muumba wa kila kitu.
theological_decisions:
- issue: Maana ya οἰκονομία kuhusiana na siri
  choice: jinsi siri hiyo inavyotekelezwa
  alternative: usimamizi wa siri hiyo; uwakili wa siri hiyo; mpango wa siri hiyo
  rationale: Tafsiri hii inaonyesha jinsi kusudi lililofichwa linavyosimamiwa au kutekelezwa, bila kulifanya neno hilo limaanishe tu yaliyomo katika siri wala kuingiza mfumo wa baadaye wa kimadhehebu.
- issue: Nguvu ya wakati katika ἀπὸ τῶν αἰώνων
  choice: tangu zama za kale
  alternative: kwa zama nyingi; tangu umilele
  rationale: Kigiriki kinataja zama, si umilele moja kwa moja. Uchaguzi huu unadumisha tofauti hiyo na tanbihi inaonyesha tafsiri nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imeachwa kama mwendelezo wa kusudi la Paulo katika muktadha. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
