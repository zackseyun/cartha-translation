  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: sw
  text: ambayo katika vizazi vingine haikujulishwa kwa wanadamu[a] jinsi ilivyofunuliwa sasa kwa mitume na manabii wake watakatifu katika Roho[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa wana wa watu”; usemi huo unamaanisha wanadamu au watu kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa njia ya Roho”; kirai cha Kigiriki kinaweza kueleza nyanja ambamo ufunuo ulitokea au njia iliyotumiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano chenye umoja kinairejelea siri iliyotajwa katika mstari uliotangulia bila kuingiza wazi nomino hiyo katika mstari huu.
- source_word: ἑτέραις γενεαῖς
  choice: katika vizazi vingine
  rationale: Dativi hapa ina maana ya wakati; “vingine” linaakisi ἑτέραις kwa karibu kuliko “vilivyopita,” huku muktadha ukionyesha vizazi vya awali.
- source_word: οὐκ ἐγνωρίσθη
  choice: haikujulishwa
  rationale: Huhifadhi hali ya kutendwa na maana ya γνωρίζω ya kufanya jambo lijulikane, si tu kutokuwa na maarifa kulihusu.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: kwa wanadamu
  rationale: Hii ni nahau yenye maana ya watu kwa ujumla. Kiswahili “wana wa watu” kingekuwa tafsiri ya umbo la maneno lakini si ya kawaida na kingeweza kuficha maana jumuishi; tanbihi inahifadhi umbo halisi.
- source_word: ὡς νῦν
  choice: kama ilivyofunuliwa sasa
  rationale: '“Kama” huhifadhi ulinganisho wa namna au kiwango: haikujulishwa zamani jinsi ambavyo sasa imefunuliwa.'
- source_word: ἀπεκαλύφθη
  choice: ilivyofunuliwa
  rationale: “Kufunuliwa” ni neno la kawaida na lenye uzito unaofaa kwa tendo la ufunuo wa Mungu, huku likihifadhi hali ya kutendwa.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: kwa mitume wake watakatifu na manabii
  rationale: Muundo huu unaruhusu “watakatifu” kueleweka kuwaeleza mitume na manabii kwa pamoja, kama uratibu wa Kigiriki unavyodokeza; “wake” haimtambulishi zaidi mwenyewe kuliko chanzo.
- source_word: ἐν πνεύματι
  choice: katika Roho
  rationale: Herufi kubwa inaonyesha rejeo linalowezekana sana kwa Roho Mtakatifu; “katika” huhifadhi uwezekano wa maana ya nyanja au chombo bila kuamua kimya kimya.
theological_decisions:
- issue: Rejeo la πνεύματι
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu au hali/namna ya kiroho
  rationale: Muktadha wa ufunuo wa Mungu kwa mitume na manabii unaunga mkono sana rejeo kwa Roho Mtakatifu, lakini tanbihi na kihusishi “katika” vinahifadhi mvutano wa kisarufi.
- issue: Nguvu ya ulinganisho katika ὡς νῦν
  choice: tofauti ya namna au kiwango cha kufunuliwa
  alternative: kutokujulikana kabisa katika vizazi vya awali
  rationale: ὡς (“kama/jinsi”) huweka ulinganisho; tafsiri haipaswi kuondoa uwezekano kwamba siri hiyo haikufunuliwa zamani kwa namna au kiwango cha sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wanadamu” ni wazi na jumuishi; tanbihi inahifadhi nahau ya Kisemiti. Mpangilio wa sentensi umehifadhi uhusiano wake na mstari uliotangulia, kwa hiyo inaanza kwa “ambayo” na kumalizika kwa koma.
