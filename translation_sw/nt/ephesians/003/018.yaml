  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: sw
  text: ili mpate kuwa na nguvu za kutosha kufahamu[a], pamoja na watakatifu wote, upana na urefu na kimo na kina ni nini[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuelewa.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hakitaji wazi vipimo hivi vinaeleza nini; wengi huona wazo hilo likikamilishwa katika mstari unaofuata kwa kutaja upendo wa Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi au matokeo ya ombi linalotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: ἐξισχύσητε
  choice: mpate kuwa na nguvu za kutosha
  rationale: Inahifadhi wazo la kupewa nguvu au uwezo wa kutosha kwa tendo linalofuata, badala ya kusema tu kwamba waelewe.
- source_word: καταλαβέσθαι
  choice: kufahamu
  rationale: Katika muktadha huu neno linamaanisha kushika au kuelewa jambo kwa akili; “kufahamu” ni la asili, lenye uzito unaofaa, bila kudai ufahamu kamili.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: pamoja na watakatifu wote
  rationale: Inahifadhi ushiriki wa pamoja na istilahi ya kawaida ya Paulo kwa waumini bila kuibadili kuwa maelezo mapana zaidi.
- source_word: τί
  choice: ni nini
  rationale: Inawasilisha swali lisilo la moja kwa moja kuhusu vipimo hivyo bila kulifasiri kuwa “jinsi vilivyo vikubwa.”
- source_word: τὸ πλάτος
  choice: upana
  rationale: Ni neno la kawaida la Kiswahili kwa kipimo cha πλάτος.
- source_word: μῆκος
  choice: urefu
  rationale: Ni kilinganishi cha moja kwa moja na cha kawaida cha kipimo hiki.
- source_word: ὕψος
  choice: kimo
  rationale: “Kimo” hutofautisha kipimo cha kwenda juu na “urefu,” ambao tayari umetumiwa kwa μῆκος.
- source_word: βάθος
  choice: kina
  rationale: Ni neno la moja kwa moja na la kawaida kwa kipimo cha βάθος.
theological_decisions:
- issue: Kitu kinachoelezwa na vipimo vinne
  choice: Kuacha bila kutajwa kitu ambacho upana, urefu, kimo na kina vinakieleza.
  alternative: Kutaja hapa kwamba vipimo hivyo ni vya upendo wa Masihi, au vya mpango na utimilifu wa Mungu.
  rationale: Kigiriki cha mstari huu hakitaji wazi kitu kinachopimwa. Kukiongeza kungeingiza tafsiri kutoka muktadha, hasa mstari unaofuata, na kuondoa mvutano halisi wa kisintaksia na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “nguvu za kutosha” unadumisha msisitizo wa uwezo unaohitajika, na mpangilio wa vipimo unaacha kile vinachorejelea bila kutajwa kama ilivyo katika Kigiriki.
