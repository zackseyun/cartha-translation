lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: kwa ufunuo
  rationale: Kirai hiki kinaonyesha namna au njia ambayo siri ilijulishwa. “Kwa ufunuo” ni Kiswahili cha kawaida na huacha wazi kama κατά hapa inasisitiza njia au kufuatana na ufunuo.
- source_word: ἐγνωρίσθη μοι
  choice: ilijulishwa kwangu
  rationale: Huhifadhi kauli ya kutendwa ya kitenzi γνωρίζω na haimtaji moja kwa moja mtendaji ambaye Kigiriki hakumtaji. Pia huepuka kurudia neno “ufunuo” kwa kusema “ilifunuliwa.”
- source_word: τὸ μυστήριον
  choice: ile siri
  rationale: Katika matumizi ya Paulo, μυστήριον ni kusudi la Mungu lililokuwa limefichwa kisha likafunuliwa. “Siri” ni neno la kawaida na linaloeleweka kwa wasomaji wa Kiswahili, huku muktadha ukitoa uzito wake wa kitheolojia.
- source_word: καθὼς
  choice: kama
  rationale: Kiunganishi hiki cha kulinganisha kinaunganisha kauli na yale Paulo aliyokuwa ameandika hapo awali kwa njia ya kawaida na sahihi.
- source_word: προέγραψα
  choice: nilivyoandika hapo awali
  rationale: Katika muktadha huu kitenzi kinarejelea jambo aliloandika mapema, yaelekea katika barua hii; tafsiri haiongezi mahali pasipotajwa wazi.
- source_word: ἐν ὀλίγῳ
  choice: kwa ufupi
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha maana ya kuandika kwa maneno machache.
theological_decisions:
- issue: Maana ya μυστήριον katika matumizi ya Paulo
  choice: ile siri
  alternative: mpango wa Mungu uliofichwa
  rationale: Aya hii inaitaja siri bila kufafanua kikamilifu yaliyomo. Kutafsiri kwa ufafanuzi wa “mpango wa Mungu uliofichwa” kungeingiza maelezo kutoka muktadha unaofuata badala ya kuhifadhi mvutano wa aya yenyewe.
- issue: Mtendaji wa ἐγνωρίσθη
  choice: 'kuhifadhi kauli ya kutendwa: “ilijulishwa kwangu”'
  alternative: Mungu alinijulisha
  rationale: Muktadha unaelekeza kwa Mungu, lakini aya hii haitaji mtendaji waziwazi; tafsiri haipaswi kumwongeza kimatamshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kauli ya kutendwa umehifadhiwa, na neno “siri” limeachwa lifafanuliwe na muktadha wa karibu.
