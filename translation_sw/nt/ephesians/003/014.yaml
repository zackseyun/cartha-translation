  text: For this reason I bend my knees to the Father,
translation:
  language: sw
  text: Kwa sababu hiyo, ninapiga magoti mbele za Baba,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha sababu au msingi wa kitendo kinachofuata. “Kwa sababu hiyo” ni Kiswahili cha kawaida na kinaendeleza uhusiano na hoja iliyotangulia.
- source_word: κάμπτω τὰ γόνατά μου
  choice: ninapiga magoti
  rationale: Ingawa kwa neno kwa neno ni “ninapinda magoti yangu,” nahau ya Kiswahili “kupiga magoti” huhifadhi picha ya mkao wa kusali bila kutoa maana zaidi ya maandishi.
- source_word: πρὸς
  choice: mbele za
  rationale: Katika muktadha wa sala kwa mtu, πρός inaonyesha kuelekezwa kwa sala kwake. “Mbele za” ni usemi wa kawaida wa Kiswahili kwa kupiga magoti katika uwepo wa anayeombwa, ingawa “kwa” pia lingewezekana.
- source_word: πατέρα
  choice: Baba
  rationale: Muktadha unaonyesha kuwa Paulo anamwelekea Mungu katika sala. Herufi kubwa inaonyesha matumizi ya “Baba” kama jina la kumrejelea Mungu, bila kuongeza maelezo yasiyomo katika mstari.
theological_decisions:
- issue: Iwapo πατέρα itafsiriwe kama jina la kimungu
  choice: Baba
  alternative: baba
  rationale: Muktadha ni sala inayoelekezwa kwa Mungu, na mstari unaofuata unaendeleza lugha ya ubaba. “Baba” kwa herufi kubwa hutambulisha rejeo hilo kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninapiga magoti” ni ya asili zaidi kuliko “ninapinda magoti yangu,” huku ikidumisha wazi mkao wa sala.
