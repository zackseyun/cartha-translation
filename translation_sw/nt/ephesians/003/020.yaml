base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: sw
  text: Kwa yeye awezaye kufanya zaidi sana kuliko yote tunayoyaomba au tunayoyawaza[a], kulingana na nguvu inayotenda kazi ndani yetu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunayoyabuni akilini.” Neno la Kigiriki linaweza kumaanisha mambo ambayo akili inaweza kuyawaza au kuyabuni.
    reason: lexical_alternative
  - marker: b
    text: Au, “miongoni mwetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: Kwa yeye awezaye
  rationale: Muundo huu huhifadhi kirai nomino cha kishiriki katika hali ya utoaji, huku ukisomeka kwa kawaida kama mwanzo wa sifa unaoendelea katika mstari wa 21.
- source_word: δὲ
  choice: haikutafsiriwa kwa neno la pekee
  rationale: Hapa δέ ni kiunganishi hafifu cha mpito kuelekea sifa; katika Kiswahili mpito huo unaeleweka bila kuongeza ‘sasa,’ ambalo lingeweza kusikika kama rejeo la wakati.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: kwa wingi kupita sana yote
  rationale: Maneno haya yanawasilisha msisitizo mkubwa wa Kigiriki kwamba uwezo huo huzidi kwa kiwango kikubwa yote yanayotajwa, bila kutumia Kiswahili kisicho cha kawaida.
- source_word: ποιῆσαι
  choice: kufanya
  rationale: ‘Kufanya’ huhifadhi upana na urahisi wa ποιέω bila kuibana kuwa ‘kutimiza.’
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: yote tunayoomba au tunayowaza
  rationale: ‘Yote’ huleta kwa kawaida uhusiano wa kulinganisha, na ‘kuwaza’ huhifadhi maana pana ya shughuli au dhana ya akili.
- source_word: κατὰ τὴν δύναμιν
  choice: kulingana na nguvu
  rationale: ‘Kulingana na’ huonyesha kipimo au kiwango kinachoelezwa na κατά, badala ya kuifanya nguvu kuwa chombo tu.
- source_word: τὴν ἐνεργουμένην
  choice: inayotenda kazi
  rationale: Kauli hii ya sasa huonyesha nguvu iliyo hai na yenye matokeo kwa kuendelea.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Hii huhifadhi maana ya nguvu inayofanya kazi ndani ya waamini, huku uwezekano wa maana ya kijumuiya ukibaki wazi katika muktadha.
theological_decisions:
- issue: Anayerejelewa kama mpokeaji wa sifa
  choice: ‘Kwa yeye awezaye’ bila kuongeza ‘Mungu’
  alternative: ‘Kwa Mungu awezaye’
  rationale: Muktadha humtambulisha Mungu, lakini mstari huu hauna nomino ‘Mungu’; tafsiri huhifadhi muundo na mwendelezo wa sifa bila kuongeza nomino hiyo.
- issue: Maana ya nguvu inayofanya kazi kwa waamini
  choice: ‘nguvu inayotenda kazi ndani yetu’
  alternative: ‘nguvu inayotenda kazi miongoni mwetu’
  rationale: Chaguo hili hudumisha dai pana la maandiko kuhusu nguvu ya Mungu iliyo hai ndani ya waamini bila kulifungamanisha na maelezo maalumu ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Alama za tanbihi [a] na [b] zimewekwa katika matini. Koma ya mwisho imehifadhiwa kwa sababu sentensi ya sifa inaendelea katika mstari wa 21.
