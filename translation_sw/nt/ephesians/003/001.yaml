  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: sw
  text: Kwa sababu hiyo, mimi Paulo, mfungwa wa Masihi Yesu[a] kwa ajili yenu ninyi watu wa mataifa[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo Yesu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Yaani, watu wasio Wayahudi. Pia inaweza kutafsiriwa: “kwa niaba yenu ninyi watu wa mataifa.”'
    reason: clarification_and_lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaelekeza nyuma kwenye hoja iliyotangulia na kuonyesha sababu au msingi wa maneno yanayofuata; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: ἐγὼ Παῦλος
  choice: mimi Paulo
  rationale: Kiwakilishi kilichotamkwa wazi katika Kigiriki kinaweka mkazo kwa Paulo; “mimi Paulo” huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: ὁ δέσμιος
  choice: mfungwa
  rationale: Neno hili humaanisha mtu anayeshikiliwa kifungoni; “mfungwa” ni tafsiri ya moja kwa moja na ya kawaida bila kuongeza wazo la minyororo ambalo halikutajwa wazi.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: wa Masihi Yesu
  rationale: Χριστός hapa ni cheo cha Yesu. “Masihi Yesu” huhifadhi maana ya cheo hicho, huku kihusishi cha Kiswahili “wa” kikihifadhi uwezekano kwamba Paulo ni mfungwa aliye wa Masihi au mfungwa kwa sababu ya kumtumikia.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Katika muktadha huu ὑπέρ huonyesha manufaa au sababu inayowahusu wasomaji; “kwa ajili yenu” ni ya asili na huhifadhi upana huo wa maana.
- source_word: τῶν ἐθνῶν
  choice: ninyi watu wa mataifa
  rationale: Hapa neno hili linawatambulisha wasomaji kuwa watu wasio Wayahudi, si mataifa kama maeneo ya kisiasa. “Watu wa mataifa” ni usemi unaoeleweka katika mazingira ya kibiblia, na “ninyi” huonyesha wazi kwamba ni maelezo ya ὑμῶν.
theological_decisions:
- issue: Je, Χριστοῦ itafsiriwe kama cheo au kama umbo lililo karibu na jina?
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός ni cheo chenye maana ya aliyetiwa mafuta. “Masihi” huiwasilisha maana hiyo; umbo la jadi “Kristo Yesu” limehifadhiwa katika tanbihi.
- issue: Maana ya uhusiano katika “mfungwa wa Masihi Yesu”
  choice: Kudumisha usemi mpana “wa Masihi Yesu”
  alternative: mfungwa kwa sababu ya Masihi Yesu
  rationale: Kauli ya Kigiriki inaweza kusisitiza kwamba Paulo ni mfungwa aliye chini ya mamlaka au katika utumishi wa Masihi, huku kifungo chake cha kibinadamu kikiwa kwa sababu ya huduma hiyo. Tafsiri kuu haifungi maana kwenye upande mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mstari umeachwa ukiishia kwa kistari kirefu kwa sababu sentensi ya Paulo inaendelea katika mistari inayofuata.
