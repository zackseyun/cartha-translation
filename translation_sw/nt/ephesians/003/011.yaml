  text: κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν ⸀τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: sw
  text: kulingana na kusudi la milele[a] alilolitimiza katika[b] Masihi[c] Yesu, Bwana wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusudi la zama.” Kigiriki kinasema kwa maana halisi zaidi, “kusudi la zama.”
    reason: lexical_alternative
  - marker: b
    text: Au “kupitia Masihi Yesu.” Kihusishi cha Kigiriki ni “katika,” lakini katika muktadha kinaweza pia kueleweka kuwa cha chombo.
    reason: alternative_reading
  - marker: c
    text: 'Kigiriki: “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: kulingana na
  rationale: Pamoja na πρόθεσιν, κατά huonyesha kupatana au kuwiana na jambo fulani; “kulingana na” ni Kiswahili cha kawaida na sahihi.
- source_word: πρόθεσιν
  choice: kusudi
  rationale: Neno hili hapa linaonyesha nia au mpango wa Mungu uliowekwa kimakusudi; “kusudi” huhifadhi uzito huo bila kuongeza maelezo.
- source_word: τῶν αἰώνων
  choice: la milele
  rationale: Ingawa muundo wa Kigiriki ni “la zama,” maana yake katika muktadha ni kusudi lisilo na mpaka wa wakati. “La milele” ni la asili zaidi katika Kiswahili, huku tanbihi ikihifadhi muundo halisi na uwezekano wake.
- source_word: ἣν
  choice: aliloli-
  rationale: Kiwakilishi rejeshi kinarejelea “kusudi”; katika Kiswahili kimeunganishwa kwa kawaida na kitenzi kama “alilolitimiza.”
- source_word: ἐποίησεν
  choice: alilolitimiza
  rationale: Ingawa ποιέω kwa msingi humaanisha kufanya, pamoja na “kusudi” hapa inaeleweka kuwa kulitekeleza au kulifikisha kwenye utimilifu.
- source_word: ἐν
  choice: katika
  rationale: Hili ndilo linalolingana moja kwa moja na ἐν na linaacha wazi kama maana ni ya muungano/eneo la kitheolojia au ya chombo; uwezekano wa “kupitia” umewekwa tanbihini.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi maana na asili yake ya Kiyahudi.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: κυρίῳ
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος na huhifadhi uzito wa cheo hiki katika Agano Jipya.
- source_word: ἡμῶν
  choice: wetu
  rationale: Ni kiwakilishi milikishi kinachomfafanua “Bwana.”
theological_decisions:
- issue: Maana ya τῶν αἰώνων katika πρόθεσιν τῶν αἰώνων
  choice: kusudi la milele
  alternative: kusudi la zama
  rationale: “La milele” huwasilisha maana ya muda isiyo na kikomo kwa Kiswahili cha kawaida, lakini tanbihi inahifadhi usemi halisi “la zama” ili kutoficha namna ya Kigiriki.
- issue: Nguvu ya ἐν katika ἐν τῷ Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  alternative: kupitia Masihi Yesu
  rationale: “Katika” huhifadhi kihusishi cha Kigiriki bila kuamua kimya kimya kwamba ni cha chombo. Tanbihi inaonyesha kuwa maana ya “kupitia” pia inawezekana katika muktadha.
- issue: Jinsi ya kutafsiri Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki neno linafanya kazi kama cheo. “Masihi” huonyesha wazi maana ya cheo hicho bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo “alilolitimiza” unaunganisha kwa uwazi kiwakilishi rejeshi na “kusudi,” huku tanbihi zikihifadhi utata halisi wa τῶν αἰώνων na ἐν.
