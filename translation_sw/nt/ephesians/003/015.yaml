lexical_decisions:
- source_word: ἐξ οὗ
  choice: ambaye kutokana naye
  rationale: Muundo huu unaendeleza uhusiano na “Baba” katika mstari uliotangulia na kuonyesha chanzo bila kuongeza moja kwa moja wazo la “kutokana naye hupata jina.”
- source_word: πᾶσα
  choice: kila
  rationale: Pamoja na nomino ya umoja πατριά, “kila” linaonyesha maana ya kugawa kwa kila kundi, huku uwezekano wa maana “jamaa yote” ukihifadhiwa katika tanbihi.
- source_word: πατριὰ
  choice: jamaa
  rationale: “Jamaa” kwa kawaida humaanisha kundi la watu wenye uhusiano wa kifamilia au ukoo, hivyo linaweza kuwakilisha family, clan, au lineage bila kutumia dhana ya kinadharia ya “ubaba.” Pia linahifadhi kwa kiasi mwangwi wa kifamilia unaofuata neno “Baba.”
- source_word: ἐν οὐρανοῖς
  choice: mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili kwa mahali katika ulimwengu wa mbinguni, ingawa nomino ya Kigiriki iko katika wingi.
- source_word: ἐπὶ γῆς
  choice: duniani
  rationale: Ni tafsiri ya kawaida na sahihi ya mahali kwa maana ya “juu ya nchi/dunia.”
- source_word: ὀνομάζεται
  choice: hupewa jina
  rationale: Huwasilisha hali ya kutendwa ya kitenzi na hali yake ya sasa ya kijumla. Ni ya asili zaidi kwa Kiswahili kuliko “huitwa kwa jina,” na haifanyi maana ya kutegemea chanzo kuwa wazi kupita kiasi.
theological_decisions:
- issue: Maana ya πᾶσα πατριὰ kuhusiana na “Baba” katika mstari uliotangulia
  choice: kila jamaa
  alternative: jamaa yote; ubaba wote
  rationale: Tafsiri kuu inadumisha maana ya kawaida ya πατριά kama kundi la kifamilia na nguvu ya kugawa ya πᾶσα, bila kuamua kwamba Paulo anamaanisha familia moja tu ya pamoja au dhana ya kinadharia ya ubaba. Uhusiano wa maneno kati ya πατήρ na πατριά hauwezi kuigwa kikamilifu kwa Kiswahili, kwa hiyo uwezekano mwingine unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Jamaa” limetumiwa badala ya “familia” ili kubeba upana wa kundi la kifamilia, ukoo, au nasaba. Alama ya tanbihi imewekwa baada ya koma kwa kufuata muundo wa kifungu kilichotolewa.
