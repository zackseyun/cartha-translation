  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: sw
  text: na kuujua upendo wa Masihi[a] unaopita maarifa, ili mjazwe hata kufikia utimilifu wote wa Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama ilivyotafsiriwa kimapokeo, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “mjazwe kwa utimilifu wote wa Mungu.” Kigiriki kinasema kwa ufupi, “mjazwe hata kufikia utimilifu wote wa Mungu,” jambo linaloweza kusisitiza kusonga kuelekea kipimo kamili cha utimilifu wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: kuujua
  rationale: Kitenzi hiki kinatafsiriwa moja kwa moja kuwa “kuujua”; kiambishi cha yambwa “-u-” kinaurejelea upendo na kinaacha maana ihusishe maarifa ya akili pamoja na ujuzi wa uzoefu.
- source_word: τε
  choice: na
  rationale: Huunganisha ombi hili kwa upole na maombi yaliyotangulia; “na” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: unaopita maarifa
  rationale: Usemi huu unadumisha uhusiano wa kisarufi na “upendo” na pia fumbo la kuujua upendo ambao unapita maarifa.
- source_word: ἀγάπην
  choice: upendo
  rationale: Hili ndilo neno la kawaida, la wazi, na linalofaa kwa ἀγάπη katika muktadha huu.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός inabaki kuwa cheo chenye maana ya Masihi. Muundo “wa Masihi” unafuata hali ya umilikishi ya Kigiriki bila kuamua wazi ikiwa ni upendo wake au upendo unaoelekezwa kwake.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kwa kawaida kusudi au matokeo yanayokusudiwa.
- source_word: πληρωθῆτε
  choice: mjazwe
  rationale: 'Huhifadhi hali ya kutendwa na hali tegemezi ya kitenzi: “ili mjazwe.”'
- source_word: εἰς
  choice: hadi kufikia
  rationale: Huhifadhi mwelekeo kuelekea lengo au kipimo badala ya kuufanya usemi huo umaanishe tu “kujazwa na.”
- source_word: πᾶν τὸ πλήρωμα
  choice: utimilifu wote
  rationale: Huhifadhi msisitizo na upana wa usemi wa Kigiriki huku ikiwa lugha ya Kiswahili inayoeleweka.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Hufuata moja kwa moja umilikishi wa Kigiriki bila kuongeza ufafanuzi wa chanzo au namna.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki ni cheo, kwa hiyo “Masihi” linaonyesha maana yake; tafsiri ya kimapokeo “Kristo” imetolewa katika tanbihi.
- issue: Maana ya “upendo wa Masihi”
  choice: Muundo wenye uwezekano wa maana zaidi ya moja umehifadhiwa
  alternative: upendo wa Masihi kwetu; upendo kwa Masihi
  rationale: Muktadha unaelekea sana kwenye upendo wa Masihi kwa waamini, lakini umilikishi wa Kigiriki hauufafanui uhusiano huo moja kwa moja. “Upendo wa Masihi” haumalizi mvutano huo kimya kimya.
- issue: Tafsiri ya εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: mjazwe hadi kufikia utimilifu wote wa Mungu
  alternative: mjazwe kwa utimilifu wote wa Mungu
  rationale: Usemi wa Kigiriki ni mfupi na mzito kiteolojia. “Hadi kufikia” huhifadhi mwelekeo kuelekea lengo au kipimo bila kudai utambulisho wa kimetafizikia wala kufuta nguvu ya εἰς.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi tabia ya sala inayoendelea kutoka mistari iliyotangulia. “Unaopita maarifa” ni wa kawaida na hudumisha fumbo la kimakusudi la kujua kisichoweza kufikiwa kikamilifu kwa maarifa.
