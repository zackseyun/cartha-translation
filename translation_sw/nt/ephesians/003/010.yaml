lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi; “ili” ni ya kawaida na huhifadhi maana ya kusudi.
- source_word: γνωρισθῇ
  choice: ijulikane
  rationale: Huhifadhi hali ya kutendwa ya kitenzi kwa Kiswahili cha asili na kinachoeleweka.
- source_word: νῦν
  choice: sasa
  rationale: Ni tafsiri ya moja kwa moja ya kielezi cha wakati.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: kwa watawala na wenye mamlaka
  rationale: Huhifadhi istilahi mbili za Kigiriki bila kuzifafanua moja kwa moja kuwa malaika au nguvu za kiroho.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: walio katika ulimwengu wa mbinguni
  rationale: Huwasilisha eneo la kimbingu na pia huunganisha kirai hicho kwa kawaida na watawala na wenye mamlaka.
- source_word: διὰ τῆς ἐκκλησίας
  choice: kupitia kanisa
  rationale: διά pamoja na uhusika milikishi huonyesha njia au chombo; “kupitia kanisa” ni ya asili na wazi.
- source_word: ἡ πολυποίκιλος σοφία
  choice: hekima ... yenye sura nyingi
  rationale: Huwasilisha wingi wa namna au vipengele vya πολυποίκιλος kwa lugha inayoeleweka, bila kutumia istilahi nzito.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Huhifadhi uhusiano wa umilikaji au chanzo kwa namna ya moja kwa moja.
theological_decisions:
- issue: Utambulisho wa “watawala na wenye mamlaka”
  choice: Maandishi makuu yanawaweka katika ulimwengu wa mbinguni bila kuwataja moja kwa moja kuwa malaika au pepo.
  alternative: Kuwatafsiri wazi kuwa nguvu za kiroho au watawala wa kibinadamu.
  rationale: Kirai ἐν τοῖς ἐπουρανίοις kinaelekeza kwa nguvu za ulimwengu wa kiroho, lakini maandishi yenyewe yanatumia majina mapana; hivyo tafsiri inadumisha upana huo na tanbihi inaeleza uwezekano mkubwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umehifadhi kusudi la ἵνα, njia inayotajwa na διὰ, na kutokubainishwa kikamilifu kwa nguvu za kimbingu.
