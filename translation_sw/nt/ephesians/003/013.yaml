  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: sw
  text: Kwa hiyo, nawaomba msikate tamaa kwa sababu ya mateso yangu kwa ajili yenu[a], ambayo ni utukufu wenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msivunjike moyo kwa sababu ya mateso yangu kwa ajili yenu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, mateso ya Paulo kwa ajili yao yanawaletea heshima katika kusudi la Mungu la wokovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: αἰτοῦμαι
  choice: nawaomba
  rationale: Muktadha unaonyesha kwamba Paulo anawaelekezea wasomaji ombi lake; kiambishi cha yambwa -wa- kinaweka wazi walengwa waliodokezwa katika Kigiriki.
- source_word: μὴ ἐγκακεῖν
  choice: msikate tamaa
  rationale: Nahau hii ya kawaida ya Kiswahili huwasilisha maana ya kutopoteza moyo au kutovunjika moyo, bila kuigeuza kuwa wazo la uchovu wa kimwili.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: kwa sababu ya mateso yangu
  rationale: Ingawa ἐν kwa msingi ni ‘katika,’ hapa inaonyesha sababu au jambo linaloweza kuwavunja moyo; ‘kwa sababu ya’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: θλίψεσίν
  choice: mateso
  rationale: Neno hili linaonyesha dhiki na taabu nzito anazopata Paulo; ‘mateso’ ni la kawaida, lenye uzito unaofaa, na linaendana na muktadha wa kifungo chake.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Huhifadhi maana ya kutenda au kuteseka kwa manufaa ya wale wanaotajwa.
- source_word: ἥτις
  choice: ambayo
  rationale: Kiwakilishi hiki kinaunganisha sentensi na ‘mateso yangu kwa ajili yenu’ kama wazo zima bila kufafanua zaidi ya maandishi.
- source_word: δόξα ὑμῶν
  choice: utukufu wenu
  rationale: ‘Utukufu’ huhifadhi uzito mpana wa δόξα kuliko ‘heshima’ pekee na haiondoi mvutano wa usemi kwamba mateso ya Paulo ni utukufu wao.
theological_decisions:
- issue: Kirejeleo cha ἥτις ἐστὶν δόξα ὑμῶν
  choice: Kauli ‘ambayo ni utukufu wenu’ inarejelea mateso ya Paulo kwa ajili yao kama wazo zima.
  alternative: Kauli hiyo inaweza kurejelea kwa upana zaidi huduma ya Paulo pamoja na mateso yake kwa ajili yao.
  rationale: ‘Mateso yangu’ ndicho kitangulizi cha karibu, lakini muundo wa Kiswahili unabaki mpana kiasi cha kuruhusu maana ya huduma na mateso yake kwa ujumla bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Mhusika wa μὴ ἐγκακεῖν
  choice: Waefeso ndio wanaoombwa wasikate tamaa.
  alternative: Inawezekana kisarufi kuelewa kwamba Paulo anaomba yeye mwenyewe asikate tamaa, labda kwa kumwomba Mungu.
  rationale: Mtiririko wa sentensi na ‘kwa ajili yenu’ unaunga mkono kwa nguvu ombi linalowaelekea wasomaji; tafsiri ‘nawaomba msikate tamaa’ ni ya asili na inaendana na uelewa mkuu wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msikate tamaa’ ni nahau inayoeleweka kwa urahisi, huku ‘mateso’ na ‘utukufu’ zikihifadhi uzito wa lugha ya Paulo. Alama zote za tanbihi zimewekwa ndani ya maandishi.
