  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: sw
  text: Utukufu uwe kwake katika kanisa na katika Masihi Yesu[a] katika vizazi vyote, milele na milele. Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.” Cheo cha Kigiriki Χριστός kimetafsiriwa “Masihi” hapa ili kuhifadhi maana yake.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: Kwake uwe utukufu
  rationale: Kifungu cha Kigiriki hakina kitenzi; katika sifa hii ya ibada, “uwe” huwasilisha kwa kawaida wazo la kumhesabia Mungu utukufu bila kulifanya kuwa kauli ya umilikaji pekee.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: katika kanisa
  rationale: “Kanisa” ni neno la kawaida na linaloeleweka kwa ἐκκλησία katika matumizi ya Paulo; “katika” pia huhifadhi muundo unaolingana na kirai kinachofuata.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: na katika Masihi Yesu
  rationale: “Masihi” huhifadhi maana ya Χριστός kama jina la cheo, huku “katika” ikidumisha ulinganifu wa vifungu viwili vya Kigiriki.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: katika vizazi vyote
  rationale: Katika usemi huu wa wakati, εἰς huonyesha kuendelea katika vizazi vyote; Kiswahili hiki ni cha kawaida na hakibani maana kuwa mwelekeo wa mahali.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: milele na milele
  rationale: Huu ni usemi wa Kisemiti na Kigiriki unaosisitiza muda usio na mwisho; tafsiri ya neno kwa neno kuhusu ‘enzi ya enzi’ ingekuwa ngumu na isiyo ya kawaida kwa wasomaji wa sasa.
- source_word: ἀμήν
  choice: Amina
  rationale: Hili ndilo umbo la kawaida la Kiswahili la tamko la kiliturujia linalothibitisha sifa iliyotangulia.
theological_decisions:
- issue: Iwapo Χριστῷ litafsiriwe kama jina la cheo au umbo lililozoeleka kama jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός lina maana ya jina la cheo, ‘Aliyetiwa mafuta’ au ‘Masihi.’ “Masihi Yesu” hudhihirisha maana hiyo bila kubadili anayerejelewa; mbadala uliozoeleka umeonyeshwa katika tanbihi.
- issue: Nguvu ya kifungu kisicho na kitenzi αὐτῷ ἡ δόξα
  choice: Kwake uwe utukufu
  alternative: Utukufu ni wake
  rationale: Muundo wa doxolojia unaweza kueleweka kama kumtakia au kumhesabia utukufu. “Uwe” huhifadhi nguvu ya sifa ya ibada badala ya kuifunga kuwa taarifa ya umilikaji tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa ibada lakini kinachoeleweka kwa urahisi. Marudio ya “katika” yamehifadhiwa ili kuonyesha ulinganifu wa “katika kanisa” na “katika Masihi Yesu”; koma kabla ya “milele na milele” husaidia usomaji bila kutenganisha maana ya mwendelezo wa wakati.
