lexical_decisions:
- source_word: κατοικῆσαι
  choice: akae
  rationale: Kitenzi hiki kinaeleza kukaa kwa kudumu, si kuwapo kwa muda tu. Katika kishazi hiki cha kusudi kinategemea ombi lililotangulia, hivyo ‘akae’ ni cha kawaida na mwaminifu kwa muundo wa Kigiriki.
- source_word: τὸν Χριστόν
  choice: Masihi
  rationale: Χριστός hapa ni cheo cha Mtiwa-Mafuta. ‘Masihi’ huhifadhi maana yake kama cheo na ni istilahi ya kawaida katika Kiswahili cha Biblia.
- source_word: διὰ τῆς πίστεως
  choice: kwa njia ya imani
  rationale: Kirai hiki kinaonyesha njia ambayo Masihi anakaa mioyoni mwa waamini. ‘Imani’ ndiyo maana inayofaa zaidi hapa, huku maana zinazokaribiana zikihifadhiwa katika tanbihi.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: mioyoni mwenu
  rationale: Ni usemi wa kawaida unaorejelea utu wa ndani, si hisia peke yake. ‘Mioyoni mwenu’ ni wa asili na wenye heshima katika Kiswahili.
- source_word: ἐν ἀγάπῃ
  choice: katika upendo
  rationale: Kirai hiki kinaeleza mazingira au msingi ambamo waamini wamekita mizizi na kuwekwa juu ya msingi. Uhusiano mwingine wa kisarufi unaowezekana umeonyeshwa katika tanbihi.
- source_word: ἐρριζωμένοι
  choice: mkiwa mmekita mizizi
  rationale: Huhifadhi sitiari ya kilimo na hali inayoendelea iliyotokana na tendo lililotimia. Ingawa Kigiriki kina umbo la kutendwa, usemi huu ndio wa kawaida zaidi katika Kiswahili bila kupoteza picha kuu.
- source_word: τεθεμελιωμένοι
  choice: kuwekwa juu ya msingi
  rationale: Huhifadhi sitiari ya ujenzi na umbo la kutendwa la Kigiriki, likionyesha hali thabiti iliyotokana na kuwekwa msingi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ hutafsiri maana ya cheo hicho badala ya kukitaja kama jina tu; ‘Kristo’ ni namna nyingine iliyozoeleka na imehifadhiwa katika tanbihi.
- issue: Maana ya πίστις katika διὰ τῆς πίστεως
  choice: imani
  alternative: kumtumaini; uaminifu
  rationale: Katika muktadha huu, ‘imani’ inaeleweka vizuri kuwa njia ambayo Masihi anakaa mioyoni mwa waamini. Maneno ‘kumtumaini’ na ‘uaminifu’ yanawezekana katika wigo wa maana wa πίστις lakini yana uwezekano mdogo hapa.
- issue: Kirai ἐν ἀγάπῃ kinaunganishwa na nini
  choice: kinaunganishwa na ‘mkiwa mmekita mizizi na kuwekwa juu ya msingi’
  alternative: kinaunganishwa na ‘akae mioyoni mwenu’
  rationale: Mtiririko wa kisintaksia unaunga mkono zaidi kwamba upendo ndio mazingira ambamo waamini wamekita mizizi na kuwekwa msingi. Kwa kuwa uhusiano mwingine unawezekana, haujafichwa bali umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Sitiari mbili tofauti—mizizi ya mmea na msingi wa jengo—zimehifadhiwa. Alama ya koma ya mwisho imeachwa kwa sababu mstari huu unaendelea kisintaksia katika mstari unaofuata.
