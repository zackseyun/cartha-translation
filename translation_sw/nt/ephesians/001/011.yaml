  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: sw
  text: Katika yeye sisi pia tulifanywa kuwa urithi wa Mungu[a], baada ya kupangiwa tangu awali kulingana na kusudi la yule atendaye mambo yote kulingana na shauri la mapenzi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tulipata urithi.” Kitenzi cha Kigiriki kinaweza kueleweka ama kuwa tulipokea urithi, ama kuwa tulifanywa kuwa milki ya Mungu iliyogawiwa kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Katika yeye
  rationale: Kiwakilishi kinamrejelea Masihi katika muktadha uliotangulia. Kauli hii inadumisha maana ya kuwa katika umoja na Kristo kwa Kiswahili kinachoeleweka.
- source_word: ἐκληρώθημεν
  choice: tulifanywa kuwa urithi
  rationale: Kauli tendwa inaweza kumaanisha kupewa urithi au kufanywa kuwa milki iliyogawiwa. Tafsiri hii inadumisha maana inayowezekana kwamba waamini walifanywa watu walio urithi wa Mungu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: προορισθέντες
  choice: tukiwa tumepangiwa tangu awali
  rationale: Kauli hii inaonyesha uamuzi au upangaji wa kabla bila kuingiza mfumo mpana wa kiteolojia usiotajwa moja kwa moja katika mstari.
- source_word: κατὰ πρόθεσιν
  choice: kulingana na kusudi
  rationale: πρόθεσις hapa ni nia au mpango wenye lengo; “kusudi” ni neno la kawaida, lenye heshima, na lililo karibu na maana hiyo.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: ya yule atendaye mambo yote
  rationale: Kirai hiki kinamtambulisha Mungu kuwa mtendaji na kuhifadhi upeo mpana wa τὰ πάντα bila kufafanua kupita kiasi namna ya utendaji wake.
- source_word: κατὰ τὴν βουλὴν
  choice: kulingana na shauri
  rationale: “Shauri” linahifadhi wazo la azimio lililofikiriwa kwa makusudi kuliko neno la jumla kama “mpango.”
- source_word: τοῦ θελήματος αὐτοῦ
  choice: la mapenzi yake
  rationale: Hii ni tafsiri ya kawaida ya θέλημα na inadumisha uhusiano wa kisarufi kati ya shauri na mapenzi ya Mungu.
theological_decisions:
- issue: Maana ya ἐκληρώθημεν
  choice: Waamini walifanywa kuwa urithi au watu waliogawiwa kwa Mungu.
  alternative: Waamini walipata urithi.
  rationale: Kauli tendwa ya κληρόω inaruhusu maana zote mbili. Muktadha wa kusudi la Mungu la wokovu na usuli wa Agano la Kale kuhusu watu wa Mungu kuwa urithi wake unaunga mkono tafsiri kuu, lakini uwezekano mwingine ni halisi na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata hoja ya Kigiriki kwa ukaribu bila kuwa mgumu kupita kiasi.
