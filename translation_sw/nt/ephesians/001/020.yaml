lexical_decisions:
- source_word: ἣν
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea nguvu iliyotajwa katika muktadha uliotangulia na kuendeleza sentensi bila kurudia nomino hiyo.
- source_word: ἐνήργηκεν
  choice: aliitenda
  rationale: Kitenzi kinaeleza utendaji wenye matokeo wa nguvu ya Mungu; ‘aliitenda’ kinahifadhi wazo la Mungu kuifanya nguvu hiyo itende kazi bila kuongeza maelezo yasiyo katika Kigiriki.
- source_word: ἐν τῷ Χριστῷ
  choice: katika Masihi
  rationale: Χριστός linatumika hapa kama cheo cha yule aliyeahidiwa; ‘Masihi’ ni namna ya kawaida na inayoeleweka katika Kiswahili, huku ‘katika’ likihifadhi uhusiano mpana wa ἐν.
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: alipomfufua kutoka kwa wafu
  rationale: Muundo wa wakati kwa ‘alipomfufua’ unaonyesha kwa kawaida tendo linaloambatana na utendaji wa nguvu; ‘kutoka kwa wafu’ huhifadhi usemi wa ufufuo na wingi wa νεκρῶν.
- source_word: καθίσας
  choice: na kumketisha
  rationale: Hiki ni kishiriki cha pili kinachoratibiwa na ἐγείρας; ‘kumketisha’ kinaonyesha kwamba Mungu ndiye aliyempa nafasi hiyo.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: upande wake wa kuume
  rationale: Huu ni usemi wa mahali pa heshima na mamlaka. ‘Upande wake wa kuume’ ni Kiswahili cha asili zaidi kuliko picha halisi ya kuketi ndani ya mkono.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: katika ulimwengu wa mbinguni
  rationale: Kivumishi kilichotumika kama nomino kinaonyesha eneo au mazingira ya kimbingu; ‘ulimwengu wa mbinguni’ huwasilisha wigo huo kwa Kiswahili cha kawaida bila kuufanya usemi kuwa mahali maalumu mno.
theological_decisions:
- issue: Tafsiri ya Χριστῷ kama cheo au jina lililozoeleka
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linaweza kusikika kama cheo cha mfalme aliyeahidiwa. ‘Masihi’ huhifadhi maana hiyo, na mbadala uliozoeleka sana katika mapokeo ya Kiswahili umeonyeshwa katika tanbihi.
- issue: Maana ya ἐν τοῖς ἐπουρανίοις
  choice: katika ulimwengu wa mbinguni
  alternative: katika makao ya mbinguni
  rationale: Kigiriki kina kivumishi cha wingi kilichotumika kama nomino na hakitaji wazi nomino kama ‘mahali’ au ‘makao.’ Tafsiri kuu huonyesha mazingira ya kimbingu kwa upana, huku tanbihi ikihifadhi uwezekano wa kuuelewa usemi huo kwa maana ya mahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi inayofaa Maandiko. Sentensi imeachwa kama kishazi kinachoendeleza mstari uliotangulia. ‘Upande wake wa kuume’ huepuka tafsiri halisi isiyo ya kawaida ya kuketi katika mkono, na ‘ulimwengu wa mbinguni’ huepuka kuongeza dhana ya ‘roho’ ambayo haikutajwa wazi katika chanzo.
