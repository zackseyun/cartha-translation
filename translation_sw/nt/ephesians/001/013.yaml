source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: sw
  text: Katika yeye[a], ninyi pia—baada ya kusikia neno la kweli, yaani habari njema ya wokovu wenu[b], na katika yeye, baada ya kuamini[d]—mlitiwa muhuri kwa Roho Mtakatifu wa ahadi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “injili ya wokovu wenu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Roho Mtakatifu aliyeahidiwa.”
    reason: alternative_reading
  - marker: d
    text: Au, “na baada ya kumwamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: katika yeye
  rationale: Inadumisha maana ya kuwa ndani ya Kristo na pia uhusiano wa kiwakilishi na Kristo aliyetajwa katika muktadha uliotangulia.
- source_word: καὶ ὑμεῖς
  choice: ninyi pia
  rationale: Inahifadhi msisitizo wa kuwajumuisha wasomaji pamoja na kundi la “sisi” lililotajwa katika mistari iliyotangulia.
- source_word: ἀκούσαντες
  choice: baada ya kulisikia
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaeleweka kwa kawaida kuwa kitendo kilichotangulia kutiwa muhuri; “baada ya” huonyesha mfuatano bila kuunda mfumo wa kiteolojia usioelezwa wazi.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: neno la kweli
  rationale: Ni tafsiri ya karibu ya kirai cha Kigiriki, yenye kueleweka na inayohifadhi mwangwi wa usemi wa Paulo.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: habari njema ya wokovu wenu
  rationale: “Habari njema” ni Kiswahili cha kawaida na wazi kwa εὐαγγέλιον, huku muundo wa wokovu wenu ukihifadhiwa.
- source_word: πιστεύσαντες
  choice: baada ya kuamini
  rationale: Inalingana na muundo wa ἀκούσαντες na kuonyesha kitendo kilichotangulia kutiwa muhuri bila kuamua zaidi ya sarufi inavyoruhusu.
- source_word: ἐσφραγίσθητε
  choice: mlitiwa muhuri
  rationale: Inahifadhi taswira ya muhuri, ikijumuisha maana za umiliki, uthibitisho na ulinzi bila kuibadilisha kuwa ufafanuzi.
- source_word: τῷ πνεύματι
  choice: kwa Roho Mtakatifu
  rationale: “Kwa” linaweza kuwasilisha Roho kama njia au kile ambacho muhuri huo unahusishwa nacho, bila kubana dativu katika maana moja tu.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: Roho Mtakatifu wa ahadi
  rationale: Inahifadhi muundo mfupi na wenye uwezekano zaidi ya mmoja wa Kigiriki; inaweza kumaanisha Roho aliyeahidiwa au Roho anayehusiana na ahadi.
theological_decisions:
- issue: Uhusiano kati ya kusikia, kuamini na kutiwa muhuri
  choice: “baada ya kulisikia … baada ya kuamini … mlitiwa muhuri”
  alternative: “mliposikia … mlipoamini … mlitiwa muhuri”
  rationale: Vitenzi-shirikishi vya aoristi vinavyotangulia kitenzi kikuu kwa kawaida vinaonyesha vitendo vilivyotangulia, lakini tafsiri haifafanui muda kwa undani kuliko andiko lenyewe wala kuamua mabishano ya kimadhehebu kuhusu kupokewa kwa Roho.
- issue: Maana ya “Roho wa ahadi”
  choice: Roho Mtakatifu wa ahadi
  alternative: Roho Mtakatifu aliyeahidiwa
  rationale: Kirai cha Kigiriki ni kifupi na kinaweza kueleweka kwa njia zaidi ya moja. Matini kuu inadumisha mvutano huo; tanbihi inatoa ufafanuzi wa kawaida bila kuufanya kuwa maana pekee.
- issue: Kurudiwa kwa ἐν ᾧ
  choice: “Katika yeye” limetafsiriwa mara zote mbili
  alternative: 'Mara ya pili inaweza kuunganishwa na kuamini: “baada ya kumwamini”'
  rationale: Kurudia kirai kunadumisha msisitizo wa Paulo kuhusu kuwa katika Kristo na hakubadili kimyakimya uhusiano wa kisarufi kuwa Kristo ndiye yambwa wa kitenzi “kuamini,” ingawa hiyo ni tafsiri inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mabano marefu yanasaidia kuonyesha vifungu-shirikishi bila kupoteza kitenzi kikuu. Usemi “wa ahadi” umeachwa kwa makusudi kuwa mfupi kama Kigiriki, huku tanbihi ikitoa namna ya kawaida zaidi ya Kiswahili.
