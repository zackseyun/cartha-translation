translation:
  language: sw
  text: akiwa ametukusudia tangu awali ili tuasiliwe kuwa wana[a] kwa njia ya Yesu Masihi[b], kwa ajili yake mwenyewe[c], kulingana na uradhi wa mapenzi yake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tufanywe wana.” Neno la Kigiriki linamaanisha kuasiliwa au kupewa hadhi ya mwana, likisisitiza hadhi ya kisheria na haki ya urithi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa njia ya Yesu Kristo.” “Masihi” hutafsiri neno la Kigiriki Christos, yaani Mtiwa-Mafuta.
    reason: alternative_reading
  - marker: c
    text: Au, “kwake mwenyewe.” Kishazi cha Kigiriki kinaweza kuonyesha kusudi kwa ajili yake au mwelekeo kuelekea kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: akiwa ametuamulia tangu awali
  rationale: Kitenzi hiki kina maana ya kuamua au kuweka kusudi mapema. Kauli hii huhifadhi wazo la ‘tangu awali’ bila kuingiza maelezo ya kimfumo kuhusu jinsi kuamuliwa huko kulivyofanyika; ‘akiwa’ pia huonyesha kuwa ni kishiriki kinachohusiana na sentensi pana ya mistari 3–14.
- source_word: εἰς υἱοθεσίαν
  choice: tufanywe wana
  rationale: υἱοθεσία hurejelea kupewa hadhi ya mwana, hasa hadhi ya kisheria yenye haki ya urithi. ‘Tufanywe wana’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo ya uana, huku tanbihi ikifafanua maana ya kuasiliwa.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kwa njia ya Yesu Masihi
  rationale: διά pamoja na uhusika jeni huonyesha njia au wakala. ‘Masihi’ hutafsiri Χριστός kama cheo badala ya kukifanya tu sehemu ya jina.
- source_word: εἰς αὐτόν
  choice: kwa ajili yake mwenyewe
  rationale: Katika muktadha huu kishazi kinaweza kuonyesha kusudi—Mungu aliwakusudia wawe wana kwa ajili yake mwenyewe. Tanbihi huhifadhi uwezekano wa kukielewa kama mwelekeo ‘kwake mwenyewe.’
- source_word: κατὰ τὴν εὐδοκίαν
  choice: kulingana na uradhi
  rationale: κατά huonyesha upatanifu, na εὐδοκία ni ridhaa au furaha ya kukusudia jambo. ‘Uradhi’ ni neno la heshima na linaloeleweka bila kupanua maana kupita kiasi.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: wa mapenzi yake
  rationale: Huu ni uwasilishaji wa moja kwa moja wa θέλημα, unaorejelea kile Mungu anachotaka, bila kukibadili kuwa neno la kufasiri zaidi kama ‘mpango.’
theological_decisions:
- issue: Maana ya προορίσας katika mjadala kuhusu kuamuliwa tangu awali
  choice: akiwa ametuamulia tangu awali
  alternative: akiwa ametuchagulia tangu awali
  rationale: Chaguo hili hudumisha wazi tendo la kuamua mapema linalotajwa na maandiko, lakini haliongezi mfumo fulani wa kimadhehebu kuhusu msingi, utaratibu, au upeo wake.
- issue: Maana ya kijinsia na kisheria ya υἱοθεσία
  choice: tufanywe wana
  alternative: tuasiliwe kuwa watoto wake
  rationale: ‘Wana’ huhifadhi sehemu ya neno la Kigiriki inayohusu hadhi ya mwana na urithi. Hii ni hadhi inayotolewa kwa waamini wote, wala matumizi ya neno hilo hayakusudii kuwabagua wanawake.
- issue: Cheo Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; ‘Masihi’ huwasilisha cheo hicho wazi katika Kiswahili.
- issue: Uhusiano wa εἰς αὐτόν
  choice: kwa ajili yake mwenyewe
  alternative: kwake mwenyewe
  rationale: Kigiriki kinaweza kuonyesha kusudi au mwelekeo. Maandishi makuu yanatumia maana ya kusudi iliyo ya kawaida katika muktadha, na tanbihi inahifadhi maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. Muundo wa kishiriki ‘akiwa’ umehifadhiwa kwa sababu aya hii ni sehemu ya sentensi ndefu inayoendelea. ‘Ametuamulia tangu awali’ ni ya kawaida zaidi kuliko tungo nzito kama ‘ametukusudia kabla,’ huku ikidumisha nguvu ya προορίζω.
