  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: sw
  text: juu sana kuliko kila utawala na mamlaka na nguvu na enzi,[a] na kuliko kila jina linalotajwa,[b] si katika zama hizi tu, bali pia katika zama zijazo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila enzi na mamlaka na nguvu na ubwana.” Maneno ya Kigiriki yanaweza kumaanisha madaraja au nyanja za mamlaka, zikiwemo mamlaka za ulimwengu wa roho.
    reason: lexical_alternative
  - marker: b
    text: Au, “kila cheo kinachopewa.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “si katika zama hizi tu, bali pia katika zile zijazo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: juu sana kuliko
  rationale: Huonyesha ukuu na cheo kilichoinuliwa kwa kiwango kikubwa; muundo huu ni wa kawaida na unaunganisha kwa uwazi orodha yote na kile ambacho Kristo yuko juu yake.
- source_word: πάσης ἀρχῆς
  choice: kila utawala
  rationale: Katika muktadha huu ἀρχή ni mamlaka au utawala wa aina fulani. ‘Utawala’ huhifadhi maana pana bila kuamua kwamba kinachozungumziwa ni mtawala binafsi au daraja maalumu la viumbe vya rohoni.
- source_word: ἐξουσίας
  choice: mamlaka
  rationale: Ni tafsiri ya kawaida ya uwezo au haki ya kutawala, na huitofautisha na δύναμις.
- source_word: δυνάμεως
  choice: nguvu
  rationale: Huwasilisha uwezo au nguvu na kubaki tofauti na ‘mamlaka’ katika orodha.
- source_word: κυριότητος
  choice: enzi
  rationale: Hutoa dhana ya ubwana au eneo la kutawala bila kutumia moja kwa moja cheo cha ‘Bwana’; tanbihi inahifadhi tafsiri mbadala.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: kila jina linalotajwa
  rationale: Huhifadhi mwangwi wa nomino na kitenzi katika Kigiriki, pamoja na upana wake unaoweza kujumuisha jina, cheo, au hadhi.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: si ... tu, bali pia
  rationale: Ni muundo wa asili wa Kiswahili unaolingana na ulinganishi wenye mkazo wa Kigiriki.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: katika wakati huu
  rationale: Huhifadhi maana ya kipindi au zama badala ya kuibadili kuwa mahali panapoitwa ulimwengu.
- source_word: ἐν τῷ μέλλοντι
  choice: katika ule ujao
  rationale: Huhifadhi udondoshaji wa nomino ‘wakati’ uliopo katika Kigiriki, huku rejeo lake likibaki wazi katika Kiswahili.
theological_decisions:
- issue: Asili ya ‘utawala, mamlaka, nguvu na enzi’
  choice: Maneno yametafsiriwa kama aina pana za utawala na mamlaka bila kuzitambulisha moja kwa moja kuwa wanadamu, malaika, au nguvu za kiroho.
  alternative: Kuzitaja wazi kuwa nguvu za ulimwengu wa roho au madaraja ya malaika.
  rationale: Muktadha unaweza kujumuisha mamlaka za ulimwengu wa roho, lakini Kigiriki chenyewe hakibainishi asili yake katika mstari huu. Tafsiri pana huhifadhi utata huo wa kweli.
- issue: Maana ya ‘jina linalotajwa’
  choice: Muundo mpana ‘kila jina linalotajwa’ umehifadhiwa katika matini kuu.
  alternative: ‘Kila cheo kinachotolewa.’
  rationale: ‘Jina’ linaweza kuelekeza kwa jina, cheo, au hadhi. Kulibadili moja kwa moja kuwa ‘cheo’ kungepunguza upana wa usemi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Orodha imehifadhiwa kama mfululizo wa istilahi tofauti, na matini kuu haijafafanua zaidi asili ya mamlaka hizo kuliko Kigiriki kinavyofanya.
