  text: ambalo ni mwili wake, utimilifu[a] wa yule anayejaza[b] vitu vyote katika yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi: “utimilifu wa yule anayejaza yote katika yote.”'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kueleweka kuwa “yule anayejazwa,” ingawa wengi hulielewa hapa kuwa “yule anayejaza.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: ambalo
  rationale: Kiwakilishi hiki kinarejelea kanisa katika mstari wa 22; umbo la ngeli ya LI-YA linapatana na “kanisa” na ni la kawaida katika Kiswahili.
- source_word: σῶμα
  choice: mwili
  rationale: Hii ndiyo maana ya moja kwa moja na sitiari ya kawaida ya Paulo kuhusu uhusiano wa kanisa na Kristo.
- source_word: πλήρωμα
  choice: utimilifu
  rationale: Neno hili linahifadhi uzito na uwazi wa kitheolojia wa πλήρωμα bila kulifafanua kimabavu kuwa kile kinachojazwa au kinachokamilisha.
- source_word: τοῦ ... πληρουμένου
  choice: wa yule anayevijaza
  rationale: Ingawa kisarufi participio inaweza kueleweka katika hali ya kati au ya kutendwa, muktadha unaunga mkono maana tendaji ya yule anayejaza; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Huhifadhi upana wa usemi wa Kigiriki na maana yake inayoweza kuhusisha uumbaji wote.
- source_word: ἐν πᾶσιν
  choice: katika yote
  rationale: Tafsiri hii ya karibu inahifadhi usemi uliobanwa na utata wake badala ya kuufanya kwa lazima kuwa “kwa kila namna” au “ndani ya wote.”
theological_decisions:
- issue: Maana ya πλήρωμα kuhusiana na kanisa na Kristo
  choice: Kanisa linaitwa “utimilifu” wake, bila kubainisha zaidi namna uhusiano huo unavyofanya kazi.
  alternative: Kanisa kuwa kile kinachojazwa na Kristo, au kuwa kikamilisho chake kwa maana fulani ya sitiari ya mwili.
  rationale: Kigiriki kinakubali maelezo kadhaa yanayohusiana; “utimilifu” huhifadhi mvutano huo bila kuamua zaidi ya matini.
- issue: Kauli na maana ya πληρουμένου
  choice: yule anayevijaza
  alternative: yule anayejazwa
  rationale: Umbo hilo ni la kati/kauli ya kutendwa kisarufi, lakini maana tendaji inafaa zaidi katika muktadha; maana ya kutendwa imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Katika yote” limechaguliwa ili kuhifadhi utata wa ἐν πᾶσιν. Alama zote za tanbihi zimewekwa katika matini kuu.
