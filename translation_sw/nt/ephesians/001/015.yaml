  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: sw
  text: Kwa sababu hiyo, mimi pia, baada ya kusikia habari za imani yenu[a] katika Bwana Yesu na upendo wenu kwa watakatifu wote[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jinsi mnavyomtumaini Bwana Yesu”; nomino ya Kigiriki inaweza pia kuwa na maana ya “uaminifu” katika baadhi ya miktadha.
    reason: lexical_alternative
  - marker: b
    text: Yaani, upendo wenu unaoelekezwa kwa watakatifu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinarejelea yaliyotangulia na kuonyesha msingi wa mwitikio wa Paulo; tafsiri hii ni ya kawaida na inahifadhi uhusiano huo wa kimantiki.
- source_word: κἀγώ
  choice: mimi pia
  rationale: Muungano wa καί na ἐγώ unamtia Paulo mwenyewe katika mwitikio; “mimi pia” huhifadhi msisitizo huo wa nyongeza kwa Kiswahili cha kawaida.
- source_word: ἀκούσας
  choice: baada ya kusikia
  rationale: Kivumishi-shirikishi cha wakati uliopita kina maana ya kitendo kilichotangulia; “baada ya kusikia” huwasilisha uhusiano huo wa wakati kwa Kiswahili fasaha bila kukamilisha sentensi ambayo inaendelea katika mstari unaofuata.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: imani yenu
  rationale: Muundo wa κατά pamoja na ὑμᾶς hapa unaelekea kwenye imani inayowahusu wasomaji; “imani yenu” ni fupi, wazi, na ya kawaida.
- source_word: πίστιν
  choice: imani
  rationale: Katika muktadha huu neno linaeleza uhusiano wa waamini na Bwana Yesu. “Imani” huhifadhi istilahi yenye uzito wa kitheolojia, huku maana mbadala zikielezwa katika tanbihi.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: katika Bwana Yesu
  rationale: “Katika” huhifadhi kihusishi ἐν na pia mtindo wa kawaida wa Paulo badala ya kukibadili kuwa “kwa” au “kumwelekea.”
- source_word: κυρίῳ
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida na yenye heshima ya cheo κύριος kinapotumiwa kwa Yesu.
- source_word: ἀγάπην
  choice: upendo
  rationale: “Upendo” ni neno la kawaida, la sasa, na linalolingana moja kwa moja na ἀγάπη.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: kwa watakatifu wote
  rationale: Baada ya “upendo,” εἰς huonyesha wale wanaoelekezewa upendo huo. “Kwa” ni Kiswahili cha kawaida, na “watakatifu” huhifadhi jina la Paulo kwa waamini.
- source_word: ἁγίους
  choice: watakatifu
  rationale: Neno hili huhifadhi maana ya “walio watakatifu” na matumizi ya kawaida ya Kibiblia bila kuifanya kauli kuwa maelezo marefu.
theological_decisions:
- issue: Maana ya πίστις katika uhusiano na Bwana Yesu
  choice: imani
  alternative: kumtumaini; uaminifu
  rationale: Muktadha unaelekea hasa kwenye imani au tumaini la wasomaji katika Bwana Yesu, si kwanza tabia yao ya kuwa waaminifu. Hata hivyo, wigo wa neno la Kigiriki unawekwa wazi katika tanbihi bila kuondoa mvutano wake wa kimaana.
- issue: Tafsiri ya κύριος kama cheo cha Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” huhifadhi uzito wa cheo cha Kikristo na matumizi mapana ya κύριος katika maandishi ya Paulo; “Mkuu” ingedhoofisha au kubadili maana yake katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki kuwa sehemu ya sentensi inayoendelea katika mstari unaofuata, kwa hiyo unaishia kwa koma. “Baada ya kusikia” ni ya asili zaidi kuliko muundo mzito wa kishirikishi, huku “katika Bwana Yesu” ikihifadhi usemi wa Paulo.
