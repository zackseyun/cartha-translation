lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: ili ... tuwe
  rationale: Muundo huu wa Kiswahili unaeleza kusudi au matokeo ya kishazi chenye kiarifa-jina bila kufuata sarufi ya Kigiriki kwa namna isiyo ya kawaida.
- source_word: ἡμᾶς
  choice: sisi
  rationale: Kiwakilishi cha wazi kinadumisha msisitizo wa Kigiriki na tofauti inayoweza kujitokeza kati ya ‘sisi’ hapa na ‘ninyi’ katika mstari unaofuata.
- source_word: εἰς ἔπαινον
  choice: kwa sifa
  rationale: Hii ni kauli ya asili katika Kiswahili inayoonyesha kusudi au matokeo, huku ikidumisha neno la msingi ‘sifa’.
- source_word: δόξης αὐτοῦ
  choice: ya utukufu wake
  rationale: Muundo wa umilikaji umehifadhiwa moja kwa moja; ‘utukufu’ ni neno lenye uzito wa kiteolojia linalolingana vizuri na δόξα.
- source_word: τοὺς προηλπικότας
  choice: tuliokuwa tumekwisha kumtumaini
  rationale: Kauli hii inaonyesha tumaini lililotangulia na lenye umuhimu unaoendelea, bila kulazimisha maana yenye nguvu zaidi ya kuwa kundi la kwanza kuamini.
- source_word: ἐν τῷ Χριστῷ
  choice: kumtumaini Masihi
  rationale: Katika uhusiano na kitenzi cha kutumaini, Kiswahili hutumia kwa kawaida ‘kumtumaini’; ‘Masihi’ huhifadhi Χριστός kama cheo cha Mtiwa-Mafuta.
theological_decisions:
- issue: Iwapo προηλπικότας inawatambulisha walioanza kumtumaini Masihi kwanza au wale waliokuwa tayari wamemtumaini hapo awali
  choice: tuliokuwa tumekwisha kumtumaini Masihi
  alternative: tuliokuwa wa kwanza kumtumaini Masihi
  rationale: Kiambishi προ- kinaonyesha kutangulia, lakini hakiamui bila shaka kama Paulo anamaanisha kundi la kwanza kihistoria. Tafsiri kuu inadumisha utangulizi wa wakati bila kuingiza utambulisho maalumu wa kundi; uwezekano mwingine umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio umeweka ‘sisi’ wazi ili kuhifadhi msisitizo wa maandishi ya Kigiriki, na kishazi kinachowatambulisha kimeunganishwa bila koma kama sehemu ya lazima ya maana.
