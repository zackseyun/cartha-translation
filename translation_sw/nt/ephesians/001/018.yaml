  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: sw
  text: macho ya mioyo yenu yakiwa yametiwa nuru, ili mjue tumaini la mwito wake ni nini, na utajiri wa utukufu wa urithi wake kati ya watakatifu ni nini[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “urithi wake ndani ya watakatifu,” au “kati ya watu wake watakatifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεφωτισμένους
  choice: yakiwa yametiwa nuru
  rationale: Kauli timilifu tendwa inaonyesha tendo lililotendwa lenye matokeo yanayoendelea; muundo huu wa Kiswahili huhifadhi hali ya kutendwa na wazo la nuru iliyokwisha kutolewa.
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: macho ya mioyo yenu
  rationale: Inahifadhi sitiari ya Kigiriki badala ya kuifafanua kuwa akili au ufahamu; wingi wa καρδίας ὑμῶν unaendana na kundi la waandikiwa.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: ili mjue
  rationale: Huwasilisha kwa Kiswahili cha kawaida kusudi la muundo wa infinitivu.
- source_word: ἐλπὶς
  choice: tumaini
  rationale: Ni neno la kawaida la Kiswahili kwa matarajio yenye uhakika katika matumizi haya ya Paulo.
- source_word: κλήσεως αὐτοῦ
  choice: mwito wake
  rationale: Huhifadhi msamiati wa Paulo na hali ya umilikaji bila kuupanua kwa tafsiri ya ziada.
- source_word: πλοῦτος
  choice: utajiri
  rationale: Huwasilisha wingi na thamani tele, na ni muundo wa kawaida katika kirai 'utajiri wa utukufu.'
- source_word: δόξης
  choice: utukufu
  rationale: Ni tafsiri ya kawaida ya kibiblia inayohifadhi uzito wa kitheolojia wa neno.
- source_word: κληρονομίας αὐτοῦ
  choice: urithi wake
  rationale: Huacha wazi ikiwa ni urithi ulio wake Mungu au urithi anaoutoa, bila kulazimisha mojawapo ya maana hizo.
- source_word: ἐν τοῖς ἁγίοις
  choice: kati ya watakatifu
  rationale: Ni Kiswahili cha kawaida kinachowasilisha maana ya kijumuiya ya ἐν; uwezekano wa 'ndani ya watakatifu' umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Ikiwa 'urithi wake katika/kati ya watakatifu' ni watu wake walio milki ya Mungu au urithi anaowapa waamini
  choice: urithi wake kati ya watakatifu
  alternative: urithi wake ndani ya watakatifu; urithi anaoutoa kati ya watu wake watakatifu
  rationale: Vihusishi na miundo ya umilikaji ya Kigiriki huruhusu zaidi ya maana moja. Tafsiri kuu haibainishi kwa lazima ni nani anayeurithi au urithi ni watu wenyewe, hivyo inadumisha mvutano wa kitheolojia wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya 'macho ya mioyo' imehifadhiwa. Mstari huu ni mwendelezo wa sentensi na sala iliyoanza katika mistari iliyotangulia, kwa hiyo umeachwa katika muundo wa kishazi.
source_grounding:
  english_pob_role: consult_only
