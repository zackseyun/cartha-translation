source:
  edition: SBLGNT
  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: sw
  text: kwa sifa ya utukufu wa neema yake[a], ambayo ametufadhili nayo katika Mpendwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo ametutendea kwa neema.” Katika Kigiriki, neno la “neema” na kitenzi kilichotafsiriwa “ametufadhili” yana mzizi mmoja; hivyo yanakazia kwamba Mungu ametutendea kwa neema.
    reason: lexical_alternative
  - marker: b
    text: “Mpendwa” anamrejelea Mwana, yaani, Masihi.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: ili ... usifiwe
  rationale: Muundo huu unaonyesha kusudi au matokeo ya εἰς kwa Kiswahili cha kawaida, huku ukihifadhi wazo la sifa.
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: utukufu wa neema yake
  rationale: Tafsiri hii inahifadhi uhusiano wa nomino za Kigiriki badala ya kubadili δόξης kuwa kivumishi tu kama ‘neema yake tukufu.’
- source_word: χάριτος
  choice: neema
  rationale: ‘Neema’ ni neno la kawaida na linaloeleweka kwa fadhili ya Mungu katika wokovu.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: neema ambayo ametufadhili nayo
  rationale: Muundo huu unaonyesha kuwa kiwakilishi ἧς kinarejelea neema na kwamba Mungu ndiye aliyewatendea ‘sisi’ kwa fadhili. ‘Ametufadhili’ ni ya asili zaidi kuliko ‘ametuneemesha,’ ambalo katika matumizi ya sasa linaweza kudokeza kutajirisha au kustawisha.
- source_word: ἐν
  choice: katika
  rationale: ‘Katika’ huhifadhi upana wa ἐν bila kuamua kimya kimya ikiwa maana yake hasa ni njia, muungano, au mazingira ya tendo.
- source_word: τῷ ἠγαπημένῳ
  choice: Mpendwa
  rationale: Kirai hiki ni participo iliyotumiwa kama jina la cheo. ‘Mpendwa’ huhifadhi namna hiyo ya kumrejelea Kristo bila kuongeza neno ‘Mwana,’ ambalo halimo wazi katika mstari huu.
theological_decisions:
- issue: Uhusiano wa χάρις na χαριτόω
  choice: neema ambayo ametufadhili nayo
  alternative: neema ambayo ametuneemesha nayo
  rationale: Kigiriki kinatumia maneno yenye mzizi mmoja, lakini ‘ametuneemesha’ kwa Kiswahili cha sasa huweza kueleweka kuwa ametufanikisha au ametutajirisha. Tafsiri kuu inalinda maana ya tendo la fadhili, na tanbihi inaeleza mwangwi wa mzizi wa Kigiriki.
- issue: Nguvu ya Kikristo ya τῷ ἠγαπημένῳ
  choice: Mpendwa
  alternative: Mwana wake mpendwa
  rationale: Mhusika ni Kristo, lakini chanzo kinatumia cheo ‘Mpendwa’ bila kutaja ‘Mwana’ katika mstari huu; hivyo tafsiri haiongezi ufafanuzi huo ndani ya matini.
- issue: Maana ya ἐν τῷ ἠγαπημένῳ
  choice: katika Mpendwa
  alternative: kwa njia ya Mpendwa
  rationale: ‘Katika’ huhifadhi utata halisi wa ἐν kuhusu mazingira, muungano, au njia badala ya kuufanya kuwa maana moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Kistari kirefu kinarudia ‘neema’ kwa uwazi na kuzuia kiwakilishi kisionekane kurejelea ‘utukufu.’ ‘Mpendwa’ limeandikwa kwa herufi kubwa kwa kuwa linatumika kama cheo cha Kristo.
