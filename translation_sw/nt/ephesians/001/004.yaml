lexical_decisions:
- source_word: καθὼς
  choice: kama vile
  rationale: Inaendeleza uhusiano wa kulinganisha au kutoa msingi kwa baraka iliyotajwa katika mstari uliotangulia, kwa Kiswahili cha kawaida.
- source_word: ἐξελέξατο
  choice: alivyotuchagua
  rationale: ‘Kuchagua’ huwasilisha maana ya kitenzi kwa uwazi bila kuingiza mapema mifumo ya kiteolojia inayoweza kuhusishwa na istilahi maalumu zaidi.
- source_word: ἡμᾶς
  choice: -tu-
  rationale: Kiambishi cha yambwa katika ‘alivyotuchagua’ kinawakilisha kwa kawaida nafsi ya kwanza wingi ya Kigiriki.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Inadumisha usemi mfupi wa Paulo kuhusu kuwa ndani yake bila kubadili kiwakilishi kuwa ‘Kristo’ au kufafanua zaidi ya matini.
- source_word: πρὸ καταβολῆς κόσμου
  choice: kabla ya kuwekwa msingi wa ulimwengu
  rationale: Inahifadhi taswira ya Kigiriki ya kuwekwa msingi pamoja na maana yake ya wakati.
- source_word: εἶναι ἡμᾶς
  choice: ili tuwe
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kusudi au matokeo, huku kiambishi ‘tu-’ kikitaja wazi wahusika.
- source_word: ἁγίους
  choice: watakatifu
  rationale: Neno hili linahifadhi maana za maadili na za kutengwa kwa ajili ya Mungu.
- source_word: ἀμώμους
  choice: wasio na lawama
  rationale: Ni Kiswahili cha kawaida kinachoeleza kutokuwa na kosa linalostahili lawama; maana ya ‘bila doa’ imehifadhiwa katika tanbihi.
- source_word: κατενώπιον αὐτοῦ
  choice: mbele zake
  rationale: Inawasilisha kwa ufupi hali ya kuwa katika uwepo wake na kuwajibika kwake.
- source_word: ἐν ἀγάπῃ
  choice: kwa upendo
  rationale: Ni usemi wa asili katika Kiswahili na unaweza kueleweka pamoja na maneno yaliyotangulia au yanayofuata, kama ilivyo katika utata wa sintaksia ya Kigiriki.
theological_decisions:
- issue: Kuepuka kusomea ἐξελέξατο mfumo maalumu wa mafundisho kuhusu uteuzi
  choice: alivyotuchagua
  alternative: alivyotuteua
  rationale: Matini inasema wazi kwamba Mungu alichagua, lakini ‘kuteua’ inaweza kusikika kama istilahi rasmi zaidi. ‘Kuchagua’ huhifadhi dai la matini bila kulifungamanisha na mfumo fulani wa kimadhehebu.
- issue: Maneno ἐν ἀγάπῃ yanaunganishwa na sehemu gani ya sentensi
  choice: kuyabakiza mwishoni mwa mstari kama ‘kwa upendo’ na kueleza uwezekano mwingine katika tanbihi
  alternative: 'kuyaunganisha na mstari unaofuata: ‘Kwa upendo alitangulia kutuwekea...’'
  rationale: Kigiriki kinaweza kueleweka kwa njia zote mbili. Mpangilio wa matini kuu na tanbihi huhifadhi utata huo badala ya kuutatua kidogma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji huku ukihifadhi msamiati na mkazo wa kifungu cha Kigiriki. Herufi ndogo mwanzoni inaonyesha kuwa mstari huu unaendeleza sentensi ya mstari uliotangulia.
