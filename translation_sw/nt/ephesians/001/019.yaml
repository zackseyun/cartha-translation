  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: sw
  text: na ukuu wa kupita kiasi wa nguvu zake kwetu sisi tunaoamini[a], kulingana na utendaji wa uweza wa nguvu zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani yetu sisi tunaoamini.” Kigiriki kinasema “kuelekea kwetu sisi,” lakini baadhi ya tafsiri hufafanua kirai hiki kuwa nguvu za Mungu zinazotenda kazi ndani ya waamini.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: ulio mkuu mno
  rationale: Kirai hiki kinaonyesha ukuu unaopita kiwango cha kawaida bila kuongeza wazo kali zaidi la kutopimika.
- source_word: μέγεθος
  choice: ukuu
  rationale: Neno hili ni la kawaida, lenye hadhi, na linafaa kwa nomino dhahania inayozungumzia ukubwa wa nguvu za Mungu.
- source_word: δύναμις
  choice: nguvu
  rationale: Hili ndilo neno la kawaida zaidi kwa uwezo wenye matokeo, na linaanzisha mlolongo wa maneno yanayokaribiana kimaana.
- source_word: εἰς ἡμᾶς
  choice: kwetu sisi
  rationale: ‘Kwetu sisi’ huhifadhi mwelekeo wa εἰς bila kuamua kimya-kimya kwamba nguvu hizo ziko ndani yetu au ni kwa faida yetu tu.
- source_word: τοὺς πιστεύοντας
  choice: tunaoamini
  rationale: Huhifadhi hali ya kishiriki yenye maana ya kitendo kwa Kiswahili cha kawaida kuliko kutumia nomino ‘waumini.’
- source_word: κατά
  choice: kulingana na
  rationale: Huonyesha uwiano au kupatana kwa nguvu hiyo na utendaji unaotajwa baadaye.
- source_word: ἐνέργεια
  choice: utendaji
  rationale: Huonyesha shughuli yenye ufanisi bila maana za kisasa zinazoweza kuambatana na neno ‘nishati.’
- source_word: κράτος
  choice: uweza
  rationale: Huwakilisha nguvu inayojidhihirisha na kusaidia kutofautisha neno hili na δύναμις na ἰσχύς katika mlolongo wa Paulo.
- source_word: ἰσχύς
  choice: nguvu
  rationale: ‘Nguvu’ ni neno la kawaida kwa uwezo au nguvu iliyo ndani; katika kirai hiki urudiaji ni wa asili zaidi kuliko tafsiri ngumu ya kiufundi.
- source_word: καὶ τί
  choice: na jinsi ... ulivyo
  rationale: Muundo huu wa Kiswahili unaendeleza wazo la sala kutoka mstari uliotangulia na kueleza kwa ufasaha jambo ambalo waamini wanapaswa kulijua.
theological_decisions:
- issue: Kutafsiri mlolongo δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: Kuhifadhi mkusanyiko wa kimkazo kama ‘nguvu ... utendaji ... uweza ... nguvu.’
  alternative: Kufupisha kuwa ‘utendaji kamili wa nguvu zake.’
  rationale: Paulo anakusanya maneno yanayokaribiana ili kusisitiza ukubwa na ufanisi wa nguvu za Mungu; tafsiri haipaswi kuyageuza kuwa mfumo maalumu wa kiteolojia.
- issue: Mwelekeo wa nguvu za Mungu katika εἰς ἡμᾶς
  choice: ‘kwetu sisi tunaoamini’
  alternative: ‘ndani yetu sisi tunaoamini’ au ‘kwa ajili yetu sisi tunaoamini’
  rationale: εἰς huonyesha mwelekeo. ‘Kwetu sisi’ huhifadhi uwezekano huo bila kuamua ikiwa mkazo ni utendaji wa ndani au manufaa yanayotujia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘jinsi ukuu ... ulivyo mkuu mno’ ni wa kimkazo kwa makusudi na unaendeleza sentensi ndefu ya Paulo. Alama ya tanbihi [a] imewekwa baada ya ‘tunaoamini.’
