  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: sw
  text: kwa kutujulisha siri ya mapenzi yake, kulingana na nia yake njema aliyoikusudia katika yeye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika Kristo”; wengine huelewa “katika yeye” kuwa “katika yeye mwenyewe.”
    reason: Maana ya anayerejelewa na kiwakilishi cha Kigiriki inaweza kueleweka kwa njia mbili.
lexical_decisions:
- source_word: γνωρίσας
  choice: kwa kutujulisha
  rationale: Muundo wa ‘kwa kutujulisha’ unahifadhi uhusiano wa kitenzi-shirikishi cha aoristi na tendo kuu katika sentensi pana, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: ἡμῖν
  choice: -tu- (kutujulisha)
  rationale: Kiambishi cha yambwa ‘-tu-’ kinaonyesha kwa kawaida na kwa usahihi kwamba Mungu alitujulisha sisi.
- source_word: μυστήριον
  choice: siri
  rationale: Katika muktadha wa Paulo ni jambo la Mungu lililokuwa limefichwa lakini sasa limefunuliwa; ‘siri’ huwasilisha maana hiyo kwa Kiswahili cha sasa bila kudokeza kwamba haliwezi kujulikana.
- source_word: θέλημα
  choice: mapenzi
  rationale: ‘Mapenzi’ ni neno la kawaida la kibiblia na la Kiswahili sanifu kwa nia au utashi wa Mungu, na linatofautishwa na kitendo cha kukusudia kinachofuata.
- source_word: κατὰ
  choice: kulingana na
  rationale: Kirai hiki huonyesha kipimo au upatano unaoelezwa na κατά pamoja na hali ya accusative.
- source_word: εὐδοκίαν
  choice: nia yake njema
  rationale: Huwasilisha mwelekeo chanya wa hiari wa εὐδοκία kwa lugha ya sasa; ‘ridhaa’ ingeweza kueleweka hasa kama kibali, na ‘furaha njema’ si ya asili katika muktadha huu.
- source_word: προέθετο
  choice: aliyoikusudia
  rationale: Kitenzi hiki kinaonyesha kwamba Mungu aliweka jambo hilo kuwa kusudi lake; ‘kukusudia’ ni cha asili na hakiongezi wazo la kulionyesha hadharani.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Hufuatilia kiwakilishi cha Kigiriki bila kutaja wazi kama kinamrejelea Kristo au kinatumiwa kwa maana ya kujirejelea Mungu mwenyewe; utata huo halisi umehifadhiwa.
theological_decisions:
- issue: Anayerejelewa na ἐν αὐτῷ
  choice: Maandishi makuu yanasema ‘ndani yake’ na hayamtaji anayerejelewa.
  alternative: ‘ndani ya Kristo’ au ‘ndani yake mwenyewe’
  rationale: Kiwakilishi cha Kigiriki kinaweza kueleweka kuwa kinamrejelea Kristo katika muktadha wa karibu, lakini wengine hukichukua kwa maana ya Mungu kujirejelea mwenyewe. Kutokutatua utata huo katika maandishi makuu kunahifadhi mvutano wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘kwa kutujulisha’ unaonyesha kwamba mstari huu ni sehemu ya sentensi ndefu ya awali. ‘Siri’ na ‘mapenzi yake’ ni wazi kwa msomaji wa kawaida huku zikihifadhi msamiati na uhusiano wa mawazo wa Kigiriki.
