translation:
  language: sw
  text: Ndani yake[a] tuna ukombozi kwa damu yake, msamaha wa makosa[b], kulingana na utajiri wa neema yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika yeye.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maasi.”
