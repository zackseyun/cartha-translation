lexical_decisions:
- source_word: ἐν ᾧ
  choice: Ndani yake
  rationale: Kiwakilishi hiki kinamrejelea Mpendwa aliyetajwa katika mstari uliotangulia. “Ndani yake” ni Kiswahili cha kawaida kinachohifadhi wazo la kuwa katika Kristo bila kuongeza ufafanuzi usio katika matini.
- source_word: ἔχομεν
  choice: tuna
  rationale: Kitenzi cha wakati wa sasa kinaonyesha hali au kitu walicho nacho waamini sasa; “tuna” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἀπολύτρωσιν
  choice: ukombozi
  rationale: Neno hili linamaanisha kufunguliwa au kuwekwa huru kwa gharama. “Ukombozi” huhifadhi uzito wake wa kileksika na kitheolojia.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: kwa damu yake
  rationale: διά pamoja na umilikishi huonyesha njia au chombo. “Kwa damu yake” huhifadhi taswira halisi ya damu na haibadilishi neno hilo kuwa ufafanuzi kama “kifo chake.”
- source_word: ἄφεσιν
  choice: msamaha
  rationale: Katika muktadha huu neno linaeleza kuondolewa kwa makosa; “msamaha” ni wazi na la kawaida katika Kiswahili cha sasa.
- source_word: παραπτωμάτων
  choice: makosa
  rationale: Neno linaweza kumaanisha matendo ya kukosea, kuasi, au kuvuka mpaka wa maadili. “Makosa” ni la kueleweka na haliongezi wazo kali zaidi la uasi kwa lazima.
- source_word: κατὰ τὸ πλοῦτος
  choice: kulingana na utajiri
  rationale: κατά hapa huonyesha kipimo au kiwango. “Kulingana na utajiri” huonyesha kwamba msamaha huo unalingana na wingi wa neema ya Mungu, si kwamba unatoka humo tu.
- source_word: χάριτος
  choice: neema
  rationale: “Neema” ndilo neno la kawaida na lenye upeo unaofaa kwa χάρις katika maandishi ya Paulo, likihifadhi wazo la fadhili ya Mungu inayotolewa bure.
theological_decisions:
- issue: Uhusiano kati ya “ukombozi” na “msamaha wa makosa”
  choice: Kirai cha pili kimetafsiriwa kama ufafanuzi wa kwanza kwa kutumia “yaani.”
  alternative: 'Kuacha virai viwili vikifuatana bila kiunganishi: “ukombozi kwa damu yake, msamaha wa makosa.”'
  rationale: Vishazi viwili vya Kigiriki viko katika uhusiano wa ufafanuzi, ambapo “msamaha wa makosa” unaeleza ukombozi unaozungumziwa. “Yaani” hufanya uhusiano huo uwe wazi katika Kiswahili bila kubadili maudhui.
- issue: Lugha ya upatanisho katika “kwa damu yake”
  choice: Taswira halisi ya damu imehifadhiwa.
  alternative: “kwa kifo chake” au “kwa kifo chake cha dhabihu”
  rationale: Matini yenyewe inasema “damu.” Kuibadili kuwa “kifo” kungetoa tafsiri ya maana badala ya kutafsiri neno lililotumiwa, na kungepunguza taswira yake ya dhabihu na agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa wasomaji wa kawaida huku istilahi kuu “ukombozi,” “damu,” “msamaha,” na “neema” zikihifadhiwa. “Ndani yake” limetumiwa badala ya muundo wa kibiblia zaidi “katika yeye,” nao umetajwa katika tanbihi.
