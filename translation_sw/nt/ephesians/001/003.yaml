  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: sw
  text: Ahimidiwe Mungu na Baba wa Bwana wetu Yesu Masihi[c], ambaye ametubariki kwa kila baraka ya kiroho[a] katika ulimwengu wa mbinguni[b] ndani ya Masihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila baraka ya Roho.” Kivumishi cha Kigiriki kinaweza kumaanisha “ya kiroho” kwa upana au “inayohusiana na Roho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika maeneo ya mbinguni.”
    reason: lexical_alternative
  - marker: c
    text: Tafsiri ya kimapokeo ni “Yesu Kristo” na “ndani ya Kristo.” Cheo cha Kigiriki Χριστός kimetafsiriwa hapa kuwa “Masihi” ili kuhifadhi maana yake.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Ahimidiwe
  rationale: Katika kauli hii ya sifa kwa Mungu, “Ahimidiwe” ni Kiswahili cha kawaida na cha heshima kinachoonyesha kumsifu Mungu, badala ya kueleweka tu kuwa ana hali ya kubarikiwa.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Mungu, aliye pia Baba
  rationale: Muundo huu unahifadhi majina yote mawili na kiunganishi cha Kigiriki, huku ukiepuka Kiswahili kinachoweza kusikika kana kwamba “Mungu” na “Baba” ni wahusika wawili tofauti.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la cheo cha κύριος katika Agano Jipya na linadumisha uzito wake wa Kikristo hapa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Yesu ni jina, na Χριστός hapa ni cheo chenye maana ya Masihi; Kiswahili hakihitaji kibainishi tofauti kabla ya cheo hicho.
- source_word: ὁ εὐλογήσας
  choice: Yeye ametubariki
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimizwa ambalo matokeo yake yanaendelea kuwahusu waamini. Sentensi mpya inafanya kifungu kirefu kisomeke kwa urahisi bila kubadili mhusika.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: kwa kila baraka ya kiroho
  rationale: “Kwa” ni kiunganishi cha asili baada ya “ametubariki,” na “kila baraka” huhifadhi upeo wa πάσῃ. “Ya kiroho” huacha wazi iwapo maana ni pana au inamhusu Roho moja kwa moja.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: katika ulimwengu wa mbinguni
  rationale: Kifungu hiki kinaonyesha nyanja au eneo la mbinguni. “Ulimwengu wa mbinguni” ni cha sasa na kinachoeleweka, bila kulazimisha picha ya mahali halisi tu.
- source_word: ἐν Χριστῷ
  choice: ndani ya Masihi
  rationale: “Ndani ya” hudumisha kwa ufupi lugha ya Paulo ya kuwa katika muungano na Masihi; “Masihi” huhifadhi maana ya cheo Χριστός.
theological_decisions:
- issue: Maana ya πνευματικῇ
  choice: ya kiroho
  alternative: ya Roho
  rationale: Kivumishi cha Kigiriki kinaweza kueleza baraka zilizo za kiroho kwa upana au zinazotoka kwa Roho. Maandishi makuu hayafungi uwezekano huo; maana mahsusi zaidi imewekwa katika tanbihi.
- issue: Kutafsiri Χριστός katika kauli za Paulo
  choice: Masihi katika “Yesu Masihi” na “ndani ya Masihi”
  alternative: Kristo katika “Yesu Kristo” na “ndani ya Kristo”
  rationale: Χριστός bado ina nguvu ya cheo hapa. “Masihi” huwasilisha maana yake badala ya kuitumia kama jina lisilotafsiriwa.
- issue: Uhusiano wa θεὸς καὶ πατὴρ
  choice: Mungu, aliye pia Baba
  alternative: Mungu na Baba
  rationale: Chaguo kuu linaonyesha kuwa mtu yuleyule ndiye Mungu na Baba wa Bwana Yesu, huku likihifadhi vipengele vyote vya Kigiriki na kuzuia sintaksia ya Kiswahili yenye utata usiokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kigiriki imegawanywa mara mbili kwa uwazi; “Yeye” inadumisha wazi kwamba Mungu ndiye aliyebariki. Msamiati wa kidini uliotumika ni wa kawaida bila kuingiza msimamo wa dhehebu fulani.
