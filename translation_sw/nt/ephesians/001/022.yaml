  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: sw
  text: Naye alivitiisha vitu vyote chini ya miguu yake[a], na akamweka awe kichwa juu ya vitu vyote kwa ajili ya kanisa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno haya yanadokeza Zaburi 8:6, ambapo vitu vyote vinawekwa chini ya miguu ya mtawala.
    reason: cross_reference
  - marker: b
    text: Au, “kwa kanisa”; katika Kigiriki, umbo la ‘kanisa’ linaweza kuonyesha anayepokea au anayenufaika.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: vitu vyote
  rationale: Nomino hii ya wingi isiyo na jinsia inaonyesha jumla ya vitu, si watu pekee, na hivyo inadumisha upeo wa ulimwengu mzima.
- source_word: ὑπέταξεν
  choice: alivitiisha
  rationale: Kitenzi hiki kinaonyesha kuviweka vitu katika hali ya kuwa chini ya mamlaka; ‘alivitiisha’ ni wazi na kinadumisha nguvu ya tendo hilo.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: chini ya miguu yake
  rationale: Taswira halisi ya utawala na ushindi imehifadhiwa kwa sababu pia inadokeza Zaburi 8:6.
- source_word: αὐτὸν ἔδωκεν
  choice: akamtoa
  rationale: ‘Kumtoa’ kinadumisha maana ya msingi ya δίδωμι, ‘kutoa,’ bila kuibadili moja kwa moja kuwa ‘kumteua.’ Katika muktadha huu kinamaanisha Mungu alimtoa Kristo kwa uhusiano maalumu na kanisa.
- source_word: κεφαλὴν
  choice: kuwa kichwa
  rationale: Taswira ya kichwa imehifadhiwa, ikionyesha ukuu na mamlaka bila kufafanua kupita kiasi kila kipengele cha sitiari.
- source_word: ὑπὲρ πάντα
  choice: juu ya vitu vyote
  rationale: Kifungu hiki kinaeleza ukuu au mamlaka juu ya jumla yote; ‘vitu vyote’ kinadhihirisha marejeo ya πάντα.
- source_word: τῇ ἐκκλησίᾳ
  choice: kwa kanisa
  rationale: ‘Kwa kanisa’ ni usemi wa asili unaoweza kueleweka kuwa kanisa ndilo linalopewa au kunufaishwa. Tanbihi inahifadhi uwezekano wa maana ya faida kwa kanisa.
theological_decisions:
- issue: Uhusiano wa ukichwa wa Kristo na kanisa pamoja na vitu vyote
  choice: Kristo ametolewa kwa kanisa akiwa kichwa juu ya vitu vyote.
  alternative: Kristo amewekwa kuwa kichwa juu ya vitu vyote kwa faida ya kanisa.
  rationale: Mpangilio huu unaunganisha ‘kichwa’ na ‘juu ya vitu vyote,’ huku ‘kwa kanisa’ ukihifadhi uhusiano maalumu wa kanisa kama mpokeaji au mnufaika. Hivyo ukuu wa Kristo juu ya vyote na manufaa maalumu kwa kanisa vyote vinabaki bila kulazimisha maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira za ‘chini ya miguu’ na ‘kichwa’ zimehifadhiwa kwa sababu ya uzito wake wa kimaandiko na kiteolojia.
