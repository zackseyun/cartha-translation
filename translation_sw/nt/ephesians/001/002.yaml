  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: sw
  text: Neema na amani ziwe kwenu kutoka kwa Mungu Baba yetu na kwa Bwana Yesu Masihi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kuwa cheo, “Masihi,” au katika baadhi ya miktadha kutumiwa kama sehemu ya jina, “Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: Katika salamu za Paulo, neno hili ni salamu na pia baraka yenye uzito wa kiteolojia; “neema” huhifadhi maana hizo kwa Kiswahili cha kawaida cha Biblia.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Hii ndiyo njia ya kawaida na ya asili ya kuonyesha walengwa wa salamu au baraka kwa Kiswahili.
- source_word: εἰρήνη
  choice: amani
  rationale: “Amani” huhifadhi maana ya kawaida na mwangwi unaowezekana wa dhana ya Kiyahudi ya shalom.
- source_word: ἀπὸ
  choice: kutoka kwa
  rationale: Kirai hiki kinaonyesha chanzo cha neema na amani. Kurudia “kwa” mbele ya Bwana Yesu kunaweka wazi kwa Kiswahili kwamba wote wawili wanatajwa kama chanzo.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Mungu Baba yetu
  rationale: Muundo huu unasoma πατρὸς kama maelezo ya Mungu—yaani, Mungu ambaye ni Baba yetu—bila kuongeza kiunganishi kisichomo katika Kigiriki.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida inayohifadhi nguvu ya cheo cha κύριος katika kumrejelea Yesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” hutafsiri maana ya cheo Χριστός badala ya kukitumia tu kama jina. Kiswahili hakihitaji kibainishi kinacholingana na neno la Kiingereza “the”.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Χριστός linaweza kufanya kazi kama cheo au kama sehemu ya jina lililozoeleka. Matini kuu inaonyesha wazi maana ya cheo “Masihi,” huku tanbihi ikihifadhi tafsiri iliyozoeleka “Kristo” bila kuficha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “Neema na amani ziwe kwenu” ni wa asili katika baraka, na “kutoka kwa ... na kwa ...” huhifadhi kwa uwazi chanzo cha baraka kilichoonyeshwa na ἀπὸ.
