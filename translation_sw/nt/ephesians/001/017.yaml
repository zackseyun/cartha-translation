lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au maudhui ya ombi la Paulo kutoka mstari uliotangulia, kwa Kiswahili cha kawaida na fasaha.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν
  choice: Mungu wa Bwana wetu
  rationale: Huhifadhi kwa karibu uhusiano wa maneno ya Kigiriki bila kuufafanua zaidi.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός ni cheo chenye maana ya ‘Masihi’; Kiswahili hakihitaji kibainishi kinacholingana na ‘the’ ya Kiingereza mbele ya cheo hiki.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: Baba wa utukufu
  rationale: Huhifadhi muundo wa Kigiriki wa nomino mbili na uzito wake wa kiteolojia, badala ya kuufanya moja kwa moja kuwa kivumishi.
- source_word: δώῃ ὑμῖν
  choice: awape
  rationale: Huwakilisha hali ya ombi inayofuata ἵνα na pia wingi wa ὑμῖν.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: roho ya hekima na ufunuo
  rationale: Huhifadhi kutokubainika kikamilifu ikiwa πνεῦμα ni roho au mwelekeo anaopewa mtu na Mungu, au Roho Mtakatifu; dokezo linaonyesha uwezekano mwingine.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: katika kumjua yeye
  rationale: Ni Kiswahili cha asili kinachoeleza maarifa ya kumhusu Mungu, huku ‘yeye’ ikisisitiza kiwakilishi cha Kigiriki αὐτοῦ.
theological_decisions:
- issue: Ikiwa πνεῦμα inamaanisha Roho Mtakatifu au roho/mwelekeo unaotolewa na Mungu
  choice: roho ya hekima na ufunuo
  alternative: Roho wa hekima na ufunuo
  rationale: Kutokuwapo kwa kibainishi katika Kigiriki na muundo wa kirai huruhusu maana zote mbili. Matini kuu haitambulishi kwa lazima kuwa ni Roho Mtakatifu, na dokezo linahifadhi usomaji huo.
- issue: Jinsi ya kutafsiri Χριστός katika Ἰησοῦ Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Hapa neno hilo linaendelea kueleweka kama cheo, hivyo ‘Masihi’ huwasilisha maana yake badala ya kuliacha kama jina lililozoeleka.
- issue: Maana ya ὁ πατὴρ τῆς δόξης
  choice: Baba wa utukufu
  alternative: Baba mwenye utukufu
  rationale: Tafsiri kuu huhifadhi muundo halisi wa Kigiriki na haifungi kirai hicho kwenye maana ya kivumishi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Baba wa utukufu’ umehifadhiwa kwa makusudi, huku ‘katika kumjua yeye’ ukitoa Kiswahili cha sasa na cha asili.
