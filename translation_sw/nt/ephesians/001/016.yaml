lexical_decisions:
- source_word: οὐ παύομαι
  choice: Siachi
  rationale: Kitenzi cha wakati uliopo pamoja na οὐ kinaonyesha kutokoma kunakoendelea; “Siachi” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: εὐχαριστῶν
  choice: kutoa shukrani
  rationale: Kirai hiki hudumisha maana ya wazi ya kushukuru na kinaonyesha tendo linaloendelea sambamba na “Siachi.”
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Katika muktadha wa shukrani, ὑπέρ pamoja na jenitivi huwaonyesha watu ambao Paulo anamshukuru Mungu kwa habari yao.
- source_word: μνείαν ποιούμενος
  choice: nikiwakumbuka
  rationale: Nahau ya Kigiriki ni kihalisi “nikifanya kutaja”; katika Kiswahili, “nikiwakumbuka” huwasilisha kwa kawaida tendo la kuwataja mbele za Mungu bila kuleta usemi mgumu.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: katika sala zangu
  rationale: Kirai hiki huonyesha mazingira au wakati ambapo kuwakumbuka kunatokea; “katika sala zangu” ni cha kawaida na sahihi.
