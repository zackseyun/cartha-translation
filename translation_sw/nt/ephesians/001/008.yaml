lexical_decisions:
- source_word: ἧς
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea neema iliyotajwa katika mstari uliotangulia; “ambayo” kinaendeleza uhusiano huo kwa Kiswahili cha kawaida bila kulazimisha maana ya chombo.
- source_word: ἐπερίσσευσεν
  choice: alitumiminia kwa wingi
  rationale: 'Kitenzi hapa kina maana ya kisababishi: Mungu aliifanya neema yake iwafikie waamini kwa wingi unaofurika. “Alitumiminia kwa wingi” ni lugha ya asili na yenye picha wazi ya ukarimu mwingi.'
- source_word: εἰς ἡμᾶς
  choice: juu yetu
  rationale: Kirai hiki kinaonyesha mwelekeo wa neema kwa wapokeaji. “Juu yetu” kinaendana na picha ya kutumiminiwa na kuhifadhi wazo la kitu kinachoelekezwa kwao.
- source_word: ἐν
  choice: katika
  rationale: “Katika” huhifadhi kwa kiasi fulani uwazi wa ἐν, ambayo yaweza kueleweka kuwa namna Mungu alivyotenda au mazingira/sifa zinazohusiana na zawadi iliyotolewa.
- source_word: πάσῃ
  choice: yote
  rationale: Likiwa na nomino dhahania ya umoja, neno hili linaonyesha ukamilifu au upeo mzima.
- source_word: σοφίᾳ
  choice: hekima
  rationale: Hili ndilo neno la kawaida, wazi na linalofaa kwa σοφία.
- source_word: φρονήσει
  choice: ufahamu
  rationale: “Ufahamu” hutofautisha neno hili na “hekima” huku likiwasilisha uwezo wa kuelewa na kupambanua kwa vitendo, bila kutumia lugha ya kizamani.
theological_decisions:
- issue: Kirai “katika hekima yote na ufahamu” kinahusiana na nini?
  choice: Muundo umeachwa wazi bila kusema moja kwa moja ikiwa hekima na ufahamu vinaeleza namna Mungu alivyomimina neema au vinahusiana na kile waamini walichopewa.
  alternative: Kutafsiri wazi kwamba ni hekima na ufahamu wa Mungu katika kutoa neema, au kwamba ni hekima na ufahamu waliopewa waamini pamoja na neema.
  rationale: Muundo wa Kigiriki unaruhusu maelezo yote mawili. Tafsiri haipaswi kuondoa utata halisi wa kisarufi wala kuingiza uamuzi wa kitheolojia usiolazimishwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Picha ya neema kumiminwa kwa wingi imehifadhiwa, na mpangilio wa kirai cha mwisho umeachwa wazi ili kutohitimisha utata wa asili.
