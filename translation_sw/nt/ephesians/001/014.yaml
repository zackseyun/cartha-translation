  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: sw
  text: Yeye ndiye dhamana ya urithi wetu, kuelekea ukombozi wa milki yake, kwa sifa ya utukufu wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅ
  choice: Yeye
  rationale: Kiwakilishi hiki kinamrejelea Roho Mtakatifu katika mstari uliotangulia; Kiswahili cha kawaida huhitaji kurejelea nafsi kwa uwazi.
- source_word: ἀρραβών
  choice: dhamana
  rationale: Neno hili humaanisha malipo au amana ya awali inayohakikisha kwamba kilichoahidiwa kitatimizwa; “dhamana” ni ya asili na hudumisha wazo la uhakikisho bila kulifanya kuwa urithi wenyewe.
- source_word: κληρονομίας
  choice: urithi
  rationale: Huhifadhi taswira ya kibiblia ya kile waamini walichoahidiwa na Mungu.
- source_word: εἰς ἀπολύτρωσιν
  choice: hadi ukombozi
  rationale: εἰς hapa inaonyesha mwelekeo kuelekea utimilifu wa baadaye; “hadi” ni ya asili na haibadili ukombozi kuwa sababu ya dhamana.
- source_word: τῆς περιποιήσεως
  choice: wa wale walio mali ya Mungu
  rationale: Muundo huu unaweza kumaanisha milki iliyopatikana au watu walio mali maalumu; katika muktadha wa ukombozi, tafsiri ya watu walio mali ya Mungu ni ya kueleweka, huku uhusiano wa umiliki ukihifadhiwa.
- source_word: εἰς ἔπαινον τῆς δόξης αὐτοῦ
  choice: ili utukufu wake usifiwe
  rationale: Hutoa kwa Kiswahili cha kawaida kusudi la kishazi huku ikihifadhi “utukufu wake” kama kitu kinachosifiwa.
theological_decisions:
- issue: Mrejelewa wa ὅ na jinsia yake ya kisarufi
  choice: “Yeye” akimrejelea Roho Mtakatifu
  alternative: “ambayo” ikirejelea muhuri au ahadi
  rationale: Muktadha wa karibu katika mstari wa 13 humtaja Roho Mtakatifu wa ahadi; ingawa ὅ ni ya jinsia ya kati kwa upatanisho na πνεῦμα, marejeleo yake ni ya kibinafsi.
- issue: Maana ya τῆς περιποιήσεως
  choice: wale walio mali ya Mungu
  alternative: mali/milki iliyopatikana
  rationale: Neno lina wigo wa maana unaoruhusu “milki” au “watu waliopatikana.” Chaguo hili linaendana na matumizi ya watu wa Mungu kama milki yake, lakini halipaswi kupanuliwa na madai ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa urahisi wa kusomwa hadharani; istilahi “dhamana,” “urithi,” na “ukombozi” zinadumisha taswira kuu za Kigiriki.
