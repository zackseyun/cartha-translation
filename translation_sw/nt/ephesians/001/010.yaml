  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: sw
  text: kwa ajili ya usimamizi wa utimilifu wa nyakati, kuvikusanya[a] vitu vyote katika Masiya—vitu vilivyo mbinguni na vitu vilivyo duniani—katika yeye,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuviweka vitu vyote chini ya kichwa kimoja katika Masiya”; kitenzi cha Kigiriki kinaweza kumaanisha kuvikusanya pamoja au kuviweka chini ya kichwa.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: usimamizi
  rationale: Neno hili linaweza kumaanisha usimamizi, mpangilio, au utekelezaji wa kusudi. “Usimamizi” unadumisha wazo la Mungu kuendesha kusudi lake kwa utaratibu bila kulifupisha kuwa “mpango” tu.
- source_word: πληρώματος τῶν καιρῶν
  choice: utimilifu wa nyakati
  rationale: Tafsiri hii inadumisha picha ya nyakati zilizofikia kipimo au hatua yake kamili, bila kuamua kimya kimya kuwa maana ni mwisho wa wakati pekee.
- source_word: ἀνακεφαλαιώσασθαι
  choice: kuvijumuisha
  rationale: “Kuvijumuisha” ni Kiswahili cha asili kinachoweza kuonyesha kuleta vitu vyote katika jumla moja. Kwa kuwa kitenzi cha Kigiriki kinaweza pia kuwa na wazo la kuviunganisha chini ya kichwa, maana hiyo imehifadhiwa katika tanbihi.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Usemi huu unadumisha upeo mpana wa wingi usio na jinsia katika muktadha wa ulimwengu wote.
- source_word: ἐν τῷ Χριστῷ
  choice: katika Masiya
  rationale: Hapa Χριστός linafanya kazi kama cheo; “Masiya” linaonyesha maana yake badala ya kulitumia kama jina lisilotafsiriwa.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: vitu vilivyo mbinguni
  rationale: Tafsiri hii inaonyesha mahali vilipo vitu hivyo na inadumisha upeo wa ulimwengu wa mbinguni kwa Kiswahili cha kawaida.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: vitu vilivyo duniani
  rationale: Huu ni ulinganifu wa wazi na wa kawaida wa Kiswahili unaotofautisha eneo la duniani na la mbinguni.
- source_word: ἐν αὐτῷ
  choice: katika yeye
  rationale: Kirai hiki kinadumisha marudio na mkazo wa Kigiriki; kiwakilishi kinamrejelea Masiya bila kuongeza wazo la upekee ambalo halijaelezwa wazi.
theological_decisions:
- issue: Maana ya ἀνακεφαλαιώσασθαι
  choice: kuvijumuisha vitu vyote
  alternative: kuviunganisha vitu vyote chini ya kichwa kimoja
  rationale: Kitenzi kinaweza kueleza kuvifanya vitu vyote kuwa jumla moja na pia kuvikusanya chini ya kichwa. Matini kuu inatumia usemi mpana, huku tanbihi ikihifadhi maana ya kichwa bila kulazimisha fasiri moja.
- issue: Jinsi ya kutafsiri Χριστῷ
  choice: Masiya
  alternative: Kristo
  rationale: Katika muktadha huu neno hilo ni cheo cha yule aliyeahidiwa; “Masiya” linaweka wazi maana hiyo ya cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa aya umehifadhiwa kama sehemu ya sentensi inayoendelea, na vistari virefu vinaonyesha maelezo ya mambo ya mbinguni na ya duniani.
