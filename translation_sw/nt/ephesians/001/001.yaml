base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: sw
  text: 'Paulo, mtume wa Masihi Yesu[c] kwa mapenzi ya Mungu, kwa watakatifu walioko [katika Efeso][a] na walio waaminifu[b] katika Masihi Yesu:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale hazina maneno “katika Efeso.” Kwa sababu hiyo, wengine huelewa kwamba barua hii ilikusudiwa kusambazwa kwa makanisa kadhaa, si kwa kanisa la Efeso pekee.
    reason: textual_variant
  - marker: b
    text: Au “waamini katika Masihi Yesu.”
    reason: lexical_alternative
  - marker: c
    text: Au “Kristo Yesu.” Neno la Kigiriki Christos ni cheo chenye maana ya “Masihi” au “Mtiwa-Mafuta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: mtume
  rationale: Ni neno la kawaida la Kiswahili kwa cheo cha mtu aliyetumwa akiwa na mamlaka; hapa linahifadhi maana maalumu ya huduma ya Paulo.
- source_word: Χριστοῦ Ἰησοῦ
  choice: wa Masihi Yesu
  rationale: Χριστός hapa inatumika kama cheo cha Yesu. “Masihi” huonyesha wazi maana yake ya Mtiwa-Mafuta, huku mpangilio wa Kigiriki “Masihi Yesu” ukihifadhiwa.
- source_word: διὰ θελήματος θεοῦ
  choice: kwa mapenzi ya Mungu
  rationale: Kirai hiki cha kawaida na cha asili katika Kiswahili kinaeleza kwamba utume wa Paulo unatokana na mapenzi na mamlaka ya Mungu.
- source_word: ἁγίοις
  choice: watakatifu
  rationale: Katika salamu za Paulo neno hili linawataja kwa pamoja watu waliowekwa wakfu kwa Mungu; “watakatifu” ni tafsiri fupi, yenye heshima, na inayotambulika.
- source_word: τοῖς οὖσιν
  choice: walioko
  rationale: Hutoa kwa ufupi maana ya “wale walioko” na kuunganisha kwa kawaida mahali wanapopatikana wapokeaji.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[Efeso]'
  rationale: Jina la mahali limewekwa katika mabano ili kuonyesha kutokuwa na uhakika kwa maneno haya katika mapokeo ya hati.
- source_word: πιστοῖς
  choice: walio waaminifu
  rationale: Huhifadhi sifa ya uaminifu bila kufunga uwezekano kwamba neno hilo linamaanisha waamini; maana hiyo mbadala imewekwa katika tanbihi.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Katika” huhifadhi lugha ya uhusiano au muungano na Yesu, naye Χριστός ametafsiriwa kama cheo, “Masihi.”
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika salamu ya Paulo
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός bado ina nguvu ya cheo. “Masihi” huonyesha maana hiyo wazi; tafsiri iliyozoeleka zaidi ya “Kristo” imetajwa katika tanbihi.
- issue: Hali ya maneno ἐν Ἐφέσῳ
  choice: Kuyahifadhi katika mabano kama [Efeso]
  alternative: Kuyaacha maneno “Efeso”
  rationale: Hati fulani muhimu za kale hazina maneno haya. Mabano na tanbihi huonyesha wazi ushahidi huo bila kuamua kimya kimya kati ya mapokeo hayo.
- issue: Maana ya πιστοῖς
  choice: walio waaminifu
  alternative: waamini
  rationale: Neno la Kigiriki linaweza kueleza uaminifu au utambulisho wa wanaoamini. Maandishi makuu yanahifadhi maana ya kisifa, na tanbihi inalinda maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa salamu ya barua umehifadhiwa, na mabano yanaonyesha moja kwa moja tofauti muhimu ya hati.
