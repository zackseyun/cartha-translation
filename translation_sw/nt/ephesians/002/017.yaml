base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: sw
  text: Naye akaja na kuwatangazia amani ninyi mliokuwa mbali[a][b], na amani wale waliokuwa karibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, amani ilitangazwa kwa wale waliokuwa mbali hapo awali na kwa wale waliokuwa karibu—katika muktadha, watu wa Mataifa na Wayahudi, kwa mpangilio huo (tazama Waefeso 2:11–13).
    reason: cross_reference
  - marker: b
    text: Au, “kuwahubiria habari njema ya amani.” Kitenzi cha Kigiriki mara nyingi humaanisha kutangaza habari njema, lakini hapa shamirisho lake ni “amani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: akaja
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo la kuja linaloandaa au kuandamana na kutangaza; “akaja” ni Kiswahili cha kawaida na huhifadhi taswira ya kuja.
- source_word: εὐηγγελίσατο
  choice: kuwatangazia
  rationale: Kitenzi hiki humaanisha kuleta au kutangaza habari njema. Kwa kuwa shamirisho hapa ni “amani,” “kuwatangazia amani” ni cha asili bila kuongeza neno “injili” lisilopo wazi katika Kigiriki.
- source_word: εἰρήνην
  choice: amani
  rationale: Ni kisawe cha moja kwa moja kinachoweza pia kubeba maana pana ya upatanisho na hali njema katika muktadha.
- source_word: ὑμῖν
  choice: ninyi
  rationale: Huhifadhi usemi wa moja kwa moja kwa wasomaji; uhusiano wa utoaji unaelezwa tayari na kiambishi “-wa-” katika “kuwatangazia.”
- source_word: τοῖς μακρὰν
  choice: mliokuwa mbali
  rationale: Huhifadhi sitiari ya umbali na kuieleza kwa Kiswahili cha kawaida, bila kuingiza utambulisho wa kundi moja kwa moja katika matini.
- source_word: τοῖς ἐγγύς
  choice: wale waliokuwa karibu
  rationale: Huhifadhi ulinganifu na “mliokuwa mbali” pamoja na tofauti ya sitiari kati ya makundi hayo mawili.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: Urudiaji wa kiunganishi huhifadhi muundo wa Kigiriki unaoyaunganisha makundi mawili kama wapokeaji wa tangazo lilelile.
theological_decisions:
- issue: Utambulisho wa walio mbali na waliokuwa karibu
  choice: Kutafsiri sitiari za “mbali” na “karibu” bila kutaja makundi hayo moja kwa moja katika matini.
  alternative: “ninyi watu wa Mataifa” na “Wayahudi”
  rationale: Muktadha unaelekeza kwa watu wa Mataifa na Wayahudi (Waefeso 2:11–13), lakini mstari wenyewe unatumia lugha ya mbali na karibu. Kuihifadhi hudumisha taswira na mvutano wa hoja ya Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Naye akaja na kuwatangazia” ni wa kawaida, huhifadhi mfuatano wa kuja na kutangaza, na huepuka kuongeza istilahi ya kidhehebu.
