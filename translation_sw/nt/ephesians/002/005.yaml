  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: sw
  text: hata tulipokuwa wafu katika makosa yetu, alituhuisha pamoja na Masihi[a]—mmeokolewa kwa neema—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi”; tafsiri nyingi za jadi hutumia “Kristo.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: tulipokuwa wafu
  rationale: Muundo huu unaendeleza hali iliyoelezwa katika mstari uliotangulia. “Tulipokuwa wafu” ni Kiswahili cha kawaida kinachohifadhi maana ya wakati bila kulazimisha dhana ya ukinzani.
- source_word: τοῖς παραπτώμασιν
  choice: katika makosa yetu
  rationale: “Katika” huhifadhi wazo la kuwa katika hali au eneo la makosa bila kuamua kimyakimya kwamba dativu inaonyesha sababu pekee. “Yetu” inaeleweka kutokana na kiwakilishi cha nafsi ya kwanza wingi katika kifungu na muktadha.
- source_word: συνεζωοποίησεν
  choice: alituhuisha pamoja
  rationale: “Alituhuisha” hutoa maana ya kumpa mtu uhai, huku “pamoja” ikihifadhi wazo la ushirika lililomo katika kitenzi ambatani.
- source_word: τῷ Χριστῷ
  choice: na Masihi
  rationale: Dativu inaonyesha kuhuishwa kwa ushirika na Χριστός. “Masihi” huhifadhi maana ya cheo cha Χριστός, badala ya kukitumia kama jina lisiloelezwa.
- source_word: χάριτί
  choice: kwa neema
  rationale: “Kwa neema” ni usemi wa kawaida na sahihi unaowasilisha dativu ya njia au msingi wa tendo.
- source_word: ἐστε σεσῳσμένοι
  choice: mmeokolewa
  rationale: Kitenzi hiki cha hali timilifu na sauti tendwa kinaonyesha tendo lililokamilika lenye matokeo yanayoendelea; “mmeokolewa” hulihifadhi kwa ufupi na kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός bado lina nguvu ya cheo. “Masihi” huhifadhi maana hiyo, huku tanbihi ikitaja tafsiri ya mapokeo iliyozoeleka.
- issue: Nguvu ya kifungu χάριτί ἐστε σεσῳσμένοι
  choice: kukihifadhi kama kauli ya ghafla ndani ya vistari virefu
  alternative: kukijumuisha bila alama ya msisitizo katika sentensi
  rationale: Kuingizwa kwake kwa ghafla ni sehemu ya mkazo wa Paulo na kunatangulia maelezo mapana katika mistari ya 8–9; vistari virefu vinahifadhi mkazo huo bila kuongeza ufafanuzi.
- issue: Uhusiano wa τοῖς παραπτώμασιν na νεκρούς
  choice: katika makosa yetu
  alternative: kwa sababu ya makosa yetu
  rationale: Dativu inaweza kueleweka kwa kurejelea hali au eneo, na huenda pia ikadokeza sababu. “Katika” huhifadhi mvutano huo kuliko kuamua wazi kuwa ni sababu tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio na vistari virefu vinahifadhi mwendo wa sentensi ya Kigiriki na kauli yake ya ghafla kuhusu neema.
