  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: sw
  text: Lakini Mungu, akiwa mwingi wa rehema[a], kwa sababu ya upendo wake mkuu ambao alitupenda kwa huo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno: “tajiri katika rehema.”'
    reason: Hueleza usemi halisi wa Kigiriki uliotafsiriwa kwa Kiswahili cha asili kuwa ‘mwingi wa rehema.’
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti kubwa na hali ya wanadamu iliyoelezwa katika mistari iliyotangulia.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: akiwa mwingi wa rehema
  rationale: Ni Kiswahili cha kawaida kinachoeleza wingi wa rehema huku muundo halisi wa Kigiriki, ‘akiwa tajiri katika rehema,’ ukihifadhiwa katika tanbihi.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: kwa sababu ya upendo wake mkuu
  rationale: διά pamoja na hali ya accusative hapa huonyesha sababu; ‘upendo wake mkuu’ ni usemi wa asili unaohifadhi uzito wa πολλὴν ἀγάπην.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: aliotupenda nao
  rationale: Inahifadhi kishazi rejeshi na urudiaji wa mzizi wa maana katika ‘upendo ... alitupenda,’ bila kuufupisha kuwa ‘upendo wake kwetu.’
theological_decisions:
- issue: Kuhifadhi urudiaji wa ἀγάπην ... ἠγάπησεν
  choice: upendo wake mkuu aliotupenda nao
  alternative: upendo wake mkuu kwetu
  rationale: Kigiriki kinasisitiza kwa kutumia nomino na kitenzi vya mzizi mmoja. Kiswahili hiki kinahifadhi msisitizo huo ingawa kina ladha rasmi kidogo.
- issue: Uhusiano kati ya rehema na upendo
  choice: mwingi wa rehema ... kwa sababu ya upendo wake mkuu
  alternative: mwingi wa upendo wenye rehema
  rationale: Maandishi ya Kigiriki yanataja rehema na upendo kama dhana mbili zinazohusiana lakini zisizo sawa; kuzitenganisha huepuka kuzifanya dhana moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki kuwa sehemu ya sentensi inayoendelea katika mstari unaofuata, kama ilivyo katika Kigiriki.
