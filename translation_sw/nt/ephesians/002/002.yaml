base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: sw
  text: ambamo zamani mlienenda[a], kulingana na zama za ulimwengu huu, mkimfuata mtawala wa mamlaka ya anga[b], roho inayofanya kazi sasa ndani ya wana wa kutotii[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mlitembea”; hapa ni sitiari inayomaanisha jinsi walivyoishi au kujiendesha.
    reason: lexical_alternative
  - marker: b
    text: “Anga” linaakisi lugha ya kale kuhusu eneo lililohusishwa na nguvu za kiroho zenye uadui.
    reason: cultural_note
  - marker: c
    text: “Wana wa kutotii” ni nahau inayomaanisha watu wenye sifa ya kutotii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: ambamo
  rationale: Kiwakilishi hiki kinarejelea makosa na dhambi za mstari uliotangulia na kuhifadhi wazo la kuwa ndani ya mwenendo huo.
- source_word: ποτε περιεπατήσατε
  choice: zamani mlienenda
  rationale: “Zamani” huonyesha hali ya maisha iliyopita, na “mlienenda” huhifadhi sitiari ya Paulo ya kutembea kwa maana ya kuishi au kujiendesha.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: mkifuata zama za ulimwengu huu
  rationale: “Zama” hutofautisha αἰών na κόσμος na kuonyesha kipindi au mfumo unaoutawala ulimwengu wa sasa; “mkifuata” huwasilisha maana ya kuishi kwa kupatana na kitu.
- source_word: κατὰ τὸν ἄρχοντα
  choice: mkimfuata mtawala
  rationale: “Mtawala” ni neno la sasa na wazi kwa ἄρχων; kiambishi cha nafsi huonyesha kuwa hapa anarejelewa mwenye kutenda.
- source_word: τῆς ἐξουσίας τοῦ ἀέρος
  choice: wa mamlaka ya anga
  rationale: Tafsiri hii huhifadhi mfuatano wa nomino na lugha ya ulimwengu wa kale bila kuibadili kuwa maelezo ya kitheolojia.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: yaani, roho inayofanya kazi sasa
  rationale: “Roho” imeandikwa kwa herufi ndogo kwa kuwa muktadha hauzungumzii Roho Mtakatifu. Kauli hii inaunganisha roho hiyo na mtawala aliyetajwa bila kufafanua zaidi asili yake.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: ndani ya wana wa kutotii
  rationale: “Wana wa kutotii” huhifadhi nahau ya chanzo na nomino ya kiume, huku “ndani ya” ikihifadhi ἐν na wazo la nguvu inayotenda ndani yao.
theological_decisions:
- issue: Uhusiano wa “roho inayofanya kazi sasa” na “mtawala wa mamlaka ya anga”
  choice: Kutumia “yaani” ili kuonyesha kuwa “roho” inafafanua zaidi nguvu inayohusishwa na mtawala.
  alternative: Kuitafsiri roho kuwa kiumbe kingine tofauti au nguvu isiyo na utu iliyo chini ya mtawala.
  rationale: Muundo wa Kigiriki unaruhusu maelezo ya kuambatanisha. Tafsiri inaonyesha uhusiano huo lakini haiamui ikiwa roho ni mtawala mwenyewe au nguvu inayohusishwa naye.
- issue: Nahau υἱοῖς τῆς ἀπειθείας
  choice: wana wa kutotii
  alternative: watoto wa kutotii; watu wasiotii
  rationale: Chaguo hili huhifadhi umbo la kiume na nahau ya chanzo; tanbihi hufafanua kuwa inawahusu watu wanaotambulika kwa kutotii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mlienenda” ni neno la kiwango cha juu kidogo linalotumika ili kuhifadhi sitiari ya Kigiriki; tanbihi inalifafanua. Virai vya “mkifuata” vinafanya uhusiano wa κατά uwe wa kawaida katika Kiswahili huku tofauti kati ya “zama” na “ulimwengu” ikihifadhiwa.
