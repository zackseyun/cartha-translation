  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: sw
  text: Lakini sasa, katika Masihi Yesu[d], ninyi ambao zamani mlikuwa mbali[a] mmekuwa karibu[b] kwa damu ya Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbali sana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mmeletwa karibu” au “mmefanywa karibu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kupitia damu ya Masihi.”
    reason: lexical_alternative
  - marker: d
    text: 'Kigiriki: Χριστός, maana yake “Masihi”; hapa limetafsiriwa kama cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: Inaonyesha wazi mp contrast kati ya hali yao ya zamani na hali yao ya sasa, huku ikihifadhi msisitizo wa wakati uliomo katika νυνί.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Katika” huhifadhi lugha ya Paulo ya kuwa ndani ya au kuunganishwa na Masihi; “Masihi” hutafsiri Χριστός kama cheo.
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: ninyi ambao zamani mlikuwa
  rationale: Ni Kiswahili cha kawaida kinachohifadhi msisitizo wa ὑμεῖς na hali ya wakati uliopita inayoonyeshwa na ποτε na ὄντες.
- source_word: μακρὰν
  choice: mbali
  rationale: Neno hili la kawaida huhifadhi taswira ya umbali bila kuamua kimya kimya kama umbali huo ni wa mahali, uhusiano, au hadhi ya agano.
- source_word: ἐγενήθητε ἐγγὺς
  choice: mmekuwa karibu
  rationale: Hufuata kwa karibu maana ya γίνομαι, “kuwa/kufanyika,” bila kuongeza mtendaji ambaye hajatajwa wazi katika kifungu.
- source_word: ἐν τῷ αἵματι
  choice: kwa damu
  rationale: “Kwa” huwasilisha matumizi ya kiinstrumentali ya ἐν, yaani damu kuwa njia ambayo ukaribu umepatikana, huku tanbihi ikihifadhi uwezekano wa “kupitia.”
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός imetafsiriwa kama cheo chenye maana, kwa uthabiti na matumizi yake ya kwanza katika mstari.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu Χριστός inafanya kazi kama cheo; “Masihi” huwasilisha maana yake badala ya kuitoa kama umbo lililokopwa pekee.
- issue: Nguvu ya ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: kwa damu ya Masihi
  alternative: kupitia damu ya Masihi; katika damu ya Masihi
  rationale: “Kwa” huonyesha damu kama njia ya kufanywa karibu bila kuingiza nadharia maalumu zaidi ya upatanisho kuliko inayosemwa na maandiko.
- issue: Sauti na utendaji katika ἐγενήθητε ἐγγὺς
  choice: mmekuwa karibu
  alternative: mmeletwa karibu; mmefanywa kuwa karibu
  rationale: Utoaji huu huhifadhi mabadiliko ya hali yanayoonyeshwa na ἐγενήθητε bila kumtaja wazi mtendaji ambaye Kigiriki hakimtaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “katika Masihi Yesu” limehifadhiwa kwa sababu lina uzito wa kitheolojia katika lugha ya Paulo, ingawa si usemi wa kawaida wa mazungumzo.
