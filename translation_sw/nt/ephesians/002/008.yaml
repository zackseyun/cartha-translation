  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: sw
  text: Kwa maana mmeokolewa kwa neema, kwa njia ya imani,[a] na jambo hili halitokani na ninyi wenyewe;[b] ni zawadi ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Imani” hapa pia inaweza kueleweka kuwa “kumtumaini”; katika miktadha mingine neno la Kigiriki linaweza kumaanisha “uaminifu.”
    reason: lexical_alternative
  - marker: b
    text: Au kwa maana pana zaidi, “jambo hili lote la kuokolewa kwa neema kwa njia ya imani halitokani na ninyi wenyewe.” Kiwakilishi cha Kigiriki kinachotafsiriwa “jambo hili” yaelekea kinarejelea kishazi chote kilichotangulia badala ya “imani” peke yake.
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: neema
  rationale: “Neema” ni istilahi ya kawaida na yenye heshima katika Kiswahili kwa fadhili za Mungu zisizostahiliwa, na inahifadhi uzito wa matumizi ya Paulo.
- source_word: ἐστε σεσῳσμένοι
  choice: mmeokolewa
  rationale: Muundo huu unaonyesha tendo lililokamilika lenye matokeo yanayoendelea; “mmeokolewa” huwasilisha wokovu uliotendwa ambao hali yake inaendelea.
- source_word: διὰ πίστεως
  choice: kwa njia ya imani
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au chombo. “Imani” ni tafsiri ya kawaida hapa, ingawa neno hilo linaweza pia kueleweka kwa maana ya kumtumaini.
- source_word: τοῦτο
  choice: jambo hili
  rationale: Kiwakilishi cha Kigiriki kiko katika jinsia isiyo na upande na yaelekea kinarejelea wazo lote lililotangulia—kuokolewa kwa neema kwa njia ya imani—badala ya “neema” au “imani” peke yake.
- source_word: οὐκ ἐξ ὑμῶν
  choice: halitokani nanyi wenyewe
  rationale: ἐκ huonyesha chanzo. Kauli hii ya asili katika Kiswahili inakanusha kwamba jambo hilo la wokovu lina chanzo chake kwa wasomaji wenyewe.
- source_word: θεοῦ τὸ δῶρον
  choice: ni zawadi ya Mungu
  rationale: Kirai hiki kinatambulisha jambo lililotangulia kuwa zawadi inayotoka kwa Mungu; kitenzi “ni” kinaongezwa kwa ufasaha wa Kiswahili.
theological_decisions:
- issue: Kirejelewa cha τοῦτο (“jambo hili”) kuhusiana na neema, imani, na wokovu
  choice: “Jambo hili” linaeleweka hasa kuwa jambo lote lililotangulia la kuokolewa kwa neema kwa njia ya imani, si imani peke yake.
  alternative: “Jambo hili” linaweza kuchukuliwa kuwa imani hasa, au neema hasa.
  rationale: Kwa kuwa τοῦτο ni cha jinsia isiyo na upande, hakipatani moja kwa moja na nomino za kike χάρις (“neema”) na πίστις (“imani”). Hilo linaunga mkono kurejelea kishazi au wazo lote, huku tanbihi ikihifadhi uwezekano wa mjadala bila kuingiza msimamo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mmeokolewa” huhifadhi matokeo yanayoendelea ya hali timilifu; “jambo hili” hufanya kirejelewa cha τοῦτο kiwe wazi bila kukifungamanisha na “imani” pekee. Alama za tanbihi zimewekwa katika matini kuu.
