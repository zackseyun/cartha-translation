  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: sw
  text: na awapatanishe wote wawili na Mungu katika mwili mmoja kwa njia ya msalaba, akiua uadui ndani ya mwili huo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: awapatanishe
  rationale: Kitenzi hiki kinaeleza kuwarudisha waliokuwa na uadui katika uhusiano wa amani; hali ya kutegemea imehifadhiwa kwa ‘a-...-she’ katika mwendelezo wa kusudi la sentensi.
- source_word: τοὺς ἀμφοτέρους
  choice: wote wawili
  rationale: Hurejelea makundi mawili yaliyotajwa katika muktadha, Wayahudi na watu wa mataifa, bila kuyaongeza majina hayo ndani ya aya.
- source_word: ἐν ἑνὶ σώματι
  choice: katika mwili mmoja
  rationale: Hudumisha taswira ya ‘mwili mmoja’ na uwezekano wake wa kumaanisha umoja wa pamoja, badala ya kuifafanua kwa neno la kimadhehebu.
- source_word: διὰ τοῦ σταυροῦ
  choice: kwa njia ya msalaba
  rationale: Huonyesha msalaba kuwa njia ambayo upatanisho unatimizwa.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: akiisha kuua uadui
  rationale: Hudumisha sitiari kali ya Kigiriki kwamba uadui uliuawa, na inaonyesha tendo hilo likitangulia au kuambatana kwa karibu na upatanisho.
- source_word: ἐν αὐτῷ
  choice: kwa huo
  rationale: Kiwakilishi cha ngeli ya ‘msalaba’ kinawasilisha usomaji unaoelekea kumrejelea msalaba, huku tanbihi ikihifadhi uwezekano wa kukihusisha na ‘mwili mmoja’.
theological_decisions:
- issue: Maana ya ‘mwili mmoja’
  choice: Kuhifadhi maneno ‘mwili mmoja’ bila kuyafafanua zaidi
  alternative: Kulifafanua kuwa mwili mmoja wa Kristo au kanisa
  rationale: Kigiriki chenyewe kinaacha taswira hiyo ibebe maana yake katika muktadha; ufafanuzi zaidi ungeweza kuingiza hitimisho la kitheolojia ndani ya matini.
- issue: Kirejelewa cha ἐν αὐτῷ
  choice: 'Katika matini, kukihusisha hasa na msalaba: ‘kwa huo’'
  alternative: ‘ndani yake,’ kikihusishwa na mwili mmoja
  rationale: ‘Msalaba’ ndilo nomino la karibu zaidi na usomaji wa chombo unaendana na muktadha, lakini kwa kuwa ‘mwili’ na ‘msalaba’ zote ni nomino za jinsia ya kati katika Kigiriki, uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa heshima na unaoeleweka. Aya imeachwa kama sehemu ya sentensi ndefu ya muktadha kwa kuanza na ‘na’; sitiari ‘kuua uadui’ imehifadhiwa badala ya kulainishwa.
