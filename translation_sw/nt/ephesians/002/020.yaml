lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: mmejengwa
  rationale: Huhifadhi hali ya kutendwa na wazo la waamini kuwa tayari wameingizwa katika jengo la Mungu; umbo hili pia linaunganika kwa kawaida na sentensi inayotangulia.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: juu ya msingi
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kitu kilichojengwa juu ya msingi na huhifadhi taswira ya ujenzi.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: wa mitume na manabii
  rationale: Huhifadhi uhusiano mpana wa umilikishi wa Kigiriki bila kuamua ikiwa msingi uliwekwa nao, unahusiana na ushuhuda wao, au unawajumuisha wao wenyewe.
- source_word: ὄντος
  choice: huku ... akiwa
  rationale: Huwasilisha kishiriki cha Kigiriki kwa Kiswahili cha kawaida huku kikidumisha uhusiano wake na taswira ya jengo.
- source_word: ἀκρογωνιαίου
  choice: jiwe la pembeni
  rationale: Ni neno wazi na la kawaida kwa jiwe la pembe katika taswira ya ujenzi; haliongezi msisitizo wa 'kuu' ambao haujasemwa moja kwa moja.
- source_word: αὐτοῦ
  choice: mwenyewe
  rationale: Huhifadhi msisitizo kwamba Masihi Yesu mwenyewe ndiye jiwe la pembeni.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa inaeleweka kama cheo; 'Masihi' huhifadhi maana yake badala ya kuitumia tu kama jina lililozoeleka.
theological_decisions:
- issue: Maana ya “msingi wa mitume na manabii”
  choice: 'Uhusiano umeachwa mpana: “msingi wa mitume na manabii.”'
  alternative: “msingi uliowekwa na mitume na manabii” au “msingi unaojumuisha mitume na manabii”
  rationale: Hali ya umilikishi katika Kigiriki haibainishi kwa usahihi aina ya uhusiano; tafsiri haipaswi kuondoa utata huo wa kweli.
- issue: Utoaji wa Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika muktadha huu Χριστός bado ina nguvu ya cheo, hivyo 'Masihi' huonyesha maana hiyo; umbo la kimapokeo limetajwa katika tanbihi.
