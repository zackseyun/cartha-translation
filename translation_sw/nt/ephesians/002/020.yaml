  text: mmejengwa juu ya msingi wa mitume na manabii,[a] huku Masihi Yesu[b] mwenyewe akiwa jiwe la kona,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “msingi wa mitume na manabii” yanaweza kumaanisha msingi unaohusiana na ushuhuda wao, msingi waliouweka, au msingi unaowajumuisha wao; Kigiriki hakibainishi zaidi.
    reason: lexical_alternative
  - marker: b
