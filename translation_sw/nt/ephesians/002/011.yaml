lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa lugha ya kawaida na yenye heshima.
- source_word: μνημονεύετε
  choice: kumbukeni
  rationale: Ni amri ya wingi, na ‘kumbukeni’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ποτὲ ὑμεῖς
  choice: hapo zamani ninyi
  rationale: Inahifadhi tofauti ya wakati na mkazo uliowekwa kwa ‘ninyi’.
- source_word: τὰ ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu inamaanisha watu wasio Wayahudi, si mataifa kama nchi za kisiasa.
- source_word: ἐν σαρκί
  choice: kwa mwili
  rationale: Inadumisha neno la chanzo na kuonyesha hali ya kimwili na ya kikabila, si asili ya dhambi.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: mlioitwa “wasiotahiriwa”
  rationale: Inahifadhi kitendo cha kupewa jina na kundi jingine, huku ikitoa maana ya kijamii kwa Kiswahili cha kawaida.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: na wale wanaoitwa “wenye tohara”
  rationale: Inahifadhi ulinganifu wa kauli ‘wanaoitwa’ na umbali wa kimatamshi wa Paulo bila kufanya sentensi kuwa ngumu isivyo lazima.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: tohara ya mwilini inayofanywa kwa mikono
  rationale: Inaonyesha wazi kuwa tohara inayozungumziwa ni tendo la nje linalofanywa na wanadamu katika mwili.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha usio wa kimaadili
  choice: kwa mwili
  alternative: kwa hali ya kimwili
  rationale: Hapa Paulo anazungumzia hali ya kimwili na utambulisho wa kikabila/kimaagano, wala si tabia ya dhambi.
- issue: Majina ἀκροβυστία na περιτομή kama vitambulisho vya makundi
  choice: “wasiotahiriwa” na “wenye tohara”
  alternative: “Kutotahiriwa” na “Tohara”
  rationale: Majina ya watu yanaeleweka kwa urahisi katika Kiswahili, huku alama za kunukuu na tanbihi zikihifadhi kwamba haya ni majina ya kikundi yenye maana ya agano na kabila.
- issue: Nguvu ya λεγομένης kuhusu περιτομή
  choice: wale wanaoitwa “wenye tohara”
  alternative: kile kinachoitwa “tohara”
  rationale: Utoaji huu unadumisha kurudiwa kwa wazo la ‘kuitwa’ na tahadhari ya Paulo kuhusu jina hilo bila kuongeza kejeli au msimamo dhidi ya Wayahudi.
