  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: sw
  text: Kwa hiyo, kumbukeni kwamba hapo zamani ninyi[a], watu wa mataifa kwa mwili[b], ambao mnaitwa “Wasiotahiriwa” na kile kinachoitwa “Tohara”[c], tohara ya mwilini iliyofanywa kwa mikono[d]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninyi hapo zamani, mataifa kwa mwili.” Kigiriki kinakazia “ninyi”; hapa “mataifa” humaanisha watu wasio Wayahudi.
    reason: lexical_alternative
  - marker: b
    text: “Kwa mwili” hapa hurejelea hali ya kimwili na utambulisho wa kikabila, si asili ya dhambi.
    reason: clarification
  - marker: c
    text: '“Wasiotahiriwa” na “Tohara” hapa ni majina ya kikabila na ya agano, si maelezo ya hali ya mwili tu. Kwa karibu zaidi na muundo wa Kigiriki: “ambao mnaitwa ‘Kutotahiriwa’ na kile kinachoitwa ‘Tohara.’”'
    reason: cultural_note
  - marker: d
    text: 'Kwa karibu zaidi na mpangilio wa Kigiriki: “kile kinachoitwa ‘Tohara,’ iliyofanywa kwa mikono katika mwili.” Maneno ya Paulo yanaweza kudokeza uhakiki wa tohara ya nje tu.'
