id: EPH.2.12
reference: Ephesians 2:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: sw
  text: kwamba wakati ule mlikuwa bila Masihi[a], mmetengwa na jumuiya ya Israeli, na mlikuwa wageni kwa maagano ya ahadi[b]. Mlikuwa hamna tumaini na bila Mungu[c] ulimwenguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός ni cheo kinachoweza kutafsiriwa kwa namna zote mbili; hapa “Masihi” hudumisha maana yake katika muktadha wa Kiyahudi na wa maagano.
    reason: alternative_reading
  - marker: b
    text: Au “maagano yanayohusiana na ahadi.”
    reason: lexical_alternative
  - marker: c
    text: Au “wasiomcha Mungu.” Kirai hiki kinaweza kumaanisha kuwa bila Mungu wa kweli, na si lazima kimaanishe kukana kwamba Mungu yupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: bila Masihi
  rationale: Katika muktadha wa Israeli na maagano, Χριστός linatumika kama cheo cha Mtiwa-Mafuta aliyeahidiwa; “Masihi” hudumisha maana hiyo, huku “Kristo” ikitajwa katika tanbihi.
- source_word: ἀπηλλοτριωμένοι
  choice: mmetengwa
  rationale: Kitenzi hiki kinaonyesha hali endelevu ya kuwa mbali au kutoshirikishwa; “mmetengwa” ni ya kawaida na inafaa kwa maana ya kijamii na kiraia ya kirai kinachofuata.
- source_word: πολιτείας τοῦ Ἰσραὴλ
  choice: jumuiya ya Israeli
  rationale: πολιτεία hapa linaelekea kumaanisha jamii au mfumo wa kiraia wa Israeli kwa ujumla, si hadhi ya kisheria ya mtu mmoja tu.
- source_word: ξένοι
  choice: wageni
  rationale: Neno hili linaonyesha watu walio nje ya uhusiano na eneo la kijamii na kiagano linalotajwa.
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: maagano yanayohusiana na ahadi ile
  rationale: “Maagano” huhifadhi wingi wa διαθηκῶν, na “ahadi ile” huhifadhi umoja na uainishaji wa τῆς ἐπαγγελίας bila kuyageuza maagano kuwa ahadi nyingi.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: mlikuwa hamna tumaini
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha hali yao ya zamani na kudumisha maana ya kutokuwa na tumaini.
- source_word: ἄθεοι
  choice: bila Mungu
  rationale: Katika muktadha huu, kirai kinaonyesha kutokuwa na uhusiano na Mungu wa kweli, si lazima kukana kifalsafa kwamba Mungu yupo.
- source_word: ἐν τῷ κόσμῳ
  choice: ulimwenguni
  rationale: Ni tafsiri fupi, ya asili, na inayolingana moja kwa moja na eneo la maisha ya wanadamu linalokusudiwa.
theological_decisions:
- issue: Tafsiri ya Χριστός katika muktadha wa Kiyahudi na wa maagano
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi cheo cha Mtiwa-Mafuta wa Israeli ambacho ni muhimu katika muktadha huu; tanbihi huhifadhi tafsiri ya kawaida “Kristo.”
- issue: Maana ya ἄθεοι
  choice: bila Mungu
  alternative: wasiomcha Mungu
  rationale: “Bila Mungu” hudumisha hali ya kunyimwa uhusiano na Mungu bila kuingiza dhana ya kisasa ya ukanaji wa kuwepo kwa Mungu; mbadala huonyesha uwezekano wa maana ya ‘godless’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inabaki kuwa kishazi kinachotegemea agizo la mstari uliotangulia la kukumbuka. “Jumuiya” huepuka kuifanya πολιτεία kuwa uraia binafsi pekee, na marudio ya “mlikuwa” yanaweka hali ya zamani wazi kwa msomaji wa kawaida.
