translation:
  language: sw
  text: Katika yeye jengo lote[a], likiunganishwa pamoja, linakua na kuwa hekalu takatifu katika Bwana,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila jengo.” Kirai cha Kigiriki kinaweza kueleweka kuwa kinarejelea kila jengo kivyake au jengo lote kwa pamoja; maandishi makuu yanafuata taswira ya hekalu moja katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ndani yake
  rationale: Kiwakilishi hiki kinamrejelea kwa kawaida Kristo katika mstari uliotangulia. “Ndani yake” ni usemi wa asili wa Kiswahili unaohifadhi wazo pana la uhusiano au muungano na Kristo.
- source_word: πᾶσα οἰκοδομὴ
  choice: jengo lote
  rationale: Kisintaksia kirai hiki kinaweza kumaanisha “jengo lote” au “kila jengo.” Muktadha wa Wayahudi na watu wa mataifa kuunganishwa kuwa hekalu moja unaunga mkono maana ya pamoja; maana nyingine imehifadhiwa katika tanbihi.
- source_word: συναρμολογουμένη
  choice: likiunganishwa pamoja kwa kufaa
  rationale: Kauli tendwa ya wakati unaoendelea inaonyesha sehemu zinazoendelea kuunganishwa kwa mpangilio unaofaa. Tafsiri hii inadumisha taswira ya ujenzi.
- source_word: αὔξει
  choice: linakua
  rationale: Kitenzi cha wakati uliopo kinaonyesha ukuaji unaoendelea. “Linakua” huhifadhi kwa kawaida mwingiliano wa taswira ya jengo na ukuaji wa kitu hai.
- source_word: εἰς
  choice: na kuwa
  rationale: 'Katika muktadha huu εἰς huonyesha matokeo au lengo: jengo linakua hata linakuwa hekalu. “Na kuwa” ni ya asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ya mwendo.'
- source_word: ναὸν ἅγιον
  choice: hekalu takatifu
  rationale: ναός huelekeza hasa mahali patakatifu pa hekalu. “Hekalu takatifu” ni wazi, yenye hadhi, na inahifadhi maana ya msingi ya kirai.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: “Katika Bwana” huhifadhi lugha pana ya Paulo kuhusu nyanja au muungano bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Je, ᾧ linamrejelea Kristo binafsi au taswira ya jengo kwa namna isiyo ya kibinafsi?
  choice: 'Rejeleo la kibinafsi kwa Kristo: “ndani yake”'
  alternative: 'Rejeleo kwa jengo au jiwe la pembeni: “ndani yake humo” au “katika hilo”'
  rationale: Mtangulizi wa karibu katika mstari wa 20 ni Kristo Yesu mwenyewe akiwa jiwe kuu la pembeni, na urudiaji wa lugha ya “ndani yake” katika kifungu hiki unaunga mkono rejeleo la Kikristo bila kuondoa taswira ya ujenzi.
- issue: Je, πᾶσα οἰκοδομὴ lina maana ya pamoja au ya kugawa?
  choice: 'Maana ya pamoja: “jengo lote”'
  alternative: 'Maana ya kugawa: “kila jengo”'
  rationale: Muktadha unasisitiza watu waliokuwa makundi mawili kuunganishwa kuwa jamii moja na hekalu moja. Hata hivyo, muundo wa Kigiriki unaruhusu maana ya “kila jengo,” hivyo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “likiunganishwa pamoja kwa kufaa” unadumisha sitiari ya usanifu, na “linakua na kuwa” unaeleza lengo au matokeo kwa lugha ya kawaida bila kupoteza mvutano wa taswira ya jengo linalokua.
