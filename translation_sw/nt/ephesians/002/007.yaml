  - marker: b
    text: 'Kigiriki: “katika Kristo Yesu”; hapa Χριστός limetafsiriwa “Masihi” kwa kuwa linatumika kama cheo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayotokana na muktadha uliotangulia, kwa Kiswahili cha kawaida na kifupi.
- source_word: ἐνδείξηται
  choice: aonyeshe
  rationale: Huhifadhi maana ya kufanya jambo lionekane au lijulikane wazi bila kutumia istilahi nzito.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: katika nyakati zinazokuja
  rationale: Huhifadhi wingi wa αἰῶσιν na mwelekeo wa wakati ujao; ni usemi wa asili katika Kiswahili.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: utajiri usio na kifani
  rationale: Huwasilisha wazo la utajiri unaopita kiwango cha kawaida. Ingawa nomino ya Kigiriki πλοῦτος ni ya umoja, ina maana ya wingi mkubwa.
- source_word: τῆς χάριτος αὐτοῦ
  choice: wa neema yake
  rationale: “Neema” ni tafsiri iliyozoeleka na pana ya χάρις katika muktadha wa Paulo.
- source_word: ἐν χρηστότητι ἐφ’ ἡμᾶς
  choice: kwa wema aliotutendea
  rationale: Hutoa kwa Kiswahili cha asili wema au fadhili ya Mungu iliyoelekezwa kwetu, huku ἐν ikieleweka kama namna ambayo neema hiyo inaonyeshwa.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Masihi” hutafsiri Χριστός kama cheo, na “katika” huhifadhi lugha ya Paulo ya kuwa ndani ya au kuunganishwa na Masihi.
theological_decisions:
- issue: Ikiwa Χριστῷ itafsiriwe kama cheo au itumike katika umbo lililozoeleka la “Kristo”
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός ina nguvu ya cheo kinachomaanisha Masihi; “Masihi Yesu” huonyesha maana hiyo wazi badala ya kuifanya ionekane kama jina la pili.
- issue: Uhusiano wa ἐν χρηστότητι na ἐφ’ ἡμᾶς
  choice: kwa wema aliotutendea
  alternative: katika wema kwetu
  rationale: Tafsiri iliyochaguliwa ni ya asili zaidi katika Kiswahili na huonyesha wema wa Mungu unaotuelekea, bila kuamua kupita kiasi ikiwa ἐν ni nyenzo, namna, au mazingira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa urahisi wa kusomeka kwa sauti huku ikihifadhi wingi wa “nyakati,” uzito wa “neema,” na usemi wa Paulo “katika Masihi Yesu.”
