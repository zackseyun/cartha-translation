id: EPH.2.3
reference: Ephesians 2:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: sw
  text: Miongoni mwao[a] sisi sote pia tuliishi zamani katika tamaa za mwili wetu[b], tukiyatenda matakwa ya mwili na ya mawazo[c]. Nasi kwa asili tulikuwa watoto wa ghadhabu[d], kama walivyokuwa wengine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hayo.” Kigiriki kinaweza kurejelea watu wenye sifa ya kutotii au mazingira ya maisha ya kutotii.
    reason: alternative_reading
  - marker: b
    text: “Mwili” hapa unaweza kueleweka kuwa hali ya kibinadamu yenye mwelekeo wa dhambi; tafsiri “asili ya dhambi” ingeweka wazi ufafanuzi huo kuliko neno la Kigiriki lenyewe.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki: “tukifanya matakwa ya mwili na ya mawazo.”'
    reason: literal_rendering
  - marker: d
    text: Au, “walengwa wa ghadhabu.” “Watoto wa ghadhabu” ni nahau iliyotafsiriwa kwa kufuata muundo wa Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: miongoni mwao
  rationale: Kiwakilishi cha wingi kinaeleweka kwa kawaida kuwa kinawarejelea watu waliotajwa katika mstari uliotangulia. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi uwezekano wa kurejelea hali au eneo la maisha ya kutotii.
- source_word: ἀνεστράφημέν
  choice: tuliishi
  rationale: Kitenzi hiki hapa kina maana ya kujiendesha au kuishi kwa namna fulani. “Tuliishi” ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: ποτε
  choice: zamani
  rationale: Neno hili linaonyesha hali ya wakati uliopita; “zamani” linasomeka kwa kawaida zaidi kuliko tafsiri ya neno kwa neno.
- source_word: ἐπιθυμίαις
  choice: tamaa
  rationale: “Tamaa” inajumuisha hamu potovu kwa upana bila kuifupisha maana kuwa tamaa ya ngono pekee.
- source_word: σάρξ
  choice: mwili
  rationale: “Mwili” huhifadhi istilahi ya Paulo na uzito wake wa kimaadili bila kuifasiri moja kwa moja kuwa “asili ya dhambi.”
- source_word: ποιοῦντες
  choice: tukiyatenda
  rationale: Hii inaonyesha utekelezaji wa kudumu wa matakwa hayo na kufuata kwa karibu maana ya kitenzi cha Kigiriki.
- source_word: θελήματα
  choice: matakwa
  rationale: “Matakwa” yanaonyesha nia au mambo yanayotakiwa, na yanatunza tofauti na “tamaa” iliyotumika kwa ἐπιθυμίαις.
- source_word: διανοιῶν
  choice: mawazo
  rationale: Wingi huu unaweza kumaanisha mawazo, mielekeo ya akili, au fikira. “Mawazo” ni fupi, wazi, na haibani maana kupita kiasi.
- source_word: τέκνα ὀργῆς
  choice: watoto wa ghadhabu
  rationale: Tafsiri hii inahifadhi nahau ya Kigiriki na mvutano wake wa kiteolojia badala ya kuamua wazi kama maana kuu ni kuwa walengwa wa ghadhabu au wenye hali inayohusishwa nayo.
- source_word: φύσει
  choice: kwa asili
  rationale: Hii ni tafsiri ya moja kwa moja inayohifadhi mjadala kuhusu hali ya kiasili bila kuibana iwe “kwa kuzaliwa” pekee.
- source_word: οἱ λοιποί
  choice: wengine
  rationale: “Wengine” ni Kiswahili cha kawaida na kinaonyesha wanadamu wengine waliokuwa katika hali hiyo.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha wa kimaadili
  choice: mwili
  alternative: asili ya dhambi
  rationale: “Mwili” huhifadhi lugha ya Paulo na hairuhusu tafsiri kuchagua mapema mfumo mmoja maalumu wa anthropolojia au fundisho la dhambi.
- issue: Nguvu ya usemi τέκνα φύσει ὀργῆς
  choice: kwa asili tulikuwa watoto wa ghadhabu
  alternative: kwa kuzaliwa tulikuwa walengwa wa ghadhabu
  rationale: Usemi wa Kigiriki umehifadhiwa ili kutosuluhisha kimya kimya ikiwa mkazo uko kwenye hali, tabia, au kuwajibika chini ya hukumu.
- issue: Kirejeleo cha ἐν οἷς
  choice: miongoni mwao
  alternative: katika hayo
  rationale: Katika muktadha, kirejeleo cha watu—“wana wa kutotii”—kina uwezekano mkubwa, lakini tanbihi inahifadhi uwezekano wa kuelewa hali au mwenendo uliotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza uhusiano wa hoja. Istilahi “mwili,” “kwa asili,” na “watoto wa ghadhabu” zimehifadhiwa kwa makusudi ili kutobana utata na mvutano wa kiteolojia wa maandishi.
