  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: sw
  text: Kwa maana yeye mwenyewe ndiye amani yetu, ambaye alifanya pande zote mbili kuwa moja na akabomoa ukuta wa kati uliokuwa kizuizi—yaani, uadui—katika mwili wake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pande zote mbili” ni Wayahudi na watu wa mataifa katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “katika mwili wake.” Maneno haya yanaweza kupangwa karibu na tendo la kubomoa: “... akabomoa, katika mwili wake, ukuta ...”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: 'Inahifadhi msisitizo wa kiwakilishi: Kristo mwenyewe ndiye amani yetu.'
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa msingi wa yaliyotangulia.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: amani yetu
  rationale: Ni tafsiri ya kawaida na hapa inamaanisha amani ya upatanisho ambayo Kristo anaileta na kuiwakilisha.
- source_word: τὰ ἀμφότερα
  choice: hao wawili
  rationale: Inabaki karibu na maana ya ‘wote wawili’ huku muktadha ukiwaonyesha kuwa ni Wayahudi na watu wa mataifa.
- source_word: ἓν
  choice: kitu kimoja
  rationale: Inawasilisha matokeo ya kuwaunganisha bila kufafanua zaidi asili ya umoja huo.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: ukuta wa kati uliokuwa kizuizi
  rationale: Inahifadhi picha ya ukuta unaotenganisha na kazi yake ya kuwa kizuizi kwa Kiswahili cha kawaida.
- source_word: λύσας
  choice: kuubomoa
  rationale: Kitenzi hiki ni cha asili kwa kuondoa ukuta na kinafikisha maana ya kuuvunja au kuufutilia mbali.
- source_word: τὴν ἔχθραν
  choice: uadui
  rationale: Neno hili linaeleweka kwa urahisi na linahifadhi maana ya hali ya kupingana kati ya pande hizo.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: katika mwili wake wa nyama
  rationale: ‘Mwili wa nyama’ huhifadhi uzito halisi wa σάρξ na kuelekeza kwa uwepo na kifo chake cha kimwili, bila kudokeza ‘asili ya dhambi.’
theological_decisions:
- issue: Rejeo la τὰ ἀμφότερα
  choice: hao wawili
  alternative: makundi yote mawili; wote wawili
  rationale: Muktadha unaelekeza kwa Wayahudi na watu wa mataifa, lakini tafsiri haiongezi nomino ‘makundi’ ambayo haipo wazi katika Kigiriki.
- issue: Uhusiano wa ‘uadui’ na ‘kizuizi’
  choice: kistari na ‘yaani’ vinaonyesha kuwa uadui unaeleza kizuizi
  alternative: kuunganisha ‘uadui’ moja kwa moja na kishazi kinachofuata
  rationale: Muundo huu unawakilisha uwezekano mkubwa wa apposition katika mstari huu bila kuingiza maneno ya mstari wa 15.
- issue: Uhusiano wa ἐν τῇ σαρκὶ αὐτοῦ
  choice: imewekwa karibu na tendo la kubomoa
  alternative: ‘uadui katika mwili wake wa nyama’
  rationale: Mpangilio huu huepuka dhana potovu kwamba uadui ulikuwa ndani ya mwili wa Kristo, huku tanbihi ikihifadhi utata wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unahifadhi mtiririko unaoendelea hadi mstari unaofuata, na ‘mwili wake wa nyama’ umetumiwa kwa usahihi wa σάρξ licha ya kuwa mzito kidogo kuliko ‘mwili wake.’
