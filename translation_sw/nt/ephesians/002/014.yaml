revisions:
- from: Kwa maana yeye mwenyewe ndiye amani yetu; aliyewafanya hao wawili kuwa kitu kimoja, na kuubomoa katika mwili wake wa nyama ukuta wa kati uliokuwa kizuizi—yaani, uadui.[a][b]
