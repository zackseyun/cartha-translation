translation:
  language: sw
  text: Ndani yake ninyi pia mnajengwa pamoja kuwa mahali ambapo Mungu anakaa katika Roho[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani yalo,” ikiwa kiwakilishi hiki kinaeleweka kuwa kinalirejelea jengo lote badala ya kumrejelea Kristo moja kwa moja.
    reason: alternative_reading
  - marker: b
    text: Au “katika roho” au “kwa njia ya Roho.” Kirai hiki kinaweza kuonyesha mazingira ambamo Mungu anakaa au utendaji wa Roho Mtakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Ndani yake
  rationale: Kiwakilishi hiki kinaelekea zaidi kumrejelea Kristo katika muktadha wa mistari 20–21. “Ndani yake” ni Kiswahili cha kawaida kinachodumisha wazo la muungano na Kristo bila kulipanua.
- source_word: καὶ
  choice: pia
  rationale: Neno hili linaonyesha kwamba waamini wanaosemewa wanaongezwa katika taswira ya jengo linalowahusisha watu wote wa Mungu.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi kwa msisitizo; “ninyi” huhifadhi msisitizo huo.
- source_word: συνοικοδομεῖσθε
  choice: mnajengwa pamoja
  rationale: Kitenzi ni cha wakati wa sasa na hali ya kutendwa, hivyo kinaonyesha tendo linaloendelea. “Pamoja” huhifadhi maana ya kiambishi σύν.
- source_word: εἰς
  choice: kuwa
  rationale: Hapa εἰς huonyesha lengo au matokeo. Katika Kiswahili, “kuwa” huwasilisha matokeo hayo kwa njia ya kawaida kuliko tafsiri ya moja kwa moja ya mwendo.
- source_word: κατοικητήριον
  choice: mahali ambapo ... anakaa
  rationale: Nomino hii humaanisha mahali pa kukaa. Muundo huu ni wa kawaida na wazi katika Kiswahili cha sasa, huku ukihifadhi taswira ya jengo.
- source_word: τοῦ θεοῦ
  choice: Mungu anakaa
  rationale: Uhusiano wa umilikaji katika Kigiriki unaonyesha kwamba Mungu ndiye mkazi wa mahali hapo; muundo wa Kiswahili unaeleza jambo hilo wazi bila kuongeza maana nyingine.
- source_word: ἐν πνεύματι
  choice: katika Roho
  rationale: Muktadha wa hekalu na makao ya Mungu unaelekeza zaidi kwa Roho Mtakatifu. “Katika” hudumisha uwezekano wa maana ya mazingira au utendaji bila kuifanya kuwa ya chombo pekee.
theological_decisions:
- issue: Kirejelewa cha ἐν ᾧ
  choice: 'Kumrejelea Kristo: “Ndani yake.”'
  alternative: 'Kurejelea jengo lote: “Ndani yake,” likieleweka kama jengo hilo.'
  rationale: Mtiririko wa mistari 20–21 unamweka Kristo katikati ya umoja na ukuaji wa jengo. Hata hivyo, umbo la Kigiriki linaweza pia kuelekezwa kwa jengo, hivyo uwezekano huo umewekwa katika tanbihi.
- issue: Maana ya ἐν πνεύματι
  choice: 'Kumrejelea Roho Mtakatifu: “katika Roho.”'
  alternative: “katika roho” au “kwa njia ya Roho.”
  rationale: Matumizi ya Paulo pamoja na muktadha wa hekalu na kukaa kwa Mungu yanaunga mkono zaidi rejeo kwa Roho Mtakatifu. Kihusishi “katika” kimehifadhiwa ili kutofunga kabisa maana katika mazingira au utendaji pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “mahali ambapo Mungu anakaa” umechaguliwa badala ya “makao ya Mungu” ili kusisitiza Mungu kama mkazi na kuepuka uwezekano wa kuelewa genitivi kama umilikaji pekee. Alama zote za tanbihi zimewekwa katika matini kuu.
