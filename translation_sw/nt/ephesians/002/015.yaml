id: EPH.2.15
reference: Ephesians 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: sw
  text: akiisha kuibatilisha sheria ya amri zilizoelezwa katika maagizo[a], ili ndani yake awaumbe hao wawili kuwa mtu mmoja mpya[b][c], akifanya amani,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika maagizo,” “inayojumuisha maagizo,” au kwa tafsiri ya jadi, “katika kanuni.”
    reason: lexical_alternative
  - marker: b
    text: “Mtu mmoja mpya” ni taswira ya umoja inayowakilisha jamii nzima; pia yaweza kutafsiriwa “ubinadamu mmoja mpya.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ili awaumbe hao wawili kuwa mtu mmoja mpya ndani yake.”
    reason: previous_rendering
lexical_decisions:
- source_word: νόμον
  choice: sheria
  rationale: ‘Sheria’ ndiyo istilahi ya kawaida na yenye uzito wa kimaagano; hapa imefafanuliwa na kirai kinachofuata badala ya kutumiwa kama kanuni ya jumla.
- source_word: ἐντολῶν
  choice: amri
  rationale: ‘Amri’ huhifadhi maana rasmi ya maagizo yenye mamlaka na inafaa katika muundo ‘sheria ya amri’.
- source_word: ἐν δόγμασιν
  choice: zilizoelezwa katika maagizo
  rationale: δόγμα inaweza kumaanisha agizo, amri rasmi, au kanuni. ‘Zilizoelezwa katika maagizo’ huonyesha uhusiano wake na ‘amri’ kwa Kiswahili kinachoeleweka bila kuifunga maana kwenye taratibu za ibada pekee.
- source_word: καταργήσας
  choice: akiisha kuibatilisha
  rationale: 'Huhifadhi tendo lililotangulia la kishirikishi cha wakati uliopita na nguvu ya καταργέω katika muktadha huu: kuondoa nguvu au uhalali wa kitu kilichotajwa.'
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi la tendo lililotangulia kwa njia ya kawaida na ya moja kwa moja.
- source_word: τοὺς δύο
  choice: hao wawili
  rationale: Huhifadhi namba iliyo wazi na kurejelea makundi mawili yaliyotajwa katika muktadha, Wayahudi na watu wa mataifa.
- source_word: κτίσῃ
  choice: awaumbe
  rationale: ‘Kuumba’ huhifadhi wazo lenye nguvu la uumbaji mpya kuliko ‘kufanya’ au ‘kuunda’.
- source_word: ἐν αὑτῷ
  choice: ndani yake
  rationale: Huhifadhi wazo kwamba kuunganishwa na kuumbwa upya kunatokea ndani ya Kristo mwenyewe; muktadha unaweka wazi mrejelewa wa kiwakilishi.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: kuwa mtu mmoja mpya
  rationale: Huhifadhi taswira ya umoja ya nomino ya umoja ἄνθρωπος. ‘Ubinadamu mmoja mpya’ inawezekana, lakini inaeleza moja kwa moja zaidi maana ya pamoja ambayo maandishi yenyewe yanaiacha katika taswira.
- source_word: ποιῶν εἰρήνην
  choice: akifanya amani
  rationale: Ni ulinganifu wa karibu wa kishirikishi cha wakati wa sasa pamoja na nomino, na huhifadhi uhusiano wake na tendo la kuwaumba kuwa mmoja.
theological_decisions:
- issue: Maana ya pamoja ya ἕνα καινὸν ἄνθρωπον
  choice: mtu mmoja mpya
  alternative: ubinadamu mmoja mpya
  rationale: Muktadha unahusu Wayahudi na watu wa mataifa kwa pamoja, lakini ‘mtu mmoja mpya’ huhifadhi taswira ya umoja ya Paulo na mvutano wake wa kiteolojia bila kuibadilisha moja kwa moja kuwa dhana ya ‘ubinadamu’.
- issue: Nguvu ya καταργήσας kuhusiana na sheria
  choice: akiisha kuibatilisha
  alternative: akiisha kuiondolea nguvu
  rationale: ‘Kuibatilisha’ huwasilisha nguvu ya kitenzi katika muktadha, huku yambwa likibaki limeainishwa kuwa ‘sheria ya amri zilizoelezwa katika maagizo.’ Hivyo tafsiri haiongezi dai pana kuhusu kila namna ya mapenzi ya Mungu.
- issue: Mahali pa ἐν αὑτῷ katika sentensi
  choice: ili ndani yake awaumbe hao wawili kuwa mtu mmoja mpya
  alternative: ili awaumbe hao wawili kuwa mtu mmoja mpya ndani yake
  rationale: Kuweka ‘ndani yake’ mapema kunafuata mpangilio wa Kigiriki na kuepusha uwezekano wa kusoma ‘ndani yake’ kana kwamba inamfafanua tu ‘mtu mpya,’ ingawa mpangilio mwingine pia unawezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa kishirikishi umehifadhiwa kwa sababu kifungu hiki kinaendelea kisarufi kutoka muktadha uliotangulia. ‘Hao wawili’ ni wa kawaida na wazi zaidi kuliko ‘wale wawili’ kwa mrejeleo wa karibu.
