  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: sw
  text: Nanyi mlikuwa wafu kwa sababu ya makosa na dhambi zenu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεκρούς
  choice: wafu
  rationale: Huhifadhi sitiari yenye nguvu ya Kigiriki kuhusu hali yao ya kiroho bila kuifafanua kupita kiasi.
- source_word: παραπτώμασιν
  choice: makosa
  rationale: Neno hili huonyesha mikengeuko au matendo ya kuvunja yaliyo sawa; ‘makosa’ ni la kawaida na hutofautishwa kiasi na ‘dhambi’.
- source_word: ἁμαρτίαις
  choice: dhambi
  rationale: Ni istilahi ya kawaida, wazi, na yenye heshima kwa ἁμαρτίαις.
- source_word: τοῖς ... καὶ ταῖς
  choice: kwa sababu ya ... na ...
  rationale: Dative hapa inaeleza hali au nyanja inayohusiana na kufa; katika Kiswahili, ‘kwa sababu ya’ huwasilisha kwa kawaida uhusiano wa makosa na dhambi na hali ya kuwa wafu.
- source_word: ὑμῶν
  choice: zenu
  rationale: Huhifadhi nafsi ya pili wingi na kuhusisha makosa na dhambi na walengwa.
theological_decisions:
- issue: Maana ya ‘wafu’
  choice: Kudumisha usemi ‘mlikuwa wafu’ bila kuongeza ‘kiroho’.
  alternative: ‘Mlikuwa wafu kiroho.’
  rationale: Chanzo chenyewe hakina kielezi ‘kiroho’; kuongeza neno hilo kungefafanua sitiari kwa namna ambayo mstari huu haujasema wazi.
- issue: Nguvu ya kitenzi kilichodokezwa
  choice: ‘mlikuwa’
  alternative: ‘mkiwa’
  rationale: Ingawa Kigiriki kina kivumishi-shirikishi ὄντας na sentensi inaendelea hadi mistari inayofuata, ‘mlikuwa’ hutoa Kiswahili cha kawaida na hufuata maana inayodokezwa katika muundo mpana, bila kubadili hali inayoelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nanyi’ hudumisha kiunganishi Καί na mkazo wa ὑμᾶς. Koma ya mwisho inaashiria kuwa sentensi ya Kigiriki inaendelea katika mistari inayofuata.
