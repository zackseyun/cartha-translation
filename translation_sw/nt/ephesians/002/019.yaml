base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: sw
  text: Basi, ninyi si wageni tena wala wakazi wa kigeni[a], bali ni raia wenza wa watakatifu[b][c] na watu wa nyumbani mwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapitaji.” Neno la Kigiriki humaanisha watu wanaoishi mahali fulani bila kuwa na hadhi kamili ya uraia.
    reason: lexical_alternative
  - marker: b
    text: Au, “raia pamoja na watakatifu.” Maana ni kwamba sasa wanashiriki uraia pamoja na watu watakatifu wa Mungu.
    reason: lexical_alternative
  - marker: c
    text: “Watakatifu” hapa humaanisha watu watakatifu wa Mungu, si kundi maalumu la watu waliotangazwa rasmi kuwa watakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Basi
  rationale: Muunganiko huu unatoa hitimisho kutokana na hoja iliyotangulia. “Basi” ni kiunganishi cha kawaida na chenye nguvu hiyo katika Kiswahili bila kuwa kizito.
- source_word: οὐκέτι
  choice: si ... tena
  rationale: Hueleza kwamba hali yao imebadilika; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: ξένοι
  choice: wageni
  rationale: Neno hili humaanisha watu wa kigeni au wasio sehemu ya jamii fulani. “Wageni” linadumisha utofauti wake na taswira ya watu wa nyumbani mwishoni mwa aya.
- source_word: πάροικοι
  choice: wakazi wasio na uraia
  rationale: Hurejelea watu wanaoishi mahali bila haki kamili za kiraia. Tafsiri hii inaweka wazi tofauti kati ya kuishi mahali na kuwa raia, huku tanbihi ikihifadhi mbadala mfupi zaidi.
- source_word: συμπολῖται
  choice: raia pamoja na
  rationale: Neno ambatani linasisitiza kushiriki uraia mmoja. “Raia pamoja na” ni la kawaida katika Kiswahili na linaonyesha ushirika huo.
- source_word: τῶν ἁγίων
  choice: watakatifu
  rationale: Tafsiri hii inadumisha istilahi pana ya Paulo bila kuamua katika matini kuu ikiwa anamaanisha kundi finyu zaidi; tanbihi inafafanua matumizi yake.
- source_word: οἰκεῖοι
  choice: watu wa nyumbani mwa
  rationale: Hurejelea walio wa nyumba au kaya fulani. Kauli hii ya Kiswahili inahifadhi taswira ya uhusiano wa karibu wa kifamilia.
- source_word: τοῦ θεοῦ
  choice: Mungu
  rationale: Katika “nyumbani mwa Mungu,” umilikaji unaonyeshwa kwa njia ya kawaida na ya heshima katika Kiswahili.
theological_decisions:
- issue: Kirejelewa cha τῶν ἁγίων (“watakatifu”)
  choice: Kudumisha neno pana “watakatifu,” likiwaelekeza wasomaji kwa watu watakatifu wa Mungu bila kulifungia kwa kundi maalumu
  alternative: Malaika; waamini Wayahudi hasa; au waamini wote
  rationale: Muktadha unaeleza kuingizwa kwa watu wa mataifa katika watu na nyumba ya Mungu. Matini kuu haipaswi kuondoa mvutano halisi kwa kutaja kundi finyu lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mfuatano wa taswira za kijamii—wageni, wakazi wasio raia, raia, na watu wa nyumbani—bila kuongeza msimamo wa kimadhehebu.
