id: EPH.2.18
reference: Ephesians 2:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: sw
  text: Kwa maana[a] kupitia yeye sisi sote tunaweza kumfikia Baba katika Roho mmoja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu kupitia yeye ...”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa Roho mmoja”; “katika Roho mmoja” linadumisha muundo wa Kigiriki, ambao unaweza kueleza njia inayotumiwa au mazingira ya ushirika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu kiunganishi kinaeleza msingi wa kauli iliyotangulia kuhusu amani na upatanisho. “Kwa sababu” pia kinawezekana, lakini “kwa maana” kinaunganisha maelezo kwa ufasaha.
- source_word: δι’ αὐτοῦ
  choice: kupitia yeye
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au mpatanishi; usemi huu unadumisha wazo kwamba Kristo ndiye ambaye kupitia kwake ufikiaji unapatikana.
- source_word: ἔχομεν
  choice: tunayo
  rationale: Hii ni hali ya sasa inayoonyesha jambo ambalo sote tunalo sasa, si tukio la wakati uliopita pekee.
- source_word: τὴν προσαγωγὴν
  choice: njia ya kumfikia
  rationale: προσαγωγή humaanisha ufikiaji au kuletwa mbele ya mwenye cheo. “Njia ya kumfikia” ni Kiswahili cha kawaida kinachoeleza nafasi ya kumkaribia Baba bila kuibana kuwa utambulisho wa mara moja tu.
- source_word: οἱ ἀμφότεροι
  choice: sisi sote wawili
  rationale: Usemi huu unarejelea pande mbili zilizotajwa katika muktadha, Wayahudi na watu wa mataifa, na unadumisha mshikamano wa nafsi ya kwanza.
- source_word: ἐν ἑνὶ πνεύματι
  choice: katika Roho mmoja
  rationale: “Katika” inadumisha ἐν na kuacha wazi kama Roho ndiye njia au mazingira ya ushirika huo. Herufi kubwa katika “Roho” inaonyesha rejeo linalowezekana zaidi kwa Roho Mtakatifu katika muktadha.
- source_word: πρὸς τὸν πατέρα
  choice: Baba
  rationale: Katika muundo “njia ya kumfikia Baba,” maana ya πρός ya kuelekea katika uwepo wa Baba imewasilishwa kwa Kiswahili cha kawaida bila kuongeza neno “Mungu.”
theological_decisions:
- issue: Mrejelewa wa “Roho mmoja”
  choice: Roho Mtakatifu
  alternative: roho moja ya pamoja ya kibinadamu
  rationale: Muktadha una muundo unaomhusisha Mwana, Roho na Baba. Kuandika “Roho” kwa herufi kubwa kunaonyesha mrejelewa huu unaowezekana zaidi bila kuongeza ufafanuzi katika matini.
- issue: Maana ya προσαγωγή
  choice: njia ya pamoja ya kumfikia Baba
  alternative: kuletwa rasmi mbele za Baba
  rationale: Neno linaweza kuwa na taswira ya kuletwa mbele ya mwenye mamlaka, lakini hapa “njia ya kumfikia” inaeleza kwa uwazi nafasi inayoendelea ambayo pande zote mbili zimepewa bila kufafanua taswira kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “sisi sote wawili” unaweka wazi pande mbili za muktadha bila kuzitaja ndani ya aya.
