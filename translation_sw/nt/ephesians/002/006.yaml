lexical_decisions:
- source_word: συνήγειρεν
  choice: alitufufua pamoja naye
  rationale: Kitenzi chenye kiambishi συν- kinaonyesha kwamba sisi tunashiriki pamoja na Kristo katika kufufuliwa; “pamoja naye” huweka maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: συνεκάθισεν
  choice: kutuketisha pamoja naye
  rationale: Maana ya msingi ni kuwaketisha watu pamoja na mwingine. Tafsiri hii huhifadhi ushirika na Kristo bila kuongeza wazo la kutawazwa au kutawala.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: katika ulimwengu wa mbinguni
  rationale: Kirai hiki cha Waefeso kinaelekeza kwenye eneo au nyanja ya mbinguni. “Ulimwengu wa mbinguni” ni ya asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno “mahali pa mbinguni,” huku tanbihi ikihifadhi uwezekano huo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: ndani ya Masihi Yesu
  rationale: “Ndani ya” huhifadhi lugha ya ushirika iliyo katika ἐν, na “Masihi” hutafsiri maana ya cheo Χριστός badala ya kukifanya jina lisiloelezwa.
- source_word: καὶ
  choice: naye … na
  rationale: Viunganishi vinahifadhi mwendelezo wa matendo ya Mungu kutoka sentensi pana inayozunguka aya hii.
theological_decisions:
- issue: Lugha ya ushirika na Kristo katika vitenzi vyenye συν-
  choice: Kueleza wazi “pamoja naye” katika vitenzi vyote viwili.
  alternative: 'Kuacha ushirika huo udokezwe tu: “alitufufua na kutuketisha.”'
  rationale: Vitenzi vya Kigiriki vinasisitiza kushiriki pamoja na Kristo katika kufufuliwa na kuketishwa; maneno haya yanaonyesha msisitizo huo bila kuongeza fundisho lisilokuwamo.
- issue: Χριστῷ kama cheo au jina lililozoeleka
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός kimsingi ni cheo chenye maana ya Masihi. Tafsiri kuu huonyesha maana hiyo, huku namna iliyozoeleka “Kristo Yesu” ikitolewa katika tanbihi.
- issue: Mahali au nyanja inayomaanishwa na ἐπουρανίοις
  choice: ulimwengu wa mbinguni
  alternative: maeneo ya mbinguni
  rationale: Nomino haikutajwa wazi katika Kigiriki; kwa hiyo tafsiri haipaswi kudai kwa nguvu kuwa ni sehemu mahususi. “Ulimwengu” huwasilisha nyanja hiyo, na tanbihi huhifadhi tafsiri ya kimahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “pamoja naye” umerudiwa kwa makusudi ili kuhifadhi msisitizo wa vitenzi viwili vya Kigiriki. Koma ya mwisho inahifadhi hali ya aya hii kuwa sehemu ya sentensi pana.
