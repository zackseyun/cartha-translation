  yaml_path: translation/nt/ephesians/002/009.yaml
  text: not from works[a], so that no one may boast.
translation:
  language: sw
  text: si kutokana na matendo[a], ili mtu yeyote asije akajisifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika matendo.” Kirai hiki huonyesha chanzo au asili; baadhi ya wafafanuzi hukielewa pia kwa maana ya njia (“kwa matendo”), lakini maneno ya Kigiriki kwa uhalisi zaidi ni “kutoka katika matendo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ
  choice: si
  rationale: Hukanusha kirai kinachofuata; hapa “si” ni ya kawaida na huunganika kwa uwazi na “kutokana na matendo.”
- source_word: ἐξ
  choice: kutokana na
  rationale: ἐκ/ἐξ huonyesha chanzo au asili. “Kutokana na” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuifanya moja kwa moja kuwa ya njia au chombo.
- source_word: ἔργων
  choice: matendo
  rationale: “Matendo” ni tafsiri pana na ya kawaida ya ἔργα. Haiongezi “ya sheria,” “mema,” wala ufafanuzi mwingine ambao haupo katika Kigiriki.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huanzisha kwa kawaida kusudi au matokeo yanayokusudiwa na kuhifadhi nguvu ya ἵνα kwa ufupi.
- source_word: μή τις
  choice: mtu yeyote asi-
  rationale: Katika kishazi cha kusudi hasi, muundo “ili mtu yeyote asi-” huwasilisha kwa kawaida maana ya kwamba hakuna mtu anayepaswa kufanya jambo hilo.
- source_word: καυχήσηται
  choice: asijisifu
  rationale: Kitenzi hiki kina maana ya kujisifu au kujivuna. “Asijisifu” kinafaa baada ya “ili” na huhifadhi lugha ya Paulo kuhusu kujisifu.
theological_decisions:
- issue: Maana ya “matendo” katika kauli ya Paulo
  choice: Kuhifadhi neno pana “matendo” bila kulibana katika tafsiri.
  alternative: “matendo ya sheria,” “jitihada za kibinadamu,” au “matendo mema”
  rationale: Kigiriki kinasema tu ἔργων. Kuongeza aina fulani ya matendo kungetatua kwa tafsiri jambo ambalo andiko lenyewe limeacha likiwa pana.
- issue: Nguvu ya ἐξ kabla ya “matendo”
  choice: Kutafsiri kwa “kutokana na,” likisisitiza chanzo au asili.
  alternative: “kwa matendo,” ambalo linaweza kueleweka zaidi kuwa njia au chombo
  rationale: ἐξ kwa kawaida huonyesha chanzo. Tafsiri inapaswa kuhifadhi hilo huku tanbihi ikitaja uwezekano wa kuelewa maana ya njia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa mstari wa Kigiriki umehifadhiwa, na “matendo” limeachwa bila ufafanuzi wa kimadhehebu.
