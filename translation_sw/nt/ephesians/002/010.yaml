id: EPH.2.10
reference: Ephesians 2:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: sw
  text: Kwa maana sisi ni kazi yake, tuliumbwa katika Masihi[a] Yesu kwa ajili ya matendo mema ambayo Mungu aliyatayarisha tangu awali, ili tuenende katika hayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi,” yaani Mtiwa-Mafuta.
    reason: alternative_reading
  - marker: b
    text: Kauli “tuenende katika hayo” inamaanisha kuyaweka matendo hayo mema kuwa mwenendo wa maisha yetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίημα
  choice: kazi yake
  rationale: Hutaja kitu ambacho Mungu amekifanya. “Kazi yake” ni ya kawaida na yenye hadhi, bila kuongeza wazo la ufundi au mikono ambalo halijasemwa wazi katika Kigiriki.
- source_word: κτισθέντες
  choice: tuliumbwa
  rationale: Huwasilisha kwa uwazi kitenzi cha kutendwa cha κτίζω na kukihusisha na utambulisho wa waamini kama kazi ya Mungu.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Katika” huhifadhi lugha ya Paulo ya muungano au uhusiano na Yesu, huku “Masihi” ikiwakilisha Χριστός kama cheo.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: kwa ajili ya matendo mema
  rationale: Huwasilisha kusudi au matokeo yaliyokusudiwa; “matendo mema” ni Kiswahili cha kawaida na hubeba uzito wa kimaadili wa ἔργα ἀγαθά.
- source_word: προητοίμασεν
  choice: aliyatayarisha tangu awali
  rationale: Huhifadhi maana ya kiambishi προ-, yaani kwamba Mungu aliyapanga au kuyatayarisha kabla.
- source_word: ἐν αὐτοῖς περιπατήσωμεν
  choice: tuenende katika hayo
  rationale: Huhifadhi sitiari ya Paulo ya kutembea kama namna ya kuishi, na “katika hayo” hurejelea matendo mema kuwa mazingira au mwenendo wa maisha.
- source_word: γάρ
  choice: Kwa maana
  rationale: Huonyesha kwamba mstari huu unaeleza au kutoa msingi wa kauli iliyotangulia.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au kama jina lililozoeleka
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika muktadha huu Χριστός bado ina nguvu ya cheo cha Yesu aliye Mtiwa-Mafuta; “Masihi” huhifadhi maana hiyo badala ya kuifanya iwe sehemu ya jina tu.
- issue: Uhusiano kati ya matayarisho ya Mungu na mwenendo wa wanadamu
  choice: matendo mema ambayo Mungu aliyatayarisha tangu awali, ili tuenende katika hayo
  alternative: matendo mema ambayo Mungu aliyatayarisha tangu awali ili tuyatende
  rationale: Muundo huu huhifadhi pamoja hatua ya Mungu na kusudi la waamini kuishi katika utii, bila kuamua zaidi ya maandiko kuhusu mabishano mapana ya uteuzi, neema, na hiari ya mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. “Tuenende” ni rasmi kidogo lakini hufaa hapa kwa sababu huhifadhi sitiari ya kutembea iliyo katika Kigiriki; tanbihi inaifafanua kwa wasomaji wa kawaida.
