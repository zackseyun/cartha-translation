  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: sw
  text: Wala pasiwe na maneno machafu, mazungumzo ya kipumbavu, au mizaha michafu[a]—mambo ambayo hayafai[b]—bali kuwe na shukrani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mizaha isiyo na adabu.” Neno la Kigiriki linaweza kumaanisha ucheshi kwa ujumla, lakini hapa limetumiwa kwa maana hasi kwa sababu limeorodheshwa pamoja na usemi usiofaa.
    reason: lexical_alternative
  - marker: b
    text: Au “mambo ambayo hayapasi” au “mambo yasiyo sahihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: maneno machafu
  rationale: Katika muktadha wa maneno mengine yanayohusu usemi na utofauti wake na shukrani, kifungu hiki kinaeleza usemi wa aibu au usio na adabu; “maneno machafu” ni Kiswahili cha kawaida na wazi.
- source_word: μωρολογία
  choice: mazungumzo ya kipumbavu
  rationale: Huhifadhi maana ya usemi usio na busara na hutofautisha neno hili na mizaha inayotajwa baadaye.
- source_word: ἢ
  choice: au
  rationale: Ni kiunganishi cha moja kwa moja cha kipengele cha mwisho katika orodha, huku muktadha ukionyesha kuwa yote yanakataliwa.
- source_word: εὐτραπελία
  choice: mizaha michafu
  rationale: Ingawa neno linaweza kumaanisha ucheshi au wepesi wa kujibu katika matumizi mengine, hapa lina maana hasi kwa kuwa limewekwa pamoja na usemi usiofaa.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: mambo ambayo hayafai
  rationale: Kiwakilishi cha wingi kinarejelea kwa pamoja mambo yote yaliyotajwa; “hayafai” huwasilisha kutokuwa kwao sahihi au kustahili.
- source_word: ἀλλὰ μᾶλλον
  choice: bali kuwe na
  rationale: “Bali” huonyesha utofauti wenye nguvu, na “kuwe na” hukamilisha kwa Kiswahili cha kawaida badala chanya iliyokusudiwa.
- source_word: εὐχαριστία
  choice: shukrani
  rationale: Huhifadhi nomino ya Kigiriki na utofauti kati ya usemi mbaya na usemi wa kumshukuru Mungu.
theological_decisions:
- issue: Upeo wa αἰσχρότης katika orodha
  choice: Kuitafsiri hasa kama usemi mchafu katika muktadha huu
  alternative: Aibu au uchafu wa kimaadili kwa maana pana
  rationale: μωρολογία na εὐτραπελία zinahusu usemi, na εὐχαριστία ni usemi wa shukrani; hivyo muktadha unaelekeza kwenye maneno bila kudai kuwa αἰσχρότης daima ina maana hiyo finyu.
- issue: Tathmini ya kimaadili ya εὐτραπελία
  choice: mizaha michafu
  alternative: ucheshi au maneno ya kiwitihada
  rationale: Maana hasi inatokana na kuorodheshwa pamoja na mambo ambayo hayafai; tafsiri haikatai ucheshi wote bali inalenga mzaha usiofaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Pasiwe” linaendeleza kwa kawaida katazo la mstari uliotangulia, na “bali kuwe na shukrani” hutoa tofauti chanya kwa usemi unaokataliwa.
