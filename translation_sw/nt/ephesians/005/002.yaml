  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: sw
  text: Na enendeni katika upendo, kama vile Masihi[a] naye alivyotupenda na akajitoa mwenyewe kwa ajili yetu[b] kama sadaka na dhabihu kwa Mungu yenye harufu ya kupendeza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός linatumika hapa kama cheo.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa niaba yetu.” Maneno “kwa ajili yetu” yanaweza kuonyesha kutenda kwa manufaa yetu au kwa kutuwakilisha.
    reason: lexical_alternative
  - marker: c
    text: Maneno “harufu ya kupendeza” yanarejelea lugha ya dhabihu katika Agano la Kale kuhusu sadaka inayompendeza Mungu.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: mwenende
  rationale: Inahifadhi sitiari ya Paulo ya ‘kutembea’ ikimaanisha mwenendo wa maisha; ‘mwenende’ ni lugha ya heshima na inaeleweka katika muktadha huu.
- source_word: ἐν ἀγάπῃ
  choice: katika upendo
  rationale: Inadumisha muundo wa kihusishi na maana ya upendo kuwa mazingira na namna ya mwenendo.
- source_word: ὁ Χριστός
  choice: Masihi
  rationale: Neno Χριστός hapa lina kibainishi na linafanya kazi kama cheo; ‘Masihi’ hudumisha nguvu hiyo ya cheo katika Kiswahili.
- source_word: ἠγάπησεν ἡμᾶς
  choice: alivyotupenda
  rationale: Ni tafsiri ya moja kwa moja inayodumisha uhusiano wa kimsamiati na ‘upendo’ uliotajwa mwanzoni.
- source_word: παρέδωκεν ἑαυτὸν
  choice: kujitoa mwenyewe
  rationale: Inaeleza kwa kawaida tendo la kujikabidhi kwa hiari bila kupunguza uzito wa kujitoa kwake kwa ajili ya wengine.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Inadumisha maana ya kutenda kwa manufaa au kwa niaba yetu bila kulazimisha maana finyu zaidi kuliko kihusishi cha Kigiriki.
- source_word: προσφορὰν καὶ θυσίαν
  choice: sadaka na dhabihu
  rationale: Inahifadhi maneno yote mawili ya ibada ya kutoa sadaka badala ya kuyaunganisha kuwa dhana moja.
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Inaonyesha Mungu kuwa mpokeaji wa sadaka katika muktadha huu.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: yenye harufu ya kupendeza
  rationale: Ni Kiswahili cha kawaida kinachohifadhi taswira ya harufu na mwangwi wa lugha ya dhabihu katika Agano la Kale.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Kibainishi cha Kigiriki na matumizi ya neno hapa vinaonyesha cheo. ‘Masihi’ hudhihirisha cheo hicho, huku ‘Kristo’ ikitajwa kama namna mbadala iliyozoeleka.
- issue: Nguvu ya ὑπὲρ ἡμῶν katika muktadha wa dhabihu
  choice: kwa ajili yetu
  alternative: kwa niaba yetu
  rationale: Kauli hii inahifadhi maana ya kujitoa kwa manufaa yetu na uwezekano wa uwakilishi bila kuifanya kihusishi kiseme wazi zaidi ya Kigiriki chenyewe.
- issue: Taswira ya εἰς ὀσμὴν εὐωδίας
  choice: yenye harufu ya kupendeza
  alternative: kuwa harufu nzuri
  rationale: Inadumisha taswira ya dhabihu inayokubaliwa na Mungu bila kubadili taswira hiyo kuwa maelezo ya kitheolojia yasiyo ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘mwenende katika upendo’ umechaguliwa kuhifadhi sitiari ya chanzo, na ‘akiwa’ huunganisha kujitoa kwa Masihi na hadhi ya sadaka na dhabihu kwa namna ya kawaida katika Kiswahili.
