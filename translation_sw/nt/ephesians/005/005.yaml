source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: sw
  text: 'Kwa maana jueni jambo hili kwa hakika: kila mwasherati, au mtu mchafu, au mwenye uchoyo—ambaye ni mwabudu wa sanamu[a]—hana urithi katika ufalme wa Masihi[b] na Mungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “jambo ambalo ni ibada ya sanamu”; huenda maneno hayo yanarejelea hasa uchoyo.
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: Christos; hapa limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: mnajua hili, mkifahamu
  rationale: Huhifadhi msisitizo wa vitenzi viwili vya kujua na kufahamu, huku ikibaki sentensi ya kawaida katika Kiswahili.
- source_word: πόρνος
  choice: mwasherati
  rationale: Humaanisha mtu anayejulikana kwa uasherati; neno hili ni wazi, la sasa, na lenye heshima katika Kiswahili sanifu.
- source_word: ἀκάθαρτος
  choice: mchafu
  rationale: Huhifadhi taswira ya uchafu ambayo hapa inahusu uchafu wa kimaadili, bila kuifanya maana iwe finyu kuliko ilivyo katika Kigiriki.
- source_word: πλεονέκτης
  choice: mwenye tamaa
  rationale: Hueleza mtu mwenye tamaa ya kujipatia zaidi kwa pupa; ni usemi wa kawaida na mpana kuliko istilahi isiyozoeleka.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: ambaye ni mwabudu sanamu
  rationale: Hufuata maana ya kimuktadha kwamba mwenye tamaa ni mwabudu sanamu, huku utata wa kiwakilishi cha Kigiriki ukihifadhiwa katika tanbihi.
- source_word: κληρονομίαν
  choice: urithi
  rationale: Huhifadhi maana ya urithi na mwangwi wake wa kiagano na wa wakati ujao katika matumizi ya Paulo.
- source_word: βασιλείᾳ
  choice: ufalme
  rationale: Ni neno la kawaida na sahihi linaloweza kuhusisha mamlaka ya kutawala pamoja na eneo la utawala.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa inatumika kama cheo; “Masihi” huwasilisha cheo hicho moja kwa moja.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: wa Masihi na Mungu
  rationale: Hufuata uratibu wa virai vya Kigiriki bila kulazimisha hitimisho mahsusi la kisintaksia au la kitheolojia.
theological_decisions:
- issue: Kirejelewa cha ὅ ἐστιν εἰδωλολάτρης
  choice: 'Kifungu kimetumiwa kumweleza mtu aliyetajwa mwisho, hasa mwenye tamaa: “ambaye ni mwabudu sanamu.”'
  alternative: “jambo ambalo ni ibada ya sanamu,” likirejelea hasa tamaa au uchoyo
  rationale: Kiwakilishi cha Kigiriki kiko katika jinsia isiyo ya kiume, ingawa majina yaliyotangulia ni ya kiume. Muktadha na Wakolosai 3:5 vinaunga mkono uhusiano wa tamaa na ibada ya sanamu; tanbihi inahifadhi uwezekano wa maana ya kidhahania.
- issue: Maana ya kutokuwa na urithi
  choice: “hana urithi” kama kauli ya hali ya sasa
  alternative: “hataurithi ufalme” kama kauli ya wakati ujao
  rationale: Kigiriki kinatumia kitenzi cha wakati wa sasa, οὐκ ἔχει; tafsiri haibadili onyo hilo kuwa kitenzi cha wakati ujao.
- issue: Uhusiano wa “Masihi na Mungu”
  choice: 'Virai viwili vimeratibiwa moja kwa moja: “ufalme wa Masihi na Mungu.”'
  alternative: Tafsiri yenye kuweka wazi dai mahsusi zaidi la kikristolojia kutokana na sintaksia
  rationale: Muundo wa Kigiriki umehifadhiwa bila kulazimisha hitimisho linalozidi kile ambacho maneno yenyewe yanasema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umewekwa wazi, na vistari virefu vinatenga kifungu cha ufafanuzi bila kuondoa utata wa asili.
