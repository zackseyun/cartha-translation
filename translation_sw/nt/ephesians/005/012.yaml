  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: sw
  text: Kwa maana, hata kuyataja mambo wanayoyafanya kwa siri ni aibu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yanayofanywa kwa siri na wao.”
    reason: Njia mbadala inayohifadhi kwa uwazi zaidi muundo wa kutendwa wa γινόμενα pamoja na mtendaji ὑπ’ αὐτῶν.
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha sababu inayounga mkono himizo lililotangulia na kudumisha mtiririko wa hoja ya Paulo.
- source_word: τὰ ... γινόμενα
  choice: mambo wanayofanya
  rationale: Kihusishi chenye umbo la nomino kinarejelea matendo; Kiswahili cha kiasili hutumia kishazi hiki badala ya tafsiri nzito kama “mambo yanayofanywa.”
- source_word: κρυφῇ
  choice: kwa siri
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kutenda kwa namna iliyofichika.
- source_word: ὑπ’ αὐτῶν
  choice: wana-
  rationale: Mtendaji wa wingi ameonyeshwa ndani ya kitenzi cha Kiswahili bila kuongeza utambulisho ambao Kigiriki hakijautaja wazi katika aya hii.
- source_word: αἰσχρόν
  choice: ni ya aibu
  rationale: Inaonyesha hukumu ya kimaadili ya αἰσχρόν kwa lugha ya sasa, iliyo wazi na yenye hadhi.
- source_word: καὶ λέγειν
  choice: hata kuyataja
  rationale: “Hata” huhifadhi nguvu ya kupandisha msisitizo ya καί, na “kuyataja” ni Kiswahili cha kiasili kwa kusema juu ya mambo hayo.
theological_decisions:
- issue: Marejeo ya αὐτῶν
  choice: Kudumisha kiwakilishi cha wingi ndani ya “wanayofanya” bila kuwataja watu hao moja kwa moja
  alternative: “mambo yanayofanywa nao” au kuongeza “watu wasiotii”
  rationale: Muktadha ndio unaobainisha wanaorejelewa. Kuwataja kwa jina katika aya kungeongeza ufafanuzi usiopo wazi katika Kigiriki.
- issue: Uhusiano wa aibu na kutaja
  choice: “ni ya aibu hata kuyataja”
  alternative: “mambo hayo ni ya aibu, na kuyataja pia ni aibu”
  rationale: Muundo uliochaguliwa huhifadhi kwa ufupi msisitizo kwamba hata kuyasema mambo hayo ni jambo la aibu, bila kutatua zaidi ya lazima upeo wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mambo wanayofanya” ni cha kawaida na rahisi kueleweka; tanbihi huhifadhi uwezekano wa tafsiri iliyo rasmi zaidi wa muundo wa Kigiriki.
