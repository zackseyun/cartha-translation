  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: sw
  text: Lakini vitu vyote vinapofunuliwa na nuru huonekana wazi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kinachofunuliwa na nuru huonekana wazi.” Muundo wa Kigiriki unaweza kueleweka kwa njia zinazokaribiana, ukikazia ama tendo la kufunua ama matokeo ya kuonekana wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: vitu vyote
  rationale: Nomino ya wingi isiyo na jinsia pamoja na kibainishi ina upeo mpana; “vitu vyote” huhifadhi wingi na maana pana ya usemi wa Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti nyepesi na kauli iliyotangulia; “Lakini” linaendeleza mkondo huo kwa Kiswahili cha kawaida.
- source_word: ἐλεγχόμενα
  choice: vinapofunuliwa
  rationale: Katika muktadha wa nuru, kitenzi hiki kina maana ya kufichua au kuweka wazi. Muundo wa “vinapofunuliwa” huhifadhi hali ya kutendwa na uhusiano wake na kitenzi kikuu bila kuibana maana kuwa kukaripiwa au kuhukumiwa.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: na nuru
  rationale: ὑπό pamoja na hali ya umilikishi huonyesha mtendaji; “na nuru” ni muundo wa kawaida wa Kiswahili wa kuonyesha kinachofanya tendo katika kauli ya kutendwa. Muktadha tayari umetaja nuru.
- source_word: φανεροῦται
  choice: huonekana wazi
  rationale: Kitenzi hiki humaanisha kuonekana au kudhihirishwa. “Huonekana wazi” kinaendana na taswira ya nuru na kudumisha matokeo ya kuwekwa wazi.
theological_decisions:
- issue: Maana ya “nuru” katika muktadha
  choice: Kutafsiri “nuru” bila kutaja wazi inamrejelea nani au nini katika mstari huu.
  alternative: Kristo; Injili; ukweli wa kimaadili; au ushuhuda wa jumuiya ya waamini.
  rationale: Muktadha unawaita waamini nuru katika Bwana (5:8) na unazungumzia kuyafichua matendo ya giza (5:11), lakini mstari wenyewe haufafanui zaidi rejeleo la “nuru.” Tafsiri inadumisha upana huo wa sitiari.
- issue: Uhusiano wa ἐλεγχόμενα na φανεροῦται
  choice: “vitu vyote vinapofunuliwa na nuru huonekana wazi”
  alternative: “kila kinachofunuliwa na nuru huonekana wazi”
  rationale: Sarufi ya Kigiriki inaruhusu msisitizo kuwekwa ama kwa vitu vyote vinapofunuliwa ama kwa kila kitu kilichofunuliwa. Maandishi makuu yanahifadhi upeo rasmi wa τὰ πάντα, na tanbihi inaonyesha uchanganuzi mwingine unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Huonekana wazi” ni cha asili zaidi kuliko “hudhihirishwa,” huku “vinapofunuliwa” kikihifadhi taswira na hali ya kutendwa ya Kigiriki.
