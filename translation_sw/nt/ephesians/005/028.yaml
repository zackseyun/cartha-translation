  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: sw
  text: Vivyo hivyo, waume nao wanapaswa kuwapenda wake zao wenyewe kama miili yao wenyewe. Anayempenda mke wake mwenyewe anajipenda mwenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Vivyo hivyo
  rationale: Huunganisha agizo hili na mfano uliotangulia kwa Kiswahili cha kawaida, huku ikihifadhi maana ya kulinganisha na kuhitimisha.
- source_word: ὀφείλουσιν
  choice: wanapaswa
  rationale: Huonyesha wajibu wa kimaadili unaopatikana katika kitenzi, bila kubadili muundo huu kuwa amri ya moja kwa moja.
- source_word: καὶ οἱ ἄνδρες
  choice: waume nao
  rationale: Katika muktadha wa ndoa, ἄνδρες ni waume; kiambishi “nao” kinahifadhi nguvu ya nyongeza ya καί kwa Kiswahili fasaha.
- source_word: ἀγαπᾶν
  choice: kuwapenda
  rationale: Hudumisha maana ya upendo na uhusiano wa kileksika na marudio ya ἀγαπάω katika sehemu ya pili ya mstari.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: wake zao wenyewe
  rationale: “Wake” ni maana ya kimuktadha ya γυναῖκας, na “wenyewe” huhifadhi msisitizo wa kiwakilishi rejeshi ἑαυτῶν.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: kama miili yao wenyewe
  rationale: Huhifadhi ulinganisho wa moja kwa moja pamoja na neno halisi “miili” kwa σώματα na msisitizo wa “yao wenyewe.”
- source_word: ὁ ἀγαπῶν
  choice: Anayempenda
  rationale: Huwasilisha kirai cha kisifa chenye kazi ya nomino kwa Kiswahili cha asili; mrejeleo wa kiume unaendelea kuwa wazi kupitia “mke wake.”
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: mke wake mwenyewe
  rationale: Huhifadhi maana ya ndoa na msisitizo wa kiwakilishi rejeshi ἑαυτοῦ.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: anajipenda mwenyewe
  rationale: Kitenzi rejeshi “anajipenda” huakisi ἑαυτὸν, na “mwenyewe” huweka wazi msisitizo wa kujipenda uliomo katika hoja.
theological_decisions:
- issue: Lugha ya kijinsia katika mausia ya kifamilia
  choice: “waume” na “Anayempenda mke wake”
  alternative: “wanaume” au usemi wa jumla usioonyesha jinsia
  rationale: Muktadha unawahusu wanaume waliooa, si wanadamu kwa ujumla. Kiswahili hakihitaji kiwakilishi cha kijinsia katika “anayempenda,” lakini “mke wake” huweka mrejeleo wa mume wazi.
- issue: Asili ya ulinganisho kati ya mke na mwili
  choice: 'Ulinganisho umeachwa wazi: “kama miili yao wenyewe”'
  alternative: Kuupanua kuwa dai la utambulisho wa kimetafizikia
  rationale: Maneno ya Paulo yanalinganisha kumpenda mke na kuupenda mwili wa mtu mwenyewe, kisha yanasema kuwa kumpenda mke ni kujipenda. Tafsiri haiingizi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku marudio ya “wenyewe” yakihifadhi msisitizo wa viwakilishi rejeshi katika Kigiriki.
