  text: Kwa hiyo, iweni[a] waigaji wa Mungu, kama watoto wapendwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwigeni Mungu”; amri ya Kigiriki inaweza kusisitiza kuanza kuwa au kuendelea kuwa waigaji.
