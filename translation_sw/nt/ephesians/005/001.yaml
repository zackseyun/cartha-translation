lexical_decisions:
- source_word: γίνεσθε
  choice: mwigeni
  rationale: Katika Kiswahili, amri ya moja kwa moja “mwigeni” ni ya asili na hudumisha wazo la kuendelea kuwa waigaji; kutafsiri kihalisi kwa “kuweni waigaji” kungekuwa kizito. Tanbihi inadumisha uwezekano wa msisitizo wa kuwa au kuendelea kuwa.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia na ni kiunganishi cha kawaida katika Kiswahili sanifu.
- source_word: μιμηταὶ
  choice: mwigeni
  rationale: Kitenzi “kuiga” kinadumisha wazi dhana ya imitation; “mfuateni” ingekuwa pana zaidi na ingeweza kudhoofisha wazo hilo.
- source_word: τοῦ θεοῦ
  choice: Mungu
  rationale: Ni umbo la kawaida la Kiswahili baada ya kitenzi “mwigeni,” bila kuhitaji kutafsiri jenitivi kwa muundo mzito.
- source_word: ὡς
  choice: kama
  rationale: Hudumisha kwa ufupi maana inayoweza kueleweka kama namna au msingi wa himizo bila kuifanya wazi kuwa sababu pekee.
- source_word: τέκνα
  choice: watoto
  rationale: Ni neno lisilobagua jinsia na linaonyesha uhusiano wa kifamilia kwa usahihi.
- source_word: ἀγαπητά
  choice: wapendwa
  rationale: Ni neno la asili, lenye heshima, na linalodumisha uzito wa kuwa wenye kupendwa.
theological_decisions:
- issue: Nguvu ya himizo kwa kuhusiana na utambulisho wa kuwa watoto wa Mungu
  choice: “kama watoto wapendwa” linaachwa liweze kuonyesha namna au msingi wa kumwiga Mungu, bila kudokeza kwamba kumwiga ndiko kunakowafanya wawe watoto.
  alternative: 'Kulieleza wazi kuwa “kwa sababu ninyi ni watoto wapendwa,” au kulifanya kuwa ulinganisho tu: “kama watoto wapendwa wanavyofanya.”'
  rationale: Muundo wa Kigiriki ni mfupi na unaweza kubeba hisia ya namna pamoja na msingi. Tafsiri haiongezi dai la kiteolojia ambalo mstari haujalitamka wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwigeni Mungu” ni cha asili zaidi kuliko “kuweni waigaji wa Mungu,” huku tanbihi ikihifadhi upeo wa kitenzi cha Kigiriki.
