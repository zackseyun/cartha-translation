  text: mkiutumia vizuri wakati[a], kwa sababu siku ni za uovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkiukomboa wakati”; usemi wa Kigiriki unaweza pia kumaanisha “mkiitumia kikamilifu fursa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: mkiutumia vizuri
  rationale: Kitenzi hiki kwa asili kina taswira ya kununua au kukomboa, lakini katika muktadha huu kinahimiza kutumia kikamilifu wakati au fursa iliyopo. Usemi huu ni wa kawaida na haudokezi bila sababu ukombozi wa wokovu.
- source_word: καιρόν
  choice: wakati
  rationale: Neno hili linaweza kumaanisha wakati unaofaa au fursa. “Wakati” linaendeleza uhusiano wa moja kwa moja na maandishi ya Kigiriki, huku tanbihi ikihifadhi maana ya “fursa.”
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya himizo lililotangulia; “kwa sababu” ni tafsiri ya wazi katika Kiswahili cha sasa.
- source_word: αἱ ἡμέραι
  choice: siku hizi
  rationale: Kigiriki kinasema kihalisi “siku,” lakini hapa kinarejelea kipindi na hali za sasa. “Siku hizi” ni usemi wa asili unaodumisha picha hiyo.
- source_word: πονηραί
  choice: za uovu
  rationale: Neno hili linaonyesha ubaya wa kimaadili au hali yenye uovu. “Za uovu” ni tafsiri yenye uzito unaofaa kuliko maneno yanayoonyesha shida pekee.
theological_decisions:
- issue: Uwezekano wa kuelewa ἐξαγοραζόμενοι kama lugha ya ukombozi wa wokovu
  choice: Himizo la kutumia wakati au fursa vizuri
  alternative: kuukomboa wakati
  rationale: Katika muktadha huu wa mawaidha, maana kuu ni kutumia kikamilifu wakati au fursa, si kueleza ukombozi wa wokovu. Hata hivyo, tafsiri ya karibu zaidi na taswira ya Kigiriki imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kirai tegemezi umehifadhiwa kwa kuwa mstari huu unaendeleza sentensi ya aya zilizotangulia.
