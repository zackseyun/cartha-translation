  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: sw
  text: Kwa sababu hiyo[a], mwanamume atamwacha baba yake na mama yake, ataambatana na mke wake, nao wawili watakuwa mwili mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa sababu ya hili.” Kirai cha Kigiriki ἀντὶ τούτου kinatumika hapa kuonyesha sababu katika nukuu ya Mwanzo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Kwa sababu hiyo
  rationale: Katika nukuu hii ya Mwanzo 2:24, kirai hiki kinafanya kazi kama kiunganishi kinachoonyesha sababu; tafsiri hii ni ya asili katika Kiswahili na inaendeleza uhusiano huo wa kimantiki.
- source_word: καταλείψει
  choice: atamwacha
  rationale: Kitenzi hiki kinaonyesha mwanamume kuondoka katika nyumba ya wazazi ili kuanzisha muungano wa ndoa, bila kudokeza kwa lazima kuwatelekeza kihisia.
- source_word: ἄνθρωπος
  choice: mwanamume
  rationale: Ingawa neno hili linaweza kumaanisha binadamu kwa ujumla, hapa linamtaja mwenzi wa kiume, kwa kuwa linaambatana na usemi ‘mke wake.’
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: baba yake na mama yake
  rationale: Kiswahili cha kawaida hutumia kiwakilishi kimilikishi kwa kila mzazi; maana ya jozi ya wazazi imehifadhiwa wazi.
- source_word: προσκολληθήσεται
  choice: ataambatana na
  rationale: Neno hili linaonyesha kushikamana kwa karibu na kwa kudumu. ‘Ataambatana na’ ni la asili katika Kiswahili na linafaa kwa muungano wa ndoa bila kupunguza maana kuwa ukaribu wa kimwili tu.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: mke wake
  rationale: γυνή linaweza kumaanisha mwanamke au mke, lakini muktadha wa ndoa unahitaji ‘mke.’
- source_word: ἔσονται οἱ δύο
  choice: nao wawili watakuwa
  rationale: Tafsiri hii inahifadhi kitenzi ‘watakuwa’ na msisitizo wa οἱ δύο, yaani ‘wawili.’
- source_word: εἰς σάρκα μίαν
  choice: mwili mmoja
  rationale: Katika Kiswahili, ‘mwili mmoja’ ndiyo njia ya kawaida na yenye hadhi ya kuwasilisha nahau ya kibiblia kuhusu muungano wa ndoa; haimaanishi hapa hali ya dhambi.
theological_decisions:
- issue: Lugha ya kijinsia katika nukuu kuhusu ndoa
  choice: mwanamume ... mke wake
  alternative: mtu ... mwenzi wake
  rationale: Nukuu inawasilisha kwa uwazi mwenzi wa kiume na mke wake; tafsiri haifanyi lugha hiyo kuwa isiyoonyesha jinsia.
- issue: Maana ya σάρξ katika εἰς σάρκα μίαν
  choice: mwili mmoja
  alternative: nyama moja
  rationale: Hapa σάρξ ni lugha ya kimahusiano na ya muungano wa ndoa kutoka Mwanzo, si istilahi ya hali ya dhambi. ‘Mwili mmoja’ ni nahau ya Kiswahili inayoeleweka na kuhifadhi maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo wa nukuu ya Agano la Kale umehifadhiwa bila kutumia lugha nzito isiyo ya kawaida.
