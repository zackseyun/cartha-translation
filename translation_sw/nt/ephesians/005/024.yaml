  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: sw
  text: Lakini kama vile kanisa linavyojitiisha kwa Masihi[a], ndivyo wake wanavyojitiisha kwa waume zao katika kila jambo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofautishaji au kuendeleza hoja kutoka mstari uliotangulia kwa kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ὡς ... οὕτως καὶ
  choice: kama vile ... vivyo hivyo
  rationale: Inahifadhi muundo wa ulinganisho wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: ἡ ἐκκλησία
  choice: kanisa
  rationale: Katika matumizi ya Paulo hapa neno hili linamaanisha jumuiya ya waamini; “kanisa” ndilo neno sanifu na linaloeleweka kwa urahisi.
- source_word: ὑποτάσσεται
  choice: linavyojitiisha
  rationale: Kitenzi cha kujirejelea kinaonyesha kujitia chini ya mamlaka au utaratibu; “kujitiisha” huhifadhi maana hiyo bila kuongeza wazo la kulazimishwa.
- source_word: τῷ Χριστῷ
  choice: kwa Masihi
  rationale: Χριστός inafanya kazi kama cheo; “Masihi” hutafsiri cheo hicho badala ya kukifanya tu kuwa jina.
- source_word: αἱ γυναῖκες
  choice: wake
  rationale: Muktadha wa ndoa na ulinganifu wake na ἀνδράσιν unahitaji maana ya wake, si wanawake kwa ujumla.
- source_word: τοῖς ἀνδράσιν
  choice: kwa waume zao
  rationale: Katika muktadha huu ἀνήρ humaanisha mume. “Zao” huonyesha kwa Kiswahili uhusiano wa kindoa unaodokezwa na Kigiriki.
- source_word: ἐν παντί
  choice: katika kila jambo
  rationale: Huhifadhi upana wa usemi wa Kigiriki bila kuongeza masharti au maelezo yasiyopo katika mstari.
- source_word: '[ellipsis of ὑποτάσσεται in the second clause]'
  choice: vivyo hivyo wake kwa waume zao
  rationale: Kutotaja tena kitenzi kunahifadhi udondoshaji wa kitenzi katika Kigiriki; maana yake bado inapatikana wazi kutoka kishazi cha kwanza.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hilo limetumika hapa kama cheo. “Masihi” linaonyesha wazi cheo hicho, huku “Kristo” likitajwa katika tanbihi kama namna nyingine iliyozoeleka.
- issue: Upeo wa kauli ya kujitiisha katika ndoa
  choice: katika kila jambo
  alternative: katika kila jambo linalofaa
  rationale: Kigiriki kinasema ἐν παντί bila sifa ya ziada. Kuongeza “linalofaa” kungeamua mvutano wa kitheolojia ambao mstari wenyewe hauufafanui.
- issue: Kitenzi kilichodondoshwa katika kishazi cha wake
  choice: Kuhifadhi udondoshaji
  alternative: ndivyo pia wake wanavyopaswa kujitiisha kwa waume zao
  rationale: Kigiriki hakirudii kitenzi katika kishazi cha pili. Muundo wa Kiswahili unaeleweka kutokana na ulinganisho na hauongezi dhana ya wajibu kwa neno “wanavyopaswa” ambalo halipo wazi katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ulinganisho na udondoshaji wa kitenzi katika kishazi cha pili umehifadhiwa kwa ukaribu na chanzo.
