lexical_decisions:
- source_word: γυναῖκες
  choice: enyi wake
  rationale: Katika muktadha wa mafundisho kuhusu nyumba na kwa kuhusishwa na ἀνδράσιν, neno hili linamaanisha wake, si wanawake kwa ujumla. ‘Enyi’ huonyesha wazi kwamba wanaelekezwa moja kwa moja.
- source_word: ἰδίοις ἀνδράσιν
  choice: kwa waume zenu wenyewe
  rationale: Katika muktadha huu ἀνήρ ni ‘mume,’ na ἰδίοις imedumishwa kwa ‘wenyewe’ ili kuonyesha uhusiano mahususi wa ndoa.
- source_word: ὡς
  choice: kama
  rationale: ‘Kama’ inadumisha ulinganisho wa Kigiriki bila kuufafanua kupita kiasi.
- source_word: κυρίῳ
  choice: Bwana
  rationale: Katika muktadha wa Paulo hapa, κύριος anamrejelea Bwana Yesu; Kiswahili cha kawaida hakihitaji kibainishi kinacholingana na ‘the’.
- source_word: kitenzi kinachoeleweka kutokana na muktadha
  choice: '[elewa ‘jitiisheni’]'
  rationale: Mstari wa 22 katika matini hii hauna kitenzi chake wazi, bali unategemea ὑποτασσόμενοι (‘mkijitiisha’) katika mstari wa 21. Rasimu inadumisha udondoshaji huo na kueleza maana katika tanbihi.
theological_decisions:
- issue: Kama kitenzi ‘jitiisheni’ kiongezwe katika matini kuu ingawa hakipo wazi katika Kigiriki cha mstari wa 22
  choice: Kutoongeza kitenzi katika matini kuu; kudumisha muundo unaotegemea mstari uliotangulia na kueleza maana inayodokezwa katika tanbihi.
  alternative: Enyi wake, jitiisheni kwa waume zenu wenyewe kama kwa Bwana.
  rationale: Kitenzi kinaeleweka kutoka mstari wa 21, lakini hakipo wazi katika wording ya Kigiriki ya mstari huu. Kuacha sentensi ikiwa na udondoshaji kunatanguliza ushahidi wa lugha asilia na kuepuka kufanya kilichodokezwa kionekane kana kwamba kimeandikwa wazi katika mstari wa 22.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi usio na kitenzi umedumishwa kimakusudi ili kuakisi udondoshaji wa Kigiriki; tanbihi humsaidia msomaji kuelewa utegemezi wake kwa mstari wa 21.
