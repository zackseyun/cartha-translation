lexical_decisions:
- source_word: μεθύσκεσθε
  choice: msilewe
  rationale: Kitenzi cha wakati uliopo pamoja na μή kinatoa katazo. ‘Msilewe’ ni Kiswahili cha kawaida na chenye hadhi, kinachoeleza kuingia au kuwa katika hali ya ulevi bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: οἴνῳ
  choice: kwa divai
  rationale: Hali ya dative inaonyesha kitu au njia inayosababisha kulewa; ‘kwa divai’ ni usemi wa asili katika Kiswahili na hudumisha uhusiano huo.
- source_word: ἐν ᾧ
  choice: ambamo
  rationale: Kiwakilishi hiki kinarejelea divai, au hali ya kulewa inayohusiana nayo. ‘Ambamo’ kinahifadhi muundo wa uhusiano bila kuamua zaidi ya maandishi.
- source_word: ἀσωτία
  choice: upotovu
  rationale: Neno hili lina maana ya mwenendo usio na kiasi, usiozuilika, na wenye kuharibu. ‘Upotovu’ linaeleweka kwa urahisi na linabeba uzito wa kimaadili, ingawa wazo la ubadhirifu lililoweza kuwamo katika neno la Kigiriki halijitokezi kikamilifu.
- source_word: πληροῦσθε
  choice: mjazwe
  rationale: Ni amri katika hali ya kutendwa na wakati uliopo. ‘Mjazwe’ huhifadhi hali ya kutendwa na amri; mwendelezo wake unabaki kudokezwa na muktadha badala ya kuongezwa kwa neno kama ‘daima.’
- source_word: ἐν πνεύματι
  choice: na Roho
  rationale: Baada ya πληροῦσθε, ἐν pamoja na dative inaweza kuonyesha chombo, yaliyomo, au mazingira. ‘Na Roho’ ni Kiswahili cha asili kinachoweza kubeba maana ya kujazwa kwa kazi ya Roho au kwa Roho, huku tanbihi ikihifadhi uwezekano wa ‘katika Roho’ na ‘rohoni.’
theological_decisions:
- issue: Mrejelewa wa πνεύματι
  choice: Roho, yaani Roho Mtakatifu
  alternative: roho, au roho yenu
  rationale: Katika muktadha wa himizo hili la Paulo, uwezekano mkubwa ni kwamba πνεύματι inamrejelea Roho Mtakatifu. Hata hivyo, Kigiriki hakina kibainishi hapa, kwa hiyo tanbihi inahifadhi uwezekano wa kuelewa kauli hiyo kuwa ‘katika Roho’ au kwa maana ya jumla zaidi ‘rohoni.’
- issue: Uhusiano unaoonyeshwa na ἐν katika ἐν πνεύματι
  choice: na Roho
  alternative: katika Roho
  rationale: Kirai kinaweza kueleweka kwa namna zinazokaribiana kama chombo, yaliyomo, au mazingira. Tafsiri kuu hutumia usemi wa asili wa Kiswahili bila kufafanua kwa namna ya kimadhehebu, na tanbihi huhifadhi ‘katika Roho.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa himizo na ulinganifu kati ya kulewa kwa divai na kujazwa na Roho umehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya ‘Roho,’ mahali ambapo utata wa ἐν πνεύματι unatokea.
