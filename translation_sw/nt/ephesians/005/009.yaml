lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa sababu au ufafanuzi wa himizo lililotangulia.
- source_word: καρπὸς
  choice: tunda
  rationale: Inahifadhi sitiari ya matokeo yanayozalishwa katika maisha ya mtu.
- source_word: τοῦ φωτός
  choice: la nuru
  rationale: Inatafsiri kirai cha Kiyunani moja kwa moja na kukiunganisha na kutajwa kwa nuru katika mstari uliotangulia.
- source_word: ἐν
  choice: huonekana katika
  rationale: Katika muktadha huu kihusishi kinaonyesha eneo au namna ambayo tunda hilo linajidhihirisha; tafsiri hii ni ya asili katika Kiswahili bila kulifanya kuwa mahali halisi.
- source_word: πάσῃ
  choice: kila aina ya
  rationale: Pamoja na nomino dhahania, neno hili lina maana pana na jumuishi; ‘kila aina ya wema’ ni Kiswahili cha kawaida kuliko ‘wema wote’ hapa.
- source_word: ἀγαθωσύνῃ
  choice: wema
  rationale: Linabeba maana pana ya uzuri wa maadili na kutenda mema bila kuifinyaza kuwa fadhili pekee.
- source_word: δικαιοσύνῃ
  choice: haki
  rationale: ‘Haki’ ni istilahi ya kawaida ya Kiswahili inayoweza kujumuisha mwenendo ulionyooka na kutenda kwa uadilifu, hivyo inadumisha upana wa neno la Kiyunani.
- source_word: ἀληθείᾳ
  choice: kweli
  rationale: Inahifadhi maana pana inayoweza kurejelea ukweli na uaminifu wa kimaadili.
theological_decisions:
- issue: Tofauti ya maandishi katika kirai τοῦ φωτός
  choice: tunda la nuru
  alternative: tunda la Roho
  rationale: SBLGNT ina φωτός (‘nuru’), nayo inafaa na muktadha wa kuwa nuru katika Bwana katika mstari wa 8. Tofauti inayosomeka ‘Roho’ imehifadhiwa katika tanbihi.
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ hudumisha kwa upana wazo la unyofu wa kimaadili na haki kwa wengine; ‘uadilifu’ ni mbadala unaowezekana lakini mwembamba zaidi katika baadhi ya matumizi.
- issue: Nguvu ya ἐν katika orodha ya sifa
  choice: huonekana katika
  alternative: ni katika
  rationale: Tafsiri kuu inaeleza kwa Kiswahili cha kawaida kwamba tunda linajidhihirisha katika sifa hizi, huku tanbihi ikihifadhi muundo ulio karibu zaidi na Kiyunani.
translation_notes:
