lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaonyesha sababu au msingi wa kauli iliyotangulia; ‘kwa sababu’ ni Kiswahili cha kawaida na huhifadhi maana ya kisababishi.
- source_word: μέλη
  choice: viungo
  rationale: Neno hili humaanisha sehemu zinazounda mwili. ‘Viungo’ huhifadhi taswira ya mwili na maana yake ya kijumuiya katika muktadha huu.
- source_word: ἐσμὲν
  choice: sisi ni
  rationale: Ni kitenzi cha wakati uliopo; kiwakilishi ‘sisi’ kimewekwa wazi kwa msisitizo wa kawaida na uwazi katika Kiswahili.
- source_word: σώματος
  choice: mwili
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, inayohifadhi taswira ya waamini kuwa mwili wa Kristo.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi hiki kinamrejelea Kristo katika muktadha; ‘wake’ ni umbo la asili la Kiswahili linalopatana na nomino ‘mwili’.
theological_decisions:
- issue: Iwapo kujumuisha usomaji mrefu wa baadhi ya hati, ‘wa nyama yake na wa mifupa yake’
  choice: 'Kutafsiri maandishi ya SBLGNT pekee katika matini kuu: ‘kwa sababu sisi ni viungo vya mwili wake.’'
  alternative: kwa sababu sisi ni viungo vya mwili wake, vya nyama yake na vya mifupa yake
  rationale: Chanzo kilichotolewa kina usomaji mfupi. Usomaji mrefu umehifadhiwa katika tanbihi kama tofauti ya maandishi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa urahisi. Muundo ‘viungo vya mwili wake’ huhifadhi taswira ya Paulo bila kuifafanua kupita kiasi.
