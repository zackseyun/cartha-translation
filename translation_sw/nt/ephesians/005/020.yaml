lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: mkimshukuru
  rationale: Kitenzi endelevu cha wingi kinaendeleza mfululizo wa maelekezo katika muktadha; “mkimshukuru” ni Kiswahili cha kawaida na hudumisha muundo wa kishiriki.
- source_word: πάντοτε
  choice: daima
  rationale: Huwasilisha kwa ufupi maana ya kutenda jambo nyakati zote.
- source_word: ὑπὲρ πάντων
  choice: kwa ajili ya mambo yote
  rationale: πάντων inaweza kurejelea vitu/mambo au watu; katika muktadha huu maana pana ya mambo na hali zote ndiyo inayofaa zaidi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: ἐν ὀνόματι
  choice: katika jina
  rationale: Hudumisha nahau ya kibiblia na kuacha maana yake ya uwakilishi au upatanishi itokane na muktadha.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye heshima ya cheo hiki cha Yesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός ina nguvu ya cheo hapa; “Masihi” hutafsiri maana yake, na “Kristo” imehifadhiwa kama njia ya jadi katika tanbihi.
- source_word: τῷ θεῷ καὶ πατρί
  choice: Mungu aliye Baba
  rationale: Dativu humtaja mpokeaji wa shukrani. Muundo huu unaonyesha wazi kwamba Mungu ndiye Baba bila kudokeza wapokeaji wawili.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno linafanya kazi kama cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huonyesha maana hiyo, huku “Kristo” ikiwa namna ya jadi ya kulitaja.
- issue: Uhusiano wa θεῷ καὶ πατρί
  choice: Mungu aliye Baba
  alternative: Mungu na Baba
  rationale: Kifungu cha Kigiriki humwelekezea shukrani mhusika mmoja, Mungu ambaye ni Baba; tafsiri iliyochaguliwa huepuka kusikika kana kwamba ni wahusika wawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio unafuata mtiririko wa Kigiriki kwa njia ya asili katika Kiswahili. Alama zote za tanbihi zimewekwa baada ya kifungu kinachohusika.
