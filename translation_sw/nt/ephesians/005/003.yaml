  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: sw
  text: Lakini uasherati na uchafu wa aina yoyote au uchoyo visitajwe hata kidogo miongoni mwenu[a], kama inavyowafaa watu watakatifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yasitajwe hata miongoni mwenu.”
    reason: lexical_alternative
  - marker: b
    text: “Watu watakatifu” hapa ni waamini kama watu wa Mungu waliowekwa wakfu kwake, si kundi maalumu lililotangazwa kuwa watakatifu baadaye.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: uasherati
  rationale: Katika matumizi ya Agano Jipya, neno hili linahusu kwa upana mwenendo wa ngono usio halali; ‘uasherati’ ni neno la kawaida na lenye heshima katika Kiswahili cha Biblia, ingawa linaweza kueleweka kwa maana nyembamba katika baadhi ya mazingira.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha mpito wenye utofautishaji mdogo na mawaidha yaliyotangulia.
- source_word: ἀκαθαρσία πᾶσα
  choice: kila aina ya uchafu
  rationale: Huhifadhi upana unaosisitizwa na πᾶσα na ni usemi wa asili katika Kiswahili; katika muktadha huu ‘uchafu’ una maana ya kimaadili.
- source_word: ἢ
  choice: au
  rationale: Huhifadhi kiunganishi cha uchaguzi kilicho wazi katika Kigiriki.
- source_word: πλεονεξία
  choice: tamaa ya mali
  rationale: Hueleza tamaa ya kujipatia zaidi kwa uchoyo bila kuifinya kuwa tamaa ya kingono pekee; neno ‘mali’ linaweka wazi maana ya uchu wa kupata vitu zaidi.
- source_word: μηδὲ ὀνομαζέσθω
  choice: visitajwe hata kidogo
  rationale: Wingi wa vitenzi unafuata orodha ya mambo katika Kiswahili, huku usemi huu ukihifadhi katazo lenye msisitizo la ‘hata’ katika Kigiriki.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Hurejelea maisha ya jumuiya ya waamini, si hali ya ndani ya mtu mmoja.
- source_word: καθὼς πρέπει
  choice: kama inavyowafaa
  rationale: Huonyesha kile kinacholingana na hadhi na mwenendo unaotarajiwa wa wahusika.
- source_word: ἁγίοις
  choice: watu watakatifu
  rationale: Huwatambulisha waamini wote kuwa watu waliowekwa wakfu kwa Mungu, na huepuka dhana ya kundi maalumu lililotangazwa kuwa watakatifu baadaye.
theological_decisions:
- issue: Maana ya πλεονεξία katika orodha inayohusisha dhambi za kingono
  choice: tamaa ya mali kwa maana pana ya uchoyo
  alternative: tamaa ya kingono isiyotosheka
  rationale: Ingawa muktadha unahusu maadili ya kingono, neno lenyewe lina maana pana katika matumizi ya Paulo; tafsiri haipaswi kulifinya bila ushahidi wa wazi wa kifungu.
- issue: Wanaorejelewa na ἁγίοις
  choice: waamini wote kama watu watakatifu
  alternative: watakatifu kama kundi maalumu lililotambuliwa baadaye
  rationale: Katika matumizi ya Paulo, jina hili huwahusu watu wa Mungu waliowekwa wakfu kwake, wala si tabaka la waamini waliotangazwa rasmi baada ya kifo.
- issue: Maana ya katazo la μηδὲ ὀνομαζέσθω
  choice: 'mambo hayo yasiwe sehemu inayotambulisha maisha ya jumuiya, yakielezwa kwa usemi wa karibu na maandishi: visitajwe hata kidogo'
  alternative: marufuku kamili ya kuyataja hata kwa kuyakemea au kuyafundisha
  rationale: Katazo lina nguvu, lakini halipaswi kufasiriwa kuwa linazuia kabisa kuyazungumzia kwa kusudi la maonyo; kifungu chenyewe kinayataja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Uasherati’ limetumiwa kwa maana pana ya mwenendo wa ngono usio halali; ‘watu watakatifu’ ni wazi zaidi katika Kiswahili cha sasa kuliko istilahi ya pekee ‘watakatifu’. Muundo wa orodha na msisitizo wa katazo umehifadhiwa kwa lugha ya asili.
