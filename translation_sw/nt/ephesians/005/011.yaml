  - marker: b
    text: Au, “yakemeeni” au “onyesheni kuwa ni mabaya.” Neno la Kigiriki linaweza kuhusisha kukemea kwa maneno, lakini katika muktadha huu pia lina maana ya kuyafanya matendo hayo yaonekane wazi.
