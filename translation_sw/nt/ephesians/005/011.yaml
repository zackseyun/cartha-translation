lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: msishiriki katika
  rationale: Kitenzi hiki humaanisha kushiriki pamoja katika jambo fulani. ‘Kushiriki katika’ ni Kiswahili cha sasa na cha kawaida kinachoonyesha kuhusika kwa vitendo.
- source_word: ἔργοις
  choice: matendo
  rationale: ‘Matendo’ ni tafsiri ya kawaida na ya asili katika muktadha wa mwenendo wa kimaadili, huku ikidumisha maana ya mambo yanayotendwa.
- source_word: ἀκάρποις
  choice: yasiyozaa matunda
  rationale: Kauli hii inadumisha sitiari ya kilimo iliyomo katika Kigiriki na inaeleweka kwa urahisi katika Kiswahili.
- source_word: σκότους
  choice: ya giza
  rationale: Muundo huu unadumisha uhusiano wa kijina bila kuamua kupita kiasi ikiwa matendo hayo ni ya giza, yanafanywa gizani, au ni sehemu ya eneo la kimaadili linaloitwa giza.
- source_word: μᾶλλον δὲ καὶ
  choice: bali
  rationale: Katika Kiswahili, ‘bali’ huonyesha kwa asili tofauti kali kati ya kutoshiriki na hatua chanya inayofuata. Nguvu ya ‘badala yake, hata’ inaeleweka katika mpangilio wa amri bila kuongeza maneno mazito yasiyo ya lazima.
- source_word: ἐλέγχετε
  choice: myafichue
  rationale: Katika muktadha wa nuru na giza, neno hili lina maana ya kuyafanya matendo maovu yaonekane wazi, huku pia likiweka uwezekano wa kuyakemea au kuyasahihisha.
theological_decisions:
- issue: Maana ya ἐλέγχετε kuhusiana na matendo maovu
  choice: myafichue
  alternative: myakemee / myathibitishe kuwa ni mabaya
  rationale: Muktadha wa Waefeso 5:8–13 unasisitiza nuru inayofanya mambo yaonekane. ‘Myafichue’ inadumisha picha hiyo bila kuzuia maana ya maonyo au masahihisho ya kimaadili.
- issue: Nguvu ya tofauti kati ya amri mbili
  choice: msishiriki ... bali myafichue
  alternative: msishirikiane ... bali hata myakemee
  rationale: Tafsiri inadumisha amri ya kujiepusha na matendo hayo pamoja na wajibu wa kuyakabili kwa kuyadhihirisha, bila kutaja mbinu maalumu ambayo Kigiriki hakijaweka wazi.
translation_notes:
