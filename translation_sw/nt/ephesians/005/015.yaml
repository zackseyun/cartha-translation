  text: Βλέπετε οὖν ⸂ἀκριβῶς πῶς⸃ περιπατεῖτε, μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: sw
  text: Basi, angalieni kwa makini jinsi mnavyoenenda[a]—si kama wasio na hekima, bali kama wenye hekima—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jinsi mnavyoishi.” Kigiriki kinasema kwa maana halisi “jinsi mnavyotembea,” kikitumia kutembea kama mfano wa namna ya kuishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: angalieni
  rationale: Kitenzi hiki ni agizo la nafsi ya pili wingi na kinahimiza usikivu wa makusudi; “angalieni” huhifadhi nguvu ya agizo na kinaendana vizuri na “kwa makini.”
- source_word: οὖν
  choice: Basi
  rationale: “Basi” huonyesha hitimisho au matokeo yanayotokana na hoja iliyotangulia, kwa lugha ya kawaida na yenye heshima.
- source_word: ἀκριβῶς πῶς
  choice: kwa makini jinsi
  rationale: “Kwa makini” huonyesha uangalifu unaodaiwa na ἀκριβῶς, huku “jinsi” ikianzisha maelezo ya namna ya mwenendo.
- source_word: περιπατεῖτε
  choice: mnavyoenenda
  rationale: “Kuenda/kuenenda” huhifadhi sitiari ya Kigiriki ya kutembea kama namna ya maisha. “Kuenenda” ni ya heshima na inaeleweka katika muktadha huu, bila kuibadili moja kwa moja kuwa “kuishi.”
- source_word: μὴ ὡς ἄσοφοι
  choice: si kama wasio na hekima
  rationale: Huhifadhi ulinganisho wa ὡς na maana ya ἄσοφοι kuwa kutokuwa na hekima, bila kuongeza nomino ya kijinsia ambayo haijahitajika katika Kiswahili.
- source_word: ἀλλ’ ὡς σοφοί
  choice: bali kama wenye hekima
  rationale: Huhifadhi ulinganifu na utofautishaji wa moja kwa moja kati ya wasio na hekima na wenye hekima.
theological_decisions:
- issue: Maana ya sitiari ya περιπατεῖτε
  choice: Kuhifadhi sitiari kwa “mnavyoenenda” katika matini kuu
  alternative: “jinsi mnavyoishi”
  rationale: Sitiari ya mwenendo kama kutembea ni muhimu katika waraka huu na inaweza kuhifadhiwa kwa Kiswahili kinachoeleweka; tanbihi inaeleza maana yake bila kuondoa picha ya asili.
- issue: Maumbo ya wingi ἄσοφοι / σοφοί
  choice: “wasio na hekima ... wenye hekima”
  alternative: “watu wasio na hekima ... watu wenye hekima”
  rationale: Maumbo haya yanawahusu waamini wote wanaoambiwa, na Kiswahili kinaweza kuyatumia kwa ujumla bila kuingiza tofauti ya kijinsia isiyodaiwa na maana ya kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mnavyoenenda” kimetumiwa kuhifadhi sitiari ya asili; maneno yanayozunguka yanaifanya maana iwe wazi kwa msomaji wa kawaida.
