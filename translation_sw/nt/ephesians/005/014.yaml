review_pass:
  verdict: revise
  source_fidelity: The principal correction needed is ἀνάστα. “Ufufuke” specifically denotes being raised/resurrected and thus narrows the imperative beyond the Greek “rise/get up,” whereas “inuka” retains the deliberately resonant but unexplicated wording. The impersonal citation formula is better represented by “inasema” than by the subjectless habitual “husema.”
  naturalness: “Kwa hiyo husema” is not idiomatic as an impersonal quotation introduction in contemporary Standard East African Swahili. “Kwa hiyo, inasema:” is natural and, like Greek λέγει, does not identify the speaker or source. The revised lineation remains suitably elevated and clear.
  terminology: “Nuru,” “Masihi,” and “atakuangazia” are appropriate. “Masihi” properly renders the titular force of ὁ Χριστός without requiring an article in Swahili. “Kutoka miongoni mwa wafu” accurately preserves the collective expression ἐκ τῶν νεκρῶν.
  issues:
  - severity: medium
    issue: “Ufufuke” over-specifies ἀνάστα.
    rationale: The Greek imperative means “rise” or “get up.” In this poetic exhortation it may evoke resurrection, but it does not explicitly state that the sleeper is being resurrected. “Inuka” preserves that ambiguity.
  - severity: medium
    issue: “Kwa hiyo husema” is an unnatural and grammatically underdetermined citation formula.
    rationale: The unmarked habitual form husema normally calls for an understood personal subject and does not naturally convey English/Greek impersonal “it says.” “Inasema” supplies the normal impersonal formula while leaving the source unspecified.
  - severity: low
    issue: Footnote a does not foreground the meaningful alternative “exposed/revealed.”
    rationale: The current base wording already closely overlaps “kuwekwa wazi.” Revising the alternative to “kinachofichuliwa” more clearly records the lexical ambiguity of φανερούμενον.
  revised_text: 'Kwa maana kila kitu kinachowekwa wazi ni nuru.[a] Kwa hiyo, inasema:


    “Amka, wewe uliyelala,


    inuka kutoka miongoni mwa wafu,[c]


