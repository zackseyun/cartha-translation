base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: sw
  text: 'Kwa maana kila kitu kinachowekwa wazi ni nuru.[a] Kwa hiyo, inasema:


    “Amka, wewe uliyelala,


    inuka kutoka miongoni mwa wafu,[c]


    na Masihi[b] atakuangazia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kitu kinachofichuliwa ni nuru.” Neno la Kigiriki linaweza kumaanisha kuwekwa wazi, kufichuliwa, au kufanywa kionekane.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu Χριστός linatumika kama cheo.
    reason: alternative_reading
  - marker: c
    text: Chanzo cha maneno haya yaliyonukuliwa hakijulikani kwa hakika. Huenda yanaakisi mada za Maandiko, hasa Isaya 60:1, au wimbo wa Wakristo wa awali.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν
  choice: kila kitu
  rationale: Umbo la kati la umoja pamoja na kirai cha kisifa lina maana ya jumla; “kila kitu” huhifadhi upana huo bila kulazimisha kwamba wanaorejelewa ni watu pekee.
- source_word: φανερούμενον
  choice: kinachowekwa wazi
  rationale: Kitenzi hiki cha kutendwa kinaweza kumaanisha kufanywa kionekane au kufichuliwa. “Kuwekwa wazi” kinaendana na muktadha wa nuru kufichua mambo, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: φῶς
  choice: nuru
  rationale: Huhifadhi taswira ya nuru bila kuifafanua kitheolojia.
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na kauli iliyotangulia kwa Kiswahili cha kawaida.
- source_word: λέγει
  choice: husema
  rationale: Kiima hakikutajwa katika Kigiriki. Kiswahili “husema” huacha chanzo cha maneno hayo wazi badala ya kukitambulisha kuwa Maandiko, Mungu, au wimbo.
- source_word: Ἔγειρε
  choice: Amka
  rationale: Ni amri ya moja kwa moja kwa mtu aliyelala na huhifadhi sitiari kwa lugha ya sasa.
- source_word: ὁ καθεύδων
  choice: wewe uliyelala
  rationale: Hutoa kwa kawaida nguvu ya mwito wa kirai cha Kigiriki kinachomaanisha ‘anayelala.’
- source_word: ἀνάστα
  choice: ufufuke
  rationale: Katika ulinganifu na “kutoka miongoni mwa wafu,” “ufufuke” huhifadhi mwangwi wa kuamka kutoka kifo, wa kimwili au wa kisitiari.
- source_word: ἐκ τῶν νεκρῶν
  choice: kutoka miongoni mwa wafu
  rationale: Huonyesha wazi maana ya kutoka katikati ya walio wafu na ni ya asili katika muktadha wa kufufuka.
- source_word: ἐπιφαύσει
  choice: atakuangazia
  rationale: Huhifadhi taswira ya nuru inayomwangazia mtu, bila kuibadili kuwa ufafanuzi wa kiroho.
- source_word: ὁ Χριστός
  choice: Masihi
  rationale: Neno Χριστός linafanya kazi kama cheo hapa. “Masihi” huwasilisha maana ya cheo hicho kwa Kiswahili, badala ya kulitumia kama jina tu.
theological_decisions:
- issue: Chanzo cha maneno yaliyonukuliwa
  choice: husema
  alternative: Maandiko yasema; Mungu asema; yasemwa katika wimbo
  rationale: Kigiriki hakimtaji msemaji wala chanzo. Tafsiri inaacha wazi kama maneno haya yanaakisi Maandiko au wimbo wa Wakristo wa awali.
- issue: Uwasilishaji wa Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Kibainishi cha Kigiriki na muktadha vinaunga mkono matumizi ya neno hili kama cheo. “Masihi” huhifadhi maana ya cheo bila kuingiza msimamo mwingine wa kimadhehebu.
- issue: Maana ya kuamka kutoka kwa wafu
  choice: ufufuke kutoka miongoni mwa wafu
  alternative: inuka kutoka miongoni mwa wafu
  rationale: “Ufufuke” huhifadhi mwangwi wa ufufuo unaotokana na ἐκ τῶν νεκρῶν, lakini tafsiri haielezi ikiwa mwito huo ni wa kiroho, wa kisitiari, au una mwangwi mpana wa ufufuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi wa nukuu umehifadhiwa. “Husema” kimakusudi hakitambulishi chanzo, na “Masihi” linatumika kama cheo.
