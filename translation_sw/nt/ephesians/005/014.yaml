  rationale: The revision removes an unnecessary resurrection-specific interpretation from the command to rise, improves the naturalness of the impersonal quotation formula, and makes the lexical-alternative note more useful. It preserves the source’s ambiguity concerning the quotation’s origin and retains the title “Masihi.”
