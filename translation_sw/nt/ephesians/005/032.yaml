  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: sw
  text: Siri hii ni kubwa,[a] lakini mimi ninasema kuhusu Masihi na kanisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Siri hii ni ya maana sana.” Kigiriki husema moja kwa moja “kubwa,” neno ambalo linaweza kuonyesha ukubwa au umuhimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: siri
  rationale: Katika matumizi ya Paulo, neno hili humaanisha kweli ya Mungu iliyokuwa imefichwa na sasa imefunuliwa; “siri” ni neno la kawaida na lenye uzito unaofaa katika Kiswahili.
- source_word: μέγα
  choice: kubwa
  rationale: Hili ndilo neno la moja kwa moja linalohifadhi uwezekano wa maana ya ukubwa au umuhimu bila kulifasiri tu kuwa kina cha fikra.
- source_word: δὲ
  choice: lakini
  rationale: Huonyesha tofauti nyepesi au mpito kuelekea ufafanuzi wa Paulo.
- source_word: λέγω
  choice: ninasema
  rationale: Huhifadhi hali ya wakati wa sasa na nguvu ya kitenzi bila kutumia tafsiri ya kifafanuzi zaidi kama “ninamaanisha.”
- source_word: εἰς
  choice: kuhusu
  rationale: Baada ya λέγω, hapa huonyesha jambo linalorejelewa; “kuhusu” ni la asili na wazi katika Kiswahili.
- source_word: Χριστόν
  choice: Masihi
  rationale: Χριστός hapa linafanya kazi kama cheo, kwa hiyo “Masihi” huhifadhi maana yake ya msingi.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Katika muktadha huu wa Paulo, neno hili hurejelea jumuiya ya watu wa Mungu; “kanisa” ndilo neno la kawaida na linalofaa zaidi.
theological_decisions:
- issue: Kirejelewa cha “siri hii” katika ulinganisho wa ndoa, Masihi, na kanisa
  choice: Kauli imetafsiriwa moja kwa moja bila kubainisha kama siri ni ndoa yenyewe, Mwanzo 2:24, au uhusiano wa kiishara unaotimizwa katika Masihi na kanisa.
  alternative: Siri inaweza kueleweka hasa kuwa muungano wa mwili mmoja katika ndoa, nukuu ya Mwanzo 2:24, au maana ya ndoa inayoelekeza kwa Masihi na kanisa.
  rationale: Kigiriki kinasema tu kwamba siri hii ni kubwa, kisha Paulo anaeleza kuwa anasema kuhusu Masihi na kanisa. Tafsiri inapaswa kuhifadhi mwendo huo wa maelezo bila kuamua kwa lazima mojawapo ya tafsiri hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kuondoa utata halisi wa kifungu.
