  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: sw
  text: Kwa maana zamani mlikuwa giza, lakini sasa ninyi ni nuru katika Bwana. Enendeni[a] kama watoto wa nuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufafanua zaidi, “Ishieni kama watoto wa nuru.” Kigiriki kinasema “enendeni,” tamathali ambayo Paulo huitumia mara nyingi kumaanisha namna ya kuishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: mlikuwa
  rationale: Wakati uliopita wa εἰμί unaonyesha hali yao ya zamani; “mlikuwa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa msingi wa maelezo kwa himizo lililotangulia; “kwa maana” kinahifadhi uhusiano huo.
- source_word: ποτε
  choice: zamani
  rationale: Katika muktadha huu neno linaonyesha hali ya wakati uliopita inayotofautishwa na hali ya sasa.
- source_word: σκότος
  choice: giza
  rationale: 'Nomino imetumiwa kama kiarifu: Paulo hasemi kwamba walikuwa tu gizani, bali kwamba walikuwa giza. Muundo huu mkali umehifadhiwa.'
- source_word: νῦν δὲ
  choice: lakini sasa
  rationale: Maneno haya yanaweka tofauti wazi kati ya hali yao ya zamani na hali yao ya sasa.
- source_word: φῶς
  choice: nuru
  rationale: Kama ilivyo kwa “giza,” nomino hii ni kiarifu na inadumisha lugha ya utambulisho badala ya kuibadili kuwa “katika nuru.”
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi wazo la kuwa katika uhusiano au umoja na Bwana bila kulifanya liwe wazi zaidi ya Kigiriki.
- source_word: ὡς
  choice: kama
  rationale: Hueleza mwenendo unaolingana na utambulisho wao kuwa watoto wa nuru.
- source_word: τέκνα φωτός
  choice: watoto wa nuru
  rationale: τέκνα inawahusu watoto bila kubainisha jinsia; muundo “wa nuru” unahifadhi tamathali ya Kigiriki.
- source_word: περιπατεῖτε
  choice: Enendeni
  rationale: Kitenzi hiki ni amri ya sasa na kinatumia tamathali ya kawaida ya Paulo ya kutembea kwa maana ya namna ya kuishi. “Enendeni” kinahifadhi tamathali hiyo kwa lugha ya Biblia iliyoeleweka.
theological_decisions:
- issue: Lugha ya utambulisho katika “mlikuwa giza, lakini sasa ninyi ni nuru”
  choice: Kuhifadhi nomino “giza” na “nuru” kama viarifu
  alternative: “mlikuwa gizani, lakini sasa mko nuruni” au “mlikuwa wenye giza, lakini sasa mmeangaziwa”
  rationale: Kigiriki kinatumia nomino za kiarifu bila vihusishi, na hivyo kusisitiza mabadiliko ya utambulisho na hali ya kimaadili na kiroho, si mazingira tu.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” huhifadhi matumizi na uzito wa kitheolojia wa neno hili katika Agano Jipya bila kulipunguza kuwa cheo cha kijamii pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Enendeni” limechaguliwa ili kuhifadhi tamathali ya kutembea; tanbihi inatoa maana yake ya wazi ya kimaisha.
