  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: sw
  text: Enyi waume, wapendeni wake zenu, kama vile Masihi[a] naye alivyolipenda kanisa na alivyojitoa kwa ajili yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “alivyojikabidhi kwa ajili yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες
  choice: Enyi waume
  rationale: Katika muktadha wa mafundisho kuhusu ndoa na kwa kuwa neno hili linaambatana na γυναῖκας, linamaanisha waume waliooa, si wanaume kwa ujumla. “Enyi” huonyesha kwa kawaida mwito wa moja kwa moja.
- source_word: ἀγαπᾶτε
  choice: wapendeni
  rationale: Hii ni amri ya wingi. Kitenzi “penda” ni cha kawaida na huhifadhi uhusiano wa kileksika na ἠγάπησεν baadaye katika mstari.
- source_word: γυναῖκας
  choice: wake zenu
  rationale: Katika muktadha huu γυναῖκας humaanisha wake. “Zenu” huweka wazi uhusiano unaodokezwa na mwito kwa waume.
- source_word: καθὼς καὶ
  choice: kama vile ... naye
  rationale: Muundo huu unaonyesha kwamba upendo wa Masihi ndio mfano wa kuigwa, huku “naye” ikiwakilisha nguvu ya nyongeza ya καί kwa Kiswahili cha asili.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Χριστός hapa ina kibainishi na inafanya kazi kama cheo. “Masihi” huhifadhi maana ya cheo hicho; “Kristo” limetolewa kama namna nyingine iliyozoeleka.
- source_word: ἠγάπησεν
  choice: alivyolipenda
  rationale: Wakati uliopita huwasilisha tendo la upendo, na mzizi “penda” huhifadhi ulinganifu na amri “wapendeni.” Kiambishi “-li-” hurejelea kanisa kwa kawaida katika Kiswahili.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Hapa neno hili linamaanisha jumuiya ya watu wa Mungu kwa pamoja. “Kanisa” ndilo neno la Kiswahili lililo wazi na lililozoeleka katika muktadha huu.
- source_word: ἑαυτὸν παρέδωκεν
  choice: alivyojitoa
  rationale: “Kujitoa” huonyesha kujikabidhi mwenyewe kwa hiari bila kuongeza maelezo ya kiteolojia yasiyotajwa moja kwa moja katika kishazi.
- source_word: ὑπὲρ αὐτῆς
  choice: kwa ajili yake
  rationale: Huwasilisha maana ya kutenda kwa faida au niaba ya kanisa. “Yake” hurejelea kanisa bila kulilazimisha kuwa na jinsia ya kike kama ilivyo katika sarufi ya Kigiriki.
theological_decisions:
- issue: Namna ya kutafsiri Χριστός katika ulinganisho wa ndoa na kanisa
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huhifadhi maana ya Χριστός kama cheo katika kifungu hiki, huku tanbihi ikitambua “Kristo” kama tafsiri nyingine ya kawaida bila kuingiza msimamo wa dhehebu.
- issue: Kiwango cha maana ya kujitoa katika παρέδωκεν ὑπὲρ αὐτῆς
  choice: alivyojitoa kwa ajili yake
  alternative: alivyojikabidhi kwa ajili yake
  rationale: Tafsiri inaonyesha kujitoa kwa hiari kwa manufaa ya kanisa, lakini haiongezi istilahi maalumu kuhusu upatanisho ambazo hazipo wazi katika kishazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “Enyi waume” ni mwito wa moja kwa moja unaoeleweka kwa wasomaji wa kawaida; “naye” na marudio ya “alivyo-” huifanya sentensi iwe ya asili huku ikihifadhi ulinganifu na uratibu wa Kigiriki.
