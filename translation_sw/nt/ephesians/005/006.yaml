  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: sw
  text: Mtu yeyote asiwadanganye kwa maneno matupu. Kwa maana ghadhabu ya Mungu inawajia wana wa uasi kwa sababu ya mambo hayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu wenye sifa ya kutotii.
    reason: Ufafanuzi wa nahau “wana wa uasi,” ambayo humaanisha watu wanaotambulishwa na kutotii kwao.
lexical_decisions:
- source_word: Μηδεὶς ὑμᾶς ἀπατάτω
  choice: Mtu yeyote asiwadanganye
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida katazo la Kigiriki la kutoruhusu mtu yeyote awadanganye waamini.
- source_word: κενοῖς λόγοις
  choice: kwa maneno matupu
  rationale: Neno “matupu” linahifadhi sitiari ya maneno yasiyo na uzito, ukweli, au msingi, bila kuyafafanua kupita kiasi kuwa hoja.
- source_word: διὰ ταῦτα
  choice: kwa sababu ya mambo hayo
  rationale: Huwasilisha wazi maana ya kisababishi ya διά pamoja na hali ya kuelekeza nyuma kwa mambo yaliyotajwa katika muktadha.
- source_word: ἔρχεται
  choice: inawajia
  rationale: Wakati wa sasa wa Kigiriki umehifadhiwa bila kuamua kimakusudi ikiwa unasisitiza jambo la daima au linalokaribia; “inawajia” pia ni ya kawaida kuliko “inakuja juu yao.”
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ghadhabu ya Mungu
  rationale: “Ghadhabu” inalingana moja kwa moja na ὀργή na haiipunguzi kuwa hukumu kwa ujumla.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: wana wa uasi
  rationale: Muundo wa “wana wa” unahifadhi nahau ya Kigiriki/Kisemiti inayoonyesha watu wenye sifa fulani; “uasi” hapa huonyesha kukataa kutii, huku tanbihi ikifafanua maana ya nahau.
theological_decisions:
- issue: Lugha kuhusu ghadhabu ya Mungu
  choice: ghadhabu ya Mungu
  alternative: hukumu ya Mungu
  rationale: Chanzo kinatumia ὀργή, kwa hiyo tafsiri inahifadhi dhana mahususi ya ghadhabu ya Mungu badala ya kuilainisha kuwa hukumu kwa ujumla.
- issue: Nahau τοὺς υἱοὺς τῆς ἀπειθείας
  choice: wana wa uasi
  alternative: watu wasiotii
  rationale: Matini kuu inahifadhi taswira ya “wana,” huku tanbihi ikionyesha kwamba nahau hiyo inawahusu watu wanaotambulishwa na uasi wao; hivyo umbo na maana zote zinawakilishwa bila kuifanya kauli kuwa ya moja kwa moja kupita chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Maneno matupu” na “ghadhabu ya Mungu” huhifadhi sitiari na uzito wa chanzo, na “wana wa uasi” hudumisha nahau ya asili kwa ufafanuzi mfupi katika tanbihi.
