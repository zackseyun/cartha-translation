base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: sw
  text: Kwa maana[a] mume ni kichwa[b] cha mke, kama vile Masihi[c] pia ni kichwa cha kanisa, yeye mwenyewe ndiye Mwokozi wa mwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu.”
    reason: lexical_alternative
  - marker: b
    text: “Kichwa” huhifadhi sitiari ya Kigiriki. Inaeleweka kwa namna mbalimbali kuwa inahusu mamlaka, nafasi ya kwanza, au chanzo.
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki: “Kristo”; hapa limetafsiriwa “Masihi” kwa kuwa linatumika kama cheo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno linaanzisha sababu au ufafanuzi wa himizo lililotangulia; “Kwa maana” ni ya kawaida na huhifadhi nguvu hiyo ya kueleza msingi.
- source_word: ἀνήρ / γυνή
  choice: mume / mke
  rationale: Muktadha wa mafundisho kwa watu wa nyumbani unahusu wazi uhusiano wa ndoa, si mwanamume na mwanamke kwa ujumla.
- source_word: κεφαλή
  choice: kichwa
  rationale: Huhifadhi sitiari ya Kigiriki bila kuifafanua kwa namna yenye kulazimisha maana moja kati ya mamlaka, nafasi ya kwanza, au chanzo.
- source_word: ὡς καὶ
  choice: kama vile ... pia
  rationale: Huhifadhi muundo wa ulinganisho kati ya uhusiano wa mume na mke na ule wa Masihi na kanisa bila kudai kwamba mahusiano hayo yanafanana kwa kila jambo.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa neno linatumika kama cheo cha yule aliyetiwa mafuta; “Masihi” huonyesha maana hiyo wazi.
- source_word: ἐκκλησία
  choice: kanisa
  rationale: Katika muktadha huu wa Paulo linamaanisha jumuiya ya waamini, na “kanisa” ndilo neno la kawaida na linaloeleweka zaidi katika Kiswahili.
- source_word: αὐτός
  choice: naye mwenyewe ndiye
  rationale: Muundo huu wa Kiswahili huonyesha mkazo wa kiwakilishi na kumtambulisha Masihi mwenyewe kuwa Mwokozi.
- source_word: σωτήρ
  choice: Mwokozi
  rationale: Ni tafsiri ya kawaida inayobeba wazo la kuokoa au kukomboa katika muktadha huu.
- source_word: σῶμα
  choice: mwili
  rationale: Huhifadhi sitiari ya Paulo na muundo wa “Mwokozi wa mwili” bila kuongeza kiwakilishi cha umilikaji ambacho hakipo wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya κεφαλή katika ulinganisho wa mume na mke na wa Masihi na kanisa
  choice: Kuhifadhi sitiari kwa neno “kichwa”
  alternative: Kiongozi, mwenye mamlaka juu ya, au chanzo
  rationale: Maana mahususi ya sitiari hii inajadiliwa. Tafsiri haipaswi kuamua kimya-kimya mjadala huo kwa kutumia ufafanuzi mmoja wenye mipaka zaidi.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki lina nguvu ya cheo hapa; “Masihi” huhifadhi wazi maana ya yule aliyetiwa mafuta, huku tanbihi ikionyesha namna nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kusomeka, lakini sitiari za “kichwa” na “mwili” zimehifadhiwa. Mkazo wa αὐτός umeonyeshwa kwa “naye mwenyewe ndiye” bila kufanya kifungu cha mwisho kuwa kizito.
