id: EPH.5.27
reference: Ephesians 5:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: sw
  text: ili yeye mwenyewe ajiletee kanisa likiwa na utukufu[a], bila doa wala kunyanzi wala kitu chochote kama hivyo[b], bali liwe takatifu na lisilo na lawama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “lenye utukufu”: kivumishi cha Kigiriki kinaweza kueleza sifa ya kanisa au hali yake wakati linapoletwa.'
    reason: lexical_alternative
  - marker: b
    text: Au “wala kitu kingine cha aina hiyo.”
    reason: lexical_alternative
  - marker: c
    text: Au “lisilo na dosari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: ajiletee
  rationale: Kitenzi katika hali ya kusudi kinaonyesha kulileta au kulisimamisha kanisa mbele yake; muundo wa kujirejelea unahifadhi uhusiano na ἑαυτῷ kwa Kiswahili cha kawaida.
- source_word: αὐτὸς ἑαυτῷ
  choice: yeye mwenyewe ajiletee
  rationale: “Yeye mwenyewe” huhifadhi msisitizo wa αὐτός, na “ajiletee” huhifadhi nguvu ya kujirejelea ya ἑαυτῷ bila kuondoa taswira ya Kristo kulileta kanisa kwake mwenyewe.
- source_word: ἔνδοξον
  choice: likiwa na utukufu
  rationale: Hueleza hali ya kanisa wakati wa kuletwa. Pia inadumisha uwezekano wa kuelewa kivumishi hiki kama “lenye utukufu,” uliotajwa katika tanbihi.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Katika muktadha huu wa Paulo, neno hili linamaanisha jumuiya ya watu wa Mungu kwa pamoja; “kanisa” ndilo neno lililozoeleka na linalofaa kimuktadha.
- source_word: μὴ ἔχουσαν
  choice: bila
  rationale: Ingawa maana halisi ni “lisilo na,” “bila” ni ya kawaida na fasaha katika Kiswahili huku ikihifadhi hali hasi inayoelezwa na kishiriki.
- source_word: σπίλον
  choice: doa
  rationale: “Doa” huhifadhi taswira halisi ya alama au dosari na huendana vizuri na “kunyanzi.”
- source_word: ῥυτίδα
  choice: kunyanzi
  rationale: Ni kisawe cha moja kwa moja na cha kawaida kinachohifadhi taswira ya mwili au bibi-arusi.
- source_word: ἤ τι τῶν τοιούτων
  choice: wala kitu chochote kama hivyo
  rationale: Hupanua mifano iliyotajwa bila kufunga maana; ni Kiswahili cha kawaida kinacholingana na usemi wa Kigiriki.
- source_word: ἀλλ’ ἵνα ᾖ
  choice: bali liwe
  rationale: Huhifadhi utofautishaji na kusudi chanya la kishazi cha pili cha ἵνα; kiambishi “li-” kinarejelea kanisa kwa kawaida.
- source_word: ἁγία
  choice: takatifu
  rationale: Ni tafsiri sanifu yenye uzito wa kidini na kimaadili bila kuipunguza kuwa maelezo tu ya kutengwa.
- source_word: ἄμωμος
  choice: lisilo na lawama
  rationale: Huhifadhi maana ya kutokuwa na sababu ya kulaumiwa, huku tanbihi ikionyesha maana nyingine halali ya kutokuwa na dosari.
theological_decisions:
- issue: Taswira ya Kristo kujiletea kanisa
  choice: yeye mwenyewe ajiletee kanisa
  alternative: yeye mwenyewe alilete kanisa kwake mwenyewe
  rationale: Muundo uliochaguliwa unahifadhi msisitizo na urejelevu wa Kigiriki kwa Kiswahili cha asili, bila kuamua kama tukio hilo lielezwe wazi kuwa la mwisho wa nyakati au kuwa uwasilishaji mbele za Mungu.
- issue: Lugha ya usafi na ukamilifu wa kanisa
  choice: doa wala kunyanzi…takatifu na lisilo na lawama
  alternative: dosari wala kunyanzi…takatifu na lisilo na dosari
  rationale: Uamuzi huu huhifadhi kwa pamoja taswira halisi ya uzuri wa bibi-arusi na maana ya utakatifu au kutolaumika, bila kuifanya taswira kuwa ya kimaadili pekee au ya kafara pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yeye mwenyewe ajiletee” ni mfupi na wa kawaida, lakini bado huhifadhi msisitizo na urejelevu wa maandishi ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
