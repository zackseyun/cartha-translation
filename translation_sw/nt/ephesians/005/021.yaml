  text: mkijitiisha kila mmoja kwa mwenzake katika kumcha Masihi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kumheshimu Masihi” au “kwa kuwa na kicho kwa Masihi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Kristo”; hapa neno hili limetafsiriwa “Masihi” kwa kuwa Χριστός linatumika kama cheo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: mkijitiisha
  rationale: Kirai cha kitenzi cha wakati uliopo kinaendeleza mfululizo wa vitendo unaotegemea agizo lililotangulia. Kiswahili 'mkijitiisha' ni cha kawaida, huhifadhi uhusiano huo, na pamoja na 'ninyi kwa ninyi' huonyesha tendo la hiari bila kugeuza kirai kuwa agizo jipya.
- source_word: ἀλλήλοις
  choice: ninyi kwa ninyi
  rationale: Kiwakilishi hiki cha kutendeana katika hali ya dativu kinaonyesha uhusiano wa kila mmoja kwa mwenzake; 'ninyi kwa ninyi' ni tafsiri wazi na ya kawaida katika Kiswahili.
- source_word: ἐν
  choice: katika
  rationale: Hapa ἐν pamoja na φόβῳ inaonyesha mazingira au namna ya kujitiisha. 'Katika' huhifadhi muundo huo kwa Kiswahili cha asili.
- source_word: φόβῳ
  choice: kumcha
  rationale: φόβος inaweza kumaanisha hofu, uchaji, au kicho. 'Kumcha' ni usemi wa kawaida wa Kiswahili kwa hofu yenye uchaji mbele ya mwenye mamlaka, huku 'kwa hofu ya' ingeweza kusikika zaidi kama woga unaosababishwa na Masihi. Maana mbadala zimehifadhiwa katika tanbihi.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa inamtaja Yesu kwa cheo chake cha kifalme na kilichotiwa mafuta. 'Masihi' hutafsiri dhana ya cheo badala ya kuitoa kwa umbo la jadi 'Kristo'.
theological_decisions:
- issue: Maana ya φόβῳ Χριστοῦ
  choice: uchaji unaoelekezwa kwa Masihi
  alternative: hofu inayosababishwa na Masihi; kuwa na kicho kwa Kristo
  rationale: Uhusiano wa kawaida wa maneno haya unaeleweka kama kumcha Masihi, lakini muundo wa Kigiriki pekee hauondoi kabisa wazo la hofu inayotokana naye. 'Kumcha' huhifadhi uzito wa φόβος bila kuififisha kuwa heshima ya kawaida wala kuifanya iwe woga wa kitisho.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki, maana ya cheo cha Χριστός bado inaweza kusikika; kwa hiyo 'Masihi' imetumiwa katika matini kuu, huku umbo la jadi 'Kristo' likiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Aya imeachwa kama kirai kinachoendelea kutoka muktadha uliotangulia, kama ilivyo katika Kigiriki. 'Mkijitiisha' na 'ninyi kwa ninyi' ni wazi kwa wasomaji wa kawaida; 'kumcha' ni usemi wa kibiblia lakini bado ni wa kawaida na unaeleweka.
