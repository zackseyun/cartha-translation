lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi; “ili” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: αὐτὴν
  choice: amelisafisha
  rationale: Kiwakilishi cha kike cha umoja kinarejelea kanisa katika muktadha. Kiswahili hukiwakilisha kwa ngeli ya LI-YA katika kiambishi “-li-” badala ya kiwakilishi huru.
- source_word: ἁγιάσῃ
  choice: alifanye kuwa takatifu
  rationale: Muundo huu unaeleweka kwa urahisi na unahifadhi maana ya kumweka au kumfanya kuwa mtakatifu bila kulazimisha istilahi nzito ya kidhehebu.
- source_word: καθαρίσας
  choice: akiwa amelisafisha
  rationale: Huhifadhi muundo wa tendo shirikishi na kuonyesha tendo linalohusiana kwa karibu na kusudi la kumfanya kanisa kuwa takatifu; kiambishi cha yambwa “-li-” kinatokana na muktadha.
- source_word: τῷ λουτρῷ
  choice: kwa kuoshwa
  rationale: “Kwa” huonyesha njia au chombo, huku nomino-tendo “kuoshwa” ikitoa Kiswahili cha asili na kubaki karibu na taswira ya kuosha.
- source_word: τοῦ ὕδατος
  choice: kwa maji
  rationale: Hutoa uhusiano wa kuoshwa na maji kwa Kiswahili cha kawaida bila kutafsiri zaidi ya maandishi.
- source_word: ἐν ῥήματι
  choice: pamoja na neno
  rationale: “Pamoja na” huhifadhi kwa kiasi kizuri uwezekano wa maana ya njia au hali inayoambatana, bila kuamua kwamba neno pekee ndilo chombo.
- source_word: ῥήματι
  choice: neno
  rationale: ῥῆμα yaweza kumaanisha neno, tamko, au ujumbe. “Neno” huhifadhi upana na mwangwi wa istilahi hiyo bila kuibana kuwa ujumbe maalumu.
theological_decisions:
- issue: Uhusiano wa kusafishwa, kuoshwa kwa maji, na neno katika muktadha unaoweza kuwa wa ubatizo
  choice: Kudumisha taswira ya kuoshwa kwa maji pamoja na neno bila kutaja fundisho maalumu la kisakramenti.
  alternative: Kutafsiri waziwazi kuwa tendo la ubatizo lenye nguvu ya kisakramenti, au kuwa mfano tu usio wa kisakramenti.
  rationale: Maneno yanaibua sana taswira ya ubatizo, lakini Kigiriki chenyewe hakiamui kwa ukamilifu namna ya kueleza uhusiano huo kiteolojia.
- issue: Maana mahsusi ya ῥήματι
  choice: Kutumia “neno” katika maandishi makuu.
  alternative: “ujumbe,” “tamko,” au “neno la Injili.”
  rationale: Muktadha unaweza kuelekeza kwenye ujumbe unaotangazwa, lakini istilahi ya Kigiriki ni pana zaidi; “neno” huepuka kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “alifanye kuwa takatifu” umechaguliwa kwa uwazi; “pamoja na neno” huhifadhi utata wa ἐν ῥήματι. Alama za tanbihi zimewekwa katika maandishi makuu, huku mpangilio [c][b] ukihifadhi uhusiano wake na vipashio husika.
