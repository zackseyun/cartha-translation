  terminology: '"Alitakase" appropriately renders ἁγιάσῃ and maintains the church’s feminine singular reference through the object marker -li-. "Neno" remains suitably broad for ῥήματι. "Pamoja na neno" leaves the relation of the word to the washing open and does not impose a sacramental interpretation.'
