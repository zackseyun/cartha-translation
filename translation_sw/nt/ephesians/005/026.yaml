  - severity: medium
    issue: Passive "kuoshwa" obscures the instrumental washing
    rationale: τῷ λουτρῷ denotes the washing/bath by which cleansing occurs. "Kwa kuoshwa" normally means 'by being washed' and leaves the agent/action relationship unclear. "Kwa kuosha kwa maji" naturally expresses washing with water without over-specifying theology.
