  text: testing what is pleasing to the Lord;[a]
translation:
  language: sw
  text: mkichunguza ni nini kinachompendeza Bwana;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkitambua” au “mkihakikisha” ni nini kinachompendeza Bwana.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: mkichunguza
  rationale: Kitenzi hiki cha wakati uliopo kinaendeleza mtiririko wa mawaidha na kuonyesha tendo endelevu la kuchunguza au kupima ili kutambua jambo linalofaa. “Mkichunguza” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kutathmini bila kufafanua kupita kiasi.
- source_word: τί
  choice: ni nini
  rationale: 'Hutambulisha swali lisilo la moja kwa moja: “ni nini kinachompendeza.” Huu ni usemi wa asili katika Kiswahili cha sasa.'
- source_word: ἐστιν
  choice: ni
  rationale: Ni kiunganishi sahili cha kisarufi; hakihitaji kupanuliwa.
- source_word: εὐάρεστον
  choice: kinachompendeza
  rationale: Huwasilisha kwa lugha ya kawaida jambo linalopendeza au kukubalika kwa mhusika, huku ikihifadhi maana ya kimahusiano kuliko “kinachokubalika” pekee.
- source_word: τῷ κυρίῳ
  choice: Bwana
  rationale: Dativu imewasilishwa ndani ya kitenzi cha Kiswahili “kinachompendeza Bwana.” Jina la cheo κύριος limetafsiriwa “Bwana” bila kuongeza ikiwa ni Yesu au Mungu.
theological_decisions:
- issue: Mhusika anayerejelewa na κύριος
  choice: Bwana
  alternative: Bwana Yesu; Mungu
  rationale: Maandishi ya Kigiriki yanatumia cheo κύριος bila ufafanuzi. Tafsiri inadumisha cheo hicho na haiongezi utambulisho ambao mstari wenyewe hautaji wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umbo “mkichunguza” linaungana na mtiririko wa sentensi inayotangulia; “kinachompendeza Bwana” ni la asili na linaeleweka kwa urahisi.
