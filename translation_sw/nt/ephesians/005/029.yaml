  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: sw
  text: Kwa maana hakuna mtu aliyewahi kuuchukia mwili wake mwenyewe[a]; badala yake, hulisha na kuutunza kwa upendo, kama vile Masihi[b] naye anavyolilisha na kulitunza kanisa.
  philosophy: optimal-equivalence
  footnotes:
