lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: Kwa maana hakuna mtu aliyewahi
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kutoa msingi wa kauli iliyotangulia, na “hakuna mtu aliyewahi” huwasilisha kwa Kiswahili cha kawaida msisitizo wa οὐδεὶς ... ποτε.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: mwili wake mwenyewe
  rationale: Ingawa σάρξ kwa msingi ni “nyama,” hapa inamaanisha mwili wa mtu mwenyewe. “Mwili” ni ya asili na yenye hadhi katika Kiswahili, bila kudokeza nyama ya kuliwa au maana ya kimaadili ya asili yenye dhambi.
- source_word: ἐμίσησεν
  choice: kuuchukia
  rationale: Hutoa maana ya kawaida na yenye nguvu ya μισέω huku kiambishi “u-” kikirejelea “mwili.”
- source_word: ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν
  choice: badala yake, huulisha na kuutunza kwa upendo
  rationale: “Badala yake” huonyesha utofautishaji wa ἀλλά. “Huulisha” hutoa maana ya ἐκτρέφει, na “kuutunza kwa upendo” huonyesha utunzaji wa upole unaokusudiwa na θάλπει kuliko tafsiri yake ya msingi ya kuupa joto.
- source_word: καθὼς καὶ
  choice: kama vile ... naye
  rationale: Muundo huu wa Kiswahili huhifadhi ulinganisho wa καθώς na nguvu ya nyongeza ya καί.
- source_word: ὁ Χριστὸς
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Aliyetiwa Mafuta. “Masihi” huhifadhi maana ya cheo hicho; “Kristo” limewekwa kama chaguo la kawaida katika tanbihi.
- source_word: τὴν ἐκκλησίαν
  choice: kanisa
  rationale: Katika muktadha huu ἐκκλησία linamaanisha jumuiya ya waamini kwa pamoja; “kanisa” ndilo neno la kawaida na linaloeleweka katika Kiswahili.
theological_decisions:
- issue: Maana ya σάρξ katika mfano wa mwili
  choice: mwili wake mwenyewe
  alternative: nyama yake mwenyewe
  rationale: Muktadha unahusu nafsi ya kimwili ya mtu katika mfano wa ndoa, si “asili yenye dhambi.” “Mwili” hutoa maana hiyo kwa uwazi huku tanbihi ikihifadhi umbo la msingi la Kigiriki.
- issue: Uwasilishaji wa Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno lenye kibainishi hapa linafanya kazi kwa uwazi kama cheo. “Masihi” huhifadhi maana ya cheo, huku “Kristo” likibaki chaguo la kimapokeo.
- issue: Vitenzi vinavyoeleweka katika kishazi cha mwisho
  choice: anavyolilisha na kulitunza kanisa
  alternative: anavyolifanyia kanisa
  rationale: Kigiriki kinaacha vitenzi vya kishazi kilichotangulia vieleweke mbele ya “kanisa.” Kuvitaja tena kwa Kiswahili kunafanya sentensi iwe ya asili na huonyesha wazi kwamba matendo yote mawili yanamhusu kanisa, bila kuongeza tendo jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Hutunza kwa upendo” huepuka usemi mgumu au wa kale, na kurudiwa kwa vitenzi katika kishazi cha mwisho kunatatua udondoshaji wa Kigiriki kwa njia ya kawaida katika Kiswahili.
