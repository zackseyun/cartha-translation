  text: λαλοῦντες ⸀ἑαυτοῖς ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ⸀ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: sw
  text: Mkizungumza ninyi kwa ninyi[a] kwa zaburi, tenzi na nyimbo za kiroho, huku mkiimba na kufanya muziki kwa Bwana kwa mioyo yenu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwenu” au “kwenu wenyewe”; kiwakilishi cha Kigiriki cha kujirejelea hapa kwa kawaida hueleweka kwa maana ya kutendeana, yaani, “ninyi kwa ninyi.”
    reason: lexical_alternative
  - marker: b
    text: Au “mkiimba sifa”; neno la Kigiriki linaweza kumaanisha kuimba sifa au kufanya muziki, bila kulazimisha maana ya kutumia vyombo vya muziki.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: mkizungumza
  rationale: Kitenzi hiki huhifadhi maana pana ya kusema au kuzungumza bila kuifanya iwe hotuba rasmi.
- source_word: ἑαυτοῖς
  choice: ninyi kwa ninyi
  rationale: Katika muktadha wa wingi, kiwakilishi hiki cha kujirejelea kinaeleweka kwa kawaida kuwa cha kutendeana; usemi huu ni wa asili katika Kiswahili.
- source_word: ψαλμοῖς
  choice: zaburi
  rationale: Ni tafsiri ya kawaida inayoweza kutaja Zaburi za Maandiko au nyimbo zenye umbo la zaburi bila kulazimisha maana moja tu.
- source_word: ὕμνοις
  choice: tenzi
  rationale: Neno hili la Kiswahili linafaa kwa nyimbo rasmi za sifa na linadumisha tofauti na “zaburi” na “nyimbo.”
- source_word: ᾠδαῖς πνευματικαῖς
  choice: nyimbo za kiroho
  rationale: Tafsiri hii ya moja kwa moja inadumisha uhusiano wa kivumishi πνευματικαῖς na ᾠδαῖς bila kuongeza dai kwamba kila wimbo ulivuviwa moja kwa moja na Roho.
- source_word: ᾄδοντες
  choice: mkiimba
  rationale: Ni tafsiri ya kawaida ya kitenzi hiki na inadumisha umbo la tendo linaloendelea.
- source_word: ψάλλοντες
  choice: kufanya muziki
  rationale: Usemi huu unadumisha wazo la muziki bila kuamua kwamba lazima vyombo vitumike au kwamba maana yake ni kuimba pekee.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: kwa mioyo yenu
  rationale: Dativu inaweza kueleza njia au hali; wingi wa Kiswahili ni wa asili kwa kundi linalosemewa na unaonyesha ushiriki wa ndani.
- source_word: τῷ κυρίῳ
  choice: kwa Bwana
  rationale: Dativu inaonyesha kwamba uimbaji na muziki vinaelekezwa kwa Bwana; “Bwana” huhifadhi κύριος bila kumtaja zaidi ya maandishi yenyewe.
theological_decisions:
- issue: Maana ya ψάλλοντες kuhusu matumizi ya vyombo vya muziki
  choice: kufanya muziki, bila kutaja kama vyombo vinatumika
  alternative: kuimba sifa; kupiga ala
  rationale: Katika matumizi ya Kigiriki cha Agano Jipya, ψάλλω inaweza kumaanisha kuimba sifa au kufanya muziki, lakini hapa hailazimishi matumizi ya ala. Tafsiri haichukui msimamo wa kimadhehebu kuhusu vyombo katika ibada.
- issue: Anayerejelewa kwa jina “Bwana”
  choice: Bwana
  alternative: Bwana Yesu au Kristo
  rationale: Ingawa muktadha wa Waefeso unaweza kuelekeza kwa Kristo, mstari wenyewe unasema κύριος. Tafsiri inadumisha kiwango hicho cha ubainifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa vitenzi “mkizungumza … huku mkiimba” unahifadhi uhusiano wa vishirikishi vya Kigiriki. “Tenzi” limetumiwa kutofautisha ὕμνοις na “zaburi” pamoja na “nyimbo,” huku “kufanya muziki” likiacha wazi iwapo ala zinahusika.
