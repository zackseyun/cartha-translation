base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: sw
  text: Hata hivyo, kila mmoja wenu ampende mke wake kama anavyojipenda mwenyewe, na mke anapaswa kumheshimu[a] mume wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “kumwogopa” au “kumcha.” Hapa lina maana ya heshima yenye kicho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Hata hivyo
  rationale: Inaonyesha mpito wa kuhitimisha mjadala uliotangulia kwa muhtasari wa vitendo, huku ikihifadhi nguvu ya upinzani au ukomo.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: kila mmoja wenu
  rationale: 'Ni Kiswahili cha kawaida kinachohifadhi msisitizo wa mgawanyo: agizo linamhusu kila mume binafsi.'
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: mke wake
  rationale: Katika muktadha huu γυνή ni ‘mke’; kiwakilishi ‘wake’ huwasilisha maana ya kurejelea ya ἑαυτοῦ kwa Kiswahili cha asili.
- source_word: οὕτως ἀγαπάτω ὡς ἑαυτόν
  choice: ampende mke wake kama anavyojipenda mwenyewe
  rationale: ‘Ampende’ huhifadhi nguvu ya amri ya ἀγαπάτω, na ‘kama anavyojipenda mwenyewe’ huweka wazi kipimo cha ulinganisho. Namna inayorejelewa na οὕτως inaeleweka kutokana na ulinganisho na muktadha uliotangulia.
- source_word: ἡ δὲ γυνὴ
  choice: na mke
  rationale: δέ inaanzisha upande wa pili wa muhtasari; ‘na’ ni ya asili katika Kiswahili bila kuondoa mpito huo.
- source_word: ἵνα φοβῆται τὸν ἄνδρα
  choice: anapaswa kumheshimu mume wake
  rationale: φοβέομαι inaweza kumaanisha kuogopa au kuwa na heshima yenye kicho. Katika himizo la ndoa, ‘kumheshimu’ huwasilisha maana ya kimahusiano kwa uwazi; maana ya karibu zaidi na umbo, ‘kumwogopa,’ imewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya φοβῆται katika himizo kwa mke
  choice: kumheshimu
  alternative: kumwogopa / kuwa na kicho kwa
  rationale: Kitenzi kina wigo wa maana unaojumuisha hofu, kicho, na heshima. Muktadha wa ndoa unaelekeza kwenye heshima yenye kicho, si lazima woga wa kutishwa. Tanbihi huhifadhi uwazi kuhusu neno la Kigiriki bila kuhalalisha maana ya hofu ya unyanyasaji.
- issue: Lugha mahususi ya mume na mke
  choice: mke wake ... mume wake
  alternative: mwenzi wake wa ndoa
  rationale: Maumbo ya Kigiriki ni ya jinsia mahususi na yanahusu uhusiano wa mume na mke; tafsiri haifanyi lugha hiyo kuwa isiyo na jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kila mmoja wenu’ ni wazi na cha kawaida kuliko tafsiri nzito ya neno kwa neno; ‘mwenyewe’ huongeza msisitizo wa kiwakilishi cha Kigiriki bila kufanya sentensi iwe ngumu.
