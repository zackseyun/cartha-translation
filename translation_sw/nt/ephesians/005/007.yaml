  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: sw
  text: Kwa hiyo, msiwe washirika wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiwe washiriki pamoja nao” au “msishiriki pamoja nao.” Katika muktadha, maneno haya yanahusu kushiriki mwenendo wao wa dhambi au matokeo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: msiwe
  rationale: Kikanushi pamoja na amri γίνεσθε kinaonyeshwa kwa kawaida katika Kiswahili kwa umbo la kukataza ‘msiwe’.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na onyo lililotangulia katika mistari 3–6.
- source_word: γίνεσθε
  choice: msiwe
  rationale: Ingawa kitenzi kinaweza kumaanisha ‘kuwa’ au ‘kuja kuwa,’ katika katazo hili ‘msiwe’ ni Kiswahili cha kawaida na bado kinaonya dhidi ya kuingia katika hali hiyo.
- source_word: συμμέτοχοι
  choice: washirika
  rationale: Neno hili humaanisha watu wanaoshiriki jambo pamoja na wengine; ‘washirika’ ni la asili, la sasa, na linaacha wazi ikiwa kushiriki huko ni katika mwenendo au matokeo.
- source_word: αὐτῶν
  choice: wao
  rationale: Kiwakilishi kinarejelea watu waliotajwa katika muktadha; ‘washirika wao’ huhifadhi marejeo hayo bila kuongeza wazi ‘matendo yao’.
theological_decisions:
- issue: Upeo wa ushiriki unaodokezwa na συμμέτοχοι αὐτῶν
  choice: Katazo la kuwa washirika wao, bila kutaja wazi kitu kinachoshirikiwa.
  alternative: msishiriki matendo yao
  rationale: Kigiriki kinawataja watu (‘wao’), si ‘mambo haya’ wala ‘matendo yao.’ Tafsiri inadumisha utata huo halisi huku muktadha ukidokeza kushiriki mwenendo wao wa dhambi au matokeo yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. ‘Kwa hiyo’ huweka wazi uhusiano wa kimantiki, na ‘washirika wao’ huepuka ufafanuzi wa ziada usiomo wazi katika Kigiriki.
