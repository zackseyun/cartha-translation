  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: sw
  text: Kwa hiyo, baada ya kuacha uongo[a], kila mmoja na aseme kweli kwa jirani yake, kwa sababu sisi ni viungo vya kila mmoja wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ule uongo.”
    reason: Kibainishi katika τὸ ψεῦδος kinaweza kuwakilishwa moja kwa moja kama “ule uongo,” ingawa katika muktadha huu “uongo” kama aina ya mwenendo ni ya kawaida zaidi.
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na mawaidha yaliyotangulia; “Kwa hiyo” ni cha kawaida na kinahifadhi nguvu hiyo ya kimantiki.
- source_word: ἀποθέμενοι
  choice: baada ya kuacha
  rationale: Kirai hiki kinaonyesha kuondolewa kwa jambo kama hatua inayotangulia au kuandamana na amri kuu. “Baada ya kuacha” ni Kiswahili cha kawaida na kinadokeza uamuzi wa kuachana nalo.
- source_word: τὸ ψεῦδος
  choice: uongo
  rationale: Umoja wenye kibainishi unaweza kumaanisha uongo kama mwenendo au aina ya maovu, si lazima dai moja la uongo. “Uongo” huwasilisha maana hiyo pana kwa kawaida.
- source_word: λαλεῖτε ἀλήθειαν ἕκαστος
  choice: kila mmoja aseme kweli
  rationale: Amri ya wingi inagawanywa kwa kila mtu kupitia ἕκαστος. Muundo huu wa Kiswahili unaweka wazi wajibu wa kila mtu huku ukihifadhi amri ya kusema yaliyo ya kweli.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: na jirani yake
  rationale: μετά pamoja na hali ya genitivi huonyesha ushirika, na πλησίον hapa ni mtu wa karibu katika maana ya kijamii na kimaadili. “Jirani yake” ni tafsiri ya kawaida na jumuishi kwa muktadha.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Neno hili linaanzisha sababu ya amri; “kwa sababu” linaonyesha wazi uhusiano huo wa kisababishi.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: sisi ni viungo, kila mmoja akiwa kiungo cha wengine
  rationale: μέλη hudumisha taswira ya viungo vya mwili, nayo ἀλλήλων huonyesha uhusiano wa kutegemeana. Upanuzi mdogo wa kisintaksia unafanya usemi huo uwe wa kawaida kwa Kiswahili bila kuongeza “mwili mmoja,” jambo ambalo halijasemwa wazi katika mstari huu.
theological_decisions:
- issue: Upeo wa ψεῦδος
  choice: Kutafsiri kama “uongo”
  alternative: “ule uongo”
  rationale: Muktadha wa maadili unaonyesha zaidi mwenendo wa udanganyifu kwa ujumla. Hata hivyo, kibainishi cha Kigiriki kinaweza kuruhusu tafsiri rasmi zaidi “ule uongo,” kwa hiyo imehifadhiwa katika tanbihi.
- issue: Maana ya ἀλλήλων μέλη
  choice: Kuhifadhi taswira ya viungo na uhusiano wa kila mmoja na wengine
  alternative: “sisi ni sehemu za kila mmoja” au “sisi ni viungo vya mwili mmoja”
  rationale: “Sehemu” hudhoofisha taswira ya mwili, ilhali “mwili mmoja” huifanya wazi dhana inayodokezwa lakini isiyotajwa katika kifungu hiki. Tafsiri iliyochaguliwa inalinda taswira na utegemeano bila kutatua zaidi ya maandishi.
- issue: Lugha ya mgawanyo inayomhusu kila mtu
  choice: “kila mmoja ... jirani yake”
  alternative: “kila mtu ... jirani yake”
  rationale: ἕκαστος ina nguvu ya mgawanyo, yaani kila mshiriki wa kusanyiko anawajibika. Kiswahili hakihitaji kuingiza tofauti ya kijinsia hapa; muundo huu unawahusu wote kama Kigiriki kinavyofanya katika matumizi yake ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa amri ni wa moja kwa moja, na taswira ya viungo imehifadhiwa bila kuongeza istilahi za kimadhehebu.
