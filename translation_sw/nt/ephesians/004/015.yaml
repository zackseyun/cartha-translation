lexical_decisions:
- source_word: ἀληθεύοντες
  choice: tukisema yaliyo kweli
  rationale: Kitenzi hiki kinaweza kuhusisha kusema kweli na kuishi kwa ukweli. Muktadha wa mafundisho ya uongo na udanganyifu unaunga mkono maana ya kusema yaliyo kweli, huku maana pana zaidi ikihifadhiwa katika tanbihi.
- source_word: δὲ
  choice: Bali
  rationale: Neno hili linaonyesha utofauti wa kiasi na hali ya kuyumbishwa na kudanganywa iliyoelezwa katika mstari uliotangulia.
- source_word: ἐν ἀγάπῃ
  choice: kwa upendo
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha namna ambavyo kweli inapaswa kusemwa, bila kuondoa wazo la kutenda ndani ya mazingira ya upendo.
- source_word: αὐξήσωμεν
  choice: na tukue
  rationale: 'Kauli tegemezi ya nafsi ya kwanza wingi ina nguvu ya himizo: Paulo anawahusisha wasomaji katika mwito wa kukua.'
- source_word: εἰς αὐτὸν
  choice: kuelekea kwake
  rationale: Chaguo hili linahifadhi mwelekeo wa εἰς katika taswira ya ukuaji, bila kuifanya kauli ya Kiswahili kuwa isiyo ya kawaida. Tanbihi inaonyesha uwezekano wa maana ya 'ndani yake.'
- source_word: τὰ πάντα
  choice: katika kila jambo
  rationale: Katika muundo huu maneno hayo yanaeleza ukuaji wa pande zote; tafsiri hii inabaki karibu na maana halisi kuliko 'kwa kila namna' pekee.
- source_word: κεφαλή
  choice: kichwa
  rationale: Tafsiri ya moja kwa moja inahifadhi taswira ya mwili bila kuamua kama neno hilo hapa linasisitiza chanzo, mamlaka, au wazo jingine.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa Χριστός inasimama kama cheo kinachomtambulisha yeye aliye kichwa; 'Masihi' linaonyesha wazi kazi yake kama cheo.
theological_decisions:
