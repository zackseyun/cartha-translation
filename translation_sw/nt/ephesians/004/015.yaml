  alternative: tukiwa wa kweli; tukiitenda kweli
  rationale: Muktadha wa mafundisho ya uongo unapendelea usemi kuhusu kusema kweli, lakini kitenzi cha Kigiriki kinaweza kujumuisha mwenendo wa kweli; tanbihi inahifadhi upana huo.
- issue: Nguvu ya kitafsiri ya κεφαλή
  choice: kichwa
  alternative: chanzo; mwenye mamlaka juu ya
  rationale: Neno la kimfano limehifadhiwa bila kuingiza uamuzi wa kiteolojia ambao Kigiriki hakielezi moja kwa moja.
- issue: Mwelekeo wa εἰς αὐτόν
  choice: kuelekea kwake
  alternative: ndani yake
  rationale: Maana ya mwelekeo katika ukuaji ndiyo iliyo wazi zaidi katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa wazo la kuunganishwa ndani yake.
