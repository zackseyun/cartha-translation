base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: sw
  text: Kuna mwili mmoja na Roho mmoja[a], kama ninyi pia mlivyoitwa katika tumaini moja la wito wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho mmoja.” Neno la Kigiriki linaweza kumaanisha “roho” au “Roho”; hapa, katika muktadha wa kauli kuhusu umoja, linaelekea zaidi kumrejelea Roho Mtakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: mmoja/moja
  rationale: Kirai hiki kinarudiwa ili kusisitiza umoja; upatanisho wa kisarufi wa Kiswahili unahitaji ‘mmoja’ kwa mwili na Roho, na ‘moja’ kwa tumaini.
- source_word: σῶμα
  choice: mwili
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi sitiari ya waamini kama mwili mmoja bila kuifafanua kupita matini.
- source_word: πνεῦμα
  choice: Roho
  rationale: Katika mfuatano wa umoja wa Waefeso 4:4–6, neno hili linaelekea kumaanisha Roho Mtakatifu. Herufi kubwa inaonyesha uelewa huo, huku tanbihi ikihifadhi uwezekano wa ‘roho.’
- source_word: καθὼς καὶ
  choice: kama vile ninyi pia
  rationale: Inahifadhi ulinganisho wa καθώς na mkazo wa καί unaowahusisha pia wasomaji.
- source_word: ἐκλήθητε
  choice: mlivyoitwa
  rationale: Kitenzi cha kutendwa kinahifadhi maana ya kwamba waliitwa bila kumtaja wazi mtendaji, kama ilivyo katika Kigiriki.
- source_word: ἐν
  choice: katika
  rationale: Inafuata kwa karibu muundo wa Kigiriki ‘katika tumaini moja’ badala ya kuugeuza kuwa ‘kwa tumaini moja.’
- source_word: μιᾷ ἐλπίδι
  choice: tumaini moja
  rationale: Tafsiri ya moja kwa moja inayodumisha msisitizo unaorudiwa wa umoja.
- source_word: τῆς κλήσεως ὑμῶν
  choice: la wito wenu
  rationale: Inahifadhi uhusiano wa kijenitivi na uhusiano wa kileksika kati ya ‘mlivyoitwa’ na ‘wito,’ ingawa Kiswahili cha kawaida kingeweza pia kusema ‘mliloitiwa.’
theological_decisions:
- issue: Kinachorejelewa na πνεῦμα
  choice: Roho Mtakatifu
  alternative: roho moja au hali ya kiroho inayoshirikiwa na waamini
  rationale: Mfuatano wa ‘mwili mmoja ... Roho mmoja ... Bwana mmoja ... Mungu mmoja aliye Baba’ katika Waefeso 4:4–6 unaunga mkono zaidi rejeo kwa Roho Mtakatifu. Hata hivyo, Kigiriki hakikuwa na tofauti ya herufi kubwa na ndogo kama hii, kwa hiyo tanbihi inahifadhi uwezekano wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘katika tumaini moja la wito wenu’ umechaguliwa ili kuhifadhi kwa uwazi muundo na marudio ya Kigiriki, ingawa ni rasmi kidogo kuliko ‘tumaini moja mliloitiwa.’
