  to: ili tusiendelee kuwa watoto wachanga, tukitupwa huku na huko na mawimbi na kupeperushwa huku na huko kwa kila upepo wa mafundisho, kwa hila za watu[a], kwa ujanja unaotumiwa kwa ajili ya mbinu ya upotoshaji[b].
