id: EPH.4.14
reference: Ephesians 4:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: sw
  text: ili tusiendelee kuwa watoto wachanga, tukitupwa huku na huko na mawimbi na kupeperushwa huku na huko kwa kila upepo wa mafundisho, kwa hila za watu[a], kwa ujanja unaotumiwa kwa ajili ya mbinu ya upotoshaji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “katika mchezo wa kete wa watu,” taswira ya kucheza kwa udanganyifu au kufanya hila.
    reason: cultural_note
  - marker: b
    text: Au, “unaolenga mbinu ya kosa/udanganyifu.” Maneno ya Kigiriki yanaweza kuonyesha kosa linalopotosha au udanganyifu uliopangwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: ili tusiwe tena
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kusudi au matokeo yanayotazamiwa, huku μηκέτι ikihifadhiwa kwa ‘tena.’
- source_word: νήπιοι
  choice: watoto wachanga
  rationale: Katika muktadha huu neno ni sitiari ya kutokomaa; ‘watoto wachanga’ linaweka wazi udhaifu na kutokomaa bila kuwa neno la kitaalamu.
- source_word: κλυδωνιζόμενοι
  choice: tukirushwa-rushwa na mawimbi
  rationale: Linahifadhi taswira ya baharini ya kupigwa na kutupwa na mawimbi, pamoja na hali ya kutokuwa thabiti.
- source_word: περιφερόμενοι
  choice: kuchukuliwa huku na huku
  rationale: Linahifadhi maana ya kutendwa na kusogezwa kutoka upande mmoja hadi mwingine.
- source_word: παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: kila upepo wa mafundisho
  rationale: ‘Mafundisho’ ni Kiswahili cha kawaida na chenye upeo mpana kuliko istilahi ya kitaalamu zaidi; muundo wa upepo unahifadhi sitiari ya Kigiriki.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: kwa hila za watu
  rationale: κυβεία hutoka katika taswira ya mchezo wa kete unaotumiwa kwa udanganyifu, lakini hapa maana ya kimuktadha ni hila au udanganyifu wa watu.
- source_word: ἐν πανουργίᾳ
  choice: kwa ujanja
  rationale: ‘Ujanja’ hapa, ukiwa katika mazingira ya hila na upotoshaji, unaonyesha werevu usio wa uadilifu wa πανουργία.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: unaoelekea kwenye mbinu za upotoshaji
  rationale: ‘Unaoelekea kwenye’ huhifadhi mwelekeo wa πρός; ‘mbinu’ huonyesha mpango uliopangwa wa μεθοδεία; ‘upotoshaji’ huhifadhi uwezekano wa πλάνη kumaanisha kosa linalopotosha au udanganyifu.
theological_decisions:
- issue: Maana ya διδασκαλία
  choice: mafundisho
  alternative: itikadi
  rationale: ‘Mafundisho’ ni ya kawaida na haiwekei kifungu maana finyu ya mfumo rasmi wa imani.
- issue: Maana ya πλάνη
  choice: upotoshaji
  alternative: kosa; udanganyifu
  rationale: Neno la Kigiriki linaweza kuhusisha kupotea, kosa, au udanganyifu. ‘Upotoshaji’ linaacha wazi mvutano kati ya maudhui potovu na tendo la kuwapotosha wengine.
- issue: Uhusiano wa πρός na μεθοδεία
  choice: unaoelekea kwenye mbinu
  alternative: katika mbinu; kwa mbinu
  rationale: Tafsiri iliyochaguliwa inahifadhi wazo la mwelekeo lililo katika πρός bila kuamua kabisa kama kishazi kinaonyesha kusudi, matokeo, au mazingira ya ujanja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio katika ‘tukirushwa-rushwa’ na ‘huku na huku’ yanatoa mwendo wa kuyumba unaopatikana katika sitiari za Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
