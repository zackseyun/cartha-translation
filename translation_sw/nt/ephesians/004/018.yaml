lexical_decisions:
- source_word: ἐσκοτωμένοι τῇ διανοίᾳ ὄντες
  choice: wakiwa wametiwa giza katika ufahamu wao
  rationale: Muundo huu unaonyesha hali inayotokana na tendo lililofanywa kwao, huku ukihifadhi uhusiano wa vishirikishi vya Kigiriki. “Ufahamu” ni Kiswahili cha kawaida na wazi kwa διάνοια katika muktadha huu.
- source_word: ἀπηλλοτριωμένοι
  choice: wametengwa
  rationale: Kitenzi hiki kinaeleza hali ya kutenganishwa au kufanywa wageni. “Wametengwa” ni ya asili katika Kiswahili na haibani maana kuwa kutengwa kisheria pekee.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: na uzima wa Mungu
  rationale: “Uzima wa Mungu” huhifadhi uwezekano wa kumaanisha uzima ulio wa Mungu au uzima unaotoka kwa Mungu bila kuamua maana moja.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: kwa sababu ya ujinga ulio ndani yao
  rationale: “Kwa sababu ya” huonyesha sababu, na “ulio ndani yao” hudumisha wazi mahali pa ujinga huo kama ilivyo katika Kigiriki.
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: kwa sababu ya ugumu wa mioyo yao
  rationale: “Ugumu” huhifadhi sitiari ya πώρωσις. Wingi “mioyo yao” ni Kiswahili cha kawaida na unaafikiana na kundi la watu linalorejelewa, ingawa Kigiriki kimetumia nomino ya umoja.
theological_decisions:
- issue: Maana ya “uzima wa Mungu”
  choice: Kuhifadhi usemi “uzima wa Mungu” bila kuufafanua zaidi
  alternative: uzima unaotoka kwa Mungu; uzima ulio wa Mungu mwenyewe
  rationale: Muundo wa Kigiriki unaweza kubeba maana zote mbili zinazokaribiana; tafsiri haipaswi kuondoa utata huo halisi.
- issue: Umoja wa “moyo” ukiwa na warejelewa wengi
  choice: mioyo yao
  alternative: moyo wao
  rationale: Ingawa καρδίας ni umoja katika Kigiriki, “mioyo yao” ni muundo wa kawaida na sahihi zaidi katika Kiswahili kwa watu wengi, bila kubadili dhana ya moyo kuwa utu wa ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi mfuatano wa hali na sababu katika Kigiriki, huku matumizi ya “mioyo yao” yakiepuka umoja usio wa kawaida katika Kiswahili.
