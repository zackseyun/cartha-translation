    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: ikiwa kweli
  rationale: Huhifadhi muundo wa sharti pamoja na msisitizo wa γε, bila kuugeuza moja kwa moja kuwa sababu ya ‘kwa kuwa’.
- source_word: αὐτὸν ἠκούσατε
  choice: mlisikia yeye
  rationale: Kiima-ambwa cha moja kwa moja katika Kigiriki kina maana halisi ya ‘mlimsikia yeye’; matumizi ya kiwakilishi ‘yeye’ yanaweka wazi msisitizo huo wa kushangaza badala ya kuongeza ‘habari zake’.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi maana pana ya ἐν inayoweza kuonyesha mazingira, muungano, au uhusiano wa karibu, badala ya kuifasiri tu kuwa ‘na yeye’.
- source_word: ἐδιδάχθητε
  choice: kufundishwa
  rationale: Huwakilisha kwa kawaida kauli tendwa ya kitenzi cha Kigiriki.
- source_word: καθώς
  choice: kama vile
  rationale: Huhifadhi nguvu ya ulinganisho inayounganisha kufundishwa kwao na kweli iliyo ndani ya Yesu.
- source_word: ἀλήθεια
  choice: kweli
  rationale: Nomino haina kibainishi katika Kigiriki; ‘kweli’ ni ya kawaida na haiongezi ‘ile’ isiyokuwapo.
- source_word: ἐν τῷ Ἰησοῦ
  choice: ndani ya Yesu
  rationale: Huhifadhi jina binafsi ‘Yesu’ na upana wa ἐν bila kuamua ikiwa ni mazingira, muungano, au uhusiano wa karibu.
theological_decisions:
- issue: Ikiwa αὐτὸν ἠκούσατε itafsiriwe moja kwa moja kuwa ‘mlisikia yeye’ au kifasiri kuwa ‘mlisikia habari zake.’
  choice: mlisikia yeye
  alternative: mlisikia habari zake
  rationale: Muundo wa Kigiriki una kiima-ambwa cha moja kwa moja na hauna kihusishi chenye maana ya ‘kuhusu.’ Tafsiri ya moja kwa moja huhifadhi wazo kwamba katika ujumbe wa mitume walimsikia Kristo mwenyewe, bila kulazimisha dai hilo zaidi ya maandishi.
- issue: Jinsi ya kuwakilisha vifungu ἐν αὐτῷ na ἐν τῷ Ἰησοῦ.
  choice: ndani yake / ndani ya Yesu
  alternative: na yeye / katika muungano na Yesu
  rationale: ‘Ndani ya’ huhifadhi mvutano na upana wa lugha ya Paulo kuhusu mazingira, muungano, au uhusiano wa karibu, badala ya kuifupisha kuwa chombo au wakala pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mlisikia yeye’ si mpangilio wa kawaida zaidi katika Kiswahili, lakini umetumiwa kwa makusudi kuhifadhi kiima-ambwa cha moja kwa moja na msisitizo wa Kigiriki; tanbihi inatoa usemi wa kawaida zaidi.
