  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlisikia habari zake.” Kigiriki kinasema kwa maana ya moja kwa moja zaidi, “mlimsikia,” huenda kikidokeza kwamba katika ujumbe wa mitume walimsikia Kristo mwenyewe kwa kweli.
    reason: alternative_reading
