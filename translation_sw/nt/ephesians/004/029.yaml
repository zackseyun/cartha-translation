  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: sw
  text: Neno lolote lililooza lisitoke kinywani mwenu,[a] bali lile tu lililo jema kwa ajili ya kujenga kulingana na uhitaji ndilo litoke, ili liwape neema wale wanaosikia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usemi wowote mpotovu” au “neno lolote lisilofaa.” Kigiriki kinasema kihalisi “neno lolote lililooza.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ili liwanufaishe wale wanaosikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: neno lolote lililooza
  rationale: Muundo wenye πᾶς chini ya ukanushaji una maana ya ‘neno lolote ... lisitoke,’ yaani hakuna hata moja. ‘Lililooza’ linahifadhi istiari hai ya σαπρός, huku ‘neno’ hapa likimaanisha usemi unaotamkwa.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: kinywani mwenu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi picha ya maneno kutoka kinywani; umoja ‘kinywani’ pamoja na ‘mwenu’ unafuata umoja wa στόματος na wingi wa ὑμῶν.
- source_word: μὴ ἐκπορευέσθω
  choice: lisitoke
  rationale: Huwasilisha katazo la amri ya wakati wa sasa kwa Kiswahili cha asili na kudumisha picha ya usemi unaotoka kinywani.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: bali lile tu lililo jema
  rationale: Muundo wa Kigiriki umefupishwa na unarejelea λόγος. Kiswahili kinahitaji kurejesha rejeo hilo; ‘lile tu’ linaonyesha tofauti kati ya usemi uliokatazwa na unaokubalika.
- source_word: πρὸς οἰκοδομὴν
  choice: kwa ajili ya kujenga
  rationale: ‘Kujenga’ huhifadhi istiari ya οἰκοδομή na inaeleweka kwa wasomaji wa kawaida kuliko istilahi ya kikanisa kama ‘kuadilisha.’
- source_word: τῆς χρείας
  choice: kulingana na uhitaji
  rationale: 'Huhifadhi ufupi na utata kiasi wa uhusiano wa genitivi: usemi mwema unapaswa kuelekezwa katika kujenga kwa mujibu wa uhitaji uliopo, bila kuubadili waziwazi kuwa ‘wakati unaofaa.’'
- source_word: ἵνα δῷ χάριν
  choice: ili liwape neema
  rationale: ‘Neema’ huhifadhi upana wa χάρις na mwangwi wake muhimu katika msamiati wa Paulo, huku tanbihi ikionyesha maana inayowezekana ya manufaa.
- source_word: τοῖς ἀκούουσιν
  choice: wale wanaosikia
  rationale: Huwakilisha kwa kawaida kishiriki cha wakati wa sasa na haibani maana kwa wasikilizaji wa tukio moja tu.
theological_decisions:
- issue: Maana ya χάριν katika himizo kuhusu mwenendo wa kusema
  choice: neema
  alternative: manufaa
  rationale: Katika muktadha huu neno linaweza kumaanisha manufaa yenye neema kwa wasikilizaji. ‘Neema’ huhifadhi msamiati na mvuto wa Paulo bila kulazimisha dai maalumu la kimafundisho; tanbihi inatunza uwezekano wa maana ya ‘manufaa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imehifadhi istiari za kuoza na kujenga. Muundo ‘kinywani mwenu’ ni wa kijumla na wa kawaida katika Kiswahili, na tanbihi zinahifadhi njia mbadala pale ambapo Kigiriki kinaweza kueleweka kwa zaidi ya namna moja.
