id: EPH.4.12
reference: Ephesians 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: sw
  text: kwa ajili ya kuwaandaa watakatifu, kwa kazi ya huduma[a], kwa ajili ya kuujenga mwili wa Masihi[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘kwa kazi ya utumishi.’ Neno la Kigiriki διακονία linaweza kumaanisha ‘huduma’ au ‘utumishi.’
    reason: lexical_alternative
  - marker: b
    text: Au, ‘wa Kristo.’ Cheo cha Kigiriki Χριστός kimetafsiriwa hapa ‘Masihi’ ili kuhifadhi maana yake kama cheo.
    reason: alternative_reading
  - marker: c
    text: 'Kigiriki pia kinaweza kueleweka kama mfululizo wa hatua: ‘ili kuwaandaa watakatifu kwa kazi ya huduma, kwa ajili ya kuujenga mwili wa Masihi.’'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: kwa ajili ya kuwaandaa
  rationale: Kifungu hiki kinaonyesha kusudi. ‘Kuwaandaa’ linafikisha maana ya kuwafanya watu wafae na wawe tayari, bila kudokeza ukamilifu usio na dosari.
- source_word: τῶν ἁγίων
  choice: watakatifu
  rationale: Hili ni neno la kawaida la Paulo kwa watu waliowekwa wakfu kwa Mungu; linahifadhi istilahi ya kibiblia bila kuifanya iwe maelezo marefu.
- source_word: εἰς ἔργον διακονίας
  choice: kwa kazi ya huduma
  rationale: Muundo huu unaakisi umoja wa ἔργον na upana wa διακονία. ‘Huduma’ linaweza kumaanisha kuwahudumia wengine bila kuiwekea kazi hii mipaka ya viongozi wa kidini pekee.
- source_word: εἰς οἰκοδομὴν
  choice: kwa ajili ya kuujenga
  rationale: ‘Kuujenga’ linadumisha sitiari ya ujenzi inayotumiwa kwa kuimarishwa na kukua kwa jumuiya.
- source_word: τοῦ σώματος
  choice: mwili
  rationale: Linahifadhi sitiari ya Paulo ya jumuiya ya waumini kuwa mwili mmoja.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός hapa ni cheo kinachomtambulisha mwenye mwili; ‘Masihi’ linahifadhi maana hiyo ya cheo.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa vifungu vitatu vya kusudi
  choice: 'Vifungu vimewekwa kwa namna inayofuata mfululizo wa Kigiriki: kuwaandaa watakatifu, kazi ya huduma, na kuujenga mwili wa Masihi.'
  alternative: 'Inawezekana kuelewa mfululizo huu kama hatua zinazoendelea: watakatifu wanaandaliwa kufanya kazi ya huduma, nayo inalenga kuujenga mwili wa Masihi.'
  rationale: πρός ... εἰς ... εἰς inaweza kuonyesha malengo yaliyoratibiwa au mwendelezo wa hatua. Matini na tanbihi zinahifadhi uwezekano huo bila kuamua kimadhehebu ni nani hasa anayefanya huduma.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. ‘Kuwaandaa’ ni cha sasa na cha wazi kuliko ‘kuwakamilisha’; ‘kuujenga mwili’ huhifadhi sitiari ya chanzo. Alama zote za tanbihi zimewekwa katika matini.
