base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: sw
  text: Naye mwenyewe alitoa wengine kuwa mitume, wengine kuwa manabii, wengine kuwa wainjilisti, na wengine kuwa wachungaji[a] na walimu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapasta.” Neno la Kigiriki lasema kihalisi “wachungaji.”
    reason: lexical_alternative
  - marker: b
    text: Katika Kigiriki, kuna kibainishi kimoja tu mbele ya “wachungaji na walimu.” Hilo linaweza kuonyesha uhusiano wa karibu sana kati ya majukumu haya, lakini si lazima limaanishe kwamba ni cheo kimoja.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτός
  choice: Naye mwenyewe
  rationale: “Naye” linaunganisha aya hii na yaliyotangulia, huku “mwenyewe” likihifadhi msisitizo wa αὐτός kwamba yeye binafsi ndiye aliyetoa.
- source_word: ἔδωκεν
  choice: aliwatoa
  rationale: Kitenzi hiki kinahifadhi maana ya msingi ya ‘kutoa’ na, pamoja na orodha inayofuata, kinaonyesha kwamba watu hao walitolewa katika huduma hizi; ‘aliwateua’ kingefasiri zaidi ya neno lenyewe.
- source_word: τοὺς μὲν ... τοὺς δὲ
  choice: wengine ... wengine
  rationale: Muundo unaorudiwa wa μέν/δέ unagawa watu katika makundi; “wengine ... wengine” ni Kiswahili cha kawaida na sahihi kwa mfuatano huu.
- source_word: ἀποστόλους
  choice: mitume
  rationale: Hili ndilo neno la kawaida na lililoimarika katika Kiswahili kwa ἀπόστολοι.
- source_word: προφήτας
  choice: manabii
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya προφῆται.
- source_word: εὐαγγελιστάς
  choice: wainjilisti
  rationale: Neno hili lililozoeleka linataja watu wanaotangaza Injili na linafaa katika orodha fupi ya huduma.
- source_word: ποιμένας
  choice: wachungaji
  rationale: “Wachungaji” huhifadhi taswira halisi ya watu wanaochunga; katika matumizi ya kanisa ya Kiswahili, neno hilohilo pia hutumiwa kwa viongozi wanaoitwa mapasta.
- source_word: διδασκάλους
  choice: walimu
  rationale: Tafsiri ya moja kwa moja na ya kawaida, bila kuunganisha kwa lazima jukumu hili na lile la wachungaji.
theological_decisions:
- issue: Iwapo ποιμένας itafsiriwe kama taswira ya ‘wachungaji’ au kama cheo cha kanisa, ‘mapasta’
  choice: wachungaji
  alternative: wachungaji wa kanisa (mapasta)
  rationale: “Wachungaji” huhifadhi taswira ya Kigiriki. Kwa kuwa Kiswahili hutumia neno hilohilo pia kama cheo cha huduma ya kanisa, tanbihi inaeleza uwezekano huo bila kuingiza mfumo maalumu wa uongozi wa kanisa.
- issue: Iwapo ‘wachungaji na walimu’ ni kundi moja lenye jukumu moja au makundi mawili
  choice: Kuhifadhi nomino zote mbili zikiwa zimeunganishwa kwa ‘na’
  alternative: wachungaji-walimu kama kundi au cheo kimoja
  rationale: Kifungu kimoja cha Kigiriki kinachotangulia nomino hizi kinaweza kuonyesha uhusiano wa karibu, lakini hakilazimishi kuzifanya cheo kimoja. Tafsiri haiondoi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya “wengine wawe” yanatunza mpangilio wa orodha na kuzuia sentensi kuwa nzito. Neno “wachungaji” limechaguliwa kwa sababu linabeba kwa asili taswira ya uchungaji na matumizi ya huduma ya kanisa.
