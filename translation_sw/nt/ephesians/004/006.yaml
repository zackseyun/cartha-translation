lexical_decisions:
- source_word: εἷς θεὸς
  choice: Mungu ni mmoja
  rationale: Muundo huu wa Kiswahili ni wa asili na unadumisha msisitizo wa idadi unaoendeleza mfululizo wa ‘mmoja’ katika muktadha.
- source_word: πατὴρ πάντων
  choice: Baba wa wote
  rationale: ‘Baba’ linahifadhi jina la uhusiano linalomhusu Mungu; ‘wote’ haliongezi nomino ambayo Kigiriki hakijaitaja, ingawa kwa kawaida huweza kueleweka kuhusu watu.
- source_word: ὁ ἐπὶ πάντων
  choice: aliye juu ya wote
  rationale: ‘Juu ya wote’ linaweza kuonyesha ukuu na mamlaka bila kuongeza ufafanuzi usiomo katika matini.
- source_word: διὰ πάντων
  choice: atendaye kazi kupitia wote
  rationale: διά pamoja na jenitivi huonyesha njia au wakala. Kuongeza ‘atendaye kazi’ kunafanya uhusiano huo uwe wa kawaida na wazi katika Kiswahili huku ‘kupitia wote’ kikihifadhi wazo la shughuli ya Mungu.
- source_word: ἐν πᾶσιν
  choice: aliye ndani ya wote
  rationale: Hili linaonyesha tofauti na kishazi kilichotangulia na kuhifadhi maana ya msingi ya ἐν, bila kuamua wazi iwapo ‘wote’ ni watu wote au waamini wote.
theological_decisions:
- issue: Upeo wa πάντων / πᾶσιν inayorudiwa
  choice: Kutumia ‘wote’ bila kutaja wazi kundi la watu katika matini kuu
  alternative: ‘watu wote,’ ‘waamini wote,’ au ‘vitu vyote’
  rationale: Muktadha unahusu umoja wa jumuiya ya waamini, lakini Kigiriki hakitaji nomino baada ya maumbo ya πᾶς. ‘Wote’ kinahifadhi upana na mvutano huo bila kuufunga kwa tafsiri moja.
- issue: Maana ya διὰ πάντων
  choice: ‘atendaye kazi kupitia wote’
  alternative: ‘aliye kupitia wote’
  rationale: Kiswahili hakitumii kwa urahisi muundo wa moja kwa moja ‘aliye kupitia wote.’ Kutaja utendaji hudokeza kazi ya Mungu bila kuingiza fundisho mahsusi la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa marudio umehifadhiwa kadiri sarufi ya Kiswahili inavyoruhusu; ‘atendaye kazi’ limeongezwa kwa uwazi wa kawaida wa usemi.
