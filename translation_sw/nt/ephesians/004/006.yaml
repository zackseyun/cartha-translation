translation:
  language: sw
  text: Mungu mmoja, Baba wa wote,[a] aliye juu ya wote, na kupitia wote, na ndani ya wote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baba wa kila mtu” au “Baba wa vitu vyote.” Neno “wote” linalorudiwa katika mstari huu lina maana pana, na Kigiriki hakitaji wazi nomino inayorejelewa.
