  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: sw
  text: Kutoka kwake, mwili wote unaunganishwa na kushikamanishwa kupitia kila kiungo kinachotoa msaada; kwa kadiri ya utendaji wa kila sehemu, mwili hujikuza kwa ajili ya kujijenga katika upendo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kila kiungo kinachotoa msaada” kinaweza pia kutafsiriwa “kila kiungo cha ugavi,” “kila kano ya msaada,” au “kila muunganiko unaotoa ugavi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: Kutoka kwake
  rationale: Muktadha wa mstari wa 15 unaonyesha kwamba kiwakilishi hiki kinamrejelea Kristo; tafsiri ya kibinafsi inadumisha yeye kuwa chanzo cha ukuaji wa mwili.
- source_word: πᾶν τὸ σῶμα
  choice: mwili wote
  rationale: Ni Kiswahili cha kawaida na cha moja kwa moja kwa nomino hii ya umoja yenye maana ya jumla.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: unaunganishwa na kushikamanishwa pamoja
  rationale: Maneno haya yanadumisha hali ya kutendwa na kuonyesha kuunganishwa kwa sehemu pamoja na mshikamano wa mwili mzima.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: kwa kila kiungo kinachoutia nguvu
  rationale: “Kiungo” kinahifadhi taswira halisi ya mwili, huku “kinachoutia nguvu” kikieleza dhana ya msaada au ugavi bila kudai kwa usahihi kupita kiasi kwamba ni kano.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: kila sehemu inapofanya kazi kwa kadiri yake
  rationale: Hii inaonyesha utendaji wa kila sehemu kwa kiwango chake bila kuongeza wazo la “ipasavyo,” ambalo halijasemwa wazi katika Kigiriki.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: mwili hukua
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kwamba mwili wenyewe, ukiwezeshwa kutoka kwa Kristo na kupitia sehemu zake, unapata ukuaji.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: na kujijenga wenyewe
  rationale: Inahifadhi sitiari ya kujenga na nguvu ya kiwakilishi cha kujirejelea ἑαυτοῦ.
- source_word: ἐν ἀγάπῃ
  choice: katika upendo
  rationale: Ni tafsiri ya kawaida ya ἀγάπη na inadumisha msisitizo wa Paulo katika muktadha huu.
theological_decisions:
- issue: Chanzo na utendaji katika ukuaji wa mwili
  choice: Kristo anaonyeshwa kuwa chanzo—“Kutoka kwake”—na mwili hukua kupitia utendaji wa kila sehemu.
  alternative: Kutafsiri ἐξ οὗ kwa namna isiyo ya kibinafsi, au kuufanya ukuaji uwe kazi ya Kristo pekee bila nafasi ya sehemu mbalimbali.
  rationale: Muktadha unamrejelea Kristo, lakini sarufi ya sentensi pia inaonyesha mchango unaopimwa wa kila sehemu; tafsiri inadumisha pande zote mbili.
- issue: Maana ya taswira ya ἁφῆς τῆς ἐπιχορηγίας
  choice: Taswira ya mwili imehifadhiwa kwa “kila kiungo kinachoutia nguvu.”
  alternative: “Kila kano inayotegemeza” au “kila muunganiko unaotoa mahitaji.”
  rationale: Neno ἁφή linaweza kueleweka kama kiungo au sehemu ya mgusano, na ἐπιχορηγία kama ugavi au msaada. Tafsiri kuu ni ya asili huku tanbihi ikihifadhi uwezekano huo wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umerahisishwa ili sentensi ndefu ya Kigiriki isomeke kwa kawaida, huku taswira ya mwili, Kristo kama chanzo, utendaji wa kila sehemu, na kujijenga katika upendo vikihifadhiwa.
