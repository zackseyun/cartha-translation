lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: mmoja / moja / mmoja
  rationale: 'Kivumishi cha idadi kimerudiwa mara tatu kusisitiza umoja. Upatanisho wa kisarufi wa Kiswahili umefuatwa: “Bwana mmoja,” “imani moja,” na “ubatizo mmoja,” huku urudiaji wa maana ya ‘moja’ ukihifadhiwa.'
- source_word: κύριος
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida na yenye heshima ya κύριος. Katika muktadha wa Waefeso 4:4–6, ni cheo kinachomrejelea Kristo kwa uwezekano mkubwa, si neno la kawaida tu la kumaanisha mkuu.
- source_word: πίστις
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida na inayofaa hapa kwa imani ya pamoja au mwitikio wa kuamini unaowaunganisha waumini. Maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
- source_word: βάπτισμα
  choice: ubatizo
  rationale: “Ubatizo” ni neno la kawaida na sahihi kwa βάπτισμα, na haliongezi maelezo kuhusu namna, athari, au tafsiri ya kitheolojia ya ubatizo.
theological_decisions:
- issue: Mrejelewa wa “Bwana”
  choice: “Bwana” limehifadhiwa kama cheo ambacho katika mtiririko wa Waefeso 4:4–6 kwa uwezekano mkubwa kinamrejelea Yesu Kristo.
  alternative: Kumrejelea Mungu kwa ujumla zaidi.
  rationale: Mpangilio wa “Roho mmoja” (mst. 4), “Bwana mmoja” (mst. 5), na “Mungu mmoja, naye ni Baba” (mst. 6) unaelekeza kwa Mwana, bila kuongeza jina ambalo halipo katika mstari huu.
- issue: Maana ya “ubatizo mmoja”
  choice: Imetafsiriwa bila upendeleo kuwa “ubatizo mmoja.”
  alternative: Mkazo mahsusi wa kisakramenti; au ubatizo wa kiroho/kistiari hasa.
  rationale: Mstari unasisitiza umoja lakini hauamui mabishano kuhusu namna ya ubatizo, athari yake, au ikiwa hapa mkazo ni ibada yenyewe au maana yake ya kuwaunganisha waumini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa heshima, na wa sasa. Muundo sambamba wa vifungu vitatu umehifadhiwa, pamoja na alama ya nuktamkato inayoonyesha kuwa mstari ni sehemu ya orodha inayoendelea.
