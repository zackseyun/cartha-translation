  text: mkijitahidi sana kuudumisha umoja wa Roho katika kifungo cha amani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkifanya bidii kuutunza” au “mkijitahidi kuuhifadhi.”
    reason: lexical_alternative
  - marker: b
    text: Yaelekea zaidi kwamba “Roho” hapa anamrejelea Roho Mtakatifu, ingawa wengine huelewa neno hili kwa maana pana zaidi ya roho ya pamoja kati ya waamini.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: mkijitahidi sana
  rationale: Kirai hiki cha kitenzi kinaonyesha bidii ya dhati na juhudi ya kutenda, si hamu ya moyoni tu; pia kinaendeleza mtiririko wa himizo kutoka mistari iliyotangulia.
- source_word: τηρεῖν
  choice: kuudumisha
  rationale: Maana hapa ni kutunza na kuendeleza kitu ambacho tayari kipo, wala si kukianzisha au kukiumba.
- source_word: τὴν ἑνότητα
  choice: umoja
  rationale: “Umoja” ni neno la kawaida, wazi, na linalofaa kwa ἑνότης katika muktadha wa waamini.
- source_word: τοῦ πνεύματος
  choice: wa Roho
  rationale: Katika muktadha wa Waefeso, rejeo linalowezekana zaidi ni Roho Mtakatifu; herufi kubwa inaonyesha uamuzi huo huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: ἐν
  choice: katika
  rationale: “Katika” huhifadhi kwa urahisi wazo la eneo au njia ambamo umoja unadumishwa.
- source_word: τῷ συνδέσμῳ
  choice: kifungo
  rationale: σύνδεσμος ni kitu kinachofunga pamoja; “kifungo” kinahifadhi sitiari hiyo kwa lugha fupi na yenye kueleweka.
- source_word: τῆς εἰρήνης
  choice: cha amani
  rationale: Huhifadhi muundo wa uhusiano wa nomino na kuonyesha amani kuwa kile kinachowaunganisha waamini.
theological_decisions:
- issue: Rejeo la πνεύματος
  choice: Roho Mtakatifu
  alternative: roho ya pamoja kati ya waamini
  rationale: Matumizi ya karibu katika Waefeso, hasa 4:4 na 4:30, yanaunga mkono rejeo la Roho Mtakatifu; hata hivyo, tanbihi inahifadhi usomaji mpana zaidi.
- issue: Asili ya umoja
  choice: umoja uliopo tayari unaopaswa kudumishwa
  alternative: umoja unaopaswa kuundwa na waamini
  rationale: τηρεῖν humaanisha kutunza au kudumisha, kwa hiyo mstari unawahimiza waamini walinde umoja uliopo badala ya kuuumba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mkijitahidi sana” ni cha kawaida na huhifadhi nguvu ya σπουδάζοντες; “kuudumisha” huonyesha kwamba umoja tayari umetolewa. “Kifungo cha amani” huhifadhi sitiari ya chanzo bila kuwa nzito kupita kiasi.
