  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: kwa ... wote
  rationale: μετά pamoja na nomino katika hali ya genitive huonyesha hali au namna inayoandamana na mwenendo unaotajwa; πάσης inasisitiza ukamilifu. Muundo wa Kiswahili “kwa unyenyekevu wote” ni wa asili na huhifadhi msisitizo huo.
- source_word: ταπεινοφροσύνης
  choice: unyenyekevu
  rationale: Neno hili humaanisha hali ya kuwa na moyo au fikira za chini, yaani unyenyekevu. “Unyenyekevu” ni neno la kawaida, lenye heshima, na linaloeleweka katika Kiswahili cha sasa.
- source_word: πραΰτητος
  choice: upole
  rationale: πραΰτης hueleza upole usio udhaifu, bali nguvu inayodhibitiwa. “Upole” huwasilisha fadhila hiyo kwa Kiswahili cha kawaida bila kutumia lugha nzito.
- source_word: μακροθυμίας
  choice: uvumilivu
  rationale: Neno hili hueleza uwezo wa kustahimili watu kwa muda mrefu na kutokuwa mwepesi wa hasira. “Uvumilivu” ni tafsiri ya asili na wazi katika muktadha huu.
- source_word: ἀνεχόμενοι
  choice: mkivumiliana
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaonyesha tendo linaloendelea la kustahimiliana. “Mkivumiliana” huhifadhi maana ya kuheshimiana na kustahimili mapungufu ya mwingine bila kuwa ya mazungumzo kupita kiasi.
- source_word: ἀλλήλων
  choice: -ana
  rationale: Kiwambishi cha kutendeana “-ana” katika “mkivumiliana” huonyesha kwa kawaida na kwa usahihi maana ya kurudiana ya ἀλλήλων, yaani mtu mmoja kwa mwingine.
- source_word: ἐν ἀγάπῃ
  choice: katika upendo
  rationale: ἐν pamoja na dative inaweza kuonyesha mazingira au namna ya tendo. “Katika upendo” ni tafsiri ya moja kwa moja inayohifadhi uwezekano huo wa maana.
theological_decisions:
- issue: Tafsiri ya ἀγάπη
  choice: upendo
  alternative: mapendo
  rationale: “Upendo” ni neno la kawaida la Kiswahili kwa ἀγάπη na linafaa hapa kwa hali au namna ambayo waamini wanavumiliana. Haliongezi maana maalumu ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi mtiririko wa kishazi cha Kigiriki na koma ya mwisho kwa kuwa mstari huu unaendelea kisintaksia kutoka mstari wa 1 kuelekea mstari wa 3.
