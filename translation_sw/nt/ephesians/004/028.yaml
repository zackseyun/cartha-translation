id: EPH.4.28
reference: Ephesians 4:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: sw
  text: Anayeiba asiibe tena, bali afanye kazi kwa bidii, akitenda yaliyo mema kwa mikono yake mwenyewe, ili awe na kitu cha kumgawia mwenye uhitaji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: Anayeiba
  rationale: Kirai cha kishirikishi chenye kibainishi kinamtaja mtu mwenye zoea la kuiba bila kumpa lebo ya kudumu ya ‘mwizi.’
- source_word: μηκέτι κλεπτέτω
  choice: asiibe tena
  rationale: Huwasilisha kwa Kiswahili cha kawaida amri ya kusitisha tendo lililokuwa likifanywa.
- source_word: μᾶλλον δὲ
  choice: bali
  rationale: Huonyesha ugeukaji mkali kutoka wizi kwenda njia mbadala iliyoamriwa.
- source_word: κοπιάτω
  choice: afanye kazi kwa bidii
  rationale: Kitenzi hiki kina maana ya kufanya kazi yenye juhudi, si kufanya kazi tu kwa ujumla.
- source_word: ἐργαζόμενος ... τὸ ἀγαθόν
  choice: akitenda yaliyo mema
  rationale: Huhifadhi upana wa usemi wa Kiyunani, unaoweza kumaanisha kutenda au kuzalisha kilicho chema, badala ya kuubana kuwa aina moja tu ya kazi.
- source_word: ταῖς ἰδίαις χερσὶν
  choice: kwa mikono yake mwenyewe
  rationale: Huhifadhi msisitizo wa kazi ya mtu binafsi iliyo halali na yenye kuleta matokeo.
- source_word: ἵνα ἔχῃ
  choice: ili awe na kitu
  rationale: Huhifadhi kusudi la kishazi; ‘kitu’ kinaongezwa kwa kawaida katika Kiswahili ili kufafanua mali au rasilimali ya kugawa.
- source_word: μεταδιδόναι
  choice: cha kumgawia
  rationale: Huonyesha kumpa mwingine kutoka katika alicho nacho; ‘kugawia’ ni ya kawaida na inafaa pamoja na yambwa ya mtu.
- source_word: τῷ χρείαν ἔχοντι
  choice: mwenye uhitaji
  rationale: Ni tafsiri fupi na ya asili ya mtu aliye na hitaji, bila kuongeza aina ya uhitaji.
theological_decisions:
- issue: Kusudi la kimaadili la kazi
  choice: Kazi ya halali inawekwa kinyume cha wizi na inalenga pia kumwezesha mtu kumsaidia mwenye uhitaji.
  alternative: Kusudi kuu ni kujitosheleza au kulipa kilichoibwa.
  rationale: Kishazi cha kusudi kinataja wazi kuwa kuwa na kitu ni kwa ajili ya kumgawia mwenye uhitaji. Kujitegemea kunaweza kudokezwa, lakini si lengo linalosisitizwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; ‘afanye kazi kwa bidii’ huhifadhi nguvu ya κοπιάτω, na ‘akitenda yaliyo mema’ huhifadhi upana halisi wa τὸ ἀγαθόν.
