  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: sw
  text: na kujivika utu mpya[a], ulioumbwa kulingana na Mungu[b], katika haki[c] na utakatifu wa kweli[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu mpya” au “nafsi mpya.” Kigiriki ni “mtu mpya,” unaolingana na usemi “mtu wa kale” katika muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa mfano wa Mungu” au “kwa namna ya Mungu.”
    reason: lexical_alternative
  - marker: c
    text: Neno “haki” hapa linaweza pia kusisitiza uadilifu.
    reason: semantic_range
  - marker: d
    text: Kihalisi, “katika haki na utakatifu wa ukweli.” Muundo wa Kigiriki unaweza pia kueleweka kuwa kweli inaeleza haki na utakatifu, au kuwa haki na utakatifu vina uhusiano na kweli.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: kuvaa
  rationale: Inaendeleza sitiari ya kuvua na kuvaa iliyo katika muktadha, kwa Kiswahili kifupi na cha kawaida.
- source_word: καινὸν
  choice: mpya
  rationale: Inahifadhi wazo la upya wa aina au tabia bila kulifafanua kupita kiasi kuwa ‘aliyefanywa upya.’
- source_word: ἄνθρωπον
  choice: mtu
  rationale: ‘Mtu mpya’ huhifadhi nomino halisi na uhusiano wake na ‘mtu wa kale’ katika muktadha, badala ya kuitafsiri moja kwa moja kuwa ‘nafsi’ au ‘utu.’
- source_word: κατὰ θεὸν
  choice: kulingana na Mungu
  rationale: Inahifadhi kwa upana maana ya kufuatana au kuwiana na Mungu bila kuamua wazi kuwa ni ‘kwa mfano wa Mungu.’
- source_word: κτισθέντα
  choice: aliyeumbwa
  rationale: Inahifadhi kauli tendwa na lugha ya uumbaji, huku ikirejelea wazi ‘mtu mpya.’
- source_word: δικαιοσύνῃ
  choice: haki
  rationale: ‘Haki’ ni neno la kawaida la Kiswahili linaloweza kuonyesha uadilifu na pia haki katika mahusiano; upana huo unafaa hapa.
- source_word: ὁσιότητι
  choice: utakatifu
  rationale: Ni neno la kawaida na lenye heshima kwa hali ya kuwa mtakatifu au mwenye kumcha Mungu.
- source_word: τῆς ἀληθείας
  choice: wa kweli
  rationale: Muundo huu ni wa asili zaidi kwa Kiswahili kuliko ‘wa ukweli’ na unaweza kueleweka kuwa haki na utakatifu halisi; tanbihi inadumisha muundo rasmi wa Kigiriki na uwezekano wa chanzo au uhusiano na kweli.
theological_decisions:
- issue: Usemi wa kibinadamu katika ‘mtu mpya’
  choice: mtu mpya
  alternative: utu mpya; nafsi mpya
  rationale: Kigiriki kimetumia nomino ἄνθρωπος, inayolingana na usemi wa ‘mtu wa kale’ katika muktadha. ‘Utu’ au ‘nafsi’ ni ufafanuzi unaowezekana lakini hupunguza mwangwi huo wa kileksia.
- issue: Maana ya κατὰ θεὸν
  choice: kulingana na Mungu
  alternative: kwa mfano wa Mungu; kwa kufuata Mungu
  rationale: Tafsiri iliyochaguliwa inaacha wazi kama Paulo anamaanisha kufanana na Mungu, kuwiana na mapenzi yake, au kufuata kielelezo chake.
- issue: Uhusiano wa τῆς ἀληθείας na haki pamoja na utakatifu
  choice: haki na utakatifu wa kweli
  alternative: haki na utakatifu wa ile kweli; haki na utakatifu unaotokana na kweli
  rationale: Kigiriki kinaweza kueleweka kuwa ‘kweli’ inaeleza sifa ya yote mawili au uhusiano wake na kweli. Matini kuu ni ya kawaida kwa Kiswahili, huku tanbihi ikihifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kuvaa imehifadhiwa, na miundo yenye utata wa kiteolojia haijafafanuliwa kimadhehebu.
