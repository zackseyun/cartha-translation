source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: sw
  text: mpaka sisi sote tufikie umoja wa imani[a] na wa kumjua Mwana wa Mungu[b], kufikia hali ya kuwa mwanamume aliyekomaa[c], na kufikia kipimo cha kimo[d] cha utimilifu wa Masihi[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umoja katika kuamini.” Maneno haya yanaweza kusisitiza ama imani ya Kikristo inayoshirikiwa, ama kuamini kwa waamini kwa ujumla.
    reason: alternative_reading
  - marker: b
    text: Au, “kumjua kikamilifu” au “kumjua kwa kina.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kufikia ukomavu kamili.” Kigiriki husema kihalisi “mwanamume aliyekomaa,” kwa kutumia taswira ya mwanamume mmoja kuelezea ukomavu wa pamoja wa kanisa lote.
    reason: lexical_alternative
  - marker: d
    text: Au, “ukomavu.”
    reason: lexical_alternative
  - marker: e
    text: Kigiriki, “Χριστοῦ.” Hapa limetafsiriwa “Masihi” kwa sababu maana yake kama cheo inajitokeza.
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: mpaka
  rationale: Inaonyesha kikomo au lengo la kazi ya kuwaandaa waamini iliyotajwa katika mstari uliotangulia.
- source_word: καταντήσωμεν οἱ πάντες
  choice: sisi sote tufikie
  rationale: Huhifadhi wazo la kufikia lengo pamoja na msisitizo kwamba jumuiya nzima inahusika.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: tufikie umoja wa imani
  rationale: Huhifadhi muundo unaolenga matokeo na pia utata halisi wa πίστις, ambayo yaweza kumaanisha imani inayoshirikiwa au tendo la kuamini.
- source_word: ἐπιγνώσεως
  choice: kumjua
  rationale: Katika Kiswahili, ‘kumjua Mwana wa Mungu’ ni usemi wa kawaida na wenye hadhi kuliko nomino nzito kama ‘maarifa’; uwezekano wa maana iliyotiwa nguvu umehifadhiwa katika tanbihi.
- source_word: εἰς ἄνδρα τέλειον
  choice: tufikie kuwa mwanamume aliyekomaa
  rationale: Huhifadhi taswira ya Kigiriki ya mwanamume mmoja aliyekomaa, inayotumiwa kwa ukomavu wa pamoja wa kanisa, bila kutafsiri τέλειος kuwa ukamilifu usio na kasoro.
- source_word: μέτρον ἡλικίας
  choice: kipimo cha kimo
  rationale: Huhifadhi taswira ya ukuaji wa mwili; ἡλικία inaweza pia kueleweka kuwa ukomavu.
- source_word: τοῦ πληρώματος
  choice: cha utimilifu
  rationale: ‘Utimilifu’ huhifadhi uzito na mwangwi wa neno la Paulo πλήρωμα bila kulipanua kwa maelezo ya kifafanuzi.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός hapa lina nguvu ya cheo cha Mtiwa-Mafuta, hivyo ‘Masihi’ linaonyesha maana hiyo wazi.
theological_decisions:
- issue: Maana ya τῆς πίστεως
  choice: umoja wa imani
  alternative: umoja katika kuamini
  rationale: Muktadha wa ukuaji wa jumuiya na matumizi ya kibainishi huunga mkono imani inayoshirikiwa, lakini maandishi makuu hayafungi uwezekano wa imani kama tendo la waamini.
- issue: Taswira ya εἰς ἄνδρα τέλειον
  choice: kuwa mwanamume aliyekomaa
  alternative: kufikia ukomavu kamili
  rationale: Umoja wa kiume katika Kigiriki ni taswira ya ushirika mzima unaokua; tafsiri kuu huihifadhi badala ya kuigeuza kimya kimya kuwa dhana isiyo na jinsia.
- issue: Maana ya ἡλικίας
  choice: kimo
  alternative: ukomavu
  rationale: ‘Kimo’ hudumisha taswira ya ukuaji, huku ‘ukomavu’ ikiwa maana halali inayolenga hatua ya ukuaji.
- issue: Jinsi ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno hilo linafanya kazi kama cheo cha Mtiwa-Mafuta; tanbihi inahifadhi namna nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Marudio ya ‘tufikie’ yanafafanua vipashio vitatu vinavyotawaliwa na εἰς na kusaidia usomaji wa kawaida, huku taswira nzito za ‘mwanamume aliyekomaa,’ ‘kipimo,’ ‘kimo,’ na ‘utimilifu’ zikihifadhiwa.
