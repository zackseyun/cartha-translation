lexical_decisions:
- source_word: μηδὲ
  choice: Wala msi-
  rationale: “Wala” linaendeleza mfululizo wa maagizo ya kukataza katika muktadha, huku “msi-” likibeba katazo kwa wingi.
- source_word: δίδοτε
  choice: mpe
  rationale: 'Kitenzi δίδωμι humaanisha “kupa”; katika muundo wa Kiswahili, yule anayepokea huonyeshwa ndani ya kitenzi: “msimpe Ibilisi.”'
- source_word: τόπον
  choice: nafasi
  rationale: τόπος kwa msingi ni “mahali” au “nafasi,” na hapa kwa namna ya kimethali humaanisha nafasi au fursa ya kutenda. “Nafasi” huhifadhi upana huo bila kuingiza taswira ya kijeshi kama “sehemu ya kujishikiza.”
- source_word: τῷ διαβόλῳ
  choice: Ibilisi
  rationale: Katika muktadha huu διάβολος pamoja na kibainishi humrejelea yule mwovu binafsi, si mchongezi wa kibinadamu kwa ujumla. “Ibilisi” ni jina la kawaida na linaloeleweka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Iwapo διάβολος litafsiriwe kama nomino ya kawaida “mchongezi” au kama jina la yule mwovu binafsi
  choice: Ibilisi
  alternative: mchongezi
  rationale: Katika mausia haya ya Paulo, usemi huu kwa kawaida humrejelea adui mwovu binafsi. “Ibilisi” huonyesha mrejelewa huyo bila kuongeza maelezo yasiyokuwamo katika sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa heshima na wa kawaida. “Wala msimpe” huunganisha mstari huu kwa kawaida na katazo lililotangulia; “nafasi” huhifadhi maana halisi na ya kimethali ya τόπον.
