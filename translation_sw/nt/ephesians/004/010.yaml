id: EPH.4.10
reference: Ephesians 4:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: sw
  text: Yeye aliyeshuka ndiye pia aliyepaa juu sana kuliko mbingu zote[a], ili avijaze vitu vyote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya mbingu zote.” Kirai hiki kinaweza kusisitiza kuinuliwa kwake juu ya kila eneo la mbinguni.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili avitimize vitu vyote.” Katika baadhi ya miktadha, kitenzi cha Kigiriki kinaweza kumaanisha “kutimiza,” lakini hapa “kujaza” kinafaa zaidi katika muktadha wa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: yeye aliyeshuka
  rationale: Kirai chenye kibainishi na kitenzi-jina cha wakati uliopita kinamtaja mtu hususa; kishazi rejeshi ni cha kawaida katika Kiswahili na kinahifadhi maana hiyo.
- source_word: αὐτός ἐστιν καὶ
  choice: ndiye pia
  rationale: Muundo huu unasisitiza kwamba aliyeshuka na aliyepaa ni mtu yuleyule; 'ndiye pia' huonyesha utambulisho huo kwa Kiswahili cha kawaida bila kuongeza maelezo.
- source_word: ὁ ἀναβὰς
  choice: aliyepaa
  rationale: Kishazi rejeshi kinadumisha ulinganifu na 'aliyeshuka' na kuwasilisha tendo la kupaa kwa lugha ya asili.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: juu sana kuliko mbingu zote
  rationale: '''Juu sana kuliko'' linaonyesha kupita mipaka na ukuu unaodokezwa na ὑπεράνω, huku wingi wa ''mbingu'' na maana ya πάντων vikihifadhiwa.'
- source_word: ἵνα
  choice: ili
  rationale: '''Ili'' linaonyesha kusudi kwa ufupi na kwa Kiswahili sanifu.'
- source_word: πληρώσῃ
  choice: avijaze
  rationale: Maana ya msingi ya kujaza inafaa muktadha; hali ya kiambishi 'a-' baada ya 'ili' huwasilisha kusudi bila kulazimisha tafsiri ya 'kutimiza.'
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Kirai hiki kinahifadhi upeo mpana wa usemi wa Kigiriki bila kuufupisha kuwa watu pekee au kuufasiri moja kwa moja kuwa ulimwengu mzima.
theological_decisions:
- issue: Utambulisho wa aliyeshuka na aliyepaa
  choice: '''Ndiye pia'' linasisitiza kwamba ni mtu yuleyule.'
  alternative: Kutumia muundo usio na msisitizo, kama 'pia alipaa.'
  rationale: αὐτός pamoja na virai viwili vyenye kibainishi inasisitiza utambulisho uleule; tafsiri inadumisha msisitizo huo bila kuongeza ufafanuzi wa kiteolojia.
- issue: Upeo wa τὰ πάντα
  choice: vitu vyote
  alternative: kila mtu; ulimwengu mzima
  rationale: Usemi wa Kigiriki ni mpana kimakusudi. 'Vitu vyote' huhifadhi upana huo bila kuubana kwa watu au kuupanua kwa ufafanuzi mahususi wa ulimwengu.
- issue: Maana ya πληρώσῃ
  choice: avijaze
  alternative: avitimimize
  rationale: Katika muktadha huu maana ya 'kujaza' inafaa zaidi, lakini uwezekano wa 'kutimiza' umetajwa katika tanbihi ili kutohitimisha kimya kimya suala la kimsamiati.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa Biblia lakini unaeleweka kwa watu wa kawaida; unahifadhi wingi wa 'mbingu,' msisitizo wa mtu yuleyule, na upeo mpana wa 'vitu vyote.'
