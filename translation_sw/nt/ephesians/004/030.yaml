  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: sw
  text: Wala msiihuzunishe Roho Mtakatifu wa Mungu, ambaye ninyi mlitiwa muhuri ndani yake kwa ajili ya siku ya ukombozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi siku ya ukombozi.” Kigiriki kinasema “kwa ajili ya siku ya ukombozi” (εἰς ἡμέραν ἀπολυτρώσεως), usemi unaoweza kueleweka ukiwa na mwelekeo wa wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: msimhuzunishe
  rationale: Kitenzi hiki kikiwa na μή kinatoa katazo. “Kuhuzunisha” huhifadhi maana ya kumsababishia huzuni na uzito wa uhusiano wa kibinafsi.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: Roho Mtakatifu wa Mungu
  rationale: Huhifadhi jina kamili pamoja na kirai cha umilikaji τοῦ θεοῦ kwa Kiswahili sanifu na cha kawaida.
- source_word: ἐν ᾧ
  choice: ambaye ndani yake
  rationale: “Ambaye” humrejelea Roho Mtakatifu kibinafsi, huku “ndani yake” ikihifadhi kwa kadiri iwezekanavyo maana ya ἐν badala ya kuibadili moja kwa moja kuwa kiwakilishi cha utendaji, “ambaye kwa yeye.”
- source_word: ἐσφραγίσθητε
  choice: mlitiwa muhuri
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na taswira ya muhuri bila kufafanua zaidi ikiwa ni ya umiliki, uthibitisho au ulinzi.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: kwa ajili ya siku ya ukombozi
  rationale: “Kwa ajili ya” huhifadhi mwelekeo wa lengo au kusudi wa εἰς, na “siku ya ukombozi” ni usemi wa asili unaoelekea kwenye utimilifu wa baadaye.
theological_decisions:
- issue: Kumrejelea Roho Mtakatifu kibinafsi katika kishazi cha uhusiano
  choice: ambaye ndani yake
  alternative: ambacho ndani yake
  rationale: Ingawa πνεῦμα na kiwakilishi chake ni vya jinsia ya kati kisarufi katika Kigiriki, muktadha humwonyesha Roho Mtakatifu kama anayehuzunishwa. Kiswahili kinatumia rejeo la kibinafsi bila kumfanya Roho kuwa nguvu isiyo na nafsi.
- issue: Uhusiano wa kutiwa muhuri na siku ya ukombozi
  choice: kwa ajili ya siku ya ukombozi
  alternative: hadi siku ya ukombozi
  rationale: Tafsiri hii huhifadhi hasa mwelekeo wa lengo wa εἰς na haifanyi maana yake kuwa ya muda pekee. Maana ya “hadi” imehifadhiwa katika tanbihi kama uwezekano wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mlitiwa muhuri” huhifadhi sitiari ya chanzo; “ambaye ndani yake” ni rasmi kiasi lakini huhifadhi rejeo la kibinafsi na kihusishi cha Kigiriki.
