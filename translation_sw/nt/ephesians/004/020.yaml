  source_fidelity: “Lakini ninyi hamkumjifunza Masihi kwa namna hiyo” faithfully represents the explicit plural contrast (ὑμεῖς δέ), the negated manner (οὐχ οὕτως), the active aorist ‘learned’ (ἐμάθετε), and the deliberately unusual personal object, τὸν Χριστόν. The object prefix in hamkumjifunza naturally marks Masihi as the personal object without adding meaning.
