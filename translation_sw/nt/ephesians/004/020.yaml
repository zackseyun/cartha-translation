  text: But you did not learn Messiah in this way,[a]
translation:
  language: sw
  text: Lakini ninyi hamkumjifunza Masihi kwa namna hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini ninyi hamkumjifunza Kristo kwa namna hiyo.”
    reason: Tafsiri mbadala ya Χριστόν kama “Kristo” badala ya cheo “Masihi.”
lexical_decisions:
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi kwa ajili ya mkazo na utofautishaji; “ninyi” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya waamini na mwenendo wa watu wa mataifa ulioelezwa kabla.
- source_word: οὐχ οὕτως
  choice: si kwa namna hiyo
  rationale: Huelekeza kwenye namna ya maisha iliyotangulia; katika muundo wa sentensi ya Kiswahili kinakuwa “hamkumjifunza ... kwa namna hiyo.”
- source_word: ἐμάθετε
  choice: hamkumjifunza
  rationale: Kitenzi μανθάνω kinamaanisha “kujifunza.” Muundo usio wa kawaida wa kujifunza mtu umehifadhiwa kwa sababu ni usemi wa makusudi wa Paulo; “mlifundishwa” ungeingiza hali tendwa ambayo haipo hapa.
- source_word: τὸν Χριστόν
  choice: Masihi
  rationale: Χριστός imehifadhiwa kama cheo chenye maana ya Mtiwa-Mafuta. Hakuna jina “Yesu” lililoongezwa, na usemi wa kumjifunza Masihi umeachwa bila kufafanuliwa kupita kiasi.
theological_decisions:
- issue: Kutafsiri Χριστόν kama cheo au kama jina lililozoeleka
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linaweza kusikika kama cheo au jina. Maandishi makuu yanahifadhi maana ya cheo “Masihi,” huku tanbihi ikitoa “Kristo” kama tafsiri mbadala inayokubalika bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa makusudi lakini usio wa kawaida “kumjifunza Masihi” umehifadhiwa ili kutopunguza upekee wa usemi wa Kigiriki.
