    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Kasirikeni
  rationale: Huhifadhi hali ya amri ya Kigiriki na mwangwi unaowezekana wa Zaburi 4:4 (LXX 4:5), bila kuibadili kimyakimya kuwa sentensi ya sharti.
- source_word: μὴ ἁμαρτάνετε
  choice: lakini msitende dhambi
  rationale: Ni katazo la moja kwa moja. Kiunganishi “lakini” kinaonyesha kwa Kiswahili cha kawaida mvutano uliopo kati ya amri ya kwanza na katazo, bila kuongeza maelezo ya kiteolojia.
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: Jua lisichwe
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayoeleza jua kutua na kuhifadhi nguvu ya amri ya nafsi ya tatu.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: mkiwa bado na hasira
  rationale: Huwasilisha kwa lugha ya kawaida wazo la jua kutua wakati hasira bado inaendelea. παροργισμός inaweza kumaanisha hasira, uchokozi, au hali ya kukerwa, hivyo mbadala umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Iwapo kishazi cha kwanza ni amri inayoruhusu hasira au ni kauli ya masharti yenye maana ya kukubali hali iliyopo
  choice: 'Imetafsiriwa kama amri: “Kasirikeni, lakini msitende dhambi.”'
  alternative: “Mnapokasirika, msitende dhambi.”
  rationale: 'Umbo la Kigiriki ni amri. Tafsiri hii hulihifadhi pamoja na mvutano wa kifungu: hasira haijaidhinishwa bila mipaka, kwa kuwa mara moja inawekewa mpaka wa kutotenda dhambi na wa kutodumu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. “Kasirikeni” huhifadhi amri ya asili; “Jua lisichwe” ni usemi wa asili na mfupi. Alama zote za tanbihi zimewekwa katika matini kuu.
