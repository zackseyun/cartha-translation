  footnotes:
  - marker: a
    text: Au, “Mkiwa na hasira, msitende dhambi.” Kigiriki kwa umbo halisi ni amri (“Kasirikeni”), lakini wengine huielewa katika muktadha huu kuwa amri yenye maana ya kukubali hali fulani.
