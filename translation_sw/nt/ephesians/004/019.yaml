lexical_decisions:
- source_word: οἵτινες
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza maelezo kuhusu watu waliotajwa katika mstari uliotangulia, huku kikihifadhi kazi ya kiwakilishi cha uhusiano bila kuongeza msisitizo usio lazima.
- source_word: ἀπηλγηκότες
  choice: wakiwa wamekufa ganzi
  rationale: Kauli hii ya kitamathali inaonyesha hali iliyotokana na kupoteza uwezo wa kuitikia mambo ya maadili; pia inadumisha nguvu ya hali endelevu iliyo katika wakati timilifu wa Kigiriki.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: walijiachia
  rationale: Kitenzi pamoja na kiwakilishi cha kujirejelea kinaonyesha kuwa walijisalimisha kwa hiari katika mwenendo huo. ‘Walijiachia’ ni Kiswahili cha kawaida kinachoonyesha kujitosa bila kujizuia.
- source_word: τῇ ἀσελγείᾳ
  choice: katika upotovu usio na aibu
  rationale: ἀσέλγεια ni mwenendo wa kujifurahisha usio na kiasi wala aibu, mara nyingi ukiwa wa kingono lakini si lazima uwe wa kingono pekee. Tafsiri hii inadumisha upana huo.
- source_word: εἰς ἐργασίαν
  choice: ili kujishughulisha na
  rationale: Kirai hiki kinaonyesha kusudi au matokeo ya kujitoa kwao, yaani kuendeleza kwa bidii au kwa mazoea matendo yanayotajwa.
- source_word: ἀκαθαρσίας πάσης
  choice: kila namna ya uchafu
  rationale: Hii inaonyesha kwa Kiswahili cha kawaida upana wa πάσης, yaani uchafu wa kila aina, huku ‘uchafu’ ukidumisha maana pana ya kimaadili.
- source_word: ἐν πλεονεξίᾳ
  choice: kwa tamaa isiyotosheka
  rationale: πλεονεξία huonyesha hamu ya kujipatia zaidi isiyotosheka. Katika muktadha huu kirai kinaeleza namna walivyotenda uchafu, huku tanbihi ikihifadhi uwezekano wa maana ya uchoyo au ulafi.
theological_decisions:
- issue: Nguvu ya kimaadili na kisaikolojia ya ἀπηλγηκότες
  choice: wakiwa wamekufa ganzi
  alternative: wakiwa wamepoteza uwezo wote wa kuhisi
  rationale: Muktadha unaeleza kutokuwa na mwitikio wa kimaadili, si kutokuwa na hisia za kawaida au hali ya kitabibu. Tamathali ya kufa ganzi inadumisha ukali huo bila kuongeza neno ‘dhamiri,’ ambalo halipo wazi katika Kigiriki.
- issue: Upana wa maana ya ἀσέλγεια
  choice: upotovu usio na aibu
  alternative: ufisadi; maisha ya anasa yasiyo na kiasi
  rationale: Neno la Kigiriki linaweza kuhusisha uasherati lakini si lazima liwe dhambi ya kingono pekee. Tafsiri pana huepuka kulibana kwa fundisho moja huku ikidumisha kutokuwa na aibu na kutokuwa na kiasi.
- issue: Maana ya πλεονεξία katika muktadha
  choice: tamaa isiyotosheka
  alternative: uchoyo; ulafi
  rationale: Inaweza kumaanisha tamaa ya kutaka zaidi au uchoyo. Hapa inaelekea kueleza namna ya kujishughulisha na uchafu, yaani bila kushiba; tanbihi inadumisha maana nyingine ya kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wamekufa ganzi’ na ‘tamaa isiyotosheka’ ni misemo inayoeleweka kwa wasomaji wa kawaida; tanbihi zinahifadhi mbadala za kileksika na utata wa kirai cha mwisho.
