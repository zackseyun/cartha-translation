id: EPH.4.1
reference: Ephesians 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: sw
  text: Kwa hiyo, mimi niliye mfungwa katika Bwana[a], nawasihi mwenende kwa namna inayoustahili mwito mlioitiwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfungwa wa Bwana” au “mfungwa kwa ajili ya Bwana.”
    reason: alternative_reading
  - marker: b
    text: Au “muishi kwa namna inayoustahili mwito mlioitiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: nawasihi
  rationale: Kitenzi hiki kinaonyesha ombi la kichungaji lenye uzito na himizo; “nawasihi” ni cha kawaida, chenye heshima, na kina nguvu inayofaa katika Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho au matokeo yanayotokana na hoja iliyotangulia, hivyo inadumisha uhusiano wa kimantiki na sehemu zilizotangulia za barua.
- source_word: δέσμιος
  choice: mfungwa
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa mtu aliye kifungoni.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Tafsiri hii inadumisha usemi mpana wa Paulo bila kuufanya umaanishwe tu kuwa “kwa ajili ya Bwana” au “mfungwa wa Bwana.”
- source_word: ἀξίως
  choice: kwa namna inayoustahili
  rationale: Hueleza mwenendo unaolingana ipasavyo na mwito. Muundo huu ni wa asili zaidi katika Kiswahili kuliko kielezi kifupi kisicho cha kawaida.
- source_word: περιπατῆσαι
  choice: mwenende
  rationale: “Mwenende” inadumisha sitiari ya kutembea inayotumiwa na Paulo kuhusu namna ya kuishi, huku ikiwa inaeleweka katika Kiswahili cha kibiblia cha sasa.
- source_word: κλήσεως
  choice: mwito
  rationale: “Mwito” huwasilisha kitendo cha Mungu cha kuita na hali ambayo waamini wameitiwa, bila kuupunguza kuwa mwaliko wa kawaida.
- source_word: ἧς ἐκλήθητε
  choice: mlioitiwa
  rationale: Muundo huu unaonyesha kwamba huo ndio mwito waliopokea. Unadumisha urudiaji wa mzizi wa maneno κλῆσις na καλέω kwa kutumia “mwito” na “itiwa.”
theological_decisions:
- issue: Maana ya maelezo ya Paulo ὁ δέσμιος ἐν κυρίῳ
  choice: mfungwa katika Bwana
  alternative: mfungwa wa Bwana; mfungwa kwa ajili ya Bwana
  rationale: '“Katika Bwana” inadumisha utata halisi wa kirai cha Kigiriki: kifungo cha Paulo kinaelezwa katika uhusiano na Bwana bila kuamua kwamba maana yake ni umiliki au sababu pekee.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mwenende” limetumiwa kuhifadhi sitiari ya Kigiriki ya kutembea kama namna ya kuishi; tanbihi inatoa maana hiyo kwa lugha ya moja kwa moja.
