base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: sw
  text: Lakini kila mmoja wetu alipewa neema kwa kadiri ya kipimo cha zawadi ya Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zawadi ya Kristo.” Neno la Kigiriki Χριστοῦ linaweza kutafsiriwa “Kristo” linapotumiwa zaidi kama jina, lakini hapa “Masihi” linahifadhi maana yake kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ δὲ ἑκάστῳ ἡμῶν
  choice: Lakini kila mmoja wetu
  rationale: δὲ inaonyesha mgeuko mdogo kutoka umoja uliosisitizwa katika mistari iliyotangulia kwenda kwenye utofauti wa mgao; “kila mmoja wetu” linahifadhi msisitizo wa kigawanyo wa ἑνὶ ... ἑκάστῳ.
- source_word: ἐδόθη
  choice: alipewa
  rationale: Kauli hii ya wakati uliopita katika hali ya kutendwa inatafsiriwa kwa kawaida na kwa uwazi kuwa “alipewa,” huku mhusika akiwa kila mmoja wetu.
- source_word: ἡ χάρις
  choice: neema
  rationale: “Neema” linahifadhi msamiati wenye uzito wa kitheolojia wa Paulo bila kuubana kuwa kipawa cha huduma pekee, ingawa muktadha unaelekea kwenye uwezeshaji uliogawiwa kwa ajili ya huduma.
- source_word: κατὰ τὸ μέτρον
  choice: kwa kadiri ya kipimo cha
  rationale: Kirai hiki kinaonyesha kiwango au uwiano unaoongoza mgao; tafsiri hii inahifadhi wazo la μέτρον bila kulifanya kuwa maelezo yaliyo wazi kuliko Kigiriki.
- source_word: τῆς δωρεᾶς
  choice: zawadi
  rationale: “Zawadi” ni neno la kawaida na la heshima kwa kitu kinachotolewa bure, na huepuka urudiaji usio wa lazima karibu na “alipewa neema.”
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa bado lina nguvu ya cheo; “Masihi” linahifadhi maana hiyo. Muundo “ya Masihi” pia hauamui kimya kimya kama genitivi inaonyesha chanzo, umiliki, au uhusiano mwingine wa karibu.
theological_decisions:
- issue: Maana ya χάρις katika muktadha
  choice: neema
  alternative: kipawa cha neema / uwezeshaji wa neema
  rationale: Muktadha wa mistari 7–11 unaelekea kwenye neema inayogawiwa kwa huduma, lakini neno “neema” linahifadhi upana na mvutano wa istilahi ya Paulo badala ya kuifafanua kupita kiasi ndani ya mstari.
- issue: Jinsi ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Hapa cheo cha Χριστός kinaendelea kuwa na maana; “Masihi” huwasilisha maana ya cheo, huku tanbihi ikitaja tafsiri nyingine iliyozoeleka.
- issue: Uhusiano unaoonyeshwa na genitivi katika τῆς δωρεᾶς τοῦ Χριστοῦ
  choice: zawadi ya Masihi
  alternative: zawadi aliyotoa Masihi
  rationale: Kigiriki kinaweza kueleweka kuwa zawadi inayomhusu au inayotolewa na Masihi. Muundo wa Kiswahili “ya Masihi” unahifadhi uwezekano huo badala ya kuamua wazi kwamba ni genitivi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi msisitizo wa kila mtu binafsi na istilahi ya Paulo “neema,” bila kuingiza ufafanuzi wa kimadhehebu.
