base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: sw
  text: Muwe wenye fadhili ninyi kwa ninyi, wenye huruma, mkisameheana, kama vile Mungu pia alivyowasamehe katika Masihi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνεσθε
  choice: muwe
  rationale: Amri ya wakati wa sasa inatoa wito wa kuwa na tabia hii kwa kuendelea. “Muwe” ni ya kawaida na ya moja kwa moja katika Kiswahili; “geukeni kuwa” ingesisitiza mabadiliko kuliko inavyohitajika hapa.
- source_word: εἰς ἀλλήλους
  choice: kwa ninyi kwa ninyi
  rationale: Huhifadhi mwelekeo wa mahusiano na maana ya kutendeana, kwa mtindo wa kawaida wa Kiswahili cha Biblia.
- source_word: χρηστοί
  choice: wenye fadhili
  rationale: Huonyesha wema unaodhihirika katika jinsi mtu anavyowatendea wengine. “Wema” pekee ungekuwa mpana zaidi.
- source_word: εὔσπλαγχνοι
  choice: wenye huruma
  rationale: Neno hili huonyesha huruma ya ndani na ya dhati. Tafsiri hii ni ya asili na inaeleweka kwa wasomaji wa sasa.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: mkisameheana
  rationale: Katika muktadha huu χαρίζομαι humaanisha kuondoleana kosa kwa neema, na ἑαυτοῖς ina nguvu ya kutendeana. Kitenzi cha Kiswahili “kusameheana” huunganisha maana hizo kwa usahihi.
- source_word: καθὼς καὶ
  choice: kama vile ... pia
  rationale: “Kama vile” huonyesha ulinganisho, na “pia” huhifadhi nguvu ya καί bila kufanya sentensi kuwa nzito.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: “Masihi” hutafsiri Χριστός kama cheo, na “katika” huhifadhi kwa makusudi upana wa ἐν badala ya kuamua kuwa maana yake ni “kwa njia ya.”
- source_word: ἐχαρίσατο ὑμῖν
  choice: alivyowasamehe ninyi
  rationale: Muktadha wa kusameheana unaonyesha kuwa χαρίζομαι hapa ni kusamehe. “Ninyi” imewekwa wazi ili kuhifadhi msisitizo wa kiwakilishi cha Kigiriki.
theological_decisions:
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός hapa inafanya kazi kama cheo. “Masihi” huwasilisha maana ya cheo hicho, ilhali “Kristo” ni umbo lililotoholewa kwa kufuata sauti.
- issue: Maana ya ἐν katika ἐν Χριστῷ
  choice: katika Masihi
  alternative: kwa njia ya Masihi
  rationale: “Katika” huhifadhi uhusiano mpana unaoweza kuonyeshwa na ἐν na haubani usemi huo kuwa chombo tu cha tendo. Hivyo mvutano wa kitheolojia wa usemi wa Paulo haujatatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa ushauri wa kimaadili umehifadhiwa, na vishazi vimepangwa kwa mtiririko wa kawaida wa Kiswahili.
