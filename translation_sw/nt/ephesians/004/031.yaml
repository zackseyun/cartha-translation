  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: sw
  text: Kinyongo chote, ghadhabu, hasira, kelele na matukano[a] yaondolewe miongoni mwenu, pamoja na kila aina ya nia mbaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kashfa”; kijadi, “kufuru.” Katika muktadha huu, neno la Kigiriki huenda linamaanisha maneno yenye kuumiza au kudhalilisha wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: uchungu wote wa moyo
  rationale: “Uchungu wa moyo” hueleweka kwa kawaida kuwa kinyongo au uchungu wa ndani, na “wote” huhifadhi wazo la kuondolewa kabisa.
- source_word: θυμός
  choice: ghadhabu
  rationale: “Ghadhabu” inaonyesha msukumo mkali wa hasira na kuitofautisha na ὀργή inayofuata.
- source_word: ὀργή
  choice: hasira
  rationale: “Hasira” ni neno la kawaida na la wazi, huku likidumisha tofauti ya kiasi na “ghadhabu.”
- source_word: κραυγή
  choice: kelele
  rationale: Katika orodha hii ya maovu, neno hilo linamaanisha kelele au kupaza sauti kwa uhasama, si kilio cha kawaida.
- source_word: βλασφημία
  choice: matukano
  rationale: Muktadha wa mahusiano ya kijamii unaelekeza kwenye maneno yanayowaumiza au kuwadhalilisha wengine. “Matukano” huhifadhi upana huo kuliko neno linalodai lazima kuwe na shtaka la uongo.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: yaondolewe miongoni mwenu
  rationale: Huhifadhi kauli tendwa ya amri na kuonyesha kwamba mambo haya yaondolewe katika mwenendo na maisha ya pamoja ya waamini.
- source_word: σὺν πάσῃ κακίᾳ
  choice: pamoja na kila aina ya nia mbaya
  rationale: κακία hapa linaelekea kumaanisha uovu wa nia au chuki yenye kusudi la kudhuru; “kila aina” huwasilisha nguvu ya πάσῃ kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya βλασφημία katika orodha ya maovu ya kijamii
  choice: matukano yanayoelekezwa kwa watu
  alternative: kashfa; kufuru inayoelekezwa kwa Mungu
  rationale: Maneno yanayozunguka neno hili yanahusu mitazamo na usemi unaoharibu mahusiano. Tafsiri “matukano” inafaa muktadha huo bila kuzuia neno katika maana ya kumkufuru Mungu; tanbihi inadumisha maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uchungu wa moyo” huepuka kueleweka kama maumivu ya mwili, na jozi “ghadhabu, hasira” huhifadhi tofauti inayowezekana kati ya θυμός na ὀργή bila kuifafanua kupita kiasi.
