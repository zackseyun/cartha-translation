  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: sw
  text: Neno “alipaa” lina maana gani isipokuwa kwamba pia alishuka katika sehemu za chini za dunia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika maeneo ya chini, yaani, dunia”; kirai hiki kinaweza kurejelea kushuka tu duniani, au hasa kushuka katika ulimwengu wa wafu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνέβη
  choice: alipaa
  rationale: Kitenzi hiki kinaonyesha mwendo wa kwenda juu na kinarudia neno lililonukuliwa katika mstari uliotangulia; “alipaa” ni Kiswahili cha kawaida katika muktadha huu na kinadumisha ulinganifu na “alishuka.”
- source_word: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι
  choice: Basi, neno “alipaa” lina maana gani isipokuwa kwamba
  rationale: Muundo huu unauliza hitimisho linalotokana na neno lililonukuliwa. “Neno ‘alipaa’ lina maana gani” ni la asili kwa Kiswahili, huku “isipokuwa kwamba” ikihifadhi nguvu ya hoja ya εἰ μὴ ὅτι. “Basi” inawakilisha kiunganishi δέ bila kukipa maana ya wakati.
- source_word: καὶ κατέβη
  choice: pia alishuka
  rationale: “Pia” inahifadhi maana ya nyongeza ya καί, na “alishuka” inadumisha picha ya mwendo unaokinzana na “alipaa.”
- source_word: εἰς
  choice: hadi
  rationale: Katika Kiswahili, baada ya “alishuka,” neno “hadi” linaonyesha kwa kawaida na wazi mwendo unaofikia mahali fulani, bila kudhoofisha uelekeo wa εἰς.
- source_word: τὰ κατώτερα μέρη
  choice: sehemu za chini
  rationale: “Sehemu za chini” inahifadhi maana ya ulinganisho ya κατώτερα na maana ya μέρη bila kuamua mapema ikiwa ni maeneo ya duniani au ulimwengu wa wafu.
- source_word: τῆς γῆς
  choice: za dunia
  rationale: “Dunia” inafaa kwa utofautishaji wa juu na chini katika muktadha. Muundo “za dunia” unaacha wazi iwapo dunia inaeleza sehemu hizo au ndiyo yenye sehemu hizo za chini.
theological_decisions:
- issue: Maana ya εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: hadi sehemu za chini za dunia
  alternative: hadi maeneo ya chini, yaani, dunia; au hadi eneo la wafu
  rationale: Kigiriki kinaweza kueleweka kuwa Kristo alishuka duniani kutoka mbinguni, au kuwa alishuka hasa katika eneo la wafu. Matini kuu haichagui tafsiri moja ya kimafundisho, na tanbihi inaonyesha maana kuu zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa leo, huku taswira ya kupaa na kushuka pamoja na utata halisi wa kirai cha mwisho vikihifadhiwa.
