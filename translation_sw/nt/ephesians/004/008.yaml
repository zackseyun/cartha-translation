  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: sw
  text: 'Kwa hiyo Maandiko yanasema: “Baada ya kupaa juu[a], aliteka mateka[b] na kuwapa watu zawadi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alipopaa juu.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina usemi wa mkazo unaoweza kutafsiriwa pia, “aliongoza mateka akiwa amewateka” au “aliteka kundi la mateka.” Usemi huo unatoa mwangwi wa Zaburi 68:18.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaendeleza uhusiano wa kimantiki na hoja iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: λέγει
  choice: Maandiko yanasema
  rationale: Kitenzi hakina kiima kilichotajwa wazi, lakini muktadha ni utangulizi wa nukuu ya Maandiko; Kiswahili huhitaji kiima kilicho wazi zaidi kuliko usemi usio na kiima wa Kigiriki.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: Alipopaa juu
  rationale: Muundo huu unaonyesha kupaa kunakohusiana kwa karibu na matendo makuu yanayofuata na unasikika kiasili kwa Kiswahili, huku ukihifadhi mwangwi wa Zaburi 68:18.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: aliteka mateka
  rationale: Kigiriki kina usemi wa mkazo unaotumia maneno yenye mzizi mmoja. Kiswahili ‘aliteka mateka’ huhifadhi uradidi huo kwa njia ya asili zaidi kuliko tafsiri halisi ya nomino dhahania ‘utumwa.’
- source_word: ἔδωκεν δόματα
  choice: akawapa ... zawadi
  rationale: Hutoa kwa uwazi tendo la kutoa na walengwa wake katika mpangilio wa kawaida wa Kiswahili.
- source_word: τοῖς ἀνθρώποις
  choice: watu
  rationale: ἄνθρωποι hapa ina maana ya jumla ya wanadamu, si wanaume pekee; ‘watu’ ndiyo tafsiri sahihi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Taswira ya ᾐχμαλώτευσεν αἰχμαλωσίαν katika nukuu iliyorekebishwa ya Zaburi 68:18
  choice: aliteka mateka
  alternative: aliuteka uteka; aliongoza kundi la mateka
  rationale: ‘Aliteka mateka’ huhifadhi usemi wenye maneno ya mzizi mmoja na kuacha wazi utambulisho wa mateka, bila kuamua kimafundisho wao ni nani.
- issue: Kiima kisichotajwa cha λέγει
  choice: Maandiko yanasema
  alternative: anasema; inasema
  rationale: Muktadha unaonyesha fomula ya kunukuu Maandiko. Kumtaja Mungu moja kwa moja kama kiima kungezidi ushahidi wa sarufi, huku ‘inasema’ bila rejea ikisikika pungufu katika Kiswahili.
- issue: Maana ya jumla ya τοῖς ἀνθρώποις
  choice: watu
  alternative: wanadamu; wanaume
  rationale: Nomino hiyo ni ya jumla katika muktadha huu. ‘Watu’ inajumuisha wanadamu bila kuingiza dai kwamba zawadi zilitolewa kwa wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Alipopaa juu’ na ‘aliteka mateka’ ni vifupi, vinaeleweka kwa wasomaji wa kawaida, na vinahifadhi urari pamoja na mwangwi wa kishairi wa nukuu.
