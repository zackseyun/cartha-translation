  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: sw
  text: kuvua, kwa habari ya mwenendo wenu wa zamani, mtu wa kale[a], anayeendelea kuharibika kulingana na tamaa za udanganyifu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utu wa zamani.” Kwa neno halisi, “mtu wa kale.” Usemi wa Kigiriki unatumia “mtu” kuwakilisha hali ya awali ya maisha ya mwanadamu, wala haumrejelei mwanamume pekee.
    reason: alternative_reading
  - marker: b
    text: Kwa neno halisi, “tamaa za udanganyifu”; yaani, tamaa zenye sifa ya udanganyifu au zinazoumbwa na udanganyifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: kuvua
  rationale: Kitenzi hiki hudumisha sitiari ya kuvua vazi, ambayo inaendelea kwa wazo la kuvaa katika mstari wa 24, huku umbo la kitenzi-jina likihifadhi utegemezi wake kwa muktadha uliotangulia.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: kwa habari ya mwenendo wenu wa zamani
  rationale: Hapa κατά inaonyesha jambo linalorejelewa, na ἀναστροφή ni mwenendo au namna ya kuishi. Kauli hii ni ya kawaida na inaweka wazi uhusiano na maisha yao yaliyopita.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: mtu wa kale
  rationale: Hii inafuata picha halisi ya Kigiriki ya ‘mtu wa kale’ badala ya kuibadili moja kwa moja kuwa ‘nafsi ya zamani’; tanbihi inaeleza kuwa usemi huo unawakilisha hali ya awali ya mwanadamu.
- source_word: τὸν φθειρόμενον
  choice: anayezidi kuharibika
  rationale: Kauli ya sasa ya kutendwa inaonyesha mchakato unaoendelea wa upotovu au uharibifu. ‘Anayezidi kuharibika’ huwasilisha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: kulingana na tamaa za udanganyifu
  rationale: ‘Kulingana na’ huonyesha nguvu ya κατά kama kiwango au ushawishi unaotawala, na ‘tamaa za udanganyifu’ huhifadhi muundo na utata wa genitivi bila kuufanya ulenge tamaa za kingono pekee.
theological_decisions:
- issue: Maana ya τὸν παλαιὸν ἄνθρωπον
  choice: mtu wa kale
  alternative: utu wa zamani
  rationale: ‘Mtu wa kale’ huhifadhi usemi wa kiwakilishi wa Kigiriki na mwangwi wake mpana wa kibinadamu au kijumuiya. Tanbihi huzuia usomaji unaodhani kuwa unamhusu mwanamume pekee.
- issue: Nguvu ya ἀποθέσθαι katika muktadha
  choice: kuvua
  alternative: kwamba mvue
  rationale: Umbo la kitenzi-jina linahifadhi sintaksia ya Kigiriki na halilazimishi kuamua kama kauli hii ni amri ya moja kwa moja, maudhui ya mafundisho, au maelezo ya tukio la kuongoka.
- issue: Uhusiano katika τῆς ἀπάτης
  choice: tamaa za udanganyifu
  alternative: tamaa zidanganyazo
  rationale: Muundo wa ‘za udanganyifu’ huhifadhi uwezekano kwamba tamaa hizo zina sifa ya udanganyifu au zimeumbwa na udanganyifu, badala ya kuamua kimya-kimya kwamba tamaa zenyewe ndizo zinazodanganya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kuvua’ inadumisha sitiari ya mavazi; ‘mwenendo’ ni neno linaloeleweka kwa kawaida na linalobeba maana ya kimaadili. Alama zote za tanbihi zimewekwa katika matini.
