  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: sw
  text: 'Kwa hiyo, nasema hili na ninashuhudia katika Bwana: msiendelee tena kuenenda kama watu wa mataifa wanavyoenenda[a], katika ubatili wa akili zao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama mataifa yanavyoenenda”; wengine hutafsiri ἔθνη hapa kuwa “wapagani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο οὖν λέγω
  choice: Kwa hiyo, nasema hili
  rationale: “Kwa hiyo” linaonyesha hitimisho linalotokana na mausia yaliyotangulia, huku “nasema hili” likihifadhi Τοῦτο kama yambwa wa λέγω kwa Kiswahili cha kawaida.
- source_word: μαρτύρομαι
  choice: kushuhudia
  rationale: Kitenzi hiki kina uzito wa uthibitisho wa dhati unaofanana na ushahidi; “kushuhudia” huhifadhi maana hiyo bila kukifafanua kupita kiasi kuwa “nasisitiza.”
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi kwa karibu kirai cha Kigiriki na uwezekano wake wa kuonyesha mazingira au mamlaka ambayo Paulo anasema ndani yake.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: msiendelee tena kuenenda
  rationale: “Msiendelee tena” huonyesha agizo la kukomesha mwenendo wa zamani. “Kuenenda” huhifadhi sitiari ya περιπατέω ya mwenendo wa maisha, ingawa ni rasmi kidogo kuliko “kuishi.”
- source_word: καθὼς καὶ τὰ ἔθνη
  choice: kama watu wa mataifa
  rationale: “Watu wa mataifa” huhifadhi maana ya ἔθνη kama wasio Wayahudi bila kuongeza hukumu ya kidini iliyomo katika neno “wapagani.” Kiambishi καὶ hakihitaji kila mara kutafsiriwa kwa “pia” katika Kiswahili, ambako kingefanya sentensi iwe nzito.
- source_word: περιπατεῖ
  choice: wanavyoenenda
  rationale: Kurudia “kuenenda” kunadumisha uradidi wa kimakusudi wa mzizi περιπατέω na sitiari yake ya kimaadili.
- source_word: ἐν ματαιότητι
  choice: katika ubatili
  rationale: “Ubatili” huonyesha hali ya kuwa bure, tupu, au isiyo na matokeo yenye maana; inafaa katika muktadha wa kiakili na kimaadili.
- source_word: τοῦ νοὸς αὐτῶν
  choice: wa akili zao
  rationale: “Akili” ni tafsiri ya moja kwa moja na ya kawaida ya νοῦς hapa, bila kutangulia sana lugha ya “ufahamu” katika mstari unaofuata.
theological_decisions:
- issue: Maana ya ἔθνη katika tofauti ya kimaadili inayoelekezwa kwa waamini ambao wengi wao walikuwa watu wa mataifa
  choice: watu wa mataifa
  alternative: mataifa; wapagani
  rationale: Chaguo hili linahifadhi kundi la kikabila na la kihistoria katika matumizi ya Paulo bila kuingiza maana kali zaidi ya kidini ya “wapagani.” Tofauti inayolengwa ni kati ya mwenendo wao wa zamani na maisha mapya katika Bwana, si dai kwamba kila asiye Myahudi ana sifa hii kwa kila namna.
- issue: Nguvu ya περιπατεῖν baada ya λέγω καὶ μαρτύρομαι
  choice: msiendelee tena kuenenda
  alternative: kwamba msiendelee tena kuenenda
  rationale: Muundo wa amri unaonyesha wazi uzito wa mausia uliomo katika sintaksia ya Kigiriki, bila kuongeza mfumo tofauti wa kiteolojia.
- issue: Uhusiano unaoonyeshwa na ἐν κυρίῳ
  choice: katika Bwana
  alternative: kwa mamlaka ya Bwana; mbele za Bwana
  rationale: Tafsiri ya karibu inaacha wazi kama kirai kinasisitiza hasa mazingira ya umoja na Bwana au mamlaka inayotokana naye, badala ya kuamua kimya kimya kati ya maana hizo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Kuenenda” limetumiwa kimakusudi kuhifadhi sitiari na uradidi wa Kigiriki; “watu wa mataifa” huepuka utata wa kutumia “mataifa” kana kwamba nchi zenyewe ndizo zinazotenda.
