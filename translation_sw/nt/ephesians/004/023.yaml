lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: mfanywe upya
  rationale: Kitenzi hiki ni cha hali ya kutendwa, kwa hiyo tafsiri inadumisha wazo la kufanywa upya badala ya kujifanya upya. Muundo wa wakati wa sasa unaweza kudokeza mchakato unaoendelea bila kulazimika kuongeza neno la ufafanuzi katika matini.
- source_word: δὲ
  choice: na
  rationale: Hapa δέ ni kiunganishi hafifu katika mfululizo wa mawazo, si pingamizi kali; “na” linaendeleza mtiririko kwa kawaida.
- source_word: τῷ πνεύματι
  choice: katika roho
  rationale: Dativi inaeleweka kwa kawaida kama eneo au upande ambamo kufanywa upya hutokea. Herufi ndogo katika “roho” haifanyi rejeo la moja kwa moja kwa Roho Mtakatifu, huku tanbihi ikihifadhi uwezekano huo.
- source_word: νοὸς
  choice: akili
  rationale: “Akili” ni neno la kawaida la Kiswahili kwa uwezo wa ndani wa kufikiri na kuelewa, na linahifadhi uhusiano wa karibu katika kirai “roho ya akili zenu.”
- source_word: ὑμῶν
  choice: zenu
  rationale: Kiambishi cha umilikaji cha wingi kinaonyesha wazi kuwa Paulo anawahutubia watu wengi na kinakubaliana kisarufi na “akili.”
theological_decisions:
- issue: Ikiwa πνεύματι inamaanisha Roho Mtakatifu au roho/mwelekeo wa ndani wa mwanadamu
  choice: “roho ya akili zenu,” ikielekea kumaanisha mwelekeo wa ndani wa akili
  alternative: “kwa Roho katika akili zenu,” likirejelea kazi ya Roho Mtakatifu
  rationale: Muundo τοῦ νοὸς ὑμῶν kwa kawaida zaidi unaifafanua πνεύματι kama roho au mwelekeo wa ndani unaohusiana na akili. Hata hivyo, uwezekano wa rejeo kwa Roho Mtakatifu hauondolewi kimya kimya, bali umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. “Mfanywe upya” huhifadhi hali ya kutendwa; “roho ya akili zenu” huhifadhi muundo na utata wa Kigiriki bila kuufafanua kupita kiasi.
