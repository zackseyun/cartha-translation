  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: sw
  text: ambaye hapo zamani hakukufaa[a], lakini sasa anawafaa wewe na mimi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Paulo anacheza kwa maneno kwa kutumia jina Onesimo, linalohusiana na maana ya kuwa mwenye manufaa au mwenye faida.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: ambaye
  rationale: Kibainishi cha hali ya kushutumiwa kinatumika kumrejelea Onesimo aliyetajwa katika mstari uliotangulia; “ambaye” huendeleza sentensi kwa Kiswahili cha kawaida.
- source_word: ποτέ
  choice: hapo zamani
  rationale: Huonyesha wakati uliopita na kuweka tofauti ya wazi na νυνί, “sasa.”
- source_word: σοι
  choice: -ku- katika “hakukufaa”
  rationale: Kiambishi cha yambwa huwasilisha kwa kawaida maana ya “kwako” katika muundo huu wa Kiswahili.
- source_word: ἄχρηστον
  choice: hakukufaa
  rationale: Hutoa maana ya kutokuwa na manufaa au matumizi kwa mtu, huku ikiruhusu ulinganifu wa kimatamshi na “anatufaa” katika sehemu ya pili.
- source_word: νυνὶ δὲ
  choice: lakini sasa
  rationale: Hudumisha utofauti mkubwa kati ya hali ya zamani na hali ya sasa.
- source_word: σοὶ καὶ ἐμοὶ
  choice: mimi na wewe
  rationale: Katika “anatufaa,” kiambishi -tu- kinawahusisha Paulo na Filemoni; kutaja “mimi na wewe” kwa uwazi hudumisha jozi ya Kigiriki, ingawa mpangilio umebadilishwa kwa mtiririko wa asili wa Kiswahili.
- source_word: εὔχρηστον
  choice: anatufaa
  rationale: Ni kinyume cha moja kwa moja na “hakukufaa,” na huwasilisha maana ya kuwa mwenye manufaa bila kuongeza ufafanuzi usiomo katika Kigiriki.
theological_decisions:
- issue: Mchezo wa maneno unaowezekana kuhusu jina Onesimo na mabadiliko yake
  choice: Kudumisha utofauti rahisi wa “hakukufaa/anatufaa” katika matini kuu
  alternative: Kutafsiri kwa ufafanuzi zaidi, kama “hakuwa na manufaa... sasa ana manufaa kweli”
  rationale: Kigiriki chenyewe kinaonyesha utofauti bila kuhitaji maelezo ya ziada. Tafsiri hii huhifadhi athari ya kifasihi na kuepuka kufafanua kupita ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hakukufaa/anatufaa” ni wa kawaida na unaweka wazi tofauti ya ἄχρηστον na εὔχρηστον; alama ya tanbihi [a] imewekwa katika matini kuu.
