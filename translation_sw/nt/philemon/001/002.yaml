base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: sw
  text: 'na kwa Afia, dada[a], na kwa Arkipo, askari mwenzetu, na kwa kanisa lililoko nyumbani mwako:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “dada yetu” badala ya “dada.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Afia
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: ἀδελφῇ
  choice: dada
  rationale: Neno hili linamaanisha “dada” na hapa linaonyesha uhusiano wa kifamilia ndani ya jumuiya ya waamini. Kiwakilishi “yetu” hakijaongezwa katika matini kuu kwa sababu hakipo katika matini ya SBLGNT iliyotolewa.
- source_word: Ἀρχίππῳ
  choice: Arkipo
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: συστρατιώτῃ
  choice: askari mwenzetu
  rationale: Uchaguzi huu unahifadhi sitiari ya kijeshi ya mtu anayehudumu pamoja na wengine, huku ukiwa wa kawaida na wazi katika Kiswahili.
- source_word: ἐκκλησίᾳ
  choice: kanisa
  rationale: Katika muktadha huu wa barua, “kanisa” ni neno la kawaida kwa jumuiya ya Wakristo iliyokusanyika.
- source_word: κατ’ οἶκόν σου
  choice: lililo nyumbani mwako
  rationale: Hii inawakilisha kwa ufupi kanisa lililokuwa katika nyumba ya mpokeaji bila kuongeza wazi kitenzi “hukutana,” ambacho kingekuwa ufafanuzi wa maana iliyodokezwa.
- source_word: καὶ
  choice: na
  rationale: Viunganishi vinavyorudiwa vimehifadhiwa ili kuonyesha muundo wa kuongeza wapokeaji mmoja baada ya mwingine.
- source_word: τῇ / τῷ
  choice: kwa
  rationale: Hali ya dative inayowataja wapokeaji wa salamu imewakilishwa kwa kihusishi “kwa,” kinachofaa katika muundo wa salamu za barua.
theological_decisions:
- issue: Iwapo ἀδελφῇ itafsiriwe kwa kuongeza kiwakilishi kuwa “dada yetu”
  choice: dada
  alternative: dada yetu
  rationale: Matini ya SBLGNT iliyotolewa ina τῇ ἀδελφῇ bila ἡμῶν. Kwa hiyo matini kuu inafuata ushahidi huo na kuacha kiwakilishi kisichokuwapo, huku tofauti ya kimaandishi ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa, na unaosomeka kwa urahisi. “Askari mwenzetu” huhifadhi sitiari ya kijeshi; “kanisa lililo nyumbani mwako” hukaa karibu na muundo wa Kigiriki bila kuufafanua kupita kiasi.
