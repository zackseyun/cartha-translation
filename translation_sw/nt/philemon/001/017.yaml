  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: sw
  text: Kwa hiyo, ikiwa unaniona kuwa mshirika wako, mpokee kama vile ungenipokea mimi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkaribishe” au “mkubali.” Kitenzi hiki kinaweza kumaanisha kumpokea mtu kwa moyo mzuri au kumkubali katika ushirika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Kwa hiyo, ikiwa
  rationale: ‘Kwa hiyo’ huhifadhi uhusiano wa kimantiki na ombi lililotangulia, huku ‘ikiwa’ ikihifadhi sharti la εἰ kwa Kiswahili cha kawaida.
- source_word: ἔχεις κοινωνόν
  choice: unaniona kuwa mshirika wako
  rationale: κοινωνός humaanisha mtu anayeshiriki pamoja na mwingine. Muundo huu wa Kiswahili unaeleza kwa kawaida maana ya kumhesabu Paulo kuwa mshirika, bila kuifanya istilahi hiyo kuwa ya kidhehebu.
- source_word: προσλαβοῦ
  choice: mpokee
  rationale: Kitenzi hiki kinaweza kumaanisha kumpokea, kumkaribisha, au kumkubali mtu. ‘Mpokee’ huhifadhi upana wa maana unaoweza kuhusisha makaribisho na kukubaliwa katika ushirika.
- source_word: αὐτὸν
  choice: yeye
  rationale: Kiwakilishi hiki kinamrejelea Onesimo; kutaja ‘yeye’ baada ya ‘mpokee’ kunatia mkazo unaolingana na ombi la Paulo.
- source_word: ὡς ἐμέ
  choice: kama vile ungenipokea mimi
  rationale: 'Upanuzi wa kawaida wa Kiswahili unaweka wazi ulinganisho: Filemoni anapaswa kumpokea Onesimo kwa namna ambayo angemkaribisha Paulo mwenyewe.'
theological_decisions:
- issue: Nguvu ya kimahusiano ya κοινωνός katika ombi la Paulo
  choice: mshirika
  alternative: mwenzangu; mwenye kushiriki pamoja nami
  rationale: ‘Mshirika’ huwasilisha ushiriki na uhusiano wa pande mbili kati ya Paulo na Filemoni bila kuingiza maana maalumu ya kidhehebu au ya kitekniki.
- issue: Upana wa maana ya προσλαβοῦ
  choice: mpokee
  alternative: mkaribishe; mkubali
  rationale: ‘Mpokee’ huacha wazi kama msisitizo ni makaribisho ya kibinafsi, kukubaliwa katika uhusiano, au yote mawili, na hivyo huhifadhi mvutano wa kimaana wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kawaida kwa wasomaji wengi huku ikihifadhi sharti, hitimisho la kimantiki, na nguvu ya ombi la Paulo.
