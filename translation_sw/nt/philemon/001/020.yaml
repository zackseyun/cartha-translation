  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: sw
  text: Naam, ndugu, na nipate manufaa kutoka kwako[a] katika Bwana; uburudishe moyo wangu[b] katika Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nifaidike nawe,” au “nipate furaha kutoka kwako.” Huenda Paulo anacheza na maana ya jina Onesimo, linalohusiana na kuwa mwenye manufaa.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya moja kwa moja, Kigiriki kinasema “sehemu zangu za ndani,” msemo unaomaanisha hisia za ndani kabisa au nafsi ya ndani.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi” au “Mtiwa-Mafuta.”
    reason: translation_alternative
lexical_decisions:
- source_word: ναί
  choice: Naam
  rationale: Neno hili linaanzisha ombi la Paulo kwa uthibitisho wa dhati na wa kirafiki; “Naam” linafaa kwa mtindo wa heshima bila kuwa la kizamani mno.
- source_word: ἀδελφέ
  choice: ndugu
  rationale: Ni mwito wa moja kwa moja kwa Filemoni kama ndugu mwamini; Kiswahili hakihitaji kuongeza kiwakilishi cha umilikaji.
- source_word: ἐγώ σου ὀναίμην
  choice: na nifaidike nawe
  rationale: Muundo wa ombi wenye ὀναίμην una maana ya kupata faida au manufaa kutoka kwa mtu. “Nifaidike nawe” ni wa asili katika Kiswahili na huacha uwezekano wa mchezo wa maneno unaohusiana na jina Onesimo.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa Paulo unaoonyesha kwamba ombi na manufaa hayo yako ndani ya uhusiano wao na Bwana.
- source_word: ἀνάπαυσόν
  choice: uburudishe
  rationale: Amri hii inaomba faraja au pumziko la ndani, na pia inalingana kwa maana na matumizi ya kitenzi hicho katika mstari wa 7.
- source_word: μου τὰ σπλάγχνα
  choice: moyo wangu
  rationale: Ingawa maana ya moja kwa moja ni viungo vya ndani, huu ni msemo wa hisia za ndani kabisa; “moyo wangu” ndio usemi wa kawaida na wazi wa Kiswahili.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi wazi maana hiyo ya cheo katika Kiswahili.
theological_decisions:
- issue: Maana ya ἐν κυρίῳ
  choice: katika Bwana
  alternative: kwa sababu ya Bwana
  rationale: “Katika Bwana” huhifadhi kwa makusudi upana wa usemi wa Kigiriki, ambao unaweza kueleza mazingira ya uhusiano wao na Bwana bila kuubana kuwa sababu pekee.
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi kwamba Χριστός ni cheo cha Mtiwa-Mafuta; “Kristo” ni tafsiri mbadala iliyozoeleka katika mapokeo ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi sauti ya ombi la kirafiki, marudio ya “katika,” na mguso wa mchezo wa maneno bila kulazimisha ufafanuzi ndani ya matini kuu.
