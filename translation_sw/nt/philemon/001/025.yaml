  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: sw
  text: Neema ya Bwana Yesu Kristo iwe pamoja na roho yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yenu” ni ya wingi; baraka hii inamfikia Filemoni pamoja na wapokeaji wengine wa barua.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: Neno la kawaida katika baraka za Paulo, likimaanisha fadhili na baraka anazotoa Mungu.
- source_word: κυρίου
  choice: Bwana
  rationale: Linahifadhi uzito wa cheo cha Yesu katika Agano Jipya na linafaa katika baraka hii.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  rationale: Katika Kiswahili, “Kristo” ni namna iliyozoeleka na yenye heshima ya kuwasilisha cheo Χριστός katika jina hili, bila kuifanya ionekane kama jina la ukoo.
- source_word: μετὰ
  choice: iwe pamoja na
  rationale: Kigiriki kina kihusishi “pamoja na” bila kitenzi; “iwe” kinaongezwa kwa Kiswahili cha kawaida ili kuwasilisha baraka inayokusudiwa.
- source_word: πνεύματος
  choice: roho
  rationale: Umilikishi unaelekeza kwa roho au utu wa ndani wa wapokeaji; herufi ndogo huepuka kudai wazi kuwa ni Roho Mtakatifu.
- source_word: ὑμῶν
  choice: yenu
  rationale: Kiwakilishi ni cha nafsi ya pili wingi; “yenu” kinaonyesha wazi kwamba baraka inawahusu wapokeaji wengi.
theological_decisions:
- issue: Maana ya Χριστοῦ katika baraka ya mwisho
  choice: Kristo
  alternative: Masihi
  rationale: Χριστός lina asili ya cheo, lakini katika Kiswahili “Yesu Kristo” ni muundo wa kawaida unaoendelea kubeba utambulisho huo wa Kimasihi. “Yesu Masihi” pia ingewezekana, lakini si lazima hapa ili kuhifadhi maana ya chanzo.
- issue: Rejeleo la πνεύματος katika “roho yenu”
  choice: roho ya wanadamu / utu wa ndani wa wapokeaji
  alternative: Roho Mtakatifu
  rationale: Kiwakilishi cha umilikishi cha wingi “yenu” kinaelekeza zaidi kwa roho ya wapokeaji. Tafsiri haitumii herufi kubwa, hivyo haiingizi dai la wazi kwamba anayelengwa ni Roho Mtakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo wa baraka umehifadhiwa kwa lugha ya kawaida bila kuongeza maelezo ya kimadhehebu.
