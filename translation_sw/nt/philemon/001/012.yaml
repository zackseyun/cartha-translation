  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: sw
  text: Ninamrudisha kwako—yeye mwenyewe[a], yaani, moyo wangu mwenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata kwa karibu zaidi wakati wa kitenzi cha Kigiriki, “Nimekwisha kumrudisha kwako—yeye mwenyewe” au “Nilikurudishia yeye mwenyewe.” Wakati uliopo unaonyesha tendo hilo kwa mtazamo wa barua inapomfikia Filemoni.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “viungo vyangu vya ndani”; ni nahau inayomaanisha mapenzi ya ndani sana au huruma nyororo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: yeye
  rationale: Kiwakilishi hiki cha urejeshi kinamrejelea Onesimo; “yeye” kinaeleweka kwa urahisi katika sentensi hii.
- source_word: ἀνέπεμψά
  choice: ninakutumia tena
  rationale: Kitenzi hiki humaanisha kumrudisha au kumtuma tena. Wakati uliopo unafaa kwa mtazamo wa barua inayofika pamoja na Onesimo, huku tanbihi ikihifadhi uwezekano wa kutafsiri aoristi kwa wakati uliopita.
- source_word: σοι
  choice: kwako, iliyomo katika “ninakutumia”
  rationale: Dhamira ya nafsi ya pili umoja katika kitenzi cha Kiswahili inaonyesha wazi kwamba Filemoni ndiye mpokeaji.
- source_word: αὐτόν
  choice: yeye mwenyewe
  rationale: Huhifadhi msisitizo unaotokana na kurudiwa kwa kiwakilishi katika Kigiriki bila kufanya Kiswahili kuwa kigumu.
- source_word: τοῦτ’ ἔστιν
  choice: yaani
  rationale: Ni usemi wa kawaida wa Kiswahili unaoanzisha ufafanuzi wa kile kilichotangulia.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: moyo wangu hasa
  rationale: Ingawa maana ya moja kwa moja ni viungo vya ndani, hapa ni nahau ya mapenzi ya ndani sana. “Moyo wangu hasa” huwasilisha ukaribu na uzito wa kihisia kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Sitiari ya kibinadamu katika σπλάγχνα
  choice: moyo wangu hasa
  alternative: viungo vyangu vya ndani; mapenzi yangu ya ndani kabisa
  rationale: Huu ni uchaguzi wa kinahau, si ufafanuzi wa kimadhehebu. Unahifadhi nguvu ya upendo wa Paulo kwa Onesimo bila kutumia picha ya kimaumbile ambayo ingeficha maana kwa wasomaji wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yeye mwenyewe” unahifadhi msisitizo wa Kigiriki, na “moyo wangu hasa” ni nahau ya kawaida yenye nguvu ya kihisia.
