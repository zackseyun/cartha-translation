  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: sw
  text: kwa sababu ya upendo, badala yake nakuomba[a]—mimi, Paulo, mzee[b], na sasa pia mfungwa wa Masihi Yesu[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya upendo, badala yake nakuomba.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki kwa kawaida humaanisha “mzee,” yaani mwanamume mwenye umri mkubwa. Wengine wamependekeza “balozi,” lakini hilo kwa kawaida huandikwa kwa neno tofauti la Kigiriki.
    reason: alternative_reading
  - marker: c
    text: Kigiriki, “Kristo Yesu”; “Masihi Yesu” imetumiwa hapa kwa sababu Χριστός inafanya kazi kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: kwa sababu ya upendo
  rationale: διά pamoja na hali ya kushutumiwa hapa huonyesha sababu; usemi huu ni wa kawaida na huhifadhi maana ya kisababishi.
- source_word: μᾶλλον παρακαλῶ
  choice: ni afadhali nikuombe
  rationale: μᾶλλον hutofautisha ombi la Paulo na uwezekano wa kutoa amri katika mstari wa 8; 'nikuombe' huonyesha ombi la kibinafsi lenye uzito bila kulifanya amri.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: mimi nikiwa hivi, Paulo
  rationale: Kifungu cha Kigiriki ni cha kujirejelea na kwa kiasi fulani hakikamiliki; tafsiri hii huhifadhi hali hiyo huku ikisikika kwa kawaida katika Kiswahili.
- source_word: πρεσβύτης
  choice: mzee
  rationale: Maana ya kawaida ya neno hili ni mwanamume mwenye umri mkubwa. 'Mzee' ni neno la asili na lenye heshima, bila kuingiza cheo cha kanisa.
- source_word: νυνὶ δὲ καὶ
  choice: na sasa pia
  rationale: Huhifadhi msisitizo wa wakati katika νυνί na nguvu ya kuongeza jambo jingine katika καί.
- source_word: δέσμιος
  choice: mfungwa
  rationale: Ni tafsiri ya moja kwa moja ya mtu aliyefungwa au aliye gerezani.
- source_word: Χριστοῦ Ἰησοῦ
  choice: wa Kristo Yesu
  rationale: Katika Kiswahili sanifu cha Biblia, 'Kristo' ni tafsiri ya kawaida na yenye kueleweka ya cheo Χριστός; hapa umilikaji au uhusiano katika hali ya kumiliki umehifadhiwa kwa 'wa'.
theological_decisions:
- issue: Maana ya πρεσβύτης
  choice: mzee
  alternative: balozi; kiongozi wa kanisa
  rationale: Neno lililo katika maandishi ni πρεσβύτης, ambalo kwa kawaida humaanisha mwanamume mwenye umri mkubwa, si πρεσβευτής, 'balozi.' Pia halipaswi kufanywa cheo cha kanisa bila msingi wa muktadha.
- issue: Uhusiano unaoonyeshwa na Χριστοῦ Ἰησοῦ
  choice: mfungwa wa Kristo Yesu
  alternative: mfungwa kwa ajili ya Kristo Yesu
  rationale: Hali ya kumiliki ya Kigiriki inaweza kudokeza kuwa Paulo ni mfungwa anayemilikiwa au anayehusishwa na Kristo, au kwamba amefungwa kwa ajili yake. Maandishi makuu huhifadhi muundo mpana zaidi bila kufafanua sababu kimyakimya.
- issue: Utoaji wa Χριστός
  choice: Kristo
  alternative: Masihi
  rationale: '''Kristo'' ni neno la Kiswahili sanifu linalotambulika kama cheo cha Yesu na huhifadhi mwangwi wa istilahi ya Kigiriki. ''Masihi'' ni mbadala halali, lakini si lazima kuubadilisha hapa.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umeachwa ukiendelea kwa alama ya mwisho kwa kuwa mstari wa 9 unaungana na ombi la mstari unaofuata. Kila alama ya tanbihi imewekwa katika maandishi makuu.
