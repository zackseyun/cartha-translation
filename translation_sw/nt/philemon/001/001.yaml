  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: sw
  text: Paulo, mfungwa[a] wa Masihi[b] Yesu, na Timotheo, ndugu yetu, kwa Filemoni, mpendwa wetu na mfanyakazi mwenzetu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfungwa kwa ajili ya Masihi Yesu.” Muundo wa Kigiriki unaweza kuonyesha uhusiano na Masihi Yesu au kwamba Paulo amefungwa kwa ajili yake.
    reason: alternative_reading
  - marker: b
    text: Au “Kristo.” Neno la Kigiriki Χριστός humaanisha “Masihi” na hapa linatumika kama cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιος
  choice: mfungwa
  rationale: Neno hili humaanisha mtu aliye vifungoni au gerezani; “mfungwa” ni sawa la kawaida na la moja kwa moja katika Kiswahili cha sasa.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa bado ina nguvu ya cheo, kwa hiyo “Masihi” huhifadhi maana yake badala ya kuitumia kama jina la ukoo.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ὁ ἀδελφὸς
  choice: ndugu yetu
  rationale: Ingawa Kigiriki kina kihusishi bainishi, “ndugu yetu” huwasilisha kwa Kiswahili cha kawaida uhusiano wa kifamilia wa waamini unaodokezwa katika salamu.
- source_word: Φιλήμονι
  choice: kwa Filemoni
  rationale: Hali ya dative inaonyesha mpokeaji wa barua; “kwa Filemoni” ni mtindo wa kawaida wa salamu ya barua kwa Kiswahili.
- source_word: ἀγαπητῷ
  choice: mpendwa wetu
  rationale: “Mpendwa” huhifadhi joto la upendo wa waandishi kwa Filemoni, huku “wetu” ikionyesha umoja wa wingi uliomo katika ἡμῶν.
- source_word: συνεργῷ ἡμῶν
  choice: mfanyakazi mwenzetu
  rationale: Neno hili humaanisha anayefanya kazi pamoja na wengine; tafsiri hii ni ya kawaida na huhifadhi wazo la ushirika katika kazi.
- source_word: καὶ Τιμόθεος
  choice: na Timotheo
  rationale: Timotheo anaunganishwa na Paulo katika utambulisho wa watumaji wa salamu.
theological_decisions:
- issue: Tafsiri ya Χριστός katika utambulisho wa Yesu
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno la Kigiriki linaweza kusikika kama cheo chenye maana, hivyo “Masihi” linaonyesha wazi maana hiyo bila kulifanya kuwa kama jina la ukoo.
- issue: Uhusiano unaoonyeshwa na genitive katika δέσμιος Χριστοῦ Ἰησοῦ
  choice: mfungwa wa Masihi Yesu
  alternative: mfungwa kwa ajili ya Masihi Yesu
  rationale: Muundo mfupi wa “wa” huhifadhi uwezekano wa kuelewa uhusiano wake na Masihi Yesu au sababu ya kufungwa kwake, bila kuamua kimya kwamba maana ni sababu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya barua ya kitume lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio “Masihi Yesu” umehifadhiwa kwa kufuata mkazo wa chanzo, na sentensi imeachwa wazi kwa kuwa salamu inaendelea katika mistari inayofuata.
