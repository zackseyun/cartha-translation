  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: sw
  text: Lakini sikutaka kufanya lolote bila idhini yako[a], ili tendo lako jema[b] lisiwe kana kwamba ni la kulazimishwa, bali la hiari[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila ridhaa yako” au “bila maoni yako.”
    reason: lexical_alternative
  - marker: b
    text: “Tendo lako jema” pia laweza kumaanisha “wema wako” au “fadhili zako.” Kigiriki kinaweza kurejelea tendo jema la Filemoni katika jambo hili au, kwa maana pana zaidi, wema wake.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “kulingana na kilicho cha hiari”; yaani, kwa hiari yako mwenyewe.
    reason: literal_rendering
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: bila idhini yako
  rationale: Katika muktadha huu γνώμη ina maana ya idhini au ridhaa ya Filemoni. “Idhini” ni ya kawaida na inaonyesha kwamba Paulo hataki kuchukua hatua bila kukubaliwa naye, huku tanbihi ikihifadhi uwezekano wa “maoni” au “ridhaa.”
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: sikutaka kufanya lolote
  rationale: Hii inadumisha maana ya volition ya θέλω kwa Kiswahili cha kawaida bila kuifanya kuwa uamuzi rasmi zaidi ya ilivyo katika Kigiriki.
- source_word: ἵνα μὴ
  choice: ili ... lisi-
  rationale: Muundo huu wa Kiswahili unaonyesha kwa uwazi kusudi la Paulo lililoletwa na ἵνα μή.
- source_word: ὡς κατὰ ἀνάγκην
  choice: kana kwamba kwa kulazimishwa
  rationale: “Kana kwamba” inawakilisha ὡς, nayo “kwa kulazimishwa” inaonyesha shinikizo au ulazima unaomnyima mtu hiari.
- source_word: τὸ ἀγαθόν σου
  choice: tendo lako jema
  rationale: Nomino hii ya kivumishi huenda ikirejelea tendo halisi jema ambalo Filemoni angefanya; hata hivyo, tanbihi inahifadhi maana pana ya wema au fadhili zake.
- source_word: ᾖ
  choice: lisifanywe
  rationale: Katika Kiswahili, kauli ya kutendwa inaeleza kwa kawaida namna tendo hilo jema lingetokea. Muundo wa kusudi “ili ... lisi-” unadumisha nguvu ya subjunktivu.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: bali kwa hiari
  rationale: “Kwa hiari” ni usemi wa asili unaotofautiana wazi na “kwa kulazimishwa” na kuonyesha tendo linalotokana na utashi wa mtu mwenyewe.
theological_decisions:
- issue: Asili ya jibu la Filemoni
  choice: Kusisitiza kwamba tendo jema lifanywe kwa hiari, si kwa kulazimishwa, bila kutaja tendo hilo hasa.
  alternative: Kutafsiri τὸ ἀγαθόν σου kwa dhana pana kuwa “wema wako” au kwa namna mahususi zaidi kuwa “fadhili zako.”
  rationale: Kigiriki kinasisitiza sifa ya kimaadili ya jibu la Filemoni—liwe la hiari badala ya kulazimishwa—lakini hakitaji wazi tendo lenyewe. Tafsiri haipaswi kuingiza dai mahususi zaidi kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Bila idhini yako,” “kwa kulazimishwa,” na “kwa hiari” ni misemo inayoeleweka kwa urahisi. Mpangilio unahifadhi tofauti kuu ya Kigiriki kati ya shinikizo na utashi wa hiari.
