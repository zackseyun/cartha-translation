  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: sw
  text: Sikuzote namshukuru Mungu wangu, nikikutaja katika sala zangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: namshukuru
  rationale: Kitenzi cha wakati wa sasa, nafsi ya kwanza umoja, kimetafsiriwa kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: τῷ θεῷ μου
  choice: Mungu wangu
  rationale: Yambwa isiyo ya moja kwa moja ya εὐχαριστέω huwasilishwa kiasili kwa muundo wa Kiswahili 'namshukuru Mungu wangu'; umilikaji 'wangu' umehifadhiwa.
- source_word: πάντοτε
  choice: Sikuzote
  rationale: Neno hili linaonyesha udumifu au desturi ya mara kwa mara; 'sikuzote' ni la kawaida, wazi, na lenye hadhi.
- source_word: μνείαν σου ποιούμενος
  choice: nikikutaja
  rationale: Nahau hii kihalisi ni 'nikifanya kutajwa kwako.' 'Nikikutaja' huhifadhi tendo la kumtaja mtu kwa maneno katika sala, badala ya kulipunguza kuwa kukumbuka kimoyomoyo tu.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: katika sala zangu
  rationale: Katika nahau hii, ἐπί pamoja na jenitivi huonyesha mazingira au wakati wa sala; 'katika sala zangu' ni tafsiri ya asili na iliyo wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi uhusiano wa kishiriki kati ya kumshukuru Mungu na kumtaja Filemoni katika sala, bila kuondoa uwezekano wa kuelewa tendo hilo kama kumkumbuka kwa kumtaja.
