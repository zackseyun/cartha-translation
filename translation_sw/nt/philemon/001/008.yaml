lexical_decisions:
- source_word: Διό
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na yaliyotangulia, na “Kwa hiyo” ni usemi wa kawaida unaohifadhi uhusiano huo wa kimantiki.
- source_word: πολλὴν ... παρρησίαν
  choice: ujasiri mwingi
  rationale: Usemi huu unaweza kumaanisha ujasiri, uhakika, au uhuru wa kusema wazi. “Ujasiri mwingi” huhifadhi nomino na kiwango cha πολλήν bila kuufafanua kupita kiasi.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Χριστός ni cheo chenye maana ya Masihi, si jina tu. “Katika” huhifadhi usemi wa Paulo wa uhusiano au mazingira bila kuubana katika maana moja.
- source_word: ἔχων
  choice: ingawa nina
  rationale: Katika muktadha, kirai hiki kina nguvu ya kukubali jambo kabla ya tofauti inayokamilishwa katika mstari wa 9; “ingawa nina” huonyesha hilo kwa Kiswahili cha kawaida.
- source_word: ἐπιτάσσειν
  choice: kukuamuru
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka. Muundo wa “kukuamuru ufanye” ni wa asili katika Kiswahili.
- source_word: σοι
  choice: ku-
  rationale: Yule anayepewa agizo anaonyeshwa kiasili kwa kiambishi cha yambwa katika “kukuamuru.”
- source_word: τὸ ἀνῆκον
  choice: ufanye linalofaa
  rationale: Kirai hiki humaanisha jambo linalofaa au linalostahili. Kuongeza “ufanye” huweka wazi kwa Kiswahili kile kinachoamriwa bila kuongeza maudhui mapya.
theological_decisions:
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki linafanya kazi kama cheo. “Masihi” huhifadhi maana ya cheo hicho, huku “katika” ikiacha wazi upeo wa uhusiano unaokusudiwa na Paulo.
- issue: Nguvu ya ἔχων
  choice: ingawa nina
  alternative: kwa kuwa nina
  rationale: Muktadha wa mstari wa 9 unaweka ujasiri wa Paulo wa kuamuru kinyume na uamuzi wake wa kusihi kwa sababu ya upendo. Tafsiri ya kukubali jambo, “ingawa,” huhifadhi tofauti hiyo bila kuondoa uwezekano wa kuona ujasiri huo kuwa msingi wa kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Masihi” limetumiwa kama tafsiri ya cheo Χριστός; sentensi imeachwa na koma kwa kuwa hoja inaendelea katika mstari unaofuata.
