translation:
  language: sw
  text: Kwa hiyo, ingawa nina ujasiri mwingi katika Masihi kukuamuru ufanye linalofaa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ufanye jambo linalofaa.”
