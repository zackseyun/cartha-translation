  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: sw
  text: Kwa maana labda ndiyo sababu alitenganishwa nawe kwa muda, ili umpate tena milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliondoka kwako kwa muda.” Kauli tendwa ya Kigiriki, “alitenganishwa,” huenda inaepuka kumtaja wazi anayehusika na kutengana huko, na inaweza pia kudokeza kusudi la Mungu bila kulisema wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: labda
  rationale: Huhifadhi namna ya Paulo ya kutoa wazo kwa tahadhari, bila kulifanya kuwa jambo la hakika.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huonyesha uhusiano wa maelezo na mstari uliotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: διὰ τοῦτο
  choice: ili
  rationale: Katika muundo mzima, wazo la ‘kwa sababu hii’ linaelekezwa kwenye kusudi linalofuata; Kiswahili cha mstari kinawasilisha uhusiano huo kwa ‘ili’ bila kuongeza maelezo yasiyo katika chanzo.
- source_word: ἐχωρίσθη
  choice: alitenganishwa nawe
  rationale: Kauli tendwa huhifadhi kutotajwa kwa mhusika aliyesababisha kutengana, hivyo haimlaumu Onesimo moja kwa moja wala kumtaja Mungu waziwazi kuwa mtendaji.
- source_word: πρὸς ὥραν
  choice: kwa muda
  rationale: Ni nahau ya kipindi kifupi au chenye kikomo, si lazima saa moja halisi; pia hutokeza utofauti na ‘milele.’
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa kwa njia ya asili katika Kiswahili.
- source_word: αἰώνιον
  choice: milele
  rationale: Kivumishi hiki kimetumika kwa maana ya kielezi, kikilinganisha kutengana kwa muda na kuwa naye kwa kudumu.
- source_word: αὐτὸν
  choice: naye
  rationale: Kiwakilishi kinamrejelea Onesimo; katika muundo ‘uwe naye’ ni Kiswahili cha asili.
- source_word: ἀπέχῃς
  choice: uwe naye tena
  rationale: Huonyesha kumpata au kuwa naye tena katika uhusiano uliorejeshwa, bila kuingiza wazo kali la umiliki.
theological_decisions:
- issue: Mhusika anayedokezwa na kauli tendwa ἐχωρίσθη
  choice: Kudumisha kauli tendwa ‘alitenganishwa’ bila kumtaja Mungu au Onesimo kuwa chanzo cha tendo hilo.
  alternative: ‘aliondoka kwako’ au ‘Mungu alimtenga nawe’
  rationale: Kauli ya Paulo ni ya tahadhari na inaweza kudokeza majaliwa ya Mungu bila kuyasema wazi. Tafsiri inadumisha utata huo na mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unadumisha upole wa hoja ya Paulo, kauli tendwa, na utofauti kati ya kutengana kwa muda na kuwa pamoja milele.
