  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: sw
  text: Kwa maana nilipata furaha kubwa na faraja kwa sababu ya upendo wako, kwa kuwa mioyo[a] ya watakatifu imeburudishwa kupitia kwako, ndugu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “viungo vya ndani”; hapa ni nahau ya hisia za ndani kabisa za watakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: furaha
  rationale: Neno hili kwa kawaida humaanisha furaha; ‘furaha’ ni Kiswahili cha sasa na cha kawaida kinachofaa katika kauli hii ya Paulo.
- source_word: πολλὴν ἔσχον
  choice: nilipata ... kubwa
  rationale: Muundo huu unaonyesha kupata au kuwa na uzoefu wa jambo kwa kiwango kikubwa. ‘Nilipata furaha kubwa’ ni wa asili katika Kiswahili na unaakisi aoristi ἔσχον.
- source_word: παράκλησιν
  choice: kutiwa moyo
  rationale: Katika muktadha huu neno lina maana ya faraja au moyo unaoimarishwa. ‘Kutiwa moyo’ huwasilisha vizuri athari hai ya upendo wa Filemoni.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: kwa sababu ya upendo wako
  rationale: ἐπί pamoja na hali ya dative hapa inaeleza sababu au msingi wa furaha na kutiwa moyo kwa Paulo.
- source_word: σπλάγχνα
  choice: mioyo
  rationale: Kwa maana halisi ni viungo vya ndani, lakini ni nahau ya makao ya hisia za ndani kabisa. ‘Mioyo’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuleta picha ya kimwili isiyokusudiwa.
- source_word: τῶν ἁγίων
  choice: ya watakatifu
  rationale: Katika matumizi ya Paulo, neno hili huwaita waumini watu waliowekwa wakfu kwa Mungu. ‘Watakatifu’ huhifadhi istilahi ya wazi ya maandiko.
- source_word: ἀναπέπαυται
  choice: imeburudishwa
  rationale: Kauli timilifu inaonyesha hali ya sasa iliyotokana na tendo lililotangulia. ‘Imeburudishwa’ inaonyesha kwamba mioyo yao ilipata pumziko na nguvu mpya.
- source_word: διὰ σοῦ
  choice: kupitia kwako
  rationale: διά pamoja na genitive huonyesha njia au utendaji; ‘kupitia kwako’ huhifadhi maana hiyo.
- source_word: ἀδελφέ
  choice: ndugu
  rationale: Ni mwito wa moja kwa moja wa kifamilia katika jumuiya ya waumini. ‘Ndugu’ huhifadhi jinsia na ukaribu bila kuongeza kivumishi kisichomo katika Kigiriki.
theological_decisions:
- issue: Jinsi ya kutafsiri ἅγιοι
  choice: watakatifu
  alternative: watu wa Mungu; walio watakatifu
  rationale: Neno linamaanisha waumini kama watu waliowekwa wakfu kwa Mungu. ‘Watakatifu’ huhifadhi lugha ya Paulo kuhusu jumuiya bila kudokeza kwamba ni watu waliotangazwa rasmi kuwa watakatifu baadaye.
- issue: Nahau ya kianthropolojia σπλάγχνα
  choice: mioyo
  alternative: hisia za ndani kabisa; utu wa ndani kabisa
  rationale: Nahau hii inahusu maisha ya ndani na hisia za kina, si viungo vya mwili pekee. ‘Mioyo’ ni sawa ya asili na inayoeleweka, huku tanbihi ikihifadhi picha halisi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi sauti ya kichungaji ya Paulo na mwito wa moja kwa moja ‘ndugu.’
