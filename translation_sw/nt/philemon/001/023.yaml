  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: sw
  text: Epafra, mfungwa mwenzangu katika Masihi Yesu, anakusalimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: anakusalimu
  rationale: Kitenzi hiki hapa humaanisha kutoa salamu. Muundo huu ni wa kawaida na unaonyesha wazi kwamba Epafra anamsalimu Filemoni moja kwa moja.
- source_word: σε
  choice: -ku-
  rationale: Kiwakilishi cha nafsi ya pili umoja kimewakilishwa kwa kiambishi cha yambwa -ku-, kwa kuwa salamu zinaelekezwa kwa Filemoni binafsi.
- source_word: Ἐπαφρᾶς
  choice: Epafra
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: συναιχμάλωτός
  choice: mfungwa mwenzangu
  rationale: Neno hili humaanisha mtu aliyefungwa pamoja na msemaji. 'Mfungwa mwenzangu' ni Kiswahili cha asili na huhifadhi wazo la ushirika katika kifungo.
- source_word: μου
  choice: -angu
  rationale: Umilikaji wa nafsi ya kwanza umoja umeonyeshwa katika 'mwenzangu'.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: '''Katika'' huhifadhi lugha ya Paulo ya kuwa ndani ya Masihi badala ya kuigeuza kuwa ''kwa ajili ya'' au ''kwa sababu ya.'' Χριστός imetafsiriwa kwa cheo ''Masihi,'' na Ἰησοῦ kwa jina ''Yesu''.'
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika usemi wa Paulo ἐν Χριστῷ Ἰησοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός bado lina uzito wa cheo cha yule aliyetiwa mafuta, kwa hiyo 'Masihi' limetumiwa. 'Kristo' ni umbo la kimapokeo na linalowezekana, lakini halijawekwa katika matini kuu.
- issue: Uhusiano wa kifungo na ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  alternative: kwa ajili ya Masihi Yesu
  rationale: Matini ya Kigiriki hutumia ἐν, ambayo inaweza kuhusishwa na utambulisho na ushirika ndani ya Masihi. Tafsiri haijabadilisha kwa kimya kuwa sababu ya kifungo, ingawa maana hiyo inaweza kudokezwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ni wa asili kwa Kiswahili huku ukihifadhi kwa karibu maana na mvutano wa usemi wa Kigiriki.
