lexical_decisions:
- source_word: ἀκούων
  choice: kwa sababu ninasikia
  rationale: Kirai tegemezi kinaunganishwa na shukrani ya mstari uliotangulia; muundo huu wa Kiswahili unaonyesha maana ya kisababishi na hali ya kuendelea kusikia habari.
- source_word: ἀγάπην
  choice: upendo
  rationale: Hili ndilo neno la kawaida, la asili na lenye heshima kwa ἀγάπη.
- source_word: πίστιν
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya msingi ya πίστις; uwezekano wa maana ya “uaminifu” umehifadhiwa katika tanbihi.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: kumwelekea Bwana Yesu
  rationale: “Kumwelekea” huhifadhi wazo la mwelekeo kwa mtu na pia hutofautisha πρός na εἰς inayofuata.
- source_word: κύριον
  choice: Bwana
  rationale: “Bwana” ni tafsiri iliyozoeleka ya cheo cha Kikristo κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: kwa ajili ya watakatifu wote
  rationale: Muundo huu ni wa kawaida kwa Kiswahili unaposema upendo unaoonyeshwa kwa watu, huku ukihifadhi tofauti na “kumwelekea” katika kirai kilichotangulia.
- source_word: ἁγίους
  choice: watakatifu
  rationale: “Watakatifu” ni jina fupi na lililozoeleka katika Agano Jipya kwa jumuiya ya waamini.
theological_decisions:
- issue: Jinsi ya kuhusianisha “upendo” na “imani” na virai viwili vinavyofuata
  choice: Maandishi makuu yanafuata mtiririko wa uso wa Kigiriki, hivyo upendo na imani zote zinafuatiwa na “kumwelekea Bwana Yesu na kwa ajili ya watakatifu wote.”
  alternative: “imani yako kumwelekea Bwana Yesu na upendo wako kwa ajili ya watakatifu wote”
  rationale: Maana ya mgawanyo—imani kwa Yesu na upendo kwa watakatifu—inaafikiana na matumizi ya Paulo na muktadha, lakini Kigiriki hakitoi alama wazi ya kugawa majina hayo mawili kwa virai viwili. Kwa hiyo utata umehifadhiwa katika maandishi makuu, na ufafanuzi wa maana umewekwa katika tanbihi.
- issue: Maana ya πίστις katika muktadha huu
  choice: imani
  alternative: uaminifu
  rationale: “Imani” huhifadhi maana ya msingi bila kuamua mapema kama neno hilo linasisitiza pia uthabiti au uaminifu; uwezekano huo umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “ninasikia kwamba una” umechaguliwa ili kuepuka upatanisho wa kisarufi usio wa asili kati ya nomino za ngeli tofauti “upendo” na “imani,” huku ukidumisha maana ya kuwa nazo. Alama zote za tanbihi zimewekwa katika maandishi makuu.
