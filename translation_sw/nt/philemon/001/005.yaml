  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kueleza maana kwa uwazi zaidi: “imani yako kwa Bwana Yesu na upendo wako kwa watakatifu wote.”'
    reason: alternative_reading
