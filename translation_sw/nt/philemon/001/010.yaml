base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: sw
  text: Ninakuomba kuhusu mtoto wangu[a], Onesimo, niliyemzaa nikiwa katika vifungo vyangu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtoto wake wa kiroho. Kigiriki kinatumia sitiari ya mtoto na uzaaji kueleza uhusiano wa Paulo na Onesimo.
    reason: metaphorical_explanation
  - marker: b
    text: “Katika vifungo vyangu” inaweza pia kueleweka “nikiwa kifungoni” au “nikiwa gerezani”; Kigiriki kinadumisha taswira halisi ya pingu au minyororo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Ninakuomba
  rationale: Katika muktadha huu neno linaonyesha ombi la dhati na la binafsi, si amri; “ninakuomba” ni la kawaida, lenye heshima, na linafaa kwa uhusiano wa Paulo na Filemoni.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: kwa ajili ya mtoto wangu
  rationale: Ingawa περί pamoja na jenitivi inaweza kuwa “kuhusu,” hapa ombi linatolewa kwa manufaa ya Onesimo; “kwa ajili ya” ni ya asili katika Kiswahili na bado inamtambulisha anayehusika katika ombi.
- source_word: τέκνου
  choice: mtoto
  rationale: “Mtoto” huhifadhi upana wa τέκνον kuliko “mwana” na kuonyesha kwa asili uhusiano wa karibu wa kiroho bila kuufafanua kupita kiasi.
- source_word: ὃν ἐγέννησα
  choice: niliyemzaa
  rationale: “Niliyemzaa” huhifadhi sitiari halisi ya kuzaa iliyo katika γεννάω. Ingawa msemaji ni mwanamume, matumizi haya ya kisitiari yanaeleweka kwa ufafanuzi mfupi wa tanbihi.
- source_word: ἐν τοῖς δεσμοῖς
  choice: nikiwa katika vifungo
  rationale: “Vifungo” huhifadhi taswira halisi ya δεσμοί huku kirai kizima kikieleweka pia kuwa hali ya kifungo gerezani.
- source_word: Ὀνήσιμον
  choice: Onesimo
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Asili ya uhusiano wa Paulo na Onesimo
  choice: Kuhifadhi sitiari ya Paulo kumzaa Onesimo bila kusema wazi kwamba alimwongoza kuongoka
  alternative: niliyekuwa baba yake nilipokuwa kifungoni
  rationale: Kigiriki kinatumia sitiari ya kuzaa kueleza uhusiano wa kiroho. Tafsiri haipaswi kuibadili kuwa kauli ya moja kwa moja kuhusu kuongoka wala kuondoa nguvu ya sitiari hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Ninakuomba kwa ajili ya…” ni wa asili katika ombi la binafsi. Sitiari ya kuzaa imehifadhiwa, na maana yake ya kiroho imeelezwa katika tanbihi badala ya kuingizwa moja kwa moja katika matini.
