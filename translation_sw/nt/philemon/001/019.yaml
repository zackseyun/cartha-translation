  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: sw
  text: 'Mimi, Paulo, ninaandika haya kwa mkono wangu mwenyewe: nitalipa—bila kutaja kwamba hata nafsi yako mwenyewe unaniwia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “Mimi, Paulo, niliandika haya kwa mkono wangu mwenyewe; nitalipa—ili nisije nikakuambia kwamba hata nafsi yako mwenyewe unaniwia.”'
    reason: Mbadala huu unaonyesha wakati uliopita wa ἔγραψα na muundo rasmi zaidi wa ἵνα μὴ λέγω σοι.
lexical_decisions:
- source_word: ἔγραψα
  choice: ninaandika
  rationale: Ingawa kitenzi cha Kigiriki ni aoristi (‘niliandika’), katika muktadha wa barua kinamwonyesha Paulo akithibitisha kwa maandishi yake mwenyewe ahadi ambayo msomaji anaiona; ‘ninaandika’ ni ya kawaida na hudumisha nguvu hiyo.
- source_word: τῇ ἐμῇ χειρί
  choice: kwa mkono wangu mwenyewe
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba Paulo ameandika uthibitisho huu yeye binafsi.
- source_word: ἀποτίσω
  choice: Nitalipa
  rationale: Hutoa ahadi ya wakati ujao ya kulipa deni au hasara iliyotajwa katika mstari uliotangulia, bila kuongeza kitu kisichotajwa wazi katika sentensi hii.
- source_word: ἵνα μὴ λέγω σοι
  choice: bila hata kukutajia
  rationale: 'Hutokeza kwa Kiswahili cha kawaida kejeli ya kiungwana ya Paulo: anadai kutolitaja jambo huku kwa kweli akilitaja.'
- source_word: καὶ σεαυτόν
  choice: wewe pia ... nafsi yako mwenyewe
  rationale: ‘Pia’ huhifadhi maana ya nyongeza ya καί, na ‘nafsi yako mwenyewe’ hudumisha msisitizo wa kiwakilishi bila kufafanua deni hilo kuwa wokovu, kuongoka, au deni la maisha.
- source_word: προσοφείλεις
  choice: unawiwa nami
  rationale: Huwasilisha hali ya kuwa na deni kwa Paulo; maana ya nyongeza katika kitenzi inaungwa mkono na ‘pia’ katika kifungu.
theological_decisions:
- issue: Deni la Filemoni kwa Paulo katika kauli kwamba anawiwa naye nafsi yake mwenyewe
  choice: Kudumisha deni la kibinafsi la kisitiari bila kutaja msingi wake hasa
  alternative: Kulifafanua kuwa deni la kuongoka, wokovu, au kuokolewa kimwili
  rationale: Kigiriki kinathibitisha deni hilo kwa nguvu lakini hakielezi chanzo chake; tafsiri inaacha mvutano huo kama ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ahadi binafsi na kejeli ya kiungwana umehifadhiwa; tanbihi inaonyesha tafsiri rasmi zaidi ya aoristi na kifungu cha ἵνα.
