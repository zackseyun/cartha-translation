base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: sw
  text: Nikiwa na uhakika wa utii wako, nimekuandikia, nikijua kwamba utafanya hata zaidi ya yale ninayosema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zaidi ya ninayosema.” Huenda Paulo anadokeza kwamba Filemoni atafanya zaidi ya ombi maalumu alilotoa, lakini andiko halisemi wazi atafanya nini.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Nikiwa na uhakika
  rationale: Kirai hiki kinaonyesha hali thabiti ya kuwa na imani na kinaendeleza nguvu ya kitenzi-shirikishi kwa Kiswahili cha kawaida.
- source_word: τῇ ὑπακοῇ σου
  choice: wa utii wako
  rationale: “Utii” huhifadhi maana ya kuitikia maagizo kwa kujitiisha, bila kuipunguza kuwa adabu au mwitikio tu.
- source_word: ἔγραψά σοι
  choice: nimekuandikia
  rationale: Wakati timilifu wa Kiswahili ni wa asili katika barua ambapo kitendo cha kuandika kina matokeo yanayoendelea kwa msomaji; hautendi zaidi ya nguvu inayowezekana ya aoristi ya kibarua.
- source_word: εἰδὼς
  choice: nikijua
  rationale: Huonyesha maarifa yenye uhakika yanayoandamana na kuandika na kuhifadhi uhusiano wa kishirikishi wa sentensi.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: hata zaidi ya yale ninayosema
  rationale: Huhifadhi wazo la kuvuka ombi lililotamkwa bila kubainisha tendo la ziada ambalo maandishi yenyewe hayataji.
- source_word: ποιήσεις
  choice: utafanya
  rationale: Kitenzi hiki cha wakati ujao ni kipana na wazi, sawa na ποιέω, hivyo kinaacha tendo linalotarajiwa bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Nguvu ya ὑπακοή katika ombi la Paulo
  choice: utii
  alternative: kukubali; kuwa tayari kuitikia
  rationale: Neno la asili hubeba maana ya utii. Kulihifadhi kunaonyesha uzito wa mamlaka katika ombi la Paulo bila kuingiza shuruti isiyotajwa.
- issue: Maana inayodokezwa na “zaidi ya yale ninayosema”
  choice: Imeachwa wazi katika maandishi makuu
  alternative: Kuifafanua kuwa kumweka Onesimo huru au kumpokea kwa ukarimu zaidi
  rationale: Kauli ya Paulo inadokeza jambo la ziada lakini haisemi ni lipi; tafsiri haiamui mjadala ambao maandishi hayauamui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi sauti ya Paulo ya kujiamini huku ukiepuka kutaja kwa uhakika tendo la ziada analolitarajia.
