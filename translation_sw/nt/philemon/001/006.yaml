    text: Au, “kila jambo jema lililo ndani yetu kwa ajili ya Masihi.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὅπως
  choice: ili
  rationale: Hutambulisha kusudi la ombi la Paulo kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: κοινωνία
  choice: ushirika
  rationale: Huhifadhi upana wa maana ya kushiriki, kuwa na ushirika, au kuwa mshirika bila kuifunga kauli kwenye uenezaji wa imani pekee.
- source_word: πίστεώς σου
  choice: wa imani yako
  rationale: ‘Imani’ ndiyo maana inayofaa zaidi katika muktadha, ingawa neno hilo pia linaweza kumaanisha uaminifu au tumaini.
- source_word: ἐνεργὴς γένηται
  choice: uwe wenye matokeo
  rationale: Huonyesha hali ya kuwa hai na yenye kutenda au kuleta matokeo, huku umbo la ombi likihifadhiwa.
- source_word: ἐν ἐπιγνώσει
  choice: katika kuijua
  rationale: Hufuata ἐν kwa ukaribu na kueleza utambuzi au ujuzi kamili kwa lugha ya asili ya Kiswahili bila kulazimisha kiwango kisichosemwa wazi.
- source_word: παντὸς ἀγαθοῦ
  choice: kila jambo jema
  rationale: Huwakilisha umbo la Kigiriki la hali ya kati kwa maana ya kila kitu au jambo lililo jema; ‘karama’ ingekuwa maalumu kupita kiasi.
- source_word: τοῦ ἐν ἡμῖν
  choice: lililo ndani yetu
  rationale: Hushikilia usomaji wa SBLGNT ‘ndani yetu’ na kuunganisha kishazi hiki na ‘kila jambo jema.’
- source_word: εἰς Χριστόν
  choice: kwa ajili ya Masihi
  rationale: ‘Kwa ajili ya’ huwasilisha mwelekeo au rejeleo la εἰς kwa Kiswahili cha kawaida; Χριστός limetafsiriwa kama cheo ‘Masihi.’
theological_decisions:
- issue: Maana ya κοινωνία τῆς πίστεώς σου
  choice: ‘ushirika wa imani yako,’ ikihifadhi wazo pana la kushiriki au kuwa na ushirika unaohusiana na imani ya Filemoni
  alternative: ‘kushiriki imani yako’ au ‘ushirika unaotokana na imani yako’
  rationale: Kirai cha Kigiriki kina utata halisi. Tafsiri pana huepuka kuamua kimyakimya kwamba kinahusu kuieneza imani tu au ushirika wa ndani tu.
- issue: Rejeleo la ἐν ἡμῖν
  choice: ‘ndani yetu,’ likiwahusu Paulo, Filemoni, na waamini wenzao kwa pamoja
  alternative: Baadhi ya hati zina ‘ndani yako,’ likimlenga Filemoni
  rationale: Matini iliyotolewa inasoma ἡμῖν, kwa hiyo usomaji huo umewekwa katika matini kuu huku tofauti ya hati ikielezwa chini.
- issue: Uhusiano wa εἰς Χριστόν na kishazi kilichotangulia
  choice: ‘kwa ajili ya Masihi,’ huku sintaksia yake ikiendelea kuwa pana kiasi
  alternative: ‘kumwelekea Masihi’ au kukiunganisha moja kwa moja na ‘kila jambo jema’
  rationale: Kigiriki kinaweza kueleweka kwa mwelekeo, kusudi, au rejeleo; tafsiri haipaswi kufunga kwa nguvu uhusiano huu wenye utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida, huku utata wa κοινωνία, πίστις, na εἰς Χριστόν ukihifadhiwa kwa matini na tanbihi.
