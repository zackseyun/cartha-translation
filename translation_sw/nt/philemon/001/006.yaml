base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: sw
  text: ili ushirika wa imani yako uwe na matokeo katika ufahamu wa kila jambo jema lililo ndani yetu kwa ajili ya Masihi[a][b][c][d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kushiriki imani yako” au “ushirika unaohusiana na imani yako.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linalotafsiriwa “imani” linaweza pia kumaanisha “uaminifu” au “kumtumaini mtu” katika baadhi ya miktadha.
    reason: alternative_reading
  - marker: c
    text: Baadhi ya hati zina “ndani yako” badala ya “ndani yetu.”
    reason: textual_variant
  - marker: d
