  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: sw
  text: Wakati huohuo, uniandalie pia mahali pa kukaa[a], kwa maana ninatumaini kwamba kwa njia ya sala zenu nitakujaliwa kuja kwenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malazi” au “ukarimu”; neno la Kiyunani linaweza kumaanisha ukarimu unaoonyeshwa kwa mgeni au mahali anapoandaliwa kukaa.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “nitatolewa kwenu kwa neema” au “nitapewa kwenu kwa neema.” Kitenzi cha Kiyunani huonyesha kwamba Paulo anatumaini kutolewa kwao kwa neema; huenda kinadokeza kwamba Mungu ndiye atendaye, ingawa mtendaji hajatajwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Wakati huohuo, ... pia
  rationale: Muundo huu unaonyesha ombi la ziada linaloambatana na ombi lililotangulia; “wakati huohuo” na “pia” zinahifadhi vipengele vya ἅμα na καὶ kwa Kiswahili cha kawaida.
- source_word: ἑτοίμαζέ μοι
  choice: uniandalie
  rationale: Kitenzi hiki cha kuamuru pamoja na μοι kinaeleza kwa ufupi na kwa kawaida kwamba Filemoni aandaa kitu kwa ajili ya Paulo.
- source_word: ξενίαν
  choice: mahali pa kukaa
  rationale: Neno ξενία linaweza kumaanisha ukarimu kwa mgeni au mahali pa mgeni kukaa. Katika muktadha wa kitu kinachoandaliwa kwa Paulo, maana halisi ya malazi ndiyo inayofaa zaidi; “mahali pa kukaa” ni ya kawaida bila kudai kwamba kilikuwa chumba maalumu.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: kwa maana ninatumaini kwamba
  rationale: “Kwa maana” linaonyesha kuwa ombi la kuandaliwa malazi linatokana na tumaini la Paulo, huku “ninatumaini kwamba” likitambulisha jambo analolitarajia.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: kwa njia ya sala zenu
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au chombo; “kwa njia ya” linahifadhi maana hiyo. “Zenu” ni wingi kama ilivyo ὑμῶν.
- source_word: χαρισθήσομαι ὑμῖν
  choice: mtajaliwa kunipata tena
  rationale: Kiyunani kinamweka Paulo kama yule atakayetolewa kwao kwa neema. Kiswahili cha kawaida hueleza wazo hilo vizuri kwa kuwafanya wapokeaji kuwa wale watakaojaliwa kumpata. “Tena” linaonyesha kurudi kwake kunakodokezwa na muktadha, bila kutaja moja kwa moja kuachiliwa kwake.
theological_decisions:
- issue: Maana na mtendaji wa χαρισθήσομαι katika tumaini la Paulo la kwenda kwa wapokeaji
  choice: mtajaliwa kunipata tena
  alternative: nitatolewa kwenu kwa neema; nitarudishwa kwenu
  rationale: Tafsiri inahifadhi wazo la jambo kutolewa kwa neema na inaacha mtendaji—ambaye huenda ni Mungu—bila kutajwa wazi, kama ilivyo katika kauli tendwa ya Kiyunani. Haijasema Paulo ‘ataachiliwa,’ kwa kuwa hilo linatokana na muktadha wa kifungo lakini halijasemwa moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Uniandalie” ni umoja kwa Filemoni, lakini “sala zenu” na “mtajaliwa” ni wingi, kufuatana na mabadiliko ya idadi katika maandishi ya Kiyunani.
