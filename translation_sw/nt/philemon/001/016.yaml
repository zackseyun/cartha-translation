  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: sw
  text: si tena kama mtumwa[a], bali zaidi ya mtumwa—ndugu mpendwa, hasa kwangu mimi, na zaidi sana kwako wewe, katika mwili na katika Bwana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki pia linaweza kutafsiriwa “mtumishi”; hapa yaelekea linarejelea hali ya Onesimo ya kijamii ya utumwa.
    reason: alternative_reading
  - marker: b
    text: “Katika mwili” hapa yaelekea humaanisha katika uhusiano wa kibinadamu au wa kijamii, au ana kwa ana; haimaanishi “asili ya dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι ὡς δοῦλον
  choice: si kama mtumwa tena
  rationale: Huwasilisha kwa Kiswahili cha kawaida badiliko kutoka hali ya awali huku ὡς ikibaki na maana ya ‘kama.’
- source_word: ὑπὲρ δοῦλον
  choice: zaidi ya mtumwa
  rationale: ὑπέρ inaonyesha hadhi au thamani inayopita ile ya mtumwa; usemi huu ni wa asili na unahifadhi ulinganisho.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: ndugu mpendwa
  rationale: Inahifadhi taswira ya kifamilia ya jumuiya ya waamini na maana ya ἀγαπητός bila kuifafanua kupita kiasi.
- source_word: μάλιστα ἐμοί
  choice: hasa kwangu mimi
  rationale: ‘Hasa’ huonyesha kiwango cha pekee kwa lugha fupi na ya kawaida.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: lakini si zaidi sana kwako wewe
  rationale: Muundo ‘si zaidi sana’ unaleta nguvu ya swali la balagha la πόσῳ μᾶλλον na kuonyesha kwamba jambo hilo ni kweli kwa Filemoni kwa kiwango kikubwa zaidi.
- source_word: ἐν σαρκὶ
  choice: katika mwili
  rationale: Tafsiri ya karibu inahifadhi upana wa usemi wa Paulo na haubadili kimya kimya kuwa ‘ana kwa ana’ au ‘katika uhusiano wa kijamii.’
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa kawaida wa Paulo kuhusu uhusiano au maisha ndani ya Bwana bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Maana ya δοῦλος katika hali ya Onesimo
  choice: mtumwa
  alternative: mtumishi; mtumwa aliyefungwa kwa umiliki
  rationale: Muktadha unahusu hali halisi ya Onesimo ya kijamii; ‘mtumwa’ huonyesha hali hiyo wazi na kudumisha nguvu ya tofauti ya ‘zaidi ya mtumwa.’
- issue: Maana ya ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: katika mwili na katika Bwana
  alternative: katika uhusiano wa kidunia na katika Bwana; ana kwa ana na katika Bwana
  rationale: 'Tafsiri hii inahifadhi mvutano na upana wa maneno ya Paulo: uhusiano wa kibinadamu, wa kimwili au wa kijamii kwa upande mmoja, na uhusiano wa Kikristo kwa upande mwingine.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio unafuata hoja ya Kigiriki na kudumisha usemi wa Paulo ‘katika mwili na katika Bwana.’ Alama zote za tanbihi zimewekwa katika matini.
