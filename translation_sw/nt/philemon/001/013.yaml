lexical_decisions:
- source_word: ὃν
  choice: -mweka
  rationale: Kiwakilishi cha uhusiano cha kiume kinamrejelea Onesimo; katika Kiswahili rejeo hilo linaingizwa kiasili katika kiambishi cha yambwa cha kitenzi.
- source_word: ἐβουλόμην
  choice: Ningependa
  rationale: Huonyesha nia ya Paulo ambayo haikutekelezwa; hali ya masharti katika Kiswahili huwasilisha kwa kawaida wazo la ‘nilitaka ningalimweka’ bila uzito usio wa lazima.
- source_word: πρὸς ἐμαυτὸν
  choice: kwangu
  rationale: Pamoja na ‘kumweka,’ neno hili linaonyesha kumweka Onesimo karibu na Paulo au katika kampuni yake.
- source_word: κατέχειν
  choice: kumweka
  rationale: Katika muktadha huu ni kumbakiza Onesimo pamoja na Paulo, si kumzuia kwa nguvu.
- source_word: ἵνα
  choice: ili
  rationale: Hutambulisha kusudi la Paulo kwa lugha ya kawaida na ya moja kwa moja.
- source_word: ὑπὲρ σοῦ
  choice: kwa niaba yako
  rationale: Huhifadhi wazo kwamba huduma ya Onesimo ingekuwa kwa niaba ya Filemoni, bila kulazimisha maana kamili ya kuchukua nafasi yake.
- source_word: μοι διακονῇ
  choice: akuhudumie
  rationale: Kitenzi ‘kuhudumia’ kinajumuisha msaada na utumishi bila kukifanya cheo rasmi cha kidini; yambwa ‘-ni-’ humrejelea Paulo.
- source_word: ἐν τοῖς δεσμοῖς
  choice: nikiwa katika vifungo
  rationale: Huhifadhi taswira halisi ya δεσμοί huku ikisomeka kwa kawaida kama hali ya Paulo ya kufungwa.
- source_word: τοῦ εὐαγγελίου
  choice: kwa sababu ya injili
  rationale: 'Genitivi inaelekea kuwa ya kisababishi: Paulo yuko vifungoni kwa sababu ya injili. Tanbihi huhifadhi uwezekano wa usemi mfupi zaidi ‘vifungo vya injili.’'
theological_decisions:
- issue: Nguvu ya τοῦ εὐαγγελίου inapofafanua δεσμοῖς
  choice: kwa sababu ya injili
  alternative: vifungo vya injili
  rationale: Katika Kiswahili, ‘vifungo vya injili’ kinaweza kusikika kana kwamba injili ndiyo inayofunga. Maandishi makuu yanaeleza maana inayowezekana zaidi ya kisababishi, huku tanbihi ikihifadhi muundo wenye utata wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia ‘ningependa’ kuonyesha nia ambayo Paulo hakuitimiza bila kuongeza maelezo yasiyomo katika mstari.
