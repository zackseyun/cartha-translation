  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: sw
  text: Nilitaka kumbakiza pamoja nami, ili, kwa niaba yako, anihudumie katika vifungo vya injili,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika vifungo kwa sababu ya injili”—yaani, vifungo alivyovumilia kwa sababu ya injili.
