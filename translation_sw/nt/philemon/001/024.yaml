lexical_decisions:
- source_word: Μᾶρκος
  choice: Marko
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kigiriki, linalotumiwa katika tafsiri za Biblia za Kiswahili.
- source_word: Ἀρίσταρχος
  choice: Aristarko
  rationale: Unukuzi wa jina la Kigiriki uliorekebishwa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: Δημᾶς
  choice: Dema
  rationale: Unukuzi wa jina la Kigiriki kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: Λουκᾶς
  choice: Luka
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kigiriki.
- source_word: οἱ συνεργοί
  choice: wafanyakazi wenzangu
  rationale: συνεργοί humaanisha watu wanaofanya kazi pamoja na mwingine. Usemi huu ni wa asili katika Kiswahili cha sasa na unahifadhi dhana ya ushirika katika kazi.
- source_word: μου
  choice: -angu
  rationale: Kiwakilishi cha nafsi ya kwanza katika hali ya umilikishi au uhusiano kimeunganishwa na 'wenza' katika 'wenzangu', kikionyesha kwamba watu hao ni washirika wa Paulo katika kazi.
