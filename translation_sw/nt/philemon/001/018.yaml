  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: sw
  text: Lakini ikiwa amekukosea kwa namna yoyote au ana deni lolote kwako, liandike hilo kwenye hesabu yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lihesabu hilo kwangu.” Kitenzi hiki ni cha kihasibu na humaanisha kuhesabu au kutoza jambo kwenye hesabu ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Lakini ikiwa
  rationale: εἰ huanzisha sharti, na δέ huonyesha tofauti au mwendelezo wa kiasi. “Lakini ikiwa” linaunganisha sentensi hii kwa kawaida na mstari uliotangulia.
- source_word: τι
  choice: kwa namna yoyote
  rationale: Kiwakilishi kisichodhihirisha τι kinaacha kosa bila kubainishwa na kupanua sharti, bila kurudia “lolote” linalotumiwa baadaye kuhusu deni.
- source_word: ἠδίκησέν σε
  choice: amekukosea
  rationale: ἀδικέω humaanisha kumtendea mtu isivyo haki au kumkosea. “Amekukosea” ni Kiswahili cha kawaida, chenye uzito wa kimaadili, bila kubana maana iwe udanganyifu au hasara ya mali pekee.
- source_word: ἢ ὀφείλει
  choice: au ana deni lolote kwako
  rationale: ὀφείλω hapa huonyesha deni au wajibu unaodaiwa. “Ana deni lolote kwako” huweka wazi mdaiwa na mdai kwa njia ya asili katika Kiswahili na kuhifadhi muktadha wa kifedha.
- source_word: τοῦτο
  choice: hilo deni
  rationale: τοῦτο hurejelea kosa au deni lililotajwa. Katika muundo wa Kiswahili, “hilo deni” huunganika kwa uwazi na sitiari ya uhasibu ya kitenzi kinachofuata, huku dokezo likionyesha maana pana ya kukiweka jambo hilo kwenye hesabu.
- source_word: ἐμοὶ
  choice: mimi
  rationale: Dativu ἐμοὶ humtaja Paulo kuwa mtu ambaye jambo hilo lihesabiwe kwake. Mkazo wa “mimi” unahifadhiwa katika “niandikie mimi.”
- source_word: ἐλλόγα
  choice: niandikie ... hilo deni
  rationale: ἐλλογέω ni neno la kihasibu lenye maana ya kuweka au kuandika kitu katika hesabu ya mtu. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa; dokezo linahifadhi tafsiri mbadala iliyo karibu zaidi na muundo wa kihasibu.
