  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: sw
  text: Neema na amani ziwe kwenu kutoka kwa Mungu Baba yetu na kwa Bwana Yesu Masihi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutumiwa kama cheo, “Masihi,” au katika baadhi ya miktadha kama sehemu ya jina, “Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Neema
  rationale: Katika salamu za Paulo, neno hili ni salamu na pia lina uzito wa kiteolojia; “neema” huhifadhi maana zote mbili.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Hii ndiyo namna ya kawaida na ya asili ya kuonyesha walengwa wa salamu au baraka kwa Kiswahili.
- source_word: εἰρήνη
  choice: amani
  rationale: Huhifadhi maana ya salamu na mwangwi mpana wa shalom.
- source_word: ἀπὸ
  choice: kutoka kwa
  rationale: Huonyesha chanzo cha neema na amani.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Mungu Baba yetu
  rationale: Muundo huu unasoma kwa kawaida kama ufafanuzi wa Mungu kuwa Baba yetu, wala si “Mungu wetu na Baba.”
- source_word: κυρίου
  choice: Bwana
  rationale: Huhifadhi maana ya cheo cha heshima na uzito wake wa kikristo katika matumizi ya Paulo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Yesu” huhamishwa kama jina, na “Masihi” hutafsiri Χριστός kama cheo kinachomaanisha Mtiwa-Mafuta.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: “Masihi” huweka wazi maana ya cheo cha Kigiriki bila kubadili utambulisho wa Yesu; tanbihi huhifadhi namna iliyozoeleka zaidi ya “Kristo.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ziwe kwenu” hukamilisha kwa njia ya asili muundo wa salamu ambao katika Kigiriki hauna kitenzi kilichoandikwa wazi.
