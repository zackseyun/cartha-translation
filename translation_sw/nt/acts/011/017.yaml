base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: sw
  text: Basi, ikiwa Mungu aliwapa wao zawadi ileile kama alivyotupa sisi pia tuliomwamini Bwana Yesu Masihi[a][b], mimi nilikuwa nani hata niweze kumzuia Mungu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Kristo”: Kigiriki Χριστόν. Hapa limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.'
    reason: alternative_reading
  - marker: b
    text: Au “sisi tulipomwamini Bwana Yesu Masihi.” Kishiriki cha Kigiriki kinaweza kutafsiriwa kwa maana ya wakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: zawadi ileile
  rationale: ἴσην huonyesha usawa au ulinganifu wa zawadi; “zawadi ileile” ni Kiswahili cha kawaida na kinaendeleza ulinganisho kati ya wao na sisi.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: tulipomwamini Bwana Yesu, Masiya
  rationale: Kirai cha kiima tegemezi cha wakati kinaonyesha kuwa Mungu aliwapa zawadi hiyo walipomwamini Yesu; kiambishi -mw- kinamfanya Yesu kuwa yule anayeaminiwa, huku ἐπί pamoja na hali ya kushtaki ikibaki katika maana ya kuelekeza imani kwake.
- source_word: κύριον
  choice: Bwana
  rationale: Hapa κύριον ni cheo cha Yesu, kwa hiyo “Bwana” linafaa kuliko “bwana” kwa maana ya kawaida.
- source_word: Χριστόν
  choice: Masiya
  rationale: Χριστός lina nguvu ya cheo hapa; “Masiya” huhifadhi maana ya ‘Mpakwa Mafuta’ badala ya kulifanya kuwa kama jina la ukoo.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: mimi nilikuwa nani hata niweze
  rationale: Muundo huu wa swali la balagha huhifadhi msisitizo wa ἐγώ na unyenyekevu wa Petro mbele ya tendo la Mungu.
- source_word: κωλῦσαι
  choice: kumzuia
  rationale: κωλύω humaanisha kuzuia au kukwamisha; “kumzuia Mungu” huhifadhi usemi mkali wa Kigiriki na ni wa kawaida katika Kiswahili.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya κωλῦσαι; tafsiri hii huhifadhi wazo kwamba kupinga tendo hilo kungekuwa kumzuia Mungu mwenyewe.
theological_decisions:
- issue: Tafsiri ya Χριστόν katika cheo κύριον Ἰησοῦν Χριστόν
  choice: Masiya
  alternative: Kristo
  rationale: Katika muktadha huu neno linaendelea kufanya kazi kama cheo chenye maana. “Masiya” huhifadhi asili yake ya Kiyahudi bila kuongeza msimamo wa kimadhehebu.
- issue: Uhusiano wa πιστεύσασιν na ἡμῖν
  choice: 'maana ya wakati: “tulipomwamini”'
  alternative: 'maana ya kueleza kundi: “sisi tuliomwamini”'
  rationale: Kishiriki cha wakati uliopita kinakubaliana na “sisi” na kinaweza kueleweka kwa namna zote mbili. Muundo wa wakati ni wa asili zaidi katika Kiswahili na unafaa mfuatano wa simulizi, lakini uwezekano wa maana ya kueleza kundi umeonyeshwa katika tanbihi ili kutatua utata bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Zawadi ileile” ni ya kawaida na wazi; “mimi nilikuwa nani hata niweze” huhifadhi nguvu ya swali la balagha. Koma baada ya “Yesu” husaidia msomaji kuelewa “Masiya” kama cheo.
