  text: ὃ καὶ ἐποίησαν ἀποστείλαντες πρὸς τοὺς πρεσβυτέρους διὰ χειρὸς Βαρναβᾶ καὶ Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: sw
  text: Nao wakafanya hivyo kwa kupeleka msaada huo kwa wazee kupitia Barnaba na Sauli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kihalisi, “kwa mkono wa Barnaba na Sauli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: Nao wakafanya hivyo
  rationale: Kifungu hiki kinarejelea azimio la mstari uliotangulia. Kiswahili cha kawaida hutumia “wakafanya hivyo” badala ya tafsiri ngumu ya kiwakilishi ὃ, huku καί ikidumisha mwendelezo wa simulizi kwa “Nao.”
- source_word: ἀποστείλαντες
  choice: kwa kupeleka
  rationale: Kivumishi-shirikishi cha aoristi kinaeleza namna walivyotekeleza azimio lao. “Kwa kupeleka” kinaonyesha njia au tendo lililotimiza uamuzi huo kwa Kiswahili cha asili.
- source_word: implicit object from context
  choice: msaada huo
  rationale: Kigiriki kinaacha yambwa likieleweka kutokana na msaada uliotajwa katika mstari uliotangulia. Kiswahili hunufaika kwa kulitaja wazi; “msaada huo” hurejelea muktadha bila kuongeza aina ya vitu vilivyotumwa.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: kwa wazee
  rationale: Katika Matendo, πρεσβύτεροι ni viongozi wanaotambuliwa katika jumuiya. “Wazee” ni neno sanifu, wazi, na lisiloingiza cheo cha kimadhehebu.
- source_word: διὰ χειρὸς
  choice: kupitia
  rationale: Nahau ya Kigiriki, kihalisi “kwa mkono wa,” inaonyesha uwakala wa wajumbe. “Kupitia” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila usemi usio wa asili.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Barnaba na Sauli
  rationale: Majina yametolewa kwa tahajia zinazotumika kwa kawaida katika Biblia za Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Kupitia” limetumiwa katika maandishi, huku nahau halisi ya Kigiriki ikihifadhiwa katika tanbihi.
