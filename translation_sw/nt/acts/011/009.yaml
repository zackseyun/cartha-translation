  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: sw
  text: 'Lakini sauti kutoka mbinguni ikajibu mara ya pili[a]: “Vitu ambavyo Mungu amevitakasa, wewe usivihesabu kuwa vya kawaida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “usiviite najisi” au “usivichukulie kuwa visivyo safi.”'
