lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ikamjibu
  rationale: Kitenzi hiki humaanisha ‘kujibu’; kiambishi cha yambwa ‘-m-’ kinaonyesha kwa kawaida kwamba sauti ilimjibu Petro katika mfululizo wa simulizi.
- source_word: φωνὴ
  choice: sauti
  rationale: Huhifadhi nomino ya Kigiriki bila kumtaja kwa namna ya moja kwa moja mwenye sauti.
- source_word: ἐκ δευτέρου
  choice: mara ya pili
  rationale: Ni tafsiri ya kawaida na ya asili ya nahau inayomaanisha ‘kwa mara ya pili.’
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Katika muktadha huu οὐρανός inarejelea makao ya Mungu, si anga tu.
- source_word: Ἃ
  choice: Kile ambacho
  rationale: Ingawa kiwakilishi cha Kigiriki ni wingi wa kijinsia ya kati, Kiswahili cha kawaida hutumia umoja wa jumla ‘kile ambacho’ kwa maana hii.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἐκαθάρισεν
  choice: amekitakasa
  rationale: Kitenzi ‘kutakasa’ kinaonyesha tendo la Mungu la kufanya kitu kuwa safi katika muktadha wa usafi wa kidini; hali timilifu inaonyesha tendo lililokamilika lenye matokeo ya sasa.
- source_word: σὺ
  choice: wewe
  rationale: Kiwakilishi kimetajwa wazi katika Kigiriki kwa mkazo; ‘wewe’ kinahifadhi mkazo huo.
- source_word: μὴ κοίνου
  choice: usikiite najisi
  rationale: Katika muktadha wa sheria za usafi, κοινόω humaanisha kukihesabu au kukiita kitu kuwa cha kawaida, kilicho najisi, au kisichofaa kidini. ‘Usikiite najisi’ ni Kiswahili cha asili huku tofauti ya kileksia ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya lugha ya usafi katika κοινόω
  choice: usikiite najisi
  alternative: usikihesabu kuwa cha kawaida / kisicho safi
  rationale: ‘Najisi’ huwasilisha kwa uwazi kategoria ya usafi wa kidini kwa wasomaji wa Kiswahili. Hata hivyo, κοινόω kimsingi ina wazo la kufanya au kuhesabu kuwa ‘cha kawaida’; tanbihi inalinda tofauti hiyo bila kuufanya mstari mkuu kuwa mgumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Najisi’ ni neno la sasa linalotambulika katika mazingira ya kidini; tanbihi inaeleza maana pana ya κοινόω.
