  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: sw
  text: Naye alipompata, akamleta Antiokia. Kwa mwaka mzima walikusanyika pamoja na kanisa[a] na kufundisha umati mkubwa; na huko Antiokia ndipo wanafunzi walipoitwa Wakristo kwa mara ya kwanza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikusanyika kanisani.” Neno la Kigiriki linaweza kusisitiza kukusanyika pamoja na jumuiya ya waamini, wala si lazima ndani ya jengo.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema kwamba wanafunzi “waliitwa Wakristo kwa mara ya kwanza.” Huenda jina hilo lilianza kutumiwa na watu kwa ujumla huko Antiokia.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: alipompata
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu; muundo huu wa Kiswahili unaonyesha mfuatano huo kwa njia ya kawaida.
- source_word: ἤγαγεν
  choice: akamleta
  rationale: Katika muktadha huu ἄγω humaanisha kumleta Sauli Antiokia; kiambishi cha yambwa kinarejelea Sauli aliyetajwa katika muktadha.
- source_word: ἐνιαυτὸν ὅλον
  choice: kwa mwaka mzima
  rationale: Hutoa kwa uwazi maana ya kipindi kizima cha mwaka.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: walikusanyika pamoja na kanisa
  rationale: Huhifadhi maana ya kukusanyika kwa ushirika na jumuiya ya waamini, bila kudokeza lazima jengo la kanisa.
- source_word: ἐκκλησίᾳ
  choice: kanisa
  rationale: Katika Matendo neno hili humaanisha kwa kawaida jumuiya ya waamini; “kanisa” ndilo neno sanifu la Kiswahili.
- source_word: διδάξαι
  choice: kufundisha
  rationale: Kiswahili hutumia kwa kawaida kitenzi-jina baada ya kitenzi cha kwanza katika mfululizo huu wa matendo.
- source_word: ὄχλον ἱκανόν
  choice: umati mkubwa
  rationale: ἱκανός hapa huonyesha idadi kubwa au ya kutosha kuonekana; “umati mkubwa” ni Kiswahili cha kawaida na chenye maana sahihi.
- source_word: χρηματίσαι
  choice: walipoitwa
  rationale: Katika muktadha wa kupewa jina, χρηματίζω ina maana ya kuitwa au kutambulishwa kwa jina fulani.
- source_word: πρώτως
  choice: kwa mara ya kwanza
  rationale: Hueleza wazi kutokea kwa jambo hilo kwa mara ya kwanza.
- source_word: Χριστιανούς
  choice: Wakristo
  rationale: Hili ni jina la kundi lililokwishakuwa istilahi maalumu; “Wakristo” ndilo jina la kawaida na sahihi katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la kundi Χριστιανούς kwa kuzingatia kwamba Χριστός inaweza kutafsiriwa “Masihi” ikiwa ni cheo
  choice: Wakristo
  alternative: Wamasihi
  rationale: Χριστιανούς hapa ni jina maalumu la kundi, si matumizi ya moja kwa moja ya cheo Χριστός. “Wakristo” huhifadhi jina linalotambulika bila kuingiza maana ya kimadhehebu au kuunda jina lisilo la kawaida.
- issue: Maana ya ἐν τῇ ἐκκλησίᾳ katika mkusanyiko wa Barnaba na Sauli
  choice: pamoja na kanisa
  alternative: kanisani
  rationale: Muktadha unaelekea kwa jumuiya ya waamini, na tafsiri hii huepuka kuamua bila msingi kwamba walikutana ndani ya jengo maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umewekwa wa kawaida kwa wasomaji wa leo huku ukihifadhi mfuatano wa matendo na msisitizo wa Antiokia kuwa mahali ambapo jina “Wakristo” lilitumiwa kwa mara ya kwanza.
