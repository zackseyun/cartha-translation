id: ACT.11.20
reference: Acts 11:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: sw
  text: Lakini baadhi yao, wanaume kutoka Kipro na Kurene, walipofika Antiokia, walikuwa wakisema pia na Wayahudi wanaozungumza Kigiriki,[a] wakitangaza habari njema kuhusu Bwana Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale husoma “Wagiriki” badala ya “Wayahudi wanaozungumza Kigiriki.” Ikiwa usomaji huo ndio wa awali, maana yake ni kwamba walikuwa wakisema na watu wa Mataifa, si na Wayahudi wanaozungumza Kigiriki pekee.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: baadhi yao
  rationale: Inaonyesha sehemu isiyotajwa kwa majina ya kundi lililotangulia, kwa Kiswahili cha kawaida na wazi.
- source_word: ἄνδρες
  choice: wanaume
  rationale: Nomino ya Kigiriki inawataja mahsusi watu wazima wa kiume, si watu kwa ujumla.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: kutoka Kipro na Kurene
  rationale: Vivumishi hivi vinaonyesha mahali walikotoka; muundo huu ni wa kawaida katika Kiswahili.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: Walipofika Antiokia
  rationale: Kirai cha participio ya aoristi kinaeleweka hapa kwa maana ya wakati.
- source_word: ἐλάλουν
  choice: walikuwa wakizungumza
  rationale: Muundo huu unaonyesha tendo lililoendelea au lililorudiwa, kulingana na hali ya wakati usiotimilika katika Kigiriki.
- source_word: καὶ
  choice: pia
  rationale: Hapa huenda neno hili linaonyesha kuongezwa kwa kundi jingine la wasikilizaji.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: na Wayahudi waliozungumza Kigiriki
  rationale: Ἑλληνιστάς kwa kawaida humaanisha Wayahudi wenye lugha na utamaduni wa Kigiriki; tafsiri ya maana ni wazi zaidi kwa msomaji wa kawaida kuliko jina la kitaalamu.
- source_word: εὐαγγελιζόμενοι
  choice: wakitangaza habari njema kuhusu
  rationale: Inawasilisha tendo la kutangaza na maudhui yake ya habari njema kwa lugha rahisi na yenye heshima.
- source_word: τὸν κύριον Ἰησοῦν
  choice: Bwana Yesu
  rationale: Inahifadhi cheo cha kikristo κύριος kwa tafsiri ya kawaida ya Kiswahili, “Bwana.”
theological_decisions:
- issue: Utambulisho wa τοὺς Ἑλληνιστάς na tofauti ya nakala Ἕλληνας
  choice: Matini kuu inafuata SBLGNT, “Wayahudi waliozungumza Kigiriki,” na tanbihi inahifadhi usomaji “Wagiriki.”
  alternative: Wagiriki, yaani watu wa Mataifa
  rationale: Tofauti hii huathiri utambulisho wa waliopokea ujumbe. Kufuatia matini iliyotolewa huhifadhi ushahidi wa msingi, huku tanbihi ikiacha wazi usomaji mwingine muhimu bila kutatua kimya kimya mvutano huo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Majina ya mahali yametolewa kwa maumbo yaliyozoeleka: Kipro, Kurene na Antiokia. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza uhusiano wa mawazo.'
