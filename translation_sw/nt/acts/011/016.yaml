id: ACT.11.16
reference: Acts 11:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: sw
  text: Ndipo nikakumbuka neno la Bwana, jinsi alivyosema, “Yohana alibatiza kwa maji, lakini ninyi mtabatizwa katika Roho Mtakatifu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Roho Mtakatifu.” Kihusishi cha Kigiriki kinaweza kueleweka ama kwa maana ya “katika” ama kwa maana ya “kwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: nikakumbuka
  rationale: 'Kitenzi hiki kinafanya kazi kwa maana tendaji: Petro anakumbuka. Muundo wa mfululizo ''nikakumbuka'' ni wa kawaida katika simulizi la Kiswahili.'
- source_word: δὲ
  choice: Ndipo
  rationale: Hapa δέ inaendeleza simulizi kwa upole, si kuonyesha upinzani mkali; 'Ndipo' linaonyesha hatua inayofuata kwa ufasaha.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: neno la Bwana
  rationale: ῥῆμα hapa ni kauli iliyotamkwa na inafuatiwa na nukuu; 'neno la Bwana' ni la kawaida, lenye heshima, na linadumisha uzito wa κύριος.
- source_word: ὡς ἔλεγεν
  choice: jinsi alivyosema
  rationale: Ingawa hali isiyotimilika inaweza kusisitiza mwendelezo, katika muktadha huu Kiswahili cha kawaida hutumia 'alivyosema' bila kudai kwamba kauli hiyo ilirudiwa mara nyingi.
- source_word: Ἰωάννης μὲν ἐβάπτισεν ὕδατι
  choice: Yohana alibatiza kwa maji
  rationale: '''Alibatiza'' ni istilahi iliyozoeleka na sahihi katika muktadha huu; dativu ὕδατι inaeleweka kiasili kama njia au chombo, ''kwa maji.'''
- source_word: ὑμεῖς δὲ βαπτισθήσεσθε
  choice: lakini ninyi mtabatizwa
  rationale: '''Lakini'' linawasilisha tofauti ya μὲν ... δὲ, na ''ninyi'' linahifadhi msisitizo wa kiwakilishi kilichotajwa wazi katika Kigiriki.'
- source_word: ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: '''Katika'' linahifadhi uwezekano wa maana ya kimahali wa ἐν, huku tafsiri ya kichombo ''kwa Roho Mtakatifu'' ikihifadhiwa katika tanbihi.'
theological_decisions:
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: '''Bwana'' ndiyo tafsiri ya kawaida yenye heshima na uzito wa kiteolojia; hapa inamtaja Yesu kama mwenye mamlaka aliyetamka kauli hiyo.'
- issue: Maana ya ἐν katika ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  alternative: kwa Roho Mtakatifu
  rationale: Kihusishi ἐν kinaweza kueleweka kimahali au kichombo. Matini kuu inatumia 'katika,' na tanbihi inahifadhi 'kwa' ili kutatua utata halisi wa chanzo bila kuulazimisha upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Nukuu ni ya moja kwa moja; istilahi za kibiblia 'Bwana,' 'kubatiza,' na 'Roho Mtakatifu' zimedumishwa bila kuongeza mafundisho ya dhehebu.
