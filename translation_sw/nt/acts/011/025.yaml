lexical_decisions:
- source_word: ἐξῆλθεν
  choice: akaenda
  rationale: Kitenzi hiki kinaonyesha kuondoka na kwenda mahali pengine. Katika Kiswahili cha masimulizi, “akaenda” ni cha kawaida na wazi; “akatoka akaenda” kingesisitiza zaidi maana halisi ya ‘kwenda nje’ lakini kingekuwa kizito katika muktadha huu.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi, si lazima kionyeshe upinzani. “Kisha” kinaendeleza mtiririko wa matukio kwa Kiswahili cha kawaida.
- source_word: εἰς Ταρσόν
  choice: Tarso
  rationale: εἰς pamoja na kitenzi cha mwendo huonyesha mahali anakoelekea. Kiswahili huonyesha uelekeo huo moja kwa moja baada ya “akaenda”; “Tarso” ni umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: ἀναζητῆσαι
  choice: kumtafuta
  rationale: Kitenzi-jina kinaonyesha kusudi la safari. “Kumtafuta” ni cha asili na kinaeleweka kwa urahisi, huku kikihifadhi uwezekano wa maana yenye nguvu zaidi ya kutafuta kwa bidii.
- source_word: Σαῦλον
  choice: Sauli
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotambulika na kutumiwa kwa kawaida katika mapokeo ya Biblia za Kiswahili.
