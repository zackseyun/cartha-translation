  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: sw
  text: Pia nikasikia sauti ikiniambia, ‘Inuka, Petro, chinja ule.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσα δὲ καὶ
  choice: Pia nikasikia
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kuendelea kwa simulizi ya δέ pamoja na msisitizo wa καί, bila kulazimisha kiunganishi kizito.
- source_word: φωνῆς λεγούσης μοι
  choice: sauti ikiniambia
  rationale: Muundo huu ni wa asili katika Kiswahili na huhifadhi kwamba sauti hiyo ilisema moja kwa moja na Petro.
- source_word: Ἀναστάς
  choice: Inuka
  rationale: Amri hii ya kawaida huonyesha kitendo cha kuinuka na kujiandaa kutenda.
- source_word: θῦσον
  choice: chinja
  rationale: Katika muktadha wa wanyama, kitenzi hiki huonyesha kuwaua kwa kuchinja; hakiongezi wazo la dhabihu ambalo muktadha huu haulazimishi.
- source_word: φάγε
  choice: ule
  rationale: Ni amri ya nafsi ya pili umoja ya kula, ikiendeleza moja kwa moja amri ya kuchinja.
theological_decisions:
- issue: Ikiwa θῦσον ina maana ya kutoa dhabihu au kuua kwa ajili ya chakula
  choice: chinja
  alternative: toa dhabihu
  rationale: Muktadha wa ono na amri inayofuata ya kula unaunga mkono kuchinja kwa ajili ya chakula; tafsiri ya dhabihu ingeleta maana ya kidini isiyohitajika hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya moja kwa moja, kwa kuwa ni hotuba ya Petro inayosimulia sauti aliyosikia.
