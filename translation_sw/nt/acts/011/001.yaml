  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: sw
  text: Mitume na ndugu waliokuwa kotekote katika Yudea walisikia kwamba watu wa mataifa pia walikuwa wamepokea neno la Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu wa kiume na wa kike”; Kigiriki husema “ndugu” kwa umbo la kiume na huenda linawahusu waamini kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: walisikia
  rationale: Kitenzi hiki kinaeleza kupokea habari. “Walisikia” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: δὲ
  choice: na
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha upinzani mkali. “Na” linaunganisha sentensi kwa njia ya asili bila kuongeza wazo la wakati lisilomo wazi katika chanzo.
- source_word: ἀπόστολοι
  choice: mitume
  rationale: Hili ndilo neno la kawaida la kibiblia kwa kundi la mitume linalotajwa katika Matendo.
- source_word: ἀδελφοὶ
  choice: ndugu
  rationale: “Ndugu” huhifadhi sitiari ya kifamilia na katika Kiswahili linaweza kutumiwa kwa waamini kwa upana bila kulazimisha kwamba wanaume pekee ndio wanaokusudiwa.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: waliokuwa kotekote katika Uyahudi
  rationale: '“Kotekote” linaonyesha maana ya mgawanyo wa κατά: walikuwapo sehemu mbalimbali katika eneo lote, si mahali pamoja tu.'
- source_word: Ἰουδαίαν
  choice: Uyahudi
  rationale: “Uyahudi” ni jina la kawaida la eneo la Judea katika matumizi ya Biblia ya Kiswahili.
- source_word: ὅτι
  choice: kwamba
  rationale: Linaanzisha maudhui ya habari waliyosikia.
- source_word: καὶ
  choice: pia
  rationale: Linaonyesha msisitizo wa nyongeza kwamba watu wa mataifa, pamoja na wengine, walikuwa wamepokea ujumbe.
- source_word: τὰ ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu neno linamaanisha watu wasio Wayahudi, si mataifa kama vyombo vya kisiasa. Usemi huu ni wazi na wa kawaida katika Kiswahili cha kibiblia.
- source_word: ἐδέξαντο
  choice: walikuwa wamepokea
  rationale: δέχομαι hapa ni kupokea au kuukubali ujumbe. Wakati timilifu uliopita wa Kiswahili unaonyesha kwamba kupokea kulitangulia kusikia kwa mitume na ndugu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Huhifadhi usemi wa kibiblia unaomaanisha ujumbe unaotoka kwa Mungu na kutangazwa kwa watu.
theological_decisions:
- issue: Maana ya ἀδελφοὶ katika jumuiya ya waamini
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waamini
  rationale: “Ndugu” linafuata umbo la kifamilia la Kigiriki na linaweza kuwahusu waamini kwa ujumla katika Kiswahili. Tanbihi inaweka wazi uwezekano wa maana pana bila kuondoa sitiari ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa asili wa Kiswahili huku ikihifadhi msisitizo wa “pia” na maana ya kuenea kote katika Uyahudi.
