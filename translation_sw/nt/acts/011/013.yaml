  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: sw
  text: Naye akatusimulia jinsi alivyomwona malaika amesimama katika nyumba yake na kusema, “Tuma Yafa, ukamwite Simoni anayeitwa Petro.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: akatusimulia
  rationale: Kitenzi hiki kinaonyesha kutoa taarifa au kusimulia jambo kwa wengine; ‘akatusimulia’ ni cha kawaida katika Kiswahili na kinafaa kwa taarifa ya tukio lililoonekana.
- source_word: δὲ
  choice: Naye
  rationale: Hiki ni kiunganishi hafifu kinachoendeleza simulizi. ‘Naye’ huunganisha sentensi na mhusika aliyetajwa bila kuingiza wazo la upinzani mkali.
- source_word: πῶς εἶδεν
  choice: jinsi alivyomwona
  rationale: ‘Jinsi’ huhifadhi maana ya πῶς badala ya kuifanya kuwa ‘kwamba’ tu, na muundo wa Kiswahili unaonyesha kuwa kuona kulitangulia kusimulia.
- source_word: τὸν ἄγγελον
  choice: malaika
  rationale: Ingawa Kigiriki kina kibainishi, Kiswahili kwa kawaida hakihitaji neno linalolingana na ‘the’; muktadha humtambulisha malaika husika.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: nyumbani mwake
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa mahali anapoishi mtu na huhifadhi maana ya οἶκος katika muktadha huu.
- source_word: σταθέντα καὶ εἰπόντα
  choice: amesimama ... na kusema
  rationale: Muundo huu wa Kiswahili huwasilisha hali ya malaika kuonekana akiwa amesimama na akisema, bila kutumia tafsiri nzito ya kishiriki cha Kigiriki.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: Tuma watu kwenda Yafa
  rationale: Kigiriki hakitaji wazi kitu cha kutumwa, lakini Kiswahili huhitaji kijalizo kinachoeleweka; ‘watu’ huonyesha wajumbe wanaodokezwa na muktadha bila kuwataja kwa undani zaidi. ‘Yafa’ ni umbo la jina la mahali lililozoeleka katika Biblia za Kiswahili.
- source_word: μετάπεμψαι
  choice: wakamwite
  rationale: Kitenzi hiki humaanisha kutuma watu wamwite mtu ili aje. ‘Wakamwite’ huwasilisha maana hiyo kwa Kiswahili cha kawaida na huepuka urasmi usio wa lazima wa ‘mwagize aje.’
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: Simoni anayeitwa Petro
  rationale: Huhifadhi kazi ya kishiriki cha Kigiriki ya kumtambulisha Simoni kwa jina analoitwa.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi wa Maandiko. Tafsiri inalenga ulinganifu bora: ni ya asili kwa msomaji wa kawaida huku ikihifadhi ‘jinsi’ na mtiririko wa taarifa ya Kigiriki. Hakuna tanbihi iliyohitajika, kwa kuwa maana ya μετάπεμψαι imewasilishwa wazi kwa ‘wakamwite.’'
