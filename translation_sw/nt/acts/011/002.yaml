translation:
  language: sw
  text: Lakini Petro alipopanda kwenda Yerusalemu, wale wa tohara[a] walikuwa wakibishana naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu waliotambulishwa kwa uhusiano wao na tohara; pia yaweza kueleweka “waumini waliotahiriwa” au “kundi lililosisitiza tohara.” Kigiriki hakisemi wazi kwamba walikuwa chama rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini ... alipo-
  rationale: δέ inaonyesha mwendelezo wa simulizi wenye utofautishaji mdogo; “Lakini” pamoja na muundo wa wakati “alipo-” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ἀνέβη
  choice: alipopanda kwenda
  rationale: Kitenzi kina maana ya kwenda juu; kuhusu Yerusalemu ni usemi wa kawaida wa kijiografia na kitopografia. “Kupanda kwenda” huhifadhi wazo hilo kwa lugha ya asili.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: διεκρίνοντο
  choice: walibishana
  rationale: Katika muktadha huu kitenzi kinaonyesha mabishano yaliyoelekezwa kwa Petro, si shaka ya moyoni tu; hali ya kitenzi cha Kigiriki inadokeza tendo lililokuwa likiendelea.
- source_word: πρὸς αὐτόν
  choice: naye
  rationale: Pamoja na kitenzi cha kubishana, πρός inaonyesha mtu ambaye mabishano yanaelekezwa kwake; “naye” ni Kiswahili cha kawaida bila kuongeza kiwango cha uhasama.
- source_word: οἱ ἐκ περιτομῆς
  choice: wale wa tohara
  rationale: Tafsiri hii inahifadhi namna Kigiriki kinavyolitambulisha kundi kwa uhusiano wake na tohara, bila kulifanya waziwazi kuwa chama rasmi wala kusema tu watu wote waliotahiriwa.
theological_decisions:
- issue: Utambulisho wa οἱ ἐκ περιτομῆς
  choice: wale wa tohara
  alternative: waumini waliotahiriwa; kundi lililosisitiza tohara
  rationale: Kifungu kinataja watu kwa alama ya tohara lakini hakisemi moja kwa moja kwamba walikuwa chama rasmi. Tafsiri kuu inadumisha ufupi na utata huo; tanbihi hufafanua uwezekano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Tohara” ni neno la kawaida la kibiblia na la sasa; tanbihi inalinda utata halisi wa utambulisho wa kundi.
