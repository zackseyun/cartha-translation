  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: sw
  text: Jambo hili lilitokea mara tatu, na kila kitu kikavutwa tena kwenda mbinguni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Jambo hili
  rationale: Kiwakilishi hiki kinarejelea tukio lililoelezwa kabla yake bila kuongeza waziwazi neno “maono,” ambalo halipo katika neno la Kigiriki.
- source_word: δὲ
  choice: kisha
  rationale: Hapa ni kiunganishi chepesi cha masimulizi; “kisha” huunganisha kwa kawaida tendo lililofuata.
- source_word: ἐγένετο
  choice: lilitokea
  rationale: Katika muktadha huu kitenzi kinaonyesha tukio kutendeka; “lilitokea” ni Kiswahili cha kawaida na wazi.
- source_word: ἐπὶ τρίς
  choice: mara tatu
  rationale: Nahau hii inaonyesha kwamba tukio lilirudiwa mara tatu.
- source_word: ἀνεσπάσθη
  choice: kikavutwa
  rationale: Huhifadhi hali ya kutendwa na picha ya kitu kuvutwa kuelekea juu bila kumtaja mtendaji ambaye hakutajwa.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudiwa au kurejeshwa, kwa namna ya kawaida katika Kiswahili.
- source_word: ἅπαντα
  choice: kila kitu
  rationale: Tafsiri pana huhifadhi ujumla wa wingi wa kati wa Kigiriki bila kuamua kama kinachokusudiwa hasa ni shuka, wanyama, au tukio lote.
- source_word: εἰς τὸν οὐρανόν
  choice: kwenda mbinguni
  rationale: Huonyesha mwelekeo wa kuingia au kuelekea mbinguni na inafaa muktadha wa maono.
theological_decisions:
- issue: Kirejelewa cha ἅπαντα katika simulizi la maono ya Petro
  choice: kila kitu
  alternative: kitu chote; vyote; wanyama wote
  rationale: Kigiriki kina maana pana lakini hakibainishi kirejelewa chake kwa njia finyu katika mstari huu; tafsiri pana haiongezi jambo lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku hali ya kutendwa na utata halisi wa kirejelewa vikihifadhiwa.
