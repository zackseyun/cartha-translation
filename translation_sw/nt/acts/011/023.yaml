  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: sw
  text: Alipofika na kuiona neema ya Mungu[a], alifurahi na akaendelea kuwahimiza wote waendelee kushikamana na Bwana kwa moyo wenye azimio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fadhila ya Mungu.” Kirai hiki kinaweza kurejelea ushahidi ulioonekana wa kazi ya neema ya Mungu miongoni mwao.
    reason: lexical_alternative
  - marker: b
    text: Au, “waendelee kuwa pamoja na Bwana” au “waendelee kuwa waaminifu kwa Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: alipofika
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha kufika kwake Barnaba; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: ἰδὼν
  choice: kuona
  rationale: Huhifadhi lugha ya kawaida ya kuona bila kuibadili moja kwa moja kuwa kutambua au kufahamu.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: neema ya Mungu
  rationale: Huhifadhi uzito wa kitheolojia wa χάρις na kuacha wazi namna neema hiyo ilivyoonekana katika muktadha.
- source_word: ἐχάρη
  choice: alifurahi
  rationale: Ni tafsiri ya asili na yenye hadhi ya maana ya kufurahi.
- source_word: παρεκάλει
  choice: akawa akiwahimiza
  rationale: Muundo wa ‘akawa akiwahimiza’ unaonyesha tendo linaloendelea au kurudiwa, kulingana na wakati usiotimilifu wa Kigiriki.
- source_word: πάντας
  choice: wote
  rationale: Hurejelea waamini wote wanaotajwa katika muktadha bila kuongeza maelezo yasiyokuwapo.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: kwa moyo wenye azimio
  rationale: Huwasilisha kusudi au uamuzi thabiti wa ndani kwa Kiswahili cha sasa na cha kueleweka.
- source_word: προσμένειν
  choice: waendelee kushikamana
  rationale: Huwasilisha kuendelea katika uhusiano na kudumu kwa ushikamanifu, bila kuingiza fundisho jembamba zaidi.
- source_word: τῷ κυρίῳ
  choice: na Bwana
  rationale: Kirai ‘kushikamana na Bwana’ ni cha asili katika Kiswahili na huhifadhi cheo κύριος.
theological_decisions:
- issue: Maana ya ‘neema ya Mungu’ katika muktadha
  choice: Kuhifadhi kirai ‘neema ya Mungu,’ kinachoweza kumaanisha kazi ya neema ya Mungu iliyoonekana miongoni mwa waamini
  alternative: Kufafanua moja kwa moja kuwa ‘mambo ambayo Mungu alikuwa amefanya’
  rationale: Tafsiri ya moja kwa moja huhifadhi upana wa kitheolojia na haitatui kimya kimya namna neema hiyo ilivyoonekana.
- issue: Nguvu ya προσμένειν τῷ κυρίῳ
  choice: waendelee kushikamana na Bwana
  alternative: waendelee kuwa pamoja na Bwana; waendelee kuwa waaminifu kwa Bwana
  rationale: Chaguo hili linaonyesha kuendelea katika uhusiano na uaminifu kwa Bwana, huku likihifadhi upana wa usemi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi mfululizo wa matendo ya Kigiriki bila kuwa mgumu; ‘moyo wenye azimio’ huepuka usemi usio wa kawaida ‘kusudi la moyo.’
