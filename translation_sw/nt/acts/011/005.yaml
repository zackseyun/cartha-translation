  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: sw
  text: 'Nilikuwa katika mji wa Yafa nikisali, na nikiwa katika hali ya njozi niliona maono: kitu fulani[a] kama shuka kubwa kilikuwa kikishuka, kikiteremshwa kutoka mbinguni kwa pembe zake nne[b], nacho kikafika nilipokuwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chombo fulani.” Neno la Kigiriki lina maana pana ya kitu, chombo, au kifaa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ncha nne.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ
  choice: Nilikuwa katika mji wa Yafa
  rationale: Huhifadhi nafsi ya kwanza na neno πόλις (‘mji’). ‘Yafa’ ni umbo la kawaida la Kiswahili la jina la mahali Ἰόππη.
- source_word: προσευχόμενος
  choice: nikisali
  rationale: Kitenzi endelevu kinaonyesha kwamba kusali kulikuwa kunaendelea wakati tukio lilipotokea; ‘nikisali’ ni Kiswahili cha kawaida na cha heshima.
- source_word: ἐν ἐκστάσει ὅραμα
  choice: nikiwa katika hali ya njozi niliona maono
  rationale: Huhifadhi kwa kadiri inayowezekana tofauti kati ya hali ya ἔκστασις na maono yaliyoonekana (ὅραμα), bila kudokeza kupagawa, kupoteza fahamu kabisa, au furaha ya kihisia.
- source_word: σκεῦός τι
  choice: kitu fulani
  rationale: σκεῦος ni neno pana linaloweza kumaanisha kitu, chombo, au kifaa. ‘Kitu fulani’ hakilazimishi maana maalumu kabla ya mlinganisho unaofuata wa shuka.
- source_word: ὡς ὀθόνην μεγάλην
  choice: kama shuka kubwa
  rationale: Hutoa picha ya kitambaa kikubwa kwa lugha ya kawaida bila kuongeza kwamba kilikuwa cha kitani.
- source_word: καταβαῖνον ... καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: kilikuwa kikishuka, kikiteremshwa kutoka mbinguni
  rationale: Huhifadhi tendo la kushuka na hali ya kuteremshwa katika kauli tendwa, pamoja na asili yake kutoka mbinguni.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: kwa pembe zake nne
  rationale: ἀρχαί hapa ni ncha au pembe. ‘Pembe zake nne’ ni picha ya kawaida na inayoeleweka ya namna shuka hiyo ilivyoteremshwa.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: nacho kikafika nilipokuwa
  rationale: Huwasilisha mwendo uliokuja mpaka mahali Petro alipokuwa, bila kudokeza lazima kwamba kitu hicho kilimgusa.
theological_decisions:
- issue: Kutofautisha hali ya ἔκστασις na maono yenyewe
  choice: nikiwa katika hali ya njozi niliona maono
  alternative: nikiwa nimezama katika maono; nikiwa katika hali ya kuzimia niliona maono
  rationale: Kigiriki kinataja hali ya ἔκστασις na pia ὅραμα. Tafsiri iliyochaguliwa inabaki na vipengele vyote viwili bila kuviunganisha kabisa, na huepuka lugha inayoweza kumaanisha Petro alikuwa amepoteza fahamu au amepagawa.
- issue: Chanzo cha kitu kilichoonekana
  choice: kutoka mbinguni
  alternative: kutoka angani
  rationale: Katika muktadha wa ufunuo wa kimungu, οὐρανός hueleweka kiasili kuwa ‘mbinguni’; ‘angani’ ingeweza kupunguza maana hiyo na kuifanya kuwa maelezo ya anga tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi hudumisha mtiririko wa simulizi na urudiaji wa kimakusudi wa istilahi za tukio la ufunuo, huku ikiepuka maneno ya kizamani au yenye maana ya kupagawa.
