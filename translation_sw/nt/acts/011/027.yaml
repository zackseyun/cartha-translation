base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: sw
  text: Katika siku hizo manabii walishuka kutoka Yerusalemu kwenda Antiokia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “manabii walikuja Antiokia wakishuka kutoka Yerusalemu.” Kitenzi cha Kigiriki humaanisha kushuka; katika lugha nyingine, uteuzi wa “walikuja” au “walikwenda” unaweza kutegemea mtazamo wa kisimulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: Katika siku hizo
  rationale: Ni usemi wa wakati unaohifadhi maana ya Kigiriki kwa Kiswahili cha kawaida. δέ ina uhusiano hafifu wa kisimulizi na haihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: κατῆλθον
  choice: walishuka
  rationale: κατέρχομαι humaanisha kushuka au kwenda/kufika chini. ‘Walishuka’ huhifadhi dhana ya mwendo wa kushuka bila kulazimisha mtazamo wa ‘walikuja’ au ‘walikwenda.’
- source_word: ἀπὸ Ἱεροσολύμων
  choice: kutoka Yerusalemu
  rationale: ἀπό huonyesha mahali pa kuanzia. Ingawa jina la Kigiriki lina umbo la wingi, jina sanifu la Kiswahili ni ‘Yerusalemu.’
- source_word: προφῆται
  choice: manabii
  rationale: Hili ndilo neno la kawaida na linalofaa katika muktadha, bila kufafanua zaidi aina au upeo wa huduma yao.
- source_word: εἰς Ἀντιόχειαν
  choice: kwenda Antiokia
  rationale: εἰς huonyesha mwendo kuelekea mahali. ‘Kwenda Antiokia’ ni Kiswahili cha asili kinachokamilisha kitenzi ‘walishuka.’
theological_decisions:
- issue: Maana na huduma ya προφῆται katika muktadha wa makanisa ya Yerusalemu na Antiokia
  choice: manabii
  alternative: walimu wa kinabii; wajumbe walioongozwa na Roho
  rationale: Kigiriki kinatumia neno la kawaida προφῆται bila kufafanua kama walikuwa manabii wenye mamlaka ya kikanoni, wahubiri wenye karama, au kundi jingine maalumu. Tafsiri pana ‘manabii’ huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo ni wa asili huku ukihifadhi mpangilio na maana muhimu za Kigiriki.
