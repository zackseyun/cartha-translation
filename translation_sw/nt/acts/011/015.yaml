  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: sw
  text: Nilipoanza kusema[a], Roho Mtakatifu akawashukia, kama alivyotushukia sisi pia[c] hapo mwanzo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati nilipoanza kusema.” Muundo wa Kigiriki unaweza kuonyesha “nilipo” au “wakati nilipo.”
    reason: lexical_alternative
  - marker: b
    text: “Hapo mwanzo” huenda inarejelea mwanzo wa kumwagwa kwa Roho juu ya wanafunzi, yaani, siku ya Pentekoste.
    reason: cross_reference
  - marker: c
    text: 'Kwa karibu zaidi: “kama vile juu yetu sisi pia.”'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: Nilipoanza kusema
  rationale: 'Muundo wa ἐν pamoja na kitenzi-jina chenye kibainishi unaonyesha wakati unaoandamana na tendo: “nilipoanza” au “wakati nilipoanza.” Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha kwamba jambo hilo lilitokea mwanzoni mwa Petro kusema.'
- source_word: ἐπέπεσεν
  choice: akawashukia
  rationale: Kitenzi ἐπιπίπτω pamoja na ἐπί ni usemi wenye nguvu kuhusu Roho kuwajia watu. “Akawashukia” ni Kiswahili cha kawaida na chenye hadhi, huku kikihifadhi picha ya kuja juu yao bila kutumia “akawaangukia,” ambayo hapa inaweza kueleweka vibaya.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, sahihi, na linaloeleweka katika Kiswahili cha sasa.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: kama alivyotushukia sisi pia
  rationale: “Kama” linaonyesha ulinganisho wa karibu wa ὥσπερ, na “pia” linawakilisha καί. Kitenzi kilichodokezwa katika Kigiriki kimerudiwa ili sentensi iwe ya asili na wazi katika Kiswahili.
- source_word: ἐν ἀρχῇ
  choice: hapo mwanzo
  rationale: Usemi huu unaonyesha wakati wa awali unaolinganishwa na tukio la sasa. “Hapo mwanzo” ni wa kawaida katika simulizi na hauelekezi kimakosa kwenye mwanzo wa uumbaji.
theological_decisions:
- issue: Kinachorejelewa na “hapo mwanzo” (ἐν ἀρχῇ)
  choice: Tafsiri imeacha usemi mpana “hapo mwanzo,” ambao katika muktadha huenda unarejelea kumwagwa kwa Roho kwa mara ya kwanza juu ya wanafunzi, hasa Pentekoste.
  alternative: Usemi wa jumla “mwanzoni” bila kutaja tukio maalumu.
  rationale: Petro analinganisha yaliyowapata watu wa nyumba ya Kornelio na yaliyowapata “sisi.” Muktadha wa Matendo unaelekeza kwenye Pentekoste, lakini mstari wenyewe haulitaji tukio hilo kwa jina; kwa hiyo tafsiri hailazimishi ufafanuzi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. “Akawashukia” ni wa asili zaidi kuliko tafsiri sisisi “akawaangukia,” na “sisi pia” huhifadhi msisitizo wa ulinganisho uliopo katika Kigiriki.
