  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: sw
  text: Basi wale waliotawanywa kwa sababu ya dhiki[a] iliyotokea kuhusiana na Stefano walisafiri hadi Foinike, Kipro na Antiokia, bila kumwambia mtu yeyote neno[b], isipokuwa Wayahudi tu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taabu” au “mateso.” Neno la Kigiriki linaweza kumaanisha dhiki, taabu, au mateso kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: “Neno” hapa linamaanisha ujumbe uliotangazwa kuhusu Yesu; pia linaweza kutafsiriwa “ujumbe.”
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki kina msisitizo: “isipokuwa Wayahudi tu” au “isipokuwa Wayahudi peke yao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: waliokuwa wametawanywa
  rationale: Huhifadhi hali ya kutendwa na huonyesha kuwa kutawanywa kulitangulia safari yao.
- source_word: θλίψεως
  choice: dhiki
  rationale: Ni neno pana linaloweza kumaanisha taabu, shida au mateso makali bila kulibana moja kwa moja kuwa ‘udhi’ pekee.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: iliyotokea kuhusiana na Stefano
  rationale: Huhifadhi uhusiano wa tukio hilo na kisa cha Stefano bila kudai kwamba Stefano mwenyewe ndiye aliyelisababisha.
- source_word: διῆλθον ἕως
  choice: walisafiri mpaka
  rationale: Hueleza kwa Kiswahili cha kawaida mwendo wao na umbali waliofika.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Foinike, Kipro na Antiokia
  rationale: Haya ni maumbo ya kawaida ya Kiswahili kwa eneo, kisiwa na mji unaotajwa.
- source_word: μηδενὶ λαλοῦντες τὸν λόγον
  choice: Hawakumwambia mtu yeyote neno hilo
  rationale: Hutoa Kiswahili cha kawaida huku ikihifadhi tendo la kusema kwa watu na istilahi ya Luka ‘neno’; ‘hilo’ huonyesha ujumbe unaojulikana katika muktadha.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: isipokuwa Wayahudi peke yao
  rationale: Huhifadhi msisitizo maradufu wa kizuizi cha hadhira katika εἰ μή na μόνον.
theological_decisions:
- issue: Asili ya dhiki iliyofuata kisa cha Stefano
  choice: dhiki
  alternative: udhi; mateso
  rationale: Muktadha unahusu vitendo vya uadui, lakini θλῖψις ni pana kuliko istilahi mahsusi ya udhi. ‘Dhiki’ huhifadhi upana huo.
- issue: Maana ya τὸν λόγον katika Matendo
  choice: neno hilo
  alternative: ujumbe; ujumbe kuhusu Yesu
  rationale: ‘Neno’ huhifadhi istilahi inayojirudia katika simulizi la Luka; tanbihi inafafanua kuwa hapa linamaanisha ujumbe uliotangazwa bila kuongeza ufafanuzi huo ndani ya andiko kuu.
- issue: Upekee wa hadhira
  choice: Wayahudi peke yao
  alternative: Wayahudi tu
  rationale: ‘Peke yao’ huhifadhi msisitizo wa μόνον huku ‘isipokuwa’ ikihifadhi muundo wa kutenga hadhira nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa mara mbili ili iwe rahisi kueleweka bila kubadili uhusiano wa kimantiki. Majina ya mahali yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
