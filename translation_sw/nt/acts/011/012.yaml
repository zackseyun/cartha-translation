id: ACT.11.12
reference: Acts 11:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: sw
  text: Roho akaniambia niende pamoja nao bila kubagua.[a] Ndugu hawa sita pia walikuja pamoja nami, nasi tukaingia katika nyumba ya mtu huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila kusita” au “bila kuwa na shaka.” Kirai cha Kigiriki kinaweza kumaanisha kutobagua au kutoyumba.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: Roho
  rationale: Katika Matendo, neno hili likiwa na kibainishi na katika muktadha wa mwongozo wa ufunuo linamtaja Roho Mtakatifu. “Roho” linahifadhi namna ya usemi wa Luka bila kuongeza “Mtakatifu,” ambalo halipo wazi katika kifungu hiki.
- source_word: εἶπεν ... μοι
  choice: akaniambia
  rationale: Muundo huu unawasilisha agizo; “akaniambia” ni Kiswahili cha kawaida na huonyesha kwa uwazi kwamba Petro alipokea maelekezo.
- source_word: συνελθεῖν αὐτοῖς
  choice: niende pamoja nao
  rationale: Kitenzi hiki hapa kinamaanisha kuandamana na wale watu. Tafsiri hii ni ya kawaida na wazi katika muktadha.
- source_word: μηδὲν διακρίναντα
  choice: bila kubagua
  rationale: Katika muktadha wa Petro kuvuka mpaka wa kijamii na kidini kati ya Wayahudi na watu wa mataifa, “bila kubagua” huwasilisha vizuri wazo la kutofanya tofauti. Uwezekano wa maana za kusita au kuwa na shaka umehifadhiwa katika tanbihi.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: ndugu hawa sita
  rationale: “Ndugu” linafaa kwa waandamani hawa sita wa kiume, na “hawa” linahifadhi οὗτοι.
- source_word: εἰσήλθομεν
  choice: tukaingia
  rationale: Hii ni tafsiri ya kawaida ya kitenzi cha kuingia na inaendeleza mfuatano wa simulizi kwa ufasaha.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: nyumba ya mtu huyo
  rationale: Tafsiri hii inahifadhi nomino iliyo wazi katika Kigiriki na kumtaja yule mwanamume mahususi aliyekuwa akizungumziwa.
theological_decisions:
- issue: Maana ya μηδὲν διακρίναντα katika taarifa ya Petro
  choice: bila kubagua
  alternative: bila kusita; bila kuwa na shaka
  rationale: Muktadha wa karibu unahusu Petro kuingia katika nyumba ya mtu wa mataifa na kisha kutetea tendo hilo mbele ya waamini Wayahudi. Kwa hiyo, kutofanya ubaguzi kunafaa sana katika muktadha huu. Hata hivyo, Kigiriki kinaweza pia kumaanisha kutosita au kutokuwa na shaka, hivyo maana hizo hazijaondolewa bali zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kwa usomaji wa kawaida huku ikihifadhi mfuatano wa simulizi na utata halisi wa kirai cha Kigiriki.
