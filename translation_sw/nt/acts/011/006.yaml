translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Orodha ya makundi ya viumbe imehifadhiwa, na tanbihi imewekwa kwenye neno linalohusika.
