base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: sw
  text: Nilipokazia macho ndani yake, nilikuwa nikiichunguza kwa makini, nami nikaona wanyama wenye miguu minne wa nchi, wanyama wa mwituni, wanyama watambaao[a], na ndege wa angani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viumbe vinavyotambaa.” Neno la Kigiriki linaweza kumaanisha kwa upana viumbe vinavyotambaa, kama katika makundi ya viumbe yanayotajwa katika simulizi la uumbaji na sheria kuhusu vyakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: ndani yake
  rationale: Kirai hiki kinarejelea kitu kilichokuwa kama shuka katika maono ya Petro. Pamoja na ἀτενίζω, kinaonyesha kwamba alielekeza macho ndani yake, si kwamba alikitazama juu juu tu.
- source_word: ἀτενίσας
  choice: Nilikaza macho
  rationale: Huwasilisha kutazama kwa makini na kwa umakini mkubwa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: κατενόουν
  choice: nikaichunguza kwa makini
  rationale: Kitenzi hiki kinaonyesha uchunguzi wa makini na unaoendelea, na kimetofautishwa na tendo linalofuata la kuona.
- source_word: εἶδον
  choice: nikaona
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayodumisha tofauti kati ya kuchunguza na kuona.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: wanyama wa duniani wenye miguu minne
  rationale: Huhifadhi kundi la viumbe wenye miguu minne na kirai ‘wa duniani’ bila kutumia istilahi ngumu ya kitaalamu.
- source_word: τὰ θηρία
  choice: wanyama wa porini
  rationale: Hutofautisha wanyama wa mwituni na kundi pana la wanyama wenye miguu minne kwa lugha ya kawaida ya Kiswahili.
- source_word: τὰ ἑρπετὰ
  choice: wanyama watambaao
  rationale: Ni tafsiri ya kawaida inayoeleweka, huku tanbihi ikihifadhi maana pana zaidi ya viumbe vinavyotambaa.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: Katika orodha hii ya viumbe, ‘ndege’ ni ya asili na ‘angani’ inaonyesha eneo halisi bila kuleta utata wa maana ya mbinguni.
