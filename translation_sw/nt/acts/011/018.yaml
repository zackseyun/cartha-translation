  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: sw
  text: Waliposikia mambo haya, wakanyamaza, wakamtukuza Mungu, wakisema, “Basi, Mungu amewajalia hata watu wa mataifa toba inayoleta uzima.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Waliposikia mambo haya
  rationale: Kirai tegemezi cha wakati kinaonyesha kuwa kusikia taarifa ya Petro kulitokea kabla ya matendo makuu; δέ ni kiunganishi hafifu kinachomezwa kwa kawaida katika mtiririko wa Kiswahili.
- source_word: ἡσύχασαν
  choice: wakanyamaza
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba waliacha kupinga na kuwa kimya; “wakanyamaza” ni wazi na ya kawaida.
- source_word: ἐδόξασαν τὸν θεόν
  choice: wakamtukuza Mungu
  rationale: “Kumtukuza Mungu” huhifadhi uzito wa δοξάζω na ni usemi wa kawaida katika Kiswahili cha kibiblia kinachoeleweka.
- source_word: Ἄρα
  choice: Basi
  rationale: Neno hili linatanguliza hitimisho walilofikia kutokana na maelezo ya Petro.
- source_word: καὶ τοῖς ἔθνεσιν
  choice: hata watu wa mataifa mengine
  rationale: Hapa ἔθνη ni watu wasio Wayahudi; “hata” huonyesha kwamba tendo la Mungu limewafikia wao pia, bila kutumia istilahi isiyoeleweka kwa baadhi ya wasomaji.
- source_word: τὴν μετάνοιαν
  choice: toba
  rationale: “Toba” ni neno la kawaida na lenye hadhi kwa μετάνοια, likihusisha mabadiliko ya nia na kugeuka, bila kulipunguza kuwa badiliko la kiakili pekee.
- source_word: εἰς ζωὴν
  choice: inayoleta uzima
  rationale: 'Huhifadhi maana ya mwelekeo au matokeo ya εἰς: toba hii inaelekea kwenye uzima au kuzaa uzima.'
- source_word: ἔδωκεν
  choice: amewajalia
  rationale: Kitenzi kinawasilisha toba kama jambo ambalo Mungu amewapa; wakati timilifu wa Kiswahili unaonyesha tendo lililotimia lenye umuhimu wa sasa.
theological_decisions:
- issue: Toba kama jambo analolitoa Mungu
  choice: “Mungu amewajalia ... toba”
  alternative: “Mungu amewapa ... toba”
  rationale: “Amewajalia” huhifadhi wazi wazo la ἔδωκεν kwamba Mungu ndiye aliyetoa toba, bila kuongeza mfumo mpana wa mafundisho kuhusu uhusiano kati ya tendo la Mungu na mwitikio wa mwanadamu.
- issue: Uhusiano wa toba na uzima
  choice: “toba inayoleta uzima”
  alternative: “toba kwa ajili ya uzima” au “toba inayoelekea kwenye uzima”
  rationale: Kirai cha Kigiriki εἰς ζωήν kinaweza kuonyesha lengo au matokeo. Tafsiri iliyochaguliwa ni ya asili kwa Kiswahili huku ikihifadhi uhusiano huo bila kufafanua kupita maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mlolongo wa kusikia, kunyamaza, kumtukuza Mungu, na kutoa hitimisho.
