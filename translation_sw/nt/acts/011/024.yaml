  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: sw
  text: Kwa maana alikuwa mwanamume mwema, aliyejaa Roho Mtakatifu na imani.[a] Na idadi kubwa ya watu ikaongezwa kwa Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyejaa Roho Mtakatifu na uaminifu.” Neno la Kigiriki πίστις linaweza pia kumaanisha “uaminifu” au “tumaini”; hapa matini kuu imetumia maana ya kawaida “imani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaonyesha kwamba sentensi hii inaeleza sababu ya sifa iliyotangulia kuhusu Barnaba, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ἀνὴρ ἀγαθὸς
  choice: mtu mwema
  rationale: Katika Kiswahili, “mtu mwema” ni usemi wa kawaida unaoeleza wazi sifa ya kimaadili ya Barnaba bila kulazimika kutumia “mwanamume,” kwa kuwa marejeo yake tayari yako wazi.
- source_word: πλήρης πνεύματος ἁγίου
  choice: aliyejaa Roho Mtakatifu
  rationale: Muundo huu ni wa kawaida na wenye hadhi katika Kiswahili, na unamtaja Roho Mtakatifu kama nafsi ya Mungu, kama ilivyo kawaida katika Luka–Matendo.
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya msingi ya πίστις na inafaa katika maelezo ya tabia ya Barnaba; maana inayowezekana ya “uaminifu” imehifadhiwa katika tanbihi.
- source_word: προσετέθη
  choice: wakaongezwa
  rationale: Kauli tendwa ya Kigiriki imehifadhiwa, bila kuibadili kuwa kauli kwamba watu walijiunga wenyewe.
- source_word: ὄχλος ἱκανὸς
  choice: watu wengi
  rationale: Ingawa ὄχλος kwa msingi ni umati, “watu wengi” ni Kiswahili cha kawaida zaidi katika muktadha wa watu wanaoongezwa na kinaonyesha ukubwa mkubwa wa kundi.
- source_word: τῷ κυρίῳ
  choice: kwa Bwana
  rationale: Inahifadhi kitu kilichotajwa wazi katika Kigiriki—Bwana—badala ya kukibadili kwa tafsiri ya kimafafanuzi kuwa kanisa au jumuiya.
theological_decisions:
- issue: Maana ya πνεύματος ἁγίου
  choice: Roho Mtakatifu, yaani nafsi ya Mungu
  alternative: roho au tabia takatifu
  rationale: Katika Luka–Matendo, usemi huu kwa kawaida humrejelea Roho Mtakatifu, na muktadha unaeleza maisha ya Barnaba yaliyoongozwa na Roho.
- issue: Maana ya πίστεως katika sifa ya Barnaba
  choice: imani
  alternative: uaminifu
  rationale: Muktadha unaweza kuruhusu imani ya ndani au sifa ya kuwa mwaminifu. Tafsiri kuu inatumia maana ya msingi “imani,” huku maana nyingine ikihifadhiwa katika tanbihi.
- issue: Watu waliongezwa kwa nani katika προσετέθη ... τῷ κυρίῳ
  choice: kwa Bwana
  alternative: kwa kanisa au jumuiya
  rationale: Kigiriki kinamtaja Bwana moja kwa moja. Ingawa kuingizwa katika jumuiya ya waamini kunaweza kudokezwa, hakupaswi kuchukua nafasi ya maneno ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na rahisi kueleweka. “Watu wengi” limetumiwa badala ya “umati mkubwa” ili kuepuka usemi mzito wa kuongeza umati kwa Bwana, huku maana ya kundi kubwa ikihifadhiwa.
