  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: sw
  text: Habari kuwahusu ikafika masikioni mwa kanisa lililokuwa Yerusalemu[a], nao wakamtuma Barnaba mpaka Antiokia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Habari kuwahusu ikasikiwa na kanisa lililokuwa Yerusalemu”; kwa tafsiri ya neno kwa neno, “habari kuwahusu ikasikiwa mpaka masikioni mwa kanisa lililokuwa Yerusalemu.”
    reason: Mbadala huu unaonyesha kwa karibu zaidi hali ya kutendwa na nahau ya Kigiriki, ingawa si usemi wa kawaida katika Kiswahili.
lexical_decisions:
- source_word: ἠκούσθη
  choice: ikafika
  rationale: Katika muundo huu wa nahau, kitenzi cha hali ya kutendwa pamoja na ‘masikioni’ kinaeleza habari iliyowafikia watu. ‘Ikafika’ ni ya kawaida katika Kiswahili na maana ya kusikia inadumishwa na ‘masikioni.’
- source_word: ὁ λόγος
  choice: Habari
  rationale: Katika muktadha huu λόγος ni taarifa kuhusu watu na matukio yaliyotangulia, si hotuba rasmi wala ‘Neno’ kwa maana ya kiteolojia.
- source_word: εἰς τὰ ὦτα
  choice: masikioni mwa
  rationale: Hii inadumisha taswira ya Kigiriki huku ikitumia nahau ya kawaida ya Kiswahili, ‘habari kufika masikioni mwa mtu.’
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Katika Matendo neno hili kwa kawaida linamaanisha jumuiya ya waamini; ‘kanisa’ ndilo neno la kawaida na linaloeleweka katika Kiswahili sanifu.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: lililokuwa Yerusalemu
  rationale: Kirai hiki kinatambulisha kanisa linalozungumziwa. ‘Lililokuwa Yerusalemu’ kinafuata wazi maana ya kirai cha Kigiriki bila kulazimisha kihusishi kisichohitajika katika Kiswahili.
- source_word: περὶ αὐτῶν
  choice: kuwahusu
  rationale: Kiwakilishi cha wingi kwa kawaida kinawarejelea watu waliotajwa katika muktadha uliotangulia. Tafsiri hii inadumisha rejeo hilo bila kulifafanua kupita maandishi.
- source_word: ἐξαπέστειλαν
  choice: wakamtuma
  rationale: Kitenzi kina maana ya kumtuma au kumpeleka mtu. Kiswahili ‘wakamtuma’ ni cha asili na kinabeba tendo la kumwagiza Barnaba aende.
- source_word: Βαρναβᾶν
  choice: Barnaba
  rationale: Hili ndilo umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: ἕως Ἀντιοχείας
  choice: mpaka Antiokia
  rationale: ‘Mpaka’ linahifadhi wazo la ἕως la kufikia mahali, huku Antiokia likiwa umbo la jina lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Mhusika wa ‘wakamtuma’
  choice: Kiwakilishi cha wingi ‘wao’ kinarejelea kanisa la Yerusalemu kwa ujumla.
  alternative: Viongozi fulani wasiotajwa ndani ya kanisa la Yerusalemu ndio waliomtuma.
  rationale: Nomino iliyo karibu inayoweza kuwa mtendaji ni kanisa la Yerusalemu. Kwa kuwa maandishi hayawataji mitume, wazee, au kundi jingine mahsusi, tafsiri haiongezi uongozi ambao haukutajwa.
- issue: Rejeo la περὶ αὐτῶν
  choice: ‘Kuwahusu’ inadumisha rejeo kwa watu waliotangulia kutajwa.
  alternative: ‘Kuhusu mambo hayo’ lingeweza kurejelea matukio au hali yote iliyosimuliwa.
  rationale: Umbo la Kigiriki ni kiwakilishi cha wingi kinachoweza kurejelea watu, lakini muktadha pia unahusisha habari za matukio. Tafsiri kuu inafuata rejeo la watu huku tanbihi ikihifadhi uwezekano mpana zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye heshima. ‘Ikafika masikioni’ ni nahau ya sasa na ya kawaida; kiunganishi ‘-ka-’ kinadumisha mfuatano wa simulizi unaoletwa na δέ bila kuongeza neno la wakati kama ‘sasa.’
