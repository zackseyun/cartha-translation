source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: sw
  text: Mmoja wao, aliyeitwa Agabo, akasimama akafanya ijulikane kwa njia ya Roho kwamba njaa kubwa ingetokea katika ulimwengu wote unaokaliwa na binadamu[a]—njaa hiyo ilitokea wakati wa Klaudio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dunia yote”; katika Luka–Matendo, “ulimwengu unaokaliwa na binadamu” unaweza pia kumaanisha hasa ulimwengu wa Dola ya Roma.
    reason: Mbadala wa kileksia unaohifadhi uwezekano wa upeo mpana au ule unaohusiana zaidi na Dola ya Roma.
lexical_decisions:
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Kitenzi hiki kinaonyesha tendo la Agabo kusimama katika mkutano; ‘akasimama’ ni cha kawaida na kinahifadhi maana ya kimwili ya neno la Kigiriki.
- source_word: ἐσήμανεν
  choice: kuonyesha
  rationale: ‘Kuonyesha’ kinahifadhi maana pana ya kufanya jambo lijulikane bila kulazimisha tafsiri maalumu zaidi kama ‘kutabiri,’ ingawa muktadha unaonyesha wazi kuwa ujumbe ulihusu wakati ujao.
- source_word: διὰ τοῦ πνεύματος
  choice: kwa njia ya Roho
  rationale: Kirai hiki kinaonyesha njia au utendaji wa Roho; herufi kubwa inaonyesha kwamba katika muktadha wa unabii katika Matendo, anayelengwa ni Roho Mtakatifu.
- source_word: λιμὸν μεγάλην
  choice: njaa kubwa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino na kivumishi vya Kigiriki, bila kubadili ‘kubwa’ kuwa ufafanuzi kama ‘kali.’
- source_word: μέλλειν ἔσεσθαι
  choice: ilikuwa karibu kutokea
  rationale: Muundo huu unaonyesha tukio la baadaye lililotazamiwa au lililokaribia; ‘ilikuwa karibu kutokea’ huhifadhi wazo hilo na unasomeka kwa kawaida.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: katika ulimwengu wote unaokaliwa na watu
  rationale: Tafsiri hii inahifadhi maana ya msingi ya οἰκουμένη bila kuibana kimya kimya iwe Dola ya Roma pekee au dunia nzima kwa maana ya kisasa.
- source_word: ἥτις ἐγένετο
  choice: nayo ilitokea
  rationale: ‘Nayo’ inaunganisha kwa kawaida njaa iliyotajwa na taarifa kwamba ilitokea; ‘ilitokea’ ni Kiswahili cha sasa na wazi.
- source_word: ἐπὶ Κλαυδίου
  choice: wakati wa Klaudio
  rationale: Kirai hiki cha kihistoria humaanisha wakati Klaudio alipokuwa mtawala; tafsiri hii ni sahihi na haiongezi neno ‘utawala’ lisilosemwa moja kwa moja.
theological_decisions:
- issue: Rejeo la ‘Roho’ katika διὰ τοῦ πνεύματος
  choice: Roho Mtakatifu ndiye anayelengwa, akiwakilishwa katika matini kwa ‘Roho’
  alternative: roho kwa maana isiyo maalumu zaidi ya msukumo wa kiroho
  rationale: Katika Matendo, ‘Roho’ katika muktadha wa ufunuo wa kinabii kwa kawaida humaanisha Roho Mtakatifu. Herufi kubwa inaonyesha uamuzi huu wa kimuktadha.
- issue: Upeo wa οἰκουμένη
  choice: ulimwengu wote unaokaliwa na watu
  alternative: dunia yote; ulimwengu wote wa Roma
  rationale: Neno linaweza kumaanisha ulimwengu unaokaliwa kwa upana, na katika Luka–Matendo wakati mwingine linaweza kulenga zaidi ulimwengu wa Dola ya Roma. Matini kuu inahifadhi usemi mpana, huku tanbihi ikitaja uwezekano wa maana iliyo finyu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa sentensi ni wa asili kwa Kiswahili, huku ukihifadhi mfuatano wa matendo, utendaji wa Roho, uzito wa njaa, na kutotajwa kwa uhakika upeo kamili wa οἰκουμένη.
