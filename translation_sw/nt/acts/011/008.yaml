  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: sw
  text: Lakini nikasema, ‘La hasha, Bwana, kwa sababu hakuna kitu cha kawaida au najisi ambacho kimewahi kuingia kinywani mwangu.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: La hasha
  rationale: Kauli thabiti na ya kawaida ya kukataa kabisa, inayolingana na nguvu ya neno la Kigiriki.
- source_word: κύριε
  choice: Bwana
  rationale: Huhifadhi namna ya kumwita anayesema naye bila kuamua zaidi utambulisho wake katika mstari huu.
- source_word: κοινὸν
  choice: cha kawaida
  rationale: Huhifadhi tofauti ya kimsamiati kati ya κοινόν, yaani kitu kinachohesabiwa kuwa cha kawaida au kisichotakaswa, na ἀκάθαρτον, ‘najisi.’
- source_word: ἀκάθαρτον
  choice: najisi
  rationale: Neno la kawaida la kibiblia kwa kitu kisicho safi kwa maana ya kidini.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: kimewahi kuingia kinywani mwangu
  rationale: Hufuata taswira halisi ya chanzo huku ikieleweka kwa kawaida kuwa ni kula.
theological_decisions:
- issue: Tofauti kati ya κοινόν na ἀκάθαρτον
  choice: cha kawaida au najisi
  alternative: kisicho halali au kichafu
  rationale: Tafsiri iliyochaguliwa haiunganisi istilahi hizo mbili wala kuziwekea maana pana kuliko chanzo.
- issue: Uhusiano wa ὅτι na kauli iliyotangulia
  choice: kwa sababu
  alternative: kwa maana
  rationale: Huwasilisha wazi sababu iliyotolewa na Petro, sawasawa na matumizi ya ὅτι hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. ‘La hasha’ huhifadhi uzito wa katazo, na ‘kinywani mwangu’ huhifadhi usemi wa chanzo.
