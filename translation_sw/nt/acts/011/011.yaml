  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: sw
  text: Na tazama, mara ileile wanaume watatu wakafika kwenye nyumba tulimokuwa, wakiwa wametumwa kutoka Kaisaria kwangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Hudumisha kiashiria cha kisimulizi kinachovuta fikira kwenye tukio muhimu, kwa lugha ya kibiblia inayofahamika katika Kiswahili.
- source_word: ἐξαυτῆς
  choice: mara hiyo hiyo
  rationale: Huonyesha kwamba jambo lilitokea papo hapo na kulihusisha kwa karibu na tukio lililotangulia.
- source_word: τρεῖς ἄνδρες
  choice: watu watatu
  rationale: Katika muktadha huu warejelewa ni wanaume, lakini Kiswahili cha kawaida hutumia kwa ufasaha 'watu watatu'; jinsia yao haibadilishi maana ya mstari.
- source_word: ἐπέστησαν
  choice: wakafika
  rationale: Hutoa maana ya kufika na kuwapo mahali hapo, huku kiambishi -ka- kikisogeza mbele simulizi kwa njia ya kawaida katika Kiswahili.
- source_word: ἐπὶ τὴν οἰκίαν
  choice: kwenye nyumba
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha mahali walipofika bila tafsiri sisisi isiyo ya kawaida.
- source_word: ἐν ᾗ ἦμεν
  choice: tulimokuwa
  rationale: Huhifadhi dai la msingi la mahali walipokuwa bila kuongeza kwamba walikuwa wakikaa humo.
- source_word: ἀπεσταλμένοι
  choice: wakiwa wametumwa
  rationale: Huhifadhi hali ya kutumwa iliyotangulia kufika kwao na pia sauti tendwa ya chanzo.
- source_word: ἀπὸ Καισαρείας
  choice: kutoka Kaisaria
  rationale: Huonyesha mahali walikotoka na kutumia umbo la kawaida la Kiswahili la jina la mahali.
- source_word: πρός με
  choice: kuja kwangu
  rationale: Huonyesha mwelekeo wao kwa Petro kama mlengwa kwa Kiswahili cha kawaida.
