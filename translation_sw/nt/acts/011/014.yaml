  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: sw
  text: Atakuambia maneno; kwa maneno hayo wewe na watu wa nyumbani mwako wote mtaokolewa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ambamo” au “kupitia hayo”; usemi wa Kigiriki unaonyesha kwamba maneno hayo ndiyo njia ambayo wokovu hupatikana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Atakuambia
  rationale: Kiwakilishi rejeshi kinamrejelea mtu aliyetajwa kabla; katika Kiswahili, mhusika huyo anaweza kuonyeshwa kiasili kwa kiambishi cha nafsi a- ndani ya kitenzi.
- source_word: λαλήσει ῥήματα πρὸς σὲ
  choice: Atakuambia maneno
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba maneno yanaelekezwa kwa msikilizaji, huku ukihifadhi nomino ya wingi ῥήματα, ‘maneno.’
- source_word: ἐν οἷς
  choice: ambayo kwa hayo
  rationale: 'Usemi huu unahifadhi uhusiano na ‘maneno’ na pia maana ya chombo au njia: wokovu utakuja kwa njia ya maneno hayo.'
- source_word: σωθήσῃ
  choice: mtaokolewa
  rationale: σῴζω katika muktadha huu wa Matendo ina maana ya wokovu; umbo la kutendwa limehifadhiwa kwa ‘mtaokolewa.’
- source_word: σὺ καὶ πᾶς ὁ οἶκός σου
  choice: wewe na watu wote wa nyumbani mwako
  rationale: σὺ imeonyeshwa wazi kwa ‘wewe’ ili kudumisha mkazo, na οἶκος inaeleweka kuwa jamii ya watu wa nyumba, si jengo.
theological_decisions:
- issue: Maana ya σωθήσῃ katika habari ya nyumba ya Kornelio
  choice: mtaokolewa
  alternative: mtaokoswa / mtafunguliwa
  rationale: ‘Mtaokolewa’ inadumisha maana ya wokovu katika muktadha wa ujumbe unaotangazwa bila kuingiza maelezo ya kimadhehebu kuhusu namna wokovu huo unavyopokelewa.
- issue: Upeo wa πᾶς ὁ οἶκός σου
  choice: watu wote wa nyumbani mwako
  alternative: nyumba yako yote
  rationale: Tafsiri inaonyesha wazi kuwa kinachokusudiwa ni watu wa kaya. Haidai kwamba waliokolewa moja kwa moja bila mwitikio, wala haiongezi sharti ambalo mstari huu haulitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Watu wote wa nyumbani mwako’ ni wazi zaidi kwa wasomaji wa kawaida kuliko ‘nyumba yako yote,’ ambayo inaweza kueleweka kuwa jengo. Muundo ‘ambayo kwa hayo’ ni rasmi kiasi lakini unaweka wazi rejeo na maana ya chombo iliyomo katika Kigiriki.
