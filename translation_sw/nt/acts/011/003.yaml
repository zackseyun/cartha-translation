lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kirai cha wakati uliopo kinatanguliza maneno ya shtaka na kuunganisha aya hii na simulizi iliyotangulia.
- source_word: ὅτι
  choice: alama za kunukuu
  rationale: Hapa ὅτι inatanguliza usemi wa moja kwa moja; alama za kunukuu ni za kawaida katika Kiswahili.
- source_word: Εἰσῆλθες
  choice: Uliingia
  rationale: Kitenzi hiki kinaendeleza maana halisi ya kuingia mahali walipokuwa watu hao.
- source_word: πρὸς
  choice: kwa
  rationale: Likitumiwa kuhusu watu, πρός hapa linaonyesha kuingia mahali pao au kujiunga nao; ‘kwa’ ni usemi wa kawaida wa Kiswahili.
- source_word: ἄνδρας
  choice: wanaume
  rationale: ἀνήρ hapa humaanisha wanaume, si watu kwa ujumla.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: wasiotahiriwa
  rationale: Usemi huu wa Kiyahudi unatambua hali yao kwa kutotahiriwa; tafsiri hii huhifadhi lugha ya mpaka wa agano bila kuifasiri moja kwa moja kuwa ‘Mataifa.’
- source_word: καὶ
  choice: na
  rationale: Huunganisha mashtaka mawili kwa urahisi.
- source_word: συνέφαγες
  choice: ukala pamoja
  rationale: Kitenzi ambatano kinasisitiza kula kwa ushirika; ‘kula pamoja’ ni cha asili na hudumisha msisitizo huo.
- source_word: αὐτοῖς
  choice: nao
  rationale: Kiwakilishi hiki kinakamilisha usemi ‘ukala pamoja nao’ kwa kurejelea wanaume waliotajwa.
theological_decisions:
- issue: Iwapo ἀκροβυστίαν ἔχοντας itafsiriwe kwa ufafanuzi kama ‘watu wa Mataifa’ au kwa lugha ya kutotahiriwa
  choice: wasiotahiriwa
  alternative: watu wa Mataifa
  rationale: Shtaka lenyewe limeelezwa kwa lugha ya ishara ya agano na mpaka wa ushirika. ‘Wasiotahiriwa’ huhifadhi mkazo wa kitheolojia na kijamii wa Kigiriki bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wanaume wasiotahiriwa’ ni wazi na sahihi kijinsia; ‘ukala pamoja nao’ huonyesha suala la ushirika wa mezani lililomo katika shtaka.
