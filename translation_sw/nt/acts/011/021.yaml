  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: sw
  text: Mkono wa Bwana ulikuwa pamoja nao, na idadi kubwa ya watu waliomwamini ikamgeukia Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “idadi kubwa ya wale walioamini ikamgeukia Bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: mkono wa Bwana
  rationale: Nahau hii ya kibiblia inaonyesha nguvu inayotenda au kibali cha Bwana. Tafsiri ya moja kwa moja inadumisha sitiari na mwangwi wake katika Maandiko bila kuwa ngumu kueleweka kwa Kiswahili.
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo jina la heshima la kawaida kwa κύριος katika muktadha huu; halipunguzi maana kuwa ‘bwana mkubwa’ wala kumtaja mhusika kwa ufafanuzi ambao Kigiriki hakijaweka wazi.
- source_word: μετ’ αὐτῶν
  choice: pamoja nao
  rationale: μετά pamoja na hali ya umilikishi hapa ina maana ya kuwapo na kuwaunga mkono wahubiri hao.
- source_word: πολύς τε ἀριθμός
  choice: idadi kubwa
  rationale: Uteuzi huu unadumisha muundo wa nomino wa Kigiriki na unaeleza kwa Kiswahili cha kawaida kundi kubwa la watu.
- source_word: ὁ πιστεύσας
  choice: wale walioamini
  rationale: Kivumishi-jina cha wakati uliopita kinarejelea kwa ujumla watu waliokuwa katika ‘idadi kubwa.’ Kiswahili hutumia kwa kawaida kishazi cha uhusiano ‘wale walioamini.’
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: wakamgeukia Bwana
  rationale: Kitenzi kinaonyesha kugeuka au kuelekeza maisha kwa Bwana. ‘Wakamgeukia’ kinadumisha maana hiyo bila kuongeza wazi wazo la toba au kudokeza kwamba walikuwa wakirudi katika uhusiano wa awali.
theological_decisions:
- issue: Mhusika anayeitwa ‘Bwana’ katika muktadha huu
  choice: Kutafsiri κύριος kuwa ‘Bwana’ katika sehemu zote mbili bila kuongeza jina ‘Yesu.’
  alternative: Kusema wazi ‘Yesu’ au kueleza ‘Bwana’ kuwa Mungu kwa maana pana.
  rationale: Katika Matendo, κύριος mara nyingi inaweza kumrejelea Yesu, hasa katika muktadha wa watu kumgeukia, lakini mstari huu wenyewe unasema tu ‘Bwana.’ Tafsiri inadumisha uwazi huo wa kiteolojia.
- issue: Uhusiano wa kuamini na kumgeukia Bwana
  choice: ‘wale walioamini wakamgeukia Bwana’
  alternative: ‘baada ya kuamini, wakamgeukia Bwana’ au ‘waliamini na kumgeukia Bwana’
  rationale: Kishiriki cha aoristi kinaweza kueleweka kuwa tendo la kuamini linahusiana kwa karibu na kumgeukia Bwana, lakini muundo wenyewe hauhitaji mpangilio wa wakati uelezwe kwa ‘baada ya.’ Tafsiri haifanyi uhusiano huo kuwa wa mfuatano usio na shaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa urahisi. Sitiari ya ‘mkono wa Bwana’ imehifadhiwa; ‘wakamgeukia’ ni ya asili na huepuka kuongeza maelezo ya kimadhehebu.
