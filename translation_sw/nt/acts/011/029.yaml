  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: sw
  text: Basi wanafunzi wakaamua, kila mmoja wao kwa kadiri ya uwezo wake[a], kutuma msaada kwa ndugu[b] wanaoishi Yudea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kadiri kila mmoja alivyofanikiwa” au “kwa kadiri ya mali aliyokuwa nayo.”
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” hapa huenda inamaanisha waamini wenzao wa Yudea, kutia ndani jumuiya pana ya Kikristo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: wanafunzi
  rationale: Ni istilahi ya kawaida katika Agano Jipya kwa wafuasi wa Yesu, na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: καθὼς εὐπορεῖτό τις ... ἕκαστος αὐτῶν
  choice: kila mmoja kwa kadiri ya uwezo wake
  rationale: Kirai hiki kinaonyesha kwamba mchango wa kila mwanafunzi ulilingana na rasilimali alizokuwa nazo. Tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya mgawanyo inayosisitizwa na ἕκαστος.
- source_word: ὥρισαν
  choice: wakaamua
  rationale: Kitenzi hapa kina maana ya kufanya uamuzi au kuazimia. “Wakaamua” ni wazi, cha sasa, na kinaonyesha uamuzi wa makusudi.
- source_word: εἰς διακονίαν πέμψαι
  choice: kutuma msaada
  rationale: Katika muktadha huu διακονία ni huduma ya vitendo kwa waamini wenye uhitaji. “Kutuma msaada” huwasilisha maana ya kirai kizima kwa Kiswahili cha kawaida bila kubainisha isivyohitajika aina halisi ya msaada.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: wanaoishi Yudea
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kirai shirikishi kinachowatambulisha walengwa kwa mahali walipoishi.
- source_word: ἀδελφοῖς
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la kifamilia katika Kiswahili na linaweza pia kutumiwa kwa waamini wenzao. Kwa kuwa halibainishi jinsia kama umbo la Kigiriki, tanbihi inaeleza upana unaowezekana wa rejeo.
theological_decisions:
- issue: Neno la kifamilia ἀδελφοῖς kwa jumuiya ya waamini wa Yudea
  choice: ndugu
  alternative: waamini wenzao; ndugu wa kiume na wa kike
  rationale: Kigiriki kina umbo la wingi wa kiume, lakini katika matumizi ya Kikristo linaweza kurejelea jumuiya yenye wanaume na wanawake. “Ndugu” huhifadhi lugha ya kifamilia bila kulazimisha tafsiri finyu, huku tanbihi ikieleza uwezekano wa maana jumuishi.
- issue: Maana ya διακονία katika muktadha wa msaada wa wakati wa njaa
  choice: msaada
  alternative: huduma
  rationale: Muktadha unaonyesha huduma ya vitendo inayotumwa kwa waamini wa Yudea. “Msaada” huwasilisha kazi hiyo bila kuifanya διακονία kuwa cheo rasmi au huduma ya kidini tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya kawaida, yenye heshima, na rahisi kueleweka. Muundo wa “kila mmoja kwa kadiri ya uwezo wake” ni wa asili na unadumisha wazo la mchango unaolingana na uwezo. Jina la eneo limetolewa kama “Yudea” ili kulitofautisha wazi na dini ya Uyahudi.
