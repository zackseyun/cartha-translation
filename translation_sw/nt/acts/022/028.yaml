  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: sw
  text: Lakini yule mkuu wa jeshi akajibu[a], “Mimi niliupata uraia huu kwa fedha nyingi.” Lakini Paulo akasema[b], “Mimi hata nilizaliwa nikiwa raia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi niliupata uraia huu kwa kiasi kikubwa cha fedha.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “Lakini mimi hata nimezaliwa,” huku uraia ukieleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: mkuu wa jeshi
  rationale: Ni cheo cha afisa wa jeshi la Roma aliyekuwa na mamlaka juu ya takriban askari elfu moja. ‘Mkuu wa jeshi’ ni wazi na ya kawaida kwa msomaji wa Kiswahili bila kuingiza neno la kihistoria lisilozoeleka.
- source_word: πολλοῦ κεφαλαίου
  choice: kwa fedha nyingi
  rationale: Kirai hiki kinaonyesha gharama kubwa ya kifedha. ‘Kwa fedha nyingi’ ni Kiswahili cha asili na huhifadhi wazo la malipo makubwa bila kudai wazi zaidi ya Kigiriki kwamba ulikuwa ununuzi.
- source_word: πολιτείαν
  choice: uraia
  rationale: Katika muktadha huu neno linamaanisha hadhi ya kisheria ya kuwa raia wa Roma; ‘uraia’ linafikisha maana hiyo kwa usahihi.
- source_word: ἐκτησάμην
  choice: niliupata
  rationale: Kitenzi kinamaanisha kujipatia au kupata kitu. ‘Niliupata’ huhifadhi upana wa maana, huku kirai ‘kwa fedha nyingi’ kikieleza gharama iliyohusika.
- source_word: καὶ γεγέννημαι
  choice: nilizaliwa nikiwa nao
  rationale: Kauli hii ina uraia unaoeleweka kutokana na muktadha. ‘Nikiwa nao’ inarejelea uraia kwa Kiswahili cha kawaida, na tofauti yenye msisitizo inaonyeshwa na ‘Lakini mimi’.
- source_word: δέ
  choice: Lakini
  rationale: Kiunganishi kinaonyesha mwendelezo wenye utofauti kati ya kauli za mkuu wa jeshi na Paulo; ‘Lakini’ linaonyesha utofauti huo kwa uwazi.
- source_word: ἔφη
  choice: akasema
  rationale: Ni kitenzi cha kawaida cha kunena; ‘akasema’ ni cha asili katika masimulizi ya Kiswahili na hakiongezi nguvu isiyokuwapo katika Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi, wa sasa na wenye heshima. ‘Mkuu wa jeshi’ limetumiwa badala ya istilahi ya kihistoria isiyozoeleka, na viambishi vya ngeli katika ‘niliupata’ na ‘nao’ vinarejelea ‘uraia’.
