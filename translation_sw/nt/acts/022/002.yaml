  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: sw
  text: 'Lakini waliposikia kwamba alikuwa akiwahutubia kwa lugha ya Kiebrania[a], wakawa kimya hata zaidi. Na akasema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “kwa lugha ya Kiaramu.” Kigiriki kinasema “kwa lugha ya Kiebrania,” lakini katika muktadha huu huenda kikarejelea lugha ya Kisemiti iliyotumiwa katika Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Lakini waliposikia
  rationale: Kirai cha wakati chenye kitenzi kishirikishi cha aoristi kinaelezwa kwa Kiswahili cha kawaida kama “waliposikia”; “lakini” linaonyesha mgeuko mdogo wa simulizi na badiliko la mwitikio wa umati.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: kwa lugha ya Kiebrania
  rationale: Neno la Kigiriki linaitaja lugha au lahaja ya Kiebrania moja kwa moja. Maandishi makuu yanahifadhi jina hilo, huku tanbihi ikieleza uwezekano wa kurejelea Kiaramu.
- source_word: προσεφώνει αὐτοῖς
  choice: alikuwa akizungumza nao
  rationale: Wakati usiotimilifu unaonyesha tendo lililokuwa likiendelea na kuelekezwa kwa wasikilizaji. Kauli hii ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: wakatulia hata zaidi
  rationale: Hii ni nahau yenye maana halisi ya kutoa ukimya zaidi. “Wakatulia hata zaidi” huwasilisha kwa kawaida ongezeko la utulivu wa umati.
- source_word: καὶ φησίν
  choice: 'Kisha akasema:'
  rationale: Wakati wa sasa wa kihistoria umetafsiriwa kwa wakati uliopita unaofaa simulizi la Kiswahili; “kisha” linaunganisha kwa kawaida utulivu wa umati na mwanzo wa hotuba.
theological_decisions:
- issue: Lugha inayorejelewa na “τῇ Ἑβραΐδι διαλέκτῳ”
  choice: Kuhifadhi “Kiebrania” katika maandishi makuu
  alternative: Kuitafsiri moja kwa moja kuwa “Kiaramu”
  rationale: 'Kigiriki kinataja Kiebrania, lakini katika muktadha huu usemi huo huenda ukarejelea lugha ya Kisemiti iliyotumiwa Yudea, yaani Kiaramu. Tafsiri haifuti utata huo: inahifadhi neno la chanzo na kueleza uwezekano mwingine katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Wakatulia” ni ya asili zaidi kuliko tafsiri ya neno kwa neno kama “wakatoa ukimya zaidi.”
