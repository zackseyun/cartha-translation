lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Ikawa kwamba
  rationale: Kauli hii inadumisha mpito wa kisimulizi na wazo la jambo lililompata Paulo bila kutumia mtindo wa kizamani.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: baada ya kurudi Yerusalemu
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha kwamba kurudi kulitangulia tukio kuu.
- source_word: καὶ προσευχομένου μου
  choice: nilipokuwa nikisali
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati tukio kuu lilipotokea.
- source_word: ἐν τῷ ἱερῷ
  choice: katika eneo la hekalu
  rationale: ἱερόν hapa ni eneo au jengo zima la hekalu, si patakatifu pa ndani pekee; tafsiri hii inaweka tofauti hiyo wazi kwa Kiswahili cha kawaida.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: nikaingia katika hali ya njozi
  rationale: Muundo huu unaonyesha kuingia katika hali isiyo ya kawaida ya kupokea maono, bila kufafanua zaidi chanzo au namna ya tukio kuliko maandishi yenyewe.
theological_decisions:
- issue: Asili ya hali ya Paulo iliyoelezwa kwa ἐκστάσει
  choice: hali ya njozi
  alternative: hali ya maono; kuzimia
  rationale: “Hali ya njozi” inaeleza hali ya kuona maono bila kudai kwamba Paulo alipoteza fahamu wala kufafanua utaratibu wa tukio hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Koma ya mwisho imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
