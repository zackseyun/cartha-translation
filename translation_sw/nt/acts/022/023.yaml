    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: walipokuwa wakipiga kelele
  rationale: Kirai hiki kinaonyesha kitendo cha kupaza sauti kilichokuwa kikiendelea sambamba na vitendo vingine; “kupiga kelele” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: τε
  choice: Nao
  rationale: Kiunganishi hiki kinaunganisha kupiga kelele na vitendo vinavyofuata; “Nao” pia huendeleza masimulizi kwa ufasaha.
- source_word: αὐτῶν
  choice: wao (imeonyeshwa katika kiambishi wa-)
  rationale: Kiswahili huonyesha mtenda katika kiambishi cha kitenzi, kwa hiyo kiwakilishi tofauti si lazima.
- source_word: ῥιπτούντων
  choice: wakitupa
  rationale: Kitenzi cha Kigiriki kina maana ya kutupa au kurusha. “Wakitupa” huhifadhi maana ya msingi bila kuamua kimya kimya kama walivua mavazi au kuyatupa huku na huku.
- source_word: τὰ ἱμάτια
  choice: mavazi yao
  rationale: Neno hili linaweza kumaanisha mavazi kwa jumla au mavazi ya nje. “Mavazi yao” ni la asili na huhifadhi upana wa maana wa Kigiriki.
- source_word: κονιορτόν
  choice: mavumbi
  rationale: “Mavumbi” ni neno la kawaida la Kiswahili kwa chembechembe za udongo zinazoweza kurushwa hewani.
- source_word: βαλλόντων
  choice: kurusha
  rationale: “Kurusha” huonyesha kitendo cha kutupa mavumbi kwa nguvu na pia huepuka kurudia kitenzi “kutupa” mara moja.
- source_word: εἰς τὸν ἀέρα
  choice: hewani
  rationale: “Hewani” ni tafsiri fupi, ya kawaida, na sahihi ya kirai hiki.
