id: ACT.22.9
reference: Acts 22:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: sw
  text: Wale waliokuwa pamoja nami waliiona ile nuru, lakini hawakuisikia sauti ya yule aliyekuwa akisema nami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuielewa sauti.” Linganisha Matendo 9:7, ambapo wale waliokuwa pamoja na Paulo wanasemekana kuisikia sauti; huenda tofauti ni kati ya kuisikia sauti na kumwelewa msemaji.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Wale waliokuwa pamoja nami
  rationale: Muundo huu unatafsiri kishazi cha Kigiriki kwa Kiswahili cha kawaida bila kuongeza ‘wanaume,’ jambo ambalo halijasemwa wazi katika mstari huu.
- source_word: τὸ μὲν φῶς
  choice: ile nuru
  rationale: φῶς humaanisha ‘nuru’; ‘ile’ inarejelea nuru iliyotajwa katika simulizi, huku ulinganifu wa μέν...δέ ukionyeshwa na ‘lakini.’ Hakuna haja ya kuongeza ‘angavu’ katika mstari huu.
- source_word: ἐθεάσαντο
  choice: waliiona
  rationale: θεάομαι hapa ni kuona au kutazama; ‘waliiona’ ni ya asili na haiongezi wazo la kutazama kwa makusudi.
- source_word: τὴν δὲ φωνὴν
  choice: sauti
  rationale: φωνή inaweza kuwa ‘sauti’ au ‘sauti ya mtu.’ Kwa kuwa kishazi kinamtaja anayesema, ‘sauti’ hapa inaeleweka kuwa ya msemaji bila kuongeza ufafanuzi usio wa lazima.
- source_word: οὐκ ἤκουσαν
  choice: hawakuisikia
  rationale: ἀκούω kimsingi ni ‘kusikia.’ Tafsiri kuu inadumisha maana hiyo ya moja kwa moja, huku uwezekano wa ‘kuelewa’ ukielezwa katika tanbihi kwa sababu ya Matendo 9:7.
- source_word: τοῦ λαλοῦντός μοι
  choice: ya yule aliyekuwa akisema nami
  rationale: Muundo huu unadumisha tendo linaloendelea la kishiriki cha wakati uliopo λαλοῦντος na uhusiano wake na ‘sauti.’ ‘Kusema nami’ ni Kiswahili cha asili kwa mtu anayezungumza moja kwa moja na Paulo.
theological_decisions:
- issue: Mvutano unaoonekana na Matendo 9:7 kuhusu kama waandamani wa Paulo waliisikia sauti
  choice: hawakuisikia sauti ya yule aliyekuwa akisema nami
  alternative: hawakuielewa sauti ya yule aliyekuwa akisema nami
  rationale: Kigiriki cha mstari huu kwa kawaida husema kwamba hawakuisikia sauti. Hata hivyo, ἀκούω inaweza katika mazingira fulani kuhusisha kuelewa, na Matendo 9:7 husema waliisikia sauti. Kwa hiyo tafsiri kuu inadumisha wording ya wazi ya mstari huu, na tanbihi inahifadhi uwezekano kwamba waliisikia sauti fulani bila kumwelewa msemaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Tofauti ya ‘waliiona ... lakini hawakuisikia’ inadumisha muundo wa μέν...δέ. Kiashirio cha tanbihi [a] kimewekwa baada ya sentensi inayohitaji ufafanuzi.
