base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: sw
  text: Afisa wa askari mia aliposikia hayo, alimwendea mkuu wa jeshi na kumjulisha, akisema, “Unakaribia kufanya nini?”[a] Kwa maana mtu huyu ni raia wa Roma.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unakusudia kufanya nini?” Usemi wa Kigiriki unaweza kumaanisha kitendo kilicho karibu kufanyika au kitendo kinachokusudiwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mtu huyu ni Mroma.” Katika muktadha huu, maana yake ni kwamba ana uraia wa Roma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia hayo
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha jambo lililotangulia kitendo kikuu; muundo huu ni wa kawaida katika Kiswahili na unahifadhi uhusiano wa wakati.
- source_word: ἑκατοντάρχης
  choice: ofisa wa askari mia
  rationale: Hueleza kwa uwazi cheo cha kijeshi cha Kirumi bila kutumia istilahi ya kale isiyoeleweka kwa urahisi.
- source_word: προσελθὼν
  choice: alimwendea
  rationale: Inaonyesha kwamba ofisa huyo alisogea kwenda kwa mkuu wake; tafsiri hii ni fupi na ya kawaida katika masimulizi ya Kiswahili.
- source_word: χιλιάρχῳ
  choice: mkuu wa jeshi
  rationale: Neno hilo linamtaja kamanda wa ngazi ya juu wa Kirumi; uchaguzi huu unaeleweka kwa msomaji wa kawaida kuliko unukuzi wa cheo cha Kigiriki.
- source_word: ἀπήγγειλεν
  choice: kumjulisha
  rationale: Kitenzi kina maana ya kupeleka taarifa; ‘kumjulisha’ kinafaa katika muktadha huu wa kijeshi na kisheria.
- source_word: λέγων
  choice: akisema
  rationale: Kinahifadhi uhusiano wa kisarufi kati ya kutoa taarifa na maneno yanayofuata kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Τί μέλλεις ποιεῖν;
  choice: Unakaribia kufanya nini?
  rationale: μέλλω pamoja na kitenzi-jina inaweza kueleza kitendo kilicho karibu kufanyika au kusudi; tafsiri kuu inaonyesha hali ya kitendo kuwa karibu, huku maana ya kusudi ikihifadhiwa katika tanbihi.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Kwa maana mtu huyu
  rationale: Inahifadhi kiunganishi cha sababu γάρ na rejeo la moja kwa moja kwa mwanamume anayezungumziwa.
- source_word: Ῥωμαῖός ἐστιν
  choice: ni raia wa Roma
  rationale: Katika muktadha huu, kuwa ‘Mroma’ kunamaanisha kuwa na uraia wa Roma, si tu asili ya kikabila au mahali pa kuishi.
