  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: sw
  text: Ikawa, nilipokuwa nikisafiri na kukaribia Damasko, karibu adhuhuri, ghafula nuru kali kutoka mbinguni ilinimulika pande zote,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Ikawa
  rationale: Muundo wa kawaida wa masimulizi unaotambulisha tukio na kubeba kiunganishi hafifu cha δέ; nafsi ya kwanza inaonekana wazi katika vitenzi vinavyofuata.
- source_word: πορευομένῳ
  choice: nilipokuwa nikisafiri
  rationale: Unaonyesha tendo la kusafiri lililokuwa likiendelea wakati tukio lilipotokea.
- source_word: καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: na kukaribia Damasko
  rationale: Unahifadhi mfuatano wa vitendo na maana ya kuwa karibu kufika mahali palipokusudiwa.
- source_word: περὶ μεσημβρίαν
  choice: karibu adhuhuri
  rationale: Unawasilisha wakati wa takriban katikati ya mchana kwa Kiswahili sanifu na cha kawaida.
- source_word: ἐξαίφνης
  choice: ghafula
  rationale: Unaonyesha kutokea kwa tukio bila kutazamiwa na kwa haraka.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Unahifadhi maana ya chanzo cha juu au cha kimungu ambayo muktadha wa simulizi unaidokeza, badala ya maana ya anga ya hali ya hewa pekee.
- source_word: περιαστράψαι
  choice: ikanizunguka kwa kumulika
  rationale: Kitenzi ambatani kinaonyesha nuru iliyomulika pande zote za msemaji; usemi huu ni wa kawaida kuliko tafsiri ya neno kwa neno.
- source_word: φῶς ἱκανὸν
  choice: nuru kali
  rationale: ἱκανός hapa huonyesha kiwango kikubwa au nguvu ya nuru; 'kali' huwasilisha mwangaza wenye nguvu kwa lugha ya kawaida.
- source_word: περὶ ἐμέ
  choice: ikanizunguka
  rationale: Kiambishi cha nafsi katika kitenzi kinawasilisha kwa ufupi maana ya nuru kuwa pande zote kumzunguka msemaji.
theological_decisions:
- issue: Maana ya οὐρανός katika ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  alternative: kutoka angani
  rationale: Katika muktadha wa ufunuo wa Paulo, 'mbinguni' huhifadhi uwezekano wa chanzo cha kimungu au kinachopita ulimwengu wa kawaida bila kuongeza dai jingine la kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ikawa' kinafaa kwa ushuhuda wa kisimulizi; 'ghafula' na 'adhuhuri' vinaeleweka kwa wasomaji wa kawaida. Hakuna tanbihi iliyoongezwa kwa sababu 'nuru kali' inabeba kwa asili wigo wa ukubwa au nguvu wa φῶς ἱκανόν; alama ya tanbihi katika English POB inaonekana kuwekwa baada ya 'Damascus' kimakosa, ilhali maelezo yake yanahusu 'bright/great light'.
