source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: sw
  text: Mkuu wa jeshi akaamuru Paulo aingizwe ndani ya kambi ya askari[a]. Akaagiza ahojiwe kwa kupigwa mijeledi[b], ili apate kujua ni kwa sababu gani watu walikuwa wakimpigia kelele namna hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ngome.” Hapa neno hilo linamaanisha makao ya jeshi la Roma huko Yerusalemu.
    reason: cultural_note
  - marker: b
    text: Au, “ahojiwe kwa kuchapwa viboko.” Kigiriki kinaunganisha kuhojiwa na njia iliyotumiwa, yaani kupigwa mijeledi.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: mkuu wa jeshi
  rationale: Cheo hiki ni cha afisa mkuu wa jeshi la Roma. “Mkuu wa jeshi” kinaeleweka kwa urahisi katika Kiswahili cha sasa bila kumwekea cheo kisichoeleweka msomaji wa kawaida.
- source_word: παρεμβολή
  choice: kambi ya askari
  rationale: Katika mazingira haya neno linamaanisha eneo la makao ya jeshi la Roma huko Yerusalemu; “kambi ya askari” linaonyesha kazi ya mahali hapo, huku tanbihi ikihifadhi uwezekano wa “ngome.”
- source_word: εἰσάγεσθαι
  choice: aingizwe ndani
  rationale: Kauli tendwa inaonyesha kwamba Paulo angepelekwa ndani na wengine; tafsiri hii inadumisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: εἴπας
  choice: akaagiza
  rationale: Ingawa kimsingi ni “akisema,” katika muktadha huu kishiriki hicho kinaanzisha agizo la mkuu wa jeshi. “Akaagiza” huwasilisha kazi yake katika sentensi kwa uwazi.
- source_word: μάστιξιν
  choice: kwa kupigwa mijeledi
  rationale: Hali ya kutumia mijeledi ndiyo njia ya kumhoji. Usemi huu unaonyesha wazi ukali wa tendo na nguvu ya kisarufi ya njia iliyotumiwa.
- source_word: ἀνετάζεσθαι
  choice: ahojiwe
  rationale: Kitenzi kinamaanisha kuchunguzwa au kuhojiwa; muktadha unaeleza kwamba mahojiano hayo yangefanywa kwa kumpiga mijeledi.
- source_word: ἐπιγνῷ
  choice: apate kujua
  rationale: Kishazi cha kusudi kinaonyesha nia ya mkuu wa jeshi ya kugundua sababu ya makelele ya watu.
- source_word: δι’ ἣν αἰτίαν
  choice: ni kwa sababu gani
  rationale: Tafsiri hii inadumisha wazo la sababu bila kuingiza dhana mahsusi ya shtaka la kisheria ambayo haijasemwa wazi.
- source_word: οὕτως
  choice: namna hiyo
  rationale: Usemi huu unahifadhi nguvu ya kielezi kinachoonyesha namna ambavyo umati ulikuwa ukipiga kelele.
- source_word: ἐπεφώνουν αὐτῷ
  choice: walikuwa wakimpigia kelele
  rationale: Wakati usiotimilifu unaonyesha makelele yaliyokuwa yakiendelea. Muktadha unaweka wazi uhasama wao dhidi ya Paulo.
