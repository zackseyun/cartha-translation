  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: sw
  text: Naye akasema, “Mungu wa baba zetu amekuteua[a] ujue mapenzi yake, umwone yule Mwenye Haki[b], na usikie sauti kutoka kinywani mwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amekuchagua.” Kitenzi cha Kigiriki kinaweza kumaanisha kumchagua au kumteua mtu kwa kazi fulani.
    reason: lexical_alternative
  - marker: b
    text: “Mwenye Haki” ni jina la cheo linalomhusu Yesu; au, “yule Mwenye Adili.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: amekuteua
  rationale: ‘Kuteua’ huwasilisha kuchaguliwa na kuwekwa kwa kusudi fulani, bila kulazimisha maana ya kwamba uteuzi huo ulifanyika zamani kabla ya wakati huu.
- source_word: γνῶναι
  choice: ili uyajue
  rationale: Muundo huu wa kusudi ni wa kawaida katika Kiswahili na unaonyesha kwamba kumjua mapenzi ya Mungu ni sehemu ya kusudi la uteuzi.
- source_word: θέλημα
  choice: mapenzi
  rationale: ‘Mapenzi’ ni tafsiri ya kawaida ya kibiblia inayohifadhi upana wa maana ya θέλημα kuliko ‘kusudi’ pekee.
- source_word: ἰδεῖν
  choice: umwone
  rationale: ‘Kumwona’ ni tafsiri ya moja kwa moja na ya kawaida, isiyoongeza wazo la kutazama kwa namna maalumu.
- source_word: τὸν δίκαιον
  choice: Yule Mwenye Haki
  rationale: Kauli hii inafanya kazi kama jina la cheo linalomhusu Yesu; ‘Mwenye Haki’ ni ya asili katika Kiswahili na inahifadhi maana ya δίκαιος.
- source_word: ἀκοῦσαι φωνὴν
  choice: kusikia sauti
  rationale: Nomino φωνή haina kibainishi, hivyo ‘sauti’ haitambulishwi kupita kiasi kama ‘ile sauti’; muktadha wa kinywa unaonyesha usemi unaosikika.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: kutoka kinywani mwake
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kigiriki na kusisitiza usemi wa moja kwa moja.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Mungu wa baba zetu
  rationale: Huhifadhi usemi wa kiagano unaowaunganisha wasemaji na urithi wa Israeli, pamoja na nomino ya kiume iliyo katika chanzo.
theological_decisions:
- issue: Ikiwa τὸν δίκαιον itafsiriwe kama jina la cheo la Kikristo au kama kivumishi cha maelezo tu
  choice: Yule Mwenye Haki, kama jina la cheo linalomhusu Yesu
  alternative: yule mwenye haki; Yule Mwenye Adili
  rationale: Katika Matendo usemi huu unatumiwa kwa namna inayotambulika kama jina la cheo la Yesu (linganisha Matendo 3:14; 7:52). Herufi kubwa zinaashiria matumizi hayo bila kuongeza maudhui mapya.
- issue: Ikiwa ‘baba zetu’ ibadilishwe kuwa usemi usioonyesha jinsia
  choice: baba zetu
  alternative: mababu zetu
  rationale: πατέρων ni ya kiume kwa uwazi, na ‘Mungu wa baba zetu’ huhifadhi kwa karibu usemi wa kiagano wa chanzo. ‘Mababu zetu’ ni ya asili pia lakini inaelekea kuufanya usemi kuwa wa jumla zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa ‘ili’ unaweka wazi uhusiano wa kusudi wa vitenzi vitatu, huku ‘kutoka kinywani mwake’ ikihifadhi taswira ya chanzo.
