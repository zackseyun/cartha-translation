  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: sw
  text: Nami nikasema, “Bwana, wao wenyewe wanajua kwamba katika kila sinagogi nilikuwa nikiwafunga gerezani na kuwapiga wale wanaokuamini.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaokutumaini” au “wale wanaoweka imani yao kwako.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: Nami nikasema
  rationale: Muunganiko καὶ ἐγώ pamoja na εἶπον umetafsiriwa kwa Kiswahili cha asili na chenye mwendelezo wa simulizi; “nami” huhifadhi kiasi cha mkazo wa ἐγώ.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni umbo la kumwita κύριος moja kwa moja. “Bwana” huhifadhi heshima na uzito wa kumwelekea Yesu bila kuongeza ufafanuzi usio katika matini.
- source_word: αὐτοὶ ἐπίστανται
  choice: wao wenyewe wanajua
  rationale: “Wao wenyewe” huhifadhi mkazo wa αὐτοὶ kwamba watu hao wana ufahamu wa moja kwa moja kuhusu mwenendo wa zamani wa Paulo.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: nilikuwa nikiwafunga gerezani na kuwapiga
  rationale: Muundo wa wakati uliopita unaoendelea pamoja na vivumishi-tendo huonyesha kitendo kilichokuwa cha kurudiwa au cha kawaida; “nilikuwa niki-” huhifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: κατὰ τὰς συναγωγάς
  choice: katika kila sinagogi
  rationale: κατά pamoja na wingi hapa ina maana ya mgawanyo, yaani tendo lilirudiwa katika masinagogi mbalimbali. “Katika kila sinagogi” ni wazi na ya asili.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: wale wanaokuamini
  rationale: πιστεύω ἐπί hueleza imani au utegemezi unaoelekezwa kwa Yesu. “Wanaokuamini” ni ya asili na huhifadhi uwezekano wa maana ya kuamini au kumtumaini.
theological_decisions:
- issue: Tafsiri ya κύριος anapoelezewa Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ndiyo tafsiri ya kawaida ya κύριος katika mwito huu na huhifadhi uzito wa kikristolojia wa simulizi bila kuingiza dai zaidi ya matini.
- issue: Maana ya πιστεύοντας ἐπὶ σέ
  choice: wanaokuamini
  alternative: wanaokutumaini
  rationale: “Wanaokuamini” ni pana na ya kawaida, huku tanbihi ikihifadhi maana halisi inayowezekana ya kuweka tumaini kwa Yesu.
- issue: Hali ya mateso ya zamani ya Paulo
  choice: nilikuwa nikiwafunga gerezani na kuwapiga
  alternative: nilikuwa na desturi ya kuwafunga gerezani na kuwapiga
  rationale: Muundo uliochaguliwa huhifadhi hali endelevu na ya kurudiwa ya Kigiriki bila kufanya udesturi kuwa wazi zaidi kuliko matini yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “katika kila sinagogi” unaonyesha usambazaji wa tendo katika masinagogi mengi. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika; hakuna tanbihi iliyowekwa kwa “nikasema” au “Bwana,” kwa kuwa maelezo yaliyotolewa chini ya alama hizo katika safu ya Kiingereza hayalingani na maneno hayo.
