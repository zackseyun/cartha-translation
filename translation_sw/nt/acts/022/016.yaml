- from: Na sasa, kwa nini unakawia? Simama[a], ubatizwe, ukaoshe dhambi zako[b], huku ukiliitia jina lake.
  to: Na sasa, kwa nini unakawia? Inuka[a], ubatizwe, ukaoshe dhambi zako[b], ukiliitia jina lake.
  rationale: “Inuka” is adopted as the closer idiomatic equivalent of ἀναστάς. Removing “huku” avoids making the participle explicitly temporal, while “ukiliitia jina lake” retains the Greek’s unresolved relation to the preceding commands. The footnote continues to signal the possible more explicit instrumental rendering without choosing it in the main text.
