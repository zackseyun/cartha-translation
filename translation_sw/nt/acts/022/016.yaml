  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: sw
  text: Na sasa, kwa nini unakawia? Inuka[a], ubatizwe, ukaoshe dhambi zako[b], ukiliitia jina lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Simama.”
    reason: lexical_alternative
  - marker: b
    text: Kishirikishi cha Kigiriki kinaweza pia kutafsiriwa kwa uwazi zaidi kuwa “ukiliitia jina lake” au “kwa kuliitia jina lake”; tafsiri inadumisha uwezekano huo wa maana.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: kwa nini unakawia?
  rationale: Katika muktadha huu usemi huu ni himizo la kuacha kuchelewa, si swali kuhusu jambo analokusudia kufanya. “Kwa nini unakawia?” ni Kiswahili cha kawaida chenye uzito wa haraka.
- source_word: ἀναστὰς
  choice: Simama
  rationale: Kishirikishi cha aoristi kinaambatana na amri zinazofuata; kukitafsiri kama amri fupi kunahifadhi msukumo wa sentensi.
- source_word: βάπτισαι
  choice: ubatizwe
  rationale: Umbo la kati la amri linaelezwa kwa kawaida na kwa ufasaha katika Kiswahili kwa kauli ya kutendwa.
- source_word: ἀπόλουσαι
  choice: ukaoshe
  rationale: Kitenzi kina maana ya kuosha au kuondoa kwa kuosha. “Ukaoshe dhambi zako” huhifadhi taswira halisi na uhusiano wake na yambwa.
- source_word: τὰς ἁμαρτίας σου
  choice: dhambi zako
  rationale: Tafsiri ya moja kwa moja inahifadhi maana ya kawaida ya ἁμαρτία bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἐπικαλεσάμενος
  choice: huku ukiliitia
  rationale: “Huku ukiliitia” hudumisha uhusiano wa karibu wa kishirikishi na amri bila kuamua kama hasa kinaonyesha wakati, hali inayoambatana, au njia.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: jina lake
  rationale: Maandishi ya Kigiriki yana kiwakilishi αὐτοῦ, kwa hiyo “jina lake” ni tafsiri ya moja kwa moja; hayabadilishwi kuwa “jina la Bwana” ingawa rejeleo linaeleweka kutokana na muktadha.
theological_decisions:
- issue: Uhusiano kati ya ubatizo, kuoshwa kwa dhambi, na kuliitia jina lake
  choice: Mpangilio wa amri na kishirikishi umehifadhiwa bila kueleza kwa ziada uhusiano wake wa kiteolojia.
  alternative: Inaweza kueleweka kwamba ubatizo ndio njia ya kuoshwa dhambi, kwamba kuliitia jina lake ndiko kunakoeleza njia hiyo huku ubatizo ukiambatana nako, au kwamba vipengele vyote vinaunda tukio moja la kuingia katika imani.
  rationale: Kigiriki kina amri zilizoratibiwa pamoja na kishirikishi, lakini hakilazimishi mtafsiri kuamua mabishano ya kisakramenti. Tafsiri inapaswa kuhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sauti ya himizo la haraka na haiongezi jina “Yesu” au cheo “Bwana” mahali ambapo Kigiriki kimetumia kiwakilishi.
