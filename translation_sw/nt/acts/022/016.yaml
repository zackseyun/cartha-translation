review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rebuke against delay, the baptismal command, the command to wash away sins, and the pronoun in “jina lake.” However, “huku” explicitly frames the final participle as concurrent action (“while”), whereas ἐπικαλεσάμενος can indicate attendant action or means. Omitting “huku” better preserves the source ambiguity. “Inuka” is also a more direct rendering of ἀναστάς in this urgent context than “Simama.”
  naturalness: The revised wording is fluent, idiomatic Standard East African Swahili. “Ukiliitia jina lake” is an established and natural way to express calling on/invoking someone’s name; without “huku,” it remains concise and syntactically close to the Greek.
  terminology: “Ubatizwe,” “ukaoshe dhambi zako,” and “jina lake” are appropriate, clear, and theologically noncommittal. The revision does not supply “Yesu” or “Bwana,” since the Greek has only αὐτοῦ (“his”).
  issues:
  - severity: low
    issue: “Huku ukiliitia jina lake” over-specifies the participle as temporal/concurrent.
    rationale: The Greek participle ἐπικαλεσάμενος may be read as attendant circumstance or as expressing means. “Huku” chiefly signals simultaneous action in Swahili and thus narrows the ambiguity that the translation seeks to retain.
  - severity: low
    issue: “Simama” is somewhat less precise than “Inuka” for ἀναστάς.
    rationale: Both can be acceptable, but “Inuka” more naturally represents the sense “get up/rise” conveyed by the aorist participle in this exhortation.
  revised_text: Na sasa, kwa nini unakawia? Inuka[a], ubatizwe, ukaoshe dhambi zako[b], ukiliitia jina lake.
