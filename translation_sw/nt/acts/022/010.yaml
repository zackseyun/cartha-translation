  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: sw
  text: Ndipo nikasema, “Nifanye nini, Bwana?” Bwana akaniambia, “Inuka, uende Damasko, na huko utaambiwa mambo yote uliyopangiwa kufanya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo yote yaliyowekwa ili uyafanye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: Nifanye nini
  rationale: Hili ni swali la kuomba mwongozo kuhusu hatua inayofuata; muundo huu ni wa kawaida katika Kiswahili na unadumisha maana ya wajibu au maelekezo.
- source_word: κύριε / ὁ ... κύριος
  choice: Bwana / Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος na inafaa katika simulizi hili, ambamo Paulo anamwita na kumtambua Yesu kwa cheo hicho.
- source_word: Ἀναστὰς πορεύου
  choice: Inuka, uende
  rationale: Muundo huu unaonyesha mfuatano wa amri mbili—kuinuka na kisha kwenda—kwa Kiswahili cha kawaida.
- source_word: εἰς Δαμασκόν
  choice: Damasko
  rationale: Baada ya kitenzi “uende,” Kiswahili hakihitaji kihusishi; tafsiri hii inaonyesha wazi mwendo kuelekea mjini bila kulazimisha usemi usio wa kawaida wa “ndani ya Damasko.”
- source_word: κἀκεῖ
  choice: na huko
  rationale: Hii inadumisha kiunganishi na rejeo la mahali katika καὶ ἐκεῖ.
- source_word: λαληθήσεται
  choice: utaambiwa
  rationale: Kauli tendwa ya wakati ujao inaelezwa kwa kawaida na kwa usahihi kwa “utaambiwa.”
- source_word: περὶ πάντων
  choice: mambo yote
  rationale: Katika muktadha huu, usemi unahusu maudhui yote yatakayoelezwa; “mambo yote” ni wazi na wa kawaida.
- source_word: τέτακταί σοι ποιῆσαι
  choice: uliyopangiwa kufanya
  rationale: Tafsiri hii inadumisha wazo la mambo yaliyokwisha kuwekwa au kupangwa kwa ajili ya Paulo ayafanye, bila kubainisha zaidi ni nani aliyeyapanga au kuingiza mfumo maalumu wa kiteolojia.
theological_decisions:
- issue: Nguvu ya τέτακταί kuhusu mwongozo wa Mungu na wito wa Paulo
  choice: uliyopangiwa kufanya
  alternative: yaliyowekwa ili uyafanye
  rationale: “Uliyopangiwa kufanya” inaonyesha kwamba kazi za Paulo zilikuwa zimewekwa tayari, lakini haiongezi madai ya kiteolojia yaliyo makali kuliko maandishi yenyewe. Tanbihi inadumisha uwezekano wa kuelewa muundo huo kwa namna isiyomfanya Paulo moja kwa moja kuwa kiima cha kupangiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ndipo” inadumisha mfuatano wa simulizi; “Inuka, uende” ni ya kawaida bila kupoteza nguvu ya amri. Jina la mahali limetolewa kama “Damasko,” na sentensi imebaki wazi kwa wasomaji wa kawaida.
