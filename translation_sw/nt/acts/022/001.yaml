translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya hotuba ya hadharani lakini kinachoeleweka kwa msomaji wa kawaida. Mwito “Enyi wanaume, ndugu na baba” umehifadhi makundi ya kijinsia na ya heshima ya Kigiriki.
