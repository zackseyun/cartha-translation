  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: sw
  text: “Enyi wanaume, ndugu na baba, sikilizeni sasa utetezi wangu kwenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: Enyi wanaume
  rationale: Ni mwito wa moja kwa moja kwa wasikilizaji wa kiume; “enyi” huonyesha hali ya mwito kwa Kiswahili cha hadhara.
- source_word: ἀδελφοὶ
  choice: ndugu
  rationale: Katika mfululizo huu wa mwito, neno hilo linawahusu wanaume wenzake; “ndugu” ni la kawaida na lenye heshima bila kuongeza utambulisho usiotajwa wazi.
- source_word: πατέρες
  choice: baba
  rationale: Hudumisha taswira ya πατέρες na heshima kwa wanaume wakubwa au wenye hadhi, bila kuifasiri kuwa cheo rasmi cha wazee.
- source_word: ἀκούσατέ
  choice: sikilizeni
  rationale: Amri ya wingi inayoomba wasikilizaji watoe usikivu; kwa Kiswahili “sikilizeni” ni ya asili zaidi hapa kuliko “sikieni.”
- source_word: μου
  choice: wangu
  rationale: Genitivi inaonyesha kuwa ni utetezi wa msemaji.
- source_word: τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας
  choice: sasa utetezi wangu ninaoutoa mbele yenu
  rationale: “Utetezi” hutoa maana ya jibu rasmi, si kuomba msamaha. Muundo wa kishazi hufanya uhusiano wa πρὸς ὑμᾶς uwe wa asili kwa Kiswahili huku “sasa” ikihifadhi msisitizo wa νυνί.
