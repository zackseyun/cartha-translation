  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa swali la kisheria na hali ya Paulo kutokuwa amehukumiwa vimehifadhiwa bila kuongezwa ufafanuzi wa kimadhehebu.
