  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: sw
  text: Lakini walipomnyosha kwa kamba za ngozi, Paulo akamwambia akida aliyekuwa amesimama karibu, “Je, ni halali kwenu kumpiga mijeledi mtu aliye Mrumi[a] ambaye hajahukumiwa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha huu wa kisheria, “Mrumi” humaanisha raia wa Roma, mwenye ulinzi wa kisheria unaoambatana na uraia huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: walipomnyosha kwa mikanda
  rationale: Kitenzi προτείνω katika muktadha huu kinaonyesha Paulo akinyoshwa ili aandaliwe kupigwa, na ἱμᾶσιν ni mikanda au kamba za ngozi. Tafsiri hii inaonyesha tendo hilo bila kuongeza maelezo yasiyosemwa wazi.
- source_word: ἑστῶτα
  choice: aliyekuwa amesimama pale
  rationale: Kirai hiki kinaonyesha kwamba mkuu huyo alikuwa amesimama karibu na mahali tukio lilipokuwa likifanyika.
- source_word: ἑκατόνταρχον
  choice: mkuu wa askari mia
  rationale: Hili ni jina linaloeleweka la cheo cha kijeshi cha Kirumi kinachotajwa na neno ἑκατόνταρχος.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: mtu aliye Mrumi
  rationale: Uamuzi huu unahifadhi kutajwa wazi kwa ‘mtu’ na ‘Mrumi’ katika Kigiriki, huku tanbihi ikifafanua maana ya hadhi ya uraia katika muktadha wa kisheria.
- source_word: ἀκατάκριτον
  choice: ambaye hajahukumiwa
  rationale: Neno hili linamaanisha mtu ambaye bado hajatiwa hatiani kwa hukumu ya mahakama; Kiswahili hiki ni cha kawaida na kina uzito wa kisheria.
- source_word: ἔξεστιν
  choice: Je, ni halali kwenu
  rationale: ἔξεστιν hapa linauliza kama tendo hilo linaruhusiwa kisheria, si kama linawezekana tu.
- source_word: μαστίζειν
  choice: kumpiga mijeledi
  rationale: Kitenzi hiki kinamaanisha kupiga kwa mijeledi kwa ukali; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
