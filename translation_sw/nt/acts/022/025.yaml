  to: Lakini walipomnyosha kwa kamba za ngozi, Paulo akamwambia akida aliyekuwa amesimama karibu, “Je, ni halali kwenu kumpiga mijeledi mtu aliye Mrumi[a] ambaye hajahukumiwa?”
