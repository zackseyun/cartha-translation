  language: sw
  text: Naye akaniambia, “Nenda, kwa sababu mimi nitakutuma mbali kwa watu wa Mataifa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mataifa.” Neno la Kigiriki ἔθνη linaweza kutafsiriwa “mataifa,” ingawa katika muktadha huu linarejelea hasa watu wasio Wayahudi.
    reason: Mbadala wa kileksia
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: akaniambia
  rationale: Muundo λέγω pamoja na πρός na yambwa huanzisha maneno yanayoelekezwa kwa mtu. “Akaniambia” ni Kiswahili cha kawaida na cha asili katika simulizi.
- source_word: Πορεύου
  choice: Nenda
  rationale: Amri hii ya πορεύομαι ina maana ya kwenda au kuondoka. “Nenda” ni ya moja kwa moja na inafaa katika Kiswahili cha sasa.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Hapa ὅτι inaeleza sababu ya amri: aende kwa sababu atatumwa mbali.'
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kimetajwa wazi katika Kigiriki ili kutia mkazo. “Mimi” kinahifadhi mkazo huo kwa njia ya asili katika Kiswahili.
- source_word: εἰς ἔθνη
  choice: kwa watu wa mataifa mengine
  rationale: Katika muktadha wa utume wa Paulo, ἔθνη inaelekea kumaanisha watu wasio Wayahudi. Usemi huu unaeleweka kwa urahisi na bado unadumisha uhusiano wa neno hilo na “mataifa.”
- source_word: μακρὰν
  choice: mbali
  rationale: Neno hili linaonyesha umbali wa mahali ambako Paulo anatumwa; “mbali” ni tafsiri fupi na ya kawaida.
- source_word: ἐξαποστελῶ
  choice: nitakutuma
  rationale: Kitenzi cha wakati ujao kinamaanisha kutuma au kutuma kwenda nje. “Nitakutuma” kinawasilisha maana kuu bila kuongeza maelezo yasiyotajwa wazi.
- source_word: σε
  choice: -ku-
  rationale: Kiambishi yambwa cha nafsi ya pili umoja katika “nitakutuma” kinatafsiri σε kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya ἔθνη katika muktadha wa utume wa kitume
  choice: watu wa mataifa mengine
  alternative: mataifa
  rationale: Muktadha wa Matendo unaonyesha utume kwa watu wasio Wayahudi. Tafsiri kuu inaweka wazi maana hiyo ya kihistoria bila kutumia istilahi nzito, huku tafsiri halisi zaidi “mataifa” ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wenye heshima na unaoeleweka kwa wasomaji wa sasa. Mkazo wa kiwakilishi ἐγώ umehifadhiwa kwa “mimi.”
