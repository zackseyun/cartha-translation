  text: Mtu mmoja, Anania, mcha Mungu kwa mujibu wa Sheria, aliyekuwa na sifa njema mbele ya Wayahudi wote wanaoishi huko,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁνανίας
  choice: Anania
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: δέ
  choice: halijatafsiriwa kwa neno maalumu
  rationale: Ni kiunganishi chepesi cha simulizi; mtiririko wa Kiswahili hapa hauhitaji neno kama “basi” au “sasa,” ambalo lingeweza kuongeza uzito au maana ya wakati isiyokusudiwa.
- source_word: τις ἀνὴρ
  choice: mtu mmoja
  rationale: Huhifadhi utambulisho wa mtu fulani ambaye hakuwa ametajwa awali, kwa Kiswahili cha kawaida na cha asili.
- source_word: εὐλαβὴς κατὰ τὸν νόμον
  choice: mwenye kumcha Mungu kwa kuifuata Sheria
  rationale: “Mwenye kumcha Mungu” huwasilisha uchaji wa kidini, na “kwa kuifuata Sheria” huonyesha wazi kuwa uchaji huo ulidhihirika kwa uaminifu kwa Sheria ya Musa.
- source_word: μαρτυρούμενος
  choice: aliyesifiwa
  rationale: Huwasilisha ushuhuda mwema wa hadharani kuhusu Anania kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων
  choice: na Wayahudi wote walioishi huko
  rationale: Huhifadhi nguvu ya “wote” na makazi yao mahali panapotajwa katika muktadha, yaani Damasko.
theological_decisions:
- issue: Maana ya Ἰουδαίων
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: Muktadha unazungumzia jumuiya ya Kiyahudi iliyokuwa ikiishi Damasko, si hasa watu wenye asili ya kijiografia kutoka Yudea.
- issue: Uhusiano wa εὐλαβής na κατὰ τὸν νόμον
  choice: mwenye kumcha Mungu kwa kuifuata Sheria
  alternative: mcha Mungu kwa mujibu wa Sheria
  rationale: Tafsiri hii inaonyesha kuwa uchaji wa Anania unaelezwa kwa uhusiano wake na Sheria, bila kutenganisha sifa hizo mbili wala kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendelea hadi mstari unaofuata, kwa hiyo koma ya mwisho imehifadhiwa.
