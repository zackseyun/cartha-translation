id: ACT.22.15
reference: Acts 22:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: sw
  text: Kwa maana utakuwa shahidi wake[a] kwa watu wote kuhusu yale uliyoyaona na kuyasikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shahidi kwake.” Dative ya Kigiriki inaweza kueleweka kwa njia zaidi ya moja zinazokaribiana hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Hapa ὅτι inatoa msingi au maelezo ya agizo lililotangulia; “Kwa maana” ni ya kawaida na inadumisha nguvu hiyo ya ufafanuzi.
- source_word: ἔσῃ
  choice: utakuwa
  rationale: Ni wakati ujao wa εἰμί, na “utakuwa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: μάρτυς
  choice: shahidi
  rationale: Neno hili humaanisha mtu anayetoa ushuhuda; “shahidi” ni neno sahihi na linaloeleweka katika muktadha huu.
- source_word: αὐτῷ
  choice: wake
  rationale: “Shahidi wake” huonyesha kwa Kiswahili cha kawaida kwamba Paulo atamshuhudia Bwana au atatoa ushuhuda kwa niaba yake, huku tanbihi ikihifadhi uwezekano wa kuelewa dative hii kama “kwake.”
- source_word: πρὸς πάντας ἀνθρώπους
  choice: kwa watu wote
  rationale: πρός inaelekeza ushuhuda kwa hadhira, na ἀνθρώπους hapa inawahusu wanadamu kwa ujumla; “watu wote” ni ya asili na haileti maana ya wanaume pekee.
- source_word: ὧν
  choice: kuhusu yale
  rationale: Kiwakilishi hiki kinataja mambo yanayounda maudhui ya ushuhuda; “kuhusu yale” huunganika kwa uwazi na vitenzi vinavyofuata.
- source_word: ἑώρακας
  choice: uliyoyaona
  rationale: Muundo huu unaonyesha mambo ambayo Paulo amekwisha kuyaona na ambayo sasa ni msingi wa ushuhuda wake.
- source_word: καὶ ἤκουσας
  choice: na kuyasikia
  rationale: Kitenzi hiki kinaratibiwa kwa kawaida na “uliyoyaona,” huku kikihifadhi tukio la kusikia kama sehemu ya msingi wa ushuhuda.
theological_decisions:
- issue: Rejeo na kazi ya αὐτῷ katika agizo la Paulo
  choice: “wake,” ikimaanisha shahidi wa Bwana/Yesu au shahidi anayetoa ushuhuda kwa niaba yake
  alternative: “kwake,” ambayo ingeacha dative hiyo ikiwa ya uhusiano bila kuamua zaidi
  rationale: Muktadha wa karibu unamhusisha Bwana/Yesu kama anayeshuhudiwa. “Shahidi wake” ni Kiswahili cha kawaida, lakini tanbihi inadumisha utata wa kisarufi wa dative badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watu wote” ni jumuishi kwa kawaida, hivyo hakuna haja ya tanbihi kuhusu jinsia kama ilivyo katika Kiingereza.
