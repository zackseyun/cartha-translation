base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: sw
  text: Nikamwona akiniambia, “Fanya haraka, utoke Yerusalemu upesi, kwa sababu hawatakubali ushuhuda wako kunihusu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν
  choice: Nikamwona
  rationale: Ingawa kimaumbo ni hali ya kutenda isiyo na kikomo, katika mwendelezo huu wa simulizi inaendeleza taarifa ya Paulo kuhusu maono; “Nikamwona” ni ya asili katika Kiswahili na inadumisha wazo la kuona katika maono.
- source_word: αὐτὸν λέγοντά μοι
  choice: akiniambia
  rationale: Kirai hiki humweleza yule aliyeonekana kuwa akisema na Paulo. “Akiniambia” ni Kiswahili cha kawaida na huanzisha vizuri maneno ya moja kwa moja bila kuongeza utambulisho ambao haukutajwa wazi katika mstari.
- source_word: Σπεῦσον
  choice: Fanya haraka
  rationale: Amri hii inaonyesha uharaka mkubwa. “Fanya haraka” ni ya sasa, wazi, na yenye nguvu inayofaa.
- source_word: ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ
  choice: utoke Yerusalemu upesi
  rationale: Muundo wa Kiswahili baada ya “Fanya haraka” kwa kawaida hutumia kiunganishi na hali ya kutegemea. “Utoke Yerusalemu” huhifadhi mwendo wa kutoka mjini, na “upesi” huendeleza msisitizo maradufu wa uharaka uliomo katika Kigiriki.
- source_word: διότι
  choice: kwa sababu
  rationale: Huanzisha sababu ya amri kwa namna iliyo wazi na ya kawaida katika Kiswahili.
- source_word: οὐ παραδέξονταί
  choice: hawatakubali
  rationale: Kitenzi hapa humaanisha kutopokea au kutokubali kwa njia inayopendeza. “Hawatakubali” huendana vizuri na “ushuhuda” katika Kiswahili cha sasa.
- source_word: σου μαρτυρίαν
  choice: ushuhuda wako
  rationale: “Ushuhuda” huhifadhi maana ya taarifa ya shahidi na tangazo la Paulo bila kuifanya iwe tu tendo la kushuhudia.
- source_word: περὶ ἐμοῦ
  choice: kunihusu
  rationale: Hutoa kwa ufupi na kwa kawaida maana ya ushuhuda unaomhusu msemaji.
theological_decisions:
- issue: Anayerejelewa na αὐτόν katika taarifa ya maono ya Paulo
  choice: Kudumisha kiwakilishi katika “Nikamwona” bila kuongeza jina au cheo
  alternative: Kutafsiri wazi kuwa “nikamwona Bwana” au “nikamwona Yesu”
  rationale: Muktadha wa karibu humtambulisha msemaji, lakini mstari wenyewe una kiwakilishi. Kutoweka jina au cheo hudumisha namna ya maandishi ya Kigiriki na kuepuka kufafanua zaidi ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Fanya haraka ... upesi” kimedumishwa ili kuonyesha msisitizo maradufu wa Σπεῦσον na ἐν τάχει bila kutumia lugha ya kizamani. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya “kubali/pokea” inaweza kuwakilishwa vizuri na neno kuu la kawaida “kubali” bila kupoteza utata muhimu.
