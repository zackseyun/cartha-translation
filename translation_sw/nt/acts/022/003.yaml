id: ACT.22.3
reference: Acts 22:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: sw
  text: “Mimi ni mwanamume Myahudi, niliyezaliwa Tarso ya Kilikia, lakini nikalelewa katika mji huu miguuni pa Gamalieli[a]. Nikafundishwa kwa ukamilifu katika sheria ya mababu zetu[b], nikiwa mwenye bidii kwa ajili ya Mungu, kama ninyi nyote mlivyo leo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “miguuni pa Gamalieli”; hii ni nahau inayomaanisha kufundishwa chini ya mwalimu.
    reason: cultural_note
  - marker: b
    text: Au, “sheria ya mababu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: mwanamume Myahudi
  rationale: Huhifadhi wazi maana ya ἀνήρ kama mwanamume mtu mzima na ya Ἰουδαῖος kama Myahudi, badala ya kuifupisha kuwa utambulisho wa kijamii pekee.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: niliyezaliwa Tarso ya Kilikia
  rationale: Ni Kiswahili cha kawaida kinachotaja mahali pa kuzaliwa na kuonyesha Tarso kuwa mji wa Kilikia.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: lakini nikalelewa katika mji huu
  rationale: Kitenzi kinahusu kulelewa na kukua; “lakini” huhifadhi utofautishaji kati ya mahali pa kuzaliwa na mahali pa kulelewa.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: miguuni pa Gamalieli
  rationale: Huhifadhi taswira ya Kigiriki ya mwanafunzi kuketi miguuni pa mwalimu, huku tanbihi ikifafanua kuwa ni nahau ya kufundishwa chini yake.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: Nilifundishwa kwa kufuata kwa makini kabisa
  rationale: Huleta pamoja wazo la kupewa mafunzo na lile la usahihi au ukali mkubwa bila kutumia muundo mgumu usio wa kawaida katika Kiswahili.
- source_word: τοῦ πατρῴου νόμου
  choice: sheria ya mababu zetu
  rationale: “Mababu zetu” huwasilisha urithi wa pamoja ambao Paulo anautaja mbele ya wasikilizaji wake Wayahudi; pia hufanya maana ya kivumishi πατρῷος iwe wazi.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: nilikuwa mwenye bidii kwa Mungu
  rationale: “Mwenye bidii” huonyesha juhudi na kujitoa kwa dhati bila kuingiza maana ya kisiasa ya kundi la Wazeloti.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: kama ninyi nyote mlivyo leo
  rationale: Huhifadhi ulinganisho wa Paulo na wasikilizaji wake pamoja na msisitizo wa “nyote” na “leo.”
theological_decisions:
- issue: Jinsi ya kutafsiri πατρῴου νόμου na kuhifadhi kujitambulisha kwa Paulo pamoja na hadhira yake ya Kiyahudi
  choice: sheria ya mababu zetu
  alternative: sheria ya mababu; sheria ya jadi
  rationale: Muktadha unaonyesha Paulo akisisitiza urithi wao wa pamoja. “Zetu” huiweka wazi hali hiyo bila kuleta fundisho la dhehebu.
- issue: Kuhifadhi au kufafanua nahau παρὰ τοὺς πόδας Γαμαλιήλ
  choice: miguuni pa Gamalieli
  alternative: chini ya Gamalieli; akifundishwa na Gamalieli
  rationale: Taswira ya kihistoria ya uhusiano wa mwalimu na mwanafunzi imehifadhiwa katika matini, na maana yake imefafanuliwa katika tanbihi ili isieleweke kama mahali tu.
- issue: Maana ya ζηλωτής kuhusiana na Mungu
  choice: mwenye bidii kwa Mungu
  alternative: mwenye juhudi kwa ajili ya Mungu; mwenye wivu kwa Mungu
  rationale: Chaguo hili huhifadhi ari ya kidini inayokusudiwa huku likiepuka kuhusisha moja kwa moja chama cha kisiasa cha Wazeloti au maana hasi ya wivu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kigiriki imegawanywa kidogo ili isomeke kwa urahisi, huku mtiririko wa ushuhuda wa Paulo, utofautishaji wa kuzaliwa na kulelewa, na uhusiano wake na hadhira vikihifadhiwa. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
