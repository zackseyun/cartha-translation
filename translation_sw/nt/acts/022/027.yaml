translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumia viunganishi vya kawaida vya Kiswahili; sentensi fupi ya jibu imehifadhiwa. Uraia wa Roma umewekwa wazi katika maandishi kwa sababu ‘Mroma’ peke yake unaweza kueleweka kama asili ya mtu badala ya hadhi yake ya kisheria.
