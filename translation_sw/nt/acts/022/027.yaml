  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: sw
  text: Basi mkuu wa jeshi[a] akamkaribia, akamwambia, “Niambie, wewe ni raia wa Roma?” Naye akasema, “Ndiyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamanda.” Neno la Kigiriki χιλίαρχος humaanisha afisa wa jeshi la Roma, ambaye kwa kawaida huitwa “tribuni” au, kwa ujumla, “kamanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: akamkaribia
  rationale: Kitenzi hiki kinaonyesha kwamba mkuu wa jeshi alisogea karibu na Paulo kabla ya kusema; ‘akamkaribia’ ni Kiswahili cha kawaida na kinachohifadhi mwendo huo.
- source_word: δὲ
  choice: Basi / Naye
  rationale: δὲ ya kwanza inaendeleza simulizi, hivyo ‘Basi’ inafaa; ya pili inaonyesha kubadilika kwa msemaji na imewakilishwa kwa ‘Naye’ bila kuleta upinzani mkali usiokuwapo.
- source_word: χιλίαρχος
  choice: mkuu wa jeshi
  rationale: Katika muktadha wa Matendo, neno hili humaanisha afisa wa Kirumi aliyekuwa na mamlaka juu ya kikosi kikubwa. ‘Mkuu wa jeshi’ ni wazi kwa msomaji wa kawaida, huku maelezo ya chini yakibainisha cheo hicho.
- source_word: εἶπεν αὐτῷ
  choice: akamuuliza
  rationale: Ingawa maana ya moja kwa moja ni ‘akamwambia,’ kauli inayofuata ni swali; ‘akamuuliza’ ni ya asili katika Kiswahili na haibadili tendo la usemi.
- source_word: Λέγε μοι
  choice: Niambie
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya amri pamoja na kiwakilishi cha nafsi cha mtendewa.
- source_word: σὺ
  choice: wewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina msisitizo; kukiweka wazi kama ‘wewe’ kunahifadhi msisitizo huo kwa Kiswahili cha asili.
- source_word: Ῥωμαῖος
  choice: raia wa Roma
  rationale: Kivumishi hiki kimetumika kama nomino na katika muktadha kinamaanisha hadhi ya uraia wa kisheria, si tu mtu mwenye asili au makazi ya Roma. Kiswahili huhitaji ‘raia wa Roma’ ili maana hiyo iwe wazi.
- source_word: Ναί
  choice: Ndiyo
  rationale: Jibu fupi la kukubali limehifadhiwa bila kuongeza maneno yasiyokuwapo katika Kigiriki.
