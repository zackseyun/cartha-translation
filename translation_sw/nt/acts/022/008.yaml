base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: sw
  text: Nami nikajibu, “Wewe ni nani, Bwana?[a]” Naye akaniambia, “Mimi ni Yesu Mnazareti,[b] ambaye wewe unamtesa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bwana,” kama namna ya heshima ya kumwita mtu. Neno la Kigiriki κύριε linaweza kutumiwa kwa heshima na pia kama cheo “Bwana.”
    reason: alternative_reading
  - marker: b
    text: Au “Yesu wa Nazareti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: nikajibu
  rationale: Kitenzi hiki hapa ni tendo lililokamilika katika simulizi; “nikajibu” ni tafsiri ya kawaida na ya moja kwa moja ya Kiswahili.
- source_word: Τίς εἶ
  choice: Wewe ni nani?
  rationale: Muundo huu ni swali la moja kwa moja la utambulisho; kiwakilishi “wewe” kinabeba msisitizo unaofaa katika mazungumzo.
- source_word: κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana ya cheo κύριος na pia mvutano wa kifungu kuhusu kiwango ambacho Sauli alikuwa amemtambua msemaji; maana ya heshima “bwana” inaelezwa katika tanbihi.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Naye akaniambia
  rationale: Hii ni njia ya asili ya Kiswahili ya kuwasilisha λέγω pamoja na πρὸς ἐμέ, huku “naye” ikihifadhi nguvu ya kiunganishi τε.
- source_word: Ἐγώ εἰμι
  choice: Mimi ni
  rationale: Huu ni utambulisho wa moja kwa moja; “mimi” huhifadhi msisitizo wa ἐγώ.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: ὁ Ναζωραῖος
  choice: Mnazareti
  rationale: “Mnazareti” ni jina la utambulisho lenye kifungu katika Kigiriki na ni la kawaida, fupi, na lenye heshima katika Kiswahili; “Yesu wa Nazareti” ni mbadala wa asili.
- source_word: ὃν σὺ διώκεις
  choice: ambaye wewe unamtesa
  rationale: Katika muktadha huu διώκω humaanisha kutesa kwa uadui, si kufuatilia tu; “wewe” huhifadhi msisitizo wa σὺ, na wakati wa sasa unaonyesha tendo linaloendelea.
theological_decisions:
- issue: Tafsiri ya κύριε katika maneno ya Sauli
  choice: Bwana
  alternative: bwana kama neno la heshima
  rationale: “Bwana” linahifadhi cheo kinachotumiwa katika simulizi bila kuamua kimyakimya kama Sauli tayari alitambua kikamilifu utambulisho wa msemaji. Tanbihi inaonyesha kwamba neno la Kigiriki pia linaweza kuwa namna ya heshima ya kumwita mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetolewa kwa viunganishi vya kawaida vya Kiswahili, huku msisitizo wa viwakilishi vya Kigiriki na utata wa κύριε vikihifadhiwa.
