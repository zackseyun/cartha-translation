id: ACT.22.30
reference: Acts 22:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: sw
  text: Lakini siku iliyofuata, kwa kuwa alitaka kujua kwa hakika Paulo alikuwa anashtakiwa na Wayahudi[a] kwa jambo gani, akamfungua na kuamuru makuhani wakuu na baraza lote[b] wakusanyike. Kisha akamteremsha Paulo na kumsimamisha mbele yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viongozi wa Wayahudi,” au “Wayudea.” Kigiriki kinasema “Wayahudi”; katika muktadha huu neno hilo linawahusu waliokuwa wakimshtaki Paulo, wala si kila Myahudi bila ubaguzi.
    reason: lexical_alternative
  - marker: b
    text: “Baraza” hapa ni Sanhedrini, baraza kuu la Wayahudi huko Yerusalemu.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Lakini siku iliyofuata
  rationale: Kirai hiki ni nahau ya wakati inayomaanisha siku inayofuata; δέ hapa huonyesha mpito mdogo wa simulizi.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: akiwa anataka kujua kwa hakika
  rationale: Tafsiri hii inaonyesha kusudi la kamanda na wazo la kupata habari zilizo hakika.
- source_word: τὸ τί κατηγορεῖται
  choice: Paulo alikuwa anashtakiwa ... kwa jambo gani
  rationale: Muundo huu unaeleza jambo lililokuwa msingi wa shtaka na kuhifadhi hali ya kutendwa ya kitenzi cha Kigiriki.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: na Wayahudi
  rationale: Kigiriki kinawataja Wayahudi moja kwa moja; katika muktadha ni wale waliokuwa wakimshtaki Paulo, si Wayahudi wote bila ubaguzi.
- source_word: ἔλυσεν αὐτόν
  choice: alimfungua vifungo
  rationale: λύω humaanisha kufungua au kuondoa vifungo. Muktadha unaonyesha kwamba Paulo aliachiliwa kutoka vifungoni, si lazima kutoka chini ya ulinzi wa Waroma.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: kuamuru ... wakusanyike
  rationale: κελεύω pamoja na kitenzi-jina huonyesha amri yenye mamlaka; Kiswahili hiki ni cha kawaida na wazi.
- source_word: τοὺς ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo jina la kawaida la viongozi wa juu wa kikuhani, bila kudokeza kwamba wote walikuwa kuhani mkuu aliyekuwa madarakani.
- source_word: πᾶν τὸ συνέδριον
  choice: baraza lote
  rationale: συνέδριον hapa ni baraza kuu la utawala la Wayahudi, yaani Sanhedrini; πᾶν imewakilishwa na “lote.”
- source_word: καταγαγὼν τὸν Παῦλον
  choice: akamteremsha Paulo
  rationale: Tafsiri hii huhifadhi mwendo wa kushuka, huenda kutoka ngome kuelekea mahali pa mkutano.
- source_word: ἔστησεν εἰς αὐτούς
  choice: akamsimamisha mbele yao
  rationale: Kirai kinaeleza kumweka Paulo akiwa amesimama mbele ya baraza rasmi.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika muktadha wa Matendo
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Tafsiri kuu huhifadhi jina lililo katika Kigiriki badala ya kulibana kimafasiri. Tanbihi inaeleza kwamba muktadha unawahusu washtaki wa Paulo, si kila Myahudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi rasmi lakini kinachoeleweka kwa urahisi. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa, yaani “Wayahudi[a]” na “baraza lote[b].”
