id: ACT.22.5
reference: Acts 22:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: sw
  text: Kama vile kuhani mkuu na baraza lote la wazee wanavyoweza kunishuhudia, nilipokea pia kutoka kwao barua kwa ndugu huko Damasko; nami nilikuwa nikisafiri kwenda huko ili niwalete Yerusalemu, wakiwa wamefungwa, wale waliokuwa huko pia, ili waadhibiwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς καὶ
  choice: Kama vile ... wanavyoweza
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba kuhani mkuu na baraza la wazee wanaweza kuthibitisha dai la Paulo.
- source_word: ὁ ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo jina la kawaida la cheo cha mamlaka kuu ya ukuhani katika muktadha huu.
- source_word: μαρτυρεῖ μοι
  choice: wanavyoweza kunitolea ushahidi
  rationale: Huwasilisha uthibitisho unaoweza kutolewa kuhusu madai ya Paulo kwa Kiswahili cha kawaida.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: baraza lote la wazee
  rationale: πρεσβυτέριον humaanisha kundi rasmi au baraza la wazee, si watu wazee tu.
- source_word: παρ’ ὧν
  choice: Kutoka kwao
  rationale: Kiwakilishi kinawarejelea kwa pamoja kuhani mkuu na baraza la wazee.
- source_word: ἐπιστολὰς
  choice: barua
  rationale: Huhifadhi maana ya msingi bila kuongeza waziwazi wazo la hati za mamlaka, ambalo linaeleweka kutokana na muktadha.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: kwa ndugu
  rationale: Huhifadhi nomino ya Kigiriki ya kiume katika matini kuu; uwezekano wa kurejelea jumuiya pana umeelezwa katika tanbihi.
- source_word: εἰς Δαμασκὸν ἐπορευόμην
  choice: nilikuwa nikisafiri kwenda huko
  rationale: Kauli ya wakati uliopita unaoendelea huonyesha safari iliyokuwa ikiendelea kuelekea Damasko.
- source_word: ἄξων
  choice: ili niwalete
  rationale: Kirai cha Kigiriki kinaonyesha kusudi la safari.
- source_word: καὶ τοὺς ἐκεῖσε ὄντας
  choice: wale pia waliokuwa huko
  rationale: Neno “pia” linawakilisha καί huku kirai kingine kikirejelea watu waliokuwa Damasko.
- source_word: δεδεμένους
  choice: wakiwa wamefungwa
  rationale: Huhifadhi hali yao kama wafungwa bila kubainisha minyororo, jambo ambalo Kigiriki hakisemi moja kwa moja.
- source_word: ἵνα τιμωρηθῶσιν
  choice: ili waadhibiwe
  rationale: Hutoa kwa uwazi kusudi la kuwatia adhabu bila kutaja aina ya adhabu ambayo matini haijabainisha.
theological_decisions:
- issue: Maana ya ἀδελφοί inapoweza kurejelea jumuiya pana
  choice: kwa ndugu
  alternative: kwa ndugu wa kiume na wa kike; kwa Wayahudi wenzao
  rationale: Matini kuu inahifadhi umbo la kiume la Kigiriki bila kuamua kimya-kimya kwamba kundi lilikuwa la jinsia mchanganyiko au kwamba neno linamaanisha hasa Wayahudi wenzao. Uwezekano mpana umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa asili katika Kiswahili huku uradidi wa “pia” na hali ya watu kuwa wamefungwa vikihifadhiwa.
