base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: sw
  text: Kwa hiyo, mara moja wale waliokuwa karibu kumchunguza[a] wakajiondoa kwake. Yule jemadari[b] pia aliogopa alipotambua kwamba alikuwa raia wa Roma na kwamba alikuwa amemfunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana iliyo wazi zaidi katika muktadha, “kumchunguza kwa kumpiga mijeledi.” Kitenzi cha Kigiriki kinaweza kumaanisha uchunguzi rasmi, na mstari uliotangulia unaonyesha njia iliyokusudiwa kutumiwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, cheo hiki kinamaanisha afisa wa jeshi la Roma aliyekuwa mkuu wa kikosi kilichoitwa kwa jina la askari elfu moja, ingawa idadi halisi ingeweza kutofautiana.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Kwa hiyo, mara moja
  rationale: ‘Kwa hiyo’ inaonyesha matokeo yanayotokana na habari ya mstari uliotangulia, na ‘mara moja’ inahifadhi uzito wa tendo la haraka.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: wakamwacha
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba walijiondoa kwake na wakaacha hatua waliyokusudia kuchukua.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: wale waliokuwa karibu kumhoji
  rationale: Muundo huu unaonyesha nia iliyokaribia kutekelezwa; ‘kumhoji’ linafaa kwa uchunguzi rasmi bila kuweka moja kwa moja katika maandishi njia ya kupiga mijeledi inayofafanuliwa na muktadha.
- source_word: χιλίαρχος
  choice: mkuu wa jeshi
  rationale: Cheo hiki cha kijeshi cha Kirumi kinawasilishwa kwa lugha inayoeleweka kwa wasomaji wa kawaida; maelezo ya kihistoria yanawekwa katika tanbihi.
- source_word: ἐφοβήθη
  choice: akaogopa
  rationale: Kitenzi kinaonyesha hofu iliyoanza baada ya mkuu huyo kutambua hali ya Paulo.
- source_word: ἐπιγνοὺς
  choice: alipotambua
  rationale: Huonyesha kufikia ufahamu kamili wa ukweli wenye umuhimu wa kisheria.
- source_word: Ῥωμαῖός ἐστιν
  choice: Paulo alikuwa raia wa Roma
  rationale: Katika muktadha huu neno linahusu uraia na haki zake za kisheria, si asili ya kikabila; jina ‘Paulo’ linaondoa utata wa viwakilishi katika Kiswahili.
- source_word: δεδεκώς
  choice: alikuwa amemfunga
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililokwisha kufanywa ambalo matokeo yake bado yalikuwa na umuhimu; Kiswahili hiki kinahifadhi hali hiyo.
