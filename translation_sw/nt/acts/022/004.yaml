review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the hostile sense of ἐδίωξα, the recognized Acts designation ‘the Way,’ the limiting force of ἄχρι θανάτου, and the sequence of binding and imprisonment. However, ‘wanaume kwa wanawake’ does not render τε καὶ (‘both ... and ...’); it should be ‘wanaume na wanawake.’ ‘Kuwatia magerezani’ is an acceptable idiomatic rendering of committing people to prisons in this context.
  naturalness: The sentence is generally clear and suitably formal, but ‘wanaume kwa wanawake’ is not natural Standard East African Swahili for an inclusive pair. Placing ‘wanaume na wanawake’ directly after the object verbs is natural and retains the Greek emphasis.
  terminology: ‘Njia hii’ appropriately preserves both the literal meaning and the likely titular use of ἡ ὁδός in Acts. ‘Niliitesa’ and ‘hata kufikia kifo’ are suitable and do not overstate Paul’s personal role in killing. ‘Magerezani’ is natural for plural φυλακάς.
  issues:
  - severity: high
    issue: ‘wanaume kwa wanawake’ mistranslates ἄνδρας τε καὶ γυναῖκας.
    rationale: The Greek construction means ‘both men and women.’ In Swahili, ‘kwa’ does not coordinate the two groups in this way and can suggest an unintended relationship or contrast. ‘Wanaume na wanawake’ is required.
  - severity: low
    issue: Footnote b explains word order rather than the lexical/juridical sense of the imprisonment phrase.
    rationale: A note can more usefully explain that the Greek conveys handing people over or committing them to prisons, while the Swahili idiom ‘kuwatia magerezani’ expresses that action naturally.
  revised_text: Niliitesa Njia hii hata kufikia kifo,[a] nikiwafunga na kuwatia magerezani wanaume na wanawake.[b]
  revised_footnotes:
  - marker: a
    text: Au “njia hii” au “harakati hii.” Kigiriki kinasema kihalisi “njia hii,” lakini katika Matendo neno hili hutumiwa mara nyingi kama jina la harakati ya wafuasi wa Yesu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki humaanisha kuwafunga na kuwapeleka au kuwakabidhi watu magerezani. “Kuwatia magerezani” ni usemi wa kawaida wa Kiswahili unaoeleza jambo hilo.
    reason: clarity
  revision_rationale: 'The revision changes only the faulty coordination of men and women and improves the explanatory note. It retains the source order and scope: Paul persecuted the Way to the point of death, binding and committing both men and women to prisons.'
