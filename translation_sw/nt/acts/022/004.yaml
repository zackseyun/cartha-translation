  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: sw
  text: Niliitesa Njia hii hata kufikia kifo,[a] nikiwafunga na kuwatia magerezani wanaume na wanawake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “njia hii” au “harakati hii.” Kigiriki kinasema kihalisi “njia hii,” lakini katika Matendo neno hili hutumiwa mara nyingi kama jina la harakati ya wafuasi wa Yesu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki humaanisha kuwafunga na kuwapeleka au kuwakabidhi watu magerezani. “Kuwatia magerezani” ni usemi wa kawaida wa Kiswahili unaoeleza jambo hilo.
    reason: clarity
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: Njia hii
  rationale: ὁδός humaanisha kihalisi ‘njia,’ lakini katika Matendo hutumiwa pia kuitaja harakati ya wafuasi wa Yesu. ‘Njia hii’ huhifadhi taswira ya Kigiriki na maana yake kama jina linalotambulika.
- source_word: ἐδίωξα
  choice: Niliitesa
  rationale: Katika muktadha huu διώκω ni kuwafuatilia watu kwa uadui na kuwadhuru kwa sababu ya imani yao; ‘kutesa’ ni usemi wa kawaida na wenye nguvu inayofaa katika Kiswahili.
- source_word: ἄχρι θανάτου
  choice: hata kufikia kifo
  rationale: Usemi huu unaonyesha kiwango cha mwisho na cha kuua cha mateso bila kudai moja kwa moja kwamba Paulo mwenyewe aliwaua watu.
- source_word: δεσμεύων
  choice: nikiwafunga
  rationale: Huhifadhi maana halisi ya kuwafunga watu, huku kiambishi cha yambwa kikiwaelekeza wanaume na wanawake wanaotajwa baadaye.
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: kuwatia gerezani
  rationale: Katika muktadha huu, kuwakabidhi watu waingizwe kifungoni huelezwa kwa Kiswahili cha kawaida na kwa usahihi kama ‘kuwatia gerezani.’
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: wanaume kwa wanawake
  rationale: Usemi huu wa Kiswahili unasisitiza kwamba mateso yaliwahusu wanaume na wanawake pia, kama muundo wa Kigiriki unavyofanya.
theological_decisions:
- issue: Iwapo ἡ ὁδός litafsiriwe kama nomino ya kawaida au jina linaloitaja harakati ya Kikristo
  choice: Njia hii
  alternative: njia hii; harakati hii
  rationale: Matendo hutumia ἡ ὁδός kama jina linalotambulisha imani na jumuiya ya wafuasi wa Yesu. ‘Njia hii’ huhifadhi maana ya msingi na matumizi hayo bila kuingiza istilahi ya baadaye.
- issue: Iwapo ἄχρι θανάτου inadai kwamba Paulo mwenyewe aliua watu
  choice: hata kufikia kifo
  alternative: hadi kufa; mpaka kifo
  rationale: Tafsiri hii huhifadhi ukubwa wenye matokeo ya kifo wa mateso, lakini haiamui zaidi ya asemavyo Paulo kuhusu ushiriki wake binafsi katika mauaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa kuwa wa asili katika Kiswahili huku ukihifadhi mfuatano wa mateso, kufungwa, na kutiwa gerezani. Alama zote za tanbihi zimewekwa katika matini kuu.
