base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: sw
  text: Nikaanguka chini, nikasikia sauti ikiniambia, “Sauli, Sauli, kwa nini unanitesa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: nikaanguka
  rationale: Kitenzi cha wakati uliopita katika nafsi ya kwanza kimetafsiriwa kwa mfululizo wa masimulizi kwa kutumia kiambishi -ka-, ambacho ni cha kawaida na cha asili katika Kiswahili.
- source_word: τε
  choice: '[hakikutafsiriwa kivyake]'
  rationale: Kiunganishi hiki huunganisha tukio na yaliyotangulia; mtiririko huo tayari unaonyeshwa kwa umbo la masimulizi nikaanguka, hivyo tafsiri ya ziada ingekuwa nzito.
- source_word: εἰς τὸ ἔδαφος
  choice: chini
  rationale: Katika muktadha wa kuanguka, “kuanguka chini” ndiyo kauli ya kawaida ya Kiswahili na inawakilisha kwa usahihi kuelekea ardhini.
- source_word: ἤκουσα
  choice: nikasikia
  rationale: Umbo la masimulizi lenye -ka- linaendeleza kwa kawaida tukio linalofuata baada ya kuanguka.
- source_word: φωνῆς
  choice: sauti
  rationale: “Sauti” ni tafsiri ya moja kwa moja na ya asili kwa sauti inayotoa maneno yanayofuata; Kiswahili hakihitaji kibainishi kisicho dhahiri kama cha Kiingereza.
- source_word: λεγούσης μοι
  choice: ikiniambia
  rationale: Kitenzi “kuambia” kwa pamoja kinaonyesha kwamba sauti ilisema maneno yaliyomlenga msemaji; “ikiniambia” ni ya asili kuliko “ikisema kwangu” huku ikihifadhi μοι.
- source_word: Σαοὺλ Σαούλ
  choice: Sauli, Sauli
  rationale: Jina limeandikwa kwa umbo lililozoeleka katika Kiswahili, na urudiaji umehifadhiwa kwa ajili ya msisitizo wa mwito wa moja kwa moja.
- source_word: τί
  choice: kwa nini
  rationale: Katika swali hili τί huuliza sababu ya tendo, hivyo “kwa nini” ni tafsiri sahihi na ya kawaida.
- source_word: με
  choice: -ni-
  rationale: 'Kiambishi cha yambwa katika “unanitesa” kinahifadhi rejeo la moja kwa moja kwa msemaji: “mimi.”'
- source_word: διώκεις
  choice: unanitesa
  rationale: Kitenzi cha wakati wa sasa kinaonyesha tendo linaloendelea. Katika muktadha huu διώκω humaanisha kuwatesa au kuwadhulumu kwa uhasama; “kutesa” ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Uhusiano wa msemaji na vitendo vya Sauli dhidi ya waumini
  choice: Kuhifadhi yambwa ya moja kwa moja “-ni-” katika “unanitesa” bila ufafanuzi wa ziada.
  alternative: Kuongeza maneno kama “unawatesa watu wangu” au “unawatesa wafuasi wangu.”
  rationale: Nguvu ya kitheolojia ya mstari iko katika msemaji kutaja mateso ya waumini kuwa mateso dhidi yake mwenyewe. Tafsiri inahifadhi dai hilo bila kulifafanua au kulitatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na hadhi inayofaa maandiko. “Nikaanguka … nikasikia” ni sanifu na rahisi kueleweka; usemi wa moja kwa moja umehifadhiwa bila upanuzi wa kimadhehebu.
