  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: sw
  text: Na wakati damu ya Stefano, shahidi wako[a], ilipokuwa ikimwagwa, mimi mwenyewe nilikuwa nimesimama pale, nikiidhinisha na kuzilinda nguo za wale waliokuwa wakimuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfia imani.” Neno la Kigiriki linaweza kumaanisha shahidi, na katika matumizi ya Kikristo baadaye likahusishwa hasa na mtu anayekufa kwa sababu ya ushuhuda wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: ilikuwa ikimwagwa
  rationale: Muundo huu unaonyesha tendo la wakati uliopita lililokuwa likiendelea na hali ya kutendwa, huku ukihifadhi taswira halisi ya damu kumwagwa.
- source_word: αἷμα
  choice: damu
  rationale: Hili ndilo neno la moja kwa moja na la kawaida katika Kiswahili.
- source_word: μάρτυρός
  choice: shahidi
  rationale: Maana ya msingi ya neno la Kigiriki ni mtu anayetoa ushuhuda. Ingawa baadaye lilihusishwa hasa na anayekufa kwa sababu ya ushuhuda wake, maana hiyo ya baadaye haijaingizwa kimya kimya katika matini kuu.
- source_word: ἐφεστὼς
  choice: nimesimama hapo
  rationale: Inaeleza kuwapo na kusimama karibu na tukio bila kuongeza dai kwamba Paulo alikuwa mtazamaji tu.
- source_word: συνευδοκῶν
  choice: nikiridhia
  rationale: Neno hili linaonyesha kukubali au kuunga mkono kitendo, si kufahamu tu kwamba kilikuwa kikitendeka.
- source_word: φυλάσσων
  choice: kulinda
  rationale: Kitenzi hiki kinaonyesha kuzitunza na kuzichunga nguo hizo.
- source_word: ἱμάτια
  choice: nguo
  rationale: Ni tafsiri ya kawaida na ya asili; katika muktadha huu neno linaweza kurejelea mavazi ya nje, lakini si lazima lifungwe kwa aina moja maalumu kama majoho.
- source_word: ἀναιρούντων
  choice: waliokuwa wakimuua
  rationale: Muundo huu unaonyesha kitendo kilichokuwa kikiendelea na kutafsiri maana ya kuua bila kuongeza hukumu ya kisheria au ya kimaadili kama ilivyo katika 'kumwua kwa mauaji.'
- source_word: αὐτὸς
  choice: mimi mwenyewe
  rationale: Inahifadhi mkazo uliowekwa juu ya kuhusika kwa msemaji mwenyewe.
theological_decisions:
- issue: Tafsiri ya μάρτυς kumhusu Stefano
  choice: shahidi
  alternative: mfia imani
  rationale: ‘Shahidi’ huhifadhi maana ya msingi ya Kigiriki na uhusiano wake na kutoa ushuhuda. ‘Mfia imani’ huonyesha uhusiano wa neno hilo na kifo kwa sababu ya ushuhuda, lakini inaweza kuingiza istilahi ya baadaye katika matini kuu; kwa hiyo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi umehifadhi samtidiga wa kusimama, kuridhia na kulinda, bila kuongeza maelezo yasiyosemwa wazi katika Kigiriki.
