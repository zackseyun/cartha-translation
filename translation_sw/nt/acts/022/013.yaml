base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: sw
  text: Akaja kwangu, akasimama karibu nami, akaniambia, “Ndugu Sauli, upate kuona tena[a].” Saa hiyohiyo nikapata kuona tena, nikamtazama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tazama juu.” Kwa matukio yote mawili ya ἀναβλέπω, kitenzi kinaweza pia kumaanisha “kuona tena” au “kupata kuona tena”; katika muktadha wa upofu na kuponywa kwa Paulo, maana inayokusudiwa ni kurejeshewa uwezo wa kuona.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Akaja kwangu
  rationale: Kauli hii inawasilisha kwa njia ya kawaida mwendo wa Anania kuelekea kwa Paulo, huku mfululizo wa vitenzi ukifaa masimulizi ya Kiswahili.
- source_word: ἐπιστάς
  choice: akasimama karibu nami
  rationale: Kitenzi kinaonyesha kwamba alichukua nafasi karibu na Paulo; tafsiri hii huhifadhi maana ya mahali bila kufanya sentensi kuwa nzito.
- source_word: Σαοὺλ ἀδελφέ
  choice: Ndugu Sauli
  rationale: Huu ni mwito wa moja kwa moja unaoonyesha udugu au ushirika; mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: ἀνάβλεψον
  choice: pata kuona tena
  rationale: Ingawa kitenzi kinaweza kumaanisha ‘tazama juu,’ muktadha wa upofu na uponyaji unaelekeza kwenye kurejeshwa kwa uwezo wa kuona.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: Saa ileile
  rationale: Huhifadhi msisitizo wa Kigiriki kwamba tendo hilo lilitokea wakati huohuo, bila kulilegeza kuwa ‘mara moja’ tu.
- source_word: ἀνέβλεψα
  choice: nikapata kuona tena
  rationale: Uamuzi huu unalingana na matumizi ya kitenzi hicho hicho katika amri iliyotangulia na unaonyesha kurejeshwa kwa uwezo wa kuona.
- source_word: εἰς αὐτόν
  choice: nikamtazama
  rationale: Huwasilisha mwelekeo wa macho kwa Anania baada ya kuona kurejeshwa, badala ya kusema tu kwamba Paulo alimwona.
- source_word: κἀγώ
  choice: nikapata
  rationale: Kiunganishi na kiwakilishi vimewakilishwa kwa kiambishi simulizi ‘ni-’ pamoja na ‘-ka-’, ambacho huendeleza mfuatano wa matukio kwa Kiswahili cha kawaida.
