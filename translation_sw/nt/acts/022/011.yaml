  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: sw
  text: Na kwa kuwa sikuweza kuona kwa sababu ya mng’ao wa nuru ile[a], nikaingia Damasko nikiongozwa kwa mkono na wale waliokuwa pamoja nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa maana ya karibu zaidi: “kwa sababu ya utukufu wa nuru ile.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Basi, kwa kuwa
  rationale: '“Basi” huendeleza simulizi, na “kwa kuwa” huonyesha sababu: kutoweza kuona kulifanya Paulo aongozwe.'
- source_word: οὐκ ἐνέβλεπον
  choice: sikuweza kuona
  rationale: Katika muktadha wa nuru iliyompofusha, maana ni kutoweza kuona, si kutoweza tu kuitazama nuru.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: kwa sababu ya mng’ao wa nuru ile
  rationale: “Mng’ao” huwasilisha uangavu mkali uliozuia kuona, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya δόξα, yaani “utukufu.”
- source_word: χειραγωγούμενος
  choice: walinishika mkono na kuniongoza
  rationale: Usemi huu wa asili unaonyesha wazi kitendo halisi cha kumshika mkono na kumwongoza, badala ya kusema kwa ujumla tu kwamba aliongozwa.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: wale waliokuwa pamoja nami
  rationale: Tafsiri hii inahifadhi maana ya watu waliokuwa wakifuatana naye bila kuongeza wazo la kundi rasmi la wasafiri.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: hadi Damasko
  rationale: Katika muundo wa Kiswahili uliotumika, “kuniongoza hadi Damasko” huwasilisha kwa kawaida mwendo na kufika kwake mjini humo.
theological_decisions:
- issue: Tafsiri ya δόξα katika muktadha wa nuru ya mbinguni
  choice: mng’ao
  alternative: utukufu
  rationale: Hapa δόξα inaeleza uangavu unaoonekana wa nuru uliomzuia Paulo kuona. “Mng’ao” huweka wazi athari hiyo ya kimwili bila kuondoa uwezekano wa maana ya kitheolojia, ambao umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa kawaida kwa msomaji wa leo, na “walinishika mkono na kuniongoza” huhifadhi taswira dhahiri ya χειραγωγούμενος.
