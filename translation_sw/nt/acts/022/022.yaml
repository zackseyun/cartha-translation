    text: Yaani, walikuwa wakidai auawe; pia inaweza kutafsiriwa, “kwa maana hapaswi kuishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: Waliendelea kumsikiliza
  rationale: Kauli ya wakati uliopita isiotimilika inaonyesha tendo lililoendelea; Kiswahili hiki kinaonyesha kwamba walikuwa wakimsikiliza hadi wakati huo.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: mpaka aliposema maneno hayo
  rationale: λόγος hapa ni sehemu au kauli katika hotuba ya Paulo iliyochochea mwitikio wao, si lazima neno moja pekee.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: wakapaza sauti zao
  rationale: Huhifadhi taswira ya nahau ya Kigiriki na kueleza kwa Kiswahili cha kawaida kilio cha sauti kubwa.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha moja kwa moja yaliyomo katika kilio chao.
- source_word: Αἶρε
  choice: Mwondoe
  rationale: Katika muktadha huu wa uhasama, kitenzi kinamaanisha kumwondoa; umoja wa amri umehifadhiwa bila kubainisha anayelengwa na amri.
- source_word: ἀπὸ τῆς γῆς
  choice: duniani
  rationale: γῆ hapa lina nguvu ya ‘dunia,’ na kilio hicho kinadai mtu huyo aondolewe miongoni mwa walio hai.
- source_word: τὸν τοιοῦτον
  choice: mtu wa namna hii
  rationale: Huwasilisha dharau ya usemi wa Kigiriki kwa lugha ya sasa iliyo wazi bila kuwa ya mitaani.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: kwa maana hafai kuishi
  rationale: καθῆκεν huhusu jambo linalofaa au kustahili; ‘hafai kuishi’ ni fupi na ya kawaida, huku ikihifadhi hukumu kali ya umati.
theological_decisions:
- issue: Nguvu ya madai ya umati kuhusu kuishi kwa Paulo
  choice: hafai kuishi
  alternative: hapaswi kuishi
  rationale: ‘Hafai kuishi’ hudumisha maana ya kile kisichofaa katika καθῆκεν, huku tanbihi ikifafanua kwamba walikuwa wakidai auawe; hivyo tafsiri haifichi nguvu ya kauli wala kuifanya kuwa amri ya moja kwa moja kuliko Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili ili simulizi na mlipuko wa umati zisomeke kwa kawaida. ‘Wakapaza sauti zao’ huhifadhi nahau ya chanzo, na ‘mtu wa namna hii’ huonyesha dharau bila kutumia lugha ya kale.
