  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: sw
  text: Waliendelea kumsikiliza mpaka kufikia kauli hiyo. Ndipo wakapaza sauti zao wakisema, “Mwondoe mtu wa namna hii duniani,[a] kwa maana hafai kuishi!”[b]
  philosophy: optimal-equivalence
  footnotes:
