base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: sw
  text: Watu waliofanya njama hii walikuwa zaidi ya arobaini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa zaidi ya watu arobaini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: zaidi ya arobaini
  rationale: Muundo wa kulinganisha pamoja na namba unamaanisha idadi inayozidi arobaini. Tafsiri hii ni ya kawaida na sahihi katika Kiswahili.
- source_word: συνωμοσίαν
  choice: njama
  rationale: Neno hili linaashiria makubaliano ya siri ya kutenda jambo baya. “Njama” ni neno la asili na linaloeleweka kwa urahisi katika muktadha huu bila kuingiza maelezo kutoka mistari inayozunguka.
- source_word: ποιησάμενοι
  choice: waliofanya
  rationale: Kitenzi hiki pamoja na “njama” kinaweza kutafsiriwa kiasili kuwa “waliofanya njama,” huku hali yake ya tendo lililotangulia ikieleweka kutokana na muundo wa kishazi.
- source_word: ἦσαν δὲ
  choice: walikuwa
  rationale: Muundo huu unaeleza kuwapo na idadi ya kundi hilo. Kiunganishi δέ ni chepesi na mtiririko wa Kiswahili hauhitaji kitafsiriwe kwa neno tofauti hapa.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: Watu waliofanya njama hii
  rationale: Kibainishi pamoja na kivumishi-tendo kinarejelea watu husika; kishazi cha uhusiano ni njia ya kawaida na wazi ya kukitoa kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Mpangilio wa sentensi umetanguliza kundi linalohesabiwa ili kuepuka muundo usio wa kawaida wa “kulikuwa na zaidi ya arobaini,” bila kuongeza “wanaume,” ambalo halitajwi wazi katika Kigiriki.
