  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: sw
  text: Akasema, “Wayahudi wamekubaliana kukuomba ili kesho umshushe Paulo mpaka Baraza Kuu[a], kana kwamba wangekwenda kuchunguza kwa usahihi zaidi jambo fulani kumhusu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sanhedrini.” Hili lilikuwa baraza la juu la Wayahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέθεντο
  choice: wamekubaliana
  rationale: Kitenzi hiki kinaonyesha kwamba walifikia makubaliano au walipanga pamoja; muktadha unaonyesha nia yao mbaya bila kulazimisha maana hiyo ndani ya neno lenyewe.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: kukuomba
  rationale: Katika muktadha huu ἐρωτάω ni kuomba jambo lifanywe, si kuuliza swali tu.
- source_word: καταγάγῃς
  choice: umshushe ... na kumpeleka
  rationale: Tafsiri hii inadumisha mwelekeo wa kushuka uliomo katika κατάγω na kueleza kwa Kiswahili cha kawaida kumpeleka Paulo kwenye baraza.
- source_word: συνέδριον
  choice: Baraza Kuu
  rationale: Hapa neno hilo linarejelea baraza la juu la utawala na mahakama la Wayahudi huko Yerusalemu, linalojulikana pia kama Sanhedrini.
- source_word: ὡς
  choice: wakijifanya kwamba
  rationale: Katika muktadha huu ὡς huonyesha kusudi la kujifanya au kisingizio, si kusudi lao halisi.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι
  choice: wanataka kuchunguza habari zake kwa usahihi zaidi
  rationale: πυνθάνομαι huonyesha kupata habari kwa kuuliza au kuchunguza, na ἀκριβέστερον huhifadhi wazo la kiwango kikubwa zaidi cha usahihi.
- source_word: Οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hii ni tafsiri ya moja kwa moja ya maandishi ya Kigiriki; muktadha unaonyesha kuwa ni wale Wayahudi waliohusika katika mpango huu, si Wayahudi wote.
theological_decisions:
- issue: Rejeo la “Wayahudi” katika simulizi lenye uhasama
  choice: Kudumisha “Wayahudi” kama tafsiri ya Οἱ Ἰουδαῖοι
  alternative: Viongozi wa Wayahudi
  rationale: Maandishi hayasemi wazi “viongozi.” Tafsiri haipaswi kufinya rejeo kuliko Kigiriki, ingawa muktadha unalizuia kwa kundi maalumu lililopanga njama dhidi ya Paulo.
- issue: Kisingizio cha uchunguzi zaidi
  choice: wakijifanya kwamba wanataka kuchunguza
  alternative: kana kwamba walikuwa wanaenda kuchunguza
  rationale: Muktadha wa njama na matumizi ya ὡς yanaonyesha kwamba uchunguzi uliodaiwa ulikuwa kisingizio, huku tafsiri ikiepuka kuongeza maelezo ya njama yenyewe ndani ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Baraza Kuu” ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi jina la kihistoria “Sanhedrini.”
