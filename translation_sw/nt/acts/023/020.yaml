  naturalness: Kiswahili ni cha kawaida na kina hadhi inayofaa. “Kana kwamba wangekwenda kuchunguza kwa usahihi zaidi jambo fulani kumhusu” ni cha asili na kinahifadhi nguvu ya comparative ya ἀκριβέστερον pamoja na τι (“jambo fulani”).
  terminology: “Wayahudi,” “Paulo,” na “Baraza Kuu” zinafaa. Tanbihi inayotaja “Sanhedrini” husaidia kutambulisha taasisi ya kihistoria bila kuilazimisha katika matini.
