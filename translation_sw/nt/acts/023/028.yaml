base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: sw
  text: Nikitaka kujua shtaka ambalo walikuwa wakimshtaki kwa sababu yake[a], nilimpeleka chini kwenye baraza lao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sanhedrini yao.” Neno la Kigiriki συνέδριον humaanisha baraza; katika muktadha huu huenda linamaanisha baraza kuu la utawala la Wayahudi huko Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: Nikitaka kujua
  rationale: Kishazi hiki kinaonyesha kusudi la Lisia kwa Kiswahili cha kawaida; “nikitaka” huhifadhi maana ya hiari au nia, na “kujua” huwasilisha lengo la kupata ufahamu wa shtaka.
- source_word: τὴν αἰτίαν δι’ ἣν
  choice: shtaka ... nalo
  rationale: Katika muktadha huu wa kisheria, αἰτία ni msingi au jambo la mashtaka, si sababu ya jumla tu. Muundo “shtaka ... nalo” ni wa asili katika Kiswahili.
- source_word: ἐνεκάλουν αὐτῷ
  choice: walilokuwa wakimshitaki
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha tendo lililokuwa likiendelea; “walilokuwa wakimshitaki” huhifadhi hali hiyo na maana ya kumfungulia mtu mashtaka.
- source_word: κατήγαγον
  choice: nilimpeleka chini
  rationale: Neno la Kigiriki linaeleza kumpeleka mtu kuelekea chini. Tafsiri hii huhifadhi maelezo hayo ya mahali bila kubainisha namna ya kuandamana naye ambayo maandishi hayasemi wazi.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: mbele ya baraza lao
  rationale: Katika muktadha huu, kupelekwa “kwenye baraza” kunamaanisha kufikishwa mbele ya baraza ili kusikilizwa. “Baraza lao” hutafsiri συνέδριον bila kulazimisha istilahi mahususi “Sanhedrini.”
