  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: sw
  text: Basi, yule mkuu wa jeshi akamshika mkono, akaenda naye kando faraghani, kisha akamuuliza, “Una jambo gani la kunieleza?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: akamshika mkono
  rationale: Kitenzi pamoja na nomino katika hali ya umilikishi humaanisha kuushika mkono wa mtu. Kauli hii ni ya kawaida katika Kiswahili na inadumisha tendo halisi bila kudokeza nguvu kupita kiasi.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi. “Basi” ni kiunganishi cha kawaida cha masimulizi katika Kiswahili na hakiongezi utofautishaji mkali.
- source_word: ὁ χιλίαρχος
  choice: yule mkuu wa jeshi
  rationale: χιλίαρχος ni afisa mkuu wa jeshi la Roma, kihalisi mkuu wa askari elfu. “Mkuu wa jeshi” inaeleweka kwa wasomaji wa kawaida na inafaa muktadha bila kutumia cheo kisichofahamika sana.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: akaenda naye kando faraghani
  rationale: ἀναχωρέω huonyesha kwenda au kujitenga, na κατ’ ἰδίαν huonyesha faragha. Ingawa Kigiriki hakina kiwakilishi wazi baada ya kitenzi hiki, muktadha unaonyesha kuwa mkuu aliondoka pamoja na huyo kijana; “naye” hufanya Kiswahili kiwe wazi na cha asili.
- source_word: ἐπυνθάνετο
  choice: kisha akamuuliza
  rationale: Hali ya wakati usiotimilika inaweza kuonyesha mwanzo au mwendelezo wa kuuliza. Katika Kiswahili, “akamuuliza” huwasilisha tendo hilo kwa kawaida; “kisha” hudumisha mfuatano wa simulizi bila kulazimisha tafsiri ya ‘akaanza kuuliza.’
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Una jambo gani la kunieleza?
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida maana ya ‘Ni nini ulicho nacho cha kuniarifu?’ ἀπαγγέλλω hapa ni kufikisha habari; “kunieleza” ni ya kawaida na inafaa mazungumzo ya moja kwa moja bila kuifanya iwe taarifa rasmi kupita kiasi.
