  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: sw
  text: Basi askari, kama walivyoamriwa, wakamchukua Paulo na kumpeleka Antipatri usiku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Basi askari
  rationale: Neno οὖν linaendeleza simulizi kwa kuonyesha matokeo au hatua inayofuata, huku μέν likitayarisha tofauti itakayofuata. “Basi” linaonyesha mwendelezo huo kwa Kiswahili cha kawaida bila kulazimisha kutafsiri μέν moja kwa moja.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: kama walivyoamriwa
  rationale: Kirai hiki kinaonyesha kwamba askari walitenda kulingana na agizo walilokuwa wamepewa. Tafsiri hii inahifadhi hali ya kutendwa ya kitenzi na ni ya asili kwa Kiswahili.
- source_word: ἀναλαβόντες
  choice: wakamchukua
  rationale: Kitenzi hiki ni tendo linalotangulia tendo kuu la kumpeleka. “Wakamchukua” ni wazi na cha asili katika usimulizi, bila kuongeza wazo lisilotajwa wazi la kumsindikiza.
- source_word: ἤγαγον
  choice: na kumpeleka
  rationale: ἄγω inaweza kumaanisha kuongoza, kuleta, au kupeleka. Kwa kuwa mahali walikokwenda pameainishwa, “kumpeleka” linafaa kwa mtazamo wa safari kutoka walikokuwa kuelekea Antipatri.
- source_word: διὰ νυκτός
  choice: usiku
  rationale: Kirai hiki humaanisha “wakati wa usiku” au “usiku.” “Usiku” ni kifupi na cha kawaida, na hakidai kwamba safari iliendelea usiku mzima.
- source_word: Ἀντιπατρίδα
  choice: Antipatri
  rationale: Jina la mahali limetoholewa kwa muundo unaofaa matamshi na matumizi ya Kiswahili.
theological_decisions: []
