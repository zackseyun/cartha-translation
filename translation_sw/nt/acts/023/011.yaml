  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: sw
  text: Lakini usiku uliofuata, Bwana akasimama kando yake na kusema, “Jipe moyo,[a] kwa maana kama vile ulivyotoa ushuhuda kunihusu huko Yerusalemu,[b] vivyo hivyo ni lazima utoe ushuhuda kunihusu pia huko Roma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uwe jasiri.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ulivyonishuhudia huko Yerusalemu.” Vitenzi vinavyoeleza yale Paulo aliyofanya na atakayofanya vinatokana na kundi lilelile la maneno ya Kigiriki linalohusu ushuhuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: Lakini usiku uliofuata
  rationale: ἐπιούσῃ νυκτί ni usiku uliofuata; δέ limetafsiriwa kwa kiunganishi chenye utofautishaji mdogo, “Lakini,” ili kuendeleza simulizi bila kusisitiza mno tofauti.
- source_word: ἐπιστὰς αὐτῷ
  choice: akasimama kando yake
  rationale: Usemi huu unaonyesha Bwana akija na kusimama karibu na Paulo. “Kando yake” huhifadhi maana ya uwepo wa karibu bila kuongeza wazo la “kumtokea” lisilosemwa wazi.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa κύριος. Muktadha unamtambulisha kama Yesu aliyefufuka, lakini jina “Yesu” halijaongezwa kwa kuwa halipo wazi katika mstari huu.
- source_word: Θάρσει
  choice: Jipe moyo
  rationale: Amri hii inamtaka Paulo awe na ujasiri. “Jipe moyo” ni Kiswahili cha kawaida, cha moja kwa moja, na kinachofaa kwa sauti ya kumtia nguvu.
- source_word: διεμαρτύρω
  choice: ulivyonishuhudia
  rationale: Kitenzi kina maana ya kutoa ushuhuda, wakati mwingine kwa msisitizo. “Ulivyonishuhudia” ni cha asili na kinaendeleza uhusiano wa kileksia na μαρτυρῆσαι bila kuongeza “kwa uzito” pasipo ulazima wa kimuktadha.
- source_word: τὰ περὶ ἐμοῦ
  choice: -ni- katika “ulivyonishuhudia”
  rationale: Kiswahili cha asili kinaweza kueleza “kutoa ushuhuda kunihusu” kwa kitenzi “kunishuhudia.” Hii inawasilisha habari zinazomhusu Yesu bila kufuata kwa ukakasi muundo wa Kigiriki neno kwa neno.
- source_word: εἰς Ἰερουσαλήμ
  choice: huko Yerusalemu
  rationale: Ingawa εἰς mara nyingi humaanisha “kwenda/kuingia,” hapa pamoja na jina la mji inaonyesha mahali ambapo ushuhuda uliotolewa; “huko Yerusalemu” ni ya asili katika Kiswahili.
- source_word: οὕτω
  choice: vivyo hivyo
  rationale: Neno hili linaonyesha ulinganifu kati ya ushuhuda wa Paulo huko Yerusalemu na ule atakaotoa huko Roma.
- source_word: σε δεῖ
  choice: ni lazima
  rationale: δεῖ inaonyesha ulazima, unaoeleweka katika Matendo kuwa ndani ya kusudi la Mungu. “Ni lazima” huhifadhi nguvu hiyo bila kuufafanua kuwa hatima isiyoepukika.
- source_word: καὶ εἰς Ῥώμην
  choice: pia huko Roma
  rationale: καί huongeza Roma kama mahali pengine pa ushuhuda; “pia huko Roma” ni mpangilio wa kawaida wa Kiswahili.
- source_word: μαρτυρῆσαι
  choice: unishuhudie
  rationale: “Unishuhudie” huhifadhi mzizi uleule wa “ushuhuda” uliotumiwa kwa διεμαρτύρω na kueleza kwa kawaida kutoa ushuhuda kumhusu Yesu.
theological_decisions:
- issue: Utambulisho wa ὁ κύριος
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Muktadha wa Matendo unaonyesha kuwa anayesema ni Yesu aliyefufuka, lakini Kigiriki kinasema tu “Bwana.” Tafsiri haiongezi jina “Yesu,” hivyo inadumisha maneno ya kifungu huku muktadha ukibaki kumtambulisha msemaji.
- issue: Nguvu ya δεῖ
  choice: ni lazima
  alternative: imekupasa / umekusudiwa
  rationale: “Ni lazima” huonyesha ulazima wa kiungu unaodokezwa na simulizi bila kuugeuza kuwa kauli pana zaidi kuhusu hatima au uteuzi.
- issue: Uhusiano wa διεμαρτύρω na μαρτυρῆσαι
  choice: ulivyonishuhudia … unishuhudie
  alternative: ulivyotoa ushuhuda kunihusu … utoe ushuhuda kunihusu
  rationale: Kutumia mzizi mmoja wa Kiswahili huhifadhi uhusiano wa maneno ya Kigiriki kuhusu ushuhuda, huku tofauti ndogo ya kiambishi δια- katika kitenzi cha kwanza isifanywe kuwa fundisho au msisitizo ambao muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Jipe moyo” na “akasimama kando yake” ni misemo ya sasa na ya asili; “Yerusalemu” na “Roma” yanafuata maumbo yaliyozoeleka katika Kiswahili cha Biblia.
