  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: sw
  text: Wale waliokuwa wamesimama karibu wakasema, “Je, unamtukana kuhani mkuu wa Mungu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Wale waliokuwa wamesimama karibu
  rationale: Kirai hiki cha kisifa chenye kibainishi kinawataja watu waliokuwapo karibu na Paulo; tafsiri hii huhifadhi maana ya kuwapo wamesimama karibu kwa Kiswahili cha kawaida.
- source_word: εἶπαν
  choice: wakasema
  rationale: Kitenzi cha wakati uliopita kinaendeleza simulizi; “wakasema” ni muundo wa kawaida wa kusimulia mfululizo wa matukio kwa Kiswahili.
- source_word: ἀρχιερέα
  choice: kuhani mkuu
  rationale: Katika muktadha huu neno hilo linamtaja kuhani mkuu wa Kiyahudi; “kuhani mkuu” ndilo neno sanifu na lililo wazi.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Muundo huu huhifadhi uhusiano unaoonyeshwa na hali ya umilikaji katika Kigiriki bila kudokeza zaidi ya cheo kinachotajwa.
- source_word: λοιδορεῖς
  choice: unamtukana
  rationale: Kitenzi hiki kina maana ya kumshambulia mtu kwa maneno, kumtukana, au kumsema kwa dharau. “Unamtukana” ni wazi, cha sasa, na kinafaa katika swali la kukemea.
theological_decisions:
- issue: Nguvu ya τοῦ θεοῦ inapomhusu kuhani mkuu
  choice: kuhani mkuu wa Mungu
  alternative: kuhani mkuu aliyewekwa na Mungu
  rationale: Tafsiri iliyochaguliwa inabainisha cheo katika uhusiano wake na Mungu, lakini haiongezi dai kwamba Mungu anaidhinisha mwenendo wa mtu huyo. Tafsiri mbadala ingeongeza wazo la kuwekwa ambalo halijasemwa wazi hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Swali limehifadhiwa kama swali la kukemea, bila kuongeza maneno ya maelezo.
