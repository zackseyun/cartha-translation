  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: sw
  text: Basi Paulo akamwita mmoja wa majemadari wa askari mia, akamwambia, “Mpeleke kijana huyu kwa kamanda, kwa maana ana jambo la kumweleza[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “la kumjulisha” au “la kumtolea taarifa.” Kitenzi cha Kigiriki kinaweza kumaanisha kueleza, kutangaza, au kutoa taarifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akamwita
  rationale: Kitenzi hiki kinaonyesha kwamba Paulo alimwita mtu aje kwake kabla ya kusema naye; “akamwita” ni cha kawaida na kinaendeleza simulizi kwa ufasaha.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi badala ya kuonyesha utofauti mkali; “Basi” linaunganisha tukio hili na yaliyotangulia.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: mmoja wa majemadari wa askari mia
  rationale: Neno ἑκατοντάρχης ni cheo cha kijeshi cha Kirumi cha mkuu wa kikosi cha takribani askari mia. Tafsiri hii ni wazi kwa msomaji wa kawaida na inadumisha maana ya kihistoria.
- source_word: ἔφη
  choice: akamwambia
  rationale: Ingawa maana ya msingi ni “akasema,” katika Kiswahili “akamwambia” ni ya asili zaidi kwa maneno yanayoelekezwa moja kwa moja kwa mtu aliyeitwa.
- source_word: νεανίαν
  choice: kijana
  rationale: νεανίας humaanisha mwanamume mwenye umri mdogo; “kijana” ni neno la kawaida, lenye heshima, na linalofaa muktadha.
- source_word: ἄπαγε
  choice: Mpeleke
  rationale: Amri hii inamaanisha kumwongoza au kumchukua mtu hadi kwa mwingine; “Mpeleke” ni amri ya asili na sahihi katika Kiswahili.
- source_word: πρὸς τὸν χιλίαρχον
  choice: kwa kamanda
  rationale: χιλίαρχος hapa ni mkuu wa kijeshi wa Kirumi anayejulikana tayari katika simulizi. “Kamanda” ni istilahi inayoeleweka kwa urahisi bila kutumia cheo cha kiufundi kisichofahamika sana.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: kwa maana ana jambo la kumweleza
  rationale: Muundo huu unaonyesha kwamba kijana ana taarifa ya kuwasilisha. “Ana jambo la kumweleza” ni Kiswahili cha asili na kinahifadhi upana wa ἀπαγγέλλω, ambalo linaweza kumaanisha kueleza, kutangaza, au kutoa taarifa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. “Majemadari wa askari mia” linafafanua cheo cha Kirumi, huku “kamanda” likimtaja mkuu wao kwa lugha inayofahamika kwa wasomaji wengi.
