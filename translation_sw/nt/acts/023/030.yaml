  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: sw
  text: Nilipojulishwa kwamba kungekuwa na njama dhidi ya mtu huyo, nilimtuma kwako mara moja. Pia niliwaagiza washtaki wake watoe mashtaka yao dhidi yake mbele yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kigiriki kinasema “waseme kwa/juu yake mbele yako”; katika muktadha wa mahakama, yaweza kutafsiriwa pia “waeleze hoja zao dhidi yake mbele yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: Nilipojulishwa
  rationale: Kauli ya kutendwa ya aoristi katika muundo wa genitive absolute inaelezwa kwa kishazi cha wakati; uchaguzi huu ni wa kawaida katika Kiswahili na unahifadhi maana ya kupokea taarifa.
- source_word: ἐπιβουλῆς
  choice: njama
  rationale: Neno hili humaanisha mpango wa siri wa kumdhuru mtu. “Njama” ni pana na haliongezi wazo maalumu la kuvizia ambalo nomino yenyewe hailazimishi.
- source_word: εἰς τὸν ἄνδρα
  choice: dhidi ya mtu huyo
  rationale: “Dhidi ya” huonyesha mwelekeo wa uadui, na “mtu huyo” humrejelea Paulo huku ikidumisha nomino ya Kigiriki badala ya kuibadili moja kwa moja kuwa kiwakilishi.
- source_word: ἔσεσθαι
  choice: kwamba kulikuwa na
  rationale: Infinitivi ya wakati ujao ni sehemu ya taarifa iliyotolewa. Katika muktadha wa simulizi la wakati uliopita, Kiswahili cha kawaida hutumia “kwamba kulikuwa na” kwa njama iliyotazamiwa kuwepo bila kulazimisha muundo usio wa kawaida.
- source_word: ἐξαυτῆς
  choice: mara moja
  rationale: Huwasilisha uwahi wa tendo kwa lugha ya sasa, ya kawaida na inayofaa barua rasmi.
- source_word: ἔπεμψα πρὸς σέ
  choice: nilimtuma kwako
  rationale: Yambwa “-m-” limejazwa kutokana na muktadha, ambapo anayerejelewa ni Paulo; Kiswahili hulihitaji ili sentensi iwe wazi na ya kawaida.
- source_word: παραγγείλας
  choice: Pia niliwaagiza
  rationale: Kitenzi hiki huonyesha agizo lililoambatana na kumtuma Paulo. Sentensi mpya fupi huwasilisha uhusiano huo kwa uwazi, huku “pia” ikihifadhi καί.
- source_word: κατηγόροις
  choice: washtaki wake
  rationale: Ni istilahi ya kawaida ya kisheria kwa wale wanaomshitaki mtu; “wake” huweka wazi kwamba ni washtaki wa Paulo.
- source_word: λέγειν πρὸς αὐτὸν
  choice: watoe mashtaka yao dhidi yake
  rationale: Kifungu hicho kihalisi ni “waseme kwa/dhidi yake,” lakini katika mazingira ya mahakama kinahusu kuwasilisha mashtaka. Tafsiri hii inafanya maana ya kimahakama iwe wazi bila kuamua zaidi ya muktadha.
- source_word: ἐπὶ σοῦ
  choice: mbele yako
  rationale: Katika mazingira ya kimahakama, kifungu hiki humaanisha kufika mbele ya mwenye mamlaka; “mbele yako” ni kifupi, rasmi, na cha kawaida.
