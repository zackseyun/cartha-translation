  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. Maneno “njama” na “chini ya laana” yanahifadhi uzito wa mpango na kiapo bila kutumia istilahi za kidhehebu.
