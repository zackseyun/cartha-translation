  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: sw
  text: Kulipopambazuka, Wayahudi[a] walifanya njama, wakajiweka chini ya laana[b], wakisema kwamba hawatakula wala kunywa mpaka watakapomuua Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Wayahudi.” Hapa neno hilo linamaanisha kundi fulani la Wayahudi waliohusika katika njama hii, si Wayahudi wote.'
    reason: cultural_note
  - marker: b
    text: Au “wakajitia chini ya laana.” Kauli hii inamaanisha kwamba waliapa wakijitakia hukumu wao wenyewe iwapo wangeshindwa kutimiza kiapo hicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Kulipopambazuka
  rationale: Kirai huru cha hali ya umilikaji kinaonyesha mpito wa wakati. “Kulipopambazuka” ni Kiswahili cha kawaida kinachoeleza kuingia kwa mchana bila tafsiri ngumu ya neno kwa neno.
- source_word: ποιήσαντες συστροφὴν
  choice: walifanya njama
  rationale: Muundo huu unaonyesha kupanga kwa pamoja kwa kusudi la siri. “Walifanya njama” unaafiki mpango wa kumuua Paulo, bila kudokeza ghasia za umati.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Maandishi ya Kigiriki yanasema wazi “Wayahudi.” Neno hilo limehifadhiwa katika matini, huku tanbihi ikifafanua kwamba muktadha unamaanisha kundi maalumu, si Wayahudi wote.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: wakajiweka chini ya laana
  rationale: Kitenzi kinaeleza kujitia chini ya laana kama uthibitisho wa kiapo. Tafsiri hii huhifadhi maana ya kujitakia hukumu iwapo hawangetimiza azimio lao.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: wakisema kwamba hawatakula wala kunywa
  rationale: Vitenzi vya hali ya kutenda vinaeleza yaliyomo katika kiapo. “Hawatakula wala kunywa” ni muundo wa kawaida unaohifadhi ukanushi wa mambo yote mawili.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: mpaka watakapomuua Paulo
  rationale: Kirai kinaonyesha kikomo cha azimio lao. Muundo wa “mpaka watakapomuua” ni wa asili katika Kiswahili na huonyesha tendo la baadaye lililotazamiwa kukamilisha kiapo.
