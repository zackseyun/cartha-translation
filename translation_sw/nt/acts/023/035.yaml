base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: sw
  text: “Nitaisikiliza kesi yako washtaki wako nao watakapofika,” akasema. Kisha akaamuru Paulo awekewe chini ya ulinzi katika makao rasmi ya Herode[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha makao rasmi au makao makuu ya gavana wa Roma; hapa yaelekea ni jumba la Herode huko Kaisaria lililotumiwa na gavana.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: Nitaisikiliza kesi yako
  rationale: Kitenzi διακούω katika muktadha huu wa kisheria humaanisha kumsikiliza mtu au shauri lake kwa utaratibu. Kiswahili ‘kuisikiliza kesi yako’ kinaonyesha wazi mazingira ya kimahakama bila kulazimisha wazo la ‘kikamilifu,’ ambalo linaweza kueleweka katika kitenzi lakini si lazima litajwe.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: washtaki wako nao watakapofika
  rationale: ὅταν pamoja na hali tegemezi huonyesha tukio la wakati ujao linalotarajiwa; ‘watakapofika’ ni ya asili. καί hapa ni ‘nao,’ na κατήγοροι ni washtaki katika muktadha wa kisheria.
- source_word: κελεύσας
  choice: Kisha akaamuru
  rationale: Kivumishi-jina cha wakati uliopita kinaendeleza simulizi kwa kuonyesha hatua iliyofuata; kukibadili kuwa kitenzi kamili ni Kiswahili cha asili.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: katika makao ya gavana ya Herode
  rationale: πραιτώριον hapa ni jengo au makao rasmi yaliyotumiwa na gavana wa Roma, katika jumba la Herode huko Kaisaria. ‘Makao ya gavana’ yanaeleweka kwa msomaji wa kawaida kuliko mkopo ‘praitório,’ huku tanbihi ikihifadhi maelezo ya kihistoria.
- source_word: φυλάσσεσθαι αὐτόν
  choice: kwamba Paulo alindwe
  rationale: Kauli tendwa φυλάσσεσθαι inaonyesha kuwekwa chini ya ulinzi. Kutaja Paulo badala ya kiwakilishi kunaondoa utata unaoweza kutokea katika Kiswahili bila kubadili mhusika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Nitaisikiliza kesi yako’ ni wa asili na unahifadhi maana ya kimahakama; ‘alindwe’ haiongezi dhana ya adhabu ambayo haipo wazi katika maandishi.
