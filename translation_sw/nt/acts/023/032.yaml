translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Kiwakilishi “wao” kimetumiwa kuifanya tofauti kati ya wapanda farasi walioendelea na wale waliorudi iwe wazi bila kuwataja wale waliorudi kwa namna ambayo Kigiriki hakufanyi.
