  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: sw
  text: Siku iliyofuata, waliwaacha askari wapanda farasi waendelee kwenda pamoja naye, nao wakarudi kwenye makao ya kijeshi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye kambi ya jeshi.” Neno la Kigiriki linaweza kumaanisha kambi au makao ya kijeshi; katika muktadha huu huenda linarejelea makao ya kijeshi ya Waroma huko Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Lakini siku iliyofuata
  rationale: Kirai hiki humaanisha siku inayofuata. “Lakini” linawakilisha δέ kama kiunganishi chepesi cha simulizi bila kutia mkazo mkubwa wa upinzani.
- source_word: ἐάσαντες
  choice: waliwaacha
  rationale: Kitenzi hiki hapa kina maana ya kuwaruhusu waendelee; muundo huu wa Kiswahili unaonyesha kwamba tendo hilo lilitangulia kurudi kwao.
- source_word: τοὺς ἱππεῖς
  choice: askari wapanda farasi
  rationale: Hili linaeleza wazi kwa msomaji wa sasa kwamba walikuwa wanajeshi waliopanda farasi, bila kutumia istilahi ya kijeshi isiyo ya kawaida.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: waendelee pamoja naye
  rationale: Katika muktadha wa msafara, wapanda farasi waliendelea na safari wakimsindikiza Paulo huku wengine wakirudi.
- source_word: ὑπέστρεψαν
  choice: wakarudi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya tendo la kurudi walikotoka.
- source_word: εἰς τὴν παρεμβολήν
  choice: kwenye makao ya wanajeshi
  rationale: Neno la Kigiriki linaweza kutaja kambi au makao ya kijeshi. Katika muktadha huu linaelekea kurejelea makao ya jeshi la Roma katika ngome ya Yerusalemu.
