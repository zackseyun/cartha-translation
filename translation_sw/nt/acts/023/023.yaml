  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: sw
  text: Kisha akawaita maakida wawili, akawaambia, “Andaeni askari mia mbili, wapanda farasi sabini, na askari wenye mikuki mia mbili[a], ili waende mpaka Kaisaria kuanzia saa ya tatu ya usiku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walinzi wa upande wa kulia”; maana kamili ya neno hili adimu linalotafsiriwa “askari wenye mikuki” haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Yaani, yapata saa tatu usiku (21:00), saa tatu hivi baada ya kuanza kwa usiku kwa hesabu ya Kiyahudi.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: akawaita
  rationale: Kitenzi hiki kinaonyesha kuwaita watu waje mbele yake; “akawaita” ni cha kawaida na kinadumisha mtiririko wa simulizi.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: maakida wawili
  rationale: “Akida” ni cheo cha kijeshi cha Kirumi cha mkuu wa takriban askari mia moja; τινας δύο kwa kawaida hutafsiriwa kwa urahisi kuwa “wawili.”
- source_word: Ἑτοιμάσατε
  choice: Andaeni
  rationale: Amri ya wingi inayowaelekea maakida wawili; ni ya moja kwa moja na inafaa katika mazingira ya kijeshi.
- source_word: στρατιώτας διακοσίους
  choice: askari mia mbili
  rationale: Tafsiri ya moja kwa moja ya kundi la kwanza la wanajeshi.
- source_word: ὅπως πορευθῶσιν
  choice: ili waende
  rationale: “Ili” inadumisha maana ya kusudi iliyo katika ὅπως pamoja na hali tegemezi.
- source_word: ἕως Καισαρείας
  choice: mpaka Kaisaria
  rationale: “Mpaka” huhifadhi wazo la mwendo unaofikia mahali palipotajwa.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: wapanda farasi sabini
  rationale: Ni lugha wazi ya Kiswahili kwa wanajeshi waliopanda farasi.
- source_word: δεξιολάβους διακοσίους
  choice: askari wenye mikuki mia mbili
  rationale: Neno hili la Kigiriki ni adimu na maana yake kamili haijulikani kwa hakika. “Askari wenye mikuki” linafaa kwa muktadha wa kijeshi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: kuanzia saa ya tatu ya usiku
  rationale: “Kuanzia” huonyesha wakati wa kuondoka uliowekwa na ἀπό, na “saa ya tatu ya usiku” huhifadhi mfumo wa kale wa kuhesabu wakati.
theological_decisions: []
