  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Maakida” huhifadhi cheo cha kijeshi cha Kirumi, huku muundo wa amri ukiwa wa kawaida na unaoeleweka. Tanbihi zimewekwa kwenye maneno husika ili kutatua hitilafu ya mahali pa viashirio katika safu ya mashauriano ya Kiingereza.
