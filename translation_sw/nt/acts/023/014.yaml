  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: sw
  text: Watu hao waliwaendea wakuu wa makuhani na wazee, wakasema, “Tumejiweka chini ya laana[a] kwamba hatutaonja kitu chochote mpaka tumwue Paulo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wamejifunga kwa kiapo cha kujitakia laana ikiwa hawatatimiza walichoapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Watu hao
  rationale: Kiwakilishi hiki kinawarejelea wale waliopanga njama katika mstari uliotangulia; kutaja “Watu hao” kunafanya rejeo liwe wazi na la kawaida kwa Kiswahili.
- source_word: προσελθόντες
  choice: waliwaendea
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kusema; “waliwaendea” linafaa katika simulizi na linaonyesha kuwa waliwakaribia kwa kusudi.
- source_word: ἀρχιερεῦσιν
  choice: viongozi wa makuhani
  rationale: Katika muktadha huu wingi unahusu kundi la viongozi wa ukuhani wa Kiyahudi, si madai kwamba kulikuwa na makuhani wakuu wengi wenye cheo kilekile.
- source_word: πρεσβυτέροις
  choice: wazee
  rationale: Hapa neno linamaanisha viongozi waliotambuliwa katika jamii, si wanaume wenye umri mkubwa tu.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: Tumejiweka chini ya laana
  rationale: Muundo wa nomino na kitenzi vyenye mzizi mmoja unasisitiza kiapo cha kujilaani. Tafsiri hii inahifadhi uzito wake bila kutumia istilahi ya baadaye ya kikanisa.
- source_word: μηδενὸς γεύσασθαι
  choice: hatutaonja kitu chochote
  rationale: “Kuonja” linafuata maana ya msingi ya γεύομαι na katika muktadha linaonyesha kujizuia kabisa kula au kutumia chakula.
- source_word: ἕως οὗ
  choice: mpaka
  rationale: Kiunganishi hiki kinaweka kikomo cha muda cha kiapo chao.
- source_word: ἀποκτείνωμεν
  choice: tumwue
  rationale: Hili linatoa moja kwa moja tendo walilokusudia bila kuongeza tathmini ya kisheria iliyomo katika neno “kuua kwa jinai.”
- source_word: τὸν Παῦλον
  choice: Paulo
  rationale: Hili ndilo umbo la kawaida la jina Παῦλος katika Biblia ya Kiswahili.
theological_decisions:
- issue: Tafsiri ya kiapo Ἀναθέματι ἀνεθεματίσαμεν ἑαυτούς
  choice: Tumejiweka chini ya laana
  alternative: Tumejifunga kwa kiapo kizito
  rationale: Chaguo kuu linaonyesha wazi kwamba kilikuwa kiapo cha kujitakia laana endapo wangekivunja, huku likiepuka kuingiza maana ya baadaye ya kikanisa ya “anathema.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Maandiko. “Waliwaendea” na “hatutaonja kitu chochote” ni miundo inayoeleweka kwa wasomaji wa kawaida, huku “chini ya laana” ikihifadhi uzito wa kiapo cha kujilaani.
