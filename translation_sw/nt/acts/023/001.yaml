  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: sw
  text: Paulo akaliangalia baraza kwa makini, akasema, “Ndugu, nimeishi[a] mbele za Mungu kwa dhamiri njema kabisa mpaka leo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimejiendesha kama raia mbele za Mungu,” ikihifadhi kivuli cha maana ya uraia cha kitenzi cha Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: akawakazia macho
  rationale: Kitenzi hiki huonyesha kutazama kwa makini na kwa kuendelea; usemi huu ni wa kawaida katika Kiswahili na unahifadhi nguvu ya tendo.
- source_word: δὲ
  choice: aka-
  rationale: Kiunganishi hiki ni cha mpito hafifu katika simulizi; mfuatano wa vitenzi wenye kiambishi aka- unaendeleza simulizi kwa kawaida katika Kiswahili.
- source_word: τῷ συνεδρίῳ
  choice: wajumbe wa baraza
  rationale: Katika muktadha huu neno linarejelea baraza la utawala la Wayahudi. Kutaja wajumbe huepusha wazo lisilo la kawaida la kukazia macho taasisi yenyewe, huku ‘baraza’ likitafsiri nomino ya kawaida bila kulazimisha jina la mkopo ‘Sanhedrini’.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ndugu zangu
  rationale: Huu ni mtindo wa moja kwa moja wa kuwaita wanaume wenzake. ‘Ndugu zangu’ ni wa asili na wenye heshima katika Kiswahili bila kurudia kihalisi ‘wanaume, ndugu’.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: kwa dhamiri njema kabisa
  rationale: Kirai hiki huonyesha namna ya kuishi, na πάσῃ hutilia mkazo ukamilifu wa dai; ‘kabisa’ huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: πεπολίτευμαι
  choice: nimeishi
  rationale: Katika muktadha huu kitenzi kinamaanisha mwenendo wa maisha, ingawa kinaweza kuwa na kivuli cha maana ya uraia. Wakati timilifu wa Kiswahili unaonyesha maisha ya wakati uliopita yanayotazamwa hadi sasa bila kuongeza maneno yasiyo wazi katika Kigiriki.
- source_word: τῷ θεῷ
  choice: mbele za Mungu
  rationale: Hueleza maisha yanayoendeshwa katika uhusiano na Mungu na chini ya uangalizi wake; huu ni usemi wa kawaida wa Kiswahili unaofaa pia muktadha wa dhamiri.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: mpaka leo
  rationale: Usemi huu unaonyesha mwendelezo kutoka zamani hadi siku ya kusema; ‘mpaka leo’ ni mfupi, wazi, na wa asili.
theological_decisions:
- issue: Maana ya maelezo ya Paulo kwa kutumia πεπολίτευμαι
  choice: Dai la jumla kuhusu mwenendo wa maisha yake mbele za Mungu, si dai la kiufundi kuhusu hadhi ya uraia wala la kutokuwa na dhambi kabisa.
  alternative: ‘Nimejiendesha kama raia mbele za Mungu,’ likihifadhi wazi zaidi kivuli cha maana ya kiraia.
  rationale: πολιτεύομαι inaweza kuwa na maana ya kiraia, lakini hapa hoja kuu ni mwenendo wake wa kimaadili mbele za Mungu kwa dhamiri njema. Tafsiri haiongezi picha ya kisiasa wala kugeuza ‘dhamiri njema’ kuwa dai la ukamilifu usio na dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetumia ‘aka-’ kwa mtiririko wa asili; usemi ‘wajumbe wa baraza’ umechaguliwa ili tendo la kukazia macho lielekezwe kwa watu wanaounda baraza.
