id: ACT.23.21
reference: Acts 23:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: sw
  text: Kwa hiyo, usikubali kushawishiwa nao, kwa maana watu zaidi ya arobaini kutoka miongoni mwao wanamvizia. Wamejiweka chini ya laana[a] kwamba hawatakula wala kunywa mpaka watakapomuua. Sasa wako tayari, wakingojea ahadi yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamejifunga kwa kiapo”; usemi wa Kigiriki unajumuisha wazo la kujitakia laana ikiwa watashindwa kutimiza kiapo hicho.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wanangojea ukubali ombi lao au utoe idhini yako.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: ukubali kushawishiwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na maana ya kukubali ushawishi wao, kwa Kiswahili cha kawaida.
- source_word: ἐνεδρεύουσιν
  choice: wanamvizia
  rationale: Hutoa picha halisi ya kusubiri kwa siri ili kumshambulia, badala ya maana pana ya kupanga njama.
- source_word: ἐξ αὐτῶν
  choice: kutoka miongoni mwao
  rationale: Inaonyesha wazi kwamba watu hao wanatoka katika kundi lililotajwa.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: watu zaidi ya arobaini
  rationale: Ni usemi wa asili katika Kiswahili unaohifadhi idadi na wazo la kuzidi arobaini.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: wamejiweka chini ya laana
  rationale: Huhifadhi wazo la kiapo chenye laana ambayo wangekuwa wamejiletea wenyewe wakishindwa kutimiza kusudi lao.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: hawatakula wala kunywa
  rationale: Huhifadhi muundo hasi wenye jozi na huwasilisha kwa kawaida azimio lao la wakati ujao.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: mpaka watakapomuua
  rationale: ἀναιρέω katika muktadha huu humaanisha kumuua; tafsiri hii inaweka wazi kusudi lao la kutumia nguvu.
- source_word: εἰσιν ἕτοιμοι
  choice: wako tayari
  rationale: Ni tafsiri ya moja kwa moja, fupi, na ya kawaida.
- source_word: προσδεχόμενοι
  choice: wakingojea
  rationale: Huonyesha kusubiri kwa matarajio na kuunganika kwa kawaida na kitu kinachongojewa.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: ahadi yako
  rationale: Huhifadhi maana ya msingi ya ἐπαγγελία, huku tanbihi ikifafanua kwamba katika muktadha huu ni kukubali au kutoa idhini.
