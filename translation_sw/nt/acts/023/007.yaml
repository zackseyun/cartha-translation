base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: sw
  text: Alipokuwa akisema hayo, mabishano yakazuka kati ya Mafarisayo na Masadukayo, na mkutano ukagawanyika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Alipokuwa akisema hayo
  rationale: Muundo huu wa Kigiriki unaonyesha tendo lililokuwa likiendelea wakati jambo lililofuata lilipotokea. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya wakati mmoja.
- source_word: ἐγένετο
  choice: kukazuka
  rationale: Pamoja na στάσις, kitenzi hiki kinaonyesha mwanzo wa ghafula wa mabishano; “kukazuka” ni simulizi la asili katika Kiswahili.
- source_word: στάσις
  choice: mabishano
  rationale: Katika muktadha huu neno linamaanisha ugomvi au mfarakano uliojitokeza kwa hoja. “Mabishano” linaeleweka kwa urahisi bila kudhoofisha mvutano.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: kati ya Mafarisayo na Masadukayo
  rationale: Ingawa Kigiriki kina muundo wa umilikishi, “kati ya” huonyesha kwa kawaida na kwa wazi makundi mawili yaliyokuwa yakipingana.
- source_word: ἐσχίσθη
  choice: ukagawanyika
  rationale: Hii ni kauli tendwa ya kitenzi chenye maana halisi ya kupasua; katika muktadha wa kijamii, “ukagawanyika” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: τὸ πλῆθος
  choice: mkutano
  rationale: Neno linarejelea kundi lililokusanyika katika kikao hiki, si umati wa kawaida tu. “Mkutano” linaonyesha kusanyiko hilo rasmi kwa lugha inayoeleweka.
