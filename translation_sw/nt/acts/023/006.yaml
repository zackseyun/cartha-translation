id: ACT.23.6
reference: Acts 23:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: sw
  text: Lakini Paulo, akijua kwamba sehemu moja iliundwa na Masadukayo na nyingine na Mafarisayo, alipaza sauti katika baraza[a], “Ndugu zangu, mimi ni Farisayo, mwana wa Mafarisayo[b]. Ninahukumiwa kwa habari ya tumaini na ufufuo wa wafu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Baraza Kuu la Wayahudi.” Neno la Kigiriki linaweza kumaanisha hasa baraza hilo la utawala.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwana wa wazazi waliokuwa Mafarisayo” au “mzao wa Mafarisayo.”
    reason: alternative_reading
  - marker: c
    text: Au, “Ninahukumiwa kwa sababu ya tumaini la ufufuo wa wafu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: akijua
  rationale: Kitenzi kishirikishi hiki kinaonyesha hali iliyosababisha Paulo kusema; “akijua” ni fupi, ya asili, na inadumisha uhusiano huo.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: sehemu moja ... nyingine
  rationale: “Sehemu” inadumisha taswira ya mgawanyiko ndani ya mkutano bila kuifanya kuwa madhehebu mawili rasmi.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: Masadukayo / Mafarisayo
  rationale: Haya ndiyo majina ya kawaida ya Kiswahili kwa makundi hayo ya Kiyahudi.
- source_word: ἔκραζεν
  choice: alipaza sauti
  rationale: Usemi huu unaonyesha kwamba Paulo alisema kwa sauti kubwa mbele ya mkutano, bila kutumia lugha ya mazungumzo mno.
- source_word: ἐν τῷ συνεδρίῳ
  choice: katika baraza
  rationale: “Baraza” ni tafsiri wazi ya συνέδριον; maana maalumu ya Baraza Kuu la Wayahudi imeelezwa katika tanbihi.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ndugu zangu
  rationale: Huu ni mwito wa kawaida na wenye heshima kwa hadhira katika Kiswahili; katika muktadha huu unaelekezwa kwa wanaume wa baraza bila kutumia usemi usio wa asili kama “wanaume ndugu.”
- source_word: Φαρισαῖός εἰμι
  choice: mimi ni Farisayo
  rationale: Inadumisha kujitambulisha kwa Paulo katika wakati wa sasa na msisitizo wa kiwakilishi ἐγώ.
- source_word: υἱὸς Φαρισαίων
  choice: mwana wa Mafarisayo
  rationale: Inadumisha tamathali ya kifamilia na wingi wa Φαρισαίων bila kuamua ikiwa Paulo anamaanisha wazazi wake au ukoo mpana.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: kwa habari ya tumaini na ufufuo wa wafu
  rationale: Inadumisha uratibu wa “tumaini” na “ufufuo” kwa καί, huku uwezekano wa kuelewa tumaini kuwa tumaini la ufufuo ukibaki katika tanbihi.
- source_word: κρίνομαι
  choice: Ninahukumiwa
  rationale: Wakati wa sasa na kauli tendwa vinaonyesha kwamba Paulo yumo katika mchakato wa kuhukumiwa wakati huo.
theological_decisions:
- issue: Maana ya dai la Paulo υἱὸς Φαρισαίων
  choice: mwana wa Mafarisayo
  alternative: mwana wa wazazi waliokuwa Mafarisayo; mzao wa Mafarisayo
  rationale: Wingi wa Kigiriki unaweza kuonyesha wazazi au ukoo mpana. Tafsiri kuu inadumisha nahau ya kifamilia bila kuweka dai finyu zaidi kuliko maandishi.
- issue: Uhusiano kati ya “tumaini” na “ufufuo” katika utetezi wa Paulo
  choice: tumaini na ufufuo wa wafu
  alternative: tumaini la ufufuo wa wafu
  rationale: Kigiriki kinaunganisha ἐλπίδος na ἀναστάσεως kwa καί. Tafsiri kuu inadumisha vipengele vilivyounganishwa, na tanbihi inaonyesha uwezekano kwamba ni tumaini moja linalolenga ufufuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa Kigiriki umedumishwa pale unapobeba utata muhimu, lakini sentensi imefanywa ya asili kwa Kiswahili.
