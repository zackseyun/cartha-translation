  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: sw
  text: Niligundua kwamba alikuwa anashtakiwa kuhusu masuala ya sheria yao[a], lakini hakukuwa na shtaka lolote dhidi yake ambalo lingestahili adhabu ya kifo au kifungo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhusu mambo yenye ubishi katika sheria yao.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kifo au minyororo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαλούμενον
  choice: alikuwa anashtakiwa
  rationale: Kauli tendwa ya kitenzi hiki inaonyesha kwamba mashtaka yalikuwa yakiletwa dhidi yake; tafsiri hii ni ya kawaida katika Kiswahili cha kisheria na haiashirii kwamba tayari alikuwa amepatikana na hatia.
- source_word: περὶ ζητημάτων
  choice: kuhusu masuala
  rationale: ζητήματα inaweza kumaanisha maswali, masuala yanayojadiliwa, au mambo yenye ubishi. “Masuala” ni ya asili na huhifadhi upana huo bila kusisitiza ubishi kupita kiasi.
- source_word: τοῦ νόμου αὐτῶν
  choice: ya sheria yao
  rationale: Huhifadhi mtazamo wa afisa Mroma na kiwakilishi αὐτῶν, huku ikionyesha kwamba masuala hayo yalihusu sheria ya Wayahudi.
- source_word: εὗρον
  choice: Niligundua
  rationale: Katika muktadha huu kitenzi kinaeleza hitimisho la kamanda baada ya uchunguzi; “niligundua” ni cha asili na kinafaa.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: jambo lolote lililostahili adhabu ya kifo au kufungwa
  rationale: ἄξιον huonyesha kile kinachostahili adhabu, na δεσμά kihalisi ni vifungo au minyororo lakini hapa huwakilisha kifungo cha gerezani. Tafsiri hii inaeleza maana ya kisheria kwa Kiswahili cha sasa.
- source_word: ἔχοντα ἔγκλημα
  choice: hakushtakiwa kwa jambo lolote
  rationale: Muundo wa Kigiriki uliofinyangwa una maana ya kuwa na shtaka dhidi yake. Usemi huu huhifadhi wazo la shtaka bila kudai kwamba alikuwa na hatia.
