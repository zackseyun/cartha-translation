  text: He wrote a letter having this form:[a]
translation:
  language: sw
  text: Akaandika barua yenye maneno haya:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa Kiswahili cha kimazungumzo zaidi, “Akaandika barua kama ifuatavyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψας
  choice: Akaandika
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaendeleza simulizi kwa kurejelea mhusika wa mstari uliotangulia; Kiswahili cha kawaida hukieleza kwa kitenzi kamili bila kupoteza mfuatano wa tendo.
- source_word: ἐπιστολήν
  choice: barua
  rationale: Neno hili humaanisha ujumbe ulioandikwa; “barua” ni la kawaida, wazi, na linafaa katika simulizi hili.
- source_word: ἔχουσαν
  choice: yenye
  rationale: Kivumishi hiki kinachoielezea barua kinaweza kutafsiriwa kwa kawaida kuwa “yenye,” huku kikihifadhi wazo la kuwa na sifa inayotajwa.
- source_word: τύπον
  choice: muundo
  rationale: Hapa τύπος huelekea kumaanisha namna, muundo, au maneno ya barua. “Muundo” ni tafsiri ya karibu ambayo haibani maana kuwa maudhui au maneno pekee.
- source_word: τοῦτον
  choice: huu
  rationale: Kionyeshi hiki kinaelekeza mbele kwenye barua inayofuata; “huu” kinakubaliana na ngeli ya “muundo” na kuhifadhi uelekezaji huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri kuu inafuata kwa karibu muundo wa Kigiriki, huku tanbihi ikitoa usemi wa kawaida zaidi.
