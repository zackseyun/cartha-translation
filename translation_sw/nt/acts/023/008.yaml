  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: sw
  text: Kwa maana Masadukayo husema kwamba hakuna ufufuo, wala malaika wala roho; lakini Mafarisayo hukiri mambo hayo yote mawili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mafarisayo hukiri yote matatu”—yaani, ufufuo, malaika, na roho. Kigiriki kinasema “yote mawili,” jambo ambalo kwa kawaida zaidi hurejelea “malaika” na “roho”; lakini wengine hulielewa kwa maana pana kutokana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: Masadukayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili la Kiyahudi.
- source_word: μὲν γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa sentensi hii inatoa maelezo ya sababu ya yaliyotangulia.
- source_word: λέγουσιν
  choice: husema
  rationale: Wakati wa mazoea unaonyesha msimamo wao wa kawaida wa kimafundisho.
- source_word: μὴ εἶναι
  choice: kwamba hakuna
  rationale: Ni Kiswahili cha kawaida kinachoeleza kukana kuwapo kwa mambo yanayotajwa.
- source_word: ἀνάστασιν
  choice: ufufuo
  rationale: Neno hili linaeleza ufufuo kama jambo au uhalisi, si lazima tukio moja pekee.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: wala malaika wala roho
  rationale: Huhifadhi ukanushaji wa vipengele viwili na umoja wa nomino za Kigiriki.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili la Kiyahudi.
- source_word: ὁμολογοῦσιν
  choice: hukiri
  rationale: Katika muktadha huu humaanisha kukubali au kuthibitisha kuwa jambo ni kweli, si lazima kuungama kosa.
- source_word: τὰ ἀμφότερα
  choice: mambo hayo yote mawili
  rationale: Huhifadhi maana halisi ya 'yote mawili' na kwa kawaida hurejelea jozi iliyotajwa mara moja kabla yake, yaani malaika na roho.
theological_decisions:
- issue: Mawanda ya maneno τὰ ἀμφότερα ('yote mawili') katika kile ambacho Mafarisayo wanakiri
  choice: Mafarisayo wanakiri mambo yote mawili, yaani malaika na roho.
  alternative: 'Mafarisayo wanakiri yote matatu: ufufuo, malaika, na roho.'
  rationale: Kigiriki kinasema 'yote mawili,' si 'yote' au 'matatu.' Rejeo la moja kwa moja zaidi ni jozi ya 'malaika' na 'roho.' Hata hivyo, muktadha unahusisha pia ufufuo, hivyo uelewa mpana umehifadhiwa katika tanbihi badala ya kuingizwa kimya kimya katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi inayofaa matini ya Biblia. Alama ya nukta mkato imetumiwa kutenganisha kwa uwazi msimamo wa Masadukayo na ule wa Mafarisayo. Tanbihi imewekwa baada ya 'mambo hayo yote mawili,' mahali ambapo utata unaohusika unatokea moja kwa moja.
