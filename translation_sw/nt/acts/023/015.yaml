  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Baraza’ limeandikwa kwa herufi kubwa kwa kuwa hapa linarejelea chombo maalumu kinachojulikana katika simulizi. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya maandishi.
