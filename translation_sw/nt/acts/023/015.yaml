  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: sw
  text: Kwa hiyo sasa, ninyi pamoja na Baraza, mjulisheni mkuu wa jeshi ili amlete chini kwenu[a], mkijifanya kwamba mnataka kuchunguza kwa makini zaidi mambo yanayomhusu[b]. Lakini sisi tuko tayari kumuua kabla hajakaribia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amlete mbele yenu.” Kitenzi cha Kigiriki kinajumuisha kihalisi wazo la kumleta chini.
    reason: lexical_alternative
  - marker: b
    text: Au, “kana kwamba mnakusudia kuchunguza kesi yake kwa makini zaidi.” Maneno haya yanaonyesha kujifanya kwamba kungekuwa na uchunguzi zaidi wa kisheria.
    reason: lexical_alternative
  - marker: c
    text: Au, “kabla hajafika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: mjulishe
  rationale: Kitenzi hiki katika muktadha huu kinamaanisha kumfahamisha mwenye mamlaka. ‘Mjulishe’ ni cha asili na hakibainishi kupita kiasi kwamba ilikuwa ombi, ingawa kusudi la taarifa hiyo linafuata.
- source_word: χιλιάρχῳ
  choice: mkuu wa jeshi
  rationale: Neno hili humtaja afisa wa Kirumi aliyekuwa kamanda wa kikosi. ‘Mkuu wa jeshi’ linaeleweka kwa wasomaji wa kawaida bila kutumia cheo cha kiufundi kisichozoeleka.
- source_word: σὺν τῷ συνεδρίῳ
  choice: pamoja na Baraza
  rationale: σύν huonyesha ushirika, na συνέδριον hapa ni baraza la utawala la Wayahudi. ‘Baraza’ linabaki karibu na maana ya Kigiriki bila kuingiza jina la kiufundi ‘Sanhedrini’.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: amlete chini kwenu
  rationale: κατάγω ina wazo la kuleta au kuongoza chini. Tafsiri hii huhifadhi mwelekeo wa mwendo ulio katika Kigiriki; ‘amlete mbele yenu’ limetolewa kama mbadala wa kimuktadha katika tanbihi.
- source_word: ὡς μέλλοντας
  choice: mkijifanya kwamba mnataka
  rationale: ὡς pamoja na participio huwasilisha nia inayodaiwa au kujifanya. Kauli hii inaonyesha hila iliyomo katika muktadha bila kuongeza maelezo ya hukumu.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: kuchunguza kwa makini zaidi
  rationale: διαγινώσκω hapa ina maana ya kuchunguza au kuamua baada ya uchunguzi, huku ἀκριβέστερον ikionyesha kiwango cha juu zaidi cha umakini au usahihi. Kauli hii ni ya asili katika Kiswahili na inafaa muktadha wa kisheria.
- source_word: τὰ περὶ αὐτοῦ
  choice: mambo yanayomhusu
  rationale: Hii huhifadhi upana wa msemo wa Kigiriki bila kuufanya moja kwa moja kuwa ‘kesi yake,’ ambalo ni fasiri ya kimuktadha iliyo finyu zaidi.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτόν
  choice: kabla hajakaribia
  rationale: Muundo huu huonyesha wakati uliotangulia, na ἐγγίζω humaanisha kukaribia. ‘Kabla hajakaribia’ huhifadhi wazo la umbali badala ya kuligeuza tu kuwa kuwasili.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: kumuua
  rationale: ἀναιρέω katika muktadha huu humaanisha kuua. ‘Kumuua’ ni wazi na haliongezi hukumu ya kimaadili iliyo nje ya kitenzi chenyewe.
