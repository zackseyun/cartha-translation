  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: sw
  text: Baada ya kuisoma barua hiyo, aliuliza Paulo alitoka jimbo gani. Alipopata habari kwamba alitoka Kilikia,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Baada ya kuisoma barua hiyo
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia. 'Barua hiyo' imetolewa na muktadha ili Kiswahili kiwe wazi na cha kawaida.
- source_word: δὲ καὶ
  choice: —
  rationale: Viunganishi hivi vina kazi nyepesi ya kuendeleza simulizi na kuratibu matendo; mtiririko wa sentensi ya Kiswahili unawasilisha kazi hiyo bila tafsiri ya moja kwa moja.
- source_word: ἐπερωτήσας
  choice: aliuliza
  rationale: Huwakilisha swali la moja kwa moja kwa lugha ya kawaida na yenye heshima.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: Paulo alikuwa ametoka jimbo gani
  rationale: '''Jimbo'' hapa ni eneo la utawala wa Roma. Jina ''Paulo'' linawekwa wazi kutokana na muktadha ili kuepuka utata wa viwakilishi katika Kiswahili.'
- source_word: πυθόμενος
  choice: Alipopata habari
  rationale: Hutoa maana ya kupata au kujua taarifa baada ya kuuliza, huku ikidumisha mfuatano wa matendo.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: kwamba alikuwa ametoka Kilikia
  rationale: ἀπό pamoja na jina la mahali huonyesha asili au mahali mtu alikotoka.
- source_word: Κιλικίας
  choice: Kilikia
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la jimbo hilo la Roma.
