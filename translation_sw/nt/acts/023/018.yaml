  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: sw
  text: Basi yule askari akamchukua kijana huyo, akampeleka kwa kamanda[a], akasema, “Mfungwa Paulo aliniita na kuniomba nimlete kijana huyu kwako, kwa kuwa ana jambo la kukuambia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki χιλίαρχος, afisa wa kijeshi wa Roma; kwa desturi, “tribuni.”
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: akamchukua kijana huyo
  rationale: Kirai hiki kinaonyesha askari akimchukua kijana ili amsindikize; kutaja ‘kijana huyo’ badala ya kiwakilishi pekee kunaleta uwazi wa kawaida katika Kiswahili.
- source_word: ἤγαγεν πρὸς τὸν χιλίαρχον
  choice: akampeleka kwa mkuu wa jeshi
  rationale: ἄγω hapa ni kumpeleka mtu kwa afisa, na χιλίαρχος ni afisa mkuu wa jeshi la Roma; ‘mkuu wa jeshi’ ni wazi na inaepuka istilahi ngeni.
- source_word: φησίν
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati uliopita wa masimulizi unasikika kwa kawaida katika Kiswahili.
- source_word: Ὁ δέσμιος Παῦλος
  choice: Mfungwa Paulo
  rationale: δέσμιος humaanisha mtu aliye chini ya kifungo au ulinzi; ‘mfungwa’ ni tafsiri fupi na wazi.
- source_word: προσκαλεσάμενός με
  choice: aliniita
  rationale: Kitenzi kinaonyesha Paulo alimwita askari aje kwake; muktadha tayari unaweka wazi mwelekeo huo, hivyo ‘aliniita’ ni ya asili.
- source_word: ἠρώτησεν
  choice: kuniomba
  rationale: Katika muktadha huu ἐρωτάω ina maana ya kutoa ombi, si kuuliza swali; ‘kuniomba’ huwasilisha maana hiyo moja kwa moja.
- source_word: τοῦτον τὸν νεανίαν
  choice: kijana huyu
  rationale: νεανίας ni mwanamume kijana; ‘kijana huyu’ ni sahihi na ya kawaida katika Kiswahili cha sasa.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: kwa kuwa ana jambo la kukuambia
  rationale: Kirai shirikishi kinaeleza sababu ya ombi na kumrejelea kijana; ‘ana jambo la kukuambia’ ni ya asili huku ikihifadhi maana ya kuwa na jambo la kusema.
