translation:
  language: sw
  text: tena waandae wanyama wa kupandwa[a], ili wampandishe Paulo juu yao na kumfikisha salama kwa gavana Feliksi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanyama” au “wanyama wa kubeba mizigo”; Kigiriki hakitaji aina ya wanyama hao.
    reason: lexical_alternative
  - marker: b
    text: Au “ili, baada ya kumpandisha Paulo juu yao, wamfikishe salama kwa gavana Feliksi.”
