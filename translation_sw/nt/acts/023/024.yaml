lexical_decisions:
- source_word: κτήνη
  choice: wanyama wa kupandwa
  rationale: Neno hili la Kigiriki lina maana pana ya wanyama wanaotumiwa kubeba watu au mizigo, bila kutaja aina yao. Tafsiri hii inaonyesha kazi yao bila kudai kwamba walikuwa farasi.
- source_word: τε
  choice: tena
  rationale: Hapa linaunganisha agizo hili na maagizo yaliyotangulia; “tena” ni kiunganishi cha kawaida na cha asili katika muktadha huu.
- source_word: παραστῆσαι
  choice: waandae
  rationale: Katika mfululizo wa maagizo, kitenzi hiki kinamaanisha kufanya wanyama wawe tayari na kupatikana kwa safari.
- source_word: ἵνα
  choice: ili
  rationale: Linaanzisha kusudi la kuwaandaa wanyama.
- source_word: ἐπιβιβάσαντες
  choice: wampandishe Paulo juu yao
  rationale: Kitenzi hiki kinamaanisha kumwezesha mtu kupanda. Muundo wa Kiswahili unaunganisha tendo hili na tendo kuu kwa njia ya asili huku ukidumisha mpangilio wa matendo.
- source_word: διασώσωσι
  choice: kumfikisha salama
  rationale: Kitenzi kinasisitiza kumpeleka mtu mpaka anapowasili salama licha ya hatari, si kumwokoa tu kwa maana ya jumla.
- source_word: πρὸς
  choice: kwa
  rationale: Pamoja na mtu kama lengo la mwendo, “kwa” linaonyesha kwamba Paulo apelekwe kwa Feliksi.
- source_word: ἡγεμόνα
  choice: gavana
  rationale: Katika muktadha wa utawala wa Kirumi, “gavana” ni neno wazi na la kawaida kwa afisa huyu wa mkoa.
theological_decisions: []
