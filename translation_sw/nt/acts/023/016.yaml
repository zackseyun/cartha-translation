  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Mfululizo wa “alikuja, akaingia … akamjulisha” unaonyesha wazi mpangilio wa matendo bila kuiga miundo ya vitenzi vishirikishi vya Kigiriki kwa namna isiyo ya kawaida.
