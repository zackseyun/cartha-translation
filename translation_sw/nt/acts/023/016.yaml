  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: sw
  text: Lakini mwana wa dada yake Paulo[a] aliposikia kuhusu mpango wa kuvizia,[b] alikuja, akaingia katika kambi ya jeshi,[c] akamjulisha Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mpwa wa Paulo.
    reason: lexical_alternative
  - marker: b
    text: Au “njama” au “mtego.” Kigiriki kinamaanisha hasa kuvizia au kusubiri kwa kujificha ili kushambulia.
    reason: lexical_alternative
  - marker: c
    text: Au “makao ya askari.” Neno la Kigiriki linaweza pia kumaanisha “kambi”; katika muktadha huu huenda linarejelea kambi ya jeshi la Roma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: aliposikia
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; “aliposikia” huonyesha uhusiano huo wa wakati kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: 'Neno hili linaashiria hatua mpya ya simulizi yenye utofauti mdogo: njama iliyopangwa sasa inagunduliwa.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: mwana wa dada yake Paulo
  rationale: Tafsiri hii inahifadhi kwa uwazi uhusiano wa kifamilia uliotajwa moja kwa moja katika Kigiriki, bila kutegemea neno la jumla pekee.
- source_word: τὴν ἐνέδραν
  choice: mpango wa kuvizia
  rationale: ἐνέδρα huelekea kumaanisha kuvizia au kuvizia kwa kujificha; “mpango wa kuvizia” ni wa asili katika Kiswahili na huhifadhi wazo la shambulio lililopangwa.
- source_word: παραγενόμενος
  choice: alikuja
  rationale: Kitenzi hiki kinaonyesha kuwasili kwake kabla ya kuingia; “alikuja” ni fupi na ya kawaida katika mfululizo wa matendo.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: akaingia katika kambi ya jeshi
  rationale: παρεμβολή inaweza kumaanisha kambi au makao ya askari. Katika muktadha wa ulinzi wa jeshi la Roma, “kambi ya jeshi” inafaa na ni wazi kwa msomaji wa sasa.
- source_word: ἀπήγγειλεν
  choice: akamjulisha
  rationale: ἀπαγγέλλω humaanisha kutoa taarifa au kupeleka habari; “akamjulisha” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: τῷ Παύλῳ
  choice: Paulo
  rationale: Dativi humtaja mpokeaji wa taarifa; kiambishi cha yambwa katika “akamjulisha” tayari huonyesha “kwa Paulo,” hivyo jina linafuata moja kwa moja.
theological_decisions: []
