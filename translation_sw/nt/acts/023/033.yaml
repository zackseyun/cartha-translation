  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: sw
  text: Walipoingia Kaisaria na kumkabidhi gavana barua, pia walimfikisha Paulo mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimwasilisha Paulo kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: wao (iliyomo katika kiambishi cha kitenzi)
  rationale: Kiwakilishi hiki kinawarejelea wale waliomsindikiza Paulo katika mstari uliotangulia; Kiswahili huonyesha mtenda kwa kawaida katika kiambishi wa-.
- source_word: εἰσελθόντες
  choice: walipoingia
  rationale: Muundo wa wakati unaonyesha kuwa kuingia Kaisaria kulitokea kabla ya matendo makuu yanayofuata.
- source_word: Καισάρειαν
  choice: Kaisaria
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: ἀναδόντες
  choice: kumkabidhi
  rationale: Katika muktadha wa kupeleka hati rasmi kwa mwenye mamlaka, 'kumkabidhi ... barua' ni usemi wa asili unaoonyesha utoaji rasmi.
- source_word: ἐπιστολήν
  choice: barua
  rationale: Neno la kawaida na linaloeleweka kwa ujumbe ulioandikwa, likifaa pia barua rasmi katika muktadha huu.
- source_word: ἡγεμόνι
  choice: liwali
  rationale: '''Liwali'' ni neno la Kiswahili linalotumika kwa mtawala wa mkoa wa Kirumi na linafaa kwa cheo cha Feliksi hapa.'
- source_word: παρέστησαν
  choice: walimleta ... mbele yake
  rationale: Katika mazingira rasmi na ya kisheria, kitenzi kina maana ya kumfikisha mtu mbele ya mwenye mamlaka.
- source_word: καὶ
  choice: pia
  rationale: 'καί ya pili ina maana ya kuongeza tendo jingine: zaidi ya kukabidhi barua, walimleta pia Paulo.'
- source_word: Παῦλον
  choice: Paulo
  rationale: Hili ndilo umbo la kawaida la jina Παῦλος katika Kiswahili.
- source_word: αὐτῷ
  choice: mbele yake
  rationale: Kiwakilishi kinamrejelea liwali; pamoja na 'walimleta,' usemi 'mbele yake' huwasilisha kwa kawaida mazingira ya kufikishwa rasmi.
