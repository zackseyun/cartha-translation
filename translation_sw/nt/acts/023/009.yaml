id: ACT.23.9
reference: Acts 23:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: sw
  text: Kisha pakatokea kelele kubwa, na baadhi ya waandishi wa sheria wa upande wa Mafarisayo wakasimama na kubishana vikali, wakisema, “Hatuoni kosa lolote kwa mtu huyu. Lakini ikiwa roho au malaika amesema naye—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli hii inakatika ghafla katika maandishi ya Kigiriki. Neno “roho” hapa linaweza kumaanisha kiumbe wa kiroho kwa ujumla; wengine hulielewa kuwa “Roho,” lakini kutajwa kwake pamoja na “malaika” kunaunga mkono zaidi maana ya jumla.
    reason: textual_and_alternative_reading
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: kelele kubwa
  rationale: Huwasilisha kilio au ghasia kubwa kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἀναστάντες
  choice: wakasimama
  rationale: Huhifadhi tendo halisi la kusimama, huenda ili kuchukua nafasi ya kusema mbele ya baraza.
- source_word: τινὲς τῶν γραμματέων
  choice: baadhi ya waandishi wa sheria
  rationale: Katika muktadha huu γραμματεῖς ni wataalamu na waandishi wa Sheria ya Kiyahudi; tafsiri hii inaeleweka zaidi kuliko 'waandishi' peke yake.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: wa upande wa Mafarisayo
  rationale: μέρος humaanisha upande au kundi katika baraza; usemi huu ni wa asili na hauongezi muundo rasmi usiotajwa.
- source_word: διεμάχοντο
  choice: kubishana vikali
  rationale: Huonyesha mabishano makali na yanayoendelea yanayodokezwa na kitenzi cha Kigiriki.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: Hatuoni kosa lolote kwa mtu huyu
  rationale: Hutoa maana ya kutompata na jambo baya au la kulaumiwa katika mazingira ya uchunguzi wa kisheria.
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Huhifadhi muunganiko wa Kigiriki na inafaa kwa kauli inayokatika ghafla.
- source_word: πνεῦμα
  choice: roho
  rationale: Bila kibainishi na ikilinganishwa na malaika, neno hili linaelekea kumaanisha kiumbe wa kiroho; tafsiri haikulazimishi kuwa Roho Mtakatifu.
- source_word: ἐλάλησεν αὐτῷ
  choice: amesema naye
  rationale: Ni Kiswahili cha asili kinachoonyesha kwamba kiumbe huyo aliwasiliana na Paulo, huku wakati timilifu ukionyesha tukio lililotokea lenye umuhimu wa sasa.
- source_word: ἄγγελος
  choice: malaika
  rationale: Muktadha wa viumbe vya kiroho unaonyesha malaika, si mjumbe wa kibinadamu.
theological_decisions:
- issue: Maana ya πνεῦμα ikilinganishwa na ἄγγελος
  choice: roho, yaani kiumbe wa kiroho kwa maana ya jumla
  alternative: Roho, yaani Roho Mtakatifu
  rationale: Ulinganisho wa 'roho au malaika' na kutokuwapo kwa kibainishi huunga mkono maana ya jumla; herufi ndogo na tanbihi huepuka kuamua zaidi ya ushahidi wa maandishi.
- issue: Mwisho wa kauli usiokamilika
  choice: Kuhifadhi mkato kwa kistari kirefu
  alternative: 'Kuikamilisha kama swali: “Je, labda roho au malaika amesema naye?”'
  rationale: Matini ya Kigiriki inakatika baada ya 'malaika'; kistari kirefu huhifadhi kutokamilika huko bila kubuni sehemu iliyokosekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa masimulizi umetumia viambishi vya mfululizo (-ka-), na mkato wa mwisho umehifadhiwa kwa uaminifu.
