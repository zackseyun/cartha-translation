  text: 'Klaudio Lisia, kwa Gavana Feliksi, Mheshimiwa Sana: Salamu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Klaudio Lisia
  rationale: Majina yametoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kutafsiriwa.
- source_word: τῷ κρατίστῳ
  choice: mheshimiwa sana
  rationale: κρατίστῳ ni neno rasmi la heshima katika kumwandikia afisa mkuu. “Mheshimiwa sana” hudumisha kiwango hicho cha heshima kwa Kiswahili cha sasa bila kulifanya kuwa cheo maalumu kupita ushahidi wa Kigiriki.
- source_word: ἡγεμόνι
  choice: gavana
  rationale: Katika muktadha huu wa utawala wa Kirumi, ἡγεμών humaanisha afisa anayetawala eneo; “gavana” ni neno wazi na la kawaida, bila kudai cheo cha kiufundi kilicho mahususi zaidi.
- source_word: Φήλικι
  choice: Feliksi
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia unaoeleweka katika Kiswahili.
- source_word: χαίρειν
  choice: Salamu
  rationale: Katika mwanzo wa barua, χαίρειν ni salamu ya kawaida ya kiuandishi, si amri ya “kufurahi.” “Salamu” huwasilisha matumizi hayo kwa ufupi na kwa kawaida.
