  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi “Basi ... aka-” unaendeleza mtiririko wa matukio, huku usemi wa moja kwa moja ukiwa wazi kwa msomaji wa kawaida.
