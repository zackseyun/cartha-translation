  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: sw
  text: Basi, yule kamanda akamwacha kijana aende zake, akamwamuru, “Usimwambie mtu yeyote kwamba umenijulisha mambo haya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: kamanda
  rationale: Ni afisa wa jeshi la Roma mwenye mamlaka juu ya kikosi kikubwa. “Kamanda” ni neno la sasa, wazi na lenye kuonyesha mamlaka yake bila kutumia cheo cha kale kisichoeleweka kwa urahisi.
- source_word: ἀπέλυσε
  choice: akamruhusu ... aende
  rationale: Katika muktadha huu kijana hakuwa mfungwa; afisa alihitimisha mazungumzo na kumwacha aondoke. Usemi huu wa Kiswahili huepuka maana ya kwamba aliachiliwa kutoka kizuizini.
- source_word: νεανίσκον
  choice: kijana
  rationale: Neno hilo humaanisha mwanamume mwenye umri mdogo. “Kijana” ni la kawaida, la heshima, na halimfanyi lazima kuwa mtoto.
- source_word: παραγγείλας
  choice: akimwagiza
  rationale: Kitenzi kinaonyesha maelekezo yenye mamlaka. “Kumwagiza” kinafaa kwa amri ya afisa bila kuongeza ukali usiotajwa wazi.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Usimwambie mtu yeyote
  rationale: Maana ni kutomfunulia mtu mwingine habari hiyo. Huu ni usemi wa asili na wazi katika Kiswahili.
- source_word: ἐνεφάνισας
  choice: umenijulisha
  rationale: Kitenzi kina maana ya kufanya jambo lijulikane au kumjulisha mwenye mamlaka. “Umenijulisha” ni cha asili katika Kiswahili na kinadumisha wazo la kutoa taarifa.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi na kurejelea taarifa ambazo kijana alikuwa ametoa.
- source_word: πρὸς ἐμέ
  choice: -ni- katika “umenijulisha”
  rationale: Kiswahili huonyesha mpokeaji wa taarifa kwa kiambishi cha yambwa; “umenijulisha” huwasilisha kwa kawaida maana ya “umenijulisha mimi.”
