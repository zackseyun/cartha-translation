  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: sw
  text: Ndipo Paulo akamwambia, “Mungu anakaribia kukupiga[a], wewe, ukuta uliopakwa chokaa! Na wewe umeketi kunihukumu kulingana na sheria, lakini huku ukiivunja sheria unaamuru nipigwe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu atakupiga.” Kigiriki kinasema kihalisi, “Mungu anakaribia kukupiga,” jambo linaloweza kusisitiza ukaribu wa tukio hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Mungu yuko karibu kukupiga
  rationale: Muundo μέλλει pamoja na kitenzi-jina unaonyesha tendo linalokaribia au lililo mbele kutokea. ‘Yuko karibu kukupiga’ huhifadhi maana hiyo bila kuigeuza kuwa ombi au laana.
- source_word: τοῖχε κεκονιαμένε
  choice: wewe ukuta uliopakwa chokaa
  rationale: Huhifadhi taswira halisi ya ukuta uliopakwa chokaa na nguvu ya tusi hilo, bila kuongeza moja kwa moja tafsiri ya mfano kuwa unafiki au uovu wa ndani.
- source_word: κάθῃ
  choice: unaketi
  rationale: Huhifadhi kitenzi halisi cha kuketi na ukali wa swali la Paulo kwa Kiswahili cha kawaida.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: kunihukumu kulingana na sheria
  rationale: ‘Kulingana na sheria’ huonyesha sheria kuwa kipimo cha hukumu na kudumisha sajili ya kisheria.
- source_word: παρανομῶν
  choice: ukiivunja sheria
  rationale: Hueleza kwa asili tendo la kwenda kinyume na sheria na kudumisha utofauti wa makusudi kati ya kuhukumu kulingana na sheria na kuivunja.
- source_word: κελεύεις με τύπτεσθαι
  choice: unaamuru nipigwe
  rationale: Huhifadhi maana ya amri pamoja na hali ya kutendwa ya τύπτεσθαι kwa Kiswahili fasaha na wazi.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Ndipo Paulo akamwambia
  rationale: Ni utangulizi wa kisimulizi ulio wa kawaida na wa asili, unaohifadhi ufuatano unaoonyeshwa na τότε.
theological_decisions:
- issue: Asili ya kauli ya Paulo kwamba Mungu yuko karibu kumpiga
  choice: Imetafsiriwa kama tangazo la tendo la Mungu linalokaribia, bila kulainishwa wala kupanuliwa
  alternative: ‘Mungu na akupige,’ kama ombi au laana
  rationale: Muundo wa Kigiriki μέλλει pamoja na kitenzi-jina kwa kawaida ni taarifa ya jambo linalotarajiwa au kukaribia, si usemi wa kutakia. Tafsiri haikati shauri kuhusu uhalali wa kimaadili wa maneno ya Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha na utofauti wa kisheria vimehifadhiwa; taswira ya ukuta uliopakwa chokaa haijafafanuliwa ndani ya mstari ili kutohitimisha maana yake kwa niaba ya msomaji.
