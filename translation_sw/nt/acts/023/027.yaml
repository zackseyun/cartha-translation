id: ACT.23.27
reference: Acts 23:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: sw
  text: Mtu huyu alikuwa amekamatwa na Wayahudi[a], nao walikuwa karibu kumuua. Ndipo nikafika pamoja na kikosi cha askari nikamwokoa, baada ya kujua kwamba yeye ni Mrumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa maana ya kikabila na kidini au watu wa Yudea kwa maana ya kijiografia; hapa yaelekea linarejelea umati au wapinzani Wayahudi huko Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: alikuwa amekamatwa
  rationale: Kitenzi hiki hapa kinaeleza kushikwa kwa nguvu. ‘Alikuwa amekamatwa’ ni Kiswahili cha kawaida na hakidokezi lazima kwamba kukamatwa huko kulikuwa hatua rasmi ya kisheria.
- source_word: Ἰουδαίων
  choice: Wayahudi
  rationale: Neno hili la Kigiriki linaweza kumaanisha Wayahudi kwa utambulisho wa kikabila na kidini au watu wa Yudea kwa maana ya kijiografia. Katika muktadha huu linarejelea kundi la Kiyahudi lililompinga Paulo huko Yerusalemu; maana mbadala imewekwa katika tanbihi.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: walikuwa karibu kumuua
  rationale: Muundo huu unaonyesha tendo lililokuwa karibu kutokea, na ἀναιρέω hapa humaanisha kuua. Tafsiri hii ni wazi na ya kawaida bila kuongeza wazo la mauaji ya kukusudia kisheria.
- source_word: ἐπιστὰς
  choice: nikafika
  rationale: Kitenzi hiki kinaonyesha kufika ghafula au kuingilia kati. ‘Nikafika’ pamoja na tendo linalofuata la kumwokoa huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: σὺν τῷ στρατεύματι
  choice: pamoja na kikosi cha askari
  rationale: στράτευμα ni kundi au kikosi cha kijeshi. ‘Kikosi cha askari’ huhifadhi maana ya kijeshi bila kubainisha ukubwa wa kikosi.
- source_word: ἐξειλάμην
  choice: nikamwokoa
  rationale: Katika muktadha wa hatari ya kuuawa, kitenzi hiki humaanisha kumtoa mtu katika hatari au kumwokoa.
- source_word: μαθὼν
  choice: baada ya kujua
  rationale: Kirai hiki huhifadhi uhusiano wa kitendo kilichotangulia kama unavyowasilishwa katika barua ya Lisia, bila kusawazisha dai lake na simulizi pana la Matendo 21–22.
- source_word: Ῥωμαῖός ἐστιν
  choice: yeye ni Mrumi
  rationale: Ῥωμαῖος humaanisha ‘Mrumi’; katika mazingira haya hadhi ya uraia wa Roma inadokezwa, lakini tafsiri haiongezi neno ‘raia’ ambalo halipo wazi katika kifungu.
theological_decisions:
- issue: Namna ya kihistoria na ya kujitetea katika barua ya mkuu wa jeshi
  choice: Dai la mkuu wa jeshi limetafsiriwa moja kwa moja kama lilivyoandikwa.
  alternative: Kubadili mpangilio au kuongeza maelezo ili kulipatanisha na simulizi pana katika Matendo 21–22.
  rationale: Mstari unanukuu namna Klaudio Lisia alivyoeleza matendo yake kwa faida yake mwenyewe. Tafsiri inapaswa kuhifadhi mvutano wa kisimulizi badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa katika sehemu mbili ili isomeke kwa urahisi, huku mfuatano wa matendo na dai la Lisia vikihifadhiwa.
