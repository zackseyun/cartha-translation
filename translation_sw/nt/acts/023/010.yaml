    issue: The feared outcome is expressed awkwardly.
    rationale: Greek μή with the subjunctive expresses what the commander feared might happen. Kiswahili “akiogopa Paulo asije akararuliwa vipandevipande na wao” preserves this prospective sense more idiomatically than “aliogopa kwamba Paulo angeraruliwa vipandevipande nao.”
  - severity: medium
    issue: Footnote b gives an unsuitable lexical alternative.
    rationale: “Angeraruliwa na kutenganishwa nao” can suggest separation from the people rather than being torn apart by them, and it fails to provide a clear, natural alternative for διασπασθῇ.
  - severity: low
    issue: “Kambi ya jeshi” is less contextually precise for παρεμβολή.
    rationale: Although παρεμβολή can mean “camp,” in this setting it denotes the Roman military quarters/fortress complex. “Makao ya askari” is clearer in modern Swahili, while the note can retain “kambi” as the more literal option.
