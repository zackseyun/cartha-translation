  to: Mzozo mkubwa ulipozuka[a], kamanda, akiogopa Paulo asije akararuliwa vipandevipande na wao[b], aliwaamuru askari washuke, wamnyakue kutoka katikati yao, na wampeleke kwenye makao ya askari[c].
  rationale: The revision keeps the Greek sequence and force while improving idiomatic Swahili. It renders the commander’s fear as a feared possibility, retains the forceful sense of ἁρπάσαι, and uses a contextually clear term for the Roman military quarters. Footnote b is replaced with a genuine, natural alternative that preserves the vivid passive image.
