source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: sw
  text: Mzozo mkubwa ulipozuka[a], kamanda, akiogopa Paulo asije akararuliwa vipandevipande na wao[b], aliwaamuru askari washuke, wamnyakue kutoka katikati yao, na wampeleke kwenye makao ya askari[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mgawanyiko mkubwa” au “ghasia kubwa.” Neno la Kigiriki στάσις linaweza kumaanisha mzozo mkali wa ndani na, katika mazingira mengine, machafuko au uasi.
    reason: lexical_alternative
  - marker: b
    text: Au “asije akararuliwa vipandevipande na wao.” Usemi wa Kigiriki una taswira kali ya Paulo kuraruliwa vipandevipande.
    reason: lexical_alternative
  - marker: c
    text: “Makao ya askari” limetafsiri neno παρεμβολή, ambalo kwa maana ya karibu zaidi linaweza kumaanisha “kambi.” Hapa linarejelea makao ya kijeshi ya Waroma katika eneo la ngome huko Yerusalemu.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: Mzozo mkubwa ulipozuka
  rationale: Muundo wa genitive absolute umetafsiriwa kama kishazi cha hali. Neno στάσις linaweza kumaanisha mzozo, mgawanyiko mkali, ghasia, au uasi; katika muktadha huu “mzozo” linaeleza pambano kali ndani ya baraza bila kulifanya moja kwa moja kuwa uasi rasmi.
- source_word: φοβηθεὶς
  choice: aliogopa
  rationale: Hueleza sababu iliyomsukuma kamanda kutoa amri. Sentensi mbili na kiunganishi “Kwa hiyo” zinaweka uhusiano huo wazi kwa Kiswahili cha kawaida.
- source_word: ὁ χιλίαρχος
  choice: kamanda
  rationale: Neno hili linamtaja afisa Mroma aliyesimamia kikosi kikubwa. “Kamanda” ni la sasa, wazi, na halihitaji matumizi ya cheo cha Kirumi kisichoeleweka kwa wasomaji wengi.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: kwamba Paulo angeraruliwa vipandevipande nao
  rationale: “Angeraruliwa” huhifadhi wazo la jambo lililohofiwa, si jambo lililotokea hakika; “vipandevipande” huhifadhi ukali na taswira dhahiri ya διασπάω.
- source_word: ἐκέλευσεν
  choice: akaamuru
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika mazingira ya kijeshi.
- source_word: τὸ στράτευμα
  choice: askari
  rationale: Ingawa nomino ya Kigiriki ina maana ya kikosi cha askari kwa pamoja, “askari” ni usemi wa kawaida wa Kiswahili unaofaa hapa.
- source_word: καταβὰν
  choice: washuke
  rationale: Huhifadhi mwendo wa kushuka kutoka eneo la juu la ngome kwenda mahali baraza lilipokuwa.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: wamnyakue kutoka katikati yao
  rationale: “Wamnyakue” huhifadhi nguvu na uharaka wa ἁρπάζω, huku “kutoka katikati yao” likifuata maana ya ἐκ μέσου αὐτῶν.
- source_word: ἄγειν τε
  choice: na wampeleke
  rationale: Hueleza kwa Kiswahili cha kawaida kitendo cha kumsindikiza Paulo hadi mahali palipotajwa.
- source_word: παρεμβολήν
  choice: kambi ya jeshi
  rationale: παρεμβολή kimsingi linaweza kumaanisha kambi; hapa linarejelea makao ya askari Waroma katika eneo la ngome mjini Yerusalemu. “Kambi ya jeshi” ni wazi, na tanbihi inaeleza maana mahususi ya kimuktadha.
