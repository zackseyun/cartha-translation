translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Sentensi ndefu ya Kigiriki imegawanywa mara mbili ili iwe wazi na ya kawaida kwa wasomaji, huku uhusiano wa sababu ukihifadhiwa kwa “Kwa hiyo.” Taswira kali ya hatari iliyomkabili Paulo na mpangilio wa amri za kijeshi umehifadhiwa.
