  verdict: revise
  source_fidelity: The draft accurately conveys the major conflict, the commander’s fear, the forceful extraction of Paul, and the soldiers’ descent. However, the explicit causal addition “Kwa hiyo” is not necessary, and the destination is better rendered contextually as military quarters rather than a generic military camp.
  naturalness: The main text is generally natural Standard East African Swahili. “Angeraruliwa vipandevipande nao” is understandable but awkward in this construction; “asije akararuliwa vipandevipande na wao” more naturally expresses the feared possibility. The alternative wording in footnote b is also unnatural and does not accurately present a viable equivalent.
  terminology: “Kamanda,” “askari,” and “wamnyakue” suit the military context. “Makao ya askari” communicates παρεμβολή in its Jerusalem context without misleading readers toward an open-field camp. The cultural footnote preserves the literal alternative “kambi.”
