base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: sw
  text: Lakini kuhani mkuu Anania akawaamuru wale waliokuwa wamesimama karibu naye wampige Paulo kinywani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wampige kofi kinywani.” Kitenzi cha Kigiriki kinaweza kumaanisha kupiga kwa ujumla; “kupiga kofi” ni tafsiri inayowezekana lakini yenye maana mahususi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mwitikio wa ghafla kwa kauli iliyotangulia ya Paulo; “Lakini” linaendeleza simulizi huku likionyesha utofauti wa kiasi bila kuutia chumvi.
- source_word: ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi katika Kiswahili kwa cheo hiki cha kidini.
- source_word: Ἁνανίας
  choice: Anania
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: ἐπέταξεν
  choice: akawaamuru
  rationale: Kitenzi kinaonyesha amri yenye mamlaka; “akawaamuru” ni cha asili katika simulizi na huhifadhi wingi wa walioagizwa.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: wale waliokuwa wamesimama karibu naye
  rationale: Tafsiri hii huhifadhi maana ya watu waliokuwapo wakiwa karibu na Anania, bila kuwalazimisha kueleweka kuwa watumishi rasmi.
- source_word: τύπτειν
  choice: wampige
  rationale: Neno la Kigiriki lina maana pana ya kupiga, hivyo “wampige” halibainishi isivyofaa kwamba ilikuwa lazima kofi.
- source_word: αὐτοῦ τὸ στόμα
  choice: wampige Paulo kinywani
  rationale: Kiswahili cha asili hutaja aliyepigwa na sehemu iliyolengwa. Jina “Paulo” linaondoa utata wa viwakilishi unaoweza kutokea kwa sababu Anania ametajwa pia katika sentensi.
