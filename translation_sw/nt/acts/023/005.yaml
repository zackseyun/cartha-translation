  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: sw
  text: Paulo akasema, “Sikujua, ndugu zangu, kwamba yeye ni kuhani mkuu; kwa maana imeandikwa, ‘Usimnenee mabaya mtawala wa watu wako.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usimtukane mtawala wa watu wako.”
    reason: Mbadala wa kileksia wa kueleza katazo la kunena mabaya kumhusu mtawala.
lexical_decisions:
- source_word: ἔφη τε
  choice: Paulo akasema
  rationale: Kiunganishi τέ ni chepesi na kinaendeleza simulizi; katika Kiswahili, mfuatano wa kitenzi ‘akasema’ huonyesha mtiririko huo kwa kawaida bila kukitafsiri kupita kiasi.
- source_word: Οὐκ ᾔδειν
  choice: Sikujua
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kutokuwa na ujuzi au ufahamu, huku ikiacha wazi sababu ya Paulo kutomjua.
- source_word: ἀδελφοί
  choice: ndugu zangu
  rationale: Katika muktadha huu Paulo anawahutubia wanaume wa baraza. ‘Ndugu zangu’ ni mwito wa kawaida na wenye heshima katika Kiswahili, bila kuingiza maana ya ‘Wayahudi wenzangu’ isiyotajwa wazi.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: kwamba yeye ni kuhani mkuu
  rationale: Wakati uliopo wa ἐστίν umehifadhiwa kwa ‘ni’; ‘kuhani mkuu’ ni istilahi sanifu ya cheo hicho.
- source_word: γέγραπται γὰρ
  choice: kwa maana imeandikwa
  rationale: Hii huhifadhi fomula ya kunukuu Maandiko na nguvu ya hali timilifu ya Kigiriki kwa lugha ya kawaida ya Biblia ya Kiswahili.
- source_word: Ἄρχοντα
  choice: mtawala
  rationale: ‘Mtawala’ huwasilisha ἄρχων kama mwenye mamlaka ya kuongoza katika muktadha wa kisheria na kimaadili.
- source_word: τοῦ λαοῦ σου
  choice: wa watu wako
  rationale: ‘Watu wako’ huhifadhi maana ya λαός na lugha ya jumuiya katika dondoo la Maandiko.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Usimseme vibaya
  rationale: Wakati ujao wa Kigiriki una nguvu ya amri hapa. ‘Usimseme vibaya’ ni Kiswahili cha sasa na kinachoeleweka, huku mbadala mkali zaidi ‘usimtukane’ ukitolewa katika tanbihi.
theological_decisions:
- issue: Iwapo ἀδελφοί itafsiriwe kwa lugha jumuishi
  choice: ndugu zangu
  alternative: ndugu zangu wanaume na wanawake
  rationale: Baraza linalohutubiwa katika muktadha huu ni la wanaume; tafsiri haiongezi jinsia isiyotajwa na bado hutumia mwito wa kawaida wa Kiswahili.
- issue: Namna ya kuwasilisha dondoo la Maandiko
  choice: kwa maana imeandikwa, ‘Usimseme vibaya mtawala wa watu wako.’
  alternative: kwa maana imeandikwa, ‘Usimtukane mtawala wa watu wako.’
  rationale: ‘Imeandikwa’ huhifadhi mamlaka ya fomula ya Maandiko. ‘Usimseme vibaya’ huhifadhi upana wa κακῶς, huku ‘usimtukane’ ikiwa tafsiri halali yenye nguvu zaidi.
- issue: Wakati wa ἐστὶν katika kauli kuhusu kuhani mkuu
  choice: yeye ni kuhani mkuu
  alternative: yeye alikuwa kuhani mkuu
  rationale: Tafsiri inahifadhi wakati uliopo wa Kigiriki na mvutano wake wa kimasimulizi badala ya kuubadili kimyakimya kuwa wakati uliopita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano ‘akasema’ umechaguliwa kwa mtiririko wa simulizi; istilahi ‘kuhani mkuu’ na fomula ‘imeandikwa’ zimehifadhiwa kwa ufasaha wa kibiblia usio wa kizamani.
