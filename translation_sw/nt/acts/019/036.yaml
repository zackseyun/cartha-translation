id: ACT.19.36
reference: Acts 19:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa mambo haya hayawezi kupingwa[a], ni lazima mtulie[b] na msifanye jambo lolote kwa pupa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hayapingiki” au “hayawezi kukanushwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “mkae kimya” au “mjitunze katika utulivu.”
    reason: lexical_alternative
  - marker: c
    text: Au “kwa papara” au “bila kufikiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: hayawezi kupingwa
  rationale: Kivumishi hiki humaanisha kwamba mambo yanayotajwa hayawezi kukanushwa au kubishaniwa kwa msingi unaokubalika. Usemi huu ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia katika hotuba ya katibu wa mji.
- source_word: ὄντων τούτων
  choice: kwa kuwa mambo haya
  rationale: Muundo huu wa Kigiriki unaonyesha hali inayotoa msingi wa himizo; Kiswahili cha sababu, “kwa kuwa,” kinawasilisha maana hiyo kwa ufasaha.
- source_word: δέον ἐστίν
  choice: ni lazima
  rationale: Usemi huu usio na mtendaji maalumu unaonyesha ulazima au wajibu, bila kuongeza chanzo cha mamlaka ambacho hakikutajwa.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: mtulie
  rationale: Muundo huu unaeleza kuwa katika hali ya utulivu au ya kujizuia. “Mtulie” ni himizo la asili katika muktadha wa umati uliokuwa na msukosuko.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: msifanye jambo lolote kwa pupa
  rationale: προπετές hueleza tendo la haraka lisilofikiriwa vizuri. “Kwa pupa” huhifadhi onyo dhidi ya kuchukua hatua kwa papara bila kudokeza tu uzembe wa jumla.
