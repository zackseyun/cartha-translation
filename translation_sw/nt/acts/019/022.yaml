  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: sw
  text: Basi, baada ya kuwatuma kwenda Makedonia wawili kati ya wale waliokuwa wakimhudumia—Timotheo na Erasto—yeye mwenyewe alikaa kwa muda katika Asia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jimbo la Kiroma la Asia katika sehemu ya magharibi ya Asia Ndogo, si bara la Asia la leo.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: baada ya kuwatuma
  rationale: Kirai cha kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kitenzi kikuu; muundo huu unaweka wazi mfuatano wa matendo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Basi
  rationale: Hiki ni kiunganishi chepesi kinachoendeleza simulizi, si lazima kionyeshe upinzani mkali.
- source_word: εἰς τὴν Μακεδονίαν
  choice: kwenda Makedonia
  rationale: Katika Kiswahili, ‘kwenda Makedonia’ huonyesha kwa kawaida mwelekeo wa kutumwa hadi eneo hilo bila kulazimisha tafsiri isiyo ya kawaida ya kihusishi.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: wawili kati ya wale waliokuwa wakimhudumia
  rationale: Huhifadhi dhana ya huduma inayotolewa kwa Paulo na muundo wa sehemu ya kundi, bila kuwapa cheo rasmi kisichotajwa katika Kigiriki.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Timotheo na Erasto
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Huhifadhi msisitizo na utofautishaji kati ya Paulo na wale wawili aliowatuma.
- source_word: ἐπέσχεν χρόνον
  choice: alikaa kwa muda
  rationale: Hutoa kwa lugha ya kawaida maana ya kubaki mahali kwa kipindi fulani.
- source_word: εἰς τὴν Ἀσίαν
  choice: katika Asia
  rationale: Pamoja na kitenzi cha kukaa, kihusishi kina maana ya mahali; ‘katika Asia’ ni cha kawaida na sahihi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; msisitizo wa ‘yeye mwenyewe’ na maana isiyo ya cheo ya ‘wakimhudumia’ zimehifadhiwa.
