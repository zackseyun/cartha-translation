  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: sw
  text: Naye Mungu alikuwa akifanya miujiza isiyo ya kawaida kupitia mikono ya Paulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “matendo ya nguvu yasiyo ya aina ya kawaida.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δυνάμεις
  choice: miujiza
  rationale: Katika muktadha huu wingi wa δύναμις unamaanisha matendo ya nguvu ya kimiujiza, si nguvu kama dhana tu.
- source_word: τε
  choice: Naye
  rationale: Kiunganishi τε kinaunganisha kauli hii na simulizi lililotangulia; “Naye” ni muunganisho wa kawaida na wa asili katika Kiswahili.
- source_word: οὐ τὰς τυχούσας
  choice: isiyo ya kawaida
  rationale: Nahau hii ina maana ya matendo yasiyo ya aina ya kawaida au yasiyo matendo ya hivi hivi; tafsiri hii inadumisha msisitizo wake bila kuwa nzito.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Mungu ndiye kiima kilichotajwa wazi, hivyo tafsiri inahifadhi kwamba yeye ndiye mtendaji mkuu.
- source_word: ἐποίει
  choice: alikuwa akifanya
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha tendo lililoendelea au lililorudiwa wakati uliopita.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: kupitia mikono ya Paulo
  rationale: διά pamoja na umilikishi huonyesha njia au chombo; kutaja mikono kunahifadhi taswira halisi ya Kigiriki na kumweka Paulo kama chombo ambacho Mungu alitumia.
- source_word: Παύλου
  choice: Paulo
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
theological_decisions:
- issue: Mtendaji wa miujiza
  choice: Mungu ndiye aliyefanya miujiza, kupitia mikono ya Paulo.
  alternative: Paulo ndiye aliyefanya miujiza.
  rationale: Kigiriki kinamtaja ὁ θεὸς kuwa kiima cha ἐποίει, huku διὰ τῶν χειρῶν Παύλου ikionyesha kwamba Paulo alikuwa njia au chombo; tofauti hiyo imehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Alikuwa akifanya” huhifadhi hali ya tendo lililoendelea au kurudiwa; “kupitia mikono ya Paulo” huhifadhi nahau ya chanzo bila kuficha uwakala wa Mungu.
