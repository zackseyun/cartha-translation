  text: Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: sw
  text: Wakati huo kulitokea ghasia kubwa kuhusu Njia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia.” Hapa neno hili linarejelea harakati ya Kikristo, jina linalotumiwa mara kadhaa katika Matendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: kulitokea
  rationale: Kitenzi hiki kinaanzisha tukio lililotokea; “kulitokea” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kutokea kwa jambo.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno tofauti)
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Mtiririko wake unaeleweka kiasili katika Kiswahili bila kuongeza “basi” au “lakini,” ambazo zingeweza kusisitiza maana isiyokusudiwa.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: Wakati huo
  rationale: Hii ni tafsiri fupi na ya kawaida ya usemi wa wakati, ikirejelea kipindi kinachozungumziwa katika muktadha.
- source_word: τάραχος
  choice: ghasia
  rationale: Neno hili huonyesha vurugu, taharuki, au machafuko. “Ghasia” linafaa kwa tukio linaloanza kuelezwa bila kulifanya mapema kuwa “maasi” au “fujo za umati” kwa maana mahususi zaidi.
- source_word: οὐκ ὀλίγος
  choice: kubwa
  rationale: Huu ni usemi wa kupunguza kwa namna ya balagha, kihalisi “si ndogo.” Katika Kiswahili cha sasa, “ghasia si ndogo” si ya kawaida katika sentensi hii; “ghasia kubwa” huwasilisha nguvu ileile kwa uwazi.
- source_word: περὶ
  choice: kuhusu
  rationale: Hapa περί pamoja na hali ya genitivi huonyesha jambo lililohusika au lililosababisha mzozo; “kuhusu” ni sahihi na ya kawaida.
- source_word: τῆς ὁδοῦ
  choice: Njia
  rationale: Katika Matendo, “Njia” hutumiwa mara kwa mara kama jina la kutambulisha harakati ya wafuasi wa Yesu. Herufi kubwa husaidia kuonyesha matumizi hayo bila kuongeza maelezo ya kimadhehebu.
theological_decisions:
- issue: Kutafsiri τῆς ὁδοῦ kama jina la harakati
  choice: Njia
  alternative: njia
  rationale: Muktadha wa Matendo unaonyesha kwamba usemi huu unarejelea harakati ya Kikristo, ingawa maana yake ya kawaida ya “njia” bado inaonekana. Herufi kubwa inaonyesha matumizi yake kama jina, na tanbihi inahifadhi uwezekano wa kusoma neno hilo kwa maana ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imewekwa kwa ufupi na kwa mtiririko wa kawaida; nahau ya Kigiriki οὐκ ὀλίγος imetolewa kwa maana yake ya Kiswahili “kubwa,” huku “Njia” ikihifadhiwa kama jina lenye maana maalumu katika Matendo.
