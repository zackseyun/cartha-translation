  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: sw
  text: Si kazi yetu hii tu iliyo katika hatari ya kuingia katika sifa mbaya, bali pia hekalu la mungu wa kike mkuu Artemi linaweza kuhesabiwa kuwa si kitu, na hata ukuu wa Artemi—ambaye Asia yote na ulimwengu[a] humwabudu—unaweza kushushwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu wenye watu.” Mara nyingi neno la Kigiriki humaanisha ulimwengu uliokaliwa na watu, hasa ulimwengu mpana wa Kirumi.
    reason: lexical_alternative
  - marker: b
    text: Au, “fahari yake” au “utukufu wake.” Usemi wa Kigiriki unarejelea hadhi iliyotukuzwa au ukuu wa Artemi unaoshushwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: iliyo katika hatari
  rationale: Huwasilisha wazi hali ya kuwa hatarini, huku ikiendeleza nguvu ya wakati uliopo katika muktadha wa onyo.
- source_word: τὸ μέρος
  choice: kazi yetu hii
  rationale: Katika muktadha huu inarejelea shughuli ya kiuchumi ya mafundi; “kazi” ni ya kawaida na inaeleweka kwa wasomaji wengi.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: kuingia katika sifa mbaya
  rationale: Huhifadhi wazo la kufikia hali ya kulaumiwa au kupoteza heshima bila kulifanya kuwa hasara ya kifedha pekee.
- source_word: ἱερὸν
  choice: hekalu
  rationale: Neno linarejelea mahali patakatifu au eneo la hekalu; “hekalu” ndilo neno la kawaida na wazi kwa Artemisioni ya Efeso.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: kuhesabiwa kuwa si kitu
  rationale: Ni tafsiri ya karibu ya usemi wa kutazamwa kuwa hakufai au hakustahili kupewa umuhimu.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: inaweza kushushwa
  rationale: Huwasilisha anguko linalohofiwa katika sentensi yenye wazo kuu la hatari, bila kulazimisha maana mahususi kama kuondolewa madarakani.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: fahari yake
  rationale: “Fahari” inaweza kumaanisha utukufu, ukuu, au hadhi yake iliyotukuzwa, na inafaa na kitenzi cha kushushwa.
- source_word: ὅλη ἡ Ἀσία
  choice: Asia yote
  rationale: Huhifadhi upana wa balagha ya Kigiriki; hapa Asia ni eneo au jimbo la Kirumi lililoitwa Asia.
- source_word: ἡ οἰκουμένη
  choice: ulimwengu
  rationale: Ni Kiswahili cha kawaida; tanbihi inadumisha maana mbadala ya ulimwengu wenye watu, hasa ulimwengu mpana wa Kirumi.
- source_word: σέβεται
  choice: humwabudu
  rationale: Muktadha ni wa ibada ya Artemi, hivyo “kuabudu” huonyesha wazi heshima ya kidini inayokusudiwa.
theological_decisions:
- issue: Kutafsiri lugha ya dini ya kipagani bila kuipunguza wala kuidhinisha
  choice: mungu wa kike mkuu Artemi ... ambaye Asia yote na ulimwengu humwabudu
  alternative: anayeitwa mungu wa kike mkuu Artemi ... ambaye Asia yote na ulimwengu humheshimu
  rationale: Haya ni maneno yaliyoripotiwa ya Demetrio. Kigiriki hakitumii kauli ya kujitenga kama “anayeitwa,” kwa hiyo tafsiri inadumisha mtazamo wa msemaji bila kuufanya kuwa dai la msimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa balagha “Wala ... tu, bali pia” unahifadhi mlingano wa sentensi ya Kigiriki. Jina “Artemi” limetumika katika umbo linalosomeka kwa Kiswahili; viashiria vyote vya tanbihi vimewekwa katika matini.
