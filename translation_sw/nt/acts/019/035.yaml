id: ACT.19.35
reference: Acts 19:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: sw
  text: Baada ya karani wa jiji kuutuliza umati, alisema, “Enyi wanaume wa Efeso, ni mtu gani miongoni mwa watu ambaye hajui kwamba jiji la Waefeso ni mlezi wa hekalu la Artemi Mkuu[a] na wa kitu kilichoanguka kutoka mbinguni[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtunzaji wa hekalu la Artemi Mkuu.” Neno la Kigiriki hurejelea jiji lililotambuliwa rasmi kuwa msimamizi au mhifadhi wa hekalu au ibada.
    reason: lexical_alternative
  - marker: b
    text: Au, “wa kitu cha mbinguni kilichoanguka.” Kigiriki hakitaji aina ya kitu hicho; katika muktadha huu huenda kinarejelea sanamu ya ibada iliyohusishwa na Artemi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: alipokuwa ameutuliza
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha kwamba kuutuliza umati kulitangulia kusema kwake; usemi huu ni wa asili katika Kiswahili.
- source_word: ὁ γραμματεὺς
  choice: karani wa jiji
  rationale: Katika muktadha huu neno hilo humaanisha afisa wa utawala wa jiji, si mwandishi wa kidini.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: Ni neno la kawaida na linalofaa kwa mkusanyiko mkubwa wa watu uliokuwa na vurugu.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Enyi wanaume wa Efeso
  rationale: Huhifadhi mwito rasmi na umbo la kiume la Kigiriki bila kulifanya kuwa lisilo la kijinsia.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: ni nani miongoni mwa wanadamu asiyejua
  rationale: Huwasilisha swali la balagha kwa Kiswahili cha asili huku likihifadhi wazo la ‘miongoni mwa wanadamu.’
- source_word: τὴν Ἐφεσίων πόλιν
  choice: jiji la Waefeso
  rationale: Huhifadhi muundo wa umilikaji wa Kigiriki kwa namna fupi na ya kawaida katika Kiswahili.
- source_word: νεωκόρον
  choice: mlinzi wa hekalu
  rationale: Neno hilo ni cheo cha jiji linalotambuliwa kuwa mtunzaji au mlezi wa hekalu na ibada yake; ‘mlinzi wa hekalu’ ni wazi kwa msomaji wa leo.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: la Artemi mkuu
  rationale: Huhifadhi jina na cheo cha heshima kilichotumiwa katika ibada ya Efeso.
- source_word: τοῦ διοπετοῦς
  choice: wa sanamu iliyoanguka kutoka mbinguni
  rationale: Neno la Kigiriki hurejelea kitu kilichoaminika kuanguka kutoka angani; katika muktadha huu huenda ni sanamu ya ibada, lakini ufafanuzi huo umewekewa tanbihi kwa sababu nomino haijaelezwa wazi katika Kigiriki.
theological_decisions:
- issue: Kauli ya kipagani kuhusu Artemi na kitu kilichoanguka kutoka mbinguni
  choice: 'Kauli imetafsiriwa moja kwa moja kama maneno ya afisa: ‘mlinzi wa hekalu la Artemi mkuu na wa sanamu iliyoanguka kutoka mbinguni.’'
  alternative: ‘mtunzaji wa hekalu la Artemi mkuu na wa kitu kilichoanguka kutoka angani’
  rationale: Aya inaripoti imani ya msemaji bila kuithibitisha kuwa kweli. Matini kuu inatoa maana inayowezekana zaidi katika muktadha, huku tanbihi ikihifadhi kutokuwa dhahiri kwa nomino ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Karani wa jiji’ hutofautisha afisa wa kiraia na mwandishi wa kidini; ‘Enyi wanaume wa Efeso’ huhifadhi mwito rasmi wa asili.
