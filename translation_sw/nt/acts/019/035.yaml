review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the municipal official, the crowd, the formal male address, and the rhetorical question. However, “alipokuwa ameutuliza” expresses a temporal ‘while/when’ construction less well suited to the antecedent aorist participle; the Greek more naturally states that he first calmed the crowd and then spoke. Further, διοπετοῦς is substantival but does not specify ‘image’; retaining a general referent in the main text better preserves the source’s ambiguity.
  naturalness: “Baada ya ... kuutuliza” is clear, idiomatic Standard East African Swahili and naturally marks the sequence. “Ni mtu gani miongoni mwa watu ambaye hajui” is a more fluent rendering of the rhetorical idiom than the draft’s compressed relative construction. “Mlezi wa hekalu” avoids suggesting that the city itself is a literal security guard.
  terminology: “Karani wa jiji,” “umati,” and “Enyi wanaume wa Efeso” are appropriate. Artemi is retained. “Artemi Mkuu” represents the cultic honorific without treating the reported pagan claim as true. “Kitu kilichoanguka kutoka mbinguni” avoids making ‘image’ explicit where Greek does not do so; the note can state the contextual likelihood.
  issues:
  - severity: medium
    issue: Temporal construction for καταστείλας
    rationale: “Alipokuwa ameutuliza” is awkward and can mean ‘when/while he had quieted.’ The participle denotes an action completed before the main verb; “Baada ya ... kuutuliza” represents this directly.
  - severity: medium
    issue: “Sanamu” over-specifies τοῦ διοπετοῦς
    rationale: The Greek substantival adjective refers generally to a purported heaven-/sky-fallen object. Although a cult image is likely in context, the main text should retain this ambiguity, with the likely identification placed in a footnote.
  - severity: low
    issue: Civic-cultic sense of νεωκόρος
    rationale: “Mlinzi” can evoke a personal guard. “Mlezi wa hekalu” more naturally conveys the city’s recognized custodial relationship while the footnote explains the technical civic title.
