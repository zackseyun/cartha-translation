base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: sw
  text: Lakini ikiwa mnatafuta jambo lolote zaidi, litatatuliwa katika kusanyiko halali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kusanyiko la kisheria” au “katika kusanyiko rasmi.” Neno la Kigiriki hapa linamaanisha kusanyiko la kiraia lililoundwa kwa mujibu wa sheria, si kanisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: zaidi
  rationale: Kielezi hiki huonyesha jambo la nyongeza au linalozidi suala lililopo; “zaidi” ni Kiswahili cha kawaida na huhifadhi maana hiyo ya ulinganisho.
- source_word: ἐπιζητεῖτε
  choice: mnatafuta
  rationale: Kitenzi kinaweza kumaanisha kutafuta au kufuatilia jambo. Katika muktadha huu wa kiraia na kisheria, “mnatafuta” huhifadhi upana wa maana bila kukifanya kiwe dai kali au istilahi ya kiufundi.
- source_word: ἐννόμῳ
  choice: halali
  rationale: Kivumishi hiki humaanisha lililo kwa mujibu wa sheria. “Halali” kinaonyesha kwamba kusanyiko hilo limeitishwa kwa utaratibu unaokubalika kisheria.
- source_word: ἐκκλησίᾳ
  choice: kusanyiko
  rationale: Hapa neno linarejelea mkutano rasmi wa raia wa Efeso, si jumuiya ya waumini. “Kusanyiko” huhifadhi maana ya watu waliokusanyika bila kuingiza maana ya kanisa.
- source_word: ἐπιλυθήσεται
  choice: litatatuliwa
  rationale: Umbo la wakati ujao lisilotaja mtendaji linaonyesha kuwa jambo hilo litapatiwa ufumbuzi; “litatatuliwa” ni la kawaida na linafaa katika muktadha wa utaratibu wa kiraia.
- source_word: τι
  choice: jambo
  rationale: Kiwakilishi kisichobainisha kitu katika sentensi sharti kinawakilishwa kwa kawaida na “jambo”; pamoja na περαιτέρω, “jambo jingine zaidi” huonyesha suala lolote la nyongeza.
theological_decisions:
- issue: Tafsiri ya ἐκκλησία katika muktadha usio wa Kikristo
  choice: kusanyiko
  alternative: kanisa; mkutano
  rationale: Muktadha unahusu kusanyiko la kiraia lililoundwa kisheria huko Efeso, wala si jumuiya ya Kikristo. “Kusanyiko” huepuka maana ya kikanisa na kubakiza wazo la kundi lililokusanyika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umebaki wazi na rahisi, huku ukihifadhi muktadha wa kiraia na kisheria wa mstari.
