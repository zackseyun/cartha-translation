  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: sw
  text: Lakini walipotambua kwamba yeye ni Myahudi[a], sauti moja ikatoka kwao wote, wakipaza sauti kwa karibu saa mbili, “Artemi wa Waefeso ni mkuu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Myahudi au mtu kutoka Yudea; hapa maana pana ya kikabila na kidini inaelekea kufaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: walipotambua
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha jambo lililotangulia kilio cha umati; muundo wa ‘walipo-’ unatoa uhusiano huo wa wakati kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye ukinzani na jaribio la Aleksanda kusema katika muktadha uliotangulia.
- source_word: Ἰουδαῖός
  choice: Myahudi
  rationale: Katika mazingira ya Efeso, maana pana ya utambulisho wa kikabila na kidini ndiyo inayowezekana zaidi kuliko maana finyu ya mtu kutoka Uyahudi.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: wote wakawa na sauti moja
  rationale: Huhifadhi wazo la umati wote kuungana katika kilio kimoja, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: kwa muda wa karibu saa mbili
  rationale: Neno ὡς katika usemi wa kipimo linaonyesha makadirio, si lazima saa mbili kamili.
- source_word: κραζόντων
  choice: wakipaza sauti
  rationale: Huwasilisha kitendo endelevu cha kupiga kelele kwa nguvu katika ghasia ya hadharani.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Artemi wa Waefeso ni mkuu!
  rationale: Huhifadhi tamko la sifa na uhusiano wa Artemi na watu wa Efeso kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana ya Ἰουδαῖος
  choice: Myahudi
  alternative: mtu wa Uyahudi
  rationale: Mwitikio wa umati unahusu utambulisho wa Aleksanda wa kikabila na kidini; maandishi hayasisitizi mahali alikotoka. Tanbihi inadumisha maana nyingine inayowezekana ya neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakipaza sauti’ linaonyesha kilio chenye nguvu na kinachoendelea; jina ‘Artemi’ limetoholewa kwa urahisi wa matamshi ya Kiswahili.
