id: ACT.19.5
reference: Acts 19:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: sw
  text: Waliposikia hayo, wakabatizwa katika jina la Bwana Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa jina la Bwana Yesu.”
    reason: Tafsiri hii ni ya kawaida zaidi katika Kiswahili, lakini inaweza kusisitiza mamlaka badala ya nguvu ya mwelekeo au kuhusishwa inayoweza kuwamo katika εἰς.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Waliposikia hayo
  rationale: 'Kishiriki cha wakati uliopita kinaonyesha wakati: ‘waliposikia’. Neno ‘hayo’ linaeleza kwa kawaida katika Kiswahili jambo lililosikiwa kutoka katika muktadha uliotangulia, ingawa halitajwi wazi katika Kigiriki.'
- source_word: δὲ
  choice: (hakutafsiriwa kwa neno la pekee)
  rationale: δὲ ni kiunganishi hafifu cha kuendeleza simulizi. Mtiririko wa sentensi ya Kiswahili unaonyesha mwendelezo huo bila kuhitaji ‘na’ au ‘lakini’, ambazo hapa zingesikika nzito au kuleta utofautishaji usiokusudiwa.
- source_word: ἐβαπτίσθησαν
  choice: wakabatizwa
  rationale: Huhifadhi kauli tendwa ya kitenzi na wakati wa tukio, huku ikiwa namna ya kawaida na yenye hadhi katika Kiswahili cha simulizi.
- source_word: εἰς τὸ ὄνομα
  choice: katika jina
  rationale: ‘Katika jina’ ni Kiswahili kinachoeleweka na huhifadhi kwa kadiri inayowezekana wazo la kuingizwa katika uhusiano au utambulisho unaodokezwa na εἰς, bila kulazimisha ufafanuzi wa kiteolojia.
- source_word: τοῦ κυρίου
  choice: la Bwana
  rationale: Katika muktadha huu κύριος ni cheo cha Yesu; ‘Bwana’ ni tafsiri ya kawaida, yenye hadhi, na inayofaa muktadha wa Kikristo.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina Ἰησοῦς katika Kiswahili.
theological_decisions:
- issue: Maneno yanayoeleza uhusiano wa ubatizo na jina la Yesu
  choice: katika jina la Bwana Yesu
  alternative: kwa jina la Bwana Yesu
  rationale: Kigiriki kina εἰς τὸ ὄνομα, ambacho kinaweza kuwa na nguvu ya mwelekeo au kuhusishwa na jina hilo. ‘Katika jina’ hudumisha mvutano huo kwa kiasi fulani; ‘kwa jina’ ni usemi wa kawaida zaidi unaoweza kueleweka kuwa kwa mamlaka ya Yesu, hivyo umewekwa katika tanbihi badala ya kupewa kipaumbele.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida kwa usomaji wa umma; ‘hayo’ hutegemea muktadha uliotangulia, kama ilivyo kwa kishiriki cha Kigiriki.
