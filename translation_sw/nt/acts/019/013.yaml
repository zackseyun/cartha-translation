id: ACT.19.13
reference: Acts 19:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: sw
  text: Lakini baadhi ya Wayahudi waliokuwa wakizunguka-zunguka, watoa pepo, walijaribu pia kulitaja jina la Bwana Yesu juu ya wale waliokuwa na roho waovu[a], wakisema, “Ninawaapisha kwa Yesu[b], ambaye Paulo anamhubiri[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wale waliokuwa na roho waovu”; yaani, watu waliokuwa chini ya ushawishi wa roho waovu.
    reason: lexical_alternative
  - marker: b
    text: Au “Ninawaweka chini ya kiapo kwa Yesu,” au “Ninawatoza kwa uzito kwa Yesu.”
    reason: lexical_alternative
  - marker: c
    text: Au “ambaye Paulo anamtangaza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: walijaribu
  rationale: Kitenzi hiki kinaonyesha kwamba walithubutu au walifanya jaribio; “walijaribu” ni Kiswahili cha kawaida na hakidokezi kwamba walifanikiwa.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: baadhi ya Wayahudi wenye kutoa pepo wachafu, waliokuwa wakisafiri kutoka mahali pamoja hadi pengine, ... pia
  rationale: “Baadhi” huwakilisha τινες, “pia” huhifadhi nguvu ya καί, na maelezo ya kusafiri huonyesha περιερχομένων kwa lugha ya kawaida. “Wenye kutoa pepo wachafu” hueleweka kwa urahisi kuliko neno la kitaalamu “wapunga pepo.”
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: kulitaja jina ... juu ya
  rationale: Muundo huu una maana ya kutumia au kuliita jina juu ya watu katika tendo la kutoa pepo. “Kulitaja jina ... juu ya” hudumisha taswira ya Kigiriki bila kufanya matumizi hayo yaonekane halali au yenye mafanikio.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: wale waliokuwa na roho waovu
  rationale: Hufuata kwa karibu maana ya moja kwa moja, “wale wenye roho waovu,” bila kuongeza kauli yenye nguvu zaidi ya kwamba walikuwa wamepagawa.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: jina la Bwana Yesu
  rationale: “Bwana Yesu” ni tafsiri ya kawaida na yenye uzito unaofaa ya κύριος Ἰησοῦ.
- source_word: Ὁρκίζω ὑμᾶς
  choice: Ninawaapisha
  rationale: ὁρκίζω ni kumweka mtu chini ya kiapo au kumwagiza kwa uzito kwa kutaja mamlaka fulani. “Ninawaapisha” huhifadhi mtindo rasmi wa kauli hii; kiambishi cha wingi “-wa-” kinafuata ὑμᾶς.
- source_word: τὸν Ἰησοῦν ὃν Παῦλος κηρύσσει
  choice: kwa Yesu, ambaye Paulo anamhubiri
  rationale: Baada ya ὁρκίζω, accusative humtaja yule ambaye kwa jina lake kiapo kinafanywa, hivyo “kwa Yesu.” κηρύσσει humaanisha kutangaza au kuhubiri hadharani; “anamhubiri” ni wazi na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya κύριος katika τοῦ κυρίου Ἰησοῦ
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” huhifadhi uzito wa heshima na wa kiteolojia wa cheo hiki katika Matendo, bila kuupunguza kuwa mamlaka ya kawaida tu.
- issue: Iwapo kufanya kupagawa kuwa wazi katika τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: wale waliokuwa na roho waovu
  alternative: wale waliopagawa na roho waovu
  rationale: Kigiriki kinasema kihalisi kwamba walikuwa “na” roho waovu. Tafsiri kuu inadumisha kiwango hicho cha uwazi badala ya kuingiza neno lenye maana kali zaidi.
- issue: Iwapo kauli ya watoa pepo inaonyesha amri ya moja kwa moja au kiapo
  choice: Ninawaapisha kwa Yesu
  alternative: Ninawaamuru kwa jina la Yesu
  rationale: Chanzo kinatumia ὁρκίζω, si kitenzi cha kawaida cha kuamuru. “Ninawaapisha” huhifadhi lugha ya kiapo na pia umbali wao na Yesu, ambaye wanamtambulisha kama yule anayehubiriwa na Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi “pia,” lugha ya kiapo, na kutotamka moja kwa moja kwamba watu hao walikuwa wamepagawa. “Wenye kutoa pepo wachafu” limetumiwa badala ya istilahi adimu au inayoweza kuchanganya.
