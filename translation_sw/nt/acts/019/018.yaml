  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: sw
  text: Na wengi kati ya wale waliokuwa wameamini walikuwa wakija, wakiungama na kuweka wazi matendo yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “desturi zao,” “shughuli zao,” au “mambo waliyokuwa wamefanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοί
  choice: wengi
  rationale: Ni kisawe cha kawaida na cha moja kwa moja kinachoonyesha idadi kubwa bila kuongeza ufafanuzi usio katika matini.
- source_word: τε
  choice: Na
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa upole; “Na” kinahifadhi mtiririko huo kwa Kiswahili cha kawaida.
- source_word: τῶν πεπιστευκότων
  choice: kati ya wale waliokuwa wameamini
  rationale: Kauli ya wakati timilifu inaonyesha tendo la kuamini lililotangulia na hali yake inayoendelea; tafsiri hii huepuka kulifanya neno kuwa jina rasmi la kundi.
- source_word: ἤρχοντο
  choice: walikuwa wakija
  rationale: Wakati usiotimilifu unaonyesha tendo lililokuwa likiendelea au kujirudia katika wakati uliopita, bila kulazimisha maana ya marudio ya mara nyingi.
- source_word: ἐξομολογούμενοι
  choice: wakiungama
  rationale: Huwasilisha kukiri au kukubali wazi, huku ikiacha wazi kile hasa kilichoungamwa kama ilivyo katika Kigiriki.
- source_word: ἀναγγέλλοντες
  choice: kuweka wazi
  rationale: Kitenzi kina maana ya kutangaza, kuripoti, au kufanya jambo lijulikane; hapa “kuweka wazi” kinafaa kwa muktadha wa mambo yaliyokuwa yamefichwa na hakirudii tu maana ya “kuungama.”
- source_word: τὰς πράξεις αὐτῶν
  choice: matendo yao
  rationale: πρᾶξις linaweza kumaanisha matendo, shughuli, au desturi. “Matendo yao” ni pana na la moja kwa moja, huku muktadha ukiruhusu msomaji kuyaelewa kama shughuli zilizokuwa zikizungumziwa.
theological_decisions:
- issue: Iwapo πεπιστευκότων itafsiriwe kama jina la kundi lililotulia (“waumini”) au kama tendo la awali lenye hali inayoendelea.
  choice: wale waliokuwa wameamini
  alternative: waumini; wale walioamini
  rationale: Muundo timilifu wa Kigiriki unaangazia kuamini kulikotangulia na umuhimu wake unaoendelea, bila kuingiza jina la kitaalamu la kijumuiya.
- issue: Iwapo τὰς πράξεις αὐτῶν yahusishwe mahsusi na dhambi, uchawi, au matendo kwa ujumla.
  choice: matendo yao
  alternative: desturi zao; shughuli zao; dhambi zao
  rationale: Muktadha unahusu shughuli za kichawi, lakini nomino yenyewe ni pana kuliko “dhambi” au “uchawi.” “Matendo” huhifadhi upana huo na mvutano wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walikuwa wakija” unahifadhi hali ya tendo linaloendelea, na “wakiungama na kuweka wazi” unasomeka kwa urahisi huku ukitofautisha vitenzi viwili vya Kigiriki.
