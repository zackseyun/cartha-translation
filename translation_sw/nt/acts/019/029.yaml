  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: sw
  text: Mji ukajaa mkanganyiko, nao wakakimbilia kwa pamoja ndani ya ukumbi wa michezo, wakiwachukua kwa nguvu[a] Gayo na Aristarko, Wamakedonia waliokuwa wasafiri wenza wa Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwaburuta Gayo na Aristarko,” au “wakiwanyakuwa Gayo na Aristarko.” Neno la Kigiriki linasisitiza kuwachukua kwa nguvu; “wakiwaburuta” huonyesha pia mwendo wa umati kuelekea ndani ya ukumbi wa michezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: Mji wote ukajaa vurugu
  rationale: Muundo huu unahifadhi wazo la mji kujaa hali ya mkanganyiko na fujo. Neno 'vurugu' linafaa kwa muktadha wa umati wenye ghasia, bila kudokeza zaidi ya maandishi ya Kigiriki.
- source_word: ὥρμησάν
  choice: wakakimbilia
  rationale: Kitenzi kinaonyesha mwendo wa ghafla na wenye nguvu kuelekea mahali fulani; 'wakakimbilia' ni Kiswahili cha kawaida kinachoonyesha haraka na mwelekeo.
- source_word: ὁμοθυμαδόν
  choice: kwa pamoja
  rationale: Katika muktadha huu linaonyesha kitendo cha pamoja cha umati, si lazima umoja wenye maana chanya.
- source_word: θέατρον
  choice: ukumbi wa michezo
  rationale: Hili ni neno la kawaida la Kiswahili kwa jengo la umma la maonyesho na mikutano; haliongezi umahususi wa 'amfiteatri' ambao neno la Kigiriki halilazimishi.
- source_word: συναρπάσαντες
  choice: huku wakiwaburuta
  rationale: Ushiriki huu unaonyesha kuwakamata kwa nguvu na kwenda nao kuelekea ukumbini; 'wakiwaburuta' huhifadhi nguvu na mwendo wa tukio.
- source_word: Γάϊον
  choice: Gayo
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: Ἀρίσταρχον
  choice: Aristarko
  rationale: Jina limetoholewa kwa umbo linalofaa mfumo wa sauti wa Kiswahili.
- source_word: Μακεδόνας
  choice: watu wa Makedonia
  rationale: Hutoa wazi asili yao ya kijiografia kwa Kiswahili cha kawaida.
- source_word: συνεκδήμους Παύλου
  choice: waliokuwa wasafiri wenza wa Paulo
  rationale: Hueleza kwa usahihi watu waliokuwa wakisafiri pamoja na Paulo mbali na nyumbani.
