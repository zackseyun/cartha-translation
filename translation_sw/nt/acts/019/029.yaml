  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi inafuata mtiririko wa simulizi kwa viunganishi vya ‘uka-/waka-’. Alama ya tanbihi [a] imewekwa baada ya sentensi kwa kuwa inahusu uchaguzi wa kitenzi ndani ya kishazi cha pili.
