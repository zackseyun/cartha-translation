  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: sw
  text: Paulo akasema, “Yohana alibatiza kwa ubatizo wa toba, akiwaambia watu wamwamini yule anayekuja baada yake, yaani, Yesu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: alibatiza kwa ubatizo wa toba
  rationale: Muundo huu unahifadhi uradidi wa mzizi wa Kigiriki kati ya kitenzi na nomino, huku ‘kwa ubatizo’ ikiwa ya kawaida na wazi katika Kiswahili. ‘Toba’ inaonyesha tabia au maudhui ya ubatizo huo.
- source_word: τῷ λαῷ
  choice: watu
  rationale: ‘Watu’ ni rejeo la kijumla na haliongezi bayana kwamba ni umati au watu wa Israeli, jambo ambalo halijasemwa wazi katika kishazi hiki.
- source_word: λέγων
  choice: akiwaambia
  rationale: Huwasilisha tendo linaloambatana na kubatiza na kuanzisha ujumbe wa Yohana kwa Kiswahili cha kawaida.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: wamwamini yule anayekuja baada yake
  rationale: Pamoja na πιστεύω, εἰς humtaja anayelengwa na imani. ‘Anayekuja baada yake’ huhifadhi wazo la ujio na ufuatano bila kulifafanua kupita kiasi.
- source_word: ἵνα πιστεύσωσιν
  choice: wamwamini
  rationale: Baada ya kitenzi cha kusema, muundo huu unaeleza ujumbe au kusudi la agizo; utegemezi wa Kiswahili baada ya ‘akiwaambia’ ni wa asili na huhifadhi nguvu hiyo.
- source_word: τοῦτ’ ἔστιν
  choice: yaani
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachoonyesha ufafanuzi wa utambulisho unaofuata.
- source_word: εἰς τὸν Ἰησοῦν
  choice: Yesu
  rationale: Kitenzi ‘wamwamini’ kinaeleweka kuendelea katika kishazi cha ufafanuzi. Jina ‘Yesu’ limetolewa bila kuongeza cheo ambacho hakipo katika Kigiriki.
theological_decisions:
- issue: Uhusiano kati ya ubatizo wa Yohana na kumwamini Yesu
  choice: Ubatizo wa Yohana unaelezwa kuwa wa toba, na uliambatana na ujumbe wa kuwataka watu wamwamini yule ajaye, anayetambulishwa kuwa Yesu.
  alternative: Kusema kwamba ubatizo wa Yohana wenyewe ulisababisha imani ya Kikristo, au kuacha yule ajaye bila kutambulishwa.
  rationale: Sintaksia hutofautisha kitendo cha Yohana cha kubatiza na ujumbe aliowaambia watu, huku maneno ‘yaani, Yesu’ yakimtambulisha wazi yule anayekuja baada yake. Tafsiri haiongezi dai kuhusu athari ya kisakramenti ambalo mstari hausemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ‘alibatiza kwa ubatizo wa toba’ unadumisha uwazi wa usemi wa Kigiriki bila kuwa mgumu isivyo lazima.
