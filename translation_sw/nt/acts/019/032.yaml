base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: sw
  text: Basi wengine walikuwa wakipiga kelele wakisema jambo moja, na wengine wakisema jambo lingine; kwa maana kusanyiko[a] lilikuwa katika hali ya machafuko, na wengi wao hawakujua walikuwa wamekusanyika kwa sababu gani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkutano” au “umati.” Neno la Kigiriki ni ἐκκλησία, ambalo hapa linamaanisha kusanyiko la kiraia, si kanisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Basi, wengine walikuwa wakipiga kelele wakisema jambo moja, na wengine jambo lingine
  rationale: Muundo ἄλλοι ... ἄλλο τι unaonyesha tofauti kati ya makundi, huku wakati usiotimilika wa ἔκραζον ukionyesha kelele zilizoendelea. ‘Basi’ inawakilisha μὲν οὖν kwa njia ya kawaida katika Kiswahili.
- source_word: ἐκκλησία
  choice: kusanyiko
  rationale: Katika muktadha huu neno linamaanisha mkutano wa watu wa mjini, si kanisa. ‘Kusanyiko’ ni pana na linafaa kwa mkutano huu wa hadhara.
- source_word: συγκεχυμένη
  choice: lilikuwa katika vurugu
  rationale: Kitenzi hiki kinaeleza hali iliyotokana na kuchanganyikiwa na kukosa utaratibu. ‘Katika vurugu’ linafaa zaidi kwa tukio hili la umati wenye makelele kuliko ‘limechanganyikiwa’.
- source_word: οἱ πλείους
  choice: wengi wao
  rationale: Muundo huu unamaanisha walio wengi katika kusanyiko; ‘wengi wao’ ni Kiswahili cha kawaida na kinaonyesha rejeo hilo wazi.
- source_word: τίνος ἕνεκα
  choice: kwa nini
  rationale: Hii ni njia ya kawaida na fupi ya Kiswahili ya kueleza ‘kwa sababu gani’ au ‘kwa kusudi gani,’ huku ikihifadhi upana wa swali.
- source_word: συνεληλύθεισαν
  choice: walikuwa wamekusanyika
  rationale: Wakati timilifu uliopita unaonyesha kwamba kukusanyika kulitokea kabla ya hali inayosimuliwa. ‘Walikuwa wamekusanyika’ huhifadhi uhusiano huo wa wakati.
theological_decisions:
- issue: Maana ya ἐκκλησία katika muktadha huu
  choice: kusanyiko la kiraia au la hadhara, si kanisa
  alternative: kanisa
  rationale: Muktadha wa ghasia za mjini unaonyesha mkutano wa wananchi; kutafsiri ‘kanisa’ kungeingiza maana ya kidini isiyokusudiwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kupiga kelele wakisema’ huwasilisha kwa kawaida tendo la kuendelea la ἔκραζον, na ‘katika vurugu’ linaonyesha hali ya mkutano usio na utaratibu.
