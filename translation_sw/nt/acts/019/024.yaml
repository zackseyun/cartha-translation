  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: sw
  text: Kwa maana mtu mmoja aitwaye Demetrio, fundi wa fedha aliyekuwa akitengeneza mahekalu ya fedha ya Artemi[a], alikuwa akiwapatia mafundi shughuli nyingi ya biashara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifano ya fedha ya hekalu la Artemi.” Neno la Kigiriki ni “mahekalu”; katika muktadha huu huenda linarejelea vitu vidogo vilivyotengenezwa vinavyohusiana na ibada ya Artemi.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, “biashara isiyo ndogo,” usemi wa kukataa kinyume unaomaanisha shughuli nyingi ya biashara au mapato mengi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba mstari huu unatoa maelezo ya msingi kuhusu tukio lililotangulia.
- source_word: Δημήτριος ... ὀνόματι
  choice: mtu mmoja aliyeitwa Demetrio
  rationale: Kiswahili cha kawaida hutumia muundo huu kumtambulisha mtu maalumu ambaye hajatajwa hapo awali; jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἀργυροκόπος
  choice: fundi wa fedha
  rationale: Ni usemi wa asili na unaoeleweka kwa mtu mwenye ustadi wa kutengeneza vitu kwa fedha.
- source_word: ποιῶν
  choice: aliyetengeneza
  rationale: Kishazi tegemezi kinaonyesha kazi ya kawaida ya Demetrio kwa lugha ya Kiswahili iliyo wazi.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: vihekalu vya fedha vya Artemi
  rationale: ‘Vihekalu’ hudokeza vitu vidogo vya ibada bila kuamua kwa uhakika kama vilikuwa sanamu ndogo za jengo au aina nyingine ya madhabahu; ‘Artemi’ huhifadhi jina la Kigiriki.
- source_word: παρείχετο
  choice: alikuwa akiwapatia
  rationale: Muundo huu unawakilisha tendo lililoendelea au la kawaida linaloonyeshwa na imperfect ya Kigiriki.
- source_word: τοῖς τεχνίταις
  choice: mafundi
  rationale: Neno hili linawahusu wafanyakazi wenye ustadi katika biashara hiyo na ni la kawaida katika Kiswahili.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: biashara kubwa
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya litotes ya Kigiriki—biashara au mapato mengi—bila kutumia usemi usio wa kawaida ‘si biashara ndogo.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Vihekalu’ kimetumiwa kuhifadhi udogo unaodokezwa na muktadha wa bidhaa zilizotengenezwa, huku tanbihi ikihifadhi uwezekano wa maana nyingine. Litotes imewasilishwa kwa maana yake ya kawaida katika matini, na muundo halisi umeelezwa katika tanbihi.
