  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: sw
  text: Akasema, “Basi, mlibatizwa kwa ubatizo gani?” Nao wakasema, “Kwa ubatizo wa Yohana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: Akasema
  rationale: Kitenzi λέγω kimetafsiriwa moja kwa moja kuwa ‘kusema.’ Muunganiko hafifu wa τε unaeleweka katika mwendelezo wa simulizi, bila kulazimika kuongezwa neno tofauti.
- source_word: Εἰς τί οὖν
  choice: Basi, ... katika nini?
  rationale: ‘Basi’ linaonyesha hitimisho au hatua inayofuata katika mazungumzo, huku ‘katika nini’ likihifadhi εἰς na ulinganifu wake na jibu.
- source_word: ἐβαπτίσθητε
  choice: mlibatizwa
  rationale: Umbo la kutendwa la wakati uliopita limetolewa kwa kitenzi cha kawaida cha Kiswahili ‘mlibatizwa,’ bila kuligeuza kuwa maelezo marefu.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: Katika ubatizo wa Yohana
  rationale: ‘Katika’ linarudia maana ya εἰς kama ilivyo katika swali, na ‘ubatizo wa Yohana’ ni namna ya asili ya kuonyesha uhusiano wa nomino hizi katika Kiswahili.
- source_word: βάπτισμα
  choice: ubatizo
  rationale: ‘Ubatizo’ ndilo neno lililozoeleka na sahihi kwa ibada inayotajwa hapa; haliongezi maelezo ya kimadhehebu.
theological_decisions:
- issue: Kuhifadhi kihusishi εἰς katika swali na jibu
  choice: Kutumia ‘katika’ katika sehemu zote mbili
  alternative: ‘Mlibatizwa kwa ubatizo gani?’ / ‘Kwa ubatizo wa Yohana’
  rationale: Kurudia ‘katika’ kunahifadhi ulinganifu wa Kigiriki na wazo la kuhusishwa na ubatizo fulani, bila kufafanua kimadhehebu maana kamili ya uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. ‘Katika nini’ ni usemi uliotiwa alama kidogo lakini unahifadhi muundo na mvutano wa maandishi ya Kigiriki; tanbihi inatoa usemi wa kawaida zaidi.
