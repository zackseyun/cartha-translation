id: ACT.19.14
reference: Acts 19:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: sw
  text: Kulikuwa na wana saba wa Skeva fulani, kuhani mkuu Myahudi, waliokuwa wakifanya hivyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhani wa cheo cha juu.” Neno la Kigiriki linaweza kumaanisha Kuhani Mkuu au, kwa upana zaidi, kuhani mwenye cheo cha juu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Kulikuwa na
  rationale: Kauli hii huendeleza simulizi na kutambulisha wahusika bila kulazimisha utofautishaji mkali ambao δέ si lazima iwe nao hapa.
- source_word: τινος Σκευᾶ
  choice: wa Skeva
  rationale: τινος humtambulisha mtu asiyeelezwa zaidi; katika Kiswahili, jina Skeva bila neno kama “fulani” ni la kawaida na haliongezi udharau au msisitizo usiokuwapo.
- source_word: Ἰουδαίου
  choice: wa Kiyahudi
  rationale: Hapa neno linaeleza utambulisho wa kidini na kikabila, si mahali alikotoka tu.
- source_word: ἀρχιερέως
  choice: kuhani mkuu
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya ἀρχιερεύς, huku tanbihi ikihifadhi uwezekano wa maana pana ya kuhani mwenye cheo cha juu.
- source_word: ἑπτὰ υἱοὶ
  choice: wana saba
  rationale: Tafsiri ya moja kwa moja na ya asili ya idadi pamoja na uhusiano wa kifamilia.
- source_word: τοῦτο ποιοῦντες
  choice: waliokuwa wakifanya hivyo
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea na kurejelea jambo lililotajwa katika muktadha uliotangulia.
theological_decisions:
- issue: Maana ya ἀρχιερεύς inapomhusu Skeva
  choice: kuhani mkuu
  alternative: mmoja wa makuhani wakuu / kuhani mwenye cheo cha juu
  rationale: Neno la Kigiriki linaweza kumaanisha Kuhani Mkuu au, kwa matumizi mapana, mtu wa tabaka la makuhani wakuu. Matini kuu inatumia tafsiri ya kawaida, na tanbihi inaacha wazi uwezekano huo wa maana pana bila kudai kuwa Skeva alikuwa lazima ndiye Kuhani Mkuu rasmi wa Yerusalemu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Wana saba” ni cha asili zaidi kuliko “watoto saba wa kiume” katika muktadha huu; “waliokuwa wakifanya hivyo” huunganisha aya hii na tendo la aya iliyotangulia.
