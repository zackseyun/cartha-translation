revisions:
- from: Kulikuwa na wana saba wa Skeva, kuhani mkuu wa Kiyahudi, waliokuwa wakifanya hivyo.[a]
  to: Kulikuwa na wana saba wa Skeva fulani, kuhani mkuu Myahudi, waliokuwa wakifanya hivyo.[a]
  rationale: The revision restores the indefinite introduction of Sceva with ‘fulani,’ retains the ongoing sense of the participle, and refines the footnote so that it reflects the semantic range of ἀρχιερεύς without making a stronger historical or institutional claim than the text warrants.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:38:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the seven sons and their ongoing practice, but it omits the source's indefinite identification of Sceva (τινος, ‘a certain Sceva’). Its main rendering of ἀρχιερεύς is possible, though the accompanying note should more precisely distinguish the singular high-priest sense from the broader chief-priest/high-priestly sense.
  naturalness: The sentence is generally natural Standard East African Swahili. Adding ‘fulani’ after the name is idiomatic in this context and preserves the Greek’s unspecified introduction. ‘Kuhani mkuu Myahudi’ is smoother and more direct than ‘kuhani mkuu wa Kiyahudi.’
  terminology: ‘Kuhani mkuu’ is an acceptable primary rendering of ἀρχιερεύς, provided the footnote preserves its broader usage without implying that Sceva certainly held the singular Jerusalem office. The note’s proposed wording ‘mmoja wa makuhani wakuu’ is interpretive and plural where the Greek noun is singular; ‘kuhani wa cheo cha juu’ is safer as the alternative.
  issues:
  - severity: medium
    issue: The indefiniteness of τινος is not represented.
    rationale: ‘Wa Skeva’ identifies Sceva without indicating that he is introduced as an otherwise unspecified person. ‘Skeva fulani’ naturally preserves this feature in Swahili.
  - severity: medium
    issue: The footnote gives a potentially over-specific plural alternative for singular ἀρχιερεύς.
    rationale: Although the term can denote a chief-priestly figure, ‘mmoja wa makuhani wakuu’ introduces a plural class formulation not expressed by the singular Greek. A singular ‘kuhani wa cheo cha juu’ preserves the broader sense more closely.
  revised_text: Kulikuwa na wana saba wa Skeva fulani, kuhani mkuu Myahudi, waliokuwa wakifanya hivyo.[a]
  revised_footnotes:
  - marker: a
    text: Au, “kuhani wa cheo cha juu.” Neno la Kigiriki linaweza kumaanisha Kuhani Mkuu au, kwa upana zaidi, kuhani mwenye cheo cha juu.
    reason: alternative_reading
  revision_rationale: The revision restores the indefinite introduction of Sceva with ‘fulani,’ retains the ongoing sense of the participle, and refines the footnote so that it reflects the semantic range of ἀρχιερεύς without making a stronger historical or institutional claim than the text warrants.
