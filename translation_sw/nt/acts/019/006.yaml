  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya msingi ya Kigiriki: kishazi cha wakati kuhusu Paulo kuweka mikono, kuja kwa Roho Mtakatifu juu yao, na madhihirisho mawili yaliyounganishwa ya kunena kwa lugha na kutoa unabii. “Wakaanza” ni uwasilishaji unaowezekana wa imperfect katika muktadha huu wa masimulizi na unaendana na mkondo wa ukaguzi wa Kiingereza, bila kuongeza fundisho kuhusu tukio lenyewe.'
