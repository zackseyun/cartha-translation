  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: sw
  text: Paulo alipoweka mikono juu yao, Roho Mtakatifu akaja juu yao, nao wakaanza kunena kwa lugha[a] na kutoa unabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ndimi.” Neno la Kigiriki linaweza kumaanisha “ndimi” au “lugha”; maandishi makuu hayaamui kati ya maana hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: Paulo alipoweka mikono juu yao
  rationale: Kirai huru cha hali katika wakati uliopita kimetafsiriwa kwa kishazi cha wakati kinachosikika kwa kawaida katika Kiswahili, huku nahau ya kuweka mikono ikihifadhiwa.
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: Roho Mtakatifu akaja juu yao
  rationale: Huhifadhi wazo la kuja kwa Roho juu yao bila kuongeza maelezo kuhusu jinsi tukio hilo lilivyotokea au maana yake ya kimafundisho.
- source_word: ἐλάλουν
  choice: wakaanza kunena
  rationale: Wakati usiotimilika katika muktadha huu wa masimulizi unaweza kuonyesha tendo lililoanza na kuendelea; ‘wakaanza kunena’ huonyesha mwanzo wa jambo lililotokea baada ya Roho kuja.
- source_word: γλώσσαις
  choice: kwa lugha
  rationale: ‘Kunena kwa lugha’ ni usemi unaoeleweka katika Kiswahili cha sasa na hauelezi kwa lazima kama usemi huo ulikuwa lugha za kawaida za wanadamu au aina nyingine ya usemi; tanbihi inaonyesha uwezekano wa ‘ndimi.’
- source_word: ἐπροφήτευον
  choice: kutoa unabii
  rationale: ‘Kutoa unabii’ huonyesha kusema ujumbe wa kinabii bila kuufanya unabii huo uwe utabiri wa matukio yajayo pekee.
theological_decisions:
- issue: Maana ya γλώσσαις katika Matendo 19:6
  choice: kwa lugha
  alternative: kwa ndimi
  rationale: Neno la Kigiriki linaweza kutaja ndimi au lugha. Tafsiri kuu na tanbihi zinahifadhi uwezekano huo bila kuamua mjadala wa kimadhehebu kuhusu hali halisi ya usemi huu.
- issue: Kuja kwa Roho Mtakatifu juu yao
  choice: Roho Mtakatifu akaja juu yao
  alternative: Roho Mtakatifu akawashukia
  rationale: ‘Akaja juu yao’ hufuata kwa karibu mwendo unaoelezwa na ἦλθε ... ἐπ’ αὐτούς na huepuka kuongeza dhana ya kushuka ambayo haijasemwa wazi katika kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Kunena’ na ‘kutoa unabii’ ni misemo ya kibiblia iliyozoeleka, lakini bado ni wazi katika matumizi ya sasa.
