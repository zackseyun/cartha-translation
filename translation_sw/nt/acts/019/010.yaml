  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: sw
  text: Jambo hilo likaendelea kwa miaka miwili, hivi kwamba wote waliokuwa wakiishi Asia[a] wakalisikia neno la Bwana, Wayahudi na Wayunani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jimbo la Roma la Asia, lililokuwa magharibi mwa Asia Ndogo, si bara la Asia la leo.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Jambo hilo likaendelea
  rationale: Ingawa ἐγένετο kwa kawaida inaweza kumaanisha ‘likatokea’ au ‘likafanyika,’ hapa τοῦτο inarejelea utaratibu wa kufundisha uliotajwa katika mstari uliotangulia na uliodumu kwa muda. ‘Likaendelea’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐπὶ ἔτη δύο
  choice: kwa miaka miwili
  rationale: ἐπί pamoja na muda katika hali ya accusative huonyesha kipindi ambacho jambo lilidumu; ‘kwa miaka miwili’ ni usemi wa kawaida na sahihi.
- source_word: ὥστε
  choice: hivi kwamba
  rationale: ὥστε hutambulisha matokeo ya jambo lililotangulia. ‘Hivi kwamba’ huhifadhi uhusiano huo wa kimatokeo bila kuufanya kuwa kusudi.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: wote waliokuwa wakiishi Asia
  rationale: Kirai hiki kinawahusu watu wote waliokuwa wakikaa katika eneo hilo. Muundo huu ni wa asili kwa Kiswahili na huhifadhi upeo wa πάντας.
- source_word: ἀκοῦσαι
  choice: wakalisikia
  rationale: Kitenzi hiki kinaonyesha matokeo kwamba watu hao walisikia. Kiambishi ‘-li-’ kinarejelea ‘neno’ na kufanya sentensi iwe wazi na ya kawaida kwa Kiswahili.
- source_word: τὸν λόγον
  choice: neno
  rationale: λόγος hapa ni ujumbe uliotangazwa, lakini ‘neno’ huhifadhi istilahi inayojirudia katika Matendo na uzito wake wa kitheolojia.
- source_word: τοῦ κυρίου
  choice: la Bwana
  rationale: Kirai cha genitive kinarekebisha ‘neno’; ‘neno la Bwana’ ni tafsiri ya moja kwa moja, ya asili, na yenye heshima.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: Wayahudi na Wayunani pia
  rationale: τε καὶ huunganisha makundi yote mawili kwa namna jumuishi. ‘Wayahudi na Wayunani pia’ huonyesha kwamba madai ya ‘wote’ yanahusisha makundi yote mawili.
theological_decisions:
- issue: Maana ya ‘Asia’
  choice: Asia ni jimbo la Roma lililokuwa magharibi mwa Asia Ndogo.
  alternative: Asia kama bara lote linaloitwa Asia leo.
  rationale: Katika Matendo, Ἀσία kwa kawaida ni jina la jimbo la Roma. Jina ‘Asia’ limehifadhiwa katika mstari, huku tanbihi ikizuia msomaji kulielewa kwa maana ya bara la kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ‘likaendelea … wakalisikia’ unaendana na mfuatano wa matukio, huku ‘hivi kwamba’ ikihifadhi maana ya matokeo.
