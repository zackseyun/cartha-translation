  to: Lakini baadhi yao walipoendelea kuwa wagumu wa moyo na kukataa kushawishika[a], huku wakiikashifu Njia[b] mbele ya umati, Paulo akajiondoa kwao na akawatenganisha wanafunzi nao. Kila siku alikuwa akijadiliana katika ukumbi wa mihadhara wa Tirano[c].
