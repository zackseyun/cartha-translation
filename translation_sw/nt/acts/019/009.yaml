id: ACT.19.9
reference: Acts 19:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: sw
  text: Lakini baadhi yao walipoendelea kuwa wagumu wa moyo na kukataa kushawishika[a], huku wakiikashifu Njia[b] mbele ya umati, Paulo akajiondoa kwao na akawatenganisha wanafunzi nao. Kila siku alikuwa akijadiliana katika ukumbi wa mihadhara wa Tirano[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutotii” au “kutoamini.”
    reason: lexical_alternative
  - marker: b
    text: “Njia” lilikuwa jina la awali lililotumiwa katika Matendo kwa harakati ya wafuasi wa Yesu.
    reason: cultural_note
  - marker: c
    text: Au “shule ya Tirano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: walipozidi kuwa na mioyo migumu
  rationale: Kauli ya wakati usiotimilika inaonyesha hali ya ukaidi iliyoendelea. Usemi huu ni wa kawaida katika Kiswahili na hauamui wazi iwapo walijifanya wagumu au walifanywa wagumu.
- source_word: ἠπείθουν
  choice: kukataa kushawishika
  rationale: Kitenzi kinaweza kumaanisha kutotii, kutoamini, au kutokubali kushawishika. Chaguo hili linaonyesha upinzani wao wa makusudi huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: κακολογοῦντες
  choice: wakisema mabaya juu ya
  rationale: Huwasilisha maneno yao ya hadharani yenye uhasama bila kuongeza maana maalumu ya kisheria kama vile kashfa.
- source_word: τὴν ὁδὸν
  choice: Njia
  rationale: Katika Matendo, neno hili linatumika kama jina linalotambulika la harakati ya wafuasi wa Yesu. Herufi kubwa na tanbihi humsaidia msomaji kutambua matumizi hayo.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: mbele ya umati
  rationale: Ni tafsiri fupi na ya kawaida inayoonyesha kuwa upinzani huo ulifanywa hadharani.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: akajitenga nao
  rationale: Inaonyesha hatua ya Paulo ya kuondoka na kuvunja ushirika wake na kundi lililokuwa likipinga.
- source_word: ἀφώρισεν
  choice: kuwatenga
  rationale: Inahifadhi wazo la Paulo kuwatenganisha wanafunzi kwa makusudi na wapinzani.
- source_word: τοὺς μαθητάς
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wafuasi wanaojifunza chini ya mwalimu katika muktadha huu.
- source_word: καθ’ ἡμέραν
  choice: Kila siku
  rationale: Inaonyesha kwa lugha ya kawaida kwamba shughuli hiyo ilifanyika siku baada ya siku.
- source_word: διαλεγόμενος
  choice: alikuwa akijadiliana
  rationale: Kitenzi hiki katika Matendo huonyesha mazungumzo ya hoja na ushawishi; 'akijadiliana' huhifadhi hali ya kubadilishana mawazo kuliko mahubiri ya upande mmoja.
- source_word: σχολῇ
  choice: ukumbi wa mihadhara
  rationale: Katika muktadha huu σχολή ni mahali pa kufundishia au kujadiliana. 'Ukumbi wa mihadhara' huepuka kuwafanya wasomaji wafikirie shule ya kisasa.
- source_word: Τυράννου
  choice: Tirano
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku umbo la umilikaji likitolewa kwa 'wa Tirano'.
theological_decisions:
- issue: Maana ya ἠπείθουν katika mwitikio wa wapinzani
  choice: kukataa kushawishika
  alternative: kutotii; kutoamini
  rationale: Chaguo kuu linaonyesha kukataa kwao ujumbe kwa makusudi bila kupunguza kitenzi kuwa hali ya kiakili tu; tanbihi huhifadhi upana wake wa kimaana.
- issue: Kutafsiri τὴν ὁδὸν kama jina la harakati
  choice: Njia, ikiwa na herufi kubwa
  alternative: njia kama njia au mafundisho kwa ujumla
  rationale: Katika Matendo, usemi huu hutumika kama jina linalotambulika la harakati ya wafuasi wa Yesu. Herufi kubwa huonyesha matumizi hayo bila kuingiza mafundisho ya dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi. 'Mioyo migumu' ni nahau inayoeleweka, na 'akijadiliana' huhifadhi wazo la mazungumzo yenye hoja.
