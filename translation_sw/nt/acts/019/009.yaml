    rationale: The source has ἀποστὰς ἀπ’ αὐτῶν followed by ἀφώρισεν τοὺς μαθητάς. The draft's 'akajitenga nao na kuwatenga wanafunzi' is possible, but does not explicitly identify the opponents as those from whom the disciples were separated.
  - severity: low
    issue: The expression for becoming hardened can more closely reflect the ongoing imperfect aspect.
    rationale: '''Walipoendelea kuwa wagumu wa moyo'' expresses continuing hardening/stubbornness naturally, without adding an agent.'
