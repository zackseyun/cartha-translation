id: ACT.19.16
reference: Acts 19:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: sw
  text: Mtu yule ambaye ndani yake kulikuwa na roho mwovu akawarukia[a]; baada ya kuwatawala wote wawili[b], akawazidi nguvu, hata wakatoroka[c] kutoka katika nyumba ile wakiwa uchi na wamejeruhiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawavamia kwa kuruka.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “wote wawili.” Ingawa muktadha mpana unataja zaidi ya wana wawili wa Skewa, maandishi hapa yanasema wazi “wote wawili”; kwa hiyo tafsiri inadumisha usemi huo.
    reason: alternative_reading
  - marker: c
    text: Au, “wakakimbia kutoka katika nyumba ile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: akawarukia
  rationale: Kitenzi hiki kinaonyesha tendo la ghafla la kumrukia mtu kwa nguvu. “Akawarukia” ni Kiswahili cha kawaida na chenye picha hai ya shambulio hilo.
- source_word: ὁ ἄνθρωπος
  choice: Yule mtu
  rationale: Nomino ni ya umoja wa kiume na inamrejelea mtu aliyetajwa katika simulizi. “Yule mtu” ni ya kawaida na inadumisha urejeo huo.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: ambaye roho mwovu alikuwa ndani yake
  rationale: Hii inafuata kwa karibu maelezo ya Kigiriki kwamba roho alikuwa ndani ya mtu, bila kuingiza istilahi ya kiufundi isiyosemwa moja kwa moja.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: roho mwovu
  rationale: Hili ndilo neno la kawaida na lililo wazi katika Kiswahili kwa roho mwenye uovu katika muktadha huu.
- source_word: κατακυριεύσας
  choice: baada ya kuwashinda
  rationale: Neno linaonyesha kupata mamlaka au ubwana juu yao kwa nguvu. “Kuwashinda” linaeleza ushindi huo wa kimwili kwa lugha ya kawaida.
- source_word: ἀμφοτέρων
  choice: wote wawili
  rationale: Kigiriki kinataja wawili waziwazi. Tafsiri inadumisha maelezo hayo hata ingawa muktadha mpana unataja kundi lenye watu zaidi ya wawili.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: akawazidi nguvu
  rationale: Kirai hiki kinamaanisha kuwa mwenye nguvu kuliko wao au kuwashinda kwa nguvu. “Akawazidi nguvu” kinadumisha wazo hilo bila kulimeza katika kitenzi kilichotangulia.
- source_word: γυμνούς
  choice: wakiwa uchi
  rationale: Kigiriki kinataja hali yao ya kuwa uchi, si kwa uwazi namna nguo zao zilivyoondolewa.
- source_word: τετραυματισμένους
  choice: wamejeruhiwa
  rationale: Kauli hii inaonyesha kwamba walikuwa wamepata majeraha na waliendelea kuwa katika hali hiyo walipokimbia.
- source_word: ἐκφυγεῖν
  choice: wakakimbia
  rationale: Katika kishazi cha matokeo, neno linaweza kueleza kukimbia au kutoroka. “Wakakimbia” ni la asili katika simulizi, huku tanbihi ikihifadhi uwezekano wa “wakatoroka.”
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: kutoka katika nyumba ile
  rationale: Kirai kinaonyesha kuondoka kimwili ndani ya nyumba maalumu iliyotajwa.
theological_decisions:
- issue: Lugha kuhusu kukaliwa na roho mwovu
  choice: mtu ambaye roho mwovu alikuwa ndani yake
  alternative: mtu aliyepagawa na roho mwovu
  rationale: Kigiriki kinasema roho alikuwa ndani ya mtu. Tafsiri inadumisha muundo huo badala ya kutumia istilahi ya baadaye yenye uwezekano wa kubeba ufafanuzi wa ziada.
- issue: Upeo wa ἀμφοτέρων ukilinganishwa na kundi lililotajwa katika muktadha
  choice: wote wawili
  alternative: wote
  rationale: Ingawa muktadha mpana unataja wana wengi wa Skewa, maandishi ya mstari huu yanasema “wote wawili.” Tafsiri haiondoi mvutano huo wa maandishi wala kuamua kimya-kimya jinsi unavyopaswa kufafanuliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. Mfuatano wa matendo ya Kigiriki umehifadhiwa, pamoja na tofauti kati ya kuwashinda na kuwazidi nguvu. Kila alama ya tanbihi imetiwa katika matini kuu.
