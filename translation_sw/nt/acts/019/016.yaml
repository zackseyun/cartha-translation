revisions:
- from: Yule mtu ambaye roho mwovu alikuwa ndani yake akawarukia[a]; baada ya kuwashinda wote wawili[b], akawazidi nguvu, hata wakakimbia[c] kutoka katika nyumba ile wakiwa uchi na wamejeruhiwa.
  to: Mtu yule ambaye ndani yake kulikuwa na roho mwovu akawarukia[a]; baada ya kuwatawala wote wawili[b], akawazidi nguvu, hata wakatoroka[c] kutoka katika nyumba ile wakiwa uchi na wamejeruhiwa.
  rationale: The revision makes the opening clause idiomatic without adopting a later technical term for possession, renders the mastery nuance of κατακυριεύσας distinctly from the subsequent ‘prevailed/was stronger,’ and uses “wakatoroka” for the result expressed by ἐκφυγεῖν. The dual wording and all footnote anchors are retained.
