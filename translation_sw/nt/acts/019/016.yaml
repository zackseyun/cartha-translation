review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence and force of the Greek well: the man with the evil spirit leaps upon the group, gains mastery over ‘both,’ proves stronger than them, and they leave the house naked and wounded. The explicit dual is correctly retained with an explanatory note. A small revision improves the rendering of κατακυριεύσας and of the result verb ἐκφυγεῖν.'
  naturalness: The opening relative construction, “ambaye roho mwovu alikuwa ndani yake,” is understandable but somewhat heavy and permits an unnatural agreement question. “ambaye ndani yake kulikuwa na roho mwovu” is idiomatic, neutral, and accurately expresses the Greek clause. “Wakatoroka” naturally conveys escape in this result clause more fully than “wakakimbia.”
  terminology: “Roho mwovu,” “uchi,” and “wamejeruhiwa” are appropriate Standard East African Swahili biblical terms. “Kuwatawala” better represents κατακυριεύσας (‘gain mastery/dominion over’) while preserving its distinction from the following ἴσχυσεν, “akawazidi nguvu.”
  issues:
  - severity: low
    issue: Opening relative clause is stylistically awkward
    rationale: “Yule mtu ambaye roho mwovu alikuwa ndani yake” is intelligible, but “Mtu yule ambaye ndani yake kulikuwa na roho mwovu” is more natural Swahili and avoids an unnecessary issue of verbal agreement with roho.
  - severity: medium
    issue: κατακυριεύσας is slightly weakened by “kuwashinda”
    rationale: Because the following phrase already expresses prevailing/being stronger, “kuwatawala” more clearly renders the prior idea of gaining mastery over them and maintains the Greek distinction.
  - severity: low
    issue: ἐκφυγεῖν is better rendered as escape than merely run
    rationale: “Wakatoroka” expresses the successful escape denoted by ἐκφυγεῖν; the alternative “wakakimbia” may remain in the footnote.
  revised_text: Mtu yule ambaye ndani yake kulikuwa na roho mwovu akawarukia[a]; baada ya kuwatawala wote wawili[b], akawazidi nguvu, hata wakatoroka[c] kutoka katika nyumba ile wakiwa uchi na wamejeruhiwa.
