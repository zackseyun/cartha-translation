base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: sw
  text: Lakini roho mwovu akawajibu[a], “Yesu namjua, na Paulo namtambua—lakini ninyi ni nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Yesu namjua, na habari za Paulo ninazijua.” Kigiriki kinatumia vitenzi viwili tofauti: γινώσκω (“kujua”) na ἐπίσταμαι, ambacho huenda kikaonyesha tofauti fulani ya maana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν δὲ ... εἶπεν αὐτοῖς
  choice: Lakini ... akawajibu
  rationale: Muundo wa kishiriki pamoja na kitenzi cha kusema unatolewa kwa Kiswahili cha kawaida kama kitenzi kimoja, “akawajibu,” huku “Lakini” ikihifadhi mgeuko wa δέ na kiambishi -wa- kikionyesha walioambiwa.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: roho mwovu
  rationale: Hili ni tamko la kawaida na wazi kwa kiumbe wa kiroho mwenye uovu; upatanisho wa kisarufi wa ngeli unahitaji “mwovu.”
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Yesu namjua
  rationale: Mpangilio huu unaweka “Yesu” mbele kwa msisitizo kama katika Kigiriki, na “namjua” ni tafsiri ya moja kwa moja na ya kawaida ya γινώσκω.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: Paulo namtambua
  rationale: “Namtambua” huhifadhi, bila kuufafanua kupita kiasi, utofauti wa kitenzi hiki na γινώσκω; inaweza kumaanisha kumfahamu au kujua habari zake kulingana na muktadha.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: lakini ninyi ni nani?
  rationale: “Ninyi” huonyesha wazi wingi na msisitizo wa ὑμεῖς, huku “lakini” ikibainisha utofauti kati yao na Yesu pamoja na Paulo.
theological_decisions:
- issue: Utofauti kati ya γινώσκω na ἐπίσταμαι katika maneno ya roho mwovu
  choice: “Yesu namjua, na Paulo namtambua”
  alternative: “Yesu namjua, na kuhusu Paulo ninajua” au kutumia “namjua” kwa wote wawili
  rationale: Vitenzi viwili tofauti vya Kigiriki vinaweza kuwa na utofauti wa kinuuansi. Kutumia “namjua” na “namtambua” kunahifadhi utofauti huo bila kudai viwango maalumu vya maarifa ya pepo ambavyo mstari wenyewe hauweki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa moja kwa moja wa usemi na “ninyi” hudumisha msisitizo, huku dashibodi ndefu ikiweka wazi mgeuko mkali wa swali la mwisho.
