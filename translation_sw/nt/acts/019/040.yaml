source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: sw
  text: Kwa maana, kwa kweli, tuko katika hatari ya kushtakiwa kwa ghasia kwa sababu ya yaliyotokea leo[a], kwa kuwa hakuna sababu halali ambayo tunaweza kutoa maelezo kuhusu mkusanyiko huu wenye fujo[b]. Baada ya kusema hayo, akalivunja kusanyiko[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa uasi” au “kwa maasi.” Neno la Kigiriki linaweza kumaanisha uasi mkubwa wa kiraia, lakini hapa “ghasia” linafaa zaidi muktadha wa vurugu ya hadharani.
    reason: lexical_alternative
  - marker: b
    text: Au “vurugu hii” au “kundi hili la watu.” Neno la Kigiriki linarejelea mkusanyiko huu wa vurugu na ni tofauti na neno rasmi zaidi lililotafsiriwa “kusanyiko” baadaye katika mstari.
    reason: lexical_alternative
  - marker: c
    text: Neno lililotafsiriwa “kusanyiko” ndilo neno lilelile la Kigiriki ambalo mara nyingi hutafsiriwa “kanisa” mahali pengine, lakini hapa linarejelea kusanyiko la kiraia huko Efeso.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: tuna hatari
  rationale: Kitenzi cha wakati uliopo kinaonyesha hatari iliyopo wakati huo; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: ἐγκαλεῖσθαι
  choice: kushtakiwa
  rationale: Kitenzi hiki kina maana ya kisheria ya kuwekewa shtaka, inayofaa onyo la karani kuhusu mamlaka za kiraia.
- source_word: στάσεως
  choice: kwa ghasia
  rationale: Katika muktadha huu neno linamaanisha vurugu kubwa ya kiraia; “ghasia” linahifadhi uzito huo bila kudai wazi kwamba ulikuwa uasi wa kisiasa uliopangwa.
- source_word: περὶ τῆς σήμερον
  choice: kuhusu yaliyotokea leo
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya usemi mfupi wa Kigiriki unaorejelea tukio la siku hiyo.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: kwa kuwa hakuna sababu yoyote ya ghasia hizo
  rationale: Kirai hiki kinaonyesha kutokuwapo kwa msingi halali wa tukio; kurejelea “ghasia hizo” hufanya uhusiano wa sentensi uwe wazi katika Kiswahili.
- source_word: ἀποδοῦναι λόγον
  choice: kutoa maelezo
  rationale: Nahau hii humaanisha kueleza au kujibu rasmi kuhusu jambo; “kutoa maelezo” ni ya asili na inafaa mazingira ya uwajibikaji kwa mamlaka.
- source_word: συστροφῆς
  choice: mkusanyiko huu wenye fujo
  rationale: Neno linaweza kutaja kukusanyika kwa watu kwa namna ya vurugu. Tafsiri hii kulitofautisha na ἐκκλησία, kusanyiko lenyewe, baadaye katika mstari.
- source_word: ἐκκλησίαν
  choice: kusanyiko
  rationale: Hapa neno linarejelea kusanyiko la kiraia huko Efeso, si kanisa; “kusanyiko” huhifadhi maana ya mkutano wa watu bila kuingiza maana ya kidini.
- source_word: ἀπέλυσεν
  choice: akalitawanya
  rationale: Katika muktadha wa mkutano, kitenzi kinamaanisha kuumaliza na kuwaacha waliohudhuria waondoke; “akalitawanya kusanyiko” ni usemi wa kawaida wa Kiswahili.
- source_word: καὶ γὰρ
  choice: Kwa maana kweli
  rationale: “Kwa maana” linaonyesha kuwa kauli inaeleza onyo lililotangulia, na “kweli” linahifadhi msisitizo wa γάρ pamoja na καί.
