  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha muktadha wa kisheria na wa kiraia, huku ikitofautisha “mkusanyiko huu wenye fujo” na “kusanyiko” bila kulifanya neno ἐκκλησία liwe na maana ya kanisa katika muktadha huu.
