  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: sw
  text: Alipoingia katika sinagogi, alisema kwa ujasiri kwa muda wa miezi mitatu, akijadiliana nao na kuwashawishi kuhusu ufalme wa Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: Kisha akaingia
  rationale: Kirai hiki kinaendeleza simulizi na kuweka tendo la kuingia kabla ya tendo kuu. ‘Kisha akaingia’ ni Kiswahili cha kawaida kinachowasilisha mfuatano huo bila kufanya sentensi kuwa nzito.
- source_word: συναγωγήν
  choice: sinagogini
  rationale: Neno hili linataja mahali maalumu pa ibada na mikutano ya Wayahudi; ‘sinagogi’ ni istilahi iliyozoeleka na sahihi katika Kiswahili.
- source_word: ἐπαρρησιάζετο
  choice: akazungumza kwa ujasiri
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha kusema kwa uwazi na ujasiri kwa kipindi fulani. Muda unaoendelea unaelezwa pia na kirai ‘kwa muda wa miezi mitatu.’
- source_word: ἐπὶ μῆνας τρεῖς
  choice: kwa muda wa miezi mitatu
  rationale: ἐπί pamoja na nomino katika hali ya akusativi hapa huonyesha kipindi ambacho tendo liliendelea.
- source_word: διαλεγόμενος
  choice: akijadiliana nao
  rationale: Neno hili linahusu mazungumzo yenye hoja, maelezo na majibizano. ‘Akijadiliana nao’ huhifadhi hali ya mazungumzo badala ya kudokeza hotuba ya upande mmoja tu.
- source_word: πείθων
  choice: kuwashawishi
  rationale: Kitenzi kinaonyesha shughuli ya kuwavuta wasikilizaji wakubali hoja. Kiambishi ‘wa-’ kinaweka wazi hadhira iliyodokezwa na muktadha, bila kuongeza kundi jipya.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: kuhusu ufalme wa Mungu
  rationale: περί pamoja na genitivi ni ‘kuhusu,’ na ‘ufalme wa Mungu’ huhifadhi istilahi kuu ya Agano Jipya bila kuifafanua kwa namna finyu.
theological_decisions:
- issue: Mtendewa wa πείθων hajasemwa wazi katika Kigiriki.
  choice: kuwashawishi
  alternative: kushawishi
  rationale: Kiswahili cha kawaida huhitaji kuonyesha wanaoshawishiwa; muktadha unaonyesha wazi kuwa ni watu waliokuwa sinagogini.
- issue: πείθων inaweza kueleza tendo la kushawishi bila kubainisha wazi kama wote walikubali.
  choice: kuwashawishi
  alternative: kujaribu kuwashawishi
  rationale: Maandishi ya Kigiriki yanataja shughuli ya kushawishi lakini hayasemi wazi matokeo yake. Tafsiri kuu inafuata kitenzi moja kwa moja, huku tanbihi ikihifadhi uwezekano wa kusisitiza juhudi badala ya mafanikio.
- issue: βασιλεία τοῦ θεοῦ linaweza kueleweka kama ufalme, utawala, au kutawala kwa Mungu.
  choice: ufalme wa Mungu
  alternative: utawala wa Mungu
  rationale: ‘Ufalme wa Mungu’ ni sahihi, unatambulika kwa urahisi, na huhifadhi upana wa istilahi ya Kigiriki bila kuamua kimya kimya kama mkazo ni eneo, mamlaka, au tendo la kutawala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi huhifadhi mwendo wa simulizi na vitendo vinavyoandamana bila kuiga kwa ugumu mpangilio wa Kigiriki.
