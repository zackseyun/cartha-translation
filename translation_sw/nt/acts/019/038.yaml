id: ACT.19.38
reference: Acts 19:38
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: sw
  text: Basi, ikiwa Demetrio na mafundi walio pamoja naye wana shtaka dhidi ya mtu yeyote, vikao vya mahakama vinafanyika[a], na maliwali wapo[b]; na wafunguliane mashtaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahakama zinaendelea na vikao.” Usemi wa Kigiriki ἀγοραῖοι ἄγονται unarejelea shughuli rasmi za mahakama zilizokuwa zimeitishwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “maliwali wanapatikana/wapo hapa.” Wingi unaweza kurejelea ofisi hiyo ya utawala wa jimbo kwa maana ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Basi, ikiwa
  rationale: Inaonyesha mpito wenye hitimisho na sharti kwa Kiswahili cha kawaida bila kulazimisha tafsiri tofauti ya μέν.
- source_word: Δημήτριος
  choice: Demetrio
  rationale: Jina limetoholewa kwa namna inayotumika kwa kawaida katika tafsiri za Kiswahili.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: mafundi walio pamoja naye
  rationale: ‘Mafundi’ linaonyesha wafanyakazi wenye ustadi, na ‘walio pamoja naye’ linahifadhi maana ya σὺν αὐτῷ bila kuongeza uhusiano usiotajwa.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: wana shtaka dhidi ya mtu yeyote
  rationale: Kirai hiki kina maana ya kuwa na lalamiko au shauri la kisheria dhidi ya mtu; ‘shtaka’ linaweka wazi muktadha wa mahakama.
- source_word: τινα
  choice: mtu yeyote
  rationale: Kiwakilishi kisichobainisha mtu katika kauli ya jumla ya kisheria.
- source_word: ἀγοραῖοι ἄγονται
  choice: vikao vya mahakama vinafanyika
  rationale: Kirai kinarejelea shughuli rasmi za utoaji hukumu zilizokuwa zimeitishwa; tafsiri hii ni wazi na inahifadhi hali ya utendwa.
- source_word: ἀνθύπατοί εἰσιν
  choice: maliwali wapo
  rationale: ‘Maliwali’ ni neno la Kiswahili linalotumiwa kwa maafisa hawa wa majimbo ya Roma; wingi wa Kigiriki umehifadhiwa.
- source_word: ἐγκαλείτωσαν
  choice: na wafunguliane mashtaka
  rationale: Kitenzi kina maana ya kuleta shtaka kwa utaratibu wa kisheria; muundo huu unaunganika kiasili na kiwakilishi cha kutendeana.
- source_word: ἀλλήλοις
  choice: wafunguliane
  rationale: Kiambishi cha kutendeana ‘-an-’ kinahifadhi maana ya ἀλλήλοις, yaani upande mmoja dhidi ya mwingine.
theological_decisions: []
