  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za kisheria zimetumiwa kwa uwazi, huku wingi wa ‘maliwali’ na hali ya kutendeana katika shtaka vikihifadhiwa.
