source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: sw
  text: Nanyi mnaona na kusikia kwamba si huko Efeso tu, bali karibu katika Asia yote[a], Paulo huyu amewashawishi na kuwageuza watu wengi, akisema kwamba vitu vinavyotengenezwa kwa mikono[b] si miungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “Asia” ni jimbo la Kiroma lililokuwa magharibi mwa Asia Ndogo, si bara lote la Asia la leo.
    reason: cultural_note
  - marker: b
    text: Kihalisi, “vile vinavyofanywa kwa mikono”; ni usemi unaorejelea sanamu zinazotengenezwa kwa mikono ya wanadamu.
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: mnaona na kusikia
  rationale: Huhifadhi mwito maradufu wa Demetrio kwa ushahidi ambao wasikilizaji wake wenyewe wanautambua, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: si huko Efeso tu, bali karibu katika Asia yote
  rationale: Hutoa maana ya mahali iliyodokezwa na miundo ya Kigiriki na kuhifadhi σχεδόν kama “karibu,” bila kudai kwamba kila sehemu ya Asia ilifikia ujumbe huo.
- source_word: ὁ Παῦλος οὗτος
  choice: Paulo huyu
  rationale: Huhifadhi kiwakilishi cha kuonyesha chenye ladha ya kumdharau au kumtenga Paulo katika hotuba ya Demetrio, bila kuongeza tusi lisilokuwapo.
- source_word: πείσας μετέστησεν
  choice: amewashawishi na kuwageuza
  rationale: Huwakilisha kushawishi kama njia inayoambatana na kuwafanya watu wabadili msimamo. Kitenzi “kuwageuza” kinaacha wazi kwa kiasi fulani kile walichogeukia au walichoacha, kama ilivyo katika mstari wenyewe.
- source_word: ἱκανὸν ὄχλον
  choice: watu wengi
  rationale: Katika muktadha huu ἱκανός huonyesha idadi kubwa yenye uzito. “Watu wengi” ni ya asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ya “umati wa kutosha.”
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: vitu vinavyotengenezwa kwa mikono
  rationale: Muundo wa Kigiriki humaanisha vile vinavyotokea kwa ustadi wa mikono ya wanadamu. “Vitu” huweka wazi kwamba sanamu zilizotengenezwa ndizo zinazokataliwa kuwa miungu, bila kuziita miungu mapema katika sentensi.
- source_word: οὐκ εἰσὶν θεοὶ
  choice: si miungu
  rationale: Ni ukanushaji wa moja kwa moja wa hadhi ya uungu wa vitu vilivyotengenezwa; Kiswahili hiki ni cha kawaida na hakiongezi neno la kufasiri kama “kweli.”
theological_decisions:
- issue: Jinsi ya kutoa dai dhidi ya sanamu bila kuongeza madai mapana yasiyotajwa
  choice: vitu vinavyotengenezwa kwa mikono si miungu
  alternative: miungu inayotengenezwa kwa mikono si miungu
  rationale: Kigiriki kinakataa kwamba vitu vinavyofanywa kwa mikono ni miungu. Tafsiri iliyochaguliwa huhifadhi nguvu ya dai hilo huku ikiepuka kuzipa sanamu jina la “miungu” katika kiima kana kwamba hadhi hiyo imekubaliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa hotuba ya mashtaka umehifadhiwa, huku miundo mizito ya Kigiriki ikifanywa ya asili katika Kiswahili. Alama za tanbihi zimelinganishwa na maudhui yake kulingana na mstari wa Kigiriki.
