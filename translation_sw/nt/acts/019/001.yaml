base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: sw
  text: Ikawa, Apolo alipokuwa Korintho, Paulo alipitia maeneo ya ndani[a], akafika Efeso na kuwakuta wanafunzi fulani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maeneo ya juu” au “maeneo ya ndani zaidi”; huenda maneno haya yanarejelea njia ya ndani iliyopitia sehemu za miinuko badala ya njia ya pwani.
    reason: lexical_alternative
  - marker: b
    text: Hapa haijaelezwa walikuwa wanafunzi wa nani; mistari inayofuata inaonyesha kwamba walihusishwa na ubatizo wa Yohana.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ikawa kwamba
  rationale: Huhifadhi fomula ya Luka ya kuendeleza simulizi bila kuongeza neno la wazi la wakati kama ‘sasa’; pia ni ya asili katika usimulizi wa Kiswahili.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: Apolo alipokuwa Korintho
  rationale: Muundo huu unaonyesha matukio yanayotokea wakati mmoja; ‘alipokuwa’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: διελθόντα
  choice: alipitia
  rationale: Kitenzi hiki huonyesha Paulo akisafiri kupitia eneo hilo kabla ya kufika Efeso.
- source_word: τὰ ἀνωτερικὰ μέρη
  choice: maeneo ya ndani
  rationale: Katika muktadha huu inaelekea kumaanisha njia ya ndani ya nchi, huenda katika sehemu za juu, tofauti na njia ya pwani. Tanbihi inadumisha maana mbadala ya kijiografia.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: akafika Efeso
  rationale: ‘Akafika’ huonyesha kwa kawaida hatua iliyofuata baada ya kupitia maeneo hayo na kuwasili katika mji wa Efeso.
- source_word: καὶ εὑρεῖν
  choice: na kuwakuta
  rationale: ‘Kuwakuta’ ni ya asili kwa kupata watu mahali fulani na huendeleza mfuatano wa simulizi.
- source_word: τινας μαθητάς
  choice: wanafunzi fulani
  rationale: ‘Fulani’ huhifadhi hali ya kutotajwa wazi kwa watu hao, na ‘wanafunzi’ ndilo neno sahihi bila kubainisha mapema walikuwa wanafunzi wa nani.
theological_decisions:
- issue: Utambulisho wa μαθητάς katika muktadha
  choice: wanafunzi fulani
  alternative: wanafunzi fulani wa Yohana; wanafunzi fulani wa Yesu
  rationale: Kigiriki hakibainishi hapa walikuwa wanafunzi wa nani. Mistari inayofuata ndiyo inayofafanua uhusiano wao na ubatizo wa Yohana, hivyo tafsiri haipaswi kutatua mapema mvutano huo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa sasa na wenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka: Apolo, Korintho, na Efeso. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.'
