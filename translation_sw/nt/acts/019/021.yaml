id: ACT.19.21
reference: Acts 19:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: sw
  text: Baada ya mambo hayo kukamilika, Paulo akaazimia katika Roho[a] kwenda Yerusalemu baada ya kupitia Makedonia na Akaya, akisema, “Baada ya kuwapo huko[b], lazima pia niione Roma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika roho yake.” Kirai cha Kigiriki kinaweza kumaanisha azimio la ndani la Paulo au mwongozo wa Roho Mtakatifu.
    reason: alternative_reading
  - marker: b
    text: Au, “baada ya kufika huko.” Kwa maana halisi, “baada ya kuwa huko.”
    reason: translation_nuance
lexical_decisions:
- source_word: ἐπληρώθη
  choice: kukamilika
  rationale: Kitenzi hiki hapa kinaonyesha kwamba mambo yaliyotangulia yalifikia mwisho wake, si kwamba unabii ulitimizwa.
- source_word: ἔθετο
  choice: akaazimia
  rationale: Kauli ya kati katika nahau hii inaonyesha uamuzi wa makusudi ambao Paulo aliweka moyoni mwake; ‘akaazimia’ hubeba uzito huo kuliko ‘akaamua’.
- source_word: ἐν τῷ πνεύματι
  choice: katika Roho
  rationale: Kirai cha Kigiriki kinaweza kumaanisha mwongozo wa Roho Mtakatifu au azimio la ndani la Paulo. Matini kuu inachagua ‘katika Roho,’ huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: διελθὼν
  choice: baada ya kupitia
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha kwamba Paulo angepitia Makedonia na Akaya kabla ya kwenda Yerusalemu.
- source_word: πορεύεσθαι
  choice: kwenda
  rationale: Hili ni neno la kawaida la mwendo, na ‘kwenda’ ni tafsiri ya asili na iliyo wazi katika muktadha huu.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali hapa.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Baada ya kufika huko
  rationale: Muundo huu unaonyesha Paulo kuwa au kuwapo mahali hapo kabla ya hatua inayofuata; ‘kufika huko’ ni Kiswahili cha kawaida kinachowasilisha mfuatano huo.
- source_word: δεῖ
  choice: lazima
  rationale: Neno hili huonyesha ulazima wenye nguvu, ambao katika Luka–Matendo mara nyingi unaweza kuhusiana na kusudi la Mungu, bila kulazimisha maana hiyo katika tafsiri.
- source_word: ἰδεῖν
  choice: niione
  rationale: Maana ya msingi ni ‘kuona.’ Katika muktadha wa safari inaweza kudokeza kutembelea, lakini ‘niione Roma’ huhifadhi taswira ya Kigiriki na inaeleweka kwa Kiswahili.
theological_decisions:
- issue: Rejeleo la ἐν τῷ πνεύματι
  choice: katika Roho
  alternative: katika roho yake / moyoni mwake
  rationale: Kigiriki hakina kimilikishi cha wazi. Kirai kinaweza kueleza mwongozo wa Roho Mtakatifu au azimio la ndani la Paulo. Matini kuu inafuata uwezekano wa kwanza kutokana na nafasi ya Roho katika Luka–Matendo, lakini tanbihi haiufuti uwezekano wa pili.
- issue: Nguvu ya ulazima katika δεῖ
  choice: lazima
  alternative: imenipasa
  rationale: ‘Lazima’ huhifadhi ulazima wa kauli bila kueleza wazi ikiwa ni ulazima wa kimungu, wa kimkakati, au wa ndani; hivyo mvutano wa matini unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akaazimia’ huendeleza simulizi kwa ufasaha, majina ‘Makedonia,’ ‘Akaya,’ ‘Yerusalemu,’ na ‘Roma’ yanafuata matumizi mapana ya kisasa, na sentensi mbili hupunguza uzito wa muundo mrefu bila kupoteza uhusiano wa mawazo.
