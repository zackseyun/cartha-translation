  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: sw
  text: Na wengi wa wale waliokuwa wamefanya mambo ya uchawi[a] walileta pamoja vitabu vyao, wakawa wakiviteketeza mbele ya watu wote. Wakajumlisha thamani ya vitabu hivyo, wakaona kuwa ilikuwa vipande elfu hamsini vya fedha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matendo ya uchawi.” Usemi wa Kigiriki kwa maana halisi unahusu mambo “ya kipekee” au “ya ajabu,” lakini katika muktadha huu unaashiria matendo ya uchawi.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “makumi ya maelfu matano ya fedha,” yaani vipande elfu hamsini vya fedha. Aina kamili ya sarafu haijatajwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: wengi
  rationale: Katika muktadha huu neno hilo linaonyesha idadi kubwa ya watu, na “wengi” ni Kiswahili cha kawaida na cha asili.
- source_word: τὰ περίεργα πραξάντων
  choice: waliokuwa wamefanya mambo ya uchawi
  rationale: Usemi huu katika muktadha wa Efeso unahusu matendo ya kichawi, si mambo ya udadisi tu; “mambo ya uchawi” ni wazi bila kuongeza istilahi ya kimadhehebu.
- source_word: συνενέγκαντες
  choice: walileta pamoja
  rationale: Huhifadhi wazo la kuleta vitabu mahali pamoja kabla ya kuviteketeza.
- source_word: τὰς βίβλους
  choice: vitabu vyao
  rationale: βίβλους ni maandishi au vitabu; kiwakilishi “vyao” kinatokana wazi na muktadha na huleta Kiswahili cha asili.
- source_word: κατέκαιον
  choice: kuviteketeza
  rationale: Kitenzi cha Kigiriki katika wakati usiotimilika kinaonyesha tendo lililokuwa likiendelea; muundo “walileta ... na kuviteketeza” unasomeka kwa urahisi, huku “teketeza” ikionyesha kuchomwa kabisa.
- source_word: ἐνώπιον πάντων
  choice: mbele ya watu wote
  rationale: Husisitiza kwamba tendo hilo lilifanywa hadharani na ni usemi wa kawaida wenye hadhi katika Kiswahili.
- source_word: συνεψήφισαν
  choice: wakajumlisha
  rationale: Kitenzi kinamaanisha kuhesabu kwa kujumlisha ili kupata jumla.
- source_word: τὰς τιμὰς αὐτῶν
  choice: thamani yake
  rationale: τιμή hapa ni thamani ya kifedha ya mkusanyo wa vitabu; umoja wa kijumla ni wa asili katika Kiswahili.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: vipande elfu hamsini vya fedha
  rationale: Ni “makumi ya maelfu matano ya fedha,” yaani elfu hamsini; kwa kuwa aina halisi ya sarafu haikutajwa, “vipande ... vya fedha” huepuka kuitaja sarafu maalumu.
theological_decisions:
- issue: Maana ya τὰ περίεργα katika mazingira ya Efeso
  choice: mambo ya uchawi
  alternative: matendo ya siri; mambo ya ajabu
  rationale: Muktadha wa karibu unahusu wapunga pepo, roho waovu, na vitabu vya gharama kubwa vinavyoteketezwa. Tafsiri hii inaonyesha shughuli za kichawi bila kuzipunguza kuwa udadisi wa kawaida wala kuingiza dhana maalumu ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia mtiririko wa masimulizi unaoeleweka kwa wasomaji wa kawaida, huku ikihifadhi hadharani kwa tendo hilo, muktadha wa uchawi, na kutotajwa kwa aina maalumu ya sarafu.
