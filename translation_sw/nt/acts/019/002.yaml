  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: sw
  text: Akawauliza[a], “Je, mlipokea Roho Mtakatifu mlipoamini?” Wakamjibu, “La[b], hata hatujasikia kwamba kuna Roho Mtakatifu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mlipokea Roho Mtakatifu baada ya kuamini?” Kishiriki cha Kigiriki kinaweza kueleweka kwa tofauti ndogo katika uhusiano wa wakati.
    reason: lexical_alternative
  - marker: b
    text: Au, “hata hatujasikia kama kuna Roho Mtakatifu”; au, kwa ufafanuzi zaidi, “hata hatujasikia kwamba Roho Mtakatifu ametolewa.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Akawauliza
  rationale: Ingawa kitenzi cha Kigiriki kwa msingi ni ‘alisema kwao,’ muktadha na sentensi ya swali hufanya ‘akawauliza’ kuwa Kiswahili cha kawaida na sahihi, huku τε ikiendeleza simulizi kwa kiunganishi cha ‘aka-’.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: Je, mlipokea ... mlipoamini?
  rationale: Kirai ‘mlipoamini’ kinaonyesha uhusiano wa wakati bila kulazimisha kwamba kupokea kulitokea baadaye kabisa au wakati huohuo; utata wa kishiriki cha aoristi πιστεύσαντες umehifadhiwa katika tanbihi.
- source_word: πνεῦμα ἅγιον
  choice: Roho Mtakatifu
  rationale: Katika muktadha huu kirai kinamtaja Roho Mtakatifu wa Mungu, wala si roho fulani iliyo takatifu. Matumizi ya herufi kubwa yanaonyesha rejeo hilo la kipekee.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Wakamjibu
  rationale: Kigiriki kinaendeleza mazungumzo kwa δέ na kitenzi cha kusema kinachodokezwa. ‘Wakamjibu’ ni usemi wa asili wa Kiswahili unaoonyesha jibu bila kuongeza maana ya kitheolojia.
- source_word: Ἀλλ’ οὐδ’
  choice: La, hata ...
  rationale: Muundo huu unasisitiza ukanushaji. ‘La’ hutoa jibu hasi, na ‘hata’ huhifadhi nguvu ya οὐδέ.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: hata hatujasikia kwamba kuna Roho Mtakatifu
  rationale: Hii inafuata maana ya moja kwa moja ya maneno ya Kigiriki bila kuongeza wazo lisilotajwa wazi kwamba Roho Mtakatifu ‘ametolewa.’ Uwezekano wa kuelewa εἰ kama ‘kama’ umewekwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa wakati kati ya kuamini na kupokea Roho Mtakatifu
  choice: mlipoamini
  alternative: baada ya kuamini
  rationale: Kishiriki πιστεύσαντες kinahusishwa kwa wakati na ἐλάβετε, lakini peke yake hakiamui kama kupokea kulifuata kuamini au kulitokea wakati huohuo. Tafsiri kuu inaacha mvutano huo wazi, na tanbihi inataja uwezekano mwingine.
- issue: Maana ya kutosikia kwa wanafunzi kuhusu Roho Mtakatifu
  choice: hata hatujasikia kwamba kuna Roho Mtakatifu
  alternative: hata hatujasikia kama kuna Roho Mtakatifu; au, kwa ufafanuzi zaidi, hata hatujasikia kwamba Roho Mtakatifu ametolewa
  rationale: Kigiriki ni kifupi na kinaweza kueleweka kwa zaidi ya namna moja. Tafsiri kuu inabaki karibu na maneno yenyewe, huku tanbihi ikihifadhi njia nyingine bila kuingiza ufafanuzi wa kimadhehebu katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘aka-’ unaendeleza simulizi kwa kawaida; ‘Je’ huweka swali wazi, na ‘La’ ni jibu hasi fupi linalofaa katika mazungumzo. Alama zote za tanbihi [a] na [b] zimewekwa katika maandishi.
