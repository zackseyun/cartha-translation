lexical_decisions:
- source_word: ἦσαν
  choice: walikuwa
  rationale: Kitenzi hiki kinaonyesha kuwapo kwa kundi hilo; muundo wa Kiswahili pamoja na “jumla yao” ni wa asili na unaeleweka.
- source_word: δὲ
  choice: —
  rationale: Ni kiunganishi hafifu kisichoonyesha hapa utofautishaji muhimu; kuacha kisitafsiriwe kunafanya Kiswahili kiwe cha kawaida bila kupoteza maana.
- source_word: οἱ πάντες
  choice: jumla yao
  rationale: Kauli hii inajumlisha idadi ya kundi lote; “jumla yao” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ἄνδρες
  choice: wanaume
  rationale: Neno la Kigiriki linataja wanaume, si watu kwa ujumla, hivyo jinsia hiyo imehifadhiwa.
- source_word: ὡσεὶ
  choice: wapatao
  rationale: Huonyesha makadirio ya idadi; “wapatao” ni usemi wa asili na wenye hadhi katika muktadha huu.
- source_word: δώδεκα
  choice: kumi na wawili
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi ya wanaume kumi na wawili kwa Kiswahili.
