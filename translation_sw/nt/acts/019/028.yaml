  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: sw
  text: Waliposikia hayo na kujawa na ghadhabu[a], wakawa wakipiga kelele wakisema, “Artemi wa Waefeso ni mkuu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajawa na hasira kali,” “wakajaa hasira,” au “wakakasirika sana.” Maneno ya Kigiriki kwa maana halisi ni “wakawa wamejaa θυμός,” yaani hasira kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Waliposikia hayo
  rationale: Kirai cha wakati kinaonyesha tukio lililotangulia tendo kuu; ‘hayo’ huweka wazi kitu kinachodokezwa na muktadha bila kuongeza maana mpya.
- source_word: δὲ
  choice: na
  rationale: Hapa ni kiunganishi hafifu kinachoendeleza masimulizi, si kinyume chenye mkazo.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: kujazwa na ghadhabu
  rationale: Huhifadhi picha ya kujaa na hasira kali huku ikiwa Kiswahili cha kawaida na chenye hadhi.
- source_word: θυμοῦ
  choice: ghadhabu
  rationale: Neno hili linaonyesha hasira kali au fury; ‘ghadhabu’ inafaa kwa mwitikio mkali wa umati.
- source_word: ἔκραζον
  choice: wakawa wakipiga kelele
  rationale: Muundo huu huonyesha tendo lililoendelea au kurudiwa, kulingana na hali ya kitenzi cha wakati usiotimilika.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huanzisha kwa kawaida maneno yaliyokuwa yakipazwa na umati.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Artemi wa Waefeso ni mkuu!
  rationale: Ni kauli ya shangwe au mwito; mpangilio huu ni wa asili kwa Kiswahili na huhifadhi uhusiano wa Artemi na watu wa Efeso.
- source_word: Ἄρτεμις
  choice: Artemi
  rationale: Jina la mungu wa kike limetoholewa kwa umbo linalotumika katika Kiswahili.
- source_word: Ἐφεσίων
  choice: Waefeso
  rationale: Ni kivumishi cha wingi kilichotumiwa kama nomino, kikimaanisha watu wa Efeso; ‘Waefeso’ ni sahihi kuliko ‘Efeso’ pekee.
theological_decisions:
- issue: Kutafsiri sifa kwa mungu wa kipagani bila kuifanya ionekane kuwa uthibitisho wa mfasiri
  choice: “Artemi wa Waefeso ni mkuu!”
  alternative: “Mkuu ni Artemi wa Waefeso!”
  rationale: Kauli inabaki kuwa maneno yaliyonukuliwa ya umati. Tafsiri haipunguzi wala kuidhinisha maudhui yake ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakawa wakipiga kelele’ huhifadhi hali endelevu ya ἔκραζον; ‘Artemi wa Waefeso’ ni mwito unaoeleweka kwa urahisi bila kuufanya kuwa msimamo wa msimulizi.
