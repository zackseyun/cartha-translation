  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: sw
  text: Kwa maana mmewaleta wanaume hawa hapa, ambao si wezi wa mahekalu wala hawamtukani mungu wetu wa kike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “mungu wetu”; muktadha unaonyesha kwamba anayerejelewa ni Artemi, mungu wa kike wa Waefeso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: mmewaleta
  rationale: Kauli ya moja kwa moja kwa umati kuhusu tendo lililokamilika na lenye umuhimu katika hali ya sasa; wakati timilifu wa Kiswahili unasikika kwa kawaida hapa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha sababu inayounga mkono kauli iliyotangulia.
- source_word: τοὺς ἄνδρας τούτους
  choice: watu hawa hapa
  rationale: Ingawa ἄνδρας humaanisha wanaume, katika Kiswahili cha kawaida 'watu hawa' linafaa kwa wanaotajwa mbele ya mkutano; 'hapa' linawasilisha nguvu ya kuonyesha ya τούτους katika mazingira haya.
- source_word: οὔτε ... οὔτε
  choice: si ... wala hawa-
  rationale: Muundo huu wa Kiswahili unahifadhi ukanushaji wa jozi wa Kigiriki kwa njia ya kawaida na wazi.
- source_word: ἱεροσύλους
  choice: wezi wa mahekalu
  rationale: Neno linamaanisha watu wanaopora mahekalu au mali takatifu; tafsiri hii ni halisi na inayoeleweka.
- source_word: βλασφημοῦντας
  choice: hawamtukani
  rationale: Kitenzi hiki hapa kinahusu kusema kwa dharau au matusi dhidi ya mungu; 'kumtukana' ni lugha ya sasa na ya kawaida kuliko nomino nzito ya kidini.
- source_word: τὴν θεὸν ἡμῶν
  choice: mungu wetu wa kike
  rationale: Mrejelewa ni Artemi. Kiswahili hakina nomino ya kawaida inayolingana moja kwa moja na 'goddess'; 'mungu wa kike' linaonyesha jinsia ya mrejelewa bila kudokeza kwamba ni Mungu wa kweli.
theological_decisions:
- issue: Tafsiri ya τὴν θεὸν ἡμῶν inayomrejelea Artemi
  choice: mungu wetu wa kike
  alternative: mungu wetu
  rationale: Msemaji ni ofisa wa kipagani wa Efeso anayemrejelea Artemi. Kutaja 'wa kike' huweka wazi mrejelewa wa kike na huzuia mkanganyiko na Mungu wa kweli; huu ni uamuzi wa kimuktadha na kileksika, si kukubali ibada hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida bila kupoteza maana ya kisheria na kidini ya shtaka.
