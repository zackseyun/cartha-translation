  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: sw
  text: Akawakusanya pamoja na wafanyakazi waliohusika na mambo kama hayo, akasema, “Enyi wanaume, mnajua kwamba ustawi wetu unatokana na biashara hii.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utajiri wetu unatokana na kazi hii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  choice: Akawakusanya pamoja
  rationale: Kirai cha kitenzi cha wakati uliopita kinaonyesha tendo lililotangulia kusema; muundo huu ni wa asili katika Kiswahili na unahifadhi maana ya kuwakusanya watu kuwa kundi moja.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: pamoja na wafanyakazi waliohusika na mambo kama hayo
  rationale: Tafsiri hii inadumisha upana wa ἐργάτας na kutotaja ufundi maalumu ambao haujaelezwa wazi katika mstari huu.
- source_word: Ἄνδρες
  choice: Enyi wanaume
  rationale: Wito huu unaelekezwa moja kwa moja kwa wanaume waliokusanyika na unadumisha uainishaji wa kijinsia wa neno la Kigiriki.
- source_word: ἐπίστασθε
  choice: mnajua
  rationale: Ni usemi wa kawaida na wa moja kwa moja kwa maarifa ambayo wasikilizaji tayari wanayo.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: kutokana na biashara hii
  rationale: Katika muktadha wa shughuli ya kibiashara, ‘biashara’ huwasilisha vizuri maana ya kazi au shughuli inayozalisha mapato.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: ustawi wetu unatokana
  rationale: ‘Ustawi’ unahifadhi maana pana ya εὐπορία—hali ya kuwa na mali au mafanikio ya kiuchumi—bila kuipunguza kuwa mshahara au mapato pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida huku ikihifadhi maana pana ya shughuli ya kiuchumi na ya ustawi.
