  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: sw
  text: Hivyo, neno la Bwana lilikuwa likizidi kukua na kushinda kwa nguvu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lilikuwa likizidi kukua sana na kuwa na nguvu.” Kirai cha Kigiriki κατὰ κράτος kinaweza kutafsiriwa “kwa nguvu” au “sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Hivyo
  rationale: Inaonyesha matokeo ya matukio yaliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: κατὰ κράτος
  choice: kwa nguvu
  rationale: Kirai hiki ni usemi wa kielezi unaoonyesha nguvu au athari kubwa; ‘kwa nguvu’ huhifadhi dhana ya κράτος bila kulazimisha kihusishwe na kitenzi kimoja tu.
- source_word: τοῦ κυρίου
  choice: la Bwana
  rationale: Huhifadhi cheo kilichopo katika Kigiriki bila kuongeza jina ‘Yesu,’ ingawa muktadha unaelekea kumrejelea yeye.
- source_word: ὁ λόγος
  choice: neno
  rationale: Hurejelea ujumbe uliotangazwa na pia huhifadhi usemi unaojirudia katika Matendo.
- source_word: ηὔξανεν
  choice: likaendelea kukua
  rationale: Wakati usiotimilifu unaonyesha hatua iliyoendelea; ‘likaendelea kukua’ huwasilisha hali hiyo kwa uwazi.
- source_word: ἴσχυεν
  choice: kushinda
  rationale: Katika muktadha huu kitenzi kinaonyesha kuwa neno lilikuwa na nguvu na kufanikiwa dhidi ya upinzani; ‘kushinda’ ni usemi wa asili unaohifadhi wazo la kuenea kwa mafanikio.
theological_decisions:
- issue: Mhusika anayeitwa ‘Bwana’ katika τοῦ κυρίου
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Muktadha unaashiria Bwana Yesu, lakini Kigiriki kinasema tu ‘Bwana’; tafsiri haiongezi utambulisho ambao haukutajwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kwa msomaji wa kawaida huku ukihifadhi mwendelezo wa vitenzi vya Kigiriki na uwezekano wa κατὰ κράτος kueleza ukuaji wenye nguvu.
