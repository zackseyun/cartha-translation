  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: sw
  text: Jambo hili likajulikana kwa Wayahudi na Wagiriki wote waliokuwa wakiishi Efeso, hofu ikawashika wote[a], na jina la Bwana Yesu lilikuwa likitukuzwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hofu ikawaangukia wote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “jina la Bwana Yesu lilikuwa likiinuliwa” au “liliheshimiwa sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Jambo hili
  rationale: Kiwakilishi hiki cha umoja kinarejelea tukio lililotangulia; “jambo hili” ni wazi na cha kawaida katika Kiswahili.
- source_word: ἐγένετο γνωστὸν
  choice: likajulikana
  rationale: Muundo huu unaonyesha kwamba jambo hilo lilikuja kujulikana; “likajulikana” ni tafsiri ya asili isiyo nzito.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: kwa Wayahudi wote na Wagiriki
  rationale: Hali ya udativu inaonyesha watu ambao habari hiyo iliwafikia. “Wote” inahusishwa kwa kawaida na makundi yote mawili katika sentensi hii.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: waliokuwa wakiishi Efeso
  rationale: Hutafsiri kishiriki kinachowafafanua Wayahudi na Wagiriki, huku hali endelevu ya kuishi ikibaki wazi.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: Hofu ikawashika wote
  rationale: Ni usemi wa Kiswahili wa kawaida unaohifadhi nguvu ya hofu iliyowajia wote bila kulazimisha maana kuwa hofu kuu au kicho pekee.
- source_word: φόβος
  choice: Hofu
  rationale: Neno la Kigiriki linaweza kumaanisha hofu, kicho, au woga mkubwa; “hofu” ndilo neno pana lisilobana maana ya muktadha.
- source_word: ἐμεγαλύνετο
  choice: likazidi kutukuzwa
  rationale: Hali ya wakati usiotimilika inaonyesha tendo lililoendelea. “Likazidi kutukuzwa” ni Kiswahili cha asili kinachoonyesha kuongezeka au kuendelea kwa heshima iliyotolewa.
- source_word: τὸ ὄνομα
  choice: jina
  rationale: Kudumisha “jina” huhifadhi maana zake za kibiblia zinazoweza kuhusisha sifa, mamlaka, na heshima bila kuifupisha kuwa “sifa” pekee.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: la Bwana Yesu
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος kama cheo cha Yesu, na umilikaji unaonyeshwa kwa kiunganishi “la” kinachopatana na “jina.”
theological_decisions:
- issue: Tafsiri ya κύριος ikimhusu Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” huhifadhi cheo cha kikristo na mwangwi wa matumizi ya kibiblia bila kukipunguza kuwa maelezo ya mamlaka ya kawaida.
- issue: Iwapo τὸ ὄνομα itafsiriwe moja kwa moja au ifafanuliwe kama sifa
  choice: jina la Bwana Yesu
  alternative: sifa ya Bwana Yesu
  rationale: “Jina” ndilo neno lililo katika matini na linaweza kujumuisha sifa, mamlaka, na heshima ya Yesu; kulibadili kuwa “sifa” kungepunguza upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Hofu ikawashika” ni ya asili zaidi kuliko kuiga moja kwa moja sitiari ya Kigiriki, huku tanbihi ikihifadhi usemi huo. Alama zote za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
