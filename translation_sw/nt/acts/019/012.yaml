  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: sw
  text: hata vitambaa vya kufutia jasho au aproni za kazi zilipelekwa kutoka mwilini mwake kwa wagonjwa; magonjwa yakawaacha, na pepo waovu wakatoka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: hata ...
  rationale: Katika muktadha huu ὥστε inaonyesha matokeo ya miujiza isiyo ya kawaida iliyotajwa katika mstari uliotangulia; muundo wa Kiswahili unaonyesha matokeo hayo kwa njia ya kawaida.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: kwa wagonjwa
  rationale: Huwataja wale waliokuwa wagonjwa na inaendana kwa kawaida na mwendo wa vitu kupelekwa kwao.
- source_word: ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: zilizokuwa zimegusa ngozi yake zilipelekwa
  rationale: ἀποφέρεσθαι inaonyesha vitu kuondolewa kwake na kupelekwa kwa wagonjwa; χρώς ni ngozi, yaani uso wa mwili. Muundo huu ni wa asili katika Kiswahili na haupotezi uhusiano wa moja kwa moja na ngozi yake.
- source_word: σουδάρια
  choice: vitambaa vya kufutia jasho
  rationale: Neno hili la mkopo lilitaja vitambaa vya kufutia jasho au uso; tafsiri hii inaeleza matumizi yake kwa msomaji wa sasa.
- source_word: σιμικίνθια
  choice: aproni za kazi
  rationale: Neno hili hutaja aproni au vazi la kazi lililovaliwa wakati wa kazi ya mikono.
- source_word: ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους
  choice: magonjwa yakawaacha
  rationale: Huhifadhi picha ya magonjwa kuondoka kwa wagonjwa bila kuongeza kimilikishi kisichotajwa wazi katika Kigiriki.
- source_word: πνεύματα τὰ πονηρά
  choice: pepo wachafu
  rationale: Katika Kiswahili cha Biblia, 'pepo wachafu' ni usemi wa kawaida na unaoeleweka kwa viumbe wa kiroho waovu; haukusudii kubadili maana kuwa uchafu wa kimwili.
- source_word: ἐκπορεύεσθαι
  choice: wakatoka
  rationale: Hutoa kwa uwazi picha ya pepo kutoka kwa waliokuwa wamewaathiri.
theological_decisions:
- issue: Namna uponyaji na kufukuzwa kwa pepo kulivyohusiana na vitambaa vilivyotoka kwa Paulo
  choice: Tukio limesimuliwa moja kwa moja bila kueleza utaratibu wa nguvu hiyo wala kuingiza fundisho kuhusu masalio matakatifu.
  alternative: Kulitafsiri kana kwamba linahalalisha ibada ya masalio, au kulifanya tukio hilo kuwa ishara tu isiyo ya kimiujiza.
  rationale: Luka anasimulia matokeo ya kimiujiza waziwazi, lakini haelezi kwamba vitu hivyo vilikuwa na nguvu ya kudumu ndani yake. Tafsiri inahifadhi dai la simulizi bila kuongeza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Vitambaa vya kufutia jasho' ni wazi zaidi kuliko 'leso' pekee, na 'aproni za kazi' inaweka wazi kuwa σιμικίνθια zilikuwa mavazi ya kazi. Hakuna tanbihi iliyohitajika, kwa kuwa maana za istilahi zimewasilishwa moja kwa moja katika matini.
