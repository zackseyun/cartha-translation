  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: sw
  text: Kutoka katika umati, wakamtoa Aleksanda na kumleta mbele[a], kwa kuwa Wayahudi walikuwa wamemsukuma mbele. Naye Aleksanda, akitoa ishara kwa mkono, alitaka kutoa utetezi kwa kusanyiko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimleta Aleksanda mbele ... Wayahudi wakiwa wamemleta mbele.” Kigiriki kinatumia vitenzi viwili vyenye maana zinazokaribiana kuhusu kumleta Aleksanda mbele hadharani.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa watu.” Neno la hapa lina maana ya umma katika mazingira ya kiraia, na ni tofauti na “umati” lililotumiwa mapema katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: walimwelekeza ... mbele
  rationale: Katika muktadha huu kitenzi kinaonyesha kumtoa Aleksanda kutoka katika umati na kumleta hadharani mbele; tafsiri hii ni ya kawaida na haikipi kitenzi maana ya kumfundisha.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: kwa kuwa Wayahudi walikuwa wamemsukuma mbele
  rationale: Kirai hiki kinaeleza jinsi Aleksanda alivyofikishwa mbele. 'Kumsukuma mbele' huhifadhi nguvu ya kitendo cha kumweka hadharani bila kudai kwamba walitumia nguvu za kimwili.
- source_word: κατασείσας τὴν χεῖρα
  choice: baada ya kuashiria kwa mkono
  rationale: Huhifadhi ishara ya mkono ya kutaka kusikilizwa bila kuongeza waziwazi kwamba aliomba ukimya, jambo linalodokezwa lakini halisemwi moja kwa moja.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: alitaka kujitetea
  rationale: Huhifadhi nia au jaribio lisilokamilika, pamoja na maana ya kutoa utetezi hadharani.
- source_word: τῷ δήμῳ
  choice: mbele ya kusanyiko
  rationale: Neno hili lina maana ya umma uliokusanyika katika mazingira ya kiraia; 'kusanyiko' hulitofautisha na ὄχλος, umati wa kawaida uliotajwa mapema.
- source_word: ὄχλου
  choice: umati
  rationale: '''Umati'' ni Kiswahili cha kawaida kwa kundi kubwa la watu na hutofautisha neno hili na kusanyiko la kiraia baadaye.'
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Aleksanda
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
theological_decisions: []
