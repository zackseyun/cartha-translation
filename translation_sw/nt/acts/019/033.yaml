  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umetiririshwa kwa kawaida huku tofauti kati ya 'umati' na 'kusanyiko' ikihifadhiwa. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
