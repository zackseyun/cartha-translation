  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: sw
  text: Hata baadhi ya viongozi wa jimbo la Asia[a], ambao walikuwa rafiki zake, walituma ujumbe kwake na kumsihi asiingie katika ukumbi wa michezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Viongozi wa jimbo la Asia” walikuwa watu mashuhuri wenye madaraka waliohusishwa na jimbo la Kiroma la Asia.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: Hata baadhi ya
  rationale: “Baadhi” huhifadhi kutotajwa kwa idadi kamili katika τινές, na “hata” huonyesha mkazo wa καί; δέ inaachwa ijitokeze katika mtiririko wa kawaida wa simulizi bila kiunganishi kizito.
- source_word: τῶν Ἀσιαρχῶν
  choice: viongozi wa jimbo la Asia
  rationale: Ἀσιάρχαι lilikuwa jina la viongozi mashuhuri waliohusishwa na jimbo la Kiroma la Asia. Tafsiri elezi inaeleweka kwa msomaji wa kawaida bila kupoteza muktadha wa kiutawala; tanbihi inaeleza zaidi.
- source_word: ὄντες αὐτῷ φίλοι
  choice: ambao walikuwa rafiki zake
  rationale: Huhifadhi maana ya uhusiano wa kirafiki katika φίλοι na kazi ya kishiriki ya kutoa maelezo ya usuli.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: walituma ujumbe kwake
  rationale: Kitu kilichotumwa hakitajwi wazi katika Kigiriki, lakini muktadha unaonyesha kuwa ulikuwa ujumbe. Kiswahili huhitaji usemi huu wa kawaida.
- source_word: παρεκάλουν
  choice: kumsihi
  rationale: παρακαλέω hapa ni ombi la dhati. “Kumsihi” huonyesha uzito wake; hali ya tendo endelevu ya wakati usiotimilifu haikulazimishwa kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: asiingie katika ukumbi wa michezo
  rationale: Kauli hii ya Kigiriki humaanisha asijiweke au asijitokeze katika eneo hilo lenye hatari. “Asiingie” ni tafsiri ya asili inayolingana na muktadha bila kudokeza kujisalimisha rasmi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ukumbi wa michezo” hapa ni jengo kubwa la hadhara ambamo umati ulikuwa umekusanyika, si mchezo wa kuigiza wenyewe.
