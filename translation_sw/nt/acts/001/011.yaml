id: ACT.1.11
reference: Acts 1:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: sw
  text: Nao wakasema, “Enyi wanaume wa Galilaya, kwa nini mmesimama mkitazama mbinguni? Yesu huyu[a], aliyechukuliwa kutoka kwenu kwenda mbinguni, atakuja kwa namna ileile kama mlivyomwona akienda mbinguni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo zaidi, “Yesu huyu huyu.” Kigiriki kinasema waziwazi “Yesu huyu”; neno la pili “huyu” ni nyongeza ya kufasiri inayosisitiza kwamba ni Yesu yuleyule.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Enyi wanaume wa Galilaya
  rationale: Muundo wa wito wa moja kwa moja umehifadhiwa, pamoja na umbo la kiume la ἄνδρες na utambulisho wa Kigalilaya.
- source_word: τί ἑστήκατε βλέποντες
  choice: kwa nini mmesimama mkitazama
  rationale: Kitenzi timilifu ἑστήκατε kinaonyesha hali ya sasa ya kuwa wamesimama, huku βλέποντες ikionyesha tendo linaloendelea pamoja nacho.
- source_word: εἰς τὸν οὐρανόν
  choice: mbinguni / kwenda mbinguni
  rationale: Katika muktadha wa kupaa kwa Yesu, οὐρανός inaeleweka kuwa mbingu; Kiswahili hutumia 'mbinguni' kwa uelekeo huu, na 'kwenda' huweka wazi mwendo wa εἰς inapohitajika.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Yesu huyu
  rationale: Hili ndilo fumbo la asili na la moja kwa moja la kiashiria οὗτος pamoja na jina Yesu, bila kuongeza neno lisilo wazi katika Kigiriki.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: aliyechukuliwa kutoka kwenu kwenda mbinguni
  rationale: Kauli tendwa imehifadhiwa, 'kutoka kwenu' inaonyesha kutenganishwa na wanafunzi, na muktadha pamoja na kirai kinachofuata huonyesha kuchukuliwa kwenda juu, mbinguni.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: atakuja kwa namna ileile kama
  rationale: Muundo huu wa kawaida wa Kiswahili unawasilisha ulinganisho wa namna ya kuja na namna ambayo wanafunzi walimwona akienda.
- source_word: ἐθεάσασθε
  choice: mlivyomwona
  rationale: Huwasilisha ushuhuda wa kuona bila kutumia neno la kizamani au kuongeza mkazo usio wa lazima.
- source_word: πορευόμενον
  choice: akienda
  rationale: Huwasilisha kwa urahisi tendo la Yesu la kuondoka au kwenda katika muktadha wa kupaa.
theological_decisions:
- issue: Maana ya οὐρανός katika muktadha wa kupaa na kurudi
  choice: mbinguni
  alternative: angani
  rationale: Ingawa οὐρανός inaweza kumaanisha anga linaloonekana, muktadha wa kupaa kwa Yesu na ahadi ya kurudi kwake unaunga mkono 'mbinguni' bila kuongeza dai zaidi ya maandishi.
- issue: Namna ya kutafsiri οὗτος ὁ Ἰησοῦς
  choice: Yesu huyu
  alternative: Yesu huyu huyu
  rationale: Kigiriki kina kiashiria 'huyu' lakini hakina neno tofauti linalomaanisha 'yuleyule.' Tafsiri kuu inafuata muundo wa chanzo, huku tafsiri ya kimapokeo inayosisitiza utambulisho ikiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Enyi' inafaa kwa wito wa moja kwa moja wa kifasihi bila kuwa ya kizamani kupita kiasi; sentensi imehifadhi urudiaji wa 'mbinguni' uliopo katika chanzo.
