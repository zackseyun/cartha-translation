base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: sw
  text: “Enyi wanaume, ndugu, ilikuwa lazima Andiko litimizwe, ambalo Roho Mtakatifu alilitangulia kusema[a] kwa kinywa cha Daudi[b] kuhusu Yuda, aliyekuja kuwa mwongoza njia wa wale waliomkamata Yesu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alilitabiri.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kwa kinywa cha Daudi”; huu ni usemi unaomaanisha kwamba ujumbe ulitolewa kupitia msemaji wa kibinadamu.
    reason: cultural_note
  - marker: c
    text: Au, “waliomshika Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Enyi wanaume, ndugu zangu
  rationale: 'Huhifadhi nomino zote mbili za wito: ἄνδρες (‘wanaume’) na ἀδελφοί (‘ndugu’), huku ‘zangu’ ikifanya wito huo usikike kwa kawaida katika Kiswahili.'
- source_word: ἔδει
  choice: ilikuwa lazima
  rationale: Huonyesha ulazima unaodokezwa na kitenzi cha Kigiriki bila kufafanua zaidi chanzo au namna ya ulazima huo.
- source_word: πληρωθῆναι τὴν γραφὴν
  choice: Andiko litimizwe
  rationale: Ni lugha ya kawaida ya utimilifu wa Maandiko, na huhifadhi umoja wa γραφή pamoja na hali ya kutendwa ya πληρωθῆναι.
- source_word: προεῖπε
  choice: alilitangulia kusema
  rationale: Huhifadhi maana ya kusema kabla bila kulazimisha neno la kitaalamu zaidi kama ‘kutabiri,’ ingawa maana hiyo inawezekana.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, lenye heshima na linaloeleweka katika Kiswahili cha sasa.
- source_word: διὰ στόματος Δαυὶδ
  choice: kwa kinywa cha Daudi
  rationale: Huhifadhi taswira halisi na uwakala wa kibinadamu ulio katika usemi wa Kigiriki.
- source_word: περὶ Ἰούδα
  choice: kuhusu Yuda
  rationale: ‘Kuhusu’ huwasilisha kwa kawaida jambo linalozungumziwa na περί pamoja na hali ya umilikishi.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: aliyekuwa mwongoza njia
  rationale: Huwasilisha jukumu ambalo Yuda alikuja kuwa nalo bila kulifanya cheo rasmi; ‘mwongoza njia’ linafaa kwa mtu aliyewaongoza wengine mpaka kwa Yesu.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: wale waliomkamata Yesu
  rationale: Katika muktadha huu συλλαμβάνω humaanisha kumtia mtu mikononi au kumkamata; ‘waliomkamata’ ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Asili ya ulazima wa kutimizwa kwa Andiko
  choice: ilikuwa lazima
  alternative: ilikuwa imeamuliwa tangu awali kwamba lazima itokee
  rationale: Mstari unasema kwamba utimilifu ulikuwa wa lazima, lakini hauelezi kikamilifu namna ulazima huo unavyohusiana na uamuzi wa Mungu, kujua kwake mambo kabla, au uwajibikaji wa Yuda.
- issue: Uwakala katika uvuvio wa Maandiko
  choice: Roho Mtakatifu alilitangulia kusema kwa kinywa cha Daudi
  alternative: Daudi alisema kwa kuvuviwa na Roho Mtakatifu
  rationale: Muundo wa Kigiriki humtaja Roho Mtakatifu kuwa msemaji na Daudi kuwa chombo cha kibinadamu; tafsiri imehifadhi uwakala huo maradufu bila kuubadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Wito ‘Enyi wanaume, ndugu zangu’ umehifadhi jinsia na vipengele vyote viwili vya Kigiriki; sentensi imebaki karibu na mpangilio wa chanzo huku ikisomeka kwa kawaida.
