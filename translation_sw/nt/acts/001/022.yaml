  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: sw
  text: Kuanzia ubatizo wa Yohana mpaka siku ile alipochukuliwa juu kutoka kwetu, mmoja wa hawa lazima awe shahidi pamoja nasi wa ufufuo wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: kuanzia ubatizo wa Yohana
  rationale: Muundo huu unaonyesha mwanzo wa kipindi kinachotajwa na kuhifadhi genitivi ya Kigiriki kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: mpaka siku ile
  rationale: Pamoja na kitenzi kinachofuata, huu ni usemi wa kawaida wa Kiswahili unaowasilisha kikomo cha wakati.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: alipochukuliwa juu kutoka kwetu
  rationale: “Alichukuliwa juu” huhifadhi hali ya kutendwa na mwelekeo wa kupaa bila kuongeza maneno yasiyomo kama “mbinguni”; “kutoka kwetu” huakisi ἀφ’ ἡμῶν moja kwa moja.
- source_word: μάρτυρα
  choice: shahidi
  rationale: Neno hili humtaja mtu atakayetoa ushuhuda; Kiswahili hakihitaji kibainishi kisicho dhahiri kama Kiingereza.
- source_word: τῆς ἀναστάσεως αὐτοῦ
  choice: wa kufufuka kwake
  rationale: Huhifadhi uhusiano wa genitivi katika Kigiriki na kueleza tukio la yeye kufufuka bila kulibadili kuwa kauli tendwa.
- source_word: σὺν ἡμῖν
  choice: pamoja nasi
  rationale: Hueleza kwamba shahidi mpya ataungana na kundi lililopo katika kutoa ushuhuda.
- source_word: γενέσθαι
  choice: lazima awe
  rationale: Katika Kiswahili, “awe” ni ya kawaida kuliko tafsiri ya moja kwa moja “akuwa” katika muundo huu; “lazima” hubeba nguvu ya δεῖ kutoka mstari uliotangulia.
- source_word: ἕνα τούτων
  choice: mmoja wa hawa
  rationale: Hufuata Kigiriki bila kuongeza “wanaume,” ambalo limetajwa katika muktadha uliotangulia lakini halimo katika kishazi hiki.
theological_decisions:
- issue: Kujumuisha ulazima unaotawaliwa na δεῖ katika mstari uliotangulia
  choice: lazima awe
  alternative: awe tu
  rationale: Mstari huu unategemea kisintaksia δεῖ ya Matendo 1:21. “Lazima” hukamilisha maana kwa Kiswahili bila kuongeza fundisho jipya.
- issue: Kutafsiri rejeo la kupaa kwa Yesu
  choice: alipochukuliwa juu
  alternative: alipopaa mbinguni
  rationale: Chaguo hili huhifadhi hali ya kutendwa ya ἀνελήμφθη na wazo la kuelekea juu bila kuongeza “mbinguni,” neno lisilokuwamo katika mstari huu.
- issue: Uhusiano wa “pamoja nasi”
  choice: awe shahidi pamoja nasi
  alternative: awe pamoja nasi shahidi
  rationale: Mpangilio uliochaguliwa ni wa kawaida zaidi katika Kiswahili na unaonyesha kwamba mtu huyo anajiunga na mitume kama shahidi wa ufufuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi hii inaendeleza muundo wa mstari uliotangulia; kwa hiyo “lazima” imerejeshwa wazi. Hakuna alama za tanbihi kwa sababu hakuna tanbihi iliyohitajika katika rasimu ya Kiswahili.
