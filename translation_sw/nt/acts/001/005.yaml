  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: sw
  text: Kwa maana Yohana alibatiza kwa maji, lakini ninyi mtabatizwa katika Roho Mtakatifu[a] baada ya siku si nyingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Roho Mtakatifu.” Kihusishi cha Kigiriki kinaweza kueleweka kuwa “katika” au “kwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hilo linaanzisha maelezo yanayounga mkono kauli iliyotangulia; “Kwa maana” ni Kiswahili cha kawaida na cha heshima.
- source_word: ἐβάπτισεν
  choice: alibatiza
  rationale: Neno la kidini lililozoeleka linadumisha uhusiano wa kitenzi katika mstari bila kuamua kwa lazima namna ya ubatizo.
- source_word: ὕδατι
  choice: kwa maji
  rationale: Huwasilisha hali ya dativu ya chombo kwa Kiswahili cha kawaida, bila kulazimisha maana ya mahali kama “ndani ya maji.”
- source_word: ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: “Katika” linaakisi ἐν na kuhifadhi uwezekano wa kuelewa Roho kama mazingira au nyanja ya ubatizo; tafsiri ya chombo imewekwa katika tanbihi.
- source_word: βαπτισθήσεσθε
  choice: mtabatizwa
  rationale: Huhifadhi wakati ujao na hali tendwa ya Kigiriki huku mtendaji akibaki bila kutajwa.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: baada ya siku chache
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kwa usahihi kwamba jambo hilo lingetokea muda si mrefu baada ya wakati wa kusema.
theological_decisions:
- issue: Maana ya ἐν katika kauli ya ubatizo wa Roho Mtakatifu
  choice: katika Roho Mtakatifu
  alternative: kwa Roho Mtakatifu
  rationale: Kihusishi ἐν kinaweza kuonyesha nyanja/mazingira au chombo. Matini kuu inatumia “katika” ili kutatua kidogo iwezekanavyo mvutano huo; “kwa” limetolewa kama tafsiri nyingine katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kuondoa utata halisi wa kihusishi ἐν.
