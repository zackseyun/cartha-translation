  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: sw
  text: Baada ya kuomba, wakasema, “Wewe, Bwana[b], mjuzi wa mioyo ya wote, utuonyeshe[a] ni yupi kati ya hawa wawili uliyemchagua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi kilichotafsiriwa “utuonyeshe” kinaweza pia kumaanisha “teua” au “tambulisha”; kinaweza kueleza kufunua au kutaja hadharani yule aliyechaguliwa.
    reason: lexical_alternative
  - marker: b
    text: Neno “Bwana” linaweza kueleweka kuwa linamwelekea Mungu kwa ujumla au Yesu hasa; Kigiriki hakimtambulishi wazi anayerejelewa hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: Kisha wakaomba
  rationale: Kirai cha wakati uliopita kinaonyesha kwamba waliomba kabla ya kusema; ‘Kisha wakaomba’ ni Kiswahili cha kawaida kinachohifadhi mfuatano huo.
- source_word: Σὺ κύριε
  choice: Wewe, Bwana
  rationale: Kiwakilishi cha wazi ‘Wewe’ kinahifadhi msisitizo wa Kigiriki, huku ‘Bwana’ likihifadhi namna ya moja kwa moja ya kumwita anayesikiwa katika sala.
- source_word: καρδιογνῶστα πάντων
  choice: ujuaye mioyo ya wote
  rationale: Neno ambatani la Kigiriki linamtaja anayejua yaliyomo mioyoni; tafsiri hii ni ya asili katika Kiswahili na inahifadhi πάντων, ‘ya wote.’
- source_word: ἀνάδειξον
  choice: tuonyeshe
  rationale: Katika muktadha huu wa kutaka uchaguzi uliokwisha kufanywa ujulikane, ‘tuonyeshe’ halazimishi maana ya kumweka rasmi, ingawa kitenzi kinaweza pia kumaanisha kuteua au kumtambulisha hadharani.
- source_word: ὃν ἐξελέξω
  choice: ni yupi ... uliyemchagua
  rationale: Muundo huu unaonyesha mmoja ambaye Bwana tayari amemchagua na ni wa kawaida katika Kiswahili.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: ni yupi kati ya hawa wawili
  rationale: Hii inaeleza uteuzi wa mmoja kutoka kwa wawili bila kuongeza neno ‘wanaume,’ ambalo halipo wazi katika mstari huu.
theological_decisions:
- issue: Anayerejelewa kwa jina ‘Bwana’ katika sala
  choice: Kubakiza ‘Bwana’ bila kutaja ikiwa ni Mungu kwa ujumla au Yesu hasa.
  alternative: Kueleza wazi kuwa sala inaelekezwa kwa Mungu Baba, au kueleza wazi kuwa inaelekezwa kwa Yesu aliyefufuka.
  rationale: Kigiriki kinasema tu ‘Wewe, Bwana’; kwa hiyo tafsiri inahifadhi utata huo halisi badala ya kuamua suala ambalo mstari wenyewe haulibainishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘ujuaye’ unafaa katika sala na unasikika wa heshima bila kuwa wa kizamani kupita kiasi.
