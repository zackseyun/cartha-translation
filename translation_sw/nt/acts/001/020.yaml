  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: sw
  text: 'Kwa maana imeandikwa katika kitabu cha Zaburi: “Makao yake na yawe ukiwa, wala asiwepo mtu wa kukaa humo,” na, “Mwingine na achukue nafasi yake ya usimamizi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nafasi yake ya usimamizi” hutafsiri ἐπισκοπή; pia inaweza kutafsiriwa “usimamizi wake” au “nafasi yake.” Tafsiri “uaskofu wake” inaweza kudokeza cheo maalumu cha kanisa cha kipindi cha baadaye, jambo ambalo muktadha haulazimishi.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Kauli timilifu tendwa ni fomula ya kawaida ya kunukuu Maandiko; ‘imeandikwa’ ni ya asili katika Kiswahili na inadumisha athari yake ya sasa.
- source_word: βίβλῳ ψαλμῶν
  choice: katika kitabu cha Zaburi
  rationale: Hutambulisha chanzo cha nukuu kwa lugha iliyo wazi na ya kawaida.
- source_word: Γενηθήτω
  choice: na yawe
  rationale: 'Huwakilisha amri ya nafsi ya tatu yenye maana ya ombi au tamko: makao yawe ukiwa.'
- source_word: ἔπαυλις
  choice: makao
  rationale: Neno hili humaanisha mahali pa kuishi; ‘makao’ ni pana, asilia, na linafaa kwa sauti ya Zaburi.
- source_word: ἔρημος
  choice: ukiwa
  rationale: Katika muktadha huu huonyesha mahali palipoachwa bila wakazi na huhifadhi uzito wa lugha ya Maandiko.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: wala asiwepo mtu wa kukaa humo
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la kutokuwapo kwa mkazi, bila kubadili muundo kuwa dai tofauti.
- source_word: ἐπισκοπή
  choice: jukumu lake la usimamizi
  rationale: Hueleza wajibu au nafasi ya kuangalia na kusimamia aliyokuwa nayo Yuda, bila kuingiza cheo maalumu cha kanisa cha kipindi cha baadaye.
- source_word: λαβέτω ἕτερος
  choice: mtu mwingine na achukue
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu na maana ya mtu mwingine kupokea jukumu lililoachwa.
theological_decisions:
- issue: Maana ya ἐπισκοπή katika nafasi iliyoachwa na Yuda
  choice: jukumu lake la usimamizi
  alternative: nafasi yake; uangalizi wake; uaskofu wake
  rationale: Tafsiri hii inaonyesha kazi au dhamana ya kusimamia bila kuamua kwamba neno hilo tayari ni cheo cha kiufundi cha kanisa la baadaye. Tanbihi huhifadhi uwezekano wa ‘nafasi’ au ‘uangalizi’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya heshima na ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘na yawe’ na ‘na achukue’ umetumiwa kuhifadhi nguvu ya amri za nafsi ya tatu katika nukuu.
