  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: sw
  text: Lakini mtapokea nguvu wakati Roho Mtakatifu atakapowashukia, nanyi mtakuwa mashahidi wangu katika Yerusalemu, katika Uyahudi yote na Samaria, na hadi sehemu ya mbali zaidi ya dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “hadi mwisho wa dunia.” Kirai cha Kigiriki kiko katika umoja, lakini kinatumika kinahau kumaanisha sehemu ya mbali zaidi ya dunia; pia kinaweza kutafsiriwa “hadi miisho ya dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Huonyesha utofautishaji na kauli iliyotangulia katika mstari wa 7 kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: λήμψεσθε
  choice: mtapokea
  rationale: Kitenzi hiki hapa humaanisha kupokea kitu kinachotolewa, wala si kujitwalia.
- source_word: δύναμιν
  choice: nguvu
  rationale: Neno hili linahifadhi maana pana ya uwezo wenye nguvu unaotolewa na Roho bila kuufanya kuwa nguvu za mwili pekee.
- source_word: ἐπελθόντος ... ἐφ’ ὑμᾶς
  choice: atakapowashukia
  rationale: Muundo wa wakati umetafsiriwa kwa kishazi cha Kiswahili; ‘kuwashukia’ huonyesha kuja kwa Roho juu yao kwa lugha ya asili na yenye kueleweka.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Roho Mtakatifu
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kumtaja mhusika wa kiungu anayekusudiwa hapa.
- source_word: ἔσεσθέ
  choice: mtakuwa
  rationale: Huwakilisha moja kwa moja wakati ujao wa kitenzi ‘kuwa’ bila kuongeza wazo la mabadiliko ambalo si lazima.
- source_word: μου
  choice: wangu
  rationale: Kiwakilishi tegemezi kinaonyesha kwamba watakuwa mashahidi wa Yesu na waliohusishwa naye.
- source_word: μάρτυρες
  choice: mashahidi
  rationale: Katika muktadha huu ni watu wanaotoa ushuhuda; si lazima neno hilo limaanishe wafia imani.
- source_word: ἔν τε Ἰερουσαλὴμ
  choice: katika Yerusalemu
  rationale: Huanzisha mfululizo wa maeneo bila kulazimisha neno la ziada lisilo la kawaida katika Kiswahili.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ
  choice: katika Uyahudi wote
  rationale: Huhifadhi eneo halisi na upana wake wote.
- source_word: καὶ Σαμαρείᾳ
  choice: na Samaria
  rationale: Kihusishi ‘katika’ kinaeleweka kutoka fungu lililotangulia; muundo huu ni wazi na wa kawaida.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: hadi sehemu ya mbali zaidi ya dunia
  rationale: Hutoa maana ya kijiografia ya nahau ya Kigiriki iliyo katika umoja na huepuka ‘mwisho wa dunia’ kueleweka kimakosa kuwa mwisho wa wakati.
theological_decisions:
- issue: Kumtambulisha πνεῦμα kama mhusika wa kiungu
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Muktadha na kirai chenye kibainishi humrejelea Roho Mtakatifu; herufi kubwa zinaonyesha jina la mhusika bila kuongeza maelezo ya kimadhehebu.
- issue: Upeo wa agizo la kuwa mashahidi
  choice: Maeneo halisi yanayopanuka kutoka Yerusalemu hadi sehemu ya mbali zaidi ya dunia
  alternative: Jiografia ya kiroho au ya kiishara tu
  rationale: Majina halisi ya maeneo na upeo wa dunia yamehifadhiwa bila kuingiza mpangilio wa kieklesia usiotajwa katika mstari.
- issue: Maana ya kuja kwa Roho ‘juu’ ya wanafunzi
  choice: Roho Mtakatifu atakapowashukia
  alternative: Roho Mtakatifu atakapokuja juu yenu
  rationale: ‘Kuwashukia’ ni Kiswahili cha asili kinachohifadhi mwendo unaoelekezwa kwao bila kufafanua zaidi namna au matokeo ya tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina ‘Yerusalemu,’ ‘Uyahudi,’ na ‘Samaria’ yametumiwa kwa maumbo yaliyozoeleka. Alama ya tanbihi [a] imewekwa baada ya kirai inachokifafanua.
