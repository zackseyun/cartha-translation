  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: sw
  text: Basi, walipokusanyika, wakamwuliza, “Bwana, je, wakati huu unaurejesha ufalme kwa Israeli[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya Israeli.” Dativi ya Kigiriki inaweza kumaanisha kwamba ufalme unarejeshwa kwa Israeli, au kwamba unarejeshwa kwa manufaa ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Basi, walipokuwa wamekusanyika pamoja
  rationale: Kirai kishirikishi συνελθόντες kinaeleza wakati au mazingira ya swali, huku μὲν οὖν ikiendeleza simulizi. ‘Basi’ na muundo wa ‘walipokuwa...’ vinatoa Kiswahili cha kawaida bila kutafsiri viunganishi hivyo kwa uzito usio wa lazima.
- source_word: ἠρώτων αὐτὸν
  choice: wakamuuliza
  rationale: Ingawa kitenzi cha Kigiriki ni cha wakati usiotimilifu na kinaweza kuonyesha tendo lililoendelea au lililorudiwa, katika simulizi hili ‘wakamuuliza’ ni tafsiri ya kawaida na ya wazi.
- source_word: λέγοντες
  choice: —
  rationale: Kishirikishi hiki kinatanguliza maneno ya swali. Katika Kiswahili, maana yake inawasilishwa kwa kawaida na kitenzi ‘wakamuuliza’ kikifuatiwa moja kwa moja na nukuu, bila kuongeza ‘wakisema’ isiyo ya lazima.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ huhifadhi heshima ya usemi wa moja kwa moja kwa Yesu na uzito wa cheo κύριος bila kuipunguza kuwa ‘Mwalimu’ au ‘Mkuu’ pekee.
- source_word: εἰ
  choice: je
  rationale: Hapa εἰ inatanguliza swali linalohitaji jibu la ndiyo au hapana, si sentensi ya sharti. ‘Je’ ni alama ya kawaida ya swali hilo katika Kiswahili.
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: wakati huu
  rationale: χρόνος hapa ni kipindi au majira husika, wala si lazima dakika au nukta moja tu. ‘Wakati huu’ ni ya kawaida na huhifadhi upana huo.
- source_word: ἀποκαθιστάνεις
  choice: unarudisha
  rationale: Kitenzi hiki humaanisha kurudisha kitu katika hali au nafasi yake ya awali. ‘Unarudisha’ ni cha moja kwa moja na kinafaa kwa swali la wakati wa sasa.
- source_word: τὴν βασιλείαν
  choice: ufalme
  rationale: Ingawa βασιλεία laweza kumaanisha utawala au ufalme, muktadha wa ‘kwa Israeli’ unaweka mbele matarajio ya wanafunzi kuhusu ufalme. ‘Ufalme’ huhifadhi maana hiyo bila kuamua kama ni wa kisiasa au wa kiroho.
- source_word: τῷ Ἰσραήλ
  choice: kwa Israeli
  rationale: Dativi ya Kigiriki inaweza kuonyesha mpokeaji (‘kwa Israeli’ kwa maana ya kuurudisha kwake) au manufaa (‘kwa ajili ya Israeli’). ‘Kwa Israeli’ ni ya asili katika Kiswahili na huhifadhi kwa kiasi fulani uwezekano huo wa maana mbili.
theological_decisions:
- issue: Asili ya matarajio ya wanafunzi kuhusu ufalme wa Israeli
  choice: Swali limetafsiriwa moja kwa moja kuwa kurudishwa kwa ‘ufalme kwa Israeli,’ bila kueleza kuwa ni ufalme wa kisiasa pekee au wa kiroho pekee.
  alternative: ‘kuurudisha ufalme kwa ajili ya Israeli’ au ‘kuurudisha ufalme wa Israeli’
  rationale: Aya inaripoti swali la wanafunzi; haijaamua hapa ikiwa Yesu anakubali au anasahihisha kila dhana iliyomo katika swali hilo. Tafsiri inapaswa kuhifadhi mvutano huo wa kihistoria na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali ni wa kawaida na huepuka urudiaji usio wa lazima wa ‘wakisema.’
