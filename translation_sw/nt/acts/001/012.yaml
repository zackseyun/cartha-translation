  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: sw
  text: Kisha wakarudi Yerusalemu kutoka mlima unaoitwa Mlima wa Mizeituni, ulio karibu na Yerusalemu, umbali wa mwendo wa Sabato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwendo wa Sabato” ulikuwa umbali ambao kwa desturi Myahudi angeweza kusafiri siku ya Sabato.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Kiunganishi cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: wakarudi Yerusalemu
  rationale: Kitenzi kinaonyesha kurudi mahali walikotoka; muundo huu ni wa kawaida na wa asili katika simulizi la Kiswahili.
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: kutoka mlima unaoitwa Mlima wa Mizeituni
  rationale: ὄρος ni mlima, na Ἐλαιῶνος hutaja mahali panapohusishwa na mizeituni. Jina linalotambulika 'Mlima wa Mizeituni' ni wazi na la kawaida katika Kiswahili.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: ulio karibu na Yerusalemu
  rationale: Huhifadhi kishazi cha uhusiano kinachoeleza ukaribu wa mlima na Yerusalemu.
- source_word: σαββάτου ἔχον ὁδόν
  choice: umbali wa mwendo wa Sabato
  rationale: Huhifadhi nahau ya Kiyahudi ya kipimo cha safari bila kuibadili kuwa umbali wa kisasa usiotajwa katika chanzo.
theological_decisions:
- issue: Nahau ya Kiyahudi σαββάτου ἔχον ὁδόν
  choice: umbali wa mwendo wa Sabato
  alternative: umbali wa safari iliyoruhusiwa siku ya Sabato
  rationale: Chaguo kuu linahifadhi usemi wa chanzo na muktadha wake wa Kiyahudi; tanbihi hufafanua desturi bila kuingiza ufafanuzi huo ndani ya aya kana kwamba ulikuwa sehemu ya maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Jina 'Mlima wa Mizeituni' limetumiwa moja kwa moja badala ya kuazima 'Oliveti,' kwa kuwa ni wazi na limezoeleka.
