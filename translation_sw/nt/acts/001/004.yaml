  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: sw
  text: Naye alipokuwa pamoja nao[a], aliwaamuru wasiondoke Yerusalemu, bali waingojee ahadi ya Baba, ambayo mlisikia kutoka kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipokusanyika pamoja nao”; wengine wanaelewa kirai hiki kuwa “alipokuwa akila pamoja nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: alipokuwa pamoja nao
  rationale: Kitenzi hiki kina ugumu wa kimaana, lakini muktadha unaonyesha wazi kwamba Yesu alikuwa pamoja na mitume. Tafsiri hii ni ya kawaida katika Kiswahili na haichagui kimyakimya kati ya maana zinazowezekana za kukusanyika au kula pamoja.
- source_word: παρήγγειλεν
  choice: aliwaamuru
  rationale: Neno hili linaonyesha agizo lenye mamlaka. “Aliwaamuru” linahifadhi uzito huo kuliko “aliwaagiza,” ambalo linaweza kusikika laini zaidi.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: wasiondoke Yerusalemu
  rationale: Katika muktadha huu, kirai kina maana ya kutouacha mji. Muundo huu ni wa asili na ulio wazi katika Kiswahili.
- source_word: περιμένειν
  choice: waingojee
  rationale: “Kuingojea” huonyesha kusubiri kwa matarajio kitu kilichoahidiwa na ni muundo wa kawaida wa Kiswahili.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: ahadi ya Baba
  rationale: Tafsiri hii inafuata muundo wa Kigiriki kwa ukaribu na kuhifadhi uwezekano wa kuelewa ahadi kuwa ile iliyotolewa na Baba bila kuongeza neno “zawadi.”
- source_word: ἣν ἠκούσατέ μου
  choice: ambayo mlisikia kutoka kwangu
  rationale: Kirai hiki kinawakilisha kwa ufupi na kwa kawaida maana ya kusikia jambo kutoka kwa Yesu, bila kufafanua zaidi ya maandishi ya chanzo.
theological_decisions:
- issue: Maana ya συναλιζόμενος kuhusu shughuli ya Yesu baada ya kufufuka
  choice: alipokuwa pamoja nao
  alternative: alipokusanyika pamoja nao; alipokuwa akila pamoja nao
  rationale: Tafsiri ya jumla inaonyesha kwamba Yesu alikuwa pamoja na mitume bila kuamua kwa nguvu hoja ya kileksika inayobishaniwa. Uwezekano wa kula pamoja nao, ambao unaweza kusisitiza hali ya kimwili ya kuonekana kwake baada ya kufufuka, umehifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kawaida, wa sasa na wenye heshima. “Naye” linaendeleza kiunganishi cha simulizi; “aliwaamuru” linahifadhi mamlaka ya agizo, na “ahadi ya Baba” linaepuka ufafanuzi wa kiteolojia usiotajwa wazi.
