  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: sw
  text: Kwa hiyo, ni lazima mmoja wa wanaume walioandamana nasi[a] katika muda wote ambao Bwana Yesu aliingia na kutoka kati yetu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaume waliokuwa pamoja nasi”; kwa maana halisi zaidi, “wanaume waliokusanyika pamoja nasi.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “aliingia na kutoka kati yetu” ni nahau inayorejelea maisha na huduma ya Yesu ya wazi, akiendelea kuwa pamoja na wanafunzi.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: ni lazima
  rationale: Kitenzi hiki kisicho na mtendaji maalumu kinaonyesha ulazima. Kauli “ni lazima” ni ya kawaida na inaacha sentensi iendelee hadi mstari unaofuata.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na maelezo yaliyotangulia.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: mmoja wa wanaume walioandamana nasi
  rationale: ἀνδρῶν humaanisha wanaume hasa, na συνελθόντων katika muktadha huu inaonyesha kuwa walikuwa pamoja na mitume kwa kipindi chote. “Walioandamana nasi” linaeleza ushirika huo wa kudumu kwa Kiswahili cha kawaida. Neno “mmoja” linaonyesha uhusiano wa kishazi hiki na “mmoja wa hawa” katika mwendelezo wa sentensi kwenye mstari wa 22.
- source_word: ἐν παντὶ χρόνῳ
  choice: katika muda wote
  rationale: Kirai hiki kinarejelea kipindi chote cha huduma ya Yesu akiwa pamoja nao, si kila tukio moja moja.
- source_word: ᾧ
  choice: ambao
  rationale: Kiwakilishi hiki kinaunganisha muda uliotajwa na shughuli ya Yesu katika kipindi hicho.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: aliingia na kutoka
  rationale: Tafsiri hii inadumisha picha ya nahau ya chanzo kuhusu maisha na shughuli za kawaida za Yesu akiwa pamoja na wanafunzi.
- source_word: ἐφ’ ἡμᾶς
  choice: kati yetu
  rationale: Katika nahau hii, kirai kinaeleza shughuli za Yesu akiwa miongoni mwa kundi la wanafunzi.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Bwana Yesu
  rationale: “Bwana” ni tafsiri ya kawaida na yenye uzito unaofaa kwa cheo κύριος kinachotumiwa kumhusu Yesu.
theological_decisions:
- issue: Tafsiri ya κύριος kama cheo cha Kristo
  choice: Bwana Yesu
  alternative: Mwalimu Yesu
  rationale: “Bwana” huhifadhi uzito wa heshima na maana ya kiteolojia ya κύριος katika Matendo; “Mwalimu” ingepunguza maana hiyo.
- issue: Rejeo la kijinsia katika ἀνδρῶν
  choice: wanaume
  alternative: watu
  rationale: Neno la Kigiriki ἀνήρ linataja wanaume hasa, kwa hiyo tafsiri haijatumia neno lisiloonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki wazi kuendelea katika mstari wa 22, kama ilivyo sentensi ya Kigiriki.
