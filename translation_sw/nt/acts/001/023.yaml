base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: sw
  text: 'Nao wakawasilisha watu wawili: Yosefu aliyeitwa Barsaba[a], ambaye pia aliitwa Yusto, na Mathiya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawaweka mbele watu wawili” au “wakapendekeza watu wawili.” Kitenzi cha Kigiriki hapa kinaweza kumaanisha kuwaweka watu mbele ya kundi, yaelekea kama waliopendekezwa kwa uchaguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: wakawasilisha
  rationale: Katika muktadha wa kuwachagua watu, kitenzi hiki kinaonyesha kuwa watu hao waliwekwa mbele ya kundi kama waliopendekezwa; “wakawasilisha” ni lugha ya kawaida na haimaanishi kwamba tayari waliwateua rasmi.
- source_word: δύο
  choice: watu wawili
  rationale: Namba hii inawahusu wanaume wawili waliowasilishwa; kuongeza “watu” hufanya Kiswahili kiwe wazi na cha kawaida.
- source_word: καλούμενον
  choice: aliyeitwa
  rationale: Kirai hiki kinamtambulisha Yosefu kwa jina jingine bila kuamua kama lilikuwa jina la ukoo, lakabu, au namna nyingine ya kutambulishwa.
- source_word: Βαρσαββᾶν
  choice: Barsaba
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: ἐπεκλήθη
  choice: ambaye pia aliitwa
  rationale: Kitenzi hiki kinaanzisha jina jingine la Yosefu; “pia” huonyesha kwa kawaida uhusiano wake na jina lililotangulia bila kuongeza dai jipya.
- source_word: Ἰοῦστος
  choice: Yusto
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: Μαθθίαν
  choice: Mathiya
  rationale: Jina limetoholewa kwa namna inayoeleweka na wasomaji wa Kiswahili.
- source_word: καὶ ... καὶ
  choice: Nao ... na
  rationale: “Nao” huendeleza simulizi kwa kawaida, na “na” huunganisha majina ya wale wawili.
theological_decisions:
- issue: Je, ἔστησαν inamaanisha waliwateua rasmi au waliwasilisha kama wagombea?
  choice: wakawasilisha
  alternative: wakawateua
  rationale: Muktadha unaofuata unaonyesha hatua ya kupendekeza watu kabla ya uchaguzi wa mwisho; tafsiri haipaswi kudokeza kwamba uteuzi ulikuwa tayari umekamilika.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Tahadhari: maelezo ya chini yameandikwa kufafanua hasa ἔστησαν; katika toleo la kuchapishwa maandishi bora ya tanbihi [a] ni: “Au ‘wakawaweka mbele watu wawili’ au ‘wakapendekeza watu wawili.’ Kitenzi cha Kigiriki hapa kinaweza kumaanisha kuwaweka watu mbele ya kundi, yaelekea kama waliopendekezwa kwa uchaguzi.”'
