  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: sw
  text: Baada ya kuteseka, alijionyesha pia kwao akiwa hai, kwa uthibitisho mwingi,[a] akiwatokea kwa muda wa siku arobaini[b] na kuzungumza nao kuhusu ufalme wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa dalili nyingi za hakika.” Neno la Kigiriki humaanisha ushahidi unaoweka jambo wazi kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Au “katika kipindi cha siku arobaini.” Usemi huo unaonyesha kwamba aliwatokea mara mbalimbali katika kipindi hicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: kwao
  rationale: Kiwakilishi hiki cha uhusiano katika hali ya kutoa kinawarejelea mitume waliotajwa katika mstari uliotangulia. “Kwao” hufuata Kigiriki kwa karibu bila kuongeza neno “wanaume,” ambalo halipo wazi katika kirai hiki.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: alijionyesha ... akiwa hai
  rationale: Muundo wenye kiwakilishi rejeshi unaonyesha kwamba Yesu alijidhihirisha kwao, huku ζῶντα ikieleza hali yake baada ya kuteseka. Kiswahili hiki ni cha kawaida na kinaweka wazi kwamba alikuwa hai.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: baada ya kuteseka
  rationale: 'μετά pamoja na kitenzi-jina chenye kibainishi huonyesha wakati: kujionyesha kulitokea baada ya mateso yake. Tafsiri haiongezi maelezo kuhusu aina ya mateso.'
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: kwa dalili nyingi za hakika
  rationale: τεκμήριον ni dalili au ushahidi unaothibitisha jambo kwa uhakika. “Dalili nyingi za hakika” ni Kiswahili kinachoeleweka na kinahifadhi uzito wa ushahidi wa neno la Kigiriki.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: katika kipindi cha siku arobaini
  rationale: διά pamoja na hali ya umilikishi huonyesha matukio yaliyotokea ndani ya muda ulioenea kwa siku arobaini, si lazima bila kukoma muda wote.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: akiwatokea
  rationale: Kitenzi hiki kwa kawaida humaanisha kuonekana au kumtokea mtu, hasa katika masimulizi ya baada ya ufufuo. “Akiwatokea” ni fasaha na huhifadhi wazo la matukio ya kujionyesha.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: kuzungumza nao kuhusu ufalme wa Mungu
  rationale: τὰ περὶ humaanisha mambo yanayohusu jambo fulani. “Kuzungumza nao kuhusu” ni Kiswahili cha kawaida kinachowasilisha mafundisho yake bila kutafsiri neno kwa neno kwa namna isiyo ya asili.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hili ndilo tamko la kawaida la Kiswahili na linahifadhi upana wa βασιλεία, unaoweza kuhusisha utawala wa kifalme na eneo la utawala huo.
theological_decisions:
- issue: Lugha ya ufufuo na nguvu ya ushahidi
  choice: Yesu alijionyesha akiwa hai baada ya kuteseka, kwa dalili nyingi za hakika.
  alternative: Yesu alijionyesha baada ya mateso yake kwa uthibitisho mwingi usiokosea.
  rationale: Kigiriki kinathibitisha wazi kwamba alikuwa hai baada ya kuteseka na kwamba kujitokeza kwake kulitoa ushahidi wenye uhakika. Tafsiri inaacha dai hilo lisimame bila kuongeza istilahi nzito kama “usiokosea.”
- issue: Rejeleo la οἷς
  choice: kwao
  alternative: kwa watu hao
  rationale: Ingawa kiwakilishi kinawarejelea mitume waliotajwa awali, neno la Kigiriki lenyewe haliongezi nomino “wanaume” au “watu.” “Kwao” ni sahihi na linategemea muktadha kama ilivyo katika chanzo.
- issue: Maana ya βασιλεία
  choice: ufalme wa Mungu
  alternative: utawala wa Mungu
  rationale: βασιλεία linaweza kusisitiza utawala au ufalme. “Ufalme wa Mungu” ni usemi mpana na uliozoeleka ambao hauondoi kimyakimya mojawapo ya maana hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa kuwa wa asili kwa kuanza na kirai cha wakati, huku uhusiano wa matendo na uzito wa ushahidi wa Kigiriki ukihifadhiwa. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
