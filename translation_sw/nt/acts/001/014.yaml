  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: sw
  text: Hawa wote walikuwa wakidumu kwa moyo mmoja[a] katika kusali, pamoja na wanawake[b], Maria, mama yake Yesu, na ndugu zake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nia moja”; neno la Kigiriki linasisitiza umoja wa kusudi, si kukusanyika mahali pamoja tu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema “pamoja na wanawake,” bila kibainishi kinacholingana na “wale.” Huenda ikawa inarejelea kundi lililojulikana la wanawake waliokuwa pamoja na wanafunzi.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki hapa kwa kawaida humaanisha “ndugu wa kiume.” Wengine hulielewa kwa maana pana ya jamaa wa karibu; kifungu hiki hakielezi zaidi uhusiano wao.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Hawa wote
  rationale: Huhifadhi nguvu ya kiashiria οὗτοι na ujumla wa πάντες kwa Kiswahili cha kawaida.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: walidumu
  rationale: Muundo wa kitenzi unaonyesha tendo lililoendelea, nalo προσκαρτερέω linasisitiza kuendelea kwa uthabiti na kujitoa.
- source_word: ὁμοθυμαδόν
  choice: kwa moyo mmoja
  rationale: Huwasilisha umoja wa nia na kusudi, wala si kuwapo pamoja kimwili tu.
- source_word: τῇ προσευχῇ
  choice: katika kusali
  rationale: Kwa kuandamana na προσκαρτερέω, usemi huu unaonyesha shughuli ambayo waliendelea kuifanya kwa bidii; 'kusali' ni ya asili na inayoeleweka katika Kiswahili cha sasa.
- source_word: σὺν γυναιξίν
  choice: pamoja na wanawake
  rationale: Hufuata ukosefu wa kibainishi katika Kigiriki na kuepuka kuamua bila lazima kwamba walikuwa kundi lililotajwa tayari.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: Maria mama yake Yesu
  rationale: Jina la kawaida la Kiswahili 'Maria' na kirai cha ufafanuzi vinamtambulisha moja kwa moja.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: na ndugu zake
  rationale: '''Ndugu'' ndilo neno la kawaida la Kiswahili kwa ἀδελφοί hapa, lakini linaweza kuwa pana kuliko neno la Kigiriki; tanbihi huhifadhi suala la uhusiano wao bila kuliamua kidhehebu.'
theological_decisions:
- issue: Uhusiano wa ἀδελφοί na Yesu
  choice: ndugu zake
  alternative: ndugu zake wa kiume; jamaa zake
  rationale: ἀδελφοί kwa kawaida humaanisha ndugu wa kiume, lakini mapokeo ya Kikristo hutofautiana kuhusu uhusiano wao mahususi. Tafsiri haitamki ikiwa walikuwa ndugu wa tumbo moja, ndugu wa kambo, au jamaa wa karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. 'Walidumu' na 'kwa moyo mmoja' huhifadhi mwendelezo na umoja wa kundi bila lugha nzito; tanbihi zinaacha wazi tofauti halisi za kileksia na kitheolojia.
