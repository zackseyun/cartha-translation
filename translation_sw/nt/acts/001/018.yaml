  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: sw
  text: Basi mtu huyu alijipatia shamba[c] kwa ujira wa udhalimu[a]; naye, alipoanguka kichwa mbele[b], alipasuka katikati, na matumbo yake yote yakamwagika nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa malipo ya udhalimu.” Kauli ya Kigiriki inaweza kutafsiriwa kwa namna hiyo; “ujira wa udhalimu” huhifadhi taswira ya malipo na maana yake ya kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Au, “akiwa kifudifudi” au “alipoanguka kifudifudi.” Kauli ya Kigiriki yaelekea kueleza kuanguka kichwa mbele.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema “alijipatia” shamba. Hii inaweza kumaanisha kwamba shamba lilikuja kuwa milki iliyohusishwa naye kwa njia ya fedha zake, si lazima kwamba yeye mwenyewe alilinunua moja kwa moja.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Basi, mtu huyu
  rationale: “Mtu huyu” humrejelea Yuda, na “basi” huonyesha mwendelezo na matokeo ya maelezo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἐκτήσατο
  choice: alijipatia
  rationale: Kitenzi hiki kina maana pana ya kupata au kujipatia milki; hakilazimishi maana finyu ya kununua moja kwa moja.
- source_word: χωρίον
  choice: shamba
  rationale: Neno hili kwa kawaida humaanisha shamba au kipande cha ardhi; “shamba” ni tafsiri fupi na ya kawaida katika muktadha huu.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: kwa ujira wa uovu
  rationale: “Ujira” huhifadhi taswira ya malipo, na “uovu” huwasilisha uzito wa kimaadili wa ἀδικία kwa lugha inayoeleweka kwa urahisi.
- source_word: πρηνὴς γενόμενος
  choice: alipoanguka kichwa mbele
  rationale: Kauli hii inaeleza hali ya kuelekea chini kwa kichwa au kulala kifudifudi; tafsiri hii ni ya asili na inaonyesha kuanguka kichwa mbele bila kuifanya kauli kuwa ya kitaalamu.
- source_word: ἐλάκησεν μέσος
  choice: alipasuka katikati
  rationale: Huhifadhi wazi tendo la kupasuka na mahali pake katikati, kwa Kiswahili cha moja kwa moja.
- source_word: ἐξεχύθη
  choice: yakamwagika nje
  rationale: Kitenzi hiki hueleza vilivyokuwa ndani kumwagika au kutiririka nje; “yakamwagika nje” ni wazi na ya kawaida.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: matumbo yake yote
  rationale: Katika simulizi hili σπλάγχνα ni viungo vya ndani, hasa matumbo; “matumbo” ni neno la sasa na linaloeleweka kuliko istilahi za kale.
theological_decisions:
- issue: Uhusiano wa Yuda na kupatikana kwa shamba
  choice: Kutafsiri ἐκτήσατο kuwa “alijipatia” badala ya “alinunua,” ili kueleza kupatikana kwa milki bila kubainisha zaidi jinsi kulivyotokea.
  alternative: “Alinunua shamba” mwenyewe, au shamba lilinunuliwa kwa jina lake/kwa fedha iliyohusishwa naye.
  rationale: Kigiriki kinaruhusu maana pana ya kupata milki. Tafsiri hii haiondoi kwa lazima mvutano na Mathayo 27:5–8 wala kuingiza upatanisho ndani ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umebaki wa moja kwa moja na wenye uzito wa simulizi, huku ukiepuka istilahi za kale na kutatua kimya kimya utata wa chanzo.
