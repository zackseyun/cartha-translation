  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: sw
  text: Katika siku hizo, Petro akasimama katikati ya ndugu akasema (na idadi ya watu waliokusanyika pamoja ilikuwa karibu mia moja ishirini).[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume, lakini katika kusanyiko hili huenda linawahusu waumini wote, kutia ndani wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Kitenzi hiki kinaonyesha Petro akiinuka ili aseme; muundo wa masimulizi wenye “aka-” ni wa kawaida katika Kiswahili na unahifadhi tendo halisi.
- source_word: ἐν μέσῳ
  choice: katikati ya
  rationale: Tafsiri hii inadumisha wazo la Petro kuwa ndani ya kundi lililokusanyika, bila kulifanya kuwa mahali maalumu kupita kiasi.
- source_word: ἀδελφῶν
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida na lenye heshima katika Kiswahili kwa waumini wenzao; linaweza kutumiwa kwa kundi lenye wanaume na wanawake, huku tanbihi ikieleza umbo la Kigiriki.
- source_word: ὄχλος ὀνομάτων
  choice: idadi ya watu
  rationale: Kirai cha Kigiriki, kwa neno, ni kama “umati wa majina,” lakini ni nahau inayowarejelea watu waliohesabiwa. “Idadi ya watu” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila usemi usioeleweka.
- source_word: ἐπὶ τὸ αὐτό
  choice: waliokusanyika pamoja
  rationale: Kirai hiki kinaonyesha kwamba watu hao walikuwa pamoja kama kusanyiko; tafsiri hii ni wazi na ya kawaida.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: karibu 120
  rationale: ὡς ikitumika pamoja na namba huonyesha makadirio; “karibu” inadumisha kutokuwa kamili kwa idadi.
theological_decisions:
- issue: Rejeo la kijinsia la ἀδελφῶν katika kusanyiko la waumini
  choice: Kutumia “ndugu” katika matini na kueleza katika tanbihi kwamba neno la Kigiriki lina umbo la kiume lakini huenda linawahusu waumini wote.
  alternative: “ndugu wa kiume na wa kike” au “waumini”
  rationale: “Ndugu” ni la asili katika Kiswahili na halilazimishi matini kutaja jinsia ambazo Kigiriki hakizitaji waziwazi; tanbihi inadumisha umbo la chanzo na uwezekano wa maana jumuishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi “akasimama ... akasema” ni wa kawaida; mabano yanadumisha taarifa ya pembeni katika chanzo.
