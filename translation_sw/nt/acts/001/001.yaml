id: ACT.1.1
reference: Acts 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: sw
  text: Katika simulizi la kwanza[a], ee Theofilo, niliandika kuhusu yote ambayo Yesu alianza kufanya na kufundisha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “simulizi lililotangulia” au “kitabu cha kwanza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: Katika simulizi la kwanza
  rationale: Hapa λόγος humaanisha simulizi au maandishi yaliyotungwa, si neno moja. “Simulizi la kwanza” ni Kiswahili cha asili kinachodumisha wazo la mpangilio katika πρῶτον na kurejelea kitabu kilichotangulia.
- source_word: ἐποιησάμην
  choice: niliandika
  rationale: Pamoja na λόγον, kitenzi hiki humaanisha kutunga au kuandaa maandishi; “niliandika” ndilo tamko la kawaida na wazi zaidi katika Kiswahili.
- source_word: περὶ πάντων ... ὧν
  choice: kuhusu yote ambayo
  rationale: Muundo huu unaonyesha mada ya maandishi na kuunganisha πάντων na kiwakilishi husishi ὧν bila kudai zaidi ya upeo wa simulizi lenyewe.
- source_word: ὦ Θεόφιλε
  choice: ee Theofilo
  rationale: “Ee” hudumisha nguvu ya mwito wa moja kwa moja wa ὦ kwa lugha ya heshima, bila kuongeza hisia ya ukaribu isiyomo katika Kigiriki.
- source_word: ἤρξατο
  choice: alianza
  rationale: Chaguo hili hudumisha maana wazi ya kitenzi na uwezekano wa kwamba kazi ya Yesu inaendelea katika Matendo, bila kuufafanua uwezekano huo ndani ya tafsiri.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: kufanya na kufundisha
  rationale: Muunganiko wa vitenzi vyote viwili unadumishwa. Kiswahili hakihitaji kisawe tofauti cha τε ... καί ili kuonyesha wazi uhusiano huu.
theological_decisions:
- issue: Dokezo la ἤρξατο kuhusu kuendelea kwa kazi ya Yesu katika Matendo
  choice: Kudumisha “alianza” katika matini bila kueleza mwendelezo huo moja kwa moja.
  alternative: Kutafsiri “yote ambayo Yesu alifanya na kufundisha,” au kufafanua kwamba aliendelea kufanya kupitia mitume.
  rationale: Kigiriki kinasema wazi “alianza.” Neno hilo linaweza kudokeza mwendelezo wa kazi ya Yesu katika Matendo, lakini tafsiri haipaswi kuamua au kupanua dokezo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Ee” imetumiwa kama mwito wa moja kwa moja wa kifasihi, na “simulizi” huepuka maana finyu ya “neno” huku ikidumisha aina ya maandishi yanayorejelewa.
