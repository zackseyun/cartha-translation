id: ACT.1.25
reference: Acts 1:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: sw
  text: ili achukue nafasi katika huduma hii na utume huu, ambao Yuda aliuacha[a] ili aende mahali pake mwenyewe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alikengeuka kutoka katika huduma na utume huo,” au “alianguka kutoka humo.” Kitenzi cha Kigiriki kinaweza kumaanisha kukengeuka au kuondoka katika huduma na utume.
    reason: lexical_alternative
  - marker: b
    text: “Mahali pake mwenyewe” huenda likamaanisha tu mahali palipokuwa pake Yuda, au, kwa maana yenye mkazo zaidi, mahali pa hukumu palipomfaa.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: achukue
  rationale: Katika muktadha wa ombi hili, kitenzi hiki kinaonyesha mtu kuchukua jukumu lililoachwa wazi; “achukue” ni cha kawaida na bado hudumisha maana ya msingi ya kupokea au kutwaa.
- source_word: τόπον
  choice: nafasi
  rationale: Hapa τόπος inatumiwa kwa maana ya nafasi au jukumu. “Nafasi” ni ya asili katika Kiswahili na pia inaruhusu mwangwi wa neno hilo katika kauli ya mwisho kuhusu “mahali pake mwenyewe.”
- source_word: διακονίας
  choice: huduma
  rationale: Neno hili linamaanisha utumishi au huduma iliyokabidhiwa; “huduma” linafaa kwa kazi ya kitume inayozungumziwa.
- source_word: ἀποστολῆς
  choice: utume
  rationale: Hapa neno hili linahusu wito na jukumu la mtume, si safari au ujumbe wa kawaida tu.
- source_word: ἀφ’ ἧς
  choice: ambao ... aliuacha
  rationale: Muundo huu wa Kiswahili unaonyesha kuondoka kwa Yuda katika huduma na utume uliotajwa, bila kulazimisha istilahi nzito zaidi ya Kigiriki.
- source_word: παρέβη
  choice: aliuacha
  rationale: Katika muktadha huu kitenzi kinaweza kueleza kukengeuka, kuondoka, au kuiacha nafasi aliyokuwa amepewa. “Aliuacha” ni wazi na cha asili, huku tanbihi ikihifadhi uwezekano mwingine wa kileksia.
- source_word: πορευθῆναι
  choice: ili aende
  rationale: Hii inatoa kwa urahisi mwendo unaofuata kuondoka kwa Yuda. “Ili” inaweza kusikika kama kusudi au matokeo, na kwa hiyo haiufungi kabisa uhusiano wa kisintaksia.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: mahali pake mwenyewe
  rationale: Kauli hii inadumisha ufupi na utata wenye uzito wa Kigiriki, bila kuamua katika matini kuu kama inamaanisha kaburi, hukumu, au mahali palipomfaa Yuda.
theological_decisions:
- issue: Maana ya “mahali pake mwenyewe” kuhusu hatima ya Yuda
  choice: Kudumisha kauli yenye utata “mahali pake mwenyewe” katika matini kuu.
  alternative: Kuitafsiri wazi kuwa kaburi, mauti, jehanamu, au mahali pa hukumu.
  rationale: Kigiriki hakitambulishi wazi mahali huko. Tafsiri haipaswi kuamua fundisho ambalo kauli yenyewe imelihifadhi katika hali ya utata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Huduma” na “utume” zimetumiwa kama istilahi zinazohusiana lakini zisizofananishwa kabisa. Utata wa mwisho wa mstari umehifadhiwa.
