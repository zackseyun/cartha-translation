  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: sw
  text: Baada ya kusema hayo, walipokuwa wakitazama, aliinuliwa juu[a], na wingu[b] likamchukua[c], akatoweka machoni pao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alichukuliwa juu.”
    reason: lexical_alternative
  - marker: b
    text: Wingu linaweza kukumbusha matukio ya Biblia ambamo wingu linaashiria uwepo wa Mungu, ingawa aya hii haisemi hivyo waziwazi.
    reason: cross_reference
  - marker: c
    text: Au, “likampokea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Kishirikishi cha wakati uliopita kinaonyesha kwamba kuinuliwa kulitokea baada ya Yesu kusema maneno yaliyotangulia. Kiswahili hiki ni cha asili na hakiongezi maana nyingine.
- source_word: βλεπόντων αὐτῶν
  choice: walipokuwa wakitazama
  rationale: Muundo huu unaonyesha kitendo kilichokuwa kikiendelea wakati Yesu alipoinuliwa; tafsiri inadumisha kwamba walikuwa mashahidi wa tukio hilo.
- source_word: ἐπήρθη
  choice: aliinuliwa juu
  rationale: Kauli ya kutendwa inadumishwa, huku neno “juu” likiweka wazi mwendo unaoonekana katika muktadha bila kumtaja mtendaji ambaye Kigiriki hakumtaji.
- source_word: νεφέλη
  choice: wingu
  rationale: Nomino hii haina kibainishi katika Kigiriki; “wingu” ni tafsiri ya kawaida isiyolazimisha maana ya kitheolojia katika matini kuu.
- source_word: ὑπέλαβεν
  choice: likamchukua
  rationale: Kitenzi kinaweza kumaanisha kuchukua au kupokea. “Likamchukua” ni Kiswahili cha sasa na cha kueleweka kinachoonyesha kwamba wingu lilimwondoa machoni pao.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: akatoweka machoni pao
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kwamba hawakuweza kumwona tena, bila kufuata nahau ya Kigiriki kwa namna ngumu.
theological_decisions:
- issue: Iwapo ἐπήρθη itafsiriwe kwa istilahi ya kimapokeo yenye maana ya wazi zaidi ya kupaa
  choice: aliinuliwa juu
  alternative: alichukuliwa juu
  rationale: “Aliinuliwa juu” inafuata kwa karibu kauli ya kutendwa na mwendo wa kwenda juu unaosimuliwa, bila kumtaja mtendaji au kuingiza istilahi ya mafundisho ambayo aya yenyewe haitumii.
- issue: Iwapo wingu litambulishwe wazi kuwa ishara ya uwepo wa Mungu
  choice: wingu
  alternative: wingu la uwepo wa Mungu
  rationale: Ingawa wingu linaweza kukumbusha matukio mengine ya Biblia yanayohusishwa na uwepo wa Mungu, aya hii haisemi hivyo moja kwa moja. Uwezekano huo umewekwa katika tanbihi badala ya kuingizwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sentensi ni wa masimulizi ya kawaida; kauli ya kutendwa na uwezekano wa maana za vitenzi vya Kigiriki vimedumishwa bila kuongeza maelezo ya kimadhehebu.
