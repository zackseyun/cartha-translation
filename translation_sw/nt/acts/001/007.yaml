id: ACT.1.7
reference: Acts 1:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: sw
  text: Lakini akawaambia, “Si juu yenu kujua nyakati au majira[a] ambayo Baba ameyaweka kwa mamlaka yake mwenyewe.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyakati au nyakati zilizowekwa,” au “vipindi au majira.” Kigiriki hutumia maneno mawili yanayohusiana, χρόνους na καιρούς, kwa vipindi vya muda na nyakati maalumu au zilizowekwa.
    reason: lexical_alternative
  - marker: b
    text: Au “katika mamlaka yake mwenyewe.” Usemi wa Kigiriki ni halisi zaidi “katika mamlaka yake mwenyewe,” yaani mambo hayo yako chini ya haki ya Baba mwenyewe ya kuamua.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye utofauti wa kiasi kutoka swali la wanafunzi kwenda jibu la Yesu linalowasahihisha.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Si juu yenu kujua
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba kujua jambo hilo si sehemu yao wala haki yao, bila kuongeza dhana ya kukatazwa moja kwa moja.
- source_word: χρόνους
  choice: nyakati
  rationale: Neno hili linaweza kumaanisha vipindi vya muda; “nyakati” ni tafsiri fupi na ya kawaida inayoweza kuunganishwa na “majira.”
- source_word: καιρούς
  choice: majira
  rationale: Neno hili mara nyingi hudokeza wakati unaofaa, uliowekwa, au wenye umuhimu maalumu. “Majira” linahifadhi tofauti ya kiasi na χρόνους bila kuifanya kuwa istilahi ngumu.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Kigiriki kinasema “Baba,” si “Baba yangu”; cheo hicho kimehifadhiwa kama kilivyo.
- source_word: ἔθετο
  choice: ameyaweka
  rationale: Kitenzi kina maana ya kuweka, kuamua, au kuteua; kauli timilifu inaonyesha tendo lililofanywa ambalo bado lina umuhimu.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: kwa mamlaka yake mwenyewe
  rationale: Huwasilisha kwa Kiswahili cha kawaida kwamba Baba ameweka mambo hayo kwa haki na uwezo wake mwenyewe, huku tanbihi ikihifadhi umbo halisi zaidi la kihusishi.
theological_decisions:
- issue: Uwasilishaji wa jozi χρόνους / καιρούς
  choice: nyakati au majira
  alternative: nyakati au nyakati zilizowekwa; vipindi au majira
  rationale: Inahifadhi maneno mawili yanayohusiana bila kulazimisha mfumo maalumu wa kinabii au tofauti ya kiufundi ambayo mstari hauifafanui.
- issue: Maana ya ἐξουσία kuhusu Baba
  choice: kwa mamlaka yake mwenyewe
  alternative: katika mamlaka yake mwenyewe
  rationale: Inaeleza wazi haki ya Baba ya kuamua mambo hayo bila kuingiza maelezo ya kimafundisho yaliyo nje ya mstari; tanbihi inahifadhi uwezekano wa tafsiri iliyo halisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Si juu yenu kujua” ni usemi unaoeleweka kwa wasomaji wa kawaida na unahifadhi wazo la kwamba maarifa hayo hayapo katika sehemu au mamlaka ya wanafunzi. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
