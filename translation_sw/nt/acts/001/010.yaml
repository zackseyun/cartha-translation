  text: Nao walipokuwa wakitazama kwa makini mbinguni, yeye alipokuwa akienda[a], tazama, wanaume wawili walikuwa wamesimama karibu nao, wamevaa mavazi meupe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “angani.” Neno la Kigiriki linaweza kumaanisha “mbingu” au “anga”; hapa “mbinguni” limetumiwa kwa sababu ya muktadha wa kupaa.
