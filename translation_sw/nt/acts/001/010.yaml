lexical_decisions:
- source_word: ἀτενίζοντες
  choice: wakikaza macho
  rationale: Kitenzi hiki kinaonyesha kutazama kwa makini na kwa kudumu, si kutupia jicho tu. ‘Kukaza macho’ ni usemi wa kawaida wa Kiswahili unaohifadhi mkazo huo.
- source_word: οὐρανόν
  choice: mbinguni
  rationale: Neno la Kigiriki linaweza kumaanisha anga au mbingu. Katika muktadha wa kupaa kwa Yesu, ‘mbinguni’ linafaa, huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: πορευομένου αὐτοῦ
  choice: alipokuwa akienda
  rationale: Muundo wa genitive absolute unaonyesha tendo lililokuwa likiendelea wakati uleule; tafsiri hii inahifadhi uambatano wa matendo bila kuongeza kwamba alikuwa akiondoka au akipaa.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni kiashiria cha mazungumzo kinachovuta fikira kwa jambo linalofuata. ‘Tazama’ huhifadhi uzito wake wa kisimulizi bila kuongeza dhana ya ghafula.
- source_word: ἄνδρες δύο
  choice: wanaume wawili
  rationale: ἀνήρ humaanisha mwanamume, si mtu kwa ujumla. Tafsiri hii ni sahihi kijinsia na haiwatambulishi kama malaika kabla ya maandishi yenyewe kufanya hivyo.
- source_word: παρειστήκεισαν
  choice: wakasimama kando yao
  rationale: Hapa kitenzi kinaonyesha kuwapo kwao karibu na wanafunzi. ‘Wakasimama kando yao’ ni Kiswahili cha asili na hakiongezi wazo la kwamba walitokea kimiujiza.
- source_word: ἐσθήσεσι λευκαῖς
  choice: wamevaa mavazi meupe
  rationale: ἐσθής ni neno pana la mavazi. ‘Mavazi meupe’ halibainishi bila msingi kwamba yalikuwa majoho.
theological_decisions:
- issue: Maana ya οὐρανός katika muktadha wa kupaa
  choice: mbinguni
  alternative: angani
  rationale: Muktadha wa kupaa kwa Yesu unaelekeza kwenye maana ya ‘mbingu,’ lakini neno lenyewe pia linaweza kumaanisha anga; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Utambulisho wa wanaume wawili
  choice: wanaume wawili
  alternative: malaika wawili
  rationale: Andiko la Kigiriki linasema ‘wanaume wawili’ na haliwaiti waziwazi malaika katika mstari huu. Tafsiri haiongezi utambulisho unaodokezwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unahifadhi mwendo wa simulizi na mkazo wa ‘tazama,’ huku tanbihi zikihifadhi uwezekano wa maana za οὐρανός na ἐσθής.
