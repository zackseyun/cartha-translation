lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: wakawapigia kura
  rationale: Kirai hiki kwa maana halisi ni ‘waliwapa kura,’ lakini katika muktadha huu ni nahau inayoeleza kutumia kura kuchagua kati ya watu hao wawili. ‘Wakawapigia kura’ ni Kiswahili cha kawaida kinachohifadhi wazo la uchaguzi kwa kura.
- source_word: κλήρους / ὁ κλῆρος
  choice: kura / kura
  rationale: Katika simulizi hili κλῆρος ni kitu au njia ya kufanya uchaguzi kwa kura, si fungu la urithi. Kiswahili ‘kura’ kinaweza kutaja utaratibu huo na pia matokeo yake.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: kura ikamwangukia Mathiya
  rationale: Hii inahifadhi sitiari ya Kigiriki kwamba kura ‘iliangukia’ mtu, huku ikiwa nahau inayoeleweka kwa Kiswahili.
- source_word: Μαθθίαν
  choice: Mathiya
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: συγκατεψηφίσθη
  choice: akahesabiwa pamoja na
  rationale: Kitenzi kina maana ya kuhesabiwa au kuwekwa katika idadi pamoja na kundi fulani. Tafsiri hii ni karibu na Kigiriki na haiongezi madai yasiyosemwa wazi.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: pamoja na wale mitume kumi na mmoja
  rationale: μετά pamoja na hali ya genitivi humaanisha ‘pamoja na.’ ‘Wale’ huonyesha kundi la mitume kumi na mmoja lililotajwa katika muktadha kabla Mathiya hajahesabiwa pamoja nao.
theological_decisions:
- issue: Iwapo συγκατεψηφίσθη itafsiriwe kwa namna inayodokeza uteuzi wa kiungu zaidi ya taarifa ya simulizi
  choice: akahesabiwa pamoja na wale mitume kumi na mmoja
  alternative: akaongezwa kwa wale mitume kumi na mmoja
  rationale: Tafsiri iliyochaguliwa inaripoti hadhi ya Mathiya baada ya kura kumwangukia bila kuingiza dai lenye nguvu zaidi la kikanisa au kisakramenti kuliko linalotolewa na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Viunganishi ‘Kisha,’ ‘na,’ na ‘naye’ vinafuata mwendelezo wa sentensi ya Kigiriki bila kufanya Kiswahili kuwa kizito.
