id: ACT.1.17
reference: Acts 1:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: sw
  text: Kwa maana alikuwa amehesabiwa miongoni mwetu, naye alipokea sehemu katika huduma hii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipata fungu lililogawiwa la huduma hii.” Neno la Kigiriki κλῆρος linaweza kumaanisha “kura,” “fungu,” au “sehemu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hilo linatoa sababu au maelezo ya kauli iliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi kinachohifadhi nguvu hiyo.
- source_word: κατηριθμημένος ἦν
  choice: alikuwa amehesabiwa
  rationale: 'Muundo huu unaonyesha hali iliyotokana na tendo lililotangulia: Yuda alikuwa ameingizwa katika hesabu ya kundi. Tafsiri hii pia inadumisha hali ya kutendwa.'
- source_word: ἐν ἡμῖν
  choice: miongoni mwetu
  rationale: Kirai hiki kinaonyesha kuwa alikuwa sehemu ya kundi, si kwamba alikuwa karibu nao tu.
- source_word: ἔλαχεν
  choice: alipokea
  rationale: Kitenzi kinaweza kumaanisha kupata kwa kura au kupokea fungu lililogawiwa. “Alipokea” ni ya asili katika Kiswahili, huku wazo la fungu likibebwa na “sehemu” na kufafanuliwa katika tanbihi.
- source_word: τὸν κλῆρον
  choice: sehemu
  rationale: κλῆρος linaweza kumaanisha kura, fungu, au sehemu iliyogawiwa. “Sehemu” linaeleza ushiriki wa Yuda katika wajibu huu bila kudai moja kwa moja kwamba kura ilipigwa katika tukio hili.
- source_word: τῆς διακονίας ταύτης
  choice: katika huduma hii
  rationale: διακονία hapa ni huduma au wajibu wa kitume. “Katika huduma hii” ni muundo wa kawaida wa Kiswahili pamoja na “sehemu” na unahifadhi maana ya ushiriki katika huduma hiyo.
theological_decisions:
- issue: Uhusiano wa Yuda na cheo na huduma ya kitume
  choice: Aya inasema kwamba Yuda alihesabiwa kuwa sehemu ya kundi hilo na alipokea sehemu katika huduma yao.
  alternative: Kudhoofisha kauli hiyo kana kwamba Yuda alishirikiana nao tu bila kuwa sehemu halisi ya kundi.
  rationale: Maneno ya Kigiriki yanathibitisha kujumuishwa kwake na ushiriki wake katika huduma, lakini hayaelezi kukubaliwa kwa tabia yake wala kudumu kwake. Tafsiri inaacha mvutano huo kama ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Miongoni mwetu” huonyesha wazi ushiriki ndani ya kundi; “huduma” linafaa kwa muktadha wa wajibu wa kitume. Alama ya tanbihi imewekwa baada ya sentensi.
