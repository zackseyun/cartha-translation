base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: sw
  text: Jambo hilo likajulikana kwa watu wote waliokuwa wakiishi Yerusalemu, hivi kwamba shamba lile likaitwa, katika lugha yao wenyewe[a], Hakeldamaki[b], yaani, Shamba la Damu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika lahaja yao wenyewe.” Neno la Kigiriki διάλεκτος linaweza kumaanisha lahaja au lugha.
    reason: lexical_alternative
  - marker: b
    text: Jina hili huandikwa “Hakeldama” katika tafsiri nyingi. Matini ya Kigiriki hapa ina Ἁκελδαμάχ.
    reason: alternative_reading
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: Jambo hilo likajulikana
  rationale: Muundo huu unaonyesha kwamba jambo lililotangulia lilikuja kujulikana. Kuongeza “jambo hilo” kunafanya sentensi iwe ya kawaida katika Kiswahili bila kueleza zaidi ya muktadha.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: kwa wote waliokuwa wakiishi Yerusalemu
  rationale: Huhifadhi maana ya watu waliokuwa wakikaa huko na kutumia Kiswahili cha kawaida na kinachoeleweka.
- source_word: ὥστε
  choice: hata
  rationale: 'Hapa neno hili linaonyesha matokeo: kujulikana kwa jambo hilo kulisababisha shamba kuitwa kwa jina hilo. “Hata” huunganisha matokeo hayo kwa ufasaha.'
- source_word: κληθῆναι
  choice: likaitwa
  rationale: Kauli tendwa inadumishwa na inaonyesha matokeo yaliyotokea bila kutaja waliolipa jina.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: shamba lile
  rationale: χωρίον inaweza kumaanisha eneo au kipande cha ardhi; “shamba” hudumisha ulinganifu na ufafanuzi wa jina, “Shamba la Damu.”
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: katika lugha yao wenyewe
  rationale: διάλεκτος inaweza kumaanisha lugha au lahaja. “Lugha” ni ya kawaida zaidi hapa, huku tanbihi ikihifadhi uwezekano wa “lahaja.”
- source_word: Ἁκελδαμάχ
  choice: Hakeldama
  rationale: Umbo hili la Kiswahili linawakilisha jina la Kiaramu kwa namna inayosomeka kwa urahisi; konsonanti ya mwisho ya umbo la Kigiriki Ἁκελδαμάχ imeelezwa katika tanbihi.
- source_word: τοῦτ’ ἔστιν
  choice: yaani
  rationale: Ni njia ya kawaida na fupi ya Kiswahili ya kuingiza maana au ufafanuzi wa jina.
- source_word: Χωρίον Αἵματος
  choice: Shamba la Damu
  rationale: Hili ndilo tafsiri wazi ya jina iliyotolewa katika matini ya Kigiriki; herufi kubwa zinaonyesha matumizi yake kama jina la mahali.
