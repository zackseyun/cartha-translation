  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: sw
  text: 'Walipoingia, walipanda kwenda kwenye chumba cha ghorofani ambamo walikuwa wakikaa: Petro, Yohana, Yakobo na Andrea; Filipo na Tomaso; Bartholomayo na Mathayo; Yakobo mwana wa Alfayo, Simoni Zelote, na Yuda mwana wa Yakobo[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yuda ndugu ya Yakobo.” Kigiriki kinasema tu “Yuda wa Yakobo,” bila kueleza wazi uhusiano wao.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: Walipoingia
  rationale: Muundo huu wa wakati unaonyesha tendo lililotangulia kupanda kwao, na unasikika kwa kawaida katika Kiswahili bila kulazimika kutaja mahali ambapo Kigiriki hakupataji wazi.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: walipanda kwenda kwenye chumba cha ghorofani
  rationale: Tafsiri hii inahifadhi mwendo wa kwenda juu unaoelezwa na ἀνέβησαν na pia maana ya ὑπερῷον kuwa chumba kilicho katika sehemu ya juu ya jengo.
- source_word: οὗ ἦσαν καταμένοντες
  choice: walimokuwa wakikaa
  rationale: Neno καταμένω pamoja na muundo wa kitenzi hapa linaonyesha kuendelea kukaa mahali fulani; ‘walimokuwa wakikaa’ ni Kiswahili cha kawaida chenye maana hiyo ya kudumu kwa muda.
- source_word: ὅ τε Πέτρος καὶ Ἰωάννης καὶ Ἰάκωβος καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος
  choice: Walikuwa Petro, Yohana, Yakobo na Andrea; Filipo na Tomaso; Bartholomayo na Mathayo
  rationale: ‘Walikuwa’ linaitambulisha orodha kwa uwazi, huku alama za nuktamkato zikihifadhi makundi ya majina bila kuiga kupita kiasi marudio ya viunganishi vya Kigiriki.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Yakobo mwana wa Alfayo
  rationale: Katika orodha ya majina, hali ya umilikaji inaeleweka kwa kawaida kama jina la baba; kuongeza ‘mwana wa’ kunafanya uhusiano huo uwe wazi katika Kiswahili.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Simoni Zelote
  rationale: ζηλωτής ni lakabu ya kumtambulisha Simoni. ‘Zelote’ ni namna iliyokubalika katika Kiswahili cha Biblia na huepuka kuibadili lakabu hiyo kuwa maelezo ya kawaida tu ya kuwa na bidii.
- source_word: Ἰούδας Ἰακώβου
  choice: Yuda mwana wa Yakobo
  rationale: Katika orodha ya wanaume wanaotambulishwa kwa majina ya baba zao, maana inayowezekana zaidi ni ‘mwana wa Yakobo.’ Hata hivyo, Kigiriki hakitaji wazi aina ya uhusiano, kwa hiyo uwezekano mwingine umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uhusiano unaomaanishwa na Ἰούδας Ἰακώβου
  choice: Yuda mwana wa Yakobo
  alternative: Yuda ndugu ya Yakobo
  rationale: Kigiriki kina maana halisi ya ‘Yuda wa Yakobo’ bila kutaja kama alikuwa mwana au ndugu. Muktadha wa orodha ya mitume unaunga mkono zaidi uhusiano wa mwana na baba, lakini tanbihi inalinda utata halisi wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa baada ya maelezo ya mahali ili orodha ndefu ya majina isomeke kwa urahisi. ‘Chumba cha ghorofani’ ni usemi wa kawaida unaoonyesha sehemu ya juu ya jengo bila kuingiza maana maalumu ya kikanisa.
