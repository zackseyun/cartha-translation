  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: sw
  text: hadi siku ile ambayo, baada ya kuwapa mitume aliowachagua maagizo kwa njia ya Roho Mtakatifu[a], alichukuliwa juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Roho Mtakatifu.” Kirai cha Kigiriki kinaweza kutafsiriwa kwa namna inayoonyesha njia au uwakala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: hadi siku ile ambayo
  rationale: Kirai hiki kinaonyesha mwisho wa kipindi kinachozungumziwa katika mstari wa 1. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha muundo wa wakati wa Kigiriki.
- source_word: ἐντειλάμενος
  choice: baada ya kutoa maagizo
  rationale: Hali-tendo ya wakati uliopita inatangulia kitendo kikuu cha kuchukuliwa juu. “Baada ya” huonyesha mfuatano huo wazi, na “maagizo” huhifadhi uzito wa ἐντέλλομαι kuliko neno laini kama “maelekezo.”
- source_word: τοῖς ἀποστόλοις
  choice: kwa mitume
  rationale: “Mitume” ndilo neno lililozoeleka na sahihi kwa kundi hili maalumu katika Luka–Matendo.
- source_word: διὰ πνεύματος ἁγίου
  choice: kupitia Roho Mtakatifu
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au mhusika wa kutenda. “Kupitia” hudumisha maana hiyo bila kufafanua zaidi ya maandishi.
- source_word: οὓς ἐξελέξατο
  choice: aliokuwa amewachagua
  rationale: Kishazi hiki kinawatambulisha mitume kuwa wale ambao Yesu alikuwa amewachagua kabla ya kuchukuliwa juu. Muundo “alikuwa amewachagua” huonyesha utangulizi huo wa kitendo.
- source_word: ἀνελήμφθη
  choice: alichukuliwa juu
  rationale: Hii huhifadhi kauli tendwa na maana ya moja kwa moja ya kitenzi bila kuongeza “mbinguni,” jambo ambalo halijasemwa wazi katika mstari huu.
theological_decisions:
- issue: Uhusiano wa maagizo ya Yesu na Roho Mtakatifu
  choice: Yesu alitoa maagizo kupitia Roho Mtakatifu kwa mitume kabla ya kuchukuliwa juu.
  alternative: Yesu alitoa maagizo kwa Roho Mtakatifu.
  rationale: Muundo wa Kigiriki kwa kawaida unaunganisha διὰ πνεύματος ἁγίου na ἐντειλάμενος, ukionyesha njia au mhusika ambaye kupitia kwake Yesu alitoa maagizo. Tafsiri na tanbihi zinahifadhi uwezekano huo bila kuupanua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Mstari umehifadhiwa kama mwendelezo wa sentensi iliyoanza katika mstari wa 1.
