    rationale: Inaakisi Kigiriki kwa karibu, lakini ‘akiwa amefahamu kwa undani zaidi habari kuhusu’ ni ya kawaida zaidi na bado haiwezi kupunguza maana ya ufahamu sahihi/wa kina zaidi.
