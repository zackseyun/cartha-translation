  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: sw
  text: Lakini Feliksi, akiwa amefahamu kwa undani zaidi habari kuhusu ile Njia,[b] aliahirisha kusikiliza shauri lao,[a] akisema, “Lisia, yule kamanda, atakaposhuka, nitaamua kesi yenu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliwaweka kando”; kitenzi cha Kigiriki kinaweza kumaanisha kuchelewesha au kuahirisha hatua ya mahakama.
    reason: lexical_alternative
  - marker: b
    text: “Njia” lilikuwa jina la mapema la harakati ya Kikristo.
    reason: cultural_note
  - marker: c
    text: Au “nitaamua mambo yanayowahusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο
  choice: aliwaahirisha
  rationale: Kitenzi hiki katika muktadha wa mahakama kinamaanisha kuchelewesha au kuahirisha uamuzi; ‘aliwaahirisha’ pia huhifadhi kiwakilishi cha watu αὐτούς.
- source_word: αὐτούς
  choice: -wa- (aliwaahirisha)
  rationale: Kiambishi cha ngeli ya watu kinawarejelea moja kwa moja wahusika waliokuwa mbele ya Feliksi, badala ya kuongeza ‘kesi’ au ‘mashauri’ katika sehemu hii.
- source_word: ἀκριβέστερον εἰδὼς
  choice: akiwa anajua kwa usahihi zaidi
  rationale: Huhifadhi nguvu ya ulinganisho ya ἀκριβέστερον na maana ya kujua ya εἰδὼς, bila kudokeza tu kwamba alikuwa amepashwa habari.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: mambo yanayohusu ile Njia
  rationale: ‘Njia’ ni jina lililotumiwa katika Matendo kwa harakati ya Kikristo; ‘ile’ huonyesha matumizi hayo maalumu bila kuongeza ‘hii,’ ambayo haipo katika Kigiriki.
- source_word: εἴπας
  choice: akisema
  rationale: Huunganisha usemi na kitenzi kikuu kwa njia ya kawaida na yenye ufupi katika Kiswahili.
- source_word: Ὅταν ... καταβῇ
  choice: atakaposhuka
  rationale: Huonyesha tukio maalumu linalotarajiwa wakati ujao na kuhifadhi picha ya kijiografia ya kushuka.
- source_word: χιλίαρχος
  choice: kamanda
  rationale: Ni neno la kisasa na linaloeleweka kwa mkuu wa kijeshi wa Roma, bila kutumia istilahi ngeni kama ‘kilarki’.
- source_word: διαγνώσομαι
  choice: nitaamua
  rationale: Katika muktadha wa kisheria, kitenzi hiki humaanisha kufikia uamuzi baada ya kuchunguza jambo.
- source_word: τὰ καθ’ ὑμᾶς
  choice: kesi yenu
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kwa uwazi maana ya mambo ya kisheria yanayowahusu washtakiwa.
