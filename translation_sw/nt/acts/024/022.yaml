  rationale: Marekebisho yanafanya usemi wa mahakama uwe wa kawaida katika Kiswahili kwa kutaja usikilizaji wa shauri lao, jambo linalowasilisha maana ya muktadha wa ἀνεβάλετο pamoja na αὐτούς bila kudai kwamba nomino ‘shauri’ iko wazi katika Kigiriki. Pia yameboresha mtiririko wa kirai cha ufahamu wa Feliksi. Tanbihi zimehifadhiwa, na alama zake zimewekwa kwenye vipashio vinavyohusika.
