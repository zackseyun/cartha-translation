base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: sw
  text: Lakini Wayahudi fulani kutoka Asia[a] walipaswa kuwapo mbele yako na kunishtaki[b], kama wangekuwa na jambo lolote dhidi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” hapa ni jimbo la Roma lililokuwa Asia Ndogo, si bara la Asia la leo.
    reason: cultural_note
  - marker: b
    text: Au, “kutoa mashtaka dhidi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: fulani
  rationale: Huonyesha kundi lisilotajwa kwa majina; “Wayahudi fulani” ni Kiswahili cha kawaida na sahihi.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha utofautishaji na kauli iliyotangulia.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: kutoka Asia
  rationale: Huhifadhi jina la kihistoria kwa ufupi, huku tanbihi ikifafanua kuwa ni jimbo la Roma.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Ni neno la kawaida la Kiswahili kwa watu wa Kiyahudi katika muktadha huu.
- source_word: ἔδει
  choice: walipaswa
  rationale: Huwasilisha wajibu au ulazima wa wakati uliopita na kudokeza kuwa jambo hilo halikutimizwa.
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: kuwapo mbele yako
  rationale: Hufaa kwa muktadha wa kisheria wa kufika mbele ya mtawala anayesikiliza kesi.
- source_word: κατηγορεῖν
  choice: kunishtaki
  rationale: Neno hili lina maana ya kisheria ya kumshtaki mtu na ni la moja kwa moja katika Kiswahili cha sasa.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: ikiwa walikuwa na jambo lolote dhidi yangu
  rationale: Huhifadhi upana wa usemi wa Kigiriki bila kuubana kuwa shtaka rasmi pekee, huku muktadha wa kesi ukiendelea kuwa wazi.
