  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: sw
  text: Kisha akamwagiza akida amweke Paulo chini ya ulinzi, lakini ampe uhuru kiasi[a], na asimzuie yeyote wa watu wake[b] kumhudumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ampe nafuu” au “amlegezee masharti.” Neno la Kigiriki linaweza kumaanisha nafuu, wepesi, au kiwango fulani cha uhuru kutoka katika kizuizi kikali.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wa kwake.” Huenda hii inawahusu washirika au wafuasi wa Paulo walioruhusiwa kumsaidia.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: akamwagiza
  rationale: Kitenzi hiki kinaonyesha kutoa agizo lenye mamlaka. Muundo wa simulizi wa Kiswahili wenye “aka-” unawasilisha kwa kawaida tendo linalofuata katika mfululizo.
- source_word: τῷ ἑκατοντάρχῃ
  choice: akida
  rationale: “Akida” ni neno la Kiswahili lililozoeleka katika muktadha wa Agano Jipya kwa ofisa wa Kirumi aliyesimamia kikosi cha takriban askari mia.
- source_word: τηρεῖσθαι αὐτόν
  choice: amweke Paulo chini ya ulinzi
  rationale: Katika muktadha huu τηρέω inamaanisha kumzuia mtu akiwa chini ya uangalizi rasmi. Kutaja “Paulo” badala ya kiwakilishi pekee huleta uwazi wa kawaida katika Kiswahili bila kubadili rejeo.
- source_word: ἔχειν τε ἄνεσιν
  choice: ampe uhuru kiasi
  rationale: ἄνεσις inaweza kumaanisha nafuu, wepesi, au kulegezewa masharti. “Uhuru kiasi” huonyesha kwamba Paulo hakufunguliwa kabisa bali alipewa nafuu ndani ya kizuizi.
- source_word: τε ... καὶ
  choice: lakini ... wala
  rationale: “Lakini” huonyesha tofauti ya kimuktadha kati ya kuwekwa chini ya ulinzi na kupewa uhuru kiasi; “wala” huunganisha agizo la kutomzuia yeyote kwa mtiririko wa asili wa Kiswahili.
- source_word: μηδένα κωλύειν
  choice: asimzuie yeyote
  rationale: 'Huhifadhi nguvu ya katazo linalomhusu kila mtu: hakuna anayepaswa kuzuiwa.'
- source_word: τῶν ἰδίων αὐτοῦ
  choice: yeyote wa watu wake
  rationale: Kigiriki kinasema kwa upana “wa kwake” bila kubainisha kama ni ndugu, marafiki, au waamini wenzake. “Watu wake” huhifadhi upana huo.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: kumhudumia
  rationale: Kitenzi kinaweza kumaanisha kutumikia, kusaidia, au kumpatia mtu huduma. “Kumhudumia” ni cha kawaida na kinaweza kujumuisha msaada wa mahitaji ya vitendo bila kuingiza maana maalumu ya kidini.
