translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inatumia mtiririko wa kawaida wa simulizi; “akida” huhifadhi cheo cha kijeshi kilichozoeleka katika tafsiri za Biblia, huku tanbihi zikihifadhi upana wa maana katika ἄνεσις na τῶν ἰδίων αὐτοῦ.
