  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: sw
  text: Nao Wayahudi pia wakaunga mkono mashtaka hayo[a], wakidai kwamba mambo hayo yalikuwa hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajiunga katika shambulio hilo.”
    reason: Kitenzi cha Kigiriki kinaweza kusisitiza kujiunga katika shambulio; hapa ni shambulio la maneno katika mazingira ya mahakama.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: wakaunga mkono mashtaka hayo
  rationale: Kitenzi hiki kinaweza kumaanisha kujiunga katika shambulio. Katika mazingira haya ya mahakama, kinaonyesha kwamba Wayahudi waliungana na mashtaka yaliyotolewa na Tertulo. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha muktadha wa kisheria.
- source_word: δὲ καὶ
  choice: Nao ... pia
  rationale: δὲ inaendeleza simulizi kwa kiunganishi chepesi, huku καὶ ikionyesha kwamba Wayahudi waliongeza sauti zao kwa shtaka lililokuwa limetolewa tayari.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo jina la kawaida na linaloeleweka kwa kundi lililokuwapo kwenye usikilizaji huu.
- source_word: φάσκοντες
  choice: wakisisitiza
  rationale: Kitenzi hiki cha usemi kinaonyesha kwamba walithibitisha kwa nguvu madai yaliyotolewa. ‘Wakisisitiza’ inafaa mazingira ya mahakama bila kudokeza kuwa madai yao yalikuwa ya kweli au ya uwongo.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi hiki kinarejelea kwa upana mambo yote yaliyodaiwa katika mashtaka yaliyotangulia.
- source_word: οὕτως ἔχειν
  choice: yalikuwa kweli
  rationale: Huu ni usemi wenye maana ya kwamba mambo yalikuwa hivyo au yalikuwa kama yalivyodaiwa. Kiswahili ‘yalikuwa kweli’ huwasilisha maana hiyo kwa kawaida katika muktadha huu.
