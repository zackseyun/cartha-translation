base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: sw
  text: Nao hawakunikuta hekaluni nikibishana na mtu yeyote wala nikichochea umati[a], wala katika masinagogi wala popote jijini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikisababisha umati ukusanyike.” Kirai cha Kigiriki kinaweza kumaanisha kusababisha mkusanyiko au msukosuko wa hadhara, lakini si lazima kimaanishe ghasia kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: hekaluni
  rationale: Katika Matendo, ἱερόν kwa kawaida humaanisha eneo lote la hekalu, si patakatifu pa ndani pekee; “hekaluni” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: εὗρόν με
  choice: hawakuniona
  rationale: Katika muktadha huu wa ushahidi wa kisheria, maana ni kwamba washtaki hawakumkuta wala kumshuhudia Paulo akifanya mambo hayo. “Hawakuniona” ni ya asili katika Kiswahili na inaweka wazi dai lake kuhusu walichoshuhudia.
- source_word: πρός τινα διαλεγόμενον
  choice: nikibishana na mtu yeyote
  rationale: διαλέγομαι inaweza kumaanisha kujadiliana, kutoa hoja, au kubishana. Muktadha wa kujitetea dhidi ya shtaka la kuchochea fujo unapendelea “kubishana,” bila kudai kwamba kila matumizi ya kitenzi hiki ni ya uhasama.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: nikichochea umati
  rationale: Kirai hiki kinaeleza kusababisha mkusanyiko au msukosuko wa umati. “Kuchochea umati” kinafikisha wazo la kuvuruga hadhara bila kuongeza maana kali ya ghasia kamili.
- source_word: ὄχλου
  choice: umati
  rationale: “Umati” ni neno la kawaida kwa kundi kubwa la watu; haliongezi kwa lazima dhana ya kundi lenye vurugu kama ambavyo “genge” lingeweza kufanya.
- source_word: συναγωγαῖς
  choice: masinagogi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa maeneo ya mikutano na ibada ya Kiyahudi.
- source_word: κατὰ τὴν πόλιν
  choice: popote jijini
  rationale: κατά pamoja na hali ya kushutumiwa hapa huonyesha eneo lote la mji. “Popote jijini” huendana vizuri na miundo hasi inayotangulia na kusisitiza kwamba hawakumwona akifanya hayo mahali pengine mjini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Sentensi imehifadhi muundo wa msisitizo wa οὔτε...οὔτε...οὔτε kwa kutumia “wala,” huku “popote jijini” ikifanya upeo wa ukanushaji uwe wazi. Alama ya tanbihi [a] imewekwa mara moja baada ya kirai kinachohusika.
