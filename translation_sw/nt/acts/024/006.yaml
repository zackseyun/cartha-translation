  choice: Kutafsiri kifungu cha SBLGNT pekee, kinachoishia “nasi tukamkamata,”
  alternative: Baadhi ya hati zinaongeza kwamba walitaka kumhukumu Paulo kwa mujibu wa sheria yao, lakini jemadari Lisia akamwondoa mikononi mwao.
  rationale: Matini chanzo iliyotolewa ina usomaji mfupi. Nyongeza inayojulikana kutoka mapokeo mengine haijaingizwa katika matini kuu, lakini imetajwa katika tanbihi ili kuhifadhi ushahidi wa tofauti ya hati.
