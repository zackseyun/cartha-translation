lexical_decisions:
- source_word: ὃς
  choice: alijaribu
  rationale: Kiwakilishi rejeshi kinamrejelea Paulo; katika Kiswahili asilia mtenda huonyeshwa katika kiambishi cha kitenzi bila kulazimika kuongeza “yeye ambaye”.
- source_word: καὶ
  choice: Hata
  rationale: 'Katika shtaka hili καὶ ina nguvu ya kusisitiza: Paulo anadaiwa kwamba alifikia hatua ya kujaribu kulinajisi hekalu.'
- source_word: τὸ ἱερὸν
  choice: hekalu
  rationale: ἱερόν hapa ni eneo lote la hekalu, si patakatifu pa ndani pekee; “hekalu” ndiyo istilahi ya kawaida na inayoeleweka.
- source_word: ἐπείρασεν
  choice: alijaribu
  rationale: Kitenzi hiki hapa kinamaanisha kufanya jaribio au kujaribu kutenda jambo.
- source_word: βεβηλῶσαι
  choice: kulinajisi
  rationale: βέβηλόω humaanisha kunajisi au kuvunjia utakatifu; “kulinajisi” linafaa kwa shtaka linalohusu usafi na utakatifu wa hekalu.
- source_word: ὃν
  choice: -m- katika tukamkamata
  rationale: Kiwakilishi hiki kinamrejelea Paulo kama yambwa; Kiswahili hukiwakilisha kwa kiambishi cha yambwa -m- ndani ya kitenzi.
- source_word: ἐκρατήσαμεν
  choice: tukamkamata
  rationale: κρατέω hapa ni kumtia mtu mikononi au kumkamata. “Tukamkamata” huhifadhi tendo la kumshika bila kulifanya liwe neno la kisheria zaidi kuliko Kigiriki.
