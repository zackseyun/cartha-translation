  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: sw
  text: Wakati huohuo, alikuwa akitumaini kwamba Paulo angempa fedha[a]. Kwa sababu hiyo, alimwita Paulo mara nyingi zaidi na kuzungumza naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana mahsusi zaidi katika muktadha huu, “alikuwa akitumaini kupata rushwa kutoka kwa Paulo.” Kigiriki kinasema tu “fedha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: Wakati huohuo
  rationale: Inaonyesha kwamba tumaini hili liliendelea sambamba na matukio yaliyotangulia, kwa Kiswahili cha kawaida na cha asili.
- source_word: ἐλπίζων
  choice: alikuwa akitumaini
  rationale: Muundo huu unaonyesha tumaini lililoendelea katika kipindi hicho.
- source_word: χρήματα
  choice: fedha
  rationale: Neno la Kigiriki linamaanisha fedha kwa ujumla; ingawa muktadha unadokeza rushwa, tafsiri kuu hailifanyi dokezo hilo kuwa wazi kupita chanzo.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: Paulo angempa fedha
  rationale: Kauli tendaji ni ya asili zaidi katika Kiswahili huku ikihifadhi Paulo kuwa chanzo cha fedha zilizotarajiwa.
- source_word: διὸ καὶ
  choice: Kwa sababu hiyo
  rationale: Inaonyesha wazi kwamba kuitwa kwa Paulo mara kwa mara kulitokana na tumaini la kupewa fedha.
- source_word: πυκνότερον
  choice: mara nyingi zaidi
  rationale: Inahifadhi maana linganishi ya kuongezeka kwa marudio.
- source_word: μεταπεμπόμενος
  choice: alituma watu wamwite
  rationale: Kitenzi cha kati humaanisha kutuma watu wamlete au kumwita mtu; usemi huu unafaa mazingira ya Paulo kuwa chini ya ulinzi.
- source_word: ὡμίλει αὐτῷ
  choice: akazungumza naye
  rationale: Inaonyesha mazungumzo ya ana kwa ana, si hotuba rasmi.
theological_decisions:
- issue: Iwapo nia potovu ya Feliksi itajwe wazi kuwa rushwa katika matini kuu
  choice: Kudumisha neno “fedha” katika matini kuu na kuweka maana mahsusi katika tanbihi
  alternative: alitumaini Paulo angempa rushwa
  rationale: Muktadha unadokeza kwa nguvu kwamba ilikuwa rushwa, lakini χρήματα lenyewe ni “fedha,” si neno mahsusi la rushwa. Hivyo tafsiri inadumisha mvutano kati ya usemi wa jumla na maana inayodokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa sentensi umefanywa wa asili bila kufuta uhusiano wa sababu au dokezo la ufisadi.
