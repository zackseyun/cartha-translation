id: ACT.24.1
reference: Acts 24:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: sw
  text: Baada ya siku tano, kuhani mkuu Anania aliteremka pamoja na baadhi ya wazee na msemaji fulani aitwaye Tertulo[a]. Wakawasilisha mashtaka dhidi ya Paulo mbele ya gavana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakili aitwaye Tertulo”; neno la Kigiriki linaweza kumaanisha msemaji wa hadhara au mwakilishi wa kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Baada ya siku tano
  rationale: μετά pamoja na hali ya kushutumiwa huonyesha muda uliopita, yaani “baada ya.” δέ ni kiunganishi chepesi cha kuendeleza simulizi na si lazima kitafsiriwe kwa neno tofauti hapa.
- source_word: κατέβη
  choice: aliteremka
  rationale: Inahifadhi maana ya mwelekeo ya καταβαίνω, kwa kuwa safari ilikuwa kutoka Yerusalemu kwenda Kaisaria.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: kuhani mkuu Anania
  rationale: ἀρχιερεύς hapa ni cheo cha kuhani mkuu wa Kiyahudi; jina limetoholewa kwa desturi ya Kiswahili.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: pamoja na baadhi ya wazee
  rationale: πρεσβύτεροι ni viongozi wazee wa Kiyahudi katika muktadha huu, na τινῶν huonyesha idadi isiyotajwa.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: msemaji fulani aitwaye Tertulo
  rationale: ῥήτωρ inaweza kumaanisha msemaji wa hadhara au mwakilishi wa kisheria. “Msemaji” huhifadhi upana huo, huku tanbihi ikionyesha maana ya kisheria inayowezekana.
- source_word: οἵτινες ἐνεφάνισαν
  choice: Wakawasilisha mashtaka
  rationale: Katika muktadha wa kisheria, ἐμφανίζω humaanisha kutoa taarifa rasmi au kuleta mashtaka; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: dhidi ya Paulo mbele ya gavana
  rationale: κατά pamoja na hali ya umilikaji ina maana ya “dhidi ya” katika shtaka, na ἡγεμών ni gavana wa Kirumi; “mbele ya” ni usemi wa kawaida wa kimahakama.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wenye heshima. “Gavana” limetumiwa kwa cheo cha utawala wa Kirumi, na utata wa jukumu la Tertulo umehifadhiwa kwa tanbihi.
