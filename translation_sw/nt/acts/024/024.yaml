  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: sw
  text: Baada ya siku kadhaa, Feliksi alikuja pamoja na Drusila, mke wake mwenyewe, ambaye alikuwa Myahudi, akatuma Paulo aitwe, kisha akamsikiliza kuhusu imani katika Masihi Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtumaini Masihi Yesu.” Neno la Kigiriki πίστις pia linaweza kumaanisha “tumaini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Baada ya siku kadhaa
  rationale: Ni usemi wa wakati unaomaanisha kwamba siku fulani zilipita; δέ haihitaji kiunganishi kizito katika Kiswahili hapa.
- source_word: παραγενόμενος
  choice: alikuja
  rationale: Kitenzi hiki kinaonyesha kufika au kuja kwa Feliksi, na 'alikuja' ni cha kawaida katika simulizi.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: pamoja na Drusila, mke wake mwenyewe
  rationale: σύν huonyesha kuandamana, na ἰδίᾳ ina msisitizo wa umilikaji unaohifadhiwa kwa 'mwenyewe'.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: ambaye alikuwa Myahudi
  rationale: Kirai hiki kinamtambulisha Drusila kuwa wa Kiyahudi; 'Myahudi' ni neno la kawaida la Kiswahili linaloweza kumrejelea mwanamke kwa muktadha.
- source_word: μετεπέμψατο τὸν Παῦλον
  choice: Akatuma Paulo aitwe
  rationale: μεταπέμπομαι humaanisha kutuma watu wakamwite mtu; muundo huu ni wa asili kuliko tafsiri sisisi.
- source_word: ἤκουσεν αὐτοῦ
  choice: akamsikiliza akizungumza
  rationale: Genitivi pamoja na ἀκούω hapa inaweza kumaanisha kumsikiliza mtu; nyongeza ya 'akizungumza' huleta maana hiyo kwa Kiswahili cha kawaida bila kuongeza mada mpya.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: kuhusu imani katika Masihi Yesu
  rationale: περί hutaja mada, na πίστις pamoja na εἰς humaanisha imani inayoelekezwa kwa Yesu. 'Masihi' huhifadhi Χριστός kama cheo.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu; Yesu Masihi
  rationale: Χριστός ina nguvu ya cheo katika kirai hiki. 'Masihi Yesu' huhifadhi cheo na mpangilio wa Kigiriki, huku 'Kristo Yesu' ikiwa tafsiri mbadala iliyozoeleka.
- issue: Maana ya πίστις εἰς Χριστὸν Ἰησοῦν
  choice: imani katika Masihi Yesu
  alternative: kumtumaini Masihi Yesu
  rationale: Muundo wa πίστις pamoja na εἰς kwa kawaida huonyesha imani au tumaini linaloelekezwa kwa mtu. 'Imani' ndiyo tafsiri kuu, lakini 'kumtumaini' huonyesha kwa uwazi zaidi hali ya kumtegemea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Jina Φῆλιξ limeandikwa 'Feliksi' na Δρουσίλλη 'Drusila' kwa mwandiko unaoeleweka kwa wasomaji wa Kiswahili.
