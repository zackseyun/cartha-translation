  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: sw
  text: Baada ya miaka kadhaa, nilikuja kuleta misaada kwa wahitaji wa taifa langu na matoleo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Baada ya miaka kadhaa
  rationale: διά pamoja na hali ya umilikaji huonyesha kipindi kilichopita, na πλειόνων hapa kwa matumizi ya kawaida humaanisha miaka kadhaa au mingi. δέ ni kiunganishi chepesi ambacho hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: ἐλεημοσύνας
  choice: misaada kwa wahitaji
  rationale: Neno hili humaanisha zawadi au msaada wa huruma unaotolewa kwa maskini na wahitaji. Usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa kuliko istilahi inayoweza kuchanganywa na matoleo ya ibada.
- source_word: ποιήσων
  choice: kuleta
  rationale: Ingawa ποιέω kwa msingi ni ‘kufanya,’ pamoja na ἐλεημοσύνας hapa huunda wazo la kutoa au kupeleka misaada. ‘Kuleta’ pia linaendana na mwendo unaoonyeshwa na παρεγενόμην.
- source_word: εἰς τὸ ἔθνος μου
  choice: kwa wahitaji wa taifa langu
  rationale: ἔθνος hapa ni taifa la Wayahudi ambalo Paulo analiita lake. Muundo huu unaonyesha kuwa misaada ilikusudiwa kwa wahitaji walio miongoni mwa taifa lake.
- source_word: παρεγενόμην
  choice: nilikuja
  rationale: παραγίνομαι hapa humaanisha kufika au kuja mahali; ‘nilikuja’ ni fupi na ya kawaida.
- source_word: προσφοράς
  choice: matoleo
  rationale: προσφοράς humaanisha vitu vinavyotolewa, mara nyingi katika mazingira ya ibada. ‘Matoleo’ huhifadhi upana huo bila kubainisha aina ambayo Kigiriki hakuitaji.
theological_decisions:
- issue: Aina ya misaada ambayo Paulo alileta Yerusalemu
  choice: misaada kwa wahitaji
  alternative: sadaka; zawadi za hisani
  rationale: Uamuzi huu ni wa kimsamiati, si wa kimadhehebu. Unabainisha maana ya ἐλεημοσύνας kuwa msaada kwa maskini au wahitaji, huku ukitofautisha misaada hiyo na προσφοράς, yaani ‘matoleo.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa wasomaji wa kawaida bila kuongeza kiunganishi kizito kwa δέ wala kufafanua aina ya matoleo.
