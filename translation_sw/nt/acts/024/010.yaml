base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: sw
  text: 'Kisha Paulo akajibu, baada ya mtawala kumpa ishara kwa kichwa ili aseme: “Kwa kuwa najua kwamba umekuwa mwamuzi wa taifa hili kwa miaka mingi, ninajitetea kwa moyo mkuu kuhusu mambo yanayonihusu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninajitetea kwa ujasiri.” Kielezi hicho kinaweza kuonyesha utayari, ujasiri, au moyo mchangamfu, si furaha ya kihisia tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: Kisha Paulo akajibu
  rationale: Kitenzi kina maana ya kujibu, na τε inaunganisha simulizi kwa upole; ‘Kisha’ ni mwendelezo wa kawaida wa simulizi la Kiswahili.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: baada ya mtawala kumpa ishara kwa kichwa ili aseme
  rationale: Muundo wa genitivi huru umegeuzwa kuwa kishazi cha wakati. ‘Kumpa ishara kwa kichwa’ huhifadhi kitendo halisi kinachoweza kumaanisha kutikisa au kuashiria kwa kichwa.
- source_word: ἡγεμόνος
  choice: mtawala
  rationale: Katika muktadha huu ni mwenye mamlaka ya Kirumi wa jimbo; ‘mtawala’ ni neno la kawaida na lenye hadhi katika Kiswahili, bila kubainisha cheo kwa usahihi usiothibitishwa na neno lenyewe.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: kwa miaka mingi
  rationale: Usemi huu wa wakati unaonyesha muda ulioanzia zamani na kuendelea; ‘kwa miaka mingi’ ni wa asili katika Kiswahili.
- source_word: ὄντα σε κριτὴν
  choice: umekuwa mwamuzi
  rationale: Muundo wa kishirikishi pamoja na usemi wa muda unaonyesha jukumu lililodumu; wakati timilifu wa Kiswahili huwasilisha vizuri maana hiyo.
- source_word: κριτὴν
  choice: mwamuzi
  rationale: Neno la Kigiriki humaanisha mtu anayehukumu kesi. ‘Mwamuzi’ linafaa katika mazingira ya kisheria na halichanganyi nafasi hii na cheo cha hakimu wa mfumo wa kisasa pekee.
- source_word: τῷ ἔθνει τούτῳ
  choice: wa taifa hili
  rationale: ἔθνος inaweza kuwa taifa au watu; hapa inarejelea taifa la Wayahudi chini ya mamlaka ya mtawala. ‘Wa taifa hili’ inaendana kwa kawaida na ‘mwamuzi’ katika Kiswahili.
- source_word: ἐπιστάμενος
  choice: Kwa kuwa najua
  rationale: Kishirikishi kinaonyesha msingi wa utayari wa Paulo kujitetea; kishazi hiki kinaweka uhusiano huo wazi kwa Kiswahili cha asili.
- source_word: εὐθύμως
  choice: kwa moyo mkuu
  rationale: Kielezi hiki kinaweza kueleza utayari, ujasiri, au moyo mchangamfu. ‘Kwa moyo mkuu’ huhifadhi wazo la utayari wenye ujasiri bila kulifungia katika furaha ya kihisia pekee.
- source_word: τὰ περὶ ἐμαυτοῦ
  choice: kuhusu mambo yanayonihusu
  rationale: Usemi unarejelea masuala yanayomhusu Paulo mwenyewe; tafsiri hii ni wazi na inafaa katika mazingira ya mashtaka.
- source_word: ἀπολογοῦμαι
  choice: ninajitetea
  rationale: Kitenzi ni cha kimahakama na humaanisha kutoa utetezi dhidi ya mashtaka; ‘ninajitetea’ ni cha kawaida, wazi, na bado huhifadhi mazingira ya kisheria.
