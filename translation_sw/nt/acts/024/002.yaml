base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: sw
  text: Paulo alipoitwa, Tertulo alianza kumshtaki, akisema, “Kwa kuwa kupitia kwako tunafurahia amani nyingi, na kwa uangalizi wako[b] hatua za marekebisho[a] zinafanywa kwa ajili ya taifa hili,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maboresho” au “hatua za kusahihisha.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa busara yako ya kuona mbele.” Neno la Kigiriki hapa linahusu kutazamia mambo au usimamizi wa mtawala, si lazima majaliwa ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Baada ya Paulo kuitwa
  rationale: Kirai huru cha umilikishi kinaweka mazingira ya tendo kuu. Kutaja Paulo huondoa utata wa kiwakilishi katika Kiswahili bila kubadili mrejelewa wa muktadha; “kuitwa” linafaa kwa kuitwa mbele ya gavana.
- source_word: ἤρξατο κατηγορεῖν
  choice: alianza kumshtaki
  rationale: Huhifadhi muundo wa kuanza tendo na maana ya kisheria ya κατηγορέω.
- source_word: ὁ Τέρτυλλος
  choice: Tertulo
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi kinaanzisha maneno ya hotuba na kinaunganishwa kwa kawaida na tendo lililotangulia.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: Kwa kuwa ... tunafurahia amani nyingi
  rationale: “Tunafurahia” huwasilisha hali ya kupata au kuwa na amani, huku “Kwa kuwa” ikitambulisha msingi wa sifa za kujipendekeza.
- source_word: διὰ σοῦ
  choice: kupitia kwako
  rationale: Huhifadhi wazo la njia au uwakala lililo katika διά pamoja na umilikishi.
- source_word: διορθωμάτων
  choice: hatua za marekebisho
  rationale: Neno hilo linaweza kumaanisha marekebisho, maboresho, au hatua za kusahihisha. “Hatua za marekebisho” linafaa kwa mazingira ya utawala na huhifadhi wazo la hatua mahususi za kurekebisha.
- source_word: γινομένων τῷ ἔθνει τούτῳ
  choice: zinafanywa kwa ajili ya taifa hili
  rationale: Huwasilisha marekebisho yanayotokea au kufanywa kwa manufaa ya taifa; “kwa ajili ya” ni Kiswahili cha kawaida kwa dativu hii.
- source_word: διὰ τῆς σῆς προνοίας
  choice: kwa uangalizi wako
  rationale: Katika muktadha huu πρόνοια ni kuona mbele na usimamizi wa mtawala, si lazima majaliwa ya Mungu. “Uangalizi” ni la kawaida na linabeba wazo la usimamizi wenye kutazamia mahitaji.
theological_decisions:
- issue: Maana ya πρόνοια katika sifa anazopewa mtawala wa kibinadamu
  choice: uangalizi wako
  alternative: busara yako ya kuona mbele; majaliwa yako
  rationale: “Uangalizi” huepuka kuingiza maana ya kitheolojia ya majaliwa ya Mungu, huku ukihifadhi sifa ya usimamizi na kuona mambo kabla inayolengwa na msemaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imeachwa wazi mwishoni kwa sababu hotuba inaendelea katika mstari unaofuata.
