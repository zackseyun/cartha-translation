  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: sw
  text: Wala hawawezi kuthibitisha mbele yako mambo ambayo sasa wananishtaki kuhusu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘kuwasilisha mbele yako’ au ‘kudhihirisha mbele yako’; kitenzi cha Kigiriki kinaweza kumaanisha kuwasilisha au kuthibitisha jambo, hapa kwa maana ya kuonyesha kwamba shtaka la kisheria lina msingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Wala
  rationale: Inaendeleza kwa njia ya kukanusha hoja ya Paulo kutoka mstari uliotangulia, na ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: παραστῆσαι
  choice: kuthibitisha
  rationale: Katika mazingira haya ya kisheria, kitenzi kina maana ya kuwasilisha au kuweka jambo wazi kwa namna inayothibitisha shtaka; ‘kuthibitisha’ huwasilisha nguvu hiyo kwa uwazi.
- source_word: δύνανταί
  choice: hawawezi
  rationale: Huwakilisha moja kwa moja uwezo uliokanushwa na οὐδὲ.
- source_word: σοι
  choice: mbele yako
  rationale: Ingawa dative inaweza kutafsiriwa ‘kwako,’ ‘mbele yako’ ni Kiswahili cha asili katika mazingira ya kusikilizwa kwa kesi na hakibadili mhusika anayelengwa, yaani Feliksi.
- source_word: περὶ ὧν
  choice: mambo ambayo
  rationale: Hurejelea mambo yanayohusika katika mashtaka bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: νυνὶ
  choice: sasa
  rationale: Huhifadhi wazi rejeo la wakati wa sasa.
- source_word: κατηγοροῦσίν μου
  choice: wananishtaki
  rationale: Kitenzi hiki kina maana ya kumshitaki au kumshtumu katika mazingira ya kisheria; ‘wananishtaki’ ni cha asili na huhifadhi hali endelevu ya wakati wa sasa.
