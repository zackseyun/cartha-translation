  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: sw
  text: kama unavyoweza kuthibitisha kwamba hazijapita zaidi ya siku kumi na mbili tangu nilipopanda kwenda Yerusalemu kuabudu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: kama unavyoweza kuhakikisha
  rationale: Muundo huu unaonyesha uwezo wa Feliksi kuchunguza na kuthibitisha ukweli wa ratiba hiyo. “Kuhakikisha” inafaa katika mazingira ya kisheria bila kuufanya muundo huo ueleze sababu kwa nguvu kupita kiasi.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: hazijapita zaidi ya siku kumi na mbili
  rationale: Hii inaeleza kwa Kiswahili cha kawaida muda uliopita, huku ikihifadhi kikomo cha siku kumi na mbili kilicho katika Kigiriki.
- source_word: ἀφ’ ἧς
  choice: tangu nilipo-
  rationale: Inaonyesha mwanzo wa kipindi kinachohesabiwa, na kuunganishwa na kitenzi ni muundo wa asili katika Kiswahili.
- source_word: ἀνέβην
  choice: nilipopanda kwenda
  rationale: Inahifadhi usemi wa kupanda kwenda Yerusalemu badala ya kuufanya kuwa “nilikwenda” tu.
- source_word: προσκυνήσων
  choice: kuabudu
  rationale: Kivumishi-endelevu cha wakati ujao kinaonyesha kusudi. Yule anayeabudiwa habainishwi wazi katika mstari huu, kwa hiyo hakuna kitu kilichoongezwa.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Jina la mahali baada ya “kwenda” huonyesha kwa kawaida mahali alikokusudia kufika bila kuhitaji kihusishi kingine.
