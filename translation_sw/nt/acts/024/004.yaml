lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Lakini, ili nisi-
  rationale: “Lakini” huleta mpito wenye utofauti mdogo, na “ili nisi-” huhifadhi maana ya kusudi iliyo katika ἵνα μή kwa Kiswahili cha kawaida.
- source_word: ἐπὶ πλεῖόν
  choice: zaidi
  rationale: Kirai hiki kina maana ya kuendelea zaidi au kwa muda mrefu zaidi; “zaidi” ni kifupi na cha kawaida katika muktadha huu.
- source_word: σε ἐγκόπτω
  choice: nisikupotezee muda
  rationale: Kitenzi kinaweza kumaanisha kuzuia, kukwamisha, au kuchelewesha. Katika hotuba kwa mtawala, msemaji anaahidi kutotumia muda wake zaidi; “kukupotezea muda” huwasilisha maana hiyo kwa Kiswahili cha sasa bila kudokeza kwamba mtawala amezuiliwa kimwili.
- source_word: παρακαλῶ
  choice: nakuomba
  rationale: Hili ni ombi la heshima katika mazingira rasmi. “Nakuomba” huhifadhi sauti ya kusihi bila kuwa nzito au ya kizamani.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: utusikilize
  rationale: Muundo huu unamaanisha kuwasikia au kuwasikiliza wasemaji. “Utusikilize” ni wa kawaida na unafaa katika mazingira ya kusikilizwa kwa kesi.
- source_word: συντόμως
  choice: kwa ufupi
  rationale: Kielezi hiki hueleza ufupi wa maelezo au wa muda; “kwa ufupi” ni usemi wa kawaida wa Kiswahili.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: kwa fadhili zako
  rationale: ἐπιείκεια inaweza kueleza upole, usawa, uvumilivu, au huruma katika hukumu. “Kwa fadhili zako” hudumisha ombi la heshima na upendeleo mwema bila kuifungia maana katika sifa moja tu.
