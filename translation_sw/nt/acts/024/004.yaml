  text: Lakini, ili nisikucheleweshe zaidi[a], nakuomba utusikilize kwa ufupi kwa fadhili zako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nisikuzuie zaidi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa upole wako” au “kwa rehema yako.” Neno la Kigiriki linaweza kumaanisha usawa, upole, au unyumbufu wa hukumu.
