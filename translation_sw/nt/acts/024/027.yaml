  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: sw
  text: Lakini baada ya miaka miwili kutimia, Porkio Festo akamrithi Feliksi. Naye Feliksi, akitaka kuwatendea Wayahudi fadhili[a], alimwacha Paulo akiwa amefungwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili ajipatie kibali cha Wayahudi.” Nahau ya Kigiriki inaweza kumaanisha ama kuwatendea fadhili ama kujipatia ridhaa yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: Lakini baada ya miaka miwili kutimia
  rationale: Kirai huru cha hali ya wakati (genitive absolute) kinaonyesha kuwa kipindi cha miaka miwili kilikuwa kimetimia; tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo la utimilifu wa kipindi.
- source_word: ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον
  choice: Porkio Festo akawa mrithi wa Feliksi katika uongozi
  rationale: Ingawa muundo wa Kigiriki unasema kihalisi kwamba Feliksi 'alipata mrithi,' Kiswahili cha kawaida hutaja wazi kuwa Festo akawa mrithi wake. 'Katika uongozi' hufafanua kwamba kinachozungumziwa ni nafasi ya utawala bila kuongeza cheo kisichotajwa hapa.
- source_word: θέλων
  choice: akitaka
  rationale: Kitenzi-shirikishi kinaonyesha nia au sababu iliyomsukuma Feliksi kumwacha Paulo amefungwa.
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: kuwatendea Wayahudi jambo la kuwapendeza
  rationale: Nahau hii inaweza kueleweka kuwa kuwatendea Wayahudi fadhili au kutafuta ridhaa yao. Chaguo hili ni la asili kwa Kiswahili na hudumisha kwa kiasi fulani utata huo; uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: κατέλιπε
  choice: alimwacha
  rationale: Kitenzi kinaeleza kwamba Feliksi aliondoka madarakani huku hali ya Paulo ikiendelea kama ilivyokuwa.
- source_word: τὸν Παῦλον δεδεμένον
  choice: Paulo akiwa amefungwa
  rationale: Muundo huu unaonyesha hali ya Paulo iliyoendelea. 'Amefungwa' ni karibu na maana ya δεδεμένον kuliko tafsiri pana zaidi ya 'amefungwa gerezani' na haibainishi minyororo bila ulazima.
