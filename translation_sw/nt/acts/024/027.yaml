translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa matumizi ya kawaida ya Kiswahili: Porkio Festo, Feliksi, Paulo. Alama ya tanbihi [a] imewekwa mara moja katika maandishi.'
