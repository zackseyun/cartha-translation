base_translation:
  language: en
  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: sw
  text: nami nina tumaini katika Mungu—tumaini ambalo watu hawa wenyewe pia wanalingojea[a]—kwamba kutakuwa na ufufuo wa wenye haki na wasio na haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambalo watu hawa wenyewe pia wanalikubali.” Kitenzi cha Kigiriki kinaweza kumaanisha “kukubali” au “kungojea/kutazamia”; hapa huenda kinasisitiza tumaini wanaloshiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων
  choice: nami nina tumaini
  rationale: Huhifadhi nomino ‘tumaini’ pamoja na wazo la kishirikishi, huku ikiunganisha sentensi hii kwa kawaida na muktadha unaotangulia.
- source_word: εἰς τὸν θεόν
  choice: kwa Mungu
  rationale: Katika Kiswahili, ‘tumaini kwa Mungu’ huonyesha Mungu kuwa mlengwa wa tumaini bila tafsiri ya neno kwa neno isiyo ya kawaida.
- source_word: ἣν καὶ αὐτοὶ οὗτοι
  choice: tumaini ambalo watu hawa wenyewe pia
  rationale: Kurudia ‘tumaini’ hufanya kirejeshi kiwe wazi; ‘watu hawa wenyewe pia’ huhifadhi msisitizo wa αὐτοὶ na οὗτοι katika mazingira ya kesi.
- source_word: προσδέχονται
  choice: wanalingojea
  rationale: Kitenzi hiki kinaweza kumaanisha kungojea au kutazamia kwa matarajio. Chaguo hili ni la asili katika Kiswahili na huhifadhi maana ya matarajio ya pamoja; maana ya ‘kukubali’ imewekwa katika tanbihi.
- source_word: ἀνάστασιν
  choice: ufufuo
  rationale: Ni istilahi ya kawaida na sahihi ya Kiswahili kwa kuinuka kwa wafu katika muktadha huu.
- source_word: μέλλειν ἔσεσθαι
  choice: kutakuwa na
  rationale: Huonyesha tukio la baadaye bila kudokeza kimakosa kwamba lazima litokee mara moja.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: wa wenye haki na wasio na haki
  rationale: Huhifadhi makundi yote mawili na utofautishaji wao wa kimaadili kwa lugha ya sasa na inayoeleweka.
theological_decisions:
- issue: Asili na upeo wa ufufuo katika dai la Paulo
  choice: ufufuo wa wenye haki na wasio na haki
  alternative: ufufuo wa jumla bila kusisitiza tofauti ya kimaadili
  rationale: Kigiriki kinataja wazi makundi yote mawili. Tafsiri haiamui ratiba, mpangilio wa hukumu, wala mfumo mwingine wa kiteolojia ambao mstari wenyewe hauuelezi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mistari mirefu imetenganishwa kwa vistari virefu ili kudumisha wazi uhusiano wa kishazi bila kuwa nzito.
