  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: sw
  text: Kwa maana tumemwona mtu huyu kuwa ni tauni, anayechochea ghasia miongoni mwa Wayahudi wote katika ulimwengu unaokaliwa na watu, na pia ni kiongozi mkuu wa dhehebu la Wanazorayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: tauni
  rationale: Sitiari kali ya shtaka hilo inamhusisha Paulo na janga lenye madhara; “tauni” huihifadhi bila kuipunguza kuwa ‘msumbufu’ tu.
- source_word: κινοῦντα στάσεις
  choice: anayechochea maasi
  rationale: στάσεις inaweza kumaanisha ghasia, machafuko, au uasi wa kisiasa; “maasi” huhifadhi uzito wa shtaka mbele ya mtawala bila kudai kwamba ghasia za wazi zilitokea kila mahali.
- source_word: οἰκουμένην
  choice: ulimwengu unaokaliwa
  rationale: Tafsiri ya karibu inayodumisha upeo wa usemi wa Kigiriki, ambao katika muktadha unaweza kuelekeza ulimwengu wa Dola ya Roma.
- source_word: πρωτοστάτην
  choice: kiongozi mkuu
  rationale: Neno humaanisha mtu aliye mstari wa mbele au kiongozi mashuhuri; “kiongozi mkuu” ni la kawaida na huonyesha nafasi inayodaiwa.
- source_word: αἱρέσεως
  choice: dhehebu
  rationale: Katika shtaka hili humaanisha kundi au mkondo wa kidini; “dhehebu” ni neno la kawaida la Kiswahili na halilazimishi maana ya baadaye ya ‘uzushi’.
- source_word: Ναζωραίων
  choice: Wanazareti
  rationale: Hifadhi jina la kundi walilopewa wafuasi wa Yesu wa Nazareti katika shtaka hili.
theological_decisions:
- issue: Hadhi ya ‘dhehebu la Wanazareti’
  choice: Kuhifadhi kama lugha ya mshitaki bila kuiita imani potovu
  alternative: ‘uzushi wa Wanazareti’
  rationale: αἵρεσις hapa ni jina la kundi katika hotuba ya mashtaka; kutafsiri ‘uzushi’ kungeingiza hukumu ya kiteolojia isiyolazimishwa na muktadha.
- issue: Uzito wa shtaka la κινοῦντα στάσεις
  choice: anayechochea maasi
  alternative: anayezusha ghasia
  rationale: Kigiriki kinaweza kuelekea maasi, mifarakano, au machafuko. Chaguo hili hudumisha ukali na pia kutokamilika kwa upeo wa neno.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya lugha ya mahakamani. Muundo unaendeleza sauti ya shtaka na orodha ya tuhuma; hakuna tanbihi zinazohitajika.
