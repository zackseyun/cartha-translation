lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Hutanguliza changamoto nyingine katika utetezi wa Paulo kwa kiunganishi cha kawaida na cha moja kwa moja.
- source_word: αὐτοὶ οὗτοι
  choice: watu hawa wenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi na rejeo la moja kwa moja kwa waliokuwapo.
- source_word: εἰπάτωσαν
  choice: waseme
  rationale: Huwasilisha amri ya nafsi ya tatu kwa Kiswahili cha kawaida katika muktadha wa kisheria.
- source_word: τί εὗρον
  choice: ni ... gani walilopata
  rationale: Huuliza kosa hususa ambalo wadai wanadai kuligundua, huku ikihifadhi maana ya kitenzi εὗρον.
- source_word: ἀδίκημα
  choice: kosa
  rationale: Ni neno pana linaloweza kumaanisha tendo lisilo la haki au kosa la kisheria bila kulifanya lazima kuwa uhalifu mahsusi.
- source_word: στάντος μου
  choice: niliposimama
  rationale: Huwakilisha kwa ufupi uhusiano wa wakati wa kirai kishirikishi cha Kigiriki.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: mbele ya Baraza
  rationale: Huonyesha kwamba Paulo alifika mbele ya baraza la Wayahudi; umbo la kawaida linawekwa katika matini na jina mahususi linaelezwa katika tanbihi.
