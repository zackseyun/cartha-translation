id: ACT.24.16
reference: Acts 24:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: sw
  text: Kwa sababu hiyo, mimi mwenyewe pia hujitahidi sikuzote kuwa na dhamiri isiyo na lawama mbele za Mungu na wanadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinarejelea tumaini lililotajwa katika muktadha uliotangulia na kinaonyesha msingi wa jitihada za Paulo.
- source_word: καὶ αὐτὸς
  choice: mimi mwenyewe pia
  rationale: Neno “pia” linahifadhi maana ya nyongeza ya καί, na “mimi mwenyewe” linahifadhi msisitizo wa αὐτός.
- source_word: ἀσκῶ
  choice: hujitahidi
  rationale: Kitenzi hiki kinaonyesha juhudi endelevu au kujizoeza kwa makusudi; “hujitahidi” ni cha asili na wazi katika muktadha wa maadili.
- source_word: ἀπρόσκοπον
  choice: isiyo na lawama
  rationale: Katika uhusiano wake na dhamiri, neno hili linaonyesha kutokuwa na jambo la kulaumiwa au la kukwaza mbele za Mungu na wanadamu.
- source_word: συνείδησιν
  choice: dhamiri
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa utambuzi wa ndani kuhusu mema na mabaya.
- source_word: ἔχειν
  choice: kuwa na
  rationale: Linatoa kwa uwazi lengo la jitihada za Paulo na kuhifadhi maana ya moja kwa moja ya kitenzi.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: mbele za Mungu na wanadamu
  rationale: “Mbele za” linaonyesha uhusiano na uwajibikaji, huku “wanadamu” likiwakilisha watu wote bila kuzuia jinsia yoyote.
- source_word: διὰ παντός
  choice: sikuzote
  rationale: Kirai hiki kinaonyesha hali endelevu; “sikuzote” ni tafsiri fupi na ya kawaida.
theological_decisions:
- issue: Maana jumuishi ya ἀνθρώπους
  choice: wanadamu
  alternative: watu
  rationale: Ingawa umbo la Kigiriki ni la wingi, neno hilo hapa linawahusu wanadamu kwa ujumla. “Wanadamu” huhifadhi dhana hiyo kwa usahihi na kwa lugha ya heshima bila kuifanya ihusu wanaume pekee.
- issue: Aina ya dhamiri inayokusudiwa na ἀπρόσκοπον
  choice: dhamiri isiyo na lawama
  alternative: dhamiri safi
  rationale: “Isiyo na lawama” huhifadhi wazo la kutokuwa na jambo la kulaumiwa mbele za Mungu na wanadamu. “Safi” ni ya asili lakini inaweza kupunguza maana ya uhusiano na uwajibikaji iliyopo katika kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umehifadhi msisitizo wa “mimi mwenyewe pia” bila kufanya sentensi iwe nzito.
