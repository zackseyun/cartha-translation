  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: sw
  text: Lakini alipokuwa akizungumza kuhusu uadilifu, kujizuia, na hukumu inayokuja, Feliksi akaingiwa na hofu, akajibu, “Kwa sasa, nenda zako. Nikipata nafasi, nitakuita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: alipokuwa akizungumza
  rationale: Kitenzi hiki kinaweza kumaanisha kujadiliana au kuzungumza kwa hoja. Katika muktadha huu, ‘akizungumza’ ni ya kawaida na inadokeza maelezo yenye hoja bila kulazimisha kwamba pande zote zilikuwa zikibishana.
- source_word: δικαιοσύνης
  choice: uadilifu
  rationale: Neno hili lina wigo wa haki na mwenendo ulio sawa. ‘Uadilifu’ linaeleweka kwa urahisi hapa kama sifa na mwenendo wa kutenda yaliyo haki.
- source_word: ἐγκρατείας
  choice: kujizuia
  rationale: Hueleza uwezo wa kutawala tamaa na matendo ya mtu; ‘kujizuia’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: hukumu inayokuja
  rationale: Huhifadhi muundo na maana ya hukumu ya wakati ujao bila kuongeza maelezo kuhusu wakati au namna yake.
- source_word: ἔμφοβος γενόμενος
  choice: akaingiwa na hofu
  rationale: Huwasilisha mabadiliko ya hali ya Feliksi—alianza kuwa na hofu—kwa Kiswahili cha asili.
- source_word: Τὸ νῦν ἔχον
  choice: Kwa sasa
  rationale: Nahau hii inamaanisha ‘kwa hali ya sasa’ au ‘kwa wakati huu’; ‘Kwa sasa’ ni fupi na ya kawaida.
- source_word: καιρὸν μεταλαβών
  choice: Nikipata nafasi
  rationale: Hapa καιρός ni fursa au wakati unaofaa. ‘Nikipata nafasi’ hudumisha wazo la fursa bila kudai kwamba Feliksi alikusudia kwa dhati kuitumia.
- source_word: μετακαλέσομαί σε
  choice: nitakuita
  rationale: Kitenzi humaanisha kumwita mtu aje tena; muktadha tayari unaonyesha kuitwa mbele yake, hivyo ‘nitakuita’ ni ya asili na sahihi.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika orodha ya mafundisho ya Paulo
  choice: uadilifu
  alternative: haki
  rationale: ‘Uadilifu’ husisitiza mwenendo wa haki unaolingana na ‘kujizuia,’ huku bado ikiacha wazi uhusiano wake na haki mbele za Mungu; tafsiri haijaongeza fundisho maalumu la kimadhehebu.
- issue: Asili ya hukumu ijayo
  choice: hukumu inayokuja
  alternative: hukumu ya mwisho
  rationale: Matini ya Kigiriki haisemi wazi ‘ya mwisho.’ Tafsiri iliyochaguliwa huhifadhi kauli yake bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imedumisha mfuatano wa hoja tatu na mwitikio wa Feliksi. Jina ‘Paulo’ limetumiwa badala ya kiwakilishi kisicho na rejea ndani ya mstari huu ili mstari ujitegemee kwa urahisi, kwa kuwa muktadha wa karibu unamtambulisha wazi.
