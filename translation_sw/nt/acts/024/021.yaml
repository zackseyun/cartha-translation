  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: sw
  text: 'au kuhusu kauli hii moja[a] niliyoitamka kwa sauti kubwa nikiwa nimesimama katikati yao: ‘Ni kuhusu ufufuo wa wafu[b] kwamba ninahukumiwa mbele yenu leo.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sauti” au “kilio” badala ya “kauli”; neno la Kigiriki linaweza kumaanisha kauli iliyotamkwa au sauti/kilio kilichotumiwa kuitoa.
    reason: lexical_alternative
  - marker: b
    text: Au “ufufuo kutoka kwa wafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: tamko
  rationale: Katika muundo huu, neno hilo linaelekea kumaanisha maneno yaliyotamkwa, ingawa linaweza pia kumaanisha sauti au kilio; ‘tamko’ ni la kawaida na lenye heshima katika muktadha wa kujitetea mbele ya mahakama.
- source_word: ἐκέκραξα
  choice: nililopaza sauti
  rationale: Kitenzi kinaonyesha kusema kwa sauti kubwa hadharani; ‘kupaza sauti’ huhifadhi nguvu hiyo kwa Kiswahili cha asili.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: nikiwa nimesimama kati yao
  rationale: Huhifadhi hali ya wakati mmoja ya kishiriki na maana ya mahali ya kuwa katikati yao.
- source_word: ἀναστάσεως νεκρῶν
  choice: ufufuo wa wafu
  rationale: Huu ndio uwasilishaji wa moja kwa moja wa muundo wa Kigiriki na ni msemo unaoeleweka kwa Kiswahili, bila kuufanya kuwa ufufuo wa Yesu pekee.
- source_word: κρίνομαι
  choice: ninahukumiwa
  rationale: Huhifadhi hali ya sasa na kauli ya kutendwa ya Kigiriki katika mazingira ya kisheria.
- source_word: ἐφ’ ὑμῶν
  choice: mbele yenu
  rationale: Katika muktadha wa kisheria, kifungu hiki kinaonyesha kufikishwa mbele ya wenye mamlaka bila kudai kwamba wao pekee ndio watendaji wa hukumu.
- source_word: ἢ
  choice: au
  rationale: Huunganisha mstari huu na utetezi uliotangulia bila kuongeza ufafanuzi usio wazi katika Kigiriki.
- source_word: μιᾶς ταύτης
  choice: hili moja
  rationale: Huhifadhi msisitizo wa upekee na umaalumu wa tamko moja.
- source_word: σήμερον
  choice: leo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kielezi cha wakati.
theological_decisions:
- issue: Asili ya shtaka linalobishaniwa
  choice: ufufuo wa wafu kwa maana pana
  alternative: ufufuo wa Yesu hasa
  rationale: Kigiriki kinasema kwa ujumla περὶ ἀναστάσεως νεκρῶν; tafsiri haipaswi kuingiza dai mahususi zaidi la kikristolojia ambalo halijaelezwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na hoja ya kisheria ya Paulo huku ukitumia misemo ya kawaida kama ‘kupaza sauti’ na ‘mbele yenu.’
