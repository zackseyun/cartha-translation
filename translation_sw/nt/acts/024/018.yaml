base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: sw
  text: Katika hayo[a], walinikuta nikiwa nimetakaswa[b] hekaluni, bila umati wala ghasia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakati wa mambo hayo.” Kigiriki kinaweza kutafsiriwa kwa namna ya moja kwa moja zaidi kuwa “katika hayo.”
    reason: lexical_alternative
  - marker: b
    text: “Nimetakaswa” hapa humaanisha kutakaswa kwa kufuata desturi za kidini.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: Katika hayo
  rationale: Huhifadhi rejeo la kishazi cha uhusiano cha Kigiriki kwa mambo au matukio yaliyotangulia, bila kulifafanua kupita kiasi.
- source_word: εὗρόν με
  choice: walinikuta
  rationale: Ni usemi wa kawaida na wa asili kwa maana ya kukutana na Paulo akiwa katika hali iliyoelezwa.
- source_word: ἡγνισμένον
  choice: nikiwa nimetakaswa
  rationale: Huwakilisha hali iliyotokana na tendo lililokamilika na huhifadhi kauli tendwa ya kitenzi cha Kigiriki pamoja na maana yake ya utakaso wa kidini.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Ni tafsiri ya kawaida ya eneo la hekalu; neno la Kigiriki linaweza kumaanisha majengo na viwanja vya hekalu kwa ujumla, si patakatifu pa ndani pekee.
- source_word: οὐ μετὰ ὄχλου
  choice: bila umati
  rationale: Hutoa kwa ufupi na kwa kawaida dai kwamba Paulo hakuwa ameandamana na mkusanyiko wa watu; huepuka neno lenye nguvu zaidi kama 'genge'.
- source_word: οὐδὲ μετὰ θορύβου
  choice: wala ghasia
  rationale: Katika muktadha wa utetezi wa kisheria, 'ghasia' huwasilisha vizuri wazo la vurugu au fujo za hadharani.
