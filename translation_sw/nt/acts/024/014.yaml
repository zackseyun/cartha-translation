  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: sw
  text: Lakini ninakiri jambo hili kwako, kwamba kwa kufuata ile Njia, ambayo wao huiita dhehebu[a], ndivyo ninavyomwabudu Mungu wa mababu zetu[b], huku nikiamini kila kitu kilichoandikwa katika Sheria na katika Manabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kundi” au “mrengo.” Neno la Kigiriki linaweza kumaanisha kundi, mrengo, au dhehebu; hapa kulitafsiri kuwa “uzushi” kungeleta maana ya baadaye isiyokusudiwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, kivumishi kimoja kina maana ya “wa mababu” au “wa urithi wa mababu”; maana yake ni Mungu aliyeabudiwa na mababu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: ninakiri
  rationale: Katika utetezi wa Paulo mbele ya Feliksi, kitenzi hiki kinaonyesha kukiri au kutambua jambo waziwazi bila kumaanisha kwamba anakubali hatia.
- source_word: κατὰ τὴν ὁδόν
  choice: kwa kufuata ile Njia
  rationale: Hutoa Kiswahili cha kawaida kinachoonyesha kuishi au kuabudu kwa kufuata ‘Njia,’ jina la kihistoria la harakati ya wafuasi wa Yesu katika Matendo.
- source_word: αἵρεσιν
  choice: dhehebu
  rationale: Hapa neno linamaanisha kundi au dhehebu linalotambuliwa ndani ya mazingira ya kidini; ‘uzushi’ lingeingiza maana ya baadaye ya kosa la kimafundisho.
- source_word: οὕτως λατρεύω
  choice: hivyo ndivyo ninavyomwabudu
  rationale: Muundo huu unaunganisha wazi namna Paulo anavyomwabudu Mungu na ‘Njia’ iliyotajwa kabla yake.
- source_word: τῷ πατρῴῳ θεῷ
  choice: Mungu wa mababu zetu
  rationale: Hufikisha maana ya Mungu wa urithi wa mababu wa Israeli na dai la Paulo la kuendelea katika imani yao, ingawa kiwakilishi ‘zetu’ hakijaandikwa moja kwa moja katika Kigiriki.
- source_word: πιστεύων
  choice: huku nikiamini
  rationale: 'Hudumisha uhusiano wa kishiriki: imani ya Paulo katika Maandiko inaambatana na kumwabudu kwake Mungu.'
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: kila kitu kilichoandikwa
  rationale: Hufikisha kwa kawaida na kwa ukamilifu wazo la mambo yote ambayo yameandikwa.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: katika Sheria na katika Manabii
  rationale: Huhifadhi majina ya sehemu za Maandiko ya Kiyahudi na ulinganifu wa vifungu hivyo viwili.
theological_decisions:
- issue: Uhusiano wa Paulo na imani ya Israeli
  choice: Paulo anaeleza kwamba kwa kufuata Njia anamwabudu Mungu wa mababu wa Israeli na kuamini yote yaliyoandikwa katika Sheria na Manabii.
  alternative: Kueleza Njia kuwa dini tofauti inayopingana na imani ya Israeli.
  rationale: Kigiriki kinasisitiza mwendelezo wa ibada na Maandiko ya Israeli; tafsiri haipaswi kuingiza utengano wa kidini wa nyakati za baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ile Njia’ imetumiwa kama jina la kihistoria, huku ‘Sheria’ na ‘Manabii’ zikitunzwa kama majina ya sehemu za Maandiko. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa.
