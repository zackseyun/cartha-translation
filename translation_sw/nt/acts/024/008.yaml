  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kumhoji” na “kumshtaki” vinafaa mazingira ya kisheria na vinaeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
