  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: sw
  text: Kutoka kwake,[a] baada ya wewe mwenyewe kumhoji, utaweza kufahamu mambo haya yote tunayomshtaki kwa hayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo rasmi zaidi, “Kutoka kwake, baada ya wewe mwenyewe kumhoji, utaweza kufahamu kuhusu mambo haya yote tunayomshtaki kwa hayo.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za kale zina maneno ya ziada katika mstari wa 7 yanayosema kwamba kamanda Lisia alimwondoa Paulo kwa nguvu na kuwaamuru washtaki waje mbele ya Feliksi. Maneno hayo hayamo katika matini ya SBLGNT iliyotumiwa hapa.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: Kwa kumhoji yeye
  rationale: Muundo huu unaunganisha chanzo cha habari—Paulo mwenyewe—na tendo la uchunguzi kwa Kiswahili cha kawaida, bila kupoteza maana ya παρά pamoja na jenitivi.
- source_word: δυνήσῃ
  choice: utaweza
  rationale: Wakati ujao wa δύναμαι unaonyesha uwezo ambao Feliksi atakuwa nao baada ya uchunguzi.
- source_word: αὐτὸς
  choice: mwenyewe
  rationale: Neno hili linahifadhi msisitizo kwamba Feliksi afanye uchunguzi binafsi.
- source_word: ἀνακρίνας
  choice: kumhoji
  rationale: Katika muktadha wa kisheria, ἀνακρίνω humaanisha kumchunguza mtu kwa kumuuliza maswali; “kumhoji” ni fupi, ya kawaida, na inafaa mazingira hayo.
- source_word: περὶ πάντων τούτων
  choice: kuhusu mambo haya yote
  rationale: Tafsiri hii inahifadhi maana ya περί na wingi pamoja na msisitizo wa πάντων.
- source_word: ἐπιγνῶναι
  choice: kujua ukweli
  rationale: Katika uchunguzi wa kisheria, kitenzi hiki kina maana ya kufahamu au kuthibitisha hali halisi; “kujua ukweli” ni ya asili kwa Kiswahili na haidai ujuzi kamili kupita kiasi.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: tunayomshtaki nayo
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba mambo yaliyotajwa ndiyo mashtaka yanayoelekezwa dhidi yake, huku ukihifadhi msisitizo wa “sisi” ndani ya kiambishi cha kitenzi.
