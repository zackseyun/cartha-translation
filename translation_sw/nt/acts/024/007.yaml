lexical_decisions:
- source_word: παρελθὼν (παρέρχομαι)
  choice: akaja
  rationale: Katika muktadha huu, kitenzi hiki kinaonyesha Lisia akifika mahali pa tukio. Muundo wa Kiswahili ‘akaja, akamnyang’anya’ unasimulia mfuatano wa matendo kwa njia ya kawaida.
- source_word: χιλίαρχος
  choice: jemadari
  rationale: Neno hilo linamtaja afisa mkuu wa jeshi la Roma, kihalisi mkuu wa askari elfu. ‘Jemadari’ ni neno linaloeleweka na lenye hadhi inayofaa, bila kutumia cheo cha kale kisichofahamika kwa urahisi.
- source_word: μετὰ πολλῆς βίας
  choice: kwa nguvu nyingi
  rationale: Tafsiri hii inahifadhi wazo la matumizi makubwa ya nguvu za kimwili bila kulazimisha maana ya ukatili wa nia mbaya.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: akamnyang’anya kutoka mikononi mwetu
  rationale: ‘Akamnyang’anya’ huonyesha kwamba alimwondoa kwa nguvu kutoka katika udhibiti wao, huku ‘kutoka mikononi mwetu’ ikihifadhi picha ya Kigiriki.
