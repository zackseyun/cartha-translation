  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu, pamoja na sehemu ya mwisho ya mstari wa 6 na sehemu ya mwanzo ya mstari wa 8, haupatikani katika hati za kale zaidi za Kigiriki (kutia ndani Papirasi 74 ya karne ya 3, na Kodeksi Sinaitiko na Vatikano za karne ya 4) wala katika tafsiri za kale za Kikopti. Umehifadhiwa katika mapokeo ya hati nyingi za Kibizanti, mapokeo ya Kilatini, na hati za baadaye za Kigiriki. Inaonekana kuwa nyongeza ya mapema ya kiuandishi inayoeleza jinsi jemadari wa Roma alivyoingilia kati kabla ya kesi mbele ya Feliksi.
