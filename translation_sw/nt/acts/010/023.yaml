base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: sw
  text: Basi akawakaribisha ndani na kuwapa mahali pa kulala.[a] Kesho yake akainuka akaondoka pamoja nao, na baadhi ya ndugu kutoka Yopa wakaenda pamoja naye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawapa malazi” au “akawapokea kama wageni”; neno la Kigiriki hapa linamaanisha kutoa ukarimu hasa kwa kuwapa wageni malazi.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” linatafsiri wingi wa kiume ἀδελφῶν; katika matumizi ya Wakristo wa kwanza neno hili wakati mwingine linaweza kumaanisha waumini wenzao kwa upana.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: akawakaribisha ndani
  rationale: Kitenzi hiki cha kati kinaonyesha kwamba Petro aliwaita waingie mahali alipokuwa anakaa; ‘akawakaribisha ndani’ ni Kiswahili cha kawaida na pia kinaonyesha tendo la ukarimu.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha tendo hilo na mazungumzo yaliyotangulia kama matokeo ya simulizi, bila kulifanya kuwa hitimisho zito la kimantiki.
- source_word: ἐξένισεν
  choice: kuwapa mahali pa kulala
  rationale: Katika muktadha huu ξενίζω linamaanisha kuwapa wageni ukarimu unaotia ndani malazi; tafsiri hii inaweka wazi tendo halisi.
- source_word: Τῇ δὲ ἐπαύριον
  choice: Kesho yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha siku iliyofuata katika mfululizo wa simulizi.
- source_word: ἀναστὰς ἐξῆλθεν
  choice: akaondoka
  rationale: Ingawa kwa karibu ni ‘aliposimama, akatoka,’ muunganiko huu hutumika kuanzisha tendo la kuondoka; ‘akaondoka’ ni wa asili bila kuongeza habari isiyokuwapo.
- source_word: σὺν αὐτοῖς
  choice: pamoja nao
  rationale: Inaonyesha tu kwamba Petro alifuatana nao.
- source_word: τινες
  choice: baadhi
  rationale: Huwakilisha idadi isiyotajwa ya watu katika kundi.
- source_word: ἀδελφῶν
  choice: ndugu
  rationale: ‘Ndugu’ ni neno la kawaida katika Kiswahili kwa waumini wenzao na linaweza kutaja wanaume au kundi pana; jinsia ya warejelewa haijawekwa wazi kabisa na nomino ya Kiswahili.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: kutoka Yopa
  rationale: Kirai hiki kinawatambulisha ndugu kwa mahali walikotoka; ‘Yopa’ ni umbo lililozoeleka katika Kiswahili.
- source_word: συνῆλθον αὐτῷ
  choice: wakaenda pamoja naye
  rationale: Katika muktadha wa safari, kitenzi kinaonyesha kwamba walifuatana na Petro; tafsiri hii ni wazi na ya kawaida.
theological_decisions:
- issue: Maana ya ἀδελφῶν katika muktadha wa jumuiya ya waumini
  choice: ndugu
  alternative: waumini wenzao; ndugu wa kiume
  rationale: Kigiriki kina umbo la wingi wa kiume, lakini katika matumizi ya Wakristo wa kwanza neno hilo linaweza kumaanisha waumini wenzao kwa upana. ‘Ndugu’ huhifadhi istilahi ya kifamilia na utata huo wa matumizi bila kuamua kimyakimya jinsia ya kundi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi la heshima lakini kinachoeleweka kwa urahisi. Muundo wa vitenzi vya mfululizo kwa ‘aka-/waka-’ unafaa mtiririko wa hadithi. ‘Yopa’ limetumiwa kama jina la mahali lililozoeleka katika tafsiri za Kiswahili.
