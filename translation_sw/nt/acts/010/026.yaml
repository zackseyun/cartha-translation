  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: sw
  text: Lakini Petro akamwinua[a], akisema, “Simama[b]; mimi pia ni mwanadamu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamnyanyua” au “akamsaidia kuinuka.”
    reason: lexical_alternative
  - marker: b
    text: Au “Inuka.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana ya neno kwa neno zaidi, “mimi mwenyewe pia ni mwanadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: akamwinua
  rationale: Kitenzi “kumwinua” kinadumisha maana ya ἐγείρω ya kumfanya mtu ainuke, bila kubainisha isivyolazimu kama Petro alimsaidia kwa namna gani.
- source_word: Ἀνάστηθι
  choice: Simama
  rationale: Amri hii ya moja kwa moja inaendana na muktadha wa Kornelio kuwa ameanguka miguuni pa Petro; “Simama” ni Kiswahili cha kawaida na cha asili.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: mimi pia
  rationale: '“Mimi pia” huwasilisha kwa njia ya asili msisitizo wa kujijumuisha uliomo katika καὶ ἐγὼ αὐτός: Petro naye ni wa hali iyo hiyo.'
- source_word: ἄνθρωπός εἰμι
  choice: ni mwanadamu
  rationale: “Mwanadamu” ni tafsiri ya moja kwa moja inayosisitiza ubinadamu wa Petro bila kuongeza wazo la “mwanadamu tu,” ambalo halijasemwa wazi katika Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: “Lakini” huonyesha tofauti nyepesi kati ya tendo la Kornelio katika mstari uliotangulia na jibu la Petro la kulisahihisha.
theological_decisions:
- issue: Jibu la Petro kwa Kornelio kujitupa miguuni pake
  choice: Maneno yanaonyesha Petro akikataa heshima inayomwinua kupita hali yake, akitoa sababu kwamba yeye pia ni mwanadamu.
  alternative: Kauli hiyo inaweza kueleweka kwa maana finyu zaidi kuwa wonyesho wa unyenyekevu tu, bila hitimisho pana la kiteolojia.
  rationale: “Simama; mimi pia ni mwanadamu” huhifadhi maana dhahiri ya andiko bila kuingiza fundisho lililokuzwa kuhusu ibada ambalo mstari wenyewe haulitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usimulizi “akamwinua, akisema” ni wa kawaida katika tafsiri ya masimulizi ya kibiblia, huku usemi wa Petro ukiwa mfupi, wazi, na wa moja kwa moja.
