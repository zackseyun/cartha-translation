base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: sw
  text: Lakini inuka, ushuke, na uende pamoja nao bila kusita[a], kwa sababu mimi nimewatuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kutofautisha.” Kirai cha Kigiriki kinaweza kumaanisha kutokuwa na shaka au kutosita, au kutofautisha; maana ya pili huenda ikahusiana na mada ya sura hii kuhusu Wayahudi na watu wa mataifa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha tofauti na hali ya Petro ya kutokuwa na uhakika na kumwelekeza achukue hatua.
- source_word: ἀναστὰς
  choice: simama
  rationale: Kirai hiki kinatumika kwa nguvu ya amri na kinaanza mfululizo wa maagizo ya haraka; “simama” ni Kiswahili cha kawaida na kinachofaa katika muktadha.
- source_word: κατάβηθι
  choice: ushuke
  rationale: Kinahifadhi mwendo wa kushuka kutoka mahali Petro alipokuwa juu ya paa.
- source_word: πορεύου
  choice: uende
  rationale: Ni amri ya kwenda; pamoja na “pamoja nao” inaeleza wazi kwamba Petro aandamane na wale watu.
- source_word: σὺν αὐτοῖς
  choice: pamoja nao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuandamana nao.
- source_word: μηδὲν διακρινόμενος
  choice: bila kusita
  rationale: Katika muktadha wa karibu, Petro anaagizwa asiwe na shaka wala kusita kwenda na wale watu. Tafsiri hii ni ya asili kwa Kiswahili, huku maana nyingine inayowezekana ikihifadhiwa katika tanbihi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaonyesha sababu ya Petro kutii agizo hilo.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kimetajwa wazi katika Kigiriki kwa mkazo; “mimi” kinahifadhi mkazo huo.
- source_word: ἀπέσταλκα
  choice: nimewatuma
  rationale: 'Wakati timilifu unaonyesha tendo lililokamilika lenye umuhimu wa sasa: watu hao wako hapo wakiwa wametumwa na msemaji.'
- source_word: αὐτούς
  choice: wa-
  rationale: Kiambishi cha yambwa katika “nimewatuma” kinawarejelea wale watu waliokuja kumtafuta Petro.
theological_decisions:
- issue: Maana ya μηδὲν διακρινόμενος kuhusiana na kuingizwa kwa watu wa mataifa
  choice: “bila kusita” katika matini kuu, ikisisitiza kwamba Petro asisite kwenda nao
  alternative: “bila kufanya tofauti yoyote”
  rationale: Muktadha wa karibu unahusu kutokuwa na uhakika kwa Petro na agizo la Roho aandamane na wale watu. Hata hivyo, sura nzima pia inahusu kutowatenganisha Wayahudi na watu wa mataifa. Tanbihi inalinda maana hiyo nyingine bila kuondoa utata wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa amri umewekwa kwa lugha nyepesi na ya kawaida; “kisha” hufanya mtiririko wa vitendo uwe wazi bila kubadili maana.
