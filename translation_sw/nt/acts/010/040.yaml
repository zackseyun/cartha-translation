lexical_decisions:
- source_word: τοῦτον
  choice: Mtu huyu
  rationale: Kiwakilishi kionyeshi kilichotangulizwa katika Kigiriki kinamkazia Yesu, aliyetajwa kabla. “Mtu huyu” huhifadhi mkazo huo kwa Kiswahili cha kawaida bila kutatanishwa na maana ya “Mungu huyu.”
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni kiima cha sentensi na tafsiri yake ya moja kwa moja ni “Mungu.”
- source_word: ἤγειρεν
  choice: alimfufua
  rationale: Katika muktadha wa ufufuo, kitenzi hiki kinamaanisha kumwinua mtu kutoka kwa wafu; “alimfufua” ni usemi wa asili na sahihi katika Kiswahili.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: siku ya tatu
  rationale: Huhifadhi maana ya wakati bila kuongeza namna ya kuhesabu siku ambayo haijaelezwa katika chanzo.
- source_word: ἔδωκεν
  choice: akamjalia
  rationale: Katika muundo huu wenye kitenzi-jina, neno hilo lina wazo la kumpa au kumwezesha jambo litokee. “Akamjalia” ni la asili na halisisitizi usababishaji kupita kiasi.
- source_word: αὐτὸν
  choice: -m-
  rationale: Kiambishi cha yambwa katika “akamjalia” kinamrejelea Yesu kwa njia ya kawaida ya Kiswahili.
- source_word: ἐμφανῆ
  choice: aonekane
  rationale: Neno hili lina maana ya kuwa dhahiri au mwenye kuonekana. “Aonekane” huwasilisha kwamba Yesu aliyefufuliwa alionekana.
- source_word: γενέσθαι
  choice: aonekane
  rationale: Muundo wa Kiswahili “akamjalia aonekane” huunganisha kwa kawaida wazo la kuja kuwa mwenye kuonekana, bila kulazimisha tafsiri ngumu ya neno kwa neno.
theological_decisions:
- issue: Kauli kuhusu ufufuo
  choice: Mungu alimfufua siku ya tatu
  alternative: Mungu alimwinua siku ya tatu
  rationale: Tafsiri inahifadhi wazi tendo la Mungu katika ufufuo wa Yesu, bila kuongeza maelezo ya kiteolojia yasiyomo katika aya.
- issue: Kuonekana baada ya ufufuo
  choice: akamjalia aonekane
  alternative: akamfanya aonekane
  rationale: Kauli hii inadumisha tofauti kati ya kufufuliwa na kuonekana baada ya kufufuliwa. Pia huhifadhi wazo la Kigiriki la Mungu kumpa Yesu kuwa mwenye kuonekana bila kuamua kwa nguvu zaidi ya maandishi kama lilikuwa ruhusa au usababishaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Utangulizi “Mtu huyu” umehifadhi mkazo wa chanzo; “akamjalia aonekane” ni wa asili huku ukibakiza mvutano wa maana kati ya kumpa, kumwezesha, na kumfanya aonekane.
