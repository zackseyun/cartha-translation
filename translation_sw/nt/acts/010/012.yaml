base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: sw
  text: Ndani yake kulikuwa na wanyama wote wenye miguu minne, viumbe watambaao wa ardhini, na ndege wa angani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Ndani yake
  rationale: Kiwakilishi hiki kinarejelea kitu kama shuka kilichoonekana katika maono; “ndani yake” ni Kiswahili cha kawaida kinachohifadhi maana ya mahali.
- source_word: ὑπῆρχεν
  choice: kulikuwa na
  rationale: Kitenzi hiki hapa kinaonyesha kuwapo kwa viumbe ndani ya kile kitu, bila kuongeza wazo lenye nguvu zaidi la kwamba kilivihifadhi.
- source_word: πάντα
  choice: wote
  rationale: Neno hili linaonyesha ujumla wa makundi yaliyotajwa bila kuongeza moja kwa moja tafsiri ya “kila aina ya.”
- source_word: τὰ τετράποδα
  choice: wanyama wote wenye miguu minne
  rationale: Hii ni tafsiri ya wazi na ya kawaida ya wanyama wenye miguu minne; “wote” huambatana kiasili na nomino hii katika Kiswahili.
- source_word: ἑρπετὰ τῆς γῆς
  choice: viumbe watambaao wa ardhini
  rationale: “Viumbe watambaao” huhifadhi upana wa ἑρπετά kuliko “reptilia,” ambalo lingeweza kuifanya maana kuwa finyu; “wa ardhini” huhifadhi uhusiano wa genitivi.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: Katika orodha hii πετεινά inaeleweka kwa kawaida kuwa ndege, na οὐρανός humaanisha anga katika muktadha huu.
- source_word: καὶ ... καὶ
  choice: ', ... na'
  rationale: Kiswahili cha kawaida hutumia koma kati ya vipengele vya orodha na “na” kabla ya kipengele cha mwisho, huku uhusiano wa uratibu ukihifadhiwa.
