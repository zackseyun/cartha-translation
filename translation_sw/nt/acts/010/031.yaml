  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: sw
  text: Akasema, “Kornelio, sala yako imesikiwa, na matendo yako ya huruma[a] yamekumbukwa mbele za Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka zako” au “misaada yako kwa maskini.” Neno la Kigiriki linamaanisha utoaji au matendo ya huruma kwa wenye uhitaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: Akasema
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita ni wa kawaida na wa asili katika masimulizi ya Kiswahili.
- source_word: Κορνήλιε
  choice: Kornelio
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: εἰσηκούσθη
  choice: imesikiwa
  rationale: Huhifadhi hali ya kutendwa na maana kwamba sala ilipata kusikilizwa, bila kuongeza maelezo kuhusu jinsi ilivyojibiwa.
- source_word: προσευχὴ
  choice: sala
  rationale: Ni neno la kawaida na lenye heshima kwa προσευχή; umoja wa Kigiriki umehifadhiwa.
- source_word: ἐλεημοσύναι
  choice: matendo yako ya huruma
  rationale: Huwasilisha matendo au utoaji wa rehema kwa wenye uhitaji kwa Kiswahili cha sasa, bila kuyabana kuwa pesa pekee.
- source_word: ἐμνήσθησαν
  choice: yamekumbukwa
  rationale: Huhifadhi kauli ya kutendwa, wingi, na lugha nzito ya kukumbukwa badala ya kuifafanua kuwa Mungu ameona tu.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa Kiswahili unaoeleweka unaohifadhi wazo la kuwapo na kuangaliwa na Mungu.
theological_decisions:
- issue: Maana ya matendo ya Kornelio ya kuwasaidia wenye uhitaji
  choice: matendo yako ya huruma
  alternative: sadaka zako; misaada yako kwa maskini
  rationale: Tafsiri hii inaonyesha matendo halisi ya rehema lakini haisemi kwamba yalistahili wokovu au thawabu kwa msingi wa sifa binafsi.
- issue: Lugha ya Mungu kukumbuka
  choice: yamekumbukwa mbele za Mungu
  alternative: Mungu ameyaona; Mungu ameyazingatia
  rationale: Usemi wa kukumbukwa umehifadhiwa kwa sababu una uzito wa kibiblia na wa kimahusiano, bila kufafanua zaidi ya kile mstari unachosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na kauli za kutendwa umehifadhiwa pale ambapo ni wa asili katika Kiswahili.
