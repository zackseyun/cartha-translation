  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: sw
  text: Na sasa tuma wanaume waende Yafa, wakamwite Simoni fulani anayeitwa Petro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuma wanaume waende Yafa kumwita mtu mmoja aitwaye Simoni, anayejulikana kama Petro.”
    reason: Hutoa mbadala wa kawaida wa Kiswahili unaowasilisha “kutuma mtu amwitwe” na “anayejulikana kama,” huku ukihifadhi Simoni kuwa mtu ambaye bado hajatambulishwa kikamilifu katika simulizi.
lexical_decisions:
- source_word: καὶ νῦν
  choice: Na sasa
  rationale: Huhifadhi kiunganishi na alama ya wakati/mtiririko wa hotuba kwa Kiswahili cha kawaida.
- source_word: πέμψον ἄνδρας εἰς Ἰόππην
  choice: tuma watu waende Yafa
  rationale: Kitenzi cha amri kinatafsiriwa moja kwa moja; 'watu' ni matumizi ya kawaida ya Kiswahili kwa kundi la wanaume katika muktadha huu, bila kuongeza dhana ya 'wajumbe.' 'Waende' huonyesha kwa kawaida mwelekeo unaobebwa na εἰς.
- source_word: μετάπεμψαι
  choice: wakamwite
  rationale: Katika muktadha wa kuwatuma watu wamlete mtu, 'wakamwite' huwasilisha maana ya kutuma mtu aitwe bila kudokeza kulazimishwa.
- source_word: Σίμωνά τινα
  choice: Simoni fulani
  rationale: '''Fulani'' huhifadhi kutotajwa kwa utambulisho kamili kunakoletwa na τινα, huku jina Simoni likibaki wazi.'
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: anayeitwa Petro
  rationale: Hutoa kwa uwazi maana ya jina ambalo Simoni anaitwa, bila kulifanya kuwa jina la ukoo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'wakamwite' unaunganisha kwa kawaida kutumwa kwa watu na kusudi la kumwita Petro. Alama ya tanbihi [a] imewekwa katika matini kuu.
