  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: sw
  text: Petro alipokuwa bado akisema maneno haya, Roho Mtakatifu akawashukia[a] wote waliokuwa wakisikiliza lile neno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawajia.”
    reason: Mbadala huu unaonyesha maana ya kimuktadha ya ἐπέπεσε kwa Kiswahili laini zaidi, huku matini kuu ikihifadhi picha halisi ya “kushukia.”
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Petro alipokuwa bado akisema
  rationale: Muundo wa Kigiriki ni kishazi cha wakati kinachoonyesha tendo lililokuwa likiendelea; tafsiri hii inahifadhi kwamba Petro alikuwa bado anaendelea kusema wakati tukio kuu lilipotokea.
- source_word: τὰ ῥήματα ταῦτα
  choice: maneno haya
  rationale: ῥήματα hapa ni maneno yaliyokuwa yakisemwa na Petro; “maneno haya” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ἐπέπεσε
  choice: akawashukia
  rationale: Kitenzi ἐπιπίπτω kina picha halisi ya kushukia au kuangukia. “Akawashukia” huhifadhi nguvu ya simulizi na matumizi yanayoeleweka kwa Roho bila kudokeza kuanguka kwa mwili.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, la sasa na lenye heshima katika Kiswahili kwa kifungu hiki.
- source_word: ἐπὶ πάντας
  choice: wote
  rationale: Kiambishi cha yambwa katika “akawashukia” tayari kinawakilisha watu, na “wote” huhifadhi upeo wa πάντας kwa Kiswahili cha kawaida.
- source_word: τοὺς ἀκούοντας
  choice: waliokuwa wakisikiliza
  rationale: Kauli endelevu inaonyesha watu waliokuwa katika tendo la kusikiliza wakati huo, sawasawa na participle ya wakati uliopo.
- source_word: τὸν λόγον
  choice: lile neno
  rationale: “Neno” linadumisha ulinganifu wa karibu na λόγος, huku “lile” likionyesha ujumbe uliokuwa ukisemwa katika muktadha.
theological_decisions:
- issue: Jinsi ya kutafsiri tendo la Roho katika ἐπέπεσε
  choice: Roho Mtakatifu akawashukia wote
  alternative: Roho Mtakatifu akawajia wote
  rationale: “Akawashukia” huhifadhi picha yenye nguvu ya kitenzi cha Kigiriki bila kuongeza maelezo ya kimadhehebu kuhusu namna au matokeo ya ujio wa Roho.
- issue: Maana ya λόγος katika muktadha wa tangazo
  choice: lile neno
  alternative: ujumbe huo
  rationale: “Lile neno” hudumisha istilahi ya chanzo na uzito wake wa kitheolojia, lakini muktadha bado unaonyesha kwamba ni ujumbe uliotangazwa na Petro.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa simulizi unaosomeka kwa urahisi; “akawashukia” ni hai lakini si wa kimadhehebu, na “lile neno” huhifadhi ukaribu na maandishi ya Kigiriki.
