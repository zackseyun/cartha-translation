  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: sw
  text: Kwa hiyo, tuma watu Yafa wakamwite Simoni[a], anayeitwa Petro. Anaishi kama mgeni katika nyumba ya Simoni, mtengenezaji wa ngozi, kando ya bahari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuma watu wamlete Simoni”; kitenzi cha Kigiriki kina maana ya kumwita mtu aje kwako.
    reason: lexical_alternative
  - marker: b
    text: Au, “Anaishi akiwa mgeni katika nyumba ya Simoni, mtengenezaji wa ngozi, kando ya bahari.” Kigiriki kinaonyesha kwamba Petro amekaribishwa na anakaa kama mgeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Kwa hiyo, tuma watu kwenda Yafa
  rationale: Kauli ya amri πέμψον inadai hatua ya moja kwa moja; ‘tuma watu’ huweka wazi kwa Kiswahili kwamba wajumbe ndio wanaotumwa. οὖν inadumisha uhusiano wa kimantiki kwa ‘Kwa hiyo,’ na εἰς Ἰόππην ni mwelekeo wa kwenda Yafa.
- source_word: μετακάλεσαι
  choice: wamwite
  rationale: Kitenzi hiki cha kati kina maana ya kufanya mtu aitwe aje kwa mhusika. ‘Wamwite’ ni ya kawaida na hudumisha kusudi hilo bila ukali wa ‘wamwamuru aje.’
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Simoni, anayeitwa Petro
  rationale: Hutambulisha jina jingine analojulikana nalo Simoni bila kuongeza wazo lisilo katika Kigiriki.
- source_word: ξενίζεται
  choice: ni mgeni
  rationale: Umbo hili linaonyesha kwamba Petro anapokea ukarimu na anakaa kama mgeni katika nyumba ya mtu mwingine; ‘ni mgeni’ ni fupi, ya asili, na inadumisha maana hiyo.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: katika nyumba ya Simoni mtengenezaji wa ngozi
  rationale: ‘Nyumba’ hutafsiri οἰκία moja kwa moja, huku ‘mtengenezaji wa ngozi’ ikieleza kazi ya βυρσεύς kwa lugha inayoeleweka sasa.
- source_word: παρὰ θάλασσαν
  choice: karibu na bahari
  rationale: παρά pamoja na accusative hapa huonyesha mahali kandokando ya bahari; ‘karibu na bahari’ ni Kiswahili cha kawaida na sahihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Jina la mahali limetolewa kama ‘Yafa,’ umbo lililozoeleka katika Kiswahili cha Biblia. Alama zote za tanbihi zimewekwa katika matini kuu; [b] imewekwa mwisho wa kishazi kinachohusu ξενίζεται ili kuepuka kuonekana kana kwamba inafafanua kazi ya mtengenezaji wa ngozi pekee.
