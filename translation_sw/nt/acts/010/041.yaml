  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: sw
  text: si kwa watu wote, bali kwa mashahidi waliokuwa wamechaguliwa mapema na Mungu[a]—yaani, sisi, tuliokula na kunywa pamoja naye baada ya yeye kufufuka kutoka kwa wafu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wameteuliwa mapema na Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “baada ya yeye kufufuliwa kutoka kwa wafu.” Kigiriki hapa kinaweza kutafsiriwa kiasili “baada ya yeye kufufuka kutoka kwa wafu,” ingawa usemi wa kutendwa unatumiwa mahali pengine katika Agano Jipya.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: si kwa watu wote
  rationale: Huhifadhi upeo wa παντί na tofauti kati ya watu wote na kundi maalumu la mashahidi, kwa Kiswahili cha kawaida.
- source_word: μάρτυσι
  choice: kwa mashahidi
  rationale: Katika Matendo, μάρτυς humaanisha watu wanaotoa ushuhuda kuhusu waliyoyaona; “mashahidi” ni neno wazi na la kawaida.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: waliokuwa wamechaguliwa mapema na Mungu
  rationale: Kauli tendwa timilifu inaonyesha uchaguzi wa Mungu uliofanyika kabla na wenye umuhimu unaoendelea. “Walikuwa wamechaguliwa mapema” ni ya asili na haiongezi wazo lisilokuwamo.
- source_word: ἡμῖν
  choice: yaani, sisi
  rationale: Dativu hii inafafanua mashahidi hao kuwa kundi la Petro na wenzake; “yaani” huonyesha uhusiano huo kwa uwazi.
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: tuliokula na kunywa pamoja naye
  rationale: Vitenzi vyenye kiambishi συν- vinasisitiza ushirika halisi wa kula na kunywa pamoja; tafsiri hii ni ya moja kwa moja na ya asili.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: baada ya yeye kufufuka kutoka kwa wafu
  rationale: Muundo wa μετά pamoja na infinitivu una maana ya wakati, “baada ya,” na ἀναστῆναι hapa inasomeka kiasili kama “kufufuka.” Kuweka “yeye” kunazuia sentensi ya Kiswahili isieleweke kana kwamba mashahidi ndio waliofufuka.
theological_decisions:
- issue: Namna ya kueleza ufufuo katika ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: baada ya yeye kufufuka kutoka kwa wafu
  alternative: baada ya yeye kufufuliwa kutoka kwa wafu
  rationale: Kitenzi cha Kigiriki hapa kinaelekea kiasili kwenye usemi “kufufuka,” bila kukanusha kwamba Mungu ndiye aliyemfufua Yesu kama inavyosemwa mahali pengine. Tanbihi inalinda uwezekano wa usemi tendwa.
- issue: Maana ya προκεχειροτονημένοις
  choice: waliokuwa wamechaguliwa mapema
  alternative: waliokuwa wameteuliwa mapema
  rationale: Kitenzi kinaweza kuonyesha kuchaguliwa au kuteuliwa. Matini kuu inatumia “kuchaguliwa,” huku tanbihi ikihifadhi maana mbadala bila kuamua zaidi ya ushahidi wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja lakini wa asili; alama ya mkato mrefu na “yaani” zinaonyesha kwamba “sisi” inafafanua mashahidi. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
