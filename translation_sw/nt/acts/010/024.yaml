  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: sw
  text: Siku iliyofuata, aliingia Kaisaria.[a] Kornelio alikuwa akiwatarajia, baada ya kuwaita pamoja jamaa zake na rafiki zake wa karibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina kitenzi cha umoja, “aliingia,” lakini baadaye kina kiwakilishi cha wingi, “wao,” kinachoakisiwa katika “akiwatarajia.” Huenda umoja unamwangazia Petro kama mhusika mkuu, huku wingi ukijumuisha waandamani wake katika matarajio ya Kornelio.
    reason: textual_variant
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Siku iliyofuata
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha siku inayofuata katika mtiririko wa simulizi; δέ halihitaji kutafsiriwa kwa kiunganishi kizito.
- source_word: εἰσῆλθεν
  choice: aliingia
  rationale: Kitenzi cha Kigiriki kiko katika umoja na kinamwelekeza Petro kama mhusika mkuu, hivyo umoja umehifadhiwa.
- source_word: Καισάρειαν
  choice: Kaisaria
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali Καισάρεια.
- source_word: ὁ δὲ Κορνήλιος
  choice: Kornelio
  rationale: Mabadiliko ya mtazamo wa simulizi yanaeleweka kwa mpangilio wa sentensi; hakuna haja ya kulazimisha δέ kuwa 'lakini,' jambo ambalo lingeleta utofautishaji mkali usiokusudiwa.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: alikuwa akiwatarajia
  rationale: Muundo huu unaonyesha matarajio yaliyoendelea, huku kiambishi -wa- kikihifadhi wazi wingi wa αὐτούς, yaani Petro pamoja na wenzake.
- source_word: συγκαλεσάμενος
  choice: akiwa amewakusanya
  rationale: Muundo huu unaonyesha kwamba Kornelio alikuwa tayari amewaita watu hao wakutane kabla au wakati alipokuwa akiwasubiri, kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: jamaa zake
  rationale: '''Jamaa zake'' ni usemi wa kawaida wa Kiswahili kwa ndugu wa ukoo au watu wa familia pana bila kuubana maana kwa ndugu wa karibu pekee.'
- source_word: τοὺς ἀναγκαίους φίλους
  choice: rafiki zake wa karibu
  rationale: Katika muktadha huu ἀναγκαίους hueleza urafiki wa karibu au wa ndani, si 'wa lazima' kwa maana ya moja kwa moja.
theological_decisions:
- issue: Umoja wa εἰσῆλθεν ukifuatiwa na wingi wa αὐτούς
  choice: Kuhifadhi 'aliingia' katika umoja na 'akiwatarajia' katika wingi
  alternative: Kutafsiri 'waliingia' ili kulainisha upatanifu wa Kiswahili
  rationale: 'Maumbo yote mawili ya Kigiriki yanahifadhiwa bila kuyapatanisha kimyakimya: simulizi linamwangazia Petro kama mhusika mkuu katika kuingia, lakini Kornelio alikuwa akimtarajia yeye pamoja na waandamani wake.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Sentensi ni nyepesi na inayoeleweka kwa wasomaji wa kawaida; tofauti halisi kati ya umoja na wingi imehifadhiwa na kufafanuliwa katika tanbihi.
