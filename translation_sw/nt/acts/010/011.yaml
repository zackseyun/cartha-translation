  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: sw
  text: Akaona mbingu zimefunguka[a], na kitu fulani[b] kama shuka kubwa kikishuka, kikiteremshwa hadi duniani kwa pembe zake nne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anga limefunguka.” Neno la Kigiriki οὐρανός linaweza kumaanisha “anga” au “mbingu”; hapa “mbingu” limechaguliwa kwa sababu ya muktadha wa maono na ufunuo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kitu fulani cha matumizi” au “chombo fulani.” Usemi wa Kigiriki σκεῦός τι haukubainishi kitu hicho kwa usahihi.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa ncha zake nne.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: akaona
  rationale: Kauli ya sasa ya kisimulizi katika Kigiriki imetafsiriwa kwa wakati wa kusimulia unaotumika kwa kawaida katika Kiswahili. “Akaona” hudumisha mfululizo wa matukio na uwazi wa kitendo.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: mbingu imefunguka
  rationale: “Mbingu” inafaa muktadha wa maono na ufunuo, huku “imefunguka” ikidumisha hali inayotokana na kufunguka bila kutaja mtendaji ambaye maandishi hayamtaji.
- source_word: καταβαῖνον
  choice: kikishuka
  rationale: Huwakilisha tendo linaloendelea la kitu hicho kwenda chini na kudumisha taswira hai ya maono.
- source_word: σκεῦός τι
  choice: kitu fulani
  rationale: σκεῦος ina maana pana ya kitu, chombo, au kifaa. “Kitu fulani” hudumisha kutokuwa mahususi kwa usemi wa Kigiriki bila kukisia matumizi ya kitu hicho.
- source_word: ὡς ὀθόνην μεγάλην
  choice: kama shuka kubwa
  rationale: “Kama” hudumisha ulinganisho, na “shuka kubwa” ni taswira ya kawaida na inayoeleweka bila kubainisha isivyohitajika aina ya kitambaa.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: kwa pembe zake nne
  rationale: Katika taswira ya shuka, ncha nne zinaeleweka kwa kawaida kama pembe nne. Kiwakilishi “zake” kinaonyesha wazi kuwa ni pembe za kitu hicho.
- source_word: καθιέμενον
  choice: kikiteremshwa
  rationale: Kauli tendwa hudumishwa, hivyo tafsiri haimtaji anayekiteremsha kwa kuwa maandishi hayamtaji.
- source_word: ἐπὶ τῆς γῆς
  choice: hadi duniani
  rationale: Katika muktadha wa mwendo wa kushuka, kifungu hiki kinaonyesha mwelekeo au mwisho wa mwendo kuelekea dunia. “Duniani” hudumisha upana wa γῆ badala ya kuifanya kuwa ardhi ya eneo fulani tu.
theological_decisions:
- issue: Maana ya οὐρανός katika muktadha wa maono
  choice: mbingu
  alternative: anga
  rationale: Kwa kuwa tukio ni maono ya ufunuo na kitu kinashuka kutoka juu, “mbingu” hudumisha uzito wa kisimulizi na kiteolojia. Hata hivyo, neno la Kigiriki linaweza pia kumaanisha “anga,” jambo linaloonyeshwa katika tanbihi bila kulazimisha tafsiri moja kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Muundo wa “akaona” unafaa mtiririko wa simulizi, huku vishiriki “kikishuka” na “kikiteremshwa” vikidumisha tofauti kati ya mwendo wa kushuka na kauli tendwa ya kuteremshwa.
