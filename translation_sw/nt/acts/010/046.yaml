  text: 'Kwa maana waliwasikia wakinena kwa ndimi[a] na wakimtukuza Mungu. Ndipo Petro akajibu:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa lugha.” Neno la Kigiriki linaweza kumaanisha ndimi au lugha; hapa maana yake pana imehifadhiwa bila kuamua asili ya usemi huo.
