lexical_decisions:
- source_word: ἤκουον
  choice: waliwasikia
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha kusikia kulikokuwa kukiendelea; muundo wa Kiswahili wenye kiambishi -li- pamoja na kishirikishi cha hali inayoendelea katika vitenzi vinavyofuata unatoa simulizi la kawaida bila kulazimisha tafsiri nzito.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya kauli iliyotangulia.
- source_word: αὐτῶν
  choice: wa- katika “waliwasikia”
  rationale: Kiwakilishi cha wale waliokuwa wakisikika kimehifadhiwa kama kiambishi cha yambwa, bila kuwaongeza kwa jina la kufasiri.
- source_word: λαλούντων
  choice: wakinena
  rationale: Huhifadhi tendo linaloendelea na inaendana na mtindo wenye hadhi wa simulizi la Biblia; pia huunda kirai cha kawaida “kunena kwa lugha.”
- source_word: γλώσσαις
  choice: kwa lugha
  rationale: γλῶσσα linaweza kumaanisha ulimi au lugha. “Kwa lugha” ni kauli pana ya Kiswahili inayohifadhi msemo unaotambulika bila kuamua kama ni lugha zinazojulikana, usemi wa kiroho, au yote mawili.
- source_word: μεγαλυνόντων
  choice: kumtukuza
  rationale: Katika muktadha wa sifa kwa Mungu, “kumtukuza” huwasilisha maana ya kumkiri kuwa mkuu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya tendo la kumtukuza; hili ndilo neno la kawaida la Kiswahili.
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha hatua iliyofuata katika mfululizo wa matukio kwa njia ya asili katika simulizi la Kiswahili.
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Huhifadhi maana ya kujibu au kuitikia, ingawa swali lililotangulia halikutajwa wazi.
- source_word: Πέτρος
  choice: Petro
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
theological_decisions:
- issue: Maana ya γλώσσαις katika muktadha wa usemi uliowezeshwa na Roho
  choice: kwa lugha
  alternative: kwa lugha mbalimbali; kwa ndimi
  rationale: Neno la Kigiriki linaweza kurejelea lugha au ndimi, na kifungu chenyewe hakielezi kikamilifu asili ya usemi huo. Tafsiri kuu imeachwa pana, huku tanbihi ikionyesha uwezekano wa kileksika bila kuamua mjadala wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakinena” na “Ndipo Petro akajibu” vinafaa kwa simulizi la kibiblia bila kuwa vya kizamani kupita kiasi; sentensi inaishia kwa nukta mbili kwa sababu kauli ya Petro inafuata katika mstari unaofuata.
