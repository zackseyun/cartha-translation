  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: sw
  text: 'Ndipo Petro akafungua kinywa chake, akasema: “Kwa kweli, natambua kwamba Mungu hana upendeleo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu haangalii sura ya mtu”; nahau inayomaanisha kwamba Mungu haonyeshi upendeleo au upendeleo wa kindugu kwa watu kwa msingi wa hadhi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: akafungua kinywa chake
  rationale: Nahau hii ya Kigiriki huanzisha tamko rasmi au lenye uzito. Muundo huu unaeleweka katika Kiswahili na huhifadhi taswira pamoja na msisitizo wa chanzo.
- source_word: δὲ
  choice: Ndipo
  rationale: Hapa δέ inaendeleza simulizi; “Ndipo” huunganisha tendo hili na yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: Ἐπ’ ἀληθείας
  choice: Kwa kweli
  rationale: Kirai hiki kinasisitiza ukweli wa utambuzi anaoutoa Petro. “Kwa kweli” ni cha asili, wazi, na chenye hadhi katika Kiswahili cha sasa.
- source_word: καταλαμβάνομαι
  choice: ninaelewa
  rationale: Katika muktadha huu kitenzi kinaeleza kufikia ufahamu au kutambua jambo. “Ninaelewa” huhifadhi hali ya sasa bila kuongeza wazi neno “sasa,” ambalo halimo katika Kigiriki.
- source_word: προσωπολήμπτης
  choice: hana upendeleo
  rationale: Nomino hii humaanisha mtu anayependelea watu kwa kuangalia hadhi au hali yao. Kiswahili asilia hutumia kauli “hana upendeleo,” ambayo inawasilisha maana hiyo kwa uwazi bila nahau ngeni.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa θεός katika muktadha huu.
theological_decisions:
- issue: Kueleza kutokuwa na upendeleo kwa Mungu bila kuingiza ufafanuzi wa kimadhehebu
  choice: Mungu hana upendeleo
  alternative: Mungu hampendelei mtu yeyote
  rationale: Kauli iliyochaguliwa huhifadhi dai pana kuhusu tabia ya Mungu na haibani maana kwa kundi au mfumo fulani wa kitheolojia. Pia huepuka kuongeza “mtu yeyote,” ingawa maana hiyo imo katika nahau.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akafungua kinywa chake” umehifadhiwa kwa uzito wake wa balagha, huku “hana upendeleo” ikitoa maana ya nahau ya Kigiriki kwa lugha ya kawaida.
