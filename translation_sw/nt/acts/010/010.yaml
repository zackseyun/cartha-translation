lexical_decisions:
- source_word: ἐγένετο
  choice: Akawa
  rationale: Kitenzi kinaonyesha kuingia katika hali mpya; “akawa” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: πρόσπεινος
  choice: na njaa sana
  rationale: Neno lina nguvu kuliko kuwa na njaa tu; “njaa sana” ni wazi na la kawaida bila kutia chumvi.
- source_word: ἤθελεν
  choice: akataka
  rationale: “Kutaka” ni tafsiri ya kawaida na ya moja kwa moja katika muktadha huu wa simulizi.
- source_word: γεύσασθαι
  choice: kula
  rationale: Ingawa kimsingi linaweza kumaanisha “kuonja,” hapa linatumika kwa maana ya kula chakula.
- source_word: παρασκευαζόντων
  choice: walipokuwa wakiandaa chakula
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati huohuo; “chakula” ni kitu kinachoeleweka kutokana na muktadha.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: ikamjia
  rationale: Usemi huu unaonyesha mwanzo wa hali iliyompata Petro; “ikamjia” ni wa asili na wenye kueleweka katika Kiswahili.
- source_word: ἔκστασις
  choice: hali ya maono
  rationale: Katika muktadha huu neno linaashiria hali isiyo ya kawaida inayohusiana na ufunuo wa maono, si mshangao tu. “Hali ya maono” ni ya kawaida zaidi kuliko istilahi ngumu au yenye maana za kimadhehebu.
theological_decisions:
- issue: Asili ya hali ya Petro inayotajwa kwa ἔκστασις
  choice: hali ya maono
  alternative: hali ya kuzimia; mshangao mkubwa
  rationale: Muktadha unaofuata mara moja unaeleza ono la ufunuo. Tafsiri hii huonyesha kazi ya hali hiyo katika simulizi bila kufafanua kwa uhakika namna yake ya kisaikolojia au kuingiza istilahi za baadaye za kifumbo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa simulizi umewekwa kwa vitenzi vinavyofuatana kwa urahisi. “Hali ya maono” huepuka neno la kigeni “ekstasi” na pia haibani maana kuwa kupoteza fahamu kabisa.
