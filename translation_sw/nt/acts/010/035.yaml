  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: sw
  text: bali katika kila taifa, mtu anayemcha na kutenda yaliyo ya haki anakubalika mbele zake[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kutenda haki” / “na kuzoea kutenda yaliyo ya haki.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki δικαιοσύνην, kwa kawaida “haki” au “uadilifu”; katika baadhi ya miktadha neno hilo linaweza pia kumaanisha haki katika mahusiano ya kijamii au utoaji wa hukumu.
    reason: lexical_alternative
  - marker: c
    text: Au “anapokelewa na yeye.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: bali
  rationale: Huonyesha utofauti na kauli iliyotangulia kwamba Mungu hana upendeleo; “bali” ni kiunganishi cha kawaida na chenye hadhi katika muktadha huu.
- source_word: ἐν παντὶ ἔθνει
  choice: katika kila taifa
  rationale: Huhifadhi muundo wa mahali na maana pana ya ἔθνος bila kuifanya ihusu mataifa ya kisiasa ya kisasa pekee.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: mtu anayemcha
  rationale: Huwakilisha kirai cha kisifa chenye maana ya nomino bila kuweka kikomo cha jinsia; “kumcha” huhifadhi maana ya hofu yenye heshima kwa Mungu.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: na kutenda yaliyo ya haki
  rationale: Ni Kiswahili cha asili kinachoonyesha mwenendo wa vitendo na kuhifadhi maana ya maadili ya δικαιοσύνην.
- source_word: δικαιοσύνην
  choice: yaliyo ya haki
  rationale: Katika muunganiko huu wa kitenzi, “kutenda yaliyo ya haki” ni ya kawaida kuliko “kutenda haki,” ambako kunaweza kueleweka hasa kama kutekeleza haki ya kijamii au kutoa hukumu.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: anakubalika kwake
  rationale: Huhifadhi muundo wa kivumishi cha predikati na mvutano wa maandiko bila kuongeza wazo la kustahili wokovu.
theological_decisions:
- issue: Ikiwa mstari unafundisha wokovu kwa matendo au unaeleza mtu ambaye Mungu humpokea bila upendeleo wa kitaifa
  choice: Kauli imeachwa iseme kwamba katika kila taifa mtu anayemcha Mungu na kutenda yaliyo ya haki anakubalika kwake.
  alternative: “Mungu humwokoa kwa sababu ya matendo yake” au “matendo yake yanathibitisha imani iokoayo.”
  rationale: Maelezo hayo mbadala yangeamua mjadala wa kitheolojia ambao mstari huu wenyewe hauufafanui; tafsiri huhifadhi uhusiano uliotajwa na pia muktadha wa kutokuwa na upendeleo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtu anayemcha” ni jumuishi kijinsia, na “yaliyo ya haki” ni wazi kwa msomaji wa kawaida huku neno “haki” likibaki katika tanbihi.
