id: ACT.10.48
reference: Acts 10:48
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: sw
  text: Kwa hiyo, Petro akaamuru wabatizwe katika jina la Yesu Masihi[a]. Kisha wakamwomba akae kwa siku kadhaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa namna iliyozoeleka zaidi, “Yesu Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: akaamuru
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka; ‘akaamuru’ kinahifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Kwa hiyo
  rationale: Hapa δέ kinaendeleza simulizi kwa mtiririko unaotokana na matukio yaliyotangulia, si kuonyesha upinzani mkali.
- source_word: αὐτοὺς
  choice: wa-
  rationale: Kiwakilishi cha wingi kimewakilishwa kiasili katika kiambishi cha yambwa cha ‘wabatizwe’; ‘Petro’ ametajwa wazi kama kiima kutokana na muktadha wa karibu ili kuepuka utata wa Kiswahili.
- source_word: ἐν τῷ ὀνόματι
  choice: katika jina
  rationale: Hifadhi nahau ya chanzo bila kuibana iwe na maana moja tu kama ‘kwa mamlaka ya’; inaweza kuhusisha mamlaka, uhusiano na ungamo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa linafanya kazi kama cheo cha Yesu; ‘Masihi’ hutafsiri maana ya cheo hicho badala ya kukifanya kionekane kama jina la ukoo.
- source_word: βαπτισθῆναι
  choice: wabatizwe
  rationale: Hifadhi hali ya kutendwa ya infinitivu na neno la kawaida la kibiblia bila kuamua kimadhehebu namna mahususi ya ubatizo.
- source_word: τότε
  choice: Kisha
  rationale: Huonyesha tukio linalofuata katika mfuatano wa simulizi kwa Kiswahili cha asili.
- source_word: ἠρώτησαν
  choice: wakamwomba
  rationale: Katika muktadha huu ἐρωτάω humaanisha kutoa ombi; ‘wakamwomba’ ni ya kawaida na haiingizi msisitizo usiokuwapo.
- source_word: ἐπιμεῖναι
  choice: akae
  rationale: Hapa kitenzi kinamaanisha kuendelea kukaa mahali hapo kwa muda; ‘akae’ ni cha asili kuliko ‘abaki’ bila kupoteza maana.
- source_word: ἡμέρας τινάς
  choice: kwa siku kadhaa
  rationale: Hifadhi muda usioainishwa; ‘kadhaa’ haudai idadi kamili.
theological_decisions:
- issue: Uwasilishaji wa Χριστοῦ katika kauli ya ubatizo
  choice: Masihi
  alternative: Kristo
  rationale: Neno hilo linaeleweka kama cheo cha Yesu katika kauli hii. ‘Masihi’ linaonyesha maana ya cheo, huku umbo la jadi ‘Kristo’ likihifadhiwa katika tanbihi.
- issue: Maana pana ya ἐν τῷ ὀνόματι
  choice: katika jina
  alternative: kwa mamlaka ya
  rationale: Tafsiri ya moja kwa moja huhifadhi uwezekano wa maana zinazohusiana na mamlaka, utii, uhusiano au kuliitia jina, badala ya kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa kisimulizi umetolewa kwa vitenzi vya mfululizo. Jina ‘Petro’ limewekwa wazi kutokana na muktadha wa mstari uliotangulia, kwa kuwa kiwakilishi cha Kigiriki pekee kingeweza kusikika bila rejeo wazi katika mstari huu uliosimama peke yake.
