  text: Palikuwa na mtu mmoja huko Kaisaria aliyeitwa Kornelio[a], mkuu wa askari mia wa kikosi kilichoitwa Kikosi cha Kiitalia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu fulani huko Kaisaria.” Kigiriki kinatumia usemi usio bainifu kumtambulisha mhusika mpya.
