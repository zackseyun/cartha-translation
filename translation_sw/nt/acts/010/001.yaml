lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Palikuwa na mtu mmoja
  rationale: Kifungu hiki kinamtambulisha mhusika mpya kwa namna isiyo bainifu. ‘Palikuwa na mtu mmoja’ ni Kiswahili cha kawaida na huhifadhi kazi ya τις; δέ ni kiunganishi hafifu cha kisimulizi, ambacho hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: ἐν Καισαρείᾳ
  choice: huko Kaisaria
  rationale: ‘Huko’ huonyesha mahali kwa njia ya kawaida katika utangulizi wa kisimulizi, na ‘Kaisaria’ ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: ὀνόματι Κορνήλιος
  choice: aliyeitwa Kornelio
  rationale: Hii ni tafsiri ya kawaida ya nahau inayomaanisha kwamba jina lake lilikuwa Kornelio.
- source_word: ἑκατοντάρχης
  choice: mkuu wa askari mia
  rationale: Tafsiri hii inaeleza cheo cha kijeshi cha Kirumi kwa maneno yanayoeleweka kwa msomaji wa kawaida bila kutegemea istilahi ya mkopo.
- source_word: ἐκ σπείρης
  choice: katika kikosi
  rationale: ἐκ hapa huonyesha kikosi ambacho afisa huyo alihusishwa nacho. ‘Katika kikosi’ ni ya asili katika Kiswahili na σπεῖρα ni kikosi cha jeshi la Kirumi.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: kilichoitwa Kikosi cha Italia
  rationale: Huhifadhi wazo la ‘kilichoitwa’ na kufanya wazi kwamba kivumishi ‘Italia’ kinataja kikosi hicho.
