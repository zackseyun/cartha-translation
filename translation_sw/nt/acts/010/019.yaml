  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: sw
  text: Petro alipokuwa akiyatafakari maono yale, Roho akamwambia, “Tazama, wanaume wanakutafuta.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διενθυμουμένου
  choice: alipokuwa akiyatafakari
  rationale: Muundo huu unaonyesha tafakari ya ndani iliyoendelea wakati Roho aliposema, bila kuongeza kwa lazima neno ‘bado,’ ambalo halijaandikwa wazi katika Kigiriki.
- source_word: περὶ τοῦ ὁράματος
  choice: maono yale
  rationale: ‘Maono yale’ hurejelea kwa kawaida maono yaliyotangulia katika simulizi; kitenzi ‘kutafakari’ kinaweza kuchukua yambwa moja kwa moja katika Kiswahili bila kulazimisha ‘kuhusu.’
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Herufi kubwa inaonyesha kwamba anayezungumziwa ni Roho wa Mungu katika muktadha huu, huku tafsiri ikiwa karibu na Kigiriki ambacho hakina neno ἅγιον (‘Mtakatifu’) hapa.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya tendo la kusema kwake Petro, na inaendeleza mtiririko wa simulizi.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni kiashiria cha kuvuta uangalifu chenye hadhi na kinachoeleweka katika Kiswahili cha sasa.
- source_word: ἄνδρες
  choice: wanaume
  rationale: Neno la Kigiriki linataja watu wazima wa kiume, hivyo ‘wanaume’ linahifadhi rejeo hilo badala ya kulifanya kuwa la jumla kwa kutumia ‘watu.’
- source_word: ζητοῦντές σε
  choice: wanakutafuta
  rationale: ‘Kukutafuta’ ni usemi wa asili wa Kiswahili unaowasilisha maana ya watu wanaojaribu kumpata Petro.
theological_decisions:
- issue: Rejeo la τὸ πνεῦμα
  choice: Roho, yaani Roho wa Mungu anayesema na Petro
  alternative: roho isiyotambulishwa wazi au msukumo wa kiroho
  rationale: Katika muktadha wa Matendo 10, Roho ndiye mwongozaji wa kimungu wa Petro. ‘Roho’ huhifadhi dai hilo la simulizi bila kuongeza ‘Mtakatifu,’ neno ambalo halipo katika mstari huu wa Kigiriki.
- issue: Jinsi ya kutafsiri jinsia katika ἄνδρες
  choice: wanaume
  alternative: watu
  rationale: ἄνδρες lina maana mahususi ya watu wa kiume hapa; kwa hiyo tafsiri haifuti taarifa hiyo ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya kawaida na yenye hadhi. ‘Akiyatafakari’ huhifadhi uzito wa fikra endelevu; ‘Tazama’ huhifadhi nguvu ya Ἰδού bila kutumia usemi wa kizamani.
