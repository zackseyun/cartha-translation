  source_fidelity: 'The draft accurately conveys the rhetorical question, the prevention of baptism, the recipients'' prior reception of the Holy Spirit, and the comparison with Peter''s group. However, the Greek retains the relative description of the people within the question; rendering it as a separate sentence with “Wao” weakens that syntactic connection. “Maji” also takes plural object agreement in standard usage: “kuyazuia maji.”'
  naturalness: “Kuna mtu yeyote anayeweza...” is a natural Swahili rhetorical-question form. Keeping “ambao wamepokea...” in the same sentence is clear and idiomatic, while making the evidential connection explicit without introducing a doctrinal conclusion.
  terminology: “Roho Mtakatifu,” “ubatizo/batizwa,” and “watu hawa” are appropriate standard East African Swahili terms. “Watu hawa” properly avoids adding a male-only restriction.
