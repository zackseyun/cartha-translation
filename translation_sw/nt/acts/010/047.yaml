  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: sw
  text: “Je, kuna mtu yeyote anayeweza kuyazuia maji ili watu hawa, ambao wamepokea Roho Mtakatifu kama sisi pia, wasibatizwe?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuyanyima maji ya ubatizo” au “kuzuia watu hawa wasibatizwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: Je, kuna mtu anayeweza ...?
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukataa; muundo huu ni wa kawaida katika Kiswahili na huhifadhi nguvu ya swali.
- source_word: τὸ ὕδωρ
  choice: maji
  rationale: Katika muktadha ni maji yaliyokusudiwa kwa ubatizo. Kiswahili hakina kibainishi bainifu kinacholingana moja kwa moja na neno la Kigiriki.
- source_word: δύναται κωλῦσαί τις
  choice: kuna mtu anayeweza kuzuia
  rationale: Huhifadhi wazo la mtu yeyote kuwa na uwezo wa kukataza au kuzuia tendo hilo bila kubadili swali kuwa kauli.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: ili watu hawa wasibatizwe
  rationale: Muundo wa kutendwa unahifadhi kwamba watu hawa ndio watakaopokea ubatizo, na kishazi cha kusudi/matokeo kinaonyesha jambo linalozuiwa.
- source_word: οἵτινες
  choice: Wao
  rationale: Kigiriki kinawatambulisha watu hao kwa msingi wa kupokea kwao Roho; sentensi mpya yenye 'Wao' huonyesha kwa kawaida sababu ya swali la Petro.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo neno la kawaida, la heshima, na linaloeleweka katika Kiswahili cha kisasa.
- source_word: ἔλαβον
  choice: wamepokea
  rationale: Wakati timilifu wa Kiswahili unaonyesha tukio lililokamilika ambalo matokeo yake yana umuhimu katika hoja ya sasa.
- source_word: ὡς καὶ ἡμεῖς
  choice: kama sisi pia
  rationale: Huhifadhi ulinganisho wa wazi kati ya watu hawa na Petro pamoja na waamini wenzake.
theological_decisions:
- issue: Uhusiano kati ya kupokea Roho Mtakatifu na ubatizo wa maji
  choice: Maandishi yanaonyesha kwamba watu hawa tayari wamepokea Roho Mtakatifu, na jambo hilo ndilo msingi wa swali la Petro kwamba ubatizo wao usizuiwe.
  alternative: Tafsiri inayofifisha kwamba kupokea Roho kulitokea kabla ya ubatizo wa maji katika simulizi hili.
  rationale: Mpangilio na hoja ya Kigiriki ni wazi katika simulizi, lakini tafsiri haiongezi hitimisho la kimadhehebu kuhusu uhusiano wa kawaida kati ya Roho na ubatizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limehifadhiwa bila kirai-tagi kisicho cha kawaida katika Kiswahili. 'Watu hawa' haibani kundi hilo kuwa wanaume pekee.
