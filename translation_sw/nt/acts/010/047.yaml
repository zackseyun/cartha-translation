  - severity: low
    issue: Object agreement with “maji” is missing.
    rationale: Since “maji” is conventionally plural in Swahili agreement, “kuyazuia maji” is the standard form rather than “kuzuia maji.”
  - severity: low
    issue: The existing alternative footnote is not a close lexical alternative to the wording in the verse.
    rationale: It introduces a second coordinated prevention (“na kuwazuia...”) rather than simply explaining the possible senses of κωλύω with “maji.”
