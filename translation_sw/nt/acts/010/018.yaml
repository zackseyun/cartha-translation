  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: sw
  text: Wakapaza sauti, wakauliza ikiwa Simoni, aitwaye Petro, alikuwa amefikia hapo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akikaa hapo” au “alikuwa amepokelewa hapo.” Kitenzi cha Kigiriki kina maana ya kukaa mahali kama mgeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: Wakaita kwa sauti
  rationale: Kauli hii inaonyesha kitendo kilichotangulia kuuliza na inadokeza kwamba waliwaita waliokuwa ndani ya nyumba kwa sauti inayosikika, bila kuongeza wazo la kupiga kelele.
- source_word: ἐπυνθάνοντο
  choice: wakauliza
  rationale: Ni tafsiri ya kawaida na ya sasa ya kitendo cha kutaka habari; muktadha wa simulizi unatosha kuonyesha kwamba walikuwa wakifanya uchunguzi.
- source_word: εἰ
  choice: kama
  rationale: Hapa neno hili linaanzisha swali lisilo la moja kwa moja. “Kama” ni ya kawaida na wazi katika Kiswahili cha Afrika Mashariki.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Simoni, aitwaye Petro
  rationale: Muundo huu unahifadhi majina yote mawili na maana ya kwamba Simoni alijulikana kwa jina Petro, huku ukibaki wa asili katika Kiswahili.
- source_word: ἐνθάδε
  choice: hapo
  rationale: Kwa kuwa waulizaji walikuwa nje wakielekeza kwenye nyumba hiyo, “hapo” ni ya kawaida zaidi katika Kiswahili kuliko “hapa,” bila kubadili mahali panaporejelewa.
- source_word: ξενίζεται
  choice: alikuwa anakaa hapo kama mgeni
  rationale: Kitenzi hiki kina maana ya kukaa mahali kwa kupokelewa kama mgeni. Tafsiri hii inaweka wazi hali ya ukarimu iliyomo katika neno la Kigiriki na pia inafaa katika swali lililoripotiwa baada ya kitenzi cha wakati uliopita.
