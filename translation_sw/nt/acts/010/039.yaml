  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: sw
  text: Nasi ni mashahidi wa yote aliyoyafanya katika nchi ya Wayahudi na Yerusalemu. Ambaye pia walimuua kwa kumtundika juu ya mti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya mbao”; kwa kutafsiri maana katika muktadha, “juu ya msalaba.” Kigiriki kinasema “mti,” huenda kikirejelea Kumbukumbu la Torati 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: mashahidi
  rationale: Ni neno la kawaida na lenye hadhi kwa watu wanaotoa ushuhuda kuhusu mambo waliyoona.
- source_word: πάντων ὧν ἐποίησεν
  choice: wa yote aliyoyafanya
  rationale: Linahifadhi maana pana ya πάντων na ni Kiswahili cha kawaida.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: katika nchi ya Wayahudi
  rationale: χώρα inaweza kumaanisha nchi, eneo, au jimbo; 'nchi ya Wayahudi' huhifadhi usemi wa Kigiriki bila kuubana kuwa jimbo rasmi la Yudea.
- source_word: καὶ Ἰερουσαλήμ
  choice: na Yerusalemu
  rationale: Kihusishi 'katika' kinaeleweka kuwa kinatawala pia 'Yerusalemu,' kama katika Kigiriki; kukiacha bila kurudiwa ni cha asili katika Kiswahili.
- source_word: ἀνεῖλαν
  choice: walimuua
  rationale: Hutoa moja kwa moja maana ya kuondoa uhai katika muktadha huu, kwa lugha ya sasa na yenye kueleweka.
- source_word: κρεμάσαντες
  choice: kwa kumtundika
  rationale: Muundo wa 'kwa' unaonyesha njia ambayo tendo la kumuua lilitekelezwa, kulingana na uhusiano wa kishirikishi na kitenzi kikuu.
- source_word: ἐπὶ ξύλου
  choice: juu ya mti
  rationale: ξύλον hapa ni 'mti' au 'kuni/kipande cha mbao'; 'mti' huhifadhi uchaguzi wa neno la chanzo na mwangwi unaowezekana wa Kumbukumbu la Torati 21:23 bila kulitafsiri moja kwa moja kuwa 'msalaba.'
theological_decisions:
- issue: Kutafsiri ξύλου katika muktadha wa kusulubiwa
  choice: juu ya mti
  alternative: juu ya msalaba; juu ya mbao
  rationale: Chanzo kinatumia ξύλον, si σταυρός. 'Mti' huhifadhi taswira na mwangwi unaowezekana wa Kumbukumbu la Torati 21:23, huku muktadha ukiruhusu msomaji kuelewa kuwa inahusu kusulubiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. 'Nasi' huunganisha mstari na muktadha uliotangulia; 'Pia' huwakilisha καὶ kabla ya ἀνεῖλαν. Tanbihi imewekwa baada ya 'mti,' neno linalohusika moja kwa moja.
