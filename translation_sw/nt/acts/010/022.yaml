language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: sw
  text: Wakasema, “Kornelio, jemadari wa askari mia,[a] ni mtu mwadilifu na anayemcha Mungu, anayesifiwa na taifa lote la Wayahudi.[b] Alipokea maelekezo ya kimungu kutoka kwa malaika mtakatifu[c] ya kukuitisha uje nyumbani kwake, ili asikie maneno kutoka kwako.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, afisa wa jeshi la Roma aliyekuwa akiongoza kikosi cha takriban askari mia.
    reason: historical_clarification
  - marker: b
    text: Kwa neno moja moja, “na taifa lote la Wayahudi.” Hapa “taifa” humaanisha jamii ya watu, si lazima taifa-dola la kisasa.
    reason: lexical_clarification
  - marker: c
    text: Au “alipokea ujumbe wa kimungu kutoka kwa malaika mtakatifu.” Kitenzi cha Kigiriki huonyesha kupokea mawasiliano yenye mamlaka ya kimungu.
    reason: lexical_alternative
  - marker: d
    text: Kwa neno moja moja, “ili asikie maneno kutoka kwako.”
    reason: literal_rendering
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: jemadari wa askari mia
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa afisa wa jeshi la Roma aliyeongoza kikosi cha takriban askari mia; pia inaeleweka kwa msomaji wa kawaida.
- source_word: ἀνὴρ δίκαιος
  choice: mtu mwadilifu
  rationale: ‘Mwadilifu’ huhifadhi maana ya kimaadili na kidini ya δίκαιος bila kuingiza hitimisho la kidhehebu kuhusu hali yake ya wokovu.
- source_word: φοβούμενος τὸν θεόν
  choice: anayemcha Mungu
  rationale: Huhifadhi muundo wa kitenzi na nahau ya kibiblia ya kumheshimu na kumtii Mungu.
- source_word: μαρτυρούμενος
  choice: anashuhudiwa mema
  rationale: Huonyesha ushuhuda mzuri unaotolewa na wengine kuhusu Kornelio, badala ya sifa anazojipa mwenyewe.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: na Wayahudi wote
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kundi lote la watu linalokusudiwa na ἔθνος bila kudokeza taifa-dola la kisasa.
- source_word: ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου
  choice: alipokea agizo kutoka kwa malaika mtakatifu
  rationale: Huwasilisha mawasiliano yenye mamlaka kutoka ulimwengu wa Mungu na pia huhifadhi sifa ya malaika kuwa mtakatifu.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: akuitishe uende nyumbani kwake
  rationale: Hutoa maana ya kutuma watu wamwite Petro aje mahali alipo Kornelio; ‘nyumbani’ ni ya asili zaidi katika muktadha huu kuliko ‘katika nyumba.’
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: ili asikie utakayomwambia
  rationale: Ni Kiswahili cha asili kinachohifadhi wazo la kusikia maneno yatokayo kwa Petro bila kuyafafanua mapema kuwa mahubiri au ujumbe rasmi.
theological_decisions:
- issue: Kueleza uchaji wa Kornelio bila kuamua hadhi yake ya kiagano au ya wokovu
  choice: mtu mwadilifu na anayemcha Mungu
  alternative: mtu mcha Mungu
  rationale: Maneno yote mawili ya Kigiriki—δίκαιος na φοβούμενος τὸν θεόν—yanawakilishwa, huku tafsiri ikiacha mvutano wa simulizi kuhusu hadhi yake bila kuongeza hitimisho la kiteolojia.
- issue: Asili ya agizo alilopokea Kornelio
  choice: alipokea agizo kutoka kwa malaika mtakatifu
  alternative: alionywa na malaika mtakatifu
  rationale: Katika muktadha huu kitenzi δηλώνει mawasiliano au maelekezo ya kimungu, si lazima onyo; ‘agizo’ linafaa kwa kile malaika alimwelekeza afanye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi ndefu ya Kigiriki imegawanywa kwa upole ili kuweka wazi sifa za Kornelio na agizo alilopokea, bila kubadili uhusiano wa mawazo.
