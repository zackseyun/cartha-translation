  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: sw
  text: Yeye ni mgeni kwa Simoni fulani[a], msindikaji wa ngozi, ambaye nyumba yake iko kando ya bahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anakaa kwa Simoni fulani, msindikaji wa ngozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζεται
  choice: ni mgeni nyumbani kwa
  rationale: Kitenzi hiki katika muktadha huu humaanisha kupokewa na kukaa kama mgeni kwa mtu; usemi huu ni wa kawaida katika Kiswahili na unahifadhi wazo la kukaribishwa.
- source_word: παρά τινι
  choice: kwa ... fulani
  rationale: παρά pamoja na dative huonyesha kukaa kwa mtu, huku τις ikidumisha kutotajwa kwa uhakika kwa mtu huyo.
- source_word: Σίμωνι
  choice: Simoni
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: βυρσεῖ
  choice: mtengenezaji wa ngozi
  rationale: Neno hili humtaja mtu anayesindika ngozi za wanyama; usemi huu unaeleweka kwa urahisi zaidi katika Kiswahili cha sasa kuliko istilahi adimu.
- source_word: ᾧ ἐστιν οἰκία
  choice: ambaye nyumba yake iko
  rationale: Muundo huu wa Kiswahili unaonyesha kwa ufupi na kwa kawaida kwamba nyumba inayotajwa ni ya Simoni.
- source_word: παρὰ θάλασσαν
  choice: kando ya bahari
  rationale: παρά pamoja na accusative hapa huonyesha ukaribu wa mahali; “kando ya bahari” hudumisha picha hiyo bila kuifanya iwe isiyo sahihi.
- source_word: οὗτος
  choice: Yeye
  rationale: Kiwakilishi hiki kinamrejelea Petro katika muktadha; “Yeye” ni rejeo la kawaida na la wazi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inadumisha maana ya Petro kupokewa kama mgeni, huku tanbihi ikitoa mbadala wa moja kwa moja zaidi. Alama ya tanbihi [a] imewekwa katika matini.
