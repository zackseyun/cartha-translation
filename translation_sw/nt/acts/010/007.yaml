  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: sw
  text: Malaika aliyekuwa akizungumza naye alipoondoka, Kornelio aliwaita watumishi wawili wa nyumbani mwake[a] na askari mmoja mcha Mungu kutoka miongoni mwa wale waliokuwa wakimhudumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumwa wawili wa nyumbani mwake.” Neno la Kigiriki οἰκέται humaanisha watu wa kaya waliokuwa katika huduma, na linaweza pia kumaanisha watumwa wa nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: alipoondoka
  rationale: Muundo huu wa wakati unaonyesha kuwa kuondoka kwa malaika kulitangulia kuitwa kwa watumishi; Kiswahili huonyesha uhusiano huo kwa kawaida kwa kiambishi -po-.
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: Malaika aliyekuwa akizungumza naye
  rationale: Katika muktadha huu ἄγγελος ni kiumbe wa mbinguni, na kauli ya uhusiano inahifadhi maana ya tendo lililokuwa likiendelea ya participio ya sasa.
- source_word: φωνήσας
  choice: Kornelio aliwaita
  rationale: Jina Kornelio limetajwa wazi ili kuepuka utata wa kiwakilishi katika Kiswahili. Kitenzi cha wakati uliopita kinatoa sentensi ya asili, ingawa participio hii inaelekea kuunganisha mstari huu na tendo la mstari unaofuata.
- source_word: δύο τῶν οἰκετῶν
  choice: watumishi wawili wa nyumbani mwake
  rationale: οἰκέτης humaanisha mtumishi au mtumwa wa kaya. Tafsiri hii inaweka mazingira ya nyumbani kwa lugha ya kawaida, huku tanbihi ikihifadhi uwezekano wa hadhi ya utumwa.
- source_word: στρατιώτην εὐσεβῆ
  choice: askari mmoja mcha Mungu
  rationale: εὐσεβής humweleza mtu mwenye uchaji na heshima ya kidini. 'Mcha Mungu' ni usemi wa kawaida wa Kiswahili unaowasilisha uchaji bila kumtambulisha lazima kwa kundi maalumu.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: kutoka miongoni mwa wale waliokuwa wakimhudumia
  rationale: Kauli hii inadumisha nguvu ya genitivi ya sehemu ('kutoka miongoni mwa') na wazo la watu waliokuwa wakimngojea au kumhudumia kwa kudumu.
theological_decisions:
- issue: Maana ya ἄγγελος katika muktadha
  choice: malaika
  alternative: mjumbe
  rationale: Muktadha wa Matendo 10 unaeleza maono ya Kornelio na mjumbe wa kimbingu; kwa hiyo maana ya 'malaika' inadaiwa na muktadha, si mapokeo ya tafsiri pekee.
- issue: Maana ya εὐσεβής kwa askari
  choice: mcha Mungu
  alternative: mwenye uchaji
  rationale: Chaguo hili linaeleza uchaji wake kwa lugha ya kawaida ya Kiswahili, bila kulifanya neno hili kuwa jina rasmi la kundi la 'wacha-Mungu' katika mazingira ya sinagogi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa kuwa wa kawaida katika Kiswahili, jina la Kornelio likitajwa ili kuondoa utata wa kiwakilishi. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
