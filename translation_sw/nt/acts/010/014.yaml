  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: sw
  text: Lakini Petro akasema, “La hasha, Bwana, kwa sababu sijawahi kula kitu chochote kilicho najisi na kichafu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: La hasha
  rationale: 'Kauli ya kawaida lakini yenye heshima inayowasilisha katazo kali la Petro: ‘kamwe’ au ‘isiwe hivyo.’'
- source_word: κύριε
  choice: Bwana
  rationale: Huhifadhi namna ya moja kwa moja ya kumwita anayesema naye, bila kuamua zaidi utambulisho wake katika mstari huu.
- source_word: κοινὸν
  choice: najisi
  rationale: Katika muktadha wa vyakula na usafi wa kidini, neno hili linamaanisha kitu kilichotiwa unajisi au kisichofaa kidini, si tu kitu cha kawaida.
- source_word: ἀκάθαρτον
  choice: kichafu
  rationale: Huwasilisha maana ya kitu kisicho safi, hasa kwa mujibu wa masharti ya kidini ya vyakula.
- source_word: καὶ
  choice: na
  rationale: Hufuata ushahidi wa maandishi wa SBLGNT wenye kiunganishi ‘na,’ bila kukibadili kuwa ‘au.’
theological_decisions:
- issue: Uhusiano kati ya κοινόν na ἀκάθαρτον
  choice: najisi na kichafu
  alternative: najisi au kichafu
  rationale: Matini iliyotolewa ina καὶ (‘na’), hivyo tafsiri inadumisha muunganiko huo na mvutano wake badala ya kuugeuza kuwa uchaguzi wa ‘au.’
- issue: Sababu ya kukataa kwa Petro
  choice: kwa sababu
  alternative: maana / kwani
  rationale: ὅτι hapa inaleta sababu ya jibu lake; ‘kwa sababu’ huiweka wazi kwa Kiswahili cha sasa bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘La hasha’ linabeba msisitizo wa Μηδαμῶς, huku ‘sijawahi kula’ likitoa usemi wa kawaida na wazi kwa msomaji wa leo.
