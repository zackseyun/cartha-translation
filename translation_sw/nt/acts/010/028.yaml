reference: Acts 10:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: sw
  text: Akawaambia, “Ninyi wenyewe mnajua kwamba hairuhusiwi kwa mwanamume Myahudi kushirikiana na mtu wa taifa lingine[a] au kumtembelea. Lakini Mungu amenionyesha nisimwite mtu yeyote kuwa wa kawaida[b] au najisi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mtu wa Mataifa.” Kigiriki ἀλλοφύλῳ humaanisha kihalisi mtu wa watu au taifa lingine.
    reason: lexical_alternative
  - marker: b
    text: “Wa kawaida” hutafsiri κοινόν, neno la hali ya kiibada lililo tofauti na “najisi” (ἀκάθαρτον).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: Akawaambia
  rationale: Kauli hii ya kawaida ya usimulizi inahifadhi kiunganishi hafifu τέ na kueleza kwa Kiswahili cha kawaida kwamba aliwaambia wao.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Ninyi wenyewe mnajua
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina msisitizo; “ninyi wenyewe” kinauhifadhi.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: kwamba hairuhusiwi
  rationale: ἀθέμιτος hueleza jambo lisiloruhusiwa kwa mujibu wa sheria au desturi inayotambuliwa. “Hairuhusiwi” huhifadhi upana huo bila kulifanya kuwa suala la adabu tu wala kudai kwa lazima kuwa ni marufuku ya sheria iliyoandikwa.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: kwa mwanamume Myahudi
  rationale: Huhifadhi umoja wa mfano na umbo la kiume lililo wazi katika Kigiriki.
- source_word: κολλᾶσθαι
  choice: kushirikiana na
  rationale: Kitenzi kina wazo la kujiunga au kushikamana na mtu; hapa kinahusu mahusiano ya kijamii, ambayo “kushirikiana na” huyawasilisha kwa kawaida.
- source_word: ἢ προσέρχεσθαι
  choice: au kumtembelea
  rationale: Katika muktadha huu, maana ya vitendo ni kwenda kwa mtu wa taifa lingine au nyumbani kwake; “kumtembelea” ni ya kawaida kuliko tafsiri ya moja kwa moja “kumkaribia.”
- source_word: ἀλλοφύλῳ
  choice: mtu wa taifa lingine
  rationale: ἀλλόφυλος kihalisi ni mtu wa watu au taifa jingine. Tafsiri hii inahifadhi maana hiyo bila kuingiza moja kwa moja neno la kiteolojia “Mtu wa Mataifa.”
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Lakini Mungu amenionyesha
  rationale: “Lakini” huonyesha tofauti kati ya desturi iliyojulikana na ufunuo wa Mungu. Wakati timilifu wa Kiswahili unaonyesha matokeo ya kudumu ya jambo ambalo Mungu alimwonyesha Petro.
- source_word: μηδένα ... ἄνθρωπον
  choice: mtu yeyote
  rationale: ἄνθρωπος hapa ni binadamu kwa ujumla, si mwanamume pekee.
- source_word: κοινὸν
  choice: wa kawaida
  rationale: Huhifadhi maana ya msingi ya κοινός na tofauti yake na ἀκάθαρτος katika lugha ya hali ya kiibada, ingawa ufafanuzi wa tanbihi unahitajika.
- source_word: ἢ ἀκάθαρτον
  choice: au asiye safi
  rationale: Hili ni neno la kawaida la hali ya kutokuwa safi kiibada, na linaendelea kutofautishwa na κοινός.
- source_word: λέγειν
  choice: nisimwite
  rationale: Muundo wa Kigiriki una maana ya kumwita au kumhesabu mtu kuwa wa kawaida au asiye safi; “nisimwite” ni wazi na wa asili katika Kiswahili.
theological_decisions:
- issue: Uhusiano kati ya mipaka ya Kiyahudi na ufunuo wa Mungu
  choice: Kauli ya Petro inaeleza jambo lililoonwa kuwa haliruhusiwi kwa mwanamume Myahudi, kisha inahifadhi marekebisho ya Mungu kwamba mtu yeyote asiitwe wa kawaida au asiye safi.
  alternative: Kutafsiri ἀθέμιτον kuwa jambo lisilofaa kijamii tu, au kufuta tofauti kati ya maneno mawili ya hali ya kiibada.
  rationale: Mstari unaripoti ufahamu wa Petro kuhusu kujitenga kwa Wayahudi, lakini unaelekeza wazi matokeo ya maono kwa watu. Tafsiri haipaswi kupunguza katazo hilo kuwa adabu tu, kulizidisha kuliko maandishi, wala kubadili hitimisho kuwa linahusu vyakula pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa katika mtindo wa usemi wa moja kwa moja unaoeleweka kwa wasomaji wa kawaida, huku msisitizo wa “ninyi wenyewe,” umbo la kiume la “mwanamume Myahudi,” na tofauti ya istilahi za hali ya kiibada vikihifadhiwa.
