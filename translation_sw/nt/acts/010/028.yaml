review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's emphatic address, the stated prohibition on a Jewish man associating with or visiting someone of another people, and God's instruction concerning no person. The use of "asiye safi" is understandable but is less precise and less idiomatic for the ritual-purity term ἀκάθαρτος than "najisi." The construction "kumwita mtu ... wa kawaida au asiye safi" is also less natural than explicitly marking the predicative sense of λέγειν with "kuwa."
  naturalness: The prose is generally clear Standard East African Swahili. "Mtu yeyote kuwa wa kawaida au najisi" is more natural and clearly expresses 'call/regard a person as common or unclean.' "Najisi" is the established concise term in religious and ritual contexts, whereas "asiye safi" can suggest merely physically unclean.
  terminology: Retain "wa kawaida" for κοινός, with a note explaining its ritual-status sense and distinction from "najisi" (ἀκάθαρτος). Use "najisi" for ἀκάθαρτος. "Mtu wa taifa lingine" is a sound, non-overinterpreting rendering of ἀλλοφύλῳ; the alternative "Mtu wa Mataifa" may remain in the note.
  issues:
  - severity: medium
    issue: '"asiye safi" for ἀκάθαρτον'
    rationale: Although intelligible, it is a broad descriptive phrase. "Najisi" more directly and naturally represents the established ritual-purity terminology while preserving the contrast with κοινός.
  - severity: low
    issue: Predicative force of λέγειν is not fully explicit
    rationale: In Swahili, "nisimwite mtu yeyote wa kawaida" can be read less smoothly than "nisimwite mtu yeyote kuwa wa kawaida." Adding "kuwa" clearly represents calling/regarding a person as bearing that status.
