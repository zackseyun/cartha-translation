  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: sw
  text: Naye Kornelio akamkazia macho, akaingiwa na hofu, akasema, “Kuna nini, Bwana?” Naye akamwambia, “Sala zako na misaada yako kwa wahitaji[a] zimepanda mbele za Mungu kuwa ukumbusho.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matendo yako ya huruma.” Neno la Kigiriki linamaanisha hasa kuwapa wahitaji msaada wa mali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: akamkazia macho
  rationale: Huwasilisha kutazama kwa makini na kwa kudumu kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: ἔμφοβος γενόμενος
  choice: akaingiwa na hofu
  rationale: Huhifadhi maana ya kuingia katika hali ya kuogopa bila kuzidisha kiwango cha hofu.
- source_word: Τί ἐστιν
  choice: Kuna nini?
  rationale: Ni swali la moja kwa moja na la kawaida katika Kiswahili, likiuliza jambo au kusudi la mjumbe.
- source_word: κύριε
  choice: Bwana
  rationale: Huhifadhi namna ya heshima ya κύριε katika mazingira ya kukutana na mjumbe wa mbinguni, bila kulazimisha kwamba hapa ni ungamo kamili kuhusu Yesu.
- source_word: προσευχαί
  choice: sala
  rationale: Ni neno la kawaida, linaloeleweka kwa mapana, kwa maombi yanayoelekezwa kwa Mungu.
- source_word: ἐλεημοσύναι
  choice: sadaka kwa wahitaji
  rationale: Hueleza wazi utoaji wa huruma kwa wenye mahitaji; neno 'sadaka' peke yake lingeweza kueleweka kwa upana mno.
- source_word: ἀνέβησαν
  choice: zimefika
  rationale: Kwa kuunganishwa na 'mbele za Mungu,' usemi huu ni wa asili katika Kiswahili na bado unaonyesha kuwa sala na matendo hayo yamewasilishwa katika uwepo wa Mungu, ingawa taswira halisi ya kupanda imepunguzwa kwa ajili ya ufasaha.
- source_word: εἰς μνημόσυνον
  choice: kuwa ukumbusho
  rationale: Huhifadhi lugha ya ukumbusho na mwangwi wake wa ibada bila kuongeza wazo mahsusi la dhabihu lisilotajwa wazi.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa Kiswahili unaofaa kwa maana ya kuwa katika uwepo au mbele ya macho ya Mungu.
theological_decisions:
- issue: Maana ya κύριε katika maneno ya Kornelio kwa kiumbe wa mbinguni
  choice: Bwana
  alternative: bwana / mheshimiwa
  rationale: “Bwana” hudumisha heshima na uzito wa mazingira, lakini simulizi halilazimishi neno hili lieleweke kama ungamo la moja kwa moja kwamba mjumbe huyo ni Yesu.
- issue: Maana ya matendo ya Kornelio kuwa μνημόσυνον mbele za Mungu
  choice: kuwa ukumbusho
  alternative: kuwa sadaka ya ukumbusho
  rationale: Tafsiri inahifadhi taswira ya kibiblia ya Mungu kuyakumbuka au kuyatambua maombi na matendo hayo, bila kuamua zaidi ya maandishi kuhusu nafasi yake katika wokovu au kuyaita moja kwa moja dhabihu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina “Kornelio” limetajwa ili kuepusha utata wa viwakilishi katika Kiswahili. Muundo wa masimulizi umetumia mfululizo wa vitenzi vya -ka- kwa ufasaha wa kawaida.
