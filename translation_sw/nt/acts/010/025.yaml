  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: sw
  text: Petro alipoingia, Kornelio akakutana naye, akaanguka miguuni pake, akamsujudia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwabudu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuabudu au kusujudu kwa heshima, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: Petro alipokuwa akiingia
  rationale: Muundo huu wa simulizi unaonyesha wakati au mazingira ya tukio. Kiswahili hiki ni cha kawaida na kinahifadhi uwezekano kwamba Kornelio alim迎a Petro wakati akiingia.
- source_word: συναντήσας αὐτῷ
  choice: Kornelio akam迎a
  rationale: Kitenzi hiki kinaonyesha Kornelio alikutana na Petro, yaelekea kwa kwenda kumpokea; “akam迎a” ni fupi na ya kawaida katika simulizi.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: akaanguka miguuni pake
  rationale: Huhifadhi tendo la kimwili la kujishusha mbele ya Petro.
- source_word: προσεκύνησεν
  choice: na kumsujudia
  rationale: “Kusujudia” huonyesha kuinama au kujitupa chini kwa heshima kubwa, huku muktadha na tanbihi vikihifadhi uwezekano wa maana ya kuabudu.
theological_decisions:
- issue: Maana ya προσκυνέω iliyoelekezwa kwa Petro
  choice: kumsujudia
  alternative: kumwabudu
  rationale: Neno la Kigiriki linaweza kumaanisha kutoa heshima kwa kusujudu au kuabudu. “Kumsujudia” huhifadhi tendo na uzito wake bila kuamua kimya-kimya kwamba Kornelio alimpa Petro ibada ya kimungu; tafsiri nyingine imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi, cha sasa na chenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili.
