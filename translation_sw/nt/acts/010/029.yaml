  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: sw
  text: 'Kwa hiyo nilikuja bila kupinga, nilipoitwa[a]. Basi nauliza: mliniita nije kwa sababu gani[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kusita.” Kigiriki kwa maana ya karibu zaidi ni “bila kupinga” au “bila kubisha.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa nini mliniita nije?” Kwa maana halisi zaidi, “mliniita nije kwa sababu gani?”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho kutokana na maelezo yaliyotangulia; nguvu ndogo ya καί imeingizwa katika mtiririko wa sentensi bila kuongeza neno lisilo la kawaida.
- source_word: ἀναντιρρήτως
  choice: bila kupinga
  rationale: Inahifadhi maana ya kutokataa, kutobisha, au kutokeza pingamizi, badala ya kuifanya iwe tu kutosita.
- source_word: ἦλθον
  choice: nilikuja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kuja.
- source_word: μεταπεμφθείς
  choice: nilipoitwa
  rationale: Muktadha unaonyesha kuitwa ili aje; muundo huu wa kutendwa ni wa asili katika Kiswahili na unaepuka tafsiri nzito ya 'nilipotumiwa watu'.
- source_word: πυνθάνομαι οὖν
  choice: Basi nauliza
  rationale: Inadumisha mpito wa οὖν na maana ya kuuliza au kutaka kujua.
- source_word: τίνι λόγῳ
  choice: kwa sababu gani
  rationale: Inahifadhi usemi wa Kigiriki unaouliza sababu, huku ikiwa Kiswahili cha kawaida.
- source_word: μετεπέμψασθέ με
  choice: mliniitia
  rationale: Kitenzi 'kuitia' humaanisha kumwita mtu aje na kwa ufupi kinaonyesha kuwa walitaka Petro aletwe kwao.
