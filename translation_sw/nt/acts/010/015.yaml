base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: sw
  text: 'Sauti ikamjia tena, mara ya pili: “Vitu ambavyo Mungu amevitakasa, wewe usiviite vya kawaida[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, usivihesabu kuwa najisi au visivyo safi; «vya kawaida» hapa hurejelea kategoria ya usafi wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: Sauti
  rationale: Nomino isiyo na kibainishi inawasilisha sauti iliyosema tena; Kiswahili hakihitaji kuitambulisha kwa cheo cha msemaji.
- source_word: πάλιν ἐκ δευτέρου
  choice: tena, mara ya pili
  rationale: Huhifadhi msisitizo wenye marudio katika Kigiriki huku ikibaki ya kawaida na wazi kwa Kiswahili.
- source_word: πρὸς αὐτόν
  choice: ikamjia
  rationale: Katika muktadha wa sauti inayomwelekea Petro, ‘ikamjia’ ni usemi wa asili wa Kiswahili unaoonyesha kwamba ujumbe ulielekezwa kwake.
- source_word: Ἃ
  choice: Vitu ambavyo
  rationale: Huhifadhi wingi usio na jinsi wa kiwakilishi cha Kigiriki na inafaa kwa vitu vilivyoonekana katika maono.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa Mungu mmoja; kibainishi cha Kigiriki hakihitaji kutafsiriwa kando.
- source_word: ἐκαθάρισεν
  choice: amevitakasa
  rationale: ‘Kutakasa’ huhifadhi maana ya kuondoa unajisi na mwangwi wa usafi wa kiibada, huku hali timilifu ikionyesha tendo la Mungu lenye matokeo yanayoendelea.
- source_word: σὺ
  choice: wewe
  rationale: Kiwakilishi cha wazi huhifadhi msisitizo wa Kigiriki unaomweka Petro kinyume na tendo la Mungu.
- source_word: μὴ κοίνου
  choice: usiviite najisi
  rationale: Katika Kiswahili cha sasa, tafsiri halisi kama ‘vya kawaida’ haitoi kwa uwazi kategoria ya kiibada ya κοινόω na inaweza kueleweka kuwa ‘ordinary.’ ‘Usiviite najisi’ huwasilisha hukumu ambayo Petro anakatazwa kutoa; tanbihi huhifadhi mbadala wa ‘vichafu’ na wazo la kuvitendea kuwa najisi.
theological_decisions:
- issue: Lugha ya usafi katika maono ya Petro
  choice: Kutumia ‘usiviite najisi’ katika maandiko makuu.
  alternative: ‘usiviite vichafu’ au ‘usivitendee kana kwamba ni najisi’
  rationale: Kigiriki kinatofautisha καθαρίζω na κοινόω, lakini ‘kawaida’ katika Kiswahili hakibebi kwa kawaida maana ya unajisi wa kiibada na kingepotosha. ‘Najisi’ huhifadhi mvutano wa usafi wa kiibada bila kuamua kimadhehebu upeo wa maono; mbadala zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Sauti ikamjia tena, mara ya pili’ huhifadhi marudio ya Kigiriki bila kuwa mzito; ‘amevitakasa’ na ‘najisi’ hudumisha muktadha wa usafi wa kiibada.
