base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: sw
  text: ujumbe[a] alioutuma kwa wana wa Israeli, akitangaza habari njema ya amani kupitia Yesu Masihi[b]—huyu[c] ndiye Bwana wa wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Yesu Kristo”; hapa Χριστός limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.'
    reason: alternative_reading
  - marker: c
    text: 'Au, “yeye ni Bwana wa wote.” Kigiriki kina kiwakilishi cha kuonyesha chenye mkazo: “huyu ndiye Bwana wa wote.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: ujumbe
  rationale: Katika muktadha huu neno hilo linamaanisha yaliyowasilishwa kutoka kwa Mungu, si neno moja tu; “ujumbe” ni Kiswahili cha kawaida na sahihi kwa maana hiyo.
- source_word: ὃν ἀπέστειλεν
  choice: aliowapelekea
  rationale: Kitenzi hiki kinadumisha wazo la Mungu kuutuma ujumbe kwa walengwa, huku kiunganishi cha kisarufi kikirejelea “ujumbe” kwa Kiswahili cha asili.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: wana wa Israeli
  rationale: Hii inadumisha kwa karibu msemo wa Kigiriki “wana wa Israeli,” ambao ni jina la kijumla la watu wa Israeli.
- source_word: εὐαγγελιζόμενος
  choice: akitangaza habari njema
  rationale: Kitenzi hiki si kutangaza tu bali kutangaza habari njema; tafsiri hii inahifadhi maana hiyo waziwazi.
- source_word: εἰρήνην
  choice: amani
  rationale: “Amani” ni kisawe cha moja kwa moja na kinaweza kubeba maana pana ya upatanisho na hali njema kama ilivyo katika matumizi ya kibiblia.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kupitia Yesu Masihi
  rationale: “Kupitia” linaonyesha Yesu kuwa njia au wakala wa kutangazwa kwa amani; Χριστός limetafsiriwa kama cheo “Masihi.”
- source_word: οὗτός
  choice: huyu
  rationale: Kiwakilishi cha kuonyesha kinahifadhi mkazo wa Kigiriki unaomwelekezea Yesu mwenyewe, badala ya kukipunguza kuwa “yeye” pekee.
- source_word: πάντων κύριος
  choice: Bwana wa wote
  rationale: Tafsiri hii inadumisha umiliki wa kisarufi na dai la mamlaka ya Bwana juu ya wote bila kulipanua zaidi ya maandishi.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός linafanya kazi kama cheo cha Yesu; “Masihi” linaonyesha maana ya cheo hicho badala ya kukinakili tu.
- issue: Tafsiri ya κύριος katika πάντων κύριος
  choice: Bwana
  alternative: Mtawala
  rationale: “Bwana” linahifadhi maana ya mamlaka pamoja na uzito wa kiteolojia wa tamko hilo, bila kuifanya maana iwe ya kisiasa tu.
- issue: Kuhifadhi mkazo wa οὗτός ἐστιν πάντων κύριος
  choice: huyu ndiye Bwana wa wote
  alternative: yeye ni Bwana wa wote
  rationale: “Huyu ndiye” linadumisha kiwakilishi cha kuonyesha na mkazo wa sentensi ya Kigiriki huku likibaki la kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umeachwa kama kishazi kinachoendelea kutoka muktadha wa mstari uliotangulia, kama ilivyo katika chanzo cha Kigiriki; “akitangaza habari njema” linaweka wazi nguvu ya εὐαγγελιζόμενος, na “huyu ndiye” linahifadhi mkazo wa οὗτός.
