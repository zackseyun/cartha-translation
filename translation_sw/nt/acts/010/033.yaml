base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: sw
  text: Mara moja nikatuma watu wakuiteni[a], nawe umefanya vema kuja. Sasa basi, sisi sote tupo hapa mbele ya Mungu ili kusikia yote uliyoagizwa na Bwana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “papo hapo” au “bila kukawia.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “Bwana.” Katika muktadha huenda neno hili linamrejelea Yesu, ingawa wengine hulielewa kwa ujumla kuwa linamrejelea Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: mara moja
  rationale: Usemi huu una maana ya kutenda papo hapo au bila kukawia. “Mara moja” ni Kiswahili cha kawaida na kinaonyesha jinsi Kornelio alivyotenda kwa haraka.
- source_word: οὖν
  choice: Kwa hiyo / Basi
  rationale: Neno hili linaunganisha kauli na yaliyotangulia na pia linaweza kuonyesha hatua inayofuata katika mazungumzo. “Kwa hiyo” linafaa mwanzoni, na “Basi” katika νῦν οὖν linaonyesha mpito wa kusudi la mkutano.
- source_word: ἔπεμψα πρὸς σέ
  choice: nikatuma watu wakuiteni
  rationale: Ingawa kwa muundo wa moja kwa moja ni “nilituma kwako,” katika muktadha Kornelio aliwatuma wajumbe wamwite Petro. Tafsiri hii inaeleza maana ya usemi huo kwa Kiswahili cha asili bila kubadili tukio.
- source_word: σύ τε καλῶς ἐποίησας παραγενόμενος
  choice: nawe umefanya vema kuja
  rationale: Huu ni usemi wa kumpongeza Petro kwa kuitikia na kufika. “Umefanya vema kuja” ni wa kawaida, wazi, na unafuata kwa karibu nguvu ya maneno ya Kigiriki.
- source_word: νῦν οὖν
  choice: Basi sasa
  rationale: Maneno haya yanaonyesha mpito kutoka simulizi ya mwaliko kwenda kusudi la wale waliokusanyika.
- source_word: πάντες ἡμεῖς
  choice: sisi sote
  rationale: Mpangilio huu unahifadhi msisitizo wa Kigiriki kwa kundi lote lililokusanyika.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Usemi huu unaonyesha kwamba waliokusanyika walijitambua kuwa katika uwepo wa Mungu; “mbele za Mungu” ni usemi wenye heshima na wa kawaida katika Kiswahili.
- source_word: πάρεσμεν
  choice: tupo hapa
  rationale: Kitenzi kina maana ya kuwapo. “Tupo hapa” ni cha asili katika Kiswahili na kinahifadhi maana ya uwepo wao mahali hapo.
- source_word: ἀκοῦσαι
  choice: ili kusikia
  rationale: Infinitivu inaonyesha kusudi la kukusanyika kwao. “Ili kusikia” linaweka wazi kusudi hilo.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: yote uliyoagizwa
  rationale: Tafsiri hii inahifadhi ujumla wa πάντα na mamlaka iliyomo katika προστάσσω, huku ikitumia muundo wa Kiswahili unaosomeka kwa urahisi.
- source_word: ὑπὸ τοῦ κυρίου
  choice: na Bwana
  rationale: Muundo huu unahifadhi “Bwana” kama lilivyo katika Kigiriki bila kuongeza jina la Yesu wala kubadili kuwa “Mungu.”
theological_decisions:
- issue: Anayerejelewa kwa neno τοῦ κυρίου (“Bwana”)
  choice: Bwana
  alternative: Mungu; au Bwana Yesu kwa ufafanuzi wa wazi
  rationale: Kigiriki kinasema tu “Bwana.” Katika muktadha huenda neno hilo linamrejelea Yesu, lakini linaweza kueleweka kwa ujumla kuwa linamrejelea Mungu. Kutaja “Bwana” bila kuongeza jina kunahifadhi utata na mvutano wa kiteolojia wa matini chanzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “nikatuma watu wakuiteni” unawasilisha kwa kawaida maana ya kimuktadha ya kuwatuma wajumbe wamwite Petro.
