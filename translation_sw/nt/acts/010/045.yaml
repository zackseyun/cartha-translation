  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: sw
  text: Nao waumini wa tohara[a] waliokuja pamoja na Petro walishangaa, kwa sababu kipawa cha Roho Mtakatifu kilikuwa kimemiminwa[c] hata juu ya watu wa Mataifa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waumini waliotahiriwa.” Kihalisi, “waumini kutoka katika tohara.”
    reason: lexical_alternative
  - marker: b
    text: 'Au, “pia juu ya watu wa Mataifa.” Neno la Kigiriki linaweza kuonyesha nyongeza, lakini hapa huenda linakazia mshangao: “hata juu ya watu wa Mataifa.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “kimemiminwa.” Wakati timilifu wa Kigiriki unakazia tendo lililokamilika ambalo matokeo yake yanaendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: walishangaa
  rationale: Kitenzi hiki hapa kinaonyesha mshangao mkubwa. “Walishangaa” ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha maana hiyo bila kutumia msemo uliotiwa chumvi.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: waumini waliokuwa wa tohara
  rationale: Kauli hii inahifadhi utambulisho wa waumini hawa kama watu wa kundi la tohara, yaani waumini wa Kiyahudi, badala ya kueleza tu kwamba walikuwa wametahiriwa.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: yaani wale waliokuja pamoja na Petro
  rationale: Hii inaonyesha kwamba wanaozungumziwa ni waumini wa tohara waliokuwa wameandamana na Petro. “Yaani” linafanya uhusiano wa kifungu hiki uwe wazi katika Kiswahili.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: hata juu ya watu wa mataifa
  rationale: Katika muktadha huu ἔθνη ni watu wasio Wayahudi. “Hata” linawasilisha nguvu ya nyongeza pamoja na mshangao uliopo katika καί.
- source_word: ἡ δωρεὰ
  choice: kipawa
  rationale: “Kipawa” huonyesha kitu kilichotolewa kama zawadi na ni neno la kawaida katika Kiswahili cha Kikristo bila kulazimisha ufafanuzi wa ziada.
- source_word: τοῦ ἁγίου πνεύματος
  choice: cha Roho Mtakatifu
  rationale: Hii ni tafsiri ya kawaida, wazi, na inayokubalika kwa mapana ya kirai husika.
- source_word: ἐκκέχυται
  choice: kilikuwa kimemiminwa
  rationale: Muundo huu wa Kiswahili unaonyesha tendo lililokuwa limekamilika kabla ya mshangao wa watazamaji, huku matokeo yake yakionekana wakati huo.
theological_decisions:
- issue: Maana ya ἔθνη katika muktadha wa kuwapokea watu wasio Wayahudi
  choice: watu wa mataifa
  alternative: Mataifa
  rationale: Muktadha wa Matendo 10 unatofautisha waumini wa Kiyahudi na watu wasio Wayahudi. “Watu wa mataifa” humaanisha watu hao kwa uwazi bila kufanya neno lenyewe “mataifa” lionekane kuwa maeneo au tawala.
- issue: Hali ya tendo katika ἐκκέχυται
  choice: kilikuwa kimemiminwa
  alternative: kimemiminwa
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililokamilika lenye matokeo yanayoendelea. Muundo uliochaguliwa unafaa mtiririko wa simulizi, huku tanbihi ikihifadhi uwezekano wa tafsiri inayosisitiza zaidi hali ya sasa.
- issue: Utambulisho wa οἱ ἐκ περιτομῆς πιστοὶ
  choice: waumini waliokuwa wa tohara
  alternative: waumini waliotahiriwa
  rationale: Tafsiri iliyochaguliwa inadumisha wazo la utambulisho wa kikundi linalobebwa na kirai “kutoka katika tohara,” bila kulifanya liwe maelezo ya hali ya kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa kwa mtiririko wa kawaida wa simulizi. “Watu wa mataifa” ni wazi zaidi kwa wasomaji wa kawaida kuliko kutumia “mataifa” peke yake kumaanisha watu wasio Wayahudi.
