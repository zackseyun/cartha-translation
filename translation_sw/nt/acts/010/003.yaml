  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: sw
  text: Aliona waziwazi[b] katika maono, karibu saa ya tisa ya mchana[a], malaika wa Mungu akiingia kwake na kumwambia, “Kornelio.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, karibu saa 3:00 alasiri kwa hesabu ya kisasa.
    reason: cultural_note
  - marker: b
    text: Au “kwa dhahiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: Aliona
  rationale: Kitenzi hiki cha wakati uliopita kinasimulia tukio moja kwa moja; “aliona” ni tafsiri ya kawaida na huhifadhi hali halisi ya ono.
- source_word: ἐν ὁράματι
  choice: katika maono
  rationale: ὅραμα humaanisha ono, hasa jambo linaloonekana kwa njia isiyo ya kawaida. “Katika maono” ni Kiswahili cha kawaida na hakifafanui kupita kiasi namna ono hilo lilivyotokea.
- source_word: φανερῶς
  choice: waziwazi
  rationale: Kielezi hiki kinasisitiza kuwa alichoona kilikuwa dhahiri na kisicho na utata. “Waziwazi” huhifadhi msisitizo huo na kinaweza pia kueleweka kuwa ono lenyewe lilikuwa dhahiri.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: yapata saa tisa alasiri
  rationale: ὡσεὶ na περὶ huonyesha ukadiriaji, unaowakilishwa na “yapata.” Saa ya tisa kwa hesabu ya wakati huo ilikuwa karibu saa tisa alasiri kwa matumizi ya kawaida ya Kiswahili cha Afrika Mashariki.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: malaika wa Mungu
  rationale: Katika muktadha wa maono, ἄγγελος ni kiumbe wa mbinguni aliyetumwa na Mungu; “malaika wa Mungu” ni tafsiri sahihi na ya kawaida.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: akiingia kwake
  rationale: Kirai hiki kinaonyesha kuingia mahali Kornelio alipokuwa. “Akiingia kwake” huhifadhi mwendo huo kwa Kiswahili cha asili.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: na kumwambia
  rationale: Muundo huu unaunganisha kitendo cha kusema na kile cha kuingia. “Na kumwambia” ni wa kawaida katika Kiswahili na huhifadhi uhusiano wa vitendo hivyo.
- source_word: Κορνήλιε
  choice: Kornelio
  rationale: Hii ni hali ya mwito ya jina Κορνήλιος; umbo la kawaida la jina hilo kwa Kiswahili ni “Kornelio.”
theological_decisions:
- issue: Maana ya ἄγγελος katika muktadha huu
  choice: malaika, yaani kiumbe wa mbinguni aliyetumwa na Mungu
  alternative: mjumbe wa kibinadamu
  rationale: Muktadha wa maono na kirai “wa Mungu” unaonyesha wazi kuwa anayezungumziwa ni malaika, si mjumbe wa kawaida wa kibinadamu. Tafsiri haiongezi maelezo ya kimafundisho yasiyosemwa na kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Saa tisa alasiri” hutoa wakati unaokusudiwa bila mkanganyiko wa mfumo wa kale wa kuhesabu saa; tanbihi inaeleza ulinganifu huo. Mpangilio wa alama za tanbihi umelinganishwa na maneno yanayofafanuliwa.
