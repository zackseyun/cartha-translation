lexical_decisions:
- source_word: εὐσεβὴς
  choice: mcha Mungu
  rationale: Neno hili linaeleza uchaji unaodhihirika katika maisha ya kidini. “Mcha Mungu” ni usemi wa kawaida, wenye heshima, na unaoeleweka katika Kiswahili.
- source_word: φοβούμενος τὸν θεὸν
  choice: mwenye kumhofu Mungu
  rationale: Huhifadhi muundo wa kitendo na maana ya heshima yenye uchaji kwa Mungu, bila kuifanya kuwa lebo ya kiufundi pekee.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: pamoja na watu wote wa nyumbani mwake
  rationale: οἶκος hapa ni jamaa na wengine walio katika kaya, si jengo la nyumba tu; tafsiri hii inaweka wazi kitengo hicho cha kijamii.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: Aliwapa ... misaada mingi
  rationale: Katika muktadha huu ἐλεημοσύνη huelekea kumaanisha utoaji kwa wahitaji. “Misaada mingi” ni ya asili katika Kiswahili cha sasa na huhifadhi wingi wa matendo au zawadi hizo.
- source_word: τῷ λαῷ
  choice: watu
  rationale: Dativo inaonyesha waliopokea au kunufaika na msaada. “Aliwapa watu” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: δεόμενος τοῦ θεοῦ
  choice: kumwomba Mungu
  rationale: δέομαι inaweza kumaanisha kusihi au kuomba; hapa “kumwomba Mungu” inafaa kwa muktadha wa ibada na uchaji.
- source_word: διὰ παντός
  choice: daima
  rationale: Usemi huu unaonyesha desturi ya kudumu au ya mara kwa mara, bila kulazimisha maana ya tendo lisilokatizwa hata kidogo.
theological_decisions:
- issue: Usemi wa kumhofu Mungu kuhusu Kornelio
  choice: mwenye kumhofu Mungu
  alternative: mwenye kumcha Mungu; mwabudu wa Mungu
  rationale: Tafsiri hii huhifadhi maana ya kawaida ya uchaji na pia inaacha wazi uwezekano wa usemi huo kuwa maelezo yaliyotambulika kwa Mmataifa aliyemwabudu Mungu wa Israeli, bila kuongeza hadhi ya kiufundi ambayo mstari wenyewe hauifafanui.
- issue: Uhusiano kati ya εὐσεβὴς na φοβούμενος τὸν θεὸν
  choice: mcha Mungu na mwenye kumhofu Mungu
  alternative: mtauwa na mwenye kumcha Mungu
  rationale: Ingawa kuna ukaribu wa maana katika Kiswahili, kurudia kwa namna hii huhifadhi sifa mbili zilizotajwa katika Kigiriki na uzito wa lugha ya kibiblia, badala ya kuziunganisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili kwa mtiririko wa asili wa Kiswahili huku mfululizo wa sifa za Kigiriki ukihifadhiwa. “Watu wa nyumbani” huepuka kuelewa οἶκος kama jengo tu.
