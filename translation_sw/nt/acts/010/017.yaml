  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: sw
  text: Petro alipokuwa akijiuliza kwa ndani maana ya maono aliyoyaona[a], tazama, wale wanaume waliotumwa na Kornelio, baada ya kuulizia nyumba ya Simoni, walikuwa wamesimama langoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maono aliyoyaona yangekuwa nini.” Kigiriki kinaweza kutafsiriwa kwa ukaribu zaidi kwa namna hii, lakini hapa huenda kinarejelea maana au umuhimu wa maono hayo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye njia ya kuingilia.” Neno la Kigiriki linaweza kumaanisha lango au eneo la kuingilia nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: alipokuwa bado
  rationale: Huanzisha tukio linaloendelea wakati jambo jingine linatokea; “bado” huonyesha kwamba hali ya Petro ya kutafakari ilikuwa ikiendelea bila kuingiza neno huru la “sasa.”
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: akitafakari kwa mshangao moyoni
  rationale: Huhifadhi hali ya ndani na mkanganyiko mkubwa unaoendelea. Kiswahili hiki ni cha kawaida na chenye hadhi kuliko tafsiri neno kwa neno kama “alikuwa amefadhaika ndani yake.”
- source_word: τί ἂν εἴη τὸ ὅραμα
  choice: maana ya maono ...
  rationale: Katika muktadha Petro anajaribu kufahamu umuhimu wa maono; tanbihi huhifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kigiriki, “maono ... yangekuwa nini.”
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi kiashiria cha kisimulizi kinachoelekeza umakini kwenye badiliko la ghafla la tukio.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: wale watu waliokuwa wametumwa na Kornelio
  rationale: Hutambulisha kundi husika na kuhifadhi hali tendwa ya kutumwa. “Watu” ni ya asili katika Kiswahili, ingawa muktadha na ἄνδρες vinaonyesha wanaume.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: baada ya kuuliza mahali ilipokuwa nyumba ya Simoni
  rationale: Kitenzi kishirikishi cha aoristi huonyesha kitendo kilichotangulia kusimama kwao langoni; usemi huu huwasilisha kwa kawaida kwamba waliulizia nyumba hiyo ili waipate.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: wakasimama langoni
  rationale: Huhifadhi wazo la kufika na kusimama kwenye lango au eneo la kuingilia; tanbihi inaonyesha upana wa maana ya πυλών.
