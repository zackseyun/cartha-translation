  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: sw
  text: Basi Petro akashuka kwenda kwa wale watu, akasema, “Tazameni, mimi ndiye mnayemtafuta. Mko hapa kwa sababu gani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: akashuka
  rationale: Kitenzi hiki kinaonyesha Petro akitoka sehemu ya juu na kwenda chini walikokuwa wageni; ‘akashuka’ ni tafsiri ya kawaida na sahihi katika simulizi.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ kinaendeleza simulizi badala ya kuonyesha upinzani mkali; ‘Basi’ kinaunganisha tukio hili kwa kawaida na yaliyotangulia.
- source_word: πρὸς τοὺς ἄνδρας
  choice: kwenda kwa wale watu
  rationale: πρός pamoja na hali ya kushutumiwa huonyesha mwendo kuelekea watu hao. ‘Wale watu’ ni ya kawaida na haiongezi sifa ambayo haipo katika muktadha.
- source_word: Ἰδοὺ
  choice: Tazameni
  rationale: Ni neno la kuvuta usikivu wa wasikilizaji wengi; wingi ‘Tazameni’ unalingana na wale watu waliozungumziwa.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: mimi ndiye mnayemtafuta
  rationale: Kauli hii inamtambulisha Petro kuwa mtu wanayemtafuta, kwa Kiswahili cha kawaida na chenye mkazo unaofaa katika ‘mimi ndiye’.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: Mko hapa kwa sababu gani?
  rationale: Tafsiri hii huhifadhi nomino αἰτία, ‘sababu,’ na hali ya sasa ya πάρεστε, ‘mko hapa,’ bila kuibadili kuwa kauli ya kuja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa simulizi ni wa kawaida, huku swali la mwisho likihifadhi wazi wazo la ‘sababu’ na hali ya kuwapo hapo.
