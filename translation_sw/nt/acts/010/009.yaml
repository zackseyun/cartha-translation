  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: sw
  text: Siku iliyofuata, wale watu walipokuwa safarini na kukaribia mji, Petro akapanda kwenye paa la nyumba ili kuomba, yapata saa sita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, karibu adhuhuri.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Siku iliyofuata
  rationale: Kirai hiki kinaonyesha wakati wa tukio katika siku iliyofuata; δέ hapa ni kiunganishi chepesi cha simulizi ambacho hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: wale watu walipokuwa safarini
  rationale: Muundo wa genitive absolute unaonyesha tendo linaloendelea wakati mmoja na tendo kuu. 'Wale watu' humrejesha msomaji kwa kawaida kwa wajumbe waliotajwa awali.
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: na kukaribia mji
  rationale: Huhifadhi tendo la pili linalotokea wakati huohuo na maana ya ἐγγίζω ya kuja karibu na mahali.
- source_word: ἀνέβη
  choice: alipanda juu
  rationale: Kitenzi hiki cha simulizi kinaeleza mwendo wa kwenda mahali palipo juu; Kiswahili hiki ni cha kawaida na wazi.
- source_word: ἐπὶ τὸ δῶμα
  choice: kwenye paa la nyumba
  rationale: δῶμα hapa ni paa tambarare la nyumba lililotumiwa kama sehemu inayofikika; 'paa la nyumba' huepuka kueleweka kama dari ya ndani.
- source_word: προσεύξασθαι
  choice: ili kuomba
  rationale: Infinitivu hii inaonyesha kusudi la Petro kupanda juu.
- source_word: περὶ ὥραν ἕκτην
  choice: yapata saa sita
  rationale: περί inaonyesha ukadiriaji, na 'yapata' huhifadhi maana hiyo. 'Saa sita' ni usemi wa kawaida wa Kiswahili unaolingana na adhuhuri, bila kuhitaji kubadili usemi kuwa hesabu ya saa ya Kiingereza.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Usemi 'saa sita' ni wa kawaida katika mfumo wa saa wa Kiswahili; tanbihi inafafanua kuwa ni karibu adhuhuri. Alama [a] imewekwa mara tu baada ya kirai cha wakati kinachofafanuliwa.
