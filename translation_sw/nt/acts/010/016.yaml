lexical_decisions:
- source_word: τοῦτο
  choice: Jambo hili
  rationale: Kiwakilishi hiki cha Kigiriki kinarejelea tukio la maono lililotangulia; “Jambo hili” ni Kiswahili cha kawaida na huonyesha rejeo hilo wazi.
- source_word: δὲ
  choice: —
  rationale: Hiki ni kiunganishi hafifu cha usimulizi; hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: ἐγένετο
  choice: lilitokea
  rationale: Hapa γίνομαι ina maana ya tukio kutendeka; “lilitokea” ni ya asili katika usimulizi wa Kiswahili.
- source_word: ἐπὶ τρίς
  choice: mara tatu
  rationale: Usemi huu unaonyesha kurudiwa kwa tukio mara tatu.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Huonyesha kwamba tendo lililofuata lilitokea bila kuchelewa.
- source_word: ἀνελήμφθη
  choice: kikachukuliwa juu
  rationale: Huhifadhi hali ya kutendwa na mwelekeo wa kupaa uliomo katika kitenzi cha Kigiriki.
- source_word: τὸ σκεῦος
  choice: kile chombo
  rationale: σκεῦος ni neno pana kwa chombo au kitu cha kubebea; “chombo” huhifadhi upana huo bila kukitambulisha moja kwa moja kuwa shuka.
- source_word: εἰς τὸν οὐρανόν
  choice: kwenda mbinguni
  rationale: Huwasilisha mwendo wa kuelekea juu na maana ya οὐρανός kama makao ya mbinguni katika muktadha wa maono.
theological_decisions:
- issue: Maana ya οὐρανός katika maono ya Petro
  choice: mbinguni
  alternative: angani
  rationale: οὐρανός inaweza kumaanisha anga au mbingu, lakini muktadha wa maono—kitu kushuka kutoka huko na kurudishwa huko—unaelekea kwenye makao ya mbinguni. Maana nyingine imehifadhiwa katika tanbihi.
