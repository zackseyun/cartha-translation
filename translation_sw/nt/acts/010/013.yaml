  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: sw
  text: 'Kisha sauti ikamjia: “Inuka, Petro; chinja[a] na ule.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “toa dhabihu.” Kitenzi kilichotafsiriwa “chinja” kinaweza pia kumaanisha “toa dhabihu,” lakini hapa huenda zaidi kinarejelea kuchinja mnyama kwa ajili ya chakula katika muktadha wa maono haya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ikamjia
  rationale: Pamoja na φωνή na πρὸς αὐτόν, kitenzi hiki kinaeleza kutokea kwa sauti iliyomfikia Petro. ‘Ikamjia’ ni ya kawaida katika simulizi la Kiswahili na hudumisha maana ya tukio.
- source_word: φωνὴ
  choice: sauti
  rationale: Katika muktadha huu wa ufunuo, neno hili linamaanisha sauti inayosema, si mlio tu.
- source_word: πρὸς αὐτόν
  choice: -mjia
  rationale: Kiambishi cha yambwa katika ‘ikamjia’ kinaonyesha kwamba sauti ilielekezwa kwake kama ujumbe.
- source_word: Ἀναστάς
  choice: Inuka
  rationale: Ingawa umbo la Kigiriki ni kishiriki, hapa lina nguvu ya amri inayotangulia amri zinazofuata. ‘Inuka’ ni amri ya asili na iliyo wazi kwa Kiswahili.
- source_word: Πέτρε
  choice: Petro
  rationale: Ni umbo la kuita la jina Πέτρος; ‘Petro’ ndilo umbo la kawaida la jina hilo katika Biblia za Kiswahili.
- source_word: θῦσον
  choice: chinja
  rationale: Katika maono kuhusu wanyama na kula, ‘chinja’ hueleza kuua mnyama ili awe chakula. Hata hivyo, kitenzi kinaweza pia kumaanisha kutoa dhabihu, jambo linalohifadhiwa katika tanbihi.
- source_word: φάγε
  choice: ule
  rationale: Ni amri ya moja kwa moja ya kula; ‘ule’ ni umbo la kawaida la amri katika Kiswahili.
- source_word: καὶ
  choice: Kisha / kiunganishi cha mfuatano
  rationale: καί ya kwanza inaendeleza mfuatano wa simulizi, kwa hiyo ‘Kisha’ ni ya asili. καί kati ya amri imewasilishwa kwa mfuatano wa vitenzi ‘chinja ule,’ ambao kwa Kiswahili unaonyesha wazi matendo yote mawili bila ulazima wa kurudia ‘na.’
theological_decisions:
- issue: Ikiwa θῦσον itafsiriwe kwa lugha ya dhabihu
  choice: ‘chinja’ katika matini kuu
  alternative: ‘toa dhabihu’
  rationale: Muktadha wa karibu ni amri ya kuandaa mnyama kwa ajili ya kula, si ibada ya dhabihu. ‘Chinja’ hudumisha maana hiyo bila kuingiza dhana ya kiibada, huku uwezekano wa maana ya dhabihu ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya Maandiko. Muundo ‘sauti ikamjia’ ni wa kisimulizi na unaeleweka kwa urahisi; ‘chinja’ ni mahususi kwa kuua mnyama kwa ajili ya chakula.
