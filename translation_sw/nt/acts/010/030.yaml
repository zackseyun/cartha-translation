  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: sw
  text: Kornelio akasema, “Siku nne zilizopita, wakati kama huu, nilikuwa nikisali nyumbani kwangu saa tisa[a]. Tazama, mwanamume mmoja aliyevaa mavazi yenye kung'aa alisimama mbele yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, karibu saa tisa alasiri.
    reason: Maelezo ya wakati katika utamaduni wa chanzo.
lexical_decisions:
- source_word: ἔφη
  choice: akasema
  rationale: Kauli ya wakati uliopita inayoanzisha maneno ya Kornelio imetafsiriwa kwa namna ya kawaida ya masimulizi ya Kiswahili.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Siku nne zilizopita, wakati kama huu
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida umbali wa siku nne pamoja na rejeo la saa ileile, bila kudokeza kwamba sala iliendelea kwa siku zote nne.
- source_word: ἤμην ... προσευχόμενος
  choice: nilikuwa nikisali
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati huo uliopita.
- source_word: τὴν ἐνάτην
  choice: saa tisa
  rationale: Usemi huu huhifadhi namna ya kutaja wakati katika mazingira ya chanzo na pia unaeleweka kwa kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: ἐν τῷ οἴκῳ μου
  choice: nyumbani kwangu
  rationale: Hii ni njia ya kawaida na iliyo wazi ya kueleza mahali ndani ya nyumba ya msemaji.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Neno hili linahifadhi msisitizo na hali ya ghafla ya tukio katika simulizi.
- source_word: ἀνὴρ
  choice: mtu mmoja
  rationale: Katika muktadha huu neno linamtaja kiumbe aliyeonekana katika umbo la mwanamume; 'mtu mmoja' ni usemi wa kawaida wa Kiswahili bila kuongeza utambulisho wake katika mstari huu.
- source_word: ἔστη ἐνώπιόν μου
  choice: akasimama mbele yangu
  rationale: Tafsiri hii inahifadhi kitendo halisi cha kusimama na mahali pake mbele ya Kornelio.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: mwenye mavazi yanayongʼaa
  rationale: Usemi huu unaonyesha wazi mavazi yenye mwangaza bila kutumia lugha nzito au kuongeza maana ya kiishara.
theological_decisions:
- issue: Namna ya kutafsiri τὴν ἐνάτην
  choice: saa tisa
  alternative: karibu saa tisa alasiri
  rationale: Matini kuu inahifadhi usemi wa saa wa chanzo; tanbihi inaeleza kwamba ni takriban saa tisa alasiri.
- issue: Utambulisho wa ἀνὴρ
  choice: mtu mmoja
  alternative: malaika
  rationale: Mstari huu unasema 'mtu/mwanamume' na unaeleza mwonekano wake; kutaja moja kwa moja 'malaika' kungeweka wazi jambo ambalo hapa limeachwa lielezwe na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa masimulizi umetumia viambishi vya mfululizo wa matendo, huku usemi wa Kornelio ukibaki wa kawaida na wazi.
