base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: sw
  text: Baada ya kuwaeleza kila kitu, aliwatuma kwenda Yafa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: Baada ya kuwaeleza
  rationale: Kauli ya kushiriki ya wakati uliopita inaonyesha tendo lililotangulia tendo kuu; ‘baada ya kuwaeleza’ ni Kiswahili cha kawaida na hudokeza kwamba Kornelio aliwafafanulia habari hizo kwa ukamilifu.
- source_word: ἅπαντα αὐτοῖς
  choice: kila kitu
  rationale: ἅπαντα humaanisha mambo yote kwa ujumla, na kiambishi ‘-wa-’ katika ‘kuwaeleza’ kinawakilisha αὐτοῖς kwa njia ya asili katika Kiswahili.
- source_word: ἀπέστειλεν αὐτούς
  choice: aliwatuma
  rationale: ‘Aliwatuma’ huwasilisha kwa uwazi tendo la kumtuma mtu, huku kiambishi ‘-wa-’ kikitafsiri αὐτούς.
- source_word: εἰς τὴν Ἰόππην
  choice: kwenda Yafa
  rationale: εἰς huonyesha mwendo kuelekea mahali palipokusudiwa; ‘kwenda Yafa’ ni usemi wa asili wa Kiswahili. ‘Yafa’ ni umbo la jina la mahali linalotumiwa kwa kawaida katika tafsiri za Kiswahili.
theological_decisions: []
