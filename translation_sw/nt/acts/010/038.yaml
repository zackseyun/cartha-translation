  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: sw
  text: 'Yesu wa Nazareti[c]: jinsi Mungu alivyomtia mafuta kwa Roho Mtakatifu na kwa nguvu[a]; naye akazunguka akitenda mema na kuwaponya wote waliokuwa wakidhulumiwa na Ibilisi, kwa sababu Mungu alikuwa pamoja naye.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Yesu aliyetoka Nazareti: jinsi Mungu alivyomtia mafuta kwa Roho Mtakatifu na kwa nguvu.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana Mungu alikuwa pamoja naye.”
    reason: lexical_alternative
  - marker: c
    text: 'Muundo wa Kigiriki unaweza pia kutafsiriwa: “Yesu aliyetoka Nazareti—jinsi Mungu alivyomtia mafuta kwa Roho Mtakatifu na kwa nguvu—ambaye alizunguka akitenda mema na kuwaponya wote waliokuwa wakidhulumiwa na Ibilisi, kwa sababu Mungu alikuwa pamoja naye.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Yesu wa Nazareti
  rationale: Kirai hiki kinamtambulisha Yesu kwa mahali alikotoka. ‘Yesu wa Nazareti’ ni Kiswahili cha kawaida na chenye hadhi; maana ya moja kwa moja zaidi, ‘Yesu aliyetoka Nazareti,’ imeonyeshwa katika tanbihi.
- source_word: ὡς
  choice: jinsi
  rationale: Hapa neno hili linaanzisha maelezo kuhusu Yesu—jinsi Mungu alivyomtia mafuta—badala ya kuonyesha ulinganisho.
- source_word: ἔχρισεν
  choice: alivyomtia mafuta
  rationale: ‘Kumtia mafuta’ huhifadhi taswira na mwangwi wa kimasiya wa χρίω bila kuingiza moja kwa moja jina ‘Masihi,’ ambalo halipo katika mstari huu.
- source_word: πνεύματι ἁγίῳ
  choice: kwa Roho Mtakatifu
  rationale: Kirai hiki kinamrejelea Roho Mtakatifu; ‘kwa’ linaonyesha njia au chombo cha kutiwa mafuta.
- source_word: καὶ δυνάμει
  choice: na kwa nguvu
  rationale: Kurudia ‘kwa’ kunadhihirisha maana ya chombo katika Kiswahili, huku ‘nguvu’ likibaki pana bila kuwekewa mipaka ya miujiza pekee.
- source_word: διῆλθεν
  choice: akazunguka
  rationale: Katika muktadha huu kitenzi kinaeleza huduma ya Yesu ya kwenda kutoka mahali hadi mahali; ‘akazunguka’ ni ya asili na wazi.
- source_word: εὐεργετῶν
  choice: akitenda mema
  rationale: Hii ni tafsiri fupi na ya kawaida ya tendo la kuwafaidi wengine kwa matendo mema.
- source_word: ἰώμενος
  choice: kuwaponya
  rationale: Kitenzi kinaeleza uponyaji moja kwa moja, na kiambishi cha yambwa kinawaunganisha na ‘wote.’
- source_word: πάντας τοὺς καταδυναστευομένους
  choice: wote waliokuwa wakidhulumiwa
  rationale: ‘Kudhulumiwa’ huwasilisha hali ya kuwa chini ya nguvu kandamizi bila kuibana kuwa ugonjwa wa mwili pekee.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: na Ibilisi
  rationale: Katika tungo tendwa ya Kiswahili, ‘na’ humtambulisha mtendaji; ‘Ibilisi’ ni jina la kawaida la kiumbe binafsi mwovu anayerejelewa hapa.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: kwa sababu Mungu alikuwa pamoja naye
  rationale: ‘Kwa sababu’ linaonyesha wazi kuwa uwepo wa Mungu ndio sababu inayotolewa kwa huduma yenye matokeo ya Yesu.
theological_decisions:
- issue: Uhusiano wa kutiwa mafuta kwa Yesu na utambulisho na utume wake
  choice: Kuhifadhi usemi ‘kumtia mafuta’ bila kuufafanua kuwa ‘kumweka kuwa Masihi.’
  alternative: Kusema ‘kumweka kuwa Masihi’ au kupunguza maana kuwa ‘kumpa uwezo’ tu.
  rationale: Mstari unasema Mungu alimtia Yesu mafuta kwa Roho Mtakatifu na nguvu. Usemi wa asili huhifadhi mwangwi wake wa kibiblia na wa kimasiya bila kuongeza ufafanuzi wa kimafundisho usiotajwa wazi.
- issue: Rejeo la πνεύματι ἁγίῳ
  choice: Kutafsiri kuwa Roho Mtakatifu binafsi.
  alternative: Kutafsiri kama ‘roho takatifu’ isiyo ya kibinafsi au kama nguvu ya kiroho tu.
  rationale: Katika Matendo, kirai hiki kwa kawaida humrejelea Roho Mtakatifu. Zaidi ya hayo, mstari unatofautisha Roho Mtakatifu na nguvu.
- issue: Nguvu ya kisababishi ya ὅτι
  choice: Kuhifadhi ‘kwa sababu Mungu alikuwa pamoja naye.’
  alternative: Kutumia ‘kwa maana’ au kuifanya kuwa taarifa ya ushirika isiyo na uhusiano wazi wa kisababishi.
  rationale: Kirai kinatoa msingi wa huduma ya Yesu ya kutenda mema na kuponya, bila kutoa hitimisho la ziada kuhusu asili yake ambalo mstari wenyewe haulitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya maandiko. Alama ya koloni na nusu-koloni husaidia kufungua muundo uliobanwa wa Kigiriki bila kuficha uwezekano wa kuunganisha kishazi cha ‘ambaye’ moja kwa moja na Yesu. ‘Naye akazunguka’ ni ya asili zaidi kuliko kufuatisha kishazi kirefu cha urejeshi.
