  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: sw
  text: Ninyi wenyewe mnajua jambo lililotokea katika Yudea yote[a], likianzia Galilaya baada ya ubatizo uliohubiriwa na Yohana[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe ulioenea katika Yudea yote.” Neno la Kigiriki ῥῆμα linaweza kumaanisha “neno,” “ujumbe,” au “jambo.”
    reason: lexical_alternative
  - marker: b
    text: Katika Kigiriki, umbo linalotafsiriwa “likianzia” lina uhusiano wa kisarufi usio laini, lakini linaonyesha wazi kwamba jambo hilo lilianzia Galilaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ninyi wenyewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kinaweka mkazo; “Ninyi wenyewe” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: οἴδατε
  choice: mnajua
  rationale: Ingawa umbo la Kigiriki ni timilifu, hapa lina maana ya wakati uliopo; “mnajua” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: τὸ γενόμενον ῥῆμα
  choice: jambo lililotokea
  rationale: ῥῆμα inaweza kumaanisha neno, ujumbe, au jambo. Pamoja na γενόμενον na muktadha wa matukio yaliyojulikana kotekote, “jambo lililotokea” linahifadhi maana pana ya tukio na ujumbe bila kuibana.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: katika Uyahudi wote
  rationale: κατά pamoja na umilikishi huonyesha kuenea katika eneo lote; usemi huu ni wa asili na unahifadhi ukamilifu wa ὅλης.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: likianzia Galilaya
  rationale: ἀπό huonyesha mahali pa kuanzia. “Likianzia Galilaya” ni Kiswahili fasaha huku likiacha uhusiano wa kisarufi wenye ugumu katika Kigiriki uelezwe kwenye tanbihi.
- source_word: μετὰ τὸ βάπτισμα
  choice: baada ya ubatizo
  rationale: μετά pamoja na hali ya kushutumiwa inaonyesha wakati wa baadaye; “baada ya ubatizo” ni wazi na ya kawaida.
- source_word: βάπτισμα
  choice: ubatizo
  rationale: “Ubatizo” ni istilahi ya Kiswahili iliyokubalika na inafaa katika simulizi hili bila kuongeza ufafanuzi wa namna ya tendo.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: ambao Yohana aliutangaza
  rationale: κηρύσσω ni kutangaza hadharani kama mjumbe. “Aliutangaza” huhifadhi nguvu hiyo bila kuufanya usemi kuwa mahubiri ya madhabahuni pekee.
- source_word: Ἰωάννης
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
theological_decisions:
- issue: Maana ya ῥῆμα katika muhtasari wa Petro
  choice: “jambo” ili kujumuisha matukio ya hadharani na ujumbe unaomhusu Yesu
  alternative: “neno” au “ujumbe”
  rationale: Kifungu kinataja jambo lililojulikana katika Uyahudi wote na mwanzo wake huko Galilaya. Muktadha unaelekea kwenye mfululizo wa matukio pamoja na taarifa yake, si tamko moja tu; tanbihi inalinda uwezekano mwingine wa kileksia.
- issue: Kirejelewa cha ἀρξάμενος
  choice: Kimewasilishwa kwa “likianzia,” kikirejelea jambo lililotokea
  alternative: Kutafsiri kwa sentensi mpya, “lilianza,” au kukihusisha moja kwa moja na mhusika anayedokezwa
  rationale: Kishiriki cha kiume katika Kigiriki kina uhusiano usio laini na ῥῆμα ya jinsi ya kati. Tafsiri inaonyesha maana ya mahali pa kuanzia bila kuamua kupita kiasi tatizo hilo la kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kueleweka kwa wasomaji wa kawaida; alama zote za tanbihi zimewekwa katika matini kuu.
