  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: sw
  text: Naye alituamuru tuwahubirie watu na kushuhudia kwa uzito kwamba yeye ndiye aliyewekwa na Mungu kuwa mwamuzi wa walio hai na waliokufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeteuliwa na Mungu kuwa mwamuzi wa walio hai na waliokufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: alituamuru
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka; “alituamuru” kinahifadhi uzito huo kwa Kiswahili cha kawaida.
- source_word: κηρύξαι
  choice: tuwahubirie
  rationale: Katika muktadha huu neno linamaanisha kutangaza ujumbe hadharani; “kuwahubiria” ni la asili katika Kiswahili na linaelekeza tangazo kwa watu bila kulifunga kwenye muundo maalumu wa mahubiri.
- source_word: τῷ λαῷ
  choice: watu
  rationale: Maana halisi ni “watu”; muktadha unaweza kuelekeza kwa watu wa Israeli, lakini hilo halijaelezwa wazi katika mstari huu.
- source_word: διαμαρτύρασθαι
  choice: kushuhudia kwa uzito
  rationale: Usemi huu unahifadhi wazo la kutoa ushuhuda kwa msisitizo na kwa namna yenye uzito.
- source_word: οὗτός
  choice: yeye ndiye
  rationale: Kiashiria hiki kinamrejelea Yesu kwa msisitizo; “yeye ndiye” ni cha asili na chenye mkazo unaofaa katika Kiswahili.
- source_word: ὁ ὡρισμένος
  choice: aliyewekwa
  rationale: Hii inaonyesha kwamba Mungu amemteua au kumweka katika nafasi hiyo, huku hali ya uteuzi huo ikiendelea.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: na Mungu
  rationale: Muundo wa kutendwa unaonyesha Mungu kuwa mtendaji; “aliyewekwa na Mungu” ni usemi wa moja kwa moja wa Kiswahili.
- source_word: κριτὴς
  choice: mwamuzi
  rationale: “Mwamuzi” linaonyesha mwenye mamlaka ya kutoa hukumu na linafaa katika muktadha wa hukumu ya Mungu.
- source_word: ζώντων καὶ νεκρῶν
  choice: wa walio hai na waliokufa
  rationale: Usemi huu unahifadhi makundi yote mawili na upeo wa mamlaka ya hukumu bila kuongeza ufafanuzi usiotajwa.
theological_decisions:
- issue: Nguvu na upeo wa kuwekwa kwa Yesu kuwa mwamuzi
  choice: aliyewekwa na Mungu kuwa mwamuzi wa walio hai na waliokufa
  alternative: aliyeteuliwa na Mungu kuwa mwamuzi wa walio hai na waliokufa
  rationale: Tafsiri inadumisha dai la wazi kwamba Mungu ndiye aliyemweka Yesu kuwa mwamuzi, na kwamba mamlaka yake inawahusu walio hai na waliokufa, bila kuongeza mifumo ya mafundisho ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umetanguliza ufasaha wa Kiswahili huku ukihifadhi msisitizo wa maandishi ya Kigiriki. Alama ya tanbihi [a] imewekwa katika matini kuu.
