  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: sw
  text: Naye alipokuwa akizungumza naye[a], akaingia ndani, akawakuta watu wengi wamekusanyika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huku akizungumza naye, akaingia ndani na anawakuta watu wengi wamekusanyika.” Kigiriki kinatumia wakati wa sasa wa kihistoria (“anawakuta”) ili kuifanya simulizi iwe hai.
    reason: Mbadala huu unaonyesha muundo wa kirai tegemezi na wakati wa sasa wa kihistoria wa Kigiriki.
lexical_decisions:
- source_word: συνομιλῶν
  choice: alipokuwa akizungumza
  rationale: Kirai hiki kinaonyesha tendo lililokuwa likiendelea wakati wa kuingia; ‘alipokuwa akizungumza’ ni Kiswahili cha kawaida na huhifadhi uambatano wa matendo.
- source_word: αὐτῷ
  choice: naye
  rationale: Dativi pamoja na συνομιλέω humaanisha mtu anayezungumza pamoja naye; ‘naye’ huonyesha mazungumzo ya pande mbili kwa ufupi na kwa kawaida.
- source_word: εἰσῆλθεν
  choice: akaingia ndani
  rationale: Kitenzi cha aoristi kinaendeleza simulizi kwa tukio linalofuata; ‘akaingia ndani’ ni wazi na cha kawaida katika muktadha wa kuingia nyumbani.
- source_word: εὑρίσκει
  choice: akawakuta
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi ni wa kawaida zaidi katika Kiswahili; kiambishi ‘-wa-’ kinaweka wazi kuwa aliwakuta watu.
- source_word: συνεληλυθότας
  choice: wamekusanyika
  rationale: Kauli timilifu inaonyesha kuwa watu walikuwa tayari wamekuja pamoja na sasa walikuwa katika hali ya kukusanyika; ‘wamekusanyika’ huhifadhi matokeo hayo ya sasa katika simulizi.
- source_word: πολλούς
  choice: watu wengi
  rationale: Kivumishi hiki kimetumika kama nomino na humaanisha watu wengi; kutaja ‘watu’ ni Kiswahili cha asili na huondoa utata.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa ‘aka-’ umetumiwa kwa mwendo wa kawaida wa simulizi; tanbihi huhifadhi wakati wa sasa wa kihistoria wa maandishi ya Kigiriki.
