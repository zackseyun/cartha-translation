  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: sw
  text: Manabii wote hutoa ushahidi kumhusu yeye kwamba kila mtu anayemwamini hupokea msamaha wa dhambi kupitia jina lake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: humshuhudia
  rationale: Dativi hii pamoja na μαρτυροῦσιν inaonyesha kwamba Yesu ndiye anayehusu ushuhuda huo. Kiswahili cha asili huweza kusema ‘humshuhudia’ bila kuongeza ‘kuhusu yeye.’
- source_word: πάντες οἱ προφῆται
  choice: Manabii wote
  rationale: Huhifadhi maana ya jumla ya mashahidi wote wa kinabii na ni mpangilio wa kawaida wa Kiswahili.
- source_word: μαρτυροῦσιν
  choice: humshuhudia
  rationale: Kitenzi hiki kinahifadhi nguvu ya kutoa ushahidi na kwa kawaida huchukua yambwa moja kwa moja katika Kiswahili.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: msamaha wa dhambi
  rationale: Hili ni tamko la kawaida, wazi, na lenye heshima kwa maana ya kusamehewa dhambi.
- source_word: λαβεῖν
  choice: hupokea
  rationale: Infinitivi inatoa yaliyomo katika ushuhuda wa manabii; hali ya mazoea ‘hupokea’ huwasilisha kauli ya jumla kwa Kiswahili cha asili.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: kupitia jina lake
  rationale: Huhifadhi nahau ya kibiblia na wazo la upatanisho au njia bila kuipanua kimafundisho kuwa ‘mamlaka.’
- source_word: πάντα τὸν πιστεύοντα
  choice: kila mtu anayeamini
  rationale: Huwasilisha kwa usahihi maana ya jumla na ya kila mmoja ya umbo la Kigiriki, bila kulifanya lihusu wanaume pekee.
- source_word: εἰς αὐτόν
  choice: anayemwamini
  rationale: Kwa πιστεύω pamoja na εἰς, maana ni imani au tumaini linaloelekezwa kwa mtu; ‘kumwamini’ ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Upeo na sharti la msamaha
  choice: Msamaha wa dhambi hupokewa kupitia jina la Yesu na kila mtu anayemwamini.
  alternative: Kupanua kauli kwa istilahi maalumu za kimadhehebu kuhusu utaratibu wa wokovu.
  rationale: Tafsiri inadumisha uhusiano unaotajwa wazi kati ya Yesu, imani, na msamaha bila kuongeza mfumo wa kimafundisho usioelezwa na mstari.
- issue: Umbo la kiume lenye maana ya jumla
  choice: kila mtu anayeamini
  alternative: kila mwanamume anayeamini
  rationale: Partisipio ya umoja wa kiume katika Kigiriki ni ya jumla na haikusudii kuwahusisha wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. ‘Humshuhudia’ ni fupi na ya asili; hakuna tanbihi inayohitajika kwa kuwa mbadala wa ‘hutoa ushahidi kumhusu’ hauleti tofauti ya maana inayohitaji kuhifadhiwa.
