  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: sw
  text: 'Na sasa nawaambia: Jiepusheni na watu hawa, waacheni; kwa maana ikiwa mpango huu au kazi hii inatoka kwa wanadamu,[a] itaangamizwa,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ni ya asili ya kibinadamu” au “inatokana na wanadamu.”
