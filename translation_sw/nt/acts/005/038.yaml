  - marker: b
    text: Au “itavunjwa” au “itafanywa kuwa bure.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: sasa
  rationale: Ni usemi wa wakati unaoanzisha ushauri wa Gamalieli kwa hali iliyopo; “sasa” ni ya kawaida na ya asili katika Kiswahili.
- source_word: ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων
  choice: Jiepusheni na watu hawa
  rationale: Amri hii inataka wajitenge nao na waache kuwaingilia; “jiepusheni” huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: ἄφετε αὐτούς
  choice: mkawaache
  rationale: Katika muktadha huu maana ni kuwaacha bila kuendelea kuwaingilia au kuwashughulikia kwa nguvu.
- source_word: ὅτι
  choice: kwa maana
  rationale: Inaingiza sababu ya ushauri uliotangulia.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: ikiwa ... inatoka kwa wanadamu
  rationale: Huhifadhi maana ya chanzo au asili na pia tofauti na ‘kutoka kwa Mungu’ katika mstari unaofuata; “wanadamu” hapa ni ya jumla, si wanaume pekee.
- source_word: ἡ βουλὴ αὕτη
  choice: mpango huu
  rationale: βoυλή hapa ni kusudi au mpango; “mpango” ni neno wazi na la kawaida.
- source_word: τὸ ἔργον τοῦτο
  choice: kazi hii
  rationale: Huhifadhi upana wa ἔργον, yaani kazi, shughuli, au jambo linalotekelezwa.
- source_word: καταλυθήσεται
  choice: itabatilika
  rationale: Kitenzi hiki cha wakati ujao katika kauli tendwa kinaweza kueleza kuvunjwa, kuangamizwa, au kufanywa bure; “itabatilika” ni ya asili na hudokeza kuwa jambo hilo litafikia mwisho bila kudumu.
theological_decisions:
- issue: Maana ya ἐξ ἀνθρώπων
  choice: inatoka kwa wanadamu
  alternative: ni ya asili ya kibinadamu
  rationale: Kirai hiki kinaonyesha chanzo na kinatofautishwa na chanzo cha kimungu katika mstari unaofuata. “Wanadamu” huhifadhi maana ya jumla ya ἀνθρώπων bila kuifanya ihusu wanaume pekee.
- issue: Nguvu ya καταλυθήσεται
  choice: itabatilika
  alternative: itaangamizwa / itavunjwa
  rationale: Tafsiri haielezi ni nani atakayeibatilisha, hivyo inadumisha kauli tendwa na mvutano wa hoja ya Gamalieli bila kuongeza wakala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “Kwa hiyo, sasa nawaambia” unaendeleza hoja ya Gamalieli, na amri mbili zinabaki wazi. Alama ya tanbihi [a] imewekwa baada ya neno linalohusika.
