id: ACT.5.40
reference: Acts 5:40
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: sw
  text: Baada ya kuwaita mitume, wakawapiga, wakawaamuru wasiseme kwa jina la Yesu,[a] kisha wakawaachilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuhusu jina la Yesu” au “kwa kutegemea jina la Yesu.” Nahau ya Kigiriki inaweza kumaanisha kusema kumhusu Yesu na pia kusema chini ya mamlaka yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: wakawaita ... waingie
  rationale: Kirai hiki kinaeleza tendo lililotangulia amri na kuachiliwa; ‘kuwaita waingie’ ni Kiswahili cha kawaida kinachoonyesha waliitwa mbele ya baraza.
- source_word: τοὺς ἀποστόλους
  choice: mitume
  rationale: ‘Mitume’ ndilo neno la Kibiblia lililozoeleka na lenye maana sahihi katika muktadha huu.
- source_word: δείραντες
  choice: wakawapiga
  rationale: Kitenzi δέρω humaanisha kupiga au kuchapa; ‘wakawapiga’ hakibainishi bila msingi aina maalumu ya adhabu ya kimahakama.
- source_word: παρήγγειλαν
  choice: wakawaamuru
  rationale: Neno hili linaonyesha agizo lenye mamlaka; ‘wakaamuru’ ni la kawaida, wazi, na lenye nguvu inayofaa.
- source_word: μὴ λαλεῖν
  choice: wasiseme
  rationale: Muundo huu unaonyesha yaliyokatazwa. ‘Wasiseme’ ni wa asili katika Kiswahili na unafaa katika mazingira rasmi.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: kwa jina la Yesu
  rationale: '‘Kwa jina la Yesu’ huhifadhi nahau ya Kibiblia na upana wake: kusema kumhusu Yesu, kwa kutegemea jina lake, au chini ya mamlaka yake.'
- source_word: ἀπέλυσαν
  choice: wakawaachilia
  rationale: Hapa ἀπολύω ni kuwaweka huru kutoka kizuizini; ‘kuwaachilia’ linafaa katika muktadha wa kisheria.
theological_decisions:
- issue: Maana ya nahau ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: kwa jina la Yesu
  alternative: kuhusu jina la Yesu; kwa kutegemea jina la Yesu
  rationale: Tafsiri hii haiifungi nahau kwenye maana moja tu, bali inadumisha uhusiano wake na Yesu, mamlaka yake, na ushuhuda unaomhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa matendo umeonyeshwa kwa viambishi vya masimulizi bila kufanya sentensi kuwa nzito; tanbihi inadumisha upana wa nahau ya Kigiriki.
