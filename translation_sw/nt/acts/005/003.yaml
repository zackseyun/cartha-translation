base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: sw
  text: Lakini Petro akasema, “Anania, kwa nini Shetani ameujaza moyo wako hata ukamwambia Roho Mtakatifu uongo[a] na ukajibakizia kwa siri sehemu ya bei[b] ya shamba[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umdanganye Roho Mtakatifu.” Kitenzi cha Kigiriki kinaweza kuwa na wazo la kumdanganya mtu, lakini hapa maana ya moja kwa moja ni kumwambia uongo.
    reason: lexical_alternative
  - marker: b
    text: Au, “sehemu ya mapato ya mauzo” au “sehemu ya bei ya mauzo.”
    reason: lexical_alternative
  - marker: c
    text: “Shamba” pia linaweza kutafsiriwa “ardhi” au “mali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Lakini Petro akasema
  rationale: δέ ni kiunganishi hafifu, lakini hapa kinaonyesha mgeuko wa upinzani Petro anapomkabili Anania; “Lakini” ni ya kawaida na ya asili katika Kiswahili.
- source_word: διὰ τί
  choice: kwa nini
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya swali hili.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: Shetani ameujaza moyo wako
  rationale: Inahifadhi sitiari ya Kigiriki na kumweka Shetani kama mtendaji bila kuongeza wazo la kupagawa, kutawaliwa kabisa, au kulazimishwa.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: ili umwambie Roho Mtakatifu uongo
  rationale: Katika muktadha huu ψεύδομαι pamoja na mtendewa humaanisha kumwambia mtu uongo. Kauli hii ni ya asili zaidi katika Kiswahili kuliko “kusema uongo kwa Roho Mtakatifu” na inadumisha rejeo la moja kwa moja kwa Roho Mtakatifu.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo neno la kawaida, la sasa, na lenye heshima katika Kiswahili.
- source_word: νοσφίσασθαι
  choice: kujiwekea kwa siri sehemu
  rationale: Kitenzi hiki hudokeza kujibakizia kwa siri sehemu ya kitu; tafsiri hii inaonyesha kujitwalia na kuficha tendo hilo bila kutumia istilahi nzito ya kisheria.
- source_word: ἀπὸ τῆς τιμῆς
  choice: sehemu ya bei
  rationale: ἀπό pamoja na hali ya umilikishi huonyesha kuchukua sehemu kutoka katika jumla; “sehemu ya bei” huiweka wazi maana hiyo.
- source_word: τοῦ χωρίου
  choice: ya shamba
  rationale: χωρίον inaweza kumaanisha kipande cha ardhi, shamba, au mali. “Shamba” ni neno la kawaida katika simulizi hili na halibani maana isivyofaa.
theological_decisions:
- issue: Utendaji wa Shetani katika kuujaza moyo wa Anania
  choice: Kudumisha usemi “Shetani ameujaza moyo wako.”
  alternative: “Umemruhusu Shetani akutawale” au “Shetani amekupagaa.”
  rationale: Kigiriki kinamtaja Shetani kama mtendaji na bado kinamwajibisha Anania; hakifafanui kupagawa, kutawaliwa kabisa, wala kuondolewa kwa uwajibikaji wa kibinadamu.
- issue: Maana ya kusema uongo kwa Roho Mtakatifu
  choice: “umwambie Roho Mtakatifu uongo”
  alternative: “umdanganye Roho Mtakatifu” au “useme uongo mbele ya Roho Mtakatifu”
  rationale: Tafsiri iliyochaguliwa inadumisha usemi wa moja kwa moja na wa kibinafsi kuhusu Roho Mtakatifu bila kuongeza ufafanuzi wa kimafundisho.
- issue: Uhusiano wa vitenzi-jina na tendo la Shetani kuujaza moyo
  choice: Kutumia “ili,” huku tanbihi ikihifadhi uwezekano wa matokeo.
  alternative: “hata ukamwambia ... na ukajiwekea”
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa upande wa kusudi au matokeo. Matini kuu hutumia muundo wa asili wa Kiswahili, na tanbihi inadumisha uwezekano mwingine bila kuamua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Sitiari ya “kuujaza moyo” imehifadhiwa; “kujiwekea kwa siri” huepuka istilahi nzito ya kisheria huku ikidumisha wazo la kuficha sehemu ya fedha.
