id: ACT.5.37
reference: Acts 5:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: sw
  text: Baada yake, Yuda Mgalilaya aliinuka wakati wa sensa[a], akawavuta watu wamfuate[b]. Yeye pia aliangamia, na wote waliokubali ushawishi wake wakatawanyika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa kuandikishwa.” Neno la Kigiriki linaweza kumaanisha sensa au usajili rasmi.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliwafanya watu waache uaminifu wao wa awali na wamfuate.” Kitenzi hiki kinaweza kuwa na maana ya kuwafanya watu waache uaminifu wao wa awali na kumfuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Baada yake
  rationale: Kirai hiki kinaonyesha mfuatano wa wakati baada ya mtu aliyetajwa kabla; Kiswahili cha kawaida hutumia ‘baada yake’ kwa maana hiyo.
- source_word: ἀνέστη
  choice: aliinuka
  rationale: Katika muktadha huu humaanisha kujitokeza kama kiongozi, si kufufuka kutoka kwa wafu.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Yuda Mgalilaya
  rationale: Hili ni umbo la kawaida la Kiswahili kwa jina na utambulisho wake wa eneo.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: wakati wa sensa[a]
  rationale: Hutoa maana ya kipindi cha sensa au usajili rasmi kwa lugha ya asili na iliyo wazi.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: kuwavuta watu wamfuate
  rationale: Kitenzi kinaweza kumaanisha kuwafanya watu waache uaminifu wao wa awali na kumfuata mtu; tafsiri hii huhifadhi wazo la kuwavuta bila kuongeza waziwazi dhana ya uasi.
- source_word: λαὸν
  choice: watu
  rationale: Nomino hii haina kibainishi katika Kigiriki na imetumiwa kwa maana ya jumla, si lazima taifa lote.
- source_word: κἀκεῖνος
  choice: Yeye pia
  rationale: Huhifadhi mkazo na mwendelezo wa ‘na huyo pia’ kwa Kiswahili cha kawaida.
- source_word: ἀπώλετο
  choice: aliangamia
  rationale: Hueleza kufa au kufikia maangamizi bila kubainisha namna ya kifo, ambayo haikutajwa katika Kigiriki.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: wote waliokuwa wameshawishiwa naye
  rationale: Huhifadhi maana ya watu waliokubali ushawishi wake badala ya kurudia tu wazo la kumfuata.
- source_word: διεσκορπίσθησαν
  choice: wakatawanyika
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya tendo la kutawanywa au kutawanyika.
theological_decisions:
- issue: Maelezo ya kihistoria na kisiasa kuhusu harakati ya Yuda
  choice: Aya inaeleza kwamba Yuda alijitokeza na kuwavuta watu wamfuate bila kumwita waziwazi mwasi.
  alternative: ‘Aliwaongoza watu katika uasi wamfuate.’
  rationale: Ingawa kihistoria harakati zake zilihusishwa na uasi, aya yenyewe haitumii neno bayana la uasi; tafsiri haipaswi kuongeza tathmini ya kisiasa isiyosemwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umefanywa kuwa wa asili bila kuondoa tofauti za vitenzi vya Kigiriki.
