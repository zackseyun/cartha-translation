id: ACT.5.34
reference: Acts 5:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: sw
  text: Lakini Farisayo mmoja aliyeitwa Gamalieli alisimama katika baraza[a]. Alikuwa mwalimu wa Sheria aliyeheshimiwa na watu wote. Akaamuru wale wanaume watolewe nje kwa muda mfupi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Baraza” hapa ni baraza kuu la utawala la Wayahudi, lililojulikana kama Sanhedrini.
    reason: cultural_note
  - marker: b
    text: Kigiriki husema kihalisi “kuwafanya wale wanaume wawe nje kwa muda mfupi,” nahau inayomaanisha waondolewe kwa muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: alisimama
  rationale: Kitenzi hiki katika muktadha wa mkutano kinaonyesha Gamalieli kuinuka ili kusema; “alisimama” ni Kiswahili cha kawaida na huhifadhi tendo la kimwili na la hadharani.
- source_word: δέ
  choice: Lakini
  rationale: δέ huleta badiliko lenye utofauti mdogo katika simulizi; “Lakini” linaonyesha kuingilia kati kwa Gamalieli baada ya yaliyotangulia.
- source_word: τις
  choice: mmoja
  rationale: τις humtambulisha mshiriki mpya asiyeainishwa hapo awali; “Farisayo mmoja” ni muundo wa asili wa Kiswahili.
- source_word: συνεδρίῳ
  choice: baraza
  rationale: Neno hili linamaanisha baraza la utawala la Wayahudi. “Baraza” ni tafsiri wazi, huku maelezo ya utambulisho wake yakitolewa katika tanbihi.
- source_word: Φαρισαῖος
  choice: Farisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mshiriki wa kundi hilo la kidini.
- source_word: ὀνόματι Γαμαλιήλ
  choice: aliyeitwa Gamalieli
  rationale: Hii ni kauli ya asili ya Kiswahili inayowasilisha maana ya “mwenye jina Gamalieli.”
- source_word: νομοδιδάσκαλος
  choice: mwalimu wa Sheria
  rationale: Neno ambatano humaanisha mtu anayefundisha Sheria; herufi kubwa inabainisha Sheria ya Musa katika muktadha huu bila kuongeza maelezo ndani ya aya.
- source_word: τίμιος
  choice: aliyeheshimiwa
  rationale: Katika muktadha huu neno linaonyesha hadhi na heshima ya kijamii aliyokuwa nayo Gamalieli.
- source_word: παντὶ τῷ λαῷ
  choice: na watu wote
  rationale: Dativu inaonyesha waliompa heshima; “watu wote” huhifadhi upana wa λαός bila kuongeza “wa Israeli,” jambo ambalo halijasemwa wazi katika Kigiriki.
- source_word: ἐκέλευσεν
  choice: akaamuru
  rationale: κελεύω huonyesha agizo lenye mamlaka. “Akaamuru” lina nguvu inayofaa mazingira ya kikao cha hukumu na linaendeleza simulizi kwa kawaida.
- source_word: ἔξω ... ποιῆσαι
  choice: watolewe nje
  rationale: Kauli ya Kigiriki ni nahau inayomaanisha kusababisha watu waondolewe mahali walipokuwa; kauli tendwa ya Kiswahili ni ya asili baada ya “akaamuru.”
- source_word: βραχύ
  choice: kwa muda mfupi
  rationale: Hutumika kiadverbia kuonyesha muda; tafsiri hii huhifadhi wazo la kuondolewa kwa muda tu.
theological_decisions:
- issue: Rejeo lenye jinsia la τοὺς ἀνθρώπους
  choice: wale wanaume
  alternative: watu hao
  rationale: Katika muktadha huu wanaorejelewa ni mitume wanaume waliokuwa mbele ya baraza. “Wale wanaume” huhifadhi jinsia ya rejeo badala ya kuifanya kuwa ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wazi na wenye heshima. Aya imegawanywa katika sentensi tatu ili kuepuka sentensi ndefu isiyo ya asili, huku uhusiano wa matendo na maelezo ya Gamalieli ukihifadhiwa.
