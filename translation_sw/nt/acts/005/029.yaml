  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: sw
  text: Lakini Petro na mitume wakajibu, “Ni lazima tumtii Mungu kuliko wanadamu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu.” Neno la Kigiriki linawarejelea wanadamu kwa ujumla; katika muktadha huu ni mamlaka za kibinadamu zinazotofautishwa na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: wakajibu
  rationale: Muundo huu wa Kigiriki ni fomula ya kisimulizi yenye maana ya kujibu na kusema. “Wakajibu” huepuka uradidi usio wa kawaida katika Kiswahili huku ikihifadhi tendo la kuitikia.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ndogo na agizo lililotangulia; “Lakini” linaonyesha vizuri mgeuko huo.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: Petro na mitume
  rationale: “Petro” ni umbo la kawaida la jina hili katika Kiswahili, na “mitume” ni istilahi iliyozoeleka kwa kundi hili maalumu.
- source_word: Πειθαρχεῖν
  choice: kumtii
  rationale: Kitenzi hiki humaanisha kumtii mwenye mamlaka. “Kumtii” ni cha kawaida na kinafaa kwa Mungu kama yule anayetiiwa.
- source_word: δεῖ
  choice: Ni lazima
  rationale: Huonyesha ulazima au wajibu. Muundo “Ni lazima tumtii” unaweka wazi mhusika aliyodokezwa na unasikika kawaida katika Kiswahili.
- source_word: θεῷ
  choice: Mungu
  rationale: Ni yambwa ya utii katika hali ya dative; tafsiri ya moja kwa moja ni “Mungu.”
- source_word: μᾶλλον ἢ
  choice: kuliko
  rationale: Muundo huu unalinganisha utii kwa Mungu na utii kwa wanadamu. “Kuliko” huhifadhi kwa ufupi nguvu ya ulinganisho huo bila kuongeza ufafanuzi usio katika matini.
- source_word: ἀνθρώποις
  choice: wanadamu
  rationale: Neno hili linawarejelea binadamu kwa ujumla, kwa kutofautishwa na Mungu. “Wanadamu” huhifadhi tofauti hiyo kwa lugha ya kawaida na yenye staha.
theological_decisions:
- issue: Tofauti kati ya kumtii Mungu na kuwatii wanadamu
  choice: Ni lazima tumtii Mungu kuliko wanadamu
  alternative: Ni lazima tumtii Mungu badala ya wanadamu
  rationale: “Kuliko” hufuata muundo wa ulinganisho wa μᾶλλον ἢ na kuhifadhi mvutano wa kauli ya asili. “Badala ya” lingeweza kuifanya kauli ionekane kama katazo kamili la kuwatii wanadamu katika kila hali, jambo ambalo mstari wenyewe halisemi wazi.
- issue: Maana ya jumla ya ἀνθρώποις
  choice: wanadamu
  alternative: watu
  rationale: “Wanadamu” linaonyesha wazi tofauti ya kimsingi kati ya Mungu na mamlaka za kibinadamu, bila kuifanya kauli ihusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa urahisi. Kauli ni fupi na yenye nguvu kama ilivyo katika chanzo; uradidi wa kifomula wa Kigiriki umeunganishwa kuwa “wakajibu.”
