  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: sw
  text: Mara akaanguka miguuni pake na kufa. Wale vijana walipoingia, wakamkuta amekufa; wakamtoa nje na kumzika kando ya mume wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: Mara
  rationale: Huonyesha kwamba tukio lilitokea papo hapo; “mara” ni ya kawaida na fasaha katika Kiswahili.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: miguuni pake
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi maana ya kuanguka karibu kabisa na miguu yake.
- source_word: ἐξέψυξεν
  choice: kufa
  rationale: Kitenzi hiki kwa muktadha humaanisha kutoa pumzi ya mwisho; “kufa” hutoa maana hiyo kwa uwazi bila kuongeza taswira isiyolazimika.
- source_word: οἱ νεανίσκοι
  choice: wale vijana
  rationale: Hurejelea vijana waliotajwa awali katika simulizi.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: kando ya mume wake
  rationale: Katika muktadha wa maziko, πρός huonyesha kuwa alizikwa karibu na mume wake.
