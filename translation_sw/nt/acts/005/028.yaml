source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: sw
  text: akisema, “Tuliwaagiza vikali msifundishe kwa jina hili. Lakini tazama, mmeijaza Yerusalemu kwa mafundisho yenu, nanyi mnataka kuleta juu yetu damu ya mtu huyu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “kutufanya tuwajibike kwa kifo cha mtu huyu.” Kigiriki husema “kuleta damu ya mtu huyu juu yetu,” nahau inayomaanisha hatia ya damu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Tuliwaagiza kwa ukali
  rationale: Nomino katika hali ya dative pamoja na kitenzi cha mzizi uleule inasisitiza agizo. Kiswahili cha kawaida hakiwezi kuiga muundo huo bila kuwa kizito, hivyo “kwa ukali” kinawasilisha msisitizo wake.
- source_word: μὴ διδάσκειν
  choice: msifundishe
  rationale: Infinitivi ya wakati uliopo baada ya μή inaeleza yaliyokatazwa. Tafsiri hii haisemi zaidi ya matini kwa kudai moja kwa moja kwamba walipaswa ‘kuacha kufundisha.’
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: kwa jina hili
  rationale: Katika Matendo, usemi huu mara nyingi unahusu kufundisha kwa mamlaka inayohusishwa na jina hilo. “Kwa jina hili” huhifadhi maana na muundo wa chanzo kwa Kiswahili cha kawaida.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linavuta usikivu kwa namna ya kukabili wasikilizaji. “Tazama” ni la heshima, linaeleweka, na huhifadhi nguvu hiyo.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: mmeujaza Yerusalemu
  rationale: Wakati timilifu unaonyesha tendo lililokamilika lenye matokeo yanayoendelea. “Mmeujaza” huhifadhi picha ya kuujaza mji.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: mafundisho yenu
  rationale: Genitivi inayofuata kitenzi cha kujaza inaonyesha kile ambacho Yerusalemu umejazwa nacho. “Mafundisho” ni neno la kawaida lisiloegemea istilahi ya kimadhehebu.
- source_word: βούλεσθε
  choice: mnataka
  rationale: Kitenzi hiki kinaonyesha nia au utashi. “Mnataka” ni cha kawaida na kinafaa katika shtaka hili bila kuongeza wazo kali zaidi la kuazimia.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: kuileta juu yetu
  rationale: Muundo wa kitenzi pamoja na ἐπί una picha ya kuleta kitu juu ya watu, hapa ukiashiria kuwawekea lawama au hatia. Tafsiri hii huhifadhi nahau ya chanzo.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: damu ya mtu huyu
  rationale: Usemi huu unadokeza wajibu au hatia kuhusu kifo chake. Maneno “mtu huyu” pia yanahifadhi namna ya kumtaja Yesu kwa kujitenga naye.
- source_word: ἀνθρώπου
  choice: mtu
  rationale: Neno linamtaja mwanamume mmoja maalumu, Yesu; katika Kiswahili “mtu huyu” ni usemi wa kawaida unaohifadhi rejeo hilo bila kulazimisha neno lisilo la asili.
theological_decisions:
- issue: Maana ya “kuileta juu yetu damu ya mtu huyu”
  choice: Nahau ya damu imehifadhiwa katika matini kuu, huku tanbihi ikieleza kuwa inahusu kuwajibika kwa kifo chake.
  alternative: “kutufanya tuwajibike kwa kifo cha mtu huyu”
  rationale: Kigiriki kinatumia picha ya damu kuja juu ya mtu, ambayo kwa kawaida huonyesha hatia ya damu. Kuiweka katika matini kuu huhifadhi picha na uzito wa kiteolojia bila kufafanua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi sauti ya mashtaka na picha za Kigiriki, huku ikiepuka miundo mizito isiyo ya kawaida.
