review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents the emphatic prohibition, the completed filling of Jerusalem with the apostles’ teaching, and the accusation concerning ‘this man’s blood.’ The bloodguilt idiom is appropriately retained in the main text and explained without importing further interpretation.
  naturalness: 'Two constructions need smoothing in Standard East African Swahili: ‘mmeujaza Yerusalemu mafundisho yenu’ has an unsuitable object concord and lacks the natural instrumental/complement marker; and ‘kuileta juu yetu damu’ is less idiomatic than placing the lexical object directly after ‘kuleta.’'
  terminology: ‘Jina hili,’ ‘mafundisho yenu,’ and ‘damu ya mtu huyu’ are accurate, natural, and preserve the hostile distancing in the Greek. ‘Tuliwaagiza vikali’ is a more idiomatic rendering of the intensified command than ‘Tuliwaagiza kwa ukali.’
  issues:
  - severity: medium
    issue: Object concord and complementation in ‘mmeujaza Yerusalemu mafundisho yenu’
    rationale: For the city name Yerusalemu, ‘mmeijaza Yerusalemu kwa mafundisho yenu’ is the natural Standard Swahili construction. It clearly expresses filling Jerusalem with their teaching and avoids the inappropriate u-class object concord.
  - severity: low
    issue: Word order in ‘kuileta juu yetu damu ya mtu huyu’
    rationale: ‘Kuleta juu yetu damu ya mtu huyu’ is more natural Swahili while preserving the Greek image of bringing blood upon someone.
  - severity: low
    issue: ‘kwa ukali’ slightly shifts emphasis toward harsh manner
    rationale: The Greek cognate construction intensifies the command itself. ‘Vikali’ idiomatically conveys a strict, emphatic order without suggesting an unnecessarily harsh tone.
