  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: sw
  text: Na hofu kuu ikalipata kanisa lote[a], na ikawapata wote waliosikia mambo hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusanyiko lote” au “jumuiya yote” badala ya “kanisa lote” (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ikalipata
  rationale: Pamoja na φόβος kama kiima na ἐπί ikitaja walioathiriwa, kitenzi hiki kinaeleza hofu iliyowajia au kuwapata watu; “ikalipata” ni ya asili katika Kiswahili na inadumisha nguvu ya tukio.
- source_word: φόβος μέγας
  choice: hofu kuu
  rationale: Katika muktadha wa hukumu iliyowapata Anania na Safira, φόβος ina maana ya hofu nzito kuliko mshangao au kicho pekee; μέγας imetafsiriwa moja kwa moja kuwa “kuu.”
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: ikalipata kanisa lote
  rationale: ἐκκλησία hapa ni jumuiya ya waamini. “Kanisa” ndilo neno la kawaida la Kiswahili kwa jumuiya hiyo, na “lote” linahifadhi wazo la ujumla katika ὅλην.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: wote waliosikia mambo hayo
  rationale: Muundo huu unataja kila mtu aliyesikia habari za matukio yaliyotangulia. “Mambo hayo” linadumisha wingi wa ταῦτα na hurejelea matukio hayo kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya ἐκκλησία
  choice: kanisa
  alternative: kusanyiko; jumuiya
  rationale: Katika Matendo neno hili linarejelea jumuiya ya waamini. “Kanisa” ni tafsiri sanifu na ya kawaida, bila kuamua hapa muundo maalumu wa kitaasisi; tanbihi inahifadhi maana mbadala za kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Kiunganishi “Na” kinahifadhi καί ya mwanzo; “hofu kuu” hudumisha uzito wa tukio bila kuibadili kimya kimya kuwa kicho.
