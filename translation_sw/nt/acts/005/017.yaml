  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: sw
  text: Lakini kuhani mkuu akainuka, naye pamoja na wale wote waliokuwa naye—yaani, kundi la Masadukayo[a]—wakajawa na wivu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhehebu la Masadukayo.” Neno la Kigiriki linaweza kumaanisha kundi, mrengo, au dhehebu.
    reason: lexical_alternative
  - marker: b
    text: Au “husuda.” Neno la Kigiriki linaweza pia kumaanisha “bidii,” lakini hapa muktadha unaonyesha hisia ya uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: akainuka
  rationale: Kitenzi hiki kimetumiwa kama utangulizi wa hatua ya makusudi; “akainuka” huhifadhi taswira na msukumo wa simulizi bila kudokeza kwamba aliondoka mahali hapo.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa δέ inaonyesha tofauti ndogo kati ya mwitikio mzuri uliotangulia na upinzani unaofuata.
- source_word: ὁ ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa cheo hiki cha kidini.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: wote waliokuwa upande wake
  rationale: Usemi huu unaonyesha watu walioungana naye; “upande wake” ni wa kawaida na huepuka kudokeza tu kuwa walikuwa karibu naye kimahali.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: yaani, kundi la Masadukayo
  rationale: αἵρεσις hapa ni kundi au mrengo unaotambulika ndani ya Uyahudi, si lazima uzushi wa kimafundisho. “Yaani” huonyesha wazi kuwa maneno haya yanafafanua waliokuwa upande wa kuhani mkuu.
- source_word: ἐπλήσθησαν
  choice: wakajawa
  rationale: Huhifadhi nahau ya Kigiriki ya kujazwa na hali au hisia fulani, huku ikisomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: ζήλου
  choice: wivu
  rationale: Ingawa ζῆλος inaweza kumaanisha bidii, muktadha wa upinzani hapa unaonyesha hisia hasi ya wivu au husuda.
theological_decisions:
- issue: Maana ya αἵρεσις
  choice: kundi
  alternative: dhehebu
  rationale: “Kundi” huonyesha mrengo wa kijamii na kidini bila kuingiza dhana ya baadaye ya uzushi au mgawanyiko wa kidhehebu.
- issue: Maana ya ζῆλος katika muktadha
  choice: wivu
  alternative: husuda; bidii
  rationale: Matendo yanayofuata yanaonyesha kuwa msukumo wao ulikuwa hasi. “Wivu” huhifadhi maana hiyo, huku tanbihi ikitaja uwezekano wa “husuda” na maana ya msingi ya “bidii.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “naye pamoja na” unaweka wazi kwamba kuhani mkuu na wenzake wote ndio waliojawa na wivu, huku umoja wa “akainuka” ukihifadhi upatanisho wa kisarufi wa kishiriki cha Kigiriki na kuhani mkuu.
