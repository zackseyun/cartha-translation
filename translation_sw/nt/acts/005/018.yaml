base_translation:
  language: en
  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: sw
  text: Wakawakamata mitume, wakawaweka katika gereza la umma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya ulinzi wa umma.” Kirai cha Kigiriki kinaweza kumaanisha kuwekwa kizuizini au chini ya ulinzi kwa ujumla, si lazima ndani ya jengo maalumu la gereza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: wakawakamata
  rationale: Nahau hii ina maana ya kuwashika kwa nguvu au kuwakamata katika muktadha huu. Kiswahili cha moja kwa moja ‘wakaweka mikono juu ya’ kingeweza kueleweka kama tendo la baraka au kuwekwa wakfu, hivyo ‘wakawakamata’ huwasilisha nguvu ya kukamatwa kwa uwazi na kwa lugha ya kawaida.
- source_word: ἀποστόλους
  choice: mitume
  rationale: Katika Matendo, neno hili ni cheo kinachotambulika cha wale waliotumwa na Yesu, si wajumbe wa kawaida tu. ‘Mitume’ ndilo neno la kawaida na linalofaa katika Kiswahili.
- source_word: ἔθεντο
  choice: kuwaweka
  rationale: Hutoa maana ya kawaida ya ‘kuweka’ katika muktadha wa kuwaingiza chini ya ulinzi au kifungo.
- source_word: ἐν τηρήσει
  choice: katika kizuizi
  rationale: τήρησις inaweza kumaanisha hali au mahali pa kuwekwa chini ya ulinzi, kizuizi, au kifungo. ‘Katika kizuizi’ haibani maana iwe lazima jengo maalumu la gereza.
- source_word: δημοσίᾳ
  choice: cha umma
  rationale: Kivumishi hiki kinaeleza kizuizi kuwa cha umma au rasmi, yaani mahali pa kawaida pa serikali pa kuwazuilia watu. ‘Cha umma’ huhifadhi kibainishi bila kukifanya kuwa kitendo cha kufanywa hadharani.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Wakawakamata’ ni ya asili kuliko tafsiri sisisi ya nahau ya Kigiriki, huku ‘kizuizi cha umma’ kikihifadhi upana wa maana wa τηρήσει δημοσίᾳ. Alama ya tanbihi [a] imewekwa katika matini.
