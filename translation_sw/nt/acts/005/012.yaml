  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: sw
  text: Ishara na maajabu mengi yalikuwa yakitendeka miongoni mwa watu kwa mikono ya mitume. Nao wote walikuwa pamoja[a] katika Ukumbi wa Sulemani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa moyo mmoja.” Neno la Kigiriki linaonyesha umoja wa nia pamoja na kukusanyika mahali pamoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “Baraza la Sulemani,” yaani ukumbi wenye safu ya nguzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: kwa mikono ya mitume
  rationale: Inadumisha tamathali halisi ya Kigiriki na kuonyesha kwamba mitume ndio waliotumiwa kutenda ishara na maajabu.
- source_word: δὲ
  choice: haijatafsiriwa kwa neno tofauti
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha tofauti kali; mtiririko wa kawaida wa Kiswahili unatosha bila kuongeza kiunganishi kisicho cha lazima.
- source_word: ἐγίνετο
  choice: yalikuwa yakitendeka
  rationale: Muundo huu unaonyesha matendo yaliyokuwa yakiendelea au kurudiwa wakati uliopita, huku ishara na maajabu zikiwa kiima.
- source_word: σημεῖα καὶ τέρατα πολλὰ
  choice: ishara na maajabu mengi
  rationale: Huu ni usemi wa kawaida wa Luka; 'mengi' linahusishwa kwa kawaida na aina zote mbili bila kuongeza neno la kufasiri kama 'miujiza'.
- source_word: ἐν τῷ λαῷ
  choice: miongoni mwa watu
  rationale: Inaonyesha mazingira ambamo matendo hayo yalitokea bila kuwabainisha watu hao zaidi ya maandishi ya Kigiriki.
- source_word: ὁμοθυμαδὸν
  choice: pamoja
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoonyesha kukusanyika kwao; maana ya umoja wa nia imehifadhiwa katika tanbihi.
- source_word: ἅπαντες
  choice: wote
  rationale: Inadumisha maana jumuishi ya neno la Kigiriki bila kumtaja kwa lazima rejeleo lake.
- source_word: Στοᾷ Σολομῶντος
  choice: Ukumbi wa Sulemani
  rationale: Neno 'ukumbi' ni la kueleweka na linafaa kwa eneo la umma lenye paa; tanbihi inaeleza zaidi muundo wa mahali hapo.
theological_decisions:
- issue: Rejeleo la maneno 'Nao wote'
  choice: Rejeleo limeachwa wazi kama lilivyo katika Kigiriki.
  alternative: Kutaja wazi kwamba ni mitume pekee au waamini wote.
  rationale: Kiima cha ἦσαν ἅπαντες hakikutajwa wazi. Tafsiri haipaswi kuamua ikiwa kundi hilo lilikuwa mitume pekee au jumuiya pana ya waamini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumiwa kwa mtiririko wa asili, huku uhusiano wa kishazi cha pili ukidumishwa kwa 'Nao'.
