lexical_decisions:
- source_word: Οἱ δὲ
  choice: Lakini wao
  rationale: Kiunganishi δέ kinaonyesha mgeuko wa simulizi na upinzani mdogo; Kiswahili cha kawaida kinaweza kuacha kiwakilishi huru kwa kuwa kiima kinaonekana katika kitenzi.
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Kauli ya wakati inawakilisha kitenzi-shirikishi cha aoristi kwa ufasaha; “hayo” hurejelea maneno yaliyotangulia bila kuongeza jambo jipya.
- source_word: διεπρίοντο
  choice: walikasirika sana
  rationale: Kitenzi hiki kina picha halisi ya kukatwa au kupasuliwa, lakini hapa huonyesha msukosuko mkali wa kihasama. Tafsiri hii ni ya kawaida na haidokezi kimakosa toba au kusadikishwa moyoni.
- source_word: ἐβούλοντο
  choice: na kutaka
  rationale: Inaonyesha nia au tamaa iliyoendelea; muundo huu wa Kiswahili huunganisha kwa kawaida tendo hilo na tendo lililotangulia.
- source_word: ἀνελεῖν
  choice: kuwaua
  rationale: Katika muktadha huu ἀναιρέω humaanisha kuwaondolea uhai; “kuwaua” ni wazi na ya moja kwa moja.
- source_word: αὐτούς
  choice: -wa- katika kuwaua
  rationale: Kiwakilishi kinawarejelea mitume na kwa kawaida huwakilishwa ndani ya kitenzi cha Kiswahili.
theological_decisions:
- issue: Ikiwa διεπρίοντο inaonyesha kusadikishwa moyoni au hasira kali
  choice: walikasirika sana
  alternative: walichomwa moyoni / walikatwa hadi moyoni
  rationale: Muktadha wa kutaka kuwaua unaonyesha mwitikio mkali wa kihasama. Maelezo ya chini yanahifadhi picha halisi ya neno bila kugeuza mwitikio huo kuwa toba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Walikasirika sana” ni asilia zaidi kuliko kufuatisha moja kwa moja picha ya kukatwa, huku tanbihi ikihifadhi picha na utata wa kileksika.
