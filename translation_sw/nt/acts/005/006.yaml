  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: sw
  text: Ndipo wale vijana[a] wakasimama, wakaufunga mwili wake, wakamchukua nje, wakamzika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale vijana zaidi.” Neno la Kigiriki νεώτεροι lina umbo la kulinganisha na linaweza kumaanisha “wanaume walio vijana zaidi” au, kwa ujumla, “vijana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: wakasimama
  rationale: Kitenzi hiki cha wakati uliopita kinaonyesha kwamba vijana hao waliinuka ili kuchukua hatua; “wakasimama” ni cha kawaida katika masimulizi na huhifadhi mfuatano wa vitendo.
- source_word: δὲ
  choice: Ndipo
  rationale: Hapa δέ inaendeleza simulizi baada ya kifo cha Anania; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: οἱ νεώτεροι
  choice: wale vijana
  rationale: νεώτεροι ina umbo la kulinganisha na inaweza kumaanisha walio vijana zaidi au kwa ujumla vijana. “Wale vijana” ni ya asili katika Kiswahili, huku tanbihi ikihifadhi maana mbadala.
- source_word: συνέστειλαν
  choice: wakamfunga kwa sanda
  rationale: Katika muktadha huu neno linaelekea kumaanisha kuukunja au kuufunga mwili tayari kwa kuondolewa na kuzikwa. “Kumfunga kwa sanda” huwasilisha kitendo hicho kwa uwazi bila kupanua kuwa taratibu zote za maandalizi ya mazishi.
- source_word: αὐτὸν
  choice: -m-
  rationale: Kiwakilishi kinamrejelea Anania na kimewasilishwa kiasili kwa kiambishi cha yambwa katika vitenzi vya Kiswahili.
- source_word: ἐξενέγκαντες
  choice: wakamchukua nje
  rationale: Neno humaanisha kumtoa au kumchukua nje; kwa muktadha wa mwili wa marehemu, “wakamchukua nje” ni wazi na ya kawaida.
- source_word: ἔθαψαν
  choice: wakamzika
  rationale: θάπτω humaanisha kuzika; “wakamzika” ndiyo tafsiri ya moja kwa moja na ya kawaida.
