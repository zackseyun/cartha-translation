  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: sw
  text: Kabla halijauzwa, je, halikuwa mali yako? Na baada ya kuuzwa, je, fedha zake hazikuwa chini ya mamlaka yako?[a] Kwa nini uliweka jambo hili moyoni mwako? Hukusema uongo kwa wanadamu[b], bali kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fedha zake hazikuwa katika uwezo wako wa kuzitumia ulivyotaka?”
    reason: lexical_alternative
  - marker: b
    text: “Wanadamu” hapa humaanisha watu kwa ujumla, si wanaume pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: Kabla halijauzwa ... halikuwa mali yako
  rationale: Muundo huu unaonyesha hali ya shamba kabla ya kuuzwa na unawasilisha kwa Kiswahili cha kawaida maana ya kwamba liliendelea kuwa mali yake, ingawa haurudii kitenzi cha Kigiriki neno kwa neno.
- source_word: σοὶ
  choice: mali yako
  rationale: Dativu hapa inaonyesha umiliki; “mali yako” ni ya asili zaidi katika Kiswahili kuliko tafsiri halisi ya “kwako.”
- source_word: πραθέν
  choice: baada ya kuuzwa
  rationale: Inahifadhi hali ya kutendwa ya kishirikishi cha aoristi na inaunganisha hoja kwa Kiswahili fasaha.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: fedha zake hazikuwa chini ya mamlaka yako
  rationale: ἐξουσία lina maana ya mamlaka, haki, au uwezo wa kuamua. Kutaja “fedha zake” kunabainisha kwa kawaida kile kilichokuwa chini ya udhibiti wake baada ya shamba kuuzwa.
- source_word: τί ὅτι
  choice: Kwa nini
  rationale: Katika muktadha huu, swali hili fupi la Kiswahili lina nguvu ya kukemea na kuchunguza nia kama nahau ya Kigiriki.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: uliweka ... moyoni mwako
  rationale: Inahifadhi lugha ya moyo na wazo la kusudia au kuazimia kwa ndani bila kulifafanua kupita kiasi kuwa mpango pekee.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: jambo hili
  rationale: Ni tafsiri pana na isiyoegemea upande wa πρᾶγμα, ikiruhusu muktadha kuonyesha uzito wa kimaadili.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Hukuwadanganya wanadamu, bali Mungu
  rationale: Kitenzi chenye dativu kina maana ya kumdanganya mtu. “Wanadamu” huonyesha watu kwa ujumla na kudumisha utofauti kati yao na Mungu.
theological_decisions:
- issue: Uhusiano wa kusema uongo kwa Roho Mtakatifu katika mstari wa 3 na kusema uongo kwa Mungu hapa
  choice: Kutafsiri tu “bali Mungu”
  alternative: Kuongeza “yaani, Roho Mtakatifu”
  rationale: Mstari wenyewe unasema “Mungu.” Muktadha unaweza kuonyesha uhusiano wa kiteolojia bila kuingiza ufafanuzi ndani ya matini.
- issue: Umiliki na uhuru wa kuamua kuhusu shamba na mapato yake
  choice: Kuonyesha kwamba shamba lilikuwa mali yake na fedha zake zilikuwa chini ya mamlaka yake
  alternative: Kuonyesha umiliki tu bila haki ya kuamua
  rationale: Hoja ya Petro ni kwamba kosa halikuwa kutotoa mali yote, bali udanganyifu; lugha ya mamlaka inadumisha hoja hiyo.
- issue: Maana ya ἀνθρώποις
  choice: wanadamu
  alternative: wanaume
  rationale: Katika wingi huu neno linawahusu binadamu kwa ujumla, si watu wa jinsia ya kiume pekee. “Wanadamu” ni sahihi kijinsia na hudumisha utofauti wa balagha na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali mawili ya balagha yamedumishwa. “Moyoni mwako” huhifadhi taswira ya chanzo bila kuwa msemo mgumu. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
