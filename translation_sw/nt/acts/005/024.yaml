lexical_decisions:
- source_word: ὡς δὲ
  choice: Lakini ... walipo-
  rationale: Muundo huu unaunganisha tukio na yaliyotangulia kwa δέ huku ukionyesha wakati kwa ὡς kwa Kiswahili cha kawaida.
- source_word: ἤκουσαν
  choice: waliposikia
  rationale: Hutoa maana ya kawaida ya kusikia na, pamoja na kiambishi -po-, huunda kishazi cha wakati.
- source_word: τοὺς λόγους τούτους
  choice: maneno hayo
  rationale: Ni tafsiri ya karibu na ya kawaida; inarejelea taarifa iliyotolewa mara tu kabla.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: mkuu wa walinzi wa Hekalu
  rationale: στρατηγός hapa ni afisa mwenye mamlaka juu ya kikosi cha ulinzi wa eneo la Hekalu; tafsiri hii huepuka kudokeza kiongozi wa ibada.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Ni istilahi ya kawaida kwa viongozi wa ukuhani, si madai kwamba kulikuwa na makuhani wakuu wengi waliokuwa wakishika wadhifa mmoja kwa wakati mmoja.
- source_word: διηπόρουν
  choice: walifadhaika sana
  rationale: Kitenzi kinaonyesha hali kubwa ya kutatizika na kutokuwa na uhakika; hali inayoendelea ya wakati usiotimilika inaelezwa katika muktadha wa sentensi.
- source_word: περὶ αὐτῶν
  choice: kuyahusu
  rationale: Kiwakilishi cha ngeli ya maneno kinahifadhi rejeo la karibu la αὐτῶν kwa maneno au taarifa hizo bila kufafanua kupita kiasi.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: jambo hilo lingeishia wapi
  rationale: Huwasilisha kutokuwa na uhakika kuhusu matokeo ya hali hiyo, kulingana na optative pamoja na ἄν.
