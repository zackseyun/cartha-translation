  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hekalu” limeandikwa kwa herufi kubwa kwa kuwa linarejelea Hekalu la Yerusalemu. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
