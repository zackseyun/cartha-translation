  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: sw
  text: Basi, mkuu wa walinzi wa Hekalu na makuhani wakuu waliposikia maneno hayo, walikuwa wamechanganyikiwa kuhusu hayo, wakijiuliza jambo hilo lingeishia wapi.[a]
