  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: sw
  text: Nasi ni mashahidi wa mambo haya[a], na Roho Mtakatifu pia ni shahidi[b], ambaye Mungu amewapa wale wanaomtii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno haya” au “masuala haya.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “na Roho Mtakatifu”; maana ya “ni shahidi” inaendelezwa kutoka kishazi kilichotangulia.'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: mashahidi
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa watu wanaotoa ushuhuda kuhusu waliyojionea au wanayoyajua.
- source_word: ῥημάτων
  choice: mambo
  rationale: Ingawa ῥῆμα inaweza kumaanisha ‘neno’ au ‘kauli,’ hapa wingi wake unarejelea mambo ambayo mitume wanayatolea ushahidi. ‘Mambo haya’ ni ya asili na huhifadhi upana wa maana.
- source_word: πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, la sasa, na lenye heshima katika Kiswahili.
- source_word: ὃ
  choice: ambaye
  rationale: Ingawa kiwakilishi cha Kigiriki kina umbo la jinsia ya kati kwa kupatana kisarufi na πνεῦμα, Kiswahili hutumia ‘ambaye’ kwa rejeleo la kibinafsi la Roho Mtakatifu.
- source_word: ἔδωκεν
  choice: amewapa
  rationale: Wakati timilifu wa Kiswahili unaeleza tendo la Mungu la kutoa Roho lenye matokeo yanayoendelea; kiambishi ‘-wa-’ kinawatambulisha wanaomtii kama wapokeaji.
- source_word: πειθαρχοῦσιν
  choice: wanaomtii
  rationale: Kitenzi hiki humaanisha kumtii mwenye mamlaka. ‘Kumtii’ ni wazi na kinaendana na muktadha wa 5:29 kuhusu kumtii Mungu.
- source_word: αὐτῷ
  choice: -m- katika ‘wanaomtii’
  rationale: Kiwakilishi kinamrejelea Mungu na kimewasilishwa kwa kiambishi cha yambwa cha Kiswahili bila kurudia jina lake.
theological_decisions:
- issue: Ikiwa Roho Mtakatifu anaonyeshwa kuwa shahidi pamoja na mitume
  choice: na Roho Mtakatifu pia ni shahidi
  alternative: na Roho Mtakatifu [pia]
  rationale: Kifungu cha pili cha Kigiriki hakina kitenzi kilichoandikwa, lakini kinachukua kiarifu kutoka kifungu cha kwanza. Kutaja ‘ni shahidi’ huifanya sintaksia iwe wazi kwa Kiswahili bila kuongeza dai jipya.
- issue: Jinsi ya kurejelea Roho Mtakatifu katika kishazi husishi
  choice: ambaye
  alternative: ambayo
  rationale: ‘Ambaye’ huwasilisha rejeleo la kibinafsi kwa njia ya kawaida ya Kiswahili. Umbo la Kigiriki ὃ ni la jinsia ya kati kwa sababu ya upatanisho wa kisarufi na πνεῦμα, si kwa lazima kwa sababu referenti si wa kibinafsi.
- issue: Wapokeaji wa Roho katika usemi wa ‘wale wanaomtii’
  choice: Kudumisha kauli ya moja kwa moja ya mstari bila kufafanua zaidi hali au kiwango cha utii
  alternative: Kufafanua ‘wanaomtii’ kwa maana finyu au ya kimadhehebu
  rationale: Andiko lenyewe linahusianisha zawadi ya Roho na wale wanaomtii Mungu. Tafsiri inahifadhi mvutano huo bila kuingiza mfumo wa kiteolojia usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nasi’ huendeleza kiunganishi cha Kigiriki καί kwa ufupi wa asili. Muundo ‘amewapa wale’ umechaguliwa kuliko ‘amewapa ... wale’ wenye utata, na ‘pia ni shahidi’ hufafanua kiarifu kilichodokezwa katika Kigiriki.
