  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: sw
  text: Huyu Mungu alimwinua hadi upande wake wa kuume, awe Kiongozi na Mwokozi,[a] ili awape Israeli toba na msamaha wa dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu alimwinua kwa mkono wake wa kuume awe Kiongozi na Mwokozi.” Maneno ya Kigiriki yanaweza kueleweka kuwa mkono wa kuume wa Mungu ndio uliotumiwa kumwinua; ingawa hapa huenda yanamaanisha kuinuliwa hadi mahali pa heshima kuu upande wa kuume wa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: Huyu ndiye
  rationale: Kiashiria hiki kina mkazo na kinamrejelea Yesu moja kwa moja; “Huyu ndiye” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: ἀρχηγὸν
  choice: Kiongozi
  rationale: Neno hili linaweza kumaanisha aliye mbele au mwenye kuongoza. Katika muktadha wa kuinuliwa na likiambatana na “Mwokozi,” “Kiongozi” ni wazi na haliongezi maana finyu ya kimadhehebu.
- source_word: σωτῆρα
  choice: Mwokozi
  rationale: Hili ndilo neno la kawaida na lenye uzito ufaao kwa σωτήρ katika muktadha huu wa kikristo.
- source_word: ὕψωσεν
  choice: alimwinua
  rationale: Kitenzi kinaonyesha kumweka Yesu katika cheo cha juu na heshima, si ufufuo peke yake; muktadha wa mkono wa kuume unadhihirisha kuinuliwa huku.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: mpaka mkono wake wa kuume
  rationale: Hii inawasilisha usomaji wa mahali au cheo—kuinuliwa hadi mahali pa heshima kuu upande wa kuume wa Mungu—huku uwezekano wa maana ya ala ukihifadhiwa katika tanbihi.
- source_word: τοῦ δοῦναι
  choice: ili awape
  rationale: Muundo wa infinitivu wenye artikeli unaonyesha kusudi; “ili awape” ni wa asili na huonyesha kusudi hilo wazi.
- source_word: μετάνοιαν
  choice: toba
  rationale: “Toba” ni neno la Kiswahili linaloeleweka kwa kugeuka kwa ndani na kwa mwenendo kumwelekea Mungu, si kubadili mawazo tu.
- source_word: τῷ Ἰσραὴλ
  choice: Israeli
  rationale: Israeli ndiye mpokeaji wa kile kinachotolewa; muundo wa “awape Israeli” ni wa kawaida katika Kiswahili.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: msamaha wa dhambi
  rationale: Huu ni usemi wa kawaida, wazi na sahihi kwa kuondolewa kwa hatia ya dhambi.
theological_decisions:
- issue: Maana ya kuinuliwa kwa Yesu katika τῇ δεξιᾷ αὐτοῦ
  choice: Mungu alimwinua Yesu mpaka mahali pa heshima na mamlaka kuu, mkono wake wa kuume.
  alternative: Mungu alimwinua Yesu kwa mkono wake wa kuume.
  rationale: Sintaksia na picha ya Agano Jipya ya kuketishwa katika mamlaka zinaunga mkono zaidi maana ya mahali au cheo, lakini hali ya dative katika Kigiriki pia inaruhusu maana ya ala; hivyo mbadala umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Mpaka mkono wake wa kuume” limetumiwa badala ya “kwenye mkono wake wa kuume” ili kueleza mwelekeo wa kuinuliwa; tanbihi inalinda utata halisi wa Kigiriki.
