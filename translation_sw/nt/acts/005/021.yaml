id: ACT.5.21
reference: Acts 5:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: sw
  text: Waliposikia hayo, waliingia katika nyua za Hekalu wakati wa mapambazuko, wakaendelea kufundisha. Lakini kuhani mkuu na wale waliokuwa pamoja naye walipofika, waliitisha Sanhedrini na baraza lote la wazee wa Waisraeli,[a] kisha wakatuma watu gerezani ili waletwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baraza lote la Israeli” au “jumuiya yote ya wazee wa Israeli.”
    reason: Hutoa tafsiri mbadala zilizo laini zaidi za γερουσία τῶν υἱῶν Ἰσραήλ bila kuamua kama kirai hiki kinafafanua Sanhedrini au kinataja mkutano mpana zaidi.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Waliposikia hayo
  rationale: Kirai cha wakati kinarejelea agizo la malaika katika mstari uliotangulia na kudumisha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: wakati wa mapambazuko
  rationale: Huwakilisha saa za alfajiri bila kuongeza usahihi wa wakati ambao Kigiriki hakitoi.
- source_word: ἱερὸν
  choice: nyua za Hekalu
  rationale: ἱερόν hapa ni eneo pana la Hekalu ambako watu wangeweza kufundishwa, si patakatifu pa ndani (ναός).
- source_word: ἐδίδασκον
  choice: wakawa wakifundisha
  rationale: Muundo huu unaonyesha kitendo kilichoendelea, kama wakati usiotimilifu wa Kigiriki.
- source_word: Παραγενόμενος
  choice: walipofika
  rationale: Kishirikishi cha aoristi kinatambulisha tukio linalofuata; muundo wa wakati ni wa asili katika Kiswahili.
- source_word: οἱ σὺν αὐτῷ
  choice: wale waliokuwa pamoja naye
  rationale: Hudumisha kutotajwa kwa utambulisho mahususi wa kundi hilo.
- source_word: συνεκάλεσαν
  choice: waliitisha
  rationale: Kitenzi kina maana ya kuita watu wakusanyike rasmi; “waliitisha” ni kifupi na cha kawaida.
- source_word: συνέδριον
  choice: Sanhedrini
  rationale: Ni jina la kihistoria la baraza kuu la Kiyahudi linalokusudiwa katika muktadha huu.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: baraza lote la wazee wa wana wa Israeli
  rationale: “Baraza la wazee” linaonyesha maana ya γερουσία, huku “wana wa Israeli” likihifadhi usemi wa kifamilia na kitaifa wa Kigiriki.
- source_word: δεσμωτήριον
  choice: gerezani
  rationale: Ni neno la kawaida na lenye hadhi kwa mahali pa kifungo.
- source_word: ἀχθῆναι αὐτούς
  choice: ili waletwe
  rationale: Muundo wa kutendwa unaonyesha kusudi la kutuma watu gerezani, bila kudai kwamba waliotuma ndio wangewaleta wenyewe.
theological_decisions:
- issue: Tafsiri ya τῶν υἱῶν Ἰσραήλ
  choice: wa wana wa Israeli
  alternative: wa Israeli; wa Waisraeli
  rationale: Usemi wa wazi wa kifamilia na kitaifa umehifadhiwa badala ya kufupishwa, huku tanbihi ikitoa namna ya kawaida zaidi ya Kiswahili.
- issue: Uhusiano kati ya συνέδριον na γερουσίαν
  choice: Sanhedrini na baraza lote la wazee
  alternative: Sanhedrini, yaani baraza lote la wazee
  rationale: Kiunganishi καί kimehifadhiwa ili kutoamua kimyakimya kama kirai cha pili ni chombo tofauti au ufafanuzi mpana wa Sanhedrini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyua za Hekalu” hufafanua eneo la ἱερόν; “wakawa wakifundisha” hudumisha hali ya kitendo kinachoendelea. Alama ya tanbihi [a] imewekwa mara moja baada ya kirai kinachohusika.
