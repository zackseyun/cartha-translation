  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: sw
  text: Lakini Anania aliposikia maneno hayo, alianguka chini, akafa.[a] Hofu kubwa ikawapata wote waliosikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “akatoa pumzi yake ya mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: aliposikia
  rationale: Kirai cha wakati kinaonyesha kwa Kiswahili cha kawaida kwamba kuanguka kwake kulifuata kusikia maneno hayo, bila kulazimisha muundo wa kirai endelevu wa Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaendeleza simulizi huku likionyesha badiliko lenye utofauti mdogo baada ya maneno ya Petro.
- source_word: ὁ Ἁνανίας
  choice: Anania
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: τοὺς λόγους τούτους
  choice: maneno hayo
  rationale: Katika muktadha huu λόγοι ni maneno ambayo Petro alikuwa amesema; 'maneno hayo' ni ya asili na yenye heshima katika Kiswahili.
- source_word: πεσὼν
  choice: akaanguka chini
  rationale: Huhifadhi taswira halisi ya kuanguka na mpangilio wa tendo kabla ya kifo, bila kutafsiri kwa neno lenye maana pana zaidi kama 'akazimia'.
- source_word: ἐξέψυξεν
  choice: na kufa
  rationale: Kitenzi kina maana ya kutoa pumzi ya mwisho, yaani kufa. 'Kufa' ni wazi katika simulizi la kisasa, huku maana halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: ἐγένετο φόβος μέγας ἐπὶ
  choice: Hofu kubwa ikawapata
  rationale: Muundo huu wa Kiswahili unaeleza kwa asili kuanza na kuenea kwa hofu, na unahifadhi wazo la hofu kuwajia watu.
- source_word: πάντας τοὺς ἀκούοντας
  choice: wote waliosikia
  rationale: Huhifadhi upana wa kirai cha Kigiriki bila kuongeza walichosikia, iwe ni tukio lenyewe au habari yake.
theological_decisions:
- issue: Chanzo au utaratibu wa kifo cha Anania
  choice: Tukio limeelezwa moja kwa moja kuwa alianguka chini na kufa, bila kutaja kilichosababisha kifo hicho.
  alternative: Kusema kwamba Mungu alimpiga akafa, au kwamba alikufa kwa mshtuko.
  rationale: Kigiriki kinaeleza kuanguka na kufa kwake lakini hakibainishi utaratibu wa kimungu au wa kiasili. Tafsiri inahifadhi mvutano huo bila kuongeza maelezo ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Mfuatano wa vitenzi kwa 'aka-' umetumiwa kuendeleza simulizi kwa asili; hakuna maelezo ya kimadhehebu yaliyoingizwa.
