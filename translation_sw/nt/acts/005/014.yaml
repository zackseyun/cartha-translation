base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: sw
  text: Na zaidi na zaidi, watu waliomwamini Bwana walikuwa wakiongezwa—idadi kubwa ya wanaume na wanawake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakijiunga” au “walikuwa wakiongezeka.” Kitenzi cha Kigiriki huonyesha ongezeko lililoendelea; kauli ya kutendwa inaweza kudokeza kwamba Mungu ndiye aliyekuwa akiwaongeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον
  choice: walizidi
  rationale: Huwasilisha ongezeko linaloendelea na nguvu ya ulinganisho ya neno la Kigiriki kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Na
  rationale: Hapa ni kiunganishi chepesi cha kuendeleza simulizi, wala si pingamizi lenye nguvu.
- source_word: προσετίθεντο
  choice: kuongezwa
  rationale: Kauli ya kutendwa pamoja na kitenzi cha hali endelevu huhifadhi wazo la watu kuendelea kuongezwa, bila kumtaja wazi mtendaji ambaye Kigiriki hakumtaji.
- source_word: πιστεύοντες
  choice: watu waliomwamini
  rationale: Kirai hiki cha Kiswahili huonyesha kwa kawaida na kwa uwazi watu wenye imani iliyoelekezwa kwa Bwana.
- source_word: τῷ κυρίῳ
  choice: Bwana
  rationale: Kiswahili hutumia kitenzi 'kuamini' na yambwa moja kwa moja; hivyo 'waliomwamini Bwana' huwasilisha imani inayoelekezwa kwake bila kulazimisha muundo wa Kigiriki.
- source_word: πλήθη
  choice: idadi kubwa
  rationale: Hutoa maana ya wingi mkubwa wa watu kwa lugha ya sasa na ya asili, bila kudokeza lazima kwamba walikuwa umati uliokusanyika mahali pamoja.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: ya wanaume na wanawake
  rationale: Huhifadhi kwa uwazi kutajwa kwa makundi yote mawili na utegemezi wake kwa 'idadi kubwa'.
theological_decisions:
- issue: Rejeo na maana ya 'Bwana'
  choice: '''Bwana'' limehifadhiwa kama cheo, huku muktadha ukielekeza kwa Yesu ambaye watu walimwamini.'
  alternative: '''Bwana'' lingeweza kueleweka kwa maana ya jumla zaidi kuwa Mungu.'
  rationale: Katika muhtasari wa kiinjili wa Matendo, κύριος mara nyingi humrejelea Yesu aliyefufuka. Tafsiri haijaweka jina 'Yesu' badala ya cheo, hivyo haiongezi ufafanuzi usiotajwa wazi katika Kigiriki.
- issue: Kauli na hali ya προσετίθεντο
  choice: 'Maana ya kutendwa inayoendelea: ''walizidi kuongezwa.'''
  alternative: 'Maana ya kati au isiyo na yambwa: ''walizidi kujiunga'' au ''waliongezeka.'''
  rationale: Kauli ya kutendwa huhifadhi uwezekano kwamba Mungu ndiye anayewaongeza, bila kumfanya kuwa mtendaji aliyetajwa wazi wakati maandishi ya Kigiriki hayafanyi hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'watu waliomwamini Bwana' ni wa kawaida zaidi kuliko 'waumini katika Bwana,' na 'idadi kubwa' huepuka taswira isiyo ya lazima ya umati uliokusanyika.
