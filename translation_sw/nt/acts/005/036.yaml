base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: sw
  text: Kwa maana kabla ya siku hizi alitokea Theuda, akidai kuwa yeye ni mtu mashuhuri,[a] na wanaume wapatao mia nne wakajiunga naye.[b] Aliuawa, na wote waliokuwa wameshawishiwa naye[c] wakatawanyika, wakawa bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “akidai kuwa yeye ni mtu wa maana.” Msemo wa Kigiriki unaonyesha kwamba alijionyesha kuwa mtu mwenye umuhimu.'
    reason: lexical_alternative
  - marker: b
    text: Au “wakajifungamanisha naye” au “wakakusanyika upande wake.”
    reason: lexical_alternative
  - marker: c
    text: Au “wote waliomfuata.” Kwa maana ya karibu zaidi na Kigiriki, “wote waliokuwa wameshawishiwa naye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: Kwa maana kabla ya siku hizi
  rationale: πρό pamoja na jenitivi huonyesha wakati uliotangulia, na γάρ imehifadhiwa kama “Kwa maana” ili kuendeleza hoja ya ufafanuzi ya Gamalieli.
- source_word: ἀνέστη
  choice: alitokea
  rationale: Katika muktadha huu kitenzi kinaeleza kujitokeza kwa kiongozi wa harakati, si kufufuka kihalisi.
- source_word: Θευδᾶς
  choice: Theuda
  rationale: Jina limetoholewa kwa namna inayolingana na mazoea ya Kiswahili.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: akidai kuwa yeye ni mtu mashuhuri
  rationale: Msemo huu unaonyesha kwamba Theuda alijitambulisha kama mtu mwenye umuhimu; “mtu mashuhuri” huwasilisha maana ya nahau kwa Kiswahili cha kawaida.
- source_word: ᾧ προσεκλίθη
  choice: wakajiunga naye
  rationale: Kitenzi kinaonyesha kujifungamanisha au kujiunga na kiongozi; “wakajiunga naye” ni wazi na ya kawaida.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: wanaume wapatao mia nne
  rationale: ἀνδρῶν inawahusu wanaume, na ὡς inaonyesha makadirio; “wapatao” huhifadhi maana hiyo kwa ufupi.
- source_word: ὃς ἀνῃρέθη
  choice: Aliuawa
  rationale: ἀναιρέω hapa humaanisha kuua; umbo la kutendwa limehifadhiwa.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: wote waliokuwa wameshawishiwa kumfuata
  rationale: πείθω hapa ina dhana ya kushawishiwa au kuvutwa upande wake, si kufuata tu; tafsiri hii huhifadhi dhana hiyo kwa Kiswahili cha asili.
- source_word: διελύθησαν
  choice: wakatawanyika
  rationale: Neno linaeleza kuvunjika na kutawanyika kwa kundi baada ya kiongozi wake kuuawa.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: harakati hiyo ikaishia patupu
  rationale: Nahau inaonyesha kwamba jambo lote lilivunjika na kutokuwa na matokeo; kutaja “harakati hiyo” huweka rejeo wazi katika Kiswahili bila kubadili maana.
theological_decisions:
- issue: Taarifa ya kihistoria kuhusu Theuda ndani ya hotuba ya Gamalieli
  choice: Kauli imetafsiriwa moja kwa moja kama sehemu ya hoja ya Gamalieli.
  alternative: Kuweka maneno yanayodokeza shaka kuhusu historia yake au kubadili kauli ili ilingane na rekonstraksheni za kihistoria za nje.
  rationale: Tafsiri inapaswa kuwasilisha ushahidi wa Kigiriki kama ulivyo bila kuingiza upatanisho au hukumu ya kihistoria katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa hoja na makadirio ya idadi vimehifadhiwa; nahau za Kigiriki zimetolewa kwa Kiswahili cha sasa.
