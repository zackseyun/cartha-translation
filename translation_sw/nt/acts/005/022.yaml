  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: sw
  text: Lakini wale maafisa walipofika, hawakuwakuta gerezani. Basi wakarudi wakatoa taarifa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: walipofika
  rationale: Kitenzi hiki cha hali kinaonyesha wakati maofisa walipowasili gerezani; “walipofika” ni Kiswahili cha kawaida na hudumisha uhusiano huo wa wakati.
- source_word: ὑπηρέται
  choice: maofisa
  rationale: Katika muktadha huu neno linawahusu watumishi wenye jukumu rasmi chini ya viongozi wa Kiyahudi, si watumishi wa nyumbani. “Maofisa” linaonyesha hadhi yao rasmi bila kuongeza kwa wazi kwamba walikuwa polisi wa Hekalu.
- source_word: οὐχ εὗρον
  choice: hawakuwakuta
  rationale: “Kuwakuta” ni usemi wa kawaida katika simulizi kwa maana ya kutowapata watu mahali walipotarajiwa kuwapo.
- source_word: ἐν τῇ φυλακῇ
  choice: gerezani
  rationale: “Gerezani” ni Kiswahili cha asili kinachoonyesha mahali hususa palipotajwa katika muktadha, bila kulazimisha kurudia kiashiria cha uhakika ambacho Kiswahili hakihitaji.
- source_word: ἀναστρέψαντες
  choice: wakarudi
  rationale: Katika muktadha huu linaonyesha kwamba waligeuka na kurudi kwa wale waliowatuma; “wakarudi” ni fupi na ya kawaida.
- source_word: ἀπήγγειλαν
  choice: kutoa taarifa
  rationale: Kitenzi kina maana ya kupeleka habari au ripoti. “Kutoa taarifa” kinafaa kwa mazingira rasmi na kinaepuka utata wa “kutangaza.”
- source_word: δέ
  choice: Lakini / Basi
  rationale: δέ ya kwanza inaonyesha tofauti kati ya matarajio na walichokuta, hivyo “Lakini” linafaa. Ya pili inaendeleza matokeo ya tukio, ambayo kwa kawaida yanaelezwa kwa “Basi” katika Kiswahili.
