base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: sw
  text: Lakini Petro akamjibu, “Niambie, je, mliuza ardhi[a] kwa kiasi hiki?” Naye akasema, “Ndiyo, kwa kiasi hiki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiwanja,” “shamba,” au “mali” kwa χωρίον.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν
  choice: Lakini Petro akamjibu
  rationale: ‘Lakini’ linaonyesha mgeuko wa simulizi unaoletwa na δέ, huku ‘akamjibu’ likitoa kwa Kiswahili cha kawaida maana ya ἀπεκρίθη πρὸς αὐτήν.
- source_word: Εἰπέ μοι
  choice: Niambie
  rationale: Hili ni agizo la moja kwa moja na la kawaida katika Kiswahili, linalohifadhi maana ya ‘niambie’ bila tafsiri ngumu ya neno kwa neno.
- source_word: εἰ
  choice: je
  rationale: Hapa εἰ linaanzisha swali linalotarajia jibu la ndiyo au hapana; ‘je’ hulitoa kwa uwazi na kwa mtindo wa kawaida wa Kiswahili.
- source_word: τοσούτου
  choice: kwa kiasi hiki
  rationale: Usemi huu unarejelea kiasi kilichotajwa au kilicho mbele yao; ‘kwa kiasi hiki’ huhifadhi nguvu ya urejezi bila kuongeza dhana ya bei isiyotajwa wazi.
- source_word: τὸ χωρίον
  choice: shamba
  rationale: χωρίον inaweza kumaanisha kipande cha ardhi, shamba, au mali isiyohamishika. ‘Shamba’ ni neno la kawaida na linalofaa katika muktadha huu wa kuuza ardhi.
- source_word: ἀπέδοσθε
  choice: mliuza
  rationale: Katika muktadha wa biashara, ἀποδίδωμι lina maana ya kuuza. Wingi wa kitenzi umehifadhiwa kwa ‘mliuza,’ kwa kuwa Kigiriki kinawahusisha Safira na Anania.
- source_word: Ναί
  choice: Ndiyo
  rationale: Ni jibu rahisi la kukubali na linalolingana moja kwa moja na matumizi ya Ναί.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Wingi katika ‘mliuza’ umehifadhiwa kwa uaminifu kwa umbo la Kigiriki, na marudio ya ‘kwa kiasi hiki’ yamedumishwa ili kuonyesha mwangwi wa jibu la Safira.
