  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: sw
  text: Lakini mtu mmoja akaja akawaarifu, “Tazameni! Wale wanaume mliowatia gerezani wamesimama katika eneo la hekalu[a] na wanawafundisha watu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika nyua za hekalu”; neno la Kigiriki ἱερόν linamaanisha eneo lote la hekalu, wala si patakatifu pa ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος δέ τις
  choice: Lakini mtu mmoja akaja
  rationale: Kishiriki cha aoristi kinaonyesha kuwasili kwa mtoa habari kabla ya kitendo kikuu; ‘akaja’ ni ya asili katika masimulizi ya Kiswahili. δέ inaonyesha badiliko dogo lenye hali ya kutofautisha, hivyo ‘Lakini’ inafaa.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: akawaarifu
  rationale: Kitenzi hiki kinaeleza kufikisha taarifa kwa walio na mamlaka; ‘akawaarifu’ ni cha kawaida na chenye heshima, huku kiambishi -wa- kikihifadhi maana ya ‘kwao’.
- source_word: Ἰδοὺ
  choice: Tazameni!
  rationale: Neno hili linavuta fikira kwa habari ya kushangaza. Wingi unawalenga wale waliokuwa wakipokea taarifa, bila kutumia lugha ya kizamani.
- source_word: οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: Wale watu mliowatia gerezani
  rationale: ‘Wale watu’ huwarejelea kwa kawaida wanaume waliotajwa katika muktadha. ‘Mliowatia gerezani’ hutoa maana ya kuwaweka kifungoni bila kuongeza maelezo.
- source_word: ἐν τῷ ἱερῷ
  choice: katika eneo la hekalu
  rationale: ἱερόν hapa ni eneo lote la hekalu, si patakatifu pa ndani pekee. ‘Eneo la hekalu’ linaweka tofauti hiyo wazi kwa msomaji wa kawaida.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: wamesimama ... na wanawafundisha watu
  rationale: ‘Wamesimama’ hudumisha hali inayotokana na kitendo kilichotimia ya ἑστῶτες, na ‘wanawafundisha watu’ huonyesha tendo linaloendelea.
