  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: sw
  text: Lakini Petro akamwambia, “Kwa nini mmekubaliana[a] kumjaribu Roho wa Bwana? Tazama, miguu ya wale waliomzika mume wako iko mlangoni, nao watakubeba wakutoe nje.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmepanga njama pamoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ὅτι
  choice: Kwa nini
  rationale: Hutoa kwa Kiswahili cha kawaida nguvu ya swali la kukemea linalouliza sababu.
- source_word: συνεφωνήθη ὑμῖν
  choice: mmekubaliana
  rationale: Muundo huu unaonyesha makubaliano ya pamoja kati ya Safira na mume wake bila kuongeza moja kwa moja wazo lenye nguvu zaidi la kula njama.
- source_word: πειράσαι
  choice: kumjaribu
  rationale: Kitenzi hiki kinaweza kumaanisha kujaribu au kuweka katika majaribu; hapa ‘kumjaribu’ humaanisha kumweka Roho kwenye jaribio, si kumshawishi atende dhambi.
- source_word: τὸ πνεῦμα κυρίου
  choice: Roho wa Bwana
  rationale: Huhifadhi uhusiano wa kirai cha Kigiriki bila kukipanua kuwa ‘Roho Mtakatifu,’ ingawa muktadha unaelekea wazi kwa Roho Mtakatifu.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Ni tamko la sasa na lenye hadhi linalovuta fikira kwa jambo linalofuata.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: miguu ya wale waliomzika
  rationale: Huhifadhi taswira halisi ya ‘miguu’ na haiongezi ‘wanaume,’ jambo ambalo halijasemwa wazi katika Kigiriki.
- source_word: τὸν ἄνδρα σου
  choice: mume wako
  rationale: Katika muktadha wa Safira na Anania, ἀνήρ humaanisha mume.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: mlangoni
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuwapo papo hapo kwenye mwingilio.
- source_word: ἐξοίσουσίν σε
  choice: watakutoa nje
  rationale: Huhifadhi kauli ya moja kwa moja na ya kutisha bila kuongeza maneno ‘maiti yako,’ ambayo yanaeleweka katika muktadha lakini hayajasemwa wazi.
theological_decisions:
- issue: Anayerejelewa na ‘Roho wa Bwana’
  choice: Maneno yamehifadhiwa kama ‘Roho wa Bwana,’ yakielekea kwa Roho Mtakatifu kulingana na muktadha.
  alternative: Kupanua kuwa ‘Roho Mtakatifu’ au kuelewa kwa ujumla kuwa uwepo wa kiroho wa Bwana.
  rationale: Matendo 5:3 huufanya urejeo kwa Roho Mtakatifu kuwa wenye nguvu, lakini tafsiri haiongezi kivumishi ‘Mtakatifu’ ambacho hakipo katika mstari huu.
- issue: Uzito wa shtaka la Petro
  choice: mmekubaliana
  alternative: mmekula njama
  rationale: Kitenzi chenyewe hueleza kufikia makubaliano; ubaya na uzito wa ushirikiano huo unaonekana katika muktadha bila kuingiza maana kali zaidi katika neno lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama za tanbihi zimewekwa karibu na maneno yanayohusika; nafasi zao zimerekebishwa ili ziendane na maudhui ya tanbihi.
