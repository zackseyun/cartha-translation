  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: sw
  text: Na pia, umati wa watu kutoka miji iliyozunguka Yerusalemu ulikuwa ukikusanyika[a], ukiwaleta wagonjwa na wale waliokuwa wakisumbuliwa na pepo wachafu[b]; nao wote walikuwa wakiponywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulikuwa ukija pamoja.”
    reason: lexical_alternative
  - marker: b
    text: Au, “waliokuwa wakiteswa na pepo wachafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: ulikuwa ukikusanyika
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea au kujirudia; muundo huu wa Kiswahili unahifadhi hali hiyo.
- source_word: τὸ πλῆθος
  choice: umati wa watu
  rationale: Huwakilisha idadi kubwa ya watu kama kundi moja, kwa lugha ya kawaida na yenye hadhi.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: kutoka miji iliyozunguka Yerusalemu
  rationale: Inaonyesha makazi ya mijini yaliyo karibu na Yerusalemu bila kuyafanya kuwa sehemu ya jiji lenyewe.
- source_word: φέροντες
  choice: wakiwaleta
  rationale: Kitenzi kishirikishi kinaeleza walichokuwa wakifanya walipokusanyika; kiambishi cha yambwa kinaeleza wazi kuwa walileta watu.
- source_word: ἀσθενεῖς
  choice: wagonjwa
  rationale: Katika muktadha wa uponyaji, neno hili kwa kawaida humaanisha watu wenye maradhi.
- source_word: ὀχλουμένους
  choice: waliokuwa wakisumbuliwa
  rationale: Huhifadhi maana pana ya kuudhiwa au kuteswa bila kulazimisha kiwango kikali zaidi kuliko neno la Kigiriki linavyodai.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: na roho wachafu
  rationale: Ni msemo wa kawaida wa kibiblia unaorejelea roho waovu binafsi na kuhifadhi wazo la uchafu.
- source_word: οἵτινες
  choice: nao
  rationale: Inarejelea kwa pamoja makundi mawili yaliyotajwa na kuyaunganisha kiasili na taarifa inayofuata.
- source_word: ἐθεραπεύοντο
  choice: walikuwa wakiponywa
  rationale: Muundo huu unahifadhi kauli tendwa na hali ya tendo lililokuwa likiendelea au kujirudia.
- source_word: ἅπαντες
  choice: wote
  rationale: Inahifadhi msisitizo kwamba kila mmoja wa wale walio brought aliponywa.
theological_decisions:
- issue: Tafsiri ya πνευμάτων ἀκαθάρτων
  choice: roho wachafu
  alternative: roho najisi
  rationale: “Roho wachafu” ni msemo wa kibiblia unaoeleweka katika Kiswahili na haupunguzi viumbe hao kuwa hali za kisaikolojia au tamathali.
- issue: Upeo wa ἅπαντες
  choice: nao wote walikuwa wakiponywa
  alternative: wote waliponywa
  rationale: “Wote” inawahusu wagonjwa na wale waliosumbuliwa na roho wachafu; muundo wa kuendelea unahifadhi hali ya wakati usiotimilika bila kuongeza maelezo ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Umati wa watu” ni cha kawaida kuliko “mkutano mkubwa,” na “ulikuwa ukikusanyika” huhifadhi tendo linaloendelea. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
