  rationale: The revision corrects subject agreement, uses a natural connective for the Greek δὲ καί, and adopts the standard biblical Swahili expression "pepo wachafu." It retains the imperfect aspect of both gathering and healing, the passive sense of healing, and the inclusive force of "wote."
