  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: sw
  text: Basi wakaondoka kutoka mbele ya Baraza, wakifurahi kwa kuwa walihesabiwa kuwa wanastahili kuaibishwa kwa ajili ya Jina[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jina la Yesu.” Kigiriki kina “Jina,” usemi wa heshima usiotaja mhusika wazi katika matini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: wakaondoka
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha mwendo wao kutoka mbele ya Baraza; “wakaondoka” ni simulizi la kawaida la Kiswahili na halifanyi tendo hilo kuwa tukio lililojitenga na muktadha.
- source_word: χαίροντες
  choice: wakifurahi
  rationale: Hifadhi hali iliyoambatana na kuondoka kwao na huunganika kwa kawaida na sababu inayofuata.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: mbele ya Baraza
  rationale: Hii ni nahau ya kutoka katika uwepo wa baraza. “Wakaondoka mbele ya Baraza” ni ya asili kwa Kiswahili huku ikihifadhi wazo la kuwa walikuwa mbele yake.
- source_word: συνεδρίου
  choice: Baraza
  rationale: Neno la kawaida “Baraza” linaeleweka kwa urahisi na linawakilisha chombo hicho cha utawala bila kulazimisha jina la mkopo “Sanhedrini.” Herufi kubwa inaonyesha baraza hilo maalumu katika muktadha.
- source_word: κατηξιώθησαν
  choice: walihesabiwa kuwa wanastahili
  rationale: Huhifadhi hali ya kutendwa na maana ya kutathminiwa au kuonwa kuwa wenye kustahili.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Katika muktadha huu huonyesha sababu au uhusiano wa mateso yao na Jina; “kwa ajili ya” ni usemi wa kawaida na sahihi.
- source_word: τοῦ ὀνόματος
  choice: Jina
  rationale: Hifadhi usemi kamili wa Kigiriki usiotaja mhusika waziwazi na uzito wake wa heshima, badala ya kuongeza “la Yesu” katika matini.
- source_word: ἀτιμασθῆναι
  choice: kuaibishwa
  rationale: Huhifadhi hali ya kutendwa na maana ya kutendewa jambo la kushusha heshima katika mfumo wa heshima na aibu.
theological_decisions:
- issue: Matumizi kamili ya “Jina” bila kutaja mhusika
  choice: Jina
  alternative: jina la Yesu
  rationale: Kigiriki kinasema tu τοῦ ὀνόματος, yaani “Jina.” Ingawa muktadha unaelekeza kwa Yesu, kutolitaja wazi katika matini huhifadhi ufupi wa heshima na mvutano wa kitheolojia wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “wakifurahi kwa kuwa” unaendeleza mtiririko wa simulizi, na “Jina” limeandikwa kwa herufi kubwa ili kuonyesha matumizi yake ya heshima bila kuongeza mhusika ambaye Kigiriki hakumtaji wazi.
