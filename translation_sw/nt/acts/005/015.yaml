  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: sw
  text: Hata wakawa wakiwatoa wagonjwa hadi barabarani[a], na kuwaweka kwenye vitanda vidogo na mikeka[b], ili Petro alipokuwa akipita, angalau kivuli chake kiangukie mmoja wao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye viwanja vya hadhara.” Neno la Kigiriki πλατείας linaweza kumaanisha barabara pana au maeneo ya wazi ya umma.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye vitanda na magodoro mepesi.” Kigiriki kinatofautisha aina mbili za vifaa vya kulalia.
    reason: lexical_alternative
  - marker: c
    text: 'Mstari unaeleza kusudi la watu: waliwaweka wagonjwa hapo ili angalau kivuli cha Petro kiangukie mmoja wao. Hausemi wazi katika mstari huu kwamba kivuli chenyewe kilimponya mtu.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha matokeo ya kuongezeka kwa ushawishi wa mitume katika muktadha uliotangulia, kwa Kiswahili cha kawaida na cha wazi.
- source_word: καὶ εἰς τὰς πλατείας
  choice: hata ... nje barabarani
  rationale: ‘Hata’ linabeba msisitizo wa καί, huku ‘barabarani’ likitaja mahali pa wazi ambapo watu wangepita; uwezekano wa ‘viwanja vya hadhara’ umewekwa katika tanbihi.
- source_word: ἐκφέρειν
  choice: waliwabeba ... na kuwapeleka nje
  rationale: Inaeleza kuwatoa wagonjwa kutoka ndani na kuwapeleka mahali pa wazi, bila kudokeza kuwa waliweza kutembea wenyewe.
- source_word: τοὺς ἀσθενεῖς
  choice: wagonjwa
  rationale: Katika muktadha wa uponyaji, neno hili linamaanisha watu waliokuwa wagonjwa au wenye udhaifu wa mwili.
- source_word: τιθέναι
  choice: wakawalaza
  rationale: Ni usemi wa kawaida kwa kuwaweka wagonjwa juu ya vifaa vya kulalia.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: kwenye vitanda vidogo na mikeka
  rationale: Tafsiri hii inadumisha tofauti kati ya aina mbili za vifaa vya kulalia au kubebea wagonjwa kwa maneno yanayoeleweka kwa wasomaji wa leo.
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi au matokeo yaliyokusudiwa na watu waliowaweka wagonjwa hapo.
- source_word: ἐρχομένου Πέτρου
  choice: Petro alipokuwa akipita
  rationale: Muundo wa Kigiriki unaonyesha tendo lililokuwa likiendelea wakati Petro akipita karibu nao.
- source_word: κἂν
  choice: angalau
  rationale: 'Linaonyesha tumaini la kiwango cha chini kabisa: hata kivuli chake tu kingewafikia.'
- source_word: ἡ σκιά
  choice: kivuli chake
  rationale: Ni kivuli halisi cha Petro; hakuna dalili ya maana ya kitamathali.
- source_word: ἐπισκιάσῃ
  choice: kiweze kumfunika
  rationale: Inahifadhi wazo la kivuli kumfunika mtu, pamoja na hali ya uwezekano inayoletwa na kiima tegemezi cha Kigiriki.
- source_word: τινὶ αὐτῶν
  choice: mmoja wao
  rationale: 'Inahifadhi umoja usio maalumu wa Kigiriki: mtu yeyote mmoja miongoni mwa wagonjwa waliokusanyika.'
theological_decisions:
- issue: Iwapo mstari useme kwamba kivuli cha Petro chenyewe kilikuwa na nguvu ya kuponya
  choice: Tafsiri inaeleza kusudi na tumaini la watu bila kusema kwamba kivuli chenyewe kiliponya.
  alternative: Kutafsiri kwa namna inayodokeza wazi kwamba nguvu ya kuponya ilikaa ndani ya kivuli cha Petro.
  rationale: Muundo wa ἵνα pamoja na kitenzi cha hali tegemezi unaonyesha walivyoweka wagonjwa kwa kusudi hilo. Mstari huu wenyewe hausemi moja kwa moja kwamba kivuli kiliponya, ingawa muktadha mpana unasimulia uponyaji mwingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. Muundo umeepuka lugha ya kimadhehebu na umehifadhi tofauti kati ya taarifa ya matendo ya watu na tumaini lao kuhusu kivuli cha Petro.
