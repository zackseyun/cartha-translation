base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: sw
  text: Lakini hakuna hata mmoja wa wale wengine aliyethubutu kujiunga nao; badala yake, watu waliwaheshimu sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: Lakini ... wa wale wengine
  rationale: “Wale wengine” huhifadhi utofautishaji wa kundi lisilotajwa wazi na muktadha, bila kulifafanua kupita chanzo.
- source_word: οὐδεὶς ἐτόλμα
  choice: hakuna hata mmoja ... aliyethubutu
  rationale: Huwasilisha kwa msisitizo maana ya οὐδείς pamoja na wazo la ujasiri katika ἐτόλμα.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: kujiunga nao
  rationale: Katika muktadha huu, kitenzi kina maana ya kujishikamanisha au kuambatana na kundi; “kujiunga nao” ni Kiswahili cha kawaida kinachohifadhi maana bila kudai uanachama rasmi.
- source_word: ἀλλ’
  choice: hata hivyo
  rationale: Hapa kiunganishi kinaonyesha tofauti kati ya watu kutothubutu kujiunga na mitume na kuwaheshimu; “hata hivyo” huonyesha tofauti hiyo kwa kawaida.
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: watu waliwaheshimu sana
  rationale: Ingawa μεγα λύνω kwa msingi ni ‘kutukuza/kuona kuwa wakuu,’ katika muktadha huu inaeleza kuwathamini na kuwaheshimu sana. Wingi wa kawaida wa Kiswahili kwa “watu” umetumiwa.
theological_decisions:
- issue: Utambulisho wa “wale wengine” na kiwakilishi “wao”
  choice: Viashirio vimeachwa bila ufafanuzi wa ziada.
  alternative: Kutaja wazi kuwa ni wasioamini, waumini wengine, au mitume.
  rationale: Kigiriki hakitambulishi “wale wengine” moja kwa moja, na rejeleo la αὐτοῖς hutegemea muktadha; tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku utofautishaji na utata halisi wa chanzo vikihifadhiwa.
