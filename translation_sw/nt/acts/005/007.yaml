  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: sw
  text: Baada ya muda wa takriban saa tatu, mke wake akaingia bila kujua kilichokuwa kimetokea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Baada ya
  rationale: Muundo huu unaendeleza simulizi kwa kutambulisha tukio linalofuata. Katika Kiswahili, kishazi cha wakati pamoja na kiambishi cha mfululizo katika “akaingia” huwasilisha mwendelezo huo kwa kawaida bila kuongeza neno la wazi kama “basi”.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: muda wa karibu saa tatu
  rationale: διάστημα ni kipindi au muda uliopita, na ὡς pamoja na kipimo huonyesha ukadiriaji; “karibu saa tatu” inadumisha maana hiyo bila kufanya muda uwe kamili kupita ilivyo katika chanzo.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: mke wake
  rationale: Katika muktadha huu γυνή humaanisha mwenzi wa ndoa wa Anania, hivyo “mke wake” ni tafsiri sahihi na ya kawaida.
- source_word: μὴ εἰδυῖα
  choice: bila kujua
  rationale: Kirai hiki kinaonyesha hali ya mke wakati wa kuingia; “bila kujua” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa wakati mmoja.
- source_word: τὸ γεγονὸς
  choice: yaliyokuwa yametokea
  rationale: Kishiriki timilifu kilichotumiwa kama nomino kinarejelea mambo yaliyokwisha kutokea kabla ya kuingia kwake. Muundo wa “yalikuwa yametokea” unaonyesha utangulizi huo wa wakati kwa uwazi.
- source_word: εἰσῆλθεν
  choice: akaingia
  rationale: Kitenzi kinamaanisha kuingia ndani. Kiambishi “ka-” kinafaa katika simulizi kwa tukio linalofuata baada ya kipindi kilichotajwa.
