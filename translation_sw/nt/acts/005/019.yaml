  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: sw
  text: Lakini wakati wa usiku, malaika wa Bwana alifungua milango ya gereza, akawatoa nje, akasema,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: malaika
  rationale: Katika muktadha huu neno hili linamaanisha kiumbe wa mbinguni; Kiswahili ‘malaika’ ni wazi na la kawaida, bila kuongeza uainisho ambao hauko katika Kigiriki.
- source_word: κυρίου
  choice: wa Bwana
  rationale: ‘Bwana’ huhifadhi maana ya κύριος na usemi wa kibiblia uliozoeleka ‘malaika wa Bwana.’
- source_word: διὰ νυκτός
  choice: wakati wa usiku
  rationale: Kirai hiki kina maana ya wakati; tafsiri hii ni ya asili katika Kiswahili cha sasa na haiongezi wazo la siri.
- source_word: ἤνοιξε
  choice: alifungua
  rationale: Kitenzi kinamaanisha kufungua; ‘alifungua’ huepuka kuongeza wazo la kufungua kufuli ambalo halijasemwa.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: milango ya gereza
  rationale: ‘Milango’ huwakilisha wingi wa θύρας, na ‘gereza’ huwasilisha φυλακή kwa Kiswahili cha kawaida.
- source_word: ἐξαγαγών
  choice: akawatoa nje
  rationale: Tafsiri hii inaonyesha kwamba malaika aliwasababisha watoke, bila kuongeza namna maalumu ya kuwaongoza.
- source_word: τε
  choice: na
  rationale: Kiunganishi hiki kinaunganisha tendo la kuwatoa na tendo la kusema; ‘na’ ni cha kawaida na cha kutosha.
- source_word: εἶπεν
  choice: kusema
  rationale: Kwa kuwa maneno yenyewe yanafuata katika aya inayofuata, ‘kusema’ huendeleza sentensi kwa kawaida.
theological_decisions:
- issue: Asili ya ἄγγελος katika muktadha
  choice: malaika wa mbinguni
  alternative: mjumbe wa kibinadamu
  rationale: Kufunguliwa kwa milango ya gereza na kutolewa kwa wafungwa katika simulizi hili kunaonyesha tendo lisilo la kawaida la malaika, si mjumbe wa kibinadamu.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: ‘Bwana’ ni tafsiri ya kawaida ya κύριος na huhifadhi usemi wa kibiblia ‘malaika wa Bwana’ bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa vitenzi mfululizo ‘alifungua … akawatoa … na kusema’ huhifadhi mtiririko wa simulizi la Kigiriki bila kuwa mgumu.
