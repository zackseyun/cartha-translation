  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: sw
  text: Na kila siku, hekaluni na nyumba kwa nyumba, hawakuacha kufundisha na kutangaza habari njema kwamba Yesu ndiye Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutangaza habari njema kuhusu Yesu Masihi” au “kumtangaza Yesu kuwa Masihi.”
    reason: Kirai τὸν χριστὸν Ἰησοῦν kinaweza kuwakilishwa kama yaliyomo katika tangazo au kama kirai-yambwa, hivyo tanbihi huhifadhi uwezekano huo wa kisintaksia.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: Na kila siku
  rationale: Kirai hiki kinaonyesha wakati unaoendelea kwa mazoea; “kila siku” ni Kiswahili cha kawaida na huhifadhi uhusiano wa τε na simulizi lililotangulia.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: ἱερόν hapa ni eneo la hekalu kwa ujumla. “Hekaluni” ni fupi na ya kawaida bila kudai kwamba walikuwa ndani ya patakatifu penyewe.
- source_word: κατ’ οἶκον
  choice: nyumba kwa nyumba
  rationale: κατά pamoja na οἶκον ya umoja ina nguvu ya ugawaji; “nyumba kwa nyumba” huonyesha huduma iliyofanywa katika nyumba mbalimbali, si nyumbani kwao tu.
- source_word: οὐκ ἐπαύοντο
  choice: hawakuacha
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha kwamba tendo hilo liliendelea; “hawakuacha” ni cha asili na wazi katika Kiswahili cha sasa.
- source_word: διδάσκοντες
  choice: kufundisha
  rationale: Hili ndilo neno la kawaida na sahihi kwa tendo la kutoa mafundisho linaloendelea.
- source_word: εὐαγγελιζόμενοι
  choice: kutangaza habari njema
  rationale: Tafsiri hii huwasilisha maana ya kutangaza ujumbe mwema kwa lugha inayoeleweka, badala ya kutegemea istilahi ya kidini pekee.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: kwamba Yesu ndiye Masihi
  rationale: Muundo huu baada ya εὐαγγελιζόμενοι unaweza kueleza yaliyomo katika tangazo. “Kwamba Yesu ndiye Masihi” ni Kiswahili cha asili kinachoweka wazi dai la utambulisho bila kugeuza Χριστός kuwa jina binafsi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός hapa inafanya kazi kama cheo kinachomtambulisha Yesu kuwa Mtiwa-Mafuta aliyeahidiwa; “Masihi” huhifadhi maana ya cheo hicho badala ya kukifanya kionekane tu kama sehemu ya jina.
- issue: Nguvu ya kisintaksia ya τὸν χριστὸν Ἰησοῦν baada ya εὐαγγελιζόμενοι
  choice: kwamba Yesu ndiye Masihi
  alternative: habari njema kuhusu Yesu Masihi / kumtangaza Yesu kuwa Masihi
  rationale: Kirai cha Kiyunani kinaweza kueleweka kama yaliyomo katika habari njema au kama yambwa la kitendo cha kutangaza. Matini kuu inatumia ufasiri wa yaliyomo kwa Kiswahili cha asili, huku tanbihi ikihifadhi uwezekano wa miundo mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Hekaluni” na “nyumba kwa nyumba” ni vifupi na vya asili; “ndiye” husisitiza utambulisho unaodaiwa katika tangazo bila kuongeza fundisho lisilokuwamo katika chanzo.
