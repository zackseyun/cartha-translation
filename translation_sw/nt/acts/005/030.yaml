  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: sw
  text: Mungu wa baba zetu alimfufua Yesu, ambaye ninyi mlimuua kwa kumtundika juu ya mti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au “msalabani.” Kigiriki kinasema “juu ya mti,” huenda kikirejelea Kumbukumbu la Torati 21:23.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Mungu wa baba zetu
  rationale: Huhifadhi tamko la kibiblia linalomtambulisha Mungu wa Israeli kwa uhusiano wake na mababa wa taifa. Ingawa “Mungu wa mababu zetu” ni Kiswahili cha kawaida zaidi kwa maana ya wahenga, “baba zetu” huhifadhi kwa karibu zaidi umbo la kiume na mwangwi wa agano uliomo katika πατέρων.
- source_word: ἤγειρεν
  choice: alimwinua
  rationale: Kitenzi ἐγείρω hapa kinaweza kueleweka kuwa Mungu alimfufua Yesu, lakini mstari huu hauongezi wazi maneno “kutoka kwa wafu.” “Alimwinua” huhifadhi upana huo wa maana bila kulazimisha ufafanuzi mmoja; tanbihi inaeleza maana ya ufufuo inayowezekana sana katika muktadha.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: διεχειρίσασθε
  choice: mlimuua
  rationale: Katika muktadha huu kitenzi kinaeleza kitendo cha ukatili kilichosababisha kifo. “Mlimuua” ni cha moja kwa moja, cha asili, na chenye uzito unaolingana na shtaka la Petro.
- source_word: κρεμάσαντες
  choice: kwa kumtundika
  rationale: Kirai hiki kinaonyesha namna au njia ambayo walimuua Yesu. “Kwa kumtundika” huwasilisha kwa kawaida uhusiano huo wa kisarufi.
- source_word: ἐπὶ ξύλου
  choice: mtini
  rationale: ξύλον humaanisha mti au mbao. “Mtini” huhifadhi taswira ya mti na mwangwi unaowezekana wa Kumbukumbu la Torati 21:23 badala ya kuibadili moja kwa moja kuwa “msalabani.”
theological_decisions:
- issue: Ikiwa ἤγειρεν itafsiriwe kwa lugha ya wazi ya ufufuo
  choice: alimwinua
  alternative: alimfufua kutoka kwa wafu
  rationale: Muktadha unaelekeza kwa nguvu kwenye ufufuo, lakini Kigiriki cha mstari huu hakisemi wazi “kutoka kwa wafu.” Tafsiri kuu huhifadhi upana wa kitenzi, huku tanbihi ikionyesha maana nyingine yenye uwezekano mkubwa.
- issue: Ikiwa ξύλον itafsiriwe kuwa msalaba
  choice: mtini
  alternative: msalabani
  rationale: Kigiriki kimetumia ξύλον, si σταυρός. Kutumia “mti” huhifadhi uchaguzi wa msamiati na mwangwi wa Kumbukumbu la Torati 21:23, huku tanbihi ikifafanua kuwa kinachorejelewa ni msalaba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Mungu wa baba zetu” huhifadhi mtindo wa kim Maandiko; “mlimuua” ni shtaka la moja kwa moja; “mtini” ni usemi wa asili unaohifadhi taswira ya chanzo.
