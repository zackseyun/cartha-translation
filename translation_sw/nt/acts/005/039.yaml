lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: limetoka kwa Mungu
  rationale: Muundo huu unaonyesha chanzo au asili ya jambo hilo, sawasawa na maana ya ἐκ, na unasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: δυνήσεσθε
  choice: hamtaweza
  rationale: Wakati ujao wa uwezo umehifadhiwa wazi na kwa ufupi.
- source_word: καταλῦσαι
  choice: kuwaangusha
  rationale: Katika muktadha huu neno lina maana ya kuwashinda na kuwakomesha wale wanaopingwa, bila kulifanya liwe na maana kali zaidi ya kuwaua.
- source_word: αὐτούς
  choice: -wa- katika ‘kuwaangusha’
  rationale: Kiambishi cha ngeli ya watu wengi kinahifadhi rejeo la moja kwa moja kwa watu, yaani kwa kawaida mitume, badala ya kuligeuza kuwa jambo lisilo mtu.
- source_word: μήποτε
  choice: Msije hata
  rationale: Huu ni mtindo wa kawaida wa Kiswahili wa kutoa onyo kuhusu matokeo yasiyotakiwa, huku ‘hata’ ikihifadhi καί.
- source_word: θεομάχοι
  choice: mnapigana na Mungu
  rationale: Tafsiri ya kitenzi ni ya asili katika Kiswahili na inahifadhi uzito wa maana halisi, ‘wapiganaji dhidi ya Mungu.’
- source_word: εὑρεθῆτε
  choice: mkakutwa kuwa
  rationale: Usemi huu unahifadhi hali ya kutendwa na wazo la kudhihirika kuwa katika hali fulani.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: Basi wakashawishika na maneno yake
  rationale: Hii inaonyesha kwamba baraza lilikubali ushauri wa Gamalieli; ‘Basi’ huleta matokeo hayo kwa kawaida, na ‘na maneno yake’ huepuka usemi usio wa kawaida wa ‘kushawishika naye.’
theological_decisions:
- issue: Rejeo la αὐτούς katika onyo kuhusu wale ambao hawawezi kuangushwa
  choice: Kiambishi cha watu wengi ‘-wa-’ kinarejelea mitume, yaani watu waliokuwa mbele ya baraza.
  alternative: Kukielewa kwa upana kuwa kinarejelea harakati au kazi yao.
  rationale: αὐτούς ni kiwakilishi cha kiume cha wingi na kwa kawaida kinawarejelea watu. Tanbihi inadumisha uwezekano wa rejeo pana zaidi bila kuugeuza usemi huu kuwa ahadi ya jumla kuhusu kila harakati ya kidini.
- issue: Nguvu ya onyo katika μήποτε καὶ θεομάχοι εὑρεθῆτε
  choice: ‘Msije hata mkakutwa kuwa mnapigana na Mungu.’
  alternative: ‘Huenda hata mkawa wapinzani wa Mungu.’
  rationale: Chaguo hili linahifadhi onyo, hali ya kutendwa ya εὑρεθῆτε, na taswira nzito ya kupigana na Mungu bila kuamua kimadhehebu ikiwa baraza tayari lilikuwa linafanya hivyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hilo’ linaendeleza rejeo la mstari uliotangulia bila kulifafanua kupita kiasi; ‘wakashawishika na maneno yake’ ni ya kawaida zaidi kuliko tafsiri ya neno kwa neno.
