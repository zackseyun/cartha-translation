  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: sw
  text: Naye akawaambia, “Enyi wanaume wa Israeli, jihadharini kuhusu kile mko karibu kuwatendea watu hawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: Kisha akawaambia
  rationale: τέ inaunganisha kauli hii kwa upole na simulizi lililotangulia; “Kisha” ni kiunganishi cha kawaida cha kisimulizi bila kulazimisha hitimisho.
- source_word: πρὸς αὐτούς
  choice: akawaambia
  rationale: Pamoja na λέγω, πρός + hali ya kushutumiwa huonyesha wanaoelekezewa maneno. Kiswahili huwasilisha maana hiyo kwa kiambishi cha yambwa katika “akawaambia.”
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Enyi wanaume wa Israeli
  rationale: Huhifadhi mwito rasmi na umbo la kiume lililo wazi katika Kigiriki, huku likibaki la kawaida na lenye hadhi katika Kiswahili.
- source_word: προσέχετε ἑαυτοῖς
  choice: jihadharini
  rationale: Kitenzi cha amri pamoja na kiwakilishi rejeshi kinatoa onyo la kujichunga. “Jihadharini” huhifadhi moja kwa moja wazo hilo la tahadhari binafsi.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: kuhusu ... watu hawa
  rationale: ἐπί pamoja na dative hapa hutaja jambo linalopaswa kuzingatiwa. “Kuhusu” haliongezi wazo la uhasama ambalo “dhidi ya” lingeweza kuingiza.
- source_word: τί μέλλετε πράσσειν
  choice: kile mnachokusudia kuwatendea
  rationale: μέλλω + infinitive inaweza kuonyesha hatua inayokaribia au inayokusudiwa. Katika Kiswahili, “mnachokusudia” huonyesha kwa kawaida hatua inayofikiriwa; “kuwatendea” huunganisha tendo hilo kwa watu wanaohusika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inahifadhi onyo la Gamalieli na kutotaja wazi kama hatua iliyokusudiwa ilikuwa dhidi ya watu hao. Hakuna tanbihi iliyoongezwa kwa kuwa tofauti ya kimuundo inaweza kuwakilishwa wazi katika matini kuu bila kupoteza utata halisi.
