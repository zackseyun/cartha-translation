review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the addressees, formal Israelite address, warning, and the intended action toward the men. However, “mnachokusudia” primarily communicates intention and does not adequately retain the prospective/imminent force of μέλλετε. “Kisha” also gives a somewhat stronger sequential sense than the lightly connective τέ.
  naturalness: The wording is generally clear Standard East African Swahili. “Naye akawaambia” is a more natural, appropriately light narrative connection, and “kile mko karibu kuwatendea” clearly expresses the warning in contemporary formal Swahili.
  terminology: “Enyi wanaume wa Israeli” is an established formal biblical-style rendering that suitably reflects the masculine public address Ἄνδρες Ἰσραηλῖται. “Jihadharini” appropriately renders the cautionary reflexive imperative. No theological terminology issue is present.
  issues:
