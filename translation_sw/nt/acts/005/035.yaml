    issue: “mnachokusudia” weakens the force of μέλλετε.
    rationale: μέλλετε πράσσειν denotes what the hearers are about to do or are on the point of doing, not merely an intention that may be remote. “Mko karibu kuwatendea” preserves the near-future force naturally.
  - severity: low
    issue: “Kisha” is more sequential than τέ requires.
    rationale: τέ is a light narrative connective. “Naye” maintains the connection without specifically asserting a subsequent temporal step.
