base_translation:
  language: en
  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: sw
  text: Baada ya kuwaleta, wakawasimamisha mbele ya baraza[a]. Kisha kuhani mkuu akawauliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sanhedrini.” Neno la Kigiriki συνέδριον linamaanisha baraza la utawala la Wayahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Baada ya kuwaleta
  rationale: Kirai cha kitenzi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; tafsiri hii huonyesha wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: —
  rationale: Ni kiunganishi hafifu kinachoendeleza simulizi; hakihitaji kutafsiriwa moja kwa moja kwa sababu mtiririko wa Kiswahili uko wazi bila kiunganishi cha ziada.
- source_word: ἔστησαν
  choice: wakawaweka mbele ya
  rationale: Kitenzi kina maana ya kuwasimamisha au kuwaweka mahali. Katika mazingira haya ya kushtakiwa mbele ya baraza, ‘wakawaweka mbele ya’ ni ya asili na huhifadhi wazo la kuwasilishwa rasmi.
- source_word: ἐν τῷ συνεδρίῳ
  choice: mbele ya baraza
  rationale: Ingawa kihalisi kihusishi ni ‘katika,’ pamoja na kitenzi cha kuwaweka kinamaanisha kuwasimamisha mbele ya chombo hicho cha utawala. ‘Baraza’ hutafsiri maana ya kawaida ya συνέδριον bila kuingiza jina la kimapokeo katika matini kuu.
- source_word: ἐπηρώτησεν
  choice: akawauliza
  rationale: Kitenzi humaanisha kuuliza au kuhoji. ‘Akawauliza’ kinafaa katika Kiswahili cha kawaida na hakiongezi ukali usiotajwa wazi na Kigiriki.
- source_word: ὁ ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno sanifu na sahihi la Kiswahili kwa cheo cha ἀρχιερεύς katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya συνέδριον
  choice: baraza
  alternative: Sanhedrini
  rationale: Matini kuu inatafsiri maana ya neno la Kigiriki badala ya kutumia jina la kimapokeo. Rejeleo lake ni baraza kuu la Kiyahudi, jambo linalofafanuliwa katika tanbihi bila kubadili maana ya msingi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zinatumika ili kuepuka mfululizo mzito wa viunganishi na kudumisha mtiririko wa kawaida wa simulizi.
