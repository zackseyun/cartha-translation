  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: sw
  text: “Nendeni, mkasimame katika eneo la Hekalu[a], mkawaambie watu maneno yote ya uzima huu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika viwanja vya Hekalu.” Neno la Kigiriki linamaanisha eneo lote la Hekalu, si patakatifu pa ndani pekee.
    reason: lexical_alternative
  - marker: b
    text: Au “kuhusu uzima huu,” “kuhusu maisha haya,” au “ya njia hii ya maisha.” Huenda usemi huu unarejelea uzima unaotangazwa katika habari njema.
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Nendeni
  rationale: Amri ya moja kwa moja kwa wingi; ni tafsiri ya kawaida na ya asili ya agizo la kuondoka na kwenda kutenda.
- source_word: σταθέντες
  choice: mkasimame
  rationale: Kiambishi -ka- kinaonyesha tendo linalofuata baada ya kwenda, huku kitenzi cha amri kikitoa Kiswahili cha asili kwa wazo la kishirikishi kinachoandamana na agizo kuu.
- source_word: λαλεῖτε
  choice: kuwaambia
  rationale: Katika muktadha wa kusema kwa watu, ‘kuwaambia’ ni ya asili na hudumisha maana pana ya λαλεῖτε bila kuongeza wazo maalumu la kutangaza kama mhubiri.
- source_word: ἐν τῷ ἱερῷ
  choice: katika eneo la Hekalu
  rationale: ἱερόν hapa ni eneo lote la Hekalu, si patakatifu pa ndani pekee; ‘eneo la Hekalu’ huepuka dhana potovu ya kusimama ndani ya jengo takatifu.
- source_word: τῷ λαῷ
  choice: watu
  rationale: Huwakilisha λαός moja kwa moja bila kuongeza ‘umati’ au kutaja wazi Israeli, jambo ambalo mstari wenyewe haufanyi.
- source_word: πάντα τὰ ῥήματα
  choice: maneno yote
  rationale: Hudumisha kwa karibu πᾶς na ῥῆμα, badala ya kufupisha kwa tafsiri pana zaidi kama ‘ujumbe wote.’
- source_word: τῆς ζωῆς ταύτης
  choice: ya uzima huu
  rationale: Hudumisha muundo wa umilikishi na utata wa usemi wa Kigiriki kuhusu uzima unaohusishwa na ujumbe wa mitume.
theological_decisions:
- issue: Maana ya τῆς ζωῆς ταύτης (‘uzima huu’)
  choice: Kudumisha usemi mfupi ‘uzima huu’ bila kuufafanua ndani ya mstari.
  alternative: ‘maisha haya,’ ‘njia hii ya maisha,’ au ‘ujumbe unaotoa uzima’
  rationale: Kigiriki kinaweza kuelekeza kwenye uzima unaotangazwa katika habari njema, maisha mapya yanayohusiana na Yesu, au ujumbe wenye kuleta uzima. Tafsiri haipaswi kuchagua maana moja kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mkasimame’ huunganisha kwa kawaida mwendo na tendo linalofuata. Herufi kubwa katika ‘Hekalu’ inalibainisha Hekalu la Yerusalemu. ‘Uzima’ umechaguliwa badala ya ‘maisha’ ili kudumisha mwangwi wa kitheolojia wa ζωή bila kufafanua maana yake kupita kiasi.
