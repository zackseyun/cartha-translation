  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: sw
  text: wakisema, “Tulikuta gereza limefungwa kwa usalama kabisa[a], na walinzi wamesimama milangoni; lakini tulipofungua, hatukumkuta mtu yeyote ndani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “limefungwa kwa ulinzi mkali kabisa.” Kigiriki kinasisitiza kwamba gereza lilikuwa limefungwa kwa usalama kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: wakisema, “
  rationale: Muundo huu unaendeleza simulizi kutoka mstari uliotangulia na kutambulisha taarifa yao kwa usemi wa moja kwa moja.
- source_word: δεσμωτήριον
  choice: gereza
  rationale: Neno hili linamaanisha mahali pa kuwafungia watu; “gereza” ni neno la kawaida, wazi, na linalofaa muktadha huu.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: limefungwa kwa usalama kabisa
  rationale: Kitenzi katika hali timilifu kinaonyesha gereza lilikuwa katika hali ya kufungwa, huku kirai kinachofuata kikisisitiza usalama kamili.
- source_word: φύλακας ἑστῶτας
  choice: walinzi wamesimama
  rationale: Tafsiri hii inadumisha picha ya walinzi waliokuwa wamesimama katika nafasi zao bila kuongeza wazo lisilotajwa wazi la kupangiwa rasmi.
- source_word: ἐπὶ τῶν θυρῶν
  choice: milangoni
  rationale: Hueleza mahali walinzi walipokuwa, karibu na au kwenye milango; “milangoni” ni Kiswahili asilia na chenye uwazi.
- source_word: ἀνοίξαντες
  choice: tulipofungua
  rationale: Kauli ya wakati huwasilisha vizuri tendo lililotangulia kukuta kwao kwamba ndani hamkuwa na mtu. Yambwa imeachwa kudokezwa kama ilivyo katika Kigiriki.
- source_word: ἔσω
  choice: ndani
  rationale: Kielezi hiki kinaonyesha sehemu ya ndani ya gereza.
- source_word: οὐδένα
  choice: hatukumkuta mtu yeyote
  rationale: Muundo huu wa kukanusha ni wa kawaida katika Kiswahili na unaonyesha wazi kwamba hawakumpata mtu hata mmoja.
