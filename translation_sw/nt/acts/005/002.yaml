  source_fidelity: Tafsiri inawakilisha kwa usahihi tendo hasi la ἐνοσφίσατο kwa “akajiwekea kwa siri,” na “sehemu ya fedha alizopata kwa mauzo hayo” huwasilisha ἀπὸ τῆς τιμῆς kwa ufasaha wa muktadha. Ujuzi wa mke, sehemu isiyobainishwa, na tendo la kuweka miguuni pa mitume vyote vimehifadhiwa. “Kisha” ni ufasiri unaokubalika wa mfuatano wa kirai kishirikishi cha aoristi, bila kubadili maana.
  naturalness: Kiswahili ni Sanifu, cha kawaida, na kinachosikika vizuri. Kugawa sentensi ya Kigiriki katika sentensi mbili kunasaidia usomaji. “Miguuni pa mitume” ni usemi wa kawaida na unaofaa katika rejesta ya kibiblia ya Kiswahili.
  terminology: “Akajiwekea kwa siri” hudumisha nguvu ya udanganyifu bila kulazimisha istilahi ya kisheria. “Fedha ... kwa mauzo” na “mitume” ni istilahi sahihi za muktadha. Tanbihi (a) inafafanua kwa usahihi uwezekano wa “kujitwalia,” na tanbihi (b) inaeleza taswira halisi ya usemi huo.
