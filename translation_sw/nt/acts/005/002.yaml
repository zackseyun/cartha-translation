id: ACT.5.2
reference: Acts 5:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: sw
  text: Naye akajiwekea kwa siri sehemu ya fedha alizopata kwa mauzo hayo[a], na mke wake pia alijua. Kisha akaleta sehemu fulani na kuiweka miguuni pa mitume.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alizuia kwa siri sehemu ya bei ya mauzo kwa ajili yake mwenyewe”; kitenzi cha Kigiriki kinaashiria kujitwalia kwa udanganyifu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “miguuni pa mitume,” yaani aliweka fedha hizo mbele yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: akajiwekea kwa siri sehemu
  rationale: Kitenzi hiki kina maana hasi ya kujitwalia au kuzuia kwa ajili yake mwenyewe, kwa udanganyifu. ‘Akajiwekea kwa siri’ kinaonyesha kuficha huku bila kuongeza lugha ya kisheria ya wizi.
- source_word: ἀπὸ τῆς τιμῆς
  choice: ya fedha alizopata kwa mauzo hayo
  rationale: Katika muktadha huu τιμή ni kiasi kilichopatikana kwa kuuza mali. Usemi huu ni wa kawaida katika Kiswahili na unaweka wazi maana ya fedha za mauzo.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: na mke wake pia alijua
  rationale: 'Muundo wa genitivi huru unaonyesha hali iliyoandamana na tendo: mke wake alikuwa akijua yaliyofanyika. ‘Pia’ linaakisi καί.'
- source_word: ἐνέγκας
  choice: Kisha akaleta
  rationale: Kirai cha aoristi kinaeleza tendo lililotangulia tendo kuu la kuweka; ‘kisha’ linaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: μέρος τι
  choice: sehemu fulani
  rationale: Huhifadhi kutotajwa kwa kiasi halisi cha sehemu iliyoletwa.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: kuiweka miguuni pa mitume
  rationale: Huhifadhi taswira halisi ya kuweka fedha miguuni pa mitume na mwendelezo wa usemi huu katika Matendo.
theological_decisions:
- issue: Uzito wa kimaadili wa tendo la Anania
  choice: Tendo limetafsiriwa kuwa kujiwekea kwa siri, si kubakiza tu kwa namna isiyo na udanganyifu.
  alternative: alibakiza sehemu ya fedha
  rationale: Muktadha na νοσφίζομαι vinaonyesha kuzuia kwa udanganyifu. Tafsiri inahifadhi maana hiyo hasi bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. Sentensi ndefu ya Kigiriki imegawanywa ili isomeke kwa urahisi bila kupoteza mpangilio wa matendo. Viashiria vyote vya tanbihi vimewekwa katika matini.
