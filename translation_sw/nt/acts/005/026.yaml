  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni mwepesi kueleweka; 'wasije wakapigwa mawe' huhifadhi hofu ya matokeo bila kuwataja moja kwa moja wale ambao wangewapiga.
