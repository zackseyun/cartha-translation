base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: sw
  text: Ndipo mkuu wa walinzi wa Hekalu[a] akaenda pamoja na maofisa, akawaleta bila kutumia nguvu, kwa maana waliwaogopa watu, wasije wakapigwa mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kamanda wa Hekalu.” Neno la Kigiriki hapa linamtaja ofisa aliyesimamia utaratibu wa Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: mkuu wa walinzi wa Hekalu
  rationale: Katika muktadha wa Matendo, neno hili linamtaja ofisa aliyesimamia utaratibu na ulinzi wa Hekalu, si jenerali wa jeshi la Roma. Kutaja Hekalu kunamweka wazi kwa msomaji wa kisasa.
- source_word: ὑπηρέταις
  choice: maofisa
  rationale: Hapa ni watumishi wenye mamlaka waliokuwa chini ya mkuu wa walinzi na waliomsaidia kuwaleta mitume; 'maofisa' linafaa katika muktadha huu wa utekelezaji wa amri.
- source_word: ἤγαγεν αὐτούς
  choice: akawaleta
  rationale: Kitenzi ἄγω kina maana ya kuongoza au kuleta. 'Akawaleta' ni cha asili katika Kiswahili na hakiongezi mahali panapolengwa pasipotajwa katika mstari.
- source_word: οὐ μετὰ βίας
  choice: bila kutumia nguvu
  rationale: Kauli hii inaeleza kuwa hawakutumia nguvu za kulazimisha au ukatili katika kuwaleta.
- source_word: ἐφοβοῦντο
  choice: waliwaogopa
  rationale: Wakati usiotimilifu unaonyesha hofu yao katika hali hiyo; umbo lenye yambwa linaonyesha wazi kwamba waliwaogopa watu.
- source_word: τὸν λαόν
  choice: watu
  rationale: λαός hapa ni umma uliokuwapo, na 'watu' ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: μὴ λιθασθῶσιν
  choice: wasije wakapigwa mawe
  rationale: μή pamoja na hali tegemezi baada ya kitenzi cha kuogopa huonyesha jambo walilohofia. Tafsiri hii huhifadhi hali ya uwezekano unaoogopwa na kauli tendwa.
- source_word: τότε ἀπελθὼν
  choice: Ndipo ... akaenda
  rationale: Huwasilisha kwa Kiswahili fasaha mfuatano wa simulizi unaoonyeshwa na τότε na kitenzi-shirikishi ἀπελθών.
theological_decisions: []
