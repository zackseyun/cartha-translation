base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: sw
  text: Lakini mtu mmoja aliyeitwa Anania, pamoja na Safira, mke wake, aliuza mali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kipande cha ardhi.” Neno la Kigiriki linaweza kumaanisha mali kwa ujumla au mali isiyohamishika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Lakini mtu mmoja
  rationale: Ἀνήρ hapa humtambulisha mtu katika simulizi, τις huonyesha kutotajwa kwa upekee zaidi, na δέ huleta utofauti na mfano wa Barnaba uliotangulia. “Lakini mtu mmoja” ni Kiswahili cha kawaida kinachohifadhi kazi hizo za usemi.
- source_word: Ἁνανίας ὀνόματι
  choice: aliyeitwa Anania
  rationale: ὀνόματι katika muundo huu humaanisha “kwa jina” au “aliyeitwa.” Namna iliyochaguliwa ni ya asili katika Kiswahili cha simulizi, na Ἁνανίας limetoholewa kwa umbo la kawaida la Kiswahili, “Anania.”
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: pamoja na Safira mke wake
  rationale: σύν huonyesha uandamani. γυνή katika muundo huu wa umilikaji humaanisha wazi “mke.” “Pamoja na” pia hudokeza ushiriki wa Safira bila kufafanua zaidi ya matini.
- source_word: ἐπώλησεν
  choice: aliuza
  rationale: Ni kitenzi cha wakati uliopita kinachoeleza tendo lililokamilika katika simulizi.
- source_word: κτῆμα
  choice: mali fulani
  rationale: κτῆμα linaweza kumaanisha kitu kinachomilikiwa au mali isiyohamishika. “Mali fulani” huhifadhi upana huo bila kulazimisha maana ya shamba, kiwanja, au nyumba pekee.
theological_decisions:
- issue: Utofauti wa kisimulizi kati ya Barnaba na Anania
  choice: Kutafsiri δέ kuwa “Lakini”
  alternative: “Basi” au “Na”
  rationale: Muktadha unaweka tendo la Anania kinyume na mfano mzuri wa Barnaba uliotangulia. “Lakini” huhifadhi utofauti huo bila kuongeza hukumu ya kitheolojia ambayo haijasemwa katika mstari huu.
- issue: Kiwango cha ushiriki wa Safira katika uuzaji
  choice: “pamoja na Safira mke wake”
  alternative: “akiwa na Safira mke wake”
  rationale: σύν huonyesha uandamani au ushirika, lakini mstari huu peke yake haufafanui kwa undani nafasi ya kila mmoja. Tafsiri inahifadhi hali hiyo bila kudai kwamba wote wawili walifanya kila hatua kwa kiwango kilekile.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Anania na Safira. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.'
