id: ACT.14.23
reference: Acts 14:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: sw
  text: Nao walipokwisha kuwateua wazee kwa ajili yao katika kila kanisa[a], wakaomba pamoja na kufunga, wakawakabidhi kwa Bwana[b], ambaye walikuwa wamemwamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokwisha kuwachagua wazee kwa ajili yao katika kila kanisa.” Kitenzi cha Kigiriki katika baadhi ya miktadha kinaweza kumaanisha kuchagua kwa kura au kwa kuinua mikono, ingawa hapa huenda kinamaanisha tu kuteua.
    reason: alternative_reading
  - marker: b
    text: “Wakawakabidhi” huenda ikawarejelea hasa wazee waliokuwa wameteuliwa, badala ya waumini wote.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: walipokwisha kuwateua
  rationale: Kitenzi hiki hapa kinaonyesha kuchagua au kuweka watu katika wajibu. “Kuwateua” ni Kiswahili cha kawaida kinachoeleza tendo hilo bila kuingiza utaratibu maalumu wa kura ambao aya haitaji wazi.
- source_word: κατ’ ἐκκλησίαν
  choice: katika kila kanisa
  rationale: 'κατά pamoja na nomino ya umoja ina maana ya mgawanyo: wazee waliwekwa katika kila kusanyiko la mahali.'
- source_word: πρεσβυτέρους
  choice: wazee
  rationale: Katika muktadha wa kanisa, neno hili linamaanisha viongozi wanaotambuliwa, si wanaume wenye umri mkubwa tu.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: wakaomba pamoja na kufunga
  rationale: Tafsiri hii huonyesha kwamba sala iliambatana na kufunga na hudumisha mfuatano wa matendo kabla ya tendo kuu.
- source_word: παρέθεντο
  choice: wakawakabidhi
  rationale: Neno hili lina maana ya kuwaweka watu chini ya uangalizi au utunzaji wa mwingine; “kuwakabidhi” ni la asili na huonyesha uhusiano huo.
- source_word: τῷ κυρίῳ
  choice: kwa Bwana
  rationale: Dativu humtaja yule ambaye watu waliwekwa chini ya utunzaji wake.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: ambaye walikuwa wamemwamini
  rationale: Muundo huu unaeleza imani iliyoelekezwa kwa Bwana na hali iliyokuwa imeanza kabla ya matendo yanayosimuliwa.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: kwa ajili yao ... wakawakabidhi
  rationale: Kiwakilishi cha kwanza kinawahusu waumini au makusanyiko ambao wazee waliteuliwa kwa ajili yao. Cha pili kinaweza kuwahusu waumini hao kwa ujumla, ingawa huenda kikawahusu wazee walioteuliwa; tafsiri inadumisha kiwakilishi badala ya kufafanua zaidi ya Kigiriki.
theological_decisions:
- issue: Maana ya χειροτονήσαντες kuhusu utaratibu wa uongozi wa kanisa
  choice: kuwateua wazee
  alternative: kuwachagua wazee kwa kura au kwa kuinua mikono
  rationale: Neno lina historia ya kuhusishwa na kuchagua kwa kuinua mikono, lakini katika matumizi ya Kigiriki cha Koine linaweza kumaanisha tu kuteua. Aya haisemi wazi utaratibu uliotumiwa, hivyo “kuwateua” haipendelei mfumo fulani wa dhehebu.
- issue: Yanaowakilishwa na αὐτοὺς katika παρέθεντο αὐτοὺς τῷ κυρίῳ
  choice: kiwakilishi “wa-” kimeachwa wazi, kwa uwezekano mkuu wa kuwarejelea waumini
  alternative: kuwataja wazi wazee waliokuwa wameteuliwa
  rationale: Muktadha mpana unawahusu wanafunzi na makusanyiko, lakini wazee ndio waliotajwa karibu zaidi. Kudumisha kiwakilishi huhifadhi uwezekano huo badala ya kuamua jambo ambalo maandishi hayalazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “walipokwisha ... wakaomba ... wakawakabidhi” unaweka wazi mfuatano wa vishiriki vya Kigiriki bila kufanya sentensi iwe nzito. Kiambishi cha yambwa katika “wakawakabidhi” kinaacha rejeleo la αὐτοὺς wazi kama lilivyo katika chanzo.
