  text: καὶ λαλήσαντες ἐν Πέργῃ τὸν λόγον κατέβησαν εἰς Ἀττάλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: sw
  text: Nao baada ya kusema neno huko Perga[a], waliteremka kwenda Atalia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiisha kusema neno huko Perga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλήσαντες
  choice: baada ya kusema
  rationale: Kirai hiki cha kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; ‘baada ya kusema’ ni Kiswahili cha kawaida na hakiongezi maana yenye nguvu zaidi ya ‘kuhubiri’ ambayo λαλέω yenyewe hailazimishi.
- source_word: τὸν λόγον
  choice: neno
  rationale: Hapa λόγος ni ujumbe wa Kikristo uliotangazwa. ‘Neno’ linahifadhi usemi unaojirudia katika Matendo bila kuongeza ‘la Bwana,’ maneno ambayo hayapo katika Kigiriki.
- source_word: ἐν Πέργῃ
  choice: huko Perga
  rationale: ἐν pamoja na jina la mji huonyesha mahali; ‘huko Perga’ ni ya asili katika simulizi la safari la Kiswahili.
- source_word: κατέβησαν
  choice: waliteremka
  rationale: καταβαίνω humaanisha kwenda chini au kushuka; ‘waliteremka’ linahifadhi wazo la mteremko kutoka Perga ya bara kuelekea Atalia ya pwani.
- source_word: εἰς Ἀττάλειαν
  choice: kwenda Atalia
  rationale: εἰς huonyesha mahali walipokuwa wakielekea; ‘kwenda Atalia’ ni muundo wa kawaida wa Kiswahili pamoja na kitenzi ‘waliteremka.’
- source_word: καὶ
  choice: Nao
  rationale: καί linaendeleza simulizi. ‘Nao’ linaunganisha sentensi na simulizi lililotangulia kwa njia ya kawaida bila kuongeza msisitizo wa wakati.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa ulinganifu mwafaka: unafuata mpangilio na maana ya Kigiriki huku ukitumia usemi wa kawaida wa Kiswahili. Alama ya tanbihi [a] imewekwa katika matini.'
