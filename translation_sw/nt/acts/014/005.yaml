  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: sw
  text: Na watu wa mataifa na Wayahudi[b], pamoja na viongozi wao, walipojaribu[a] kuwatendea vibaya na kuwapiga kwa mawe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walipowashambulia.” Neno la Kigiriki ὁρμή linaweza kumaanisha msukumo mkali, kuvamia, au kuanza kwa shambulio. “Walipojaribu” limetumiwa hapa kwa sababu kuwatendea vibaya na kuwapiga kwa mawe kunaelezwa kuwa vitendo walivyokusudia kufanya, si vitendo vilivyokamilika katika mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Katika miktadha mingine, “Wayahudi” linaweza kutafsiriwa “watu wa Yudea.” Hapa huenda linarejelea wapinzani wa Kiyahudi kama kundi, wala si hasa watu waliotoka Yudea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Lakini ... walipo-
  rationale: Muundo huu unaendeleza simulizi kwa kuonyesha wakati tukio jipya lilipoanza, huku “lakini” ikihifadhi uzito mdogo wa utofautishaji wa δέ.
- source_word: ἐγένετο ὁρμὴ
  choice: walipojaribu
  rationale: Katika muktadha huu, kishazi hiki kinaonyesha kuanza kwa hatua ya uhasama iliyokusudiwa. “Walipojaribu” ni Kiswahili cha kawaida na hakiashirii kwamba vitendo vilivyokusudiwa vilikamilika.
- source_word: τῶν ἐθνῶν
  choice: watu wa mataifa
  rationale: Katika Matendo, neno hili likitofautishwa na Wayahudi humaanisha kwa kawaida watu wasio Wayahudi. “Watu wa mataifa” ni wazi na halimaanishi mataifa kama falme au nchi.
- source_word: τε καὶ
  choice: na
  rationale: Kuorodheshwa kwa “watu wa mataifa na Wayahudi” kunaonyesha kwa kawaida kwamba makundi yote mawili yalishiriki, bila kulazimisha muundo mzito wa Kiswahili.
- source_word: Ἰουδαίων
  choice: Wayahudi
  rationale: Hapa neno hilo linarejelea wapinzani wa Kiyahudi kama kundi, si hasa wakazi wa eneo la Yudea.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: pamoja na viongozi wao
  rationale: “Viongozi” linaeleza watu wenye mamlaka ya kiraia au kijamii kwa lugha ya sasa, huku “pamoja na” likihifadhi maana ya σύν.
- source_word: ὑβρίσαι
  choice: kuwatendea vibaya
  rationale: Kauli hii pana inajumuisha dhuluma, fedheha, au ukatili bila kuifanya iwe tusi la maneno pekee.
- source_word: καὶ λιθοβολῆσαι
  choice: na kuwapiga kwa mawe
  rationale: Hii inatoa maana ya kitenzi moja kwa moja bila kuongeza “hadi kufa,” matokeo ambayo hayajasemwa wazi katika kitenzi chenyewe.
- source_word: αὐτούς
  choice: wa-
  rationale: Kiambishi cha yambwa kinawarejelea Paulo na Barnaba kwa kawaida katika Kiswahili.
