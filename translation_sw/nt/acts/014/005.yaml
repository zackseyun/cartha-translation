  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Mpangilio umefanywa kuwa wa kawaida katika Kiswahili kwa kuwafanya makundi hayo kuwa kiima cha “walipojaribu,” huku maana ya kuanza kwa hatua ya uhasama na kutokamilika kwake ikihifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
