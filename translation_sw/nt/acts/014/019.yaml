base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: sw
  text: Lakini Wayahudi walifika kutoka Antiokia na Ikonio. Baada ya kuyashawishi makutano na kumpiga Paulo kwa mawe, walimburuta nje ya mji, wakidhani kwamba alikuwa amekufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinaripoti walivyodhani kwamba Paulo alikuwa amekufa; hakisemi wazi kwamba alikufa kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: Lakini ... walifika
  rationale: δὲ inaonyesha badiliko lenye utofauti na mapokezi mazuri yaliyotangulia, hivyo “Lakini” linafaa; Ἐπῆλθαν hapa ni kufika kwa wapinzani kutoka miji mingine.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Katika muktadha huu neno linawataja wapinzani wa Kiyahudi waliotoka Antiokia na Ikonio, si wakazi wa Uyahudi pekee.
- source_word: πείσαντες τοὺς ὄχλους
  choice: Baada ya kuwashawishi umati wa watu
  rationale: Kishirikishi cha aoristi kinaonyesha tendo lililotangulia na lililochangia yaliyofuata. Ingawa ὄχλους ni wingi katika Kigiriki, Kiswahili cha kawaida hutumia “umati wa watu” kama nomino ya mkusanyiko.
- source_word: λιθάσαντες τὸν Παῦλον
  choice: na kumpiga Paulo kwa mawe
  rationale: Hii ni njia ya kawaida na iliyo wazi ya kueleza tendo la kumpiga mtu kwa mawe, bila kudokeza kwamba lazima alikufa.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: walimburuta mpaka nje ya mji
  rationale: “Walimburuta” linaonyesha ukatili wa σύρω; “mpaka nje ya mji” linaweka wazi mahali alikofikishwa.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: wakidhani kwamba alikuwa amekufa
  rationale: “Wakidhani” linahifadhi hali ya makisio ya washambuliaji. “Alikuwa amekufa” linaakisi infinitivi timilifu, ambayo huonyesha kifo kilichodhaniwa kuwa kimetokea na hali yake kubaki.
theological_decisions:
- issue: Ikiwa Paulo alikufa kweli au washambuliaji wake walidhani tu kwamba alikuwa amekufa
  choice: wakidhani kwamba alikuwa amekufa
  alternative: wakijua kwamba alikuwa amekufa
  rationale: Kigiriki kinaripoti dhana yao kwa νομίζοντες, si ukweli wa moja kwa moja kwamba Paulo alikufa. Tafsiri haipaswi kuthibitisha wala kukanusha jambo ambalo mstari wenyewe hauliamui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya “Ikonio” ili iwe rahisi kusomeka bila kupoteza mfuatano wa matendo katika Kigiriki.
