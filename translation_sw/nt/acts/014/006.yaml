  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: sw
  text: Walipotambua hilo[a], wakakimbilia miji ya Likaonia—Listra na Derbe—na eneo lililozunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walipolielewa hilo” au “walipopata habari kuhusu hilo.” Kishirikishi cha Kigiriki kinaonyesha kwamba walikuja kutambua hatari iliyoelezwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: walipotambua hilo
  rationale: Kitenzi hiki hapa kinaonyesha kwamba walikuja kuelewa hatari iliyotajwa katika mstari uliotangulia. Kiwakilishi “hilo” kinakamilisha maana inayotokana na muktadha.
- source_word: κατέφυγον
  choice: wakakimbilia
  rationale: Neno hili lina maana ya kukimbia ili kupata usalama. “Wakakimbilia” linaonyesha kwa kawaida mwendo wa haraka kutoka hatarini kuelekea mahali pengine.
- source_word: εἰς
  choice: -lia
  rationale: Dhana ya kuelekea mahali inawasilishwa kiasili ndani ya kitenzi cha Kiswahili “kukimbilia.”
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: miji ya Likaonia
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa miji iliyoko katika eneo la Likaonia, na unaandaa majina yanayofuata kama ufafanuzi.
- source_word: Λύστραν καὶ Δέρβην
  choice: Listra na Derbe
  rationale: Haya ni maumbo ya majina ya mahali yanayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: τὴν περίχωρον
  choice: eneo la kandokando
  rationale: Kirai hiki kinataja eneo linalozunguka miji iliyotajwa, bila kulifanya liwe mashambani pekee.
- source_word: καὶ ... καὶ
  choice: —Listra na Derbe—pamoja na
  rationale: Mistari mirefu inaonyesha kwamba majina hayo yanafafanua miji ya Likaonia, huku “pamoja na” ikiunganisha eneo linalozunguka miji hiyo.
