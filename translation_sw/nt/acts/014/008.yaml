    text: Au, “hakuwa na nguvu miguuni.” Kigiriki kwanza kinasisitiza kukosa nguvu au uwezo, kisha kinasema wazi kwamba alikuwa kilema.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Huko
  rationale: Katika Kiswahili, mwanzo wa tukio jipya unaunganishwa kwa kawaida kwa kutaja mahali moja kwa moja; maana ya kiunganishi cha simulizi imewasilishwa bila kutumia “Na” isiyo ya lazima.
- source_word: τις ἀνὴρ
  choice: mtu mmoja
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kumtambulisha mtu fulani ambaye hajatajwa jina.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: akiwa hana nguvu miguuni
  rationale: Inahifadhi maana ya msingi ya kukosa nguvu au uwezo katika miguu bila kuichanganya na χωλός, ambayo baadaye inamtaja wazi kuwa kilema.
- source_word: ἐν Λύστροις
  choice: Huko Listra
  rationale: “Listra” ni uandishi wa kawaida wa jina la mahali, na “huko” linaweka tukio katika mahali palipotajwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ἐκάθητο
  choice: alikuwa ameketi
  rationale: Muundo huu unaonyesha hali iliyokuwa ikiendelea na unaweka mandhari ya simulizi, kama hali ya kitenzi cha Kigiriki.
- source_word: χωλός
  choice: kilema
  rationale: Ni neno la kawaida na linaloeleweka kwa hali ya kutoweza kutembea ipasavyo; hapa linabainisha zaidi maelezo ya awali kuhusu miguu yake.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: tangu tumboni mwa mama yake
  rationale: Inahifadhi taswira halisi ya nahau ya Kigiriki badala ya kuifupisha kuwa “tangu kuzaliwa.”
- source_word: οὐδέποτε περιεπάτησεν
  choice: hakuwahi kamwe kutembea
  rationale: Inaonyesha kwamba katika maisha yake yote hadi wakati huo mtu huyo hakuwa ametembea hata mara moja.
