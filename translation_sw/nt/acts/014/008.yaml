  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: sw
  text: Na huko Listra, mwanaume mmoja alikuwa ameketi, asiye na nguvu miguuni[a]. Alikuwa kilema tangu tumboni mwa mama yake, naye hakuwahi kamwe kutembea.
  philosophy: optimal-equivalence
  footnotes:
