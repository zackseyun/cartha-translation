base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: sw
  text: Katika Ikonio waliingia pamoja katika sinagogi la Wayahudi, wakasema kwa namna ambayo idadi kubwa ya Wayahudi na Wagiriki waliamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika sinagogi la Kiyahudi.” Kigiriki kinasema kwa neno halisi, “katika sinagogi la Wayahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Ni fomula ya kuendeleza simulizi; Kiswahili cha kawaida hakihitaji kuiongeza kama ‘ikawa’ au ‘basi’ hapa.
- source_word: ἐν Ἰκονίῳ
  choice: Huko Ikonio
  rationale: ‘Huko’ huonyesha mahali palipotajwa katika mwendelezo wa simulizi, huku jina la mahali likinakiliwa kwa kawaida ya Kiswahili.
- source_word: κατὰ τὸ αὐτό
  choice: pamoja
  rationale: Katika muktadha huu msemo unaonyesha tendo la pamoja la Paulo na Barnaba.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: waliingia
  rationale: Kitenzi-jina kinachotegemea ἐγένετο kimetolewa kwa kitenzi kamili cha Kiswahili ili simulizi liwe la kawaida.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: katika sinagogi la Wayahudi
  rationale: Huhifadhi wazi uhusiano wa umilikaji/uhusishaji katika Kigiriki bila kufanya Kiswahili kuwa kizito.
- source_word: λαλῆσαι
  choice: wakasema
  rationale: Hutoa maana ya msingi ya kusema bila kuongeza kitu kisichotajwa kama ujumbe au hotuba.
- source_word: οὕτως ὥστε
  choice: kwa namna ambayo
  rationale: Huhifadhi wazo la namna ya kusema pamoja na matokeo yaliyofuata.
- source_word: πιστεῦσαι
  choice: uliamini
  rationale: Huhifadhi kitenzi cha kawaida cha kundi la πιστ- na kutaja mwitikio bila kuongeza wazi kitu walichoamini.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: wa Wayahudi na Wagiriki
  rationale: Huwajumuisha wazi watu wa makundi yote mawili kama sehemu za umati mmoja.
- source_word: πολὺ πλῆθος
  choice: umati mkubwa
  rationale: Huhifadhi msisitizo wa idadi kubwa kwa lugha ya sasa na yenye heshima.
theological_decisions:
- issue: Maana ya πιστεῦσαι katika simulizi la watu kuitikia mahubiri
  choice: uliamini
  alternative: ulifikia imani / uliamini ujumbe
  rationale: Kigiriki hakitaji wazi yule au kile kilichoaminiwa. ‘Uliamini’ huhifadhi ufupi na uwazi huo bila kulazimisha ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umeweka sentensi ya simulizi kuwa nyepesi huku ukihifadhi namna na matokeo katika οὕτως ὥστε.
