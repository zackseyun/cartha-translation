base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: sw
  text: Nao kutoka huko wakasafiri kwa meli hadi Antiokia, ambako walikuwa wamekabidhiwa kwa neema ya Mungu kwa ajili ya kazi waliyoitimiza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kuonyesha wazi zaidi maana ya ὅθεν: “... hadi Antiokia, mahali ambapo hapo awali walikuwa wamekabidhiwa kwa neema ya Mungu kwa ajili ya kazi waliyoitimiza.” ‘Waliyoikamilisha’ pia yaweza kutumiwa kwa ‘waliyoitimiza.’'
    reason: Hufafanua rejeleo la ὅθεν bila kudokeza kimakosa kwamba walikuwa wametoka Antiokia, na huhifadhi chaguo halali la kutafsiri ἐπλήρωσαν.
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Nao kutoka huko
  rationale: Huhifadhi kiunganishi cha simulizi pamoja na wazo la kuondoka mahali palipotajwa awali kwa Kiswahili cha kawaida.
- source_word: ἀπέπλευσαν
  choice: wakasafiri kwa meli
  rationale: Hueleza wazi kwamba waliondoka kwa njia ya bahari; muktadha na 'kutoka huko' tayari huonyesha kuondoka.
- source_word: εἰς Ἀντιόχειαν
  choice: hadi Antiokia
  rationale: Hutoa kwa kawaida lengo la safari, huku jina la mahali likitoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ὅθεν
  choice: mahali
  rationale: Katika kishazi hiki 'mahali' hurejelea Antiokia kwa lugha asilia; wazo la kwamba huko ndiko walikotoka linaeleweka kutokana na muktadha, na linafafanuliwa katika tanbihi.
- source_word: ἦσαν παραδεδομένοι
  choice: walipokuwa wamekabidhiwa
  rationale: Muundo huu huhifadhi tendo lililotangulia la kuwaweka chini ya uangalizi au utunzaji wa neema ya Mungu, bila kuingiza dhana maalumu ya kidhehebu.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: kwa neema ya Mungu
  rationale: Baada ya 'kukabidhiwa,' 'kwa neema ya Mungu' ni muundo wa Kiswahili unaoeleweka na unaodumisha uzito wa kirai cha Kigiriki.
- source_word: εἰς τὸ ἔργον
  choice: kwa ajili ya kazi
  rationale: Huhifadhi maana pana ya ἔργον bila kuifasiri kwa neno finyu zaidi kama 'utume.'
- source_word: ὃ ἐπλήρωσαν
  choice: waliyokuwa wameikamilisha
  rationale: Katika muktadha huu πληρόω humaanisha kuifikisha kazi mwisho; wakati uliotangulia unaonyesha kwamba kazi hiyo ilikuwa imekwisha kabla ya kurudi kwao.
theological_decisions:
- issue: Namna Paulo na Barnaba walivyowekwa chini ya neema ya Mungu hapo awali
  choice: walipokuwa wamekabidhiwa kwa neema ya Mungu
  alternative: walipokuwa wamewekwa chini ya neema ya Mungu
  rationale: '''Wamekabidhiwa'' huonyesha kwamba waliwekwa katika utunzaji wa neema ya Mungu, bila kudokeza ibada au utaratibu maalumu wa kidhehebu.'
- issue: Maana ya kukamilika kwa kazi
  choice: kazi waliyokuwa wameikamilisha
  alternative: kazi waliyokuwa wameitimiza
  rationale: '''Kuikamilisha'' hufaa kwa maana ya kuifikisha kazi mwisho, huku ''kuitimiza'' likibaki chaguo halali lenye mwangwi mpana zaidi wa kileksika.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi; istilahi pana “kazi” na “neema ya Mungu” zimehifadhiwa bila ufafanuzi wa kidhehebu.
