  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: sw
  text: Lakini mitume Barnaba na Paulo waliposikia, walirarua mavazi yao[a], wakaingia kwa haraka katika umati[b], wakipaza sauti,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kurarua mavazi kulikuwa desturi ya kuonyesha huzuni, mshtuko, au kupinga heshima iliyokuwa ya kufuru.
    reason: cultural_note
  - marker: b
    text: Au, “wakaruka kuingia katika umati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Kirai cha wakati kinaonyesha kwamba matendo yao yalifuata waliposikia kilichokuwa kikifanywa; “hayo” huleta Kiswahili cha kawaida bila kufafanua zaidi jambo lililosikiwa.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha geuko lenye utofautishaji kutoka jaribio la umati la kutoa dhabihu kwenda mwitikio wa mitume.
- source_word: ἀπόστολοι
  choice: mitume
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa wajumbe waliotumwa; hapa Barnaba na Paulo wanatambuliwa moja kwa moja kuwa mitume.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: walirarua mavazi yao
  rationale: Inahifadhi tendo halisi la kurarua mavazi, lililokuwa ishara ya huzuni, hofu kuu, au kupinga heshima ya kukufuru.
- source_word: ἐξεπήδησαν
  choice: wakakimbilia
  rationale: Kitenzi kinaonyesha mwendo wa ghafla na wa haraka. “Wakakimbilia” ni Kiswahili cha kawaida kinachoonyesha dharura bila kudokeza kwamba waliushambulia umati.
- source_word: εἰς τὸν ὄχλον
  choice: ndani ya umati
  rationale: εἰς huonyesha mwendo wa kuingia katika kundi la watu.
- source_word: κράζοντες
  choice: wakipaza sauti
  rationale: Huwasilisha usemi mkubwa na wenye nguvu ulioambatana na mwendo wao, bila kutangulia yaliyomo katika mstari unaofuata.
- source_word: Βαρναβᾶς καὶ Παῦλος
  choice: Barnaba na Paulo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Barnaba na Paulo kuitwa “mitume”
  choice: mitume Barnaba na Paulo
  alternative: Barnaba na Paulo, wale mitume
  rationale: Muundo wa Kigiriki unawatambulisha Barnaba na Paulo kuwa mitume katika muktadha huu. Tafsiri inahifadhi kauli hiyo bila kubana maana ya “mitume” kuwa wale Kumi na Wawili pekee wala kuingiza mjadala wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa na hadhi inayofaa maandiko. “Umati” ni neno la kawaida na lenye staha kwa ὄχλος; “wakipaza sauti” huepuka hisia hasi zisizo za lazima zinazoweza kuambatana na “wakipiga kelele.”
