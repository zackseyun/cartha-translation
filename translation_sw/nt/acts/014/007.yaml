lexical_decisions:
- source_word: κἀκεῖ
  choice: Nao huko
  rationale: Neno hili linaunganisha καί na ἐκεῖ, likiwa na maana ya ‘na huko’ au ‘huko pia.’ ‘Nao huko’ linaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida huku likihifadhi nguvu ya kiunganishi.
- source_word: εὐαγγελιζόμενοι
  choice: kuhubiri habari njema
  rationale: Kitenzi εὐαγγελίζω humaanisha kutangaza habari njema, hasa ujumbe wa Injili. ‘Kuhubiri habari njema’ ni wazi, la kawaida, na huhifadhi maana ya kitendo cha kutangaza.
- source_word: ἦσαν
  choice: waliendelea
  rationale: Pamoja na kirai cha participio εὐαγγελιζόμενοι, wakati usiotimilifu wa ἦσαν unaonyesha kitendo kilichokuwa kikiendelea. ‘Waliendelea kuhubiri’ huwasilisha hali hiyo kwa Kiswahili cha asili.
