  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: sw
  text: Na hata walipokuwa wakisema mambo haya, kwa shida waliuzuia umati wa watu usiwatolee dhabihu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Hata baada ya kusema maneno hayo
  rationale: Katika muktadha huu καί ina nguvu ya kusisitiza kwamba, licha ya maneno hayo, ilikuwa vigumu kuuzuia umati. Kiswahili hiki ni cha kawaida na huhifadhi msisitizo huo.
- source_word: μόλις κατέπαυσαν
  choice: walifanikiwa kwa shida tu kuwazuia
  rationale: μόλις huonyesha kwamba walizuia tendo hilo kwa taabu sana au karibu washindwe; muundo huu unaonyesha kwa wazi mafanikio yaliyopatikana kwa shida.
- source_word: τοὺς ὄχλους
  choice: umati wa watu
  rationale: Ingawa Kigiriki kina wingi, hapa neno hilo linawarejelea watu waliokusanyika mahali pamoja; 'umati wa watu' ni usemi wa kawaida wa Kiswahili.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: wasiwatolee dhabihu
  rationale: Muundo wa τοῦ μή pamoja na kitenzi-jina unaeleza jambo walilowazuia kufanya; θύειν ni kutoa dhabihu, na αὐτοῖς ni kwao Paulo na Barnaba.
theological_decisions:
- issue: Walengwa wa dhabihu
  choice: wasiwatolee dhabihu
  alternative: wasitoe dhabihu kwa ajili yao
  rationale: Muktadha unaonyesha kwamba umati ulitaka kuwapa Paulo na Barnaba dhabihu kama miungu, si kutoa dhabihu kwa manufaa yao. Uundaji huu unahifadhi hilo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Msisitizo wa ugumu katika μόλις umehifadhiwa bila kufanya sentensi kuwa nzito.
