  yaml_path: translation/nt/acts/014/024.yaml
  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: sw
  text: Nao baada ya kupita katika Pisidia, walifika Pamfilia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kawaida katika Kiswahili bila kuongeza maana ya wazi ya mfuatano kama ‘Kisha’.
- source_word: διελθόντες
  choice: baada ya kupita katika
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kitenzi kikuu; ‘baada ya kupita katika’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: τὴν Πισιδίαν
  choice: Pisidia
  rationale: Jina la eneo limetoholewa kwa tahajia inayotumika kwa kawaida katika Kiswahili.
- source_word: ἦλθον
  choice: walifika
  rationale: Katika simulizi la safari, ‘walifika’ ni usemi wa asili unaoeleza kufika kwao katika eneo linalotajwa, bila kubadili kiini cha ἔρχομαι.
- source_word: εἰς τὴν Παμφυλίαν
  choice: Pamfilia
  rationale: Kwa kuwa ‘walifika’ tayari huonyesha mwendo kuelekea mahali na kuingia humo, jina la eneo pekee ni la kawaida katika Kiswahili na linadumisha mwelekeo wa εἰς.
