  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: sw
  text: Mtu huyu alimsikiliza Paulo alipokuwa akizungumza. Paulo akamtazama kwa makini, akaona kwamba alikuwa na imani ya kuponywa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana pana zaidi, “imani ya kuokolewa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuokoa” au “kuponya”; hapa muktadha unaelekea kwenye uponyaji wa mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Mtu huyu
  rationale: Kiwakilishi hiki kinamrejelea moja kwa moja mtu mwenye ulemavu aliyetajwa katika mstari uliotangulia; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἤκουσεν
  choice: alimsikiliza
  rationale: Katika muktadha huu, kitenzi kinaonyesha kwamba mtu huyo alikuwa akiyasikiliza maneno ya Paulo, si kwamba aliyasikia tu bila kuyatilia maanani.
- source_word: λαλοῦντος
  choice: alipokuwa akizungumza
  rationale: Huhifadhi hali endelevu ya kitenzi tegemezi na kutoa Kiswahili cha kawaida kwa tendo la Paulo la kusema.
- source_word: ἀτενίσας
  choice: akamtazama kwa makini
  rationale: Huwasilisha maana ya kumkazia mtu macho kwa umakini bila kutumia usemi mkali kama 'kumkodolea macho.'
- source_word: ἰδὼν
  choice: kuona
  rationale: Huhifadhi lugha halisi ya kuona, huku muktadha ukiruhusu wazo la kutambua au kufahamu.
- source_word: ἔχει πίστιν
  choice: alikuwa na imani
  rationale: πίστις hapa ni imani ya mtu huyo ya kupokea msaada wa Mungu, wala si uaminifu wake mwenyewe.
- source_word: τοῦ σωθῆναι
  choice: ya kuponywa
  rationale: Ingawa kitenzi σῴζω kinaweza kumaanisha kuokoa au kuponya, muktadha wa karibu ni kurejeshwa kimwili kwa mtu mwenye ulemavu; uwezekano mpana zaidi umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya σωθῆναι katika simulizi la muujiza
  choice: kuponywa kimwili
  alternative: kuokolewa
  rationale: Mstari unaofuata unaeleza uponyaji wa mwili. Tafsiri 'kuponywa' huonyesha maana ya karibu ya simulizi, huku tanbihi ikihifadhi upana wa maana ya neno la Kigiriki bila kuondoa mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili kuondoa utata wa kiwakilishi na kuonyesha wazi kwamba Paulo ndiye aliyemtazama mtu huyo, bila kubadili uhusiano wa matendo katika Kigiriki.
