  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: sw
  text: wakiimarisha nafsi za wanafunzi, wakiwahimiza wadumu katika imani, na kusema, “Ni lazima tuingie katika ufalme wa Mungu kupitia dhiki nyingi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taabu nyingi” au “mateso mengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: wakiimarisha
  rationale: Kitenzi hiki kinaeleza tendo linaloendelea la kuwafanya wanafunzi wawe thabiti zaidi; ‘wakiimarisha’ ni cha asili na hakiongezi wazo la kuwaanzishia taasisi.
- source_word: τὰς ψυχὰς
  choice: nafsi
  rationale: ‘Nafsi’ hapa inaonyesha utu au maisha ya ndani ya wanafunzi bila kulazimisha mgawanyo mkali wa mwili na roho.
- source_word: τῶν μαθητῶν
  choice: za wanafunzi
  rationale: ‘Wanafunzi’ ni neno la kawaida na lililozoeleka kwa wafuasi waliojitolea wa Yesu.
- source_word: παρακαλοῦντες
  choice: wakiwahimiza
  rationale: Katika muktadha huu neno linaunganisha kutia moyo na kusihi kwa uthabiti; ‘kuwahimiza’ linabeba pande hizo kwa Kiswahili cha kawaida.
- source_word: ἐμμένειν
  choice: wadumu
  rationale: ‘Kudumu’ huonyesha kuendelea kwa uthabiti katika hali au msimamo uliopo.
- source_word: τῇ πίστει
  choice: katika imani
  rationale: Kiswahili hakina kibainishi sawa na άρθρο ya Kigiriki. ‘Katika imani’ linaweza kueleweka kuwa imani ya Kikristo au hali ya kuamini, hivyo linahifadhi kwa kiasi kinachofaa upana wa usemi wa asili.
- source_word: διὰ πολλῶν θλίψεων
  choice: kupitia dhiki nyingi
  rationale: ‘Dhiki’ huwasilisha shinikizo, mateso na taabu nzito; ‘kupitia’ huhifadhi wazo la njia ambayo kuingia kunatokea.
- source_word: δεῖ ἡμᾶς
  choice: ni lazima tuingie
  rationale: Muundo huu unahifadhi nguvu ya ulazima bila kueleza chanzo au utaratibu wa ulazima huo zaidi ya maandishi.
- source_word: εἰσελθεῖν εἰς
  choice: tuingie katika
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi mwendo wa kuingia ndani ya eneo linalotajwa.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni usemi sahihi na uliozoeleka unaoweza kubeba maana za eneo la kifalme na utawala wa Mungu.
theological_decisions:
- issue: Maana ya πίστις yenye kibainishi
  choice: katika imani
  alternative: katika ile imani
  rationale: Ingawa kibainishi cha Kigiriki kinaweza kuelekeza kwenye imani ya Kikristo inayoshirikiwa, ‘ile imani’ si ya asili sana katika Kiswahili bila muktadha wa karibu unaoitambulisha. ‘Katika imani’ ni fasaha na haifungi kabisa maana ya imani kama jambo linaloaminiwa au tendo la kumwamini Mungu.
- issue: Nguvu ya δεῖ
  choice: Ni lazima tuingie katika ufalme wa Mungu kupitia dhiki nyingi
  alternative: Inatupasa kuingia katika ufalme wa Mungu kupitia dhiki nyingi
  rationale: ‘Ni lazima’ huhifadhi ulazima ulio katika Kigiriki bila kuongeza maelezo kuhusu kuamuliwa tangu awali, kustahili wokovu kwa mateso, au chanzo mahususi cha dhiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vishazi vya ‘waki-’ umehifadhi kwa sababu mstari huu unaendelea kisarufi kutoka muktadha uliotangulia. Nukuu zimeongezwa kuonyesha wazi yale Paulo na Barnaba waliyosema.
