base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: sw
  text: Hata hivyo, hakujiacha bila ushuhuda[a], akitenda mema kwa kuwapa mvua kutoka mbinguni na majira yenye kuzaa matunda[b], na akiijaza mioyo yenu[c] kwa chakula na furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila ushahidi.” Neno la Kigiriki linasisitiza kwamba Mungu hakujiacha bila ushuhuda kumhusu yeye mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “majira yanayozaa matunda.”
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya nakala za Kigiriki zina “mioyo yetu” badala ya “mioyo yenu.” SBLGNT ina “mioyo yenu.”
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Hata hivyo
  rationale: 'Inaonyesha hali ya kukubali jambo lililotangulia huku ikililetea tofauti: ingawa Mungu aliacha mataifa yaende katika njia zao, bado alijitolea ushuhuda.'
- source_word: οὐκ ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: hakujiacha bila ushuhuda
  rationale: Inahifadhi muundo wa kujirejelea na wazo la kwamba Mungu hakuacha kuwa na ushuhuda unaomhusu yeye mwenyewe.
- source_word: ἀγαθουργῶν
  choice: kwa kutenda mema
  rationale: Kirai hiki kinaeleza jinsi Mungu alivyojitoa ushuhuda; ‘kutenda mema’ ni lugha ya kawaida na yenye hadhi.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: aliwapa mvua kutoka mbinguni
  rationale: ‘Mvua’ ni nomino ya wingi kwa maana katika Kiswahili na inaonyesha mvua zinazotolewa mara kwa mara; ‘kutoka mbinguni’ inadumisha chanzo kinachoelekezwa kwa Mungu.
- source_word: καιροὺς καρποφόρους
  choice: majira yenye kuzaa matunda
  rationale: Inabeba maana ya vipindi au majira yanayoleta mazao, bila kupunguza taswira ya kilimo.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης
  choice: akiijaza ... chakula na furaha
  rationale: Inadumisha picha ya kujaza moyo kwa riziki na shangwe, huku ‘chakula’ na ‘furaha’ zikiwa maneno ya kawaida na wazi.
- source_word: τὰς καρδίας ὑμῶν
  choice: mioyo yenu
  rationale: Inafuata SBLGNT, ambayo ina kiwakilishi cha nafsi ya pili kwa wingi, na kudumisha usemi wa Kigiriki kuhusu moyo kama kitovu cha kuridhika na furaha.
theological_decisions:
- issue: Ushuhuda wa Mungu kupitia wema wake katika uumbaji na majaliwa
  choice: Mvua, majira yenye mazao, chakula na furaha vinaelezwa kuwa matendo mema ambayo kwa hayo Mungu hujishuhudia.
  alternative: Kuyachukulia mambo haya kuwa michakato ya asili isiyo na maana yoyote ya kitheolojia.
  rationale: Kiwakilishi cha kujirejelea ‘mwenyewe’ pamoja na ‘ushuhuda’ na vitenzi vinavyomwonyesha Mungu akitenda vinaonyesha kwamba wema wake wa kuwapa watu mahitaji ni ushuhuda kumhusu, bila kuongeza mfumo mpana wa mafundisho usiotajwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unadumisha uhusiano wa vishazi vya Kigiriki huku alama ya nukta mbili ikifanya orodha ya matendo mema isomeke kwa urahisi.
