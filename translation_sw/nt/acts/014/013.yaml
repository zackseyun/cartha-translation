base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: sw
  text: Naye kuhani wa Zeu, ambaye hekalu lake lilikuwa nje ya mji,[a] akaleta mafahali na mashada malangoni; yeye pamoja na makutano alitaka kutoa dhabihu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “Zeu aliyekuwa mbele ya mji”; huenda maana yake ni Zeu ambaye hekalu au mahali pake patakatifu palikuwa nje ya mji.
    reason: alternative_reading
  - marker: b
    text: Au “taji za maua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kawaida; “Naye” kinaunganisha mstari huu na yaliyotangulia bila kuongeza maana.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: kuhani wa Zeu
  rationale: “Zeu” huhifadhi jina la Kigiriki la mungu huyo badala ya kutumia jina lake la Kiroma, Jupiteri.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: ambaye hekalu lake lilikuwa nje ya mji
  rationale: Kirai kinamtambulisha Zeu kwa mahali pa patakatifu pake; “nje ya mji” huwasilisha kwa Kiswahili cha kawaida maana inayowezekana ya πρὸ τῆς πόλεως, huku neno lililodokezwa “hekalu” likiwekwa wazi.
- source_word: ταύρους
  choice: mafahali
  rationale: ταῦρος humaanisha fahali, na wingi wake umehifadhiwa katika muktadha wa dhabihu.
- source_word: στέμματα
  choice: mashada ya maua
  rationale: Katika maandamano ya dhabihu, neno hili linaweza kumaanisha mashada au taji za maua; “mashada ya maua” ni la kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: kwenye malango
  rationale: Huhifadhi wingi wa πυλῶνας na kueleza mahali walikopelekwa wanyama na mashada.
- source_word: ἐνέγκας
  choice: akaleta
  rationale: Kitenzi cha Kiswahili katika mfululizo wa simulizi huwasilisha kwa kawaida tendo la kishirikishi cha aoristi.
- source_word: σὺν τοῖς ὄχλοις
  choice: pamoja na umati
  rationale: Ingawa Kigiriki kina wingi, “umati” ni nomino ya mkusanyiko iliyo ya kawaida katika Kiswahili na inaonyesha kwamba kuhani alitenda kwa kushirikiana na watu waliokusanyika.
- source_word: ἤθελεν θύειν
  choice: alitaka kutoa dhabihu
  rationale: Huwasilisha nia au tamaa inayoonyeshwa na θέλω pamoja na maana ya kidini ya θύω.
theological_decisions:
- issue: Kirejelewa kinachodokezwa katika τοῦ ὄντος πρὸ τῆς πόλεως
  choice: Kirai kimefasiriwa kuwa kinarejelea hekalu la Zeu lililokuwa nje ya mji.
  alternative: “Zeu aliyekuwa mbele ya mji” au “mahali patakatifu pa Zeu palipokuwa mbele ya mji.”
  rationale: Muktadha wa kuhani na maandalizi ya dhabihu unaunga mkono kuelewa kirai kama utambulisho wa Zeu kwa mahali pa hekalu lake. Tanbihi huhifadhi muundo halisi na utata wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa simulizi umetumia viambishi vya mfululizo “Naye … akaleta,” na tanbihi zimehifadhi mbadala halisi wa kileksika na utata wa kirai cha mahali.
