  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: sw
  text: Makutano walipoona alichokuwa amefanya Paulo, wakapaza sauti zao, wakisema kwa Kilikaonia, “Miungu, ikiwa imefananishwa na wanadamu[a], imeshuka kwetu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa imefanywa ifanane na wanadamu.” Kigiriki ni umbo la kutendwa linaloonyesha kwamba miungu hiyo ilidhaniwa kuwa imefanywa ifanane na wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε ὄχλοι
  choice: Umati wa watu
  rationale: Ingawa ὄχλοι ni wingi, Kiswahili cha kawaida hutumia jina la jumla “umati wa watu” kwa kundi kubwa; muundo huu ni wa asili kuliko “makundi ya watu” katika muktadha huu.
- source_word: ἰδόντες
  choice: ulipoona
  rationale: Kirai tegemezi cha wakati kinaonyesha hali iliyotangulia tendo kuu kwa Kiswahili cha asili.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: alichokuwa amefanya Paulo
  rationale: Muundo huu unaonyesha kwamba tendo la Paulo lilikuwa limetokea kabla ya mwitikio wa umati.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: ukapaza sauti
  rationale: “Kupaza sauti” ni nahau ya kawaida ya Kiswahili inayohifadhi taswira ya Kigiriki ya kuinua sauti na maana ya kusema kwa nguvu.
- source_word: Λυκαονιστί
  choice: kwa lugha ya Kilikaonia
  rationale: Kielezi cha Kigiriki kinamaanisha kusema kwa lugha ya watu wa Likaonia; kutaja “lugha” huweka maana wazi kwa msomaji wa leo.
- source_word: λέγοντες
  choice: ukisema
  rationale: Huu ni utangulizi wa kawaida wa maneno ya moja kwa moja na unapatana na “umati” kama jina la jumla.
- source_word: Οἱ θεοὶ
  choice: Miungu
  rationale: Wingi unaonyesha wazi miungu ya kipagani iliyodhaniwa na umati, si Mungu wa kweli.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: imekuwa kama wanadamu
  rationale: Ufasiri huu ni wa asili katika mshangao wa moja kwa moja na huhifadhi wazo la kufanana na wanadamu bila kuingiza istilahi nzito ya kimafundisho; hali ya kutendwa iliyo wazi zaidi imewekwa katika tanbihi.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: imetushukia
  rationale: Kitenzi “kutushukia” kinaonyesha mwendo wa kushuka na kufika walipo wasemaji, kwa ufupi na kwa nguvu ya mshangao wao.
theological_decisions:
- issue: Kuwasilisha tafsiri ya kipagani ya umati bila kuingiza fundisho la Kikristo kuhusu kufanyika mwili
  choice: Miungu imekuwa kama wanadamu
  alternative: Miungu ikiwa imefananishwa na wanadamu
  rationale: Kauli hii inaripoti dhana potovu ya umati. “Imekuwa kama wanadamu” huhifadhi ulinganisho wa ὁμοιωθέντες bila kudai kwa namna ya kimafundisho kwamba miungu hiyo ilifanyika mwili; tanbihi huhifadhi kwa uwazi zaidi umbo la kutendwa la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Umati wa watu” na “ukapaza sauti” ni miundo inayoeleweka kwa urahisi; mshangao wa hotuba ya moja kwa moja umehifadhiwa.
