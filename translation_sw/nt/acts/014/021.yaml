  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: sw
  text: Baada ya kuhubiri habari njema katika mji huo na kufanya watu wengi kuwa wanafunzi, walirudi Listra, Ikonio na Antiokia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: Baada ya kuhubiri habari njema
  rationale: Kauli ya wakati uliopita katika umbo la kitenzi-shirikishi inaonyesha tendo lililotangulia kurudi kwao. “Kuhubiri habari njema” ni ya kawaida na yenye kueleweka, huku ikihifadhi maana ya kutangaza ujumbe mwema.
- source_word: τε
  choice: imewakilishwa katika mtiririko wa sentensi bila kiunganishi tofauti
  rationale: τε huunganisha kwa upole sentensi hii na yaliyotangulia; katika Kiswahili kiunganishi cha ziada mwanzoni kingefanya sentensi kuwa nzito bila kubadili maana.
- source_word: τὴν πόλιν ἐκείνην
  choice: katika mji huo
  rationale: Hurejelea moja kwa moja mji uliotajwa katika muktadha, yaani Derbe; “mji huo” ni tafsiri ya kawaida ya kirai hiki.
- source_word: μαθητεύσαντες
  choice: na kufanya watu wengi kuwa wanafunzi
  rationale: Kitenzi hiki kina maana ya kuwafanya watu wawe wanafunzi. Muundo huu huhifadhi nguvu ya kitendo na ni wazi zaidi kuliko neno la kitaalamu.
- source_word: ἱκανοὺς
  choice: watu wengi
  rationale: Katika muktadha huu neno linaonyesha idadi kubwa au ya kutosha; “watu wengi” ni ya asili na hueleza wazi wale waliofanywa wanafunzi.
- source_word: ὑπέστρεψαν
  choice: walirudi
  rationale: Hiki ndicho kitenzi kikuu na kinaonyesha safari ya kurudi; “walirudi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: εἰς τὴν Λύστραν
  choice: Listra
  rationale: Baada ya “walirudi,” jina la mahali huonyesha walikokwenda bila kulazimika kurudia kihusishi.
- source_word: εἰς Ἰκόνιον
  choice: Ikonio
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili na kuwasilishwa kama kituo kinachofuata katika safari.
- source_word: εἰς Ἀντιόχειαν
  choice: Antiokia
  rationale: Jina limetoholewa kwa matumizi ya Kiswahili na linahifadhi kituo cha mwisho katika orodha ya Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Sentensi inaonyesha kwanza kazi ya kuhubiri na kufanya wanafunzi, kisha safari ya kurudi. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti ya “kuhubiri injili” inaweza kuwasilishwa wazi kama “kuhubiri habari njema” bila kupoteza maana.
