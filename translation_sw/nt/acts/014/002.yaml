  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: sw
  text: Lakini Wayahudi waliokataa kuamini[a] waliwachochea watu wa mataifa mengine, wakawafanya wawe na nia mbaya[b] dhidi ya ndugu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokataa kutii” au “wasiotii.” Neno la Kigiriki linaweza kumaanisha kukataa kuamini ujumbe, na hapa huenda linarejelea kuikataa Injili.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “nafsi zao”; hapa maana ni msimamo wao wa ndani au mtazamo wao dhidi ya ndugu.
    reason: lexical_alternative
  - marker: c
    text: Hapa “ndugu” huenda inawarejelea waamini kwa ujumla, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: waliokataa kuamini
  rationale: Katika muktadha wa kuhubiri Injili, kitenzi hiki kinaonyesha kutokubali ujumbe kwa makusudi; tafsiri hii inaweka wazi maana ya kukataa kuamini bila kuifanya kuwa kutotii kwa ujumla.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo neno la kawaida na la moja kwa moja katika Kiswahili. Muktadha unaonyesha kuwa ni wale Wayahudi wa eneo hilo walioupinga ujumbe, si Wayahudi wote.
- source_word: ἐπήγειραν
  choice: waliwachochea
  rationale: Neno hili linaonyesha kuwashawishi au kuwaamsha wengine wawe na msimamo wa uhasama, na ‘waliwachochea’ ni la asili katika Kiswahili cha sasa.
- source_word: ἐκάκωσαν τὰς ψυχὰς
  choice: kuwatia chuki moyoni
  rationale: Muunganiko huu wa maneno unaeleza kuharibiwa kwa msimamo wa ndani dhidi ya waamini. Tafsiri hii ni ya asili na inaonyesha matokeo ya uhasama bila kudai kwamba ψυχή hapa ni istilahi maalumu ya anthropolojia.
- source_word: τῶν ἐθνῶν
  choice: watu wa mataifa mengine
  rationale: Katika utofautishaji wa Wayahudi na wasio Wayahudi, kifungu hiki kinarejelea watu wasio Wayahudi. Kauli iliyochaguliwa inaeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: dhidi ya ndugu
  rationale: ‘Ndugu’ huhifadhi picha ya kifamilia ya ἀδελφῶν na katika matumizi ya Kikristo inaweza kulihusu kundi lote la waamini; maelezo ya chini yanafafanua upeo huo.
theological_decisions:
- issue: Maana ya ἀπειθήσαντες kati ya kutokuamini na kutotii
  choice: waliokataa kuamini
  alternative: waliokataa kutii / wasiotii
  rationale: Muktadha wa kimisionari unaelekeza kwenye kuukataa ujumbe, lakini uwezekano wa maana ya kutotii umehifadhiwa katika tanbihi.
- issue: Upeo wa ἀδελφῶν katika jumuiya ya waamini
  choice: ndugu
  alternative: ndugu wa kiume na wa kike / waamini
  rationale: Neno la msingi ni wingi wa kiume, lakini matumizi ya kifamilia katika jumuiya ya Kikristo yanaweza kuwajumuisha wanawake. Matini inadumisha umbo la kifamilia, na tanbihi inaeleza maana jumuishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida; ‘kuwatia chuki moyoni’ umetumiwa badala ya tafsiri ngumu ya neno kwa neno ya ‘kuzifanya nafsi kuwa mbaya,’ huku tanbihi ikihifadhi umbo na utata wa Kigiriki.
