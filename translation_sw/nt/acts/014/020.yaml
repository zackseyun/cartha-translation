  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: sw
  text: Lakini wanafunzi walipokusanyika kumzunguka[a], alisimama[b], kisha akaingia mjini. Siku iliyofuata, alitoka pamoja na Barnaba kwenda Derbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimzunguka” au “walifanya duara kumzunguka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “aliinuka.” Neno la Kigiriki linaweza kutafsiriwa hivyo, lakini hapa huenda linaeleza Paulo kuinuka kimwili, wala halisemi wazi kwamba alifufuka.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: walipomkusanyikia pande zote
  rationale: Kitenzi κυκλόω humaanisha kuzunguka au kufanya duara kumzunguka mtu. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha wanafunzi walikusanyika kumzunguka Paulo bila kudokeza uhasama.
- source_word: δὲ
  choice: Lakini
  rationale: δέ inaonyesha hatua mpya yenye tofauti ndogo na tukio la awali, ambapo Paulo alipigwa mawe na kuburutwa nje ya mji. “Lakini” inaonyesha mgeuko huo wa kushangaza bila kuutia chumvi.
- source_word: τῶν μαθητῶν
  choice: wanafunzi
  rationale: μαθητής hutafsiriwa kwa kawaida kuwa “mwanafunzi” katika Matendo, na neno hilo linaeleweka kama mfuasi anayejifunza.
- source_word: ἀναστὰς
  choice: alisimama
  rationale: Katika muktadha huu ἀνίστημι inaeleza Paulo kuinuka kimwili baada ya kuachwa akidhaniwa kuwa amekufa. “Alisimama” ni ya kawaida na haiongezi dai la wazi la ufufuo.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: akaingia mjini
  rationale: Kauli hii inahifadhi mwendo wa kuingia ndani ya mji na inaunganika kwa kawaida na kitendo kilichotangulia.
- source_word: τῇ ἐπαύριον
  choice: Kesho yake
  rationale: Kirai hiki cha wakati humaanisha siku iliyofuata; “Kesho yake” ni usemi wa kawaida na ulio wazi katika simulizi la Kiswahili.
- source_word: ἐξῆλθεν
  choice: aliondoka
  rationale: Ingawa ἐξέρχομαι kihalisi ni “kwenda nje,” hapa kuondoka ndilo wazo la kawaida kwa kuwa mahali alikokwenda panatajwa mara moja.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: pamoja na Barnaba
  rationale: σύν pamoja na hali ya dative huonyesha uandamani. “Pamoja na Barnaba” linaweka wazi kwamba walisafiri wote wawili.
- source_word: Δέρβην
  choice: Derbe
  rationale: Huu ni unukuzi wa kawaida wa jina la mahali katika Kiswahili.
theological_decisions:
- issue: Iwapo ἀναστὰς itafsiriwe kwa namna inayodokeza ufufuo au kufufuliwa kimuujiza
  choice: alisimama
  alternative: alifufuka; aliinuliwa
  rationale: ἀναστὰς peke yake mara nyingi humaanisha kuinuka au kusimama. Ingawa muktadha unaonyesha kupona kwa kushangaza baada ya kupigwa mawe, mstari huu hausemi wazi kwamba Paulo alifufuka au aliinuliwa na Mungu. Tafsiri imebaki na tendo la kawaida la kimwili bila kuondoa uzito wa tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa vitenzi mfululizo “alisimama, akaingia” unafaa simulizi la Kiswahili, huku alama zote za tanbihi zikionekana katika matini kuu.
