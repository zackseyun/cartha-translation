  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: sw
  text: Akasema kwa sauti kubwa, “Simama wima kwa miguu yako.”[a] Naye akaruka na kuanza kutembea.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Inuka wima kwa miguu yako.”
    reason: lexical_alternative
  - marker: b
    text: Au “akaruka, akawa akitembea.” Kitenzi cha mwisho kiko katika wakati usiotimilifu, ambao unaweza kusisitiza tendo linaloendelea au mwanzo wa kutembea.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: kwa sauti kubwa
  rationale: Kirai hiki cha hali kinatafsiriwa kwa Kiswahili cha kawaida na kuhifadhi maana ya kusema kwa sauti yenye nguvu na inayosikika wazi.
- source_word: Ἀνάστηθι
  choice: Simama
  rationale: Katika muktadha huu, amri inamtaka mtu achukue hali ya kusimama; “Simama” ni ya moja kwa moja na inaungana kwa kawaida na “wima kwa miguu yako.”
- source_word: ἐπὶ τοὺς πόδας σου
  choice: kwa miguu yako
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza mtu kusimama akijitegemeza kwa miguu yake.
- source_word: ὀρθός
  choice: wima
  rationale: “Wima” hueleza wazi mkao ulionyooka unaokusudiwa na kivumishi hiki.
- source_word: ἥλατο
  choice: akaruka
  rationale: Kitenzi hiki kinaonyesha mruko wa ghafla; “akaruka” kinahifadhi uhai wa simulizi bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: περιεπάτει
  choice: kuanza kutembea
  rationale: Wakati usiotimilifu unaweza kuonyesha tendo linaloendelea au mwanzo wake. Katika mfuatano huu, “kuanza kutembea” huonyesha mwanzo wa tendo baada ya kuruka huku tanbihi ikihifadhi uwezekano wa tendo linaloendelea.
theological_decisions:
- issue: Lugha ya muujiza na amri kuhusu mkao
  choice: Kutafsiri amri na mwitikio kama uponyaji wa kimwili wa mara moja bila maelezo ya ziada
  alternative: Kuongeza ufafanuzi wa kitheolojia kuhusu chanzo au maana ya muujiza
  rationale: Kigiriki kinasimulia amri ya moja kwa moja ikifuatiwa na mwitikio wa ghafla unaoonekana. Tafsiri inahifadhi uhalisi huo bila kuingiza madai ya kimadhehebu au maelezo yasiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo wa simulizi wenye “aka-” umetumiwa kuhifadhi mfuatano wa haraka wa matendo.
