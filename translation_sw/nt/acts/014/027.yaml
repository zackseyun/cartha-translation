  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: sw
  text: Walipofika na kulikusanya kanisa, waliwaeleza yote ambayo Mungu alikuwa amefanya pamoja nao[a], na kwamba alikuwa amewafungulia watu wasio Wayahudi mlango wa imani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu alikuwa amefanya kupitia kwao.” Kigiriki kinasema kwa maana ya moja kwa moja zaidi, “pamoja nao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa amewafungulia mataifa mlango wa imani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Walipofika
  rationale: Kishiriki cha wakati uliopita kinaonyesha tendo lililotangulia taarifa yao; muundo huu ni wa kawaida katika Kiswahili na unadumisha maana ya wakati.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: na kulikusanya kanisa
  rationale: Inaonyesha kwamba waliitisha kusanyiko la waumini wa mahali hapo. “Kanisa” ndilo neno la kawaida kwa ἐκκλησία katika Matendo.
- source_word: ἀνήγγελλον
  choice: waliwaeleza
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha kusimulia au kutoa taarifa kwa kusanyiko. “Waliwaeleza” ni cha asili na kinafaa muktadha wa kutoa habari za safari.
- source_word: ὅσα
  choice: yote ambayo
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la mambo yote yaliyokuwa maudhui ya taarifa.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: Mungu alikuwa amefanya pamoja nao
  rationale: “Pamoja nao” hudumisha maana ya msingi ya μετά pamoja na hali ya Mungu kuwa mtendaji, bila kulazimisha maana ya chombo kama “kupitia kwao.”
- source_word: ἤνοιξεν
  choice: alikuwa amewafungulia
  rationale: Wakati timilifu uliopita unafaa taarifa inayotazama nyuma kwenye tendo la Mungu lililokwisha kutendeka; kiambishi “-wa-” kinabainisha wale waliofunguliwa njia.
- source_word: τοῖς ἔθνεσιν
  choice: watu wa mataifa
  rationale: Katika muktadha huu ni watu wasio Wayahudi, si mataifa kama vyombo vya kisiasa. Usemi huu ni wazi na wa kawaida katika Kiswahili cha Biblia.
- source_word: θύραν πίστεως
  choice: mlango wa imani
  rationale: Hudumisha sitiari ya mlango na uhusiano wa kimuundo kati ya mlango na imani bila kuufafanua kupita kiasi.
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida na inayofaa hapa; hakuna sababu ya kuibadili kuwa “uaminifu” katika muktadha huu.
theological_decisions:
- issue: Maana ya μετ’ αὐτῶν katika kueleza tendo la Mungu
  choice: Mungu alikuwa amefanya pamoja nao
  alternative: Mungu alikuwa amefanya kupitia kwao
  rationale: Tafsiri inadumisha kihusishi cha Kigiriki chenye maana ya “pamoja na,” ikimwacha Mungu kuwa mtendaji mkuu na bila kuamua kimya kimya kwamba mitume walikuwa vyombo pekee vya tendo hilo.
- issue: Tafsiri ya ἔθνεσιν
  choice: watu wa mataifa
  alternative: Mataifa
  rationale: Muktadha unahusu kuingizwa kwa watu wasio Wayahudi, wala si mataifa kama nchi au serikali. “Watu wa mataifa” huwasilisha tofauti hiyo kwa uwazi.
- issue: Maana ya θύραν πίστεως
  choice: mlango wa imani
  alternative: mlango wa kuingia katika imani
  rationale: 'Muundo mfupi unahifadhi sitiari na utata halisi wa uhusiano wa genitivi: unaweza kuelekeza kwenye fursa ya kuamini au kuingia katika eneo la imani bila tafsiri kuamua zaidi ya maandishi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Watu wa mataifa” hutumiwa kueleza wasio Wayahudi kwa uwazi, huku “mlango wa imani” ukihifadhi sitiari ya Kigiriki. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
