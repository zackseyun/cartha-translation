lexical_decisions:
- source_word: διέτριβον
  choice: wakakaa
  rationale: Kitenzi hiki katika wakati usiotimilika kinaonyesha kuendelea kukaa au kutumia muda mahali fulani; “wakakaa” ni Kiswahili cha kawaida kinachofaa katika simulizi.
- source_word: δὲ
  choice: Nao
  rationale: Kiunganishi hiki ni mpito mwepesi wa simulizi; “Nao” kinaendeleza habari kwa kawaida huku kikiwarejelea wahusika waliotangulia.
- source_word: χρόνον οὐκ ὀλίγον
  choice: kwa muda usiokuwa mfupi
  rationale: Usemi huu unahifadhi litotes ya Kigiriki, yaani kueleza muda mrefu kwa kukana kuwa ulikuwa mfupi.
- source_word: σὺν τοῖς μαθηταῖς
  choice: pamoja na wanafunzi
  rationale: σύν pamoja na hali ya dative humaanisha moja kwa moja “pamoja na”; hapa wanafunzi ni waumini wa mahali hapo.
