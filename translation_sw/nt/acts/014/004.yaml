  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: sw
  text: Lakini watu wa mji waligawanyika[a]; wengine walikuwa upande wa Wayahudi, na wengine upande wa mitume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umati wa mji uligawanyika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: waligawanyika
  rationale: Kitenzi hiki katika hali ya kutendwa humaanisha kugawanywa au kupasuliwa. Kiswahili cha kawaida hutumia “waligawanyika” kueleza mgawanyiko wa watu katika makundi mawili.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: watu wa mji
  rationale: Hapa πλῆθος haionyeshi tu umati uliokusanyika wakati mmoja, bali watu wa mji kwa upana; “watu wa mji” ni ya asili na wazi.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti au hatua mpya yenye ukinzani baada ya matukio ya mstari uliotangulia.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: wengine ... na wengine
  rationale: Muundo huu unatofautisha makundi mawili ya watu kwa njia ya kawaida katika Kiswahili.
- source_word: σὺν
  choice: upande wa
  rationale: Ingawa maana ya msingi ni “pamoja na,” katika muktadha huu kinamaanisha kujiunga au kuunga mkono upande fulani; “upande wa” huwasilisha wazi mwelekeo huo.
- source_word: Ἰουδαίοις
  choice: Wayahudi
  rationale: Hakuna jambo katika mstari huu linaloweka maana kwa viongozi pekee; neno linarejelea Wayahudi kama kundi linalotambulika.
- source_word: ἀποστόλοις
  choice: mitume
  rationale: Hili ni neno lililozoeleka na sahihi kwa ἀπόστολοι katika Matendo; hapa linawarejelea Paulo na Barnaba kama simulizi lenyewe linavyowaita katika Matendo 14:14.
theological_decisions:
- issue: Wanaorejelewa kwa neno “mitume”
  choice: Kudumisha “mitume” kama jina la Paulo na Barnaba katika simulizi.
  alternative: “wajumbe”
  rationale: Luka anawaita Barnaba na Paulo waziwazi “mitume” baadaye katika sura hii (Matendo 14:14). Tafsiri hii inadumisha usemi wa maandiko bila kuingiza ufafanuzi mwembamba wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. “Upande wa” limetumiwa badala ya “pamoja na” ili kuonyesha uegemeaji wa makundi bila kuongeza madai yasiyokuwamo katika muktadha.
