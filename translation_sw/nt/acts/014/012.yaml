  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: sw
  text: Nao walikuwa wakimwita Barnaba Zeu, na Paulo Herme, kwa sababu Paulo ndiye aliyekuwa msemaji mkuu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλουν
  choice: wakawa wakimwita
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha kitendo kilichoendelea katika mwitikio wa umati; muundo huu wa Kiswahili unahifadhi hali hiyo.
- source_word: τε
  choice: Nao
  rationale: Inaunganisha kwa upole sentensi hii na simulizi lililotangulia kwa namna ya kawaida katika Kiswahili.
- source_word: Δία
  choice: Zeu
  rationale: Nakala ya Kigiriki inamtaja mungu wa Kigiriki Zeu moja kwa moja; jina la Kirumi, Jupita, halijaingizwa.
- source_word: Ἑρμῆν
  choice: Herme
  rationale: Nakala ya Kigiriki inamtaja Herme moja kwa moja; jina la Kirumi, Merkuri, halijaingizwa.
- source_word: ἐπειδὴ
  choice: kwa sababu
  rationale: Inaonyesha wazi sababu ya umati kumtambua Paulo kuwa Herme.
- source_word: αὐτὸς
  choice: ndiye
  rationale: Muundo wa mkazo unamtenga Paulo na Barnaba na kuonyesha kwamba Paulo ndiye hasa aliyekuwa akiongoza katika kusema.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: msemaji mkuu
  rationale: Ni tafsiri ya kawaida na yenye kueleweka ya yule aliyeongoza katika kusema, bila kuipa λόγος maana maalumu ya kitheolojia.
theological_decisions:
- issue: Majina ya miungu ya kipagani
  choice: Kutumia “Zeu” na “Herme” katika matini kuu
  alternative: Jupita na Merkuri
  rationale: Majina ya Kigiriki yaliyomo katika chanzo yamehifadhiwa badala ya kubadilishwa kuwa majina sawia ya Kirumi yaliyozoeleka katika baadhi ya mapokeo ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, chenye heshima na kinachoeleweka kwa urahisi. “Wakawa wakimwita” huhifadhi mwendelezo wa ἐκάλουν, na “msemaji mkuu” hutoa kwa ufasaha maana ya ὁ ἡγούμενος τοῦ λόγου.
