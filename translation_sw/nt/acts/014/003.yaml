id: ACT.14.3
reference: Acts 14:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: sw
  text: Basi wakakaa huko kwa muda mrefu, wakisema kwa ujasiri katika Bwana,[a] aliyekuwa akilishuhudia neno la neema yake kwa kujalia ishara na maajabu zifanyike kwa njia ya mikono yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakisema kwa ujasiri wakimtegemea Bwana” au “kwa ajili ya Bwana.” Kirai cha Kigiriki kinaweza kuonyesha kwamba ujasiri wao ulikuwa katika Bwana, ulimtegemea, au ulionyeshwa katika kumtumikia.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: kwa muda mrefu
  rationale: Nahau hii inaonyesha muda mkubwa au wa kutosha. “Kwa muda mrefu” ni Kiswahili cha kawaida na cha wazi bila kudai urefu kamili usiotajwa.
- source_word: διέτριψαν
  choice: wakakaa huko
  rationale: Kitenzi hiki hapa humaanisha kukaa au kutumia muda mahali fulani; “wakakaa huko” huonyesha kwa kawaida mahali na kuendelea kwa tendo.
- source_word: παρρησιαζόμενοι
  choice: wakisema kwa ujasiri
  rationale: Hueleza kusema wazi bila woga; tafsiri hii huhifadhi tendo la kusema pamoja na ujasiri wake.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: wakimtegemea Bwana
  rationale: ἐπί pamoja na hali ya dative inaweza kuonyesha msingi au tegemeo la ujasiri wao. Kiswahili hiki ni cha kawaida na hudumisha uhusiano huo bila kuufanya kuwa mahali halisi.
- source_word: τῷ κυρίῳ
  choice: Bwana
  rationale: Huhifadhi cheo κύριος bila kuongeza jina “Yesu,” ambalo halipo wazi katika kifungu hiki.
- source_word: τῷ μαρτυροῦντι
  choice: ambaye alilishuhudia
  rationale: Huhifadhi taswira ya Bwana kutoa ushahidi wa kuunga mkono neno lililohubiriwa, badala ya kuibadili tu kuwa “alithibitisha.”
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: neno la neema yake
  rationale: Huhifadhi muundo wa Kigiriki na istilahi muhimu za kibiblia, huku ikieleweka kuwa ni ujumbe unaohusu au wenye sifa ya neema yake.
- source_word: διδόντι
  choice: kwa kujalia
  rationale: “Kujalia” huonyesha kwamba Bwana ndiye aliyetoa uwezo au ruhusa ya matendo hayo kutokea.
- source_word: σημεῖα καὶ τέρατα
  choice: ishara na maajabu
  rationale: Ni jozi ya istilahi iliyozoeleka kibiblia, inayohifadhi maana ya matendo yenye ushahidi na yenye kushangaza.
- source_word: γίνεσθαι
  choice: yatendeke
  rationale: Hueleza ishara na maajabu kutokea kama matendo, bila kuwafanya wajumbe kuwa chanzo chake cha mwisho.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: kwa mikono yao
  rationale: Huhifadhi nahau halisi inayowaonyesha wao kuwa vyombo ambavyo matendo hayo yalifanyika kupitia kwao.
theological_decisions:
- issue: Anayerejelewa na “Bwana”
  choice: Kutafsiri tu “Bwana” bila kuongeza “Yesu” au “Mungu.”
  alternative: “Bwana Yesu” au “Mungu.”
  rationale: Maandishi ya Kigiriki yana τῷ κυρίῳ pekee. Muktadha unaweza kumwelekeza msomaji kwa Yesu aliyefufuka, lakini tafsiri haipaswi kuongeza jina lisilokuwapo.
- issue: Maana ya ἐπὶ τῷ κυρίῳ
  choice: “wakimtegemea Bwana” katika maandishi makuu.
  alternative: “kwa ajili ya Bwana” au “katika Bwana.”
  rationale: Kirai kinaweza kueleza msingi, utegemezi, au uhusiano wa kusema kwao kwa ujasiri. Chaguo kuu huonyesha msingi wa ujasiri wao, na tanbihi huhifadhi uwezekano wa maana ya kutenda kwa ajili ya Bwana.
- issue: Uhusiano wa “neno” na “neema”
  choice: Kuhifadhi “neno la neema yake.”
  alternative: “ujumbe kuhusu neema yake” au “neno lake lenye neema.”
  rationale: Muundo wa Kigiriki unaweza kueleza neno linalohusu neema au lenye sifa ya neema; tafsiri ya moja kwa moja huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Neno la neema yake” na “ishara na maajabu” zimehifadhiwa kama misemo ya kibiblia; sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili.
