  to: Basi wakakaa huko kwa muda mrefu, wakisema kwa ujasiri katika Bwana,[a] aliyekuwa akilishuhudia neno la neema yake kwa kujalia ishara na maajabu zifanyike kwa njia ya mikono yao.
