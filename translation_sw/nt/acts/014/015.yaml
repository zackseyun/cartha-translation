source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: sw
  text: wakisema, “Enyi wanaume, kwa nini mnafanya mambo haya? Sisi pia ni wanadamu wenye hali kama yenu[a], nasi tunawaletea habari njema ili mgeuke kutoka katika mambo haya ya ubatili na kumwelekea Mungu aliye hai, aliyeumba mbingu[b] na dunia na bahari na vitu vyote vilivyomo humo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye hali ya kibinadamu kama yenu.” Usemi huu unamaanisha kwamba Paulo na Barnaba walikuwa wanadamu wenye hali ileile ya kibinadamu kama wasikilizaji wao.
    reason: lexical_alternative
  - marker: b
    text: Au “anga.” Kigiriki kina neno la umoja katika kauli hii ya uumbaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Enyi wanaume
  rationale: Ni mwito wa moja kwa moja kwa kundi la wanaume; ‘Enyi wanaume’ ni wa kawaida na sahihi katika Kiswahili.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: wanadamu wenye hali kama yenu
  rationale: Hueleza kwamba Paulo na Barnaba wanashiriki hali ileile ya kibinadamu na wasikilizaji wao, si kwamba wana hisia zinazofanana tu.
- source_word: εὐαγγελιζόμενοι
  choice: tunawaletea habari njema
  rationale: Huhifadhi maana ya kutangaza habari njema kwa lugha wazi bila kuingiza istilahi nzito ya kidini.
- source_word: ἀπὸ τούτων τῶν ματαίων
  choice: kutoka katika mambo haya ya ubatili
  rationale: ‘Ya ubatili’ huhifadhi wazo la mambo yasiyo na faida, matupu na yasiyofaa, bila kuyafanya moja kwa moja kuwa ‘sanamu’ pekee.
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: ili mgeuke ... na kumwelekea Mungu aliye hai
  rationale: Muundo huu huonyesha kusudi la habari njema na mwendo wa kuacha mambo ya ubatili na kuelekea kwa Mungu aliye hai.
- source_word: ἐποίησεν
  choice: aliyeumba
  rationale: Katika muktadha wa tendo la Mungu la uumbaji, ‘umba’ ni kitenzi cha kawaida na sahihi zaidi katika Kiswahili.
- source_word: τὸν οὐρανὸν
  choice: mbingu
  rationale: ‘Mbingu’ ni tafsiri ya kawaida ya Kiswahili katika kauli ya uumbaji; tanbihi huhifadhi uwezekano wa ‘anga’ kwa kuwa Kigiriki ni umoja.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: vitu vyote vilivyomo ndani yake
  rationale: Huwasilisha kwa kawaida upeo wa kila kilichomo katika mbingu, dunia na bahari.
theological_decisions:
- issue: Hali ya Paulo na Barnaba kinyume na kupewa heshima ya kimungu
  choice: Sisi pia ni wanadamu wenye hali kama yenu
  alternative: Sisi pia ni wanadamu tu kama ninyi
  rationale: Inasisitiza ubinadamu wao wa pamoja na umati na kukataa kudhaniwa kuwa miungu, bila kuongeza neno ‘tu’ ambalo halipo wazi katika Kigiriki.
- issue: Upeo wa ‘mambo haya ya ubatili’
  choice: mambo haya ya ubatili
  alternative: sanamu hizi
  rationale: Muktadha unahusu ibada ya kipagani na jaribio la kutoa dhabihu, lakini Kigiriki kina usemi mpana kuliko neno maalumu la ‘sanamu’; hivyo upana huo umehifadhiwa katika maandishi.
- issue: Mwelekeo wa ἐπὶ θεὸν ζῶντα
  choice: kumwelekea Mungu aliye hai
  alternative: kumrudia Mungu aliye hai
  rationale: ‘Kumwelekea’ huonyesha mwendo kuelekea Mungu bila kudokeza kwa lazima kwamba wasikilizaji walikuwa wamemjua hapo awali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi marudio ya ‘na’ katika kauli ya uumbaji na upana wa lugha dhidi ya ibada ya kipagani.
