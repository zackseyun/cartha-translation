  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: sw
  text: Katika vizazi vilivyopita, aliruhusu mataifa yote yaende katika njia zao wenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyaacha mataifa yote yaende katika njia zao wenyewe.”
    reason: “Aliacha” ni mbadala wa “aliruhusu” kwa εἴασεν, ingawa katika maandishi makuu “aliruhusu” huepusha uwezekano wa kueleweka kuwa kuwaacha au kuwatelekeza.
lexical_decisions:
- source_word: ὃς
  choice: yeye
  rationale: Kiwakilishi hiki kinamrejelea Mungu aliyetajwa katika mstari uliotangulia. Kutumia “yeye” kunaendeleza sentensi kwa Kiswahili cha kawaida bila kupoteza rejeleo hilo.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: Katika vizazi vilivyopita
  rationale: Huhifadhi maana ya vizazi vya zamani ambavyo vimekwisha kupita kwa lugha ya sasa na iliyo wazi.
- source_word: εἴασεν
  choice: aliacha
  rationale: “Aliacha” hapa humaanisha aliruhusu, si kwamba aliyakubali kimaadili; pia ni usemi wa kawaida katika Kiswahili.
- source_word: πάντα τὰ ἔθνη
  choice: mataifa yote
  rationale: Huhifadhi upana wa usemi wa Kigiriki unaoweza kumaanisha mataifa au watu wasio Wayahudi, bila kulazimisha utofautishaji huo katika maandishi makuu.
- source_word: πορεύεσθαι
  choice: yaende
  rationale: Kitenzi hiki kimsingi humaanisha kwenda. Pamoja na “njia,” kinadumisha sitiari ya mwenendo wa maisha kwa Kiswahili cha asili.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: katika njia zao wenyewe
  rationale: “Njia” huhifadhi sitiari ya Kigiriki kuhusu mwenendo, na “zao wenyewe” huonyesha wazi nguvu ya kiwakilishi cha umilikaji.
theological_decisions:
- issue: Ruhusa ya Mungu dhidi ya idhini yake
  choice: Mungu aliyaacha mataifa yaende katika njia zao wenyewe, yaani aliyaruhusu bila kudokeza kwamba aliyakubali kimaadili.
  alternative: Mungu aliyakubali au aliyapanga moja kwa moja mataifa yaishi hivyo.
  rationale: Kitenzi ἐάω huonyesha kuruhusu au kuacha. Tafsiri inadumisha mvutano kati ya enzi ya Mungu na wajibu wa wanadamu bila kuongeza wazo la idhini ya kimaadili au uamuzi wa kisababishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kwenda katika njia imehifadhiwa kwa sababu ni ya asili na inaonyesha mwenendo wa maisha.
