lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: Kwa sababu ya mambo haya
  rationale: Kirai hiki huonyesha sababu na hurejelea mambo ambayo Paulo ametoka kueleza; tafsiri hii ni ya asili katika Kiswahili na huhifadhi rejeo hilo la nyuma.
- source_word: με
  choice: -ni- (katika “walinikamata”)
  rationale: Kiwakilishi cha nafsi ya kwanza umoja katika hali ya kutendwa kinaonyeshwa kiasili kwa kiambishi cha yambwa -ni-.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Nomino hii inawataja Wayahudi waliohusika katika tukio hilo. Muktadha unaonyesha kuwa si dai kuhusu Wayahudi wote.
- source_word: συλλαβόμενοι
  choice: walinikamata
  rationale: Kitenzi hiki kina maana ya kumshika mtu kwa nguvu au kumkamata; “walinikamata” kinafaa katika muktadha huu wa uhasama bila kudokeza lazima ukamataji rasmi wa kisheria.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Hii ni tafsiri ya kawaida na fasaha; neno la Kigiriki hurejelea eneo lote la Hekalu, si patakatifu pa ndani pekee, jambo linalofafanuliwa katika tanbihi.
- source_word: ἐπειρῶντο
  choice: wakawa wakijaribu
  rationale: Muundo huu unaonyesha jaribio lililokuwa likiendelea, na hivyo huhifadhi hali endelevu ya wakati usiotimilika wa Kigiriki.
- source_word: διαχειρίσασθαι
  choice: kuniua
  rationale: Katika muktadha huu kitenzi kinamaanisha kumuua mtu kwa nguvu; “kuniua” ni wazi na hakiongezi dhana ya kisheria ambayo haijaelezwa moja kwa moja.
theological_decisions:
- issue: Rejeo la “Wayahudi” katika muktadha nyeti wa upinzani
  choice: “Wayahudi,” likieleweka kimuktadha kuwa wale waliomkamata Paulo
  alternative: “baadhi ya Wayahudi” au “wale Wayahudi”
  rationale: Kigiriki kinataja kundi lililohusika bila neno linalomaanisha “baadhi.” Kuongeza “baadhi ya” kungezuia ujumla lakini kungeongeza neno lisilokuwapo; muktadha wenyewe unaweka mpaka wa rejeo na hauwahukumu Wayahudi wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa sentensi ni wa kawaida, huku “wakawa wakijaribu” ikihifadhi jaribio endelevu. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
