  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: sw
  text: Kwa sababu ya mambo haya[a], Wayahudi walinikamata hekaluni[b] na walikuwa wakijaribu kuniua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa ajili ya mambo haya” au “Kwa sababu hiyo.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki hapa linamaanisha eneo lote la Hekalu, si patakatifu pa ndani pekee.
