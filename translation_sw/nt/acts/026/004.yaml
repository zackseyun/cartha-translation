  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: sw
  text: Basi, Wayahudi wote wanajua mwenendo wangu tangu ujana wangu, uliokuwa tangu mwanzo katika taifa langu na pia Yerusalemu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βίωσίν
  choice: mwenendo wangu
  rationale: Neno hili humaanisha namna au mwendo wa kuishi, si kuwapo hai tu; “mwenendo wangu” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐκ νεότητος
  choice: tangu ujana wangu
  rationale: Huhifadhi mwanzo wa kipindi kinachotajwa na uhusiano wake wa kibinafsi na Paulo.
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayosisitiza upeo wa wakati.
- source_word: γενομένην
  choice: jinsi ulivyokuwa
  rationale: Hueleza mwendo huo wa maisha kama ulivyoendelea katika mazingira yaliyotajwa bila kutumia Kiswahili kisicho cha kawaida kama “ulivyotokea.”
- source_word: ἐν τῷ ἔθνει μου
  choice: miongoni mwa taifa langu
  rationale: Hapa ἔθνος ni jamii ya watu wa Paulo, si lazima taifa-dola la kisasa; “miongoni mwa” huonyesha mazingira ya kijamii.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: na pia Yerusalemu
  rationale: Huwasilisha nguvu ya kuunganisha ya τε na kuongeza Yerusalemu kama eneo lingine.
- source_word: ἴσασι
  choice: wanaujua
  rationale: Umbo la Kigiriki lina maana ya hali ya sasa, “wanajua”; kiambishi “u” kinarejelea mwenendo.
- source_word: πάντες Ἰουδαῖοι
  choice: Wayahudi wote
  rationale: Ni tafsiri ya moja kwa moja ya kundi linalotajwa, bila kupunguza dai la jumla la Paulo.
- source_word: μὲν οὖν
  choice: Basi
  rationale: “Basi” huonyesha mpito na mwendelezo wa hoja kwa Kiswahili cha asili bila kuzidisha uzito wa vihusishi hivyo.
