base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: sw
  text: ambalo watu wetu wa makabila kumi na mawili wanatumaini kulifikia[a], huku wakimtumikia Mungu[b] kwa bidii usiku na mchana. Ee mfalme, ni kuhusu tumaini hili kwamba ninashtakiwa na Wayahudi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taifa letu lenye makabila kumi na mawili.” Kigiriki kinatumia nomino ya umoja yenye maana ya kijumla, ikirejelea Israeli kama watu wa makabila kumi na mawili.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakimwabudu Mungu.” Kitenzi cha Kigiriki kinaweza kumaanisha utumishi wa kidini au ibada inayotolewa kwa Mungu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, Wayahudi waliokuwa wakimshtaki Paulo; maneno haya hayamaanishi Wayahudi wote kwa ujumla.
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: ambalo ... kulifikia
  rationale: Huhifadhi mwelekeo wa εἰς na kurejelea ahadi iliyotajwa katika mstari uliotangulia kama lengo la tumaini.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: watu wetu wa makabila kumi na mawili
  rationale: Huwakilisha nomino ya umoja yenye maana ya kijumla, yaani Israeli kama taifa lenye makabila kumi na mawili, kwa Kiswahili cha kawaida.
- source_word: ἐν ἐκτενείᾳ
  choice: kwa bidii
  rationale: Hueleza uzito, juhudi, na udumifu wa ibada au utumishi wao kwa lugha ya asili na inayoeleweka.
- source_word: νύκτα καὶ ἡμέραν
  choice: usiku na mchana
  rationale: Huhifadhi mpangilio wa Kigiriki na maana ya tendo linaloendelea daima.
- source_word: λατρεῦον
  choice: wakimtumikia Mungu
  rationale: Kitenzi kinaonyesha utumishi wa kidini au ibada inayotolewa kwa Mungu; kumtaja Mungu wazi hufanya maana ya muktadha ieleweke.
- source_word: ἐλπίζει καταντῆσαι
  choice: wanatumaini kulifikia
  rationale: Hueleza kufika kwenye lengo linalotumainiwa na hulingana kisarufi na kiwakilishi kinachorejelea neno ‘ahadi’ katika mstari uliotangulia.
- source_word: περὶ ἧς ἐλπίδος
  choice: ni kuhusu tumaini hili
  rationale: Huhifadhi maana ya msingi ya περί pamoja na umilikaji bila kuamua kimya kimya kuwa shtaka lilisababishwa na tumaini hilo.
- source_word: ἐγκαλοῦμαι
  choice: ninashtakiwa
  rationale: Ni neno la kawaida la Kiswahili lenye maana ya kisheria inayofaa mazingira ya utetezi wa Paulo.
- source_word: ὑπὸ Ἰουδαίων
  choice: na Wayahudi
  rationale: Ni tafsiri ya moja kwa moja ya mtendaji wa kauli tendwa; tanbihi inaweka wazi kwamba si dai kuhusu Wayahudi wote.
- source_word: βασιλεῦ
  choice: Ee mfalme
  rationale: Huhifadhi hali ya kumwita mfalme moja kwa moja na uzito wa usemi wa Paulo.
theological_decisions:
- issue: Mtendewa asiyetajwa wazi wa λατρεῦον
  choice: wakimtumikia Mungu
  alternative: wakiabudu; wakitoa utumishi wa kidini
  rationale: Ingawa ‘Mungu’ hayupo wazi katika kishazi cha Kigiriki, muktadha wa ibada ya Israeli unaonyesha kuwa ndiye anayelengwa. Kumtaja hufafanua maana bila kuongeza dai jipya la kiteolojia.
- issue: Tumaini linarejelea nini
  choice: Kudumisha uhusiano wake na ahadi ya Mungu iliyotajwa katika mstari uliotangulia bila kutaja ufufuo wazi hapa
  alternative: Kulieleza moja kwa moja kuwa tumaini la ufufuo
  rationale: Muktadha mpana unahusisha ufufuo, lakini mstari huu wenyewe unarejelea ahadi bila kurudia maudhui yake; tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa kuwa wa kawaida katika Kiswahili, huku ‘Ee mfalme’ ikitangulizwa katika sentensi ya pili. Alama zote za tanbihi zimewekwa katika matini kuu.
