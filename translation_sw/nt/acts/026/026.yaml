  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: sw
  text: Kwa maana mfalme anayajua mambo haya, nami nasema naye kwa ujasiri[a]. Kwa maana nina hakika kwamba hakuna lolote kati ya mambo haya lililomfichika[b] kwake, kwa kuwa jambo hili halikutendeka kwa siri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uhuru” au “kwa uwazi.” Neno la Kigiriki linaonyesha kusema waziwazi na kwa kujiamini.
    reason: lexical_alternative
  - marker: b
    text: Au, “lililomponyoka” au “ambalo hakulitambua.”
    reason: lexical_alternative
  - marker: c
    text: Kwa Kigiriki, “katika pembe.” Hii ni nahau yenye maana ya kutotendeka kwa siri au mahali pasipojulikana.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: anayajua
  rationale: Kitenzi hiki kinaonyesha ujuzi au kufahamu jambo; “anayajua” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: περὶ τούτων
  choice: mambo haya
  rationale: Muundo huu unaonyesha mada inayozungumziwa; katika Kiswahili “anayajua mambo haya” ni wa asili kuliko tafsiri neno kwa neno ya “anajua kuhusu mambo haya.”
- source_word: παρρησιαζόμενος
  choice: kwa ujasiri
  rationale: Neno hili lina maana ya kusema kwa uhuru, uwazi na kujiamini bila woga; “kwa ujasiri” huhifadhi kiini hicho.
- source_word: πρὸς ὃν ... λαλῶ
  choice: ninazungumza naye
  rationale: Huu ni muundo wa asili wa Kiswahili unaoonyesha kwamba mfalme ndiye anayeelekezewa maneno.
- source_word: λανθάνειν ... αὐτὸν
  choice: ambalo hakulijua
  rationale: Muundo wa Kigiriki unaeleza jambo kutotambuliwa na mtu. Kiswahili hiki ni wazi na cha kawaida, huku tanbihi ikihifadhi uwezekano wa “halikumpita bila yeye kuliona.”
- source_word: οὐ πείθομαι οὐθέν
  choice: Nimesadiki kwamba hakuna hata moja
  rationale: Kauli hii inaonyesha usadikisho thabiti wa Paulo kwamba hakuna jambo lolote lililokuwa nje ya ufahamu wa mfalme.
- source_word: πεπραγμένον
  choice: halikufanyika
  rationale: Huhifadhi maana ya tendo lililotendeka; kauli ya wakati uliopita ni ya asili katika muktadha huu wa Kiswahili.
- source_word: ἐν γωνίᾳ
  choice: pembeni
  rationale: Huhifadhi taswira ya Kigiriki ya jambo kutendwa mahali pasipoonekana, bila kubadili moja kwa moja kuwa “kwa siri.”
- source_word: τοῦτο
  choice: jambo hili
  rationale: Hurejelea kwa upana matukio yanayozungumziwa bila kubainisha zaidi ya maandishi ya Kigiriki.
theological_decisions:
- issue: Upeo wa “jambo hili” na hali ya matukio kujulikana hadharani
  choice: “jambo hili,” bila kufafanua zaidi
  alternative: Kulihusisha mahsusi na kifo na ufufuo wa Yesu pekee, au kwa upana na harakati nzima ya Kikristo pamoja na kesi ya Paulo
  rationale: Kiwakilishi cha Kigiriki kinaweza kuelekeza kwa upana kwenye matukio yaliyokuwa yakizungumziwa. Tafsiri haipaswi kuweka mipaka ambayo mstari wenyewe haujaweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili. Taswira ya “pembeni” imehifadhiwa na kufafanuliwa katika tanbihi; marejeo mapana ya “jambo hili” hayajabanwa kitheolojia.
