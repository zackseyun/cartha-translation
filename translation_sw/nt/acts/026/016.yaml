  verdict: revise
  source_fidelity: Rasimu hudumisha kwa usahihi amri ya kuinuka/kusimama, kusudi la kutokea, uteuzi wa Paulo kuwa mtumishi na shahidi, na lugha ya Yesu kumtokea tena. Hata hivyo, “mambo ambayo umeniona ndani yake” na “mambo ambayo nitakutokea ndani yake” huongeza na kubadilisha uhusiano wa mahali (“ndani yake”) ambao hauko wazi katika Kigiriki, na hufanya sentensi isieleweke vizuri. Ujenzi uliobanwa wa ὧν τε εἶδές με ... ὧν τε ὀφθήσομαί σοι unaweza kuhifadhiwa kwa Kiswahili kwa ufupi bila nyongeza hiyo.
  naturalness: “Usimame” baada ya “inuka” si amri sambamba iliyo ya moja kwa moja kama στῆθι; “simama” ni asilia zaidi. Pia, “kukuteua uwe mtumishi” ni mzito kidogo; “kukuteua kuwa mtumishi” ni laini na sahihi. Toleo lililorekebishwa linadumisha hadhi ya kifungu huku likisomeka kwa Kiswahili sanifu cha Afrika Mashariki.
  terminology: “Nimekutokea,” “mtumishi,” “shahidi,” na “kukuteua” zinafaa. “Mtumishi” humwakilisha ὑπηρέτης bila kuilazimisha iwe δοῦλος, na “shahidi” ni tafsiri thabiti ya μάρτυς.
