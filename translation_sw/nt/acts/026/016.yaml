base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: sw
  text: 'Lakini inuka, simama kwa miguu yako, kwa maana nimekutokea kwa kusudi hili: kukuteua kuwa mtumishi na shahidi wa yale uliyoniona, na wa yale nitakayokutokea.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki hapa kina muundo uliobanwa. Kwa ukaribu zaidi na muundo wake: “... shahidi wa yale umeniona na ya yale nitakayokutokea.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστηθι
  choice: inuka
  rationale: Amri ya wakati uliopita katika muktadha huu inadai tendo la mara moja; “inuka” ni ya kawaida, wazi, na yenye nguvu ya amri.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: usimame kwa miguu yako
  rationale: Inahifadhi taswira halisi ya amri ya kusimama na inafaa kwa Kiswahili sanifu katika tukio la kuitwa na kupewa utume.
- source_word: εἰς τοῦτο γὰρ
  choice: kwa maana nimekutokea kwa kusudi hili
  rationale: “Kwa kusudi hili” huonyesha wazi lengo la kutokea huko, huku “kwa maana” ikihifadhi uhusiano wa γάρ na amri iliyotangulia.
- source_word: ὤφθην σοι
  choice: nimekutokea
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, hapa ni kauli ya kawaida ya kuonekana kwa mtu katika ufunuo; “nimekutokea” ni fupi na asilia.
- source_word: προχειρίσασθαί σε
  choice: kukuteua
  rationale: Kitenzi kinaonyesha kuchaguliwa na kuwekwa rasmi kwa jukumu; “kukuteua” huwasilisha agizo hilo bila kulifanya kuwa la kikanisa kupita kiasi.
- source_word: ὑπηρέτην
  choice: mtumishi
  rationale: Neno humaanisha mtu anayehudumu chini ya mamlaka au akiwa msaidizi; “mtumishi” linaeleweka kwa urahisi na halilinganishi neno hili moja kwa moja na δοῦλος.
- source_word: μάρτυρα
  choice: shahidi
  rationale: “Shahidi” ndilo neno la kawaida na sahihi kwa mtu anayetoa ushuhuda wa aliyoyaona au kufunuliwa.
- source_word: ὧν τε εἶδές με
  choice: wa mambo ambayo umeniona ndani yake
  rationale: Hufuata kwa ukaribu ujenzi uliobanwa wa Kigiriki na kudumisha uhusiano wa με na tendo la kuona bila kuamua kimya-kimya kwamba maana ni ‘mambo uliyoona kunihusu.’
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: wa mambo ambayo nitakutokea ndani yake
  rationale: Inadumisha lugha ya kutokea katika wakati ujao na usambamba wake na sehemu ya kwanza, ingawa ujenzi huo ni mzito kidogo kwa Kiswahili.
theological_decisions:
- issue: Tabia ya ufunuo katika ὤφθην / ὀφθήσομαί
  choice: 'Kutafsiri vitenzi vyote viwili kwa lugha ya kutokea: “nimekutokea” na “nitakutokea.”'
  alternative: “Umeniona / utaniona” au “nimejifunua / nitajifunua.”
  rationale: Hii inadumisha tukio la Yesu aliyefufuka kumtokea Paulo na kumpa utume, bila kufafanua kupita maandishi namna hasa ya kuonekana huko.
- issue: Ujenzi uliobanwa wa ὧν ... ὧν
  choice: Kudumisha maana inayoweza kueleweka kama mazingira au mambo ambamo Yesu anaonekana, huku ukielezwa katika tanbihi.
  alternative: “Mambo uliyoona kunihusu na mambo nitakayokuonyesha.”
  rationale: Mbadala ni mwepesi zaidi lakini huamua uhusiano wa viwakilishi na hubadili kitenzi cha kutokea kuwa kuonyesha; maandishi na tanbihi huhifadhi mvutano wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mwisho umeachwa kuwa rasmi kiasi ili kuhifadhi ujenzi na utata wa Kigiriki; tanbihi hutoa njia mbadala bila kuufanya mstari mkuu kuwa tafsiri ya kimadhehebu.
