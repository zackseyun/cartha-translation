  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: sw
  text: Nami nikasema, “Wewe ni nani, Bwana?”[a] Bwana akasema, “Mimi ni Yesu, ambaye unamtesa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe ni nani, bwana?” Neno la Kigiriki κύριε linaweza kutumiwa kama namna ya heshima ya kumwita mtu; hapa “Bwana” limewekwa katika matini kwa sababu msemaji wa mbinguni anatambulishwa mara moja kuwa Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: Nami nikasema
  rationale: δέ ni kiunganishi hafifu cha simulizi; “nami” kinaendeleza mtiririko na kuwakilisha kiwakilishi cha wazi ἐγώ bila kulazimisha utofautishaji mkali.
- source_word: Τίς εἶ, κύριε;
  choice: Wewe ni nani, Bwana?
  rationale: “Wewe ni nani?” ni swali la kawaida na la asili kwa Kiswahili. κύριε limetafsiriwa “Bwana” kwa sababu Paulo anamwambia msemaji wa mbinguni ambaye mara moja anajitambulisha kuwa Yesu; hata hivyo, uwezekano wa maana ya heshima “bwana” umeonyeshwa katika tanbihi.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: Bwana akasema
  rationale: Kiswahili hakihitaji kuwakilisha kila δέ kwa kiunganishi tofauti; muundo huu unaendeleza simulizi kwa ufasaha. ὁ κύριος ni msemaji aliyetambuliwa, hivyo “Bwana.”
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Mimi ni Yesu
  rationale: Kiwakilishi cha wazi Ἐγώ kimewakilishwa kwa “Mimi” katika utambulisho huu wa moja kwa moja bila kuongeza msisitizo usiokuwamo.
- source_word: ὃν σὺ διώκεις
  choice: ambaye unamtesa
  rationale: Katika muktadha huu διώκω humaanisha kumfuatilia mtu kwa uadui au kumdhulumu kwa sababu ya imani; “kumtesa” ni usemi wa kawaida na wenye uzito unaofaa katika Kiswahili. Wakati wa sasa unaonyesha tendo linaloendelea.
theological_decisions:
- issue: Maana ya κύριε katika swali la Paulo na κύριος katika utambulisho wa msemaji
  choice: Bwana
  alternative: bwana (neno la heshima, kama ‘sir’)
  rationale: Katika swali lenyewe κύριε linaweza kuwa neno la heshima, hivyo utata huo haupaswi kufichwa. Hata hivyo, tukio la mbinguni, jibu “Mimi ni Yesu,” na matumizi yanayofuata ya ὁ κύριος yanaunga mkono “Bwana” katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nami nikasema” na “Bwana akasema” hudumisha mtiririko wa simulizi bila kurudia viunganishi kwa namna nzito. Alama ya tanbihi imewekwa baada ya swali zima ili ionyeshe mbadala wa neno κύριε.
