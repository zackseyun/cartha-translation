id: ACT.26.20
reference: Acts 26:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: sw
  text: Bali kwanza niliwatangazia watu wa Damasko, kisha pia watu wa Yerusalemu na wa eneo lote la Yudea, na watu wa Mataifa[a], kwamba watubu na kumgeukia Mungu, huku wakitenda matendo yanayolingana na toba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mataifa.” Hapa neno hilo linarejelea watu wasio Wayahudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “matendo yanayofaa toba.” Yaani, matendo yanayoandamana kwa kufaa na toba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Bali
  rationale: Inaonyesha utofautishaji na kauli iliyotangulia kwa lugha ya kawaida na yenye hadhi.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: watu wa Damasko
  rationale: Dativu ya wingi pamoja na mahali inarejelea watu waliokuwa Damasko; muundo huu ni wa asili katika Kiswahili.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: kwanza ... kisha pia watu wa Yerusalemu
  rationale: 'Inaonyesha mpangilio na nyongeza: tangazo lilianza Damasko, likafuata Yerusalemu.'
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: eneo lote la Yudea
  rationale: χώρα hapa ni eneo au nchi; “eneo lote” linaonyesha upana wa kijiografia bila kulifanya kuwa mashambani tu.
- source_word: τοῖς ἔθνεσιν
  choice: watu wa Mataifa
  rationale: Katika muktadha huu neno linarejelea watu wasio Wayahudi; “watu wa Mataifa” huhifadhi pia picha ya mataifa mbalimbali.
- source_word: ἀπήγγελλον
  choice: niliwatangazia
  rationale: Kitenzi kina maana ya kutangaza au kutoa habari; kiambishi cha yambwa kinaunganisha kwa kawaida makundi yote yaliyotajwa.
- source_word: μετανοεῖν
  choice: watubu
  rationale: Katika muktadha wa kumwelekea Mungu, μετανοεῖν ni zaidi ya kubadili wazo tu; “kutubu” ni neno la kawaida na sahihi.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: kumgeukia Mungu
  rationale: Huhifadhi wazo la kuelekeza maisha kwa Mungu; “kumrudia” lingeweza kudokeza isivyofaa kwamba kila msikilizaji alikuwa wa agano hapo awali.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: matendo yanayostahili toba
  rationale: 'Huhifadhi uhusiano wa karibu kati ya ἄξια, ἔργα, na μετάνοια: matendo yanayolingana na toba.'
- source_word: πράσσοντας
  choice: huku wakitenda
  rationale: Kishiriki cha wakati uliopo kinaonyesha mwenendo unaoandamana na kutubu na kumgeukia Mungu.
theological_decisions:
- issue: Uhusiano kati ya kutubu, kumgeukia Mungu, na matendo
  choice: Matendo yanaelezwa kuwa yanayostahili toba na yanaandamana nayo.
  alternative: Matendo yanaweza kuchukuliwa kuwa yenyewe ndiyo toba, au kuwa msingi wa kustahili kukubaliwa.
  rationale: Muundo wa Kigiriki unatoa “kutubu” na “kumgeukia Mungu” kama mwitikio uliotangazwa, kisha kishiriki πράσσοντας kinaeleza matendo yanayoandamana na mwitikio huo. Tafsiri haiongezi dai kuhusu sifa ya kustahili wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umerahisishwa kwa kurudia “watu wa” ili orodha ya maeneo na makundi ieleweke wazi, bila kupoteza mpangilio wa chanzo.
