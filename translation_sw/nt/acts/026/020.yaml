- from: Bali kwanza niliwatangazia watu wa Damasko, kisha pia watu wa Yerusalemu na wa eneo lote la Yudea, na watu wa Mataifa[a], kwamba watubu na kumgeukia Mungu, huku wakitenda matendo yanayostahili toba[b].
  to: Bali kwanza niliwatangazia watu wa Damasko, kisha pia watu wa Yerusalemu na wa eneo lote la Yudea, na watu wa Mataifa[a], kwamba watubu na kumgeukia Mungu, huku wakitenda matendo yanayolingana na toba[b].
  rationale: The revision changes only the rendering of ἄξια τῆς μετανοίας ἔργα and its alternative note. “Yanayolingana na toba” naturally communicates actions consistent with repentance, preserving the source’s presentation of works as fitting evidence accompanying repentance rather than as deeds that earn, require, or constitute it.
