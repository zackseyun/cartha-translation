  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: sw
  text: 'Ndipo Agripa akamwambia Paulo, “Umeruhusiwa kujitetea.” Basi Paulo akanyoosha mkono wake, akajitetea:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agripa
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: δὲ
  choice: Ndipo
  rationale: Hutambulisha hatua inayofuata katika simulizi kwa Kiswahili cha kawaida.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: akamwambia Paulo
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa usemi ulioelekezwa kwa mtu.
- source_word: Ἐπιτρέπεταί σοι
  choice: Umeruhusiwa
  rationale: Huhifadhi maana ya ruhusa iliyotolewa na sauti rasmi ya mazingira ya kusikilizwa kwa kesi.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: kujitetea
  rationale: Katika muktadha huu wa kisheria, usemi unamaanisha kusema kwa niaba yako mwenyewe katika utetezi; kitenzi hiki ni cha asili na wazi kwa Kiswahili.
- source_word: τότε
  choice: Basi
  rationale: Huendeleza tukio linalofuata bila kurudia 'ndipo' kwa namna nzito, huku kikihifadhi mfuatano wa simulizi.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: akanyosha mkono wake
  rationale: Huhifadhi kitendo cha kimwili bila kukifasiri zaidi kuwa ishara maalumu ya hotuba.
- source_word: ἀπελογεῖτο
  choice: akaanza kujitetea
  rationale: Wakati usiotimilifu unaonyesha utetezi uliokuwa ukiendelea katika simulizi; hapa Kiswahili hutumia kwa kawaida 'akaanza' kuanzisha hotuba inayofuata, ingawa kitenzi chenyewe pia kinaweza kutafsiriwa 'akajitetea'.
