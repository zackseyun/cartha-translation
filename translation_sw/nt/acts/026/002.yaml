  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: sw
  text: Kuhusu mambo yote ambayo Wayahudi wananishtaki, Mfalme Agripa, najihesabu kuwa mwenye bahati[a] kwa kuwa leo niko karibu kutoa utetezi wangu mbele yako,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, mwenye heri; hapa inaelekea kumaanisha kuwa na bahati nzuri au kuwa na pendeleo la kutoa utetezi mbele ya Agripa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: Kuhusu mambo yote
  rationale: Kirai hiki kinaanzisha mada ya mashtaka na kuhifadhi maana pana ya mambo yote yanayohusika.
- source_word: ἐγκαλοῦμαι
  choice: ninayoshitakiwa
  rationale: Kitenzi hiki kina maana ya kushtakiwa rasmi; umbo la kutendwa linahifadhi kwamba Paulo ndiye anayeshtakiwa.
- source_word: ὑπὸ Ἰουδαίων
  choice: na Wayahudi
  rationale: Katika umbo la kutendwa, “na” huonyesha watendaji wa mashtaka. Katika muktadha huu ni Wayahudi waliomshtaki Paulo, si dai la jumla kuhusu Wayahudi wote.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Mfalme Agripa
  rationale: Huhifadhi cheo na usemi wa moja kwa moja kwa Kiswahili cha kawaida bila kuongeza neno la kizamani la mwito.
- source_word: ἥγημαι ἐμαυτὸν
  choice: ninajiona
  rationale: Hutoa kwa njia ya kawaida maana ya Paulo kujihesabu au kujiona kuwa katika hali fulani.
- source_word: μακάριον
  choice: mwenye bahati
  rationale: Katika mazingira ya kusikilizwa kwa kesi, maana kuu ni kuwa katika hali yenye fursa nzuri au pendeleo, wala si lazima tamko la baraka ya kiroho.
- source_word: ἐπὶ σοῦ
  choice: mbele yako
  rationale: Hufaa kwa mazingira rasmi ya kutoa utetezi mbele ya Agripa bila kumwita waziwazi hakimu.
- source_word: μέλλων
  choice: niko tayari
  rationale: Katika muktadha huu hueleza tendo lililo karibu kufanyika. Kiswahili hiki ni cha kawaida, ingawa pia kinaweza kudokeza utayari wa Paulo.
- source_word: σήμερον
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi hiki cha wakati.
- source_word: ἀπολογεῖσθαι
  choice: kutoa utetezi wangu
  rationale: Huhifadhi maana rasmi ya kisheria ya kusema kwa kujitetea, badala ya maana pana ya kujilinda.
theological_decisions:
- issue: Maana ya μακάριον
  choice: mwenye bahati
  alternative: mwenye heri / aliyebarikiwa
  rationale: Muktadha wa utetezi mbele ya Agripa unaelekeza kwenye hali yenye pendeleo au bahati nzuri. Tanbihi huhifadhi uwezekano wa maana “mwenye heri” bila kuifanya kuwa kauli ya baraka ya kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unafuata kwa kiasi kikubwa msisitizo wa Kigiriki, na koma ya mwisho inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
