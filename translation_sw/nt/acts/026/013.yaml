  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: sw
  text: Katikati ya mchana[a], nikiwa njiani, niliona, ee mfalme, nuru kutoka mbinguni, yenye kung'aa kupita mwangaza wa jua, ikituangazia pande zote, mimi na wale waliokuwa wakisafiri pamoja nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupita mwangaza wa jua.” Kigiriki hukazia kwamba nuru hiyo ilizidi mwangaza wa jua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: Katikati ya mchana
  rationale: Huu ni usemi wa wakati unaomaanisha katikati ya siku; tafsiri hii ni ya kawaida na inaweka wazi wakati uliotajwa.
- source_word: κατὰ τὴν ὁδὸν
  choice: nilipokuwa njiani
  rationale: Kirai hiki kinaonyesha mahali na hali ya safari. Muundo huu wa Kiswahili unaunganisha kwa kawaida mazingira hayo na tendo la kuona bila kuongeza jambo lisilokuwamo.
- source_word: εἶδον
  choice: niliona
  rationale: Ni kitenzi cha kawaida cha kuona katika wakati uliopita, hivyo 'niliona' kinatosha na ni sahihi.
- source_word: βασιλεῦ
  choice: ee mfalme
  rationale: Hii ni hali ya kumwita mfalme moja kwa moja; 'ee mfalme' huhifadhi heshima na uzito wa hotuba bila kuwa ya kizamani kupita kiasi.
- source_word: οὐρανόθεν
  choice: kutoka mbinguni
  rationale: Neno linaonyesha asili ya juu au ya mbinguni. Katika muktadha huu wa ufunuo, 'kutoka mbinguni' huhifadhi maana yake ya simulizi na ya kiteolojia.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: iliyokuwa na mwangaza kuliko jua
  rationale: ὑπέρ pamoja na hali ya kushtaki huonyesha kuzidi, na λαμπρότης ni mwangaza. Kiswahili hiki ni cha kawaida huku kikihifadhi wazo kwamba mwangaza wa nuru hiyo ulizidi wa jua.
- source_word: φῶς
  choice: nuru
  rationale: '''Nuru'' ni nomino ya kawaida na yenye hadhi kwa mwanga unaoonekana wenye asili ya mbinguni katika muktadha huu.'
- source_word: περιλάμψαν
  choice: ikining'inia kunizunguka
  rationale: Kitenzi ambatani kinaonyesha nuru kung'aa pande zote za mtu; muundo huu unakusudia kuhifadhi hali ya kuzungukwa na mwanga.
- source_word: με καὶ τοὺς σὺν ἐμοὶ πορευομένους
  choice: mimi na wale waliokuwa wakisafiri pamoja nami
  rationale: Tafsiri hii huhifadhi wazi kwamba nuru iliwazunguka Paulo na wasafiri wenzake, bila kuwapa utambulisho mwingine usiotajwa.
theological_decisions:
- issue: Maana ya οὐρανόθεν katika muktadha wa maono
  choice: kutoka mbinguni
  alternative: kutoka angani
  rationale: Katika simulizi la tukio la ufunuo na matumizi ya lugha ya mbingu katika Luka–Matendo, 'kutoka mbinguni' huakisi vizuri chanzo kilichotajwa bila kufafanua zaidi asili ya tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa kuwa wa kawaida katika Kiswahili huku anwani ya moja kwa moja kwa mfalme na kulinganishwa kwa mwangaza vikihifadhiwa.
