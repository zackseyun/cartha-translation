  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: sw
  text: Nao, baada ya kuondoka, walikuwa wakizungumza wao kwa wao, wakisema, “Mtu huyu hafanyi jambo lolote linalostahili adhabu ya kifo au kifungo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “adhabu ya kifo au minyororo.” Neno la Kigiriki δεσμῶν kihalisi humaanisha “vifungo/minyororo,” lakini hapa huenda linamaanisha kifungo au kuwekwa kizuizini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: walipoondoka
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha kuwa waliondoka mahali pa mkutano kabla ya mazungumzo; ‘walipoondoka’ ni ya kawaida na haiingizi wazo lisilo wazi la kwenda faraghani.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: wakawa wakizungumza wao kwa wao
  rationale: Kauli ya wakati usiotimilika inaonyesha mazungumzo yaliyoendelea, na ‘wao kwa wao’ huhifadhi maana ya kuheshimiana katika mazungumzo.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutanguliza moja kwa moja yaliyokuwa yakisemwa katika mazungumzo yao.
- source_word: Οὐδὲν ... ἄξιον
  choice: hafanyi jambo lolote linalostahili
  rationale: Huhifadhi dai kwamba hakuna tendo la mtu huyo linalostahili adhabu zilizotajwa, bila kulibadili kuwa hukumu pana zaidi kuhusu kutokuwa na hatia.
- source_word: θανάτου ἢ δεσμῶν
  choice: adhabu ya kifo au kifungo
  rationale: Katika muktadha wa kisheria, ‘kifo’ humaanisha adhabu ya kifo, na δεσμοί, ingawa kihalisi ni minyororo au vifungo, humaanisha hali ya kufungwa au kutiwa kizuizini.
- source_word: τι πράσσει
  choice: hafanyi jambo lolote
  rationale: Muundo wa Kigiriki una ukanushi Οὐδὲν pamoja na τι πράσσει; tafsiri hii ni ya kawaida katika Kiswahili na haibani πράσσει kuwa kutenda uhalifu pekee.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Mtu huyu
  rationale: Humrejelea Paulo waziwazi kwa usemi wa kawaida na wenye heshima.
