  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘wakawa wakizungumza’ umetumiwa kuonyesha hali endelevu ya ἐλάλουν, huku istilahi ya kisheria ‘adhabu ya kifo’ ikiweka wazi maana ya θανάτου katika muktadha.
