  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: sw
  text: Katika masinagogi yote, mara nyingi niliwaadhibu nikijaribu kuwalazimisha wakufuru. Nikiwa nimejawa na ghadhabu kali dhidi yao, niliendelea kuwatesa hata mpaka miji ya nje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi, “hata mpaka miji iliyo nje”; huenda usemi huu unamaanisha miji iliyokuwa nje ya Yudea.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: katika masinagogi yote
  rationale: Muundo huu unaonyesha kwamba tendo hilo lilifanyika katika masinagogi mbalimbali kwa upana, bila kuongeza wazo lisilotajwa wazi.
- source_word: πολλάκις
  choice: mara nyingi
  rationale: Unahifadhi mkazo wa tendo lililorudiwa mara kwa mara.
- source_word: τιμωρῶν
  choice: niliwaadhibu
  rationale: Kitenzi hiki kinaonyesha adhabu aliyowatendea; kimeunganishwa na kishazi kinachofuata ili kudumisha uhusiano wa tendo la wakati mmoja.
- source_word: ἠνάγκαζον
  choice: nikijaribu kuwalazimisha
  rationale: Kauli ya wakati usiotimilika inaonyesha jaribio la kulazimisha lililokuwa likirudiwa, bila kudai kwamba alifanikiwa kila mara.
- source_word: βλασφημεῖν
  choice: wakufuru
  rationale: Hili ndilo neno la kawaida na lenye uzito unaofaa; halitaji kitu cha kufurumiwa kwa kuwa Kigiriki hakikutaji.
- source_word: περισσῶς ἐμμαινόμενος αὐτοῖς
  choice: nikiwa nimejawa na ghadhabu kali dhidi yao
  rationale: Usemi huu unawasilisha uhasama mkali na uliopitiliza bila kutumia lugha inayoweza kueleweka kama utambuzi wa ugonjwa wa akili.
- source_word: ἐδίωκον
  choice: niliendelea kuwatesa
  rationale: Unaonyesha mateso ya kudumu au yaliyorudiwa, kama inavyodokezwa na wakati usiotimilika.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: hata katika miji ya nje
  rationale: Unahifadhi maana ya msingi ya miji iliyokuwa nje au ng'ambo ya eneo husika, bila kuamua moja kwa moja kwamba ilikuwa miji ya nchi za kigeni.
theological_decisions:
- issue: Kitu kinacholengwa na βλασφημεῖν
  choice: wakufuru, bila kutaja walimkufuru nani au nini
  alternative: wamkufuru Yesu; waukufuru ukiri wa Kikristo
  rationale: Muktadha unaweza kuelekeza kwa Yesu au ujumbe wa Kikristo, lakini matini ya Kigiriki haikutaji kitu kinacholengwa; tafsiri inaacha mvutano huo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa kwa usomaji wa kawaida, huku marudio ya matendo, ukali wa ghadhabu, na kutotajwa kwa kitu cha kufurumiwa vikihifadhiwa.
