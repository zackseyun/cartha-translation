  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: sw
  text: Wamenijua tangu mwanzo[a], ikiwa wako tayari kutoa ushahidi, kwamba niliishi kama Mfarisayo, kwa kufuata dhehebu kali zaidi la dini yetu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘tangu hapo kwanza’ au ‘tangu zamani.’
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki αἵρεσις hapa linamaanisha ‘dhehebu’ au ‘kundi,’ si ‘uzushi’ katika maana yake ya kitaalamu ya baadaye.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: Wamenijua
  rationale: Kauli hii inaonyesha kwamba watu hao walikuwa wamemjua Paulo tangu wakati uliopita; wakati timilifu wa Kiswahili unaonyesha maarifa hayo ya awali yenye umuhimu unaoendelea.
- source_word: ἄνωθεν
  choice: tangu mwanzo
  rationale: Katika muktadha huu neno linaonyesha tangu nyakati za awali au tangu mwanzo wa maisha yanayozungumziwa, si ‘kutoka juu.’
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: ikiwa wako tayari kutoa ushahidi
  rationale: θέλωσι inaonyesha utayari, na μαρτυρεῖν ni lugha ya kutoa ushahidi inayofaa katika mazingira haya ya kisheria.
- source_word: κατὰ
  choice: kwa kufuata
  rationale: Hapa neno linaonyesha namna au kanuni ambayo Paulo aliifuata katika mwenendo wake.
- source_word: ἀκριβεστάτην
  choice: kali zaidi
  rationale: Huu ni kiwango cha juu kabisa cha ἀκριβής; katika maelezo ya kundi la kidini, ‘kali zaidi’ huwasilisha ukakamavu wake katika kufuata masharti kwa lugha ya kawaida.
- source_word: αἵρεσιν
  choice: dhehebu
  rationale: Hapa neno linamaanisha kundi linalotambulika ndani ya Uyahudi, si uzushi wa kidini katika maana ya baadaye.
- source_word: τῆς ἡμετέρας θρησκείας
  choice: la dini yetu
  rationale: Kirai hiki kinarejelea dini ya Kiyahudi ambayo Paulo anaitaja kama urithi wa pamoja.
- source_word: ἔζησα Φαρισαῖος
  choice: niliishi kama Farisayo
  rationale: Tafsiri hii inatoa kwa njia ya asili utambulisho na mwenendo wa Paulo katika maisha yake ya awali.
theological_decisions:
- issue: Maana ya αἵρεσις katika mazingira ya kihistoria ya Kiyahudi
  choice: dhehebu
  alternative: uzushi
  rationale: Neno linarejelea Mafarisayo kama kundi ndani ya Uyahudi. ‘Uzushi’ lingeingiza maana hasi ya kiteolojia ya baadaye ambayo haikusudiwi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumika kwa mtindo wa heshima, wa sasa na unaoeleweka kwa urahisi. ‘Kutoa ushahidi’ huhifadhi mazingira ya kisheria, na ‘dhehebu’ huepuka maana ya kimadhehebu au ya kizushi isiyokuwapo katika muktadha wa asili.
