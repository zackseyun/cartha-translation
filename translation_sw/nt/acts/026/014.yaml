  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: sw
  text: Sisi sote tulipoanguka chini, nikasikia sauti ikisema nami kwa lugha ya Kiebrania[a], “Sauli, Sauli, kwa nini unanitesa? Ni vigumu kwako kupiga mateke dhidi ya michokoo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa lugha ya Kiaramu.” Usemi wa Kigiriki unasema kihalisi, “kwa lugha/lahaja ya Kiebrania.”
    reason: alternative_reading
  - marker: b
    text: 'Huu ni usemi wa kimethali: mnyama anayepiga teke dhidi ya kijiti chenye ncha kali hujiumiza zaidi; vivyo hivyo, kumpinga msemaji kunamletea mpinzani madhara.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Nasi sote tulipoanguka chini
  rationale: Kirai huru cha hali ya wakati kimetafsiriwa kwa kishazi cha wakati cha Kiswahili. ‘Sote’ huhifadhi πάντων, na ‘chini’ ni usemi wa kawaida kwa kuanguka ardhini.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: nikasikia sauti ikiniambia
  rationale: ‘Sauti’ inafaa kwa φωνή kwa sababu maneno yanayosemwa yanafuata; ‘ikiniambia’ huonyesha wazi kuwa sauti ilimwelekea Paulo.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: kwa lugha ya Kiebrania
  rationale: Hufuata moja kwa moja usemi wa Kigiriki bila kuamua kimya kimya kuwa ulikuwa Kiaramu; uwezekano huo umewekwa katika tanbihi.
- source_word: Σαοὺλ Σαούλ
  choice: Sauli, Sauli
  rationale: Jina limeandikwa kwa umbo lililozoeleka katika Kiswahili, na marudio yake yamehifadhiwa kwa ajili ya msisitizo.
- source_word: τί με διώκεις;
  choice: kwa nini unanitesa?
  rationale: ‘Unanitesa’ ni usemi wa kawaida na wenye nguvu unaowasilisha maana ya kufuatilia au kushambulia kwa uadui katika muktadha huu.
- source_word: σκληρόν σοι
  choice: Ni vigumu kwako
  rationale: Huhifadhi muundo usio na mtenda dhahiri na maana ya msingi ya σκληρόν bila kuufafanua kupita kiasi kuwa maumivu pekee.
- source_word: πρὸς κέντρα λακτίζειν
  choice: kupiga mateke dhidi ya michokoo
  rationale: ‘Michokoo’ ni vijiti vyenye ncha kali vya kuwasukuma wanyama; wingi wa κέντρα umehifadhiwa, pamoja na picha ya kupiga mateke dhidi yake.
theological_decisions:
- issue: Maana ya τῇ Ἑβραΐδι διαλέκτῳ
  choice: kwa lugha ya Kiebrania
  alternative: kwa lugha ya Kiaramu
  rationale: Matini kuu inafuata jinsi Kigiriki kinavyoitaja lugha hiyo. Kwa kuwa usemi huu katika Matendo unaweza kueleweka kuwa unarejelea Kiaramu, uwezekano huo umehifadhiwa katika tanbihi badala ya kuingizwa katika matini.
- issue: Nguvu ya methali σκληρόν σοι πρὸς κέντρα λακτίζειν
  choice: Ni vigumu kwako kupiga mateke dhidi ya michokoo
  alternative: Ukiendelea kunipinga, utajiumiza mwenyewe
  rationale: Picha halisi ya methali imehifadhiwa katika matini ili kutoibadili kuwa ufafanuzi wa kitheolojia; maana yake ya kimuktadha imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa asili, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Michokoo’ huhifadhi taswira ya kilimo ya methali, huku tanbihi ikiifafanua bila kuipotosha matini kuu.
