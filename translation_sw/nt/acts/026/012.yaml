  text: Katika mambo hayo[a], nilipokuwa nikisafiri kwenda Damaski kwa mamlaka na agizo kutoka kwa makuhani wakuu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “Katika hayo”; kirai hiki kinarejelea matendo na makusudi ya Paulo yaliyotajwa kabla.
