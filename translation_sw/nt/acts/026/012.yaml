lexical_decisions:
- source_word: Ἐν οἷς
  choice: Katika shughuli hizo
  rationale: Kirai hiki kinarejelea matendo na makusudi ya Paulo yaliyotajwa kabla. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha kiunganishi hicho bila kuongeza wazo mahsusi la ‘utume’ lisilotajwa wazi.
- source_word: πορευόμενος
  choice: nilipokuwa nikisafiri
  rationale: Kauli hii inaonyesha tendo lililokuwa likiendelea wakati wa tukio linalofuata; muundo huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: εἰς τὴν Δαμασκὸν
  choice: kwenda Damaski
  rationale: Kihusishi εἰς pamoja na jina la mji kinaonyesha mwelekeo wa safari, unaotafsiriwa kwa kawaida kwa ‘kwenda’.
- source_word: μετ’ ἐξουσίας
  choice: nikiwa na mamlaka
  rationale: ἐξουσία hapa ni haki au uwezo rasmi uliokabidhiwa, si nguvu ya kimwili.
- source_word: ἐπιτροπῆς
  choice: agizo
  rationale: Neno hili linamaanisha jukumu au amri rasmi iliyokabidhiwa. ‘Agizo’ ni la kawaida na linaepuka maana ya kijeshi inayoweza kusikika katika maneno mengine.
- source_word: τῆς τῶν ἀρχιερέων
  choice: kutoka kwa viongozi wa makuhani
  rationale: Umilikishi wa Kigiriki unaeleza chanzo cha mamlaka na agizo; ‘kutoka kwa’ huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: ἀρχιερέων
  choice: viongozi wa makuhani
  rationale: Wingi huu unarejelea tabaka la uongozi wa kikuhani, wala si lazima makuhani wakuu kadhaa waliokuwa na cheo kilekile kwa wakati mmoja.
