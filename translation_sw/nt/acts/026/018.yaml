  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: sw
  text: kufungua macho yao, ili wageuke kutoka gizani waingie nuruni, na watoke katika mamlaka ya Shetani wamwelekee Mungu, ili wapate msamaha wa dhambi na urithi miongoni mwa wale waliotakaswa kwa kuniamini mimi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: kuyafungua macho yao
  rationale: Inahifadhi picha halisi ya kufunguliwa kwa macho, ambayo hapa ina maana pana ya kuanza kuona na kuelewa kiroho.
- source_word: τοῦ ἐπιστρέψαι
  choice: ili wageuke
  rationale: Muundo huu unaonyesha kusudi; ‘wageuke’ huhifadhi lugha ya kubadili mwelekeo bila kuongeza wazo la kimadhehebu.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: kutoka gizani kuingia nuruni
  rationale: Inadumisha taswira ya kutoka upande mmoja na kuingia mwingine kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: katika mamlaka ya Shetani
  rationale: ἐξουσία inaweza kumaanisha mamlaka, nguvu ya kutawala, au himaya; ‘mamlaka’ ndiyo tafsiri ya moja kwa moja zaidi hapa.
- source_word: ἐπὶ τὸν θεόν
  choice: kumwelekea Mungu
  rationale: ‘Kumwelekea’ huonyesha mabadiliko ya mwelekeo na utii yanayoambatana na kitenzi ‘wageuke.’
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: msamaha wa dhambi
  rationale: Ni usemi wa wazi na wa kawaida unaowasilisha maana ya kuondolewa kwa hatia ya dhambi.
- source_word: κλῆρον
  choice: urithi
  rationale: Katika muktadha huu neno linamaanisha fungu walilopewa watu wa Mungu; ‘urithi’ huonyesha vizuri maana ya agano na tumaini la wakati ujao.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: miongoni mwa wale waliotakaswa
  rationale: Inahifadhi hali inayotokana na tendo lililokamilishwa, kama inavyoonyeshwa na kauli tendwa timilifu ya Kigiriki.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: kwa kuniamini mimi
  rationale: Hii ni namna ya kawaida na iliyo wazi ya Kiswahili ya kueleza imani iliyoelekezwa kwa Yesu, bila kudokeza muundo wa Kigiriki usio wa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya πίστει τῇ εἰς ἐμέ
  choice: kwa kuniamini mimi
  alternative: kwa imani kwangu mimi
  rationale: Muundo wa Kigiriki unaonyesha wazi kwamba Yesu ndiye anayelengwa na imani. Tafsiri iliyochaguliwa ni ya asili zaidi katika Kiswahili na haibadili imani kuwa fundisho maalumu la kimadhehebu.
- issue: Hali ya τοῖς ἡγιασμένοις
  choice: wale waliotakaswa
  alternative: watakatifu
  rationale: Kauli iliyochaguliwa huhifadhi nguvu ya kitenzi na hali inayoendelea baada ya tendo la kutakaswa, bila kuamua zaidi kuhusu namna au wakati wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Taswira za macho, giza na nuru zimehifadhiwa; sentensi imeunganishwa kwa ‘ili’ ili kuonyesha mfululizo wa makusudi katika Kigiriki.
