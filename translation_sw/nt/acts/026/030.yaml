  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: sw
  text: Kisha mfalme, gavana, Bernike[a], na wale waliokuwa wameketi pamoja nao wakasimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bernike: pia huandikwa “Berenike.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: akasimama
  rationale: Kitenzi hiki hapa kinaeleza kuinuka kutoka kwenye kiti; “akasimama” ni cha kawaida, chenye heshima, na kinafaa katika mazingira haya rasmi.
- source_word: τε
  choice: Kisha / pamoja na
  rationale: Chembe hizi zinaunganisha tendo na simulizi lililotangulia na pia washiriki katika orodha. Kiswahili cha asili kinawakilisha mwendelezo kwa “Kisha” na uhusiano wa orodha kwa “pamoja na” badala ya kuiga kila chembe moja kwa moja.
- source_word: ὁ βασιλεὺς
  choice: mfalme
  rationale: Neno hili ni cheo cha kifalme; tafsiri imehifadhi cheo badala ya kuongeza jina Agripa ambalo halipo katika mstari.
- source_word: ὁ ἡγεμὼν
  choice: gavana
  rationale: Katika muktadha wa Matendo, ἡγεμών humaanisha mtawala wa jimbo chini ya Roma; “gavana” ni neno sahihi na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: Βερνίκη
  choice: Bernike
  rationale: “Bernike” linafuata umbo la jina la Kigiriki kwa karibu na ni tahajia inayofaa katika Kiswahili; tahajia mbadala “Berenike” imewekwa katika tanbihi.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: wale waliokuwa wameketi pamoja nao
  rationale: Kauli hii huhifadhi picha ya watu walioketi pamoja nao bila kuwatafsiri zaidi kama wageni au maafisa.
- source_word: καὶ
  choice: na
  rationale: “Na” huhifadhi muundo wa kuongeza watu na kundi katika orodha, huku “pamoja na” ikitumika mahali panapohitajika kwa mtiririko wa asili wa Kiswahili.
