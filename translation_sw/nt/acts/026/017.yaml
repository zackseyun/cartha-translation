  text: nikikuokoa kutoka kwa watu na kutoka kwa watu wa mataifa, ambao ninakutuma kwao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: nikikuokoa
  rationale: Kauli ya wakati uliopo ya ἐξαιρέω inaonyesha tendo la Yesu la kumwokoa Paulo; “nikikuokoa” ni ya asili katika Kiswahili na huhifadhi maana ya kuokoa kutoka hatarini.
- source_word: τοῦ λαοῦ
  choice: watu hawa
  rationale: Katika muktadha huu λαός inarejelea watu wa Israeli, kwa kulinganishwa na watu wa mataifa. “Watu hawa” huhifadhi usemi usiotaja wazi “Wayahudi” na pia hufanya rejeo liwe la kawaida katika Kiswahili.
- source_word: τῶν ἐθνῶν
  choice: watu wa mataifa
  rationale: Katika utofautishaji huu wa Kiyahudi, ἔθνη inamaanisha watu wasio Wayahudi. “Watu wa mataifa” ni usemi wa kawaida wa kibiblia unaohifadhi pia taswira ya mataifa.
- source_word: εἰς οὓς
  choice: ambao ... kwao
  rationale: Baada ya kitenzi cha kutuma, εἰς οὓς humaanisha “kwao”; muundo huu ni wa asili katika Kiswahili na kiwakilishi “ambao” kinarejelea watu.
- source_word: ἀποστέλλω
  choice: ninakutuma
  rationale: Wakati uliopo unaonyesha agizo la papo hapo la Yesu kwa Paulo; “ninakutuma” huhifadhi hali hiyo ya sasa.
theological_decisions:
- issue: Rejeo la “watu” katika utofautishaji na watu wa mataifa
  choice: “watu hawa” katika matini kuu, likieleweka kumaanisha watu wa Israeli
  alternative: “Wayahudi” au “watu wa Israeli”
  rationale: Muktadha unaonyesha wazi utofautishaji kati ya Wayahudi na wasio Wayahudi, lakini Kigiriki kinasema tu “watu.” Matini kuu haiongezi jina la kikabila; tanbihi inaweka wazi tafsiri inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo unaendelea moja kwa moja kutoka sentensi iliyotangulia, kama ilivyo katika Kigiriki.
