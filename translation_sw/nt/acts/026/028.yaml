  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: sw
  text: Ndipo Agripa akamwambia Paulo[a], “Kwa muda mfupi unanishawishi niwe Mkristo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Karibu unanishawishi niwe Mkristo,” au huenda, “Je, unadhani kwa muda mfupi namna hii unaweza kunifanya Mkristo?” Kauli ya Kigiriki inaweza kurejelea muda mfupi au kiwango kidogo, na sauti ya Agripa huenda ilikuwa ya dhati au ya kejeli.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: Ndipo Agripa
  rationale: δέ ni kiunganishi chepesi cha kuendeleza simulizi; “ndipo” linaendeleza mazungumzo kwa Kiswahili cha kawaida bila kusisitiza upinzani usio wazi.
- source_word: πρὸς τὸν Παῦλον
  choice: akamwambia Paulo
  rationale: πρός katika mtindo huu wa kutambulisha msemaji inaeleza anayeelekezewa maneno; kitenzi cha kusema kilichodokezwa kinawekwa wazi kwa Kiswahili asilia.
- source_word: Ἐν ὀλίγῳ
  choice: Kwa muda mfupi
  rationale: Kauli hii inaweza kumaanisha muda au kiwango kidogo. Tafsiri ya muda inafuata maana ya moja kwa moja huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: με πείθεις
  choice: unanishawishi
  rationale: Wakati uliopo wa πείθεις unaonyesha ushawishi unaoendelea katika mazungumzo haya; “unanishawishi” ni ya kawaida na haiongezi dhana ya kujaribu ambayo haijasemwa wazi.
- source_word: Χριστιανὸν
  choice: Mkristo
  rationale: Nomino hii inaonyesha utambulisho au hali inayotokana na tendo; “Mkristo” ndiyo tafsiri sanifu ya Kiswahili.
- source_word: ποιῆσαι
  choice: niwe
  rationale: Katika muundo huu, ποιῆσαι inaeleza kumfanya mtu awe kitu fulani. “Niwe Mkristo” ni Kiswahili asilia kinachohifadhi maana hiyo ya matokeo.
theological_decisions:
- issue: Toni na nguvu ya jibu la Agripa
  choice: 'Kauli ya moja kwa moja: “Kwa muda mfupi unanishawishi niwe Mkristo.”'
  alternative: Inaweza kuwa kauli ya kejeli au swali la kupinga, “Je, unadhani kwa muda mfupi namna hii unaweza kunifanya Mkristo?”; au “Karibu unishawishi niwe Mkristo.”
  rationale: Kigiriki hakionyeshi kwa uhakika kama Agripa alikuwa mnyofu, mwenye kukwepa, au mwenye kejeli. Matini kuu inahifadhi maana ya juu ya kauli hiyo, na tanbihi inatunza uwezekano mwingine bila kutatua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa mazungumzo ya kawaida lakini unaofaa kwa usomaji wa Maandiko; utata halisi wa Ἐν ὀλίγῳ na toni ya Agripa umehifadhiwa kwa tanbihi.
