lexical_decisions:
- source_word: Ὅθεν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na simulizi la awali la Paulo kuhusu kukutana na Yesu na kupewa utume.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Mfalme Agripa
  rationale: Ni namna ya kawaida na yenye heshima ya kumwita Agripa moja kwa moja katika Kiswahili cha sasa.
- source_word: οὐκ ἐγενόμην ἀπειθὴς
  choice: sikuukataa kwa kutotii
  rationale: Muundo huu unaonyesha kwamba Paulo hakukataa kuitikia kile alichoagizwa katika maono; pia ni wa asili zaidi kuliko tafsiri ya neno kwa neno kama ‘sikuwa mkaidi kwa’.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: maono ya mbinguni
  rationale: ‘Maono’ huwakilisha ὀπτασία kama tukio la kuona lisilo la kawaida, na ‘ya mbinguni’ huhifadhi uwezekano wa kueleza asili yake au sifa yake.
theological_decisions:
- issue: Asili ya tukio la Paulo katika njia ya kwenda Damasko
  choice: maono
  alternative: tukio la kuonekana kutoka mbinguni
  rationale: ὀπτασία hutaja maono au tukio la kuonekana. ‘Maono’ huhifadhi aina ya tukio inayotajwa na maandiko bila kuingiza ufafanuzi wa kitheolojia ulioendelezwa zaidi.
- issue: Uhusiano wa ‘ya mbinguni’ na ‘maono’
  choice: maono ya mbinguni
  alternative: maono kutoka mbinguni
  rationale: Kivumishi οὐρανίῳ kinaweza kueleza sifa ya maono au asili yake; maandishi makuu yanahifadhi ubayana huo, na tanbihi inatoa maana ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sikuukataa kwa kutotii’ huepuka usemi usio wa kawaida ‘sikuwa mtiifu kwa maono’ huku ikihifadhi maana ya kutokataa agizo la kimungu.
