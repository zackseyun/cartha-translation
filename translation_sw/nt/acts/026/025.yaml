  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: sw
  text: Lakini Paulo akasema, “Mimi si mwendawazimu,[a] Mheshimiwa Festo,[b] bali ninanena maneno ya kweli na ya busara.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sina wazimu.”
    reason: lexical_alternative
  - marker: b
    text: “Mheshimiwa” ni cheo rasmi cha heshima kilichotumiwa kumwambia afisa wa cheo cha juu.
    reason: cultural_note
  - marker: c
    text: Au “maneno ya kweli na ya kiasi,” au “maneno ya kweli na ya utimamu wa akili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti kati ya shtaka la Festo katika mstari uliotangulia na jibu la Paulo.
- source_word: μαίνομαι
  choice: Sina wazimu
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaomaanisha kutokuwa mwendawazimu au kupoteza akili.
- source_word: φησίν
  choice: akasema
  rationale: Ingawa Kigiriki kina wakati wa sasa wa kihistoria, wakati uliopita unafaa katika masimulizi ya kawaida ya Kiswahili.
- source_word: κράτιστε
  choice: Mheshimiwa
  rationale: Ni namna ya heshima inayofaa kwa afisa wa cheo cha juu; inasikika ya kawaida na yenye staha katika Kiswahili cha sasa.
- source_word: ἀληθείας
  choice: ya kweli
  rationale: Inawasilisha sifa ya maneno kuwa ya ukweli kwa Kiswahili cha kawaida bila kupoteza muundo wa msingi.
- source_word: σωφροσύνης
  choice: ya akili timamu
  rationale: Katika muktadha wa shtaka la wazimu, inaonyesha utimamu wa akili na usemi wenye kiasi, huku ikihifadhi maana pana ya neno la Kigiriki.
- source_word: ῥήματα
  choice: maneno
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi.
- source_word: ἀποφθέγγομαι
  choice: ninanena
  rationale: Inaonyesha kusema kwa wazi au kwa makusudi, kwa mtindo wenye hadhi unaofaa mazingira ya utetezi rasmi.
theological_decisions:
- issue: Upeo wa maana ya σωφροσύνης
  choice: akili timamu
  alternative: busara; kiasi; kujitawala
  rationale: Neno linaweza kuhusisha utimamu wa akili, kiasi, na kujitawala. Muktadha wa shtaka la Paulo kuwa na wazimu unaipa uzito maana ya utimamu wa akili, lakini tanbihi inahifadhi uwezekano mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mheshimiwa” ni heshima ya kawaida kwa afisa mkuu, na “ninanena” inadumisha uzito wa mazingira rasmi bila kuwa ya kizamani kupita kiasi.
