  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: sw
  text: Ndipo Agripa akamwambia Festo, “Mtu huyu angeweza kuachiliwa huru kama hangekuwa amekata rufaa kwa Kaisari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ndipo
  rationale: Katika muktadha huu, δέ inaendeleza simulizi na kuanzisha kauli ya mwisho ya Agripa; “Ndipo” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ἔφη
  choice: akamwambia
  rationale: Ingawa ἔφη ni kitenzi cha wakati usiotimilifu, hapa kinatumika kama utangulizi wa kawaida wa usemi. “Akamwambia” linaonyesha kwa njia ya asili kwamba Agripa alimwelekezea Festo maneno hayo.
- source_word: Ἀπολελύσθαι
  choice: kuachiliwa huru
  rationale: Kitenzi ἀπολύω katika muktadha huu wa kisheria kina maana ya kuachiliwa au kuwekwa huru, bila kulazimisha maana nyembamba ya kutangazwa kutokuwa na hatia.
- source_word: ἐδύνατο
  choice: angeweza
  rationale: “Angeweza” linaeleza uwezekano wa wakati uliopita ambao haukutimia, hasa likiunganishwa na sharti lisilotimia linalofuata.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Mtu huyu
  rationale: Tafsiri hii inahifadhi nomino na nguvu ya kiashiria οὗτος kwa Kiswahili cha kawaida.
- source_word: εἰ μὴ
  choice: kama ... hangekuwa
  rationale: 'Muundo huu unaonyesha wazi sharti lisilotimia: kuachiliwa kungewezekana kama rufaa isingekuwa imekatwa.'
- source_word: ἐπεκέκλητο
  choice: amekata rufaa
  rationale: Katika sheria ya Roma, ἐπικαλέω ikitumiwa kuhusu Kaisari humaanisha kuomba kesi iamuliwe na mamlaka ya mfalme; “kukata rufaa” ndilo neno sahihi la kisheria na linaloeleweka.
- source_word: Καίσαρα
  choice: Kaisari
  rationale: “Kaisari” linahifadhi jina-cheo la kihistoria na la kisheria la Καῖσαρ badala ya kulifafanua kwa neno la jumla “mfalme.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida wa simulizi; maana ya kisheria imehifadhiwa bila kuifanya ἀπολύω kuwa hukumu rasmi ya kutokuwa na hatia.
