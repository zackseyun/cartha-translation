  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: sw
  text: hasa kwa kuwa wewe unajua vizuri desturi zote na masuala yanayobishaniwa miongoni mwa Wayahudi.[a] Kwa hiyo, ninakusihi[b] unisikilize kwa subira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “desturi zote za Kiyahudi na masuala yanayobishaniwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ninakuomba”; kitenzi cha Kigiriki kinaonyesha ombi la dhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: hasa kwa kuwa
  rationale: Katika muktadha huu neno hili linakazia sababu ya Paulo kufurahi kujitetea mbele ya Agripa; “hasa kwa kuwa” huunganisha kishazi hiki kwa kawaida na mstari uliotangulia.
- source_word: γνώστην ὄντα σε
  choice: wewe unajua vizuri
  rationale: Huwasilisha kwamba Agripa alikuwa na ufahamu wa mambo hayo bila kudai kwa lazima kwamba alikuwa mtaalamu rasmi.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: desturi zote ... miongoni mwa Wayahudi
  rationale: Huhifadhi wazo la desturi zinazohusu au zinazopatikana miongoni mwa Wayahudi, huku tanbihi ikionyesha tafsiri nyingine ya muundo huo.
- source_word: ζητημάτων
  choice: masuala yanayobishaniwa
  rationale: Neno la Kigiriki linaweza kumaanisha maswali au masuala ya mjadala; katika mazingira haya ya kisheria, usemi huu unaonyesha kuwa yalikuwa na ubishi bila kuyafanya kuwa ugomvi tu.
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na ufahamu wa Agripa.
- source_word: δέομαι
  choice: ninakusihi
  rationale: Huwasilisha ombi la dhati lenye nguvu zaidi kuliko “ninaomba,” bila kutumia lugha ya kizamani.
- source_word: μακροθύμως
  choice: kwa uvumilivu
  rationale: Ni usemi wa kawaida na wenye heshima unaoomba apewe nafasi ya kusikilizwa kwa subira.
- source_word: ἀκοῦσαί μου
  choice: unisikilize
  rationale: Hutoa maana ya kumsikiliza mtu kwa makini bila kuongeza wazi wazo la ‘mpaka amalize,’ ambalo halijasemwa moja kwa moja.
