  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: sw
  text: Basi, mimi mwenyewe nilidhani kwamba ilinipasa kufanya mambo mengi dhidi ya jina la Yesu Mnazareti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya jina la Yesu wa Nazareti.”
    reason: Njia nyingine ya kutafsiri Ναζωραῖος kama rejeleo la mahali alikotoka Yesu badala ya jina la utambulisho “Mnazareti.”
lexical_decisions:
- source_word: Ἐγὼ
  choice: mimi mwenyewe
  rationale: Kiwakilishi cha wazi kina mkazo katika Kigiriki; “mimi mwenyewe” kinahifadhi msisitizo wa Paulo juu ya msimamo wake binafsi wa zamani.
- source_word: μὲν οὖν
  choice: Basi
  rationale: “Basi” linaonyesha mwendelezo na hitimisho hafifu la οὖν kwa Kiswahili cha kawaida; maana ya mkazo wa μέν inabebwa kwa kiasi na “mimi mwenyewe” bila kufanya sentensi kuwa nzito.
- source_word: ἔδοξα ἐμαυτῷ
  choice: nilidhani
  rationale: Kifungu hiki ni nahau yenye maana ya kutoa hukumu au kuwa na maoni moyoni; “nilidhani” ni cha asili na kinaeleweka, huku hali ya kujirejelea ikihifadhiwa katika “mimi mwenyewe.”
- source_word: πρὸς τὸ ὄνομα
  choice: dhidi ya jina
  rationale: Katika muundo huu πρός ina maana ya upinzani. “Dhidi ya jina” huhifadhi nahau ya kibiblia ya “jina” badala ya kuifasiri kwa kubana kuwa mamlaka, sifa, au harakati.
- source_word: ὄνομα
  choice: jina
  rationale: Tafsiri ya moja kwa moja huhifadhi upana wa nahau inayoweza kumwakilisha Yesu mwenyewe, sifa yake, na mamlaka yake bila kuchagua maana moja tu.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Yesu Mnazareti
  rationale: “Mnazareti” ni jina la utambulisho linalohusishwa na asili ya Yesu na linadumisha ladha ya cheo katika Ναζωραῖος.
- source_word: δεῖν
  choice: ilinipasa
  rationale: Neno hili linaonyesha wajibu au ulazima ambao Paulo aliuona katika fikra zake za wakati huo; “ilinipasa” huonyesha wajibu huo bila kudokeza kwamba Mungu ndiye aliyemwamuru.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: kufanya mambo mengi dhidi ya
  rationale: Muundo huu huhifadhi wingi wa matendo (πολλά) na maana yake ya uhasama au upinzani (ἐναντία) kwa Kiswahili cha sasa na cha wazi.
theological_decisions:
- issue: Maana ya “jina” kuhusiana na Yesu
  choice: Kuhifadhi nahau ya kibiblia “jina”
  alternative: mamlaka ya Yesu; harakati ya Yesu
  rationale: Matini yenyewe haibani maana kuwa mamlaka au harakati pekee. “Jina” huhifadhi uwezekano wa kumaanisha mtu, sifa, na mamlaka ya Yesu bila kutatua kimya kimya mvutano huo wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “ilinipasa” unaweka wazi kuwa huu ulikuwa mtazamo wa Paulo mwenyewe wa zamani, na nahau “jina” imehifadhiwa kwa sababu ya uzito wake wa kibiblia.
