source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: sw
  text: Lakini Paulo akasema, “Ningemwomba Mungu kwamba, iwe kwa muda mfupi au kwa muda mrefu[a], si wewe tu bali pia wote wanaonisikia leo wawe kama nilivyo mimi—isipo kuwa minyororo hii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iwe karibu au kabisa”; usemi wa Kigiriki ni mgumu na huenda unarejelea kiwango, juhudi, au muda.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: Ningemwomba Mungu
  rationale: Kauli ya uwezekano yenye ἄν inaeleza tamanio la sala; dative τῷ θεῷ humtaja Mungu kama anayeelekezewa ombi. Kiswahili hiki ni cha asili na hudumisha maana ya sala badala ya tamanio dhaifu tu.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: iwe kwa muda mfupi au kwa muda mrefu
  rationale: Jozi hii ni ngumu na inaweza kueleza muda, kiwango, au juhudi. Tafsiri ya muda inafaa katika mazungumzo na Agripa huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: si wewe tu bali pia wote wanaonisikia leo
  rationale: Hudumisha mkazo wa muundo ‘si...tu bali pia’ na maana ya kitenzi cha wakati uliopo kuhusu wale wanaomsikiliza Paulo siku hiyo.
- source_word: γενέσθαι
  choice: wawe
  rationale: Katika Kiswahili, ‘wawe kama nilivyo mimi’ hueleza kwa kawaida hali inayotamaniwa ambayo wasikilizaji wafikie, bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: wawe kama nilivyo mimi
  rationale: Kauli hii ya asili na yenye heshima huhifadhi kujirejelea kwa Paulo na ulinganisho wa hali yake.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: isipokuwa minyororo hii
  rationale: παρεκτός huonyesha jambo linalotengwa; ‘minyororo’ ni neno halisi na wazi linalofaa muktadha wa kifungo cha Paulo.
theological_decisions:
- issue: Maana ya ἐν ὀλίγῳ καὶ ἐν μεγάλῳ kuhusiana na kauli iliyotangulia ya Agripa
  choice: iwe kwa muda mfupi au kwa muda mrefu
  alternative: iwe karibu au kabisa; au kwa juhudi kidogo au nyingi
  rationale: Kifungu hiki kina utata wa kweli na kinaweza kuhusiana na muda, kiwango, au juhudi. Matini kuu inatumia maana inayowezekana katika muktadha, huku tanbihi ikihifadhi maana nyingine badala ya kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa Paulo umehifadhiwa bila kuingiza msimamo wa kimadhehebu.
