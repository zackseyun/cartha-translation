  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: sw
  text: Kwa nini ninyi mnaona kuwa haiaminiki kwamba Mungu huwafufua wafu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: Kwa nini
  rationale: 'Katika swali hili, τί ina nguvu ya kuuliza sababu: ‘kwa nini?’'
- source_word: ἄπιστον
  choice: haiaminiki
  rationale: Huwasilisha maana ya jambo lisiloweza kuaminiwa bila kuongeza wazo la kutowezekana.
- source_word: κρίνεται παρ’ ὑμῖν
  choice: ninyi mnaona kuwa
  rationale: Kirai hiki humaanisha kuhukumu au kutathmini jambo kuwa fulani; Kiswahili hiki ni cha kawaida na huhifadhi ‘by you’ kwa kumtaja wazi mhusika ‘ninyi’.
- source_word: εἰ
  choice: kwamba
  rationale: Katika swali hili εἰ hutambulisha yaliyomo katika jambo linalodhaniwa kuwa haliaminiki, hivyo ‘kwamba’ ni ya asili zaidi kuliko ‘ikiwa’.
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: Mungu huwafufua wafu
  rationale: Kitenzi cha wakati uliopo kinaweza kueleza uwezo au tendo la Mungu kwa ujumla; ‘huwafufua’ ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Je, wakati uliopo ἐγείρει urejelee ufufuo mmoja maalumu au uwezo/tendo la Mungu kwa ujumla?
  choice: Mungu huwafufua wafu
  alternative: Mungu anawafufua wafu
  rationale: ‘Huwafufua’ huhifadhi kauli ya jumla bila kuifunga aya kwa tukio moja pekee, huku ikiendelea kudai tendo halisi la Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa kawaida kwa msomaji wa leo huku mkazo wa παρ’ ὑμῖν ukihifadhiwa kwa ‘ninyi’.
