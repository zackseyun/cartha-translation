  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa nimepata msaada unaotoka kwa Mungu, nimesimama mpaka leo, nikitoa ushahidi kwa watu wadogo na wakubwa,[a] bila kusema jambo lolote zaidi ya yale ambayo manabii na Musa walisema yangetokea.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Watu wadogo na wakubwa” maana yake ni watu wa kila cheo au hadhi katika jamii.
    reason: cultural_note
  - marker: b
    text: Au, “bila kusema jambo lolote isipokuwa yale ambayo manabii na Musa walisema yangetokea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τυχὼν τῆς ἀπὸ τοῦ θεοῦ
  choice: kwa kuwa nimepata msaada unaotoka kwa Mungu
  rationale: Kirai hiki huonyesha kwamba Paulo alipokea msaada ambao chanzo chake ni Mungu. “Nimepata msaada” ni Kiswahili cha kawaida na huhifadhi uhusiano wa kishirikishi na kauli kuu.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: nimesimama mpaka leo
  rationale: Kauli ya hali timilifu inaonyesha hali ya sasa inayotokana na kitendo kilichotangulia; “nimesimama mpaka leo” huhifadhi picha ya kusimama pamoja na mwendelezo wake.
- source_word: μαρτυρόμενος
  choice: nikiwashuhudia
  rationale: Huhifadhi maana ya kutoa ushahidi au ushuhuda na kuonyesha shughuli inayoendelea sambamba na kusimama kwa Paulo.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: wadogo kwa wakubwa
  rationale: Huhifadhi taswira ya nahau ya Kigiriki huku ikieleweka kwa Kiswahili kuwa inahusu watu wa kila cheo au hadhi.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: bila kusema jambo lolote zaidi ya
  rationale: “Zaidi ya” huhifadhi uwezekano wa maana ya kutovuka mipaka ya yale yaliyosemwa, badala ya kuifanya tu kuwa orodha finyu ya mambo yanayoruhusiwa.
- source_word: ὧν τε οἱ προφῆται ἐλάλησαν ... καὶ Μωϋσῆς
  choice: yale ambayo manabii na Musa walisema
  rationale: Hufuata mpangilio wa Kigiriki, unaowataja manabii kabla ya Musa, na huwasilisha kwa uwazi maudhui ya unabii.
- source_word: μελλόντων γίνεσθαι
  choice: yangetokea
  rationale: Huonyesha wakati ujao kwa mtazamo wa wakati ambapo manabii na Musa walinena, bila kulazimisha wazo la utimizo wa mara moja.
theological_decisions:
- issue: Mwendelezo wa ushuhuda wa Paulo na Maandiko ya Israeli
  choice: Paulo anasema kwamba hashuhudii jambo linalovuka yale yaliyosemwa na manabii na Musa.
  alternative: Paulo anadai tu kwamba ujumbe wake unapatana kwa ujumla na Maandiko bila kudai mipaka thabiti ya yaliyotabiriwa.
  rationale: οὐδὲν ἐκτὸς ina nguvu ya kusema ‘hakuna jambo zaidi ya/nje ya.’ Tafsiri inahifadhi dai hilo la mwendelezo bila kuamua hapa kiwango cha undani wa kila utabiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi mtiririko wa hoja ya Kigiriki, huku tanbihi zikifafanua nahau na maana mbadala halisi.
