  to: Kwa hiyo, kwa kuwa nimepata msaada unaotoka kwa Mungu, nimesimama mpaka leo, nikitoa ushahidi kwa watu wadogo na wakubwa,[a] bila kusema jambo lolote zaidi ya yale ambayo manabii na Musa walisema yangetokea.[b]
