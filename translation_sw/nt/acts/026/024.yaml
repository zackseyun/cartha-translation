  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: sw
  text: Alipokuwa akisema hayo katika kujitetea, Festo alisema kwa sauti kubwa, “Paulo, umerukwa na akili! Elimu yako nyingi inakufanya uwe mwendawazimu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: Alipokuwa akisema hayo katika kujitetea
  rationale: Kauli hii ya Kigiriki inaonyesha tendo lililokuwa likiendelea wakati uleule na inadumisha maana ya kutoa utetezi mbele ya mamlaka.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: kwa sauti kubwa
  rationale: Ni usemi wa namna ya kusema, na tafsiri hii ni ya kawaida na yenye uwazi katika Kiswahili.
- source_word: φησιν
  choice: alisema
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita unasomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: Μαίνῃ
  choice: umerukwa na akili
  rationale: Usemi huu wa sasa unaonyesha madai kwamba Paulo hana akili timamu bila kutumia lugha ya kizamani.
- source_word: τὰ πολλά ... γράμματα
  choice: Elimu yako nyingi
  rationale: γράμματα hapa inaelekea kumaanisha elimu au maarifa yaliyopatikana kwa kusoma, si maandishi mengi halisi.
- source_word: εἰς μανίαν περιτρέπει
  choice: inakufanya uwe mwendawazimu
  rationale: Tafsiri hii inaonyesha kisababishi na matokeo ya kuingizwa katika hali ya wazimu, kwa Kiswahili cha kawaida.
theological_decisions: []
