  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mshtuko na ukali wa Festo vimehifadhiwa kwa alama ya mshangao na usemi wa moja kwa moja.
