base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: sw
  text: kwamba Masihi[a] angeteseka, na kwamba, akiwa wa kwanza kufufuka kutoka kwa wafu[d], angetangaza nuru kwa watu[b] na kwa Mataifa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Hapa neno la Kigiriki Χριστός ni cheo cha Masihi katika muktadha wa unabii.
    reason: alternative_reading
  - marker: b
    text: Hapa “watu” huenda ni watu wa Israeli, wakitofautishwa na Mataifa.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mataifa”; katika muktadha huu usemi huo unamaanisha watu wasio Wayahudi.
    reason: lexical_alternative
  - marker: d
    text: Au, “akiwa wa kwanza kutoka katika ufufuo wa wafu.” Kigiriki kina usemi mfupi wenye muundo uliobanwa.
    reason: source_ambiguity
lexical_decisions:
- source_word: παθητὸς
  choice: angeteseka
  rationale: Kivumishi hiki kinaonyesha kwamba Masihi angepitia mateso au alikuwa amekusudiwa kuteseka. Muundo wa kitenzi ni wa kawaida zaidi katika Kiswahili na unafaa katika muhtasari huu wa unabii.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha mteuliwa wa Mungu katika muktadha wa unabii, kwa hiyo “Masihi” linaonyesha wazi matumizi yake kama cheo.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: akiwa wa kwanza kufufuka kutoka kwa wafu
  rationale: Tafsiri hii inahifadhi dai la kutangulia katika ufufuo bila kuongeza ufafanuzi wa kiteolojia kuhusu watu waliowahi kurudishwa kwenye uhai.
- source_word: φῶς
  choice: nuru
  rationale: “Nuru” huhifadhi sitiari pana ya kibiblia inayoweza kujumuisha ufunuo, wokovu na tumaini.
- source_word: μέλλει καταγγέλλειν
  choice: angeitangaza
  rationale: Katika muhtasari huu wa maneno ya kinabii, hali ya masharti “ange-” huwasilisha kwa kawaida jambo lililotazamiwa au kukusudiwa, bila kudokeza kwamba lilikuwa karibu kutokea mara moja.
- source_word: τῷ τε λαῷ
  choice: kwa watu
  rationale: Neno la Kigiriki lina maana ya “watu” na katika mlingano huu huenda linawarejelea Wayahudi. Maandishi makuu yanahifadhi usemi wa chanzo, huku tanbihi ikifafanua rejeo linalowezekana.
- source_word: τοῖς ἔθνεσιν
  choice: kwa watu wa Mataifa
  rationale: Katika utofautishaji huu, ἔθνη linawarejelea wasio Wayahudi; “watu wa Mataifa” ni usemi wa kawaida na unaoeleweka katika Kiswahili cha kibiblia.
- source_word: τε ... καὶ
  choice: kwa ... na kwa ...
  rationale: Muundo huu unaonyesha wazi makundi mawili ya wapokeaji kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya Masihi kuwa wa kwanza katika ufufuo
  choice: akiwa wa kwanza kufufuka kutoka kwa wafu
  alternative: akiwa wa kwanza kupitia ufufuo wa wafu
  rationale: Kigiriki kinadai kutangulia kwa Masihi lakini hakielezi kwa kina jinsi dai hilo linavyohusiana na kurudishwa kwa watu wengine kwenye uhai. Tafsiri haiongezi maelezo hayo ya kimafundisho.
- issue: Rejeo la “watu”
  choice: kwa watu
  alternative: kwa watu wa Israeli
  rationale: λαός limeachwa kwa upana wake wa kimsamiati; mlingano na “watu wa Mataifa” unaashiria kwamba hapa huenda ni watu wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Angeitangaza” linaendana na mtazamo wa hotuba ya Paulo kuhusu yale yaliyotabiriwa. Herufi kubwa katika “Mataifa” inasaidia kuonyesha matumizi yake kama kundi la watu wasio Wayahudi, si mataifa ya kisiasa tu.
