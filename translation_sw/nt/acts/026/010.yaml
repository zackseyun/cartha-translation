source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: sw
  text: 'Ndivyo nilivyofanya huko Yerusalemu: si tu kwamba niliwafungia gerezani wengi wa watakatifu[a], nikiwa nimepokea mamlaka kutoka kwa makuhani wakuu, bali pia, walipokuwa wakiuawa, nilitoa kura yangu dhidi yao[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Watakatifu” hapa ni watu wa Mungu, yaani, waumini wa Yesu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hutumia neno ψῆφος, “kura” (awali jiwe la kupigia kura). Usemi huu unaweza kumaanisha kupiga kura rasmi dhidi yao au kutoa idhini yake dhidi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: Ndivyo nilivyofanya
  rationale: Kauli hii ya Kiswahili inarejelea kwa kawaida shughuli ya mateso iliyotajwa kabla na kuhifadhi maana ya kwamba Paulo kweli aliifanya.
- source_word: ἐν Ἱεροσολύμοις
  choice: huko Yerusalemu
  rationale: ‘Huko’ inaunganisha mahali hapa kwa kawaida na rejeleo la awali, huku ‘Yerusalemu’ likiwa jina la kawaida la Kiswahili.
- source_word: πολλούς τε τῶν ἁγίων
  choice: wengi wa watakatifu
  rationale: ‘Watakatifu’ huhifadhi maana ya watu waliowekwa wakfu kwa Mungu, yaani waumini, bila kuidhibiti kwa kundi maalumu lililotangazwa baadaye kuwa watakatifu.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: niliwafungia gerezani
  rationale: Kitenzi ‘kuwafungia’ kinaonyesha kuwazuia wasitoke, na ‘gerezani’ ni usemi wa kawaida wa Kiswahili unaowasilisha φυλακαῖς kwa maana ya vifungo au magereza.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: nikiwa nimepewa mamlaka na makuhani wakuu
  rationale: Huhifadhi msingi wa mamlaka ya tendo hilo na chanzo chake; ‘makuhani wakuu’ ni tafsiri ya kawaida ya ἀρχιερεῖς.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: nao walipokuwa wakiuawa
  rationale: Muundo wa wakati unaakisi participio ya hali ya kutendwa na ‘wakiuawa’ haitaji kwa ziada aina mahususi ya utekelezaji wa hukumu.
- source_word: κατήνεγκα ψῆφον
  choice: nilipiga kura dhidi yao
  rationale: ‘Kupiga kura’ ni nahau ya kawaida ya Kiswahili kwa kutoa kura; ‘dhidi yao’ huonyesha mwelekeo wa uamuzi unaodokezwa na muktadha bila kubainisha taasisi iliyohusika.
theological_decisions:
- issue: Maana ya ἅγιοι katika Matendo
  choice: watakatifu, ikimaanisha waumini walio watu watakatifu wa Mungu
  alternative: waumini; watu wa Mungu
  rationale: Neno linataja jumuiya ya waumini, si tabaka dogo la watu waliotangazwa watakatifu. Tafsiri ya moja kwa moja inahifadhi msamiati wa Agano Jipya, na tanbihi inazuia uelewa wa baadaye usiokusudiwa.
- issue: Nguvu ya κατήνεγκα ψῆφον
  choice: nilipiga kura dhidi yao
  alternative: niliunga mkono kuuawa kwao
  rationale: Usemi wa Kigiriki unataja ψῆφος, ‘kura’ au jiwe la kupigia kura, hivyo tafsiri inahifadhi uwezekano wa ushiriki binafsi katika uamuzi bila kudai kwa uhakika mfumo rasmi wa taasisi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaendeleza mtiririko wa masimulizi huku ikihifadhi uzito wa matendo ya Paulo na kutotatua kupita kiasi utata wa ikiwa ψῆφος ilikuwa kura rasmi au usemi wa idhini yake.
