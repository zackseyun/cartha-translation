translation:
  language: sw
  text: Na sasa nimesimama nikihukumiwa kwa sababu ya tumaini la ahadi ambayo Mungu aliwapa baba zetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zetu.” Kigiriki kinasema “baba zetu,” kikirejelea wazee wa kale wa Israeli.
