lexical_decisions:
- source_word: καὶ νῦν
  choice: Na sasa
  rationale: Hudumisha kiunganishi na mpito wa hotuba ya Paulo kwa Kiswahili cha kawaida.
- source_word: ἐπ’ ἐλπίδι
  choice: kwa sababu ya tumaini
  rationale: ἐπί pamoja na hali ya dative hapa inaonyesha msingi au sababu ya kushtakiwa; usemi huu ni wa asili na wazi kwa Kiswahili.
- source_word: ἐπαγγελίας
  choice: ahadi
  rationale: Hili ndilo neno la kawaida na lililo wazi kwa ἐπαγγελία; hali ya genitive inalihusianisha tumaini na ahadi hiyo bila kufafanua zaidi aina ya uhusiano.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ
  choice: ahadi ambayo Mungu aliwapa baba zetu
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kuwa Mungu ndiye chanzo cha ahadi na baba zetu ndio waliopokea ahadi hiyo, huku ukiepuka tafsiri ngumu ya neno kwa neno.
- source_word: πατέρας ἡμῶν
  choice: baba zetu
  rationale: Huhifadhi lugha ya kiume ya Kigiriki na mwangwi wake wa kihistoria wa mababu wa Israeli; tanbihi inatoa 'mababu zetu' kama mbadala wa asili.
- source_word: ἕστηκα κρινόμενος
  choice: ninashtakiwa
  rationale: Katika muktadha wa mahakama, κρίνω ina maana ya kushtakiwa au kuhukumiwa. Kiswahili 'ninashtakiwa' huwasilisha hali ya sasa ya Paulo mahakamani kwa ufasaha; maana ya ἕστηκα ya kusimama mbele ya mahakama imejumuishwa katika usemi huo.
theological_decisions:
- issue: Utambulisho wa “baba zetu”
  choice: Baba wa kale wa Israeli waliopokea ahadi ya Mungu
  alternative: Mababu wa Wayahudi kwa maana ya jumla
  rationale: Katika hotuba ya Paulo mbele ya Agripa, kifungu hiki kinarejelea historia ya agano ya Israeli. Maandishi makuu yanahifadhi 'baba zetu' bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Ninashtakiwa' ni usemi wa kawaida wa kisheria na huepuka muundo mzito wa 'nimesimama nikihukumiwa.'
