  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: sw
  text: Mfalme Agripa, je, unawaamini manabii?[a] Ninajua kwamba unawaamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unaukubali ujumbe wa manabii” au “unawasadiki manabii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: unawaamini
  rationale: Kitenzi cha wakati wa sasa, nafsi ya pili umoja. Pamoja na yambwa ya udativu ‘manabii,’ hapa kinamaanisha kukubali kuwa ushuhuda au ujumbe wao ni wa kweli; ‘unawaamini’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Mfalme Agripa
  rationale: Muundo wa wito umetafsiriwa kwa namna ya kawaida ya kumwita mtawala kwa Kiswahili, huku jina likinakiliwa kwa tahajia inayofaa Kiswahili.
- source_word: τοῖς προφήταις
  choice: manabii
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi. Inahifadhi rejeo kwa manabii wenyewe kama mashahidi wa Maandiko bila kulibadili waziwazi kuwa ‘maandishi’ au ‘ujumbe’ wao.
- source_word: οἶδα
  choice: Ninajua
  rationale: Ingawa umbo la Kigiriki ni timilifu, lina maana ya sasa hapa. ‘Ninajua’ linadumisha uthabiti wa dai la Paulo bila kulilegeza kuwa dhana au makisio.
- source_word: ὅτι πιστεύεις
  choice: kwamba unawaamini
  rationale: Kirai kinaeleza jambo ambalo Paulo analijua. Kurudia ‘unawaamini’ kunahifadhi urudiaji wa kitenzi katika Kigiriki; Kiswahili hakihitaji kiambajengo cha ziada kinacholingana na ‘do’ ya msisitizo wa Kiingereza.
theological_decisions:
- issue: Maana ya kuwaamini manabii
  choice: Imetafsiriwa kama kuamini au kukubali ushuhuda wa manabii, bila kufafanua zaidi aina au kiwango cha imani hiyo.
  alternative: kukubali ujumbe wa manabii; kuwa na imani katika manabii
  rationale: πιστεύω pamoja na udativu inaweza kueleza kumwamini mtu au kukubali ushuhuda wake. ‘Unawaamini manabii’ huhifadhi upana huo na mvutano wa hoja ya Paulo bila kuingiza maana ya utii kamili au dai pana zaidi la kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Je’ huonyesha swali la moja kwa moja kwa ufasaha, na ‘Mfalme Agripa’ ni namna ya kawaida ya kumwita mtu huyo bila kutumia mtindo wa kizamani.
