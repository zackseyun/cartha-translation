  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: sw
  text: Baada ya jambo hilo kutokea, watu wengine kisiwani waliokuwa na magonjwa pia walikuja na kuponywa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Baada ya jambo hilo kutokea
  rationale: Kirai huru cha uhusika milikishi kinaonyesha mfuatano wa wakati na mpito wa simulizi; tafsiri hii ni ya asili na inaelekeza kwenye uponyaji uliotangulia.
- source_word: οἱ λοιποί
  choice: watu wengine
  rationale: Katika muktadha huu λοιποί ni watu wengine zaidi ya yule mgonjwa aliyetajwa kabla; Kiswahili hiki ni cha kawaida na hakidokezi kwamba kila mtu mwingine kisiwani alikuwa mgonjwa.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: kisiwani
  rationale: Kirai hiki kinabainisha mahali walipokuwa watu hao; 'kisiwani' ni usemi wa kawaida wa Kiswahili.
- source_word: ἔχοντες ἀσθενείας
  choice: waliokuwa na magonjwa
  rationale: Inahifadhi kwa uwazi kitenzi 'kuwa na' na wingi wa ἀσθενείας, huku ikisomeka kwa urahisi katika Kiswahili cha sasa.
- source_word: προσήρχοντο
  choice: walikuja
  rationale: Kauli ya wakati uliopita usiotimilika inaweza kuonyesha kuja kulikorudiwa; katika simulizi, 'walikuja' huwasilisha jambo hilo kwa kawaida bila kuongeza mlengwa ambaye hajatajwa wazi.
- source_word: ἐθεραπεύοντο
  choice: kuponywa
  rationale: Inahifadhi kauli tendwa ya Kigiriki; muundo 'walikuja na kuponywa' ni mfupi na wa asili, nao unaweza kuwakilisha uponyaji uliotokea walipokuja.
- source_word: καὶ ... καὶ
  choice: pia ... na
  rationale: '''Pia'' inaunganisha tukio hili na uponyaji uliotangulia, huku ''na'' ikiunganisha kuja kwao na kuponywa kwao.'
