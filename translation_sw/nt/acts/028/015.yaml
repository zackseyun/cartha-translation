id: ACT.28.15
reference: Acts 28:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: sw
  text: Na kutoka huko, ndugu[a], waliposikia habari zetu, walikuja kutulaki mpaka Soko la Apio na Mikahawa Mitatu. Paulo alipowaona, alimshukuru Mungu akapata moyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike”; Kigiriki kinasema “ndugu,” neno lililotumiwa kwa waamini wenzao na ambalo katika muktadha linaweza kujumuisha wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Na kutoka huko
  rationale: Inadumisha kiunganishi cha simulizi na mpito wa mahali kwa Kiswahili cha kawaida.
- source_word: οἱ ἀδελφοὶ
  choice: ndugu
  rationale: Inahifadhi umbo la Kigiriki linalowataja waamini wenzao; katika muktadha linaweza kujumuisha wanawake, jambo linaloelezwa katika tanbihi.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: waliposikia habari zetu
  rationale: Kirai cha Kigiriki kinamaanisha habari zinazowahusu Paulo na wenzake; kishirikishi kimetafsiriwa kama kishazi cha wakati kwa ufasaha.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: walikuja kutulaki
  rationale: Kutulaki ni usemi wa kawaida unaoonyesha kuja kumpokea au kukutana na mtu anayewasili.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: mpaka Soko la Apio na Mikahawa Mitatu
  rationale: Mpaka linahifadhi wazo la umbali waliofika; majina ya vituo yametolewa kwa maana yake kwa namna iliyo wazi katika Kiswahili.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: Paulo alipowaona
  rationale: Inabainisha mtendaji aliyetajwa katika Kigiriki na kuwasilisha kishirikishi kama kishazi cha wakati.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: alimshukuru Mungu
  rationale: Ni Kiswahili cha asili kinachohifadhi shukrani iliyoelekezwa wazi kwa Mungu.
- source_word: ἔλαβε θάρσος
  choice: kupata moyo
  rationale: Nahau hii ya Kiswahili inaeleza kupokea ujasiri au kutiwa nguvu moyoni bila kuifanya kuwa ukakamavu wa kimabavu.
theological_decisions:
- issue: Maana ya ἀδελφοί kwa kundi la waamini ambalo huenda lilijumuisha wanaume na wanawake
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waamini
  rationale: Neno ndugu huhifadhi neno la undugu la Kigiriki na kwa Kiswahili linaweza kutumiwa kwa waamini wenzao. Tanbihi inaweka wazi uwezekano wa maana jumuishi bila kuubadili kimya kimya kuwa neno jingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kutulaki” na “kupata moyo” ni misemo inayoeleweka na inayofaa simulizi rasmi. Majina ya vituo yametafsiriwa kwa maana yake; “Apio” limetoholewa kwa mwandiko wa Kiswahili.
