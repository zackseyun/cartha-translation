  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: sw
  text: Ikawa baada ya siku tatu, Paulo akawaita pamoja viongozi wakuu wa Wayahudi[a]. Walipokusanyika, akawaambia, “Mimi, ndugu zangu[b], ingawa sikuwa nimefanya jambo lolote kinyume na watu wala desturi za mababu zetu[c], nilikabidhiwa nikiwa mfungwa kutoka Yerusalemu mikononi mwa Waroma[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu mashuhuri miongoni mwa Wayahudi” au “viongozi wa Wayahudi.”
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” hapa ni mwito wa Paulo kwa viongozi wanaume wa Kiyahudi aliowakusanya.
    reason: cultural_note
  - marker: c
    text: Au “desturi za mababu” au “desturi za tangu zamani.”
    reason: lexical_alternative
  - marker: d
    text: Au “nilikabidhiwa ... kwa Waroma.” Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “nilikabidhiwa ... mikononi mwa Waroma,” yaani chini ya mamlaka yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Ikawa baada ya siku tatu
  rationale: Inahifadhi mpito wa kisimulizi wa Luka na taarifa ya wakati bila kuongeza neno linalomaanisha ‘sasa.’
- source_word: συγκαλέσασθαι αὐτὸν
  choice: Paulo akawaita pamoja
  rationale: ‘Akawaita pamoja’ linaonyesha wazi maana ya kuwaita ili wakusanyike. Jina ‘Paulo’ limetumiwa badala ya kiwakilishi ili Kiswahili kiwe wazi katika mwanzo wa mstari.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: viongozi wa Wayahudi
  rationale: πρῶτοι hapa hueleza cheo au umaarufu, si mpangilio wa kwanza; ‘viongozi’ ni usemi wa kawaida na unaoeleweka.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Walipokusanyika
  rationale: Kishazi huru cha Kigiriki kimetolewa kwa kishazi cha wakati cha Kiswahili.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Ndugu zangu
  rationale: Ni mwito wa heshima na mshikamano kwa wanaume Wayahudi waliokusanyika; umbo hili ni la asili katika Kiswahili, huku nafsi ya kwanza ikibainishwa na kitenzi kinachofuata.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: ingawa sikuwa nimefanya jambo lolote kinyume na
  rationale: '‘Ingawa’ linaonyesha nguvu ya kukubali hali inayotofautiana na matokeo: licha ya kutokuwa na kosa, Paulo alikabidhiwa.'
- source_word: τῷ λαῷ
  choice: watu wetu
  rationale: Muktadha unaonyesha taifa la Wayahudi ambalo Paulo na wasikilizaji wake walihusiana nalo; ‘watu wetu’ ni wazi na asili katika Kiswahili, ingawa kiwakilishi milikishi hakijaandikwa wazi katika Kigiriki.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: desturi za mababu zetu
  rationale: Hutoa maana ya desturi zilizorithiwa kutoka kwa mababu na kudumisha mshikamano wa Paulo na wasikilizaji wake.
- source_word: δέσμιος
  choice: nikiwa mfungwa
  rationale: Inaeleza hali ya Paulo alipokabidhiwa bila kulazimisha maana ya minyororo halisi.
- source_word: ἐξ Ἱεροσολύμων
  choice: kutoka Yerusalemu
  rationale: Ni tafsiri ya moja kwa moja ya mahali alikotolewa.
- source_word: παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: nilikabidhiwa ... na kutiwa mikononi mwa Waroma
  rationale: Inadumisha picha ya Kigiriki ya kukabidhiwa katika mamlaka au ulinzi wa Waroma kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Maana ya ἀδελφοί katika mwito wa moja kwa moja
  choice: Ndugu zangu
  alternative: Ndugu wanaume
  rationale: Paulo anawahutubia viongozi wanaume wa Kiyahudi aliowaita. ‘Ndugu zangu’ hudumisha mshikamano wa mwito bila kupanua kundi kwa njia isiyodokezwa na muktadha.
- issue: Nguvu ya kisarufi ya οὐδὲν ἐναντίον ποιήσας
  choice: ingawa sikuwa nimefanya jambo lolote kinyume na
  alternative: bila kuwa nimefanya jambo lolote kinyume na
  rationale: Tafsiri ya kukubali hali inayotofautiana na matokeo inaonyesha mvutano wa simulizi—Paulo alikabidhiwa licha ya madai yake ya kutofanya kosa—bila kuongeza hitimisho la kitheolojia.
- issue: Rejeo la τῷ λαῷ
  choice: watu wetu
  alternative: watu
  rationale: Rejeo ni kwa watu wa Israeli katika hotuba ya Paulo kwa viongozi wa Kiyahudi. Kiwakilishi ‘wetu’ kinaweka wazi uhusiano unaodokezwa na muktadha, bila kutaja kundi jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi; istilahi za kisheria zimewekwa wazi bila kuwa nzito. Alama zote za tanbihi [a]–[d] zimewekwa katika matini kuu.
