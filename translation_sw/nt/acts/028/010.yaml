  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: sw
  text: Nao walituheshimu sana[a], na tulipokuwa tukiondoka kwa meli[b], wakapakia kwenye meli vitu tulivyohitaji[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kihalisi zaidi, “walituheshimu kwa heshima nyingi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tulipokuwa tukitia safari kwa meli.” Neno la Kigiriki ni istilahi ya safari ya majini inayomaanisha kuanza safari kwa meli.
    reason: lexical_alternative
  - marker: c
    text: Au, “wakatupatia tulivyohitaji.” Kigiriki kinasema kihalisi zaidi kwamba waliweka kwenye meli vitu vya mahitaji yetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: walitupa heshima kubwa
  rationale: Huwasilisha kwa Kiswahili cha kawaida wingi na uzito wa heshima waliyoonyesha, bila kurudia nomino na kitenzi kwa namna isiyo ya kawaida.
- source_word: ἀναγομένοις
  choice: tulipokuwa karibu kuanza safari ya baharini
  rationale: Katika muktadha wa usafiri wa majini, kitenzi hiki humaanisha kuanza safari kwa meli au kuondoka kuelekea baharini.
- source_word: ἐπέθεντο
  choice: wakapakia melini
  rationale: Huhifadhi tendo halisi la kuweka vitu juu ya chombo; kutaja meli kunafanya maana iliyodokezwa na muktadha wa baharini iwe wazi.
- source_word: τὰ πρὸς τὰς χρείας
  choice: vitu tulivyohitaji
  rationale: Ni Kiswahili cha asili kinachohifadhi wazo la vitu au mahitaji ya lazima bila uradidi mzito.
