  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: sw
  text: Na baadhi yao walishawishika na yale yaliyokuwa yakisemwa, lakini wengine hawakuamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikataa kuamini.”
    reason: Neno la Kigiriki linaweza kueleweka kuwa kutokuamini au kukataa kuamini; matini kuu huepuka kuongeza wazi wazo la kukataa kwa makusudi.
lexical_decisions:
- source_word: ἐπείθοντο
  choice: walishawishwa
  rationale: Kitenzi hiki cha wakati usiotimilika kinaonyesha mwitikio uliokuwa ukiendelea; “walishawishwa” huhifadhi maana ya kukubali hoja bila kulazimisha maana kamili ya imani ya wokovu.
- source_word: τοῖς λεγομένοις
  choice: na yale yaliyokuwa yakisemwa
  rationale: Kirai hiki hurejelea yaliyomo katika mazungumzo yaliyokuwa yakiendelea; muundo huu ni wa kawaida katika Kiswahili na huhifadhi hali endelevu ya usemi.
- source_word: ἠπίστουν
  choice: hawakuamini
  rationale: Tafsiri hii huonyesha kutokuamini bila kuongeza kwa lazima wazo la kukataa kwa makusudi, ambalo linawezekana lakini halijaelezwa wazi na neno lenyewe.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: baadhi yao ... lakini wengine
  rationale: Muundo huu unaonyesha mgawanyiko wa kundi katika miitikio miwili tofauti, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaendeleza simulizi kutoka mstari uliotangulia bila kufasiri kupita kiasi uhusiano wa kimantiki.
theological_decisions:
- issue: Asili ya tofauti katika mwitikio
  choice: Mstari unatofautisha wale walioshawishwa na ujumbe wa Paulo na wale ambao hawakuamini, bila kuainisha zaidi hali yao ya mwisho ya kiroho.
  alternative: Kuwataja walioshawishwa kuwa waumini wa kweli na wengine kuwa watu waliokataa kwa ukaidi katika maana pana ya kiteolojia.
  rationale: Kigiriki kinaeleza miitikio tofauti kwa ujumbe uliotangazwa, lakini hakifafanui hapa hali ya mwisho ya kiroho ya kila kundi; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “yale yaliyokuwa yakisemwa” huhifadhi mchakato endelevu wa mazungumzo.
