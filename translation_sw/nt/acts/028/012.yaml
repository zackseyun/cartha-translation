  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: sw
  text: Na baada ya kutia nanga Sirakusa[a], tulikaa huko siku tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kutua Sirakusa” au “baada ya kufika Sirakusa.” Kitenzi cha Kigiriki hapa kina maana ya safari ya baharini, yaani kutia bandarini.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: baada ya kufika bandari
  rationale: Katika muktadha wa safari ya baharini, kitenzi κατάγω humaanisha kufika nchi kavu au kuingia bandarini. Kauli hii inawasilisha maana ya baharini kwa Kiswahili cha kawaida bila kutumia tafsiri sisisi ya ‘kushushwa.’
- source_word: εἰς Συρακούσας
  choice: ya Sirakusa
  rationale: εἰς huonyesha mahali walipofikia; kwa kuwa καταχθέντες ina maana ya kufika bandarini, ‘bandari ya Sirakusa’ ni muundo wa asili wa Kiswahili.
- source_word: ἐπεμείναμεν
  choice: tulikaa huko
  rationale: Kitenzi hiki humaanisha kubaki au kukaa. ‘Huko’ huonyesha mahali panapodokezwa na muktadha bila kuongeza wazo jipya.
- source_word: ἡμέρας τρεῖς
  choice: siku tatu
  rationale: Huu ni mtendajiwa wa muda unaoonyesha kipindi; baada ya ‘tulikaa,’ Kiswahili huonyesha muda kwa kawaida bila kihusishi.
- source_word: Συρακούσας
  choice: Sirakusa
  rationale: Huu ni utohozi wa Kiswahili unaolingana kwa karibu na jina la Kigiriki Συράκουσαι na namna majina ya mahali yanavyowasilishwa katika Kiswahili.
