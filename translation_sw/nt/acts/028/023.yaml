id: ACT.28.23
reference: Acts 28:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: sw
  text: Baada ya kupanga siku pamoja naye, watu wengi zaidi walimjia kwenye makao yake[a]. Tangu asubuhi hadi jioni, aliwaeleza kwa undani, akitoa ushahidi wa nguvu kuhusu ufalme wa Mungu na akijaribu kuwashawishi[b] kuhusu Yesu kwa msingi wa Sheria ya Musa na Manabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali alipofikia” au “mahali alipokuwa akiishi.” Neno la Kigiriki linamaanisha makao au mahali pa kulala kwa muda.
    reason: lexical_alternative
  - marker: b
    text: Au, “akiwashawishi.” Neno la Kigiriki linaweza kusisitiza tendo la kushawishi au jitihada ya kushawishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: Baada ya kupanga siku pamoja naye
  rationale: Kirai hiki kinamaanisha kupanga au kuweka siku ya kukutana; ‘pamoja naye’ huwasilisha αὐτῷ kwa Kiswahili cha kawaida.
- source_word: εἰς τὴν ξενίαν
  choice: mahali alipokuwa anakaa
  rationale: ξενία humaanisha mahali pa kulala au makao ya muda; usemi huu ni wazi na wa kawaida bila kudai kwa usahihi aina ya makao.
- source_word: πλείονες
  choice: watu wengi zaidi
  rationale: Huhifadhi nguvu ya ulinganisho ya πλείονες, yaani idadi kubwa zaidi kuliko waliokuwapo awali.
- source_word: ἐξετίθετο
  choice: aliwafafanulia
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha ufafanuzi ulioendelea; ‘kuwafafanulia’ ni cha asili na kinaeleweka.
- source_word: διαμαρτυρόμενος
  choice: kuwashuhudia kwa uzito
  rationale: Huhifadhi wazo la kutoa ushahidi kwa mkazo na uzito bila kutumia lugha ngumu isiyo ya kawaida.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri ya moja kwa moja, iliyozoeleka na iliyo wazi.
- source_word: πείθων τε αὐτοὺς
  choice: akijaribu kuwashawishi
  rationale: Huwasilisha shughuli ya kujaribu kuwafanya wakubali bila kudokeza kwamba wote walishawishika kwa mafanikio.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: kuhusu Yesu
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachowasilisha mada ya hoja.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: kwa kutumia Sheria ya Musa na Manabii
  rationale: ἀπό hapa huonyesha chanzo au msingi wa hoja; ‘kwa kutumia’ hutoa maana hiyo kwa Kiswahili cha asili, huku jozi ya Sheria na Manabii ikihifadhiwa.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: Tangu asubuhi hadi jioni
  rationale: Ni usemi wa kawaida unaohifadhi muda wote uliotajwa bila kufasiri πρωῒ kuwa alfajiri.
theological_decisions:
- issue: Uhusiano kati ya ufalme wa Mungu na ushuhuda kuhusu Yesu
  choice: Maelezo kuhusu ufalme wa Mungu na hoja kuhusu Yesu yamewasilishwa kama sehemu za ufafanuzi mmoja unaoendelea.
  alternative: Kuyatenganisha kuwa mafundisho mawili yasiyohusiana.
  rationale: Muundo wa Kigiriki unaunganisha ufalme wa Mungu na habari kuhusu Yesu katika tendo moja la ufafanuzi na ushawishi, bila kueleza zaidi uhusiano wao wa kitheolojia.
- issue: Matokeo ya tendo la πείθων
  choice: akijaribu kuwashawishi
  alternative: akiwashawishi
  rationale: Kitenzi kinaweza kutaja tendo la kushawishi au jitihada ya kushawishi; muktadha hauhitaji hitimisho kwamba wote walikubali, hivyo tafsiri inalinda utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa upya kidogo ili kipindi cha ‘tangu asubuhi hadi jioni’ kiwe wazi. ‘Mahali alipokuwa anakaa’ huepuka istilahi nzito, na ‘kuwashuhudia kwa uzito’ huhifadhi mkazo wa διαμαρτυρόμενος.
