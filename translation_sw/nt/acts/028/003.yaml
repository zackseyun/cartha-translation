  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: sw
  text: Lakini Paulo alipokwisha kukusanya fungu la vijiti na kuviweka juu ya moto, nyoka mwenye sumu alitoka kwa sababu ya joto[a] na kujishikiza kwenye mkono wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “kutoka katika joto.” Kihusishi cha Kigiriki kinaweza kutafsiriwa kwa uhalisi zaidi hivi, ingawa hapa huenda kinaonyesha sababu: nyoka alitoka kwa sababu ya joto la moto.'
    reason: lexical_alternative
  - marker: b
    text: Au, “akaushika mkono wake” au “akauma mkono wake.” Kitenzi cha Kigiriki kina maana pana ya kujishikiza au kushika kwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: alipokuwa amekusanya
  rationale: Kirai cha aoristi katika muundo wa genitive absolute kinaonyesha tendo la Paulo lililotangulia kuweka kuni motoni. ‘Kukusanya’ ni ya kawaida na inafaa muktadha wa kuni kuliko maana halisi ya kuviringisha pamoja.
- source_word: φρυγάνων τι πλῆθος
  choice: fungu la vijiti
  rationale: φρύγανα ni vijiti vikavu au vichaka vidogo vya kuwashia moto, na τι πλῆθος ni kiasi kisichotajwa wazi. ‘Fungu la vijiti’ ni taswira ya kawaida inayoonyesha kiasi kilichokusanywa.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: kuviweka motoni
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo la kuweka vile vijiti juu ya moto, bila uzito usio wa lazima.
- source_word: ἔχιδνα
  choice: nyoka mwenye sumu
  rationale: ἔχιδνα humaanisha aina ya nyoka mwenye sumu, si nyoka kwa ujumla. Kiswahili ‘nyoka mwenye sumu’ ni wazi kwa wasomaji wengi na hakilazimishi jina la kikundi maalumu la zoolojia.
- source_word: ἀπὸ τῆς θέρμης
  choice: kwa sababu ya joto
  rationale: Ingawa ἀπό kwa msingi inaweza kuwa ‘kutoka,’ hapa inaeleweka kwa kawaida kuwa joto ndilo lililosababisha nyoka atoke. Tanbihi huhifadhi uwezekano wa tafsiri halisi zaidi.
- source_word: ἐξελθοῦσα
  choice: alitoka
  rationale: Hutoa kwa urahisi tendo la nyoka kuibuka, huku mfuatano wa sentensi ukihifadhi uhusiano wa kirai cha Kigiriki.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: kujishikiza kwenye mkono wake
  rationale: καθάπτω ina maana pana ya kushika au kujifunga kwenye kitu. ‘Kujishikiza’ huhifadhi picha hiyo bila kuamua kimyakimya kwamba kitenzi chenyewe humaanisha ‘kuuma.’
