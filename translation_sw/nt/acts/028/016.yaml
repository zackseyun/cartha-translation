review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the temporal arrival clause, Paul's granted permission, separate lodging, and the accompanying guard. The Greek phrase καθ’ ἑαυτόν means that Paul was lodged separately/on his own, qualified by the presence of the guarding soldier; it should not naturally suggest absolute solitude.
  naturalness: '"peke yake pamoja na askari" is understandable but creates an avoidable surface tension in Swahili, since peke yake normally means entirely alone. "kivyake" naturally expresses separate or private lodging while allowing for the stated guard.'
  terminology: '"Roma," "Paulo," "aliruhusiwa," and "askari ... akimlinda" are standard, clear East African Swahili and preserve the register of the narrative.'
