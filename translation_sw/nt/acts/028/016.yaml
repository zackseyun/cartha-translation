  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: sw
  text: Tulipoingia Roma, Paulo aliruhusiwa kukaa kivyake pamoja na askari aliyekuwa akimlinda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: Tulipo-
  rationale: Kiunganishi cha wakati kimewasilishwa kwa muundo wa kitenzi wenye -po-, ambao ni wa kawaida na wa asili katika Kiswahili.
- source_word: δὲ
  choice: —
  rationale: Hiki ni kiunganishi hafifu cha mazungumzo; hakihitaji kutafsiriwa waziwazi hapa kwa kuwa mfuatano wa simulizi unaeleweka vizuri bila ‘na’ au ‘lakini’.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: tulipoingia Roma
  rationale: ‘Kuingia Roma’ huhifadhi wazi maana ya mwendo wa kuingia mahali, badala ya tafsiri pana zaidi ya ‘kufika Roma’.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: Paulo aliruhusiwa
  rationale: Muundo wa kutendwa unaonyesha kwamba Paulo alipewa ruhusa, nao ni wa asili katika Kiswahili.
- source_word: μένειν
  choice: kukaa
  rationale: Katika muktadha wa makazi chini ya ulinzi, ‘kukaa’ ni ya asili na inaweza kumaanisha kubaki au kuishi kwa muda bila kuongeza maelezo yasiyokuwamo.
- source_word: καθ’ ἑαυτόν
  choice: peke yake
  rationale: Usemi huu unaonyesha kukaa kando au bila wafungwa wengine; haukatai kuwapo kwa askari, kama kirai kinachofuata kinavyofafanua.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: pamoja na askari aliyekuwa akimlinda
  rationale: ‘Pamoja na’ huonyesha uandamani, na ‘aliyekuwa akimlinda’ huhifadhi tendo linaloendelea la askari. Kiswahili hakilazimishi utofauti wa kibainishi kati ya ‘askari mmoja’ na ‘yule askari,’ hivyo ‘askari’ huepuka kuamua zaidi ya maandishi.
