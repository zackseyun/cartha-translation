  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: sw
  text: Wenyeji[a] walituonyesha wema usio wa kawaida[b], kwa maana waliwasha moto na kutukaribisha sisi sote kwa sababu ya mvua iliyokuwa ikiendelea kunyesha na kwa sababu ya baridi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki βάρβαροι kihalisi ni “wabarbari”; katika muktadha huu linarejelea watu wasiozungumza Kigiriki, yaani wenyeji wa kisiwa, bila lazima ya kumaanisha kwamba walikuwa washenzi.
    reason: lexical_alternative
  - marker: b
    text: Au, “walitutendea wema wa ajabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: Wenyeji
  rationale: Katika muktadha huu neno hilo linamaanisha wakazi wa huko ambao hawakuzungumza Kigiriki, si lazima watu wasio na ustaarabu. “Wenyeji” ni Kiswahili cha kawaida kisicho na dharau.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: wema usio wa kawaida
  rationale: Huhifadhi muundo wa kukanusha wa nahau ya Kigiriki huku ikieleza wazi wema wa pekee walioutenda.
- source_word: παρεῖχον
  choice: walituonyesha
  rationale: Pamoja na φιλανθρωπίαν, kitenzi hiki kwa kawaida kina maana ya kuonyesha au kutendea mtu wema.
- source_word: ἅψαντες πυρὰν
  choice: waliwasha moto
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kitendo cha kuwasha moto bila kuufanya mahususi zaidi kuliko chanzo.
- source_word: προσελάβοντο πάντας ἡμᾶς
  choice: kutukaribisha sisi sote
  rationale: “Kutukaribisha” huonyesha kuwapokea kwa ukarimu, na “sisi sote” huhifadhi msisitizo wa ujumuishi.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: kwa sababu ya mvua iliyokuwa ikiendelea kunyesha
  rationale: Huonyesha kwamba mvua ilikuwa tayari imeanza na ilikuwa bado ipo, ambalo ndilo wazo la kirai cha Kigiriki.
- source_word: διὰ τὸ ψῦχος
  choice: kwa sababu ya baridi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ψῦχος katika muktadha wa hali ya hewa.
