  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “wenyeji” badala ya neno lenye dharau, huku tanbihi ikihifadhi maana ya kijamii na kilugha ya neno la Kigiriki.
