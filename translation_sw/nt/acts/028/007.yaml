base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: sw
  text: Katika maeneo ya karibu na mahali pale kulikuwa na mali za ardhi[a] za mtu mkuu wa kisiwa[b], aliyeitwa Publio. Alitupokea na kutukarimu kwa fadhili kwa siku tatu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mashamba” au “maeneo ya milki” kwa “mali za ardhi” (χωρία), ikimaanisha mali za ardhi katika maeneo hayo.
    reason: lexical_alternative
  - marker: b
    text: Au “kiongozi mkuu wa kisiwa.” Maneno ya Kigiriki τῷ πρώτῳ τῆς νήσου huenda yakamtaja mtu aliyekuwa mashuhuri zaidi au mwenye cheo cha juu zaidi kisiwani.
    reason: alternative_reading
  - marker: c
    text: Au “alitukaribisha na kutupa ukarimu kwa siku tatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: Katika eneo lililozunguka mahali pale
  rationale: Huwasilisha maana ya maeneo ya karibu na mahali hapo kwa Kiswahili cha kawaida; δέ ni kiunganishi hafifu cha masimulizi na hakihitaji neno zito katika sentensi hii.
- source_word: ὑπῆρχεν χωρία
  choice: kulikuwa na mashamba
  rationale: χωρία hapa humaanisha mali za ardhi au mashamba. “Mashamba” ni neno la kawaida, huhifadhi wingi, na halibainishi kupita kiasi aina ya mali hiyo.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: ya mtu mkuu wa kisiwa
  rationale: πρῶτος hapa huonyesha cheo au hadhi ya juu, si tu kuwa wa kwanza kwa mfuatano. “Mtu mkuu” huhifadhi uwezekano wa kuwa kiongozi au mtu mwenye hadhi ya juu bila kulazimisha jina mahususi la wadhifa.
- source_word: ὀνόματι Ποπλίῳ
  choice: aliyeitwa Publio
  rationale: Muundo huu hutambulisha jina la mtu. “Publio” ni umbo la jina linalofaa katika tahajia ya Kiswahili.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: Alitukaribisha
  rationale: Kitenzi kishirikishi kinaeleza kuwapokea wageni kwa moyo wa ukaribisho; sentensi huru ni ya asili zaidi katika Kiswahili.
- source_word: φιλοφρόνως ἐξένισεν
  choice: na kutupokea kama wageni kwa ukarimu
  rationale: 'Huhifadhi vipengele vyote viwili: kuwapa wageni hifadhi na huduma, na namna ya kirafiki au yenye fadhili ambayo tendo hilo lilifanywa.'
- source_word: τρεῖς ἡμέρας
  choice: kwa siku tatu
  rationale: Ni muda unaoendelea kwa siku tatu na unatolewa kwa muundo wa kawaida wa Kiswahili.
