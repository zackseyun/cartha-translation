  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: sw
  text: Ikawa baba yake Publio alikuwa amelala akiwa mgonjwa, akisumbuliwa na homa na kuhara damu.[a] Paulo akaingia kumwona, akaomba, akaweka mikono yake juu yake, akamponya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa ameshikwa na homa na kuhara damu.” Kitenzi cha Kigiriki kinaonyesha kwamba maradhi hayo yalikuwa yamemshika au yakimsumbua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Ikawa
  rationale: Ni kiunganishi cha kawaida cha masimulizi kinachoanzisha tukio; “Ikawa” ni cha asili katika simulizi la Kiswahili bila kuongeza neno la wazi la wakati.
- source_word: τὸν πατέρα τοῦ Ποπλίου
  choice: baba yake Publio
  rationale: Huwasilisha uhusiano wa umilikaji kwa Kiswahili cha kawaida na huhifadhi jina la mtu.
- source_word: πυρετοῖς
  choice: homa
  rationale: Katika Kiswahili, “homa” kwa kawaida ni nomino isiyohesabika; muktadha pamoja na kitenzi “akisumbuliwa” unaweza kujumuisha vipindi vya homa vilivyodokezwa na wingi wa Kigiriki.
- source_word: δυσεντερίῳ
  choice: kuhara damu
  rationale: Ni usemi wa kawaida na unaoeleweka kwa ugonjwa wa dysentery kuliko istilahi ya kitaalamu “disenteri.”
- source_word: συνεχόμενον
  choice: akisumbuliwa na
  rationale: Hutoa maana ya kushikwa au kuandamwa na maradhi kwa lugha ya kawaida bila kupunguza hali yake ya kuendelea.
- source_word: κατακεῖσθαι
  choice: alikuwa amelala akiwa mgonjwa
  rationale: Huhifadhi hali ya kulala na muktadha wa ugonjwa bila kudai kwa nguvu zaidi kwamba alikuwa hawezi kabisa kutoka kitandani.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: Paulo akaingia kumwona
  rationale: Hueleza kwa Kiswahili cha asili kwamba Paulo aliingia mahali alipokuwa mgonjwa huyo; “kumwona” hapa ni kwenda kwake, si uchunguzi wa kitabibu.
- source_word: προσευξάμενος
  choice: akaomba
  rationale: Mfuatano wa vitenzi vya simulizi unaonyesha kwa kawaida kuwa sala ilitangulia uponyaji.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: akaweka mikono yake juu yake
  rationale: Huhifadhi wingi wa “mikono” na ishara yenyewe bila kuongeza maana ya kimadhehebu.
- source_word: ἰάσατο αὐτόν
  choice: akamponya
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kumrudishia afya.
theological_decisions:
- issue: Asili ya tendo la Paulo la kuponya
  choice: 'Mfuatano umetolewa moja kwa moja: Paulo aliomba, akaweka mikono juu ya mgonjwa, kisha akamponya.'
  alternative: Kuliita wazi tendo hilo muujiza, sakramenti, au matibabu ya kitabibu.
  rationale: Mstari unasimulia uponyaji kupitia tendo la Paulo lililoambatana na sala, lakini hautoi lebo hizo za ziada wala kusema wazi kama uponyaji ulikuwa wa papo hapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Publio” ni umbo la jina linalofaa katika matamshi ya Kiswahili. Alama ya tanbihi [a] imewekwa baada ya kirai cha maradhi ambacho tanbihi inakifafanua.
