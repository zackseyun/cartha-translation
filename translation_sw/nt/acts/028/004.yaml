  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: sw
  text: Wenyeji wa kisiwa[a] walipomwona yule mnyama akining’inia kwenye mkono wake, wakaambiana, “Bila shaka mtu huyu ni muuaji. Ingawa ameokoka kutoka baharini, Haki[b] haijamruhusu aendelee kuishi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenyeji”; neno la Kigiriki linaweza kumaanisha “wasio Wagiriki” au “watu wasiozungumza Kigiriki,” wala halina maana ya kisasa ya “washenzi.”
    reason: lexical_alternative
  - marker: b
    text: Neno “Haki” hapa limefanywa kama nafsi, yaani nguvu inayowaadhibu wakosaji; huenda linarejelea dhana ya mungu wa kike katika imani ya wenyeji.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: wenyeji wa kisiwa
  rationale: Neno hili la Kigiriki linawataja wakazi wa eneo hilo ambao hawakuzungumza Kigiriki, wala si kuwalaumu kuwa washenzi. “Wenyeji wa kisiwa” linatambulisha watu hao kwa lugha ya kawaida na isiyopotosha.
- source_word: κρεμάμενον
  choice: akining’inia
  rationale: Linadumisha picha ya mnyama aliyekuwa amenasa au kuning’inia mkononi mwa Paulo bila kufafanua kupita kiasi namna alivyoshikamana naye.
- source_word: τὸ θηρίον
  choice: yule mnyama
  rationale: Neno la asili ni la jumla, yaani mnyama au kiumbe. Ingawa muktadha unaonyesha kwamba ni nyoka mwenye sumu, mstari huu wenyewe hautumii neno mahususi la “nyoka”.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: wakaambiana
  rationale: Kitenzi hiki cha Kiswahili kinaeleza kwa kawaida kwamba walisema wao kwa wao, huku kikihifadhi wazo la mazungumzo kati yao.
- source_word: Πάντως
  choice: Bila shaka
  rationale: Kinaonyesha uhakika mkubwa wa hitimisho la wenyeji kutokana na jambo waliloliona.
- source_word: φονεύς
  choice: muuaji
  rationale: Ni neno la kawaida na lililo wazi kwa mtu anayemuua mwingine kwa kukusudia.
- source_word: διασωθέντα
  choice: ameokoka
  rationale: Katika muktadha huu linamaanisha kupona au kuvuka salama hatari ya bahari. “Ameokoka” ni fupi na ya kawaida, na hapa muktadha wake wa kimwili uko wazi.
- source_word: ἡ δίκη
  choice: Haki
  rationale: Herufi kubwa inadokeza kwamba haki imefanywa kama nafsi au nguvu inayoadhibu, bila kudai wazi kuwa hilo ni jina rasmi la mungu wa kike.
- source_word: ζῆν οὐκ εἴασεν
  choice: haijamruhusu aendelee kuishi
  rationale: Linatoa maana ya kutoruhusiwa kuendelea kuwa hai na linaendana na hitimisho lao kuhusu tukio lililokuwa mbele yao.
- source_word: ἐκ τῆς θαλάσσης
  choice: kutoka baharini
  rationale: ἐκ ina maana ya kutoka; usemi huu unaeleza kwamba alinusurika hatari ya bahari bila kurudia wazo la kuvuka salama.
theological_decisions:
- issue: Uhaishaji wa δίκη
  choice: Haki
  alternative: haki; kisasi; mungu wa kike Haki
  rationale: Kauli hiyo ni maoni ya wenyeji kuhusu nguvu inayowaadhibu wahalifu. “Haki” yenye herufi kubwa inadumisha uhaishaji huo lakini haimaanishi kwamba msimulizi anakubali imani yao, wala haibainishi zaidi ya ushahidi wa maandishi kwamba ni jina rasmi la mungu wa kike.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Wakaambiana” hufanya usemi wao kwa wao kuwa wa asili, na sentensi mbili ndani ya dondoo hupunguza uzito wa muundo bila kuondoa mantiki ya Kigiriki.
