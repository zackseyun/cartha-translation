  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: sw
  text: akihubiri ufalme wa Mungu na kufundisha mambo yanayomhusu Bwana Yesu Masihi[a] kwa ujasiri wote bila kuzuiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Bwana Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutumika kama cheo (“Masihi”) au, katika baadhi ya miktadha, kama jina (“Kristo”).'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: akihubiri
  rationale: Kitenzi endelevu kinaendeleza muhtasari wa shughuli ya Paulo; “kuhubiri” ni usemi wa kawaida wa Kiswahili unaodumisha wazo la kutangaza hadharani.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Huu ni usemi wa kawaida na wa asili katika Kiswahili, huku ukihifadhi maana ya utawala na eneo la kifalme iliyomo katika βασιλεία.
- source_word: διδάσκων
  choice: kufundisha
  rationale: 'Inadumisha uratibu wa shughuli mbili zinazoendelea: kuhubiri na kufundisha.'
- source_word: τὰ περὶ
  choice: mambo yanayomhusu
  rationale: Ni Kiswahili cha asili kinachoakisi kwa uwazi maana ya mambo yanayohusiana na Yesu bila kupanua chanzo.
- source_word: κυρίου
  choice: Bwana
  rationale: Inahifadhi cheo cha Kikristo kilichozoeleka cha κύριος katika Agano Jipya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu, Masihi
  rationale: “Masihi” huonyesha maana ya cheo cha Χριστός; koma hufanya mfuatano wa vyeo usomeke kwa asili katika Kiswahili, huku uwezekano wa “Kristo” ukihifadhiwa katika tanbihi.
- source_word: μετὰ πάσης παρρησίας
  choice: kwa ujasiri wote
  rationale: Inadumisha wazo la kusema kwa uwazi, bila woga, pamoja na nguvu ya πάσης.
- source_word: ἀκωλύτως
  choice: bila kuzuiwa
  rationale: Usemi huu wa asili unadumisha mkazo wa neno la mwisho kwamba huduma haikuzuiwa.
theological_decisions:
- issue: Uwasilishaji wa Χριστός katika mfuatano wa cheo cha Kikristo
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός bado inaweza kusikika kama cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huonyesha maana hiyo, lakini “Kristo” ni usomaji halali wa kawaida unaotajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama Kigiriki, na neno la mwisho “bila kuzuiwa” limehifadhiwa kwa ajili ya mkazo wa hitimisho la kitabu.
