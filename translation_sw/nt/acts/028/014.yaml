  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: sw
  text: Huko tuliwakuta ndugu[a], nasi tukaombwa kukaa pamoja nao kwa siku saba. Na hivyo tukafika Roma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, waamini wenzao; neno la Kigiriki linalotafsiriwa “ndugu” linaweza kuwahusu wanaume na wanawake katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Huko
  rationale: Kielezi cha mahali kinarejelea mahali palipotajwa kabla, yaani Putéoli; “Huko” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: εὑρόντες
  choice: tuliwakuta
  rationale: Ingawa ni kitenzi-shirikishi cha wakati uliopita, kimetafsiriwa kwa kitenzi kamili ili simulizi lisikike la kawaida huku mfuatano wa matendo ukihifadhiwa.
- source_word: ἀδελφοὺς
  choice: ndugu
  rationale: Katika muktadha huu neno linarejelea waamini wenzao; “ndugu” huhifadhi istilahi ya kifamilia ya Kigiriki na kwa Kiswahili linaweza kujumuisha wanaume na wanawake.
- source_word: παρεκλήθημεν
  choice: tukaombwa
  rationale: Kauli tendwa ya παρακαλέω hapa inaonyesha kwamba waamini wa huko waliwasihi au kuwaomba wakae; “tukaombwa” inafaa kwa ukarimu wa muktadha bila kuzidisha nguvu ya ombi.
- source_word: παρ’ αὐτοῖς
  choice: pamoja nao
  rationale: παρά pamoja na dativu huonyesha kukaa katika ushirika au nyumbani kwao; “pamoja nao” ni usemi wa kawaida.
- source_word: ἐπιμεῖναι
  choice: kukaa
  rationale: Katika muktadha wa safari na malazi, ἐπιμένω humaanisha kubaki au kukaa mahali kwa muda.
- source_word: ἡμέρας ἑπτά
  choice: kwa siku saba
  rationale: Hii ni akusativi ya muda; kihusishi “kwa” kinaweka wazi muda wa kukaa kwa Kiswahili cha kawaida.
- source_word: καὶ οὕτως
  choice: Na hivyo
  rationale: Huhifadhi kiunganishi na wazo la kwamba kwa namna au mfuatano huo safari iliendelea hadi Roma.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: tukafika Roma
  rationale: ἔρχομαι pamoja na εἰς huonyesha kufika mahali palipokusudiwa; “tukafika Roma” ni ya kawaida katika simulizi la safari.
theological_decisions:
- issue: Rejeleo la ἀδελφοὺς
  choice: waamini wenzao katika jumuiya ya Kikristo ya mahali hapo
  alternative: ndugu wa kuzaliwa, au Wayahudi wenzao kwa ujumla
  rationale: Matumizi ya neno hili katika Matendo na muktadha wa ukarimu na kukaa pamoja yanaunga mkono maana ya waamini wenzao. Matini kuu inatumia “ndugu,” bila kufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetiririshwa kwa “nasi tukaombwa” na “tukafika,” huku uhusiano wa matendo na maana ya matini ya Kigiriki vikihifadhiwa.
