reference: Acts 28:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: sw
  text: Lakini wakamwambia, “Sisi hatujapokea barua zozote kutoka Yudea kuhusu wewe, wala ndugu[b] yeyote aliyekuja hakuripoti au kusema jambo lolote baya[a] kuhusu wewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo lolote ovu.”
    reason: lexical_alternative
  - marker: b
    text: Neno “ndugu” linaweza kumaanisha Wayahudi wenzao kutoka Yudea; maandishi hayasemi wazi kwamba walikuwa waamini Wakristo.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: Lakini wakamwambia
  rationale: ‘Lakini’ linaonyesha mwendelezo wenye utofauti mdogo wa δέ, na ‘wakamwambia’ ni njia ya kawaida ya Kiswahili ya kueleza εἶπαν πρὸς αὐτόν.
- source_word: Ἡμεῖς οὔτε ... οὔτε
  choice: Sisi hatu... wala ... haku...
  rationale: Kiwakilishi ‘Sisi’ kimehifadhiwa kwa ajili ya msisitizo, na ukanushaji wa pande mbili umeelezwa kwa muundo wa asili wa Kiswahili ‘hatu... wala ... haku...’.
- source_word: γράμματα
  choice: barua zozote
  rationale: Katika muktadha huu γράμματα ni barua au mawasiliano yaliyoandikwa; ‘zozote’ huonyesha wazi ukanushaji wa kutopokea hata moja.
- source_word: περὶ σοῦ
  choice: kuhusu wewe
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya περί pamoja na hali ya umilikishi katika muktadha huu.
- source_word: ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας
  choice: hatujapokea ... kutoka Yudea
  rationale: δέχομαι hapa ni kupokea barua, na wakati timilifu wa Kiswahili unaonyesha hali inayoendelea kuwa muhimu wakati wa mazungumzo.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: ndugu yeyote aliyekuja
  rationale: Muundo huu huhifadhi wazo la mtu fulani miongoni mwa ndugu aliyefika, bila kuongeza neno ‘hapa,’ ambalo halipo wazi katika Kigiriki.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: hakuripoti au kusema jambo lolote
  rationale: ‘Kuripoti’ na ‘kusema’ zinadumisha kwa kiasi tofauti kati ya kuleta taarifa na kunena jambo, bila kufanya Kiswahili kuwa kizito.
- source_word: πονηρόν
  choice: baya
  rationale: Katika muktadha wa taarifa inayomhusu Paulo, ‘baya’ ni neno la asili linaloweza kumaanisha jambo baya au lenye kumtia mtu hatiani, huku ‘ovu’ likibaki uwezekano wa kimsamiati.
theological_decisions:
- issue: Wanaorejelewa na τῶν ἀδελφῶν
  choice: ndugu
  alternative: Wayahudi wenzao; ndugu waamini Wakristo
  rationale: Wasemaji ni viongozi wa Wayahudi huko Roma wanaozungumzia watu waliotoka Yudea. Neno lenyewe halisemi wazi kama hawa ni Wayahudi wenzao kwa ujumla au waamini Wakristo, kwa hiyo tafsiri hailazimishi utambulisho mmoja.
- issue: Nguvu ya maana ya πονηρόν
  choice: jambo lolote baya
  alternative: jambo lolote ovu
  rationale: ‘Baya’ linafaa kwa taarifa mbaya au yenye shutuma katika muktadha huu; tanbihi inahifadhi uwezekano wa maana yenye uzito zaidi wa kimaadili bila kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo umeepuka tafsiri ya neno kwa neno isiyo ya asili, huku ukihifadhi msisitizo wa ‘Sisi,’ ukanushaji wa pande mbili, na utata wa utambulisho wa ‘ndugu.’
