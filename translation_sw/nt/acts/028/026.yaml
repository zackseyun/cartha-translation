  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: sw
  text: 'akisema[a], “Nenda kwa watu hawa ukawaambie: ‘Kwa kusikia mtasikia, lakini hamtaelewa kamwe; na mkiwa mnaona, mtaona[b], lakini hamtatambua kamwe.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina kitenzi kishirikishi, “akisema,” kinachounganisha maneno haya na sentensi iliyotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “na mkiwa mnaona, mtaona, lakini hakika hamtaona.” Kigiriki hurudia maneno yanayohusu kuona; hata hivyo, kitenzi cha mwisho katika muktadha huu kinaweza kumaanisha kutambua kwa ndani.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaunganisha nukuu na sentensi iliyotangulia; “akisema” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: Πορεύθητι
  choice: Nenda
  rationale: Amri ya πορεύομαι hapa ni agizo la kwenda; “Nenda” ni ya asili, wazi, na yenye hadhi.
- source_word: λαὸν τοῦτον
  choice: watu hawa
  rationale: λαός ni jamii ya watu kwa ujumla. Kiswahili sanifu hutumia “watu hawa” badala ya tafsiri isiyo ya kawaida “watu hii,” huku maana ya pamoja ikibaki.
- source_word: εἰπόν
  choice: ukawaambie
  rationale: Amri hii inaendeleza “Nenda” na inaelekeza maneno kwa watu waliotajwa; kiambishi cha yambwa huifanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Kwa kusikia mtasikia
  rationale: Huhifadhi urudiaji wa jina na kitenzi wenye mtindo wa Kiebrania katika nukuu ya kinabii, ingawa usemi huo si wa kawaida kabisa katika Kiswahili; ufafanuzi umetolewa katika tanbihi.
- source_word: οὐ μὴ συνῆτε
  choice: hamtaelewa kamwe
  rationale: οὐ μή pamoja na subjunktivu ni ukanushaji wenye mkazo; “kamwe” huwasilisha nguvu hiyo kwa uwazi.
- source_word: βλέποντες βλέψετε
  choice: kwa kuona mtaona
  rationale: Huhifadhi urudiaji na ulinganifu na “Kwa kusikia mtasikia” bila kuongeza wazo la upinzani ambalo halijaonyeshwa wazi na Kigiriki.
- source_word: οὐ μὴ ἴδητε
  choice: hamtatambua kamwe
  rationale: Ingawa ἴδητε inaweza kutafsiriwa “kuona,” katika muktadha huu inaelekea kwenye utambuzi wa ndani. “Hamtatambua” huonyesha utofauti kati ya kuona kwa macho na kufahamu, huku tanbihi ikihifadhi uwezekano wa tafsiri ya moja kwa moja.
theological_decisions:
- issue: Vitenzi vya hisi katika nukuu ya Isaya vinaashiria kutosikia na kutoona kwa ndani
  choice: Kutumia “kuelewa” na “kutambua” kwa kushindwa kwa ndani, huku “kusikia” na “kuona” vikibaki kwa uzoefu wa nje.
  alternative: Kutumia “kuona” pia katika kifungu cha mwisho ili kuhifadhi urudiaji mkali wa msamiati.
  rationale: Muktadha unatofautisha kupokea kwa masikio na macho na kufahamu kwa ndani. Tafsiri hii huhifadhi mvutano huo bila kuufanya kuwa fundisho la dhehebu; tanbihi inaonyesha kwamba kitenzi cha mwisho pia kinaweza kutafsiriwa moja kwa moja kuwa “kuona.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kinabii “Kwa kusikia mtasikia ... kwa kuona mtaona” umehifadhiwa kwa makusudi ili kuonyesha mkazo na ulinganifu wa chanzo, huku tanbihi zikisaidia msomaji wa kawaida.
