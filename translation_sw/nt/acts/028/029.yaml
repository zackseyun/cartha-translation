  text: Καὶ ταῦτα αὐτοῦ εἰπόντος, ἀπῆλθον οἱ Ἰουδαῖοι, πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: sw
  text: Baada ya Paulo kusema mambo hayo,[a] Wayahudi wakaondoka, huku wakiwa na mabishano makubwa wao kwa wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu wote haupatikani katika hati za kale zaidi za Kigiriki, kutia ndani Papirasi 74 (karne ya 6 au ya 7), Sinaiticus (karne ya 4), na Vaticanus (karne ya 4), wala katika tafsiri za kale za Kikopti. Unapatikana katika mapokeo ya hati nyingi za Kibizanti, na pia katika tafsiri za kale za Kilatini na Kisiria. Wataalamu wengi huona kwamba huenda ulikuwa nyongeza ya baadaye ya mwandishi wa nakala, iliyowekwa ili kukamilisha simulizi la kuondoka kwa viongozi wa Kiyahudi.
    reason: textual_critical
lexical_decisions:
- source_word: Καὶ ταῦτα αὐτοῦ εἰπόντος
  choice: Baada ya kusema mambo hayo
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba kuondoka kulitokea baada ya yeye kumaliza kusema, bila kulazimisha kiunganishi cha Kigiriki Καί kuwa ‘na’.
- source_word: ἀπῆλθον
  choice: wakaondoka
  rationale: ‘Wakaondoka’ ni simulizi la kawaida na lenye hadhi katika Kiswahili cha sasa, na linaendeleza mfuatano wa matukio.
- source_word: πολλὴν ... συζήτησιν
  choice: mabishano makali
  rationale: συζήτησις inaweza kumaanisha mjadala, mabishano, au hoja zinazobishaniwa. Katika muktadha wa kutokubaliana kwao, ‘mabishano makali’ huwasilisha uzito wa πολλήν bila kudokeza lazima ugomvi wa kimwili.
- source_word: ἐν ἑαυτοῖς
  choice: wao kwa wao
  rationale: Usemi huu wa asili unaonyesha kwamba mabishano yalikuwa miongoni mwa Wayahudi wenyewe.
