    rationale: αὐτοῦ εἰπόντος means 'when he had said [these things].' In context this is Paul; supplying his name is a natural Swahili clarification.
  - severity: low
    issue: '''Mabishano makali'' may overstate συζήτησις.'
    rationale: The word can denote discussion, debate, or dispute. 'Mabishano makubwa' conveys the force of πολλήν while retaining the range of a substantial internal dispute.
  - severity: high
    issue: The footnote misdates Papyrus 74 as third century and states a disputed textual-critical conclusion too categorically.
    rationale: Papyrus 74 is generally dated to the sixth or seventh century. The likely-secondary status of the verse should be attributed to scholarly assessment and expressed cautiously.
