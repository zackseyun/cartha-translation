id: ACT.28.19
reference: Acts 28:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: sw
  text: Lakini Wayahudi walipopinga[b][a], nililazimika kukata rufaa kwa Kaisari—si kwa sababu nilikuwa na jambo lolote la kulishtaki taifa langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokuwa wakinipinga,” au “walipokuwa wakinikanusha.”
    reason: lexical_alternative
  - marker: b
    text: “Wayahudi” hapa ni Wayahudi waliompinga Paulo katika muktadha huu wa kisheria, si kauli inayowahusu Wayahudi wote kwa ujumla.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: walipopinga
  rationale: Kishiriki cha wakati uliopo katika muundo wa genitive absolute kinaonyesha hali iliyosababisha hatua ya Paulo. “Walipopinga” ni ya kawaida na inafaa muktadha wa kisheria, huku ikihifadhi maana ya upinzani.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti nyepesi na kauli iliyotangulia.
- source_word: Ἰουδαίων
  choice: Wayahudi
  rationale: Hufuata moja kwa moja neno la Kigiriki bila kulibana kuwa “viongozi wa Kiyahudi”; muktadha unaonyesha kuwa ni wapinzani wa Paulo katika kesi hii.
- source_word: ἠναγκάσθην
  choice: nililazimika
  rationale: Huhifadhi wazo la shinikizo au ulazima katika kauli tendwa kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: kukata rufaa kwa Kaisari
  rationale: Ni usemi sahihi wa kisheria kwa kuomba kesi isikilizwe na Kaisari; jina la cheo lililotumiwa katika Kigiriki limehifadhiwa.
- source_word: οὐχ ὡς
  choice: si kwa sababu
  rationale: Hutoa ufafanuzi wa nia ya Paulo kwa njia ya asili katika Kiswahili.
- source_word: τοῦ ἔθνους μου
  choice: taifa langu
  rationale: Huhifadhi maana ya jumuiya ya kitaifa au kikabila ya Paulo na ladha ya kisheria na hadharani ya sentensi.
- source_word: ἔχων τι κατηγορεῖν
  choice: nilikuwa na jambo lolote la kulishtaki
  rationale: Huwasilisha wazi maana ya kuwa na jambo au msingi wa kutoa shtaka dhidi ya taifa lake.
theological_decisions:
- issue: Rejeo la “Wayahudi” katika usemi unaoweza kueleweka kwa upana wa kikabila au kidini
  choice: Kuhifadhi “Wayahudi” katika matini kuu kama tafsiri ya moja kwa moja ya τῶν Ἰουδαίων.
  alternative: viongozi wa Kiyahudi; Wayudea
  rationale: Kigiriki hakibainishi viongozi pekee wala kutumia jina la kijiografia kwa uwazi. Muktadha unawahusu Wayahudi waliompinga Paulo katika kesi hii, si Wayahudi wote; ufafanuzi huo umewekwa katika tanbihi badala ya kubadili matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “kukata rufaa kwa Kaisari” huhifadhi sajili ya kisheria; “taifa langu” huhifadhi maana ya kijamii na kitaifa ya ἔθνος. Alama za tanbihi zimewekwa baada ya kishazi kinachohusika.
