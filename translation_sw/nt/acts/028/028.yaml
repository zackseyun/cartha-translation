  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: sw
  text: Kwa hiyo, na ijulikane kwenu kwamba wokovu huu wa Mungu umetumwa kwa Mataifa[a]; wao pia watasikiliza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu wasio Wayahudi; kihalisi, “mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Au “watasikia.” Kitenzi cha Kigiriki kinaweza kumaanisha kusikia au kusikiliza na kuitikia, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ... ἔστω ὑμῖν
  choice: na ijulikane kwenu
  rationale: Muundo huu unahifadhi nguvu ya agizo na sauti ya tangazo la wazi, huku ukiwa wa asili katika Kiswahili sanifu.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na mazungumzo yaliyotangulia.
- source_word: τοῖς ἔθνεσιν
  choice: kwa watu wa mataifa
  rationale: Katika muktadha huu, neno hilo linamaanisha watu wasio Wayahudi. Kauli hii ni wazi kwa msomaji wa kawaida na pia huhifadhi taswira ya mataifa.
- source_word: ἀπεστάλη
  choice: umetumwa
  rationale: Kauli tendwa inaonyesha tendo la kutuma lililokamilika lenye umuhimu unaoendelea.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: wokovu huu wa Mungu
  rationale: Neno σωτήριον limetafsiriwa kama wokovu, si ujumbe wa wokovu, ili kutoongeza ufafanuzi usiolazimishwa na Kigiriki. Muundo 'wa Mungu' huhifadhi uwezekano wa kuelewa Mungu kuwa chanzo au mwenye wokovu huo.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: wao pia watasikiliza
  rationale: Kauli hii huhifadhi msisitizo wa αὐτοὶ καί na kuonyesha usikivu wenye mwitikio unaodokezwa na muktadha, bila kudai wazi kwamba wote wataongoka.
theological_decisions:
- issue: Maana ya σωτήριον katika muktadha
  choice: wokovu
  alternative: ujumbe wa wokovu
  rationale: Kigiriki kinataja wokovu wenyewe. Ingawa muktadha unahusu kutangazwa kwake, 'ujumbe wa wokovu' ungeongeza ufafanuzi ambao maandishi hayalazimishi.
- issue: Uhusiano unaoonyeshwa na τοῦ θεοῦ
  choice: wa Mungu
  alternative: utokao kwa Mungu
  rationale: Muundo 'wa Mungu' huhifadhi utata halisi wa genitivi, ambao unaweza kusisitiza chanzo, umiliki, au uhusiano wa karibu na Mungu.
- issue: Nguvu ya ἀκούσονται
  choice: watasikiliza
  alternative: watasikia
  rationale: Muktadha unatofautisha kutokubali kwa baadhi ya wasikilizaji na mwitikio unaotarajiwa kutoka kwa watu wa mataifa. 'Watasikiliza' huonyesha usikivu wa kuitikia bila kuongeza dai la wazi la kuongoka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya tangazo la Paulo lakini kinachoeleweka kwa wasomaji wa kawaida. 'Na ijulikane kwenu' huhifadhi mtindo rasmi wa Kigiriki bila kuwa wa kizamani kupita kiasi.
