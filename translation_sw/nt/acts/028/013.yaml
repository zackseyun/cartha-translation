  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: sw
  text: Kutoka huko, baada ya kuinua nanga[a], tulifika Regio. Baada ya siku moja, upepo wa kusini ulipoanza kuvuma, tulifika Puteoli siku ya pili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuanza safari kwa meli.” Neno la Kigiriki περιελόντες ni la matumizi ya baharini na huenda likamaanisha hasa kuinua nanga au, kwa maana pana zaidi, kuondoka kwa meli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Kutoka huko
  rationale: Ni kiunganishi cha kawaida cha mahali katika simulizi na kinahifadhi maana ya kuondoka mahali palipotajwa.
- source_word: περιελόντες
  choice: baada ya kung'oa nanga
  rationale: Katika muktadha huu wa baharini, kitenzi kinaelekea kumaanisha kuondoa kilichokuwa kimeshikilia meli ili kuanza safari; maana pana zaidi ya kuondoka kwa meli imewekwa katika tanbihi.
- source_word: κατηντήσαμεν
  choice: tukafika
  rationale: Kitenzi kinaonyesha kufika mahali palipokusudiwa; umbo hili ni la kawaida na la mtiririko mzuri katika simulizi la Kiswahili.
- source_word: Ῥήγιον
  choice: Regio
  rationale: Jina la mahali limetoholewa kwa mwandiko unaosomeka kwa kawaida katika Kiswahili.
- source_word: μετὰ μίαν ἡμέραν
  choice: Baada ya siku moja
  rationale: Linahifadhi moja kwa moja usemi wa muda wa Kigiriki bila kuufanya kuwa 'siku iliyofuata,' jambo ambalo lingeweza kuingiliana na δευτεραῖοι.
- source_word: ἐπιγενομένου νότου
  choice: upepo wa kusini ulipovuma
  rationale: Huwasilisha hali inayoambatana ya upepo wa kusini kuanza kutokea kwa Kiswahili cha kawaida na wazi.
- source_word: δευτεραῖοι
  choice: siku ya pili
  rationale: Linahifadhi kwa uwazi taarifa ya Kigiriki kwamba walifika katika siku ya pili.
- source_word: ἤλθομεν
  choice: tukafika
  rationale: Ingawa kimsingi ni kitenzi cha mwendo, pamoja na mahali panapotajwa kinamaanisha kufika huko; 'tukafika' ni ya asili katika Kiswahili.
- source_word: Ποτιόλους
  choice: Putéoli
  rationale: Jina la kale limetoholewa, na alama ya mkazo husaidia kuonyesha matamshi bila kulibadilisha kuwa jina la kisasa la mahali.
