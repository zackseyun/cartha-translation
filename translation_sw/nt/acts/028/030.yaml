lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: akakaa
  rationale: Kitenzi hiki hapa kinaonyesha kuendelea kukaa mahali; “akakaa” ni Kiswahili cha kawaida na cha asili katika muhtasari huu wa simulizi.
- source_word: δὲ
  choice: Naye
  rationale: δὲ ni kiunganishi chepesi kinachoendeleza simulizi, si pingamizi kali; “Naye” kinaunganisha sentensi na kumrejelea Paulo kwa kawaida.
- source_word: διετίαν ὅλην
  choice: miaka miwili mizima
  rationale: Huhifadhi muda wa miaka miwili pamoja na msisitizo wa ὅλην kwamba kipindi hicho kilikuwa kamili.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: katika makao aliyojipangishia
  rationale: μίσθωμα humaanisha mahali pa kuishi palipokodishwa. “Makao aliyojipangishia” ni usemi wa sasa unaoonyesha kwamba yalikuwa makao ya kupanga chini ya mpango wake mwenyewe, bila kudai kwa lazima kwamba yalikuwa nyumba nzima.
- source_word: ἀπεδέχετο
  choice: alikuwa akiwakaribisha
  rationale: Wakati usiotimilifu unaonyesha tendo lililoendelea au lililorudiwa; “alikuwa akiwakaribisha” pia huhifadhi maana ya kuwapokea kwa ukarimu.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: wote walioingia kumwona
  rationale: “Walioingia” huhifadhi wazo la kuingia ndani lililo katika εἰσπορευομένους, huku “kumwona” ikitoa Kiswahili cha kawaida kwa wageni waliomjia katika makao yake.
