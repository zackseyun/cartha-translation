    reason: lexical_alternative
  revision_rationale: The revision preserves the generality of θηρίον, makes the prior action of the participle explicit, and renders the movement into the fire naturally. “Kumtupa motoni” is joined to “kumkung’uta” to express in idiomatic Swahili that the creature was shaken off and sent into the fire, without identifying it as a snake in the main text.
