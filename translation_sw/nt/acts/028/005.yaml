  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: sw
  text: Basi Paulo, baada ya kumkung’uta yule mnyama[a] na kumtupa motoni, hakupata madhara yoyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yule kiumbe” au “yule mnyama wa porini”; neno la Kigiriki ni la jumla, ingawa muktadha unaonyesha kuwa ni nyoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Basi Paulo
  rationale: Kirai hiki kinaendeleza simulizi na artikeli humrejelea Paulo. Kutaja jina lake huweka rejeo wazi na ni jambo la kawaida katika Kiswahili, huku “Basi” ikibeba mpito wa οὖν bila kuzidisha nguvu ya μέν.
- source_word: ἀποτινάξας
  choice: alipomkung’uta
  rationale: Muundo wa “alipo-” unaonyesha kwamba tendo la kumkung’uta mnyama lilitangulia matokeo yaliyoelezwa na kitenzi kikuu. “Kumkung’uta” huwasilisha kitendo cha kumtoa kwa mtikisiko.
- source_word: τὸ θηρίον
  choice: yule mnyama
  rationale: θηρίον ni neno la jumla kwa mnyama, mara nyingi mnyama wa porini. “Mnyama” huhifadhi ujumla wa neno la Kigiriki badala ya kulifanya mahsusi kuwa “nyoka,” ingawa muktadha wa mstari uliotangulia unaonyesha kuwa ni nyoka.
- source_word: εἰς τὸ πῦρ
  choice: ndani ya moto
  rationale: Huwasilisha mwendo unaoelekea motoni unaodokezwa na εἰς pamoja na hali ya kushutumiwa, kwa Kiswahili cha kawaida.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: hakupata madhara yoyote
  rationale: Kauli hii ni ya kawaida na ya asili katika Kiswahili, na huonyesha kwamba hakupata jeraha wala athari mbaya.
