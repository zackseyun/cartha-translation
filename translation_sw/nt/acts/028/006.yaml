id: ACT.28.6
reference: Acts 28:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: sw
  text: Lakini walitarajia kwamba angevimba au angeanguka chini na kufa ghafula. Baada ya kusubiri kwa muda mrefu na kuona kwamba hakuna jambo lolote lisilo la kawaida lililompata[a], walibadili mawazo yao, wakaanza kusema kwamba yeye alikuwa mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba hakuna jambo lolote la ajabu” au “kwamba hakuna jambo lolote lisilofaa” lililompata.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: walitarajia
  rationale: Kitenzi cha wakati uliopita usiotimilika kinaonyesha matarajio yaliyoendelea; “walitarajia” ni cha kawaida na wazi katika Kiswahili.
- source_word: πίμπρασθαι
  choice: angevimba
  rationale: Katika muktadha wa kuumwa na nyoka, neno linaelekea kumaanisha kuvimba kwa mwili badala ya kuwaka kihalisi.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: angeanguka chini na kufa ghafula
  rationale: Kauli hii huhifadhi kuanguka, kifo kilichotarajiwa kuwa matokeo yake, na hali ya kutokea ghafula.
- source_word: ἐπὶ πολὺ
  choice: baada ya kusubiri kwa muda mrefu
  rationale: Muundo huu unawasilisha kwa njia ya asili kipindi kirefu ambacho watu waliendelea kutazama na kutarajia.
- source_word: θεωρούντων
  choice: kuona
  rationale: Ingawa linaweza kumaanisha kutazama kwa makini, hapa matokeo ya uchunguzi huo yanaelezwa kwa kawaida kwa “kuona.”
- source_word: μηδὲν ἄτοπον
  choice: hakuna jambo lolote lisilo la kawaida
  rationale: Huhifadhi upana wa ἄτοπον bila kulifafanua kupita kiasi kuwa jambo lenye madhara tu.
- source_word: μεταβαλόμενοι
  choice: walibadili mawazo yao
  rationale: Hueleza wazi kugeuka kwa mtazamo au hitimisho lao.
- source_word: ἔλεγον
  choice: wakaanza kusema
  rationale: Huwasilisha kwa ufasaha mwanzo wa usemi wao baada ya kubadili mawazo.
- source_word: θεόν
  choice: mungu mmoja
  rationale: Katika mazingira ya kipagani yenye imani ya miungu mingi, jina lisilo na kibainishi linaonyesha mmoja kati ya miungu, si Mungu wa pekee.
theological_decisions:
- issue: Kutafsiri αὐτὸν εἶναι θεόν bila kudokeza kwamba simulizi linakubali Paulo kuwa Mungu
  choice: kwamba yeye ni mungu mmoja
  alternative: kwamba yeye ni Mungu; kwamba alikuwa wa kimungu
  rationale: Simulizi linaripoti hitimisho lao potovu katika mazingira ya imani ya miungu mingi. “Mungu” lingedokeza Mungu wa pekee, huku “wa kimungu” likibadili nomino kuwa sifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. “Ghafula” limetumiwa kama umbo sanifu; “mungu mmoja” linaepusha utata na “Mungu” katika muktadha wa imani ya miungu mingi.
