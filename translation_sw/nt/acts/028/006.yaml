  naturalness: Kiswahili kinaeleweka na kina hadhi inayofaa simulizi. «Kwamba yeye alikuwa mungu» ni mtiririko wa asili zaidi kuliko «kwamba yeye ni mungu mmoja», na huweka wakati wa simulizi sawia na muktadha wa usemi unaoripotiwa.
