  to: Lakini walitarajia kwamba angevimba au angeanguka chini na kufa ghafula. Baada ya kusubiri kwa muda mrefu na kuona kwamba hakuna jambo lolote lisilo la kawaida lililompata[a], walibadili mawazo yao, wakaanza kusema kwamba yeye alikuwa mungu.
