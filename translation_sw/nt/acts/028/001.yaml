  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: sw
  text: Baada ya kuokolewa salama[a], ndipo tukajua kwamba kisiwa hicho kinaitwa Malta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuponyoka salama” au “baada ya kuokoka.” Kitenzi cha Kigiriki kinakazia kuokolewa na kuvushwa salama katika hatari.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, Melitē; kisiwa hiki kimetambuliwa kwa mapokeo na historia kuwa Malta.
    reason: cultural_note
lexical_decisions:
- source_word: διασωθέντες
  choice: baada ya kuokolewa salama
  rationale: Kitenzi hiki katika umbo la wakati uliopita, kauli tendwa, kinaonyesha kuokolewa katika hatari na kufika salama. Tafsiri hii inahifadhi wazo la wokovu dhidi ya hatari bila kulifanya kuwa kuwasili tu ufukoni.
- source_word: τότε
  choice: ndipo
  rationale: Neno hili linaonyesha mfuatano wa matukio. “Ndipo” ni la kawaida katika simulizi na linaunganisha kujua kwao na kuokolewa kwao.
- source_word: ἐπέγνωμεν
  choice: tukajua
  rationale: Katika muktadha huu kitenzi kinamaanisha kupata habari au kufahamu jina la kisiwa. “Tukajua” ni tafsiri ya asili na wazi.
- source_word: Μελίτη
  choice: Malta
  rationale: “Malta” ndilo jina la kawaida la Kiswahili kwa kisiwa kinachotambuliwa kihistoria na Μελίτη.
- source_word: ἡ νῆσος
  choice: kisiwa hicho
  rationale: Kibainishi cha Kigiriki kinarejelea kisiwa walichofika. “Kisiwa hicho” ni cha asili katika Kiswahili na hudumisha rejeo hilo.
- source_word: καλεῖται
  choice: kinaitwa
  rationale: 'Kauli tendwa ya wakati wa sasa imehifadhiwa moja kwa moja: kisiwa hicho bado kinajulikana kwa jina hilo.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. “Kuokolewa salama” huhifadhi kauli tendwa na hatari ya ajali ya meli; “kinaitwa” huhifadhi wakati wa sasa wa Kigiriki badala ya kuubadili kimyakimya kuwa uliopita.
