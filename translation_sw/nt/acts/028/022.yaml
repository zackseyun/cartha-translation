base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: sw
  text: Lakini tunaona inafaa tuyasikie kutoka kwako maoni yako, kwa maana kuhusu dhehebu hili[a] tunajua kwamba linapingwa kila mahali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kundi” au “harakati”; hapa neno la Kigiriki αἵρεσις halimaanishi lazima “uzushi” kwa maana yake ya baadaye ya kitaalamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: tunaona inafaa
  rationale: Katika muktadha huu kitenzi kinaonyesha uamuzi wa adabu kwamba jambo linafaa, si dai lenye nguvu wala tamanio tu.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: kusikia kutoka kwako
  rationale: Muundo huu unasisitiza kwamba wanataka kumsikia Paulo mwenyewe; Kiswahili hiki ni cha kawaida na kinahifadhi maana hiyo.
- source_word: ἃ φρονεῖς
  choice: maoni yako
  rationale: Hapa φρονέω inahusu mtazamo au mawazo ya mtu. ‘Maoni yako’ ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: αἱρέσεως
  choice: dhehebu
  rationale: Katika Matendo neno hili humaanisha kundi au mkondo wa kidini, bila kulazimisha maana ya baadaye ya uzushi wa kimafundisho.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: tunajua
  rationale: Hili ni badiliko la kawaida la kisintaksia katika Kiswahili linalowasilisha wazi maana ya ‘inajulikana kwetu’ bila uzito usio wa asili.
- source_word: πανταχοῦ
  choice: kila mahali
  rationale: Hii inawasilisha kwa njia ya kawaida upeo mpana wa mahali unaomaanishwa na πανταχοῦ.
- source_word: ἀντιλέγεται
  choice: linapingwa
  rationale: Kauli tendwa inadumishwa, na ‘linapingwa’ ni Kiswahili cha kawaida kinachoweza kujumuisha upinzani unaotolewa kwa maneno, ingawa hakilazimishi wazo la kukanusha hoja tu.
theological_decisions:
- issue: Tafsiri ya αἵρεσις
  choice: dhehebu
  alternative: uzushi
  rationale: Hapa neno linaitaja harakati ya Kikristo kama kundi linalotazamwa na watu wa nje, si kosa rasmi la kimafundisho. ‘Uzushi’ lingeingiza maana ya kitaalamu ya baadaye isiyolazimishwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa kawaida bila kupoteza sauti rasmi ya ombi; alama ya tanbihi imewekwa baada ya neno linalohusika moja kwa moja.
