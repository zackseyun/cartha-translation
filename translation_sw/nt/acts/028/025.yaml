  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: sw
  text: 'Nao, kwa kuwa hawakukubaliana wao kwa wao, walikuwa wakiondoka baada ya Paulo kusema neno moja la mwisho[a]: “Roho Mtakatifu alisema kwa usahihi kupitia nabii Isaya kwa baba zenu[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno moja” au “kauli moja.” Kigiriki kinasema kihalisi “neno moja,” ambalo hapa ni tamko la kuhitimisha.
    reason: lexical_alternative
  - marker: b
    text: Au “mababu zenu.” Kigiriki kinasema “baba zenu,” yaani mababu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι ... ὄντες πρὸς ἀλλήλους
  choice: kwa kuwa hawakukubaliana wao kwa wao
  rationale: Kishiriki hiki kinaeleza hali ya kutokubaliana kwao. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi maana ya kutofautiana baina yao.
- source_word: ἀπελύοντο
  choice: wakaanza kuondoka
  rationale: Kauli ya wakati usiotimilika inaonyesha mchakato wa mkutano kuvunjika na watu kuondoka; “wakaanza kuondoka” huwasilisha vizuri hali hiyo.
- source_word: εἰπόντος τοῦ Παύλου
  choice: baada ya Paulo kusema
  rationale: Muundo wa genitive absolute umetafsiriwa kama kishazi cha wakati, huku “kusema” kikilingana na εἰπόντος.
- source_word: ῥῆμα ἓν
  choice: neno moja la mwisho
  rationale: Kihalisi ni “neno moja,” lakini katika muktadha huu ni tamko la kuhitimisha; “la mwisho” huonyesha kazi yake katika mazungumzo.
- source_word: Καλῶς
  choice: kwa usahihi
  rationale: Hapa neno hili linathibitisha kwamba yaliyosemwa yalikuwa sahihi, si tu kwamba yalisemwa kwa namna nzuri.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida na lenye heshima katika Kiswahili kwa rejeo hili la wazi la kiungu.
- source_word: ἐλάλησεν
  choice: alisema
  rationale: Katika Kiswahili, “alisema kupitia” ni usemi wa asili unaofaa kwa ujumbe uliotolewa kwa njia ya nabii.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: kupitia nabii Isaya
  rationale: διά pamoja na jenitivi huonyesha uwakala au njia; “kupitia” huhifadhi wazi kwamba Isaya alikuwa mpatanishi wa ujumbe.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: kwa baba zenu
  rationale: “Baba zenu” huhifadhi neno la kiume πατέρας, huku muktadha ukionyesha kuwa ni mababu wa Israeli.
theological_decisions:
- issue: Rejeo la “baba zenu”
  choice: baba zenu
  alternative: mababu zenu
  rationale: Kigiriki kinasema kihalisi “baba zenu.” Tafsiri hii inadumisha sura ya asili, huku tanbihi ikifafanua maana yake ya mababu wa Israeli.
- issue: Uwakala wa Roho Mtakatifu katika unabii
  choice: Roho Mtakatifu alisema kwa usahihi kupitia nabii Isaya
  alternative: Roho Mtakatifu alinena vyema kwa njia ya nabii Isaya
  rationale: Maneno haya yanahifadhi madai ya wazi kwamba Roho Mtakatifu ndiye aliyesema, na kwamba Isaya alikuwa njia ya usemi huo, bila kuondoa au kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku mchakato unaodokezwa na ἀπελύοντο na uwakala wa Roho Mtakatifu kupitia Isaya vikihifadhiwa.
