base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: sw
  text: Kwa sababu hii basi, niliwaomba nionane nanyi na kuzungumza nanyi, kwa maana ni kwa ajili ya tumaini la Israeli[a] kwamba nimefungwa kwa mnyororo huu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tumaini la Waisraeli”; huenda usemi huu ukarejelea tumaini la agano na la ufufuo analolihubiri Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Kwa sababu hiyo basi
  rationale: Huhifadhi kishazi cha sababu pamoja na kiunganishi cha hitimisho, huku kikiwa cha kawaida katika Kiswahili.
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν
  choice: niliwaomba nije kuwaona
  rationale: Katika muktadha huu Paulo aliomba kukutana na viongozi hao; muundo huu ni wa asili katika Kiswahili na unahifadhi maana ya kuwaona.
- source_word: προσλαλῆσαι
  choice: kuzungumza nanyi
  rationale: Huonyesha mazungumzo pamoja nao badala ya hotuba ya upande mmoja.
- source_word: ἕνεκεν γὰρ
  choice: kwa maana ni kwa ajili ya
  rationale: Huhifadhi uhusiano wa ufafanuzi wa γάρ na sababu inayoonyeshwa na ἕνεκεν.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: tumaini la Israeli
  rationale: Huhifadhi usemi mfupi wa Kigiriki bila kuamua wazi ikiwa ni tumaini la agano, la Masihi, au la ufufuo.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: nimefungwa kwa mnyororo huu
  rationale: Kiswahili cha kawaida hueleza hali ya kifungo kwa namna hii; kinahifadhi mnyororo halisi ingawa hakifuati moja kwa moja taswira ya kitu kinachovaliwa.
theological_decisions:
- issue: Maana ya “tumaini la Israeli”
  choice: tumaini la Israeli
  alternative: tumaini la ufufuo la Israeli; tumaini la Kimasihi la Israeli; tumaini lililoahidiwa Israeli
  rationale: Kigiriki kinaacha usemi huu ukiwa mpana na wenye dokezo. Tafsiri haiubani kwa ufufuo, Masihi, au ahadi za agano pekee.
- issue: Uhusiano wa tumaini na kifungo cha Paulo
  choice: ni kwa ajili ya tumaini la Israeli kwamba nimefungwa
  alternative: ninavaa mnyororo huu kwa ajili ya tumaini la Israeli
  rationale: Uundaji huu unaonyesha wazi kwamba tumaini hilo ndilo sababu ya kifungo chake bila kudai kwamba mnyororo ni pambo analovaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha msisitizo wa sababu katika Kigiriki bila kuwa nzito kupita kiasi.
