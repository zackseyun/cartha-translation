id: ACT.28.27
reference: Acts 28:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: sw
  text: Kwa maana moyo wa watu hawa umekuwa mzito, wamesikia kwa shida kwa masikio yao, nao wamefumba macho yao; la sivyo[a] wangeona kwa macho yao, wakasikia kwa masikio yao, wakaelewa kwa moyo wao, wakageuka[b], nami ningewaponya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasije wakaona kwa macho yao, wakasikia kwa masikio yao, wakaelewa kwa moyo wao, wakageuka, nami nikawaponya.” Kiunganishi cha Kigiriki katika nukuu hii kutoka Isaya kinaweza kuwa na maana yenye nguvu zaidi ya “wasije” au “ili wasije.”
    reason: alternative_reading
  - marker: b
    text: “Kugeuka” pia kunaweza kutafsiriwa “kurudi,” au katika muktadha huu, “kutubu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: umekuwa mzito
  rationale: Kitenzi hiki kihalisi huhusu kuwa mnene au mzito, lakini hapa ni sitiari ya kutokuwa mwepesi wa kuitikia au kuelewa. “Umekuwa mzito” inadumisha sitiari bila kuifafanua kupita kiasi.
- source_word: καρδία
  choice: moyo
  rationale: “Moyo” ni istilahi ya kawaida ya kibiblia kwa kitovu cha ufahamu na mwitikio wa ndani, na inadumisha uhusiano na “wakaelewa kwa moyo wao” baadaye katika aya.
- source_word: βαρέως ἤκουσαν
  choice: wamesikia kwa shida
  rationale: Kirai hiki kina maana ya kusikia kwa uzito au kwa taabu. “Wamesikia kwa shida” ni Kiswahili cha asili kinachowasilisha hali hiyo bila kutumia usemi mgumu “walisikia kwa uzito.”
- source_word: ἐκάμμυσαν
  choice: wamefumba
  rationale: Kitenzi hiki humaanisha kuyafunga macho. “Wamefumba macho yao” ni usemi wa kawaida na unaonyesha wazi kwamba wao ndio waliofanya tendo hilo.
- source_word: μήποτε
  choice: la sivyo
  rationale: “La sivyo” huwasilisha matokeo ambayo yangeweza kutokea, huku tanbihi ikihifadhi maana nyingine yenye nguvu zaidi ya “wasije,” inayoweza kudokeza kusudi au kuzuia.
- source_word: ἐπιστρέψωσιν
  choice: wakageuka
  rationale: “Kugeuka” inadumisha taswira ya kubadili mwelekeo na inaweza kubeba maana ya kumrudia Mungu bila kuifanya moja kwa moja kuwa istilahi finyu zaidi ya “kutubu.”
- source_word: ἰάσομαι
  choice: ningewaponya
  rationale: Katika mtiririko unaoanza na μήποτε, hali ya masharti ya Kiswahili huonyesha kwa kawaida kwamba uponyaji ungefuata kuona, kusikia, kuelewa na kugeuka.
theological_decisions:
- issue: Kusudi la Mungu katika nukuu ya Isaya
  choice: Kutumia “la sivyo” katika matini kuu na kuhifadhi “wasije” katika tanbihi
  alternative: Kutumia “wasije wakaona … nami niwaponye” katika matini kuu
  rationale: Uamuzi huu haumalizi mvutano kati ya hukumu ya Mungu na uwajibikaji wa watu. Matini kuu inasomeka kwa kawaida, na tanbihi inadumisha uwezekano wa maana yenye nguvu zaidi ya kusudi au kuzuia.
- issue: Maana ya ἐπιστρέψωσιν
  choice: wakageuka
  alternative: wakarudi; wakatubu
  rationale: “Wakageuka” huhifadhi sitiari ya kubadili mwelekeo na maana inayohusiana na kumrudia Mungu, bila kuingiza ufafanuzi wa kimadhehebu ambao kitenzi chenyewe haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi wa nukuu umehifadhiwa kwa kurudia “kwa macho yao,” “kwa masikio yao,” na “kwa moyo wao.”
