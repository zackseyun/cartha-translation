  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: sw
  text: ambao, baada ya kunichunguza, walitaka kuniachia huru, kwa sababu hakukuwa na msingi wowote wa kunihukumu kifo katika kesi yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu hawakuona shtaka lolote dhidi yangu lililostahili kifo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ambao
  rationale: Kiwakilishi cha kawaida cha uhusiano kinafaa katika mfululizo wa simulizi; hapa uzito wa maana ya ὅστις hauhitaji kuongezwa kwa maneno kama ‘hao ndio ambao’.
- source_word: ἀνακρίναντές με
  choice: baada ya kunichunguza
  rationale: Kauli hii inaonyesha tendo lililotangulia tendo kuu na ina muktadha wa uchunguzi wa kisheria; ‘kunichunguza’ ni ya kawaida na haibani maana kuwa mahojiano pekee.
- source_word: ἐβούλοντο
  choice: walitaka
  rationale: Hutoa kwa lugha ya kawaida nia yao ya wakati uliopita bila kuongeza wazo la uamuzi rasmi ambalo kitenzi chenyewe hakilazimishi.
- source_word: ἀπολῦσαι
  choice: kuniachia huru
  rationale: Katika muktadha wa mtu aliye kizuizini, usemi huu unaeleza kuondolewa kifungoni kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: kwa sababu ... hawakuona
  rationale: Muundo wenye διά unaonyesha sababu. Ingawa ὑπάρχειν kihalisi ni ‘kuwapo,’ ‘hawakuona’ huunganisha kwa kawaida matokeo ya uchunguzi na kutokuwapo kwa msingi wa hukumu bila kubadili hoja.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: hawakuona sababu yoyote ya kunihukumu kifo
  rationale: αἰτία inaweza kumaanisha sababu au shtaka katika muktadha wa mahakama. Matini kuu inatumia ‘sababu’ na kueleza θανάτου kwa njia ya kawaida kama hukumu ya kifo; uwezekano wa ‘shtaka linalostahili kifo’ umehifadhiwa katika tanbihi.
- source_word: ἐν ἐμοί
  choice: katika kesi yangu
  rationale: Hii huwasilisha maana ya kimahakama ya ‘kuhusiana nami’ kwa Kiswahili cha kawaida, bila kudokeza kwamba Paulo anazungumzia hali yake ya ndani.
