id: ACT.28.11
reference: Acts 28:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: sw
  text: Baada ya miezi mitatu, tulianza safari kwa meli ya Aleksandria iliyokuwa imepitisha majira ya baridi kisiwani, yenye alama ya Dioskuroi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dioskuroi ni Kastori na Poluksi, wana mapacha wa Zeu katika hekaya za Kigiriki na Kirumi.
    reason: Ufafanuzi wa jina la kimytholojia lisilofahamika kwa wasomaji wengi.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Baada ya miezi mitatu
  rationale: μετά pamoja na hali ya kushutumiwa huonyesha wakati baada ya kipindi fulani; δέ ni kiunganishi chepesi ambacho si lazima kitafsiriwe wazi katika Kiswahili.
- source_word: ἀνήχθημεν
  choice: tulianza safari baharini
  rationale: Katika muktadha wa usafiri wa majini, ἀνάγω humaanisha kuondoka na kuingia baharini. Kauli hii ni ya kawaida na haiongezi wazo mahsusi la kung'oa nanga ambalo halijasemwa moja kwa moja.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: kwa meli kutoka Aleksandria
  rationale: πλοῖον ni meli, na Ἀλεξανδρῖνος hapa huonyesha asili au uhusiano wake na Aleksandria. 'Kutoka Aleksandria' ni wazi na ya asili kwa wasomaji wa Kiswahili.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: iliyokuwa imetumia majira ya baridi kisiwani
  rationale: Kauli timilifu ya παραχειμάζω huonyesha kwamba meli ilikuwa imekaa hapo wakati wote wa majira ya baridi; 'kisiwani' hutafsiri ἐν τῇ νήσῳ kwa Kiswahili cha kawaida.
- source_word: παρασήμῳ
  choice: ilikuwa na alama ya
  rationale: παράσημος huonyesha alama bainifu, nembo, au sanamu ya utambulisho wa meli. 'Alama' huhifadhi upana wa maana bila kudai kwa uhakika kwamba ilikuwa sanamu ya mbele ya meli.
- source_word: Διοσκούροις
  choice: Dioskuroi
  rationale: Hili ni jina la Kigiriki la wale mapacha wa kimytholojia. Kutumia jina lenyewe huhifadhi rejeo la asili, huku tanbihi ikilifafanua kwa msomaji wa sasa.
theological_decisions:
- issue: Kutafsiri alama ya kipagani Διοσκούροις
  choice: alama ya Dioskuroi
  alternative: alama ya miungu pacha; alama ya Kastori na Poluksi
  rationale: Aya inaripoti tu alama ya kidini ya meli bila kuikubali wala kuikataa. Jina la asili huepuka kuongeza tafsiri ya kwamba kwa kweli walikuwa miungu, na tanbihi hutoa ufafanuzi wa kimytholojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili kuepuka mlolongo mzito wa vivumishi, huku uhusiano wa kisarufi na maana ya Kigiriki ukihifadhiwa.
