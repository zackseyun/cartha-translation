  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: sw
  text: 'Kwa maana nilipokuwa nikipita na kutazama kwa makini vitu mnavyoviabudu, niliona hata madhabahu yenye maandishi haya: “Kwa mungu asiyejulikana.” Basi, kile mnachokiabudu bila kukijua[a], ndicho ninachowatangazia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeye mnayemwabudu bila kumjua.” Hata hivyo, Kigiriki kimetumia kiwakilishi kisicho cha nafsi, yaani “kile,” wala si “yeye.”
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: nilipokuwa nikipita
  rationale: Kirai cha wakati chenye hali endelevu kinaonyesha Paulo alipokuwa akipita katika mji.
- source_word: ἀναθεωρῶν
  choice: kutazama kwa makini
  rationale: Kitenzi kina maana ya kuangalia kwa uangalifu, si kuona kijuujuu tu.
- source_word: σεβάσματα
  choice: vitu mnavyoviabudu
  rationale: Neno hili ni pana na linahusu vitu vya kidini vinavyoheshimiwa au kuabudiwa; tafsiri hii haibani maana kuwa mahekalu au sanamu pekee.
- source_word: βωμὸν
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali pa kutolea dhabihu katika muktadha huu.
- source_word: ἐπεγέγραπτο
  choice: iliyoandikwa
  rationale: Huonyesha maandishi yaliyowekwa juu ya madhabahu; Kiswahili cha kawaida hakihitaji kubainisha hali timilifu ya kabla kwa umbo zito zaidi.
- source_word: Ἀγνώστῳ θεῷ
  choice: KWA MUNGU ASIYEJULIKANA
  rationale: Muundo wa Kigiriki hauna kibainishi. Kiswahili kwa kawaida hakilazimishi uchaguzi wa wazi kati ya ‘mungu fulani asiyejulikana’ na ‘yule Mungu asiyejulikana,’ hivyo inadumisha kiasi cha utata wa asili.
- source_word: ὃ οὖν
  choice: Basi, kile
  rationale: ‘Kile’ huhifadhi umbo lisilo la nafsi la kiwakilishi cha Kigiriki, na ‘basi’ huonyesha hitimisho au mpito wa οὖν.
- source_word: ἀγνοοῦντες
  choice: bila kukijua
  rationale: Huonyesha namna ya ibada yao na kudumisha mwangwi wa wazo la kutokujulikana katika maandishi ya madhabahu.
- source_word: εὐσεβεῖτε
  choice: mnachokiabudu
  rationale: Katika muktadha wa kujitoa kidini, ‘kuabudu’ ni wazi na ya kawaida, ingawa kitenzi kinaweza pia kumaanisha kuheshimu kwa uchaji.
- source_word: καταγγέλλω
  choice: ninachowatangazia
  rationale: Huonyesha tangazo la hadharani lenye uzito, na kiambishi ‘-cho-’ kinaunganisha tangazo na ‘kile’ bila kubadili rejeo kuwa la nafsi.
theological_decisions:
- issue: Rejeo la kiwakilishi kisicho cha nafsi ὃ
  choice: kile mnachokiabudu bila kukijua
  alternative: yeye mnayemwabudu bila kumjua
  rationale: Kigiriki kimetumia kiwakilishi cha umoja kisicho cha nafsi. Tafsiri iliyochaguliwa inahifadhi muundo huo na mvutano wa usemi wa Paulo badala ya kugeuza rejeo moja kwa moja kuwa mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘kutazama kwa makini’ kudhihirisha uchunguzi wa Paulo, na ‘vitu mnavyoviabudu’ kuhifadhi upana wa σεβάσματα. Herufi kubwa katika maandishi ya madhabahu zinaonyesha kwamba ni nukuu ya maandishi, bila kuongeza tafsiri ya kimadhehebu.
