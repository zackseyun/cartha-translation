id: ACT.17.20
reference: Acts 17:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: sw
  text: Kwa maana unaleta masikioni mwetu mambo fulani yasiyo ya kawaida.[a] Kwa hiyo, tunataka kujua mambo haya yanamaanisha nini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo fulani ya kigeni” au “mambo fulani tusiyoyafahamu.” Neno la Kigiriki linaweza kutaja jambo linaloonekana geni kwa sababu ni jipya au limetoka nje ya mazingira ya msikilizaji.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mambo haya yanataka kuwa nini,” nahau yenye maana ya “mambo haya yanamaanisha nini” au “yana umuhimu gani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα
  choice: yasiyo ya kawaida
  rationale: Katika muktadha huu neno hilo linaeleza mambo ambayo wasikilizaji hawakuyazoea. Kauli hii ni ya kawaida katika Kiswahili na haiongezi wazo la kushangaza kupita kiasi.
- source_word: τινα
  choice: mambo fulani
  rationale: Inadumisha hali ya kutotaja mambo hayo kwa upekee na inapatana kisarufi na kirai kinachoielezea.
- source_word: εἰσφέρεις
  choice: unaleta
  rationale: Wakati uliopo unaonyesha tendo linaloendelea, huku kitenzi hiki kikihifadhi picha ya kuleta jambo kwa wasikilizaji.
- source_word: εἰς τὰς ἀκοὰς ἡμῶν
  choice: masikioni mwetu
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi picha halisi ya masikio na kueleweka kuwa ni mambo wanayosikia.
- source_word: βουλόμεθα
  choice: tunataka
  rationale: Ni tafsiri ya moja kwa moja, ya sasa, na ya kawaida ya nia yao ya kujua.
- source_word: γνῶναι
  choice: kujua
  rationale: Inaeleza moja kwa moja kusudi la matakwa yao bila kuongeza wazo lisilokuwamo la uchunguzi rasmi.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: mambo haya yanamaanisha nini
  rationale: Kirai cha Kigiriki ni nahau inayouliza maana au umuhimu wa mambo hayo; tafsiri hii ni wazi na ya asili katika Kiswahili.
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inatoa sababu ya ombi lililotangulia.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na ukweli kwamba mambo hayo ni mageni kwa wasikilizaji.
