  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: sw
  text: Basi Paulo, akiwa amesimama katikati ya Areopago, alisema, “Enyi wanaume wa Athene, ninaona kwamba kwa kila namna ninyi ni watu wa dini sana[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye ushirikina kupita kiasi” au “wenye dini zaidi.” Neno la Kigiriki linaweza kueleweka kwa maana hasi au chanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: akiwa amesimama
  rationale: Kirai hiki cha hali kinaweka mazingira ya hotuba na kuhifadhi maana ya Paulo kuwa amesimama bila kufanya mtiririko wa Kiswahili kuwa mzito.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ ni kiunganishi chepesi cha kuendeleza simulizi; “Basi” huleta mpito wa kawaida katika Kiswahili.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: katikati ya Areopago
  rationale: Huhifadhi maana ya mahali iliyo wazi katika Kigiriki bila kuamua kimfasiri kwamba Paulo alikuwa mbele ya baraza pekee.
- source_word: Ἀρείου Πάγου
  choice: Areopago
  rationale: Jina limetoholewa moja kwa moja kutoka Kigiriki kwa tahajia na matamshi yanayofaa Kiswahili, badala ya kutumia jina la Kilatini “Kilima cha Mars.”
- source_word: ἔφη
  choice: alisema
  rationale: Kitenzi hiki hutanguliza maneno ya msemaji; “alisema” ni cha kawaida na wazi katika simulizi la Kiswahili.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Enyi wanaume wa Athene
  rationale: Huhifadhi mwito rasmi na nomino ya kiume ἄνδρες, pamoja na uhusiano wao na mji wa Athene.
- source_word: κατὰ πάντα
  choice: kwa kila namna
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi upana wa uchunguzi wa Paulo, yaani “kwa kila hali” au “katika kila jambo.”
- source_word: ὡς
  choice: kwamba
  rationale: Hapa ὡς hutambulisha yaliyomo katika uchunguzi wa Paulo; “kwamba” huunganisha sentensi kwa kawaida katika Kiswahili.
- source_word: δεισιδαιμονεστέρους
  choice: watu wa dini sana
  rationale: Neno hili linaweza kuonyesha kujishughulisha sana na dini kwa mtazamo chanya au hasi. Usemi huu wa matini kuu unabaki wa kiasi na wa kawaida, huku uwezekano wa maana hasi na maana ya ulinganisho ukihifadhiwa katika tanbihi.
- source_word: θεωρῶ
  choice: ninaona
  rationale: Hutoa maana ya kutazama na kutambua kwa lugha rahisi, ya sasa, na inayofaa hotuba.
theological_decisions:
- issue: Toni ya maelezo ya Paulo kuhusu dini ya Waathene katika δεισιδαιμονεστέρους
  choice: watu wa dini sana
  alternative: washirikina mno; wenye dini zaidi
  rationale: Neno la Kigiriki linaweza kuwa la staha au la lawama, na huenda Paulo alilitumia kwa makusudi ya balagha. Matini kuu haitangulizi hukumu hasi isiyo na uhakika, na tanbihi huhifadhi maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa hotuba ni wazi kwa msomaji wa kawaida; jina “Areopago” limetoholewa, na utata halisi wa δεισιδαιμονεστέρους umehifadhiwa kwa tanbihi.
