  rationale: Hapa neno hili linaunganisha simulizi na kuhitimisha tukio kwa maana ya ‘basi/hivyo’; ‘Basi’ ni ya kawaida na ya heshima katika Kiswahili cha simulizi.
- source_word: ὁ Παῦλος
  choice: Paulo
  rationale: Jina limetolewa kwa umbo la kawaida katika mapokeo ya Biblia ya Kiswahili.
- source_word: ἐξῆλθεν
  choice: akaondoka
  rationale: Kitenzi kinaweza kumaanisha kwenda nje au kuondoka; katika muktadha huu ‘akaondoka’ huonyesha tendo la kuondoka kwa Paulo kwa Kiswahili cha kawaida.
- source_word: ἐκ μέσου αὐτῶν
  choice: kati yao
  rationale: Kirai hiki humaanisha kuondoka kutoka katikati ya kundi; ‘kati yao’ kinahifadhi picha hiyo kwa lugha fupi na ya asili.
