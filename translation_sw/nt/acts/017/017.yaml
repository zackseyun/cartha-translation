base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: sw
  text: Kwa hiyo, alikuwa akijadiliana katika sinagogi na Wayahudi na wale wanaomwabudu Mungu[a], na sokoni kila siku na watu waliotokea kuwapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliomcha Mungu,” yaani watu wasio Wayahudi waliohusishwa na ibada ya Kiyahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελέγετο
  choice: alikuwa akijadiliana
  rationale: Muundo wa wakati usiotimilika unaonyesha tendo lililoendelea au kurudiwa; ‘akijadiliana’ huhifadhi wazo la mazungumzo yenye hoja bila kulifanya lazima kuwa mabishano makali.
- source_word: μὲν οὖν
  choice: Kwa hiyo
  rationale: Huendeleza simulizi huku ukionyesha uhusiano na yaliyotangulia; ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: συναγωγῇ
  choice: sinagogi
  rationale: Hapa ni mahali na taasisi ya ibada ya Kiyahudi, hivyo istilahi iliyozoeleka ‘sinagogi’ inafaa.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Katika muktadha huu inarejelea watu wa jamii ya Kiyahudi waliokuwa sinagogini, si wakazi wa Uyahudi pekee.
- source_word: τοῖς σεβομένοις
  choice: wale waliomwabudu Mungu
  rationale: Kauli hii inaeleweka kwa wasomaji wa sasa na inaonyesha watu wasio Wayahudi waliohusishwa na ibada ya Kiyahudi; ‘Mungu’ imedokezwa na matumizi na muktadha wa Matendo.
- source_word: ἀγορᾷ
  choice: sokoni
  rationale: ‘Soko’ ni tafsiri ya kawaida, huku tanbihi ikifafanua kwamba agora pia lilikuwa eneo la wazi la shughuli za kiraia na mikusanyiko.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: kila siku
  rationale: Hutoa kwa ufupi maana ya kurudiwa kila siku.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: na watu waliokuwapo huko wakati huo
  rationale: Huhifadhi maana pana ya watu aliowakuta au waliotokea kuwapo, bila kuibana kuwa wapita-njia pekee.
