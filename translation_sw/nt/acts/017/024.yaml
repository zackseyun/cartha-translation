  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: sw
  text: Mungu aliyeumba ulimwengu na vyote vilivyomo ndani yake, akiwa Bwana wa mbingu na dunia, hakai katika mahekalu yaliyotengenezwa kwa mikono ya wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana nyingine, “mahekalu yaliyofanywa kwa mikono.” Kirai hiki kinamaanisha mahekalu yaliyojengwa na wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: aliyeumba
  rationale: Kirai hiki cha Kiswahili ni cha asili na huonyesha tendo la Mungu la kuufanya ulimwengu; “umba” linafaa katika muktadha wa uumbaji bila kubadili maana ya ποιέω.
- source_word: κόσμον
  choice: ulimwengu
  rationale: Hapa neno hili linamaanisha ulimwengu ulioumbwa kwa ujumla; “ulimwengu” ni neno la kawaida na lenye upana unaofaa.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: vyote vilivyomo ndani yake
  rationale: Huhifadhi msisitizo wa ujumla wa πάντα na kurejelea wazi kila kilichomo ulimwenguni.
- source_word: ὑπάρχων κύριος
  choice: akiwa Bwana
  rationale: Huhifadhi muundo wa hali unaoeleza kwamba Mungu ni Bwana, bila kuifanya kauli hiyo kuwa sababu kwa kuongeza “kwa kuwa.”
- source_word: κύριος
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la Kiswahili linaloonyesha mamlaka na enzi katika muktadha huu.
- source_word: οὐρανοῦ καὶ γῆς
  choice: wa mbingu na dunia
  rationale: Hiki ni jozi ya kawaida katika Kiswahili na viambishi vinaonyesha utegemezi wake kwa “Bwana.”
- source_word: χειροποιήτοις
  choice: yaliyotengenezwa kwa mikono ya wanadamu
  rationale: Neno la Kigiriki humaanisha yaliyofanywa kwa mikono; kutaja “wanadamu” huweka wazi maana inayokusudiwa na huepuka kauli isiyo ya kawaida ya “kwa mikono” peke yake.
- source_word: ναοῖς
  choice: mahekalu
  rationale: “Mahekalu” hurejelea majengo matakatifu yanayodhaniwa kuwa makao ya miungu na linafaa katika mazingira ya Athene.
- source_word: κατοικεῖ
  choice: hakai
  rationale: “Hakai” ni Kiswahili cha sasa na cha kawaida kinachoonyesha kukaa au kuishi mahali, na huhifadhi utofautishaji wa makao ya hekalu.
theological_decisions:
- issue: Ukuu wa Mungu kupita uumbaji dhidi ya kumwekea makao katika hekalu
  choice: Muumba na Bwana wa mbingu na dunia hakai katika mahekalu yaliyotengenezwa na wanadamu.
  alternative: Mungu hafungwi au hazuiliwi ndani ya mahekalu.
  rationale: Tafsiri inahifadhi dai la moja kwa moja la maandiko bila kulipanua kuwa ufafanuzi wa kitheolojia kwamba Mungu “hafungwi,” ingawa wazo hilo linaweza kueleweka kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. Muundo “akiwa Bwana” umeachwa ili kuhifadhi kutokuwa wazi kama kirai hicho ni cha sababu au ni maelezo ya hali. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
