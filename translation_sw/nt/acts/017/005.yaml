source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: sw
  text: Lakini Wayahudi waliingiwa na wivu, wakawachukua wanaume waovu kadhaa kutoka sokoni, wakakusanya umati, na wakaufanya mji uwe na fujo. Wakafika nyumbani kwa Yasoni na kutafuta kuwatoa hao ili kuwapeleka mbele ya kusanyiko la wananchi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanyiko la hadhara” au “mbele ya wananchi.” Neno la Kigiriki δῆμος linamaanisha jumuiya ya kiraia iliyokusanyika hadharani, si umati usio maalumu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: wakawa na wivu
  rationale: Huwasilisha wivu kama kichocheo kilichotangulia matendo yao, kwa lugha ya kawaida ya Kiswahili.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hufuata moja kwa moja neno la Kigiriki bila kulibana kuwa viongozi wala kulipanua; muktadha unaonyesha ni kundi fulani la Wayahudi wa Thesalonike.
- source_word: προσλαβόμενοι
  choice: wakawachukua
  rationale: Hutoa maana ya kuwavuta au kuwachukua watu wengine waungane nao bila kudokeza wazi kuwa waliwaajiri.
- source_word: τῶν ἀγοραίων
  choice: kutoka sokoni
  rationale: Hutaja uhusiano wao na eneo la soko/agora bila kuongeza wazo lisilo wazi la uzururaji.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: baadhi ya watu waovu
  rationale: Huhifadhi sifa hasi ya kimaadili ya πονηρούς kwa Kiswahili cha kawaida; muktadha unaonyesha walikuwa wanaume.
- source_word: ὀχλοποιήσαντες
  choice: wakakusanya genge
  rationale: “Genge” huonyesha umati uliokusanywa kwa kusudi la uhasama na fujo, si mkusanyiko wa kawaida.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: na kuleta fujo mjini
  rationale: Huwasilisha vurugu iliyoathiri mji mzima kwa usemi wa asili na wenye nguvu.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: wakafika nyumbani kwa Yasoni
  rationale: Hufuata maana ya kufika au kuja mahali hapo bila kuongeza dai la wazi kwamba waliishambulia nyumba.
- source_word: ἐζήτουν
  choice: kujaribu
  rationale: Katika muundo huu pamoja na kitenzi-jina, neno linaonyesha jitihada au nia inayoendelea.
- source_word: αὐτοὺς
  choice: wao
  rationale: Huhifadhi kiwakilishi cha chanzo badala ya kuwataja Paulo na Sila kwa ufafanuzi wa mfasiri.
- source_word: προαγαγεῖν
  choice: kuwatoa ili wawapeleke mbele
  rationale: Huunganisha maana ya kuwatoa nyumbani na kuwafikisha mbele ya chombo cha hadhara.
- source_word: εἰς τὸν δῆμον
  choice: mbele ya kusanyiko la wananchi
  rationale: Huhifadhi dhana ya jumuiya ya kiraia iliyokusanyika, si umati wa kawaida tu.
theological_decisions:
- issue: Tafsiri ya οἱ Ἰουδαῖοι katika simulizi la mgogoro
  choice: Wayahudi
  alternative: viongozi wa Kiyahudi; Wayudea
  rationale: Neno la chanzo halisemi “viongozi.” Muktadha unazuia kulielewa kama dai kuhusu Wayahudi wote kila mahali, lakini matini kuu haipaswi kubadili jina la kundi lililotumiwa na mwandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa mara mbili kwa usomaji rahisi huku mfuatano wa vitendo na nguvu ya simulizi vikihifadhiwa.
