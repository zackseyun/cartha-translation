    issue: “baadhi ya watu waovu”
    rationale: ἄνδρας τινὰς πονηρούς hutaja wanaume fulani waovu. Ingawa “watu” inaweza kutumika kijumla, hapa “wanaume” huhifadhi tofauti ya msamiati wa chanzo bila kufanya Kiswahili kisiwe cha asili.
  - severity: medium
    issue: “wakakusanya genge”
    rationale: ὀχλοποιήσαντες maana yake ni kutengeneza au kukusanya umati, kwa muktadha wa ghasia. “Genge” mara nyingi hudokeza kikundi kidogo, kilichofungamana, na hivyo si sawia kabisa na ὄχλος.
  - severity: low
    issue: “Kisha”
    rationale: Neno hili huweka hatua ya wakati iliyo wazi zaidi kuliko muundo wa participle wa Kigiriki. Kuondolewa kwake huacha uhusiano wa simulizi bila kuongezea mpangilio usioelezwa.
