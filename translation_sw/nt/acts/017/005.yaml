  source_fidelity: 'Rasimu kwa ujumla hufuata mfuatano na maana ya Kigiriki vizuri: Wayahudi wanaongozwa na wivu, wanajumuisha watu waovu wa sokoni, wanatengeneza umati, wanaufanya mji uwe na fujo, na wanatafuta kuwatoa hao watu mbele ya kusanyiko la kiraia. Hata hivyo, “baadhi ya watu waovu” hupoteza bayana kwamba ἄνδρας ni wanaume, na “genge” huelekea kumaanisha kundi dogo lililopangwa badala ya umati/mob. Marekebisho yanahifadhi kiwakilishi “hao” bila kuwataja Paulo na Sila.'
