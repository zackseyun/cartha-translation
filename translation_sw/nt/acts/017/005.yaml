  terminology: “Wayahudi,” “Yasoni,” na “kusanyiko la wananchi” zinafaa. Tanbihi inaeleza δῆμος vizuri na kwa usawa; “kusanyiko la wananchi” huhifadhi maana ya chombo/jumuiya ya kiraia iliyokusanyika, badala ya umati wa jumla.
