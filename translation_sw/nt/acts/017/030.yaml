  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: sw
  text: Basi, zamani zile za kutojua Mungu alizivumilia[a], lakini sasa anawaamuru watu wote kila mahali watubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alizipuuza” au “alizipita.” Maana hapa ni kwamba Mungu alistahimili nyakati hizo za kutojua; si kwamba alizikubali.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους
  choice: Kwa hiyo ... yale majira
  rationale: “Kwa hiyo” linaonyesha mpito wa οὖν, na “yale majira” ni Kiswahili cha kawaida kinachodumisha tofauti kati ya wakati uliopita na sasa.
- source_word: τῆς ἀγνοίας
  choice: ya kutojua
  rationale: Huhifadhi maana ya ἄγνοια bila kuongeza wazi kitu kilichokuwa hakijulikani, ingawa muktadha unahusu kutomjua Mungu.
- source_word: ὑπεριδὼν
  choice: baada ya ... kuyavumilia
  rationale: Katika muktadha huu, ὑπεροράω huonyesha Mungu kustahimili majira hayo bila kutoa hukumu mara moja; “kuyavumilia” huepuka kudokeza kwamba Mungu aliyakubali au hakuyajali.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni mtendaji wa kitenzi katika sentensi.
- source_word: τὰ νῦν
  choice: sasa
  rationale: Hudumisha tofauti ya wazi ya wakati kati ya majira ya zamani na hali ya sasa.
- source_word: παραγγέλλει
  choice: anawaamuru
  rationale: Huwasilisha nguvu ya agizo la kimungu iliyo katika παραγγέλλω.
- source_word: τοῖς ἀνθρώποις πάντας
  choice: watu wote
  rationale: ἄνθρωποι limetumiwa kwa maana jumuishi ya wanadamu, na πάντας husisitiza kwamba hakuna anayetengwa.
- source_word: πανταχοῦ
  choice: kila mahali
  rationale: Ni tafsiri ya kawaida na sahihi ya wigo wa mahali unaoonyeshwa na πανταχοῦ.
- source_word: μετανοεῖν
  choice: watubu
  rationale: “Kutubu” ni istilahi ya kawaida ya Kiswahili inayohifadhi kwa pamoja badiliko la nia na kugeuka kwa mwenendo, bila kuipunguza maana kuwa badiliko la fikira pekee.
theological_decisions:
- issue: Maana ya tendo la Mungu kwa “majira ya kutojua”
  choice: Mungu aliyavumilia majira hayo, yaani hakutoa hukumu mara moja, bila kuyakubali.
  alternative: Mungu aliyapuuza au aliyahesabu kuwa hayana hatia.
  rationale: ὑπεριδών huonyesha ustahimilivu wa Mungu katika historia, huku agizo la sasa la kutubu likidumisha uwajibikaji wa kimaadili.
- issue: Wigo wa agizo la kutubu
  choice: Agizo linawahusu watu wote kila mahali.
  alternative: Agizo linawahusu wanaume tu au watu wa mataifa tu.
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ ina wigo wa jumla wa wanadamu; tafsiri haipaswi kuubana bila msingi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa Biblia, huku “baada ya” likionyesha kishirikishi cha Kigiriki kwa uwazi na “watubu” likihifadhi uzito wa agizo.
