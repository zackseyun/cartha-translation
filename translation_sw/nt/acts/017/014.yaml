  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: sw
  text: Ndipo ndugu[a] wakamtuma Paulo mara moja aende mpaka baharini[b], lakini Sila na Timotheo wote wawili wakabaki huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike”; Kigiriki kinasema “ndugu,” neno linaloweza kuwataja waamini kwa pamoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenda baharini” au “kuelekea baharini”; maneno ya Kigiriki yanaweza kumaanisha mwendo hadi pwani bila kueleza zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: mara moja
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba hatua ilichukuliwa bila kuchelewa.
- source_word: δὲ τότε
  choice: Ndipo
  rationale: Huonyesha mwendelezo wa wakati katika simulizi bila kulazimisha tafsiri tofauti kwa kila chembe ya Kigiriki.
- source_word: ἐξαπέστειλαν
  choice: wakamsafirisha
  rationale: Katika muktadha huu, kitenzi kinaonyesha kwamba waamini walihakikisha Paulo anaondoka na kuelekea salama mbali na mahali hapo; 'wakamsafirisha' ni ya asili zaidi kuliko 'wakamtuma aondoke' huku ikibaki karibu na maana ya kumpeleka.
- source_word: οἱ ἀδελφοὶ
  choice: ndugu
  rationale: Huhifadhi istilahi ya ujamaa ya Kigiriki. Katika Kiswahili, 'ndugu' inaweza kwa kawaida kuwahusu waamini wa kiume na wa kike kwa pamoja, hivyo haihitaji kuongeza 'wa kiume na wa kike' katika matini.
- source_word: πορεύεσθαι
  choice: aende
  rationale: Ni tafsiri rahisi na ya kawaida ya kitenzi cha kwenda katika muundo huu wa kusudi.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: mpaka baharini
  rationale: Huhifadhi wazo la mwendo hadi pwani bila kuamua kama Paulo aliendelea na safari kwa meli; pia ni Kiswahili cha asili.
- source_word: ὑπέμεινάν
  choice: wakabaki
  rationale: Katika muktadha huu maana ni kuendelea kuwapo mahali pale, si kuvumilia mateso.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Sila na Timotheo wote wawili
  rationale: Huwasilisha msisitizo wa muundo wa Kigiriki τε ... καὶ kwamba watu hao wawili kwa pamoja walibaki.
- source_word: ἐκεῖ
  choice: huko
  rationale: Ni kielezi cha mahali cha kawaida kinachorejelea eneo lililotajwa katika simulizi.
theological_decisions:
- issue: Maana ya ἀδελφοί kwa jumuiya ya waamini
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waamini
  rationale: '''Ndugu'' hufuata umbo la chanzo na, katika matumizi ya kawaida ya Kiswahili, linaweza kuwakusanya waamini wote bila kuamua kwamba wanaume pekee ndio waliokusudiwa.'
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye staha. Mpangilio wa alama [b][a] katika matini unafuata mahali ambapo kila tanbihi inahusika: [b] baada ya kifungu cha bahari na [a] baada ya neno ''ndugu'' kwa njia ya kurejesha alama karibu na neno lake; hata hivyo, kwa uwazi wa uchapishaji, alama [a] ingewekwa moja kwa moja baada ya ''ndugu''.'
