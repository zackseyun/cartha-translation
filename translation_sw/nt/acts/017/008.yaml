  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: sw
  text: Nao wakawatia wasiwasi umati na maofisa wa jiji waliposikia mambo hayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “wapolitarki,” cheo cha wenye mamlaka za kiraia katika Makedonia.
