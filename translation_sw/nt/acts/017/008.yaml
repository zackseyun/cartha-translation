lexical_decisions:
- source_word: ἐτάραξαν
  choice: wakautia wasiwasi
  rationale: Kitenzi ταράσσω hapa kinaonyesha kusababisha hali ya kutotulia, kufadhaika, au taharuki. ‘Wakautia wasiwasi’ ni Kiswahili cha kawaida kinachoweza kutumika kwa umati na maofisa bila kuzidisha maana kuwa fujo kamili.
- source_word: δὲ
  choice: Nao
  rationale: δέ ni kiunganishi chepesi kinachoendeleza simulizi; ‘Nao’ huunganisha kwa kawaida na kurejelea wahusika waliotajwa katika muktadha uliotangulia.
- source_word: ὄχλον
  choice: umati
  rationale: ὄχλος humaanisha mkusanyiko wa watu. ‘Umati’ ni neno la kawaida na lisiloingiza lazima wazo la kundi lenye vurugu.
- source_word: πολιτάρχας
  choice: maofisa wa jiji
  rationale: πολιτάρχης lilikuwa jina la cheo cha kiraia huko Makedonia. ‘Maofisa wa jiji’ linaeleza kazi yao kwa msomaji wa kisasa bila kulifanya cheo hicho kuwa hasa cha kimahakama.
- source_word: ἀκούοντας ταῦτα
  choice: waliposikia mambo hayo
  rationale: Kirai shirikishi cha wakati kinawahusu umati na maofisa wa jiji. ‘Waliposikia mambo hayo’ ni cha asili katika Kiswahili na kinahifadhi wingi wa ταῦτα.
