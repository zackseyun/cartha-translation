  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: sw
  text: Mara moja, ndugu hao waliwatuma Paulo na Sila waende Beroya wakati wa usiku[b]. Walipofika huko, wakaenda katika sinagogi la Wayahudi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au, “usiku.”
    reason: lexical_alternative
  - marker: c
    text: Au, “sinagogi la Kiyahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: Ndugu
  rationale: “Ndugu” ni neno la kawaida na lenye heshima kwa waumini walio kama familia. Ingawa umbo la Kigiriki ni la kiume kwa wingi, neno la Kiswahili halibainishi jinsia na linaweza kujumuisha jumuiya pana ya waumini.
- source_word: εὐθέως
  choice: mara moja
  rationale: Huwasilisha kwa lugha ya kawaida tendo lililofanywa bila kukawia.
- source_word: διὰ νυκτός
  choice: usiku
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kuwa kuondoka kwao kulitokea wakati wa usiku.
- source_word: ἐξέπεμψαν
  choice: waliwatuma ... waende
  rationale: Huwasilisha maana ya kuwatuma waondoke kuelekea mahali pengine bila kuongeza wazo lisilo la lazima la kufukuzwa.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: Paulo na Sila, wote wawili
  rationale: “Wote wawili” huhifadhi msisitizo wa muundo wa Kigiriki τε ... καί huku sentensi ikibaki ya kawaida katika Kiswahili.
- source_word: Βέροιαν
  choice: Beroya
  rationale: Hili ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: οἵτινες παραγενόμενοι
  choice: Walipofika
  rationale: Hufanya kishiriki cha Kigiriki kuwa kishazi cha wakati kinachoeleweka kwa urahisi na kuhifadhi mfuatano wa matukio.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: sinagogi la Wayahudi
  rationale: Huhifadhi uhusiano wa maneno ya Kigiriki na kutambulisha sinagogi la jumuiya ya Kiyahudi bila maana ya dharau.
- source_word: ἀπῄεσαν
  choice: wakaenda katika
  rationale: Hufuata mtiririko wa simulizi na kuonyesha mwendo kuelekea sinagogini kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ἀδελφοὶ katika jumuiya ya waumini
  choice: Ndugu
  alternative: Ndugu wa kiume na wa kike; waumini
  rationale: Kiswahili “ndugu” kinaweza kujumuisha wanaume na wanawake bila kulazimisha jinsia ya warejelewa. Tanbihi inaeleza kuwa umbo la Kigiriki ni la kiume lakini linaweza kutaja jumuiya pana ya waumini.
- issue: Namna ya kutafsiri τῶν Ἰουδαίων
  choice: la Wayahudi
  alternative: la Kiyahudi
  rationale: Tafsiri hii inaakisi muundo wa umilikaji katika Kigiriki na hapa inatambulisha sinagogi la jumuiya ya Wayahudi huko Beroya, wala haitoi hukumu ya kitheolojia kuhusu Wayahudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Viunganishi vya mfululizo “walipofika, wakaenda” vinadumisha mwendo wa simulizi la Luka.
