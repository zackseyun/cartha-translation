  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: sw
  text: Lakini, walipowakosa, wakamkokota Yasoni na baadhi ya ndugu[a] hadi mbele ya maafisa wa jiji[b], wakipaza sauti, “Watu hawa walioleta machafuko ulimwenguni[c] wamefika hapa pia!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa ni waamini wenzao; kulingana na muktadha, neno hilo linaweza kurejelea jumuiya iliyojumuisha pia wanawake.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, cheo hiki ni “politarki,” jina la Kimakedonia kwa maafisa wa jiji.
    reason: cultural_note
  - marker: c
    text: Au “ulimwengu unaokaliwa na watu”; usemi huu unaweza kumaanisha ulimwengu uliojulikana wakati huo, mara nyingi maeneo ya Dola ya Roma.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: walipowakosa
  rationale: Kirai cha wakati kinaonyesha kwamba kwanza hawakuwapata watu waliokuwa wakiwatafuta; kitenzi ‘kukosa’ ni cha kawaida na chenye maana hiyo katika Kiswahili.
- source_word: ἔσυρον
  choice: wakamkokota
  rationale: Kitenzi hiki kinahifadhi wazo la kumvuta mtu kwa nguvu, si kumpeleka tu.
- source_word: τινας ἀδελφοὺς
  choice: baadhi ya ndugu
  rationale: ‘Ndugu’ huhifadhi sitiari ya kifamilia kwa waamini wenzao na katika Kiswahili inaweza kutumiwa kwa jumuiya ya waamini.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: hadi mbele ya watawala wa jiji
  rationale: Tafsiri hii inaeleza kazi ya maofisa hao wa Kimakedonia na pia wazo la kupelekwa mbele yao ili kushtakiwa.
- source_word: βοῶντες
  choice: wakipaza sauti
  rationale: Usemi huu unaonyesha kilio kikubwa cha hadharani kilichoandamana na tendo la kuwakokota.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: Watu hawa walioleta machafuko ulimwenguni
  rationale: ‘Kuleta machafuko’ linaonyesha kusababisha vurugu au mtikisiko mkubwa bila kuingiza moja kwa moja nahau ya Kiingereza ya ‘kuupindua ulimwengu.’
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: wamefika hapa pia
  rationale: Hii ni njia ya asili ya Kiswahili ya kuonyesha kwamba sasa wamewasili na wapo mahali hapo; ‘pia’ huhifadhi mkazo wa καί.
