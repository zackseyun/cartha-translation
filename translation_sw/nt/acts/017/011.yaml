  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: sw
  text: Hawa walikuwa na tabia bora zaidi kuliko wale wa Thesalonike[a], kwa maana walilipokea neno kwa hamu kubwa[b], wakiyachunguza Maandiko kila siku ili kuona kama mambo hayo ni hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waungwana zaidi.” Neno la Kigiriki linaweza kumaanisha tabia inayostahili sifa au, ingawa huenda si maana kuu hapa, hadhi ya juu ya kijamii.
    reason: lexical_alternative
  - marker: b
    text: Au “walikaribisha ujumbe kwa utayari mkubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: waungwana zaidi
  rationale: Neno hili la kulinganisha linaweza kuonyesha tabia inayostahili sifa au hadhi ya kijamii. Katika muktadha, sentensi inayofuata inaeleza uungwana wao kwa utayari wa kulipokea neno na kuyachunguza Maandiko. “Waungwana zaidi” huhifadhi maana ya sifa njema bila kufunga kabisa uwezekano wa maana ya hadhi.
- source_word: οἵτινες
  choice: kwa maana walifanya hivyo
  rationale: Nguvu ya kifafanuzi ya kiwakilishi hiki imewakilishwa kwa “kwa maana,” ambayo inaonyesha kuwa kauli inayofuata inaeleza kwa nini waliitwa waungwana zaidi. Kitenzi chenyewe kinafuata moja kwa moja katika matini kama “walilipokea.”
- source_word: ἐδέξαντο τὸν λόγον
  choice: walilipokea neno
  rationale: “Kulipokea neno” ni tafsiri ya asili inayohifadhi matumizi ya λόγος katika Matendo na haifupishi maana yake kuwa “ujumbe” pekee.
- source_word: μετὰ πάσης προθυμίας
  choice: kwa hamu kubwa
  rationale: προθυμία huonyesha utayari, nia, au hamu. “Kwa hamu kubwa” ni Kiswahili cha kawaida kinachobeba nguvu ya πάσης kama kiongezi.
- source_word: τὸ καθ’ ἡμέραν
  choice: kila siku
  rationale: Kirai hiki kinatumika kielezi na kuonyesha tendo lililorudiwa siku baada ya siku.
- source_word: ἀνακρίνοντες
  choice: wakiyachunguza
  rationale: Kitenzi hiki kina maana ya kuchunguza au kupeleleza kwa makini. “Kuchunguza” kinafaa kwa kitendo cha kupima madai kwa kuyalinganisha na Maandiko bila kuwa cha kiufundi kupita kiasi.
- source_word: τὰς γραφὰς
  choice: Maandiko
  rationale: Katika muktadha huu, neno hili linahusu Maandiko matakatifu ya Kiyahudi; “Maandiko” ndiyo istilahi ya kawaida na sahihi.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: ili kuona kama mambo hayo yalikuwa hivyo
  rationale: 'Tafsiri hii huhifadhi uchunguzi usioamua matokeo mapema: walitaka kuthibitisha kama mambo waliyosikia yalilingana na Maandiko.'
theological_decisions:
- issue: Maana ya εὐγενέστεροι katika muktadha
  choice: “waungwana zaidi,” ikielekezwa hasa kwenye tabia inayostahili sifa
  alternative: “wenye cheo cha juu zaidi” au “wenye moyo mwema zaidi”
  rationale: Mstari wenyewe unaunganisha sifa hiyo na jinsi walivyolipokea neno na kuyachunguza Maandiko. Hata hivyo, tanbihi inahifadhi uwezekano wa maana ya hadhi ya kijamii uliomo katika neno la Kigiriki.
- issue: Tafsiri ya λόγος
  choice: “neno”
  alternative: “ujumbe”
  rationale: “Neno” huhifadhi mwangwi wa matumizi ya kibiblia katika Matendo na bado linaeleweka katika muktadha, bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku “Maandiko” na “neno” vikihifadhi istilahi muhimu za kibiblia. Kiunganishi “kwa maana” kinaonyesha kazi ya kifafanuzi ya οἵτινες bila kuongeza kiashiria cha wakati kisichokuwapo katika chanzo.
