  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: sw
  text: kwa sababu ameweka siku ambayo atahukumu ulimwengu unaokaliwa kwa haki[a] kwa njia ya mwanamume aliyemteua, akiwa amewapa wote uthibitisho[b] kwa kumfufua kutoka kwa wafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uadilifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akiwa amewapa wote hakikisho”; kwa maana halisi zaidi, “akiwa amewapa wote imani.” Katika muktadha huu maana yake ni uthibitisho au hakikisho la wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: kwa sababu
  rationale: Huonyesha sababu ya wito uliotangulia wa kutubu, kwa Kiswahili cha kawaida na cha wazi.
- source_word: ἔστησεν ἡμέραν
  choice: ameweka siku
  rationale: Huwasilisha siku iliyowekwa na kuamuliwa; ni usemi wa asili wa Kiswahili.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: ambayo atauhukumu
  rationale: Wakati ujao wa Kiswahili unaeleza kwa kawaida tendo lililokusudiwa la hukumu, bila kulazimisha maana ya ukaribu wa mara moja.
- source_word: τὴν οἰκουμένην
  choice: ulimwengu unaokaliwa
  rationale: Huhifadhi maana mahususi ya οἰκουμένη kama ulimwengu wenye watu na upeo wa hukumu kwa wanadamu wote.
- source_word: ἐν δικαιοσύνῃ
  choice: kwa haki
  rationale: Katika muktadha wa kuhukumu, 'kwa haki' ni usemi wa asili unaojumuisha uadilifu na haki ya hukumu.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: kupitia mtu aliyemteua
  rationale: '''Mtu'' hufaa kwa ἀνήρ katika muktadha huu na kutotajwa kwa jina; ''kupitia'' huonyesha huyo mtu kuwa njia au wakala wa hukumu.'
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: akiwapa wote uthibitisho
  rationale: Katika muunganiko huu πίστις pamoja na παρέχω ina maana ya uthibitisho au hakikisho, si hasa imani ya ndani.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: kwa kumfufua kutoka kwa wafu
  rationale: Hueleza ufufuo kuwa njia ambayo Mungu aliutoa uthibitisho, huku ikihifadhi maana ya kutoka miongoni mwa wafu.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika hukumu
  choice: kwa haki
  alternative: kwa uadilifu
  rationale: '''Kwa haki'' ni ya asili katika Kiswahili kwa hukumu ya haki; ''kwa uadilifu'' pia huweza kusisitiza sifa ya unyofu.'
- issue: Maana ya πίστις katika πίστιν παρασχὼν πᾶσιν
  choice: uthibitisho
  alternative: hakikisho; kwa maana halisi zaidi, imani
  rationale: Nahau katika muktadha wa ufufuo inaelekea kumaanisha uthibitisho au msingi wa kuwa na hakika. Tanbihi huhifadhi upana wa neno πίστις.
- issue: Utambulisho wa ἀνήρ
  choice: mtu
  alternative: mwanamume
  rationale: Kigiriki humtaja mwanamume mahususi, lakini Kiswahili 'mtu aliyemteua' ni cha kawaida na hakibadili utambulisho wa mhusika; 'mwanamume' ni halisi zaidi lakini ngumu katika sentensi hii.
- issue: Uhusiano wa ἐν ἀνδρί na tendo la kuhukumu
  choice: kupitia mtu
  alternative: kwa mtu
  rationale: '''Kupitia'' huonyesha uwakala bila kudokeza kwamba Mungu mwenyewe ndiye anayehukumiwa au kwamba huyo mtu ni chombo kisicho na mamlaka.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umewekwa kuwa sentensi moja ili kudumisha mtiririko wa hoja ya Kigiriki. Alama zote za tanbihi zimo katika matini kuu.
