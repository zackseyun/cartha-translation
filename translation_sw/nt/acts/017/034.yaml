base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: sw
  text: Lakini baadhi ya wanaume walijiunga naye[a] na wakaamini. Miongoni mwao walikuwemo pia Dionisio Mwareopago[b], mwanamke aliyeitwa Damari, na wengine pamoja nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walijishikamanisha naye” au “waliambatana naye”; neno la Kigiriki linaonyesha uhusiano wa karibu wa kibinafsi na Paulo.
    reason: lexical_alternative
  - marker: b
    text: “Mwareopago” huenda ikamaanisha mshiriki wa baraza la Areopago au mtu aliyehusishwa na baraza hilo.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Lakini baadhi ya wanaume
  rationale: “Baadhi” huonyesha sehemu ya wasikilizaji, “lakini” huleta tofauti ndogo na mwitikio uliotangulia, na “wanaume” huhifadhi jinsia ya neno ἄνδρες.
- source_word: κολληθέντες αὐτῷ
  choice: walijiunga naye
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kujishikamanisha na Paulo au kuwa na ushirika wa karibu naye, bila kudokeza tu kuwapo mahali pamoja.
- source_word: ἐπίστευσαν
  choice: wakaamini
  rationale: Huhifadhi kauli ya moja kwa moja ya kitenzi bila kuongeza kitu cha imani ambacho hakitajwi wazi katika mstari huu.
- source_word: ἐν οἷς καὶ
  choice: Miongoni mwao walikuwemo
  rationale: Huwatambulisha kwa kawaida watu waliotajwa kuwa mifano ya wale walioamini.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: Dionisio Mwareopago
  rationale: Hutumia maumbo ya majina yaliyozoeleka katika Kiswahili na kuhifadhi cheo au utambulisho wa Dionisio unaohusiana na Areopago.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: mwanamke aliyeitwa Damari
  rationale: Ni usemi wa kawaida unaohifadhi jinsia yake na jina lake.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: na wengine pamoja nao
  rationale: Huhifadhi maana ya watu wengine zaidi ya wale wawili waliotajwa, wakiwa pamoja nao.
theological_decisions:
- issue: Maana ya ἐπίστευσαν katika muktadha
  choice: wakaamini
  alternative: wakawa waumini
  rationale: “Wakaamini” husema kwa uaminifu mwitikio wao kwa mahubiri ya Paulo bila kuongeza maelezo ya kimafundisho au kumfanya Paulo mwenyewe kuwa kitu cha imani yao.
- issue: Uhusiano unaoonyeshwa na κολληθέντες αὐτῷ
  choice: walijiunga naye
  alternative: walijishikamanisha naye
  rationale: Tafsiri hii huhifadhi wazo la kuambatana kwa karibu na Paulo, lakini haifanyi kitendo hicho kuwa sawa moja kwa moja na kuamini; vitendo vyote viwili vimebaki katika kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni nyepesi kwa msomaji wa kawaida, huku mpangilio wa kitendo cha kujiunga na kitendo cha kuamini, jinsia ya ἄνδρες, na utata wa cheo Ἀρεοπαγίτης vikihifadhiwa.
