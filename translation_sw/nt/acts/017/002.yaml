lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: Kama ilivyokuwa desturi ya Paulo
  rationale: Muundo huu unaonyesha mazoea yaliyoimarika; tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: aliingia walikokuwa
  rationale: Inahifadhi wazo la kuingia na kuelekea kwao bila kutaja wazi sinagogi au Wayahudi, majina ambayo hayapo katika aya yenyewe.
- source_word: ἐπὶ σάββατα τρία
  choice: kwa Sabato tatu
  rationale: Kirai hiki kinaweza kueleza matukio matatu ya Sabato au kipindi cha Sabato tatu; 'kwa Sabato tatu' ni cha asili na huhifadhi kiasi fulani cha upana huo.
- source_word: διελέξατο αὐτοῖς
  choice: akajadiliana nao
  rationale: Kitenzi kinaashiria mazungumzo yenye hoja na majibizano; 'akajadiliana nao' hakidokezi uhasama usio lazima.
- source_word: ἀπὸ τῶν γραφῶν
  choice: kwa kutumia Maandiko
  rationale: ἀπό hapa huonyesha chanzo au msingi wa hoja zake. 'Maandiko' ni istilahi iliyo wazi kwa maandishi matakatifu yanayotajwa katika muktadha.
theological_decisions:
- issue: Wanaorejelewa na kiwakilishi αὐτούς/αὐτοῖς
  choice: Kutumia 'walikokuwa' na 'nao' bila kuwataja kwa jina
  alternative: Kusema 'aliingia katika sinagogi' au 'aliwaendea Wayahudi'
  rationale: Muktadha wa karibu unaonyesha sinagogi, lakini aya hii yenyewe hutumia viwakilishi. Tafsiri haiongezi ubainishaji usiotajwa moja kwa moja.
- issue: Nguvu ya διελέξατο katika shughuli ya Paulo
  choice: akajadiliana nao
  alternative: akawahoji kwa hoja / akabishana nao
  rationale: Chaguo hili linabaki wazi kwa mazungumzo yenye hoja bila kuingiza lazima maana ya ugomvi au mabishano makali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka mtiririko wa simulizi kwa 'akajadiliana' na imeepuka kufafanua viwakilishi kwa majina yasiyopo katika aya.
