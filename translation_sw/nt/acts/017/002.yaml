translation:
  language: sw
  text: Kama ilivyokuwa desturi ya Paulo, aliingia walikokuwa, na katika Sabato tatu akajadiliana nao kutoka katika Maandiko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Sabato tatu.”
