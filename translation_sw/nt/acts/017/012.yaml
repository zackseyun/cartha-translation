  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: sw
  text: Kwa hiyo wengi wao waliamini, na miongoni mwa wanawake Wagiriki wenye hadhi, si wachache[a]; wanaume pia hawakuwa wachache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, “si wachache,” usemi unaomaanisha idadi kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Kwa hiyo, wengi
  rationale: Muungano μὲν οὖν unaonyesha mpito wenye hitimisho linalotokana na uchunguzi wa Maandiko katika mstari uliotangulia. “Kwa hiyo” ni Kiswahili cha kawaida kinachoonyesha matokeo hayo bila kutafsiri kila chembe kivyake.
- source_word: ἐξ αὐτῶν
  choice: wao
  rationale: Hii ni sehemu ya kundi lililotajwa kabla; katika “wengi wao,” Kiswahili huhifadhi maana ya kwamba wengi miongoni mwao waliamini.
- source_word: ἐπίστευσαν
  choice: waliamini
  rationale: Tafsiri hii ya moja kwa moja haiongezi kitu cha imani ambacho hakitajwi wazi katika mstari huu.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: wanawake ... Wagiriki
  rationale: Ἑλληνίδων ni kivumishi cha kike kinachowatambulisha kama Wagiriki, na γυναικῶν hapa humaanisha wanawake, si lazima wake.
- source_word: τῶν εὐσχημόνων
  choice: mashuhuri
  rationale: Katika muktadha huu neno linaelekea kuonyesha heshima au hadhi inayotambulika katika jamii. “Mashuhuri” ni la asili na linaeleweka, huku tanbihi ikihifadhi uwezekano wa “wenye kuheshimika” au “wenye hadhi ya juu.”
- source_word: οὐκ ὀλίγοι
  choice: wengi
  rationale: Tamathali ya kupunguza “si wachache” humaanisha idadi kubwa. Kiswahili cha kawaida hutumia “wengi”; tanbihi inahifadhi muundo halisi wa Kigiriki.
- source_word: καὶ
  choice: pamoja na ... pia
  rationale: Muundo huu unaunganisha kwa ufasaha kundi la wanaume na wanawake waliotajwa, bila kudokeza kwamba kivumishi εὐσχημόνων kinawahusu wanaume pia.
theological_decisions:
- issue: Iwapo ἐπίστευσαν itafsiriwe kwa lugha ya wazi zaidi ya mafundisho ya Kikristo
  choice: waliamini
  alternative: walimwamini Masihi; waliamini ujumbe
  rationale: Kitu walichoamini hakitajwi wazi katika mstari huu bali kinaeleweka kutokana na muktadha. “Waliamini” huhifadhi ufupi na uwazi wa matini bila kuingiza dai la ziada.
- issue: Iwapo εὐσχημόνων inawahusu wanawake pekee au wanawake na wanaume
  choice: Imeunganishwa na wanawake pekee
  alternative: wanawake na wanaume mashuhuri Wagiriki
  rationale: Kisarufi, εὐσχημόνων iko ndani ya kirai cha τῶν Ἑλληνίδων γυναικῶν na umbo lake linaweza kuwa la kike; kwa hiyo tafsiri haipanui sifa hiyo kwa wanaume bila msingi wa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umetengenezwa ili ueleweke kwa urahisi, huku tanbihi zikihifadhi tamathali ya Kigiriki na upana wa maana ya εὐσχήμων.
