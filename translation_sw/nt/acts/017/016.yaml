  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: sw
  text: Paulo alipokuwa akiwasubiri huko Athene, roho yake ilichochewa ndani yake[a] alipoona kwamba jiji hilo lilikuwa limejaa sanamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yake ilifadhaika” au “ilichukizwa”; kitenzi cha Kigiriki kinaonyesha msukosuko mkali wa ndani.
    reason: lexical_alternative
  - marker: b
    text: Au, “jiji hilo lilikuwa limegubikwa na sanamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: alipokuwa akiwasubiri
  rationale: 'Kauli hii inaonyesha tendo lililokuwa likiendelea: Paulo alikuwa akiwasubiri wenzake. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya wakati ya kirai shiriki.'
- source_word: παρωξύνετο
  choice: ilifadhaika sana
  rationale: Kitenzi hiki kinaonyesha msukosuko mkali wa ndani uliokuwa ukiendelea. ‘Ilifadhaika sana’ ni Kiswahili cha kawaida kinachoonyesha uzito wa mwitikio huo bila kuufanya kuwa huzuni tu au hasira tu.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: roho yake
  rationale: Tafsiri hii inafuata wazi kirai cha Kigiriki na kuelekeza kwa utu wa ndani wa Paulo, bila kudai kwamba anayelengwa ni Roho Mtakatifu.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Kirai hiki kinasisitiza kwamba msukosuko huo ulikuwa wa ndani; tafsiri ya moja kwa moja inahifadhi msisitizo huo.
- source_word: θεωροῦντος
  choice: alipoona
  rationale: Kirai shiriki kinaonyesha kuona au kutazama kulikotokea wakati huohuo. ‘Alipoona’ ni kifupi, wazi, na cha kawaida.
- source_word: κατείδωλον
  choice: lilikuwa limejaa sanamu
  rationale: Kivumishi hiki adimu kinaeleza jiji lililojaa au kugubikwa na sanamu. Tafsiri hii ni wazi na haiongezi maelezo yasiyosemwa moja kwa moja.
- source_word: πόλιν
  choice: jiji hilo
  rationale: Kigiriki kinasema ‘jiji,’ kikirejelea Athene iliyotajwa tayari. ‘Jiji hilo’ hudumisha rejeo hilo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi chepesi cha masimulizi. Muundo wa sentensi ya Kiswahili unaendeleza simulizi kwa kawaida bila kuhitaji kuongeza ‘basi’ au ‘lakini.’
theological_decisions:
- issue: Rejeleo la ‘roho yake’
  choice: Roho ya Paulo mwenyewe, yaani utu wake wa ndani
  alternative: Dokezo la msukumo wa Roho Mtakatifu
  rationale: Kiwakilishi ‘yake’ pamoja na kirai ‘ndani yake’ kinaonyesha mwitikio wa ndani wa Paulo. Aya haisemi wazi kwamba Roho Mtakatifu ndiye aliyemchochea, kwa hiyo tafsiri haiingizi dai hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa lugha inayoeleweka kwa wasomaji wa kawaida huku ikihifadhi ‘roho yake’ na ‘ndani yake’ kama zilivyo katika chanzo. ‘Sanamu’ imetumiwa bila kuongeza ‘za miungu’ ili kuepuka kuingiza ufafanuzi usio wazi katika neno lenyewe.
