  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: sw
  text: Baadhi ya wanafalsafa wa Waepikureo na Wastoiki pia walijadiliana naye[a]. Wengine wakasema, “Mpiga porojo huyu anajaribu kusema nini?”[b] Lakini wengine wakasema[c][d], “Anaonekana kuwa mtangazaji wa miungu ya kigeni,” kwa sababu alikuwa akitangaza habari njema kuhusu Yesu na ufufuo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walibishana naye” au “walizungumza naye”; kitenzi cha Kigiriki kinaweza kumaanisha mazungumzo ya kina au mabishano.
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “mpiga porojo” ni neno la dharau linalomaanisha kihalisi “mwenye kuokota mbegu.” Lilikuwa likitumiwa kwa mtu aliyeonekana kuokota vipande vya mawazo na kuvirudia.
    reason: cultural_note
  - marker: c
    text: Au, “pepo wa kigeni” au “miungu ya nchi nyingine.” Hapa wasemaji huenda walimaanisha viumbe vya kiungu ambavyo hawakuvijua kulingana na mtazamo wao wa kipagani, si lazima pepo waovu katika maana ya baadaye ya Kikristo.
    reason: alternative_reading
  - marker: d
    text: Baadhi ya wafafanuzi hudhani kwamba huenda Waathene waliuelewa “ufufuo” kuwa mungu mwingine, kwa sababu Paulo alikuwa akitangaza kuhusu Yesu na ufufuo.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: walijadiliana naye
  rationale: Kitenzi kinaweza kumaanisha kushiriki katika mazungumzo au mabishano. ‘Walijadiliana naye’ ni Kiswahili cha asili kinachobakiza upana huo bila kudokeza lazima uhasama.
- source_word: σπερμολόγος
  choice: mpiga porojo
  rationale: Ni neno la dharau lililotumiwa kwa mtu anayeokota vipande vya mawazo na kuvirudia. ‘Mpiga porojo’ linaonyesha dharau na wazo la kusema mambo yasiyopewa uzito, huku maelezo ya picha halisi ya ‘mwenye kuokota mbegu’ yakihifadhiwa katika tanbihi.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: anajaribu kusema nini?
  rationale: Muundo wenye ἄν unaonyesha makisio yenye kusita au dharau. Usemi huu ni wa kawaida katika Kiswahili na unadumisha sauti ya kuwabeza.
- source_word: Ξένων δαιμονίων
  choice: miungu ya kigeni
  rationale: Katika muktadha wa wapagani wa Athene, δαιμόνια inaelekea kumaanisha viumbe vya kiungu kwa mtazamo wao, si lazima pepo wabaya katika matumizi ya Kikristo.
- source_word: καταγγελεὺς
  choice: mtangazaji
  rationale: Nomino hii humaanisha mtu anayetangaza jambo hadharani. ‘Mtangazaji’ ni wazi na yenye hadhi inayofaa.
- source_word: εὐηγγελίζετο
  choice: alikuwa akitangaza habari njema
  rationale: Kitenzi humaanisha hasa kutangaza habari njema; tafsiri hii inahifadhi maana hiyo badala ya kutumia neno la jumla kama ‘kuhubiri’.
- source_word: ἀνάστασιν
  choice: ufufuo
  rationale: Simulizi linaeleza yaliyomo katika ujumbe wa Paulo. Neno limeachwa kama nomino ya kawaida; uwezekano kwamba Waathene walilielewa kama jina la mungu wa kike umeelezwa katika tanbihi.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: wanafalsafa wa Waepikureo na Wastoiki
  rationale: Hii ni namna ya asili ya Kiswahili ya kutaja wanafalsafa wa shule hizo mbili, huku majina yao yakihifadhiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri δαιμόνια katika maneno ya wapagani
  choice: miungu ya kigeni
  alternative: pepo wa kigeni; miungu isiyojulikana
  rationale: ‘Pepo’ ingeweza kuingiza maana ya Kikristo ya viumbe waovu katika maneno ya Waathene. ‘Miungu’ huonyesha kwa usahihi zaidi namna walivyowatambua viumbe hao wa kiungu.
- issue: Kama ἀνάστασιν litafsiriwe kana kwamba ni jina la nafsi ya kiungu
  choice: ufufuo
  alternative: Ufufuo, kama jina la mungu wa kike
  rationale: Maelezo ya Luka yanataja ujumbe wa Paulo kuhusu Yesu na ufufuo. Uwezekano wa Waathene kulielewa neno hilo kama jina la mungu mwingine ni tafsiri inayowezekana, lakini haupaswi kulazimishwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ‘Waepikureo’ na ‘Wastoiki’ yanafuata muundo wa kawaida wa Kiswahili wa kutaja wafuasi wa makundi. Alama zote za tanbihi zimo katika matini kuu karibu na mada zinazozifafanua.
