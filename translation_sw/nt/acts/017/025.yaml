  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: sw
  text: Wala hahudumiwi kwa mikono ya wanadamu[a], kana kwamba anahitaji kitu chochote, kwa kuwa yeye mwenyewe huwapa wote uhai, pumzi, na vitu vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haabudiwi kwa mikono ya wanadamu.” Kitenzi cha Kigiriki kinaweza kurejelea huduma au utumishi katika mazingira ya kidini; hapa maana ni kwamba Mungu hategemei huduma za wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύεται
  choice: hatumikiwi
  rationale: Hapa kitenzi hakimaanishi kuponywa, bali kuhudumiwa au kutendewa huduma, hasa katika muktadha wa kidini. Muundo huu unasisitiza kwamba Mungu hategemei huduma ya wanadamu.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: kwa mikono ya wanadamu
  rationale: Tafsiri hii huhifadhi taswira halisi ya mikono ya wanadamu na mwangwi wa lugha ya kibiblia kuhusu huduma ya kidini inayofanywa na watu.
- source_word: προσδεόμενός τινος
  choice: kana kwamba anahitaji kitu chochote
  rationale: 'Huhifadhi nguvu ya hoja: si kwamba Mungu hupokea huduma kwa sababu ana upungufu au hitaji fulani.'
- source_word: αὐτὸς
  choice: yeye mwenyewe ndiye
  rationale: Huhifadhi msisitizo wa kiwakilishi na utofauti kati ya Mungu asiye mhitaji na viumbe wanaopokea kila kitu kutoka kwake.
- source_word: διδοὺς
  choice: anayewapa
  rationale: Kishirikishi kimetolewa kwa muundo wa kawaida wa Kiswahili unaoonyesha sababu inayotanguliwa na 'kwa kuwa'.
- source_word: πᾶσι
  choice: wote
  rationale: Huhifadhi upeo mpana wa usemi bila kuongeza wazi neno 'watu' ambalo halipo katika Kigiriki.
- source_word: ζωὴν
  choice: uhai
  rationale: Neno 'uhai' linaonyesha hali na zawadi ya kuwa hai, sambamba na pumzi inayotajwa baada yake.
- source_word: πνοὴν
  choice: pumzi
  rationale: Katika jozi hii pamoja na uhai, maana ya kawaida ni pumzi ya kiumbe hai, si roho.
- source_word: καὶ τὰ πάντα
  choice: na vitu vyote
  rationale: Huhifadhi nguvu jumuishi ya kifungu na kupanua zaidi ya uhai na pumzi hadi yote ambayo viumbe hupokea.
- source_word: οὐδὲ
  choice: Wala
  rationale: Huendeleza ukanushaji wa mstari uliotangulia kwa kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
theological_decisions:
- issue: Ikiwa θεραπεύεται itafsiriwe wazi kuwa ibada au kwa maana pana ya kuhudumiwa
  choice: hatumikiwi
  alternative: haabudiwi / hahudumiwi
  rationale: Hoja ya Paulo inahusu kutotegemea kwa Mungu huduma za wanadamu, zikiwemo huduma za kidini. 'Hatumikiwi' huhifadhi maana pana ya huduma bila kudai kwamba Mungu haabudiwi, jambo ambalo lingeweza kupotosha hoja ya kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'hატumikiwi' ni mfupi na wa kawaida, huku tanbihi ikifafanua uwezekano wa maana ya huduma ya kidini. Alama ya tanbihi [a] imewekwa mara baada ya kifungu kinachohusika.
