  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: sw
  text: ili wamtafute Mungu, labda wampapase[a] na wampate—ingawa kwa kweli hayuko mbali na kila mmoja wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wajaribu kumtafuta kwa kugusa-gusa.” Kitenzi cha Kigiriki hudokeza kutafuta kwa mguso, kama mtu aliye gizani au asiyeona vizuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν
  choice: ili wamtafute
  rationale: Kitenzi-jina kinategemea kishazi kilichotangulia na hapa kinaonyesha kusudi; “ili wamtafute” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Katika Kiswahili, jina “Mungu” halihitaji kibainishi kinacholingana na άρθρο ya Kigiriki.
- source_word: εἰ ἄρα γε
  choice: labda
  rationale: “Labda” huhifadhi hali ya uwezekano na kutokuwa na uhakika bila kuifanya kauli kuwa nzito isivyo kawaida.
- source_word: ψηλαφήσειαν
  choice: wampapase
  rationale: Kitenzi hiki huleta picha ya kutafuta kwa kugusa, kama mtu mwenye ufahamu mdogo au aliye gizani; “kupapasa” huhifadhi sitiari hiyo kwa Kiswahili cha kawaida.
- source_word: αὐτόν
  choice: -m-
  rationale: Kiambishi cha yambwa cha ngeli ya mtu kinamrejelea Mungu kwa njia ya kawaida katika Kiswahili.
- source_word: καὶ εὕροιεν
  choice: na kumpata
  rationale: Kitenzi hiki kinaratibiwa na optative iliyotangulia; “labda” linaenea kwa vitendo vyote viwili, hivyo maana ya uwezekano inabaki bila kurudia alama nyingine.
- source_word: καί γε
  choice: ingawa kwa kweli
  rationale: 'Kauli hii inaleta ufafanuzi wa kukubali jambo lililo kinyume na matarajio: utafutaji wa mwanadamu ni wa kusitasita, lakini Mungu kwa kweli yu karibu.'
- source_word: οὐ μακρὰν
  choice: hayuko mbali
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida, inayomtaja Mungu kama nafsi.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: na kila mmoja wetu
  rationale: Baada ya “mbali,” kihusishi “na” ni cha kawaida katika Kiswahili; “kila mmoja wetu” huhifadhi mkazo wa Kigiriki unaomhusu mtu mmoja mmoja.
- source_word: ὑπάρχοντα
  choice: hayuko
  rationale: Partisipio linaeleza hali halisi ya Mungu kutokuwa mbali; Kiswahili kinahitaji kitenzi kikamilifu, na “hayuko” huwasilisha uwepo wa mahali kwa kawaida.
theological_decisions:
- issue: Uwezekano wa kumfikia Mungu na utafutaji wa mwanadamu
  choice: Kuhifadhi hali ya kusitasita katika “labda wampapase na kumpata” pamoja na uthibitisho wa ukaribu wa Mungu katika “ingawa kwa kweli hayuko mbali.”
  alternative: Kutumia tafsiri laini zaidi kama “labda wamtafute na kumpata,” ambayo ingeondoa picha ya kutafuta kwa kugusa.
  rationale: Kigiriki kinaweka pamoja ufahamu mdogo wa mwanadamu na ukaribu halisi wa Mungu. Tafsiri haifanyi utafutaji huo uwe wa uhakika wala wa bure.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wampapase” ni wazi na huhifadhi sitiari ya chanzo; tanbihi inaifafanua bila kuiondoa katika matini kuu.
