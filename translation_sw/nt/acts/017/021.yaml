  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: sw
  text: Waathene wote pamoja na wageni waliokuwako huko hawakuwa wakitumia muda wao kwa jambo lingine lolote isipokuwa kusema au kusikia jambo jipya zaidi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa Kiswahili cha kawaida zaidi, “jambo jipya.” Kigiriki kinatumia umbo la ulinganisho, “jipya zaidi,” huenda kikionyesha hamu ya daima ya kusikia au kusema habari iliyo mpya zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: Waathene wote
  rationale: Ἀθηναῖοι ni watu wa Athene, na πάντες ni ‘wote.’ δέ hapa ni kiunganishi hafifu cha maelezo; Kiswahili cha sasa hakihitaji kiunganishi cha mwanzo ili kudumisha mtiririko.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: wageni waliokuwa wakikaa huko
  rationale: ἐπιδημοῦντες huonyesha kuwapo au kukaa mahali kwa muda, huku ξένοι ikirejelea wageni au watu wa kutoka nje; tafsiri hii haidokezi makazi ya kudumu.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: hawakutumia muda wao kwa jambo lingine lolote
  rationale: Kauli hii inaeleza jinsi walivyoutumia muda wao. Wakati usiotimilifu wa ηὐκαίρουν unaonyesha mwenendo wao wa kawaida, nao umeelezwa kwa Kiswahili cha asili.
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: isipokuwa kusema au kusikia jambo
  rationale: Muundo wa ἢ ... ἢ unahifadhiwa kwa ‘au,’ na ‘isipokuwa’ huleta kwa kawaida upekee unaotokana na εἰς οὐδὲν ἕτερον.
- source_word: καινότερον
  choice: jipya zaidi
  rationale: Ni umbo la ulinganisho la καινός, yaani ‘jipya zaidi,’ ambalo linaweza kuonyesha hamu ya habari iliyo mpya kuliko iliyotangulia; umbo hilo limehifadhiwa badala ya kusawazishwa kimya kuwa ‘jipya.’
