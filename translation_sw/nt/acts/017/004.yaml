  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: sw
  text: Baadhi yao wakashawishika, wakajiunga na Paulo na Sila[a], na pia Wagiriki wengi waliomcha Mungu na wanawake mashuhuri ambao hawakuwa wachache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “wakaambatanishwa na Paulo na Sila”; kwa picha ya usemi, “wakaweka fungu lao pamoja na Paulo na Sila.”
    reason: Kitenzi cha Kigiriki ni adimu; katika muktadha kinaonyesha kuambatana au kujiunga, huku kikiwa na picha ya kushirikishwa au kuunganishwa katika fungu moja.
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: Baadhi yao
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya usemi wa sehemu, ikirejelea baadhi ya watu waliotajwa katika muktadha uliotangulia.
- source_word: ἐπείσθησαν
  choice: wakashawishika
  rationale: Kitenzi hiki kinaonyesha kwamba ujumbe uliwashawishi. Tafsiri hii inadumisha tofauti yake na kitenzi cha Kigiriki kinachomaanisha moja kwa moja ‘kuamini.’
- source_word: προσεκληρώθησαν
  choice: wakajiunga
  rationale: Katika muktadha huu kitenzi hiki adimu kinaonyesha kuhusishwa au kufungamanishwa na Paulo na Sila. ‘Wakajiunga’ ni Kiswahili cha asili na kinachoeleweka, huku tanbihi ikitoa maana iliyo karibu zaidi na umbo la Kigiriki.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: na Paulo na Sila
  rationale: Hapa hali ya dative inaonyesha uhusiano unaokamilisha kitenzi; ‘wakajiunga na’ ni muundo wa kawaida wa Kiswahili.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: Wagiriki ... waliomcha Mungu
  rationale: Katika Matendo usemi huu kwa kawaida huwataja watu wa mataifa waliomheshimu Mungu wa Israeli na kushiriki katika mazingira ya ibada ya Kiyahudi. ‘Waliomcha Mungu’ ni wazi bila kuongeza dai kwamba walikuwa waongofu kamili wa Uyahudi.
- source_word: πλῆθος πολὺ
  choice: wengi
  rationale: Katika Kiswahili ‘Wagiriki wengi’ huwasilisha kwa kawaida wazo la idadi kubwa bila kutumia nomino nzito kama ‘umati mkubwa.’
- source_word: γυναικῶν τε τῶν πρώτων
  choice: wanawake mashuhuri
  rationale: πρῶτος hapa inaonyesha cheo au hadhi katika jamii, si kuwa wa kwanza kwa wakati. ‘Mashuhuri’ huwasilisha hadhi hiyo kwa lugha ya sasa.
- source_word: οὐκ ὀλίγαι
  choice: ambao hawakuwa wachache
  rationale: Muundo huu unadumisha litotes ya Luka badala ya kuirahisisha kuwa ‘wengi.’
- source_word: τε ... τε
  choice: pamoja na ... na
  rationale: Muundo huu unaunganisha makundi mawili ya ziada kwa Kiswahili laini na cha kawaida.
theological_decisions:
- issue: Iwapo ἐπείσθησαν itafsiriwe kwa lugha inayotaja wazi kuamini au kuongoka
  choice: wakashawishika
  alternative: wakaamini
  rationale: Kigiriki kimetumia πείθω, si πιστεύω. ‘Wakashawishika’ huhifadhi tofauti hiyo ya msamiati na haiongezi wazi zaidi ya ilivyoandikwa, huku muktadha wa mahubiri ukibaki wazi.
- issue: Kiwango cha kuweka wazi utambulisho wa kidini wa σεβομένων Ἑλλήνων
  choice: Wagiriki waliomcha Mungu
  alternative: Wagiriki wacha Mungu; Wagiriki walioabudu
  rationale: Usemi huu katika Matendo una maana ya kihistoria ya Wagiriki waliomheshimu Mungu wa Israeli katika mazingira ya ibada ya Kiyahudi. Tafsiri iliyochaguliwa ni wazi lakini haiwataji kwa dhehebu wala kudai kwamba walikuwa wamegeukia Uyahudi kikamilifu.
- issue: Jinsi ya kuwasilisha hali ya προσεκληρώθησαν bila kudokeza kwa lazima kwamba Mungu aliwapangia fungu hilo
  choice: wakajiunga
  alternative: wakafungamanishwa; wakawekwa katika fungu moja na
  rationale: Umbo la Kigiriki ni la kutendwa na lina picha ya kuhusishwa au kupewa fungu, lakini mtendaji hakutajwi. ‘Wakajiunga’ hutoa maana ya kimuktadha bila kumtaja mtendaji ambaye andiko halimtaji; tanbihi huhifadhi mbadala wa karibu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imedumisha mwendo wa simulizi kwa ‘waka-’, imetumia ‘hawakuwa wachache’ kuhifadhi msisitizo wa kifasihi wa Luka, na imeepuka istilahi za kidhehebu.
