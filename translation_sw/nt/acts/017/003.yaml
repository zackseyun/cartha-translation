  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: sw
  text: akifafanua na kuthibitisha kwamba ilimpasa Masihi[a] kuteseka na kufufuka kutoka kwa wafu,[b] na kwamba Yesu huyu ninayewatangazia ndiye Masihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo” katika matukio yote mawili ya “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au “kufufuliwa kutoka kwa wafu.” Kigiriki hapa kinatumia infinitivu tendaji, “kufufuka,” ingawa mahali pengine Agano Jipya pia husema kwamba Yesu alifufuliwa na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: akifafanua
  rationale: Katika muktadha wa kujadiliana kwa kutumia Maandiko, neno hili linaonyesha kuyafungua au kuyaweka wazi maana yake; “akifafanua” ni Kiswahili cha kawaida na chenye heshima.
- source_word: παρατιθέμενος
  choice: na kuthibitisha
  rationale: Kitenzi hiki kinaonyesha kuweka ushahidi mbele ya wasikilizaji. “Kuthibitisha” kinaeleza hoja inayotegemea Maandiko bila kulazimisha maana ya uthibitisho wa kimantiki kabisa.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: Masihi
  rationale: Katika sehemu zote mbili Χριστός ni cheo cha yule aliyetiwa mafuta aliyekuwa akitarajiwa, si sehemu ya jina la Yesu.
- source_word: ἔδει
  choice: ilimpasa
  rationale: Huonyesha ulazima uliotokana na mpango wa Mungu kama ulivyofunuliwa katika Maandiko; “ilimpasa” huhifadhi uzito huo kwa lugha fupi na ya asili.
- source_word: παθεῖν
  choice: kuteseka
  rationale: Ni tafsiri ya moja kwa moja ya mateso ya Masihi.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: kufufuka kutoka kwa wafu
  rationale: Infinitivu ya Kigiriki iko katika umbo tendaji, hivyo “kufufuka” hufuata kwa karibu usemi wa chanzo bila kuingiza umbo la kutendwa.
- source_word: καταγγέλλω
  choice: ninayewatangazia
  rationale: Huhifadhi maana ya kutangaza ujumbe hadharani bila kuufanya uwe mahubiri rasmi pekee.
theological_decisions:
- issue: Maana ya Χριστός kama cheo katika sehemu zote mbili
  choice: Masihi
  alternative: Kristo
  rationale: Hoja ya mstari ni kwamba Masihi aliyetarajiwa alipaswa kuteseka na kufufuka, na kwamba Yesu ndiye huyo. “Masihi” huweka wazi muktadha wa Kiyahudi na wa Maandiko.
- issue: Sauti ya ἀναστῆναι
  choice: kufufuka kutoka kwa wafu
  alternative: kufufuliwa kutoka kwa wafu
  rationale: Kigiriki kinatumia infinitivu tendaji, kwa hiyo “kufufuka” ndilo chaguo linalolingana moja kwa moja zaidi. Hili halikanushi mafundisho mengine ya Agano Jipya kwamba Mungu alimfufua Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa nukuu ya moja kwa moja umetumiwa katika dai la mwisho ili sentensi iwe wazi na ya asili, bila kubadili yaliyomo katika Kigiriki.
