  text: Baada ya kupokea dhamana kutoka kwa Yasoni na wengine[a], waliwaachilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiasi cha kutosha”; inaelekea ilikuwa ahadi au fedha iliyowekwa kama hakikisho kwamba wangekuwa na mwenendo wa amani.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: baada ya kuchukua
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; usemi huu unaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: τὸ ἱκανὸν
  choice: dhamana
  rationale: Katika muktadha huu wa kisheria, usemi huu unaelekea kumaanisha kiasi au ahadi ya kutosha iliyotolewa kama hakikisho. “Dhamana” hudumisha maana hiyo bila kuifafanua kupita kiasi.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: kutoka kwa Yasoni na wale wengine
  rationale: παρά pamoja na jenitivi huonyesha chanzo; “wale wengine” ni Kiswahili cha kawaida kwa watu wengine waliokuwa pamoja naye.
- source_word: ἀπέλυσαν
  choice: wakawaachilia
  rationale: Katika mazingira ya mamlaka na kisheria, neno hili humaanisha kuwaweka huru au kuwaruhusu waende; “wakawaachilia” ni wazi na la kawaida.
- source_word: αὐτούς
  choice: -wa-
  rationale: Kiambishi cha yambwa cha wingi kinawarejelea Yasoni na wale wengine waliokuwa wamezuiliwa.
