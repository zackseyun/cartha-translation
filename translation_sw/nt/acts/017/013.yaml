  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: sw
  text: Lakini Wayahudi kutoka Thesalonike walipopata habari kwamba neno la Mungu lilikuwa limetangazwa na Paulo huko Beroya pia[a], wakaja huko pia, wakichochea na kuvuruga umati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lilitangazwa”; umbo la Kigiriki linaweza kutafsiriwa kwa njia yoyote kati ya hizi kulingana na jinsi mfuatano wa matukio unavyoelezwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakisababisha taharuki na fujo miongoni mwa umati.” Vitenzi hivi viwili vina maana zinazokaribiana na kwa pamoja vinasisitiza msukosuko wa hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Lakini ... walipo-
  rationale: “Lakini” linaendeleza simulizi huku likionyesha tofauti ndogo na mapokezi mazuri ya Beroya; muundo wa “walipo-” unaonyesha wakati kwa Kiswahili cha kawaida.
- source_word: ἔγνωσαν
  choice: walipopata habari
  rationale: Kitenzi hapa kinamaanisha kuja kujua taarifa fulani; “kupata habari” ni usemi wa asili unaofaa muktadha.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: Wayahudi kutoka Thesalonike
  rationale: Linabainisha kundi hili kwa mahali walikotoka, bila kudokeza Wayahudi wote kwa ujumla.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: kwamba ... huko Beroya pia
  rationale: “Pia” linaonyesha kwamba Beroya lilikuwa eneo jingine ambako ujumbe ulitangazwa.
- source_word: κατηγγέλη
  choice: lilikuwa limetangazwa
  rationale: Huhifadhi hali tendwa na wazo la kutangaza hadharani; wakati timilifu unaweka tukio hilo kabla ya wao kupata habari.
- source_word: ὑπὸ τοῦ Παύλου
  choice: na Paulo
  rationale: “Na” humtaja Paulo wazi kuwa mtendaji katika sentensi ya hali tendwa.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Ni usemi wa kawaida wa kibiblia unaohifadhi uzito wa kitheolojia wa ujumbe wa Mungu bila kuufafanua kupita kiasi.
- source_word: ἦλθον κἀκεῖ
  choice: wakaja huko pia
  rationale: Huhifadhi maana ya kwamba wao pia walifika mahali hapo, yaani Beroya.
- source_word: σαλεύοντες
  choice: wakichochea
  rationale: Katika muktadha wa watu, kitenzi kinaonyesha kusababisha msukosuko au taharuki; “kuchochea” ni cha asili na hakiongezi wazo la ghasia ambalo halijasemwa wazi.
- source_word: καὶ ταράσσοντες
  choice: na kuvuruga
  rationale: Huhifadhi kitenzi cha pili na wazo lake la kuleta machafuko au hali ya kutotulia.
- source_word: τοὺς ὄχλους
  choice: umati
  rationale: “Umati” ni neno la kawaida lisiloegemea upande wowote kwa mkusanyiko wa watu; “genge” lingeongeza maana hasi.
theological_decisions:
- issue: Tafsiri ya ὁ λόγος τοῦ θεοῦ
  choice: neno la Mungu
  alternative: ujumbe wa Mungu
  rationale: “Neno la Mungu” linahifadhi usemi na mwangwi wake wa kitheolojia huku katika muktadha likirejelea ujumbe uliotangazwa, bila kuingiza maana nyingine ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa simulizi kwa urahisi, huku ikihifadhi hali tendwa, vitenzi viwili vya uchochezi, na rejeo maalumu kwa Wayahudi waliotoka Thesalonike.
