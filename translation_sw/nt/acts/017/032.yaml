  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: sw
  text: Waliposikia kuhusu ufufuo wa wafu, baadhi yao walidhihaki, lakini wengine wakasema, “Tutakusikiliza tena kuhusu jambo hili.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Waliposikia
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaweka mazingira ya majibu yaliyofuata. “Waliposikia” ni Kiswahili cha kawaida kinachohifadhi uhusiano wa wakati; δὲ hahitaji kiunganishi tofauti hapa kwa kuwa mtiririko wa simulizi uko wazi.
- source_word: ἀνάστασιν νεκρῶν
  choice: ufufuo wa wafu
  rationale: Hili ni tamko la kawaida na lililo wazi kwa dhana ya kufufuliwa kwa wafu, bila kulipanua zaidi ya Kigiriki.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: baadhi yao ... lakini wengine
  rationale: Muundo huu unaonyesha makundi mawili yenye miitikio inayotofautiana.
- source_word: ἐχλεύαζον
  choice: walidhihaki
  rationale: Neno hili linaonyesha dharau au kejeli. Wakati usiotimilifu wa Kigiriki hauhitaji kuongezewa maana ya kuanza katika Kiswahili; “walidhihaki” ni ya moja kwa moja na ya kawaida.
- source_word: Ἀκουσόμεθά σου
  choice: Tutakusikiliza
  rationale: ἀκούω pamoja na kiwakilishi katika hali ya genitivi humaanisha kumsikia au kumsikiliza mtu. “Tutakusikiliza” huonyesha kwa kawaida kwamba watamsikiliza Paulo akizungumza.
- source_word: περὶ τούτου καὶ πάλιν
  choice: tena kuhusu jambo hili
  rationale: “Tena” huhifadhi wazi nguvu ya καὶ πάλιν, na “kuhusu jambo hili” hurejelea mada iliyotajwa bila kuibana kuwa sehemu moja tu ya hotuba.
theological_decisions:
- issue: Maana ya ἀνάστασιν νεκρῶν mbele ya wasikilizaji wa mazingira ya kipagani
  choice: ufufuo wa wafu
  alternative: kufufuka kutoka kwa wafu
  rationale: Muundo wa Kigiriki unawasilisha ufufuo unaowahusu wafu kama kundi. Tafsiri iliyochaguliwa inahifadhi usemi huo bila kuamua zaidi ikiwa hapa mkazo ni ufufuo wa jumla au kufufuka kwa mtu mmoja kutoka miongoni mwa wafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kwa msomaji wa kawaida; “walidhihaki” huepuka usemi mzito, na “Tutakusikiliza tena” huhifadhi wazi ahadi au uahirishaji wenye utata uliopo katika kauli ya wasikilizaji.
