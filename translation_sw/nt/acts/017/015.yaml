base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: sw
  text: Wale waliomsindikiza Paulo walimpeleka mpaka Athene[a]. Baada ya kupokea maagizo[b] kwa ajili ya Sila na Timotheo kwamba waje kwake haraka iwezekanavyo, wakaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi Athene.” Kirai cha Kigiriki kinaweza kutafsiriwa kwa urahisi zaidi kuwa “mpaka Athene,” lakini “mpaka Athene” huhifadhi wazo la kumsindikiza Paulo hadi mahali hapo.
    reason: lexical_alternative
  - marker: b
    text: Au, “baada ya kupokea amri.” Neno la Kigiriki linaweza kumaanisha amri yenye mamlaka na pia maagizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: waliomsindikiza
  rationale: Kitenzi hiki katika muktadha kinaonyesha watu walioandamana na Paulo na kumfikisha salama alikokuwa akienda; “waliomsindikiza” ni Kiswahili cha kawaida na huhifadhi wazo la kuandamana naye.
- source_word: ἤγαγον
  choice: walimpeleka
  rationale: Kitenzi kikuu cha wakati uliopita kinaeleza tendo lililokamilika la kumfikisha Paulo Athene; “walimpeleka” ni cha asili katika simulizi hili.
- source_word: ἕως Ἀθηνῶν
  choice: mpaka Athene
  rationale: ἕως inaonyesha ukomo wa safari au mahali walipofika pamoja naye. “Mpaka Athene” huhifadhi maana hiyo bila kufanya sentensi kuwa nzito.
- source_word: λαβόντες ἐντολήν
  choice: baada ya kupewa maagizo
  rationale: Kirai kishirikishi kina uhusiano wa wakati na tendo linalofuata. ἐντολή inaweza kumaanisha agizo lenye mamlaka au maagizo; wingi “maagizo” unasikika kwa kawaida katika Kiswahili huku tanbihi ikihifadhi maana yenye nguvu zaidi.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: kwa ajili ya Sila na Timotheo
  rationale: πρός hapa inaonyesha waliokusudiwa kupelekewa maagizo. Tafsiri hii inaeleweka kwa kawaida pamoja na kishazi kinachoeleza yaliyomo katika maagizo hayo.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: kwamba waje kwake haraka iwezekanavyo
  rationale: Kishazi hiki kinaeleza yaliyomo katika maagizo na huhifadhi msisitizo wa uharaka wa ὡς τάχιστα. “Kwake” pia hudumisha kiwakilishi cha Kigiriki bila kukibadili kuwa jina Paulo.
- source_word: ἐξῄεσαν
  choice: wakaondoka
  rationale: Kitenzi hiki kinafunga tukio kwa kueleza kuondoka kwa wale waliomsindikiza Paulo. “Wakaondoka” huunganisha hatua hiyo kwa mtiririko wa kawaida wa simulizi la Kiswahili.
