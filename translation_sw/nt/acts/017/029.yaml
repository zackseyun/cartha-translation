revisions:
- from: Kwa hiyo, kwa kuwa sisi ni uzao wa Mungu, hatupaswi kudhani kwamba Uungu[a] unafanana na dhahabu, fedha, au jiwe—sanamu iliyochongwa[b] kwa ustadi na mawazo ya mwanadamu.
  to: Kwa hiyo, kwa kuwa sisi ni uzao wa Mungu, hatupaswi kudhani kwamba uungu[a] unafanana na dhahabu, fedha, au jiwe, sanamu iliyotengenezwa kwa ustadi na mawazo ya mwanadamu.
  rationale: The revision retains the source’s philosophical breadth in τὸ θεῖον, improves standard Swahili capitalization and appositional flow, and avoids unnecessarily restricting χαράγματι to a carved object. Footnote a is corrected to give natural, source-appropriate alternatives. The b anchor remains attached to “sanamu iliyotengenezwa.”
