id: ACT.17.29
reference: Acts 17:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa sisi ni uzao wa Mungu, hatupaswi kudhani kwamba uungu[a] unafanana na dhahabu, fedha, au jiwe, sanamu iliyotengenezwa kwa ustadi na mawazo ya mwanadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu” au “hali ya kimungu.” Neno la Kigiriki τὸ θεῖον ni pana, likimaanisha kilicho cha kimungu; hapa, katika hoja ya Paulo, linamrejelea Mungu wa kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: uzao
  rationale: Katika muktadha huu neno linaonyesha kuwa wanadamu wametokana na Mungu au wana uhusiano naye; “uzao” ni la kawaida na halimaanishi kabila.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Linaonyesha hitimisho linalotokana na hoja iliyotangulia.
- source_word: ὑπάρχοντες
  choice: kwa kuwa sisi ni
  rationale: Kirai kishirikishi kina maana ya sababu katika muktadha huu.
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: hatupaswi kudhani
  rationale: Kinaonyesha lisilofaa au lisilopasa kufikiriwa, si kutowezekana tu.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: dhahabu, fedha, au jiwe
  rationale: Yanahifadhiwa malighafi yote matatu yaliyotajwa katika Kigiriki.
- source_word: χαράγματι
  choice: sanamu iliyochongwa
  rationale: Neno linamaanisha kitu kilichochorwa, kuchongwa, au kunakshiwa; hapa “sanamu iliyochongwa” linaeleweka kwa urahisi katika hoja dhidi ya ibada ya sanamu.
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: kwa ustadi na mawazo ya mwanadamu
  rationale: “Ustadi” huonyesha ufundi wa kutengeneza, na “mawazo” huonyesha wazo au ubunifu wa akili unaoongoza utengenezaji.
- source_word: τὸ θεῖον
  choice: Uungu
  rationale: Neno hili pana linarejelea kilicho cha kimungu; katika hoja ya Paulo linamrejelea Mungu wa kweli huku likihifadhi mtindo wa kifalsafa wa hotuba.
theological_decisions:
- issue: Tafsiri ya τὸ θεῖον katika hotuba yenye lugha ya kifalsafa lakini hoja ya kumhusu Mungu mmoja
  choice: Uungu
  alternative: Mungu; hali ya kimungu; Aliye wa Kimungu
  rationale: “Uungu” huhifadhi upana na hali ya kifalsafa ya neno la Kigiriki bila kulifanya kuwa nguvu isiyo na nafsi wala kuingiza istilahi maalumu ya baadaye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata hoja ya Kigiriki kwa uwazi, huku alama ya mkato ikifafanua kuwa dhahabu, fedha, au jiwe vinatajwa kama sanamu iliyotengenezwa na mwanadamu.
