  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: sw
  text: Kwa maana ndani yake tunaishi, tunasonga na tupo, kama hata baadhi ya washairi wenu walivyosema, “Kwa maana sisi pia ni uzao wake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Hudumisha taswira ya kuwa na uhai ndani ya Mungu bila kuibadili kuwa tu ‘kwa uwezo wake’.
- source_word: ζῶμεν
  choice: tunaishi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi kinachomaanisha kuishi.
- source_word: κινούμεθα
  choice: tunatembea
  rationale: Huwasilisha kwa lugha ya kawaida wazo pana la kusonga au kuwa katika mwendo, huku muktadha ukionyesha utegemezi wa viumbe kwa Mungu.
- source_word: ἐσμέν
  choice: tupo
  rationale: Hutafsiri kitenzi cha kuwako kwa usemi wa kawaida wa Kiswahili, bila kukiongezea maana ya kifalsafa kuliko ilivyo lazima.
- source_word: τῶν καθ’ ὑμᾶς ποιητῶν
  choice: washairi wenu
  rationale: Ni Kiswahili cha asili kinachowasilisha washairi waliotoka katika jamii ya wasikilizaji.
- source_word: γένος
  choice: uzao
  rationale: Huhifadhi maana ya nasaba au kizazi katika nukuu ya kishairi, bila kudai uana wa kimungu kwa maana maalumu ya kiteolojia.
theological_decisions:
- issue: Maana ya kuwa ‘ndani yake’
  choice: ndani yake tunaishi, tunatembea na tupo
  alternative: kwa uwezo wake tunaishi, tunasonga na kuwako
  rationale: Muundo wa chanzo umehifadhiwa ili kuacha wazi upeo wa kauli kuhusu utegemezi wa viumbe kwa Mungu, bila kuufafanua kwa mfumo maalumu wa kiteolojia.
- issue: Wanadamu kuitwa uzao wa Mungu
  choice: sisi pia ni uzao wake
  alternative: sisi pia ni watoto wake
  rationale: ‘Uzao’ huakisi γένος na hudumisha mvutano wa nukuu ya mshairi bila kuifanya kauli ya uana wa kiroho au wa wokovu.
translation_notes:
  register: Lugha ni ya kawaida, yenye heshima na inayoeleweka katika Kiswahili Sanifu cha Afrika Mashariki. Mpangilio wa vipashio vitatu umehifadhiwa kwa ajili ya mdundo wa usemi.
