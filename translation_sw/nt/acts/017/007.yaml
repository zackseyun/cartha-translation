id: ACT.17.7
reference: Acts 17:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: sw
  text: Watu hawa, ambao Yasoni amewakaribisha[a], wote wanatenda kinyume na amri za Kaisari[b], wakisema kwamba kuna mfalme mwingine[c]—Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amewapokea” au “amewapa mahali pa kukaa.” Kitenzi cha Kigiriki kinaweza kumaanisha kuwapokea wageni au kuwapa ukarimu.
    reason: lexical_alternative
  - marker: b
    text: Au, “maagizo rasmi.” Neno hili linamaanisha maamuzi au maagizo yenye mamlaka.
    reason: lexical_alternative
  - marker: c
    text: Au, “mfalme tofauti.” Kigiriki kinasema “mfalme mwingine,” na hivyo linaonyesha shtaka la kuwepo kwa mdai mwingine wa utawala badala ya Kaisari.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: amewakaribisha
  rationale: Kitenzi hiki kinaweza kumaanisha kuwapokea watu kama wageni na kuwapa ukarimu. Hali timilifu inaonyesha kwamba Yasoni amekwisha kuwapokea na tendo hilo ndilo msingi wa shtaka.
- source_word: ἀπέναντι
  choice: kinyume na
  rationale: Likifuatiwa na umilikishi, neno hili huonyesha kupingana au kutenda kinyume cha jambo; usemi huu ni wa kawaida na unafaa muktadha wa shtaka.
- source_word: δογμάτων
  choice: amri
  rationale: Katika mazingira haya ya utawala wa Roma, neno hili linamaanisha maamuzi au maagizo rasmi yenye mamlaka. ‘Amri’ ni wazi, yenye hadhi, na inaeleweka kwa urahisi.
- source_word: πράσσουσι
  choice: wanatenda
  rationale: Wakati uliopo unaonyesha mwenendo unaodaiwa kuendelea, na ‘wanatenda’ huhifadhi nguvu ya kitenzi bila kuongeza maana.
- source_word: βασιλέα ἕτερον
  choice: mfalme mwingine
  rationale: βασιλεύς ni ‘mfalme,’ na ἕτερον humtambulisha mdai mwingine wa cheo hicho. Tafsiri hii huhifadhi uzito wa kisiasa wa shtaka.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kishirikishi hiki kinaeleza namna au maudhui ya upinzani wanaodaiwa kufanya. ‘Wakisema’ ni tafsiri ya moja kwa moja isiyoongeza hisia ya mashaka.
- source_word: εἶναι Ἰησοῦν
  choice: kwamba kuna ...—Yesu
  rationale: Muundo huu wa Kiswahili huwasilisha maudhui ya kauli isiyo ya moja kwa moja huku ukihifadhi msisitizo wa mwisho unaomtambulisha Yesu.
- source_word: οὗτοι πάντες
  choice: Watu hawa ... wote
  rationale: Muundo huu huhifadhi nguvu ya kiashiria na shtaka linalowahusisha wote, huku ukiwa wa kawaida katika Kiswahili.
theological_decisions:
- issue: Uzito wa kisiasa wa shtaka kwamba Yesu ni mfalme
  choice: Shtaka limetafsiriwa moja kwa moja kuwa wanamtangaza Yesu kuwa mfalme mwingine.
  alternative: Kutafsiri ‘mfalme’ kwa neno pana kama ‘mtawala’ au ‘kiongozi,’ jambo ambalo lingepunguza uzito wa kisiasa.
  rationale: Matini inaunganisha shtaka hili waziwazi na amri za Kaisari. ‘Mfalme mwingine’ huhifadhi mvutano wa kihistoria na kiteolojia bila kuufanya ufalme huo kuwa wa kisiasa tu wala wa kiroho tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, na yenye hadhi. Muundo wa sentensi unahifadhi msisitizo kwa ‘watu hawa wote,’ huku vistari virefu kabla ya ‘Yesu’ vikihifadhi utambulisho wa mwisho wenye mkazo.
