base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: sw
  text: Basi wakamshika na kumpeleka Areopago[a], wakisema, “Je, tunaweza kujua mafundisho haya mapya unayoyasema ni yapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Areopago’ linaweza kumaanisha kilima chenyewe au baraza lililohusishwa nacho; katika mapokeo ya Kiingereza pia huitwa ‘Mars Hill’ (‘Kilima cha Mars’).
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: wakamshika
  rationale: Kitenzi hiki kinaonyesha walimkamata au walimshika kwa uthabiti ili waende naye, lakini muktadha haulazimishi maana ya kukamatwa rasmi. ‘Wakamshika’ huhifadhi tendo la kimwili bila kuongeza uhasama.
- source_word: τε
  choice: Basi
  rationale: Kiunganishi hiki ni chepesi na kinaendeleza simulizi; ‘Basi’ ni cha kawaida katika Kiswahili na kinaonyesha mwendelezo kutoka mstari uliotangulia.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: kumpeleka Areopago
  rationale: Jina ‘Areopago’ huhifadhi jina la Kigiriki na kutatua kwa lazima ikiwa linamaanisha kilima chenyewe au baraza lililohusishwa nacho.
- source_word: ἤγαγον
  choice: kumpeleka
  rationale: ἄγω humaanisha kuongoza au kupeleka. ‘Kumpeleka’ ni ya asili pamoja na mahali walipomfikisha.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi uhusiano wa kitendo shirikishi kinachotokea pamoja na kumpeleka.
- source_word: Δυνάμεθα γνῶναι
  choice: Je, tunaweza kujua
  rationale: Ni ombi la heshima katika muktadha, lakini muundo wa swali kuhusu uwezekano unabaki wazi katika Kiswahili cha kawaida.
- source_word: καινὴ
  choice: mapya
  rationale: Hutoa maana pana ya kitu kipya kwa wasikilizaji bila kuongeza dhana ya ajabu au isiyojulikana.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: unayoyasema
  rationale: Hili ni badiliko la kawaida na sahihi la muundo tendwa wa Kigiriki kuwa usemi wa Kiswahili; huepuka kauli nzito isiyo ya kawaida kama ‘yanayosemwa na wewe’.
- source_word: διδαχή
  choice: mafundisho
  rationale: ‘Mafundisho’ ni neno la kawaida na linaloeleweka kuliko istilahi ya kitaalamu zaidi kama ‘doktrini’.
theological_decisions:
- issue: Namna Paulo alivyopelekwa Areopago
  choice: Walifanya tendo thabiti la kumshika na kwenda naye, lakini si lazima iwe kukamatwa rasmi
  alternative: Walikuwa wamemkamata kwa nguvu; au walimwalika tu kwa heshima
  rationale: ἐπιλαμβάνομαι inaweza kuwa na nguvu ya kimwili, lakini muktadha wa karibu unaonyesha udadisi zaidi kuliko hukumu au uhasama wa wazi. ‘Wakamshika’ haipunguzi tendo wala kulifanya kuwa kukamatwa rasmi.
- issue: Maana ya Ἄρειος Πάγος
  choice: Jina ‘Areopago’ limetumiwa bila kubainisha kama ni kilima, baraza, au vyote viwili
  alternative: Kilima cha Areopago; au Baraza la Areopago
  rationale: Usemi wa Kigiriki unaweza kutaja mahali au chombo kilichohusishwa na mahali hapo. Tafsiri kuu inalinda utata huo wa kihistoria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘unayoyasema’ umetumiwa badala ya tafsiri tendwa ya moja kwa moja kwa sababu ndio usemi wa asili wa Kiswahili, huku maana ya Kigiriki ikihifadhiwa.
