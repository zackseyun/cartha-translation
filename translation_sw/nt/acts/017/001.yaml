id: ACT.17.1
reference: Acts 17:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: sw
  text: Baada ya kupita katika Amfipoli na Apolonia, walifika Thesalonike, ambako kulikuwa na sinagogi la Wayahudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Baada ya kupita katika
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kufika kwao; usemi huu ni wa kawaida katika Kiswahili na unaonyesha walipitia miji hiyo.
- source_word: δὲ
  choice: —
  rationale: Hapa ni kiunganishi hafifu cha kuendeleza simulizi; kutokitafsiri moja kwa moja kunatoa Kiswahili cha asili bila kupoteza tofauti muhimu.
- source_word: Ἀμφίπολιν
  choice: Amfipoli
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: Ἀπολλωνίαν
  choice: Apolonia
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: ἦλθον
  choice: walifika
  rationale: Katika muktadha wa safari kuelekea mji, 'walifika' hutoa maana ya mwendo na kufikia mahali walikokusudia kwa Kiswahili cha kawaida.
- source_word: εἰς Θεσσαλονίκην
  choice: Thesalonike
  rationale: Jina la mji limetoholewa; pamoja na 'walifika' hakuna haja ya kurudia kihusishi cha kuelekea.
- source_word: ὅπου
  choice: ambako
  rationale: Kielezi rejeshi cha mahali kinachorejelea mji; 'ambako' ni cha kawaida na sahihi.
- source_word: συναγωγὴ
  choice: sinagogi
  rationale: Nomino ya Kigiriki haina kibainishi; Kiswahili hakina vibainishi vinavyolingana moja kwa moja na 'a/the', hivyo 'kulikuwa na sinagogi' huwasilisha kwa kawaida maana isiyoainishwa.
- source_word: τῶν Ἰουδαίων
  choice: la Wayahudi
  rationale: Muundo wa 'la' unaonyesha uhusiano wa sinagogi na jamii ya Wayahudi kwa njia ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Tafsiri ya Ἰουδαίων katika simulizi
  choice: Wayahudi
  alternative: watu wa Kiyahudi; Wayudea
  rationale: Muktadha unahusu jamii ya Kiyahudi iliyohusishwa na sinagogi la Thesalonike, si wakazi wa eneo la Yudea; 'Wayahudi' ni sahihi na ya kawaida.
- issue: Uainisho wa συναγωγὴ isiyo na kibainishi
  choice: kulikuwa na sinagogi
  alternative: kulikuwa na sinagogi lile
  rationale: Kigiriki hakina kibainishi kabla ya συναγωγὴ. Kiswahili hakilazimishi tofauti ya 'a/the'; muundo uliochaguliwa hauongezi dhana ya sinagogi fulani lililokwisha tajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni nyepesi kueleweka huku ikihifadhi mtiririko wa simulizi na kutofafanua kupita kiasi hali ya sinagogi.
