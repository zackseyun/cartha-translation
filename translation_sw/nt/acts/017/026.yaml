  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: sw
  text: Naye kutokana na mtu mmoja alifanya kila taifa la wanadamu liishi juu ya uso wote wa dunia[a], akiwa ameamua nyakati walizowekewa na mipaka ya makao yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “kutokana na damu moja” badala ya “kutokana na mmoja.” Matini kuu inafuata SBLGNT, inayosema “kutokana na mmoja”; neno “mtu” limeongezwa kwa ajili ya uwazi.
    reason: textual_variant
  - marker: b
    text: Au “nyakati zao zilizowekwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: alifanya
  rationale: Kitenzi hiki kina maana pana ya kufanya au kuleta hali fulani; “alifanya” kinadumisha upana huo bila kubainisha kupita kiasi namna ya uumbaji.
- source_word: τε
  choice: Naye
  rationale: Kiunganishi hiki kinaunganisha sentensi na hoja iliyotangulia; “Naye” ni cha asili na chenye hadhi katika Kiswahili.
- source_word: ἐξ ἑνὸς
  choice: kutokana na mtu mmoja
  rationale: Nakala ya SBLGNT inasema kihalisi “kutokana na mmoja.” Neno “mtu” limeongezwa ili kirai kiwe wazi na cha asili kwa Kiswahili, bila kuingiza usomaji wa baadaye wa “damu moja.”
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: kila taifa la wanadamu
  rationale: “Kila taifa” linahifadhi nguvu ya mgawanyo ya πᾶν ἔθνος, huku “la wanadamu” likionyesha kwamba mataifa hayo ni jamii za wanadamu wote.
- source_word: κατοικεῖν
  choice: liishi
  rationale: Hiki ni kitenzi cha kawaida na kinachoeleweka, kinachoonyesha kuishi au kukaa mahali.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: juu ya uso wote wa dunia
  rationale: Tafsiri hii inadumisha taswira ya kibiblia ya “uso wa dunia” na kutoa maana ya eneo lote la dunia.
- source_word: ὁρίσας
  choice: akiwa ameamua
  rationale: Muundo huu unaonyesha tendo la Mungu la kuweka au kuainisha mambo hayo, bila kulifanya neno kuwa la kitaalamu kupita kiasi.
- source_word: προστεταγμένους καιρούς
  choice: nyakati walizowekewa
  rationale: “Nyakati” huonyesha vipindi maalumu, na “walizowekewa” hudumisha wazo kwamba vipindi hivyo vilipangwa kwa ajili ya mataifa hayo.
- source_word: ὁροθεσίας
  choice: mipaka
  rationale: “Mipaka” ni neno la kawaida na sahihi kwa mipaka ya maeneo.
- source_word: τῆς κατοικίας αὐτῶν
  choice: ya makao yao
  rationale: “Makao yao” ni ya asili katika Kiswahili na hudumisha maana ya maeneo ambako mataifa hayo yanaishi.
theological_decisions:
- issue: Kuweka wazi rejeleo linalodokezwa katika ἐξ ἑνὸς
  choice: kutokana na mtu mmoja
  alternative: kutokana na mmoja
  rationale: Nakala ya Kigiriki haitaji “damu,” lakini Kiswahili cha “kutokana na mmoja” peke yake kinaweza kusikika pungufu. “Mtu mmoja” linaweka wazi rejeleo la kibinadamu huku hoja ya asili moja ya wanadamu ikidumishwa.
- issue: Maana ya kiwango cha uamuzi wa Mungu katika nyakati na mipaka
  choice: akiwa ameamua nyakati walizowekewa na mipaka ya makao yao
  alternative: akiwa ameweka nyakati na mipaka ya makao yao
  rationale: Tafsiri iliyochaguliwa inadumisha kwa pamoja ὁρίσας na wazo la προστεταγμένους, bila kueleza zaidi ya maandishi namna uamuzi huo unavyohusiana na uhuru au historia ya mataifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki karibu na sentensi ya Kigiriki lakini umetumiwa kwa namna inayoeleweka kwa wasomaji wa kawaida; taswira ya “uso wote wa dunia” imehifadhiwa.
