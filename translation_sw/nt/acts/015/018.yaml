lexical_decisions:
- source_word: γνωστὰ
  choice: yanayojulikana
  rationale: Kivumishi hiki kimetumika kiarifu katika kishazi kisicho na kitenzi. ‘Yanayojulikana’ ni Kiswahili cha kawaida kinachohifadhi maana ya ‘known’ bila kuongeza wazo la ‘kufanywa yajulikane.’
- source_word: ἀπ’
  choice: tangu
  rationale: Katika usemi wa wakati, ‘tangu’ huonyesha kwa kawaida mwanzo wa kipindi kinachoendelea na ni tafsiri ya asili ya ἀπό hapa.
- source_word: αἰῶνος
  choice: zamani
  rationale: Katika nahau hii ya wakati, neno linaweza kumaanisha wakati wa kale au kipindi kirefu kilichopita. ‘Zamani’ ni fupi, ya kawaida, na haiingizi maana yenye nguvu zaidi ya ‘milele.’
theological_decisions:
- issue: Upeo wa wakati wa kujulikana kwa mambo haya katika kishazi hiki kifupi
  choice: Kutafsiri kuwa mambo haya yanajulikana tangu zamani bila kupanua kauli kuwa fundisho la kujua tangu milele.
  alternative: yanayojulikana tangu milele; au ‘anayefanya mambo haya yajulikane tangu zamani’
  rationale: 'Maandishi ya SBLGNT ni mafupi sana: γνωστὰ ἀπ’ αἰῶνος. Tafsiri inadumisha ufupi huo na kutokuongeza maneno ya mapokeo marefu ya maandishi au hitimisho la kiteolojia. Tanbihi inahifadhi tofauti hizo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi umehifadhiwa kwa sababu mstari huu unaendeleza sentensi iliyoanza katika mstari uliotangulia.
