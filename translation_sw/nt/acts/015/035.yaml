source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: sw
  text: Lakini Paulo na Barnaba walikaa Antiokia[a], wakifundisha na kuhubiri[c] neno la Bwana[b], pamoja na wengine wengi pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikaa huko kwa muda fulani.” Kitenzi cha Kigiriki kinaweza kusisitiza kubaki huko kwa kipindi fulani.
    reason: lexical_alternative
  - marker: b
    text: Au, “ujumbe wa Bwana.” “Neno la Bwana” ni usemi unaotumiwa mara nyingi katika kitabu cha Matendo kumaanisha ujumbe wa Bwana.
    reason: lexical_alternative
  - marker: c
    text: Au, “kutangaza habari njema.” Kitenzi cha Kigiriki kinamaanisha kutangaza habari njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: walikaa
  rationale: Kitenzi hiki katika hali ya wakati usiotimilika kinaonyesha kuendelea kukaa au kutumia muda mahali fulani; “walikaa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kudumu kwa kipindi.
- source_word: διδάσκοντες
  choice: wakifundisha
  rationale: Muundo huu unaonyesha tendo lililoendelea sambamba na kukaa kwao Antiokia.
- source_word: εὐαγγελιζόμενοι
  choice: kutangaza habari njema
  rationale: Kitenzi kinamaanisha kutangaza habari njema; usemi huu ni wazi kwa wasomaji wa sasa na hauhitaji istilahi nzito ya kidini.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: pamoja na wengine wengi pia
  rationale: Huhifadhi wazo kwamba Paulo na Barnaba hawakufanya huduma hii peke yao, na “pia” huonyesha nguvu ya nyongeza ya καί.
- source_word: λόγον
  choice: neno
  rationale: Ingawa λόγος inaweza kumaanisha “ujumbe,” “neno” huhifadhi usemi unaojirudia katika Matendo, “neno la Bwana,” na mwendelezo wake wa kifasihi.
- source_word: κυρίου
  choice: Bwana
  rationale: Jina la heshima κύριος limetafsiriwa kwa kawaida kuwa “Bwana,” bila kufafanua zaidi rejeleo ambalo Kigiriki hakilifafanui wazi.
theological_decisions:
- issue: Rejeleo la “Bwana” katika “neno la Bwana”
  choice: Bwana
  alternative: Bwana Yesu; au Mungu kwa maana pana zaidi
  rationale: Katika Matendo, “Bwana” mara nyingi linaweza kumwelekea hasa Yesu, lakini kifungu cha Kigiriki kinatumia tu jina la heshima κύριος. Tafsiri hailazimishi ufafanuzi usiotolewa na matini.
- issue: Uhusiano wa “neno la Bwana” na vitendo viwili
  choice: wakifundisha na kutangaza habari njema ya neno la Bwana
  alternative: wakifundisha neno la Bwana na kutangaza habari njema
  rationale: Kigiriki kinaweka τὸν λόγον τοῦ κυρίου baada ya vishiriki vyote viwili, hivyo inaweza kueleweka kuwa ndiyo maudhui ya kufundisha na kutangaza. Muundo uliochaguliwa huhifadhi uhusiano huo bila kuongeza maudhui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. “Habari njema” imetumiwa badala ya istilahi ya kikanisa pekee, huku “neno la Bwana” likihifadhiwa kwa mwendelezo wa kifasihi na kitheolojia katika Matendo.
