translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “aliona ni vema” unatoa maana ya nahau ya Kigiriki kwa uasilia zaidi kuliko tafsiri ya neno kwa neno “ilionekana kuwa vema kwa Sila.”
