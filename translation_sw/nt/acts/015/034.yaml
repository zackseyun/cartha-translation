translation:
  language: sw
  text: Lakini[a] Sila aliona ni vema kubaki huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupatikani katika baadhi ya hati za mapema za Kigiriki, kutia ndani Sinaiticus na Vaticanus za karne ya nne, wala katika tafsiri za kale za Kikopti; pia haupatikani katika Papirasi 74 ya karne ya saba. Unapatikana katika mapokeo ya hati nyingi za Kibizanti, baadhi ya hati za baadaye za Kialeksandria na za Magharibi, na mapokeo ya Kilatini na Kisiria. Huenda uliongezwa na mwandishi wa baadaye ili kueleza jinsi Sila alivyobaki Antiokia na kujiunga na Paulo katika mstari wa 40, ingawa mstari wa 33 unasema kwamba yeye na Yuda waliondoka.
    reason: textual_critical
lexical_decisions:
- source_word: ἔδοξε (δοκέω)
  choice: aliona ni vema
  rationale: Muundo wa Kigiriki wenye mtendewa τῷ Σίλᾳ una maana ya kwamba Sila aliona jambo hilo kuwa jema au aliamua hivyo. Kauli hii ni ya asili katika Kiswahili na inadumisha wazo la tathmini bila kuifanya kuwa azimio kali zaidi ya chanzo.
- source_word: ἐπιμεῖναι (ἐπιμένω)
  choice: kubaki
  rationale: Katika muktadha huu kitenzi kina maana ya kuendelea kukaa mahali fulani; “kubaki” ni wazi, cha sasa, na kinafaa kwa kurejelea Antiokia.
- source_word: αὐτοῦ
  choice: huko
  rationale: Hapa neno hilo limetumiwa kama kielezi cha mahali na linarejelea Antiokia, mahali palipotajwa katika muktadha.
- source_word: δέ
  choice: Lakini
  rationale: Kiunganishi kinaonyesha tofauti kati ya kuondoka kulikotajwa katika mstari uliotangulia na uamuzi wa Sila kubaki.
