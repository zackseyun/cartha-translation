base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: sw
  text: Naye Mungu[a], ajuaye mioyo, aliwathibitisha kwa kuwapa Roho Mtakatifu kama alivyotupa sisi pia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu, mjuzi wa mioyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδιογνώστης
  choice: ajuaye mioyo
  rationale: Kiambatano hiki adimu humaanisha anayejua mioyo. Kishazi cha Kiswahili ni cha asili na kinahifadhi sifa ya Mungu ya kujua utu wa ndani; wingi “mioyo” unafaa kwa matumizi ya Kiswahili na muktadha wa watu wengi.
- source_word: θεὸς
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa θεός; καρδιογνώστης linaeleza Mungu kwa namna ya kiambatisho.
- source_word: ἐμαρτύρησεν
  choice: aliwashuhudia
  rationale: Kitenzi kinahifadhi maana ya kutoa ushahidi au uthibitisho kwa ajili yao, katika hoja ya Petro kwamba tendo la Mungu liliwathibitisha.
- source_word: αὐτοῖς
  choice: wa-
  rationale: Kiwakilishi cha yambwa katika “aliwashuhudia” kinarejelea wao bila kuongeza utambulisho wa “Mataifa,” ambao hutolewa na muktadha.
- source_word: δοὺς
  choice: kwa kuwapa
  rationale: Muundo huu unaonyesha wazi kwamba kumpa Roho Mtakatifu ndiko kulikokuwa njia ambayo Mungu aliwashuhudia.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, la sasa, na lenye heshima katika Kiswahili.
- source_word: καθὼς καὶ ἡμῖν
  choice: kama alivyotupa sisi pia
  rationale: Kigiriki kinaacha kitenzi cha kutoa kieleweke kutokana na δοὺς; Kiswahili hukirejesha ili kulifanya linganisho liwe wazi, huku “pia” ikihifadhi καί.
theological_decisions:
- issue: Kutowabagua watu kunakodhihirishwa na zawadi ya Roho
  choice: Aya inaonyesha kwamba ushuhuda wa Mungu kwao ulikuwa kuwapa Roho Mtakatifu kama alivyowapa “sisi” pia.
  alternative: Kutaja wazi “Mataifa” badala ya “wao.”
  rationale: αὐτοῖς ni kiwakilishi tu; muktadha ndio unaowatambulisha kuwa watu wa Mataifa. Tafsiri haiongezi maelezo ya kikabila au hali ya agano yasiyosemwa moja kwa moja katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ajuaye” ni mtindo wa kifasihi unaoeleweka sana katika maandiko, na “mioyo” huwasilisha utu wa ndani bila kufafanua zaidi ya Kigiriki.
