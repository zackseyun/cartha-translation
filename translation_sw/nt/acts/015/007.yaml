id: ACT.15.7
reference: Acts 15:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: sw
  text: Baada ya mjadala mkubwa kufanyika, Petro akasimama na kuwaambia, “Ndugu,[a] ninyi mnajua kwamba tangu siku za zamani[b] Mungu alifanya uchaguzi miongoni mwenu ili kwa kinywa changu watu wa mataifa[c] wasikie neno la Injili na kuamini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “Wanaume, ndugu.” Hii ni salamu ya Kigiriki katika wingi wa kiume; “Ndugu” ni salamu ya kawaida ya Kiswahili.
    reason: lexical_alternative
  - marker: b
    text: Au, “tangu siku za awali.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mataifa.” Katika muktadha huu ni watu wasio Wayahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: Baada ya mjadala mkubwa kufanyika
  rationale: Hili linaonyesha hali iliyotangulia kabla Petro hajasema. “Mjadala mkubwa” hudumisha wazo la majadiliano mazito yenye kutofautiana bila kudokeza uhasama kupita kiasi.
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Hutafsiri kwa njia ya kawaida kitendo cha Petro kusimama kabla ya kuzungumza.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ndugu
  rationale: Hii ni salamu ya kawaida kwa kundi na hudumisha lugha ya kifamilia kwa Kiswahili cha asili. Umbo la Kigiriki lenye jinsia ya kiume linaelezwa katika tanbihi badala ya kutumia kauli ngumu “wanaume ndugu” katika matini.
- source_word: ἐπίστασθε
  choice: ninyi mnajua
  rationale: Hutoa moja kwa moja maana ya kuwa na habari au ufahamu ambao tayari wasikilizaji walikuwa nao.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: tangu siku za zamani
  rationale: Hufuata taswira ya Kigiriki na kuelekeza kwenye kipindi cha mapema kilichojulikana kwa wasikilizaji.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Hudumisha wazo la uchaguzi ndani ya kundi lililokuwapo au lililowakilishwa bila kulazimisha maana ya “kutoka miongoni mwenu.”
- source_word: ἐξελέξατο
  choice: alichagua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha kuchagua.
- source_word: διὰ τοῦ στόματός μου
  choice: kwa kinywa changu
  rationale: Hudumisha sitiari ya wazi ya Petro kuwa chombo ambacho kupitia usemi wake ujumbe ulisikika.
- source_word: τὰ ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha wa baraza la Yerusalemu, kauli hii inawahusu hasa watu wasio Wayahudi, huku ikidumisha uhusiano wa neno hilo na “mataifa.”
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: neno la Injili
  rationale: Hudumisha muundo wa Luka na istilahi ya Kikristo iliyoeleweka, huku “neno” hapa likiwa na maana ya ujumbe.
- source_word: πιστεῦσαι
  choice: kuamini
  rationale: Huratibu kwa urahisi na “walisikie” na huepuka kuongeza ufafanuzi wa kitheolojia usio katika kitenzi chenyewe.
theological_decisions:
- issue: Salamu yenye jinsia ya kiume Ἄνδρες ἀδελφοί kwa kusanyiko la uwakilishi
  choice: Ndugu
  alternative: Wanaume ndugu; Ndugu wanaume
  rationale: “Ndugu” ni salamu ya kawaida na yenye hadhi katika Kiswahili. Hailazimishi kuongeza “dada,” jambo lisilo wazi katika Kigiriki, wala kutumia kauli isiyo ya kawaida. Umbo halisi la kiume limehifadhiwa katika tanbihi.
- issue: Maana ya τὰ ἔθνη katika muktadha wa kuingia kwa wasio Wayahudi katika jumuiya ya waamini
  choice: watu wa mataifa
  alternative: mataifa; watu wasio Wayahudi
  rationale: Tafsiri hii hudumisha upana wa maana ya “mataifa” na wakati huohuo huonyesha kuwa hapa inarejelea watu wa mataifa hayo, yaani wasio Wayahudi. Tanbihi inaweka maana hiyo wazi bila kufuta kabisa taswira ya mataifa.
- issue: Yule aliyechaguliwa katika kifungu ἐν ὑμῖν ἐξελέξατο ὁ θεὸς
  choice: Mungu alichagua miongoni mwenu
  alternative: Mungu alinichagua kutoka miongoni mwenu
  rationale: Kigiriki hakitaji moja kwa moja kiwakilishi “mimi” kama mtendewa wa kitenzi, ingawa “kwa kinywa changu” humwelekeza msomaji kwa Petro. Tafsiri imehifadhi mkazo na mvutano huo badala ya kuongeza “alini-” kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo wa sentensi unabaki karibu na Kigiriki, lakini viunganishi na mpangilio vimewekwa kwa namna ya kawaida ya Kiswahili. Alama za tanbihi zimewekwa mara moja kila moja mahali panapohusika.
