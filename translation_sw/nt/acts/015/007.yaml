  source_fidelity: Rasimu inafuata kwa karibu mpangilio na maana ya Kigiriki. Hata hivyo, “Mungu alichagua miongoni mwenu ili” huacha kitenzi cha Kiswahili bila kijalizo na hauelezi kwa kawaida sintaksia ya Kigiriki, ambamo Petro ndiye anayeelekezwa kwa namna ya kisarufi isiyo dhahiri. “Mungu alifanya uchaguzi miongoni mwenu” huhifadhi usemi usiotaja Petro moja kwa moja kama mtendewa, huku ukifanya sentensi ieleweke. Pia, baada ya “ili,” kitenzi kinahitaji umbo la utegemezi “wasikie,” si “walisikie.”
  naturalness: Kiswahili ni cha heshima na kinaeleweka kwa ujumla. Marekebisho yanayohitajika ni kutumia “alifanya uchaguzi miongoni mwenu” na “wasikie.” “Watu wa mataifa” ni sahihi katika muktadha na huweka wazi kwamba τὰ ἔθνη inawahusu watu, si nchi zenyewe.
