  text: 'Na maneno ya manabii yanakubaliana na jambo hili, kama ilivyoandikwa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi cha kawaida kinachoendeleza hoja ya Yakobo kwa kuleta ushahidi wa manabii.
- source_word: τούτῳ
  choice: na jambo hili
  rationale: Kiwakilishi cha kuonyesha katika hali ya dative kinarejelea kwa upana jambo lililotangulia; Kiswahili cha kawaida hutumia ‘kukubaliana na’. Neno ‘jambo’ linawezesha marejeo ya ‘hili’ bila kulibana kwa tafsiri maalumu.
- source_word: συμφωνοῦσιν
  choice: yanakubaliana
  rationale: Kitenzi cha wakati uliopo kina maana ya kuwa katika upatano; ‘yanakubaliana’ ni cha asili na wazi katika Kiswahili.
- source_word: οἱ λόγοι
  choice: maneno
  rationale: Hurejelea matamko ya kinabii yaliyohifadhiwa katika Maandiko; ‘maneno’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: τῶν προφητῶν
  choice: ya manabii
  rationale: Genitivi inaonyesha kwamba haya ni maneno ya manabii, kwa mtindo wa kawaida wa Kiswahili.
- source_word: καθὼς
  choice: kama
  rationale: Hutambulisha nukuu ya Maandiko kwa kuonyesha ulinganifu na jambo lililotangulia; ‘kama’ ni sahihi na ya asili.
- source_word: γέγραπται
  choice: ilivyoandikwa
  rationale: Kauli timilifu tendwa ni fomula ya kawaida ya kutambulisha nukuu ya Maandiko; ‘kama ilivyoandikwa’ ni usemi wa Kiswahili ulio wazi na wenye hadhi.
theological_decisions:
- issue: Kirejelewa cha τούτῳ katika hotuba ya Yakobo
  choice: ‘jambo hili,’ likirejelea kwa upana jambo au taarifa iliyotangulia bila kuitaja kwa tafsiri maalumu
  alternative: kuwageukia kwa Mataifa; taarifa ya Petro; kusudi hili la Mungu
  rationale: Kigiriki hakitajii kirejelewa kwa usahihi zaidi. Tafsiri inadumisha upana huo badala ya kuamua kimya-kimya ni ufafanuzi gani wa kiteolojia unaokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umetanguliza ‘maneno ya manabii’ kwa mtiririko wa asili wa Kiswahili, huku ‘jambo hili’ ikihifadhi marejeo mapana ya τούτῳ.
