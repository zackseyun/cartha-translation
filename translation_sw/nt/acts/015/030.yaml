base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: sw
  text: Basi, baada ya kuagwa[a], walishuka[b] mpaka Antiokia. Baada ya kukusanya umati[c], wakawapa barua hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya kuruhusiwa kuondoka” au “baada ya kuachiliwa.” Neno la Kigiriki linaweza kumaanisha kuagwa au kuruhusiwa kuondoka rasmi.
    reason: lexical_alternative
  - marker: b
    text: “Walishuka” linaakisi mwelekeo wa kitenzi cha Kigiriki, huenda kwa sababu Yerusalemu iko sehemu yenye mwinuko kuliko Antiokia.
    reason: cultural_note
  - marker: c
    text: Au “kusanyiko” au “jumuiya.” Neno hili linarejelea kundi lililokusanyika huko Antiokia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: baada ya kuagwa
  rationale: Kitenzi hiki kinaonyesha kuwa waliruhusiwa kuondoka rasmi na kutumwa safarini; “kuagwa” ni ya asili katika Kiswahili na inafaa muktadha bila kulazimisha maana ya kufukuzwa au kufunguliwa.
- source_word: κατῆλθον
  choice: walishuka kwenda
  rationale: Huhifadhi maana ya mwelekeo wa kushuka, inayolingana na safari kutoka Yerusalemu yenye mwinuko mkubwa kwenda Antiokia.
- source_word: συναγαγόντες
  choice: walipokuwa wamekusanya
  rationale: Huonyesha kwamba kukusanya kulitangulia kuwasilishwa kwa barua, huku sentensi ikiendelea kwa Kiswahili cha kawaida.
- source_word: τὸ πλῆθος
  choice: umati
  rationale: Ni tafsiri pana inayohifadhi kutotajwa wazi kama kundi hilo lilikuwa kusanyiko rasmi au jumuiya yote ya waamini.
- source_word: ἐπέδωκαν
  choice: wakawasilisha
  rationale: Huonyesha kukabidhi barua kwa namna rasmi zaidi kuliko neno la jumla “kutoa.”
- source_word: ἐπιστολήν
  choice: barua
  rationale: Ni neno la kawaida na la sasa la Kiswahili kwa hati hii, bila mtindo mzito wa kikanisa.
