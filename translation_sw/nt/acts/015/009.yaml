  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: sw
  text: Naye hakufanya tofauti yoyote kati yetu na wao, akiwa ameitakasa mioyo yao kwa imani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia imani.” Dativi ya Kigiriki inaweza kuonyesha njia au chombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν ... διέκρινεν
  choice: hakufanya tofauti yoyote
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida nahau ya Kigiriki yenye maana ya kutotofautisha au kutobagua kati ya makundi hayo.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: kati yetu na wao
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili unaohifadhi pande zote za ulinganisho.
- source_word: καθαρίσας
  choice: bali alisafisha
  rationale: Kishiriki cha aoristi kinaweza kueleza tendo linaloambatana na msingi wa kauli kuu. 'Bali' huonyesha kwamba Mungu hakuwatofautisha, kama inavyoonekana kwa kuisafisha mioyo yao pia, bila kulazimisha mpangilio mkali wa wakati.
- source_word: τῇ πίστει
  choice: kwa imani
  rationale: Dativi hapa inaeleweka vizuri kama njia au chombo; 'kwa imani' ni usemi mfupi, wa kawaida, na unaohifadhi uwezekano huo.
- source_word: τὰς καρδίας αὐτῶν
  choice: mioyo yao
  rationale: '''Mioyo'' huhifadhi taswira ya Kigiriki ya utu wa ndani, na ''yao'' inawarejelea watu wa mataifa wanaozungumziwa.'
theological_decisions:
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Katika muktadha huu πίστις inaeleweka kwa kawaida kuwa imani ambayo kwayo Mungu aliisafisha mioyo yao; hakuna kiashirio cha kutosha cha kuchagua 'uaminifu'.
- issue: Uhusiano wa καθαρίσας na kitenzi kikuu
  choice: bali alisafisha
  alternative: akiisha kuisafisha; kwa kuisafisha
  rationale: Kigiriki kina kishiriki cha aoristi ambacho kinaweza kusomwa kama tendo lililotangulia au tendo linalothibitisha kutokuwepo kwa tofauti. Tafsiri kuu inatoa Kiswahili cha kawaida bila kufunga kabisa uhusiano huo wa kimantiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Hakufanya tofauti yoyote' ni wazi kwa wasomaji wa kawaida; 'mioyo yao' huhifadhi lugha ya kibiblia bila kuwa ya kizamani.
