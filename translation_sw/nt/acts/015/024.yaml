  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: sw
  text: Kwa kuwa tumesikia kwamba baadhi ya watu kutoka kwetu waliondoka na kuwasumbua kwa maneno, wakiivuruga nafsi zenu, ambao hatukuwapa maagizo,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao hatukuwapa amri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Kwa kuwa
  rationale: Huanzisha sababu ya taarifa inayofuata kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἠκούσαμεν
  choice: tumesikia
  rationale: Kauli hii inaonyesha habari iliyopokewa ambayo bado ina umuhimu wakati wa kuandika barua.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: baadhi ya watu waliondoka kwetu
  rationale: Inahifadhi wazo la watu fulani kutoka katika kundi la Yerusalemu kuondoka na kwenda kwa waamini wengine.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: kuwasumbua kwa maneno yao
  rationale: Inawasilisha wazi kwamba maneno yao ndiyo yaliyosababisha fadhaa, bila kubainisha zaidi maudhui ambayo Kigiriki hakuyataji hapa.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: wakivuruga mioyo yenu
  rationale: Kitenzi kina nguvu ya kuvuruga au kupindua hali ya ndani; 'mioyo yenu' ni usemi wa asili wa Kiswahili unaorejelea utu wa ndani, si hisia peke yake.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: ingawa hatukuwaagiza
  rationale: Kiwakilishi rejeshi kinawarejelea watu hao; muundo wa Kiswahili unaweka wazi kuwa hawakuwa na agizo au idhini ya wale walioandika.
theological_decisions:
- issue: Iwapo kutaja wazi kwamba waleta fujo hawakuwa na agizo la viongozi wa Yerusalemu
  choice: ingawa hatukuwaagiza
  alternative: ambao hatukuwaamuru
  rationale: Kigiriki kinakataa wazi kwamba watu hao walipewa maagizo. Tafsiri inadumisha hoja hiyo bila kuongeza madai mengine kuhusu mamlaka yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Mioyo yenu' limetumiwa kwa maana ya utu wa ndani kwa ujumla, si hisia pekee. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
