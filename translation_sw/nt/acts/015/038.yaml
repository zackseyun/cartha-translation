base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: sw
  text: Lakini Paulo alisisitiza kwamba wasimchukue pamoja nao mtu huyo[a], ambaye alikuwa amewaacha huko Pamfilia na hakuandamana nao kwenda kwenye kazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu huyo aliyekuwa amewatelekeza huko Pamfilia.” Kitenzi cha Kigiriki kinaweza kuwa na maana kali zaidi, lakini maandishi makuu yanatumia “aliwaacha” ili yasizidishe maana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: alisisitiza
  rationale: Wakati usiotimilika wa ἀξιόω katika muktadha wa mabishano unaonyesha msimamo thabiti wa Paulo, si pendekezo la kawaida tu.
- source_word: ἀποστάντα
  choice: alikuwa amejitenga nao
  rationale: Kitenzi ἀφίσταμαι humaanisha kujiondoa au kujitenga. Tafsiri hii inadumisha kauli ya tukio bila kuamua moja kwa moja kwamba alikuwa amewatoroka au kuwaacha kwa usaliti.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: amejitenga nao huko Pamfilia
  rationale: Kirai cha kwanza kinaonyesha kujitenga na Paulo na Barnaba, na cha pili kinahusisha tukio hilo na Pamfilia. Kiswahili cha kawaida hutumia “huko Pamfilia” kwa mahali pa kujitenga, huku tanbihi ikihifadhi uwezekano wa kusoma “kutoka Pamfilia.”
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: hakuwa ameenda pamoja nao
  rationale: Katika muktadha wa safari, συνέρχομαι ina maana ya kuandamana au kwenda pamoja; usemi huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: εἰς τὸ ἔργον
  choice: kwenye kazi
  rationale: Huhifadhi maana halisi ya jukumu lililokuwa mbele yao bila kuongeza neno la kiufafanuzi kama “umishonari.”
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: kwamba wasimchukue pamoja nao mtu huyo
  rationale: Muundo huu unaonyesha jambo ambalo Paulo alisisitiza lisifanyike, na “mtu huyo” huhifadhi nguvu ndogo ya kiashirio ya τοῦτον.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa ulinganifu bora: unasomeka kwa urahisi huku ukihifadhi msisitizo wa Paulo na utata wa ἀποστάντα.'
