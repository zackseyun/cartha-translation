id: ACT.15.10
reference: Acts 15:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: sw
  text: Basi sasa, kwa nini mnamjaribu Mungu kwa kuweka nira[a] shingoni mwa wanafunzi, ambayo wala mababu zetu wala sisi hatukuweza kuibeba?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nira” hapa ni sitiari ya wajibu unaowekwa juu ya mtu; katika muktadha huu inahusu masharti yanayowekwa juu ya wanafunzi.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: Basi sasa
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia na pia mpito wa sasa, kwa Kiswahili cha kawaida.
- source_word: τί πειράζετε τὸν θεόν
  choice: kwa nini mnamjaribu Mungu
  rationale: Swali la balagha linahifadhi maana ya kumtia Mungu katika jaribio au kumpima.
- source_word: ἐπιθεῖναι
  choice: kwa kuweka
  rationale: Inaonyesha njia ambayo tendo la kumjaribu Mungu linafanywa, bila kuongeza ufafanuzi usiokuwapo katika matini.
- source_word: ζυγὸν
  choice: nira
  rationale: Inahifadhi sitiari halisi ya kifaa kinachowekwa kwa mnyama ili kubeba au kuvuta mzigo, badala ya kuifasiri moja kwa moja kuwa wajibu au mzigo.
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: shingoni mwa wanafunzi
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi picha ya nira kuwekwa juu ya shingo za wanafunzi.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: wala mababu zetu wala sisi
  rationale: Mababu zetu hurejelea vizazi vya awali kwa uwazi na kwa lugha ya kawaida, huku muundo wa wala...wala ukihifadhi ukanushi wenye pande mbili.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: hatukuweza kuibeba
  rationale: Inaeleza kutokuwa na uwezo wa kubeba nira na kuhifadhi mwendelezo wa sitiari.
theological_decisions:
- issue: Maana ya sitiari ya nira
  choice: Nira imeachwa kama sitiari ya wajibu unaowekwa juu ya wanafunzi.
  alternative: Kuitaja wazi kuwa Sheria yote ya Musa, au kuifafanua kwa ufinyu kuwa tohara na masharti yanayoandamana nayo.
  rationale: Muktadha unahusu masharti yanayowekwa kwa waamini wa Mataifa, lakini aya yenyewe haisemi kwa uwazi upeo kamili wa nira hiyo; tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; sitiari ya nira imehifadhiwa na kufafanuliwa kwa tanbihi.
