  footnotes:
  - marker: a
    text: Au, “mataifa yote.” Neno la Kigiriki ἔθνη linaweza kumaanisha “watu wa mataifa” au “mataifa”; katika muktadha wa Mkutano wa Yerusalemu, linaelekea kuwahusu wasio Wayahudi.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “ambao jina langu limeitwa juu yao.”
    reason: lexical_alternative
  - marker: c
    text: Maneno haya yanatoa mwangwi wa Amosi 9:12 katika umbo linalopatikana katika Maandiko ya Kigiriki, ambapo msisitizo unawekwa kwa mataifa/watu wa mataifa wanaoitwa kwa jina la Bwana.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: ili
  rationale: Huanzisha kusudi au matokeo yanayokusudiwa; “ili” ni ya kawaida na sahihi katika Kiswahili.
- source_word: ἐκζητήσωσιν
  choice: wamtafute
  rationale: Huwasilisha tendo la kumtafuta Bwana bila kulazimisha maana ya mkazo ambayo kiambishi cha kitenzi kinaweza kuwa nayo.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: wanadamu waliosalia
  rationale: “Waliosalia” huhifadhi wazo la mabaki, na “wanadamu” ni rejeo jumuishi lisilo la kijinsia.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika muktadha huu wa nukuu ya kinabii.
- source_word: πάντα τὰ ἔθνη
  choice: watu wote wa mataifa
  rationale: Katika muktadha wa Mkutano wa Yerusalemu, maneno haya yanawahusu wasio Wayahudi; “watu wa mataifa” ni Kiswahili cha kawaida cha kibiblia na pia huhifadhi uhusiano na maana halisi ya “mataifa.”
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: ambao jina langu limeitwa juu yao
  rationale: Huhifadhi kwa makusudi nahau ya Kigiriki na wazo la watu kutambulishwa kuwa mali ya Bwana; ufafanuzi wa Kiswahili cha kawaida zaidi umetolewa katika tanbihi.
- source_word: λέγει κύριος
  choice: asema Bwana
  rationale: Ni mtindo wa kawaida wa taarifa ya kinabii na huhifadhi wakati uliopo wa Kigiriki.
- source_word: ποιῶν ταῦτα
  choice: anayefanya mambo haya
  rationale: Kishazi hiki humwelezea Bwana na kuhifadhi wazo la utendaji wake linaloendelea.
theological_decisions:
- issue: Maana ya ἔθνη katika muktadha wa kuingizwa kwa wasio Wayahudi
  choice: watu wote wa mataifa
  alternative: mataifa yote
  rationale: Muktadha wa Matendo 15 unalenga kuingizwa kwa wasio Wayahudi, lakini uchaguzi huu pia huhifadhi maana ya msingi ya “mataifa” bila kuficha upana wa nukuu ya kinabii.
- issue: Nahau ya jina la Bwana kuitwa juu ya watu
  choice: jina langu limeitwa juu yao
  alternative: wanaoitwa kwa jina langu
  rationale: Tafsiri kuu inahifadhi umbo na mvutano wa nahau ya Kigiriki, ambayo huonyesha kumilikiwa au kutambulishwa na jina la Mungu; tanbihi hutoa namna ya kawaida zaidi ya kuieleza.
- issue: Lugha jumuishi ya ἀνθρώπων
  choice: wanadamu
  alternative: watu
  rationale: Rejeo ni kwa jamii ya binadamu kwa ujumla, si wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Watu wa mataifa” limetumiwa badala ya neno lenye uwezekano wa kusikika la kiufundi zaidi, huku nahau ya jina kuitwa juu yao ikihifadhiwa na kufafanuliwa katika tanbihi.
