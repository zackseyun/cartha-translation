language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: sw
  text: 'Ndipo mitume na wazee, pamoja na kanisa lote, wakaona kuwa ni vema kuwachagua wanaume kutoka miongoni mwao na kuwatuma Antiokia pamoja na Paulo na Barnaba: Yuda aliyeitwa Barsaba, na Sila, wanaume waliokuwa viongozi miongoni mwa ndugu.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaume waliokuwa wakiongoza miongoni mwa ndugu.”
    reason: lexical_alternative
  - marker: b
    text: Neno “ndugu” hapa huenda linamaanisha jumuiya pana ya waamini, kutia ndani wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: wakaona kuwa ni vema
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha uamuzi wa pamoja baada ya kutafakari, bila kuufanya lazima uwe amri rasmi.
- source_word: πρεσβυτέροις
  choice: wazee
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika muktadha wa uongozi wa kanisa.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: pamoja na kanisa lote
  rationale: Linahifadhi ushiriki wa jumuiya yote ya waamini pamoja na mitume na wazee.
- source_word: ἐκλεξαμένους ἄνδρας
  choice: kuwachagua wanaume
  rationale: Muundo wa kitenzi-jina umeelezwa kwa kawaida kwa Kiswahili, huku ἄνδρας ikitafsiriwa kwa usahihi kama wanaume.
- source_word: ἐξ αὐτῶν
  choice: kutoka miongoni mwao
  rationale: Inaonyesha wazi kwamba wajumbe hao walichaguliwa kutoka ndani ya jumuiya yenyewe.
- source_word: πέμψαι
  choice: kuwatuma
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja katika muktadha wa kutuma wajumbe.
- source_word: καλούμενον
  choice: aliyeitwa
  rationale: Inahifadhi maelezo ya jina jingine la Yuda kwa Kiswahili cha kawaida.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: wanaume waliokuwa viongozi miongoni mwa ndugu
  rationale: Inaonyesha kwamba watu hawa walitambuliwa kuwa na uongozi katika jumuiya, bila kugeuza kauli hiyo kuwa jina maalumu la cheo.
- source_word: ἀδελφοῖς
  choice: ndugu
  rationale: Neno la Kiswahili ‘ndugu’ linafaa kwa lugha ya kifamilia ya jumuiya ya waamini na linaweza kutumiwa kwa kundi linalojumuisha wanawake pia.
theological_decisions:
- issue: Kiwango cha ushiriki wa kanisa lote katika uamuzi
  choice: Kanisa lote limetajwa pamoja na mitume na wazee katika kuona kuwa hatua hiyo ni njema.
  alternative: Mitume na wazee pekee ndio walioamua rasmi, huku kanisa likiwapo tu.
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ kwa kawaida inahusisha kanisa lote katika tendo linalosimuliwa. Tafsiri haiongezi mfumo maalumu wa utawala wa kanisa.
- issue: Maana ya ἀδελφοῖς
  choice: ndugu katika matini kuu, kwa maelezo kwamba hapa huenda inamaanisha jumuiya pana ya waamini.
  alternative: ndugu wa kiume na wa kike; waamini
  rationale: Neno la Kigiriki lina umbo la kiume la wingi lakini katika matumizi ya Kikristo linaweza kuiwakilisha jumuiya nzima. Kiswahili ‘ndugu’ kinahifadhi taswira ya kifamilia bila kuficha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo ‘wakaona kuwa ni vema’ ni wa kawaida na huhifadhi wazo la tathmini na uamuzi wa pamoja; majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili.
