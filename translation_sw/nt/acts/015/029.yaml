  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: sw
  text: mjiepushe na vyakula vilivyotolewa dhabihu kwa sanamu[a], na damu, na nyama ya wanyama walionyongwa[b], na uasherati[c]. Mkijilinda na mambo hayo, mtafanya vema. Kwaherini[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vilivyotolewa dhabihu kwa sanamu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vitu vilivyonyongwa.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki lililotafsiriwa “uasherati” linaweza kueleweka kwa maana pana, ingawa baadhi hulielewa hapa kwa maana maalumu zaidi kwa kuhusianisha agizo hili na makatazo ya Walawi.
    reason: alternative_reading
  - marker: d
    text: Au, “Iweni na afya.” Neno la Kigiriki ni fomula ya kawaida ya kufunga barua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: mjitenge na
  rationale: Kitenzi hiki kinaeleza agizo la kujiepusha na mambo yaliyotajwa. “Mjitenge na” ni Kiswahili cha kawaida na chenye nguvu inayofaa katika muktadha huu.
- source_word: εἰδωλοθύτων
  choice: vyakula vilivyotolewa dhabihu kwa sanamu
  rationale: Neno hilo humaanisha vitu vilivyotolewa katika ibada ya sanamu, hasa chakula au nyama. Tafsiri hii inaweka wazi maana ya kimuktadha bila kuifanya kuwa nyama pekee.
- source_word: αἵματος
  choice: damu
  rationale: Tafsiri ya moja kwa moja inalinda ufupi wa Kigiriki na haiongezi maelezo ya kimuktadha yasiyosemwa wazi.
- source_word: πνικτῶν
  choice: vitu vilivyonyongwa
  rationale: Kivumishi kilichotumiwa kama nomino hurejelea vilivyouawa kwa kunyongwa. “Vitu vilivyonyongwa” huhifadhi upana huo, huku tanbihi ikifafanua uwezekano wa nyama.
- source_word: πορνείας
  choice: uasherati
  rationale: Katika Kiswahili cha Biblia na matumizi ya kawaida, “uasherati” ni neno pana kwa mwenendo wa kingono usio halali; halifungi maana katika kosa moja maalumu.
- source_word: ἐξ ὧν
  choice: na mambo hayo
  rationale: Kirai hiki hurejelea orodha iliyotangulia. Muundo “mkijilinda na mambo hayo” ni wa asili katika Kiswahili.
- source_word: διατηροῦντες ἑαυτούς
  choice: Mkijilinda
  rationale: Ingawa Kigiriki kina kishirikishi, muundo wa sharti katika Kiswahili huwasilisha kwa kawaida uhusiano wake na kitenzi kikuu.
- source_word: εὖ πράξετε
  choice: mtafanya vema
  rationale: Hii huhifadhi msemo wa Kigiriki kuwa kufanya hivyo ni jambo jema na linalofaa, bila kuugeuza kuwa ahadi ya mafanikio.
- source_word: ἔρρωσθε
  choice: Wasalamu
  rationale: Hapa ni fomula ya kawaida ya kufunga barua. “Wasalamu” huwasilisha kazi yake ya kiibada ya barua kuliko tafsiri halisi kama “iweni na nguvu.”
theological_decisions:
- issue: Maana ya πορνεία katika uamuzi wa mitume
  choice: uasherati kwa maana pana
  alternative: ndoa zisizoruhusiwa au makosa maalumu yanayohusishwa na Walawi 18
  rationale: Mstari wenyewe hauibani wazi maana katika aina moja ya kosa la kingono. Tafsiri kuu huhifadhi maana pana, na tanbihi hutaja ufafanuzi mwembamba unaowezekana bila kuupendelea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha imehifadhiwa kwa ufupi kama katika Kigiriki; alama zote za tanbihi zimo katika matini kuu.
