  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: sw
  text: Basi, kulitokea ugomvi mkali sana[a] hata wakatengana, na Barnaba akamchukua Marko pamoja naye, akasafiri kwa meli kwenda Kipro,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mzozo mkali” au “mabishano makali.” Neno la Kigiriki linaweza kumaanisha uchochezi mkubwa au mgongano mkali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Basi kukatokea
  rationale: Muunganiko huu unaendeleza simulizi na kutambulisha tukio jipya kwa Kiswahili cha kawaida bila kusisitiza mno maana ya upinzani katika δέ.
- source_word: παροξυσμὸς
  choice: ugomvi mkali sana
  rationale: Katika muktadha huu neno linaonyesha mgongano mkali kati ya Paulo na Barnaba, si hisia ya ndani tu; 'ugomvi mkali sana' ni wazi na linaendeleza uzito wa tukio.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: hata wakatengana
  rationale: '''Hata'' pamoja na kitenzi cha matokeo huwasilisha kwa kawaida uhusiano wa kiwango na matokeo uliomo katika ὥστε; wazo la kutengana wao kwa wao linaeleweka katika muktadha.'
- source_word: τόν τε Βαρναβᾶν
  choice: Barnaba
  rationale: τε inaanzisha upande wa kwanza wa matendo yanayofuata baada ya kutengana; mtiririko wa Kiswahili hauhitaji kiunganishi kizito hapa.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: akamchukua Marko pamoja naye
  rationale: Huhifadhi maana ya kumchukua mtu ili aandamane naye, huku jina likibaki 'Marko' kama lilivyo katika mstari huu.
- source_word: ἐκπλεῦσαι
  choice: akasafiri kwa meli
  rationale: Hutoa wazi wazo la kuondoka kwa njia ya bahari kwa Kiswahili cha kawaida; mfululizo wa 'aka-' unaonyesha tendo linalofuata.
- source_word: εἰς Κύπρον
  choice: kwenda Kipro
  rationale: Hutoa kwa uwazi maana ya mwelekeo na mahali wanakokwenda.
theological_decisions:
- issue: Jinsi simulizi linavyoonyesha mgogoro kati ya watenda kazi wa kitume
  choice: Kuutaja moja kwa moja kuwa 'ugomvi mkali sana' bila kuupunguza au kuuhukumu
  alternative: mabishano makali / mzozo mkali
  rationale: Mstari unasimulia mgongano halisi na mkali kati ya Paulo na Barnaba. Tafsiri inadumisha mvutano huo bila kuuficha kwa sababu za upatanisho wala kuongeza hukumu isiyomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa vitenzi vya mfululizo ('wakatengana ... akamchukua ... akasafiri') unafaa simulizi na ni rahisi kueleweka. Hakuna tanbihi iliyowekwa kwa kuwa 'ugomvi mkali sana' hutoa maana ya παροξυσμός kwa uwazi; mbadala za kileksika zimerekodiwa katika maamuzi.
