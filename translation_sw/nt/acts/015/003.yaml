id: ACT.15.3
reference: Acts 15:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: sw
  text: Basi, baada ya kusindikizwa na kanisa, walipitia Foinike na Samaria, wakisimulia kwa kina kuhusu kugeuka kwa watu wa mataifa[a]; nao waliwaletea ndugu wote[b] furaha kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uongofu wa watu wa mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Neno “ndugu” hapa yaelekea linamaanisha waamini wenzao kwa ujumla, wakiwemo wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: baada ya kusindikizwa
  rationale: Kitenzi hiki huonyesha kusaidiwa au kuandamana na mtu anapoanza au kuendelea na safari. “Kusindikizwa” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo bila kudai kwamba waliandamana nao safari yote.
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Katika muktadha huu neno hilo linamaanisha jumuiya ya waamini; “kanisa” ndiyo tafsiri ya kawaida na iliyo wazi katika Kiswahili.
- source_word: διήρχοντο
  choice: walipitia
  rationale: Huwasilisha mwendo wao kupitia maeneo hayo kwa lugha fupi na ya kawaida, huku hali ya tendo linaloendelea ikieleweka katika simulizi.
- source_word: τε ... καὶ
  choice: Foinike na Samaria
  rationale: Kiunganishi cha Kigiriki kinayaunganisha maeneo yote mawili. Kiswahili cha kawaida hakihitaji muundo mzito wa “Foinike pamoja na Samaria” ili kuonyesha uhusiano huo.
- source_word: Φοινίκην
  choice: Foinike
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la eneo la Foinike.
- source_word: Σαμάρειαν
  choice: Samaria
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la eneo hilo.
- source_word: ἐκδιηγούμενοι
  choice: wakisimulia kwa kina
  rationale: Kitenzi hiki kina nguvu ya kueleza au kusimulia kikamilifu; “kwa kina” huhifadhi msisitizo huo kwa Kiswahili cha asili.
- source_word: ἐπιστροφὴν τῶν ἐθνῶν
  choice: jinsi watu wa mataifa walivyomgeukia Mungu
  rationale: Nomino ἐπιστροφή ina wazo la kugeuka. Katika muktadha wa Matendo, jambo linalosimuliwa ni watu wasio Wayahudi kumgeukia Mungu. Muundo wa kitenzi ni wa kawaida zaidi kwa Kiswahili kuliko nomino ya kitaalamu “uongofu,” na hauingizi maana ya ziada.
- source_word: τῶν ἐθνῶν
  choice: watu wa mataifa
  rationale: Katika Matendo 15, neno hili linawahusu watu wasio Wayahudi. “Watu wa mataifa” ni wazi na lenye hadhi katika Kiswahili, bila kuwachanganya na mataifa kama nchi.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: wakawaletea furaha kubwa
  rationale: Hii inatafsiri kwa uasilia msemo wa Kigiriki unaomaanisha kusababisha furaha kubwa.
- source_word: ἀδελφοῖς
  choice: waamini wote
  rationale: Katika muktadha huu wingi wa kiume wa Kigiriki unaelekea kumaanisha wanajumuiya wa imani kwa ujumla, wakiwemo wanawake. “Waamini wote” hutoa maana rejelewa kwa Kiswahili cha asili, huku tanbihi ikihifadhi umbo halisi “ndugu.”
theological_decisions:
- issue: Maana ya ἐπιστροφή katika kuingizwa kwa watu wa mataifa
  choice: jinsi watu wa mataifa walivyomgeukia Mungu
  alternative: kugeuka kwa watu wa mataifa / uongofu wa watu wa mataifa
  rationale: Tafsiri hii huhifadhi picha ya kugeuka iliyo katika neno la Kigiriki na kuweka wazi kutokana na muktadha kwamba walimgeukia Mungu. Inaepuka kufanya “uongofu” kuwa istilahi ya kimafundisho yenye maana pana kuliko mstari huu.
- issue: Maana ya ἀδελφοί katika jumuiya inayoweza kuwa na wanaume na wanawake
  choice: waamini wote
  alternative: ndugu wote
  rationale: Wingi wa kiume wa Kigiriki unaweza kutaja jumuiya nzima ya waamini. Tafsiri kuu inaonyesha maana hiyo katika Kiswahili cha sasa; tanbihi inaweka wazi neno halisi na upeo wake unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Sentensi inadumisha mtiririko wa simulizi kwa vitenzi vya mfululizo “walipitia,” “wakisimulia,” na “wakawaletea.”
