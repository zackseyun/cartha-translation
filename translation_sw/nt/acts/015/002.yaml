id: ACT.15.2
reference: Acts 15:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: sw
  text: Basi, baada ya kutokea mgogoro na mabishano makali[a] kati ya Paulo na Barnaba na watu hao, wakawateua Paulo na Barnaba pamoja na wengine kadhaa miongoni mwao wapande kwenda Yerusalemu[b] kwa mitume na wazee kuhusu suala hilo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani ni “mgogoro na mabishano yasiyo madogo,” usemi unaosisitiza kwamba mgogoro huo ulikuwa mkubwa.
    reason: lexical_alternative
  - marker: b
    text: “Kupanda kwenda” ni nahau ya Kiyunani iliyotumiwa kwa kawaida kuhusu safari ya kwenda Yerusalemu.
    reason: cultural_note
  - marker: c
    text: Au “kuhusu jambo hilo” au “kuhusu swali hilo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: Basi, baada ya kutokea
  rationale: Huwasilisha kishazi huru cha hali kinachotanguliza tukio kuu na pia huhifadhi kiunganishi δέ kwa Kiswahili cha kawaida.
- source_word: στάσεως καὶ ζητήσεως
  choice: mgogoro na mabishano
  rationale: “Mgogoro” huonyesha upinzani mkubwa, huku “mabishano” yakionyesha mjadala wenye mvutano; hivyo maneno hayo mawili hayatendewi kana kwamba yana maana moja.
- source_word: οὐκ ὀλίγης
  choice: makali
  rationale: Hutoa kwa Kiswahili cha kawaida msisitizo wa usemi wa Kiyunani ‘yasiyo madogo’; umbo halisi limehifadhiwa katika tanbihi [a].
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: kati ya Paulo na Barnaba na watu hao
  rationale: Hutaja pande za mgogoro bila kuongeza wazo la uhasama mkali zaidi ya lililomo katika Kiyunani. “Watu hao” huwarejelea watu waliotoka Uyahudi katika mstari uliotangulia.
- source_word: ἔταξαν
  choice: wakawateua
  rationale: Hueleza uteuzi wa wajumbe kwa kusudi maalumu, si uamuzi wa kibinafsi tu.
- source_word: ἀναβαίνειν
  choice: wapande kwenda
  rationale: Huhifadhi nahau ya kwenda juu kuelekea Yerusalemu huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: wengine kadhaa miongoni mwao
  rationale: Huonyesha kwamba wajumbe wengine walichaguliwa kutoka katika jumuiya hiyo bila kuongeza jinsia au idadi kamili.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: mitume na wazee
  rationale: Hutumia majina yanayotambulika kwa viongozi hawa katika kitabu cha Matendo bila kuyafafanua kupita kiasi.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: kuhusu suala hilo
  rationale: “Suala” ni neno la sasa na linaloeleweka kwa jambo lililokuwa linabishaniwa.
theological_decisions:
- issue: Utambulisho wa pande zilizokuwa zikibishana
  choice: Mgogoro unaelezwa kuwa kati ya Paulo na Barnaba na “watu hao,” yaani watu waliotoka Uyahudi waliotajwa katika mstari uliotangulia.
  alternative: Paulo na Barnaba walikuwa na mgogoro na mabishano pamoja nao.
  rationale: Muundo huu hufuata uhusiano wa kisintaksia na muktadha wa karibu bila kuongeza hitimisho la kimadhehebu.
- issue: Waliowateua wajumbe
  choice: “Waumini” limetumiwa kumtaja kwa kawaida mhusika wa wingi aliyedokezwa na kitenzi ἔταξαν katika muktadha wa kanisa la Antiokia.
  alternative: Waliteua; au ikaamuliwa kwamba waende.
  rationale: Kiyunani hakitaji nomino ya mhusika katika mstari huu. “Waumini” huzuia msomaji wa Kiswahili kudhani kimakosa kwamba wale walimu waliopinga ndio waliowateua wajumbe, lakini halidai mfumo maalumu wa uongozi wa kanisa.
- issue: Uzito wa tendo la ἔταξαν
  choice: wakawateua
  alternative: wakaamua; wakapanga
  rationale: “Wakawateua” huonyesha kwamba wajumbe waliwekwa rasmi kwa kazi hiyo, bila kudai maelezo ya ziada kuhusu utaratibu wa uongozi wa kanisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha uzito wa mgogoro, tofauti kati ya mgogoro na mabishano, na nahau ya kupanda kwenda Yerusalemu bila kuwa nzito au ya kizamani.
