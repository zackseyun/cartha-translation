  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: sw
  text: Lakini Paulo akamchagua Sila, akaondoka, akiwa amekabidhiwa na ndugu[b] kwa neema ya Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa amewekwa chini ya neema ya Bwana.”
    reason: lexical_alternative
  - marker: b
    text: Neno “ndugu” hapa linaweza kurejelea jumuiya nzima ya waamini, kutia ndani wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Katika muktadha huu linaonyesha tofauti nyepesi kati ya Paulo na Barnaba baada ya kutengana kwao katika mstari uliotangulia.
- source_word: ἐπιλεξάμενος
  choice: akamchagua
  rationale: Kitenzi hiki kinaonyesha kwamba Paulo mwenyewe alimchagua Sila kabla ya kuondoka; muundo wa simulizi wenye “aka-” ni wa kawaida na wa asili katika Kiswahili.
- source_word: Σιλᾶν
  choice: Sila
  rationale: Jina hili limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: ἐξῆλθεν
  choice: akaondoka
  rationale: Katika simulizi la safari, neno hili humaanisha kuondoka au kuanza safari; “akaondoka” ni fasaha na linafaa muktadha.
- source_word: παραδοθεὶς
  choice: baada ya ndugu kumkabidhi
  rationale: Muundo huu unahifadhi hali ya kutendwa kwa Paulo na pia unaweka wazi kwamba ndugu ndio waliomkabidhi katika uangalizi wa neema ya Bwana.
- source_word: τῇ χάριτι
  choice: kwa neema
  rationale: “Neema” linahifadhi nomino ya kiteolojia χάρις bila kuibadili kimya kuwa “ulinzi” au “uangalizi,” huku “kwa” likitoa Kiswahili cha asili katika usemi wa kukabidhi mtu kwa neema.
- source_word: τοῦ κυρίου
  choice: ya Bwana
  rationale: “Bwana” linahifadhi cheo κύριος na halibainishi kama kinamtaja Yesu au Mungu Baba zaidi ya kiwango cha ubainifu wa Kigiriki.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa washiriki wa jumuia ya waamini; halilazimishi jinsia ambayo Kiswahili yenyewe haiibainishi katika nomino hii.
theological_decisions:
- issue: Mhusika anayeitwa “Bwana”
  choice: Bwana
  alternative: Bwana Yesu; Mungu
  rationale: Kigiriki kinatumia κύριος bila kumtaja mhusika kwa ufafanuzi zaidi. Tafsiri inaacha kiwango hicho cha ubainifu bila kutatua kimadhehebu jambo ambalo andiko halijatatua hapa.
- issue: Upeo wa neno “ndugu”
  choice: Ndugu katika matini kuu, pamoja na tanbihi ya kueleza uwezekano wa maana pana ya jumuia
  alternative: Ndugu wa kiume pekee; waamini
  rationale: ἀδελφῶν ni wingi wa kiume kisarufi, lakini katika jumuia ya Kikristo linaweza kuwahusu waamini kwa upana zaidi. “Ndugu” ni sawa kiasili katika Kiswahili, na tanbihi inahifadhi suala la upeo bila kulifunga.
- issue: Maana ya παραδοθεὶς τῇ χάριτι
  choice: kumkabidhi kwa neema ya Bwana
  alternative: kumweka chini ya neema ya Bwana; kumweka katika uangalizi wenye neema wa Bwana
  rationale: Tafsiri inahifadhi picha ya kukabidhi mtu katika neema ya Bwana na pia inadumisha neno la kiteolojia “neema,” badala ya kulifafanua kabisa kuwa uangalizi au ulinzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Muundo wa “aka-” unaunganisha vitendo vinavyofuatana kwa uwazi. Neno “neema” limehifadhiwa kwa sababu ya uzito wake wa kiteolojia, huku tanbihi zikieleza maana mbadala bila kulemea matini kuu.
