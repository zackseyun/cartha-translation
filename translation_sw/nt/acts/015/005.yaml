  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: sw
  text: Lakini baadhi ya wale wa kundi la Mafarisayo waliokuwa wameamini walisimama[a], wakisema, “Ni lazima kuwatahiri na kuwaamuru waishike Sheria ya Musa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliinuka.” Neno la Kigiriki linaweza kuonyesha kusimama au kuinuka ili kusema katika mkutano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: walisimama
  rationale: Katika mazingira ya mkutano, kitenzi hiki kinaonyesha kuinuka au kusimama ili kusema; “walisimama” ni cha kawaida na hakiongezi maana isiyokuwamo.
- source_word: τινες
  choice: baadhi
  rationale: Kiwakilishi hiki kisichoainisha watu kinamaanisha baadhi yao; hakihitaji kuongeza neno “wanaume.”
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: wale waliokuwa wa kundi la Mafarisayo
  rationale: Hapa αἵρεσις ni kundi au mkondo unaotambulika, si lazima uzushi kwa maana ya baadaye ya kidini. “Kundi” ni wazi na halina hukumu ya ziada.
- source_word: πεπιστευκότες
  choice: ambao walikuwa wameamini
  rationale: Muundo wa timilifu unaonyesha tendo la kuamini lililotangulia pamoja na hali yake inayoendelea; tafsiri ya kitenzi inadumisha mvutano wa kwamba walikuwa wameamini huku wakitoa dai hili.
- source_word: λέγοντες
  choice: na kusema
  rationale: Hutambulisha maneno yao kwa njia isiyoegemea upande wowote; “na kusema” ni ya asili katika simulizi la Kiswahili.
- source_word: δεῖ
  choice: Ni lazima
  rationale: Hudumisha dai la ulazima bila kutaja chanzo chake, kama ilivyo katika Kigiriki.
- source_word: περιτέμνειν αὐτούς
  choice: kuwatahiri
  rationale: Ni uwasilishaji wa moja kwa moja wa kitenzi kisoukomo na kiwakilishi chake katika Kiswahili cha kawaida.
- source_word: παραγγέλλειν
  choice: kuwaamuru
  rationale: Kitenzi kina nguvu ya agizo lenye mamlaka; “kuwaamuru” hakilipunguzi kuwa ushauri tu.
- source_word: τε τηρεῖν
  choice: waishike
  rationale: Katika muktadha wa sheria, τηρέω ni kushika au kutii. “Kuishika Sheria” ni usemi wa kawaida na wenye heshima.
- source_word: τὸν νόμον Μωϋσέως
  choice: Sheria ya Musa
  rationale: Hufuata moja kwa moja muundo wa Kigiriki na ni usemi unaoeleweka kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Maana ya αἵρεσις katika muktadha wa kundi la Kiyahudi
  choice: kundi
  alternative: madhehebu
  rationale: Neno hilo hapa linatambulisha kundi au mkondo wa Mafarisayo, si uzushi kwa maana ya baadaye ya kiteolojia. “Kundi” huepuka kuingiza hukumu hasi isiyodaiwa na matini.
- issue: Nguvu ya πεπιστευκότες
  choice: ambao walikuwa wameamini
  alternative: waliokuwa waumini
  rationale: Tafsiri ya kitenzi huhifadhi tendo lililotangulia na hali inayoendelea, na pia hudumisha mvutano wa kihistoria na kiteolojia uliomo katika mstari bila kuutatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili katika Kiswahili huku ukihifadhi uhusiano wa hoja na mvutano wa matini ya Kigiriki.
