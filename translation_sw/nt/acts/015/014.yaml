  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: sw
  text: Simeoni[a] ameeleza jinsi Mungu alivyowatembelea watu wa mataifa[b] hapo kwanza, ili achukue watu kutoka miongoni mwao kwa ajili ya jina lake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Simoni.” Yakobo anatumia hapa umbo la jina “Simeoni.”
    reason: lexical_alternative
  - marker: b
    text: Au “mataifa,” yaani wasio Wayahudi katika muktadha huu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, watu walio wake na wanaotambulishwa kwa jina lake.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Simeoni
  rationale: Huhifadhi umbo la jina lililotumiwa na Yakobo hapa badala ya kulisawazisha na umbo linalofahamika zaidi, Simoni.
- source_word: ἐξηγήσατο
  choice: ameeleza
  rationale: Kitenzi hiki humaanisha kusimulia au kutoa maelezo ya jambo; wakati timilifu wa Kiswahili unafaa kwa muhtasari wa maelezo aliyokuwa ametoa muda mfupi kabla.
- source_word: καθὼς
  choice: jinsi ... alivyowatembelea
  rationale: Katika muundo huu neno hilo linaanzisha yaliyomo katika maelezo na namna jambo lilivyotokea.
- source_word: πρῶτον
  choice: hapo kwanza
  rationale: Huonyesha hatua ya awali ya tendo la Mungu kwa watu wa mataifa bila kulifanya lazima limaanishe tukio moja lisilorudiwa.
- source_word: ἐπεσκέψατο
  choice: alivyowatembelea
  rationale: Huhifadhi tamathali ya kibiblia ya Mungu kutembelea watu kwa kuwajali na kutenda kwa kusudi, bila kuifafanua kupita kiasi.
- source_word: λαβεῖν
  choice: ili achukue
  rationale: Hutoa moja kwa moja dhana ya kusudi iliyo katika hali ya kitenzi cha Kigiriki na huepuka kuingiza wazo la ziada kama kukusanya.
- source_word: ἐξ ἐθνῶν
  choice: kutoka miongoni mwao watu wa mataifa
  rationale: Katika muktadha wa Matendo 15, ἔθνη ni wasio Wayahudi; ‘watu wa mataifa’ ni usemi wa kawaida wa Kiswahili unaoonyesha tofauti hiyo, na ‘kutoka miongoni mwao’ huhifadhi nguvu ya ἐξ.
- source_word: λαὸν
  choice: watu
  rationale: Hapa neno hilo linamaanisha kundi linalotambulishwa kuwa la Mungu; ‘watu’ huhifadhi mwangwi wa kibiblia bila kulifunga kwa kabila moja.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: kwa ajili ya jina lake
  rationale: Huhifadhi usemi mzito wa kibiblia kuhusu watu wanaomhusu Mungu na kutambulishwa kwa jina lake, badala ya kuufupisha kuwa ‘kwa ajili yake mwenyewe.’
theological_decisions:
- issue: Kutafsiri ἐξ ἐθνῶν kama ‘watu wa mataifa’ au ‘mataifa’ pekee
  choice: watu wa mataifa
  alternative: mataifa
  rationale: Muktadha unahusu kuingizwa kwa wasio Wayahudi miongoni mwa watu wa Mungu. ‘Watu wa mataifa’ huonyesha wazi kwamba kinachokusudiwa ni watu, huku tanbihi ikihifadhi tafsiri fupi zaidi.
- issue: Kufafanua τῷ ὀνόματι αὐτοῦ kuwa ‘kwa ajili yake mwenyewe’
  choice: kwa ajili ya jina lake
  alternative: kwa ajili yake mwenyewe
  rationale: Usemi wa chanzo una mvutano na uzito wa kiagano unaohusisha umiliki, utambulisho na jina la Mungu; maandishi makuu yanauacha bila kuupunguza kuwa maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘hapo kwanza’ na ‘kwa ajili ya jina lake’ huhifadhi ladha ya kibiblia bila kuwa wa kizamani; tanbihi zinaeleza jina na nahau bila kuingiza msimamo wa kimadhehebu.
