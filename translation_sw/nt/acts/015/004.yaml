  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: sw
  text: Walipofika Yerusalemu, walikaribishwa na kanisa, mitume na wazee, na wakatoa taarifa kuhusu yote ambayo Mungu alikuwa amefanya pamoja nao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu alikuwa amefanya kupitia wao,” au “Mungu alikuwa amefanya miongoni mwao.” Kigiriki kinasema “pamoja nao.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Walipofika Yerusalemu
  rationale: Muundo wa wakati unaonyesha kuwa kufika kwao kulitangulia kukaribishwa na kutoa taarifa. Kiswahili cha ‘walipofika’ ni cha kawaida na huhifadhi uhusiano huo wa wakati; δέ inaachwa idhihirike katika mtiririko wa simulizi.
- source_word: παρεδέχθησαν
  choice: walikaribishwa
  rationale: Kitenzi hiki hapa kinaonyesha kupokewa kwa ukarimu. ‘Walikaribishwa’ ni Kiswahili cha asili na cha sasa kuliko tafsiri kavu ya ‘walipokewa.’
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: na kanisa, mitume na wazee
  rationale: Katika sentensi tendwa, ἀπό inataja waliowakaribisha. ‘Kanisa’ ni jumuiya ya waamini, na ‘wazee’ ni viongozi waliotambuliwa, si wanaume wenye umri mkubwa tu.
- source_word: ἀνήγγειλάν τε
  choice: Kisha wakawaeleza
  rationale: Kitenzi kina maana ya kutoa taarifa au kusimulia. ‘Wakawaeleza’ kinaeleza tendo hilo kwa Kiswahili cha kawaida, huku ‘Kisha’ ikiunganisha tukio hili na kukaribishwa kwao.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: mambo yote ambayo Mungu alikuwa amefanya
  rationale: ‘Mambo yote’ huhifadhi upeo wa ὅσα, na ‘alikuwa amefanya’ huonyesha kuwa matendo ya Mungu yalitangulia taarifa yao.
- source_word: μετ’ αὐτῶν
  choice: pamoja nao
  rationale: μετά pamoja na hali milikishi kwa msingi humaanisha ‘pamoja na.’ Tafsiri hii huhifadhi upana wa usemi wa Kigiriki bila kuufanya kwa lazima kuwa wa chombo (‘kupitia kwao’) au wa mahali (‘miongoni mwao’).
theological_decisions:
- issue: Jinsi μετ’ αὐτῶν inavyoeleza ushiriki katika kazi ya Mungu
  choice: Mungu alikuwa amefanya pamoja nao
  alternative: Mungu alikuwa amefanya kupitia wao; au Mungu alikuwa amefanya miongoni mwao
  rationale: Usemi wa Kigiriki unamweka Mungu kuwa mtendaji mkuu huku ukiwahusisha wajumbe wake katika kazi hiyo. ‘Pamoja nao’ huhifadhi mvutano na upana huo bila kuamua kuwa maana ni ya chombo pekee au ya mahali pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. Sentensi imegawanywa mara mbili ili kuepuka mfululizo mzito wa viunganishi bila kubadili mpangilio wa matukio.
