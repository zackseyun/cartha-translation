lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia katika hotuba ya Yakobo.
- source_word: ἐγὼ κρίνω
  choice: mimi naamua kwamba
  rationale: Kiwakilishi “mimi” kinahifadhi msisitizo wa ἐγώ, na “naamua” kinaonyesha hukumu ya Yakobo iliyofikiriwa kwa makini na yenye nguvu ya pendekezo kwa kusanyiko.
- source_word: μὴ παρενοχλεῖν
  choice: tusiwasumbue
  rationale: Kitenzi hiki kinamaanisha kutowatwisha watu usumbufu au matatizo; nafsi ya kwanza wingi inaweka wazi athari ya uamuzi unaopendekezwa kwa kusanyiko.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: watu wa mataifa
  rationale: Inarejelea watu wenye asili ya mataifa yasiyo ya Wayahudi, si mataifa kama dhana isiyo ya kibinafsi.
- source_word: ἐθνῶν
  choice: mataifa
  rationale: “Mataifa” ni neno la kawaida la kibiblia linalohifadhi upana wa ἔθνη; katika muktadha huu linamaanisha watu wasio Wayahudi, jambo linalofafanuliwa katika tanbihi.
- source_word: ἐπιστρέφουσιν
  choice: wanaomgeukia
  rationale: Inaendeleza taswira ya kuelekea kwa Mungu na kudokeza mchakato unaoendelea bila kutumia istilahi ya baadaye ya kitaalamu ya uongofu.
- source_word: ἐπὶ τὸν θεόν
  choice: Mungu
  rationale: Kiambishi cha yambwa katika “wanaomgeukia” kinaeleza kwa Kiswahili sanifu mwelekeo kuelekea kwa Mungu.
theological_decisions:
- issue: Je, kauli hiyo ni maoni binafsi ya Yakobo tu au pendekezo la uamuzi wa pamoja?
  choice: “mimi naamua kwamba tusiwasumbue”
  alternative: “uamuzi wangu ni kutowasumbua”
  rationale: Kigiriki kina nafsi ya kwanza umoja ἐγὼ κρίνω, lakini kitenzi-jina kinachofuata kinaeleza uamuzi wenye matokeo kwa kusanyiko. Tafsiri hii inahifadhi sauti binafsi ya Yakobo pamoja na nguvu ya pendekezo la pamoja.
- issue: Maana ya ἔθνη katika muktadha huu
  choice: “watu wa mataifa” kwa maana ya wasio Wayahudi
  alternative: “Wamataifa”
  rationale: “Mataifa” huhifadhi maana ya msingi ya neno la Kigiriki, huku muktadha na tanbihi vikibainisha kuwa hapa linawahusu watu wasio Wayahudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “wanaomgeukia Mungu” huhifadhi taswira ya asili ya kugeuka kuelekea kwa Mungu.
