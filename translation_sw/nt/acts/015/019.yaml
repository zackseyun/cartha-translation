translation:
  language: sw
  text: Kwa hiyo, mimi ninaona kwamba tusiwasumbue watu wa mataifa[a] wanaomgeukia Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wasio Wayahudi.” Neno la Kigiriki linaweza kumaanisha “mataifa,” lakini hapa linawahusu watu wasio Wayahudi wanaomgeukia Mungu.
