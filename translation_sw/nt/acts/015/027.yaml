base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: sw
  text: Kwa hiyo tumewatuma[a] Yuda na Sila, nao wenyewe watatangaza mambo hayohayo kwa mdomo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuliwatuma Yuda na Sila.” Kauli ya Kigiriki inaweza kutafsiriwa kwa wakati uliopita, lakini “tumewatuma” huhifadhi vizuri zaidi umuhimu wa sasa wa kitendo hicho.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa njia ya neno”; yaani, kwa mawasiliano ya kusema pamoja na barua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: tumewatuma
  rationale: Kauli timilifu ya Kiswahili inaonyesha kwamba kitendo cha kuwatuma kimefanyika na bado kina umuhimu wakati barua inaposomwa.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na uamuzi wa baraza uliotajwa kabla.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Yuda na Sila
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: αὐτοὺς
  choice: nao wenyewe
  rationale: Inahifadhi msisitizo kwamba wajumbe hao binafsi watathibitisha yaliyomo katika barua.
- source_word: διὰ λόγου
  choice: kwa mdomo
  rationale: Ni usemi wa kawaida unaoonyesha mawasiliano ya kusema, tofauti na barua iliyoandikwa.
- source_word: ἀπαγγέλλοντας
  choice: watawaeleza
  rationale: Kivumishi-jina cha Kigiriki kinaeleza jambo ambalo Yuda na Sila watafanya baada ya kutumwa; umbo la wakati ujao ni la asili na wazi katika Kiswahili.
- source_word: τὰ αὐτά
  choice: mambo haya
  rationale: Katika muktadha, kinarejelea mambo yale yale yaliyoandikwa katika barua; ‘mambo haya’ ni ya asili kwa Kiswahili bila kuyafupisha kuwa ‘ujumbe’.
