base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: sw
  text: 'Wakaandika kwa mkono wao[a] hivi:


    “Mitume na wazee, ambao ni ndugu[b], kwa ndugu[c] wa Mataifa walioko Antiokia, Siria na Kilikia: Salamu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana ya kawaida zaidi, “wakatuma kupitia kwao”; Kigiriki ni “kwa mkono wao.”
    reason: lexical_alternative
  - marker: b
    text: Au “wazee, ndugu”; wengine huyachukua maneno haya kama “mitume na wazee, ndugu.”
    reason: alternative_reading
  - marker: c
    text: “Ndugu” hapa yaweza kuwahusu waamini wote, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: Wakaandika
  rationale: Kitenzi kishirikishi cha wakati uliopita kinatanguliza tendo la kuandika barua; muundo wa Kiswahili wenye ‘waka-’ unaunganisha tendo hili kwa kawaida na simulizi lililotangulia.
- source_word: διὰ χειρὸς αὐτῶν
  choice: kwa mkono wao
  rationale: Huhifadhi tamathali ya Kigiriki ya kutenda au kupeleka kitu ‘kwa mkono’ wa watu waliotajwa, huku tanbihi ikieleza maana ya kawaida ya kutuma kupitia kwao.
- source_word: ἀπόστολοι
  choice: Mitume
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa viongozi-wajumbe wanaotajwa hapa.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: ndugu wazee
  rationale: Huhifadhi uhusiano wa karibu wa maneno hayo mawili bila kuyaonyesha moja kwa moja kuwa makundi mawili tofauti; tanbihi inatoa uwezekano mwingine wa kisintaksia.
- source_word: ἀδελφοῖς
  choice: ndugu
  rationale: Neno hili linaweza kutumiwa kwa waamini wenzao kwa maana jumuishi; Kiswahili ‘ndugu’ pia huweza kuwahusu wanaume na wanawake bila kulazimisha jinsia katika tafsiri.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: ndugu wa Mataifa
  rationale: Ni usemi mfupi na wa kawaida unaoonyesha kwamba wapokeaji walitoka miongoni mwa watu wasio Wayahudi.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: walioko Antiokia, Siria na Kilikia
  rationale: Hutoa kwa Kiswahili sanifu maana ya mahali au usambazaji wa wapokeaji katika maeneo hayo.
- source_word: χαίρειν
  choice: Salamu
  rationale: Katika mwanzo wa barua, neno hili ni fomula ya kawaida ya kusalimu, si amri ya kufurahi.
theological_decisions:
- issue: Maana ya ἀδελφοί katika barua iliyoelekezwa kwa jumuiya ya waamini
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: ‘Ndugu’ ni ya asili katika Kiswahili na inaweza kuwa jumuishi, hivyo inadumisha maana ya ushirika wa waamini bila kuongeza maneno ya kijinsia yasiyopo wazi katika chanzo.
- issue: Uhusiano wa πρεσβύτεροι na ἀδελφοὶ
  choice: ndugu wazee
  alternative: wazee, ndugu
  rationale: Muundo wa Kigiriki hauna kibainishi cha pili kabla ya ‘ndugu,’ kwa hiyo usomaji wa maneno hayo kama kirai kimoja umewekwa katika matini; usomaji unaolichukua ‘ndugu’ kama jina la ufafanuzi umehifadhiwa katika tanbihi.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa barua umehifadhiwa kwa kutumia ‘kwa ...: Salamu.’ Tamathali ya ‘kwa mkono wao’ imeachwa katika matini kwa uwazi wa uhusiano na chanzo, kisha ikaelezwa katika tanbihi.'
