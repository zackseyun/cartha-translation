base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: sw
  text: Baada ya kunyamaza kwao[a], Yakobo akajibu, akisema, “Ndugu zangu[b], nisikilizeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya wao kuacha kusema.” Muundo wa Kigiriki unaonyesha wakati baada ya wasemaji waliotangulia kunyamaza.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wanaume, ndugu.” Huu ni usemi rasmi wenye viitio viwili vya kiume katika Kigiriki. “Ndugu zangu” ni salamu ya kawaida ya Kiswahili katika muktadha huu.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Baada yao kunyamaza
  rationale: Muundo wa μετά pamoja na kitenzi-jina huonyesha wakati unaofuata, yaani ‘baada ya.’ Kitenzi σιγάω hapa humaanisha kunyamaza au kuacha kusema; tafsiri hii inadumisha mfuatano bila kuongeza maelezo yasiyokuwamo.
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Kitenzi hiki humaanisha kujibu au kuitikia. ‘Akajibu’ kinafaa katika mtiririko wa simulizi baada ya wasemaji waliotangulia kumaliza.
- source_word: Ἰάκωβος
  choice: Yakobo
  rationale: ‘Yakobo’ ni umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili na linaakisi jina la Kigiriki Ἰάκωβος.
- source_word: λέγων
  choice: akisema
  rationale: Kirai hiki kinaanzisha maneno ya moja kwa moja; ‘akisema’ kinawakilisha wazi umbo la Kigiriki huku kikibaki cha kawaida katika simulizi la Kiswahili.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ndugu zangu
  rationale: Hii ni salamu rasmi kwa wanaume wenzake katika kusanyiko. ‘Ndugu zangu’ ni namna ya kawaida na yenye heshima ya kusema hivyo kwa Kiswahili; tanbihi inaonyesha kuwa Kigiriki kina maneno mawili ya kiume, kihalisi ‘wanaume, ndugu.’
- source_word: ἀκούσατέ μου
  choice: nisikilizeni
  rationale: Amri hii inataka wasikilizaji wamsikilize kwa makini. ‘Nisikilizeni’ ni ya moja kwa moja, ya kawaida, na inadumisha nguvu ya amri.
theological_decisions:
- issue: Salamu yenye maumbo ya kiume katika hotuba ya kusanyiko
  choice: Ndugu zangu katika matini, pamoja na tanbihi inayoeleza umbo la kiume la Kigiriki
  alternative: Enyi wanaume ndugu
  rationale: Kigiriki kina viitio viwili vya kiume, ἄνδρες na ἀδελφοί. Tafsiri ya kihalisi ‘Enyi wanaume ndugu’ si Kiswahili cha kawaida na inaweza kuvuruga maana ya salamu. ‘Ndugu zangu’ huhifadhi kazi na heshima ya salamu, huku tanbihi ikihifadhi taarifa ya kijinsia na muundo wa asili bila kudai kwa uhakika kwamba salamu hiyo iliwajumuisha watu gani wote waliokuwapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. ‘Ndugu zangu’ ni salamu ya asili zaidi kuliko tafsiri neno kwa neno, na tanbihi inadumisha upekee wa maumbo ya Kigiriki.
