lexical_decisions:
- source_word: ἀνθρώποις
  choice: watu
  rationale: Ingawa hapa neno hili linawarejelea Barnaba na Paulo, “watu” ni tafsiri ya kawaida na ya asili ya ἄνθρωποι katika Kiswahili; muktadha tayari unawatambulisha watu hao bila kulazimisha neno “wanaume.”
- source_word: παραδεδωκόσι
  choice: waliohatarisha
  rationale: Kitenzi hiki kwa maana halisi ni “waliokabidhi,” lakini pamoja na “maisha yao” kinaeleza kujiweka katika hatari ya kufa. “Waliohatarisha” huwasilisha maana hiyo bila kudai kwamba walikufa.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: maisha yao
  rationale: Katika muktadha huu ψυχή humaanisha uhai au maisha, si nafsi isiyo ya mwili.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Huwasilisha sababu au kusudi linaloonyeshwa na ὑπέρ pamoja na hali ya umilikaji.
- source_word: τοῦ ὀνόματος
  choice: jina
  rationale: “Jina” linahifadhi mwangwi mpana wa kibiblia unaohusu mtu mwenyewe, mamlaka yake, na heshima yake.
- source_word: τοῦ κυρίου ἡμῶν
  choice: la Bwana wetu
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος na huhifadhi uzito wa cheo hiki kwa Yesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya “Masihi,” si jina la ukoo; Kiswahili hutumia “Yesu Masihi” kwa njia ya asili.
theological_decisions:
- issue: Maana ya παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: waliohatarisha maisha yao
  alternative: walioyakabidhi maisha yao
  rationale: Usemi wa Kigiriki una picha ya kuyakabidhi maisha, yaani kujitia katika hatari ya kufa. Tafsiri iliyochaguliwa haimaanishi kimakosa kwamba Barnaba na Paulo walikuwa tayari wamekufa.
- issue: Tafsiri ya Χριστοῦ katika mfuatano wa vyeo
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili bado linafanya kazi kama cheo kinachomaanisha Mtiwa-Mafuta; “Masihi” huonyesha maana hiyo moja kwa moja bila kuingiza msimamo wa dhehebu.
translation_notes:
