  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: sw
  text: watu waliohatarisha maisha yao[a] kwa ajili ya jina la Bwana wetu Yesu Masihi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “walioyakabidhi maisha yao”; usemi wa Kigiriki unamaanisha kwamba walijiweka katika hatari ya kufa.
    reason: lexical_alternative
