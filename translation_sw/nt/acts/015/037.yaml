base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: sw
  text: Lakini Barnaba alitaka kumchukua pia Yohana[a], aliyeitwa Marko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yohana, aliyeitwa pia Marko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Barnaba
  rationale: Jina la mtu limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida katika Biblia.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti wa kiasi na pendekezo la Paulo katika muktadha uliotangulia.
- source_word: ἐβούλετο
  choice: alitaka
  rationale: Kitenzi kinaeleza nia au tamaa ya Barnaba; ‘alitaka’ ni Kiswahili cha kawaida kisichozidisha maana ya uamuzi uliokwisha kufanywa.
- source_word: συμπαραλαβεῖν
  choice: kumchukua
  rationale: Katika muktadha huu kinamaanisha kumchukua mtu aende pamoja na kundi; kiambishi cha yambwa ‘m-’ kinamrejelea Yohana kwa uwazi.
- source_word: καὶ
  choice: pia
  rationale: Neno hili lina nguvu ya nyongeza, likisisitiza kwamba Yohana angeongezwa kwa wale waliokuwa waende pamoja.
- source_word: Ἰωάννην
  choice: Yohana
  rationale: Jina limetolewa kwa umbo la kawaida la Kiswahili la kibiblia.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: aliyeitwa Marko
  rationale: Kirai hiki kinamtambulisha Yohana kwa jina jingine bila kulazimisha καὶ ihusishwe na jina hilo.
- source_word: Μᾶρκον
  choice: Marko
  rationale: Jina limetolewa kwa umbo la kawaida la Kiswahili la kibiblia.
theological_decisions: []
