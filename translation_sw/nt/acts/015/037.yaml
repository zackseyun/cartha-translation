  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa ‘pia’ umehifadhi maana ya nyongeza ya καὶ huku tanbihi ikionyesha uwezekano wa kuhusisha ‘pia’ na jina la pili.
