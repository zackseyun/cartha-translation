  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: sw
  text: 'Baadhi ya watu walishuka kutoka Yudea, wakawa wakiwafundisha ndugu[a] hivi: “Msipotahiriwa kulingana na desturi ya Musa, hamwezi kuokolewa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu wa kiume na wa kike”; Kigiriki hutumia “ndugu” katika umbo la wingi wa kiume, na huenda linarejelea jumuiya ya waamini kwa maana jumuishi.
    reason: Mbadala wa kileksia unaofafanua uwezekano wa rejeo jumuishi bila kubadili neno la maandishi makuu.
lexical_decisions:
- source_word: Καί τινες
  choice: Baadhi ya watu
  rationale: Huwatambulisha watu fulani bila kuwataja majina; Kiswahili cha kawaida hakihitaji kiunganishi cha mwanzo hapa ili mtiririko wa simulizi ubaki wa asili.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: walishuka kutoka Uyahudi
  rationale: Kitenzi cha kushuka kinadumisha mtazamo wa kijiografia wa simulizi, na “Uyahudi” ni jina la eneo hilo katika matumizi ya kawaida ya Biblia ya Kiswahili.
- source_word: ἐδίδασκον
  choice: walikuwa wakiwafundisha
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea au kurudiwa, sawasawa na hali isiyotimilika ya kitenzi cha Kigiriki.
- source_word: τοὺς ἀδελφοὺς
  choice: ndugu
  rationale: “Ndugu” ni tafsiri ya moja kwa moja na ya kawaida; katika muktadha inaweza kulihusu jumuiya ya waamini kwa ujumla, jambo linaloelezwa katika tanbihi.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: Msipotahiriwa
  rationale: Muundo wa masharti hasi umetafsiriwa kwa Kiswahili cha kawaida, huku hali ya kutendwa ikihifadhiwa.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: kufuata desturi ya Musa
  rationale: “Desturi” huonyesha jambo lililozoeleka au utaratibu uliowekwa; “kufuata” huwasilisha kwa kawaida maana ya kupatana na desturi hiyo bila kuongeza kwamba Musa mwenyewe ndiye aliyeianzisha.
- source_word: οὐ δύνασθε σωθῆναι
  choice: hamwezi kuokolewa
  rationale: Huhifadhi kauli ya kutowezekana na maana ya wokovu inayohusika katika mabishano haya.
theological_decisions:
- issue: Maana ya σωθῆναι katika mabishano kuhusu tohara
  choice: kuokolewa
  alternative: kukombolewa
  rationale: Muktadha unahusu dai kwamba tohara ni sharti la wokovu, si ukombozi wa kawaida kutoka hatarini. Kauli imewekwa ndani ya maneno ya walimu hao ili isionekane kuwa uthibitisho wa msimulizi.
- issue: Upeo wa ἀδελφοὺς
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waamini
  rationale: Neno la Kigiriki lina umbo la wingi wa kiume, lakini huenda linawakilisha jumuiya nzima ya waamini. “Ndugu” hudumisha taswira ya kifamilia bila kuamua kimya kimya upeo wake; tanbihi inaeleza uwezekano wa maana jumuishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walikuwa wakiwafundisha” unadumisha tendo linaloendelea, na “Msipotahiriwa” ni wa kawaida na wazi. Nukuu inalinda tofauti kati ya dai la watu hao na msimamo wa msimulizi.
