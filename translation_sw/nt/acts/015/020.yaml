  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: sw
  text: bali kuwaandikia wajiepushe na unajisi unaohusiana na sanamu[a], na uasherati[b], na kilichonyongwa[c], na damu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unajisi wa sanamu.” Tafsiri nyingine hubana maana kuwa “vyakula vilivyotolewa sadaka kwa sanamu,” lakini neno la Kigiriki hapa lina maana pana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza kumaanisha mwenendo mpotovu wa kingono kwa upana; wengine hulielewa hapa hasa kuwa mahusiano ya kingono yaliyokatazwa.
    reason: alternative_reading
  - marker: c
    text: Kwa maana halisi, “kilichonyongwa”; yaani, nyama ya mnyama ambaye damu yake haikutolewa ipasavyo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: kuwaandikia
  rationale: Kitenzi hiki katika muktadha wa baraza na barua kinamaanisha kuwapelekea maagizo kwa maandishi; “kuwaandikia” ni cha kawaida na kinahifadhi maana hiyo.
- source_word: ἀπέχεσθαι
  choice: wajiepushe na
  rationale: Umbo la kati linaeleza kujizuia au kujiweka mbali na jambo; “wajiepushe na” ni Kiswahili cha asili katika muktadha wa maadili na maagizo.
- source_word: ἀλισγημάτων
  choice: unajisi
  rationale: Neno hili humaanisha hali au mambo yenye kunajisi, hasa katika mazingira ya ibada. “Unajisi” kinahifadhi uzito wa kidini bila kulazimisha maana kuwa chakula pekee.
- source_word: τῶν εἰδώλων
  choice: unaohusiana na sanamu
  rationale: Genitivi inaonyesha uhusiano au chanzo cha unajisi. Kauli hii ni wazi kwa msomaji wa sasa na haibani katazo kuwa vyakula vilivyotolewa sadaka kwa sanamu tu.
- source_word: πορνείας
  choice: uasherati
  rationale: “Uasherati” ni neno la kawaida na lenye hadhi linaloweza kurejelea mwenendo mpotovu wa kingono kwa upana, bila kuubana kwa tendo moja pekee.
- source_word: τοῦ πνικτοῦ
  choice: kilichonyongwa
  rationale: Tafsiri hii inahifadhi umbo la Kigiriki linalotaja kitu kilichouawa kwa kunyongwa bila kuongeza neno “nyama” katika matini kuu.
- source_word: τοῦ αἵματος
  choice: damu
  rationale: Tafsiri fupi “damu” inafuata Kigiriki na haiongezi ufafanuzi kuhusu matumizi au ulaji ambao haujatamkwa moja kwa moja.
theological_decisions:
- issue: Upeo wa katazo linalohusiana na sanamu
  choice: unajisi unaohusiana na sanamu
  alternative: vyakula vilivyotolewa sadaka kwa sanamu
  rationale: Kigiriki kimetumia ἀλισγημάτων τῶν εἰδώλων, ambalo ni pana kuliko neno maalumu la vyakula vilivyotolewa sadaka kwa sanamu. Tafsiri haibani maana bila msingi wa moja kwa moja katika kifungu.
- issue: Maana ya πορνεία katika agizo la mitume
  choice: uasherati
  alternative: mahusiano ya kingono yaliyokatazwa
  rationale: Neno linaweza kueleweka kwa upana kuwa mwenendo mpotovu wa kingono au, katika muktadha huu, kuwa mahusiano fulani yaliyokatazwa. Matini kuu inadumisha upana huo, na tanbihi inataja uwezekano mwingine.
- issue: Asili na muda wa masharti ya vyakula katika agizo
  choice: orodha imewasilishwa kama mambo ya kujiepusha nayo bila kueleza muda wake
  alternative: masharti ya muda kwa ushirika wa Wayahudi na watu wa mataifa, au amri za kudumu kwa waamini wote
  rationale: Aya inataja makatazo lakini haielezi hapa kama yalikuwa ya muda au ya kudumu; tafsiri haiongezi uamuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku maneno “unajisi” na “uasherati” yakidumisha uzito wa kidini na kimaadili wa matini. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
