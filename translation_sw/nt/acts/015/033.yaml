  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: sw
  text: Baada ya kukaa huko kwa muda, waliagwa kwa amani na ndugu[a] kuelekea kwa wale waliokuwa wamewatuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike.” Kigiriki kinasema “ndugu,” lakini katika muktadha huu huenda neno hilo linamaanisha jumuiya yote ya waamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: Baada ya kukaa huko kwa muda
  rationale: Nahau ya Kigiriki ina maana ya kukaa au kutumia muda fulani. Neno “huko” limedokezwa na muktadha wa kukaa kwao Antiokia, ingawa halipo wazi katika Kigiriki.
- source_word: δὲ
  choice: Baada ya
  rationale: Kiunganishi hiki ni cha mpito wa simulizi; katika Kiswahili uhusiano wake unaelezwa kwa kawaida kupitia kishazi cha wakati bila kulazimisha “na” mwanzoni.
- source_word: ἀπελύθησαν
  choice: waliagwa
  rationale: Katika muktadha wa wajumbe wanaoondoka kwa ridhaa na baraka za jumuiya, “waliagwa” ni ya asili na haidokezi kufunguliwa kutoka kifungoni.
- source_word: μετ’ εἰρήνης
  choice: kwa amani
  rationale: Huhifadhi usemi wa kuondoka kwa amani na kwa nia njema ya jumuiya kwa lugha ya kawaida ya Kiswahili.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: na ndugu[a]
  rationale: Ingawa ἀπό kwa kawaida ni “kutoka kwa,” pamoja na kitenzi cha kuaga Kiswahili hutumia kwa kawaida mtendaji mwenye “na.” “Ndugu” huhifadhi umbo la Kigiriki huku tanbihi ikieleza uwezekano wa maana jumuishi.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: ili warudi kwa wale waliokuwa wamewatuma
  rationale: Kusudi la kuondoka kuelekea kwa waliowatuma linaelezwa kwa Kiswahili cha asili. “Warudi” inatokana na muktadha wa kurejea kwa waliowatuma, ingawa wazo la kurudi halisemwi kwa neno maalumu katika Kigiriki.
theological_decisions:
- issue: Maana jumuishi ya ἀδελφοί
  choice: ndugu[a]
  alternative: ndugu wa kiume na wa kike; waamini
  rationale: Nomino ya Kigiriki ni ya jinsia ya kiume kwa umbo, lakini katika muktadha huu huenda inairejelea jumuiya yote ya waamini. “Ndugu” ni sawa kwa umbo na pia linaweza kutumiwa kwa maana pana katika Kiswahili; tanbihi inalinda maana jumuishi bila kuiamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “waliagwa kwa amani” ni wa kawaida na unaeleweka kwa urahisi; “ili warudi” hufanya mwelekeo wa safari uwe wazi bila kuongeza maelezo ya kimadhehebu.
