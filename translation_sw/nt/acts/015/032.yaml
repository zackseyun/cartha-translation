base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: sw
  text: Yuda na Sila, ambao wao wenyewe walikuwa manabii, waliwatia moyo ndugu[a] kwa maneno mengi na wakawaimarisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu wa kiume na wa kike”; Kigiriki kinasema “ndugu” na huenda kinarejelea jumuiya yote ya waamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hili la Agano Jipya.
- source_word: τε καὶ
  choice: na
  rationale: Kiunganishi rahisi “na” kinaunganisha Yuda na Sila kwa Kiswahili cha kawaida bila uzito usiohitajika.
- source_word: Σιλᾶς
  choice: Sila
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hili.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: ambao wao wenyewe walikuwa manabii
  rationale: Huhifadhi maelezo ya kishirikishi na mkazo wa αὐτοὶ kwamba Yuda na Sila binafsi pia walikuwa manabii.
- source_word: προφῆται
  choice: manabii
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye kueleweka ya neno la Kigiriki.
- source_word: διὰ λόγου πολλοῦ
  choice: kwa maneno mengi
  rationale: Huhifadhi picha ya Kigiriki ya kusema kwa wingi huku ikionyesha kwamba huduma yao ya kuwatia moyo iliendelea kwa muda; pia huepuka kubana maana kuwa ujumbe mmoja tu mrefu.
- source_word: παρεκάλεσαν
  choice: waliwatia moyo
  rationale: Katika muktadha huu neno linaeleza kutiwa moyo au kuhimizwa; “waliwatia moyo” ni la kawaida na linafaa kwa huduma yao kwa waamini.
- source_word: τοὺς ἀδελφοὺς
  choice: ndugu
  rationale: “Ndugu” huhifadhi neno la kifamilia la Kigiriki na kwa Kiswahili linaweza kutumiwa kwa jumuiya nzima bila kuamua kimya kimya ikiwa wanawake walikusudiwa pia.
- source_word: ἐπεστήριξαν
  choice: kuwaimarisha
  rationale: Hutoa maana ya kuwafanya wawe imara na hutenganisha tendo hili na lile la kuwatia moyo.
theological_decisions:
- issue: Upeo wa τοὺς ἀδελφοὺς katika jumuiya ya waamini
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waamini
  rationale: Kigiriki kina nomino ya wingi ya kiume ambayo mara nyingi inaweza kuiwakilisha jumuiya yote ya waamini. Neno “ndugu” katika matini kuu huhifadhi lugha ya kifamilia na utata huo, huku tanbihi ikieleza uwezekano wa maana jumuishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili na unaosomeka kwa urahisi, huku ukihifadhi mkazo wa “wao wenyewe,” cheo cha “manabii,” na tofauti kati ya kuwatia moyo na kuwaimarisha.
