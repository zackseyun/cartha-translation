base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: sw
  text: Ndipo kusanyiko lote likanyamaza, likawasikiliza Barnaba na Paulo wakisimulia yote ambayo Mungu alikuwa amefanya—yaani, ishara na maajabu—miongoni mwa watu wasio Wayahudi[a] kupitia kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwa mataifa.” Hapa neno la Kigiriki ἔθνεσιν linamaanisha hasa watu wasio Wayahudi katika muktadha wa baraza la Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: likanyamaza
  rationale: 'Kauli ya wakati uliopita inaonyesha badiliko la hali katika simulizi: kusanyiko lilianza kuwa kimya. Muundo huu ni wa kawaida na wa moja kwa moja katika Kiswahili.'
- source_word: πᾶν τὸ πλῆθος
  choice: kusanyiko lote
  rationale: Katika muktadha wa mkutano wa Yerusalemu, neno hili linamaanisha kundi lote lililokusanyika; “kusanyiko” linafaa zaidi kuliko “umati” kwa mkutano huu wa mashauriano.
- source_word: ἤκουον
  choice: likawasikiliza
  rationale: Wakati usiotimilika unaonyesha usikilizaji uliokuwa ukiendelea na wenye makusudi; “kuwasikiliza” huonyesha umakini kuliko “kuwasikia” tu.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Barnaba na Paulo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: ἐξηγουμένων
  choice: wakisimulia
  rationale: Kitenzi hiki kinamaanisha kutoa habari au kueleza kwa masimulizi; “wakisimulia” huepuka kudokeza kwamba walikuwa wakifafanua maana badala ya kutoa taarifa ya matukio.
- source_word: ὅσα
  choice: ambayo
  rationale: Katika muundo wa sentensi hii, kiwakilishi hiki kinaanzisha ishara na maajabu yote yaliyokuwa maudhui ya simulizi lao bila kulazimisha Kiswahili kisicho cha kawaida.
- source_word: ἐποίησεν ὁ θεὸς
  choice: Mungu alikuwa amefanya
  rationale: Humweka Mungu wazi kuwa mtendaji mkuu, na wakati timilifu hufaa kwa matendo yaliyotangulia simulizi lao.
- source_word: σημεῖα καὶ τέρατα
  choice: ishara na maajabu
  rationale: Hili ni jozi la kawaida la Kiluka kwa matendo ya ajabu ya Mungu; haliongezi kivumishi cha kufasiri kama “za kimiujiza.”
- source_word: ἐν τοῖς ἔθνεσιν
  choice: miongoni mwa watu wa mataifa
  rationale: Katika Matendo 15, neno hili linawalenga hasa watu wasio Wayahudi. Usemi huu ni wazi katika Kiswahili na bado huhifadhi uhusiano wa neno hilo na “mataifa.”
- source_word: δι’ αὐτῶν
  choice: kupitia kwao
  rationale: 'Huhifadhi maana ya chombo au uwakala: Mungu ndiye mtendaji mkuu, naye alitenda kupitia Barnaba na Paulo.'
theological_decisions:
- issue: Utendaji wa Mungu katika utume wa mitume
  choice: Mungu anaonyeshwa kuwa ndiye aliyefanya ishara na maajabu kupitia Barnaba na Paulo.
  alternative: Barnaba na Paulo waonyeshwe kuwa watendaji wakuu wa ishara na maajabu.
  rationale: Kisarufi, ὁ θεὸς ndiye kiima cha ἐποίησεν, huku δι’ αὐτῶν ikiwaonyesha Barnaba na Paulo kuwa vyombo vya utendaji wake. Tafsiri inadumisha msisitizo huu bila kupunguza ushiriki wao halisi.
- issue: Maana ya ἔθνεσιν katika baraza la Yerusalemu
  choice: “watu wa mataifa” imetumiwa kwa maana ya watu wasio Wayahudi katika muktadha huu.
  alternative: “mataifa” pekee, ambayo inaweza kueleweka kama nchi au makundi ya kisiasa.
  rationale: Muktadha wa Matendo 15 unahusu kuingizwa kwa waamini wasio Wayahudi. Tanbihi huhifadhi mbadala wa karibu zaidi wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imedumisha mtiririko wa simulizi na msisitizo wa Kigiriki kwamba Mungu alitenda kupitia Barnaba na Paulo.
