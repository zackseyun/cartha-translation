id: ACT.15.16
reference: Acts 15:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: sw
  text: Baada ya mambo haya nitarudi, nami nitaijenga upya hema ya Daudi iliyoanguka[a]; nitajenga upya magofu yake, nami nitaisimamisha tena[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘maskani ya Daudi.’ Neno la Kigiriki linaweza kumaanisha ‘hema’ au ‘maskani.’
    reason: lexical_alternative
  - marker: b
    text: ‘Hema ya Daudi’ ni sitiari ya kinabii ya urejesho unaohusishwa na ukoo au ufalme wa Daudi.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya mambo haya
  rationale: Inahifadhi wingi wa ‘mambo haya’ na mpito wa wakati ulio katika Kigiriki, huku ikiwa Kiswahili cha kawaida.
- source_word: ἀναστρέψω
  choice: nitarudi
  rationale: Katika muktadha huu kitenzi kina maana ya kurudi; pia kinahifadhi ahadi ya nafsi ya kwanza ya Mungu katika nukuu.
- source_word: ἀνοικοδομήσω
  choice: nitaijenga upya / nitajenga upya
  rationale: Kitenzi kinaonyesha kujenga tena. ‘Kujenga upya’ ni usemi wa asili unaodumisha picha ya urejesho.
- source_word: σκηνὴν Δαυὶδ
  choice: hema ya Daudi
  rationale: ‘Hema’ huhifadhi picha halisi ya σκηνή bila kuifasiri moja kwa moja kuwa ukoo au ufalme wa Daudi.
- source_word: τὴν πεπτωκυῖαν
  choice: iliyoanguka
  rationale: Inaonyesha hali iliyotokana na kuanguka, kama ilivyo katika hali timilifu ya Kigiriki.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: magofu yake
  rationale: Ni tafsiri ya asili ya vitu vyake vilivyobomolewa, na inafaa picha ya jengo lililoanguka.
- source_word: ἀνορθώσω
  choice: nitaisimamisha tena
  rationale: Inahifadhi picha ya kukiweka tena wima kile kilichoanguka, badala ya kuifanya maana kuwa ya jumla kupita kiasi.
- source_word: αὐτήν
  choice: -i- katika ‘nitaisimamisha’
  rationale: Kiambishi hiki kinarejelea ‘hema’ kwa upatanisho wa kisarufi wa Kiswahili.
theological_decisions:
- issue: Nguvu ya sitiari ya ‘hema ya Daudi’
  choice: Sitiari imehifadhiwa kama ‘hema ya Daudi.’
  alternative: ukoo wa Daudi / ufalme wa Daudi
  rationale: Nukuu ya kinabii inadokeza urejesho unaohusishwa na ukoo au ufalme wa Daudi, lakini Kigiriki hakifafanui sitiari hiyo moja kwa moja. Kuihifadhi huepuka kuamua kimafundisho jambo ambalo maandishi yameacha katika picha ya kinabii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nami’ imetumiwa kudumisha mfululizo wa viunganishi vya Kigiriki bila kufanya sentensi kuwa nzito. Alama [a] imewekwa baada ya ‘hema ya Daudi,’ ambako maelezo yake ya kileksika yanahusika; [b] imewekwa mwishoni kwa maelezo ya sitiari nzima.
