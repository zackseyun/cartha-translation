  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: sw
  text: Basi mitume na wazee wakakusanyika[a] ili kulichunguza jambo hili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakakutana” au “walikusanyika pamoja.” Kitenzi cha Kigiriki kisarufi ni cha kutendwa (“walikusanywa”), lakini katika muktadha huu kwa kawaida humaanisha kwamba kundi lilikutana.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya neno kwa neno, “kuona kuhusu neno hili.” Hapa “neno” linamaanisha jambo au suala lililokuwa likizungumziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: wakakusanyika
  rationale: Kitenzi hiki kiko katika umbo la kutendwa kwa Kigiriki, lakini katika muktadha huu kinaeleza kwa kawaida kwamba kundi lilikutana. “Wakakusanyika” ni Kiswahili cha asili kinachohifadhi maana ya kukutana kama kundi bila kulazimisha utendaji usiotajwa.
- source_word: τε
  choice: Basi
  rationale: Kihusishi hiki kinaunganisha kwa upole tukio hili na mabishano yaliyotangulia. “Basi” linaonyesha mwendelezo na hatua iliyofuata bila kuifanya sentensi iwe nzito.
- source_word: ἀπόστολοι
  choice: mitume
  rationale: Katika Matendo, neno hili linawataja viongozi waliotambuliwa kuwa mitume; “mitume” ndilo neno la kawaida na sahihi katika Kiswahili.
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Hapa neno linamaanisha viongozi waliotambuliwa wa jumuiya, si wanaume wenye umri mkubwa tu. “Wazee” huhifadhi maana hiyo bila kuingiza muundo wa baadaye wa madhehebu.
- source_word: ἰδεῖν
  choice: kulichunguza
  rationale: Ingawa maana ya msingi ni “kuona,” hapa kitenzi hiki kinaonyesha kuchukua suala na kulifikiria kwa makini. “Kulichunguza” huwasilisha kusudi la mashauriano bila kudokeza kwamba uamuzi ulikuwa tayari umefanywa.
- source_word: περὶ τοῦ λόγου τούτου
  choice: jambo hili
  rationale: λόγος inaweza kumaanisha neno, ujumbe, hoja, au jambo. Katika muktadha wa mkutano huu inarejelea suala lililokuwa likibishaniwa, hivyo “jambo hili” ni wazi na la asili.
theological_decisions:
- issue: Hadhi ya πρεσβύτεροι katika mkutano wa Yerusalemu
  choice: wazee
  alternative: makasisi au presbiteri kama cheo maalumu cha mfumo wa kanisa wa baadaye
  rationale: Aya inawataja viongozi waliotambuliwa wa kanisa la Yerusalemu, lakini haibainishi mfumo wa kiutawala wa madhehebu ya baadaye. “Wazee” huhifadhi maana ya kihistoria bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Kusudi la mashauriano
  choice: ili kulichunguza jambo hili
  alternative: ili kuamua jambo hili
  rationale: ἰδεῖν inaeleza kulichukua suala kwa uchunguzi na mashauriano. Tafsiri hii haidai mapema kwamba mkutano ulikuwa tayari umefikia au umeazimia uamuzi fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi” linaendeleza simulizi; “wakakusanyika” na “kulichunguza jambo hili” ni rahisi kueleweka huku zikihifadhi maana na mvutano wa maandishi ya Kigiriki.
