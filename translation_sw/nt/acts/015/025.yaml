id: ACT.15.25
reference: Acts 15:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: sw
  text: tuliona ni vema, baada ya kufikia kauli moja[a], kuchagua wanaume[b] na kuwatuma kwenu pamoja na wapendwa wetu Barnaba na Paulo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukiwa na nia moja”; au, “kwa kauli moja.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, wajumbe wa kiume; Kigiriki kinasema wazi “wanaume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: tuliona ni vema
  rationale: Hii ni kauli ya kawaida ya kuonyesha uamuzi uliokubaliwa baada ya mashauriano. “Tuliona ni vema” inadumisha sauti ya uamuzi wa pamoja bila kuufanya kuwa amri kali au hukumu ya moja kwa moja kuhusu yaliyo sawa kimaadili.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: baada ya kufikia kauli moja
  rationale: Kirai hiki kinaonyesha kwamba kundi lilifikia umoja katika uamuzi wake. “Baada ya kufikia kauli moja” kinabeba mchakato unaodokezwa na γενομένοις na umoja unaoelezwa na ὁμοθυμαδόν.
- source_word: ἐκλεξαμένοις
  choice: kuchagua
  rationale: 'Ingawa kwa muundo ni participio, hapa kinaunganishwa kwa kawaida na πέμψαι: waliona ni vema kuchagua wanaume na kuwatuma. Muundo huu ni wa asili katika Kiswahili na unahifadhi uhusiano wa vitendo hivyo.'
- source_word: ἄνδρας
  choice: wanaume
  rationale: ἀνήρ hapa humaanisha wanaume watu wazima, si watu kwa ujumla. Muktadha unaonyesha kuwa wajumbe hao ni Yuda na Sila (mstari wa 27), kwa hiyo “wanaume” ni sahihi kileksia na kimuktadha.
- source_word: πέμψαι
  choice: na kuwatuma kwenu
  rationale: Kiambishi “-wa-” kinarejelea wanaume waliochaguliwa, kama inavyodokezwa wazi na muundo wa Kigiriki. “Kwenu” kinawasilisha πρὸς ὑμᾶς kwa Kiswahili cha kawaida.
- source_word: σὺν
  choice: pamoja na
  rationale: Hiki kinaonyesha kuandamana; “pamoja na” ni wazi na cha asili katika muktadha huu.
- source_word: ἀγαπητοῖς ἡμῶν
  choice: wapendwa wetu
  rationale: Kinaonyesha upendo na uhusiano wa karibu. “Wapendwa wetu” kinahifadhi joto la kauli hiyo pamoja na hadhi yake.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Barnaba na Paulo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili sanifu cha Biblia.
theological_decisions:
- issue: Sauti ya uamuzi wa pamoja katika barua ya Yerusalemu
  choice: tuliona ni vema
  alternative: tuliamua; ulikuwa uamuzi wetu
  rationale: Muundo wa δοκέω unaonyesha tathmini au idhini ya pamoja. “Tuliona ni vema” unahifadhi sauti hiyo ya mashauriano bila kuingiza mamlaka ya amri ambayo haijaelezwa wazi katika kifungu hiki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi tabia ya kifungu hiki kuwa sehemu inayoendelea ya sentensi ya barua, ndiyo sababu kinaishia kwa koma.
