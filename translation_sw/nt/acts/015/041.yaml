  text: Naye alikuwa akipita katika Siria na Kilikia, akiyatia nguvu makusanyiko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: akapita katika
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha kusafiri kupitia maeneo hayo; Kiswahili cha simulizi hutumia kwa kawaida “akapita katika” bila kulazimisha maelezo ya muda.
- source_word: δὲ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa upole; “Naye” huunganisha mstari huu na tendo la mhusika aliyetajwa katika muktadha.
- source_word: Συρίαν
  choice: Siria
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la eneo hilo.
- source_word: Κιλικίαν
  choice: Kilikia
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la eneo hilo.
- source_word: ἐπιστηρίζων
  choice: akiyatia nguvu
  rationale: 'Kirai hiki kinaonyesha tendo lililoambatana na safari: kuyafanya makusanyiko yawe imara. “Kuyatia nguvu” ni cha asili na hakipunguzi maana kuwa faraja ya kihisia tu.'
- source_word: τὰς ἐκκλησίας
  choice: makusanyiko
  rationale: Katika muktadha huu neno hilo linamaanisha jumuiya za waamini katika maeneo mbalimbali. “Makusanyiko” linaeleweka kwa Kiswahili cha sasa na huepuka kuelekeza fikira hasa kwenye majengo.
