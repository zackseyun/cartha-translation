  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: sw
  text: Kwa maana tangu vizazi vya kale, Musa amekuwa na watu wanaomhubiri katika kila mji,[a] akisomwa katika masinagogi kila Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Musa … watu wanaomhubiri … akisomwa.” Hapa “Musa” anawakilisha kwa njia ya kimajazi maandiko au sheria inayohusishwa naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kwamba mstari huu unatoa sababu au maelezo ya uamuzi uliotangulia.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: tangu vizazi vya kale
  rationale: Huhifadhi wazo la vizazi vingi na desturi iliyoendelea tangu zamani.
- source_word: κατὰ πόλιν
  choice: katika kila mji
  rationale: 'Huonyesha maana ya mgawanyo: jambo hili hutokea mji kwa mji.'
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: watu wanaomhubiri
  rationale: Huhifadhi lugha ya kutangaza hadharani na rejeo la kimajazi kwa Musa mwenyewe.
- source_word: ἔχει
  choice: amekuwa na
  rationale: Wakati uliopo pamoja na 'tangu vizazi vya kale' unaonyesha hali iliyoanza zamani na kuendelea hadi sasa.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: katika masinagogi
  rationale: Ni mahali pa kawaida ambapo maandiko yanayohusishwa na Musa yalisomwa.
- source_word: κατὰ πᾶν σάββατον
  choice: kila Sabato
  rationale: Huwasilisha urudiaji wa kawaida kwa njia fupi na ya asili katika Kiswahili.
- source_word: ἀναγινωσκόμενος
  choice: akisomwa
  rationale: Huhifadhi muundo wa kitenzi tegemezi cha wakati mmoja na sauti ya kutendwa bila kuongeza wazi maana ya sababu.
theological_decisions:
- issue: Rejeo la kimajazi kwa Musa
  choice: Kudumisha 'Musa,' 'wanaomhubiri,' na 'akisomwa.'
  alternative: Kusema wazi 'sheria ya Musa' au 'maandiko ya Musa.'
  rationale: Kiyunani humtaja Musa mwenyewe kwa njia ya kimajazi ikimaanisha maandiko au sheria inayohusishwa naye. Kudumisha namna hiyo huepuka kuingiza ufafanuzi katika matini kuu.
- issue: Uhusiano wa ἀναγινωσκόμενος na kishazi kikuu
  choice: Kutafsiri 'akisomwa.'
  alternative: Kutafsiri 'kwa sababu anasomwa' au 'kwa kuwa anasomwa.'
  rationale: Muundo wa Kiyunani unaweza kuwa na nguvu ya maelezo, lakini hauweki kiunganishi cha sababu wazi; tafsiri ya kitenzi tegemezi huhifadhi uwazi huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Masinagogi' na 'Sabato' ni istilahi za kawaida za kibiblia; koma kabla ya alama ya tanbihi inafuata mtiririko wa sentensi.
