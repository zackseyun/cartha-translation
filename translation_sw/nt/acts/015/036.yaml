source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: sw
  text: Baada ya siku kadhaa, Paulo akamwambia Barnaba, “Sasa turudi tukawatembelee ndugu[a] katika kila mji ambamo tulitangaza neno la Bwana, na tuone hali yao ikoje.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike”; neno la Kigiriki ni “ndugu” katika umbo la kiume, lakini linaweza kuwakilisha kundi lote la waumini.
    reason: Mbadala wa kileksika unaofafanua uwezekano wa maana jumuishi ya ἀδελφοί.
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Baada ya siku kadhaa
  rationale: Muundo wa μετά pamoja na usemi wa wakati unaonyesha wakati unaofuata; tafsiri hii inahifadhi muda usioainishwa bila kudokeza kuwa ulikuwa mrefu.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: Paulo akamwambia Barnaba
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza kuwa Paulo alisema jambo kwa Barnaba, huku ikihifadhi utambulisho wa msemaji na mhusika aliyeambiwa.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Sasa turudi tukawatembelee
  rationale: Kirai shirikishi Ἐπιστρέψαντες kinaungana na kitenzi cha kuhimiza ἐπισκεψώμεθα. Muundo huu wa Kiswahili unaonyesha pendekezo la pamoja, urudi, na ziara yenye kujali; “sasa” huwasilisha nguvu ya δή.
- source_word: τοὺς ἀδελφοὺς
  choice: ndugu
  rationale: “Ndugu” ni neno la kifamilia linalolingana na ἀδελφοί na kwa Kiswahili linaweza kurejelea waumini wa kiume na wa kike bila kulazimisha jinsia ambayo muktadha hauibainishi.
- source_word: κατὰ πόλιν πᾶσαν
  choice: katika kila mji
  rationale: 'Huhifadhi maana gawanyifu ya κατά: kila mji walikohudumu hapo awali.'
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: ambamo tulitangaza
  rationale: “Tulitangaza” huonyesha tangazo la wazi la ujumbe, sawa na nguvu ya καταγγέλλω.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: neno la Bwana
  rationale: Hifadhi usemi wa chanzo unaorejelea ujumbe unaomhusu au unaotoka kwa Bwana, na hutafsiri κύριος kwa istilahi ya kawaida ya Agano Jipya, “Bwana.”
- source_word: πῶς ἔχουσιν
  choice: ili tujue hali yao
  rationale: Nahau hii inauliza hali yao ilivyo. Kiswahili hiki cha kawaida kinaonyesha kusudi la ziara na hangaiko kwa hali ya waumini bila kuongeza maelezo yasiyomo.
theological_decisions:
- issue: Upeo wa ἀδελφοί katika jumuiya inayoweza kuwa na wanaume na wanawake
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waumini
  rationale: “Ndugu” huhifadhi lugha ya kifamilia ya Kigiriki na katika Kiswahili inaweza kuwa jumuishi. Tanbihi inaweka wazi uwezekano huo bila kubadili neno la msingi kuwa ufafanuzi.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mheshimiwa; Mkuu
  rationale: “Bwana” ndiyo tafsiri ya kawaida na yenye hadhi ya κύριος katika muktadha huu na inadumisha uhusiano wa kitheolojia wa ujumbe na Bwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Turudi tukawatembelee” ni muundo wa kawaida unaobeba pendekezo la pamoja na mfuatano wa kurudi kisha kutembelea. Alama ya tanbihi imewekwa moja kwa moja baada ya “ndugu.”
