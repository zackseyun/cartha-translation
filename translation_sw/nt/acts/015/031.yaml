lexical_decisions:
- source_word: ἀναγνόντες
  choice: Walipoisoma
  rationale: Kirai cha hali cha aoristi kinaonyesha tendo lililotangulia tendo kuu. Kiambishi cha yambwa -i- kinarejelea barua iliyotajwa katika mstari uliotangulia.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno tofauti)
  rationale: δέ ni kiunganishi hafifu cha kuendeleza simulizi; katika Kiswahili mtiririko wa sentensi tayari unaonyesha uhusiano huo, hivyo kuongeza “na” si lazima.
- source_word: ἐχάρησαν
  choice: walifurahi
  rationale: Huwasilisha kwa lugha ya kawaida maana ya χαίρω ya kupata furaha.
- source_word: ἐπὶ
  choice: kwa sababu ya
  rationale: Pamoja na hali ya dativu hapa, ἐπί inaonyesha msingi au sababu ya kufurahi.
- source_word: τῇ παρακλήσει
  choice: faraja iliyokuwamo
  rationale: παράκλησις inaweza kumaanisha faraja, kutia moyo, au kuhimiza. “Faraja” ni ya asili katika muktadha wa waamini kutulizwa na ujumbe wa barua, huku tanbihi ikihifadhi upana wa maana.
