  text: Walipoisoma[a] barua hiyo, walifurahi kwa sababu ya ujumbe wake wa kutia moyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya kuisoma barua hiyo, walifurahi kwa sababu ya himizo hilo.” Neno la Kigiriki linaweza pia kumaanisha faraja.
