  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: sw
  text: Kwa maana imeonekana vema kwa Roho Mtakatifu na kwetu sisi tusiwatwike mzigo wowote zaidi ya mambo haya ya lazima:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho Mtakatifu na sisi tumeamua.” Nahau ya Kigiriki inaweza kutafsiriwa kwa namna ya moja kwa moja zaidi kama kauli ya uamuzi.
    reason: lexical_alternative
  - marker: b
    text: Au, “masharti haya ya lazima” au “mambo haya muhimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: tumeona vema
  rationale: Nahau hii ya Kiswahili huwasilisha uamuzi uliofikiwa baada ya kutafakari, huku ikidumisha mtindo wa Kigiriki unaoweza pia kumaanisha ‘imeamuliwa.’
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Roho Mtakatifu
  rationale: Kirai hiki ni mhusika wa kwanza katika kauli ya kuona kuwa ni vema, na kinadumisha utendaji binafsi wa Roho Mtakatifu.
- source_word: καὶ ἡμῖν
  choice: na sisi
  rationale: Huhifadhi uratibu wa wazi kati ya Roho Mtakatifu na kusanyiko la mitume katika kuuthibitisha uamuzi.
- source_word: μηδὲν πλέον
  choice: mwingine wowote
  rationale: Pamoja na ‘mzigo,’ maneno haya yanaonyesha kutoweka mzigo wa ziada au mkubwa zaidi ya masharti yanayotajwa.
- source_word: ἐπιτίθεσθαι ὑμῖν
  choice: tusiwatwike
  rationale: ‘Kuwatwika’ ni usemi wa asili wa Kiswahili unaodumisha taswira ya kuweka mzigo juu ya watu.
- source_word: βάρος
  choice: mzigo
  rationale: Neno hili huhifadhi sitiari ya wajibu au masharti yanayowekwa juu ya waamini.
- source_word: πλὴν
  choice: isipokuwa
  rationale: Linaanzisha kwa uwazi jambo linalotengwa baada ya kauli hasi.
- source_word: τούτων τῶν ἐπάναγκες
  choice: mambo haya ya lazima
  rationale: Tafsiri hii iko karibu na Kigiriki, inaelekeza mbele kwenye masharti ya mstari unaofuata, na haifafanui kupita kiasi aina ya ulazima wake.
theological_decisions:
- issue: Uhusiano wa Roho Mtakatifu na uamuzi wa baraza
  choice: 'Roho Mtakatifu na kusanyiko wanaonyeshwa kuwa wameuthibitisha uamuzi: ‘Roho Mtakatifu na sisi tumeona vema.’'
  alternative: Kauli ya kibinadamu tu ya makubaliano, au ushawishi usio na nafsi.
  rationale: Muundo wa Kigiriki unawaunganisha ‘Roho Mtakatifu’ na ‘sisi’ katika kauli moja ya uamuzi; tafsiri haipunguzi utendaji wa Roho wala kuugeuza kuwa uamuzi wa wanadamu pekee.
- issue: Nguvu na upeo wa agizo kwa waamini wa Mataifa
  choice: Hakuna mzigo mwingine unaowekwa isipokuwa mambo maalumu yanayoitwa ya lazima.
  alternative: Kutokuwapo kabisa kwa wajibu wowote, au kuwekwa kwa Sheria yote ya Musa.
  rationale: Maneno ya mstari yanaweka mpaka wa mzigo bila kuingiza mfumo wa baadaye wa kimafundisho kuhusu sheria na neema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kuwatwika mzigo’ ni sitiari ya kawaida na inaeleweka; mpangilio ‘Roho Mtakatifu na sisi’ unasikika wa kimaandiko lakini unabaki wazi kwa msomaji wa kawaida.
