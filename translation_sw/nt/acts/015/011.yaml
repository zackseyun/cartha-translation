base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: sw
  text: Lakini tunaamini kwamba sisi tutaokolewa[a] kwa neema ya Bwana Yesu, kama wao pia watakavyookolewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinaweza kutafsiriwa kwa karibu zaidi, “tunaamini kuokolewa”; umbo hilo halitaji wazi wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofautishaji wenye nguvu na kauli iliyotangulia, huku ikibaki ya kawaida na yenye heshima katika Kiswahili.
- source_word: διὰ τῆς χάριτος
  choice: kwa neema
  rationale: διά pamoja na jenitivi hapa inaonyesha njia au chombo cha wokovu; ‘kwa neema’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: χάριτος
  choice: neema
  rationale: ‘Neema’ ni istilahi ya kawaida ya kibiblia inayoeleza fadhili ya Mungu inayotolewa bila kustahiliwa, bila kuongeza mfumo maalumu wa kimadhehebu.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ya Bwana Yesu
  rationale: Jenitivi inaunganisha neema na Bwana Yesu kama neema yake au neema inayotolewa naye.
- source_word: πιστεύομεν
  choice: tunaamini
  rationale: Hutoa maana ya imani au usadikisho wa pamoja unaotanguliza maudhui ya kauli inayofuata.
- source_word: σωθῆναι
  choice: kwamba sisi tutaokolewa
  rationale: Infinitivi tendwa ya Kigiriki imewasilishwa kwa kishazi kamili cha Kiswahili. Wakati ujao unafaa muktadha na mapokeo mapana ya tafsiri, huku tanbihi ikibainisha kwamba Kigiriki hakina kitenzi kisaidizi cha wakati ujao kilicho wazi hapa.
- source_word: καθ’ ὃν τρόπον
  choice: kama ... watakavyookolewa
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida ulinganisho wa namna ileile.
- source_word: κἀκεῖνοι
  choice: wao pia
  rationale: κἀκεῖνοι ni muungano wa καὶ ἐκεῖνοι, yaani ‘wao pia’; kiwakilishi hiki kinadumisha mwelekeo wa ulinganisho kutoka ‘sisi’ kwenda ‘wao.’
theological_decisions:
- issue: Mwelekeo wa ulinganisho katika kauli ya Petro
  choice: ‘Sisi’ (waamini Wayahudi) tutaokolewa kama ‘wao pia’ (Mataifa) watakavyookolewa.
  alternative: ‘Wao’ wataokolewa kama ‘sisi.’
  rationale: Mpangilio na sarufi ya Kigiriki zinaanza na ‘tunaamini’ na kuulinganisha wokovu wa ‘sisi’ na ule wa ‘wao pia.’ Hivyo tafsiri haigeuzi msisitizo muhimu wa kifungu.
- issue: Wokovu kwa neema
  choice: Wokovu unatolewa kwa neema ya Bwana Yesu.
  alternative: Kuongeza kauli za kimfumo kama ‘kwa neema pekee kupitia imani pekee.’
  rationale: Aya inataja neema na kuamini, lakini haitoi fomula hiyo iliyopanuliwa; tafsiri haiongezi hitimisho la kimadhehebu lisilotamkwa.
- issue: Wakati wa σωθῆναι
  choice: Wakati ujao umetumiwa katika matini kuu, pamoja na tanbihi kuhusu umbo lisilo na wakati uliotajwa wazi.
  alternative: ‘Tunaokolewa’ au tafsiri ya karibu kabisa ‘kuokolewa.’
  rationale: Infinitivi ya aoristi haina kitenzi kisaidizi cha wakati ujao kilicho wazi, lakini katika muktadha wa πιστεύομεν na matarajio ya wokovu, Kiswahili cha wakati ujao ni cha kawaida. Tanbihi inalinda upana wa umbo la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. ‘Sisi’ imetajwa wazi ili kudumisha mwelekeo wa ulinganisho uliomo katika Kigiriki; ‘watakavyookolewa’ imejazwa kwa uwazi wa Kiswahili bila kubadili mhusika wa ulinganisho.
