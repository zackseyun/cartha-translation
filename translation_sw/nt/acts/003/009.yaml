  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya kawaida bila kuongeza maana ya wakati isiyokuwamo wazi katika Kigiriki.
- source_word: εἶδεν
  choice: wakamwona
  rationale: Kitenzi hiki kinaripoti kwamba watu walimwona mtu aliyeponywa; muundo wa kisimulizi wenye “waka-” ni wa asili katika Kiswahili.
- source_word: πᾶς ὁ λαὸς
  choice: watu wote
  rationale: Kirai hiki kina maana ya ujumla, yaani watu wote waliokuwapo, si lazima umati kama kundi lisilo na utambulisho.
- source_word: αὐτὸν
  choice: -mwona
  rationale: Kiambishi cha yambwa “-m-” kinamrejelea mtu aliyeponywa katika muktadha uliotangulia.
- source_word: περιπατοῦντα
  choice: akitembea
  rationale: Kishiriki cha wakati uliopo kinaonyesha tendo lililokuwa likionekana; “akitembea” ni usemi wa kawaida na unasisitiza matokeo ya uponyaji.
- source_word: καὶ αἰνοῦντα
  choice: na kumsifu
  rationale: Kitenzi αἰνέω humaanisha kutoa sifa, hasa kwa Mungu; “kumsifu” ni tafsiri ya kawaida, fupi, na yenye heshima.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa maalumu wa tendo la kusifu; Kiswahili hakihitaji kipatanishi kinacholingana na kibainishi cha Kigiriki hapa.
