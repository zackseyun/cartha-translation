  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: sw
  text: Mungu alipomwinua[a] mtumishi wake[b], alimtuma kwenu kwanza ili awabariki kwa kumgeuza kila mmoja wenu kutoka katika maovu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipomleta/kumteua.” Neno la Kigiriki linaweza kumaanisha Mungu alimwinua mtumishi wake kwa maana ya kumleta au kumteua, wala si lazima limaanishe hasa kumfufua kutoka kwa wafu.
    reason: alternative_reading
  - marker: b
    text: Au, “mtoto wake.” Neno la Kigiriki παῖς linaweza kumaanisha “mtumishi” au “mtoto,” ingawa hapa “mtumishi” huenda ikaonyesha mwangwi wa Mtumishi wa Isaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: kwenu kwanza
  rationale: Huhifadhi wazo la kipaumbele cha wale waliohutubiwa na pia nguvu ya dati inayoonyesha wale ambao Mtumishi alitumwa kwao.
- source_word: ἀναστήσας
  choice: alipomwinua
  rationale: Neno hili linaweza kueleweka kuwa Mungu alimfufua kutoka kwa wafu au alimwinua kwa maana ya kumleta/kumteua kuwa Mtumishi wake. ‘Alipomwinua’ huhifadhi kwa kiasi kikubwa uwazi huo bila kuamua maana moja kimyakimya.
- source_word: τὸν παῖδα αὐτοῦ
  choice: Mtumishi wake
  rationale: Katika muktadha huu ‘Mtumishi’ huonyesha vizuri mwangwi wa Mtumishi wa Isaya. Maana ya ‘mtoto’ inawezekana kileksika, lakini ‘Mwana’ ingekuwa tafsiri yenye ufafanuzi mwingi kuliko neno la Kigiriki lenyewe.
- source_word: ἀπέστειλεν αὐτόν
  choice: alimtuma
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi wazo la kutumwa bila kuongeza dhana maalumu ya uteuzi rasmi.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: ili awabariki
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kusudi au matokeo yanayoambatana na kutumwa kwake.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: kwa kumgeuza kila mmoja wenu
  rationale: ‘Kwa’ huonyesha njia ambayo baraka hiyo inatimizwa, na ‘kila mmoja wenu’ huhifadhi nguvu ya mgawanyo ya ἕκαστον pamoja na walengwa waliotajwa.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: kutoka katika maovu yenu
  rationale: Huhifadhi wingi na uzito wa kimaadili wa πονηρίαι bila kuufanya usemi huo kuwa matendo tu, ingawa matendo maovu yanahusishwa.
theological_decisions:
- issue: Maana ya ἀναστήσας kuhusu Yesu
  choice: Kuhifadhi ‘alipomwinua’ bila kubainisha iwapo ni kufufuliwa kutoka kwa wafu au kuletwa/kuteuliwa na Mungu.
  alternative: ‘alipomfufua kutoka kwa wafu’ au ‘alipomleta/kumteua’
  rationale: Kigiriki kinaweza kusikika kwa maana ya ufufuo, lakini pia kinaweza kuhusishwa na Mungu kumwinua nabii au Mtumishi. Tafsiri kuu haiondoi mvutano huo wa kitheolojia.
- issue: Maana ya kikristolojia ya παῖς
  choice: Mtumishi
  alternative: mtoto; Mwana
  rationale: ‘Mtumishi’ hudumisha uwezekano mkubwa wa msingi wa Mtumishi wa Isaya na huepuka kuingiza dai la wazi la uana ambalo neno hili pekee halitamki hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio umewekwa katika mtiririko wa kawaida wa Kiswahili huku ‘kwenu kwanza’ ikihifadhiwa karibu na kitenzi cha kutuma. Herufi kubwa katika ‘Mtumishi’ inaonyesha rejeo mahususi la kimasiya bila kubadili maana ya neno kuwa ‘Mwana.’
