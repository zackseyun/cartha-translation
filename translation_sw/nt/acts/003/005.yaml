  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: sw
  text: Basi akawakazia macho[a], akitarajia kupokea kitu kutoka kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaelekezea uangalifu wake” au “aliwaangalia kwa makini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Basi aka-
  rationale: δέ ni kiunganishi chepesi kinachoendeleza simulizi; “basi” linaonyesha mwendelezo wa tukio bila kuleta upinzani mkali, huku kiambishi cha nafsi katika kitenzi kikimrejelea yule mtu.
- source_word: ἐπεῖχεν
  choice: akawaelekezea fikira zake
  rationale: Katika muktadha huu kitenzi kinaonyesha kuelekeza na kudumisha uangalifu kwa watu fulani. Tafsiri hii haikifanyi kitendo kuwa kutazama kwa macho tu, na inaendana na hali endelevu ya kitenzi cha Kigiriki.
- source_word: αὐτοῖς
  choice: -wa-
  rationale: Kiambishi hiki cha yambwa kinawarejelea Petro na Yohana na kuonyesha kwamba fikira zake zilielekezwa kwao.
- source_word: προσδοκῶν
  choice: akitarajia
  rationale: 'Kitenzi-jina hiki kinaeleza hali iliyoandamana na kuelekeza fikira kwake: alikuwa na matarajio ya kupata kitu.'
- source_word: τι
  choice: kitu
  rationale: Neno hili linaacha kile alichotarajia bila kukitaja wazi, kama ilivyo katika Kigiriki.
- source_word: παρ’ αὐτῶν
  choice: kutoka kwao
  rationale: παρά pamoja na jenitivi huonyesha chanzo; walikuwa watu ambao alitarajia kupokea kitu kwao.
- source_word: λαβεῖν
  choice: kupokea
  rationale: “Kupokea” linafaa kwa jambo ambalo mtu anatarajia kupewa na halidokezi kulichukua kwa nguvu.
