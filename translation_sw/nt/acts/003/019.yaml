lexical_decisions:
- source_word: μετανοήσατε
  choice: tubuni
  rationale: Kitenzi cha amri kinadai hatua thabiti ya toba. “Tubuni” ni usemi wa kawaida na wenye uzito wa kimaadili, bila kuifanya maana kuwa dhaifu kama “badilisheni mawazo yenu.”
- source_word: οὖν
  choice: Basi
  rationale: “Basi” linaonyesha hitimisho linalotokana na hoja iliyotangulia na ni la kawaida katika Kiswahili sanifu.
- source_word: ἐπιστρέψατε
  choice: mgeuke
  rationale: Huhifadhi amri tendaji na wazo la kubadili mwelekeo bila kuongeza wazi “kwa Mungu,” ambalo halitajwi moja kwa moja katika kishazi hiki, wala kutumia usemi wa kutendwa kama “mgeuzwe.”
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: ili ... zifutwe
  rationale: Muundo huu unaonyesha kusudi au matokeo bila kulazimisha uhusiano wa kisababishi ulio finyu kuliko Kigiriki.
- source_word: ἐξαλειφθῆναι
  choice: zifutwe
  rationale: Huhifadhi taswira ya kuondolewa kabisa kwa maandishi au kumbukumbu kwa lugha ya sasa na inayoeleweka.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: Ni tafsiri ya kawaida na pana ya wingi wa ἁμαρτία; haibani maana iwe matendo pekee.
theological_decisions:
- issue: Uhusiano kati ya kutubu, kugeuka, na kufutwa kwa dhambi
  choice: ili dhambi zenu zifutwe
  alternative: kwa ajili ya kufutwa kwa dhambi zenu
  rationale: Tafsiri inadumisha uhusiano wa kusudi au matokeo uliomo katika maandishi bila kuingiza mpangilio kamili wa kimafundisho kuhusu wokovu.
- issue: Mwelekeo wa ἐπιστρέψατε
  choice: mgeuke
  alternative: mrudi kwa Mungu
  rationale: Muktadha unaelekeza kwa Mungu, lakini kishazi cha Kigiriki hakitaji wazi yule anayegeukiwa. “Mgeuke” huhifadhi kiasi hicho cha kutotajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” na vitenzi vya amri vya wingi vinafuata mtiririko wa kawaida wa hotuba; tashbihi ya kufuta dhambi imehifadhiwa.
