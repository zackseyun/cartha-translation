review_pass:
  verdict: revise
  source_fidelity: “Tubuni” accurately conveys μετανοήσατε, and “Basi” suitably conveys the inferential οὖν. The purpose construction “ili dhambi zenu zifutwe” faithfully represents πρὸς τὸ ἐξαλειφθῆναι ... τὰς ἁμαρτίας without specifying a doctrinal mechanism. However, “mgeuke” can mean ‘turn around/change direction’ and is less precise and natural here than “mrejee,” which better conveys the returnative force of ἐπιστρέψατε while leaving the implied destination unstated.
  naturalness: The revised wording is fluent, standard East African Swahili and fits Peter’s public exhortation. “Tubuni basi, mrejee” is a natural, dignified paired imperative. The current footnote wording, “zifutiliwe mbali,” is not idiomatic standard Swahili.
  terminology: “Dhambi” and “zifutwe” are established, clear biblical terminology. “Mrejee” retains the active imperative and does not introduce an explicit object such as ‘to God.’
  issues:
  - severity: medium
    issue: “Mgeuke” is a less apt rendering of ἐπιστρέψατε in this exhortation.
    rationale: While grammatically possible, it commonly evokes simply turning around. “Mrejee” more naturally expresses turning/returning in response to repentance and better reflects the prefixal return sense of ἐπιστρέφω, without making the implied referent explicit.
  - severity: low
    issue: The lexical-alternative footnote is unnatural.
    rationale: “Zifutiliwe mbali” is not a customary idiom and does not offer a clear equivalent alternative. “Ziondolewe” is natural and preserves the removal sense as a legitimate alternative.
  revised_text: Tubuni basi, mrejee, ili dhambi zenu zifutwe[a],
  revised_footnotes:
  - marker: a
    text: Au, “ziondolewe.”
