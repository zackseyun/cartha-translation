  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: sw
  text: Nao manabii wote tangu Samweli na wale waliomfuata[a]—wote walionena—pia walitangaza[b] siku hizi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale waliofuata kwa mfululizo” au “wale waliokuja baada yake.”
    reason: lexical_alternative
  - marker: b
    text: Au “walihubiri”; kwa tafsiri yenye ufafanuzi zaidi, “walitabiri.”
    reason: lexical_alternative
  - marker: c
    text: Au “nyakati hizi.” Kirai hiki kinarejelea kipindi cha sasa cha utimilifu katika hotuba ya Petro.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: Nao manabii wote
  rationale: δέ ina nguvu ndogo ya kuunganisha hoja; “Nao” huiendeleza kwa Kiswahili cha kawaida bila kuleta upinzani usiokuwapo, huku “manabii wote” ikihifadhi πάντες οἱ προφῆται.
- source_word: ἀπὸ Σαμουὴλ
  choice: tangu Samweli
  rationale: ἀπό hapa humtaja Samweli kuwa mwanzo wa mfululizo; “tangu Samweli” ni ya asili na wazi kwa Kiswahili.
- source_word: τῶν καθεξῆς
  choice: wale waliomfuata
  rationale: καθεξῆς hudokeza mfululizo au kufuatana. Kauli hii ya nomino inaeleweka vizuri kama manabii waliokuja baada ya Samweli.
- source_word: ὅσοι ἐλάλησαν
  choice: wote walionena
  rationale: ὅσοι ina upeo jumuishi na ἐλάλησαν ni “walinena/walisema.” “Walionena” inafaa kwa muktadha wa kinabii na inadumisha sajili yenye hadhi.
- source_word: καὶ κατήγγειλαν
  choice: pia walitangaza
  rationale: καταγγέλλω humaanisha kutangaza au kuhubiri hadharani. “Walitangaza” huepuka kuingiza moja kwa moja maana pana zaidi ya “walitabiri,” nayo “pia” huonyesha καί.
- source_word: τὰς ἡμέρας ταύτας
  choice: siku hizi
  rationale: Hili ndilo tafsiri ya moja kwa moja ya kirai cha wakati, huku muktadha ukiruhusu maana ya kipindi hiki cha utimilifu bila kuiweka wazi kupita maandishi.
theological_decisions:
- issue: Rejeo la manabii kwa kipindi cha sasa cha utimilifu katika historia ya wokovu
  choice: siku hizi
  alternative: nyakati hizi
  rationale: “Siku hizi” huhifadhi taswira halisi ya Kigiriki na utata wake wa wakati. Muktadha wa hotuba ya Petro unaweza kuelekeza kwenye kipindi cha utimilifu wa Kimasihi, lakini tafsiri haibainishi zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Walionena” hudumisha ladha ya kinabii bila kuwa ya kizamani kupita kiasi; vistari vinatenganisha kirai jumuishi ili sentensi ndefu ibaki wazi.
