  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: sw
  text: Akaruka juu, akasimama, akaanza kutembea. Kisha akaingia pamoja nao hekaluni, akitembea, akirukaruka na kumsifu Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: Akaruka kwa miguu
  rationale: Kitenzi hiki kinaonyesha kuruka juu au kusimama kwa mruko; usemi huu wa kawaida unaonyesha kwamba mtu huyo aliinuka ghafla kwa miguu yake.
- source_word: περιεπάτει
  choice: akaanza kutembea
  rationale: Wakati usiotimilifu unaonyesha tendo lililoanza na kuendelea; Kiswahili cha asili hutumia ‘akaanza kutembea’ katika muktadha huu.
- source_word: τὸ ἱερὸν
  choice: hekaluni
  rationale: Hapa neno linarejelea eneo la Hekalu kwa ujumla, si lazima jengo la ndani la patakatifu; ‘hekaluni’ ni tafsiri ya kawaida na inayoeleweka.
- source_word: ἁλλόμενος
  choice: akirukaruka
  rationale: Umbo la wakati uliopo linaonyesha kuruka-ruka kulikokuwa kukiendelea, tofauti na mruko wa kwanza wa ἐξαλλόμενος.
- source_word: αἰνῶν τὸν θεόν
  choice: kumsifu Mungu
  rationale: Hutoa kwa usahihi tendo la wazi la kumtolea Mungu sifa.
theological_decisions: []
