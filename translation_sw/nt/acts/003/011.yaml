base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: sw
  text: Yule mtu alipokuwa akiwashikilia Petro na Yohana[a], watu wote wakakusanyika mbio kuwaendea kwenye ukumbi wenye nguzo[b] ulioitwa wa Sulemani, wakiwa wameshangaa sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipokuwa ameng’ang’ania Petro na Yohana.” Kitenzi cha Kigiriki kinaweza kusisitiza kushika kwa nguvu au kutowaachilia.
    reason: lexical_alternative
  - marker: b
    text: “Ukumbi wenye nguzo” ni ukumbi uliofunikwa wenye safu za nguzo katika viwanja vya hekalu, uliojulikana kwa jadi kama Ukumbi wa Sulemani.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: Yule mtu alipokuwa amewashikilia
  rationale: Muundo wa genitive absolute wenye kitenzi cha wakati uliopo unaonyesha tendo lililoendelea wakati huo. “Kuwashikilia” huhifadhi maana ya kushika kwa nguvu au kutowaachilia bila kuongeza hisia zisizotajwa wazi.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: Petro na Yohana
  rationale: Majina ya kawaida katika Kiswahili cha Biblia.
- source_word: συνέδραμεν
  choice: wakawakimbilia
  rationale: Kitenzi kinaonyesha watu kukimbia na kukusanyika kuelekea mahali pamoja; “wakawakimbilia” ni cha asili na huhifadhi mwendo wa haraka pamoja na mwelekeo kwa Petro na Yohana.
- source_word: πᾶς ὁ λαὸς
  choice: watu wote
  rationale: Hufuata maana pana ya λαός bila kuibana kuwa “umati” pekee.
- source_word: ἐπὶ τῇ στοᾷ
  choice: katika ukumbi wenye nguzo
  rationale: στοά ni njia au ukumbi uliofunikwa wenye safu ya nguzo. Usemi huu unaeleweka kwa wasomaji wa Kiswahili kuliko neno la usanifu lililokopwa.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: ulioitwa wa Sulemani
  rationale: Huhifadhi jina la jadi la mahali na maana ya καλουμένῃ, “ulioitwa.”
- source_word: ἔκθαμβοι
  choice: wakiwa wameshangaa sana
  rationale: Huwasilisha mshangao mkubwa unaoonyeshwa na ἔκθαμβοι kwa Kiswahili cha kawaida na chenye hadhi.
