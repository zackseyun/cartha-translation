  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: sw
  text: Lakini mkamuua Mwanzilishi wa uzima,[a] ambaye Mungu alimfufua kutoka kwa wafu; nasi ni mashahidi wa jambo hilo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kiongozi wa uzima,” “Mkuu wa uzima,” au “Chanzo cha uzima.” Neno la Kigiriki ἀρχηγός linaweza kuwa na maana ya kuanzisha, kuongoza, au kuwa wa kwanza na mkuu.
    reason: lexical_alternative
  - marker: b
    text: Au, “nasi ni mashahidi wake.” Kigiriki kinaweza kurejelea ama yule aliyefufuliwa ama tukio lenyewe la kufufuliwa kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Katika mfululizo wa mashtaka ya Petro, δέ huleta tofauti ya wazi na kile Mungu alichofanya, bila kuifanya kuwa nzito kupita kiasi.
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: Mwanzilishi wa uzima
  rationale: ἀρχηγός inaweza kumaanisha mwanzilishi, kiongozi, au aliye wa kwanza. “Mwanzilishi wa uzima” ni Kiswahili cha kawaida kinachoonyesha kwa uwazi kejeli ya kwamba walimuua yule anayehusishwa na chanzo cha uzima, huku tanbihi ikihifadhi upana wa neno.
- source_word: ἀπεκτείνατε
  choice: mkamuua
  rationale: Hutoa kauli ya moja kwa moja ya kitenzi bila kuongeza maana mahususi ya kisheria iliyomo katika “mkamwua kwa jinai.” Kiambishi -ka- kinaendeleza mtiririko wa masimulizi na mashtaka yaliyotangulia.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: alimfufua kutoka kwa wafu
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kuhusu ufufuo, unaohifadhi Mungu kama mtendaji na Yesu kama aliyefufuliwa.
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: nasi ni mashahidi wa jambo hilo
  rationale: Kauli hii inaeleweka kwa kawaida kuwa ushuhuda kuhusu jambo lililotajwa mara moja kabla, yaani ufufuo; “nasi” pia huhifadhi msisitizo wa ἡμεῖς. Tanbihi inadokeza uwezekano wa kuirejesha οὗ kwa mtu aliyefufuliwa.
theological_decisions:
- issue: Maana ya ἀρχηγός kama cheo cha Kristo
  choice: Mwanzilishi wa uzima
  alternative: Kiongozi wa uzima; Mkuu wa uzima; Chanzo cha uzima
  rationale: “Mwanzilishi” huwasilisha maana ya kuanzisha au kuwa asili bila kuondoa kabisa wazo la ukuu. Kwa kuwa neno la Kigiriki lina wigo mpana, njia nyingine zinawekwa katika tanbihi badala ya kulazimisha maana moja ya kimadhehebu.
- issue: Kirejeo cha οὗ katika kifungu cha mashahidi
  choice: mashahidi wa jambo hilo
  alternative: mashahidi wake
  rationale: Kiswahili cha kawaida huunganisha ushuhuda na tukio la ufufuo lililotajwa mara moja kabla. Hata hivyo, sarufi ya Kigiriki inaweza pia kuelekezwa kwa yule aliyefufuliwa, kwa hiyo utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umebaki wa moja kwa moja na wenye nguvu kama mashtaka ya Petro; nukta mkato hutenganisha tendo la Mungu na ushuhuda wa mitume bila kuvunja mtiririko wa sentensi.
