id: ACT.3.13
reference: Acts 3:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: sw
  text: Mungu wa Abrahamu, Isaka na Yakobo, Mungu wa baba zetu, amemtukuza mtumishi wake Yesu[a], ambaye ninyi mlimkabidhi na kumkana mbele ya Pilato, wakati Pilato alikuwa ameamua kumwachilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtoto wake Yesu.” Neno la Kigiriki παῖς linaweza kumaanisha “mtoto” au “mtumishi”; hapa “mtumishi” limechaguliwa kwa sababu huenda kifungu hiki kinarejelea lugha ya Mtumishi katika Isaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Mungu wa Abrahamu, Isaka na Yakobo
  rationale: Inahifadhi kauli ya agano inayorejelea Kutoka 3:6, huku orodha yenye koma na kiunganishi cha mwisho ikiwa ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Mungu wa baba zetu
  rationale: “Baba zetu” ni usemi wa kibiblia unaoeleweka na unaohifadhi mwelekeo wa kifamilia na wa agano wa πατέρων kuliko neno pana zaidi “mababu zetu.”
- source_word: ἐδόξασεν
  choice: amemtukuza
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo la Mungu lililotimizwa lenye umuhimu unaoendelea; “kutukuza” huhifadhi uzito wa δοξάζω.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: mtumishi wake Yesu
  rationale: Ingawa παῖς inaweza kumaanisha mtoto au mtumishi, “mtumishi” inafaa zaidi kwa mwangwi unaowezekana wa Mtumishi wa Bwana katika Isaya bila kuingiza hapa lugha tofauti ya uana.
- source_word: παρεδώκατε
  choice: mlimkabidhi
  rationale: “Kumkabidhi” huonyesha kumtia Yesu mikononi mwa mamlaka bila kuongeza maana mahususi ya usaliti ambayo kitenzi chenyewe hakilazimishi hapa.
- source_word: ἠρνήσασθε
  choice: kumkana
  rationale: “Kumkana” ni tafsiri ya moja kwa moja na ya kawaida ya ἀρνέομαι inapomhusu mtu, na inadumisha uhusiano na lugha nyingine ya kumkana Yesu.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: mbele ya Pilato
  rationale: Ni Kiswahili cha kawaida kinachowasilisha tendo lililofanyika hadharani katika uwepo wa Pilato bila kufuata kihalisi isivyo kawaida usemi “mbele ya uso.”
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: wakati Pilato alikuwa ameamua kumwachilia
  rationale: Kishazi cha wakati kinawakilisha genitivi huru kwa urahisi; kurudia jina “Pilato” huondoa utata wa kiwakilishi katika Kiswahili bila kuongeza mhusika mpya.
theological_decisions:
- issue: Maana ya παῖς inapomtaja Yesu
  choice: mtumishi
  alternative: mtoto
  rationale: “Mtumishi” huhifadhi vyema mwangwi unaowezekana wa lugha ya Mtumishi katika Isaya. Tanbihi inadumisha uwezekano halisi wa maana nyingine ya neno la Kigiriki.
- issue: Wakati na hali ya ἐδόξασεν
  choice: amemtukuza
  alternative: alimtukuza
  rationale: Aoristi ya Kigiriki haitaji lazima wakati timilifu, lakini “amemtukuza” huwasilisha kwa Kiswahili cha kawaida tendo lililotokea na umuhimu wake unaoendelea, bila kuongeza dai jipya la kiteolojia.
- issue: Uhusiano wa κρίναντος ἐκείνου na tendo la kukabidhi na kukana
  choice: wakati Pilato alikuwa ameamua kumwachilia
  alternative: ingawa Pilato alikuwa ameamua kumwachilia
  rationale: Kishazi shiriki cha Kigiriki kinaweza kueleweka kwa wakati, huku muktadha ukiwa na utofautishaji. “Wakati” huhifadhi uhusiano wa msingi bila kuufanya utofautishaji huo kuwa wazi zaidi kuliko sarufi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili kupunguza uzito wa muundo mrefu wa Kigiriki na kuweka rejeleo la Yesu wazi. Alama ya tanbihi imewekwa baada ya “Yesu,” ambako suala la παῖς linahusika.
