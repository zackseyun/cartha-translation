base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: sw
  text: Akamshika mkono wake wa kulia, akamwinua; na mara moja miguu yake na vifundo vya miguu yake[a] vikatiwa nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifupa ya vifundo vya miguu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιάσας
  choice: akamshika
  rationale: Kitenzi hiki kinaonyesha kuwa alimkamata kwa mkono kabla ya kumwinua. “Akamshika” ni cha kawaida na kinafaa kwa tendo la kumsaidia, bila ukali unaoweza kudokezwa na “akamkamata kwa nguvu.”
- source_word: τῆς δεξιᾶς χειρός
  choice: mkono wa kulia
  rationale: Muundo wa Kigiriki unaonyesha sehemu ya mwili aliyoshikwa. Kiswahili hiki ni wazi na cha kawaida bila kuleta utata kwamba huenda Petro alitumia mkono wake mwenyewe wa kulia.
- source_word: ἤγειρεν αὐτόν
  choice: akamwinua
  rationale: Huhifadhi tendo halisi la kumwinua mtu huyo na maana ya kawaida ya ἐγείρω katika muktadha huu, bila kuongeza wazo la jumla la kumsaidia tu.
- source_word: παραχρῆμα
  choice: mara
  rationale: Neno hili linaonyesha kuwa matokeo yalitokea papo hapo. “Mara” ni usemi mfupi na wa kawaida katika masimulizi ya Kiswahili.
- source_word: ἐστερεώθησαν
  choice: vikapata nguvu
  rationale: Hueleza kwa Kiswahili cha kawaida matokeo ya viungo hivyo kuimarishwa, huku bila kumtaja mtendaji ambaye kifungu cha Kigiriki hakimtaji wazi.
- source_word: αἱ βάσεις αὐτοῦ
  choice: miguu yake
  rationale: Katika muktadha wa mwili, βάσεις ni sehemu za chini zinazotegemeza mtu anaposimama. “Miguu yake” ni ya kawaida zaidi kuliko tafsiri halisi isiyozoeleka kama “misingi yake,” na “nyayo” ingekuwa finyu kupita kiasi.
- source_word: τὰ σφυδρά
  choice: vifundo vya miguu
  rationale: Neno hili hurejelea eneo au viungo vya vifundo vya miguu. Hii ni tafsiri ya kawaida na sahihi bila kulifanya neno lihusu mifupa pekee.
theological_decisions:
- issue: Namna ya kueleza uponyaji
  choice: Kutoa taarifa ya moja kwa moja kwamba miguu na vifundo vya miguu vilipata nguvu mara moja, bila kuongeza maelezo ya jinsi muujiza ulivyotendeka.
  alternative: Kutafsiri “viliponywa” au kutaja wazi kwamba Mungu ndiye aliyevipa nguvu.
  rationale: Kifungu kinaeleza matokeo halisi mwilini lakini hakitumii hapa kitenzi “kuponya” wala hakimtaji mtendaji wa hali ya kutendwa. Tafsiri inaacha maana ya kimiujiza ionekane kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Maandiko. Alama ya tanbihi imewekwa baada ya “vifundo vya miguu,” ambako mbadala wa kileksika unahusika.
