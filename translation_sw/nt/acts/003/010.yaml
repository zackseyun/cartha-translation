  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: sw
  text: Nao wakamtambua kuwa ndiye yule mtu aliyekuwa akiketi kwenye Lango Zuri la eneo la hekalu[a] akiomba sadaka, wakajawa na mshangao na bumbuazi kwa sababu ya yaliyompata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν humaanisha eneo lote la hekalu, si jengo la ndani la patakatifu pekee.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: wakamtambua
  rationale: Kitenzi hiki humaanisha kumtambua mtu kwa kumjua au kumtambua tena; umbo la wakati usiotimilika linaendeleza simulizi, lakini Kiswahili cha kawaida hutumia wakati uliopita wa masimulizi hapa.
- source_word: δὲ
  choice: Nao
  rationale: Kiunganishi hiki ni mpito hafifu unaoendeleza simulizi bila kuonyesha upinzani mkali.
- source_word: οὗτος ἦν
  choice: kuwa ndiye yule mtu
  rationale: Muundo huu unasisitiza kwamba mtu aliyeponywa ndiye yuleyule ambaye watu walimfahamu hapo awali.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: aliyekuwa akiketi ili kuomba sadaka
  rationale: Muundo wa kishiriki humweleza kwa tendo lake la kawaida la kuketi mahali hapo akitafuta msaada wa hisani; 'aliyekuwa akiketi' huonyesha desturi hiyo.
- source_word: ἐλεημοσύνην
  choice: sadaka
  rationale: Katika muktadha huu neno linamaanisha msaada wa mali unaotolewa kwa maskini; 'sadaka' ni neno la kawaida la Kibiblia na la Kiswahili kwa kitu anachoomba mwombaji.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: kwenye Lango Zuri
  rationale: Ὡραία hapa ni jina au utambulisho wa lango; 'Lango Zuri' huhifadhi maana na hadhi yake kama jina maalumu.
- source_word: τοῦ ἱεροῦ
  choice: la eneo la hekalu
  rationale: ἱερόν humaanisha eneo zima la hekalu, si patakatifu pa ndani pekee; kuitaja wazi katika matini huepusha maana finyu isiyokusudiwa.
- source_word: ἐπλήσθησαν
  choice: wakajawa
  rationale: Huhifadhi picha ya kujazwa na hisia na ni usemi wa kawaida katika Kiswahili cha masimulizi.
- source_word: θάμβους
  choice: mshangao
  rationale: Neno hili huonyesha hali ya kushangazwa sana au kupigwa na butwaa; 'mshangao' ni ya asili na inaeleweka kwa urahisi.
- source_word: ἐκστάσεως
  choice: bumbuazi
  rationale: Katika muktadha huu si hali ya fumbo ya kiroho bali hali ya kutoka katika hali ya kawaida kwa mshangao mkubwa; 'bumbuazi' hudumisha nguvu na tofauti yake na 'mshangao'.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: kwa sababu ya yaliyompata
  rationale: Kishiriki timilifu hurejelea jambo lililokuwa limetokea na ambalo matokeo yake yalionekana bado; Kiswahili hiki ni cha kawaida na huonyesha sababu ya hisia zao.
