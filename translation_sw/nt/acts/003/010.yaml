  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini cha kawaida na kinachoeleweka. 'Aliyekuwa akiketi' huonyesha tendo la mazoea, huku 'eneo la hekalu' likihifadhi upeo wa ἱερόν. Alama ya tanbihi [a] imewekwa katika matini.
