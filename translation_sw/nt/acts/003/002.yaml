  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. ‘Eneo la Hekalu’ limetumiwa kwa usahihi kutofautisha ἱερόν na patakatifu pa ndani; ‘sadaka’ imefafanuliwa kimuktadha katika maamuzi ya kileksika ili isieleweke kama sadaka ya ibada.
