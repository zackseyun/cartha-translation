  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: sw
  text: Na mtu mmoja, aliyekuwa kilema tangu tumboni mwa mama yake, alikuwa akibebwa, na watu walikuwa wakimweka kila siku kwenye lango la Hekalu lililoitwa Zuri,[a] ili aombe misaada ya hisani kutoka kwa wale waliokuwa wakiingia katika eneo la Hekalu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la lango hilo, kwa maana halisi, ni “Zuri.” Neno la Kigiriki lililotafsiriwa “Hekalu” hapa humaanisha majengo na viwanja vyote vya Hekalu, si patakatifu pa ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: mtu mmoja
  rationale: Hutambulisha mtu mahususi ambaye hajatajwa jina; ‘mtu mmoja’ ni Kiswahili cha kawaida na huhifadhi umahususi huo.
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: aliyekuwa kilema tangu tumboni mwa mama yake
  rationale: Huhifadhi taswira ya chanzo na hali iliyoendelea tangu kuzaliwa; ‘kilema’ hapa humaanisha mtu asiyeweza kutembea kawaida.
- source_word: ἐβαστάζετο
  choice: alikuwa akibebwa
  rationale: Kauli ya kutendwa pamoja na wakati usiotimilifu huonyesha tendo lililokuwa likifanyika au kurudiwa.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: Kila siku watu walikuwa wakimweka
  rationale: Wingi usiotajwa wazi umetafsiriwa kwa ‘watu,’ huku ‘kila siku’ na ‘walikuwa wakimweka’ zikionyesha desturi iliyorudiwa.
- source_word: θύραν τοῦ ἱεροῦ
  choice: lango la eneo la Hekalu
  rationale: θύρα katika mazingira haya ni lango; ἱερόν ni eneo lote la Hekalu, si patakatifu pa ndani pekee.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: lililoitwa Zuri
  rationale: Huhifadhi maana halisi ya jina la lango bila kulibadili kuwa maelezo tu.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: ili aombe sadaka
  rationale: Articular infinitive inaonyesha kusudi; ‘sadaka’ hapa ni msaada unaotolewa kwa mhitaji, si sadaka ya ibada.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: kutoka kwa watu waliokuwa wakiingia katika eneo la Hekalu
  rationale: Huhifadhi chanzo cha msaada na tendo la watu kuingia katika viwanja vya Hekalu.
theological_decisions: []
