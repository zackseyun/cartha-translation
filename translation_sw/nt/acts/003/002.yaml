revisions:
- from: Na mtu mmoja, aliyekuwa kilema tangu tumboni mwa mama yake, alikuwa akibebwa. Kila siku watu walikuwa wakimweka kwenye lango la eneo la Hekalu lililoitwa Zuri,[a] ili aombe sadaka kutoka kwa watu waliokuwa wakiingia katika eneo la Hekalu.
  to: Na mtu mmoja, aliyekuwa kilema tangu tumboni mwa mama yake, alikuwa akibebwa, na watu walikuwa wakimweka kila siku kwenye lango la Hekalu lililoitwa Zuri,[a] ili aombe misaada ya hisani kutoka kwa wale waliokuwa wakiingia katika eneo la Hekalu.
