id: ACT.3.25
reference: Acts 3:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: sw
  text: Ninyi ni wana[a] wa manabii na wa agano ambalo Mungu alifanya na baba zenu, alipomwambia Abrahamu, ‘Na katika uzao wako[b] jamaa zote za dunia zitabarikiwa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto”; Kigiriki ni “wana,” usemi unaoonyesha warithi wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbegu.” Neno la Kigiriki linaweza kumaanisha wazao wa Abrahamu kwa ujumla, na katika muktadha mpana wa Biblia linaweza pia kuwa na maana ya mwakilishi mmoja.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: wana
  rationale: Huhifadhi nomino ya kiume ya Kigiriki na lugha ya warithi wa agano; hapa ‘wana’ inawahusu washiriki na warithi wa ahadi, si lazima watoto wa kimwili wa manabii.
- source_word: προφητῶν
  choice: wa manabii
  rationale: Ni tafsiri ya moja kwa moja ya hali ya umilikaji, ikionyesha kuwa wasikilizaji wamo katika urithi wa ahadi zilizotolewa kupitia manabii.
- source_word: διαθήκης
  choice: agano
  rationale: Katika muktadha wa Mungu, Abrahamu, na mababu, ‘agano’ ndilo neno la kawaida na sahihi la kibiblia kwa διαθήκη.
- source_word: διέθετο
  choice: alifanya
  rationale: Kirai ‘alifanya agano na’ ni Kiswahili cha kawaida kinachoeleza kitendo cha kuanzisha au kuweka agano.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: na baba zenu
  rationale: Katika usemi wa kufanya agano, πρός inaelezwa kwa Kiswahili cha asili kwa ‘na’; ‘baba zenu’ huhifadhi lugha ya chanzo kuhusu mababu wa taifa.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: alipomwambia Abrahamu
  rationale: Hufanya uhusiano wa kishiriki uwe wa kawaida katika Kiswahili huku ikitambulisha maneno ya agano yaliyosemwa kwa Abrahamu.
- source_word: σπέρματί
  choice: uzao wako
  rationale: ‘Uzao’ unaweza kuwa wa kijumla na pia kumrejelea mwakilishi mmoja, hivyo unahifadhi upana wa σπέρμα bila kulazimisha ‘wazao’ au ‘mzao’ pekee.
- source_word: ἐνευλογηθήσονται
  choice: zitabarikiwa
  rationale: Huhifadhi hali ya kutendwa na wakati ujao wa kitenzi cha Kigiriki.
- source_word: πατριαὶ
  choice: jamaa
  rationale: ‘Jamaa’ linafaa kwa vikundi vya kifamilia au koo na ni la asili katika ahadi hii yenye upeo wa ulimwengu.
- source_word: γῆς
  choice: dunia
  rationale: Upeo wa jumla wa ahadi unaelekeza kwa dunia yote badala ya nchi au eneo fulani.
theological_decisions:
- issue: Lugha wakilishi ya kiume katika υἱοὶ
  choice: wana
  alternative: watoto
  rationale: ‘Wana’ huhifadhi umbo la kiume na taswira ya warithi wa agano katika chanzo. Tanbihi inaonyesha kuwa matumizi yake ni wakilishi na hayawahusu wanaume pekee.
- issue: Maana ya ahadi ya Abrahamu katika σπέρμα
  choice: uzao
  alternative: mbegu; mzao; wazao
  rationale: ‘Uzao’ huhifadhi kwa pamoja uwezekano wa maana ya kijumla kuhusu wazao wa Abrahamu na maana ya mwakilishi mmoja, bila kuamua mvutano huo kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Wana,’ ‘agano,’ ‘uzao,’ na ‘jamaa’ huhifadhi misemo na mvutano wa kifasihi na kiteolojia wa chanzo bila kuwa wa kizamani kupita kiasi.
