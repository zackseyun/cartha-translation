  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: sw
  text: Na itakuwa kwamba kila mtu asiyemsikiliza nabii huyo ataangamizwa kabisa kutoka miongoni mwa watu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakatiliwa mbali kutoka miongoni mwa watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: kila mtu
  rationale: Ingawa kihalisi ni ‘kila nafsi,’ katika nahau hii ψυχή humaanisha mtu binafsi. ‘Kila mtu’ ni Kiswahili cha kawaida na hakidokezi mgawanyo maalumu wa kibinadamu.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: ambaye hatamsikiliza
  rationale: Muundo huu unaonyesha mtu yeyote asiyefanya hivyo. ‘Kumsikiliza’ huhifadhi maana ya kusikia kwa kuitikia au kutii, bila kuibana kuwa kusikia sauti tu.
- source_word: τοῦ προφήτου ἐκείνου
  choice: nabii huyo
  rationale: Kishazi hiki kinamrejelea nabii aliyetajwa awali. Herufi ndogo inadumishwa kwa kuwa Kigiriki hakifanyi neno hilo kuwa cheo rasmi, ingawa anayerejelewa ni mahususi.
- source_word: ἐξολεθρευθήσεται
  choice: ataangamizwa kabisa
  rationale: Kitenzi hiki kina nguvu ya kuondolewa au kuharibiwa kikamilifu. ‘Ataangamizwa kabisa’ huhifadhi uzito huo, huku ‘atakatiliwa mbali’ ikiwekwa katika tanbihi kama uwezekano wa kileksia na mwangwi wa muktadha wa Agano la Kale.
- source_word: ἐκ τοῦ λαοῦ
  choice: kutoka miongoni mwa watu
  rationale: ἐκ huonyesha kuondolewa kutoka ndani ya jamii ya watu. Tafsiri hii haiingizi kimilikishi kisichopo katika Kigiriki.
theological_decisions:
- issue: Asili ya hukumu inayotishiwa katika nukuu/dokezo la Petro kwa Kumbukumbu la Torati 18:19
  choice: Kutoa onyo kama kuangamizwa au kuondolewa miongoni mwa watu bila kubainisha wakati au namna ya hukumu hiyo.
  alternative: Kutengwa na jumuiya ya agano pekee, au hukumu ya mwisho pekee.
  rationale: Aya inatangaza hukumu kali kwa kutomsikiliza nabii huyo, lakini haifafanui kikamilifu ikiwa hukumu hiyo ni ya wakati huu, ya kiagano, au ya mwisho. Tafsiri inadumisha ukali na pia utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Na itakuwa kwamba’ huhifadhi ἔσται δὲ bila kuwa mgumu kupita kiasi.
