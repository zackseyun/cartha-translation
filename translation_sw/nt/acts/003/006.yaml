id: ACT.3.6
reference: Acts 3:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: sw
  text: 'Lakini Petro akasema, “Sina fedha wala dhahabu, lakini nilicho nacho, ninakupa: kwa jina la Yesu Masihi[a], Mnazareti[b], tembea.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Au “wa Nazareti.” Kigiriki τοῦ Ναζωραίου kwa karibu zaidi ni “Mnazareti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον
  choice: fedha
  rationale: Neno hili linataja metali ya fedha na linaunganishwa waziwazi na dhahabu; tafsiri hii pia ni ya kawaida katika Kiswahili.
- source_word: χρυσίον
  choice: dhahabu
  rationale: Imetafsiriwa moja kwa moja ili kuhifadhi jozi ya metali “fedha wala dhahabu,” inayowakilisha mali ya kifedha.
- source_word: οὐχ ὑπάρχει μοι
  choice: sina
  rationale: Muundo wa Kigiriki unaeleza umilikaji; “sina” ni wa asili na sahihi katika Kiswahili.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: lakini nilicho nacho, ninakupa
  rationale: Huhifadhi utofautishaji na ukosefu wa fedha pamoja na msisitizo wa τοῦτο, bila kufanya sentensi kuwa nzito.
- source_word: ἐν τῷ ὀνόματι
  choice: kwa jina la
  rationale: Huhifadhi taswira ya Kigiriki na maana yake ya kutenda kwa mamlaka inayohusishwa na jina hilo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa ni cheo cha Yesu; “Masihi” huhifadhi maana ya cheo hicho badala ya kukifanya jina lisiloelezwa.
- source_word: τοῦ Ναζωραίου
  choice: Mnazareti
  rationale: Ni uwasilishaji wa karibu wa jina la kumtambulisha mtu anayetoka Nazareti, badala ya kuligeuza kimya kimya kuwa kirai cha mahali.
- source_word: περιπάτει
  choice: tembea
  rationale: Ni amri ya moja kwa moja na ya kawaida inayolingana na imperativi ya Kigiriki bila kuongeza wazi wazo la “anza.”
theological_decisions:
- issue: Uwasilishaji wa Χριστοῦ katika kauli ya jina
  choice: Masihi
  alternative: Kristo
  rationale: Katika tangazo hili la uponyaji, neno hilo bado lina nguvu ya cheo; “Masihi” huonyesha maana hiyo, huku “Kristo” ikihifadhiwa kama tafsiri mbadala katika tanbihi.
- issue: Maana ya ἐν τῷ ὀνόματι
  choice: kwa jina la
  alternative: kwa mamlaka ya
  rationale: Tafsiri ya msingi huhifadhi usemi wa Kigiriki na mvutano wake wa kimaanisho; wazo la mamlaka linaweza kueleweka katika muktadha bila kuingizwa moja kwa moja katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “Sina fedha wala dhahabu” ni wa asili, na “nilicho nacho, ninakupa” hudumisha msisitizo wa kauli ya Kigiriki. “Mnazareti” limehifadhiwa kwa ukaribu na chanzo, huku umbo linalotumika zaidi “wa Nazareti” likiwekwa katika tanbihi.
