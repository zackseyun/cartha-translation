  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: sw
  text: Na kwa msingi wa imani katika jina lake[a], jina lake lenyewe limemtia nguvu mtu huyu mnayemwona na kumjua; na imani ile iliyo kwa njia yake imempa hali hii ya afya kamili[b] mbele yenu nyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa msingi wa kumtumaini yeye.” Neno la Kigiriki pistis linaweza kumaanisha “imani,” “kumtumaini,” au katika miktadha mingine “uaminifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hali hii ya kuwa mzima kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: kwa msingi wa imani
  rationale: ἐπί pamoja na dativu hapa inaweza kuonyesha msingi au sababu. Tafsiri hii inaweka wazi wazo hilo bila kuibadili kuwa chombo tu cha tendo.
- source_word: πίστει
  choice: imani
  rationale: Katika muktadha huu πίστις ina maana ya kumtegemea au kumwamini Yesu; “imani” ni neno la kawaida na lenye hadhi katika Kiswahili, huku “tumaini” likihifadhiwa kama uwezekano katika tanbihi.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: katika jina lake
  rationale: Muundo wa jenitivi unaeleweka kiasili kama imani inayolenga jina lake. “Jina” limehifadhiwa kwa sababu katika Matendo linawakilisha nafsi na mamlaka ya Yesu.
- source_word: ἐστερέωσεν
  choice: limemtia nguvu
  rationale: Kitenzi hiki humaanisha kufanya imara au mwenye nguvu. Usemi huu unaonyesha matokeo halisi yaliyoonekana katika mwili wa mtu aliyeponywa.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: mnayemwona na kumjua
  rationale: Jozi hii inasisitiza kwamba wasikilizaji walimwona mtu huyo na walimtambua au kumfahamu. Tafsiri hii ni fupi na ya kawaida.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: jina lake lenyewe
  rationale: Kurudia “jina lake” kunahifadhi msisitizo wa Kigiriki; “lenyewe” hufanya urudiaji huo uwe wa makusudi na wa asili katika Kiswahili.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: imani iliyo kwa njia yake
  rationale: Usemi huu unahifadhi ufupi na uwazi usiokamilika wa Kigiriki kuhusu jinsi imani hiyo ilivyo “kwa njia yake,” bila kuamua kwamba ni imani aliyoizalisha Yesu au kumtaja mwenye imani hiyo.
- source_word: ἔδωκεν αὐτῷ
  choice: imempa
  rationale: Kauli ya hali timilifu katika Kiswahili inaonyesha tendo lililotokea pamoja na matokeo yake yanayoonekana sasa mbele ya umati.
- source_word: ὁλοκληρίαν
  choice: ukamilifu huu wa afya
  rationale: Nomino hii hudokeza uzima wa mwili, ukamilifu, au hali ya kuwa mzima kabisa. Usemi huu unaweka wazi muktadha wa uponyaji bila kupoteza wazo la ukamilifu.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: mbele yenu nyote
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kusisitiza kwamba uponyaji ulifanyika hadharani na ulionekana na wote.
theological_decisions:
- issue: Imani katika jina lake na imani iliyo kwa njia yake
  choice: Aya inahusianisha kutiwa nguvu kwa mtu huyo na jina la Yesu, na inataja imani inayohusiana na jina hilo na iliyo kwa njia ya Yesu bila kubainisha mwenye imani hiyo.
  alternative: Imani ya mtu aliyeponywa; imani ya mitume; au imani inayotolewa au kuzalishwa na Yesu.
  rationale: Kigiriki hakimtaji wazi mwenye imani hiyo. Tafsiri imeacha mvutano huo wazi badala ya kuchagua tafsiri moja ya kiteolojia.
- issue: “Jina” kama kiwakilishi cha nafsi na mamlaka
  choice: Jina lake limehifadhiwa kama mhusika anayemtia mtu nguvu.
  alternative: Yesu mwenyewe amemtia nguvu; au nguvu za jina lake zimemtia nguvu.
  rationale: Matendo hutumia “jina” kumwakilisha Yesu na mamlaka yake. Kulihifadhi neno hilo kunatunza msisitizo wa Luka na hakulazimishi ufafanuzi ndani ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki wa hadhara na wa ushuhuda, huku urudiaji wa “jina lake” na utata halisi wa “imani iliyo kwa njia yake” vikihifadhiwa.
