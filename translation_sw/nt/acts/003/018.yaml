  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: sw
  text: 'Lakini hivyo ndivyo Mungu alivyotimiza yale aliyotangulia kutangaza kwa kinywa cha manabii wote[a]: kwamba Masihi wake[b] angeteseka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia manabii wote.” Kigiriki kinasema kihalisi zaidi, “kwa kinywa cha manabii wote.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “Kristo wake”; hapa neno Χριστός limetafsiriwa “Masihi” kwa sababu limetumiwa kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofauti kati ya kitendo cha wasikilizaji katika mstari uliotangulia na tendo la Mungu.
- source_word: προκατήγγειλεν
  choice: aliyotangulia kutangaza
  rationale: Inahifadhi wazo la tangazo lililotolewa kabla pamoja na nguvu ya kitenzi cha kutangaza.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: kwa kinywa cha manabii wote
  rationale: Inadumisha tamathali halisi ya Kigiriki ya Mungu kusema kupitia 'kinywa' cha manabii, huku ikibaki wazi katika Kiswahili.
- source_word: παθεῖν
  choice: angeteseka
  rationale: Inaeleza yaliyokuwa katika tangazo la kinabii bila kuongeza waziwazi wazo la ulazima ambalo haliwekwi moja kwa moja na umbo hili la kitenzi.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: Masihi wake
  rationale: Χριστός hapa ni cheo cha mteuliwa na mpakwa-mafuta wa Mungu; 'Masihi' huhifadhi muktadha wa Kiyahudi wa hotuba ya Petro, na αὐτοῦ inaonyeshwa kwa 'wake'.
- source_word: ἐπλήρωσεν
  choice: alivyotimiza
  rationale: Ni usemi wa kawaida na wazi wa kutimia kwa jambo lililotangazwa katika unabii.
- source_word: οὕτως
  choice: hivyo ndivyo
  rationale: Inaunganisha namna ya kutimizwa na mateso yaliyoelezwa katika muktadha uliotangulia, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo hapa, si hasa kama jina; 'Masihi' huhifadhi mazingira ya matarajio ya Kiyahudi bila kuingiza fundisho la dhehebu.
- issue: Nguvu ya παθεῖν kuhusiana na unabii
  choice: kwamba Masihi wake angeteseka
  alternative: kwamba ilimpasa Masihi wake ateseke
  rationale: Tafsiri iliyochaguliwa inaonyesha maudhui ya tangazo la kinabii bila kufanya ulazima uwe wazi zaidi kuliko Kigiriki chenyewe.
- issue: Upeo wa πάντων τῶν προφητῶν
  choice: manabii wote
  alternative: manabii
  rationale: Neno πάντων limehifadhiwa bila kupunguza dai pana la kifungu wala kulifafanua kwa namna inayoliondolea mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hivyo ndivyo ... alivyotimiza” ni wa kawaida na unaweka mkazo wa οὕτως bila kukakamaa; usemi wa kibiblia “kwa kinywa cha” umehifadhiwa na kufafanuliwa katika tanbihi.
