  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: sw
  text: Lakini Petro alipoona jambo hilo, akajibu watu, “Enyi wanaume Waisraeli, kwa nini mnastaajabia jambo hili? Au kwa nini mnatukazia macho[a], kana kwamba tumemfanya mtu huyu atembee kwa nguvu zetu wenyewe au kwa uchaji wetu kwa Mungu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “mnatutazama kwa makini.” Kitenzi cha Kigiriki kinaonyesha mtazamo uliokazwa au unaodumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “utauwa wetu.” Petro anakataa kwamba uponyaji wa mtu huyu ulitokana na ibada, kujitoa kwa Mungu, au sifa ya kiroho ya mitume wenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Lakini Petro alipoona jambo hilo
  rationale: Kirai cha wakati ‘alipoona’ kinaonyesha kuwa kuona kulitangulia jibu la Petro. ‘Jambo hilo’ linaweka wazi rejeo lililodokezwa na muktadha bila kulifafanua kupita kiasi; δέ ni mpito wenye tofauti ndogo, hivyo limetafsiriwa ‘Lakini.’
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: akawaambia watu
  rationale: Kitenzi kinaonyesha kuitikia hali iliyotokea, ingawa hakuna swali lililotamkwa. ‘Akawaambia’ ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Enyi wanaume Waisraeli
  rationale: Huhifadhi wazi nomino ya kiume ἄνδρες na utambulisho wa wasemewa kuwa Waisraeli, huku ikibaki kuwa mwito unaoeleweka katika Kiswahili.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: kwa nini mnastaajabia jambo hili?
  rationale: ‘Mnastaajabia’ huwasilisha mshangao au maajabu yanayoonyeshwa na θαυμάζω; ‘jambo hili’ linarejelea tukio la kuponywa.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: Au kwa nini mnatukazia macho
  rationale: ‘Kukazia macho’ huonyesha kutazama kwa makini na kwa muda, ambayo ndiyo nguvu ya ἀτενίζω, bila kutumia lugha isiyo ya kawaida.
- source_word: ὡς ἰδίᾳ δυνάμει
  choice: kana kwamba ... kwa nguvu zetu wenyewe
  rationale: ‘Kana kwamba’ huanzisha dhana isiyo sahihi ambayo Petro anaikanusha; ‘zetu wenyewe’ hukazia kwamba nguvu hizo zingekuwa zao binafsi.
- source_word: ἢ εὐσεβείᾳ
  choice: au kwa uchaji wetu kwa Mungu
  rationale: εὐσέβεια hapa ni uchaji au mwenendo wa kujitoa kwa Mungu. Usemi huu ni wa kawaida na unadumisha maana ya kidini ya neno.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: tumemfanya mtu huyu atembee
  rationale: Wakati timilifu wa Kigiriki unaonyesha matokeo yaliyokwishatokea ambayo watu huenda waliwahusisha mitume nayo. ‘Tumemfanya ... atembee’ ni Kiswahili cha asili; ‘mtu huyu’ huweka wazi kiwakilishi bila kubadili rejeo lake.
theological_decisions:
- issue: Iwapo εὐσεβείᾳ idokeze kuwa uponyaji ulitokana na ustahili wa kiroho wa mitume
  choice: uchaji wetu kwa Mungu
  alternative: utauwa wetu
  rationale: Petro anakataa kwamba hali yao wenyewe ya kiroho au ibada ndiyo iliyosababisha uponyaji. Tafsiri inadumisha maana ya kidini lakini haiingizi fundisho la baadaye kuhusu ustahili.
- issue: Mwito wa kiume Ἄνδρες Ἰσραηλῖται
  choice: Enyi wanaume Waisraeli
  alternative: Enyi Waisraeli
  rationale: Tafsiri teule inadumisha umbo la kiume lililo wazi katika Kigiriki badala ya kulifanya lisiloonyesha jinsia, bila kutoa dai la ziada kuhusu kila mtu aliyekuwapo.
- issue: Chanzo cha uwezo wa mtu kutembea
  choice: kana kwamba tumemfanya mtu huyu atembee kwa nguvu zetu wenyewe au kwa uchaji wetu kwa Mungu
  alternative: kana kwamba ametembea kwa sababu ya nguvu au utauwa wetu
  rationale: Muundo huu huhifadhi kanusho la Petro kwamba nguvu binafsi au sifa ya kiroho ya mitume ilikuwa chanzo cha uponyaji, bila kutangulia maelezo anayotoa katika mistari inayofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali ya balagha na msisitizo wa ‘wenyewe’ umehifadhiwa. ‘Kukazia macho’ na ‘uchaji ... kwa Mungu’ ni misemo inayoeleweka kwa wasomaji wa kawaida, huku tanbihi zikihifadhi mbadala muhimu za kileksia.
