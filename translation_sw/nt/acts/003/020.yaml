id: ACT.3.20
reference: Acts 3:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: sw
  text: ili nyakati za kuburudishwa zije kutoka katika uwepo wa Bwana, na ili amtume Masihi aliyeteuliwa kwa ajili yenu[a], Yesu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyeteuliwa kwenu” au “aliyekuwa ameteuliwa mapema kwa ajili yenu.”
    reason: Tofauti hizi zinaonyesha uwezekano wa maana ya ὑμῖν na wazo la uteuzi wa awali lililo katika προκεχειρισμένον.
lexical_decisions:
- source_word: ὅπως ἂν
  choice: ili
  rationale: Huanzisha kusudi au matokeo yanayohusiana na wito uliotangulia wa kutubu; “ili” ni ya kawaida katika Kiswahili na haiongezi uhakika usio katika muundo wa Kigiriki.
- source_word: ἔλθωσιν
  choice: zije
  rationale: Hali ya utegemezi baada ya ὅπως ἄν inadumishwa kwa muundo wa “ili ... zije,” unaoonyesha kusudi au jambo linalotarajiwa bila kulifanya kuwa dai la uhakika.
- source_word: καιροὶ
  choice: nyakati
  rationale: Neno hili linaweza kumaanisha vipindi au majira maalumu; “nyakati” ni pana na halibainishi kupita kiasi aina ya wakati unaokusudiwa.
- source_word: ἀναψύξεως
  choice: kuburudishwa
  rationale: Linadumisha taswira ya kupata burudiko, nafuu, au nguvu mpya bila kuifupisha maana kuwa faraja pekee.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: kutoka katika uwepo wa Bwana
  rationale: Ingawa πρόσωπον kwa msingi ni “uso,” hapa ni nahau ya uwepo; tafsiri hii ni wazi na inadumisha chanzo kinachoelezwa.
- source_word: ἀποστείλῃ
  choice: amtume
  rationale: Muundo wa “ili amtume” unadumisha hali ya utegemezi na uratibu wake na kishazi kilichotangulia.
- source_word: προκεχειρισμένον
  choice: aliyeteuliwa
  rationale: Huonyesha kuteuliwa au kuwekwa tayari hapo kabla. “Aliyeteuliwa” ni fupi na ya kawaida, huku wazo la uteuzi wa awali likihifadhiwa kama uwezekano katika tanbihi.
- source_word: ὑμῖν
  choice: kwa ajili yenu
  rationale: Dativi inaweza kueleweka kama “kwenu” au “kwa ajili yenu”; chaguo hili linaonyesha uteuzi unaowahusu au ulio kwa manufaa yao bila kufunga kabisa uwezekano mwingine.
- source_word: χριστὸν
  choice: Masihi
  rationale: Hapa χριστός inafanya kazi kama cheo kinachomtambulisha Yesu katika muktadha wa Kiyahudi, hivyo maana ya cheo hicho inatafsiriwa badala ya kutumiwa kama jina tu.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Kama χριστὸν itafsiriwe kama cheo au itumike katika umbo la kimapokeo “Kristo”
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno hilo ni cheo cha kimasiya kinachomhusu Yesu, si sehemu ya jina tu; “Masihi” hudumisha maana yake wazi.
- issue: Maana ya προκεχειρισμένον ὑμῖν
  choice: aliyeteuliwa kwa ajili yenu
  alternative: aliyeteuliwa kwenu; aliyekuwa ameteuliwa mapema kwa ajili yenu
  rationale: Kirai kinaweza kuonyesha uteuzi kwa ajili yao au kwao, na kitenzi hushikilia wazo la uteuzi uliotangulia. Maandishi makuu yanatumia Kiswahili chepesi bila kufuta tofauti hizo, ambazo zimeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “ili ... na ili ...” unadumisha ulinganifu wa vishazi vya Kigiriki; tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
