  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: sw
  text: Petro, akiwa pamoja na Yohana, akamkazia macho, akasema, “Tutazame.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: akamkazia macho
  rationale: Kitenzi hiki kinaonyesha kumtazama mtu kwa makini na kwa kuelekeza macho kwake, si kumwangalia kijuujuu tu. ‘Akamkazia macho’ ni usemi wa asili wa Kiswahili unaohifadhi uzito huo.
- source_word: δὲ
  choice: aka-
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi, si lazima kionyeshe upinzani. Kiambishi cha usimulizi ‘aka-’ kinaendeleza tukio kwa kawaida katika Kiswahili.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: akiwa pamoja na Yohana
  rationale: Usemi huu unaonyesha wazi kwamba Yohana alikuwa pamoja na Petro katika tendo hili.
- source_word: εἶπεν
  choice: akasema
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya tendo la kusema katika muktadha huu.
- source_word: Βλέψον
  choice: Tutazame
  rationale: Amri hii inamtaka mtu aelekeze uangalifu wa macho kwa Petro na Yohana. ‘Tutazame’ ni amri fupi na ya kawaida inayolingana na muktadha.
- source_word: εἰς ἡμᾶς
  choice: -tu-
  rationale: Kiambishi cha yambwa ‘-tu-’ katika ‘tutazame’ huonyesha kwa kawaida kwamba macho yaelekezwe kwa Petro na Yohana.
- source_word: εἰς αὐτόν
  choice: -m- katika ‘akamkazia macho’
  rationale: Kiambishi cha yambwa humtambulisha yule mtu kuwa ndiye aliyelengwa na mtazamo makini wa Petro.
