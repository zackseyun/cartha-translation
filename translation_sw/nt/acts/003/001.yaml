lexical_decisions:
- source_word: δὲ
  choice: (haikutafsiriwa kwa neno tofauti)
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si alama ya upinzani wenye nguvu. Mtiririko wa Kiswahili hauhitaji ‘basi’ au ‘lakini’ katika mstari huu.
- source_word: ἀνέβαινον
  choice: walikuwa wakipanda kwenda
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea katika wakati uliopita na kuhifadhi wazo la kupanda kuelekea hekalu.
- source_word: ἱερὸν
  choice: hekaluni
  rationale: ἱερόν humaanisha eneo au majengo ya hekalu kwa ujumla, si patakatifu pa ndani pekee. ‘Hekaluni’ ni tafsiri ya kawaida na ya kueleweka katika Kiswahili.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: wakati wa saa ya sala
  rationale: Kirai hiki kinaonyesha muda uliowekwa kwa ajili ya sala; tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi muundo wa ‘saa ya sala.’
- source_word: τὴν ἐνάτην
  choice: yaani saa tisa
  rationale: Inahifadhi mfumo wa kale wa kuhesabu saa uliomo katika matini badala ya kuubadilisha moja kwa moja kuwa saa ya kisasa; maelezo ya wakati wa kisasa yanawekwa katika tanbihi.
