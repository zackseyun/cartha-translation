translation:
  language: sw
  text: Alipowaona Petro na Yohana wakiwa karibu kuingia hekaluni[a], aliwaomba sadaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν linamaanisha eneo lote la hekalu au majengo yake, si patakatifu pa ndani (ναός) hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἰδών
  choice: Alipowaona
  rationale: 'Kiwakilishi hiki kinamrejelea yule mtu aliyekuwa kilema katika mstari uliotangulia, na kishiriki cha wakati uliopita kinaeleza mazingira ya wakati: alipowaona.'
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Petro na Yohana
  rationale: Majina yametolewa kwa maumbo yake ya kawaida katika Kiswahili cha Biblia.
- source_word: μέλλοντας εἰσιέναι
  choice: wakiwa karibu kuingia
  rationale: Muundo wa μέλλω pamoja na kitenzi-jina unaonyesha kuwa kuingia kulikuwa kumekaribia; tafsiri hii ni ya kawaida na haiongezi kusudi lisilotajwa wazi.
- source_word: εἰς τὸ ἱερόν
  choice: hekaluni
  rationale: Neno hili linarejelea eneo au majengo ya hekalu kwa ujumla. 'Hekaluni' ni tamko fupi na la kawaida, huku tanbihi ikifafanua upana wa maana yake.
- source_word: ἠρώτα
  choice: alianza kuwaomba
  rationale: Wakati usiotimilifu unaonyesha ombi lililoendelea katika tukio hili; muundo huu wa Kiswahili unaakisi hali hiyo kwa lugha ya kawaida.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: kuwaomba sadaka
  rationale: Katika muktadha huu ἐλεημοσύνη ni msaada unaotolewa kwa maskini. Kiswahili kwa kawaida husema 'kuomba sadaka' bila kulazimika kutafsiri λαβεῖν tofauti kama 'kupokea,' ambayo ingefanya sentensi iwe nzito.
