  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: sw
  text: Na sasa, ndugu[a], najua kwamba mlitenda kwa kutojua, kama watawala wenu pia walivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu na dada”; neno la Kigiriki linasema “ndugu” na huenda linahutubia kwa uwakilishi kundi pana lenye wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: Na sasa
  rationale: Huhifadhi kiunganishi καί pamoja na mpito wa wakati unaoletwa na νῦν, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Ni neno la kawaida na lenye heshima la kuhutubia jamaa au washiriki wa kundi; hapa linaweza kutumiwa kwa uwakilishi kwa kusanyiko pana.
- source_word: οἶδα
  choice: najua
  rationale: Hutoa moja kwa moja dai la Petro la kuwa na ujuzi, bila kuongeza maana ya ziada.
- source_word: κατὰ ἄγνοιαν
  choice: kwa kutojua
  rationale: Hueleza kwamba tendo lao lilifanywa katika hali ya kutokuwa na ujuzi, bila kudokeza kwamba hawakuwa na hatia kabisa.
- source_word: ἐπράξατε
  choice: mlitenda
  rationale: Huhifadhi upana wa kitenzi πράσσω bila kuongeza kitu mahsusi ambacho hakijatajwa wazi katika mstari huu.
- source_word: ὥσπερ καὶ
  choice: kama ... pia
  rationale: 'Huwasilisha ulinganisho pamoja na wazo la nyongeza: wao walitenda kwa kutojua, na watawala wao vivyo hivyo.'
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: watawala wenu
  rationale: Huhifadhi maana ya viongozi wenye mamlaka katika muktadha wa Yerusalemu, badala ya kutumia neno pana zaidi lisiloonyesha mamlaka yao.
theological_decisions:
- issue: Iwapo kauli ya Petro kuhusu kutokujua ionekane kuwaondolea hatia
  choice: mlitenda kwa kutojua
  alternative: mlifanya hivyo bila kujua
  rationale: Tafsiri inatambua kutokujua kwao kama jambo lililohusika katika tendo lao, lakini haiwafanyi waonekane kuwa hawana hatia kabisa; muktadha unaendelea kuwaita watubu katika mstari wa 19.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wazi na wa asili huku ukihifadhi mpito, ulinganisho, na mvutano wa kimaadili wa maandishi ya Kigiriki.
