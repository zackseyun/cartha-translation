  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: sw
  text: Kwa kweli Mose alisema, “Bwana Mungu atawainulia nabii kutoka miongoni mwa ndugu zenu[a], kama mimi[b]. Mtamsikiliza katika yote atakayowaambia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka miongoni mwa Waisraeli wenzenu.” Kigiriki kinasema “kutoka miongoni mwa ndugu zenu,” kikitumia lugha ya kindugu kwa maana ya uwakilishi wa watu wa agano.
    reason: lexical_alternative
  - marker: b
    text: Hapa Matendo inanukuu Kumbukumbu la Torati 18:15 kwa maneno yanayotofautiana kidogo; hasa, maandishi ya Kigiriki ya Matendo yanasema “Bwana Mungu,” si “Bwana Mungu wenu.”
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: μὲν
  choice: Kwa kweli
  rationale: Linadumisha msisitizo na mwendelezo wa hoja unaoletwa na chembe hii bila kuifanya sentensi kuwa nzito.
- source_word: εἶπεν ὅτι
  choice: alisema, “...”
  rationale: Nukuu ya moja kwa moja ni ya asili katika Kiswahili na inaonyesha wazi fomula ya kunukuu.
- source_word: Προφήτην
  choice: nabii
  rationale: Nomino isiyo na kibainishi inaeleweka hapa bila kuongezwa cheo kama ‘yule Nabii’; muktadha wa Kumbukumbu la Torati unaipa umuhimu wake.
- source_word: ἀναστήσει
  choice: atawainulia
  rationale: ‘Kuinua’ huhifadhi kiungo cha kitenzi cha chanzo na hapa humaanisha kumleta au kumweka nabii, bila kufanya ufufuo kuwa maana ya msingi.
- source_word: κύριος ὁ θεὸς
  choice: Bwana Mungu
  rationale: Hufuata moja kwa moja maneno ya Kigiriki katika Matendo, ambayo hayana ‘wenu,’ badala ya kuyapatanisha na wording ya Kumbukumbu la Torati 18:15.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: kutoka miongoni mwa ndugu zenu
  rationale: Huhifadhi maana ya ἐκ na lugha ya kindugu ya ἀδελφῶν, ambayo hapa ina maana wakilishi ya watu wa agano.
- source_word: ὡς ἐμέ
  choice: kama mimi
  rationale: 'Hutoa maana ya kawaida ya ulinganisho: nabii atakayekuja atakuwa kama Mose.'
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Mtamsikiliza
  rationale: ‘Kusikiliza’ hapa hujumuisha kumtii au kumzingatia, huku wakati ujao ukibeba nguvu ya agizo la agano.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: katika kila jambo atakalowaambia
  rationale: Ni Kiswahili cha sasa na kinachoeleweka kinachohifadhi ukamilifu wa yale yote atakayosema.
theological_decisions:
- issue: Nukuu ya Kumbukumbu la Torati 18 na utambulisho wa Kimasihi
  choice: Kutafsiri kama unabii kuhusu ‘nabii’ bila kuingiza wazi ‘Masihi’ katika nukuu.
  alternative: Kutumia ‘yule Nabii’ au kumtaja Masihi moja kwa moja.
  rationale: Katika Matendo, Petro anatumia kifungu hiki kumhusu Yesu, lakini maneno yenyewe ya Kigiriki yanasema ‘nabii.’ Tafsiri haipaswi kuingiza utambulisho huo ndani ya nukuu zaidi ya yale maandishi yanayosema.
- issue: Maana ya ἀδελφῶν
  choice: ndugu zenu
  alternative: Waisraeli wenzenu
  rationale: Chanzo kinatumia lugha ya kindugu ya kiume kwa maana ya uwakilishi wa ukoo na agano. Tanbihi inaeleza upeo wake bila kuufuta usemi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa nukuu na msamiati wa kibiblia umehifadhiwa bila kuwa wa kizamani; utata na mvutano wa kiteolojia wa chanzo haujaondolewa.
