id: ACT.3.14
reference: Acts 3:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: sw
  text: Lakini ninyi mlimkana yule Mtakatifu na Mwenye Haki, mkaomba mpewe mtu muuaji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi katika muktadha, “aachiliwe kwa ajili yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Lakini ninyi
  rationale: “Lakini” linaonyesha utofautishaji unaoletwa na δέ, na “ninyi” linahifadhi msisitizo wa kiwakilishi kilichotajwa wazi katika Kigiriki.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: yule Mtakatifu na Mwenye Haki
  rationale: Vivumishi hivi vyenye kibainishi vinatumika kama majina ya kumtaja Yesu. “Yule” husaidia matumizi hayo ya kimajina, na herufi kubwa zinaonyesha uzito wa kitajwa bila kuongeza fundisho lisilokuwamo katika matini.
- source_word: ἠρνήσασθε
  choice: mlimkana
  rationale: Kitenzi “kumkana” kinabeba maana ya kukataa kumtambua au kujihusisha naye, na kinafaa kwa nguvu ya ἀρνέομαι katika muktadha huu.
- source_word: ᾐτήσασθε
  choice: mkaomba
  rationale: “Kuomba” ni tafsiri ya kawaida na ya asili ya αἰτέω; muundo wa “mka-” unaunganisha tendo hili na tendo lililotangulia.
- source_word: ἄνδρα φονέα
  choice: mtu muuaji
  rationale: Tafsiri hii inawakilisha ἄνδρα (“mtu/mwanamume”) na φονέα (“muuaji”) kwa Kiswahili cha kawaida, huku ikidumisha utofauti mkali na “Mtakatifu na Mwenye Haki.”
- source_word: χαρισθῆναι ὑμῖν
  choice: mpewe
  rationale: “Mpewe” linahifadhi maana pana ya mtu kutolewa au kukubaliwa kwa ajili yao kama fadhili, bila kuingiza moja kwa moja wazo la kuachiliwa ambalo linatokana na muktadha wa kimahakama.
theological_decisions:
- issue: Nguvu ya Kikristo ya τὸν ἅγιον καὶ δίκαιον
  choice: 'Kutafsiri kama kitajwa cha Yesu: “yule Mtakatifu na Mwenye Haki”'
  alternative: 'Kutafsiri kama maelezo ya kawaida: “yule aliye mtakatifu na mwenye haki”'
  rationale: Muundo wa Kigiriki unatumia vivumishi kimajina kumtambulisha Yesu. Tafsiri iliyochaguliwa inadumisha uzito huo bila kutenganisha maneno kuwa vyeo viwili tofauti.
- issue: Dokezo la kimahakama la χαρισθῆναι
  choice: Kutumia neno pana “mpewe” katika matini kuu
  alternative: Kutumia “aachiliwe kwa ajili yenu”
  rationale: Kitenzi cha Kigiriki kina maana pana ya kutoa kwa fadhili, ingawa katika muktadha kinahusu kuachiliwa kwa Baraba. Matini kuu inabaki karibu na upana wa neno, na tanbihi inaeleza maana ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Lakini ninyi” linaweka msisitizo wa moja kwa moja; “mtu muuaji” ni la kawaida na linahifadhi vipengele vyote viwili vya Kigiriki. Alama ya tanbihi imewekwa baada ya kishazi kinachohusu χαρισθῆναι ili rejeo lake liwe wazi.
