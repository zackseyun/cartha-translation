id: ACT.3.21
reference: Acts 3:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: sw
  text: Ambaye ni lazima mbingu zimpokee mpaka nyakati za urejesho wa mambo yote ambayo Mungu alinena habari zake kwa kinywa cha manabii wake watakatifu tangu zamani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ ... δέξασθαι
  choice: lazima ... impokee
  rationale: Huhifadhi ulazima unaoonyeshwa na δεῖ na maana ya δέχομαι ya kumpokea au kumkaribisha.
- source_word: οὐρανὸν
  choice: mbingu
  rationale: Umoja wa Kiswahili unaonyesha eneo la mbinguni kwa namna ya kawaida na yenye hadhi.
- source_word: ἄχρι χρόνων
  choice: mpaka nyakati
  rationale: Huhifadhi kikomo cha muda na wingi wa χρόνοι.
- source_word: ἀποκαταστάσεως πάντων
  choice: kurejeshwa kwa vitu vyote
  rationale: Hutoa maana ya kurudishwa katika hali inayofaa bila kufafanua isivyostahili upeo au namna ya urejesho.
- source_word: ὧν
  choice: ambavyo
  rationale: Hukihusisha kishazi na 'vitu vyote' moja kwa moja, huku ukihifadhi uwezekano wa kimuundo wa Kigiriki badala ya kuongeza 'kuhusu ambavyo'.
- source_word: διὰ στόματος
  choice: kupitia vinywa
  rationale: Huhifadhi nahau ya chanzo ya kusema kupitia kinywa; wingi wa Kiswahili unalingana kiasili na manabii wengi.
- source_word: ἀπ’ αἰῶνος
  choice: tangu zamani
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya tangu nyakati za kale bila kudai maana ya tangu umilele.
theological_decisions:
- issue: Upeo wa 'kurejeshwa kwa vitu vyote'
  choice: kurejeshwa kwa vitu vyote
  alternative: kufanywa upya kwa kila kitu
  rationale: Tafsiri iliyochaguliwa huhifadhi lugha pana ya kifungu bila kuamua kimbele mafundisho kuhusu upeo wa mwisho wa urejesho.
- issue: Uhusiano wa ὧν na πάντων
  choice: vitu vyote ambavyo Mungu alinena
  alternative: vitu vyote ambavyo Mungu alinena kuvihusu
  rationale: Kigiriki kinaruhusu uhusiano huu wa moja kwa moja; chaguo hili linafuata kwa karibu ushahidi wa chanzo na haliongezi kihusishi cha ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendelea kutoka mstari uliotangulia, kwa hiyo unaanza na 'Ambaye'. Hakuna tanbihi inayohitajika.
