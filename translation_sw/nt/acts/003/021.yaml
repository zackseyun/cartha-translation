revisions:
- from: Ambaye lazima mbingu impokee mpaka nyakati za kurejeshwa kwa vitu vyote ambavyo Mungu alinena kupitia vinywa vya manabii wake watakatifu tangu zamani.
  to: Ambaye ni lazima mbingu zimpokee mpaka nyakati za urejesho wa mambo yote ambayo Mungu alinena habari zake kwa kinywa cha manabii wake watakatifu tangu zamani.
  rationale: 'The revision corrects the Swahili class agreement and makes the relative construction idiomatic while retaining the source''s ambiguity at the appropriate level: God spoke concerning the realities included in the restoration. It preserves the dependent syntax carried over from the preceding verse and does not add interpretive claims.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:44:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the necessary divine necessity, heaven's receiving of the referent, the temporal limit, restoration, and prophetic speech. However, the verb agreement in “mbingu impokee” is not correct for mbingu. The genitive relative ὧν is most clearly and naturally expressed in Swahili as the matters concerning which God spoke, without settling any theological question about the extent or nature of the restoration.
  naturalness: “Ambaye ni lazima mbingu zimpokee” is grammatical Standard East African Swahili and preserves the verse's dependent opening. “Nyakati za urejesho” and “kwa kinywa cha manabii wake watakatifu” are natural, dignified biblical-register phrasing. “Mambo yote ambayo Mungu alinena habari zake” avoids the unnatural implication that God literally spoke physical ‘things’.
  terminology: “Urejesho” is an appropriate rendering of ἀποκατάστασις and preserves the broad wording. “Manabii wake watakatifu” correctly represents τοὺς ἁγίους ... προφήτας without introducing doctrinal interpretation. No footnote is required.
  issues:
  - severity: medium
    issue: Subject agreement in “mbingu impokee”
    rationale: Mbingu normally takes the class 10 subject concord zi-; the required form is “mbingu zimpokee.”
  - severity: medium
    issue: “vitu vyote ambavyo Mungu alinena” is semantically awkward in Swahili
    rationale: Although formally close to the Greek, it suggests that God uttered objects. The source's genitive relative naturally permits “mambo yote ambayo Mungu alinena habari zake,” which retains the referential relationship and the English audit trail's sense without adding theological content.
  revised_text: Ambaye ni lazima mbingu zimpokee mpaka nyakati za urejesho wa mambo yote ambayo Mungu alinena habari zake kwa kinywa cha manabii wake watakatifu tangu zamani.
  revised_footnotes: []
