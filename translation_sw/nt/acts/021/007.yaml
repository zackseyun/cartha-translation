  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: sw
  text: Tulipomaliza safari ya baharini kutoka Tiro, tulifika Ptolemai. Baada ya kuwasalimu hao ndugu[a], tulikaa nao siku moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike”; Kigiriki kinasema “ndugu” katika wingi wa kiume, neno ambalo linaweza kurejelea waamini kwa upana.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Tulipomaliza ... yetu
  rationale: Kiwakilishi cha nafsi ya kwanza wingi kinaonyeshwa kwa kiambishi tu- na kimilikishi “yetu”; δέ hapa ni kiunganishi cha mpito ambacho mtiririko wa Kiswahili hauhitaji kukitafsiri kwa neno tofauti.
- source_word: τὸν πλοῦν διανύσαντες
  choice: Tulipomaliza safari yetu ya baharini
  rationale: διανύω huonyesha kukamilisha safari, na πλοῦς ni safari ya majini; muundo wa “tulipomaliza” unaonyesha kwamba tendo hilo lilitangulia kufika.
- source_word: ἀπὸ Τύρου
  choice: kutoka Tiro
  rationale: ἀπό huonyesha mahali safari ilipoanzia; “kutoka” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: tulifika Ptolemai
  rationale: καταντάω katika muktadha wa safari humaanisha kufika mahali, na εἰς hutaja mwisho wa safari. “Ptolemai” ni umbo la Kiswahili la jina hilo la kale.
- source_word: ἀσπασάμενοι
  choice: Baada ya kuwasalimu
  rationale: ἀσπάζομαι humaanisha kusalimu; “baada ya” huhifadhi mpangilio wa matendo unaoonyeshwa na kitenzi-shirikishi cha aoristi.
- source_word: τοὺς ἀδελφοὺς
  choice: ndugu
  rationale: ἀδελφοί ni wingi wa kiume lakini katika jumuiya ya Kikristo inaweza kumaanisha waamini wenzao kwa upana. “Ndugu” huhifadhi usemi wa kifamilia na, katika Kiswahili, inaweza kueleweka kwa upana kulingana na muktadha.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: tulikaa nao siku moja
  rationale: μένω ni kukaa au kubaki, accusative ἡμέραν μίαν huonyesha muda, na παρά pamoja na dative huonyesha kuwa katika ushirika wao; “tulikaa nao siku moja” ni ya asili na sahihi.
theological_decisions:
- issue: Maana ya ἀδελφοὺς katika jumuiya ya Kikristo
  choice: ndugu
  alternative: ndugu wa kiume; ndugu waumini, wanaume na wanawake
  rationale: Neno la Kigiriki lina umbo la wingi wa kiume, lakini linaweza kutumiwa kwa waamini kwa ujumla. Tafsiri “ndugu” haiamui kimyakimya kwamba wanaume pekee walikusudiwa; tanbihi huhifadhi uwezekano mpana wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili iwe wazi na ya kawaida bila kupoteza mfuatano wa matendo katika Kigiriki.
