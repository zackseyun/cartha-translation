translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Umoja wa kisarufi katika ‘umati ... ulikuwa ... ukipaza’ unalingana na nomino ya mkusanyiko ya Kigiriki, ingawa watu wengi ndio wanaotenda.
