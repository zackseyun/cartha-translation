  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: sw
  text: Kwa maana umati wa watu ulikuwa ukimfuata huku wakipaza sauti, “Mwondoe!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθει
  choice: ulikuwa ukimfuata
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea wakati uliopita; muundo huu unaleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na simulizi lililotangulia bila kuufanya kuwa mkali kuliko Kigiriki.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: umati wa watu
  rationale: Ni usemi wa kawaida na usioegemea upande wowote kwa kundi kubwa; haiongezi dharau iliyomo katika neno kama ‘ghasia’.
- source_word: κράζοντες
  choice: huku ukipaza sauti
  rationale: Kirai hiki kinaonyesha kitendo kilichoambatana na kufuata kwao na kinahifadhi nguvu ya κράζω kwa lugha ya staha na ya sasa.
- source_word: Αἶρε αὐτόν
  choice: Mwondoe!
  rationale: Katika muktadha huu amri ya αἴρω ni dai lenye uhasama la kumwondoa Paulo, si la kumwinua tu; ‘Mwondoe!’ ni fupi, yenye nguvu, na inaacha wazi iwapo wanataka aondolewe hapo au auawe.
