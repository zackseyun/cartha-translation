  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: sw
  text: Wachukue watu hawa, ujitakase pamoja nao, na uwalipie gharama zao ili wanyoe vichwa vyao. Ndipo watu wote watajua kwamba yale waliyoambiwa kukuhusu[a] hayana msingi wowote, bali kwamba wewe mwenyewe pia unaenenda kwa utaratibu huku ukiishika Sheria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yale waliyofundishwa kukuhusu.” Kitenzi cha Kigiriki kinaweza kumaanisha “kufundisha” au, kwa maana pana zaidi, “kuarifu.” Hapa kinarejelea taarifa zilizosambaa kuhusu Paulo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “unaenenda katika mstari,” yaani unaishi kwa namna inayopatana na kuishika Sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Wachukue watu hawa
  rationale: Kirai hiki kinaelekezwa kwa Paulo kwa nguvu ya amri; neno ‘watu’ linafafanua warejelewa, yaani wale watu wanne wa mstari uliotangulia.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: ujitakase pamoja nao
  rationale: Amri hii inahusu kuingia katika utakaso wa kiibada; umbo la kujirejelea ‘ujitakase’ ni la kawaida na wazi katika Kiswahili.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: uwalipie gharama zao
  rationale: Maana ni kugharimia watu hao, yaelekea gharama zinazohusiana na nadhiri yao.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: ili wanyoe vichwa vyao
  rationale: ἵνα pamoja na kitenzi cha wakati ujao hapa huonyesha kusudi; umoja wa ‘kichwa’ katika Kigiriki una maana ya kugawanywa kwa kila mmoja, hivyo wingi ni wa asili katika Kiswahili.
- source_word: γνώσονται πάντες
  choice: Ndipo kila mtu atakapojua
  rationale: ‘Ndipo’ huonyesha matokeo ya hatua zilizotangulia kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: mambo waliyoambiwa kukuhusu
  rationale: κατηχέω inaweza kumaanisha kufundisha au kuarifu; katika muktadha huu inahusu taarifa zilizosambaa kuhusu Paulo.
- source_word: οὐδέν ἐστιν
  choice: si ya kweli
  rationale: Katika muktadha, msemo huu unakanusha ukweli au msingi wa taarifa hizo; ‘si ya kweli’ ni wazi kwa msomaji wa kawaida.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: bali kwamba wewe mwenyewe pia unaishi kwa kufuata na kuishika Sheria
  rationale: στοιχέω huonyesha mwenendo unaolingana na kanuni fulani, na φυλάσσω huonyesha kuishika. Tafsiri inahifadhi dhana zote mbili bila kutumia sitiari isiyo wazi ya ‘kutembea katika mstari.’
- source_word: νόμον
  choice: Sheria
  rationale: Katika muktadha ni Sheria ya Kiyahudi; ‘Sheria’ huhifadhi usemi wa Kigiriki bila kuongeza ufafanuzi wa ‘Musa’ ndani ya matini.
theological_decisions:
- issue: Uhusiano wa Paulo na Sheria katika simulizi hili
  choice: 'Kauli imetafsiriwa kama maelezo ya mwenendo unaoonekana wa Paulo: ‘wewe mwenyewe pia unaishi kwa kufuata na kuishika Sheria.’'
  alternative: ‘wewe mwenyewe pia unaishika Sheria’ au ‘wewe pia unaenenda kwa utaratibu huku ukiishika Sheria’
  rationale: Mstari unaeleza hitimisho ambalo wengine wangepata kutokana na Paulo kushiriki utakaso na kulipa gharama. Tafsiri haiongezi suluhisho la kiteolojia kuhusu mafundisho ya Paulo juu ya Sheria katika sehemu nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Sheria’ imeandikwa kwa herufi kubwa kuonyesha Sheria inayojulikana katika muktadha wa Kiyahudi. Alama zote za tanbihi zimewekwa katika matini kuu.
