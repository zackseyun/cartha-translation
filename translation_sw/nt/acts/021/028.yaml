review_pass:
  verdict: revise
  source_fidelity: The draft preserves the public outcry, direct appeal, the charges concerning the people, the Law, the place, Greeks, and defilement. However, “taifa letu” changes “the people” (τοῦ λαοῦ) into “our nation,” adding possessive force not expressed in the Greek, and “mambo yaliyo kinyume na” needlessly recasts the accusation as unspecified ‘matters.’
  naturalness: The Swahili is generally clear and appropriately formal. A small syntactic revision makes the accusation more direct and maintains the Greek structure. Using a finite verb for the second perfect accusation is also smoother than coordinating an infinitive after “amewaingiza.”
  terminology: “Sheria” is suitable in this Jerusalem context, and “Wagiriki” correctly represents Ἕλληνας rather than broadening it to ‘Gentiles.’ “Hekalu” with a footnote appropriately represents ἱερόν. “Mahali hapa patakatifu” and “amenajisi” accurately retain the cultic charge without endorsing it as fact.
  issues:
  - severity: medium
    issue: “taifa letu” for τοῦ λαοῦ
    rationale: The Greek says “the people,” not “our nation.” The possessive “letu” is an addition, while “taifa” can shift the referent from the Jewish people to a national polity.
  - severity: medium
    issue: “mambo yaliyo kinyume na” for the accusation introduced by κατὰ
    rationale: This introduces an unspecified object, ‘matters,’ absent from the Greek. The wording should directly express teaching against the people, the Law, and this place.
  - severity: low
    issue: “na kupanajisi” after “amewaingiza”
    rationale: Although understandable, a finite perfect verb better matches κεκοίνωκεν and gives a clearer coordination of the two completed accusations.
  revised_text: wakipaza sauti, “Enyi wanaume wa Israeli, saidieni! Huyu ndiye mtu yule anayewafundisha watu wote kila mahali kinyume na watu, Sheria, na mahali hapa. Zaidi ya hayo, amewaingiza hata Wagiriki katika Hekalu[a] na amepanajisi mahali hapa patakatifu.”
  revised_footnotes:
  - marker: a
    text: Kigiriki ἱερόν kinamaanisha eneo lote la Hekalu au nyua zake, si hasa patakatifu pa ndani.
    reason: lexical_alternative
  revision_rationale: The revision removes additions (“letu” and unspecified “mambo”), more directly reflects the Greek accusation, and preserves the disputed accusation as the crowd’s reported speech. The footnote remains correctly anchored to “Hekalu” and retains the important distinction that ἱερόν denotes the temple complex rather than specifically the inner sanctuary.
