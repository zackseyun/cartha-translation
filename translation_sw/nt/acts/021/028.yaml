id: ACT.21.28
reference: Acts 21:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: sw
  text: wakipaza sauti, “Enyi wanaume wa Israeli, saidieni! Huyu ndiye mtu yule anayewafundisha watu wote kila mahali kinyume na watu, Sheria, na mahali hapa. Zaidi ya hayo, amewaingiza hata Wagiriki katika Hekalu[a] na amepanajisi mahali hapa patakatifu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ἱερόν kinamaanisha eneo lote la Hekalu au nyua zake, si hasa patakatifu pa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: wakipaza sauti
  rationale: Kirai hiki cha hali kinaonyesha namna walivyotoa shtaka lao kwa sauti kubwa na kwa dharura; ni Kiswahili cha kawaida chenye hadhi.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Enyi wanaume wa Israeli
  rationale: Inahifadhi mwito wa moja kwa moja na umbo la kiume la Kigiriki bila kufanya Kiswahili kuwa kigumu.
- source_word: βοηθεῖτε
  choice: saidieni!
  rationale: Ni amri ya kuomba msaada. Haiongezi kiwakilishi ‘tusaidieni,’ ambacho hakijaelezwa wazi katika Kigiriki.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Huyu ndiye yule mtu
  rationale: Huonyesha utambulisho wenye nguvu ya shtaka; ‘yule mtu’ ni ya asili katika muktadha wa mtu anayedaiwa kujulikana kwa jambo fulani.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: mambo yaliyo kinyume na taifa letu, Sheria, na mahali hapa
  rationale: κατά pamoja na jenitivi huonyesha upinzani. ‘Taifa letu’ hutambulisha kwa kawaida watu wa Israeli wanaosemwa katika muktadha, huku ‘Sheria’ ikirejelea Sheria ya Musa.
- source_word: πάντας πανταχῇ διδάσκων
  choice: anayewafundisha watu wote kila mahali
  rationale: Inahifadhi msisitizo maradufu wa πάντας na πανταχῇ kwa Kiswahili kinachoeleweka.
- source_word: ἔτι τε καὶ
  choice: Zaidi ya hayo
  rationale: Huonyesha kuongezwa kwa shtaka jingine kwa msisitizo.
- source_word: Ἕλληνας
  choice: Wagiriki
  rationale: Maana ya moja kwa moja ni Wagiriki, si neno pana zaidi ‘Mataifa.’
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: amewaingiza hata Wagiriki katika eneo la Hekalu
  rationale: ἱερόν hapa ni eneo lote la Hekalu au nyua zake, si patakatifu pa ndani pekee. ‘Eneo la Hekalu’ linaweka usahihi huo katika matini kwa lugha ya kawaida.
- source_word: κεκοίνωκεν
  choice: kupanajisi
  rationale: Katika muktadha wa ibada, κοινόω humaanisha kufanya mahali kuwa najisi au si patakatifu; ‘panajisi’ ni neno wazi na linalofaa.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: mahali hapa patakatifu
  rationale: Inahifadhi kiashiria ‘hapa’ na hadhi takatifu ya eneo hilo.
theological_decisions:
- issue: Rejeo la τοῦ νόμου
  choice: Sheria, kwa herufi kubwa, ikimaanisha Sheria ya Musa
  alternative: sheria, kwa maana ya jumla
  rationale: Muktadha wa Yerusalemu na Hekalu unaonyesha shtaka kuhusu Sheria ya Kiyahudi; herufi kubwa humsaidia msomaji kutambua rejeo hilo bila kuongeza fundisho la kimadhehebu.
- issue: Maana ya ἱερόν
  choice: eneo la Hekalu katika matini kuu
  alternative: Hekalu; au nyua za Hekalu
  rationale: Neno hili linahusu jengo na viwanja vya Hekalu kwa upana, tofauti na ναός linaloweza kuelekeza zaidi patakatifu pa ndani. Tafsiri hii inazuia dhana kwamba Wagiriki waliingizwa ndani ya mahali patakatifu kabisa.
- issue: Hali ya kauli kuhusu Paulo
  choice: kuhifadhi kama shtaka la umati, bila kuthibitisha ukweli wake
  alternative: kuifafanua kama taarifa ya kweli au shtaka la uongo ndani ya mstari
  rationale: Mstari unaripoti walichopaza sauti; hauamui ndani yake uhalali wa madai hayo. Tafsiri haipaswi kutatua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Enyi’ linafaa kwa mwito wa hadharani; ‘eneo la Hekalu’ linaweka wazi maana ya kihistoria bila lugha nzito. Alama ya tanbihi [a] iko baada ya kirai kinachohusika.
