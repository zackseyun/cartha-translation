translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa sentensi umefanywa wa kawaida katika Kiswahili huku mfuatano wa matukio na utata halisi wa συγχέω ukihifadhiwa kwa tanbihi.
