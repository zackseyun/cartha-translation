  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: sw
  text: Siku zile saba zilipokuwa karibu kukamilika, Wayahudi kutoka Asia walipomwona katika eneo la hekalu[c], waliuchochea umati wote[a] na kumkamata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliutia umati wote katika mkanganyiko.” Kitenzi cha Kigiriki kinaweza kusisitiza kuuchochea umati au kuutia katika mkanganyiko.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “walimwekea mikono”; hii ni nahau inayomaanisha kumshika mtu kwa nguvu.
    reason: lexical_alternative
  - marker: c
    text: “Eneo la hekalu” hapa linatafsiri neno la Kigiriki linalomaanisha eneo la hekalu na nyua zake, si patakatifu pa ndani pekee.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Zile siku saba zilipokuwa karibu kwisha
  rationale: Huhifadhi maana ya wakati uliokaribia kukamilika, huku 'zile siku saba' ikirejelea kipindi kilichotajwa katika muktadha bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: Wayahudi kutoka Asia
  rationale: Hutoa maana ya asili yao kwa lugha ya kawaida. Asia hapa ni jimbo la Kirumi, si bara lote kwa maana ya kisasa.
- source_word: θεασάμενοι αὐτὸν
  choice: walipomwona Paulo
  rationale: Kitenzi kishirikishi kinaonyesha kwamba kumwona kulitangulia au kuliambatana karibu na hatua yao. Jina 'Paulo' limetumiwa badala ya kiwakilishi ili sentensi isimame wazi kama aya ya pekee.
- source_word: ἐν τῷ ἱερῷ
  choice: katika eneo la hekalu
  rationale: ἱερόν humaanisha eneo lote la hekalu, si patakatifu pa ndani pekee; 'eneo la hekalu' ni sahihi na linaeleweka kwa msomaji wa kawaida.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: waliuchochea umati wote
  rationale: συγχέω inaweza kueleza kuchochea, kuvuruga, au kutia katika hali ya mkanganyiko. 'Waliuchochea' inafaa katika tukio la umati lakini tanbihi huhifadhi uwezekano mwingine.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: na kumkamata
  rationale: Nahau ya Kigiriki inaeleza kumshika mtu kwa nguvu. 'Kumkamata' ni Kiswahili cha asili na wazi, bila kudokeza lazima kukamatwa rasmi na mamlaka.
