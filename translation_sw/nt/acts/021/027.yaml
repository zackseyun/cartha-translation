  source_fidelity: Mfuatano wa matukio, kipindi cha siku saba, Wayahudi kutoka Asia, na hatua dhidi yake vimewasilishwa kwa uaminifu. Hata hivyo, «Paulo» haimo katika sentensi ya Kigiriki, ambayo hutumia kiwakilishi «yeye»; ni salama zaidi kutolitaja jina katika aya hii. Pia «karibu kukamilika» huakisi kwa karibu zaidi μέλλω ... συντελεῖσθαι kuliko «karibu kwisha».
  naturalness: Marekebisho yaliyopendekezwa ni Kiswahili Sanifu cha Afrika Mashariki na yana mtiririko wa kawaida. «Eneo la hekalu» ni wazi na tanbihi hufafanua upeo wa ἱερόν.
  terminology: «Asia» yahifadhiwe kama jina la mahali, huku tanbihi ya hekalu ikieleza kwamba ἱερόν ni eneo la hekalu, wala si patakatifu pa ndani pekee. «Kumkamata» ni tafsiri ya kawaida na yenye maana pana inayofaa kwa nahau ya Kigiriki.
