  text: He had four unmarried daughters who were prophesying.
translation:
  language: sw
  text: Alikuwa na binti wanne mabikira[a] waliokuwa wakitoa unabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ambao hawakuwa wameolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: Alikuwa na
  rationale: Kiwakilishi hiki cha hali ya kutoa kinaelekezwa kwa Filipo katika muktadha. Muundo wa Kigiriki wa kumiliki, kihalisi ‘kwake walikuwako binti,’ umetafsiriwa kwa Kiswahili cha kawaida kuwa ‘alikuwa na.’
- source_word: δὲ
  choice: —
  rationale: Hiki ni kiunganishi chepesi cha kuendeleza simulizi; mtiririko wa sentensi ya Kiswahili unaonyesha uhusiano huo bila kukitafsiri kwa neno maalumu.
- source_word: ἦσαν
  choice: alikuwa na
  rationale: Kitenzi hiki kiko katika muundo wa Kigiriki unaoonyesha umilikaji pamoja na τούτῳ; ‘alikuwa na’ ni Kiswahili cha kawaida na sahihi.
- source_word: θυγατέρες
  choice: binti
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watoto wa kike wa mtu katika uhusiano wa kifamilia.
- source_word: τέσσαρες
  choice: wanne
  rationale: Namba imepatana na ngeli ya ‘binti.’
- source_word: παρθένοι
  choice: mabikira
  rationale: ‘Mabikira’ linaonyesha moja kwa moja maana ya wanawake ambao hawajafanya ngono, huku uwezekano wa maana ya kijamii ya kutokuwa wameolewa ukihifadhiwa katika tanbihi.
- source_word: προφητεύουσαι
  choice: waliokuwa wakitoa unabii
  rationale: Muundo huu unaonyesha tendo au huduma iliyokuwa ikiendelea na unaepuka kupunguza unabii kuwa kutabiri matukio yajayo pekee.
theological_decisions:
- issue: Maana ya παρθένοι kwa wanawake waliokuwa wakitoa unabii
  choice: mabikira
  alternative: ambao hawakuwa wameolewa
  rationale: Maandishi yanataja hali yao na shughuli yao ya kutoa unabii bila kueleza uhusiano wa kiteolojia kati ya mambo hayo. Tafsiri ya moja kwa moja ‘mabikira’ haiingizi tathmini ya kimadhehebu; maana pana ya kijamii imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Kiwakilishi cha mwanzo kinamrejelea Filipo kwa wazi kutokana na muktadha uliotangulia.
