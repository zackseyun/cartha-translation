  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: sw
  text: Baada ya siku hizo, tukiisha kujiandaa[a], tulipanda kwenda Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukiisha kufunga mizigo.” Neno la Kigiriki linaweza kumaanisha kujitayarisha kwa safari kwa ujumla, si kufunga mizigo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Baada ya siku hizo
  rationale: μετά pamoja na hali ya kushutumiwa huonyesha mfuatano wa wakati. Tafsiri hii ni ya kawaida katika Kiswahili na inarejelea kipindi kilichotangulia bila kuongeza kwamba siku hizo ‘zilikwisha.’
- source_word: ἐπισκευασάμενοι
  choice: tulipokuwa tumejiandaa
  rationale: Kitenzi hiki kinaweza kumaanisha kujitayarisha au kujipatia mahitaji ya safari, huenda pamoja na kufunga mizigo. ‘Tumejiandaa’ huhifadhi maana yake pana badala ya kuifanya ihusu mizigo pekee.
- source_word: ἀνεβαίνομεν
  choice: tulipanda kwenda
  rationale: Kauli ya wakati uliopita inaendeleza simulizi la safari. ‘Tulipanda kwenda’ huhifadhi wazo la kuelekea juu, linalofaa safari ya kwenda Yerusalemu, huku likisomeka kwa kawaida katika Kiswahili.
- source_word: εἰς Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: εἰς huonyesha mwendo kuelekea mahali. Pamoja na ‘kwenda,’ jina la mahali bila kihusishi kingine ni muundo wa kawaida wa Kiswahili.
