  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: sw
  text: Baada ya kuwapata wanafunzi[a], tulikaa huko siku saba. Wao waliendelea kumwambia Paulo kwa njia ya Roho kwamba asiende Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «kwa Roho.» Kirai hiki kinaweza kumaanisha kwamba Roho aliwafunulia mateso yaliyokuwa yakimngojea Paulo, nao wakahitimisha kwamba asiende Yerusalemu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Baada ya kuwapata
  rationale: Kirai tegemezi cha wakati kinaonyesha tendo lililotangulia tendo kuu; usemi huu ni wa kawaida katika Kiswahili na unadumisha mfuatano huo.
- source_word: μαθητάς
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida katika Matendo kwa wafuasi wa Yesu, na lina maana mahsusi zaidi kuliko ‘waamini’.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: tulikaa huko
  rationale: ἐπιμένω hapa humaanisha kubaki au kukaa, huku αὐτοῦ ikitumiwa kuonyesha mahali, yaani ‘huko’.
- source_word: ἡμέρας ἑπτά
  choice: siku saba
  rationale: Hiki ni kipimo cha muda; Kiswahili kinaweza kueleza muda huo kwa kawaida bila kuongeza ‘kwa muda wa’.
- source_word: οἵτινες
  choice: Wao
  rationale: Kiwakilishi kinawarejelea wanafunzi waliotajwa na kuanzisha sentensi mpya kwa uwazi.
- source_word: ἔλεγον
  choice: waliendelea kumwambia
  rationale: Wakati usiotimilika wa kitenzi unaonyesha kusema kulikodumu au kurudiwa.
- source_word: διὰ τοῦ πνεύματος
  choice: kwa njia ya Roho
  rationale: Usemi huu unadumisha maana ya njia au uwakala bila kuongeza neno ‘Mtakatifu,’ ambalo halipo wazi katika kirai cha Kigiriki.
- source_word: μὴ ἐπιβαίνειν
  choice: asiende
  rationale: Katika muktadha wa safari kwenda mahali fulani, kitenzi kina maana ya kuendelea au kwenda huko. Kiswahili cha kawaida hakihitaji sitiari ya ‘kupanda’ kwa safari ya Yerusalemu.
- source_word: εἰς Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Kwa kitenzi ‘kwenda,’ jina la mahali huonyesha mwisho wa safari kwa kawaida bila kihusishi cha ziada.
theological_decisions:
- issue: Uhusiano wa διὰ τοῦ πνεύματος na safari ya Paulo
  choice: kwa njia ya Roho
  alternative: kwa Roho
  rationale: Tafsiri inasema kwa uaminifu kwamba wanafunzi walimwambia Paulo kwa njia ya Roho, bila kuamua kimya-kimya kama Roho mwenyewe alikataza safari hiyo au aliwafunulia mateso yaliyokuwa yakimngojea, nao wakahitimisha kwamba asiende.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Waliendelea kumwambia’ linaonyesha hali ya kurudiwa ya ἔλεγον; ‘kwa njia ya Roho’ linahifadhi mvutano wa kitheolojia bila kuutatua kwa tafsiri.
