  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: sw
  text: Tuliposikia mambo hayo[a], sisi pamoja na wenyeji tukamsihi Paulo asipande kwenda Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukamwomba sana Paulo asipande kwenda Yerusalemu.” Kitenzi hiki kinaweza pia kumaanisha kusihi kwa bidii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: Tuliposikia mambo hayo
  rationale: Muundo huu unaonyesha wakati na mwendelezo wa simulizi kwa Kiswahili cha kawaida. “Mambo hayo” huhifadhi wingi wa ταῦτα na kurejelea yaliyotangulia.
- source_word: παρεκαλοῦμεν
  choice: tukamsihi
  rationale: Katika muktadha huu παρακαλέω ina maana ya kutoa ombi la dhati. “Kumsihi” huonyesha uzito wa ombi bila kulifanya lazima liwe kuomba kwa kulia; tanbihi inataja uwezekano huo wa nguvu zaidi.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: sisi pamoja na wenyeji
  rationale: 'Hutofautisha na kuunganisha makundi mawili: kundi la msimulizi na watu wa mahali hapo. “Wenyeji” ni neno la kawaida na lenye heshima.'
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: asiende
  rationale: Hutoa kwa Kiswahili cha asili yaliyomo katika ombi la kutaka Paulo asifanye safari hiyo. Jina “Paulo” limetumika badala ya kiwakilishi ili kuzuia utata unaoweza kutokea katika mfuatano wa viambishi.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hutaja kwa uwazi mahali safari ilikoelekea.
theological_decisions:
- issue: Nahau ya mwelekeo wa kwenda Yerusalemu
  choice: asiende Yerusalemu
  alternative: asipande kwenda Yerusalemu
  rationale: Ingawa ἀναβαίνειν kihalisi ni “kupanda,” Kiswahili cha sasa hakitumii kwa kawaida “kupanda kwenda” kama nahau ya safari ya kuelekea Yerusalemu. “Kwenda” huwasilisha tendo lililokusudiwa bila kuongeza dai la kiteolojia; maana ya mwelekeo wa juu hubaki ndani ya mazingira ya kijiografia na nahau ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa usimulizi wa kawaida; “wenyeji” huepuka lugha nzito, na tanbihi huhifadhi upana wa maana ya παρακαλέω.
