  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: sw
  text: 'Kwa hiyo, fanya tunalokuambia: tunao wanaume wanne waliojiwekea nadhiri[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao wameweka nadhiri.” Kigiriki, kwa neno kwa neno, kinasema, “walio na nadhiri.”
    reason: lexical_alternative
  - marker: b
    text: Muktadha mpana unaweza kudokeza nadhiri ya aina ya Mnadhiri, lakini mstari huu wenyewe unasema tu “nadhiri.”
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Kwa hiyo
  rationale: οὖν huonyesha hitimisho linalotokana na yaliyotangulia; ‘Kwa hiyo’ ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili, huku τοῦτο ikibebwa na amri inayofuata.
- source_word: ποίησον
  choice: fanya
  rationale: Amri ya kitenzi ποιέω imetafsiriwa moja kwa moja na kwa kawaida kuwa ‘fanya’; jambo la kufanywa linaelezwa katika kishazi kinachofuata.
- source_word: ὅ σοι λέγομεν
  choice: tunalokuambia
  rationale: Muundo huu unaonyesha jambo linaloagizwa. ‘Tunalokuambia’ ni Kiswahili cha asili kinachohifadhi nafsi ya pili umoja na nafsi ya kwanza wingi.
- source_word: εἰσὶν ἡμῖν
  choice: tunao
  rationale: Muundo wa Kigiriki wa kuwapo pamoja na dativu unaeleza hali ya kuwa nao; ‘tunao’ ni tafsiri fupi na ya kawaida ya Kiswahili.
- source_word: ἄνδρες τέσσαρες
  choice: wanaume wanne
  rationale: ἀνήρ hapa humaanisha watu wazima wa kiume; ‘wanaume wanne’ ni sahihi na ya kawaida.
- source_word: εὐχὴν ἔχοντες
  choice: walio chini ya nadhiri
  rationale: Kirai hiki kinaonyesha hali inayoendelea ya kufungwa na nadhiri. ‘Walio chini ya nadhiri’ ni cha kawaida zaidi kuliko tafsiri sisisi ‘walio na nadhiri’ na hakiongezi aina ya nadhiri.
- source_word: ἀφ’ ἑαυτῶν
  choice: waliyojiwekea wenyewe
  rationale: Kirai hiki kinaunganisha nadhiri na watu hao wenyewe. Tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba ni nadhiri yao wenyewe bila kuibainisha kuwa ya aina fulani.
theological_decisions:
- issue: Aina ya nadhiri katika muktadha
  choice: Kutumia neno la jumla ‘nadhiri’ bila kuitaja kuwa nadhiri ya Mnadhiri.
  alternative: nadhiri ya Mnadhiri
  rationale: Ingawa muktadha mpana unaweza kuelekeza kwenye nadhiri ya aina ya Mnadhiri, mstari wenyewe unasema tu εὐχήν, ‘nadhiri.’ Tafsiri kuu haipaswi kuongeza jambo ambalo halikutajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘walio chini ya nadhiri waliyojiwekea wenyewe’ unahifadhi hali inayoendelea pamoja na uhusiano wa nadhiri na wanaume hao wenyewe.
