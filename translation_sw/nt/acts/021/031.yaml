  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: sw
  text: Walipokuwa wakijaribu kumuua, taarifa ilimfikia mkuu wa kikosi[a] kwamba Yerusalemu yote ilikuwa katika ghasia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mkuu wa kikosi alikuwa afisa wa jeshi la Roma aliyesimamia kikosi kilichowekwa hapo.
    reason: cultural_note
  - marker: b
    text: Au “ilikuwa katika mkanganyiko” au “ilikuwa katika machafuko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: Walipokuwa wakijaribu kumuua
  rationale: Kirai huru cha hali ya wakati chenye kitenzi endelevu kinaonyesha jaribio lililokuwa likiendelea sambamba na tukio kuu. “Wakijaribu kumuua” ni cha asili katika Kiswahili na hudumisha maana ya kutaka kutekeleza mauaji.
- source_word: ἀνέβη φάσις
  choice: taarifa ilimfikia
  rationale: Ingawa Kigiriki kina taswira halisi ya taarifa ‘kupanda,’ katika Kiswahili ‘taarifa ilimfikia’ huwasilisha kwa uwazi na ufasaha kwamba habari zilimwendea mkuu aliyekuwa ngomeni juu.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: mkuu wa kikosi
  rationale: χίλιαρχος ni afisa mkuu wa kijeshi wa Roma, naye σπεῖρα ni kikosi cha kijeshi. “Mkuu wa kikosi” ni sahihi, rahisi kueleweka, na huepuka istilahi ya kigeni isiyozoeleka.
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: kwamba Yerusalemu yote
  rationale: Huhifadhi sitiari ya mahali kwa wakazi wake na msisitizo wa ὅλη bila kuongeza maneno yasiyokuwamo katika chanzo.
- source_word: συγχύννεται
  choice: ilikuwa katika ghasia
  rationale: Kitenzi kinaonyesha hali inayoendelea ya vurugu, mkanganyiko, au taharuki ya umma. “Katika ghasia” ni usemi wa sasa na wa asili unaofaa muktadha wa fujo za umati.
