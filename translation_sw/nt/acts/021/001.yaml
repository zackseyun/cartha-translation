  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: sw
  text: Baada ya kujiondoa kwa shida kutoka kwao na kuanza safari ya baharini, tulisafiri moja kwa moja hadi Kosi[a]. Siku iliyofuata tukafika Rodo, na kutoka huko tukafika Patara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Kos.
    reason: Mbadala wa jina la mahali
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Baada ya
  rationale: Kirai hiki kinatanguliza tukio linalofuata katika simulizi. “Baada ya” ni Kiswahili cha kawaida kinachoonyesha mpito huo wa wakati bila kuiga muundo wa Kigiriki kwa ugumu.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: kujing’oa kutoka kwao
  rationale: Kitenzi ἀποσπάω kina nguvu kuliko kuagana au kuondoka tu; “kujing’oa” kinaonyesha kwamba kutengana huko kulikuwa kugumu na kwa hisia.
- source_word: ἀναχθῆναι
  choice: kuanza safari ya baharini
  rationale: Katika muktadha wa usafiri wa majini, ἀνάγω humaanisha kuondoka kwa meli au kuanza safari baharini. Chaguo hili ni wazi na la kawaida kwa msomaji wa leo.
- source_word: εὐθυδρομήσαντες
  choice: tulisafiri moja kwa moja
  rationale: Kitenzi hiki cha usafiri wa majini humaanisha kufuata njia iliyonyooka. Tafsiri hii inadumisha wazo la safari ya moja kwa moja kwa Kiswahili cha asili.
- source_word: ἤλθομεν εἰς
  choice: hadi / tukafika
  rationale: Katika masimulizi ya safari, muundo huu huonyesha kufika mahali. Maneno tofauti yametumiwa kwa mtiririko wa kawaida bila kubadili maana.
- source_word: Κῶ
  choice: Kosi
  rationale: Hili ni umbo la Kiswahili la jina la kisiwa cha Kos, linalofuata kawaida ya kuyatohoa majina ya Kigiriki kwa matamshi ya Kiswahili.
- source_word: τῇ δὲ ἑξῆς
  choice: Siku iliyofuata
  rationale: Kirai hiki cha wakati humaanisha siku inayofuata, na tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: Ῥόδον
  choice: Rodo
  rationale: Umbo hili la jina la mahali linafuata utohozi unaotumika katika Biblia za Kiswahili na linawakilisha jina la Kigiriki Ῥόδος.
- source_word: κἀκεῖθεν
  choice: na kutoka huko
  rationale: Muungano wa καί na ἐκεῖθεν unaendeleza ratiba ya safari kwa maana ya “na kutoka huko.”
- source_word: Πάταρα
  choice: Patara
  rationale: Jina hili la mahali linatoholewa moja kwa moja na kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. “Kujing’oa” kimehifadhi uzito wa kihisia wa kutengana, huku majina ya mahali yakitolewa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili.
