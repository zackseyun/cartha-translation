base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: sw
  text: Kisha yule mkuu wa jeshi akakaribia[a], akamkamata Paulo na kuamuru afungwe kwa minyororo miwili[b]. Akawa akiuliza Paulo ni nani na amefanya nini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kamanda wa kikosi.” Kigiriki χιλίαρχος humaanisha afisa wa jeshi la Roma, kihalisi “mkuu wa askari elfu.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “minyororo miwili” huenda yakawa mwangwi wa unabii katika Matendo 21:11 kuhusu Paulo kufungwa Yerusalemu.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: mkuu wa jeshi
  rationale: Neno hili linamtaja afisa wa jeshi la Roma aliyekuwa na mamlaka juu ya kikosi; “mkuu wa jeshi” ni wazi na la kawaida kwa wasomaji wa Kiswahili, huku maelezo ya cheo mahususi yakitolewa katika tanbihi.
- source_word: ἐγγίσας
  choice: akakaribia
  rationale: Kitenzi hiki kinaonyesha kwamba afisa alisogea karibu kabla ya kumkamata Paulo.
- source_word: ἐπελάβετο αὐτοῦ
  choice: akamkamata Paulo
  rationale: Katika muktadha wa kutiwa chini ya ulinzi, usemi huu unaonyesha kumshika kwa nguvu; jina “Paulo” linaondoa utata wa viwakilishi kwa Kiswahili cha kawaida.
- source_word: ἐκέλευσε δεθῆναι
  choice: kuamuru afungwe
  rationale: Huhifadhi mamlaka ya amri na hali ya kutendwa ya δεθῆναι.
- source_word: ἁλύσεσι δυσί
  choice: kwa minyororo miwili
  rationale: Ni tafsiri ya moja kwa moja ya kifaa cha kumfunga mfungwa na inadumisha idadi mbili iliyo katika chanzo.
- source_word: ἐπυνθάνετο
  choice: alikuwa akiuliza
  rationale: Hali ya wakati usiotimilika inaonyesha uchunguzi uliokuwa ukiendelea katikati ya vurugu.
- source_word: τίς εἴη
  choice: Paulo alikuwa nani
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuwasilisha swali lisilo la moja kwa moja baada ya kitenzi cha wakati uliopita.
- source_word: τί ἐστιν πεποιηκώς
  choice: alikuwa amefanya nini
  rationale: Muundo wa ukamilifu unaonyesha tendo lililokwisha kufanywa lenye umuhimu kwa hali ya wakati huo.
theological_decisions:
- issue: Uhusiano wa “minyororo miwili” na unabii wa Matendo 21:11
  choice: Kudumisha maneno ya chanzo bila kutangaza wazi kuwa ni utimilifu wa unabii
  alternative: Kueleza katika matini kuu kwamba minyororo hiyo ilitimiza unabii
  rationale: Chanzo chenyewe hakisemi wazi hapa kwamba kauli hiyo ni utimilifu; tanbihi inaonyesha mwangwi unaowezekana bila kuondoa tahadhari ya kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. “Mkuu wa jeshi” huepuka istilahi ya kale au ya kiufundi kupita kiasi; “alikuwa akiuliza” huhifadhi hali endelevu ya uchunguzi.
