  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: sw
  text: Tulipofika Yerusalemu, ndugu[a] walitukaribisha kwa furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linasema “ndugu”; linaweza pia kuwahusu waamini wenzao kwa upana zaidi, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: Tulipofika
  rationale: Muundo wa genitivi huru unaonyesha wakati au mazingira ya kuwasili. “Tulipofika” ni Kiswahili cha kawaida na sahihi kinachohifadhi maana hiyo.
- source_word: εἰς Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Pamoja na kitenzi “-fika,” jina la mahali halihitaji kihusishi katika Kiswahili; maana ya kuelekea na kuwasili Yerusalemu iko wazi.
- source_word: ἀσμένως
  choice: kwa furaha
  rationale: Kirai hiki kinaonyesha kwamba walipokelewa kwa moyo wa kufurahi; ni cha kawaida na kinakaribia maana ya kielezi cha Kigiriki bila kuongeza wazo la ziada.
- source_word: ἀπεδέξαντο
  choice: walitukaribisha
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwapokea wageni kwa ukarimu. “Walitukaribisha” huwasilisha maana hiyo ya kijamii kwa uwazi.
- source_word: οἱ ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” huhifadhi taswira ya kifamilia ya neno la Kigiriki na ni neno la kawaida kwa waamini wenzao; katika Kiswahili linaweza kuwahusu wanaume na wanawake bila kubadili umbo la matini kuwa “waamini.”
theological_decisions:
- issue: Upeo wa kijinsia wa οἱ ἀδελφοί kwa jumuiya ya Kikristo ya Yerusalemu
  choice: ndugu
  alternative: ndugu wa kiume; waamini
  rationale: Kigiriki kimetumia nomino ya wingi wa kiume, lakini katika matumizi ya jumuiya za Kikristo inaweza kuwahusu waamini wenzao kwa upana zaidi. “Ndugu” ni ya asili katika Kiswahili, huhifadhi sitiari ya kifamilia, na haifungi maana kwa wanaume pekee; tanbihi inaweka wazi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa matini ya Biblia. “Tulipofika Yerusalemu” ni ya asili zaidi kuliko muundo wenye kihusishi, na “kwa furaha” huhifadhi hisia ya ἀσμένως bila kutia chumvi.
