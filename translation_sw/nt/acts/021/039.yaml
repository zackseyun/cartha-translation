source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: sw
  text: Lakini Paulo akasema, “Mimi ni Myahudi, mtu wa Tarso katika Kilikia, raia wa mji usio duni. Ninakusihi, uniruhusu nizungumze na watu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος
  choice: mtu (imewakilishwa kiasili katika ‘Mimi ni Myahudi’)
  rationale: Ingawa ἄνθρωπος iko wazi katika Kigiriki, Kiswahili cha kawaida hakihitaji kusema ‘mimi ni mtu Myahudi’; ‘Mimi ni Myahudi’ huhifadhi utambulisho wa Paulo bila muundo usio wa kawaida.
- source_word: Ἰουδαῖος
  choice: Myahudi
  rationale: Hapa Paulo anajitambulisha kwa utambulisho wake wa kikabila na kidini, huku akitaja Tarso tofauti kuwa mahali anapotoka; hivyo ‘Myahudi’ inafaa kuliko tafsiri inayomaanisha tu mtu wa Uyahudi kama eneo.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: mtu wa Tarso katika Kilikia
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kuwa Paulo anatoka Tarso, huku ikihifadhi Kilikia kama eneo la mji huo na bila kudai kwa lazima kwamba alizaliwa huko.
- source_word: πολίτης
  choice: raia
  rationale: Neno hili linaonyesha hadhi ya kiraia, si ukaaji tu.
- source_word: οὐκ ἀσήμου πόλεως
  choice: wa mji usio duni
  rationale: Tafsiri hii huhifadhi usemi wa Kigiriki wa kukanusha kinyume (‘si duni’) badala ya kuugeuza moja kwa moja kuwa ‘mji muhimu’.
- source_word: δέομαι
  choice: ninakusihi
  rationale: ‘Ninakusihi’ huonyesha ombi la dhati lenye nguvu kuliko ‘ninakuomba’ bila kuwa la kale au kupita kiasi.
- source_word: ἐπίτρεψόν μοι
  choice: uniruhusu
  rationale: Hili ni ombi la heshima kwa mwenye mamlaka na ni la kawaida katika Kiswahili cha sasa.
- source_word: λαλῆσαι πρὸς τὸν λαόν
  choice: nizungumze na watu hawa
  rationale: ‘Nizungumze’ inafaa katika muktadha wa kuhutubia hadharani; ‘watu hawa’ huonyesha kundi lililokuwapo katika tukio bila kulibana kuwa umati tu.
- source_word: μέν
  choice: msisitizo unaodokezwa katika ‘Mimi ni Myahudi’
  rationale: Chembe hii inaongeza msisitizo katika kujitambulisha. Kuongeza ‘kwa kweli’ kungeweza kusikika kama anakanusha shaka fulani; Kiswahili huwasilisha msisitizo huo kiasili kwa kiwakilishi ‘Mimi’.
theological_decisions:
- issue: Maana ya Ἰουδαῖος katika muktadha huu
  choice: Myahudi
  alternative: mtu wa Uyahudi
  rationale: Paulo anataja kando Tarso ya Kilikia kuwa mahali anapotoka. Kwa hiyo, hapa Ἰουδαῖος inaeleweka zaidi kama utambulisho wa kikabila na kidini, si dai kwamba anatoka eneo la Uyahudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wa jumla, huku ‘mji usio duni’ ukihifadhi usemi wa kukanusha kinyume uliomo katika Kigiriki.
