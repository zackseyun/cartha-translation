translation:
  language: sw
  text: Tulipokuwa tukikaa huko kwa siku kadhaa, nabii mmoja aitwaye Agabo akashuka kutoka Yudea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: Tulipokuwa tukikaa huko
  rationale: Kirai cha kisarufi cha genitivi huru chenye maana ya wakati; mhusika anayeeleweka kutokana na muktadha ni msimulizi na wenzake. ‘Tulipokuwa tukikaa huko’ kinaonyesha kuendelea kukaa mahali palipotajwa.
- source_word: δὲ
  choice: kimewakilishwa katika ‘Tulipokuwa’
  rationale: δέ ni kiunganishi hafifu cha mpito, lakini hapa kinaungana kiasili na maana ya wakati ya kirai tangulizi; Kiswahili hakihitaji kiunganishi kingine tofauti.
- source_word: ἡμέρας πλείους
  choice: kwa siku kadhaa
  rationale: Ni usemi wa muda. Ingawa πλείους kimsingi inaweza kumaanisha ‘zaidi,’ hapa kwa kawaida humaanisha idadi fulani ya siku za ziada; ‘siku kadhaa’ ni Kiswahili cha asili kisichotia idadi isiyokuwamo.
- source_word: κατῆλθέν
  choice: akashuka
  rationale: Linahifadhi taswira ya mwelekeo ya κατέρχομαι na mtiririko wa masimulizi kupitia kiambishi ‘ka-’.
- source_word: τις
  choice: mmoja
  rationale: Kiwakilishi kisichobainisha humtambulisha mhusika mpya; ‘nabii mmoja’ huhifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: kutoka Yudea
  rationale: Ni uwasilishaji wa moja kwa moja wa asili na mahali alikotoka; ‘Yudea’ ni umbo la kawaida la jina la eneo hilo katika Kiswahili.
- source_word: προφήτης
  choice: nabii
  rationale: Ni neno la kawaida na linaloeleweka kwa jukumu la kinabii linalotajwa wazi katika simulizi.
- source_word: ὀνόματι Ἅγαβος
  choice: aitwaye Agabo
  rationale: ὀνόματι ni nahau ya kumtaja mtu kwa jina; ‘aitwaye Agabo’ ni Kiswahili cha asili na chenye hadhi.
