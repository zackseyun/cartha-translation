  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: sw
  text: Siku iliyofuata tuliondoka, tukafika Kaisaria. Tukaingia nyumbani kwa Filipo mwinjilisti, aliyekuwa mmoja wa wale saba[a], tukakaa kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, alikuwa mmoja wa wanaume saba waliokuwa wameteuliwa hapo awali kwa ajili ya huduma huko Yerusalemu (tazama Matendo 6:3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Kesho yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mfuatano wa simulizi kwa ufupi na kwa kawaida.
- source_word: ἐξελθόντες
  choice: tuliondoka
  rationale: Katika simulizi la safari, kitenzi hiki kinaonyesha kuondoka mahali walipokuwa; ‘tuliondoka’ ni wazi na cha kawaida.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: tukafika Kaisaria
  rationale: Muundo huu unaonyesha kufika katika mahali walikokusudia. ‘Tukafika’ huunganisha hatua hiyo kwa kawaida na kuondoka kulikotangulia.
- source_word: Καισάρειαν
  choice: Kaisaria
  rationale: Huu ni uandishi wa kawaida wa jina hili la mahali katika Kiswahili.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: Tukaingia nyumbani
  rationale: ‘Nyumbani’ ni usemi wa asili katika muktadha wa kuingia na kukaribishwa katika makao ya mtu, bila kupoteza maana ya οἶκος.
- source_word: Φιλίππου
  choice: Filipo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: mwinjilisti
  rationale: Ni neno la Kiswahili linalotambulika kwa mtu anayehubiri habari njema na linadumisha sifa au huduma inayotajwa na εὐαγγελιστής.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: aliyekuwa mmoja wa wale saba
  rationale: Muundo huu unatambulisha uhusiano wa kihistoria wa Filipo na wale saba bila kuufanya kuwa jina rasmi la cheo.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: tukakaa kwake
  rationale: Katika muktadha wa ukarimu kwa wasafiri, usemi huu unaeleza kwa kawaida kukaa katika makao ya Filipo.
theological_decisions:
- issue: Utambulisho wa Filipo kuwa mmoja wa wale saba
  choice: aliyekuwa mmoja wa wale saba
  alternative: aliyekuwa mmoja wa kundi rasmi la ‘Wale Saba’
  rationale: Andiko linaelekea kurejelea wanaume saba wa Matendo 6, lakini halifafanui hapa cheo maalumu cha kikanisa. Tafsiri inadumisha rejeleo hilo bila kuingiza muundo wa baadaye wa uongozi wa kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi vinavyofuatana—‘tuliondoka, tukafika; tukaingia … tukakaa’—unadumisha mwendo wa simulizi la Kigiriki kwa lugha ya kawaida. Alama ya tanbihi imewekwa baada ya ‘wale saba’, sehemu inayofafanuliwa na tanbihi.
