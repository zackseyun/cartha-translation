  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: sw
  text: Ndipo Paulo akajibu, “Mnafanya nini hivi—mnalia na kuuvunja moyo wangu[a]? Kwa maana niko tayari si kufungwa tu, bali hata kufa huko Yerusalemu kwa ajili ya jina la Bwana Yesu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuuponda moyo wangu.” Kitenzi cha Kigiriki kina nguvu kuliko kueleza huzuni ya kawaida; kinaonyesha kuvunjika au kupondwa kwa ndani.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya Bwana Yesu.” Katika Biblia, “jina” humrejelea Yesu mwenyewe, mamlaka yake, na kazi inayohusishwa naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni kitenzi cha kawaida cha kusimulia jibu katika mazungumzo; “akajibu” ni cha asili na chenye hadhi katika Kiswahili.
- source_word: Τί ποιεῖτε
  choice: Mnafanya nini hivi
  rationale: Kinahifadhi muundo wa swali la Kigiriki na hisia ya Paulo ya kupinga kitendo chao, huku “hivi” ikifanya usemi uwe wa kawaida katika Kiswahili.
- source_word: κλαίοντες
  choice: mnalia
  rationale: Huwasilisha kitendo kinachoendelea cha kulia kwa lugha ya kawaida na yenye uzito unaofaa muktadha.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: kuuvunja moyo wangu
  rationale: Ni nahau ya asili ya Kiswahili inayohifadhi sitiari ya moyo kuvunjwa na kuonyesha maumivu makali ya ndani.
- source_word: δεθῆναι
  choice: kufungwa
  rationale: Huhifadhi maana ya moja kwa moja ya hali tendwa ya δέω bila kuipanua kuwa “kufungwa gerezani.”
- source_word: ἀποθανεῖν
  choice: kufa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi hiki.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Katika Kiswahili, mahali pa tukio baada ya “kufungwa” na “kufa” panaweza kutajwa bila kihusishi; maana ya kwamba mateso yatatokea Yerusalemu inabaki wazi.
- source_word: ἑτοίμως ἔχω
  choice: niko tayari
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza hali ya kuwa tayari.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: kwa ajili ya jina
  rationale: Inahifadhi nahau ya kibiblia “jina” badala ya kuifafanua kwa namna nyembamba kama “kwa ajili ya sifa” au kuiondoa kabisa.
- source_word: κυρίου Ἰησοῦ
  choice: Bwana Yesu
  rationale: “Bwana” huhifadhi κύριος kama cheo cha Kikristo kinachomhusu Yesu na ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Kutafsiri κύριος inapomhusu Yesu
  choice: Bwana Yesu
  alternative: Mkuu Yesu
  rationale: “Bwana” huhifadhi uzito wa cheo cha κύριος na matumizi yake ya Kikristo bila kukidhoofisha au kukifafanua kupita kiasi.
- issue: Kuhifadhi nahau ya “jina”
  choice: kwa ajili ya jina la Bwana Yesu
  alternative: kwa ajili ya Bwana Yesu
  rationale: Matini inataja “jina,” ambalo kwa mtindo wa kibiblia humwakilisha Yesu mwenyewe, mamlaka yake, na kazi inayohusishwa naye. Kulihifadhi kunaacha uzito huo wa kitheolojia bila kuubana kuwa maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali umehifadhiwa kwa ukaribu, lakini alama ya mkato imetumiwa ili mfululizo wa vitenzi usikike kwa asili. Nahau za “kuuvunja moyo” na “kwa ajili ya jina” zimehifadhi picha na uzito wa matini ya Kigiriki.
