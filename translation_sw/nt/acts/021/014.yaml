  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: sw
  text: Kwa kuwa hakukubali kushawishiwa, tulinyamaza, tukasema, “Mapenzi ya Bwana yatendeke.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Kwa kuwa hakukubali kushawishiwa
  rationale: Kirai hiki cha hali huru ya jenitivi kinaonyesha kwamba Paulo hakulegeza msimamo wake wala kukubali maombi yao. ‘Hakukubali kushawishiwa’ huhifadhi wazo la kushawishiwa bila kuongeza tafsiri ya ‘hakutaka kusikiliza.’
- source_word: ἡσυχάσαμεν
  choice: tulinyamaza
  rationale: Kitenzi hiki hapa kina maana ya kuacha kuendelea kusisitiza jambo na kuwa kimya. ‘Tulinyamaza’ ni Kiswahili cha kawaida na chenye heshima, huku kikihifadhi mabadiliko yanayoonyeshwa na aoristi.
- source_word: εἰπόντες
  choice: tukisema
  rationale: Umbo la kushirikisha la aoristi linaunganishwa kwa kawaida na kitenzi kikuu kwa ‘tukisema,’ likionyesha maneno waliyosema waliponyamaza.
- source_word: Τοῦ κυρίου
  choice: ya Bwana
  rationale: ‘Bwana’ ni tafsiri ya kawaida ya κύριος; muundo ‘ya Bwana’ unaonyesha umilikaji bila kumtaja wazi zaidi anayerejelewa kuliko Kigiriki kilivyofanya.
- source_word: τὸ θέλημα
  choice: Mapenzi
  rationale: ‘Mapenzi’ ni neno la kawaida la Kiswahili kwa nia au kusudi la mtu, na linafaa katika kauli hii ya kujisalimisha kwa uamuzi wa Bwana.
- source_word: γινέσθω
  choice: yatendeke
  rationale: ‘Yatendeke’ huwasilisha amri ya nafsi ya tatu inayoonyesha kukubali kwamba mapenzi ya Bwana yawe kweli, kwa mtindo wa asili wa kibiblia wa Kiswahili.
theological_decisions:
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: ‘Bwana’ ndiyo tafsiri ya kawaida na inayofaa ya κύριος katika muktadha huu. Ingawa simulizi linaelekea kumrejelea Bwana Yesu, tafsiri haiongezi jina ambalo halipo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi mfuatano wa hoja ya Kigiriki bila kuwa ngumu, na kauli ya mwisho ina mtindo wa kawaida wa kujisalimisha kwa mapenzi ya Mungu.
