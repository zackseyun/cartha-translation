  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alipofika kwenye ngazi, ilibidi askari wambebe.” Usemi wa Kiyunani unaweza kusisitiza ulazima uliotokana na vurugu za umati.
