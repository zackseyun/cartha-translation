lexical_decisions:
- source_word: ὅτε δὲ
  choice: Alipofika
  rationale: Muundo wa wakati unaingizwa kwa kawaida katika kitenzi cha Kiswahili; δέ ni kiunganishi chepesi ambacho hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: Alipofika kwenye ngazi
  rationale: γίνομαι pamoja na ἐπί na hali ya accusative hapa humaanisha kufika mahali; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἀναβαθμούς
  choice: ngazi
  rationale: Neno hili hurejelea hatua au ngazi za kupandia; katika muktadha huu ni ngazi zinazoelekea kwenye kambi ya askari.
- source_word: συνέβη βαστάζεσθαι
  choice: ilibidi ... wambebe
  rationale: Ingawa kihalisi ni ‘ilitokea kubebwa,’ muundo mzima unaonyesha hali iliyosababishwa na msukumo mkali wa umati. ‘Ilibidi’ huwasilisha matokeo hayo kwa Kiswahili cha kawaida bila kudai amri ya nje.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: askari wambebe
  rationale: Kiswahili cha kawaida hupendelea muundo tendaji hapa; askari wanabaki kuwa watendaji wale wale waliotajwa katika muundo wa Kiyunani wa kutendwa.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: kwa sababu ya fujo za umati
  rationale: διά na accusative huonyesha sababu. βία hapa ni nguvu au vurugu ya kundi; ‘fujo’ ni neno la kawaida linalofaa tukio hili, huku ‘umati’ likihifadhi maana ya ὄχλος bila kuiongezea tafsiri ya ‘genge.’
