id: ACT.21.37
reference: Acts 21:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: sw
  text: Paulo alipokuwa karibu kuingizwa ndani ya kambi ya askari[a], akamwambia mkuu wa jeshi[b], “Je, ninaruhusiwa kusema nawe jambo?” Yule mkuu akasema, “Unajua Kigiriki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kambi ya askari” hapa inamaanisha makao ya jeshi la Roma, huenda ndani ya ngome.
    reason: cultural_note
  - marker: b
    text: Kigiriki kinatumia cheo cha afisa wa jeshi la Roma aliyekuwa mkuu wa kikosi kikubwa.
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: alipokuwa karibu kuingizwa
  rationale: Muundo huu unaonyesha tendo lililokuwa karibu kutokea, huku hali ya kutendwa ya εἰσάγεσθαι ikihifadhiwa.
- source_word: παρεμβολή
  choice: kambi ya askari
  rationale: Katika muktadha huu wa Yerusalemu, neno hilo linamaanisha makao ya jeshi la Roma, huenda ndani ya eneo la ngome; “kambi ya askari” ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: χιλίαρχος
  choice: mkuu wa jeshi
  rationale: Neno hilo linamtaja afisa wa Roma aliyekuwa na amri juu ya kikosi kikubwa. “Mkuu wa jeshi” ni tafsiri inayoeleweka bila kutumia cheo cha kihistoria kisichofahamika kwa wengi.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: Je, ninaruhusiwa kusema nawe jambo?
  rationale: ἔξεστιν huonyesha ruhusa. Tafsiri hii inahifadhi swali la heshima na ni ya asili katika Kiswahili.
- source_word: τι
  choice: jambo
  rationale: Kiwakilishi hiki kisichobainisha kitu kinamaanisha “kitu/jambo fulani”; “jambo” kinafaa katika ombi hili la kusema.
- source_word: Ἑλληνιστί γινώσκεις
  choice: Unajua Kigiriki?
  rationale: Kifungu hiki kinauliza kama Paulo anaijua lugha ya Kigiriki; tafsiri hii ni fupi, ya kawaida, na inabaki karibu na γινώσκεις.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mazungumzo yametafsiriwa kwa mtindo wa kawaida bila kupoteza maana ya ruhusa wala mazingira ya kijeshi.
