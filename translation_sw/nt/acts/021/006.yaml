lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: kuagana sisi kwa sisi
  rationale: Katika muktadha huu wa kuondoka, kitenzi pamoja na kiwakilishi cha kutendeana kinaonyesha kuagana. Usemi huu ni wa kawaida na unadumisha maana ya kutendeana.
- source_word: ἐνέβημεν
  choice: tukapanda
  rationale: Kitenzi kina maana ya kuingia au kupanda chombo cha majini; “kupanda melini” ni usemi wa kawaida wa Kiswahili.
- source_word: πλοῖον
  choice: meli
  rationale: Neno linaweza kumaanisha mashua au meli; katika simulizi hili la safari ya baharini, “meli” linafaa na ni la kawaida.
- source_word: ὑπέστρεψαν
  choice: wakarudi
  rationale: Huwasilisha moja kwa moja mwendo wa kurudi na kufuatana kwa matukio katika simulizi.
- source_word: εἰς τὰ ἴδια
  choice: kwao
  rationale: Usemi huu wa Kigiriki humaanisha mahali pao wenyewe au nyumbani kwao. “Kwao” ni tafsiri fupi na ya asili inayohifadhi uwezekano huo bila kulazimisha wazo la nyumba binafsi.
