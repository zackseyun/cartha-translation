  text: Baada ya kuagana[a], tukapanda melini, nao wakarudi kwao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kusalimiana.” Usemi wa Kigiriki unaweza kutumiwa kwa kusalimiana au kuagana; muktadha wa kuondoka unaunga mkono maana ya kuagana.
    reason: lexical_alternative
