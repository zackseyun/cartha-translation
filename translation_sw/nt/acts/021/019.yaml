  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: sw
  text: Baada ya kuwasalimu, aliwaeleza kwa undani, moja baada ya jingine, mambo ambayo Mungu aliyafanya miongoni mwa watu wa Mataifa[a] kupitia huduma yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa mataifa.” Katika muktadha huu, usemi huo unarejelea watu wasio Wayahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Baada ya kuwasalimu
  rationale: Kirai hiki kinaonyesha tendo lililotangulia kusimulia; tafsiri hii ni ya asili katika Kiswahili na inadumisha mfuatano wa matendo.
- source_word: ἐξηγεῖτο
  choice: aliwasimulia kwa kina
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha usimulizi ulioendelea, na maana yake hapa ni kueleza au kusimulia kwa undani.
- source_word: καθ’ ἓν ἕκαστον
  choice: jambo moja baada ya jingine
  rationale: Nahau hii ina nguvu ya mgawanyo, ikionyesha kwamba Paulo alitoa taarifa kipengele kwa kipengele.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: mambo ambayo Mungu alikuwa amefanya
  rationale: Tafsiri inadumisha Mungu kama mtendaji mkuu na inaonyesha kwamba matendo hayo yalitangulia taarifa ya Paulo.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: miongoni mwa watu wa mataifa
  rationale: Katika muktadha huu neno hilo linarejelea watu wasio Wayahudi; usemi huu ni wazi huku ukidumisha uhusiano wake na maana ya ‘mataifa.’
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: kupitia huduma yake
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au chombo; huduma ya Paulo ndiyo njia ambayo Mungu alitenda.
theological_decisions:
- issue: Utendaji katika taarifa ya umishonari ya Paulo
  choice: Mungu anaonyeshwa kuwa mtendaji, na huduma ya Paulo kuwa njia ambayo Mungu alitumia.
  alternative: Paulo ndiye aliyekuwa amefanikisha mambo hayo miongoni mwa watu wa mataifa.
  rationale: Maneno ὧν ἐποίησεν ὁ θεὸς yanamtaja Mungu waziwazi kama mtendaji, huku διὰ τῆς διακονίας αὐτοῦ yakionyesha huduma ya Paulo kuwa chombo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Huduma’ limetumiwa kwa maana pana ya utumishi wa Paulo, bila kudokeza cheo maalumu cha kikanisa.
