id: ACT.21.20
reference: Acts 21:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: sw
  text: Waliposikia hayo, wakamtukuza Mungu, kisha wakamwambia, “Ndugu, unaona jinsi kulivyo na maelfu kwa maelfu[a] ya Wayahudi[b] ambao wameamini, nao wote wana bidii kubwa kwa ajili ya Sheria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makumi ya maelfu.” Neno la Kigiriki μυριάδες linaweza kumaanisha vikundi vya elfu kumi au, kwa ujumla zaidi, idadi kubwa sana.
    reason: lexical_alternative
  - marker: b
    text: Au, “watu wa Yudea,” ikiwa neno hili linaeleweka kwa maana ya kijiografia badala ya maana ya kikabila na kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Waliposikia hayo
  rationale: Kirai cha wakati kinaonyesha tendo lililotangulia; ‘hayo’ linarejelea kwa kawaida taarifa ya Paulo katika muktadha uliotangulia.
- source_word: ἐδόξαζον
  choice: wakamtukuza
  rationale: ‘Kumtukuza Mungu’ huhifadhi maana ya kumpa Mungu utukufu na ni usemi wa kawaida wa Kiswahili cha Biblia.
- source_word: εἶπόν τε αὐτῷ
  choice: kisha wakamwambia
  rationale: Huendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida bila kuongeza maana mpya.
- source_word: Θεωρεῖς
  choice: unaona
  rationale: Ni mwito wa moja kwa moja kwa Paulo aangalie hali iliyo dhahiri.
- source_word: ἀδελφέ
  choice: Ndugu
  rationale: Ni umoja wa kumwita Paulo, mwanaume mahususi, kwa lugha ya udugu wa waamini.
- source_word: πόσαι μυριάδες
  choice: jinsi kulivyo na maelfu kwa maelfu
  rationale: ‘Maelfu kwa maelfu’ ni usemi wa asili unaoonyesha idadi kubwa sana bila kulazimisha μυριάδες kuwa hesabu sahihi ya makumi ya maelfu.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: ya Wayahudi
  rationale: Katika muktadha huu neno linaelekea kutaja jamii ya Kiyahudi yenye waamini wengi, si eneo la Yudea pekee.
- source_word: τῶν πεπιστευκότων
  choice: ambao wameamini
  rationale: Wakati timilifu wa Kigiriki unaonyesha waliokuja kuamini na wanaoendelea kuwa katika hali hiyo.
- source_word: ζηλωταὶ τοῦ νόμου
  choice: wana bidii kubwa kwa ajili ya Sheria
  rationale: Huonyesha kujitoa kwa nguvu kwa Sheria ya Musa bila kutumia neno lisilo la kawaida au lenye maana potofu ya wivu.
- source_word: ὑπάρχουσιν
  choice: wana
  rationale: Katika kishazi hiki kitenzi hufanya kazi kama kiunganishi cha hali na kwa kawaida huwakilishwa ndani ya ‘wana bidii’.
theological_decisions:
- issue: Maana ya ἐν τοῖς Ἰουδαίοις
  choice: Wayahudi
  alternative: watu wa Yudea
  rationale: Muktadha unasisitiza utambulisho wa Kiyahudi na bidii kwa Sheria ya Musa; hata hivyo, maana ya kijiografia inawezekana na imehifadhiwa katika tanbihi.
- issue: Nguvu ya μυριάδες
  choice: maelfu kwa maelfu
  alternative: makumi ya maelfu
  rationale: Neno la Kigiriki linaweza kumaanisha vikundi vya elfu kumi au, kwa upana zaidi, idadi kubwa sana. Tafsiri kuu huhifadhi upana huo, na maana mahususi zaidi inawekwa katika tanbihi.
- issue: Rejeleo la τοῦ νόμου
  choice: Sheria
  alternative: sheria
  rationale: Herufi kubwa humsaidia msomaji kutambua kwamba hapa inarejelewa Sheria ya Musa, bila kuingiza msimamo wa dhehebu kuhusu nafasi yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku ‘maelfu kwa maelfu’ ukihifadhi msisitizo na kutokamilika kwa hesabu ya Kigiriki. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
