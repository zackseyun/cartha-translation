  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: sw
  text: Lakini wamejulishwa habari zako kwamba unawafundisha Wayahudi wote wanaoishi miongoni mwa Mataifa wamwache Musa[a][b], ukiwaambia wasiwatahiri watoto wao wala wasiishi kwa kufuata desturi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uasi dhidi ya Musa.” Kigiriki kimetumia nomino ἀποστασία, yenye maana ya kuasi, kujitenga, au kuacha.
    reason: lexical_alternative
  - marker: b
    text: “Musa” hapa anawakilisha sheria ya Musa na desturi za jadi za Kiyahudi.
    reason: cultural_note
  - marker: c
    text: Au, “wala wasienende kulingana na desturi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: wamejulishwa
  rationale: Katika muktadha huu kitenzi cha kutendwa kinaonyesha kwamba watu wamepewa taarifa kwa mdomo kuhusu Paulo; wakati timilifu unaonyesha taarifa hiyo bado ina umuhimu katika hali ya sasa.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: wamwache Musa
  rationale: Nomino ἀποστασία ina maana ya kuasi, kujitenga, au kuacha. Muundo wa kitenzi 'wamwache Musa' ni wa kawaida katika Kiswahili na unaonyesha nguvu ya shtaka bila kuifanya istilahi rasmi ya kiteolojia.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: Wayahudi wote wanaoishi miongoni mwa Mataifa
  rationale: Kirai hiki kinawahusu Wayahudi waliotawanyika na kuishi kati ya watu wa mataifa mengine; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: λέγων
  choice: ukiwaambia
  rationale: Kishirikishi hiki kinafafanua namna au yaliyomo katika fundisho linalodaiwa; 'ukiwaambia' kinaunganisha kwa kawaida shtaka hilo na maagizo yanayofuata.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: wasiwatahiri watoto wao
  rationale: αὐτούς inaleta dhana ya umilikaji pamoja na τὰ τέκνα. 'Watoto wao' huhifadhi neno pana la Kigiriki badala ya kulibana kuwa 'wana wao,' ingawa tohara ilihusu watoto wa kiume.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: wala wasiishi kwa kufuata desturi hizo
  rationale: περιπατεῖν kwa sitiari humaanisha kuendesha maisha. Kiswahili cha 'kuishi kwa kufuata' kinafikisha maana hiyo kwa uwazi, huku 'desturi hizo' zikirejelea desturi za Kiyahudi zilizotajwa katika muktadha.
theological_decisions:
- issue: Asili ya shtaka dhidi ya Paulo kuhusu Musa na sheria
  choice: Kuliwasilisha kama shtaka kwamba Paulo anawafundisha Wayahudi 'wamwache Musa,' bila kuthibitisha kwamba shtaka hilo ni kweli.
  alternative: Kufundisha uasi dhidi ya Musa; kuacha sheria ya Musa.
  rationale: Aya inaripoti habari ambayo watu walikuwa wamepewa kuhusu Paulo, si hitimisho la moja kwa moja la Luka. Tafsiri inadumisha nguvu na mvutano wa shtaka bila kuingiza uamuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Mataifa' imetumiwa kwa maana ya watu wasio Wayahudi katika muktadha wa Agano Jipya. Sitiari ya Kigiriki ya 'kutembea' imewekwa wazi katika matini kuu kama 'kuishi kwa kufuata,' huku tafsiri ya karibu zaidi ikiwekwa katika tanbihi.
