id: ACT.21.26
reference: Acts 21:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: sw
  text: Ndipo Paulo akawachukua wale wanaume, na siku iliyofuata akajitakasa pamoja nao. Kisha akaingia katika Hekalu[a], akitoa taarifa kuhusu kukamilika kwa siku za utakaso, hadi sadaka ilipotolewa[b] kwa ajili ya kila mmoja wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki hapa linamaanisha eneo lote la Hekalu, si sehemu takatifu ya ndani pekee.
    reason: lexical_alternative
  - marker: b
    text: Au, “ilipoletwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: akawachukua
  rationale: Kitenzi hiki kinaonyesha kwamba Paulo aliwachukua wanaume hao akaenda nao; “akawachukua” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza maelezo yasiyomo.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: siku iliyofuata
  rationale: Ni usemi wa kawaida wa Kiswahili kwa siku inayofuata mara moja.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: akajitakasa pamoja nao
  rationale: “Akajitakasa” huwasilisha tendo la utakaso wa kiibada na maana ya kujihusisha mwenyewe katika tendo hilo; “pamoja nao” huhifadhi uandamani.
- source_word: εἰσῄει
  choice: akaingia
  rationale: Ingawa hali isiyotimilika ya Kigiriki inaweza kudokeza tendo linaloendelea au linalorudiwa, katika simulizi hili “akaingia” ni ya asili zaidi kwa Kiswahili na haiondoi hatua kuu ya simulizi.
- source_word: τὸ ἱερόν
  choice: eneo la Hekalu
  rationale: ἱερόν humaanisha eneo lote la Hekalu, si patakatifu pa ndani pekee; “eneo la Hekalu” linaweka tofauti hiyo wazi kwa msomaji wa Kiswahili.
- source_word: διαγγέλλων
  choice: akitoa taarifa
  rationale: Muktadha unaonyesha taarifa rasmi kuhusu utaratibu na muda wa utakaso; “akitoa taarifa” ni wazi na wa asili.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: kuhusu kutimia kwa siku za utakaso
  rationale: Huhifadhi usemi rasmi unaohusu kufikia mwisho wa kipindi kilichowekwa cha utakaso.
- source_word: ἕως οὗ
  choice: hadi
  rationale: Huhifadhi mpaka wa wakati ulioelezwa na Kigiriki bila kuufafanua zaidi ya maandishi.
- source_word: προσηνέχθη
  choice: itakapotolewa
  rationale: Katika muktadha wa kiibada, προσφέρω humaanisha kutoa au kuwasilisha sadaka; “kutolewa” ni usemi wa kawaida wa Kiswahili kwa sadaka na huhifadhi hali tendwa.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: kwa ajili ya kila mmoja wao
  rationale: Huwasilisha wazi kwamba sadaka ilihusiana na kila mtu mmoja mmoja kwa niaba au manufaa yake.
- source_word: ἡ προσφορά
  choice: sadaka
  rationale: Ni neno la kawaida na pana la Kiswahili kwa kitu kinachotolewa katika ibada, bila kulibana kuwa aina maalumu ya dhabihu.
theological_decisions:
- issue: Maana ya ushiriki wa Paulo katika taratibu za utakaso wa Hekalu
  choice: Kusimulia tendo hilo moja kwa moja bila kulisifu wala kulikataa kitheolojia
  alternative: Kutafsiri kwa namna inayoonyesha kwamba Paulo aliidhinisha au alikataa kuendelea kwa taratibu za Hekalu kwa waamini
  rationale: Aya hii inasimulia tukio, lakini yenyewe haitoi uamuzi kuhusu mijadala mipana ya sheria, agano, au desturi za Kiyahudi.
- issue: Uhusiano wa ἕως οὗ na taarifa kuhusu kukamilika kwa utakaso
  choice: Kuhifadhi mfuatano wa maandishi kwa “hadi sadaka itakapotolewa”
  alternative: Kufafanua kwamba Paulo alitoa taarifa mapema kuhusu tarehe ambayo utakaso ungekamilika na sadaka ingetolewa
  rationale: Muundo wa Kigiriki una sintaksia yenye mvutano na unaweza kueleweka kwa zaidi ya njia moja; tafsiri haipaswi kuondoa kabisa utata huo kwa kuongeza ufafanuzi usio wazi katika aya.
- issue: Hali ya kitenzi εἰσῄει
  choice: Kutumia “akaingia” katika simulizi
  alternative: Kutumia “akawa akiingia” ili kuonyesha wazi hali isiyotimilika
  rationale: “Akaingia” ni ya kawaida na yenye hadhi katika simulizi la Kiswahili. Hali isiyotimilika ya Kigiriki inaweza kuashiria mwendelezo, lakini muktadha hautoshi kuthibitisha kwamba tendo lilirudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Eneo la Hekalu” limetumiwa kwa usahihi wa kihistoria, na muundo wa mwisho umeacha mvutano wa kisintaksia wa Kigiriki bila kuuingiza katika mfumo fulani wa mafundisho.
