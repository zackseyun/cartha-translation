translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa swali umewekwa wa kawaida katika Kiswahili, huku nguvu ya hitimisho, umaalumu wa Mmisri na kundi la watu elfu nne, pamoja na maana pana ya eneo la nyika vikihifadhiwa.
