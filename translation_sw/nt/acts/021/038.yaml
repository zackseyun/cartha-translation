  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: sw
  text: Basi, je, wewe si yule Mmisri ambaye siku chache zilizopita alichochea uasi na kuwaongoza wale wanaume elfu nne waliokuwa wauaji wa kisiri[a] kwenda nyikani?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaume wa majambia”; Kigiriki, “Sicarii,” jina la kundi lililojulikana kwa mashambulizi kwa visu vifupi vilivyofichwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Basi, wewe si
  rationale: Muundo huu ni swali linalotoa hitimisho kutokana na Paulo kusema Kigiriki; “Basi” huonyesha mantiki hiyo kwa Kiswahili cha kawaida.
- source_word: ὁ Αἰγύπτιος
  choice: yule Mmisri
  rationale: Kibainishi humrejelea mtu fulani aliyejulikana; “yule Mmisri” huwasilisha urejeo huo wazi na kwa kawaida.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: siku chache zilizopita
  rationale: Nahau hiyo inaonyesha muda mfupi kabla ya wakati wa mazungumzo bila kutaja idadi kamili ya siku.
- source_word: ἀναστατώσας
  choice: alianzisha uasi
  rationale: Katika muktadha wa kisiasa, kitenzi kinaonyesha kuchochea ghasia au maasi, si kuvuruga tu.
- source_word: ἐξαγαγὼν
  choice: kuwaongoza ... kwenda
  rationale: Kitenzi kishirikishi kinaeleza kuwaongoza watu kutoka mahali fulani kuelekea nyikani; Kiswahili hiki ni cha kawaida bila kuongeza mahali walikotoka.
- source_word: εἰς τὴν ἔρημον
  choice: kwenda nyikani
  rationale: ἔρημος ni eneo lisilokaliwa au la nyika, si lazima jangwa la mchanga; “nyikani” huhifadhi upana huo.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: wale watu elfu nne
  rationale: Kibainishi kinaonyesha kundi maalumu lililohusishwa na Mmisri huyo; “wale” huhifadhi umaalumu huo.
- source_word: τῶν σικαρίων
  choice: wa kundi la wauaji wa kisiri
  rationale: Neno hilo linataja kundi lililojulikana kwa mashambulizi ya siri kwa visu vifupi. Tafsiri hii huwasilisha kazi yao kwa msomaji wa sasa, huku jina na maana halisi zaidi zikihifadhiwa katika tanbihi.
