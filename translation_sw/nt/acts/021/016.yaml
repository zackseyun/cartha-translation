  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: sw
  text: Baadhi ya wanafunzi kutoka Kaisaria pia waliandamana nasi, wakitupeleka kwa mtu mmoja aliyeitwa Mnasoni, wa Kipro, mwanafunzi wa tangu zamani,[a] ambaye tungekaa kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanafunzi wa siku za kwanza” au “mwanafunzi wa muda mrefu.” Maneno ya Kigiriki yanaweza kumaanisha kwamba Mnasoni alikuwa mwanafunzi tangu kipindi cha mapema au kwamba alikuwa amekuwa mwanafunzi kwa muda mrefu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ambaye tungepata malazi kwake.” Muundo wa Kigiriki unaweza kueleweka kuwa waliongozwa kwa Mnasoni au nyumbani kwake ili wapate malazi huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον ... σὺν ἡμῖν
  choice: waliandamana nasi
  rationale: Muunganiko huu unaonyesha kuwa wanafunzi hao walijiunga na kundi katika safari; “waliandamana nasi” ni Kiswahili cha kawaida na chenye heshima.
- source_word: τῶν μαθητῶν
  choice: baadhi ya wanafunzi
  rationale: Muundo wa kigawanyaji una maana ya baadhi kutoka miongoni mwa wanafunzi; “wanafunzi” ndilo neno la kawaida la Agano Jipya kwa μαθηταί.
- source_word: ἀπὸ Καισαρείας
  choice: kutoka Kaisaria
  rationale: Inaonyesha mahali walikotoka wanafunzi hao.
- source_word: ἄγοντες
  choice: wakitupeleka kwa
  rationale: 'Kitenzi kishirikishi kinaeleza kusudi au namna ya kuandamana: waliwaongoza wasafiri hadi kwa mwenyeji wao.'
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: ambaye tungekaa kwake
  rationale: Huwasilisha kusudi la kupokea malazi kwa lugha ya kawaida bila kulazimisha kama walikaa na Mnasoni mwenyewe au nyumbani kwake.
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: Mnasoni, mtu wa Kipro
  rationale: τινι humtambulisha mtu ambaye hajatajwa hapo awali, lakini katika Kiswahili “mtu mmoja aitwaye” lingekuwa zito hapa. “Mtu wa Kipro” ni ya asili zaidi kuliko kutumia jina la utaifa lisilozoeleka.
- source_word: ἀρχαίῳ μαθητῇ
  choice: mwanafunzi wa tangu zamani
  rationale: Huhifadhi uwezekano kwamba Mnasoni alikuwa mwanafunzi wa muda mrefu au tangu kipindi cha mapema, bila kudai kwamba alikuwa mmoja wa wanafunzi wa kwanza kabisa.
theological_decisions:
- issue: Maana ya ἀρχαίῳ μαθητῇ
  choice: mwanafunzi wa tangu zamani
  alternative: mwanafunzi wa siku za kwanza; mwanafunzi wa muda mrefu
  rationale: Kigiriki kinaweza kueleza mwanzo wa mapema au muda mrefu wa uanafunzi. Tafsiri hii huhifadhi upana huo na kuepuka madai ya kihistoria yasiyothibitishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Waliandamana nasi” huepuka urudiaji mzito wa “walikwenda pamoja nasi,” na “mtu wa Kipro” ni wazi kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini.
