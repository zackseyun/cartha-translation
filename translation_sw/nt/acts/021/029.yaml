base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: sw
  text: Kwa maana walikuwa wamemwona hapo awali Trofimo, Mwefeso, mjini pamoja na Paulo, nao walidhani kwamba Paulo alikuwa amemwingiza ndani ya eneo la Hekalu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki hapa linaweza kumaanisha eneo lote la Hekalu pamoja na nyua zake, si patakatifu pa ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: walikuwa wamemwona hapo awali
  rationale: Muundo huu unaonyesha kwamba walikuwa wamemwona kabla ya tukio linalosimuliwa; Kiswahili hiki kinahifadhi rejeleo hilo la wakati uliotangulia.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: Trofimo, Mw efeso
  rationale: Kivumishi Ἐφέσιον kinamtambulisha Trofimo kuwa mtu wa Efeso; “Mw efeso” ni umbo la Kiswahili linalotumika kwa mtu wa mahali hapo.
- source_word: ἐν τῇ πόλει
  choice: mjini
  rationale: Hapa πόλις ni Yerusalemu kama mazingira ya mji, tofauti na eneo la Hekalu.
- source_word: σὺν αὐτῷ
  choice: akiwa pamoja na Paulo
  rationale: Ingawa Kigiriki kinasema kihalisi “pamoja naye,” kumtaja Paulo huondoa utata wa kiwakilishi katika Kiswahili bila kubadili rejeleo lake la kimuktadha.
- source_word: ἐνόμιζον
  choice: walidhani
  rationale: Kitenzi hiki kinaonyesha hitimisho au dhana yao kutokana na walichokiona, wala si jambo walilojua kwa hakika.
- source_word: εἰς τὸ ἱερὸν
  choice: ndani ya eneo la Hekalu
  rationale: ἱερόν inaweza kutaja eneo lote la Hekalu na nyua zake, si patakatifu pa ndani pekee; “eneo la Hekalu” huwasilisha maana hiyo kwa usahihi na kwa lugha ya kawaida.
- source_word: εἰσήγαγεν
  choice: alikuwa amemwingiza
  rationale: Katika taarifa ya kile walichodhani, umbo hili la Kiswahili linaonyesha kuwa kitendo kilichodhaniwa kilikuwa kimetokea tayari.
theological_decisions:
- issue: Maana ya ἱερόν katika shtaka dhidi ya Paulo
  choice: eneo la Hekalu
  alternative: Hekalu; nyua za Hekalu
  rationale: Neno ἱερόν linahusu eneo la Hekalu kwa upana, tofauti na ναός, ambalo linaweza kuelekeza hasa kwenye jengo au patakatifu pa ndani. Tafsiri hii inadumisha usahihi wa kihistoria bila kudai kwamba Trofimo aliingizwa ndani ya patakatifu penyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa maana” kinadumisha kazi ya γάρ ya kueleza sababu; “walidhani” kinaonyesha kuwa hili lilikuwa hitimisho lao, si ukweli uliothibitishwa.
