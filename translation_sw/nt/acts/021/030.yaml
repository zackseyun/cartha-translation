  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: sw
  text: Mji wote ukafadhaika, na watu wakakusanyika kwa wingi.[a] Wakamkamata Paulo, wakamkokota mpaka nje ya eneo la Hekalu,[b] na mara moja milango ikafungwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu walikimbilia pamoja.” Usemi wa Kigiriki unaonyesha watu wengi wakikusanyika kwa ghafla.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki hapa linamaanisha eneo lote la Hekalu au nyua zake, si patakatifu pa ndani pekee.
    reason: cultural_note
  - marker: c
    text: Yaani milango ya kuingilia eneo la Hekalu; katika muktadha huu inaweza pia kuitwa malango.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: ukachafuka
  rationale: Katika muktadha huu kitenzi hiki kinaonyesha mji kuingiwa na taharuki au vurugu, si kusogea kimwili. ‘Ukachafuka’ ni usemi wa kawaida wa Kiswahili unaobeba wazo hilo.
- source_word: ἡ πόλις ὅλη
  choice: mji wote
  rationale: Huhifadhi kwa njia ya moja kwa moja ukubwa wa tukio uliotajwa katika Kigiriki.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: watu wakakusanyika kwa wingi
  rationale: συνδρομή huonyesha watu kukimbilia pamoja na kukusanyika kwa ghafla. Tafsiri hii ni ya asili na inadokeza mkusanyiko mkubwa bila kuingiza neno lisilohitajika kama ‘ghasia.’
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: wakamkamata Paulo
  rationale: Kirai hiki kinaonyesha kumshika Paulo kwa nguvu; ‘wakamkamata’ kinafaa kwa tukio la umati kumtia mikononi.
- source_word: εἷλκον
  choice: wakamkokota
  rationale: Kitenzi hiki ni cha wakati usiotimilika katika Kigiriki na kinaonyesha tendo lililokuwa likiendelea; katika simulizi ya Kiswahili ‘wakamkokota’ huwasilisha tendo hilo kwa kawaida huku kikihifadhi ukali wa kumvuta kwa nguvu.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: mpaka nje ya eneo la Hekalu
  rationale: ἱερόν hapa ni eneo lote la Hekalu pamoja na nyua zake, wala si patakatifu pa ndani pekee. Kutaja ‘eneo’ huweka tofauti hiyo wazi katika matini.
- source_word: εὐθέως
  choice: mara
  rationale: ‘Mara’ ni njia fupi na ya kawaida ya kuonyesha kwamba jambo lilitokea papo hapo.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: milango ikafungwa
  rationale: θύραι inaweza kumaanisha milango ya kuingilia eneo la Hekalu. ‘Milango’ ni pana vya kutosha na ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mtindo wa simulizi umetumia mfululizo wa vitenzi vya ‘-ka-’ ili kuonyesha mwendo wa matukio kwa kawaida. ‘Hekalu’ limeandikwa kwa herufi kubwa kwa kuwa linarejelea Hekalu la Yerusalemu.
