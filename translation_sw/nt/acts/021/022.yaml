  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: sw
  text: Basi, tufanye nini? Bila shaka watasikia kwamba umekuja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “Basi, ni nini?” Usemi huo wa Kigiriki unauliza jambo la kufanya katika hali hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Basi, tufanye nini?
  rationale: Kihalisi ni ‘Basi, ni nini?’ lakini katika muktadha huu ni swali la kiidiomatiki kuhusu hatua inayopaswa kuchukuliwa. ‘Tufanye nini?’ ni Kiswahili cha kawaida kinachowasilisha nguvu hiyo bila kuongeza jibu.
- source_word: πάντως
  choice: Bila shaka
  rationale: Kielezi hiki hapa kinasisitiza uhakika wa jambo litakalotokea; ‘bila shaka’ ni usemi wa kawaida na wenye hadhi unaofaa katika utabiri huu.
- source_word: ἀκούσονται
  choice: watasikia
  rationale: Umbo la wakati ujao lina maana tendaji hapa. Kiima cha wingi hakitajwi wazi katika mstari huu, kwa hiyo tafsiri inadumisha hali hiyo kwa kutumia kiambishi cha wingi ‘wa-’ bila kukitambulisha zaidi.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya yale watakayosikia, si sababu.
- source_word: ἐλήλυθας
  choice: umekuja
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuja ambako matokeo yake yanaendelea—Paulo sasa yupo hapo. ‘Umekuja’ hudumisha maana hiyo vizuri kuliko ‘ulikuja.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na kinachoeleweka kwa urahisi. ‘Tufanye nini?’ ni ya asili zaidi kuliko tafsiri halisi ya muundo wa Kigiriki, huku tanbihi ikihifadhi mbadala huo. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
