id: ACT.21.11
reference: Acts 21:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: sw
  text: Naye akaja kwetu, akauchukua mshipi wa Paulo, akajifunga miguu na mikono yake mwenyewe, kisha akasema, “Roho Mtakatifu asema hivi:[b] ‘Hivi ndivyo Wayahudi huko Yerusalemu watakavyomfunga mtu ambaye mshipi huu ni wake[a], nao watamkabidhi mikononi mwa watu wa Mataifa.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye mshipi huu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Hivi ndivyo Roho Mtakatifu anavyosema.”
    reason: alternative_reading
lexical_decisions:
- source_word: ζώνην
  choice: mshipi
  rationale: Neno ζώνη linamaanisha mshipi au ukanda unaovaliwa kiunoni. “Mshipi” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: akajifunga miguu na mikono yake mwenyewe
  rationale: Kiwakilishi cha kujirejelea ἑαυτοῦ kinaonyesha kwamba Agabo alijifunga mwenyewe. Kitenzi “kujifunga” pia kinadumisha uhusiano na δήσουσιν, “watakavyomfunga,” baadaye katika mstari.
- source_word: Τάδε λέγει
  choice: asema hivi
  rationale: Huu ni mtindo wa kinabii wenye uzito wa Maandiko. “Asema hivi” ni wa heshima na wa kawaida katika Kiswahili, bila kupoteza mamlaka ya tamko.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa jina linalotumiwa katika maandishi ya Kigiriki.
- source_word: Τὸν ἄνδρα
  choice: mtu
  rationale: Katika muktadha huu ἀνήρ humrejelea Paulo kama mwanamume mmoja maalumu. “Mtu” ni usemi wa asili katika tamko hili la kinabii na haumwongezei mhusika jina ambalo Kigiriki hakilitaji hapa.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: ambaye mshipi huu ni wake
  rationale: Tafsiri hii inadumisha uhusiano wa umiliki unaoonyeshwa na οὗ huku ikiwa wazi katika Kiswahili cha kawaida.
- source_word: οὕτως
  choice: Hivi ndivyo
  rationale: Maneno haya yanaunganisha tendo la mfano la Agabo na utabiri unaofuata.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Kigiriki kinataja Wayahudi bila kuwabainisha kuwa viongozi pekee; kwa hiyo tafsiri haiongezi ubainishaji ambao haupo katika chanzo.
- source_word: παραδώσουσιν
  choice: watamtia
  rationale: Katika muundo “watamtia mikononi mwa,” kitenzi hiki kinaeleza kukabidhi mtu chini ya mamlaka ya wengine kwa Kiswahili cha asili.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: mikononi mwa watu wa mataifa
  rationale: “Mikononi mwa” inadumisha tamathali ya Kigiriki ya kuwekwa chini ya mamlaka ya wengine. Katika muktadha huu ἔθνη ni watu wasio Wayahudi, hivyo “watu wa mataifa” linafaa.
theological_decisions:
- issue: Kutafsiri kanuni ya kinabii kama maneno yenye mamlaka kutoka kwa Roho
  choice: Roho Mtakatifu asema hivi
  alternative: Hivi ndivyo Roho Mtakatifu asemavyo
  rationale: Muundo uliochaguliwa unadumisha mwangwi wa tamko la kinabii la Maandiko na dai la maandishi lenyewe bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Kirejeleo cha ἑαυτοῦ
  choice: Agabo alijifunga miguu na mikono yake mwenyewe
  alternative: Agabo alimfunga Paulo miguu na mikono
  rationale: Kiwakilishi cha kujirejelea kwa kawaida humrejelea mtendaji wa kitenzi, yaani Agabo; kwa hiyo tendo hilo ni ishara ya kinabii aliyoifanya juu yake mwenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Mpangilio wa tendo la kinabii na uhusiano kati ya kujifunga kwa Agabo na kufungwa kwa Paulo umehifadhiwa. Alama ya tanbihi [a] imewekwa kwenye kirai inachokifafanua, badala ya nafasi isiyolingana iliyoonekana katika safu ya mashauriano ya Kiingereza.
