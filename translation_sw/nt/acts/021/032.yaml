base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: sw
  text: Mara moja akawachukua askari na maakida wa mia, akakimbia kushuka kwenda kwao. Walipomwona jemadari mkuu[a] pamoja na askari, wakaacha kumpiga Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamanda wa kijeshi.” Neno la Kigiriki χιλίαρχος humaanisha afisa wa Kirumi aliyekuwa akiongoza kikosi cha wanajeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: Mara moja
  rationale: Huonyesha kwamba hatua ilichukuliwa bila kukawia na hudumisha uzito wa haraka wa simulizi.
- source_word: παραλαβὼν
  choice: akawachukua
  rationale: Katika muktadha huu inaonyesha mkuu huyo aliwachukua askari waende pamoja naye.
- source_word: στρατιώτας
  choice: askari
  rationale: Ni neno la kawaida na sahihi kwa wanajeshi mmoja mmoja katika Kiswahili cha sasa.
- source_word: ἑκατοντάρχας
  choice: majemadari wa vikosi vya askari mia
  rationale: Hufafanua cheo cha Kirumi kwa njia inayoeleweka bila kutegemea istilahi ya kigeni isiyofahamika kwa wasomaji wengi.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: akakimbia kushuka kwenda kwao
  rationale: Hudumisha kasi ya tendo na mwelekeo wa kushuka kutoka eneo la ngome kuelekea umati, bila kudokeza shambulio zaidi ya ushahidi wa kifungu.
- source_word: χιλίαρχον
  choice: mkuu wa jeshi
  rationale: Hutoa maana ya afisa mkuu wa Kirumi kwa Kiswahili cha kawaida; tanbihi inaeleza cheo hicho kwa usahihi zaidi.
- source_word: ἐπαύσαντο
  choice: wakaacha
  rationale: Hueleza kwa kawaida kwamba kitendo kilichokuwa kikiendelea kilikoma.
- source_word: τύπτοντες
  choice: kumpiga
  rationale: Katika muundo wa 'wakaacha kumpiga' kitenzi hiki huonyesha vipigo vilivyokuwa vikiendelea.
