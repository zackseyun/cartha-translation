  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: sw
  text: Siku iliyofuata, Paulo akaingia kwa Yakobo pamoja nasi, na wazee wote walikuwapo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazee wote wakafika.” Kitenzi cha Kigiriki kinaweza kukazia ama kufika kwao ama kuwapo kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: Siku iliyofuata
  rationale: Kirai hiki ni nahau ya wakati inayomaanisha siku iliyofuata. Tafsiri hii ni ya kawaida na wazi katika Kiswahili sanifu.
- source_word: εἰσῄει
  choice: akaingia
  rationale: Kitenzi hiki kinaonyesha mwendo wa kuingia ndani. 'Akaingia' huhifadhi mwelekeo huo, huku umbo la masimulizi likiunganisha tendo na yaliyotangulia.
- source_word: σὺν ἡμῖν
  choice: pamoja nasi
  rationale: σύν pamoja na hali ya dative huonyesha uandamani; 'pamoja nasi' ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: πρὸς Ἰάκωβον
  choice: kwenda kwa Yakobo
  rationale: πρός pamoja na accusative huonyesha mwendo kuelekea kwa mtu. 'Kwenda kwa Yakobo' ni ya asili katika Kiswahili na haiongezi utambulisho ambao haukutajwa.
- source_word: πάντες τε
  choice: na ... wote
  rationale: τέ ina nguvu nyepesi ya kuunganisha; 'na' huwasilisha uhusiano huo bila kuipa uzito kupita kiasi.
- source_word: παρεγένοντο
  choice: wakafika
  rationale: παραγίνομαι inaweza kusisitiza kufika au kuwapo. 'Wakafika' huhifadhi maana ya mwendo ya kitenzi; tanbihi inataja uwezekano wa kuelewa hali ya kuwapo.
- source_word: οἱ πρεσβύτεροι
  choice: wazee
  rationale: '''Wazee'' ni neno la kawaida kwa viongozi waliotambuliwa katika kanisa na halilazimishi muundo wa dhehebu fulani.'
theological_decisions:
- issue: Utambulisho na jukumu la Ἰάκωβον
  choice: Jina limetafsiriwa tu kuwa 'Yakobo' bila maelezo ya ziada.
  alternative: Yakobo ndugu wa Bwana; Yakobo kiongozi wa kanisa la Yerusalemu
  rationale: Aya yenyewe inamtaja Yakobo bila kumtambulisha zaidi. Kuongeza cheo au uhusiano kungeingiza habari isiyosemwa hapa.
- issue: Maana ya kikanisa ya οἱ πρεσβύτεροι
  choice: wazee
  alternative: viongozi wa kanisa; mapresbiteri
  rationale: Neno hilo linawahusu viongozi waliotambuliwa, lakini 'wazee' huhifadhi maana ya msingi bila kupendelea utaratibu wa dhehebu fulani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye 'aka-/waka-' umetumiwa kwa mtiririko wa kawaida. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
