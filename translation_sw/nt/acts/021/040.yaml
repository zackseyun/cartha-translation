  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: sw
  text: 'Alipomruhusu, Paulo, akiwa amesimama juu ya ngazi, akawapa watu ishara kwa mkono. Kulipotanda ukimya mkubwa, akawahutubia kwa lugha ya Kiebrania[a], akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa Kiaramu.” Kigiriki kinasema “kwa lahaja/lugha ya Kiebrania,” usemi ambao katika mazingira haya huenda ukarejelea lugha ya Kisemiti ya wenyeji iliyojulikana kwa kawaida kama Kiaramu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Naye alipompa ruhusa
  rationale: Muundo huu unaonyesha tendo lililotangulia na hali ya wakati, huku kiwakilishi kikirejelea mkuu wa jeshi aliyetajwa katika muktadha uliotangulia.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: akiwa amesimama kwenye ngazi
  rationale: Hueleza mahali Paulo alipokuwa; “ngazi” ni neno la kawaida na la asili kwa hatua za kupandia kuelekea kambini.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: akawafanyia watu ishara kwa mkono
  rationale: Huwasilisha ishara ya mkono iliyolenga kuwafanya watu watulie au wasikilize, bila kuongeza maana isiyotajwa wazi.
- source_word: τῷ λαῷ
  choice: watu
  rationale: Hifadhi maana ya kawaida ya λαός, ingawa katika muktadha hawa ni umati uliokusanyika.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Kulipotanda ukimya mkubwa
  rationale: Ni Kiswahili cha asili kinachoonyesha kuanza kwa ukimya mkubwa, kulingana na nguvu ya tukio katika γενομένης.
- source_word: προσεφώνησεν
  choice: akawahutubia
  rationale: Kitenzi hiki kinafaa kwa mtu anayesema hadharani kwa kusanyiko.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: kwa lugha ya Kiebrania
  rationale: Hufuata kwa uwazi usemi wa Kigiriki unaosema “lahaja/lugha ya Kiebrania,” huku uwezekano wa kurejelea Kiaramu ukihifadhiwa katika tanbihi.
- source_word: λέγων
  choice: 'akisema:'
  rationale: Huanzisha moja kwa moja hotuba inayofuata katika mstari unaofuata.
