  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: sw
  text: Baada ya kupata meli iliyokuwa ikivuka kwenda Foinike[a], tukapanda meli hiyo, kisha tukaanza safari baharini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “meli iliyokuwa ikielekea Foinike.” Kigiriki husema kihalisi meli “iliyokuwa ikivuka kwenda Foinike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: Baada ya kupata
  rationale: Kirai cha wakati uliopita kinaonyesha tendo lililotangulia kupanda na kuanza safari; muundo huu ni wa asili na unaonyesha wazi mfuatano huo.
- source_word: πλοῖον
  choice: meli
  rationale: Katika muktadha wa safari ya Bahari ya Mediterania, neno hili linaashiria chombo cha baharini; “meli” ni neno la kawaida na linalofaa.
- source_word: διαπερῶν
  choice: iliyokuwa ikivuka
  rationale: Huhifadhi wazo la kitenzi endelevu linaloieleza meli na safari yake ya kuvuka, bila kuligeuza moja kwa moja kuwa maelezo ya kusudi pekee.
- source_word: εἰς Φοινίκην
  choice: kwenda Foinike
  rationale: εἰς hapa huonyesha mahali safari ilikoelekea; “kwenda Foinike” ni Kiswahili cha kawaida.
- source_word: ἐπιβάντες
  choice: tulipanda
  rationale: Katika muktadha wa baharini humaanisha kupanda melini; matumizi ya kitenzi kikuu yanafanya sentensi isomeke kwa urahisi huku yakihifadhi mfuatano wa matendo.
- source_word: ἀνήχθημεν
  choice: kuanza safari baharini
  rationale: Katika matumizi ya safari za majini, neno hili humaanisha kuondoka na kuelekea baharini; tafsiri hii ni wazi kwa msomaji wa sasa.
