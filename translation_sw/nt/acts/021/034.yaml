base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: sw
  text: Lakini baadhi ya watu katika umati walikuwa wakipaza sauti wakisema jambo moja, na wengine jambo lingine. Kwa kuwa hakuweza kupata habari ya uhakika[a] kwa sababu ya ghasia, aliamuru apelekwe kwenye makao ya askari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukweli wa jambo hilo” au “jambo lililokuwa hakika.”
    reason: lexical_alternative
  - marker: b
    text: “Makao ya askari” hapa ni makao ya jeshi la Roma, huenda ndani ya ngome iliyounganishwa na eneo la hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν
  choice: baadhi ... walikuwa wakipaza sauti wakisema jambo moja, na wengine jambo lingine
  rationale: Muundo huu unaonyesha madai tofauti yaliyokuwa yakipazwa na watu mbalimbali, huku hali ya tendo linaloendelea ya ἐπεφώνουν ikihifadhiwa kwa “walikuwa wakipaza sauti.”
- source_word: ἐν τῷ ὄχλῳ
  choice: katika umati
  rationale: “Umati” ni neno la kawaida na lisiloegemea upande wowote kwa ὄχλος; “genge” lingeongeza maana ya uhasama isiyolazimishwa na neno lenyewe.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: Kwa kuwa hakuweza kujua
  rationale: Kauli hii inaeleza sababu iliyomfanya mkuu huyo atoe amri inayofuata; “kujua” hapa ni kupata taarifa ya kuaminika kuhusu kilichotokea.
- source_word: τὸ ἀσφαλές
  choice: ukweli wa jambo hilo
  rationale: Kifungu hiki humaanisha lililo hakika au la kuaminika. “Ukweli wa jambo hilo” ni Kiswahili cha kawaida kinachohifadhi wazo la kutaka kujua taarifa iliyo thabiti katikati ya madai yanayokinzana.
- source_word: διὰ τὸν θόρυβον
  choice: kwa sababu ya ghasia
  rationale: θόρυβος katika muktadha huu ni vurugu na makelele ya umati, si sauti kubwa tu; “ghasia” hutoa maana hiyo kwa ufupi.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: aliamuru apelekwe
  rationale: Huhifadhi amri ya mara moja na hali ya kutendwa ya infinitivu bila kuongeza watendaji ambao hawakutajwa katika Kigiriki.
- source_word: εἰς τὴν παρεμβολήν
  choice: kwenye kambi ya askari
  rationale: Katika muktadha wa Matendo, neno hili linarejelea eneo la makao ya jeshi la Roma karibu na hekalu. “Kambi ya askari” inaeleweka kwa urahisi kuliko tafsiri ya moja kwa moja inayoweza kudokeza kambi ya muda tu.
