base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: sw
  text: Lakini kuhusu watu wa Mataifa walioamini, sisi tulituma ujumbe, baada ya kuamua kwamba wajiepushe na chakula kilichotolewa dhabihu kwa sanamu, na damu, na nyama ya mnyama aliyenyongwa[a], na uasherati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, nyama ya mnyama aliyeuawa kwa kunyongwa au kukosa hewa, bila damu yake kutolewa.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ δὲ
  choice: Lakini kuhusu
  rationale: Kifungu hiki kinaanzisha mada inayohusiana lakini yenye utofauti mdogo na habari iliyotangulia kuhusu waamini Wayahudi.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: watu wa mataifa ambao wameamini
  rationale: Hutambulisha wasio Wayahudi waliokuja kuamini na wanaoendelea kuwa waamini; kauli ya uhusiano ni ya kawaida na wazi katika Kiswahili.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: sisi tulituma ujumbe
  rationale: ‘Sisi’ huhifadhi msisitizo wa kiwakilishi cha Kigiriki. Kitenzi hakitaji kitu kilichotumwa, hivyo ‘ujumbe’ hutoa Kiswahili cha kawaida bila kudai wazi kwamba neno ‘barua’ limo katika mstari huu.
- source_word: κρίναντες
  choice: baada ya kuamua
  rationale: Huonyesha kwamba uamuzi ulitangulia kutumwa kwa ujumbe na ulikuwa uamuzi wa pamoja wenye kusudi.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: kwamba wajiepushe na
  rationale: Huhifadhi maana ya kujilinda au kukaa mbali na mambo yaliyotajwa, kwa lugha ya kawaida ya Kiswahili.
- source_word: τό τε εἰδωλόθυτον
  choice: vitu vilivyotolewa dhabihu kwa sanamu
  rationale: Hufuata upana wa neno la Kigiriki bila kulibana katika nyama pekee, ingawa kwa muktadha linahusu chakula kinachohusishwa na dhabihu za sanamu.
- source_word: αἷμα
  choice: damu
  rationale: Ni tafsiri ya moja kwa moja na huhifadhi ufupi wa orodha ya Kigiriki.
- source_word: πνικτόν
  choice: nyama ya mnyama aliyenyongwa
  rationale: Neno linarejelea mnyama aliyeuawa kwa kunyongwa au kukosa hewa, bila damu kutolewa; kuongeza ‘nyama ya mnyama’ hufanya maana iwe wazi katika Kiswahili.
- source_word: πορνείαν
  choice: uasherati
  rationale: Katika Kiswahili cha Biblia na matumizi ya kawaida, neno hili linaweza kumaanisha mwenendo mpana wa ngono usio halali, bila kuubana kwa tendo moja tu.
theological_decisions:
- issue: Asili na muda wa makatazo ya uamuzi wa mitume
  choice: Makatazo manne yametafsiriwa moja kwa moja bila kueleza ikiwa yalikuwa ya muda au ya kudumu.
  alternative: Kuyafafanua kama masharti ya muda ya ushirika wa mezani, au kama sheria ya kudumu kwa waamini wote.
  rationale: Mstari unarudia yaliyomo katika uamuzi wa awali lakini hauelezi hapa msingi kamili wala muda wa kila katazo; tafsiri haipaswi kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi msisitizo wa ‘sisi,’ mlolongo wa uamuzi na ujumbe, na kutokutajwa wazi kwa kitu kilichotumwa katika Kigiriki.
