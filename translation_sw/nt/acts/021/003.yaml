base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: sw
  text: Baada ya kuiona Kupro[a] na kuiacha upande wetu wa kushoto[b], tulisafiri kwa meli kuelekea Siria, tukafika Tiro[c], kwa maana huko meli ilikuwa ikipakua shehena yake.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya Kupro kujitokeza machoni petu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, waliipita Kupro huku kisiwa hicho kikibaki upande wa kushoto wa meli yao.
    reason: cultural_note
  - marker: c
    text: Kigiriki, “tukashuka hadi Tiro”; katika muktadha huu yaweza kumaanisha “tukafika Tiro.”
    reason: lexical_alternative
  - marker: d
    text: Au, “meli ilikuwa ikipakuliwa shehena yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: Baada ya kuiona
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia safari; usemi huu unaeleza kwa Kiswahili cha kawaida kwamba Kupro ilionekana wakati wa safari ya baharini.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: na kuiacha upande wetu wa kushoto
  rationale: Huhifadhi moja kwa moja upande unaotajwa na Kigiriki bila kutumia istilahi ya kitaalamu ya mabaharia.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: tulisafiri kwa meli kuelekea Siria
  rationale: Hueleza safari ya baharini inayoendelea na mwelekeo wake kwa lugha ya kawaida na iliyo wazi.
- source_word: κατήλθομεν εἰς Τύρον
  choice: tukafika Tiro
  rationale: Katika muktadha wa safari ya baharini, maana inayolengwa ni kufika au kutua bandarini; tafsiri hii ni ya asili kwa Kiswahili, huku maana halisi ya kushuka ikihifadhiwa katika tanbihi.
- source_word: ἐκεῖσε
  choice: huko
  rationale: Kielezi hiki kinarejelea Tiro kama mahali ambako meli ilipaswa kupakua shehena.
- source_word: ἀποφορτιζόμενον
  choice: ilikuwa ikipakua
  rationale: Muundo wa Kigiriki unaonyesha shughuli iliyokuwa ikiendelea. Kiswahili hutumia meli kama mtendaji kwa njia ya kawaida, ingawa umbo la kutendwa pia linawezekana.
- source_word: τὸν γόμον
  choice: shehena yake
  rationale: Shehena ni neno la kawaida na sahihi kwa mzigo unaosafirishwa na meli; kiwakilishi kinaonyesha uhusiano wake na meli.
