  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: sw
  text: Wakati wa kumaliza siku zile ulipofika, tuliondoka na kuendelea na safari yetu. Wote, pamoja na wake zao na watoto wao, walitusindikiza[a] hadi nje ya mji. Kisha tukapiga magoti ufuoni[b] na kusali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walituaga.” Kitenzi cha Kigiriki kinaweza kumaanisha kuandamana na mtu anapoondoka kama tendo la kumuaga.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye ufukwe” au “kwenye ukingo wa bahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: Wakati wa kumaliza siku zile ulipofika
  rationale: Muundo huu unaonyesha kufika kwa wakati wa kukamilisha kipindi kilichotajwa. “Siku zile” inadumisha rejeo dhahiri la Kigiriki bila kulifanya kuwa maelezo mapana.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: tuliondoka na kuendelea na safari yetu
  rationale: 'Tafsiri hii inadumisha hatua zote mbili: kuondoka mahali walipokuwa na kisha kusafiri kuendelea na njia yao.'
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Wote ... walitusindikiza
  rationale: Kitenzi kinaweza kumaanisha kuandamana na mtu anapoondoka, mara nyingi kama tendo la kumuaga. “Walitusindikiza” ni Kiswahili cha kawaida kinachobeba maana hizo zote mbili.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: pamoja na wake zao na watoto wao
  rationale: Katika muktadha wa watu wote kuja pamoja na familia zao, γυναιξὶ inaeleweka kwa kawaida kuwa wake. Viwakilishi vinaweka uhusiano wa kifamilia wazi kwa Kiswahili.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: hadi nje ya mji
  rationale: Hii inaonyesha kwamba waliandamana nao mpaka mahali palipokuwa nje ya mipaka ya mji, bila kuongeza wazo lisilotajwa la viunga vya mji.
- source_word: θέντες τὰ γόνατα
  choice: tukapiga magoti
  rationale: Huu ndio msemo wa asili wa Kiswahili kwa tendo la kupiga magoti; tafsiri ya moja kwa moja ya “kuweka magoti” ingekuwa ngumu na isiyo ya kawaida.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: ufuoni
  rationale: αἰγιαλός humaanisha ufukwe au ukingo wa bahari. “Ufuoni” ni fupi, ya kawaida, na inafaa mazingira ya tukio.
- source_word: προσευξάμενοι
  choice: na kusali
  rationale: Ingawa Kigiriki kinatumia kishirikishi, Kiswahili huwasilisha mfuatano huu kwa kawaida kwa kitenzi kinachoendeleza simulizi. “Kusali” ni neno la kawaida na lenye heshima.
