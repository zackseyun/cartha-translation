  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: sw
  text: Kisha akawapandisha hadi nyumbani kwake[a], akawawekea chakula, naye akafurahi sana pamoja na watu wote wa nyumbani mwake[b], akiwa amemwamini Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nyumba yake.” Muktadha unaonyesha kuwa hii ilikuwa nyumba ya mlinzi wa gereza.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinaweza pia kusisitiza kwamba watu wote wa nyumbani walishiriki katika furaha; wengine hulielewa fungu hili kuwa linadokeza kwamba wao pia walishiriki katika kuamini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: akawapandisha
  rationale: Kitenzi hiki hapa kinaonyesha kuwapeleka juu kutoka gerezani hadi nyumbani; umbo la mfululizo linaweka tendo hili kabla ya kuandaa chakula na kufurahi.
- source_word: οἶκον
  choice: nyumbani
  rationale: Katika muktadha huu ni nyumba ya mlinzi wa gereza. “Nyumbani” ni Kiswahili cha kawaida na cha asili kinachodokeza makao yake bila kulazimisha kirai kizito.
- source_word: παρέθηκεν τράπεζαν
  choice: akawaandalia chakula
  rationale: Nahau ya Kigiriki kwa maana halisi ni kuweka meza, lakini humaanisha kuandaa au kuwapa wageni chakula. Tafsiri hii inaleta maana ya ukarimu kwa Kiswahili cha kawaida.
- source_word: ἠγαλλιάσατο
  choice: akafurahi sana
  rationale: Kitenzi kinaeleza furaha kubwa au iliyofurika; “akafurahi sana” ni wazi, ya asili, na inadumisha nguvu yake.
- source_word: πανοικεὶ
  choice: pamoja na watu wote wa nyumbani mwake
  rationale: Kielezi hiki kinahusu nyumba nzima au wote waliomo humo. Kauli hii inaonyesha wazi ushiriki wa watu wa nyumba katika furaha bila kuifunga moja kwa moja na tendo la kuamini.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: akiwa amemwamini Mungu
  rationale: Umbo la wakati timilifu linaonyesha tendo la kuamini lililotokea na lenye matokeo yanayoendelea. Kirai tegemezi kinadumisha muundo wa participle na hakiongezi kwa lazima uhusiano wa sababu.
theological_decisions:
- issue: Uhusiano wa watu wote wa nyumbani na kufurahi pamoja na kuamini
  choice: Mlinzi ndiye anayeelezwa moja kwa moja kuwa amemwamini Mungu, huku watu wote wa nyumbani mwake wakishiriki katika furaha.
  alternative: Kauli inaweza kueleweka kuwa watu wote wa nyumbani pia walishiriki katika kuamini, au kuwa nyumba nzima ilifurahi kwa sababu wote walikuwa wameamini.
  rationale: Kivumishi-participle cha umoja πεπιστευκώς kinamrejelea moja kwa moja mlinzi, ilhali πανοικεὶ kinaweza kuhusishwa hasa na kufurahi. Maandishi makuu hayadai zaidi ya sintaksia, na tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Nyumbani” na “akawaandalia chakula” zimetumiwa kwa uasilia, huku mpangilio wa matendo na utata wa kisintaksia kuhusu nyumba nzima vikihifadhiwa.
