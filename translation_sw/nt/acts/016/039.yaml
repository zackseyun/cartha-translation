  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: sw
  text: Nao wakaja, wakawasihi[a]. Kisha wakawatoa nje na kuwaomba[b] waondoke mjini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawaomba sana” au “wakawabembeleza.” Kitenzi cha Kigiriki kinaweza pia kumaanisha “kuwafariji” katika miktadha mingine, lakini hapa huenda kinaonyesha jaribio la kutuliza hali baada ya mahakimu kuwatendea vibaya Paulo na Sila.
    reason: lexical_alternative
  - marker: b
    text: 'Kitenzi “kuwaomba” kiko katika wakati usiotimilifu wa Kigiriki, ambao unaweza kudokeza ombi lililoendelea au lililorudiwa: “waliendelea kuwaomba” au “waliwaomba tena na tena.”'
    reason: lexical_alternative
  - marker: c
    text: Maneno “waondoke mjini” yamewekwa katika mabano katika maandishi ya Kigiriki ya SBLGNT, yakionyesha kutokuwa na uhakika wa matini.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντες
  choice: wakaja
  rationale: Kitenzi kishirikishi cha wakati uliopita kinatanguliza hatua ya mahakimu; muundo wa kitenzi mfululizo ni wa kawaida katika Kiswahili na unaonyesha mpangilio wa matendo.
- source_word: παρεκάλεσαν
  choice: wakawasihi
  rationale: Katika muktadha huu παρακαλέω inaonyesha ombi la upole lenye lengo la kutuliza hali baada ya Paulo na Sila kutendewa vibaya. “Kuwasihi” huhifadhi uzito na unyenyekevu huo bila kuifanya iwe “kuwafariji.”
- source_word: αὐτούς
  choice: wa-
  rationale: Kiambishi cha yambwa katika “wakawasihi” na “wakawatoa” kinawarejelea Paulo na Sila kwa njia ya kawaida ya Kiswahili.
- source_word: ἐξαγαγόντες
  choice: wakawatoa nje
  rationale: Huwasilisha wazi tendo la kuwatoa mahali walimokuwa wamezuiliwa na kudumisha mfuatano wa simulizi.
- source_word: ἠρώτων
  choice: kuwaomba
  rationale: ἐρωτάω hapa ni kuomba jambo kwa heshima. Wakati usiotimilifu unaweza kudokeza ombi lililoendelea au lililorudiwa; tafsiri kuu inaacha uwezekano huo wazi na tanbihi inaueleza.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: waondoke mjini
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachowasilisha kwa usahihi ombi la kuondoka katika mji huo.
