base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: sw
  text: Baada ya kuwachapa mapigo mengi[a], wakawatupa gerezani[b], wakamwamuru mlinzi wa gereza awashikilie kwa ulinzi mkali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya kuwapiga sana.” Kigiriki kinataja mapigo mengi bila kueleza hapa chombo kilichotumiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “mahali pa kifungo”; neno la Kigiriki linaweza kumaanisha mahali pa kuwafungia watu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: mapigo mengi
  rationale: Neno πληγή katika muktadha huu linamaanisha pigo au jeraha linalotokana na kupigwa. “Mapigo mengi” linaonyesha idadi kubwa bila kutaja chombo kilichotumiwa.
- source_word: τε
  choice: Baada ya ... wakawatupa
  rationale: Kiunganishi hiki kinaendeleza simulizi. Katika Kiswahili, mtiririko wake unaonyeshwa kwa muundo wa sentensi unaounganisha kupigwa na kutupwa gerezani.
- source_word: ἐπιθέντες
  choice: Baada ya kuwapiga
  rationale: Kishirikishi hiki, pamoja na πληγάς, ni nahau ya kuwapiga mapigo. Muundo “baada ya” unaonyesha kwamba kupigwa kulitangulia tendo kuu la kutupwa gerezani.
- source_word: ἔβαλον εἰς φυλακήν
  choice: wakawatupa gerezani
  rationale: “Wakawatupa” linahifadhi nguvu ya βάλλω kuliko “wakawaweka,” huku “gerezani” likitaja mahali pa kifungo kwa Kiswahili cha kawaida.
- source_word: φυλακήν
  choice: gerezani
  rationale: φυλακή linaweza kumaanisha gereza au mahali pa kifungo. “Gerezani” ni neno la kawaida na wazi katika muktadha huu.
- source_word: παραγγείλαντες
  choice: wakamwamuru
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka; “wakamwamuru” ni cha asili na kinahifadhi nguvu hiyo.
- source_word: δεσμοφύλακι
  choice: mlinzi wa gereza
  rationale: Neno hili humtaja afisa mwenye wajibu wa kuwalinda wafungwa. “Mlinzi wa gereza” linaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: ἀσφαλῶς
  choice: kwa uangalifu mkubwa
  rationale: Katika muktadha wa kifungo, kielezi hiki kinasisitiza kuwazuia wafungwa wasitoroke, si kulinda usalama wao. Kauli hii inaonyesha uzito wa ulinzi bila kudokeza ustawi wao.
- source_word: τηρεῖν
  choice: awalinde
  rationale: τηρέω hapa humaanisha kuwaweka chini ya ulinzi au kuwachunga. “Awalinde” linafaa katika mazingira ya gereza.
- source_word: αὐτούς
  choice: wa-/wao
  rationale: Kiwakilishi hiki kinawarejelea Paulo na Sila kama waliotupwa gerezani na waliopaswa kulindwa.
