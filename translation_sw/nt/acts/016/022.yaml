  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: sw
  text: Umati nao ukainuka kwa pamoja dhidi yao[a]. Mahakimu[b] wakawavua nguo zao, wakaamuru wapigwe kwa fimbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukaungana kuwashambulia.” Kitenzi cha Kigiriki kinakazia tendo la pamoja la umati kwa uhasama.
    reason: lexical_alternative
  - marker: b
    text: Hawa walikuwa maafisa wakuu wa kiraia wa Kirumi huko Filipi; kwa istilahi ya kitaalamu zaidi, “mapraetori.”
