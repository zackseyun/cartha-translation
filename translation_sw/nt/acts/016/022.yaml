review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the crowd, the Roman civic magistrates, the removal of Paul and Silas’s clothing, and the command for beating with rods. However, “kuwashambulia” can imply an actual physical attack more strongly than συνεπέστη requires, and “wakawararulia nguo zao” is less clear in contemporary Standard East African Swahili.
  naturalness: The narrative flow is generally natural. Recasting the first clause as a collective rising against them and using the transparent expression “wakawavua nguo zao” improves clarity and idiomatic modern usage.
  terminology: “Umati,” “mahakimu,” “Filipi,” and “kupigwa kwa fimbo” are suitable. The cultural footnote correctly explains that these magistrates were Roman civic authorities, though “mapraetori” should be presented as a technical title without implying that it is the normal Swahili rendering.
  issues:
  - severity: medium
    issue: “kuwashambulia” is somewhat more specific than the Greek verb.
    rationale: συνεπέστη denotes the crowd’s collective hostile rising or action against Paul and Silas; it does not explicitly state that the crowd physically attacked them. “Ukainuka kwa pamoja dhidi yao” preserves the source wording and ambiguity.
  - severity: medium
    issue: “wakawararulia nguo zao” is opaque and potentially difficult to parse.
    rationale: Although intended to convey tearing clothing off them, this construction is less transparent for contemporary readers. “Wakawavua nguo zao” clearly conveys the stripping of their garments before the ordered beating; it does not add a doctrinal or historical inference.
  revised_text: Umati nao ukainuka kwa pamoja dhidi yao[a]. Mahakimu[b] wakawavua nguo zao, wakaamuru wapigwe kwa fimbo.
