lexical_decisions:
- source_word: συνεπέστη
  choice: ukaungana kuwashambulia
  rationale: Kitenzi hiki kinaonyesha umati ukitenda kwa pamoja kwa uhasama. Kauli hii ni ya kawaida katika Kiswahili na inahifadhi wazo la hatua ya pamoja bila kudokeza zaidi ya maandishi.
- source_word: ὄχλος
  choice: umati
  rationale: “Umati” ni neno la kawaida na lisiloegemea upande wowote kwa kundi kubwa la watu; “genge” lingetafsiri hisia zao kupita kiasi.
- source_word: κατ’ αὐτῶν
  choice: kuwashambulia
  rationale: Muktadha unaonyesha hatua ya uhasama dhidi ya Paulo na Sila. Maana ya “dhidi yao” imejumuishwa kiasili katika kitenzi chenye kiambishi cha yambwa.
- source_word: στρατηγοὶ
  choice: mahakimu
  rationale: Hawa ni maafisa wakuu wa kiraia wa koloni la Kirumi la Filipi. “Mahakimu” ni neno linaloeleweka kwa wasomaji wa sasa, huku maelezo ya chini yakifafanua cheo chao.
- source_word: περιρήξαντες
  choice: wakawararulia
  rationale: Kitenzi kinaonyesha kuyararua au kuyaondoa mavazi kutoka kwao kabla ya kipigo. Mfuatano wa vitenzi vya Kiswahili unaonyesha kwamba tendo hili lilitangulia amri ya kupigwa.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: nguo zao
  rationale: “Nguo zao” ni Kiswahili cha kawaida na huonyesha kwamba mavazi yaliyotolewa yalikuwa ya Paulo na Sila.
- source_word: ἐκέλευον
  choice: wakaamuru
  rationale: Ingawa Kigiriki kimetumia hali isiyotimilika, katika simulizi la Kiswahili “wakaamuru” huwasilisha kwa ufasaha amri iliyotolewa katika tukio hili bila kubadili maana.
- source_word: ῥαβδίζειν
  choice: wapigwe kwa fimbo
  rationale: Kitenzi hiki hutaja hasa kupiga kwa fimbo, aina ya adhabu ya Kirumi; tafsiri hii ni wazi na sahihi kuliko neno linaloweza kumaanisha kupiga kwa mjeledi.
