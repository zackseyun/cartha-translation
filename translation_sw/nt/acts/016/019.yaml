  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: sw
  text: Lakini mabwana wake walipoona kwamba tumaini lao la kupata faida lilikuwa limetoweka[a], waliwakamata Paulo na Sila na kuwaburuta mpaka sokoni mbele ya watawala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tumaini lao la mapato.” Kihalisi, kirai cha Kigiriki ni “tumaini la faida au mapato yao.”
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “watawala” ni jina la jumla la wenye mamlaka ya kiraia; mstari unaofuata unatumia jina maalumu zaidi ambalo mara nyingi hutafsiriwa “mahakimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: mabwana wake
  rationale: Katika muktadha huu neno hilo linawataja waliokuwa na mamlaka ya umiliki na udhibiti juu ya msichana huyo. “Mabwana wake” linaonyesha uhusiano huo wa kijamii na unyonyaji wa kiuchumi bila kuongeza maelezo yasiyokuwamo katika mstari.
- source_word: ἐξῆλθεν
  choice: lilikuwa limetoweka
  rationale: Ingawa kitenzi kwa halisi kina wazo la “kutoka,” hapa kinamaanisha kwamba tumaini lao halikuwapo tena. Kauli hii ya Kiswahili ni ya asili na inaonyesha jambo lililokuwa limekwisha kutokea walipotambua hasara yao.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: tumaini lao la kupata faida
  rationale: “Tumaini” linahifadhi ἐλπίς, huku “kupata faida” likitoa maana ya ἐργασία katika muktadha wa mapato yaliyotokana na shughuli ya msichana huyo.
- source_word: ἐπιλαβόμενοι
  choice: waliwakamata
  rationale: Kitenzi hiki kinaonyesha kuwashika kwa nguvu. “Waliwakamata” ni wazi, cha asili, na kinafaa katika mazingira ya kitendo cha uhasama.
- source_word: εἵλκυσαν
  choice: kuwaburuta
  rationale: Neno hili linaonyesha kuvuta kwa nguvu; “kuwaburuta” linahifadhi ukali na shuruti ya kitendo hicho.
- source_word: ἀγορὰν
  choice: sokoni
  rationale: ἀγορά lilikuwa eneo la soko na pia uwanja wa shughuli za kiraia. “Sokoni” ni tafsiri fupi na ya kawaida, huku muktadha wa kupelekwa mbele ya watawala ukionyesha kazi yake ya umma.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: mbele ya watawala
  rationale: ἄρχοντες ni jina la jumla la wenye mamlaka ya kiraia. “Watawala” linahifadhi ujumla huo na halitangulizi cheo maalumu zaidi kinachotumiwa katika mstari unaofuata.
