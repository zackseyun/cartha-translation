translation:
  language: sw
  text: Alikuwa na ushuhuda mzuri kutoka kwa ndugu wa Listra na Ikonio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” linaweza kuwajumuisha waamini wa kiume na wa kike katika maeneo hayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ali-
  rationale: Kiwakilishi hiki cha uhusiano kinamrejelea Timotheo katika mstari wa 1; kwa Kiswahili, mtenda huwakilishwa kwa kiambishi cha nafsi katika kitenzi.
- source_word: ἐμαρτυρεῖτο
  choice: alisifiwa
  rationale: Kitenzi hiki katika muktadha kinaonyesha kwamba Timotheo alitolewa ushuhuda mzuri na alikuwa na sifa njema; ‘alisifiwa’ ni usemi mfupi na wa kawaida unaowasilisha maana hiyo.
- source_word: ὑπὸ
  choice: na
  rationale: Baada ya kitenzi cha kutendwa, ‘na’ humtambulisha mtenda kwa kawaida katika Kiswahili.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: waliokuwa Listra na Ikonio
  rationale: Muundo huu unawatambulisha ndugu waliopatikana katika miji hiyo miwili; ‘waliokuwa’ huonyesha wazi uhusiano huo bila kudokeza lazima kwamba walitoka huko.
- source_word: ἀδελφῶν
  choice: ndugu
  rationale: ‘Ndugu’ ni neno la kawaida la jumuiya ya waamini na linaweza kurejelea wanaume au waamini kwa ujumla, kama matumizi ya Kigiriki yanavyoruhusu.
theological_decisions:
- issue: Upeo wa kijinsia wa ἀδελφῶν katika jumuiya ya Kikristo
  choice: ndugu
  alternative: ndugu wa kiume; waamini
  rationale: ‘Ndugu’ huhifadhi taswira ya kifamilia ya Kigiriki bila kulazimisha marejeo kwa wanaume pekee. Tanbihi inaweka wazi kwamba hapa neno linaweza kuwahusu waamini wa kiume na wa kike.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Alisifiwa’ ni cha asili zaidi kuliko tafsiri ngumu kama ‘alishuhudiwa,’ huku tanbihi ikihifadhi upeo unaowezekana wa ἀδελφῶν.
