  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: sw
  text: Kulipokucha, mahakimu waliwatuma wabeba fimbo[a], wakisema, “Waachilie watu wale.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “liktori,” wasaidizi rasmi wa mahakimu wa Kirumi waliobeba fimbo kama ishara za mamlaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Kulipopambazuka
  rationale: Kirai huru cha hali ya umilikishi kinaonyesha mpito wa wakati. “Kulipopambazuka” ni Kiswahili cha kawaida kinachowasilisha kuingia kwa mchana au asubuhi bila kulazimisha kuwa ni alfajiri kabisa.
- source_word: ἀπέστειλαν
  choice: waliwatuma
  rationale: Kitenzi hiki hapa kina maana ya kuwatuma wajumbe; kiambishi cha yambwa kinaelekeza kwa wabeba-fimbo waliotumwa.
- source_word: στρατηγοὶ
  choice: mahakimu
  rationale: Katika mazingira ya koloni la Kirumi la Filipi, neno hili linawataja maafisa wakuu wa kiraia, si majenerali wa kijeshi. “Mahakimu” linaeleweka na linafaa kwa mamlaka yao ya kisheria.
- source_word: ῥαβδούχους
  choice: wabeba-fimbo
  rationale: Tafsiri hii inadumisha picha halisi ya maafisa waliobeba fimbo kama ishara za mamlaka, huku tanbihi ikieleza cheo chao cha Kirumi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi uhusiano wa kitenzi-shirikishi kinachoanzisha ujumbe uliotumwa.
- source_word: Ἀπόλυσον
  choice: Waachilie
  rationale: Amri ya umoja inaelekezwa kwa msimamizi mwenye mamlaka ya kuwaweka huru wafungwa hao; “waachilie” ni ya kawaida na inafaa katika mazingira ya kifungo.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: watu wale
  rationale: Neno ἄνθρωποι linawataja Paulo na Sila. Kiswahili kwa kawaida hutumia “watu wale” bila kupoteza rejeleo lao la wazi katika muktadha.
