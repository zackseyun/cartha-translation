id: ACT.16.18
reference: Acts 16:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: sw
  text: Naye aliendelea kufanya hivyo kwa siku nyingi. Lakini Paulo, akiwa amesumbuka sana, akageuka na kuiambia ile roho, “Ninakuamuru kwa jina la Yesu Masihi, umtoke.” Nayo ikamtoka saa ileile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: aliendelea kufanya hivyo kwa siku nyingi
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea au kurudiwa; ‘aliendelea kufanya hivyo’ linaeleza jambo hilo kwa Kiswahili cha kawaida.
- source_word: διαπονηθεὶς
  choice: akiwa amesumbuka sana
  rationale: Neno hilo linaonyesha kusumbuliwa au kuchoshwa kwa kina, si kuudhika kidogo tu.
- source_word: ἐπιστρέψας
  choice: akageuka
  rationale: Inaonyesha Paulo aligeuka kimwili kabla ya kusema.
- source_word: τῷ πνεύματι
  choice: ile roho
  rationale: Kigiriki kinasema tu ‘roho’; kiashiria ‘ile’ humtambulisha mhusika aliyetajwa katika muktadha bila kuongeza ‘pepo’ au ‘roho mwovu’.
- source_word: Παραγγέλλω σοι
  choice: Ninakuamuru
  rationale: Hii ni amri yenye mamlaka iliyoelekezwa kwa roho.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: kwa jina la Yesu Masihi
  rationale: ‘Masihi’ huhifadhi maana ya Χριστός kama cheo, huku ‘kwa jina la’ ikionyesha mamlaka ambayo kwa msingi wake amri inatolewa.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: umtoke
  rationale: ‘Umtoke’ ni usemi mfupi na wa kawaida wa Kiswahili unaoeleza roho kutoka ndani ya mtu.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: ikamtoka saa ileile
  rationale: Kirai hicho humaanisha wakati huohuo au mara moja; ‘saa ileile’ huhifadhi picha ya chanzo na kuonyesha utekelezaji wa papo hapo.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός hapa inahifadhiwa kama cheo chenye maana ya Masihi, si kama sehemu isiyoelezeka ya jina.
- issue: Kama roho itajwe wazi kuwa pepo au roho mwovu
  choice: ile roho
  alternative: pepo / roho mwovu
  rationale: Mstari wenyewe unasema πνεῦμα bila kivumishi. Tafsiri haiongezi sifa ambayo haipo, ingawa muktadha unaonyesha ni roho inayomtesa msichana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa simulizi umetumia ‘akageuka’ na ‘ikamtoka’ kwa mtiririko wa kawaida; ‘Yesu Masihi’ huhifadhi cheo bila kuingiza desturi maalumu ya dhehebu.
