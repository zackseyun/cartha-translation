id: ACT.16.6
reference: Acts 16:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: sw
  text: Nao wakapita katika eneo la Frigia na Galatia[b], wakiwa wamekatazwa na Roho Mtakatifu kulisema neno katika Asia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jimbo la Kiroma la Asia lililokuwa magharibi mwa Asia Ndogo, si bara la Asia la leo.
    reason: cultural_note
  - marker: b
    text: Au huenda, “eneo la Kifrigia na Kigalatia.” Muundo wa Kigiriki unaweza kueleweka kuwa jina la eneo moja.
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: wakapita katika
  rationale: Kitenzi hiki kinaonyesha kusafiri kupitia eneo fulani; “wakapita katika” ni Kiswahili cha kawaida kinachohifadhi maana ya mwendo kupitia eneo.
- source_word: δὲ
  choice: Nao
  rationale: Hiki ni kiunganishi chepesi kinachoendeleza simulizi; “Nao” kinaunganisha sentensi kwa kawaida bila kuongeza mkazo usiokuwapo.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: eneo la Frigia na Galatia
  rationale: χώρα ni eneo au nchi. Tafsiri hii inasomeka kwa urahisi huku tanbihi ikihifadhi uwezekano wa kuelewa muundo wa Kigiriki kama eneo moja la Kifrigia na Kigalatia.
- source_word: κωλυθέντες
  choice: kwa kuwa ... alikuwa amewakataza
  rationale: Kirai hiki cha aoristi tendwa kinaonyesha kuzuiwa au kukatazwa, huenda kabla ya safari hiyo au kuhusiana nayo. “Alikuwa amewakataza” huonyesha katazo la moja kwa moja na kutangulia kwake kimantiki.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Roho Mtakatifu
  rationale: Muundo wa Kigiriki unamtaja Roho Mtakatifu kuwa mtendaji wa katazo; katika Kiswahili muundo tendaji ni wa kawaida zaidi kuliko “wakiwa wamekatazwa na.”
- source_word: λαλῆσαι
  choice: kulisema
  rationale: λαλέω kwa msingi ni kusema. “Kulisema” hudumisha uhusiano wake na “neno” bila kuibana maana iwe kuhubiri pekee.
- source_word: τὸν λόγον
  choice: neno
  rationale: “Neno” huhifadhi istilahi pana ya Luka-Matendo kwa ujumbe wa Kikristo bila kuibadili moja kwa moja kuwa “injili” au “ujumbe.”
- source_word: ἐν τῇ Ἀσίᾳ
  choice: huko Asia
  rationale: Jina la kihistoria limehifadhiwa katika matini, huku tanbihi ikifafanua kuwa ni jimbo la Kiroma, si bara la kisasa.
theological_decisions:
- issue: Utendaji na nafsi ya Roho katika katazo
  choice: Roho Mtakatifu alikuwa amewakataza
  alternative: walikuwa wamekatazwa na roho
  rationale: Kifungu chenye kibainishi na kivumishi katika muktadha wa Luka-Matendo kinamtaja Roho Mtakatifu kama mtendaji wa katazo. Tafsiri haiongezi maelezo ya kimadhehebu zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa simulizi unaoeleweka kwa wasomaji wa kawaida. Majina Frigia, Galatia, na Asia yamehifadhiwa kwa namna inayotumika sana katika Biblia za Kiswahili. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
