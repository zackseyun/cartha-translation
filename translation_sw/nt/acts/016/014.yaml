  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: sw
  text: Na mwanamke mmoja aitwaye Lidia, muuzaji wa vitambaa vya rangi ya zambarau kutoka mji wa Thiatira, aliyekuwa akimwabudu Mungu[a], alikuwa akisikiliza. Bwana akaufungua moyo wake ili ayazingatie yale yaliyokuwa yakinenwa na Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwabudu wa Mungu”; usemi huo unaweza kumaanisha mtu wa Mataifa aliyekuwa mfuasi wa Mungu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: Mwanamke mmoja
  rationale: Huwasilisha hali ya kutotajwa awali iliyo katika τις kwa Kiswahili cha kawaida; kiunganishi καί hakihitaji kutafsiriwa kwa neno tofauti mwanzoni mwa sentensi hii.
- source_word: ὀνόματι Λυδία
  choice: aliyeitwa Lidia
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kumtambulisha mtu kwa jina.
- source_word: πορφυρόπωλις
  choice: muuzaji wa vitambaa vya rangi ya zambarau
  rationale: Neno linamaanisha mfanyabiashara wa vitu au vitambaa vilivyotiwa rangi ya zambarau; tafsiri hii ni wazi bila kudai kwamba bidhaa hizo zilikuwa mavazi.
- source_word: πόλεως Θυατείρων
  choice: kutoka mji wa Thiatira
  rationale: Huwasilisha kwa kawaida asili ya Lidia iliyoonyeshwa na uhusiano wa genitivi.
- source_word: σεβομένη τὸν θεόν
  choice: aliyemwabudu Mungu
  rationale: σεβομένη huonyesha kumcha, kumheshimu, na kumwabudu Mungu; hapa tafsiri hii inaeleweka kwa urahisi na haigeuzi usemi huo kuwa jina rasmi la kundi.
- source_word: ἤκουεν
  choice: alikuwa akisikiliza
  rationale: Huhifadhi hali endelevu ya kitenzi cha wakati usiotimilika na kuonyesha usikilizaji makini kuliko kusikia tu.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος na haiweke wazi zaidi ya Kigiriki ikiwa anayerejelewa ni Mungu au Yesu.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: akaufungua moyo wake
  rationale: Huhifadhi sitiari ya Kigiriki ya kuwezeshwa kupokea ujumbe kwa ndani.
- source_word: προσέχειν
  choice: ili ayazingatie
  rationale: Hueleza kuelekeza fikira kwa makini bila kuongeza maana ya kuitikia au kuamini ambayo haijasemwa moja kwa moja.
- source_word: τοῖς λαλουμένοις
  choice: yale yaliyokuwa yakinenwa
  rationale: Huhifadhi hali ya kutendwa na mwendelezo wa usemi katika umbo la Kiswahili linalosomeka vizuri.
- source_word: ὑπὸ τοῦ Παύλου
  choice: na Paulo
  rationale: Katika sentensi ya kutendwa, 'na Paulo' huonyesha mtendaji kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Anayerejelewa na ὁ κύριος
  choice: Bwana
  alternative: Bwana Yesu; Mungu
  rationale: Kigiriki kinasema tu ὁ κύριος. Tafsiri haiongezi utambulisho ambao aya yenyewe hauelezi wazi, hivyo inadumisha uwazi wa kitheolojia wa matini.
- issue: Maana ya σεβομένη τὸν θεόν
  choice: aliyemwabudu Mungu
  alternative: aliyemcha Mungu; mwabudu wa Mungu
  rationale: Usemi unaweza kumwelezea mtu wa Mataifa aliyeshikamana na ibada ya Mungu wa Israeli, lakini matini hapa inatumia maelezo badala ya cheo rasmi; tafsiri kuu haifanyi hadhi hiyo kuwa ya kitaalamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili bila kupoteza mwendelezo wa ἤκουεν na λαλουμένοις. Jina Θυάτειρα limetolewa kama Thiatira, umbo linalosomeka kwa urahisi katika Kiswahili.
