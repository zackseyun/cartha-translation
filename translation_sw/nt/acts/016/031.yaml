  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: sw
  text: Nao wakasema, “Mwamini Bwana Yesu[a], nawe utaokolewa—wewe na watu wa nyumbani mwako[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtumaini Bwana Yesu.”
    reason: lexical_alternative
  - marker: b
    text: “Watu wa nyumbani mwako” ni watu wa kaya yako, si jengo unaloishi ndani yake.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Nao wakasema
  rationale: δέ ni kiunganishi chepesi katika simulizi; “Nao” linaendeleza mtiririko bila kuongeza wazo la upinzani mkali.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: Mwamini
  rationale: Kitenzi cha amri katika umoja kinamtaka msikilizaji achukue hatua ya imani iliyoelekezwa kwa Yesu. “Mwamini” ni Kiswahili cha kawaida na cha moja kwa moja; pia kinaweza kubeba maana ya kumtumaini.
- source_word: κύριον Ἰησοῦν
  choice: Bwana Yesu
  rationale: “Bwana” linahifadhi uzito wa heshima na wa kiteolojia wa κύριος, huku jina Ἰησοῦς likifuata umbo la kawaida la Kiswahili, “Yesu.”
- source_word: σωθήσῃ
  choice: utaokolewa
  rationale: Hili ni tamko la wakati ujao katika kauli tendwa. “Utaokolewa” linahifadhi lugha ya wokovu ya muktadha bila kuipunguza iwe uokozi wa hatari ya muda tu.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: wewe pamoja na watu wa nyumbani mwako
  rationale: οἶκος hapa ni jamaa au watu wa kaya, si jengo pekee. “Watu wa nyumbani mwako” ni wazi na la kawaida kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Upeo wa ahadi kuhusu msimamizi wa gereza na watu wa nyumbani mwake
  choice: Maneno yametafsiriwa moja kwa moja ili kuwajumuisha yeye na watu wa nyumbani mwake, bila kudai kwamba wanaokolewa moja kwa moja kwa msingi wa imani yake pekee.
  alternative: Kutafsiri kwa namna inayofundisha ama wokovu wa kaya nzima kupitia imani ya mkuu wa kaya peke yake, ama kuondoa kabisa upeo wa ahadi kwa kaya.
  rationale: Kigiriki kinawataja wazi msimamizi na watu wa nyumbani mwake, lakini mstari huu peke yake hauelezi utaratibu wa wokovu wa kila mmoja. Tafsiri inaacha mvutano huo bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Nao wakasema” hudumisha mtiririko wa simulizi; “wewe pamoja na” hulipa uzito tamko la Kigiriki bila kufanya sentensi kuwa ngumu.
