  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: sw
  text: 'Usiku, Paulo alitokewa na maono: mwanaume mmoja wa Makedonia alikuwa amesimama, akimsihi, “Vuka uje Makedonia, utusaidie.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅραμα
  choice: maono
  rationale: Neno la kawaida la Kiswahili kwa ono la ufunuo; halibainishi kama lilikuwa ndoto au tukio la aina nyingine.
- source_word: διὰ νυκτός
  choice: usiku
  rationale: Hueleza wakati maono yalipotokea kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: τῷ Παύλῳ ὤφθη
  choice: Paulo alitokewa na maono
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida maana ya maono kumtokea Paulo bila kutumia kauli tendwa isiyo ya kawaida.
- source_word: ἀνὴρ Μακεδών τις
  choice: mtu mmoja wa Makedonia
  rationale: ‘Mtu mmoja’ huonyesha kutotajwa kwa utambulisho maalumu wa τις, huku ‘wa Makedonia’ ikihifadhi asili au uhusiano wake na eneo hilo.
- source_word: ἑστώς
  choice: alikuwa amesimama
  rationale: Huhifadhi hali ya mtu huyo akiwa amesimama ndani ya tukio la maono.
- source_word: παρακαλῶν
  choice: akimsihi
  rationale: ‘Kusihi’ huonyesha ombi la dhati la msaada bila kulifanya kuwa kali kupita ushahidi wa muktadha.
- source_word: λέγων
  choice: '[imewasilishwa kwa kuanzisha nukuu moja kwa moja]'
  rationale: Katika Kiswahili, baada ya ‘akimsihi,’ nukuu ya moja kwa moja inaweza kufuata kwa kawaida bila kuongeza ‘akisema,’ huku maana ikibaki wazi.
- source_word: Διαβὰς εἰς Μακεδονίαν
  choice: Vuka uje Makedonia
  rationale: Huhifadhi wazo la kuvuka na kulieleza kama ombi la mwendo kuelekea Makedonia kwa Kiswahili cha kawaida.
- source_word: βοήθησον ἡμῖν
  choice: utusaidie
  rationale: Ni ombi la kawaida na lenye nguvu linalolingana na amri ya Kigiriki katika muktadha wa kusihi.
theological_decisions:
- issue: Aina ya tukio linaloelezwa na ὅραμα na ὤφθη
  choice: Kutafsiri kuwa Paulo alitokewa na maono bila kufafanua zaidi hali yake
  alternative: ndoto; msukumo wa ndani; kutokea kwa sura inayoonekana wazi
  rationale: Andiko linataja maono yaliyomtokea Paulo usiku lakini halielezi kwa usahihi namna alivyoyapokea; tafsiri haipaswi kuamua zaidi ya hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi maono, wakati wa usiku, hali ya mtu kusimama, ombi la dhati, na mwito wa kuvuka kwenda Makedonia.
