base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: sw
  text: Kwa hiyo, makanisa yalikuwa yakiimarishwa katika imani[a], na idadi yao ilikuwa ikiongezeka siku baada ya siku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika imani ya Kikristo.” Kifungu cha Kigiriki kinaweza kumaanisha kwamba makanisa yaliimarishwa katika imani ya Kikristo waliyoshiriki—mafundisho na maisha yake—au, kwa maana pana zaidi, yaliimarishwa katika imani.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Kwa hiyo
  rationale: Huonyesha muhtasari au hitimisho linalotokana na simulizi lililotangulia; ‘Kwa hiyo’ ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ἐκκλησίαι
  choice: makanisa
  rationale: Katika Matendo neno hili humaanisha jumuiya za Kikristo za mahali mbalimbali; ‘makanisa’ ndilo neno la kawaida na linaloeleweka wazi katika Kiswahili.
- source_word: ἐστερεοῦντο
  choice: yalikuwa yakiimarishwa
  rationale: Muundo huu unahifadhi hali ya kutendwa na tendo lililokuwa likiendelea katika wakati uliopita, kama inavyoonyeshwa na imperfect passive ya Kigiriki.
- source_word: τῇ πίστει
  choice: katika imani
  rationale: Kifungu hiki kinaweza kuelekeza kwenye imani ya Kikristo inayoshirikishwa na jumuiya au imani kwa maana ya kumtumaini Mungu; tafsiri hii ya asili inaacha uwezekano huo wazi, huku tanbihi ikieleza tofauti hiyo.
- source_word: ἐπερίσσευον
  choice: ilikuwa ikiongezeka
  rationale: Huwasilisha ongezeko lililokuwa likiendelea bila kulifanya kuwa kali zaidi kwa kutumia maana ya ‘kuzidisha’.
- source_word: τῷ ἀριθμῷ
  choice: idadi yake
  rationale: Hueleza wazi kwamba ongezeko lilihusu idadi ya makanisa, kwa Kiswahili cha kawaida; kiwakilishi cha umoja kinapatana na nomino ya ngeli ‘idadi’.
- source_word: καθ’ ἡμέραν
  choice: siku baada ya siku
  rationale: Huhifadhi maana ya tendo lililorudiwa na kuendelea kila siku.
theological_decisions:
- issue: Maana ya πίστις yenye kibainishi
  choice: katika imani, ikiwa na uwezekano wa kurejelea imani ya Kikristo inayoshirikishwa
  alternative: katika kumwamini Mungu, yaani imani binafsi ya waamini
  rationale: Kibainishi na muktadha wa makanisa vinaunga mkono maana ya imani ya Kikristo inayoshirikishwa, lakini Kigiriki pia kinaweza kueleweka kwa maana pana ya imani; hivyo maandishi makuu hayatilii maana moja mkazo kupita kiasi, na tanbihi inahifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye hadhi. Miundo ya ‘yalikuwa yaki-’ na ‘ilikuwa iki-’ imetumiwa kuhifadhi tendo endelevu la vitenzi vya Kigiriki. Kiwakilishi ‘yake’ kinarejelea makanisa kwa pamoja bila kudai kwamba idadi ya makanisa, badala ya waumini wake, ndiyo iliyoongezeka.
