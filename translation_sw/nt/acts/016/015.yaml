  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: sw
  text: Na yeye pamoja na watu wa nyumbani mwake walipobatizwa, alitusihi akisema, “Ikiwa mmeniona kuwa mimi ni mwaminifu kwa Bwana,[a] ingieni nyumbani mwangu mkakae.” Alitushinikiza sana, nasi tukakubali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa mnaniona kuwa mimi ni mwamini wa Bwana.” Kivumishi cha Kigiriki kinaweza kumaanisha “mwaminifu,” “mwenye kutegemeka,” au “mwamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Baada ya
  rationale: Inaonyesha mfuatano wa wakati kwa Kiswahili cha kawaida huku kiunganishi δέ kikibaki bila kutiliwa mkazo usio wa lazima.
- source_word: ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: yeye na watu wa nyumbani mwake kubatizwa
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja na kinamrejelea Lidia kwanza, kirai kinachofuata kinahusisha pia watu wa nyumbani mwake. Kiswahili hutumia wingi kwa kawaida hapa.
- source_word: ὁ οἶκος αὐτῆς
  choice: watu wa nyumbani mwake
  rationale: οἶκος hapa ni jamaa au watu wanaounda nyumba, si jengo lenyewe.
- source_word: παρεκάλεσεν
  choice: akatusihi
  rationale: Neno hili linaweza kumaanisha kuomba, kusihi, au kuhimiza. “Akatusihi” linaonyesha mwaliko wa dhati unaolingana na msisitizo unaofuata.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Ikiwa mmeona kuwa mimi ni mwaminifu kwa Bwana
  rationale: “Mmeona” linawasilisha tathmini waliyokuwa wamefikia bila kufanya usemi usikike kama hukumu rasmi. “Mwaminifu kwa Bwana” linahifadhi maana ya uaminifu au kutegemeka bila kuondoa uwezekano wa maana ya kuwa mwamini.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: ingieni nyumbani mwangu mkakae
  rationale: 'Kauli hii ya kawaida ya Kiswahili inaonyesha vitendo viwili vinavyokusudiwa: kuingia na kukaa katika makao ya Lidia.'
- source_word: παρεβιάσατο ἡμᾶς
  choice: Akatusisitizia mpaka tukakubali
  rationale: παραβιάζομαι huonyesha kusisitiza kwa nguvu hadi ombi likakubaliwa. Tafsiri hii inadumisha nguvu hiyo bila kudokeza kulazimisha kwa mabavu.
theological_decisions:
- issue: Maana inayoweza kuhusishwa na ubatizo wa watu wa nyumbani mwa Lidia
  choice: Kusimulia moja kwa moja kwamba Lidia na watu wa nyumbani mwake walibatizwa
  alternative: Kudokeza ama kwamba watoto wachanga walikuwamo ama kwamba wote walikuwa watu waliokiri imani binafsi
  rationale: Aya haitaji umri wala hali ya imani ya kila mtu wa nyumbani; kwa hiyo tafsiri haipaswi kuamua mjadala wa kimadhehebu ambao simulizi lenyewe halijaamua.
- issue: Maana ya πιστὴν katika maelezo ya Lidia kuhusu yeye mwenyewe
  choice: mwaminifu kwa Bwana
  alternative: mwamini wa Bwana; mwenye kutegemeka mbele za Bwana
  rationale: Kivumishi cha Kigiriki kinaweza kuonyesha uaminifu, kutegemeka, au kuwa mwenye imani. Matini kuu inadumisha maana ya uaminifu, na tanbihi inaonyesha uwezekano mwingine wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. “Watu wa nyumbani mwake” limetumiwa kwa maana ya kijamii ya οἶκος, ilhali “nyumbani mwangu” linarejelea makao halisi. Lugha haiongezi hitimisho la kimadhehebu kuhusu waliobatizwa.
