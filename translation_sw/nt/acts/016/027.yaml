  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: sw
  text: Mlinzi wa gereza alipoamka na kuona milango ya gereza ikiwa wazi[a], alichomoa upanga wake, na alikuwa karibu kujiua[b], akidhani kwamba wafungwa walikuwa wametoroka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo rasmi zaidi, “kuona kwamba milango ya gereza ilikuwa imefunguliwa.” Kigiriki kinakazia hali ya milango baada ya kufunguliwa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki μάχαιρα linaweza kumaanisha upanga au silaha fupi yenye makali, kama vile jambia; “upanga” limetumiwa kama tafsiri ya kawaida katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: alipoamka
  rationale: Muundo huu unaonyesha kuingia katika hali ya kuwa macho; “alipoamka” ni Kiswahili cha kawaida na huunganisha tukio hilo kwa kawaida na kitendo kinachofuata.
- source_word: δεσμοφύλαξ
  choice: mlinzi wa gereza
  rationale: Neno hili humaanisha ofisa mwenye jukumu la kuwalinda wafungwa; “mlinzi wa gereza” ni wazi na la kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: kuona milango ya gereza ikiwa wazi
  rationale: Kauli timilifu tendwa ἀνεῳγμένας inasisitiza hali iliyotokana na kufunguliwa kwa milango; “ikiwa wazi” huwasilisha hali hiyo kwa Kiswahili cha asili bila kudai ni nani aliyeifungua.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: alichomoa upanga wake
  rationale: Kitenzi pamoja na μάχαιρα humaanisha kutoa silaha iliyokuwa imewekwa; “alichomoa upanga wake” ni usemi wa kawaida unaohifadhi maana hiyo.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: akawa karibu kujiua
  rationale: ἤμελλεν huonyesha kitendo kilichokuwa karibu kutokea, na ἀναιρεῖν hapa humaanisha kuua; tafsiri hii ni wazi na ya moja kwa moja.
- source_word: νομίζων
  choice: akidhani
  rationale: Kauli hii inaonyesha dhana aliyofikia kutokana na milango kuwa wazi, bila kuonyesha kwamba alikuwa na uhakika.
- source_word: ἐκπεφευγέναι
  choice: walikuwa wametoroka
  rationale: Kauli timilifu inaonyesha kwamba kwa dhana yake kutoroka kulikuwa tayari kumetokea; muundo wa Kiswahili unahifadhi uhusiano huo wa wakati.
- source_word: τοὺς δεσμίους
  choice: wafungwa
  rationale: Katika muktadha huu neno linawahusu watu waliokuwa kizuizini; “wafungwa” ndilo neno wazi na la kawaida.
