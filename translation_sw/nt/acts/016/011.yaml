translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa vitenzi mfululizo—tuliondoka, tukasafiri, tukaenda—unawakilisha kwa asili mfuatano wa safari katika Kigiriki.
