base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: sw
  text: Basi, tuliondoka kwa meli kutoka Troa, tukasafiri moja kwa moja hadi Samothrake, na siku iliyofuata tukasafiri hadi Neapoli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: tuliondoka kwa meli
  rationale: Katika muktadha wa safari ya baharini, ἀνάγω humaanisha kuondoka kwa meli au kuanza safari baharini. Kiswahili hiki ni cha kawaida na kinaweka wazi maana ya kibaharia.
- source_word: οὖν
  choice: Basi
  rationale: οὖν hapa inaendeleza simulizi na kuunganisha safari hii na yaliyotangulia; “Basi” ni kiunganishi cha kawaida na chenye hadhi katika simulizi la Kiswahili.
- source_word: ἀπὸ Τρῳάδος
  choice: kutoka Troa
  rationale: Kirai kinaonyesha mahali safari ilipoanzia. “Troa” ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: εὐθυδρομήσαμεν
  choice: tukasafiri moja kwa moja
  rationale: Kitenzi hiki humaanisha kusafiri kwa meli kwa njia iliyonyooka au ya moja kwa moja. Muktadha tayari umetaja meli, hivyo tafsiri hii ni ya asili bila kupoteza maana.
- source_word: εἰς Σαμοθρᾴκην
  choice: hadi Samothrake
  rationale: εἰς inaonyesha kituo cha safari; “hadi” huonyesha kwa asili kufika mahali hapo. Jina limetoholewa kwa mfumo unaoeleweka katika Kiswahili.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: na siku iliyofuata
  rationale: Kirai cha wakati kinamaanisha siku iliyofuata, huku δέ ikiendeleza mfuatano wa safari kwa “na.”
- source_word: εἰς Νέαν Πόλιν
  choice: tukaenda Neapoli
  rationale: Kitenzi cha mwendo kinaeleweka kutokana na kishazi kilichotangulia lakini kimewekwa wazi ili sentensi iwe ya kawaida katika Kiswahili. Jina la mahali limetoholewa badala ya kutafsiriwa kuwa “Mji Mpya.”
