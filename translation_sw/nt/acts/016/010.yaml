  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: sw
  text: Paulo alipoona maono hayo, mara moja tulijitahidi kwenda Makedonia, tukihitimisha kwamba Mungu alikuwa ametuita tuwahubirie habari njema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Baada ya
  rationale: Katika mfuatano huu wa simulizi, kishazi kinaonyesha kwamba hatua ya kundi ilifuata baada ya Paulo kuona maono; Kiswahili hiki ni cha asili na hakiongezi msisitizo wa uharaka, ambao tayari unaonyeshwa na εὐθέως.
- source_word: τὸ ὅραμα
  choice: maono hayo
  rationale: “Maono” ndiyo istilahi ya kawaida kwa ono la ufunuo, na “hayo” huyarejelea maono yaliyosimuliwa katika mstari uliotangulia.
- source_word: εἶδεν
  choice: Paulo kuona
  rationale: Kitenzi ni nafsi ya tatu umoja, na mhusika wake ni Paulo kutokana na muktadha. Kutaja Paulo huepusha utata unaoweza kutokea katika Kiswahili bila kuingiza jambo lisilothibitishwa na muktadha.
- source_word: εὐθέως
  choice: mara moja
  rationale: Huwasilisha uharaka wa kitendo kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: ἐζητήσαμεν
  choice: tulijitahidi
  rationale: Katika muktadha huu ζητέω ina maana ya kujielekeza au kufanya juhudi kutimiza jambo, si kutafuta kitu kilichopotea. “Tulijitahidi” huhifadhi wazo hilo kwa lugha ya asili.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: kwenda Makedonia
  rationale: Kirai kinaonyesha kuondoka na kuelekea Makedonia. Kiswahili kwa kawaida husema “kwenda Makedonia”; kutafsiri ἐξέρχομαι neno kwa neno kama “kwenda nje kuingia” kungekuwa kizito na kisicho cha asili.
- source_word: συμβιβάζοντες
  choice: tukihitimisha
  rationale: Hueleza kuunganisha ushahidi wa maono na kufikia hitimisho; umbo la “tuki-” huhifadhi uhusiano wa kishiriki na kitendo kikuu.
- source_word: προσκέκληται
  choice: alikuwa ametuita
  rationale: Huhifadhi wazo la mwito wa Mungu uliotangulia na wenye matokeo katika wakati wa simulizi. “Kuita” lina nguvu inayofaa kuliko “kualika” na haliongezi maelezo ya kimadhehebu.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino hii kama mtendaji wa mwito.
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: tuwahubirie habari njema watu wa huko
  rationale: “Kuhubiri habari njema” huwasilisha tendo la kutangaza ujumbe huo kwa lugha iliyo wazi. “Watu wa huko” hufafanua rejeleo la αὐτούς kwa watu wa Makedonia bila kudai kwamba ni watu wote wa eneo hilo.
theological_decisions:
- issue: Mabadiliko ya simulizi kwenda nafsi ya kwanza wingi (ἡμᾶς; ἐζητήσαμεν)
  choice: Kuhifadhi moja kwa moja “tulijitahidi” na “ametuita.”
  alternative: Kutumia maelezo yasiyo na nafsi au kuficha “sisi.”
  rationale: Maandishi ya Kigiriki yanabadilika wazi kwenda nafsi ya kwanza wingi. Tafsiri inapaswa kuhifadhi sifa hiyo bila kuamua nadharia ya uandishi.
- issue: Mwito wa Mungu katika προσκέκληται ἡμᾶς ὁ θεὸς
  choice: Mungu alikuwa ametuita
  alternative: Mungu alikuwa akituongoza au alikuwa ametualika
  rationale: Kitenzi kinaonyesha kuitwa au kuitwa kuja kwa kusudi fulani. “Ametuita” huhifadhi hatua na uanzilishi wa Mungu bila kuifanya dhaifu wala kuipanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi mwendo wa simulizi, uharaka, nafsi ya kwanza wingi, hitimisho lililotokana na maono, na mwito wa Mungu. Hakuna tanbihi iliyohitajika kwa sababu chaguo za kileksika zinaweza kuwasilishwa wazi katika matini bila kupoteza utata muhimu.
