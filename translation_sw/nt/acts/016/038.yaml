lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: wakawaarifu
  rationale: Kitenzi hiki kinaonyesha kuwasilisha taarifa kwa wenye mamlaka; “wakawaarifu” ni cha kawaida na kinafaa muktadha rasmi.
- source_word: στρατηγοῖς
  choice: mahakimu
  rationale: Katika koloni la Kirumi la Filipi, neno hili linamaanisha viongozi wakuu wa kiraia; “mahakimu” ni sahihi na linaeleweka kwa urahisi kuliko cheo cha kihistoria kisichozoeleka.
- source_word: ῥαβδοῦχοι
  choice: wabeba-fimbo
  rationale: Tafsiri hii inadumisha picha halisi ya maofisa wasaidizi waliobeba fimbo kama ishara ya mamlaka ya mahakimu.
- source_word: τὰ ῥήματα ταῦτα
  choice: maneno hayo
  rationale: Ni tafsiri ya moja kwa moja inayorejelea ujumbe uliotangulia.
- source_word: ἐφοβήθησαν
  choice: wakaogopa
  rationale: Inawakilisha kwa uwazi mwitikio wa hofu bila kuongeza kiwango au sababu isiyotajwa moja kwa moja.
- source_word: ἀκούσαντες
  choice: waliposikia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida uhusiano wa wakati na mazingira kati ya kusikia na kuogopa.
- source_word: Ῥωμαῖοί
  choice: Waroma
  rationale: Kigiriki kinasema kihalisi “Waroma”; katika muktadha wa kisheria neno hilo linadokeza uraia wa Roma, jambo linaloelezwa katika tanbihi.
- source_word: εἰσιν
  choice: Paulo na Sila walikuwa
  rationale: Majina yamewekwa wazi kwa ajili ya Kiswahili cha kawaida, kwa kuwa kiwakilishi cha wingi katika muktadha kinawarejelea Paulo na Sila; wakati uliopita unafuata mtazamo wa simulizi.
