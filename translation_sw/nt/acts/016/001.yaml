id: ACT.16.1
reference: Acts 16:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: sw
  text: Pia akafika Derbe na Listra. Na tazama, huko kulikuwa na mwanafunzi fulani aliyeitwa Timotheo. Alikuwa mwana wa mwanamke Myahudi aliyeamini[a], lakini baba yake alikuwa Mgiriki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa mwaminifu.” Neno la Kigiriki linaweza kumaanisha ama mtu aliyeamini au mtu mwaminifu; hapa katika Matendo, maana ya “aliyeamini” inaelekea zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: Pia akafika
  rationale: Kitenzi kinaeleza kufika mahali, na “pia” kinawasilisha nguvu ya nyongeza ya δὲ καὶ kwa Kiswahili cha kawaida.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: Derbe na Listra
  rationale: Baada ya “akafika,” majina ya mahali yanaeleweka bila kurudia kihusishi; muundo huu ni wa asili katika Kiswahili.
- source_word: καὶ ἰδοὺ
  choice: Na tazama
  rationale: “Tazama” huhifadhi ishara ya kisimulizi inayovuta fikira kwa jambo linalofuata badala ya kuiondoa kimya kimya.
- source_word: μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος
  choice: huko kulikuwa na mwanafunzi fulani aliyeitwa Timotheo
  rationale: “Mwanafunzi fulani” hutambulisha mtu maalumu ambaye hajatajwa kabla, huku “huko” ikihifadhi ἐκεῖ na “aliyeitwa” ikitoa maana ya ὀνόματι kwa lugha ya kawaida.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: Alikuwa mwana wa mwanamke Myahudi aliyeamini
  rationale: “Aliyeamini” kwa uwezekano mkubwa humtambulisha mama yake Timotheo kuwa mwamini; sentensi tofauti huondoa msongamano bila kupoteza uhusiano wa kisarufi.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: lakini baba yake alikuwa Mgiriki
  rationale: Kirai cha Kigiriki kimeacha kitenzi kwa kuwa kinaendelea na wazo la “mwana wa.” Kiswahili kinahitaji kulifafanua kwa namna hii ya asili, huku “lakini” ikihifadhi utofautishaji wa δέ.
- source_word: Ἕλληνος
  choice: Mgiriki
  rationale: Neno hili hapa humaanisha mtu wa Kigiriki; “Mgiriki” ni sahihi zaidi kuliko neno pana “Mmataifa.”
theological_decisions:
- issue: Maana ya πιστῆς kuhusu mama yake Timotheo
  choice: aliyeamini
  alternative: aliyekuwa mwaminifu
  rationale: Katika muktadha wa Matendo, πιστός kwa kawaida humtaja mtu anayeamini. Hata hivyo, maana ya sifa ya kuwa mwaminifu inawezekana kileksika, kwa hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Na tazama” limehifadhiwa kwa makusudi ili kuonyesha msisitizo wa kisimulizi wa ἰδού. Tanbihi ya pili ya safu ya Kiingereza haikuhamishwa kwa sababu inaeleza uhariri wa tafsiri ya Kiingereza, si jambo la matini ya Kigiriki.
