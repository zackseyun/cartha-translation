id: ACT.16.37
reference: Acts 16:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: sw
  text: Lakini Paulo akawaambia, “Baada ya kutupiga hadharani bila kuhukumiwa[a], ingawa sisi ni raia wa Roma[b], walitutupa gerezani; na sasa wanatutoa kwa siri? La hasha! Bali waje wao wenyewe watutoe[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kutiwa hatiani”; katika muktadha huu inaweza pia kueleweka “bila kushtakiwa na kuhukumiwa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “watu wakiwa Waroma”; hapa maana yake ni kwamba walikuwa na uraia wa Roma pamoja na ulinzi wake wa kisheria.
    reason: cultural_note
  - marker: c
    text: Au, “watuongoze nje” au “watutoe nje.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη πρὸς αὐτούς
  choice: akawaambia
  rationale: Ni usemi wa kawaida wa kusimulia unaoonyesha kwamba Paulo aliwaeleza wajumbe hao.
- source_word: Δείραντες ἡμᾶς δημοσίᾳ
  choice: Baada ya kutupiga hadharani
  rationale: Kirai tegemezi cha wakati kinaonyesha tendo lililotangulia; 'kupiga' hakiongezi umahususi wa aina ya adhabu usiolazimishwa na kitenzi, na 'hadharani' inawakilisha δημοσίᾳ kwa kawaida.
- source_word: ἀκατακρίτους
  choice: bila kuhukumiwa
  rationale: Neno linamaanisha kwamba hukumu ya kimahakama haikuwa imetolewa. Hili linakaa karibu na Kigiriki kuliko 'bila kesi,' huku tanbihi ikitaja uwezekano huo wa kimuktadha.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: ingawa sisi ni raia wa Roma
  rationale: Katika muktadha huu usemi unahusu hadhi yao ya kisheria na haki zake. Muundo wa concessive ni wa asili katika Kiswahili na unaonyesha uzito wa malalamiko hayo.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: walitutupa gerezani
  rationale: '''Kutupa'' inadumisha nguvu ya βάλλω kuliko ''kutuweka''.'
- source_word: λάθρᾳ
  choice: kwa siri
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo linalofanywa kisiri.
- source_word: ἡμᾶς ἐκβάλλουσιν
  choice: wanataka kututoa
  rationale: Wakati wa sasa na swali la kejeli vinaonyeshwa kwa Kiswahili cha asili; 'kututoa' linafaa katika muktadha wa kuwaondoa gerezani bila sherehe.
- source_word: οὐ γάρ
  choice: La hasha!
  rationale: Usemi huu unatoa katazo kali na la heshima linalolingana na msisitizo wa Kigiriki.
- source_word: ἐλθόντες αὐτοὶ ἡμᾶς ἐξαγαγέτωσαν
  choice: waje wao wenyewe watutoe
  rationale: '''Wao wenyewe'' inadumisha msisitizo wa αὐτοί, na ''watutoe'' inaweza kumaanisha kuwatoa au kuwaongoza nje bila kulazimisha wazo la kusindikiza rasmi.'
theological_decisions:
- issue: Nguvu ya kisheria ya hadhi ya Kirumi
  choice: raia wa Roma
  alternative: Waroma; watu wa Roma
  rationale: Hoja ya Paulo inategemea hadhi ya uraia na ulinzi wake wa kisheria, si asili ya kikabila au mahali pa kuishi tu.
- issue: Maana ya ἀκατακρίτους
  choice: bila kuhukumiwa
  alternative: bila kushtakiwa na kuhukumiwa; bila kesi
  rationale: Tafsiri kuu inadumisha dai mahsusi kwamba hawakuwa wamepata hukumu ya mahakama, bila kuamua kimya kimya hatua zote za kisheria zilizokosekana.
- issue: Namna ya kueleza ἐξαγαγέτωσαν
  choice: watutoe
  alternative: watuongoze nje; waje kutuchukua
  rationale: Neno linaweza kumaanisha kutoa au kuongoza nje. Tafsiri kuu inadumisha upana huo, na tanbihi inaonyesha njia nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'La hasha' limetumiwa kwa ukataaji mkali lakini wa kifasihi unaoeleweka; sentensi inadumisha sauti ya kisheria na msisitizo wa Paulo bila kuongeza istilahi za kimadhehebu.
