  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: sw
  text: Siku ya Sabato tulitoka nje ya lango, tukaenda kando ya mto, ambako tulidhani palikuwa na mahali pa kusali.[a] Baada ya kuketi, tulikuwa tukizungumza na wanawake waliokusanyika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambako tulidhani palikuwa na sala.” Neno la Kiyunani linaweza kumaanisha sala yenyewe au mahali palipotengwa kwa ajili ya kusali; hapa muktadha unapendelea “mahali pa kusali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: Siku ya Sabato
  rationale: Ni namna ya asili ya Kiswahili ya kuwasilisha nahau ya Kiyunani inayomaanisha siku ya Sabato.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης παρὰ ποταμόν
  choice: tulitoka nje ya lango, tukaenda kando ya mto
  rationale: Huhifadhi mwendo wa kutoka kupitia lango na kuelekea eneo lililo kando ya mto bila kuongeza neno 'mji,' ambalo halipo wazi katika Kiyunani.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: mahali tulipodhani palikuwa mahali pa kusali
  rationale: νομίζω ni 'kudhani'; προσευχή inaweza kumaanisha kusali au mahali palipotengwa kwa ajili ya kusali. Muktadha wa mahali kando ya mto unapendelea maana ya mahali pa kusali.
- source_word: καὶ καθίσαντες ἐλαλοῦμεν
  choice: Tuliketi, tukaanza kuzungumza
  rationale: Kuketi kunatangulia tendo kuu, na kitenzi cha wakati usiotimilika kinaonyesha shughuli iliyoendelea; 'tukaanza kuzungumza' ni Kiswahili cha kawaida kinacholeta mtiririko huo wa simulizi.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: na wanawake waliokuwa wamekusanyika huko
  rationale: Huwasilisha wanawake waliokuwa tayari wamekutana mahali hapo kabla ya mazungumzo.
theological_decisions:
- issue: Maana ya προσευχή katika mazingira haya
  choice: mahali pa kusali
  alternative: kusali; sinagogi
  rationale: Neno linaweza kutaja sala yenyewe au mahali pa sala. Muktadha unapendelea mahali pa kusali, lakini 'sinagogi' lingekuwa tafsiri ya kiufafanuzi zaidi kuliko neno la Kiyunani linavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umegawanywa katika sentensi mbili ili usomeke kwa urahisi, huku uhusiano na mfuatano wa matendo ya Kiyunani ukihifadhiwa.
