id: ACT.16.3
reference: Acts 16:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: sw
  text: Paulo alitaka Timotheo aandamane naye katika safari[a]. Baada ya kumchukua, akamtahiri kwa sababu ya Wayahudi waliokuwa katika maeneo yale[b], kwa maana wote walijua kwamba baba yake alikuwa Mgiriki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “atoke pamoja naye”; hapa usemi huo unaweza kumaanisha kuondoka ili kusafiri pamoja naye.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya Wayahudi” au “kwa sababu ya Wayahudi.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki ni “Mgiriki”; katika muktadha huu huenda linaonyesha kwamba baba ya Timotheo hakuwa Myahudi.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: Timotheo
  rationale: Kiwakilishi elekezi kinamrejelea Timotheo aliyetajwa katika muktadha uliotangulia. Kutaja jina lake huondoa utata unaoweza kutokana na mwanzo wa Kiswahili ‘huyu,’ bila kubadili rejeo.
- source_word: ἠθέλησεν
  choice: alitaka
  rationale: Huwasilisha kwa lugha ya kawaida nia au shauku ya Paulo bila kuongeza wazo la amri.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: aandamane naye katika safari
  rationale: Ingawa maana halisi ni ‘atoke pamoja naye,’ katika muktadha huu ἐξέρχομαι inahusu kuondoka ili kusafiri; ‘aandamane naye katika safari’ ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: λαβὼν
  choice: akamchukua
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia kutahiriwa; mfuatano wa ‘basi akamchukua na’ ni wa asili katika simulizi la Kiswahili.
- source_word: περιέτεμεν
  choice: kumtahiri
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya tendo la kutahiri, bila kutumia lugha ya kuficha maana.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: kwa sababu ya Wayahudi
  rationale: διά pamoja na hali ya accusative huonyesha sababu au msukumo; ‘kwa sababu ya’ huhifadhi kutokuwazi iwapo tendo lilikuwa kwa manufaa yao au kutokana na shinikizo la hali.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: waliokuwa katika maeneo yale
  rationale: ‘Maeneo’ ni ya asili zaidi katika Kiswahili kuliko ‘mahali pale’ kwa kurejelea sehemu mbalimbali za eneo hilo.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: kwa maana wote walijua
  rationale: ‘Kwa maana’ huonyesha kazi ya γάρ ya kutoa maelezo, na ‘wote’ huhifadhi msisitizo wa ἅπαντες.
- source_word: Ἕλλην
  choice: Mgiriki
  rationale: Huhifadhi jina la kikabila na kitamaduni la Kigiriki badala ya kulipanua moja kwa moja kuwa ‘Mmataifa.’
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: baba yake alikuwa
  rationale: ‘Alikuwa’ ni njia ya kawaida na sahihi ya kuwasilisha ὑπῆρχεν hapa bila kuongeza dhana ya asili au hali ya bahati.
theological_decisions:
- issue: Sababu ya kutahiriwa kwa Timotheo kuhusiana na Wayahudi wa eneo hilo
  choice: Tendo linaelezwa kuwa lilifanywa kwa sababu ya Wayahudi waliokuwa katika maeneo yale na ufahamu wao kuhusu baba ya Timotheo.
  alternative: Kulisoma tendo hilo ama kama uthibitisho kwamba tohara ni lazima kitheolojia, ama kama mbinu ya kimisionari pekee.
  rationale: Aya yenyewe inataja sababu ya tendo lakini haitoi hitimisho pana kuhusu wokovu, hadhi ya agano, au sera ya kimisionari. Tafsiri inahifadhi maelezo na mvutano wa simulizi bila kuamua jambo ambalo aya haisemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa simulizi umetumiwa ili aya isomeke kwa urahisi. Alama zote za tanbihi zimewekwa katika matini mara baada ya maneno yanayohusika.
