  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: sw
  text: Lakini Paulo akapaza sauti, akisema, “Usijidhuru hata kidogo, kwa maana sisi sote tupo hapa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: akapaza sauti
  rationale: Kitenzi hiki katika hali ya dharura kinaonyesha kuita kwa nguvu; ‘akapaza sauti’ ni usemi wa kawaida wa Kiswahili unaowasilisha ukali wa sauti bila kurudia wazo la sauti kubwa.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na hatua ambayo mlinzi wa gereza alikuwa karibu kuchukua katika mstari uliotangulia.
- source_word: φωνῇ μεγάλῃ
  choice: akapaza sauti
  rationale: Kirai hiki cha namna kimeunganishwa na kitenzi ili kutoa Kiswahili cha asili; maana ya kusema kwa sauti kubwa imehifadhiwa.
- source_word: λέγων
  choice: akisema
  rationale: Hutambulisha maneno ya Paulo na kuhifadhi muundo wa kishiriki kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Usijidhuru hata kidogo
  rationale: Amri hasi na nguvu ya kujitendea zimewasilishwa wazi. ‘Hata kidogo’ linaakisi μηδέν, huku ‘usijidhuru’ likitoa kwa kawaida maana ya kutokujifanyia jambo baya katika muktadha wa jaribio la kujiumiza.
- source_word: ἅπαντες
  choice: sisi sote
  rationale: Husisitiza kwamba wafungwa wote, bila mmoja kukosekana, walikuwapo.
- source_word: γάρ
  choice: kwa maana
  rationale: Huonyesha sababu ya mlinzi kutopaswa kujidhuru kwa mtindo wenye hadhi na unaoeleweka.
- source_word: ἐνθάδε
  choice: hapa
  rationale: Ni kielezi cha mahali kinachotafsiriwa kwa kawaida na moja kwa moja.
- source_word: ὁ Παῦλος
  choice: Paulo
  rationale: Jina limetolewa kwa umbo lake sanifu la Kiswahili.
