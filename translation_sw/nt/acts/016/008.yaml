  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: sw
  text: Baada ya kuipita Misia[a], wakashuka hadi Troa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya kupita katika Misia” au “wakipita kando ya Misia.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa njia hizi zinazokaribiana; maana ni kwamba waliendelea na safari badala ya kusimama huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: wakapita
  rationale: Kitenzi hiki katika umbo la aoristi, kikiwa na jina la eneo katika hali ya accusative, kinaweza kumaanisha kupita eneo hilo, kulipitia, au kulipita kando. “Wakapita” ni Kiswahili cha kawaida kinachohifadhi mwendo wa kuendelea bila kulazimisha njia hususa.
- source_word: δὲ
  choice: Basi
  rationale: Ni kiunganishi chepesi cha simulizi. “Basi” kinaendeleza mtiririko kutoka mstari uliotangulia bila kudokeza tofauti kali.
- source_word: Μυσίαν
  choice: Misia
  rationale: Jina la eneo limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: κατέβησαν
  choice: kushuka
  rationale: Neno hili lina maana ya kwenda au kushuka chini. “Kushuka” linahifadhi mwelekeo wa kijiografia kuelekea Troa kwa lugha ya kawaida.
- source_word: εἰς
  choice: mpaka
  rationale: Katika muktadha wa kufika mahali panapolengwa, “mpaka” linaeleza kwa kawaida kwamba Troa ilikuwa mwisho wa safari hii.
- source_word: Τρῳάδα
  choice: Troa
  rationale: Jina la mji limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili cha Biblia.
