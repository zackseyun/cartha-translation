  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: sw
  text: Walipotoka gerezani, walienda kwa Lidia. Walipowaona ndugu,[a] waliwatia moyo, kisha wakaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike.” Neno la Kigiriki lina umbo la wingi wa kiume, lakini linaweza kurejelea waamini wenzao wakiwa kundi la wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες ἀπὸ τῆς φυλακῆς
  choice: Walipotoka gerezani
  rationale: Kirai cha wakati kinaonyesha tendo lililotangulia; Kiswahili cha kawaida huunganisha maana hiyo kwa “walipotoka.” “Gerezani” humaanisha kutoka katika gereza linalojulikana katika muktadha.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: walienda kwa Lidia
  rationale: Muundo huu unaonyesha kwenda kumtembelea Lidia. “Kwa Lidia” ni usemi wa kawaida unaoweza kumaanisha nyumbani au mahali alipo bila kuongeza neno “nyumbani,” ambalo halipo wazi katika Kigiriki.
- source_word: ἰδόντες
  choice: Walipowaona
  rationale: Kirai cha wakati kinatafsiriwa kwa muundo wa Kiswahili unaoonyesha kwamba kuwatia moyo kulifuata baada ya kuwaona.
- source_word: παρεκάλεσαν
  choice: waliwatia moyo
  rationale: παρακαλέω hapa ina maana pana ya kuimarisha au kutia moyo waamini; tafsiri hii haibani maana kuwa faraja ya kihisia pekee wala mawaidha rasmi pekee.
- source_word: τοὺς ἀδελφούς
  choice: ndugu
  rationale: “Ndugu” hudumisha taswira ya kifamilia ya neno la Kigiriki na katika Kiswahili linaweza kurejelea waamini wa kiume au kundi lenye wanaume na wanawake.
- source_word: ἐξῆλθαν
  choice: wakaondoka
  rationale: Kitenzi hiki cha simulizi kinaonyesha kuondoka kwao baada ya kuwatia moyo waamini; “wakaondoka” ni cha kawaida na huendeleza mfuatano wa matendo.
theological_decisions:
- issue: Je, τοὺς ἀδελφούς inarejelea wanaume pekee au waamini wa jinsia zote?
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waamini
  rationale: Neno la Kigiriki ni wingi wa kiume lakini mara nyingi hujumuisha jumuiya nzima ya waamini. “Ndugu” linaakisi umbo na lugha ya kifamilia ya chanzo huku tanbihi ikihifadhi uwezekano wa maana jumuishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa kwa mtiririko wa kawaida wa simulizi, huku uhusiano wa wakati na mfuatano wa matendo ukihifadhiwa.
