base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: sw
  text: Walipokuwa wakipita katika miji, waliwakabidhi maamuzi[a] yaliyokwisha kuamuliwa na mitume na wazee waliokuwa Yerusalemu, ili wayazingatie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maagizo rasmi”; Kigiriki dogmata, yaani maamuzi yenye mamlaka yaliyotolewa na baraza la Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: walipokuwa wakipita
  rationale: Kauli ya wakati usiotimilika inaonyesha mwendo uliokuwa ukiendelea kutoka mahali hadi mahali; usemi huu ni wa kawaida na unafaa kwa kupita katika miji kadhaa.
- source_word: παρεδίδοσαν
  choice: waliwakabidhi
  rationale: Kitenzi kinaonyesha kuwasilisha rasmi jambo lenye mamlaka, si kutoa habari kwa njia ya kawaida tu.
- source_word: αὐτοῖς
  choice: wa- katika “waliwakabidhi”
  rationale: Kiambishi cha yambwa huhifadhi kiwakilishi cha Kigiriki bila kutaja wazi waamini au makanisa, jambo ambalo mstari wenyewe haulifanyi.
- source_word: φυλάσσειν
  choice: ili wayazingatie
  rationale: Katika muktadha huu φυλάσσω humaanisha kuyashika na kuyafuata kwa uangalifu; “kuzingatia” ni Kiswahili cha sasa na cha asili.
- source_word: δόγματα
  choice: maamuzi
  rationale: Neno linarejelea maamuzi rasmi ya baraza la Yerusalemu. “Maamuzi” ni wazi kwa wasomaji wa sasa na halileti dhana ya baadaye ya kitekniki ya dogma.
- source_word: κεκριμένα
  choice: yaliyokuwa yamefanywa
  rationale: Muundo timilifu wa kutendwa unaonyesha maamuzi yaliyokwisha kufikiwa na kuendelea kuwa na nguvu.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: mitume na wazee
  rationale: Haya ndiyo maneno yaliyozoeleka na yanayoeleweka kwa viongozi hawa katika Matendo.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: waliokuwa Yerusalemu
  rationale: Huhifadhi wazi kwamba kifungu hiki kinawaelezea mitume na wazee kwa kuwataja mahali walipokuwa.
- source_word: ὡς δὲ
  choice: Walipokuwa
  rationale: Huonyesha uhusiano wa wakati na kuendeleza simulizi kwa Kiswahili cha asili bila kuongeza kiunganishi kisichohitajika.
theological_decisions:
- issue: Mamlaka ya maamuzi ya baraza la Yerusalemu
  choice: maamuzi
  alternative: amri rasmi
  rationale: “Maamuzi” yanaonyesha matokeo ya uamuzi wa pamoja na, pamoja na “yamefanywa na mitume na wazee” na agizo la kuyazingatia, yanahifadhi uzito wake wa kimamlaka bila kuingiza maana ya baadaye ya kitekniki ya dogma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi wahusika, mwendo unaoendelea, na kusudi la kuyazingatia maamuzi.
