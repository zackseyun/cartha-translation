  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: sw
  text: Naye baada ya kuwatoa nje, akasema, “Mabwana[a], ni lazima nifanye nini ili niokolewe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “Mabwana” ni namna ya heshima ya kuwaita Paulo na Sila, si cheo cha kimungu “Bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: baada ya kuwatoa nje
  rationale: Kirai hiki kinaonyesha tendo lililotangulia kabla ya kusema; Kiswahili hiki ni cha kawaida na kinahifadhi mpangilio wa matendo pamoja na wazo la kuwapeleka kutoka ndani kwenda nje.
- source_word: ἔφη
  choice: akasema
  rationale: Ingawa kitenzi cha Kigiriki kiko katika hali ya imperfect, hapa kinatumika kama utangulizi wa kawaida wa maneno katika simulizi; “akasema” ni ya asili katika Kiswahili.
- source_word: Κύριοι
  choice: Mabwana
  rationale: Ni wingi wa mwito wa heshima kwa Paulo na Sila. “Mabwana” huhifadhi maana ya kijamii ya heshima bila kuichukulia kama cheo cha kimungu.
- source_word: τί με δεῖ ποιεῖν
  choice: nifanye nini
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha ulazima unaombana na msemaji katika δεῖ bila kuwa mzito kama “ni lazima nifanye nini.”
- source_word: ἵνα σωθῶ
  choice: ili niokolewe
  rationale: “Ili” huhifadhi uhusiano wa kusudi au matokeo wa ἵνα, na “niokolewe” huhifadhi hali ya kutendwa ya σωθῶ.
theological_decisions:
- issue: Maana ya σωθῶ katika swali la mlinzi wa gereza
  choice: niokolewe
  alternative: niokolewe hatarini / nipate wokovu
  rationale: Katika Matendo, σώζω inaweza kumaanisha kuokolewa hatarini au kupata wokovu kwa maana pana ya kiroho. Muktadha na jibu la mstari unaofuata vinaelekeza kwenye wokovu, lakini “niokolewe” huhifadhi upana na mvutano wa neno bila kuingiza mfumo mwembamba wa kimafundisho.
- issue: Maana ya Κύριοι kama namna ya kuwaita Paulo na Sila
  choice: Mabwana
  alternative: Bwana zangu
  rationale: Hapa ni namna ya heshima ya kuwataja watu wawili, si matumizi ya “Bwana” kama cheo cha Mungu. Wingi “Mabwana” unaonyesha hilo wazi, huku tanbihi ikizuia mkanganyiko wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi la kawaida na unaeleweka kwa urahisi. Kiashiria cha tanbihi [a] kimewekwa mara moja baada ya neno linalohusika.
