review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the prior action ('baada ya kuwatoa nje'), the respectful plural address, and the passive sense of σωθῶ in 'niokolewe.' However, 'nifanye nini' by itself does not express the necessity carried by δεῖ ('must/is necessary').
  naturalness: The narrative is fluent Standard East African Swahili. 'Ni lazima nifanye nini' is natural, clear, and restores the necessary modal force without undue heaviness. 'Mabwana' is an acceptable formal respectful plural address in this context.
  terminology: '''Mabwana'' appropriately renders Κύριοι as a human respectful address rather than the divine title. ''Niokolewe'' preserves the passive and the broad salvation/deliverance sense of σωθῶ; it should not be narrowed doctrinally.'
  issues:
  - severity: medium
    issue: The modal force of δεῖ is omitted.
    rationale: The Greek asks literally what it is necessary for the speaker to do. The draft's 'nifanye nini' can ask simply what action to take, without conveying 'must.' Adding 'Ni lazima' supplies this required sense.
