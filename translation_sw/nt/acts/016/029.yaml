lexical_decisions:
- source_word: δὲ
  choice: Kisha
  rationale: Hapa kiunganishi kinaendeleza simulizi bila kuonyesha upinzani mkubwa.
- source_word: αἰτήσας φῶτα
  choice: baada ya kuomba taa
  rationale: Huhifadhi kitendo kilichotangulia kuingia kwake; “taa” linaacha wazi aina ya vyombo vya mwanga kama ilivyo katika wingi φῶτα.
- source_word: εἰσεπήδησεν
  choice: aliingia ndani kwa haraka
  rationale: Huwasilisha mwendo wa ghafla na wenye nguvu bila kudai kwamba aliruka kihalisi.
- source_word: ἔντρομος γενόμενος
  choice: huku akitetemeka kwa hofu
  rationale: Ni Kiswahili cha kawaida kinachobeba hali ya kuogopa pamoja na kutetemeka kwa mwili.
- source_word: προσέπεσεν τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: akaanguka mbele ya Paulo na Sila
  rationale: Huhifadhi tendo la kuanguka mbele yao bila kuongeza maelezo kwamba alikuwa miguuni pao au kwamba aliwaabudu.
theological_decisions:
- issue: Maana ya kuanguka mbele ya Paulo na Sila
  choice: akaanguka mbele ya Paulo na Sila
  alternative: akawasujudia Paulo na Sila
  rationale: Kitenzi kinaweza kuonyesha kuanguka kwa hofu, kusihi, au heshima; muktadha haulazimishi maana ya ibada. Tafsiri inaacha upeo huo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa simulizi ni wa kawaida kwa wasomaji wengi, huku maana ya mwendo wa ghafla, hofu, na tendo lisilobainishwa kuwa ibada ikihifadhiwa.
