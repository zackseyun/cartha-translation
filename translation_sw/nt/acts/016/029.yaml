  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: sw
  text: Kisha, baada ya kuomba taa, aliingia ndani kwa haraka, naye huku akitetemeka kwa hofu, akaanguka mbele ya Paulo na Sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajitupa chini mbele ya Paulo na Sila.” Maneno haya yanaonyesha kuanguka mbele yao kwa hofu, kusihi, au heshima; si lazima yawe na maana ya kuwaabudu.
