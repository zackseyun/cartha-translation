  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: sw
  text: Nao, baada ya kuwapeleka mbele ya mahakimu[a], wakasema, “Watu hawa wanavuruga mji wetu, wakiwa Wayahudi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapretori,” maafisa wakuu wa kiraia katika koloni la Roma kama Filipi.
    reason: cultural_note
  - marker: b
    text: Au “watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au watu kutoka Yudea; hapa “Wayahudi” linafaa zaidi katika shtaka la kikabila na kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: baada ya kuwapeleka
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kusema; muundo huu ni wa asili katika Kiswahili na unahifadhi mfuatano huo.
- source_word: στρατηγοῖς
  choice: mahakimu
  rationale: Katika Filipi, koloni la Roma, neno hili linawahusu maafisa wakuu wa kiraia wenye mamlaka ya kuhukumu. “Mahakimu” ni wazi kwa msomaji wa sasa, huku istilahi ya kihistoria ikielezwa katika tanbihi.
- source_word: ἐκταράσσουσιν
  choice: wanaleta vurugu
  rationale: Neno linaeleza kusababisha msukosuko au fujo kubwa; “wanaleta vurugu” ni Kiswahili cha kawaida kinachohifadhi shtaka la tendo linaloendelea.
- source_word: ἡμῶν τὴν πόλιν
  choice: katika mji wetu
  rationale: “Mji wetu” huhifadhi msisitizo wa wadai kuhusu umiliki na utambulisho wao wa kiraia.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Katika mazingira haya ya ughaibuni, neno linaelekea kutaja utambulisho wa kikabila na kidini wa Paulo na Sila, badala ya asili ya kijiografia pekee.
- source_word: ὑπάρχοντες
  choice: wao ni
  rationale: Muundo huu unahifadhi uhusiano wa karibu kati ya shtaka na utambulisho wao bila kuongeza wazi sababu kama “kwa sababu,” ambayo Kigiriki hakuitamki moja kwa moja.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Watu hawa
  rationale: Huwataja Paulo na Sila kwa kawaida na kwa uwazi katika Kiswahili; muktadha tayari unaonyesha kwamba ni wanaume.
theological_decisions:
- issue: Tafsiri ya Ἰουδαῖοι katika shtaka nyeti la kikabila na kidini
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: “Wayahudi” inafaa zaidi kwa shtaka linalohusu utambulisho wao wa kikabila na kidini katika Filipi. Maneno haya ni ya washtaki, si hukumu ya msimulizi dhidi ya Wayahudi kwa ujumla.
- issue: Uhusiano wa ὑπάρχοντες na shtaka kuu
  choice: wao ni Wayahudi
  alternative: kwa sababu wao ni Wayahudi
  rationale: Kigiriki kinaweza kudokeza msingi wa shtaka, lakini hakitumii kiunganishi cha sababu kilicho wazi. Tafsiri imehifadhi mvutano huo bila kuufanya uhusiano wa kisababishi kuwa dhahiri kupita chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mahakimu” huepuka istilahi nzito ya kihistoria katika matini kuu, na “wanaleta vurugu” huwasilisha uzito wa shtaka kwa lugha inayoeleweka kwa urahisi.
