  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. “Mkatale” limetumiwa kwa usahihi wa kihistoria, huku tanbihi ikilifafanua kwa wasomaji ambao huenda hawalifahamu.
