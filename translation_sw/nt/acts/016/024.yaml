  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: sw
  text: Naye, baada ya kupokea amri hiyo, akawatupa katika sehemu ya ndani ya gereza[a], akawafunga miguu yao imara katika mkatale[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya ndani kabisa ya gereza.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika kitu cha mbao”; katika muktadha huu ni kifaa cha mbao kilichotumiwa kuifunga miguu ya wafungwa.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: amri hiyo
  rationale: Kirai hiki humaanisha amri au agizo lililotolewa na mwenye mamlaka. “Amri hiyo” ni ya kawaida na inaonyesha kuwa ni maagizo yaliyotajwa katika muktadha uliotangulia.
- source_word: λαβὼν
  choice: baada ya kupokea
  rationale: Kauli hii ya wakati uliopita inaonyesha tendo lililotangulia kitendo kikuu; “baada ya kupokea” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἔβαλεν
  choice: akawatupa
  rationale: Kitenzi kina maana ya kutupa au kuweka. “Akawatupa” kinadumisha uzito na ukali wa jinsi walivyotendewa katika simulizi.
- source_word: ἐσωτέραν φυλακήν
  choice: sehemu ya ndani ya gereza
  rationale: ἐσωτέραν ni umbo la kulinganisha lenye maana ya ndani zaidi. Tafsiri hii ni ya asili kwa Kiswahili na inaonyesha eneo salama zaidi ndani ya gereza bila kulazimisha maana ya ndani kabisa.
- source_word: ἠσφαλίσατο
  choice: akaifunga ... imara
  rationale: Kitenzi humaanisha kukaza au kuweka salama. Kirai hiki kinaeleza kwamba miguu yao ilifungwa kwa namna isiyoweza kuachia kwa urahisi.
- source_word: τοὺς πόδας αὐτῶν
  choice: miguu yao
  rationale: πούς humaanisha mguu; wingi wake umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: εἰς τὸ ξύλον
  choice: katika mkatale
  rationale: ξύλον humaanisha kihalisi mbao au kitu cha mbao, lakini hapa muktadha unaonyesha kifaa cha mbao cha kuwazuia wafungwa kwa kuifunga miguu yao. “Mkatale” ni neno mahususi linalofaa katika muktadha huu.
