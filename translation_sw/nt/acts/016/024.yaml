  naturalness: '“Akaifunga miguu yao imara katika mkatale” kina utata wa kisarufi na kimtindo: kiambishi cha yambwa -i- hakina rejeleo lililo wazi katika mpangilio huu, na “imara” hutumika kwa hali isiyo laini hapa. “Akawafunga miguu yao imara katika mkatale” ni wazi, sahihi, na ya kisasa.'
