  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: sw
  text: Ikawa, tulipokuwa tukienda mahali pa sala, msichana mtumwa fulani aliyekuwa na roho ya Pythoni[a] alikutana nasi. Alikuwa akiwapatia mabwana zake faida kubwa kwa kupiga ramli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ya uaguzi.” Kigiriki kinasema “roho ya Pythoni,” istilahi maalumu ya kitamaduni iliyohusishwa na utabiri wa kiuguzi.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa kufanya uaguzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ikawa
  rationale: Ni kiunganishi cha kawaida cha simulizi kinachoanzisha tukio bila kutumia lugha ya kizamani.
- source_word: πορευομένων ἡμῶν
  choice: tulipokuwa tukienda
  rationale: Huonyesha kitendo kilichokuwa kikiendelea wakati tukio kuu lilipotokea.
- source_word: εἰς τὴν προσευχὴν
  choice: mahali pa sala
  rationale: Katika muktadha huu inaelekea kurejelea mahali maalumu pa kukutania kwa ajili ya sala, si tendo la kusali pekee.
- source_word: παιδίσκην τινά
  choice: kijakazi fulani
  rationale: “Kijakazi” huonyesha msichana au mwanamke kijana aliyekuwa chini ya mamlaka ya mabwana; kutajwa kwa mabwana na faida yao kunafanya hali yake ya utumwa iwe muhimu.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: aliyekuwa na roho wa Chatu
  rationale: Huhifadhi istilahi mahususi ya Kigiriki inayohusishwa na Python na ubashiri, badala ya kuibadili moja kwa moja kuwa tafsiri yake.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: tukakutana na
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kukutana kwao kama tukio kuu la sentensi.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: alikuwa akiwapatia ... faida kubwa
  rationale: Huwasilisha manufaa makubwa ya kifedha pamoja na hali endelevu ya kitenzi cha Kigiriki.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: mabwana zake
  rationale: Katika muktadha huu κύριοι ni watu waliokuwa wakimtawala na kunufaika na kazi yake, si jina la Mungu.
- source_word: μαντευομένη
  choice: kwa kupiga ramli
  rationale: Ni usemi wa sasa na unaoeleweka kwa urahisi unaomaanisha kufanya ubashiri wa kimantiki au wa kiuganga.
theological_decisions:
- issue: Jinsi ya kutafsiri πνεῦμα πύθωνα, usemi wenye mazingira maalumu ya kitamaduni
  choice: roho wa Chatu
  alternative: roho wa uaguzi
  rationale: Maandishi makuu yanahifadhi taswira mahususi ya chanzo cha Kigiriki na tanbihi inaeleza maana yake ya kiutendaji bila kuondoa mvutano wa kitamaduni.
- issue: Iwapo παιδίσκη ionyeshe wazi hadhi ya utumwa
  choice: kijakazi
  alternative: msichana mtumishi
  rationale: Muktadha wa mabwana wengi wanaopata faida kupitia kwake unaonyesha utegemezi na unyonyaji; “kijakazi” ni neno la Kiswahili lenye hadhi inayofaa na linaloonyesha hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. “Roho wa Chatu” imewekwa kwa herufi kubwa ili Chatu ieleweke kama jina la kitamaduni (Python), si nyoka wa kawaida; tanbihi inalinda ufafanuzi unaosomeka.
