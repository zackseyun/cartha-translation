base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: sw
  text: Ghafla kulitokea tetemeko kubwa la ardhi, hata misingi ya gereza ikatikisika. Mara moja milango yote ikafunguliwa, na vifungo vya kila mtu vikalegezwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “minyororo ya kila mtu ikalegezwa.” Neno la Kigiriki δεσμά linaweza kumaanisha “vifungo” au “minyororo,” na ἀνέθη linaweza kutafsiriwa “vikalegezwa” au “vikafunguliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: Ghafla
  rationale: Neno hili linaonyesha tukio la kushtukiza; “ghafla” ni la kawaida na lenye nguvu ya kisimulizi katika Kiswahili.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: kukawa na tetemeko kubwa la ardhi
  rationale: Muundo wa Kigiriki unaelezwa kwa kawaida kwa “kukawa na”; “tetemeko kubwa la ardhi” linahifadhi μέγας bila kulifasiri kupita kiasi.
- source_word: ὥστε σαλευθῆναι
  choice: hata ... ikatikisika
  rationale: ὥστε inaonyesha matokeo; “hata” linaunganisha tetemeko na matokeo yake kwa Kiswahili cha asili.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: misingi ya gereza
  rationale: θεμέλια ni sehemu za msingi za jengo, na “gereza” ni neno sanifu na linaloeleweka kwa mahali pa kuwafungia watu.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: milango yote ikafunguka
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, Kiswahili cha kawaida hutumia hali ya kujitenda hapa bila kudai wazi aliyeyafungua; maana ya milango kuwa wazi inahifadhiwa.
- source_word: παραχρῆμα
  choice: Mara hiyo
  rationale: Kirai hiki kinaonyesha kuwa jambo lilitokea papo hapo na kinafaa katika usimulizi wenye hadhi.
- source_word: πάντων
  choice: kila mtu
  rationale: Hiki kinaonyesha kwamba vifungo vya wafungwa wote vilihusika, kwa mtindo mfupi na wa kawaida.
- source_word: τὰ δεσμὰ
  choice: vifungo
  rationale: δεσμά linaweza kumaanisha minyororo au vifaa vingine vya kumfunga mtu; “vifungo” huhifadhi upana huo wa maana.
- source_word: ἀνέθη
  choice: vikalegezwa
  rationale: ἀνίημι hapa humaanisha kulegeza au kufungua kifungo; “vikalegezwa” huhifadhi hali ya kutendwa na haiongezi dai kwamba wafungwa walikuwa tayari wameachiliwa kabisa.
