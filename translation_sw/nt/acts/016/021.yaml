  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: sw
  text: na wanatangaza desturi ambazo sisi, kwa kuwa ni Waroma, haturuhusiwi kisheria kuzikubali wala kuzifuata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukiwa Waroma” au “kama Waroma.” Kirai cha Kigiriki kinaonyesha sababu ambayo washtaki wanatoa ya kukataa desturi hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki kinaendeleza shtaka lililoanza katika mstari uliotangulia.
- source_word: καταγγέλλουσιν
  choice: wanatangaza
  rationale: Kitenzi hiki humaanisha kutangaza hadharani; uchaguzi huu unahifadhi shtaka la wakati wa sasa bila kulipanua kuwa mafundisho rasmi.
- source_word: ἔθη
  choice: desturi
  rationale: Neno hili linarejelea desturi au mazoea yaliyokubalika katika jamii; “desturi” ni la kawaida na linafaa katika muktadha wa kiraia na kidini.
- source_word: οὐκ ἔξεστιν
  choice: haturuhusiwi kisheria
  rationale: Usemi huu unaonyesha jambo lisiloruhusiwa kwa msingi wa sheria au utaratibu wa kijamii. “Kisheria” inadumisha uzito wa shtaka bila kuthibitisha kwamba madai hayo yalikuwa sahihi.
- source_word: παραδέχεσθαι
  choice: kuzikubali
  rationale: Katika muktadha huu maana ni kuzipokea au kuzikubali desturi hizo kuwa halali; “kuzikubali” ni ya asili na haibani maana kuwa kuanza kuzifuata pekee.
- source_word: οὐδὲ ποιεῖν
  choice: wala kuzifuata
  rationale: Pamoja na ἔθη, ποιεῖν humaanisha kutenda au kufuata desturi. “Kuzifuata” ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: Ῥωμαίοις οὖσιν
  choice: kwa kuwa ni Waroma
  rationale: Kirai cha kivumishi shirikishi kinaonyesha sababu iliyotolewa na washtaki. “Kwa kuwa ni Waroma” kinaweka wazi uhusiano huo wa kisababu kwa Kiswahili cha asili.
theological_decisions:
- issue: Asili ya katazo katika shtaka
  choice: Kuliwasilisha kama dai la kisheria la washtaki (“haturuhusiwi kisheria”) bila kulithibitisha kuwa sheria halisi ya Roma.
  alternative: “si jambo linalofaa kwetu” au “hatupaswi”
  rationale: Mstari unanukuu shtaka, si uthibitisho wa Luka kuhusu sheria ya Roma. Tafsiri inadumisha mtazamo wa kisheria wa washtaki bila kuongeza dai ambalo andiko halithibitishi.
- issue: Uhusiano wa Ῥωμαίοις οὖσιν na katazo
  choice: 'Kutafsiri kwa maana ya sababu: “kwa kuwa ni Waroma.”'
  alternative: “tukiwa Waroma” au “kama Waroma”
  rationale: Kirai hiki kinaeleweka vizuri kuwa sababu ambayo washtaki wanatoa, huku tanbihi ikihifadhi maumbo mbadala yaliyo karibu zaidi na muundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa “sisi, kwa kuwa ni Waroma” unadumisha msisitizo wa ἡμῖν na Ῥωμαίοις bila kuwa mgumu kupita kiasi.
