base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: sw
  text: 'Yule mlinzi wa gereza akamweleza Paulo maneno hayo: “Mahakimu[b] wametuma ujumbe kwamba muachiliwe.[a] Basi sasa tokeni, mwende kwa amani.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mahakimu wametuma kwamba muachiliwe.” Kigiriki hakitaji wazi kitu kilichotumwa; “ujumbe” huwekwa wazi katika tafsiri.
    reason: lexical_alternative
  - marker: b
    text: “Mahakimu” linatafsiri στρατηγοί, yaani viongozi wa kiraia wa Filipi; kwa istilahi maalumu zaidi, “mapraetori.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: akamweleza
  rationale: Kitenzi hiki kinaonyesha kufikisha taarifa kwa mtu; “akamweleza” ni cha kawaida katika Kiswahili na kinafaa kwa ujumbe rasmi uliowasilishwa kwa Paulo.
- source_word: ὁ δεσμοφύλαξ
  choice: mlinzi wa gereza
  rationale: Humtaja mtu aliyekuwa na wajibu wa kulinda gereza, si mlinzi wa kawaida tu.
- source_word: τοὺς λόγους τούτους
  choice: maneno hayo
  rationale: Tafsiri ya karibu na Kigiriki inayobaki ya kawaida katika Kiswahili; haibadili usemi kuwa dhana ya jumla ya “ujumbe” bila ulazima.
- source_word: Ἀπέσταλκαν
  choice: wametuma ujumbe
  rationale: Kauli timilifu inaonyesha jambo lililofanyika na lenye matokeo ya sasa. Kigiriki hakitaji wazi kitu kilichotumwa; “ujumbe” huongezwa kwa uwazi wa Kiswahili bila kubadili maana ya muktadha.
- source_word: οἱ στρατηγοί
  choice: mahakimu
  rationale: Katika koloni la Kirumi la Filipi, neno hili linawahusu viongozi wakuu wa kiraia; “mahakimu” linaeleweka na wasomaji wa kawaida bila kutumia cheo cha kitaalamu cha Kirumi.
- source_word: ἵνα ἀπολυθῆτε
  choice: kwamba mfunguliwe
  rationale: Kauli tendwa inahusu kuachiliwa kutoka kifungoni; “mfunguliwe” ni ya kawaida na huhifadhi wingi wa nafsi ya pili.
- source_word: νῦν οὖν
  choice: Basi sasa
  rationale: Huhifadhi nguvu ya hitimisho ya οὖν pamoja na mpito wa wakati wa νῦν kwa Kiswahili cha kawaida.
- source_word: ἐξελθόντες πορεύεσθε
  choice: tokeni, mwende
  rationale: Kishirikishi kinahusiana kwa karibu na amri inayofuata na kwa Kiswahili huwasilishwa kwa mfuatano wa amri mbili.
- source_word: ἐν εἰρήνῃ
  choice: kwa amani
  rationale: Ni msemo wa asili wa Kiswahili unaowasilisha kuondoka bila madhara au ugomvi.
