base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: sw
  text: Lakini walipofika karibu na Misia[a], walikuwa wakijaribu kwenda Bitinia, na Roho wa Yesu hakuwaruhusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kandokando ya Misia” au “mkabala na Misia.” Huenda kirai cha Kigiriki kinarejelea kufika eneo la mpakani mwa Misia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: walipofika
  rationale: Kauli ya wakati inawasilisha kwa Kiswahili cha kawaida tendo lililotangulia jaribio lao la kwenda Bitinia.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko au utofauti mdogo katika simulizi.
- source_word: κατὰ τὴν Μυσίαν
  choice: karibu na Misia
  rationale: κατά pamoja na hali ya kutendwa katika maelezo ya kijiografia yaweza kuonyesha kufika kandokando au karibu na eneo hilo; tafsiri hii haisisitizi kwamba waliingia ndani kabisa ya Misia.
- source_word: ἐπείραζον
  choice: walijaribu
  rationale: Wakati usiotimilika unaonyesha jaribio lililokuwa likifanyika; 'walijaribu' ni wazi na ya kawaida katika muktadha huu.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: kwenda Bitinia
  rationale: Kirai kinaeleza safari iliyokusudiwa kuelekea na kuingia katika eneo la Bitinia; kwa majina ya maeneo, Kiswahili cha kawaida hakihitaji neno linalolingana moja kwa moja na 'ndani ya'.
- source_word: οὐκ εἴασεν
  choice: hakuwaruhusu
  rationale: Kitenzi kinamaanisha kutoruhusu, bila nguvu ya ziada ya kusema aliwakataza moja kwa moja.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: Roho wa Yesu
  rationale: Inahifadhi wazi usemi usio wa kawaida wa Kigiriki unaomhusianisha Roho na Yesu, badala ya kuubadilisha kuwa 'Roho Mtakatifu'.
theological_decisions:
- issue: Tafsiri ya usemi wa Kikristo τὸ πνεῦμα Ἰησοῦ
  choice: Roho wa Yesu
  alternative: Roho Mtakatifu; Roho
  rationale: Kigiriki kinataja Yesu waziwazi. Tafsiri inahifadhi usemi huo na mvutano wake wa kikristolojia bila kuupatanisha kimya kimya na jina lililozoeleka zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Majina ya maeneo yametolewa kama Misia na Bitinia. Kiunganishi cha pili 'lakini' kimetumiwa kwa mtiririko wa asili wa Kiswahili na kuonyesha kizuizi kilichofuata.
