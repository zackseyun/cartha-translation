  text: Nao wakamwambia neno la Bwana[a], pamoja na wote waliokuwa nyumbani mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe kuhusu Bwana.” Kirai cha Kigiriki kinaweza kumaanisha ujumbe wa Bwana, unaotoka kwake, au unaomhusu.
    reason: alternative_reading
  - marker: b
    text: Au, “pamoja na watu wote wa nyumbani mwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: wakamwambia
  rationale: Kitenzi λαλέω pamoja na mtendewa αὐτῷ kinaonyesha kusema ujumbe kwa mtu. ‘Wakamwambia’ ni Kiswahili cha kawaida na wazi; ‘wakatangaza’ kingetia maana ya tangazo la hadharani isiyolazimishwa na muktadha.
- source_word: τὸν λόγον
  choice: neno
  rationale: Hapa λόγος ni ujumbe unaosemwa. ‘Neno’ linahifadhi nahau ya kawaida ya Agano Jipya na muundo wa kirai ‘neno la Bwana,’ huku maana ya ‘ujumbe’ ikieleweka katika muktadha.
- source_word: τοῦ κυρίου
  choice: la Bwana
  rationale: Kirai hiki kinahifadhi uhusiano mpana wa jenitivi ya Kigiriki bila kuamua kimya kimya kama ni neno linalotoka kwa Bwana au ujumbe unaomhusu Bwana.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: yeye pamoja na wote waliokuwa nyumbani mwake
  rationale: ‘Pamoja na’ linaakisi σύν na kuonyesha kwamba mlinzi na watu wote waliokuwamo nyumbani kwake walihusishwa kama wasikilizaji wa ujumbe.
- source_word: οἰκίᾳ
  choice: nyumbani
  rationale: οἰκία linaweza kumaanisha nyumba au kaya. Katika kirai ‘waliokuwa nyumbani mwake,’ maana ya mahali inahifadhiwa bila kuzuia uwezekano wa kurejelea watu wa kaya.
theological_decisions:
- issue: Maana ya ‘neno la Bwana’
  choice: neno la Bwana
  alternative: ujumbe kuhusu Bwana; ujumbe kutoka kwa Bwana
  rationale: Jenitivi katika τοῦ κυρίου inaweza kuonyesha ujumbe wa au kutoka kwa Bwana, au ujumbe unaomhusu Bwana. Tafsiri kuu inahifadhi upana huo badala ya kuuchagua upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa kawaida kwa msomaji, huku ‘neno la Bwana’ na ‘pamoja na’ vikihifadhi kwa kadiri inayowezekana nahau na uhusiano wa kisintaksia wa Kigiriki.
