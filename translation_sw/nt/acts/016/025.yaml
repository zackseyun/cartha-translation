  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: sw
  text: Karibu usiku wa manane, Paulo na Sila walikuwa wakisali na kumwimbia Mungu nyimbo za sifa, nao wafungwa walikuwa wakiwasikiliza[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafungwa walikuwa wakiwasikiliza kwa makini.” Kitenzi cha Kigiriki kinaweza kudokeza kusikiliza kwa makini au kwa hamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Karibu na usiku wa manane
  rationale: κατά pamoja na nomino ya wakati katika hali ya accusative hapa huonyesha wakati wa kukaribia usiku wa manane, si lazima nukta kamili ya saa hiyo. δέ ni kiunganishi chepesi na kinawakilishwa kwa mtiririko wa sentensi bila neno zito la utofautishaji.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Paulo na Sila
  rationale: Haya ndiyo maumbo ya kawaida ya majina haya katika Kiswahili cha Biblia.
- source_word: προσευχόμενοι
  choice: walikuwa wakisali
  rationale: Kauli ya participle ya wakati uliopo inaonyesha tendo lililokuwa likiendelea wakati mmoja na ὕμνουν; muundo huu wa Kiswahili unaonyesha mwendelezo huo kwa kawaida.
- source_word: ὕμνουν
  choice: kumwimbia Mungu nyimbo za sifa
  rationale: ὑμνέω humaanisha kuimba nyimbo za sifa, si kuimba kwa ujumla. 'Kumwimbia Mungu nyimbo za sifa' ni wazi na ya asili katika Kiswahili.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Mungu ndiye anayeelekezewa nyimbo; kiambishi cha yambwa katika 'kumwimbia' kinaonyesha uhusiano huo kwa kawaida.
- source_word: ἐπηκροῶντο
  choice: walikuwa wakiwasikiliza kwa makini
  rationale: Kitenzi hiki huonyesha kusikiliza kwa uangalifu au kwa hamu, na imperfect huonyesha tendo linaloendelea. 'Kwa makini' huhifadhi nguvu ya kileksika bila kuwa nzito.
- source_word: οἱ δέσμιοι
  choice: wafungwa
  rationale: δέσμιοι ni watu waliofungwa au wafungwa; 'wafungwa' ndiyo tafsiri ya kawaida na inayofaa katika muktadha wa gereza.
