translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo unaonyesha matendo yaliyokuwa yakiendelea na unahifadhi maana mahsusi ya kuimba nyimbo za sifa na kusikiliza kwa makini.
