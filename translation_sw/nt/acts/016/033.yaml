  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: sw
  text: Akawachukua saa ile ya usiku, akawaosha majeraha yao; naye yeye pamoja na watu wote wa nyumbani mwake[a] wakabatizwa mara moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “familia yake yote.” Kigiriki kinarejelea kwa upana zaidi watu wote wa nyumbani mwake.
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: Akawachukua
  rationale: Kitenzi hiki kinaonyesha kwamba mlinzi aliwachukua Paulo na Sila kabla ya kuwaosha, bila kuongeza mahali alipowapeleka au namna alivyofanya.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: saa ileile ya usiku
  rationale: Kauli hii ya kawaida katika Kiswahili inahifadhi msisitizo wa wakati wa usiku na hatua iliyochukuliwa bila kuchelewa.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: akawaosha majeraha yao
  rationale: Hii ni kauli ya asili ya Kiswahili inayoonyesha kwamba alisafisha majeraha yaliyotokana na mapigo; haisemi tu kwamba aliwaogesha.
- source_word: ἐβαπτίσθη
  choice: akabatizwa
  rationale: Kauli ya kutendwa inahifadhi maana ya kwamba alipokea ubatizo bila kubainisha namna ya ubatizo.
- source_word: οἱ αὐτοῦ πάντες
  choice: watu wote wa nyumbani mwake
  rationale: Kauli hii ni pana kuliko familia ya msingi pekee na inawakilisha wale wote waliokuwa katika mazingira ya nyumba yake.
- source_word: παραχρῆμα
  choice: mara moja
  rationale: Inawasilisha kwa uwazi msisitizo wa tendo kufanyika bila kuchelewa.
theological_decisions:
- issue: Upeo wa οἱ αὐτοῦ πάντες kuhusiana na ubatizo
  choice: watu wote wa nyumbani mwake
  alternative: familia yake yote
  rationale: Andiko linajumuisha wote waliokuwa wa nyumba yake lakini halitaji umri wao, tamko lao binafsi la imani, wala namna ya ubatizo. Tafsiri haipaswi kuamua mabishano ya baadaye ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa masimulizi wenye viunganishi vya -ka- unahifadhi mfululizo wa matendo. Alama ya tanbihi [a] imewekwa baada ya kauli inayohusika.
