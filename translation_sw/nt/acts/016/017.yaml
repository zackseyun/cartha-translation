id: ACT.16.17
reference: Acts 16:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: sw
  text: Msichana huyo aliendelea kuwafuata Paulo na sisi huku akipaza sauti akisema, “Watu hawa ni watumwa wa Mungu Aliye Juu Sana. Wanawatangazia njia ya wokovu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kigiriki yanaweza kueleweka kuwa “njia moja ya wokovu” au “ile njia ya wokovu.” Kiswahili “njia ya wokovu” kinaweza kubeba maana zote mbili.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: aliendelea kuwafuata
  rationale: Kauli hii inaonyesha tendo lililoendelea au kurudiwa; ‘aliendelea kuwafuata’ ni ya kawaida katika Kiswahili na inadumisha maana hiyo.
- source_word: ἔκραζεν
  choice: akipaza sauti
  rationale: Kitenzi hiki kinaonyesha kusema kwa sauti kubwa na kwa kuendelea au kurudia, bila kulazimisha hisia maalumu.
- source_word: δοῦλοι
  choice: watumwa
  rationale: Neno hili linaonyesha kuwa watu hao ni mali ya Mungu na wako chini ya mamlaka yake; ‘watumwa’ inadumisha uhusiano huo kwa uwazi kuliko ‘watumishi.’
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: wa Mungu Aliye Juu Zaidi
  rationale: Hiki ni cheo cha Mungu; tafsiri hii ni ya kawaida, yenye heshima, na inadumisha maana ya cheo cha juu kabisa.
- source_word: καταγγέλλουσιν
  choice: wanawatangazia
  rationale: Kitenzi hiki kinamaanisha kutoa tangazo hadharani; ‘wanawatangazia’ pia inajumuisha hadhira inayoonyeshwa na ὑμῖν.
- source_word: ὁδὸν σωτηρίας
  choice: njia ya wokovu
  rationale: Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘a’ au ‘the’; ‘njia ya wokovu’ ni ya asili na inadumisha uwezekano wa maana zote mbili.
theological_decisions:
- issue: Ubayana wa ὁδὸν σωτηρίας
  choice: njia ya wokovu
  alternative: njia moja ya wokovu / ile njia ya wokovu
  rationale: Nomino ya Kigiriki haina kibainishi, lakini hali hiyo peke yake hailazimishi maana isiyo bayana. Kiswahili ‘njia ya wokovu’ kinadumisha mvutano huo bila kuingiza dai la kitheolojia lililo wazi zaidi kuliko matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili ndani ya usemi wa moja kwa moja zinasaidia usomaji wa kawaida bila kubadili uhusiano wa maana katika Kigiriki.
