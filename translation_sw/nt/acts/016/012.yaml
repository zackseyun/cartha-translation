base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: sw
  text: Na kutoka huko tukaenda Filipi, mji mashuhuri[a] wa wilaya ya Makedonia, koloni la Roma[b]. Tukakaa katika mji huo kwa siku kadhaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mji wa kwanza wa wilaya ya Makedonia.” Kirai cha Kigiriki kina utata; “wa kwanza” kinaweza kumaanisha cheo, umashuhuri, au mpangilio.
    reason: alternative_reading
  - marker: b
    text: Yaani, mji uliopewa hadhi maalumu ya koloni chini ya utawala wa Roma.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: na kutoka huko tukaenda Filipi
  rationale: Muundo huu unaendeleza mfululizo wa safari. Ingawa Kigiriki hakirudii kitenzi, Kiswahili cha kawaida huhitaji ‘tukaenda’ ili sentensi ikamilike kwa uwazi bila kubadili maana.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: mji mashuhuri katika wilaya hiyo ya Makedonia
  rationale: Kirai hiki cha Kigiriki kina utata wa kisarufi na kihistoria. ‘Mashuhuri’ huwasilisha uwezekano wa hadhi au umaarufu bila kudai kwa uhakika kwamba Filipi ulikuwa mji mkuu au wa kwanza kwa mpangilio.
- source_word: κολωνία
  choice: koloni la Roma
  rationale: Neno hili linamaanisha hadhi rasmi ya Filipi kama koloni chini ya utawala wa Roma. ‘La Roma’ huweka wazi rejeo la kihistoria.
- source_word: ἦμεν ... διατρίβοντες
  choice: tukakaa
  rationale: Muundo huu unaonyesha kukaa au kutumia muda mahali fulani; ‘tukakaa’ ni wa kawaida na unaendeleza simulizi kwa ufasaha.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: katika mji huo
  rationale: Katika simulizi ya Kiswahili, ‘mji huo’ hurejelea kwa kawaida na wazi mji uliotajwa mara tu kabla.
- source_word: ἡμέρας τινάς
  choice: kwa siku kadhaa
  rationale: Huwasilisha kipindi kisichotajwa kwa usahihi bila kukifanya kiwe kifupi au kirefu kupita ushahidi wa Kigiriki.
theological_decisions:
- issue: Maana ya πρώτη katika maelezo ya Filipi
  choice: mji mashuhuri
  alternative: mji wa kwanza wa wilaya hiyo ya Makedonia
  rationale: Suala hili ni la tafsiri na historia, si fundisho la imani. Tafsiri kuu inaonyesha uwezekano wa umaarufu au hadhi, huku tanbihi ikihifadhi maana halisi ya ‘wa kwanza’ na utata wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya simulizi ni rahisi kueleweka; ‘koloni la Roma’ imetumiwa kwa usahihi wa kihistoria, na utata wa πρώτη umehifadhiwa katika tanbihi.
