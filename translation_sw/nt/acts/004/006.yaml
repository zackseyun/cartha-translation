  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: sw
  text: na Anasi, kuhani mkuu, na Kayafa, na Yohana, na Aleksanda, na wote waliokuwa wa ukoo wa makuhani wakuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa familia ya makuhani wakuu” au “wa nasaba ya makuhani wakuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἅννας
  choice: Anasi
  rationale: Umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: ὁ ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Linahifadhi cheo ambacho Kigiriki kinampa Anasi moja kwa moja bila kukirekebisha kwa sababu za kihistoria.
- source_word: Καϊάφας
  choice: Kayafa
  rationale: Umbo la kawaida na linalotambulika la jina hili katika Kiswahili cha Biblia.
- source_word: Ἰωάννης
  choice: Yohana
  rationale: Umbo la kawaida la Kiswahili la jina la Kigiriki Ἰωάννης.
- source_word: Ἀλέξανδρος
  choice: Aleksanda
  rationale: Unukuzi wa jina unaolingana na matumizi ya kawaida ya Kiswahili.
- source_word: ὅσοι
  choice: wote
  rationale: Hutoa maana ya wingi jumuishi kwa Kiswahili cha kawaida katika muundo huu.
- source_word: ἦσαν ἐκ γένους ἀρχιερατικοῦ
  choice: waliotoka katika ukoo wa kikuhani mkuu
  rationale: Muundo huu unaonyesha kuwa walikuwa wa ukoo au nasaba iliyohusishwa na kuhani mkuu, wala si lazima kwamba kila mmoja alikuwa na cheo hicho.
theological_decisions:
- issue: Kumtaja Anasi kuwa kuhani mkuu ingawa Kayafa ndiye aliyekuwa akishika wadhifa huo wakati huo
  choice: Kuhifadhi moja kwa moja maneno “Anasi, kuhani mkuu”
  alternative: Anasi, aliyekuwa kuhani mkuu zamani
  rationale: Kigiriki kinampa Anasi cheo ὁ ἀρχιερεύς waziwazi. Tafsiri haipaswi kuondoa mvutano wa kihistoria kwa kuongeza maelezo yasiyokuwamo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umehifadhiwa, huku maneno ya ukoo yakitolewa kwa namna inayoeleweka kwa msomaji wa kawaida.
