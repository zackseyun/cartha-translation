id: ACT.4.10
reference: Acts 4:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: sw
  text: Basi, ijulikane kwenu nyote na kwa watu wote wa Israeli kwamba kwa jina la Yesu Masihi wa Nazareti[a]—ambaye ninyi mlimsulubisha, na ambaye Mungu alimfufua kutoka kwa wafu—kwa jina hilo[b] mtu huyu anasimama mbele yenu akiwa mzima[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu Kristo Mnazareti.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Masihi” au kutumiwa kwa namna inayofanana zaidi na jina, “Kristo”; “wa Nazareti” pia inaweza kusemwa “Mnazareti.”
    reason: alternative_reading
  - marker: b
    text: Au “kwa huyo,” yaani Yesu. Maneno ya Kigiriki yanaweza kurejelea Yesu mwenyewe au, kwa namna mahususi zaidi, jina lake lililotajwa.
    reason: lexical_alternative
  - marker: c
    text: Au “akiwa na afya” au “akiwa amepona.” Neno la Kigiriki ὑγιής humaanisha kuwa mzima au mwenye afya iliyorejeshwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: ijulikane
  rationale: Muundo huu wa amri isiyotaja mtendaji unatoa tangazo rasmi na unasikika kwa kawaida katika Kiswahili sanifu.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: kwenu nyote na kwa watu wote wa Israeli
  rationale: Unadumisha tofauti kati ya wasikilizaji waliokuwapo na watu wote wa Israeli.
- source_word: ἐν τῷ ὀνόματι
  choice: kwa jina la
  rationale: Katika Kiswahili, “kwa jina la” huweza kuonyesha uwezo, mamlaka, au njia ambayo uponyaji ulitendeka, huku ikidumisha taswira ya neno la Kigiriki.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa bado lina nguvu ya cheo; “Masihi” linaonyesha wazi maana hiyo badala ya kulifanya jina la pili.
- source_word: τοῦ Ναζωραίου
  choice: Mnazareti
  rationale: Ni namna fupi na ya kawaida ya kumtambulisha mtu anayetoka Nazareti, na inalingana na nomino ya Kigiriki.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: ambaye ninyi mlimsulubisha
  rationale: Inadumisha msisitizo wa kiwakilishi ὑμεῖς na shtaka la moja kwa moja kwa wasikilizaji.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: ambaye Mungu alimfufua kutoka kwa wafu
  rationale: Inahifadhi wazi Mungu kuwa mtendaji na Yesu kufufuliwa kutoka kwa wafu.
- source_word: ἐν τούτῳ
  choice: kwa jina hilo
  rationale: Inarejelea kwa kawaida “jina” lililotajwa na kueleza njia ya uponyaji; uwezekano wa kurejelea Yesu mwenyewe umewekwa katika tanbihi.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: mtu huyu anasimama mbele yenu
  rationale: “Mtu huyu” humtambulisha wazi aliyeponywa, naye yupo hapo mbele ya baraza.
- source_word: ὑγιής
  choice: akiwa mzima
  rationale: “Mzima” ni neno la kawaida linaloeleza hali ya afya iliyorejeshwa bila kuibana maana kuwa ugonjwa wa aina fulani.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au kama sehemu ya jina
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha wa tangazo kwa viongozi na watu wa Israeli unaendeleza maana ya cheo cha kimasiya; tanbihi inadumisha namna iliyozoeleka ya “Kristo.”
- issue: Kirejeleo cha ἐν τούτῳ
  choice: kwa jina hilo
  alternative: kwa huyo, yaani Yesu
  rationale: Kisarufi, τούτῳ kinaweza kurejelea jina lililotangulia au Yesu mwenyewe. Matini kuu inafuata uhusiano wa karibu na “jina,” huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Kauli kuhusu ufufuo
  choice: ambaye Mungu alimfufua kutoka kwa wafu
  alternative: ''
  rationale: Kauli hii inadumisha tendo la Mungu na dai la ufufuo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya tangazo la hadharani lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umeleta “mtu huyu” mapema ili kuepuka mlolongo mzito wa virai na kufanya marejeleo yawe wazi; “naam” inarudisha kwa mkazo kishazi cha mwisho cha Kigiriki.
