  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: sw
  text: Kwa maana sisi hatuwezi kuacha kusema kuhusu mambo tuliyoyaona na kuyasikia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa muundo wa karibu zaidi na Kigiriki, “Kwa maana sisi hatuwezi kutosema mambo tuliyoyaona na kuyasikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: hatuwezi
  rationale: Kitenzi hiki kinaonyesha kutoweza; ‘hatuwezi’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia; ‘Kwa maana’ kinahifadhi uhusiano huo wa ufafanuzi.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo. Kutumia ‘sisi’ pamoja na kiambishi cha nafsi katika ‘hatuwezi’ kunahifadhi mkazo huo bila kuwa lugha isiyo ya kawaida.
- source_word: ἃ
  choice: mambo
  rationale: Kiwakilishi cha uhusiano cha wingi kisicho na jinsia kinarejelea yaliyoshuhudiwa; ‘mambo’ ni tafsiri ya asili katika Kiswahili.
- source_word: εἴδαμεν
  choice: tuliyoyaona
  rationale: Wakati uliopita unafaa kwa ushuhuda wa matukio waliyoyaona, huku muundo wa uhusiano ukikiunganisha na ‘mambo’.
- source_word: ἠκούσαμεν
  choice: kuyasikia
  rationale: Kinadumisha ulinganifu wa kuona na kusikia kama msingi wa ushuhuda wao.
- source_word: μὴ λαλεῖν
  choice: kuacha kusema
  rationale: Baada ya ‘hatuwezi,’ usemi ‘kuacha kusema’ unaeleza kwa Kiswahili cha kawaida kutoweza kujizuia kusema, huku ukihifadhi maana ya kutoweza kunyamaza.
- source_word: λαλεῖν
  choice: kusema kuhusu
  rationale: Katika muktadha huu, kusema kunahusu mambo waliyoyaona na kuyasikia; ‘kuhusu’ huweka uhusiano huo wazi na kwa njia ya kawaida.
theological_decisions:
- issue: Msukumo wa mitume unaelezwa kama kutoweza kunyamaza, si kutotaka tu.
  choice: Mitume wanasema hawawezi kuacha kusema.
  alternative: Mitume wameazimia tu kwamba hawataacha kusema.
  rationale: Muundo οὐ δυνάμεθα ... μὴ λαλεῖν unaeleza moja kwa moja kutoweza kutosema. Tafsiri hailegezi jambo hilo kuwa azimio au kutotaka tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Matini kuu inatumia ‘hatuwezi kuacha kusema’ kwa ufasaha wa kawaida; tanbihi inaonyesha muundo wa Kigiriki wenye ukanushi maradufu.
