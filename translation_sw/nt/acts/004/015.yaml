lexical_decisions:
- source_word: κελεύσαντες
  choice: baada ya kuwaamuru
  rationale: Kirai cha kitenzi katika wakati aoristi kinaonyesha tendo lililotangulia tendo kuu; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mamlaka ya agizo.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye utofauti mdogo kutoka mazungumzo ya wazi kwenda mashauriano ya faragha.
- source_word: αὐτοὺς
  choice: wa-
  rationale: Kiambishi cha yambwa katika “kuwaamuru” kinawarejelea Petro na Yohana kwa njia ya kawaida ya Kiswahili.
- source_word: ἔξω τοῦ συνεδρίου
  choice: nje ya baraza
  rationale: “Baraza” linaeleweka kwa wasomaji wa Kiswahili na linaweza kumaanisha chombo cha uongozi au kikao chake, kama neno la Kigiriki συνέδριον.
- source_word: ἀπελθεῖν
  choice: watoke
  rationale: Pamoja na “nje,” kitenzi hiki kinawasilisha kwa kawaida agizo la kuondoka mahali kikao kilipokuwa.
- source_word: συνέβαλλον
  choice: wakaanza kushauriana
  rationale: Wakati usiotimilifu unaonyesha tendo lililoendelea au lililoanza katika hatua hii ya simulizi; “kushauriana” linafaa kwa majadiliano ya pamoja ya baraza.
- source_word: πρὸς ἀλλήλους
  choice: wao kwa wao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba walishauriana miongoni mwao.
