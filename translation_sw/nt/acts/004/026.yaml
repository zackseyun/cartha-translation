  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: sw
  text: Wafalme wa dunia walisimama, na watawala wakakusanyika pamoja dhidi ya Bwana na dhidi ya Masihi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo wake.” Neno la Kigiriki christos maana yake “mtiwa-mafuta.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: walisimama kupinga
  rationale: Katika mwangwi wa Zaburi 2:2, kitenzi hiki hakimaanishi kusimama kimwili tu, bali kuchukua msimamo wa upinzani; nyongeza ya “kupinga” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: βασιλεῖς
  choice: wafalme
  rationale: Hili ndilo jina mahususi la watawala wa kifalme na linadumisha ulinganifu wa nukuu ya Zaburi 2.
- source_word: τῆς γῆς
  choice: wa dunia
  rationale: Katika muktadha huu wa Zaburi 2, neno hilo lina upeo mpana wa ulimwengu, si eneo fulani tu.
- source_word: ἄρχοντες
  choice: watawala
  rationale: Neno hili ni la asili na la sasa kwa viongozi wenye mamlaka, huku likitofautishwa na “wafalme.”
- source_word: συνήχθησαν
  choice: wakakusanyika
  rationale: Huwasilisha tendo la kuja pamoja kwa urahisi wa Kiswahili; umbo la Kigiriki ni la kutendwa, lakini Kiswahili tendaji hapa ni la kawaida bila kubadili maana kuu.
- source_word: ἐπὶ τὸ αὐτό
  choice: pamoja
  rationale: Nahau hii humaanisha kuwa pamoja au mahali pamoja; “pamoja” ni fupi na ya asili katika muktadha huu.
- source_word: κατὰ
  choice: dhidi ya
  rationale: Hueleza wazi uhasama na upinzani katika matumizi yote mawili.
- source_word: κυρίου
  choice: Bwana
  rationale: Katika nukuu hii ya Maandiko, neno hilo linamrejelea Mungu na “Bwana” hudumisha uzito wake wa kimaandiko.
- source_word: χριστοῦ
  choice: Masihi
  rationale: Hapa neno hilo linatumika kama cheo katika nukuu ya Zaburi 2, hivyo “Masihi” hudumisha muktadha wa yule aliyetiwa mafuta.
- source_word: αὐτοῦ
  choice: wake
  rationale: 'Kiwakilishi kinamrejelea Bwana na kudumisha uhusiano wa moja kwa moja: “Masihi wake.”'
theological_decisions:
- issue: Tafsiri ya Χριστός katika nukuu ya Zaburi 2
  choice: Masihi
  alternative: Kristo; Mtiwa-Mafuta
  rationale: Kwa kuwa Χριστός hapa ni cheo kinacholingana na “mtiwa-mafuta” wa Zaburi 2:2, “Masihi” huonyesha vyema msingi huo bila kuifasiri kama jina binafsi tu. Tanbihi inahifadhi maana halisi na istilahi iliyozoeleka ya “Kristo.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi na ulinganifu wa Zaburi umehifadhiwa, huku “walisimama kupinga” ikifanya maana ya msimamo wa uhasama iwe wazi.
