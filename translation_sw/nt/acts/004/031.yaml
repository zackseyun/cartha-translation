  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: sw
  text: Walipokwisha kusali, mahali pale walipokuwa wamekusanyika[a] pakatikiswa, nao wote wakajazwa Roho Mtakatifu na walikuwa wakisema neno la Mungu kwa ujasiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokuwa wamekusanywa.” Kigiriki kinaeleza hali yao ya kuwa pamoja kama kusanyiko.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kusema wazi” au “bila hofu.” Neno hili linamaanisha usemi wa wazi na wa ujasiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: Walipokwisha kusali
  rationale: 'Kirai huru cha jenitivi chenye kitenzi-jina cha wakati uliopita kinatoa mazingira ya wakati: baada ya wao kusali. “Walipokwisha kusali” ni Kiswahili cha kawaida na huonyesha kwamba sala ilitangulia tukio lililofuata.'
- source_word: ἐσαλεύθη
  choice: pakatikiswa
  rationale: Kitenzi cha hali ya kutendwa kinaonyesha kwamba mahali pale palipata mtikisiko. “Pakatikiswa” huhifadhi nguvu ya kimwili ya σαλεύω na kupatana na ngeli ya mahali.
- source_word: ὁ τόπος
  choice: mahali
  rationale: Neno hili linarejelea eneo halisi ambamo waamini walikuwa wamekusanyika; “mahali” ni tafsiri ya moja kwa moja na ya asili.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: walipokuwa wamekusanyika
  rationale: Muundo wa ἦσαν pamoja na kitenzi-jina cha timilifu unaeleza hali yao ya kuwa wamekusanyika. Tafsiri hii huhifadhi hali hiyo bila kudokeza zaidi kuhusu namna walivyofika hapo.
- source_word: ἐπλήσθησαν
  choice: wakajazwa
  rationale: Huhifadhi hali ya kutendwa na nahau ya Luka kuhusu kujazwa Roho. Kiunganishi “waka-” kinaendeleza mfululizo wa matukio katika simulizi.
- source_word: ἅπαντες
  choice: wote
  rationale: Neno hili linasisitiza kundi zima; “wote” ni fupi, wazi, na sahihi.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Roho Mtakatifu
  rationale: Baada ya kitenzi “kujaza,” jenitivi ya Kigiriki inaeleweka kwa kawaida kuwa kile ambacho watu walijazwa nacho. Jina hili linamtaja Roho wa Mungu kama mhusika wa kimungu katika muktadha.
- source_word: ἐλάλουν
  choice: walikuwa wakisema
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha tendo lililoendelea. Muundo “walikuwa wakisema” huhifadhi hali hiyo bila kuongeza wazo la kwamba ndipo tu walipoanza.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Ni usemi wa kawaida wa Luka kwa ujumbe wa Mungu unaotangazwa. “Neno la Mungu” huhifadhi nahau ya kibiblia na uzito wake.
- source_word: μετὰ παρρησίας
  choice: kwa ujasiri
  rationale: Katika Matendo, παρρησία hasa huonyesha kusema wazi bila hofu. “Kwa ujasiri” ni tafsiri ya kawaida inayoendana na muktadha wa ushuhuda wa hadharani.
theological_decisions:
- issue: Lugha ya kujazwa Roho
  choice: wote wakajazwa Roho Mtakatifu
  alternative: wote wakajazwa na Roho Mtakatifu
  rationale: Muundo uliochaguliwa unawasilisha Roho Mtakatifu kama kile walichojazwa nacho, kwa kufuata nahau ya Luka, bila kuamua ikiwa mstari huu unafundisha tukio maalumu la pili la kiroho au mfumo fulani wa kimadhehebu.
- issue: Hali ya tendo katika ἐλάλουν
  choice: walikuwa wakisema
  alternative: wakasema
  rationale: Tafsiri iliyochaguliwa huhifadhi hali endelevu ya wakati usiotimilika na kuonyesha ushuhuda ulioendelea baada ya sala na kujazwa Roho, badala ya tendo la mara moja tu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. “Kusali” limetumiwa badala ya “kuomba” ili maana ya sala iwe wazi mara moja. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika: [a] baada ya maelezo ya kukusanyika na [b] baada ya “ujasiri.”'
