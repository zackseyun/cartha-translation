  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: sw
  text: Ndipo Petro, akiwa amejazwa na Roho Mtakatifu, akawaambia, “Enyi watawala wa watu na wazee,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Kiashiria cha wakati na mfuatano wa simulizi; “Ndipo” ni cha asili katika Kiswahili na huunganisha tukio hili na lililotangulia.
- source_word: Πέτρος
  choice: Petro
  rationale: Umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: πλησθεὶς
  choice: akiwa amejazwa
  rationale: Huwakilisha kitenzi-shirikishi cha aoristi katika hali ya kutendwa, huku kikisomeka kwa ufasaha katika Kiswahili.
- source_word: πνεύματος ἁγίου
  choice: Roho Mtakatifu
  rationale: Baada ya “amejazwa,” Kiswahili hutaja kile ambacho mtu amejazwa bila kuhitaji kihusishi; usemi huu humrejelea Roho Mtakatifu katika muktadha wa Matendo.
- source_word: εἶπεν πρὸς αὐτούς
  choice: akawaambia
  rationale: Ni tafsiri ya asili na fupi ya fomula ya simulizi “aliwaambia,” ikihifadhi walengwa wa kauli.
- source_word: Ἄρχοντες
  choice: watawala
  rationale: Huhifadhi maana ya mamlaka rasmi ya kiutawala au kimahakama, badala ya maana pana zaidi ya “viongozi.”
- source_word: τοῦ λαοῦ
  choice: wa watu
  rationale: Ni tafsiri ya moja kwa moja ya kundi linalotawaliwa; muktadha unaonyesha watu wa Israeli bila kulazimisha ufafanuzi huo ndani ya mstari.
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Katika muktadha huu ni cheo cha viongozi wanaotambuliwa katika jamii, si maelezo ya umri tu.
theological_decisions:
- issue: Tafsiri ya πνεύματος ἁγίου
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Katika Matendo, usemi huu humrejelea Roho Mtakatifu anayemwezesha Petro kusema. Herufi kubwa zinaonyesha rejeo hilo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Enyi” linafaa kwa mwito rasmi wa moja kwa moja kwa baraza, na sentensi imeachwa wazi kwa kuendelea na hotuba katika mstari unaofuata.
