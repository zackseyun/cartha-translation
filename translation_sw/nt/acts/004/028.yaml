translation:
  language: sw
  text: ili wafanye yote ambayo mkono wako na kusudi lako vilikwisha kuamua yatukie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilikuwa vimekusudia tangu awali yatukie” au “vilikuwa vimepanga tangu awali yatukie.” Kitenzi cha Kigiriki kinaonyesha uamuzi uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: ili wafanye
  rationale: Infinitivu hii hutegemea muktadha uliotangulia na inaeleza kusudi au matokeo; “ili wafanye” ni ya kawaida katika Kiswahili na inaonyesha kuwa watawala na mataifa yaliyotajwa walitenda mambo hayo.
- source_word: ὅσα
  choice: yote ambayo
  rationale: Kiwakilishi hiki cha wingi na upeo mpana kinamaanisha jumla ya mambo yaliyofanyika; “yote ambayo” ni wazi na cha asili.
- source_word: χείρ
  choice: mkono
  rationale: Neno la moja kwa moja ni “mkono.” Ingawa hapa ni sitiari ya nguvu au utendaji wa Mungu, kuhifadhi taswira ya kibiblia huepuka kuifafanua kupita kiasi.
- source_word: βουλή
  choice: kusudi
  rationale: βούλη huonyesha nia au mpango uliokusudiwa kwa makusudi. “Kusudi” ni neno la sasa, lenye heshima, na halipunguzi maana kuwa matakwa ya jumla tu.
- source_word: προώρισεν
  choice: vilikuwa vimekusudia kabla
  rationale: Kitenzi hiki humaanisha kuamua au kukusudia kabla. Kauli hii huhifadhi utangulizi wa uamuzi bila kuingiza istilahi ya kimadhehebu isiyo lazima; mbadala wa karibu umewekwa katika tanbihi.
- source_word: γενέσθαι
  choice: yatukie
  rationale: Hapa γίνομαι hurejelea matukio kutokea. “Yatukie” ni Kiswahili cha kawaida na huafikiana kisarufi na “yote.”
theological_decisions:
- issue: Maana ya προώρισεν katika muktadha wa enzi kuu ya Mungu na uwajibikaji wa wanadamu
  choice: vilikuwa vimekusudia kabla
  alternative: vilikuwa vimeamua kabla
  rationale: Kigiriki kinathibitisha uamuzi wa Mungu uliotangulia kuhusu matukio ya mateso ya Yesu, huku muktadha pia ukitaja vitendo vya wanadamu. Tafsiri inahifadhi mvutano huo bila kuamua mfumo mpana wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “mkono wako na kusudi lako vilikuwa” unahifadhi viima viwili vya Kigiriki vinavyotenda pamoja, na sitiari ya “mkono” imeachwa wazi kama ilivyo katika chanzo.
