  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: sw
  text: Wala hakuna wokovu katika mtu mwingine yeyote, kwa maana hakuna jina lingine chini ya mbingu lililotolewa miongoni mwa wanadamu, ambalo kwalo imetupasa kuokolewa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: wokovu
  rationale: Katika muktadha huu neno linahusu kuokoa au ukombozi unaopatikana katika Yesu; “wokovu” linaunganisha vizuri nomino hii na kitenzi “kuokolewa” mwishoni mwa aya.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: katika mwingine yeyote
  rationale: Huhifadhi muundo wa Kigiriki na msisitizo kwamba wokovu haupatikani katika mtu mwingine yeyote, bila kuugeuza kuwa kauli isiyo ya kibinafsi kuhusu njia tu.
- source_word: ὄνομα
  choice: jina
  rationale: “Jina” limehifadhiwa badala ya kufafanuliwa kuwa “mtu” au “mamlaka,” kwa kuwa katika matumizi ya kibiblia linaweza kubeba maana hizo bila maandishi kuzitaja wazi.
- source_word: ἕτερον
  choice: lingine
  rationale: Katika ukanushaji huu, “hakuna jina lingine” ni Kiswahili cha kawaida kinachoonyesha upekee uliokusudiwa.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: chini ya mbingu
  rationale: Huhifadhi nahau na uzito wa usemi wa kibiblia huku ikidokeza upeo wa ulimwengu wa wanadamu.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: ambalo limepewa miongoni mwa wanadamu
  rationale: Kirai “miongoni mwa wanadamu” kinaonyesha kuwa ἀνθρώποις ni ya kijumla na kinahusu wanadamu wote; pia kinaepuka kuifanya ἐν iwe tu “kwa” au “kwa ajili ya.”
- source_word: ἐν ᾧ
  choice: kwa hilo
  rationale: Kiwakilishi kinarejelea “jina”; “kwa hilo” kinaonyesha njia au chombo cha kuokolewa huku kikidumisha marejeo ya kisarufi kwa jina.
- source_word: δεῖ
  choice: litupasalo
  rationale: Huonyesha ulazima wa δεῖ kwa Kiswahili cha heshima na huunganisha kwa uwazi ulazima huo na kuokolewa kwetu.
- source_word: σωθῆναι
  choice: kuokolewa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na uhusiano wake wa kimaana na “wokovu.”
theological_decisions:
- issue: Upekee wa wokovu kuhusiana na Yesu
  choice: 'Kauli imeachwa bila kupunguzwa: “hakuna wokovu katika mwingine yeyote.”'
  alternative: “Hakuna njia nyingine ya wokovu.”
  rationale: Kigiriki kinasema moja kwa moja kwamba wokovu haupo katika mwingine yeyote na kinaithibitisha kwa kutokuwapo kwa jina lingine; tafsiri haiongezi wala kupunguza dai hilo.
- issue: Maana ya ἀνθρώποις
  choice: “miongoni mwa wanadamu”
  alternative: “kwa wanadamu”
  rationale: Neno ni la kijumla na linahusu jamii yote ya wanadamu. “Miongoni mwa” pia huhifadhi kwa ukaribu zaidi ἐν ya chanzo bila kudai kwa lazima kwamba jina lilipewa moja kwa moja ‘kwa’ wanadamu.
- issue: Marejeo ya ἐν ᾧ kwa ‘jina’
  choice: “kwa hilo”
  alternative: “ambalo kwalo” au “katika hilo”
  rationale: Huhifadhi taswira ya kuokolewa kwa jina hilo bila kulifafanua jina kimadhehebu kuwa mamlaka, mtu, au kauli ya kutamkwa pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Wala” linaendeleza hoja ya Petro kutoka muktadha uliotangulia. Muundo “litupasalo sisi kuokolewa kwa hilo” ni wa heshima na wenye uzito wa kibiblia, huku ukihifadhi ulazima, hali ya kutendwa, na marejeo ya ‘jina.’
