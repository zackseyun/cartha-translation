    text: 'Kwa tafsiri ya moja kwa moja zaidi: “bei za vitu vilivyouzwa.”'
    reason: lexical_alternative
  revision_rationale: The revision resolves the ambiguous object concord after the mixed noun phrase “mashamba au nyumba” and uses a more natural expression for the proceeds of sales. It preserves the explanatory force of both γάρ clauses, the emphatic negation, the scope of ὅσοι, and the imperfect/repeated sense of ἔφερον.
