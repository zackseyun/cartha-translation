base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: sw
  text: Kwa maana, hakukuwa hata na mtu mwenye uhitaji miongoni mwao; kwa kuwa wote waliokuwa na mashamba au nyumba walikuwa wakiuza mali hizo na kuleta mapato ya vitu vilivyouzwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya moja kwa moja zaidi: “bei za vitu vilivyouzwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Kwa maana hapakuwa hata
  rationale: “Kwa maana” linadumisha uhusiano wa maelezo unaoletwa na γάρ, na “hata” linaonyesha msisitizo wa οὐδέ kwa Kiswahili cha kawaida.
- source_word: ἐνδεής
  choice: mwenye uhitaji
  rationale: Hueleza hali ya kukosa mahitaji bila kuibana maana iwe umaskini wa kiuchumi pekee.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: hapakuwa ... mtu yeyote ... miongoni mwao
  rationale: Muundo huu wa kuwapo ni wa asili katika Kiswahili na unawakilisha kisahihi usemi wa Kiyunani.
- source_word: ὅσοι
  choice: Wote waliokuwa
  rationale: Huhifadhi wigo wa watu wote waliokuwa katika kundi lililotajwa, bila kudai kwamba kila mshiriki wa jumuiya alikuwa na mali.
- source_word: κτήτορες χωρίων ἢ οἰκιῶν
  choice: waliokuwa na mashamba au nyumba
  rationale: Ni tafsiri ya kawaida na wazi ya wenye kumiliki vipande vya ardhi au nyumba; “mashamba” linaeleweka kwa urahisi katika muktadha huu.
- source_word: πωλοῦντες ἔφερον
  choice: walikuwa wakiviuza na kuleta
  rationale: Muundo wa “walikuwa waki-” unaonyesha tendo lililokuwa likirudiwa au kuendelea, kama inavyodokezwa na kitenzi cha wakati usiotimilika ἔφερον, huku ukitoa mtiririko wa kawaida wa Kiswahili.
- source_word: τὰς τιμὰς
  choice: fedha zilizopatikana
  rationale: Ingawa maana ya moja kwa moja ni “bei,” hapa neno hilo linamaanisha fedha zilizopatikana kwa mauzo; usemi huu ni wazi na wa asili kwa Kiswahili.
- source_word: τῶν πιπρασκομένων
  choice: kwa vitu vilivyouzwa
  rationale: Huhifadhi kutotajwa kwa vitu maalumu katika kishirikishi cha Kiyunani, bila kuviwekea mipaka kuwa mali zilizotajwa tu.
theological_decisions:
- issue: Wigo wa mauzo ya mali
  choice: “Wote waliokuwa na mashamba au nyumba walikuwa wakiviuza”
  alternative: “Kila mwenye shamba au nyumba aliuza mali yake yote”
  rationale: Kiyunani kinaeleza desturi ya waliokuwa katika kundi hilo lakini hakisemi wazi kwamba kila mtu aliuza kila mali aliyokuwa nayo; tafsiri haiongezi dai hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa mara mbili ili kuepuka marudio mazito ya “kwa maana ... kwa sababu” bila kupoteza uhusiano wa maelezo.
