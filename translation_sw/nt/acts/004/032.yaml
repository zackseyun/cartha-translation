base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: sw
  text: Umati wa wale walioamini ulikuwa na moyo mmoja na nafsi moja[a], na wala hakuna hata mmoja aliyesema kwamba chochote alichokuwa nacho kilikuwa mali yake binafsi[b]; bali vitu vyote vilikuwa vya pamoja kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana iliyo wazi zaidi, “walikuwa wameungana kabisa katika moyo na nafsi.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinatumia umoja hapa, kikimrejelea kila mtu mmoja mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: umati
  rationale: Neno hili linaonyesha idadi kubwa ya watu; “umati” linadumisha wazo hilo bila kuligeuza kuwa kundi dogo tu.
- source_word: τῶν πιστευσάντων
  choice: wale walioamini
  rationale: Uundaji huu unahifadhi hali ya kitenzi katika kirai cha Kigiriki na unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: καρδία καὶ ψυχὴ μία
  choice: moyo mmoja na nafsi moja
  rationale: Tafsiri hii inadumisha nomino zote mbili na taswira ya umoja wa ndani bila kuifupisha kuwa maelezo ya jumla tu.
- source_word: οὐδὲ εἷς
  choice: wala hakuna hata mmoja
  rationale: “Hata mmoja” linaonyesha msisitizo wa οὐδὲ εἷς.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: chochote alichokuwa nacho
  rationale: Kirai hiki kinarejelea mali au vitu vilivyokuwa vya kila mtu; tafsiri hii ni ya kawaida na haiongezi mfumo maalumu wa umiliki.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: alisema kwamba ... ni chake mwenyewe
  rationale: Hii inafuata kwa karibu dai la kuwa kitu ni mali binafsi, bila kuongeza maana kali zaidi ya kukataa kuwapa wengine.
- source_word: πάντα κοινά
  choice: walikuwa na kila kitu kwa pamoja
  rationale: Hii ni Kiswahili cha kawaida kinachowasilisha kwamba vitu vyote vilikuwa vya kutumiwa kwa pamoja, huku kikiepuka kudai mfumo rasmi wa kiuchumi.
theological_decisions:
- issue: Maelezo ya mali iliyotumiwa kwa pamoja katika kanisa la Yerusalemu
  choice: Mstari unaeleza umoja na matumizi ya mali kwa pamoja bila kuufanya kuwa mfumo rasmi wa baadaye wa kiuchumi au kikanisa.
  alternative: Kutafsiri kwa nguvu zaidi kuwa walimiliki kila kitu kwa umiliki wa pamoja, au kwa udhaifu zaidi kwa kupunguza maana ya ushirika wao wa mali.
  rationale: Kigiriki kinasema kwamba hakuna mtu aliyedai kitu chake kuwa mali yake binafsi na kwamba vitu vyote vilikuwa vya pamoja. Tafsiri inadumisha mvutano huo bila kuingiza itikadi ya kisiasa au ya kimadhehebu.
- issue: Maana ya καρδία καὶ ψυχὴ μία
  choice: moyo mmoja na nafsi moja
  alternative: walikuwa wameungana kabisa
  rationale: Uchaguzi mkuu unahifadhi taswira ya Kigiriki na vipengele vyake viwili; maelezo ya kiutendaji yanaweza kusaidia msomaji bila kufuta taswira hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nafsi” limetumiwa kwa ψυχή ili kutofautisha na πνεῦμα (“roho”), huku tanbihi ikifafanua maana ya nahau. Muundo unaepuka “Sasa” kwa kuwa chanzo hakina neno la wakati lenye maana hiyo.
