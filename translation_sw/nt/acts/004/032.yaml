  source_fidelity: 'Maana kuu imehifadhiwa vizuri: πλῆθος ni “umati,” πιστεύσαντες ni “walioamini,” na taswira ya “moyo mmoja na nafsi moja” imedumishwa. Hata hivyo, “ni chake mwenyewe” hubadilisha wakati wa simulizi usio wa lazima na huficha kidogo maana ya ἴδιον (mali binafsi). “Vitu vyote vilikuwa vya pamoja kwao” hufuata kwa karibu zaidi predicate ya Kigiriki πάντα κοινά.'
  naturalness: Kiswahili ni cha kawaida kwa ujumla, lakini nukta baada ya [a] hugawanya sentensi moja ya Kigiriki na kufanya “Wala” ianze sentensi kwa mtiririko usio bora. Muundo mmoja wenye “na wala” ni wa asili zaidi. “Vitu vyote vilikuwa vya pamoja kwao” ni wazi na wa heshima.
  terminology: “Nafsi” ni chaguo linalokubalika kwa ψυχή katika nahau hii na linahifadhi jozi ya καρδία/ψυχή. “Mali yake binafsi” hueleza ἴδιον kwa usahihi bila kudai mfumo wa kiuchumi wa lazima. Tanbihi a ya rasimu inaongeza “maisha yao,” ambayo si ufafanuzi salama wa lazima wa nahau; imebadilishwa kuwa ufafanuzi wa umoja wa ndani.
