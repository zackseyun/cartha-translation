  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: sw
  text: Baada ya kuwasimamisha katikati, wakaanza kuwauliza[a], “Kwa nguvu gani, au katika jina gani, mlifanya jambo hili?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakiwauliza” au “wakawauliza.” Wakati usiotimilifu wa kitenzi cha Kigiriki unaweza kusisitiza tendo la kuuliza lililokuwa likiendelea badala ya mwanzo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: baada ya kuwasimamisha
  rationale: Kirai cha wakati kinaonyesha kwamba waliwasimamisha kwanza, kisha wakawauliza; tafsiri hii ni ya asili katika Kiswahili na inadumisha mfuatano wa matendo.
- source_word: ἐν τῷ μέσῳ
  choice: katikati yao
  rationale: Inahifadhi maana ya kuwaweka katikati ya baraza au kusanyiko bila kuibadili kuwa tafsiri ya kimahakama zaidi kama ‘mbele yao.’
- source_word: ἐπυνθάνοντο
  choice: wakaanza kuwauliza
  rationale: Wakati usiotimilifu wa Kigiriki unaweza kuwa wa kuanza au wa kuendelea; hapa ‘wakaanza kuwauliza’ inafaa katika mtiririko wa simulizi, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: kwa nguvu gani
  rationale: ‘Nguvu’ ni kisawe cha moja kwa moja cha δύναμις, na ‘kwa’ huwasilisha matumizi ya ἐν yenye maana ya chombo kwa Kiswahili cha kawaida.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: au katika jina gani
  rationale: Inadumisha nahau ya kibiblia ya kutenda ‘katika jina’ la mtu, yenye wazo la uwakilishi au mamlaka, bila kuisawazisha na ‘nguvu.’
- source_word: ἐποιήσατε τοῦτο
  choice: mmefanya jambo hili
  rationale: Kauli hii inaacha ‘jambo hili’ likirejelea uponyaji au ishara katika muktadha bila kuongeza ufafanuzi ndani ya aya.
- source_word: ὑμεῖς
  choice: mmefanya
  rationale: Kiambishi cha nafsi ya pili wingi katika kitenzi kinawasilisha ‘ninyi’ kwa kawaida; muktadha wa swali unabeba mkazo bila kulazimisha ‘ninyi wenyewe.’
theological_decisions:
- issue: Iwapo δύναμις itafsiriwe ‘nguvu’ au ifasiriwe kuwa ‘mamlaka’
  choice: nguvu
  alternative: mamlaka
  rationale: Neno la Kigiriki ni δύναμις, ambalo kwa kawaida humaanisha ‘nguvu’; kirai kinachofuata, ‘katika jina gani,’ tayari kinadokeza uwakilishi au mamlaka. ‘Nguvu’ inadumisha tofauti hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Katikati yao’ ni cha kawaida kuliko ‘katikati’ peke yake na kinahifadhi mazingira ya kuhojiwa. Kiashiria [a] kimewekwa mara baada ya kitenzi kinachohusika.
