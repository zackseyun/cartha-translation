  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: sw
  text: Lakini wengi kati ya wale waliokuwa wamesikia ujumbe[a] waliamini, na idadi ya wanaume[b] ikawa karibu elfu tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno.” Hapa “neno” linamaanisha tangazo au ujumbe wa mitume.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema “idadi ya wanaume,” huenda kikimaanisha hesabu ya wanaume badala ya umati wote wenye wanaume na wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: wengi
  rationale: Huhifadhi maana ya idadi kubwa isiyotajwa kwa usahihi bila kuongeza nomino isiyokuwamo katika Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti na upinzani na kukamatwa viliv相otangulia, huku ikibaki ya kawaida katika simulizi la Kiswahili.
- source_word: ἀκουσάντων τὸν λόγον
  choice: wale waliokuwa wamesikia ujumbe
  rationale: Wakati wa tendo unaonyesha kusikia kulikotangulia kuamini; hapa λόγος ni tangazo au ujumbe wa mitume.
- source_word: ἐπίστευσαν
  choice: waliamini
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi urahisi wa kitenzi cha Kigiriki bila kuongeza maelezo ya kitheolojia.
- source_word: ἐγενήθη ὁ ἀριθμὸς
  choice: idadi ... ikawa
  rationale: Hueleza hali iliyofikiwa na idadi kwa Kiswahili cha kawaida bila kuingiza wazi wazo la kukua ambalo limeachwa kudokezwa.
- source_word: τῶν ἀνδρῶν
  choice: ya wanaume
  rationale: ἀνήρ kwa kawaida humaanisha mwanamume, si watu kwa ujumla; tafsiri inadumisha rejeo la jinsia lililo katika matini.
- source_word: ὡς χιλιάδες πέντε
  choice: karibu elfu tano
  rationale: ὡς kabla ya idadi huonyesha makadirio; ‘karibu’ huwasilisha maana hiyo kwa kawaida.
theological_decisions:
- issue: Hesabu inayotaja jinsia katika τῶν ἀνδρῶν
  choice: wanaume
  alternative: watu; waamini
  rationale: Kigiriki kinatumia ἀνδρῶν, ambalo kwa kawaida hutaja wanaume. Hii haikatui ikiwa wanawake hawakuwamo katika jumuiya yote; inahifadhi tu namna hesabu inavyoelezwa katika mstari huu.
- issue: Maana ya λόγος katika muktadha
  choice: ujumbe
  alternative: neno
  rationale: Katika muktadha huu neno hilo linarejelea tangazo la mitume. ‘Ujumbe’ huwasilisha maana kwa uwazi, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya kimuundo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi; muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi makadirio ya idadi, mfuatano wa matendo, na rejeo la wanaume lililo katika Kigiriki.
