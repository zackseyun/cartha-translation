  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: sw
  text: Akiwa na shamba[a], aliliuza, akaleta fedha[b], akaziweka miguuni pa mitume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa alikuwa na shamba” au “alikuwa na shamba.” Kigiriki hutumia muundo wa genitivi huru kutoa hali ya usuli.
    reason: lexical_alternative
  - marker: b
    text: Au, “mapato ya mauzo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: Kwa kuwa alikuwa na shamba
  rationale: Muundo wa genitivi huru unatoa hali ya usuli; Kiswahili cha kawaida huieleza kwa urahisi kuwa alikuwa na shamba, bila kulazimisha maana ya sababu kwa kiwango kisichohitajika.
- source_word: ἀγροῦ
  choice: shamba
  rationale: ἀγρός hapa ni shamba au eneo la ardhi. “Shamba” ni neno la moja kwa moja na la kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: πωλήσας
  choice: aliliuza
  rationale: Partisipio ya aoristi inaonyesha tendo lililotangulia kuleta fedha. Kiambishi -li- kinarejelea shamba kwa uwazi na kwa mtiririko wa kawaida.
- source_word: ἤνεγκεν
  choice: akaleta
  rationale: φέρω katika muktadha huu ni kuleta au kubeba kitu hadi mahali fulani; “akaleta” linaonyesha kwa kawaida mfuatano wa matendo.
- source_word: τὸ χρῆμα
  choice: fedha
  rationale: χρῆμα hapa ni fedha zilizopatikana kwa mauzo. “Fedha” ni tafsiri ya moja kwa moja, huku tanbihi ikihifadhi uwezekano wa kusema “mapato ya mauzo.”
- source_word: ἔθηκεν
  choice: kuziweka
  rationale: τίθημι ni kuweka. Upatanisho wa ngeli katika “kuziweka” unarejelea fedha na kuhifadhi picha halisi ya tendo hilo.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: miguuni pa mitume
  rationale: Usemi huu unahifadhi picha halisi ya kuweka fedha karibu na miguu ya mitume na pia wazo la kuzikabidhi chini ya usimamizi wao, bila kulifafanua kupita maandishi.
theological_decisions:
- issue: Iwapo kuhifadhi picha halisi ya kukabidhi fedha chini ya mamlaka ya mitume
  choice: Kuhifadhi usemi “kuziweka miguuni pa mitume.”
  alternative: Kutoa maana pekee kuwa “akawapa mitume.”
  rationale: Maandishi yanaeleza tendo halisi la kuziweka fedha miguuni pa mitume, lenye pia maana ya kuzikabidhi kwa usimamizi wao. Kuhifadhi picha hiyo huepuka kuingiza madai ya ziada kuhusu muundo wa kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mfuatano wa “aliliuza, akaleta ... na kuziweka” ni wa kiasili na huhifadhi mpangilio wa matendo katika Kigiriki.
