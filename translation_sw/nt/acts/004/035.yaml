  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: sw
  text: Na walikuwa wakiviweka miguuni mwa mitume,[a] navyo vilikuwa vikigawiwa kwa kila mmoja kadiri mtu yeyote alivyokuwa na uhitaji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele ya mitume.” Kiyunani kinasema kihalisi “kando ya/miguuni mwa mitume,” kikihifadhi taswira ya kuweka mapato hayo chini ya usimamizi wa mitume.
    reason: lexical_alternative
  - marker: b
    text: Kitu kinachorejelewa katika “wakiviweka” na “navyo vilikuwa vikigawiwa” hakitajwi wazi hapa; mstari uliotangulia unaonyesha kuwa ni mapato ya vitu vilivyouzwa.
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: waliviweka
  rationale: Wakati usiotimilifu unaonyesha tendo lililokuwa likifanyika kwa kurudiwa katika simulizi. Kiambishi cha kitu “-vi-” kinarejelea kwa kawaida vilivyopatikana kutokana na mauzo katika mstari uliotangulia bila kutaja wazi “fedha” au “mapato.”
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: miguuni pa mitume
  rationale: Tafsiri hii inahifadhi taswira halisi ya kuweka vitu miguuni mwa mitume na pia maana ya kuviweka chini ya usimamizi wao.
- source_word: διεδίδετο
  choice: viligawiwa
  rationale: Kauli ya kutendwa pamoja na wakati usiotimilifu inadokeza ugawaji uliokuwa ukiendelea au ukifanyika kwa desturi. Kiswahili kinahitaji upatanisho wa ngeli; “vili-” kinarejelea vilivyowekwa bila kubainisha zaidi ya muktadha.
- source_word: ἑκάστῳ
  choice: kwa kila mmoja
  rationale: Huhifadhi maana ya ugawaji kwa watu mmoja mmoja kwa lugha ya kawaida na wazi.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: kadiri ya mahitaji yake
  rationale: “Kadiri ya” huonyesha kwamba mgao uliendana na kiwango cha uhitaji. Wingi “mahitaji” ni wa kawaida katika Kiswahili na hauondoi maana ya χρεία.
- source_word: τις
  choice: kila mmoja … yake
  rationale: Katika muktadha huu kiwakilishi kisichobainisha mtu ni cha ujumla. Muundo huu wa Kiswahili unajumuisha kila mtu bila kuingiza jinsia.
theological_decisions:
- issue: Kama kitu kilichowekwa na kugawiwa kitajwe wazi
  choice: Kukiacha kitegemezwe na muktadha kwa kutumia viambishi vya ngeli katika “waliviweka” na “viligawiwa.”
  alternative: Kutaja wazi “fedha” au “mapato ya mauzo.”
  rationale: Kiyunani hakitaji kitu hicho katika mstari huu bali hukitegemeza kwa mstari uliotangulia. Tafsiri haipaswi kuongeza ubainishaji usio katika sentensi, ingawa tanbihi inaeleza rejeleo hilo.
- issue: Taswira ya kuweka miguuni mwa mitume
  choice: Kuhifadhi usemi “miguuni pa mitume.”
  alternative: Kutafsiri “mbele ya mitume.”
  rationale: Usemi unaweza kudokeza mamlaka au usimamizi wa mitume, lakini taswira halisi ya maandishi inafaa kuhifadhiwa bila kuamua kwamba ni tamathali tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Miguuni pa” ni usemi wa kawaida unaohifadhi taswira ya Kiyunani; “kadiri ya mahitaji yake” ni wazi kwa msomaji wa kawaida na huhifadhi wazo la mgao kulingana na uhitaji.
