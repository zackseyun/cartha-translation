lexical_decisions:
- source_word: ἀκούσαντες
  choice: Waliposikia hayo
  rationale: Kitenzi kishirikishi cha wakati uliopita kina maana ya wakati katika muktadha huu. Neno “hayo” linaweka wazi kwa Kiswahili cha kawaida mambo waliyokuwa wameyasikia katika mistari iliyotangulia.
- source_word: ὁμοθυμαδόν
  choice: kwa moyo mmoja
  rationale: Usemi huu wa kawaida unaonyesha umoja wa nia na tendo, bila kudokeza kwamba walifanya kura au uamuzi rasmi.
- source_word: ἦραν φωνήν
  choice: wakamwinulia Mungu sauti
  rationale: Muundo huu unahifadhi taswira ya Kigiriki ya kuinua sauti, pamoja na nomino ya umoja inayosisitiza sala yao ya pamoja.
- source_word: πρὸς τὸν θεόν
  choice: Mungu
  rationale: Katika muktadha wa sala, kishazi hiki kinaonyesha kwamba maneno yao yalielekezwa kwa Mungu; kiambishi cha yambwa katika “wakamwinulia” kinatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: Δέσποτα
  choice: Mtawala Mkuu
  rationale: Jina hili la heshima linaonyesha mwenye mamlaka kuu na linatofautishwa na κύριος, ambalo kwa kawaida hutafsiriwa “Bwana.” “Mkuu” linaifanya sentensi iwe ya kawaida na yenye hadhi kwa Kiswahili bila kuongeza jina jingine la Mungu.
- source_word: σὺ ὁ ποιήσας
  choice: wewe ndiye uliyeumba
  rationale: Muundo huu unahifadhi msisitizo wa kiwakilishi σὺ na kumtambulisha Mungu wazi kuwa Muumba.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: mbingu, dunia, bahari
  rationale: Huu ni mtiririko wa kawaida wa Kiswahili unaohifadhi fomula ya uumbaji ya maandishi ya chanzo.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: vyote vilivyomo ndani yake
  rationale: Hii ni tafsiri ya kawaida na jumuishi ya vitu vyote vilivyomo katika mbingu, dunia na bahari; kiwakilishi cha mahali cha Kiswahili kinaweza kurejelea jumla hiyo.
theological_decisions:
- issue: Tafsiri ya Δέσποτα kama jina la heshima kwa Mungu
  choice: Mtawala Mkuu
  alternative: Bwana Mwenye Enzi; Bwana; Mwenye Mamlaka yote
  rationale: “Mtawala Mkuu” linaendeleza wazo la mamlaka kamili na, kadiri iwezekanavyo, linahifadhi tofauti ya kileksika kati ya Δέσποτα na κύριος. “Bwana” pekee lingeifuta tofauti hiyo, ilhali “Mwenye Mamlaka yote” lingekuwa ufafanuzi mpana zaidi kuliko neno la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Kwa moyo mmoja” huwasilisha umoja wa kundi, na “wewe ndiye” huhifadhi msisitizo wa maandishi ya Kigiriki.
