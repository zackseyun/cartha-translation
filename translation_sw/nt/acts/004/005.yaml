  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: sw
  text: Ikawa kwamba siku iliyofuata watawala wao, wazee, na waandishi wa sheria walikusanywa[a] katika Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “walikusanyika” au “walikutana pamoja.” Kitenzi cha Kigiriki kina umbo la kutendwa: “walikusanywa pamoja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Kesho yake
  rationale: Muundo huu unaendeleza simulizi kwa kutambulisha tukio lililofuata. Katika Kiswahili, kuunganisha fomula hiyo na kirai cha wakati kunatoa sentensi ya asili bila usemi mzito wa ‘ikatukia kwamba’.
- source_word: ἐπὶ τὴν αὔριον
  choice: Kesho yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaomaanisha siku iliyofuata katika simulizi.
- source_word: συναχθῆναι
  choice: walikusanyika
  rationale: Huwasilisha kwa kawaida tendo la kundi kukutana pamoja. Ingawa umbo la Kigiriki ni la kutendwa, Kiswahili hutumia kwa ufasaha kitenzi cha kujitenda hapa; tanbihi inadumisha taarifa ya umbo la chanzo.
- source_word: αὐτῶν
  choice: wao
  rationale: Inahifadhi kiwakilishi cha uhusiano bila kubainisha kupita kiasi kwamba viongozi hao walikuwa wa kundi gani hasa.
- source_word: τοὺς ἄρχοντας
  choice: viongozi
  rationale: Katika muktadha huu neno linawahusu wenye mamlaka ya uongozi. ‘Viongozi’ ni la sasa na pana bila kudokeza wafalme.
- source_word: τοὺς πρεσβυτέρους
  choice: wazee
  rationale: Hapa ni cheo cha viongozi wanaotambuliwa katika jamii, si maelezo ya umri tu; ‘wazee’ ndilo neno lililozoeleka katika muktadha huu.
- source_word: τοὺς γραμματεῖς
  choice: waandishi wa sheria
  rationale: Neno linataja tabaka la wataalamu wa maandiko na sheria. ‘Waandishi wa sheria’ linaeleweka kwa msomaji wa sasa kuliko ‘waandishi’ peke yake bila kuifinya maana kuwa walimu tu.
- source_word: ἐν Ἰερουσαλήμ
  choice: huko Yerusalemu
  rationale: Ni kirai cha mahali; ‘huko’ kinaendana kwa asili na mahali palipokwisha kuwekwa katika simulizi, huku kikihifadhi Yerusalemu kama eneo la mkutano.
theological_decisions:
- issue: Kirejelea cha αὐτῶν katika maelezo ya viongozi waliokusanyika
  choice: Kimetafsiriwa ‘wao’ ili kuhifadhi kiwakilishi cha Kigiriki bila kutaja kirejelea chake kwa namna finyu.
  alternative: Kuacha kiwakilishi, au kutafsiri ‘viongozi wa Wayahudi.’
  rationale: Mstari wenyewe hautaji wazi kirejelea cha αὐτῶν. ‘Wao’ huhifadhi uhusiano uliopo katika chanzo na pia utata wake wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa kwa mtiririko wa kawaida wa simulizi la Kiswahili; orodha ya makundi matatu na kiwakilishi cha αὐτῶν zimehifadhiwa.
