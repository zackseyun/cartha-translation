id: ACT.4.29
reference: Acts 4:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: sw
  text: Na sasa, Bwana, uangalie vitisho vyao, na uwajalie watumishi wako[a] kusema neno lako kwa ujasiri wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumwa wako.” Neno la Kigiriki doulos linaweza kumaanisha mtu aliye mali ya bwana. Hapa “watumishi” limetumiwa kwa sababu muktadha wa sala unakazia huduma ya unyenyekevu kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: Na sasa
  rationale: Ni kiunganishi cha kawaida cha kuhamisha sala kutoka katika maelezo yaliyotangulia hadi ombi la wakati huu; kinahifadhi maana ya hali ilivyo sasa.
- source_word: κύριε
  choice: Bwana
  rationale: Ni namna ya kawaida na yenye heshima ya kumwita Mungu moja kwa moja katika sala.
- source_word: ἔπιδε ἐπὶ
  choice: uangalie
  rationale: Kitenzi hiki cha amri kinamwomba Mungu avitazame na kuvitilia maanani vitisho; ‘uangalie’ ni cha asili katika Kiswahili na hakiongezi hatua ambayo haikutajwa.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: vitisho vyao
  rationale: ‘Vitisho’ ni neno la sasa na lililo wazi kwa ἀπειλάς, huku ‘vyao’ kikidumisha rejeo la watu wanaotoa vitisho hivyo.
- source_word: δὸς
  choice: uwajalie
  rationale: Ingawa maana ya msingi ni ‘toa,’ katika sala kitenzi hiki kinaomba Mungu awape uwezo au nafasi ya kufanya jambo; ‘uwajalie’ ni cha kawaida na chenye heshima.
- source_word: τοῖς δούλοις σου
  choice: watumishi wako
  rationale: δοῦλος huonyesha mtu aliye chini ya mamlaka na aliye mali ya bwana. Katika sala hii, ‘watumishi wako’ huwasilisha unyenyekevu na kujitoa kwa Mungu kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi maana yenye nguvu zaidi ya neno la Kigiriki.
- source_word: μετὰ παρρησίας πάσης
  choice: kwa ujasiri wote
  rationale: παρρησία hapa ni uhuru wa kusema bila woga, na πάσης inasisitiza ukamilifu wa ujasiri huo; tafsiri hii inadumisha msisitizo huo.
- source_word: λαλεῖν
  choice: kusema
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi bila kuongeza wazo lenye nguvu zaidi la ‘kutangaza,’ ingawa muktadha ni wa kuhubiri.
- source_word: τὸν λόγον σου
  choice: neno lako
  rationale: Inahifadhi nahau ya kibiblia na rejeo la ujumbe wa Mungu bila kuufafanua zaidi kuliko maandishi.
theological_decisions:
- issue: Maana ya δοῦλος katika uhusiano na Mungu
  choice: watumishi wako
  alternative: watumwa wako; watumishi walio mali yako
  rationale: Muktadha wa sala unasisitiza huduma ya unyenyekevu na utiifu kwa Mungu. ‘Watumishi’ ni ya asili na yenye heshima katika Kiswahili, lakini tanbihi inaonyesha kuwa neno la Kigiriki linaweza pia kusisitiza kuwa wao ni mali ya Bwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi ya sala. Muundo wa sentensi unafuata mwendo wa Kigiriki huku ukitumia ‘uwajalie ... kusema’ kwa ufasaha wa kawaida wa Kiswahili.
