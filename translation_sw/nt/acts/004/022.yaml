  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: sw
  text: Kwa maana mtu huyo, ambaye ishara hii ya uponyaji ilikuwa imetokea kwake, alikuwa na umri wa zaidi ya miaka arobaini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ishara hii ya kuponywa,” au “muujiza huu wa uponyaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: alikuwa na umri wa zaidi ya miaka arobaini
  rationale: Muundo huu wa Kiyunani ni nahau ya kuonyesha umri. Kiswahili cha kawaida hutumia ‘alikuwa na umri wa zaidi ya miaka arobaini.’
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu inayounga mkono kauli iliyotangulia; ‘Kwa maana’ huhifadhi uhusiano huo wa hoja.
- source_word: ὁ ἄνθρωπος
  choice: mtu
  rationale: ἄνθρωπος humrejelea mtu maalumu wa kiume anayejulikana kutokana na muktadha. ‘Mtu’ ni ya asili katika Kiswahili, bila kupoteza rejeleo hilo la kimuktadha.
- source_word: ἐφ’ ὃν
  choice: ambaye ... kwake
  rationale: ἐπί pamoja na kiwakilishi hapa humtaja mtu aliyeathiriwa na tukio. Muundo wa Kiswahili ‘ambaye ... kwake’ unaeleza uhusiano huo kwa kawaida.
- source_word: γεγόνει
  choice: ilikuwa imetokea
  rationale: Wakati timilifu uliopita wa γίνομαι huonyesha tukio lililokuwa limekamilika kabla ya wakati unaosimuliwa. ‘Ilikuwa imetokea’ huhifadhi mtazamo wa tukio bila kuongeza mtendaji asiyetajwa wazi na kitenzi.
- source_word: τὸ σημεῖον τοῦτο
  choice: ishara hii
  rationale: ‘Ishara’ huhifadhi maana ya σημεῖον kama tendo lenye umuhimu wa kuthibitisha au kufunua, badala ya kulifanya kuwa ajabu tu.
- source_word: τῆς ἰάσεως
  choice: ya uponyaji
  rationale: ἴασις humaanisha kuponywa au uponyaji; ‘ya uponyaji’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri σημεῖον katika muktadha wa muujiza
  choice: ishara
  alternative: muujiza
  rationale: ‘Ishara’ huhifadhi mkazo wa Luka kwamba tendo hilo lina maana ya kuthibitisha na kufunua, bila kuongeza tafsiri iliyo pana kuliko neno la Kiyunani.
- issue: Mtendaji au kauli inayodokezwa na γεγόνει
  choice: ilikuwa imetokea
  alternative: ilikuwa imefanywa
  rationale: Kiyunani kinatumia γίνομαι, si kauli tendwa ya kitenzi ‘kufanya.’ Tafsiri iliyochaguliwa hulenga tukio na haiongezi mtendaji kwa njia iliyo wazi zaidi kuliko matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida huku ukihifadhi uhusiano wa kisababu wa γὰρ, maana ya ‘ishara,’ na kutotajwa wazi kwa mtendaji katika γεγόνει.
