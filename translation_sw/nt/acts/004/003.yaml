  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao’ huendeleza simulizi, na mfuatano wa ‘waka-’ unaakisi hatua zinazofuatana. Alama za tanbihi [a] na [b] zimewekwa mara tu baada ya maneno yanayohusika.
