  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: sw
  text: Nao wakawakamata[a] na wakawaweka chini ya ulinzi[b] mpaka siku iliyofuata, kwa maana tayari ilikuwa jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, ‘waliweka mikono juu yao’; katika muktadha huu nahau hiyo inamaanisha kuwakamata kwa nguvu au kwa mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Au ‘kuwaweka kizuizini’ au ‘kuwafunga gerezani.’ Kigiriki hakitaji mahali hususa walikozuiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον ... τὰς χεῖρας
  choice: wakawakamata
  rationale: Katika muktadha huu wa hatua ya mamlaka yenye uhasama, nahau ya Kigiriki, ambayo kwa neno halisi ni ‘waliweka mikono juu yao,’ ina maana ya kuwakamata. ‘Wakawakamata’ ni Kiswahili cha kawaida na wazi; tanbihi inahifadhi picha ya nahau ya asili.
- source_word: αὐτοῖς
  choice: -wa- / wao
  rationale: Kiwakilishi hiki cha wingi kinawarejelea Petro na Yohana; katika Kiswahili kimeingizwa kiasili katika vitenzi ‘wakawakamata’ na ‘kuwaweka.’
- source_word: ἔθεντο εἰς τήρησιν
  choice: kuwaweka chini ya ulinzi
  rationale: τήρησις humaanisha kutunzwa kwa ulinzi au kuzuiliwa. Usemi huu unaonyesha kizuizi rasmi bila kudai kwamba waliwekwa katika jengo maalumu la gereza.
- source_word: εἰς τὴν αὔριον
  choice: mpaka siku iliyofuata
  rationale: Hii ni kauli ya wakati. ‘Mpaka siku iliyofuata’ inafaa simulizi la wakati uliopita na ni ya asili kuliko ‘mpaka kesho’ katika muktadha huu.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: kwa maana tayari ilikuwa jioni
  rationale: Tafsiri hii inahifadhi sababu iliyotolewa na γάρ na rejeo mahususi la wakati wa jioni, bila kulipanua kuwa ‘usiku sana.’
