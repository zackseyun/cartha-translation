  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: sw
  text: Lakini ili jambo hili lisienee zaidi miongoni mwa watu, na tuwatishe[a] wasiseme tena na mtu yeyote kwa jina hili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na tuwaonye vikali.” Kitenzi cha Kigiriki hasa humaanisha kuwatisha au kuwatolea vitisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: lisienee
  rationale: Katika muktadha huu kitenzi kinaonyesha habari au ujumbe kuenea miongoni mwa watu; “lisienee” ni Kiswahili cha kawaida na huhifadhi maana bila kufafanua mno kitu kinachoenea.
- source_word: ἐπὶ πλεῖον
  choice: zaidi
  rationale: Huhifadhi wazo la kuendelea au kufikia kiwango kikubwa kuliko kilichopo sasa.
- source_word: λαός
  choice: watu
  rationale: Hurejelea umma kwa ujumla katika muktadha huu, si kundi dogo tu.
- source_word: ἀπειλησώμεθα
  choice: na tuwatishe
  rationale: Kitenzi cha Kigiriki humaanisha kutoa vitisho, hasa kwa shinikizo la mamlaka. “Tuwatishe” ni sahihi na ya asili kuliko kupunguza nguvu yake kuwa onyo la kawaida.
- source_word: μηκέτι λαλεῖν
  choice: wasiseme tena
  rationale: Huhifadhi katazo pamoja na maana ya kusitisha kuanzia sasa.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: kwa jina hili
  rationale: Kirai hiki kinaweza kuonyesha kusema kwa mamlaka ya jina hilo au kwa kulihusisha; “kwa jina hili” huhifadhi ufupi na upeo wa usemi wa asili.
- source_word: μηδενὶ ἀνθρώπων
  choice: na mtu yeyote
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kutomwambia mtu hata mmoja.
theological_decisions:
- issue: Nguvu ya ἀπειλησώμεθα katika hatua ya baraza
  choice: na tuwatishe
  alternative: na tuwaonye vikali
  rationale: Mazingira ni ya mamlaka yenye kulazimisha, na kitenzi chenyewe kina maana ya kutisha au kutoa vitisho. Tafsiri kuu inadumisha nguvu hiyo badala ya kuifanya kuwa onyo tu; tanbihi inaonyesha mbadala unaowezekana.
- issue: Maana ya kusema ἐπὶ τῷ ὀνόματι τούτῳ
  choice: kwa jina hili
  alternative: kwa mamlaka ya jina hili / kuhusu jina hili
  rationale: Kigiriki kinaweza kuhusisha msingi, mamlaka, au uhusiano na jina. Tafsiri fupi “kwa jina hili” hailazimishi tafsiri moja ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Jambo hili” limetumika kama kiwakilishi cha kile kinachoenea, ambacho hakitajwi wazi katika mstari huu; hivyo kutokuwa wazi kwa matini asili hakujafafanuliwa kupita kiasi.
