  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: sw
  text: huku ukinyoosha mkono wako ili kuponya, na ishara na maajabu yafanyike kwa njia ya jina la mtumishi wako mtakatifu Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoto wako mtakatifu Yesu.” Neno la Kigiriki pais linaweza kumaanisha “mtoto” au “mtumishi”; hapa “mtumishi” limependelewa kwa sababu Kitabu cha Matendo kinatoa mwangwi wa lugha ya Mtumishi katika Isaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: huku ukinyoosha
  rationale: Muundo huu unaonyesha tendo linaloendelea wakati mmoja na ombi; “huku ukinyoosha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kimazingira.
- source_word: τὴν χεῖρά σου
  choice: mkono wako
  rationale: Tafsiri ya moja kwa moja ni ya asili katika Kiswahili na inadumisha tamathali ya kibiblia ya tendo na nguvu za Mungu.
- source_word: εἰς ἴασιν
  choice: ili kuponya
  rationale: εἰς pamoja na ἴασιν huonyesha kusudi au matokeo; “ili kuponya” ni wazi na ya kawaida katika Kiswahili.
- source_word: σημεῖα καὶ τέρατα
  choice: ishara na maajabu
  rationale: Hili ni jozi la maneno linalotumiwa mara kwa mara katika Matendo; tafsiri hii ni sahihi bila kuongeza neno la kufafanua kama “kimiujiza.”
- source_word: γίνεσθαι
  choice: yafanyike
  rationale: Hapa kitenzi kinaeleza ishara na maajabu kutokea; hali ya kutegemea “yafanyike” inafaa katika mwendelezo wa ombi na ni ya asili zaidi kuliko muundo mzito wa kutendwa.
- source_word: διὰ τοῦ ὀνόματος
  choice: kwa njia ya jina
  rationale: Huhifadhi maana ya διά yenye hali ya umilikishi, yaani chombo au njia, bila kufafanua “jina” moja kwa moja kuwa mamlaka.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: la mtumishi wako mtakatifu Yesu
  rationale: παῖς inaweza kumaanisha mtoto au mtumishi. Katika Matendo kifungu hiki kina mwangwi wa Mtumishi wa Isaya, hivyo “mtumishi” inapendelewa huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya παῖς kumhusu Yesu
  choice: mtumishi
  alternative: mtoto
  rationale: Ingawa παῖς inaweza kuwa “mtoto” au “mtumishi,” matumizi yake katika Matendo 3:13, 3:26 na hapa yanaelekea kwenye lugha ya Mtumishi katika Isaya. “Mtumishi” huhifadhi uhusiano huo bila kukanusha uana wa Yesu, na tafsiri mbadala imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ombi umehifadhiwa kwa “yafanyike,” na lugha imeepuka ufafanuzi wa kimadhehebu.
