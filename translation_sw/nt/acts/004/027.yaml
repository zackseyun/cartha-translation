source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: sw
  text: Kwa maana, kwa kweli, katika mji huu Herode na Pontio Pilato, pamoja na Mataifa na makundi ya watu wa Israeli[b], walikusanyika kumpinga mtumishi wako mtakatifu Yesu[a], ambaye ulimtia mafuta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoto wako mtakatifu Yesu.” Neno la Kigiriki παῖς laweza kumaanisha “mtumishi” au “mtoto”; hapa “mtumishi” limechaguliwa kwa sababu huenda kuna mwangwi wa lugha ya Mtumishi katika Isaya.
    reason: lexical_alternative
  - marker: b
    text: Au, “mataifa na watu wa Israeli.” Kigiriki kina “Mataifa/mataifa” (ἔθνη) na “watu” katika wingi (λαοί) wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: walikusanyika
  rationale: Kitenzi cha wakati uliopita katika hali ya kutendwa kinaonyesha mkusanyiko uliotimia. Kiswahili cha kawaida hutumia umbo la kujirejelea ‘walikusanyika,’ ambalo linatoa maana hiyo kwa ufasaha bila kubainisha zaidi mtendaji aliyewakusanya.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huunganisha mstari huu na maneno yaliyotangulia kwa kutoa msingi au uthibitisho wa sala hiyo.
- source_word: ἐπ’ ἀληθείας
  choice: kwa kweli
  rationale: Ni usemi wa kusisitiza ukweli wa jambo; ‘kwa kweli’ ni wa asili na wenye hadhi katika Kiswahili cha sasa.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: katika mji huu
  rationale: Huhifadhi rejeo la moja kwa moja kwa mji uliopo katika muktadha bila kuongeza jina ‘Yerusalemu’ lisilotajwa hapa.
- source_word: ἐπὶ τὸν
  choice: kumpinga
  rationale: Pamoja na kitenzi cha kukusanyika, kihusishi hiki kina maana ya uadui unaoelekezwa kwa Yesu.
- source_word: ἅγιον
  choice: mtakatifu
  rationale: Huhifadhi maana ya aliyewekwa wakfu kwa Mungu na ya utakatifu.
- source_word: παῖδά σου
  choice: mtumishi wako
  rationale: Ingawa παῖς yaweza kumaanisha mtoto au mtumishi, mwangwi unaowezekana wa Mtumishi wa Isaya na matumizi yake katika Matendo 3–4 yanaunga mkono ‘mtumishi.’
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: ὃν ἔχρισας
  choice: ambaye ulimtia mafuta
  rationale: Hutoa maana halisi ya χρίω na kuhifadhi mwangwi wa Kimasihi na wa kuwekwa rasmi na Mungu bila kuingiza nomino ‘Masihi.’
- source_word: Ἡρῴδης
  choice: Herode
  rationale: Umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: τε καὶ
  choice: na
  rationale: Huunganisha Herode na Pontio Pilato kwa njia ya kawaida katika Kiswahili.
- source_word: Πόντιος Πιλᾶτος
  choice: Pontio Pilato
  rationale: Umbo la majina haya lililozoeleka katika Kiswahili cha Biblia.
- source_word: ἔθνεσιν
  choice: Mataifa
  rationale: Katika utofautishaji na Israeli, neno hili linataja watu wasio Wayahudi; ‘Mataifa’ ni istilahi fupi na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: λαοῖς Ἰσραήλ
  choice: makundi ya watu wa Israeli
  rationale: Huhifadhi wingi wa λαοῖς kwa Kiswahili kinachoeleweka kuliko kutafsiri kama umoja ‘watu wa Israeli.’
theological_decisions:
- issue: Tafsiri ya παῖς kuhusu Yesu
  choice: mtumishi
  alternative: mtoto
  rationale: Muktadha wa sala na matumizi yanayofanana katika Matendo yanaelekea kwenye lugha ya Mtumishi wa Isaya. Chaguo hili halikanushi uwana wa Yesu, bali linaonyesha dhana inayosisitizwa na neno hili hapa.
- issue: Tafsiri ya ἔθνεσιν ikilinganishwa na Israeli
  choice: Mataifa
  alternative: watu wa mataifa mengine
  rationale: Muktadha unatofautisha mataifa na makundi ya Israeli. ‘Mataifa’ huhifadhi msamiati wa chanzo na utofautishaji huo bila kuufanya kuwa wa kisiasa tu.
- issue: Wingi wa λαοῖς Ἰσραήλ
  choice: makundi ya watu wa Israeli
  alternative: watu wa Israeli
  rationale: Chanzo kina wingi ‘watu/makundi ya watu.’ Tafsiri hii huhifadhi wingi huo huku ikibaki wazi kwa msomaji wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa sala na msisitizo wa ‘kwa kweli.’ ‘Makundi ya watu wa Israeli’ limetumiwa kuonyesha wingi wa Kigiriki bila kufanya Kiswahili kuwa kigumu kupita kiasi.
