  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: sw
  text: Ikiwa leo tunahojiwa kuhusu tendo jema lililomtendewa mtu dhaifu, yaani, ni kwa njia gani mtu huyu ameponywa[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ameokolewa” au “amefanywa mzima”; kitenzi cha Kigiriki kinaweza kumaanisha kuokoa, kuponya, au kufanya mzima. Hapa muktadha wa karibu unaelekea kwenye uponyaji wa kimwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: tunahojiwa
  rationale: Kitenzi hiki kinaweza kumaanisha kuchunguzwa au kuulizwa katika mazingira ya kisheria. “Tunahojiwa” ni Kiswahili cha kawaida kinachohifadhi uzito wa uchunguzi bila kuzidisha kuwa kesi rasmi.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: kuhusu tendo jema
  rationale: Kirai hiki kinaonyesha msingi au jambo lililosababisha kuhojiwa. “Tendo jema” linafikisha maana ya kitendo cha kumtendea mtu mema na kuhifadhi kejeli ya kuhojiwa kwa sababu ya jambo lenye manufaa.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: kwa mtu aliyekuwa dhaifu
  rationale: ἀσθενής humaanisha mtu dhaifu au asiye na nguvu; hapa muktadha ni ulemavu wa kimwili, si ugonjwa uliotajwa kwa namna maalumu. Wakati uliopita unaendana na ukweli kwamba sasa ameponywa.
- source_word: ἐν τίνι
  choice: ni kwa njia gani
  rationale: Kirai hiki kinaweza kuuliza njia, chombo, au wakala. “Kwa njia gani” huhifadhi upana wa Kigiriki na kuacha mstari unaofuata utaje Yesu kuwa jibu.
- source_word: σέσωσται
  choice: ameponywa
  rationale: Katika muktadha wa mtu aliyerejeshwa kimwili, “ameponywa” ndiyo maana ya karibu zaidi. Hata hivyo, kitenzi σῴζω pia kinaweza kumaanisha kuokolewa, jambo linalohifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya σέσωσται katika muktadha wa uponyaji
  choice: ameponywa
  alternative: ameokolewa; amefanywa mzima
  rationale: Muktadha wa karibu unahusu kurejeshwa kimwili kwa mtu aliyekuwa kilema. Lakini mwingiliano wa maana kati ya uponyaji na wokovu haujafutwa; umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yaani” unaonyesha kwamba swali la njia ya uponyaji linafafanua jambo linalohojiwa. Alama ya mwisho inaacha sentensi ikiendelea katika mstari unaofuata.
