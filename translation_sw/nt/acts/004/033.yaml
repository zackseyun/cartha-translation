base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: sw
  text: Nao, kwa nguvu nyingi, mitume walikuwa wakitoa ushuhuda wao kuhusu kufufuka kwa Bwana Yesu, na kibali kikubwa kilikuwa juu yao wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na neema kubwa ilikuwa juu yao wote.” Neno la Kigiriki χάρις linaweza kumaanisha “neema” au “kibali”; hapa huenda likarejelea neema ya Mungu, kukubaliwa kwa waamini, au yote mawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: kwa nguvu nyingi
  rationale: Hueleza namna au uwezo ambao kwao mitume walitoa ushuhuda. Kauli hii ni ya kawaida katika Kiswahili na haiwekewi mipaka kuwa miujiza pekee.
- source_word: ἀπεδίδουν
  choice: walikuwa wakitoa
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea au kurudiwa, kulingana na hali ya kitenzi cha Kigiriki.
- source_word: τὸ μαρτύριον
  choice: ushuhuda wao
  rationale: ‘Ushuhuda’ linafaa katika muktadha huu; ‘wao’ linaweka wazi kwa njia ya kawaida kwamba mitume ndio walioutoa, jambo lililo wazi katika sentensi ya Kigiriki.
- source_word: τῆς ἀναστάσεως
  choice: kuhusu kufufuka
  rationale: Hapa umilikishi wa Kigiriki unaonyesha maudhui ya ushuhuda. ‘Kuhusu’ ni wazi na ya kawaida katika Kiswahili.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: kwa Bwana Yesu
  rationale: Katika kirai ‘kufufuka kwa Bwana Yesu,’ ‘kwa’ huunganisha kufufuka na Yesu kwa Kiswahili cha kawaida, huku κύριος ikitafsiriwa ‘Bwana.’
- source_word: χάρις
  choice: kibali
  rationale: ‘Kibali’ kinaweza kueleza hali ya kukubaliwa au kutazamwa kwa wema bila kuamua wazi kama chanzo ni Mungu, watu, au vyote viwili.
- source_word: τε
  choice: na
  rationale: Kiunganishi rahisi ‘na’ kinawasilisha uhusiano mwororo wa kishazi hiki na kilichotangulia.
- source_word: ἐπὶ πάντας αὐτούς
  choice: juu yao wote
  rationale: Huhifadhi taswira ya jambo lililokuwa juu ya kundi lote na msisitizo wa kuwahusu wote.
theological_decisions:
- issue: Maana ya χάρις katika muktadha
  choice: kibali kilichokuwa juu ya jumuiya yote
  alternative: neema ya Mungu kwa maana iliyo wazi zaidi ya kiteolojia, au kukubaliwa na watu
  rationale: Chanzo cha χάρις hakitajwi. ‘Kibali’ kinahifadhi uwezekano wa wema wa Mungu na/au mtazamo mwema wa watu bila kuamua jambo ambalo aya haijaamua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘walikuwa wakitoa’ huhifadhi hali endelevu ya kitenzi, na ‘kibali’ pamoja na tanbihi huhifadhi utata wa χάρις.
