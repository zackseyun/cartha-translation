  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: sw
  text: Yosefu, aliyeitwa Barnaba na mitume—jina ambalo, likitafsiriwa, maana yake ni “mwana wa kutia moyo”[a]—alikuwa Mlawi, mzaliwa wa Kipro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwana wa kuhimiza,” “mwana wa kufariji,” au “mwana wa faraja.” Neno la Kigiriki linaweza kumaanisha kutia moyo, kuhimiza, au kufariji.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Yosefu
  rationale: Umbo la kawaida la Kiswahili la jina hili la kibiblia.
- source_word: δὲ
  choice: (haijaonyeshwa kwa neno mahususi)
  rationale: Hapa ni kiunganishi hafifu cha simulizi; mtiririko wa Kiswahili hauhitaji kuongezewa ‘basi’ au ‘lakini,’ jambo ambalo lingeweza kuzidisha maana yake.
- source_word: ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: ambaye mitume walimwita Barnaba
  rationale: Muundo tendaji ni wa kawaida katika Kiswahili na unaonyesha wazi kwamba jina hilo lilitoka kwa mitume, bila kuongeza wazo la ‘pia’ lisilomo wazi katika chanzo.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: maana yake, ikitafsiriwa, ni
  rationale: Inahifadhi maelezo ya Luka kwamba jina hilo linafafanuliwa kwa kutafsiriwa.
- source_word: υἱὸς παρακλήσεως
  choice: mwana wa kutia moyo
  rationale: ‘Kutia moyo’ ni usemi wa kawaida na mpana unaoweza kuhusisha kuhimiza na kufariji; upana mwingine wa neno umehifadhiwa katika tanbihi.
- source_word: Λευίτης
  choice: Mlawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mtu wa kabila au kundi la Lawi.
- source_word: Κύπριος τῷ γένει
  choice: mzaliwa wa Kipro
  rationale: Huonyesha asili ya kuzaliwa kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
theological_decisions:
- issue: Maana ya παρακλήσεως katika ufafanuzi wa jina Barnaba
  choice: kutia moyo
  alternative: kuhimiza; kufariji; kutoa faraja
  rationale: Neno la Kigiriki lina wigo unaojumuisha kuhimiza, kusihi, na kufariji. Matini hailazimishi maana moja nyembamba, hivyo tafsiri kuu imetumia usemi mpana na tanbihi imehifadhi maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imebaki sehemu ya muundo unaoendelea hadi mstari unaofuata, kama ilivyo katika chanzo; vistari virefu vinatenga ufafanuzi wa maana ya jina.
