  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: sw
  text: wakisema, “Tuwafanyie nini watu hawa? Kwa maana ni dhahiri kwa wote wanaoishi Yerusalemu kwamba ishara inayojulikana sana[a] imetokea kupitia kwao, nasi hatuwezi kuikana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara mashuhuri.” Neno la Kigiriki γνωστόν linaweza kumaanisha “inayojulikana” au “inayojulikana sana”; hapa linadokeza ishara iliyotambuliwa hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kauli endelevu inaunganisha usemi huu na simulizi lililotangulia; “wakisema” ni ya kawaida na huhifadhi muundo huo.
- source_word: Τί ποιήσωμεν τοῖς ἀνθρώποις τούτοις
  choice: Tuwafanyie nini watu hawa?
  rationale: Huhifadhi swali la kujadiliana lililo katika aoristi tegemezi, huku Kiswahili cha “kumfanyia nini” kikitoa maana ya kuchukua hatua kuhusu mtu.
- source_word: ὅτι μὲν γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa sentensi inayofuata inatoa sababu; msisitizo wa chembe μὲν unaeleweka katika muktadha bila kuongeza neno lisilo la lazima.
- source_word: γνωστὸν σημεῖον
  choice: ishara inayojulikana sana
  rationale: γνωστός hapa inaelekea kumaanisha jambo linalojulikana wazi na wengi; “inayojulikana sana” huhifadhi wazo la kutambuliwa hadharani bila kuligeuza tu kuwa “ya ajabu.”
- source_word: γέγονεν δι’ αὐτῶν
  choice: imetokea kupitia kwao
  rationale: Wakati timilifu unaonyesha tukio lililokwisha kutokea lenye matokeo ya sasa, na διά pamoja na jenitivi huhifadhiwa kwa “kupitia kwao” bila kuwafanya wao kuwa chanzo cha mwisho.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: ni dhahiri kwa wote wanaoishi Yerusalemu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya jambo lililo wazi hadharani kwa wakaaji wote wa Yerusalemu.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: hatuwezi kuikana
  rationale: Kiwakilishi cha kitu katika “kuikana” kinarejelea ishara iliyotajwa, kama muktadha wa Kigiriki unavyodokeza.
theological_decisions:
- issue: Maana ya σημεῖον katika muktadha wa uponyaji wa hadharani
  choice: ishara
  alternative: muujiza
  rationale: “Ishara” huhifadhi neno la Luka na uzito wake wa kuelekeza kwenye maana iliyo zaidi ya tendo lenyewe; “muujiza” ingesisitiza tu hali yake ya kimiujiza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa wa kawaida kwa Kiswahili huku uhusiano wa hoja, uwakala wa “kupitia kwao,” na maana ya kitheolojia ya “ishara” vikihifadhiwa.
