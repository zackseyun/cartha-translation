base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: sw
  text: 'ambaye[a], kwa njia ya Roho Mtakatifu, alinena kwa kinywa cha Daudi, mtumishi wako: “Kwa nini mataifa yalifanya ghasia[b], na watu wakapanga mambo ya ubatili?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati zina maneno “baba yetu Daudi, mtumishi wako,” hivyo utangulizi unaweza kusomeka: “ambaye, kwa njia ya Roho Mtakatifu, alinena kwa kinywa cha baba yetu Daudi, mtumishi wako.”'
    reason: textual_variant
  - marker: b
    text: Au “yalighadhibika.” Kitenzi cha Kigiriki kinaweza kueleza msukosuko wa hasira na ukaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: ambaye
  rationale: Kiunganishi hiki kinarejelea Mungu aliyetajwa katika mstari wa 24 na kuendeleza sentensi kwa Kiswahili cha kawaida. Maneno yenye ushahidi tofauti wa hati kuhusu ‘baba yetu’ yamehifadhiwa katika tanbihi.
- source_word: διὰ πνεύματος ἁγίου
  choice: kwa njia ya Roho Mtakatifu
  rationale: διά pamoja na umilikishi huonyesha njia au wakala; tafsiri hii inadumisha kazi ya Roho Mtakatifu kama njia ya usemi.
- source_word: στόματος Δαυὶδ
  choice: kwa kinywa cha Daudi
  rationale: Hii inadumisha nahau ya kibiblia inayomtaja Daudi kama chombo cha usemi wa kinabii, huku ikieleweka kwa urahisi.
- source_word: παιδός σου
  choice: mtumishi wako
  rationale: παῖς inaweza kumaanisha mtoto au mtumishi, lakini kwa Daudi katika muktadha huu ‘mtumishi’ ndiyo maana inayofaa zaidi.
- source_word: εἰπών
  choice: alisema
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaanzisha nukuu na kwa Kiswahili hutafsiriwa kwa kawaida kwa kitenzi kamili.
- source_word: Ἱνατί
  choice: Kwa nini
  rationale: Hiki ni kiulizi cha moja kwa moja kinachoanzisha nukuu ya Zaburi.
- source_word: ἐφρύαξαν
  choice: walighadhabika
  rationale: Kitenzi kinaonyesha msukosuko mkali na ukaidi wa mataifa; ‘walighadhabika’ huwasilisha hasira hiyo yenye uasi.
- source_word: ἔθνη
  choice: mataifa
  rationale: Katika nukuu hii ya Zaburi neno linarejelea mataifa kwa upana, si lazima watu wasio Wayahudi kama kundi la kidini.
- source_word: λαοὶ
  choice: makabila ya watu
  rationale: Wingi wa Kigiriki unadumishwa na utofauti wake na ‘mataifa’ unaonekana katika usambamba wa kishairi.
- source_word: ἐμελέτησαν
  choice: wakapanga
  rationale: Ingawa kitenzi kinaweza kumaanisha kutafakari, katika muktadha wa upinzani kina maana ya kupanga au kutunga njama.
- source_word: κενά
  choice: mambo ya ubatili
  rationale: Neno linaonyesha mambo matupu, yasiyo na maana au yasiyoweza kufanikiwa; ‘ya ubatili’ hudumisha uzito wa lugha ya Zaburi.
theological_decisions:
- issue: Muundo wa maandishi wa utangulizi wa nukuu
  choice: Maandishi makuu yanaunganisha usemi na Mungu kwa ‘ambaye’ bila kuingiza ‘baba yetu’.
  alternative: 'Baadhi ya hati zinaweza kutafsiriwa: ‘ambaye, kwa njia ya Roho Mtakatifu, alisema kwa kinywa cha baba yetu Daudi, mtumishi wako’.'
  rationale: Kirai τοῦ πατρὸς ἡμῶν kina ushahidi tofauti wa hati na mahali pake katika sentensi ni pagumu. Tanbihi inahifadhi tofauti hiyo bila kuilazimisha katika maandishi makuu.
- issue: Maana ya ἐμελέτησαν katika nukuu ya Zaburi
  choice: wakapanga
  alternative: wakatafakari
  rationale: Kitenzi chenyewe kinaweza kumaanisha kutafakari, lakini muktadha wa mataifa yanayompinga Mungu unapendelea maana ya kupanga. Tanbihi inadumisha uwezekano wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ‘kwa kinywa cha Daudi’ imehifadhiwa kwa sababu ya tabia yake ya kibiblia. Alama zote za tanbihi zimo katika maandishi makuu.
