translation:
  language: sw
  text: Walikerwa sana kwa sababu Petro na Yohana walikuwa wakiwafundisha watu na kutangaza katika Yesu ufufuo kutoka kwa wafu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutangaza, kwa habari ya Yesu, ufufuo kutoka kwa wafu.” Maneno ya Kigiriki “katika Yesu” yanaweza kuelekeza hasa kwenye ufufuo unaodhihirishwa katika kufufuka kwa Yesu mwenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: wakiwa wamekasirika sana
  rationale: Kitenzi hiki kinaonyesha kuudhika au kukasirika kwa nguvu. Kauli hii ni ya kawaida na yenye uzito bila kuzidisha hisia.
- source_word: διὰ τὸ διδάσκειν αὐτοὺς
  choice: kwa sababu walikuwa wakiwafundisha
  rationale: διά pamoja na kitenzi-jina chenye kibainishi huonyesha sababu; kishazi chenye kitenzi kamili ni cha asili katika Kiswahili, na kiwakilishi kinabaki bila kuwataja wahusika kwa majina.
- source_word: τὸν λαὸν
  choice: watu
  rationale: λαός hapa ni jamii ya watu kwa ujumla, si lazima umati wa muda mfupi.
- source_word: καταγγέλλειν
  choice: kutangaza
  rationale: Neno hili lina maana ya kutoa tangazo hadharani; “kutangaza” ni wazi na la kawaida katika muktadha huu.
- source_word: ἐν τῷ Ἰησοῦ
  choice: katika Yesu
  rationale: Tafsiri hii ya moja kwa moja inadumisha uwazi wa ἐν, ambayo inaweza kuelekeza kwenye ufufuo unaodhihirishwa katika Yesu au unaohusishwa naye.
- source_word: ἀνάστασιν τὴν ἐκ νεκρῶν
  choice: ufufuo kutoka kwa wafu
  rationale: Hii ni kauli ya Kiswahili iliyo wazi na yenye uzito unaofaa, huku ikidumisha wazo la kuinuka kutoka miongoni mwa waliokufa.
theological_decisions:
- issue: Maana ya ἐν τῷ Ἰησοῦ kuhusiana na tangazo la ufufuo
  choice: katika Yesu kuna ufufuo
  alternative: kuutangaza ufufuo wa Yesu mwenyewe; au kutangaza ufufuo unaopatikana kupitia Yesu
  rationale: Muundo huu unafanya sentensi ieleweke kwa Kiswahili huku ukihifadhi uwezekano kwamba ufufuo unaonekana katika kufufuka kwa Yesu mwenyewe au unapatikana katika uhusiano naye.
- issue: Upeo wa “ufufuo kutoka kwa wafu”
  choice: Kauli haifungwi kwa ufufuo wa Yesu pekee wala kwa ufufuo wa mwisho pekee.
  alternative: Rejeo kwa ufufuo wa Yesu tu; au fundisho pana la ufufuo wa mwisho
  rationale: Maneno ya Kigiriki yanaweza kurejelea ufufuo wa Yesu kama uthibitisho na pia tumaini pana la ufufuo; tafsiri haipunguzi maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakiwa wamekasirika sana” ni wazi kwa wasomaji wa kawaida; “katika Yesu kuna ufufuo” huhifadhi utata wa kirai cha Kigiriki bila kulazimisha tafsiri moja ya kiteolojia.
