  terminology: “Watu,” “kutangaza,” “ufufuo,” na “wafu” zinafaa kwa λαός, καταγγέλλειν, ἀνάστασις, na ἐκ νεκρῶν. “Katika Yesu” huhifadhi kwa makusudi upeo usioamuliwa wa ἐν τῷ Ἰησοῦ.
