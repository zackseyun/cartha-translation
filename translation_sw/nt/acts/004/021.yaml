base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: sw
  text: Baada ya kuwatisha zaidi[a], wakawaachilia, bila kupata namna ya kuwaadhibu kwa sababu ya watu; maana watu wote walikuwa wakimtukuza Mungu kwa ajili ya jambo lililotokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuwatisha tena,” au “baada ya kuongeza vitisho.” Neno la Kigiriki linaonyesha vitisho vya nyongeza au vilivyozidishwa baada ya vitisho vya awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: baada ya kuwatisha zaidi
  rationale: Kitenzi hiki kinaonyesha vitisho vya nyongeza au vilivyozidishwa baada ya vitisho vya awali; “kuwatisha zaidi” ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: ἀπέλυσαν
  choice: wakawaachilia
  rationale: Katika muktadha wa watu waliokuwa chini ya mamlaka, neno hili linamaanisha kuwaacha waende au kuwaondoa kizuizini.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: kwa kuwa hawakuona jinsi ya kuwaadhibu
  rationale: Muundo wa Kigiriki una maana ya kutopata namna ambayo wangeweza kuwaadhibu; tafsiri hii ni wazi na inahifadhi wazo la “jinsi gani.”
- source_word: διὰ τὸν λαόν
  choice: kwa sababu ya watu
  rationale: διά pamoja na hali ya accusative inaonyesha sababu; λαός hapa ni watu kwa ujumla, si lazima umati uliokusanyika tu.
- source_word: πάντες
  choice: kila mtu
  rationale: Hutoa kwa Kiswahili maana ya jumla ya πάντες katika muktadha huu.
- source_word: ἐδόξαζον τὸν θεόν
  choice: alikuwa akimtukuza Mungu
  rationale: “Kumtukuza Mungu” huhifadhi lugha ya kumpa Mungu utukufu, na muundo endelevu unaakisi hali ya imperfect ya Kigiriki.
- source_word: ἐπὶ τῷ γεγονότι
  choice: kwa ajili ya jambo lililokuwa limetendeka
  rationale: Hueleza msingi wa kumtukuza Mungu na kuhifadhi wazo la tukio lililokamilika ambalo matokeo yake bado yalikuwa dhahiri.
