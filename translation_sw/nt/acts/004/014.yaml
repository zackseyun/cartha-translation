  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: sw
  text: Nao walipomwona yule mtu aliyeponywa amesimama pamoja nao, hawakuwa na lolote la kupinga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawakuwa na neno la kusema kinyume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: Nao
  rationale: Chembe hii inaunganisha sentensi na simulizi lililotangulia; “Nao” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ἄνθρωπον
  choice: yule mtu
  rationale: Neno hili linamtaja mwanamume maalumu aliyeponywa katika muktadha uliotangulia; “yule mtu” humtambulisha wazi.
- source_word: βλέποντες
  choice: walipomwona
  rationale: Kitenzi-shirikishi kinaonyesha tendo linaloandamana na kitenzi kikuu; kishazi cha wakati ni cha asili katika Kiswahili na hudumisha uhusiano huo.
- source_word: σὺν αὐτοῖς
  choice: pamoja nao
  rationale: σύν pamoja na dativu huonyesha kuwa mtu huyo alikuwa katika ushirika au mahali pamoja nao.
- source_word: ἑστῶτα
  choice: amesimama
  rationale: Hali timilifu ya ἵστημι inamwonyesha akiwa katika hali ya kusimama; “amesimama” ni ya asili na inaonyesha hali iliyopo kutokana na tendo lililotangulia.
- source_word: τεθεραπευμένον
  choice: aliyeponywa
  rationale: Kauli tendwa timilifu humtambulisha mtu kwa uponyaji uliokamilika wenye matokeo yanayoendelea; “aliyeponywa” huhifadhi kauli tendwa na muktadha wa muujiza.
- source_word: οὐδὲν
  choice: hawakuwa na la
  rationale: οὐδέν huonyesha ukosefu kamili wa jambo lolote la kusema; muundo “hawakuwa na la...” ni wa kawaida katika Kiswahili.
- source_word: εἶχον ἀντειπεῖν
  choice: hawakuwa na la kujibu
  rationale: Muundo huu unaonyesha kwamba hawakuwa na jambo la kusema kwa kujibu au kupinga. “Hawakuwa na la kujibu” ni fasaha na hudumisha maana pana bila kuifanya iwe lazima ‘kupinga’ tu.
