base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: sw
  text: Walipoachiliwa, walienda kwa wenzao[a], wakawaeleza yote ambayo wakuu wa makuhani na wazee walikuwa wamewaambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa watu wao wenyewe,” yaani washirika wa kundi lao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Walipoachiliwa
  rationale: Kitenzi-shirikishi cha wakati uliopita katika hali ya kutendwa kinaonyesha tendo lililotangulia kwenda kwao; “walipoachiliwa” ni Kiswahili cha kawaida na kinafaa muktadha wa kuzuiliwa kisheria.
- source_word: δὲ
  choice: hakikutafsiriwa kwa kiunganishi tofauti
  rationale: Ni kiunganishi hafifu cha kuendeleza simulizi; katika Kiswahili uhusiano wake unawasilishwa kwa kawaida ndani ya kishazi “Walipoachiliwa,” bila kuongeza neno lisilo la lazima.
- source_word: ἦλθον
  choice: walienda
  rationale: ἔρχομαι inaweza kumaanisha kuja au kwenda kutegemea mtazamo; “walienda” ni ya kawaida kwa msimulizi asiyewekwa katika mahali walikokwenda.
- source_word: πρὸς τοὺς ἰδίους
  choice: kwa wenzao
  rationale: Usemi huu humaanisha watu wa kundi au ushirika wao wenyewe. “Kwa wenzao” ni wa kawaida na haubainishi zaidi ya Kigiriki; tanbihi huhifadhi tafsiri ya karibu zaidi na umbo la asili.
- source_word: ἀπήγγειλαν
  choice: kuwaeleza
  rationale: Kitenzi hiki humaanisha kutoa taarifa au kusimulia jambo. “Kuwaeleza” kinaonyesha kwamba waliwapa wenzao taarifa kamili kwa Kiswahili cha kawaida.
- source_word: ὅσα
  choice: yote ambayo
  rationale: Huhifadhi maana pana ya mambo yote yaliyosemwa.
- source_word: πρὸς αὐτοὺς
  choice: wamewaambia
  rationale: Pamoja na λέγω, πρός humtaja anayeelekezewa maneno; kiambishi “-wa-” kinaonyesha kwamba maneno yaliwaelekea wao, si kwamba yalikuwa lazima dhidi yao.
- source_word: οἱ ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unawahusu wakuu wa mamlaka ya kikuhani, si watu wengi wenye cheo kimoja cha kuhani mkuu. “Viongozi wa makuhani” ni wazi kwa msomaji wa sasa.
- source_word: οἱ πρεσβύτεροι
  choice: wazee
  rationale: Katika muktadha huu ni wazee wenye mamlaka katika jamii na baraza, si wanaume wenye umri mkubwa tu; “wazee” ndiyo istilahi ya kawaida ya kibiblia na ya kijamii.
- source_word: εἶπαν
  choice: walikuwa wamewaambia
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba kusema kwa viongozi kulitokea kabla ya Petro na Yohana kutoa taarifa.
