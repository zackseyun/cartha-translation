  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: sw
  text: Walipoona ujasiri wa Petro na Yohana, na kutambua kwamba walikuwa watu wasio na mafunzo rasmi na wa kawaida[a], walishangaa, na wakawatambua kuwa walikuwa pamoja na Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wasio na mafunzo ya kielimu na wasio wataalamu.” Maneno ya Kigiriki yanaeleza watu ambao hawakuwa na mafunzo rasmi ya kielimu, hasa ya kitaalamu au kidini, wala hawakuwa wataalamu au maofisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: Walipoona
  rationale: Kitenzi hiki kinaonyesha viongozi wakitazama na kutathmini ujasiri wao; “walipoona” ni ya asili katika Kiswahili na inaunganisha uchunguzi huo na mwitikio uliofuata.
- source_word: παρρησίαν
  choice: ujasiri
  rationale: Katika Matendo neno hili humaanisha kusema kwa uwazi na bila woga; “ujasiri” linaeleweka kwa urahisi na linafaa katika muktadha.
- source_word: καταλαβόμενοι
  choice: kutambua
  rationale: Huonyesha kufikia ufahamu kuhusu hali ya Petro na Yohana, si kuona kwa macho tu.
- source_word: ἀγράμματοι
  choice: wasio na elimu rasmi
  rationale: Hapa neno halimaanishi lazima kwamba hawakujua kusoma na kuandika, bali kwamba hawakuwa na mafunzo rasmi ya kitaalamu ya Maandiko.
- source_word: ἰδιῶται
  choice: watu wa kawaida
  rationale: Huonyesha kwamba hawakuwa wataalamu au wenye cheo rasmi, bila kuwadhalilisha kuwa wajinga.
- source_word: ἐθαύμαζον
  choice: walishangaa
  rationale: Huwasilisha mwitikio wao wa mshangao kwa lugha ya kawaida na yenye heshima.
- source_word: ἐπεγίνωσκόν
  choice: wakawatambua
  rationale: Neno linaweza kueleza kuwatambua au kufahamu utambulisho na uhusiano wao; tafsiri hii inadumisha uwezekano huo.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: walikuwa wamekuwa pamoja na Yesu
  rationale: Muundo huu unaonyesha ushirika wao wa awali na Yesu ambao viongozi waliutambua wakati huo.
theological_decisions:
- issue: Maelezo ya hali ya kijamii na kielimu ya Petro na Yohana
  choice: wasio na elimu rasmi na watu wa kawaida
  alternative: wasiojua kusoma na kuandika na wajinga; wasio na elimu na walei
  rationale: Maneno ya Kigiriki yanatofautisha Petro na Yohana na wasomi au maofisa wa kidini; hayathibitishi kwamba hawakujua kusoma wala kwamba hawakuwa na akili.
- issue: Maana ya ἐπεγίνωσκόν kuhusu uhusiano wao na Yesu
  choice: wakawatambua kuwa walikuwa wamekuwa pamoja na Yesu
  alternative: wakagundua kwamba walikuwa pamoja na Yesu
  rationale: “Kuwatambua” huhifadhi uwezekano wa viongozi kuwatambua kama washirika wa Yesu, huku kishazi kinachofuata kikieleza walichotambua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtiririko wa matendo ya viongozi bila kuongeza kiunganishi cha wakati kisichopo wazi katika chanzo. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
