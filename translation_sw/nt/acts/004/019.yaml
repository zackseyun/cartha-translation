  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: sw
  text: Lakini Petro na Yohana wakawajibu, “Kama ni sawa mbele za Mungu kuwasikiliza ninyi[a] badala ya kumsikiliza Mungu, amueni wenyewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza maana ya muktadha zaidi, “kuwatii ninyi badala ya kumtii Mungu.” Kitenzi cha Kigiriki kwa maana halisi ni “kusikia” au “kusikiliza,” lakini hapa kinadokeza kuitii mamlaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Lakini Petro na Yohana
  rationale: δέ inaonyesha ugeuko wenye hali ya kupingana na amri ya viongozi iliyotangulia; “Lakini” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἀποκριθέντες ... εἶπον πρὸς αὐτούς
  choice: wakawajibu
  rationale: Muundo huu wa Kigiriki una kitenzi kishirikishi pamoja na kitenzi kikuu, lakini katika Kiswahili “wakawajibu” huwasilisha kwa kawaida na kwa ukamilifu tendo la kujibu na kusema kwao bila urudiaji usio wa lazima.
- source_word: δίκαιόν
  choice: ni sawa
  rationale: Katika swali hili, neno hilo linahusu jambo linalofaa na kukubalika kwa hukumu ya Mungu. “Ni sawa” ni la asili katika Kiswahili cha sasa na linahifadhi uzito wa kimaadili.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Usemi huu wa kawaida wa Kiswahili unahifadhi wazo la jambo kutathminiwa katika uwepo na hukumu ya Mungu.
- source_word: ὑμῶν ἀκούειν
  choice: kuwasikiliza ninyi
  rationale: “Kusikiliza” linahifadhi maana ya msingi ya ἀκούω, huku “ninyi” likiweka mkazo wa tofauti kati ya viongozi hao na Mungu. Katika muktadha, kusikiliza kunadokeza kufuata amri.
- source_word: μᾶλλον ἢ
  choice: badala ya
  rationale: Huu ni usemi wa asili wa Kiswahili unaowasilisha uchaguzi unaotofautisha kuwasikiliza viongozi na kumsikiliza Mungu.
- source_word: τοῦ θεοῦ
  choice: kumsikiliza Mungu
  rationale: Kitenzi kimerudiwa kwa Kiswahili ili tofauti iwe wazi na sentensi isikike kwa kawaida, bila kubadili maana ya Kigiriki.
- source_word: κρίνατε
  choice: amueni wenyewe
  rationale: Amri hii inawataka wasikilizaji wafanye tathmini wao wenyewe. “Amueni” huepuka maana finyu ya kuhukumu au kuadhibu ambayo “hukumuni” ingeweza kutoa.
theological_decisions:
- issue: Iwapo ἀκούειν itafsiriwe moja kwa moja kuwa “kutii” kwa sababu muktadha unahusu mamlaka na utii
  choice: Kudumisha “kuwasikiliza ninyi ... kumsikiliza Mungu” katika matini kuu
  alternative: “kuwatii ninyi badala ya kumtii Mungu”
  rationale: Ingawa muktadha unadokeza wazi utii, Kigiriki kimetumia ἀκούω, “kusikia/kusikiliza,” wala si kitenzi kilicho wazi zaidi cha kutii. Tafsiri kuu inahifadhi lugha ya chanzo na dokezo lake, huku tanbihi ikieleza maana ya kimuktadha.
- issue: Nguvu ya κρίνατε kama changamoto kwa viongozi kufanya tathmini
  choice: “amueni wenyewe”
  alternative: “hukumuni wenyewe”
  rationale: “Amueni wenyewe” huhifadhi mwito wa kutathmini hoja bila kudokeza kwamba Petro na Yohana wanawaagiza viongozi watoe hukumu ya adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo unaepuka urudiaji wa kigeni katika “akajibu na kusema,” lakini unadumisha tofauti yenye mkazo kati ya “ninyi” na “Mungu.”
