id: ACT.4.11
reference: Acts 4:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: sw
  text: Huyu ndiye jiwe ambalo ninyi wajenzi mlilikataa, nalo limekuwa jiwe kuu la pembeni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jiwe la juu”; kihalisi, “kichwa cha pembe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Huyu ndiye
  rationale: Kiwakilishi hiki kinamrejelea Yesu kwa mkazo katika muktadha; “Huyu ndiye” ni Kiswahili cha asili kinachohifadhi utambulisho huo wa moja kwa moja.
- source_word: λίθος
  choice: jiwe
  rationale: “Jiwe” ndiyo maana ya kawaida na inadumisha picha ya ujenzi pamoja na rejeo la Zaburi 118:22.
- source_word: ἐξουθενηθεὶς
  choice: mlilikataa
  rationale: Kitenzi kinaweza kumaanisha kudharau au kuona kuwa kitu hakina thamani; katika picha ya wajenzi, “kukataa” linaonyesha kwa uwazi hatua waliyochukua dhidi ya jiwe.
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: ninyi wajenzi mlilikataa
  rationale: Mpangilio huu unahifadhi shtaka la moja kwa moja kwa wingi na unawaunganisha wanaoambiwa na sitiari ya “wajenzi.”
- source_word: γενόμενος
  choice: limekuwa
  rationale: “Limekuwa” linaonyesha badiliko lililotimia lenye matokeo yanayoendelea katika wakati wa usemi.
- source_word: κεφαλὴν γωνίας
  choice: jiwe kuu la pembeni
  rationale: Hii ni tafsiri ya Kiswahili inayoeleweka ya nahau ya “kichwa cha pembe,” huku ikihifadhi picha ya jiwe lenye nafasi kuu katika jengo.
theological_decisions:
- issue: Picha ya nukuu ya Zaburi 118:22
  choice: jiwe kuu la pembeni
  alternative: jiwe la juu; kihalisi, kichwa cha pembe
  rationale: Tafsiri hii inamtambulisha Yesu kama jiwe lililokataliwa kisha likapewa nafasi ya heshima bila kuamua kwa lazima jiwe hilo lilikuwa sehemu gani hasa ya jengo. Uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ninyi wajenzi” unadumisha mkazo na shtaka la moja kwa moja la maandishi ya Kigiriki; tanbihi inalinda utata wa rejeo halisi la usanifu.
