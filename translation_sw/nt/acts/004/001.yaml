  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: sw
  text: Walipokuwa wakizungumza na watu, makuhani, mkuu wa walinzi wa Hekalu[a], na Masadukayo wakawajia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mkuu wa walinzi wa Hekalu” alikuwa ofisa aliyesimamia utaratibu na usalama katika maeneo ya Hekalu.
    reason: cultural_note
  - marker: b
    text: Au “wakawasogelea.” Kitenzi cha Kigiriki kinaweza kumaanisha kufika kwa ghafula au kumkaribia mtu; hapa muktadha unaonyesha kuingilia kati kwa maofisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Walipokuwa wakizungumza
  rationale: Muundo huu wa genitivi huru unaonyesha tendo lililokuwa likiendelea wakati tukio kuu lilipotokea. Kiswahili cha wakati kwa kutumia “walipokuwa” ni cha kawaida na hubeba uhusiano huo bila kuongeza neno lisilokuwapo kama “sasa.”
- source_word: πρὸς τὸν λαὸν
  choice: na watu
  rationale: Katika Kiswahili, “kuzungumza na watu” ni usemi wa asili kwa kusema kwa hadhira. “Watu” hudumisha maana pana ya λαός bila kuifasiri mahsusi kuwa umati.
- source_word: ἐπέστησαν αὐτοῖς
  choice: wakawajia
  rationale: “Wakawajia” huonyesha kwamba maofisa waliwasogelea na kufika walipokuwa, huku ikiwezekana kuwa kuwasili huko kulikuwa kwa ghafula. Haiongezi waziwazi maana kali ya kuwakabili kwa uhasama.
- source_word: οἱ ἱερεῖς
  choice: makuhani
  rationale: Chanzo kinasema makuhani, si wakuu wa makuhani; kwa hiyo cheo cha juu hakiongezwi.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: mkuu wa walinzi wa Hekalu
  rationale: στρατηγός ni ofisa mwenye mamlaka ya uongozi. Katika muktadha wa Hekalu, usemi huu wa Kiswahili unaeleza kwa uwazi jukumu lake la kusimamia ulinzi na utaratibu, bila kumchanganya na kuhani.
- source_word: οἱ Σαδδουκαῖοι
  choice: Masadukayo
  rationale: Hili ndilo jina la kawaida la Kiswahili la kundi hili la Kiyahudi.
theological_decisions:
- issue: Ikiwa kuwasili kwa maofisa kuelezwe moja kwa moja kuwa tendo la uhasama
  choice: wakawajia
  alternative: wakawakabili
  rationale: Muktadha unaonyesha upinzani, lakini kitenzi chenyewe kinaweza kumaanisha kuwajia au kuwasogelea, hata kwa ghafula. Tafsiri ya kiasi hudumisha mvutano wa simulizi bila kuingiza uhasama mkali ndani ya neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mwendo wa simulizi kwa “wakawajia.” Herufi kubwa katika “Hekalu” inaashiria Hekalu la Yerusalemu. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
