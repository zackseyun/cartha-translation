  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: sw
  text: Kisha wakawaita, wakawaamuru wasiseme kabisa[a] wala wasifundishe kwa jina la Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasiseme jambo lolote hata kidogo.”
    reason: Tofauti halali ya kileksia inayowasilisha mkazo wa τὸ καθόλου pamoja na μὴ φθέγγεσθαι.
lexical_decisions:
- source_word: καλέσαντες
  choice: Kisha wakawaita
  rationale: Kirai cha wakati chenye kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia amri; “kisha wakawaita” ni cha kawaida na kinafaa muktadha wa baraza kuwaita tena.
- source_word: παρήγγειλαν
  choice: wakawaamuru
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka; “wakawaamuru” kinawasilisha uzito huo kwa Kiswahili cha sasa.
- source_word: τὸ καθόλου
  choice: kabisa
  rationale: Neno hili linatilia mkazo ukamilifu wa katazo. “Kabisa” ni la asili katika Kiswahili na linaonyesha kwamba hawakuruhusiwa kusema hata kidogo.
- source_word: μὴ φθέγγεσθαι
  choice: wasiseme
  rationale: φθέγγομαι humaanisha kusema au kutamka. “Wasiseme” ni wazi, ya kawaida, na haibani maana kuwa mahubiri ya hadharani pekee.
- source_word: μηδὲ διδάσκειν
  choice: wala wasifundishe
  rationale: μηδέ huunganisha tendo la pili lililokatazwa na la kwanza. Kurudia umbo la kukanusha, “wala wasifundishe,” kunatoa urari na uwazi wa kisarufi.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: kwa jina la Yesu
  rationale: Katika muktadha huu kirai kinaweza kuonyesha uhusiano na jina la Yesu au msingi/mamlaka yake. “Kwa jina la Yesu” ni usemi wa kawaida unaohifadhi upana huo bila kuufafanua kupita kiasi.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Upeo wa katazo kuhusu ushuhuda unaomhusu Yesu
  choice: Katazo lenye mkazo dhidi ya kusema na kufundisha kwa jina la Yesu
  alternative: Katazo la mahubiri ya hadharani pekee
  rationale: Mchanganyiko wa τὸ καθόλου, μὴ φθέγγεσθαι, na μηδὲ διδάσκειν unaonyesha katazo pana na lenye mkazo kwa kusema na kufundisha. Tafsiri hailibani kwa mahubiri ya hadharani tu.
- issue: Maana ya ἐπὶ τῷ ὀνόματι
  choice: kwa jina la Yesu
  alternative: juu ya msingi wa jina la Yesu
  rationale: Kirai kinaweza kuhusisha rejeleo kwa Yesu na mamlaka au msingi unaopatikana katika jina lake. Usemi “kwa jina la Yesu” unaacha mvutano huo wa kimaana bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kueleweka kwa msomaji wa kawaida, huku mkazo wa katazo na urari wa “wasiseme ... wala wasifundishe” vikihifadhiwa.
