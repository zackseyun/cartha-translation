  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: sw
  text: Kuhusu mtu huyo, nilipofika Yerusalemu, wakuu wa makuhani na wazee wa Wayahudi walinijulisha habari zake, wakiomba hukumu ya kumtia hatiani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiomba ahukumiwe” au “wakiomba ahukumiwe kuwa na hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: Kumhusu mtu huyo
  rationale: Kirai hiki kinamrejelea Paulo na kutambulisha habari inayozungumziwa; ‘mtu huyo’ huweka rejeo wazi katika Kiswahili bila kuongeza utambulisho mpya.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: nilipofika Yerusalemu
  rationale: Muundo huu unaonyesha wakati wa kufika mahali; tafsiri hii ni ya kawaida na sahihi katika Kiswahili.
- source_word: ἐνεφάνισαν
  choice: waliwasilisha mashitaka yao kwangu
  rationale: Katika muktadha wa kisheria, kitenzi kina maana ya kutoa taarifa au kuleta jambo mbele ya mwenye mamlaka. ‘Waliwasilisha mashitaka yao’ hutoa maana hiyo kwa Kiswahili cha kawaida, ingawa neno ‘mashitaka’ linaelezwa kutokana na muktadha.
- source_word: οἱ ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unawahusu wakuu wa mamlaka ya kikuhani, si kuhani mkuu mmoja.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: wazee wa Wayahudi
  rationale: Huhifadhi uhusiano wa moja kwa moja wa kirai cha Kigiriki bila kubana zaidi maana ya ‘Wayahudi’.
- source_word: αἰτούμενοι
  choice: wakitaka
  rationale: Hueleza ombi walilotoa sambamba na kuwasilisha jambo lao.
- source_word: κατ’ αὐτοῦ
  choice: dhidi yake
  rationale: Katika muktadha huu wa kisheria, κατά inaonyesha hatua ya uadui iliyolenga Paulo; maana hiyo imo ndani ya ‘mashitaka yao’ na matokeo yaliyotakiwa.
- source_word: καταδίκην
  choice: ahukumiwe kuwa na hatia
  rationale: Neno hili linamaanisha hukumu ya kisheria ya kumtia mtu hatiani. Muundo huu ni wazi na wa kawaida kuliko nomino nzito ‘hukumu ya hatia’.
