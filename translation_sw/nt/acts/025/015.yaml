revisions:
- from: Kumhusu mtu huyo, nilipofika Yerusalemu, viongozi wa makuhani na wazee wa Wayahudi waliwasilisha mashitaka yao kwangu, wakitaka ahukumiwe kuwa na hatia.[a]
  to: Kuhusu mtu huyo, nilipofika Yerusalemu, wakuu wa makuhani na wazee wa Wayahudi walinijulisha habari zake, wakiomba hukumu ya kumtia hatiani.[a]
  rationale: The revision renders ἐνεφάνισαν with “walinijulisha habari zake,” which faithfully expresses informing an authority about Paul without adding an explicit allegation or formal filing. It replaces the broad phrase “viongozi wa makuhani” with the standard title “wakuu wa makuhani,” and renders αἰτούμενοι κατ’ αὐτοῦ καταδίκην as a request for a judicial condemnation directed at him. The footnote preserves natural alternative ways of expressing the requested condemnation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the arrival in Jerusalem, the chief-priestly and elder groups, and their request for Paul’s condemnation. However, “waliwasilisha mashitaka yao” makes the content of ἐνεφάνισαν more specifically a presentation of formal charges than the Greek states; it more broadly says that they informed Festus concerning Paul. The revised wording retains the legal setting while avoiding that added specificity.
  naturalness: The revised sentence is idiomatic Standard East African Swahili, maintains a formal but accessible biblical register, and avoids the somewhat indirect construction “ahukumiwe kuwa na hatia” as the primary rendering.
  terminology: “Wakuu wa makuhani” is the established and more precise rendering of οἱ ἀρχιερεῖς. “Wazee wa Wayahudi” appropriately preserves the Greek designation. “Hukumu ya kumtia hatiani” conveys καταδίκη as a judicial condemnation without imposing a particular procedural distinction.
  issues:
  - severity: medium
    issue: “waliwasilisha mashitaka yao kwangu” is overly specific for ἐνεφάνισαν.
    rationale: The Greek says that the chief priests and elders made information known to Festus concerning Paul. Although the context is legal and hostile, the verse itself does not explicitly say that they formally submitted ‘their charges.’
  - severity: low
    issue: “viongozi wa makuhani” is less precise than the conventional title “wakuu wa makuhani.”
    rationale: οἱ ἀρχιερεῖς refers to the recognized leading priestly authorities; “wakuu wa makuhani” communicates this title and its institutional sense more naturally.
  revised_text: Kuhusu mtu huyo, nilipofika Yerusalemu, wakuu wa makuhani na wazee wa Wayahudi walinijulisha habari zake, wakiomba hukumu ya kumtia hatiani.[a]
  revised_footnotes:
  - marker: a
    text: Au, “wakiomba ahukumiwe” au “wakiomba ahukumiwe kuwa na hatia.”
    reason: lexical_alternative
  revision_rationale: The revision renders ἐνεφάνισαν with “walinijulisha habari zake,” which faithfully expresses informing an authority about Paul without adding an explicit allegation or formal filing. It replaces the broad phrase “viongozi wa makuhani” with the standard title “wakuu wa makuhani,” and renders αἰτούμενοι κατ’ αὐτοῦ καταδίκην as a request for a judicial condemnation directed at him. The footnote preserves natural alternative ways of expressing the requested condemnation.
