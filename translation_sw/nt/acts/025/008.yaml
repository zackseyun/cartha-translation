base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: sw
  text: Paulo alijitetea kwa kusema, “Sijafanya kosa lolote dhidi ya sheria ya Wayahudi[a], wala dhidi ya Hekalu, wala dhidi ya Kaisari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sijatenda dhambi yoyote dhidi ya sheria ya Wayahudi, wala dhidi ya Hekalu, wala dhidi ya Kaisari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: akajitetea akisema
  rationale: Huwasilisha tendo la Paulo la kujitetea katika mazingira ya mahakama kwa Kiswahili cha kawaida, huku ‘akisema’ ikiingiza maudhui ya utetezi wake.
- source_word: ὅτι
  choice: akisema pamoja na nukuu ya moja kwa moja
  rationale: ὅτι huingiza maudhui ya utetezi; Kiswahili cha sasa huwasilisha jambo hili kwa njia ya asili kwa ‘akisema’ na nukuu ya moja kwa moja.
- source_word: νόμον τῶν Ἰουδαίων
  choice: sheria ya Wayahudi
  rationale: Huhifadhi muundo na upeo wa kirai cha Kigiriki bila kuamua zaidi ikiwa mkazo wake ni wa kikabila, kidini, au kieneo.
- source_word: ἱερὸν
  choice: Hekalu
  rationale: Katika muktadha huu neno hilo hurejelea Hekalu, kwa upana likiwa pamoja na eneo lake, si patakatifu pa ndani pekee.
- source_word: Καίσαρά
  choice: Kaisari
  rationale: Huhifadhi jina au cheo cha mtawala wa Roma na mazingira ya kisheria na kisiasa.
- source_word: τι
  choice: lolote
  rationale: Pamoja na ukanushaji, huonyesha kwamba Paulo anakataa kuwa alifanya kosa la aina yoyote.
- source_word: ἥμαρτον
  choice: Sijafanya kosa
  rationale: Katika muktadha wa mahakama, ἁμαρτάνω ina maana ya kufanya kosa au kukosea dhidi ya mtu au taasisi. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi uwezekano wa neno ‘dhambi’.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: wala ... wala ... wala
  rationale: Huhifadhi kwa ufasaha ukanushaji wa sehemu tatu katika Kiswahili.
theological_decisions:
- issue: Maana ya kisheria dhidi ya maana ya kimaadili ya ἥμαρτον
  choice: Sijafanya kosa lolote
  alternative: Sijatenda dhambi yoyote
  rationale: Muktadha ni utetezi wa mahakamani, na muundo ‘ἁμαρτάνω εἰς’ unaeleza kukosea dhidi ya sheria, Hekalu, au Kaisari. ‘Kosa’ huwasilisha maana hiyo kwa Kiswahili cha asili, huku tanbihi ikihifadhi maana ya kawaida ya kimaadili ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ina sauti ya utetezi wa mahakamani; ‘Hekalu’ na ‘Kaisari’ zimeandikwa kwa herufi kubwa kama majina au vyeo maalumu katika muktadha huu.
