translation:
  language: sw
  text: Walipokuwa wamekaa huko kwa siku nyingi, Festo aliwasilisha kwa mfalme mambo yaliyomhusu Paulo, akisema, “Kuna mtu fulani aliyeachwa na Feliksi akiwa mfungwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: kwa siku nyingi
  rationale: Katika muktadha huu usemi huu wa wakati humaanisha siku nyingi au kadhaa; “kwa siku nyingi” unaonyesha kukaa kwa muda ulioongezeka bila kulazimisha ulinganisho wa moja kwa moja.
- source_word: διέτριβον
  choice: walipokuwa wamekaa
  rationale: Kitenzi hiki humaanisha kutumia muda au kukaa mahali; tafsiri hii ni ya kawaida na inaonyesha tendo lililokuwa likiendelea.
- source_word: ἀνέθετο
  choice: alimweleza
  rationale: Kitenzi cha kati hapa kinahusu kuweka jambo mbele ya mwingine ili alifikirie. “Alimweleza” ni Kiswahili cha kawaida; muktadha unaonyesha kuwa Festo alikuwa akiwasilisha jambo hilo kwa mfalme.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: mambo yaliyomhusu Paulo
  rationale: Usemi huu unaweza kutaja mambo yote yanayomhusu Paulo, hasa shauri lake la kisheria, bila kulibainisha kupita kiwango cha Kigiriki.
- source_word: Ἀνήρ τίς
  choice: Kuna mtu fulani
  rationale: Huhifadhi maana ya mtu mahususi ambaye bado hajatambulishwa katika kauli hii.
- source_word: καταλελειμμένος
  choice: alimwacha
  rationale: Kauli timilifu ya kutendwa inaonyesha kuwa Feliksi alimwacha Paulo nyuma na hali hiyo iliendelea; muundo wa Kiswahili pamoja na “akiwa mfungwa” unaifikisha maana hiyo kwa kawaida.
- source_word: δέσμιος
  choice: akiwa mfungwa
  rationale: Huonyesha hadhi ambayo Paulo alikuwa nayo alipoachwa na Feliksi.
- source_word: βασιλεῖ
  choice: mfalme
  rationale: Kigiriki kinatumia cheo tu; utambulisho wa mfalme unaeleweka kutokana na muktadha.
