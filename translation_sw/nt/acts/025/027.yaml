  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: sw
  text: Kwa maana inaonekana kwangu kuwa si jambo la busara kumpeleka mfungwa bila pia kueleza[a] mashtaka yanayomkabili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuyabainisha mashtaka yanayomkabili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: si jambo la busara
  rationale: Katika muktadha huu wa kisheria na kiutawala, usemi huu unaonyesha kwamba hatua hiyo haingekuwa na mantiki au kufaa. ‘Si jambo la busara’ ni Kiswahili cha kawaida na chenye heshima, bila ukali wa ‘ni upuuzi.’
- source_word: δοκεῖ μοι
  choice: inaonekana kwangu
  rationale: Huhifadhi namna ya tathmini ya kibinafsi na yenye tahadhari katika Kigiriki, badala ya kuifanya kuwa kauli thabiti zaidi kama ‘nina hakika.’
- source_word: πέμποντα
  choice: kumpeleka
  rationale: Kitenzi-jina katika Kiswahili kinaunganisha kwa kawaida kitendo cha kumpeleka mfungwa na tathmini ya kwamba si jambo la busara kufanya hivyo bila taarifa za mashtaka.
- source_word: δέσμιον
  choice: mfungwa
  rationale: Ni neno la kawaida na linaloeleweka kwa mtu aliye chini ya ulinzi katika muktadha wa kisheria.
- source_word: μὴ καὶ
  choice: bila pia
  rationale: ‘Bila’ huonyesha kwamba jambo la pili limeachwa, huku ‘pia’ ikihifadhi nguvu ya nyongeza ya καί.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: mashtaka yanayomkabili
  rationale: ‘Mashtaka’ linafaa katika mazingira ya mahakama, na ‘yanayomkabili’ huwasilisha maana ya mashtaka yaliyo dhidi yake kwa Kiswahili cha asili.
- source_word: σημᾶναι
  choice: kuonyesha
  rationale: Neno hili linabeba maana ya kutoa taarifa au kufanya jambo lijulikane. ‘Kuonyesha’ linafaa katika mazingira rasmi, huku uwezekano wa ‘kuyataja wazi’ ukihifadhiwa katika tanbihi.
