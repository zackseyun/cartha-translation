  text: ἐνεφάνισάν ⸀τε αὐτῷ ⸂οἱ ἀρχιερεῖς⸃ καὶ οἱ πρῶτοι τῶν Ἰουδαίων κατὰ τοῦ Παύλου, καὶ παρεκάλουν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: sw
  text: Basi makuhani wakuu na watu mashuhuri miongoni mwa Wayahudi wakawasilisha mbele yake mashtaka yao dhidi ya Paulo[a], nao wakamsihi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamjulisha habari za Paulo” au “wakatoa mashtaka dhidi ya Paulo mbele yake.” Kitenzi cha Kigiriki kinaweza kumaanisha kufanya jambo lijulikane, na katika muktadha huu huenda kina maana ya kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: wakawasilisha mbele yake mashtaka yao dhidi ya
  rationale: Katika muktadha wa kisheria mbele ya gavana, kitenzi hiki kina maana ya kuweka jambo mbele ya mwenye mamlaka. Kauli hii inaonyesha uzito wa kisheria bila kudai kwamba lilikuwa shtaka rasmi kwa maana finyu.
- source_word: τέ
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kutoka mstari uliotangulia; “Basi” ni muunganisho wa kawaida na wa asili katika Kiswahili cha simulizi.
- source_word: αὐτῷ
  choice: mbele yake
  rationale: Kiwakilishi kinamrejelea Festo; pamoja na kitenzi, “mbele yake” huonyesha kwamba jambo liliwasilishwa kwake akiwa mwenye mamlaka.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ni jina la kawaida la kundi la viongozi wa ukuhani wa Yerusalemu.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: watu mashuhuri miongoni mwa Wayahudi
  rationale: πρῶτοι hapa humaanisha watu wenye cheo, ushawishi, au umaarufu katika jamii. Tafsiri hii inadumisha wazo la hadhi yao bila kuwafanya wote kuwa viongozi rasmi.
- source_word: κατὰ τοῦ Παύλου
  choice: dhidi ya Paulo
  rationale: κατά pamoja na hali ya umilikishi hapa huonyesha upinzani au mashtaka dhidi ya Paulo.
- source_word: παρεκάλουν
  choice: wakamsihi
  rationale: Kitenzi cha wakati usiotimilika huonyesha ombi la kusisitiza au lililoendelea. “Wakamsihi” lina nguvu kuliko “wakamwomba” lakini si lazima limaanishe kuomba kwa hisia kali sana.
- source_word: αὐτόν
  choice: -m- katika “wakamsihi”
  rationale: Kiwakilishi kinamrejelea tena Festo kama yule waliyekuwa wakimsihi.
