  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: sw
  text: Ndipo Festo, baada ya kushauriana na baraza, akajibu, “Umekata rufaa kwa Kaisari; kwa Kaisari utaenda[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele ya Kaisari utaenda.” Kirai hiki kina maana ya kisheria ya kwenda mbele ya mahakama ya mtawala baada ya kukata rufaa.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Kiunganishi hiki kinaonyesha mfuatano wa matukio katika simulizi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: συλλαλήσας
  choice: baada ya kushauriana
  rationale: Kauli ya wakati uliopita inaonyesha tendo lililotangulia jibu la Festo; katika mazingira haya, kitenzi kinaashiria majadiliano ya kupata shauri.
- source_word: μετὰ τοῦ συμβουλίου
  choice: na baraza
  rationale: συμβούλιον hapa ni kundi la washauri au baraza la mashauriano. Neno “baraza” ni fupi na la kawaida, bila kuongeza kimilikishi kisichotajwa wazi katika Kigiriki.
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Huhifadhi mtiririko wa simulizi na uzito wa jibu rasmi katika mazingira ya kisheria.
- source_word: Καίσαρα
  choice: Kaisari
  rationale: Jina la cheo cha mtawala wa Roma linahifadhiwa kwa umbo lililozoeleka katika Kiswahili, badala ya kulibadili kuwa “mfalme mkuu” au “maliki.”
- source_word: ἐπικέκλησαι
  choice: umekata rufaa kwa
  rationale: Kitenzi hiki katika muktadha wa kisheria humaanisha kuomba mamlaka ya Kaisari isikilize kesi. “Kukata rufaa” ndiyo istilahi ya kawaida na sahihi ya Kiswahili.
- source_word: ἐπὶ Καίσαρα
  choice: kwa Kaisari
  rationale: Kirai kinaweza kuonyesha kwenda kwa mamlaka ambayo mlalamikaji ameiomba; tafsiri hii ni ya kawaida huku uwezekano wa maana “mbele ya Kaisari” ukihifadhiwa katika tanbihi.
- source_word: πορεύσῃ
  choice: utaenda
  rationale: Hutafsiri moja kwa moja kitenzi cha mwendo katika wakati ujao bila kuongeza wazo la kutumwa, ambalo halijaelezwa wazi katika Kigiriki.
theological_decisions: []
