source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: sw
  text: Kisha Festo akasema, “Mfalme Agripa, na ninyi wanaume wote mlio hapa pamoja nasi, mnamwona mtu huyu, ambaye umati wote wa Wayahudi[a] uliniomba kuhusu yeye, huko Yerusalemu na hapa pia, wakipaza sauti kwamba hapaswi kuendelea kuishi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu, “umati wote wa Wayahudi.” Huu ni muhtasari wa Festo kuhusu kundi lililompinga; si lazima ummaanishe kila Myahudi mmoja mmoja.
    reason: Hufafanua usemi wa kijumla ἅπαν τὸ πλῆθος τῶν Ἰουδαίων bila kuongeza utambulisho au dai lisilosemwa na matini.
lexical_decisions:
- source_word: φησιν
  choice: akasema
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida ‘akasema’ ili kuendeleza tukio kwa ufasaha bila kupoteza vividness ya simulizi.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: wanaume wote mlio hapa pamoja nasi
  rationale: Huhifadhi rejeo la wazi kwa wanaume waliokuwapo pamoja na Festo katika mkutano rasmi.
- source_word: θεωρεῖτε τοῦτον
  choice: mnamwona mtu huyu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoelekeza macho ya hadhira kwa Paulo bila kutumia amri ya kizamani kama ‘tazameni.’
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: umati mzima wa Wayahudi
  rationale: ‘Umati mzima’ huhifadhi usemi wa kijumla na msisitizo wa Festo bila kugeuza πλῆθος kuwa viongozi pekee.
- source_word: ἐνέτυχόν μοι
  choice: uliniwasilisha ombi
  rationale: Huwasilisha tendo la kumfikia mtawala kwa ombi katika mazingira rasmi ya kisheria, badala ya kulifanya kuwa mazungumzo ya kawaida.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: huko Yerusalemu na hapa pia
  rationale: Hutofautisha kwa asili mahali pa mbali, Yerusalemu, na eneo la sasa la Festo, Kaisaria.
- source_word: βοῶντες
  choice: wakipaza sauti
  rationale: Huhifadhi wazo la kusema kwa sauti kubwa na kwa msisitizo.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: kwamba hapaswi kuendelea kuishi
  rationale: Huhifadhi dai la ulazima au ustahili katika δεῖ bila kulitafsiri moja kwa moja kuwa tamko rasmi la hukumu ya kifo.
theological_decisions:
- issue: Rejeo kwa Wayahudi katika muktadha wa mashtaka ya uhasama
  choice: umati mzima wa Wayahudi
  alternative: viongozi wa Wayahudi; Wayahudi wote bila ubaguzi
  rationale: Kigiriki kinawataja Wayahudi moja kwa moja na hakisemi viongozi pekee. Hata hivyo, πλῆθος ni usemi wa kijumla katika muhtasari wa Festo; tanbihi inaonya kwamba si lazima umaanishe kila Myahudi mmoja mmoja.
- issue: Nguvu ya δεῖ katika dai la wapinzani
  choice: hapaswi kuendelea kuishi
  alternative: lazima auawe
  rationale: Tafsiri iliyochaguliwa huhifadhi maana ya kutostahili au kutopaswa kuishi zaidi bila kuongeza wazi namna ya kifo au kauli ya hukumu ambayo haipo katika sentensi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya hotuba rasmi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mlio hapa pamoja nasi’ na ‘uliniwasilisha ombi’ vinaakisi mazingira ya hadhara na ya kisheria; ‘wakipaza sauti’ hudumisha nguvu ya masimulizi.
