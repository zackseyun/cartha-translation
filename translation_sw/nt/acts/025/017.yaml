base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: sw
  text: Basi, walipokusanyika hapa, sikukawia hata kidogo; siku iliyofuata niliketi kwenye kiti cha hukumu[a] na kuamuru mwanamume huyo aletwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niliketi kwenye jukwaa la mahakama.” Neno la Kigiriki βῆμα humaanisha kiti rasmi cha hakimu au jukwaa la mahakama.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: walipokusanyika
  rationale: Kishirikishi cha aoristi katika muundo wa genitive absolute kinaonyesha wahusika walipokusanyika; tafsiri hii ni ya kawaida na haiongezi utambulisho wao ambao umeachwa kudokezwa katika Kigiriki.
- source_word: οὖν
  choice: Basi
  rationale: Inaendeleza hoja ya Festo na kuonyesha matokeo au mwendelezo wa simulizi kwa Kiswahili cha kawaida.
- source_word: ἐνθάδε
  choice: hapa
  rationale: Ni kielezi cha mahali, na “hapa” ndilo neno la moja kwa moja na la kawaida katika muktadha.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: sikukawia hata kidogo
  rationale: Kirai hiki kinamaanisha kutofanya ucheleweshaji au kuahirisha shauri; usemi huu ni wa asili kwa Kiswahili na unahifadhi mkazo wa μηδεμίαν.
- source_word: τῇ ἑξῆς
  choice: siku iliyofuata
  rationale: Ni nahau ya wakati inayotaja siku iliyofuata, inayoweza kuwasilishwa kwa uwazi bila kulazimisha neno lisilotajwa.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: niliketi kwenye kiti cha hukumu
  rationale: βῆμα hapa ni kiti au jukwaa rasmi la hakimu. “Kiti cha hukumu” huhifadhi mazingira ya kimahakama huku tanbihi ikifafanua wigo wa neno.
- source_word: ἐκέλευσα
  choice: kuamuru
  rationale: Kitenzi hiki kinaonyesha agizo rasmi; “kuamuru” kinafaa katika mazingira ya kimahakama.
- source_word: ἀχθῆναι
  choice: aletwe
  rationale: Hii ni infinitivi ya aoristi tendwa ya ἄγω. “Aletwe” huhifadhi hali tendwa bila kuongeza wazo la ‘kuingizwa’ ambalo halijaelezwa wazi.
- source_word: τὸν ἄνδρα
  choice: mtu huyo
  rationale: Hurejelea mwanamume anayezungumziwa, yaani Paulo, bila kuongeza neno ‘mshtakiwa’ ambalo halipo wazi katika Kigiriki.
