  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: sw
  text: Ndipo Agripa akamwambia Festo, “Mimi mwenyewe ningependa kumsikia mtu huyo.” “Kesho,” anasema[b], “utamsikia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utasikia kutoka kwake.” Usemi wa Kigiriki unaweza kumaanisha kumsikia mtu huyo akizungumza moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kinatumia wakati wa sasa wa kihistoria: “anasema.” Tafsiri nyingine zinaweza kusema “akasema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agripa
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: δὲ
  choice: Ndipo
  rationale: Husogeza simulizi mbele kwa njia ya asili bila kuzidisha maana ya upinzani.
- source_word: πρὸς τὸν Φῆστον
  choice: akamwambia Festo
  rationale: Muundo wa πρός katika usemi umetolewa kwa kitenzi cha kawaida cha Kiswahili kinachoonyesha anayeelekezewa maneno.
- source_word: Ἐβουλόμην
  choice: ningependa
  rationale: Hutoa kwa Kiswahili cha sasa nia ya Agripa kwa heshima na kwa uasilia; wakati usiotimilika wa Kigiriki hauhitaji muundo mzito usio wa kawaida hapa.
- source_word: καὶ αὐτὸς
  choice: Mimi mwenyewe
  rationale: Huhifadhi mkazo unaowezekana juu ya mhusika; maana ya nyongeza, ‘mimi pia,’ imebainishwa katika tanbihi.
- source_word: τοῦ ἀνθρώπου
  choice: mtu huyo
  rationale: Humrejelea Paulo kama mtu maalumu aliyetajwa katika muktadha, kwa usemi wa asili wa Kiswahili.
- source_word: ἀκοῦσαι
  choice: kumsikia
  rationale: Huhifadhi kitenzi cha msingi ‘kusikia’ huku muktadha ukidokeza kumsikiliza akizungumza.
- source_word: Αὔριον
  choice: Kesho
  rationale: Ni tafsiri ya moja kwa moja ya kielezi cha wakati.
- source_word: φησίν
  choice: anasema
  rationale: Huhifadhi wakati wa sasa wa kihistoria wa Kigiriki na uchangamfu wake wa kisimulizi.
- source_word: ἀκούσῃ αὐτοῦ
  choice: utamsikia
  rationale: Ni usemi mfupi na wa kawaida; Kigiriki pia kinaweza kueleweka kuwa atamsikia akisema au atasikia kutoka kwake, jambo lililoonyeshwa katika tanbihi.
