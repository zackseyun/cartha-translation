  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: sw
  text: Basi siku iliyofuata, Agripa na Bernike walikuja kwa fahari kubwa[a], wakaingia katika ukumbi wa kusikilizia kesi pamoja na makamanda wa jeshi na wanaume mashuhuri wa jiji[b]. Kisha, kwa amri ya Festo, Paulo akaletwa ndani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maonyesho mengi ya kifahari.”
    reason: lexical_alternative
  - marker: b
    text: Au, “viongozi wa jiji” au “wanaume wenye hadhi katika jiji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Basi, siku iliyofuata
  rationale: Usemi huu wa wakati unamaanisha siku iliyofuata; “Basi” linaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: ἐλθόντος
  choice: walikuja
  rationale: Ingawa ni kitenzi-shirikishi katika muundo wa genitive absolute, kitenzi kikuu ni cha asili zaidi katika Kiswahili.
- source_word: Ἀγρίππα ... Βερνίκης
  choice: Agripa na Bernike
  rationale: Majina yametoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: μετὰ πολλῆς φαντασίας
  choice: kwa fahari kubwa
  rationale: Hueleza wonyesho wa nje wenye adhama na sherehe; “fahari kubwa” ni wazi na yenye hadhi bila kulazimisha maana ya ndani.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: wakaingia katika ukumbi wa kusikilizia kesi
  rationale: ἀκροατήριον ni mahali pa kusikiliza shauri rasmi; tafsiri hii inaweka wazi mazingira ya kikao bila kudai kwamba ulikuwa ukumbi wa mahakama wa kudumu.
- source_word: σύν τε χιλιάρχοις
  choice: pamoja na makamanda wa jeshi
  rationale: χιλίαρχος ni afisa mkuu wa kijeshi, kihalisi mwenye mamlaka juu ya kundi kubwa la wanajeshi; “makamanda wa jeshi” linaeleweka kwa wasomaji wa sasa kuliko cheo cha Kirumi kilichotoholewa.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: watu mashuhuri wa jiji
  rationale: Usemi huo unawataja wanaume wenye hadhi au umaarufu katika jiji; “watu mashuhuri” ni Kiswahili cha kawaida, huku tanbihi ikihifadhi rejeo mahsusi la kiume.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: kwa amri ya Festo
  rationale: Hutoa kwa ufupi mamlaka rasmi ya Festo yaliyomo katika κελεύω.
- source_word: ἤχθη ὁ Παῦλος
  choice: Paulo akaletwa ndani
  rationale: Kauli tendwa inaonyesha kuwa Paulo alisindikizwa au kuongozwa kuingia ukumbini.
