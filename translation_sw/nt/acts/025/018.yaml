  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: sw
  text: Kuhusu yeye, washtaki waliposimama, hawakuleta shtaka lolote la mambo maovu ambayo nilikuwa nikiyashuku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuleta shtaka lolote la makosa niliyokuwa nikiyashuku.” Kigiriki kinasema “mambo maovu,” ambayo yanaweza kumaanisha kwa upana zaidi matendo mabaya, si lazima makosa ya jinai yaliyofafanuliwa rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: kumshtaki
  rationale: Rejeo kwa Paulo linaunganishwa kwa kawaida na tendo la washtaki katika mazingira ya mahakama; maana ya ‘kuhusu yeye’ inabaki ndani ya muundo huu wa Kiswahili.
- source_word: σταθέντες
  choice: Waliposimama
  rationale: 'Kitenzi kishirikishi cha wakati uliopita kinatumiwa kwa maana ya wakati: washtaki walisimama ili kutoa shtaka lao.'
- source_word: οἱ κατήγοροι
  choice: washtaki
  rationale: Neno hili la kawaida na linaloeleweka linaonyesha watu waliokuwa wakileta mashtaka mahakamani bila kuwafanya rasmi waendesha mashtaka.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: hawakuleta shtaka lolote
  rationale: Huhifadhi nahau ya kisheria ya kuleta au kuwasilisha shtaka, kwa Kiswahili cha kawaida.
- source_word: ὧν
  choice: kuhusu mambo ... niliyodhani
  rationale: Muundo huu unaunganisha shtaka na aina ya mambo ambayo Festo alikuwa ameyatarajia, bila kulazimisha tafsiri finyu ya makosa rasmi ya jinai.
- source_word: ἐγὼ ὑπενόουν
  choice: niliyodhani
  rationale: Kiswahili cha kawaida hutumia ‘nilidhani’ kuonyesha dhana au matarajio ya awali; kiwakilishi cha nafsi hakihitaji kusisitizwa tofauti isipokuwa muktadha ulazimishe.
- source_word: πονηρῶν
  choice: mambo maovu
  rationale: Hufuata upana wa maana ya kivumishi cha Kigiriki katika wingi wa hali ya kati, ambacho kinaweza kumaanisha matendo mabaya kwa ujumla na si lazima makosa ya jinai yaliyofafanuliwa rasmi.
