  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya kisheria ni wazi kwa msomaji wa kawaida. Viashiria vya tanbihi vimewekwa moja kwa moja baada ya maneno yanayohusika; mpangilio [b] kisha [a] unatokana na nafasi sahihi za maelezo hayo katika sentensi.
