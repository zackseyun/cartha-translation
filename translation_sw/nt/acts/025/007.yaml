  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: sw
  text: Alipofika, Wayahudi[b] waliokuwa wameshuka kutoka Yerusalemu wakasimama kumzunguka[a], wakileta mashtaka mengi na mazito ambayo hawakuweza kuyathibitisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamzunguka.” Kitenzi cha Kigiriki kinaweza kusisitiza kusimama pande zote za mtu; katika mazingira haya ya kisheria, mkao huo unaweza pia kudokeza shinikizo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi au watu wa Yudea. Hapa “Wayahudi” limetumiwa kwa sababu linawarejelea washtaki Wayahudi kutoka Yerusalemu, si wakazi wote wa Yudea.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Alipofika
  rationale: Muundo huu wa genitivi kamili unaonyesha wakati wa tukio. “Alipofika” ni Kiswahili cha kawaida kinachohifadhi mfuatano wa matukio bila kuongeza maelezo yasiyokuwamo.
- source_word: περιέστησαν αὐτὸν
  choice: wakasimama kumzunguka[a]
  rationale: Kitenzi kina maana ya kusimama pande zote za mtu au kumzunguka. Tafsiri hii inahifadhi taswira ya mahakamani bila kudai wazi zaidi ya matini kwamba walikuwa wakimtisha.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: Wayahudi[b] waliokuwa wameshuka kutoka Yerusalemu
  rationale: Ἰουδαῖοι hapa inawahusu washtaki Wayahudi kutoka Yerusalemu; “Wayahudi” ni ya kawaida na wazi, huku “kutoka Yerusalemu” ikihifadhi taarifa ya kijiografia. “Wameshuka” pia huhifadhi namna ya kawaida ya kale ya kueleza safari kutoka Yerusalemu.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: mashtaka mengi na mazito
  rationale: αἰτιώματα ni mashtaka rasmi, na βαρέα inaonyesha uzito wake. “Mashtaka mengi na mazito” ni lugha ya kisheria iliyo wazi na pia inahifadhi viunganishi vya Kigiriki.
- source_word: καταφέροντες
  choice: wakileta
  rationale: Katika muktadha wa kisheria, neno hili linaonyesha kuleta au kutoa mashtaka dhidi ya mtu. “Wakileta” linaungana kwa kawaida na “mashtaka” katika Kiswahili.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: ambayo hawakuweza kuyathibitisha
  rationale: ἰσχύω pamoja na kitenzi-jina huonyesha uwezo, na ἀποδείκνυμι hapa ni kuthibitisha. Tafsiri hii inaeleza wazi kwamba hawakuwa na uwezo wa kutoa uthibitisho wa mashtaka hayo.
