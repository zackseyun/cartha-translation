  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: sw
  text: Badala yake, walikuwa na mabishano fulani naye kuhusu dini yao wenyewe[a], na kuhusu Yesu fulani aliyekufa, ambaye Paulo alidai kuwa yu hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushirikina wao wenyewe.” Neno la Kigiriki linaweza kutumiwa bila dharau kumaanisha dini, au kwa dharau zaidi na mtu wa nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: mabishano
  rationale: Neno hili linamaanisha masuala yenye ubishi, si maswali ya kawaida tu; “mabishano” linaendeleza hali ya kupingana katika mashtaka.
- source_word: δέ
  choice: Badala yake
  rationale: Katika muktadha, linaonyesha tofauti ya kusahihisha kati ya mashtaka ya jinai yaliyotarajiwa na mambo ambayo kwa kweli yalibishaniwa.
- source_word: τινα
  choice: fulani
  rationale: Linaacha masuala hayo bila kutajwa kwa undani, kama ilivyo katika Kigiriki.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: kuhusu dini yao wenyewe
  rationale: δεισιδαιμονία linaweza kuwa neno lisiloegemea upande wowote kwa dini au lenye dharau kwa ushirikina. “Dini” ni la kawaida na haliongezi dharau isiyo ya lazima; “yao wenyewe” linahifadhi mtazamo wa mbali wa Festo.
- source_word: εἶχον πρὸς αὐτόν
  choice: walikuwa na mabishano fulani naye
  rationale: Kauli hii inaonyesha kuwa walikuwa na mambo ya kubishania na Paulo bila kulazimisha maana rasmi zaidi ya kisheria.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: na kuhusu Yesu fulani
  rationale: “Yesu fulani” linahifadhi namna ya Festo ya kumrejelea kwa mbali, kana kwamba hamfahamu vizuri.
- source_word: τεθνηκότος
  choice: aliyekuwa amekufa
  rationale: Huhifadhi hali iliyotokana na kufa na kuweka wazi tofauti na dai kwamba yu hai.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: ambaye Paulo alidai kuwa yu hai
  rationale: “Alidai” linaripoti kauli ya Paulo kutoka kwa mtazamo wa Festo bila Festo kuithibitisha; “yu hai” ni usemi wa sasa, wa kawaida na wenye hadhi.
theological_decisions:
- issue: Jinsi ya kutafsiri δεισιδαιμονία katika maneno ya Festo
  choice: dini yao wenyewe
  alternative: ushirikina wao wenyewe
  rationale: Neno la Kigiriki linaweza kumaanisha dini kwa upana au kubeba dharau. Tafsiri kuu haipaswi kuongeza tusi kali kuliko linalohitajika, lakini uwezekano wa maana ya dharau umehifadhiwa katika tanbihi.
- issue: Namna ya kueleza dai la kufufuka
  choice: ambaye Paulo alidai kuwa yu hai
  alternative: ambaye Paulo alisema kuwa yu hai
  rationale: Haya ni maelezo ya Festo kuhusu kauli ya Paulo, si uthibitisho wa moja kwa moja wa msimulizi katika kishazi hiki. “Alidai” linahifadhi mtazamo huo bila kukanusha ukweli wa ufufuo unaofundishwa kwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi mtazamo wa Festo kama mtu wa nje na utata wa δεισιδαιμονία.
