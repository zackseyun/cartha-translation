base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: sw
  text: Lakini Paulo alipokata rufaa aendelee kuwekwa kizuizini kwa ajili ya uamuzi wa Augusto[a], niliamuru aendelee kuwekwa kizuizini hadi nitakapomtuma kwa Kaisari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina “wa Sebasto,” yaani “wa Augusto,” cheo cha mtawala wa Roma; au “wa Mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: alipokata rufaa
  rationale: Katika muktadha wa sheria ya Roma, kitenzi hiki cha kati kinaeleza tendo rasmi la kukata rufaa; usemi huu ni wa kawaida na wazi katika Kiswahili cha kisheria.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: aendelee kuwekwa kizuizini
  rationale: Hapa τηρέω inahusu kuzuiliwa rasmi chini ya mamlaka, si kulindwa tu. Neno 'aendelee' linaonyesha hali ya kuzuiliwa inayodumu hadi shauri liamuliwe au Paulo atumwe.
- source_word: διάγνωσιν
  choice: uamuzi
  rationale: Neno hili linaashiria uamuzi wa kimahakama. 'Uamuzi' ni pana kuliko 'hukumu' na halidai kwa lazima matokeo ya kumtia hatiani.
- source_word: Σεβαστοῦ
  choice: Kaisari
  rationale: Σεβαστός ni cheo cha kifalme cha mtawala wa Roma, kinacholingana na Kilatini Augustus. Katika muktadha huu kinamtaja Kaisari kama mamlaka ya juu ya rufaa; tanbihi inahifadhi umbo halisi la cheo hicho.
- source_word: ἀναπέμψω
  choice: nitakapomtuma
  rationale: Katika muktadha huu maana ni kumpeleka Paulo kwa mamlaka ya juu ya kifalme. 'Kumtuma' ni ya asili katika Kiswahili bila kulazimisha wazo la mwelekeo lililo katika kiambishi cha Kigiriki.
- source_word: πρὸς Καίσαρα
  choice: kwa Kaisari
  rationale: Καίσαρ hutumika kama cheo cha mtawala wa Roma. 'Kwa Kaisari' huhifadhi lugha ya kihistoria na kutofautisha hapa jina hilo na Σεβαστός katika kishazi kilichotangulia.
