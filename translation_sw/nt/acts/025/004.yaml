  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: sw
  text: Basi Festo akajibu kwamba Paulo alikuwa akizuiliwa Kaisaria[a], naye mwenyewe angeondoka karibuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa mujibu wa maandishi ya Kigiriki ya SBLGNT, maneno “Kaisaria” yana kutokuwa hakika kwa maandishi ya kale.
    reason: Hubainisha mabano ya kiuhakiki yanayozunguka εἰς Καισάρειαν katika maandishi chanzi, bila kuamua kati ya ushahidi wa maandishi.
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: alikuwa anazuiliwa
  rationale: Kitenzi hiki katika muktadha wa Paulo chini ya ulinzi wa serikali kina maana ya kuwekwa au kuzuiliwa chini ya ulinzi; usemi huu ni wa kawaida na unaeleweka bila kudokeza kifungo cha gerezani pekee.
- source_word: εἰς Καισάρειαν
  choice: Kaisaria
  rationale: Ingawa εἰς kwa kawaida huonyesha mwendo kuelekea mahali, pamoja na τηρεῖσθαι hapa inaeleweka kwa maana ya mahali ambako Paulo alikuwa anazuiliwa. Usomaji huu pia unalingana na muktadha wa aya zinazozunguka.
- source_word: ἐν τάχει
  choice: baada ya muda mfupi
  rationale: Usemi huu unaonyesha kwamba kuondoka kwake kungetokea karibuni, si lazima kasi ya safari yenyewe.
- source_word: ἐκπορεύεσθαι
  choice: angeondoka kwenda huko
  rationale: Kitenzi kinamaanisha kutoka au kuondoka; 'kwenda huko' huweka wazi kwa njia ya asili kwamba Kaisaria ndiyo iliyokuwa safari yake, kama muktadha unavyoonyesha.
