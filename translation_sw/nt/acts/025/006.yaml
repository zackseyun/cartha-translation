base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: sw
  text: Baada ya kukaa miongoni mwao kwa siku zisizozidi nane au kumi, alishuka kwenda Kaisaria. Siku iliyofuata, aliketi kwenye kiti cha hukumu[a] na kuamuru Paulo aletwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliketi kwenye jukwaa la hukumu.” Neno la Kigiriki βῆμα humaanisha kiti au jukwaa rasmi la mahakama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας
  choice: Baada ya kukaa
  rationale: Kitenzi hiki kinaonyesha kwamba Festo alikaa huko kwa muda fulani kabla ya kushuka kwenda Kaisaria; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἐν αὐτοῖς
  choice: kati yao
  rationale: Huhifadhi maana ya kuwa miongoni mwa watu waliotajwa katika muktadha, bila kuifanya iwe tu hali ya kuwa pamoja nao.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: kwa siku zisizozidi nane au kumi
  rationale: Huhifadhi usemi usio wa kawaida wa Kigiriki wenye kikomo cha muda na makadirio ya ‘nane au kumi,’ badala ya kuugeuza kuwa idadi kamili.
- source_word: καταβὰς
  choice: alishuka kwenda
  rationale: Huhifadhi lugha ya mwelekeo wa safari kutoka Yerusalemu kwenda Kaisaria na kuifanya sentensi isomeke kwa kawaida.
- source_word: Καισάρειαν
  choice: Kaisaria
  rationale: Hili ndilo umbo la kawaida la jina la mahali Καισάρεια katika tafsiri za Kiswahili.
- source_word: τῇ ἐπαύριον
  choice: Siku iliyofuata
  rationale: Hueleza kwa uwazi siku iliyofuata baada ya kufika Kaisaria.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: aliketi kwenye kiti cha hukumu
  rationale: βῆμα katika muktadha huu ni kiti au sehemu rasmi ambako hakimu huketi kutoa hukumu; ‘kiti cha hukumu’ ni wazi, cha heshima, na kinafaa katika mazingira ya mahakama.
- source_word: ἐκέλευσεν
  choice: kuamuru
  rationale: Huwasilisha agizo rasmi la mwenye mamlaka katika mazingira ya mahakama.
- source_word: ἀχθῆναι
  choice: Paulo aletwe
  rationale: Huhifadhi hali tendwa ya kitenzi na mwendo unaodokezwa wa kumleta Paulo mbele ya mahakama bila kuongeza maelezo yasiyokuwamo.
