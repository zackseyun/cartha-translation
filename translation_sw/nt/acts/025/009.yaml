base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: sw
  text: Lakini Festo, akitaka kuwafanyia Wayahudi upendeleo[a], akamjibu Paulo, “Je, unataka kwenda Yerusalemu na kuhukumiwa huko mbele yangu kuhusu mambo haya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwatendea Wayahudi fadhila.” Katika muktadha huu, “Wayahudi” ni hasa washtaki au viongozi wa Kiyahudi waliokuwa wakifuatilia kesi dhidi ya Paulo, si Wayahudi wote bila ubaguzi.
    reason: lexical_alternative; cultural_note
  - marker: b
    text: Au, “kesi yako isikilizwe huko mbele yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: akitaka
  rationale: Huhifadhi hali ya kitenzi kishirikishi cha wakati uliopo kinachoonyesha nia ya Festo inayoendelea, kwa Kiswahili cha kawaida.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Hufuata neno pana la Kigiriki bila kulibana kimafasiri kuwa viongozi pekee; muktadha unaonyesha kuwa wanaokusudiwa ni washtaki au viongozi wa Kiyahudi.
- source_word: χάριν καταθέσθαι
  choice: kuwatendea ... jambo la kuwafurahisha
  rationale: Nahau hii ina maana ya kuwafanyia jambo la upendeleo ili kupata au kudumisha nia njema. Usemi huu ni wa asili katika Kiswahili na hauzidishi wazo la hila.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: akamjibu Paulo
  rationale: Muundo wa Kigiriki unaanzisha maneno ya moja kwa moja kwa kitenzi kishirikishi na kitenzi cha kusema; Kiswahili cha masimulizi huunganisha kwa kawaida kuwa ‘akamjibu Paulo’ bila kurudia ‘akasema’.
- source_word: Θέλεις
  choice: Je, unataka
  rationale: Huonyesha swali la moja kwa moja kuhusu utashi wa Paulo, bila kulifanya kuwa swali la kukubali tu.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: kwenda Yerusalemu
  rationale: Kiswahili cha kawaida hutumia ‘kwenda Yerusalemu’; kuongeza ‘kupanda kwenda’ kungekuwa kizito, ingawa Kigiriki hutumia nahau ya kwenda juu kuelekea Yerusalemu.
- source_word: περὶ τούτων
  choice: kuhusu mambo haya
  rationale: Huhifadhi rejeo pana la Kigiriki bila kuongeza neno mahususi ‘mashtaka,’ ambalo linatokana na muktadha.
- source_word: κριθῆναι
  choice: kuhukumiwa
  rationale: Katika muktadha wa mahakama, linaweza kumaanisha kusikilizwa kwa kesi au kutolewa uamuzi; ‘kuhukumiwa’ ni tafsiri ya karibu lakini uwezekano mpana unaelezwa katika tanbihi.
- source_word: ἐπ’ ἐμοῦ
  choice: mbele yangu
  rationale: Huhifadhi uwezekano wa maana ya kesi kusikilizwa mbele ya Festo au chini ya mamlaka yake bila kudai kwamba yeye peke yake ndiye angeamua.
theological_decisions:
- issue: Uwezekano wa kauli ‘Wayahudi’ kueleweka kama lawama kwa Wayahudi wote
  choice: Kubakiza ‘Wayahudi’ katika matini na kufafanua rejeo lake la kimuktadha katika tanbihi
  alternative: viongozi wa Kiyahudi; washtaki Wayahudi
  rationale: Kigiriki kina neno pana τοῖς Ἰουδαίοις. Kulibadilisha katika matini kuwa ‘viongozi’ kungebana maana kuliko chanzo, lakini muktadha unaonyesha kuwa hapa linawahusu hasa waliokuwa wakimshtaki Paulo, si kila Myahudi.
- issue: Upana wa maana ya κριθῆναι katika mazingira ya kisheria
  choice: kuhukumiwa, huku tanbihi ikitaja ‘kesi yako isikilizwe’
  alternative: kushtakiwa; kesi yako isikilizwe
  rationale: Neno la Kigiriki linaweza kuelekeza kwenye kuhukumiwa au kusikilizwa kwa kesi. Tanbihi huhifadhi upana huo bila kuingiza hitimisho kwamba Festo alikuwa tayari anamaanisha hukumu ya hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Mtindo wa masimulizi ni mwepesi; istilahi za kisheria zimewekwa wazi bila kufafanua kupita chanzo. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
