  to: Basi, ikiwa ninatenda kosa na nimetenda kosa lolote linalostahili adhabu ya kifo, sikatai kufa. Lakini ikiwa hakuna lolote katika yale ambayo watu hawa wananishtaki nayo, hakuna mtu anayeweza kunikabidhi kwao ili kuwafanyia upendeleo.[a] Ninakata rufaa kwa Kaisari.
