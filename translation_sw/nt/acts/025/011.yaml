id: ACT.25.11
reference: Acts 25:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: sw
  text: Basi, ikiwa ninatenda kosa na nimetenda kosa lolote linalostahili adhabu ya kifo, sikatai kufa. Lakini ikiwa hakuna lolote katika yale ambayo watu hawa wananishtaki nayo, hakuna mtu anayeweza kunikabidhi kwao ili kuwafanyia upendeleo.[a] Ninakata rufaa kwa Kaisari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna mtu anayeweza kunikabidhi kwao kama upendeleo.” Kitenzi cha Kigiriki kina maana ya kumpa au kumkabidhi mtu kwa wengine kama fadhili au upendeleo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: ninafanya kosa
  rationale: Kauli ya wakati uliopo imehifadhiwa, nayo ina uzito wa kimaadili na kisheria bila kutaja kosa maalumu.
- source_word: ἄξιον θανάτου
  choice: linalostahili kifo
  rationale: Hueleza jambo linalomfanya mtu astahili adhabu ya kifo, huku ikihifadhi lugha ya tathmini ya Kigiriki.
- source_word: πέπραχά τι
  choice: nimefanya jambo lolote
  rationale: Wakati timilifu unaonyesha tendo lililofanyika lenye umuhimu wa sasa; 'jambo lolote' huhifadhi kutokuwa maalumu kwa τι.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: sikatai kufa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kukataa au kujiepusha na kufa katika muktadha huu wa hukumu.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: hakuna msingi wowote katika mambo ambayo watu hawa wananishtaki
  rationale: Huwasilisha kwamba mashtaka hayana uzito au uhalali bila kuongeza moja kwa moja neno 'kweli' lisilopo katika Kigiriki.
- source_word: χαρίσασθαι
  choice: kunikabidhi kwao ili kuwapendeza
  rationale: Huhifadhi maana ya kumtoa mtu kama fadhili au upendeleo katika mazingira ya kisiasa na kimahakama.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Ninakata rufaa kwa Kaisari
  rationale: Ni istilahi wazi na ya kawaida ya Kiswahili kwa hatua rasmi ya kisheria ya kukata rufaa kwa mfalme wa Roma.
- source_word: μὲν οὖν ... δὲ
  choice: Basi, ikiwa ... Lakini ikiwa
  rationale: Muundo huu unaonyesha mtiririko wa hoja na ulinganifu wenye utofautishaji kati ya masharti mawili.
theological_decisions:
- issue: Maana ya kimahakama ya kauli ya Paulo kuhusu kifo na rufaa
  choice: Paulo anakubali kwa sharti kufa ikiwa kweli ametenda kosa linalostahili kifo, lakini anakataa kukabidhiwa isivyo haki kwa washtaki wake.
  alternative: Kauli yake ichukuliwe kuwa ya balagha tu, bila kukubali kwa namna yoyote uhalali wa hukumu ya kifo.
  rationale: Kigiriki kinaweka sharti halisi na kisha kulinganisha na kutokuwa na msingi kwa mashtaka. Tafsiri haipanui jambo hili kuwa fundisho la jumla kuhusu adhabu ya kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Lugha ya kimahakama imetumiwa kwa kiasi kinachofaa; 'kunishtaki,' 'kukata rufaa,' na 'Kaisari' ni maneno yanayotambulika kwa urahisi.
