  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa heshima na unaoeleweka kwa urahisi. Istilahi za kisheria “mshtakiwa,” “wanaomshtaki,” “kujitetea,” na “shtaka” zimetumiwa bila kufanya sentensi iwe ya kitaalamu kupita kiasi.
