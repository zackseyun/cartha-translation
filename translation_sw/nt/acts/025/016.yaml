  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: sw
  text: Niliwajibu kwamba si desturi ya Waroma kumkabidhi[a] mtu yeyote kabla ya mshtakiwa kukabiliana uso kwa uso na washtaki wake na kupata nafasi ya kujitetea kuhusu shtaka hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumtoa mtu yeyote kama fadhila”; kitenzi cha Kigiriki kinaweza kumaanisha kumkabidhi mtu ili kutimiza ombi la mshitaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: desturi
  rationale: Neno hili linamaanisha desturi au utaratibu uliozoeleka; “desturi” ni la kawaida na linafaa katika muktadha wa sheria na utawala.
- source_word: Ῥωμαίοις
  choice: ya Waroma
  rationale: Dativu ya wingi inawarejelea Waroma kama jamii yenye utaratibu wa kisheria; muundo “desturi ya Waroma” ni wa asili katika Kiswahili.
- source_word: χαρίζεσθαί
  choice: kumkabidhi
  rationale: Katika muktadha huu kitenzi kina maana ya kumtoa mtu ili kukubali ombi la wengine; “kumkabidhi” huwasilisha tendo hilo bila kulifanya lionekane kama ukarimu wa kawaida.
- source_word: τινα ἄνθρωπον
  choice: mtu yeyote
  rationale: Ingawa muundo wa Kigiriki ni wa kisarufi wa kiume, unatumiwa kwa maana ya jumla katika muktadha huu wa kisheria; Kiswahili “mtu yeyote” huhifadhi maana hiyo kwa kawaida.
- source_word: ὁ κατηγορούμενος
  choice: mshtakiwa
  rationale: Kivumishi-partisipio kinatumika kama nomino kumtaja mtu anayeshtakiwa; “mshtakiwa” ni neno fupi na linalofaa kisheria.
- source_word: κατὰ πρόσωπον
  choice: uso kwa uso
  rationale: Nahau hii inaonyesha kukabiliana moja kwa moja mbele ya mtu; “uso kwa uso” huhifadhi picha na nguvu ya Kigiriki.
- source_word: τόπον ... ἀπολογίας
  choice: nafasi ya kujitetea
  rationale: τόπος hapa si mahali halisi bali fursa, na ἀπολογία ni utetezi dhidi ya mashtaka; kirai hiki ni cha asili na wazi kwa msomaji wa Kiswahili.
- source_word: ἐγκλήματος
  choice: shtaka hilo
  rationale: Neno hili linamaanisha shtaka la kisheria; kiashiria “hilo” hurejelea wazi shtaka lililokuwa mbele yao.
theological_decisions: []
