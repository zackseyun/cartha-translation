  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: sw
  text: Kwa hiyo, wale miongoni mwenu walio na uwezo[a] washuke pamoja nami, na ikiwa kuna jambo lolote lisilofaa katika mtu huyo, wamshtaki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye mamlaka miongoni mwenu” au “watu mashuhuri miongoni mwenu.” Neno la Kigiriki linaweza kumaanisha wenye uwezo, nguvu, hadhi, au mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Au, “wamletee mashtaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Kwa hiyo, wale ...
  rationale: οὖν huendeleza hoja kwa kuonyesha matokeo au hitimisho; “Kwa hiyo” ni ya kawaida na wazi katika Kiswahili.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: wale miongoni mwenu walio na uwezo
  rationale: δυνατοί inaweza kumaanisha wenye uwezo, wenye nguvu, mashuhuri, au wenye mamlaka. Tafsiri hii inahifadhi upana wa maana badala ya kuamua kimya kuwa ni viongozi pekee.
- source_word: φησίν
  choice: haijawakilishwa moja kwa moja
  rationale: Ni kauli ya pembeni yenye maana ya “anasema,” inayotambulisha maneno ya Festo. Kwa kuwa mstari umetolewa kama hotuba ya moja kwa moja, kuitaja tena kungekuwa nzito katika Kiswahili.
- source_word: συγκαταβάντες
  choice: washuke pamoja nami
  rationale: Kitenzi kinaonyesha kushuka kwa safari pamoja na mtu mwingine; “pamoja nami” huwakilisha kiambishi σύν, na “washuke” huhifadhi namna ya kale ya kueleza safari kutoka Yerusalemu kwenda Kaisaria.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: ikiwa mtu huyo amefanya jambo lolote baya
  rationale: Kirai cha Kigiriki kwa karibu ni “ikiwa kuna jambo lolote lisilofaa katika mtu huyo.” Kiswahili hiki huwasilisha maana yake kwa kawaida bila kukaza ἄτοπον kuwa lazima ni uhalifu.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: na wamshtaki
  rationale: κατηγορέω katika mazingira ya kisheria ni kushtaki au kutoa mashtaka dhidi ya mtu; “wamshtaki” ni fupi na ya kawaida.
