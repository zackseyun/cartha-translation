base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: sw
  text: Kwa kuwa nilikuwa nimetatanishwa na uchunguzi kuhusu mambo haya[a], nilimuuliza kama angependa[b] kwenda Yerusalemu na kuhukumiwa huko kuhusu mambo hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilikuwa sijui jinsi ya kushughulikia mabishano kuhusu mambo haya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kama alikuwa tayari kwenda Yerusalemu na kesi yake isikilizwe huko kuhusu mambo hayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: nilikuwa sijui jinsi ya kushughulikia
  rationale: Kitenzi hiki kinaonyesha hali ya kutokuwa na njia wazi au kutatizika. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kutokuwa na hakika kwa Festo bila kudai kwamba hakuwa na ujuzi wowote.
- source_word: ζήτησιν
  choice: uchunguzi
  rationale: Katika muktadha huu wa kisheria na kiutawala, neno linaweza kumaanisha uchunguzi, suala linalochunguzwa, au mabishano. “Uchunguzi” linafaa huku wigo wa maana mbadala ukihifadhiwa katika tanbihi.
- source_word: περὶ τούτων
  choice: wa mambo haya / kuhusu mambo hayo
  rationale: Muundo huu unarejelea masuala yaliyokuwa yakijadiliwa. Tofauti ya “haya” na “hayo” inafanya marejeo ya Kiswahili yawe ya kawaida bila kubadili rejeleo.
- source_word: ἔλεγον
  choice: nilimuuliza
  rationale: Ingawa maana ya msingi ni “nilisema,” swali lisilo la moja kwa moja linalofuata linaonyesha kwamba hapa Festo aliuliza.
- source_word: εἰ βούλοιτο
  choice: kama angependa
  rationale: Huwasilisha swali lisilo la moja kwa moja kuhusu nia au utayari wa Paulo; “angependa” ni Kiswahili cha kawaida na hakibani maana kuwa ridhaa pekee.
- source_word: πορεύεσθαι
  choice: kwenda
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya mwendo unaokusudiwa.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili.
- source_word: κἀκεῖ
  choice: na ... huko
  rationale: Huhifadhi maana ya “na huko” kwa mpangilio wa kawaida wa Kiswahili.
- source_word: κρίνεσθαι
  choice: kuhukumiwa
  rationale: Katika muktadha wa kisheria, neno linamaanisha kufanyiwa uamuzi wa mahakama. “Kuhukumiwa” huhifadhi maana pana, ingawa “kushtakiwa/kusikilizwa kesi” yanaweza kusisitiza mchakato wa kesi.
