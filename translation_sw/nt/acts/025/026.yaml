  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: sw
  text: Kuhusu mtu huyu, sina jambo lolote lililo wazi la kumwandikia bwana wangu.[a] Kwa hiyo nimemleta mbele yenu nyote, na hasa mbele yako, Mfalme Agripa, ili, baada ya uchunguzi kufanyika,[b] nipate jambo la kuandika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa uwazi zaidi, “Kaisari.” Kigiriki kinasema “bwana wangu,” likitumia cheo κύριος katika muktadha huu wa utawala wa Roma.
    reason: alternative_reading
  - marker: b
    text: “Uchunguzi” pia unaweza kutafsiriwa “usikilizaji wa kesi” au “upelelezi,” likimaanisha uchunguzi wa kisheria wa kesi ya Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: jambo lolote la uhakika
  rationale: Kirai hiki humaanisha jambo thabiti, la hakika, au linaloweza kutegemewa. Katika muktadha wa kiutawala na kisheria, Festo anasema hana taarifa au shtaka lililo wazi na thabiti la kuandika.
- source_word: τῷ κυρίῳ
  choice: bwana wangu
  rationale: κύριος kimsingi ni ‘bwana’; hapa inamtaja mtawala wa Roma katika lugha rasmi. Tafsiri hii huhifadhi umbo la neno la Kigiriki, huku tanbihi ikifafanua kwamba anayelengwa ni Kaisari.
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: nimemleta mbele yenu nyote
  rationale: Kitenzi kina maana ya kumleta au kumwasilisha mtu mbele ya hadhira. ‘Yenu nyote’ huonyesha wazi wingi wa ὑμῶν na kuutofautisha na usemi wa umoja unaomfuata Agripa.
- source_word: μάλιστα ἐπὶ σοῦ
  choice: na hasa mbele yako
  rationale: μάλιστα humwekea Agripa mkazo wa pekee miongoni mwa waliokuwapo.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: baada ya uchunguzi kufanywa
  rationale: ἀνάκρισις ni uchunguzi, usikilizaji, au upelelezi wa kisheria. Muundo wa Kigiriki unaonyesha wakati na umetafsiriwa kwa kawaida kama ‘baada ya ... kufanywa.’
- source_word: σχῶ τί γράψω
  choice: nipate jambo la kuandika
  rationale: Kirai hiki huonyesha kusudi la kupata jambo au taarifa ambayo Festo angeweza kuiandika katika ripoti rasmi.
theological_decisions:
- issue: Maana ya κύριος katika muktadha wa utawala, si wa moja kwa moja wa kitheolojia
  choice: bwana wangu
  alternative: Kaisari; maliki
  rationale: Hapa κύριος hamtaji Mungu wala Masihi, bali mtawala wa Roma katika mawasiliano rasmi. ‘Bwana wangu’ huhifadhi maana ya msingi na hali ya heshima ya neno, huku tanbihi ikimtambulisha anayelengwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi inayofaa mazingira rasmi ya mahakama. Muundo umetiririka kiasili bila kupoteza tofauti kati ya hadhira ya wingi na Agripa anayesemeshwa kwa umoja.
