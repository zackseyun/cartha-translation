base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: sw
  text: Lakini Paulo akasema, “Nimesimama mbele ya kiti cha hukumu cha Kaisari[a], ambako inanipasa kuhukumiwa. Sijawakosea Wayahudi kwa lolote[b], kama wewe mwenyewe unavyojua vizuri zaidi[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele ya mahakama ya Kaisari.” Neno la Kigiriki βῆμα linaweza kumaanisha kiti rasmi cha hakimu au mahakama inayowakilishwa na kiti hicho.
    reason: lexical_alternative
  - marker: b
    text: Au “Sijawatendea Wayahudi kosa lolote.”
    reason: lexical_alternative
  - marker: c
    text: Au “kama wewe pia unavyojua vyema.” Usemi wa Kigiriki una neno linganishi, “vizuri zaidi,” ambalo linaweza kuwa njia ya kusisitiza kwamba Festo analijua jambo hilo vizuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: kiti cha hukumu
  rationale: Katika muktadha huu neno hilo humaanisha kiti rasmi cha hakimu na, kwa upana, mahakama yenye mamlaka; ‘kiti cha hukumu’ huhifadhi taswira ya Kigiriki na kueleweka katika mazingira ya kesi.
- source_word: Καίσαρος
  choice: cha Kaisari
  rationale: ‘Kaisari’ huhifadhi cheo cha kifalme cha Kirumi na mazingira ya kihistoria na kisheria.
- source_word: ἑστώς εἰμι
  choice: Nimesimama
  rationale: Muundo wa kitenzi kishirikishi cha wakati timilifu pamoja na εἰμι unasisitiza hali ya Paulo ya sasa akiwa mbele ya mamlaka hiyo; ‘nimesimama’ ni ya asili na hudumisha msisitizo huo.
- source_word: οὗ
  choice: ambako
  rationale: Hurejelea kiti cha hukumu kama mahali au mamlaka stahiki pa kuhukumiwa; ‘ambako’ ni Kiswahili cha kawaida katika muktadha huu.
- source_word: δεῖ
  choice: inanipasa
  rationale: Huonyesha ulazima au wajibu wa kisheria, yaani mamlaka inayostahili kusikiliza kesi yake, bila kuifanya kauli kuwa amri ya nje isiyoelezwa.
- source_word: κρίνεσθαι
  choice: kuhukumiwa
  rationale: Katika kauli tendwa na muktadha wa kisheria humaanisha kuhukumiwa au kusikilizwa kesi; ‘kuhukumiwa’ hufuata Kigiriki kwa karibu.
- source_word: Ἰουδαίους
  choice: Wayahudi
  rationale: Hapa neno linawataja Wayahudi ambao Paulo anatuhumiwa kuwakosea; tafsiri hii ni ya moja kwa moja bila kulibana kwa maana ya wakaaji wa Uyahudi pekee.
- source_word: οὐδὲν ἠδίκησα
  choice: Sijawatendea Wayahudi kosa lolote
  rationale: Huleta pamoja maana ya kufanya uovu, kudhulumu, au kukosea; ‘kutendea kosa’ huwasilisha nguvu yake ya kimaadili na kisheria kwa Kiswahili cha kawaida.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: kama wewe mwenyewe unavyojua vizuri zaidi
  rationale: ‘Wewe mwenyewe’ huonyesha msisitizo wa καὶ σὺ, huku ‘vizuri zaidi’ ikihifadhi umbo linganishi la κάλλιον na nguvu ya utambuzi kamili katika ἐπιγινώσκεις.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa karibu na chanzo huku ukibaki wa kawaida kwa msomaji; istilahi ya kisheria ‘kiti cha hukumu’ imefafanuliwa kwa tanbihi, na umbo linganishi lenye uwezekano wa kueleweka kwa zaidi ya njia moja limehifadhiwa.
