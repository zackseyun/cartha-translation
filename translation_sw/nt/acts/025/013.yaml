  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: sw
  text: Baada ya siku kadhaa kupita, Mfalme Agripa na Bernike[a] walifika Kaisaria kumsalimu Festo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Bernike linaweza pia kuandikwa Berenike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Baada ya siku kadhaa kupita
  rationale: Kirai huru cha hali ya umilikaji kinaweka mazingira ya wakati. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi neno la wazi la maana ya ‘sasa’ ambalo halipo katika chanzo.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: Mfalme Agripa
  rationale: Mpangilio wa cheo kabla ya jina ni wa kawaida katika Kiswahili na unahifadhi βασιλεύς kama cheo halisi cha kifalme.
- source_word: Βερνίκη
  choice: Bernike
  rationale: Huu ni unukuzi wa Kiswahili unaokaribia matamshi ya jina la Kigiriki; umbo mbadala ‘Berenike’ limetajwa katika tanbihi.
- source_word: κατήντησαν
  choice: walifika
  rationale: Kitenzi kinaonyesha kufika mahali baada ya safari; ‘walifika’ ni cha asili na sahihi katika muktadha huu.
- source_word: εἰς Καισάρειαν
  choice: Kaisaria
  rationale: Pamoja na ‘walifika,’ Kiswahili hutaja mahali panapofikiwa bila kihusishi cha ziada; jina limeandikwa kwa unukuzi unaotumiwa kwa kawaida katika Kiswahili.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: kumsalimu Festo
  rationale: Kirai cha kushiriki kinaweza kueleza kusudi au tendo lililoandamana na kufika. ‘Kumsalimu’ huhifadhi maana ya msingi bila kuongeza dhana mahsusi ya kutoa heshima za kikabaila.
- source_word: Φῆστον
  choice: Festo
  rationale: Unukuzi wa Kiswahili wa jina la gavana huyo wa Kirumi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. Kiunganishi hafifu δέ hakikutafsiriwa kwa neno la ziada, kwa kuwa mwendelezo wa simulizi unaeleweka bila kulazimisha ‘basi’ au ‘sasa.’
