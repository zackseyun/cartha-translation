base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: sw
  text: wakimwomba awatendee fadhili dhidi yake[a], ili aagize apelekwe Yerusalemu, huku wakipanga kumvizia njiani ili wamuue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amtume aitwe Yerusalemu” au “atume watu wamlete Yerusalemu.” Kitenzi cha Kigiriki kinaweza kumaanisha “kutuma watu wamlete” au “kuagiza apelekwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι
  choice: wakimwomba
  rationale: Kitenzi katika hali ya kushiriki kinaonyesha ombi lililokuwa likitolewa wakati huohuo na matendo ya muktadha; “wakimwomba” ni Kiswahili cha kawaida na huhifadhi uhusiano huo.
- source_word: χάριν
  choice: awafanyie fadhili
  rationale: Katika msemo αἰτεῖν χάριν, neno hili humaanisha kuomba fadhili au kibali; muundo huu ni wa asili katika Kiswahili.
- source_word: κατ’ αὐτοῦ
  choice: dhidi yake
  rationale: Muktadha unaonyesha kuwa ombi lao lilikuwa na nia ya kumdhuru Paulo, kwa hiyo “dhidi yake” huhifadhi maana ya uhasama.
- source_word: ὅπως
  choice: kwa
  rationale: Hapa ὅπως huanzisha yaliyomo au kusudi la ombi. “Kwa kuamuru” huunganisha ombi na hatua waliyoitaka kwa Kiswahili cha asili bila kuondoa maana hiyo.
- source_word: μεταπέμψηται
  choice: aamuru aletwe
  rationale: Kitenzi kinaweza kumaanisha ‘kutuma watu wamlete’ au ‘kumwita aje.’ Katika muktadha wa kuhamishwa kwa Paulo, “aamuru aletwe” huonyesha kwa uwazi kuwa Festo angepanga aletwe, huku tanbihi ikihifadhi uwezekano mwingine wa kileksika.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Kiambishi cha kitenzi “aletwe” tayari huonyesha mwelekeo; Kiswahili cha kawaida hakihitaji kihusishi kingine hapa.
- source_word: ἐνέδραν ποιοῦντες
  choice: huku wakipanga kumvizia
  rationale: Muundo huu unaonyesha tendo lililoandamana na ombi lao na unatoa kwa lugha ya kawaida wazo la kuandaa shambulio la kuvizia.
- source_word: ἀνελεῖν
  choice: na kumuua
  rationale: Katika muktadha huu ἀναιρέω humaanisha kuua; “kumuua” ni ya moja kwa moja bila kuongeza hukumu ya kisheria au kimaadili isiyosemwa.
- source_word: κατὰ τὴν ὁδόν
  choice: njiani
  rationale: “Njiani” ni tafsiri fupi na ya kawaida ya tendo linalokusudiwa kutokea wakati wa safari.
