base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: sw
  text: Lakini nilibaini kwamba hakuwa ametenda lolote linalostahili kifo. Lakini yeye mwenyewe alipokata rufaa kwa Kaisari[a], niliamua kumpeleka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Augusto.” Neno la Kigiriki Σεβαστός ni cheo cha Kirumi kinachomrejelea Kaisari, mtawala wa Roma, hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: niligundua
  rationale: Katika muktadha huu wa kisheria, neno hili linaonyesha uamuzi ambao Festo alifikia baada ya kuchunguza jambo; “niligundua” ni Kiswahili cha kawaida kisichozidisha maana kuwa hukumu rasmi ya mwisho.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: jambo lolote linalostahili kifo
  rationale: Huhifadhi maana ya kutokuwapo kwa tendo linalostahili adhabu ya kifo bila kuongeza wazi istilahi ya kiufundi ya “adhabu ya kifo,” ambayo haimo moja kwa moja katika Kigiriki.
- source_word: πεπραχέναι
  choice: hakufanya
  rationale: Kitenzi πράσσω hapa kinahusu jambo alilotenda; “hakufanya jambo lolote” ni cha asili katika Kiswahili na kinaendana na μηδὲν.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: Naye mwenyewe alipokata rufaa
  rationale: “Mwenyewe” huhifadhi msisitizo wa αὐτοῦ ... τούτου, na “alipokata” huonyesha mazingira yaliyosababisha uamuzi wa Festo bila kulazimisha zaidi ya lazima tofauti kati ya wakati na sababu.
- source_word: ἐπικαλεσαμένου
  choice: alikata rufaa
  rationale: Katika mazingira ya sheria ya Roma, ἐπικαλέω humaanisha kuomba kesi isikilizwe na mamlaka ya juu; “kukata rufaa” ndiyo kauli wazi na ya kawaida ya Kiswahili.
- source_word: τὸν Σεβαστόν
  choice: Mfalme
  rationale: Σεβαστός hapa ni cheo cha mtawala wa Roma, si jina linalomtaja Kaisari Augusto wa kwanza. “Mfalme” huwasilisha kwa uwazi cheo cha mtawala mkuu katika Kiswahili, huku tanbihi ikihifadhi jina halisi la cheo hicho.
- source_word: ἔκρινα
  choice: niliamua
  rationale: Hapa κρίνω inaonyesha uamuzi wa kiutaratibu wa Festo; “niliamua” ni wazi na ya kawaida kuliko tafsiri inayoweza kudokeza hukumu juu ya hatia.
- source_word: πέμπειν
  choice: kumpeleka
  rationale: Kiswahili huhitaji yambwa irejeshwe wazi katika kitenzi; “kumpeleka” humrejelea Paulo kutoka katika muktadha bila kuongeza taarifa mpya.
