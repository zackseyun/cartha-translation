  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: sw
  text: Lakini walipompinga na kukufuru[a], alikung’uta mavazi yake, akawaambia, “Damu yenu iwe juu ya vichwa vyenu wenyewe![b] Mimi sina hatia. Kuanzia sasa nitakwenda kwa Mataifa.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusema kwa matusi.” Kitenzi cha Kigiriki kinaweza kumaanisha kukufuru au kusema kwa dharau na matusi; hapa yule au kile kinacholengwa hakijaelezwa wazi.
    reason: lexical_alternative
  - marker: b
    text: “Damu yenu iwe juu ya vichwa vyenu wenyewe” ni nahau inayomaanisha kwamba wao wenyewe wanawajibika kwa matokeo.
    reason: cultural_note
  - marker: c
    text: “Mataifa” hapa ni watu wasio Wayahudi; neno hilo linaweza pia kutafsiriwa “mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: walipompinga
  rationale: Kitenzi hiki kinaonyesha kwamba walijiweka dhidi ya Paulo na ujumbe wake. ‘Walipompinga’ ni Kiswahili cha kawaida chenye nguvu ya upinzani wa makusudi.
- source_word: βλασφημούντων
  choice: kukufuru
  rationale: ‘Kukufuru’ hudumisha uzito na upana wa kitenzi cha Kigiriki bila kuongeza kiwakilishi cha yambwa ambacho hakijaelezwa wazi katika matini. Tanbihi inaonyesha uwezekano wa maana ya kusema kwa matusi.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: alikung’uta mavazi yake
  rationale: Usemi huu unaeleza tendo la kuyakung’uta mavazi kama ishara ya kujitenga na kutowajibika tena kwa matokeo; tafsiri inabaki karibu na umbo la Kigiriki na ni ya asili kwa Kiswahili.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Damu yenu iwe juu ya vichwa vyenu wenyewe
  rationale: Nahau ya kuwajibika kwa matokeo imehifadhiwa pamoja na wingi wa ‘vichwa’ na uzito wa tamko la Kigiriki.
- source_word: καθαρὸς ἐγώ
  choice: Mimi sina hatia
  rationale: Kivumishi ‘safi’ kimetumiwa kwa maana ya kutokuwa na lawama au wajibu; ‘sina hatia’ huwasilisha maana hiyo wazi bila kuleta dhana ya usafi wa kimwili.
- source_word: ἀπὸ τοῦ νῦν
  choice: Kuanzia sasa
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha badiliko la uamuzi kuanzia wakati huo.
- source_word: εἰς τὰ ἔθνη
  choice: kwa watu wa mataifa
  rationale: Katika muktadha huu, ‘mataifa’ ni watu wasio Wayahudi. Kuongeza ‘watu wa’ hufanya maana hiyo iwe wazi na ya asili kwa Kiswahili, huku tanbihi ikihifadhi istilahi nyingine inayotumiwa.
- source_word: πορεύσομαι
  choice: nitakwenda
  rationale: Wakati ujao unaonyesha kusudi la Paulo la kwenda kwa kundi jingine; ‘nitakwenda’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Tamko la kuwajibika katika ‘Damu yenu iwe juu ya vichwa vyenu wenyewe’
  choice: Nahau imehifadhiwa kama tamko kwamba wajibu wa matokeo ya kuukataa ujumbe uko juu yao, si juu ya Paulo.
  alternative: Kulielewa hasa kama laana kali inayotamkwa dhidi yao.
  rationale: Usemi huo una mwangwi wa lugha ya kibiblia kuhusu wajibu wa mlinzi na unatangaza kutokuwa na hatia kwa Paulo baada ya kutoa ushuhuda. Tafsiri hailainishi nahau wala kuifanya kwa lazima kuwa laana kali.
- issue: Yambwa lisilotajwa la βλασφημούντων
  choice: ‘kukufuru’ bila kuongeza ‘Paulo’ au ‘ujumbe wake’.
  alternative: ‘kumtukana’ au ‘kumkashifu Paulo’.
  rationale: Kigiriki hakitaji wazi yule au kile kinachokufuriwa. Tafsiri kuu inahifadhi hali hiyo badala ya kuamua iwapo maneno yalielekezwa kwa Paulo, ujumbe wake, au kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa tamko la Paulo umehifadhi uzito wake wa kinabii na kimahakama, huku tanbihi zikieleza nahau na utata wa kileksika bila kuingiza msimamo wa dhehebu.
