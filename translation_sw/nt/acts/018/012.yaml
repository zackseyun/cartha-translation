  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: sw
  text: Lakini Galio alipokuwa prokonsuli wa Akaya, Wayahudi[a] waliinuka kwa pamoja dhidi ya Paulo, wakamleta mbele ya kiti cha hukumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa neno “Wayahudi” linamaanisha kundi la Wayahudi wa mahali hapo lililochukua hatua dhidi ya Paulo, wala si Wayahudi wote kwa ujumla.
    reason: cultural_note
  - marker: b
    text: Au, “mbele ya baraza la hukumu.” Neno la Kigiriki linamaanisha kiti au jukwaa rasmi ambako mtawala alisikiliza na kuamua mashauri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Galio
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wa simulizi wenye utofauti mdogo, huku hali mpya ikianzisha upinzani dhidi ya Paulo.
- source_word: ἀνθυπάτου ὄντος
  choice: alipokuwa liwali
  rationale: Muundo huu unaweka wakati wa tukio; tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi maana ya cheo cha mtawala wa jimbo la Roma.
- source_word: Ἀχαΐας
  choice: Akaya
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la jimbo hilo la Roma.
- source_word: κατεπέστησαν
  choice: waliinuka ... dhidi ya
  rationale: Kitenzi kinaonyesha hatua ya uhasama dhidi ya Paulo bila kulazimisha wazo la shambulio la kimwili ambalo halijasemwa wazi.
- source_word: ὁμοθυμαδὸν
  choice: kwa pamoja
  rationale: Inaonyesha kwamba walitenda kwa umoja na kwa kusudi moja.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Inafuata maneno ya Kigiriki bila kuyawekea mipaka kuwa viongozi pekee; tanbihi inaeleza upeo wa kundi linalokusudiwa katika tukio hili.
- source_word: τῷ Παύλῳ
  choice: dhidi ya Paulo
  rationale: Katika muundo huu hali ya uhasama inayolengwa kwa Paulo huelezwa kwa kawaida kwa kihusishi “dhidi ya” katika Kiswahili.
- source_word: ἤγαγον αὐτὸν
  choice: wakamleta
  rationale: Inaonyesha kwamba walimpeleka Paulo kwenye mamlaka ya mahakama bila kuongeza wazo la kumburuta kwa nguvu.
- source_word: ἐπὶ τὸ βῆμα
  choice: mbele ya mahakama
  rationale: Katika muktadha huu neno linamaanisha mahali rasmi ambapo mtawala alisikiliza na kuamua mashauri; usemi huu unaeleweka kwa msomaji wa sasa, huku tanbihi ikihifadhi taswira halisi ya kiti cha hukumu.
theological_decisions:
- issue: Tafsiri ya οἱ Ἰουδαῖοι katika simulizi la mgogoro
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Kigiriki kinasema Wayahudi bila kuwataja viongozi pekee. Tanbihi inazuia kauli hiyo isieleweke kuwa lawama kwa Wayahudi wote kila mahali na kila wakati, huku maandishi yenyewe yakiwa hayajabanwa zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Liwali” limechaguliwa kwa cheo cha mtawala wa jimbo la Roma, na “mahakama” linaeleza kazi ya βῆμα kwa uwazi.
