  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: sw
  text: Na kwa kuwa alikuwa na ufundi uleule[a], alikaa kwao na alifanya kazi, kwa maana kazi yao ilikuwa kutengeneza mahema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “wafanyakazi wa ngozi”; neno la Kigiriki linaweza kumaanisha kwa upana zaidi watu waliotengeneza mahema au waliofanya kazi ya ufundi unaohusiana nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: kwa kuwa alikuwa na ufundi uleule
  rationale: Muundo wenye διά na kitenzi-jina unaonyesha sababu. ὁμότεχνος humaanisha kuwa na ufundi au kazi ya aina ileile; tafsiri hii inahifadhi uhusiano huo bila kutaja ufundi wenyewe kabla ya sehemu inayofuata.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: alikaa kwao
  rationale: μένω hapa ina maana ya kukaa au kuendelea kuishi pamoja nao. ‘Alikaa kwao’ ni Kiswahili cha kawaida na kinaonyesha kwamba Paulo aliishi nyumbani kwa Akila na Prisila.
- source_word: ἠργάζετο
  choice: na kufanya kazi
  rationale: ἐργάζομαι hapa inarejelea kufanya kazi ya ufundi. Muundo huu unaendana kwa kawaida na ‘alikaa’ na unawakilisha tendo lililoendelea katika simulizi.
- source_word: σκηνοποιοὶ
  choice: kutengeneza mahema
  rationale: Maana ya jadi na inayowezekana zaidi ya σκηνοποιός ni mtengenezaji wa mahema. Kiswahili cha kitenzi ‘kutengeneza mahema’ ni wazi na cha kawaida kuliko nomino nzito ya kiufundi.
- source_word: τῇ τέχνῃ
  choice: kazi yao ilikuwa
  rationale: τέχνη hutaja ufundi au kazi maalumu. Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba kutengeneza mahema ndiyo iliyokuwa kazi yao, si shughuli ya mara moja.
