base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: sw
  text: Ndipo wote wakamkamata Sosthene[a], mkuu wa sinagogi, wakawa wakimpiga mbele ya kiti cha hukumu. Lakini Galio hakujali mambo hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati husoma “Wagiriki wote” badala ya “wote” tu. Ushahidi wa awali una usomaji mfupi, ambao haujitaji utambulisho wa kundi hilo.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: wakamkamata
  rationale: Kitenzi hiki humaanisha kumshika mtu kwa nguvu; “wakamkamata” ni cha kawaida na kinafaa kwa tendo la uhasama linalofuatiwa na kipigo.
- source_word: πάντες
  choice: wote
  rationale: Huhifadhi maana ya ujumla bila kutaja utambulisho wa kundi, ambao haujaelezwa wazi katika matini ya Kiyunani.
- source_word: ἀρχισυνάγωγον
  choice: mkuu wa sinagogi
  rationale: Hueleza kwa uwazi ofisa mkuu aliyekuwa na jukumu la kuliongoza sinagogi.
- source_word: ἔτυπτον
  choice: wakawa wakimpiga
  rationale: Wakati usiotimilifu wa Kiyunani unaonyesha tendo lililokuwa likiendelea au kurudiwa; muundo huu wa Kiswahili unahifadhi hali hiyo.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: mbele ya kiti cha hukumu
  rationale: βῆμα hapa ni mahali rasmi pa hakimu kutoa hukumu; “kiti cha hukumu” ni usemi unaoeleweka katika mazingira ya kimahakama.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: hakujali hata kidogo mambo hayo
  rationale: Hutoa maana ya nahau kwamba mambo hayo hayakuwa na umuhimu wowote kwake, kwa Kiswahili cha asili na wazi.
- source_word: δέ
  choice: Ndipo
  rationale: Huonyesha mwendelezo wa simulizi na tukio linalofuata.
- source_word: καί
  choice: Lakini
  rationale: Ingawa kwa kawaida humaanisha “na,” hapa muktadha unaonyesha tofauti kati ya kipigo hicho na kutokujali kwa Galio.
theological_decisions:
- issue: Utambulisho wa πάντες (“wote”)
  choice: Utambulisho wa kundi umeachwa bila kutajwa katika matini kuu.
  alternative: Wayahudi wote; Wagiriki wote
  rationale: Matini ya SBLGNT inasema tu πάντες, bila nomino inayolitambulisha kundi. Kutaja Wayahudi au Wagiriki kungesuluhisha kimabavu jambo ambalo matini ya awali imelihifadhi bila ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “wakawa wakimpiga” umetumiwa kuonyesha tendo lililoendelea, huku utambulisho wa kundi ukiachwa wazi kama ulivyo katika matini ya Kiyunani.
