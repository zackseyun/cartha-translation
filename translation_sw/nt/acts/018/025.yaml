  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: sw
  text: Mtu huyu alikuwa amefundishwa njia ya Bwana. Akiwa mwenye bidii rohoni[a], alikuwa akizungumza na kufundisha kwa usahihi mambo yanayomhusu Yesu, huku akijua ubatizo wa Yohana tu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa mwenye bidii katika Roho,” ambapo “Roho” inaweza kueleweka kuwa Roho Mtakatifu badala ya roho ya ndani ya Apolo.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: alikuwa amefundishwa
  rationale: Muundo huu unaonyesha kwamba alikuwa amepokea mafundisho hapo awali na matokeo yake yaliendelea kuwapo; pia ni Kiswahili cha kawaida kisichoingiza maana ya baadaye ya kitaalamu ya kikanisa.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: njia ya Bwana
  rationale: Tafsiri hii inahifadhi msemo wa Kikristo wa awali kuhusu ‘njia’ na kutafsiri κύριος kwa ‘Bwana.’
- source_word: ζέων τῷ πνεύματι
  choice: akiwa na ari kubwa rohoni
  rationale: ‘Ari kubwa’ huwasilisha nguvu ya ζέων, yaani kuwaka au kuchemka kwa bidii. ‘Rohoni’ hudumisha uwezekano wa kumaanisha roho ya ndani ya Apolo bila kuondoa uwezekano wa kumaanisha Roho Mtakatifu.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: alikuwa akizungumza na kufundisha
  rationale: Vitenzi vya wakati usiotimilika vinaonyesha shughuli iliyoendelea au ya kawaida; ‘akizungumza na kufundisha’ ni ya moja kwa moja na ya asili.
- source_word: ἀκριβῶς
  choice: kwa usahihi
  rationale: Hapa neno linaonyesha kwamba mafundisho yake yalikuwa sahihi na makini, licha ya ukomo wa maarifa yake.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: mambo yanayomhusu Yesu
  rationale: Hii inadumisha upana wa kifungu cha Kigiriki bila kukibana kuwa ujumbe mmoja maalumu.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: huku akijua ubatizo wa Yohana tu
  rationale: ‘Huku akijua’ huakisi kirai tegemezi cha Kigiriki bila kulazimisha maana ya wazi ya upinzani; ‘tu’ huhifadhi μόνον.
theological_decisions:
- issue: Maana ya τῷ πνεύματι katika ζέων τῷ πνεύματι
  choice: roho ya ndani ya Apolo / ari ya ndani
  alternative: Roho Mtakatifu
  rationale: Kigiriki kinaweza kueleweka kuwa Apolo alikuwa na ari kubwa moyoni au alikuwa na ari kwa uwezo wa Roho Mtakatifu. Matini kuu haitatui utata huo kimabavu, na tanbihi inahifadhi usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya ‘Bwana’ ili iwe rahisi kusomeka bila kubadili uhusiano wa mawazo. Alama ya tanbihi imewekwa mara tu baada ya ‘rohoni,’ sehemu inayohusika na usomaji mbadala.
