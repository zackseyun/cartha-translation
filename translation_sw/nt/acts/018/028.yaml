  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: sw
  text: Kwa maana aliwakanusha Wayahudi kwa nguvu hadharani, akionyesha kwa Maandiko kwamba Yesu ndiye Masihi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba Masihi ni Yesu.” Kishazi cha Kigiriki kinaweza kuwakilishwa kwa mojawapo ya mipangilio hii miwili.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu neno hilo limetumiwa kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: kwa nguvu
  rationale: Huonyesha ukali na uwezo wa hoja za Apolo, si nguvu za mwili tu.
- source_word: διακατηλέγχετο
  choice: aliwakanusha
  rationale: Kitenzi hiki kinaeleza kupinga na kuthibitisha kwa hoja kwamba upande mwingine umekosea; umbo la wakati uliopita linaonyesha tendo lililoendelea katika muktadha.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Ni tafsiri ya moja kwa moja ya jina la kundi; katika muktadha huu ni Wayahudi waliokuwa wakijadiliana naye.
- source_word: δημοσίᾳ
  choice: hadharani
  rationale: Kielezi cha kawaida cha Kiswahili kinachoonyesha kwamba mjadala ulifanyika mbele ya watu.
- source_word: ἐπιδεικνὺς
  choice: akionyesha
  rationale: Huonyesha kwamba Apolo aliweka ushahidi wazi kwa njia ya hoja, bila kuzidisha dai kuwa aliwalazimisha wakubali.
- source_word: διὰ τῶν γραφῶν
  choice: kwa Maandiko
  rationale: Huhifadhi maana ya Maandiko kuwa njia au ushahidi aliotumia.
- source_word: τὸν χριστὸν
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha yule aliyetiwa mafuta na kuahidiwa katika Maandiko, si sehemu ya jina binafsi.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: kwamba Yesu ndiye Masihi
  rationale: Mpangilio huu ni wa asili katika Kiswahili huku ukihifadhi dai la kumtambua Yesu kuwa Masihi; mpangilio mwingine unaowezekana umewekwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Hoja ya Apolo inahusu kumtambulisha Yesu kuwa yule aliyetiwa mafuta aliyeahidiwa katika Maandiko; ‘Masihi’ huonyesha wazi matumizi ya neno hili kama cheo.
- issue: Uhusiano wa Yesu na Masihi katika kishazi cha kiarifu
  choice: Yesu ndiye Masihi
  alternative: Masihi ni Yesu
  rationale: Sarufi ya Kigiriki inaruhusu uwakilishaji wa aina zote mbili; maandishi makuu yanatumia mpangilio wa kawaida zaidi wa Kiswahili, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kawaida kwa wasomaji wengi; ‘Maandiko’ limeandikwa kwa herufi kubwa kwa kuwa linarejelea maandiko matakatifu kama mkusanyo.
