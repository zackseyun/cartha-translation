  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: sw
  text: Lakini Krispo, kiongozi wa sinagogi, alimwamini Bwana pamoja na watu wote wa nyumbani mwake. Na Wakorintho wengi, waliposikia, walikuwa wakiamini na wakibatizwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa Kiswahili cha kawaida zaidi, “Wakorintho wengi waliposikia, waliamini na wakabatizwa.” Kigiriki kinatumia maumbo yanayoonyesha mwitikio huo ukiendelea kutokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρίσπος
  choice: Krispo
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: ἀρχισυνάγωγος
  choice: kiongozi wa sinagogi
  rationale: Hutaja afisa mkuu wa sinagogi bila kuongeza maelezo yasiyokuwamo kuhusu majukumu yake.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: alimwamini Bwana
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unaonyesha tendo la Krispo la kumwamini Bwana; jina la cheo κύριος limehifadhiwa bila kulipanua kuwa ‘Bwana Yesu.’
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: pamoja na wote wa nyumbani mwake
  rationale: Huwasilisha maana ya jamaa nzima ya nyumbani badala ya jengo la nyumba, huku ukihifadhi wazo la ushiriki wa wote.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: Wakorintho wengi
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba watu wengi miongoni mwa Wakorintho waliitikia.
- source_word: ἀκούοντες
  choice: waliposikia
  rationale: Huwasilisha kwa Kiswahili cha kawaida kwamba kusikia kulihusiana na kuitikia kwao, huku jambo walilosikia likiachwa bila kutajwa kama lilivyo katika Kigiriki.
- source_word: ἐπίστευον
  choice: walikuwa wakiamini
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha mwitikio uliokuwa ukiendelea au kujirudia miongoni mwa Wakorintho wengi.
- source_word: ἐβαπτίζοντο
  choice: walikuwa wakibatizwa
  rationale: Huhifadhi hali ya kutendwa na pia mwonekano wa tendo lililokuwa likiendelea au kujirudia.
theological_decisions:
- issue: Upeo wa imani ya watu wa nyumbani mwa Krispo
  choice: Kauli imetafsiriwa moja kwa moja kuwa Krispo alimwamini Bwana pamoja na wote wa nyumbani mwake, bila kueleza namna kila mmoja alivyoshiriki.
  alternative: Kusema wazi kwamba kila mtu binafsi aliamini, au kwamba nyumba ilihesabiwa kwa ujumla bila imani binafsi ya kila mshiriki.
  rationale: Kigiriki hakifafanui utaratibu wa ushiriki wa watu wa nyumbani; tafsiri haipaswi kuamua mjadala wa kimadhehebu kuhusu imani au ubatizo wa nyumba nzima.
- issue: Anayerejelewa kwa jina ‘Bwana’
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Muktadha wa Matendo unaelekeza kwa Yesu, lakini maandishi ya Kigiriki hapa yana κύριος pekee; hivyo jina la cheo limehifadhiwa bila ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘walikuwa wakiamini na wakibatizwa’ umehifadhi mwonekano wa matendo yaliyokuwa yakiendelea au kujirudia, ingawa tanbihi inatoa usemi mwepesi zaidi.
