  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: sw
  text: Lakini Paulo alipokuwa karibu kufungua kinywa chake[a], Galio akawaambia Wayahudi, “Kama jambo hili lingekuwa kosa fulani au uhalifu mbaya[b], enyi Wayahudi, ningekuwa na sababu ya kuwavumilia[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alipokuwa karibu kusema.” Kigiriki kinasema kihalisi “kufungua kinywa,” nahau inayomaanisha kuanza kusema.
    reason: lexical_alternative
  - marker: b
    text: Au “kitendo kiovu cha kihalifu.” Kirai cha Kigiriki huunganisha neno linalomaanisha mwenendo wa kihalifu na kivumishi kinachomaanisha “mbaya” au “ovu.”
    reason: lexical_alternative
  - marker: c
    text: Au “ningewastahimili kwa sababu nzuri.” Usemi huu unamaanisha kwamba Gallio angekuwa na sababu halali ya kuwavumilia ikiwa shtaka lingehusu kosa au uhalifu wa kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: Paulo alipokuwa karibu kufungua kinywa chake
  rationale: Muundo wa μέλλω pamoja na kitenzi-jina huonyesha jambo lililokuwa karibu kutokea. ‘Kufungua kinywa chake’ huhifadhi nahau ya Kigiriki na inaeleweka katika Kiswahili; tanbihi inaeleza maana yake ya kuanza kusema.
- source_word: δὲ
  choice: Lakini
  rationale: 'Hapa δέ huleta mpito wenye utofautishaji mdogo: Paulo alikuwa karibu kujibu, lakini Galio akasema kwanza.'
- source_word: Γαλλίων
  choice: Galio
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: akawaambia Wayahudi
  rationale: Muundo huu unaonyesha wale walioelekezewa maneno. ‘Wayahudi’ huhifadhi upana wa Kigiriki bila kuongeza neno la kufasiri kama ‘washtaki’.
- source_word: Εἰ μὲν ἦν
  choice: Kama jambo hili lingekuwa
  rationale: Huwasilisha sharti la hali isiyo halisi kwa Kiswahili cha kawaida; ‘jambo hili’ hurejelea shtaka lililokuwa mbele ya Galio bila kulibainisha zaidi.
- source_word: ἀδίκημά τι
  choice: kosa fulani
  rationale: ἀδίκημα ni tendo lisilo la haki au kosa linaloweza kuleta madai ya kisheria. ‘Kosa fulani’ ni pana na halibainishi aina ya kosa kupita chanzo.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: uhalifu mbaya
  rationale: Kirai hiki huunganisha wazo la kitendo cha kihalifu na sifa ya uovu. ‘Uhalifu mbaya’ huhifadhi uzito wa kisheria na wa kimaadili bila kutumia lugha ya kizamani.
- source_word: ὦ Ἰουδαῖοι
  choice: enyi Wayahudi
  rationale: ‘Enyi’ huwakilisha chembe ya mwito ὦ kwa lugha ya heshima na ya kawaida katika maandishi ya Kiswahili.
- source_word: κατὰ λόγον
  choice: ningekuwa na sababu
  rationale: Nahau hii humaanisha ‘kwa sababu nzuri’ au ‘kwa haki.’ Muundo huu unaunganika kwa kawaida na utayari wa Galio kusikiliza shtaka.
- source_word: ἀνεσχόμην ὑμῶν
  choice: kuwasikiliza kwa uvumilivu
  rationale: Kitenzi kinaweza kumaanisha kuvumilia au kustahimili. Katika mazingira ya mahakama, wazo ni kwamba Galio angevumilia kuwasikiliza; tafsiri hii ni wazi kwa Kiswahili huku tanbihi ikihifadhi mbadala ulio karibu zaidi na umbo la chanzo.
