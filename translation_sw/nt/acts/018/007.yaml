base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: sw
  text: Kisha akaondoka hapo, akaingia katika nyumba ya mtu mmoja aliyeitwa Tito Yusto, aliyemwabudu Mungu[a]. Nyumba yake ilipakana na sinagogi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyemcha Mungu” au “mwenye kumwabudu Mungu.” Usemi huu unaweza kumweleza mtu aliyejitoa kwa Mungu wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “ilikuwa ikiambatana na” au “ilishiriki mpaka na” sinagogi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: akaondoka hapo
  rationale: Muundo huu wa kisimulizi unaonyesha kuondoka mahali palipotajwa kabla ya tendo kuu linalofuata, kwa Kiswahili cha kawaida na wazi.
- source_word: εἰσῆλθεν εἰς οἰκίαν
  choice: akaingia katika nyumba
  rationale: Huwasilisha moja kwa moja mwendo wa kuingia ndani ya nyumba, huku ukidumisha mfuatano wa matendo.
- source_word: τινὸς ὀνόματι Τιτίου Ἰούστου
  choice: ya mtu mmoja aliyeitwa Titio Yusto
  rationale: “Mtu mmoja” huonyesha hali ya kutotajwa hapo awali bila uzito usio wa lazima; majina yametoholewa kwa matamshi ya Kiswahili huku Titio akitofautishwa na Tito.
- source_word: σεβομένου τὸν θεόν
  choice: aliyemwabudu Mungu
  rationale: Kitenzi σέβομαι hapa kinaeleza kujitoa kwake kwa Mungu wa Israeli. “Aliyemwabudu Mungu” ni wazi na hakilazimishi lebo maalumu ya kijamii na kidini.
- source_word: συνομοροῦσα τῇ συναγωγῇ
  choice: ilipakana na sinagogi
  rationale: συνομορέω huonyesha kuwa majengo yaligusana au yalishiriki mpaka. “Ilipakana na” huhifadhi maana hiyo kwa usahihi zaidi kuliko kusema tu yalikuwa karibu.
theological_decisions:
- issue: Maelezo ya Titio Yusto kama σεβόμενος τὸν θεόν
  choice: aliyemwabudu Mungu
  alternative: aliyemcha Mungu
  rationale: Tafsiri elezi inaonyesha ibada yake kwa Mungu bila kumfanya moja kwa moja kuwa mshiriki wa kundi maalumu la kijamii na kidini ambalo halitajwi wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya Kigiriki imegawanywa mara mbili ili kuepuka mfululizo mzito wa vishazi vya urejeshi, bila kubadili uhusiano wa nyumba hiyo na Titio Yusto.
