translation:
  language: sw
  text: Kisha akawafukuza kutoka kwenye kiti cha hukumu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baraza la hukumu” au “jukwaa la hakimu”; neno la Kigiriki βῆμα linamaanisha kiti rasmi cha hakimu au jukwaa la mahakama.
