lexical_decisions:
- source_word: καὶ
  choice: Kisha
  rationale: Katika mfululizo huu wa simulizi, καί inaendeleza tukio linalofuata; “Kisha” ni ya asili katika Kiswahili na haiongezi uhusiano wa kisababu.
- source_word: ἀπήλασεν
  choice: akawafukuza
  rationale: Kitenzi hiki kinaonyesha kuwaondoa kwa mamlaka na kwa nguvu, si kuwaaga au kuwaachilia tu.
- source_word: αὐτοὺς
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” kinarejelea watu waliotajwa katika muktadha bila kuwabainisha kupita kiasi.
- source_word: ἀπὸ τοῦ βήματος
  choice: kutoka kwenye kiti cha hukumu
  rationale: Kirai hiki kinaonyesha kuondolewa katika eneo rasmi la kusikilizia kesi; “kiti cha hukumu” kinahifadhi taswira ya kiti au jukwaa rasmi la hakimu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. “Akawafukuza” huhifadhi ukali wa tendo la mamlaka, na tanbihi hufafanua maana ya kimahakama ya βῆμα.
