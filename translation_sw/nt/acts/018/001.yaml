  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “aliondoka … akaenda” ni wa kawaida katika simulizi na huhifadhi mfuatano wa matendo. Majina ya jadi ya kibiblia “Athene” na “Korintho” yametumiwa.
