  text: ⸀Μετὰ ταῦτα ⸀χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/001.yaml
  text: After this[a], he left Athens and went to Corinth.
translation:
  language: sw
  text: Baada ya hayo[a], aliondoka Athene akaenda Korintho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Baada ya mambo hayo, akiwa ameondoka kutoka Athene, alifika Korintho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha kawaida cha wakati katika simulizi; kinaonyesha kwamba tukio hili lilifuata mambo yaliyotangulia huku kikibaki cha asili katika Kiswahili.
- source_word: χωρισθεὶς
  choice: aliondoka
  rationale: Ingawa ni kauli ya kushiriki ya wakati uliopita katika umbo la kutendwa, hapa χωρίζω hutumiwa kwa maana ya kuondoka mahali; “aliondoka” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kulazimisha umbo lisilo la asili.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: Athene
  rationale: 'ἐκ huonyesha mahali alikotoka. Pamoja na kitenzi “aliondoka,” jina la mahali hutumika moja kwa moja kwa njia ya kawaida katika Kiswahili: “aliondoka Athene.”'
- source_word: ἦλθεν
  choice: akaenda
  rationale: Kitenzi ἔρχομαι kinaweza kumaanisha kuja, lakini simulizi linafuata mwendo kutoka Athene kwenda mji mwingine; “akaenda” ni ya asili kwa mtazamo huu na kiambishi -ka- kinaendeleza mfuatano wa matukio.
- source_word: εἰς Κόρινθον
  choice: Korintho
  rationale: 'εἰς huonyesha mwendo kuelekea au kuingia mahali. Pamoja na “akaenda,” Kiswahili sanifu hutaja mahali moja kwa moja: “akaenda Korintho.”'
theological_decisions: []
