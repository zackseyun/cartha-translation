source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: sw
  text: Akamkuta Myahudi mmoja aitwaye Akila, mwenye asili ya Ponto, ambaye alikuwa amewasili hivi karibuni kutoka Italia pamoja na mke wake Prisila, kwa sababu Klaudio alikuwa ameamuru Wayahudi wote waondoke Roma[a]. Kisha Paulo akaenda kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafukuzwe kutoka Roma.” Kigiriki kinasema kwa maana ya karibu zaidi kwamba watenganishwe na Roma; matini kuu imetumia usemi wa kawaida “waondoke Roma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: akamkuta
  rationale: Kitenzi kishirikishi cha aoristi kinaanzisha tendo linalotangulia tendo kuu; “akamkuta” ni cha kawaida katika simulizi na huhifadhi maana ya kupata au kukutana naye.
- source_word: τινα Ἰουδαῖον
  choice: Myahudi mmoja
  rationale: Huwasilisha mtu mmoja asiyeainishwa zaidi kwa utambulisho wake wa Kiyahudi kwa Kiswahili cha kawaida.
- source_word: ὀνόματι Ἀκύλαν
  choice: aitwaye Akila
  rationale: Ni usemi wa asili wa Kiswahili wa kumtambulisha mtu kwa jina.
- source_word: Ποντικὸν τῷ γένει
  choice: mwenyeji wa Ponto
  rationale: Kirai kinaonyesha asili ya kijiografia; “mwenyeji wa Ponto” kinaeleweka kwa urahisi bila kudai kwa nguvu kwamba alizaliwa huko.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: ambaye alikuwa amewasili hivi karibuni kutoka Italia
  rationale: Huhifadhi tendo lililotokea kabla ya Paulo kumkuta pamoja na athari yake ya wakati huo; “amewasili” linafaa zaidi kwa safari kuliko tafsiri halisi isiyo laini.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: pamoja na mke wake Prisila
  rationale: “Pamoja na” huonyesha kwa kawaida kwamba Prisila aliandamana na Akila kutoka Italia.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: kwa sababu Klaudio alikuwa ameamuru
  rationale: διά pamoja na infinitivi yenye kibainishi huonyesha sababu, na διατάσσω hapa ni amri rasmi ya mtawala.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: Wayahudi wote waondoke Roma
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kutenganishwa na Roma bila kuongeza wazi nguvu ya “kufukuzwa,” ambayo ni tafsiri pana zaidi ya amri hiyo.
- source_word: προσῆλθεν αὐτοῖς
  choice: Paulo akaenda kwao
  rationale: Kitenzi humaanisha kwenda au kuwakaribia watu. Kutaja Paulo huondoa utata wa kiwakilishi katika Kiswahili kwa kutumia mhusika anayejulikana kutoka muktadha.
theological_decisions:
- issue: Maana ya Ἰουδαῖον / Ἰουδαίους
  choice: Myahudi / Wayahudi
  alternative: Mtu wa Yudea / watu wa Yudea
  rationale: Katika muktadha huu maneno yanawahusu watu wa Kiyahudi waliokuwa Roma, si wakazi wa eneo la Yudea pekee.
- issue: Nguvu ya amri katika χωρίζεσθαι ἀπὸ τῆς Ῥώμης
  choice: waondoke Roma
  alternative: wafukuzwe kutoka Roma
  rationale: Kigiriki kinasema kihalisi kutenganishwa au kuondoka kutoka Roma; matini kuu hailazimishi tafsiri yenye nguvu zaidi ya kufukuzwa, lakini uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Mpangilio wa simulizi umefanywa wa asili kwa Kiswahili, huku uhusiano wa matendo, sababu ya kuondoka Italia, na uwezekano wa maana ya χωρίζεσθαι vikihifadhiwa.
