  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: sw
  text: Baada ya kushuka mpaka Kaisaria, alipanda na kulisalimu kanisa[a], kisha akashuka kwenda Antiokia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, huenda ni kanisa la Yerusalemu. Tafsiri nyingi hutaja Yerusalemu wazi hapa, lakini jina hilo halimo katika matini ya Kigiriki.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: Baada ya kushuka
  rationale: Huwasilisha tendo lililotangulia tendo kuu na kuhifadhi lugha ya mwelekeo wa safari ya Luka.
- source_word: Καισάρειαν
  choice: Kaisaria
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili; muktadha unaonyesha Kaisaria ya pwani.
- source_word: ἀναβὰς
  choice: alipanda
  rationale: Huhifadhi maana ya mwelekeo bila kuongeza Yerusalemu, ambayo haitajwi wazi katika Kigiriki.
- source_word: ἀσπασάμενος
  choice: akalisalimu
  rationale: Kitenzi hiki humaanisha kusalimu; uchaguzi huu ni wa moja kwa moja na wa kawaida katika simulizi.
- source_word: τὴν ἐκκλησίαν
  choice: kanisa
  rationale: Ni neno la kawaida la Kiswahili kwa jumuiya ya waumini katika muktadha huu wa Matendo.
- source_word: κατέβη
  choice: akashuka kwenda
  rationale: Huhifadhi mwelekeo wa kushuka na wakati huohuo kufanya marudio ya safari yaeleweke kwa Kiswahili cha kawaida.
- source_word: Ἀντιόχειαν
  choice: Antiokia
  rationale: Ni umbo la kawaida la Kiswahili la jina hili; hapa muktadha unaelekeza Antiokia ya Siria.
theological_decisions:
- issue: Kama mahali palipodokezwa na neno “alipanda” patambulishwe kuwa Yerusalemu
  choice: Mahali hapo hapawekwi wazi katika matini kuu
  alternative: Kutafsiri “alipanda kwenda Yerusalemu”
  rationale: Mfululizo wa safari unaashiria kwa nguvu kwamba Paulo alipanda Yerusalemu na kulisalimu kanisa la huko, lakini matini ya Kigiriki hailitaji jina Yerusalemu. Tafsiri inadumisha udokezo huo bila kulifanya jambo lililotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi huhifadhi mfululizo wa mielekeo ya safari—kushuka, kupanda, kisha kushuka—bila kuongeza mahali pasipotajwa wazi.
