  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: sw
  text: wakisema, “Mtu huyu anawashawishi watu wamwabudu Mungu kinyume cha sheria[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhidi ya sheria” au “kwa kukiuka sheria.”
    reason: lexical_alternative
  - marker: b
    text: Huenda washtaki wanamaanisha sheria ya Wayahudi, ingawa Kigiriki kinasema tu “sheria.”
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: wakisema, “...”
  rationale: Kirai cha wakati uliopo kinaanzisha yaliyomo katika shtaka; usemi wa moja kwa moja ni wa kawaida na wazi katika Kiswahili.
- source_word: Παρὰ τὸν νόμον
  choice: kinyume cha sheria
  rationale: παρά pamoja na hali ya kushutumiwa hapa huonyesha kwenda kinyume au kukiuka; kirai hiki kinadumisha uzito wa kisheria bila kubainisha sheria ambayo Kigiriki hakuitaji wazi.
- source_word: ἀναπείθει
  choice: anawashawishi
  rationale: Kitenzi kina maana ya kuwavuta au kuwafanya watu wakubali jambo. 'Anawashawishi' huhifadhi maana hiyo bila kuingiza wazo lenye nguvu zaidi la kuwapotosha.
- source_word: οὗτος
  choice: Mtu huyu
  rationale: Huonyesha mtu anayelengwa moja kwa moja katika shtaka bila kutumia lugha ya dharau isiyolazimishwa na matini.
- source_word: τοὺς ἀνθρώπους
  choice: watu
  rationale: Nomino hii hapa inawahusu wanadamu kwa ujumla, si wanaume pekee.
- source_word: σέβεσθαι τὸν θεόν
  choice: wamwabudu Mungu
  rationale: Katika muktadha huu σέβομαι hueleza ibada au uchaji wa kidini; 'kumwabudu Mungu' ni usemi wazi na wa kawaida wa Kiswahili.
- source_word: τὸν νόμον
  choice: sheria
  rationale: Matini ya Kigiriki husema tu 'sheria'; haiongezi 'ya Wayahudi' wala 'yetu,' hivyo tafsiri inabaki na usemi usiobainishwa.
theological_decisions:
- issue: Sheria inayorejelewa katika shtaka
  choice: Kubaki na neno lisilobainishwa 'sheria' katika matini kuu.
  alternative: '''sheria ya Wayahudi'' au ''sheria yetu'''
  rationale: Katika muktadha, washtaki huenda wanamaanisha sheria ya Wayahudi, lakini Kigiriki hakisemi hivyo wazi. Tanbihi inatoa ufafanuzi huo bila kuuingiza katika matini.
- issue: Maana ya ἀνθρώπους
  choice: watu
  alternative: wanaume
  rationale: Wingi huu ni wa kijumla na unawahusu watu bila kujali jinsia; 'watu' huwasilisha maana hiyo kwa usahihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mpangilio wa alama [a][b] umewekwa mara tu baada ya kishazi kinachoanzisha shtaka; kila alama ina tanbihi inayolingana.
