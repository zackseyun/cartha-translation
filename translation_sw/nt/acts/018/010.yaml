  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: sw
  text: kwa maana mimi niko pamoja nawe, wala hakuna mtu atakayekushambulia[a] ili kukudhuru, kwa maana nina watu wengi katika mji huu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hakuna mtu atakayekuvamia ili kukudhuru.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “nina watu wengi katika mji huu” yaelekea kumaanisha watu wengi huko Korintho walio wa Bwana, wakiwemo wale ambao bado wataamini.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: kwa maana
  rationale: Inaonyesha sababu ya agizo lililotangulia na, katika matumizi ya pili, sababu ya ahadi ya ulinzi; ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: mimi niko pamoja nawe
  rationale: Kiwakilishi cha wazi ἐγώ kina mkazo; “mimi” kinauhifadhi kwa njia ya kawaida, huku “niko pamoja nawe” kikitoa hakikisho la uwepo.
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Ni tafsiri ya kawaida ya kiima hasi isiyomtaja mtu mahususi.
- source_word: ἐπιθήσεταί σοι
  choice: atakayekushambulia
  rationale: Katika muktadha huu kitenzi kinaonyesha tendo la uhasama dhidi ya Paulo. “Kukushambulia” ni wazi na cha kawaida bila kulazimisha kwamba ni kushikwa kwa mkono tu.
- source_word: τοῦ κακῶσαί σε
  choice: ili kukudhuru
  rationale: Muundo wa infinitivu unaonyesha kusudi au matokeo ya shambulio; “kukudhuru” huhifadhi upana wa madhara yanayokusudiwa.
- source_word: λαός
  choice: watu
  rationale: Hapa linarejelea kwa pamoja watu walio wa msemaji; “watu wengi” ni usemi wa asili katika Kiswahili.
- source_word: ἐστί μοι
  choice: nina
  rationale: Dativu pamoja na kitenzi ‘kuwa’ huonyesha umilikaji; Kiswahili huueleza kiasili kwa “nina.”
- source_word: πολὺς
  choice: wengi
  rationale: Huhifadhi moja kwa moja wingi wa idadi unaoelezwa.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: katika mji huu
  rationale: “Mji” linafaa kwa kituo cha mjini kama Korintho, na “huu” huhifadhi kiashiria ταύτῃ.
theological_decisions:
- issue: Maana ya “watu wengi” katika mji
  choice: Maneno ya msingi yanabaki “nina watu wengi katika mji huu,” bila kufafanua ndani ya mstari ikiwa wote tayari wanaamini au baadhi yao wataamini baadaye.
  alternative: Kuyatafsiri wazi kuwa ni watu wengi ambao tayari wanampendelea Paulo au waumini watarajiwa pekee.
  rationale: Kauli inaweza kuonyesha watu wa Korintho walio wa Bwana, wakiwemo ambao bado wataamini; tafsiri inahifadhi mvutano huo wa kiteolojia badala ya kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Pamoja nawe” na “wala” hudumisha sauti ya maandiko bila kuwa ya kizamani kupita kiasi; alama zote za tanbihi zimewekwa katika matini kuu.
