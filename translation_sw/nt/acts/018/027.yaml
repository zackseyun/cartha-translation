  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: sw
  text: Naye alipotaka kuvuka kwenda Akaya, ndugu walimtia moyo, wakawaandikia wanafunzi ili wamkaribishe. Alipofika, aliwasaidia sana wale waliokwisha kuamini kwa neema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa neema aliwasaidia sana wale waliokwisha kuamini.” Katika Kigiriki, maneno “kwa neema” yanaweza kueleza jinsi Apolo alivyowasaidia badala ya jinsi watu hao walivyokuwa wameamini.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου ... αὐτοῦ
  choice: alipotaka
  rationale: Muundo huu unaonyesha hali inayohusu nia ya Apolo; “alipotaka” ni Kiswahili cha kawaida na huhifadhi wazo la hiari yake.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: kuvuka kwenda Akaya
  rationale: Kitenzi kinaweza kudokeza kuvuka kutoka Efeso kuelekea eneo la Akaya; “kuvuka kwenda” huhifadhi maana hiyo ya safari bila kuwa nzito.
- source_word: προτρεψάμενοι
  choice: walimtia moyo
  rationale: Katika muktadha huu neno linaonyesha himizo la kumuunga mkono; “walimtia moyo” ni la asili na chanya.
- source_word: οἱ ἀδελφοὶ
  choice: ndugu
  rationale: “Ndugu” huhifadhi istilahi ya kifamilia ya jumuiya ya waamini na katika Kiswahili inaweza kujumuisha wanaume na wanawake bila kuongeza maneno yasiyo wazi katika Kigiriki.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: wakawaandikia wanafunzi
  rationale: Huu ni uwasilishaji wa moja kwa moja wa kitendo cha kuwaandikia wanafunzi, huku mtiririko wa matukio ukionyeshwa kwa “waka-”.
- source_word: ἀποδέξασθαι αὐτόν
  choice: ili wamkaribishe
  rationale: Neno linamaanisha kumpokea Apolo kwa moyo mzuri; “wamkaribishe” huwasilisha vizuri maana ya ukarimu.
- source_word: ὃς παραγενόμενος
  choice: Alipofika
  rationale: Usemi huu unamrejelea Apolo na kuanzisha kitendo kilichofuata baada ya kuwasili kwake.
- source_word: συνεβάλετο πολὺ
  choice: aliwasaidia sana
  rationale: Katika muktadha huu kitenzi cha kati kina maana ya kutoa msaada mkubwa; “aliwasaidia sana” ni wazi na ya kawaida.
- source_word: τοῖς πεπιστευκόσιν
  choice: wale waliokuwa wameamini
  rationale: Muundo wa hali timilifu unaonyesha kwamba walikuwa tayari wamefikia hali ya kuamini kabla ya msaada wa Apolo.
- source_word: διὰ τῆς χάριτος
  choice: kwa njia ya neema
  rationale: Usemi huu huhifadhi maana ya neema kuwa njia au msingi, bila kuongeza wazi “ya Mungu,” ambayo haipo katika matini.
theological_decisions:
- issue: Kihusishi cha διὰ τῆς χάριτος kinahusiana na sehemu ipi ya sentensi
  choice: 'Kinahusishwa na kuamini kwao: “waliokuwa wameamini kwa njia ya neema.”'
  alternative: 'Kinaweza kuhusishwa na msaada wa Apolo: “kwa njia ya neema aliwasaidia sana wale waliokuwa wameamini.”'
  rationale: Mpangilio wa Kigiriki na muktadha vinaunga mkono zaidi kukihusisha na kuamini kwao, lakini uwezekano wa kukihusisha na msaada wa Apolo ni halisi; kwa hiyo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Jina la eneo limetolewa kama “Akaya.” Neno “ndugu” limetumiwa kwa jumuiya ya waamini na linaweza kuwajumuisha wanawake kulingana na matumizi ya kawaida ya Kiswahili.
