base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: sw
  text: Basi, akakaa huko mwaka mmoja na miezi sita, akifundisha neno la Mungu miongoni mwao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: akakaa huko
  rationale: Ingawa kitenzi hiki kwa maana ya msingi ni ‘aliketi,’ katika muktadha huu kinamaanisha kubaki au kukaa mahali kwa muda. ‘Akakaa huko’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo ya kimuktadha.
- source_word: δὲ
  choice: Basi
  rationale: Kiunganishi hiki ni cha mpito usio mkali. ‘Basi’ kinaunganisha hatua hii na ahadi ya Bwana katika mstari uliotangulia bila kuingiza utofautishaji usiokuwapo.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: mwaka mmoja na miezi sita
  rationale: Huu ni usemi wa muda unaodumu, na tafsiri hii ni wazi na ya kawaida katika Kiswahili cha kisasa.
- source_word: διδάσκων
  choice: akifundisha
  rationale: Umbo la wakati uliopo la kitenzi-shirikishi linaonyesha tendo lililoendelea wakati wa kukaa kwake; ‘akifundisha’ linahifadhi uhusiano huo wa wakati.
- source_word: ἐν αὐτοῖς
  choice: miongoni mwao
  rationale: Kirai hiki kina maana ya mahali au ushirika wa kijamii. ‘Miongoni mwao’ kinaonyesha kwamba Paulo alifundisha akiwa ndani ya jumuiya hiyo.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Katika Matendo, λόγος mara nyingi humaanisha ujumbe unaotoka kwa Mungu. ‘Neno la Mungu’ huhifadhi usemi wa kibiblia uliozoeleka na pia unaeleweka kwa wasomaji wa sasa.
theological_decisions: []
