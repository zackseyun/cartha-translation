  register: Kiswahili Sanifu cha Afrika Mashariki, cha asili, chenye heshima na kinachoeleweka kwa urahisi. Muundo ‘akakaa ... akifundisha’ unaendeleza mtiririko wa kisimulizi na hali ya tendo lililoendelea.
