source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: sw
  text: Baada ya Paulo kukaa huko siku nyingine nyingi, aliwaaga ndugu[a] na kusafiri kwa meli kuelekea Siria; Priskila na Akila walikuwa pamoja naye. Huko Kenkrea alikata nywele zake[b][c], kwa maana alikuwa na nadhiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa yaelekea kumaanisha jumuiya ya waamini, wakiwemo wanawake na wanaume.
    reason: lexical_alternative
  - marker: b
    text: Au, “alinyoa kichwa.” Kitenzi cha Kigiriki kinaweza kumaanisha kukata au kupunguza nywele, si lazima kuzinyoa kabisa. Baadhi pia huchukulia kuwa aliyekata nywele alikuwa Akila, ingawa sarufi inaelekea zaidi kwa Paulo.
    reason: lexical_and_alternative_reading
  - marker: c
    text: Andiko linasema tu “nadhiri”; halibainishi kwamba ilikuwa nadhiri ya Mnadhiri.
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: kukaa huko siku nyingine nyingi
  rationale: Kirai kinaonyesha Paulo aliendelea kukaa kwa muda mrefu zaidi kabla ya kuondoka; “huko” hutokana na muktadha na kufanya Kiswahili kiwe cha kawaida.
- source_word: τοῖς ἀδελφοῖς
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa jumuiya ya waamini na linaweza kutumiwa kwa kundi linalojumuisha wanaume na wanawake.
- source_word: ἀποταξάμενος
  choice: aliwaaga
  rationale: Kitenzi cha kati hapa humaanisha kuagana au kuomba ruhusa ya kuondoka; “aliwaaga” ni sahihi na ya asili.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: kusafiri kwa meli kuelekea Siria
  rationale: Huhifadhi wazo la kuondoka kwa meli na kutaja Siria kama mahali alikokusudia kwenda.
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: Priskila na Akila walikuwa pamoja naye
  rationale: Huhifadhi muundo wa kishazi na kuwaonyesha wazi kuwa walikuwa waandamani wa Paulo.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: alinyoa nywele za kichwa
  rationale: κείρω inaweza kumaanisha kukata, kunyoa, au kupunguza nywele. Uhusiano na “kichwa” na nadhiri unaunga mkono “kunyoa,” huku tanbihi ikihifadhi upana wa maana.
- source_word: ἐν Κεγχρεαῖς
  choice: Huko Kenkrea
  rationale: “Kenkrea” ni uhawilishaji unaosomeka kwa Kiswahili wa jina la mahali Κεγχρεαί.
- source_word: εἶχεν γὰρ εὐχήν
  choice: kwa maana alikuwa ameweka nadhiri
  rationale: Hutoa kwa Kiswahili cha kawaida hali inayodokezwa na nahau ya Kigiriki bila kubainisha aina ya nadhiri.
theological_decisions:
- issue: Mhusika wa κειράμενος (“aliyekata/kunyoa”)
  choice: Kitendo kinamhusu Paulo.
  alternative: Baadhi huchukulia kuwa kitendo kinamhusu Akila.
  rationale: Kisarufi, nomino-tendo ya kiume umoja inaelekea kwa kawaida kwa Paulo, mhusika mkuu wa sentensi. Hata hivyo, mtazamo unaomhusisha Akila umehifadhiwa katika tanbihi.
- issue: Aina ya εὐχή
  choice: “nadhiri” bila kuainisha zaidi
  alternative: nadhiri ya Mnadhiri
  rationale: Andiko linasema tu kwamba kulikuwa na nadhiri; halitaji wazi kuwa ilikuwa nadhiri ya Mnadhiri.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa kwa alama ya nusu koloni ili kudumisha mtiririko wa Kigiriki bila kuwa nzito. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Paulo, Priskila, Akila, Siria, na Kenkrea.'
