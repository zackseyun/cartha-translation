id: ACT.18.26
reference: Acts 18:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: sw
  text: Naye akaanza kusema kwa ujasiri katika sinagogi. Lakini Prisila na Akila walipomsikia, walimchukua kando[a] na kumweleza kwa usahihi zaidi njia ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walimchukua pamoja nao” au “walimkaribisha.” Kitenzi cha Kigiriki kinaweza kumaanisha kumpokea mtu na pia kumchukua kando.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε
  choice: Naye
  rationale: Kiwakilishi kinamrejelea Apolo katika muktadha uliotangulia, na -ye pamoja na kiunganishi huonyesha mwendelezo wa simulizi kwa Kiswahili cha asili.
- source_word: ἤρξατο παρρησιάζεσθαι
  choice: akaanza kusema kwa ujasiri
  rationale: Huhifadhi maana ya kuanza na ya kusema wazi, kwa kujiamini na kwa ujasiri.
- source_word: ἐν τῇ συναγωγῇ
  choice: katika sinagogi
  rationale: Ni usemi wa kawaida wa mahali na istilahi iliyozoeleka kwa jengo au kusanyiko la Kiyahudi.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Lakini Prisila na Akila walipomsikia
  rationale: Muundo wa wakati wa kitenzi kishirikishi umetolewa kwa 'walipomsikia'; δέ inaonyesha badiliko dogo katika simulizi, lililotolewa kwa 'Lakini'.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Prisila na Akila
  rationale: Haya ni maumbo ya majina yaliyozoeleka katika Kiswahili, yakifuata Πρίσκιλλα badala ya umbo fupi Prisca.
- source_word: προσελάβοντο αὐτὸν
  choice: walimchukua kando
  rationale: Muktadha wa maelezo yaliyofuata unaunga mkono maana ya kumweka pembeni kwa mazungumzo binafsi; tanbihi inadumisha maana nyingine halali za kitenzi.
- source_word: ἀκριβέστερον αὐτῷ ἐξέθεντο
  choice: na kumweleza kwa usahihi zaidi
  rationale: Huhifadhi tendo la kufafanua na nguvu ya ulinganisho ya ἀκριβέστερον bila kudokeza kwamba yote aliyojua hapo awali yalikuwa makosa.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: njia ya Mungu
  rationale: Huhifadhi usemi wa Kigiriki na upana wake wa kimaana bila kuufanya kwa lazima istilahi kamili ya kimafundisho.
theological_decisions:
- issue: Tendo la Prisila na Akila kwa Apolo
  choice: walimchukua kando kwa maelezo ya kina zaidi
  alternative: walimchukua pamoja nao au walimkaribisha
  rationale: Maelezo yanayofuata yanaelekea kuonyesha mazungumzo binafsi yenye kusahihisha kwa upole, lakini kitenzi kinaweza pia kumaanisha kumpokea au kumchukua pamoja nao; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Maana ya “njia ya Mungu”
  choice: kuhifadhi usemi mpana “njia ya Mungu”
  alternative: kuifafanua wazi kuwa ujumbe kamili wa Kikristo au njia ya maadili ya Mungu
  rationale: Muktadha unaelekea kwenye ujumbe au maisha yanayohusiana na imani ya Kikristo, lakini maandiko yenyewe hayabainishi hapa upeo wote wa usemi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Kwa ujasiri,” “kwa usahihi zaidi,” na “njia ya Mungu” huhifadhi maana na mvutano wa matini bila kuongeza hitimisho la kimadhehebu.
