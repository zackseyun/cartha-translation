  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: sw
  text: Lakini baada ya kuwaaga na kusema[a], “Nitarudi tena kwenu, Mungu akipenda[b],” alisafiri kwa meli kutoka Efeso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati hazina maneno ‘na kusema, “Nitarudi tena kwenu, Mungu akipenda.”’
    reason: textual_variant
  - marker: b
    text: Au ‘ikiwa Mungu atapenda.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Huonyesha utofauti na ombi lililotangulia kwamba akae nao kwa muda mrefu zaidi; ‘Lakini’ ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ἀποταξάμενος
  choice: baada ya kuwaaga
  rationale: Kitenzi hiki katika umbo la nomino-tendo ya wakati uliopita huonyesha kuagana kabla ya tendo kuu. ‘Baada ya kuwaaga’ ni Kiswahili cha asili na kinaonyesha kwamba aliagana na watu hao.
- source_word: καὶ εἰπών
  choice: na kusema
  rationale: Hudumisha mfuatano wa vitenzi viwili tegemezi, yaani kuaga na kusema, bila kufanya sentensi iwe nzito.
- source_word: Πάλιν
  choice: tena
  rationale: Ni kielezi cha kawaida kinachoonyesha kurudia, na kinaendana kwa asili na ‘nitarudi’.
- source_word: ἀνακάμψω
  choice: Nitarudi
  rationale: Hutoa maana ya wakati ujao ya kurudi mahali au kwa watu fulani kwa lugha ya kawaida yenye heshima.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Huonyesha mwelekeo wa kurudi kwa watu wanaosemeshwa; ‘kwenu’ ni ya asili zaidi katika Kiswahili kuliko muundo wa neno kwa neno.
- source_word: τοῦ θεοῦ θέλοντος
  choice: Mungu akipenda
  rationale: Huhifadhi utegemezi wa mpango huo juu ya mapenzi ya Mungu. Muundo wa ‘-ki-’ hutoa hali ya sharti kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: ἀνήχθη
  choice: alisafiri kwa meli
  rationale: Katika simulizi za safari, neno hili lina maana ya kuondoka au kusafiri kwa njia ya bahari. Tafsiri hii inaeleweka wazi na haileti maana ya kawaida ya ‘kupandishwa’.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: kutoka Efeso
  rationale: Ni usemi wa kawaida wa kuonyesha mahali safari ya baharini ilipoanzia; ‘Efeso’ ni umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
theological_decisions:
- issue: Kauli kuhusu mapenzi ya Mungu katika mpango wa safari ya Paulo
  choice: Mungu akipenda
  alternative: ikiwa Mungu atapenda
  rationale: Kigiriki kinamtaja Mungu waziwazi na huonyesha kwamba kurudi kwa Paulo kunategemea mapenzi yake. ‘Mungu akipenda’ huhifadhi sharti hilo bila kubadili ‘Mungu’ kuwa ‘Bwana’ wala kulifanya kuwa uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili bila kufuta mfuatano wa matendo katika Kigiriki. Alama zote za tanbihi zimewekwa katika maandishi.
