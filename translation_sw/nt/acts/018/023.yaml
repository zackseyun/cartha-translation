id: ACT.18.23
reference: Acts 18:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: sw
  text: Baada ya kukaa huko kwa muda fulani, aliondoka, akasafiri kutoka mahali hadi mahali katika eneo la Galatia na Frigia, akiwaimarisha wanafunzi wote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: Baada ya kukaa huko kwa muda fulani
  rationale: Nahau ποιέω pamoja na χρόνον humaanisha kutumia au kukaa muda fulani. Neno “huko” limetolewa na muktadha wa mahali palipotajwa awali na linafanya Kiswahili kiwe cha kawaida.
- source_word: ἐξῆλθεν
  choice: aliondoka
  rationale: Katika simulizi la safari, kitenzi hiki kinaonyesha kuondoka mahali ili kuanza safari, si tu kwenda nje.
- source_word: διερχόμενος καθεξῆς
  choice: akasafiri kutoka mahali hadi mahali
  rationale: Muunganiko huu unaonyesha mwendo unaoendelea kwa kufuata maeneo moja baada ya jingine. Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi wazo la mfuatano bila kudai ratiba maalumu.
- source_word: τὴν Γαλατικὴν χώραν
  choice: eneo la Galatia
  rationale: χώρα hapa ni eneo au nchi kwa maana pana. “Eneo la Galatia” huepuka kulifanya jina hilo kwa lazima kuwa istilahi rasmi ya jimbo la Kirumi.
- source_word: καὶ Φρυγίαν
  choice: na Frigia
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili; wazo la “eneo” linaeleweka pia kwa Frigia bila kulirudia.
- source_word: στηρίζων
  choice: akiwaimarisha
  rationale: στηρίζω humaanisha kufanya imara au kutia nguvu. “Akiwaimarisha” huhifadhi tendo linaloendelea la kuwasaidia wanafunzi kuwa thabiti bila kubainisha kupita kiasi njia iliyotumiwa.
- source_word: πάντας τοὺς μαθητάς
  choice: wanafunzi wote
  rationale: “Wanafunzi” ni neno lililozoeleka kwa wafuasi wa Yesu katika Matendo, na “wote” huhifadhi πάντας.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa vitenzi mfululizo unafaa simulizi ya safari. Hakuna tanbihi iliyowekwa kwa sababu tofauti ya καθεξῆς imewasilishwa moja kwa moja kwa kauli “kutoka mahali hadi mahali”; tanbihi ya Kiingereza iliyotolewa inaonekana kutolingana na alama yake katika matini ya Kiingereza.
