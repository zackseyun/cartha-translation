  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: sw
  text: Lakini ikiwa haya ni masuala kuhusu neno[a], majina, na sheria yenu wenyewe, ninyi wenyewe mtashughulikia; mimi sitaki kuwa mwamuzi wa mambo haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujumbe” au “mafundisho.” Neno la Kigiriki λόγος lina maana pana na linaweza kurejelea ujumbe, fundisho, au istilahi inayobishaniwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: masuala
  rationale: Neno hili linaashiria mambo yanayochunguzwa au kubishaniwa. “Masuala” linafaa katika muktadha wa kimahakama bila kudokeza uhasama kupita kiasi.
- source_word: περὶ λόγου
  choice: kuhusu neno
  rationale: λόγος lina maana pana, ikiwemo neno, ujumbe, mafundisho au hoja. “Neno” linabaki karibu na Kigiriki na kuhifadhi utata wake; tanbihi inaonyesha maana nyingine zinazowezekana.
- source_word: ὀνομάτων
  choice: majina
  rationale: Hili ndilo neno la moja kwa moja na halibainishi kama yanayokusudiwa ni majina, vyeo au istilahi.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: sheria yenu wenyewe
  rationale: Kirai hiki kinaonyesha sheria inayowahusu washtaki Wayahudi, tofauti na sheria ya kiraia ya Roma; pia kinahifadhi mtazamo wa kujitenga wa Galio.
- source_word: ὄψεσθε αὐτοί
  choice: shughulikieni ninyi wenyewe
  rationale: Wakati ujao wa kati hapa una nguvu ya kimuktadha ya “angalieni wenyewe” au “lishughulikieni wenyewe.” Amri ya Kiswahili inawasilisha kwa kawaida kukataa kwa Galio na msisitizo wa αὐτοί.
- source_word: κριτὴς
  choice: mwamuzi
  rationale: “Mwamuzi” linafaa kwa mtu anayetarajiwa kutoa uamuzi katika shauri, huku likiepuka maana finyu ya cheo rasmi cha hakimu.
- source_word: τούτων
  choice: wa mambo haya
  rationale: Kiwakilishi hiki kinarejelea kwa upana masuala yaliyotajwa hapo awali.
- source_word: οὐ βούλομαι εἶναι
  choice: mimi sitaki kuwa
  rationale: Hili linaeleza nia au kutokuwa tayari kwa Galio kwa Kiswahili cha kawaida bila kuongeza ukali wa kukataa rasmi.
theological_decisions:
- issue: Upeo wa maana ya λόγος katika kukataa kwa Galio
  choice: neno
  alternative: ujumbe; mafundisho; hoja
  rationale: Andiko halifafanui ikiwa λόγος linamaanisha istilahi fulani, ujumbe, au fundisho. Tafsiri ya msingi na tanbihi huhifadhi upana huo badala ya kuamua suala la kitheolojia kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “shughulikieni ninyi wenyewe” kwa usemi wa kawaida wa mamlaka anayewaachia wahusika wajisuluhishie, huku “mimi” ikihifadhi msisitizo wa kukataa kwa Galio.
