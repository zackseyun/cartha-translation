  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: sw
  text: Naye Bwana akamwambia Paulo usiku kwa njia ya maono[a], “Usiogope, bali endelea kusema, wala usinyamaze.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika maono.” Kifungu cha Kigiriki kinasema kihalisi “kwa njia ya maono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Huhifadhi cheo cha Kigiriki bila kukipanua kuwa ‘Bwana Yesu’; katika muktadha wa Matendo kinaelekea kumrejelea Yesu aliyefufuka.
- source_word: ἐν νυκτὶ
  choice: usiku
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaoonyesha wakati bila kuongeza maana.
- source_word: δι’ ὁράματος
  choice: kwa njia ya maono
  rationale: Huwakilisha wazi διά pamoja na jenitivi kama njia au namna ambayo ujumbe ulitolewa; ‘katika maono’ pia yawezekana.
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja, la asili katika Kiswahili, linalohifadhi nguvu ya kauli ya Kigiriki.
- source_word: ἀλλὰ λάλει
  choice: bali endelea kusema
  rationale: ‘Endelea kusema’ huonyesha tendo linaloendelea linalodokezwa na amri ya wakati wa sasa λάλει.
- source_word: καὶ μὴ σιωπήσῃς
  choice: wala usinyamaze
  rationale: Hutoa katazo la pili kwa Kiswahili cha kawaida na kuhifadhi ulinganifu wake na amri ya kuendelea kusema.
theological_decisions:
- issue: Mrejelewa wa ‘Bwana’
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Nakala ya Kigiriki inasema ὁ κύριος tu. Ingawa katika Matendo cheo hiki kwa kawaida humrejelea Yesu, tafsiri haiongezi jina ambalo halipo, hivyo huhifadhi uzito na kiwango cha ubainisho cha matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Naye ... akamwambia’ ni mtiririko wa kawaida wa simulizi la kibiblia bila kuwa wa kizamani kupita kiasi; ‘endelea kusema’ huweka wazi mwendelezo wa amri.
