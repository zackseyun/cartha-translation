base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: sw
  text: Wakafika Efeso[a], naye akawaacha wale wenzake[b] huko. Lakini yeye mwenyewe akaingia katika sinagogi na kujadiliana[c] na Wayahudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakawasili Efeso.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, aliwaacha huko wenzake, Prisila na Akila, waliotajwa katika mstari uliotangulia.
    reason: cross_reference
  - marker: c
    text: Au, “akazungumza kwa hoja na” au “akafanya mazungumzo na.” Neno la Kigiriki linaashiria mazungumzo yenye kubadilishana hoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: wakafika
  rationale: Kitenzi hiki kinaonyesha kufika mahali palipokusudiwa; “wakafika Efeso” ni Kiswahili cha kawaida na kinaendeleza simulizi vizuri.
- source_word: δὲ
  choice: na / lakini
  rationale: δὲ ya kwanza inaendeleza simulizi, ilhali ya pili inaonyesha tofauti kati ya wenzake waliobaki na hatua aliyochukua yeye mwenyewe.
- source_word: κἀκείνους
  choice: wale wenzake
  rationale: Kisarufi ni “na wale,” kikirejelea watu waliokuwa pamoja naye katika mstari uliotangulia. “Wale wenzake” hufanya rejeleo lieleweke bila kuingiza majina katika matini.
- source_word: κατέλιπεν
  choice: akawaacha
  rationale: Huonyesha kuwaacha watu mahali fulani; pamoja na “huko” linawasilisha kikamilifu maana ya mahali.
- source_word: αὐτοῦ
  choice: huko
  rationale: Hapa linafanya kazi kama usemi wa mahali na kurejelea Efeso.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi na tofauti kati yake na wale aliowaacha huko.
- source_word: εἰσελθὼν
  choice: akaingia
  rationale: Kauli shirikishi inaonyesha kitendo kinachotangulia kitendo kikuu; mfuatano wa “aka-” ni wa asili katika simulizi la Kiswahili.
- source_word: συναγωγήν
  choice: sinagogi
  rationale: Katika mazingira haya neno linamaanisha mahali pa kusanyikia na kuabudia kwa Wayahudi.
- source_word: διελέξατο
  choice: kujadiliana na
  rationale: Kitenzi kinaashiria mazungumzo ya hoja yenye kubadilishana mawazo. “Kujadiliana na” huhifadhi hali hiyo bila kudokeza ugomvi.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Hili ndilo jina la moja kwa moja la kundi la kikabila na kidini linalotajwa; matini haisemi viongozi pekee.
