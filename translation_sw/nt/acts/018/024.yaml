  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kigiriki imegawanywa kwa urahisi wa usomaji bila kubadili uhusiano wa mawazo. Jina la mahali limetolewa kama “Efeso,” na γραφαί kama “Maandiko” kwa kuwa linarejelea maandiko matakatifu ya Kiyahudi.
