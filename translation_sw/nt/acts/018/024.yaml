base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: sw
  text: Myahudi mmoja aitwaye Apolo, mzaliwa wa Aleksandria, mtu mwenye ufasaha, alifika Efeso akiwa hodari katika Maandiko[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msomi”; neno la Kigiriki λόγιος linaweza kumaanisha mtu mwenye ufasaha au mwenye elimu nyingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: Myahudi
  rationale: Katika muktadha huu neno hilo linamtambulisha Apolo kwa utambulisho wake wa kikabila na kidini, si tu kuwa mtu aliyetoka Uyahudi.
- source_word: δέ
  choice: mpito usiotajwa kwa neno maalumu
  rationale: Neno hili linaashiria mpito wa simulizi; Kiswahili kinaweza kuonyesha mpito huo kwa kuanza mhusika mpya moja kwa moja bila kuongeza wazo la wakati au utofautishaji mkali.
- source_word: τις
  choice: mmoja
  rationale: Huhifadhi hali ya kumtambulisha mhusika mpya asiyeainishwa zaidi, kwa Kiswahili cha kawaida na cha asili.
- source_word: Ἀπολλῶς ὀνόματι
  choice: aitwaye Apolo
  rationale: Hii ni njia ya kawaida na ya sasa ya Kiswahili ya kumtambulisha mtu kwa jina.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: mzaliwa wa Aleksandria
  rationale: Kifungu kinaonyesha asili yake; ‘mzaliwa wa’ huepuka maana tata za kisasa zinazoweza kuambatana na lugha ya rangi au kabila.
- source_word: ἀνὴρ
  choice: mtu
  rationale: Kwa kuwa Apolo tayari ametajwa wazi kuwa mwanamume kwa jina na muktadha, ‘mtu mwenye ufasaha’ ni usemi wa asili zaidi wa Kiswahili kuliko ‘mwanamume mwenye ufasaha’ bila kupotosha rejeleo.
- source_word: λόγιος
  choice: mwenye ufasaha
  rationale: Neno la Kigiriki linaweza kumaanisha mwenye ufasaha au msomi. Maana ya ufasaha inafaa katika muktadha, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: alifika Efeso
  rationale: Huwasilisha kwa ufupi na kwa kawaida tendo la kufikia mahali palipokusudiwa.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: alikuwa hodari katika Maandiko
  rationale: ‘Hodari’ huhifadhi nguvu ya δυνατός na kuonyesha uwezo mkubwa wa Apolo kuhusu Maandiko bila kuifanya maana kuwa maarifa tu.
