  text: Lakini walipomwomba akae kwa muda mrefu zaidi, hakukubali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hakuridhia” au “alikataa ombi hilo.” Kitenzi cha Kigiriki humaanisha kukubali au kuridhia ombi.
