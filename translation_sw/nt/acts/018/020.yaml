lexical_decisions:
- source_word: ἐρωτώντων
  choice: walipomwomba
  rationale: Kirai huru cha jenitivi chenye kitenzi endelevu kimetafsiriwa kwa kishazi cha wakati. Katika muktadha huu, kitenzi hiki kina maana ya kutoa ombi, hivyo “walipomwomba” ni cha kawaida na huonyesha kwamba ombi lilielekezwa kwa Paulo.
- source_word: δὲ
  choice: Lakini
  rationale: 'Kiunganishi hiki kinaonyesha badiliko lenye utofautishaji mdogo katika simulizi: ingawa walitaka akae, yeye hakukubali.'
- source_word: αὐτῶν
  choice: wa- katika “walipomwomba”
  rationale: Kiwakilishi hiki kinawarejelea watu wa Efeso waliotoa ombi. Kiswahili huonyesha mtendaji kwa kiambishi cha ngeli katika kitenzi.
- source_word: ἐπὶ πλείονα χρόνον
  choice: kwa muda mrefu zaidi
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana linganishi ya πλείονα, yaani kuongeza muda wa kukaa.
- source_word: μεῖναι
  choice: akae
  rationale: Hiki ni kitenzi-jalizo cha ombi. “Akae” ni cha asili katika simulizi la safari na kinaonyesha kutakiwa aendelee kuwapo mahali hapo.
- source_word: οὐκ ἐπένευσεν
  choice: hakukubali
  rationale: ἐπινεύω humaanisha kukubali au kuridhia ombi. “Hakukubali” ni lugha ya sasa na haiongezi ukali unaoweza kudokezwa na “alikataa.”
