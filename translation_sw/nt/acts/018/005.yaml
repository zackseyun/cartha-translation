base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: sw
  text: Lakini Sila na Timotheo waliposhuka kutoka Makedonia, Paulo alikuwa akijishughulisha sana na neno,[a] akiwashuhudia Wayahudi kwa mkazo kwamba Yesu ndiye Masihi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alibanwa na neno” au “alijikita katika ujumbe.” Kitenzi cha Kigiriki kinaweza kumaanisha kushughulishwa sana, kubanwa, au kujitoa kwa jambo fulani.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki “Kristo.” Hapa neno hilo ni cheo, kwa hiyo “Masihi” limetumiwa ili kuhifadhi maana yake ya Kimasihi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Lakini ... walipo-
  rationale: Huonyesha mpito wenye maana ya wakati; muundo huu ni wa kawaida katika Kiswahili na unahifadhi nguvu ya δέ na ὡς.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: waliposhuka kutoka Makedonia
  rationale: Inahifadhi nahau ya safari ya Luka na maana ya msingi ya κατέρχομαι, ‘kushuka/kuja chini.’
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Sila na Timotheo
  rationale: Huwataja wote wawili kwa njia ya asili bila kuongeza uzito usio wa lazima.
- source_word: συνείχετο
  choice: alijishughulisha kikamilifu
  rationale: Huwasilisha hali ya Paulo kuwa amemezwa na kazi hiyo au kujitoa kabisa, bila kuamua kimya-kimya kwamba alilazimishwa na nguvu ya nje.
- source_word: τῷ λόγῳ
  choice: na neno
  rationale: Inadumisha neno λόγος na matumizi yake katika Luka-Matendo kama kifupi cha ujumbe wa Injili; tanbihi inalinda uwezekano wa kuelewa dativu kwa namna nyingine.
- source_word: διαμαρτυρόμενος
  choice: akiwashuhudia ... kwa mkazo
  rationale: Inahifadhi lugha ya ushuhuda pamoja na nguvu ya kusisitiza au kutoa ushuhuda mzito iliyomo katika kitenzi.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Katika muktadha huu humaanisha Wayahudi kama kundi la kikabila na kidini, si wakazi wa Uyahudi pekee.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: kwamba Yesu ndiye Masihi
  rationale: Muundo wa predikati unamtambulisha Yesu kuwa Masihi aliyeahidiwa; ‘ndiye’ huonyesha utambulisho huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au kama jina
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός ina kibainishi na ni predikati katika ushuhuda kwa Wayahudi, hivyo maana yake kama cheo cha Masihi iko wazi.
- issue: Nguvu inayomhusisha Paulo katika συνείχετο τῷ λόγῳ
  choice: alijishughulisha kikamilifu na neno
  alternative: alibanwa na neno / alitekwa kabisa na ujumbe
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la kujitoa au kushughulishwa sana bila kuamua kama msukumo huo ulikuwa shinikizo la nje, hali ya ndani, au kujikita katika huduma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Alijishughulisha kikamilifu’ ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi utata wa kileksika wa συνείχετο. Alama zote za tanbihi zimo katika matini kuu.
