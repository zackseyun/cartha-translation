  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: sw
  text: Naye alikuwa akijadiliana[a] katika sinagogi kila Sabato na kuwashawishi[b] Wayahudi na Wagiriki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akizungumza nao kwa hoja” au “akibishana nao.” Kitenzi cha Kigiriki kinaweza kumaanisha mazungumzo yenye hoja au mabishano.
    reason: lexical_alternative
  - marker: b
    text: Au “akijaribu kuwashawishi.” Wakati usiotimilika unaweza kukazia juhudi iliyoendelea bila kusema kwamba kila mtu alishawishika.
    reason: lexical_alternative
  - marker: c
    text: Neno hili linamaanisha “Wagiriki.” Katika muktadha wa sinagogi, huenda likawarejelea Wagiriki waliokuwa na uhusiano na sinagogi; wengine hulielewa kwa maana pana zaidi ya “watu wa mataifa.”
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: alikuwa akijadiliana
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililokuwa likirudiwa au kuendelea. “Kujadiliana” huhifadhi wazo la mazungumzo yenye hoja bila kulazimisha maana ya mabishano makali.
- source_word: δὲ
  choice: Naye
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si alama ya upinzani mkali. “Naye” ni mpito wa kawaida wa kisimulizi kwa Kiswahili.
- source_word: ἐν τῇ συναγωγῇ
  choice: katika sinagogi
  rationale: Hii ni tafsiri ya moja kwa moja ya kishazi cha mahali, yenye lugha ya kawaida na iliyo wazi.
- source_word: κατὰ πᾶν σάββατον
  choice: kila Sabato
  rationale: κατά pamoja na πᾶν ina maana ya mgawanyo, yaani tendo lilitokea Sabato baada ya Sabato. “Kila Sabato” ni usemi wa asili wa Kiswahili.
- source_word: ἔπειθέν
  choice: kuwashawishi
  rationale: Kitenzi πείθω humaanisha kushawishi au kujaribu kumfanya mtu akubali. Muundo wa “alikuwa … na kuwashawishi” unaonyesha tendo lililoendelea bila kudai wazi kwamba wote walikubali.
- source_word: τε
  choice: na
  rationale: τε huunganisha tendo hili na lililotangulia; “na” ndilo kiunganishi cha kawaida na cha asili hapa.
- source_word: Ἰουδαίους
  choice: Wayahudi
  rationale: Katika muktadha huu neno hilo linataja Wayahudi kama kundi la kikabila na kidini, si wakazi wa Uyahudi pekee.
- source_word: Ἕλληνας
  choice: Wagiriki
  rationale: Tafsiri hii huhifadhi jina maalumu lililotumiwa na maandishi badala ya kulipanua kuwa “watu wa mataifa.”
theological_decisions:
- issue: Utambulisho wa Ἕλληνας katika muktadha wa sinagogi
  choice: Wagiriki
  alternative: Watu wa mataifa; Wagiriki waliomcha Mungu
  rationale: Andiko lenyewe linasema “Wagiriki” wala halibainishi kwamba walikuwa waongofu, watu waliomcha Mungu, au watu wa mataifa kwa ujumla. Tafsiri kwa hiyo haiingizi kundi mahususi zaidi lisilotajwa.
- issue: Iwapo ἔπειθεν hudai matokeo yenye mafanikio
  choice: kuwashawishi
  alternative: kujaribu kuwashawishi
  rationale: Wakati usiotimilika unaweza kuonyesha juhudi iliyoendelea, lakini si lazima uwe wa kujaribu pekee. Tafsiri kuu inafuata maana ya kawaida ya kitenzi, huku tanbihi ikihifadhi uwezekano wa maana ya juhudi bila matokeo yaliyothibitishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “alikuwa aki-” unaonyesha tendo lililoendelea au kurudiwa, na “kila Sabato” huweka wazi desturi hiyo. Istilahi “sinagogi,” “Sabato,” “Wayahudi,” na “Wagiriki” ni wazi kwa wasomaji wa kawaida na huhifadhi upekee wa kihistoria wa maandishi.
