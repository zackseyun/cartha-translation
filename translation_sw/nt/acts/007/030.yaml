  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: sw
  text: Baada ya miaka arobaini kutimia[a], malaika[c] akamtokea katika jangwa la Mlima Sinai, katika mwali wa moto wa kichaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Miaka arobaini ilipotimia.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika mwali wa moto wa kichaka”; yaani, mwali huo ulihusishwa na kichaka. Linganisha Kutoka 3:2.
    reason: cross_reference
  - marker: c
    text: Baadhi ya wafafanuzi huhusianisha malaika huyu na “malaika wa BWANA” katika Kutoka 3:2, lakini hapa Matendo ya Mitume inasema tu “malaika.”
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: Baada ya miaka arobaini kutimia
  rationale: Muundo huu unaonyesha mazingira ya wakati na kuhifadhi wazo la miaka ‘kutimia’ kwa Kiswahili cha kawaida.
- source_word: ὤφθη αὐτῷ
  choice: akamtokea
  rationale: Kitenzi cha Kiyunani hapa hutumiwa kueleza kutokea au kuonekana kwa kiumbe wa mbinguni; ‘akamtokea’ ni tafsiri ya asili na inaonyesha αὐτῷ.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: jangwani karibu na Mlima Sinai
  rationale: ‘Jangwani’ linafaa kwa mazingira ya simulizi la Kutoka. Genitivi inayohusisha jangwa na Mlima Sinai inaelezwa kwa Kiswahili cha kawaida kama eneo lililo karibu na mlima, bila kudai kwamba tukio lilikuwa juu ya mlima.
- source_word: ἄγγελος
  choice: malaika
  rationale: Katika muktadha huu neno linamaanisha mjumbe wa mbinguni, hivyo ‘malaika’ linafaa kuliko ‘mjumbe.’
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: katika mwali wa moto uliotoka kwenye kichaka
  rationale: Tafsiri hii huhifadhi taswira ya mwali wa moto na kueleza kwa kawaida uhusiano uliobanwa wa genitivi βάτου na mwali.
theological_decisions:
- issue: Utambulisho wa ἄγγελος katika muktadha wa kujidhihirisha kwa Mungu
  choice: malaika
  alternative: malaika wa Bwana
  rationale: Matendo hapa inasema tu ‘malaika’; tafsiri haiongezi ‘wa Bwana’ kutoka Kutoka 3:2 wala kuamua utambulisho wa kiumbe huyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akamtokea’ na ‘mwali wa moto’ ni maneno yanayoeleweka kwa urahisi huku yakihifadhi mtindo wa kibiblia. Alama zote za tanbihi zimewekwa katika matini kuu.
