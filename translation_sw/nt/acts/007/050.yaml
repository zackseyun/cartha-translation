lexical_decisions:
- source_word: οὐχὶ
  choice: Je, si
  rationale: Huanzisha swali la balagha linalotarajia jibu la ndiyo; muundo huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: ἡ χείρ μου
  choice: mkono wangu
  rationale: Hifadhi taswira halisi ya mkono kama ishara ya utendaji wa Mungu, sambamba na mwangwi wa Isaya 66:2.
- source_word: ἐποίησεν
  choice: uliofanya
  rationale: Kitenzi 'kufanya' kinaonyesha tendo la kuleta vitu hivi kuwapo, huku upatanisho wa kisarufi ukirejelea 'mkono wangu'.
- source_word: ταῦτα πάντα
  choice: vitu hivi vyote
  rationale: Huwakilisha kikamilifu kiashiria 'hivi' na upeo wa ujumla wa 'vyote'.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa mfano wa kibinadamu
  choice: Kudumisha usemi “mkono wangu” kama rejeo la utendaji wa Mungu
  alternative: 'Kutafsiri kwa maana pana: “Je, si mimi niliyevifanya vitu hivi vyote?”'
  rationale: Taswira ya mkono imetoka katika Isaya 66:2 na inahifadhi nguvu ya kishairi na ya balagha bila kuibadili kuwa maelezo ya kitheolojia yaliyo dhahania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa, pamoja na taswira ya moja kwa moja ya “mkono wangu.”
