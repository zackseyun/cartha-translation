  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: sw
  text: Ndipo Bwana akamwambia, “Vua viatu miguuni mwako, kwa maana mahali unaposimama ni ardhi takatifu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa κύριος katika Agano Jipya; linadumisha uzito wa muktadha bila kuingiza moja kwa moja jina la Mungu lisiloandikwa katika Kigiriki cha mstari huu.
- source_word: Λῦσον
  choice: Vua
  rationale: Ingawa kimsingi linaweza kumaanisha ‘fungua’ au ‘legeza,’ likitumiwa kuhusu kiatu hapa linaagiza kukiondoa; ‘vua’ ni Kiswahili cha kawaida na sahihi.
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: viatu miguuni mwako
  rationale: Kigiriki kina ‘kiatu’ katika umoja pamoja na ‘miguu’ katika wingi, lakini Kiswahili cha kawaida hutumia wingi ‘viatu’ kwa amri ya kuondoa vilivyo miguuni; maana ya kitendo imehifadhiwa bila usemi usio wa kawaida.
- source_word: ὁ γὰρ τόπος ἐφ’ ᾧ ἕστηκας
  choice: kwa maana mahali unaposimama
  rationale: ‘Kwa maana’ linaonyesha maelezo yanayoletwa na γάρ, na ‘mahali unaposimama’ linaeleza kwa kawaida hali ya sasa ya kitenzi timilifu ἕστηκας pamoja na ἐφ’ ᾧ.
- source_word: γῆ ἁγία
  choice: ardhi takatifu
  rationale: Katika mazingira haya γῆ ni ardhi au sehemu ya chini anaposimama Musa; ‘ardhi takatifu’ ni usemi wa kawaida, wenye heshima, na unaohifadhi sifa ya utakatifu.
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu ya tukio la Mungu kujidhihirisha katika Kutoka
  choice: Bwana
  alternative: BWANA
  rationale: Andiko la Kigiriki lina κύριος, si jina la Mungu la Kiebrania lenyewe. ‘Bwana’ linafuata ushahidi wa chanzo cha Agano Jipya na kudumisha heshima bila kuingiza utaratibu wa herufi kubwa wa Agano la Kale.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaofaa kusomwa hadharani; ‘viatu’ limetumiwa kiidioma badala ya kulazimisha umoja wa Kigiriki usio wa kawaida katika Kiswahili.
