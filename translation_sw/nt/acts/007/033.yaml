  source_fidelity: 'Tafsiri inawasilisha kwa uaminifu maana ya Kigiriki: κύριος ni “Bwana,” Λῦσον ni amri ya kuondoa kiatu/viatu, γάρ inaelezwa kwa “kwa maana,” na kauli ya ἕστηκας inaelezwa kwa hali ya sasa, “unaposimama.” Ingawa ὑπόδημα ni umoja na τῶν ποδῶν ni wingi, “Vua viatu miguuni mwako” ni usemi wa kawaida wa Kiswahili unaowasilisha amri hiyo bila kufanya sentensi kuwa ya ajabu. Wingi wa Kiswahili hapa si dai kwamba Kigiriki kina nomino ya viatu katika wingi.'
