  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: sw
  text: Nao walikuwa wakimpiga Stefano kwa mawe huku akiomba na kusema[a], “Bwana Yesu, ipokee roho yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huku akimwitia na kusema.” Neno la Kigiriki linaweza kueleza kwa uwazi zaidi kumwitia au kumwomba mtu katika sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: walikuwa wakimpiga ... kwa mawe
  rationale: Wakati usiotimilifu unaonyesha tendo lililokuwa likiendelea; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: ἐπικαλούμενον
  choice: huku akiomba
  rationale: Katika muktadha huu Stefano anamwomba Yesu moja kwa moja. ‘Akiomba’ ni ya asili katika Kiswahili na inawasilisha maana ya kumwitia au kumwomba mtu kwa sala, bila kuhitaji kiwakilishi kisichotajwa wazi katika participio yenyewe.
- source_word: λέγοντα
  choice: na kusema
  rationale: Inahifadhi uratibu wa participio hizo mbili na kutambulisha maneno ya Stefano kwa Kiswahili cha kawaida.
- source_word: Κύριε Ἰησοῦ
  choice: Bwana Yesu
  rationale: Hili ni neno la heshima la moja kwa moja kwa Yesu na linahifadhi uzito wa κύριος bila kuongeza tafsiri ya kimadhehebu.
- source_word: δέξαι
  choice: ipokee
  rationale: Amri ya aoristi katika ombi hili ina maana ya kupokea; kiambishi ‘i-’ kinakirejelea ‘roho’ kwa upatanisho wa kisarufi wa Kiswahili.
- source_word: τὸ πνεῦμά μου
  choice: roho yangu
  rationale: Ni tafsiri ya moja kwa moja, iliyo wazi na ya kawaida kwa πνεῦμα katika muktadha wa kifo.
theological_decisions:
- issue: Je, ἐπικαλούμενον ionyeshe wazi kuwa Stefano anamwomba Yesu?
  choice: huku akiomba ... “Bwana Yesu”
  alternative: huku akimwita na kusema; huku akimwomba [yeye] na kusema
  rationale: Maneno yaliyonukuliwa yanaonyesha wazi kuwa Yesu ndiye anayeombwa. ‘Akiomba’ huhifadhi hali ya sala na kuambatana kwa moja kwa moja na ‘Bwana Yesu,’ bila kuongeza nomino kama ‘Mungu’ ambayo haipo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wakimpiga ... kwa mawe’ huonyesha tendo linaloendelea; ‘huku akiomba’ huunganisha tendo hilo na ombi la Stefano kwa mtiririko wa kawaida.
