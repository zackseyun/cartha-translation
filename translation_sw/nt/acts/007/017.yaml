id: ACT.7.17
reference: Acts 7:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: sw
  text: Lakini wakati wa ahadi ambayo Mungu alikuwa amemwahidi Abrahamu ulipokuwa ukikaribia[a], watu waliongezeka na kuwa wengi nchini Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi na muundo wa Kigiriki, “wakati wa ahadi ... ulipokuwa ukikaribia.” Kitenzi kilichotafsiriwa “alikuwa amemwahidi” kinaweza pia kumaanisha kwamba Mungu alikuwa ametangaza au ameahidi ahadi hiyo kwa Abrahamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Lakini ... ulipokuwa
  rationale: Καθώς inaanzisha kishazi cha wakati, huku δέ ikiashiria mpito wenye tofauti ndogo; muundo huu ni wa kawaida katika Kiswahili na hauzidishi nguvu ya tofauti.
- source_word: ἤγγιζεν
  choice: ulipokuwa ukikaribia
  rationale: Kauli ya wakati usiotimilika inaonyesha mchakato uliokuwa ukiendelea; 'ulipokuwa ukikaribia' huhifadhi hali hiyo.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: wakati wa kutimizwa kwa ahadi
  rationale: Tafsiri ya neno kwa neno 'wakati wa ahadi' inaweza kuwa tata isivyo kawaida katika Kiswahili. Katika muktadha, ni wakati unaohusiana na kufikiwa kwa ahadi; 'wa kutimizwa kwa ahadi' huwasilisha maana hiyo bila kuuita moja kwa moja 'wakati uliowekwa.'
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: ambayo Mungu alikuwa amemwahidi Abrahamu
  rationale: Katika muktadha huu ὁμολογέω ina maana ya kutangaza au kujifunga kwa ahadi. Kiswahili cha asili husema 'alimwahidi Abrahamu'; 'aliifanya ahadi kwa Abrahamu' si cha kawaida.
- source_word: ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη
  choice: watu waliongezeka na kuwa wengi
  rationale: Maneno haya yanadumisha vipengele viwili vya Kigiriki—kuongezeka na kuwa wengi—kwa lugha rahisi na ya sasa; 'walizidiana' au 'walizaliana' yangeingiza maana finyu zaidi.
- source_word: ἐν Αἰγύπτῳ
  choice: nchini Misri
  rationale: Hii ni kauli asilia ya mahali katika Kiswahili kwa taifa la Misri.
theological_decisions:
- issue: Maana ya ὡμολόγησεν kuhusu ahadi ya Mungu kwa Abrahamu
  choice: alikuwa amemwahidi Abrahamu
  alternative: alikuwa amemwekea Abrahamu ahadi; alikuwa amemwahidi kwa uthabiti
  rationale: Chaguo hili linaonyesha wajibu uliotangazwa na Mungu bila kuingiza wazi wazo lenye nguvu zaidi la kiapo, kwa kuwa kitenzi si ὀμνύω.
- issue: Maana ya 'wakati wa ahadi'
  choice: wakati wa kutimizwa kwa ahadi
  alternative: wakati wa ahadi
  rationale: Muktadha wa Matendo 7 unaelekeza kwenye kukaribia kwa wakati ambapo ahadi ingetimizwa. Ufafanuzi huu unafanya Kiswahili kiwe wazi, lakini tanbihi inadumisha umbo la karibu zaidi na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Abrahamu' na 'Misri' ni maumbo ya kawaida ya kibiblia katika Kiswahili. Muundo unaepuka lugha ya kale na pia hauingizi wazo la kiapo lisilotajwa wazi katika Kigiriki.
