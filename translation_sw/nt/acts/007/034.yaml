id: ACT.7.34
reference: Acts 7:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: sw
  text: “Hakika nimeyaona mateso ya watu wangu walio Misri[a], nami nimesikia kuugua kwao, na nimeshuka ili kuwaokoa. Sasa njoo, nitakutuma Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuonewa” au “kutendewa vibaya” badala ya “mateso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: Hakika nimeyaona
  rationale: Muundo wa kisisitizo unaorudia wazo la kuona umeonyeshwa kwa ‘hakika,’ ambayo ni ya asili katika Kiswahili na inadumisha msisitizo wa mwangwi wa Kutoka 3:7.
- source_word: κάκωσιν
  choice: mateso
  rationale: Neno hili huonyesha kutendewa vibaya, kuonewa, au kuteswa. ‘Mateso’ ni la kawaida na lenye hadhi, huku tanbihi ikihifadhi maana mbadala zilizo halali.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: watu wangu walio Misri
  rationale: Huhifadhi umilikaji na hutambulisha mahali walipo kwa muundo wa kawaida wa Kiswahili.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: kuugua kwao
  rationale: Ingawa kiwakilishi cha Kigiriki ni cha umoja kwa sababu ya nomino ya pamoja ‘watu,’ Kiswahili hutumia wingi kwa kundi la watu. ‘Kuugua’ huhifadhi sauti ya maumivu na mwangwi wa simulizi la Kutoka.
- source_word: κατέβην
  choice: nimeshuka
  rationale: Huhifadhi lugha ya kimwili inayotumiwa kumweleza Mungu bila kuifafanua au kuipunguza; wakati timilifu unaonyesha umuhimu wake kwa hatua inayofuata.
- source_word: ἐξελέσθαι
  choice: kuwaokoa
  rationale: Katika muktadha huu kitenzi humaanisha kuwaondoa watu katika hatari au ukandamizaji. ‘Kuwaokoa’ ni cha sasa, wazi, na cha kawaida.
- source_word: δεῦρο
  choice: njoo
  rationale: Hutoa mwito wa moja kwa moja kwa Musa kwa Kiswahili cha asili bila kuongeza ‘hapa’ isiyolazimu.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: nitakutuma Misri
  rationale: Huhifadhi kauli ya baadaye ya kutumwa kwa Musa na lengo la safari kwa muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Lugha ya Mungu kushuka kwa namna ya kibinadamu
  choice: nimeshuka
  alternative: nimekuja chini
  rationale: ‘Nimeshuka’ huhifadhi taswira ya Mungu kuingilia kati kama ilivyo katika maandishi, bila kuieleza kwa mfumo fulani wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara moja baada ya neno linalohusika. Tanbihi b ya safu ya Kiingereza haijatumika kwa sababu haipatani na sehemu ilipowekwa wala na maelezo yake.
