  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: sw
  text: Huyu[a] aliwatendea watu wetu kwa hila na kuwatesa baba zetu,[b] akawafanya watupe watoto wao wachanga mahali pa wazi ili wasihifadhiwe hai.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huyu aliwatumia watu wetu ujanja.” Neno la Kigiriki linaonyesha ujanja au hila iliyotumiwa dhidi yao.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mababu zetu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, waliwaacha watoto wao wachanga mahali pa wazi, wakawatelekeza ili wafe.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Huyu
  rationale: Kiwakilishi hiki kinarejelea moja kwa moja mfalme aliyetajwa katika mstari uliotangulia na kuhifadhi nguvu ya kiashirio cha Kigiriki.
- source_word: κατασοφισάμενος
  choice: aliwatendea ... kwa hila
  rationale: Kitenzi kinaonyesha kutumia ujanja wenye nia mbaya dhidi ya watu; usemi huu ni wa kawaida na unaonyesha udanganyifu bila kuficha maana yake hasi.
- source_word: τὸ γένος ἡμῶν
  choice: watu wetu
  rationale: Katika muktadha huu γένος ni jamii ya Israeli; 'watu wetu' ni ya asili na huepuka maana finyu ya ukoo au dhana za kisasa za rangi.
- source_word: ἐκάκωσεν
  choice: kuwatesa
  rationale: Kitenzi kina maana ya kuwatendea vibaya au kuwaletea madhara; 'kuwatesa' linafaa kwa ukali wa tendo katika muktadha.
- source_word: τοὺς πατέρας
  choice: wazee wetu
  rationale: Hapa neno linarejelea waliotangulia katika historia ya Israeli. 'Wazee wetu' ni usemi wa kawaida wa kibiblia katika Kiswahili, huku tanbihi ikifafanua maana ya mababu.
- source_word: τοῦ ποιεῖν
  choice: akawafanya
  rationale: Infinitivu yenye kiambishi inaweza kuonyesha njia au matokeo. 'Akawafanya' huhifadhi uhusiano wa kisababishi bila kuongeza kwa lazima wazo lenye nguvu zaidi la kulazimisha.
- source_word: τὰ βρέφη ἔκθετα
  choice: wawaache watoto wao wachanga nje
  rationale: Usemi huu unaeleza kwa Kiswahili cha kawaida desturi ya kuwaacha watoto wachanga mahali wazi; tanbihi inaweka wazi kuwa walitelekezwa ili wafe.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: ili wasiachwe hai
  rationale: Huhifadhi kusudi au matokeo na hali tendwa ya ζῳογονεῖσθαι, yaani kutohifadhiwa hai.
theological_decisions:
- issue: Uhusiano wa kisarufi wa τοῦ ποιεῖν na kiwango cha shuruti
  choice: akawafanya
  alternative: akawalazimisha
  rationale: Muundo wa Kigiriki unaonyesha kisababishi, njia, au matokeo, lakini hauitaji kitenzi mahsusi chenye maana kali ya kulazimisha. Tafsiri iliyochaguliwa hailazimishi uamuzi huo.
- issue: Kusudi au matokeo katika εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: ili wasiachwe hai
  alternative: hata wasibaki hai
  rationale: εἰς τό pamoja na infinitivu inaweza kubeba wazo la kusudi au matokeo. 'Ili' linafaa kwa muktadha wa amri ya kuwaua watoto, bila kuondoa kabisa matokeo yaliyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. 'Watoto wao wachanga' ni sahihi na ya kawaida kuliko istilahi ngumu; 'wawaache ... nje' inafafanua ἔκθετα bila kutegemea neno la kitaalamu. Alama zote za tanbihi zimewekwa katika matini kuu.
