id: ACT.7.35
reference: Acts 7:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: sw
  text: Musa huyu, ambaye walimkataa wakisema, “Ni nani aliyekuweka kuwa mtawala na mwamuzi?”—ndiye huyo ambaye Mungu alimtuma awe mtawala na mkombozi[a], kwa mkono wa malaika aliyemtokea katika kichaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwokozi.” Neno la Kigiriki linaweza kumaanisha mtu anayeleta kuachiliwa au ukombozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: walimkataa
  rationale: Katika muktadha huu, kitenzi hiki kinaonyesha kukataa mamlaka ya Musa, si kukanusha jambo kwa maneno tu.
- source_word: κατέστησεν
  choice: aliyekuweka
  rationale: Kitenzi kinahusu kuwekwa katika nafasi ya mamlaka. ‘Kukuweka’ ni cha asili katika swali hili na kinabaki karibu na muundo wa Kigiriki.
- source_word: ἄρχοντα
  choice: mtawala
  rationale: 'Neno hili humaanisha mtu mwenye mamlaka ya kuongoza. ‘Mtawala’ pia huhifadhi marudio yenye uzito: yule waliyemkataa kuwa mtawala ndiye aliyetumwa na Mungu kuwa mtawala.'
- source_word: δικαστήν
  choice: mwamuzi
  rationale: ‘Mwamuzi’ ni tafsiri ya moja kwa moja na iliyo wazi kwa mtu anayetoa hukumu.
- source_word: λυτρωτὴν
  choice: mkombozi
  rationale: ‘Mkombozi’ huonyesha mtu anayeleta kuachiliwa au ukombozi, na hivyo huhifadhi maana pana kuliko neno linaloelekeza kwenye msaada wa kawaida tu.
- source_word: ἀπέσταλκεν
  choice: alimtuma
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililotimizwa lenye umuhimu unaoendelea; katika masimulizi ya Kiswahili, wakati uliopita ‘alimtuma’ unasikika kwa kawaida bila kupoteza kiini cha maana.
- source_word: σὺν χειρὶ
  choice: kwa mkono wa
  rationale: Huu ni usemi wa kibiblia unaoonyesha njia au wakala wa tendo. Kuuhifadhi huepuka kuamua kimya kimya kama malaika alikuwa msaada, chombo, au mwakilishi.
- source_word: ἀγγέλου
  choice: malaika
  rationale: Katika simulizi la kichaka, neno hili linamtaja kiumbe wa mbinguni aliyemtokea Musa; ‘malaika’ ndiyo tafsiri ya kawaida na inayofaa muktadha.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: aliyemtokea katika kile kichaka
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, maana yake ya kawaida hapa ni ‘aliyemtokea.’ ‘Kile kichaka’ hurejelea kichaka kilichokwisha tajwa katika simulizi bila kuongeza neno ‘kilichowaka,’ ambalo halipo katika mstari huu.
- source_word: Τοῦτον ... τοῦτον
  choice: Musa huyu ... ndiye huyo ambaye
  rationale: Marudio ya kiwakilishi elekezi yana mkazo wa balagha. Muundo huu wa Kiswahili huhifadhi mkazo huo kwa njia ya asili.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: awe mtawala na mkombozi
  rationale: Muundo huu unaonyesha majukumu yote mawili kwa msisitizo. ‘Awe ... na ...’ huonyesha kwamba Mungu alimtuma Musa katika nafasi hizo mbili.
theological_decisions:
- issue: Tafsiri ya λυτρωτής katika kifungu kinachomweka Musa ndani ya historia ya ukombozi
  choice: mkombozi
  alternative: mwokozi; mtoa watu utumwani
  rationale: ‘Mkombozi’ huhifadhi wazo la kuachilia na kuleta ukombozi bila kumfanya Musa kimyakimya kuwa sawa kabisa na Kristo au kupunguza jukumu lake kuwa uokoaji wa kawaida tu.
- issue: Jukumu la malaika katika usemi σὺν χειρὶ ἀγγέλου
  choice: kwa mkono wa malaika
  alternative: kwa msaada wa malaika; kupitia malaika
  rationale: Usemi wa karibu na Kigiriki huhifadhi uwezekano wa kuelewa malaika kama wakala au njia iliyotumiwa, badala ya kufunga maana kwa tafsiri moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mkazo ‘Musa huyu ... ndiye huyo’ umehifadhiwa, na usemi ‘kwa mkono wa’ umeachwa kama nahau ya kibiblia kwa sababu unaakisi kwa karibu sintaksia na utata wa chanzo.
