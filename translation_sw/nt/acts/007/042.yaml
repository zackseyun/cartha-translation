id: ACT.7.42
reference: Acts 7:42
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: sw
  text: 'Lakini Mungu akageuka mbali nao, akawaacha watumikie jeshi la mbinguni[a], kama ilivyoandikwa katika kitabu cha manabii[b]: “Je, mlinitolea wanyama waliochinjwa na dhabihu kwa miaka arobaini jangwani, enyi nyumba ya Israeli?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliabudu jeshi la mbinguni.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa utumishi wa kidini au kuabudu. “Jeshi la mbinguni” ni usemi wa kibiblia unaorejelea miili ya angani, na kwa upana nguvu za kimbingu zilizohusishwa nayo katika ibada ya sanamu.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Au, “katika hati-kunjo ya manabii.”
    reason: lexical_alternative
  - marker: c
    text: Nukuu kutoka Amosi 5:25.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστρεψεν
  choice: akageuka mbali nao
  rationale: Katika muktadha wa hukumu unaofuatwa na παρέδωκεν, usemi huu unaonyesha Mungu kujiondoa kwa uhusiano, si kugeuka kimwili tu.
- source_word: παρέδωκεν
  choice: akawaacha
  rationale: Huwasilisha kukabidhi au kuwaacha chini ya matokeo ya uasi wao kama tendo la hukumu, bila kudokeza kwamba Mungu ndiye aliyesababisha ibada yao ya sanamu.
- source_word: λατρεύειν
  choice: watumikie
  rationale: Kitenzi kinaweza kumaanisha utumishi wa kidini au kuabudu. “Watumikie” huhifadhi upana wake; maana ya ibada inaelezwa katika tanbihi.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: jeshi la mbinguni
  rationale: Huhifadhi tamathali ya kibiblia inayoweza kurejelea viumbe vya angani na nguvu zilizohusishwa navyo katika ibada ya sanamu, bila kuifupisha kuwa nyota pekee.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: katika kitabu cha manabii
  rationale: Ni tafsiri ya kawaida na inayoeleweka; βίβλος pia yaweza kuwa hati-kunjo, jambo lililowekwa katika tanbihi.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: Je, mlinitolea
  rationale: Swali la balagha linatarajia jibu la kukana. “Mlinitolea” ni Kiswahili cha kawaida katika muktadha wa sadaka na huhifadhi mlengwa ‘mimi’.
- source_word: σφάγια καὶ θυσίας
  choice: wanyama waliochinjwa na dhabihu
  rationale: “Wanyama waliochinjwa” huhifadhi wazo la vitu vya dhabihu vilivyochinjwa, huku “dhabihu” ikiwakilisha neno la pili la ibada.
- source_word: οἶκος Ἰσραήλ
  choice: enyi nyumba ya Israeli
  rationale: Huhifadhi anuani ya pamoja na tamathali ya kibiblia badala ya kuibadili kuwa ‘watu wa Israeli’.
theological_decisions:
- issue: Tendo la Mungu katika hukumu
  choice: “akageuka mbali nao, akawaacha”
  alternative: “aliwafanya waabudu” au “aliwaruhusu tu”
  rationale: Vitenzi viwili vinaonyesha Mungu akijiondoa na kuwaacha chini ya ibada waliyoichagua kama hukumu, bila kumfanya mwanzilishi wa dhambi yao wala kupunguza tendo hilo kuwa ruhusa isiyo na hukumu.
- issue: Maana ya “jeshi la mbinguni”
  choice: Tamathali ya kibiblia imehifadhiwa katika matini
  alternative: “nyota,” “miili ya angani,” au “malaika”
  rationale: Kirai kinaweza kuhusisha miili ya angani na nguvu za kimbingu zinazohusishwa na ibada hiyo. Tafsiri haifungi maana kwa rejeleo moja lisilo na shaka.
- issue: Nguvu ya swali la kinabii
  choice: “Je, mlinitolea...?”
  alternative: “Hamkuniletea... sivyo?”
  rationale: Muundo wa swali umehifadhiwa huku matarajio ya jibu la kukana yakiachwa yatokane na muktadha, hivyo kutoondoa mvutano wa nukuu ya Amosi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kibiblia “jeshi la mbinguni” na “nyumba ya Israeli” umehifadhiwa, huku sentensi nyingine zikitumia lugha inayoeleweka kwa msomaji wa kawaida.
