  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: sw
  text: 'Naye akasema, “Ndugu na baba, sikilizeni: Mungu wa utukufu alimtokea baba yetu Abrahamu alipokuwa katika Mesopotamia, kabla hajakaa Harani.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Naye akasema
  rationale: δέ ni kiunganishi chepesi cha simulizi; “Naye akasema” hudumisha mwendelezo kwa Kiswahili cha kawaida bila kusisitiza utofautishaji usio wazi.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Ndugu na baba
  rationale: Hii ni salamu rasmi kwa wanaume waliokuwa wakisikiliza. Katika Kiswahili, “ndugu na baba” huwasilisha kwa kawaida mahusiano na heshima ya maneno haya; ἄνδρες ni sehemu ya mtindo rasmi wa wito wala haihitaji kutafsiriwa kando kuwa “wanaume.”
- source_word: ἀκούσατε
  choice: sikilizeni
  rationale: Amri hii inawaita wasikilizaji watoe usikivu; “sikilizeni” ni ya moja kwa moja na ya kawaida.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: Mungu wa utukufu
  rationale: Huhifadhi muundo wa umilikishi wa Kigiriki na mwangwi wake wa lugha ya Maandiko bila kuugeuza kuwa kivumishi.
- source_word: ὤφθη
  choice: alimtokea
  rationale: Katika muktadha wa Mungu kujidhihirisha, kitenzi hiki humaanisha “alitokea”; tafsiri hii ni ya karibu kuliko “alijifunua,” ambayo ni ya kufasiri zaidi.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: baba yetu Abrahamu
  rationale: Huhifadhi utambulisho wa pamoja wa msemaji na hadhira yake na Abrahamu, huku ikitumia mpangilio wa kawaida wa Kiswahili.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: alipokuwa Mesopotamia
  rationale: Kirai shiriki kina maana ya wakati au hali; “alipokuwa” ni wazi na cha kawaida katika Kiswahili.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: kabla hajakaa Harani
  rationale: κατοικέω inaweza kumaanisha kukaa, kuishi, au kufanya makao. “Kukaa” ni pana na ya kawaida, na haiongezi dhana ya kudumu iliyomo wazi zaidi katika “kufanya makao.”
theological_decisions:
- issue: Namna ya kutafsiri wito wa hadhira wenye maneno ya kiume
  choice: Ndugu na baba
  alternative: Enyi wanaume, ndugu na baba
  rationale: “Ndugu na baba” hudumisha jinsia na heshima ya wito katika Kiswahili cha kawaida. Kutaja “wanaume” kando kungekuwa tafsiri ngumu ya ἄνδρες, ambalo hapa ni sehemu ya fomula rasmi ya wito.
- issue: Namna ya kutafsiri cheo θεὸς τῆς δόξης
  choice: Mungu wa utukufu
  alternative: Mungu mwenye utukufu
  rationale: Muundo wa “wa utukufu” huhifadhi uhusiano wa nomino katika Kigiriki na mwangwi unaowezekana wa lugha ya Agano la Kale, bila kufafanua kupita kiasi aina ya uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mtindo wa hotuba rasmi umehifadhiwa bila kutumia misamiati ya kale isiyo ya lazima.
