  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: sw
  text: 'Lakini Aliye Juu Sana hakai katika vitu vilivyotengenezwa kwa mikono[a], kama vile nabii asemavyo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mahekalu yaliyotengenezwa kwa mikono.” Kigiriki kina maana pana zaidi, “katika vitu vilivyotengenezwa kwa mikono,” ingawa hekalu ndilo linalozungumziwa moja kwa moja katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Inaonyesha utofautishaji wenye nguvu na kauli iliyotangulia kuhusu Sulemani kumjengea Mungu nyumba.
- source_word: ὁ ὕψιστος
  choice: Aliye Juu Zaidi
  rationale: Ni jina la heshima linalomtaja Mungu bila kuongeza neno “Mungu,” ambalo halipo wazi katika Kigiriki.
- source_word: ἐν χειροποιήτοις
  choice: katika vitu vilivyotengenezwa kwa mikono
  rationale: Inahifadhi maana pana ya kivumishi cha Kigiriki katika wingi na haifupishi maana kuwa mahekalu pekee, ingawa hekalu ndilo muktadha wa karibu.
- source_word: κατοικεῖ
  choice: hakai
  rationale: Ni usemi wa kawaida na wenye hadhi katika Kiswahili kwa habari ya mahali pa kukaa au kuwapo kwa Mungu.
- source_word: καθὼς
  choice: kama vile
  rationale: Inaonyesha kuwa nukuu ya kinabii inayofuata inathibitisha kauli iliyotangulia.
- source_word: ὁ προφήτης λέγει
  choice: nabii asemavyo
  rationale: Inahifadhi kutotajwa kwa jina la nabii na dhana ya wakati wa sasa ya fomula ya kunukuu Maandiko, kwa mtiririko wa asili wa Kiswahili.
theological_decisions:
- issue: Iwapo χειροποιήτοις itajwe hasa kuwa “mahekalu” katika matini kuu
  choice: Kuhifadhi usemi mpana “vitu vilivyotengenezwa kwa mikono”
  alternative: “mahekalu yaliyotengenezwa kwa mikono”
  rationale: Muktadha wa karibu unahusu hekalu, lakini neno la Kigiriki lina maana pana zaidi na linaendeleza ukosoaji wa vitu au majengo ya ibada yaliyofanywa na wanadamu.
- issue: Iwapo ὁ ὕψιστος ipanuliwe kuwa “Mungu Aliye Juu Zaidi”
  choice: “Aliye Juu Zaidi”
  alternative: “Mungu Aliye Juu Zaidi”
  rationale: Mhusika ni Mungu kwa wazi, lakini θεός halipo katika matini; tafsiri inahifadhi jina la heshima bila kuongeza neno lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo “Aliye Juu Zaidi” umetumiwa kama jina la heshima, na “nabii asemavyo” hudumisha mtiririko wa kifasihi unaofaa kwa utangulizi wa nukuu.
