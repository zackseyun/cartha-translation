  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: sw
  text: Baba zetu hawakutaka kumtii, bali walimkataa[a] na mioyoni mwao wakageukia Misri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimsukuma kando.” Kitenzi cha Kigiriki kinaweza kudokeza kumtupilia Musa mbali.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wakiwa bado nyikani, mioyoni mwao walitamani kurudi Misri.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: kumtii
  rationale: Kiwakilishi cha urejeshi katika hali ya dative kinamrejelea Musa; Kiswahili huingiza mtendwa katika kitenzi ‘kumtii’.
- source_word: οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι
  choice: hawakutaka kumtii
  rationale: Huhifadhi kukataa kwa hiari kulikomo katika οὐκ ἠθέλησαν na kutoa Kiswahili cha kawaida; ‘kumtii’ huwasilisha maana ya ὑπήκοοι γενέσθαι bila muundo mzito wa ‘kuwa watiifu kwake’.
- source_word: οἱ πατέρες ἡμῶν
  choice: Baba zetu
  rationale: Ni tafsiri ya moja kwa moja, yenye hadhi, ya mababu wa Israeli; muktadha unaonyesha kuwa si baba zao wa karibu tu.
- source_word: ἀπώσαντο
  choice: walimsukumia mbali
  rationale: Huhifadhi picha halisi ya kumsukuma Musa pembeni na pia hudokeza kumkataa, badala ya kufuta taswira hiyo kwa neno la jumla pekee.
- source_word: ἐστράφησαν ἐν ταῖς καρδίαις αὐτῶν
  choice: mioyoni mwao wakageukia
  rationale: Huhifadhi nahau ya kibiblia ya moyo kama kitovu cha tamaa na nia, pamoja na wazo la kugeuka kwa ndani.
- source_word: εἰς Αἴγυπτον
  choice: Misri
  rationale: Pamoja na ‘wakageukia,’ huonyesha mwelekeo kuelekea Misri kwa Kiswahili cha asili bila uradidi.
theological_decisions:
- issue: Hali ya kugeukia Misri
  choice: mioyoni mwao wakageukia Misri
  alternative: walirudi Misri mioyoni mwao
  rationale: Kirai cha Kigiriki kinaonyesha mwelekeo wa ndani wa tamaa na uaminifu, si lazima safari halisi. Tafsiri inaacha mvutano huo bila kuufanya kuwa mfano tu wala kurudi kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Baba zetu’ huhifadhi usemi wa kifungu, huku tanbihi ikifafanua maana ya kugeukia Misri moyoni.
