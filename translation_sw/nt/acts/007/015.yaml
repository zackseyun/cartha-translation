  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: sw
  text: Yakobo akashuka kwenda Misri. Akafa, yeye pamoja na baba zetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mababu zetu.” Kigiriki kinasema “baba zetu,” kikimaanisha mababu wa Israeli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: akashuka kwenda
  rationale: Inahifadhi maana ya mwendo wa kushuka iliyo katika kitenzi cha Kigiriki, huku ikiwa ya kawaida katika Kiswahili kwa safari ya kwenda Misri.
- source_word: Ἰακώβ
  choice: Yakobo
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: εἰς Αἴγυπτον
  choice: kwenda Misri
  rationale: Kihusishi εἰς kinaonyesha mwendo kuelekea na kuingia mahali; katika Kiswahili, ‘kwenda Misri’ ni usemi wa kawaida na unaoeleweka.
- source_word: ἐτελεύτησεν
  choice: akafa
  rationale: Ni tafsiri ya moja kwa moja na wazi ya kitenzi cha kawaida kinachomaanisha kufa.
- source_word: αὐτὸς
  choice: yeye
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kimehifadhiwa ili kumtaja Yakobo kabla ya kuongeza baba zetu.
- source_word: οἱ πατέρες ἡμῶν
  choice: baba zetu
  rationale: Inahifadhi neno la kiume ‘baba’ la Kigiriki na rejeo lake kwa mababu wa Israeli, bila kulifanya kuwa neno la jumla lisiloonyesha jinsia.
theological_decisions:
- issue: Tafsiri ya πατέρες katika historia ya mababu wa Israeli
  choice: baba zetu
  alternative: mababu zetu
  rationale: ‘Baba zetu’ huhifadhi kwa karibu usemi wa Kigiriki na utambulisho wa kihistoria wa Stefano pamoja na baba wa Israeli; tanbihi inaeleza kwamba maana yake hapa ni mababu wa taifa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo ‘akashuka kwenda Misri’ huhifadhi mwelekeo wa Kigiriki bila kuwa mgumu; ‘yeye pamoja na’ huepuka marudio yasiyo ya kawaida huku ikihifadhi mkazo wa αὐτός.
