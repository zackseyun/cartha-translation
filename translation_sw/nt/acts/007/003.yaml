  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: sw
  text: Akamwambia, “Ondoka katika nchi yako na uwaache jamaa zako,[a] kisha uje katika nchi nitakayokuonyesha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu zako” au “ukoo wako.” Neno la Kigiriki συγγένεια linamaanisha kundi la jamaa au ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: akamwambia
  rationale: Muundo huu wa kawaida wa kisimulizi unawakilisha kitenzi na kiwakilishi cha Kigiriki kwa Kiswahili cha asili bila kubadili kiwakilishi kuwa jina la Abrahamu.
- source_word: Ἔξελθε
  choice: Ondoka
  rationale: Amri hii inaeleza kuacha mahali alikokuwa; “ondoka” ni ya kawaida na yenye nguvu ya uelekeo katika muktadha huu.
- source_word: ἐκ τῆς γῆς σου
  choice: katika nchi yako
  rationale: “Nchi” huhifadhi maana ya eneo analotoka bila kulazimisha wazo la taifa la kisasa; pamoja na “ondoka katika” huonyesha mwendo wa kutoka.
- source_word: συγγενείας
  choice: jamaa zako
  rationale: “Jamaa” ni neno la kawaida na la pamoja kwa kundi la ndugu wa ukoo, likihifadhi upana wa συγγένεια kuliko “familia” pekee.
- source_word: δεῦρο
  choice: uje
  rationale: Huhifadhi mtazamo wa deiktiki wa “njoo” katika usemi wa Mungu, huku kiunganishi “kisha” kikifanya mfululizo wa amri usomeke kwa kawaida.
- source_word: εἰς τὴν γῆν
  choice: katika nchi
  rationale: Kirai hiki huonyesha mwendo wa kuingia au kufika ndani ya eneo, kulingana na εἰς.
- source_word: ἣν ἄν σοι δείξω
  choice: nitakayokuonyesha
  rationale: Muundo wa Kiswahili unaonyesha kwa kawaida rejeo la wakati ujao la kishazi cha Kigiriki bila kudokeza kutokuwa na uhakika.
