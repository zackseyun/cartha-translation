  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: sw
  text: Basi Musa alikimbia kwa sababu ya kauli hii[a], akawa mgeni[b] katika nchi ya Midiani, ambako akawa baba wa wana wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kauli hii.” Kirai cha Kigiriki kinaweza kuonyesha kauli iliyomsukuma Musa kukimbia.
    reason: lexical_alternative
  - marker: b
    text: Yaani, aliishi katika nchi ambayo haikuwa yake akiwa mtu wa kutoka nchi nyingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: akakimbia
  rationale: Kitenzi hiki kinaonyesha Musa alikimbia au aliondoka ili kuepuka hatari; “akakimbia” ni cha kawaida na kinahifadhi nguvu ya tendo hilo.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi huku ikiunganisha kitendo cha Musa na yaliyotangulia; “Basi” ni kiunganishi cha asili katika simulizi la Kiswahili.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: kwa sababu ya maneno hayo
  rationale: Katika muktadha huu, usemi huo unaonyesha kwamba kauli iliyotolewa ndiyo iliyochochea Musa kukimbia. “Maneno” pia linaweza kurejelea ujumbe au kauli nzima, si neno moja tu.
- source_word: ἐγένετο πάροικος
  choice: akaenda kuishi akiwa mgeni
  rationale: πάροικος ni mtu anayeishi katika nchi isiyo yake. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha hali ya ukaaji wa kigeni bila kudokeza kwa lazima kwamba ulikuwa mfupi.
- source_word: ἐν γῇ Μαδιάμ
  choice: katika nchi ya Midiani
  rationale: Tafsiri hii inawakilisha wazi γῇ na kudumisha usemi wa kijiografia wa Kigiriki.
- source_word: οὗ
  choice: ambako
  rationale: Kielezi hiki kinarejelea nchi ya Midiani kama mahali ambapo Musa alipata wana.
- source_word: ἐγέννησεν
  choice: akazaa
  rationale: Kwa mhusika wa kiume, Kiswahili cha kawaida kinaweza kusema “akazaa wana,” yaani akawa baba yao; uchaguzi huu ni mfupi na wa asili, ingawa “akapata wana” pia yawezekana.
- source_word: υἱοὺς δύο
  choice: wana wawili
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kirai hicho.
