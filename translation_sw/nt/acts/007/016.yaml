base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: sw
  text: Nao wakahamishwa mpaka Shekemu, wakawekwa katika kaburi ambalo Ibrahimu alikuwa amenunua kwa bei ya fedha kutoka kwa wana wa Hamori huko Shekemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Stefano yanaunganisha maelezo ambayo wasomaji wanaweza kuyalinganisha na Mwanzo 23, ambako Ibrahimu ananunua mahali pa kuzikia kutoka kwa Efroni huko Makpela, na Mwanzo 33:19, ambako Yakobo ananunua ardhi karibu na Shekemu kutoka kwa wana wa Hamori.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: walihamishwa
  rationale: Kitenzi hiki katika hali tendwa kinaeleza kuhamishwa kwa mabaki ya wazee hao kutoka mahali pamoja kwenda pengine; “walihamishwa” ni Kiswahili cha kawaida na cha karibu na maana ya Kigiriki.
- source_word: Συχὲμ / Συχέμ
  choice: Shekemu
  rationale: Hili ni umbo la jina la mahali lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: ἐτέθησαν
  choice: kuzikwa
  rationale: Ingawa maana ya msingi ni “waliwekwa,” katika muktadha wa kaburi Kiswahili cha asili hutumia “kuzikwa”; maana ya mazishi inabaki wazi bila usemi usio wa kawaida.
- source_word: μνήματι
  choice: kaburi
  rationale: Neno hili humaanisha mahali pa kuzikia; “kaburi” ni neno la kawaida, lenye heshima, na linaloeleweka kwa urahisi.
- source_word: ᾧ
  choice: ambalo
  rationale: Kiwakilishi hiki kinarejelea “kaburi” na kuanzisha kishazi husishi kwa njia ya kawaida katika Kiswahili.
- source_word: ὠνήσατο
  choice: alikuwa amenunua
  rationale: Kitenzi kina maana ya kununua; wakati timilifu unaonyesha kuwa ununuzi ulitangulia maziko yanayosimuliwa.
- source_word: τιμῆς ἀργυρίου
  choice: kwa kiasi cha fedha
  rationale: Usemi huu huhifadhi wazo la thamani au bei iliyolipwa kwa fedha bila kudokeza kiasi ambacho hakikutajwa.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: kutoka kwa wana wa Hamori
  rationale: παρά pamoja na hali ya umilikaji huonyesha chanzo; tafsiri hii inafuata wazi muundo na maana ya Kigiriki.
- source_word: ἐν Συχέμ
  choice: huko Shekemu
  rationale: Usemi huu unahifadhi rejeo la mahali bila kulazimisha uamuzi kama unamhusu Hamori, wanawe, au mahali shughuli ya ununuzi ilipofanyika.
theological_decisions:
- issue: Mvutano wa kihistoria na masimulizi ya ununuzi wa mahali pa kuzikia katika Mwanzo
  choice: 'Maneno ya Stefano yamehifadhiwa kama yalivyo katika Kigiriki: Abrahamu alinunua kaburi kutoka kwa wana wa Hamori huko Shekemu.'
  alternative: Kuyapatanisha na ununuzi wa Yakobo katika Mwanzo 33:19, au na ununuzi wa Abrahamu huko Makpela katika Mwanzo 23.
  rationale: Tafsiri inapaswa kuwakilisha matini ya Kigiriki bila kuingiza upatanisho kutoka vifungu vingine. Tanbihi huwasaidia wasomaji kuona vifungu vinavyohusiana huku mvutano uliopo ukihifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili bila kufuta utata wa kishazi cha mwisho au mvutano na masimulizi ya Mwanzo.
