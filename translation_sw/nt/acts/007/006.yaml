  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: sw
  text: 'Lakini Mungu alisema hivi: “Uzao wake utakuwa mgeni katika nchi isiyo yao[a], nao watautia utumwani na kuutendea vibaya kwa miaka mia nne.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au kwa kutumia wingi: “Wazao wake watakuwa wageni katika nchi isiyo yao, nao watawatia utumwani na kuwatendea vibaya kwa miaka mia nne.” Kigiriki kinatumia umoja wenye maana ya pamoja: “uzao ... huo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Lakini Mungu alisema hivi
  rationale: “Lakini” linaonyesha mwendelezo wenye badiliko dogo unaoletwa na δέ; “alisema hivi” linaweka wazi οὕτως na kutambulisha maneno yanayofuata kwa Kiswahili cha kawaida.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: uzao wake
  rationale: “Uzao” ni nomino ya umoja yenye maana ya pamoja, hivyo hurejelea wazao wa Abrahamu huku ikihifadhi umbo la umoja la Kigiriki.
- source_word: πάροικον
  choice: mgeni
  rationale: Katika muktadha huu neno humaanisha mtu anayeishi katika nchi isiyo yake, asiye mwenyeji wa huko. “Mgeni” ni fupi, asilia, na linafaa pamoja na kirai kinachofuata.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: katika nchi isiyo yao
  rationale: ἀλλοτρίᾳ linaonyesha nchi ya wengine, si nchi ya uzao huo. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi wazo la kutokuwa kwao.
- source_word: δουλώσουσιν αὐτὸ
  choice: wataufanya kuwa mtumwa
  rationale: Kitenzi kinaonyesha kuingizwa utumwani. Kiambishi “-u-” kinakubaliana na “uzao” wa umoja na hivyo kuhifadhi umoja wa pamoja wa σπέρμα ... αὐτό.
- source_word: κακώσουσιν
  choice: kuutendea vibaya
  rationale: Huwasilisha maana pana ya kusababisha mateso au kumdhulumu mtu bila kubana maana kuwa aina moja maalumu ya ukandamizaji.
- source_word: ἔτη τετρακόσια
  choice: kwa miaka mia nne
  rationale: “Kwa” huonyesha muda ambao vitendo hivyo vitaendelea, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Umoja wa pamoja katika maneno yanayorejelea uzao wa Abrahamu
  choice: 'Umoja umehifadhiwa: “uzao wake ... wataufanya ... kuutendea.”'
  alternative: 'Kutumia wingi wa kawaida zaidi: “wazao wake ... watawafanya ... kuwatendea.”'
  rationale: Kigiriki kina nomino na kiwakilishi cha umoja vyenye maana ya pamoja (σπέρμα ... αὐτό). Kiswahili kinaweza kuhifadhi hali hii kwa njia ya kawaida kupitia “uzao” na viambishi vya ngeli yake, bila kuondoa sifa hiyo ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Uzao” na viambishi vya ngeli ya 11 vimetumiwa kuhifadhi umoja wa pamoja wa maandishi ya Kigiriki.
