base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: sw
  text: Baada ya kumtoa kwa nguvu nje ya jiji, walikuwa wakimpiga kwa mawe. Mashahidi waliweka nguo zao za nje[a] miguuni mwa kijana mmoja aliyeitwa Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguo zao” au “mavazi yao”; neno la Kigiriki linarejelea kwa upana mavazi ya nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: baada ya kumtoa kwa nguvu
  rationale: Muundo huu unaonyesha kwamba kitendo cha kumtoa kilitangulia kile cha kumpiga kwa mawe, na pia unahifadhi wazo la kuondolewa kwa nguvu.
- source_word: ἔξω τῆς πόλεως
  choice: nje ya jiji
  rationale: Hueleza mwendo kutoka ndani ya jiji kwenda nje yake kwa Kiswahili cha kawaida.
- source_word: ἐλιθοβόλουν
  choice: wakawa wakimpiga kwa mawe
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililokuwa likiendelea; muundo wa ‘wakawa waki-’ unahifadhi hali hiyo.
- source_word: οἱ μάρτυρες
  choice: Mashahidi
  rationale: Katika muktadha huu neno linamaanisha mashahidi wa kisheria, si ‘wafia imani.’
- source_word: ἀπέθεντο
  choice: wakaweka
  rationale: Ni usemi wa kawaida unaoonyesha kwamba walivua au waliweka pembeni mavazi hayo na kuyatia mahali palipotajwa.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: mavazi yao ya nje
  rationale: ἱμάτια ni neno pana kwa mavazi, mara nyingi hasa mavazi ya nje; tafsiri hii ni sahihi na inaeleweka kwa urahisi.
- source_word: παρὰ τοὺς πόδας
  choice: miguuni pa
  rationale: Huu ni usemi wa asili wa Kiswahili kwa kuweka kitu karibu na miguu ya mtu au chini ya uangalizi wake.
- source_word: νεανίου
  choice: kijana mmoja
  rationale: νεανίας humaanisha mwanamume mwenye umri mdogo; ‘kijana mmoja’ ni ya kawaida na haidokezi mtoto.
- source_word: καλουμένου Σαύλου
  choice: aliyeitwa Sauli
  rationale: Huwasilisha kwa uwazi kwamba jina la kijana huyo lilikuwa Sauli.
theological_decisions:
- issue: Maana ya μάρτυρες katika mazingira ya hukumu ya kupigwa kwa mawe
  choice: Mashahidi kwa maana ya kisheria
  alternative: Wafia imani
  rationale: Muktadha unawahusu wale waliotoa ushahidi na kushiriki katika utekelezaji wa hukumu. Maana ya baadaye ya ‘wafia imani’ haifai kuingizwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘wakawa wakimpiga’ unahifadhi tendo linaloendelea bila kufanya sentensi iwe ngumu; ‘jiji’ linafaa kwa πόλις katika muktadha huu.
