  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: sw
  text: Kisha Yosefu akatuma kumwita Yakobo, baba yake, na jamaa zake wote[a]. Idadi yao ilikuwa watu sabini na watano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya vifungu vya Agano la Kale vinataja jumla ya watu “sabini” (kwa mfano, maandishi ya Kiebrania ya Mwanzo 46:27 na Kutoka 1:5); hapa Matendo inasema “sabini na watano.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: akatuma watu
  rationale: Kirai hiki cha wakati uliopita kinaonyesha kuwa Yosefu alituma wajumbe kabla ya kuwaita watu waje. Kuongeza “watu” kunafanya tendo lisikike kwa Kiswahili cha kawaida bila kubainisha zaidi ya wazo linalodokezwa na muktadha.
- source_word: δὲ
  choice: Kisha
  rationale: Huendeleza simulizi kwa kuonyesha hatua inayofuata katika masimulizi ya Stefano.
- source_word: μετεκαλέσατο
  choice: wamwite
  rationale: Kitenzi hiki kina maana ya kumwita au kumtuma mtu aende kumleta mwingine. Pamoja na “akatuma watu,” usemi huu ni wa asili katika Kiswahili na unaonyesha mwito wa kuja.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: Yakobo baba yake
  rationale: Huhifadhi moja kwa moja uhusiano wa kiambatisho uliopo katika Kigiriki.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: jamaa zake wote
  rationale: “Jamaa” kwa Kiswahili cha kawaida humaanisha kundi la watu wenye uhusiano wa ukoo, na hivyo inafaa kuliko “familia,” ambayo huenda ikaeleweka kwa maana finyu ya watu wa nyumbani.
- source_word: ἐν ψυχαῖς
  choice: jumla watu
  rationale: Huu ni usemi wa kuhesabu watu, si msisitizo wa maana ya kitheolojia ya “roho.” “Jumla watu” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἑβδομήκοντα πέντε
  choice: sabini na watano
  rationale: Ni tafsiri ya moja kwa moja ya idadi iliyo katika maandishi ya Kigiriki.
theological_decisions:
- issue: Jumla ya watu wa nyumba ya Yakobo ikilinganishwa na mapokeo ya Mwanzo
  choice: watu sabini na watano
  alternative: watu sabini
  rationale: Maandishi ya Kigiriki ya Matendo yanasema wazi “sabini na watano.” Tafsiri inalihifadhi hilo katika andiko kuu, huku tanbihi ikieleza kuwa baadhi ya vifungu vya Agano la Kale katika maandishi ya Kiebrania vina idadi ya sabini; tofauti hiyo haijapatanishwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akatuma watu wamwite” ni wa kawaida na unaeleweka kwa urahisi; “jamaa” huhifadhi wigo wa ukoo, na “jumla watu” huepuka tafsiri halisi isiyo ya kawaida ya ψυχαί kama “roho.”
