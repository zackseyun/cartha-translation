  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: sw
  text: Alipomwona mtu akitendewa isivyo haki, akamtetea na akamfanyia haki yule aliyekuwa akionewa[a] kwa kumpiga Mmisri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumlipizia kisasi yule aliyekuwa akionewa.” Usemi wa Kigiriki ἐποίησεν ἐκδίκησιν unaweza kuwa na maana ya kulipiza kisasi au kumtetea mtu ili apate haki.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kumuua Mmisri.” Kitenzi cha Kigiriki kinaweza kumaanisha tu “kupiga,” ingawa muktadha unaonyesha kwamba pigo hilo lilisababisha kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: Alipomwona
  rationale: Kitenzi tegemezi cha wakati kinaonyesha kwamba kuona kulitangulia matendo makuu yanayofuata; muundo huu ni wa kawaida katika Kiswahili.
- source_word: τινα
  choice: mtu
  rationale: Kiwakilishi hiki hakimtambulishi mtu huyo; ‘mtu’ huhifadhi hali hiyo bila kuongeza utambulisho.
- source_word: ἀδικούμενον
  choice: akitendewa isivyo haki
  rationale: Hueleza mtu anayefanyiwa uovu au dhuluma, huku ikihifadhi uzito wa kimaadili wa tendo hilo.
- source_word: ἠμύνατο
  choice: akamtetea
  rationale: Kitenzi hiki kina maana ya kuingilia kati ili kumsaidia au kumlinda mtu dhidi ya anayemdhuru.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: kumtendea haki
  rationale: Usemi huu unaweza kumaanisha kutekeleza kisasi au kumletea mtu haki. ‘Kumtendea haki’ ni wa kawaida na huhifadhi mwelekeo wa tendo kwa niaba ya aliyeonewa bila kulifanya wazi kuwa kisasi binafsi.
- source_word: τῷ καταπονουμένῳ
  choice: yule aliyekuwa akionewa
  rationale: Huwasilisha mateso au ukandamizaji uliokuwa ukiendelea na kuonyesha kwamba tendo lilifanywa kwa manufaa ya mwathiriwa.
- source_word: πατάξας
  choice: kwa kumpiga
  rationale: Maana ya msingi ni kupiga. Muktadha unaonyesha kwamba pigo lilisababisha kifo, lakini tafsiri kuu haiongezi matokeo hayo ndani ya kitenzi chenyewe.
- source_word: τὸν Αἰγύπτιον
  choice: Mmisri
  rationale: Ni nomino ya kawaida ya kumtaja mtu wa Misri kwa Kiswahili.
theological_decisions:
- issue: Maana ya ἐκδίκησιν katika tendo la Musa
  choice: kumtendea haki
  alternative: kumlipizia kisasi
  rationale: Neno la Kigiriki linaweza kuashiria haki, utetezi, au kisasi. Tafsiri kuu inaonyesha kwamba Musa alitenda kwa niaba ya aliyeonewa bila kudai kwamba kifungu kinaidhinisha kisasi binafsi; tanbihi huhifadhi maana mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja na unaendeleza mfululizo wa matendo bila kuondoa utata wa usemi unaohusu haki au kisasi.
