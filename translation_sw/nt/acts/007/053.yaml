base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: sw
  text: ninyi mlioipokea sheria kama ilivyotolewa kwa njia ya malaika,[a] lakini hamkuishika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mipango ya malaika,” au “kwa maagizo ya malaika.” Kirai cha Kigiriki kina utata, lakini kinarejelea kutolewa kwa sheria kukihusisha upatanishi wa malaika.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ninyi mlioipokea
  rationale: Muundo huu unahifadhi usemi wa moja kwa moja kwa wasikilizaji pamoja na nguvu ya shtaka ya kiwakilishi cha uhusiano cha sifa.
- source_word: ἐλάβετε
  choice: mlioipokea
  rationale: ‘Kupokea’ linafaa kwa sheria iliyokabidhiwa na halidokezi kwamba waliikubali kwa hiari kuliko inavyosema matini.
- source_word: τὸν νόμον
  choice: sheria
  rationale: Hapa neno hilo linamaanisha sheria ya Musa; ‘sheria’ ni wazi na haliongezi desturi ya herufi kubwa isiyowekwa alama katika Kigiriki.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: kama ilivyotolewa kwa njia ya malaika
  rationale: Kirai cha Kigiriki kina ugumu wa kimaana. Tafsiri hii inaeleza kwa Kiswahili cha kawaida kiini cha ushiriki wa malaika katika kutolewa kwa sheria bila kubainisha kupita kiasi namna hasa ya upatanishi huo.
- source_word: ἀγγέλων
  choice: malaika
  rationale: Muktadha unaelekeza kwa viumbe wa mbinguni waliohusishwa na kutolewa kwa sheria, si wajumbe wa kibinadamu.
- source_word: οὐκ ἐφυλάξατε
  choice: hamkuishika
  rationale: ‘Kuishika sheria’ ni usemi wa kawaida wa Kiswahili unaomaanisha kuitii au kuifuata, na unadumisha picha ya φυλάσσω kuliko ‘hamkuitii’.
theological_decisions:
- issue: Maana ya kirai cha upatanishi wa malaika εἰς διαταγὰς ἀγγέλων
  choice: Sheria ilipokewa ikiwa imetolewa kwa njia ya malaika.
  alternative: Sheria ilipokewa ‘kwa mipango ya malaika’ au ‘kwa maagizo ya malaika.’
  rationale: Matini inahusisha malaika na kutolewa kwa sheria, lakini maana mahsusi ya διαταγαί na uhusiano wa kisarufi wa kirai hicho vina utata. Tafsiri kuu inahifadhi dai la msingi, nayo tanbihi inadumisha njia nyingine halisi za kulielewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ninyi’ linaweka wazi shtaka la moja kwa moja; ‘lakini’ linaonyesha kwa kawaida tofauti kati ya kupokea sheria na kutoiweka. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
