source:
  edition: SBLGNT
  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: sw
  text: Lakini yule aliyekuwa akimdhulumu jirani yake akamsukuma mbali[a], akisema, “Ni nani aliyekuweka wewe kuwa mtawala na mwamuzi juu yetu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamsukuma kando.” Kitenzi cha Kigiriki kinaweza kukazia msukumo wa nguvu au tendo la kumkataa kwa dharau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: aliyekuwa akimdhulumu
  rationale: Muundo wa wakati unaoendelea unaonyesha tendo lililokuwa likifanyika, na ‘kumdhulumu’ huhifadhi maana ya kumtendea mtu isivyo haki bila kuamua aina maalumu ya madhara.
- source_word: πλησίον
  choice: jirani yake
  rationale: ‘Jirani’ ni kisawe cha kawaida cha πλησίον na hudumisha uhusiano wa kileksika bila kuongeza wazi kwamba alikuwa Mwisraeli mwenzake.
- source_word: ἀπώσατο
  choice: akamsukuma mbali
  rationale: Kitenzi kinaweza kueleza tendo la kimwili lenye nguvu pamoja na kumkataa kwa dharau; ‘akamsukuma mbali’ kinafaa katika tukio hili na kudumisha hali yake halisi.
- source_word: κατέστησεν
  choice: aliyekuweka
  rationale: Katika swali hili ‘kuweka’ ni Kiswahili cha asili kinachoonyesha kumteua mtu katika nafasi ya mamlaka.
- source_word: ἄρχοντα
  choice: mtawala
  rationale: ‘Mtawala’ huwasilisha moja kwa moja dhana ya mtu mwenye mamlaka juu ya wengine.
- source_word: δικαστὴν
  choice: mwamuzi
  rationale: ‘Mwamuzi’ ni tafsiri ya kawaida na inafaa kwa mtu anayetoa hukumu katika mgogoro.
- source_word: ἐφ’ ἡμῶν
  choice: juu yetu
  rationale: Kirai hiki kinapinga mamlaka ambayo Musa angekuwa nayo juu ya kundi; ‘juu yetu’ huhifadhi maana hiyo.
