  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: sw
  text: Njaa ikaja juu ya Misri yote na Kanaani yote, na kukawa na taabu kubwa, na baba zetu[a] hawakuweza kupata chakula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mababu zetu. Kigiriki kinasema “baba zetu,” kikirejelea mababu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: Njaa ikaja
  rationale: Muundo huu wa kisimulizi unawasilisha kutokea kwa njaa kwa Kiswahili cha kawaida. Kiunganishi δέ kinawakilishwa kwa mfuatano wa kitenzi bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: katika nchi yote ya Misri na Kanaani
  rationale: Hueleza kuenea kwa njaa katika maeneo yote mawili kwa lugha ya kawaida, huku 'nchi yote' ikitoa wigo wa ὅλην bila kudokeza kwamba Misri pekee ndiyo inayohusika.
- source_word: θλῖψις μεγάλη
  choice: taabu kubwa
  rationale: Hueleza dhiki au hali ngumu sana iliyoambatana na njaa bila kuipa maana maalumu ya kieskatolojia.
- source_word: οὐχ ηὕρισκον
  choice: hawakuweza kupata
  rationale: Huwasilisha nguvu ya hali iliyoendelea ya kutopata katika kitenzi cha wakati usiotimilifu, badala ya tukio moja tu.
- source_word: χορτάσματα
  choice: chakula
  rationale: Ni neno pana na la kawaida kwa vyakula au mahitaji ya chakula; halibani maana kuwa nafaka au malisho ya mifugo pekee.
- source_word: οἱ πατέρες ἡμῶν
  choice: baba zetu
  rationale: Huhifadhi lugha ya asili iliyo ya kiume na rejeo lake kwa mababu wa Israeli; ufafanuzi wa maana ya kimuktadha umetolewa katika tanbihi.
theological_decisions:
- issue: Lugha ya mababu yenye jinsia ya kiume
  choice: baba zetu
  alternative: mababu zetu
  rationale: Kigiriki kinasema kihalisi 'baba zetu' na kinarejelea mababa wa Israeli katika historia ya wokovu. Tafsiri inahifadhi umbo hilo badala ya kulifanya lisilo na jinsia, huku tanbihi ikifafanua maana yake ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kisimulizi ni wa kawaida, na msamiati unaeleweka kwa wasomaji wengi bila kupoteza upeo wa kijiografia wala uzito wa taabu.
