  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: sw
  text: Wakati huo Musa alizaliwa, naye alikuwa mzuri machoni pa Mungu.[a] Alilelewa kwa muda wa miezi mitatu katika nyumba ya baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa mwenye kuvutia machoni pa Mungu.” Neno la Kigiriki linaweza pia kumaanisha “mwenye sura nzuri” au “bora,” lakini Mungu anatajwa wazi katika kifungu hicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi rejeo la wakati bila kufuata muundo wa Kigiriki kwa ugumu.
- source_word: ἐγεννήθη
  choice: alizaliwa
  rationale: Katika muktadha wa kuzaliwa, umbo hili la γεννάω lina maana ya kawaida ya ‘alizaliwa.’
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἀστεῖος
  choice: mzuri
  rationale: Neno hili linaweza kumaanisha mwenye sura nzuri au aliye bora; ‘mzuri’ huhifadhi upana huo bila kuongeza tafsiri ya ‘wa pekee.’
- source_word: τῷ θεῷ
  choice: machoni pa Mungu
  rationale: Dativi inaeleza tathmini au mtazamo wa Mungu. Usemi huu ni wa asili katika Kiswahili na unahifadhi rejeo la wazi kwa Mungu.
- source_word: ὃς
  choice: Alilelewa
  rationale: Kuanza sentensi mpya kwa kitenzi chenye kiambishi cha nafsi ni mtindo wa asili wa Kiswahili, na mhusika Musa anaendelea kuwa wazi.
- source_word: ἀνετράφη
  choice: alilelewa
  rationale: Kitenzi kinaeleza kulelewa au kukuzwa; ‘alilelewa’ ni wazi na kinafaa katika mazingira ya nyumbani.
- source_word: μῆνας τρεῖς
  choice: kwa muda wa miezi mitatu
  rationale: Usemi huu unaonyesha wazi kipindi cha muda na unasikika kwa kawaida katika Kiswahili.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: katika nyumba ya baba yake
  rationale: Huhifadhi maana ya mahali na uhusiano wa kifamilia kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ἀστεῖος τῷ θεῷ
  choice: alikuwa mzuri machoni pa Mungu
  alternative: alikuwa mzuri kwa Mungu; alikuwa mtoto mzuri sana
  rationale: Tafsiri inahifadhi rejeo la wazi kwa Mungu na kuonyesha kuwa uzuri unatathminiwa machoni pake, bila kuufanya usemi huo kuwa dai lenye nguvu zaidi kama ‘alipendelewa na Mungu.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Machoni pa Mungu’ ni usemi wa kawaida unaobeba maana ya tathmini ya Mungu; tanbihi inalinda uwezekano mpana wa ἀστεῖος.
