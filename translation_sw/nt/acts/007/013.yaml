base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: sw
  text: Na mara ya pili, Yosefu alitambuliwa na ndugu zake[a], na jamaa wa Yosefu wakajulikana kwa Farao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mujibu wa muktadha wa simulizi, “Yosefu alijitambulisha kwa ndugu zake.” Kitenzi cha Kigiriki kiko katika hali ya kutendwa; muktadha wa simulizi unaweza kueleweka kuwa Yosefu aliwafunulia utambulisho wake.
    reason: lexical_alternative
  - marker: b
    text: Au “familia ya Yosefu” au “ukoo wa Yosefu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: Mara ya pili
  rationale: Kirai hiki humaanisha tukio la pili. Muktadha unaonyesha kwamba ilikuwa mara ya pili ndugu za Yosefu kwenda Misri, lakini tafsiri haiongezi neno lisilokuwapo katika Kigiriki.
- source_word: ἀνεγνωρίσθη
  choice: alitambuliwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki. Katika simulizi, Yosefu ndiye aliyefunua utambulisho wake; tanbihi inaeleza maana hiyo ya kimuktadha bila kuifuta hali ya kutendwa katika matini kuu.
- source_word: ἀδελφοῖς
  choice: ndugu zake
  rationale: Katika muktadha huu neno linawarejelea ndugu wa kiume wa Yosefu. Kiswahili cha kawaida hutumia “ndugu” kwa uhusiano huo, huku muktadha ukibainisha wahusika.
- source_word: φανερὸν ἐγένετο
  choice: ikajulikana
  rationale: Hueleza kwamba jambo hilo lilikuja kufahamika, kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: γένος
  choice: familia
  rationale: Hapa neno linamaanisha jamaa au ukoo wa Yosefu, si jamii ya kikabila. “Familia” inaeleweka kwa urahisi na wasomaji wa sasa.
- source_word: τῷ Φαραώ
  choice: kwa Farao
  rationale: Huonyesha mtu ambaye habari hiyo ilimfikia na ikajulikana kwake; “kwa Farao” ni muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Iwapo ἀνεγνωρίσθη ielezwe kama kutambuliwa au kujitambulisha
  choice: alitambuliwa
  alternative: alijitambulisha / alijifanya ajulikane
  rationale: Matini kuu inahifadhi hali ya kutendwa iliyo wazi katika Kigiriki, huku tanbihi ikihifadhi uwezekano wa maana inayotokana na simulizi la Mwanzo kwamba Yosefu alifunua utambulisho wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa Kigiriki umehifadhiwa pale ambapo una maana, hasa hali ya kutendwa katika “alitambuliwa,” na utata wa kimuktadha umeelezwa katika tanbihi.
