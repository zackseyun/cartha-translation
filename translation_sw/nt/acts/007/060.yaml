base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: sw
  text: Kisha akapiga magoti, akapaza sauti kwa nguvu, “Bwana, usiwahesabie dhambi hii[a].” Baada ya kusema hayo, akalala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usiwawekee dhambi hii kwenye hesabu yao.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “akalala,” usemi wa kawaida wa kumaanisha kifo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Kisha akapiga magoti
  rationale: Nahau ya Kigiriki ina maana ya kupiga magoti. “Kisha” inaonyesha mwendelezo wa simulizi unaobebwa na δέ.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: akapaza sauti kubwa
  rationale: Usemi huu unaonyesha kilio au mwito wa nguvu kwa sauti kubwa; tafsiri hii ni ya kawaida na inahifadhi msisitizo wa sauti.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi cheo cha heshima cha κύριος na, katika muktadha, sala inaelekezwa kwa Yesu.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: usiwahesabie dhambi hii
  rationale: Hapa στήσῃς ina maana ya kuweka au kuandika kosa katika hesabu ya mtu. “Usiwahesabie” ni Kiswahili cha kawaida chenye maana hiyo, na “hii” inahifadhi kiashiria ταύτην.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Inatoa kwa Kiswahili cha kawaida uhusiano wa wakati uliomo katika kirai cha Kigiriki.
- source_word: ἐκοιμήθη
  choice: akalala
  rationale: Kigiriki kinatumia sitiari ya kulala kumaanisha kufa. “Akalala” huihifadhi badala ya kuibadilisha moja kwa moja kuwa “akafa.”
theological_decisions:
- issue: Sitiari ya kifo katika ἐκοιμήθη
  choice: akalala
  alternative: akafa
  rationale: Tafsiri inahifadhi sitiari halisi ya maandiko bila kuongeza maelezo ya kimafundisho yasiyosemwa wazi katika mstari.
- issue: Anayeitwa Κύριε katika sala ya Stefano
  choice: Bwana
  alternative: Mkuu
  rationale: Muktadha wa mstari uliotangulia unaonyesha kuwa Stefano anamwomba Yesu; “Bwana” huhifadhi cheo cha Kikristo cha Agano Jipya bila kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa moja kwa moja na unaofaa kusomwa kwa sauti; sitiari ya Kigiriki ya kulala imehifadhiwa na kufafanuliwa katika tanbihi.
