translation:
  language: sw
  text: Waliposikia mambo hayo[a], walichomwa sana mioyoni mwao, wakamsagia meno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikasirika sana mioyoni mwao”; kitenzi cha Kigiriki kwa maana halisi ni “walipasuliwa,” kikitoa picha hai ya msukosuko mkali wa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες
  choice: Waliposikia
  rationale: Kirai tegemezi cha wakati kinaonyesha mazingira ya vitenzi vikuu; “Waliposikia” ni Kiswahili cha kawaida na huhifadhi maana ya wakati.
- source_word: δὲ
  choice: (hakutafsiriwa moja kwa moja)
  rationale: δέ hapa ni kiunganishi chepesi cha kuendeleza simulizi; muundo wa Kiswahili tayari unaendeleza tukio bila kuhitaji “basi” au “lakini,” ambazo zingeweza kuzidisha mkazo.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Wingi huu unarejelea yaliyotangulia kusemwa na Stefano; “mambo hayo” ni rejeo la kawaida na la asili katika Kiswahili.
- source_word: διεπρίοντο
  choice: walichomwa
  rationale: Kitenzi kina picha halisi ya kukatwa au kupasuliwa kabisa na kwa muktadha huu kinaonyesha msukosuko mkali wa ndani. “Walichomwa” huhifadhi picha yenye nguvu bila kutumia tafsiri nzito isiyo ya kawaida kama “walikatwa kwa msumeno.”
- source_word: ταῖς καρδίαις αὐτῶν
  choice: mioyoni mwao
  rationale: Huhifadhi wingi wa Kigiriki na kuonyesha eneo la ndani lililoathiriwa.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: wakamsagia meno
  rationale: “Kumsagia mtu meno” ni nahau ya kawaida ya Kiswahili inayoonyesha ghadhabu kali na huhifadhi taswira ya meno.
- source_word: ἐπ’ αὐτόν
  choice: -m- katika “wakamsagia”
  rationale: Kiwakilishi cha yambwa ndani ya kitenzi kinaelekeza uhasama huo kwa Stefano kwa njia ya asili katika Kiswahili.
