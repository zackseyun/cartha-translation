  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: sw
  text: aliyepata kibali mbele za Mungu na akaomba apate mahali pa kukaa kwa ajili ya Mungu wa Yakobo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maskani kwa ajili ya Mungu wa Yakobo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: aliyepata kibali
  rationale: Nahau hii humaanisha kupata kibali cha mtu; “kupata kibali” ni Kiswahili cha kawaida kinachohifadhi maana ya uhusiano badala ya neema kama dhana ya jumla.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Usemi huu wa kawaida wa kibiblia unaonyesha kuwa mtu yuko mbele ya Mungu au anakubaliwa machoni pake, bila kufafanua zaidi kuliko Kigiriki.
- source_word: ᾐτήσατο
  choice: kuomba
  rationale: Kitenzi hiki katika umbo la kati kinaonyesha kutoa ombi; “kuomba” ni wazi na cha kawaida katika muktadha huu.
- source_word: εὑρεῖν
  choice: apate
  rationale: “Apate” huwasilisha maana ya kupata au kufanikisha kupatikana kwa kitu, na ni ya asili zaidi kwa Kiswahili kuliko tafsiri halisi “aone,” bila kuibadili moja kwa moja kuwa “ajenge.”
- source_word: σκήνωμα
  choice: mahali pa kukaa
  rationale: Neno hili linaweza kumaanisha makao au maskani. “Mahali pa kukaa” linaeleweka kwa urahisi na halilazimishi mapema maana mahususi ya hema takatifu au hekalu.
- source_word: τῷ θεῷ Ἰακώβ
  choice: kwa ajili ya Mungu wa Yakobo
  rationale: Dativi inaonyesha yule ambaye makao hayo yangekuwa kwa ajili yake; “Mungu wa Yakobo” huhifadhi usemi wa agano ulio katika Kigiriki.
theological_decisions:
- issue: Aina ya jengo au makao ambayo Daudi aliomba
  choice: mahali pa kukaa kwa ajili ya Mungu wa Yakobo
  alternative: maskani kwa ajili ya Mungu wa Yakobo
  rationale: σκήνωμα ni pana kuliko istilahi mahususi ya hekalu. Tafsiri kuu inaacha wazi aina ya makao, kwa kuwa mstari unaofuata unasema kwamba Sulemani alimjengea Mungu nyumba; tanbihi inahifadhi uwezekano wa “maskani.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa kishazi umehifadhiwa kwa sababu mstari huu unaendeleza sentensi kutoka mstari uliotangulia.
