lexical_decisions:
- source_word: ἄχρι οὗ
  choice: mpaka ... alipo-
  rationale: Muundo huu wa Kiswahili unaonyesha kikomo cha wakati kwa njia ya kawaida na wazi.
- source_word: ἀνέστη
  choice: aliingia madarakani
  rationale: Katika muktadha wa mfalme, kitenzi hiki kinaonyesha kutokea au kuanza kutawala. Tafsiri hii ni ya kawaida katika Kiswahili; maana halisi ya ‘aliinuka’ imehifadhiwa katika tanbihi.
- source_word: βασιλεὺς ἕτερος
  choice: mfalme mwingine
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida, ikimtofautisha mfalme huyu na aliyemtangulia.
- source_word: ἐπ’ Αἴγυπτον
  choice: kuitawala Misri
  rationale: Katika muundo huu, kihusishi kinaonyesha mamlaka juu ya eneo. ‘Kuitawala Misri’ ni Kiswahili cha asili kuliko ‘juu ya Misri.’
- source_word: οὐκ ᾔδει
  choice: hakumjua
  rationale: Huhifadhi maana ya msingi ya kitenzi huku ikiacha wazi uwezekano wa maana pana ya kutomtambua au kutomjali Yosefu.
- source_word: τὸν Ἰωσήφ
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
