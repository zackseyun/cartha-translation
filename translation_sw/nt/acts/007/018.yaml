  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: sw
  text: mpaka mfalme mwingine alipotokea[a] kutawala Misri, ambaye hakumjua Yosefu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliinuka kutawala Misri.” Kitenzi cha Kigiriki kihalisi humaanisha “aliinuka.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “hakumjua Yosefu” yanaweza pia kumaanisha kwamba hakumtambua au hakumjali Yosefu.
