review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the cosmic contrast of heaven and earth, the rhetorical questions, and the reference to the Lord. However, “mahali pa kuweka miguu yangu” describes a place for putting one’s feet rather than the concrete object ὑποπόδιον (“footstool”). The final clause is also better rendered as “mahali pa kupumzika kwangu,” preserving the source’s “place of my rest” rather than suggesting a personal resting location.
  naturalness: The revision uses idiomatic Standard East African Swahili while retaining the elevated, scriptural rhetorical cadence. “Kiti cha kuwekea miguu yangu” is a clear and natural designation for a footstool, and “mahali pa kupumzika kwangu ni wapi?” is smoother than the draft’s possessive construction.
  terminology: “Mbingu,” “kiti changu cha enzi,” “dunia,” “nyumba,” and “Bwana” are appropriate. “Nyumba” correctly avoids prematurely specifying “hekalu.”
  issues:
  - severity: medium
    issue: ὑποπόδιον is rendered as “mahali pa kuweka miguu yangu.”
    rationale: The Greek denotes a footstool, an object, not merely a location where feet may be placed. “Kiti cha kuwekea miguu yangu” retains the concrete metaphor.
  - severity: low
    issue: The final phrase is phrased as “mahali pangu pa kupumzikia.”
    rationale: This can read as “my place in which to rest.” “Mahali pa kupumzika kwangu” more directly reflects τόπος τῆς καταπαύσεώς μου, “place of my rest.”
  revised_text: Mbingu ni kiti changu cha enzi, na dunia ni kiti cha kuwekea miguu yangu. Mtanijengea nyumba ya namna gani, asema Bwana, au mahali pa kupumzika kwangu ni wapi?
