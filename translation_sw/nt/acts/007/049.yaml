id: ACT.7.49
reference: Acts 7:49
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: sw
  text: Mbingu ni kiti changu cha enzi, na dunia ni kiti cha kuwekea miguu yangu. Mtanijengea nyumba ya namna gani, asema Bwana, au mahali pa kupumzika kwangu ni wapi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: Mbingu
  rationale: Katika dondoo hili la Isaya, neno hili linaonyesha ulimwengu wa mbinguni kwa kulinganishwa na dunia, si anga inayoonekana tu.
- source_word: θρόνος
  choice: kiti changu cha enzi
  rationale: Hii ni tafsiri ya kawaida na ya kueleweka ya kiti cha mamlaka ya kifalme, na inadumisha taswira ya asili.
- source_word: γῆ
  choice: dunia
  rationale: Hapa maana ni ya ulimwengu mzima kwa kuwa neno hili linalinganishwa na mbingu, wala si nchi au eneo fulani.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: mahali pa kuweka miguu yangu
  rationale: Kauli hii ya asili ina maana ya kigoda au sehemu ya kuegeshea miguu; muundo uliochaguliwa ni wa kawaida katika Kiswahili na unadumisha kutajwa wazi kwa miguu.
- source_word: ποῖον
  choice: ya namna gani
  rationale: Neno hili linauliza sifa au aina ya nyumba, si utambulisho wake tu, na linaendeleza nguvu ya swali la balagha.
- source_word: οἶκον
  choice: nyumba
  rationale: Kigiriki kinasema 'nyumba.' Ingawa muktadha unahusu hekalu, tafsiri hii haifafanui zaidi ya matini.
- source_word: οἰκοδομήσετέ
  choice: mtanijengea
  rationale: Wakati ujao wa swali la balagha unawakilishwa moja kwa moja, huku kiambishi cha yambwa kikionyesha 'kwa ajili yangu' kwa Kiswahili cha kawaida.
- source_word: κύριος
  choice: Bwana
  rationale: Hii ndiyo tafsiri ya kawaida ya κύριος katika Agano Jipya na inafaa katika utangulizi wa maneno ya Mungu.
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: mahali pangu pa kupumzikia
  rationale: Muundo huu ni wa asili katika Kiswahili na unadumisha wazo la mahali ambapo Mungu anapumzika bila kulitanua kitheolojia.
theological_decisions:
- issue: Tafsiri ya κύριος katika dondoo la Isaya ambamo Mungu wa Israeli ndiye anayesema
  choice: Bwana
  alternative: BWANA
  rationale: Matini ya SBLGNT ina κύριος. Kwa kuwa huu ni unukuu wa Agano la Kale uliowasilishwa katika Kigiriki cha Agano Jipya, 'Bwana' hufuata ushahidi wa matini moja kwa moja bila kubadili neno kuwa jina la agano lisiloandikwa hapa.
- issue: Maana ya οἶκος katika muktadha unaohusu hekalu
  choice: nyumba
  alternative: hekalu
  rationale: Kuchagua 'nyumba' huhifadhi neno pana la Kigiriki na mvutano wa swali la balagha; muktadha wenyewe unaonyesha uhusiano wake na hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa kishairi na maswali mawili ya balagha umehifadhiwa; hakuna istilahi ya kimadhehebu iliyoingizwa.
