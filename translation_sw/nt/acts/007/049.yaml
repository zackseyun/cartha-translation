- from: Mbingu ni kiti changu cha enzi, na dunia ni mahali pa kuweka miguu yangu. Mtanijengea nyumba ya namna gani, asema Bwana, au mahali pangu pa kupumzikia ni wapi?
  to: Mbingu ni kiti changu cha enzi, na dunia ni kiti cha kuwekea miguu yangu. Mtanijengea nyumba ya namna gani, asema Bwana, au mahali pa kupumzika kwangu ni wapi?
  rationale: Revised only the two expressions where the draft either weakened the concrete image of a footstool or slightly shifted the genitive sense of “my rest.” No footnote is required in Swahili because the revised wording directly expresses the source text without introducing a significant unresolved alternative.
