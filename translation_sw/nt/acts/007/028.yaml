lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: Je, unataka
  rationale: Swali la Kigiriki linatarajia jibu la kukataa, lakini Kiswahili cha kawaida huwasilisha shtaka hili kwa ufasaha kwa ‘Je, unataka’ bila kulazimisha jibu ndani ya tafsiri.
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: kuniua / ulivyomuua
  rationale: Katika muktadha huu, kitenzi ἀναιρέω humaanisha kuua; kurudia mzizi wa ‘ua’ kunahifadhi ulinganifu wa kauli ya asili.
- source_word: ὃν τρόπον
  choice: kama ... -vyo-
  rationale: Muundo wa asili unaonyesha ulinganisho wa namna; ‘kama ulivyomuua’ ni wa asili na wazi katika Kiswahili.
- source_word: ἐχθὲς
  choice: jana
  rationale: Ni maana ya moja kwa moja ya kielezi cha wakati.
- source_word: τὸν Αἰγύπτιον
  choice: yule Mmisri
  rationale: ‘Mmisri’ hutambulisha mtu kwa taifa lake; ‘yule’ husaidia kurejelea mtu maalumu aliyejulikana kutokana na tukio la awali.
