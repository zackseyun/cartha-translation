  text: Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: sw
  text: Lakini Sulemani alimjengea nyumba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu”; Kigiriki, “nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Sulemani
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika Biblia na Kiswahili sanifu.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti wa kiasi na kauli inayotangulia, huku kikiendeleza simulizi.
- source_word: οἰκοδόμησεν
  choice: alimjengea
  rationale: Kitenzi kinamaanisha kujenga jengo halisi; umbo la Kiswahili lenye kiambishi cha mtendewa linaunganisha kwa kawaida wazo la kumjengea Mungu.
- source_word: αὐτῷ
  choice: -m-...-ea (alimjengea)
  rationale: Kiwakilishi cha dative kinamrejelea Mungu; Kiswahili huwasilisha kwa ufasaha maana ya 'kwa ajili yake' ndani ya kitenzi alimjengea.
- source_word: οἶκον
  choice: nyumba
  rationale: Neno la Kigiriki kwa maana ya moja kwa moja ni 'nyumba.' Ingawa hapa linarejelea hekalu, 'nyumba' huhifadhi msamiati wa Stefano na mvutano na kauli inayofuata.
theological_decisions:
- issue: Kutafsiri οἶκον kama 'nyumba' au kwa ufafanuzi kama 'hekalu'
  choice: nyumba
  alternative: hekalu
  rationale: '''Nyumba'' huhifadhi neno la kawaida lililotumiwa katika chanzo na mvutano wa kiteolojia wa kumjengea Mungu nyumba kabla ya kusema kuwa Aliye Juu Zaidi hakai katika nyumba zilizojengwa kwa mikono. ''Hekalu'' ni ufafanuzi sahihi wa kile kinachorejelewa, kwa hiyo umewekwa katika tanbihi.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa aya umehifadhiwa; 'alimjengea' ni wa kawaida na huondoa ulazima wa kirai kizito 'alimjengea yeye.'
