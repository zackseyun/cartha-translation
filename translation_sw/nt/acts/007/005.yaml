  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: sw
  text: Wala hakumpa humo urithi wowote, hata nafasi ya kukanyaga mguu[a]. Lakini alimwahidi kwamba angempa nchi hiyo iwe milki yake, na kwamba angeupa uzao wake baada yake, ingawa hakuwa na mtoto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata sehemu ya ardhi ya kukanyaga mguu.” Usemi wa Kigiriki unamaanisha sehemu ndogo kabisa ya ardhi.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakati hakuwa na mtoto.” Muundo wa Kigiriki unaweza kueleweka kuwa wa wakati, ingawa muktadha unaunga mkono sana maana ya “ingawa hakuwa na mtoto.”
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: urithi
  rationale: “Urithi” huhifadhi maana ya mgao unaopokewa na pia muktadha wa ahadi ya agano kuhusu nchi.
- source_word: οὐδὲ βῆμα ποδός
  choice: hata sehemu ya ardhi ya kukanyaga mguu
  rationale: Hii ni nahau inayomaanisha hata kipande kidogo kabisa cha ardhi; tafsiri hii ni wazi kwa msomaji wa Kiswahili huku ikihifadhi taswira ya mguu.
- source_word: ἐπηγγείλατο
  choice: aliahidi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayoonyesha wajibu ambao Mungu alijitwika kwa ahadi.
- source_word: εἰς κατάσχεσιν
  choice: iwe milki yake
  rationale: Huwasilisha kusudi au matokeo ya kupewa nchi hiyo kuwa kitu anachomiliki.
- source_word: σπέρματι
  choice: uzao
  rationale: “Uzao” linaweza kutumiwa kwa maana ya jumla ya waliotokana na mtu, hivyo linahifadhi umbo la umoja lenye maana ya pamoja na lugha ya ahadi kwa Abrahamu.
- source_word: μετ’ αὐτόν
  choice: baada yake
  rationale: Huhifadhi moja kwa moja wazo la uzao kumiliki nchi baada ya Abrahamu.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: ingawa hakuwa na mtoto
  rationale: Muundo unaonyesha hali iliyokuwapo wakati wa ahadi; “ingawa” huleta wazi nguvu ya ukinzani inayosisitizwa na muktadha bila kuficha uwezekano wa tafsiri ya wakati.
- source_word: τέκνου
  choice: mtoto
  rationale: Neno la Kigiriki halimaanishi lazima mwana wa kiume, kwa hiyo “mtoto” ndilo chaguo sahihi na pana.
theological_decisions:
- issue: Maana ya hali ya Abrahamu kutokuwa na mtoto wakati ahadi ilipotolewa
  choice: ingawa hakuwa na mtoto
  alternative: wakati hakuwa na mtoto
  rationale: Kirai cha Kigiriki kinaweza kueleza wakati au hali, lakini hoja hapa inasisitiza kwamba ahadi ilitolewa licha ya Abrahamu kutokuwa na mtoto. Tanbihi inahifadhi uwezekano wa maana ya wakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Humo” hurejelea nchi iliyotajwa katika muktadha, na “uzao” huhifadhi lugha ya pamoja ya ahadi bila kuibana iwe mwana mmoja au kuipanua moja kwa moja kuwa “wazao.”
