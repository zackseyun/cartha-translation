  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: sw
  text: Hema ya ushuhuda ilikuwa pamoja na baba zetu jangwani[a], kama vile yule aliyesema na Musa alivyomwagiza aitengeneze kulingana na kielelezo ambacho alikuwa amekiona[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maskani ya ushuhuda.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yule anayesema na Musa.” Kigiriki hakumtaji msemaji wazi; yaweza kumaanisha Mungu au Bwana.
    reason: alternative_reading
lexical_decisions:
- source_word: σκηνὴ τοῦ μαρτυρίου
  choice: Hema ya ushuhuda
  rationale: “Hema” ni neno la kawaida na lenye hadhi kwa makao matakatifu yanayohamishika; “ya ushuhuda” huhifadhi uhusiano wa Kigiriki bila kuufafanua kupita kiasi.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: pamoja na baba zetu
  rationale: Huhifadhi maana ya dative ya kuwa pamoja nao na usemi wa Kigiriki unaowataja mababu wa Israeli kwa neno la kiume.
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: Ni usemi wa kawaida wa Kiswahili kwa mazingira ya nyika katika simulizi la safari ya Israeli.
- source_word: καθὼς διετάξατο
  choice: kama vile ... alivyomwagiza
  rationale: Hutoa wazo la ulinganifu na agizo lenye mamlaka kwa Kiswahili cha kawaida.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: yule aliyekuwa akisema na Musa
  rationale: Huhifadhi hali ya kitenzi kishirikishi cha wakati unaoendelea/kisichokamilika na humwacha msemaji bila kutajwa wazi kama ilivyo katika Kigiriki.
- source_word: ποιῆσαι αὐτὴν
  choice: aitengeneze
  rationale: Ni tafsiri ya kawaida na ya asili kwa kutengeneza hema hiyo.
- source_word: κατὰ τὸν τύπον
  choice: kulingana na kielelezo
  rationale: “Kielelezo” huwasilisha wazo la mfano au muundo ulioonyeshwa ambao ungefuatwa.
- source_word: ὃν ἑωράκει
  choice: alichokuwa amekiona
  rationale: Huwasilisha tendo la kuona lililotangulia kutolewa kwa agizo na hukubaliana na nomino “kielelezo.”
theological_decisions:
- issue: Mhusika wa “yule aliyekuwa akisema na Musa”
  choice: Msemaji hakutajwa wazi.
  alternative: “Mungu aliyesema na Musa” au “Bwana aliyesema na Musa.”
  rationale: Kigiriki kinatumia kitenzi kishirikishi kama nomino bila kumtaja msemaji; tafsiri inahifadhi kutotajwa huko badala ya kuongeza utambulisho wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hema” limetumiwa badala ya istilahi ya jadi “maskani” katika maandishi makuu kwa uwazi kwa msomaji wa kawaida; mbadala umewekwa katika tanbihi.
