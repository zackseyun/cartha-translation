  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: sw
  text: Alipokuwa akikaribia kutimiza miaka arobaini[a], ikampanda moyoni[b] kuwatembelea ndugu zake, wana wa Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wakati kipindi cha miaka arobaini kilipokuwa kikitimia kwake.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “likapanda moyoni mwake”; hii ni nahau ya kusudi au uamuzi uliozuka ndani yake.
    reason: lexical_alternative
  - marker: c
    text: “Ndugu zake” hapa ni watu wenzake wa Israeli. “Wana wa Israeli” pia inaweza kutafsiriwa “watu wa Israeli” au “Waisraeli.”
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Alipo-
  rationale: Kiunganishi hiki kinaanzisha tukio la wakati katika mwendelezo wa simulizi. Muundo wa Kiswahili wenye “alipo-” unatoa maana hiyo kwa kawaida bila kuongeza neno lisilokuwamo katika chanzo.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: alipofikisha umri wa miaka arobaini
  rationale: Kirai cha Kigiriki ni nahau kuhusu kipindi cha miaka arobaini kumtimia. Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha kwamba Musa alikuwa ametimiza miaka arobaini, bila kutumia muundo wa neno kwa neno usio wa kawaida.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: akaazimia moyoni
  rationale: Nahau ya chanzo inaeleza kusudi au uamuzi uliozuka ndani yake. “Akaazimia moyoni” ni Kiswahili cha kawaida kinachobakiza mahali pa ndani—moyoni—bila kutafsiri kwa namna ngumu kueleweka.
- source_word: ἐπισκέψασθαι
  choice: kuwatembelea
  rationale: Katika muktadha huu neno linamaanisha kwenda kuwaona watu wake, huku likiwa na uwezekano wa wazo la kujua hali yao. “Kuwatembelea” ni tafsiri fupi na ya kawaida.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: ndugu zake
  rationale: “Ndugu” huhifadhi lugha ya uhusiano wa kifamilia na katika Kiswahili inaweza kumaanisha watu wa ukoo au taifa moja; kirai kinachofuata kinawatambulisha wazi.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: wana wa Israeli
  rationale: Hii ni tafsiri ya karibu ya jina la kikundi katika Kigiriki na inahifadhi nahau ya kibiblia. “Yaani” inaonyesha wazi kwamba kirai hiki kinafafanua “ndugu zake.”
theological_decisions:
- issue: Lugha ya undugu na utambulisho wa kikabila
  choice: ndugu zake, yaani wana wa Israeli
  alternative: Waisraeli wenzake / ndugu zake, yaani watu wa Israeli
  rationale: 'Chanzo kinatumia kwa makusudi lugha mbili za kifamilia: “ndugu zake” na “wana wa Israeli.” Tafsiri iliyochaguliwa inahifadhi taswira hiyo bila kudokeza kwamba wanaume pekee ndio waliokusudiwa; maelezo ya chini yanafafanua kwamba ni watu wenzake wa Israeli.'
- issue: Nahau ya kusudi la moyoni
  choice: akaazimia moyoni
  alternative: wazo likapanda moyoni mwake / akafanya uamuzi
  rationale: Tafsiri hii inaonyesha uamuzi wa ndani huku ikihifadhi neno “moyo.” Maelezo ya chini yanatunza taswira halisi ya Kigiriki, hivyo kutatua nahau hakufuti ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku nahau na lugha ya kifamilia ya chanzo zikihifadhiwa katika matini na maelezo ya chini.
