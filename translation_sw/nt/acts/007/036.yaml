  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: sw
  text: Huyu ndiye aliyewaongoza kutoka, akifanya maajabu na ishara katika nchi ya Misri, katika Bahari ya Shamu[a], na jangwani kwa miaka arobaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bahari ya Matete.” Maandishi ya Kigiriki yanasema “Bahari Nyekundu” (Ἐρυθρὰ Θάλασσα), jina la kawaida katika Agano Jipya na Septuajinti kwa mahali pa kuvuka kwa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Huyu ndiye
  rationale: Kiashiria hiki kina mkazo na kinamrejelea Musa; “Huyu ndiye” huhifadhi nguvu ya usemi wa Stefano kwa Kiswahili cha kawaida.
- source_word: ἐξήγαγεν αὐτοὺς
  choice: aliyewaongoza watoke
  rationale: Huwasilisha maana ya kuwaongoza au kuwatoa, huku kikihifadhi nafasi ya Musa kama wakala wa kibinadamu katika kutoka Misri.
- source_word: ποιήσας
  choice: akifanya
  rationale: Muundo huu wa kitenzi unaunganisha matendo ya maajabu na ishara na tendo kuu la kuwaongoza watoke, kwa mtiririko wa asili wa Kiswahili.
- source_word: τέρατα καὶ σημεῖα
  choice: maajabu na ishara
  rationale: 'Huhifadhi jozi ya kawaida ya Luka: matendo yanayoamsha mshangao na matendo yenye umuhimu wa kiishara.'
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: katika nchi ya Misri
  rationale: “Nchi” huakisi γῇ na kudumisha mpangilio wa maeneo matatu katika aya.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: katika Bahari ya Shamu
  rationale: Hili ndilo jina la jadi na linalotambulika katika Kiswahili kwa Ἐρυθρὰ Θάλασσα; “katika” pia huakisi kihusishi ἐν kinachorudiwa.
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: Neno hili linafaa kwa eneo la safari ya Israeli na halilazimishi picha ya jangwa la mchanga pekee.
- source_word: ἔτη τεσσεράκοντα
  choice: kwa miaka arobaini
  rationale: “Kwa” huonyesha muda kwa Kiswahili cha kawaida bila kuongeza tafsiri nyingine.
theological_decisions:
- issue: Mrejelewa wa kiashiria na uwakala katika kutoka Misri
  choice: Aya inamtaja Musa kwa mkazo kuwa wakala wa kibinadamu aliyewaongoza Waisraeli watoke.
  alternative: Kutumia “Yeye” pekee, ambako kungepunguza mkazo wa οὗτος.
  rationale: “Huyu ndiye” huhifadhi mkazo wa hotuba ya Stefano bila kudai kwamba Musa alitenda kwa uwezo wa kujitegemea mbali na Mungu; maandishi yanaeleza matendo ya Mungu kupitia wakala wa kibinadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Huyu ndiye” huhifadhi mkazo wa usemi; “Bahari ya Shamu” ni istilahi ya kibiblia iliyozoeleka, huku tanbihi ikihifadhi mbadala unaotokana na usuli wa Kiebrania.
