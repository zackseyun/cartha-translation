  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: sw
  text: Lakini wakapiga kelele kwa sauti kubwa, wakaziba masikio yao, kisha wakamrukia kwa pamoja[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa nia moja. Kielezi cha Kigiriki ὁμοθυμαδόν kinakazia kwamba walitenda kwa umoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: wakapiga kelele
  rationale: Kitenzi hiki kinaonyesha kutoa kilio au kelele kubwa. Kauli hii ni ya kawaida katika Kiswahili na haiwekei tukio hisia maalumu kuliko Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha badiliko lenye utofautishaji mdogo kutoka maono ya Stefano kwenda mwitikio wa uadui wa watu.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kigiriki kinachoeleza ukubwa wa sauti.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: wakaziba masikio yao
  rationale: Nahau hii ina maana ya kuyafunga masikio ili wasisikie; 'kuziba masikio' ni usemi wa asili na wazi katika Kiswahili cha sasa.
- source_word: ὥρμησαν
  choice: wakamrukia
  rationale: Kitenzi kinaonyesha kusonga kwa ghafla na kwa nguvu kuelekea mtu. 'Kumrukia' linawasilisha mwendo huo wa uadui kwa ufupi na kwa kawaida.
- source_word: ὁμοθυμαδὸν
  choice: kwa pamoja
  rationale: Kielezi hiki kinaonyesha tendo la umoja au msukumo mmoja wa kundi. 'Kwa pamoja' ni cha kawaida, huku maana pana zaidi ikihifadhiwa katika tanbihi.
- source_word: ἐπ’ αὐτόν
  choice: -m- katika wakamrukia
  rationale: Kwa kuwa 'kumrukia' hubeba ndani yake wazo la mwendo unaoelekezwa kwa mtu, kiwakilishi cha yambwa '-m-' kinawakilisha αὐτόν kwa Kiswahili cha kawaida.
