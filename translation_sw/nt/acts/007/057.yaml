  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na maana ya Kigiriki: kilio kwa sauti kubwa, kuziba masikio, na kumrukia Stefano wote kwa pamoja. Kauli “wakamrukia” yawasilisha mwendo wa ghafla ulioelekezwa kwake bila kuongeza maelezo yasiyomo katika matini.'
