  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: sw
  text: Siku iliyofuata, aliwatokea walipokuwa wakipigana, akajaribu kuwapatanisha ili wawe na amani,[a] akisema, “Enyi wanaume, ninyi ni ndugu; kwa nini mnatendeana isivyo haki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa akiwapatanisha ili wawe na amani.” Kitenzi cha Kigiriki kinaweza kueleza tendo lililokuwa likiendelea, lakini katika muktadha huu huenda kinaonyesha jaribio la Musa la kuwapatanisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: Kesho yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha siku iliyofuata katika simulizi.
- source_word: ὤφθη
  choice: aliwatokea
  rationale: Ingawa umbo ni la kutendwa, katika simulizi kitenzi hiki hutumika kwa maana ya ‘alitokea/akaonekana kwao’; ‘aliwatokea’ ni cha asili na huhifadhi mwelekeo kwa watu hao.
- source_word: αὐτοῖς μαχομένοις
  choice: walipokuwa wakipigana
  rationale: Huwasilisha tendo lililokuwa likiendelea wakati Musa alipowatokea.
- source_word: συνήλλασσεν
  choice: akajaribu kuwapatanisha
  rationale: Kauli ya wakati usiotimilika katika muktadha huu inaelekea kuonyesha jaribio lisilofanikiwa, kama mstari unaofuata unavyodhihirisha; tanbihi huhifadhi uwezekano wa tendo linaloendelea.
- source_word: εἰς εἰρήνην
  choice: ili wawe na amani
  rationale: Huonyesha kuelekezwa kwenye hali ya amani kwa Kiswahili cha kawaida bila kutumia muundo mgumu wa neno kwa neno.
- source_word: Ἄνδρες
  choice: Enyi watu
  rationale: Ni mwito wa moja kwa moja kwa wanaume hao wawili; ‘watu’ ni wa kawaida na wenye hadhi katika Kiswahili, huku muktadha ukiweka wazi warejelewa.
- source_word: ἀδελφοί ἐστε
  choice: ninyi ni ndugu
  rationale: Huhifadhi ombi linalotegemea uhusiano wao wa kindugu kama Waisraeli wenzao.
- source_word: ἱνατί
  choice: kwa nini
  rationale: Ni kisawa cha moja kwa moja na cha kawaida cha swali la sababu.
- source_word: ἀδικεῖτε ἀλλήλους
  choice: mnatendeana mabaya
  rationale: Hutoa maana ya kutendeana isivyo haki au vibaya, na umbo la kutendeana huhifadhi ἀλλήλους.
