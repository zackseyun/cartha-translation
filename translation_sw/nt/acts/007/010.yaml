  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: sw
  text: akamuokoa kutoka katika dhiki zake zote[a], akampa kibali[b] na hekima mbele ya Farao, mfalme wa Misri, akamweka kuwa mtawala juu ya Misri na nyumba yake yote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamuokoa kutoka katika shida zake zote.”
    reason: lexical_alternative
  - marker: b
    text: “Kibali” hapa ni kukubaliwa na kutazamwa kwa wema na Farao; pia inaweza kutafsiriwa “neema.”
    reason: lexical_alternative
  - marker: c
    text: Au, “akamteua kuwa gavana juu ya Misri na nyumba yake yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: akamuokoa
  rationale: Kitenzi hiki katika muktadha kinaonyesha kumwondoa mtu katika hatari au mateso; ‘akamuokoa’ ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: θλίψεων
  choice: dhiki
  rationale: ‘Dhiki’ hujumuisha shida, mateso, na misukosuko aliyopitia Yosefu bila kulazimisha maana maalumu ya nyakati za mwisho.
- source_word: χάριν
  choice: kibali
  rationale: Hapa neno hilo linamaanisha kukubaliwa na kutazamwa kwa wema mbele ya Farao, si lazima maana pana ya kitheolojia ya ‘neema.’
- source_word: σοφίαν
  choice: hekima
  rationale: ‘Hekima’ huwasilisha wazi busara na utambuzi wa vitendo aliokuwa nao Yosefu.
- source_word: ἐναντίον
  choice: mbele ya
  rationale: Kirai hiki kinaonyesha kuwapo machoni au katika uwepo wa Farao; ‘mbele ya’ ni cha asili na sahihi.
- source_word: κατέστησεν
  choice: akamweka kuwa
  rationale: Kitenzi kinaonyesha kumweka mtu katika cheo au mamlaka; muundo huu ni wa kawaida katika Kiswahili na hauongezi urasmi usiotajwa.
- source_word: ἡγούμενον
  choice: mtawala
  rationale: Neno hili humaanisha mtu mwenye mamlaka ya kuongoza au kutawala; ‘mtawala’ ni pana kuliko ‘gavana’ na linafaa hapa.
- source_word: ἐπ’ Αἴγυπτον
  choice: juu ya Misri
  rationale: Muundo huu unaonyesha mamlaka juu ya eneo, na ‘juu ya Misri’ huhifadhi uhusiano huo kwa ufupi.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: nyumba yake yote
  rationale: ‘Nyumba’ hapa inaweza kujumuisha watu na shughuli za jumba la Farao, si jengo pekee; usemi huu pia huhifadhi upana wa οἶκος.
theological_decisions:
- issue: Mhusika wa vitenzi katika mstari huu
  choice: Mhusika anaachwa bila kutajwa wazi, kama ilivyo katika Kigiriki, huku muktadha ukielekeza kwa Mungu.
  alternative: Kutaja wazi ‘Mungu akamuokoa...’
  rationale: Muktadha wa Matendo 7:9 unaonyesha kuwa Mungu ndiye mhusika, lakini mstari huu haumrudii kwa jina. Kuunganisha vitenzi bila kuongeza ‘Mungu’ huhifadhi mtindo na kiasi cha uwazi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumia vitenzi vinavyofuatana kwa ‘aka-’. ‘Farao, mfalme wa Misri’ hudumisha cheo na ufafanuzi wa chanzo; viashiria vyote vya tanbihi vimewekwa katika matini.
