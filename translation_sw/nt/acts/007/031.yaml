base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: sw
  text: Musa alipoona maono hayo, alistaajabu. Alipokaribia ili ayatazame kwa makini, sauti ya Bwana ikasikika:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au, “sauti ya Bwana ikaja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: alipoona jambo hilo
  rationale: Kauli hii ya wakati inaonyesha kwamba kuona kulitangulia kustaajabu. 'Jambo hilo' hurejelea kwa kawaida tukio lililoonekana bila kulifanya kwa lazima kuwa maono ya ndani.
- source_word: ἐθαύμασεν
  choice: alistaajabia
  rationale: Kitenzi hiki kinaonyesha mshangao wenye hali ya kustaajabu; 'alistaajabia' ni cha kawaida na chenye hadhi katika masimulizi.
- source_word: τὸ ὅραμα
  choice: mandhari hiyo
  rationale: ὅραμα inaweza kuwa kitu kinachoonekana au maono. Katika muktadha huu, 'mandhari hiyo' inaeleza tukio lililo mbele ya macho ya Musa huku dokezo likihifadhi maana nyingine inayowezekana.
- source_word: προσερχομένου
  choice: alipokaribia
  rationale: Muundo wa genitive absolute unaonyesha wakati na tendo linaloambatana na tukio kuu; tafsiri hii ni ya asili katika Kiswahili.
- source_word: κατανοῆσαι
  choice: ili aitazame kwa makini
  rationale: Kitenzi kina maana ya kuchunguza au kutazama kwa uangalifu. Usemi huu unahifadhi mwelekeo wa kuona katika muktadha.
- source_word: ἐγένετο φωνὴ
  choice: sauti ... ikasikika
  rationale: Muundo wa Kigiriki hutambulisha kutokea kwa sauti. Kiswahili cha asili hutumia 'sauti ikasikika'; dokezo linatoa tafsiri iliyo karibu zaidi na muundo wa kutokea.
- source_word: κυρίου
  choice: Bwana
  rationale: κύριος imetafsiriwa 'Bwana,' bila kuibadili kimyakimya kuwa jina la agano YHWH.
theological_decisions:
- issue: Tafsiri ya κύριος katika muktadha wa Mungu kujidhihirisha
  choice: Bwana
  alternative: BWANA
  rationale: Andiko la Kigiriki lina κύριος, si Tetragramatoni. 'Bwana' hudumisha neno la Kigiriki, ingawa tukio hili linarejelea Kutoka 3 ambako YHWH anajidhihirisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida wa masimulizi, huku maana mbadala ya ὅραμα na muundo wa ἐγένετο φωνὴ zikihifadhiwa katika madokezo.
