  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: sw
  text: Nao mababu wa ukoo, kwa wivu wakamuuza Yosefu kwenda Misri; na Mungu alikuwa pamoja naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: wazee wa ukoo
  rationale: Katika muktadha huu neno linawahusu wana wa Yakobo kama waasisi wa makabila ya Israeli. “Wazee wa ukoo” ni Kiswahili cha kawaida na chenye heshima kuliko istilahi isiyozoeleka sana “mapatriarki,” huku kikihifadhi maana ya kihistoria.
- source_word: ζηλώσαντες
  choice: kwa sababu ya kumwonea Yosefu wivu
  rationale: Kirai hiki kinaonyesha sababu iliyowasukuma kutenda. Muundo huu wa Kiswahili ni wa asili na unaweka wazi nguvu ya wivu bila kuongeza maelezo.
- source_word: ἀπέδοντο
  choice: walimuuza
  rationale: Katika simulizi la Yosefu, kitenzi kinamaanisha kumtoa kwa malipo, yaani kumuuza; tafsiri pana kama “walimkabidhi” ingefifisha maana hiyo.
- source_word: εἰς Αἴγυπτον
  choice: aende Misri
  rationale: Kirai cha Kigiriki kinaonyesha mwelekeo au matokeo ya kuuzwa kwake kuelekea Misri. “Walimuuza aende Misri” ni Kiswahili cha kawaida kinachoepuka wazo lisilo la asili la kumuuza mtu ‘ndani ya’ nchi.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Mungu alikuwa pamoja naye
  rationale: Tafsiri hii inahifadhi kauli rahisi ya kuwapo kwa Mungu pamoja na Yosefu; kiwakilishi kina rejeo lililo wazi.
theological_decisions:
- issue: Kuwapo kwa Mungu katika mateso ya Yosefu
  choice: Lakini Mungu alikuwa pamoja naye
  alternative: na Mungu alikuwa pamoja naye
  rationale: Ingawa καί kwa umbo ni “na,” hapa uhusiano wa sentensi unaonyesha tofauti kati ya usaliti wa wazee wa ukoo na kuwapo kwa Mungu pamoja na Yosefu. “Lakini” huwasilisha tofauti hiyo kwa Kiswahili cha asili bila kueleza zaidi namna ya majaliwa ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili mtiririko uwe wa asili; hakuna istilahi ya kimadhehebu iliyoongezwa.
