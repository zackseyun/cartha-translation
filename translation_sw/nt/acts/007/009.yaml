review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that Joseph was sold and that God was with him. However, “Lakini” translates the second καί as an adversative (“but”), a contrast not explicitly marked in the Greek. “Wazee wa ukoo” can denote community/clan elders and is less specific than πατριάρχαι, which here refers to Israel’s ancestral fathers.
  naturalness: The proposed revision is fluent, contemporary Standard East African Swahili. “Kwa wivu” naturally expresses the motivating participle without unnecessarily expanding it.
  terminology: “Mababu wa ukoo” is preferable here to “wazee wa ukoo,” since it identifies the patriarchs as ancestral forefathers rather than office-holding elders. “Yosefu,” “Misri,” and “Mungu alikuwa pamoja naye” are appropriate biblical and general Swahili terms.
  issues:
  - severity: medium
    issue: “Lakini” adds an explicit adversative relation.
    rationale: The Greek reads καὶ ... καὶ (“and ... and”). Though the events are narratively contrastive, the source does not use a contrasting conjunction; “na” preserves the linkage without added interpretation.
  - severity: medium
    issue: “Wazee wa ukoo” is potentially ambiguous for πατριάρχαι.
    rationale: In Swahili it may be understood as clan/community elders. In Stephen’s historical reference the term denotes the ancestral fathers, Joseph’s brothers, so “mababu wa ukoo” is more precise.
  revised_text: Nao mababu wa ukoo, kwa wivu wakamuuza Yosefu kwenda Misri; na Mungu alikuwa pamoja naye.
  revised_footnotes: []
  revision_rationale: The revision retains the historical reference to Joseph’s ancestral-family forefathers, renders jealousy as the motive for the sale, and replaces the interpretive adversative “Lakini” with “na,” corresponding to the Greek conjunction while preserving natural Swahili flow.
