source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: sw
  text: Naye akampa agano la tohara. Na hivyo Abrahamu akamzaa Isaka, akamtahiri siku ya nane; Isaka akamzaa Yakobo, naye Yakobo akawazaa wale wazee kumi na wawili wa ukoo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: agano la tohara
  rationale: “Agano” ni neno la kawaida la kibiblia kwa διαθήκη katika muktadha huu, na “la tohara” linaonyesha agano lililohusishwa na kutambulishwa kwa tohara bila kuongeza maelezo yasiyo katika Kigiriki.
- source_word: οὕτως
  choice: Na hivyo
  rationale: Kauli hii inadumisha uhusiano wa kimantiki na wa mfuatano kati ya kupewa agano na kuzaliwa pamoja na kutahiriwa kwa Isaka.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, “kumzaa” ni usemi mfupi na wa kawaida unaoweza kueleza mwanaume kumpata mtoto, na unadumisha nguvu ya kinasaba ya kitenzi cha Kigiriki.
- source_word: περιέτεμεν
  choice: akamtahiri
  rationale: “Kutahiri” ndilo neno la kawaida na sahihi kwa tendo linalotajwa na περιτέμνω.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: siku ya nane
  rationale: Huu ni usemi wa kawaida wa wakati katika Kiswahili na hauongezi maneno kama “baada ya kuzaliwa,” ambayo hayajaelezwa moja kwa moja katika Kigiriki.
- source_word: πατριάρχας
  choice: mababu
  rationale: “Mababu” linaeleweka kwa urahisi kuwa waanzilishi wa nasaba za Israeli; “wale” linasaidia kubainisha kundi maalumu la watu kumi na wawili linalojulikana katika simulizi.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: Isaka / Yakobo
  rationale: Majina yametolewa kwa maumbo yao yaliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Umahususi wa agano alilopewa Abrahamu
  choice: agano la tohara
  alternative: agano moja la tohara
  rationale: Kiswahili hakina kibainishi bainifu kinacholingana moja kwa moja na “the.” Muktadha na muundo “agano la tohara” vinaelekeza kwenye agano maalumu la Mwanzo 17 bila kuingiza maelezo ya ziada.
- issue: Lugha ya nasaba kwa γεννάω
  choice: akamzaa / akawazaa
  alternative: akawa baba ya / wakawa wana wa
  rationale: “Kumzaa” linahifadhi kwa ufupi uhusiano wa moja kwa moja wa kinasaba uliomo katika Kigiriki, bila kutumia lugha ya kizamani au kulegeza mlolongo wa ukoo.
- issue: Utambulisho wa wale kumi na wawili
  choice: wale mababu kumi na wawili
  alternative: wale wazee kumi na wawili wa ukoo
  rationale: “Mababu” linaonyesha nafasi yao kama chimbuko la nasaba za Israeli, huku likiepuka kuongeza neno “makabila,” ambalo linaeleweka katika muktadha lakini halipo wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Viwakilishi vya mwanzo vimehifadhiwa badala ya kubadilishwa kuwa “Mungu” na “Abrahamu,” ili kutoongeza majina ambayo hayapo katika mstari wa Kigiriki. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
