  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: sw
  text: Alidhani kwamba ndugu zake[a] walielewa kuwa Mungu alikuwa akiwapa ukombozi[b] kupitia mkono wa Musa, lakini wao hawakuelewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu zake” hapa ni Waisraeli wenzake Musa; Kigiriki kimetumia neno la kindugu la kiume katika wingi.
    reason: cultural_note
  - marker: b
    text: Au, “wokovu” au “uokozi.” Neno la Kigiriki linaweza kumaanisha kuokolewa, kukombolewa, au kupata wokovu; hapa muktadha wa karibu unaelekeza kwenye ukombozi wa Israeli kupitia Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: Alidhani
  rationale: Wakati usiotimilika unaonyesha wazo lililokuwa katika usuli wa tukio; katika Kiswahili, wakati uliopita rahisi ni wa kawaida na unaeleza hali hiyo bila kuwa mzito.
- source_word: συνιέναι / συνῆκαν
  choice: walielewa / hawakuelewa
  rationale: Kurudia kitenzi kilekile kunahifadhi ulinganifu na mgongano wa wazi uliomo katika Kigiriki.
- source_word: ἀδελφοὺς
  choice: ndugu zake
  rationale: Huhifadhi lugha ya kindugu ya nomino ya kiume ya wingi, huku tanbihi ikifafanua kwamba wanaorejelewa ni Waisraeli wenzake Musa.
- source_word: δίδωσιν
  choice: alikuwa akiwapa
  rationale: Ingawa umbo la Kigiriki ni la wakati wa sasa, limetumiwa ndani ya usemi tegemezi baada ya kitenzi cha wakati uliopita; umbo hili la Kiswahili linaweka tendo katika usuli wa simulizi.
- source_word: σωτηρίαν
  choice: ukombozi
  rationale: Katika muktadha huu neno linamaanisha hasa kuwaokoa Israeli kutoka katika dhuluma ya Misri, huku likibaki na upana wa wazo la wokovu.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: kupitia mkono wa Musa
  rationale: Huhifadhi taswira ya 'mkono' kama chombo cha utendaji. Kutaja Musa huondoa mkanganyiko wa Kiswahili ambao ungeweza kufanya 'wake' ionekane kumrejelea Mungu.
- source_word: αὐτοῖς
  choice: akiwapa
  rationale: Kiambishi -wa- kinaonyesha kwa kawaida kwamba wao ndio wapokeaji wa ukombozi.
theological_decisions:
- issue: Maana ya σωτηρία katika simulizi la Musa
  choice: ukombozi
  alternative: wokovu; uokozi
  rationale: Muktadha wa karibu unahusu tendo la Mungu la kuwaokoa Israeli kihistoria kupitia Musa. 'Ukombozi' linaweka maana hiyo mbele bila kukata uhusiano mpana na wazo la wokovu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kawaida kwa wasomaji wa leo, huku taswira ya chanzo ya Mungu kutenda kupitia mkono wa Musa ikihifadhiwa.
