  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: sw
  text: Lakini yeye, akiwa amejaa Roho Mtakatifu, akakaza macho mbinguni[a], akaona utukufu wa Mungu na Yesu akiwa amesimama upande wa kuume wa Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaitazama mbingu kwa makini.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “upande wa kuume wa Mungu” ni nahau ya Biblia inayoashiria nafasi ya heshima na mamlaka kuu zaidi.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: akiwa
  rationale: Kitenzi hiki katika umbo la hali endelevu kinaonyesha hali ya Stefano iliyokuwapo wakati wa tendo kuu; “akiwa” ni Kiswahili cha kawaida na sahihi kwa nguvu hiyo ya kisarufi.
- source_word: πλήρης πνεύματος ἁγίου
  choice: amejaa Roho Mtakatifu
  rationale: Hii ni nahau inayoonyesha kuwa Stefano alikuwa chini ya ujazo na uongozi wa Roho Mtakatifu. “Amejaa” ni ya kawaida na inahifadhi hali yake inayoendelea katika simulizi.
- source_word: ἀτενίσας
  choice: akakaza macho kutazama
  rationale: Neno linaeleza kutazama kwa makini na kwa kuelekeza macho kabisa; usemi huu unawasilisha mkazo huo kwa Kiswahili cha asili.
- source_word: εἰς τὸν οὐρανόν
  choice: mbinguni
  rationale: Katika muktadha wa maono, οὐρανός ni makao ya kimbingu, si anga linaloonekana tu.
- source_word: εἶδεν
  choice: akaona
  rationale: Hili ndilo tendo kuu linalofuata katika simulizi, na “akaona” linaonyesha mfuatano huo kwa uwazi.
- source_word: δόξαν θεοῦ
  choice: utukufu wa Mungu
  rationale: Tafsiri hii ya moja kwa moja inadumisha wazo la udhihirisho wa ukuu wa Mungu bila kulifafanua kupita maandishi.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: ἑστῶτα
  choice: akiwa amesimama
  rationale: Umbo la neno linaonyesha Yesu katika hali ya kusimama wakati Stefano alipomwona; tafsiri hii inadumisha picha hiyo waziwazi.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: upande wa kuume wa Mungu
  rationale: Huu ni usemi wa mahali unaobeba pia maana ya heshima na mamlaka. “Upande wa kuume” ni wa kawaida na haudokezi kwamba Yesu alikuwa juu ya mkono halisi.
- source_word: δέ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya hasira ya umati katika muktadha uliotangulia na hali ya Stefano aliyejaa Roho Mtakatifu.
theological_decisions:
- issue: Je, πνεύματος ἁγίου irejelee nafsi ya kimungu au hali takatifu isiyo na nafsi?
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Matumizi ya Luka–Matendo na muktadha wa karibu yanaelekeza kwa Roho Mtakatifu, si tabia takatifu au nguvu isiyo na nafsi. Herufi kubwa zinaonyesha rejeo hilo bila kuongeza maelezo ya kimadhehebu.
- issue: Jinsi ya kuwasilisha Yesu akiwa ἐκ δεξιῶν τοῦ θεοῦ
  choice: Yesu akiwa amesimama upande wa kuume wa Mungu
  alternative: Yesu akiwa amesimama kutoka upande wa kuume wa Mungu
  rationale: Tafsiri iliyochaguliwa inadumisha tofauti kati ya Mungu na Yesu pamoja na taswira ya kutukuzwa kwa Yesu. Pia inaepuka Kiswahili kisicho cha kawaida cha kutafsiri ἐκ kwa neno “kutoka” katika nahau hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya mfululizo (“akakaza… akaona”) unafanya simulizi lisomeke kwa kawaida, huku “akiwa” ikidumisha hali endelevu ya Stefano na hali ya Yesu katika maono. Alama ya tanbihi [a] imewekwa baada ya kirai inachokifafanua, yaani kutazama mbinguni.
