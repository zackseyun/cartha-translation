  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: sw
  text: “Enyi wenye shingo ngumu, wenye mioyo isiyotahiriwa na masikio yasiyotahiriwa! Sikuzote mnampinga Roho Mtakatifu. Kama baba zenu[a] walivyofanya, nanyi pia mnafanya hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mababu zenu.” Kigiriki: “baba zenu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: wenye shingo ngumu
  rationale: Inahifadhi sitiari yenye nguvu ya Kigiriki na mwangwi wake wa lugha ya Maandiko, badala ya kuifafanua tu kuwa ‘wakaidi.’
- source_word: ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν
  choice: ambao mioyo na masikio yenu hayajatahiriwa
  rationale: Inahifadhi picha halisi ya kutotahiriwa kwa moyo na masikio, huku ikitumia muundo wa kawaida wa Kiswahili kueleza hali inayohusu mioyo na masikio ya wanaosemeshwa.
- source_word: ἀεὶ
  choice: sikuzote
  rationale: Inaonyesha mwenendo unaodumu na unaojirudia, kama kielezi cha wakati cha Kigiriki.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida na lenye heshima katika Kiswahili kwa rejeo hili dhahiri la Roho Mtakatifu.
- source_word: ἀντιπίπτετε
  choice: mnampinga
  rationale: Inaonyesha upinzani wa makusudi na wa vitendo; kiambishi cha ngeli ya mtu kinaendana na rejeo binafsi la Roho Mtakatifu katika muktadha.
- source_word: ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς
  choice: Kama baba zenu walivyofanya, nanyi mnafanya vivyo hivyo
  rationale: Inakamilisha ulinganisho uliodokezwa katika Kigiriki kwa Kiswahili cha kawaida bila kuongeza wazo jipya, huku ikihifadhi neno la kifamilia ‘baba.’
theological_decisions:
- issue: Rejeo la ‘Roho Mtakatifu’
  choice: Roho Mtakatifu kama nafsi ya kiungu
  alternative: roho takatifu kama nguvu au mwelekeo wa kiungu kwa ujumla
  rationale: Katika Matendo, kirai hiki chenye kibainishi na kivumishi humrejelea Roho Mtakatifu binafsi; uandishi kwa herufi kubwa na matumizi ya ‘mnampinga’ yanafuata muktadha bila kuongeza maelezo ya kimadhehebu.
- issue: Sitiari ya agano kuhusu kutotahiriwa
  choice: Kuhifadhi ‘mioyo na masikio yenu hayajatahiriwa’
  alternative: Kufafanua kuwa ‘mioyo iliyofungwa na masikio yasiyosikia’
  rationale: Lugha hiyo inakusudia mwangwi wa manabii kuhusu uasi wa ndani wa agano. Kuihifadhi huepusha kufuta mvutano na picha ya kitheolojia ya matini.
- issue: Neno la kiume kwa vizazi vilivyotangulia
  choice: baba zenu
  alternative: mababu zenu
  rationale: Kigiriki kinatumia neno la kiume ‘baba.’ Tafsiri inalihifadhi katika matini, huku tanbihi ikitoa mbadala wa kawaida wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama ya mshangao baada ya shtaka la kwanza inadumisha ukali wa hotuba, na sentensi fupi zinaifanya aya isomeke kwa urahisi bila kupunguza nguvu ya lugha ya kinabii.
