id: ACT.7.52
reference: Acts 7:52
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: sw
  text: Ni yupi kati ya manabii ambaye baba zenu[a] hawakumtesa? Nao waliwaua wale waliotangaza mapema kuja kwa Mwenye Haki[b], ambaye sasa ninyi mmekuwa wasaliti na wauaji wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mababu zenu au watu wa vizazi vilivyowatangulia.
    reason: lexical_alternative
  - marker: b
    text: Au, Mwenye Uadilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Ni yupi kati ya manabii
  rationale: 'Muundo huu unahifadhi maana ya sehemu ya kundi na nguvu ya swali la balagha: hakuna nabii aliyeepuka mateso yao.'
- source_word: ἐδίωξαν
  choice: hawakumtesa
  rationale: Katika muktadha huu kitenzi kinamaanisha kumwandama mtu kwa uhasama; ‘kumtesa’ ni Kiswahili cha kawaida kinachoeleza dhuluma hiyo.
- source_word: οἱ πατέρες ὑμῶν
  choice: baba zenu
  rationale: Hili linafuata kwa karibu neno la Kiyunani na kudumisha shutuma ya Stefano inayounganisha wasikilizaji wake na vizazi vilivyowatangulia; tanbihi inafafanua maana ya mababu.
- source_word: ἀπέκτειναν
  choice: waliwaua
  rationale: Ni tafsiri ya moja kwa moja, ya sasa na inayoeleweka ya tendo la kuua.
- source_word: τοὺς προκαταγγείλαντας
  choice: wale waliotangaza mapema
  rationale: Maneno haya yanahifadhi wazo la kutangaza jambo kabla halijatokea, bila kupunguza kitenzi kuwa utabiri tu.
- source_word: περὶ τῆς ἐλεύσεως
  choice: kuja kwa
  rationale: Hii ni njia ya kawaida na fupi ya Kiswahili ya kueleza ujio uliotangazwa kabla.
- source_word: τοῦ δικαίου
  choice: Mwenye Haki
  rationale: Muundo wenye kibainishi humtaja mtu mahususi na unatenda kama cheo cha Yesu; ‘Mwenye Haki’ ni cha asili na chenye heshima katika Kiswahili.
- source_word: προδόται
  choice: wasaliti
  rationale: Neno hili linaonyesha watu waliomsaliti au kumkabidhi Yesu, huku likihifadhi umbo la nomino la Kiyunani.
- source_word: φονεῖς
  choice: wauaji wake
  rationale: ‘Wauaji’ linaonyesha lawama ya kimaadili ya kusababisha kifo, na ‘wake’ linaunganisha wazi nomino hizo na Mwenye Haki.
- source_word: ἐγένεσθε
  choice: mmekuwa
  rationale: Hili linaonyesha kuingia katika hali hiyo na matokeo yake yanayoendelea wakati wa shutuma.
theological_decisions:
- issue: Kutafsiri τοῦ δικαίου kama jina la cheo linalomhusu Kristo
  choice: Mwenye Haki
  alternative: Yule mwenye haki
  rationale: Katika hotuba ya Stefano, maneno haya yanamhusu Yesu, ambaye kuja kwake kulitangazwa na manabii. Herufi kubwa zinaonyesha matumizi kama cheo bila kuongeza maelezo yasiyokuwamo katika Kiyunani.
- issue: Uhusiano wa οὗ na nomino προδόται καὶ φονεῖς
  choice: ambaye sasa ninyi mmekuwa wasaliti na wauaji wake
  alternative: ambaye sasa ninyi mmemsaliti na kumwua
  rationale: Tafsiri iliyochaguliwa inadumisha nomino za lawama ‘wasaliti’ na ‘wauaji’ na pia hali ya ‘mmekuwa,’ badala ya kuzibadili kuwa vitenzi na kuondoa mvutano wa usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha na ukali wa shutuma vimehifadhiwa. ‘Nao’ linaunganisha sentensi ya pili na ‘baba zenu’ bila kuongeza msisitizo usiotajwa wazi katika καί.
