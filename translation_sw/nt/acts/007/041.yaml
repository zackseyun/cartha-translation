  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: sw
  text: Katika siku hizo wakatengeneza ndama[a], wakaitolea sanamu hiyo dhabihu, na walikuwa wakifurahia kazi za mikono yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaunda ndama.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walifurahia vitu ambavyo mikono yao ilikuwa imetengeneza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: wakatengeneza ndama
  rationale: Kitenzi hiki humaanisha kutengeneza au kuunda ndama. Tafsiri hii ni ya kawaida na wazi; neno linalofuata, “sanamu,” linaonyesha kwamba ndama huyo alikuwa kitu cha kuabudiwa.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Katika siku hizo
  rationale: Huu ni usemi wa kawaida wa wakati unaohifadhi muundo na maana ya Kigiriki kwa Kiswahili cha asili.
- source_word: ἀνήγαγον θυσίαν
  choice: wakaitolea ... dhabihu
  rationale: Katika muktadha wa ibada, usemi huu unamaanisha kutoa dhabihu. Kiambishi “-i-” kinaonyesha wazi kwamba dhabihu ilitolewa kwa sanamu hiyo.
- source_word: τῷ εἰδώλῳ
  choice: sanamu hiyo
  rationale: Kibainishi cha Kigiriki kinaelekeza kwa ndama aliyetajwa tayari. “Sanamu hiyo” ni ya kawaida katika Kiswahili na inadumisha hukumu hasi ya ibada ya sanamu.
- source_word: εὐφραίνοντο
  choice: walikuwa wakifurahia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, kama hali ya wakati usiotimilika katika Kigiriki, bila kulifasiri zaidi kuwa sherehe rasmi.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: kazi za mikono yao
  rationale: Tafsiri hii inadumisha taswira na ukosoaji wa kibiblia kuhusu watu kuabudu vitu vilivyotengenezwa na mikono yao.
theological_decisions:
- issue: Lugha ya ibada ya sanamu na nguvu yake ya kiukosoaji
  choice: Kutumia “sanamu hiyo” na kudumisha usemi “kazi za mikono yao.”
  alternative: “mfano huo” na “vitu walivyotengeneza”
  rationale: Maneno ya Stefano yanaibua ukosoaji wa kibiblia dhidi ya ibada ya sanamu. Tafsiri iliyochaguliwa inadumisha hukumu hiyo na taswira yake bila kuifanya kuwa maelezo yasiyoegemea upande wowote kuhusu ufundi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni mwepesi kueleweka, huku “kazi za mikono yao” ukidumisha mwangwi wa lugha ya kibiblia dhidi ya ibada ya sanamu.
