  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: sw
  text: Nanyi mlibeba hema la Moloki na nyota ya mungu Refani[a], sanamu mlizozitengeneza ili kuziabudu[c]. Nami nitawapeleka uhamishoni ng’ambo ya Babeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri, zikifuata maneno “mungu wenu” katika Amosi 5:26, zinasema “mungu wenu Refani” badala ya “mungu Refani.” Hapa Matendo inasema “mungu Refani.”
    reason: alternative_reading
  - marker: b
    text: Matendo inasema “ng’ambo ya Babeli.” Katika Amosi 5:27, kifungu chanzo kwa kawaida hutafsiriwa “ng’ambo ya Dameski.”
    reason: cross_reference
  - marker: c
    text: Au “maumbo” au “vielelezo” badala ya “sanamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: mlibeba
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha kuchukua na kubeba vitu vya ibada; ‘mlibeba’ ni Kiswahili cha kawaida na hakiongezi ufafanuzi usio katika matini.
- source_word: σκηνὴν
  choice: hema
  rationale: Maana ya msingi ni hema. Neno hili pia huepuka kulichanganya na Maskani halali ya Mungu, huku ‘mahali patakatifu pa ibada’ ikiwa tafsiri yenye maelezo zaidi.
- source_word: Μολὸχ
  choice: Moloki
  rationale: Jina limeandikwa kwa namna inayofuata umbo la Kigiriki na inayotamkika kwa kawaida katika Kiswahili.
- source_word: ἄστρον
  choice: nyota
  rationale: Neno la Kigiriki linamaanisha nyota moja kwa moja; matini kuu haipaswi kulifanya kiishara kuwa ‘mfano wa nyota’ bila ulazima.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: ya mungu Refani
  rationale: SBLGNT ya Matendo inasema ‘ya mungu Refani,’ si ‘ya mungu wenu Refani’; muundo wa Kigiriki umehifadhiwa.
- source_word: Ῥαιφάν
  choice: Refani
  rationale: Unukuzi wa jina la Kigiriki unaofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: τύπους
  choice: sanamu
  rationale: Katika muktadha wa ibada ya miungu, ‘sanamu’ huwasilisha wazi vitu vya kuwakilisha vilivyotengenezwa, huku ‘maumbo’ au ‘mifananisho’ yakiwa mbadala halali.
- source_word: ἐποιήσατε
  choice: mlizozitengeneza
  rationale: Huhifadhi shtaka la moja kwa moja kwamba wao wenyewe walitengeneza vitu hivyo.
- source_word: προσκυνεῖν αὐτοῖς
  choice: ili kuziabudu
  rationale: Katika muktadha wa kidini, ‘kuabudu’ ni kisawe cha kawaida cha kitendo cha kusujudu au kutoa heshima ya ibada; kiwakilishi kinarejelea sanamu.
- source_word: μετοικιῶ
  choice: nitawapeleka uhamishoni
  rationale: Hueleza kuhamishwa kwa lazima kwenda ugenini kwa Kiswahili cha kawaida na chenye hadhi; ‘nitawafukuza’ kingeweza kupoteza dhana mahsusi ya uhamisho.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: mbali kupita Babeli
  rationale: ‘Mbali kupita’ huonyesha kwenda upande wa pili au zaidi ya Babeli na kuhifadhi jina lililo katika Matendo.
theological_decisions:
- issue: Mahali pa uhamisho katika nukuu ya Stefano ni tofauti na mapokeo ya chanzo cha Amosi
  choice: mbali kupita Babeli
  alternative: mbali kupita Dameski
  rationale: Matini ya Kigiriki ya Matendo inataja Babeli waziwazi; haijapatanishwa kimya kimya na Amosi 5:27. Tofauti hiyo imehifadhiwa katika tanbihi.
- issue: Uhusiano wa Refani na waabudu
  choice: mungu Refani
  alternative: mungu wenu Refani
  rationale: Matendo katika SBLGNT ina τοῦ θεοῦ Ῥαιφάν, ‘ya mungu Refani.’ Usomaji ‘mungu wenu’ unatokana na chanzo cha Kiebrania cha Amosi na umeelezwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida. ‘Hema’ huhifadhi maana halisi bila kuibua Maskani ya Mungu; ‘uhamishoni’ huwasilisha kwa uwazi kupelekwa ugenini kwa lazima. Viashiria vyote vya tanbihi vimewekwa katika matini kuu karibu na maneno yanayohusika.
