  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: sw
  text: Musa akafundishwa hekima yote ya Wamisri, naye alikuwa hodari katika maneno na matendo yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika usemi na matendo yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: akafundishwa
  rationale: Kitenzi cha kutendwa kinaonyesha kwamba Musa alipokea elimu na mafunzo; “akafundishwa” ni Kiswahili cha kawaida na chenye hadhi kinachofaa muktadha.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: hekima yote ya Wamisri
  rationale: Huhifadhi upana wa πάσῃ na uhusiano wa Αἰγυπτίων, huku kikisomeka kwa kawaida katika Kiswahili.
- source_word: δυνατὸς
  choice: hodari
  rationale: “Hodari” huonyesha uwezo na nguvu ya utendaji, na huambatana kwa kawaida na “katika maneno na matendo.”
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: katika maneno na matendo
  rationale: Huhifadhi jozi ya balagha ya λόγοις na ἔργοις kwa lugha ya sasa na inayoeleweka.
- source_word: αὐτοῦ
  choice: yake
  rationale: Kiwakilishi hiki kinarejelea kwa kawaida maneno na matendo ya Musa; katika Kiswahili “yake” mwishoni kinaweza kuvihusu vyote viwili.
theological_decisions:
- issue: Upeo wa uwezo wa Musa katika λόγοις
  choice: “alikuwa hodari katika maneno na matendo yake” bila kupatanisha kauli hii na Kutoka 4:10
  alternative: Kufafanua kwamba alikuwa na sifa au athari tu, au kupunguza maana ya uwezo wake wa kusema
  rationale: Kauli ya Stefano imetafsiriwa kwa masharti yake yenyewe. Tafsiri inadumisha mvutano uliopo na Kutoka 4:10 badala ya kuutatua kwa ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa karibu na Kigiriki bila kuwa mgumu.
