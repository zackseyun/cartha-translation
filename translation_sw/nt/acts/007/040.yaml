  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: sw
  text: wakimwambia Aroni[a], “Tutengenezee miungu itakayotutangulia; kwa maana huyu Musa, aliyetutoa kutoka nchi ya Misri—hatujui yaliyompata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu.” Neno la Kigiriki ni “miungu”; linarudia namna simulizi la Kutoka linavyosema na kuhifadhi madai ya watu badala ya kuyabadilisha kuwa neno la kufasiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: wakamwambia Aroni
  rationale: Kishirikishi cha aoristi kinaunganishwa kwa kawaida na simulizi ya Kiswahili kwa kitenzi cha mfululizo ‘waka-’; ‘kumwambia’ linaingiza maneno yao kwa ufasaha.
- source_word: Ποίησον ἡμῖν
  choice: Tufanyie
  rationale: Amri hii ina maana ya kutengeneza kitu kwa ajili yao; ‘tufanyie’ ni ya moja kwa moja na ya kawaida.
- source_word: θεοὺς
  choice: miungu
  rationale: Hili ndilo neno la moja kwa moja la θεοὺς na linahifadhi madai ya watu katika dondoo la Kutoka badala ya kulibadili kuwa neno la kufasiri ‘sanamu’.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: itakayotutangulia
  rationale: Kitenzi προπορεύομαι humaanisha kwenda mbele au kutangulia; tafsiri hii haiongezi maana ya ‘kutuongoza’ ambayo haijasemwa wazi.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: kwa maana huyu Musa
  rationale: ‘Kwa maana’ linaonyesha sababu inayotolewa na γάρ, huku ‘huyu Musa’ likihifadhi kiwakilishi cha kuonyesha ambacho huenda kina sauti ya kujitenga au kudharau.
- source_word: ἐξήγαγεν ἡμᾶς
  choice: aliyetutoa
  rationale: ἐξάγω ni kutoa au kuongoza kutoka; ‘aliyetutoa’ ni fupi, ya kawaida, na inaonyesha wazi mwendo wa kutoka.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: katika nchi ya Misri
  rationale: Inahifadhi neno γῆς, ‘nchi,’ na kwa Kiswahili ‘kutoa katika nchi’ ni muundo wa kawaida.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: hatujui yaliyompata
  rationale: Huu ni usemi wa sasa na wa kawaida wa Kiswahili unaowasilisha kwa usahihi maana ya kutokujua kilichotokea kwake.
theological_decisions:
- issue: Tafsiri ya θεοὺς katika muktadha wa ibada ya sanamu
  choice: miungu
  alternative: sanamu
  rationale: Kigiriki kinaripoti ombi la watu kwa neno θεοὺς, si kwa nomino mahsusi ya ‘sanamu.’ ‘Miungu’ linahifadhi maneno na mvutano wa simulizi bila kuingiza hukumu ya kifasiri katika matini kuu.
- issue: Nguvu ya οὗτος katika ‘ὁ Μωϋσῆς οὗτος’
  choice: huyu Musa
  alternative: Musa huyu
  rationale: ‘Huyu Musa’ ni ya asili katika usemi wa Kiswahili na inaweza kudokeza hali ya kujitenga au dharau bila kuifanya iwe kali kuliko Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘waka-’ unaendeleza simulizi kwa kawaida; dondoo linabaki la moja kwa moja na linaeleweka kwa msomaji wa kawaida.
