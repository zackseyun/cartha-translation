id: ACT.7.12
reference: Acts 7:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: sw
  text: Lakini Yakobo aliposikia kwamba kulikuwa na nafaka nchini Misri[a], aliwatuma baba zetu huko kwa mara ya kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyakula nchini Misri.” Neno la Kigiriki linaweza kumaanisha mahitaji ya chakula kwa upana, ingawa katika muktadha huu huenda linamaanisha nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia
  rationale: Kirai cha wakati kinaonyesha kwamba kusikia kulitangulia tendo kuu; “aliposikia” ni Kiswahili cha kawaida kinachohifadhi mfuatano huo.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa mpito wenye utofautishaji mdogo; “Lakini” hakiongezi ukinzani mkali.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: kwamba kulikuwa na nafaka nchini Misri
  rationale: Muundo wa Kigiriki baada ya kitenzi cha kusikia umetafsiriwa kama usemi usio wa moja kwa moja wa Kiswahili. “Nchini Misri” huonyesha mahali kwa njia ya kawaida.
- source_word: σιτία
  choice: nafaka
  rationale: Neno linaweza kumaanisha vyakula au mahitaji ya chakula kwa upana, lakini katika muktadha wa njaa na simulizi la Yosefu, “nafaka” ndiyo maana inayofaa zaidi.
- source_word: ἐξαπέστειλεν
  choice: aliwatuma ... huko
  rationale: “Aliwatuma” ni Kiswahili cha asili; “huko” hudokeza kutumwa waende Misri bila kulazimisha maana ya kiambishi ἐξ-.
- source_word: τοὺς πατέρας ἡμῶν
  choice: baba zetu
  rationale: Huhifadhi lugha ya kifamilia ya Kigiriki na hapa inawahusu wanaume waliokuwa mababu wa Israeli, si mababu wote kwa ujumla.
- source_word: πρῶτον
  choice: kwa mara ya kwanza
  rationale: Huonyesha wazi kwamba hii ilikuwa safari ya kwanza kati ya safari zaidi ya moja, ikitarajia safari ya pili katika simulizi.
theological_decisions:
- issue: Tafsiri ya τοὺς πατέρας ἡμῶν
  choice: baba zetu
  alternative: mababu zetu
  rationale: “Baba zetu” huhifadhi usemi mahususi wa kifamilia na jinsia ya wahusika wanaorejelewa. “Mababu zetu” ni ya kawaida pia, lakini ni pana zaidi na inaweza kujumuisha vizazi vilivyotangulia kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida huku ikihifadhi mpito wa simulizi, lugha ya kifamilia, na uwezekano mpana wa maana ya σιτία katika tanbihi.
