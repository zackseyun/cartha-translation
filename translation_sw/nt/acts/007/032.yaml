  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: sw
  text: “Mimi ni Mungu wa baba zako, Mungu wa Abrahamu na Isaka na Yakobo.” Musa akajawa na hofu, wala hakuthubutu kutazama kwa makini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuchunguza kwa makini.” Kitenzi cha Kigiriki kinaweza kumaanisha kutazama kwa uangalifu au kuzingatia kwa makini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ
  choice: Mimi ni
  rationale: Kiwakilishi kimesisitizwa katika Kigiriki, na sentensi ya utambulisho haina kitenzi kilichoandikwa. Kiswahili cha kawaida huhitaji “ni,” huku “Mimi” kikihifadhi msisitizo.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Huu ni utambulisho wa moja kwa moja wa Mungu; Kiswahili hakihitaji kibainishi kinacholingana na “the.”
- source_word: τῶν πατέρων σου
  choice: wa baba zako
  rationale: “Baba zako” hudumisha maana halisi na mwangwi wa agano katika nukuu hii, badala ya kuifanya kwa ujumla zaidi kuwa “mababu zako.”
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Mungu wa Abrahamu na Isaka na Yakobo
  rationale: Kurudia “na” kunahifadhi mpangilio na mdundo wa nukuu ya Kigiriki, huku “wa” ikionyesha uhusiano unaokusudiwa kwa njia ya kawaida katika Kiswahili.
- source_word: ἔντρομος ... γενόμενος
  choice: akajawa na hofu
  rationale: Kirai hiki kinaonyesha Musa aliingia katika hali ya woga mkubwa. “Akajawa na hofu” ni cha asili na chenye hadhi, bila kuzuia maana hiyo iwe ya hofu iliyoambatana na kutetemeka.
- source_word: δὲ
  choice: wala
  rationale: Mpito wa simulizi umeunganishwa kwa kawaida na matokeo yanayofuata; “wala” linaunganisha hali ya hofu na kutothubutu kwake bila kusisitiza utofautishaji usiokuwapo.
- source_word: οὐκ ἐτόλμα
  choice: hakuthubutu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kutokuwa na ujasiri wa kufanya jambo, na linafikisha vizuri maana ya kitenzi cha Kigiriki.
- source_word: κατανοῆσαι
  choice: kutazama kwa makini
  rationale: Katika muktadha wa kichaka kinachowaka, kitenzi kinaweza kumaanisha kuangalia au kuchunguza kwa uangalifu. Tafsiri hii inahifadhi maana ya kuona na pia wazo la umakini.
theological_decisions:
- issue: Utambulisho wa Mungu katika nukuu kutoka Kutoka
  choice: Mimi ni Mungu wa baba zako
  alternative: Mimi, Mungu wa baba zako
  rationale: Ingawa Kigiriki hakina kitenzi kilichoandikwa katika tamko hili, “ni” huhitajika katika Kiswahili cha kawaida. Tafsiri hii inahifadhi msisitizo wa kiwakilishi na nguvu ya tamko bila kuongeza dai jingine la kiteolojia.
- issue: Maana ya “baba” katika lugha ya agano
  choice: baba zako
  alternative: mababu zako
  rationale: “Baba zako” huhifadhi neno la chanzo na lugha ya jadi ya agano. Mfuatano unaofuata—Abrahamu, Isaka na Yakobo—unaweka wazi kuwa wanaozungumziwa ni watangulizi wa Musa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nukuu umehifadhiwa kwa urahisi wa kusomeka, na mfuatano wa “Abrahamu na Isaka na Yakobo” umeachwa ili kudumisha mdundo wa chanzo.
