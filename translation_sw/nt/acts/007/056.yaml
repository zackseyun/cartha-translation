  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipengele vya msingi vya Kigiriki: mwito wa tahadhari (Ἰδού), tendo la sasa la kuona, mbingu katika hali ya kuwa zimefunguliwa (kitenzi kishirikishi timilifu cha kutendwa), cheo “Mwana wa Adamu,” na mkao mahsusi wa kusimama upande wa kulia wa Mungu. Haibadilishi “amesimama” kuwa “ameketi,” wala haiongezi ufafanuzi wa kimafundisho katika andiko.'
