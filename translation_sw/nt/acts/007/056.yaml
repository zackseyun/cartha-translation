  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: sw
  text: 'Matendo 7:56


    Akasema, “Tazama, ninaona mbingu zikiwa zimefunguliwa[a], na Mwana wa Adamu[b] akiwa amesimama upande wa kulia wa Mungu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina kitenzi kishirikishi timilifu cha kutendwa, kinachosisitiza kwamba katika maono ya Stefano mbingu zilikuwa tayari zimefunguliwa na ziliendelea kuwa wazi.
    reason: lexical_alternative
  - marker: b
    text: “Mwana wa Adamu” ni cheo cha Kimasihi kinachotambulika, chenye mwangwi wa Danieli 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu linalohifadhi msisitizo na uharaka wa tamko la Stefano kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: θεωρῶ
  choice: ninaona
  rationale: Wakati uliopo unaonyesha kuona kunakoendelea; “ninaona” ni usemi wa asili unaofaa muktadha wa maono bila kuongeza ufafanuzi usiomo katika maandishi.
- source_word: τοὺς οὐρανοὺς
  choice: mbingu
  rationale: “Mbingu” huhifadhi maana ya kiroho ya neno la Kigiriki na inaweza kuwakilisha umbo lake la wingi bila kulifanya kuwa “anga,” ambalo lingepunguza uzito wa maono.
- source_word: διηνοιγμένους
  choice: zikiwa zimefunguliwa
  rationale: Muundo huu unaonyesha hali iliyopo iliyotokana na tendo lililokamilika na pia huhifadhi wazo la kutendwa lililo katika kitenzi kishirikishi timilifu cha kutendwa.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Tafsiri hii ya moja kwa moja huhifadhi cheo kinachotambulika na mwangwi wake wa Danieli 7:13 bila kukifasiri upya.
- source_word: ἐκ δεξιῶν
  choice: upande wa kulia
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha mahali pa heshima na mamlaka bila kuongeza neno “mkono,” ambalo halijaandikwa wazi katika Kigiriki.
- source_word: ἑστῶτα
  choice: akiwa amesimama
  rationale: Huhifadhi wazi mkao wa kusimama na kutatua kwa njia ya asili uhusiano wa kisarufi na kitenzi “ninaona,” bila kuupatanisha na vifungu vinavyosema ameketi.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa Kigiriki, bila upanuzi wa kiufafanuzi.
theological_decisions:
- issue: Cheo cha Kikristo υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” huhifadhi maneno ya Kigiriki kama cheo maalumu pamoja na uhusiano wake na Danieli 7; “Mwanadamu” lingeweza kuficha hadhi yake kama cheo.
- issue: Mkao wa Yesu aliyetukuzwa
  choice: akiwa amesimama upande wa kulia wa Mungu
  alternative: akiwa ameketi upande wa kulia wa Mungu
  rationale: Maandishi yanasema wazi kwamba amesimama. Tafsiri haiupatanishi mstari huu na vifungu vingine vinavyomtaja akiwa ameketi, hivyo inadumisha upekee na mvutano wa kitheolojia wa mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mshangao wa Stefano, hali ya mbingu kuwa zimefunguliwa, cheo “Mwana wa Adamu,” na mkao wa kusimama. Alama zote za tanbihi zimewekwa mara moja katika sehemu zinazohusika moja kwa moja.
