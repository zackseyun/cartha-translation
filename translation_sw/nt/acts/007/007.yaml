  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: sw
  text: Nami nitalihukumu taifa watakalolitumikia kama watumwa[a], Mungu alisema, na baada ya hayo watatoka na kuniabudu[b] mahali hapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakalolitumikia.” Kitenzi cha Kigiriki kinamaanisha “kutumikia,” lakini hapa muktadha ni utumwa wa Israeli nchini Misri.
    reason: lexical_alternative
  - marker: b
    text: Au, “kunihudumia” au “kunitumikia.” Kitenzi cha Kigiriki kinaweza kumaanisha huduma ya kidini inayotolewa kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: taifa
  rationale: Neno hili hapa linamaanisha taifa lililowafanya wazao wa Abrahamu kuwa watumwa, likirejelea Mwanzo 15:14.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: watakalolitumikia kama watumwa
  rationale: Kitenzi δουλεύω kinaweza kumaanisha kutumikia, lakini katika muktadha huu huduma hiyo ni utumwa wa kulazimishwa nchini Misri. Kiswahili hiki kinaweka wazi maana ya muktadha bila kubadili mhusika wa tendo.
- source_word: κρινῶ
  choice: nitalihukumu
  rationale: Kitenzi hiki kinaonyesha Mungu akitoa na kutekeleza hukumu dhidi ya taifa hilo; 'hukumu' huhifadhi taswira ya kimahakama.
- source_word: ὁ θεὸς εἶπεν
  choice: Mungu alisema
  rationale: Hili ni tamko linalomtaja wazi Mungu kuwa msemaji, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: μετὰ ταῦτα
  choice: baada ya hayo
  rationale: Huhifadhi maana ya mfuatano wa matukio na wingi wa kiwakilishi kwa Kiswahili cha kawaida.
- source_word: ἐξελεύσονται
  choice: watatoka
  rationale: Hurejelea kutoka kwa wazao wa Abrahamu katika taifa lililowafanya watumwa.
- source_word: λατρεύσουσίν μοι
  choice: kuniabudu
  rationale: λατρεύω inapomwelekea Mungu humaanisha huduma ya kidini au ibada, si kazi ya kawaida tu.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: mahali hapa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya τόπος pamoja na kiwakilishi cha karibu.
theological_decisions:
- issue: Maana ya δουλεύω katika muktadha wa utumwa
  choice: watakalolitumikia kama watumwa
  alternative: watakalolitumikia
  rationale: Ingawa kitenzi chenyewe ni 'kutumikia,' muktadha wa Mwanzo 15 na simulizi la Stefano unaonyesha wazi utumwa wa kulazimishwa. Kirai 'kama watumwa' kinawasilisha maana hiyo kwa Kiswahili cha sasa.
- issue: Maana ya λατρεύω inapomwelekea Mungu
  choice: kuniabudu
  alternative: kunisitiri / kunitumikia
  rationale: '''Kuniabudu'' huonyesha huduma ya kidini inayotolewa kwa Mungu na huepuka kuifanya isikike kama kazi ya kawaida.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku ukihifadhi sauti ya ahadi ya hukumu na ukombozi.
