  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: sw
  text: Kisha, baada ya kutoka katika nchi ya Wakaldayo, akakaa Harani. Na kutoka huko, baada ya baba yake kufa, Mungu[a] akamhamisha kwenda katika nchi hii ambayo mnaishi sasa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamhamisha”; Kigiriki hakitaji kiima waziwazi, ingawa muktadha unaonyesha kuwa ni Mungu.
    reason: lexical_alternative
  - marker: b
    text: Stefano anasema uhamisho huu ulitokea baada ya baba yake kufa. Linganisha Mwanzo 11:32; 12:4 kuhusu mpangilio wa matukio haya.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Ni kiunganishi cha wakati kinachoendeleza mfululizo wa matukio katika simulizi kwa Kiswahili cha kawaida.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: baada ya kutoka katika nchi ya Wakaldayo
  rationale: Muundo wa ‘baada ya’ unaonyesha kuwa kutoka kulitangulia kukaa Harani; ‘nchi ya Wakaldayo’ huhifadhi usemi kamili wa Kigiriki.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: akaenda kuishi Harani
  rationale: Hueleza kwa lugha ya asili kuchukua makao mahali, bila kutumia neno la kizamani; Harani ni tahajia inayotumika kwa jina hilo la mahali.
- source_word: κἀκεῖθεν
  choice: Kutoka huko
  rationale: Huhifadhi wazo la kuondoka mahali alikokuwa na kuendeleza simulizi; muunganisho wake unaeleweka katika mwanzo wa sentensi mpya.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: baada ya baba yake kufa
  rationale: Hutoa kwa uwazi uhusiano wa wakati uliomo katika muundo wa Kigiriki bila kubadili mpangilio wa simulizi.
- source_word: μετῴκισεν αὐτὸν
  choice: Mungu akamhamishia
  rationale: Kitenzi kina maana ya kumsababisha mtu ahame au akae mahali pengine. ‘Mungu’ ametajwa wazi kwa ufafanuzi kutokana na muktadha, ingawa kiima hakijaandikwa wazi katika Kigiriki.
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: katika nchi hii mnamoishi sasa
  rationale: Hutoa kwa Kiswahili fasaha mwendo wa kuingia katika nchi hiyo na hali ya wasikilizaji kuishi humo wakati wa hotuba.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha μετῴκισεν
  choice: Kutaja ‘Mungu’ katika matini, pamoja na tanbihi inayoonyesha kwamba Kigiriki hakitaji kiima waziwazi
  alternative: Kutafsiri kwa ‘akamhamisha’ bila kutaja jina la kiima
  rationale: Muktadha wa hotuba unaelekeza kwa Mungu kama mtendaji, lakini tanbihi huhifadhi uwazi kuhusu hali halisi ya sarufi ya Kigiriki na kutomficha msomaji uwezekano wa tafsiri ya moja kwa moja zaidi.
- issue: Mvutano wa mpangilio wa matukio ukilinganishwa na Mwanzo
  choice: Kuhifadhi usemi wa Stefano kwamba uhamisho ulitokea baada ya baba yake kufa
  alternative: Kubadili au kufafanua sentensi ili kupatanisha waziwazi mpangilio huo na Mwanzo 11:32; 12:4
  rationale: Tafsiri inapaswa kuwasilisha simulizi la Matendo kama lilivyo badala ya kutatua kimya kimya mvutano wa mpangilio wa matukio.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku ukihifadhi mfuatano wa matukio, utambulisho wa nchi ya Wakaldayo, utata wa kiima katika Kigiriki kupitia tanbihi, na mvutano wa kihistoria bila kuupatanisha kimya kimya.
