  text: Then the high priest said[a], “Are these things so?”
translation:
  language: sw
  text: Kisha kuhani mkuu akasema[a], “Je, mambo haya ni kweli?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, ni hivyo?” au kwa ufafanuzi zaidi, “Je, mashtaka haya ni ya kweli?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: akasema
  rationale: Kitenzi cha Kigiriki ni namna ya wakati uliopita ya λέγω, ‘kusema.’ Ingawa kinaanzisha swali, ‘akasema’ huhifadhi umbo la usimulizi bila kulifafanua zaidi kuwa ‘akauliza.’
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza simulizi kutoka mashtaka yaliyotangulia; ‘Kisha’ ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ὁ ἀρχιερεύς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kuhani mwenye cheo cha juu anayesimamia katika mazingira haya ya hukumu.
- source_word: Εἰ
  choice: Je
  rationale: Katika swali la moja kwa moja, εἰ huanzisha swali linalotazamia jibu la ndiyo au hapana. ‘Je’ hulifanya swali kuwa la asili katika Kiswahili.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Usemi huu wa wingi unarejelea yaliyosemwa katika mashtaka yaliyotangulia. ‘Mambo haya’ huhifadhi upana wake bila kuyaainisha moja kwa moja kuwa mashtaka.
- source_word: οὕτως ἔχει
  choice: ni kweli
  rationale: Msemo wa Kigiriki una maana ya ‘kuwa hivyo’ au ‘kuwa kama ilivyosemwa.’ Katika swali hili la kisheria, ‘ni kweli’ ni Kiswahili cha asili kinachodumisha maana ya msingi.
