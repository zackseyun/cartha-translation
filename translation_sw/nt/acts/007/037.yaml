id: ACT.7.37
reference: Acts 7:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: sw
  text: Huyu ndiye Musa aliyewaambia wana wa Israeli[b], “Mungu atawainulia nabii[a] kutoka miongoni mwa ndugu zenu[c], kama mimi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye ufafanuzi zaidi, “yule Nabii,” kwa kuzingatia tumaini lililojulikana sana kutokana na Kumbukumbu la Torati 18:15 na jinsi lilivyohusishwa na Yesu katika Matendo.
    reason: alternative_reading
  - marker: b
    text: Kwa Kigiriki, kihalisi, “wana wa Israeli”; maana yake pia inaweza kutolewa kama “watoto wa Israeli” au “Waisraeli.”
    reason: lexical_alternative
  - marker: c
    text: Hapa “ndugu” ni Waisraeli wenzao; neno la Kigiriki liko katika wingi wa kiume.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Huyu ndiye Musa
  rationale: Muundo huu wa Kiswahili ni wa asili na unahifadhi msisitizo wa kumtambulisha Musa huyu hasa.
- source_word: εἴπας
  choice: aliyewaambia
  rationale: Kirai tegemezi kinawasilisha kwa kawaida kazi ya kitenzi-jina cha wakati uliopita na pia kinaonyesha wazi walengwa wa maneno hayo.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya neno υἱοῖς na mwangwi wa lugha ya Agano la Kale, bila kutumia Kiswahili cha kizamani.
- source_word: Προφήτην
  choice: nabii
  rationale: Nomino haina kibainishi katika Kigiriki; Kiswahili hakihitaji kibainishi kisicho dhahiri, hivyo 'nabii' huhifadhi kutokubainishwa huko bila kulazimisha maana ya cheo maalumu.
- source_word: ἀναστήσει
  choice: atawainulia
  rationale: Huwasilisha tendo la Mungu la kumleta au kumteua nabii kwa ajili yao, huku likihifadhi sitiari ya 'kuinua' iliyo katika kitenzi cha Kigiriki.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hili ndilo jina la kawaida na lenye heshima kwa mhusika wa kitenzi katika muktadha huu.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: kutoka miongoni mwa ndugu zenu
  rationale: '''Kutoka miongoni mwa'' huonyesha kwamba nabii huyo atatoka ndani ya kundi lao; ''ndugu zenu'' huhifadhi lugha ya kifamilia na kitaifa.'
- source_word: ὡς ἐμέ
  choice: kama mimi
  rationale: Ni ulinganisho wa moja kwa moja na wa kawaida unaohifadhi uhusiano wa nabii huyo na Musa bila kuongeza ufafanuzi.
theological_decisions:
- issue: Nukuu ya Kumbukumbu la Torati 18:15 na maana yake kuhusu Masihi
  choice: Kutumia 'nabii' katika matini kuu bila kuiandika kama cheo maalumu
  alternative: '''yule Nabii'''
  rationale: Ingawa Matendo inaitumia nukuu hii kwa namna inayomhusu Kristo, Προφήτην haina kibainishi hapa. Tafsiri haipaswi kuingiza hitimisho hilo moja kwa moja katika maneno ya msingi; muktadha unaweza kulionyesha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'Huyu ndiye Musa' unadumisha msisitizo bila kuwa mgumu; 'atawainulia' huhifadhi picha ya chanzo huku ikisomeka kwa kawaida. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
