  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: sw
  text: Nalo, baada ya kulipokea kwa kupokezana,[b] mababu zetu waliliingiza pamoja na Yoshua,[a] walipoitwaa nchi ya mataifa ambayo Mungu aliyafukuza kutoka mbele ya mababu zetu, mpaka siku za Daudi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, “Yesu”; jina Ἰησοῦς linaweza kumaanisha Yesu au Yoshua. Hapa linamrejelea Yoshua mwana wa Nuni.
    reason: alternative_reading
  - marker: b
    text: Au, “mababu zetu, wakiwa wamelipokea kwa mfululizo, waliliingiza.” Kitenzi kishirikishi kinasisitiza kupokezana kutoka kizazi hadi kizazi.
    reason: lexical_alternative
  - marker: c
    text: Kirai “mpaka siku za Daudi” kinaweza kueleweka kuwa kinahusu kuendelea kwa hema katika historia ya Israeli; kwa muundo wa sentensi kinaweza pia kuhusishwa na mfululizo wa matukio yaliyotangulia.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἣν
  choice: Nalo
  rationale: Kiwakilishi hiki cha urejeshi kinarejelea hema lililotajwa katika mstari uliotangulia; “nalo” hudumisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: εἰσήγαγον
  choice: waliliingiza
  rationale: Kitenzi kina maana ya kuleta au kuingiza ndani; kiambishi “-li-” kinaonyesha wazi kuwa kilichoingizwa ni hema.
- source_word: διαδεξάμενοι
  choice: baada ya kulipokea kwa kupokezana
  rationale: Tafsiri hii huhifadhi wazo la kupokea kitu kutoka kwa waliotangulia na la mfululizo wa vizazi, badala ya kusema tu “kwa zamu.”
- source_word: οἱ πατέρες ἡμῶν
  choice: mababu zetu
  rationale: Katika muktadha huu neno linawarejelea wahenga wa Israeli; “mababu zetu” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: μετὰ Ἰησοῦ
  choice: pamoja na Yoshua
  rationale: Jina la Kigiriki Ἰησοῦς linaweza kuwakilisha Yesu au Yoshua, lakini muktadha wa kuingia Kanaani baada ya Musa unamtambulisha Yoshua mwana wa Nuni.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: walipoitwaa nchi ya mataifa
  rationale: κατάσχεσις huonyesha kutwaa au kumiliki. “Nchi” imewekwa wazi kutokana na muktadha wa kuingia Kanaani, huku mataifa yakibaki kuwa wale waliokuwa wameikalia.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: ambayo Mungu aliyafukuza
  rationale: ἐξωθέω humaanisha kusukuma au kufukuza nje; “aliyafukuza” ni ya asili na huhifadhi nguvu ya tendo.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: mbele ya mababu zetu
  rationale: Hii huhifadhi nahau ya chanzo yenye maana ya kuyaondoa mataifa kutoka mbele au katika uwepo wa mababu.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: mpaka siku za Daudi
  rationale: Ni tafsiri ya moja kwa moja ya usemi wa wakati na pia hudumisha uwezekano wa kuuhusisha na historia ya hema au na mfululizo wa matukio yaliyotangulia.
theological_decisions:
- issue: Mhusika anayetajwa na Ἰησοῦ
  choice: Yoshua
  alternative: Yesu
  rationale: Umbo la jina ni lilelile kwa Kigiriki, lakini simulizi la kuingia katika nchi baada ya Musa linamhusu Yoshua mwana wa Nuni, si Yesu wa Nazareti.
- issue: Nguvu ya διαδεξάμενοι
  choice: Mababu walilipokea hema kwa kupokezana kutoka kwa waliowatangulia
  alternative: Mababu walifanya jambo hilo kwa zamu tu
  rationale: Kitenzi kishirikishi kinasisitiza kupokea kwa urithi au kwa mfululizo; tafsiri kuu inaweka wazi vipengele vyote viwili.
- issue: Uhusiano wa ἕως τῶν ἡμερῶν Δαυίδ
  choice: Muundo umeachwa uweze kuhusishwa na historia pana iliyotangulia
  alternative: Kusema wazi kwamba hema pekee lilibaki mpaka siku za Daudi, au kwamba Mungu aliendelea kuyafukuza mataifa mpaka wakati huo
  rationale: Muundo wa Kigiriki unaruhusu mjadala kuhusu kile ambacho kirai cha mwisho kinakirekebisha; tafsiri haipaswi kuondoa utata huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mababu” limetumiwa badala ya “baba” ili kuonyesha wazi wahenga wa kihistoria; muundo wa sentensi umehifadhi mwendelezo wake kutoka mstari uliotangulia.
