  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: sw
  text: Huyu ndiye aliyekuwa katika kusanyiko kule nyikani, pamoja na malaika aliyekuwa akisema naye katika Mlima Sinai, na baba zetu. Alipokea matamko yaliyo hai[a] ili atupatie sisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno yaliyo hai” au “matamko yanayotoa uzima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: kusanyiko
  rationale: Neno hili linaonyesha mkutano wa watu wa Israeli jangwani bila kuingiza moja kwa moja dhana ya baadaye ya taasisi ya kanisa.
- source_word: ἐρήμῳ
  choice: nyikani
  rationale: “Nyikani” ni neno la kawaida la kibiblia kwa eneo lisilokaliwa ambako Israeli walizunguka; si lazima limaanishe jangwa la mchanga pekee.
- source_word: ἀγγέλου
  choice: malaika
  rationale: Katika muktadha wa Sinai, neno hili linarejelea kiumbe wa mbinguni, si mjumbe wa kibinadamu.
- source_word: λαλοῦντος
  choice: aliyekuwa akisema naye
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea na unahifadhi kwamba malaika alikuwa akizungumza na Musa.
- source_word: ὄρει Σινᾶ
  choice: Mlima Sinai
  rationale: Hili ndilo umbo la kawaida na la asili la jina hili kwa Kiswahili.
- source_word: πατέρων ἡμῶν
  choice: baba zetu
  rationale: Tafsiri hii inahifadhi umbo la kiume la Kigiriki na rejeo kwa mababu wa Israeli; katika Kiswahili cha kibiblia “baba zetu” pia hueleweka kuwa waliotangulia katika historia ya taifa.
- source_word: ἐδέξατο
  choice: alipokea
  rationale: Inaeleza moja kwa moja kwamba Musa alikuwa mpokeaji wa ufunuo wa Mungu.
- source_word: λόγια
  choice: maneno matakatifu
  rationale: λόγια hapa ni matamko ya Mungu, si maneno ya kawaida. “Maneno matakatifu” ni wazi kwa msomaji wa kawaida na huhifadhi uzito wa kiufunuo kuliko “maneno” peke yake.
- source_word: ζῶντα
  choice: yaliyo hai
  rationale: Tafsiri ya moja kwa moja huhifadhi taswira na mvutano wa kitheolojia bila kuamua kimyakimya kwamba maana ni “yanayotoa uzima.”
- source_word: δοῦναι
  choice: ili atupe
  rationale: 'Inaonyesha kusudi la Musa kupokea maneno hayo: kuyatoa kwa watu.'
- source_word: ἡμῖν
  choice: sisi
  rationale: Huhifadhi kujihusisha kwa Stefano na wasikilizaji wake katika historia ya Israeli.
- source_word: ὁ γενόμενος
  choice: ndiye aliyekuwa
  rationale: Ni Kiswahili cha asili kinachoonyesha kuwapo kwa Musa katika kusanyiko hilo bila kutumia tafsiri ngumu ya neno kwa neno.
theological_decisions:
- issue: Iwapo ἐκκλησίᾳ itafsiriwe “kanisa” kuhusu Israeli nyikani
  choice: kusanyiko
  alternative: kanisa; mkutano
  rationale: “Kusanyiko” linaonyesha Israeli waliokusanyika bila kulazimisha hitimisho kwamba kifungu kinatumia maana ya kitaasisi ya baadaye ya “kanisa.”
- issue: Iwapo λόγια ζῶντα ifafanuliwe kuwa “maneno yanayotoa uzima”
  choice: maneno matakatifu yaliyo hai
  alternative: maneno yaliyo hai; matamko yanayotoa uzima
  rationale: Tafsiri hii huhifadhi maana ya λόγια kama matamko ya Mungu na ζῶντα kama “yaliyo hai,” bila kupunguza utata wake kuwa uwezo wa kutoa uzima pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili iwe rahisi kusomeka. “Kusanyiko” huepuka maana ya kitaasisi inayoweza kuambatana na “kanisa,” na “maneno matakatifu yaliyo hai” huwasilisha kwa uwazi λόγια ζῶντα bila kuondoa mvutano wake wa kitheolojia.
