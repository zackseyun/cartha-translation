  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: sw
  text: Lakini alipokuwa amewekwa nje[a], binti ya Farao akamchukua[b] na kumlea awe mwanawe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, akiwa amewekwa au kuachwa nje, kama mtoto mchanga.
    reason: lexical_clarification
  - marker: b
    text: Au “alimwinua na kumchukua.” Kitenzi cha Kigiriki kinaweza kutumiwa kwa kumchukua mtoto aliyewekwa nje.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “kwa mwana kwake” au “kama mwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: baada ya kuachwa nje
  rationale: Kitenzi hiki katika muktadha wa mtoto mchanga humaanisha kuwekwa au kuachwa nje. Tafsiri hii inadumisha hali ya kihistoria bila kuongeza kwa lazima wazo lenye nguvu zaidi la kutelekezwa kabisa.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye utofautisho kutoka kutupwa kwa Musa kwenda kuokolewa kwake na binti ya Farao.
- source_word: ἀνείλατο
  choice: alimchukua
  rationale: Hapa kitenzi kinamaanisha kumchukua mtoto aliyeachwa nje. “Alimchukua” ni Kiswahili cha kawaida na hakitangulizi wazo la kufanywa mwana, ambalo linaelezwa baadaye katika sentensi.
- source_word: θυγάτηρ Φαραὼ
  choice: binti ya Farao
  rationale: Huu ndio muundo wa kawaida na wa asili wa Kiswahili unaohifadhi uhusiano ulio katika Kigiriki.
- source_word: ἀνεθρέψατο
  choice: kumlea
  rationale: Kitenzi kinamaanisha kumtunza na kumkuza mtoto; “kumlea” ni neno la kawaida, wazi na linalofaa muktadha.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: kama mwanawe
  rationale: Kirai kinaonyesha kuwa alimlea katika nafasi na uhusiano wa mwana kwake mwenyewe. “Kama mwanawe” kinaeleza jambo hilo kwa Kiswahili cha asili bila kulazimisha istilahi ya kisheria ya kuasili.
theological_decisions:
- issue: Iwapo tendo la binti ya Farao lielezwe moja kwa moja kuwa kuasili
  choice: kumlea kama mwanawe
  alternative: kumwasili kuwa mwanawe
  rationale: Kigiriki kinaeleza kwanza kumchukua mtoto, kisha kumlea awe mwana kwake. Tafsiri iliyochaguliwa inahifadhi hatua hizo na haiongezi dhana maalumu ya kisheria ambayo haijasemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kwa msomaji wa kawaida. “Kuachwa nje” huhifadhi taswira ya mtoto aliyewekwa wazi bila kuifanya nia ya kumtelekeza kuwa wazi zaidi kuliko Kigiriki; tanbihi inafafanua matumizi hayo. “Kama mwanawe” ni ya asili kuliko tafsiri neno kwa neno na inadumisha uhusiano wa kifamilia unaokusudiwa.
