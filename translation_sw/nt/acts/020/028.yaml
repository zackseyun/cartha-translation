source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: sw
  text: Jitunzeni ninyi wenyewe na kundi lote, ambamo Roho Mtakatifu aliwaweka kuwa waangalizi, ili kulichunga kanisa la Mungu[a], alilojipatia kwa damu ya aliye wake mwenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “kanisa la Bwana” badala ya “kanisa la Mungu.”
    reason: textual_variant
  - marker: b
    text: Kwa karibu zaidi, “kwa damu ya aliye wake mwenyewe”; yaweza kueleweka “kwa damu ya Mwana wake mwenyewe.” Tafsiri ya jadi ni “kwa damu yake mwenyewe.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: Jiangalieni kwa makini
  rationale: Kitenzi cha agizo katika wakati wa sasa kinadai uangalifu unaoendelea. Kauli hii ni ya asili katika Kiswahili na inahifadhi maana ya kujitazama wenyewe.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: kundi lote
  rationale: Inahifadhi sitiari ya kichungaji na kuonyesha wazi kwamba hakuna sehemu ya kundi inayopaswa kupuuzwa.
- source_word: ἐν ᾧ
  choice: ambamo
  rationale: Inaonyesha kwamba waangalizi wamewekwa ndani ya kundi hilo, si juu yake kana kwamba wao si sehemu yake.
- source_word: ἔθετο
  choice: amewaweka
  rationale: Hutoa maana ya kuwapa nafasi au jukumu, huku ikibaki karibu na picha ya msingi ya τίθημι.
- source_word: ἐπισκόπους
  choice: waangalizi
  rationale: Hutafsiri kazi ya kusimamia bila kuingiza mapema maana za baadaye za cheo cha kikanisa.
- source_word: ποιμαίνειν
  choice: ili kulichunga
  rationale: Inadumisha sitiari ya mchungaji inayoungana na neno “kundi,” badala ya kutumia istilahi ya kitaasisi.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Katika muktadha huu neno linamaanisha jumuiya ya waamini wa Kikristo; “kanisa” ndilo neno la kawaida na linaloeleweka.
- source_word: τοῦ θεοῦ
  choice: la Mungu
  rationale: Hufuata matini ya SBLGNT; tofauti muhimu ya “la Bwana” imehifadhiwa katika tanbihi.
- source_word: περιεποιήσατο
  choice: alilipata
  rationale: Huonyesha kujipatia au kupata kwa ajili yake mwenyewe bila kulazimisha picha ya biashara iliyo wazi zaidi katika “kununua.”
- source_word: διὰ τοῦ αἵματος
  choice: kwa damu
  rationale: Katika Kiswahili “kwa” huwasilisha kwa kawaida chombo au njia, na hapa inadumisha uzito wa dhabihu na ukombozi.
- source_word: τοῦ ἰδίου
  choice: ya Mwana wake mwenyewe
  rationale: Kivumishi hiki kinaweza kutumiwa kama nomino, yaani “wa kwake mwenyewe,” kinachoeleweka kuwa Mwana. Kutaja “Mwana” kunafanya sentensi iwe ya asili na wazi katika Kiswahili; usemi halisi na tafsiri nyingine ya jadi zimehifadhiwa katika tanbihi.
theological_decisions:
- issue: Rejeo na nguvu ya τοῦ αἵματος τοῦ ἰδίου
  choice: “kwa damu ya Mwana wake mwenyewe” katika matini kuu
  alternative: “kwa damu yake mwenyewe”; kwa uhalisi zaidi, “kwa damu ya aliye wake mwenyewe”
  rationale: Kigiriki kina usemi mfupi ambao unaweza kueleweka kuwa damu ya “aliye wake mwenyewe,” kwa kawaida Mwana, huku tafsiri ya jadi ikiuelewa kuwa damu ya Mungu mwenyewe. Matini kuu inatumia Kiswahili cha asili kwa kuonyesha rejeo linalowezekana zaidi, na tanbihi inadumisha mvutano wa kisarufi na wa kikristo bila kuficha tafsiri nyingine.
- issue: Tofauti ya matini katika τοῦ θεοῦ
  choice: “kanisa la Mungu”
  alternative: “kanisa la Bwana”
  rationale: Matini iliyotolewa ya SBLGNT inasoma θεοῦ, kwa hiyo hiyo ndiyo inayotafsiriwa katika matini kuu; usomaji mwingine muhimu umeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sitiari za kundi na kuchunga zimehifadhiwa, na sentensi imeundwa kwa mtiririko unaoeleweka kwa wasomaji wa kawaida.
