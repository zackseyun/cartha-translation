source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: sw
  text: 'Lakini siyahesabu maisha yangu kuwa yenye thamani yoyote kwangu mwenyewe[a], mradi tu niumalize mwendo wangu[b] na huduma niliyopokea kutoka kwa Bwana Yesu: kutoa ushahidi kuhusu injili ya neema ya Mungu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu kuwa ya thamani kwangu mwenyewe.” Hapa “maisha” yamependelewa kwa sababu muktadha unahusu utayari wa Paulo kukabili kifo ili akamilishe utume wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbio zangu.” Neno la Kigiriki δρόμος linaweza kumaanisha mwendo au mbio zinazopaswa kukamilishwa.
    reason: lexical_alternative
  - marker: c
    text: Au, “kushuhudia,” au “kutoa ushahidi kwa msisitizo,” kuhusu injili ya neema ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι
  choice: siyahesabu ... kuwa yenye thamani yoyote
  rationale: Nahau hii inaeleza kutokipa kitu hesabu au thamani. Kauli hii ni ya kawaida katika Kiswahili na inadumisha maana ya Paulo kutoyatanguliza maisha yake mwenyewe.
- source_word: ψυχήν
  choice: maisha
  rationale: Katika muktadha huu Paulo anazungumzia uwezekano wa kupoteza uhai wake anapokamilisha utume wake, si kutofautisha nafsi isiyo ya mwili na mwili.
- source_word: τιμίαν ἐμαυτῷ
  choice: yenye thamani yoyote kwangu mwenyewe
  rationale: τιμίαν humaanisha kitu cha thamani au cha bei kubwa, na ἐμαυτῷ huonyesha tathmini ya Paulo kuhusu maisha yake mwenyewe.
- source_word: ὡς τελειῶσαι
  choice: mradi tu niumalize
  rationale: Muundo wa Kigiriki ni mfupi na unaonyesha lengo kuu linalotawala msimamo wa Paulo. “Mradi tu” hudumisha uzito huo bila kuufanya kuwa kishazi cha kusudi pekee.
- source_word: δρόμον
  choice: mwendo
  rationale: Neno hili linaweza kuashiria njia inayofuatwa au mbio zinazokamilishwa. “Mwendo” hudumisha sitiari bila kulazimisha picha ya mashindano.
- source_word: διακονίαν
  choice: huduma
  rationale: Hapa neno hilo linamaanisha kazi ya utumishi ambayo Paulo alikabidhiwa na Yesu; “huduma” ni tafsiri ya kawaida na yenye heshima katika muktadha huu.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: kutoka kwa Bwana Yesu
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo; huduma hiyo ilitoka kwa Bwana Yesu.
- source_word: διαμαρτύρασθαι
  choice: kuishuhudia
  rationale: Kitenzi hiki humaanisha kutoa ushahidi, mara nyingi kwa msisitizo au uzito. “Kuishuhudia” ni cha asili na hudumisha wazo la kutoa ushahidi kuhusu injili.
- source_word: εὐαγγέλιον
  choice: injili
  rationale: “Injili” ni neno la Kiswahili linaloeleweka kwa upana kwa ujumbe mwema wa Kikristo na hudumisha uzito wa istilahi hii.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: ya neema ya Mungu
  rationale: Muundo huu hudumisha mfuatano wa umilikishi wa Kigiriki, ambao unaweza kuieleza injili kuwa inahusu au ina sifa ya neema ya Mungu bila kuifungia katika maana moja tu.
theological_decisions:
- issue: Maana ya ψυχή katika maelezo ya Paulo kujihusu
  choice: maisha
  alternative: nafsi
  rationale: Muktadha unahusu utayari wa Paulo kukabili mateso na kifo ili akamilishe utume wake. “Maisha” huepuka kuingiza hapa mgawanyo wa mwili na nafsi ambao kifungu hakitilii mkazo.
- issue: Nguvu ya ὡς τελειῶσαι
  choice: mradi tu niumalize
  alternative: ili niumalize
  rationale: Kishazi hiki kinaonyesha lengo kuu la Paulo, lakini uhusiano wake wa kisarufi ni mfupi na wenye mvutano. “Mradi tu” hudumisha msisitizo huo kuliko kukifanya kuwa kauli ya kusudi iliyo wazi kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sitiari ya mwendo na muundo wa mwisho unaofafanua huduma ya Paulo, huku ikiepuka lugha ya kimadhehebu.
