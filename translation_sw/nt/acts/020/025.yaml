  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: sw
  text: Na sasa, tazama, ninajua kwamba ninyi nyote ambao nilizunguka miongoni mwenu nikihubiri ufalme hamtauona tena uso wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazameni
  rationale: Agizo hili la kuvuta usikivu limehifadhiwa kwa usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: διῆλθον
  choice: nilipita kati yenu
  rationale: Huwasilisha wazo la Paulo kuzunguka au kupita miongoni mwa wasikilizaji wake bila kuongeza maelezo yasiyokuwamo.
- source_word: κηρύσσων
  choice: nikihubiri
  rationale: Huhifadhi maana ya kutangaza ujumbe hadharani na kwa mamlaka.
- source_word: βασιλείαν
  choice: ufalme
  rationale: Huhifadhi istilahi pana ya Kigiriki bila kuongeza 'wa Mungu,' maneno ambayo hayapo katika maandishi haya.
- source_word: ὄψεσθε τὸ πρόσωπόν μου
  choice: hamtauona uso wangu
  rationale: Huhifadhi nahau halisi inayomaanisha kutomwona Paulo tena, kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Ufalme unatajwa bila kielezi
  choice: ufalme
  alternative: ufalme wa Mungu
  rationale: Ingawa muktadha unaweza kuelekeza kwa ufalme wa Mungu, SBLGNT hapa ina τὴν βασιλείαν pekee; tafsiri haiongezi maneno ili kudumisha upeo na mkazo wa matini.
- issue: Upeo wa οὐκέτι pamoja na ὑμεῖς πάντες
  choice: ninyi nyote ... hamtauona uso wangu tena
  alternative: hakuna hata mmoja wenu ... atakayeuona uso wangu tena
  rationale: Muundo huu hudumisha mkazo wa 'ninyi nyote' wa Kigiriki na maana kwamba hawatamwona tena, bila kubadili kuwa muundo wa umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umewekwa wa asili kadiri inavyowezekana huku sentensi ikibaki wazi na ya kawaida kwa wasomaji wa leo.
