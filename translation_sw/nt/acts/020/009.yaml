id: ACT.20.9
reference: Acts 20:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: sw
  text: Kijana mmoja aitwaye Eutiko alikuwa ameketi dirishani. Paulo alipokuwa akiendelea kusema kwa muda mrefu, kijana huyo alianza kuzama katika usingizi mzito. Hatimaye usingizi ukamshinda, akaanguka chini kutoka ghorofa ya tatu, akainuliwa akiwa amekufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akachukuliwa akiwa amekufa.” Kitenzi cha Kigiriki kinaweza kumaanisha “aliinuliwa” au “alichukuliwa.”
    reason: Mbadala wa kileksia wa ἤρθη unastahili kuhifadhiwa kwa sababu maana zote mbili zinawezekana katika muktadha.
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: Kijana mmoja ... alikuwa ameketi
  rationale: ‘Kijana mmoja’ huwasilisha hali ya kutotajwa hapo awali ya τις νεανίας kwa Kiswahili cha kawaida; ‘alikuwa ameketi’ huweka mazingira na mkao wake unaoendelea.
- source_word: ὀνόματι Εὔτυχος
  choice: aitwaye Eutiko
  rationale: Hii ni tafsiri ya kawaida na ya asili ya muundo wa Kigiriki unaotaja jina; ‘Eutiko’ ni uhawilishaji unaofaa wa Εὔτυχος katika Kiswahili.
- source_word: ἐπὶ τῆς θυρίδος
  choice: dirishani
  rationale: θυρίς ni dirisha au tundu la dirisha; ‘dirishani’ hudokeza kwamba alikuwa katika nafasi ya dirisha bila kuongeza maelezo yasiyotolewa kuhusu kingo zake.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: alianza kuzama katika usingizi mzito
  rationale: Muundo huu unaonyesha hatua inayoendelea ya kulemewa na usingizi; ‘kuzama katika usingizi mzito’ ni ya asili na huhifadhi taswira hiyo.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: Paulo alipokuwa akiendelea kusema kwa muda mrefu
  rationale: Genitivi huru inaonyesha kitendo kinachoendelea wakati mmoja; hapa διαλέγομαι ina maana ya kusema au kutoa hotuba, na ἐπὶ πλεῖον huonyesha muda ulioendelea.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: Hatimaye usingizi ukamshinda
  rationale: Kauli hii inaendeleza kitenzi cha awali hadi wakati wa kuingiwa kabisa na usingizi. ‘Usingizi ukamshinda’ ni Kiswahili cha asili chenye nguvu ya kisababishi.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: akaanguka chini kutoka ghorofa ya tatu
  rationale: τρίστεγον hutaja kiwango cha ghorofa ya tatu, na κάτω huonyesha mwendo wa kuelekea chini; tafsiri hii huhifadhi vipengele vyote viwili.
- source_word: ἤρθη νεκρός
  choice: akainuliwa akiwa amekufa
  rationale: αἴρω katika kauli tendwa inaweza kumaanisha kuinuliwa au kuchukuliwa. ‘Akainuliwa’ hufuata kwa karibu tukio baada ya kuanguka, huku ‘akiwa amekufa’ ikihifadhi tamko la moja kwa moja la νεκρός.
theological_decisions:
- issue: Ikiwa νεκρός ipunguzwe nguvu kuwa ‘alionekana kana kwamba amekufa’
  choice: akiwa amekufa
  alternative: akionekana kuwa amekufa
  rationale: Kigiriki kinasema νεκρός moja kwa moja bila ishara ya kutokuwa na uhakika. Tafsiri haipaswi kupunguza nguvu ya simulizi au kutatua mapema mvutano unaofuata.
- issue: Upeo wa maana ya ἤρθη
  choice: akainuliwa
  alternative: akachukuliwa
  rationale: Maana zote mbili zinawezekana. Matini kuu inatumia ‘akainuliwa’ kama tendo la mara moja baada ya kuanguka, na tanbihi inahifadhi uwezekano wa ‘akachukuliwa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Sentensi ndefu ya Kigiriki imegawanywa ili iwe rahisi kueleweka bila kupoteza mfuatano wa vitendo. Kiashiria cha tanbihi [a] kimewekwa mara baada ya kauli inayohusika.
