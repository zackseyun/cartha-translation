  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: sw
  text: Kwa hiyo, endeleeni kuwa macho, mkikumbuka kwamba kwa miaka mitatu, usiku na mchana, sikuacha kumwonya[a] kila mmoja kwa machozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumnasihi.” Kitenzi cha Kigiriki kinaweza kumaanisha onyo au maelekezo ya kurekebisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na onyo lililotangulia kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: γρηγορεῖτε
  choice: endeleeni kuwa macho
  rationale: Kauli ya amri ya wakati uliopo inadai kukesha kwa kuendelea; usemi huu unaeleza uangalifu wa kudumu bila kudokeza kutolala kihalisi.
- source_word: μνημονεύοντες
  choice: mkikumbuka
  rationale: Inahifadhi umbo la kishiriki na kuonyesha kwamba kukumbuka huduma ya Paulo kunaambatana na kuwa macho, na huenda ndiko kunakowasaidia kufanya hivyo.
- source_word: ὅτι
  choice: kwamba
  rationale: Inatanguliza maudhui wanayopaswa kukumbuka.
- source_word: τριετίαν
  choice: kwa miaka mitatu
  rationale: Inawasilisha hali ya muda unaoendelea kwa Kiswahili cha kawaida.
- source_word: νύκτα καὶ ἡμέραν
  choice: usiku na mchana
  rationale: Inahifadhi mpangilio wa Kigiriki na maana ya juhudi endelevu.
- source_word: οὐκ ἐπαυσάμην
  choice: sikuacha
  rationale: Ni usemi wa asili unaoonyesha kwamba Paulo hakukoma wala kulegeza shughuli hiyo.
- source_word: μετὰ δακρύων
  choice: kwa machozi
  rationale: Inahifadhi uzito wa kihisia na kuonyesha kwamba machozi yaliandamana na huduma yake.
- source_word: νουθετῶν
  choice: kumwonya
  rationale: Katika Kiswahili cha kawaida, 'kuonya' huwasilisha wazi kipengele cha maonyo ya kurekebisha; tanbihi inaonyesha kwamba kitenzi pia kinaweza kujumuisha maelekezo yenye kusahihisha.
- source_word: ἕνα ἕκαστον
  choice: kila mmoja
  rationale: Inahifadhi mkazo wa Kigiriki juu ya huduma iliyomfikia mtu mmoja mmoja bila kuongeza 'wenu,' ambalo halimo wazi katika kirai chenyewe.
theological_decisions:
- issue: Nguvu ya kichungaji ya νουθετῶν
  choice: kumwonya
  alternative: kumfundisha na kumsahihisha
  rationale: Kitenzi kinaunganisha kuweka jambo akilini, kusahihisha, na kuonya. 'Kumwonya' ni cha asili na chenye nguvu katika Kiswahili, huku tanbihi ikihifadhi upana wa maana badala ya kukifanya kiwe tishio tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Endeleeni kuwa macho' huepuka tafsiri ya kihalisi ya kutolala, na sentensi inadumisha sauti ya Paulo ya uangalifu wa kichungaji na huzuni ya moyoni.
