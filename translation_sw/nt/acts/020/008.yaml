  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: sw
  text: Kulikuwa na taa nyingi katika chumba cha juu tulimokuwa tumekusanyika[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mienge.” Neno la Kigiriki linaweza kutaja vifaa vya kubebeka vya kutoa mwanga kwa maana pana zaidi, lakini katika mazingira haya ya ndani ya chumba, “taa” inaelekea zaidi kuwa maana iliyokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: haijatafsiriwa kwa neno maalumu
  rationale: Ni kiunganishi hafifu cha kuendeleza simulizi; mtiririko wa Kiswahili hapa hauhitaji ‘basi’ au ‘lakini,’ ambazo zingeongeza maana isiyo dhahiri katika chanzo.
- source_word: λαμπάδες
  choice: taa
  rationale: Neno linaweza kumaanisha taa au mienge. Katika chumba cha ndani, ‘taa’ ndilo chaguo linalowezekana zaidi na ni la kawaida katika Kiswahili.
- source_word: ἱκαναὶ
  choice: nyingi
  rationale: Hapa neno linaeleza idadi kubwa ya taa, si utoshelevu wake; ‘nyingi’ huwasilisha maana hiyo kwa uwazi.
- source_word: ὑπερῴῳ
  choice: chumba cha juu
  rationale: Humaanisha chumba kilicho sehemu ya juu ya nyumba. ‘Chumba cha juu’ ni wazi, cha heshima, na hakilazimishi dhana ya aina maalumu ya jengo.
- source_word: οὗ
  choice: tulimokuwa
  rationale: 'Muundo huu wa Kiswahili unaonyesha mahali kwa kawaida na kwa ufupi: ‘chumba ... tulimokuwa.’'
- source_word: συνηγμένοι
  choice: tumekusanyika
  rationale: Huhifadhi hali ya kundi lililokuwa limekwisha kuja pamoja na likiwa bado pamoja wakati wa tukio.
- source_word: ἦσαν ... ἦμεν
  choice: kulikuwa ... tulimokuwa
  rationale: Maumbo ya wakati uliopita yanafaa kwa maelezo ya mandhari ya simulizi na yanatunza kauli ya nafsi ya kwanza wingi.
