  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: sw
  text: Katika mambo yote niliwaonyesha kwamba, kwa kufanya kazi kwa bidii kwa namna hii, ni lazima kuwasaidia walio dhaifu[a] na kuyakumbuka maneno ya Bwana Yesu, kwamba yeye mwenyewe alisema, ‘Heri zaidi ni kutoa kuliko kupokea.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwaunga mkono walio dhaifu.” Kitenzi cha Kigiriki kinaweza kumaanisha msaada wa kudumu, si msaada wa muda mfupi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Katika mambo yote
  rationale: Imetumiwa kielezi kueleza upana wa mfano ambao Paulo aliwaonyesha.
- source_word: ὑπέδειξα
  choice: niliwaonyesha
  rationale: Huhifadhi maana ya kuonyesha au kudhihirisha kwa mfano wa matendo.
- source_word: οὕτως κοπιῶντας
  choice: kwa kufanya kazi kwa bidii kwa namna hii
  rationale: Huonyesha kazi yenye juhudi kubwa na kurejelea namna Paulo mwenyewe alivyofanya kazi.
- source_word: δεῖ
  choice: ni lazima
  rationale: Huhifadhi nguvu ya wajibu au ulazima bila kuongeza mtendaji ambaye hajatajwa wazi katika Kigiriki.
- source_word: ἀντιλαμβάνεσθαι
  choice: kuwasaidia
  rationale: Ni Kiswahili cha kawaida kinachoeleza kuwapa msaada; uwezekano wa msaada endelevu umehifadhiwa katika tanbihi.
- source_word: τῶν ἀσθενούντων
  choice: walio dhaifu
  rationale: Huhifadhi upana wa neno la Kigiriki bila kulibana kuwa ugonjwa, umaskini, au udhaifu wa kiroho pekee.
- source_word: μνημονεύειν τε
  choice: na kuyakumbuka
  rationale: Huunganisha wajibu huu na ule wa kusaidia, kama inavyofanya τε katika Kigiriki.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: maneno ya Bwana Yesu
  rationale: Ni tafsiri ya moja kwa moja na yenye heshima ya kauli zilizokumbukwa za Yesu.
- source_word: αὐτὸς εἶπεν
  choice: yeye mwenyewe alivyosema
  rationale: Huhifadhi msisitizo wa αὐτός kwamba kauli hii ilitoka kwa Yesu mwenyewe.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Kutoa kuna baraka zaidi kuliko kupokea
  rationale: Hutoa Kiswahili cha kawaida na wazi huku kikihifadhi ulinganisho na maana ya μακάριον ya hali yenye baraka.
theological_decisions:
- issue: Wigo wa ‘walio dhaifu’
  choice: walio dhaifu
  alternative: maskini; wagonjwa; walio dhaifu kiroho
  rationale: ἀσθενούντων lina wigo mpana, na muktadha hauamui kwa hakika aina moja tu ya udhaifu.
- issue: Maana ya ‘kuna baraka zaidi’
  choice: Kutoa kuna baraka zaidi kuliko kupokea
  alternative: Ni heri kutoa kuliko kupokea
  rationale: Chaguo hili linaweka wazi ulinganisho wa μᾶλλον bila kueleza chanzo au aina ya baraka zaidi ya inavyosema matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umebaki karibu na hoja ya Kigiriki bila kuwa mgumu isivyo lazima.
