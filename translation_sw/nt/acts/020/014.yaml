  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: sw
  text: Alipokutana nasi huko Aso[a], tulimpandisha melini, kisha tukafika Mitilene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipojiunga nasi huko Aso,” au “alipokutana pamoja nasi huko Aso.” Kitenzi cha Kigiriki kinaweza kumaanisha kukutana au kuja pamoja; hapa maana yake ni kwamba Paulo alijiunga tena na kundi huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: alipokutana
  rationale: Katika muktadha huu wa safari, kitenzi kinaeleza Paulo kukutana na kujiunga tena na kundi; “alipokutana nasi” ni Kiswahili cha kawaida bila kuongeza wazo la kwamba walikuwa wamepanga kukutana.
- source_word: ἡμῖν
  choice: nasi
  rationale: Kiwakilishi cha wingi kinarejelea kundi lililokuwa likisafiri kwa meli.
- source_word: εἰς τὴν Ἆσσον
  choice: huko Aso
  rationale: Ingawa εἰς kwa kawaida huonyesha mwelekeo, pamoja na kitenzi cha kukutana hapa inaonyesha mahali walipokutana; “huko Aso” ni ya kawaida katika Kiswahili.
- source_word: ἀναλαβόντες
  choice: tulimpandisha melini
  rationale: Katika simulizi la safari ya majini, kirai hiki kina maana ya kumpokea Paulo ndani ya meli; tafsiri hii inaweka wazi mazingira yanayodokezwa na muktadha.
- source_word: αὐτόν
  choice: -m-
  rationale: Kiambishi cha yambwa katika “tulimpandisha” kinamrejelea Paulo, kama inavyoeleweka kutokana na muktadha uliotangulia.
- source_word: ἤλθομεν
  choice: tukafika
  rationale: Katika simulizi ya safari, “tukafika” hueleza kwa kawaida kuwasili kwao kwenye mahali palipotajwa bila kuongeza mkazo usiokuwapo.
- source_word: εἰς Μιτυλήνην
  choice: Mitilene
  rationale: Jina la mahali linafuata moja kwa moja kitenzi “tukafika,” ambacho tayari huonyesha mwelekeo na kuwasili.
