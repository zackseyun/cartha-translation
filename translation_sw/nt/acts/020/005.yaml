  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: sw
  text: Watu hao walikuwa wametangulia na walikuwa wakitungojea huko Troa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Watu hao, wakiwa wametangulia, walikuwa wakitungojea huko Troa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Watu hao
  rationale: Kiwakilishi cha kuonyesha cha wingi wa kiume kinawarejelea wale waliotajwa katika mstari uliotangulia; ‘watu hao’ huweka rejeo wazi kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: —
  rationale: Ni kiunganishi chepesi cha simulizi; hakihitaji kutafsiriwa kwa neno maalumu hapa, kwa kuwa mtiririko wa Kiswahili ni wa asili bila kiunganishi.
- source_word: προσελθόντες
  choice: walikuwa wametangulia
  rationale: Katika muktadha huu wa safari, kitenzi shiriki kinaonyesha kwamba watu hao walikwenda mbele ya kundi la msimulizi. Kauli hii ni ya asili na huhifadhi utangulizi wa tendo hilo kwa tendo la kusubiri.
- source_word: ἔμενον
  choice: walikuwa wakitungojea
  rationale: Ingawa μένω kimsingi humaanisha kukaa au kubaki, ikiwa na yambwa ya watu katika muktadha huu ina maana ya kungojea kuwasili kwao. Muundo ‘walikuwa waki-’ unaonyesha tendo lililoendelea la wakati uliopita.
- source_word: ἡμᾶς
  choice: -tu-
  rationale: Kiwakilishi cha nafsi ya kwanza wingi chenye dhima ya yambwa kimewakilishwa kiasili katika kiambishi cha yambwa cha kitenzi ‘wakitungojea’.
- source_word: ἐν Τρῳάδι
  choice: huko Troa
  rationale: Kirai cha mahali kinataja Troa kama mahali walipokuwa wakingojea; ‘huko’ ni matumizi ya kawaida ya Kiswahili kwa mahali palipotajwa katika simulizi.
