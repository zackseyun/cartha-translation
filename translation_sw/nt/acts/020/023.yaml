  text: πλὴν ὅτι τὸ πνεῦμα τὸ ἅγιον κατὰ πόλιν διαμαρτύρεταί ⸀μοι λέγον ὅτι δεσμὰ ⸂καὶ θλίψεις με⸃ μένουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: sw
  text: isipokuwa kwamba Roho Mtakatifu hunishuhudia katika mji baada ya mji[a], akisema kwamba minyororo[b] na mateso vinaningoja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kila mji” au “kutoka mji mmoja hadi mwingine.” Nahau ya Kigiriki inaonyesha ushuhuda unaorudiwa katika miji mbalimbali.
    reason: lexical_alternative
  - marker: b
    text: Au “vifungo.” “Minyororo” huhifadhi taswira halisi ya neno la Kigiriki, ambalo pia linaweza kumaanisha hali ya kufungwa.
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya hati zina tofauti ndogo kuhusu mahali au kuwapo kwa neno “mimi” pamoja na “mateso”; maana kuu inabaki kuwa minyororo na mateso vinamngojea Paulo.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: isipokuwa kwamba
  rationale: Inaonyesha jambo pekee linalowekewa tofauti na kauli ya mstari uliotangulia, huku ikihifadhi nguvu ya kukanusha/kutenga.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo neno la kawaida, la kisasa na lenye heshima katika Kiswahili kwa rejeo hili la Roho wa Mungu.
- source_word: κατὰ πόλιν
  choice: katika kila mji
  rationale: Muundo wa Kigiriki ni wa mgawanyo na unaonyesha ushuhuda unaorudiwa katika miji mbalimbali; Kiswahili hiki ni cha kawaida bila kudai kwa lazima kila mji bila ubaguzi.
- source_word: διαμαρτύρεταί μοι
  choice: hunishuhudia
  rationale: Huhifadhi wazo la kutoa ushahidi mzito kwa Paulo; 'hunionya' lingeongeza tafsiri ya tahadhari ambayo kitenzi chenyewe hailazimishi.
- source_word: λέγον
  choice: akisema
  rationale: Huanzisha moja kwa moja maudhui ya ushuhuda wa Roho.
- source_word: δεσμὰ
  choice: minyororo
  rationale: Huhifadhi taswira halisi ya kufungwa badala ya kuibadili mapema kuwa dhana pana ya kifungo.
- source_word: θλίψεις
  choice: mateso
  rationale: Ni neno la kawaida na zito linalowasilisha dhiki, shinikizo na taabu zinazomkabili Paulo.
- source_word: με
  choice: -ni- katika “vinaningoja”
  rationale: Kiambishi cha yambwa humtaja Paulo wazi kuwa ndiye anayengojewa na minyororo na mateso.
- source_word: μένουσιν
  choice: vinaningoja
  rationale: Katika muktadha huu huonyesha mambo yaliyoko mbele na yaliyo tayari kumpata Paulo.
theological_decisions:
- issue: Rejeo la “Roho Mtakatifu”
  choice: Mtendaji wa kimungu mwenye kutenda, anayemshuhudia Paulo
  alternative: Nguvu ya kiroho isiyo na utendaji binafsi
  rationale: Kifungu kinamwasilisha Roho Mtakatifu akishuhudia na kusema; tafsiri inadumisha utendaji huo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hunishuhudia” hudumisha uzito wa ushuhuda bila kuufasiri tu kuwa onyo. Alama zote za tanbihi zimewekwa katika matini kuu.
