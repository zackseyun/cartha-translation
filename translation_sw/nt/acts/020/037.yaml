lexical_decisions:
- source_word: ἱκανὸς κλαυθμὸς ἐγένετο πάντων
  choice: Wote wakalia sana
  rationale: Muundo huu unaonyesha kwamba kila aliyekuwapo alilia sana; Kiswahili hiki ni cha kawaida na kinahifadhi uzito wa maombolezo.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: wakamkumbatia Paulo shingoni
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida tendo la kumwangukia mtu shingoni kwa kumkumbatia, huku ikihifadhi taswira ya shingo iliyo wazi katika chanzo.
- source_word: κατεφίλουν αὐτόν
  choice: na kuendelea kumbusu
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea au kurudiwa; 'kuendelea kumbusu' linafikisha hali hiyo bila kuongeza maana nyingine.
