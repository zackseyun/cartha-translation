  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: sw
  text: Baada ya kukaa huko kwa miezi mitatu, Paulo alipokuwa karibu kuondoka kwa meli kwenda Siria[c], njama ilipopangwa dhidi yake na Wayahudi[a][b], aliamua kurudi kwa njia ya Makedonia.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Wayahudi.” Katika Matendo, mara nyingi usemi huu humaanisha kundi fulani la Wayahudi waliokuwa wakimpinga Paulo katika muktadha husika, wala si Wayahudi wote bila ubaguzi.'
    reason: cultural_note
  - marker: b
    text: Au “njama ilipozuka dhidi yake.”
    reason: lexical_alternative
  - marker: c
    text: Au “alipokuwa karibu kuanza safari ya baharini kwenda Siria.”
    reason: lexical_alternative
  - marker: d
    text: Au “aliazimia kurudi kwa njia ya Makedonia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Baada ya kukaa huko kwa miezi mitatu
  rationale: Kitenzi pamoja na kipindi cha wakati kina maana ya kutumia au kukaa muda huo. Neno “huko” limetolewa katika muktadha wa mstari uliotangulia na linafanya Kiswahili kiwe cha kawaida.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: njama ilipopangwa dhidi yake
  rationale: Muundo huu unaonyesha hali ya wakati na mazingira; ἐπιβουλή ni mpango wa siri wenye nia ya kumdhuru mtu. Tafsiri hii inadumisha wazo la njama kuelekezwa dhidi ya Paulo.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: na Wayahudi
  rationale: Kigiriki kinawataja wazi Wayahudi kama waliopanga njama. Ufafanuzi wa kimuktadha kwamba si Wayahudi wote unatolewa katika tanbihi badala ya kubadili maneno ya andiko.
- source_word: μέλλοντι ἀνάγεσθαι
  choice: alipokuwa karibu kuondoka kwa meli
  rationale: μέλλω huonyesha jambo lililokuwa karibu kutokea, na ἀνάγεσθαι katika simulizi la safari humaanisha kuondoka au kuanza safari kwa njia ya bahari.
- source_word: εἰς τὴν Συρίαν
  choice: kuelekea Siria
  rationale: εἰς huonyesha mahali safari ilikoelekezwa; “kuelekea Siria” ni usemi wa kawaida wa Kiswahili katika muktadha wa safari.
- source_word: ἐγένετο γνώμης
  choice: aliamua
  rationale: Nahau hii inaonyesha kufikia uamuzi au azimio. “Aliamua” ni wazi na ya kawaida bila kupoteza maana.
- source_word: τοῦ ὑποστρέφειν
  choice: kurudi
  rationale: Kitenzi-jina hiki kinaeleza yaliyomo katika uamuzi, yaani kurudi.
- source_word: διὰ Μακεδονίας
  choice: kupitia Makedonia
  rationale: διά pamoja na hali ya umilikishi huonyesha njia iliyofuatwa; “kupitia Makedonia” inawasilisha maana hiyo moja kwa moja.
theological_decisions:
- issue: Maana ya “Wayahudi” katika simulizi la upinzani
  choice: Kudumisha “Wayahudi” katika andiko kuu na kufafanua muktadha katika tanbihi.
  alternative: “baadhi ya Wayahudi” au “wapinzani wa Kiyahudi”
  rationale: Andiko la Kigiriki linasema τῶν Ἰουδαίων bila kuongeza “baadhi” au “wapinzani.” Hata hivyo, katika muktadha wa Matendo jina hili mara nyingi huelekeza kwa kundi maalumu linalompinga Paulo, si kwa Wayahudi wote bila ubaguzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Majina “Siria” na “Makedonia” yametumiwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia. Muundo wa sentensi unahifadhi mfuatano wa matukio na hali ya kimazingira ya Kigiriki huku ukibaki wa kawaida kwa msomaji wa leo.
