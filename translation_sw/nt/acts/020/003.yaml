    issue: Potentially ambiguous attachment of “alipokuwa karibu kuondoka kwa meli.”
    rationale: In the draft, this clause follows “na Wayahudi,” and although the intended referent is Paul, the syntax can briefly obscure this. Greek μέλλοντι is masculine singular and refers to Paul. Reordering and naming Paulo resolves this without adding interpretive content.
  - severity: low
    issue: Footnote b anchor is placed after “Wayahudi” rather than its referent “njama.”
    rationale: The alternative concerns γενομένης ἐπιβουλῆς (“a plot arose”), so its anchor should immediately follow “njama” for clear footnote association.
