  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: sw
  text: jinsi ambavyo sikujizuia kuwatangazia chochote chenye manufaa na kuwafundisha hadharani na nyumba kwa nyumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikuzuia kutangaza kwenu chochote chenye manufaa.”
    reason: mbadala wa kimsamiati
lexical_decisions:
- source_word: ὡς
  choice: jinsi ambavyo
  rationale: Katika muktadha huu neno hilo linaanzisha maelezo ya namna Paulo alivyohudumu na linaunganika kiasili na ukumbusho wa mistari iliyotangulia.
- source_word: ὑπεστειλάμην
  choice: sikujizuia
  rationale: Kitenzi cha kati kinaweza kumaanisha kujirudisha nyuma au kujizuia kufanya jambo. 'Sikujizuia' ni Kiswahili cha kawaida na kinadumisha wazo la kutokuzuia huduma.
- source_word: τῶν συμφερόντων
  choice: jambo lolote lenye manufaa
  rationale: Kirai hiki humaanisha mambo yenye faida au manufaa. Tafsiri hii haidokezi faida ya fedha, wala haifungii maana katika manufaa ya kiroho pekee.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: kuwatangazia
  rationale: Muundo wa kisarufi unaeleza tendo ambalo Paulo hakujizuia kulifanya. Kiswahili kinaweza kulieleza kwa urahisi kwa kuunganisha kitenzi hiki moja kwa moja na 'sikujizuia.'
- source_word: ἀναγγεῖλαι
  choice: kuwatangazia
  rationale: Neno hilo humaanisha kutangaza, kuarifu, au kufanya jambo lijulikane. 'Kuwatangazia' linafaa katika muktadha wa huduma na linatofautishwa na tendo linalofuata la kufundisha.
- source_word: διδάξαι
  choice: kuwafundisha
  rationale: Hii ndiyo maana ya moja kwa moja ya διδάσκω. Imeunganishwa na 'kuwatangazia' chini ya kitenzi kimoja kinachotawala matendo yote mawili.
- source_word: δημοσίᾳ
  choice: hadharani
  rationale: Neno hili linaonyesha mazingira yaliyo wazi kwa watu wote; 'hadharani' ni tafsiri ya kawaida, fupi, na yenye heshima.
- source_word: κατ’ οἴκους
  choice: nyumba kwa nyumba
  rationale: κατά pamoja na wingi hapa lina nguvu ya mgawanyo. 'Nyumba kwa nyumba' linahifadhi wazo la huduma iliyofanywa katika nyumba mbalimbali bila kuamua ikiwa ilihusisha kila nyumba bila ubaguzi.
theological_decisions:
- issue: Maana ya τῶν συμφερόντων
  choice: jambo lolote lenye manufaa
  alternative: jambo lolote lenye manufaa ya kiroho
  rationale: Muktadha wa huduma ya Paulo unaelekeza hasa kwenye manufaa ya kichungaji na ya kiroho, lakini neno la Kigiriki lenyewe ni pana. Tafsiri kuu inadumisha upana huo bila kuingiza ufafanuzi wa kiteolojia usiotajwa wazi.
- issue: Uhusiano wa kutangaza na kufundisha
  choice: sikujizuia kuwatangazia ... na kuwafundisha
  alternative: sikujizuia kuwatangazia ... wala sikujizuia kuwafundisha
  rationale: Kigiriki kina kitenzi kimoja kilichokanushwa kinachotawala vitenzi-jina vyote viwili. Muundo uliochaguliwa unadumisha uhusiano huo na kuepuka kuunda madai mawili tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Sikujizuia' ni cha kawaida zaidi kuliko tafsiri halisi kupita kiasi, huku tanbihi ikihifadhi taswira mbadala ya 'kurudi nyuma.' Muundo 'hadharani na nyumba kwa nyumba' ni mfupi na unaakisi ulinganifu wa Kigiriki.
