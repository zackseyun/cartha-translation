  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: sw
  text: Lakini Paulo akashuka, akajitupa juu yake[a], akamkumbatia, akasema, “Msifadhaike[b], kwa maana uhai wake umo ndani yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajilaza juu yake.” Usemi wa Kigiriki unaeleza Paulo akijitupa au kujilaza juu ya kijana huyo; unaweza kukumbusha matendo ya Eliya na Elisha, ingawa matini haisemi wazi kwamba Paulo alikuwa akiwaiga.
    reason: lexical_and_intertextual_clarification
  - marker: b
    text: Maneno ya Paulo yanaweza kueleweka kuwa kijana huyo hakuwa amekufa, au kwamba uhai wake ulikuwa umerudishwa. Maneno ya Kigiriki yenyewe hayaamui wazi kati ya maana hizo.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: akashuka
  rationale: Kitenzi hiki kinaonyesha Paulo alishuka kutoka sehemu ya juu; “akashuka” ni ya kawaida na huhifadhi mwelekeo wa tendo.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko lenye tofauti ndogo kati ya taarifa ya kuanguka kwa kijana na hatua aliyochukua Paulo.
- source_word: ἐπέπεσεν αὐτῷ
  choice: akajiangusha juu yake
  rationale: Usemi huu huhifadhi tendo la Paulo la kuuelekeza mwili wake juu ya kijana, pamoja na mwangwi unaowezekana wa matendo ya kinabii ya kurejesha uhai.
- source_word: συμπεριλαβὼν
  choice: akamkumbatia
  rationale: Neno hili lina maana ya kumzungushia mikono au kumkumbatia; tafsiri hii ni fupi, ya asili, na huhifadhi tendo la kimwili.
- source_word: Μὴ θορυβεῖσθε
  choice: Msifadhaike
  rationale: θορυβέω inaweza kueleza mfadhaiko, vurugu, au taharuki. “Msifadhaike” hufaa kwa hali ya kushtuka baada ya kuanguka kwa Eutiko bila kubana maana kuwa kelele pekee.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: kwa maana uhai wake
  rationale: Katika muktadha huu ψυχή inahusu hali ya kuwa hai. “Uhai” huepuka kuingiza maana maalumu ya kiteolojia ya “roho” ambayo si lazima hapa.
- source_word: ἐν αὐτῷ ἐστιν
  choice: umo ndani yake
  rationale: Tafsiri hii hufuata muundo wa Kigiriki na haiongezi kwamba uhai uliendelea kuwapo au ulirudishwa.
theological_decisions:
- issue: Maana ya ψυχή katika muktadha wa uhai na kifo
  choice: Imetafsiriwa “uhai,”
  alternative: “roho”
  rationale: Muktadha unahusu hali ya kimwili ya Eutiko baada ya kuanguka. “Uhai” huakisi matumizi ya kawaida ya ψυχή hapa bila kufanya kauli ya ziada kuhusu asili au utengano wa roho.
- issue: Kama maneno ya Paulo yanamaanisha Eutiko hakuwa amekufa au alikuwa amerudishwa kwenye uhai
  choice: 'Matini kuu imebaki na usemi usioamua jambo hilo: “uhai wake umo ndani yake.”'
  alternative: “yuko hai” au “uhai wake umemrudia”
  rationale: Kigiriki kinasema uhai wake umo ndani yake, lakini hakielezi wazi kama hakuwa amekufa au kama uhai wake ulirejeshwa. Tafsiri haipaswi kuondoa utata huo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa masimulizi ya kawaida; “akajiangusha juu yake” huhifadhi tendo halisi na mwangwi wa kimaandiko, huku “uhai wake umo ndani yake” ikihifadhi utata wa chanzo.
