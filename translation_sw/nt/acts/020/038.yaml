  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: sw
  text: wakihuzunika hasa kwa sababu ya neno alilokuwa amesema[a], kwamba hawatauona tena uso wake[b]. Kisha wakamsindikiza mpaka melini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “kwa sababu ya yale aliyokuwa amesema.” Kigiriki kinasema kwa ukaribu zaidi, “kwa sababu ya neno alilokuwa amesema.”'
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hawatauona tena uso wake,” usemi wa kibinafsi unaomaanisha kwamba hawangemwona tena.
    reason: lexical_alternative
  - marker: c
    text: Au “wakaandamana naye mpaka melini” au “wakamsindikiza alipokuwa akiondoka.” Kitenzi kinaweza kudokeza kuandamana na mtu wakati wa kumuaga kwa heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: wakihuzunika
  rationale: Kitenzi hiki kinaonyesha maumivu ya kihisia au huzuni; “wakihuzunika” ni Kiswahili cha kawaida na chenye hadhi kinachofaa muktadha wa kuagana.
- source_word: μάλιστα
  choice: hasa
  rationale: Neno hili linabainisha jambo kuu lililowahuzunisha; “hasa” ni la kawaida na fupi.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: kwa sababu ya neno alilokuwa amesema
  rationale: “Kwa sababu ya” huwasilisha uhusiano wa kisababishi kwa Kiswahili cha asili, huku “neno” likihifadhi λόγος na kishazi kinachofuata kikilifafanua.
- source_word: οὐκέτι μέλλουσιν
  choice: hawatauona tena
  rationale: Muundo huu wa wakati ujao unaotazamwa kutoka wakati uliopita unawasilishwa kwa Kiswahili laini; “tena” huhifadhi maana ya οὐκέτι bila kuifanya kuwa kauli kali zaidi ya “kamwe.”
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: kuuona uso wake
  rationale: Huhifadhi taswira ya moja kwa moja ya Kigiriki, “kuuona uso wake,” badala ya kuirahisisha kuwa “kumwona.”
- source_word: προέπεμπον
  choice: wakamsindikiza
  rationale: “Kumsindikiza” linaweza kumaanisha kuandamana na mtu wakati wa kumuaga kwa heshima, na linafaa katika muktadha huu.
- source_word: εἰς τὸ πλοῖον
  choice: mpaka melini
  rationale: Katika muktadha wa safari ya baharini, “meli” linafaa kwa πλοῖον; “mpaka melini” ni usemi wa asili unaoonyesha walimsindikiza hadi mahali meli ilipokuwa.
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia ulinganifu bora: inahifadhi “neno” na “uso wake” kutoka Kigiriki, lakini inatoa miundo ya wakati na uandamanaji kwa Kiswahili cha asili. Alama zote za tanbihi [a]–[c] zimewekwa katika matini kuu.'
