id: ACT.20.16
reference: Acts 20:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: sw
  text: Kwa maana Paulo alikuwa ameamua kupita Efeso kwa meli[a], ili asije akakawia katika Asia. Alikuwa akiharakisha ili, ikiwezekana[b], awe Yerusalemu siku ya Pentekoste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” hapa ni jimbo la Kiroma la Asia, lililokuwa magharibi mwa Asia Ndogo, wala si bara la Asia la leo.
    reason: cultural_note
  - marker: b
    text: Au, “afike Yerusalemu siku ya Pentekoste.” Usemi wa Kigiriki unaweza kusisitiza ama kuwapo huko kufikia siku hiyo ama kufika huko siku hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: alikuwa ameamua
  rationale: Wakati uliopita timilifu unaonyesha kwamba Paulo alikuwa tayari amefanya uamuzi huo kabla ya safari inayosimuliwa.
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: kupita Efeso kwa meli
  rationale: Huhifadhi maana ya kupita karibu na mahali kwa njia ya bahari, kwa Kiswahili cha kawaida na wazi.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: ili asije akatumia muda
  rationale: Hutoa kwa njia ya asili kusudi la kuepuka kutumia muda au kuchelewa huko bila kufanya sentensi kuwa nzito.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: katika Asia
  rationale: Jina la kihistoria limehifadhiwa katika matini, huku tanbihi ikifafanua kuwa ni jimbo la Kiroma.
- source_word: ἔσπευδεν
  choice: alikuwa akifanya haraka
  rationale: Muundo huu unaonyesha hatua ya haraka iliyokuwa ikiendelea katika muktadha wa safari.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: ikiwezekana
  rationale: Ni usemi mfupi na wa asili unaohifadhi hali ya kutokuwa na uhakika.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: awe Yerusalemu
  rationale: Hueleza lengo la kuwapo Yerusalemu, huku uwezekano wa maana ya kufika ukihifadhiwa katika tanbihi.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: siku ya Pentekoste
  rationale: Ni jina linalotambulika la sikukuu na linafuata usemi wa wakati wa Kigiriki bila kuongeza maana isiyolazimika.
theological_decisions:
- issue: Ikiwa γενέσθαι εἰς Ἱεροσόλυμα inasisitiza kuwapo au kufika Yerusalemu
  choice: awe Yerusalemu
  alternative: afike Yerusalemu
  rationale: Matini kuu inatumia maana ya matokeo, yaani kuwapo huko siku hiyo, lakini tanbihi inadumisha uwezekano halisi kwamba usemi huo unasisitiza kufika siku hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umegawanywa ili kuepuka uzito bila kupoteza uhusiano wa sababu katika Kigiriki.
