base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: sw
  text: Baada ya ghasia kutulia, Paulo aliwaita wanafunzi. Baada ya kuwatia moyo na kuwaaga[a], akaondoka kwenda Makedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwasalimu”; neno la Kigiriki linaweza kumaanisha kuwasalimu au, katika muktadha wa kuondoka, kuwaaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: Baada ya ghasia kutulia
  rationale: Muundo wenye μετά na kitenzi-jina unaonyesha wakati unaofuata baada ya tukio la awali kumalizika. “Ghasia kutulia” ni Kiswahili cha kawaida kinachoonyesha kwisha kwa vurugu za hadharani katika muktadha huu.
- source_word: μεταπεμψάμενος
  choice: alituma wanafunzi waitwe
  rationale: Kitenzi hiki cha kati humaanisha kutuma watu wamwite mtu aje. Tafsiri hii inalinda wazo la Paulo kutuma ujumbe ili wanafunzi waje kwake, badala ya kudokeza kwamba aliwaita kwa sauti moja kwa moja.
- source_word: τοὺς μαθητὰς
  choice: wanafunzi
  rationale: Neno μαθηταί katika Matendo kwa kawaida humaanisha wafuasi wa Yesu. “Wanafunzi” huhifadhi istilahi ya Luka badala ya kuipanua kuwa “waumini.”
- source_word: παρακαλέσας
  choice: Baada ya kuwatia moyo
  rationale: παρακαλέω inaweza kumaanisha kuhimiza, kutia moyo, au kufariji. Katika mazingira ya baada ya ghasia na kabla ya kuondoka, “kuwatia moyo” hudumisha upana huo kwa lugha ya kawaida.
- source_word: ἀσπασάμενος
  choice: kuagana nao
  rationale: Ingawa kimsingi kitenzi hiki kinaweza kumaanisha kusalimu, katika muktadha wa kuondoka kinaweza kueleza kuaga. “Kuagana nao” ni ya asili katika Kiswahili, huku uwezekano wa “kuwasalimu” ukihifadhiwa katika tanbihi.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: akaondoka kwenda Makedonia
  rationale: Katika simulizi la safari, ἐξέρχομαι hapa hueleza kuondoka, na kitenzi-jina kinachofuata huonyesha kusudi au safari iliyokusudiwa kuelekea Makedonia.
