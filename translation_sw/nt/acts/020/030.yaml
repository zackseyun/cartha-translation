  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: sw
  text: Na kutoka miongoni mwenu ninyi wenyewe watatokea wanaume watakaosema mambo yaliyopotoka[a], ili kuwavuta wanafunzi wawaandame wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo mapotovu” au “mambo yaliyopotoshwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: kutoka miongoni mwenu ninyi wenyewe
  rationale: Muundo huu unasisitiza kwamba tishio litatokea ndani ya jumuiya yao wenyewe.
- source_word: ἀναστήσονται
  choice: watatokea
  rationale: Katika muktadha huu kitenzi kina maana ya kuibuka au kutokea, huku wakati ujao ukihifadhiwa.
- source_word: ἄνδρες
  choice: wanaume
  rationale: Neno la Kigiriki linarejelea wanaume mahususi, si watu kwa ujumla.
- source_word: λαλοῦντες
  choice: watakaosema
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo lao la kunena, kwa uhusiano wa moja kwa moja na wanaume watakaotokea.
- source_word: διεστραμμένα
  choice: mambo yaliyopotoka
  rationale: Huhifadhi picha ya mambo yaliyogeuzwa kutoka yaliyo sawa au ya kweli bila kubana maana kwenye upotovu wa kimaadili pekee.
- source_word: τοῦ ἀποσπᾶν
  choice: ili kuwavuta
  rationale: Muundo unaonyesha kusudi na kitenzi kinadumisha picha ya kuvuta watu mbali na wengine.
- source_word: τοὺς μαθητὰς
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida la kibiblia kwa wafuasi wanaojifunza kwa Yesu.
- source_word: ὀπίσω ἑαυτῶν
  choice: wawaandame wao
  rationale: Nahau hii inaonyesha kuwafanya wanafunzi wafuate watu hao na kuwa wafuasi wao; kiwakilishi 'wao' kinadumisha msisitizo wa ἑαυτῶν.
theological_decisions:
- issue: Asili ya maneno ya walimu wa uongo
  choice: mambo yaliyopotoka
  alternative: mambo mapotovu; mambo yaliyopotoshwa
  rationale: Kauli ya Kigiriki ni pana na inaweza kuhusu kupotoshwa kwa kweli au upotovu; tafsiri haibainishi uzushi fulani ambao mstari hautaji.
- issue: Jinsia ya ἄνδρες
  choice: wanaume
  alternative: watu
  rationale: Neno la Kigiriki ni la jinsia ya kiume mahususi, kwa hiyo halijafanywa kuwa la kijinsia lisilo maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Miongoni mwenu ninyi wenyewe' hudumisha msisitizo wa chanzo cha ndani, na 'wawaandame wao' huonyesha ufuasi binafsi bila kuongeza fundisho lisilokuwamo katika maandishi.
