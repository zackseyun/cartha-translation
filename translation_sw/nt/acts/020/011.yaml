  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: sw
  text: Kisha akapanda juu, akaumega mkate[a] na kula[b]. Baada ya kuzungumza kwa muda mrefu mpaka alfajiri, hivyo akaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akashiriki chakula.” Usemi wa Kigiriki unaweza kumaanisha kula pamoja, ingawa wengine huona hapa kuwa ni pamoja na Meza ya Bwana.
    reason: alternative_reading
  - marker: b
    text: Kwa neno halisi, “akaonja”; pia linaweza kumaanisha “akashiriki chakula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: akapanda juu
  rationale: Kitenzi hiki kinaonyesha kwenda juu; katika muktadha Paulo alikuwa amerudi kwenye chumba cha juu. Tafsiri hii ni ya kawaida na haiongezi waziwazi neno lisilokuwamo katika Kigiriki.
- source_word: κλάσας τὸν ἄρτον
  choice: akaumega mkate
  rationale: Huhifadhi tendo halisi la kuumega mkate bila kuamua kama hapa ni mlo wa kawaida, ushirika wa mezani, au Meza ya Bwana.
- source_word: γευσάμενος
  choice: na kula
  rationale: Ingawa neno linaweza kumaanisha ‘kuonja,’ katika muktadha wa chakula linaweza kumaanisha kula au kushiriki chakula. ‘Kula’ ni Kiswahili cha kawaida na hakidokezi kimakosa kwamba alionja kiasi kidogo tu.
- source_word: ἐφ’ ἱκανόν
  choice: kwa muda mrefu
  rationale: Nahau hii inaonyesha kipindi kirefu au cha kutosha; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ὁμιλήσας
  choice: baada ya kuzungumza
  rationale: Neno hili linaweza kueleza mazungumzo au hotuba ya muda mrefu. ‘Kuzungumza’ huhifadhi hali ya mawasiliano bila kuifanya lazima kuwa mahubiri rasmi.
- source_word: ἄχρι αὐγῆς
  choice: mpaka alfajiri
  rationale: αὐγή ni mapambazuko au alfajiri; ‘mpaka alfajiri’ ni usemi mfupi na wa kawaida.
- source_word: οὕτως ἐξῆλθεν
  choice: akaondoka
  rationale: Kigiriki kinahitimisha mfululizo wa matendo kwa kuondoka kwake. Kiswahili cha masimulizi chenye ‘aka-’ kinaunganisha hitimisho hili kwa kawaida na yaliyotangulia.
theological_decisions:
- issue: Ikiwa κλάσας τὸν ἄρτον ni rejeo la wazi kwa Meza ya Bwana
  choice: Imetafsiriwa kwa upande wowote kuwa ‘akaumega mkate.’
  alternative: Wengine huiona kama Meza ya Bwana; wengine kama mlo wa kawaida au ushirika wa mezani.
  rationale: Kirai hiki kinaweza kuwa na maana ya kiibada katika Matendo, lakini mstari huu wenyewe haulazimishi maana hiyo. Tafsiri inadumisha mvutano na utata wa matini badala ya kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi kwa viambishi vya ‘aka-’. Lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
