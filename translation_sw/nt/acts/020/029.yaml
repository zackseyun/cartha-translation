  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: sw
  text: Najua kwamba baada ya kuondoka kwangu[a], mbwa-mwitu wakali[b] wataingia miongoni mwenu bila kulihurumia kundi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi zaidi, “baada ya kuja kwangu” au “baada ya kufika kwangu”; katika muktadha maana ni baada ya Paulo kuondoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbwa-mwitu wakatili.” Kivumishi cha Kigiriki kinaweza kuonyesha ukali, ukatili, au nguvu ya kuonea.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Najua
  rationale: Kitenzi hiki kinaonyesha ujuzi wenye uhakika wa Paulo, si maoni tu; “Najua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: εἰσελεύσονται
  choice: wataingia
  rationale: Kitenzi cha wakati ujao kinaonyesha kuingia ndani ya jumuiya; “wataingia miongoni mwenu” kinaweka wazi mwendo huo bila kuongeza utambulisho wa wahusika.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: baada ya kuondoka kwangu
  rationale: Ingawa ἄφιξις kwa kawaida inaweza kumaanisha kuja au kufika, muktadha wa hotuba unaelekeza kwenye yatakayotokea Paulo atakapokuwa ameondoka; tanbihi inahifadhi maana ya karibu zaidi ya neno lenyewe.
- source_word: λύκοι βαρεῖς
  choice: mbwa-mwitu wakali
  rationale: βαρεῖς hapa inaonyesha ukali na hatari, si uzito wa kimwili. “Wakali” ni ya asili katika Kiswahili na inadumisha taswira ya wanyama hatari.
- source_word: εἰς ὑμᾶς
  choice: miongoni mwenu
  rationale: Katika taswira ya mbwa-mwitu wanaovamia kundi, kirai hiki kinaonyesha kuingia ndani ya jumuiya; “miongoni mwenu” ni wazi na cha kawaida.
- source_word: μὴ φειδόμενοι
  choice: bila kulihurumia
  rationale: Kirai hiki kinaonyesha kutolinda wala kuonyesha rehema kwa kundi; muundo wa “bila” unahifadhi uhusiano wa kielezi wa kitenzi kishirikishi cha Kigiriki.
- source_word: τοῦ ποιμνίου
  choice: kundi
  rationale: “Kundi” linadumisha sitiari ya kichungaji bila kuifasiri moja kwa moja kuwa kanisa.
theological_decisions:
- issue: Nguvu ya kisitiari ya “mbwa-mwitu”
  choice: Kudumisha sitiari “mbwa-mwitu wakali”
  alternative: walimu wa uongo; watu waharibifu; watesi
  rationale: Aya yenyewe haiwataji wazi mbwa-mwitu kuwa kundi fulani la watu. Kudumisha sitiari kunahifadhi nguvu ya onyo na kuepuka kuweka tafsiri finyu ndani ya matini.
- issue: Maana ya ἄφιξις katika muktadha
  choice: kuondoka kwangu
  alternative: kuja kwangu; kufika kwangu
  rationale: Muktadha unaeleza yatakayotokea Paulo atakapokuwa hayupo tena pamoja nao. Tafsiri kuu inatoa maana hiyo ya kimuktadha, huku tanbihi ikihifadhi maana ya kawaida zaidi ya neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida, inadumisha sitiari ya mbwa-mwitu na kundi, na haibainishi kimadhehebu watu wanaowakilishwa na mbwa-mwitu.
