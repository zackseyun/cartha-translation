  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: sw
  text: Baada ya kusema hayo, akapiga magoti pamoja nao wote, akaomba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Baada ya
  rationale: Kiunganishi Καὶ kinaunganishwa kwa kawaida na kishazi tegemezi ταῦτα εἰπών ili kuonyesha mfuatano wa matendo bila kulazimisha neno tofauti la 'na' mwanzoni.
- source_word: ταῦτα εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Kirai cha kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu; tafsiri hii ni ya asili katika Kiswahili na inadumisha mfuatano huo.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: akapiga magoti
  rationale: Kirai hiki, kihalisi 'akiweka magoti yake,' ni nahau ya kupiga magoti. 'Akapiga magoti' ni usemi wa kawaida na haiongezi wazo la kuanguka.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: pamoja nao wote
  rationale: σύν pamoja na hali ya dative huonyesha kuandamana; 'nao wote' inadumisha msisitizo kwamba kundi lote lilikuwa pamoja naye.
- source_word: προσηύξατο
  choice: akaomba
  rationale: Hiki ni kitenzi cha kawaida cha kusali au kuomba kwa Mungu. Katika muktadha huu, 'akaomba' ni wazi, cha asili, na chenye hadhi.
