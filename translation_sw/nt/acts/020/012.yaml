lexical_decisions:
- source_word: ἤγαγον
  choice: wakamchukua
  rationale: Kitenzi ἄγω kinaweza kumaanisha kuongoza, kuleta, au kumchukua mtu. Katika muktadha huu, “wakamchukua” ni cha kawaida na hakiongezi mahali ambako kijana alipelekwa.
- source_word: παῖδα
  choice: yule kijana
  rationale: παῖς inaweza kumaanisha mtoto, kijana, au mtumishi. Hapa inamrejelea Eutiko, aliyeitwa νεανίας (‘kijana’) katika mstari wa 9; kwa hiyo “kijana” linafaa bila kudokeza kuwa alikuwa mtumishi.
- source_word: ζῶντα
  choice: akiwa hai
  rationale: Kivumishi-shirikishi hiki kinaeleza hali ya kijana walipomchukua. “Akiwa hai” ni Kiswahili cha kawaida na kinaweka wazi tofauti na hali yake iliyoelezwa kabla.
- source_word: παρεκλήθησαν
  choice: wakafarijika
  rationale: Katika muktadha wa kuanguka kwa Eutiko na kupatikana kwake akiwa hai, maana inayofaa ya παρακαλέω ni kufarijiwa au kupata faraja.
- source_word: οὐ μετρίως
  choice: sana
  rationale: Huu ni usemi wa kupunguza kwa kusudi la kusisitiza, kwa maana halisi ‘si kwa kiasi.’ “Sana” hutoa maana yake wazi na kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama Kigiriki; “nao” huunganisha kitendo cha pili kwa mtiririko wa kawaida, na tanbihi huhifadhi namna halisi ya usemi οὐ μετρίως.
