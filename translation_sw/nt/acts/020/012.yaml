  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: sw
  text: Wakamchukua yule kijana akiwa hai, nao wakafarijika sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “si kwa kiasi”; yaani, walifarijika sana.
