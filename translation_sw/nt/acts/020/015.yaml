  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: sw
  text: Tukaondoka huko kwa meli; siku iliyofuata tukafika mkabala na Kio[a]. Siku iliyofuata tukasimama huko Samo[b], na siku baada ya hapo tukafika Mileto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukafika upande unaoelekeana na Kio,” au “karibu na Kio.” Kigiriki huonyesha mahali palipokuwa mkabala na kisiwa hicho, si lazima kwamba walifika kisiwani.
    reason: lexical_alternative
  - marker: b
    text: Au, “tukatia Samo kwa meli,” au “tukafika Samo kwa meli.” Kitenzi cha Kigiriki ni istilahi ya safari ya baharini inayoweza kumaanisha kuifikisha meli kando au kufanya kituo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν ἀποπλεύσαντες
  choice: Tukaondoka huko kwa meli
  rationale: Kauli hii inawakilisha kiunganishi καί, mahali pa kuondokea ἐκεῖθεν, na maana ya baharini ya ἀποπλεύω kwa Kiswahili cha kawaida.
- source_word: τῇ ἐπιούσῃ
  choice: siku iliyofuata
  rationale: Ni usemi wa wakati unaotaja siku inayofuata katika ratiba ya safari.
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: tukafika mkabala na Kio
  rationale: ἄντικρυς huonyesha mahali palipoelekeana na kisiwa, bila kudokeza kwa lazima kwamba walitia nanga au walishuka huko.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: Siku iliyofuata
  rationale: Usemi huu unaendeleza mfuatano wa siku katika simulizi kwa lugha ya asili.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: tukatia nanga huko Samo
  rationale: Katika muktadha wa safari ya baharini, παραβάλλω huweza kumaanisha kuifikisha meli kando au kuingia mahali kwa kituo; 'kutia nanga' ni usemi unaoeleweka, huku tanbihi ikihifadhi wigo wa maana.
- source_word: τῇ δὲ ἐχομένῃ
  choice: siku baada ya hapo
  rationale: Hutaja siku inayofuata katika mfululizo, na tafsiri hii inatofautisha hatua ya tatu ya ratiba.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: tukafika Mileto
  rationale: Kitenzi cha kawaida cha safari pamoja na εἰς kinaonyesha kufika kwenye mahali palipotajwa.
- source_word: Χίου / Σάμον / Μίλητον
  choice: Kio / Samo / Mileto
  rationale: Majina haya ya mahali yametoholewa kwa maumbo yanayotumika katika mapokeo ya Biblia ya Kiswahili na yanayolingana na mfumo wa sauti wa Kiswahili.
