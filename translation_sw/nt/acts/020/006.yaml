  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: sw
  text: Lakini sisi tulisafiri kwa meli kutoka Filipi baada ya siku za Sikukuu ya Mikate Isiyotiwa Chachu. Tukawafikia Troa katika muda wa siku tano[a], ambako tukakaa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi siku tano.” Usemi wa Kigiriki unaonyesha muda wa safari mpaka walipowasili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: tuliondoka ... kwa meli
  rationale: Kitenzi hiki kinamaanisha kuondoka kwa kutumia meli; usemi huu ni wa kawaida katika Kiswahili na unaonyesha wazi namna ya safari.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: baada ya siku za Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Tafsiri hii inadumisha wazo la siku za kipindi hicho huku ikibainisha kwa msomaji wa sasa kwamba ni sikukuu ya Kiyahudi.
- source_word: ἀπὸ Φιλίππων
  choice: Filipi
  rationale: ‘Filipi’ ndiyo namna ya kawaida ya jina la mji huu katika Kiswahili; dhana ya kuondoka huko imebeba maana ya ἀπό.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: tukawafikia
  rationale: Muundo huu unaeleza kufika kwa watu waliotangulia bila kuongeza waziwazi wazo la ‘kujiunga nao,’ ambalo linadokezwa tu na muktadha.
- source_word: εἰς τὴν Τρῳάδα
  choice: huko Troa
  rationale: ‘Huko Troa’ ni muundo wa kawaida baada ya ‘tukawafikia’ na unaonyesha mahali walikokuwa watu hao.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: baada ya safari ya siku tano
  rationale: Usemi wa Kigiriki unaonyesha muda uliofikia kikomo wakati wa kuwasili. Tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba safari hadi Troa ilichukua siku tano, bila kudokeza kwamba walikaa njiani kwa kusudi.
- source_word: οὗ
  choice: huko
  rationale: Kielezi hiki kinarejelea Troa na kinaingia kwa kawaida katika sentensi ya Kiswahili.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: tukakaa siku saba
  rationale: Katika muktadha wa safari, διατρίβω humaanisha kukaa mahali kwa muda; ‘tukakaa siku saba’ ni sahili na sahihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida. Majina ‘Filipi’ na ‘Troa’ yametumiwa kwa maumbo yaliyozoeleka katika tafsiri za Kiswahili. Alama ya tanbihi imewekwa kwenye usemi wa siku tano, ambako tofauti ya tafsiri inahusika.
