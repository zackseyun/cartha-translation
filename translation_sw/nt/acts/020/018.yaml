  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: sw
  text: Walipofika kwake, aliwaambia, “Ninyi wenyewe mnajua jinsi nilivyoishi katikati yenu muda wote[b], tangu siku ya kwanza nilipofika Asia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asia hapa ni mkoa wa Kiroma wa Asia uliokuwa magharibi mwa Asia Ndogo, si bara la Asia la leo.
    reason: cultural_note
  - marker: b
    text: Au, “jinsi nilivyokuwa pamoja nanyi muda wote.” Kifungu cha Kigiriki kinaweza kusisitiza ama namna Paulo alivyoishi ama kuwapo kwake daima pamoja nanyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: Walipofika kwake
  rationale: Kifungu hiki kinaonyesha wazee wa Efeso wakifika mahali Paulo alipokuwa; ‘kwake’ huhifadhi wazo la kuelekea kwa mtu.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Ninyi wenyewe mnajua
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina msisitizo; ‘Ninyi wenyewe’ huuhifadhi kwa Kiswahili cha kawaida.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς
  choice: tangu siku ya kwanza
  rationale: Hutaja mwanzo wa kipindi ambacho Paulo alikuwa miongoni mwao kwa mwenendo na uwepo wake.
- source_word: ἐπέβην εἰς τὴν Ἀσίαν
  choice: nilipokanyaga Asia
  rationale: ‘Kukanyaga’ huhifadhi taswira hai ya ἐπιβαίνω, yaani kuweka mguu au kufika katika eneo fulani.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: jinsi nilivyoishi kati yenu wakati wote
  rationale: Tafsiri hii ni ya asili na inaonyesha namna Paulo alivyoendesha maisha yake miongoni mwao, huku tanbihi ikihifadhi uwezekano wa kusisitiza kuwapo kwake pamoja nao.
theological_decisions:
- issue: Ikiwa ἐγενόμην inasisitiza mwenendo wa Paulo au kuwapo kwake daima pamoja nao
  choice: jinsi nilivyoishi kati yenu wakati wote
  alternative: jinsi nilivyokuwa pamoja nanyi wakati wote
  rationale: Muktadha unaelekea kwenye namna ya maisha na huduma ya Paulo, lakini muundo wa Kigiriki unaweza pia kusisitiza kuwapo kwake pamoja nao; hivyo maana mbadala imehifadhiwa katika tanbihi bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa urahisi. ‘Nilipokanyaga Asia’ huhifadhi uhai wa usemi wa asili; ‘kati yenu’ huonyesha maisha ndani ya jumuiya.
