base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: sw
  text: Lakini sisi tulitangulia kwenda melini, tukasafiri kwa meli kuelekea Aso, tukikusudia kumchukua Paulo kutoka huko na kumpandisha melini. Hivyo ndivyo alivyokuwa amepanga[a], kwa kuwa yeye mwenyewe alikusudia kwenda kwa miguu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hivyo ndivyo ilivyokuwa imepangwa.” Muundo wa Kigiriki διατεταγμένος ἦν ni wa hali ya kutendwa, ingawa katika muktadha inaelekea kwamba Paulo ndiye aliyefanya mpango huo au kutoa maagizo hayo.
    reason: alternative_reading
  - marker: b
    text: Au, “kwenda kwa nchi kavu.” Kitenzi cha Kigiriki πεζεύειν hutofautisha safari ya nchi kavu na safari ya kundi kwa meli, na kinaweza kumaanisha hasa kusafiri kwa miguu.
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: tulitangulia kwenda
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia safari ya meli na kwamba kundi la mwandishi lilimtangulia Paulo.
- source_word: ἐπὶ τὸ πλοῖον
  choice: kwenda melini
  rationale: Kwa muktadha wa mwendo, kirai kina maana ya kwenda kwenye au kupanda meli; usemi huu ni wa kawaida na tendo linalofuata linaweka wazi kwamba walipanda.
- source_word: ἀνήχθημεν
  choice: tukasafiri kwa meli
  rationale: Katika matumizi ya baharini, neno hili humaanisha kuondoka kwa meli au kuanza safari ya baharini. Tafsiri hii ni ya asili kwa Kiswahili na huepuka taswira isiyofaa ya kunyanyuliwa.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: kuelekea Aso
  rationale: Kirai kinaonyesha mahali safari ya meli ilikoelekea; Aso ni uhawilishaji unaofaa wa jina Ἆσσος.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: tukikusudia kumpandisha
  rationale: μέλλω huonyesha kusudi hapa, na ἀναλαμβάνω katika muktadha huu humaanisha kumchukua mtu ndani ya meli.
- source_word: ἐκεῖθεν
  choice: huko
  rationale: Katika Kiswahili cha asili, 'kumpandisha Paulo huko' huonyesha mahali ambapo angechukuliwa na meli, bila kulazimisha tafsiri neno kwa neno ya maana ya kuanzia mahali.
- source_word: διατεταγμένος ἦν
  choice: alivyokuwa amepanga
  rationale: Muundo huu ni timilifu tangulizi wa hali ya kutendwa, lakini muktadha unamwelekeza Paulo kama aliyefanya mpango. Tanbihi huhifadhi uwezekano rasmi wa tafsiri isiyo na mtendaji aliyetajwa.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: kwa kuwa yeye mwenyewe alikusudia kwenda kwa miguu
  rationale: πεζεύω hutofautisha safari ya nchi kavu na safari ya kundi kwa meli na mara nyingi humaanisha kwenda kwa miguu. αὐτός ina mkazo, unaohifadhiwa kwa 'yeye mwenyewe'; kitenzi kishirikishi kinaeleza sababu ya mpango.
- source_word: δὲ
  choice: Lakini
  rationale: δὲ inaonyesha utofauti mdogo kati ya kundi la mwandishi na Paulo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. 'Melini' na 'kwa meli' vinatofautisha kwenda kupanda chombo na kuanza safari ya baharini. Alama zote za tanbihi zimewekwa katika matini kuu.
