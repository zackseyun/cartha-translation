  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: sw
  text: Ninyi wenyewe mnajua kwamba mikono hii ilikidhi mahitaji yangu na ya wale waliokuwa pamoja nami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikono hii ilitosheleza mahitaji yangu na ya wale waliokuwa pamoja nami.” Kitenzi cha Kigiriki kinaweza kusisitiza huduma ya vitendo iliyosababisha msaada wa mahitaji ya maisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: Ninyi wenyewe
  rationale: Kiwakilishi hiki kina mkazo; “Ninyi wenyewe” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: γινώσκετε
  choice: mnajua
  rationale: Kitenzi cha wakati uliopo kinaonyesha kwamba wasikilizaji wana ufahamu wa moja kwa moja kuhusu mwenendo wa Paulo.
- source_word: ταῖς χρείαις μου
  choice: mahitaji yangu
  rationale: χρεία hapa inahusu mahitaji ya maisha, hasa msaada wa kimwili au wa vitu; “mahitaji yangu” ni ya asili na wazi.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: wale waliokuwa pamoja nami
  rationale: Tafsiri hii inafuata kirai cha Kigiriki bila kuamua zaidi ikiwa walikuwa wasafiri wenzake, wafanyakazi wenzake, au kundi jingine.
- source_word: ὑπηρέτησαν
  choice: ilihudumia
  rationale: Kitenzi kina maana ya kutoa huduma au msaada. Kwa kuwa mtenda ni “mikono hii,” “ilihudumia” inadumisha taswira ya kazi ya mikono, huku muktadha ukionyesha matokeo ya msaada wa kimwili.
- source_word: αἱ χεῖρες αὗται
  choice: mikono hii
  rationale: Hii inahifadhi kiashiria na taswira halisi ya Paulo kuelekeza kwenye mikono yake, bila kuongeza neno “yangu” lisilotajwa moja kwa moja.
