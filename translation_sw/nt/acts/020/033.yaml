  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: sw
  text: Sikutamani fedha, dhahabu, wala mavazi ya mtu yeyote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikutaka fedha, dhahabu, wala mavazi ya mtu yeyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργυρίου
  choice: fedha
  rationale: Neno hili humaanisha hasa fedha kama metali ya thamani; hapa limeorodheshwa pamoja na dhahabu na mavazi kama mali za thamani. Kiswahili “fedha” huhifadhi maana hiyo, ingawa pia linaweza kueleweka kuwa pesa.
- source_word: χρυσίου
  choice: dhahabu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno hili katika orodha ya mali za thamani.
- source_word: ἱματισμοῦ
  choice: mavazi
  rationale: “Mavazi” ni Kiswahili cha sasa, cha kawaida na chenye heshima kwa nguo au mavazi yanayomilikiwa.
- source_word: οὐδενὸς
  choice: ya mtu yeyote
  rationale: Hapa umbo la umilikaji linaonyesha kwamba fedha, dhahabu na mavazi ni mali za watu wengine. Katika sentensi kanushi, “ya mtu yeyote” ni ya asili na huweka wazi maana hiyo.
- source_word: ἐπεθύμησα
  choice: sikutamani
  rationale: Kitenzi kinaweza kumaanisha kutamani au kuwa na tamaa. Katika muktadha huu wa Paulo kujitetea dhidi ya uchoyo, “sikutamani” hubeba uzito wa kimaadili kwa kawaida bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: ἢ ... ἢ ... ἢ
  choice: ', ... , wala ...'
  rationale: Muundo wa Kiswahili wenye kanusho na “wala” unaunganisha orodha kwa kawaida huku ukihifadhi kwamba Paulo anakataa kila aina ya mali iliyotajwa.
theological_decisions:
- issue: Uzito wa kimaadili wa ἐπιθυμέω kuhusu mali za wengine
  choice: sikutamani
  alternative: sikutaka
  rationale: Muktadha ni ushuhuda wa Paulo kuhusu uadilifu wake na kutokuwa na uchoyo. “Kutamani” huonyesha hamu yenye uzito wa kimaadili, lakini pia huhifadhi upana wa kitenzi kuliko tafsiri kali zaidi kama “kutamani kwa tamaa.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kawaida; “fedha” huhifadhi taswira halisi ya orodha, na “wala” huifanya orodha iliyo chini ya kanusho isikike kwa ufasaha.
