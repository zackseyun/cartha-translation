  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: sw
  text: Kwa maana sikujizuia kuwatangazia kusudi lote la Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpango wote wa Mungu,” “shauri lote la Mungu,” au “mapenzi yote ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inatoa msingi wa kauli iliyotangulia, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: οὐ ὑπεστειλάμην
  choice: sikujizuia
  rationale: Kitenzi hiki katika hali ya kati hapa kina maana ya kutorudi nyuma au kutokwepa kufanya jambo. ‘Sikujizuia’ ni ya asili katika Kiswahili na pia inalingana na muktadha wa Matendo 20:20.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: kuwatangazia
  rationale: Muundo huu unakamilisha maana ya kile ambacho Paulo hakujizuia kufanya. ‘Kuwatangazia’ huwasilisha tendo la kuripoti au kutangaza wazi, huku kiambishi ‘-wa-’ kikibeba ὑμῖν.
- source_word: πᾶσαν
  choice: lote
  rationale: Pamoja na nomino ya umoja ‘kusudi,’ neno hili linasisitiza ukamilifu wa kile kilichotangazwa.
- source_word: τὴν βουλὴν τοῦ θεοῦ
  choice: kusudi lote la Mungu
  rationale: βουλή linaweza kumaanisha kusudi, mpango, shauri, au mapenzi. ‘Kusudi’ ni la asili na lenye upana wa kutosha katika Kiswahili, bila kulifunga neno kwenye maana moja finyu.
- source_word: ὑμῖν
  choice: -wa- katika ‘kuwatangazia’
  rationale: Yambwa hii inaonyesha kwamba wazee wa Efeso ndio waliotangaziwa ujumbe huo.
theological_decisions:
- issue: Maana ya βουλὴ τοῦ θεοῦ
  choice: kusudi lote la Mungu
  alternative: mpango wote wa Mungu; shauri lote la Mungu; mapenzi yote ya Mungu
  rationale: Kirai hiki kinaweza kusisitiza kusudi la Mungu, mpango wake, shauri lake, au mapenzi yake. Matini kuu hutumia ‘kusudi’ kwa uwazi wa Kiswahili, na tanbihi huhifadhi upana halisi wa maana bila kuamua mjadala wa kiteolojia kwa upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni wa ulinganifu mwafaka; unaweka wazi uhusiano wa hoja na ukamilifu wa ujumbe bila kuondoa wigo wa maana wa βουλή.
