  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: sw
  text: Kwa hiyo ninawashuhudia leo kwamba sina hatia ya damu ya watu wote[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niko safi kutokana na damu ya watu wote”; msemo wa Kigiriki unamaanisha kuwa mtu hana hatia au wajibu kuhusu wengine.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya huenda yanarejelea taswira ya mlinzi katika Ezekieli kuhusu hatia ya damu (kwa mfano, Eze. 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: Kwa hiyo
  rationale: Katika muktadha huu neno linaonyesha hitimisho linalotokana na maelezo yaliyotangulia; “Kwa hiyo” ni kiunganishi cha kawaida na chenye nguvu inayofaa katika Kiswahili.
- source_word: μαρτύρομαι
  choice: ninawashuhudia
  rationale: Kitenzi hiki kina maana ya kutoa ushuhuda wa dhati na rasmi. “Ninawashuhudia” kinahifadhi uzito huo bila kuongeza wazo la kiapo.
- source_word: ὑμῖν
  choice: -wa-
  rationale: Kiambishi cha yambwa katika “ninawashuhudia” kinawakilisha kwa kawaida dative ya Kigiriki, yaani “kwenu/ninyi,” bila kusisitiza isivyohitajika kuwa ni ushahidi mbele ya mahakama.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: leo
  rationale: Hii ndiyo namna ya asili na wazi ya kutoa maana ya msemo “siku hii” katika Kiswahili cha sasa; uzito wa kauli unabaki katika kitenzi cha kushuhudia na muundo mzima.
- source_word: ὅτι
  choice: kwamba
  rationale: “Kwamba” linaingiza kwa kawaida maudhui ya ushuhuda wa Paulo.
- source_word: καθαρός
  choice: sina hatia
  rationale: Ingawa maana ya msingi ni “safi,” hapa kivumishi kinahusu kutokuwa na hatia au wajibu wa damu; msemo “sina hatia” unaeleweka kwa urahisi na kuhifadhi nguvu ya kimaadili na kisheria.
- source_word: εἰμι
  choice: nina (katika “sina”)
  rationale: Kitenzi kishirikishi kimewasilishwa ndani ya umbo hasi la Kiswahili “sina,” yaani “mimi si mwenye/ni bila hatia.”
- source_word: ἀπὸ τοῦ αἵματος
  choice: ya damu
  rationale: Pamoja na “sina hatia,” “ya damu” huunda msemo wa Kiswahili unaoonyesha kutowajibika kwa damu ya wengine, huku ukihifadhi taswira halisi ya damu iliyomo katika Kigiriki.
- source_word: πάντων
  choice: ya mtu yeyote
  rationale: Wingi usio na mpaka wa πάντων katika sentensi hasi unatolewa kwa Kiswahili cha kawaida kama “mtu yeyote.” Hii inahifadhi upeo wa wote bila kudai kwamba neno lenyewe linataja wazi “watu.”
theological_decisions:
- issue: Maana ya kutokuwa na hatia ya damu ya wote
  choice: Msemo unaonyesha kuwa Paulo hana hatia wala wajibu kuhusu wengine kwa sababu hakukwepa wajibu wake wa kuwaonya na kuwafundisha.
  alternative: Kuhusika moja kwa moja tu katika kifo halisi cha kimwili cha mtu.
  rationale: Muktadha wa Matendo 20:20–27 na mwangwi wa picha ya mlinzi katika Ezekieli unaelekeza kwenye hatia inayoweza kumpata mtu asipotoa onyo. Tafsiri inadumisha taswira ya damu badala ya kuifafanua yote ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ninawashuhudia” kinabeba uzito wa kauli rasmi, huku “leo” na “mtu yeyote” vikifanya sentensi iwe ya kawaida na inayoeleweka. Alama zote za tanbihi zimewekwa katika matini kuu.
