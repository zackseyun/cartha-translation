  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: sw
  text: nikimtumikia Bwana kwa unyenyekevu wote, kwa machozi na kwa majaribu yaliyonipata kwa sababu ya njama za Wayahudi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vishawishi” au “kupimwa”; hapa maana inayokusudiwa ni majaribu ya nje yaliyotokana na upinzani.
    reason: lexical_alternative
  - marker: b
    text: Yaani, njama za wapinzani fulani wa Kiyahudi dhidi ya Paulo, wala si kauli kuhusu Wayahudi wote.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: nikimtumikia
  rationale: Kitenzi cha hali ya kuendelea kinaeleza jinsi Paulo alivyoendesha huduma yake; “nikimtumikia” ni Kiswahili cha kawaida kinachohifadhi wazo la huduma ya kujitoa.
- source_word: τῷ κυρίῳ
  choice: Bwana
  rationale: Linahifadhi cheo κύριος bila kumtaja wazi zaidi; katika muktadha huu kinamrejelea kwa kawaida Bwana Yesu.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: kwa unyenyekevu wote
  rationale: “Kwa” huonyesha namna ya kutumikia, na “wote” huhifadhi nguvu pana ya πάσης.
- source_word: δακρύων
  choice: machozi
  rationale: Tafsiri halisi ya nomino ya wingi, ikihifadhi uzito wa kihisia wa hotuba ya Paulo.
- source_word: πειρασμῶν
  choice: majaribu
  rationale: Neno linaweza kumaanisha majaribu, vishawishi, au kupimwa; hapa muktadha wa njama unaelekeza kwenye mateso na shida za nje, huku neno “majaribu” likihifadhi upana wake.
- source_word: τῶν συμβάντων μοι
  choice: yaliyonipata
  rationale: Ni usemi wa asili na mfupi unaoonyesha mambo yaliyompata Paulo.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: kwa sababu ya njama
  rationale: Katika muktadha huu ἐν inaonyesha mazingira au kisababishi cha majaribu; “kwa sababu ya” hueleza uhusiano huo wazi kwa Kiswahili.
- source_word: τῶν Ἰουδαίων
  choice: za Wayahudi
  rationale: Inahifadhi moja kwa moja jina la kundi lililo katika Kigiriki; tanbihi inazuia lisieleweke kuwa dai kuhusu Wayahudi wote.
theological_decisions:
- issue: Uwezekano wa usemi “Wayahudi” kueleweka kama shutuma dhidi ya Wayahudi wote
  choice: Kuhifadhi “Wayahudi” katika matini kuu, kwa maana ya wapinzani fulani wa Kiyahudi waliomfanyia Paulo njama
  alternative: viongozi wa Kiyahudi; Wayudea
  rationale: Kigiriki kinasema Ἰουδαίων bila kukibana moja kwa moja kuwa viongozi au Wayudea. Tanbihi inaweka mpaka wa kimuktadha bila kubadili maneno ya chanzo.
- issue: Maana ya πειρασμῶν
  choice: majaribu yanayompata mtu kutokana na upinzani
  alternative: vishawishi; kupimwa
  rationale: Njama zinazotajwa zinaonyesha dhiki za nje, lakini tanbihi huhifadhi uwezekano wa kileksia wa neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kirai cha Kigiriki umehifadhiwa kadiri inavyowezekana, huku marudio ya “kwa” yakitumiwa kuweka wazi uratibu wa unyenyekevu, machozi, na majaribu.
