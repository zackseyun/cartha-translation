reference: Acts 20:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: sw
  text: Siku ya kwanza ya juma, tulipokuwa tumekusanyika ili kuumega mkate[a], Paulo alikuwa akizungumza nao, akiwa karibu kuondoka siku iliyofuata[b], naye aliendelea kuzungumza mpaka usiku wa manane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu “kuumega mkate” huenda kinarejelea mlo wa pamoja, na huenda pia kinadokeza Meza ya Bwana.
    reason: lexical_alternative
  - marker: b
    text: Au, “Paulo alikuwa akizungumza nao kwa kuwa alikuwa karibu kuondoka siku iliyofuata, naye aliendelea kuzungumza mpaka usiku wa manane.”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἐν δὲ
  choice: Siku ya
  rationale: Ἐν pamoja na hali ya utoaji huonyesha wakati, na δέ ni kiunganishi hafifu. Mwanzo huu ni wa kawaida katika Kiswahili bila kuongeza wazo la tofauti ambalo halijasisitizwa.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: siku ya kwanza ya juma
  rationale: Hii ni nahau ya Kiyunani cha Koine inayomaanisha siku ya kwanza ya juma; tafsiri ya neno kwa neno kama ‘moja ya Sabato’ ingepotosha.
- source_word: συνηγμένων ἡμῶν
  choice: tulipokuwa tumekusanyika
  rationale: Muundo wa genitive absolute unaonyesha mazingira ya tendo kuu na unadumisha mtazamo wa msimulizi katika nafsi ya kwanza wingi.
- source_word: κλάσαι ἄρτον
  choice: ili kuumega mkate
  rationale: Kitenzi-jina kinaonyesha kusudi. Nahau ‘kuumega mkate’ inadumisha uwezekano wa mlo wa pamoja na pia madokezo ya Meza ya Bwana bila kuilazimisha maana moja ya kimadhehebu.
- source_word: διελέγετο
  choice: alikuwa akizungumza nao
  rationale: Wakati usiotimilika unaonyesha tendo lililoendelea, na ‘akizungumza nao’ inadumisha kwa kiasi fulani hali ya mawasiliano ya pande mbili kuliko ‘akihubiri’.
- source_word: αὐτοῖς
  choice: nao
  rationale: Kiwakilishi kinawarejelea waliokusanyika bila kuongeza utambulisho maalumu usiotajwa katika mstari.
- source_word: μέλλων ἐξιέναι
  choice: akiwa na nia ya kuondoka
  rationale: Muundo huu unaonyesha kuondoka kulikokuwa kunakaribia au kukusudiwa. Kiswahili hiki ni cha asili katika muktadha wa safari bila kutumia tafsiri ya moja kwa moja isiyoeleweka ya ‘kwenda nje’.
- source_word: τῇ ἐπαύριον
  choice: siku iliyofuata
  rationale: Kifungu hiki cha wakati kinarejelea siku inayofuata na kimetafsiriwa kwa Kiswahili wazi na cha kawaida.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: naye akaendelea kuzungumza
  rationale: παρατείνω ina maana ya kurefusha au kuendeleza, na λόγος hapa ni mazungumzo au hotuba ya Paulo. Tafsiri hii ni ya asili na haifanyi usemi uwe rasmi kuliko chanzo.
- source_word: μέχρι μεσονυκτίου
  choice: mpaka usiku wa manane
  rationale: 'Hiki ni kikomo cha wakati kilicho wazi: Paulo aliendelea hadi usiku wa manane.'
theological_decisions:
- issue: Maana ya ‘kuumega mkate’ katika kusanyiko la Wakristo wa kwanza
  choice: Nahau ‘kuumega mkate’ imedumishwa bila kuamua ikiwa ni Meza ya Bwana pekee au mlo wa pamoja.
  alternative: ‘kushiriki Meza ya Bwana’ au ‘kula mlo wa pamoja’
  rationale: Katika Matendo, kifungu hiki kinaweza kuhusisha ushirika wa mlo na pia umuhimu wa Meza ya Bwana. Tafsiri inadumisha uwazi wa chanzo na haingizi uamuzi wa kimadhehebu.
- issue: Uhusiano wa μέλλων ἐξιέναι na tendo la Paulo la kuzungumza
  choice: ‘akiwa na nia ya kuondoka’ imewekwa kama hali inayoambatana na mazungumzo yake.
  alternative: ‘kwa kuwa alikuwa karibu kuondoka’ kama sababu iliyoelezwa wazi
  rationale: Kivumishi-shirikishi cha Kiyunani kinaweza kueleweka kimazingira au kisababishi. Maandishi makuu hayalazimishi uhusiano wa kisababishi, huku tanbihi ikihifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi na nafsi ya kwanza wingi vimedumishwa. Alama [a] imewekwa baada ya ‘kuumega mkate,’ ambako tanbihi yake inahusika moja kwa moja.
