  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: sw
  text: Sopatro mwana wa Pirho, mtu wa Beroya, aliandamana naye; pamoja naye walikuwako Aristarko na Sekundo, kutoka Thesalonike; Gayo, kutoka Derbe, na Timotheo; na Tikiko na Trofimo, kutoka Asia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jimbo la Kiroma la Asia, si bara la Asia la leo.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: aliandamana naye
  rationale: Kitenzi cha wakati uliopita usiotimilika kinaonyesha kwamba Sopatro alikuwa akisafiri pamoja na Paulo; “aliandamana naye” ni Kiswahili cha kawaida na chenye heshima katika muktadha huu.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sopatro mwana wa Pirho, mwenyeji wa Beroya
  rationale: Genitivi Πύρρου inaeleweka kwa kawaida kuwa jina la baba, na Βεροιαῖος humtambulisha Sopatro kuwa mtu wa Beroya.
- source_word: Θεσσαλονικέων
  choice: kutoka Thesalonike
  rationale: Ingawa kwa muundo halisi ni “miongoni mwa Wathesalonike,” hapa neno hilo linatambulisha mahali walikotoka Aristarko na Sekundo; “kutoka Thesalonike” ni wazi na ya kawaida kwa Kiswahili.
- source_word: Γάϊος Δερβαῖος
  choice: Gayo kutoka Derbe
  rationale: Δερβαῖος ni kivumishi cha kijiografia; “kutoka Derbe” huwasilisha uhusiano huo kwa Kiswahili cha sasa.
- source_word: Ἀσιανοὶ
  choice: kutoka Asia
  rationale: Neno hilo linamaanisha watu wa jimbo la Kiroma la Asia; tafsiri fupi inahifadhi jina la eneo huku tanbihi ikizuia kuchanganywa na bara la kisasa.
- source_word: δέ ... δέ ... δέ
  choice: pia ... na ... na
  rationale: Viunganishi hivi vinaendeleza orodha kwa kuongeza vikundi; Kiswahili hutumia “pia” na “na” kwa mtiririko wa asili bila kuvipa uzito usiohitajika.
