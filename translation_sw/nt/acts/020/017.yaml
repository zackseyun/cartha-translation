  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: sw
  text: Kutoka Mileto, alituma ujumbe kwenda Efeso na kuwaita wazee wa kanisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alituma kuwaita wazee wa kanisa.” Kigiriki kinaunganisha “kutuma kwenda Efeso” na “kuwaita”; hakitaji wazi kama alituma ujumbe au wajumbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: Akiwa Mileto
  rationale: ἀπό pamoja na hali ya mahali hapa inaonyesha mahali Paulo alikotuma ujumbe. Kiswahili cha asili hutumia “akiwa Mileto” ili kuepuka “kutoka Mileto,” ambalo lingeweza kudokeza kwamba Paulo mwenyewe aliondoka huko. δέ ni kiunganishi hafifu na hakihitaji neno tofauti katika sentensi hii.
- source_word: πέμψας εἰς Ἔφεσον
  choice: alituma ujumbe kwenda Efeso
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia au lililoambatana na kuitwa kwa wazee. Kitu au watu waliotumwa hawakutajwa wazi; “ujumbe” hutoa maana ya kawaida katika Kiswahili bila kudai kwamba Paulo mwenyewe alienda Efeso.
- source_word: μετεκαλέσατο
  choice: kuwaita
  rationale: Hapa kitenzi cha kati kina maana ya kuwaita watu waje mahali alipo. “Kuwaita” ni cha kawaida na hakiongezi hisia ya amri kali ambayo “kuwaita kwa lazima” ingeweza kuwa nayo.
- source_word: τοὺς πρεσβυτέρους
  choice: wazee
  rationale: Katika muktadha wa Matendo, neno hili linawataja viongozi wanaotambuliwa katika jumuiya ya waamini, si wanaume wenye umri mkubwa tu. “Wazee” ndilo neno la kawaida la Kiswahili na halilazimishi mfumo wa dhehebu fulani.
- source_word: τῆς ἐκκλησίας
  choice: wa kanisa
  rationale: ἐκκλησία hapa ni jumuiya ya waamini wa Efeso. “Kanisa” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya πρεσβυτέρους katika muktadha wa kanisa
  choice: viongozi wa kanisa wanaoitwa “wazee”
  alternative: wanaume wazee wa jumuiya; au “mapresbiteri” kama istilahi ya kiufundi
  rationale: Muktadha wa hotuba inayofuata na matumizi ya neno hili katika Matendo yanaonyesha viongozi wanaotambuliwa. “Wazee” huhifadhi maana hiyo bila kuingiza muundo wa uongozi wa dhehebu la baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Akiwa Mileto” unaweka wazi mahali Paulo alipokuwa, na “alituma ujumbe” unasomeka kwa urahisi huku tanbihi ikihifadhi kutotajwa wazi kwa kitu au watu waliotumwa katika Kigiriki.
