- from: Akiwa Mileto, alituma ujumbe kwenda Efeso na kuwaita wazee wa kanisa.[a]
  to: Kutoka Mileto, alituma ujumbe kwenda Efeso na kuwaita wazee wa kanisa.[a]
  rationale: The revision directly renders ἀπό as “Kutoka,” while retaining the draft’s natural contextual rendering of the unstated object of πέμψας as “ujumbe.” The footnote now offers a concise alternative and explicitly preserves the source text’s ambiguity about whether a message or messengers were sent, without introducing an explicit command that the elders come to Paul.
