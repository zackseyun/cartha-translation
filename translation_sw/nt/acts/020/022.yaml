base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: sw
  text: Na sasa, tazama, nimefungwa katika Roho[a] na ninaenda Yerusalemu, bila kujua yatakayonipata huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika roho yake mwenyewe”; kishazi cha Kigiriki kinaweza kumaanisha roho ya Paulo mwenyewe au Roho Mtakatifu. Pia kinaweza kueleweka kuwa, “nimefungwa na Roho.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi nguvu ya alama ya usemi na mpito wenye mkazo, huku ikibaki lugha yenye hadhi na inayoeleweka.
- source_word: δεδεμένος
  choice: nikiwa nimefungwa
  rationale: Huhifadhi sitiari ya kitenzi δέω katika hali timilifu bila kuifasiri moja kwa moja kuwa ‘ninalazimishwa’.
- source_word: τῷ πνεύματι
  choice: katika Roho
  rationale: Hufuata kwa karibu kishazi cha Kigiriki na kumwelekea Roho Mtakatifu kulingana na muktadha wa Matendo, bila kusisitiza wazi mno maana ya utendaji kama ‘na Roho’; utata halisi umeelezwa katika tanbihi.
- source_word: πορεύομαι
  choice: ninaenda
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoonyesha tendo linaloendelea au safari inayokusudiwa.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: yatakayonipata huko
  rationale: Huwasilisha kwa Kiswahili asilia maana ya mambo yatakayomkabili Paulo Yerusalemu, badala ya kufuata kihalisi sitiari ya mambo ‘kukutana’ naye.
- source_word: μὴ εἰδώς
  choice: nisijue
  rationale: Hutoa kwa ufupi na kwa uhusiano sahihi hali ya Paulo kutokuwa na habari kuhusu yatakayompata.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Ni umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Rejeleo la τῷ πνεύματι
  choice: Roho Mtakatifu ndiye rejeleo linalowezekana zaidi, likitafsiriwa ‘katika Roho’
  alternative: roho ya Paulo mwenyewe (‘katika roho yangu’), au msisitizo wa utendaji (‘nimefungwa/ninalazimishwa na Roho’)
  rationale: Matendo mara nyingi humtaja Roho Mtakatifu, na muktadha unaofuata unaunga mkono uongozi wake. Hata hivyo, muundo wa Kigiriki hauondoi kabisa uwezekano wa roho ya Paulo au maana ya kulazimishwa, hivyo tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ huhifadhi mkazo wa ἰδοὺ; ‘nikiwa nimefungwa’ huhifadhi sitiari na utata wa chanzo. Alama ya tanbihi [a] imewekwa mara baada ya kishazi kinachohusika.
