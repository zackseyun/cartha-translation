  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: sw
  text: Na sasa ninawakabidhi kwa Mungu na kwa neno la neema yake[a], ambalo linaweza kuwajenga na kuwapa urithi miongoni mwa wote waliotakaswa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye anaweza,” ikiwa kishazi hiki kinachukuliwa kumrejelea hasa Mungu badala ya “neno la neema yake.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: ninawakabidhi
  rationale: Kitenzi cha kati kinaeleza kuwaweka wasikilizaji chini ya uangalizi wa mwingine; “ninawakabidhi” ni Kiswahili cha sasa na cha kawaida kinachodumisha maana hiyo.
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Dativi inaonyesha yule ambaye Paulo anawakabidhi kwake; “kwa Mungu” ni muundo wa kawaida baada ya “kuwakabidhi”.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: kwa neno la neema yake
  rationale: Tafsiri hii inadumisha muundo wa jenitivi na uzito wa λόγος, huku “neno” likiweza kumaanisha ujumbe unaotangazwa.
- source_word: τῷ δυναμένῳ
  choice: ambalo linaweza
  rationale: Hurejelea kisarufi nomino ya karibu “neno la neema yake”; hata hivyo, uwezekano wa kurejelea Mungu umehifadhiwa katika tanbihi.
- source_word: οἰκοδομῆσαι
  choice: kuwajenga
  rationale: Kitenzi kimetumiwa kwa maana ya kujenga kiroho. Kiambishi cha yambwa “-wa-” kinaweka wazi walengwa wanaoeleweka kutokana na muktadha.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: kuwapa urithi
  rationale: “Kuwapa” huweka wazi wapokeaji wanaodokezwa na muktadha, na “urithi” hudumisha taswira ya kibiblia.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: miongoni mwa wote waliotakaswa
  rationale: “Waliotakaswa” hudumisha hali timilifu ya tendo lililofanywa lenye matokeo yanayoendelea; “miongoni mwa” huakisi matumizi ya ἐν hapa.
theological_decisions:
- issue: Kirejelewa cha τῷ δυναμένῳ (“anaye/ambalo linaweza”)
  choice: 'Katika matini kuu, kishazi kinarejelea “neno la neema yake”: “ambalo linaweza.”'
  alternative: 'Kishazi kinamrejelea hasa Mungu: “ambaye anaweza.”'
  rationale: Sintaksia inaruhusu marejeleo yote mawili. Nomino iliyo karibu ni “neno,” na Maandiko yanaweza kulieleza neno kuwa lenye nguvu ya kujenga; hata hivyo, Mungu pia anaweza kueleweka kuwa mtendaji anayetoa urithi. Tanbihi inadumisha utata huu halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo unafuata chanzo kwa ukaribu bila kuwa mgumu; utata wa kisarufi na kiteolojia umehifadhiwa kwa tanbihi.
