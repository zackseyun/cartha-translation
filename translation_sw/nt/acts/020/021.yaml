review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the solemn testimonial force, the Jewish-and-Greek paired audience, repentance directed toward God, and faith directed toward the Lord Jesus. However, the placement of pia is not an idiomatic way to convey τε καὶ (‘both ... and’), and inayomwelekea Mungu is an unnecessarily strained modifier of toba.
  naturalness: Replace the awkward audience phrase and the cumbersome relative construction with idiomatic Standard East African Swahili. ‘Akitoa ushuhuda kwa uzito kwa Wayahudi na Wagiriki wote’ clearly conveys the sense in a natural formal register; ‘toba kwa Mungu’ naturally expresses repentance directed to God in this parallel construction.
  terminology: Toba, imani, Bwana, Wayahudi, Wagiriki, and Yesu are appropriate established terms. The lexical-alternative footnote for πίστις is sound and its anchor remains correctly placed after Yesu.
  issues:
  - severity: medium
    issue: ‘Wayahudi na Wagiriki pia’ does not clearly or naturally render the paired inclusive force of Ἰουδαίοις τε καὶ Ἕλλησιν.
    rationale: Pia (‘also’) is placed as though it modifies only the second group. ‘Wayahudi na Wagiriki wote’ makes the inclusive scope explicit without broadening ‘Greeks’ to ‘Gentiles’.
  - severity: medium
    issue: ‘toba inayomwelekea Mungu’ is unnatural and overly literal in Swahili.
    rationale: The Greek εἰς marks the direction of repentance. In standard Swahili biblical/formal usage, ‘toba kwa Mungu’ expresses this relationship naturally while retaining the contrast with ‘imani katika Bwana wetu Yesu’.
  revised_text: akitoa ushuhuda kwa uzito kwa Wayahudi na Wagiriki wote kuhusu toba kwa Mungu na imani katika Bwana wetu Yesu[a].
  revised_footnotes:
  - marker: a
    text: Au, “kumtumaini Bwana wetu Yesu.”
    reason: lexical_alternative
  revision_rationale: The revision improves idiomatic Swahili and accurately represents the inclusive Jewish-and-Greek pairing and the directional relationship of repentance to God. It retains the formal register, all key theological terminology, and the existing lexical-alternative footnote.
