  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: sw
  text: akitoa ushuhuda kwa uzito kwa Wayahudi na Wagiriki wote kuhusu toba kwa Mungu na imani katika Bwana wetu Yesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtumaini Bwana wetu Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: akiwashuhudia kwa uzito
  rationale: Kitenzi hiki kinaonyesha kutoa ushuhuda kwa msisitizo na kwa uzito; tafsiri hii inahifadhi wazo la ushuhuda pamoja na uzito wake.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: Wayahudi na Wagiriki pia
  rationale: Huhifadhi makundi mawili yaliyotajwa wazi na Luka bila kupanua Ἕλληνες kuwa neno la jumla zaidi, “Watu wa Mataifa.”
- source_word: μετάνοιαν
  choice: toba
  rationale: “Toba” ni neno la kawaida na linaloeleweka kwa mgeuko wa ndani na wa kimaadili unaodokezwa hapa, si kubadili mawazo tu.
- source_word: εἰς θεόν
  choice: inayomwelekea Mungu
  rationale: εἰς inaonyesha mwelekeo wa toba kwa Mungu; “inayomwelekea” huonyesha uelekeo huo kwa uwazi.
- source_word: πίστιν
  choice: imani
  rationale: Kwa kuwa Yesu ametajwa wazi kuwa mlengwa, “imani” ni tafsiri ya kawaida na inayofaa; “kumtumaini” limehifadhiwa kama uwezekano katika tanbihi.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: katika Bwana wetu Yesu
  rationale: “Imani katika” ni usemi wa kawaida wa Kiswahili kwa imani iliyoelekezwa kwa mtu, huku “Bwana” ikihifadhi uzito wa kichwa κύριος.
theological_decisions:
- issue: Tafsiri ya πίστις katika usemi wenye uzito wa kiteolojia
  choice: imani katika Bwana wetu Yesu
  alternative: kumtumaini Bwana wetu Yesu
  rationale: Kigiriki kinamtaja Yesu wazi kuwa mlengwa wa πίστις; “imani” inafaa katika matini kuu, huku “kumtumaini” ikiwa tafsiri halali ya maana inayoweza kusaidia msomaji na hivyo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unahifadhi uzito wa ushuhuda, makundi yote mawili, na ulinganifu wa toba kwa Mungu na imani katika Yesu.
