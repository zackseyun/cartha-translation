translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inadumisha mfuatano wa matendo na upana wa maana ya παρακαλέω, huku tanbihi ikihifadhi uwezekano wa kuelewa λόγῳ πολλῷ kama usemi mrefu au himizo nyingi.
