translation:
  language: sw
  text: Baada ya kupita katika maeneo yale na kuwatia moyo kwa maneno mengi[a], alifika Ugiriki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa muda mrefu” au “kwa mawaidha mengi”; Kigiriki husema kihalisi “kwa usemi mwingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Baada ya kupita
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia kufika kwake Ugiriki; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: τὰ μέρη ἐκεῖνα
  choice: maeneo yale
  rationale: Neno μέρη lina maana ya sehemu au maeneo; hapa linarejelea maeneo ya kijiografia aliyoyapitia.
- source_word: παρακαλέσας
  choice: kuwatia moyo
  rationale: παρακαλέω inaweza kumaanisha kutia moyo, kuhimiza, au kufariji. Katika muktadha wa Paulo kuwatembelea waamini, ‘kuwatia moyo’ huhifadhi maana pana ya kichungaji bila kuibana kuwa maonyo pekee.
- source_word: αὐτοὺς
  choice: wa-
  rationale: Kiambishi cha yambwa ‘wa-’ katika ‘kuwatia’ kinawakilisha kiwakilishi αὐτούς na kurejelea waamini katika maeneo yaliyotajwa.
- source_word: λόγῳ πολλῷ
  choice: kwa maneno mengi
  rationale: Hili linafuata kwa karibu usemi wa Kigiriki, ambao kihalisi ni ‘kwa neno/usemi mwingi,’ huku maana zinazowezekana za kusema kwa muda mrefu au kuhimiza sana zikielezwa katika tanbihi.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: alifika Ugiriki
  rationale: Usemi huu unaonyesha kuwasili kwake katika eneo la Ugiriki. ‘Alifika Ugiriki’ ni Kiswahili cha kawaida na chenye maana ya mwendo unaolengwa na εἰς.
- source_word: δὲ
  choice: Baada ya
  rationale: δέ ni kiunganishi hafifu cha kuendeleza simulizi; katika Kiswahili nguvu yake ya mpito imejumuishwa kiasili katika muundo wa wakati unaoanza kwa ‘Baada ya.’
