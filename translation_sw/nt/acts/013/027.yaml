  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: sw
  text: Kwa maana wakazi wa Yerusalemu na watawala wao, kwa kuwa hawakumtambua huyu[a], kwa kumhukumu walitimiza sauti za manabii[b] zinazosomwa kila Sabato,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yeye.” Kigiriki kina kiwakilishi cha kuonyesha, “huyu,” ambacho huenda kikasisitiza kwamba msemaji anamrejelea Yesu.
    reason: lexical_alternative
  - marker: b
    text: Au “maneno ya manabii.” Kihalisi, “sauti za manabii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: wakazi wa Yerusalemu
  rationale: Kirai hiki kinawataja watu wanaoishi Yerusalemu; “wakazi” ni kifupi, cha kawaida, na kinahifadhi maana ya kundi hilo.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: watawala wao
  rationale: Neno ἄρχοντες hapa lina uzito wa uongozi na mamlaka ya kutoa hukumu; “watawala” linahifadhi maana hiyo kuliko neno la jumla “viongozi.”
- source_word: τοῦτον
  choice: huyu
  rationale: Kiwakilishi cha kuonyesha katika Kigiriki kinamwelekezea Yesu kwa msisitizo; “huyu” kinahifadhi nguvu hiyo badala ya kutumia “yeye” pekee.
- source_word: ἀγνοήσαντες
  choice: kwa kuwa hawakumtambua
  rationale: Katika muktadha huu, tatizo si kutokuwa na habari juu ya Yesu bali kushindwa kutambua yeye ni nani. Muundo wa sababu unaonyesha uhusiano wa kishiriki hiki na tendo kuu.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: sauti za manabii
  rationale: “Sauti” linahifadhi taswira ya φωνάς na wazo la ushuhuda wa manabii unaosikika wakati Maandiko yanaposomwa.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: zinazosomwa kila Sabato
  rationale: Kirai hiki kinaeleza sauti za manabii na desturi ya kuzisoma kila Sabato; tafsiri ni ya kawaida na wazi katika Kiswahili.
- source_word: κρίναντες
  choice: kwa kumhukumu
  rationale: Katika muktadha, κρίνω ni kutoa hukumu ya hatia dhidi ya Yesu. “Kwa kumhukumu” pia linaonyesha kwamba kitendo hicho ndicho kilichotimiza ushuhuda wa manabii.
- source_word: ἐπλήρωσαν
  choice: walitimiza
  rationale: πληρόω hapa linahusu kutimia kwa yaliyonenwa katika Maandiko; “walitimiza” ni tafsiri iliyo wazi na inayofaa muktadha.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ linaanzisha maelezo ya dai lililotangulia; “Kwa maana” linahifadhi uhusiano huo wa ufafanuzi.
theological_decisions:
- issue: Aina ya kutokumjua Yesu
  choice: hawakumtambua huyu
  alternative: hawakumjua yeye
  rationale: Tafsiri iliyochaguliwa inaonyesha kushindwa kutambua Yesu ni nani bila kudai kwamba hawakuwa na habari yoyote juu ya kuwapo kwake; hivyo mvutano wa kifungu unabaki wazi.
- issue: Uhusiano wa hukumu yao na kutimia kwa manabii
  choice: kwa kumhukumu, walitimiza
  alternative: walipomhukumu, walitimiza
  rationale: Muundo wa “kwa” unahifadhi uwezekano wenye nguvu kwamba kitendo cha kumhukumu Yesu kilikuwa njia ambayo maneno ya kinabii yalitimizwa, bila kuingiza maelezo ya ziada ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wakazi,” “watawala,” na “kila Sabato” ni maneno ya sasa na ya kawaida. Mpangilio wa sentensi unahifadhi mfuatano na utegemeano wa vishiriki vya Kigiriki, na koma ya mwisho imeachwa kwa sababu mstari huu unaendelea katika mstari unaofuata.
