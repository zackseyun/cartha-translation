  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: sw
  text: Na ingawa hawakupata shtaka lolote lililostahili hukumu ya kifo[a], walimwomba Pilato aamuru auawe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sababu yoyote ya kustahili hukumu ya kifo,” au “msingi wowote wa kisheria wa hukumu ya kifo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “awekwe katika kifo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Inaendeleza mtiririko wa simulizi kwa kiunganishi cha kawaida bila kuongeza uzito wa kiufafanuzi.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: msingi wowote wa kumhukumu kifo
  rationale: Katika muktadha huu wa kisheria, αἰτία ni msingi au sababu inayoweza kuhalalisha hukumu, na θανάτου inaonyesha adhabu ya kifo. Kauli hii ni ya kawaida na iliyo wazi katika Kiswahili cha sasa.
- source_word: εὑρόντες
  choice: ingawa hawakupata
  rationale: 'Kishiriki hiki kimetangulia kitenzi kikuu, na muktadha unaonyesha maana ya kukubali hali iliyo kinyume na kitendo kilichofuata: licha ya kutopata msingi, waliomba auawe.'
- source_word: ᾐτήσαντο
  choice: walimwomba
  rationale: Kitenzi hiki humaanisha kuomba au kutoa ombi. Muundo wenye Pilato kama yambwa unafaa kwa Kiswahili cha simulizi na bado unaonyesha ombi lililoelekezwa kwa mwenye mamlaka.
- source_word: Πιλᾶτον
  choice: Pilato
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: aamuru auawe
  rationale: Katika mazingira ya mamlaka ya Kirumi na hukumu ya kifo, ἀναιρέω humaanisha kuua au kutekeleza hukumu ya kifo. 'Aamuru auawe' huonyesha kwa kawaida kwamba Pilato aliombwa atoe mamlaka ya kuuawa kwake, bila kudokeza kwamba angefanya tendo hilo mwenyewe.
theological_decisions:
- issue: Iwapo uhusiano wa kishiriki εὑρόντες uelezwe wazi kuwa wa hali inayokinzana
  choice: Na ingawa hawakupata msingi wowote wa kumhukumu kifo
  alternative: Na baada ya kutopata msingi wowote wa kumhukumu kifo
  rationale: 'Ingawa muundo wa Kigiriki unaweza kusomwa kimazingira au kitemporal, muktadha unaonyesha mvutano wazi: waliomba auawe licha ya kutopata msingi wa hukumu ya kifo. ''Ingawa'' huhifadhi mvutano huo bila kuongeza fundisho la kidhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Lugha ya kisheria imewasilishwa kwa maneno yanayoeleweka kwa wasomaji wa kawaida; alama zote za tanbihi zimewekwa katika matini.
