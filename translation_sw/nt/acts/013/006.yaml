  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: sw
  text: Nao, baada ya kukipitia kisiwa chote mpaka Pafo, walimkuta mtu fulani, mchawi, nabii wa uongo, na Myahudi, jina lake Bar-Yesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Bar-Yesu linaweza pia kuandikwa BarYesu. Huenda ni jina la Kisemiti lenye maana ya “mwana wa Yesu” au “mwana wa Yoshua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντες
  choice: Baada ya kupita
  rationale: Kirai cha hali cha wakati uliopita kinatangulia tendo kuu εὗρον; “baada ya kupita” kinaonyesha tendo lililotangulia bila kuongeza namna ya safari.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno maalumu)
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Mtiririko wa Kiswahili ni wa kawaida bila kuongeza “lakini,” ambako kungeleta utofautishaji usiokusudiwa.
- source_word: ὅλην τὴν νῆσον
  choice: katika kisiwa chote
  rationale: Huhifadhi wazo la kukipitia kisiwa kwa upana wake wote kwa Kiswahili cha kawaida.
- source_word: ἄχρι Πάφου
  choice: mpaka Pafo
  rationale: ἄχρι huonyesha mwisho wa safari; “mpaka” ni usemi wa kawaida wa kijiografia. Jina Πάφος limetoholewa kuwa Pafo.
- source_word: εὗρον
  choice: walimkuta
  rationale: “Walimkuta” ni simulizi la kawaida na huhifadhi maana ya kukutana naye au kumpata bila kudokeza kwamba walikuwa wakimtafuta.
- source_word: ἄνδρα τινὰ
  choice: mtu fulani
  rationale: “Fulani” huhifadhi hali ya kutotajwa wazi pamoja na nguvu ndogo ya kumtambulisha mtu mahususi.
- source_word: μάγον
  choice: mchawi
  rationale: Katika muktadha huu μάγος humaanisha mtendaji wa uchawi. “Mchawi” ni neno linaloeleweka kwa urahisi na halihitaji istilahi ngeni kama “magi.”
- source_word: ψευδοπροφήτην
  choice: nabii wa uongo
  rationale: Tafsiri hii wazi huhifadhi dai lake la kuwa nabii na hukumu ya maandishi kwamba alikuwa wa uongo.
- source_word: Ἰουδαῖον
  choice: ambaye alikuwa Myahudi
  rationale: Neno hili linamtambulisha mtu huyo kuwa Myahudi; kishazi hiki ni cha asili katika Kiswahili na kinaweka sifa hiyo tofauti na kazi zake.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: jina lake Bar-Yesu
  rationale: Nahau hii imetolewa kwa Kiswahili cha kawaida. Jina limetoholewa badala ya kutafsiriwa, na kistari kinaonyesha muundo wa jina la Kisemiti.
theological_decisions:
- issue: Utoaji wa jina Βαριησοῦ
  choice: Bar-Yesu
  alternative: BarYesu; mwana wa Yesu; mwana wa Yoshua
  rationale: Maandishi yanatumia jina binafsi, kwa hiyo limetoholewa badala ya kutafsiri maana yake. Kistari husaidia kuonyesha kipashio cha Kisemiti “Bar,” lakini tanbihi inahifadhi uwezekano wa kuliandika kwa kuunganisha na maana inayowezekana ya jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Orodha ya sifa za mtu huyo imetolewa kwa vifungu vya kawaida vya Kiswahili huku uhusiano wa kisarufi wa Kigiriki ukihifadhiwa.
