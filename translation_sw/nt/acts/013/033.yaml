  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: sw
  text: 'kwamba Mungu ametimiza jambo hili kwa ajili ya watoto wetu[a] kwa kumwinua Yesu[b], kama ilivyoandikwa pia katika Zaburi ya pili:


    “Wewe ni Mwanangu;

    mimi nimekuzaa leo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sisi, watoto wao.” Baadhi ya hati zina “watoto wetu,” na nyingine zinaunga mkono “sisi, watoto wao.”
    reason: textual_variant
  - marker: b
    text: Au, “kwa kumfufua Yesu kutoka kwa wafu.” Kiyunani kinaweza pia kumaanisha kumwinua kwa maana ya kumleta au kumweka rasmi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: amewatimizia
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililokamilika lenye matokeo yanayoendelea; ‘amewatimizia’ ni Kiswahili cha kawaida na kinadumisha wazo la Mungu kutimiza ahadi.
- source_word: ταύτην
  choice: jambo hili
  rationale: Kiwakilishi hiki kinarejelea ahadi iliyotajwa katika muktadha uliotangulia. ‘Jambo hili’ ni cha kawaida katika Kiswahili bila kuingiza wazi nomino ‘ahadi’ ambayo haipo katika mstari huu.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: watoto wetu
  rationale: Hufuata matini iliyotolewa kwa karibu; ‘watoto’ pia inaweza kumaanisha wazao kulingana na muktadha. Tofauti ya matini inayotoa maana ‘sisi, watoto wao’ imehifadhiwa katika tanbihi.
- source_word: ἀναστήσας Ἰησοῦν
  choice: kwa kumwinua Yesu
  rationale: ‘Kumwinua’ hudumisha kwa kadiri inayowezekana mvutano kati ya Mungu kumleta au kumweka Yesu mbele na kumfufua kutoka kwa wafu, bila kuamua maana kimyakimya.
- source_word: γέγραπται
  choice: kama ilivyoandikwa
  rationale: Hii ni namna ya kawaida na yenye heshima ya kuanzisha nukuu ya Maandiko, huku ikidokeza kwamba yaliyoandikwa yanaendelea kuwa na mamlaka.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: katika Zaburi ya pili
  rationale: Hufuata mpangilio wa Kiyunani na ni Kiswahili cha kawaida.
- source_word: Υἱός μου εἶ σύ
  choice: Wewe ni Mwanangu
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi utambulisho wenye mkazo wa mwana.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: mimi nimekuzaa leo
  rationale: ‘Nimekuzaa’ ni tafsiri ya moja kwa moja ya γεννάω na inadumisha uzito wa kifasihi na kiteolojia wa Zaburi 2:7 bila kuongeza ufafanuzi wa kiimani.
theological_decisions:
- issue: Maana ya ἀναστήσας Ἰησοῦν katika muktadha huu
  choice: kwa kumwinua Yesu
  alternative: kwa kumfufua Yesu kutoka kwa wafu; kwa kumleta au kumweka Yesu mbele
  rationale: Muktadha mpana unahusu ufufuo, lakini kitenzi hiki katika Matendo kinaweza pia kutumiwa kuhusu Mungu kumleta au kumweka kiongozi mbele. Tafsiri kuu inadumisha mvutano huo, na tanbihi inaeleza uwezekano huo.
- issue: Nguvu ya kikristo ya ‘mimi nimekuzaa leo’
  choice: Nukuu imetafsiriwa moja kwa moja bila ufafanuzi wa ziada
  alternative: Kufafanua kama kutawazwa, kuwekwa rasmi kuwa Mwana, au kuthibitishwa kwa ufufuo
  rationale: Nukuu ya Zaburi 2:7 haipaswi kupanuliwa katika tafsiri ili kuamua mjadala wa kiteolojia; maneno yake na mvutano wake vimehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa nukuu umewekwa kishairi, na alama zote za tanbihi zimetokea katika matini kuu.
