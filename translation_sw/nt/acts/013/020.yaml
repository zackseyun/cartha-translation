  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: sw
  text: Kwa takriban miaka mia nne na hamsini[a]. Na baada ya hayo, akawapa waamuzi mpaka wakati wa nabii Samweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, katika tafsiri nyingine, kirai hiki cha wakati huunganishwa kwa namna tofauti: “akawapa waamuzi kwa takriban miaka mia nne na hamsini, mpaka wakati wa nabii Samweli.” Matini ya Kigiriki na uakifishaji wake hapa vinajadiliwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: karibu
  rationale: Ikiwa pamoja na idadi, ὡς huonyesha kwamba idadi hiyo ni ya kukadiria, si hesabu kamili.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: miaka mia nne na hamsini
  rationale: Kirai cha hali ya kutoa kinaonyesha muda; tafsiri hii huhifadhi idadi kwa Kiswahili cha kawaida.
- source_word: καὶ μετὰ ταῦτα
  choice: Baada ya hayo
  rationale: Hutambulisha hatua inayofuata katika simulizi; 'hayo' huhifadhi maana ya kiwakilishi cha wingi bila kufanya sentensi kuwa nzito.
- source_word: ἔδωκεν
  choice: akawapa
  rationale: Huhifadhi maana ya msingi ya δίδωμι, 'kutoa/kupa,' na mtindo wa kibiblia unaoonyesha kwamba Mungu aliwapatia watu waamuzi.
- source_word: κριτὰς
  choice: waamuzi
  rationale: Ni istilahi ya kawaida ya kibiblia kwa viongozi wa Israeli wa kipindi kilichotangulia ufalme, na huhifadhi uhusiano na kitabu cha Waamuzi.
- source_word: ἕως
  choice: mpaka wakati wa
  rationale: Huonyesha kikomo cha kipindi hicho na ni wazi zaidi kwa Kiswahili hapa kuliko 'mpaka Samweli,' ambako huenda kukasikika kana kwamba Samweli ni mahali.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: nabii Samweli
  rationale: Ni mpangilio wa asili na wenye hadhi katika Kiswahili wa kumtambulisha Samweli kwa jukumu lake la kinabii.
theological_decisions:
- issue: Uhusiano wa kirai 'karibu miaka mia nne na hamsini' katika mstari wenye ugumu wa kimatini na kisintaksia
  choice: 'Kirai hicho kimetafsiriwa kama kauli ya muda inayojitegemea, kisha sentensi mpya inaanza: ''Baada ya hayo, akawapa waamuzi mpaka wakati wa nabii Samweli.'''
  alternative: Kuunganisha miaka mia nne na hamsini na muda ambao Mungu aliwapa Israeli waamuzi, mpaka nabii Samweli.
  rationale: Maandishi yaliyotolewa ya SBLGNT yanaweka kirai cha miaka kabla ya 'baada ya hayo.' Tafsiri inafuata mpangilio huo bila kuondoa utata halisi; uwezekano mwingine umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Waamuzi' limetumiwa kama istilahi inayotambulika ya kipindi cha historia ya Israeli. Mgawanyo usio wa kawaida wa sentensi umehifadhiwa kwa sababu unaakisi maandishi ya chanzo na utata wake.
