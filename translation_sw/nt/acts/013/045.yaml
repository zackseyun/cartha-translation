id: ACT.13.45
reference: Acts 13:45
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: sw
  text: Lakini Wayahudi walipoyaona makutano ya watu[a], walijawa na wivu[b], wakaanza kuyapinga maneno yaliyosemwa na Paulo[c], huku wakikufuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kundi la Wayahudi wa mahali hapo waliompinga Paulo katika tukio hili, si Wayahudi wote kwa ujumla.
    reason: cultural_note
  - marker: b
    text: Au, “walijawa na juhudi”; hapa muktadha unaunga mkono maana hasi, “wivu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mambo ambayo Paulo alikuwa akisema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: walipouona
  rationale: Kirai cha wakati kinaonyesha kwamba kuuona umati ndiko kulikotangulia na kuchochea tendo kuu; muundo huu ni wa kawaida katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi kinaonyesha mgeuko wa simulizi kutoka mwitikio mzuri uliotangulia kwenda upinzani.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Neno la Kigiriki linawataja Wayahudi bila kuwabainisha kuwa viongozi; tanbihi inaweka wazi kwamba hapa ni kundi la mahali hapo katika tukio hili, si Wayahudi wote.
- source_word: τοὺς ὄχλους
  choice: umati wa watu
  rationale: Ingawa Kigiriki kina wingi, katika Kiswahili 'umati wa watu' ni usemi wa kawaida wa kueleza mkusanyiko mkubwa unaoonekana katika tukio hili.
- source_word: ἐπλήσθησαν ζήλου
  choice: walijawa na wivu
  rationale: ζῆλος inaweza kuwa juhudi au wivu; muktadha wa kupinga na kukufuru unaunga mkono maana hasi ya wivu, huku 'walijawa na' ikihifadhi taswira ya Kigiriki.
- source_word: ἀντέλεγον
  choice: wakaanza kuyapinga
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoanza na kuendelea; 'wakaanza' huleta mwanzo huo wa upinzani kwa Kiswahili cha kawaida.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: maneno yaliyosemwa na Paulo
  rationale: Huhifadhi mtazamo wa maudhui pamoja na muundo wa kutendwa, bila kufanya Kiswahili kuwa kizito.
- source_word: βλασφημοῦντες
  choice: huku wakikufuru
  rationale: Kirai hiki kinaonyesha tendo lililoandamana na kupinga. 'Kukufuru' huhifadhi uzito wa neno bila kubainisha kimabavu mlengwa ambaye Kigiriki hakumtaji.
theological_decisions:
- issue: Uwezekano wa kuelewa οἱ Ἰουδαῖοι kama hukumu dhidi ya Wayahudi wote
  choice: Wayahudi
  alternative: viongozi wa Kiyahudi; Wayudea
  rationale: Tafsiri inahifadhi jina lililo wazi katika maandishi bila kulibana kuwa viongozi pekee. Tanbihi inazuia kulipanua kimakosa liwahusu Wayahudi wote badala ya kundi maalumu katika tukio hili.
- issue: Maana ya ζῆλος
  choice: wivu
  alternative: juhudi
  rationale: Neno linaweza kuwa na maana chanya au hasi, lakini kuona umati kisha kupinga na kukufuru kunaelekeza kwenye maana hasi; tanbihi inahifadhi uwezekano wa kileksika.
- issue: Mlengwa wa βλασφημοῦντες
  choice: wakikufuru
  alternative: wakitukana; wakisema maneno ya kufuru dhidi ya ujumbe au Mungu
  rationale: Maandishi hayataji mlengwa moja kwa moja. Tafsiri haiingizi kwa lazima kwamba walimkufuru Mungu, Paulo, au ujumbe, hivyo inadumisha utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni mwepesi kwa msomaji wa kawaida, huku tanbihi zikihifadhi upeo wa kileksika na kuzuia uelewaji mpana wa kupinga Wayahudi.
