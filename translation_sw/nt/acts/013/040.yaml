  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: sw
  text: 'Kwa hiyo, jihadharini, yasije yakawapata yale yaliyosemwa katika Manabii[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘kupitia manabii.’ Kigiriki kinasema ‘katika Manabii,’ huenda kikirejelea maandiko ya kinabii kuwa mahali ambapo onyo hili linapatikana.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: jihadharini
  rationale: Kitenzi cha amri kwa wingi kinatoa onyo la haraka. ‘Jihadharini’ ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na tangazo na onyo lililotangulia.
- source_word: μὴ ἐπέλθῃ
  choice: yasije yakawapata
  rationale: Muundo huu wa Kiswahili unaendeleza onyo la Kigiriki la jambo lisitokee na pia wazo la hukumu kuwajia au kuwapata wasikilizaji.
- source_word: τὸ εἰρημένον
  choice: yale yaliyosemwa
  rationale: 'Unawakilisha kishiriki timilifu cha kutendwa kilichotumika kama nomino: jambo lililonenwa ambalo bado lina nguvu. Wingi wa kisarufi wa Kiswahili unarejelea yaliyomo katika onyo bila kulazimisha kuwa kulikuwa na kauli nyingi tofauti.'
- source_word: ἐν τοῖς προφήταις
  choice: katika Manabii
  rationale: Inadumisha kihusishi ‘katika’ na kuelekeza kwa sehemu ya Maandiko inayojulikana kama Manabii, bila kubadili waziwazi maana kuwa chombo cha usemi (‘na manabii’).
theological_decisions:
- issue: Rejeo la ‘Manabii’
  choice: Maandiko ya kinabii kama mkusanyo
  alternative: manabii wenyewe kama wanenaji
  rationale: Muktadha unaongoza moja kwa moja kwenye nukuu ya Habakuki. ‘Katika Manabii’ huhifadhi rejeo la kimaandiko na pia namna isiyo ya kawaida kidogo ya usemi wa Kigiriki, bila kufuta kabisa uwezekano wa kuwafikiria waandishi wa kinabii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Jihadharini’ ni onyo la moja kwa moja kwa kundi; ‘yasije yakawapata’ ni muundo wa kawaida unaohifadhi nguvu ya tahadhari. Herufi kubwa katika ‘Manabii’ inaashiria sehemu ya Maandiko.
