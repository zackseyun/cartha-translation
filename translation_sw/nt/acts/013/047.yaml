  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: sw
  text: 'Kwa maana hivi ndivyo Bwana alivyotuamuru: “Nimekuweka kuwa nuru kwa mataifa[a], ili uwe kwa ajili ya wokovu hadi sehemu ya mbali kabisa ya dunia[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwe nuru kwa watu wa mataifa mengine.” Neno la Kigiriki linaweza kumaanisha “mataifa” au, katika miktadha mingi, “watu wasio Wayahudi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hadi miisho ya dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: hivi ndivyo
  rationale: Kauli hii ya kawaida ya Kiswahili inaonyesha namna na msingi wa tendo linalotajwa, huku ikihifadhi nguvu ya kuhitimisha ya neno la Kigiriki.
- source_word: ἐντέταλται
  choice: alivyotuamuru
  rationale: Kitenzi hiki kinaonyesha amri yenye mamlaka ambayo bado ina nguvu. Muundo huu ni wa asili katika Kiswahili baada ya “hivi ndivyo.”
- source_word: ὁ κύριος
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la kibiblia kwa κύριος na hapa linamtaja msemaji wa kimungu katika Maandiko yaliyonukuliwa.
- source_word: Τέθεικά σε
  choice: Nimekuweka
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuwekwa au kuteuliwa ambako matokeo yake yanaendelea. “Nimekuweka” ni sahihi na ya kawaida.
- source_word: εἰς φῶς ἐθνῶν
  choice: uwe nuru kwa mataifa
  rationale: Muundo huu unaonyesha kusudi au uteuzi, na “mataifa” huhifadhi maana pana ya jamii za watu huku uwezekano wa kumaanisha watu wasio Wayahudi ukielezwa katika tanbihi.
- source_word: τοῦ εἶναί σε
  choice: ili uwe
  rationale: Muundo wa infinitivu unaeleza kusudi au matokeo; “ili uwe” unatoa maana hiyo wazi na kwa Kiswahili cha kawaida.
- source_word: εἰς σωτηρίαν
  choice: kwa ajili ya wokovu
  rationale: Tafsiri hii huhifadhi usemi mfupi wa Kigiriki bila kuamua kimafafanuzi kama mhusika ndiye wokovu wenyewe au ni chombo cha kuufikisha.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: hadi sehemu ya mbali kabisa ya dunia
  rationale: Usemi huu unaonyesha sehemu ya mwisho au ya mbali kabisa ya dunia. Tafsiri hii huepuka uwezekano wa “mwisho wa dunia” kueleweka kama mwisho wa nyakati.
theological_decisions:
- issue: Mhusika anayelengwa na jinsi nukuu ya Isaya inavyotumiwa kwa Paulo na Barnaba
  choice: Kudumisha umoja wa “-ku-” katika nukuu bila kufafanua mhusika ni nani
  alternative: Kuibadili nukuu ili iwataje moja kwa moja mitume kwa wingi au kumtambulisha wazi mtumishi anayesemeshwa
  rationale: Kigiriki kinanukuu Maandiko moja kwa moja kwa umoja na hakifafanui uhusiano wa kiteolojia kati ya maandishi kuhusu mtumishi na utume wa Paulo na Barnaba. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa nukuu umeachwa kwa umoja kama ulivyo katika Kigiriki, na alama zote za tanbihi zimewekwa mahali pake katika matini.
