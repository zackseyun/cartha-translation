  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: sw
  text: Sabato iliyofuata[a], takriban watu wote wa mji walikusanyika ili kulisikia neno la Bwana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sabato inayokuja.”
    reason: lexical_alternative
  - marker: b
    text: “Neno la Bwana” linaweza pia kueleweka kuwa “ujumbe wa Bwana” au, kulingana na muktadha, “ujumbe unaomhusu Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: Sabato iliyofuata
  rationale: Muundo wa wakati wenye ἐρχομένῳ unaonyesha Sabato iliyokuwa inakuja au iliyofuata. “Sabato iliyofuata” ni Kiswahili cha kawaida na kinaeleza wakati huo bila kuongeza ufafanuzi usio katika maandishi.
- source_word: σχεδὸν
  choice: karibu
  rationale: σχεδόν humaanisha “karibu” au “takriban”; hapa “karibu” huendana kwa kawaida na wingi wa watu.
- source_word: πᾶσα ἡ πόλις
  choice: watu wote wa mjini
  rationale: Kirai hiki kinarejelea wakazi wa mji kwa ujumla kwa usemi wenye msisitizo, si lazima kila mtu mmoja mmoja. Kutaja “watu” huepuka kueleweka kana kwamba majengo ya mji yalikusanyika, huku “karibu” ikihifadhi mpaka uliowekwa na σχεδόν.
- source_word: συνήχθη
  choice: walikusanyika
  rationale: Kitenzi hiki kinaonyesha watu kukutana au kukusanyika pamoja; “walikusanyika” ni usemi wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: ἀκοῦσαι
  choice: ili kulisikia
  rationale: Kitenzi-jina kinaonyesha kusudi la kukusanyika. “Ili kulisikia” huweka wazi kusudi hilo na kiambishi “-li-” kinarejelea neno.
- source_word: τὸν λόγον
  choice: neno
  rationale: λόγος inaweza kumaanisha neno au ujumbe. “Neno” huhifadhi istilahi inayojirudia katika Matendo na haifafanui kupita kiasi.
- source_word: τοῦ κυρίου
  choice: la Bwana
  rationale: Hili ni badiliko la kawaida la umilikaji katika Kiswahili kwa muundo wa Kigiriki, huku “Bwana” likihifadhi jina la cheo κύριος.
theological_decisions:
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ndiyo tafsiri ya kawaida, yenye heshima, ya κύριος katika muktadha huu na haibani utambulisho wa mhusika zaidi ya maandishi yenyewe.
- issue: Maana ya τὸν λόγον τοῦ κυρίου
  choice: neno la Bwana
  alternative: ujumbe wa Bwana; ujumbe unaomhusu Bwana
  rationale: Muundo wa umilikaji unaweza kuonyesha neno linalotoka kwa Bwana, lililo lake, au linalomhusu. “Neno la Bwana” huhifadhi mwingiliano huo wa maana badala ya kuamua maana moja kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “watu wote wa mjini” ili kuwasilisha maana ya wakazi wa mji kwa lugha ya kawaida, na imehifadhi usemi wa kitheolojia “neno la Bwana” pamoja na utata wake halisi.
