  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: sw
  text: Mungu wa watu hawa, yaani Israeli, aliwachagua baba zetu[a], akawainua watu hao walipokuwa wakiishi kama wageni katika nchi ya Misri, kisha akawatoa humo kwa mkono ulioinuliwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mababu zetu.” Kigiriki: “baba zetu.”'
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kwa mkono ulioinuliwa”; ni usemi wa simulizi la Kutoka unaoonyesha ukombozi wa Mungu kwa nguvu.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: Mungu wa watu hawa, yaani Israeli
  rationale: Huhifadhi Israeli kama jina linalofafanua 'watu hawa' na kufanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili.
- source_word: ἐξελέξατο τοὺς πατέρας ἡμῶν
  choice: aliwachagua baba zetu
  rationale: Hutafsiri kitenzi moja kwa moja na kuhifadhi neno la kiume πατέρας; 'mababu zetu' pia linawezekana, lakini 'baba zetu' linabaki karibu zaidi na umbo la Kigiriki.
- source_word: ὕψωσεν
  choice: akawafanya watu hao kuwa wengi na wenye nguvu
  rationale: Katika muktadha wa Israeli huko Misri, kitenzi kinaweza kuhusisha kuongezeka au kuinuliwa. Usemi huu wa Kiswahili ni wa asili huku tanbihi ikihifadhi uwezekano mwingine wa maana.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: walipokuwa wakiishi kama wageni katika nchi ya Misri
  rationale: Hueleza wazi παροικία kuwa kukaa katika nchi ya kigeni bila kutumia neno lisilo la kawaida kwa wasomaji wengi.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: kwa mkono ulioinuliwa
  rationale: Huhifadhi sitiari ya kibiblia inayomaanisha tendo la Mungu la ukombozi lenye nguvu.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: akawatoa humo
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuwatoa watu Misri; 'humo' hurejelea wazi nchi ya Misri.
theological_decisions:
- issue: Utambulisho wa mababu wa Israeli
  choice: baba zetu
  alternative: mababu zetu
  rationale: Kigiriki kinasema πατέρας, 'baba'; tafsiri hiyo huhifadhi umbo la asili bila kuficha kwamba inawarejelea waliotangulia katika historia ya agano.
- issue: Maana ya ὕψωσεν huko Misri
  choice: akawafanya watu hao kuwa wengi na wenye nguvu
  alternative: akawainua watu hao
  rationale: Kitenzi kinaweza kueleza kuongezeka, kufanywa wakuu, au kuinuliwa. Matini kuu inaonyesha kufanikiwa kwao bila kuifunga maana kwa hadhi pekee, na tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtiririko wa hotuba ya kihistoria, huepuka msamiati wa kimadhehebu, na kuweka sitiari ya mkono huku ikifafanuliwa kwa tanbihi.
