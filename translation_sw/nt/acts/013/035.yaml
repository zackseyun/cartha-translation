  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: sw
  text: Kwa hiyo, pia anasema katika zaburi nyingine[a], “Hutamwacha Mtakatifu wako[b] aone uozo[c].”
  philosophy: optimal-equivalence
  footnotes:
