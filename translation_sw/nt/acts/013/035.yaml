lexical_decisions:
- source_word: διότι
  choice: Kwa hiyo
  rationale: Katika muktadha huu neno linaunganisha dondoo hili na hoja iliyotangulia kwa kuonyesha hitimisho; “Kwa hiyo” ni Kiswahili cha kawaida na wazi.
- source_word: καὶ
  choice: pia
  rationale: Linaonyesha kwamba ushahidi mwingine wa Maandiko unaongezwa kwenye ule uliotangulia.
- source_word: ἐν ἑτέρῳ
  choice: katika zaburi nyingine
  rationale: Kiyunani kinasema kihalisi “katika nyingine” bila kutaja nomino. Kwa kuwa dondoo linatoka Zaburi 16, “zaburi” inawekwa wazi katika matini kwa uelewekaji, huku uwezekano wa “mahali pengine” ukihifadhiwa katika tanbihi.
- source_word: λέγει
  choice: anasema
  rationale: Wakati uliopo wa Kiyunani umehifadhiwa. Kiima hakijatajwa wazi; “anasema” hakilazimishi kukitaja kwa jina.
- source_word: Οὐ δώσεις
  choice: Hutamwacha
  rationale: δίδωμι pamoja na kitenzi-jina hapa ina maana ya kuruhusu. “Hutamwacha” ni usemi wa asili unaobeba maana hiyo katika Kiswahili.
- source_word: τὸν ὅσιόν σου
  choice: Mtakatifu wako
  rationale: ὅσιος inaweza kumaanisha aliye mtakatifu, mwaminifu, au mcha Mungu. Katika hoja ya Paulo dondoo linamhusu Yesu, hivyo “Mtakatifu wako” linafaa huku maana mbadala ikitambuliwa.
- source_word: ἰδεῖν
  choice: aone
  rationale: Tafsiri ya moja kwa moja ya kitenzi ni “kuona”; usemi huo wa kimajazi umehifadhiwa badala ya kufafanua kuwa “apatwe na.”
- source_word: διαφθοράν
  choice: uozo
  rationale: Katika muktadha wa kifo na ufufuo, neno linamaanisha kuoza kwa mwili. “Uozo” ni neno la kisasa na wazi; maana pana ya “uharibifu” inawekwa katika tanbihi.
theological_decisions:
- issue: Rejeo la kimasiya/Kikristo katika τὸν ὅσιόν σου
  choice: Mtakatifu wako
  alternative: mwaminifu wako; mtakatifu wako
  rationale: Paulo analitumia dondoo hili kumhusu Yesu na ufufuo wake. Herufi kubwa inaonyesha rejeo hilo la kimuktadha bila kubadili maana ya msingi ya neno, huku “mwaminifu wako” ikibaki kuwa uwezekano wa kileksia.
- issue: Nomino iliyodokezwa baada ya ἐν ἑτέρῳ
  choice: zaburi nyingine
  alternative: mahali pengine; kifungu kingine
  rationale: Chanzo hakitaji nomino, lakini dondoo hili linatoka katika Zaburi. Kutaja “zaburi” kunasaidia msomaji bila kuficha kwamba Kiyunani chenyewe kinasema tu “katika nyingine.”
- issue: Kiima kisichotajwa cha λέγει
  choice: anasema
  alternative: Maandiko yanasema; Mungu anasema
  rationale: Kiyunani hakitaji kiima wazi. Tafsiri inaacha utata huo badala ya kuamua kimyakimya kama msemaji ni Mungu au Maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa dondoo la Maandiko umehifadhiwa, na tanbihi zinaonyesha ellipsisi ya Kiyunani na upana wa maana ya διαφθορά.
