  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: sw
  text: 'Na kwamba alimfufua kutoka kwa wafu, hatarejea tena katika kuoza, amesema hivi: “Nitawapa baraka takatifu na za hakika za Daudi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya jadi, “rehema za hakika za Daudi.” Kirai hiki cha Kigiriki kinarejelea Isaya 55:3 na kinaashiria baraka au ahadi takatifu na za kutegemewa za agano zinazohusishwa na Daudi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: alimfufua kutoka kwa wafu
  rationale: Katika muktadha huu kitenzi pamoja na ‘kutoka kwa wafu’ kinamaanisha ufufuo; ‘alimfufua’ ni usemi wa kawaida wa Kiswahili unaoonyesha wazi tendo la Mungu.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: asirudie tena
  rationale: Huwasilisha kwamba baada ya kufufuliwa hatarudi tena katika hali inayotajwa, kwa Kiswahili cha kawaida bila kufanya usemi wa Kigiriki wa μέλλω kuwa mzito isivyohitajika.
- source_word: διαφθοράν
  choice: kuoza
  rationale: Katika muktadha wa ufufuo neno hili linahusu kuharibika au kuoza kwa mwili, si upotovu wa maadili.
- source_word: οὕτως εἴρηκεν
  choice: amesema hivi
  rationale: Wakati timilifu wa Kigiriki unaonyesha neno la Maandiko lililonenwa na lenye nguvu inayoendelea; ‘amesema hivi’ ni utangulizi wa nukuu ulio wa asili katika Kiswahili.
- source_word: Δώσω ὑμῖν
  choice: Nitawapa
  rationale: Ni ahadi ya wakati ujao kwa wingi; kiambishi ‘-wa-’ kinaonyesha kwa kawaida kwamba wanaoambiwa ni wengi.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: baraka takatifu na za hakika za Daudi
  rationale: Kirai hiki kigumu, kinachonukuu Isaya 55:3, kinataja mema matakatifu na yenye kutegemewa yanayohusishwa na agano la Daudi. ‘Baraka’ huwasilisha wingi wa vitu au mema hayo kwa Kiswahili kinachoeleweka, huku ‘za Daudi’ ikihifadhi uhusiano wenyewe bila kuamua kimya-kimya kama ni baraka alizopewa Daudi au zilizoahidiwa kupitia kwake.
theological_decisions:
- issue: Maana ya τὰ ὅσια Δαυὶδ τὰ πιστά katika nukuu ya Isaya 55:3
  choice: baraka takatifu na za hakika za Daudi
  alternative: rehema za Daudi zilizo za hakika; ahadi takatifu na za hakika alizopewa Daudi
  rationale: Kirai cha Kigiriki ni cha mkato na kinaweza kueleweka kama rehema, baraka, au ahadi za agano zinazohusishwa na Daudi. Tafsiri iliyochaguliwa inaonyesha utakatifu na uhakika wake bila kuingiza ufafanuzi mwembamba wa kimadhehebu; tanbihi inahifadhi tafsiri nyingine ya jadi na kueleza mwangwi wa agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kuoza’ huepuka maana ya kimaadili ambayo ‘uharibifu’ ingeweza kudokeza, na muundo wa nukuu umewekwa mfupi na wa asili.
