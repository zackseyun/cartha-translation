lexical_decisions:
- source_word: καὶ
  choice: Nasi
  rationale: Kiunganishi καὶ pamoja na kiwakilishi cha msisitizo ἡμεῖς kimetafsiriwa kwa muundo wa asili wa Kiswahili “Nasi,” unaounganisha sentensi na yaliyotangulia huku ukionyesha tofauti au msisitizo wa kundi la wasemaji.
- source_word: ἡμεῖς
  choice: Nasi
  rationale: Kiwakilishi kilichotajwa wazi kina msisitizo; kiambishi “-si” katika “Nasi” kinawakilisha maana ya “sisi pia/sisi kwa upande wetu” bila kutumia usemi mzito usio wa kawaida.
- source_word: ὑμᾶς
  choice: tunawahubiria
  rationale: Yule anayeambiwa habari amewakilishwa kwa kiambishi cha yambwa “-wa-” katika kitenzi, njia ya kawaida ya Kiswahili ya kusema kuwa habari njema inahubiriwa kwao.
- source_word: εὐαγγελιζόμεθα
  choice: tunahubiria habari njema
  rationale: Muundo huu unahifadhi maana ya kutangaza habari njema kwa uwazi na kwa lugha ya kawaida, bila kupunguza kitenzi kuwa istilahi pekee ya kidini.
- source_word: τὴν ... ἐπαγγελίαν
  choice: kuhusu ahadi
  rationale: Ahadi ndiyo maudhui ya habari njema inayotangazwa. “Kuhusu” huleta Kiswahili cha asili zaidi kuliko kuifanya “ahadi” kuwa yambwa ya moja kwa moja ya “hubiri,” huku ikihifadhi uhusiano wa kisarufi na wa maana.
- source_word: πρὸς τοὺς πατέρας
  choice: kwa baba zetu
  rationale: “Baba zetu” ni usemi wa kawaida wa kibiblia na wa kihistoria wa agano unaorejelea mababu wa Israeli. Ingawa “zetu” haijaandikwa moja kwa moja katika Kigiriki, muktadha wa hotuba kwa Waisraeli na matumizi ya Kiswahili hufanya maana hiyo iwe wazi; mbadala wa moja kwa moja zaidi umeelezwa katika tanbihi.
- source_word: γενομένην
  choice: iliyotolewa
  rationale: Kitenzi-shirikishi kinaeleza ahadi iliyofanywa au kutolewa kwa mababa. “Iliyotolewa” ni Kiswahili sanifu na haiongezi wazo la kutimizwa, ambalo linaelezwa katika mstari unaofuata.
theological_decisions:
- issue: Utafsiri wa πατέρες
  choice: baba zetu
  alternative: mababu; baba
  rationale: Neno la Kigiriki ni la kiume na katika muktadha huu ni rejeleo la kihistoria la agano kwa watangulizi wa Israeli. “Baba zetu” huhifadhi taswira hiyo katika Kiswahili cha kibiblia, huku “mababu” ikiwa tafsiri laini zaidi inayoweza kujumuisha maana ya wahenga.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nasi” huunganisha sentensi na muktadha na kubeba msisitizo wa ἡμεῖς; “habari njema” huepuka kutegemea istilahi ya kikanisa pekee.
