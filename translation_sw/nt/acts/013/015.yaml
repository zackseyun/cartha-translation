  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: sw
  text: Baada ya kusomwa kwa Sheria na Manabii, viongozi wa sinagogi waliwatumia ujumbe wakisema, “Ndugu[a], ikiwa miongoni mwenu kuna ujumbe wowote wa kuwatia moyo[b] watu, semeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “Wanaume, ndugu,” namna ya heshima na ya kifamilia ya kuwahutubia wanaume.'
    reason: lexical_alternative
  - marker: b
    text: Au “ujumbe wa kuwahimiza.” Neno la Kigiriki linaweza kumaanisha kutia moyo au kuhimiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: kusomwa
  rationale: Katika ibada ya sinagogi, neno hili linarejelea kusomwa kwa Maandiko kwa sauti mbele ya kusanyiko. Kauli tendwa ni ya asili katika Kiswahili hapa.
- source_word: νόμου καὶ τῶν προφητῶν
  choice: Sheria na Manabii
  rationale: Majina haya yanaonyesha sehemu mbili zinazotambulika za Maandiko ya Kiyahudi, kwa hiyo yameandikwa kwa herufi kubwa.
- source_word: ἀρχισυνάγωγοι
  choice: viongozi wa sinagogi
  rationale: Hawa ni maofisa waliosimamia shughuli za sinagogi; ‘viongozi’ ni wazi na haidokezi utawala wa kiraia.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς λέγοντες
  choice: waliwatumia ujumbe wakisema
  rationale: Muundo huu unaonyesha kuwa viongozi waliwasiliana nao kwa ujumbe; tafsiri hii ni ya kawaida katika Kiswahili na inaunganisha usemi unaofuata.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ndugu
  rationale: Ni namna ya heshima na ya kifamilia ya kuwaambia wanaume waliokuwa wageni. ‘Ndugu’ ni ya kawaida, huku tanbihi ikihifadhi umbo kamili la Kigiriki.
- source_word: λόγος παρακλήσεως
  choice: ujumbe wowote wa kuwatia moyo
  rationale: παράκλησις inaweza kumaanisha kutia moyo au kuhimiza. Usemi huu ni wa kawaida na unabaki mpana bila kufuta uwezekano wa himizo.
- source_word: πρὸς τὸν λαόν
  choice: watu
  rationale: Katika muktadha huu watu ndio walengwa wa ujumbe; ‘kuwatia moyo watu’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: λέγετε
  choice: semeni
  rationale: Amri ya wingi inawaalika Paulo na wenzake kulihutubia kusanyiko.
theological_decisions:
- issue: Wanaolengwa na salamu ya Ἄνδρες ἀδελφοί
  choice: Ndugu
  alternative: Ndugu zangu, wanaume
  rationale: Kigiriki kina umbo la kiume na katika muktadha viongozi wanawaalika Paulo na wenzake waseme. Tafsiri haipanui salamu kuwa ‘ndugu wanaume na wanawake,’ lakini tanbihi inaeleza umbo la asili.
- issue: Maana ya παράκλησις
  choice: kuwatia moyo
  alternative: kuwahimiza
  rationale: Neno la Kigiriki linaweza kubeba maana zote mbili. Maandishi yanatumia usemi mpana wa kutia moyo, na tanbihi inahifadhi uwezekano wa himizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Sinagogi’ na majina ‘Sheria na Manabii’ yamehifadhiwa kwa usahihi wa mazingira ya Kiyahudi. Alama za tanbihi zimewekwa karibu na maneno yanayoelezwa, zikisahihisha kutolingana kwa nafasi za alama katika safu ya Kiingereza.
