  verdict: approve
  source_fidelity: Tafsiri inadumisha muundo wa wakati wa Ἐξιόντων kwa “Walipokuwa wakitoka,” na wakati usiotimilifu wa παρεκάλουν kwa “walikuwa wakisihi.” “Kwamba maneno haya yasemwe kwao” huwakilisha kwa uaminifu kauli tegemezi yenye infinitivu ya kutendwa λαληθῆναι, yambwa αὐτοῖς, na τὰ ῥήματα ταῦτα. “Sabato iliyofuata” ni tafsiri sahihi na ya kawaida ya εἰς τὸ μεταξὺ σάββατον.
  naturalness: Kiswahili ni sanifu, cha kisasa, na husomeka kwa urahisi. Matumizi ya “wakisihi” yana uzito unaofaa kwa ombi la dhati, bila kufanya kauli iwe ya kidhehebu au ya kifasiri kupita chanzo.
  terminology: “Maneno haya,” “yasemwe,” na “Sabato iliyofuata” ni istilahi sahihi na thabiti. Viwakilishi vya Kiswahili vinahifadhi utata wa αὐτῶν na αὐτοῖς bila kuwataja wahusika ambao SBLGNT haiwataji wazi katika matini kuu.
