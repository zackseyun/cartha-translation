  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: sw
  text: Walipokuwa wakitoka[a][b], walikuwa wakisihi kwamba maneno haya yasemwe kwao Sabato iliyofuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasema kwa uwazi zaidi, “Paulo na Barnaba walipokuwa wakitoka, watu waliwasihi kwamba maneno haya yasemwe kwao Sabato iliyofuata.”
    reason: textual_variant
  - marker: b
    text: Au, “Walipokuwa wakiondoka, walikuwa wakiomba kwamba mambo haya yasemwe kwao Sabato inayokuja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: Walipokuwa wakitoka
  rationale: Kirai huru cha uhusiano katika hali ya umilikishi chenye kitenzi-ambacho cha wakati wa sasa kinaelezwa kwa kishazi cha wakati; “wakitoa” huhifadhi hali ya tendo linaloendelea kuliko “walipoondoka.”
- source_word: δὲ
  choice: imejumuishwa katika kishazi cha wakati
  rationale: Hapa δέ ni kiunganishi hafifu; Kiswahili cha kawaida hakihitaji kiunganishi tofauti baada ya “Walipokuwa.”
- source_word: αὐτῶν
  choice: wa- (wao) katika “Walipokuwa”
  rationale: Kiambishi cha nafsi kinahifadhi rejeleo la kiwakilishi bila kuwataja Paulo na Barnaba au watu, kwa kuwa matini na muktadha vina utata wa rejeleo.
- source_word: παρεκάλουν
  choice: walikuwa wakisihi
  rationale: Wakati usiotimilifu unaonyesha ombi lililoendelea au lililorudiwa; “kusihi” huonyesha uzito wa ombi bila kufikia maana ya kuomba kwa unyenyekevu uliopitiliza.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: Sabato iliyofuata
  rationale: Kirai hiki cha wakati huelekea kumaanisha Sabato inayokuja au inayofuata; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: λαληθῆναι
  choice: yasemwe
  rationale: Huhifadhi umbo la kutendwa la kitenzi cha kusema na upatanisho wake na “maneno haya.”
- source_word: αὐτοῖς
  choice: kwao
  rationale: Huwakilisha yambwa lisilo la moja kwa moja kwa njia ya kawaida katika Kiswahili.
- source_word: τὰ ῥήματα ταῦτα
  choice: maneno haya
  rationale: Ni tafsiri ya karibu ya ῥήματα na inadumisha rejeleo kwa maneno yaliyokuwa yamesemwa katika ujumbe wa Paulo.
theological_decisions:
- issue: Rejeleo la viwakilishi katika mstari huu
  choice: Matini kuu inadumisha utata kwa kutumia viambishi na “kwao” bila kuwataja wahusika.
  alternative: Kusema wazi kwamba watu waliwasihi Paulo na Barnaba, au kwamba Paulo na Barnaba waliwasihi watu.
  rationale: Matini ya toleo hili haitaji wahusika kwa majina, na kuna tofauti ya kimatini na ya kifasiri kuhusu waliokuwa wakitoka na waliotoa ombi. Tafsiri haipaswi kutatua zaidi ya ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Wakisihi” huonyesha ombi la dhati; muundo wa viwakilishi umeachwa bila kubainishwa ili kuhifadhi utata wa Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
