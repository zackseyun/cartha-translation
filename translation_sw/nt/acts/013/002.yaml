  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: sw
  text: Walipokuwa wakimhudumia Bwana na kufunga[a], Roho Mtakatifu akasema, “Nitengeeni Barnaba na Sauli kwa ajili ya kazi ambayo nimewaita waifanye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokuwa wakimwabudu Bwana.” Kitenzi cha Kigiriki kinaweza kumaanisha huduma yenye nyongeza za ibada au liturujia.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: wakimhudumia
  rationale: Kitenzi hiki hueleza huduma inayotolewa kwa Bwana na kinaweza pia kuwa na maana ya ibada. ‘Wakimhudumia’ huhifadhi wazo la huduma ya kiibada bila kulifunga kwenye taratibu rasmi za liturujia.
- source_word: τῷ κυρίῳ
  choice: Bwana
  rationale: Kirai ‘wakimhudumia Bwana’ ni cha kawaida katika Kiswahili na huonyesha kwamba Bwana ndiye anayeelekezewa huduma hiyo.
- source_word: νηστευόντων
  choice: na kufunga
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo lililokuwa likiendelea sambamba na kumhudumia Bwana.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo neno la kawaida la Kiswahili, nalo linamhifadhi Roho Mtakatifu kuwa mtendaji anayesema katika sentensi.
- source_word: Ἀφορίσατε
  choice: Nitengeeni
  rationale: Amri hii ina maana ya kuwatenga watu kwa kusudi maalumu. Muundo ‘Nitengeeni’ pia huunganisha kwa kawaida wazo la μοι, ‘kwa ajili yangu,’ bila kuleta lugha ya kiufundi ya kuwekwa katika cheo.
- source_word: δή
  choice: —
  rationale: Chembe hii huongeza msisitizo au uharaka. Katika amri ya Kiswahili, nguvu yake inaeleweka kwa muktadha bila kuongeza neno ambalo lingeifanya kauli kuwa nzito au isiyo ya kawaida.
- source_word: μοι
  choice: -ni- katika ‘Nitengeeni’
  rationale: Kiambishi cha yambwa ‘-ni-’ kinaonyesha kwamba Barnaba na Sauli watengwe kwa ajili ya msemaji, yaani Roho Mtakatifu.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnaba na Sauli
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: εἰς τὸ ἔργον
  choice: kwa ajili ya kazi
  rationale: ‘Kazi’ huhifadhi upana wa ἔργον bila kuibana kuwa cheo, huduma rasmi, au aina maalumu ya utume.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: ambayo nimewaitia
  rationale: ‘Nimewaitia’ huonyesha mwito uliokwisha kutolewa lakini ambao athari na kusudi lake vinaendelea sasa, kulingana na hali timilifu ya kitenzi cha Kigiriki.
theological_decisions:
- issue: Maana ya λειτουργούντων katika mazingira ya ibada ya pamoja na kufunga
  choice: wakimhudumia Bwana
  alternative: walipokuwa wakimwabudu Bwana
  rationale: Neno la Kigiriki linaweza kujumuisha ibada, lakini si lazima lieleze ibada rasmi pekee. ‘Wakimhudumia Bwana’ huhifadhi maana za huduma na ibada kwa pamoja.
- issue: Roho Mtakatifu kama mhusika anayesema
  choice: Roho Mtakatifu akasema
  alternative: ujumbe wa Roho Mtakatifu ukatolewa
  rationale: Kigiriki humweka Roho Mtakatifu moja kwa moja kuwa kiima cha kitendo cha kusema; tafsiri haipaswi kuupunguza uhusika huo.
- issue: Nguvu ya ἀφορίσατε ... εἰς τὸ ἔργον
  choice: Nitengeeni ... kwa ajili ya kazi
  alternative: Waweke rasmi ... katika huduma
  rationale: Aya inaagiza kutengwa kwa ajili ya kazi maalumu, lakini haitumii wazi lugha ya kuwekwa wakfu katika cheo fulani cha kanisa. Tafsiri huepuka kuingiza muundo wa baadaye wa kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili na wenye uzito wa kimaandiko bila kutumia istilahi za kiufundi zisizohitajika. Uwezekano wa maana ya ‘kuabudu’ umehifadhiwa katika maelezo ya uamuzi wa kileksika badala ya tanbihi, kwa kuwa ‘wakimhudumia Bwana’ bado hubeba maana pana ya asili.
