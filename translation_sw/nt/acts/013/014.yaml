  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: sw
  text: Lakini wao wakaendelea na safari kutoka Perga, wakafika Antiokia ya Pisidia[a]. Siku ya Sabato wakaingia katika sinagogi, wakaketi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Antiokia ya Kipisidia.” Kigiriki kinasema “Antiokia ya Pisidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Lakini wao
  rationale: δέ inaonyesha mwendelezo wenye utofautishaji mdogo, huku kiwakilishi cha wazi αὐτοὶ kikihifadhiwa kwa 'wao' bila kukitia mkazo kupita kiasi.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: wakaendelea kutoka Perga
  rationale: διέρχομαι katika simulizi hili la safari inaonyesha kusonga mbele kutoka mahali fulani; 'wakaendelea kutoka' ni Kiswahili cha asili kinachodumisha wazo la safari inayoendelea.
- source_word: παρεγένοντο
  choice: wakafika
  rationale: παραγίνομαι katika muktadha wa safari humaanisha kufika mahali; 'wakafika' ni fupi na ya kawaida.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Antiokia ya Pisidia
  rationale: Muundo huu unatambulisha Antiokia kwa kuihusianisha na eneo la Pisidia. Kiswahili 'Antiokia ya Pisidia' kinaakisi kwa karibu muundo wa Kigiriki huku tanbihi ikitaja tafsiri nyingine ya kawaida.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: wakaingia katika sinagogi
  rationale: Kitenzi kishirikishi kimetafsiriwa kama kitenzi kikuu kinachofuatana ili simulizi lisomeke kwa kawaida katika Kiswahili.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: Siku ya Sabato
  rationale: Hii ni nahau inayorejelea siku ya Sabato ya Kiyahudi; ingawa σαββάτων ni umbo la wingi, maana ya kawaida hapa ni umoja.
- source_word: ἐκάθισαν
  choice: wakaketi
  rationale: Neno hili linaonyesha tendo rahisi la kuketi; 'wakaketi' ni lugha ya sasa, yenye heshima, na inafaa katika mazingira ya sinagogi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vinavyofuatana kwa viambishi vya -ka- unadumisha mwendo wa simulizi. Neno 'sinagogi' limechaguliwa kama istilahi iliyozoeleka.
