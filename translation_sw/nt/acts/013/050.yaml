source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: sw
  text: Lakini Wayahudi wakawachochea wanawake wacha Mungu wenye heshima[a] na wanaume wakuu wa mji; wakaanzisha mateso dhidi ya Paulo na Barnaba, wakawafukuza kutoka katika eneo lao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanawake wenye kumcha Mungu.” Inawezekana walikuwa wanawake wa mataifa waliomwabudu Mungu wa Israeli na kushirikiana na sinagogi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka katika sehemu yao,” “nchi yao,” au “nje ya mipaka yao.” Neno la Kigiriki linaweza kumaanisha mipaka au eneo lililo ndani yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Lakini Wayahudi
  rationale: δέ inaonyesha mgeuko wenye utofautisho baada ya mwitikio mzuri uliotangulia; “Lakini” ni ya asili katika simulizi la Kiswahili.
- source_word: παρώτρυναν
  choice: wakawachochea
  rationale: Kitenzi hiki kinaonyesha kuwashawishi kwa nguvu au kuwahamasisha wengine watende kwa uhasama; “kuwachochea” huhifadhi nguvu hiyo.
- source_word: σεβομένας γυναῖκας
  choice: wanawake wacha Mungu
  rationale: Kirai hiki kinawahusu wanawake waliomwabudu Mungu wa Israeli, huenda watu wa mataifa walioshirikiana na sinagogi. “Wacha Mungu” ni usemi wa kawaida wa kibiblia, ingawa unaweza kueleweka kama hadhi maalumu; tanbihi inaeleza uwezekano huo.
- source_word: εὐσχήμονας
  choice: wenye cheo cha juu
  rationale: Neno linaweza kuonyesha hadhi, heshima, au umashuhuri wa kijamii; katika muktadha huu “wenye cheo cha juu” linaeleza nafasi yao yenye ushawishi.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: wanaume mashuhuri wa mjini
  rationale: πρώτους inaonyesha wanaume waliokuwa wa kwanza kwa cheo au ushawishi katika mji. Tafsiri hii huhifadhi rejeo la kiume lililo wazi katika Kigiriki bila kuwa ngumu.
- source_word: ἐπήγειραν διωγμὸν
  choice: wakaanzisha mateso
  rationale: Muundo wa kitenzi na nomino unaonyesha kusababisha mateso yatokee. “Wakaanzisha mateso” ni wazi na huepuka kurudia “wakawachochea” kwa namna isiyo ya asili.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: dhidi ya Paulo na Barnaba
  rationale: ἐπί pamoja na διωγμός inaelekeza uhasama kwa walengwa hawa; “dhidi ya” ni sawa na ya kawaida.
- source_word: ἐξέβαλον
  choice: wakawafukuza
  rationale: Neno lina nguvu ya kuwaondoa kwa lazima; “kuwafukuza” ni la asili na huhifadhi hali ya kulazimishwa.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: kutoka katika eneo lao
  rationale: ὅρια linaweza kumaanisha mipaka, eneo, au sehemu ya utawala. “Eneo lao” linafaa kwa muktadha wa mji huku tanbihi ikihifadhi upana wa maana.
theological_decisions:
- issue: Utambulisho wa σεβομένας γυναῖκας
  choice: wanawake wacha Mungu
  alternative: wanawake wenye kumcha Mungu / wanawake waliomwabudu Mungu
  rationale: Tafsiri teule inaonyesha uchaji wa kidini na matumizi ya Luka kwa watu waliohusishwa na ibada ya Mungu wa Israeli, lakini haitangazi kwa uhakika kama walikuwa waongofu kamili; tanbihi huhifadhi hali hiyo.
- issue: Rejeo la kiume katika τοὺς πρώτους τῆς πόλεως
  choice: wanaume mashuhuri wa mjini
  alternative: viongozi wa mji
  rationale: Kigiriki kina rejeo la wazi la kiume. “Wanaume mashuhuri” huhifadhi jambo hilo na pia maana ya hadhi na ushawishi wa kiraia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Viunganishi vya mfululizo “waka-” vinatunza mwendo wa simulizi. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
