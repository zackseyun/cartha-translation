  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: sw
  text: Enyi ndugu[a], wana wa ukoo wa Abrahamu, na wale miongoni mwenu wanaomcha Mungu[b], ujumbe[c] wa wokovu huu umetumwa kwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “Enyi wanaume, ndugu.” Maneno ya Kigiriki yako katika umbo la kiume, ingawa mwito huu unaweza kuihusu hadhira yote iliyokusanyika.
    reason: lexical_alternative
  - marker: b
    text: Huenda maneno haya yanarejelea watu wa mataifa mengine waliomwabudu Mungu wa Israeli na kushirikiana na sinagogi.
    reason: cultural_note
  - marker: c
    text: Au “neno la wokovu huu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ndugu zangu
  rationale: Hii ni namna ya kawaida na yenye heshima ya kuwasalimu wasikilizaji wa karibu katika Kiswahili. Ingawa Kigiriki kina neno la kiume ἄνδρες pamoja na ἀδελφοί, tafsiri ya moja kwa moja ‘Enyi wanaume ndugu’ ingekuwa ngumu na isiyo ya kawaida; tanbihi inadumisha umbo halisi la asili.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: wana wa ukoo wa Abrahamu
  rationale: ‘Wana’ linadumisha lugha ya kifamilia ya υἱοί, na ‘ukoo’ linaonyesha nasaba au jamii ya asili inayomaanishwa na γένος bila kutumia neno lenye maana hasi ya kibaguzi.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: wale miongoni mwenu wanaomcha Mungu
  rationale: Tafsiri hii inadumisha maana ya wazi ya kumcha Mungu, huku ikiacha uwezekano kwamba maneno hayo yaliwatambulisha watu wa mataifa mengine waliohusiana na sinagogi.
- source_word: ἡμῖν
  choice: kwetu
  rationale: Kimilikishi-elekezi hiki kinadumisha mwelekeo wa kutumwa ‘kwetu’ ulio katika toleo la SBLGNT lililotolewa.
- source_word: ὁ λόγος
  choice: ujumbe
  rationale: Katika muktadha wa hotuba na tangazo, ‘ujumbe’ ni Kiswahili cha sasa na cha kawaida kinachowasilisha maana ya λόγος vizuri; ‘neno’ linabaki kuwa mbadala halali.
- source_word: τῆς σωτηρίας ταύτης
  choice: wa wokovu huu
  rationale: Muundo huu unahifadhi uhusiano wa kirai cha Kigiriki kati ya ujumbe na wokovu bila kuamua kwa kulazimisha ikiwa ujumbe ni kuhusu wokovu au ndio unaoutangaza.
- source_word: ἐξαπεστάλη
  choice: umetumwa
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililokamilika lenye umuhimu katika wakati wa hotuba, na inadumisha kauli tendwa ya Kigiriki.
theological_decisions:
- issue: Utambulisho wa οἱ ... φοβούμενοι τὸν θεόν
  choice: wale miongoni mwenu wanaomcha Mungu
  alternative: waogopao Mungu miongoni mwenu / wale wamchao Mungu kama kundi maalumu
  rationale: Tafsiri ya maelezo haifanyi maneno hayo kuwa jina maalumu kwa lazima, lakini tanbihi inaeleza uwezekano wa mazingira ya kihistoria ya watu wa mataifa waliokuwa wakishiriki katika ibada za sinagogi.
- issue: Lugha ya kijinsia katika Ἄνδρες ἀδελφοί
  choice: Ndugu zangu
  alternative: Enyi wanaume ndugu / Ndugu zangu wanaume
  rationale: Kiswahili hutumia ‘ndugu’ kwa kawaida katika mwito wa hadhara, bila kuhitaji umbo gumu la neno kwa neno. Tanbihi inaonyesha kwamba maneno ya Kigiriki yako katika umbo la kiume na kwamba hadhira pana inaweza kuwa imekusudiwa.
- issue: Mpokeaji wa ujumbe katika ἡμῖν
  choice: kwetu
  alternative: kwenu
  rationale: Tafsiri inafuata kwa uangalifu ἡμῖν (‘kwetu’) katika matini ya SBLGNT iliyotolewa, bila kuibadili kwa usomaji mwingine unaojulikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na hotuba ya hadhara ya Paulo, lakini huepuka tafsiri ngumu ya neno kwa neno. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
