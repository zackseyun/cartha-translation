  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: sw
  text: Kwa maana Daudi, baada ya kulitumikia kusudi la Mungu katika kizazi chake mwenyewe[a], alilala[b], akaunganishwa na mababu zake[c], na akaona uharibifu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kulitumikia kizazi chake mwenyewe kulingana na kusudi la Mungu.” Muundo wa Kigiriki unaruhusu pia uhusiano huu wa virai.
    reason: textual_ambiguity
  - marker: b
    text: “Alilala” ni nahau ya kibiblia inayomaanisha kwamba alikufa.
    reason: cultural_note
  - marker: c
    text: Kwa maana halisi zaidi, “akaongezwa kwa baba zake”; hii ni nahau ya Kiebrania inayomaanisha kwamba alijiunga na mababu zake katika kifo.
    reason: lexical_alternative
  - marker: d
    text: Yaani, mwili wake ulipatwa na uharibifu; linganisha tofauti inayoonyeshwa katika mstari unaofuata.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: katika kizazi chake mwenyewe
  rationale: Kirai cha hali ya utoaji kinaonyesha kipindi au mazingira ambamo Daudi alihudumu. Tafsiri hii inadumisha maana ya kihistoria bila kulazimisha wazo la kwamba kizazi chake ndicho kilichonufaishwa.
- source_word: ὑπηρετήσας
  choice: baada ya kulitumikia
  rationale: Kauli ya tendo lililotangulia inaonyesha kwamba huduma ya Daudi ilitangulia kifo chake. ‘Kulitumikia’ inadumisha dhana ya kuwa mtumishi bila kutumia lugha finyu ya cheo cha kidini.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: kusudi la Mungu
  rationale: βουλή hapa linaweza kumaanisha kusudi, mpango, au shauri. ‘Kusudi la Mungu’ ni Kiswahili cha sasa na cha kawaida kinachodumisha wazo la nia ya Mungu bila kuingiza mfumo maalumu wa kiteolojia.
- source_word: ἐκοιμήθη
  choice: alilala
  rationale: Kitenzi hiki ni sitiari ya kawaida ya kibiblia kuhusu kufa. Tafsiri ya moja kwa moja inadumisha picha ya matini; tanbihi inaifafanua.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: akaunganishwa na mababu zake
  rationale: Hii ni nahau ya Kisemiti inayomaanisha kujiunga na waliotangulia kufa. ‘Akaunganishwa na mababu zake’ ni ya asili zaidi kuliko tafsiri neno kwa neno ‘akaongezwa kwa baba zake,’ huku ikidumisha kauli tendwa na maana ya nahau.
- source_word: εἶδεν διαφθοράν
  choice: akaona uozo
  rationale: Tafsiri hii inadumisha usemi wa moja kwa moja na mwangwi wake wa Zaburi, pamoja na tofauti muhimu na mstari unaofuata. Tanbihi inaeleza kuwa mwili wake ulioza.
theological_decisions:
- issue: Nahau ya usingizi kuhusu kifo cha Daudi
  choice: alilala
  alternative: alikufa
  rationale: Matini inatumia κοιμάομαι badala ya kitenzi cha moja kwa moja cha kufa. Kudumisha sitiari kunahifadhi lugha ya kibiblia bila kudai fundisho la ziada kuhusu hali ya wafu.
- issue: Maana ya βουλή kuhusiana na nia ya Mungu
  choice: kusudi la Mungu
  alternative: shauri la Mungu; mpango wa Mungu
  rationale: ‘Kusudi’ linaeleweka kwa urahisi na linaonyesha nia ya Mungu bila kubana neno hilo kuwa mfumo fulani wa kiteolojia.
- issue: Uhusiano wa ἰδίᾳ γενεᾷ na τῇ τοῦ θεοῦ βουλῇ
  choice: kulitumikia kusudi la Mungu katika kizazi chake mwenyewe
  alternative: kukitumikia kizazi chake kwa kusudi la Mungu
  rationale: Muundo wa Kigiriki unaweza kuhusianisha kirai cha ‘kizazi chake’ na mazingira ya huduma au na kile kilichotumikiwa. Matini kuu inafuata usomaji unaoona kusudi la Mungu kuwa kitu kilichotumikiwa, na tanbihi inadumisha usomaji mwingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari na nahau muhimu za matini asili zimedumishwa na kufafanuliwa kwa tanbihi. ‘Akaona uozo’ imeachwa kwa makusudi ili kuhifadhi mwangwi wa Zaburi na tofauti ya hoja katika muktadha.
