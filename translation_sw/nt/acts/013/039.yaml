translation:
  language: sw
  text: Katika yeye, kila mtu anayeamini anahesabiwa haki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa huyu kila mtu anayeamini anahesabiwa haki.” Kirai cha Kigiriki ἐν τούτῳ kinaweza kutafsiriwa kwa karibu zaidi “katika/kwa huyu,” kikimrejelea Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Katika huyu
  rationale: Kirai hiki kinamrejelea Yesu aliyetajwa katika muktadha wa karibu. “Katika huyu” huhifadhi kiwakilishi cha Kigiriki na uhusiano wake na Yesu bila kukibadili waziwazi kuwa cha njia au chombo.
- source_word: πᾶς ὁ πιστεύων
  choice: kila anayeamini
  rationale: Kishiriki chenye kibainishi kina maana ya kijumla ya mtu yeyote mwenye kuamini; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: δικαιοῦται
  choice: anahesabiwa kuwa mwenye haki
  rationale: Hii huwasilisha maana ya kimahakama ya δικαιόω kama tamko au hesabu ya kuwa mwenye haki, bila kuidokeza kuwa badiliko la maadili ndani ya mtu.
theological_decisions:
- issue: Kirejelewa na nguvu ya ἐν τούτῳ
  choice: 'Kirejeleo cha mtu, yaani Yesu: “Katika huyu”'
  alternative: “Kwa njia ya huyu”
  rationale: Muktadha wa karibu unamtaja Yesu kuwa yule ambaye kupitia kwake msamaha unatangazwa. “Katika huyu” huhifadhi kwa karibu zaidi utata wa kihusishi ἐν huku ikionyesha kirejeleo cha Yesu; namna ya njia imewekwa katika tanbihi.
- issue: Maana ya δικαιοῦται katika muktadha wa Paulo
  choice: “anahesabiwa kuwa mwenye haki” kwa maana ya tamko la kimahakama
  alternative: “anafanywa kuwa mwenye haki” au “anawekwa sawa”
  rationale: Muktadha unatofautisha kuhesabiwa haki na yale yasiyowezekana kupitia sheria ya Musa. Tafsiri hii inalinda maana ya kimahakama bila kuichanganya na mabadiliko ya maadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Katika huyu” ni rasmi kidogo lakini huhifadhi muundo na utata halisi wa Kigiriki; tanbihi inatoa usomaji wa kawaida zaidi wa maana ya njia.
