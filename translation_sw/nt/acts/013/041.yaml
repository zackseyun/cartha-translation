  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: sw
  text: “Tazameni[a], enyi wanaodharau, staajabuni na angamieni[b]; kwa maana mimi ninafanya kazi katika siku zenu, kazi ambayo hamtaamini kamwe, hata mtu akiwaeleza habari za kazi hiyo kwa kina[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye dharau.” Neno la Kigiriki linaweza kumaanisha watu wanaolitendea jambo kwa dharau; “wanaodharau” huweka wazi maana hiyo katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: “Angamieni” pia inaweza kutafsiriwa “towekeni” au “haribiweni.” Dondoo hili linaakisi Habakuki 1:5 katika tafsiri ya Kigiriki na lina onyo kali la maangamizi.
    reason: alternative_reading
  - marker: c
    text: Kitenzi cha Kigiriki kinaweza kumaanisha “kusimulia kikamilifu” au “kueleza kwa undani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Tazameni
  rationale: Amri ya wingi inayovuta usikivu; ni ya kawaida, wazi, na yenye uzito katika Kiswahili cha sasa.
- source_word: οἱ καταφρονηταί
  choice: enyi wenye kudharau
  rationale: Huwataja watu wanaotendea jambo kwa dharau. Usemi huu huhifadhi wazo la msingi bila kulazimisha maana finyu ya kubeza kwa maneno.
- source_word: θαυμάσατε
  choice: mshangae
  rationale: Huhifadhi amri na mshangao mkali wa dondoo la kinabii kwa lugha ya kawaida.
- source_word: ἀφανίσθητε
  choice: kuangamia
  rationale: Katika mfululizo wa amri, Kiswahili cha kawaida hutumia ‘na kuangamia.’ Neno hili huwasilisha onyo kali la kufikia maangamizi, ingawa kitenzi pia kinaweza kumaanisha kutoweka.
- source_word: ἔργον
  choice: kazi
  rationale: Ni neno pana na la kawaida kwa tendo muhimu la Mungu bila kufafanua aina yake zaidi ya chanzo.
- source_word: ἐργάζομαι ἐγώ
  choice: ninafanya
  rationale: Huhifadhi tendo la sasa na msisitizo wa msemaji; pamoja na ‘kazi’ huunda Kiswahili cha asili.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: katika siku zenu
  rationale: Huhifadhi rejeo la wakati na ukaribu wa kinabii kwa wasikilizaji.
- source_word: οὐ μὴ πιστεύσητε
  choice: hamtaamini kamwe
  rationale: ‘Kamwe’ huonyesha ukanushaji wenye msisitizo mkubwa wa οὐ μή pamoja na subjunktivu ya aoristi.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: hata mtu akiwaeleza kwa kina
  rationale: '‘Akiwaeleza kwa kina’ huleta maana ya kusimulia au kueleza kikamilifu; ‘hata’ huwasilisha nguvu ya kimuktadha ya hali hii: hawataamini hata wakielezwa.'
theological_decisions:
- issue: Ukali wa onyo la kinabii lililonukuliwa kutoka Habakuki
  choice: kuangamia
  alternative: kutoweka
  rationale: Muktadha ni onyo zito dhidi ya kukataa kazi ya Mungu. ‘Kuangamia’ huhifadhi uzito wa hukumu, huku tanbihi ikitaja maana mbadala ya kileksika.
- issue: Uhakika wa kutokuamini katika οὐ μὴ πιστεύσητε
  choice: hamtaamini kamwe
  alternative: hakika hamtaamini
  rationale: Huhifadhi ukanushaji wenye nguvu bila kueleza sababu ya kutokuamini au kuamua maswali mapana ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kinabii na ukali wa amri umehifadhiwa; msamiati wa kizamani na ufafanuzi wa kimadhehebu umeepukwa.
