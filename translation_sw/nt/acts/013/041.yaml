  source_fidelity: The draft accurately conveys the prophetic warning, the divine work in the hearers’ days, and the emphatic refusal to believe. However, its coordinated imperative sequence is grammatically uneven in Swahili ("mshangae na kuangamia"), and the explicit Greek subject ἐγώ ('I') should be retained for emphasis. The final conditional should more clearly retain the implied object of 'recount fully.'
  naturalness: '"Mshangae na kuangamia" combines a subjunctive-form verb with an infinitive and is not a natural coordinated command. "Staajabuni na angamieni" provides parallel plural imperatives in a suitably solemn but understandable scriptural register. The revised final clause is clearer and idiomatic.'
  terminology: '"Wanaodharau" directly represents καταφρονηταί without adding a narrower claim that they are verbally mocking. "Kazi" appropriately renders ἔργον. "Angamieni" preserves the warning of ruin while a footnote notes the viable alternatives ''kutoweka'' and ''kuharibiwa.'''
  issues:
