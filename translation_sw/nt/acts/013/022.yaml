  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: sw
  text: Baada ya kumwondoa, Mungu akawainulia Daudi awe mfalme wao. Mungu pia alitoa ushuhuda kumhusu, akisema, “Nimempata Daudi mwana wa Yese, mtu anayepatana na moyo wangu[a], ambaye atatimiza mapenzi yangu yote[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana iliyo karibu zaidi na maneno ya Kigiriki, “mtu kulingana na moyo wangu.” Kauli hii mara nyingi hutafsiriwa “mtu aliye kama moyo wangu” au, kwa usemi wa kimapokeo, “mtu baada ya moyo wangu mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “mapenzi” liko katika wingi na linaweza kumaanisha matakwa au makusudi yote ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: Baada ya kumwondoa
  rationale: Kitenzi hiki katika muktadha kinamaanisha kwamba Mungu alimwondoa Sauli katika ufalme. ‘Kumwondoa’ huhifadhi upana wa neno la Kigiriki bila kuongeza waziwazi ‘madarakani,’ jambo ambalo muktadha tayari unaonyesha.
- source_word: ἤγειρεν ... εἰς βασιλέα
  choice: akawainulia Daudi awe mfalme wao
  rationale: ‘Kumwinua’ huhifadhi tamathali ya kibiblia ya kumleta au kumteua kiongozi, huku ‘awe mfalme wao’ ikiweka wazi kuwa hapa si ufufuo.
- source_word: αὐτοῖς
  choice: wao
  rationale: Kiwakilishi hiki kinahusishwa kwa njia ya asili na ‘mfalme wao’ katika Kiswahili na kuonyesha kwamba Daudi aliinuliwa kwa ajili ya Israeli.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: Pia alimtolea ushuhuda akisema
  rationale: Muundo huu wa Kiswahili huwasilisha maana ya Mungu kutoa ushuhuda kuhusu Daudi, badala ya kudokeza kwamba maneno hayo yote yalielekezwa kwake moja kwa moja.
- source_word: Εὗρον
  choice: Nimempata
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu unaoendelea katika kauli ya Mungu.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: Daudi mwana wa Yese
  rationale: Hii ndiyo njia ya kawaida na ya wazi ya kuwasilisha uhusiano wa kifamilia unaodokezwa na umilikishi wa Kigiriki.
- source_word: κατὰ τὴν καρδίαν μου
  choice: anayepatana na moyo wangu
  rationale: Kauli hii huhifadhi wazo la kupatana na moyo, kusudi, au uchaguzi wa Mungu bila kuifanya iwe tu hisia za upendo au upendeleo.
- source_word: ποιήσει
  choice: atatimiza
  rationale: ‘Atatimiza’ ni Kiswahili cha kawaida kinachoonyesha kwamba Daudi atafanya na kutekeleza yale Mungu anayotaka.
- source_word: πάντα τὰ θελήματά μου
  choice: mapenzi yangu yote
  rationale: ‘Mapenzi’ ni neno la kawaida la Kiswahili kwa matakwa au nia ya Mungu; umbo lake linaweza kuwakilisha kwa asili wingi wa θελήματα.
theological_decisions:
- issue: Maana ya Daudi kuwa mtu κατὰ τὴν καρδίαν μου
  choice: mtu anayepatana na moyo wangu
  alternative: mtu anayeupendeza moyo wangu
  rationale: Chaguo hili linaweka wazi upatanifu na moyo au kusudi la Mungu bila kuamua kwamba kauli hiyo inamaanisha hasa kumpendeza Mungu kihisia.
- issue: Uwezekano wa ‘kumwinua’ kueleweka kama ufufuo
  choice: akawainulia Daudi awe mfalme wao
  alternative: akawateulia Daudi kuwa mfalme wao
  rationale: ‘Kumwinua’ huhifadhi nahau ya chanzo, na maneno ‘awe mfalme wao’ yanaondoa utata unaoweza kuifanya ionekane kuwa inazungumzia ufufuo.
- issue: Wingi wa θελήματα
  choice: mapenzi yangu yote
  alternative: mapenzi yangu yote kabisa / kila nilitakalo
  rationale: Kiswahili hutumia ‘mapenzi’ kwa kawaida kama jina lenye umbo la wingi; hivyo chaguo hili huhifadhi upeo wa makusudi mbalimbali ya Mungu bila kuwa gumu au lisilo la kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Jina ‘Mungu’ limetajwa wazi baada ya kishazi tegemezi ili mlolongo wa wahusika uwe wazi katika mstari unaosomwa peke yake.
