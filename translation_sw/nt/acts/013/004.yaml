id: ACT.13.4
reference: Acts 13:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: sw
  text: Basi wao, baada ya kutumwa na Roho Mtakatifu[a], walishuka hadi Seleukia, na kutoka huko wakasafiri kwa meli kwenda Kipro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho takatifu.” Maneno ya Kigiriki ni “roho takatifu,” lakini katika Matendo yanamrejelea mtendaji binafsi wa kiungu ambaye kwa kawaida huitwa “Roho Mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: wao
  rationale: Kiwakilishi kimetajwa wazi na kina mkazo kiasi; “wao” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: μὲν οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuonyesha matokeo ya agizo lililotangulia; “Basi” kinafanya hivyo kwa ufasaha wa Kiswahili.
- source_word: ἐκπεμφθέντες
  choice: baada ya kutumwa
  rationale: Huhifadhi hali ya kutendwa na kuonyesha kwamba kutumwa kulitangulia matendo makuu ya kushuka na kusafiri.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: na Roho Mtakatifu
  rationale: Katika muundo wa Kiswahili, “na” humtambulisha mtendaji katika sentensi ya hali ya kutendwa; muktadha wa Matendo unamwonyesha Roho Mtakatifu kama mtendaji binafsi anayewatuma.
- source_word: κατῆλθον
  choice: walishuka
  rationale: Huhifadhi maana halisi ya kwenda chini, inayofaa kwa safari kuelekea mji wa bandari.
- source_word: εἰς Σελεύκειαν
  choice: hadi Seleukia
  rationale: “Hadi” linaonyesha mahali walipofikia, na jina la mahali limeandikwa kwa umbo linaloeleweka katika Kiswahili.
- source_word: ἐκεῖθεν τε
  choice: na kutoka huko
  rationale: Huhifadhi mahali walipoanzia hatua inayofuata na uhusiano wa matendo hayo mawili.
- source_word: ἀπέπλευσαν
  choice: wakasafiri kwa meli
  rationale: Hueleza wazi kwamba waliondoka kwa njia ya bahari bila kuongeza maelezo yasiyomo, kama kung’oa nanga.
- source_word: εἰς Κύπρον
  choice: kwenda Kipro
  rationale: Huonyesha Kipro kuwa mahali safari ya baharini ilikoelekea.
theological_decisions:
- issue: Tafsiri ya ἁγίου πνεύματος
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Katika Matendo, msemo huu humrejelea mtendaji wa kiungu anayesema, anaagiza na kutuma. Herufi kubwa zinafuata matumizi ya kawaida ya Kiswahili kwa jina hili, huku tanbihi ikitaja tafsiri mbadala iliyo karibu na umbo la maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa simulizi ni wa kawaida na majina Seleukia na Kipro yanafuata maumbo yanayotumika katika tafsiri za Kiswahili.
