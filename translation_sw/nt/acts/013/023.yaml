  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: sw
  text: Kutoka katika uzao[a] wa mtu huyu, Mungu amemletea Israeli Mwokozi, Yesu, kulingana na ahadi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza pia kutafsiriwa “mbegu”; hapa linamaanisha kizazi au ukoo wa Daudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama alivyoahidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: wa mtu huyu
  rationale: Kiwakilishi hiki cha kuonyesha katika hali ya umilikaji kinamrejelea Daudi aliyetajwa katika mstari uliotangulia; “mtu huyu” huweka rejeo hilo wazi bila kuongeza jina lisilokuwamo katika mstari huu.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: kutokana na uzao
  rationale: σπέρμα hapa ina maana ya kizazi au ukoo wa Daudi. “Uzao” ni Kiswahili cha kawaida na chenye heshima kinachohifadhi wazo la nasaba kuliko tafsiri halisi “mbegu.”
- source_word: κατ’ ἐπαγγελίαν
  choice: kulingana na ahadi
  rationale: Kirai hiki kinaonyesha kwamba tendo la Mungu lilipatana na ahadi iliyotangulia. Tafsiri hii haiibainishi zaidi ahadi hiyo kuliko Kigiriki kinavyofanya.
- source_word: ἤγαγεν
  choice: amemletea
  rationale: Kitenzi ἄγω kwa msingi humaanisha kuleta au kuongoza. “Amemletea” kinaonyesha tendo lililotimizwa la kumleta Mwokozi kwa Israeli, bila kuingiza maana ya ufufuo ambayo “alimwinua” ingeweza kudokeza.
- source_word: τῷ Ἰσραήλ
  choice: Israeli
  rationale: Israeli ndiye mpokeaji wa Mwokozi; muundo “amemletea Israeli” unawakilisha hali ya utoaji ya Kigiriki kwa Kiswahili cha kawaida.
- source_word: σωτῆρα
  choice: Mwokozi
  rationale: Hili ni jina la cheo lenye maana ya anayeokoa au kukomboa. “Mwokozi” ndilo neno la kawaida na linalofaa katika muktadha huu wa Yesu.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa Yesu na ahadi iliyohusiana na Daudi
  choice: Mstari unasema kwamba Mungu alimleta Yesu kutoka katika uzao wa Daudi kwa kupatana na ahadi, bila kuifafanua ahadi hiyo zaidi.
  alternative: Kusema wazi “akitimiza ahadi aliyompa Daudi.”
  rationale: Muktadha unaunganisha uzao wa Daudi na ahadi ya Mungu, lakini Kigiriki hakitaji wazi katika mstari huu aliyepewa ahadi wala kutumia kitenzi “kutimiza.” Tafsiri inahifadhi uhusiano huo bila kuongeza maelezo ya kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umetunza msisitizo wa asili kwa kuanza na asili ya Yesu katika uzao wa mtu aliyetajwa kabla, huku “Mwokozi, Yesu” likiweka wazi jina na cheo bila maelezo ya ziada.
