  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: sw
  text: Nao wanafunzi walikuwa wakijazwa furaha na Roho Mtakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walijazwa furaha na Roho Mtakatifu.” Kitenzi cha Kigiriki ni cha wakati usiotimilika; kinaweza kuonyesha kwamba walikuwa wakijazwa kwa kuendelea au kwa kurudiwa.
    reason: Hutoa mbadala wa tafsiri rahisi na kueleza kwa ufupi dhamira ya wakati usiotimilika, bila kuanzisha shaka isiyohitajika kuhusu “Roho Mtakatifu.”
lexical_decisions:
- source_word: οἵ τε
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuwaunganisha wanafunzi na matukio yaliyotangulia; “Nao” ni Kiswahili cha kawaida na fasaha katika muktadha huu.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida la Agano Jipya kwa wale wanaojifunza kutoka kwa Yesu na kumfuata; hapa linawarejelea waamini wa eneo hilo.
- source_word: ἐπληροῦντο
  choice: waliendelea kujazwa
  rationale: Kauli ya wakati usiotimilika na ya kutendwa inadokeza hali au tendo lililoendelea au kujirudia katika wakati uliopita. “Waliendelea kujazwa” huhifadhi dhamira hiyo pamoja na kauli ya kutendwa.
- source_word: χαρᾶς
  choice: furaha
  rationale: Baada ya kitenzi cha kujaza, Kiswahili hutaja kwa kawaida kile kinachomjaza mtu bila kihusishi; “furaha” ni tafsiri ya moja kwa moja na ya kawaida ya χαρά.
- source_word: πνεύματος ἁγίου
  choice: Roho Mtakatifu
  rationale: Katika Matendo ya Mitume, kirai hiki kwa kawaida humrejelea Roho wa Mungu anayehusika katika kazi ya kanisa. Kiswahili sanifu halihitaji kibainishi kinacholingana na “the” ya Kiingereza.
theological_decisions:
- issue: Ikiwa πνεύματος ἁγίου itafsiriwe kama hali isiyo ya kibinafsi au kama Roho Mtakatifu
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Matumizi ya kirai hiki katika Matendo na muktadha wa utume yanaunga mkono rejeo kwa Roho wa Mungu, bila kuligeuza kuwa hisia au sifa ya kiroho tu.
- issue: Ikiwa hali ya kutokuwepo kwa kibainishi katika Kigiriki ihifadhiwe kwa kuacha maana wazi kati ya “Roho Mtakatifu” na “roho takatifu”
  choice: Roho Mtakatifu, huku uwezekano wa muundo usio na kibainishi ukitajwa katika tanbihi
  alternative: roho takatifu
  rationale: Kutokuwepo kwa kibainishi katika Kigiriki hakufanyi kirai hiki kuwa kisicho bainifu moja kwa moja; muktadha wa Luka–Matendo unaelekeza kwa Roho Mtakatifu, lakini tanbihi inalinda taarifa ya kimuundo na uwezekano wa tafsiri halisi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. “Waliendelea kujazwa” ni cha asili zaidi kuliko muundo wa moja kwa moja kama “walikuwa wakijazwa,” huku kikidumisha hali endelevu au inayojirudia ya kitenzi cha Kigiriki.
