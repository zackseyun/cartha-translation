  verdict: revise
  source_fidelity: Tafsiri inawakilisha vizuri orodha ya manabii na walimu, majina, asili ya Lukio, na maana pana ya σύντροφος. Hata hivyo, “mtawala wa robo” si uwasilishaji wa asili wala wa kutosha wa cheo τετράρχης katika Kiswahili; “tetrarki” hudumisha cheo cha kihistoria bila kudokeza kimakosa kwamba Herode alitawala robo halisi ya eneo.
  naturalness: Sentensi kwa jumla ni Kiswahili Sanifu kinachosomwa vizuri. “Huko Antiokia, katika kanisa lililokuwako” hufuata kwa uwazi zaidi mahali pa Antiokia na kanisa la huko. “Tetrarki” ni neno linalofaa zaidi katika rejista ya kihistoria ya kifungu kuliko “mtawala wa robo.”
  terminology: “Kanisa,” “manabii,” “walimu,” “Simeoni,” “Lukio Mkirene,” na “Sauli” zinafaa. Jina Niger lihifadhiwe kama jina, kwa tanbihi. Tanbihi ya σύντροφος inapaswa kuepuka “ndugu wa kambo,” kwa kuwa hilo kwa kawaida humaanisha stepbrother, si mtu aliyekuzwa pamoja.
