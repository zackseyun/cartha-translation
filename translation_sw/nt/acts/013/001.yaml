    [b] Yaani, Lukio alikuwa mtu kutoka Kirene, Afrika Kaskazini.

    [c] Au “ndugu wa kambo wa Herode, mtawala wa robo,” au “rafiki wa karibu wa Herode, mtawala wa robo.” Neno la Kigiriki linaweza kumaanisha mtu aliyelelewa pamoja na mwingine.'
  to: 'Huko Antiokia, katika kanisa lililokuwako, kulikuwa na manabii na walimu: Barnaba, Simeoni aliyeitwa Niger[a], Lukio Mkirene[b], Manaeni, aliyekulia pamoja na Herode tetrarki[c], na Sauli.'
  rationale: Marekebisho yanaboresha uwasilishaji wa cheo cha kihistoria τετράρχης na kusahihisha maelezo ya uhusiano unaoweza kuashiriwa na σύντροφος. “Aliyekulia pamoja na” huhifadhi maana inayowezekana ya kukuzwa pamoja, huku tanbihi ikidumisha upana wa kisemantiki. Mpangilio wa mwanzo umewekwa wazi bila kubadili maana.
