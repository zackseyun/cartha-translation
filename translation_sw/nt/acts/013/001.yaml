id: ACT.13.1
reference: Acts 13:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: sw
  text: 'Huko Antiokia, katika kanisa lililokuwako, kulikuwa na manabii na walimu: Barnaba, Simeoni aliyeitwa Niger[a], Lukio Mkirene[b], Manaeni, aliyekulia pamoja na Herode tetrarki[c], na Sauli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Niger” ni jina la Kilatini linalomaanisha “mweusi.” Limeachwa kama jina badala ya kutafsiriwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Lukio alikuwa mtu kutoka Kirene, Afrika Kaskazini.
    reason: cultural_note
  - marker: c
    text: “Tetrarki” ni cheo cha mtawala wa eneo chini ya mamlaka ya juu zaidi. Au “ndugu wa kulelewa pamoja na Herode tetrarki” au “mwandamani wa karibu wa Herode tetrarki.” Neno la Kigiriki linaweza kumaanisha mtu aliyekuzwa pamoja na mwingine.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: kulikuwa na
  rationale: Kitenzi kinaonyesha kuwapo kwa watu waliotajwa; kiunganishi δέ ni chepesi na hakihitaji kutafsiriwa kwa neno tofauti katika sentensi hii ya Kiswahili.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: Katika kanisa lililokuwa Antiokia
  rationale: Muundo huu unaonyesha kanisa la mahali hapo. Tafsiri hii ni ya kawaida kwa Kiswahili na huepuka kurudia ‘Antiokia’ bila lazima.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Katika muktadha wa Matendo, neno hili linamaanisha kusanyiko la waamini wa eneo hilo; ‘kanisa’ ndilo neno la kawaida na linaloeleweka.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: manabii na walimu
  rationale: Ni tafsiri ya moja kwa moja ya huduma au majukumu yaliyotajwa bila kuingiza mfumo wa baadaye wa vyeo vya kanisa.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Simeoni aliyeitwa Niger
  rationale: ‘Simeoni’ huhifadhi umbo la jina Συμεών, na ‘aliyeitwa’ huwasilisha καλούμενος kwa Kiswahili cha kawaida.
- source_word: Νίγερ
  choice: Niger
  rationale: Hili ni jina la Kilatini lililotumiwa kama jina la mtu. Maana yake ya kileksika inaelezwa katika tanbihi badala ya kuligeuza kuwa lakabu katika matini.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lukio Mkirene
  rationale: ὁ Κυρηναῖος humtambulisha Lukio kuwa mtu wa Kirene; ‘Mkirene’ ni umbo fupi na la asili katika Kiswahili.
- source_word: Μαναήν
  choice: Manaeni
  rationale: Ni uhawilishaji unaofaa wa jina la Kigiriki katika tahajia na matamshi ya Kiswahili.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: Herode, mtawala wa robo
  rationale: Tafsiri hii huhifadhi cheo cha kihistoria τετραάρχης bila kuongeza jina ‘Antipa,’ ambalo halipo katika matini.
- source_word: σύντροφος
  choice: aliyekulia pamoja na
  rationale: Neno linaweza kumaanisha mtu aliyelelewa pamoja na mwingine na kwa hiyo mwandamani wa karibu. Tafsiri hii huhifadhi wazo la malezi ya pamoja bila kudai kwa uhakika kwamba walikuwa ndugu wa kambo.
theological_decisions:
- issue: Hadhi ya ‘manabii na walimu’ katika kanisa la Antiokia
  choice: Kutaja majukumu hayo moja kwa moja kama ‘manabii na walimu.’
  alternative: Kuyatafsiri kama vyeo rasmi vya mfumo maalumu wa uongozi wa kanisa.
  rationale: Aya inawatambulisha watu hawa kwa huduma zao lakini haifafanui mfumo wa baadaye wa vyeo; tafsiri haipaswi kuingiza mtazamo wa dhehebu.
- issue: Uhusiano wa Manaeni na Herode katika σύντροφος
  choice: ‘aliyekulia pamoja na Herode’
  alternative: ‘ndugu wa kambo wa Herode’ au ‘rafiki wa karibu wa Herode’
  rationale: Neno la Kigiriki linaweza kudokeza malezi ya pamoja, lakini halilazimishi uhusiano maalumu wa undugu wa kambo. Chaguo kuu huhifadhi msingi wa uhusiano huku tanbihi ikionyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili. Muundo wa orodha umehifadhiwa, huku sentensi ikipangwa kwa mtiririko wa asili wa Kiswahili.
