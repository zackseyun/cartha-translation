revisions:
- from: 'Katika kanisa lililokuwa Antiokia, kulikuwa na manabii na walimu: Barnaba, Simeoni aliyeitwa Niger[a], Lukio Mkirene[b], Manaeni, aliyekulia pamoja na Herode, mtawala wa robo[c], na Sauli.


