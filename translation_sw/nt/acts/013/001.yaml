  - severity: medium
    issue: Tanbihi [c] hutumia “ndugu wa kambo” kwa “foster-brother.”
    rationale: Katika matumizi ya kawaida ya Kiswahili, “ndugu wa kambo” humaanisha ndugu wa mzazi mmoja/wa kuolewa tena, wala si hasa mtu aliyekuzwa pamoja. “Ndugu wa kulelewa pamoja” huelezwa kwa usahihi zaidi.
