  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: sw
  text: Lakini wao wakakung’uta mavumbi kutoka miguuni mwao dhidi yao, wakaenda Ikonio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kukung’uta mavumbi kutoka miguuni kulikuwa tendo la kiishara la kujitenga na watu walioukataa ujumbe na la kutoa ushuhuda dhidi yao.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lakini wao
  rationale: δέ inaonyesha utofautishaji hafifu au mpito wa simulizi; “Lakini” huhifadhi dhana hiyo, na “wao” huwarejelea Paulo na Barnaba kwa kawaida.
- source_word: ἐκτιναξάμενοι
  choice: wakakung’uta
  rationale: Kitenzi hiki cha wakati uliopita kinaeleza kukung’uta kitu kiondoke; muundo wa Kiswahili unaonyesha tendo lililotangulia safari yao kwa mtiririko wa kawaida wa simulizi.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: mavumbi ya miguu yao
  rationale: κονιορτός ni vumbi au mavumbi ya ardhini. “Mavumbi ya miguu yao” ni usemi wa kawaida wa Kiswahili katika muktadha huu na hauongezi tafsiri ya ishara yenyewe.
- source_word: ἐπ’ αὐτοὺς
  choice: dhidi yao
  rationale: ἐπί pamoja na hali ya accusative hapa hudokeza mwelekeo wenye nguvu ya upinzani au ushuhuda; “dhidi yao” huhifadhi maana hiyo bila kuifafanua kupita maandishi.
- source_word: ἦλθον
  choice: wakaenda
  rationale: Ingawa ἔρχομαι inaweza kumaanisha kuja, katika simulizi la mwendo kuelekea mji uliotajwa, “wakaenda” ni Kiswahili cha kawaida.
- source_word: εἰς Ἰκόνιον
  choice: Ikonio
  rationale: εἰς huonyesha mwendo kuelekea au kuingia mjini; baada ya “wakaenda,” jina la mahali linaweza kutumiwa moja kwa moja kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Ishara ya kukung’uta mavumbi ya miguu
  choice: Tendo limetafsiriwa wazi kuwa lilifanywa “dhidi yao,” bila kufafanua maana yake katika maandishi makuu.
  alternative: “kuwa ushuhuda dhidi yao” au “kuwa ishara ya hukumu dhidi yao”
  rationale: Tendo hilo lina umuhimu wa kiishara katika mazingira ya Biblia, lakini Kigiriki chenyewe kinataja tendo na mwelekeo wake tu. Tanbihi inaeleza mazingira bila kulazimisha tafsiri moja ya kiteolojia ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo unahifadhi mtiririko wa simulizi.
