  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: sw
  text: Na sasa, tazama, mkono wa Bwana[a] uko juu yako. Utakuwa kipofu, wala hutaona jua kwa muda. Mara moja ukungu na giza vikamfunika, naye, huku akizungukazunguka, alikuwa akitafuta watu wa kumwongoza kwa mkono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “mkono wa Bwana” ni nahau ya kibiblia inayomaanisha nguvu ya Bwana ikitenda; hapa ni katika hukumu.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linadumisha mwito wa ghafla wa kuelekeza fikira, kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: χεὶρ κυρίου
  choice: mkono wa Bwana
  rationale: Nahau ya kibiblia imehifadhiwa badala ya kufafanuliwa ndani ya matini kuwa hukumu au adhabu.
- source_word: ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον
  choice: Utakuwa kipofu, wala hutaona jua
  rationale: Hii inaeleza kwa Kiswahili cha kawaida hali ya upofu na inadumisha rejeo mahsusi la jua.
- source_word: ἄχρι καιροῦ
  choice: kwa muda
  rationale: Huwasilisha kipindi cha muda kisichotajwa urefu wake na kuonyesha kuwa hali hiyo si ya kudumu.
- source_word: παραχρῆμα
  choice: Mara hiyo
  rationale: Inaonyesha kuwa tukio lilifuata papo hapo.
- source_word: ἀχλὺς καὶ σκότος
  choice: ukungu na giza
  rationale: Inahifadhi picha mbili za hali iliyofunika uwezo wake wa kuona.
- source_word: περιάγων
  choice: akazungukazunguka
  rationale: Inaonyesha kuenda huku na huku bila kuongeza moja kwa moja wazo la kupapasa, ambalo linatokana zaidi na muktadha kuliko neno lenyewe.
- source_word: ἐζήτει χειραγωγούς
  choice: akitafuta watu wa kumwongoza kwa mkono
  rationale: Tafsiri hii inahifadhi maana mahsusi ya watu wanaomwongoza asiyeona kwa kumshika mkono.
theological_decisions:
- issue: Maana ya ‘mkono wa Bwana’
  choice: Nahau ‘mkono wa Bwana’ imedumishwa katika matini.
  alternative: hukumu ya Bwana iko juu yako
  rationale: Muktadha unaonyesha tendo la Mungu katika hukumu, lakini tafsiri haipaswi kuondoa taswira ya chanzo kwa kuibadili kuwa ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. Sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili huku taswira kuu na kutokubainishwa kwa urefu wa kipindi zikihifadhiwa.
