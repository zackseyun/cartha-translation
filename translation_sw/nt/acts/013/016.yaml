  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: sw
  text: Basi Paulo akasimama, akaashiria kwa mkono, akasema, “Enyi wanaume Waisraeli, nanyi mnaomcha Mungu[a], sikilizeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nanyi wamchao Mungu.” Huenda maneno haya yanawarejelea watu wa Mataifa waliohusiana na sinagogi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Kitenzi hiki kinaonyesha tendo halisi la Paulo kusimama kabla ya kuanza kusema; “akasimama” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha upinzani mkali; “Basi” linaunganisha tukio hili kwa mtiririko wa kawaida.
- source_word: κατασείσας τῇ χειρὶ
  choice: akatoa ishara kwa mkono
  rationale: Kirai hiki kinaonyesha ishara ya mkono ya kutaka wasikilizaji watulie au wasikilize. Tafsiri hii haidokezi kupunga mkono ovyo.
- source_word: εἶπεν
  choice: akasema
  rationale: Ni kitenzi cha kawaida cha kuanzisha maneno yanayonukuliwa moja kwa moja.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Enyi wanaume Waisraeli
  rationale: Inahifadhi wito wa moja kwa moja kwa wanaume na utambulisho wao kuwa Waisraeli bila kuugeuza kuwa wito usioonyesha jinsia.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: nanyi mnaomcha Mungu
  rationale: Inahifadhi maana ya wazi ya kishiriki cha Kigiriki badala ya kutumia jina la kitaalamu lisiloeleweka kwa urahisi; katika muktadha huenda ni watu wa Mataifa waliohusishwa na sinagogi.
- source_word: ἀκούσατε
  choice: sikilizeni
  rationale: Amri hii inataka usikivu makini; “sikilizeni” ni ya moja kwa moja, ya kawaida, na yenye uzito unaofaa.
theological_decisions:
- issue: Wito kwa Waisraeli na kundi la pili la watu wanaomcha Mungu katika sinagogi
  choice: “Enyi wanaume Waisraeli, nanyi mnaomcha Mungu”
  alternative: “Enyi wanaume Waisraeli, nanyi Wachamungu”
  rationale: Kigiriki kinatofautisha Waisraeli na kundi la pili linaloelezwa kuwa linamcha Mungu, ambalo huenda lilikuwa watu wa Mataifa walioungana na ibada ya sinagogi. Tafsiri inahifadhi tofauti hiyo bila kufanya utambulisho huo wa kihistoria kuwa hakika kuliko maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unafuata mfululizo wa matendo katika Kigiriki huku ukisomeka kwa kawaida kwa hadhira ya leo.
