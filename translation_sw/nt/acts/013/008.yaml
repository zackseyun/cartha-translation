base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: sw
  text: Lakini Elima, yule mchawi—maana hivyo ndivyo jina lake linavyotafsiriwa[b]—aliwapinga, akijaribu kumgeuza prokonsuli huyo aiache imani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “amzuie kuamini.” Kifungu cha Kigiriki kinaweza kumaanisha kumgeuza aiache imani ya Kikristo hasa, au kumzuia asiitikie kwa kuamini kwa maana ya jumla zaidi.'
    reason: alternative_reading
  - marker: b
    text: Jina “Elima” linaelezwa kuwa limetafsiriwa au limefasiriwa hivyo; asili yake kamili haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: aliwapinga
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha upinzani uliokuwa ukiendelea; “aliwapinga” ni Kiswahili cha kawaida chenye maana ya kupambana na juhudi zao.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti na mapokezi mazuri yaliyotajwa katika muktadha uliotangulia.
- source_word: αὐτοῖς
  choice: -wa- (aliwapinga)
  rationale: Kiambishi cha yambwa wingi kinahifadhi rejeo la kiwakilishi kwa watu waliotajwa tayari bila kuwataja upya.
- source_word: Ἐλύμας
  choice: Elima
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: ὁ μάγος
  choice: yule mchawi
  rationale: “Mchawi” ni neno linaloeleweka kwa urahisi kwa mtu anayehusishwa na uchawi; “yule” inaonyesha apposition ya kumtambulisha Elima.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: maana hivyo ndivyo jina lake linavyotafsiriwa
  rationale: Inahifadhi maelezo ya mabano kwamba jina linatafsiriwa au kufasiriwa hivyo, bila kudai etimolojia fulani.
- source_word: ζητῶν
  choice: akijaribu
  rationale: Katika muktadha huu participio inaonyesha kusudi au jitihada zinazoambatana na upinzani wake; “akijaribu” ni ya asili katika Kiswahili cha sasa.
- source_word: διαστρέψαι
  choice: kumgeuza ... aiache
  rationale: Muundo huu unaonyesha kumshawishi mtu aondoke katika jambo, badala ya kupotosha wazo pekee.
- source_word: τὸν ἀνθύπατον
  choice: liwali huyo
  rationale: “Liwali” ni cheo cha Kiswahili kinachotumiwa kwa ἀνθύπατος na kinadumisha maana ya mtawala rasmi kuliko “gavana” ya jumla, ingawa si sawa kabisa na cheo cha Kirumi.
- source_word: ἀπὸ τῆς πίστεως
  choice: aiache imani
  rationale: Huwasilisha kwa Kiswahili cha asili wazo la kumgeuza mtu kutoka kwenye imani, huku neno “imani” likihifadhi uwezekano wa maana maalumu au ya jumla.
theological_decisions:
- issue: Maana ya πίστις
  choice: imani
  alternative: ile imani / kuamini
  rationale: Muktadha na kibainishi cha Kigiriki vinaweza kuelekeza kwenye imani ya Kikristo kama njia au ujumbe unaoaminiwa, lakini kifungu pia kinaweza kusikika kama tendo la kuitikia kwa kuamini. Matini kuu haitumii “ile” ili kutoondoa utata huo; tanbihi inaueleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha maelezo ya mabano ya Kigiriki na hali ya upinzani unaoendelea, huku ikitumia mtiririko wa asili wa Kiswahili. Alama zote za tanbihi zimo katika matini kuu.
