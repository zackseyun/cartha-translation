base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: sw
  text: Kisha wakaomba wapewe mfalme,[a] naye Mungu akawapa Sauli mwana wa Kishi, mtu wa kabila la Benyamini, kwa miaka arobaini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya hayo wakaomba wapewe mfalme.” Neno la mwanzo linaweza kutumika kama kiunganishi cha mpito katika mfuatano wa kihistoria.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya wasomaji huona kwamba maneno “kwa miaka arobaini” yanaweza kuzusha maswali ya mpangilio wa miaka yakilinganishwa na taarifa za Agano la Kale; tafsiri hii imehifadhi maneno ya Luka kama yalivyo.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Kisha
  rationale: Katika muhtasari huu wa kihistoria, neno hili linaendeleza mfuatano wa matukio. “Kisha” ni ya asili katika Kiswahili na huhifadhi dhima yake ya mpito bila kulazimisha maana halisi ya mahali.
- source_word: ᾐτήσαντο βασιλέα
  choice: wakaomba wapewe mfalme
  rationale: Kauli hii inaonyesha kwamba watu walijiombea mfalme. Muundo “wakaomba wapewe” ni wa kawaida na hauongezi ukali wa maana kama “wakadai.”
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: naye Mungu akawapa
  rationale: Huhifadhi Mungu kama mtendaji wa wazi na maana ya kawaida ya ἔδωκεν, yaani “akawapa,” badala ya kuibana kuwa “akamteua.”
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: Sauli mwana wa Kishi
  rationale: Majina yamefuata maumbo yaliyozoeleka katika Biblia za Kiswahili, na usemi wa nasaba umetafsiriwa kwa njia ya kawaida.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: mtu wa kabila la Benyamini
  rationale: “Mtu” humtaja Sauli binafsi kwa lugha ya asili; “wa kabila la Benyamini” huwasilisha asili yake ya kikabila kwa uwazi.
- source_word: ἔτη τεσσεράκοντα
  choice: kwa miaka arobaini
  rationale: Kirai cha akusativi kinaonyesha muda. “Kwa miaka arobaini” huunganishwa kwa kawaida na kipindi ambacho Mungu aliwapa Sauli.
theological_decisions:
- issue: Uhusiano wa kirai ἔτη τεσσεράκοντα
  choice: 'Kirai kimetafsiriwa kama muda unaohusiana na Mungu kuwapa Sauli: “kwa miaka arobaini.”'
  alternative: Kinaweza kueleweka kwa upana zaidi kama sehemu ya muhtasari wa kihistoria, huku wasomaji fulani wakiona swali la mpangilio wa miaka likilinganishwa na taarifa za Agano la Kale.
  rationale: Mpangilio wa Kiyunani kwa kawaida unaunganisha muda huu na kifungu kilichotangulia kuhusu Mungu kuwapa Sauli. Tafsiri huhifadhi kauli ya Luka bila kujaribu kuondoa mvutano wa kihistoria.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametumia maumbo ya Biblia yaliyozoeleka: Sauli, Kishi na Benyamini.'
