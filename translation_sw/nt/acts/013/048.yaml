  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: sw
  text: Mataifa waliposikia hayo[a], wakaanza kufurahi na kulitukuza neno la Bwana, nao wote waliokuwa wameteuliwa kwa ajili ya uzima wa milele wakaamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wameelekezwa kwenye uzima wa milele.” Kishirikishi cha Kigiriki kinaweza kueleweka kwa namna tofauti na wafafanuzi, lakini maana ya tendwa, “waliokuwa wameteuliwa,” ndiyo tafsiri ya moja kwa moja zaidi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: waliposikia hayo
  rationale: Kirai kishirikishi kinaonyesha mazingira ya vitendo vikuu. Kiswahili cha kawaida hutumia kishazi cha wakati; “hayo” limetolewa kutokana na ujumbe uliotangulia katika muktadha.
- source_word: τὰ ἔθνη
  choice: Mataifa
  rationale: Katika muktadha huu neno hilo linamaanisha watu wasio Wayahudi. “Mataifa” ni istilahi ya kibiblia iliyozoeleka katika Kiswahili na inahifadhi pia picha ya mataifa.
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: wakaanza kufurahi na kulitukuza
  rationale: Vitenzi vya wakati usiotimilifu vinaonyesha hali iliyoendelea na vinaweza kuwa na nguvu ya kuanza katika simulizi; muundo huu ni wa asili katika Kiswahili bila kugeuza maana kuwa tendo la mara moja tu.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: neno la Bwana
  rationale: “Neno” huhifadhi nahau ya kibiblia huku likirejelea ujumbe uliotangazwa; “Bwana” ni tafsiri ya kawaida ya κύριος.
- source_word: ἐπίστευσαν
  choice: wakaamini
  rationale: Wakati timilifu sahili wa simulizi unaonyeshwa kwa kitenzi cha mfululizo “wakaamini,” bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: ὅσοι
  choice: wote
  rationale: Katika muundo “wote waliokuwa…,” Kiswahili huonyesha kwa kawaida nguvu ya kiasi ya ὅσοι, yaani kila mmoja katika kundi linalofafanuliwa.
- source_word: τεταγμένοι
  choice: waliokuwa wameteuliwa
  rationale: 'Hii huhifadhi hali timilifu na sauti tendwa ya kishirikishi cha τάσσω: walikuwa katika hali ya kuwa wameteuliwa. Tafsiri mbadala ya kuelekezwa au kuwa na mwelekeo imewekwa katika tanbihi kwa sababu neno hili linajadiliwa.'
- source_word: εἰς ζωὴν αἰώνιον
  choice: kwa ajili ya uzima wa milele
  rationale: “Kwa ajili ya” huwasilisha mwelekeo au kusudi la εἰς kwa Kiswahili cha kawaida; “uzima wa milele” ni usemi wa kawaida wa kibiblia.
theological_decisions:
- issue: Maana ya τεταγμένοι kuhusu uteuzi na mwitikio wa wanadamu
  choice: waliokuwa wameteuliwa kwa ajili ya uzima wa milele
  alternative: waliokuwa wameelekezwa kwenye uzima wa milele; waliokuwa na mwelekeo wa kuupokea uzima wa milele
  rationale: Umbo la kishirikishi timilifu tendwa la τάσσω linaelekea zaidi kumaanisha kuteuliwa au kuwekwa. Tafsiri kuu inadumisha sauti tendwa bila kuongeza maelezo kuhusu mtendaji au mfumo mpana wa uteuzi wa kimungu. Tanbihi inalinda uwepo wa uelewa mbadala unaojadiliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Nahau za kibiblia “Mataifa,” “neno la Bwana,” na “uzima wa milele” zimehifadhiwa. Alama zote za tanbihi zimetumiwa katika matini kuu.
