revisions:
- from: Basi Paulo na Barnaba wakasema kwa ujasiri, “Ilikuwa lazima neno la Mungu lihubiriwe kwenu kwanza. Lakini kwa kuwa mnalikataa na kujihukumu wenyewe kuwa hamstahili uzima wa milele, tazameni, sasa tunawageukia watu wa mataifa.[a]”
  to: Basi Paulo na Barnaba wakasema kwa ujasiri, “Ilikuwa lazima neno la Mungu lihubiriwe kwenu kwanza. Kwa kuwa mnalikataa na mnajihukumu wenyewe kuwa hamstahili uzima wa milele, tazameni, tunawageukia watu wa Mataifa.[a]”
  rationale: The revision removes the adversative and temporal additions, preserving the Greek causal connection and present-tense turn. It also makes the paired actions syntactically parallel in natural Swahili while retaining the reflexive judicial sense.
  reviewer_model: gpt-5.6-terra
