id: ACT.13.46
reference: Acts 13:46
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: sw
  text: Basi Paulo na Barnaba wakasema kwa ujasiri, “Ilikuwa lazima neno la Mungu lihubiriwe kwenu kwanza. Kwa kuwa mnalikataa na mnajihukumu wenyewe kuwa hamstahili uzima wa milele, tazameni, tunawageukia watu wa Mataifa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mataifa.” Hapa usemi huu unamaanisha watu wasio Wayahudi, tofauti na wasikilizaji wa sinagogi.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: wakasema kwa ujasiri
  rationale: Kitenzi hiki huonyesha kusema kwa ujasiri na uwazi. Kiswahili hiki kinaunganisha hali ya kitendo na kitenzi kikuu kwa mtiririko wa kawaida bila kupoteza uzito wake.
- source_word: ἀναγκαῖον
  choice: ilikuwa lazima
  rationale: Huhifadhi maana ya ulazima au jambo lililopasa kufanywa, kwa lugha ya kawaida na yenye hadhi.
- source_word: λαληθῆναι τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu lihubiriwe
  rationale: Ingawa λαλέω kimsingi ni kusema, katika muktadha huu ujumbe unatolewa hadharani. ‘Lihubiriwe’ ni ya asili zaidi katika Kiswahili kuliko ‘lisemwe’ huku ikihifadhi tendo la kutangaza ujumbe.
- source_word: ἀπωθεῖσθε αὐτὸν
  choice: mnalikataa
  rationale: Kiswahili ‘mnalikataa’ huonyesha kukataa kwa sasa na kwa makusudi; kiambishi ‘-li-’ kinarejelea ‘neno la Mungu.’
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: kujihukumu wenyewe kuwa hamstahili
  rationale: ‘Kujihukumu’ huhifadhi nguvu ya kimahakama ya κρίνω na ‘wenyewe’ huhifadhi wazi maana ya kiwakilishi jirejeshi.
- source_word: τῆς αἰωνίου ζωῆς
  choice: uzima wa milele
  rationale: Hili ni tamko la kawaida, wazi, na lenye hadhi katika Kiswahili cha Biblia kwa dhana ya maisha yasiyo na mwisho.
- source_word: στρεφόμεθα εἰς τὰ ἔθνη
  choice: sasa tunawageukia watu wa mataifa
  rationale: ‘Tunawageukia’ huhifadhi picha ya kugeuka kuelekea kundi jingine; ‘watu wa mataifa’ huonyesha kuwa kinacholengwa ni watu wasio Wayahudi, si maeneo ya kijiografia pekee.
theological_decisions:
- issue: Maana ya τὰ ἔθνη katika muktadha wa historia ya wokovu
  choice: watu wa mataifa
  alternative: mataifa; watu wasio Wayahudi
  rationale: Muktadha unatofautisha wasikilizaji wa sinagogi na watu wa mataifa mengine. ‘Watu wa mataifa’ huhifadhi istilahi ya kibiblia na pia kuelekeza kwa watu, bila kuifanya kuwa rejeo la kijiografia tu.
- issue: Nguvu ya οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς
  choice: kujihukumu wenyewe kuwa hamstahili uzima wa milele
  alternative: Paulo anawahukumu kuwa hawastahili uzima wa milele
  rationale: Kigiriki kinaweka tendo la kuhukumu kwa wasikilizaji wenyewe. Tafsiri huhifadhi maana hiyo ya kujirejelea bila kuongeza hitimisho pana la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Basi’ linaunganisha kauli na muktadha uliotangulia; ‘tazameni’ huhifadhi ἰδού kama mwito wa kusikiliza kwa makini. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
