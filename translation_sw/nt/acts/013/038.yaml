base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: sw
  text: Basi, ijulikane kwenu, ndugu[a], kwamba kupitia kwake[b] msamaha wa dhambi unatangazwa kwenu, na kutoka katika mambo yote ambayo hamkuweza kuhesabiwa haki[c] kwa Sheria ya Musa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mwito wa Kigiriki una maumbo ya kiume, “wanaume, ndugu”; hata hivyo, unaweza kueleweka kuwa unaielekea hadhira yote iliyokusanyika.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Yesu, aliyetajwa katika mistari iliyotangulia.
    reason: cross_reference
  - marker: c
    text: Au, “kutangazwa kuwa wenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Basi, na ijulikane kwenu
  rationale: Muundo huu unahifadhi kiunganishi οὖν na nguvu ya tangazo la kauli ya kuamuru, huku ukibaki wa asili na wenye hadhi katika Kiswahili.
- source_word: ἄνδρες ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kifamilia unaoeleweka kwa kawaida katika Kiswahili. Maumbo ya Kigiriki ni ya kiume, lakini neno la Kiswahili linaweza pia kutumiwa kwa hadhira yenye wanawake na wanaume; tanbihi inaeleza uwezekano huo.
- source_word: διὰ τούτου
  choice: kwa njia ya huyu
  rationale: Kiwakilishi cha kuonyesha cha kiume kinamrejelea Yesu aliyetajwa katika muktadha uliotangulia. Tafsiri hii haiingizi nomino isiyokuwapo katika Kigiriki.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: msamaha wa dhambi
  rationale: Hii ndiyo tafsiri ya kawaida, wazi, na sahihi ya dhana ya kuondolewa hatia ya dhambi katika muktadha huu.
- source_word: καταγγέλλεται
  choice: mnatangaziwa
  rationale: Kauli tendwa ya wakati uliopo inaonyesha kwamba msamaha unatangazwa hadharani kwa wasikilizaji.
- source_word: ἀπὸ πάντων ὧν
  choice: katika mambo yote ambayo
  rationale: Kiswahili cha kawaida hakihitaji kurudia kihusishi sawasawa na Kigiriki. Kauli hii inaendeleza wazo linalokamilishwa katika mstari unaofuata bila kulazimisha hitimisho ndani ya mstari huu.
- source_word: οὐκ ἠδυνήθητε
  choice: hamkuweza
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kutoweza kulikotajwa katika kitenzi.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: kwa Sheria ya Musa
  rationale: “Kwa” linaonyesha chombo au njia inayohusishwa na δικαιωθῆναι, bila kufuta kabisa wazo la kuwa ndani ya mfumo wa Sheria ya Musa.
- source_word: δικαιωθῆναι
  choice: kuhesabiwa haki
  rationale: Kauli hii inahifadhi uzito wa kimahakama na kitheolojia wa δικαιόω na ni ya kawaida katika Kiswahili cha Biblia. Tanbihi inatoa ufafanuzi wa karibu bila kuifanya dhana kuwa mabadiliko ya kimaadili pekee.
theological_decisions:
- issue: Maana ya δικαιωθῆναι kuhusiana na Sheria ya Musa
  choice: kuhesabiwa haki
  alternative: kutangazwa kuwa mwenye haki
  rationale: “Kuhesabiwa haki” huhifadhi istilahi ya kitheolojia pamoja na maana yake ya kimahakama. Mbadala umewekwa katika tanbihi ili kusaidia kueleweka bila kuamua kupita kiasi aina kamili ya kitendo kinachokusudiwa.
- issue: Mwito wa ἄνδρες ἀδελφοί
  choice: ndugu
  alternative: ndugu wanaume; au ndugu wanaume na wanawake kwa maana jumuishi
  rationale: Kigiriki kina maumbo ya kiume, lakini “ndugu” ni mwito wa asili katika Kiswahili na linaweza kuwa jumuishi kulingana na hadhira. Tanbihi inahifadhi taarifa hiyo ya asili na utata wa marejeo.
- issue: Kikomo cha mstari na kishazi kinachoendelea
  choice: kuacha mstari ukiishia kwa alama ya mfululizo (—)
  alternative: kuongeza “kila anayeamini anahesabiwa haki” kutoka Matendo 13:39
  rationale: Chanzo cha SBLGNT kilichotolewa kwa Matendo 13:38 kinaishia kwa δικαιωθῆναι na kisarufi kinaendelea katika mstari wa 39. Kuongeza kishazi cha mstari unaofuata kungevuka mipaka ya maandishi ya chanzo yaliyotolewa. Alama ya mfululizo inaonyesha kwa uaminifu kwamba sentensi haijakamilika hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Sheria” imeandikwa kwa herufi kubwa kwa kuwa hapa inarejelea hasa Sheria ya Musa. Mstari umeachwa ukiendelea kwa alama ya mfululizo kwa sababu chanzo kilichotolewa hakina kishazi cha Matendo 13:39 ambacho hukamilisha sentensi.
