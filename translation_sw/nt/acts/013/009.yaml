  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: sw
  text: Lakini Sauli, ambaye pia aliitwa Paulo[a], akiwa amejazwa Roho Mtakatifu, akamkazia macho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye pia alikuwa Paulo.”
    reason: Kigiriki ὁ καὶ Παῦλος kinaweza kutafsiriwa kwa namna ya karibu zaidi na muundo wake kuwa ‘ambaye pia alikuwa Paulo’; maana katika muktadha ni kwamba Sauli alijulikana pia kama Paulo.
lexical_decisions:
- source_word: Σαῦλος
  choice: Sauli
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: δέ
  choice: Lakini
  rationale: Inaonyesha geuko dogo lenye utofautishaji kutoka kwa tendo la Elima kwenda kwa jibu la Sauli.
- source_word: ὁ καὶ Παῦλος
  choice: ambaye pia aliitwa Paulo
  rationale: Muundo huu unamtambulisha Sauli kwa jina lake jingine. Tafsiri hii ni ya asili katika Kiswahili bila kueleza sababu ya matumizi ya majina hayo mawili.
- source_word: πλησθεὶς
  choice: akiwa amejazwa
  rationale: Inahifadhi maana ya kauli tendwa ya participio ya wakati uliopita na inaunganika kwa kawaida na kitendo kinachofuata.
- source_word: πνεύματος ἁγίου
  choice: Roho Mtakatifu
  rationale: Katika muktadha wa Matendo, kifungu hiki kinamrejelea Roho wa Mungu; Kiswahili hakihitaji kuongeza kibainishi sawa na ‘the’ ya Kiingereza.
- source_word: ἀτενίσας
  choice: akamkazia macho
  rationale: Inaeleza kumtazama mtu kwa makini na kwa uthabiti, kwa lugha ya kawaida na yenye nguvu inayofaa muktadha.
- source_word: εἰς αὐτόν
  choice: -mkazia
  rationale: Kiambishi cha yambwa ‘-m-’ katika ‘akamkazia’ kinaonyesha wazi kwamba macho ya Sauli yalielekezwa kwa Elima.
theological_decisions:
- issue: Maana ya πνεύματος ἁγίου
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Matumizi ya Luka katika Matendo na muktadha wa kuwezeshwa yanaonyesha kwamba anayerejelewa ni Roho Mtakatifu wa Mungu, si roho fulani yenye sifa ya utakatifu.
- issue: Uhusiano wa majina Sauli na Paulo
  choice: ambaye pia aliitwa Paulo
  alternative: ambaye pia alikuwa Paulo
  rationale: Kigiriki kinamtambulisha mtu yuleyule kwa jina la pili bila kusema kwamba jina lake lilibadilishwa wakati huo. ‘Aliitwa pia’ huwasilisha majina mawili bila kudai badiliko la jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akamkazia macho’ ni usemi wa kawaida unaohifadhi nguvu ya ἀτενίσας. Sentensi inaachwa bila yambwa kutajwa kwa jina kwa kuwa ‘-m-’ humrejelea Elima wazi kutokana na muktadha.
