  text: But God raised him from the dead.
translation:
  language: sw
  text: Lakini Mungu alimfufua kutoka kwa wafu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti na tendo la wanadamu katika mstari uliotangulia; “Lakini” linahifadhi nguvu hiyo ya upinzani kwa Kiswahili cha kawaida.
- source_word: θεὸς
  choice: Mungu
  rationale: Nomino hii inamtaja Mungu moja kwa moja kuwa mtendaji wa tendo hilo.
- source_word: ἤγειρεν
  choice: alimfufua
  rationale: Katika muktadha wa ufufuo, ἐγείρω humaanisha kumwinua mtu kutoka mautini; “alimfufua” ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: αὐτὸν
  choice: -m- katika “alimfufua”
  rationale: Kiwakilishi hiki kinamrejelea Yesu; katika Kiswahili sanifu kinaonyeshwa kwa kiambishi cha yambwa -m- ndani ya kitenzi.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Huu ni usemi wa ufufuo unaoonyesha kutoka miongoni mwa waliokufa; “kutoka kwa wafu” ni wa kawaida, mfupi, na unahifadhi taswira ya Kigiriki.
theological_decisions:
- issue: Usemi wa ufufuo
  choice: Lakini Mungu alimfufua kutoka kwa wafu.
  alternative: Lakini Mungu alimwinua kutoka kwa wafu.
  rationale: “Alimfufua” linaeleza wazi tendo la Mungu la kumrudisha Yesu kutoka mautini bila kuongeza maelezo yasiyomo katika Kigiriki. “Alimwinua” linawezekana kimsingi, lakini kwa Kiswahili linaweza kueleweka kama kuinua kimwili bila kuashiria ufufuo kwa uwazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi, na yenye heshima. Muundo mfupi wa chanzo umehifadhiwa bila ufafanuzi wa ziada.
