base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: sw
  text: Baada ya mkutano wa sinagogi kumalizika[a], wengi wa Wayahudi na waongofu wa dini ya Kiyahudi waliomcha Mungu walifuata Paulo na Barnaba, ambao walipokuwa wakizungumza nao waliwahimiza waendelee katika neema ya Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya mkutano wa sinagogi kuvunjika.” Neno la Kigiriki hapa linaweza kurejelea kusanyiko lililotawanywa baada ya mkutano, wala si jengo la sinagogi.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliwashawishi wabaki katika neema ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: Baada ya kusanyiko la sinagogi kumalizika
  rationale: Kirai huru cha uhusiano huonyesha hali iliyotangulia. Hapa συναγωγή linaelekea kumaanisha mkutano uliokusanyika, na λυθείσης kufungwa au kumalizika kwa mkutano huo, si kuondolewa kwa jengo.
- source_word: ἠκολούθησαν
  choice: walifuata
  rationale: Hutoa maana ya moja kwa moja ya watu kwenda baada ya Paulo na Barnaba, huku uwezekano wa maana pana ya kuwa wafuasi ukibaki katika muktadha.
- source_word: τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: Wayahudi wengi na waongofu wacha Mungu
  rationale: προσήλυτοι ni watu waliogeukia dini ya Kiyahudi, si wasikilizaji wenye kuvutiwa tu; σεβόμενοι inaonyesha uchaji wao. 'Waongofu wacha Mungu' ni Kiswahili cha kawaida na hutofautisha kundi hili na watu wanaomcha Mungu ambao hawakuwa waongofu kamili.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: walipokuwa wakizungumza nao
  rationale: Huwasilisha kitendo kinachoendelea sambamba na kuhimiza, bila kuongezea wazo lisilo wazi la hotuba rasmi.
- source_word: ἔπειθον
  choice: waliwahimiza
  rationale: Wakati usiotimilifu unaonyesha tendo lililoendelea; katika muktadha, πείθω ina nguvu ya kusihi au kuhimiza, ingawa pia inaweza kumaanisha kushawishi.
- source_word: αὐτοὺς προσμένειν
  choice: waendelee
  rationale: προσμένω hapa humaanisha kubaki, kudumu, au kuendelea katika jambo fulani. 'Waendelee' ni ya asili na haisisitizi zaidi ya chanzo.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: katika neema ya Mungu
  rationale: Muundo huu huhifadhi usemi wa Kigiriki na upana wake wa kitheolojia bila kuufasiri kuwa kibali cha Mungu pekee au ujumbe kuhusu neema pekee.
theological_decisions:
- issue: Maana ya kuendelea katika neema ya Mungu
  choice: katika neema ya Mungu
  alternative: katika kibali cha neema cha Mungu; katika ujumbe wa neema ya Mungu
  rationale: Usemi wa chanzo unaweza kuhusisha tendo la Mungu lenye neema na maisha yanayoongozwa na neema hiyo. Tafsiri haifungi maana katika ufafanuzi mmoja wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. 'Kusanyiko la sinagogi' huepuka picha isiyo ya kawaida ya jengo lenyewe kufukuzwa, na 'waongofu wacha Mungu' hudumisha tofauti ya kihistoria kati ya waongofu wa Uyahudi na watu wengine waliomcha Mungu.
