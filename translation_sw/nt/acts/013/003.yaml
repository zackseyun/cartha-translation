  text: τότε νηστεύσαντες καὶ προσευξάμενοι καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: sw
  text: Kisha[a], baada ya kufunga, kuomba, na kuwawekea mikono, wakawaacha waende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ndipo.” Neno hili linaonyesha jambo lililofuata baada ya agizo lililotangulia. Maneno “wakawaacha waende” yanaweza pia kutafsiriwa “wakawaaga” au “wakawaruhusu waondoke.” Katika muktadha huu, Barnaba na Sauli waliondoka kwenda katika kazi waliyoitiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Kielezi hiki kinaonyesha hatua iliyofuata baada ya agizo la Roho Mtakatifu; “Kisha” ni cha kawaida na huonyesha mfuatano kwa uwazi.
- source_word: νηστεύσαντες
  choice: baada ya kufunga
  rationale: Kauli ya wakati uliopita inaonyesha tendo lililotangulia kitenzi kikuu; “baada ya kufunga” huwasilisha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: προσευξάμενοι
  choice: kuomba
  rationale: Tendo hili limeratibiwa na kufunga na kuwawekea mikono; muundo wa “baada ya” unaendelea kutawala orodha nzima kwa njia ya asili.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: kuwawekea mikono
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi tendo halisi la kuweka mikono bila kulifasiri moja kwa moja kuwa ibada maalumu ya dhehebu.
- source_word: ἀπέλυσαν
  choice: wakawaacha waende
  rationale: Kitenzi kinaweza kumaanisha kuwaachilia, kuwaaga, au kuwaruhusu waondoke. Katika muktadha huu Barnaba na Sauli waliruhusiwa kuondoka kwenda katika kazi waliyoitiwa; chaguo hili linahifadhi maana hiyo bila kudokeza kwamba jumuiya ndiyo chanzo cha utume wao.
- source_word: αὐτοῖς
  choice: -wa- / wao
  rationale: Kiwakilishi kinawarejelea Barnaba na Sauli; katika Kiswahili kimewakilishwa kimaumbo ndani ya “kuwawekea” na “wakawaacha.”
theological_decisions:
- issue: Maana ya kuwawekea mikono
  choice: Tendo limeelezwa tu kama “kuwawekea mikono,” bila kulitaja kuwa kuwekwa wakfu, baraka, au ibada rasmi ya kutumwa.
  alternative: Kuwekwa wakfu; kubarikiwa; kutumwa rasmi
  rationale: Aya inataja kufunga, kuomba, kuwawekea mikono, na kuwaacha waende, lakini haifafanui hadhi ya kikanisa au maana ya kisakramenti ya tendo hilo. Tafsiri inapaswa kuhifadhi mvutano huo.
- issue: Wakala katika kuondoka kwa Barnaba na Sauli
  choice: “Wakawaacha waende”
  alternative: “Wakawatuma”
  rationale: Muktadha wa karibu unasema Roho Mtakatifu ndiye aliyewaita, na mstari unaofuata unasema walitumwa na Roho Mtakatifu. “Wakawaacha waende” huhifadhi maana pana ya ἀπέλυσαν na huepuka kuamua kwamba viongozi wa jumuiya ndio waliokuwa chanzo cha utume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa kawaida, huku ukihifadhi mfuatano wa matendo ya Kigiriki na kutofafanua kupita kiasi maana ya kitheolojia ya kuwawekea mikono.
