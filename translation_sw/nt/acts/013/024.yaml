  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: sw
  text: Kabla ya kuja kwake[a], Yohana alikuwa amewatangazia watu wote wa Israeli ubatizo wa toba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kabla ya kuwasili kwake.” Kigiriki kinasema kihalisi “mbele ya uso wa kuingia kwake,” msemo unaomaanisha kutangulia kuja kwa mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ubatizo kwa ajili ya toba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: alikuwa amewatangazia
  rationale: Kitenzi hiki kinaonyesha tangazo la hadharani lililotolewa mapema. Muundo wa wakati uliotangulia unaonyesha kwamba tangazo la Yohana lilitangulia kuja kwa yule anayezungumziwa.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: kabla ya kuja kwake
  rationale: Huu ni msemo unaomaanisha kutangulia kuwasili au kuonekana kwa mtu. Tafsiri hii ni ya kawaida katika Kiswahili na haifuati kihalisi msemo ‘mbele ya uso wa kuingia kwake.’
- source_word: εἰσόδου
  choice: kuja
  rationale: Ingawa neno lenyewe linaweza kumaanisha kuingia au kuwasili, hapa linarejelea kuja kwa yule ambaye Yohana alimtangulia.
- source_word: βάπτισμα μετανοίας
  choice: ubatizo wa toba
  rationale: Muundo huu unahifadhi uhusiano wa kisarufi kati ya ubatizo na toba bila kuamua kimyakimya kama toba ni kusudi, sharti, au sifa ya ubatizo huo.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: watu wote wa Israeli
  rationale: Tafsiri hii inahifadhi maana ya jumla ya παντί na inamtaja Israeli kama taifa au jamii ya watu.
- source_word: Ἰωάννου
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina Ἰωάννης katika Biblia ya Kiswahili.
theological_decisions:
- issue: Anayerejelewa na kiwakilishi katika ‘kuja kwake’
  choice: Kiwakilishi kimeachwa kama kilivyo katika Kigiriki; katika muktadha kinamrejelea Yesu, Mwokozi wa ukoo wa Daudi.
  alternative: Kutaja wazi ‘kabla ya kuja kwa Yesu.’
  rationale: Muktadha wa Matendo 13:23–25 unamtambulisha anayerejelewa, lakini mstari huu wenyewe unatumia kiwakilishi. Kukihifadhi huepuka kuongeza jina lisilopatikana katika mstari huu.
- issue: Uhusiano kati ya ubatizo na toba
  choice: ubatizo wa toba
  alternative: ubatizo kwa ajili ya toba
  rationale: Kirai cha Kigiriki βάπτισμα μετανοίας kinaweza kueleweka kwa zaidi ya namna moja. Muundo ‘wa toba’ huhifadhi ufupi na mvutano huo bila kulazimisha tafsiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. ‘Alikuwa amewatangazia’ hutiririka kwa kawaida huku ikionyesha wazi kuwa huduma ya Yohana ilitangulia kuja kwa Yesu.
