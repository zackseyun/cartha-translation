base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: sw
  text: Baada ya kuondoka kwa meli kutoka Pafo, wale waliokuwa pamoja na Paulo[a] wakafika Perga katika Pamfilia; lakini Yohana akaondoka kwao, akarejea Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Paulo na wenzake”; kihalisi, “wale walio karibu na Paulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: wakaondoka kwa meli
  rationale: Katika simulizi za safari, ἀνάγω humaanisha kuondoka au kuanza safari baharini. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi maana ya safari ya majini.
- source_word: οἱ περὶ Παῦλον
  choice: wale waliokuwa pamoja na Paulo
  rationale: Nahau hii humaanisha kundi lililohusishwa na Paulo. Tafsiri hii inafuata muundo wa Kigiriki bila kulazimisha neno 'wenzake' au kutaja majukumu yao.
- source_word: ἦλθον
  choice: wakafika
  rationale: Katika muktadha wa safari yenye mahali panapotajwa, 'wakafika' ni Kiswahili cha kawaida na huonyesha mwisho wa hatua hiyo ya safari.
- source_word: Πέργην τῆς Παμφυλίας
  choice: Perge katika Pamfilia
  rationale: Hali ya umilikishi katika Kigiriki inaonyesha kwamba Perge ilikuwa katika eneo la Pamfilia; 'katika' ni usemi wa kawaida wa mahali katika Kiswahili.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: akaachana nao
  rationale: ἀποχωρέω humaanisha kuondoka au kujitenga. 'Akaachana nao' inaeleza kitendo bila kubainisha sababu au kutoa hukumu ya kimaadili.
- source_word: ὑπέστρεψεν
  choice: kurudi
  rationale: ὑποστρέφω kwa kawaida humaanisha kurudi; muundo 'akaachana nao na kurudi' ni wa asili katika Kiswahili.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mji huo.
theological_decisions:
- issue: Maana inayoweza kudhaniwa kuhusu kuondoka kwa Yohana
  choice: Kitendo kimeelezwa bila upande wowote kwa maneno 'akaachana nao,' bila kudokeza kwamba aliwakimbia au aliacha imani.
  alternative: akaondoka kwao; akajitenga nao; akawaacha
  rationale: Mstari huu unasema tu kwamba Yohana aliondoka katika kundi hilo na kurudi Yerusalemu. Hautoa sababu wala hukumu ya kimaadili, hivyo tafsiri haipaswi kuingiza tathmini inayotokana na muktadha wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Muundo wa vitenzi mfululizo unaendeleza mtiririko wa safari. Alama ya tanbihi [a] imewekwa mara tu baada ya Pafo ili kuepuka kukatiza kirai kinachoeleza kundi, huku tanbihi yenyewe ikifafanua nahau ya Kigiriki.
