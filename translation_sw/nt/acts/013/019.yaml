  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: sw
  text: Baada ya kuyaangamiza mataifa saba katika nchi ya Kanaani, akawapa Waisraeli nchi ya mataifa hayo kuwa urithi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawagawia Waisraeli nchi ya mataifa hayo kuwa urithi.” Kitenzi cha Kigiriki kinaweza kukazia kugawa au kupangia urithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: baada ya kuyaangamiza
  rationale: Katika muktadha wa kutekwa kwa Kanaani, kitenzi hiki kinaeleza kuyaondoa kabisa mataifa hayo kwa ushindi. “Kuyaangamiza” ni wazi na cha kawaida katika Kiswahili, huku muundo “baada ya” ukihifadhi uhusiano wa kishiriki cha wakati.
- source_word: ἔθνη ἑπτὰ
  choice: mataifa saba
  rationale: “Mataifa” ndilo neno la kawaida na linalofaa kwa makundi ya watu wa Kanaani yanayotajwa katika simulizi hili la kihistoria.
- source_word: ἐν γῇ Χανάαν
  choice: katika nchi ya Kanaani
  rationale: Tafsiri hii inahifadhi neno γῇ, “nchi,” badala ya kufupisha usemi kuwa “Kanaani” pekee.
- source_word: κατεκληρονόμησεν
  choice: akawapa Waisraeli ... kuwa urithi
  rationale: Kitenzi kinaweza kueleza kutoa au kugawa mali kuwa urithi. Kiswahili hiki kinadumisha wazo la urithi na kinamtaja mpokeaji anayeeleweka kutokana na muktadha.
- source_word: τὴν γῆν αὐτῶν
  choice: nchi yao
  rationale: Kiwakilishi αὐτῶν kinarejelea mataifa saba yaliyotangulia kutajwa; hivyo “nchi yao” ni tafsiri ya moja kwa moja na ya asili.
theological_decisions:
- issue: Mtendaji na mpokeaji aliyedokezwa wa urithi
  choice: Mungu ndiye mtendaji, naye aliwapa Waisraeli nchi ya yale mataifa kuwa urithi.
  alternative: Mungu aliigawa nchi yao / aliwapa nchi yao kwa kura.
  rationale: Muktadha wa karibu unasimulia matendo ya Mungu katika historia ya Israeli. Ingawa Kigiriki hakimtaji mpokeaji kwa jina, muktadha wa kihistoria unaonyesha kuwa Waisraeli ndio waliopokea nchi. Kumtaja Mungu tena si lazima kwa Kiswahili kwa sababu ndiye kiima kinachoendelea kutoka mistari iliyotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unafuata mtiririko wa Kigiriki bila kuwa mgumu, na neno “urithi” linahifadhi dhamira muhimu ya chanzo.
