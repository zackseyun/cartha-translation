  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: sw
  text: Yeye aliwatokea kwa siku nyingi wale waliopanda pamoja naye kutoka Galilaya kwenda Yerusalemu, nao sasa ni mashahidi wake kwa watu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alionekana kwao kwa siku nyingi.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa namna hii iliyo rasmi zaidi, hasa katika habari za kuonekana baada ya ufufuo.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “watu” huenda inawarejelea hasa Wayahudi, yaani watu wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Yeye
  rationale: Kiwakilishi hiki kinamrejelea Yesu katika mstari uliotangulia; “Yeye” huanzisha sentensi kwa kawaida katika Kiswahili bila kubadili rejeleo.
- source_word: ὤφθη
  choice: aliwatokea
  rationale: Katika muktadha wa kuonekana baada ya ufufuo, kitenzi hiki kina maana ya kujionyesha au kuonekana kwa watu; “aliwatokea” ni lugha ya kawaida na huonyesha wazi wale waliomwona.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: kwa siku nyingi
  rationale: Kirai hiki huonyesha muda ambao matukio hayo yaliendelea.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: wale waliokuwa wamepanda pamoja naye
  rationale: Huhifadhi maana ya kuandamana naye katika safari ya kwenda juu Yerusalemu, na umbo la wakati huonyesha safari iliyotangulia matukio ya kuonekana.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: kutoka Galilaya kwenda Yerusalemu
  rationale: Huwasilisha moja kwa moja mwanzo na mwisho wa safari.
- source_word: οἵτινες νῦν εἰσὶν
  choice: nao sasa ni
  rationale: “Nao” huunganisha kwa kawaida kundi lililotajwa na hali yao ya sasa kama mashahidi.
- source_word: μάρτυρες αὐτοῦ
  choice: mashahidi wake
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wao na Yesu na ushuhuda unaomhusu.
- source_word: πρὸς τὸν λαόν
  choice: mbele ya watu
  rationale: πρός hapa huelekeza ushuhuda kwa hadhira; “mbele ya watu” linafaa kwa jukumu la kutoa ushahidi kwao bila kupanua λαός kuwa jina la taifa.
theological_decisions:
- issue: Lugha kuhusu kuonekana kwa Yesu baada ya ufufuo
  choice: aliwatokea
  alternative: alionekana kwao
  rationale: “Aliwatokea” ni Kiswahili cha kawaida kwa matukio ya kuonekana baada ya ufufuo na hakipunguzi uzito wa ushuhuda wa kihistoria; tanbihi huhifadhi tafsiri rasmi zaidi.
- issue: Wanaorejelewa na λαός
  choice: watu
  alternative: watu wa Israeli
  rationale: Muktadha unaelekea kwa watu wa Israeli, lakini Kigiriki hakiongezi jina “Israeli”; matini kuu inadumisha upana wa neno lenyewe na tanbihi inaeleza muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili kwa wasomaji wa kawaida, huku ukihifadhi taswira ya kupanda kwenda Yerusalemu na kutotaja Israeli moja kwa moja katika matini kuu.
