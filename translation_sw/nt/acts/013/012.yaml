  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: sw
  text: Ndipo yule prokonsuli alipoona yaliyotokea, akaamini, akishangazwa na mafundisho ya Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho yanayotoka kwa Bwana” au “mafundisho yanayomhusu Bwana.” Muundo wa umilikishi katika Kigiriki unaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha mfuatano wa matukio katika simulizi kwa Kiswahili cha kawaida na kifupi.
- source_word: ἰδὼν
  choice: alipoona
  rationale: Kishiriki cha wakati uliopita kimewasilishwa kama kishazi cha wakati, kikihifadhi uhusiano wake na kitenzi kikuu.
- source_word: ὁ ἀνθύπατος
  choice: yule liwali wa Kirumi
  rationale: Neno ἀνθύπατος ni cheo maalumu cha mtawala wa jimbo la Kirumi; nyongeza 'wa Kirumi' humsaidia msomaji wa kawaida bila kulifanya kuwa neno la jumla tu kama 'gavana'.
- source_word: τὸ γεγονός
  choice: yaliyotokea
  rationale: Huwasilisha kwa kawaida tukio lililokuwa limetimia na kuonekana, bila kulazimisha nomino nzito kama 'tukio'.
- source_word: ἐπίστευσεν
  choice: akaamini
  rationale: Hifadhi usemi mfupi wa Kigiriki usio na yambwa iliyotajwa; muktadha ndio unaoelekeza maana ya imani hiyo.
- source_word: ἐκπλησσόμενος
  choice: huku akistaajabishwa
  rationale: Huhifadhi nguvu ya kishiriki kinachoonyesha hali iliyoandamana na kuamini kwake, pamoja na maana ya mshangao mkubwa.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: na mafundisho
  rationale: Katika muundo 'akistaajabishwa na,' Kiswahili hutumia 'na' kwa kitu kilichosababisha au kuwa msingi wa mshangao.
- source_word: τοῦ κυρίου
  choice: ya Bwana
  rationale: Muundo wa Kiswahili unahifadhi uhusiano mpana wa umilikishi/uhusishaji wa genitivi bila kuamua kama mafundisho yanatoka kwa Bwana au yanamhusu Bwana.
theological_decisions:
- issue: Maana ya πιστεύω bila yambwa dhahiri
  choice: akaamini
  alternative: akamwamini Bwana; akauamini ujumbe
  rationale: Kigiriki hakitaji yambwa. Tafsiri haiongezi kwa wazi kitu ambacho muktadha pekee unadokeza.
- issue: Maana ya genitivi katika τοῦ κυρίου
  choice: mafundisho ya Bwana
  alternative: mafundisho kutoka kwa Bwana; mafundisho kumhusu Bwana
  rationale: Kirai 'ya Bwana' kinaacha wazi iwapo ni mafundisho yanayotoka kwake, yaliyo yake, au yanayomhusu, hivyo kuhifadhi utata halisi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Liwali wa Kirumi' limetumiwa kuhifadhi umaalumu wa cheo cha ἀνθύπατος huku likieleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai husika.
