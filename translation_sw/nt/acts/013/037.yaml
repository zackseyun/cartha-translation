    text: Au, “uozo.” Neno la Kigiriki linaweza kumaanisha kuharibika au kuoza kwa mwili; usemi huu unarudia neno linalopatikana katika Zaburi 16:10 katika Septuajinti.
    reason: lexical_alternative
  revision_rationale: Marekebisho yanafafanua maana ya διαφθοράν kuwa kuharibika kwa mwili katika muktadha wa ufufuo, huku yakihifadhi tamathali ya Kigiriki ya “kuona” na sauti ya kifungu cha Zaburi. Tanbihi imerekebishwa ili kueleza kwa usahihi mwangwi wa Septuajinti.
