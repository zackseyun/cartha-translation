  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: sw
  text: Lakini yule ambaye Mungu alimfufua hakuona uharibifu wa mwili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uozo.” Neno la Kigiriki linaweza kumaanisha kuharibika au kuoza kwa mwili; usemi huu unarudia neno linalopatikana katika Zaburi 16:10 katika Septuajinti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: yule ambaye
  rationale: Kiwakilishi hiki cha uhusiano kinamrejelea Yesu kama mtu anayezungumziwa; “yule ambaye” ni usemi wa kawaida wa Kiswahili na hauongezi taarifa mpya.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti kati ya Daudi aliyetajwa katika mstari uliotangulia na yule ambaye Mungu alimfufua.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa θεός katika muktadha huu.
- source_word: ἤγειρεν
  choice: alimfufua
  rationale: Katika muktadha huu kitenzi kinamaanisha Mungu kumfufua Yesu kutoka kwa wafu; “alimfufua” ni wazi na cha asili katika Kiswahili, bila kupanua zaidi ya maana inayothibitishwa na muktadha.
- source_word: οὐκ εἶδεν
  choice: hakuona
  rationale: Tafsiri hii inadumisha tamathali ya Kigiriki ya “kuona” uharibifu na mwangwi wake wa Zaburi 16.
- source_word: διαφθοράν
  choice: uharibifu
  rationale: “Uharibifu” huhifadhi upana wa neno la Kigiriki na mwangwi wa tafsiri ya Kigiriki ya Zaburi 16:10; katika muktadha linahusu kuharibika kwa mwili.
theological_decisions:
- issue: Maana ya ufufuo katika ἤγειρεν
  choice: alimfufua, yaani Mungu alimfufua Yesu kutoka kwa wafu
  alternative: alimwinua au alimtokeza
  rationale: Tofauti na Daudi aliyekufa na kuona uharibifu, huyu hakuuona kwa sababu Mungu alimfufua. Kwa hiyo muktadha wa karibu unaonyesha ufufuo kutoka kwa wafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kawaida, huku “hakuona uharibifu” ukihifadhi tamathali na mwangwi wa Maandiko ya Kigiriki.
