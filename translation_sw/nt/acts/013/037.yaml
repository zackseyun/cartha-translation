review_pass:
  verdict: revise
  source_fidelity: '"Alimfufua" accurately conveys ἤγειρεν in its resurrection sense. The Greek idiom "saw decay" is retained, but "uharibifu" alone is overly broad in current Swahili and can suggest destruction rather than postmortem bodily decay.'
  naturalness: The sentence is concise and has an appropriate formal biblical register. Adding "wa mwili" makes the intended sense clear and remains natural in Standard East African Swahili.
  terminology: '"Mungu" and "alimfufua" are appropriate. "Uharibifu wa mwili" is preferable here to unqualified "uharibifu." The footnote should identify the relevant Greek-scriptural connection accurately as Psalm 16:10 in the Septuagint, rather than vaguely referring to "Maandiko ya Kigiriki."'
  issues:
  - severity: medium
    issue: '"Uharibifu" is insufficiently specific for διαφθοράν in this context.'
    rationale: In Acts 13:36–37, διαφθορά denotes bodily decay after death. "Uharibifu" can naturally refer to damage, ruin, or destruction; "uharibifu wa mwili" conveys the contextual sense without abandoning the Greek idiom "see decay."
  - severity: low
    issue: The footnote's reference to "Maandiko ya Kigiriki" is imprecise.
    rationale: The echoed wording is from Psalm 16:10 as represented in the Septuagint (the Greek translation of the Scriptures), not a generic body called "Greek Scriptures."
  revised_text: Lakini yule ambaye Mungu alimfufua hakuona uharibifu wa mwili[a].
  revised_footnotes:
