  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: sw
  text: Nalo neno la Bwana lilikuwa likienezwa katika eneo lote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe wa Bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: lilikuwa likienezwa
  rationale: Kauli ya wakati uliopita isiotimilika na ya kutendwa inaonyesha tendo lililoendelea wakati huo; tafsiri hii inadumisha hali ya kuendelea na maana ya kutendwa.
- source_word: δὲ
  choice: Nalo
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi. “Nalo” linaunganisha sentensi kwa ufasaha bila kuingiza utofautishaji mkali.
- source_word: ὁ λόγος
  choice: neno
  rationale: “Neno” linadumisha mtindo unaojirudia katika Luka na Matendo, ambapo λόγος humaanisha ujumbe unaotangazwa; maana ya “ujumbe” inawekwa wazi katika tanbihi.
- source_word: τοῦ κυρίου
  choice: la Bwana
  rationale: Hifadhi ya jina “Bwana” inadumisha uzito wa kifasihi na kiteolojia wa κύριος bila kuipunguza kuwa lugha ya mamlaka pekee.
- source_word: δι’ ὅλης
  choice: katika ... lote
  rationale: Muundo huu wa Kiswahili unaonyesha kuenea kote ndani ya eneo, ukihifadhi wazo la ujumla katika ὅλης.
- source_word: τῆς χώρας
  choice: eneo
  rationale: “Eneo” humaanisha sehemu pana ya kijiografia inayozunguka mahali husika, bila kudokeza nchi ya kisasa yenye mipaka ya kitaifa.
theological_decisions:
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: mkuu
  rationale: “Bwana” ndiyo tafsiri ya kawaida inayohifadhi mwangwi wa Kikristo na wa kimaandiko wa neno hili katika Matendo, bila kulibana kuwa cheo cha mamlaka tu.
- issue: Maana ya λόγος
  choice: neno
  alternative: ujumbe
  rationale: “Neno” huhifadhi istilahi na mtindo wa Luka, huku tanbihi ikitambua wazi maana ya kimuktadha ya ujumbe unaotangazwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “lilikuwa likienezwa” ni wa kawaida na unaeleweka, huku ukihifadhi hali endelevu na sauti ya kutendwa ya Kigiriki.
