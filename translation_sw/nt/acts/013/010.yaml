  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: sw
  text: Akasema, “Ewe uliyejaa kila aina ya hila na kila aina ya uovu, mwana wa Ibilisi, adui wa uadilifu wote[a], je, hutaacha kuzipotosha njia za Bwana zilizonyooka?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “adui wa haki yote.” Neno la Kigiriki linaweza kumaanisha uadilifu au haki, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: uliyejaa kila aina ya hila
  rationale: Kifungu hiki kinaonyesha mtu aliyejaa au kutawaliwa na udanganyifu; ‘kila aina ya hila’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya παντός.
- source_word: πάσης ῥᾳδιουργίας
  choice: kila aina ya uovu
  rationale: ῥᾳδιουργία humaanisha tabia ovu isiyojali maadili, ujanja mbaya, au vitendo vya kihuni. ‘Kila aina ya uovu’ ni wazi kwa wasomaji wengi, ingawa ni pana kidogo kuliko neno la Kigiriki.
- source_word: υἱὲ διαβόλου
  choice: mwana wa Ibilisi
  rationale: ‘Mwana’ huhifadhi lugha halisi na kali ya υἱέ; hapa ni usemi wa kufanana kitabia au kuwa upande wa Ibilisi.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: adui wa haki yote
  rationale: ‘Haki’ katika Kiswahili inaweza kuhusisha uadilifu wa kimaadili na haki katika maana ya justice, hivyo inadumisha upana wa δικαιοσύνη.
- source_word: οὐ παύσῃ
  choice: je, hutaacha
  rationale: Wakati ujao wa Kigiriki umetumiwa kama swali kali la kukemea; ‘je, hutaacha’ ni wa asili na hauongezi maana ya ‘kamwe’.
- source_word: διαστρέφων
  choice: kuzipotosha
  rationale: ‘Kupotosha’ huonyesha kugeuza kutoka njia iliyonyooka na hufanya kazi vizuri na taswira ya njia.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: njia za Bwana zilizo ny直
  rationale: ‘Njia’ huhifadhi maana halisi na ya kitamathali ya ὁδοί, na ‘zilizo ny直’ huhifadhi tofauti kati ya njia ny直 na tendo la kuzipotosha.
- source_word: Ὦ
  choice: Ewe
  rationale: ‘Ewe’ ni mwito wa moja kwa moja unaofaa katika kauli kali na yenye hadhi bila kuwa mgumu kueleweka.
theological_decisions:
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ inaweza kumaanisha yaliyo sawa kimaadili na pia justice, hivyo inahifadhi mvutano wa kimaana wa δικαιοσύνη; tanbihi inataja ‘uadilifu’ kama tafsiri inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali umehifadhi ukali wa karipio, na taswira ya kuzipotosha njia zilizo ny直 imedumishwa.
