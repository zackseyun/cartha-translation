base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: sw
  text: Walipofika Salami,[a] walitangaza neno la Mungu katika masinagogi ya Wayahudi. Walikuwa pia na Yohana, msaidizi wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya kufika Salami.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yohana kama mhudumu wao” au “Yohana kama msaidizi wa huduma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: Walipofika Salami
  rationale: Kirai hiki chenye kitenzi kishirikishi cha wakati uliopita na mahali kinaonyesha kwa namna ya kawaida kufika mahali; muundo wa 'walipofika' ni wa asili katika Kiswahili na huhifadhi maana ya wakati.
- source_word: Σαλαμῖνι
  choice: Salami
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali Salamis.
- source_word: κατήγγελλον
  choice: walitangaza
  rationale: Kitenzi hiki humaanisha kutangaza au kueneza ujumbe hadharani; 'walitangaza' huhifadhi maana hiyo bila kuibana iwe mahubiri rasmi pekee.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Tafsiri hii ya moja kwa moja huhifadhi muundo wa asili na maana inayowezekana ya ujumbe au ufunuo wa Mungu.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: katika masinagogi ya Wayahudi
  rationale: '''Masinagogi'' hutaja kwa usahihi mahali au mikusanyiko ya ibada ya Kiyahudi, na katika muktadha huu Ἰουδαίων inawahusu Wayahudi kwa utambulisho wa kikabila na kidini.'
- source_word: εἶχον δὲ καὶ
  choice: Pia walikuwa na
  rationale: δέ ni kiunganishi cha mpito hafifu na καί huongeza wazo la 'pia'; Kiswahili hiki ni cha kawaida na huhifadhi nyongeza hiyo.
- source_word: Ἰωάννην
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina Ἰωάννης.
- source_word: ὑπηρέτην
  choice: akiwa msaidizi wao
  rationale: Neno hili linaweza kumaanisha msaidizi, mhudumu, au mtu anayehudumu chini ya mwingine. 'Msaidizi' linafaa katika muktadha wa safari ya huduma bila kuingiza wazo lenye nguvu zaidi la utumwa.
