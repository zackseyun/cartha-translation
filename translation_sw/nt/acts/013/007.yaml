  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: sw
  text: ambaye alikuwa pamoja na prokonsuli Sergio Paulo, mtu mwenye akili[a]. Huyu aliwaita Barnaba na Saulo, akataka kusikia neno la Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu mwenye ufahamu” au “mtu mwenye busara.”
    reason: lexical_alternative
  - marker: b
    text: Au “ujumbe wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: prokonsuli
  rationale: Ni cheo mahususi cha mtawala wa jimbo la Roma, hivyo ni sahihi zaidi kuliko neno la jumla kama “gavana” au “liwali.”
- source_word: σὺν
  choice: pamoja na
  rationale: Huwasilisha kwa kawaida uhusiano au kuwa katika kampuni ya mtu mwingine katika muktadha huu.
- source_word: ἀνδρὶ συνετῷ
  choice: mtu mwenye ufahamu
  rationale: Huhifadhi maana ya kuwa na akili, uelewa, au busara bila kudokeza kwa lazima sifa maalumu ya kiadili.
- source_word: οὗτος
  choice: Huyu
  rationale: Kiwakilishi hiki hudumisha msisitizo mdogo wa kurejea tena kwa Sergio Paulo baada ya maelezo yake.
- source_word: προσκαλεσάμενος
  choice: aliwaita
  rationale: Hueleza kwamba aliwaita Barnaba na Saulo waje kwake; Kiswahili hiki ni cha kawaida na hakiongezi wazo la kulazimisha ambalo haliko wazi katika chanzo.
- source_word: ἐπεζήτησεν
  choice: akataka
  rationale: Huwasilisha hamu au jitihada ya kutafuta kusikia ujumbe, kwa mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: ἀκοῦσαι
  choice: kusikia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa kupokea ujumbe unaotangazwa.
- source_word: λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Huhifadhi muundo wa Kigiriki na usemi wa kibiblia, huku katika muktadha ukimaanisha ujumbe unaotoka kwa Mungu.
- source_word: Σεργίῳ Παύλῳ
  choice: Sergio Paulo
  rationale: Majina yametoholewa kwa namna inayoendana na matamshi na matumizi ya kawaida ya Kiswahili.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnaba na Saulo
  rationale: Majina yametoholewa kwa kufuata matumizi yaliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Maana ya λόγον τοῦ θεοῦ
  choice: neno la Mungu
  alternative: ujumbe wa Mungu
  rationale: “Neno la Mungu” linafuata kwa karibu muundo wa chanzo na haliongezi maana ya kimadhehebu; tanbihi inadumisha maana halali ya “ujumbe wa Mungu.”
- issue: Maana ya συνετῷ katika kumweleza Sergio Paulo
  choice: mtu mwenye ufahamu
  alternative: mtu mwenye akili; mtu mwenye busara
  rationale: Tafsiri hii huonyesha uelewa na uwezo wa kufikiri bila kuifanya sifa hiyo iwe lazima kauli kuhusu wema wake wa kiadili au hali yake ya kiroho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. Neno “prokonsuli” limetumiwa kuhifadhi cheo mahususi cha Kirumi; tanbihi zimewekwa kwenye vifungu vinavyohusika moja kwa moja.
