  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: sw
  text: Yohana alipokuwa akimaliza mwendo wake, aliendelea kusema, “Mnanidhania kuwa mimi ni nani? Si mimi.[a] Lakini tazameni, baada yangu anakuja mtu ambaye sistahili kufungua viatu vilivyo miguuni mwake.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza wazi zaidi, “Mnanidhania kuwa mimi ni nani? Mimi si Masihi.” Kigiriki hakimtaji wazi yule ambaye Yohana anakana kuwa, ingawa muktadha unaelekeza kwa Masihi.
    reason: alternative_reading
  - marker: b
    text: Baadhi ya hati na tafsiri husema kwa namna mahususi zaidi, “kufungua kamba ya viatu vyake,” lakini matini ya Kigiriki iliyochapishwa hapa inasema tu “kiatu (au viatu) ... kufungua,” bila kutaja kamba.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: alipokuwa akimaliza mwendo wake
  rationale: Neno πληρόω linaonyesha kuufikisha mwisho, na δρόμος hapa ni sitiari ya kazi au huduma aliyopewa. “Mwendo wake” huhifadhi sitiari bila kuifanya lazima kuwa mashindano ya mbio; muundo “alipokuwa akimaliza” unaonyesha tendo lililokuwa likiendelea.
- source_word: ἔλεγεν
  choice: aliendelea kusema
  rationale: Kauli ya wakati usiotimilika inaonyesha kusema kulikokuwa kukiendelea au kurudiwa. “Aliendelea kusema” huleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Mnanidhania kuwa mimi ni nani?
  rationale: ὑπονοέω ni kudhani au kukisia. Ingawa τί kwa umbo ni “nini,” swali linahusu utambulisho wa mtu; “ni nani?” ni Kiswahili cha asili na halibadili lengo la swali.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Si mimi
  rationale: Kigiriki kina jibu fupi lenye mkazo kwa ἐγώ na hakimtaji wazi yule anayekanushwa. “Si mimi” huhifadhi ufupi na kutotajwa huko badala ya kuongeza “Masihi” katika matini kuu.
- source_word: ἀλλ’ ἰδοὺ
  choice: Lakini tazameni
  rationale: ἰδού huvuta usikivu. “Tazameni” ni lugha ya sasa, yenye heshima, na hapa inafaa kwa hadhira ya wingi.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: baada yangu anakuja mtu
  rationale: Wakati wa sasa unaonyesha ujio wa wazi au ulio karibu. “Mtu” huwasilisha kiima kinachodokezwa kwa Kiswahili kinachoeleweka.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: ambaye sistahili kufungua viatu vya miguu yake
  rationale: ὑπόδημα ni kiatu au vazi la mguu, na τῶν ποδῶν ni “vya miguu.” Wingi “viatu” ni wa kawaida katika Kiswahili; “kufungua” huwasilisha λύω bila kuingiza neno “kamba,” ambalo halipo katika matini hii.
- source_word: ἄξιος
  choice: sistahili
  rationale: ἄξιος huonyesha kustahili au kufaa. “Sistahili” ni tafsiri ya moja kwa moja na ya kawaida katika kauli hii ya unyenyekevu.
theological_decisions:
- issue: Utambulisho ambao Yohana anaukana katika οὐκ εἰμὶ ἐγώ
  choice: Matini kuu inasema “Si mimi,” bila kumtaja Masihi waziwazi.
  alternative: “Mimi si Masihi.”
  rationale: Muktadha unaelekeza kwa nguvu kwamba Yohana anakana kuwa Masihi, lakini Kigiriki kinaacha utambulisho huo bila kutajwa. Tafsiri huhifadhi hali hiyo, huku tanbihi ikieleza rejeo linalowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi bila kuwa cha kizamani. “Mwendo wake” huhifadhi sitiari ya huduma ya maisha; “tazameni” hudumisha wito wa kuzingatia; na jibu fupi “Si mimi” huhifadhi udokezi wa matini ya Kigiriki.
