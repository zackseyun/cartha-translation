lexical_decisions:
- source_word: καί
  choice: Naye
  rationale: Kiunganishi kinaendeleza simulizi la kihistoria, huku kiwakilishi cha nafsi kikirejelea Mungu kwa kawaida katika Kiswahili.
- source_word: ὡς
  choice: karibu
  rationale: Katika usemi wa muda, neno hili huonyesha makadirio; ‘karibu miaka arobaini’ ni Kiswahili cha kawaida na hudumisha kutokuwa kamili kwa hesabu.
- source_word: τεσσερακονταετῆ χρόνον
  choice: kwa muda wa karibu miaka arobaini
  rationale: Muundo huu unaonyesha kipindi cha takriban miaka arobaini kwa lugha ya asili na inayoeleweka.
- source_word: ἐτροποφόρησεν
  choice: aliwavumilia
  rationale: Katika matini ya SBLGNT, kitenzi hiki kina maana ya kuwastahimili au kuwavumilia. ‘Aliwavumilia’ ni cha heshima, cha sasa, na hakipunguzi uzito wa uasi wa Israeli.
- source_word: αὐτοὺς
  choice: -wa-
  rationale: Kiambishi cha yambwa cha wingi kinawarejelea watu wa Israeli kwa njia ya kawaida katika Kiswahili.
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: ‘Jangwani’ ni usemi wa kawaida wa kibiblia kwa eneo la nyika ambako Israeli walizunguka, na hudumisha mwangwi wa simulizi la Agano la Kale.
theological_decisions:
- issue: Maana ya tendo la Mungu kwa Israeli jangwani
  choice: aliwavumilia
  alternative: aliwatunza
  rationale: Matini iliyochapishwa, ἐτροποφόρησεν, inaunga mkono maana ya kuwastahimili. Tofauti ya matini ἐτροφοφόρησεν inaunga mkono maana ya kuwatunza; kwa hiyo haijaingizwa katika matini kuu bali imeonyeshwa katika tanbihi ili kuhifadhi uwazi wa ushahidi wa matini na mvutano wake wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Aliwavumilia’ ni cha asili zaidi kuliko ‘aliwastahimili’ katika muktadha huu; ‘jangwani’ hudumisha sajili ya kibiblia bila kuwa ya kizamani.
