base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: sw
  text: Na walipokwisha kutimiza yote yaliyoandikwa kumhusu, walimshusha kutoka kwenye mti[a] na kumweka katika kaburi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msalaba”; Kigiriki “mti” (ξύλον), neno ambalo pia linaweza kumaanisha chombo cha mbao cha kutekelezea adhabu ya kifo na huenda likawa mwangwi wa Kumbukumbu la Torati 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nao walipokuwa
  rationale: Huendeleza simulizi na kuonyesha wakati wa tukio kwa Kiswahili cha kawaida.
- source_word: ἐτέλεσαν
  choice: walipokuwa wametimiza
  rationale: Kitenzi hiki humaanisha kukamilisha au kutekeleza; “wametimiza” huhifadhi wazo kwamba matendo yao yalitimiza yaliyoandikwa bila kuondoa mvutano wa kitheolojia.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: yote yaliyoandikwa kumhusu
  rationale: Hutoa kwa ufupi na kwa uaminifu maana ya mambo yote yaliyokuwa yameandikwa kuhusu Yesu.
- source_word: καθελόντες
  choice: walimshusha
  rationale: Kirai cha wakati uliopita kinatolewa kama kitenzi kinachofuata kwa kawaida katika Kiswahili, kikimaanisha kuondoa mwili kutoka juu.
- source_word: ἀπὸ τοῦ ξύλου
  choice: kutoka kwenye mti
  rationale: “Mti” huhifadhi maana ya msingi ya ξύλον na mwangwi unaowezekana wa Kumbukumbu la Torati 21:23, badala ya kuingiza moja kwa moja tafsiri ya kimuktadha “msalaba.”
- source_word: ἔθηκαν
  choice: kumweka
  rationale: Ni usemi wa kawaida na wenye staha kwa kuweka mwili mahali pa maziko.
- source_word: εἰς μνημεῖον
  choice: kaburini
  rationale: Katika muktadha huu μνημεῖον ni kaburi la kuzikia; “kaburini” ni Kiswahili cha kawaida na kilicho wazi.
theological_decisions:
- issue: Tafsiri ya ξύλον katika simulizi la mateso
  choice: mti
  alternative: msalaba
  rationale: Neno la Kigiriki ni ξύλον, si σταυρός. “Mti” huhifadhi uchaguzi wa msamiati wa chanzo na uwezekano wa mwangwi wa lugha ya laana ya mtu aliyetundikwa juu ya mti; “msalaba” linawekwa katika tanbihi kama tafsiri halali ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza mtiririko wa simulizi huku ukihifadhi neno “mti” na ufafanuzi wake katika tanbihi.
