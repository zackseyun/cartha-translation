  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: sw
  text: Ndimi zilizogawanyika, kama za moto, ziliwatokea, zikakaa juu ya kila mmoja wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndimi zinazogawanyika, kama za moto,” au “ndimi, kana kwamba za moto.” Mpangilio wa maneno ya Kigiriki hukazia kuonekana kwao na pia kugawanywa kwao miongoni mwa watu hao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: wakatokea kwao
  rationale: Kitenzi kinaeleza jambo lililofanyika lionekane kwao; “wakatokea kwao” ni Kiswahili cha kawaida kinachohifadhi udhihirisho huo wa kuonekana.
- source_word: αὐτοῖς
  choice: kwao
  rationale: Hutaja watu walioona tukio hilo; “kwao” huambatana kwa kawaida na “wakatokea.”
- source_word: διαμεριζόμεναι
  choice: zikigawanyika
  rationale: 'Huhifadhi umbo la kitenzi-shirikishi na hali yake isiyoamuliwa kikamilifu: ndimi zilionekana zikigawanyika au kusambazwa miongoni mwao.'
- source_word: γλῶσσαι
  choice: ndimi
  rationale: “Ndimi” huhifadhi taswira inayoonekana na pia uhusiano wa kileksia na usemi/lugha katika muktadha unaofuata; “miali” ingeondoa uhusiano huo.
- source_word: ὡσεὶ πυρός
  choice: kama za moto
  rationale: “Kama” huhifadhi ulinganisho bila kudai kwamba zilikuwa moto halisi.
- source_word: ἐκάθισεν
  choice: ukatua
  rationale: Umoja wa kitenzi cha Kigiriki umehifadhiwa kwa kurejelea udhihirisho huo kwa ujumla; “kutua” ni ya asili kwa jambo linalokuja kukaa juu ya mtu.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: juu ya kila mmoja wao
  rationale: Huhifadhi mkazo wa kwamba kila mtu aliyekuwapo alipokea udhihirisho huo mmoja mmoja.
theological_decisions:
- issue: Asili ya udhihirisho wa Pentekoste
  choice: Kutafsiri kuwa “ndimi kama za moto,” si moto halisi wala lugha tu kwa tafsiri ya moja kwa moja.
  alternative: miali ya moto; lugha kama za moto
  rationale: Kigiriki kinatumia ulinganisho ὡσεὶ pamoja na γλῶσσαι. Tafsiri hii huhifadhi taswira ya kuonekana na uhusiano wake na usemi bila kuamua kwamba ilikuwa moto halisi au lugha pekee.
- issue: Umoja wa ἐκάθισεν baada ya wingi wa γλῶσσαι
  choice: Kuhifadhi umoja kwa “ukatua,” ikieleweka kuwa udhihirisho huo kwa ujumla ndio uliotua.
  alternative: zikatua
  rationale: Umoja wa maandishi ya Kigiriki ni muhimu na unaweza kuonyesha jambo hilo kwa mtazamo wa pamoja. Tafsiri haibadilishi kimya kimya kuwa wingi, ingawa Kiswahili kinahitaji rejeo hilo lieleweke kwa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndimi” ni neno linaloeleweka katika sajili ya Biblia na huhifadhi mwangwi wa maana ya kiungo cha mwili na lugha. Alama ya tanbihi imewekwa baada ya sentensi.
