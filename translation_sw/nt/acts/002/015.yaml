lexical_decisions:
- source_word: οὐ γὰρ
  choice: Kwa maana ... hawa-
  rationale: “Kwa maana” linaendeleza hoja ya ufafanuzi kutoka mstari uliotangulia, huku ukanushi ukiunganishwa kwa kawaida na kitenzi cha Kiswahili.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: kama mnavyodhani
  rationale: Huhifadhi maana ya kudhani au kufikiri na pia usemi wa moja kwa moja kwa wingi uliomo katika ὑμεῖς.
- source_word: οὗτοι
  choice: hawa
  rationale: Ni kiwakilishi elekezi cha moja kwa moja kwa kundi linalozungumziwa, bila kuongeza “wanaume” au “watu” kusikosemwa wazi katika Kigiriki.
- source_word: μεθύουσιν
  choice: hawajalewa
  rationale: Katika muktadha huu kitenzi kinaeleza hali inayodaiwa ya kulewa; “hawajalewa” ni Kiswahili cha kawaida na wazi.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: kwa kuwa ni saa tatu ya mchana
  rationale: “Kwa kuwa” linaonyesha sababu inayotolewa na γάρ. “Saa tatu ya mchana” huhifadhi mfumo wa kuhesabu saa unaotumiwa katika maandishi na pia ni usemi wa kawaida katika Kiswahili cha Afrika Mashariki.
