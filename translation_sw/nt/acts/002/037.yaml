- source_word: τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: Petro na wale mitume wengine
  rationale: “Wale mitume wengine” humtenganisha Petro na mitume waliobaki bila kudokeza kuwa yeye si mtume.
- source_word: Τί ποιήσωμεν
  choice: tufanye nini?
  rationale: Kiima cha nafsi ya kwanza wingi katika hali tegemezi kinauliza hatua inayowapasa kuchukua; huu ndio usemi wa kawaida wa Kiswahili.
- source_word: ἄνδρες ἀδελφοί
  choice: Ndugu
  rationale: Hili ni neno la heshima la kuwaita wasikilizaji. “Ndugu” huhifadhi lugha ya kifamilia kwa Kiswahili cha kawaida, huku umbo halisi la Kigiriki likielezwa katika tanbihi.
