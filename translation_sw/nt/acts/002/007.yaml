  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: sw
  text: Nao walishangaa sana na kustaajabu, wakisema, “Tazameni, je, hawa wote wanaozungumza si Wagalilaya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: walishangaa sana
  rationale: Kitenzi hiki hapa kinaonyesha mshangao mkubwa. ‘Walishangaa sana’ ni Kiswahili cha kawaida kinachohifadhi uzito wake bila kutumia nahau isiyoeleweka.
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi; ‘Nao’ huunganisha sentensi kwa ufasaha katika Kiswahili.
- source_word: καὶ
  choice: na
  rationale: 'Huunganisha athari mbili zinazoongezeka: walishangaa sana na kustaajabu.'
- source_word: ἐθαύμαζον
  choice: kustaajabu
  rationale: Kitenzi kina maana ya kustaajabu au kushangazwa; ‘kustaajabu’ kinatofautisha kwa kiasi athari hii na mshangao mkubwa wa kitenzi kilichotangulia.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi shiriki cha wakati uliopo kinaanzisha maneno yao; ‘wakisema’ ni muundo wa kawaida na wa asili katika simulizi ya Kiswahili.
- source_word: Οὐχ
  choice: je ... si
  rationale: Swali hili linatarajia jibu la kukubali. Muundo ‘je ... si ...?’ unahifadhi matarajio hayo kwa Kiswahili cha kawaida.
- source_word: ἰδοὺ
  choice: Tazameni
  rationale: Ni neno la kuvuta usikivu. ‘Tazameni’ linafaa kwa kundi linalosemeshwa na linahifadhi nguvu ya kuonyesha jambo lililo wazi mbele yao.
- source_word: πάντες οὗτοί
  choice: hawa wote
  rationale: Hurejelea kundi lote linalozungumziwa bila kuongeza neno ‘wanaume,’ ambalo halijaelezwa wazi katika Kigiriki.
- source_word: οἱ λαλοῦντες
  choice: wanaozungumza
  rationale: Muundo huu unawatambulisha wale wanaoendelea kusema na ni wa asili katika Kiswahili.
- source_word: Γαλιλαῖοι
  choice: Wagalilaya
  rationale: Ni jina la watu kwa asili yao ya eneo; ‘Wagalilaya’ ni tafsiri ya moja kwa moja na haiongezi sababu isiyotajwa ya mshangao wao.
theological_decisions:
- issue: Maana ya kijamii au kikanda iliyodokezwa na ‘Wagalilaya’
  choice: Jina la eneo ‘Wagalilaya’ limeachwa bila maelezo ya ziada.
  alternative: Wagalilaya wasio na elimu / Wagalilaya wa kaskazini
  rationale: Mstari unaonyesha mshangao kuhusu utambulisho wao kama Wagalilaya lakini hausemi wazi sababu yake. Kuongeza habari kuhusu elimu, lafudhi, au hadhi kungeingiza hitimisho la kimuktadha ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walishangaa sana na kustaajabu’ kinahifadhi vitenzi viwili vya Kigiriki na uzito wake wa pamoja; ‘Tazameni’ ni mwito wa wingi unaolingana na kundi la wasemaji.
