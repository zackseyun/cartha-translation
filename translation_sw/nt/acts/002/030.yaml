  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa alikuwa nabii, naye akijua kwamba Mungu alikuwa amemwapia kwa kiapo kwamba atamketisha mmoja wa wazao wake[a] juu ya kiti cha enzi cha Daudi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kutokana na tunda la kiuno chake.”
    reason: Nahau ya Kigiriki inaonyesha uzao wa kimwili; tanbihi huhifadhi taswira halisi ambayo ingekuwa isiyo ya kawaida katika matini kuu ya Kiswahili.
lexical_decisions:
- source_word: προφήτης
  choice: nabii
  rationale: Neno la kawaida na lenye heshima kwa mtu anayesema kwa ufunuo wa Mungu.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Linadumisha uhusiano wa kimantiki na hoja iliyotangulia kuhusu Daudi.
- source_word: ὑπάρχων
  choice: kwa kuwa alikuwa
  rationale: Muundo huu wa Kiswahili unaonyesha hali yenye nguvu ya kisababishi bila kuwa mgumu.
- source_word: εἰδὼς
  choice: akijua
  rationale: Unaakisi kitenzi-shirikishi kilichoratibiwa na ὑπάρχων kwa Kiswahili cha kawaida.
- source_word: ὅρκῳ ὤμοσεν αὐτῷ
  choice: alikuwa amemwapia kwa kiapo
  rationale: Unahifadhi msisitizo wa solemnity unaotokana na nomino ὅρκῳ pamoja na kitenzi ὤμοσεν, na pia mtendewa wa kiapo.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: mmoja wa wazao wake
  rationale: Hii ndiyo maana ya nahau katika Kiswahili cha asili na kinachoeleweka; taswira halisi imehifadhiwa katika tanbihi.
- source_word: καθίσαι
  choice: atamketisha
  rationale: Huhifadhi maana ya kusababisha mtu aketi au kumweka rasmi, huku wakati ujao ukitokana na maudhui ya kiapo katika simulizi.
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: juu ya kiti chake cha enzi
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kutawazwa; kiwakilishi kimeachwa kama kilivyo katika chanzo na kwa kawaida humrejelea Daudi.
theological_decisions:
- issue: Ahadi ya kifalme kwa Daudi yenye matumizi ya Kimasihi
  choice: Lugha ya uzao na kuketishwa kwenye kiti cha enzi imedumishwa bila kuingiza neno “Masihi.”
  alternative: Kutafsiri kwa ufafanuzi kwamba Masihi angeketi kwenye kiti chake cha enzi.
  rationale: Muktadha unaitumia ahadi hii kwa Yesu, lakini mstari wenyewe huzungumzia mzao wa Daudi na kiti chake cha enzi. Tafsiri inaacha muktadha utoe matumizi hayo ya Kikristo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unadumisha mtiririko wa hoja na vitenzi-shirikishi vya Kigiriki kwa namna ya kawaida katika Kiswahili. Alama [a] imewekwa mara moja katika matini kuu na inaendana na tanbihi.
