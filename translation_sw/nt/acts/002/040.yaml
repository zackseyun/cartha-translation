  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: sw
  text: Naye kwa maneno mengine mengi alishuhudia kwa msisitizo, na akaendelea kuwasihi, akisema, “Okoleweni[a] kutoka katika kizazi hiki kilichopotoka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jiokoeni kutoka katika kizazi hiki kilichopotoka.” Kitenzi cha Kigiriki ni cha kauli tendwa (“okoleweni”), ingawa tafsiri nyingine hukitoa kwa kauli ya kutenda ili kuonyesha mwitikio unaotakiwa kwa wasikilizaji.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: kwa maneno mengine mengi
  rationale: Huhifadhi maana ya ἑτέροις (‘mengine’) na πλείοσιν (‘mengi’) kwa Kiswahili cha kawaida na fasaha.
- source_word: διεμαρτύρατο
  choice: alishuhudia kwa uzito
  rationale: Huwasilisha ushuhuda wenye msisitizo na uzito bila kuufanya kuwa onyo tu.
- source_word: παρεκάλει
  choice: akaendelea kuwasihi
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea au lililorudiwa; ‘akaendelea kuwasihi’ huhifadhi hali hiyo na nguvu ya ombi.
- source_word: Σώθητε
  choice: Okoeni
  rationale: 'Huhifadhi kauli tendwa ya amri: waagizwa wapokee kuokolewa, bila kusema kwamba wanajiokoa wenyewe.'
- source_word: ἀπὸ
  choice: kutoka katika
  rationale: Huonyesha utengano na kizazi kinachotajwa kwa mtindo wa kawaida wa Kiswahili.
- source_word: γενεᾶς
  choice: kizazi
  rationale: Ni ulinganifu wa moja kwa moja unaoweza kumaanisha watu wa wakati huo na huhifadhi mwangwi wa lugha ya Biblia.
- source_word: σκολιᾶς
  choice: kilichopotoka
  rationale: Hutoa picha ya kitu kilichoacha unyofu na pia maana ya upotovu wa kimaadili; ni ya asili zaidi hapa kuliko ‘kilichopinda’.
theological_decisions:
- issue: Kauli na utendaji katika Σώθητε
  choice: Okoeni
  alternative: Jiokoeni kutoka katika kizazi hiki kilichopotoka.
  rationale: Kitenzi cha Kigiriki ni cha kauli tendwa, hivyo tafsiri kuu huepuka kugeuza mwito huo kuwa dai kwamba wasikilizaji wanajiokoa kwa uwezo wao wenyewe. Hata hivyo, hali ya amri bado inaonyesha kuwa wanaitwa kuitikia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa aya unahifadhi mfululizo wa ushuhuda na usihi wa Petro, huku kauli tendwa ya Σώθητε ikibaki wazi.
