  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: sw
  text: Na imekuwaje kwamba kila mmoja wetu anasikia kwa lugha yake mwenyewe ya kuzaliwa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa lahaja yake mwenyewe ya kuzaliwa.”
    reason: Huonyesha maana mbadala ya διάλεκτος kama ‘lahaja’, huku ikihifadhi uhusiano wa lugha hiyo na kuzaliwa.
lexical_decisions:
- source_word: πῶς
  choice: imekuwaje kwamba
  rationale: Huanzisha swali la mshangao; usemi huu ni wa kawaida katika Kiswahili na unabaki karibu na nguvu ya Kigiriki.
- source_word: ἡμεῖς ... ἕκαστος
  choice: kila mmoja wetu
  rationale: Huhifadhi msisitizo wa usambazaji wa ἕκαστος pamoja na ujumuishaji wa ἡμεῖς.
- source_word: ἀκούομεν
  choice: anawasikia wakisema
  rationale: Katika muktadha, kitenzi kinamaanisha kuwasikia wale wanaosema; nyongeza ya 'wakisema' hufanya maana iwe wazi kwa Kiswahili bila kubadili dai kuu.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: kwa lugha yake mwenyewe
  rationale: διάλεκτος inaweza kuwa lugha au lahaja; 'lugha' ni ya kawaida zaidi, huku 'yake mwenyewe' ikihifadhi ἰδίᾳ na upatanisho wa 'kila mmoja wetu'.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: tuliyozaliwa nayo
  rationale: Huhifadhi wazi kishazi cha Kigiriki kinachohusianisha lugha hiyo na kuzaliwa kwa wasemaji, badala ya kukifupisha kuwa 'lugha ya asili'.
