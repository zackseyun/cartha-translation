  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: sw
  text: Kwa maana Daudi anasema kumhusu, “Sikuzote nilimwona[a] Bwana[b] mbele yangu, kwa sababu yuko upande wangu wa kulia, ili nisitikisike.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilimwona Bwana kimbele daima.” Katika miktadha fulani, kitenzi cha Kigiriki kinaweza kumaanisha kuona kabla; lakini hapa maneno yanayokizunguka yanaunga mkono maana ya kumwona au kumweka Bwana mbele ya mtu daima.
    reason: lexical_alternative
  - marker: b
    text: Petro ananukuu Zaburi 16:8. Katika matini yake ya Kiebrania, jina lililotumiwa ni jina la Mungu, ambalo kwa kawaida huandikwa “BWANA” katika tafsiri nyingi.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: anasema kumhusu yeye
  rationale: Katika utangulizi huu wa nukuu, εἰς αὐτόν humaanisha kusema kwa habari ya mtu, si kusema moja kwa moja naye. ‘Kumhusu yeye’ ni Kiswahili cha kawaida na huhifadhi rejeo bila kulitambulisha zaidi.
- source_word: Προορώμην
  choice: Nilimwona
  rationale: Kitenzi hiki katika muktadha wa Zaburi kinaonyesha kumweka au kumwona Bwana mbele ya macho ya mtu. Hali ya kuendelea tayari inaonyeshwa wazi na ‘daima,’ hivyo ‘Nilimwona’ ni ya asili kuliko urudiaji mzito wa wazo hilo.
- source_word: κύριον
  choice: Bwana
  rationale: Huhifadhi neno la Kigiriki κύριον bila kuamua ndani ya tafsiri utambulisho wake wa kitheolojia katika matumizi ya Petro.
- source_word: ἐνώπιόν μου διὰ παντός
  choice: mbele yangu daima
  rationale: Huhifadhi taswira ya mahali na maana ya kudumu ya kifungu kwa Kiswahili cha asili na chenye hadhi.
- source_word: ἐκ δεξιῶν μού
  choice: upande wangu wa kulia
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kuwa karibu upande wa kulia, huku maana ya msaada au ulinzi ikibaki kuwa dokezo la muktadha badala ya kuongezwa wazi.
- source_word: ἵνα μὴ σαλευθῶ
  choice: ili nisitikisike
  rationale: ‘Ili’ huhifadhi uhusiano wa kusudi au matokeo wa ἵνα, na ‘nisitikisike’ huhifadhi sitiari ya kuondolewa katika uthabiti.
theological_decisions:
- issue: Rejeo la ‘Bwana’ katika nukuu ya Zaburi kama Petro anavyoitumia
  choice: Bwana
  alternative: BWANA; Masihi
  rationale: Matini ya Kigiriki ina κύριον, na Petro anaitumia Zaburi kikristolojia; tafsiri haipaswi kubadili neno lenyewe kuwa utambulisho mmoja wa kifafanuzi. Tanbihi inaeleza usuli wa jina la Mungu katika Zaburi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nukuu umehifadhiwa kwa uwazi; lugha inaeleweka kwa wasomaji wa kawaida bila kuondoa utata wa neno ‘Bwana.’
