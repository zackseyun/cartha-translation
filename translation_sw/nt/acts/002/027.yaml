  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: sw
  text: kwa maana hutaiacha nafsi yangu katika kuzimu[a], wala hutamruhusu Mtakatifu wako[b] aone kuoza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ulimwengu wa wafu. Au, “Sheoli,” kulingana na maandishi ya Kiebrania yaliyo msingi wa dondoo hili; Kigiriki hapa kina neno “Hadesi.”
    reason: alternative_reading
  - marker: b
    text: Au, “mwaminifu wako.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, kuoza au kuharibika kwa mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: hutaiacha
  rationale: Kitenzi hiki humaanisha kumwacha mtu katika hali au mahali fulani. “Hutaiacha” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kauli bila kutumia neno lenye maana finyu zaidi.
- source_word: ψυχήν
  choice: nafsi
  rationale: Katika dondoo hili ψυχή inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi” huhifadhi lugha ya Zaburi na upana wake wa kimaana bila kuifanya kauli iwe maelezo ya kiufundi kuhusu hali ya wafu.
- source_word: εἰς ᾅδην
  choice: katika Kuzimu
  rationale: ᾅδης inarejelea makao au ulimwengu wa wafu, si lazima mahali pa adhabu. “Kuzimu” ndilo neno la kawaida la kibiblia katika Kiswahili; “katika” linaeleza kwa kawaida hali ya kuachwa humo katika muundo huu.
- source_word: δώσεις
  choice: hutamruhusu
  rationale: Ingawa maana ya msingi ni “kutoa,” ikifuatiwa na kitenzi-jina hapa huunda nahau ya kuruhusu jambo litendeke.
- source_word: τὸν ὅσιόν σου
  choice: Mtakatifu wako
  rationale: ὅσιος inaweza kueleza aliye mtakatifu, mwaminifu, au mcha Mungu katika uhusiano wake na Mungu. “Mtakatifu wako” huhifadhi maana na uzito wa matumizi yake kuhusu Yesu katika muktadha wa Matendo 2.
- source_word: ἰδεῖν διαφθοράν
  choice: aone kuoza
  rationale: Hii huhifadhi nahau halisi “kuona” huku “kuoza” ikieleza wazi uchakavu wa mwili, bila dhana ya upotovu wa maadili ambayo neno jingine lingeweza kudokeza.
theological_decisions:
- issue: Tafsiri ya ᾅδης katika dondoo linalohusu ufufuo
  choice: Kuzimu
  alternative: ulimwengu wa wafu; Sheoli; kaburi
  rationale: “Kuzimu” hapa limetumiwa kwa maana ya makao ya wafu, si “jehanamu” ya adhabu. Tanbihi inaweka wazi maana hiyo na kuhifadhi pia “Sheoli,” ambalo linaakisi Kiebrania cha Zaburi iliyonukuliwa.
- issue: Utambulisho wa Kikristo wa τὸν ὅσιόν σου
  choice: Mtakatifu wako
  alternative: mwaminifu wako; mcha Mungu wako
  rationale: Muktadha wa Matendo 2 unatumia Zaburi hii kuhusu Yesu. Herufi kubwa inaonyesha rejeo hilo la kimuktadha, huku tanbihi ikihifadhi maana nyingine halisi ya ὅσιος.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kishairi wa dondoo umehifadhiwa, na maneno ya kitaalamu yasiyo ya lazima yameepukwa.
