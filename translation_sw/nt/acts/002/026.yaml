  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: sw
  text: Kwa sababu hiyo moyo wangu ulifurahi, na ulimi wangu ukashangilia; zaidi ya hayo, hata mwili wangu utakaa katika tumaini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwili wangu utapumzika katika tumaini.”
    reason: Mbadala huu huonyesha uwezekano wa kuelewa κατασκηνώσει kama kupumzika kwa usalama, hasa katika muktadha wa kifo, ingawa kitenzi chenyewe kwa msingi ni kukaa au kupiga makao.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha sababu au msingi. “Kwa sababu hiyo” ni cha kawaida katika Kiswahili na huhifadhi nguvu ya kisababishi kuliko hitimisho la moja kwa moja kama “kwa hiyo.”
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: moyo wangu ulifurahi
  rationale: Huhifadhi nahau ya kibiblia ya “moyo” kama utu wa ndani, huku kitenzi cha Kiswahili “ulifurahi” kikitoa hali hiyo kwa njia ya kawaida.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: ulimi wangu ukashangilia
  rationale: “Ulimi” huhifadhi taswira ya kishairi ya Kigiriki badala ya kuifafanua kuwa “kinywa,” na “ukashangilia” huonyesha furaha kubwa iliyoelezwa kwa sauti.
- source_word: ἔτι δὲ καὶ
  choice: zaidi ya hayo, hata
  rationale: Maneno haya yanaendeleza wazo na kulitilia mkazo; “zaidi ya hayo, hata” huhifadhi vipengele vyote viwili kwa Kiswahili cha kawaida.
- source_word: ἡ σάρξ μου
  choice: mwili wangu
  rationale: Ingawa σάρξ kwa msingi ni “nyama,” hapa linamaanisha uwepo wa kimwili, si asili ya dhambi. “Mwili wangu” ni tafsiri ya asili na iliyo wazi katika Kiswahili bila kuingiza maana ya kimaadili.
- source_word: κατασκηνώσει
  choice: utakaa
  rationale: Kitenzi kina taswira ya kukaa au kupiga makao. “Utakaa” huhifadhi taswira hiyo bila kuibana kuwa “utapumzika” pekee.
- source_word: ἐπ’ ἐλπίδι
  choice: kwa tumaini
  rationale: Kirai kinaweza kuonyesha msingi au hali ya kukaa. “Kwa tumaini” ni cha kawaida katika Kiswahili na huacha wazi iwapo tumaini linaelezwa kama msingi au mazingira ya usalama.
theological_decisions:
- issue: Maana ya σάρξ katika nukuu inayohusishwa na ufufuo
  choice: mwili wangu
  alternative: nyama yangu
  rationale: Katika muktadha huu σάρξ ni la kimwili na la kibinadamu, si neno la kimaadili linalomaanisha hali ya dhambi. “Mwili” huwasilisha maana hiyo kwa Kiswahili kinachoeleweka, bila kutaja ufufuo moja kwa moja kabla muktadha haujaufafanua.
- issue: Nuansi ya κατασκηνώσει ἐπ’ ἐλπίδι
  choice: utakaa kwa tumaini
  alternative: utapumzika kwa tumaini
  rationale: Tafsiri kuu huhifadhi taswira pana ya kukaa kwa usalama na haiamui kimya-kimya kwamba maana ni kupumzika kaburini. Tafsiri mbadala imewekwa katika tanbihi kwa kuwa inafaa katika muktadha huu lakini ni finyu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na ulinganifu wa “moyo” na “ulimi” umehifadhiwa; alama ya tanbihi imewekwa kwenye kirai ambacho tanbihi yake inahusu.
