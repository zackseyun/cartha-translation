base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: sw
  text: wakimsifu Mungu na wakikubalika kwa watu wote. Naye Bwana alikuwa akiwaongeza siku baada ya siku wale waliokuwa wakiokolewa katika jumuiya yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja” au “mahali pamoja.”
    reason: Kirai cha Kigiriki ἐπὶ τὸ αὐτό kinaweza kueleweka kwa njia hizo; “katika jumuiya yao” ni tafsiri ya kimuktadha baada ya “alikuwa akiwaongeza.”
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: wakimsifu Mungu
  rationale: Kitenzi cha wakati uliopo katika hali ya kushiriki kinaonyesha shughuli yao iliyoendelea; “wakimsifu” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: na kukubaliwa na watu wote
  rationale: Nahau hii inaelekea kumaanisha kufurahia kibali au nia njema ya watu, si wao kuwaonyesha watu fadhili. “Kukubaliwa” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: ὁ δὲ κύριος
  choice: Naye Bwana
  rationale: “Naye” huendeleza simulizi kwa urahisi, na “Bwana” ndiyo tafsiri ya kawaida ya κύριος hapa.
- source_word: προσετίθει
  choice: akawaongeza
  rationale: Muundo wa “akawa-” unaonyesha tendo lililoendelea au kurudiwa, kulingana na hali ya kitenzi kisichotimilika katika Kigiriki.
- source_word: τοὺς σῳζομένους
  choice: wale waliokuwa wakiokolewa
  rationale: Huhifadhi hali ya kupokea tendo na mtazamo wa mchakato unaoendelea bila kuugeuza kuwa jina la hali iliyokamilika.
- source_word: καθ’ ἡμέραν
  choice: siku baada ya siku
  rationale: Ni usemi wa kawaida unaohifadhi maana ya tendo lililotokea kila siku kwa mfululizo.
- source_word: ἐπὶ τὸ αὐτό
  choice: katika jumuiya yao
  rationale: Katika muktadha wa προσετίθει, kirai kinaelekea kuonyesha kuongezwa katika kundi lililokuwapo. “Jumuiya yao” ni ya asili kuliko tafsiri ya neno kwa neno, huku maana mbadala zikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Hali ya wokovu katika τοὺς σῳζομένους
  choice: wale waliokuwa wakiokolewa
  alternative: wale waliookolewa; waliookoka
  rationale: Tafsiri hii huhifadhi hali ya kutendwa na mtazamo unaoendelea wa kishiriki cha wakati uliopo, bila kuamua mjadala mpana wa kiteolojia kuhusu mpangilio au ukamilifu wa wokovu.
- issue: Maana ya ἐπὶ τὸ αὐτό
  choice: katika jumuiya yao
  alternative: pamoja; mahali pamoja
  rationale: Muktadha wa “kuongeza” unaunga mkono kuingizwa katika kundi, lakini kirai chenyewe kinaweza kumaanisha “pamoja” au “mahali pamoja”; kwa hiyo uwezekano huo hauondolewi kimya bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaendeleza muundo wa kishiriki kutoka muktadha uliotangulia. “Jumuiya” hapa ni kundi la waamini, si taasisi rasmi.
