  text: Ghafla, sauti kama ya upepo mkali unaovuma kwa nguvu ikatoka mbinguni, ikaijaza nyumba yote ambamo walikuwa wameketi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sauti kama ya upepo wenye nguvu unaosonga kwa kasi.” Kigiriki hulinganisha sauti hiyo na upepo wenye nguvu unaosonga; hakisemi wazi kwamba upepo halisi ulikuwapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ikatoka
  rationale: Katika muundo huu wa kisimulizi, neno hili linaonyesha kutokea kwa sauti; pamoja na ἐκ τοῦ οὐρανοῦ, “ikatoka mbinguni” ni Kiswahili cha kawaida kinachoonyesha tukio na chanzo chake.
- source_word: ἄφνω
  choice: Ghafla
  rationale: Huonyesha kwamba tukio lilitokea bila kutazamiwa na kwa mara moja, kwa lugha ya kawaida yenye staha.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mbinguni
  rationale: “Mbinguni” hudumisha wazo la chanzo cha kimbingu katika muktadha wa Luka–Matendo badala ya kulifanya kuwa anga la kawaida tu.
- source_word: ἦχος
  choice: sauti
  rationale: Ni neno pana na lisiloegemea upande fulani; “kelele” lingeweza kudokeza usumbufu au hali mbaya isiyosemwa na maandishi.
- source_word: ὥσπερ
  choice: kama ya
  rationale: Huonyesha wazi kuwa huu ni mlinganisho wa sauti, si dai kwamba upepo halisi ulikuwapo.
- source_word: φερομένης
  choice: unaovuma kwa nguvu
  rationale: Kitenzi-shirikishi kinaonyesha hewa inayosonga au kubebwa; katika muktadha wa upepo, kauli hii ni ya asili kwa Kiswahili na hudokeza mwendo wenye nguvu.
- source_word: πνοῆς
  choice: upepo
  rationale: Ingawa neno linaweza kumaanisha pumzi au mvumo, hapa mlinganisho wa kusikika pamoja na βιαίας unaunga mkono “upepo.”
- source_word: βιαίας
  choice: mkali
  rationale: “Mkali” ni maelezo ya kawaida ya upepo wenye nguvu na hudumisha wazo la nguvu bila kutumia kauli isiyo ya asili kama “upepo wa vurugu.”
- source_word: ἐπλήρωσεν
  choice: ikaijaza
  rationale: Hudumisha sauti kuwa kiima cha kitenzi na kuonyesha kwamba sauti ilienea katika nyumba nzima.
- source_word: ὅλον τὸν οἶκον
  choice: nyumba yote
  rationale: Ni tafsiri ya kawaida inayohifadhi wazo la ukamilifu katika ὅλον.
- source_word: οὗ ἦσαν καθήμενοι
  choice: walimokuwa wameketi
  rationale: Hutoa kwa Kiswahili cha asili maana ya mahali na hali yao iliyoendelea wakati tukio lilipotokea.
theological_decisions:
- issue: Ikiwa jambo lililoelezwa lilikuwa upepo halisi au sauti iliyofanana na upepo
  choice: 'Maandishi makuu yanadumisha mlinganisho: “sauti ... kama ya upepo mkali.”'
  alternative: Upepo halisi wenye nguvu uliijaza nyumba.
  rationale: Neno ὥσπερ linaweka mlinganisho. Tafsiri haisemi kwamba upepo halisi ulikuwapo, wala haiondoi uwezekano wowote usioamuliwa wazi na mstari.
translation_notes:
