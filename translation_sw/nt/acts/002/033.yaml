  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: sw
  text: Kwa hiyo, akiwa ametukuzwa hadi upande wa kuume wa Mungu[a], na baada ya kupokea kutoka kwa Baba ahadi ya Roho Mtakatifu[b], amemimina hiki mnachokiona na kukisikia ninyi wenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa ametukuzwa kwa mkono wa kuume wa Mungu.” Dativi ya Kigiriki inaweza kueleweka ama kwa maana ya mahali au cheo (“hadi upande wa kuume”) au kwa maana ya chombo cha tendo (“kwa mkono wa kuume”).
    reason: alternative_reading
  - marker: b
    text: Au, “Roho Mtakatifu aliyeahidiwa.” Kigiriki kinaweza kumaanisha Roho mwenyewe kuwa zawadi iliyoahidiwa, au ahadi inayomhusu Roho.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: mpaka mkono wa kuume wa Mungu
  rationale: Kirai hiki kimeeleweka kimahali, kikionyesha kuinuliwa kwa Yesu hadi nafasi ya heshima upande wa kuume wa Mungu; uwezekano wa kueleweka kama chombo cha tendo umehifadhiwa katika tanbihi.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu ufufuo na kutukuzwa kwa Yesu.
- source_word: ὑψωθεὶς
  choice: akiwa ameinuliwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na maana ya kutukuzwa au kuwekwa katika cheo cha juu, huku ikisomika kwa Kiswahili cha kawaida.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: ahadi ya Roho Mtakatifu
  rationale: Hufuata kwa karibu muundo wa Kigiriki na kuhifadhi uwezekano kwamba ni ahadi inayomhusu Roho au Roho mwenyewe akiwa zawadi iliyoahidiwa.
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: akiisha kupokea kutoka kwa Baba
  rationale: Huonyesha kwamba kupokea kulitangulia kumimina, na παρά pamoja na umilikishi huonyesha chanzo.
- source_word: ἐξέχεεν
  choice: amemimina
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimia ambalo matokeo yake yanaonekana na kusikika sasa.
- source_word: τοῦτο
  choice: hiki
  rationale: Kiwakilishi kimeachwa bila kuongeza 'kipawa' au 'Roho' ili kutofafanua rejeo zaidi ya maandishi ya Kigiriki.
- source_word: ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: mnachokiona na kukisikia ninyi wenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi ὑμεῖς na hali ya sasa ya mambo ambayo hadhira inayatambua moja kwa moja.
theological_decisions:
- issue: Ikiwa τῇ δεξιᾷ τοῦ θεοῦ humaanisha kuinuliwa 'mpaka' mkono wa kuume wa Mungu au 'kwa' mkono wa kuume wa Mungu
  choice: mpaka mkono wa kuume wa Mungu
  alternative: kwa mkono wa kuume wa Mungu
  rationale: Muktadha wa Zaburi 110 na kutawazwa kwa Yesu unapendelea maana ya mahali au cheo, lakini hali ya utoaji ya Kigiriki pia inaweza kuonyesha chombo; maana hiyo imehifadhiwa katika tanbihi.
- issue: Ikiwa τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου ni Roho aliyeahidiwa au ahadi inayomhusu Roho
  choice: ahadi ya Roho Mtakatifu
  alternative: Roho Mtakatifu aliyeahidiwa
  rationale: Tafsiri ya karibu inahifadhi utata halisi wa umilikishi wa Kigiriki; kifungu kinachofuata kinaweza kuelekeza kwa Roho kama kile kilichomiminwa bila kulazimisha maana hiyo ndani ya kirai hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa vishazi tegemezi umehifadhi mfuatano wa hoja ya Kigiriki bila kufanya sentensi kuwa nzito kupita kiasi. 'Mkono wa kuume' limetumiwa kama tamko la kibiblia linalotambulika, na viashiria vyote vya tanbihi vimewekwa katika matini.
