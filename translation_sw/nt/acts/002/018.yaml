  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: sw
  text: Naam, hata katika siku zile nitamimina kutoka katika Roho wangu juu ya watumwa wangu wa kiume na watumwa wangu wa kike[a], nao watatoa unabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wangu wa kiume na watumishi wangu wa kike.” Maneno ya Kigiriki yanaweza kumaanisha watumishi au watumwa; “watumwa” limetumiwa hapa ili kuhifadhi msisitizo wa hali yao ya chini katika jamii.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: Naam, hata
  rationale: Mchanganyiko huu unasisitiza kwamba kumiminwa kwa Roho kunawahusu hata watu wenye hadhi ya chini; “Naam, hata” ni wa asili na huhifadhi msisitizo huo.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: juu ya watumwa wangu wa kiume na watumwa wangu wa kike
  rationale: “Watumwa” huhifadhi hali ya kijamii iliyo chini inayodokezwa na δοῦλος/δούλη, huku “wa kiume” na “wa kike” zikihifadhi utofautishaji wa kijinsia ulio wazi katika Kigiriki.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: katika siku zile
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya wakati na kionyeshi cha Kigiriki.
- source_word: ἐκχεῶ
  choice: nitamimina
  rationale: Huhifadhi sitiari ya kumwaga kwa wingi na hali ya wakati ujao ya kitenzi.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: kutoka katika Roho wangu
  rationale: Huhifadhi kwa uwazi kihusishi ἀπό, “kutoka,” bila kukigeuza kimyakimya kuwa umilikaji wa kawaida.
- source_word: προφητεύσουσιν
  choice: watatoa unabii
  rationale: Huwasilisha tendo la kunena kinabii kwa Kiswahili cha kawaida na huepuka maana finyu ya kutabiri matukio yajayo pekee.
theological_decisions:
- issue: Maana ya δοῦλος/δούλη katika muktadha wa kumiminwa kwa Roho
  choice: watumwa wangu wa kiume / watumwa wangu wa kike
  alternative: watumishi wangu wa kiume / watumishi wangu wa kike
  rationale: Kutaja wanaume na wanawake kwa namna hii kunasisitiza kwamba zawadi ya Mungu inawafikia hata walio katika hali ya chini ya kijamii. “Watumwa” huhifadhi uzito huo bila kuufifisha.
- issue: Maana ya ἀπὸ τοῦ πνεύματός μου
  choice: kutoka katika Roho wangu
  alternative: sehemu ya Roho wangu; Roho wangu
  rationale: Chaguo hili huhifadhi ἀπό ya Kigiriki na utata wake wa kisitiari bila kulazimisha wazo la kwamba Roho anagawanywa au kwamba kifungu hicho ni umilikaji rahisi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa “watumwa wangu” kunahifadhi ulinganifu wa miundo ya Kigiriki; “watatoa unabii” ni wazi kuliko “watatabiri,” ambalo mara nyingi hueleweka kuwa kutaja yajayo tu.
