id: ACT.2.1
reference: Acts 2:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: sw
  text: Siku ya Pentekoste ilipowadia[a], wote walikuwa pamoja mahali pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilipokuwa ikitimia.”
    reason: Tafsiri hii mbadala inahifadhi kwa karibu zaidi hali ya mchakato katika συμπληροῦσθαι.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: ilipowadia
  rationale: Muundo huu wa wakati unaonyesha kufika au kutimia kwa siku iliyotajwa. “Ilipowadia” ni Kiswahili cha kawaida kinachowasilisha vizuri kufika kwa siku hiyo, huku tafsiri ya karibu zaidi na umbo la Kigiriki ikiwekwa katika tanbihi.
- source_word: πεντηκοστῆς
  choice: Pentekoste
  rationale: “Pentekoste” ndilo jina lililozoeleka katika Kiswahili kwa sikukuu hii ya Kiyahudi ya siku ya hamsini.
- source_word: πάντες
  choice: wote
  rationale: Neno hili linajumuisha kundi lote linalotajwa katika muktadha uliotangulia.
- source_word: ὁμοῦ
  choice: pamoja
  rationale: “Pamoja” linaonyesha kuwa watu hao walikuwa katika ushirika au mkusanyiko mmoja.
- source_word: ἐπὶ τὸ αὐτό
  choice: mahali pamoja
  rationale: Kirai hiki kinaweza kumaanisha kuwa pamoja au kuwa mahali pale pale. “Mahali pamoja” huhifadhi maana yake ya mahali na kuitofautisha na ὁμοῦ.
theological_decisions:
- issue: Utambulisho wa wahusika wa kitenzi ἦσαν
  choice: wote walikuwa
  alternative: wao wote walikuwa
  rationale: Kigiriki hakirudii kiwakilishi cha wahusika, kwa kuwa wanajulikana kutokana na muktadha uliotangulia. Kiswahili kinaweza kusema “wote walikuwa” kwa ufasaha bila kuongeza utambulisho au fundisho lisilokuwamo katika maandishi.
- issue: Maana ya συμπληροῦσθαι kuhusu siku ya Pentekoste
  choice: ilipowadia
  alternative: ilipokuwa ikitimia
  rationale: Kitenzi kinaweza kuwasilisha kufika kwa wakati uliowekwa au mchakato wa kutimia. Maandishi makuu yanatumia usemi wa kawaida wa Kiswahili, na tanbihi inahifadhi picha ya kutimia bila kuamua zaidi ya Kigiriki.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Kurudiwa kwa “pamoja” kunahifadhi vipengele viwili tofauti vya Kigiriki: kuwa pamoja (ὁμοῦ) na kuwa mahali pamoja (ἐπὶ τὸ αὐτό).'
