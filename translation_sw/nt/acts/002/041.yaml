  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: sw
  text: Basi wale waliolipokea neno lake walibatizwa, na siku hiyo watu[a] wapatao elfu tatu wakaongezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi.” Neno la Kigiriki ψυχαί hapa hutumiwa kwa kawaida kurejelea watu katika hesabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: Basi wale
  rationale: “Basi” linaonyesha mwendelezo na matokeo ya hotuba iliyotangulia bila kufanya uhusiano huo uwe mkali kuliko Kigiriki.
- source_word: ἀποδεξάμενοι
  choice: waliolipokea
  rationale: Kitenzi hiki kinaonyesha kuupokea ujumbe kwa moyo unaokubali. “Kulipokea” ni cha kawaida na kinadumisha upana wa maana kuliko “kulikubali” pekee.
- source_word: τὸν λόγον αὐτοῦ
  choice: neno lake
  rationale: “Neno” linafuata λόγος kwa uwazi huku katika muktadha likieleweka kuwa ujumbe alioutangaza Petro.
- source_word: ἐβαπτίσθησαν
  choice: walibatizwa
  rationale: Hii ni tafsiri ya moja kwa moja ya kitenzi tendwa, bila kuingiza msimamo wa dhehebu kuhusu namna au matokeo ya ubatizo.
- source_word: προσετέθησαν
  choice: wakaongezwa
  rationale: Tafsiri hii inadumisha kauli tendwa na wazo la kuingizwa katika jumuiya inayokua. Haiongezi kiima lengwa kama “kwao” au “katika kanisa,” ambacho hakijaandikwa wazi katika mstari huu.
- source_word: ψυχαὶ
  choice: nafsi
  rationale: “Nafsi” ni tafsiri ya karibu ya ψυχαί. Tanbihi inaeleza kwamba hapa neno hilo ni namna ya kuhesabu watu, ili lisieleweke lazima kama tamko maalumu kuhusu sehemu isiyo ya kimwili ya mwanadamu.
- source_word: ὡσεὶ τρισχίλιαι
  choice: zipatazo elfu tatu
  rationale: “Zipatazo” linaonyesha ukadiriaji unaowasilishwa na ὡσεί na linapatana kisarufi na “nafsi.”
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: siku ile
  rationale: Hii ni namna ya kawaida na wazi ya Kiswahili ya kutaja wakati huo.
theological_decisions:
- issue: Ikiwa kitu au jumuiya ambayo watu waliongezwa kwayo itajwe wazi
  choice: 'Imeachwa bila kutajwa: “wakaongezwa”'
  alternative: “wakaongezwa kwao” au “wakaongezwa katika kanisa”
  rationale: Kigiriki hakitaji wazi kitu hicho katika mstari huu. Muktadha unaonyesha jumuiya ya waamini, lakini kukiacha bila kutajwa kunahifadhi usemi wa andiko na kuepuka kuongeza dai la kikanisa lisilo wazi hapa.
- issue: Maana ya kianthropolojia ya ψυχαί
  choice: “nafsi” katika matini, pamoja na tanbihi inayoeleza maana ya “watu”
  alternative: “watu”
  rationale: Uamuzi huu unahifadhi neno la Kigiriki kwa uwazi huku ukizuia wasomaji wasilichukulie lazima kuwa dai la kitaalamu kuhusu asili ya mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ni wa karibu na chanzo lakini unabaki wa kawaida katika masimulizi ya Kiswahili.
