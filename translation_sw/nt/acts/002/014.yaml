source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: sw
  text: 'Lakini Petro akasimama pamoja na wale kumi na mmoja, akapaza sauti yake[a] akawahutubia: “Enyi wanaume wa Yudea[b], nanyi nyote mnaoishi Yerusalemu, jueni jambo hili, na sikilizeni kwa makini maneno yangu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliinua sauti yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Enyi wanaume Wayahudi.” Neno la Kigiriki linaweza kumaanisha watu wa Yudea au Wayahudi.
    reason: source_ambiguity
lexical_decisions:
- source_word: Σταθεὶς
  choice: akasimama
  rationale: Kitenzi kishirikishi cha aoristi kinaweka tendo linalotangulia hotuba; ‘akasimama’ ni cha kawaida na chenye nguvu katika simulizi la Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Kinaonyesha geuko lenye utofauti na dhihaka iliyotangulia katika mstari wa 13.
- source_word: σὺν τοῖς ἕνδεκα
  choice: pamoja na wale kumi na mmoja
  rationale: Kinahifadhi wazi wazo la Petro kuwa pamoja na mitume wengine kumi na mmoja.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: akapaza sauti yake
  rationale: Hii ni nahau ya asili ya Kiswahili inayoonyesha kusema kwa sauti kubwa ili kusikika hadharani.
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: kuwatangazia
  rationale: Kinaonyesha kusema wazi na kwa uzito mbele ya watu bila kulazimisha katika neno lenyewe dai la uvuvio wa kinabii.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Enyi wanaume wa Uyahudi
  rationale: Kinahifadhi wito wa kiume ἄνδρες na maana ya kijiografia ya Ἰουδαῖοι katika mazingira ya Yerusalemu, huku tanbihi ikitaja uwezekano wa maana ya utambulisho wa Kiyahudi.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: nanyi nyote mnaoishi Yerusalemu
  rationale: Muundo wa kumwelekea msikilizaji moja kwa moja ni wa kawaida katika Kiswahili na unahifadhi πάντες, ‘nyote.’
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: jueni jambo hili
  rationale: Amri ya moja kwa moja ni ya asili kwa Kiswahili na inahifadhi nguvu ya ἔστω pamoja na γνωστόν.
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: sikilizeni kwa makini maneno yangu
  rationale: ‘Kwa makini’ huonyesha usikivu wa makusudi unaodokezwa na ἐνωτίσασθε, na ‘maneno yangu’ hufuata τὰ ῥήματά μου kwa karibu.
theological_decisions:
- issue: Umaalumu wa kijinsia katika Ἄνδρες
  choice: Enyi wanaume wa Uyahudi
  alternative: Enyi watu wa Uyahudi
  rationale: Ἄνδρες ni wito wa kiume kwa uwazi; ‘wanaume’ huhifadhi jambo hilo badala ya kulifanya lisilo na jinsia.
- issue: Ikiwa ἀπεφθέγξατο idai wazi hotuba iliyovuviwa
  choice: kuwatangazia
  alternative: kunena kwa uvuvio
  rationale: Kitenzi kinaweza kutumiwa kuhusu usemi mzito au unaohusishwa na Roho, lakini hapa tafsiri haiongezi dai la kiteolojia lisilotamkwa moja kwa moja na neno lenyewe.
- issue: Maana ya Ἰουδαῖοι katika wito
  choice: wa Uyahudi
  alternative: Wayahudi
  rationale: Muktadha unaruhusu maana ya watu wa eneo la Uyahudi na pia utambulisho wa Kiyahudi; matini kuu inafuata maana ya kijiografia, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima unaofaa hotuba ya hadharani lakini wenye maneno ya sasa na yanayoeleweka. ‘Akapaza sauti’ na ‘sikilizeni kwa makini’ ni nahau za kawaida zisizo za kimadhehebu.
