  to: 'Lakini Petro akasimama pamoja na wale kumi na mmoja, akapaza sauti yake[a] akawahutubia: “Enyi wanaume wa Yudea[b], nanyi nyote mnaoishi Yerusalemu, jueni jambo hili, na sikilizeni kwa makini maneno yangu.”'
