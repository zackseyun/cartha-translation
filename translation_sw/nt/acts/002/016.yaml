  text: Lakini hili ndilo lililosemwa kupitia nabii Yoeli:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na nabii Yoeli.” Kigiriki kinaweza pia kutafsiriwa hivyo, lakini “kupitia” huonyesha vizuri zaidi nafasi ya Yoeli kama mpatanishi wa ujumbe wa kinabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha upinzani na kusahihisha dhana potovu ya umati katika muktadha uliotangulia.
- source_word: τοῦτό ἐστιν
  choice: haya ndiyo
  rationale: Muundo huu wa Kiswahili kwa kawaida na kwa uwazi unatambulisha mambo yanayotukia kuwa ndiyo yaliyotabiriwa; wingi wa 'haya' hurejelea matukio yanayoonekana bila kubadili maana ya kiwakilishi cha Kigiriki kisicho na jinsia.
- source_word: τὸ εἰρημένον
  choice: yaliyosemwa
  rationale: Kirai hiki kinahifadhi hali ya kutendwa ya nomino-kitenzi cha Kigiriki na ni cha kawaida katika Kiswahili.
- source_word: διὰ
  choice: kupitia
  rationale: Ikiwa na hali ya genitive na mpatanishi wa kibinadamu, διά huonyesha wakala au njia; 'kupitia' huhifadhi wazi jukumu la nabii kama mpitishaji wa ujumbe.
- source_word: τοῦ προφήτου
  choice: nabii
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya cheo hicho; Kiswahili hakihitaji kibainishi kinacholingana na 'the' katika muktadha huu.
- source_word: Ἰωήλ
  choice: Yoeli
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
theological_decisions:
- issue: Upatanishi wa kinabii katika διὰ τοῦ προφήτου Ἰωήλ
  choice: kupitia nabii Yoeli
  alternative: na nabii Yoeli
  rationale: '''Kupitia'' huhifadhi uwezekano wa Mungu kuwa chanzo cha ujumbe na Yoeli kuwa mpatanishi wake, bila kuingiza nadharia maalumu ya namna ya uvuvio. ''Na'' pia yaweza kuonyesha wakala, lakini haidhihirishi kwa kiwango kilekile maana ya upatanishi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Haya ndiyo yaliyosemwa' ni muundo wa asili unaorejelea matukio yanayoendelea; 'kupitia' huhifadhi maana ya upatanishi wa kinabii.
