base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: sw
  text: Nao walikuwa wakidumu katika mafundisho ya mitume na katika ushirika[a], katika kuumega mkate[b] na katika sala[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ushirikiano,” “kushiriki pamoja,” au “komunyo.”
    reason: lexical_alternative
  - marker: b
    text: “Kuumega mkate” kunaweza kurejelea milo ya pamoja kwa ujumla, ingawa wengi wanaelewa kwamba hapa kunatia ndani Mlo wa Bwana.
    reason: alternative_reading
  - marker: c
    text: Au “sala zilizowekwa.” Kibainishi katika Kigiriki kinaweza kudokeza nyakati au namna za sala zilizotambuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: Nao walidumu
  rationale: Muundo wa kitenzi cha wakati uliopita pamoja na kiambishi cha sasa unaonyesha tendo lililoendelea na kuwa desturi. “Walidumu” linaonyesha kuendelea kwa uthabiti bila kufanya sentensi kuwa nzito.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: katika mafundisho ya mitume
  rationale: “Mafundisho” ni Kiswahili cha kawaida na cha sasa kwa διδαχή, nacho kinaepuka maana ya mfumo rasmi wa itikadi ambayo “doktrini” ingeweza kudokeza. Kirai “ya mitume” kinaonyesha kwa kawaida mafundisho waliyotoa mitume.
- source_word: τῇ κοινωνίᾳ
  choice: katika ushirika
  rationale: κοινωνία linaweza kumaanisha maisha ya pamoja, kushirikiana, au kuwa na sehemu pamoja. “Ushirika” huhifadhi upana huo bila kuufanya kuwa utoaji wa mali pekee au ibada maalumu.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: katika kuumega mkate
  rationale: Hiki ni kirai kinachotambulika katika Luka–Matendo. Tafsiri ya moja kwa moja huhifadhi uwezekano wa milo ya pamoja na pia wa Mlo wa Bwana bila kuamua maana moja katika matini kuu.
- source_word: ταῖς προσευχαῖς
  choice: katika sala
  rationale: “Sala” ni neno la kawaida na lenye heshima. Kiswahili hakina kibainishi kinacholingana moja kwa moja na kibainishi cha Kigiriki; tanbihi inahifadhi uwezekano kwamba ni sala au nyakati za sala zilizotambuliwa.
theological_decisions:
- issue: Ikiwa κλάσει τοῦ ἄρτου litajwe wazi kuwa Mlo wa Bwana au Ekaristi
  choice: kuumega mkate
  alternative: Mlo wa Bwana; Ekaristi; milo ya pamoja iliyotia ndani Mlo wa Bwana
  rationale: Kirai hiki katika Luka–Matendo kinaweza kurejelea kushiriki chakula, na katika mazingira ya Kikristo huenda kikajumuisha mlo wa ukumbusho wa Yesu. Hata hivyo, maneno yenyewe hayalazimishi tafsiri ya kisakramenti, hivyo kirai kipana kimehifadhiwa.
- issue: Ikiwa κοινωνία lipunguzwe kuwa kugawana mali au komunyo ya kisakramenti
  choice: ushirika
  alternative: kushirikiana; kuwa na sehemu pamoja; komunyo
  rationale: Neno hili lina wigo mpana wa maisha na ushiriki wa pamoja, ambao huenda ulikuwa wa kiroho na wa kimali. “Ushirika” huepuka kuamua mapema namna moja tu ya ushiriki huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa urahisi. Marudio ya “katika” yanafuata mpangilio wa orodha ya Kigiriki na kuweka kila tendo wazi. Istilahi zenye mzigo wa kimadhehebu hazijawekwa katika matini kuu.
