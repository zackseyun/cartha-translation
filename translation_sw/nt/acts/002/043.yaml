base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: sw
  text: Na hofu ikamjia kila mtu[a], na maajabu na ishara nyingi zilikuwa zikitendeka kwa njia ya mitume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kicho kikamjia kila mtu.” Kigiriki kinasema kihalisi, “hofu ikamjia kila nafsi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: hofu ikamjia
  rationale: Muundo huu unaonyesha hofu ikitokea na kuwafikia watu; ni Kiswahili cha asili kuliko tafsiri ya neno kwa neno kama ‘hofu ilikuwa.’
- source_word: δὲ
  choice: Na
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha upinzani mkali.
- source_word: πάσῃ ψυχῇ
  choice: kila mtu
  rationale: Ingawa Kigiriki kinasema kihalisi ‘kila nafsi,’ usemi huo humaanisha kila mtu. Chaguo hili ni wazi na la kawaida katika Kiswahili, huku tanbihi ikihifadhi umbo la asili.
- source_word: φόβος
  choice: hofu
  rationale: ‘Hofu’ ni kisawe cha moja kwa moja kinachohifadhi mvutano kati ya kuogopa na kustaajabu kwa heshima, bila kuamua maana kwa upande mmoja.
- source_word: πολλά
  choice: nyingi
  rationale: Hiki ndicho kisawe cha kawaida cha kiasi, kikikubaliana na nomino ‘maajabu na ishara.’
- source_word: τέρατα
  choice: maajabu
  rationale: Neno hili hukazia hali ya matendo yenye kustaajabisha; ‘maajabu’ hulitofautisha na σημεῖα.
- source_word: σημεῖα
  choice: ishara
  rationale: ‘Ishara’ huhifadhi wazo la matendo yanayoelekeza kwenye maana au uthibitisho fulani.
- source_word: διὰ τῶν ἀποστόλων
  choice: kupitia kwa mitume
  rationale: Muundo huu unaonyesha mitume kuwa vyombo au watendaji wa kati, huku Mungu akibaki mtendaji mkuu anayedokezwa.
- source_word: ἐγίνετο
  choice: zikawa zikitendeka
  rationale: Wakati usiotimilika unaonyesha maajabu na ishara zikiendelea kutokea, si tukio moja tu.
theological_decisions:
- issue: Maana ya φόβος kama mwitikio kwa matendo yaliyofanywa kupitia mitume
  choice: hofu
  alternative: kicho; mshangao wa heshima
  rationale: ‘Hofu’ huhifadhi nguvu ya msingi ya neno na uwezekano wa kuhusisha kuogopa pamoja na kicho, badala ya tafsiri kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘kila mtu’ kwa uwazi wa kawaida, na tanbihi imehifadhi usemi halisi ‘kila nafsi.’ ‘Zikawa zikitendeka’ huonyesha tendo lililoendelea.
