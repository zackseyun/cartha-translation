  text: ἕτεροι δὲ ⸀διαχλευάζοντες ἔλεγον ὅτι Γλεύκους μεμεστωμένοι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: sw
  text: Lakini wengine, huku wakiwadhihaki, walikuwa wakisema, “Wamejaa divai tamu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “divai mpya.” Neno la Kigiriki γλεῦκος humaanisha divai mpya iliyo tamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: wengine
  rationale: Kivumishi hiki kimetumika kama nomino na kinarejelea kundi tofauti katika umati; “wengine” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na mwitikio uliotangulia; “Lakini” huwasilisha vizuri maana hiyo.
- source_word: διαχλευάζοντες
  choice: huku wakiwadhihaki
  rationale: Kitenzi hiki kinaonyesha dhihaka yenye kejeli. Muundo huu pia huhifadhi uhusiano wa tendo hilo na kusema kwao.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Wakati usiotimilifu unaonyesha usemi uliokuwa ukiendelea au kurudiwa; “walikuwa wakisema” huhifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: ὅτι
  choice: “Wamejaa...
  rationale: Hapa kinaanzisha maudhui ya usemi; nukuu ya moja kwa moja ni ya asili katika Kiswahili.
- source_word: Γλεύκους
  choice: divai tamu
  rationale: Neno hili humaanisha divai tamu, hasa divai mpya au mbichi; “divai tamu” ni sahihi zaidi kileksika, huku tanbihi ikihifadhi uwezekano wa “divai mpya.”
- source_word: μεμεστωμένοι
  choice: wamejaa
  rationale: Kauli timilifu ya kutendwa inaeleza hali inayodaiwa kuwa imetokana na kunywa; “wamejaa” ni ya kawaida na huhifadhi wazo la kuwa full of drink.
- source_word: εἰσίν
  choice: wamejaa
  rationale: Kitenzi hiki hukamilisha muundo wa hali pamoja na μεμεστωμένοι; katika Kiswahili maana ya kopula imejumuishwa kiasili katika “wamejaa.”
