lexical_decisions:
- source_word: Πάρθοι
  choice: Waparthi
  rationale: Jina la watu limetoholewa kwa muundo wa kawaida wa Kiswahili wa majina ya makabila na mataifa.
- source_word: Μῆδοι
  choice: Wamedi
  rationale: Hili ni umbo la kawaida la Kiswahili kwa watu wa Umedi.
- source_word: Ἐλαμῖται
  choice: Waelami
  rationale: Hutambulisha watu wa Elamu kwa umbo la asili na linaloeleweka katika Kiswahili.
- source_word: οἱ κατοικοῦντες
  choice: wakaaji wa
  rationale: Kirai hiki kinawataja watu wanaokaa katika maeneo yanayofuata; “wakaaji wa” ni cha asili na kifupi katika orodha.
- source_word: τὴν Μεσοποταμίαν
  choice: Mesopotamia
  rationale: Jina la eneo limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: Ἰουδαίαν
  choice: Yudea
  rationale: Ni umbo la kawaida la Kiswahili la jina la eneo hilo.
- source_word: τε καὶ
  choice: na
  rationale: Katika orodha hii muunganiko huo unaonyeshwa kwa “na”; jaribio la kuonyesha msisitizo mdogo wa nyongeza lingefanya Kiswahili kisikike kizito bila kuongeza maana ya lazima.
- source_word: Καππαδοκίαν
  choice: Kapadokia
  rationale: Jina la eneo limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: Πόντον
  choice: Ponto
  rationale: Jina la eneo limetoholewa kwa umbo linalofaa Kiswahili.
- source_word: τὴν Ἀσίαν
  choice: Asia
  rationale: Neno la chanzo linatumia jina “Asia”; ufafanuzi kuwa ni jimbo la Roma umewekwa katika tanbihi ili kutohusisha kimakosa bara la kisasa.
