- from: “Na itakuwa katika siku za mwisho,” asema Mungu, “nitamimina kutoka katika Roho wangu juu ya wote wenye mwili[a]. Wana wenu wa kiume na wa kike watatoa unabii; vijana wenu wa kiume wataona maono, na wazee wenu wa kiume wataota ndoto.”
  to: “Na itakuwa katika siku za mwisho, asema Mungu, nitamimina kutoka katika Roho wangu juu ya wanadamu wote[a]. Wana wenu wa kiume na binti zenu watatoa unabii; vijana wenu wa kiume wataona maono, na wanaume wenu wazee wataota ndoto.”
  rationale: Revision improves idiomatic Standard East African Swahili while preserving the source's scope and prophetic imagery through a concise footnote. It restores the explicit son/daughter pairing and maintains the Greek's contrast between young men and old men. No theological interpretation beyond the source context has been added.
