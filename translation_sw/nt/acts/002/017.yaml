  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: sw
  text: “Na itakuwa katika siku za mwisho, asema Mungu, nitamimina kutoka katika Roho wangu juu ya wanadamu wote[a]. Wana wenu wa kiume na binti zenu watatoa unabii; vijana wenu wa kiume wataona maono, na wanaume wenu wazee wataota ndoto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kihalisi, “juu ya kila mwili.” Huu ni usemi wa kinabii unaowahusu wanadamu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: katika siku za mwisho
  rationale: Ni usemi wa kawaida wa wakati unaohifadhi maana ya kieskatolojia bila kufafanua kupita kiasi upeo wake.
- source_word: λέγει ὁ θεός
  choice: asema Mungu
  rationale: Inahifadhi wakati wa sasa wa fomula ya kunukuu na ina ladha ya kinabii katika Kiswahili cha kawaida.
- source_word: ἐκχεῶ
  choice: nitamimina
  rationale: Inahifadhi sitiari halisi ya kumimina na ni usemi wa kawaida wa Kiswahili.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: kutoka katika Roho wangu
  rationale: Inawakilisha ἀπό, ‘kutoka,’ badala ya kuufanya usemi huo kuwa genitivi rahisi tu; pia inamtambulisha Roho kuwa wa Mungu bila kudokeza mgawanyiko.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: juu ya wote wenye mwili
  rationale: Inahifadhi taswira ya kinabii ya σάρξ huku ikitoa Kiswahili kinachoeleweka; katika muktadha huu ni nahau pana inayowahusu wanadamu.
- source_word: προφητεύσουσιν
  choice: watatoa unabii
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi istilahi ya kinabii.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: wana wenu wa kiume na wa kike
  rationale: Inahifadhi jozi ya jinsia iliyo wazi katika Kigiriki na msisitizo wa ushiriki mpana, kwa lugha ya sasa inayoeleweka.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: vijana wenu wa kiume
  rationale: Inahifadhi jinsia ya nomino ya Kigiriki na kuitofautisha na kundi la binti lililotajwa tayari.
- source_word: ὁράσεις ὄψονται
  choice: wataona maono
  rationale: Ni Kiswahili cha kawaida kinachowasilisha vizuri muundo na maana ya usemi wa Kigiriki.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: wazee wenu wa kiume
  rationale: Muktadha unalinganisha makundi ya umri, hivyo tafsiri hii huepuka maana ya cheo cha uongozi inayoweza kusikika katika ‘wazee’ peke yake.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: wataota ndoto
  rationale: Ni ulinganifu wa asili wa Kiswahili kwa usemi wa Kigiriki wenye mzizi unaorudiwa, na unadumisha usambamba na kuona maono.
theological_decisions:
- issue: Upeo na nguvu ya kinahau ya ‘mwili wote’
  choice: Kutumia ‘wote wenye mwili’ katika matini kuu, huku ikieleweka katika muktadha kuwa nahau pana inayowahusu watu wote.
  alternative: watu wote / wanadamu wote
  rationale: Hii inahifadhi taswira na mwangwi wa kinabii wa Yoeli bila kuficha upana wa ahadi kwa makundi ya wanadamu yaliyotajwa.
- issue: Maana ya πνεῦμα katika kumiminwa na Mungu
  choice: Roho wangu, kwa herufi kubwa
  alternative: roho wangu
  rationale: Msemaji ni Mungu na kiwakilishi ‘wangu’ kinamtambulisha Roho kuwa Roho wa Mungu; herufi kubwa husaidia kuonyesha mrejeo huo wa kimungu bila kuongeza fundisho lisilomo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kinukuu umehifadhiwa, pamoja na usambamba wa wana wa kiume na wa kike, vijana wa kiume, na wazee wa kiume. Alama pekee ya tanbihi, [a], ipo katika matini kuu.
