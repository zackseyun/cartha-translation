lexical_decisions:
- source_word: ἕως ἂν
  choice: mpaka nitakapo-
  rationale: Muundo huu unaonyesha hatua ya wakati ujao ambayo hali iliyotajwa kabla itaendelea hadi ifikiwe; Kiswahili cha kawaida hutumia ‘mpaka’ pamoja na kitenzi cha wakati ujao cha uhusiano.
- source_word: θῶ
  choice: nitakapowaweka ... kuwa
  rationale: Kitenzi τίθημι kimsingi humaanisha ‘kuweka’; pamoja na kijalizo ‘kiti cha kuwekea miguu,’ muundo ‘kuwaweka ... kuwa’ unahifadhi maana ya kuweka katika nafasi au hali hiyo.
- source_word: τοὺς ἐχθρούς σου
  choice: adui zako
  rationale: Hili ni tafsiri ya moja kwa moja inayohifadhi maana ya uadui wa kibinafsi na upinzani dhidi ya mfalme katika dondoo la Zaburi.
- source_word: ὑποπόδιον
  choice: kiti cha kuwekea miguu
  rationale: Huu ni usemi wa kawaida na unaoeleweka katika Kiswahili kwa kitu cha kuegemezea au kuwekea miguu, huku ukihifadhi picha halisi ya kutiishwa.
- source_word: τῶν ποδῶν σου
  choice: cha kuwekea miguu yako
  rationale: Ingawa kimuundo ni ‘cha miguu yako,’ usemi ‘cha kuwekea miguu yako’ ni wa asili zaidi katika Kiswahili na unabaki karibu na taswira ya Kigiriki.
theological_decisions:
- issue: Taswira ya kifalme ya kutiishwa katika dondoo la Zaburi 110:1
  choice: Kudumisha taswira halisi ya ‘kiti cha kuwekea miguu yako’ badala ya kuifafanua kuwa kushindwa kabisa.
  alternative: mpaka nitakapowatiisha kabisa adui zako chini ya miguu yako
  rationale: Mstari huu unanukuu Zaburi 110:1 na una uzito wa kifalme na wa Kimasihi. Kuhifadhi sitiari kunadumisha uhusiano huo wa kimaandiko bila kuingiza ufafanuzi mpana ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi sitiari ya maandishi asilia na pia unasikika kwa ufasaha katika Kiswahili.
