  text: mpaka nitakapowafanya adui zako kuwa kiti cha kuwekea miguu yako.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi na muundo wa maneno: “mpaka niwaweke adui zako kuwa kiti cha miguu yako.”'
    reason: lexical_alternative
  - marker: b
