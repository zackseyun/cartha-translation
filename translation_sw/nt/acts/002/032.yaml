  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: sw
  text: Mungu alimfufua Yesu huyu; sisi sote ni mashahidi wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Yesu huyu
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi nguvu ya kiashiria τοῦτον, ikimwelekeza msomaji kwa Yesu aliyetajwa.
- source_word: ἀνέστησεν
  choice: alimfufua
  rationale: Katika muktadha huu kitenzi kinamaanisha kumrudisha mtu kutoka kwa wafu. “Alimfufua” ni wazi na kinahifadhi Mungu kama mtendaji na Yesu kama mtendewa.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Kiima kilicho wazi katika Kigiriki kinahifadhiwa moja kwa moja.
- source_word: οὗ
  choice: wa jambo hilo
  rationale: Ingawa kimuundo ni kiwakilishi cha uhusiano katika hali ya umilikishi, hapa ushuhuda unalenga tendo lililotangulia la kufufuliwa. Kiswahili cha kawaida husema kwa uwazi “mashahidi wa jambo hilo” bila kulazimisha usemi usio wa asili “mashahidi wake.”
- source_word: πάντες ἡμεῖς
  choice: sisi sote
  rationale: Huhifadhi msisitizo wa kiwakilishi pamoja na maana ya ujumla.
- source_word: ἐσμεν μάρτυρες
  choice: ni mashahidi
  rationale: Huhifadhi muundo wa nomino wa Kigiriki na kueleza kwamba wasemaji ni watu wanaoshuhudia jambo hilo.
theological_decisions:
- issue: Lugha ya ufufuo
  choice: Mungu alimfufua Yesu huyu
  alternative: Mungu alimwinua Yesu huyu
  rationale: “Alimfufua” huonyesha wazi kuwa ἀνέστησεν hapa inarejelea ufufuo kutoka kwa wafu, huku ikidumisha dai la mstari kwamba Mungu ndiye aliyefanya tendo hilo.
- issue: Kirejeleo cha ushuhuda
  choice: mashahidi wa jambo hilo
  alternative: mashahidi wake
  rationale: Kigiriki οὗ kinaweza kuhusishwa kisarufi na Yesu, lakini katika muktadha mashahidi wanashuhudia ufufuo wake. Tafsiri iliyochaguliwa ni ya asili na inaacha “jambo hilo” lirejelee dai lote lililotangulia bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Yesu huyu” huhifadhi msisitizo wa kiashiria, na “sisi sote” huhifadhi msisitizo wa πάντες ἡμεῖς.
