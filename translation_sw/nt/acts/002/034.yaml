source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: sw
  text: Kwa maana Daudi hakupanda kwenda mbinguni[a], lakini yeye mwenyewe anasema, “Bwana alimwambia Bwana wangu, ‘Keti upande wangu wa kuume,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Zaburi 110:1. Katika matini ya Kiebrania, neno la kwanza ‘Bwana’ linawakilisha jina la Mungu YHWH; linganisha: ‘BWANA alimwambia Bwana wangu.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: hakupanda kwenda
  rationale: Kitenzi hiki kinaeleza kupaa au kwenda juu; katika muktadha huu, ‘hakupanda kwenda mbinguni’ ni Kiswahili cha kawaida kinachohifadhi wazo la mwendo wa kupanda.
- source_word: τοὺς οὐρανούς
  choice: mbinguni
  rationale: Ingawa Kigiriki kina umbo la wingi, Kiswahili sanifu hutumia kwa kawaida ‘mbinguni’ kueleza makao ya mbinguni bila kulazimisha umbo lisilo la asili.
- source_word: λέγει δὲ αὐτός
  choice: lakini yeye mwenyewe anasema
  rationale: ‘Lakini’ linaonyesha utofautishaji wa δέ, na ‘yeye mwenyewe’ linahifadhi msisitizo wa αὐτός. Wakati uliopo wa ‘anasema’ unatambulisha andiko linalonukuliwa.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Kigiriki kinatumia κύριος; ‘Bwana’ ndilo neno la kawaida na lenye hadhi katika Kiswahili. Asili ya jina la Mungu katika Zaburi ya Kiebrania inaelezwa katika tanbihi.
- source_word: τῷ κυρίῳ μου
  choice: Bwana wangu
  rationale: ‘Bwana wangu’ linahifadhi matumizi ya pili ya κύριος pamoja na kiwakilishi ‘wangu’ na linafaa kwa hoja ya Petro kuhusu Masiya.
- source_word: Κάθου
  choice: Keti
  rationale: ‘Keti’ ni amri ya moja kwa moja, ya kawaida, na yenye heshima inayowasilisha maana ya imperativi ya Kigiriki.
- source_word: ἐκ δεξιῶν μου
  choice: mkono wangu wa kuume
  rationale: Hii ni nahau ya kibiblia inayoonyesha mahali pa heshima na mamlaka; ‘mkono wangu wa kuume’ ni usemi unaotambulika katika Kiswahili cha Biblia.
theological_decisions:
- issue: Jinsi ya kutafsiri matumizi mawili ya κύριος katika nukuu ya Zaburi 110:1
  choice: 'Yote yametafsiriwa ‘Bwana’ katika matini kuu: ‘Bwana alimwambia Bwana wangu.’'
  alternative: ‘BWANA alimwambia Bwana wangu,’ ili kuonyesha jina la Mungu YHWH katika matini ya Kiebrania.
  rationale: Matini ya Kigiriki inayotafsiriwa hutumia κύριος katika sehemu zote mbili. Kwa hiyo matini kuu inafuata Kigiriki, huku msingi wa jina YHWH katika Zaburi ya Kiebrania ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inafuata ulinganifu bora, ikihifadhi msisitizo wa ‘yeye mwenyewe,’ usemi wa kibiblia ‘mkono wa kuume,’ na tofauti muhimu kati ya matini ya Kigiriki na msingi wake wa Kiebrania kupitia tanbihi.
