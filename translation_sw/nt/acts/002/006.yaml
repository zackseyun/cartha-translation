base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: sw
  text: Sauti hii ilipotokea, umati ukakusanyika, ukachanganyikiwa, kwa sababu kila mmoja aliwasikia wakisema kwa lahaja yake mwenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa lugha yake mwenyewe.” Neno la Kigiriki linaweza kumaanisha lugha kwa maana pana, ingawa “lahaja” linafuata kwa karibu zaidi neno alilotumia Luka.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ τῆς φωνῆς ταύτης
  choice: Sauti hii ilipotokea
  rationale: Muundo wa genitivi huru unaonyesha mazingira ya wakati. Neno φωνή hapa linaeleweka kwa kawaida kuwa sauti iliyosikika, bila kulibainisha zaidi kuwa sauti ya kiumbe au kelele.
- source_word: συνῆλθε τὸ πλῆθος
  choice: umati ukakusanyika
  rationale: Kitenzi συνέρχομαι kinaonyesha watu kuja pamoja mahali pamoja; ‘umati ukakusanyika’ ni Kiswahili cha kawaida na kinachofaa simulizi.
- source_word: συνεχύθη
  choice: kufadhaika
  rationale: Kitenzi hiki katika hali tendwa kinaweza kumaanisha kuchanganyikiwa au kuvurugika. ‘Kufadhaika’ hapa huonyesha hali ya kutatizika na kushindwa kuelewa bila kudokeza hofu pekee.
- source_word: ἤκουον εἷς ἕκαστος
  choice: kila mmoja aliwasikia
  rationale: Kauli ‘kila mmoja’ inadumisha mkazo wa Kigiriki kwa uzoefu wa kila mtu binafsi. Kiswahili hutumia wakati uliopita unaoeleweka kwa urahisi hapa, huku muktadha ukionyesha tukio lililokuwa likiendelea.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: kwa lahaja yake mwenyewe
  rationale: διάλεκτος linaweza kumaanisha lugha au namna ya usemi ya eneo fulani. ‘Lahaja’ linafuata uteuzi mahsusi wa Luka na ‘yake mwenyewe’ huhifadhi umoja wa mgawanyo.
- source_word: λαλούντων αὐτῶν
  choice: wakisema
  rationale: Kirai hiki kinawarejelea wasemaji waliotajwa tayari. ‘Wakisema’ ni cha kawaida na hakiongezi dai kwamba walikuwa mitume pekee.
theological_decisions:
- issue: Rejeleo la wasemaji
  choice: wakisema
  alternative: mitume wakisema
  rationale: Kiwakilishi αὐτῶν kinawarejelea watu waliotangulia katika simulizi bila kuwataja hapa kuwa mitume; tafsiri haibani utambulisho wao kuliko matini.
- issue: Umoja wa mgawanyo katika εἷς ἕκαστος ... ἰδίᾳ
  choice: kila mmoja ... kwa lahaja yake mwenyewe
  alternative: wote ... kwa lahaja zao wenyewe
  rationale: Umoja wa Kiswahili unadumisha msisitizo kwamba kila mtu katika umati alisikia binafsi, bila kubadili maana kuwa uzoefu wa pamoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetiririshwa kwa viunganishi vya u- mfululizo (‘ukakusanyika na kufadhaika’). Alama ya tanbihi [a] imewekwa mara moja baada ya kirai kinachohusika.
