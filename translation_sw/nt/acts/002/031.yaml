  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: sw
  text: 'Kwa kuona hayo mapema, alisema kuhusu ufufuo wa Masihi[a]: kwamba hakuachwa katika makao ya wafu[b], wala mwili wake haukuona uozo[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni Christos; hapa limetafsiriwa “Masihi” kwa sababu linatumika kama cheo. Kwa desturi, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Kigiriki ni Hadesi; humaanisha makao ya wafu, si hasa mahali pa mwisho pa hukumu. Kwa desturi, “kuzimu.” Kifungu hiki kinaweza pia kutafsiriwa, “hakuachwa kuelekea makao ya wafu.”
    reason: cultural_note
  - marker: c
    text: Au, “uharibifu.” Maana katika muktadha huu ni kuoza kwa mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Kwa kuwa aliona hayo mapema
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha kuona mapema jambo litakalotokea. Neno “hayo” linatolewa na muktadha na kufanya Kiswahili kiwe cha kawaida.
- source_word: ἐλάλησεν
  choice: alisema
  rationale: Katika Kiswahili, “alisema kuhusu” ni ya kawaida zaidi hapa kuliko “alinena kuhusu,” huku ikihifadhi tendo la kusema.
- source_word: περὶ τῆς ἀναστάσεως
  choice: kuhusu ufufuo
  rationale: περί pamoja na hali ya umilikaji humaanisha “kuhusu”; ἀνάστασις hapa ni kufufuka kutoka kwa wafu.
- source_word: τοῦ χριστοῦ
  choice: wa Masihi
  rationale: Χριστός hapa ni cheo cha yule aliyetiwa mafuta na kuahidiwa katika Maandiko, si jina tu.
- source_word: οὔτε ἐγκατελείφθη
  choice: hakuachwa
  rationale: Huhifadhi kauli tendwa na maana ya kuachwa bila kuingiza kwa lazima wazo la hisia lililo katika “kutelekezwa.”
- source_word: εἰς ᾅδην
  choice: kuzimu
  rationale: “Kuzimu” kwa kawaida hueleweka kuwa makao ya wafu. Kiambishi ku- kinaweza kueleza kuelekea mahali au kuwapo humo, hivyo kinatunza kwa kiasi fulani uwezekano wa “kwenda” au “kuwa” unaohusishwa na εἰς katika kifungu hiki.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: mwili wake
  rationale: Ingawa σάρξ kwa msingi ni “nyama,” hapa humaanisha mwili halisi wa Masihi unaoweza kuoza. “Mwili wake” ni Kiswahili cha kawaida na huepuka taswira isiyokusudiwa ya nyama pekee.
- source_word: εἶδεν διαφθοράν
  choice: haukuona uozo
  rationale: Huhifadhi nahau halisi ya Kigiriki “kuona uozo” na maana yake ya mwili kutooza baada ya kufa.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika hoja ya Petro inayotegemea Maandiko, neno hili linafanya kazi wazi kama cheo cha mtiwa-mafuta aliyeahidiwa.
- issue: Tafsiri ya ᾅδης
  choice: kuzimu
  alternative: makao ya wafu
  rationale: “Kuzimu” ni neno fupi na la kawaida kwa makao ya wafu; tanbihi inaweka wazi kwamba hapa halimaanishi hasa mahali pa mwisho pa hukumu.
- issue: Tafsiri ya σάρξ
  choice: mwili
  alternative: nyama
  rationale: Muktadha unahusu mwili halisi na uozo wake. “Mwili” hutoa maana hiyo kwa Kiswahili cha kawaida bila kuleta maana ya tabia ya dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unahifadhi uhusiano wa kuona mapema, kusema, na maelezo mawili yanayofuata. “Masihi,” “kuzimu,” na “uozo” ni maneno yanayoeleweka kwa wasomaji wa kawaida, huku tanbihi zikihifadhi njia mbadala na ufafanuzi unaohitajika.
