id: ACT.2.5
reference: Acts 2:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: sw
  text: Kulikuwa na Wayahudi[a] waliokuwa wakiishi Yerusalemu, wanaume wenye kumcha Mungu, waliotoka katika kila taifa chini ya mbingu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yudea.” Hapa muktadha unapendelea “Wayahudi” kwa maana pana ya kikabila na kidini, kwa kuwa inasemwa kwamba walitoka katika kila taifa chini ya mbingu.
    reason: alternative_reading
  - marker: b
    text: “Chini ya mbingu” ni nahau ya kibiblia yenye maana ya sehemu zote za ulimwengu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: Kulikuwa na
  rationale: Muundo huu wa Kiswahili unatoa kwa kawaida maana ya uwepo inayobebwa na ἦσαν. Kiunganishi hafifu δέ hakihitaji neno tofauti hapa, kwa kuwa mtiririko wa simulizi unaeleweka bila kuingiza tofauti au wakati usiotajwa wazi.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: waliokuwa wakiishi Yerusalemu
  rationale: Huhifadhi maana ya kuishi au kukaa kama wakazi mahali fulani; hali ya kuendelea inaonyeshwa kwa “walikuwa wakiishi,” bila kudokeza ziara fupi tu.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Katika muktadha huu neno linamaanisha kwa upana jamii ya kikabila na kidini ya Kiyahudi, kwa kuwa watu hao wametoka mataifa mbalimbali, si eneo la Yudea peke yake.
- source_word: ἄνδρες εὐλαβεῖς
  choice: wanaume wenye kumcha Mungu
  rationale: “Wanaume” huhifadhi umahususi wa ἄνδρες, na “wenye kumcha Mungu” ni usemi wa kawaida na wenye heshima unaoonyesha uchaji na kujitoa kwa Mungu.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: waliotoka katika kila taifa
  rationale: Hutoa kwa kawaida asili yao kutoka mataifa mbalimbali huku ikihifadhi usemi mpana wa kila taifa.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: chini ya mbingu
  rationale: Huhifadhi nahau ya kibiblia badala ya kuibadilisha moja kwa moja kuwa “ulimwenguni kote”; tanbihi inaeleza maana yake.
theological_decisions:
- issue: Maana ya Ἰουδαῖοι
  choice: Wayahudi
  alternative: watu wa Yudea
  rationale: Maelezo kwamba wametoka katika kila taifa chini ya mbingu yanaelekeza kwa Wayahudi wa ughaibuni na maana pana ya kikabila na kidini, si wakazi wa eneo la Yudea pekee.
- issue: Uwasilishaji wa jinsia katika ἄνδρες
  choice: wanaume
  alternative: watu
  rationale: Nomino ya Kigiriki ni ya kiume kwa umahususi, hivyo “wanaume” huhifadhi taarifa ya matini badala ya kuifanya kuwa ya kijumla.
- issue: Upeo wa “kila taifa chini ya mbingu”
  choice: kuhifadhi nahau hiyo
  alternative: kutoka ulimwenguni kote
  rationale: Usemi wa asili ni wa jumla na wa kinahau. Kuuhifadhi kunatunza mtindo wa kibiblia, huku tanbihi ikifafanua kwamba unamaanisha sehemu zote za ulimwengu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida kwa msomaji wa kawaida, huku ikihifadhi umahususi wa “wanaume,” maana ya kudumu kiasi katika “waliokuwa wakiishi,” na nahau ya “chini ya mbingu.”
