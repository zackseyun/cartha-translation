  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: sw
  text: Kila siku, huku wakiendelea kwa nia moja katika eneo la Hekalu,[a] na wakimega mkate[b] nyumba kwa nyumba, walikuwa wakila chakula kwa furaha na unyofu wa moyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linamaanisha eneo lote la Hekalu, si patakatifu pa ndani pekee.
    reason: cultural_note
  - marker: b
    text: ‘Kumega mkate’ huenda kunamaanisha kula milo ya kawaida pamoja, ingawa wengine huona kuwa pia kunahusisha Meza ya Bwana.
    reason: alternative_reading
  - marker: c
    text: Au, ‘kwa moyo mnyofu,’ ‘kwa moyo wa dhati,’ au ‘kwa moyo wa ukarimu.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Kila siku
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha tendo lililorudiwa siku baada ya siku.
- source_word: προσκαρτεροῦντες
  choice: waliendelea
  rationale: Kitenzi hiki kinaonyesha kudumu au kuendelea katika tendo; muktadha wa wakati uliopita unahitaji muundo huu wa Kiswahili.
- source_word: ὁμοθυμαδόν
  choice: kwa umoja
  rationale: Huwasilisha hali ya kuwa na nia au kusudi moja bila kutumia usemi mzito au wa kale.
- source_word: ἐν τῷ ἱερῷ
  choice: katika maeneo ya Hekalu
  rationale: ἱερόν humaanisha eneo lote la Hekalu, si patakatifu pa ndani pekee.
- source_word: κλῶντές ... ἄρτον
  choice: walimega mkate
  rationale: Huhifadhi nahau ya Luka-Matendo bila kuamua kwamba ilikuwa milo ya kawaida tu au Meza ya Bwana.
- source_word: κατ’ οἶκον
  choice: nyumba kwa nyumba
  rationale: 'Huhifadhi maana ya ugawanyaji: tendo lilifanyika katika nyumba mbalimbali.'
- source_word: μετελάμβανον τροφῆς
  choice: Walishiriki chakula
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha ushiriki wao wa pamoja katika kula, huku 'chakula' kikibaki karibu na τροφή.
- source_word: ἐν ἀγαλλιάσει
  choice: kwa furaha
  rationale: Hutoa maana ya shangwe au furaha kubwa kwa lugha rahisi na ya sasa.
- source_word: ἀφελότητι καρδίας
  choice: moyo usio na hila
  rationale: Huwasilisha uwazi, unyofu, na kutokuwa na kujifanya, huku ikiepuka kufungia neno katika maana ya ukarimu pekee.
theological_decisions:
- issue: Iwapo ‘kumega mkate’ kutafsiriwe wazi kuwa Meza ya Bwana/Ekaristi
  choice: Kuhifadhi usemi mpana ‘walimega mkate’
  alternative: Kuutafsiri kuwa mlo wa kawaida tu, au kuutaja moja kwa moja kuwa Meza ya Bwana
  rationale: Katika Luka-Matendo usemi huu unaweza kumaanisha ushirika wa kula na pia kuwa na mwangwi wa Meza ya Bwana. Kutaja ‘chakula’ katika muktadha kunaunga mkono milo ya pamoja, lakini hakufuti uwezekano wa maana ya kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Maeneo ya Hekalu’ hufafanua ἱερόν kwa usahihi; ‘moyo usio na hila’ ni wa kawaida zaidi kuliko ‘usahili wa moyo’ na huhifadhi upana wa ἀφελότης.
