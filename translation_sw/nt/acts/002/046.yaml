  terminology: '"Eneo la Hekalu" hutofautisha ἱερόν, yaani eneo tata la Hekalu, na patakatifu pa ndani. "Kumega mkate" huhifadhi usemi mpana bila kuamua kuwa ni Meza ya Bwana pekee. Alama ya tanbihi kuhusu usemi huo imehamishwa karibu na maneno inayoyafafanua.'
