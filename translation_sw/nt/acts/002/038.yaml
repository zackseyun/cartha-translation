  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: sw
  text: Petro akawaambia, “Tubuni, na kila mmoja wenu abatizwe kwa jina la Yesu Masihi[a] kwa ajili ya msamaha wa dhambi zenu[b], nanyi mtapokea kipawa cha Roho Mtakatifu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Cheo cha Kigiriki Χριστός kinaweza kutafsiriwa “Masihi” au “Kristo”; hapa “Masihi” limetumiwa ili kudumisha maana ya cheo hicho katika tangazo la Petro.
    reason: alternative_reading
  - marker: b
    text: Maneno “kwa ajili ya msamaha wa dhambi zenu” yanatafsiri Kigiriki moja kwa moja. Wafafanuzi hutofautiana kuhusu jinsi ubatizo unavyohusiana na msamaha hapa; tafsiri hii haiamui mjadala huo zaidi ya maneno ya matini yenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Tubuni
  rationale: Ni amri ya wingi inayodai mwitikio wa dhati. ‘Tubuni’ ni neno la kawaida na fupi linalohifadhi maana ya kubadili nia na mwenendo bila kuifafanua kupita kiasi.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: kila mmoja wenu abatizwe
  rationale: Muundo huu unahifadhi amri ya hali tendwa na msisitizo wa Kigiriki kwamba kila mtu katika kundi aitikie binafsi.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: kwa jina la
  rationale: Huu ni usemi wa kawaida wa Kiswahili katika muktadha wa ubatizo. Hauamui iwapo jina linadokeza msingi, mamlaka, au ungamo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Katika hotuba hii Χριστός bado ni cheo chenye maana ya Mpakwa-Mafuta aliyeahidiwa; ‘Masihi’ hudumisha maana hiyo wazi katika Kiswahili.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: kwa ajili ya msamaha wa dhambi zenu
  rationale: Tafsiri hii ni ya moja kwa moja na ya kawaida, inahifadhi wingi wa ‘dhambi,’ na haiongezi maelezo yanayoamua kwa namna ya kimadhehebu uhusiano wa ubatizo na msamaha.
- source_word: λήμψεσθε τὴν δωρεὰν
  choice: mtapokea kipawa
  rationale: Muundo huu unatoa ahadi ya wakati ujao kwa Kiswahili cha sasa; ‘kipawa’ huonyesha kitu kinachotolewa bila kuongeza neno lisilokuwamo katika matini.
- source_word: τοῦ ἁγίου πνεύματος
  choice: cha Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida na lenye heshima katika Kiswahili cha kisasa, huku uhusiano wa kisarufi wa kipawa na Roho ukiachwa kama ulivyo katika chanzo.
theological_decisions:
- issue: Uhusiano wa ubatizo na msamaha katika εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: kwa ajili ya msamaha wa dhambi zenu
  alternative: ili dhambi zenu zisamehewe; kwa sababu dhambi zenu zimesamehewa
  rationale: Matini inaunganisha ubatizo na msamaha lakini haifafanui hapa kwa kina namna ya uhusiano huo. Tafsiri kuu haipaswi kuingiza msimamo kuhusu ufanisi wa kisakramenti, mfuatano, au ishara.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha wa Matendo 2 ni tangazo la wazi kuhusu Masihi; kwa hiyo kutafsiri cheo hiki hudumisha maana yake badala ya kukifanya kionekane tu kama jina jingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tubuni,’ ‘abatizwe,’ na ‘Roho Mtakatifu’ ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kuwa ya kizamani. Alama za tanbihi [a] na [b] zimewekwa mara baada ya maneno yanayohusika.
