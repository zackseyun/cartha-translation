base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: sw
  text: Basi, nyumba yote ya Israeli na ijue kwa hakika kwamba Mungu amemfanya Yesu huyu kuwa Bwana na Masihi[a][b]—Yesu huyu, ambaye ninyi mlimsulubisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός (Christos) hapa ni cheo, na limetafsiriwa “Masihi” ili kudumisha maana hiyo katika hotuba ya Petro kwa Israeli.
    reason: alternative_reading
  - marker: b
    text: Katika muktadha wake, kauli “Mungu amemfanya Yesu huyu kuwa Bwana na Masihi” inahusu kuinuliwa kwake na kutangazwa hadharani katika hadhi hizo; haimaanishi mabadiliko ya asili yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: kwa hakika
  rationale: Kirai hiki cha kawaida katika Kiswahili cha sasa kinaonyesha uhakika unaosisitizwa na kielezi cha Kigiriki.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kinaonyesha kwamba kauli hii ni hitimisho linalotokana na hoja iliyotangulia kuhusu kufufuliwa na kuinuliwa kwa Yesu.
- source_word: γινωσκέτω
  choice: na ijue
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu, huku kitenzi kikiwa katika umoja kulingana na nomino ya mkusanyiko “nyumba.”
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: nyumba yote ya Israeli
  rationale: Huhifadhi msemo wa kibiblia unaowaonyesha watu wa agano kwa ujumla badala ya kuufupisha kuwa “Israeli wote.”
- source_word: κύριον
  choice: Bwana
  rationale: Huwasilisha cheo cha mamlaka kilichoinuliwa na mwangwi wake katika nukuu iliyotangulia; “bwana mkubwa” au “mtawala” kungepunguza au kubadili maana.
- source_word: Χριστόν
  choice: Masihi
  rationale: Katika hotuba kwa nyumba ya Israeli, neno hili linafanya kazi wazi kama cheo cha mfalme aliyetiwa mafuta, hivyo “Masihi” hudumisha maana hiyo.
- source_word: ἐποίησεν
  choice: amemfanya ... kuwa
  rationale: Huhifadhi maana ya msingi ya kitenzi “kufanya” na matokeo yake yanayoendelea sasa, bila kukibadilisha moja kwa moja kuwa “amemteua” au “amemtawaza.”
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Yesu huyu
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na huhifadhi msisitizo wa kiashiria kwa Yesu yuleyule wa kihistoria.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: yeye ambaye ninyi mlimsulubisha
  rationale: Huhifadhi shutuma ya moja kwa moja, huku “ninyi” ikitoa msisitizo uliopo katika kiwakilishi cha Kigiriki.
theological_decisions:
- issue: Maana ya “Mungu amemfanya ... kuwa Bwana na Masihi”
  choice: Kauli imetafsiriwa moja kwa moja kwa “amemfanya ... kuwa,” huku tanbihi ikieleza uwezekano wa maana ya kuwekwa au kuinuliwa hadharani katika nafasi hizo.
  alternative: Kutafsiri moja kwa moja kuwa “amemteua” au “amemtawaza,” au kuielewa kuwa mabadiliko ya asili yake.
  rationale: ἐποίησεν kwa msingi ni “alifanya,” kwa hiyo tafsiri kuu haipaswi kuficha nguvu yake. Katika muktadha wa kufufuliwa na kuinuliwa kwa Yesu, kauli inaweza kueleza kuwekwa kwake wazi katika hadhi na majukumu hayo; lakini tafsiri haipaswi kutatua kimya kimya mvutano wa kauli kwa kuingiza istilahi finyu zaidi.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Kwa kuwa Petro anazungumza na nyumba ya Israeli na anatangaza cheo cha Yesu, “Masihi” huonyesha kwa uwazi maana ya cheo cha Χριστός; “Kristo” imewekwa katika tanbihi kama tafsiri mbadala iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Msemo wa kibiblia “nyumba yote ya Israeli” umehifadhiwa; “kwa hakika” na “Yesu huyu” ni miundo ya sasa na ya asili. Alama zote za tanbihi zimewekwa mara baada ya “Masihi,” ambako masuala yote mawili yanahusika.
