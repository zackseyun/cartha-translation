  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: sw
  text: '“Enyi wanaume Waisraeli, sikilizeni maneno haya: Yesu Mnazareti[a], mwanamume aliyethibitishwa kwenu na Mungu kwa matendo ya nguvu[b], maajabu na ishara ambazo Mungu alizifanya kupitia yeye katikati yenu, kama ninyi wenyewe mnavyojua—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu wa Nazareti.” Jina la utambulisho la Kigiriki Ναζωραῖος linaweza kutafsiriwa kwa namna zaidi ya moja.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa miujiza, maajabu na ishara.” Neno la Kigiriki δυνάμεσι linaweza kutafsiriwa kwa maana ya karibu ya “matendo ya nguvu” au “miujiza” katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Enyi wanaume Waisraeli
  rationale: Kauli ya mwito inadumisha jinsia ya kiume iliyo wazi katika ἄνδρες na utambulisho wa kikabila katika Ἰσραηλῖται; “Enyi” ni ya heshima na ya kawaida katika lugha ya hotuba.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: sikilizeni maneno haya
  rationale: Imperativi inadai wasikilizaji watoe usikivu; “sikilizeni” ni ya asili zaidi katika Kiswahili kuliko “yasikieni,” huku “maneno haya” ikidumisha λόγους bila kuifasiri kuwa “ujumbe.”
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Yesu Mnazareti
  rationale: “Mnazareti” inadumisha nguvu ya jina la utambulisho Ναζωραῖος na ni umbo la kawaida la Kiswahili; uwezekano wa maana ya kijiografia umeonyeshwa katika tanbihi.
- source_word: ἄνδρα
  choice: mtu
  rationale: Katika Kiswahili “mtu” ndilo neno la kawaida na lenye hadhi kwa mwanadamu wa kiume katika muundo huu; Yesu tayari ametajwa kwa jina na kiambishi cha ngeli cha “aliyethibitishwa” kinaendeleza rejeo hilo bila kukanusha ubinadamu wake.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: aliyethibitishwa kwenu na Mungu
  rationale: “Aliyethibitishwa” huwasilisha kuonyeshwa hadharani kuwa wa kweli au mwenye kibali; “na Mungu” hudumisha Mungu kuwa mtendaji, na “kwenu” hufuata mwelekeo wa εἰς ὑμᾶς.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: kwa matendo ya nguvu, maajabu na ishara
  rationale: “Matendo ya nguvu” huonyesha maana ya δυνάμεσι kwa uwazi bila kuyachanganya na uwezo wa kidhahania, na inadumisha utatu wa maneno tofauti pamoja na “maajabu” na “ishara.”
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: ambazo Mungu alizifanya kupitia yeye
  rationale: Mungu anabaki kuwa kiima cha tendo, na “kupitia yeye” hudumisha uwakala wa kati unaoonyeshwa na δι’ αὐτοῦ.
- source_word: ἐν μέσῳ ὑμῶν
  choice: katikati yenu
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya nahau, yenye maana ya ndani ya jumuiya yao.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: kama ninyi wenyewe mnavyojua
  rationale: “Ninyi wenyewe” inadumisha mkazo wa αὐτοὶ, na “kama ... mnavyojua” ni muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Ubinadamu wa Yesu katika ἄνδρα
  choice: Kutumia “mtu” katika matini kuu
  alternative: “mwanamume”
  rationale: ἄνδρα humtaja Yesu kuwa mwanadamu wa kiume. Katika muktadha huu “mtu” ni Kiswahili cha asili zaidi na hakifuti ukweli huo, kwa kuwa jina Yesu na marejeo ya kisarufi yanautambulisha wazi mhusika; tafsiri haiongezi wala kupunguza madai mengine ya kikristo kuhusu asili yake.
- issue: Uwakala katika matendo ya nguvu
  choice: 'Mungu ndiye kiima: “ambazo Mungu alizifanya kupitia yeye”'
  alternative: “ambazo Yesu alizifanya”
  rationale: Kiyunani kinamtaja ὁ θεὸς wazi kuwa mtendaji na δι’ αὐτοῦ humtaja Yesu kuwa njia ya utendaji huo. Muundo huu unadumisha mvutano wa kikristo wa kifungu bila kuupatanisha kimya kimya na mafungu mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kinachofaa hotuba ya hadharani. Mstari umeachwa ukiishia kwa kistari kirefu kwa sababu sentensi inaendelea katika mstari unaofuata. Kiunganishi “na” hakijarudiwa kabla ya kila nomino katika orodha kwa kuwa muundo “matendo ya nguvu, maajabu na ishara” ni wa asili zaidi katika Kiswahili huku ukidumisha vipengele vyote vitatu.
