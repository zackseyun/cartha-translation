lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: Frigia na Pamfilia
  rationale: Majina ya maeneo yametoholewa kwa namna iliyozoeleka katika Kiswahili; τε καὶ inaunganisha vipengele vya orodha kwa 'na'.
- source_word: Αἴγυπτον
  choice: Misri
  rationale: Hili ndilo jina la kawaida la nchi hiyo katika Kiswahili.
- source_word: τὰ μέρη τῆς Λιβύης
  choice: sehemu za Libia
  rationale: Neno μέρη lina maana ya sehemu au maeneo; 'sehemu' linadumisha usemi halisi huku likibaki la kawaida.
- source_word: τῆς κατὰ Κυρήνην
  choice: kuelekea Kirene
  rationale: κατά pamoja na jina la mahali huonyesha sehemu ya Libia kwa uhusiano wake na Kirene; 'kuelekea' huhifadhi maana ya kijiografia bila kuweka mipaka ya kisiasa isiyotajwa.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: Waroma waliokuwa wakikaa huko kwa muda
  rationale: Kitenzi shiriki ἐπιδημοῦντες humaanisha watu waliokuwapo mahali kwa muda, si lazima wakazi wa kudumu; tafsiri hii inaweka maana hiyo wazi na kutaja Waroma kama kundi.
