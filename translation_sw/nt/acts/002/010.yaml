  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: sw
  text: Frigia na Pamfilia, Misri na sehemu za Libia kuelekea Kirene, na Waroma waliokuwa wageni[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waroma waliokuwa wakikaa kwa muda” au “Waroma waliotembelea.”
