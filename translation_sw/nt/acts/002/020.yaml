  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: sw
  text: Jua litageuzwa kuwa giza, na mwezi kuwa damu, kabla haijaja siku ile kuu na yenye utukufu ya Bwana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “inayodhihirika wazi” au “mashuhuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: litageuzwa
  rationale: Huhifadhi hali ya wakati ujao na kauli tendwa, pamoja na taswira ya kugeuzwa kutoka hali moja kwenda nyingine.
- source_word: εἰς σκότος
  choice: kuwa giza
  rationale: Katika Kiswahili, “kugeuzwa kuwa giza” huonyesha kwa kawaida matokeo au hali mpya inayokusudiwa na εἰς.
- source_word: εἰς αἷμα
  choice: kuwa damu
  rationale: Huhifadhi taswira kali na halisi ya unabii bila kuifafanua kuwa rangi nyekundu kama damu.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: kabla haijaja
  rationale: Ni muundo wa asili wa Kiswahili unaoonyesha kwamba tukio hili litatangulia kuja kwa siku hiyo.
- source_word: ἡμέραν κυρίου
  choice: siku ya Bwana
  rationale: Huhifadhi msemo wa kinabii wa Maandiko kuhusu siku ya kuingilia kati kwa Mungu na huepuka maana ya siku ya kawaida ya ibada.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος na inahifadhi mwangwi wa lugha ya kinabii katika nukuu ya Yoeli.
- source_word: μεγάλην
  choice: kuu
  rationale: “Kuu” huwasilisha μέγας kwa lugha yenye hadhi inayofaa siku hii ya kipekee.
- source_word: ἐπιφανῆ
  choice: iliyo wazi
  rationale: Neno hilo kimsingi linaweza kueleza jambo linaloonekana wazi au mashuhuri; tafsiri hii huhifadhi wazo la udhihirisho bila kulibadili moja kwa moja kuwa “utukufu.”
theological_decisions:
- issue: Tafsiri ya msemo wa kinabii ἡμέραν κυρίου katika nukuu ya Yoeli ndani ya hotuba ya Petro
  choice: siku ya Bwana
  alternative: siku ya Bwana wetu
  rationale: “Siku ya Bwana” ndiyo msemo wa kibiblia unaohifadhi historia ya kinabii na kutofafanua zaidi utambulisho wa κύριος kuliko maandishi yanavyofanya.
- issue: Maana ya ἐπιφανῆ katika muktadha wa siku ya Bwana
  choice: iliyo wazi
  alternative: yenye utukufu; mashuhuri
  rationale: ἐπιφανής inaweza kusisitiza kuonekana au kudhihirika wazi, na pia kuwa mashuhuri au yenye fahari. Maandishi makuu yanatunza maana ya udhihirisho, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kinabii ulio wazi na wenye hadhi. Muundo sambamba wa jua na mwezi umehifadhiwa, na taswira ya “damu” haijafasiriwa kwa maelezo ya ziada.
