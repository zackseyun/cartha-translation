  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: sw
  text: 'Nami nitatoa maajabu mbinguni juu na ishara duniani chini: damu, moto, na mvuke wa moshi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώσω
  choice: nitaonyesha
  rationale: Ingawa kitenzi hiki kwa msingi ni ‘nitatoa,’ Kiswahili cha kawaida husema ‘kuonyesha maajabu.’ Hii inaleta maana ya Mungu kuyadhihirisha bila kutumia usemi usio wa kawaida ‘kutoa maajabu.’
- source_word: τέρατα
  choice: maajabu
  rationale: Neno hili linaashiria matukio ya ajabu yanayoleta mshangao; ‘maajabu’ ni neno la kawaida na linaendana vizuri na ‘ishara.’
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: mbinguni juu
  rationale: Huhifadhi mahali pa juu na ulinganifu wa kimakusudi na ‘duniani chini,’ huku ‘mbinguni’ likibaki na upeo wa kinabii na wa ulimwengu mzima.
- source_word: σημεῖα
  choice: ishara
  rationale: ‘Ishara’ huonyesha matukio yenye maana yanayoelekeza kwenye jambo jingine, na ni tafsiri ya kawaida ya σημεῖα.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: duniani chini
  rationale: Katika ulinganifu na mbingu, γῆ hapa ni dunia, si eneo fulani la nchi; ‘chini’ huhifadhi utofautishaji wa wima.
- source_word: αἷμα
  choice: damu
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira halisi ya kinabii.
- source_word: πῦρ
  choice: moto
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira yenye nguvu ya unabii.
- source_word: ἀτμίδα καπνοῦ
  choice: wingu la moshi
  rationale: ἀτμίς linaweza kumaanisha mvuke au ukungu. ‘Wingu la moshi’ linaeleza kwa Kiswahili cha kawaida mkusanyiko wa moshi unaoonekana; tafsiri ya karibu zaidi na umbo la Kigiriki imewekwa katika tanbihi.
theological_decisions:
- issue: Mahali pa ishara za ulimwengu katika nukuu ya Yoeli
  choice: mbinguni juu ... duniani chini
  alternative: angani juu ... katika nchi chini
  rationale: Utofautishaji wa οὐρανός na γῆ una upeo wa ulimwengu na wa kinabii. ‘Mbinguni ... duniani’ huhifadhi upeo huo bila kuufanya kuwa tukio la hali ya hewa tu au la eneo moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. ‘Nami’ huendeleza kiunganishi καί; mpangilio wa ‘juu ... chini’ umehifadhiwa. Nukta mbili zinatambulisha orodha ya ishara zinazofuata.
