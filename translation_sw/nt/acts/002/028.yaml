base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: sw
  text: Ulinijulisha njia za uzima; utanijaza furaha mbele zako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “pamoja na uso wako”; yaani, “katika uwepo wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: Umenijulisha
  rationale: Kitenzi cha Kiswahili kinawasilisha kwa kawaida maana ya kumfanya mtu ajue; wakati timilifu unafaa katika dondoo hili na kiwakilishi cha yambwa kinajumuisha μοι.
- source_word: ὁδοὺς ζωῆς
  choice: njia za uzima
  rationale: “Njia” huhifadhi wingi na taswira ya ὁδός, huku “uzima” likiwa neno la kawaida la kibiblia kwa ζωή na halielekezi kimakosa kwenye mitindo ya maisha.
- source_word: πληρώσεις με εὐφροσύνης
  choice: utanijaza furaha
  rationale: Huhifadhi wakati ujao, yambwa “-ni-,” na furaha kama kitu anachojazwa nacho msemaji.
- source_word: μετὰ τοῦ προσώπου σου
  choice: mbele zako
  rationale: Hii ni nahau ya kawaida na yenye hadhi katika Kiswahili kwa kuwa katika uwepo wa mtu, na pia inadumisha kwa kiasi taswira halisi ya uso kuliko tafsiri iliyoeleza maana pekee.
theological_decisions:
- issue: Nahau ya uso wa Mungu katika dondoo la Zaburi
  choice: mbele zako
  alternative: katika uwepo wako
  rationale: “Mbele zako” ni ya asili katika Kiswahili na huhifadhi uzito wa uhusiano wa kuwa mbele ya Mungu bila kuingiza ufafanuzi wa kimadhehebu. Tanbihi inaonyesha maana ya nahau na uso wake wa kifasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi wa sentensi mbili umehifadhiwa.
