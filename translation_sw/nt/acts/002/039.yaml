  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: sw
  text: Kwa maana ahadi ni yenu na ya watoto wenu na ya wote walio mbali[a], yaani, wote ambao Bwana Mungu wetu atawaita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote walio mbali sana.” Kauli hii inaweza kumaanisha walio mbali kijiografia, walio mbali katika uhusiano wa agano, au yote mawili.
    reason: lexical_alternative
  - marker: b
    text: Au, “kila ambaye Bwana Mungu wetu atamwita.” Kigiriki husema kwa karibu, “wote ambao Bwana Mungu wetu anaweza kuwaita/atawaita.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία
  choice: ahadi hii
  rationale: Neno hili kimsingi humaanisha “ahadi.” Kiashiria “hii” kinaeleweka kwa kawaida katika Kiswahili kwa kurejelea ahadi inayozungumziwa katika muktadha, bila kulibadili kuwa “kipawa kilichoahidiwa.”
- source_word: τέκνοις
  choice: watoto
  rationale: “Watoto” ni tafsiri ya kawaida na ya kiasili ya τέκνα, inayohifadhi uhusiano wa kifamilia bila kubainisha umri.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: wote walio mbali
  rationale: Kauli hii huhifadhi upana wa maana ya umbali, ambao unaweza kuwa wa kijiografia, wa uhusiano wa agano, au yote mawili.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: wote ambao ... atawaita
  rationale: Muundo huu huonyesha kundi lisilobainishwa lakini kamili kwa kadiri ya mwito wa Mungu. Wakati ujao wa Kiswahili unaonyesha tendo linalotarajiwa bila kuingiza mfumo maalumu wa kisoteriolojia; “kwake” halijaongezwa kwa kuwa haliko wazi katika maandishi.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: Bwana Mungu wetu
  rationale: Huhifadhi utambulisho wa mhusika kama “Bwana Mungu wetu” kwa mtindo wa kawaida na wenye heshima wa Kiswahili cha Biblia.
- source_word: γάρ
  choice: Kwa maana
  rationale: Huonyesha kuwa mstari huu unatoa msingi wa himizo lililotangulia.
theological_decisions:
- issue: Maana ya “walio mbali”
  choice: Kauli imeachwa pana bila kuwafungia kwa Wayahudi wa ughaibuni au Mataifa pekee.
  alternative: Wayahudi walio mbali kijiografia pekee, Mataifa pekee, au wote walio mbali kijiografia na katika uhusiano wa agano.
  rationale: Mstari wenyewe haubainishi kundi moja tu; tafsiri huhifadhi utata halisi na mwangwi mpana wa kibiblia.
- issue: Maana ya mwito wa Mungu katika ὅσους ἂν προσκαλέσηται
  choice: “wote ambao Bwana Mungu wetu atawaita”
  alternative: Mwito wenye matokeo usiyozuilika, au mwaliko wa jumla.
  rationale: Kigiriki kinathibitisha mwito wa Mungu lakini hakielezi hapa namna au utendaji wake; tafsiri haipendelei mfumo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya “kwa ajili ya” yanafafanua upeo wa ahadi, na alama ya mkato inaonyesha kuwa kishazi cha mwisho kinaweka mpaka wa kundi lililotajwa.
