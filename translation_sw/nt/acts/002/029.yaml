  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: sw
  text: '“Enyi wanaume, ndugu[a], nina ruhusa ya kusema nanyi kwa ujasiri kuhusu baba mkuu Daudi: alikufa na akazikwa, na kaburi lake liko miongoni mwetu hadi leo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndugu.” Kigiriki kina kihalisi “Wanaume, ndugu,” namna rasmi ya kuwahutubia Waisraeli wenzake waliokusanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Enyi wanaume, ndugu zangu
  rationale: Maneno yote mawili ya mwito yamehifadhiwa ili kuonyesha uzito wa hotuba na umbo la kiume lililo wazi katika Kigiriki, huku ‘ndugu zangu’ ikiwa njia ya kawaida na yenye heshima ya kuwahutubia watu kwa Kiswahili.
- source_word: ἐξὸν εἰπεῖν
  choice: naweza kusema
  rationale: Katika muktadha huu msemo huo unaonyesha uhuru au ruhusa ya kusema, si uwezo wa kimwili tu. ‘Naweza kusema’ ni ya kawaida katika Kiswahili na, ikiunganishwa na ‘kwa ujasiri,’ inaleta maana ya kusema bila kizuizi.
- source_word: μετὰ παρρησίας
  choice: kwa ujasiri
  rationale: Huhifadhi wazo la kusema kwa uwazi, uhuru na ujasiri mbele ya hadhara.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: kuhusu baba mkuu Daudi
  rationale: ‘Baba mkuu’ ni jina la heshima linaloeleweka kwa πατριάρχης bila kuongeza ‘yetu,’ ambalo halipo wazi katika Kigiriki.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: alikufa na akazikwa
  rationale: Hutoa moja kwa moja mambo yote mawili yaliyosisitizwa na καί ... καί. Kiswahili hakihitaji muundo mzito kama ‘alikufa na pia akazikwa’ ili kuyahifadhi.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: kaburi lake
  rationale: μνῆμα hapa ni mahali pa maziko panapojulikana; ‘kaburi’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: ἔστιν ἐν ἡμῖν
  choice: liko miongoni mwetu
  rationale: Huhifadhi maana ya kuwepo kwa kaburi katika eneo au jamii ya wasemaji na wasikilizaji.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: hadi leo
  rationale: Ni msemo wa kawaida wa Kiswahili unaoonyesha kwamba hali hiyo iliendelea mpaka wakati wa hotuba.
theological_decisions:
- issue: Jinsi ya kutafsiri mwito wa kiume Ἄνδρες ἀδελφοί
  choice: Enyi wanaume, ndugu zangu
  alternative: Ndugu zangu
  rationale: Kigiriki kina majina mawili ya mwito yaliyo katika umbo la kiume. Tafsiri kuu inayahifadhi yote badala ya kuyafupisha au kuongeza kwa uhakika ‘dada,’ jambo ambalo maandishi hayasemi wazi. Tanbihi inatoa usemi mfupi na wa kawaida zaidi bila kuficha ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa hotuba ya hadharani lakini unabaki wazi kwa msomaji wa kawaida; istilahi ‘baba mkuu’ imetumiwa kwa cheo cha πατριάρχης.
