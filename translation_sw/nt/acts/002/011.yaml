  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: sw
  text: Wayahudi na waongofu wa dini ya Kiyahudi, Wakrete na Waarabu—tunawasikia wakisema kwa lugha[a] zetu wenyewe mambo makuu ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndimi.” Neno la Kigiriki linaweza kumaanisha “ndimi” au “lugha”; hapa muktadha unaonyesha lugha za kibinadamu zinazotambulika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: Wayahudi
  rationale: Katika orodha hii neno hilo linamaanisha watu wa Kiyahudi, si wakazi wa Yudea pekee.
- source_word: τε καὶ
  choice: na
  rationale: Kiswahili hutumia “na” kwa kawaida kuunganisha makundi haya; muundo wa Kigiriki hauhitaji kurudiwa kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: προσήλυτοι
  choice: waongofu wa dini ya Kiyahudi
  rationale: Hufafanua kwa usahihi watu wa mataifa mengine waliokuwa wameingia katika dini ya Kiyahudi, bila kutegemea istilahi ngumu ya kitaalamu.
- source_word: Κρῆτες
  choice: Wakrete
  rationale: Jina la kawaida la Kiswahili kwa watu wa Krete.
- source_word: Ἄραβες
  choice: Waarabu
  rationale: Jina la kawaida la Kiswahili kwa watu wa Kiarabu.
- source_word: ἀκούομεν
  choice: tunawasikia
  rationale: Wakati wa sasa unaonyesha jambo ambalo wasemaji wanalishuhudia papo hapo; kiambishi cha yambwa kinawaelekezea wale wanaosema.
- source_word: λαλούντων αὐτῶν
  choice: wakisema
  rationale: Huwasilisha kwa lugha ya kawaida muundo wa kusikia watu wakinena, bila kuongeza maana ya kutangaza rasmi.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: kwa lugha zetu wenyewe
  rationale: Muktadha wa umati wa mataifa mbalimbali unaonyesha lugha za kibinadamu zinazotambulika; “zetu wenyewe” huhifadhi mkazo wa ἡμετέραις.
- source_word: τὰ μεγαλεῖα
  choice: matendo makuu
  rationale: Hueleza mambo makuu yenye nguvu ambayo Mungu ametenda, kwa usemi wa kawaida na wenye hadhi.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Huhifadhi uhusiano wa asili unaoyaonyesha matendo hayo kuwa ya Mungu au yaliyotendwa naye.
theological_decisions:
- issue: Maana ya γλώσσαις katika muktadha wa Pentekoste
  choice: lugha za kibinadamu zinazotambulika
  alternative: ndimi au matamshi yasiyo lugha za kawaida
  rationale: Muktadha wa karibu unasisitiza kwamba watu kutoka mataifa mbalimbali walisikia kwa lugha zao wenyewe. Tafsiri “lugha” inafuata maana ya simulizi bila kuingiza mabishano ya baadaye kuhusu kunena kwa ndimi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Waongofu wa dini ya Kiyahudi” ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi ya mkopo “proseliti.” Alama ya tanbihi imewekwa baada ya “lugha,” ambako hoja yake ya kileksika inahusika.
