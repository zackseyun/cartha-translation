  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: sw
  text: Na itakuwa kwamba kila mtu atakayeliitia jina la Bwana ataokolewa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeyote atakayeliitia jina la Bwana.” Maneno haya yanarejelea Yoeli 2:32, ambako “Bwana” ni YHWH; katika Matendo, Petro anatumia nukuu hii ndani ya tangazo lake kuhusu Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: itakuwa
  rationale: Wakati ujao wa εἰμί unatumiwa katika kauli ya utangulizi. “Itakuwa” huhifadhi uzito wa kinabii wa nukuu na ni Kiswahili cha kawaida.
- source_word: πᾶς ὃς ἐὰν
  choice: kila mtu atakaye-
  rationale: Muundo huu huonyesha sharti lisiloainishwa lenye kuwahusu wote; “kila mtu atakaye-” huhifadhi upeo huo kwa lugha ya asili.
- source_word: ἐπικαλέσηται
  choice: at … liitia
  rationale: Katika nahau ya kibiblia, kuliitia jina ni kumwomba au kumtegemea mhusika anayetajwa. “Kuliitia jina” huhifadhi taswira na maana ya ibada bila kuifafanua kupita kiasi.
- source_word: τὸ ὄνομα
  choice: jina
  rationale: Imetafsiriwa moja kwa moja ili kuhifadhi nahau ya kibiblia “kuliitia jina,” pamoja na maana zake za agano na ibada.
- source_word: κυρίου
  choice: Bwana
  rationale: Κύριος imetafsiriwa “Bwana,” bila kumbainisha anayerejelewa, hivyo kuhifadhi maneno ya Kigiriki na mvutano wa kimuktadha.
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Wakati ujao wa kutendwa wa σῴζω. “Ataokolewa” ni tafsiri ya kawaida inayohifadhi maana za kuponywa na kuokolewa.
theological_decisions:
- issue: Anayerejelewa na “Bwana” katika nukuu ya Yoeli kama inavyotumiwa katika Matendo
  choice: Kutafsiri κύριος kuwa “Bwana” bila kumbainisha anayerejelewa katika matini kuu.
  alternative: Katika muktadha wa awali wa Yoeli, ni YHWH; katika tangazo la Petro lenye kumhusu Yesu, nukuu hiyo inaweza kuelekezwa kwa Yesu.
  rationale: Kigiriki chenyewe kinasema “Bwana.” Kutaja YHWH au Yesu katika matini kuu kungeondoa kwa tafsiri mvutano ambao kifungu kinaacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya nukuu ya kinabii. Muundo “Na itakuwa kwamba” umehifadhi mtindo wa utangulizi wa maandiko, huku “kila mtu atakayeliitia” ikiwa wazi kwa wasomaji wa kawaida.
