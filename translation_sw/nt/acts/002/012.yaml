  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: sw
  text: Nao wote walikuwa wakishangaa na kuchanganyikiwa, wakisema wao kwa wao, “Jambo hili lina maana gani?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “Hili linataka kuwa nini?” Hii ni nahau inayomaanisha, “Jambo hili lina maana gani?” au “Umuhimu wa jambo hili ni upi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: walishangaa
  rationale: Kitenzi hiki kinaonyesha hali ya mshangao mkubwa. “Walishangaa” ni Kiswahili cha kawaida na chenye heshima, bila kuleta maana ya kupoteza akili ambayo tafsiri ya moja kwa moja zaidi ingeweza kudokeza.
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si alama ya upinzani mkali. “Nao” huunganisha sentensi hii kwa kawaida na muktadha uliotangulia.
- source_word: πάντες
  choice: wote
  rationale: “Wote” huhifadhi msisitizo kwamba hali hii iliwapata watu wote wanaotajwa.
- source_word: διηπόρουν
  choice: kutatanika
  rationale: Kitenzi hiki kinaeleza kuchanganyikiwa na kukosa kujua jambo lilimaanisha nini. “Kutatanika” ni cha asili katika Kiswahili na kinatofautisha hali hiyo na mshangao wa ἐξίσταντο.
- source_word: ἄλλος πρὸς ἄλλον
  choice: wakiambiana
  rationale: Usemi huu wa kurejeana umetafsiriwa kwa kitenzi cha Kiswahili kinachoonyesha kwamba walikuwa wakisema wao kwa wao.
- source_word: λέγοντες
  choice: wakiambiana
  rationale: Umbo la “waki-” linaunganisha kitendo cha kusema na hali yao ya kushangaa na kutatanika, huku swali linalofuata likitoa yaliyosemwa.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Jambo hili lina maana gani?
  rationale: Muundo τί θέλει + εἶναι ni nahau inayouliza maana au umuhimu wa jambo. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi swali bila kulifafanua kupita kiasi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo “walishangaa na kutatanika” unasomeka kwa kawaida; “wakiambiana” huonyesha usemi wa wao kwa wao bila urudiaji mzito.
