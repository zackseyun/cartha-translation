  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: sw
  text: Wote wakajazwa Roho Mtakatifu, wakaanza kusema kwa lugha nyingine[a], kama Roho alivyowajalia kunena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndimi nyingine.” Neno la Kigiriki linaweza kumaanisha “ndimi” au “lugha”; muktadha unaofuata unaonyesha kwamba wasikilizaji waliuelewa usemi huo kama lugha halisi za wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: wakajazwa
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kwamba wote walijazwa au wakawezeshwa na Roho; “wakajazwa” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: πάντες
  choice: wote
  rationale: Neno hili linasisitiza kwamba kila mmoja katika kundi lililokuwapo alihusika.
- source_word: πνεύματος ἁγίου
  choice: Roho Mtakatifu
  rationale: Katika muktadha wa Matendo, maneno haya yanamtaja Roho wa Mungu aliyewawezesha kusema. Kiswahili hakihitaji kibainishi kinacholingana na “the” ya Kiingereza.
- source_word: ἤρξαντο λαλεῖν
  choice: wakaanza kusema
  rationale: Muundo huu unaonyesha mwanzo wa tendo; “wakaanza kusema” ni wa asili na huhifadhi mwendo wa simulizi.
- source_word: ἑτέραις γλώσσαις
  choice: kwa lugha nyingine
  rationale: γλῶσσα inaweza kumaanisha ulimi au lugha. “Lugha nyingine” ni ya asili katika Kiswahili na inafaa muktadha unaofuata, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya kimaumbo, “ndimi nyingine.”
- source_word: καθὼς
  choice: kadiri
  rationale: Hapa neno hili linaonyesha kwamba usemi wao ulilingana na uwezo ambao Roho aliwapa; “kadiri” huwasilisha uhusiano huo vizuri.
- source_word: ἐδίδου
  choice: alivyowajalia
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha utoaji wa uwezo uliokuwa ukiendelea. “Alivyowajalia” huonyesha kwamba Roho ndiye aliyewapa uwezo huo bila kufanya sentensi kuwa nzito.
- source_word: ἀποφθέγγεσθαι
  choice: kunena
  rationale: Kitenzi hiki humaanisha kusema kwa sauti au kutamka waziwazi, mara nyingi hadharani. “Kunena” ni neno la heshima linaloeleweka na halibani maana kuwa unabii pekee.
- source_word: αὐτοῖς
  choice: -wa- katika “alivyowajalia”
  rationale: Kiwakilishi cha wingi kimewakilishwa kiasili na kiambishi cha yambwa “-wa-,” kinachowarejelea watu wote waliokuwa wakisema.
theological_decisions:
- issue: Ikiwa πνεύματος ἁγίου inamtaja Roho wa Mungu binafsi au roho takatifu kwa maana ya jumla
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Muktadha wa Matendo 2 humtambulisha Roho kama yule aliyeahidiwa na Yesu na kama mtendaji anayewawezesha watu kusema. Herufi kubwa huonyesha rejeo hilo maalumu bila kuongeza fundisho lisilokuwamo katika kifungu.
- issue: Ikiwa γλώσσαις itafsiriwe “lugha” au “ndimi”
  choice: lugha nyingine
  alternative: ndimi nyingine
  rationale: Neno la Kigiriki linaweza kurejelea ndimi au lugha. Mistari inayofuata inaonyesha kwamba wasikilizaji walitambua lugha zao wenyewe, hivyo “lugha” ni ya wazi na ya asili katika Kiswahili. Tanbihi inahifadhi “ndimi” kama tafsiri halali inayofuata umbo la neno la Kigiriki kwa karibu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi wenye “waka-” umehifadhi mfululizo wa matendo. “Kunena” limetumiwa kwa uzito wa usemi wa hadharani lakini sentensi kwa jumla imebaki rahisi kueleweka.
