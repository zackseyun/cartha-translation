  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: sw
  text: Mungu alimfufua, kwa kuyafungua machungu ya mauti[a], kwa sababu haikuwezekana ashikiliwe na mauti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linalotafsiriwa “machungu” linaweza pia kumaanisha “uchungu wa kuzaa.” Hivyo linaweza kuhifadhi taswira ya mauti ikifungua mshiko wake.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ashikiliwe na yeye/hiyo”; kiwakilishi hicho kwa kawaida kinarejelea mauti.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: huyo
  rationale: Kiwakilishi hiki kinamrejelea Yesu aliyetajwa katika mstari uliotangulia na kudumisha uhusiano wa sentensi bila kulazimisha muundo usio wa kawaida katika Kiswahili.
- source_word: ἀνέστησεν
  choice: alimfufua
  rationale: Katika muktadha huu kitenzi kinamaanisha kwamba Mungu alimwinua Yesu kutoka kwa wafu; “alimfufua” ni usemi wa kawaida, wazi na sahihi katika Kiswahili.
- source_word: λύσας
  choice: akiyaondoa
  rationale: Kitenzi cha Kigiriki kimsingi humaanisha kufungua, kulegeza au kuachilia. Kwa kuwa “kufungua maumivu” si usemi wa asili katika Kiswahili, “akiyaondoa” huwasilisha tendo la kumwachilia kutoka katika nguvu zake bila kuongeza taswira mpya.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: maumivu ya mauti
  rationale: ὠδῖνας yanaweza kumaanisha maumivu makali, hasa uchungu wa kuzaa. “Maumivu ya mauti” ni ya kawaida na yanaacha maana pana ya neno hilo; maana ya uchungu wa kuzaa imehifadhiwa katika tanbihi.
- source_word: καθότι
  choice: kwa sababu
  rationale: Huanzisha sababu ya tendo la Mungu kwa lugha ya kawaida na ya moja kwa moja.
- source_word: οὐκ ἦν δυνατὸν
  choice: haikuwezekana
  rationale: Huhifadhi muundo na nguvu ya kauli ya Kigiriki bila kuipanua.
- source_word: κρατεῖσθαι
  choice: ashikiliwe
  rationale: Huwasilisha hali ya kushikwa au kuzuiliwa chini ya nguvu fulani, huku ikidumisha taswira ya mauti yenye uwezo wa kushikilia.
- source_word: ὑπ’ αὐτοῦ
  choice: nayo
  rationale: Kiwakilishi kinarejelea kwa kawaida “mauti.” Kiswahili “nayo” kinaonyesha rejeo hilo kwa uwazi huku tanbihi ikieleza umbo halisi la Kigiriki.
theological_decisions:
- issue: Kirejeleo cha ὑπ’ αὐτοῦ
  choice: Kiwakilishi kinarejelea mauti.
  alternative: 'Kisahili zaidi: “ashikiliwe na mauti”; kisarufi linaweza kuonekana kama “ashikiliwe naye.”'
  rationale: '“Mauti” ndicho kirejeleo cha karibu na kinacholingana zaidi na hoja ya sentensi: mauti haingeweza kuendelea kumshikilia Yesu. “Nayo” huhifadhi kiwakilishi badala ya kukibadilisha kimya kimya kuwa nomino.'
- issue: Maana ya ὠδῖνας
  choice: maumivu
  alternative: uchungu wa kuzaa; machungu makali
  rationale: Neno linaweza kutaja hasa uchungu wa kuzaa, lakini katika muktadha huu “maumivu” linaeleweka kwa kawaida kuhusu mauti. Tanbihi huhifadhi maana nyingine halisi na taswira yake bila kuilazimisha katika matini kuu.
- issue: Uhusiano wa λύσας na ἀνέστησεν
  choice: “akiyaondoa” kama tendo linaloandamana na kufufua
  alternative: “baada ya kuyafungua” au “kwa kuyafungua”
  rationale: Kirai shiriki kinaweza kuonyesha tendo linaloandamana na tendo kuu au namna lilivyotekelezwa. Muundo wa “aki-” unadumisha nafasi hiyo bila kuamua kwa nguvu zaidi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mauti” limetumiwa badala ya “kifo” ili kudumisha uzito wa kifasihi na urudiaji wa dhana ya mauti kama nguvu inayoshikilia, bila kufanya sentensi kuwa ya kizamani. Muundo unabaki wazi kwa msomaji wa kawaida.
