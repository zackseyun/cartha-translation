  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: sw
  text: Nao walikuwa wakiuza mashamba na mali zao, na kuwagawia wote[a] vitu hivyo kadiri kila mmoja alivyokuwa na uhitaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mali zisizohamishika na mali zao.” Maneno mawili ya Kigiriki huenda yanatofautisha aina za vitu vilivyomilikiwa: κτήματα mara nyingi humaanisha mashamba au mali zisizohamishika, na ὑπάρξεις mali kwa ujumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: mashamba
  rationale: Neno hili mara nyingi humaanisha mali iliyopatikana, hasa ardhi au mashamba; ‘mashamba’ hulitofautisha kwa kawaida na ὑπάρξεις.
- source_word: ὑπάρξεις
  choice: mali
  rationale: Hurejelea vitu au mali anazomiliki mtu kwa ujumla. ‘Mali’ ni neno la kawaida na pana linalofaa hapa.
- source_word: ἐπίπρασκον
  choice: walikuwa wakiuza
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea au lililorudiwa zamani, si lazima uuzaji mmoja uliokamilika.
- source_word: διεμέριζον
  choice: kuwagawia
  rationale: Katika muktadha huu neno linaonyesha kugawa vitu au kilichopatikana kwa wanajumuiya kulingana na mahitaji yao.
- source_word: αὐτά
  choice: (imewakilishwa ndani ya kitenzi ‘kuwagawia’)
  rationale: Kiswahili cha kawaida kinaweza kuacha kiwakilishi cha vitu wazi baada ya kutaja mashamba na mali; hakikufafanuliwa kuwa ‘mapato’ ili kutokuzidi maandishi ya Kigiriki.
- source_word: πᾶσιν
  choice: wote
  rationale: Huonyesha kwa upana wapokeaji katika muktadha wa jumuiya.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: kadiri kila mmoja alivyokuwa na uhitaji
  rationale: Huhifadhi maana ya ugawaji kulingana na uhitaji wa mtu mmoja mmoja pamoja na hali ya tendo lililoendelea.
theological_decisions:
- issue: Asili ya kushirikiana mali miongoni mwa waamini
  choice: Aya inaeleza zoea lililoendelea la kuuza na kugawa mali kulingana na uhitaji, bila kusema kwamba umiliki binafsi ulifutwa kama fundisho rasmi.
  alternative: Aya inaamuru umiliki wa pamoja kikamilifu kuwa sharti la kawaida kwa Wakristo wote.
  rationale: Vitenzi vya wakati usiotimilika vinaonyesha matendo yaliyokuwa yakiendelea au kurudiwa. Maandishi hayasemi wazi kwamba umiliki wote binafsi ulikoma, wala kwamba zoea hilo liliamriwa kwa watu wote kila mahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wakiuza’ na ‘alivyokuwa na uhitaji’ huhifadhi hali ya matendo yaliyoendelea; ‘kuwagawia’ ni ya kawaida na inaeleweka bila kubainisha kwamba kilichogawanywa kilikuwa mapato pekee.
