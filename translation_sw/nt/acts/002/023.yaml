  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: sw
  text: Mtu huyu alitolewa kulingana na mpango uliokwisha kuamuliwa na kujua kwake tangu awali[a]; nanyi mkamwua kwa kumpigilia misumari msalabani kwa mikono ya watu wasio na sheria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maarifa yake ya awali” au “kujua kwake kabla.”
    reason: Hufafanua πρόγνωσις bila kudokeza kwamba Mungu alipata ujuzi huo wakati wa zamani.
  - marker: b
    text: “Watu wasio na sheria” linaweza pia kumaanisha watu walio nje ya Sheria au wanaoiasi sheria. Kigiriki husema kihalisi, “kwa mkono wa watu wasio na sheria.”
    reason: Huhifadhi wigo wa ἄνομοι na huonyesha umoja wa χειρός, huku tafsiri kuu ikitumia wingi wa nahau ya Kiswahili.
lexical_decisions:
- source_word: τοῦτον
  choice: Mtu huyu
  rationale: Kiwakilishi hiki cha kuonyesha kinamrejelea Yesu. “Mtu huyu” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa kumwonyesha anayezungumziwa.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: kulingana na mpango uliowekwa
  rationale: ὡρισμένῃ hudokeza jambo lililoamuliwa, kuwekwa au kuteuliwa, na βουλή ni kusudi, shauri au mpango. Tafsiri hii inaonyesha kwamba kutolewa kwake kulipatana na mpango thabiti wa Mungu bila kuongeza mfumo fulani wa kiteolojia.
- source_word: καὶ προγνώσει τοῦ θεοῦ
  choice: na ujuzi wa Mungu wa tangu awali
  rationale: πρόγνωσις ni kujua kabla au ujuzi wa tangu awali. Kauli hii ya kawaida inaeleweka kuliko istilahi nzito na inahifadhi tofauti yake na “mpango.”
- source_word: ἔκδοτον
  choice: alitolewa
  rationale: Kivumishi hiki kina maana ya kutolewa au kukabidhiwa. Kauli tendwa inahifadhi kutotajwa wazi kwa aliyemtoa katika kifungu hiki.
- source_word: διὰ χειρὸς ἀνόμων
  choice: kwa mikono ya watu wasio na sheria
  rationale: διά pamoja na hali ya genitivi huonyesha wakala wa kati. Ingawa χειρός ni umoja, “kwa mikono ya” ni nahau ya kawaida ya Kiswahili. “Watu wasio na sheria” huhifadhi upeo wa ἄνομοι bila kuibana iwe tu “waovu.”
- source_word: προσπήξαντες
  choice: kwa kumpigilia misumari msalabani
  rationale: Kitenzi hiki humaanisha kufungia au kupigilia; katika mazingira haya kinadokeza wazi kuuawa kwa kusulubiwa. Kutaja misumari na msalaba kunatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἀνείλατε
  choice: nanyi mkamwua
  rationale: ἀναιρέω hapa humaanisha kuua au kuondoa uhai. “Mkamwua” ni ya moja kwa moja na inahifadhi shtaka la Petro kwa wasikilizaji wake.
theological_decisions:
- issue: Uhusiano kati ya mpango na ujuzi wa Mungu na wajibu wa wanadamu
  choice: Kuhifadhi pamoja mpango na ujuzi wa Mungu wa tangu awali, huku wasikilizaji wakiambiwa moja kwa moja kwamba walimwua Yesu
  alternative: Kupunguza ama uamuzi wa Mungu ama uwajibikaji wa wasikilizaji kwa kuwafanya watu wasio na sheria kuwa wahusika pekee
  rationale: 'Kigiriki kinashikilia mambo yote mawili kwa wakati mmoja: Yesu alitolewa kulingana na mpango na ujuzi wa Mungu, na hata hivyo Petro anasema “ninyi ... mkamwua.” Tafsiri haiondoi mvutano huo.'
- issue: Maana ya ἀνόμων
  choice: watu wasio na sheria
  alternative: waovu; wapagani; waasi wa sheria
  rationale: Neno linaweza kueleza watu walio nje ya Sheria au watu wanaoivunja. Tafsiri kuu inadumisha wigo huo, na tanbihi inaonyesha uwezekano wake bila kuwatambulisha kwa uhakika kuliko maandishi yanavyofanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. “Nanyi mkamwua” hudumisha nguvu ya shtaka; “kulingana na” huepuka kuifanya dativu ieleze tu chombo au wakala; na “kwa mikono ya” ni nahau asilia kuliko umoja wa Kigiriki.
