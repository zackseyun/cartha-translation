revisions:
- from: Na wote walioamini walikuwa pamoja[a] na walikuwa na vitu vyote kwa pamoja.
  to: Na waamini wote walikuwa pamoja[a], na vitu vyote vilikuwa mali ya wote.
  rationale: 'The revision retains the Greek word order and narrative sense as far as natural Swahili permits: πάντες as “wote,” οἱ πιστεύοντες as “waamini,” and ἦσαν ἐπὶ τὸ αὐτό as “walikuwa pamoja.” It replaces the less natural final phrase with an idiomatic rendering of shared ownership, while remaining descriptive rather than doctrinally prescriptive. The footnote continues to preserve the locative alternative of the Greek idiom.'
