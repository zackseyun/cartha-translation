review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the narrative continuation, the believing community, and the idiom ἦσαν ἐπὶ τὸ αὐτό. However, “walikuwa na vitu vyote kwa pamoja” is less idiomatic and can suggest merely possessing items collectively rather than that the items were held in common (ἅπαντα κοινά).
  naturalness: “Waamini wote” is a natural current designation for οἱ πιστεύοντες. “Vitu vyote vilikuwa mali ya wote” is clear, standard East African Swahili and expresses shared common possession without introducing a prescribed economic system.
  terminology: “Waamini” suitably represents the substantival participle. “Mali ya wote” conveys κοινά in this context and preserves the verse’s descriptive register.
  issues:
  - severity: medium
    issue: The expression “walikuwa na vitu vyote kwa pamoja” is awkward and semantically imprecise for ἅπαντα κοινά.
    rationale: In modern Swahili it may be heard simply as collective possession or joint activity. “Vitu vyote vilikuwa mali ya wote” directly and naturally states that all things were common property.
  revised_text: Na waamini wote walikuwa pamoja[a], na vitu vyote vilikuwa mali ya wote.
