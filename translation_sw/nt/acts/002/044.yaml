lexical_decisions:
- source_word: πάντες
  choice: wote
  rationale: Hudumisha nguvu ya kijumla inayowahusu washiriki wote wa kundi.
- source_word: δὲ
  choice: Na
  rationale: Huendeleza simulizi bila kuingiza utofautishaji mkali usiokuwapo katika muktadha.
- source_word: οἱ πιστεύοντες
  choice: walioamini
  rationale: Ni Kiswahili cha kawaida kinachowatambulisha watu hao kwa imani yao, huku kikifuata umbo la kirai cha Kigiriki.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: walikuwa pamoja
  rationale: Huwasilisha maana ya kuwa pamoja au kukusanyika bila kulazimisha maana ya mahali pekee.
- source_word: εἶχον
  choice: walikuwa na
  rationale: Hutoa maana ya hali iliyoendelea katika simulizi, kama ilivyo katika wakati usiotimilifu wa Kigiriki.
- source_word: ἅπαντα κοινά
  choice: vitu vyote kwa pamoja
  rationale: Hueleza kuwa walichokuwa nacho kilitumiwa au kuhesabiwa kwa pamoja, bila kuongeza mfumo maalumu wa kiuchumi.
theological_decisions:
- issue: Hali ya maisha ya pamoja ya jumuiya
  choice: Aya inasimulia kwamba waamini walikuwa na mali au vitu vyao kwa pamoja.
  alternative: Aya inaamuru mfumo fulani wa kiuchumi kwa jumuiya zote za Kikristo.
  rationale: Kigiriki kinaeleza walichokuwa wakifanya, wala hakitoi amri ya wazi au kanuni ya jumla; tafsiri inabaki ya kisimulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi; sentensi ni rahisi kueleweka huku ikihifadhi utata wa usemi ἐπὶ τὸ αὐτό.
