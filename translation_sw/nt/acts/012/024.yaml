  text: But the word of God continued to grow and multiply[a].
translation:
  language: sw
  text: Lakini neno la Mungu liliendelea kukua na kuongezeka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe wa Mungu uliendelea kukua na kuongezeka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: neno
  rationale: “Neno” linahifadhi usemi wa kawaida wa Luka, “neno la Mungu,” pamoja na maana yake pana ya ujumbe unaotangazwa kutoka kwa Mungu.
- source_word: τοῦ θεοῦ
  choice: la Mungu
  rationale: 'Hii ni tafsiri ya kawaida ya umilikaji au chanzo: neno ambalo ni la Mungu au linatoka kwake.'
- source_word: ηὔξανεν
  choice: likaendelea kukua
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha tendo lililoendelea; “likaendelea kukua” linaeleza mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: ἐπληθύνετο
  choice: kuenea
  rationale: Katika muktadha huu kitenzi kinaonyesha kuongezeka kwa usambazaji na athari za neno. “Kuenea” ni Kiswahili cha asili zaidi kuliko kusema neno ‘lilizidishwa,’ huku kikitofautisha wazo hili na ‘kukua.’
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ya kisimulizi kati ya kifo cha Herode katika aya iliyotangulia na kuendelea kusitawi kwa neno la Mungu.
theological_decisions:
- issue: Iwapo λόγος τοῦ θεοῦ itafsiriwe kwa usemi wa jadi au kwa maana iliyo wazi zaidi
  choice: neno la Mungu
  alternative: ujumbe wa Mungu
  rationale: “Neno la Mungu” linadumisha usemi unaorudiwa na Luka na upana wake wa kimaana bila kuufanya λόγος kuwa ujumbe tu; tanbihi inaonyesha tafsiri nyingine inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi, huku “neno la Mungu” likihifadhi nahau ya kibiblia inayotambulika.
