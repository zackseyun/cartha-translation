  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: sw
  text: Lakini Petro akawanyamazisha kwa ishara ya mkono, kisha akawaeleza jinsi Bwana alivyomtoa gerezani. Akasema, “Wapasheni Yakobo na ndugu habari hizi.” Kisha akaondoka, akaenda mahali pengine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: akawaashiria kwa mkono wakae kimya
  rationale: Kitenzi na kirai chake vinaeleza ishara ya mkono yenye kusudi la kuwatuliza waseme kimya; usemi huu ni wa kawaida na unaweka wazi tendo na kusudi bila kubainisha aina kamili ya ishara.
- source_word: διηγήσατο
  choice: akawaeleza
  rationale: Neno hili lina maana ya kusimulia au kueleza kwa mpangilio; “akawaeleza” ni la asili katika muktadha huu.
- source_word: πῶς
  choice: jinsi
  rationale: “Jinsi” huanzisha maelezo ya namna Bwana alivyomtoa Petro.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Huhifadhi cheo cha κύριος bila kuamua wazi ikiwa hapa kinamtaja Yesu hasa au Mungu kwa ujumla.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: alivyomtoa gerezani
  rationale: Hutoa kwa uwazi maana ya kumtoa mtu kutoka mahali pa kifungo.
- source_word: Ἀπαγγείλατε
  choice: Mwarifuni
  rationale: Amri inataka habari muhimu zifikishwe kwa Yakobo na ndugu; “mwarifuni” ni rasmi kwa kiasi kinachofaa simulizi, bila kuwa nzito.
- source_word: Ἰακώβῳ
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kibiblia Ἰάκωβος/Ἰακώβ.
- source_word: τοῖς ἀδελφοῖς
  choice: ndugu
  rationale: “Ndugu” huhifadhi neno la kifamilia na pia linaweza kutumiwa kwa waamini wenzake bila kulazimisha jinsia katika Kiswahili.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: akaondoka, akaenda
  rationale: Huhifadhi hatua mbili—kuondoka mahali alipokuwa na kuelekea kwingine—kwa mtiririko wa kawaida wa Kiswahili.
- source_word: εἰς ἕτερον τόπον
  choice: mahali pengine
  rationale: Huhifadhi kutotajwa kwa mahali hususa katika Kigiriki.
theological_decisions:
- issue: Rejeleo la κύριος
  choice: Bwana
  alternative: Yesu hasa; au Mungu kwa maana pana
  rationale: Andiko halifafanui rejeleo zaidi. Tafsiri inadumisha cheo chenyewe na hivyo kuhifadhi uwezekano na mvutano wa kitheolojia uliopo.
- issue: Wanaorejelewa na τοῖς ἀδελφοῖς
  choice: ndugu
  alternative: waamini wenzake; ndugu wa kiume pekee
  rationale: Muktadha unaweza kulenga jumuiya pana ya waamini au wanaume waliokuwa viongozi, lakini andiko halitatui jambo hilo. “Ndugu” ni la asili na linaacha upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Maandiko. Muundo wa vitenzi mfululizo umetumiwa kuonyesha mwendo wa simulizi bila ukakasi.
