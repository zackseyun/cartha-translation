  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: sw
  text: Alipoona kwamba jambo hilo liliwapendeza Wayahudi[a], akachukua hatua ya kumkamata Petro pia. (Wakati huo zilikuwa siku za Sikukuu ya Mikate Isiyotiwa Chachu[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea,” au, kwa kuzingatia muktadha, “viongozi wa Wayahudi.” Neno la Kigiriki linaweza kuwa na maana hizi katika baadhi ya miktadha, lakini hapa andiko linasema tu “Wayahudi.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kipindi cha sikukuu kinachojulikana kwa kula mikate isiyotiwa chachu.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Alipoona
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha kwamba Herode alitambua mwitikio huo kabla ya kuchukua hatua iliyofuata; “Alipoona” ni Kiswahili cha kawaida kinachohifadhi mfuatano huo.
- source_word: ἀρεστόν ἐστιν
  choice: jambo hilo liliwapendeza
  rationale: Neno hilo lina maana ya kupendeza au kukubalika. “Jambo hilo liliwapendeza” ni la kawaida katika Kiswahili na linaelekeza kwa kitendo kilichotajwa katika muktadha.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Kigiriki kinasema Wayahudi bila kuwabainisha kuwa viongozi pekee au wakazi wa Uyahudi; tafsiri pana imehifadhiwa huku uwezekano wa maana finyu ukielezwa katika tanbihi.
- source_word: προσέθετο
  choice: akaendelea
  rationale: Kitenzi hiki pamoja na kitenzi-jina kina maana ya kuendelea au kwenda mbele kufanya jambo jingine, si kuongeza kwa maana halisi.
- source_word: συλλαβεῖν
  choice: kumkamata
  rationale: Katika muktadha wa mamlaka na kifungo, neno hili humaanisha kumtia mtu nguvuni; “kumkamata” ni wazi na la kawaida.
- source_word: καὶ Πέτρον
  choice: Petro pia
  rationale: “Pia” huhifadhi maana ya kwamba Petro aliongezwa kuwa shabaha nyingine baada ya Yakobo.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Hizo zilikuwa siku za Mikate Isiyotiwa Chachu
  rationale: Tafsiri hii huhifadhi muundo wa taarifa ya wakati na jina mahususi la kipindi cha sikukuu badala ya kulibadilisha kuwa Pasaka.
theological_decisions:
- issue: Maana ya Ἰουδαίοις katika Matendo
  choice: Wayahudi
  alternative: Watu wa Uyahudi; viongozi wa Wayahudi
  rationale: Andiko lenyewe halibainishi eneo wala uongozi pekee. “Wayahudi” huhifadhi maana ya moja kwa moja bila kuingiza ufafanuzi mwembamba, huku tanbihi ikitaja maana nyingine zinazowezekana kimuktadha.
- issue: Maana ya τῶν ἀζύμων
  choice: Mikate Isiyotiwa Chachu
  alternative: Pasaka
  rationale: Kigiriki kinataja moja kwa moja siku za Mikate Isiyotiwa Chachu. Ingawa kipindi hicho kinahusiana na Pasaka, majina hayo hayapaswi kuunganishwa kimya kimya kuwa kitu kimoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mabano umehifadhiwa kwa taarifa ya wakati; majina ya sikukuu yameandikwa kwa herufi kubwa kama istilahi maalumu.
