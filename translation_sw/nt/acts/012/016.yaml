id: ACT.12.16
reference: Acts 12:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἐπέμενεν κρούων· ἀνοίξαντες δὲ εἶδαν αὐτὸν καὶ ἐξέστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: sw
  text: Lakini Petro aliendelea kubisha[a]. Walipofungua[b], wakamwona, wakashangaa sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliendelea kugonga,” au “alizidi kubisha.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “baada ya kufungua, walimwona, wakashangaa.” Kitu kilichofunguliwa hakitajwi wazi katika Kigiriki; muktadha unaonyesha kuwa ni mlango au lango.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν
  choice: aliendelea
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililoendelea; “aliendelea” ni Kiswahili cha kawaida na huonyesha udumifu huo.
- source_word: κρούων
  choice: kubisha
  rationale: Katika muktadha huu κρούω humaanisha kubisha mlangoni; kitenzi-jina hiki kinaambatana na ἐπέμενεν na kwa asili hutafsiriwa “aliendelea kubisha.”
- source_word: ἀνοίξαντες
  choice: Walipofungua
  rationale: Kauli ya aoristi yenye umbo la participle imetafsiriwa kwa kishazi cha wakati ili kuonyesha kwa ufasaha kwamba kuona kulifuata kufungua, bila kutaja kitu kilichofunguliwa ambacho Kigiriki hakikitaji wazi.
- source_word: εἶδαν αὐτόν
  choice: wakamwona
  rationale: Tafsiri ya moja kwa moja na ya kawaida katika simulizi; kiambishi “-m-” kinamrejelea Petro.
- source_word: ἐξέστησαν
  choice: wakashangaa sana
  rationale: ἐξίστημι hapa huonyesha mshangao mkubwa; “sana” huhifadhi uzito wa neno kwa Kiswahili cha kawaida bila kutumia msemo wa kutafsiri kupita kiasi.
- source_word: δὲ
  choice: Lakini / wa-...-ka-
  rationale: δὲ ya kwanza inaonyesha utofautishaji na tukio lililotangulia, hivyo “Lakini” inafaa. Ya pili imewakilishwa kwa mtiririko wa simulizi wa viambishi vya mfululizo “-ka-” badala ya kiunganishi tofauti.
- source_word: Πέτρος
  choice: Petro
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
theological_decisions: []
translation_notes:
