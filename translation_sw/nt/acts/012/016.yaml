  source_fidelity: Tafsiri inawakilisha kwa uaminifu ὁ δὲ Πέτρος ἐπέμενεν κρούων kwa “Lakini Petro aliendelea kubisha,” ikihifadhi hali ya tendo linaloendelea ya imperfect ἐπέμενεν. “Walipofungua, wakamwona, wakashangaa sana” hutafsiri mfuatano wa ἀνοίξαντες ... εἶδαν αὐτὸν καὶ ἐξέστησαν kwa usahihi. “Sana” ni njia ya kawaida ya Kiswahili ya kuwasilisha nguvu ya mshangao katika ἐξέστησαν, bila kuongeza tukio au tafsiri ya kiitikadi.
