  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: sw
  text: Siku iliyowekwa, Herode alivaa mavazi ya kifalme[a], akaketi kwenye jukwaa rasmi[b], akawa akiwahutubia hadharani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majoho ya kifalme.” Neno la Kigiriki linaweza kumaanisha kwa ujumla mavazi ya fahari.
    reason: lexical_alternative
  - marker: b
    text: Au “kiti rasmi,” “jukwaa la hukumu,” au “jukwaa lililoinuliwa.” Neno la Kigiriki βῆμα mara nyingi humaanisha kiti rasmi au jukwaa lililoinuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: katika siku iliyowekwa
  rationale: Kirai hiki kinaonyesha siku iliyokuwa imepangwa au kuteuliwa rasmi; tafsiri hii ni ya kawaida na haiongezi wazo lisilokuwamo katika chanzo.
- source_word: ἐνδυσάμενος
  choice: alivaa
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo la Herode kujivika kabla ya kuketi; mfuatano huo unawasilishwa kwa vitenzi vya Kiswahili vya kawaida.
- source_word: ἐσθῆτα βασιλικὴν
  choice: mavazi ya kifalme
  rationale: ἐσθής ni neno pana kwa vazi au mavazi, hivyo 'mavazi ya kifalme' huepuka kudai kwamba yalikuwa majoho pekee.
- source_word: καθίσας
  choice: akaketi
  rationale: Tafsiri hii inaendeleza mfuatano wa matendo baada ya Herode kuvaa mavazi ya kifalme.
- source_word: ἐπὶ τοῦ βήματος
  choice: kwenye kiti cha hukumu
  rationale: βῆμα inaweza kuwa kiti rasmi cha kutoa hukumu au jukwaa lililoinuliwa; katika tukio hili tafsiri hii inadumisha hadhi rasmi bila kudai kwamba kesi ilikuwa ikiendeshwa.
- source_word: ἐδημηγόρει
  choice: akawa akiwahutubia ... hadharani
  rationale: Kitenzi hiki humaanisha kuhutubia mkutano wa watu, na hali yake ya wakati usiotimilika inaonyesha hotuba iliyokuwa ikiendelea.
- source_word: πρὸς αὐτούς
  choice: wao
  rationale: Kiwakilishi hiki kinarejelea watu waliokuwa mbele yake na kuhifadhi marejeo ya moja kwa moja ya Kigiriki bila kuwataja upya.
