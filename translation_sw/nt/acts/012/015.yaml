base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: sw
  text: Lakini wakamwambia[a], “Una wazimu.” Lakini yeye aliendelea kusisitiza kwamba ndivyo ilivyokuwa. Nao wakaendelea kusema, “Ni malaika wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “malaika wake mlezi,” “malaika mwakilishi wake,” au, kulingana na baadhi ya wafasiri, “roho au mzimu wake.” Kigiriki kinasema tu “malaika wake.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Una wazimu
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha shtaka la kuwa amerukwa na akili bila kutumia lugha ya kitabibu kupita kiasi.
- source_word: διϊσχυρίζετο
  choice: akazidi kusisitiza
  rationale: Kauli ya wakati usiotimilika na nguvu ya kitenzi zinaonyesha msisitizo ulioendelea.
- source_word: οὕτως ἔχειν
  choice: kwamba ni kweli
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kwamba jambo lilikuwa kama alivyosema.
- source_word: ἔλεγον
  choice: wakaendelea kusema
  rationale: Wakati usiotimilika unaonyesha kusema kulikorudiwa au kuendelea.
- source_word: ἄγγελός
  choice: malaika
  rationale: Katika muktadha huu neno linaelekea kumaanisha kiumbe wa mbinguni, huku maana yake mahususi ikiachwa wazi.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi cha umilikaji kinatafsiriwa kwa kawaida katika kishazi ‘malaika wake,’ kikimrejelea Petro.
theological_decisions:
- issue: Maana ya ‘malaika wake’
  choice: malaika wake
  alternative: malaika wake mlezi; malaika mwakilishi wake; roho/kivuli chake
  rationale: Kigiriki kinasema tu ‘malaika wake’ bila kufafanua imani iliyokusudiwa. Tafsiri kuu inadumisha utata huo, na uwezekano mwingine unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Miundo ‘akazidi’ na ‘wakaendelea’ inabeba hali ya tendo lililoendelea katika vitenzi vya Kigiriki; usemi ‘malaika wake’ umeachwa bila ufafanuzi wa kimadhehebu.
