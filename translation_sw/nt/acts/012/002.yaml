translation:
  language: sw
  text: Naye akamuua Yakobo[a], ndugu yake Yohana, kwa upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwua kwa hukumu.” Kitenzi cha Kigiriki kinasema kwamba alisababisha kifo cha Yakobo; muktadha mpana unaweza kudokeza hukumu rasmi ya kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: akamuua
  rationale: Kitenzi ἀναιρέω hapa humaanisha kusababisha kifo. “Akamuua” ni tafsiri ya moja kwa moja na ya kawaida, bila kuongeza wazi wazo la hukumu rasmi ambalo muktadha unaweza kudokeza lakini mstari wenyewe haulitamki.
- source_word: δὲ
  choice: Naye
  rationale: δέ linaendeleza simulizi kwa kiunganishi chepesi. “Naye” linaunganisha tendo hili na muktadha uliotangulia bila kulazimisha utofautishaji mkali.
- source_word: Ἰάκωβον
  choice: Yakobo
  rationale: Jina limetolewa kwa umbo la kawaida la kibiblia katika Kiswahili.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: ndugu yake Yohana
  rationale: Kirai hiki kinamtambulisha Yakobo anayekusudiwa. “Ndugu yake Yohana” ni cha asili katika Kiswahili na huhifadhi uhusiano uliotajwa katika Kigiriki bila kubainisha zaidi ya maandishi kama alikuwa kaka au mdogo.
- source_word: μαχαίρῃ
  choice: kwa upanga
  rationale: μάχαιρα humaanisha upanga au upanga mfupi, na hali ya dative hapa inaonyesha chombo au njia. “Kwa upanga” ni usemi wa kawaida unaohifadhi picha halisi ya silaha.
theological_decisions:
- issue: Asili ya tendo la Herode
  choice: Tendo limetafsiriwa moja kwa moja kuwa kumuua Yakobo bila kulitaja wazi kuwa hukumu rasmi ya kifo.
  alternative: “akamwua kwa hukumu” au “akaamuru Yakobo auawe,” ili kusisitiza mauaji yaliyoidhinishwa na serikali
  rationale: ἀνεῖλεν husema kwamba Yakobo aliuawa, na μαχαίρῃ hutaja njia iliyotumiwa. Ingawa muktadha mpana unaweza kuonyesha adhabu rasmi, mstari huu peke yake haulazimishi maelezo hayo ya kisheria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama Kigiriki. “Ndugu yake” huhifadhi kutobainishwa kwa umri katika ἀδελφός, na tanbihi huhifadhi uwezekano wa muktadha wa hukumu rasmi bila kuuongeza katika matini kuu.
