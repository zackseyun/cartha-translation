id: ACT.12.6
reference: Acts 12:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: sw
  text: Herode alipokuwa karibu kumtoa Petro nje[a], usiku uleule Petro alikuwa amelala katikati ya askari wawili, akiwa amefungwa kwa minyororo miwili, nao walinzi waliokuwa mbele ya mlango walikuwa wakilinda gereza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumleta mbele.” Kitenzi cha Kigiriki kinaweza kumaanisha kumtoa mtu ili aonekane hadharani au ashtakiwe.
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wakiliweka gereza chini ya ulinzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: alipokuwa karibu
  rationale: Inaonyesha kwamba tendo lilikuwa linakaribia kutokea, bila kuligeuza kuwa nia tu.
- source_word: προαγαγεῖν αὐτόν
  choice: kumtoa Petro nje
  rationale: Katika muktadha wa kifungo, usemi huu unaeleza kumtoa Petro gerezani ili apelekwe mbele ya watu au kwenye shauri; tanbihi inahifadhi uwezekano huo wa maana.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: usiku uleule
  rationale: Huhifadhi msisitizo wa kiashiria ἐκείνῃ na mvutano wa simulizi.
- source_word: κοιμώμενος
  choice: alikuwa amelala
  rationale: Ni Kiswahili cha kawaida kinachoonyesha hali iliyoendelea wakati huo.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: katikati ya askari wawili
  rationale: Hutoa kwa uwazi mahali Petro alipokuwa kulingana na maandishi ya Kigiriki.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: akiwa amefungwa kwa minyororo miwili
  rationale: Huhifadhi hali yake ya kuwa tayari amefungwa na hutaja wazi kifaa kilichotumiwa.
- source_word: φύλακές τε πρὸ τῆς θύρας
  choice: nao walinzi waliokuwa mbele ya mlango
  rationale: Huhifadhi kiunganishi na maelezo ya mahali bila kudai kwamba walikuwa ndani au nje ya mlango.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: walikuwa wakilinda gereza
  rationale: τηρέω hapa ina maana ya kulinda au kuweka chini ya ulinzi, na φυλακή inarejelea gereza katika muktadha huu.
theological_decisions: []
