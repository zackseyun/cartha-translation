  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa kawaida kwa simulizi huku msisitizo wa “usiku uleule” na uwezekano wa maana katika προάγω vikihifadhiwa.
