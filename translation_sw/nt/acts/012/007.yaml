source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: sw
  text: Na tazama, malaika wa Bwana akasimama karibu[a], na nuru ikaangaza ndani ya chumba cha gereza[b]. Akampiga Petro ubavuni, akamwamsha, akisema, “Inuka upesi.” Minyororo yake ikaanguka kutoka mikononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akasimama kando yake” au “akamtokea ghafula.” Kitenzi cha Kigiriki kinaweza kusisitiza kuwapo kwa ghafula pamoja na kusimama karibu.
    reason: lexical_alternative
  - marker: b
    text: Au “chumba” au “makao.” Neno la Kigiriki ni la jumla zaidi, lakini hapa muktadha unaonyesha chumba cha gereza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inadumisha nguvu ya usemi unaovuta fikira za msomaji na uchangamfu wa usimulizi wa Luka; ni lugha yenye hadhi na inayoeleweka katika Kiswahili cha Biblia.
- source_word: ἄγγελος κυρίου
  choice: malaika wa Bwana
  rationale: Ni tafsiri ya kawaida na ya asili ya muundo huu, ikihifadhi uhusiano wa malaika huyo na Bwana bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἐπέστη
  choice: akasimama karibu naye
  rationale: Inaonyesha kuwapo karibu kimwili, huku tanbihi ikihifadhi uwezekano wa kitenzi kusisitiza kutokea kwa ghafula.
- source_word: φῶς ἔλαμψεν
  choice: nuru ikaangaza
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na kitenzi.
- source_word: ἐν τῷ οἰκήματι
  choice: ndani ya chumba cha gereza
  rationale: Neno la Kigiriki ni la jumla zaidi, lakini muktadha unaonyesha kuwa chumba hicho kilikuwa gerezani; usemi huu ni wazi bila kulazimisha maana finyu ya neno lenyewe.
- source_word: πατάξας ... τὴν πλευρὰν
  choice: Akampiga Petro ubavuni
  rationale: Inahifadhi nguvu halisi ya tendo la kumpiga au kumgusa kwa nguvu, badala ya kulilegeza kuwa kumsukuma kidogo tu.
- source_word: ἤγειρεν αὐτὸν
  choice: akamwamsha
  rationale: Katika muktadha huu Petro alikuwa amelala, hivyo maana inayokusudiwa ni kumwamsha, ingawa kitenzi kinaweza pia kumaanisha kuinua.
- source_word: Ἀνάστα ἐν τάχει
  choice: Inuka upesi
  rationale: Ni amri fupi, ya asili, na yenye dharura inayolingana na Kigiriki.
- source_word: ἐξέπεσαν ... αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: minyororo yake ikaanguka kutoka mikononi mwake
  rationale: Inadumisha taswira ya minyororo kuanguka yenyewe na kufuata neno la Kigiriki ‘mikono’ badala ya kulibadili kuwa ‘vifundo vya mikono.’
theological_decisions:
- issue: Tafsiri ya κύριος katika ἄγγελος κυρίου
  choice: Bwana
  alternative: mkuu
  rationale: ‘Bwana’ ndilo neno la kawaida katika matumizi ya Agano Jipya na linahifadhi maana ya cheo hiki bila kuingiza ufafanuzi mwingine wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Na tazama” umehifadhiwa ili kuonyesha msisitizo wa ἰδοὺ; sentensi nyingine zimetolewa kwa mtiririko wa kawaida wa usimulizi wa Kiswahili.
