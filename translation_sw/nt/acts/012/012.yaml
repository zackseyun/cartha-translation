  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: sw
  text: Alipotambua jambo hilo, akaenda nyumbani kwa Maria, mama yake Yohana aliyeitwa Marko,[a] ambako watu wengi walikuwa wamekusanyika na walikuwa wakisali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeitwa pia Marko.” Kigiriki kinamtambulisha Yohana kwa jina jingine bila kulazimisha neno “pia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδών
  choice: Alipotambua jambo hilo
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha Petro kufahamu kikamilifu hali iliyokuwa imetokea baada ya malaika kuondoka; “jambo hilo” linarejelea muktadha uliotangulia kwa Kiswahili cha kawaida.
- source_word: τε
  choice: aka-
  rationale: Kiunganishi hiki chepesi cha masimulizi kinawakilishwa kwa mfuatano wa kitenzi “akaenda,” unaounganisha matukio kwa kawaida katika Kiswahili.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: akaenda nyumbani kwa
  rationale: Kirai kinaonyesha mwendo kuelekea mahali; “akaenda nyumbani kwa” ni usemi wa asili wa Kiswahili kwa kwenda katika nyumba ya mtu.
- source_word: τῆς Μαρίας
  choice: Maria
  rationale: Jina la kibinafsi limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: mama yake Yohana
  rationale: Huhifadhi wazi uhusiano wa Maria na Yohana na kumtambulisha Maria anayekusudiwa.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: aliyeitwa Marko
  rationale: Kishirikishi cha kutendwa kinamtambulisha Yohana kwa jina jingine bila kulazimisha kuongeza neno “pia.”
- source_word: οὗ
  choice: ambako
  rationale: Kielezi hiki cha uhusiano kinarejelea mahali, yaani nyumba ya Maria.
- source_word: ἱκανοὶ
  choice: watu wengi
  rationale: Wingi wa ἱκανός hapa unaonyesha idadi kubwa au ya kutosha; “watu wengi” ni wazi na ya kawaida.
- source_word: συνηθροισμένοι
  choice: walikuwa wamekusanyika
  rationale: Muundo wa kitenzi saidizi pamoja na kishirikishi timilifu unaonyesha hali iliyotokana na kukusanyika kulikotangulia.
- source_word: καὶ προσευχόμενοι
  choice: na walikuwa wakisali
  rationale: Huwasilisha tendo la sala lililokuwa likiendelea wakati huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyumbani kwa Maria” ni ya asili zaidi kuliko “kwenye nyumba ya Maria,” huku ikidumisha marejeo ya mahali halisi. “Kusali” limetumiwa kwa προσεύχομαι kama neno la kawaida na linaloeleweka sana.
