id: ACT.12.14
reference: Acts 12:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: sw
  text: Alipoitambua sauti ya Petro, kwa sababu ya furaha hakufungua lango[a], bali alikimbia ndani na kutoa habari kwamba Petro alikuwa amesimama mbele ya lango.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlango wa nje” au “mwingilio,” yaani sehemu ya kuingilia kutoka barabarani kwenda ndani ya kiwanja.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “akatoa habari kuwa Petro amesimama mbele ya lango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: alipoitambua
  rationale: Kitenzi hiki kinaonyesha kwamba aliitambua sauti mara alipoisikia; muundo wa “alipo-” unaunganisha tendo hilo kwa kawaida na yaliyofuata.
- source_word: φωνὴν
  choice: sauti
  rationale: Katika muktadha wa Petro kuzungumza akiwa nje, “sauti” ndiyo tafsiri ya kawaida na mahususi.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: kwa sababu ya furaha
  rationale: Kirai hiki kinaonyesha sababu ya kutofungua lango, si hali ya jumla tu.
- source_word: ἤνοιξεν
  choice: hakufungua
  rationale: ἀνοίγω humaanisha kufungua; hakuna msingi wa kuongeza wazo mahususi la kufungua kufuli.
- source_word: πυλῶνα / πυλῶνος
  choice: lango
  rationale: πυλών ni lango au mwingilio wa nje wa jengo au kiwanja; “lango” ni neno la kawaida na linafaa katika mazingira haya ya nyumba.
- source_word: εἰσδραμοῦσα
  choice: alikimbia ndani
  rationale: Tafsiri hii inahifadhi mwendo wa haraka kuelekea ndani na uchangamfu wa simulizi.
- source_word: ἀπήγγειλεν
  choice: kutoa habari
  rationale: ἀπαγγέλλω humaanisha kuripoti au kutangaza jambo; “kutoa habari” ni ya asili katika Kiswahili na inafaa kwa simulizi.
- source_word: ἑστάναι
  choice: alikuwa amesimama
  rationale: 'Kauli timilifu ya ἵστημι hapa inaonyesha hali iliyokuwapo: Petro alikuwa bado amesimama hapo.'
- source_word: πρὸ τοῦ πυλῶνος
  choice: mbele ya lango
  rationale: Tafsiri hii inaakisi kwa uwazi maana ya πρό pamoja na jenitivi, yaani kuwa mbele ya au upande wa nje wa lango.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Mpangilio wa matukio na msisimko wa furaha ya mhudumu umehifadhiwa bila kuongeza maelezo yasiyomo katika maandishi ya Kigiriki.
