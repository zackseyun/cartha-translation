  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: sw
  text: 'Lakini umati uliendelea kupaza sauti: “Sauti ya mungu, wala si ya mwanadamu!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δῆμος
  choice: umati
  rationale: Katika muktadha huu neno hili linamaanisha watu waliokusanyika hadharani, si chombo rasmi cha kisiasa. “Umati” ni la kawaida na linafaa kwa tukio la watu wengi kumsifu Herode.
- source_word: ἐπεφώνει
  choice: ukaendelea kupaza sauti
  rationale: Wakati usiotimilika wa kitenzi unaonyesha tendo lililoendelea au kurudiwa. Kauli hii inaonyesha kwamba umati haukupaza sauti mara moja tu.
- source_word: Θεοῦ
  choice: ya mungu
  rationale: Katika mazingira haya ya kipagani, genitivi isiyo na kibainishi inaelekea kumaanisha mungu mmoja kwa maana ya jumla, si Mungu wa Israeli hasa. Tafsiri hii pia inadumisha nomino na utofautishaji wake na mwanadamu.
- source_word: φωνὴ
  choice: sauti
  rationale: “Sauti” ndilo neno la kawaida la Kiswahili linalodumisha muundo wa mshangao wa kirai cha Kigiriki kisicho na kitenzi.
- source_word: ἀνθρώπου
  choice: ya mwanadamu
  rationale: Umoja wa “mwanadamu” unadumisha utofautishaji wa moja kwa moja kati ya mungu na mwanadamu bila kugeuza nomino kuwa kivumishi.
theological_decisions:
- issue: Ikiwa Θεοῦ itafsiriwe “ya Mungu” au “ya mungu”
  choice: ya mungu
  alternative: ya Mungu
  rationale: Muktadha unaonyesha umati wa kipagani ukimpa Herode heshima ya kiungu, na Kigiriki hakina kibainishi. “Ya mungu” inafaa zaidi kwa mazingira hayo bila kudai kwamba umati ulimtambulisha Herode na Mungu mmoja wa Israeli. Hata hivyo, uwezekano wa kisarufi wa “ya Mungu” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” linaendeleza simulizi kwa urahisi; “ukaendelea kupaza sauti” linaonyesha tendo endelevu; na “wala si” linatoa utofautishaji wa wazi na wa asili.
