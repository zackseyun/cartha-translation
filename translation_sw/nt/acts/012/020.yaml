  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: sw
  text: Alikuwa na hasira kali dhidi ya watu wa Tiro na Sidoni[a]. Lakini wao wakaja kwake kwa nia moja, na baada ya kumshawishi Blasto, msimamizi wa chumba cha kulala cha mfalme[b], walikuwa wakiomba amani, kwa sababu nchi yao ilipokea chakula kutoka katika eneo la mfalme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa na uhasama mkubwa dhidi ya watu wa Tiro na Sidoni.” Neno la Kigiriki linaweza kumaanisha hasira kali au uhasama mkali.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “yule aliyekuwa juu ya chumba cha kulala cha mfalme”; huenda alikuwa afisa wa ikulu aliyeruhusiwa kufika katika vyumba vya faragha vya mfalme.
    reason: cultural_note
  - marker: c
    text: Au, “kwa sababu eneo lao lilipokea ugavi wa chakula kutoka katika eneo la mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: alikuwa amewakasirikia sana
  rationale: Huwasilisha hasira kali au uhasama wa kudumu kwa Kiswahili cha kawaida bila kutumia tafsiri ya neno kwa neno isiyo ya asili.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: watu wa Tiro na Sidoni
  rationale: Majina haya ya kikabila yanarejelea wakazi wa miji hiyo; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: ὁμοθυμαδόν
  choice: kwa nia moja
  rationale: Huhifadhi wazo la umoja wa kusudi, si kuwapo pamoja tu.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: wakaja kwake
  rationale: Ni usemi wa asili unaoonyesha kwamba walimwendea au walifika mbele yake.
- source_word: πείσαντες
  choice: baada ya kumshawishi
  rationale: Huonyesha wazi kwamba kitendo cha kumshawishi Blasto kilitangulia ombi lao.
- source_word: Βλάστον
  choice: Blasto
  rationale: Jina la mtu limetoholewa kwa namna inayofaa Kiswahili.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: msimamizi wa chumba cha kulala cha mfalme
  rationale: Huhifadhi picha halisi ya afisa aliyesimamia chumba cha faragha cha mfalme na kuepuka neno la kiufundi lisiloeleweka kwa wasomaji wengi.
- source_word: ᾐτοῦντο εἰρήνην
  choice: wakaomba amani
  rationale: Hutoa maana ya ombi la kidiplomasia kwa lugha ya kawaida; muktadha hubeba hali ya kuendelea au kusisitiza ombi.
- source_word: διὰ τὸ τρέφεσθαι
  choice: kwa sababu ... ilipata chakula
  rationale: Huwasilisha sababu na utegemezi wa eneo hilo kwa ugavi wa chakula.
- source_word: αὐτῶν τὴν χώραν
  choice: nchi yao
  rationale: Inafaa katika muktadha wa eneo la Tiro na Sidoni na uhusiano wake wa kiuchumi.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: kutoka katika milki ya mfalme
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino na huenda kinamaanisha eneo au mamlaka ya mfalme; “milki” huepuka kurudia “nchi” na kuhifadhi maana hiyo.
