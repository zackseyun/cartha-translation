  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: sw
  text: Karibu na wakati huo[a], Mfalme Herode aliwachukulia hatua[b] baadhi ya watu wa kanisa ili awatendee vibaya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wakati huo hivi.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “aliweka mikono juu ya.” Nahau hiyo inaonyesha kuchukua hatua ya uhasama dhidi ya baadhi ya watu wa kanisa.
    reason: lexical_alternative
  - marker: c
    text: Au “ili awadhuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Karibu na wakati huo
  rationale: Κατά pamoja na kishamirisho cha wakati huonyesha wakati wa kukadiria, yaani ‘karibu na/majira ya wakati huo.’ δέ inaendeleza simulizi kwa upole, jambo linaloweza kuachwa lisitajwe wazi katika Kiswahili bila kupoteza mtiririko.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: aliwashambulia
  rationale: Nahau hii, ambayo kihalisi inataja kuweka mikono juu ya watu, hapa inaonyesha hatua za uhasama dhidi yao. ‘Aliwashambulia’ ni ya kawaida katika Kiswahili na haifungi maana kwenye kukamata pekee.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: Mfalme Herode
  rationale: Huu ndio mpangilio wa kawaida na wenye hadhi katika Kiswahili kwa jina la mtawala na cheo chake.
- source_word: κακῶσαί
  choice: ili awatendee vibaya
  rationale: Kitenzi hiki kinaonyesha kusababisha madhara au kuwatendea watu vibaya. Tafsiri hii haiongezi dhana maalumu zaidi ya ‘kutesa’ au ‘kuwatesa kwa sababu ya imani,’ ingawa hayo yanaweza kuwamo katika muktadha.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: baadhi ya watu wa kanisa
  rationale: Kirai hiki kinataja watu fulani waliokuwa sehemu ya jumuiya ya waamini. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Tafsiri ya ἐκκλησία
  choice: kanisa
  alternative: kusanyiko; jumuiya ya waamini
  rationale: Katika Matendo neno hili kwa kawaida linamaanisha jumuiya ya Wakristo. ‘Kanisa’ ni neno la kawaida la Kiswahili, huku tanbihi ikihifadhi maana yake ya watu waliokusanyika badala ya jengo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Tafsiri imetumia ulinganifu mwafaka: imeweka wazi uhasama wa nahau ya Kigiriki bila kuifanya iwe ‘kukamata’ pekee, na imehifadhi mbadala muhimu katika tanbihi.'
