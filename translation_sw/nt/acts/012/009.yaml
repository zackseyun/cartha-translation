base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: sw
  text: Naye akatoka, akamfuata; lakini hakujua kwamba jambo lililokuwa likitendeka kwa njia ya malaika[a] lilikuwa halisi, bali alidhani kwamba alikuwa anaona maono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo ambalo malaika alilifanya.” Kigiriki kinaweza kuonyesha uwakala; “kwa njia ya malaika” kimechaguliwa ili kuhifadhi maana ya tendo kutendeka kupitia wakala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: akatoka
  rationale: Kitenzi cha wakati uliopita katika mtiririko wa simulizi kinaonyesha tendo lililotangulia tendo kuu; “akatoka” ni cha asili katika simulizi la Kiswahili.
- source_word: ἠκολούθει
  choice: akamfuata
  rationale: Ingawa hali ya kutokamilika inaonyesha tendo lililoendelea, muundo wa simulizi “akamfuata” unasomeka kwa kawaida na muktadha unaonyesha kwamba Petro aliendelea kwenda nyuma ya malaika.
- source_word: οὐκ ᾔδει
  choice: hakujua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kutokuwa na maarifa au ufahamu kuhusu jambo lililokuwa likitokea.
- source_word: ἀληθές
  choice: halisi
  rationale: Katika utofautishaji na maono, “halisi” huonyesha kwamba tukio lilikuwa likitokea kweli, badala ya kuwa uzoefu wa kimaono tu.
- source_word: τὸ γινόμενον
  choice: yale yaliyokuwa yakitendeka
  rationale: Muundo huu huhifadhi maana ya tukio lililokuwa linaendelea, huku ukisomeka kwa Kiswahili sanifu.
- source_word: διὰ τοῦ ἀγγέλου
  choice: kupitia malaika
  rationale: διά pamoja na hali ya umilikaji huweza kuonyesha wakala au njia; “kupitia malaika” huhifadhi wazo la utendaji uliopitishwa kwa wakala bila kusisitiza uhuru wa malaika kupita maandishi.
- source_word: ἐδόκει
  choice: alidhani
  rationale: Katika muktadha huu neno linaonyesha mtazamo au dhana ya Petro kuhusu alichokuwa akikiona.
- source_word: ὅραμα
  choice: maono
  rationale: “Maono” ni neno la kawaida la Kiswahili kwa ono la ufunuo au uzoefu unaofanana na ndoto.
- source_word: βλέπειν
  choice: alikuwa anaona
  rationale: Muundo huu unaonyesha uzoefu ambao Petro alidhani ulikuwa unaendelea wakati huo.
theological_decisions:
- issue: Asili ya utendaji wa malaika
  choice: kupitia malaika
  alternative: kwa njia ya malaika; yaliyofanywa na malaika
  rationale: Tafsiri hii huhifadhi uwezekano wa διά pamoja na hali ya umilikaji kuonyesha wakala wa kati, bila kufanya dai la ziada kuhusu nguvu au jukumu huru la malaika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi vya “aka-” umetumiwa kwa simulizi la matendo yanayofuatana; “kupitia malaika” huhifadhi kwa kiasi cha karibu muundo na utata wa uwakala katika Kigiriki.
