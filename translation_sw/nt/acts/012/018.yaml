  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: sw
  text: Kulipopambazuka, kulitokea msukosuko mkubwa miongoni mwa askari kuhusu yaliyompata Petro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Kulipopambazuka
  rationale: Muundo huu wa wakati unaonyesha kwamba mchana ulipoanza, yaani kulipopambazuka. Tafsiri hii ni ya kawaida na fasaha katika Kiswahili, huku δέ ikibaki kama mpito wa simulizi usiohitaji neno tofauti hapa.
- source_word: τάραχος οὐκ ὀλίγος
  choice: msukosuko mkubwa
  rationale: Kauli ya kupunguza kwa kukanusha, οὐκ ὀλίγος (‘si mdogo’), humaanisha kiwango kikubwa. Kiswahili cha moja kwa moja ‘msukosuko mkubwa’ kinawasilisha maana na uzito wake kwa kawaida.
- source_word: ἐν τοῖς στρατιώταις
  choice: miongoni mwa askari
  rationale: στρατιώταις ni ‘askari’; ἐν hapa huonyesha kundi ambalo msukosuko ulitokea ndani yake. ‘Walinzi’ ingeongeza ufafanuzi wa kimuktadha kuliko maana ya msingi ya neno.
- source_word: τί ἄρα
  choice: kuhusu
  rationale: Muundo huu unaanzisha swali lisilo la moja kwa moja lenye hisia ya mshangao au kutatanika. Katika sentensi ya Kiswahili, ‘kuhusu yaliyompata’ huwasilisha kwa kawaida jambo lililowatia askari wasiwasi.
- source_word: ὁ Πέτρος
  choice: Petro
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: ἐγένετο
  choice: yaliyompata
  rationale: Katika nahau τί ... ἐγένετο inayomhusu mtu, maana ni ‘nini kilichompata’ au ‘alikuwaje.’ ‘Yaliyompata Petro’ ni Kiswahili cha kawaida kinachohifadhi kutokujua kwa askari bila kueleza zaidi.
theological_decisions: []
