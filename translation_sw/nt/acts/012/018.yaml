  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. ‘Kulipopambazuka’ na ‘msukosuko mkubwa’ vinaeleweka kwa wasomaji wa kawaida; hakuna istilahi ya kimadhehebu iliyoongezwa.
