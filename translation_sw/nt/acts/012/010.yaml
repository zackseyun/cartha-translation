  to: Baada ya kupita kituo cha kwanza cha ulinzi na cha pili, walifika kwenye lango la chuma lililokuwa la kuingia mjini, nalo likafunguka lenyewe kwa ajili yao[a]. Walipotoka, wakaendelea umbali wa mtaa mmoja[b], na mara hiyo malaika akamwacha Petro.
