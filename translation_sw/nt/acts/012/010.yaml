id: ACT.12.10
reference: Acts 12:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: sw
  text: Baada ya kupita kituo cha kwanza cha ulinzi na cha pili, walifika kwenye lango la chuma lililokuwa la kuingia mjini, nalo likafunguka lenyewe kwa ajili yao[a]. Walipotoka, wakaendelea umbali wa mtaa mmoja[b], na mara hiyo malaika akamwacha Petro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “likafunguka lenyewe kwao.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “mtaa mmoja” ikamaanisha kwamba walienda umbali wa mtaa mmoja kabla ya malaika kumwacha Petro.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Baada ya kupita
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia kufika kwao langoni; usemi huu unaweka mfuatano huo wazi kwa Kiswahili cha kawaida.
- source_word: φυλακὴν ... πρώτην ... καὶ δευτέραν
  choice: kituo cha kwanza cha walinzi na cha pili
  rationale: Katika muktadha wa kutoroka gerezani, neno hili linaelekea kumaanisha sehemu au vituo vya ulinzi walivyovipita, si vifungo viwili tofauti.
- source_word: ἦλθαν ἐπὶ
  choice: walifika kwenye
  rationale: Hutoa maana ya kufikia mahali fulani katika simulizi kwa lugha ya asili na iliyo wazi.
- source_word: πύλην τὴν σιδηρᾶν
  choice: lango la chuma
  rationale: Huhifadhi msisitizo wa nyenzo ya lango kwa mpangilio wa kawaida wa Kiswahili.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: lililoelekea mjini
  rationale: Kirai hiki kinaeleza kwamba lango hilo lilitoa njia ya kuingia mjini; ‘lililoelekea mjini’ ni fupi na ya asili.
- source_word: αὐτομάτη
  choice: lenyewe
  rationale: Hueleza kuwa lango lilifunguka bila mtu kulifungua, bila kuleta hisia ya teknolojia ya kisasa inayoweza kuambatana na ‘kiotomatiki.’
- source_word: ἠνοίγη αὐτοῖς
  choice: likajifungua ... mbele yao
  rationale: Muundo huu wa Kiswahili unaonyesha lango likifunguka kwa ajili yao huku ukihifadhi tukio lisilo la kawaida.
- source_word: ἐξελθόντες
  choice: Walipotoka
  rationale: Huonyesha tendo lililokamilika kabla ya kusonga mbele na kudumisha mtiririko wa simulizi.
- source_word: προῆλθον
  choice: wakaenda
  rationale: Ni usemi wa kawaida unaoonyesha kwamba waliendelea mbele kutoka langoni.
- source_word: ῥύμην μίαν
  choice: umbali wa mtaa mmoja
  rationale: Hueleza vizuri zaidi uwezekano kwamba accusative hii inaonyesha mwendo au umbali wa mtaa mmoja, badala ya kusema tu waliingia katika mtaa mmoja.
- source_word: εὐθέως
  choice: mara
  rationale: Ni neno la kawaida na lenye hadhi linaloonyesha tukio lililofuata bila kuchelewa.
- source_word: ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: malaika akaondoka kwa Petro
  rationale: Huwasilisha kuondoka kwa malaika kutoka kwake kwa Kiswahili wazi; jina ‘Petro’ huondoa utata wa kiwakilishi katika sentensi yenye wahusika wawili.
theological_decisions:
- issue: Jinsi lango lilivyofunguka
  choice: Lango hilo likajifungua lenyewe
  alternative: Lango hilo likafunguka kwa hiari yake lenyewe
  rationale: Maandishi yanaeleza tukio la ajabu bila kufafanua utaratibu wake. Tafsiri hii huhifadhi hali hiyo na huepuka neno ‘kiotomatiki,’ ambalo linaweza kudokeza mashine ya kisasa.
- issue: Maana ya φυλακή
  choice: kituo ... cha walinzi
  alternative: zamu ya kwanza ya ulinzi na ya pili
  rationale: Muktadha unaonyesha Petro na malaika wakipita sehemu mfululizo za ulinzi. ‘Kituo cha walinzi’ kinaifanya picha hiyo ieleweke bila kudai kwamba walipita magereza mawili.
- issue: Kirejeo cha αὐτοῦ
  choice: kwa Petro
  alternative: kwake
  rationale: Kigiriki kinatumia kiwakilishi, lakini Kiswahili ‘kwake’ kingeweza kurejelea malaika au Petro. Kutaja Petro huweka wazi kirejeo kinachotokana na muktadha bila kuongeza dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha sasa na chenye hadhi. ‘Kituo cha walinzi’ kinafafanua mazingira ya ulinzi, na ‘umbali wa mtaa mmoja’ huhifadhi maana inayowezekana ya kipimo cha mwendo. Alama zote za tanbihi zimewekwa katika matini kuu.
