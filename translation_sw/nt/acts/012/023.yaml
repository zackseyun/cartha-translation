base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: sw
  text: Papo hapo malaika wa Bwana akampiga kwa sababu hakumpa Mungu utukufu[a]. Naye, akiwa ameliwa na minyoo[b], akafa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakutoa utukufu kwa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akiwa ameliwa na minyoo.”
    reason: lexical_alternative
  - marker: c
    text: Au, “akakata roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Papo hapo
  rationale: Usemi huu wa kawaida unaonyesha kwamba tendo lilitokea bila kukawia na kuhifadhi uzito wa ghafla wa hukumu.
- source_word: ἐπάταξεν
  choice: akampiga
  rationale: Kitenzi hiki kinamaanisha kupiga. ‘Akampiga’ ni cha moja kwa moja bila kuongeza kwamba alikufa papo hapo, kwa kuwa kifo kinatajwa baadaye.
- source_word: ἄγγελος κυρίου
  choice: malaika wa Bwana
  rationale: Nomino ya Kigiriki haina kibainishi; Kiswahili kwa kawaida hakilazimishi tofauti ya ‘malaika mmoja’ na ‘yule malaika’ katika muundo huu. Tafsiri hii ni ya kawaida na haibainishi malaika fulani kupita ushahidi wa matini.
- source_word: ἀνθ’ ὧν
  choice: kwa sababu
  rationale: Nahau hii inaonyesha sababu ya hukumu; ‘kwa sababu’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: hakumpa Mungu utukufu
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba Herode hakumwelekezea Mungu heshima iliyomstahili, huku ukifuata maana ya ‘kutoa/kumpa utukufu.’
- source_word: γενόμενος
  choice: akawa
  rationale: ‘Akawa’ huhifadhi wazo la kuingia katika hali iliyotajwa na kirai cha Kigiriki bila kulazimisha ufafanuzi mahsusi wa muda.
- source_word: σκωληκόβρωτος
  choice: analiwa na minyoo
  rationale: Tafsiri hii ni ya kawaida, wazi na yenye kuhifadhi taswira kali ya kivumishi kinachomaanisha ‘aliyeliwa na minyoo.’
- source_word: ἐξέψυξεν
  choice: akafa
  rationale: Kitenzi hiki humaanisha kukata roho au kufa. ‘Akafa’ ni tafsiri iliyo wazi zaidi kwa wasomaji wa kawaida; usemi halisi zaidi umetolewa katika tanbihi.
theological_decisions:
- issue: Asili na mfuatano wa hukumu
  choice: Malaika wa Bwana ndiye aliyempiga Herode kama hukumu kwa kutompa Mungu utukufu; kisha matini inataja hali ya kuliwa na minyoo na kifo chake bila kutoa maelezo ya kitabibu au muda kamili.
  alternative: Kuchukulia tukio kuwa kifo cha kawaida tu kilichoelezwa kwa lugha ya kidini, au kudai kwamba Herode alikufa papo hapo malaika alipompiga.
  rationale: Matini inamtaja wazi malaika wa Bwana kama mtendaji na kutompa Mungu utukufu kama sababu. Hata hivyo, kirai cha hali kinachofuatiwa na kitenzi cha kufa hakitoshi kuweka kwa uhakika muda wa kitabibu au kusema kwamba pigo na kifo vilitokea wakati uleule.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi zimewekwa fupi kwa uwazi, huku ‘Papo hapo’ ikihifadhi ghafla ya tukio na ‘akawa analiwa na minyoo’ ikihifadhi taswira ya Kigiriki bila kuongeza maelezo ya kitabibu.
