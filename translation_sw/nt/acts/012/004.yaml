  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: sw
  text: Baada ya kumkamata, akamweka gerezani na kumkabidhi kwa vikosi vinne vya askari[a] ili wamlinde. Alikusudia kumtoa mbele ya watu baada ya Pasaka ya Kiyahudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “vikundi vinne vya askari wanne,” yaani jumla ya askari kumi na sita waliopangwa katika vikundi vinne.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki πάσχα linamaanisha Pasaka ya Kiyahudi; baadhi ya tafsiri za zamani za Kiingereza zilitumia “Easter” hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: Baada ya kumkamata
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia; “baada ya kumkamata” ni Kiswahili cha kawaida na kinaonyesha kutiwa chini ya ulinzi.
- source_word: ἔθετο εἰς φυλακήν
  choice: akamweka gerezani
  rationale: Hii ni tafsiri ya kawaida ya usemi unaomaanisha kumfunga mtu; “gerezani” linafaa kwa mtindo wa simulizi wenye heshima.
- source_word: παραδοὺς
  choice: na kumkabidhi
  rationale: Inaonyesha kuhamishwa kwa mfungwa na kuwekwa chini ya ulinzi wa wengine.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: kwa vikosi vinne vya askari
  rationale: τετράδιον ni kikundi cha watu wanne; maandishi makuu yanatumia usemi unaosomeka kwa urahisi, huku idadi kamili ikifafanuliwa katika tanbihi.
- source_word: φυλάσσειν αὐτόν
  choice: ili wamlinde
  rationale: Kauli ya kusudi imewasilishwa kwa “ili”; “wamlinde” ni fupi, wazi, na sahihi.
- source_word: βουλόμενος
  choice: Alikusudia
  rationale: Inaonyesha kusudi au mpango wa makusudi bila kuongeza wazo la hisia ambalo halijaelezwa.
- source_word: μετὰ τὸ πάσχα
  choice: baada ya Pasaka
  rationale: πάσχα humaanisha sikukuu ya Kiyahudi ya Pasaka; neno la kawaida la Kiswahili “Pasaka” linahifadhi maana hiyo.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: kumtoa mbele ya watu
  rationale: Katika mazingira haya, usemi unamaanisha kumleta mfungwa hadharani kwa watu; “mbele ya” ni ya kawaida bila kudai wazi kwamba ilikuwa kesi rasmi.
- source_word: λαῷ
  choice: watu
  rationale: Neno hili linawahusu watu kwa ujumla kama umma uliokusanyika au jamii, bila kulifupisha kuwa kundi maalumu.
theological_decisions:
- issue: Tafsiri ya πάσχα
  choice: Pasaka
  alternative: Easter (sikukuu ya Kikristo ya Ufufuo)
  rationale: Neno la Kigiriki πάσχα hapa linataja Pasaka ya Kiyahudi. Tafsiri “Pasaka” inatanguliza maana ya chanzo na haileti mapokeo ya tafsiri za baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida. Viashiria vya tanbihi vimewekwa baada ya vifungu vinavyohusika.
