  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: sw
  text: Malaika akamwambia[a], “Jifunge mkanda na uvae sandali zako.” Naye akafanya hivyo. Kisha anamwambia[b], “Jivike vazi lako la nje[c], unifuate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jikaze kwa mkanda.” Amri ya Kigiriki inahusu kujifunga mkanda ili kuwa tayari.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “anamwambia”; huu ni wakati uliopo wa kihistoria unaofanya simulizi liwe hai zaidi.
    reason: lexical_alternative
  - marker: c
    text: Au, “Jizungushie vazi lako la nje.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: malaika
  rationale: Katika simulizi hili mhusika ni kiumbe wa mbinguni aliyetokea gerezani, hivyo ‘malaika’ linafaa kuliko neno la jumla ‘mjumbe’.
- source_word: Ζῶσαι
  choice: Jifunge mkanda
  rationale: Amri hii inamaanisha kujifunga mkanda ili kuwa tayari; usemi huu ni wa kawaida na unaonyesha tendo halisi.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: uvae viatu vyako
  rationale: Kitenzi kinataja kuvaa viatu, na ‘viatu’ ni neno la kawaida la Kiswahili linaloweza kujumuisha sandali za muktadha huu.
- source_word: ἐποίησεν δὲ οὕτως
  choice: Naye akafanya hivyo
  rationale: Huu ni muhtasari mfupi na wa asili wa kutii kwake maagizo yaliyotangulia.
- source_word: λέγει
  choice: anamwambia
  rationale: Wakati uliopo umehifadhiwa ili kuonyesha wakati uliopo wa kihistoria wa Kigiriki na uchangamfu wa simulizi.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Jivike vazi lako la nje
  rationale: ἱμάτιον ni vazi la nje, na περιβάλλω hapa humaanisha kulivaa au kulizungusha mwilini; ‘jivike’ ni amri ya asili kwa Kiswahili.
- source_word: ἀκολούθει μοι
  choice: unifuate
  rationale: Huhifadhi maana ya moja kwa moja ya kumfuata malaika na uhusiano wa kimsamiati na wazo la kufuata katika Agano Jipya.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usimulizi wa Kiswahili umetumiwa kwa ‘akamwambia’ na ‘akafanya,’ huku wakati uliopo wa kihistoria katika λέγει ukihifadhiwa kwa ‘anamwambia.’
