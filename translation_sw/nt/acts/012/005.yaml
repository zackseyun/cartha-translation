reference: Acts 12:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: sw
  text: Kwa hiyo Petro alikuwa akishikiliwa gerezani, lakini kanisa lilikuwa likimwomba Mungu kwa bidii[a] kwa ajili yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa dhati” au “kwa kuendelea”; kielezi cha Kigiriki kinaweza kusisitiza nguvu au udumifu wa maombi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: alikuwa akishikiliwa
  rationale: Kauli ya kutendwa katika wakati usiotimilika inaonyesha hali iliyoendelea. ‘Alikuwa akishikiliwa’ ni ya asili katika Kiswahili na haiongezi maelezo yasiyosemwa kuhusu namna ya ulinzi.
- source_word: ἐν τῇ φυλακῇ
  choice: gerezani
  rationale: Neno hili hapa linataja mahali Petro alipofungiwa. ‘Gerezani’ ni tafsiri ya kawaida, wazi na yenye hadhi katika simulizi.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: lilikuwa likimwomba Mungu
  rationale: Muundo wa kitenzi pamoja na kihusishi unaonyesha tendo la maombi lililoendelea. Kiswahili cha sasa hueleza jambo hilo kwa ufasaha kwa ‘lilikuwa likimwomba Mungu’.
- source_word: ἐκτενῶς
  choice: kwa bidii
  rationale: Kielezi hiki kinaweza kusisitiza nguvu au kuendelea kwa maombi. ‘Kwa bidii’ huwasilisha uzito na juhudi ya maombi bila kulazimisha maana moja pekee; uwezekano mwingine umewekwa katika tanbihi.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: kanisa
  rationale: Katika muktadha huu neno linamaanisha jumuiya ya waamini waliokuwa wakimwombea Petro. ‘Kanisa’ ndilo neno la kawaida katika Kiswahili na halilazimishi maana ya dhehebu au jengo.
- source_word: πρὸς τὸν θεὸν
  choice: likimwomba Mungu
  rationale: Kihusishi kinaelekeza maombi kwa Mungu; muundo ‘kumwomba Mungu’ ni wa asili katika lugha ya maombi ya Kiswahili.
- source_word: περὶ αὐτοῦ
  choice: kwa ajili yake
  rationale: Katika muktadha wa maombezi, kifungu hiki kinaonyesha kuwa maombi yalitolewa kwa manufaa ya Petro.
- source_word: μὲν οὖν ... δὲ
  choice: Kwa hiyo ... lakini ...
  rationale: Chembe hizi zinaendeleza simulizi huku zikionyesha utofauti kati ya kufungwa kwa Petro na jibu la kanisa kwa njia ya maombi.
theological_decisions:
- issue: Tafsiri ya ἐκκλησία
  choice: kanisa
  alternative: kusanyiko; jumuiya ya waamini
  rationale: Hapa neno linataja jamii ya Wakristo iliyokuwa ikimwombea Petro. ‘Kanisa’ ni tafsiri inayotambulika zaidi katika Kiswahili, lakini katika mstari huu haimaanishi jengo wala taasisi ya dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia muundo wa maombi ulio wa asili kwa wasomaji wa kawaida huku ikihifadhi hali endelevu ya vitendo na utofauti wa sehemu mbili za mstari.
