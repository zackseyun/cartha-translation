id: ACT.12.11
reference: Acts 12:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: sw
  text: Petro alipojitambua[a], akasema, “Sasa najua kwa hakika kwamba Bwana alimtuma malaika wake na akaniokoa kutoka mkononi mwa Herode[b] na kutoka katika yale yote ambayo Wayahudi walikuwa wakitarajia[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliporudiwa na fahamu.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “kutoka mkononi mwa Herode” unamaanisha kutoka katika mamlaka au udhibiti wa Herode.
    reason: cultural_note
  - marker: c
    text: 'Tafsiri nyingine: “na kutoka katika matarajio yote ya Wayahudi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: aliporudiwa na fahamu
  rationale: Ni nahau ya Kiswahili inayoeleza Petro kurejea katika utambuzi kamili baada ya tukio lililoonekana kama maono, bila kudokeza kwamba hapo awali alikuwa amepoteza akili.
- source_word: ἀληθῶς
  choice: kwa hakika
  rationale: Inaonyesha msisitizo wa Petro kwamba sasa ametambua jambo hilo kwa uhakika.
- source_word: ἐξαπέστειλεν
  choice: alimtuma
  rationale: Kitenzi hiki kina maana ya kutuma; hapa Kiswahili cha kawaida hakihitaji kuongeza wazo la ‘kutuma nje.’
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi jina la cheo lililotumiwa katika Kigiriki bila kuamua wazi kama linamtaja Mungu au Yesu aliyefufuka.
- source_word: ἄγγελον
  choice: malaika
  rationale: Katika simulizi hili ni wazi kwamba anayelengwa ni kiumbe wa mbinguni, si mjumbe wa kawaida.
- source_word: ἐξείλατό με
  choice: akaniokoa
  rationale: Hutoa maana ya kuondolewa katika hatari kwa tendo la ukombozi, kwa lugha ya sasa na ya kawaida.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: kutoka mkononi mwa Herode
  rationale: Huhifadhi taswira ya Kigiriki huku nahau ya Kiswahili ikieleweka kuwa ni kuondolewa katika mamlaka au udhibiti wa Herode.
- source_word: πάσης τῆς προσδοκίας
  choice: katika yote ambayo ... walitarajia
  rationale: Kiswahili hiki cha asili kinaeleza matokeo yote yaliyotarajiwa bila kulazimisha kutaja hasa Wayahudi walitarajia jambo gani.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: Wayahudi
  rationale: Ni usemi wa kawaida na sahihi wa Kiswahili kwa watu wa Kiyahudi katika muktadha huu, bila muundo mzito wa ‘watu wa Wayahudi.’
theological_decisions:
- issue: Rejeo la κύριος
  choice: Bwana
  alternative: Mungu; Yesu aliyefufuka
  rationale: Kigiriki hakifafanui rejeo hilo moja kwa moja. ‘Bwana’ huhifadhi hali hiyo ya kutotajwa wazi na mvutano wa kitheolojia wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida, huku taswira ya ‘mkono’ na kutokubainishwa kwa rejeo la ‘Bwana’ vikihifadhiwa.
