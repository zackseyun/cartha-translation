  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: sw
  text: Lakini Herode, baada ya kumtafuta na kutompata, aliwahoji walinzi, kisha akaamuru wapelekwe kuuawa.[a] Halafu akashuka kutoka Uyahudi kwenda Kaisaria, akakaa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya moja kwa moja, “akaamuru wapelekwe.” Katika muktadha huu, inaelekea kwamba walipelekwa kuuawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: baada ya kumtafuta
  rationale: Kishirikishi cha wakati uliopita kinaonyesha kwamba Herode alimtafuta Petro kabla ya kuwahoji walinzi; “kumtafuta” ni lugha ya kawaida na inaonyesha jitihada ya makusudi.
- source_word: μὴ εὑρὼν
  choice: na kutompata
  rationale: Tafsiri hii inaendeleza kwa kawaida mfuatano wa matukio na kudumisha ukanushaji wa Kigiriki.
- source_word: ἀνακρίνας
  choice: aliwahoji
  rationale: Kitenzi hiki kinaweza kumaanisha kuchunguza au kuhoji rasmi. “Aliwahoji” kinafaa kwa uchunguzi wa walinzi kuhusu kutoweka kwa mfungwa.
- source_word: φύλακας
  choice: walinzi
  rationale: Ni neno la kawaida na wazi kwa watu waliopewa jukumu la kumlinda Petro.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: akaamuru waondolewe ili wauawe
  rationale: Kwa maana ya moja kwa moja ni kuamuru waondolewe au wapelekwe, lakini katika muktadha huu kuondolewa kwa walinzi kunaelekea kumaanisha kupelekwa kuuawa. Tafsiri kuu inaweka wazi maana hiyo inayodokezwa, huku tanbihi ikihifadhi usemi halisi na kiwango cha kutokuwa na uhakika.
- source_word: κατελθὼν
  choice: akashuka
  rationale: Inahifadhi lugha ya kijiografia ya kushuka kutoka eneo la ndani la Uyahudi kwenda Kaisaria ya pwani.
- source_word: Ἰουδαίας
  choice: Uyahudi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa eneo la Judea.
- source_word: Καισάρειαν
  choice: Kaisaria
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali hapo.
- source_word: διέτριβεν
  choice: akakaa huko
  rationale: Wakati usiotimilifu unaonyesha kukaa kwa muda; “akakaa huko” ni fupi, ya kawaida, na inadokeza hali iliyoendelea.
theological_decisions:
- issue: Kama ἀπαχθῆναι itafsiriwe tu kuwa kuondolewa au kama adhabu inayodokezwa iwekwe wazi
  choice: akaamuru waondolewe ili wauawe
  alternative: akaamuru waondolewe
  rationale: Kigiriki hakitumii wazi kitenzi cha kuua, lakini katika simulizi la walinzi walioshindwa kumzuia mfungwa asitoroke, kupelekwa kwao kunaelekea sana kumaanisha kuuawa. Maandishi yanaweka wazi maana inayodokezwa bila kuficha kwamba usemi wa asili ni mpana zaidi; tanbihi inalinda mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi umetumiwa kuonyesha hatua za simulizi kwa uwazi. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
