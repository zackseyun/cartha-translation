  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: sw
  text: Lakini Barnaba na Sauli walirudi Yerusalemu[a] baada ya kukamilisha huduma, wakamchukua pamoja nao Yohana, aliyeitwa Marko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati husoma “kutoka Yerusalemu” badala ya kauli inayomaanisha “kwenda Yerusalemu.”
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: walirudi
  rationale: Kitenzi hiki humaanisha kurudi au kwenda tena mahali fulani; “walirudi” ni tafsiri fupi na ya kawaida.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Kihusishi εἰς kwa kawaida huonyesha mwendo kuelekea mahali; kwa kuambatana na “walirudi,” Kiswahili cha asili kinaweza kusema “walirudi Yerusalemu.” Tofauti ya hati yenye maana ya “kutoka Yerusalemu” imehifadhiwa katika tanbihi.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: baada ya kukamilisha huduma yao
  rationale: πληρόω hapa ina maana ya kukamilisha, na διακονία ni huduma. Kiwakilishi “yao” kinaweka wazi kwa Kiswahili kwamba huduma hiyo ndiyo waliyokuwa wakiifanya bila kuibana kuwa kazi ya kutoa msaada pekee.
- source_word: διακονίαν
  choice: huduma
  rationale: Neno hili linaweza kumaanisha huduma, utumishi, au kazi ya kusaidia. “Huduma” huhifadhi upana wa neno la Kigiriki na haiongezi ufafanuzi wa kimuktadha katika matini kuu.
- source_word: συμπαραλαβόντες
  choice: wakamchukua pamoja nao
  rationale: Kirai hiki huonyesha kumchukua mtu ili aandamane nao; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: ἐπικληθέντα Μᾶρκον
  choice: aliyeitwa Marko
  rationale: Kauli tendwa ya ἐπικαλέω hapa ina maana ya kuitwa au kupewa jina; tafsiri hii haisemi wazi “pia,” neno ambalo halipo katika Kigiriki.
theological_decisions:
- issue: Tofauti ya matini kuhusu Yerusalemu kuwa mahali walikoelekea au walikotoka
  choice: walirudi Yerusalemu
  alternative: walirudi kutoka Yerusalemu
  rationale: Matini ya SBLGNT iliyotolewa ina εἰς Ἰερουσαλήμ, yaani mwendo kuelekea Yerusalemu. Ingawa “kutoka Yerusalemu” inalingana vizuri na mtiririko mpana wa simulizi na inaungwa mkono na baadhi ya hati, tafsiri kuu inafuata matini iliyotolewa na kuhifadhi tofauti hiyo katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo umetumiwa ili sentensi isikike kwa asili, huku uhusiano wa matendo ya Kigiriki ukihifadhiwa.
