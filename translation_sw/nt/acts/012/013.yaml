  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: sw
  text: Alipobisha mlango wa lango, kijakazi aliyeitwa Roda akaja kuitikia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Alipobisha
  rationale: Kishirikishi cha aoristi pamoja na δέ kinaendeleza simulizi kwa kuonyesha wakati wa tendo linalofuata; muundo wa Kiswahili “alipobisha” ni wa kawaida na huhifadhi maana hiyo ya wakati.
- source_word: θύραν τοῦ πυλῶνος
  choice: mlango wa lango
  rationale: θύρα ni mlango, na πυλών ni lango au sehemu ya kuingilia yenye lango. “Mlango wa lango” huhifadhi nomino zote mbili na picha ya mlango katika sehemu ya nje ya kuingilia.
- source_word: προσῆλθε
  choice: akaja
  rationale: προσέρχομαι humaanisha kuja au kukaribia. Katika tukio hili la nyumbani, “akaja” ni lugha ya kawaida, huku kitenzi-jina kinachofuata kikieleza kusudi lake.
- source_word: παιδίσκη
  choice: kijakazi
  rationale: Neno hili linaweza kumaanisha mtumishi wa kike au kijakazi aliye mtumwa. “Kijakazi” ni neno la Kiswahili linalofaa katika mazingira ya nyumba bila kuamua wazi hadhi yake ya kisheria; uwezekano wa “msichana mtumwa” umewekwa katika tanbihi.
- source_word: ὑπακοῦσαι
  choice: kuitikia
  rationale: Ingawa ὑπακούω kwa kawaida huhusiana na kusikia au kutii, katika muktadha wa mtu anayebisha mlangoni humaanisha kuitikia mgongaji.
- source_word: ὀνόματι Ῥόδη
  choice: aliyeitwa Roda
  rationale: Dativi ὀνόματι hutambulisha jina la mtu. “Aliyeitwa Roda” ni usemi wa kawaida wa Kiswahili, na jina limetoholewa kwa tahajia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa kwa maandiko. Muundo “mlango wa lango” umehifadhi vipengele viwili vya Kigiriki, na “kuitikia” linaeleza kwa kawaida mwitikio kwa mtu anayebisha.
