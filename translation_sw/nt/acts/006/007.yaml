base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: sw
  text: Neno la Mungu lilikuwa likizidi kuenea, na idadi ya wanafunzi huko Yerusalemu ilikuwa ikiongezeka sana kwa wingi. Tena, idadi kubwa ya makuhani walikuwa wakitii imani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa watiifu kwa imani.” Maneno ya Kigiriki yanaweza kumaanisha kutii ujumbe wa Kikristo, si tendo la ndani la kuamini tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: Neno la Mungu
  rationale: Huhifadhi nahau ya kibiblia na inaweza kumaanisha ujumbe unaotangazwa kutoka kwa Mungu bila kuufafanua kupita kiasi.
- source_word: ηὔξανεν
  choice: likazidi kuenea
  rationale: Wakati usiotimilifu unaonyesha maendeleo yanayoendelea; katika Kiswahili, neno au ujumbe 'kuenea' ni la kawaida na hueleweka kuliko kusema neno lenyewe linaongezeka.
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: idadi ya wanafunzi ikaendelea kuongezeka
  rationale: Huhifadhi kutajwa wazi kwa idadi na wanafunzi, huku 'ikaendelea' ikionyesha hali endelevu ya kitenzi cha Kigiriki.
- source_word: ἐν Ἰερουσαλὴμ σφόδρα
  choice: sana huko Yerusalemu
  rationale: Hutoa mahali na kiwango kikubwa cha ongezeko kwa Kiswahili cha kawaida; 'huko' hurejelea mahali panaposimuliwa.
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: Pia, umati mkubwa wa makuhani
  rationale: '''Umati mkubwa'' huhifadhi wazo la kundi kubwa, na ''pia'' huwakilisha kiunganishi τε kwa mtiririko wa kawaida.'
- source_word: ὑπήκουον
  choice: ulikuwa ukitii
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, bila kulazimisha tafsiri ya mchakato wa ndani wa kuongoka.
- source_word: τῇ πίστει
  choice: imani
  rationale: Kiswahili kwa kawaida hakitumii kibainishi kinacholingana na 'the'; 'kutii imani' huhifadhi kwa makusudi uwezekano wa imani kumaanisha ujumbe au kweli iliyoaminiwa.
theological_decisions:
- issue: Maana ya πίστις katika τῇ πίστει
  choice: kutii imani
  alternative: kuwa watiifu kwa ujumbe wa imani
  rationale: Tafsiri kuu inabaki karibu na muundo wa Kigiriki na haifungi maana kwa tendo la ndani la kuamini pekee. Tanbihi inaeleza kwamba hapa 'imani' yaweza kumaanisha ujumbe au mafundisho yanayoaminiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili iwe rahisi kusomeka, huku uendelevu wa vitenzi vya Kigiriki ukihifadhiwa kwa 'likazidi,' 'ikaendelea,' na 'ulikuwa ukitii.'
