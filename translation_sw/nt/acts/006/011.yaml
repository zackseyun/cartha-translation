  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: sw
  text: Kisha wakawashawishi wanaume kwa siri waseme[a], “Tumemsikia akisema maneno ya kufuru dhidi ya Musa na Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawachochea wanaume waseme.” Kitenzi cha Kigiriki kina wazo la kuwashawishi au kuwachochea watu kwa siri.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Kiunganishi cha wakati kinachoendeleza simulizi kwa lugha ya kawaida na ya asili.
- source_word: ὑπέβαλον
  choice: wakawashawishi kwa siri
  rationale: Huwasilisha tendo la kuwachochea au kuwafanya watu waseme jambo kwa njama na kwa kificho, si kuwaleta mbele tu.
- source_word: ἄνδρας
  choice: baadhi ya wanaume
  rationale: Neno ἀνήρ linarejelea watu wa kiume; “baadhi ya” linafanya Kiswahili kiwe cha asili bila kudai kwamba walikuwa wanaume wote.
- source_word: λέγοντας
  choice: waseme
  rationale: Muundo wa kishirikishi baada ya ὑπέβαλον unawasilishwa kwa kawaida kama jambo waliloshawishiwa kufanya.
- source_word: Ἀκηκόαμεν
  choice: Tumemsikia
  rationale: Wakati timilifu unaonyesha dai la kusikia ambalo matokeo yake yanaendelea kuwa halali kwa wasemaji.
- source_word: αὐτοῦ λαλοῦντος
  choice: akisema
  rationale: Huwasilisha kwa Kiswahili cha asili maana ya kumsikia akiwa ananena.
- source_word: ῥήματα βλάσφημα
  choice: maneno ya kukufuru
  rationale: Huhifadhi uzito wa kidini na kisheria wa βλάσφημα bila kuthibitisha kwamba shtaka hilo lilikuwa la kweli.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: dhidi ya Musa na Mungu
  rationale: Katika muktadha wa shtaka la uhasama, εἰς inaonyesha walikoelekezwa maneno hayo ya kukufuru.
theological_decisions:
- issue: Asili ya shtaka dhidi ya Stefano
  choice: Shtaka limetafsiriwa kama “maneno ya kukufuru dhidi ya Musa na Mungu,” bila kulipunguza wala kulithibitisha.
  alternative: “maneno ya kashfa dhidi ya Musa na Mungu”
  rationale: “Kukufuru” huhifadhi nguvu ya kidini na kisheria ya βλάσφημα, huku simulizi likibaki kuwa taarifa ya kile wanaume hao walichochewa kusema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Kuwashawishi kwa siri” ni usemi wa asili unaohifadhi hila iliyomo katika kitenzi cha Kigiriki; tanbihi inaonyesha mbadala wenye nguvu tofauti.
