id: ACT.6.13
reference: Acts 6:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: sw
  text: Pia wakawasimamisha mashahidi wa uongo waliosema, “Mtu huyu haachi[b] kusema maneno[c] dhidi ya mahali hapa patakatifu[a] na dhidi ya sheria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali patakatifu.” Katika muktadha huu, usemi wa Kigiriki unarejelea hasa hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hakomi kusema.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kusema” au “kusema mambo” dhidi ya mahali hapa patakatifu na sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: wakawasimamisha
  rationale: Katika muktadha huu wa kisheria, kitenzi kina maana ya kuwafanya mashahidi wasimame au wajitokeze kutoa ushahidi; tafsiri hii pia inadokeza kuwa waliwekwa mbele kwa kusudi hilo bila kuongeza maelezo yasiyomo.
- source_word: τε
  choice: Pia
  rationale: Neno hili linaongeza tendo jingine katika mfululizo wa matukio.
- source_word: μάρτυρας ψευδεῖς
  choice: mashahidi wa uongo
  rationale: Huu ni usemi wa kawaida wa kisheria kwa watu wanaotoa ushahidi usio wa kweli.
- source_word: λέγοντας
  choice: waliosema
  rationale: Kishazi cha uhusiano ni cha asili katika Kiswahili na kinaunganisha mashahidi na maneno ya shtaka lao.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Mtu huyu
  rationale: Ni tafsiri ya moja kwa moja yenye sauti ya shtaka bila kuongeza dharau kali kuliko ilivyo katika Kigiriki.
- source_word: οὐ παύεται
  choice: haachi
  rationale: Inaonyesha kitendo kinachoendelea na dai kwamba mtu huyo hakomi kufanya hivyo.
- source_word: λαλῶν ῥήματα
  choice: kusema maneno
  rationale: Inawakilisha wazi nomino ῥήματα na kuhifadhi mtindo wa shtaka, ingawa Kiswahili pia kinaweza kusema kwa ufupi ‘kusema dhidi ya’.
- source_word: κατὰ
  choice: dhidi ya
  rationale: Katika shtaka hili lenye uhasama, kihusishi kinaonyesha upinzani unaoelekezwa kwa mahali patakatifu na kwa sheria.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: mahali hapa patakatifu
  rationale: Ingawa Kigiriki kina kibainishi wala si kiashiria cha wazi, muktadha unaelekeza kwa hekalu lililokuwa mahali hapo; ‘hapa’ huwasilisha urejeo huo wa karibu kwa njia ya asili.
- source_word: νόμου
  choice: sheria
  rationale: Katika mazingira haya neno linarejelea sheria ya Musa, lakini tafsiri haipanui usemi wa washtaki zaidi ya neno la chanzo.
theological_decisions:
- issue: Kirejewa cha ‘mahali patakatifu’ na ‘sheria’
  choice: Shtaka linahusu hekalu la Yerusalemu na sheria ya Musa, huku maandishi yakibaki na maneno ya jumla yaliyotumiwa na washtaki.
  alternative: Kuelewa maneno hayo kwa ujumla kuwa eneo lolote takatifu na mapokeo yoyote ya kisheria.
  rationale: Muktadha wa karibu wa Matendo unahusu mashtaka dhidi ya Stefano kuhusu hekalu na Musa; tafsiri haiongezi ufafanuzi huo moja kwa moja ndani ya mstari.
- issue: Sauti ya shtaka
  choice: Kuhifadhi sauti ya kisheria yenye uhasama bila kuifanya kuwa kali zaidi.
  alternative: Kutumia maneno ya kufasiri kama ‘anakufuru’ au ‘anakashifu’.
  rationale: Kigiriki kinasema ‘kusema maneno dhidi ya,’ si kitenzi maalumu chenye maana kali zaidi kama kukufuru.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa shtaka la kisheria umehifadhiwa; ‘wakawasimamisha’ ni wa kibiblia kwa kiasi lakini unaeleweka, na ‘mashahidi wa uongo’ ni usemi wa kawaida wa kisheria.
