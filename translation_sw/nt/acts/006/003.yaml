  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: sw
  text: Basi, ndugu[a], chagueni miongoni mwenu wanaume saba wenye sifa njema[b], waliojaa Roho[c] na hekima, ambao tutawateua kusimamia jukumu hili[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume; hapa huenda linawahusu waamini wote waliokusanyika.
    reason: cultural_note
  - marker: b
    text: 'Kwa tafsiri iliyo karibu zaidi na wazo la ushuhuda: “wanaoshuhudiwa vema.”'
    reason: lexical_alternative
  - marker: c
    text: Au “Roho Mtakatifu.” Kigiriki kinasema “Roho” bila kuongeza neno “Mtakatifu.”
    reason: alternative_reading
  - marker: d
    text: “Jukumu hili” ni kazi ya kushughulikia ugawaji wa kila siku unaotajwa katika muktadha.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: chagueni
  rationale: Amri hii inalitaka kusanyiko liwachunguze na kuwateua watu wanaofaa. “Chagueni” ni ya kawaida na inaeleza hatua inayokusudiwa katika muktadha.
- source_word: δέ
  choice: Basi
  rationale: Hapa δέ inaendeleza hoja kutoka pendekezo la mitume hadi hatua ambayo kusanyiko linapaswa kuchukua. “Basi” huonyesha mpito huo bila kulazimisha utofauti mkali.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni namna ya kawaida na yenye heshima ya kuwaita waamini kwa pamoja; dokezo linaeleza kuwa umbo la Kigiriki ni la kiume lakini huenda linawahusu waamini wote waliokusanyika.
- source_word: ἄνδρας ἐξ ὑμῶν
  choice: wanaume saba ... miongoni mwenu
  rationale: ἀνήρ humaanisha wanaume, si watu kwa ujumla, na ἐξ ὑμῶν huonyesha kwamba walipaswa kuchaguliwa kutoka ndani ya jumuiya yenyewe.
- source_word: μαρτυρουμένους
  choice: wenye sifa njema
  rationale: Kirai hiki kinaonyesha kuwa wengine wanawashuhudia vizuri. “Wenye sifa njema” ni Kiswahili cha kawaida kinachowasilisha maana hiyo, ingawa dokezo linahifadhi namna iliyo karibu zaidi na wazo la ushuhuda.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: waliojaa Roho na hekima
  rationale: Katika Luka–Matendo, muktadha huu unaelekea kumaanisha Roho wa Mungu. Hata hivyo, kwa kuwa Kigiriki hakina neno “Mtakatifu” hapa, matini kuu inasema “Roho” na dokezo linatoa ufafanuzi unaowezekana.
- source_word: καταστήσομεν
  choice: tutawateua kusimamia
  rationale: Kitenzi kinaonyesha kuwa mitume watawaweka rasmi katika wajibu fulani. “Tutawateua kusimamia” ni cha asili na kinaonyesha mamlaka waliyopewa.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: kusimamia jukumu hili
  rationale: χρεία hapa ni jambo au kazi inayohitaji kushughulikiwa, yaani ugawaji wa kila siku unaotajwa katika muktadha. “Jukumu hili” linaeleza wajibu huo bila kuongeza maelezo ndani ya matini.
theological_decisions:
- issue: Ikiwa πνεύματος humaanisha roho kwa ujumla au Roho Mtakatifu
  choice: Roho
  alternative: Roho Mtakatifu; au roho
  rationale: Matumizi ya Luka–Matendo na wazo la kuwezeshwa kwa huduma yanaunga mkono kumwelewa Roho wa Mungu. Herufi kubwa inaonyesha rejeo hilo linalowezekana sana, lakini kutotaja “Mtakatifu” katika matini kuu kunahifadhi kwamba neno ἁγίου halipo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. “Basi” limetumiwa kama kiunganishi cha mpito; “wenye sifa njema” na “tutawateua kusimamia” ni semi za kawaida zisizo za kimadhehebu.
