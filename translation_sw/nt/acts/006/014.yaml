  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: sw
  text: Kwa maana tumemsikia akisema kwamba huyu Yesu Mnazareti[a] ataharibu mahali hapa[b] na kubadili desturi ambazo Musa alitukabidhi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huyu Yesu wa Nazareti.”
    reason: lexical_alternative
  - marker: b
    text: “Mahali hapa” panarejelea hekalu.
    reason: cultural_note
  - marker: c
    text: Au, “desturi ambazo Musa alitupokezea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: tumemsikia
  rationale: Kauli timilifu inaonyesha kwamba walimsikia moja kwa moja na dai lao bado lina uzito katika shtaka la sasa; Kiswahili cha wakati timilifu kinafaa kiasili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inahifadhi kazi ya kutoa sababu au ufafanuzi unaounganisha mstari huu na shtaka lililotangulia.
- source_word: αὐτοῦ λέγοντος
  choice: akisema
  rationale: Muundo wa Kiswahili ‘tumemsikia akisema’ huwasilisha kwa kawaida dai la kumsikia mhusika mwenyewe akinena.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: huyu Yesu Mnazareti
  rationale: ‘Huyu’ huhifadhi msisitizo wa οὗτος, na ‘Mnazareti’ ni jina la kumtambulisha mtu wa Nazareti huku likiruhusu toni yenye dharau katika muktadha.
- source_word: καταλύσει
  choice: atapaharibu
  rationale: Katika muktadha wa mahali patakatifu, kitenzi kinamaanisha kuharibu au kubomoa; ‘atapaharibu’ ni wazi na huambatana kisarufi na ‘mahali hapa.’
- source_word: τὸν τόπον τοῦτον
  choice: mahali hapa
  rationale: Hufuata usemi halisi wa Kigiriki bila kutaja moja kwa moja hekalu, ingawa ndilo linalorejelewa katika muktadha.
- source_word: ἀλλάξει
  choice: kubadili
  rationale: Ni kisawe cha kawaida na cha sasa cha tendo la kufanya desturi ziwe tofauti.
- source_word: τὰ ἔθη
  choice: desturi
  rationale: Neno hili linaeleza mazoea na taratibu za jamii zilizopokewa, bila kulifanya kiufundi zaidi ya Kigiriki.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: ambazo Musa alitukabidhi
  rationale: ‘Alitukabidhi’ huhifadhi wazo la kuwasilisha au kukabidhi desturi kwa jamii; tanbihi inatoa namna ya kusisitiza kupokezana vizazi.
theological_decisions:
- issue: Kinachorejelewa na ‘mahali hapa’
  choice: Mahali hapa
  alternative: Hekalu hili / patakatifu hapa
  rationale: Kigiriki kinasema ‘mahali hapa.’ Muktadha unaonyesha hekalu, lakini maandishi makuu hayafafanui zaidi ya maneno ya washtaki.
- issue: Toni ya shtaka dhidi ya Yesu
  choice: Huyu Yesu Mnazareti
  alternative: Yesu huyu wa Nazareti / Yesu wa Nazareti
  rationale: ‘Huyu’ huhifadhi nguvu ya kiashiria cha Kigiriki na toni inayoweza kuwa ya dharau bila kuongeza hukumu ya mtafsiri.
- issue: Uhusiano wa Musa na desturi
  choice: Musa alitukabidhi
  alternative: Musa alitupokezea
  rationale: Tafsiri inahifadhi dai la washtaki kwamba desturi hizo zililetwa kwao kupitia Musa, bila kuamua hapa upeo wa sheria au mapokeo wanayokusudia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio ni wa kawaida katika usemi wa kisasa, huku ‘Kwa maana,’ ‘mahali hapa,’ na kiashiria ‘huyu’ vikihifadhi uhusiano wa hoja, rejeo lisilotajwa wazi, na toni ya shtaka katika chanzo.
