id: ACT.6.5
reference: Acts 6:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: sw
  text: Pendekezo hilo likapendwa na kusanyiko lote, nao wakamchagua Stefano, mtu aliyejaa imani[a] na Roho Mtakatifu, pamoja na Filipo, Prokoro, Nikanori, Timoni, Parmena na Nikolao, mgeuzi wa dini ya Kiyahudi[b] kutoka Antiokia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu.” Neno la Kigiriki linaweza kumaanisha imani, kumtumaini mtu, au uaminifu.
    reason: lexical_alternative
  - marker: b
    text: “Mgeuzi wa dini ya Kiyahudi” alikuwa mtu asiye Myahudi kwa kuzaliwa ambaye alikuwa amejiunga na dini ya Kiyahudi.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: pendekezo hilo
  rationale: Katika muktadha huu λόγος inarejelea jambo ambalo mitume walikuwa wametoka kupendekeza, si “neno” kwa maana ya jumla.
- source_word: ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους
  choice: Pendekezo hilo likapendwa na kusanyiko lote
  rationale: Hii inaeleza kwamba kundi lote lililipokea kwa furaha au kulikubali pendekezo; “kusanyiko” ni la kawaida na halilazimishi istilahi rasmi ya kikanisa.
- source_word: ἐξελέξαντο
  choice: wakamchagua ... pamoja na
  rationale: Kitenzi kinamaanisha kuchagua; muundo huu unamweka Stefano na wale wengine sita katika kundi moja la watu saba waliochaguliwa.
- source_word: ἄνδρα πλήρης πίστεως
  choice: mtu aliyejaa imani
  rationale: “Mtu” ni Kiswahili cha kawaida hapa, na “aliyejaa imani” huhifadhi taswira ya πλήρης pamoja na maana ya msingi ya πίστις.
- source_word: πνεύματος ἁγίου
  choice: Roho Mtakatifu
  rationale: Katika Matendo usemi huu kwa kawaida humrejelea Roho Mtakatifu wa Mungu.
- source_word: προσήλυτον
  choice: mwongofu wa Kiyahudi
  rationale: Neno hili linamaanisha mtu wa Mataifa aliyegeukia dini ya Kiyahudi; tafsiri hii inaeleweka moja kwa moja kwa msomaji wa sasa.
- source_word: Ἀντιοχέα
  choice: kutoka Antiokia
  rationale: Kivumishi hiki kinamtambulisha Nikolao kuwa mtu aliyehusishwa na Antiokia; “kutoka Antiokia” ni cha asili katika Kiswahili.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Stefano, Filipo, Prokoro, Nikanori, Timoni, Parmena na Nikolao
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, huku orodha ikitolewa kwa mtindo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Maana ya πίστις katika sifa ya Stefano
  choice: imani
  alternative: uaminifu
  rationale: “Imani” ndiyo maana inayowezekana zaidi katika muktadha huu na huhifadhi istilahi ya kawaida ya kitheolojia; hata hivyo, πίστις inaweza pia kumaanisha uaminifu, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa orodha ni wa kawaida katika Kiswahili na unaonyesha wazi kwamba watu saba walichaguliwa pamoja. Tanbihi zote zina viashiria vinavyolingana katika maandishi.
