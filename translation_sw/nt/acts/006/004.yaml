  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: sw
  text: Lakini sisi tutajitolea kwa sala na kwa huduma ya neno[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utumishi wa neno.” Neno la Kigiriki linaweza kumaanisha “huduma” au “utumishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi hiki kimetajwa wazi katika Kigiriki ili kusisitiza na kutofautisha wajibu wa mitume na ule uliotajwa katika muktadha uliotangulia.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya mgawo uliopendekezwa kwa wengine na wajibu ambao mitume wataendelea kuutimiza.
- source_word: τῇ προσευχῇ
  choice: kwa sala
  rationale: Dativu inaonyesha jambo ambalo watajitoa kwalo; ‘kwa sala’ ni Kiswahili cha kawaida na chenye mtiririko mzuri pamoja na kitenzi ‘kujitolea’.
- source_word: διακονίᾳ
  choice: huduma
  rationale: Neno hili linaweza kumaanisha huduma au utumishi. ‘Huduma’ linafaa hapa kwa kazi ya kulitumikia na kulitangaza neno, bila kuingiza tofauti rasmi ya kitabaka kati ya viongozi na waumini.
- source_word: τοῦ λόγου
  choice: ya neno
  rationale: Hapa λόγος inarejelea neno au ujumbe unaotangazwa. ‘Neno’ linahifadhi msemo wa Kikristo wa awali na uhusiano wake wa wazi na matini chanzi.
- source_word: προσκαρτερήσομεν
  choice: tutajitoa
  rationale: Kitenzi cha wakati ujao kinaonyesha kudumu kwa bidii na kwa uthabiti katika shughuli hizi; ‘tutajitoa’ ni usemi wa asili unaowasilisha dhamira hiyo endelevu.
theological_decisions:
- issue: Maana ya διακονία ikilinganishwa na kuhudumia mezani katika muktadha wa karibu
  choice: huduma ya neno
  alternative: utumishi wa neno
  rationale: ‘Huduma’ inatofautisha kwa kawaida kazi ya mitume na kuhudumia mezani, lakini bado inabaki ndani ya uwanja wa maana wa kutumikia. Tafsiri hii haiingizi mgawanyiko mkali wa makasisi na walei ambao haujaelezwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi msisitizo wa ‘sisi’ na tofauti inayoletwa na ‘lakini,’ huku ukitumia usemi wa kawaida ‘kujitolea kwa’.
