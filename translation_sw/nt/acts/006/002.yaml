base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: sw
  text: Basi wale Kumi na Wawili wakawaita wanafunzi wote[a] pamoja, wakasema, “Haifai[b] sisi kuliacha neno la Mungu ili kuhudumu mezani[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umati wa wanafunzi” au “kusanyiko lote la wanafunzi.”
    reason: lexical_alternative
  - marker: b
    text: Au “Haikubaliki” au “Si jambo linalofaa kwetu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, kushughulikia ugawaji wa vitendo uliohusiana na milo na rasilimali za jumuiya.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: wakawaita pamoja
  rationale: Kitenzi hiki kinaonyesha kuwa wale Kumi na Wawili waliwakusanya wanafunzi kwa kusudi la kuzungumza nao; “wakawaita pamoja” ni Kiswahili cha kawaida kinachohifadhi wazo la kuitisha mkutano.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi na kuunganisha hatua hii na tatizo lililotangulia, si kuonyesha upinzani mkali.
- source_word: οἱ δώδεκα
  choice: wale Kumi na Wawili
  rationale: Hili linahifadhi jina la kundi lililo katika Kigiriki bila kuongeza neno “mitume,” ambalo halipo wazi katika mstari huu.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: wanafunzi wote
  rationale: πλῆθος hapa inaonyesha kundi zima au umati wa wanafunzi; “wanafunzi wote” ni ya asili na inaonyesha nguvu ya kijumla ya usemi.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Haifai
  rationale: Katika muktadha huu usemi unahusu jambo linalofaa kwa wajibu wao; “Haifai” huhifadhi maana ya kufaa au kukubalika bila kuifanya kazi ya huduma ionekane duni.
- source_word: ἡμᾶς καταλείψαντας
  choice: sisi kuliacha
  rationale: “Kuliacha” hudumisha maana ya kuacha nyuma neno la Mungu. Kiwakilishi “sisi” kinahifadhi msisitizo wa ἡμᾶς na kinaeleweka katika muundo huu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Ni tafsiri ya moja kwa moja yenye mwangwi wa kitheolojia; katika Matendo pia inaweza kumaanisha ujumbe unaohubiriwa kutoka kwa Mungu.
- source_word: διακονεῖν
  choice: kuhudumia
  rationale: Neno hili linaonyesha kutoa huduma ya vitendo. “Kuhudumia” ni la kawaida na haliongezi maana maalumu ya cheo cha kanisa.
- source_word: τραπέζαις
  choice: mezani
  rationale: Dativu ya wingi τραπέζαις inaweza kutolewa kwa Kiswahili cha asili kama “mezani.” Taswira ya meza inahifadhiwa, huku tanbihi ikieleza mazingira ya ugawaji wa chakula na rasilimali.
theological_decisions:
- issue: Kipaumbele cha wajibu wa mitume kwa kulinganisha na huduma ya vitendo
  choice: “Haifai sisi kuliacha neno la Mungu ili kuhudumia mezani” linaonyesha mgawanyo wa wajibu na kipaumbele cha wito wao.
  alternative: “Haipendezi sisi...” au tafsiri inayoweza kudokeza kwamba huduma ya mezani haina thamani ya kiroho.
  rationale: Mstari unatofautisha majukumu, si hadhi au thamani ya huduma. Tafsiri inaacha mvutano huo bila kuidunisha kazi ya vitendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “wale Kumi na Wawili” unatunza jina la kundi; “kuhudumia mezani” unahifadhi taswira ya Kigiriki, huku tanbihi ikifafanua mazingira bila kuyaingiza moja kwa moja katika matini.
