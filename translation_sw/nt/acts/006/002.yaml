  - severity: low
    issue: “Kuhudumia mezani” can sound specifically like waiting on diners.
    rationale: “Kuhudumu mezani” is more idiomatic in biblical Swahili and preserves the broad, contextually uncertain reference of διακονεῖν τραπέζαις; the footnote supplies contextual information without narrowing the text.
