review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative transition, the designation “the Twelve,” the collective body of disciples, the propriety expressed by οὐκ ἀρεστόν, and the contrast between leaving God’s word and table service. “Ili” appropriately expresses the relation of the two infinitives in idiomatic Swahili. A small wording adjustment makes the convening action and the practical sense of διακονεῖν τραπέζαις more idiomatic without resolving the referent of “tables” beyond the Greek.
  naturalness: “Wakawaita pamoja wanafunzi wote” is understandable, but placing pamoja after its object is more natural and avoids a momentary awkwardness. “Kuhudumu mezani” is the established, concise Swahili expression for service at/tables and retains the source’s concrete image better than “kuhudumia mezani.”
  terminology: “Wale Kumi na Wawili,” “neno la Mungu,” and “wanafunzi” are appropriate Standard East African Swahili biblical terms. The cultural footnote appropriately explains the likely communal-distribution setting while the text itself remains noncommittal.
