id: ACT.6.15
reference: Acts 6:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: sw
  text: Nao wote waliokuwa wameketi katika baraza[a] wakamkazia macho, wakaona uso wake ukiwa kama uso wa malaika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sanhedrini.” Neno la Kigiriki linamaanisha baraza kuu la Wayahudi lililokuwa na mamlaka.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: wakamkazia macho
  rationale: Kitenzi hiki kinaonyesha kumtazama mtu kwa makini na kwa muda, si kumwangalia kwa haraka tu. “Wakamkazia macho” ni usemi wa kawaida unaodumisha uzito huo.
- source_word: πάντες οἱ καθεζόμενοι
  choice: wote waliokuwa wameketi
  rationale: Tafsiri hii inadumisha maana ya ujumla katika πάντες na hali ya kuwa wameketi katika καθεζόμενοι, huku ikisomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: συνεδρίῳ
  choice: baraza
  rationale: Katika muktadha huu neno linamaanisha baraza kuu la Wayahudi lililokuwa na mamlaka. “Baraza” linatafsiri maana yake moja kwa moja; jina “Sanhedrini” linaelezwa katika tanbihi.
- source_word: πρόσωπον
  choice: uso
  rationale: Hapa πρόσωπον linarejelea moja kwa moja sura ya nje ya Stefano, na “uso” ni neno la kawaida na wazi la Kiswahili.
- source_word: ὡσεὶ
  choice: kama
  rationale: Neno hili linaonyesha ulinganisho au kufanana bila kudai kwamba vitu vinavyolinganishwa ni kitu kimoja. “Kama” ni tafsiri fupi na ya kawaida.
- source_word: ἀγγέλου
  choice: malaika
  rationale: Katika muktadha huu ἄγγελος linaeleweka kuwa kiumbe wa mbinguni, si mjumbe wa kawaida wa kibinadamu.
theological_decisions:
- issue: Asili ya ulinganisho katika “kama uso wa malaika”
  choice: Ulinganisho unaosema kwamba uso wa Stefano ulifanana na uso wa malaika, bila kutaja sifa hasa iliyofanana.
  alternative: Kusema wazi kwamba uso wake uling'aa, au ulionyesha utulivu, kutokuwa na hatia, au mamlaka ya mbinguni.
  rationale: Kigiriki kinataja kufanana lakini hakifafanui kama kulihusu mwanga, utulivu, utukufu, mamlaka, au mchanganyiko wa mambo hayo. Tafsiri haifungii maana katika sifa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. Mpangilio wa vitenzi unadumisha mwendo wa simulizi, na “wakamkazia macho” huepuka usemi dhaifu wa kutazama tu.
