base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: sw
  text: Stefano[a], akiwa amejaa neema na nguvu, alikuwa akifanya maajabu na ishara kubwa miongoni mwa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hati fulani husoma “amejaa imani na nguvu” badala ya “amejaa neema na nguvu.”
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Ni kiunganishi hafifu kinachoendeleza simulizi. Mtiririko wa Kiswahili hauhitaji “basi” au “lakini” hapa, ambazo zingeongeza maana isiyo dhahiri katika muktadha huu.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: akiwa amejaa neema na nguvu
  rationale: “Amejaa” huonyesha kwamba Stefano alikuwa na sifa hizi kwa wingi; “neema” huhifadhi maana na mwangwi wa kitheolojia wa χάρις, na “nguvu” inafaa katika muktadha wa matendo ya ajabu.
- source_word: ἐποίει
  choice: alikuwa akifanya
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea au kufanyika kwa kawaida wakati uliopita, kulingana na hali ya kitenzi cha Kigiriki isiyotimilifu.
- source_word: τέρατα καὶ σημεῖα μεγάλα
  choice: maajabu na ishara kubwa
  rationale: “Maajabu” hukazia mshangao unaosababishwa na matendo hayo, huku “ishara” ikihifadhi kazi yake ya kuelekeza kwenye maana iliyo zaidi ya tendo lenyewe. “Kubwa” linaeleweka kuwa linahusu yote mawili.
- source_word: ἐν τῷ λαῷ
  choice: miongoni mwa watu
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili kueleza mazingira au kundi ambamo matendo hayo yalitendeka.
theological_decisions:
- issue: Tofauti ya maandishi katika χάριτος/πίστεως
  choice: neema
  alternative: imani
  rationale: Maandishi ya SBLGNT yaliyotolewa yanasoma χάριτος (“neema”). Tofauti muhimu ya πίστεως (“imani”) imehifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Jina “Stefano” linafuata umbo linalotumika kwa kawaida katika mapokeo ya Biblia ya Kiswahili.
