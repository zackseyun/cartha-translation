id: ACT.6.12
reference: Acts 6:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: sw
  text: Basi wakawachochea watu, wazee na waandishi wa sheria; kisha wakamjia kwa ghafla, wakamkamata na kumpeleka mbele ya Baraza Kuu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sanhedrini.” Neno la Kigiriki linaweza pia kutafsiriwa “baraza,” lakini hapa yaelekea linamaanisha Baraza Kuu la Wayahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν (συγκινέω)
  choice: wakawachochea
  rationale: Kitenzi hiki kinaonyesha kuwasukuma watu kihisia na kijamii wachukue hatua. ‘Kuwachochea’ ni Kiswahili cha kawaida chenye nguvu inayofaa bila kudai wazi kwamba walichochewa kufanya vurugu.
- source_word: τε
  choice: Basi
  rationale: Chembe hii ni kiunganishi hafifu cha simulizi. ‘Basi’ linaendeleza matokeo ya matendo yaliyotangulia kwa njia ya asili katika Kiswahili.
- source_word: τὸν λαὸν
  choice: watu
  rationale: Huhifadhi maana pana ya umma bila kuibana iwe ‘umati,’ jambo ambalo neno la Kigiriki halilazimishi hapa.
- source_word: τοὺς πρεσβυτέρους
  choice: wazee
  rationale: Katika mazingira haya neno linamaanisha wazee waliotambuliwa kuwa viongozi, si wanaume wenye umri mkubwa tu.
- source_word: τοὺς γραμματεῖς
  choice: waandishi wa sheria
  rationale: Usemi huu unatambulisha kwa kueleweka wataalamu wa Maandiko na sheria wa wakati huo, huku ukihifadhi istilahi ya kihistoria ya ‘waandishi.’
- source_word: ἐπιστάντες (ἐφίστημι)
  choice: wakamjia kwa ghafla
  rationale: Huwasilisha tendo la kumfikia au kumvamia kwa kushtukiza bila kuzidisha maana kwa kudai namna fulani ya shambulio.
- source_word: συνήρπασαν (συναρπάζω)
  choice: wakamkamata
  rationale: ‘Kumkamata’ huonyesha kumshika kwa nguvu katika muktadha huu wa uhasama, bila kuongeza wazo lisilotajwa la kumburuta.
- source_word: ἤγαγον (ἄγω)
  choice: kumpeleka
  rationale: Baada ya kukamatwa, ‘kumpeleka’ linaonyesha mwendo wa lazima kwa kawaida zaidi kuliko ‘kumwongoza,’ ambalo lingeweza kudokeza hiari.
- source_word: τὸ συνέδριον
  choice: Baraza Kuu
  rationale: Katika mazingira ya Yerusalemu, neno hili linarejelea chombo kikuu cha uongozi na mahakama ya Wayahudi. ‘Baraza Kuu’ ni istilahi ya Kiswahili iliyo wazi; tanbihi inadokeza jina la kihistoria ‘Sanhedrini.’
theological_decisions:
- issue: Utambulisho wa συνέδριον
  choice: Baraza Kuu
  alternative: Sanhedrini; baraza
  rationale: Muktadha wa Yerusalemu pamoja na kutajwa kwa wazee na waandishi wa sheria unaelekeza kwenye baraza maalumu la utawala na mahakama la Wayahudi. Tafsiri hii inahifadhi utambulisho wa taasisi bila kulazimisha msomaji ajue neno la mkopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mfuatano wa matendo ya Kigiriki, huku ‘kwa ghafla’ ikihifadhi hisia ya ujio wa kushtukiza. Alama [a] imewekwa moja kwa moja baada ya istilahi inayofafanuliwa.
