  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: sw
  text: Na hawakuweza kupinga hekima na Roho aliyokuwa akinena nayo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ambayo alikuwa akinena nayo,” ikiwa πνεύματι inaeleweka kuwa roho ya Stefano mwenyewe badala ya Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: hawakuweza
  rationale: Kitenzi katika wakati usiotimilika hapa kinaonyesha kutokuwa na uwezo; “hawakuweza” ni Kiswahili cha kawaida na sahihi.
- source_word: ἀντιστῆναι
  choice: kupinga
  rationale: Katika muktadha wa mabishano, neno hili linaonyesha kushindana au kusimama dhidi ya hoja za Stefano bila kufanikiwa.
- source_word: σοφίᾳ
  choice: hekima
  rationale: Hurejelea hekima iliyodhihirika katika maneno ya Stefano; Kiswahili hakihitaji kibainishi tofauti kuonyesha umahususi huo.
- source_word: πνεύματι
  choice: Roho
  rationale: Muktadha wa Matendo 6, hasa Stefano kujawa na Roho Mtakatifu, unaunga mkono rejeo kwa Roho Mtakatifu, huku uwezekano wa roho ya Stefano ukihifadhiwa katika tanbihi.
- source_word: ᾧ ἐλάλει
  choice: ambaye kwa yeye alikuwa akisema
  rationale: Muundo huu unahifadhi Roho kama mhusika binafsi na dative kama njia au wakala wa kusema; “alikuwa akisema” huonyesha tendo lililoendelea.
theological_decisions:
- issue: Ikiwa πνεύματι inamrejelea Roho Mtakatifu au roho ya Stefano mwenyewe
  choice: Roho
  alternative: roho
  rationale: Mkazo wa muktadha juu ya Stefano kujawa na Roho Mtakatifu na kuunganishwa kwa hekima na Roho unaunga mkono maana ya Roho Mtakatifu, lakini sarufi pekee hailazimishi uamuzi huo; hivyo maana nyingine imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ambaye kwa yeye” umetumiwa kuhifadhi uwezekano wa Roho kuwa wakala binafsi, ingawa ni rasmi zaidi kuliko lugha ya mazungumzo.
