  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: sw
  text: Wakawaleta mbele ya mitume[a]. Mitume, baada ya kuomba, wakaweka mikono yao juu yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakawasilisha hao mbele ya mitume.”
    reason: lexical_alternative
  - marker: b
    text: Kuweka mikono juu yao kunaweza kuashiria kuwaagiza hadharani au kuwabariki; hapa Kigiriki kinataja tendo hilo bila kufafanua zaidi maana yake ya kikanisa.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: Wakawaleta
  rationale: Kiwakilishi rejeshi cha wingi kinawarejelea wale saba wa mstari uliotangulia. Kiswahili hutumia kiambishi cha yambwa -wa- kwa njia ya kawaida bila kuongeza neno lisilokuwamo kama “watu hawa”.
- source_word: ἔστησαν ἐνώπιον
  choice: wakawaleta mbele ya
  rationale: Muundo huu una maana ya kuwaweka au kuwawasilisha watu mbele ya wengine. “Kuwaleta mbele ya” ni Kiswahili cha kawaida na huhifadhi wazo la kuwasilishwa katika uwepo wa mitume.
- source_word: τῶν ἀποστόλων
  choice: mitume
  rationale: Katika Matendo neno hili linataja kundi linalotambuliwa la mitume; istilahi iliyozoeleka ya Kiswahili inafaa kuliko tafsiri pana kama “wajumbe”.
- source_word: προσευξάμενοι
  choice: baada ya kuomba
  rationale: 'Kitenzi kishirikishi cha aoristi kwa kawaida huonyesha tendo lililotangulia tendo kuu: waliomba kwanza, kisha wakaweka mikono.'
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: wakaweka mikono yao juu yao
  rationale: Hutafsiri tendo lililotajwa wazi bila kulifafanua kuwa kuwekwa wakfu, kuagizwa, au kupewa mamlaka. Kivumishi “yao” ni cha kawaida kwa viungo vya mwili katika Kiswahili.
theological_decisions:
- issue: Maana ya tendo la kuwawekea mikono
  choice: Tendo limeelezwa moja kwa moja kama “wakaweka mikono yao juu yao.”
  alternative: “wakawaweka wakfu” au “wakawapa utume”
  rationale: Kigiriki kinataja tendo lenyewe lakini katika mstari huu hakifafanui kikamilifu maana yake ya kikanisa. Tafsiri haipaswi kuamua mjadala wa kimadhehebu.
- issue: Ni nani walioomba na kuweka mikono
  choice: Muendelezo wa kishazi unaeleweka kuwa mitume ndio walioomba na kuweka mikono.
  alternative: Jumuiya yote iliomba na kuweka mikono
  rationale: Ingawa kiima hakitajwi tena kwa jina, kiima cha kimantiki kilicho karibu na mfuatano wa tendo ni mitume ambao watu hao waliletwa mbele yao; tafsiri ya Kiswahili inaacha hili litokane na muktadha bila kuongeza “mitume” mara ya pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa maandiko. “Wakawaleta mbele ya” huepuka ugeuzi mgumu wa neno kwa neno, huku tanbihi ikihifadhi uwezekano wa “wakawasilisha.” Alama zote za tanbihi zimewekwa katika matini kuu.
