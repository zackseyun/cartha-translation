id: ACT.6.9
reference: Acts 6:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: sw
  text: Lakini baadhi ya watu kutoka sinagogi lililoitwa Sinagogi la Walioachwa Huru[a], watu wa Kurene na Aleksandria, na wale kutoka Kilikia na Asia[b], walisimama wakibishana na Stefano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sinagogi la Walibertini.” Neno la Kigiriki linarejelea watu walioachwa huru kutoka utumwani; huenda walikuwa watumwa wa zamani au wazao wa watu hao.
    reason: lexical_alternative
  - marker: b
    text: “Asia” hapa ni jimbo la Kirumi katika sehemu ya magharibi ya Asia Ndogo, si bara la Asia kwa maana ya leo.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: waliinuka
  rationale: Inahifadhi taswira halisi ya kuinuka na, katika muktadha huu, inadokeza kuanza kwa upinzani bila kuongeza maelezo yasiyosemwa.
- source_word: δέ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye utofauti mdogo kutoka simulizi la huduma ya Stefano kwenda kwenye upinzani dhidi yake.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: baadhi ya watu kutoka katika sinagogi
  rationale: Inaonyesha kuwa walikuwa kundi lisilotajwa idadi yake kutoka miongoni mwa waliohusishwa na sinagogi hilo.
- source_word: συναγωγῆς τῆς λεγομένης
  choice: sinagogi lililoitwa
  rationale: Ni usemi wa kawaida unaotambulisha jina ambalo sinagogi hilo lilijulikana nalo.
- source_word: Λιβερτίνων
  choice: Watu Waliowekwa Huru
  rationale: Neno hili linawahusu watu waliokuwa wameachiliwa kutoka utumwani, au huenda wazao wao; tafsiri hii huepuka maana nyingine zisizohusika za jina la mkopo.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: watu kutoka Kurene na Aleksandria
  rationale: Majina haya ya wenyeji yametolewa kwa Kiswahili cha kawaida na kinachoeleweka kuliko kuunda majina magumu ya makundi.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: wengine kutoka Kilikia na Asia
  rationale: ἀπό inaonyesha mahali walikotoka; “wengine” huendeleza kwa uwazi orodha ya makundi bila kuamua kama yalikuwa sinagogi moja au zaidi.
- source_word: συζητοῦντες
  choice: kuanza kubishana na
  rationale: Katika muktadha wa upinzani, kitenzi kina maana ya mjadala wa kupingana, si mazungumzo yasiyoegemea upande wowote.
- source_word: τῷ Στεφάνῳ
  choice: na Stefano
  rationale: Dativi baada ya συζητέω huonyesha mtu waliyebishana naye.
theological_decisions:
- issue: Muundo wa makundi na idadi ya masinagogi
  choice: Kudumisha mtiririko wa orodha bila kutangaza wazi kuwa kulikuwa na sinagogi moja au mengi
  alternative: Kutafsiri kana kwamba makundi yote yalikuwa katika sinagogi moja, au kila kundi lilikuwa na sinagogi lake
  rationale: Sarufi ya Kigiriki inaweza kueleweka kwa namna zaidi ya moja kuhusu mpangilio wa makundi; tafsiri haipaswi kutatua kimya kimya jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Sinagogi” ni istilahi inayotambulika; “Watu Waliowekwa Huru” inaeleweka kwa msomaji wa kawaida. Muundo wa sentensi umefanywa wa asili kwa Kiswahili huku ukihifadhi orodha na utata wa kimuundo wa chanzo.
