  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: sw
  text: Katika siku hizo, wanafunzi walipokuwa wakiongezeka kwa idadi, malalamiko yakazuka kutoka kwa Wayahudi wa Kiyunani[a] dhidi ya Waebrania, kwa sababu wajane wao walikuwa wakipuuzwa[b] katika mgao wa kila siku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inaelekea Wayahudi wa Kiyunani walikuwa Wayahudi waliozungumza Kigiriki, tofauti na Waebrania, ambao inaelekea walizungumza Kiaramu au Kiebrania.
    reason: cultural_note
  - marker: b
    text: Au “walikuwa wakitelekezwa” katika huduma ya kila siku.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: Katika siku hizo
  rationale: Huhifadhi mazingira ya wakati na hutenda kama mpito wa kawaida wa simulizi bila kuongeza neno la wakati lisilokuwapo katika Kigiriki.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: wanafunzi walipokuwa wakiongezeka kwa idadi
  rationale: Muundo huu huonyesha hali ya nyuma iliyokuwa ikiendelea na kuweka wazi kwamba ongezeko lilikuwa la idadi.
- source_word: ἐγένετο γογγυσμός
  choice: malalamiko yakazuka
  rationale: Neno γογγυσμός linaweza kumaanisha kunung’unika au kulalamika; hapa malalamiko yana sababu maalumu, na ‘yakazuka’ huonyesha kuanza kwake.
- source_word: τῶν Ἑλληνιστῶν
  choice: Wayahudi wa Kiyunani
  rationale: Huwatambulisha kama kundi la Kiyahudi lenye uhusiano wa lugha na utamaduni wa Kigiriki bila kuwaita tu Wagiriki; tanbihi inaeleza maana inayowezekana.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: dhidi ya Waebrania
  rationale: ‘Dhidi ya’ huonyesha walengwa wa malalamiko na mvutano uliopo; ‘Waebrania’ huhifadhi jina la kundi lililotumiwa katika chanzo.
- source_word: παρεθεωροῦντο
  choice: walikuwa wakipuuzwa
  rationale: Huhifadhi hali ya kutendwa na tendo lililokuwa likiendelea, bila kudai kwa lazima kwamba kupuuzwa huko kulikuwa kwa makusudi.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: katika mgao wa kila siku
  rationale: Ingawa διακονία lina maana pana ya huduma, muktadha wa kuwahudumia wajane na mistari inayofuata unaunga mkono mgao wa mahitaji ya kimwili.
- source_word: αἱ χῆραι αὐτῶν
  choice: wajane wao
  rationale: Kiwakilishi kwa kawaida huwarejelea Wayahudi wa Kiyunani na huhifadhi uhusiano wa kijamii unaohusika katika malalamiko.
theological_decisions:
- issue: Utambulisho wa Ἑλληνισταί na Ἑβραῖοι
  choice: Wayahudi wa Kiyunani na Waebrania katika maandishi, pamoja na ufafanuzi katika tanbihi
  alternative: Wayahudi waliozungumza Kigiriki na Wayahudi waliozungumza Kiaramu au Kiebrania
  rationale: Majina ya makundi katika chanzo yanahifadhiwa ili kutofanya maana inayokisiwa kuwa ndiyo tafsiri pekee, huku tanbihi ikitoa maelezo ya kihistoria na kilugha yanayowezekana.
- issue: Kiwango cha makusudi katika παρεθεωροῦντο
  choice: walikuwa wakipuuzwa
  alternative: walikuwa wakitelekezwa
  rationale: Chanzo kinaonyesha kutotiliwa maanani kwa kuendelea, lakini hakisemi wazi kama tendo hilo lilikuwa la makusudi; uchaguzi huu hauongezi shtaka hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kisimulizi na inaeleweka kwa msomaji wa kawaida; majina ya makundi ya kihistoria yamehifadhiwa kwa kiasi kinachowezekana na kufafanuliwa katika tanbihi.
