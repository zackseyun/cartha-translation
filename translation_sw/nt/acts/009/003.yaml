  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: sw
  text: Alipokuwa akisafiri, ikawa kwamba alikuwa akikaribia Damasko; ghafla nuru kutoka mbinguni[a] ikamwangazia pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka angani.” Neno la Kigiriki οὐρανός linaweza kumaanisha “mbingu” au “anga,” ingawa katika muktadha huu “mbingu” huenda inaashiria chanzo cha nuru cha kimungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Alipokuwa akisafiri
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye kibainishi unaonyesha tendo lililokuwa likiendelea wakati mmoja na tukio kuu; Kiswahili hiki ni cha kawaida na huhifadhi maana ya “alipokuwa akisafiri.” δέ ni kiunganishi hafifu cha simulizi, hivyo hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: ἐγένετο
  choice: ikawa kwamba
  rationale: Huhifadhi alama ya kisimulizi inayotumiwa mara nyingi na Luka bila kufanya sentensi isiwe ya kawaida katika Kiswahili.
- source_word: αὐτὸν ἐγγίζειν
  choice: alikuwa akikaribia
  rationale: Huwakilisha kwa Kiswahili muundo wa mtendwa pamoja na kitenzi-jina baada ya ἐγένετο, na pia huhifadhi hali ya tendo linaloendelea katika ἐγγίζειν.
- source_word: τῇ Δαμασκῷ
  choice: Damasko
  rationale: Dativu hutaja mahali panapokaribiwa. Pamoja na “akikaribia,” Kiswahili hakihitaji kihusishi kingine.
- source_word: ἐξαίφνης τε
  choice: ghafla
  rationale: “Ghafla” huonyesha kutokea kusikotarajiwa; uhusiano hafifu unaoletwa na τε unatoshelezwa na mtiririko wa sentensi baada ya nukta-kituo.
- source_word: περιήστραψεν
  choice: ikamulika kumzunguka
  rationale: Hueleza nuru iliyomulika pande zote za mtu huyo, huku umbo la wakati uliopita likionyesha tukio la ghafla.
- source_word: φῶς
  choice: nuru
  rationale: “Nuru” ni neno la kawaida, lenye hadhi, na linalofaa kwa tukio hili la ufunuo.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Katika muktadha huu wa ufunuo, “mbinguni” huonyesha kwa kufaa chanzo cha juu chenye uzito wa kimungu, huku tanbihi ikihifadhi uwezekano wa maana ya anga.
theological_decisions:
- issue: Maana ya οὐρανός katika muktadha wa ufunuo
  choice: kutoka mbinguni
  alternative: kutoka angani
  rationale: Simulizi linaonyesha tukio la kukutana na ufunuo wa kimungu, kwa hiyo “mbinguni” ndiyo maana inayowezekana zaidi. Hata hivyo, οὐρανός pia inaweza kumaanisha anga, na uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ikawa kwamba” umehifadhi mtindo wa kisimulizi wa Luka, na “ikamulika kumzunguka” huwasilisha nuru ya ghafla iliyomzunguka bila kuongeza maelezo yasiyokuwamo katika matini.
