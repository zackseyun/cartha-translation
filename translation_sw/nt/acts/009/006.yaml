  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: sw
  text: Lakini inuka, ingia mjini, nawe utaambiwa unachopaswa kufanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi cha upinzani kinaonyesha kugeuka kutoka swali la Sauli kwenda kwenye amri; “Lakini” ni kifupi na cha kawaida katika Kiswahili.
- source_word: ἀνάστηθι
  choice: simama
  rationale: Amri hii inamtaka Sauli ainuke baada ya kuanguka chini; “simama” ni usemi wa kawaida na unaofaa katika muktadha huu.
- source_word: εἴσελθε
  choice: uingie
  rationale: Huhifadhi amri ya kuingia huku muundo wa Kiswahili ukitiririka kwa kawaida baada ya “simama.”
- source_word: εἰς τὴν πόλιν
  choice: mjini
  rationale: “Mjini” huwasilisha kwa kawaida mwendo wa kuingia katika mji unaojulikana katika muktadha.
- source_word: λαληθήσεταί σοι
  choice: utaambiwa
  rationale: Huhifadhi hali ya kutendwa na kutomtaja msemaji, kama ilivyo katika Kigiriki, kwa Kiswahili cha kawaida.
- source_word: ὅ τί
  choice: unacho-
  rationale: Muundo “unachopaswa kufanya” huwasilisha kwa njia ya kawaida maudhui yatakayosemwa.
- source_word: σε δεῖ ποιεῖν
  choice: unachopaswa kufanya
  rationale: “Paswa” huonyesha ulazima au wajibu wenye nguvu bila kutaja wazi chanzo chake kuliko maandishi yanavyofanya.
theological_decisions:
- issue: Nguvu ya δεῖ katika muktadha wa mwongozo wa Mungu
  choice: unachopaswa kufanya
  alternative: unachohitaji kufanya
  rationale: “Paswa” huhifadhi nguvu ya ulazima au wajibu, ambao mara nyingi huambatana na kusudi la Mungu katika Matendo, bila kufafanua kupita kiasi chanzo cha ulazima huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Hali ya kutendwa katika λαληθήσεταί σοι imehifadhiwa kwa “utaambiwa.” Hakuna tanbihi iliyoongezwa kwa sababu tafsiri ya Kiswahili inaweza kuhifadhi kwa uwazi muundo na maana kuu bila maelezo ya ziada.
