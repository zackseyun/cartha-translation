  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: sw
  text: Huko alimkuta mtu mmoja aitwaye Ainea, ambaye alikuwa amelala juu ya mkeka[a] kwa miaka minane; alikuwa amepooza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “godoro jepesi” au “kitanda kidogo.”
    reason: Neno κράβαττος linaweza kumaanisha mkeka, godoro jepesi, au kitanda rahisi cha kubebeka.
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: Huko alimkuta
  rationale: Kauli hii inaendeleza simulizi kwa kawaida; kiunganishi δέ hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili, na ἐκεῖ inaonyeshwa kwa “Huko.”
- source_word: ἄνθρωπόν τινα
  choice: mtu mmoja
  rationale: Huhifadhi kazi ya τις ya kumtambulisha mtu mahususi ambaye hajatajwa awali, kwa Kiswahili cha kawaida.
- source_word: ὀνόματι Αἰνέαν
  choice: aitwaye Ainea
  rationale: Ni uwasilishaji wa kawaida wa muundo wenye ὀνόματι; jina Αἰνέας limetoholewa kuwa Ainea kwa Kiswahili.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: kwa miaka minane
  rationale: Muundo huu unaonyesha muda ambao hali hiyo ilikuwa imeendelea.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: alikuwa amelala juu ya mkeka
  rationale: Huhifadhi picha halisi ya mtu aliyelala juu ya κράβαττος badala ya kuibadilisha kuwa dhana pana ya kuwa kitandani tu.
- source_word: ὃς ἦν παραλελυμένος
  choice: kwa sababu alikuwa amepooza
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba kupooza kwake ndiko kulikohusiana na kulala kwake kwa muda huo, bila kupunguza hali endelevu iliyoonyeshwa na perifrastiki ya Kigiriki.
