  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: sw
  text: Jambo hilo likajulikana katika Yopa yote, na watu wengi wakamwamini Bwana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: Habari hiyo ikajulikana
  rationale: Muundo usiotaja mtendaji unaonyesha kwamba jambo lililotangulia lilipata kujulikana. “Habari hiyo” hutoa rejeo la kawaida la Kiswahili bila kutaja ni nani aliyeieneza.
- source_word: δὲ
  choice: ika-
  rationale: δέ ni kiunganishi chepesi cha kuendeleza simulizi; mfululizo wa kitenzi wenye kiambishi “ika-” unaifanya sentensi kuwa ya asili katika Kiswahili.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: katika Yopa yote
  rationale: κατά pamoja na jenitivi inaonyesha kuenea katika eneo lote. “Katika Yopa yote” ni ya kawaida na inahifadhi wazo la ujumla wa ὅλης.
- source_word: Ἰόππης
  choice: Yopa
  rationale: “Yopa” ni umbo la kawaida la jina hili la mahali katika tafsiri za Biblia za Kiswahili.
- source_word: ἐπίστευσαν
  choice: wakamwamini
  rationale: Kitenzi “kuamini” pamoja na kiambishi cha yambwa kinawasilisha kwa njia ya asili tendo la kuweka imani katika mtu; wakati wa simulizi unaonyesha tukio la kuanza kuamini.
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Kwa kuwa kivumishi cha Kigiriki kimetumiwa kama nomino, “watu wengi” huweka wazi maana yake kwa Kiswahili cha kawaida bila kubadili wigo wake.
- source_word: ἐπὶ τὸν κύριον
  choice: wakamwamini Bwana
  rationale: Pamoja na πιστεύω, ἐπί na akusativi humtaja anayelengwa na imani au utegemezi. Muundo wa Kiswahili “kumwamini Bwana” ni wa asili na unahifadhi maana hiyo ya kibinafsi.
- source_word: κύριον
  choice: Bwana
  rationale: “Bwana” huhifadhi uzito wa heshima na wa kiteolojia wa κύριος katika Matendo; “mkuu” au “mwajiri” kungepunguza maana hiyo.
theological_decisions:
- issue: Ufasiri wa πιστεύω + ἐπὶ τὸν κύριον
  choice: wakamwamini Bwana
  alternative: wakaamini katika Bwana
  rationale: “Kumwamini Bwana” ni Kiswahili cha kawaida kwa kumtegemea au kuweka imani kwake, bila kuongeza ufafanuzi mwembamba wa kimadhehebu. Pia huonyesha wazi kuwa Bwana ndiye anayelengwa na imani.
- issue: Ufasiri wa κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ndilo neno la kawaida linalohifadhi hadhi ya cheo hiki na umuhimu wake wa kikristo katika muktadha wa Matendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa leo. Hakuna tanbihi inayohitajika kwa aya hii.
