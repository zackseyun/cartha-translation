  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: sw
  text: Akamnyooshea mkono, akamsimamisha.[a] Kisha akawaita watakatifu na wajane, akamweka mbele yao akiwa hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamwinua.” Kitenzi cha Kigiriki kinaweza kumaanisha kumfanya mtu ainuke au asimame; katika muktadha huu pia kina mwangwi wa lugha ya ufufuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: akampa mkono
  rationale: Huhifadhi picha ya Kigiriki ya kumpa au kumnyoshea mkono ili kumsaidia, kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: ἀνέστησεν
  choice: akamsimamisha
  rationale: Kitenzi kinaweza kumaanisha kumwinua au kumsimamisha mtu. Katika muktadha huu kinataja kitendo cha Petro cha kumsaidia Tabitha asimame baada ya kurudishwa hai, huku dokezo la lugha ya ufufuo likihifadhiwa katika tanbihi.
- source_word: φωνήσας
  choice: akawaita
  rationale: Huwasilisha kwa kawaida tendo la kuwaita au kuwakusanya watu waliotajwa kabla ya Petro kumweka Tabitha mbele yao.
- source_word: τοὺς ἁγίους
  choice: watakatifu
  rationale: Ni tafsiri ya moja kwa moja ya jina la kawaida la Agano Jipya kwa watu wa Mungu; huepuka tafsiri pana zaidi ya 'waumini'.
- source_word: τὰς χήρας
  choice: wajane
  rationale: Tafsiri ya moja kwa moja inayodumisha kutajwa kwao kama kundi tofauti na muhimu katika muktadha.
- source_word: παρέστησεν
  choice: akamweka mbele yao
  rationale: Hueleza maana ya kumleta na kumwasilisha mtu mbele ya wengine kwa Kiswahili cha asili kuliko kutumia 'akawasilisha,' ambalo linaweza kusikika kama kuwasilisha kitu au taarifa.
- source_word: ζῶσαν
  choice: akiwa hai
  rationale: 'Kirai hiki kinatumika kiarifu: Petro alimweka mbele yao katika hali ya kuwa hai. Ni cha kawaida na chenye nguvu katika muktadha huu.'
theological_decisions:
- issue: Tafsiri ya ἀνέστησεν yenye mwangwi wa ufufuo
  choice: akamsimamisha
  alternative: akamwinua
  rationale: Muktadha uliotangulia tayari unaonyesha kwamba Tabitha amerudishwa hai. 'Akamsimamisha' hutaja kwa usahihi kitendo cha kumsaidia kusimama bila kudai kwamba kitendo cha kumpa mkono ndicho kilichomfufua; tanbihi huhifadhi upana wa kitenzi na mwangwi wake wa lugha ya ufufuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa matukio umewekwa wazi kwa 'Kisha' na 'Halafu,' na tofauti kati ya watakatifu na wajane imehifadhiwa.
