  text: For I will show him how much he must suffer for my name[a].
translation:
  language: sw
  text: Kwa maana mimi nitamwonyesha kiasi gani inampasa kuteseka kwa ajili ya jina langu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya jina langu.”
