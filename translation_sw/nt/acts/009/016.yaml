lexical_decisions:
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi cha nafsi kimetajwa wazi katika Kigiriki kwa mkazo; kimehifadhiwa ingawa kitenzi cha Kiswahili tayari kinaonyesha nafsi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa kauli hii inatoa msingi au maelezo ya kauli iliyotangulia; ‘Kwa maana’ huhifadhi uhusiano huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὑποδείξω
  choice: nitamwonyesha
  rationale: Kitenzi hiki humaanisha kuonyesha, kubainisha, au kufanya jambo lijulikane. ‘Nitamwonyesha’ ni cha moja kwa moja na hujumuisha αὐτῷ kama mtendewa.
- source_word: ὅσα
  choice: jinsi
  rationale: Pamoja na δεῖ na kitenzi-jina, neno hili linaeleza ukubwa au kiwango cha mateso. Muundo ‘jinsi ilivyo lazima ateseke’ ni wa asili katika Kiswahili bila kulazimisha orodha ya mambo mahususi.
- source_word: δεῖ
  choice: ilivyo lazima
  rationale: Huwasilisha ulazima bila kufafanua moja kwa moja kama ni agizo, kusudi la Mungu, au hatima. Tafsiri hii huhifadhi nguvu na mvutano wa kauli ya Kigiriki.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Katika muundo huu huonyesha sababu, manufaa, au kujitoa kwa upande wa jina la Yesu. ‘Kwa ajili ya’ ni pana na ya kawaida; maana ya ‘kwa niaba ya’ imeonyeshwa katika tanbihi.
- source_word: τοῦ ὀνόματός μου
  choice: jina langu
  rationale: ‘Jina’ limehifadhiwa kwa kuwa linaweza kurejelea mtu mwenyewe, mamlaka yake, na kumkiri hadharani, bila kufupishwa kuwa dhana moja tu.
- source_word: παθεῖν
  choice: ateseke
  rationale: Kitenzi πάσχω humaanisha kupata au kuvumilia mateso; ‘ateseke’ ni tafsiri wazi na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Aina ya ulazima unaoonyeshwa na δεῖ
  choice: ilivyo lazima
  alternative: alivyopangiwa
  rationale: Kigiriki kinathibitisha ulazima lakini hakielezi wazi katika mstari huu ikiwa ni hatima iliyowekwa, uteuzi maalumu, au ulazima wa kimajaliwa. ‘Ilivyo lazima’ huhifadhi mvutano huo bila kuingiza msimamo wenye nguvu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiwakilishi ‘mimi’ kimehifadhiwa kwa mkazo wa ἐγώ. Muundo umechaguliwa kuwa rahisi kueleweka huku ukidumisha ‘jina langu’ na kutofafanua kupita kiasi chanzo au aina ya ulazima.
