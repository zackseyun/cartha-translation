  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: sw
  text: Alipofika Yerusalemu, alikuwa akijaribu kujiunga na wanafunzi[a], lakini wote walimwogopa, kwa kuwa hawakuamini kwamba yeye ni mwanafunzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujishikamanisha na wanafunzi.”
    reason: Neno la Kigiriki linaweza kusisitiza kushikamana au kuambatana kwa karibu, si tu kujiunga.
lexical_decisions:
- source_word: Παραγενόμενος
  choice: Alipofika
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha hali iliyotangulia tendo kuu. ‘Alipofika’ ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa wakati.
- source_word: δὲ
  choice: —
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa upole; hakijahitaji neno tofauti katika Kiswahili kwa sababu mwanzo wa ‘Alipofika’ unaendeleza simulizi kwa ufasaha bila kuongeza mkazo usiokuwapo.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Pamoja na ‘alipofika,’ jina la mji linaonyesha kikomo cha mwendo kwa kawaida bila kuhitaji kihusishi tofauti.
- source_word: ἐπείραζεν
  choice: alijaribu
  rationale: Wakati usiotimilifu unaonyesha jaribio lililokuwa likifanywa. ‘Alijaribu’ hutoa maana hiyo kwa Kiswahili cha kawaida bila kudokeza majaribu ya dhambi.
- source_word: κολλᾶσθαι
  choice: kujiunga na
  rationale: Katika muktadha huu wa kijamii, neno lina maana ya kujishikamanisha au kuambatana kwa karibu. ‘Kujiunga na’ linaeleza jitihada ya Sauli kukubaliwa miongoni mwa wanafunzi bila kuingiza wazo la uanachama rasmi wa taasisi.
- source_word: τοῖς μαθηταῖς
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na sahihi katika Matendo kwa wafuasi na wajifunzaji wa Yesu.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: lakini wote walimwogopa
  rationale: Ingawa καί kwa kawaida ni ‘na,’ hapa hatua inayofuata inatofautiana na jaribio la Sauli. ‘Lakini’ huonyesha tofauti hiyo kwa kawaida, na ‘wote’ hurejelea wanafunzi.
- source_word: μὴ πιστεύοντες
  choice: kwa kuwa hawakuamini
  rationale: Kitenzi kishirikishi chenye μή kinaeleza sababu ya hofu yao. Muundo wa kisababishi ni wa wazi na wa kawaida katika Kiswahili.
- source_word: ὅτι ἐστὶν μαθητής
  choice: kwamba alikuwa mwanafunzi
  rationale: Ingawa Kigiriki kina wakati wa sasa, Kiswahili cha simulizi hutumia kwa kawaida wakati uliopita katika taarifa tegemezi baada ya vitenzi vya wakati uliopita; maana haibadilishwi.
theological_decisions:
- issue: Aina ya uhusiano ambao Sauli alitaka kuwa nao na waumini wa Yerusalemu
  choice: kujiunga na wanafunzi
  alternative: kujishikamanisha na wanafunzi; kuambatana na wanafunzi
  rationale: Andiko linaeleza juhudi ya Sauli kukubaliwa na kushirikiana na wanafunzi, si ibada rasmi wala uanachama wa kitaasisi. Tafsiri hii inadumisha maana ya kijamii bila kuingiza miundo ya kanisa ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni wa kisimulizi na unaepuka lugha ya kitaasisi isiyodokezwa na chanzo.
