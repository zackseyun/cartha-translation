  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: sw
  text: Lakini Sauli akainuka kutoka ardhini. Ingawa macho yake yalikuwa yamefunguka, hakuona chochote. Basi wakamwongoza kwa mkono, wakamwingiza mjini Damasko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: aliinuka
  rationale: 'Katika muktadha huu kitenzi kimetumika kwa maana isiyoelekezwa kwa kitu: Sauli aliinuka kutoka mahali alipoanguka. ‘Aliinuka’ ni Kiswahili cha kawaida na chenye hadhi.'
- source_word: ἀπὸ τῆς γῆς
  choice: kutoka chini
  rationale: Hapa γῆ ni sehemu ya chini aliyokuwa ameangukia, si dunia kwa maana pana wala nchi. ‘Kutoka chini’ ni usemi wa asili katika Kiswahili.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: Ingawa macho yake yalikuwa yamefunguka
  rationale: 'Kauli hii inaonyesha hali iliyoambatana na tendo na, katika muktadha, mkazo wa kinyume: macho yalikuwa yamefunguka lakini hakuweza kuona.'
- source_word: οὐδὲν ἔβλεπεν
  choice: hakuona kitu chochote
  rationale: Tafsiri hii inaonyesha kutokuona kabisa na inabaki karibu na muundo wa Kigiriki huku ikiwa ya kawaida katika Kiswahili.
- source_word: χειραγωγοῦντες
  choice: wakamshika mkono, wakamwongoza
  rationale: Kitenzi kinamaanisha kumwongoza mtu kwa mkono. Usemi huu unaweka wazi picha halisi kwa Kiswahili cha kawaida bila kudokeza kwamba walimkokota.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: mpaka ndani ya Damasko
  rationale: Pamoja na ‘wakamwongoza,’ usemi huu unaonyesha kuingia katika mji na kuepuka kurudia vitenzi vyenye maana ileile.
- source_word: δὲ
  choice: Lakini / Basi
  rationale: Viunganishi hivi vinaonyesha mpito wa simulizi, tofauti ndogo, na matokeo kwa mtiririko wa kawaida wa Kiswahili; si lazima kila δέ itafsiriwe kwa neno lilelile.
- source_word: Σαῦλος
  choice: Sauli
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: Δαμασκόν
  choice: Damasko
  rationale: Jina la mahali limetolewa kwa umbo la kawaida la Kiswahili.
