lexical_decisions:
- source_word: εὐθέως
  choice: Mara hiyo
  rationale: Huonyesha tendo lililofanyika bila kukawia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: katika masinagogi
  rationale: Inahifadhi maana ya mahali pamoja na wingi wa neno la Kigiriki.
- source_word: ἐκήρυσσεν
  choice: akaanza kumtangaza
  rationale: Kitenzi κηρύσσω kina maana ya kutangaza hadharani. Muundo huu unaeleza kwa kawaida mwanzo wa shughuli hiyo katika muktadha, ingawa hali ya kitenzi cha Kigiriki pia inaweza kueleweka kuwa tendo lililoendelea.
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Yesu amebaki kuwa yambwa ya moja kwa moja ya kitenzi, bila kuongeza ‘habari za’.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha maudhui ya tangazo la Sauli kwa njia ya kawaida katika Kiswahili.
- source_word: οὗτός
  choice: yeye ndiye
  rationale: Muundo huu wa Kiswahili unaonyesha msisitizo wa utambulisho uliomo katika kiwakilishi cha kuonyesha, huku ukirejelea Yesu kwa uwazi na kwa lugha ya kawaida.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na inayotambulika ya cheo hiki cha Kikristo, bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Cheo cha Kristo katika tangazo la Sauli
  choice: Mwana wa Mungu
  alternative: Mwana wa Mungu huyo / mwana wa Mungu
  rationale: Herufi kubwa zinaonyesha kuwa kifungu hiki kinatumika kama cheo maalumu cha Yesu, huku maana ya Kigiriki ‘ὁ υἱὸς τοῦ θεοῦ’ ikihifadhiwa bila kupunguzwa au kupanuliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Masinagogi’ huhifadhi mazingira mahususi ya Kiyahudi. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti za kimsamiati zinaweza kuwakilishwa vizuri katika matini yenyewe.
