  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: sw
  text: akamwomba barua kwa masinagogi ya Damasko, ili, akiwakuta watu wowote wa Njia, wanaume na wanawake, awapeleke Yerusalemu wakiwa wamefungwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: akamwomba
  rationale: Kitenzi pamoja na παρά + jenitivi humaanisha kumwomba mtu jambo; umbo hili ni la asili katika Kiswahili, huku kitu kilichoombwa kikitajwa mara moja baada yake.
- source_word: ἐπιστολὰς
  choice: barua
  rationale: Neno hili humaanisha barua; muktadha unaonyesha zilikuwa na kusudi la kiutawala, lakini tafsiri haiongezi wazo la mamlaka ambalo halijaelezwa moja kwa moja.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: kwa ajili ya masinagogi ya Damasko
  rationale: Virai viwili vya Kiyunani vinaelekeza barua kwa masinagogi yaliyoko Damasko. Kiswahili hiki ni wazi na hakirudii vihusishi kwa namna isiyo ya kawaida.
- source_word: ὅπως ἐάν
  choice: ili akiwakuta
  rationale: “Ili” huhifadhi kusudi, na “aki-” huhifadhi hali ya uwezekano au sharti inayotolewa na ἐάν pamoja na subjunktivi.
- source_word: τινας
  choice: watu wowote
  rationale: Katika tungo ya sharti, usemi huu huonyesha watu wowote ambao huenda wangepatikana.
- source_word: τῆς ὁδοῦ ὄντας
  choice: walio wa Njia
  rationale: Tafsiri hii huhifadhi muundo wa uhusiano wa Kiyunani na jina la kihistoria “Njia” bila kulipanua moja kwa moja kuwa “wafuasi.”
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: wanaume kwa wanawake
  rationale: Usemi huu wa kawaida huhifadhi kutajwa wazi kwa makundi yote mawili na kusisitiza ukubwa wa msako.
- source_word: δεδεμένους
  choice: wakiwa wamefungwa
  rationale: Huhifadhi hali inayotokana na tendo lililokamilika la kuwafunga, bila kuongeza kwamba walifungwa kwa minyororo.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: awalete Yerusalemu
  rationale: ἄγω hapa inaeleza kuwapeleka au kuwaleta watu hadi mahali palipotajwa; “awalete Yerusalemu” ni Kiswahili cha kawaida katika mtazamo wa simulizi.
theological_decisions:
- issue: Maana ya τῆς ὁδοῦ kama jina la jumuiya ya kwanza ya Kikristo
  choice: Njia
  alternative: wafuasi wa Njia
  rationale: Kuhifadhi “Njia” kama jina kunatunza istilahi ya kihistoria na utata wake, badala ya kuigeuza kimya kimya kuwa maelezo ya ufuasi.
- issue: Kutajwa kwa ἄνδρας τε καὶ γυναῖκας
  choice: wanaume kwa wanawake
  alternative: watu
  rationale: Kiyunani kinataja makundi yote mawili waziwazi; tafsiri inalinda msisitizo huo badala ya kutumia jina la jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Masinagogi” na “Njia” zimetumiwa kama istilahi za kihistoria; herufi kubwa katika “Njia” inaonyesha kuwa hapa ni jina la harakati.
