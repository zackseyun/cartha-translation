  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: sw
  text: Alikuwa akinena na kujadiliana na Wayahudi wanaozungumza Kigiriki[a], lakini wao walikuwa wakijaribu kumuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wahelenisti,” yaani Wayahudi wanaozungumza Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: alikuwa akizungumza
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea au kurudiwa; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: τε καὶ
  choice: na
  rationale: Inaunganisha vitenzi viwili vinavyoratibiwa; “na” ni ya asili na haitoi uzito usiohitajika.
- source_word: συνεζήτει
  choice: kujadiliana
  rationale: Kitenzi hiki hapa kinaashiria majadiliano yenye kupingana, si mazungumzo ya kawaida tu; “kujadiliana” ni fasaha bila kuongeza ukali usio lazima.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: na Wayahudi wenye kusema Kigiriki
  rationale: πρός pamoja na kitenzi cha majadiliano huonyesha kushirikiana ana kwa ana; katika Matendo, Ἑλληνισταί inaelekea kumaanisha Wayahudi waliotumia Kigiriki.
- source_word: οἱ δὲ
  choice: lakini wao
  rationale: δέ inaleta ugeuko wa tofauti kati ya majadiliano ya Sauli na mwitikio wao wa uadui.
- source_word: ἐπεχείρουν
  choice: walikuwa wakijaribu
  rationale: Wakati usiotimilika unaonyesha jitihada iliyoendelea au iliyorudiwa, badala ya tukio moja tu.
- source_word: ἀνελεῖν αὐτόν
  choice: kumuua
  rationale: Katika muktadha huu ἀναιρέω humaanisha kuua; hili ndilo neno la moja kwa moja na la kawaida katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa Ἑλληνιστάς
  choice: Wayahudi wenye kusema Kigiriki
  alternative: Wahelene; watu wenye kusema Kigiriki
  rationale: Matumizi ya neno hili katika Matendo, hasa 6:1, yanaonyesha kundi la Wayahudi waliotumia Kigiriki, si watu wa Mataifa kwa ujumla. Tafsiri ya wazi inazuia mkanganyiko, huku tanbihi ikihifadhi istilahi mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “alikuwa akizungumza ... walikuwa wakijaribu” unahifadhi hali endelevu ya vitenzi vya Kigiriki. “Wayahudi wenye kusema Kigiriki” ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi pekee “Wahelene.”
