base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: sw
  text: Watu wote waliokuwa wakiishi Lida na Sharoni[a] walimwona, nao wakamgeukia Bwana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “eneo la Sharoni” au “uwanda wa Sharoni.”
    reason: lexical_alternative
  - marker: b
    text: “Wakamgeukia Bwana” pia inaweza kutafsiriwa “wakamrudia Bwana” au, kwa tafsiri yenye ufafanuzi zaidi, “wakaongoka na kumwelekea Bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: walimwona
  rationale: Kitenzi hiki hapa kinaeleza kuona kwa macho; wakazi walimwona Enea baada ya kuponywa. Kiambishi cha yambwa “-m-” kinadumisha rejeo la αὐτόν.
- source_word: πάντες οἱ κατοικοῦντες
  choice: Watu wote waliokuwa wakiishi
  rationale: Kirai hiki kinawakilisha kwa Kiswahili cha kawaida watu wote waliokaa katika maeneo yaliyotajwa, huku kikihifadhi maana ya hali ya kuwa wakazi.
- source_word: Λύδδα
  choice: Lida
  rationale: Umbo hili la jina la mahali linafuata uhawilishaji wa kawaida na unaosomeka kwa Kiswahili.
- source_word: τὸν Σαρῶνα
  choice: Sharoni
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili. Kihusishi “na” pamoja na muktadha kinaonyesha kuwa ni eneo, bila kuongeza neno lisilosemwa wazi katika Kigiriki.
- source_word: οἵτινες
  choice: nao
  rationale: “Nao” linaendeleza simulizi kwa kurejelea wakazi wote waliotajwa, kwa mtiririko wa asili wa Kiswahili bila kulazimisha uzito maalumu katika kiwakilishi cha Kigiriki.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: wakamgeukia Bwana
  rationale: “Kumgeukia” linahifadhi picha na maana ya kuelekeza moyo na maisha kwa Bwana, bila kulazimisha maana ya kwamba walikuwa wamemwacha hapo awali au kutumia istilahi nzito zaidi ya kimafundisho.
- source_word: κύριον
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya cheo κύριος. Muktadha unaelekeza kwa Yesu aliyefufuka, lakini tafsiri haiongezi jina ambalo halipo katika mstari huu.
theological_decisions:
- issue: Rejeo la “Bwana”
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Muktadha wa Matendo 9 unaashiria kwa nguvu kwamba anayerejelewa ni Yesu, lakini Kigiriki kinasema tu τὸν κύριον; kwa hiyo maandishi makuu yanahifadhi cheo hicho bila kukipanua.
- issue: Maana ya ἐπέστρεψαν
  choice: wakamgeukia
  alternative: wakaongoka na kumwelekea; wakamrudia
  rationale: “Wakamgeukia” linaonyesha itikio la toba na imani bila kuamua kimya-kimya kwamba walikuwa waasi waliomrudia Bwana, wala kuingiza istilahi ya kimafundisho iliyo fasiri zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “nao” kuendeleza simulizi kwa urahisi, huku “wakamgeukia Bwana” ikidumisha nahau ya chanzo na mvutano wake wa kitheolojia.
