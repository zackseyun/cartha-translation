  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: sw
  text: Ndugu walipojua jambo hilo[a], wakamshusha mpaka Kaisaria, kisha wakamtuma Tarso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike.” Kigiriki hutumia neno “ndugu” katika umbo la kiume, lakini katika muktadha huu linaweza kuirejelea jumuiya pana ya waamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: walipopata habari hiyo
  rationale: Kitenzi hiki hapa kinaonyesha kwamba ndugu walipata kujua jambo lililotajwa katika mstari uliotangulia. Neno “hiyo” linaweka wazi kiwakilishi kilichoachwa kudokezwa katika Kigiriki.
- source_word: οἱ ἀδελφοὶ
  choice: Ndugu
  rationale: Huhifadhi umbo la Kigiriki la wingi wa kiume kwa lugha ya kawaida ya Kikristo; katika muktadha linaweza pia kumaanisha jumuiya pana ya waamini, jambo linaloelezwa katika tanbihi.
- source_word: κατήγαγον
  choice: wakampeleka chini mpaka
  rationale: Huhifadhi maana ya mwendo wa kushuka, yaelekea kutoka Yerusalemu kuelekea Kaisaria pwani, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: Καισάρειαν
  choice: Kaisaria
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali Caesarea.
- source_word: ἐξαπέστειλαν
  choice: wakamsafirisha kwenda
  rationale: Katika muktadha wa safari ya kutoka Kaisaria hadi Tarso, usemi huu unaonyesha kumtuma aendelee na safari, bila kutumia lugha nzito isiyo ya kawaida.
- source_word: Ταρσόν
  choice: Tarso
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mji Tarsus.
theological_decisions:
- issue: Maana ya ἀδελφοί katika jumuiya ambayo huenda ilikuwa na wanaume na wanawake
  choice: Ndugu
  alternative: ndugu wa kiume na wa kike; waamini wenzao
  rationale: Neno kuu linahifadhi umbo la Kigiriki bila kuamua kimya kwamba walengwa ni wanaume pekee au jumuiya yote. Tanbihi inaonyesha uwezekano wa maana pana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umefanywa uwe wa kawaida kwa kutumia “walipo-” na mfuatano wa “waka-”; “chini” huhifadhi mwelekeo wa kijiografia wa kitenzi cha Kigiriki.
