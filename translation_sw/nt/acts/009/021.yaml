id: ACT.9.21
reference: Acts 9:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: sw
  text: Wote waliomsikia walishangaa sana na kusema, “Je, huyu si ndiye aliyewafanyia uharibifu huko Yerusalemu wale wanaoliitia jina hili[a]? Je, hakuwa amekuja hapa kwa kusudi hili—awapeleke wakiwa wamefungwa kwa makuhani wakuu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaoliomba jina hili.” Usemi “kuliitia jina” ni nahau ya kibiblia inayoweza kumaanisha kumwomba au kumkiri mwenye jina hilo; hapa jina hilo linamrejelea Yesu.
    reason: lexical_alternative
  - marker: b
    text: Hawa ni mamlaka za kikuhani wa ngazi ya juu; wingi huu haumaanishi kwamba wote walikuwa na cheo kimoja cha kuhani mkuu kwa wakati mmoja.
    reason: historical_clarity
lexical_decisions:
- source_word: ἐξίσταντο
  choice: walishangaa sana
  rationale: Huwasilisha mshangao mkubwa na unaoendelea kwa Kiswahili cha kawaida bila kutumia msemo usio wazi.
- source_word: πάντες οἱ ἀκούοντες
  choice: wote waliomsikia
  rationale: Kiwakilishi cha yambwa kinachodokezwa na muktadha kimewekwa wazi kwa njia ya kawaida katika Kiswahili.
- source_word: πορθήσας
  choice: aliyewaangamiza
  rationale: Kitenzi hiki ni kikali kuliko ‘aliyewatesa’ na hudokeza kuharibu au kufanya uharibifu mkubwa, bila kuongeza maelezo yasiyomo.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: wale wanaoliitia jina hili
  rationale: ‘Kuliitia jina’ huhifadhi nahau ya kibiblia ya kumwomba, kumkiri, au kumtegemea mwenye jina hilo.
- source_word: τὸ ὄνομα τοῦτο
  choice: jina hili
  rationale: Huhifadhi rejeo lisilotajwa moja kwa moja katika Kigiriki badala ya kulipanua kuwa ‘jina la Yesu’ katika matini.
- source_word: εἰς τοῦτο
  choice: kwa kusudi hili
  rationale: Ni usemi wa asili unaoonyesha lengo lililokusudiwa.
- source_word: ἐληλύθει
  choice: alikuwa amekuja
  rationale: 'Huhifadhi maana ya wakati timilifu uliopita: kuja kwake kulitangulia maneno ya wasemaji.'
- source_word: δεδεμένους
  choice: wakiwa wamefungwa
  rationale: Hueleza hali yao ya kuwa wamefungwa bila kudai hasa kwamba walikuwa katika minyororo.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: awapeleke ... kwa viongozi wa makuhani
  rationale: ‘Awapeleke’ ni ya asili kwa ἀγάγῃ, na ‘kwa’ huonyesha kuwapeleka kwa mamlaka hao bila kulazimisha maana ya mahali pekee.
- source_word: ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Katika wingi, neno hili hurejelea mamlaka ya kikuhani ya ngazi ya juu, si makuhani wakuu wengi wanaoshikilia cheo kimoja kwa wakati mmoja.
theological_decisions:
- issue: Iwapo ‘jina hili’ lielezwe wazi kuwa ‘jina la Yesu’
  choice: Kuhifadhi ‘jina hili’ katika matini
  alternative: jina la Yesu
  rationale: Kigiriki huacha mwenye jina akieleweka kutokana na muktadha; kuhifadhi usemi huo hudumisha nguvu yake ya masimulizi na ya kitheolojia.
- issue: Nguvu ya πορθήσας katika kueleza matendo ya awali ya Sauli
  choice: aliyewaangamiza
  alternative: aliyewatesa
  rationale: Neno la chanzo ni kali kuliko usemi wa jumla wa mateso; tafsiri kali huepuka kupunguza uzito wa mashambulizi yake.
- issue: Aina ya sentensi katika swali la pili
  choice: Je, hakuwa amekuja hapa kwa kusudi hili—awapeleke...?”
  alternative: Naye alikuwa amekuja hapa kwa kusudi hili—kuwapeleka...
  rationale: Muktadha na muundo wa swali unaoanza na Οὐχ unaweza kuhusisha pia kishazi cha pili; Kiswahili hiki huhifadhi matarajio ya jibu la kukubali bila kuligeuza kuwa taarifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali mawili umehifadhiwa, na istilahi zisizo za kawaida zimeepukwa isipokuwa nahau ya kibiblia ‘kuliitia jina,’ ambayo imefafanuliwa katika tanbihi.
