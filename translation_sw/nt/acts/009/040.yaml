id: ACT.9.40
reference: Acts 9:40
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: sw
  text: Lakini Petro akawatoa wote nje, akapiga magoti na kusali. Kisha akaugeukia mwili, akasema, “Tabitha, inuka.” Naye akafumbua macho yake, na alipomwona Petro, akaketi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκβαλὼν ἔξω πάντας
  choice: akawatoa wote nje
  rationale: Kitenzi pamoja na ἔξω na πάντας kinaonyesha kwamba Petro aliwaondoa wote waliokuwapo; ‘akawatoa wote nje’ ni Kiswahili cha kawaida kisichoongeza wazo la kutumia nguvu.
- source_word: θεὶς τὰ γόνατα
  choice: akapiga magoti
  rationale: Hii ni nahau ya kupiga magoti, hapa kwa kusali; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: προσηύξατο
  choice: kusali
  rationale: ‘Kusali’ ni tafsiri ya kawaida ya προσεύχομαι na inafaa katika muktadha huu.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: akaugeukia mwili
  rationale: Inahifadhi tendo la Petro kugeuka na kuelekea mwili; ‘mwili’ hufuata σῶμα bila kuongeza neno lenye mkazo zaidi kama ‘maiti’.
- source_word: Ταβιθά
  choice: Tabitha
  rationale: Jina limenukuliwa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἀνάστηθι
  choice: inuka
  rationale: ‘Inuka’ ni amri ya moja kwa moja na ya asili katika Kiswahili, na inaweza kumaanisha kuinuka kutoka hali ya kulala au kukaa; katika muktadha huu inabeba pia uzito wa kurudishwa kwenye uhai bila kuongeza ufafanuzi.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: akafumbua macho yake
  rationale: ‘Kufumbua macho’ ni usemi wa asili wa Kiswahili unaowakilisha tendo la kufungua macho.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: alipomwona Petro
  rationale: Kishiriki kimetafsiriwa kama kishazi cha wakati ili kudumisha mtiririko na mfuatano wa matukio katika Kiswahili.
- source_word: ἀνεκάθισεν
  choice: akaketi
  rationale: Kitenzi kinaonyesha kuketi kutoka hali ya kulala; ‘akaketi’ ni wazi katika muktadha, bila kuongeza maana ya ‘tena’ ambayo si lazima.
- source_word: δὲ / καί
  choice: Lakini / Kisha / Naye / na
  rationale: 'Viunganishi vimetofautishwa kulingana na kazi yake katika simulizi: ‘Lakini’ huunganisha na tukio lililotangulia, ‘Kisha’ huendeleza mfuatano, na ‘Naye’ humrejesha Tabitha kama mhusika.'
theological_decisions:
- issue: Lugha ya amri katika tukio la kurudishwa kwenye uhai
  choice: inuka
  alternative: simama; amka
  rationale: ἀνάστηθι inaweza kuonyesha kuinuka au kusimama. ‘Inuka’ huhifadhi upana huo na uzito wa tukio, huku ‘amka’ ikiweza kuelekeza zaidi kwenye usingizi na ‘simama’ ikidokeza wazi kuwa atasimama kwa miguu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi vya mfululizo umetumiwa kuwasilisha mwendo wa simulizi kwa urahisi. Hakuna tanbihi iliyoongezwa kwa sababu ‘inuka’ huhifadhi vizuri wigo wa ἀνάστηθι katika Kiswahili bila kuhitaji mbadala wa lazima.
