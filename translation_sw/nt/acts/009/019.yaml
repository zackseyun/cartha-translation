  text: καὶ λαβὼν τροφὴν ⸀ἐνίσχυσεν. Ἐγένετο ⸀δὲ μετὰ τῶν ἐν Δαμασκῷ μαθητῶν ἡμέρας τινὰς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/019.yaml
  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: sw
  text: Baada ya kula chakula, alipata nguvu tena.[a] Naye alikuwa pamoja na wanafunzi waliokuwa Damasko kwa siku kadhaa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliimarika.”
    reason: Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa namna inayosisitiza hali ya kupata nguvu, bila kutaja wazi anayesababisha hali hiyo.
  - marker: b
    text: Kigiriki hakitaji idadi kamili ya siku.
    reason: Kirai ἡμέρας τινάς huonyesha kipindi kisichobainishwa.
lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: Baada ya kula chakula
  rationale: Kirai hiki cha Kigiriki kinaonyesha kwamba Sauli alipokea na kula chakula kabla ya kupata nguvu. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mfuatano wa matukio.
- source_word: ἐνίσχυσεν
  choice: alipata nguvu tena
  rationale: Katika muktadha wa Sauli aliyekuwa hajala kwa siku tatu, kitenzi kinaonyesha kurejea kwa nguvu. Neno “tena” linaeleza kwa kawaida matokeo hayo bila kubadili maana kuwa tendo la mtu mwingine.
- source_word: Ἐγένετο δὲ
  choice: Naye alikuwa
  rationale: Hapa ἐγένετο δὲ ni kiunganishi cha simulizi kinachoingiza hali iliyofuata; “Naye alikuwa” ni ya asili na haikazii isivyofaa wazo la tukio kutokea.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: pamoja na wanafunzi waliokuwa Damasko
  rationale: μετά pamoja na uhusika milikishi huonyesha ushirika, na kirai ἐν Δαμασκῷ hutaja mahali wanafunzi hao walipokuwa.
- source_word: ἡμέρας τινάς
  choice: kwa siku kadhaa
  rationale: Uhusika wa kushutumu hapa huonyesha muda. “Siku kadhaa” huhifadhi kutotajwa kwa idadi kamili wala kulazimisha muda maalumu.
theological_decisions: []
