lexical_decisions:
- source_word: εὐθέως
  choice: Mara hiyo
  rationale: Inaonyesha kwamba jambo hilo lilitokea bila kuchelewa, kwa Kiswahili cha kawaida na cha simulizi.
- source_word: ἀπέπεσαν
  choice: kikaanguka kutoka
  rationale: Kitenzi kina maana ya kuanguka na kujitenga na mahali kilipokuwa; kirai hiki ni cha asili kwa Kiswahili katika muktadha huu.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: kutoka machoni pake
  rationale: Ni usemi wa kawaida unaowasilisha kwa usahihi uhusiano wa kitu hicho na macho ya Sauli.
- source_word: ὡς λεπίδες
  choice: kitu kama magamba
  rationale: Neno ὡς linaonyesha mlinganisho, si kwamba vitu hivyo vilikuwa magamba halisi; 'kitu kama' huhifadhi hali hiyo huku 'magamba' yakidumisha taswira halisi ya λεπίδες.
- source_word: ἀνέβλεψεν
  choice: akaweza kuona tena
  rationale: Katika muktadha wa kuponywa upofu, kitenzi hiki humaanisha kurudishiwa uwezo wa kuona, wala si kutazama juu tu.
- source_word: τε καὶ
  choice: naye ... Kisha
  rationale: Viunganishi hivi vinaunganisha matendo yanayofuatana; muundo huu unatoa mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Kivumishi-tendo cha wakati uliopita kinaonyesha tendo lililofuata; 'akasimama' ni wazi na cha kawaida katika mfuatano huu.
- source_word: ἐβαπτίσθη
  choice: akabatizwa
  rationale: Huhifadhi kauli tendwa na maana ya kawaida ya βαπτίζω bila kuingiza msimamo wa kimadhehebu kuhusu namna ya ubatizo.
theological_decisions:
- issue: Kutafsiri βαπτίζω kwa uaminifu bila kupendelea namna fulani ya ubatizo
  choice: akabatizwa
  alternative: akazamishwa
  rationale: Aya inataja tendo la ubatizo bila kueleza namna ulivyofanywa. 'Akabatizwa' ni tafsiri iliyo wazi na isiyoegemea dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi unatumia vitenzi vya mfululizo kwa mtiririko wa asili.
