language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: sw
  text: Basi Anania akaenda, akaingia ndani ya nyumba, akamwekea mikono juu yake, akasema, “Ndugu Sauli, Bwana Yesu, aliyekutokea njiani ulipokuwa ukija[a], amenituma ili uone tena[b] na ujazwe Roho Mtakatifu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njiani ulipokuwa ukisafiri.”
    reason: Kitenzi ἤρχου kinaweza kuelezwa kwa upana kama kusafiri, ingawa katika simulizi Sauli alikuwa akija kuelekea Damasko.
  - marker: b
    text: Au, “ili urudishiwe uwezo wa kuona.”
    reason: ἀναβλέψῃς katika muktadha huu linaweza kutafsiriwa ama “kuona tena” ama “kurudishiwa uwezo wa kuona.”
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Basi Anania akaenda
  rationale: “Basi” linaonyesha mwendelezo wenye matokeo kutoka kwa agizo lililotangulia, huku “akaenda” likisogeza simulizi mbele kwa Kiswahili cha kawaida.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: akaingia ndani ya nyumba
  rationale: Ni usemi wa kawaida na wazi unaohifadhi kitendo cha kuingia katika nyumba iliyotajwa.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: Akamwekelea mikono
  rationale: Linahifadhi tendo halisi la kuweka mikono juu yake bila kuliongezea maana isiyotajwa.
- source_word: Σαοὺλ ἀδελφέ
  choice: Ndugu Sauli
  rationale: Huu ni mtindo wa kawaida wa Kiswahili wa kumwita mtu moja kwa moja, nao unadumisha lugha ya ukaribu na kukubalika.
- source_word: ἀπέσταλκέν με
  choice: amenituma
  rationale: Wakati timilifu wa Kiswahili unaonyesha kutumwa kulikotokea na matokeo yake yanayoendelea katika ujio wa Anania.
- source_word: ὁ ὀφθείς σοι
  choice: aliyekutokea
  rationale: Katika muktadha huu kitenzi cha Kigiriki kina maana ya kujionyesha au kumtokea mtu, si kuonekana kwa bahati tu.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: njiani ulipokuwa ukija
  rationale: Linahifadhi barabara/njia halisi na hali endelevu ya kitenzi ἤρχου, huku likibaki la kawaida katika Kiswahili.
- source_word: ὅπως
  choice: ili
  rationale: “Ili” linaonyesha kusudi kwa uwazi na kwa ufupi.
- source_word: ἀναβλέψῃς
  choice: upate kuona tena
  rationale: Katika muktadha wa upofu, maana ni kurejea kwa uwezo wa kuona; usemi huu ni wa kawaida na bado unaonyesha dhana ya kuona tena.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: ujazwe Roho Mtakatifu
  rationale: Muundo wa kutendwa umehifadhiwa, na “Roho Mtakatifu” ni rejeo la kawaida na wazi kwa Roho wa Mungu katika Matendo.
theological_decisions:
- issue: Uhusiano wa “Bwana” na “Yesu” katika ὁ κύριος ἀπέσταλκέν με, Ἰησοῦς ὁ ὀφθείς σοι
  choice: Bwana amenituma—Yesu, aliyekutokea...
  alternative: Bwana Yesu, aliyekutokea..., amenituma
  rationale: Mpangilio na viakifishi vinadumisha muundo wa Kigiriki ambamo “Yesu” anamfafanua “Bwana,” bila kuupanga upya kimya kimya. Hivyo utambulisho unabaki wazi pamoja na msisitizo wa sentensi ya asili.
- issue: Maana ya ἀδελφέ katika mwito wa Anania kwa Sauli
  choice: Ndugu Sauli
  alternative: Sauli, ndugu yangu
  rationale: “Ndugu Sauli” linahifadhi mwito wa kifamilia na wa ushirika bila kulazimisha ikiwa undugu huo unaeleweka hasa kikabila au kama ushirika wa waamini.
- issue: Kutafsiri πνεύματος ἁγίου bila kibainishi cha Kigiriki
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Katika muktadha wa Matendo, fungu hili linamrejelea Roho wa Mungu. Kiswahili hakihitaji kibainishi sawa na Kiingereza, na herufi kubwa zinaweka rejeo la kibinafsi bila kuongeza neno lisilokuwapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi vya mfululizo (“akaenda, akaingia… akamwekelea… akasema”) unaendana na usimulizi wa kawaida wa Kiswahili. Viakifishi vya vistari virefu vimetumiwa kuhifadhi ufafanuzi wa “Yesu” kwa “Bwana” bila kufanya sentensi isiweze kueleweka.
