  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: sw
  text: Naye hapa ana mamlaka kutoka kwa makuhani wakuu ya kuwafunga wote wanaoliitia jina lako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote wanaoomba kwa kulitaja jina lako.” Usemi wa Kigiriki ni nahau ya kawaida ya kibiblia ya kuliitia au kulinvoka jina la mtu, mara nyingi katika sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: hapa
  rationale: Kielezi hiki cha mahali kinarejelea Dameski, mahali Anania alipokuwa akizungumza.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili linaonyesha idhini rasmi aliyokabidhiwa na viongozi wa makuhani.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: kutoka kwa viongozi wa makuhani
  rationale: παρά pamoja na hali ya umilikaji huonyesha chanzo cha mamlaka; katika muktadha huu ἀρχιερεῖς ni viongozi wa kikuhani wa Yerusalemu.
- source_word: δῆσαι
  choice: kuwafunga
  rationale: Tafsiri hii inadumisha taswira halisi ya kufunga, huku muktadha ukionyesha kwamba kusudi lilikuwa kuwakamata.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: wote wanaoliitia
  rationale: Muundo huu unawataja watu wote wanaoliitia au kulisihi jina; ‘kuliitia’ inadumisha nahau ya kibiblia inayoweza kuhusisha sala.
- source_word: τὸ ὄνομά σου
  choice: jina lako
  rationale: Tafsiri ya moja kwa moja inadumisha nahau ambayo jina humwakilisha mtu na mamlaka yake bila kuipanua kwa ufafanuzi wa ziada.
theological_decisions:
- issue: Maana ya usemi ‘kuliitia jina lako’ unaoelekezwa kwa Yesu
  choice: Kudumisha nahau ‘wanaoliitia jina lako’
  alternative: wote wanaokuomba; wote wanaotegemea mamlaka yako
  rationale: Katika matumizi ya kibiblia, usemi huu mara nyingi unamaanisha kumwomba au kumsihi mtu na pia kuonyesha uaminifu kwake. Kwa kuwa Anania anazungumza moja kwa moja na Yesu, tafsiri inadumisha uzito huo bila kuongeza kauli ya kimafundisho isiyosemwa wazi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Viongozi wa makuhani’ ni wazi zaidi kwa wasomaji wa kawaida kuliko ‘makuhani wakuu’ na huepuka kueleweka kana kwamba kila mmoja alikuwa kuhani mkuu mmoja mmoja. Kiambishi cha yambwa katika ‘wanaoliitia’ kinarejelea ‘jina’ na kudumisha nahau ya chanzo.
