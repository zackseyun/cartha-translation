  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: sw
  text: Lakini Sauli, akiwa bado anapumua vitisho na mauaji dhidi ya wanafunzi wa Bwana, alimwendea kuhani mkuu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha kuendelea kwa simulizi kwa utofautishaji mdogo, huku simulizi likimrudia Sauli baada ya tukio lililotangulia.
- source_word: ἔτι
  choice: bado
  rationale: Inaonyesha kuwa uhasama wa Sauli ulikuwa unaendelea kutoka muktadha uliotangulia.
- source_word: ἐμπνέων
  choice: anapumua
  rationale: Inahifadhi taswira hai ya Kigiriki kwamba vitisho na mauaji yalikuwa kana kwamba pumzi yake.
- source_word: ἀπειλῆς
  choice: vitisho
  rationale: Wingi ni wa kawaida na wa asili katika Kiswahili kwa maneno au nia za kutisha.
- source_word: φόνου
  choice: mauaji
  rationale: Neno hili linaweza kumaanisha kuua au mauaji; “mauaji” huhifadhi uzito wa kimaadili na linaendana kiasili na sitiari ya kupumua.
- source_word: εἰς τοὺς μαθητὰς
  choice: dhidi ya wanafunzi
  rationale: Katika muktadha wa uhasama, εἰς inaeleza mwelekeo wa vitisho na nia ya kuua dhidi yao.
- source_word: μαθητὰς
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na sahihi katika Kiswahili cha Biblia kwa wafuasi waliojitolea.
- source_word: τοῦ κυρίου
  choice: wa Bwana
  rationale: Kirai tegemezi kwa kawaida kinawahusisha wanafunzi na Bwana; “Bwana” ni tafsiri ya kawaida ya κύριος hapa.
- source_word: προσελθὼν
  choice: alimwendea
  rationale: Huwasilisha kitendo cha kumkaribia au kwenda kwa kuhani mkuu kwa Kiswahili cha asili, huku kikitayarisha ombi linalofuata katika mstari unaofuata.
- source_word: τῷ ἀρχιερεῖ
  choice: kuhani mkuu
  rationale: Ni tafsiri ya kawaida ya cheo hiki katika hali ya umoja.
theological_decisions:
- issue: Tafsiri ya κύριος katika τοῦ κυρίου
  choice: Bwana
  alternative: Mkuu
  rationale: Katika muktadha huu wa Luka–Matendo, neno hilo kwa kawaida linamrejelea Yesu na halihitaji kufafanuliwa zaidi; “Bwana” huhifadhi cheo cha Kigiriki bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “anapumua vitisho na mauaji” umehifadhiwa kwa makusudi ili kuendeleza sitiari yenye nguvu ya maandishi ya Kigiriki; “alimwendea” ni ya asili kuliko tafsiri ya neno kwa neno ya kishazi tegemezi.
