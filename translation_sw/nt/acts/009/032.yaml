  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: sw
  text: Petro alipokuwa akipita kotekote, alishuka pia kwa watakatifu waliokuwa wakiishi Lida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: alipokuwa akipita sehemu zote
  rationale: Kirai hiki kwa asili hakitaji wazi watu au maeneo; “sehemu zote” huhifadhi kwa kiasi fulani upeo huo huku kikisikika kwa kawaida katika Kiswahili na kuendana na safari ya Petro katika eneo hilo.
- source_word: κατελθεῖν καὶ πρὸς
  choice: alifika pia kwa
  rationale: Ingawa κατελθεῖν kwa umbo ni “kushuka,” katika simulizi la safari inaweza kueleza kwenda/kufika mahali. “Alifika ... kwa” ni ya kawaida zaidi na huhifadhi wazo la Petro kuwafikia watu waliokuwa Lida.
- source_word: τοὺς ἁγίους
  choice: watakatifu
  rationale: Hili ndilo neno la kawaida la kibiblia kwa waumini waliowekwa wakfu kwa Mungu, bila kuongeza utambulisho wa dhehebu.
- source_word: Λύδδα
  choice: Lida
  rationale: Uhawilishaji wa kawaida na unaosomeka kwa urahisi wa jina la mahali Λύδδα katika Kiswahili.
theological_decisions:
- issue: Maana ya “watakatifu”
  choice: watakatifu
  alternative: waumini
  rationale: “Watakatifu” huhifadhi istilahi ya chanzo na maana yake ya kitheolojia bila kuibana kuwa maelezo tu ya utambulisho wao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa sentensi umefanywa wa kawaida bila kuingiza kiashiria kisicho wazi cha wakati kama “Ikawa” au “Basi.”
