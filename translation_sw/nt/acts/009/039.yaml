  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: sw
  text: Basi Petro akaondoka, akaenda pamoja nao. Alipofika, wakampandisha hadi chumba cha juu. Wajane wote wakasimama kando yake[a], wakilia na kumwonyesha kanzu na mavazi ya nje[c] ambayo Dorkasi[b] alikuwa akitengeneza alipokuwa pamoja nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele yake.” Kigiriki kinaweza kueleweka kwa namna rasmi zaidi, lakini muktadha pia unaruhusu picha ya wajane waliosimama karibu na Petro huku wakiomboleza.
    reason: lexical_alternative
  - marker: b
    text: Dorkasi ni jina la Kigiriki; katika Matendo 9:36 anaitwa pia Tabitha.
    reason: cross_reference
  - marker: c
    text: “Kanzu na mavazi ya nje” hutafsiri maneno mawili tofauti ya Kigiriki, ambayo huenda yalitaja vazi la msingi lililovaliwa mwilini na mavazi yaliyovaliwa juu yake.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: akaondoka
  rationale: Kitenzi hiki kinaonyesha Petro kuinuka na kuchukua hatua; “akaondoka” ni Kiswahili cha kawaida kinachounganisha mwitikio wake na safari iliyofuata bila kudokeza ufufuo.
- source_word: συνῆλθεν αὐτοῖς
  choice: akaenda pamoja nao
  rationale: Katika muktadha huu Petro aliandamana na wale wajumbe; usemi huu ni wa kawaida na unaweka wazi kwamba alisafiri nao.
- source_word: παραγενόμενον
  choice: alipofika
  rationale: Kirai hiki kinaonyesha wakati wa tendo kuu na kinatafsiriwa kwa Kiswahili fasaha na kifupi.
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: wakampandisha hadi chumba cha juu
  rationale: “Wakampandisha” huhifadhi mwelekeo wa kwenda juu, na “chumba cha juu” ni maelezo yanayoeleweka ya chumba kilichokuwa ghorofani.
- source_word: παρέστησαν αὐτῷ
  choice: wakasimama kando yake
  rationale: Usemi huu huhifadhi picha ya wajane waliosimama karibu na Petro, huku tanbihi ikitaja uwezekano rasmi zaidi wa “mbele yake.”
- source_word: κλαίουσαι
  choice: wakilia
  rationale: Huwakilisha kitendo cha maombolezo kilichokuwa kikiendelea.
- source_word: ἐπιδεικνύμεναι
  choice: kumwonyesha
  rationale: Hutoa kwa kawaida tendo la kuyaonyesha mavazi kwa Petro ili ayaone.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: kanzu na mavazi ya nje
  rationale: Maneno mawili tofauti ya Kigiriki yanatofautisha vazi la msingi lililovaliwa mwilini na mavazi ya nje; tafsiri hii huepuka kuyafanya yote kuwa “nguo” tu.
- source_word: ὅσα ἐποίει
  choice: ambayo ... alikuwa akitengeneza
  rationale: Muundo huu unaonyesha shughuli iliyoendelea au iliyorudiwa wakati Dorkasi alipokuwa hai bila kulazimisha maana ya tendo moja tu.
- source_word: μετ’ αὐτῶν οὖσα
  choice: alipokuwa pamoja nao
  rationale: Huhifadhi kiwakilishi cha wingi cha Kigiriki na uhusiano wa Dorkasi na kundi hilo bila kuongeza maelezo yasiyotajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Masimulizi yametumia mfululizo wa vitenzi vya “aka-” kwa mtiririko wa kawaida, huku sentensi zinazofuata zikitumia miundo iliyo wazi. Jina “Dorkasi” limeandikwa kwa namna inayosomeka kwa urahisi katika Kiswahili.
