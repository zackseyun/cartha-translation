  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: sw
  text: naye ameona katika maono mwanamume mmoja aitwaye Anania akiingia na kuweka mikono juu yake ili apate kuona tena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili arudishiwe uwezo wa kuona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: ameona
  rationale: Kauli timilifu ya Kiswahili inaeleza tukio la kuona lililotokea na ambalo umuhimu wake unaendelea katika wakati wa maelekezo haya; inafaa kwa muktadha bila kulazimika kuiga njeo ya aoristi kwa namna isiyo ya kawaida.
- source_word: ἄνδρα
  choice: mtu mmoja
  rationale: Katika muktadha huu neno linamtaja mwanamume, yaani Anania; hata hivyo, ‘mtu mmoja aitwaye Anania’ ni usemi wa kawaida wa Kiswahili na jina linabainisha mhusika.
- source_word: ἐν ὁράματι
  choice: katika maono
  rationale: Hii ndiyo tafsiri ya kawaida na iliyo wazi ya kirai kinachoonyesha mazingira au njia ambayo Sauli aliona.
- source_word: Ἁνανίαν ὀνόματι
  choice: aitwaye Anania
  rationale: Usemi huu wa Kiswahili unatambulisha mtu kwa jina kwa njia ya asili na sahihi.
- source_word: εἰσελθόντα
  choice: akiingia
  rationale: Huwasilisha tendo linaloonekana katika maono bila kusisitiza mpangilio wa matendo zaidi ya ule unaotolewa na kirai cha Kigiriki.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: kumwekea mikono
  rationale: Huhifadhi usemi wa kibiblia wa tendo la kuweka mikono juu ya mtu bila kuongeza maana ya kisakramenti, kiuwekaji wakfu, au mtazamo maalumu kuhusu njia ya uponyaji.
- source_word: ὅπως
  choice: ili
  rationale: Kiunganishi hiki cha kawaida kinaonyesha kusudi kwa uwazi na kwa lugha ya asili.
- source_word: ἀναβλέψῃ
  choice: apate kuona tena
  rationale: Katika muktadha wa kurejeshwa kwa uwezo wa kuona, maana ni kuona tena au kupata kuona; usemi huu ni wazi na pia unabaki karibu na muundo wa neno la chanzo.
theological_decisions:
- issue: Iwapo kuwekea mikono kufafanuliwe kwa maana maalumu ya kidhehebu
  choice: kumwekea mikono
  alternative: kuweka mikono yake juu yake
  rationale: Chanzo kinataja tendo la kimwili lakini hakifafanui moja kwa moja umuhimu wake wa kiteolojia hapa. Tafsiri inahifadhi usemi huo bila kuingiza fundisho kuhusu sakramenti, kuwekwa wakfu, au utaratibu maalumu wa uponyaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Sentensi inaanza kwa herufi ndogo kwa sababu mstari huu unaendeleza moja kwa moja kauli ya mstari uliotangulia.
