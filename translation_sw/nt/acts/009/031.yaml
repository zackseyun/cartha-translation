  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: sw
  text: Basi kanisa[a] kote katika Yudea, Galilaya na Samaria lilikuwa na amani na lilikuwa likijengwa; likiishi kwa kumcha Bwana na kwa kutiwa moyo na Roho Mtakatifu[b], lilizidi kuongezeka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya nakala zina “makanisa” badala ya “kanisa.”
    reason: textual_variant
  - marker: b
    text: Au “kwa faraja ya Roho Mtakatifu” au “kwa himizo la Roho Mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: kanisa
  rationale: SBLGNT ina umoja, unaolionyesha kanisa kwa maana ya jumla katika maeneo yote yaliyotajwa. Tofauti ya hati yenye wingi imewekwa katika tanbihi.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: kote katika Yudea, Galilaya na Samaria
  rationale: “Kote katika” huwasilisha maana ya kieneo ya κατά pamoja na ukubwa unaoonyeshwa na ὅλης kwa Kiswahili cha kawaida na cha asili.
- source_word: εἶχεν εἰρήνην
  choice: lilikuwa na amani
  rationale: Tafsiri hii inafuata nahau ya Kigiriki kwa uwazi na inaweza kujumuisha utulivu wa ndani pamoja na kupungua kwa mateso.
- source_word: οἰκοδομουμένη
  choice: lilikuwa likijengwa
  rationale: Muundo huu huhifadhi hali ya kuendelea na sitiari ya kulijenga kanisa, bila kuibadili kuwa ufafanuzi mahsusi kama “kuimarishwa kiroho.”
- source_word: πορευομένη
  choice: likiishi
  rationale: Katika muktadha huu neno linaeleza mwenendo wa maisha. “Likiishi” ni Kiswahili cha kawaida zaidi kuliko “likienenda,” huku kikihifadhi maana ya mwenendo.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: kwa kumcha Bwana
  rationale: Hii ni nahau ya kawaida ya Kiswahili ya kibiblia inayohifadhi maana ya heshima yenye kicho na utii bila kuifanya iwe hofu ya kutisha tu.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: kwa kutiwa moyo na Roho Mtakatifu
  rationale: “Kutiwa moyo” linafaa katika muktadha wa kujengwa na kuongezeka, na linaonyesha utendaji wa Roho. Maana nyingine halali za faraja na himizo zimehifadhiwa katika tanbihi.
- source_word: ἐπληθύνετο
  choice: lilizidi kuongezeka
  rationale: Hii huonyesha ongezeko linaloendelea kama linavyodokezwa na wakati usiotimilika wa Kigiriki, huku umoja ukipatana na “kanisa.”
theological_decisions:
- issue: Idadi na rejeleo la ἐκκλησία
  choice: 'Umoja wa kijumla: “kanisa”'
  alternative: 'Wingi wa tofauti ya hati: “makanisa”'
  rationale: Matini iliyotolewa ina nomino, vivumishi-tendo na kitenzi katika umoja, ikilionyesha kanisa moja kwa maana ya kijumla katika maeneo hayo. Tofauti muhimu ya wingi imewekwa katika tanbihi.
- issue: Maana ya “kumcha Bwana”
  choice: Kicho chenye heshima na utii
  alternative: Hofu ya kutisha mbele za Bwana
  rationale: Usemi huu wa kibiblia una maana pana ya uchaji na mwenendo wa uaminifu. Tafsiri haifupishi maana hiyo kuwa woga pekee.
- issue: Maana ya παράκλησις inayohusishwa na Roho Mtakatifu
  choice: Kutiwa moyo
  alternative: Kufarijiwa au kuhimizwa
  rationale: Neno la Kigiriki lina wigo mpana wa maana. “Kutiwa moyo” linaendana vizuri na kujengwa na kuongezeka kwa kanisa, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Tafsiri imetumia ulinganifu mwafaka: imehifadhi sitiari ya kujengwa, lakini imetafsiri πορευομένη kwa “likiishi” ili kueleza mwenendo kwa Kiswahili cha asili.'
