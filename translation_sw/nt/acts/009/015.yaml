id: ACT.9.15
reference: Acts 9:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: sw
  text: Lakini Bwana akamwambia, “Nenda, kwa maana mtu huyu ni chombo changu nilichokichagua, ili alibebe jina langu mbele ya watu wa mataifa[a], wafalme, na wana wa Israeli[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mataifa.”
    reason: lexical_alternative
  - marker: b
    text: “Wana wa Israeli” ni usemi wa jadi wa kibiblia unaomaanisha watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye heshima ya cheo hiki; katika muktadha huu inamrejelea Yesu aliyefufuka.
- source_word: Πορεύου
  choice: Nenda
  rationale: Amri ya moja kwa moja na ya kawaida inayohifadhi nguvu ya kitenzi cha Kigiriki.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: ni chombo nilichokichagua
  rationale: Inahifadhi taswira ya σκεῦος kama chombo na maana ya kuchaguliwa kwa kusudi maalumu, huku μοι ikionyesha kwamba Bwana ndiye anayekichagua na kukitumia.
- source_word: τοῦ βαστάσαι
  choice: ili alichukue
  rationale: Muundo huu unaonyesha kusudi la uteuzi; ‘kuchukua’ huhifadhi taswira ya kubeba jina bila kuifanya sentensi kuwa ngumu.
- source_word: τὸ ὄνομά μου
  choice: jina langu
  rationale: Tafsiri ya moja kwa moja inayohifadhi maana pana ya uwakilishi, mamlaka, na ushuhuda wa hadharani.
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Ni usemi wa kawaida unaofaa kwa wazo la kutoa ushuhuda hadharani mbele ya makundi yaliyotajwa.
- source_word: ἐθνῶν
  choice: watu wa mataifa
  rationale: Katika utofautishaji na Israeli, neno hili linamaanisha hasa watu wasio Wayahudi; usemi huu ni wazi katika Kiswahili na bado unaonyesha uhusiano wake na ‘mataifa.’
- source_word: βασιλέων
  choice: wafalme
  rationale: Tafsiri ya moja kwa moja, sahihi, na ya kawaida.
- source_word: υἱῶν Ἰσραήλ
  choice: wana wa Israeli
  rationale: Inahifadhi usemi wa kifamilia wa kibiblia badala ya kuubadilisha kimya kuwa jina la jumla la taifa.
- source_word: τε ... καὶ ... τε
  choice: '..., ..., na ...'
  rationale: Orodha ya Kiswahili huwasilisha kwa kawaida uratibu wa makundi hayo matatu bila kulazimisha kurudia viunganishi vya Kigiriki.
theological_decisions:
- issue: Maana ya ἐκλογῆς kuhusu kuchaguliwa
  choice: chombo nilichokichagua
  alternative: chombo cha uteule
  rationale: Mstari unaeleza wazi uchaguzi wa Mungu kwa ajili ya utume, lakini hauhitaji msamiati unaoweza kuingiza mfumo maalumu wa baadaye kuhusu uteule.
- issue: Taswira ya σκεῦος
  choice: chombo
  alternative: nyenzo
  rationale: ‘Chombo’ huhifadhi sitiari ya Kigiriki na bado inaeleweka kama kitu au mtu anayetumiwa kutimiza kusudi; ‘nyenzo’ ingefafanua zaidi lakini ingepunguza taswira.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili huku taswira ya ‘chombo,’ ‘jina langu,’ na ‘wana wa Israeli’ ikihifadhiwa.
