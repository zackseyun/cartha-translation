  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: sw
  text: Lakini Sauli aliendelea kupata nguvu zaidi, akiwachanganya Wayahudi waliokuwa wakiishi Damasko kwa kuthibitisha kwamba huyu ndiye Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός hapa ni cheo chenye maana ya Masihi, yaani, Mtiwa-Mafuta.
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: akazidi kupata nguvu
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kuendelea na kuongezeka kwa nguvu, huku ukiacha wazi kama nguvu hizo zilitoka ndani yake au alipewa na Mungu.
- source_word: συνέχυννεν
  choice: akawashangaza
  rationale: Katika muktadha wa mabishano, kitenzi kina maana ya kuwavuruga au kuwafanya washindwe kujibu. ‘Akawashangaza’ ni ya asili kwa Kiswahili na inaonyesha athari kubwa ya hoja zake bila kudai tu kwamba hawakuelewa.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: Wayahudi waliokuwa wakiishi Damasko
  rationale: Inatambulisha kwa uwazi kundi hususa la Wayahudi wa Damasko, bila kujumlisha Wayahudi wote.
- source_word: συμβιβάζων
  choice: kwa kuwathibitishia
  rationale: 'Kishirikishi kinaeleza njia ambayo Sauli aliwashangaza: aliunganisha hoja na ushahidi ili kuwaonyesha hitimisho. ‘Kuwathibitishia’ huhifadhi nguvu ya kimantiki na pia walengwa wa hoja.'
- source_word: οὗτός
  choice: huyu
  rationale: Kiwakilishi hiki huhifadhi mkazo wa demonstrativi unaomwelekeza msomaji kwa Yesu, badala ya kutumia ‘yeye’ isiyo na mkazo.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha yule aliyetiwa mafuta aliyeahidiwa, si sehemu ya jina la Yesu; ‘Masihi’ huhifadhi maana hiyo ya Kiyahudi.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Kifungu kinamtambulisha Yesu kuwa yule aliyetiwa mafuta aliyeahidiwa. ‘Masihi’ huonyesha wazi matumizi ya cheo, huku tanbihi ikihifadhi tafsiri nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akazidi kupata nguvu’ na ‘kwa kuwathibitishia’ ni vya kawaida na vinaeleweka kwa wasomaji wengi. Tanbihi imewekwa baada ya ‘Masihi’ ili alama [a] ihusiane moja kwa moja na neno linalofafanuliwa.
