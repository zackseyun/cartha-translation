  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: sw
  text: Lakini Anania akajibu, “Bwana, nimesikia kutoka kwa watu wengi habari za mtu huyu, maovu mengi aliyowatendea watakatifu wako Yerusalemu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: Lakini Anania akajibu
  rationale: δέ hapa inaonyesha mpinduko mdogo katika simulizi, kwa kuwa Anania anajibu kwa kusita; ‘akajibu’ ni tafsiri ya kawaida ya ἀπεκρίθη.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni neno la kawaida la kumwita Yesu katika muktadha huu, likihifadhi heshima na uzito wa kitheolojia.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: nimesikia kutoka kwa watu wengi
  rationale: ‘Nimesikia’ linaonyesha taarifa alizopokea ambazo bado zina umuhimu kwa pingamizi lake; ‘watu’ huongezwa kwa uwazi wa Kiswahili bila kubadili maana ya wengi.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: habari za mtu huyu
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha περί pamoja na nguvu ya kiashiria ‘huyu’.
- source_word: ὅσα κακὰ ... ἐποίησεν
  choice: jinsi alivyowatendea ... maovu mengi
  rationale: Muundo huu wa Kiswahili unaonyesha wingi na ukubwa wa matendo mabaya bila kufanya sentensi kuwa ngumu.
- source_word: τοῖς ἁγίοις σου
  choice: watakatifu wako
  rationale: ‘Watakatifu’ huhifadhi istilahi ya Agano Jipya kwa waumini na kiwakilishi ‘wako’ kinaonyesha kuwa wao ni wa Bwana.
- source_word: ἐν Ἰερουσαλήμ
  choice: huko Yerusalemu
  rationale: ‘Huko’ ni ya asili katika simulizi na inaonyesha mahali panaporejelewa.
theological_decisions:
- issue: Rejeleo na maana ya Κύριε katika maneno ya Anania
  choice: Bwana, kama neno la kumwita Yesu moja kwa moja
  alternative: bwana kwa maana ya heshima tu au mkuu
  rationale: Katika muktadha wa karibu Anania anamjibu Yesu aliyefufuka katika maono; ‘Bwana’ huhifadhi maana ya simulizi na uzito wake wa kitheolojia bila kuongeza madai yasiyo katika kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi huku ikihifadhi msisitizo wa Kigiriki juu ya maovu mengi yaliyotendwa dhidi ya watakatifu wa Bwana.
