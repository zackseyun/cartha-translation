base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: sw
  text: Petro akamwambia, “Ainea, Yesu Masihi[a] anakuponya. Inuka, ujitandikie.[b]” Mara akainuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu Kristo.” Neno la Kigiriki Χριστός ni cheo kinachoweza kutafsiriwa “Masihi” au “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au “tandika malazi yako”; kwa maana ya karibu, “jitandikie malazi yako mwenyewe.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἰᾶταί
  choice: anakuponya
  rationale: Kitenzi hiki kiko katika wakati wa sasa na hapa kinatangaza uponyaji unaotendwa na Yesu. “Anakuponya” huhifadhi wakati huo na nguvu ya tangazo bila kulazimisha maana ya “amekuponya” au “anaendelea kukuponya.”
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa Χριστός inatumika kama cheo cha Yesu. “Masihi” huhifadhi maana ya cheo hicho; “Kristo” limetolewa katika tanbihi kama tafsiri nyingine iliyozoeleka.
- source_word: ἀνάστηθι
  choice: Inuka
  rationale: Amri ya moja kwa moja kwa mtu aliyekuwa amelala kitandani; “Inuka” ni ya kawaida, wazi, na yenye heshima katika Kiswahili cha sasa.
- source_word: στρῶσον σεαυτῷ
  choice: ujitandikie kitanda chako
  rationale: στρώννυμι huhusu kutandika au kuandaa malazi, na σεαυτῷ huonyesha kwamba Ainea sasa anaweza kujifanyia tendo hilo. Muundo wa kujirejelea “ujitandikie” unahifadhi msisitizo huo kwa Kiswahili cha asili.
- source_word: εὐθέως
  choice: Mara
  rationale: “Mara” kwa ufupi huonyesha kwamba tendo lilifuata papo hapo, sawasawa na εὐθέως katika simulizi.
- source_word: ἀνέστη
  choice: akainuka
  rationale: Husimulia utekelezaji wa amri iliyotangulia na kudumisha ulinganifu wa wazi na “Inuka.”
- source_word: Αἰνέα
  choice: Ainea
  rationale: Jina la Kigiriki limenukuliwa kwa tahajia inayoendana na mfumo wa sauti wa Kiswahili.
theological_decisions:
- issue: Tafsiri ya Χριστός katika tangazo la uponyaji
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Muktadha unaruhusu Χριστός kueleweka kama cheo, hivyo “Masihi” huonyesha maana hiyo wazi. “Kristo” ni tafsiri halali na iliyozoeleka, kwa hiyo imehifadhiwa katika tanbihi bila kubadili mhusika anayetajwa.
- issue: Wakati na nguvu ya ἰᾶταί
  choice: anakuponya
  alternative: amekuponya
  rationale: Neno la Kigiriki liko katika wakati wa sasa. Tafsiri ya sasa inalinda muundo huo na kuliacha tangazo libebe nguvu yake ya kitendo bila kulifasiri kimakusudi kama hali iliyokamilika tayari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi “akamwambia” na “akainuka” ni wa kawaida katika usimulizi wa Biblia, huku “ujitandikie” ukitoa kwa ufupi maana ya kujifanyia iliyo katika σεαυτῷ.
