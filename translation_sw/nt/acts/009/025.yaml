  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: sw
  text: Lakini wanafunzi wake walimchukua usiku, wakamshusha kupitia ukuta, wakimtelemsha katika kikapu kikubwa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia tundu katika ukuta.” Kigiriki kinasema kihalisi “kupitia ukuta,” huenda kikimaanisha tundu au dirisha katika ukuta wa mji.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinatumia vitenzi viwili vya kushusha (“wakamshusha” na “wakimtelemsha”), muundo unaosisitiza jinsi alivyotoroshwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: walimchukua
  rationale: Kitenzi hiki kinaonyesha kwamba wanafunzi walimchukua na kumsaidia kutoroka; “walimchukua” ni wazi na cha kawaida katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha badiliko lenye utofautishaji mdogo kati ya njama ya kumuua na hatua ya wanafunzi kumwokoa.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Tafsiri hii inahifadhi nomino μαθηταί pamoja na kiwakilishi milikishi αὐτοῦ.
- source_word: νυκτός
  choice: usiku
  rationale: Hii ni tafsiri ya kawaida na fupi ya hali ya wakati inayotajwa na umbo la Kigiriki.
- source_word: διὰ τοῦ τείχους
  choice: kupitia ukutani
  rationale: Inahifadhi maana ya kupita kupitia ukuta bila kuongeza waziwazi “tundu” au “dirisha,” maneno ambayo hayapo katika Kigiriki.
- source_word: καθῆκαν αὐτόν
  choice: wakamshusha
  rationale: καθίημι hapa humaanisha kumshusha mtu kutoka mahali pa juu.
- source_word: χαλάσαντες
  choice: kwa kumtelemsha
  rationale: Tafsiri hii inahifadhi usemi wa pili wa Kigiriki unaoeleza namna walivyomshusha, ingawa unaingiliana kimaana na “wakamshusha.”
- source_word: ἐν σπυρίδι
  choice: katika kikapu kikubwa
  rationale: σπυρίς ni kikapu, kwa kawaida kikubwa; ukubwa huo pia unafaa kwa chombo kilichoweza kumbeba mtu.
