  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: sw
  text: Akakaa Yafa kwa siku nyingi pamoja na Simoni fulani[a], mtengenezaji wa ngozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumbani kwa Simoni fulani.” Kihusishi cha Kigiriki kinaweza kumaanisha kukaa na mtu nyumbani kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: Akakaa
  rationale: Muundo wa ἐγένετο pamoja na kitenzi-jina unatolewa kwa kitenzi kikuu cha kawaida katika Kiswahili; “akakaa” huendeleza simulizi kwa ufasaha bila tafsiri ngumu ya neno kwa neno.
- source_word: δὲ
  choice: Aka-
  rationale: Kiambishi cha usimulizi “aka-” kinaendeleza tukio kwa upole na kwa kawaida katika Kiswahili, sawasawa na kazi ya δέ hapa.
- source_word: ἡμέρας ἱκανὰς
  choice: kwa siku nyingi
  rationale: Huwasilisha muda mrefu wa kukaa kwa lugha ya kawaida na yenye usahihi.
- source_word: ἐν Ἰόππῃ
  choice: Yafa
  rationale: Yafa ni umbo la jina la mahali linalotambulika katika matumizi ya Biblia ya Kiswahili kwa Ἰόππη.
- source_word: παρά τινι Σίμωνι
  choice: pamoja na Simoni fulani[a]
  rationale: “Pamoja na” huhifadhi wazo la kukaa na mtu, huku “fulani” ikihifadhi kutokuwa maalumu kwa τινι. Tanbihi inaonyesha uwezekano wa maana ya kukaa nyumbani kwake.
- source_word: βυρσεῖ
  choice: mtengenezaji wa ngozi
  rationale: Neno hili la kawaida linaeleweka kwa urahisi na humtaja mtu anayesindika ngozi na kuitengeneza; linaepuka neno la kitaalamu lisilozoeleka.
