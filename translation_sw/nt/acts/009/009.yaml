lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Kwa siku tatu
  rationale: Kirai cha wakati katika hali ya accusative kinaonyesha muda uliodumu; ‘kwa siku tatu’ ni Kiswahili cha kawaida na sahihi bila kuongeza wazo la ‘alibaki.’
- source_word: μὴ βλέπων
  choice: hakuweza kuona
  rationale: Kihalisi ni ‘haoni/asiyeona.’ Katika muktadha, kirai hiki kinaeleza kutokuwa na uwezo wa kuona; tafsiri hii ni wazi na haileti kivumishi chenye nguvu zaidi cha ‘kipofu.’ Tanbihi huhifadhi umbo la karibu zaidi na Kigiriki.
- source_word: οὐκ ἔφαγεν
  choice: hakula
  rationale: Kitenzi kina maana ya moja kwa moja ya ‘kula’; hali ya ukanushi imetafsiriwa kwa ‘hakula.’
- source_word: οὐδὲ ἔπιεν
  choice: wala kunywa
  rationale: οὐδὲ huunganisha tendo la pili lililokanushwa na la kwanza; ‘wala ... wala ...’ ni muundo wa asili wa Kiswahili.
