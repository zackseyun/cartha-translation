  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: sw
  text: Katika siku hizo, ikawa kwamba aliugua, akafa. Baada ya kumwosha, wakamweka katika chumba cha ghorofani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika chumba cha juu.” Kigiriki kinarejelea tu chumba kilichokuwa katika ghorofa ya juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: '[imewasilishwa kwa muundo wa sentensi bila neno la pekee]'
  rationale: Hapa ἐγένετο inaanzisha tukio katika simulizi. Kiswahili cha kawaida hakihitaji tafsiri ya neno kwa neno kama “ikawa kwamba”; mwanzo “Katika siku hizo” pamoja na vitenzi vinavyofuata unawasilisha tukio kwa uwazi.
- source_word: δὲ
  choice: '[haikutafsiriwa kwa neno la pekee]'
  rationale: Ni kiunganishi hafifu cha simulizi. Mtiririko wa aya katika Kiswahili hauhitaji “basi” au “na” hapa, maneno ambayo yangeweza kuongeza uzito usio katika Kigiriki.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Katika siku hizo
  rationale: Ni tafsiri ya kawaida, ya asili, na iliyo karibu na usemi wa Kigiriki.
- source_word: ἀσθενήσασαν
  choice: aliugua
  rationale: Kitenzi hiki hapa kinaonyesha kupatwa na ugonjwa kabla ya kifo. “Aliugua” ni Kiswahili cha kawaida na kinafaa katika simulizi.
- source_word: ἀποθανεῖν
  choice: na kufa
  rationale: Ingawa Kigiriki kinatumia kitenzi-jina baada ya ἐγένετο, Kiswahili huwasilisha maana yake kwa kawaida kwa kitenzi kinachoendeleza mfuatano wa matukio.
- source_word: λούσαντες
  choice: Baada ya kumwosha
  rationale: Kivumishi-tendo cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu. Katika muktadha, kilichooshwa ni mwili wake baada ya kufa, lakini “mwili” haujaongezwa katika matini kwa kuwa Kigiriki kinasema “yeye.”
- source_word: ἔθηκαν αὐτὴν
  choice: wakamlaza
  rationale: τίθημι hapa ni kuweka au kulaza. “Wakamlaza” ni ya asili katika muktadha wa mwili wa marehemu kuliko “wakamweka.”
- source_word: ἐν ὑπερῴῳ
  choice: katika chumba cha ghorofani
  rationale: ὑπερῷον ni chumba kilicho kwenye sehemu ya juu ya jengo. Tafsiri hii ni wazi na haidokezi kwamba kilikuwa chumba fulani maarufu.
theological_decisions:
- issue: Iwapo ὑπερῴῳ itafsiriwe kwa usemi wa kimapokeo unaoweza kudokeza chumba maalumu au kwa maelezo ya kawaida ya mahali
  choice: katika chumba cha ghorofani
  alternative: katika chumba cha juu
  rationale: Neno la Kigiriki halina kibainishi na linaeleza tu chumba kilicho katika ghorofa ya juu. Tafsiri iliyochaguliwa huepuka kuhusisha mahali hapa na chumba kingine maalumu bila msingi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mwepesi kwa msomaji wa kawaida bila kutumia usemi wa zamani “ikawa kwamba.” Kielezi cha mfuatano “Baada ya” kinaweka wazi kuwa kuoshwa kulitokea baada ya kifo na kabla ya kulazwa chumbani.
