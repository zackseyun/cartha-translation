  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: sw
  text: Baada ya siku nyingi kupita[b], Wayahudi[a] walipanga njama[c] ya kumuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Wayahudi.” Katika muktadha huu, neno hilo linarejelea kundi fulani lililompinga Sauli, si kila Myahudi bila ubaguzi.'
    reason: cultural_note
  - marker: b
    text: Au “baada ya siku nyingi kukamilika.”
