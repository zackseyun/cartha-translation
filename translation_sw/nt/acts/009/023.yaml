lexical_decisions:
- source_word: Ὡς δὲ
  choice: Baada ya
  rationale: Katika muktadha huu, kishazi hiki kinaanzisha hatua mpya ya wakati; muundo wa Kiswahili ‘Baada ya ...’ unaunganika kwa kawaida na tendo la siku kupita.
- source_word: ἐπληροῦντο
  choice: kupita
  rationale: Kitenzi hiki kikiwa na ‘siku’ kama kiima ni nahau ya muda kukamilika au kupita. ‘Kupita’ ni Kiswahili cha kawaida na wazi.
- source_word: ἡμέραι ἱκαναί
  choice: siku nyingi
  rationale: ἱκαναί hapa hudokeza muda mkubwa au wa kutosha kwa wingi, si ‘siku za kutosha’ kwa kusudi fulani. ‘Siku nyingi’ huhifadhi maana ya kipindi kirefu.
- source_word: συνεβουλεύσαντο
  choice: walipanga pamoja
  rationale: Kitenzi kinaonyesha kushauriana au kupanga kwa pamoja, na kusudi baya linaelezwa na kishazi kinachofuata. Tafsiri hii haiweki zaidi ya maana iliyo wazi katika chanzo.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Huhifadhi jina la kundi lililotumiwa katika Kigiriki bila kulibadili kuwa ‘viongozi wa Kiyahudi’ au ‘Wayudea,’ ambayo yangelifafanua zaidi ya mstari wenyewe.
- source_word: ἀνελεῖν
  choice: kumuua
  rationale: Hutoa maana ya moja kwa moja ya kuondoa uhai bila kuongeza dhana maalumu ya kisheria.
- source_word: αὐτόν
  choice: -mu-
  rationale: Kiambishi cha yambwa katika ‘kumuua’ kinamrejelea Sauli kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya οἱ Ἰουδαῖοι katika simulizi lenye upinzani
  choice: Wayahudi
  alternative: Wayudea; viongozi wa Kiyahudi
  rationale: Mstari unasema kwa ujumla ‘Wayahudi’ na hautaji viongozi pekee. Tanbihi inaeleza upeo wa muktadha bila kubadili maneno ya chanzo wala kuyatumia kuwahusisha Wayahudi wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Baada ya siku nyingi kupita’ ni muundo wa kawaida wa kisimulizi; ‘walipanga pamoja’ huhifadhi wazo la hatua ya pamoja na huepuka lugha nzito isiyo ya lazima.
