base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: sw
  text: Wale wanaume waliokuwa wakisafiri pamoja naye walikuwa wamesimama, bila kuweza kutamka neno lolote; walikuwa wakisikia sauti[a], lakini hawakumwona mtu yeyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlio.” Neno la Kigiriki linaweza kumaanisha “sauti” au “mlio”; tazama Matendo 22:9.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Wale wanaume
  rationale: Nomino na kibainishi vinarejelea wanaume waliokuwa pamoja na Sauli; δέ ni kiunganishi hafifu ambacho hakihitaji kutafsiriwa kwa neno tofauti katika mtiririko wa kawaida wa Kiswahili.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: waliokuwa wakisafiri pamoja naye
  rationale: συνοδεύω humaanisha kuandamana na mtu safarini; usemi huu ni wa kawaida na unahifadhi muktadha wa safari.
- source_word: εἱστήκεισαν
  choice: walikuwa wamesimama
  rationale: Hali ya wakati uliopita ya ἵστημι hapa inaeleza kwamba walikuwa katika hali ya kusimama, bila kulazimisha maana ya kwamba ndipo waliposimama.
- source_word: ἐνεοί
  choice: wakiwa hawawezi kusema
  rationale: ἐνεός hueleza kutoweza kusema au kubaki bila usemi; tafsiri hii inatoa maana hiyo moja kwa moja bila kuongeza sababu ambayo haijasemwa wazi.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: Waliisikia sauti
  rationale: φωνή inaweza kumaanisha sauti ya mtu au sauti/mlio kwa upana. Neno la Kiswahili “sauti” linahifadhi kwa kiasi kikubwa unyumbufu huo wa kimaana.
- source_word: μηδένα δὲ θεωροῦντες
  choice: lakini hawakumwona mtu yeyote
  rationale: θεωρέω hapa ni kuona au kutazama, na μηδένα huonyesha kwamba hawakumwona mtu hata mmoja.
theological_decisions:
- issue: Mvutano unaoonekana kati ya Matendo 9:7 na Matendo 22:9 kuhusu kile waandamani wa Sauli walichosikia
  choice: Kutumia “sauti” katika andiko kuu na kueleza uwezekano wa “mlio” katika tanbihi
  alternative: Kutafsiri moja kwa moja “mlio” ili kutofautisha kati ya kusikia sauti na kuelewa sauti ya msemaji
  rationale: φωνή ina wigo wa maana unaojumuisha sauti ya mtu na sauti kwa ujumla. “Sauti” ni tafsiri ya karibu na yenye unyumbufu katika Kiswahili; tanbihi inaweka wazi uwezekano mwingine bila kusuluhisha kimyakimya mvutano na Matendo 22:9.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili kuepuka msongamano na kudumisha usomaji wa kawaida, huku uhusiano wa hali za wakati mmoja ukibaki wazi.
