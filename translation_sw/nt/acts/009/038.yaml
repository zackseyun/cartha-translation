base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: sw
  text: Kwa kuwa Lida ilikuwa karibu na Yopa, wanafunzi waliposikia kwamba Petro yuko huko, wakatuma wanaume wawili kwake wakimsihi, “Usikawie kuja kwetu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usisite kuja kwetu.” Kitenzi hiki kinaweza kumaanisha kusita au kukawia; hapa “usikawie” linafaa kwa ombi hili la haraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Kwa kuwa Lida ilikuwa karibu na Yopa
  rationale: Muundo wa genitive absolute unatoa hali ya usuli yenye kidokezo cha sababu. Kiswahili hiki ni cha asili na kinaonyesha kwamba ukaribu wa miji hiyo ulihusiana na hatua ya wanafunzi.
- source_word: Λύδδας
  choice: Lida
  rationale: Umbo la Kiswahili la jina la mahali la Kigiriki Λύδδα.
- source_word: Ἰόππῃ
  choice: Yopa
  rationale: Umbo la Kiswahili linalotumika kwa jina la mahali la Kigiriki Ἰόππη.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na sahihi kwa μαθηταί katika Matendo, likimaanisha watu wa jumuiya ya waamini.
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: waliposikia kwamba Petro alikuwa huko
  rationale: Kishazi cha wakati kinaonyesha kwa kawaida kwamba kusikia kulitangulia kutuma; “huko” humrejelea Lida bila urudiaji mzito.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: wakatuma wanaume wawili kwake
  rationale: Tafsiri ya moja kwa moja na ya asili ya tendo, idadi, na mwelekeo wa ujumbe.
- source_word: παρακαλοῦντες
  choice: wakimsihi
  rationale: Katika muktadha huu kitenzi kinaonyesha ombi la dhati; “wakimsihi” huhifadhi uzito wa ombi bila kulifanya liwe amri.
- source_word: Μὴ ὀκνήσῃς
  choice: Usikawie
  rationale: ὀκνέω inaweza kumaanisha kusita au kukawia. Katika ombi hili la haraka la safari, “usikawie” ni fupi na ya asili huku maana nyingine ikiwekwa katika tanbihi.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: kuja kwetu
  rationale: Ingawa διελθεῖν kwa msingi ni kupita au kuvuka kwenda mahali, kutoka kwa mtazamo wa waombaji usemi wa asili wa Kiswahili ni “kuja kwetu.”
