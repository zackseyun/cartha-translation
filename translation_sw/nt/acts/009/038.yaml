  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi “waliposikia ... wakatuma ... wakimsihi” unaweka wazi hatua za simulizi bila kuongeza kiunganishi cha wakati kisichomo katika chanzo. Alama ya tanbihi imewekwa baada ya ombi ambalo tanbihi inalifafanua.
