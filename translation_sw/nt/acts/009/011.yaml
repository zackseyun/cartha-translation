  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: sw
  text: Bwana akamwambia, “Inuka, uende kwenye barabara inayoitwa Nyofu, na katika nyumba ya Yuda umtafute mtu anayeitwa Sauli, kutoka Tarso[a], kwa maana tazama, anasali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sauli wa Tarso.” Neno la Kigiriki Ταρσέα linamtambulisha Sauli kwa mahali alikotoka, yaani Tarso.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi jina la cheo la kawaida katika Agano Jipya na mamlaka ya msemaji bila kuongeza wazi ‘Yesu,’ jambo ambalo halipo katika kifungu hiki.
- source_word: Ἀναστὰς πορεύθητι
  choice: Inuka, uende
  rationale: Muundo huu wa Kiswahili ni wa asili na unaonyesha kuanza kutenda pamoja na amri ya kwenda.
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: barabara inayoitwa Nyofu
  rationale: ‘Barabara’ hueleweka kwa urahisi katika mazingira ya mjini; ‘Nyofu’ huhifadhi maana ya jina Εὐθεῖαν kama jina rasmi la barabara.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: katika nyumba ya Yuda
  rationale: Hufuata kwa karibu eneo lililoonyeshwa na ἐν huku likibaki wazi na la kawaida katika Kiswahili.
- source_word: ζήτησον
  choice: umtafute
  rationale: Hutoa maana ya kumtafuta au kuulizia mtu bila kudokeza kwamba tayari amepatikana.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: mtu anayeitwa Sauli, mwenyeji wa Tarso
  rationale: Hutaja jina la Sauli na kisha asili yake ya Tarso kwa Kiswahili cha kawaida; ‘mwenyeji wa Tarso’ huwakilisha kivumishi Ταρσέα.
- source_word: ἰδοὺ γὰρ
  choice: kwa maana tazama
  rationale: ‘Kwa maana’ huhifadhi uhusiano wa sababu wa γάρ, na ‘tazama’ huhifadhi msisitizo wa ἰδού.
- source_word: προσεύχεται
  choice: anasali
  rationale: Wakati uliopo unaonyesha shughuli ya Sauli inayoendelea wakati huo; ‘kusali’ ni neno la kawaida na lenye heshima.
theological_decisions:
- issue: Mrejelewa wa κύριος
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Muktadha humtambulisha msemaji, lakini mstari huu unasema κύριος pekee; tafsiri haiongezi utambulisho usiotajwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Kauli ‘kwa maana tazama’ imehifadhiwa kwa kuwa inaonyesha sababu na pia mvuto wa usikivu uliomo katika Kigiriki, ingawa ina ladha iliyoinuka kidogo.
