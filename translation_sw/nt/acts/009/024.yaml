  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akapata habari’ ni cha asili zaidi kuliko kauli tendwa ngumu, huku ‘walikuwa wakiyachunga’ kikihifadhi hali ya tendo lililoendelea.
