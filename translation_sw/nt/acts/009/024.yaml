  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: sw
  text: Lakini Sauli akapata habari za njama yao. Nao walikuwa wakiyachunga malango[a] mchana na usiku ili wamuue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malango ya mji.” Kigiriki kinasema tu “malango”; kutokana na muktadha, ni malango ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: akapata habari
  rationale: Kauli hii ya Kiswahili inaeleza kwa kawaida kwamba njama ilijulikana kwa Sauli, bila kutaja ni nani aliyemjulisha.
- source_word: ἐπιβουλή
  choice: njama
  rationale: Neno hili linaashiria mpango wa siri wenye nia ya kumdhuru au kumuua mtu.
- source_word: παρετηροῦντο
  choice: walikuwa wakiyachunga
  rationale: Muundo wa kuendelea unaakisi hali endelevu ya kufuatilia malango; ‘kuyachunga’ hapa ni Kiswahili cha kawaida kwa kuyaangalia ili kumkamata anayetaka kupita.
- source_word: πύλας
  choice: malango
  rationale: Tafsiri ya moja kwa moja ya wingi; muktadha unaonyesha kuwa ni malango ya mji.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: mchana na usiku
  rationale: Usemi wa kawaida wa Kiswahili unaowasilisha uangalizi wa nyakati zote mbili.
- source_word: ὅπως
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi la kuchunga malango.
- source_word: ἀνέλωσιν
  choice: wamuue
  rationale: Katika muktadha huu kitenzi kinamaanisha kumuondolea mtu uhai, si tu kumwondoa mahali.
- source_word: δὲ
  choice: Lakini
  rationale: Kinaonyesha tofauti kati ya njama yao na ukweli kwamba Sauli aliipata habari.
- source_word: καὶ
  choice: Nao
  rationale: Hufanya mpito wa nyongeza kwa tendo lao la kuchunga malango, huku kikidumisha mtiririko wa simulizi.
theological_decisions: []
