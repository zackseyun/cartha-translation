id: ACT.9.10
reference: Acts 9:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: sw
  text: Kulikuwa na mwanafunzi mmoja huko Dameski aliyeitwa Anania. Bwana akamwambia katika maono, “Anania!” Naye akajibu, “Mimi hapa, Bwana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Kulikuwa na
  rationale: Kauli hii inamtambulisha mhusika mpya katika simulizi. Kiswahili cha kawaida hakihitaji kuongeza neno la wakati kama “sasa”; mpito wa simulizi unaeleweka katika muktadha.
- source_word: τις μαθητὴς
  choice: mwanafunzi mmoja
  rationale: τις humtambulisha mtu ambaye hajatajwa hapo awali. “Mwanafunzi mmoja” ni ya kawaida katika Kiswahili na haitilii mkazo usio wa lazima kama “mwanafunzi fulani” ambavyo ingeweza kufanya.
- source_word: ἐν Δαμασκῷ
  choice: huko Dameski
  rationale: Hii ni kauli ya mahali. “Dameski” ni umbo la jina hili lililozoeleka katika Kiswahili cha Biblia, na “huko” linaunganisha mahali hapo kwa kawaida na simulizi.
- source_word: ὀνόματι Ἁνανίας
  choice: aliyeitwa Anania
  rationale: Dativu ὀνόματι inatumika hapa kutaja jina. “Aliyeitwa Anania” ni tafsiri fupi na ya asili katika Kiswahili.
- source_word: εἶπεν πρὸς αὐτόν
  choice: akamwambia
  rationale: Muundo wa λέγω pamoja na πρός unaonyesha kusema moja kwa moja kwa mtu; “akamwambia” unatoa maana hiyo kwa ufasaha.
- source_word: ἐν ὁράματι
  choice: katika maono
  rationale: Kirai hiki kinaonyesha mazingira au njia ambayo Bwana alisema naye. “Katika maono” ni usemi wazi na wa kawaida.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Katika muktadha huu κύριος ni cheo cha yule anayesema katika maono, yaani Yesu aliyefufuka; “Bwana” linahifadhi uzito huo.
- source_word: Ἰδοὺ ἐγώ
  choice: Mimi hapa
  rationale: Hili ni jibu la kawaida linaloonyesha kuwa msemaji yupo, anasikiliza, na yuko tayari kuitikia. “Mimi hapa” huwasilisha maana hiyo kwa Kiswahili cha asili kuliko tafsiri ya neno kwa neno ya ἰδού.
- source_word: κύριε
  choice: Bwana
  rationale: Ingawa κύριε wakati mwingine inaweza kumaanisha “bwana” kwa heshima, hapa Anania anamjibu yule Bwana aliyemjia katika maono; kwa hiyo “Bwana” linafaa.
theological_decisions:
- issue: Rejeleo la ὁ κύριος na κύριε katika maono
  choice: Maneno yote mawili yametafsiriwa “Bwana,” yakimrejelea Yesu aliyefufuka.
  alternative: Kuelewa κύριε ya pili kama heshima ya jumla, “bwana.”
  rationale: Muktadha mpana wa Matendo 9 unamtambulisha msemaji wa maono kuwa Bwana anayemtuma Anania kwa Sauli. Tafsiri “Bwana” inadumisha maana hiyo ya kikristo bila kuongeza maelezo yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa simulizi umetumiwa kwa vitenzi vya mfululizo “akamwambia” na “akajibu.” Jina la mahali “Dameski” linafuata matumizi yaliyozoeleka katika Kiswahili cha Biblia.
