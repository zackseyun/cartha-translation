  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: sw
  text: Lakini Barnaba akamshika Sauli, akampeleka kwa mitume, akawaeleza jinsi Sauli alivyomwona Bwana njiani, na kwamba Bwana alizungumza naye, na jinsi Sauli alivyosema kwa ujasiri huko Damasko katika jina la Yesu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος
  choice: akamshika Sauli
  rationale: Kitenzi kina maana ya kumshika au kwenda naye. “Akamshika” kinahifadhi uzito wake halisi, huku jina “Sauli” likiweka wazi yule anayerejelewa bila kudokeza kukamatwa kwa uhasama.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: akampeleka kwa mitume
  rationale: Hii ni tafsiri ya kawaida na ya asili ya tendo la Barnaba la kumpeleka Sauli mbele ya mitume.
- source_word: διηγήσατο
  choice: kuwaeleza
  rationale: Kitenzi huonyesha kusimulia au kueleza jambo; “kuwaeleza” ni Kiswahili cha kawaida kinachofaa kwa maelezo yanayofuata.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: jinsi ... njiani
  rationale: Hapa ὁδός ni safari ya kwenda Damasko, si jina la harakati ya “Njia.”
- source_word: εἶδεν τὸν κύριον
  choice: alivyomwona Bwana
  rationale: “Bwana” huhifadhi cheo cha κύριος na uzito wake wa kikristolojia; muundo wa “alivyomwona” unaingia kwa kawaida katika taarifa ya Barnaba.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: kwamba Bwana alikuwa amesema naye
  rationale: 'Kurudia “Bwana” kunaondoa utata usio wa lazima wa viwakilishi vya Kiswahili: katika Kigiriki, kiima kinachoeleweka ni Bwana na αὐτῷ humrejelea Sauli.'
- source_word: ἐπαρρησιάσατο
  choice: alivyokuwa amesema kwa ujasiri
  rationale: Huhifadhi maana ya kusema kwa uhuru na ujasiri bila kuibana kuwa “kuhubiri,” ingawa muktadha unaweza kuhusisha mahubiri.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: katika jina la Yesu
  rationale: Huhifadhi nahau ya kibiblia inayoweza kujumuisha mamlaka, uhusiano na ukiri wa Yesu bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Mrejelewa wa “Bwana” katika tukio la njiani
  choice: “Bwana” anamrejelea Yesu
  alternative: “Bwana” kama rejeo la jumla zaidi kwa Mungu
  rationale: Muktadha wa Matendo 9 unamtambulisha Yesu aliyefufuka kuwa ndiye aliyemtokea Sauli, na mwisho wa aya unataja wazi jina la Yesu. Tafsiri inahifadhi cheo “Bwana” badala ya kukibadilisha kuwa maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya wahusika yamerudiwa mahali ambapo mfuatano wa viwakilishi ungeweza kutatanisha. “Damasko” limetumiwa kama umbo la kawaida la jina hilo katika Kiswahili cha Biblia.
