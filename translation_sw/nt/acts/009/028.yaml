source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: sw
  text: Naye alikuwa pamoja nao huko Yerusalemu, akiingia na kutoka, akisema kwa ujasiri katika jina la Bwana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: alikuwa pamoja nao
  rationale: Huhifadhi hali ya kuendelea ya kitenzi cha wakati usiotimilika pamoja na μετά, bila kuongeza wazo la kukaa mahali fulani.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: akiingia na kutoka
  rationale: Huhifadhi jozi ya vitenzi na maana ya kwenda na kurudi kwa uhuru huku akishirikiana nao mara kwa mara.
- source_word: εἰς Ἰερουσαλήμ
  choice: huko Yerusalemu
  rationale: Katika muundo huu, Yerusalemu ni eneo ambamo shughuli ilifanyika, si lazima lengo la kuingia mjini mara kwa mara.
- source_word: παρρησιαζόμενος
  choice: akisema kwa ujasiri
  rationale: Huonyesha kusema wazi na bila hofu; Kiswahili hiki ni cha kawaida na hakibani maana kuwa ujasiri wa ndani pekee.
- source_word: ἐν τῷ ὀνόματι
  choice: katika jina la
  rationale: Huhifadhi nahau ya kibiblia na upana wake wa mamlaka, uwakilishi, na ushuhuda bila kuifupisha kuwa maana moja tu.
- source_word: τοῦ κυρίου
  choice: Bwana
  rationale: Hutafsiri cheo κύριος bila kukibadili kuwa jina maalumu; katika muktadha kinamrejelea Yesu.
theological_decisions:
- issue: Mrejelewa wa τοῦ κυρίου
  choice: Cheo “Bwana” kimehifadhiwa katika matini.
  alternative: Kutaja wazi “Yesu.”
  rationale: Kigiriki kinasema κυρίου, si Ἰησοῦ. Muktadha unamwelekeza msomaji kwa Yesu, lakini tafsiri haipaswi kubadili cheo kuwa jina na hivyo kuondoa namna ya usemi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” huunganisha mstari na simulizi lililotangulia; “huko Yerusalemu” huweka wazi eneo la shughuli bila kuleta dhana potovu ya kuingia mjini mara nyingi.
