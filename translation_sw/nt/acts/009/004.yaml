base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: sw
  text: Akaanguka chini, akasikia sauti ikimwambia, “Sauli, Sauli, kwa nini unanitesa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: Akaanguka chini
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida tendo la kuanguka hadi chini, huku aoristi ya kishiriki ikiwasilishwa kwa mfuatano wa vitenzi vya masimulizi.
- source_word: ἤκουσεν φωνὴν
  choice: akasikia sauti
  rationale: Kwa kuwa sauti hiyo inanena maneno yanayoeleweka, φωνή hapa ni 'sauti,' si kelele isiyo na ujumbe.
- source_word: λέγουσαν αὐτῷ
  choice: ikimwambia
  rationale: Huwasilisha kwa Kiswahili cha kawaida sauti iliyokuwa ikisema maneno moja kwa moja kwake.
- source_word: Σαοὺλ Σαούλ
  choice: Sauli, Sauli
  rationale: Jina linatoholewa kwa umbo la Kiswahili lililozoeleka, na marudio yanahifadhiwa kwa sababu yana uzito wa kimkazo na wa balagha.
- source_word: τί
  choice: kwa nini
  rationale: Katika muundo huu τί hutumika kuuliza sababu, hivyo 'kwa nini' ndiyo tafsiri ya kawaida na sahihi.
- source_word: με
  choice: -ni- katika “unanitesa”
  rationale: Kiwakilishi cha nafsi ya kwanza kama yambwa kinahifadhiwa moja kwa moja ndani ya kitenzi cha Kiswahili.
- source_word: διώκεις
  choice: unanitesa
  rationale: Katika muktadha wa Matendo, διώκω humaanisha kuwatesa waumini kwa uadui; wakati uliopo unaonyesha tendo linaloendelea.
theological_decisions:
- issue: Mnenaji kujitambulisha moja kwa moja na wale ambao Sauli anawashambulia
  choice: Kuhifadhi yambwa ya moja kwa moja “-ni-” katika “unanitesa.”
  alternative: Kupanua kuwa “unawatesa watu wangu” au “unawatesa wafuasi wangu.”
  rationale: Andiko lenyewe linasema “mimi,” likihifadhi nguvu na mvutano wa kitheolojia wa mnenaji kujitambulisha na jumuiya inayoteswa bila kuongeza ufafanuzi ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. Mfuatano wa “aka-” unafaa usimulizi wa matukio, na “kuanguka chini” ni usemi wa kawaida kuliko tafsiri ngumu ya neno kwa neno kama “juu ya ardhi.”
