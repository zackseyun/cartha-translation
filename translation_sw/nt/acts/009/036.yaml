base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: sw
  text: Katika Yafa kulikuwa na mwanafunzi wa kike aliyeitwa Tabitha[a], jina ambalo, likitafsiriwa, huitwa Dorkasi. Alikuwa amejaa matendo mema na matendo ya huruma aliyokuwa akiyatenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dorkasi ni jina la Kigiriki linalolingana na Tabitha; jina hilo linamaanisha “paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθήτρια
  choice: mwanafunzi mmoja wa kike
  rationale: Nomino ya Kigiriki ni ya jinsia ya kike na inamtaja wazi mwanamke aliyekuwa mwanafunzi; Kiswahili kinahitaji ufafanuzi huu ili kuhifadhi taarifa hiyo kwa kawaida.
- source_word: Ἰόππῃ
  choice: Yafa
  rationale: Yafa ni umbo la kawaida la Kiswahili la jina la mahali Joppa.
- source_word: ὀνόματι Ταβιθά
  choice: aliyeitwa Tabitha
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau inayotambulisha jina la mtu.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: jina ambalo likitafsiriwa huitwa Dorkasi
  rationale: Inahifadhi wazo la kutafsiri jina la Kiaramu kwa jina lake linalolingana katika Kigiriki, badala ya kutoa maana yake tu.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: amejaa matendo mema
  rationale: Inawasilisha wingi na mwenendo wa kudumu wa matendo mazuri kwa lugha ya kawaida ya Kiswahili.
- source_word: ἐλεημοσυνῶν
  choice: matendo ya huruma
  rationale: Neno linaweza kumaanisha hasa kutoa msaada kwa wahitaji, lakini uchaguzi huu unahifadhi upana wa matendo ya rehema bila kuyafungia kwenye fedha pekee.
- source_word: ὧν ἐποίει
  choice: aliyokuwa akifanya
  rationale: Muundo huu unahifadhi hali endelevu au ya mazoea inayoonyeshwa na kitenzi cha wakati usiotimilika.
theological_decisions:
- issue: Jinsi ya kutafsiri nomino ya kike μαθήτρια
  choice: mwanafunzi mmoja wa kike
  alternative: mwanafunzi
  rationale: Tofauti na Kiingereza, Kiswahili hakionyeshi jinsia katika nomino 'mwanafunzi'; kuongeza 'wa kike' kunahifadhi taarifa ya wazi ya umbo la Kigiriki bila kuingiza fundisho la dhehebu.
- issue: Upeo wa maana ya ἐλεημοσυνῶν
  choice: matendo ya huruma
  alternative: utoaji wa sadaka kwa maskini
  rationale: Uchaguzi huu unaacha wazi kama matendo hayo yalikuwa msaada wa mali pekee au aina nyingine za huduma ya rehema, hivyo haupunguzi maana kupita ushahidi wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiunganishi δέ hakijatafsiriwa kwa neno la ziada mwanzoni, kwa kuwa hapa kinaendeleza simulizi. Alama ya tanbihi [a] imewekwa mara tu baada ya Tabitha.
