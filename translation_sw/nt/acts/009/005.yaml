  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: sw
  text: Naye akasema, “Wewe ni nani, Bwana[a]?” Naye akasema, “Mimi ni Yesu, ambaye wewe unamtesa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana,” kama anwani ya heshima. Neno la Kigiriki κύριε linaweza kutumiwa kama cheo cha heshima; hapa limetafsiriwa “Bwana” kwa kuzingatia mazingira ya ufunuo.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: akasema
  rationale: Kitenzi cha masimulizi cha wakati uliopita kimetafsiriwa kwa kiambishi cha mfuatano -ka-, ambacho ni cha kawaida katika simulizi la Kiswahili.
- source_word: δέ
  choice: Naye
  rationale: δέ hapa ni kiunganishi hafifu katika mfululizo wa simulizi; “naye” huhifadhi mtiririko bila kuleta utofautishaji mkali.
- source_word: Τίς εἶ
  choice: Wewe ni nani
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya swali la utambulisho; “wewe” pia inafaa katika usemi wa moja kwa moja.
- source_word: κύριε
  choice: Bwana
  rationale: “Bwana” ndiyo tafsiri ya kawaida ya κύριος na inafaa katika mazingira haya ya ufunuo, huku uwezekano wa maana ya heshima “bwana” ukielezwa katika tanbihi.
- source_word: Ἐγώ εἰμι
  choice: Mimi ni
  rationale: Kiwakilishi cha wazi ἐγώ kina mkazo; “Mimi ni” huhifadhi mkazo huo wa kujitambulisha bila kuongeza maana nyingine.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: ὃν σὺ διώκεις
  choice: ambaye wewe unamtesa
  rationale: “Ambaye” humrejelea Yesu kama mtu, “wewe” huhifadhi mkazo wa kiwakilishi cha Kigiriki, na “unamtesa” huonyesha tendo la sasa linaloendelea la uadui.
theological_decisions:
- issue: Maana ya κύριε katika swali la Sauli kabla msemaji hajajitambulisha
  choice: Bwana
  alternative: bwana (neno la heshima, kama “sir”)
  rationale: Neno la Kigiriki linaweza kuwa cheo cha heshima au kumaanisha “Bwana.” Mazingira ya msemaji wa mbinguni na ufunuo unaofuata yanaunga mkono “Bwana,” lakini tanbihi huhifadhi utata halisi wa wakati huo wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo wa kurudiwa kwa “akasema” umehifadhiwa kwa sababu upo katika Kigiriki; kiwakilishi “wewe” katika kishazi cha mwisho kimeachwa wazi ili kuonyesha mkazo wa σὺ.
