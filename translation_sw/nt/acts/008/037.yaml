  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: sw
  text: Filipo[a] akasema, “Ikiwa unaamini kwa moyo wako wote, unaweza.” Naye akajibu, akasema, “Ninaamini kwamba Yesu ndiye Masihi, Mwana wa Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupo katika hati za kale zaidi za Kigiriki, kutia ndani mafunjo ya karne ya tatu na kodeksi za karne ya nne za Sinaitiko na Vatikano, wala katika tafsiri za kale za Kikopti. Unapatikana katika mapokeo ya wengi ya Kibizanti na katika mapokeo ya Kilatini, na ulitajwa na mababa wa kanisa wa kale kama Ireneo na Sipriano mwishoni mwa karne ya pili. Mara nyingi wasomi huueleza kuwa kauli ya kale ya kiliturujia ya ubatizo ambayo baadaye iliingizwa katika simulizi la Matendo.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: inaruhusiwa
  rationale: Kitenzi hiki kisicho na mtenda maalumu huonyesha kwamba jambo linaruhusiwa. Katika muktadha huu, kinamaanisha kwamba mtu huyo anaweza kubatizwa, bila kuingiza neno ‘kubatizwa’ ambalo halipo katika mstari wenyewe.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: kwa moyo wako wote
  rationale: Hii ni nahau ya kibiblia inayoonyesha imani kamili na ya dhati; tafsiri ya moja kwa moja ni ya kawaida na inaeleweka vizuri katika Kiswahili.
- source_word: Πιστεύω
  choice: Ninaamini
  rationale: Katika ungamo hili, neno linaonyesha kukubali kwa imani utambulisho wa Yesu.
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: Yesu Kristo
  rationale: Muundo huu unamtaja Yesu kwa jina na cheo kinachotumiwa kama ‘Kristo’; tafsiri hii inafuata kwa karibu mpangilio na muundo wa Kigiriki bila kuongeza kiunganishi kisichokuwapo.
theological_decisions:
- issue: Maana ya Χριστός katika ungamo
  choice: Yesu Kristo
  alternative: Yesu ndiye Masihi
  rationale: ‘Kristo’ huhifadhi namna jina na cheo vinavyounganishwa katika Kigiriki (Ἰησοῦν Χριστόν). ‘Masihi’ hutoa maana ya cheo hicho, lakini muundo ‘ndiye Masihi’ ungefafanua kwa nguvu zaidi sintaksia kuliko maandishi ya Kigiriki yanavyolazimisha.
- issue: Kitu kinachoruhusiwa katika ἔξεστιν
  choice: inaruhusiwa
  alternative: unaweza kubatizwa
  rationale: Muktadha unaonyesha kwamba kinachoruhusiwa ni ubatizo, lakini Kigiriki hakirudii kitenzi ‘kubatizwa.’ Tafsiri imehifadhi udokezo huo badala ya kulifanya wazi ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kurudia ‘akajibu, akasema’ umehifadhiwa kwa sababu unaakisi Kigiriki, huku sentensi nzima ikibaki ya kawaida katika usimulizi wa kibiblia.
