  naturalness: “Unaweza” ni ya asili na wazi zaidi kuliko “inaruhusiwa” katika jibu la moja kwa moja. “Naye akajibu, akasema” ni marudio yanayokubalika katika mtindo wa masimulizi ya kibiblia, na yanaakisi ἀποκριθεὶς δὲ εἶπεν.
  terminology: “Masihi” ni tafsiri ya maana ya Χριστός na inafaa katika ungamo hili. “Mwana wa Mungu,” “moyo wako wote,” na “Filipo” ni istilahi za kawaida za Kiswahili Sanifu cha Afrika Mashariki. Dokezo la maandishi limehifadhi alama [a] na maelezo ya ushahidi wa maandishi kwa usahihi.
