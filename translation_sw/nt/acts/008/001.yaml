id: ACT.8.1
reference: Acts 8:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: sw
  text: Sauli naye alikuwa akikubaliana na kuuawa kwake.[a] Siku hiyo, mateso makali yakaanza dhidi ya kanisa lililokuwa Yerusalemu, nao wote wakatawanyika katika maeneo ya Uyahudi na Samaria, isipokuwa mitume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitendo cha kumuua.” Kigiriki kinarejelea kitendo cha kumuua, si kifo chake tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαῦλος
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: συνευδοκῶν
  choice: alikuwa akikubaliana na
  rationale: Muundo huu unaonyesha ridhaa ya Sauli iliyokuwa ikiendelea wakati wa tukio bila kudai kwamba yeye mwenyewe alishiriki moja kwa moja katika mauaji hayo.
- source_word: ἀναιρέσει αὐτοῦ
  choice: kuuawa kwake
  rationale: Hueleza kitendo cha mtu kuwekwa kifo kwa Kiswahili cha kawaida, bila kukipa moja kwa moja uhalali wa kisheria kwa kusema ‘kunyongwa’ au hukumu nzito zaidi kwa kusema ‘kuuawa kikatili’.
- source_word: διωγμὸς μέγας
  choice: mateso makali
  rationale: Ni usemi wa asili katika Kiswahili unaowasilisha ukubwa na ukali wa mateso yaliyoelekezwa kwa kanisa.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: dhidi ya kanisa lililokuwa Yerusalemu
  rationale: ‘Dhidi ya’ huonyesha uelekeo wa uadui, na kishazi cha mahali hulitambulisha kanisa linalozungumziwa.
- source_word: πάντες δὲ διεσπάρησαν
  choice: nao wote wakatawanyika
  rationale: Hudumisha msisitizo wa ‘wote’ na hali ya kutawanywa, huku kauli ya mwisho ikibainisha kuwa mitume walikuwa tofauti.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: katika maeneo ya Uyahudi na Samaria
  rationale: ‘Maeneo’ huwasilisha maana ya wilaya au sehemu mbalimbali za nchi hizo kwa lugha inayoeleweka kwa urahisi.
- source_word: πλὴν τῶν ἀποστόλων
  choice: isipokuwa mitume
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha kuonyesha tofauti.
theological_decisions:
- issue: Maana ya ἀναιρέσει αὐτοῦ kuhusu kifo cha Stefano
  choice: kuuawa kwake
  alternative: kunyongwa kwake; kifo chake; kuuliwa kwake
  rationale: ‘Kuuawa kwake’ huhifadhi wazo la kitendo cha kumweka mtu kifo bila kuamua kimya-kimya kama kilikuwa utekelezaji halali wa hukumu au kutumia neno lenye hukumu ya kimaadili iliyo wazi zaidi kuliko neno la Kigiriki.
- issue: Upeo wa πάντες (‘wote’)
  choice: nao wote wakatawanyika ... isipokuwa mitume
  alternative: waamini wote wakatawanyika; kila mtu akatawanyika
  rationale: Tafsiri inadumisha usemi mpana wa chanzo pamoja na tofauti iliyotajwa wazi kuhusu mitume, bila kuongeza utambulisho ambao haukutajwa moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Kiunganishi ‘naye’ kinabeba uhusiano wa δέ na simulizi iliyotangulia bila kuongeza kielezi cha wakati kisichokuwapo katika chanzo.
