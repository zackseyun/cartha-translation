base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: sw
  text: Kisha Roho akamwambia Filipo, “Ikaribie gari hili na uambatane nalo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Likaribie gari hili, ukae karibu nalo.”
    reason: Mchanganyiko wa Πρόσελθε na κολλήθητι unaweza kusisitiza kulikaribia gari na kuendelea kuwa karibu nalo.
lexical_decisions:
- source_word: εἶπεν
  choice: akamwambia
  rationale: Kitenzi hiki katika usimulizi kinaonyesha kusema kwa mtu fulani; “akamwambia” ni ya asili kwa Kiswahili na inajumuisha yule anayeambiwa kupitia kiambishi -mw-.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza mfululizo wa matukio, si kuonyesha utofauti mkubwa. “Kisha” inaleta mtiririko wa kawaida wa usimulizi.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Maandishi ya Kigiriki yanasema “Roho” bila kuongeza “Mtakatifu.” Tafsiri hii inadumisha namna hiyo huku muktadha wa Matendo ukielekeza kwa Roho Mtakatifu.
- source_word: τῷ Φιλίππῳ
  choice: Filipo
  rationale: Jina Φίλιππος limetolewa kwa umbo la Kiswahili lililozoeleka, “Filipo”; uhusiano wa yule anayeambiwa unaonyeshwa katika “akamwambia.”
- source_word: Πρόσελθε
  choice: Ikaribie
  rationale: Amri hii inamtaka Filipo asogee kuelekea gari. “Ikaribie” ni ya kawaida na inaonyesha wazi mwendo wa kulielekea.
- source_word: κολλήθητι
  choice: uambatane nalo
  rationale: κολλάομαι ina wazo la kujiunga au kushikamana kwa karibu. Katika tukio hili, “uambatane nalo” inaonyesha kwenda pamoja na gari kwa ukaribu bila kudokeza lazima alishike kwa mikono.
- source_word: τῷ ἅρματι τούτῳ
  choice: gari hili
  rationale: ἅρμα ni gari la wakati huo, mara nyingi gari la farasi. “Gari hili” ni Kiswahili cha asili na kinadumisha nguvu ya kiashiria τούτῳ, “hili.”
theological_decisions:
- issue: Anayerejelewa na τὸ πνεῦμα
  choice: Roho, ikieleweka katika muktadha kuwa Roho Mtakatifu
  alternative: roho au msukumo wa kiroho usiotajwa kwa uwazi zaidi
  rationale: Katika Matendo, “Roho” anayetoa mwongozo wa moja kwa moja kwa waamini ni Roho Mtakatifu. Hata hivyo, kwa kuwa kifungu hiki hakina neno ἅγιον, tafsiri haiongezi “Mtakatifu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa usimulizi na hadhi inayofaa maandiko. “Uambatane nalo” limechaguliwa ili kuonyesha ukaribu unaoendelea huku maana mbadala ikihifadhiwa katika tanbihi.
