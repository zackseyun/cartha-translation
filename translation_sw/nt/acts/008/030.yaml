  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: sw
  text: Basi Filipo akamwendea mbio, akamsikia akisoma kitabu cha nabii Isaya[a], akasema, “Je, kweli unaelewa unachosoma?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, kwa kweli unaelewa unachosoma?” Chembe za Kigiriki huongeza mkazo katika swali la Filipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: akakimbia kumfikia
  rationale: Kitenzi hiki huonyesha mwendo wa haraka kuelekea kwa mtu; usemi huu unadumisha picha hai ya Filipo kukimbia hadi alipokuwa msafiri.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ kinaendeleza simulizi; “Basi” ni kiunganishi cha kawaida na cha asili katika masimulizi ya Kiswahili.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: akamsikia akisoma
  rationale: Muundo wa Kigiriki unaonyesha kuwa Filipo alimsikia akiwa katika tendo la kusoma. Tafsiri haiongezi “kwa sauti,” kwa kuwa hilo halijasemwa wazi katika chanzo.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: kitabu cha nabii Isaya
  rationale: Katika muktadha, jina “Isaya” linarejelea maandishi ya nabii yaliyokuwa yakisomwa. Kuongeza “kitabu cha” hufanya maana hiyo iwe wazi na ya asili kwa Kiswahili bila kubadili kinachorejelewa.
- source_word: εἶπεν
  choice: akasema
  rationale: Hili ndilo neno la moja kwa moja la λέγω; alama ya swali inayofuata inaonyesha wazi kuwa kauli hiyo ni swali.
- source_word: Ἆρά γε
  choice: Je, kweli
  rationale: Muungano wa chembe hizi huleta swali lenye msisitizo au uchunguzi; “Je, kweli” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: γινώσκεις
  choice: unaelewa
  rationale: Katika muktadha huu, kitenzi kinahusu kufahamu maana ya maandishi, si kuyajua tu.
- source_word: ἃ ἀναγινώσκεις
  choice: unachosoma
  rationale: Kiwakilishi cha uhusiano kinarejelea maudhui yanayosomwa, na wakati wa sasa umehifadhiwa katika “unachosoma.”
