  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: sw
  text: Ndipo yule towashi akamjibu Filipo, akasema, “Nakuomba[a], nabii anasema hayo kumhusu nani? Je, anasema hayo kumhusu yeye mwenyewe au kumhusu mtu mwingine?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninakusihi.” Neno la Kigiriki linaonyesha ombi la heshima na linaweza pia kueleza msisitizo mkubwa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Ndipo ... akamjibu
  rationale: δέ inaendeleza simulizi, na ἀποκριθείς pamoja na kitenzi cha kusema huonyesha kujibu; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: ὁ εὐνοῦχος
  choice: yule towashi
  rationale: ‘Towashi’ huhifadhi maana mahsusi ya εὐνοῦχος badala ya kuifanya kwa ujumla kuwa ‘ofisa’; ‘yule’ humrejelea mhusika aliyetajwa katika muktadha.
- source_word: τῷ Φιλίππῳ
  choice: Filipo
  rationale: Dativi humtaja anayeelekezewa jibu; Kiswahili hutumia kiambishi cha yambwa katika ‘akamjibu Filipo’ bila kihusishi.
- source_word: Δέομαί σου
  choice: Nakuomba
  rationale: Huwasilisha ombi la heshima lenye uzito bila kulitia nguvu kupita muktadha.
- source_word: περὶ τίνος
  choice: kumhusu nani
  rationale: Hutoa kwa kawaida wazo la mada au mtu anayerejelewa na περί pamoja na jenitivi.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: nabii anasema hayo
  rationale: ‘Hayo’ hurejelea kwa asili maneno ya kifungu kilichokuwa kimesomwa, huku ‘nabii’ ikihifadhi nomino yenye uainisho wa kimuktadha.
- source_word: περὶ ἑαυτοῦ
  choice: Anajisema mwenyewe
  rationale: Muundo huu wa Kiswahili unaeleza kwamba nabii ndiye anayejizungumzia na huhifadhi urejeo wa kiwakilishi rejeshi.
- source_word: περὶ ἑτέρου τινός
  choice: mtu mwingine
  rationale: Huhifadhi tofauti kati ya nabii mwenyewe na mtu mwingine bila kuongeza utambulisho usiotajwa.
