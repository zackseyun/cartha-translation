  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: sw
  text: Lakini Filipo alipatikana huko Azoto[a]. Alipokuwa akisafiri, alikuwa akitangaza habari njema katika miji yote mpaka alipofika Kaisaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alijitokeza Azoto.” Kigiriki husema kihalisi, “alipatikana Azoto”; katika muktadha huenda ikaashiria kuhamishwa ghafula na Mungu, lakini haisemi hivyo wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wenye utofautishaji mdogo kutoka simulizi la Roho kumwondoa Filipo katika mstari uliotangulia.
- source_word: εὑρέθη
  choice: akajikuta
  rationale: Huwasilisha hali ya Filipo kupatikana mahali hapo kwa Kiswahili cha kawaida bila kueleza moja kwa moja namna alivyohamishwa; ingawa umbo la Kigiriki ni la kutendwa, tafsiri hii huepuka kauli isiyo ya kawaida ya ‘akap مatikana’ huku ikihifadhi mshangao wa simulizi.
- source_word: εἰς Ἄζωτον
  choice: Azoto
  rationale: Pamoja na kitenzi cha hali, εἰς hapa huonyesha mahali alipojikuta Filipo; Kiswahili hakihitaji kihusishi kabla ya jina hili la mahali.
- source_word: διερχόμενος
  choice: alipokuwa akipita katika eneo hilo
  rationale: Huhifadhi kitendo kinachoendelea sambamba na kutangaza na kufafanua kwa kawaida kuwa alipitia maeneo ya njiani.
- source_word: εὐηγγελίζετο
  choice: aliendelea kutangaza habari njema
  rationale: Huwasilisha hali endelevu au ya kurudiwa ya imperfect na maana ya kitenzi bila kutumia istilahi nzito ya kidini.
- source_word: τὰς πόλεις πάσας
  choice: katika miji yote
  rationale: Hurejelea kwa pamoja miji aliyopitia njiani; kihusishi ‘katika’ ni cha kawaida kwa kutangaza ndani ya maeneo hayo.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: mpaka alipofika
  rationale: Hueleza kikomo cha safari na cha shughuli inayoendelea kwa Kiswahili fasaha.
- source_word: εἰς Καισάρειαν
  choice: Kaisaria
  rationale: Baada ya ‘alipofika,’ jina la mahali pekee huonyesha kikomo cha mwendo kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Iwapo εὑρέθη ielezwe wazi kuwa Filipo alitokea kimiujiza baada ya kuhamishwa na Mungu
  choice: Kutumia ‘akajikuta’ katika matini kuu na kuweka tafsiri halisi zaidi katika tanbihi
  alternative: akaponekana Azoto; akapatikana Azoto
  rationale: Muktadha unaashiria tendo lisilo la kawaida la Mungu, lakini neno lenyewe halisemi wazi ‘alitokea.’ ‘Akajikuta’ huhifadhi mshangao na kutokutajwa kwa mtendaji bila kufafanua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Majina ya mahali yametolewa kama Azoto na Kaisaria. Muundo ‘akajikuta’ umetumiwa kwa uasilia wa Kiswahili, huku tanbihi ikihifadhi umbo halisi zaidi la passive ya Kigiriki.
