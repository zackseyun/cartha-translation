  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: sw
  text: Lakini Simoni alipoona kwamba Roho alitolewa kwa kuwekewa mikono na mitume[a], aliwapelekea fedha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho Mtakatifu.” Kigiriki kinasema tu “Roho,” lakini katika muktadha huu ni Roho Mtakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: alipoona
  rationale: Kivumishi-shiriki cha wakati uliopita kinaonyesha wakati na mfuatano wa tukio; “alipoona” ni Kiswahili cha kawaida na sahihi.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha badiliko au utofautishaji mdogo katika simulizi, hapa ikielekeza kwenye mwitikio wa Simoni.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων
  choice: kwa kuwekewa mikono na mitume
  rationale: διά pamoja na umilikishi huonyesha njia au chombo. Muundo huu wa Kiswahili unaeleza kwamba kuwekewa mikono na mitume kulikuwa njia ambayo kwa hiyo Roho alitolewa, bila kuwafanya mitume kuwa chanzo chake cha mwisho.
- source_word: δίδοται
  choice: alitolewa
  rationale: Kauli tendwa imehifadhiwa; wakati uliopita unafaa muktadha wa simulizi la Kiswahili.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Maandishi ya Kigiriki yanasema “Roho” tu; herufi kubwa inaonyesha rejeleo la kibinafsi linaloeleweka katika muktadha bila kuongeza neno “Mtakatifu” katika matini kuu.
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: aliwapa fedha
  rationale: προσφέρω hapa ni kuleta au kutoa kitu kwa mtu. “Aliwapa fedha” ni usemi wa kawaida unaowasilisha tendo hilo; muktadha unaofuata unaonyesha kusudi la malipo.
theological_decisions:
- issue: Rejeleo la τὸ πνεῦμα
  choice: Roho, akimaanisha Roho Mtakatifu
  alternative: Roho Mtakatifu
  rationale: Muktadha wa karibu unamtambulisha wazi kuwa Roho Mtakatifu, lakini matini kuu inahifadhi usemi mfupi wa Kigiriki, “Roho”; tanbihi inaweka wazi rejeleo.
- issue: Njia ambayo Roho alitolewa
  choice: Roho alitolewa kwa kuwekewa mikono na mitume
  alternative: Roho Mtakatifu alitolewa kwa tendo la mitume la kuweka mikono
  rationale: Tafsiri inahifadhi wazo la njia au chombo bila kudai kwamba mitume ndio chanzo cha mwisho cha Roho au kuingiza hitimisho la kimadhehebu kuhusu tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Kuwekewa mikono” ni usemi wa kawaida wa kibiblia unaoeleweka; “fedha” hapa ina maana ya pesa, si lazima madini ya fedha.
