translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Muundo wa masharti umehifadhi hali ya kutoweza bila msaada, na ‘kuniongoza’ huhifadhi upana wa sitiari ya Kigiriki.
