base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: sw
  text: Naye akasema, “Ningewezaje, isipokuwa mtu fulani aniongoze?” Kisha akamsihi Filipo apande na kuketi pamoja naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwomba Filipo apande na kuketi pamoja naye.” Kitenzi cha Kigiriki kinaweza kumaanisha kusihi kwa dhati au kuomba/kualika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Ningewezaje kuelewa
  rationale: Hali ya uwezekano inayotolewa na optative pamoja na ἄν imehifadhiwa kwa ‘ningewezaje.’ Kitenzi ‘kuelewa’ kimewekwa wazi kutokana na muktadha wa swali kuhusu kuelewa Maandiko, ingawa hakitajwi moja kwa moja katika Kigiriki.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: ikiwa hakuna mtu wa kuniongoza
  rationale: ὁδηγέω ina maana ya kuongoza au kuelekeza. ‘Kuniongoza’ huhifadhi picha ya uongozi na pia maana ya kusaidiwa kuelewa, bila kuibana kuwa ‘kunifafanulia.’
- source_word: παρεκάλεσέν
  choice: akamsihi
  rationale: παρακαλέω hapa ni ombi la dhati. ‘Akamsihi’ lina nguvu zaidi ya ‘akamwomba’ bila lazima kumaanisha ombi la kukata tamaa.
- source_word: τε
  choice: Kisha
  rationale: Chembe τε inaunganisha matukio kwa upole; ‘Kisha’ huonyesha mwendelezo wa simulizi kwa Kiswahili cha kawaida.
- source_word: ἀναβάντα
  choice: apande
  rationale: ἀναβαίνω humaanisha kupanda au kwenda juu. ‘Apande’ huhifadhi taswira ya Filipo kupanda ndani ya gari.
- source_word: καθίσαι σὺν αὐτῷ
  choice: kuketi pamoja naye
  rationale: σύν pamoja na dative humaanisha kuwa pamoja na mtu. Tafsiri hii haiongezi dhana ya ‘kando yake,’ ambayo inawezekana lakini si ya lazima.
- source_word: Φίλιππον
  choice: Filipo
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
