base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: sw
  text: Lakini Sauli alikuwa akiliharibu vibaya[a] kanisa, akiingia nyumba baada ya nyumba[b], akiwaburuta wanaume na wanawake na kuwapeleka gerezani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, alikuwa akiliangamiza kanisa.
    reason: lexical_alternative
  - marker: b
    text: Au, kutoka nyumba moja hadi nyingine. Msemo wa Kigiriki unaweza kutafsiriwa kwa namna zote mbili; “nyumba baada ya nyumba” unasisitiza tendo lililorudiwa katika kila nyumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: alikuwa akiliharibu vibaya
  rationale: Kitenzi hiki kina nguvu kuliko ‘kutesa’ kwa kawaida na kinaonyesha madhara makali na ya kuendelea; muundo ‘alikuwa aki-’ unadumisha hali ya tendo lililokuwa likiendelea.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Katika muktadha huu neno linamaanisha jumuiya ya waamini, si jengo wala mkutano wa kiraia; ‘kanisa’ ndiyo istilahi ya kawaida na inayoeleweka katika Kiswahili.
- source_word: κατὰ τοὺς οἴκους
  choice: nyumba baada ya nyumba
  rationale: Muundo huu unaonyesha tendo la kugawanyika na kurudiwa katika nyumba nyingi moja baada ya nyingine.
- source_word: εἰσπορευόμενος
  choice: Aliingia
  rationale: Katika Kiswahili, sentensi huru inatoa mtiririko wa asili huku ikiendelea kueleza namna Sauli alivyokuwa akiliharibu kanisa.
- source_word: σύρων
  choice: akawaburuta
  rationale: ‘Kuburuta’ huhifadhi maana ya kuwaondoa watu kwa nguvu.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: wanaume kwa wanawake
  rationale: Msemo huu wa kawaida unasisitiza kwamba Sauli hakubagua jinsia katika kuwakamata.
- source_word: παρεδίδου
  choice: kuwatia
  rationale: Katika kishazi ‘kuwatia gerezani,’ neno hili linaeleza kwa kawaida kuwapeleka na kuwaweka chini ya kifungo; muktadha wa vitendo vinavyorudiwa unaendelezwa na ‘alikuwa’ katika sentensi iliyotangulia.
- source_word: εἰς φυλακήν
  choice: gerezani
  rationale: Hapa φυλακή linamaanisha kifungo au mahali pa kuwafungia, na ‘gerezani’ ni tafsiri ya kawaida na iliyo wazi.
theological_decisions:
- issue: Ukali wa matendo ya Sauli kabla ya kuongoka
  choice: alikuwa akiliharibu vibaya kanisa
  alternative: alikuwa akilitesa kanisa
  rationale: Tafsiri iliyochaguliwa inadumisha nguvu ya λυμαίνομαι na kuonyesha madhara ya kikatili na ya kimfumo bila kuingiza maelezo ya kitheolojia yasiyosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumiwa ili kuepuka muundo mzito wa vivumishi-tendo huku uhusiano wa matendo ukihifadhiwa.
