source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: sw
  text: Lakini walipomwamini Filipo, alipokuwa akitangaza habari njema kuhusu ufalme wa Mungu na jina la Yesu Masihi[a], walikuwa wakibatizwa, wanaume na wanawake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jina la Yesu Kristo.” Neno la Kigiriki Χριστός limetafsiriwa “Masihi” hapa ili kuhifadhi maana yake kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini walipo-
  rationale: ὅτε inaonyesha wakati, na δέ inaleta badiliko au utofautishaji mdogo katika simulizi. Muundo “Lakini walipo-” ni wa kawaida na hauzidishi nguvu ya utofautishaji.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: walipomwamini Filipo
  rationale: Kitenzi πιστεύω pamoja na yambwa katika hali ya dative hapa humaanisha kumwamini mtu kama msemaji au shahidi, si kumweka mtu huyo kuwa kiini cha imani ya wokovu. Tafsiri hii inadumisha tofauti hiyo bila kuongeza neno “ujumbe,” ambalo halipo wazi katika Kigiriki.
- source_word: εὐαγγελιζομένῳ
  choice: alipokuwa akitangaza habari njema
  rationale: Kirai hiki cha wakati uliopo kinaeleza shughuli ya Filipo wakati walipomwamini. “Kutangaza habari njema” ni lugha wazi na ya sasa inayohifadhi maana ya εὐαγγελίζω.
- source_word: περὶ
  choice: kuhusu
  rationale: περί pamoja na genitive hutaja mada ya tangazo la Filipo; “kuhusu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hili ndilo neno lililozoeleka na linaloeleweka kwa βασιλεία τοῦ θεοῦ, huku likiacha wigo wake wa maana—ufalme, utawala, na enzi—uonekane katika muktadha.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: jina la Yesu Masihi
  rationale: “Jina” limehifadhiwa kwa sababu linaweza kuhusisha utambulisho, mamlaka, na nafsi inayowakilishwa na jina hilo. Χριστός limetafsiriwa “Masihi” ili kuhifadhi maana yake ya cheo.
- source_word: ἐβαπτίζοντο
  choice: walikuwa wakibatizwa
  rationale: Wakati imperfect na kauli ya kutendwa huonyesha tendo lililokuwa likiendelea au kurudiwa kadiri watu walivyoitikia. “Walikuwa wakibatizwa” huhifadhi hali hiyo kuliko “walibatizwa.”
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: wanaume kwa wanawake
  rationale: τε ... καὶ inaunganisha makundi yote mawili kwa mkazo jumuishi. “Wanaume kwa wanawake” ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba wote walihusika.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Katika muktadha huu Χριστός linafanya kazi kama cheo cha kimasihi, si kama jina la ukoo. “Masihi” hudumisha maana hiyo ya cheo; tanbihi inatoa umbo jingine lililozoeleka bila kufuta mvutano wa istilahi.
- issue: Maana ya kumwamini Filipo
  choice: walipomwamini Filipo
  alternative: walipoamini ujumbe wa Filipo
  rationale: Kigiriki kinamtaja Filipo moja kwa moja kama yambwa la πιστεύω. Tafsiri haibadili usemi huo kuwa imani ya wokovu katika Filipo, wala haiongezi “ujumbe” ndani ya matini, ingawa habari aliyotangaza ndiyo muktadha wa kuamini kwao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mtiririko wa Kigiriki huku ukitumia vitenzi vya Kiswahili vinavyohifadhi hali ya tendo linaloendelea.
