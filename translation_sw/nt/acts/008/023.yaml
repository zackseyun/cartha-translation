  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: sw
  text: Kwa maana ninaona kwamba uko katika nyongo ya uchungu[b] na kifungo cha uovu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnyororo wa udhalimu” au “pingu ya uovu.”
    reason: lexical_alternative
  - marker: b
    text: “Nyongo ya uchungu” ni sitiari yenye nguvu, huenda ikiakisi lugha ya Agano la Kale kuhusu uchungu wenye sumu (linganisha Kumbukumbu la Torati 29:18 katika tafsiri ya Kigiriki).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: umo katika
  rationale: Katika muundo huu, εἰς inaeleza hali ambayo Simoni yumo, si mwendo wa kuingia mahali. “Umo katika” hudumisha picha ya kuwa ndani ya hali hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ inatoa sababu ya onyo lililotangulia; “kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: χολὴν πικρίας
  choice: nyongo ya uchungu
  rationale: Tafsiri hii inadumisha sitiari kali ya χολή, yaani nyongo, badala ya kuirahisisha kuwa uchungu tu. Muundo wa “ya uchungu” pia unahifadhi ufupi na mvutano wa usemi wa Kigiriki.
- source_word: σύνδεσμον ἀδικίας
  choice: kifungo cha uovu
  rationale: σύνδεσμος ni kitu kinachofunga au hali ya kufungwa; “kifungo” huwasilisha maana hiyo kwa kawaida. Katika muktadha huu ἀδικία inaelekea kwenye ubaya wa kimaadili, hivyo “uovu” inafaa, huku maana ya “udhalimu” ikitajwa katika tanbihi.
- source_word: ὁρῶ
  choice: ninaona
  rationale: “Ninaona” huhifadhi maana ya moja kwa moja ya kitenzi na pia hutumika kwa kawaida kueleza utambuzi wa hali ya mtu.
- source_word: σε ὄντα
  choice: kwamba umo
  rationale: Muundo wa shamirisho pamoja na participio baada ya ὁρῶ umetafsiriwa kwa kishazi cha “kwamba,” ambacho ni cha asili katika Kiswahili na kinahifadhi maana.
theological_decisions:
- issue: Maelezo ya kisitiari kuhusu hali ya kiroho na kimaadili ya Simoni
  choice: 'Sitiari mbili zimedumishwa: “nyongo ya uchungu” na “kifungo cha uovu.”'
  alternative: “Umejaa sumu ya uchungu na umetawaliwa na dhambi/udhalimu.”
  rationale: Kigiriki kinatumia sitiari fupi na kali bila kutoa ufafanuzi kamili wa kimafundisho. Kuzidumisha huepuka kuamua kimya kimya ikiwa mkazo ni sumu, dhambi, udhalimu, au aina maalumu ya utumwa wa kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyongo ya uchungu” ni usemi usio wa kawaida kimakusudi ili kuhifadhi picha halisi na ukali wa Kigiriki; tanbihi husaidia kuonyesha mwangwi wake wa kibiblia. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
