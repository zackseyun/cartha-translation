  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: sw
  text: Kwa maana watu wengi waliokuwa na pepo wachafu[a], pepo hao waliwatoka huku wakipiga kelele kwa sauti kubwa; na watu wengi waliopooza na waliokuwa viwete waliponywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakilia kwa sauti kubwa.” Katika Kigiriki, kirai hiki kwa kawaida huwaeleza pepo wachafu walipokuwa wakitoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: Kwa maana watu wengi waliokuwa na
  rationale: “Kwa maana” inadumisha uhusiano wa maelezo unaoletwa na γάρ, na muundo huu unawatambulisha kwa Kiswahili cha kawaida watu wengi waliokuwa katika hali hiyo.
- source_word: πνεύματα ἀκάθαρτα
  choice: pepo wachafu
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika Kiswahili cha Biblia kwa roho waovu wanaomtawala au kumsumbua mtu; pia linahifadhi wazo la ἀκάθαρτα, ‘wachafu.’
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: huku wakipiga kelele kwa sauti kubwa
  rationale: Muundo huu unahifadhi tendo linaloendelea pamoja na ukubwa wa sauti, na kiwakilishi cha ngeli kinaonyesha kwamba pepo ndio waliokuwa wakipiga kelele.
- source_word: ἐξήρχοντο
  choice: waliwatoka
  rationale: Katika muktadha wa kutoa pepo, ‘waliwatoka’ ni Kiswahili cha asili kinachoonyesha kwamba pepo waliondoka ndani ya watu waliokuwa nao.
- source_word: πολλοὶ δὲ
  choice: na watu wengi
  rationale: δέ hapa inaendeleza taarifa badala ya kuleta utofauti mkali; ‘na’ huunganisha matendo hayo kwa kawaida.
- source_word: παραλελυμένοι
  choice: waliopooza
  rationale: Neno hili linaeleza hali ya kupooza iliyowapata watu; ‘waliopooza’ ni wazi na la sasa katika Kiswahili sanifu.
- source_word: χωλοὶ
  choice: waliokuwa vilema
  rationale: Hueleza watu waliokuwa na ulemavu wa kutembea; muundo huu ni wa heshima na unaeleweka kwa wasomaji wa kawaida.
- source_word: ἐθεραπεύθησαν
  choice: waliponywa
  rationale: Kauli tendwa inadumishwa na haiongezi mtendaji ambaye hakutajwa moja kwa moja katika kishazi.
theological_decisions:
- issue: Ni nani waliopiga kelele na kutoka?
  choice: Pepo wachafu ndio waliopiga kelele kwa sauti kubwa walipokuwa wakiwatoka watu.
  alternative: Watu waliokuwa na pepo ndio waliopiga kelele huku pepo wakiwatoka.
  rationale: Kirai kishirikishi cha Kigiriki βοῶντα ni cha wingi wa ngeli isiyo na jinsia na kwa kawaida kinapatana na πνεύματα ἀκάθαρτα. Kurudia ‘pepo hao’ kunaweka rejeleo hilo wazi katika Kiswahili bila kuondoa uwezekano wa msomaji kuona maelezo ya kisarufi katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kurudiwa kwa ‘pepo hao’ kunaepusha kiwakilishi kisicho wazi katika kishazi cha kwanza, huku sentensi ikibaki rahisi kusomeka kwa sauti.
