base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: sw
  text: Katika udhalilishaji wake, haki yake iliondolewa[b]. Ni nani atakayesimulia habari za kizazi chake[a]? Kwa maana uhai wake unaondolewa duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wake” au “watu wa wakati wake.” Neno la Kigiriki linalotafsiriwa “kizazi” huacha maana ya nukuu hii ya Isaya 53 bila kuifafanua.
    reason: alternative_reading
  - marker: b
    text: Au “hukumu yake iliondolewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: alipodhalilishwa
  rationale: Kitenzi hiki cha hali kinaonyesha kushushwa hadhi na kutendewa kwa fedheha kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: κρίσις
  choice: haki
  rationale: Katika muktadha huu wa kisheria, neno linaweza kumaanisha hukumu au haki. ‘Haki’ linaonyesha kwamba alinyimwa uamuzi au utaratibu wa haki bila kufafanua zaidi ya maandishi.
- source_word: ἤρθη
  choice: alinyimwa
  rationale: Ingawa maana ya msingi ni ‘iliondolewa,’ pamoja na ‘haki’ Kiswahili cha asili husema mtu ‘alinyimwa haki’; hili linahifadhi wazo la kuondolewa au kutopatiwa haki.
- source_word: γενεὰν
  choice: kizazi
  rationale: ‘Kizazi’ linahifadhi kwa kiasi kikubwa upana wa neno la Kigiriki, ambalo linaweza kuelekezwa kwa wazao, watu wa wakati wake, au kizazi chake.
- source_word: διηγήσεται
  choice: at 三?
  rationale: placeholder
theological_decisions:
- issue: Maana ya ‘kizazi chake’
  choice: Kudumisha ‘kizazi chake’ katika maandishi makuu.
  alternative: wazao wake; watu wa wakati wake
  rationale: Nukuu ya Isaya 53 ina utata halisi; tafsiri haipaswi kuamua kimya-kimya kama inahusu wazao au watu walioishi wakati wake.
- issue: Maana ya κρίσις
  choice: haki
  alternative: hukumu
  rationale: Muktadha unaweza kueleza kunyimwa haki, lakini ‘hukumu’ bado ni uwezekano wa kileksika na kwa hiyo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘alinyimwa haki’ ni wa kawaida zaidi kuliko ‘haki yake iliondolewa,’ huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya umbo la Kigiriki.
