  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: sw
  text: Lakini Simoni akajibu, “Ninyi mwombeni Bwana kwa ajili yangu, ili nisipatwe na lolote kati ya hayo mliyosema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: Lakini Simoni akajibu
  rationale: Muundo wa Kigiriki unaanzisha jibu la Simoni kwa namna ya kawaida; ‘akajibu’ huwasilisha wazo hilo kwa Kiswahili cha asili bila kurudia ‘akajibu akasema.’ δέ inaonyesha badiliko lenye utofautishaji mdogo, hivyo ‘Lakini’ linafaa.
- source_word: Δεήθητε ὑμεῖς
  choice: Ninyi mwombeni
  rationale: Kiwakilishi ὑμεῖς kimetajwa wazi kwa msisitizo, kwa hiyo ‘Ninyi’ kinahifadhi ombi la Simoni kwamba wao wenyewe waombe. ‘Mwombeni’ ni amri ya wingi na kwa kawaida humaanisha kumwomba mtu; mtendwa Bwana anafuata.
- source_word: ὑπὲρ ἐμοῦ
  choice: kwa ajili yangu
  rationale: Huwasilisha maombezi yanayofanywa kwa niaba ya Simoni kwa lugha ya kawaida na yenye heshima.
- source_word: πρὸς τὸν κύριον
  choice: Bwana
  rationale: Pamoja na kitenzi ‘mwombeni,’ Kiswahili hakihitaji kihusishi kinacholingana moja kwa moja na πρός; ‘mwombeni Bwana’ huonyesha wazi anayeelekezewa ombi. κύριος limehifadhiwa kuwa ‘Bwana’ bila kufafanua zaidi.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: ili nisipatwe na lolote
  rationale: ‘Ili’ huhifadhi kusudi au matokeo yaliyokusudiwa. ‘Nisipatwe na lolote’ ni Kiswahili cha asili kwa jambo, hasa baya au la hukumu, kumjia mtu, huku kikihifadhi hali ya uwezekano ya subjunktivu.
- source_word: ὧν εἰρήκατε
  choice: kati ya hayo mliyosema
  rationale: 'Huhifadhi uhusiano wa μηδέν na genitivi ya kiwakilishi: asiingiwe na jambo lolote miongoni mwa mambo waliyosema. ‘Mliyosema’ huonyesha kwamba maneno yao yaliyotangulia bado ndiyo yanayorejelewa.'
theological_decisions:
- issue: Mrejelewa wa τὸν κύριον
  choice: Bwana
  alternative: Mungu; Bwana Yesu
  rationale: Kigiriki kinasema tu ‘Bwana.’ Muktadha haulazimishi tafsiri ibainishe kama mrejelewa ni Mungu au Bwana Yesu, hivyo kiwango cha kutobainisha cha matini asilia kinahifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Msisitizo wa ὑμεῖς umehifadhiwa kwa ‘Ninyi,’ na sentensi imeundwa kwa mtiririko wa kawaida wa Kiswahili.
