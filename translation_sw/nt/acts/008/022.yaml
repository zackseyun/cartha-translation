  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: sw
  text: Basi, tubu uovu wako huu, na umwombe Bwana, huenda nia ya moyo wako ikasamehewa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huenda wazo la moyo wako likasamehewa.”
    reason: Neno ἐπίνοια linaweza kumaanisha “nia” au “wazo”; hapa “nia” linaonyesha zaidi kusudi la ndani, lakini “wazo” linafuata maana pana na ya karibu zaidi ya neno hilo.
lexical_decisions:
- source_word: μετανόησον
  choice: tubu
  rationale: Kitenzi hiki cha amri kinadai toba ya dhati na ya uamuzi; “tubu” ni neno la kawaida na lenye uzito unaofaa katika Kiswahili cha Biblia.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na karipio la Petro lililotangulia.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: na kuacha uovu wako huu
  rationale: Kihusishi ἀπό kinaonyesha kugeuka na kujitenga na uovu. Kiswahili cha asili huonyesha maana hiyo kwa “tubu na kuacha,” huku “uovu wako huu” ikihifadhi msisitizo wa umilikaji na jambo mahsusi.
- source_word: δεήθητι
  choice: umwombe
  rationale: Ni ombi la dhati linaloelekezwa kwa Bwana; “umwombe” ni la kawaida na linafaa katika muktadha wa sala.
- source_word: τοῦ κυρίου
  choice: Bwana
  rationale: “Bwana” ndiyo tafsiri ya kawaida ya κύριος na haimlazimishi msomaji kuamua zaidi kama hapa anatajwa Yesu au Mungu kwa ujumla katika sala ya Kikristo.
- source_word: εἰ ἄρα
  choice: huenda
  rationale: “Huenda” huhifadhi hali ya uwezekano na kutokuwa na uhakika bila kudokeza kwamba msamaha umehakikishwa au hauwezekani.
- source_word: ἀφεθήσεταί σοι
  choice: ikasamehewa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na wazo la msamaha unaoweza kutolewa, bila kumtaja moja kwa moja mtendaji.
- source_word: ἡ ἐπίνοια
  choice: nia
  rationale: Katika muktadha huu neno linahusu kusudi au dhamira ya ndani iliyokuwa nyuma ya ombi la Simoni; “nia” huwasilisha upande huo wa kimaadili vizuri kuliko “wazo” pekee.
- source_word: τῆς καρδίας σου
  choice: ya moyo wako
  rationale: Huhifadhi muundo na taswira ya kibiblia inayouonyesha moyo kuwa kitovu cha nia ya ndani.
theological_decisions:
- issue: Kiwango cha uhakika kwamba msamaha utatolewa
  choice: 'Kauli “huenda ... ikasamehewa” inaacha matokeo kuwa ya uwezekano: Simoni anaagizwa kutubu na kuomba, lakini msamaha hauhakikishwi wala kutangazwa kuwa hauwezekani.'
  alternative: Kutafsiri kana kwamba msamaha umehakikishwa mara tu anapotubu, au kana kwamba msamaha wake hauwezekani.
  rationale: Muungano εἰ ἄρα pamoja na kitenzi cha wakati ujao katika hali ya kutendwa ni wa tahadhari; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tubu na kuacha” ni mtiririko wa asili unaoonyesha nguvu ya ἀπό, na nukta mkato hutenganisha agizo la sala na kauli ya uwezekano bila kuondoa uhusiano wake.
