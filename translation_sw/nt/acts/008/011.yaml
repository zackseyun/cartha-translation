  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: sw
  text: Nao walikuwa wakimtilia maanani, kwa sababu alikuwa amewastaajabisha kwa muda mrefu kwa uchawi wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεῖχον
  choice: walimsikiliza kwa makini
  rationale: Kitenzi kinaonyesha kumwelekezea mtu fikira na kumsikiliza; kauli hii ni ya kawaida katika Kiswahili na wakati uliopita unaoendelea unaafikiana na muktadha.
- source_word: αὐτῷ
  choice: -m- katika “walimsikiliza”
  rationale: Yambwa ya mtu imeingizwa kiasili katika muundo wa kitenzi cha Kiswahili, ikimrejelea Simoni.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: kwa sababu kwa muda mrefu
  rationale: Muundo huu unaonyesha sababu, na ἱκανῷ χρόνῳ hueleza kipindi kirefu au cha kutosha; “kwa muda mrefu” ni wazi na ya kawaida.
- source_word: ταῖς μαγείαις
  choice: kwa uchawi wake
  rationale: μαγεία inahusu matendo ya kichawi. “Uchawi” ni neno la kawaida na lenye hadhi katika Kiswahili; “wake” linaongezwa kutokana na muktadha unaoonyesha kuwa matendo hayo yalikuwa ya Simoni.
- source_word: ἐξεστακέναι
  choice: alikuwa amewastaajabisha
  rationale: Kauli timilifu inaonyesha athari iliyokuwa imetokea na kuendelea kuwa msingi wa wao kumsikiliza. “Kuwastaajabisha” huhifadhi maana ya kusababisha mshangao bila kudai kwamba walilogwa.
- source_word: αὐτούς
  choice: -wa- katika “amewastaajabisha”
  rationale: Kiambishi cha yambwa kinawarejelea watu waliotajwa katika muktadha.
theological_decisions:
- issue: Asili ya matendo ya Simoni katika μαγείαις
  choice: “uchawi wake,” bila kueleza ikiwa ulikuwa udanganyifu, nguvu za kiroho, au vyote viwili
  alternative: “matendo yake ya kichawi” au “ulozi wake”
  rationale: Aya inataja μαγεία na athari yake kwa watu lakini haifafanui asili yake ya kimetafizikia. Tafsiri haiongezi uamuzi wa kimadhehebu wala kudai kwamba watu walikuwa wamelogwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. “Walimsikiliza kwa makini” ni cha asili kuliko tafsiri ya moja kwa moja ya “walimwelekezea fikira.” Hakuna tanbihi iliyohitajika kwa sababu “kwa muda mrefu” na “uchawi” zinawakilisha maana za Kigiriki kwa uwazi bila kupoteza utata muhimu.
