base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: sw
  text: Akaamuru gari la farasi lisimame. Kisha wote wawili—Filipo na yule towashi—wakashuka na kuingia majini[a], naye Filipo akambatiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakashuka mpaka majini”; hata hivyo, kihusishi cha Kigiriki kwa kawaida huonyesha mwendo wa kuingia majini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: akaamuru
  rationale: Kitenzi hiki kina maana ya kutoa amri; “akaamuru” ni cha kawaida na kinadumisha uzito wa mamlaka uliomo katika Kigiriki.
- source_word: στῆναι τὸ ἅρμα
  choice: gari lisimame
  rationale: Katika muktadha huu infinitivu inaeleza kulifanya gari likome kwenda. “Gari lisimame” ni Kiswahili cha asili na kinachoeleweka kwa urahisi.
- source_word: ἅρμα
  choice: gari
  rationale: Neno la Kigiriki linaweza kumaanisha gari la farasi au gari la kukokotwa. “Gari” ni neno pana na la kawaida linalofaa chombo cha usafiri katika simulizi hili bila kuongeza maelezo yasiyotajwa.
- source_word: κατέβησαν
  choice: wakashuka
  rationale: “Wakashuka” linawasilisha moja kwa moja maana ya kwenda chini; kirai kinachofuata kinaonyesha walikoelekea.
- source_word: ἀμφότεροι
  choice: wote wawili
  rationale: Tafsiri hii inadumisha msisitizo kwamba watu hao wawili walifanya tendo hilo pamoja.
- source_word: εἰς τὸ ὕδωρ
  choice: na kuingia majini
  rationale: εἰς kwa kawaida huonyesha mwendo wa kuingia ndani. Usemi huu unadumisha mwelekeo huo kwa Kiswahili cha asili bila kutoa hitimisho la kimadhehebu kuhusu namna ya ubatizo.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: Filipo na yule towashi
  rationale: Majina haya yanawatambulisha wazi wale wawili waliotajwa na ἀμφότεροι. “Yule” humrejelea towashi ambaye tayari ametajwa katika simulizi.
- source_word: εὐνοῦχος
  choice: towashi
  rationale: “Towashi” ndiyo maana ya kawaida na ya moja kwa moja hapa, na inadumisha mwendelezo wa utambulisho wa mtu huyu katika simulizi.
- source_word: ἐβάπτισεν αὐτόν
  choice: naye Filipo akambatiza
  rationale: “Akambatiza” hutumia istilahi ya kawaida ya Kikristo bila kuibadili kuwa neno linaloamua namna ya ubatizo. Kumtaja Filipo kunaweka wazi mhusika wa tendo, ambaye anaeleweka katika Kigiriki.
theological_decisions:
- issue: Ikiwa tafsiri iamue namna ya ubatizo
  choice: Kudumisha kwamba wote wawili waliingia majini na kutumia kitenzi “akambatiza.”
  alternative: Kutumia “akamzamisha” ili kuonyesha namna fulani ya ubatizo, au kupunguza nguvu ya εἰς kwa kusema walifika tu majini.
  rationale: Kigiriki kinasema wote wawili walishuka wakaingia majini na kwamba Filipo alimbatiza towashi. Tafsiri inadumisha mambo hayo bila kuongeza hitimisho la kimadhehebu lisiloamuliwa na sentensi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi ya kwanza na alama za vistari katika sentensi ya pili zinafanya wahusika na mtiririko wa matendo kuwa wazi. “Gari” limechaguliwa badala ya istilahi ndefu au ya kale ili maandishi yaeleweke kwa wasomaji wa kawaida.
