  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: sw
  text: Naye Simoni mwenyewe pia akaamini. Baada ya kubatizwa, akaendelea kushikamana na Filipo; alipokuwa akiona ishara na matendo makubwa ya nguvu[a] yakitendeka, alistaajabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miujiza mikubwa.” Neno la Kigiriki linaweza kumaanisha maonyesho au matendo ya nguvu, na pia miujiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: mwenyewe pia
  rationale: Huhifadhi msisitizo wa αὐτός pamoja na maana ya nyongeza ya καί, yaani kwamba Simoni pia aliitikia.
- source_word: ἐπίστευσεν
  choice: akaamini
  rationale: Hutoa maana ya kitenzi moja kwa moja bila kuamua kama imani ya Simoni ilikuwa ya kweli, ya juu juu, au ya muda tu.
- source_word: βαπτισθεὶς
  choice: baada ya kubatizwa
  rationale: Huweka wazi kwamba ubatizo ulitangulia tendo la kuendelea kushikamana na Filipo.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: akaendelea kushikamana na Filipo
  rationale: Huwasilisha tendo endelevu la Simoni kukaa karibu na kumfuata Filipo bila kulifanya kuwa kauli nzito zaidi ya kujitoa kiroho.
- source_word: θεωρῶν
  choice: alipoona
  rationale: Ni Kiswahili cha kawaida kinachounganisha kuona kwa Simoni na kustaajabu kwake.
- source_word: σημεῖα
  choice: ishara
  rationale: Huhifadhi maana ya matukio yenye umuhimu wa kuthibitisha au kufunua, iliyo ya kawaida katika Matendo.
- source_word: δυνάμεις μεγάλας
  choice: matendo makubwa ya nguvu
  rationale: Huhifadhi uhusiano wa neno δυνάμεις na nguvu huku tanbihi ikitaja tafsiri ya kimuktadha, ‘miujiza mikubwa.’
- source_word: γινομένας
  choice: yakitendeka
  rationale: Huonyesha kwamba ishara na matendo hayo yalikuwa yakitokea mbele ya Simoni.
- source_word: ἐξίστατο
  choice: alistaajabu
  rationale: Hutoa kwa lugha ya kawaida hali ya mshangao mkubwa bila kuongeza maelezo yasiyosemwa wazi.
theological_decisions:
- issue: Ikiwa kuamini kwa Simoni kulikuwa uongofu wa kweli
  choice: akaamini
  alternative: alidai kuamini / aliamini kwa kweli
  rationale: Andiko linasema tu kwamba Simoni aliamini. Tafsiri haipaswi kutatua mvutano wa kitheolojia unaojitokeza baadaye katika simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kushikamana na Filipo’ linaonyesha ukaribu wa kudumu bila kudokeza hitimisho la kidhehebu. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, si baada ya ‘akaamini.’
