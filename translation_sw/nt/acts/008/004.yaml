  text: Kwa hiyo, wale waliokuwa wametawanywa wakaenda sehemu mbalimbali wakihubiri neno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, “wakitangaza habari njema neno.” Kitenzi kina maana ya kutangaza habari njema, na “neno” ndilo yambwa wake; katika muktadha huu humaanisha ujumbe wa Kikristo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Kwa hiyo, wale
  rationale: “Kwa hiyo” linaonyesha hitimisho au mwendelezo unaotokana na mateso na kutawanywa kulikotajwa kabla; μέν lina kazi ya kupanga mtiririko wa habari na halihitaji kutafsiriwa kwa neno tofauti.
- source_word: διασπαρέντες
  choice: waliokuwa wametawanywa
  rationale: Kauli tendwa inaonyesha kuwa jambo hilo liliwapata waamini, na muundo huu unaweka kutawanywa kabla ya kwenda kwao sehemu mbalimbali.
- source_word: διῆλθον
  choice: wakaenda sehemu mbalimbali
  rationale: Kitenzi hapa kinaeleza kusafiri kutoka mahali hadi mahali; tafsiri hii ni ya kawaida katika Kiswahili na haiongezi eneo fulani lisilotajwa katika Kigiriki.
- source_word: εὐαγγελιζόμενοι
  choice: wakihubiri
  rationale: Kitenzi hiki kina maana ya kutangaza habari njema. “Wakihubiri” kinaendana kwa kawaida na yambwa “neno,” huku maana ya habari njema ikifafanuliwa katika tanbihi.
- source_word: τὸν λόγον
  choice: neno
  rationale: Huhifadhi usemi mfupi wa Kigiriki na istilahi ya Luka bila kuongeza “la Mungu” au “kuhusu Yesu,” ingawa katika muktadha linamaanisha ujumbe wa habari njema.
theological_decisions:
- issue: Uhusiano wa εὐαγγελιζόμενοι na τὸν λόγον
  choice: wakihubiri neno
  alternative: wakitangaza habari njema ya neno
  rationale: Katika Kigiriki, “neno” ni yambwa ya moja kwa moja ya kitenzi chenye maana ya kutangaza habari njema. Tafsiri iliyochaguliwa ni ya asili katika Kiswahili na huepuka kuunda uhusiano usio wazi wa “habari njema ya neno,” huku tanbihi ikihifadhi maana kamili ya kitenzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Sehemu mbalimbali” huonyesha mwendo wa kutoka mahali hadi mahali bila kuongeza “eneo” ambalo halipo wazi katika matini ya Kigiriki.
