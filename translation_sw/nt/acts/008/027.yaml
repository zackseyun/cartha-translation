  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: sw
  text: Basi akaondoka, akaenda. Na tazama, alikuwapo mwanamume Mwethiopia, towashi[a], afisa mkuu wa Kandake[b], malkia wa Waethiopia. Alikuwa msimamizi wa hazina yake yote, naye alikuwa amekuja Yerusalemu kuabudu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “afisa wa ikulu.” Neno la Kigiriki linaweza kutumiwa kwa maana hiyo katika baadhi ya mazingira, ingawa hapa yaelekea linamaanisha towashi kihalisi.
    reason: lexical_alternative
  - marker: b
    text: Huenda “Kandake” lilikuwa jina la cheo cha malkia katika nasaba hiyo, wala si jina lake binafsi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: akaondoka
  rationale: Katika mfululizo huu wa kisimulizi, neno hili linaonyesha kujiandaa na kuanza kutenda; “akaondoka” ni Kiswahili cha kawaida na huunganika vizuri na “akaenda” bila ulazima wa kumaanisha kwamba alikuwa ameketi.
- source_word: ἐπορεύθη
  choice: akaenda
  rationale: Hili ni neno la kawaida la mwendo; “akaenda” linadumisha mfuatano wa matendo katika simulizi.
- source_word: ἰδοὺ
  choice: Na tazama
  rationale: Limehifadhiwa kama kiashiria cha kuvuta fikira kinachotumiwa na Luka, kwa mtindo wenye hadhi lakini unaoeleweka.
- source_word: ἀνὴρ Αἰθίοψ
  choice: mwanamume Mwethiopia
  rationale: “Mwanamume” huhifadhi jinsia iliyoelezwa wazi na ἀνήρ, huku “Mwethiopia” likitoa utambulisho wake wa kikabila/kijiografia kwa Kiswahili asilia.
- source_word: εὐνοῦχος
  choice: towashi
  rationale: Hii ndiyo maana ya msingi ya neno hilo, na δυνάστης tayari inaeleza cheo chake cha kiutawala. Maana pana ya afisa wa ikulu imewekwa katika tanbihi.
- source_word: δυνάστης
  choice: afisa mwenye mamlaka
  rationale: Huonyesha mtu wa cheo na uwezo mkubwa bila kumfanya kuwa mtawala huru.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: chini ya Kandake, malkia wa Waethiopia
  rationale: Muundo huu unaonyesha kwa kawaida kwa Kiswahili kwamba alikuwa afisa katika utawala wa malkia. “Waethiopia” hufuata wingi wa jina la watu katika Kigiriki.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: msimamizi wa hazina yake yote
  rationale: Hutoa wazi wajibu wa kiutawala unaoonyeshwa na ἐπί na maana ya hazina/rasilimali ya γάζα.
- source_word: ἐληλύθει
  choice: alikuwa amekuja
  rationale: Huhifadhi wakati timilifu uliopita, yaani safari yake ya kuja ilitangulia tukio linalosimuliwa.
- source_word: προσκυνήσων
  choice: kuabudu
  rationale: Kirai hiki kinaonyesha kusudi la safari yake kwa njia ya kawaida na iliyo wazi.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Kwa kitenzi “amekuja,” Kiswahili hakihitaji kihusishi kabla ya jina la mahali; tafsiri hii bado hudumisha mwelekeo wa safari.
theological_decisions:
- issue: Iwapo εὐνοῦχος litafsiriwe kwa maana halisi au lijumlishwe kuwa afisa wa ikulu
  choice: “towashi” katika matini kuu
  alternative: “afisa wa ikulu”
  rationale: Maana halisi ndiyo ya msingi na huenda hadhi ya kijamii na kimwili ya mtu huyu ni muhimu katika simulizi. Aidha, δυνάστης tayari linabeba wazo la cheo rasmi, hivyo kulitafsiri εὐνοῦχος pia kuwa “afisa” kungefifisha tofauti ya maneno hayo.
- issue: Iwapo Kandake ni jina binafsi au cheo cha kifalme
  choice: “Kandake” katika matini kuu, bila kuamua wazi kama ni jina binafsi au cheo
  alternative: “Kandake” kama cheo cha nasaba cha malkia
  rationale: Uandikaji wa jina hilo katika matini unaweza kusomwa kwa namna zote mbili; tanbihi huhifadhi taarifa ya kihistoria bila kulazimisha uamuzi usioelezwa wazi na sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisimulizi umetumia vitenzi vya mfululizo “akaondoka, akaenda,” na kiashiria “Na tazama” kimehifadhiwa. “Towashi” ni neno sahihi lakini si la mazungumzo ya kila siku, hivyo limefafanuliwa kwa tanbihi.
