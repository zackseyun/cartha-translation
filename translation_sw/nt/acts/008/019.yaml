  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: sw
  text: akisema[a], “Nipeni mimi pia mamlaka hii, ili mtu yeyote nitakayemwekea mikono apokee Roho Mtakatifu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasema.”
    reason: Muundo wa Kigiriki ni kitenzi-jina kinachoweza kutafsiriwa “akisema,” lakini katika simulizi la kawaida la Kiswahili pia kinaweza kutolewa kama kitenzi kamili, “akasema.”
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi-jina cha wakati wa sasa kinaunganisha kauli ya Simoni na simulizi lililotangulia; “akisema” ni Kiswahili cha kawaida na huhifadhi muundo huo.
- source_word: Δότε
  choice: Nipeni
  rationale: Amri hii ni ya wingi. Katika Kiswahili, kiambishi cha mtendewa kinaunganishwa kiasili na kitenzi, hivyo “Nipeni” huwasilisha ‘nipeni mimi’ kwa uwazi.
- source_word: κἀμοί
  choice: mimi pia
  rationale: Muunganiko wa καί na ἐμοί unasisitiza kwamba Simoni anataka ajumuishwe; “mimi pia” huhifadhi msisitizo huo.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: ἐξουσία inaweza kumaanisha mamlaka, haki, au uwezo uliopewa wa kutenda. “Mamlaka” huhifadhi tofauti yake ya kileksika na maneno yanayomaanisha nguvu moja kwa moja.
- source_word: ταύτην
  choice: hii
  rationale: Kiwakilishi hiki kinaelekeza kwenye mamlaka mahususi ambayo Simoni alikuwa ameiona.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kwa kawaida kusudi au matokeo yaliyokusudiwa.
- source_word: ᾧ ἐὰν
  choice: yeyote nitakayemwekea
  rationale: 'Muundo wa kiwakilishi pamoja na ἐάν unaonyesha hali isiyobainishwa: mtu yeyote ambaye tendo hilo litafanywa kwake.'
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: nitakayemwekea mikono
  rationale: “Kumwekea mtu mikono” ni usemi wa kawaida wa Kiswahili unaohifadhi picha halisi ya tendo hilo.
- source_word: λαμβάνῃ
  choice: apokee
  rationale: Hali tegemezi baada ya ἵνα inawasilishwa kiasili kwa “ili ... apokee,” bila kufafanua kupita kiasi namna ya tendo.
- source_word: πνεῦμα ἅγιον
  choice: Roho Mtakatifu
  rationale: Katika muktadha wa Matendo, kifungu hiki kinamtaja Roho wa Mungu. Kiswahili humtaja kiasili kama “Roho Mtakatifu” bila kulazimika kuongeza kiambishi kinacholingana na the ya Kiingereza.
theological_decisions:
- issue: Ikiwa πνεῦμα ἅγιον, kwa kukosa kibainishi katika Kigiriki, itafsiriwe kama roho fulani takatifu
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Muktadha wa Matendo unaonyesha kwamba anayelengwa ni Roho wa Mungu. “roho takatifu” ingeweza kueleweka kama roho yoyote yenye utakatifu na hivyo kuleta maana isiyoungwa mkono na simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. “Mamlaka” limetumiwa badala ya “nguvu” ili kuhifadhi tofauti ya kileksika ya ἐξουσία; sentensi imetungwa kwa namna ya kawaida ya Kiswahili bila kuondoa msisitizo wa “mimi pia.”
