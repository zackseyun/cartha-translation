base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: sw
  text: Walipokuwa wakisafiri njiani, wakafika kwenye maji. Yule towashi akasema, “Tazama, maji! Ni nini kinachonizuia kubatizwa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  choice: yule towashi
  rationale: “Towashi” ni neno la kawaida katika tafsiri za Kiswahili kwa mwanamume aliyehasiwa au afisa wa ikulu wa aina hiyo; linaendeleza utambulisho uliotajwa katika muktadha.
- source_word: Ἰδοὺ ὕδωρ
  choice: Tazama, maji haya!
  rationale: “Tazama” linawasilisha mshangao na kuvuta fikira kwa ἰδού, huku “maji haya” ikiwa kauli ya asili ya Kiswahili kuhusu maji yaliyoonekana hapo.
- source_word: τί κωλύει με βαπτισθῆναι
  choice: Ni nini kinachonizuia kubatizwa?
  rationale: Huhifadhi swali la moja kwa moja, nafsi ya kwanza, na hali ya kutendewa katika kitenzi βαπτισθῆναι.
- source_word: φησιν
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati wa masimulizi wa Kiswahili “akasema” unasomeka kwa kawaida bila kubadili maana ya tukio.
theological_decisions:
- issue: Sababu inayoweza kuzuia ubatizo
  choice: 'Swali limeachwa wazi: “Ni nini kinachonizuia kubatizwa?”'
  alternative: Kufafanua masharti ya ubatizo ndani ya mstari huu
  rationale: Mstari wa Kigiriki una swali tu na hautaji jibu wala masharti; tafsiri haipaswi kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa masimulizi umetolewa kwa mtiririko wa kawaida wa Kiswahili, na swali la towashi limehifadhiwa kwa uwazi.
