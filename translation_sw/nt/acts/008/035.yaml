reference: Acts 8:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: sw
  text: Ndipo Filipo akafungua kinywa chake, akaanza na Andiko hilo, akamhubiria habari njema kuhusu Yesu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: akafungua kinywa chake
  rationale: Nahau hii humaanisha kuanza kusema. Kuihifadhi kunafuata picha ya Kigiriki na mtindo wenye uzito wa simulizi, huku ikiwa inaeleweka katika Kiswahili.
- source_word: δὲ
  choice: Ndipo
  rationale: Hapa δέ inasukuma simulizi mbele; “Ndipo” huonyesha hatua inayofuata kwa njia ya kawaida bila kuongeza maana isiyokuwapo.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: akaanza na Andiko hilo
  rationale: Kirai hiki kinaonyesha kwamba Andiko hilo lilikuwa mahali pa kuanzia kwa maelezo ya Filipo. “Akaanza na” ni Kiswahili cha kawaida kinachowasilisha kazi ya ἀπό katika muktadha huu.
- source_word: γραφῆς
  choice: Andiko
  rationale: Katika muktadha huu γραφή ni maandiko matakatifu, si maandishi ya kawaida. “Andiko” linaonyesha kifungu hicho cha Maandiko bila kuingiza neno lisilohitajika.
- source_word: εὐηγγελίσατο
  choice: akamhubiria habari njema kuhusu
  rationale: Kitenzi hiki humaanisha kutangaza habari njema. “Akamhubiria habari njema” ni wazi na cha sasa, na “kuhusu” huonyesha Yesu kuwa maudhui na kitovu cha tangazo.
- source_word: αὐτῷ
  choice: akam-
  rationale: Kiambishi cha yambwa “-m-” kinawasilisha kiwakilishi cha Kigiriki kwa kawaida katika Kiswahili na kinamrejelea yule afisa Mwethiopia.
- source_word: τὸν Ἰησοῦν
  choice: kuhusu Yesu
  rationale: Pamoja na εὐαγγελίζομαι, hali ya kushtaki inaweza kuonyesha maudhui yanayotangazwa. “Kuhusu Yesu” ni ya kawaida katika Kiswahili na humweka Yesu kuwa maudhui ya habari njema.
theological_decisions:
- issue: Maana ya εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: Filipo alimhudumia habari njema kuhusu Yesu, Yesu akiwa maudhui na kitovu cha tangazo.
  alternative: Filipo alimhubiria Yesu.
  rationale: Muundo wa Kigiriki unamweka Yesu kama maudhui au lengo la tendo la kutangaza habari njema. Tafsiri iliyochaguliwa inaeleza jambo hilo kwa Kiswahili cha kawaida bila kupunguza mkazo wa sentensi juu ya Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi mfululizo “akafungua… akaanza… akamhubiria” unahifadhi mwendo wa simulizi. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti zilizoainishwa zinaweza kuwasilishwa wazi katika matini yenyewe.
