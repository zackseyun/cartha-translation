base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: sw
  text: Umati wa watu, kwa moyo mmoja[b], ulisikiliza kwa makini[a] mambo yaliyokuwa yakisemwa na Filipo, uliposikia na kuona ishara alizokuwa akifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliyatilia maanani” au “uliyasikiliza kwa uangalifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa umoja” au “kwa nia moja”; Kigiriki kinakazia mwitikio wao wa pamoja na wenye umoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: ulisikiliza kwa makini
  rationale: Kitenzi προσέχω hapa kina maana ya kuelekeza fikira na kusikiliza kwa uangalifu. Kauli hii ni ya kawaida katika Kiswahili cha sasa, na wakati usiotimilika unaonyesha tendo lililoendelea.
- source_word: δὲ
  choice: imewakilishwa na mtiririko wa sentensi bila kiunganishi cha wazi
  rationale: δέ ni kiunganishi hafifu cha simulizi. Katika Kiswahili, kuanza moja kwa moja na kiima kunadumisha mtiririko bila kuingiza utofautishaji usiokusudiwa.
- source_word: οἱ ὄχλοι
  choice: umati wa watu
  rationale: Ingawa Kigiriki kina wingi, Kiswahili kwa kawaida hutumia nomino ya mkusanyiko “umati wa watu” kwa kundi kubwa lililokusanyika. Hii ni ya asili zaidi kuliko “makundi ya watu” katika muktadha huu.
- source_word: τοῖς λεγομένοις
  choice: mambo yaliyosemwa
  rationale: Kirai hiki kinarejelea yaliyokuwa yakisemwa. “Mambo yaliyosemwa” kinahifadhi muundo huo bila kufasiri zaidi kuwa “ujumbe.”
- source_word: ὑπὸ τοῦ Φιλίππου
  choice: na Filipo
  rationale: ὑπό pamoja na hali ya umilikaji humtaja mtendaji; “na Filipo” ni namna ya kawaida ya kuonyesha mtendaji katika sentensi tendwa ya Kiswahili.
- source_word: ὁμοθυμαδὸν
  choice: kwa moyo mmoja
  rationale: Kielezi hiki kinaonyesha mwitikio wa pamoja na wenye umoja, si ukaribu wa kimahali tu. Nahau “kwa moyo mmoja” inadumisha mkazo huo.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: uliposikia na kuona
  rationale: Muundo wa ἐν τῷ pamoja na vitenzi-jina una maana ya wakati au mazingira. αὐτούς inaeleweka kisarufi kama kiima cha vitenzi-jina, yaani watu ndio waliosikia na kuona; kwa hiyo tafsiri haiongezi “walipomsikia.”
- source_word: τὰ σημεῖα
  choice: ishara
  rationale: “Ishara” ni tafsiri ya moja kwa moja ya σημεῖα na haiongezi ufafanuzi kama “miujiza,” ingawa muktadha unaonyesha matendo yasiyo ya kawaida.
- source_word: ἃ ἐποίει
  choice: alizokuwa akifanya
  rationale: Muundo huu unadumisha hali endelevu ya kitenzi cha Kigiriki cha wakati usiotimilika.
