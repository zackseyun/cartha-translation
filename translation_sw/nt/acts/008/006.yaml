  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Umati wa watu” limetumiwa kama jina la mkusanyiko, hivyo vitenzi vimepatana nalo katika ngeli ya 3. Alama za tanbihi zimewekwa moja kwa moja baada ya virai vinavyohusika.
