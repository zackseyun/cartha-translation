  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: sw
  text: Mwanamume mmoja aitwaye Simoni alikuwa amekuwapo katika mji huo hapo awali, akifanya uchawi na kuwashangaza watu wa Samaria,[a] huku akisema kwamba yeye mwenyewe alikuwa mtu fulani mkuu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akifanya ulozi.” Kitenzi cha Kigiriki humaanisha kujihusisha na sanaa za kichawi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwamba yeye alikuwa mtu fulani mashuhuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Lakini mtu mmoja
  rationale: Ἀνήρ humtaja mwanamume, lakini katika Kiswahili cha kawaida 'mtu mmoja' humtambulisha mhusika mpya kwa ufasaha; δέ imehifadhiwa kwa kiunganishi hafifu 'Lakini' kinachoonyesha tofauti na simulizi lililotangulia.
- source_word: ὀνόματι Σίμων
  choice: aitwaye Simoni
  rationale: Hii ni tafsiri ya kawaida na ya asili ya muundo wa kidativo ὀνόματι pamoja na jina.
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: alikuwa tayari katika mji huo
  rationale: Kitenzi hiki kinaonyesha kuwapo kwake kabla ya matukio yaliyosimuliwa; 'tayari' huhifadhi maana hiyo bila kudai muda maalumu. 'Mji huo' hurejelea mji uliotajwa katika muktadha.
- source_word: μαγεύων
  choice: akifanya uchawi
  rationale: Hueleza kujihusisha na matendo ya kichawi kwa lugha ya sasa, bila kuongeza dai kuhusu chanzo chake cha kiroho.
- source_word: ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας
  choice: kuwashangaza watu wa Samaria
  rationale: ἐξίστημι hapa ni kusababisha mshangao mkubwa, na ἔθνος inafaa kutafsiriwa kama jamii ya watu kuliko taifa la kisiasa.
- source_word: λέγων
  choice: huku akisema
  rationale: Huhifadhi tendo linaloendelea sambamba na shughuli za Simoni na kuanzisha yaliyomo katika kauli yake.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: kwamba yeye mwenyewe alikuwa mtu mkuu
  rationale: '''Yeye mwenyewe'' huhifadhi msisitizo wa ἑαυτόν, na ''mtu mkuu'' huwasilisha dai la ukubwa au umuhimu bila kulifafanua kupita kiasi.'
theological_decisions:
- issue: Namna ya kueleza shughuli ya Simoni
  choice: akifanya uchawi
  alternative: akifanya ulozi
  rationale: Aya inasema alijihusisha na sanaa za kichawi, lakini haielezi moja kwa moja chanzo chake cha kiroho wala kutoa uchambuzi kamili wa kitheolojia; tafsiri haiongezi maelezo hayo.
- issue: Dai la Simoni kuhusu nafsi yake
  choice: yeye mwenyewe alikuwa mtu mkuu
  alternative: alikuwa mtu fulani mashuhuri
  rationale: Tafsiri huhifadhi msisitizo wa kujikweza na kutokuwa mahususi kwa τινα, bila kuamua ikiwa 'mkuu' humaanisha cheo, nguvu, au hadhi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umewekwa wa kisimulizi na unaoeleweka kwa wasomaji wa kawaida; istilahi za kale au za kimadhehebu zimeepukwa.
