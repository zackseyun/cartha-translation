base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: sw
  text: Lakini wanaume wacha Mungu walimzika Stefano[a] na kumwombolezea sana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliuandaa mwili wa Stefano kwa maziko” au “waliuchukua mwili wa Stefano kwenda kuuzika”; kitenzi cha Kigiriki kinaweza kukazia kushughulikiwa kwa mwili pamoja na maziko yenyewe.
    reason: lexical_alternative
  - marker: b
    text: “Kumwombolezea sana” kunaweza kujumuisha maonyesho ya huzuni ya sauti na ya hadharani, si huzuni ya moyoni tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: walimzika
  rationale: Katika muktadha huu kitenzi kinahusu kushughulikia mwili wa Stefano baada ya kuuawa, kwa kusudi la maziko. ‘Walimzika’ ni Kiswahili cha kawaida kinachoeleza matokeo ya tendo, huku tanbihi ikihifadhi uwezekano wa maana ya kuandaa au kuuchukua mwili kwa maziko.
- source_word: δέ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko dogo la simulizi au utofauti na yaliyotangulia; ‘Lakini’ linaweka wazi mpito huo.
- source_word: ἄνδρες εὐλαβεῖς
  choice: watu wacha Mungu
  rationale: εὐλαβεῖς inaeleza watu wenye uchaji au heshima ya kidini. ‘Wacha Mungu’ ni usemi wa sasa, wenye heshima na unaoeleweka kwa urahisi. Nomino ἄνδρες inaonyesha wanaume, lakini katika Kiswahili ‘watu wacha Mungu’ ni mtiririko wa asili zaidi; taarifa ya jinsia haibadili hoja ya mstari huu.
- source_word: ἐποίησαν
  choice: kumwombolezea
  rationale: Kitenzi hiki kinaungana kiidioma na κοπετόν; badala ya kutafsiri neno kwa neno ‘walifanya maombolezo,’ Kiswahili cha asili hutumia kitenzi ‘kumwombolezea.’
- source_word: κοπετὸν μέγαν
  choice: sana
  rationale: κοπετός ni maombolezo ambayo mara nyingi hujitokeza waziwazi, na μέγαν huonyesha ukubwa au nguvu yake. ‘Kumwombolezea sana’ ni usemi wa kawaida unaohifadhi uzito huo.
- source_word: ἐπ’ αὐτῷ
  choice: kumwombolezea
  rationale: Kiambishi cha yambwa na kiambishi tamati katika ‘kumwombolezea’ vinaonyesha kwamba Stefano ndiye aliyeombolezewa, kwa njia ya asili kuliko ‘walifanya maombolezo makubwa juu yake.’
