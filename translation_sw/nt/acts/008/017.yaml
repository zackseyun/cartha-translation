translation:
  language: sw
  text: Kisha waliwawekea mikono, nao walikuwa wakimpokea Roho Mtakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa ukaribu zaidi, “Kisha walikuwa wakiwawekea mikono, nao walikuwa wakimpokea Roho Mtakatifu.” Vitenzi vyote viwili vya Kigiriki viko katika wakati usiotimilika.
    reason: Mbadala huu unaonyesha kwa uwazi zaidi hali endelevu au inayorudiwa inayoweza kudokezwa na vitenzi viwili vya Kigiriki.
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Inaonyesha mfuatano wa matukio kwa Kiswahili cha kawaida na cha masimulizi bila kuongeza maana ya kisababishi.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: wakawawekea mikono
  rationale: Kauli “kuwekea mtu mikono” ni namna ya asili ya Kiswahili ya kueleza tendo hili. Kiambishi cha yambwa “-wa-” kinabainisha kwamba mikono iliwekwa juu yao.
- source_word: ἐλάμβανον
  choice: wakawa wakimpokea
  rationale: Muundo huu unaakisi hali endelevu ya kitenzi cha Kigiriki cha wakati usiotimilika, huku ukibaki wenye kueleweka katika masimulizi ya Kiswahili.
- source_word: πνεῦμα ἅγιον
  choice: Roho Mtakatifu
  rationale: Katika muktadha wa Luka–Matendo, kirai hiki kinamtaja Roho Mtakatifu wa Mungu. Kiswahili hakihitaji kibainishi kinacholingana na “the,” na herufi kubwa zinaonyesha rejeo mahsusi bila kuongeza madai mengine.
theological_decisions:
- issue: Iwapo πνεῦμα ἅγιον itafsiriwe kama rejeo mahsusi la Roho wa Mungu au kama roho fulani mtakatifu
  choice: Roho Mtakatifu
  alternative: roho mtakatifu
  rationale: Muktadha wa Matendo 8 na matumizi ya Luka–Matendo yanaelekeza kwa Roho Mtakatifu aliyeahidiwa, si roho mmoja asiyeainishwa.
- issue: Jinsi ya kuwasilisha hali ya vitenzi viwili vya Kigiriki vya wakati usiotimilika
  choice: “wakawawekea … wakawa wakimpokea” pamoja na tanbihi
  alternative: “walikuwa wakiwawekea … walikuwa wakimpokea”
  rationale: Tafsiri iliyochaguliwa inadumisha mtiririko wa masimulizi na kuonyesha wazi hali endelevu katika kupokea. Tanbihi inahifadhi taarifa kwamba vitenzi vyote viwili ni vya wakati usiotimilika, bila kuufanya mstari mkuu kuwa mzito kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Nao” huunganisha matendo kwa mtiririko wa masimulizi, na “kuwekea mikono” ni usemi wa kawaida wa kibiblia usio wa dhehebu maalumu.
