  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: sw
  text: Wote walimtilia maanani, kuanzia mdogo hadi mkubwa, wakisema, “Mtu huyu ndiye Nguvu ya Mungu iitwayo Kuu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huyu ndiye aitwaye Nguvu Kuu ya Mungu.” Kigiriki kinaweza kutafsiriwa kwa ufupi zaidi kama usemi unaofanana na cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: walimsikiliza kwa makini
  rationale: Kitenzi προσέχω hapa humaanisha kuelekeza fikira au kumsikiliza mtu kwa makini. Tafsiri hii ni ya kawaida katika Kiswahili cha sasa bila kudokeza uaminifu au kujitoa kupita maana ya muktadha.
- source_word: πάντες
  choice: Wote
  rationale: Neno hili linawahusisha watu wote waliotajwa katika muktadha; Kiswahili hakihitaji kuongeza kiwakilishi kingine.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: kuanzia mdogo hadi mkubwa
  rationale: Huu ni usemi unaojumuisha watu wa kila cheo au hadhi. Muundo huu unahifadhi picha ya Kigiriki na unasikika kwa kawaida katika Kiswahili.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kauli hii ya wakati mmoja inaonyesha kwamba walikuwa wakisema maneno hayo huku wakimsikiliza.
- source_word: Οὗτός
  choice: Mtu huyu
  rationale: Kiashiria hiki kinamrejelea Simoni. 'Mtu huyu' ni wazi na cha kawaida katika Kiswahili bila kuondoa nguvu ya kuashiria.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: Nguvu ya Mungu
  rationale: Muundo huu unahifadhi dai la umati na hali yake inayofanana na jina au cheo.
- source_word: ἡ καλουμένη Μεγάλη
  choice: iitwayo Kuu
  rationale: Kivumishi-tendo καλουμένη kinaonyesha jina au cheo kinachotumiwa, huku 'Kuu' kikikubaliana kisarufi na 'Nguvu' na kuhifadhi Μεγάλη kama epithet.
- source_word: Μεγάλη
  choice: Kuu
  rationale: Kwa kuwa 'nguvu' ni nomino ya ngeli ya 9, 'kuu' ndilo umbo la kawaida la kivumishi. Herufi kubwa inaonyesha matumizi yake kama jina au cheo ndani ya dai la umati.
theological_decisions:
- issue: Ikiwa kauli ya umati itafsiriwe kama cheo rasmi cha kimungu au kama maelezo kuhusu Simoni
  choice: “Mtu huyu ndiye Nguvu ya Mungu iitwayo Kuu.”
  alternative: “Huyu ndiye yule aitwaye Nguvu Kuu ya Mungu.”
  rationale: Tafsiri kuu inawasilisha maneno kama dai la umati, si uthibitisho wa msimulizi, na inadumisha mvutano wa Kigiriki kati ya kumtambulisha Simoni na matumizi ya usemi kama cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa nukuu umehifadhi dai la umati bila kulifanya kuwa kauli ya msimulizi.
