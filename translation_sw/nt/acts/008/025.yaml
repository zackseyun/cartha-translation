  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: sw
  text: Basi, baada ya kutoa ushahidi kwa msisitizo na kusema neno la Bwana, walikuwa wakirudi Yerusalemu huku wakihubiri habari njema katika vijiji vingi vya Wasamaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: baada ya kutoa ushahidi wa dhati
  rationale: Kitenzi hiki kinaonyesha ushuhuda uliotolewa kwa uzito na msisitizo. Kauli hii ni ya kawaida katika Kiswahili na inahifadhi uzito huo bila kuingiza maana finyu ya kuonya.
- source_word: λαλήσαντες
  choice: na kusema
  rationale: Hii ni tafsiri ya moja kwa moja ya λαλέω; kirai kinachofuata, “neno la Bwana,” kinaonyesha wazi kilichosemwa.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: neno la Bwana
  rationale: “Neno” ni tafsiri iliyozoeleka na yenye mwangwi wa kibiblia kwa λόγος katika muktadha wa kutangaza ujumbe, huku “Bwana” ikihifadhi κύριος bila kubainisha zaidi mhusika.
- source_word: ὑπέστρεφον
  choice: walikuwa wakirudi
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, sawasawa na hali ya wakati usiotimilika katika Kigiriki.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mji huo katika Kiswahili cha Biblia.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: katika vijiji vingi vya Wasamaria
  rationale: Kirai hiki kinahifadhi uhusiano wa vijiji na Wasamaria na kutaja kundi hilo wazi, huku kikisomeka kwa ufasaha katika Kiswahili.
- source_word: εὐηγγελίζοντο
  choice: wakihubiri habari njema
  rationale: Muundo wa “waki-” unaonyesha tendo lililoendelea sambamba na kurudi kwao. “Kuhubiri habari njema” ni lugha ya sasa, wazi, na yenye uzito unaofaa.
theological_decisions:
- issue: Utambulisho wa kiima kilichodokezwa
  choice: Kiima kimeachwa kuwa “wao” kinachoonyeshwa na kiambishi “wa-”, bila kutaja majina.
  alternative: Kuwataja Petro na Yohana moja kwa moja.
  rationale: Muktadha wa karibu unawaelekeza Petro na Yohana, lakini mstari huu wa Kigiriki una kiima cha wingi kilichodokezwa tu. Tafsiri haiongezi majina yasiyokuwamo katika mstari.
- issue: Uhusiano wa matendo mawili yasiyotimilika
  choice: “walikuwa wakirudi ... huku wakihubiri”
  alternative: “walirudi ... na wakahubiri”
  rationale: Chaguo hili linahifadhi hali endelevu ya ὑπέστρεφον na εὐηγγελίζοντο na linaonyesha kwa kawaida kwamba kuhubiri kulifanyika wakati wa safari ya kurudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Ushahidi wa dhati” huhifadhi msisitizo wa διαμαρτύρομαι bila kuwa nzito kupita kiasi; “huku wakihubiri” huunganisha kwa ufasaha matendo yanayoendelea kwa wakati mmoja.
