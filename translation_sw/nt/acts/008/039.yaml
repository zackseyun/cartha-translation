base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: sw
  text: Walipopanda kutoka majini, Roho wa Bwana akamnyakua Filipo[a]. Yule towashi hakumwona tena, kwa maana aliendelea na safari yake akifurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamchukua Filipo ghafula.” Kitenzi cha Kigiriki kinaweza kusisitiza kuondolewa kwa ghafla na kwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: Walipopanda kutoka majini
  rationale: Inaonyesha mwendo wa kupanda na kutoka ndani ya maji bila kuamua kimyakimya namna ya ubatizo.
- source_word: πνεῦμα κυρίου
  choice: Roho wa Bwana
  rationale: Katika Luka–Matendo, kirai hiki kwa kawaida humaanisha Roho wa Mungu akitenda; matumizi ya herufi kubwa yanaonyesha rejeo hilo la kibinafsi la kimungu.
- source_word: ἥρπασεν
  choice: akamchukua Filipo ghafula
  rationale: Kitenzi kinaonyesha kuondolewa kwa ghafla na kwa nguvu. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha wazi tendo la ghafla la Roho, huku maana yenye nguvu zaidi ikihifadhiwa katika tanbihi.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: hakumwona tena
  rationale: Huwasilisha kwa ufupi kwamba baada ya hapo towashi hakumwona Filipo tena.
- source_word: ὁ εὐνοῦχος
  choice: yule towashi
  rationale: Neno hilo limetajwa wazi katika Kigiriki na hudumisha utambulisho wa mhusika katika simulizi.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: aliendelea na safari yake
  rationale: Wakati usiotimilifu unaonyesha mwendo unaoendelea, na ὁδός hapa ni safari au njia anayoifuata, si lazima barabara halisi tu.
- source_word: χαίρων
  choice: akifurahi
  rationale: Huhifadhi hali ya tendo linaloandamana na kuendelea kwa safari yake.
theological_decisions:
- issue: Ikiwa πνεῦμα κυρίου ni Roho Mtakatifu atendaye binafsi au nguvu isiyo na nafsi kutoka kwa Mungu
  choice: Roho wa Bwana atendaye kwa uwezo wa kimungu
  alternative: roho au nguvu isiyo na nafsi kutoka kwa Bwana
  rationale: Matumizi ya Luka–Matendo kwa kawaida humwelekeza msomaji kwa Roho wa Mungu kama mtendaji binafsi, bila kuongeza jina lisilopo katika mstari huu.
- issue: Ikiwa ἥρπασεν inapaswa kuonyesha kuondolewa kwa Filipo kwa ghafla na kimiujiza
  choice: akamchukua Filipo ghafula
  alternative: akamnyakua Filipo
  rationale: Muktadha unaonyesha tendo la moja kwa moja la Roho, na kitenzi chenyewe kina dhana ya kuondoa kwa ghafla na kwa nguvu. Tafsiri kuu ni ya asili na yenye hadhi; tanbihi huhifadhi ukali wa kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutoka majini” ni usemi wa kawaida unaohifadhi maana ya kutoka ndani ya maji; “towashi” hudumisha neno la simulizi bila kulizunguka. Sentensi zimegawanywa kwa usomaji wa kawaida, huku kiunganishi “kwa maana” kikihifadhi γάρ na uhusiano wake wa kifafanuzi.
