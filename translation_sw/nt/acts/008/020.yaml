  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: sw
  text: Lakini Petro akamwambia, “Fedha yako na iangamie pamoja nawe, kwa sababu ulidhani kwamba ungeweza kupata zawadi ya Mungu kwa pesa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριόν
  choice: fedha
  rationale: Neno hilo humaanisha kihalisi fedha kama metali au sarafu; katika Kiswahili, “fedha” pia ni neno la kawaida kwa pesa na linahifadhi taswira ya Kigiriki.
- source_word: σὺν σοὶ
  choice: pamoja nawe
  rationale: Huwasilisha kwa uwazi kwamba fedha na Simoni wameunganishwa katika tamko hili kali.
- source_word: εἴη εἰς ἀπώλειαν
  choice: na iangamie
  rationale: Muundo wa optative unaonyesha tamko la kutakia au kutamka maangamizi, si taarifa rahisi wala istilahi mahususi ya hukumu ya milele.
- source_word: δωρεὰν
  choice: zawadi
  rationale: “Zawadi” ni neno la kawaida na huonyesha kitu kinachotolewa, kinyume cha kitu kinachonunuliwa.
- source_word: ἐνόμισας
  choice: ulidhani
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wazo la kufikiri au kudhani.
- source_word: διὰ χρημάτων
  choice: kwa pesa
  rationale: Huonyesha njia au namna ya kupata kitu kwa lugha ya kawaida ya Kiswahili.
- source_word: κτᾶσθαι
  choice: kuipata
  rationale: Huhifadhi maana pana ya kupata au kujipatia bila kulazimisha maana finyu ya kununua, ingawa matumizi ya pesa yanaifanya dhana hiyo ionekane wazi.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti kati ya ombi la Simoni katika mstari uliotangulia na jibu kali la Petro.
theological_decisions:
- issue: Nguvu na maana ya tamko la Petro kuhusu Simoni na fedha yake
  choice: 'Tamko kali la kutakia maangamizi: “Fedha yako na iangamie pamoja nawe”'
  alternative: Utabiri wa moja kwa moja wa maangamizi, au kauli inayomtaja wazi kuwa amehukumiwa milele
  rationale: Optative εἴη inafaa kuonyeshwa kama tamko la kutakia au kutamka maangamizi. “Iangamie” linadumisha ukali bila kuingiza fundisho mahususi la hukumu ya milele ambalo mstari wenyewe haulitamki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “na iangamie” umetumiwa kuhifadhi nguvu ya optative ya Kigiriki; “fedha” na “pesa” zinadumisha utofautishaji wa ἀργύριον na χρήματα.
