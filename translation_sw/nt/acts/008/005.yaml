  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: sw
  text: Filipo akashuka kwenda mji wa Samaria[a][b], akawatangazia Masihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mji mmoja katika Samaria.” Kigiriki kinaweza kueleweka kuwa kinarejelea ama mji fulani maalumu wa Samaria, ama mji mmoja katika eneo la Samaria.
    reason: alternative_reading
  - marker: b
    text: Au, “akashuka hadi mji wa Samaria.”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: (haikutafsiriwa kwa neno la pekee)
  rationale: Ni kiunganishi chepesi kinachoendeleza simulizi; mtiririko wa Kiswahili hauhitaji kuongeza neno kama “basi” au “sasa,” ambalo lingeweza kusisitiza maana isiyokusudiwa.
- source_word: κατελθὼν
  choice: akashuka
  rationale: Inahifadhi maana ya kuelekea chini, huku muundo wa kishirikishi wa Kigiriki ukiwasilishwa kwa mfuatano wa kawaida wa simulizi katika Kiswahili.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: mji wa Samaria
  rationale: Hufuata muundo wenye kibainishi katika Kigiriki. Kwa kuwa usemi huo unaweza kumaanisha mji maalumu au mji mmoja katika eneo la Samaria, uwezekano mwingine umewekwa katika tanbihi.
- source_word: ἐκήρυσσεν
  choice: kuwatangazia
  rationale: Neno hili linaonyesha kutangaza ujumbe hadharani na kwa mamlaka, bila kulifanya kuwa istilahi ya kidini pekee.
- source_word: αὐτοῖς
  choice: -wa- katika “kuwatangazia”
  rationale: Kiambishi cha yambwa kinaonyesha wazi kwamba watu wa huko ndio waliopokea tangazo.
- source_word: τὸν χριστόν
  choice: Masihi
  rationale: Hapa Χριστός inatumika kama cheo cha yule aliyeahidiwa, si kama jina la kawaida; “Masihi” huhifadhi msingi wake wa Kiyahudi na maana yake ya cheo.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha wa kutangaza τὸν χριστόν unaonyesha cheo cha yule aliyetiwa mafuta na kuahidiwa. “Masihi” huonyesha wazi maana hiyo bila kugeuza cheo kuwa jina.
- issue: Utambulisho wa πόλις τῆς Σαμαρείας
  choice: mji wa Samaria
  alternative: mji mmoja wa Samaria
  rationale: Kibainishi cha Kigiriki kinaunga mkono tafsiri bainifu, lakini sintaksia inaweza pia kueleweka kuwa inarejelea mji fulani katika eneo la Samaria. Utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Hadi katika” huwasilisha mwendo wa kushuka na kuingia/kufika mjini; “kuwatangazia” huhifadhi hadhira iliyo katika αὐτοῖς bila kuongeza maelezo yasiyomo katika chanzo.
