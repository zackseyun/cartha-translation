  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: sw
  text: Mitume waliokuwa Yerusalemu waliposikia kwamba Samaria imelipokea neno la Mungu, waliwatuma Petro na Yohana kwao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: waliposikia
  rationale: Kirai tegemezi cha wakati kinaonyesha jambo lililotangulia tendo kuu. Kiunganishi δέ ni mpito hafifu wa masimulizi na hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili hapa.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: Mitume waliokuwa Yerusalemu
  rationale: Hutambulisha kwa kawaida na kwa uwazi mitume waliokuwako Yerusalemu.
- source_word: δέδεκται
  choice: imelipokea
  rationale: Wakati timilifu wa Kigiriki unaonyesha kupokea kulikokamilika na matokeo yanayoendelea; hali timilifu ya Kiswahili inafaa katika sentensi hii.
- source_word: ἡ Σαμάρεια
  choice: Samaria
  rationale: Jina la mahali limetumiwa kimajazi kuwawakilisha wakaaji wake. Kulihifadhi kunafuata muundo wa chanzo bila kuubana maana kuwa kundi lililotajwa kwa namna nyingine.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Huhifadhi usemi wa kawaida wa kibiblia pamoja na uzito wake, huku ukirejelea ujumbe wa Mungu uliotangazwa.
- source_word: ἀπέστειλαν
  choice: wakawatuma
  rationale: Ni kitenzi kikuu cha wakati uliopita; kiambishi cha yambwa huwaunganisha Petro na Yohana kama waliotumwa.
- source_word: πρὸς αὐτοὺς
  choice: waende kwao
  rationale: Huwasilisha mwelekeo wa πρός kwa Kiswahili cha kawaida; “kwao” hurejelea watu wa Samaria.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Petro na Yohana
  rationale: Majina ya kawaida katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Matumizi ya kimajazi ya “Samaria”
  choice: Samaria imelipokea neno la Mungu
  alternative: Wasamaria walilipokea neno la Mungu
  rationale: Kigiriki kinataja Samaria moja kwa moja kama kiima cha pamoja. Tafsiri imehifadhi tamathali hiyo na kutoongeza ufafanuzi usio lazima.
- issue: Maana ya λόγος
  choice: neno la Mungu
  alternative: ujumbe wa Mungu
  rationale: “Neno la Mungu” huhifadhi muundo na mwangwi wa kitheolojia wa chanzo; katika muktadha huu linamaanisha ujumbe uliotangazwa bila kulazimisha ufafanuzi huo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo umewekwa wa asili bila kuwa mgumu; hakuna alama za tanbihi zinazohitajika.
