  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: sw
  text: Malaika wa Bwana akamwambia Filipo, “Inuka, uende kuelekea kusini[a] kwenye barabara inayoteremka kutoka Yerusalemu kwenda Gaza.” Barabara hiyo ni ya ukiwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa adhuhuri.” Usemi wa Kigiriki unaweza kumaanisha mwelekeo (“kusini”) au wakati (“adhuhuri”).
    reason: alternative_reading
  - marker: b
    text: Au, “Hii ni jangwa,” labda kwa maana kwamba njia hiyo inapitia eneo la jangwa, badala ya kusisitiza kwamba barabara yenyewe ni ya ukiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: Basi malaika wa Bwana
  rationale: “Malaika” linafaa kwa mjumbe wa mbinguni katika muktadha huu; “wa Bwana” linahifadhi uhusiano na mamlaka ya Mungu bila kufafanua utambulisho zaidi. “Basi” linawakilisha kwa upole kiunganishi δὲ kama mpito wa simulizi.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: akasema na Filipo
  rationale: Kiswahili cha kawaida hakihitaji kurudia “akisema”; muundo huu unawasilisha kwa kawaida kitendo cha kusema kinachofuatwa na maneno ya moja kwa moja.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Inuka, uende
  rationale: Vitenzi vya amri vinahifadhi wito wa kuchukua hatua mara moja kwa Kiswahili cha sasa na cha kawaida.
- source_word: κατὰ μεσημβρίαν
  choice: kuelekea kusini
  rationale: Katika muktadha wa kwenda kwenye barabara, maana ya mwelekeo inaelekea kufaa zaidi; maana ya wakati, “adhuhuri,” imehifadhiwa katika tanbihi.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: kwenye barabara
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa kwenda hadi kwenye njia maalumu.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: inayoteremka kutoka Yerusalemu kwenda Gaza
  rationale: “Inayoteremka” linahifadhi maelezo ya kijiografia ya kushuka kutoka Yerusalemu.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Barabara hiyo ni ya ukiwa
  rationale: Nomino “barabara” imewekwa wazi kwa kuwa kivumishi cha Kigiriki kinaelekea kurejelea ὁδός. “Ya ukiwa” huhifadhi wazo la mahali pasipo na watu wengi bila kulazimisha maana ya “jangwa.”
theological_decisions:
- issue: Utambulisho wa “Bwana” katika usemi “malaika wa Bwana”
  choice: wa Bwana
  alternative: malaika aliyetumwa na Mungu; au malaika maalumu wa Bwana
  rationale: Tafsiri inahifadhi lugha ya chanzo kuhusu wakala wa Mungu bila kumtambulisha malaika huyo kwa undani kuliko andiko lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
