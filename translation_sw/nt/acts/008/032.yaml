  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: sw
  text: 'Kifungu cha Maandiko alichokuwa akisoma kilikuwa hiki: “Kama kondoo aliongozwa kwenda kuchinjwa[a], na kama vile mwanakondoo alivyo kimya mbele ya anayemnyoa[b], vivyo hivyo hafungui kinywa chake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliongozwa machinjoni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mbele ya mnyoaji”; Kigiriki kihalisi, “mbele ya yule anayemnyoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: Kifungu cha Maandiko
  rationale: Katika muktadha huu, περιοχή ni sehemu maalumu ya Maandiko iliyokuwa ikisomwa. “Kifungu cha Maandiko” ni usemi wa kawaida, wazi, na wenye hadhi katika Kiswahili.
- source_word: ἀνεγίνωσκεν
  choice: alichokuwa akisoma
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati uliopita, kama inavyofanya hali ya imperfect katika Kigiriki.
- source_word: Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη
  choice: Kama kondoo aliongozwa kwenda kuchinjwa
  rationale: Tafsiri inadumisha tashbihi, hali ya kutendwa ya ἤχθη, na mwendo kuelekea kuchinjwa unaoonyeshwa na ἐπὶ σφαγήν.
- source_word: ἀμνὸς
  choice: mwanakondoo
  rationale: Neno hili humaanisha hasa kondoo mchanga, hivyo linahifadhi tofauti iliyopo kati ya ἀμνός na πρόβατον.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν ἄφωνος
  choice: alivyo kimya mbele ya anayemnyoa
  rationale: “Mbele ya” huonyesha mahali au uwepo unaokusudiwa na ἐναντίον; “anayemnyoa” huhifadhi umbo la kirai cha kitendo, na “kimya” huwasilisha maana ya ἄφωνος kwa Kiswahili cha kawaida.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: vivyo hivyo hafungui kinywa chake
  rationale: “Vivyo hivyo” inakamilisha ulinganisho, na wakati wa sasa wa ἀνοίγει umehifadhiwa katika “hafungui” badala ya kugeuzwa kuwa wakati uliopita.
theological_decisions:
- issue: Nukuu ya Isaya 53 inayotumiwa kumhusu Yesu katika muktadha
  choice: Tashbihi ya nukuu imehifadhiwa bila kumtaja Yesu moja kwa moja katika mstari huu.
  alternative: Kutafsiri kwa ufafanuzi unaomtambulisha Yesu waziwazi kuwa ndiye mtumishi anayeteseka.
  rationale: Muktadha unaofuata unaonyesha matumizi ya Kikristo ya kifungu hiki, lakini mstari wenyewe unanukuu Maandiko. Tafsiri haiongezi utambulisho ambao haujatajwa wazi katika sentensi hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi wa nukuu na tofauti kati ya “kondoo” na “mwanakondoo” zimehifadhiwa.
