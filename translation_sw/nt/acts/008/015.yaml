id: ACT.8.15
reference: Acts 8:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: sw
  text: ambao walishuka na kuwaombea ili wapokee Roho Mtakatifu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao, baada ya kushuka, waliwaombea.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ambao waliposhuka, waliwaombea.”
    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: ambao
  rationale: Kiwakilishi hiki kinaanzisha kishazi rejeshi kinachowarejelea Petro na Yohana waliotajwa katika mstari uliotangulia; “ambao” ni ya kawaida na sahihi katika Kiswahili.
- source_word: καταβάντες
  choice: walishuka
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu. Muundo wa “walishuka na…” ni wa asili katika Kiswahili na unaendeleza mfuatano wa matendo bila kufanya sentensi kuwa nzito.
- source_word: προσηύξαντο
  choice: kuwaombea
  rationale: Kitenzi προσεύχομαι pamoja na περὶ αὐτῶν hapa kina maana ya kusali kwa niaba yao; “kuwaombea” huiwasilisha kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: περὶ αὐτῶν
  choice: -waombea
  rationale: περί pamoja na hali ya genitivi katika muktadha wa sala huonyesha walioombewa. Kiambishi cha yambwa katika “kuwaombea” kinarejelea watu hao.
- source_word: ὅπως
  choice: ili
  rationale: “Ili” linaonyesha kusudi la sala kwa uwazi na huhifadhi nguvu ya kusudi ya ὅπως.
- source_word: λάβωσιν
  choice: wapokee
  rationale: Hali tegemezi ya Kiswahili baada ya “ili” inalingana kwa kawaida na aoristi subjunktivi ya Kigiriki na kuonyesha lengo bila kuongeza dhana ya mashaka.
- source_word: πνεῦμα ἅγιον
  choice: Roho Mtakatifu
  rationale: Katika muktadha huu wa Matendo, kirai hiki kinamrejelea Roho Mtakatifu wa Mungu. Kiswahili hakihitaji kibainishi kinacholingana na “the” ya Kiingereza.
theological_decisions:
- issue: Ikiwa πνεῦμα ἅγιον hapa ni roho kwa maana ya jumla au Roho Mtakatifu wa Mungu
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Muktadha wa simulizi katika Matendo unaonyesha kuwa anayelengwa ni Roho aliyeahidiwa na kupewa waamini. Herufi kubwa zinatambulisha rejeleo hilo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “walishuka na kuwaombea” ni mwepesi kusomeka; tanbihi zinahifadhi uwezekano wa kutaja wazi kwamba kushuka kulitangulia kuomba.
