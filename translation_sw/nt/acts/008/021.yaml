id: ACT.8.21
reference: Acts 8:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: sw
  text: Huna sehemu wala fungu katika jambo hili, kwa maana moyo wako si mnyofu mbele za Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερίς
  choice: sehemu
  rationale: Neno hili humaanisha sehemu ambayo mtu anayo katika jambo fulani; “sehemu” ni ya kawaida na ya asili katika Kiswahili.
- source_word: κλῆρος
  choice: fungu
  rationale: “Fungu” linahifadhi picha ya sehemu iliyogawiwa au urithi, huku jozi “sehemu wala fungu” ikidumisha msisitizo wa maneno mawili ya Kigiriki.
- source_word: λόγος
  choice: jambo
  rationale: Katika muktadha huu λόγος haimaanishi tu “neno,” bali suala linalozungumziwa—ushiriki katika huduma na kipawa hiki.
- source_word: εὐθεῖα
  choice: mnyofu
  rationale: Kwa moyo, “mnyofu” huwasilisha hali ya kuwa sawa, wa kweli, na usio na hila bila kufafanua zaidi ya maandishi.
- source_word: ἔναντι τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida wa kibiblia unaodumisha wazo la hali ya mtu katika tathmini au uwepo wa Mungu.
theological_decisions:
- issue: Maana ya kutokuwa na μερίς wala κλῆρος
  choice: Huna sehemu wala fungu katika jambo hili
  alternative: Huna nafasi yoyote katika huduma hii
  rationale: Tafsiri iliyochaguliwa huhifadhi uradidi na taswira ya Kigiriki bila kuamua kwa upana zaidi kama kauli hii inahusu huduma, wokovu, au kipawa pekee.
- issue: Hali ya moyo mbele za Mungu
  choice: moyo wako si mnyofu mbele za Mungu
  alternative: moyo wako hauko sawa na Mungu
  rationale: “Mbele za Mungu” hufuata maandishi kwa karibu na huepuka kugeuza kauli hiyo kuwa madai mahsusi kuhusu uhusiano wa kiagano au wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha msisitizo wa jozi μερίς/κλῆρος bila kuwa mgumu.
