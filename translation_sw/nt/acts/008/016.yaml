  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: sw
  text: Kwa maana Roho Mtakatifu alikuwa bado hajamshukia hata mmoja wao; walikuwa wamebatizwa tu katika jina la Bwana Yesu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέπω
  choice: bado haja-
  rationale: Muundo wa ‘bado haja-’ unaonyesha kwa Kiswahili cha kawaida kwamba tendo hilo halikuwa limetokea kufikia wakati huo.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: hata mmoja wao
  rationale: Huwakilisha kwa kawaida na kwa usahihi maana ya kutomhusu mtu yeyote katika kundi hilo.
- source_word: ἐπιπεπτωκός
  choice: alikuwa ... hajamshukia
  rationale: ‘Kumshukia’ huhifadhi taswira ya ἐπιπίπτω ya Roho kuja juu ya watu, huku muundo wa ‘alikuwa bado hajamshukia’ ukitoa hali ya wakati uliopita kwa Kiswahili cha asili.
- source_word: μόνον
  choice: tu
  rationale: ‘Tu’ huonyesha kikomo na tofauti kati ya kubatizwa kwao na kutoshukiwa bado na Roho.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: walikuwa wamebatizwa
  rationale: Muundo huu unaonyesha tendo lililokuwa limekamilika kabla na hali yake iliyokuwa ikiendelea.
- source_word: εἰς τὸ ὄνομα
  choice: katika jina
  rationale: Hii ni nahau ya kawaida na inayoeleweka katika Kiswahili kuhusu ubatizo, bila kulazimisha maana ya kimadhehebu kutoka katika kihusishi εἰς.
- source_word: κυρίου Ἰησοῦ
  choice: Bwana Yesu
  rationale: Ni tafsiri ya kawaida, yenye heshima na ya moja kwa moja ya κυρίου Ἰησοῦ.
theological_decisions:
- issue: Kiima kisichotajwa cha ἐπιπεπτωκός
  choice: Roho Mtakatifu ametajwa wazi kama kiima kutokana na mstari uliotangulia.
  alternative: Kuacha kiima bila kutajwa au kutumia kiwakilishi pekee.
  rationale: Kigiriki hakirudii kiima, lakini muktadha wa karibu unamtaja Roho Mtakatifu. Kiswahili kinakuwa wazi na cha asili kwa kurudia jina hilo, bila kuongeza dai la kitheolojia lisilokuwapo katika muktadha.
- issue: Maneno ya ubatizo εἰς τὸ ὄνομα
  choice: katika jina la Bwana Yesu
  alternative: kuingia katika jina la Bwana Yesu
  rationale: ‘Katika jina’ ni nahau ya Kiswahili iliyo wazi; tafsiri ya kimofimu ‘kuingia katika jina’ inaweza kusikika isiyo ya kawaida na kudokeza ufafanuzi wa ziada. Mstari umeachwa bila kuamulia mijadala ya baadaye kuhusu fomula au teolojia ya ubatizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi uhusiano wa sababu unaoletwa na γάρ na tofauti inayowekwa na μόνον, huku ikiepuka lugha nzito au ya kimadhehebu.
