  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: sw
  text: Alikuwa akirudi, akiwa ameketi katika gari lake la kukokotwa, naye alikuwa akisoma kitabu cha nabii Isaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika nyakati za kale, mara nyingi watu walisoma kwa sauti; kwa hiyo, “alikuwa akisoma kwa sauti” pia inawezekana, ingawa hapa kitenzi cha Kigiriki hakisemi hivyo wazi.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Alikuwa akirudi
  rationale: Muundo wa ἦν pamoja na kitenzi-shirikishi cha wakati uliopo unaonyesha tendo lililokuwa likiendelea wakati uliopita. Tafsiri hii inadumisha hali hiyo bila kuongeza kwamba alikuwa akirudi nyumbani, jambo ambalo halijasemwa wazi katika Kigiriki.
- source_word: καθήμενος
  choice: akiwa ameketi
  rationale: Hueleza mkao wake wakati wa safari kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: katika gari lake
  rationale: Ingawa ἐπί inaweza kutafsiriwa kwa namna ya moja kwa moja kuwa ‘juu ya,’ Kiswahili cha kawaida husema mtu ameketi katika gari. ‘Gari’ hapa linaeleweka katika mazingira ya kale kama gari la kukokotwa.
- source_word: ἀνεγίνωσκεν
  choice: alikuwa akisoma
  rationale: Wakati usiotimilika unaonyesha tendo lililokuwa likiendelea. Kitenzi chenyewe hakisemi wazi kwamba alikuwa akisoma kwa sauti, hivyo wazo hilo limewekwa katika tanbihi badala ya matini kuu.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: kitabu cha nabii Isaya
  rationale: Katika muktadha, kinachosomwa ni maandishi ya Isaya. Kuongeza ‘kitabu cha’ hufanya Kiswahili kiwe wazi na cha kawaida bila kudai kwamba alikuwa akimsoma mtu mwenyewe; mpangilio ‘nabii Isaya’ ni wa asili katika Kiswahili.
