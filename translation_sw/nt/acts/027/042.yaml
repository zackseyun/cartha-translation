lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: walipanga
  rationale: Kishazi hiki kinaonyesha mpango au azimio lililofikiwa; kitenzi cha kawaida “walipanga” kinatoa maana hiyo kwa Kiswahili cha asili.
- source_word: τοὺς δεσμώτας
  choice: wafungwa
  rationale: Hurejelea watu waliokuwa chini ya ulinzi kama wafungwa.
- source_word: ἐκκολυμβήσας
  choice: asiogelee
  rationale: Maana yake ni kuondoka mahali hapo kwa kuogelea; muktadha wa ajali ya meli unaifanya “kuogelea” iwe wazi na ya kawaida.
- source_word: διαφύγῃ
  choice: kutoroka
  rationale: Hueleza kufanikiwa kuponyoka kutoka chini ya ulinzi.
