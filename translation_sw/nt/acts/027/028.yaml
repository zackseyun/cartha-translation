  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: sw
  text: Walipopima kina cha maji[a], wakakuta kina ni fathomu ishirini; kisha, waliposonga mbele kidogo na kupima tena, wakakuta kina ni fathomu kumi na tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana halisi zaidi, “baada ya kutupa timazi”; Kiyunani kinarejelea kupima kina cha bahari kwa timazi iliyofungwa kwenye kamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: walipopima kina cha maji
  rationale: Kitenzi hiki kinamaanisha kupima kina cha bahari kwa kutupa timazi iliyofungwa kwenye kamba. Tafsiri hii ni wazi kwa msomaji wa kawaida na inahifadhi tendo lenyewe.
- source_word: εὗρον
  choice: wakapata kuwa ni
  rationale: Katika muktadha huu neno linaeleza matokeo yaliyopatikana baada ya kipimo.
- source_word: ὀργυιὰς
  choice: pima
  rationale: ὀργυιά ni kipimo cha majini cha takriban mita 1.8. Neno la Kiswahili 'pima' hutaja kipimo hicho cha kina bila kuingiza neno la Kiingereza.
- source_word: εἴκοσι
  choice: ishirini
  rationale: Tafsiri ya moja kwa moja ya namba.
- source_word: βραχὺ
  choice: kidogo
  rationale: Linaonyesha umbali mfupi kabla ya kipimo kilichofuata.
- source_word: διαστήσαντες
  choice: waliposonga mbele
  rationale: Katika simulizi la safari ya meli, neno hili linaonyesha kwamba waliendelea kwa umbali fulani.
- source_word: πάλιν
  choice: tena
  rationale: Kielezi kinachoonyesha kurudiwa kwa tendo la kupima.
- source_word: δεκαπέντε
  choice: kumi na tano
  rationale: Tafsiri ya moja kwa moja ya namba.
- source_word: καὶ ... δὲ ... καὶ
  choice: '...; kisha, ... na ...'
  rationale: Viunganishi hapa vinaendeleza mfuatano wa simulizi kuliko kuonyesha upinzani mkali.
