  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: sw
  text: Ilipoamuliwa kwamba tusafiri kwa meli kwenda Italia, waliwakabidhi Paulo na baadhi ya wafungwa wengine kwa jemadari mmoja aliyeitwa Yulio, wa Kikosi cha Augusto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kikosi cha Kifalme”; huenda pia “kikosi cha Sebaste.” Neno la Kigiriki Σεβαστῆς linawakilisha cheo kinachohusishwa na Augusto au kaizari, lakini utambulisho kamili wa kikosi hiki hauna uhakika.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: ilipoamuliwa
  rationale: Kauli tendwa ya kitenzi hiki inaonyesha uamuzi rasmi bila kutaja walioufanya. “Ilipoamuliwa” ni ya kawaida katika Kiswahili na inadumisha maana hiyo ya kiutawala.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: kwamba tusafiri kwa meli
  rationale: Muundo huu unaeleza jambo lililoamuliwa. “Kwa meli” inadumisha maana mahsusi ya kuondoka au kusafiri baharini, na nafsi ya kwanza wingi inadumishwa katika “tusafiri.”
- source_word: παρεδίδουν
  choice: waliwakabidhi
  rationale: Kitenzi kinaeleza kuhamishwa rasmi chini ya ulinzi wa mwingine. “Waliwakabidhi” ni cha asili na wazi kwa muktadha wa wafungwa.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Paulo pamoja na wafungwa wengine kadhaa
  rationale: “Pamoja na” kinaonyesha uhusiano wa τε…καί, huku “wafungwa wengine kadhaa” kikitoa kwa kawaida maana ya τινας ἑτέρους δεσμώτας bila kudokeza idadi kamili.
- source_word: ἑκατοντάρχῃ
  choice: kwa akida mmoja
  rationale: “Akida” ni istilahi sanifu ya Kiswahili kwa ofisa wa jeshi la Roma mwenye cheo hiki; “mmoja” inaonyesha kuwa mtu huyo anatambulishwa hapa kwa mara ya kwanza.
- source_word: ὀνόματι Ἰουλίῳ
  choice: aliyeitwa Julio
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kutafsiri muundo wa kumtambulisha mtu kwa jina.
- source_word: σπείρης Σεβαστῆς
  choice: wa Kikosi cha Augusto
  rationale: σπεῖρα ni kikosi cha kijeshi, na Σεβαστή lina uhusiano wa moja kwa moja na jina au cheo Augusto. Tafsiri hii inaacha wazi kama hili lilikuwa jina rasmi la kikosi au jina lililoonyesha uhusiano wake na mfalme.
theological_decisions:
- issue: Utambulisho wa kihistoria wa σπείρης Σεβαστῆς
  choice: Kikosi cha Augusto
  alternative: Kikosi cha Kifalme; au Kikosi cha Sebaste
  rationale: Hili si suala la mafundisho, lakini jina kamili la kikosi halina uhakika. “Cha Augusto” kinakaribia zaidi neno la Kigiriki, huku maelezo ya chini yakihifadhi uwezekano wa maana ya kifalme au jina Sebaste.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Neno la kijeshi “akida” limetumiwa kwa sababu ni fupi, sanifu, na linafaa kwa mazingira ya Kirumi. Alama ya tanbihi imewekwa baada ya jina la kikosi, ambalo ndilo linalofafanuliwa.
