  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: sw
  text: Baada ya kukaa muda mrefu bila kula[a], Paulo alisimama katikati yao, akasema, “Enyi wanaume, mlipaswa kunisikiliza[b] na kutotia meli baharini kutoka Krete, na hivyo mngeepuka madhara haya na hasara hii[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Baada ya kufunga kwa muda mrefu.” Neno la Kigiriki ἀσιτία linaweza kumaanisha kukosa chakula au kujizuia kula; katika mazingira haya ya dhoruba, kutokula kwa muda mrefu ndilo linalowezekana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au “kunitii.” Kitenzi hiki kinaweza kumaanisha kutii agizo au mamlaka; hapa kinahusu kufuata ushauri wa Paulo.
    reason: lexical_alternative
  - marker: c
    text: Maneno “madhara” na “hasara” huenda yanatofautisha madhara au uharibifu na hasara, hasa ya mali.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Baada ya wao kukaa muda mrefu bila kula
  rationale: Kirai huru cha uhusiano kinaweka mazingira ya hotuba ya Paulo. Neno ἀσιτία linaweza kumaanisha kukosa chakula au kujizuia kula; katika mazingira ya dhoruba, maana inayowezekana zaidi ni kutokula kwa muda mrefu. “Baada ya” kinaonyesha mfuatano wa mazingira bila kusisitiza sababu.
- source_word: σταθεὶς ... ἐν μέσῳ αὐτῶν
  choice: alisimama katikati yao
  rationale: Huhifadhi tendo la Paulo kusimama na mahali pake miongoni mwa kundi ili kulihutubia, kwa Kiswahili cha kawaida.
- source_word: Ἔδει μέν
  choice: mlipaswa
  rationale: Hali ya wakati uliopita ya δεῖ inaonyesha jambo ambalo lingefaa kufanywa lakini halikufanywa. “Mlipaswa” ni ya asili na huhifadhi karipio la Paulo.
- source_word: ὦ ἄνδρες
  choice: Enyi wanaume
  rationale: Huhifadhi mwito wa moja kwa moja wa ἄνδρες kwa kundi la wanaume bila kubadili kuwa jina la kindugu lisilomo katika chanzo.
- source_word: πειθαρχήσαντάς μοι
  choice: kunisikiliza
  rationale: πειθαρχέω inaweza kumaanisha kutii au kusikiliza maagizo. Hapa Paulo anarejelea ushauri wake wa awali; “kunisikiliza” huwasilisha kuitii tahadhari hiyo bila kudokeza mamlaka rasmi kupita kiasi.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: kutotia meli baharini kutoka Krete
  rationale: Katika matumizi ya safari za majini, ἀνάγω humaanisha kuondoka kwa meli au kutia baharini. Tafsiri hii ni wazi na ya asili katika muktadha.
- source_word: κερδῆσαί τε
  choice: kwa kufanya hivyo mngeepuka
  rationale: Ingawa κερδαίνω kwa kawaida huhusu kupata faida, hapa ina maana ya kutojipatia au kuepuka madhara yaliyofuata. Kirai hiki kinaweka wazi uhusiano wa matokeo bila kubadili maana.
- source_word: τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: madhara haya na hasara hii
  rationale: Katika muktadha huu ὕβρις huelekea kumaanisha madhara makali yaliyowapata, huku ζημία ikimaanisha hasara. Maneno hayo mawili yamehifadhiwa tofauti badala ya kuunganishwa.
