translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia msamiati wa kawaida wa safari ya baharini na kuhifadhi mwito wa moja kwa moja pamoja na utofauti wa maneno mawili ya mwisho.
