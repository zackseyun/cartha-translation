  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: sw
  text: Kwa kuogopa wasije wakakwama kwenye maeneo yenye miamba[a], wakatupa nanga nne kutoka sehemu ya nyuma ya meli, kisha waliomba kupambazuke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wangesukumwa kwenye miamba mikali,” au “wangekwama kwenye maeneo magumu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “waliomba siku iwe.” Neno lililotafsiriwa “waliomba” linaweza pia kumaanisha “walitamani”; yaani, walitamani sana nuru ya asubuhi ifike.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: Kwa kuogopa
  rationale: 'Kirai hiki kinahifadhi hali ya kisababishi ya kitenzi-shirikishi: hofu yao ndiyo iliyowafanya watupe nanga na kuomba.'
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: kwamba huenda tungekwama kwenye maeneo yenye miamba
  rationale: Katika muktadha wa baharini, ἐκπίπτω inaeleza chombo kufika au kusukumwa kwenye eneo hatari na kukwama. 'Maeneo yenye miamba' linaonyesha ukali na hatari ya τραχεῖς τόπους bila kubainisha aina maalumu ya mwamba au ufuo.
- source_word: ἐκ πρύμνης
  choice: kutoka sehemu ya nyuma ya meli
  rationale: Hili ni tamko la kawaida na linaloeleweka kwa wasomaji wengi kuliko istilahi adimu ya kitaalamu ya sehemu ya nyuma ya meli.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: wakatupa nanga nne
  rationale: Linawasilisha kwa kawaida tendo la kuteremsha au kutupa nanga, na mpangilio wa matendo unaonyesha kuwa hili lilitangulia ombi lao.
- source_word: ηὔχοντο
  choice: wakaomba
  rationale: Kitenzi kinaweza kueleza kuomba au kutamani. Katika muktadha huu 'wakaomba' hudumisha uwezekano wa sala uliopo katika neno la Kigiriki, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: ἡμέραν γενέσθαι
  choice: kupambazuke
  rationale: Hili ni tamko la asili la Kiswahili kwa kufika kwa nuru ya asubuhi, ambalo ndilo wazo la kirai halisi 'siku iwe/itokee.'
theological_decisions:
- issue: Ikiwa ηὔχοντο ina maana ya kusali au kutamani
  choice: wakaomba
  alternative: wakatamani
  rationale: Neno la Kigiriki linaruhusu maana zote mbili. Matini kuu inatumia 'wakaomba' bila kutaja walimwomba nani, na tanbihi inahifadhi uwezekano wa maana ya kutamani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. 'Sehemu ya nyuma ya meli' imetumiwa badala ya istilahi adimu ya baharini ili aya ieleweke kwa msomaji wa kawaida.
