base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: sw
  text: akiwaambia, “Enyi wanaume, naona kwamba safari hii ya baharini itakuwa na maafa na hasara kubwa[a], si kwa shehena na meli tu, bali pia kwa maisha yetu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “itakuwa na madhara makali na uharibifu mkubwa.” Maneno ya Kigiriki yanaweza kukazia madhara makali au uharibifu utakaoandamana na safari.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “nafsi zetu”; lakini hapa maana ni “maisha yetu,” kwa kuwa muktadha unahusu uwezekano wa meli kuvunjika na watu kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: akiwaambia
  rationale: Muundo huu wa kishiriki unaendeleza simulizi kwa kawaida katika Kiswahili na unaonyesha tendo linaloambatana na muktadha uliotangulia.
- source_word: Ἄνδρες
  choice: Enyi wanaume
  rationale: Huhifadhi mwito wa moja kwa moja wa ἀνήρ kwa kundi la wanaume waliokuwa melini, kwa lugha yenye heshima na inayoeleweka.
- source_word: θεωρῶ
  choice: naona
  rationale: Katika muktadha huu neno linaonyesha utambuzi au tathmini ya Paulo, si kuona kwa macho tu; ‘naona kwamba’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: italeta maafa na hasara kubwa
  rationale: ὕβρις hapa linaelekea kumaanisha madhara makali au janga la safari, wala si kiburi cha kimaadili; ζημία ni hasara au uharibifu. Kitenzi ‘italeta’ kinafanya uhusiano wa matokeo kuwa wa kawaida katika Kiswahili.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: si kwa shehena na meli tu, bali pia
  rationale: Huwasilisha muundo wa ‘si tu ... bali pia’ na kuonyesha vitu ambavyo vitapata hasara. ‘Shehena’ ni neno la kawaida na sahihi kwa φορτίον katika safari ya meli.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: maisha yetu
  rationale: Katika hatari ya kuvunjika kwa meli, ψυχή humaanisha uhai wa mtu; ‘maisha yetu’ huwasilisha tishio la kufa bila kuingiza wazo lisilokusudiwa la nafsi isiyo ya mwili.
- source_word: μέλλειν ἔσεσθαι
  choice: italeta
  rationale: Wakati ujao unaonyesha matarajio ya Paulo kwamba madhara yako mbele na yanakaribia, huku sentensi ikibaki ya kawaida katika Kiswahili.
- source_word: τὸν πλοῦν
  choice: safari hii ya baharini
  rationale: πλοῦς ni safari kwa njia ya bahari; ‘safari hii ya baharini’ ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi isiyo ya kawaida.
