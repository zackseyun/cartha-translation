translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri kuu imetanguliza usemi wa kawaida wa Kiswahili, huku tanbihi zikihifadhi upana wa jina la kale Adria na taswira halisi ya nchi kuwakaribia mabaharia.
