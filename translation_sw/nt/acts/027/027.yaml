base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: sw
  text: Usiku wa kumi na nne ulipofika, tulipokuwa tukisukumwa katika Bahari ya Adria[a], karibu na saa sita usiku, mabaharia wakaanza kudhani kwamba walikuwa wakikaribia nchi kavu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la kale “Adria” lingeweza kumaanisha eneo pana la maji ya Mediterania ya kati katika sehemu hii, si Bahari ya Adriatiki ya leo pekee.
    reason: cultural_note
  - marker: b
    text: Kwa muundo wa Kigiriki, “mabaharia walikuwa wakidhani kwamba nchi kavu fulani ilikuwa inawakaribia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: Usiku wa kumi na nne ulipofika
  rationale: Kifungu hiki kinaonyesha kufika kwa usiku wa kumi na nne katika mfululizo wa dhoruba; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: διαφερομένων ἡμῶν
  choice: tulipokuwa tukisukumwa huku na huku
  rationale: Kauli tendwa ya wakati unaoendelea inaonyesha kwamba chombo kilikuwa kikipelekwa bila udhibiti wao; ‘kusukumwa huku na huku’ hudokeza mwendo unaosababishwa na upepo na mawimbi.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: katika Bahari ya Adria
  rationale: ‘Adria’ ni jina la kihistoria lililoweza kumaanisha eneo pana la maji ya Mediterania ya kati, hivyo limetoholewa badala ya kulifanya lilingane kabisa na Bahari ya Adriatiki ya leo.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: karibu na usiku wa manane
  rationale: Huhifadhi maana ya kukadiria wakati katikati ya usiku bila kudai saa kamili.
- source_word: ὑπενόουν
  choice: wakaanza kuhisi
  rationale: Wakati usiotimilifu unaweza kuonyesha utambuzi uliokuwa unaanza; ‘kuhisi’ huhifadhi hali ya kutokuwa na uhakika kuliko ‘kujua’.
- source_word: οἱ ναῦται
  choice: mabaharia
  rationale: Ni neno la kawaida na lenye hadhi kwa wafanyakazi wenye ujuzi wa kuendesha chombo baharini.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: kwamba walikuwa wakikaribia nchi kavu
  rationale: Ingawa Kigiriki kinawasilisha nchi kana kwamba inawakaribia, Kiswahili cha kawaida huonyesha mabaharia wakikaribia nchi; tanbihi inahifadhi taswira halisi ya muundo wa chanzo.
