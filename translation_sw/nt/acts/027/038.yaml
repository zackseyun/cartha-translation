  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: sw
  text: Baada ya kula na kushiba[a], wakaanza kupunguza uzito wa meli[b] kwa kuitupa ngano[c] baharini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokuwa wameshiba kwa chakula,” au, “baada ya kutosheka kwa chakula.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wakipunguza uzito wa meli,” au kwa urahisi, “walipunguza uzito wa meli.” Wakati usiotimilifu wa kitenzi cha Kigiriki unaweza kusisitiza mwendelezo au mwanzo wa tendo.
    reason: lexical_alternative
  - marker: c
    text: Au, “nafaka.” Neno la Kigiriki linaweza kuwa na maana pana zaidi, lakini hapa huenda linamaanisha hasa ngano.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: Baada ya wote kula na kushiba
  rationale: Kirai hiki kinaonyesha kwamba watu walikula mpaka wakatosheka. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha pia kwamba kitendo hicho kilitangulia kile kilichofuata.
- source_word: δὲ
  choice: Baada ya
  rationale: δέ ni kiunganishi hafifu kinachoendeleza simulizi; hapa uhusiano wa hatua zinazofuatana unaelezwa kwa kawaida ndani ya kirai cha mwanzo.
- source_word: ἐκούφιζον τὸ πλοῖον
  choice: wakaanza kuipunguzia meli uzito
  rationale: Wakati usiotimilifu wa kitenzi unaweza kuonyesha mwanzo au mwendelezo wa tendo. 'Wakaanza' huleta maana ya kuanza kwa tendo, huku 'kuipunguzia meli uzito' ikiwa usemi wa asili na wazi.
- source_word: ἐκβαλλόμενοι
  choice: kwa kuitupa
  rationale: Kivumishi-tendo hiki kinaeleza njia waliyotumia kupunguza uzito wa meli; 'kwa kuitupa' huwasilisha dhima hiyo kwa uwazi.
- source_word: τὸν σῖτον
  choice: ngano
  rationale: σῖτος inaweza kumaanisha nafaka kwa ujumla, lakini katika mazingira ya mzigo wa meli hii inaelekea kumaanisha ngano.
- source_word: εἰς τὴν θάλασσαν
  choice: baharini
  rationale: Hii ni tafsiri ya kawaida ya mwelekeo wa kuitupa ngano ndani ya bahari.
