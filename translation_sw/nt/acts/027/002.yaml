  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: sw
  text: Basi tukapanda meli ya Adramitio, iliyokuwa karibu kusafiri kwenda maeneo ya Asia[a][b], kisha tukaondoka. Aristarko, Mmakedonia kutoka Thesalonike, alikuwa pamoja nasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jimbo la Roma lililoitwa Asia, magharibi mwa Asia Ndogo, wala si bara la Asia la leo.
    reason: cultural_note
  - marker: b
    text: Au, “kwenda bandari zilizo kandokando ya pwani ya Asia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: tukapanda
  rationale: Katika muktadha wa safari ya majini, kitenzi hiki humaanisha kupanda chombo; “tukapanda meli” ni Kiswahili cha kawaida na kinaonyesha tendo lililotangulia kuondoka.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha upinzani mkubwa; “Basi” linaunganisha aya hii na iliyotangulia kwa kawaida.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: meli kutoka Adramitio
  rationale: Kivumishi Ἀδραμυττηνῷ kinaitambulisha meli kwa mahali ilikotoka au bandari yake ya nyumbani. Muundo huu ni wazi zaidi kwa msomaji wa Kiswahili kuliko kuunda kivumishi cha jina hilo.
- source_word: μέλλοντι πλεῖν
  choice: iliyokuwa karibu kusafiri
  rationale: μέλλω pamoja na kitenzi-jina huonyesha jambo lililokaribia au lililokusudiwa kutokea; tafsiri hii inahifadhi wazo la safari iliyokuwa karibu kuanza.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: kwenda sehemu mbalimbali kandokando ya Asia
  rationale: κατά hapa ina maana ya kijiografia au ya mgawanyo, yaani maeneo yaliyo katika mfululizo kandokando ya Asia. “Sehemu mbalimbali” hudokeza wingi wa vituo bila kuingiza moja kwa moja neno “bandari,” ambalo halipo wazi katika Kigiriki.
- source_word: Ἀσίαν
  choice: Asia
  rationale: Jina la kihistoria limehifadhiwa katika matini, huku tanbihi ikifafanua kuwa ni jimbo la Roma, si bara la kisasa.
- source_word: ἀνήχθημεν
  choice: tukaondoka bandarini
  rationale: ἀνάγω katika matumizi ya safari za majini humaanisha kuondoka bandarini na kuanza safari baharini. Tafsiri hii ni ya asili katika Kiswahili na inaepuka kurudia tu wazo la kusafiri.
- source_word: ὄντος σὺν ἡμῖν
  choice: alikuwa pamoja nasi
  rationale: Muundo wa genitive absolute unaongeza hali iliyoambatana na safari. Sentensi tofauti fupi huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kubadili uhusiano wake na tukio kuu.
- source_word: Ἀριστάρχου
  choice: Aristarko
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa majina ya Kibiblia katika Kiswahili.
- source_word: Μακεδόνος
  choice: Mmakedonia
  rationale: Nomino hii inamtambulisha Aristarko kwa eneo au watu wake; “Mmakedonia” ni namna fupi na ya kawaida ya Kiswahili.
- source_word: Θεσσαλονικέως
  choice: kutoka Thesalonike
  rationale: Hii inabainisha mji wa Aristarko. “Kutoka Thesalonike” ni wazi na huepuka kurundika majina mawili ya utaifa au wenyeji.
