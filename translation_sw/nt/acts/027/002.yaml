translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na lugha ya sasa yenye hadhi. Majina yametoholewa kwa matumizi yanayoeleweka katika Kiswahili; utata wa “sehemu” dhidi ya “bandari” umehifadhiwa kwa kuweka neno la jumla katika matini na chaguo mahususi zaidi katika tanbihi.
