  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: sw
  text: Lakini yule jemadari wa kikosi alishawishika zaidi na nahodha na mwenye meli kuliko na yale yaliyosemwa na Paulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini yule jemadari wa kikosi aliupa uzito zaidi ushauri wa nahodha na mwenye meli kuliko yale aliyosema Paulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: jemadari wa kikosi
  rationale: Ni cheo cha afisa wa jeshi la Roma aliyesimamia kikosi; tafsiri hii inaeleweka kwa msomaji wa kawaida bila kuingiza idadi kama ufafanuzi usio katika neno lenyewe.
- source_word: κυβερνήτῃ
  choice: nahodha
  rationale: Katika muktadha wa safari ya baharini, neno hili humaanisha aliyeongoza au kuendesha meli. 'Nahodha' ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: ναυκλήρῳ
  choice: mwenye meli
  rationale: Hutaja mmiliki au mwendeshaji mkuu wa meli; 'mwenye meli' linatofautisha jukumu hili na κυβερνήτης.
- source_word: μᾶλλον ἐπείθετο
  choice: akawasikiliza ... zaidi
  rationale: Katika muktadha wa kufanya uamuzi, usemi huu unaonyesha kumpa mtu uzito au kukubali ushauri wake zaidi. 'Akawasikiliza ... zaidi' ni wa asili katika Kiswahili huku tanbihi ikihifadhi maana ya moja kwa moja ya kushawishiwa.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: maneno ya Paulo
  rationale: Muundo huu unarejelea mambo yaliyosemwa na Paulo, yaani onyo au ushauri wake. Tafsiri fupi ni ya asili na haibadili kiini cha maana.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi kinaonyesha tofauti na onyo la Paulo katika mstari uliotangulia.
- source_word: ἢ
  choice: kuliko
  rationale: Hiki ndicho kiunganishi cha kawaida cha ulinganisho kinachoandamana na μᾶλλον.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. 'Jemadari wa kikosi' huepuka neno la mkopo lisilozoeleka, na tanbihi huhifadhi maana ya karibu zaidi ya ἐπείθετο pamoja na muundo tendwa wa kishiriki.
