base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: sw
  text: Kwa hiyo, nawasihi mle chakula, kwa maana hili ni kwa ajili ya usalama wenu[a]; kwa maana hakuna hata unywele mmoja kutoka kichwani mwa yeyote kati yenu utakaopotea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya wokovu wenu.” Neno la Kigiriki linaweza kumaanisha wokovu, ukombozi, usalama, au kuhifadhiwa hai; hapa linarejelea kunusurika kimwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hali na maelezo yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: παρακαλῶ
  choice: nawasihi
  rationale: Inaonyesha ombi la dhati na lenye msisitizo bila kuwa amri kali.
- source_word: μεταλαβεῖν τροφῆς
  choice: mle chakula
  rationale: Kirai hiki kinamaanisha kupata lishe kwa kula; usemi huu ni wa asili na wazi kwa wasomaji wa Kiswahili.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: kwa maana kufanya hivyo ni kwa ajili ya kuokoka kwenu
  rationale: ‘Kufanya hivyo’ hurejelea kula chakula, na ‘kuokoka’ huhifadhi upana wa σωτηρία huku muktadha ukionyesha wazi kupona katika hatari ya kimwili.
- source_word: σωτηρίας
  choice: kuokoka
  rationale: Katika muktadha wa ajali ya baharini neno hili linahusu kupona au kuhifadhiwa hai, lakini chaguo hili pia huhifadhi mwangwi wa maana pana ya neno la Kigiriki.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: cha yeyote kati yenu
  rationale: Huhifadhi maana ya kugawa kwa kila mtu mmoja mmoja katika kundi.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: hata unywele mmoja wa kichwa
  rationale: Huhifadhi taswira ya nahau ya Kigiriki inayosisitiza usalama kamili, huku ikisikika kawaida kwa Kiswahili.
- source_word: ἀπολεῖται
  choice: utakaopotea
  rationale: Kitenzi hiki hapa humaanisha kupotea; pamoja na ‘unywele’ kinadumisha uhakikisho wenye msisitizo kwamba hawatapatwa na madhara ya mauti.
theological_decisions:
- issue: Maana ya σωτηρία katika muktadha
  choice: Kuokoka kimwili/kuhifadhiwa hai, huku upana wa neno ukidokezwa
  alternative: wokovu
  rationale: Muktadha wa karibu ni kupona kwa watu waliomo melini wakati wa dhoruba. ‘Wokovu’ peke yake unaweza kueleweka kama wokovu wa kiroho; ‘kuokoka’ katika sentensi hii ni ya asili na muktadha unaielekeza kwenye kupona kimwili. Tanbihi inaweka wazi maana hiyo bila kufuta upeo wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa aya unahifadhi uhusiano wa kimantiki wa vifungu viwili vya γάρ na nahau ya unywele bila kuifanya kuwa ya kimadhehebu.
