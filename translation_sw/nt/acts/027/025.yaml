  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: sw
  text: Kwa hiyo, jipeni moyo, enyi wanaume, kwa maana ninamwamini Mungu[a] kwamba mambo yatakuwa kama vile nilivyoambiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninaamini Mungu.” Muundo wa Kigiriki unaweza kusisitiza kumtumaini Mungu au kuamini kwamba aliyosema ni kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na uhakikisho na himizo lililotangulia, kwa Kiswahili cha kawaida na wazi.
- source_word: εὐθυμεῖτε
  choice: jipeni moyo
  rationale: Amri hii inawahimiza wasikate tamaa bali wawe na ujasiri katikati ya hatari; usemi huu ni wa asili katika Kiswahili cha sasa.
- source_word: ἄνδρες
  choice: enyi wanaume
  rationale: Vocative ya ἀνήρ inawaelekea moja kwa moja wanaume waliokuwa melini, hivyo jinsia ya kundi la asili imehifadhiwa.
- source_word: πιστεύω τῷ θεῷ
  choice: ninamwamini Mungu
  rationale: Muundo wa kitenzi pamoja na dative unaweza kumaanisha kumwamini Mungu, yaani kukubali kuwa aliyosema ni kweli; tafsiri hii huhifadhi upande wa uhusiano wa kibinafsi na wa kuamini ujumbe.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutambulisha maudhui ya imani ya Paulo, si sababu ya yeye kuamini.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: itakuwa kama vile
  rationale: Hueleza ulinganifu kati ya jambo litakalotokea na namna ujumbe ulivyotolewa, bila kurudia maneno yasiyo ya lazima katika Kiswahili.
- source_word: λελάληταί μοι
  choice: nilivyoambiwa
  rationale: Huhifadhi hali ya kutendwa na ujumbe uliotolewa hapo awali ambao bado una uzito sasa; ni usemi wa asili kuliko tafsiri halisi ya 'imeneniwa kwangu.'
theological_decisions:
- issue: Maana ya πιστεύω τῷ θεῷ
  choice: ninamwamini Mungu
  alternative: ninaamini alichosema Mungu
  rationale: Dative inaweza kusisitiza kumwamini Mungu mwenyewe au kuamini ukweli wa neno lake. Maandishi makuu yanahifadhi usemi wa kibinafsi, na tanbihi inaonyesha pia upande wa kuamini ujumbe bila kutatua kimya kimya mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Jipeni moyo” linafaa katika mazingira ya hatari baharini; “enyi wanaume” huhifadhi anwani ya moja kwa moja na jinsia ya hadhira.
