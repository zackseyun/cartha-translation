  text: Lakini jemadari wa askari mia, akitaka kumwokoa Paulo, aliwazuia kutekeleza mpango wao,[a] kisha akaamuru wale walioweza kuogelea wajitupe kwanza kutoka melini na kufika nchi kavu.[b]
