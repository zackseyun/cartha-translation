lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: jemadari wa askari mia
  rationale: Hutoa cheo cha kijeshi cha Kirumi kwa Kiswahili kinachoeleweka, badala ya kutumia mkopo usio wa kawaida kwa wasomaji wengi.
- source_word: βουλόμενος
  choice: akitaka
  rationale: Inaonyesha nia au shauku ya jemadari bila kuifanya kuwa azimio kali kuliko ilivyo katika Kigiriki.
- source_word: διασῶσαι
  choice: kumwokoa
  rationale: Katika muktadha huu ni kumhifadhi Paulo hai dhidi ya hatari iliyokusudiwa.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: aliwazuia kutekeleza mpango wao
  rationale: Inaeleza kwa kawaida kwamba aliwazuia kufanya kusudi lao la kuwaua wafungwa lililotajwa katika mstari uliotangulia.
- source_word: ἐκέλευσέν τε
  choice: kisha akaamuru
  rationale: Hudumisha nguvu ya amri na mwendelezo wa matendo katika simulizi.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: wale walioweza kuogelea
  rationale: Inabainisha wazi kundi la watu waliokuwa na uwezo wa kuogelea.
- source_word: ἀπορίψαντας
  choice: wajitupe kwanza kutoka melini
  rationale: Huwasilisha tendo la kujitupa kutoka chomboni majini kwa lugha ya kawaida, huku meli ikitokana wazi na muktadha.
- source_word: πρώτους
  choice: kwanza
  rationale: Inaonyesha kwamba waogeleaji walipaswa kutangulia wengine.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: kufika nchi kavu
  rationale: Inaonyesha mwendo kutoka majini hadi nchi kavu kwa Kiswahili cha kawaida bila kulazimisha maana finyu ya ufukwe.
