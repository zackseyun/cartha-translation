lexical_decisions:
- source_word: εἰς
  choice: kwenye
  rationale: Pamoja na ἐκπεσεῖν katika muktadha wa safari ya baharini, neno hili linaonyesha mahali ambako chombo kitakwama; “kwenye” ni ya kawaida na huhifadhi mwelekeo huo.
- source_word: νῆσον
  choice: kisiwa
  rationale: Nomino hii humaanisha moja kwa moja kisiwa.
- source_word: δέ
  choice: Lakini
  rationale: δέ huonyesha mwendelezo wenye utofauti mdogo; “Lakini” inafaa kwa kulinganisha wokovu uliotangazwa na ulazima wa chombo kukwama.
- source_word: τινα
  choice: fulani
  rationale: Kiwakilishi hiki kinaonyesha kisiwa kisichotajwa wazi; “fulani” huhifadhi hali hiyo ya kutokuwa maalumu.
- source_word: δεῖ
  choice: ni lazima
  rationale: Kitenzi hiki huonyesha ulazima; “ni lazima” ni usemi wa kawaida wenye nguvu inayofaa.
- source_word: ἡμᾶς
  choice: tu-
  rationale: Ingawa katika Kigiriki ni kiwakilishi cha hali ya kushutumiwa kinachokuwa mtendaji wa kitenzi-jina, Kiswahili huonyesha nafsi ya kwanza wingi kwa kiambishi cha mtenda “tu-” katika “tukwame.”
- source_word: ἐκπεσεῖν
  choice: tukwame
  rationale: Katika matumizi ya baharini ἐκπίπτω inaweza kumaanisha kusukumwa ufukweni au kukwama. “Tukwame” ni Kiswahili cha kawaida na kifupi kinachoeleza chombo kugonga au kukwama karibu na nchi kavu bila kutaja wazi mtendaji.
