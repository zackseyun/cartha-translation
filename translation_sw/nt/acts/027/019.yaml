  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: sw
  text: Siku ya tatu, kwa mikono yao wenyewe wakatupa baharini vifaa vya meli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wao wenyewe wakatupa baharini vifaa vya meli.”
    reason: Mbadala huu hutafsiri αὐτόχειρες kwa msisitizo wa kwamba wao binafsi walifanya tendo hilo.
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: Siku ya tatu
  rationale: Hii ni kauli ya wakati yenye namba ya mpangilio; Kiswahili cha kawaida husema “Siku ya tatu” bila kihusishi.
- source_word: αὐτόχειρες
  choice: wao wenyewe
  rationale: Inahifadhi msisitizo kwamba watu waliokuwa melini walifanya tendo hilo binafsi. Kiswahili “wao wenyewe” ni cha asili zaidi hapa kuliko tafsiri sisisi “kwa mikono yao wenyewe,” huku mbadala huo ukihifadhiwa katika tanbihi.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: vifaa vya meli
  rationale: Katika muktadha wa baharini, σκευή humaanisha vifaa au zana za meli; “vifaa vya meli” ni wazi, pana kwa kiwango kinachofaa, na inaeleweka kwa wasomaji wa kawaida.
- source_word: ἔρριψαν
  choice: wakatupa baharini
  rationale: Kitenzi humaanisha kutupa; muktadha unaonyesha vilitupwa kutoka melini kwenda baharini. “Baharini” huifanya maana hiyo ya kimuktadha iwe wazi kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa masimulizi “wakatupa” unaendeleza mfuatano wa matukio, na msisitizo wa αὐτόχειρες umehifadhiwa bila kufanya sentensi iwe nzito.
