lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha hatua inayofuata katika simulizi kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ἀπέκοψαν
  choice: wakakata
  rationale: Huonyesha tendo la kukata na kutenganisha kamba; katika muktadha huu matokeo ya kuziachilia yanaeleweka wazi.
- source_word: οἱ στρατιῶται
  choice: askari
  rationale: Ni tafsiri ya kawaida na sahihi ya kundi la wanajeshi hapa.
- source_word: τὰ σχοινία
  choice: kamba
  rationale: Ni neno la kawaida la Kiswahili kwa kamba zilizofunga chombo hicho kidogo.
- source_word: τῆς σκάφης
  choice: za mashua ndogo
  rationale: σκάφη ni chombo kidogo kilichokuwa cha meli; 'mashua ndogo' huitofautisha na meli kuu kwa lugha inayoeleweka.
- source_word: εἴασαν
  choice: wakaiacha
  rationale: Huwasilisha maana ya kuruhusu au kuacha jambo litokee.
- source_word: αὐτὴν
  choice: i-
  rationale: Kiambishi cha ngeli kinarejelea mashua ndogo kwa kawaida katika Kiswahili.
- source_word: ἐκπεσεῖν
  choice: ianguke na kupeperushwa mbali
  rationale: Kitenzi kina picha ya kuanguka au kuondoka, na katika muktadha wa baharini kinaweza kumaanisha kupeperushwa mbali; uundaji huu huhifadhi vipengele vyote bila kuficha uwezekano huo.
