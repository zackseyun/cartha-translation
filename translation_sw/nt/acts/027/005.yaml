  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: sw
  text: Baada ya kuvuka bahari ya wazi kando ya Kilikia na Pamfilia[a], tukashuka hadi Mira katika Likia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baharini karibu na Kilikia na Pamfilia,” yaani, kwa njia ya baharini iliyopita sambamba na pwani za maeneo hayo.
    reason: lexical_alternative
  - marker: b
    text: Au, “tukafika Mira katika Likia.” Kitenzi cha Kigiriki kwa maana ya neno kwa neno ni “tukashuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: bahari kuu
  rationale: Neno hili humaanisha eneo la bahari lililo wazi, si bahari kwa ujumla tu; ‘bahari kuu’ ni usemi wa kawaida wa Kiswahili unaodumisha maana hiyo.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: kandokando ya Kilikia na Pamfilia
  rationale: κατά pamoja na hali ya kushutumiwa hapa huonyesha mwendo baharini sambamba na pwani za maeneo hayo; ‘kandokando ya’ ni ya asili na haidai kwamba walikuwa nchi kavu.
- source_word: διαπλεύσαντες
  choice: baada ya kuvuka
  rationale: Kauli ya wakati uliopita inatangulia kitendo kikuu na inaonyesha kwamba safari ya kuvuka kwa meli ilikamilika kabla ya kufika Mira.
- source_word: κατήλθομεν
  choice: tukashuka hadi
  rationale: Uamuzi huu unahifadhi maana ya msingi ya kuelekea chini katika κατέρχομαι, huku ‘hadi’ ikiweka wazi kwamba Mira ilikuwa mwisho wa hatua hiyo ya safari.
- source_word: Μύρα τῆς Λυκίας
  choice: Mira katika Likia
  rationale: Hali milikishi ya Kigiriki hutambulisha eneo ambamo Mira ilipatikana; Kiswahili cha kawaida hutumia ‘katika Likia.’
- source_word: τε
  choice: kiunganishi kilichodokezwa katika mtiririko
  rationale: τε huunganisha simulizi hili kwa upole na yaliyotangulia; Kiswahili hakihitaji neno tofauti hapa kwa kuwa mtiririko wa sentensi tayari unatimiza kazi hiyo.
