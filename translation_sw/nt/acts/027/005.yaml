  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Majina ya maeneo yametoholewa kwa namna inayoeleweka kwa wasomaji wa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
