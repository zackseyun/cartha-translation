  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: sw
  text: Baada ya kusema hayo, alichukua mkate, akamshukuru Mungu mbele ya wote[a], kisha akaumega na kuanza kula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wote wakiwa hapo.
    reason: Njia nyingine ya kutafsiri ἐνώπιον πάντων; kifungu hicho kinaweza kusisitiza kwamba tendo hilo lilifanywa watu wote wakiwepo.
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Baada ya kusema hayo
  rationale: Muundo huu unaonyesha kwa lugha ya kawaida kwamba kusema kulitangulia matendo yaliyofuata; δέ inabebwa na mwendelezo wa simulizi bila kulazimisha kiunganishi tofauti.
- source_word: λαβὼν ἄρτον
  choice: alichukua mkate
  rationale: ἄρτον haitaji wazi ikiwa ni mkate mzima au sehemu yake; ‘mkate’ linahifadhi kutobainishwa huko bila kuongeza maelezo.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: akamshukuru Mungu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kumtolea Mungu shukrani.
- source_word: ἐνώπιον πάντων
  choice: wote wakiwa hapo
  rationale: Kifungu hiki kinaonyesha kwamba tendo lilifanywa watu wote wakiwepo. Kauli hii ni ya asili kwa Kiswahili na haiongezi wazo lisilokuwamo katika chanzo.
- source_word: κλάσας
  choice: kisha akaumega
  rationale: ‘Kisha’ linaonyesha kwamba kuumega kulitangulia kuanza kula; kiwakilishi cha kitu katika ‘akaumega’ kinarejelea mkate uliotajwa.
- source_word: ἤρξατο ἐσθίειν
  choice: akaanza kula
  rationale: Inahifadhi wazi maana ya kuanza kutenda, badala ya kusema tu kwamba alikula.
theological_decisions:
- issue: Uwezekano wa mfuatano wa matendo kukumbusha Meza ya Bwana
  choice: Matendo yametafsiriwa kama simulizi la kawaida la kula bila kuyapa istilahi maalumu za ibada.
  alternative: Kutumia maneno ya kimapokeo yanayoweza kufanya tukio lisikike wazi kama adhimisho la Meza ya Bwana.
  rationale: Mfuatano wa kuchukua mkate, kushukuru, kuumega na kula unaweza kukumbusha matukio mengine ya Agano Jipya, lakini mstari huu wenyewe hautaji kwamba huu ulikuwa Meza ya Bwana. Tafsiri haipaswi kuamua jambo hilo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya kifungu inachokihusu, yaani ἐνώπιον πάντων, badala ya baada ya ‘mkate’.
