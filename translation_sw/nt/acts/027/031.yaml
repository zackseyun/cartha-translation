base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: sw
  text: Paulo aliwaambia jemadari na wale askari, “Watu hawa wasipobaki katika meli, ninyi hamwezi kuokolewa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kunusurika.” Kigiriki kinasema “kuokolewa”; katika muktadha huu linamaanisha kunusurika kimwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: mkuu wa askari mia
  rationale: Hueleza kwa uwazi cheo cha kijeshi cha Kirumi kwa Kiswahili cha kawaida, bila kutegemea istilahi ya mkopo isiyofahamika kwa wasomaji wengi.
- source_word: οὗτοι
  choice: watu hawa
  rationale: Kiwakilishi hiki kinawarejelea mabaharia waliokuwa wakijaribu kuondoka melini; kuongeza “watu” hufanya rejeleo liwe wazi na la kawaida katika Kiswahili.
- source_word: μείνωσιν
  choice: wasipobaki
  rationale: Kitenzi “kubaki” ni sawa la kawaida la μένω katika sharti hili na huonyesha kwamba watu hao lazima waendelee kuwamo melini.
- source_word: πλοίῳ
  choice: meli
  rationale: Katika simulizi hili neno hilo linamaanisha chombo kikubwa cha safari ya baharini; “meli” ni neno mahususi na la kawaida.
- source_word: σωθῆναι
  choice: kuokolewa
  rationale: Huhifadhi upana wa kitenzi σῴζω. Katika muktadha huu kinamaanisha kuokolewa na hatari ya ajali ya meli, si lazima wokovu wa kiroho.
- source_word: οὐ δύνασθε
  choice: hamwezi
  rationale: Ni usemi wa moja kwa moja na wa kawaida wa kutokuwa na uwezo.
theological_decisions:
- issue: Ikiwa σωθῆναι itafsiriwe kwa lugha inayotaja wazi kupona kimwili au kwa neno pana la kuokolewa.
  choice: kuokolewa
  alternative: kunusurika
  rationale: Muktadha unaonyesha wazi kwamba kinachozungumziwa ni kupona katika hatari ya baharini. Hata hivyo, “kuokolewa” huhifadhi maana pana ya kitenzi cha Kigiriki bila kuingiza dai la wokovu wa milele; tanbihi inafafanua maana yake hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sharti umetolewa kwa njia ya kawaida ya Kiswahili, na cheo cha Kirumi kimeelezwa kwa maneno yanayoeleweka kwa urahisi.
