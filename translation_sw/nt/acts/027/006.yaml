  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: sw
  text: Huko, yule jemadari wa askari mia akakuta meli ya Aleksandria iliyokuwa ikielekea Italia, akatupandisha ndani yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: Huko
  rationale: Katika mtiririko huu wa simulizi, “Huko” huonyesha mahali walipofika na kwa kawaida ya Kiswahili hubeba mwendelezo bila kulazimisha “na huko.”
- source_word: εὑρὼν
  choice: akakuta
  rationale: Kitenzi hiki kinaonyesha tendo lililotangulia tendo kuu; mfululizo wa vitenzi vya masimulizi katika Kiswahili unaonyesha kwa kawaida kwamba alikuta meli kisha akawapandisha.
- source_word: ἑκατοντάρχης
  choice: jemadari wa askari mia
  rationale: Hili ni tamko wazi na linaloeleweka kwa cheo cha kijeshi cha Kirumi, likihifadhi maana ya msingi ya mkuu wa kikosi cha askari mia.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: meli ya Aleksandria
  rationale: Kivumishi kinaonyesha uhusiano wa meli na Aleksandria, huenda asili au usajili wake; “meli ya Aleksandria” huhifadhi upana huo bila kuamua zaidi.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: iliyokuwa ikielekea Italia
  rationale: Kirai kinaonyesha meli iliyokuwa safarini kuelekea Italia; tafsiri hii ni ya kawaida kwa Kiswahili na haihitaji kudai kwamba ilikuwa tayari baharini wakati huo.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: akatupandisha ndani yake
  rationale: Kitenzi kina maana ya kusababisha watu waingie melini; “akatupandisha ndani yake” ni wazi, asilia, na huhifadhi maana hiyo ya kisababishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa simulizi ulio wazi na wenye heshima. Mfululizo wa “akakuta … akatupandisha” huwasilisha kwa ufasaha uhusiano wa kishiriki cha aoristi na kitenzi kikuu. Hakuna tanbihi iliyowekwa kwa kuwa tofauti ya “Huko/Na huko” na namna ya kueleza mwelekeo wa meli inaweza kuhifadhiwa katika matini bila hitaji la tanbihi.
