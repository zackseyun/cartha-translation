  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: sw
  text: Upepo wa kusini ulipoanza kuvuma kwa upole, walidhani kwamba walikuwa wamefanikisha kusudi lao. Basi wakainua nanga[a], wakasafiri kandokando ya Krete, karibu zaidi na ufuo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja, “wakiinua”; nanga inaeleweka kutokana na muktadha wa baharini.
    reason: lexical_alternative
  - marker: b
    text: Au “wakasafiri kandokando ya Krete, karibu na ufuo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: ulipoanza kuvuma kwa upole
  rationale: Kitenzi hiki humaanisha upepo kuvuma kwa nguvu ndogo; muundo huu unaeleza kwa Kiswahili cha kawaida mwanzo wa upepo huo mwanana katika muktadha.
- source_word: νότου
  choice: Upepo wa kusini
  rationale: νότος hapa ni upepo unaotoka upande wa kusini.
- source_word: δόξαντες
  choice: walidhani
  rationale: Neno hili linaonyesha makadirio au imani yao ya wakati huo, si jambo lililothibitishwa.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: kwamba walikuwa wamefanikisha kusudi lao
  rationale: Usemi huu una maana ya kudhani kwamba walikuwa wamepata au kufanikisha lengo walilokusudia; unadumisha hali ya uamuzi wao wa kibinadamu bila kuifanya iwe hakika.
- source_word: ἄραντες
  choice: wakang’oa nanga
  rationale: Ingawa maana ya moja kwa moja ni ‘kuinua,’ katika muktadha wa baharini nanga ndiyo kitu kinachoeleweka; ‘kung’oa nanga’ ni usemi wa kawaida wa Kiswahili kwa kuondoka baada ya kuinua nanga.
- source_word: ἆσσον
  choice: karibu sana na ufuo
  rationale: Kielezi hiki humaanisha ‘karibu zaidi’; muktadha wa kusafiri kandokando ya kisiwa unaonyesha ukaribu na ufuo.
- source_word: παρελέγοντο
  choice: wakasafiri kandokando
  rationale: Katika matumizi ya baharini, kitenzi hiki humaanisha kusafiri sambamba na pwani.
- source_word: τὴν Κρήτην
  choice: ya Krete
  rationale: Jina la kisiwa linahifadhiwa, huku ‘kandokando’ na rejeo la ufuo vikieleza kwamba safari ilikuwa kando ya pwani yake.
