base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: sw
  text: Kwa kuwa bandari hiyo haikufaa kukaa wakati wa majira ya baridi, wengi waliamua kuondoka kwa meli kutoka huko[a], wakitumaini kwamba kwa namna fulani wangeweza kufika Foinike[b] na kukaa huko wakati wa majira ya baridi—bandari ya Krete iliyoelekea kusini-magharibi na kaskazini-magharibi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kung’oa nanga na kuondoka huko.” Kitenzi cha Kigiriki ni istilahi ya safari ya baharini inayomaanisha kuondoka kwa meli.
    reason: lexical_alternative
  - marker: b
    text: Foinike ilikuwa bandari katika kisiwa cha Krete.
    reason: cultural_note
  - marker: c
    text: Kishazi cha mwisho kinachoeleza mielekeo ni kigumu. Kwa kawaida hutafsiriwa “kusini-magharibi na kaskazini-magharibi”; wengine hulielewa neno la pili kwa maana hususa zaidi ya “magharibi-kaskazini-magharibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: haikufaa
  rationale: Huonyesha kwamba bandari haikufaa kwa kusudi lililotajwa, yaani kukaa humo wakati wa majira ya baridi.
- source_word: λιμένος
  choice: bandari
  rationale: Ni neno la kawaida na sahihi katika muktadha wa safari ya baharini.
- source_word: πρὸς παραχειμασίαν
  choice: kukaa wakati wa majira ya baridi
  rationale: Hueleza kusalia mahali katika kipindi chote cha majira ya baridi kwa Kiswahili cha kawaida.
- source_word: οἱ πλείονες
  choice: wengi
  rationale: Hurejelea sehemu kubwa zaidi ya kundi bila kuongeza utambulisho ambao haukutajwa katika Kigiriki.
- source_word: ἔθεντο βουλήν
  choice: waliamua
  rationale: Huwasilisha kwa ufasaha nahau ya Kigiriki yenye maana ya kufikia azimio la pamoja.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: kuondoka kwa meli kutoka huko
  rationale: ἀνάγω ni istilahi ya safari ya baharini inayomaanisha kuondoka au kuanza safari kwa meli; tafsiri hii huiweka wazi kwa msomaji wa kawaida.
- source_word: εἴ πως δύναιντο
  choice: wakitumaini kwamba kwa namna fulani wangeweza
  rationale: Huhifadhi wazo la uwezekano usio na uhakika pamoja na lengo walilotazamia kulifikia.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: kufika Foinike
  rationale: Hutoa kwa kawaida maana ya kuwasili katika kituo kilichokusudiwa.
- source_word: Φοίνικα
  choice: Foinike
  rationale: Ni utohozi wa kawaida wa Kiswahili wa jina la mahali Φοῖνιξ katika muktadha huu.
- source_word: παραχειμάσαι
  choice: kukaa huko wakati wa majira ya baridi
  rationale: Huhifadhi kurudiwa kwa wazo la kukaa kipindi cha baridi, sasa likihusishwa na mahali walipokusudia kufika.
- source_word: βλέποντα
  choice: iliyoelekea
  rationale: Katika maelezo ya kijiografia ya bandari, neno hili huonyesha mwelekeo au upande ambao bandari imefunguka.
- source_word: κατὰ λίβα καὶ κατὰ χῶρον
  choice: kusini-magharibi na kaskazini-magharibi
  rationale: Hufuata uelewa wa jadi wa istilahi hizi za upepo na mwelekeo huku ugumu wa kishazi ukielezwa katika tanbihi.
