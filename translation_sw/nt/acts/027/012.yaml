translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umegawanywa katika sentensi mbili ili kuepuka sentensi ndefu isiyo ya kawaida, bila kuondoa uhusiano wa maelezo kuhusu Foinike. Alama zote za tanbihi zimewekwa mahali panapohusika katika matini.
