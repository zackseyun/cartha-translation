  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: sw
  text: Baada ya kuachia nanga na kuziacha baharini, wakati huohuo wakalegeza kamba zilizofunga makasia ya kuongozea meli[a], wakapandisha tanga la mbele kulikabili upepo uliokuwa ukivuma[b], kisha wakaelekeza meli ufukweni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifungo vya vifaa vya kuongozea meli.” Neno la Kigiriki ni istilahi adimu ya baharini kwa vitu vilivyofunga au kushikilia vifaa vya kuongozea meli.
    reason: lexical_alternative
  - marker: b
    text: Huenda ikawa “tanga la juu” au “tanga la sehemu ya mbele ya meli”; aina kamili ya tanga linalomaanishwa na istilahi hii ya Kigiriki haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: wakazifungua
  rationale: Katika muktadha wa nanga, kitenzi hiki kinaonyesha kuziondoa katika hali ya kushikilia meli na kuziacha ziende; ‘wakazifungua’ ni lugha ya kawaida ya baharini bila kudai kwa uhakika kwamba kamba zilikatwa.
- source_word: ἀγκύρας
  choice: nanga
  rationale: Ni nomino ya kawaida ya baharini; wingi unaeleweka kutokana na muundo wa kitenzi na rejea inayofuata.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: na kuziacha baharini
  rationale: Huhifadhi maana ya kuziacha nanga ziende na kubaki baharini, badala ya kuzipandisha melini.
- source_word: ἅμα
  choice: Wakati huohuo
  rationale: Huonyesha kwamba vitendo vinavyofuata vilifanyika sambamba na kuachwa kwa nanga.
- source_word: ἀνέντες
  choice: wakalegeza
  rationale: Hutoa maana ya kuachilia au kulegeza vitu vilivyokuwa vimefungwa.
- source_word: ζευκτηρίας
  choice: kamba zilizofunga
  rationale: Ni neno adimu la baharini linalomaanisha vifungo vya vifaa vya kuongozea meli; ‘kamba zilizofunga’ linaeleweka kwa msomaji wa kawaida huku alama ya tanbihi ikihifadhi kutokuwa na uhakika wa istilahi.
- source_word: τῶν πηδαλίων
  choice: makasia ya kuongozea meli
  rationale: Wingi wa Kigiriki unaafikiana na makasia mawili ya kuongozea meli yaliyotumiwa katika meli za kale; tafsiri hii ni sahihi zaidi kihistoria na inaeleweka kuliko ‘usukani’ pekee.
- source_word: ἐπάραντες
  choice: wakapandisha
  rationale: Ni tendo la kuinua au kutweka tanga ili litumike.
- source_word: ἀρτέμωνα
  choice: tanga la mbele
  rationale: Ni tafsiri inayowezekana ya istilahi hii adimu ya baharini; kwa kuwa aina kamili ya tanga haijulikani kwa uhakika, tanbihi inaonyesha uwezekano huo.
- source_word: τῇ πνεούσῃ
  choice: ili lipate upepo
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba tanga lilipandishwa likabili upepo uliokuwa ukivuma, bila kurudia maneno yasiyo ya lazima.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: wakaelekeza meli ufukweni
  rationale: Katika matumizi ya baharini, kitenzi kina maana ya kushika au kuelekeza mwendo kuelekea mahali; αἰγιαλός ni ufuo wa bahari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa kwa urahisi wa kusoma, huku mfuatano na usambamba wa vitendo vya Kigiriki ukihifadhiwa. Alama [a] imewekwa baada ya kifungu kinachotafsiri ζευκτηρίας τῶν πηδαλίων, ambacho ndicho kinachohusika na tanbihi hiyo, badala ya baada ya ‘nanga.’
