base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: sw
  text: Baada ya kuipandisha mashua hiyo, walitumia kamba za kuimarishia, wakizifunga kuizunguka meli[a]. Nao, kwa kuogopa wasije wakakwama katika Sirti[b], walishusha vifaa vya meli[c], wakaendelea kusukumwa hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, walipitisha kamba kuizunguka ganda la meli ili kulitia nguvu.
    reason: lexical_alternative
  - marker: b
    text: Sirti lilikuwa eneo hatari karibu na pwani ya Afrika Kaskazini, lililojulikana kwa maji ya kina kifupi na fungu za mchanga.
    reason: cultural_note
  - marker: c
    text: Au “vyombo vya meli,” “kamba na vifaa vya meli,” au “nanga ya baharini.” Kigiriki kinasema kwa ujumla “kifaa/vifaa,” na kitu hasa kilichoshushwa hakijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Baada ya kuipandisha mashua hiyo
  rationale: Kiwakilishi cha Kigiriki kinarejelea mashua ndogo ya mstari uliotangulia, na kitenzi kishirikishi cha wakati uliopita kinaonyesha kwamba waliipandisha kwanza. Kutaja “mashua hiyo” huondoa utata kwa Kiswahili bila kuongeza jambo lisilokuwamo katika muktadha.
- source_word: βοηθείαις ἐχρῶντο
  choice: walitumia nyaya za kuimarishia
  rationale: βοήθειαι kwa kawaida ni ‘msaada’ au ‘vitu vya kusaidia,’ lakini katika mazingira haya ya baharini inaelekea kumaanisha nyaya zilizotumiwa kuimarisha ganda la meli.
- source_word: ὑποζωννύντες τὸ πλοῖον
  choice: kuifunga meli kwa chini
  rationale: Usemi huu wa baharini unaeleza kupitisha nyaya kuzunguka chini ya ganda la meli ili kuliimarisha. Tafsiri hii inahifadhi picha ya tendo hilo kwa lugha inayoeleweka.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: kwamba huenda wangekwama kwenye Sirti
  rationale: Kitenzi kinaeleza hatari ya kupelekwa au kuangukia katika eneo hilo la mchanga na kukwama; ‘wangekwama’ huwasilisha hatari ya baharini kwa Kiswahili cha kawaida.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: walishusha vifaa vya meli
  rationale: σκεῦος ni neno pana linalomaanisha kifaa, vyombo, au vifaa. Kitu hasa kilichoshushwa hakijulikani kwa hakika, hivyo tafsiri kuu inadumisha upana wa Kigiriki.
- source_word: οὕτως ἐφέροντο
  choice: wakaendelea kusukumwa hivyo
  rationale: Kauli tendwa ya wakati usiotimilifu inaonyesha mwendo ulioendelea chini ya nguvu ya nje. ‘Kusukumwa’ ni ya kawaida na haiongezi wazi ‘upepo,’ ingawa muktadha unauelekeza.
