translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mfululizo wa matendo ya Kigiriki huku ikitumia miundo ya kawaida ya Kiswahili. Jina Σύρτις limetoholewa kuwa “Sirti,” na utata wa istilahi ya baharini σκεῦος umehifadhiwa katika matini kuu na kufafanuliwa katika tanbihi.
