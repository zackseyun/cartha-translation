base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: sw
  text: Kulipopambazuka, hawakuitambua nchi kavu, lakini waliona ghuba fulani yenye ufuo. Walikusudia, kama wangeweza, kuingiza meli katika ghuba hiyo na kuikwamisha ufuoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuielekeza meli ufuoni.” Kitenzi cha Kigiriki humaanisha kuisukuma au kuielekeza meli kwa nguvu hadi nchi kavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Kulipopambazuka
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kufika kwa mwanga wa mchana; δέ ni kiunganishi hafifu cha simulizi na hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: hawakuitambua nchi kavu
  rationale: ἐπιγινώσκω hapa ni kutambua, na γῆ ni nchi kavu; tafsiri hii haitaji kwa namna finyu zaidi kuwa ni pwani au eneo maalumu.
- source_word: κόλπον δέ τινα κατενόουν
  choice: lakini waliona ghuba fulani
  rationale: κόλπος katika muktadha wa baharini ni ghuba, τινα inadumisha kutokuwa mahususi, na κατενόουν huonyesha kuona au kutambua kwa makini.
- source_word: ἔχοντα αἰγιαλόν
  choice: yenye ufuo
  rationale: αἰγιαλός ni ufuo wa bahari. 'Ufuo' ni neno la kawaida na haliongezi dhana ya mchanga ambayo haijasemwa wazi katika Kigiriki.
- source_word: εἰς ὃν
  choice: kuingiza meli humo
  rationale: Neno 'humo' linarejelea ghuba na kuhifadhi mwelekeo unaoonyeshwa na εἰς.
- source_word: ἐβουλεύοντο εἰ δύναιντο
  choice: Wakapanga, kama wangeweza
  rationale: ἐβουλεύοντο huonyesha kupanga au kukusudia, huku εἰ pamoja na hali ya uwezekano ikihifadhi sharti lisilo na uhakika.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: kuipandisha ufuoni
  rationale: Katika muktadha huu wa baharini, ἐξωθέω humaanisha kuielekeza au kuisukuma meli hadi nchi kavu. Usemi huu wa Kiswahili unaeleza kitendo hicho kwa uwazi bila kudokeza kuwa walitaka tu kuitia nanga.
