  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: sw
  text: Lakini walipoingia mahali ambapo bahari mbili zilikutana[a], wakaikwamisha meli. Sehemu ya mbele ya meli ilikwama kabisa na kubaki bila kusogea, lakini sehemu yake ya nyuma ilikuwa ikivunjwavunjwa kwa nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘mahali kati ya bahari mbili.’ Usemi wa Kigiriki ni adimu na huenda unamaanisha mfereji, fungu la mchanga, au mahali ambapo sehemu mbili za maji au mikondo miwili hukutana.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: walipoingia
  rationale: Kitenzi hiki kinaonyesha meli kukumbana kwa ghafla na mahali hapo. ‘Walipoingia’ ni Kiswahili cha kawaida na hakibainishi zaidi ya maandishi kuhusu jinsi meli ilivyofika hapo.
- source_word: τόπον διθάλασσον
  choice: mahali ambapo bahari mbili zilikutana
  rationale: Neno διθάλασσος ni adimu na linahusiana na bahari au mikondo miwili ya maji. Tafsiri hii inahifadhi taswira ya Kigiriki bila kuamua kwamba mahali hapo palikuwa fungu la mchanga au mfereji.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: wakaikwamisha meli
  rationale: ἐπικέλλω ni istilahi ya safari za majini inayomaanisha kuifanya meli ikwame au ifike ufukweni. Chaguo hili ni wazi na la kawaida katika Kiswahili.
- source_word: πρῷρα
  choice: sehemu ya mbele ya meli
  rationale: Hii inaeleza sehemu ya mbele ya chombo kwa lugha inayoeleweka kwa wasomaji wengi kuliko istilahi maalumu ya ‘omo’.
- source_word: ἐρείσασα
  choice: ilikwama kabisa
  rationale: Kitenzi kinaonyesha sehemu ya mbele iliyojikita imara baada ya meli kukwama.
- source_word: ἔμεινεν ἀσάλευτος
  choice: kubaki bila kusogea
  rationale: Kirai hiki kinaonyesha kuwa sehemu hiyo iliendelea kuwa thabiti mahali pake na haikuweza kusogezwa.
- source_word: πρύμνα
  choice: sehemu yake ya nyuma
  rationale: Tafsiri elezi ya sehemu ya nyuma ya meli ni ya kawaida na inaeleweka kwa urahisi.
- source_word: ἐλύετο
  choice: ilikuwa ikivunjwavunjwa
  rationale: Kauli ya wakati usiotimilika na ya kutendwa inaonyesha mchakato uliokuwa ukiendelea wa sehemu ya nyuma kusambaratishwa.
- source_word: ὑπὸ τῆς βίας
  choice: kwa nguvu
  rationale: Maandishi yanasema tu ‘kwa nguvu’ bila kutaja wazi mawimbi au maji. Tafsiri hii inadumisha kutotajwa huko badala ya kuongeza kiwakilishi kisichotajwa.
