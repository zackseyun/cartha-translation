  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: sw
  text: Tukasafiri kando ya pwani yake kwa shida[a], tukafika mahali fulani palipoitwa Bandari Nzuri, na karibu napo palikuwa na mji ulioitwa Lasea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukasafiri kwa shida sana karibu na pwani yake.” Neno la Kigiriki παραλεγόμενοι ni istilahi ya safari ya baharini inayomaanisha kusafiri kando ya pwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: kwa shida
  rationale: Inaonyesha kwamba safari iliweza kuendelea kwa taabu kubwa; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: τε
  choice: Tuka-
  rationale: Kiambishi simulizi -ka- kinaunganisha tukio hili kwa kawaida na simulizi lililotangulia bila kulitia uzito usio wa lazima.
- source_word: παραλεγόμενοι
  choice: tukasafiri kando ya pwani
  rationale: Katika muktadha wa baharini, neno hili linaeleza kusafiri kwa chombo karibu na ukingo wa nchi; tafsiri hii ni sahihi na inaeleweka kwa wasomaji wa kawaida.
- source_word: αὐτὴν
  choice: yake
  rationale: Kiwakilishi kinarejelea Krete iliyotajwa katika muktadha uliotangulia; 'pwani yake' huweka rejeo wazi kwa Kiswahili cha kawaida.
- source_word: ἤλθομεν
  choice: tukafika
  rationale: Katika muktadha wa kufikia mahali kwa safari, 'tukafika' ni tafsiri ya asili ya kitenzi hiki cha mwendo.
- source_word: εἰς τόπον τινά
  choice: mahali fulani
  rationale: Huhifadhi hali ya kutotaja mahali hapo kwa uainisho maalumu, kama inavyoonyeshwa na τινά.
- source_word: καλούμενον
  choice: palipoitwa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutambulisha jina la mahali.
- source_word: Καλοὺς Λιμένας
  choice: Bandari Nzuri
  rationale: Jina la mahali limetafsiriwa kulingana na maana yake ya Kigiriki, kwa mtindo unaoeleweka na unaofaa katika Kiswahili.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: na karibu napo palikuwa na mji ulioitwa Lasea
  rationale: Huhifadhi uhusiano wa mahali, ukaribu, na hali ya πόλις kutokuwa na kibainishi, huku ukitoa sentensi ya asili katika Kiswahili.
