translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi umetumia mfuatano wa vitenzi wenye -ka-. Jina Lasea limehifadhiwa kama jina maalumu, huku Καλοὺς Λιμένας likitafsiriwa 'Bandari Nzuri' ili kuwasilisha maana ya jina la Kigiriki.
