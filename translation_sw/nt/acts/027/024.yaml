  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: sw
  text: akisema, “Usiogope, Paulo. Lazima usimame mbele ya Kaisari. Tazama, Mungu amekujalia watu wote wanaosafiri pamoja nawe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja na la kawaida katika Kiswahili, linalohifadhi hali ya sasa ya amri hiyo.
- source_word: δεῖ παραστῆναι
  choice: Lazima usimame mbele ya
  rationale: Huhifadhi wazo la ulazima wa kimungu na maana ya kufikishwa au kusimama mbele ya mtawala.
- source_word: Καίσαρί
  choice: Kaisari
  rationale: Cheo/jina hili limetumika kwa namna inayotambulika katika Kiswahili cha Biblia.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Huhifadhi kishirikishi cha kuvuta fikira bila kukiondoa au kukifanya maelezo marefu.
- source_word: κεχάρισταί σοι ὁ θεὸς
  choice: Mungu amekujalia
  rationale: Kitenzi cha Kigiriki kinaonyesha tendo la neema ambalo matokeo yake yanaendelea; ‘amekujali­a’ huwasilisha kwamba Mungu amewapa watu hao kwa fadhili kwa ajili ya Paulo.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: watu wote wanaosafiri pamoja nawe
  rationale: Huwakilisha watu wote waliokuwa wakisafiri baharini pamoja na Paulo kwa Kiswahili cha asili; muktadha tayari unaonyesha kuwa wako melini.
theological_decisions:
- issue: Maana ya Mungu ‘kuwajalia’ Paulo wasafiri wote
  choice: Mungu amekujalia watu wote wanaosafiri pamoja nawe
  alternative: Mungu ameyaokoa maisha ya wote wanaosafiri pamoja nawe
  rationale: Tafsiri inahifadhi usemi wa chanzo kuhusu tendo la neema bila kufafanua kupita kiasi namna au upeo wa kuokolewa kwao; muktadha wa aya zinazozunguka unaeleza matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa moja kwa moja wa hotuba umehifadhiwa, pamoja na ‘Tazama’ kama ishara ya msisitizo.
