  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: sw
  text: Kwa jumla, sisi sote tuliokuwa melini tulikuwa watu 276[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sisi sote tuliokuwa melini tulikuwa nafsi 276.” Hapa “nafsi” humaanisha “watu,” si hasa roho zisizo na mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: tuliokuwa
  rationale: Kitenzi hiki ni nafsi ya kwanza wingi, ‘tulikuwa.’ Muundo ‘sisi tuliokuwa’ unadumisha nafsi hiyo na kutoa jumla kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno maalumu)
  rationale: Hapa δέ ni kiunganishi hafifu cha simulizi. Mtiririko wa Kiswahili hauhitaji ‘basi’ au ‘lakini,’ ambayo ingeweza kuongeza mpito au utofautishaji usio kusudiwa.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: jumla yetu sisi ... watu
  rationale: ψυχαί hapa humaanisha watu walio melini, si hasa roho zisizo na mwili. ‘Jumla yetu sisi ... watu’ huwasilisha pia wazo la πᾶσαι, yaani wote kwa jumla.
- source_word: ἐν τῷ πλοίῳ
  choice: melini
  rationale: ‘Melini’ ni usemi wa kawaida na wa moja kwa moja kwa watu waliokuwa ndani ya chombo hicho.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: Namba imehifadhiwa kwa usahihi na kuandikwa kwa tarakimu ili isomeke kwa urahisi.
theological_decisions:
- issue: Maana ya ψυχαί
  choice: watu
  alternative: roho
  rationale: Katika muktadha wa kuhesabu waliokuwa melini, neno hili humaanisha watu au nafsi kwa maana ya watu, wala halitoi dai maalumu kuhusu sehemu ya mtu isiyo ya mwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unahifadhi nafsi ya kwanza wingi ya Kigiriki huku ukitoa hesabu kwa namna ya kawaida ya Kiswahili.
