  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: sw
  text: Na kutoka huko, baada ya kuanza safari ya baharini, tulisafiri upande wa Kipro uliohifadhiwa dhidi ya upepo,[a] kwa sababu pepo zilikuwa kinyume nasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tulisafiri kando ya upande wa Kipro wenye hifadhi.” Kitenzi cha Kigiriki ni istilahi ya baharini inayomaanisha kusafiri upande wa kisiwa uliohifadhiwa dhidi ya upepo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Kisha ... huko
  rationale: Inaendeleza simulizi kwa Kiswahili cha kawaida huku ikihifadhi wazo la kuondoka mahali hapo.
- source_word: ἀναχθέντες
  choice: tuliondoka ... kwa meli
  rationale: Katika matumizi ya baharini, kitenzi hiki humaanisha kuondoka na kuelekea baharini; tafsiri hii ni ya asili bila kuongeza wazo mahususi la kuinua nanga.
- source_word: ὑπεπλεύσαμεν
  choice: tukapita upande ... uliokingwa na upepo
  rationale: Kitenzi cha baharini kinaonyesha kusafiri upande wa kisiwa ulio na kinga dhidi ya upepo; maana hiyo imewekwa wazi kwa msomaji wa kawaida.
- source_word: τὴν Κύπρον
  choice: Kipro
  rationale: Hili ndilo jina la kawaida la kisiwa cha Cyprus katika Kiswahili sanifu.
- source_word: διὰ τὸ ... εἶναι
  choice: kwa sababu
  rationale: Muundo wa διά pamoja na kiambishi cha kutenda unaonyesha sababu, na 'kwa sababu' ni usemi wazi na wa kawaida.
- source_word: τοὺς ἀνέμους
  choice: pepo
  rationale: Wingi wa ἄνεμος umehifadhiwa; 'pepo' hufaa katika muktadha wa safari ya baharini.
- source_word: ἐναντίους
  choice: zilikuwa zinatupinga
  rationale: Inaonyesha pepo zilizokuwa kinyume cha mwelekeo wa safari. Kiambishi 'tu' kinaweka wazi mhusika aliyedokezwa na muktadha bila kubadili maana.
