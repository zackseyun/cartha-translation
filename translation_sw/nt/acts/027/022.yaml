  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: sw
  text: Na sasa nawasihi mjipe moyo[a], kwa maana hakuna yeyote kati yenu atakayepoteza uhai[b]; ni meli tu itakayopotea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muwe na moyo” au “msikate tamaa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “hakutakuwa na hasara yoyote ya uhai kati yenu.” Neno ψυχή hapa linamaanisha uhai wa kimwili, si hasa nafsi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: sasa
  rationale: Kirai hiki ni usemi wa wakati unaoanzisha himizo la Paulo la wakati huu; “sasa” ni kifupi na cha kawaida katika Kiswahili.
- source_word: παραινῶ
  choice: nawasihi
  rationale: Kitenzi hiki hutoa wazo la kushauri kwa msisitizo au kuhimiza; “nawasihi” kinaonyesha uzito wa ombi la Paulo bila kuwa cha kizamani.
- source_word: εὐθυμεῖν
  choice: mjipe moyo
  rationale: Katika mazingira ya dhoruba, usemi huu wa kawaida unaonyesha kuwa na moyo thabiti na kutokata tamaa.
- source_word: ἀποβολὴ
  choice: atapoteza
  rationale: Nomino ya Kigiriki ina maana ya hasara au kupotea; muundo wa kitenzi katika Kiswahili unatoa sentensi ya kawaida na iliyo wazi.
- source_word: ψυχῆς
  choice: uhai
  rationale: Hapa ψυχή inamaanisha uhai wa kimwili, si hasa nafsi kama sehemu isiyo ya mwili.
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: hakuna yeyote kati yenu atakayepoteza uhai
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba hakuna mtu katika kundi hilo atakayekufa, huku ukihifadhi mkazo wa ukanushaji.
- source_word: πλὴν τοῦ πλοίου
  choice: ni meli tu itakayopotea
  rationale: 'πλήν inaweka tofauti: watu wataokoka, lakini meli itapotea. Kiswahili hiki ni cha kawaida na huepuka usemi usio wazi kwamba uhai unapotea isipokuwa meli.'
theological_decisions:
- issue: Maana ya ψυχή
  choice: uhai
  alternative: nafsi
  rationale: Muktadha unahusu kunusurika kwa watu katika ajali ya meli; “uhai” huepuka kuingiza mgawanyo wa kitheolojia wa nafsi na mwili ambao haukusudiwi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mjipe moyo” ni usemi wa kawaida unaofaa kwa mazingira ya hatari; sentensi ya mwisho imepangwa upya kidogo ili tofauti kati ya kuokoka kwa watu na kupotea kwa meli iwe wazi bila kuongeza wazo jipya.
