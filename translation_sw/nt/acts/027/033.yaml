base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: sw
  text: Hadi kulipokaribia kupambazuka, Paulo aliendelea kuwasihi wote wale chakula, akisema, “Leo ni siku ya kumi na nne mmeendelea kungoja bila kula, wala hamjachukua chochote.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: Kulipokaribia kupambazuka
  rationale: Kauli hii ya wakati inaonyesha kuwa mapambazuko yalikuwa karibu. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi wazo la kuwadia kwa mchana.
- source_word: παρεκάλει
  choice: aliendelea kuwasihi
  rationale: Wakati usiotimilifu wa kitenzi unaonyesha tendo lililoendelea au lililorudiwa; “aliendelea kuwasihi” linaonyesha msisitizo huo.
- source_word: ἅπαντας
  choice: wote
  rationale: Neno hili linawahusu watu wote waliokuwa melini bila ubaguzi.
- source_word: μεταλαβεῖν τροφῆς
  choice: wale chakula
  rationale: Hii ni njia ya kawaida na iliyo wazi ya kusema wapate chakula au lishe, bila kutumia lugha nzito isiyo ya lazima.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Leo ni siku ya kumi na nne
  rationale: Inahifadhi msisitizo wa Kigiriki kwamba siku hiyo ya sasa ndiyo ya kumi na nne.
- source_word: προσδοκῶντες
  choice: kungoja
  rationale: Kimsingi kitenzi hiki kina maana ya kutazamia au kungoja. Tafsiri kuu inaacha wazi hali ya hisia, huku tanbihi ikionyesha maana ya wasiwasi inayowezekana katika muktadha wa dhoruba.
- source_word: ἄσιτοι διατελεῖτε
  choice: mmeendelea ... bila kula
  rationale: Inaonyesha hali iliyoendelea hadi wakati Paulo aliposema. “Bila kula” huepuka wazo lisilokusudiwa la mfungo wa kidini.
- source_word: μηθὲν προσλαβόμενοι
  choice: bila kupokea chakula chochote
  rationale: Kirai hiki kinasisitiza kwamba hawakuwa wamejipatia au kula chakula; neno “chakula” limetajwa ili maana iwe wazi katika Kiswahili.
