  text: εὔθυμοι δὲ γενόμενοι πάντες καὶ αὐτοὶ προσελάβοντο τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/036.yaml
  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: sw
  text: Ndipo wote wakapata moyo, nao pia wakala chakula[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawa wachangamfu” au “wakawa na moyo mzuri.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nao wenyewe pia walichukua chakula,” ikisisitiza kwamba wengine walifuata mfano wa Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: wakapata moyo
  rationale: Katika muktadha huu, neno linaonyesha kutoka katika hofu na kuingia katika hali ya moyo ulioimarika. ‘Wakapata moyo’ ni Kiswahili cha kawaida na chenye hadhi; hakidokezi uchangamfu mwepesi kupita kiasi.
- source_word: δὲ
  choice: Ndipo
  rationale: Hapa δέ inaendeleza simulizi baada ya mfano na himizo la Paulo, wala haionyeshi tofauti kali.
- source_word: γενόμενοι
  choice: wakapata
  rationale: Kirai ‘wakapata moyo’ kinaonyesha kuingia katika hali mpya, kama γενόμενοι pamoja na εὔθυμοι.
- source_word: πάντες
  choice: wote
  rationale: Linawahusisha watu wote waliokuwa melini kwa ufupi na kwa kawaida.
- source_word: καὶ αὐτοὶ
  choice: nao pia
  rationale: Huhifadhi msisitizo kwamba wao wenyewe walifuata mfano wa Paulo.
- source_word: προσελάβοντο
  choice: wakala
  rationale: Ikiwa na τροφῆς, kitenzi hiki humaanisha kula au kujipatia chakula. ‘Wakala chakula’ ni usemi wa asili zaidi katika Kiswahili kuliko tafsiri ya kimaneno ‘walichukua chakula.’
- source_word: τροφῆς
  choice: chakula
  rationale: Ni neno la kawaida na sahihi kwa kile kinacholiwa katika muktadha huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakapata moyo’ huwasilisha mabadiliko ya hali ya ndani kwa lugha inayoeleweka kwa urahisi; ‘nao pia’ huhifadhi nguvu ya καὶ αὐτοὶ bila kufanya sentensi kuwa nzito.
