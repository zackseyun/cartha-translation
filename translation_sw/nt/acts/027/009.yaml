  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: sw
  text: Baada ya muda mrefu kupita, safari ya baharini ilikuwa tayari hatari[a], kwa sababu hata Mfungo ulikuwa tayari umepita[b]. Paulo alikuwa akiwashauri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usafiri wa baharini ulikuwa tayari wa hatari.”
    reason: lexical_alternative
  - marker: b
    text: Yaelekea ni Mfungo wa Siku ya Upatanisho wa Wayahudi. Mfungo huu wa kila mwaka ulionyesha kwamba msimu wa safari za baharini ulikuwa umefikia kipindi cha hatari.
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Kwa kuwa muda mrefu ulikuwa umepita
  rationale: Kirai hiki kinaonyesha kwamba muda mwingi wa kutosha ulikuwa umekwisha; tafsiri hii ni ya asili katika Kiswahili na inadumisha muundo wa kueleza wakati na sababu.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: safari ya baharini ilikuwa tayari hatari
  rationale: πλοῦς hapa ni safari kwa njia ya bahari, si chombo chenyewe; ἐπισφαλής inaonyesha safari kuwa yenye hatari wakati huo.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: kwa sababu hata Mfungo ulikuwa umekwisha kupita
  rationale: Muundo wa διά pamoja na infinitivu unaeleza sababu, na njeo timilifu inaonyesha kwamba Mfungo ulikuwa tayari umepita.
- source_word: τὴν νηστείαν
  choice: Mfungo
  rationale: Nomino yenye kibainishi inarejelea mfungo maalumu uliojulikana kwa wasomaji, yaelekea mfungo wa kila mwaka wa Siku ya Upatanisho; jina la jumla limehifadhiwa katika matini huku maelezo yakitolewa chini.
- source_word: παρῄνει
  choice: akawa akiwashauri
  rationale: Kitenzi kinaweza kumaanisha kushauri, kusihi, au kuhimiza. 'Akawa akiwashauri' kinatambulisha ushauri wa Paulo bila kuongeza nguvu ya onyo ambayo haijawekwa wazi na kitenzi chenyewe.
