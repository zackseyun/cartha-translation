lexical_decisions:
- source_word: συναρπασθέντος
  choice: ilipokumbwa
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kwamba meli ilishikwa ghafla na nguvu ya nje; “ilipokumbwa” ni lugha ya kawaida ya Kiswahili katika muktadha wa dhoruba bila kuongeza maelezo yasiyosemwa.
- source_word: πλοίου
  choice: meli
  rationale: “Meli” ndilo neno la kawaida na linaloeleweka kwa πλοῖον katika simulizi hili.
- source_word: μὴ δυναμένου
  choice: na kushindwa
  rationale: Muundo huu unaonyesha kutoweza; “na kushindwa” unaunganisha hali hiyo kwa Kiswahili cha asili.
- source_word: ἀντοφθαλμεῖν
  choice: kuukabili
  rationale: Katika muktadha wa safari ya majini, kitenzi hiki humaanisha kuelekeza meli dhidi ya upepo au kuustahimili; “kuukabili” huhifadhi taswira ya kuukabili upepo bila ufafanuzi wa ziada.
- source_word: ἀνέμῳ
  choice: upepo
  rationale: Neno la Kigiriki linamaanisha “upepo”; ukubwa wa dhoruba unaelezwa na muktadha, hivyo hakuna haja ya kulitafsiri “tufani” hapa.
- source_word: ἐπιδόντες
  choice: tukaiacha iende
  rationale: Katika matumizi ya baharini, neno hili linaonyesha kuacha kupambana na nguvu ya upepo na kuipa meli njia; tafsiri hii ni wazi kwa wasomaji wa sasa.
- source_word: ἐφερόμεθα
  choice: tukasukumwa na upepo
  rationale: Kauli ya kutendwa ya wakati usiotimilika inaonyesha mwendo unaoendelea chini ya nguvu ya nje. Kutaja “upepo” kwa uwazi kunafanya mtendaji aliyeeleweka katika muktadha awe wazi kwa Kiswahili.
- source_word: δέ
  choice: —
  rationale: Kiunganishi hiki cha kuendeleza simulizi hakihitaji neno tofauti mwanzoni mwa sentensi ya Kiswahili; mfuatano unaonyeshwa kwa muundo wa “ilipokumbwa … tuka-”.
