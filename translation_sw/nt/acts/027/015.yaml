translation:
  language: sw
  text: Meli ilipokumbwa na upepo na kushindwa kuukabili, tukaacha kuipinga[a], tukapelekwa na upepo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukakubali kuendeshwa na tukachukuliwa na upepo.”
