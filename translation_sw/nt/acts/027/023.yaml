  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: sw
  text: Kwa maana usiku huu huu malaika wa Mungu, ambaye mimi ni wake[a] na ambaye pia ninamwabudu[b], alisimama karibu nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri halisi: “ambaye mimi ni wake.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “ninayemtumikia”; kitenzi cha Kigiriki kinaweza kumaanisha kumtolea Mungu utumishi wa kidini au ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: alisimama karibu nami
  rationale: Inahifadhi maana ya msingi ya kuwapo au kusimama kando ya Paulo, bila kuitafsiri kwa upana zaidi kuwa ‘alinitokea.’
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu ya ujasiri wa Paulo katika muktadha unaotangulia.
- source_word: ταύτῃ τῇ νυκτί
  choice: usiku huu huu
  rationale: Urudiaji wa ‘huu’ unaleta msisitizo wa demonstrativi na kueleza kwamba tukio lilitokea usiku huo wenyewe.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Umilikishi huu unamhusisha malaika na Mungu na unaendelea kwa kawaida hadi vishazi viwili vya uhusiano.
- source_word: οὗ εἰμι
  choice: ambaye mimi ni wake
  rationale: Hii inafuata kwa karibu usemi halisi ‘ambaye mimi ni wake’ na kuhifadhi maana ya Paulo kuwa mali ya Mungu.
- source_word: ᾧ καὶ λατρεύω
  choice: na ambaye pia ninamwabudu
  rationale: λατρεύω hapa inaashiria huduma ya kidini inayotolewa kwa Mungu; ‘ninamwabudu’ ni ya kawaida na hudumisha nguvu yake ya kidini, huku ‘ninayemtumikia’ ikibaki mbadala halali.
- source_word: ἄγγελος
  choice: malaika
  rationale: Muktadha wa ujumbe na faraja kutoka kwa Mungu unaonyesha wazi kuwa huyu ni kiumbe wa mbinguni, si mjumbe wa kibinadamu.
theological_decisions:
- issue: Tafsiri ya οὗ εἰμι
  choice: ambaye mimi ni wake
  alternative: ambaye mimi ni mali yake
  rationale: Chaguo hili linahifadhi kwa ufupi umilikaji na uhusiano unaoelezwa na Kigiriki bila kuongeza dai maalumu la kimadhehebu.
- issue: Tafsiri ya λατρεύω
  choice: ninamwabudu
  alternative: ninayemtumikia
  rationale: Katika uhusiano na Mungu, kitenzi hiki mara nyingi humaanisha ibada au utumishi wa kidini. ‘Ninamwabudu’ huonyesha nguvu hiyo, na tanbihi huhifadhi uwezekano wa ‘ninayemtumikia.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umewekwa wa kawaida kwa Kiswahili huku uhusiano wa ‘malaika wa Mungu’ na vishazi vinavyomfafanua Mungu ukihifadhiwa. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
