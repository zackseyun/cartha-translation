  yaml_path: translation/nt/acts/027/018.yaml
  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: sw
  text: Tulipokuwa tukisukwasukwa vikali na dhoruba, siku iliyofuata wakaanza kutupa shehena baharini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “wakafanya utupaji.” Kigiriki kinatumia usemi wa mabaharia unaomaanisha kutupa shehena nje ya meli ili kuipunguzia uzito.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: vikali
  rationale: Kielezi hiki kinaonyesha nguvu na ukali wa dhoruba; “vikali” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi msisitizo huo.
- source_word: χειμαζομένων
  choice: tulikuwa tukisukwasukwa ... na dhoruba
  rationale: Muundo huu unahifadhi hali ya kutendwa na mwendelezo wa tendo, huku ukieleza kwa kawaida kuwa dhoruba ndiyo iliyokuwa ikiisukasuka meli na waliokuwa ndani.
- source_word: ἡμῶν
  choice: tulikuwa
  rationale: Kiwakilishi cha nafsi ya kwanza wingi katika muundo wa genitivi huru kimetafsiriwa kwa kishazi tegemezi cha Kiswahili.
- source_word: τῇ ἑξῆς
  choice: siku iliyofuata
  rationale: Hii ni tafsiri ya kawaida na wazi ya usemi wa wakati unaomaanisha siku iliyofuata.
- source_word: ἐκβολὴν
  choice: kutupa shehena baharini
  rationale: Nomino hii ni istilahi ya baharini inayorejelea kutupa vitu nje ya meli ili kuipunguzia uzito. “Shehena” imewekwa wazi kutokana na muktadha wa safari ya meli.
- source_word: ἐποιοῦντο
  choice: wakaanza kutupa
  rationale: Wakati usiotimilifu unaonyesha tendo lililoanza na kuendelea katika simulizi; “wakaanza” huwasilisha mwanzo wa hatua hiyo kwa Kiswahili cha kawaida.
