  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: sw
  text: Lakini mabaharia walipokuwa wakijaribu kutoroka kutoka melini, walishusha mashua ndogo baharini kwa kisingizio kwamba walikuwa karibu kwenda kuweka nanga kutoka sehemu ya mbele ya meli,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναυτῶν
  choice: mabaharia
  rationale: Neno la kawaida na linaloeleweka kwa wafanyakazi wenye ujuzi wa kuendesha meli.
- source_word: ζητούντων φυγεῖν
  choice: walipokuwa wakijaribu kutoroka
  rationale: Muundo huu unaonyesha jitihada au nia ya kuikimbia meli, si kutafuta kwa maana ya kawaida.
- source_word: ἐκ τοῦ πλοίου
  choice: kutoka melini
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kuondoka na kuiacha meli.
- source_word: χαλασάντων τὴν σκάφην
  choice: walishusha mashua ndogo
  rationale: σκάφη ni mashua ndogo ya meli; tafsiri hii ni wazi kuliko istilahi adimu ya majini na haiongezi dhana ya kisasa ya mashua ya uokoaji.
- source_word: εἰς τὴν θάλασσαν
  choice: baharini
  rationale: Tafsiri ya asili na fupi inayoonyesha kwamba mashua ilishushwa ndani ya maji ya bahari.
- source_word: προφάσει
  choice: kwa kisingizio
  rationale: Inaonyesha sababu ya uongo iliyotumiwa kuficha nia yao halisi ya kutoroka.
- source_word: ὡς
  choice: kwamba
  rationale: Baada ya ‘kwa kisingizio,’ ‘kwamba’ huanzisha kwa kawaida dai lao la kujifanya.
- source_word: ἐκ πρῴρης
  choice: kutoka sehemu ya mbele ya meli
  rationale: Hufikisha maana ya prora kwa lugha inayoeleweka na wasomaji wa kawaida bila kutegemea istilahi maalumu ya majini.
- source_word: ἀγκύρας
  choice: nanga
  rationale: Katika Kiswahili ‘nanga’ kwa kawaida hubaki katika umbo lilelile hata inapomaanisha zaidi ya moja; muktadha unaonyesha wingi.
- source_word: μελλόντων ἐκτείνειν
  choice: walikuwa karibu kwenda kuweka
  rationale: Huhifadhi wazo la tendo lililodaiwa kuwa karibu kutendeka, huku ‘kuweka nanga’ ikiwa usemi wa kawaida wa majini katika Kiswahili.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Sentensi imeachwa ikiishia kwa koma kwa sababu aya ya Kigiriki inaendelea kisintaksia katika aya inayofuata. Hakuna tanbihi iliyohitajika: ‘mashua ndogo’ hufafanua σκάφη moja kwa moja, na ‘sehemu ya mbele ya meli’ huepuka istilahi ya kiufundi isiyojulikana sana.'
