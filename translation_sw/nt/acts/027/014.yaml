  language: sw
  text: Lakini muda mfupi baadaye, upepo mkali wa kisulisuli ulioitwa Eurakilo[a][b] ukashuka kwa nguvu juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Euroklidoni” badala ya “Eurakilo.”
    reason: textual_variant
  - marker: b
