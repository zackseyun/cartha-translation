base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: sw
  text: Kwa siku nyingi tulisafiri polepole kwa meli, na kwa shida tukafika mkabala na Knido. Kwa kuwa upepo haukuturuhusu kuendelea,[a] tukasafiri chini ya kinga ya Krete, kando ya Salmone.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upepo haukuturuhusu kukaribia.” Maneno ya Kigiriki yanaweza kumaanisha kwamba upepo haukuruhusu meli kuendelea au kukaribia mahali ilikokusudia.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tukasafiri chini ya Krete,” yaani upande wa kisiwa uliokuwa umekingwa dhidi ya upepo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Kwa siku nyingi
  rationale: Kirai hiki kinaonyesha muda mrefu uliopita huku safari ikichelewa; “kwa siku nyingi” ni Kiswahili cha kawaida na cha wazi.
- source_word: βραδυπλοοῦντες
  choice: tulisafiri polepole kwa meli
  rationale: Kitenzi hiki kinamaanisha kusafiri kwa meli kwa mwendo wa polepole; tafsiri hii inadumisha picha ya safari baharini na kuitofautisha na μόλις.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: kwa shida tukafika mkabala na Knido
  rationale: μόλις huonyesha ugumu, na κατά katika muktadha huu wa baharini huonyesha mahali palipoelekeana na mji wa Knido.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Kwa kuwa upepo haukuturuhusu kuendelea
  rationale: Muundo huu unaeleza sababu ya kubadili njia; προσεάω hapa huonyesha kuwa upepo haukuruhusu kusonga au kukaribia kwa njia iliyokusudiwa.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: tukapita upande wa Krete uliokingwa na upepo
  rationale: Katika matumizi ya baharini, ὑποπλέω humaanisha kusafiri upande wa kisiwa unaopata kinga dhidi ya upepo; tafsiri hii ni wazi kwa msomaji wa kawaida kuliko istilahi maalumu ya mabaharia.
- source_word: κατὰ Σαλμώνην
  choice: karibu na Salmone
  rationale: κατά pamoja na alama ya pwani hapa huonyesha mahali ambapo meli ilipita karibu au mkabala na rasi hiyo.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Knido / Krete / Salmone
  rationale: Majina ya mahali yameandikwa kwa namna inayolingana na matamshi na matumizi ya Kiswahili.
