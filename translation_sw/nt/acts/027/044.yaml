  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: sw
  text: Na wale wengine, baadhi yao wakiwa juu ya mbao, na wengine wakiwa juu ya vitu fulani vilivyotoka katika meli. Na hivyo wote wakafika nchi kavu salama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote waliokolewa na kufika nchi kavu” au “wote walinusurika na kufika ufukweni salama.” Kitenzi cha Kigiriki hapa kinamaanisha kuokolewa kimwili katika ajali ya meli.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: wale wengine
  rationale: Hurejelea watu waliobaki baada ya wale waliotajwa katika mstari uliotangulia; ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: baadhi yao ... na wengine
  rationale: Huonyesha mgawanyo wa kundi lililobaki katika makundi mawili kwa Kiswahili cha kawaida.
- source_word: ἐπὶ σανίσιν
  choice: wakishikilia mbao
  rationale: σανίς ni ubao au kipande cha ubao; katika hali ya ajali ya meli, 'wakishikilia' huwasilisha kwa kawaida namna mbao zilivyowasaidia, bila kudai kwamba walikuwa wamekaa juu yake.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: vipande vya meli
  rationale: Kifungu hiki kinamaanisha vitu fulani vilivyotoka melini; 'vipande vya meli' ni wazi na hakibainishi aina yake kupita ushahidi wa Kigiriki.
- source_word: οὕτως
  choice: hivyo ndivyo
  rationale: Hurejelea namna iliyoelezwa katika sehemu iliyotangulia na kuunganisha simulizi na matokeo yake.
- source_word: ἐγένετο πάντας διασωθῆναι
  choice: wote walivyofika ... salama
  rationale: Muundo huu unaeleza matokeo kwamba kila mtu alivuka hatari ya ajali ya meli na kufika salama; Kiswahili hiki ni cha asili na huhifadhi maana ya uokoaji wa kimwili.
- source_word: ἐπὶ τὴν γῆν
  choice: nchi kavu
  rationale: Katika muktadha wa baharini, γῆ ni nchi kavu kinyume cha bahari; usemi huu ni wazi katika Kiswahili.
theological_decisions:
- issue: Maana inayoweza kudhaniwa kuwa ya kiroho ya διασωθῆναι
  choice: walifika nchi kavu salama
  alternative: waliokolewa hadi nchi kavu / walinusurika na kufika ufukweni salama
  rationale: Muktadha ni ajali ya meli, kwa hiyo kitenzi kinaeleza kuokolewa kimwili kutoka hatarini, si wokovu wa kiroho. Tafsiri hii haiongezi dai la kidini lisilokusudiwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye staha. Sentensi inaendeleza moja kwa moja amri ya mstari uliotangulia; 'wakishikilia' hutumiwa kwa ufasaha wa Kiswahili katika muktadha wa kuelea kwa msaada wa mabaki ya meli.
