  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: sw
  text: Wala jua wala nyota hazikuonekana kwa siku nyingi, na dhoruba kali ilikuwa ikiendelea kutukandamiza. Kuanzia hapo, tumaini lote la kuokolewa kwetu lilikuwa likituondokea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: hazikuonekana
  rationale: Katika muktadha wa anga na urambazaji, kitenzi kinaonyesha kwamba jua na nyota hazikuonekana; tafsiri hii ni ya kawaida bila kusisitiza tu kung'aa kwake.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: kwa siku nyingi
  rationale: Kirai hiki kinaonyesha muda mrefu wa siku kadhaa na kinaeleweka kwa urahisi katika Kiswahili sanifu.
- source_word: χειμῶνός
  choice: dhoruba kali
  rationale: Katika muktadha huu wa baharini neno linamaanisha hali kali ya dhoruba, si majira ya baridi.
- source_word: οὐκ ὀλίγου
  choice: kali
  rationale: Litotes ya Kigiriki, kihalisi 'isiyo ndogo,' imewasilishwa kwa Kiswahili cha asili kama 'kali,' ikihifadhi msisitizo bila kuwa na muundo usio wa kawaida.
- source_word: ἐπικειμένου
  choice: iliendelea kutukandamiza
  rationale: Kitenzi kinaonyesha dhoruba iliyoendelea kuwaelemea kwa nguvu; 'kutukandamiza' huhifadhi uzito wa hali hiyo, na 'iliendelea' huonyesha tendo linalodumu.
- source_word: λοιπὸν
  choice: Hatimaye
  rationale: Hapa kielezi kinaonyesha hatua iliyofikiwa kutokana na hali hiyo; 'Hatimaye' ni ya asili na huunganisha matokeo na mateso yaliyotangulia.
- source_word: περιῃρεῖτο
  choice: likazidi kutoweka
  rationale: Kauli ya kutendwa katika wakati usiotimilika inaonyesha upotevu uliokuwa ukiendelea; 'likazidi kutoweka' huwasilisha mchakato huo kwa Kiswahili cha kawaida.
- source_word: ἐλπὶς πᾶσα
  choice: tumaini lote
  rationale: Huhifadhi kwa uwazi jumla ya kukata tamaa iliyomo katika kirai cha Kigiriki.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: la kwamba tungeokolewa
  rationale: Kirai hiki kinaeleza yaliyokuwa maudhui ya tumaini lao. 'Tungeokolewa' huhifadhi upana wa σῴζω, huku muktadha ukionyesha kuokolewa kimwili kutokana na kifo baharini.
theological_decisions:
- issue: Maana ya σῴζεσθαι katika simulizi la hatari baharini
  choice: kuokolewa kutokana na kifo baharini, kwa neno 'tungeokolewa'
  alternative: tungeponyoka
  rationale: Muktadha wa Matendo 27 ni dhoruba, kuvunjika kwa meli, na kuendelea kuwa hai, si wokovu wa kiroho. 'Kuokolewa' hudumisha uhusiano mpana wa kileksia wa σῴζω, na tanbihi hufafanua maana yake hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili kuwasilisha kwa uwazi mazingira na matokeo. Muundo 'dhoruba kali' unatafsiri litotes ya Kigiriki kwa njia ya asili; hali ya kuendelea katika ἐπικειμένου na περιῃρεῖτο imehifadhiwa kwa 'iliendelea' na 'likazidi.'
