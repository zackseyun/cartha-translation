  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: sw
  text: Lakini tulipopita upande wa kisiwa kidogo kiitwacho Kauda unaokinga dhidi ya upepo,[a] tuliweza kwa shida sana kuidhibiti mashua ya meli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tulipopita upande wa chini ya upepo wa kisiwa kidogo kiitwacho Kauda.” Kigiriki kinatumia lugha ya mabaharia kueleza kusafiri upande wa kisiwa unaotoa kinga dhidi ya upepo.
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: kisiwa kidogo
  rationale: Neno νησίον ni umbo la udogo na hapa linaeleza kisiwa kidogo; usemi huu ni wa kawaida na unaeleweka kwa urahisi katika Kiswahili.
- source_word: δέ
  choice: Lakini
  rationale: δέ inaonyesha mpito wenye tofauti ndogo katika simulizi, kutoka kusukumwa na dhoruba hadi kupata kinga ya muda.
- source_word: ὑποδραμόντες
  choice: baada ya kupita upande uliokingwa na upepo wa
  rationale: Katika lugha ya baharini, kitenzi hiki kinaonyesha kusafiri upande wa kisiwa unaotoa kinga dhidi ya upepo. Tafsiri hii inaweka wazi maana bila kutumia istilahi nzito ya baharini.
- source_word: καλούμενον Καῦδα
  choice: kiitwacho Kauda
  rationale: Hutambulisha kisiwa kwa jina lake kwa njia fupi na ya kawaida katika simulizi.
- source_word: ἰσχύσαμεν μόλις
  choice: tuliweza kwa shida sana
  rationale: Muundo huu unaonyesha kwamba walifanikiwa kwa taabu kubwa na karibu washindwe.
- source_word: περικρατεῖς γενέσθαι
  choice: kuishika salama
  rationale: Kirai hiki kinamaanisha kupata udhibiti au kushika kitu kwa uthabiti. Katika muktadha huu, kinaonyesha kufanikiwa kuikamata na kuidhibiti mashua iliyokuwa ikifuatana na meli.
- source_word: τῆς σκάφης
  choice: mashua ya meli
  rationale: σκάφη ni chombo kidogo kilichohusiana na meli, huenda kilikuwa kikivutwa nyuma yake. ‘Mashua ya meli’ ni wazi kuliko ‘mashua’ peke yake.
