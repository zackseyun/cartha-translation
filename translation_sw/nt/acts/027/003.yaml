  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: sw
  text: Siku iliyofuata tulifika Sidoni. Yulio akamtendea Paulo kwa wema[a], akamruhusu aende kwa rafiki zake ili apate huduma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtendea Paulo kwa ubinadamu,” ikisisitiza mwenendo wa fadhili wa Yulio kwa Paulo.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili apate uangalizi” au “ili apate msaada”; usemi wa Kigiriki unaweza kumaanisha kwa upana kupata msaada unaohitajika kutoka kwa marafiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: Kesho yake
  rationale: Katika mfululizo huu wa simulizi, usemi huu unamaanisha siku iliyofuata; “Kesho yake” ni Kiswahili cha kawaida na wazi.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: tulitia nanga katika bandari ya Sidoni
  rationale: Kitenzi kina maana ya kimabaharia ya kufikisha chombo ufukweni au kuingia bandarini. Tafsiri hii inaonyesha wazi mazingira ya safari ya baharini, ingawa kutia nanga hakutajwi moja kwa moja.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: akamtendea Paulo kwa wema
  rationale: Muundo huu unaeleza mwenendo wa fadhili au wa kibinadamu wa Yulio kwa Paulo; “kwa wema” ni wa asili na wenye hadhi katika Kiswahili.
- source_word: ἐπέτρεψεν
  choice: akamruhusu
  rationale: Hutoa maana ya kumpa mtu ruhusa kwa lugha ya kawaida na sahihi.
- source_word: πρὸς τοὺς φίλους
  choice: kwenda kwa rafiki zake
  rationale: Kifungu kinarejelea marafiki au watu waliokuwa na uhusiano na Paulo huko Sidoni; kiwakilishi “zake” ni cha kawaida katika Kiswahili.
- source_word: ἐπιμελείας τυχεῖν
  choice: ili apate kutunzwa
  rationale: Usemi wa Kigiriki una maana pana ya kupata utunzaji, uangalizi, au msaada unaohitajika. “Apate kutunzwa” ni wa asili na huhifadhi upana huo.
