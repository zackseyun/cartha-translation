  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: sw
  text: Ole wao! Kwa maana waliifuata njia ya Kaini, na kwa ajili ya ujira wakajitosa katika upotovu wa Balaamu[a], na wakaangamia katika uasi wa Kora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwa ajili ya ujira wakajimwaga katika upotovu wa Balaamu.”
    reason: Kitenzi ἐξεχύθησαν maana yake ya msingi ni ‘kumwagika’; katika muktadha huu kinaweza pia kuonyesha kujiachia au kukimbilia jambo bila kujizuia.
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: Ole wao!
  rationale: “Ole” huhifadhi nguvu ya tangazo la kinabii la hukumu, badala ya kulifanya kuwa kilio cha huzuni tu.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: waliifuata njia ya Kaini
  rationale: Neno ὁδός limetumiwa kwa maana ya mwenendo; “waliifuata njia” ni Kiswahili cha kawaida kinachohifadhi sitiari hiyo.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: katika upotovu wa Balaamu
  rationale: πλάνη linaweza kumaanisha kupotoka, kosa, au udanganyifu. “Upotovu” huhifadhi maana ya mwenendo potovu bila kuibana kuwa kosa la kiakili pekee.
- source_word: μισθοῦ
  choice: kwa ajili ya ujira
  rationale: μισθός ni malipo au ujira; hapa kifungu kinaonyesha msukumo wa kutafuta malipo.
- source_word: ἐξεχύθησαν
  choice: wakajimwaga
  rationale: Uchaguzi huu huhifadhi picha hai ya kitenzi, yaani ‘kumwagika,’ ingawa katika muktadha kinaashiria kujiachilia au kukimbilia jambo bila kujizuia.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: katika uasi wa Kora
  rationale: ἀντιλογία linaweza kuwa upinzani au ubishi; dokezo la Hesabu 16 linafanya “uasi” liwasilishe tukio linalokusudiwa kwa uwazi.
- source_word: ἀπώλοντο
  choice: wakaangamia
  rationale: Kitenzi hiki kinaonyesha kuangamia au kuharibiwa; “wakaangamia” ni cha kawaida, kizito, na hakibainishi kupita kiasi namna ya maangamizi.
theological_decisions:
- issue: Jinsi ya kutafsiri kifungu kigumu καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: na kwa ajili ya ujira wakajimwaga katika upotovu wa Balaamu
  alternative: na kwa ajili ya faida wakakimbilia kwa pupa upotovu wa Balaamu
  rationale: Matini ya Kiyunani imebanwa na ina sitiari isiyo ya kawaida. Matini kuu huhifadhi picha ya ‘kumwagika’ pamoja na kusudi la kupata ujira; tanbihi inatoa maana iliyo wazi zaidi bila kuufanya kuwa ndio ufafanuzi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sehemu tatu—Kaini, Balaamu, na Kora—umehifadhiwa, pamoja na mfululizo wa vitenzi vya wakati uliopita.
