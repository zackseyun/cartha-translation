source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: sw
  text: Hawa ni watu wanaonung'unika, wanaolalamikia hali yao, wanaoishi kufuata tamaa zao wenyewe; vinywa vyao hunena maneno ya majivuno, nao huwapendelea watu ili wapate faida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wakistaajabia nyuso kwa ajili ya faida”; hii ni nahau ya kuonyesha upendeleo kwa watu ili kujinufaisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσταί
  choice: watu wanaonung'unika
  rationale: Hueleza watu wenye tabia ya kutoa malalamiko kwa manung'uniko; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: μεμψίμοιροι
  choice: wasioridhika na hali yao
  rationale: Neno hili adimu humaanisha watu wanaolalamikia fungu au hali yao. Tafsiri hii hutofautisha maana yake na γογγυσταί bila kutumia neno lisilo la kawaida.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: wanaoishi kufuata tamaa zao wenyewe
  rationale: πορευόμενοι hapa hueleza mwenendo wa maisha, na ἐπιθυμίαι ni matamanio yenye nguvu ambayo muktadha unayaonyesha kuwa mabaya. 'Tamaa' huhifadhi upana huo bila kuifungia maana katika tamaa ya ngono pekee.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: vinywa vyao hunena maneno ya majivuno
  rationale: ὑπέρογκα hurejelea maneno yaliyotiwa chumvi, ya kujikweza au ya kiburi. Kiswahili hutumia wingi 'vinywa vyao' kwa kawaida zaidi inapowarejelea watu wengi, huku taswira ya kiungo cha kunena ikihifadhiwa.
- source_word: θαυμάζοντες πρόσωπα
  choice: huwapendelea watu
  rationale: Hii ni nahau inayomaanisha kuwaonyesha watu upendeleo, si kustaajabia nyuso zao kihalisi.
- source_word: ὠφελείας χάριν
  choice: ili wapate faida
  rationale: Kirai kinaonyesha kusudi la kujinufaisha. Tafsiri hii ni ya asili na huweka wazi nia yao ya kutafuta manufaa.
- source_word: οὗτοί εἰσιν
  choice: Hawa ni
  rationale: Huhifadhi utambulisho wa moja kwa moja na mkazo wa kiwakilishi cha Kigiriki.
theological_decisions:
- issue: Nguvu ya kimaadili ya ἐπιθυμίαι
  choice: tamaa zao wenyewe
  alternative: matamanio yao wenyewe; tamaa zao mbaya
  rationale: Neno lenyewe linaweza kutaja matamanio kwa upana, lakini muktadha wa Yuda unayatia katika nuru mbaya. 'Tamaa' hudokeza nguvu hasi bila kuongezea kivumishi kisichopo wala kuifanya maana kuwa ya kingono tu.
- issue: Maana ya kinahau ya θαυμάζοντες πρόσωπα
  choice: huwapendelea watu
  alternative: huwabembeleza watu; hustaajabia nyuso
  rationale: Nahau inashutumu upendeleo unaotolewa kwa ajili ya manufaa. Tafsiri ya maana ya nahau ni wazi zaidi kuliko tafsiri ya neno kwa neno, huku tanbihi ikihifadhi taswira halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo una mfululizo wa mashtaka kama katika Kigiriki; nusukoloni hutenganisha mwenendo wao na usemi wao kwa uwazi. 'Hunena' hudumisha hadhi ya lugha bila kuwa ya kizamani kupita kiasi.
