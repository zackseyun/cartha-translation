  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: sw
  text: ili atekeleze hukumu dhidi ya wote na kuwathibitisha kuwa na hatia watu wote wasiomcha Mungu kwa ajili ya matendo yao yote ya kutomcha Mungu waliyoyatenda kwa kutomcha Mungu, na kwa ajili ya maneno yote makali[a] ambayo watenda dhambi wasiomcha Mungu wamesema dhidi yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yote magumu.” Neno la Kigiriki linaweza kumaanisha maneno makali, ya ukaidi au ya dharau yaliyosemwa dhidi yake.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha, “yake” humrejelea Bwana aliyetajwa katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: ποιῆσαι κρίσιν κατὰ πάντων
  choice: ili awahukumu wote
  rationale: Kirai hiki kinaeleza kutekelezwa kwa hukumu dhidi ya wote. Kiswahili cha kawaida ‘awahukumu wote’ kinawasilisha tendo la kimahakama kwa uwazi bila muundo mzito wa ‘kutekeleza hukumu dhidi ya wote.’
- source_word: ἐλέγξαι
  choice: kuwathibitisha kuwa na hatia
  rationale: Katika muktadha wa hukumu, kitenzi hiki kinamaanisha kufichua kosa na kuthibitisha hatia, si kukemea tu.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: watu wote wasiomcha Mungu
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha kundi zima linalotajwa; pia unadumisha wazo la ἀσεβ- linalorudiwa katika mstari.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: kwa ajili ya matendo yao yote ya kutomcha Mungu
  rationale: ‘Kwa ajili ya’ hapa inaeleza msingi wa kuthibitishwa kwa hatia, na ‘matendo ... ya kutomcha Mungu’ huhifadhi uhusiano na nomino ἀσέβεια.
- source_word: ὧν ἠσέβησαν
  choice: waliyoyatenda kwa njia isiyomcha Mungu
  rationale: Tafsiri hii inahifadhi msisitizo wa kitenzi chenye mzizi mmoja na ἀσέβεια, ingawa urudiaji huo ni mzito kidogo kwa makusudi kama ulivyo katika Kigiriki.
- source_word: σκληρῶν
  choice: maneno yote makali
  rationale: Ingawa Kigiriki kinasema kwa kifupi ‘mambo makali,’ kitenzi ‘wamesema’ kinaonyesha kuwa yanayokusudiwa ni maneno makali, ya ukaidi au ya dharau.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: wamesema dhidi yake
  rationale: ‘Dhidi yake’ huhifadhi maana ya upinzani ya κατά pamoja na kiwakilishi cha Kigiriki bila kutaja wazi mhusika.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: watenda dhambi wasiomcha Mungu
  rationale: Tafsiri hii huhifadhi sifa zote mbili na msisitizo wa mwisho wa mstari kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Mhusika anayerejelewa na αὐτοῦ katika ‘wamesema dhidi yake’
  choice: Kuhifadhi kiwakilishi ‘yake’ katika maandishi makuu
  alternative: ‘dhidi ya Bwana’ au ‘dhidi ya Mungu’
  rationale: Muktadha wa mstari wa 14 unaelekeza kwa Bwana, lakini Kigiriki kinatumia kiwakilishi. Kukihifadhi huepuka kufafanua zaidi ya maandishi na kuacha muktadha uonyeshe mrejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘kutomcha Mungu/isiyomcha Mungu/wasiomcha Mungu’ umehifadhiwa kwa kiasi kikubwa ili kuonyesha msisitizo wa familia ya maneno ἀσεβ- katika Kigiriki. Alama zote za tanbihi zimetumika katika maandishi makuu.
