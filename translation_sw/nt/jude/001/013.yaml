  text: mawimbi makali ya bahari[a], yakitoa povu la aibu zao wenyewe; nyota zinazotangatanga[b], ambazo giza kuu limehifadhiwa kwa ajili yao milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yakitoa nje fedheha zao wenyewe” au “yakitoa povu la matendo yao ya aibu.” Neno la Kigiriki lililo katika wingi linaweza kumaanisha fedheha au matendo ya aibu yanayowafichua.
    reason: lexical_alternative
  - marker: b
    text: Au “weusi wa giza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: mawimbi makali ya bahari
  rationale: Huhifadhi taswira ya mawimbi ya bahari yaliyo makali na yasiyodhibitika kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐπαφρίζοντα
  choice: yakitoa povu
  rationale: Kitenzi hiki huonyesha mawimbi yakitoa povu; umbo la kuendelea la kirai linahifadhiwa.
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: la aibu zao wenyewe
  rationale: Neno αἰσχύνας linaweza kumaanisha fedheha au matendo ya aibu. Kiswahili kwa kawaida hutumia 'aibu' kama nomino isiyohesabika, huku 'zao wenyewe' kikihifadhi msisitizo wa ἑαυτῶν.
- source_word: ἀστέρες πλανῆται
  choice: nyota zinazotangatanga
  rationale: Huhifadhi sitiari ya nyota zinazohamahama bila kuingiza maana ya kisasa ya kiastronomia ya 'sayari'.
- source_word: οἷς
  choice: ambazo
  rationale: Kisarufi kinarejelea 'nyota,' ingawa kisitiari nyota hizo zinawakilisha watu; Kiswahili hutumia upatanisho wa ngeli ya nomino huku maana ya kibinafsi ikibaki katika muktadha.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: giza nene
  rationale: Kirai hiki cha asili kinatia nguvu wazo la giza zito. 'Giza nene' ni la asili katika Kiswahili na huhifadhi uzito wa picha hiyo.
- source_word: εἰς αἰῶνα
  choice: milele
  rationale: Katika muktadha huu wa hukumu, kirai kinaonyesha muda usio na mwisho; 'milele' ni sawa ya kawaida na ya moja kwa moja.
- source_word: τετήρηται
  choice: limewekewa
  rationale: Wakati timilifu wa kutendwa unaonyesha kwamba giza limehifadhiwa au kutengwa kwa ajili yao na linaendelea kuwa hivyo. 'Limewekewa' ni la asili katika muundo huu.
theological_decisions:
- issue: Muda na uzito wa taswira ya hukumu katika εἰς αἰῶνα
  choice: milele
  alternative: kwa wakati usio na mwisho; kwa enzi
  rationale: Katika muktadha wa hukumu, 'milele' ndiyo maana ya kawaida zaidi, bila kuongeza maelezo ya kimadhehebu.
- issue: Rejeo la οἷς baada ya sitiari ya nyota
  choice: ambazo
  alternative: ambao
  rationale: Upatanisho wa kisarufi unafuata 'nyota,' lakini muktadha unaonyesha kuwa sitiari hiyo inawahusu watu. Tafsiri haiondoi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na sitiari mbili za Kigiriki zimehifadhiwa; semikoloni inatenganisha picha hizo. Alama zote za tanbihi zimo katika matini kuu.
