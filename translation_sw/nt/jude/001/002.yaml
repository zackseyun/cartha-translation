id: JUD.1.2
reference: Jude 1:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: sw
  text: Rehema na amani na upendo na ziongezwe kwenu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ziongezeke” au “ziwe tele” badala ya “ziongezwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: rehema
  rationale: Neno “rehema” ni la kawaida na lenye heshima katika salamu na baraka za kibiblia; linahifadhi wazo la fadhili kwa mwenye uhitaji bila kulipunguza kuwa hisia ya huruma pekee.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Katika Kiswahili, “kwenu” huonyesha kwa kawaida na kwa ufupi waelekezewao baraka hii.
- source_word: εἰρήνη
  choice: amani
  rationale: “Amani” ni tafsiri ya moja kwa moja na iliyozoeleka, inayoweza kujumuisha kutokuwapo kwa uhasama pamoja na hali ya ustawi na upatanisho.
- source_word: ἀγάπη
  choice: upendo
  rationale: “Upendo” ni neno la sasa, la kawaida, na pana linalowakilisha ἀγάπη bila kuingiza ufafanuzi wa kimadhehebu.
- source_word: πληθυνθείη
  choice: viongezeke
  rationale: Kitenzi hiki cha kutakia mema kinaelezwa kwa kiima cha kutakia “na”; “viongezeke” ni Kiswahili cha asili kinachohifadhi maana ya kuongezeka, ingawa picha halisi ya kuzidishwa inaweza pia kutafsiriwa “vizidishwe.”
- source_word: καὶ ... καὶ ... καὶ
  choice: na ... na ... na
  rationale: Kurudia “na” kunahifadhi mfuatano wenye mkazo na mahadhi ya baraka katika Kigiriki.
theological_decisions:
- issue: Namna ya kutafsiri hali ya optative katika baraka
  choice: Rehema na amani na upendo na viongezeke kwenu.
  alternative: Rehema na amani na upendo na vizidishwe kwenu.
  rationale: “Na viongezeke” huwasilisha wazi ombi au takio la baraka katika Kiswahili cha sasa. Haitaji wazi mtendaji wa tendo, kama vile Kigiriki kisivyomtaji, hivyo haiingizi ufafanuzi wa ziada wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “na” umehifadhiwa kwa ajili ya mahadhi na mkazo wa chanzo.
