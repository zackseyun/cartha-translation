id: JUD.1.14
reference: Jude 1:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: sw
  text: Henoko pia, wa saba kutoka kwa Adamu, alitoa unabii kuhusu watu hawa[a], akisema, “Tazama,[c] Bwana alikuja pamoja na makumi elfu ya watakatifu wake[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhidi ya watu hawa” au “kwa watu hawa.” Umbo la Kigiriki linaweza kueleza wale ambao unabii unawahusu; katika muktadha ni waovu walioingia kwa siri.
    reason: lexical_alternative
  - marker: b
    text: Au “pamoja na maelfu kwa maelfu ya watakatifu wake.” Neno la Kigiriki linaweza kumaanisha makumi elfu au umati mkubwa usiohesabika wa watakatifu.
    reason: lexical_alternative
  - marker: c
    text: Nukuu hii inafanana na 1 Henoko 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: alitoa unabii
  rationale: Huwasilisha tendo la kusema unabii bila kulifupisha kuwa kutabiri matukio yajayo pekee.
- source_word: δὲ καὶ
  choice: pia
  rationale: Katika muktadha huu δέ ni kiunganishi hafifu, huku καί ikiongeza Henoko kama shahidi mwingine; “pia” ni ya kawaida na inatosha katika Kiswahili.
- source_word: τούτοις
  choice: kuhusu watu hawa
  rationale: Dativu inaweza kuonyesha wale wanaohusika katika unabii. “Kuhusu watu hawa” ni ya asili katika Kiswahili na inawaelekeza wasomaji kwa waovu wanaotajwa katika muktadha, huku tanbihi ikihifadhi uwezekano wa maana “dhidi ya watu hawa.”
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: wa saba kutoka kwa Adamu
  rationale: Huhifadhi kwa uwazi maelezo ya nasaba ya Kigiriki bila kuyapanua.
- source_word: Ἑνὼχ
  choice: Henoko
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: λέγων
  choice: akisema
  rationale: Hutambulisha nukuu kwa njia fupi na ya kawaida.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Huhifadhi msisitizo na uzito wa tamko la kinabii kwa Kiswahili cha sasa na chenye hadhi.
- source_word: ἦλθεν
  choice: alikuja
  rationale: Huwakilisha aoristi kama tendo la wakati uliopita na kuacha wazi uwezekano wa matumizi ya wakati uliopita wa kinabii, bila kuibadili kimafasiri kuwa wakati ujao.
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi cheo kilicho katika Kigiriki bila kubainisha zaidi anayerejelewa.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: pamoja na makumi elfu ya watakatifu wake
  rationale: “Pamoja na” huonyesha ushirika wa kundi linaloandamana naye; “makumi elfu” huwasilisha μυριάσιν kama jeshi kubwa sana, na “watakatifu” huepuka kuongeza neno “malaika,” ambalo halipo wazi katika Kigiriki.
theological_decisions:
- issue: Anayerejelewa na “Bwana” katika nukuu ya Henoko
  choice: Bwana
  alternative: Mungu, au Bwana Yesu
  rationale: Kigiriki kinasema κύριος tu. Tafsiri haibainishi kama Yuda anamrejelea Mungu katika muktadha wa mapokeo ya Henoko au anamwelekezea Yesu kimakristo.
- issue: Hadhi ya nukuu inayofanana na 1 Henoko 1:9
  choice: Kuitafsiri kama unabii unaonukuliwa bila kauli kuhusu ukanoni wake
  alternative: Kuitaja katika matini kuu kuwa nukuu ya moja kwa moja ya 1 Henoko
  rationale: Yuda anamwasilisha Henoko kama aliyetoa unabii; tafsiri inadumisha dai hilo bila kuingiza hukumu kuhusu hadhi ya kitabu cha 1 Henoko.
- issue: Wakati wa kitenzi ἦλθεν
  choice: alikuja
  alternative: atakuja
  rationale: Aoristi ya Kigiriki ni ya wakati uliopita, ingawa katika unabii inaweza kueleza tukio la baadaye kana kwamba tayari limetokea. “Alikuja” huhifadhi mvutano huo badala ya kuutatua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa wa asili kwa Kiswahili huku alama zote za tanbihi zikiwekwa kwenye matini kuu. “Watakatifu” imeachwa bila kubainishwa kuwa malaika ili kutoongeza jambo ambalo Kigiriki hakisemi wazi.
