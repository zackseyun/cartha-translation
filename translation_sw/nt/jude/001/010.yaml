  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: sw
  text: Lakini watu hawa huyatukana mambo wasiyoyaelewa[a]; na mambo wanayoyajua kwa silika, kama wanyama wasio na akili[b], ndiyo yanayowaangamiza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo wasiyoyajua.” Kitenzi “huyatukana” pia kinaweza kutafsiriwa “huyasema kwa dharau” au “huyakufuru.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mambo wanayoyajua kiasili, kama wanyama wasioweza kufikiri kwa busara.”
    reason: lexical_alternative
  - marker: c
    text: Au, “katika mambo hayo wanaharibika.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: watu hawa
  rationale: Kiashiria cha wingi kinawarejelea waingiliaji wanaoshutumiwa katika muktadha; ‘watu hawa’ ni Kiswahili cha kawaida na hakiongezi maana ya jinsia.
- source_word: βλασφημοῦσιν
  choice: huyatukana
  rationale: Kitenzi kinaweza kumaanisha kusema kwa dharau au matusi dhidi ya watu au mambo matakatifu. ‘Huyatukana’ kinahifadhi upana huo bila kukifunga kwenye kufuru dhidi ya Mungu pekee.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: mambo wasiyoyaelewa
  rationale: Katika ulinganisho na ufahamu wa kiasili, οἴδασιν hapa inaelekea kuonyesha kuelewa kuliko kuwa na taarifa tu.
- source_word: φυσικῶς
  choice: kwa silika
  rationale: Hueleza ufahamu wa kiasili usiotokana na kutafakari kwa akili, kama inavyothibitishwa na ulinganisho na wanyama.
- source_word: ἄλογα ζῷα
  choice: wanyama wasio na akili
  rationale: ἄλογα huonyesha kutokuwa na uwezo wa kufikiri kwa busara; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ἐπίστανται
  choice: wanayoyajua
  rationale: Kitenzi kinaonyesha ujuzi au utambuzi wao wa kiasili; ‘wanayoyajua’ huleta utofauti wa kitenzi bila kuondoa uhusiano wake na kifungu cha kwanza.
- source_word: ἐν τούτοις
  choice: ndiyo yanayowaangamiza
  rationale: Muundo wenye ἐν unaweza kueleweka kwa maana ya chombo au mazingira; Kiswahili hiki kinaonyesha kwamba mambo hayo hayo huwa njia ya maangamizi yao.
- source_word: φθείρονται
  choice: yanayowaangamiza
  rationale: Kitenzi kinaweza kuonyesha kuharibika kimaadili au kuangamia. Katika muktadha wa hukumu wa Yuda, ‘kuwaangamiza’ huhifadhi uzito wa matokeo huku tanbihi ikitaja maana nyingine.
theological_decisions:
- issue: Maana ya βλασφημέω wakati kitu kinacholengwa hakijatajwa wazi kuwa cha kimungu
  choice: huyatukana
  alternative: huyakufuru / huyasema kwa dharau
  rationale: Mstari unashutumu usemi wa matusi kuhusu mambo wasiyoyaelewa, bila kusema wazi kwamba ni Mungu anayekufuriwa. Tafsiri haipaswi kuingiza dai hilo jembamba.
- issue: Nguvu ya φθείρονται
  choice: ndiyo yanayowaangamiza
  alternative: ndani ya mambo hayo wanaharibika / mambo hayo yanawapotosha
  rationale: Neno linaunganisha uharibifu wa kimaadili na maangamizi. Chaguo kuu linaonyesha matokeo mazito katika muktadha wa hukumu, huku tanbihi ikihifadhi uwezekano wa ‘kuharibika’.
- issue: Uhusiano wa ἐν τούτοις na φθείρονται
  choice: 'maana ya chombo: mambo hayo ndiyo yanayowaangamiza'
  alternative: 'maana ya mazingira: katika mambo hayo wanaharibika'
  rationale: Sarufi inaruhusu maana zote mbili. Matini kuu inatumia Kiswahili cha asili chenye maana ya chombo, na tanbihi inahifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa kuwa wa kawaida kwa wasomaji huku ukihifadhi ulinganisho mkali wa Yuda, maana ya silika katika φυσικῶς, na utata wa ἐν τούτοις pamoja na φθείρονται.
