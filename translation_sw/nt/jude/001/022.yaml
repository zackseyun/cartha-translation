lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi rahisi kinachounganisha himizo hili na muktadha unaolitangulia.
- source_word: οὓς μὲν
  choice: wengine, wale
  rationale: Muundo huu unaanzisha kundi moja kati ya makundi yanayofuatana. ‘Wengine, wale’ ni Kiswahili cha kawaida kinachoonyesha kuwa kundi hili linatofautishwa na mengine bila kulazimisha tafsiri ya neno kwa neno ya μέν.
- source_word: ἐλεᾶτε
  choice: wahurumieni
  rationale: Kitenzi hiki ni agizo la kuonyesha rehema au huruma; ‘wahurumieni’ ni cha asili, wazi, na chenye uzito wa kimaadili katika Kiswahili.
- source_word: διακρινομένους
  choice: wanaotilia shaka
  rationale: Katika muktadha huu, umbo hili linaweza kueleza watu wenye mashaka au wanaositasita. ‘Wanaotilia shaka’ linaonyesha hali ya kutokuwa na uhakika bila kufuta uwezekano mwingine wa maana, ambao umewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya διακρινομένους katika mwito wa kuwashughulikia kwa rehema watu walio hatarini kiimani
  choice: wale wanaotilia shaka
  alternative: wale wanaositasita; huenda pia wale wanaobishana
  rationale: Maana ya kuwa na mashaka inafaa katika muktadha wa kuwahurumia watu wasio na uhakika, lakini neno la Kigiriki linaweza pia kumaanisha kusitasita au kubishana. Tanbihi inalinda utata huo wa kweli bila kuamua suala hilo kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ‘wengine, wale...’ unadumisha kwa njia ya kawaida mgawanyo wa makundi unaoanzishwa na οὓς μὲν, huku agizo likiwekwa mwishoni kwa mtiririko mzuri wa Kiswahili.
