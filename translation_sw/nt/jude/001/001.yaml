id: JUD.1.1
reference: Jude 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: sw
  text: 'Yuda, mtumwa wa Yesu Masihi na ndugu yake Yakobo, kwa wale walioitwa, wapendwa[b] katika Mungu Baba na waliohifadhiwa kwa ajili ya Yesu Masihi[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliohifadhiwa na Yesu Masihi.” Hali ya utoaji katika Kigiriki inaweza kueleweka kuwa inaonyesha mtendaji (“na”) au lengo/manufaa (“kwa ajili ya”).
    reason: alternative_reading
  - marker: b
    text: Baadhi ya hati zinasema “waliotakaswa katika Mungu Baba” badala ya “wapendwa katika Mungu Baba.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia; tofauti ya Kiingereza kati ya “Jude” na “Judas” haipo katika Kigiriki.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili linaonyesha mtu aliye chini ya mamlaka na katika utumishi unaomfunga; “mtumwa” linahifadhi uzito huo kuliko “mtumishi” pekee.
- source_word: Χριστοῦ / Χριστῷ
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mpakwa Mafuta; “Masihi” huhifadhi maana yake kama cheo badala ya kulifanya jina tu.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: na ndugu yake Yakobo
  rationale: δέ ni kiunganishi hafifu hapa, kwa hiyo “na” ni ya asili. “Ndugu yake Yakobo” ni Kiswahili cha kawaida cha kutaja uhusiano huo bila kudokeza mpangilio wa kuzaliwa.
- source_word: ἐν θεῷ πατρὶ
  choice: katika Mungu Baba
  rationale: “Katika” huhifadhi maana ya msingi ya ἐν kama hali au nyanja ya uhusiano, bila kuibadili kimyakimya kuwa “na” au “kwa ajili ya.”
- source_word: ἠγαπημένοις
  choice: wapendwa
  rationale: Kauli tendwa timilifu inaonyesha watu walio katika hali thabiti ya kupendwa. “Wapendwa” ni fupi, ya asili, na yenye hadhi katika salamu hii.
- source_word: τετηρημένοις
  choice: waliohifadhiwa kwa ajili ya
  rationale: Kauli tendwa timilifu inaonyesha hali inayoendelea kutokana na kuhifadhiwa. “Kwa ajili ya” huwasilisha uwezekano wa Yesu Masihi kuwa lengo au mnufaika wa kuhifadhiwa huku; uwezekano wa yeye kuwa mtendaji umewekwa katika tanbihi.
- source_word: κλητοῖς
  choice: walioitwa
  rationale: Kivumishi hiki kinatumika kama nomino kwa waandikiwa. Kukitanguliza katika muundo wa Kiswahili kunafanya utambulisho wa waandikiwa uwe wazi huku kukihifadhi pamoja na maelezo mengine yanayowahusu.
- source_word: Ἰάκωβος
  choice: Yakobo
  rationale: “Yakobo” ndilo umbo la kawaida la Kiswahili la jina la Kigiriki Ἰάκωβος na linaonyesha uhusiano wake na jina la Kiebrania.
theological_decisions:
- issue: Uhusiano wa τετηρημένοις na Ἰησοῦ Χριστῷ
  choice: waliohifadhiwa kwa ajili ya Yesu Masihi
  alternative: waliohifadhiwa na Yesu Masihi
  rationale: Hali ya utoaji ya Ἰησοῦ Χριστῷ inaweza kuonyesha lengo/manufaa (“kwa ajili ya”) au mtendaji (“na”). Maandishi makuu yanatumia maana inayowezekana ya lengo, huku tanbihi ikihifadhi uwezekano wa utendaji bila kutatua utata wa Kigiriki kidogma.
- issue: Tofauti ya maandishi katika ἠγαπημένοις
  choice: wapendwa
  alternative: waliotakaswa
  rationale: SBLGNT ina ἠγαπημένοις, kwa hiyo “wapendwa” limewekwa katika maandishi makuu. Hati nyingine zina ἡγιασμένοις, na tofauti hiyo muhimu imehifadhiwa katika tanbihi.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa salamu umewekwa kwa namna ya asili: “walioitwa” linawatambulisha waandikiwa, kisha “wapendwa” na “waliohifadhiwa” yanaeleza hali yao. Istilahi “mtumwa” na “Masihi” zinahifadhi uzito wa maneno ya Kigiriki bila kuingiza msimamo wa kimadhehebu.'
