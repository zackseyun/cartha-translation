  source_fidelity: 'Maandishi yanawakilisha kwa uaminifu salamu ya Kigiriki: Yuda anajitambulisha kama mtumwa wa Yesu Masihi na ndugu wa Yakobo, kisha waandikiwa wanaelezwa kuwa walioitwa, wapendwa katika Mungu Baba, na waliohifadhiwa kwa ajili ya Yesu Masihi. Kutanguliza “walioitwa” ni urekebishaji halali wa mpangilio kwa Kiswahili na hakubadilishi maana wala hadhi ya κλητοῖς.'
