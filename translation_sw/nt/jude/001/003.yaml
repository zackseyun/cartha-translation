id: JUD.1.3
reference: Jude 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: sw
  text: Wapendwa, ingawa nilikuwa nikifanya kila jitihada kuwaandikia kuhusu wokovu ambao sisi sote tunashiriki, niliona ni lazima niwaandikie, nikiwasihi muipiganie kwa bidii imani[b] iliyokabidhiwa[a] kwa watakatifu[c] mara moja tu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyopitishwa.” Hii inasisitiza jinsi mafundisho yalivyopokelewa na kukabidhiwa kwa wengine.
    reason: lexical_alternative
  - marker: b
    text: Hapa “imani” yaelekea kumaanisha ujumbe au mafundisho ya Kikristo yaliyokabidhiwa waumini, wala si tendo la mtu binafsi la kuamini tu.
    reason: alternative_reading
  - marker: c
    text: “Watakatifu” hapa ni watu watakatifu wa Mungu, yaani waumini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Wapendwa
  rationale: Ni neno la moja kwa moja la kuwaita watu kwa upendo; linadumisha sauti ya kichungaji na uhusiano wake na wazo la kupenda.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: ingawa nilikuwa nikifanya kila jitihada
  rationale: Kauli hii inadumisha wazo la bidii kubwa, huku “ingawa” ikionyesha tofauti ya kimuktadha kati ya kusudi la awali la Yuda na ulazima uliojitokeza.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: kuhusu wokovu ambao sisi sote tunashiriki
  rationale: Hutoa maana ya κοινός kuwa kitu cha pamoja bila kudokeza kwamba wokovu wenyewe una asili nyingine; Kiswahili hiki ni cha kawaida kuliko “wokovu wetu wa pamoja.”
- source_word: ἀνάγκην ἔσχον
  choice: niliona ni lazima
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha ulazima uliotokana na hali, bila kuongeza nguvu ya kulazimishwa kabisa.
- source_word: παρακαλῶν
  choice: nikiwasihi
  rationale: “Kusihi” linaonyesha ombi lenye uzito na himizo la dhati katika muktadha huu.
- source_word: ἐπαγωνίζεσθαι
  choice: muipiganie kwa bidii
  rationale: Kitenzi hiki chenye msisitizo kinaonyesha kujitahidi sana kwa ajili ya jambo; “kuipigania kwa bidii” ni wazi na hakihitaji lugha kali zaidi ya mapambano ya kimwili.
- source_word: τῇ ... πίστει
  choice: imani
  rationale: Katika muktadha wa kitu kilichokabidhiwa kwa watu wa Mungu, neno hili linaelekea kumaanisha ujumbe au mafundisho ya imani ya Kikristo, huku neno la kawaida “imani” likidumisha upeo wa neno la Kigiriki.
- source_word: ἅπαξ
  choice: mara moja kwa wakati wote
  rationale: Huhifadhi maana ya tendo la mara moja lenye uhalali wa kudumu, na huepuka kueleweka kama “mara moja” kwa maana ya “papo hapo.”
- source_word: παραδοθείσῃ
  choice: iliyokabidhiwa
  rationale: “Kukabidhi” hufaa kwa kitu kinachowekwa mikononi mwa jumuiya ili kipokelewe na kutunzwa; pia kinaweza kujumuisha wazo la kupitishwa kwa wengine.
- source_word: τοῖς ἁγίοις
  choice: kwa watakatifu
  rationale: Linadumisha usemi wa chanzo unaowataja waumini kama watu waliowekwa wakfu kwa Mungu; tanbihi inazuia dhana ya kwamba ni kundi maalumu lililotangazwa baadaye kuwa watakatifu.
theological_decisions:
- issue: Maana ya πίστις, “imani”
  choice: Ujumbe au mafundisho ya imani ya Kikristo yaliyokabidhiwa jumuiya
  alternative: Tendo binafsi la kumwamini Mungu
  rationale: Kauli kwamba imani “ilikabidhiwa kwa watakatifu” mara moja kwa wakati wote inaelekeza zaidi kwenye yaliyomo katika imani kuliko tendo la mtu binafsi la kuamini; tanbihi inaeleza mwelekeo huo bila kuingiza mfumo wa dhehebu.
- issue: Nguvu ya ἅπαξ παραδοθείσῃ
  choice: Kukabidhiwa kwa namna ya mwisho, mara moja kwa wakati wote
  alternative: Kukabidhiwa mara moja tu bila kusisitiza uhalali wa kudumu
  rationale: Katika muundo huu ἅπαξ lina nguvu ya tendo lisilorudiwa; tafsiri inadumisha msisitizo huo bila kueleza zaidi asili au mipaka ya mafundisho yaliyokabidhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya heshima, ya upendo na ya himizo. Sentensi inadumisha marudio ya “kuwaandikia ... niwaandikie” yaliyopo katika Kigiriki. Msamiati ni wa kawaida kwa wasomaji wa leo, huku istilahi muhimu za kibiblia “wokovu,” “imani,” na “watakatifu” zikihifadhiwa na kufafanuliwa inapohitajika.
