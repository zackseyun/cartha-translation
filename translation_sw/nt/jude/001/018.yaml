  text: kwamba walikuwa wakiwaambia, “Wakati wa mwisho kutakuwa na wadhihaki,[a] wanaoishi kwa kufuata tamaa zao wenyewe za kutomcha Mungu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wenye dhihaka.”
