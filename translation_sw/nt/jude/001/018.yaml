  - marker: b
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki: “wanaoenenda kulingana na tamaa zao wenyewe za kutomcha Mungu.”'
    reason: source_structure
lexical_decisions:
- source_word: ἔλεγον ὑμῖν
  choice: walikuwa wakiwaambia
  rationale: Kauli hii huhifadhi hali ya tendo lililoendelea au kurudiwa katika wakati uliopita, huku ikionyesha wazi kwamba maneno yalielekezwa kwa wasomaji.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: Wakati wa mwisho
  rationale: Huhifadhi nomino ya umoja χρόνος, ‘wakati,’ bila kuibadili kuwa msemo wa kawaida zaidi ‘siku za mwisho.’
- source_word: ἐμπαῖκται
  choice: watu wenye dhihaka
  rationale: Ni Kiswahili cha sasa kinachoeleweka na kinawasilisha watu wanaodhihaki; ‘wadhihaki’ limewekwa katika tanbihi kama neno fupi mbadala.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: kwa kufuata tamaa zao wenyewe
  rationale: Huwasilisha maana ya kuenenda kwa kupatana na matamanio yao wenyewe kwa Kiswahili cha kawaida.
- source_word: πορευόμενοι
  choice: wanaoishi kwa kufuata
  rationale: Kitenzi hiki kinaweza kueleza mwenendo wa maisha; tafsiri hii inaepuka usemi usio wa kawaida ‘kwenda kulingana na’ huku ikihifadhi wazo la mwenendo.
- source_word: τῶν ἀσεβειῶν
  choice: zisizomcha Mungu
  rationale: Hutoa sifa ya kidini na kimaadili ya tamaa hizo bila kuzipunguza kuwa tamaa za ngono pekee.
theological_decisions:
- issue: Msemo wa nyakati za mwisho
  choice: Wakati wa mwisho
  alternative: Katika siku za mwisho; Mwishoni mwa wakati
  rationale: Tafsiri inadumisha χρόνος ya umoja na haipatanishi kimakusudi na misemo mingine ya Biblia iliyo katika wingi.
- issue: Sifa ya kimaadili ya tamaa
  choice: tamaa zao wenyewe zisizomcha Mungu
  alternative: tamaa zao za uasi dhidi ya Mungu; tamaa zao za kutomcha Mungu
  rationale: Inahifadhi hukumu ya kimaadili na ya kidini katika ἀσέβεια, lakini haifanyi ἐπιθυμίαι kuwa tamaa za kingono tu.
- issue: Uhusiano wa τῶν ἀσεβειῶν
  choice: imehusishwa na ‘tamaa’
  alternative: wanaoishi katika matendo ya kutomcha Mungu kwa kufuata tamaa zao
  rationale: Muundo huu unafuata usomaji wa kawaida kwamba hali ya kutomcha Mungu inazisifu tamaa, ingawa umbo la Kigiriki ni gumu; tanbihi inaonyesha tafsiri iliyo ya karibu zaidi na muundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. ‘Watu wenye dhihaka’ ni cha kawaida zaidi kuliko nomino ‘wadhihaki’; ‘wanaoishi kwa kufuata’ huonyesha mwenendo wa maisha kwa ufasaha.
