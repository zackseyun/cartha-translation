  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: sw
  text: Hawa ndio wanaosababisha migawanyiko[a]; ni watu wanaoongozwa na tabia za kibinadamu[b], nao hawana Roho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaojitenga” au “wanaowagawa watu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “watu wasio wa kiroho” au “watu wa asili.”
    reason: lexical_alternative
  - marker: c
    text: Au, “roho”; lakini katika muktadha inaelekea zaidi kumaanisha Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: Hawa
  rationale: Kiwakilishi hiki kinawarejelea kwa ufupi na kwa kawaida watu waliotajwa katika muktadha uliotangulia.
- source_word: οἱ ἀποδιορίζοντες
  choice: wanaosababisha migawanyiko
  rationale: Kirai hiki kinaeleza shughuli yao ya kuvuruga umoja. Tafsiri hii inafaa zaidi katika muktadha, huku maana mbadala ya kujitenga au kuwagawa watu ikihifadhiwa katika tanbihi.
- source_word: ψυχικοί
  choice: watu wanaoongozwa na tabia za kibinadamu
  rationale: Neno hili linatofautisha maisha yanayotawaliwa na hali au misukumo ya kawaida ya kibinadamu na maisha yanayoongozwa na Roho. Kirai hiki ni cha kawaida na kinachoeleweka katika Kiswahili bila kudokeza kwamba mwili wenyewe ni mwovu.
- source_word: πνεῦμα
  choice: Roho
  rationale: Muktadha na utofautishaji wake na ψυχικοί unaelekeza zaidi kwa Roho Mtakatifu. Herufi kubwa inaonyesha uamuzi huo, huku uwezekano wa 'roho' ukihifadhiwa katika tanbihi.
- source_word: μὴ ἔχοντες
  choice: nao hawana
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishiriki kilichokanushwa, ikikiunganisha wazi na maelezo yaliyotangulia.
theological_decisions:
- issue: Kirejelewa cha πνεῦμα
  choice: Roho Mtakatifu
  alternative: roho, labda roho ya kibinadamu
  rationale: Utofautishaji wa karibu na ψυχικοί unaonyesha zaidi kwamba watu hawa hawana Roho Mtakatifu. Hata hivyo, kwa kuwa nomino yenyewe inaweza kumaanisha 'roho,' uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida; 'tabia za kibinadamu' huepuka usemi mgumu wa kitaalamu huku tanbihi zikihifadhi njia mbadala za kileksika na utata halisi wa πνεῦμα.
