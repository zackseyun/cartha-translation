id: JUD.1.12
reference: Jude 1:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: sw
  text: Hawa ni miamba iliyofichika katika karamu zenu za upendo[a]; wakishiriki karamu bila hofu, wakijilisha wenyewe[b]. Wao ni mawingu yasiyo na maji, yanayopeperushwa na upepo; miti ya majira ya kupukutika kwa majani isiyo na matunda, iliyokufa mara mbili[c], iliyong’olewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “madoa” au “mawaa” katika karamu zenu za upendo. Neno la Kigiriki linaweza kueleweka kwa maana ya kimaadili, lakini pia linaweza kumaanisha miamba hatari iliyofichika; maana hiyo inafaa mfululizo wa picha hai za Yuda.
    reason: alternative_reading
  - marker: b
    text: “Wakijilisha wenyewe” pia inaweza kutafsiriwa “wakijichunga wenyewe,” ikihifadhi taswira ya wachungaji wanaojitumikia. Linganisha Ezekieli 34.
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: “Iliyokufa mara mbili” inaweza kueleweka kuwa imekufa kabisa, lakini tafsiri kuu huhifadhi usemi wa Kigiriki ulivyo.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: σπιλάδες
  choice: miamba iliyofichika
  rationale: Neno hili linaweza kumaanisha miamba hatari iliyofichika baharini au, kwa maana ya kimaadili, madoa. Maana ya miamba iliyofichika inafaa mfululizo wa picha hai za Yuda na kuonyesha hatari iliyojificha katika ushirika.
- source_word: ἀγάπαις
  choice: karamu zenu za upendo
  rationale: Wingi wa neno ἀγάπη hapa unarejelea milo ya pamoja ya waumini iliyodhihirisha upendo; “karamu za upendo” huhifadhi jina la kihistoria na uhusiano wake na upendo.
- source_word: συνευωχούμενοι
  choice: wanapokula karamu pamoja nanyi
  rationale: Kitenzi kinaonyesha kushiriki karamu pamoja. “Pamoja nanyi” hufanya uhusiano na karamu za wasomaji uwe wazi katika Kiswahili bila kubadili maana.
- source_word: ἀφόβως
  choice: bila hofu
  rationale: Tafsiri hii ya moja kwa moja huhifadhi uwezekano wa maana ya kutokuwa na kiasi, aibu, au heshima bila kuchagua maana moja kwa lazima.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: wanajichunga wenyewe
  rationale: “Kuchunga” huhifadhi sitiari ya wachungaji wanaojitumikia badala ya kundi, huku pia ikiruhusu mwangwi wa Ezekieli 34.
- source_word: νεφέλαι ἄνυδροι
  choice: mawingu yasiyo na maji
  rationale: Usemi huu wa moja kwa moja huhifadhi picha ya mawingu yanayoahidi mvua lakini hayatoi maji.
- source_word: παραφερόμεναι
  choice: yanayopeperushwa
  rationale: Kitenzi tendwa kinaonyesha mawingu yanayobebwa na nguvu ya nje; “kupeperushwa” ni ya asili kwa mawingu katika Kiswahili.
- source_word: δένδρα φθινοπωρινὰ
  choice: miti ya majira ya kupukutika kwa majani
  rationale: Kwa kuwa Afrika Mashariki haina neno moja la kawaida na lenye kueleweka kwa wote kwa “autumn,” usemi huu unaeleza msimu kwa lugha ya asili bila kuondoa picha ya msimu.
- source_word: ἄκαρπα
  choice: isiyo na matunda
  rationale: Huhifadhi picha halisi ya miti badala ya kuibadili mapema kuwa maelezo ya kimaadili.
- source_word: δὶς ἀποθανόντα
  choice: iliyokufa mara mbili
  rationale: Huhifadhi usemi wa kushangaza na mkazo wa Kigiriki bila kuufafanua kuwa “imekufa kabisa.”
- source_word: ἐκριζωθέντα
  choice: kung’olewa kabisa
  rationale: “Kung’olewa” huonyesha kuondolewa pamoja na mizizi; “kabisa” hufanya ukamilifu wa tendo ueleweke kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya σπιλάδες kwa watu hawa katika karamu za upendo
  choice: miamba hatari iliyofichika katika ushirika wao
  alternative: madoa au mawaa katika karamu zenu za upendo
  rationale: Muktadha una mfululizo wa sitiari za maumbile, hivyo miamba iliyofichika inafaa vizuri; hata hivyo, uwezekano wa maana ya mawaa umehifadhiwa katika tanbihi.
- issue: Nguvu ya ποιμαίνοντες katika ἑαυτοὺς ποιμαίνοντες
  choice: kuhifadhi sitiari ya kujichunga wenyewe
  alternative: kujilisha wenyewe
  rationale: Maana ya kawaida ya kitenzi ni kuchunga. Chaguo hili huhifadhi lawama dhidi ya viongozi wanaojitumikia na mwangwi unaowezekana wa Ezekieli 34 bila kuifunga maana kwenye kula tu.
- issue: Maana ya “iliyokufa mara mbili”
  choice: kuhifadhi fumbo na mkazo wa usemi kama ulivyo
  alternative: iliyokufa kabisa
  rationale: Kigiriki kina usemi wa moja kwa moja “mara mbili imekufa.” Tafsiri haipaswi kuamua kimya-kimya ikiwa hii inamaanisha ukamilifu wa kifo au hatua mbili za kifo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili mfululizo wa sitiari usomeke kwa urahisi. “Karamu za upendo” huhifadhi istilahi ya kale ya Kikristo, na “majira ya kupukutika kwa majani” huepuka neno la kigeni lisiloeleweka kwa wasomaji wengi.
