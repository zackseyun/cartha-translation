  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: sw
  text: Hata hivyo, vivyo hivyo, watu hawa pia, wakitegemea ndoto[a], huutia mwili unajisi, hukataa mamlaka, na huwatukana wenye utukufu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “wakiota.” Kirai cha Kigiriki kinaweza kutafsiriwa hivyo kwa kufuata umbo lake kwa karibu zaidi, lakini huenda hapa kinadokeza kwamba wanazitumia ndoto kuwa msingi wa mwenendo wao.'
    reason: lexical_alternative
  - marker: b
    text: “Wenye utukufu” huenda ni viumbe wa mbinguni waliotukuzwa, labda malaika; kwa Kigiriki, “utukufu” katika wingi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: Hata hivyo, vivyo hivyo
  rationale: “Vivyo hivyo” huhifadhi ulinganisho na mifano iliyotangulia, huku “hata hivyo” ikihifadhi nguvu ya upinzani ya μέντοι.
- source_word: οὗτοι
  choice: watu hawa
  rationale: Huwatambulisha kwa kawaida wale waingiliaji wanaozungumziwa bila kuongeza umahususi wa kijinsia usio wazi katika neno la Kigiriki.
- source_word: ἐνυπνιαζόμενοι
  choice: wakitegemea ndoto
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba ndoto zinahusiana na msingi wa mwenendo wao; tafsiri rasmi zaidi imehifadhiwa katika tanbihi.
- source_word: σάρκα
  choice: mwili
  rationale: “Mwili” huhifadhi maana ya msingi ya σάρξ katika muktadha huu bila kuifanya moja kwa moja kuwa dhana ya kiufundi ya “asili ya dhambi.”
- source_word: μιαίνουσιν
  choice: huitia ... unajisi
  rationale: Nahau hii inaonyesha uchafuzi wa kimaadili au wa kiibada na inafaa sauti kali ya Yuda.
- source_word: κυριότητα
  choice: mamlaka
  rationale: Huhifadhi upana wa κυριότης, ambayo yaweza kumaanisha utawala au ubwana, bila kuamua ikiwa inahusu mamlaka ya Mungu, ya viumbe wa mbinguni, au mamlaka kwa ujumla.
- source_word: ἀθετοῦσιν
  choice: hukataa
  rationale: Ni neno wazi na lenye nguvu linaloonyesha kuikataa au kuipuuzilia mbali mamlaka inayopaswa kutambuliwa.
- source_word: δόξας
  choice: wenye utukufu
  rationale: Huhifadhi matumizi ya nomino ya wingi kwa viumbe au wahusika waliotukuzwa bila kuwataja moja kwa moja kuwa malaika.
- source_word: βλασφημοῦσιν
  choice: huwatukana
  rationale: Katika muktadha huu hueleza kusema kwa dharau au kwa matusi dhidi ya wahusika wenye utukufu, bila kudokeza kwamba kitendo hicho kinaelekezwa kwa Mungu pekee.
theological_decisions:
- issue: Warejelewa wa δόξας
  choice: usemi mpana “wenye utukufu” kwa wahusika au viumbe waliotukuzwa
  alternative: malaika; viumbe watukufu wa mbinguni; “utukufu” kama mambo ya adhama ya mbinguni
  rationale: Muktadha wa Yuda 1:9 unaelekeza kwa viumbe wa mbinguni, labda malaika, lakini nomino yenyewe haisemi hivyo wazi. Tafsiri kuu inadumisha upana huo na tanbihi inaeleza uwezekano.
- issue: Nguvu ya ἐνυπνιαζόμενοι
  choice: mwenendo wao unahusishwa na kutegemea ndoto
  alternative: wakiota; wao ni waotaji
  rationale: Kirai kishirikishi kinaweza kueleza namna au msingi wa matendo yao. “Wakitegemea ndoto” huwasilisha maana hiyo inayowezekana, huku tanbihi ikihifadhi tafsiri ya karibu zaidi na umbo la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unabaki na marudio matatu ya vitenzi ili kuhifadhi mkazo wa maandishi ya Kigiriki. “Huitia mwili unajisi” ni lugha ya kibiblia lakini bado inaeleweka kwa msomaji wa kawaida.
