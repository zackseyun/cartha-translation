id: JUD.1.7
reference: Jude 1:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: sw
  text: Kama vile Sodoma na Gomora, pamoja na miji iliyokuwa kandokando yake, zilivyofanya uasherati kwa namna ileile[a] na kwenda kufuata mwili mwingine[b], zimewekwa wazi kuwa mfano, zikipata adhabu ya moto wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani kinaweza kutafsiriwa kwa ukamilifu zaidi, “kwa namna ileile kama hawa.” Neno “hawa” huenda likawarejelea malaika waliotajwa katika mstari uliotangulia, au kwa ujumla zaidi mifano iliyotangulia ya uasi na hukumu.
    reason: alternative_reading
  - marker: b
    text: Au, “mwili tofauti”; kwa mapokeo, “mwili wa kigeni.” Maneno hayo yametafsiriwa kwa karibu bila kubanwa yawe na tafsiri moja mahususi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Kama vile
  rationale: Inaonyesha ulinganisho na mifano iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Sodoma na Gomora
  rationale: Majina haya yanafuata tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: miji iliyozizunguka
  rationale: Huhifadhi maana ya kijiografia ya miji iliyokuwa kandokando ya Sodoma na Gomora.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: kwa namna ileile
  rationale: Huhifadhi nguvu ya ulinganisho bila kulazimisha katika matini kuu rejeo mahususi la kiwakilishi τούτοις.
- source_word: ἐκπορνεύσασαι
  choice: ilifanya uasherati
  rationale: Kitenzi kinaonyesha kujihusisha na mwenendo mpotovu wa kingono; ‘kufanya uasherati’ ni wazi na kinaeleweka katika Kiswahili cha sasa.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: kufuata
  rationale: Huwasilisha nahau ya kwenda nyuma ya kitu kwa maana ya kukitafuta au kukifuatilia.
- source_word: σαρκὸς ἑτέρας
  choice: mwili mwingine
  rationale: Ni tafsiri ya karibu ya maneno ya Kigiriki inayohifadhi utata wa aina ya ‘mwili’ unaokusudiwa.
- source_word: πρόκεινται δεῖγμα
  choice: imewekwa wazi kuwa mfano
  rationale: Huwasilisha wazo la kuonyeshwa hadharani kama kielelezo au onyo.
- source_word: πυρὸς αἰωνίου
  choice: moto wa milele
  rationale: Huhifadhi moja kwa moja uzito wa usemi wa Kigiriki bila kuupanua kuwa kauli pana ya kimafundisho.
- source_word: δίκην ὑπέχουσαι
  choice: huku ikipata adhabu
  rationale: Hutoa maana ya kuwa chini ya adhabu au kuipata, huku ikihifadhi uhusiano wa kishiriki na tendo kuu.
theological_decisions:
- issue: Rejeo la τούτοις katika τὸν ὅμοιον τρόπον τούτοις
  choice: Matini kuu inasema ‘kwa namna ileile’ bila kutaja moja kwa moja ‘hawa.’
  alternative: ‘kwa namna ileile kama hawa,’ ambapo ‘hawa’ huenda wakawa malaika wa mstari wa 6 au mifano iliyotangulia kwa ujumla.
  rationale: Kigiriki kinaonyesha ulinganisho, lakini rejeo kamili la kiwakilishi lina utata halisi; tanbihi hulihifadhi bila kulitatua kimabavu.
- issue: Maana ya σαρκὸς ἑτέρας
  choice: mwili mwingine
  alternative: mwili tofauti; au tafsiri fafanuzi inayotaja aina mahususi ya kosa la kingono au kuvuka mpaka kati ya viumbe.
  rationale: Tafsiri ya karibu haibani maneno kuwa ufafanuzi mmoja wenye mjadala na hivyo huhifadhi mvutano wa kitheolojia wa matini.
- issue: Nguvu ya πυρὸς αἰωνίου
  choice: moto wa milele
  alternative: moto wa kudumu
  rationale: Usemi umetafsiriwa moja kwa moja bila kuupunguza wala kuupanua zaidi ya madai ya mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki karibu na mantiki ya Kigiriki, lakini umetengenezwa usomeke kwa kawaida. Upatanisho wa ngeli katika ‘ambayo … imewekwa … ikipata’ unaichukulia orodha yote kama kundi la miji, likiongozwa na nomino ‘miji.’
