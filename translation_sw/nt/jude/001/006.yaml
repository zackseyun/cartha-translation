id: JUD.1.6
reference: Jude 1:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: sw
  text: Nao malaika ambao hawakuishika nafasi yao wenyewe[a], bali waliacha makao yao wenyewe, Mungu amewaweka katika vifungo vya milele chini ya giza zito[b] kwa ajili ya hukumu ya siku ile kuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mamlaka yao wenyewe” au “eneo lao la utawala.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki humaanisha giza nene au hali ya huzuni yenye kutisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: malaika
  rationale: Katika muktadha huu wa hukumu, neno hili linamaanisha viumbe wa kiroho, si wajumbe wa kibinadamu.
- source_word: τηρήσαντας / τετήρηκεν
  choice: hawakuulinda / amewaweka
  rationale: Kwa tendo la malaika, ‘kulinda’ linaonyesha kutodumisha walichokabidhiwa. Katika tendo la Mungu, Kiswahili cha kawaida kinahitaji ‘amewaweka’; urudiaji kamili wa mzizi mmoja ungekuwa usio wa asili au ungepotosha maana.
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: mamlaka yao wenyewe
  rationale: ἀρχή hapa inaweza kumaanisha mamlaka, cheo, au eneo walilokabidhiwa. ‘Mamlaka’ ni ya asili kwa Kiswahili lakini ufafanuzi wa chini unaacha uwezekano wa ‘nafasi’ au ‘eneo la utawala.’
- source_word: ἀπολιπόντας
  choice: waliacha
  rationale: Neno linaonyesha kuondoka kwa hiari katika makao yao; ‘waliacha’ ni wazi na haliongezi kiwango cha nia zaidi ya maandiko.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: makao yao wenyewe
  rationale: οἰκητήριον ni mahali pa kukaa. ‘Makao yao wenyewe’ huwakilisha ἴδιον bila kuongeza kwa lazima wazo la ‘yaliyowafaa’ au ‘waliyopangiwa.’
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: kwa ajili ya hukumu ya siku ile kuu
  rationale: Huhifadhi mwelekeo wa kusudi au matokeo wa εἰς na muundo wa ‘hukumu ya siku kuu’ bila kuibadili kuwa ‘mpaka.’
- source_word: δεσμοῖς ἀϊδίοις
  choice: katika vifungo vya milele
  rationale: ‘Vifungo’ inaweza kumaanisha minyororo au hali ya kufungwa, na ‘vya milele’ huonyesha udumu wa ἀΐδιος.
- source_word: ὑπὸ ζόφον
  choice: chini ya giza zito
  rationale: ζόφος ni giza nene lenye hali ya kutisha, si ukosefu wa nuru tu. ‘Giza zito’ ni usemi wa kawaida na wenye nguvu katika Kiswahili.
- source_word: τε
  choice: Nao
  rationale: Huunganisha mfano huu wa hukumu na uliotangulia kwa mtiririko wa asili wa Kiswahili.
theological_decisions:
- issue: Maana ya kosa la malaika
  choice: Malaika hawakulinda mamlaka, nafasi, au eneo lao walilokuwa nalo, bali waliacha makao yao; maelezo zaidi hayaingizwe katika mstari.
  alternative: Kuufafanua moja kwa moja kuwa uasi wa malaika unaohusishwa na Mwanzo 6, au anguko la awali la malaika kwa jumla.
  rationale: Yuda huenda anarejelea mapokeo yaliyofahamika, lakini maneno ya Kigiriki hayaelezi kwa undani tukio hilo. Tafsiri inaacha mvutano huo wazi.
- issue: Nguvu ya ἀΐδιος
  choice: milele
  alternative: daima; visivyokwisha
  rationale: ‘Milele’ ni neno sanifu na linaloeleweka kwa udumu unaoonyeshwa hapa, bila kuongeza maelezo ya kimafundisho yasiyotajwa na mstari.
- issue: Mtendaji wa τετήρηκεν
  choice: Mungu ametajwa wazi kama kiima
  alternative: Kuacha kiima kama ‘amewaweka,’ kikirejelea kiima cha mstari uliotangulia.
  rationale: Kigiriki kina kiima kilichodokezwa kutoka muktadha. Kutaja ‘Mungu’ hufanya sentensi ya Kiswahili ijisimamie kwa uwazi bila kubadili mhusika wa kitendo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida, huku utata halisi wa ἀρχή ukihifadhiwa katika tanbihi. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
