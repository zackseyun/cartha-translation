  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: sw
  text: Lakini ninyi, wapendwa, mkijijenga juu ya imani yenu iliyo takatifu kabisa[a][c], huku mkiomba katika Roho Mtakatifu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkijijenga katika imani yenu iliyo takatifu kabisa.” Muundo wa Kigiriki unaweza kueleweka kuwa ni kujenga juu ya msingi au kujijenga katika uhusiano na imani hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa uwezo wa Roho Mtakatifu.” Kirai hiki kinaweza kusisitiza ama mazingira ambamo sala inafanywa (“katika”) au Roho kuwa ndiye anayewawezesha kuomba (“kwa uwezo wa”).
    reason: alternative_reading
  - marker: c
    text: Neno “imani” hapa linaweza pia kueleweka kuwa “kumtumaini Mungu” au “uaminifu,” ingawa katika Yuda yaelekea linamaanisha imani ya Kikristo inayoshirikiwa na jumuiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Lakini ninyi
  rationale: “Lakini” inaonyesha utofauti na watu wasiomcha Mungu waliotajwa kabla, na “ninyi” inahifadhi msisitizo wa kiwakilishi kilicho wazi katika Kigiriki.
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: Ni mwito wa upendo kwa waamini wenzake na una uzito unaofaa katika lugha ya kibiblia bila kuwa wa kizamani.
- source_word: ἐποικοδομοῦντες ἑαυτοὺς
  choice: mkijijenga
  rationale: Kitenzi kinadumisha sitiari ya kujenga na kiambishi cha kujirejelea “-ji-” kinawakilisha ἑαυτούς; wingi wa “mki-” unaonyesha kuwa jamii nzima inaelekezwa.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: juu ya imani yenu iliyo takatifu kabisa
  rationale: “Juu ya” huonyesha uwezekano wa kujenga juu ya msingi, huku tanbihi ikihifadhi uwezekano wa kuelewa hali hii kama kujengwa katika imani. “Takatifu kabisa” inahifadhi nguvu ya hali ya juu ya ἁγιωτάτῃ.
- source_word: πίστει
  choice: imani
  rationale: Katika muktadha wa Yuda, neno hili linaelekea kumaanisha imani ya Kikristo inayoshirikiwa na jumuiya, lakini tanbihi inahifadhi maana nyingine zinazowezekana.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: Tafsiri hii inahifadhi ἐν bila kuamua kimya kimya kama inamaanisha mazingira ya sala au utendaji unaowezeshwa na Roho.
- source_word: προσευχόμενοι
  choice: na kuomba
  rationale: Muundo huu wa Kiswahili unaunganisha tendo la kuomba na tendo la kujijenga, na koma ya mwisho inaonyesha kuwa sentensi inaendelea katika mstari unaofuata.
theological_decisions:
- issue: Rejeo la πνεύματι ἁγίῳ
  choice: Roho Mtakatifu wa Mungu
  alternative: roho au mwelekeo mtakatifu wa kibinadamu
  rationale: Matumizi ya Kikristo ya awali na muktadha wa mausia ya Yuda vinaunga mkono rejeo kwa Roho Mtakatifu; tafsiri haiongezi maelezo zaidi ya yaliyomo katika kifungu.
- issue: Maana ya πίστις katika “imani yenu iliyo takatifu kabisa”
  choice: imani ya Kikristo iliyopokelewa na kushirikiwa na waamini
  alternative: tendo lao la kumtumaini Mungu au uaminifu wao
  rationale: Matumizi ya “imani” katika Yuda yanaelekea kwenye imani iliyokabidhiwa jumuiya, lakini neno lenyewe na tanbihi vinaacha maana nyingine za kileksika zionekane.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wapendwa” linafaa kwa mwito wa kichungaji; “mkijijenga” ni la kawaida na linadumisha sitiari pamoja na maana ya kujirejelea. Mpangilio wa alama [a][c] unaweka tanbihi zote mbili moja kwa moja baada ya kirai cha imani, huku [b] ikiwekwa baada ya kirai cha Roho Mtakatifu.
