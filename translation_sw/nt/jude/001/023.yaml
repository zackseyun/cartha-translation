base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: sw
  text: Wengine waokoeni kwa kuwanyakua kutoka katika moto[a]; wengine wahurumieni kwa hofu[b], huku mkichukia hata vazi la ndani lililotiwa doa na mwili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wengine waokoeni, mkiwanyakua kutoka katika moto.” Huenda taswira hii inaelekeza kwenye hukumu inayokuja au hatari kubwa ya kiroho.
    reason: alternative_reading
  - marker: b
    text: “Kwa hofu” huenda ikamaanisha kwa kumcha Mungu, au kwa tahadhari ili mtu mwenyewe asichafuliwe pia.
    reason: lexical_alternative
  - marker: c
    text: 'Au, “vazi lililochafuliwa na mwili.” Kigiriki: “mwili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: waokoeni
  rationale: Kitenzi hiki kinawasilisha agizo la kuwaokoa watu; “waokoeni” huhifadhi uzito wa σῴζω na pia inafaa katika taswira ya uokoaji wa haraka.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: kwa kuwanyakua kutoka motoni
  rationale: Kirai hiki kinaeleza namna ya kuwaokoa. “Kuwanyakua” hudumisha wazo la tendo la nguvu na la haraka, huku “kutoka motoni” ikihifadhi taswira ya Kigiriki.
- source_word: ἐλεᾶτε
  choice: wahurumieni
  rationale: Ni agizo la kawaida na la moja kwa moja la kuwaonyesha wengine huruma.
- source_word: ἐν φόβῳ
  choice: kwa hofu
  rationale: Tafsiri hii fupi huhifadhi uwezekano wa kumaanisha kumcha Mungu au kuwa waangalifu ili wasichafuliwe pia.
- source_word: μισοῦντες
  choice: mkichukia
  rationale: Huhifadhi ukali wa kimaadili wa neno la Kigiriki na kuonyesha mtazamo unaoandamana na tendo la kuhurumia.
- source_word: χιτῶνα
  choice: vazi la ndani
  rationale: χιτών ni vazi lililovaliwa ndani; “vazi la ndani” ni wazi zaidi kwa msomaji wa sasa kuliko neno linaloweza kudokeza vazi la aina tofauti.
- source_word: ἐσπιλωμένον
  choice: lililotiwa doa
  rationale: Huhifadhi taswira halisi ya vazi lililopata doa na pia maana ya kuchafuliwa kimaadili.
- source_word: σάρξ
  choice: mwili
  rationale: “Mwili” huhifadhi sitiari ya chanzo na huepuka kuibadili moja kwa moja kuwa ufafanuzi wa kiteolojia kama “asili ya dhambi.”
theological_decisions:
- issue: Maana ya “moto” katika taswira ya uokoaji
  choice: Kuacha “moto” kama taswira bila kuufafanua katika matini kuu
  alternative: Hukumu ya mwisho au hatari ya kiroho inayoharibu sasa
  rationale: Matini haitaji wazi moto huo ni nini; tafsiri inahifadhi onyo na mvutano wa kitafsiri.
- issue: Maana ya σάρξ katika vazi lililotiwa doa
  choice: mwili
  alternative: asili ya dhambi
  rationale: Ingawa muktadha unahusu uchafu wa kimaadili, “mwili” hudumisha sitiari ya chanzo bila kuingiza ufafanuzi mpana zaidi katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa agizo ni wa moja kwa moja, na taswira kali za moto, kunyakua, doa na mwili zimehifadhiwa bila kuongezwa ufafanuzi wa kimadhehebu.
