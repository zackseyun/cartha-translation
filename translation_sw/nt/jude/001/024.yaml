base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: sw
  text: Kwake yeye awezaye kuwalinda ili msijikwae, na kuwasimamisha mbele ya utukufu wake bila lawama[a], kwa shangwe[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “bila dosari.” Neno la Kigiriki linaweza pia kuleta picha ya kitu kisicho na waa.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “kwa furaha kuu.”'
    reason: lexical_alternative
  - marker: c
    text: Kirai “kwa shangwe” kinaweza kuhusishwa na kuwasimamisha waamini mbele ya utukufu wa Mungu; Kigiriki hakitaji wazi ni nani anayeshangilia.
    reason: ambiguity
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: Yeye awezaye
  rationale: Muundo huu unaendeleza sifa ya Mungu hadi mstari wa 25. Kiswahili hiki ni cha asili na kinadumisha maana ya kishiriki cha Kigiriki.
- source_word: δὲ
  choice: haikutafsiriwa moja kwa moja
  rationale: Hapa δέ ni kiunganishi hafifu kinachoanzisha hitimisho la sifa; katika Kiswahili mpito huo unaeleweka bila kuongeza neno kama “basi” au “lakini”.
- source_word: φυλάξαι ὑμᾶς ἀπταίστους
  choice: kuwalinda msijikwae
  rationale: “Kuwalinda” huwasilisha maana ya kutunza au kuhifadhi, na “msijikwae” hudumisha taswira ya ἀπταίστους bila kuifafanua kuwa dhambi za kila siku au uasi wa mwisho.
- source_word: καὶ στῆσαι
  choice: na kuwasimamisha
  rationale: Kitenzi hiki kimsingi humaanisha kusababisha mtu asimame. Tafsiri hii ni ya moja kwa moja na inafaa kwa picha ya kusimama mbele ya utukufu wa Mungu.
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: mbele ya utukufu wake
  rationale: Hii inahifadhi nomino “utukufu” badala ya kuongeza wazo la “uwepo wenye utukufu,” ingawa kuwapo kwake kunaeleweka katika muktadha.
- source_word: ἀμώμους
  choice: bila lawama
  rationale: Usemi huu ni wa kawaida na wenye heshima, na unaweza kubeba maana ya kutokuwa na kosa pamoja na mwangwi wa kutokuwa na dosari.
- source_word: ἐν ἀγαλλιάσει
  choice: kwa shangwe
  rationale: “Shangwe” huonyesha furaha kuu na ya wazi inayomo katika ἀγαλλίασις bila kuongeza kivumishi kisichopo katika Kigiriki.
theological_decisions:
- issue: Iwapo τῆς δόξης αὐτοῦ itafsiriwe moja kwa moja au ifafanuliwe kuwa kuwapo kwa Mungu kwenye utukufu
  choice: mbele ya utukufu wake
  alternative: mbele ya uwepo wake wenye utukufu
  rationale: Kigiriki kinataja “utukufu wake” moja kwa moja. Tafsiri iliyochaguliwa huepuka upanuzi wa kifasiri na kudumisha uzito wa kitheolojia wa δόξα.
- issue: Iwapo ἀπταίστους ihusishwe hasa na kujikwaa kimaadili au kuanguka kabisa katika uasi
  choice: msijikwae
  alternative: msianguke
  rationale: “Msijikwae” hudumisha sitiari na kutatua kimakusudi kidogo zaidi, hivyo haiamui kama rejeo ni kushindwa katika mwenendo au kuanguka kwa mwisho.
- issue: Iwapo στῆσαι itafsiriwe kama kusimamisha au kuwasilisha
  choice: kuwasimamisha
  alternative: kuwaleta
  rationale: “Kuwasimamisha” huhifadhi maana ya msingi ya kitenzi na picha ya waamini kusimama mbele ya utukufu wa Mungu; “kuwaleta” ni laini zaidi lakini inapunguza taswira hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sifa ya Mungu lakini kinachoeleweka kwa msomaji wa kawaida. Uwingi wa nafsi ya pili umeonyeshwa katika “kuwalinda msijikwae” na “kuwasimamisha.” Alama za tanbihi zimewekwa mahali zinapohusika katika matini.
