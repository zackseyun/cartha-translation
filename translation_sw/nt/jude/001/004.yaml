id: JUD.1.4
reference: Jude 1:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: sw
  text: Kwa maana watu fulani wamejipenyeza bila kutambuliwa[a], watu wasiomcha Mungu ambao tangu zamani waliandikwa mapema kwa ajili ya hukumu hii[b]. Wanaigeuza neema ya Mungu wetu kuwa ufisadi usio na kiasi[c], nao wanamkana Mwenye mamlaka na Bwana wetu wa pekee, Yesu Masihi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wameingia kwa siri bila kutambuliwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ambao tangu zamani waliwekwa alama kwa ajili ya hukumu hii,” au “waliteuliwa mapema kwa hukumu hii.”
    reason: alternative_reading
  - marker: c
    text: Neno la Kigiriki linaweza pia kumaanisha uasherati, upotovu wa kingono, au mwenendo wa aibu usio na kiasi.
    reason: lexical_alternative
  - marker: d
    text: 'Kigiriki: “Yesu Kristo”; hapa Χριστός limetafsiriwa “Masihi” kwa kuwa ni cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: wameingia kwa siri bila kutambuliwa
  rationale: Kitenzi hiki huonyesha kuingia kwa kujipenyeza na bila kuonekana; tafsiri hii ni ya kawaida na inadumisha wazo la kuingia kisiri.
- source_word: πάλαι προγεγραμμένοι
  choice: tangu zamani waliandikwa mapema kuhusu
  rationale: Maana ya msingi ya προγράφω ni kuandika kabla; usemi huu pia unaweza kudokeza kutajwa au kuwekewa alama mapema. Tafsiri kuu inadumisha taswira ya kuandikwa bila kuamua suala la uteuzi tangu awali.
- source_word: κρίμα
  choice: hukumu
  rationale: Neno hili linaweza kumaanisha uamuzi wa kimahakama au adhabu inayotokana nao; 'hukumu' inadumisha upana huo.
- source_word: ἀσεβεῖς
  choice: watu wasiomcha Mungu
  rationale: Hueleza watu wasio na uchaji na heshima kwa Mungu; usemi huu unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: χάριτα
  choice: neema
  rationale: '''Neema'' ni istilahi ya kawaida na sahihi kwa fadhili za Mungu katika muktadha huu.'
- source_word: μετατιθέντες
  choice: wanaigeuza ... kuwa
  rationale: Huwasilisha tendo la kubadili kitu kiwe kingine bila kuongeza tafsiri kali zaidi kama 'kupotosha' katika maandishi makuu.
- source_word: ἀσέλγειαν
  choice: upotovu wa kingono
  rationale: Neno huonyesha mwenendo wa aibu usio na vizuizi, mara nyingi wa kingono; uchaguzi huu ni wazi kwa msomaji wa kawaida huku tanbihi ikihifadhi maana pana zaidi.
- source_word: μόνον δεσπότην καὶ κύριον
  choice: Bwana Mkuu wetu wa pekee na Bwana wetu
  rationale: Huwakilisha vyeo viwili tofauti, δεσπότης na κύριος. 'Bwana Mkuu' huonyesha mamlaka kamili ya kwanza bila kutumia 'Bwana' peke yake mara mbili.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesu Masihi
  rationale: Χριστός linachukuliwa kama cheo na kutafsiriwa 'Masihi,' badala ya kunukuliwa tu kama 'Kristo.'
- source_word: ἀρνούμενοι
  choice: wanamkana
  rationale: Hueleza kumkana au kutomkubali mtu katika imani na mwenendo; 'wanamkana' ni ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Maana ya προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: walikuwa wameandikwa mapema kuhusu hukumu hii
  alternative: walikuwa wameteuliwa mapema kwa ajili ya hukumu hii
  rationale: Kigiriki kinaweza kueleweka kuwa watu hawa walitajwa zamani katika Maandiko au waliwekewa alama mapema. Tafsiri haifanyi dai la wazi kuhusu kuamuliwa tangu awali kwa kila mtu, na tanbihi inadumisha uwezekano mwingine.
- issue: Mhusika wa vyeo μόνον δεσπότην καὶ κύριον
  choice: vyeo vyote viwili vinamhusu Yesu Masihi
  alternative: '''Bwana Mkuu'' humhusu Mungu Baba, na ''Bwana'' humhusu Yesu Masihi'
  rationale: Mpangilio wa kawaida wa sintaksia ya Kigiriki unaunganisha vyeo vyote viwili na jina Yesu Masihi, ingawa tafsiri nyingine imewahi kupendekezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kigiriki imegawanywa ili iwe wazi kwa wasomaji wa kawaida. 'Bwana Mkuu' imetumiwa kwa δεσπότης ili kuitofautisha na κύριος ('Bwana') huku mamlaka ya cheo cha kwanza ikidumishwa.
