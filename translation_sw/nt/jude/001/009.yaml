id: JUD.1.9
reference: Jude 1:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: sw
  text: Lakini Mikaeli, malaika mkuu, alipokuwa akibishana na Ibilisi na kujadiliana naye kuhusu mwili wa Musa, hakuthubutu kutoa hukumu ya kashfa dhidi yake[a], bali alisema, “Bwana akukemee.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo zaidi, “hakuthubutu kutoa shtaka la kashfa dhidi yake.”
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yana mwangwi wa Zekaria 3:2, ambapo Bwana anamkemea Shetani.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: malaika mkuu
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya cheo cha malaika mwenye cheo cha juu, bila kutumia neno la mkopo lisilo la lazima.
- source_word: διαβόλῳ
  choice: Ibilisi
  rationale: Katika muktadha huu neno hilo linamtaja adui wa kiroho kama nafsi maalumu; “Ibilisi” ni jina la kawaida katika Kiswahili sanifu.
- source_word: διακρινόμενος
  choice: alipokuwa akibishana
  rationale: Huwasilisha mgogoro unaoendelea na kudumisha maana ya kushindana au kutofautiana kwa hoja.
- source_word: διελέγετο
  choice: kujadiliana naye
  rationale: Huonyesha mazungumzo ya hoja yaliyokuwa yakiendelea; kirai hiki kinatofautishwa na “akibishana” bila kurudia neno lilelile.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: kuhusu mwili wa Musa
  rationale: Ni Kiswahili cha kawaida kinachohifadhi rejeo halisi la mwili na uhusiano wake na Musa.
- source_word: οὐκ ἐτόλμησεν
  choice: hakuthubutu
  rationale: Hutoa moja kwa moja maana ya kutodiriki au kutofanya jambo kwa ujasiri wa kujichukulia mamlaka.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: kutoa hukumu ya kumkashifu
  rationale: Huhifadhi wazo la hukumu pamoja na usemi wa kashfa au shutuma. Muundo wa Kigiriki unaweza kueleweka kwa njia zaidi ya moja, kwa hiyo tafsiri mbadala imewekwa katika tanbihi.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Bwana akukemee
  rationale: Kitenzi cha kutakia katika Kigiriki kinaonyeshwa kwa hali ya utegemezi ya Kiswahili, hivyo kauli hiyo ni ombi au mwito kwa Bwana amkemee.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika muktadha huu na inadumisha mwangwi wa Zekaria 3:2.
theological_decisions:
- issue: Kujizuia kwa Mikaeli alipomwambia Ibilisi
  choice: Mikaeli haitoi mwenyewe hukumu ya kumkashifu, bali anamwachia Bwana kutoa kemeo.
  alternative: Mikaeli hakutoa shtaka la kumtukana au hukumu yenye kufuru.
  rationale: Kirai κρίσιν ... βλασφημίας kina utata wa kisarufi na kimaana. Tafsiri haifafanui zaidi ya maandishi mamlaka au hadhi ya malaika, bali inadumisha tofauti iliyo wazi kati ya hukumu ambayo Mikaeli hakutoa na kemeo alilomwomba Bwana atoe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Malaika mkuu” ni wazi kwa msomaji wa kawaida; “akibishana” na “kujadiliana” huhifadhi vitenzi viwili vya Kigiriki bila kufanya sentensi iwe nzito. Alama zote za tanbihi zimewekwa mahali panapohusika katika maandishi.
