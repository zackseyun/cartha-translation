id: JUD.1.17
reference: Jude 1:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: sw
  text: Lakini ninyi, wapendwa, yakumbukeni maneno yaliyosemwa hapo awali na mitume wa Bwana wetu Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Yesu Kristo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Lakini ninyi
  rationale: Inahifadhi tofauti inayowekwa na δέ pamoja na msisitizo wa kiwakilishi Ὑμεῖς, huku ikibaki ya kawaida katika Kiswahili.
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: Ni mwito wa upendo kwa wingi na unadumisha sauti yenye heshima ya waraka.
- source_word: μνήσθητε
  choice: yakumbukeni
  rationale: Amri hii inaelekeza wasomaji wayakumbuke mafundisho waliyokwisha kupokea; kiambishi ya- kinarejelea “maneno.”
- source_word: τῶν ῥημάτων
  choice: maneno
  rationale: Hurejelea kauli zilizonenwa na ndiyo tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: τῶν προειρημένων
  choice: yaliyosemwa hapo awali
  rationale: Inahifadhi maana ya kutangulia kwa wakati bila kulazimisha dhana ya unabii ambayo “yaliyotabiriwa” ingeweza kuingiza.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: na mitume
  rationale: Muundo wa kutendwa unamtaja mtendaji kwa “na”; “mitume” ni istilahi iliyozoeleka kwa ἀπόστολοι.
- source_word: τοῦ κυρίου ἡμῶν
  choice: wa Bwana wetu
  rationale: Inahifadhi uhusiano wa mitume na Bwana aliyewatuma pamoja na maana ya κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” huwasilisha Χριστός kama cheo cha Yesu kwa Kiswahili cha kawaida; “Kristo” imetolewa kama mbadala katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός humtambulisha Yesu kuwa Masihi. “Masihi” hutafsiri maana ya cheo hicho, huku “Kristo,” umbo la mapokeo lililotoholewa, likihifadhiwa katika tanbihi bila kudai kwamba tofauti hiyo inaondoa utata wa jinsi cheo hiki kilivyotumika kama jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio unahifadhi msisitizo wa “ninyi” na tofauti na watu waliotajwa kabla.
