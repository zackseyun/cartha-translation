id: JUD.1.25
reference: Jude 1:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: sw
  text: Kwa Mungu wa pekee, Mwokozi wetu, kupitia Yesu Masihi[a], Bwana wetu, kuwe na utukufu, ukuu, nguvu ya kutawala na mamlaka, kabla ya wakati wote, sasa na milele[b]. Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu Kristo.” Neno la Kigiriki Χριστός limetafsiriwa hapa kuwa “Masihi” ili kuhifadhi maana yake kama cheo.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “kabla ya kila enzi ... hadi enzi zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ
  choice: Mungu wa pekee
  rationale: Muundo huu unaonyesha kwamba Mungu ni wa kipekee na ndio mlengwa wa sifa, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: σωτῆρι ἡμῶν
  choice: Mwokozi wetu
  rationale: “Mwokozi” ndilo neno la kawaida la Kiswahili kwa σωτήρ katika muktadha wa wokovu.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kupitia Yesu Masihi
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au upatanishi; “kupitia” huhifadhi maana hiyo. “Masihi” hutafsiri maana ya cheo Χριστός badala ya kukifanya jina lisilotafsiriwa.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Bwana wetu
  rationale: Kirai hiki kinamtambulisha Yesu Masihi kama Bwana wetu.
- source_word: δόξα
  choice: utukufu
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika tungo za sifa kwa Mungu.
- source_word: μεγαλωσύνη
  choice: ukuu
  rationale: “Ukuu” huwasilisha ukubwa na adhama ya Mungu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: κράτος
  choice: nguvu ya kutawala
  rationale: κράτος huelekea kumaanisha nguvu inayodhihirishwa katika utawala; kirai hiki huitofautisha na ἐξουσία.
- source_word: ἐξουσία
  choice: mamlaka
  rationale: “Mamlaka” huonyesha haki au uwezo halali wa kuamuru na hutunza tofauti yake na κράτος.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: kabla ya wakati wote
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kuwapo kabla ya wakati au kabla ya zama zote, bila kulazimisha tafsiri finyu.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: sasa na milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha mwendelezo wa sasa hadi zama zote zijazo; tanbihi huhifadhi umbo halisi zaidi.
theological_decisions:
- issue: Uhusiano wa kirai cha upatanishi katika sifa
  choice: Sifa zinaelekezwa kwa Mungu wa pekee, Mwokozi wetu, kupitia Yesu Masihi, Bwana wetu.
  alternative: Kirai “kupitia Yesu Masihi” kinaweza kuunganishwa kwa namna isiyo mahsusi sana na tungo nzima ya sifa.
  rationale: Sarufi kwa kawaida huunganisha διὰ Ἰησοῦ Χριστοῦ na sifa zinazotolewa kwa Mungu; tafsiri hii huhifadhi pia nafasi ya Yesu kama mpatanishi bila kuwachanganya wahusika.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός ni cheo; “Masihi” huonyesha maana ya cheo hicho moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima na wa kisasa unaofaa tungo ya sifa. “Nguvu ya kutawala” imetumiwa ili kutofautisha κράτος na “mamlaka” (ἐξουσία).
