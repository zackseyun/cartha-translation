base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: sw
  text: Jitunzeni katika upendo wa Mungu[a], huku mkingojea rehema ya Bwana wetu Yesu, Masihi[b], kwa uzima wa milele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika upendo ambao Mungu anao”; Kigiriki kinaweza pia kueleweka kuwa “katika upendo kwa Mungu.”
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: “Yesu Kristo”; hapa Χριστός limetafsiriwa “Masihi” kwa sababu linachukuliwa kuwa cheo.'
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa ajili ya uzima wa milele” au “hadi uzima wa milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: jitunzeni
  rationale: Kitenzi hiki ni amri ya moja kwa moja kwa wingi. “Jitunzeni” ni Kiswahili cha kawaida kinachobeba wazo la kujiweka au kudumu katika hali iliyotajwa bila kuongeza namna ya kufanya hivyo.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: katika upendo wa Mungu
  rationale: 'Muundo huu unafuata Kigiriki kwa karibu na kuhifadhi utata wa kiambishi milikishi: unaweza kumaanisha upendo wa Mungu kwa waamini au upendo wao kwa Mungu.'
- source_word: προσδεχόμενοι
  choice: huku mkingojea
  rationale: Hali ya kuendelea inayofuatana na amri kuu imewasilishwa kwa “huku,” nayo “mkingojea” inaonyesha matarajio bila kuongeza msisitizo usiotajwa wazi.
- source_word: ἔλεος
  choice: rehema
  rationale: “Rehema” ni neno la kawaida na lenye hadhi kwa fadhili yenye huruma, na linafaa katika matumizi ya Agano Jipya.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος katika muktadha huu wa Agano Jipya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός ina nguvu ya cheo hapa; “Masihi” huwasilisha maana ya yule aliyetiwa mafuta badala ya kulichukua tu kama jina lisilotafsiriwa.
- source_word: εἰς ζωὴν αἰώνιον
  choice: itakayowafikisha kwenye uzima wa milele
  rationale: εἰς huonyesha lengo au matokeo. Kauli hii ni ya kawaida katika Kiswahili na huonyesha mwendo kuelekea uzima wa milele, ingawa tanbihi inataja uwezekano mwingine wa kuunganisha kirai hicho.
theological_decisions:
- issue: Maana ya umilikishi katika ἀγάπῃ θεοῦ
  choice: Kuhifadhi utata kwa “upendo wa Mungu”
  alternative: “Mungu kuwapenda” au “kumpenda Mungu”
  rationale: Kigiriki kinaweza kueleweka kama upendo utokao kwa Mungu au upendo unaoelekezwa kwa Mungu; muktadha wa karibu haulazimishi kuchagua maana moja.
- issue: Tafsiri ya Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili bado lina maana ya cheo, kwa hiyo “Masihi” linaonyesha maana yake badala ya kulifanya kuwa sehemu ya jina tu.
- issue: Uhusiano wa εἰς ζωὴν αἰώνιον na rehema inayongojewa
  choice: “itakayowafikisha kwenye uzima wa milele”
  alternative: “kwa ajili ya uzima wa milele” au “hadi uzima wa milele”
  rationale: Tafsiri kuu inaonyesha lengo au matokeo ya rehema bila kufafanua zaidi asili ya uzima huo; tanbihi huhifadhi miunganiko mingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “huku mkingojea” unaunganisha hali inayoendelea na amri kuu kwa njia ya kawaida; “jitunzeni” ni wazi kwa wasomaji wa kawaida. Utata wa “upendo wa Mungu” umeachwa katika matini na kufafanuliwa katika tanbihi.
