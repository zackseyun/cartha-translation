id: JUD.1.5
reference: Jude 1:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: sw
  text: Nataka kuwakumbusha[a], ingawa mmekwisha kuyajua haya yote mara moja tu, kwamba Yesu, baada ya kuwaokoa watu kutoka nchi ya Misri, baadaye aliwaangamiza wale ambao hawakuamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale husoma “Bwana” au “Mungu” badala ya “Yesu.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι ... βούλομαι
  choice: Nataka kuwakumbusha
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya nia ya mwandishi ya kuwakumbusha wasomaji jambo walilokwisha kujua.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: ingawa mnajua mambo haya yote mara moja kwa wakati wote
  rationale: Muundo wa hali umechukuliwa kuwa wa kukubali tofauti ('ingawa'), πάντα inaelekezwa kwa mambo yanayozungumziwa, na ἅπαξ imehifadhiwa kwa maana ya jambo lililofanyika mara moja lenye matokeo ya kudumu.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Maandishi ya SBLGNT yaliyotolewa yanasoma Ἰησοῦς; tafsiri inalihifadhi wazi jina hilo bila kulainisha dai lake kuhusu Yesu katika tukio la kutoka Misri.
- source_word: λαὸν ἐκ γῆς Αἰγύπτου σώσας
  choice: baada ya kuwaokoa watu kutoka nchi ya Misri
  rationale: Kishazi cha wakati kinaonyesha kuwa kuokoa kulitangulia tendo kuu; 'watu' ni usemi wa kawaida wa kundi la watu, na 'nchi ya Misri' huhifadhi mwangwi wa lugha ya Kutoka.
- source_word: τὸ δεύτερον
  choice: baadaye
  rationale: Katika muktadha huu usemi unaonyesha tendo lililofuata kuokolewa kwa watu, si lazima 'mara ya pili' kwa Kiswahili.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: wale ambao hawakuamini
  rationale: Hutafsiri moja kwa moja kundi lililokataa kuamini, bila kubadili maana kuwa hali ya jumla tu.
- source_word: ἀπώλεσεν
  choice: aliwaangamiza
  rationale: Neno hili linadumisha ukali wa hukumu ya Mungu unaoonyeshwa na kitenzi cha Kigiriki.
theological_decisions:
- issue: Mhusika wa tendo katika kifungu cha kutoka Misri
  choice: Yesu katika maandishi makuu
  alternative: Bwana; Mungu
  rationale: Chanzo kilichotolewa kinasoma Ἰησοῦς. Hivyo maandishi makuu yanahifadhi dai la kikristo kuhusu Yesu, huku tofauti muhimu za hati zikielezwa katika tanbihi.
- issue: Uhusiano kati ya kuokoa na kuangamiza
  choice: Kuhifadhi matendo yote mawili yakihusishwa na Yesu
  alternative: Kufafanua au kupunguza mvutano kwa kubadili mhusika
  rationale: Aya yenyewe inaweka wokovu na hukumu chini ya mhusika mmoja; tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo ni wa ulinganifu bora, ukikaribia muundo wa chanzo bila kutoa Kiswahili kisicho cha kawaida.
