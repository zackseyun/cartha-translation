id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: sw
  text: Mtu yeyote akisema, na aseme kama mtu anayetoa matamko ya Mungu[a]; mtu yeyote akihudumu, na ahudumu kwa nguvu ambazo Mungu hutoa[b], ili katika mambo yote Mungu atukuzwe kupitia Yesu Masihi, ambaye utukufu na mamlaka ni vyake milele na milele[c][d]. Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno ya Mungu.” Neno la Kigiriki λόγια humaanisha matamko ya kimungu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi zaidi, “kama kwa nguvu ambazo Mungu hutoa.”
    reason: previous_rendering
  - marker: c
    text: Neno “ambaye” kwa kawaida humrejelea Yesu Masihi, aliyetajwa karibu zaidi; lakini wengine hulielewa kuwa linamrejelea Mungu Baba kwa sababu ya kishazi kilichotangulia.
    reason: alternative_reading
  - marker: d
    text: Kihalisi, “hata milele za milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: akisema
  rationale: Kitenzi hiki kina maana pana ya kusema; hakikufinyangwa kuwa kuhubiri tu.
- source_word: λόγια θεοῦ
  choice: maneno ya Mungu
  rationale: ‘Maneno’ ni ya kawaida na yanaeleweka, huku muundo ‘ya Mungu’ ukihifadhi maana ya matamko yenye asili au mamlaka ya kimungu; maana mahsusi zaidi imeelezwa katika tanbihi.
- source_word: διακονεῖ
  choice: akihudumu
  rationale: ‘Kuhudumu’ huonyesha huduma kwa upana bila kuifunga kwa cheo rasmi cha kanisa.
- source_word: ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός
  choice: kwa nguvu anazotoa Mungu
  rationale: Kiswahili cha asili hutumia ‘kwa nguvu’; chanzo cha nguvu hizo kutoka kwa Mungu kinaonyeshwa wazi na ‘anazotoa Mungu’.
- source_word: ἵνα ἐν πᾶσιν δοξάζηται ὁ θεός
  choice: ili katika mambo yote Mungu atukuzwe
  rationale: ‘Ili’ huhifadhi kusudi, ‘katika mambo yote’ hudumisha upeo mpana, na ‘atukuzwe’ huhifadhi kauli tendwa.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kupitia Yesu Masihi
  rationale: ‘Kupitia’ huonyesha uhusiano wa uwakala au njia; Χριστός limetafsiriwa kama cheo ‘Masihi’.
- source_word: κράτος
  choice: mamlaka
  rationale: Katika sifa hii neno linadokeza uwezo wa kutawala; ‘mamlaka’ ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Hii ni tafsiri asilia ya nahau ya Kigiriki inayoonyesha muda usio na mwisho.
theological_decisions:
- issue: Rejeo la ᾧ (‘ambaye’) katika sifa ya mwisho
  choice: ‘Ambaye’ linaunganishwa kwa kawaida na Yesu Masihi, nomino iliyo karibu zaidi.
  alternative: Baadhi hulielewa kuwa linamrejelea Mungu Baba kwa sababu ndiye anayetajwa kuwa anatukuzwa katika kishazi kilichotangulia.
  rationale: Sarufi inaunga mkono Yesu Masihi kama rejeo la karibu, lakini muktadha unaruhusu uwezekano mwingine; tanbihi inahifadhi utata huo.
- issue: Nguvu ya ὡς katika vishazi viwili
  choice: Muundo wa mausia ‘na aseme …; na ahudumu …’ umetumiwa.
  alternative: 'Muundo wa karibu zaidi na ellipsisi ya Kigiriki: ‘Mtu akisema, kama maneno ya Mungu; mtu akihudumu, kama kwa nguvu …’'
  rationale: Kigiriki kinaacha kitenzi cha mausia kikiwa kimedokezwa. Kiswahili kinahitaji kukiweka wazi ili sentensi iwe ya kawaida bila kuongeza dai jipya la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘mtu aki- … na a- …’ unatoa mausia kwa njia ya kawaida; ‘Masihi’ huhifadhi Χριστός kama cheo. Alama zote za tanbihi [a]–[d] zimo katika matini kuu.
