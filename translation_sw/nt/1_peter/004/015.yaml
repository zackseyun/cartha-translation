  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: sw
  text: Kwa maana mtu yeyote miongoni mwenu asiteseke kama muuaji, au mwizi, au mtenda maovu, au mtu anayeingilia mambo ya wengine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye kujishughulisha na mambo yasiyomhusu”; kwa maana halisi zaidi, “anayesimamia mambo ya mwingine.”
    reason: Neno la Kigiriki ni adimu na linaweza kufasiriwa kwa njia hizi zinazokaribiana.
lexical_decisions:
- source_word: μὴ γάρ
  choice: Kwa maana ... asiteseke
  rationale: ‘Kwa maana’ inadumisha uhusiano wa maelezo unaoletwa na γάρ, huku muundo wa kukanusha ‘asiteseke’ ukiwasilisha katazo la μὴ pamoja na amri ya nafsi ya tatu.
- source_word: τις ὑμῶν
  choice: mtu yeyote miongoni mwenu
  rationale: Muundo huu unadumisha maana ya mtu mmoja mmoja katika τις na uhusiano wa sehemu katika ὑμῶν; katazo katika kitenzi linaifanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: πασχέτω
  choice: asiteseke
  rationale: Kitenzi hiki kinamaanisha kupata au kuvumilia mateso. Tafsiri haiongezi wazo la ‘kuadhibiwa,’ ambalo halijasemwa wazi katika Kigiriki.
- source_word: ὡς
  choice: kama
  rationale: ‘Kama’ linaonyesha hadhi au sababu ambayo mtu anateseka chini yake, bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: φονεύς
  choice: muuaji
  rationale: ‘Muuaji’ ni neno la kawaida na lenye uzito wa kimaadili kwa mtu anayefanya mauaji.
- source_word: κλέπτης
  choice: mwizi
  rationale: ‘Mwizi’ ndilo neno la kawaida la Kiswahili kwa κλέπτης, bila kuleta maana maalumu ya mnyang’anyi.
- source_word: κακοποιός
  choice: mtenda maovu
  rationale: Tafsiri hii inadumisha upana na uzito wa kimaadili wa neno hilo badala ya kulifanya kuwa istilahi ya kisheria tu kama ‘mhalifu.’
- source_word: ἀλλοτριεπίσκοπος
  choice: mtu anayeingilia mambo ya wengine
  rationale: Neno hili adimu lina wazo la kuingilia au kusimamia mambo ya watu wengine isivyofaa. Usemi huu ni wazi kwa msomaji wa sasa na haudokezi cheo cha kanisa.
theological_decisions:
- issue: Maana ya ἀλλοτριεπίσκοπος
  choice: mtu anayeingilia mambo ya wengine
  alternative: mwenye kujishughulisha na mambo yasiyomhusu; kwa maana halisi zaidi, anayesimamia mambo ya mwingine
  rationale: Katika orodha hii ya matendo mabaya, maana hasi ya kuingilia mambo ya wengine inafaa zaidi. Tanbihi inadumisha ugumu wa neno hili adimu na maana yake ya karibu zaidi na muundo wa Kigiriki bila kuingiza wazo la ofisi ya kanisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia msamiati wa kawaida na muundo unaosomeka kwa urahisi, huku ikidumisha katazo, orodha ya makosa, na ugumu wa neno la mwisho.
