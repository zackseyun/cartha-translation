  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: sw
  text: Katika jambo hili[a], wanashangaa kwamba hamkimbilii pamoja nao kwenye mafuriko yale yale ya maisha yasiyo na kiasi[b], huku wakiwatukana[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa sababu ya jambo hili” au “Katika hilo.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwenye mmiminiko uleule wa maisha yasiyo na kiasi.”
    reason: lexical_alternative
  - marker: c
    text: Au “huku wakiwasema vibaya” au “huku wakiwashutumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Katika jambo hili
  rationale: Hudumisha kiunganishi cha Kigiriki kinachorejelea mabadiliko ya mwenendo yaliyotangulia bila kukifanya wazi zaidi kuwa sababu.
- source_word: ξενίζονται
  choice: wanashangaa
  rationale: Huonyesha kushangazwa au kuona jambo kuwa geni kwa Kiswahili cha sasa na cha kawaida.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: kwamba hamkimbilii pamoja nao
  rationale: Hubadili muundo wa genitive absolute kuwa kishazi cha kawaida huku ikihifadhi picha ya kukimbia pamoja na wengine.
- source_word: εἰς τὴν αὐτὴν
  choice: kwenye ... yaleyale
  rationale: Huonyesha kuingia au kushiriki katika mwenendo uleule, kwa muundo wa asili wa Kiswahili.
- source_word: τῆς ἀσωτίας
  choice: ya maisha mapotovu
  rationale: Huwasilisha mwenendo usio na kiasi na ulioharibika kimaadili kwa lugha inayoeleweka, bila kuufupisha kuwa uasherati pekee.
- source_word: ἀνάχυσιν
  choice: mafuriko
  rationale: Huhifadhi sitiari ya kumwagika au kufurika kupita kiasi na inaendana na mwendo unaodokezwa na kitenzi cha kukimbia.
- source_word: βλασφημοῦντες
  choice: huku wakiwatukana
  rationale: Katika muktadha huu ni usemi wa kuwadharau au kuwashambulia watu kwa maneno, si lazima kufuru inayoelekezwa kwa Mungu; muundo wa 'huku' pia hudumisha uhusiano wa participle.
theological_decisions:
- issue: Mwelekeo wa usemi wa βλασφημοῦντες
  choice: huku wakiwatukana
  alternative: huku wakikufuru / huku wakisema mabaya
  rationale: Muktadha unaonyesha mwitikio wa watu kwa waamini waliobadili mwenendo. 'Kukufuru' katika Kiswahili mara nyingi hueleweka kuwa usemi dhidi ya Mungu, hivyo 'kuwatukana' huepuka maana hiyo finyu bila kuondoa uadui wa maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Sitiari ya mafuriko imehifadhiwa; 'maisha mapotovu' huepuka kueleza ἀσωτία kuwa uasherati pekee. Alama zote za tanbihi zimewekwa moja kwa moja baada ya sehemu zinazohusika.
