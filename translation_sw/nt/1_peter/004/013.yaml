id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: sw
  text: Bali, kwa kadiri mnavyoshiriki katika mateso ya Masihi[a], furahini, ili wakati wa ufunuo wa utukufu wake[b] nanyi mfurahi kwa shangwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “wakati utukufu wake utakapofunuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὸ
  choice: kwa kadiri
  rationale: 'Inaonyesha uhusiano wa kiwango: waamini waendelee kufurahi kwa kadiri wanavyoshiriki katika mateso hayo, badala ya kuifanya kauli iwe ya wakati tu.'
- source_word: κοινωνεῖτε
  choice: mnavyoshiriki katika
  rationale: Ni Kiswahili cha kawaida kinachohifadhi maana ya kuwa na sehemu katika jambo, si kuhurumia tu.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: katika mateso ya Masihi
  rationale: Inahifadhi muundo wa umilikaji na pia haitoi maelezo ya ziada kuhusu namna hasa waamini wanavyoshiriki mateso hayo.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inatumiwa kama cheo; ‘Masihi’ huhifadhi maana yake ya kimasiya na mazingira yake ya Kiyahudi.
- source_word: χαίρετε
  choice: furahini
  rationale: Amri hii ni ya moja kwa moja, ya asili katika Kiswahili, na inadumisha uhusiano wa kileksia na χαρῆτε baadaye.
- source_word: ἵνα
  choice: ili
  rationale: Inaeleza kusudi au matokeo yanayolengwa kwa lugha fupi na ya kawaida.
- source_word: ἀποκαλύψει
  choice: ufunuo
  rationale: Nomino hii inahifadhi umbo la nomino ya Kigiriki na wazo la utukufu ambao utawekwa wazi.
- source_word: δόξης αὐτοῦ
  choice: utukufu wake
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya umilikaji.
- source_word: χαρῆτε
  choice: mfurahi
  rationale: Inahifadhi uhusiano na amri ‘furahini’ huku muundo wa ‘ili’ ukibeba wazo la subjunktivu.
- source_word: ἀγαλλιώμενοι
  choice: kwa shangwe
  rationale: Inaonyesha furaha kubwa na ya kusherehekea bila kufanya sentensi iwe nzito au isiyo ya kawaida.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo katika muktadha huu. ‘Masihi’ huwasilisha maana ya cheo hicho, huku njia mbadala ikiwekwa katika tanbihi.
- issue: Asili ya kushiriki katika mateso ya Masihi
  choice: mnavyoshiriki katika mateso ya Masihi
  alternative: mnavyoteseka kwa ajili ya Masihi
  rationale: Kigiriki kinasema kushiriki katika mateso yanayohusishwa na Masihi. Tafsiri haibainishi kwamba ni mateso kwa ajili yake wala haidai kwamba waamini wanarudia kazi yake ya ukombozi.
- issue: Uhusiano kati ya furaha ya sasa na ya baadaye
  choice: furahini, ili pia ... mfurahi kwa shangwe
  alternative: furahini ... nanyi mtafurahi kwa shangwe
  rationale: Muundo huu huhifadhi ἵνα pamoja na subjunktivu na pia neno καὶ, ukiunganisha furaha ya sasa katika mateso na furaha ya wakati wa ufunuo wa utukufu wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kwa kadiri’ huhifadhi nguvu ya uwiano ya καθὸ; ‘kwa shangwe’ hutoa hitimisho la asili huku likihifadhi msisitizo wa ἀγαλλιώμενοι. Alama zote za tanbihi zimewekwa moja kwa moja katika matini.
