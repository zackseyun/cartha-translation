  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa Masihi[a] aliteseka katika mwili[b], ninyi pia jivikeni silaha kwa nia hiyo hiyo, kwa sababu yule aliyeteseka katika mwili ameacha dhambi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Kigiriki Christos ni cheo chenye maana ya “Masihi.”
    reason: lexical_alternative
  - marker: b
    text: “Katika mwili” hapa humaanisha katika maisha ya kibinadamu yenye mwili; si lazima kumaanisha “asili ya dhambi.”
    reason: lexical_alternative
  - marker: c
    text: Kauli “yule aliyeteseka katika mwili ameacha dhambi” inaeleweka kwa njia mbalimbali. Huenda ikamhusu hasa Masihi, waamini wanaofuata mfano wake, au kanuni ya jumla kuhusu kuachana kwa uthabiti na dhambi.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Huhifadhi maana ya cheo cha Χριστός katika muktadha huu; tanbihi inaonyesha istilahi nyingine iliyozoeleka.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na muktadha uliotangulia kwa Kiswahili cha kawaida.
- source_word: παθόντος
  choice: aliteseka
  rationale: Muundo wa kishirikishi cha wakati uliopita umewasilishwa kwa kishazi cha sababu, “kwa kuwa ... aliteseka,” kwa ufasaha bila kupoteza nguvu yake.
- source_word: σαρκὶ
  choice: katika mwili
  rationale: Katika Kiswahili, “katika mwili” huwasilisha hali ya maisha ya kibinadamu yenye mwili bila kudokeza moja kwa moja “asili ya dhambi”; urudiaji wa Kigiriki umehifadhiwa.
- source_word: ἔννοιαν
  choice: nia
  rationale: Huwasilisha mtazamo, fikra, au azimio la ndani kwa neno la sasa na lenye heshima; tanbihi si lazima kwa kuwa maana pana inafaa katika muktadha.
- source_word: ὁπλίσασθε
  choice: jivikeni silaha ya
  rationale: Huhifadhi sitiari ya kijeshi na nguvu ya amri ya kujitendea, huku ikisomeka kwa kawaida pamoja na “nia hiyo hiyo.”
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha msingi wa himizo kwa uwazi.
- source_word: ὁ παθὼν
  choice: yule aliyeteseka
  rationale: Huhifadhi usemi wa jumla usiomtaja mhusika moja kwa moja, hivyo kutosuluhisha utata wa rejeleo.
- source_word: πέπαυται ἁμαρτίας
  choice: ameacha kutenda dhambi
  rationale: Huwasilisha hali iliyotokana na kukoma na dhambi kwa Kiswahili cha asili. Kitenzi “kutenda” huwekwa ili muundo uwe wazi, bila kubainisha zaidi kama ni utawala, mazoea, au matendo ya dhambi.
theological_decisions:
- issue: Rejeleo na maana ya “yule aliyeteseka katika mwili ameacha kutenda dhambi”
  choice: Kauli imeachwa katika umbo lake pana bila kubainisha kama inamhusu Masihi pekee, waamini wanaofuata mfano wake, au kanuni ya jumla.
  alternative: Inaweza kueleweka kuwa inamhusu Masihi, waamini wanaovunja uhusiano wao na dhambi kupitia mateso, au kanuni ya jumla kuhusu kuachana kabisa na maisha ya dhambi.
  rationale: Kigiriki ni kifupi na kina utata wa kweli wa kifasiri. Tafsiri haiongezi mhusika wala maelezo ya kitheolojia yasiyokuwapo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kujivika silaha imehifadhiwa, pamoja na urudiaji wa “katika mwili.”
