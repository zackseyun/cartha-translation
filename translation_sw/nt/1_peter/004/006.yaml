  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: sw
  text: 'Kwa maana, kwa sababu hii Habari Njema ilihubiriwa pia kwa wafu: ili kwamba, ingawa wahukumiwe kwa kadiri ya wanadamu katika mwili, waishi kwa kadiri ya Mungu katika roho.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika Roho.” Kauli hiyo inaweza kumaanisha nyanja ya uzima wa kiroho, kinyume na “katika mwili”; wengine huielewa kwa namna mahususi zaidi kuwa uzima unaotolewa na Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: hii ndiyo sababu
  rationale: Kauli ya kawaida ya Kiswahili inayodumisha nguvu ya kueleza sababu, huku γάρ ikiwakilishwa na “kwa maana.”
- source_word: νεκροῖς
  choice: kwa wafu
  rationale: Kivumishi cha wingi kilichotumika kama nomino; tafsiri hii haibainishi ikiwa walikuwa wamekufa kimwili au kiroho.
- source_word: εὐηγγελίσθη
  choice: Habari Njema ilihubiriwa
  rationale: Kauli tendwa inadumishwa, na “Habari Njema” huweka wazi maana iliyodokezwa ya kitenzi εὐαγγελίζω kwa lugha ya kawaida ya Kikristo.
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi cha kawaida cha kusudi au matokeo katika Kiswahili.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: ingawa wamehukumiwa ... waishi
  rationale: “Ingawa” huwasilisha kwa ufasaha nguvu ya ukinzani wa μὲν...δὲ bila kuondoa hali ya kutendwa ya κριθῶσι au kusudi linalotawaliwa na ἵνα.
- source_word: κατὰ ἀνθρώπους
  choice: kulingana na wanadamu
  rationale: Hudumisha sambamba ya makusudi na κατὰ θεόν na inaonyesha kipimo au mtazamo wa kibinadamu bila kumaanisha wanaume pekee.
- source_word: σαρκὶ
  choice: katika mwili
  rationale: Katika muktadha huu σάρξ inaelekea kutaja eneo la maisha ya kimwili ya mwanadamu, si “asili ya dhambi”; “mwili” ni ya asili zaidi katika Kiswahili kuliko “nyama” hapa.
- source_word: κατὰ θεὸν
  choice: kulingana na Mungu
  rationale: Tafsiri ya karibu inayohifadhi ukinzani wa moja kwa moja na “kulingana na wanadamu” bila kufafanua iwapo ni kipimo, mapenzi, au mtazamo wa Mungu.
- source_word: πνεύματι
  choice: katika roho
  rationale: Dativi inaeleweka kama eneo au namna ya maisha, sambamba na σαρκί; herufi ndogo huepuka kuamua kwamba Roho Mtakatifu ndiye anayetajwa waziwazi.
theological_decisions:
- issue: Utambulisho wa “wafu”
  choice: Imeachwa kwa ujumla kama “wafu.”
  alternative: Watu waliokufa sasa lakini walioisikia Habari Njema walipokuwa hai; waliokufa kiroho; au wafu wanaohusishwa na 1 Petro 3:19.
  rationale: Kigiriki hakifafanui hali yao wakati Habari Njema ilipohubiriwa; tafsiri haipaswi kuingiza hitimisho la kimadhehebu.
- issue: Maana ya kuhukumiwa katika mwili na kuishi katika roho
  choice: Ukinzani umehifadhiwa bila kubainisha aina ya hukumu au chanzo mahsusi cha uzima wa roho.
  alternative: Hukumu ya wanadamu katika maisha ya mwili; kifo cha kimwili; hukumu ya Mungu katika eneo la mwili; au uzima unaotolewa na Roho Mtakatifu.
  rationale: Muundo wa Kigiriki una mvutano wa kimakusudi na unaweza kueleweka kwa namna kadhaa zinazokaribiana; tafsiri inauacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa uwe wa asili kwa msomaji wa kawaida, huku sambamba ya “kulingana na wanadamu ... kulingana na Mungu” na utata wa “wafu” na “roho” vikihifadhiwa.
