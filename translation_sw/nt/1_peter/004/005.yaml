  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: sw
  text: Nao watatoa hesabu kwa yule aliye tayari kuwahukumu walio hai na waliokufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye tayari kuhukumu.” Usemi wa Kigiriki unaeleza kihalisi mtu “aliye na utayari wa kuhukumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: Nao
  rationale: Kiwakilishi hiki cha uhusiano kinawarejelea watu waliotajwa katika mstari uliotangulia. “Nao” huendeleza rejeo hilo kwa njia ya kawaida katika Kiswahili.
- source_word: ἀποδώσουσιν λόγον
  choice: watatoa hesabu
  rationale: Nahau hii ina maana ya kutoa hesabu au kuwajibika mbele ya mwenye kuhukumu. “Watatoa hesabu” ni usemi wazi na wa kawaida unaodumisha muktadha wa hukumu.
- source_word: τῷ
  choice: kwa yule
  rationale: Kibainishi pamoja na kirai cha kisifa kinamtaja mhusika bila kumtambulisha kwa jina. “Kwa yule” hudumisha muundo huo na haiongezi utambulisho usiotajwa wazi katika Kigiriki.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: aliye tayari kuwahukumu
  rationale: Kirai hiki kinaeleza kuwa mwenye kuhukumu yuko tayari kufanya hivyo. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi hali ya utayari bila kuongeza taswira isiyolazimishwa na matini.
- source_word: ζῶντας καὶ νεκρούς
  choice: walio hai na waliokufa
  rationale: Hili ni fumbo jumuishi linalowataja watu walio hai na wale waliokufa. Muundo huu ni mfupi, wazi, na wenye heshima katika Kiswahili cha sasa.
theological_decisions:
- issue: Utambulisho wa yule aliye tayari kuwahukumu walio hai na waliokufa
  choice: Imetafsiriwa “yule” bila kumtaja wazi kuwa Mungu au Kristo.
  alternative: Mungu; Kristo/Masihi
  rationale: Matini ya Kigiriki haimtaji mhukumu kwa jina katika mstari huu. Kubakiza “yule” kunahifadhi usemi wa chanzo na kuepuka kutatua mvutano wa kitheolojia kwa kuongeza utambulisho usioelezwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, wazi na yenye heshima. “Kutoa hesabu” huhifadhi maana ya kuwajibika katika muktadha wa hukumu, huku “yule” akihifadhi kutotajwa wazi kwa utambulisho wa mhukumu.
