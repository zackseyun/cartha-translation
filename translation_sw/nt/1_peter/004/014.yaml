id: 1PE.4.14
reference: 1 Peter 4:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: sw
  text: Mkitukanwa kwa ajili ya jina la Masihi[a], heri yenu, kwa sababu Roho wa utukufu na wa Mungu[b] anatulia juu yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: Kristo; hapa limetafsiriwa “Masihi” kwa sababu Χριστός linatumika kama cheo.'
    reason: lexical_alternative
  - marker: b
    text: Inaweza pia kutafsiriwa “Roho wa Mungu mwenye utukufu”; au, “Roho wa utukufu, yaani Roho wa Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: mkitukanwa
  rationale: Kitenzi hiki cha hali ya kutendwa kinaonyesha kudhalilishwa kwa maneno; “kutukanwa” ni Kiswahili cha kawaida kinachohifadhi wazo la fedheha ya kijamii.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: kwa ajili ya jina la Masihi
  rationale: Katika muktadha huu kirai kinaonyesha kutendewa jambo kwa sababu ya kuhusishwa na jina na utambulisho wa Yesu kama Masihi. “Kwa ajili ya” ni cha kawaida zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ya ἐν.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa ina nguvu ya cheo, yaani Mtiwa-Mafuta, badala ya kuwa jina tu.
- source_word: μακάριοι
  choice: heri yenu
  rationale: Usemi huu wa kawaida wa kibiblia unaonyesha hali ya kupendelewa na Mungu, si hisia ya furaha tu.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Roho wa utukufu na wa Mungu
  rationale: Muundo huu unahifadhi kwa kadiri inayowezekana uratibu na utata wa viambajengo viwili vya Kigiriki bila kuamua kimya-kimya kama cha pili kinafafanua cha kwanza.
- source_word: δόξης
  choice: utukufu
  rationale: “Utukufu” ndilo neno la kawaida la kibiblia kwa δόξα na linafaa hasa linapohusu uwepo wa Mungu.
- source_word: ἀναπαύεται
  choice: anatulia juu yenu
  rationale: “Anatulia” hudokeza kutua na kubaki, huku “juu yenu” ikihifadhi ἐφ’ ὑμᾶς na mwangwi wa lugha inayohusu Roho kutulia juu ya mtu.
theological_decisions:
- issue: Jinsi ya kuelewa τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Roho wa utukufu na wa Mungu
  alternative: Roho wa Mungu mwenye utukufu; au, Roho wa utukufu, yaani Roho wa Mungu
  rationale: Kigiriki kinaweza kueleweka kuwa na maelezo mawili yanayoratibiwa kuhusu Roho, au maelezo ya pili yanayofafanua la kwanza. Tafsiri kuu haifungi uwezekano huo kwa kuchagua maana moja pekee.
- issue: Nguvu ya Χριστός katika kifungu hiki
  choice: Masihi
  alternative: Kristo
  rationale: Neno linatumika kama cheo cha Yesu, hivyo “Masihi” huonyesha wazi maana ya Mtiwa-Mafuta bila kuingiza fundisho la dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Heri yenu” huhifadhi mtindo wa tamko la baraka, na “anatulia juu yenu” ni wazi kwa wasomaji wa kawaida huku kikidumisha taswira ya chanzo.
