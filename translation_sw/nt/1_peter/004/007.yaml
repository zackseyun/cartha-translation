base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: sw
  text: Lakini mwisho wa mambo yote umekaribia.[a] Kwa hiyo, muwe na akili timamu na mwe macho kwa ajili ya maombi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uko karibu.” Kitenzi cha Kigiriki cha wakati timilifu kinaweza kutafsiriwa kwa mtindo wa karibu zaidi na umbo lake kama “umekaribia,” au kwa mtindo wa kawaida zaidi kama “mwisho uko karibu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “muwe na busara na mwe na kiasi kwa ajili ya maombi.” Maagizo haya mawili yanakazia uamuzi ulio timamu na umakini wa kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: mambo yote
  rationale: Nomino inayodokezwa na umbo la wingi lisilo na jinsi maalumu imeelezwa kwa Kiswahili kama “mambo,” hivyo kuunda usemi wa kawaida “mwisho wa mambo yote.”
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye tofauti ndogo na yaliyotangulia; “Lakini” kinadumisha mgeuko huo wa hoja.
- source_word: τὸ τέλος
  choice: mwisho
  rationale: Katika muktadha huu wa mambo ya mwisho, “mwisho” ndiyo maana ya moja kwa moja bila kuingiza mfumo fulani wa kinabii.
- source_word: ἤγγικεν
  choice: umekaribia
  rationale: Kauli hii inadumisha hali ya sasa iliyotokana na kukaribia, sawa na nguvu ya wakati timilifu wa Kigiriki.
- source_word: σωφρονήσατε
  choice: muwe na akili timamu
  rationale: Usemi huu unasisitiza uamuzi mzuri, fikira zilizotulia, na nidhamu ya nafsi, badala ya kudokeza tu kujizuia kimwili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha wazi kwamba maagizo yanayofuata ni hitimisho linalotokana na ukaribu wa mwisho.
- source_word: νήψατε
  choice: mwe macho
  rationale: Katika matumizi yake ya kitamathali hapa, kitenzi kinamaanisha kuwa macho kiakili na kiroho. “Mwe macho” ni cha asili na hakifanyi mstari huu kuwa amri mahsusi kuhusu kileo.
- source_word: εἰς προσευχάς
  choice: kwa ajili ya maombi
  rationale: Kirai hiki kinaonyesha kusudi la kuwa na akili timamu na kuwa macho. Wingi “maombi” umehifadhiwa kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Nguvu ya kieskatolojia ya “mwisho wa mambo yote”
  choice: Kauli imedumishwa kama tangazo la moja kwa moja kwamba mwisho umekaribia, bila kubainisha ratiba au mfumo wa matukio ya mwisho.
  alternative: Kutafsiri τέλος kama “lengo” au kueleza kwamba mwisho umetimia kabisa tayari.
  rationale: Muktadha unaunganisha ukaribu wa mwisho na wito wa kuwa tayari kwa maombi; tafsiri inahifadhi haraka na mvutano huo bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Muwe na akili timamu” na “mwe macho” vinatofautisha maagizo mawili yanayohusiana bila kuyalazimisha kuwa marejeo ya ugonjwa wa akili au kujiepusha na kileo.
