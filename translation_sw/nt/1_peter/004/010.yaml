  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: sw
  text: Kila mmoja, kadiri alivyopokea karama, na aitumie kuwahudumia miongoni mwenu[a], kama wasimamizi wema wa neema ya Mungu yenye sura mbalimbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninyi kwa ninyi” au “kwa ajili yenu wenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Kila mmoja
  rationale: Inahifadhi msisitizo wa kigawanyo kwamba kila mshiriki mmoja mmoja anahusika.
- source_word: καθὼς ἔλαβεν
  choice: kwa kadiri alivyopokea
  rationale: Inaonyesha ulinganifu kati ya kile ambacho kila mmoja amepokea na huduma yake, huku ikidumisha ukweli wa kupokea uliotolewa na aoristi.
- source_word: χάρισμα
  choice: karama
  rationale: Katika Kiswahili cha kawaida cha Kikristo, ‘karama’ hueleza zawadi inayotokana na neema bila kuibana kwa kuongeza neno ‘ya kiroho,’ ambalo halipo wazi katika nomino yenyewe.
- source_word: εἰς ἑαυτοὺς
  choice: ninyi kwa ninyi
  rationale: Inawasilisha maana ya kijumuiya na ya kuelekezana ya kiwakilishi rejeshi cha wingi; tanbihi inahifadhi uwezekano wa kuelewa kama ‘miongoni mwenu’ au ‘kwa ajili ya wengine.’
- source_word: αὐτὸ διακονοῦντες
  choice: aitumie kuwahudumia
  rationale: Kirai cha Kiswahili kinaeleza kwa kawaida kwamba karama ndiyo inayotumiwa katika huduma, na kuipa participio nguvu ya himizo inayotokana na muktadha.
- source_word: καλοὶ οἰκονόμοι
  choice: mawakili wazuri
  rationale: ‘Mawakili’ huhifadhi wazo la kukabidhiwa mali au rasilimali za mwingine na kuwajibika kwa usimamizi wake; ‘wazuri’ huakisi καλοί bila kuingiza moja kwa moja maana finyu ya ‘waaminifu.’
- source_word: ποικίλης χάριτος θεοῦ
  choice: neema ya Mungu iliyo ya namna mbalimbali
  rationale: Inaonyesha kwamba neema ni ya Mungu na hujitokeza kwa sura au namna nyingi, bila kutumia lugha ya kizamani.
theological_decisions:
- issue: Kama χάρισμα itafsiriwe kwa maana finyu kuwa ‘karama ya kiroho’
  choice: karama
  alternative: karama ya kiroho; zawadi ya neema
  rationale: Muktadha unahusu huduma inayowezeshwa na neema, lakini neno lenyewe halilazimishi kirai cha kiufundi ‘ya kiroho.’ ‘Karama’ huhifadhi upana huo.
- issue: Jinsi ya kuwasilisha nguvu ya kijumuiya ya εἰς ἑαυτούς
  choice: ninyi kwa ninyi
  alternative: miongoni mwenu; kwa ajili ya wengine
  rationale: Muundo wa Kigiriki unaelekeza huduma ndani ya jumuiya na kwa wanajumuiya. Tafsiri kuu ni ya asili na wazi katika Kiswahili, huku tanbihi ikihifadhi uwezekano mpana wa uhusiano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imetumia himizo la nafsi ya tatu ‘aitumie’ ili participio ya Kigiriki isomeke kwa kawaida kama agizo. ‘Mawakili’ limetumiwa kwa maana ya watu waliokabidhiwa kusimamia mali ya mwingine, si kwa maana finyu ya taaluma ya sheria.
