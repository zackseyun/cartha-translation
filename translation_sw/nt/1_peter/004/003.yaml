id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: sw
  text: 'Kwa maana wakati uliokwisha kupita unatosha kwa kuwa mmekwisha kutenda mapenzi ya Mataifa: mliishi katika ufisadi[a], tamaa mbaya, ulevi[b], karamu za anasa, sherehe za kunywa, na ibada za sanamu zisizoruhusiwa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matendo ya anasa yasiyo na aibu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vipindi vya kulewa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ibada za sanamu zilizokatazwa,” au “za kuchukiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: Kwa maana wakati uliopita watosha
  rationale: Huwasilisha maana ya wakati ambao tayari umepita kuwa wa kutosha; “kwa maana” linaonyesha kazi ya γάρ ya kutoa sababu au maelezo.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: kufanya mapenzi ya watu wa mataifa
  rationale: βούλημα ni matakwa, nia, au mapenzi; hapa ἔθνη ni watu wasio Wayahudi wanaoishi bila kumjua Mungu, si mataifa kama nchi za kisiasa. “Watu wa mataifa” huhifadhi istilahi ya kibiblia bila kuingiza dharau iliyo wazi zaidi katika “wapagani.”
- source_word: κατειργάσθαι
  choice: kufanya
  rationale: Kitenzi kina maana ya kutenda au kutekeleza kikamilifu. Muundo wa Kiswahili “wakati uliopita watosha kufanya” ni wa kawaida na huhifadhi hoja kwamba muda wa maisha hayo tayari umetosha, ingawa hauonyeshi kwa umbo maalumu hali timilifu ya infinitivu ya Kigiriki.
- source_word: πεπορευμένους
  choice: mliishi
  rationale: Katika muktadha wa maadili, πορεύομαι humaanisha kuenenda au kuishi. “Mliishi” ni Kiswahili cha kawaida na huunganisha orodha inayofuata na mwenendo wa zamani wa wasomaji.
- source_word: ἐν ἀσελγείαις
  choice: katika ufisadi
  rationale: ἀσέλγεια huhusu mwenendo usio na aibu na kujiachia, mara nyingi katika uasherati. “Ufisadi” ni mpana na wenye uzito wa kimaadili; maana ya “matendo ya anasa yasiyo na aibu” imehifadhiwa katika tanbihi.
- source_word: ἐπιθυμίαις
  choice: tamaa mbaya
  rationale: ἐπιθυμία inaweza kuwa hamu ya kawaida au mbaya, lakini katika orodha hii ni tamaa zilizopotoka; “mbaya” huweka wazi nguvu hasi ya muktadha.
- source_word: οἰνοφλυγίαις
  choice: ulevi
  rationale: Nomino adimu ya wingi inaashiria unywaji wa kupindukia au vipindi vya kulewa. Kiswahili hutumia “ulevi” kwa kawaida kama nomino ya jumla; tanbihi huhifadhi uwezekano wa “vipindi vya kulewa.”
- source_word: κώμοις
  choice: karamu za anasa
  rationale: κῶμος ni sherehe au karamu yenye makelele, ulevi, na kujiachia. “Karamu za anasa” ni ya kueleweka na kuitofautisha na πότοις.
- source_word: πότοις
  choice: sherehe za kunywa
  rationale: πότος ni hafla au kikao cha unywaji; tafsiri hii huhifadhi mazingira ya kijamii na kuitofautisha na hali ya ulevi yenyewe.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: ibada za sanamu zilizo kinyume cha sheria
  rationale: ἀθέμιτος humaanisha kisichoruhusiwa au kilicho kinyume cha kanuni ya Mungu. “Kinyume cha sheria” huhifadhi nguvu ya kimaadili na kisheria bila kuongeza wazo la hisia pekee kama “machukizo.”
theological_decisions:
- issue: Maana ya ἐθνῶν
  choice: watu wa mataifa
  alternative: wapagani; Mataifa
  rationale: Muktadha unarejelea jamii zisizo za Kiyahudi na maisha yao ya zamani yasiyomcha Mungu. “Watu wa mataifa” ni istilahi pana ya kibiblia na huepuka kufanya tafsiri kuwa kali kuliko neno lenyewe; muktadha huonyesha maana ya kidini.
- issue: Nguvu ya kimaadili ya ἀθεμίτοις εἰδωλολατρίαις
  choice: ibada za sanamu zilizo kinyume cha sheria
  alternative: ibada za sanamu za kuchukiza; ibada za sanamu zilizokatazwa
  rationale: Kirai kinazihukumu ibada hizo kuwa zisizoruhusiwa na zilizo kinyume cha kanuni ya Mungu, si tu kuwa zenye kuchukiza kihisia. Tafsiri teule huhifadhi mvutano huo wa kimaadili na kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umefanywa kuwa wa kawaida kwa msomaji wa kawaida, huku orodha ya maovu na tofauti kati ya ulevi, karamu za anasa, na sherehe za kunywa zikidumishwa. “Watosha” limetumiwa kama umbo la kifasihi lenye heshima; “unatosha” pia lingekuwa la kawaida zaidi katika mazungumzo.
