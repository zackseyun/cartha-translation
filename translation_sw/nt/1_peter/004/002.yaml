id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: sw
  text: ili aishi muda uliobaki wa maisha yake katika mwili[a], si tena kwa kufuata tamaa za wanadamu, bali kwa kufuata mapenzi ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa maisha yake ya duniani.” Maneno ya Kigiriki yaliyotafsiriwa “katika mwili” hapa yanamaanisha maisha ya duniani katika mwili, si lazima “asili ya dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: ili
  rationale: Kiunganishi hiki pamoja na kitenzi-jina kinaonyesha kusudi au matokeo yanayohusiana na mstari uliotangulia; “ili” ni ya kawaida na wazi katika Kiswahili.
- source_word: μηκέτι
  choice: si tena
  rationale: Inaonyesha kuachana na mwenendo wa awali, huku ikiunganika kwa kawaida na tofauti ya “bali.”
- source_word: ἀνθρώπων
  choice: za wanadamu
  rationale: Ni wingi wa kijumla unaowahusu watu wote, wala si wanaume pekee.
- source_word: ἐπιθυμίαις
  choice: tamaa
  rationale: “Tamaa” ina upana wa maana unaofaa hapa kuliko neno linalohusu hasa uchu wa kingono; katika muktadha huu ni tamaa zinazoongoza mwenendo kinyume na mapenzi ya Mungu.
- source_word: ἀλλὰ
  choice: bali
  rationale: Inaonyesha tofauti yenye nguvu kati ya kufuata tamaa za wanadamu na kufuata mapenzi ya Mungu.
- source_word: θελήματι θεοῦ
  choice: kwa kufuata mapenzi ya Mungu
  rationale: Nyongeza ya “kufuata” inaweka wazi kwa Kiswahili cha kawaida kwamba mapenzi ya Mungu ndiyo mwongozo wa maisha, na inadumisha ulinganifu na “kwa kufuata tamaa.”
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: muda uliobaki wa maisha yake
  rationale: Huwasilisha muda uliosalia wa mtu anayetajwa katika muktadha uliotangulia kwa Kiswahili cha kawaida na kisicho na utata.
- source_word: ἐν σαρκὶ
  choice: katika mwili
  rationale: Hapa kifungu kinamaanisha maisha ya duniani katika mwili, si lazima asili ya dhambi. “Katika mwili” kinahifadhi taswira ya Kigiriki bila kuipa maana ya kimadhehebu.
- source_word: βιῶσαι
  choice: aishi
  rationale: Kitenzi hiki kinahusu kuishi au kutumia kipindi cha maisha; “aishi” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Maana ya σάρξ katika ἐν σαρκὶ
  choice: maisha ya duniani katika mwili (“katika mwili”)
  alternative: asili ya dhambi
  rationale: Muktadha unazungumzia muda uliobaki wa maisha ya mtu duniani. Ingawa mwenendo wa dhambi unatajwa katika muktadha mpana, neno hili lenyewe hapa halilazimishi maana ya kanuni ya ndani ya dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “si tena ... bali ...” umehifadhi tofauti ya Kigiriki, na “kwa kufuata” umetumiwa kwa ulinganifu na ufasaha.
