id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: sw
  text: Wapendwa, msishangae jaribu la moto[a] linalotokea kati yenu ili kuwajaribu, kana kwamba jambo geni linawatokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jaribu la moto kati yenu ... kwa ajili ya kujaribiwa.” Neno la Kigiriki πυρώσει huleta picha ya kuwaka au moto; πειρασμός linaweza kumaanisha kujaribiwa, jaribu, au katika miktadha mingine kishawishi.
    reason: Njia mbadala ya kutafsiri maneno yenye picha ya moto na upana wa maana ya πειρασμός.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Wapendwa
  rationale: Ni mwito wa upendo kwa wingi; “Wapendwa” ni wa asili, wenye heshima, na huhifadhi uhusiano wa neno hili na upendo.
- source_word: μὴ ξενίζεσθε
  choice: msishangae
  rationale: Kitenzi kinaweza kumaanisha kushangazwa au kuona jambo kuwa geni. “Msishangae” ni Kiswahili cha kawaida na kinafaa pamoja na “jambo geni” mwishoni mwa mstari.
- source_word: τῇ ... πυρώσει
  choice: jaribu kali kama moto
  rationale: Neno hilo huibua moja kwa moja picha ya kuwaka au moto, lakini hapa linatumika kwa mateso makali yanayowajaribu waamini. Usemi huu huhifadhi picha ya moto bila kudokeza kwamba moto halisi lazima uwe unakusudiwa.
- source_word: ἐν ὑμῖν
  choice: kati yenu
  rationale: Huhifadhi maana ya kijumuiya ya tukio linalotokea miongoni mwa wasomaji, bila kuondoa kwamba kila mmoja anaweza kulipitia.
- source_word: πρὸς πειρασμόν
  choice: ili kuwajaribu
  rationale: Katika muktadha wa mateso, πειρασμός ni kujaribiwa au kupimwa, si kushawishiwa kutenda dhambi. Muundo wa kusudi “ili kuwajaribu” ni wazi na wa asili.
- source_word: γινομένῃ
  choice: linalotokea
  rationale: Huwasilisha tendo linaloendelea kutokea na hurejelea jaribu lililo kati yao.
- source_word: ὡς ξένου
  choice: kana kwamba jambo geni
  rationale: “Jambo geni” huhifadhi wazo la jambo lisilozoeleka au lisilotarajiwa na pia mwangwi wa ξενίζεσθε ya awali.
- source_word: συμβαίνοντος
  choice: linawatokea
  rationale: Ni usemi wa kawaida wa Kiswahili kwa jambo linalompata mtu.
theological_decisions:
- issue: Maana ya πειρασμός katika muktadha huu
  choice: kujaribiwa au kupimwa kwa njia ya mateso
  alternative: kushawishiwa kutenda dhambi
  rationale: Muktadha wa karibu unazungumzia mateso makali yanayowapata waamini; kwa hiyo maana inayotawala ni kupimwa kwao, ingawa neno hilo linaweza kuwa na maana ya kishawishi katika miktadha mingine.
- issue: Chanzo au mtendaji wa jaribu
  choice: hakutajwa wazi
  alternative: kutaja moja kwa moja kwamba Mungu ndiye anayewajaribu
  rationale: Kifungu cha Kigiriki kinaeleza kusudi la tukio lakini hakimwombi mtafsiri amtaje mtendaji. Tafsiri haiongezi mtendaji ili kuhifadhi uwazi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya kichungaji, ya heshima na inayoeleweka kwa wasomaji wa kawaida. “Jaribu kali kama moto” ni sitiari iliyo wazi; “jambo geni” huhifadhi mwangwi wa maneno ya Kigiriki bila kufanya sentensi kuwa nzito.
