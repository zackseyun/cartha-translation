  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: sw
  text: Kwa hiyo, hata wale wanaoteseka kulingana na mapenzi ya Mungu wamkabidhi Muumba mwaminifu nafsi zao[a], huku wakitenda mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uhai wao” au “wao wenyewe”; neno la Kigiriki linaweza kumaanisha nafsi, uhai, au mtu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia; ni Kiswahili cha kawaida kinachohifadhi nguvu ya kimantiki.
- source_word: οἱ πάσχοντες
  choice: wale wanaoteseka
  rationale: Kirai cha wakati uliopo kinawarejelea kwa ujumla watu wanaopitia mateso; tafsiri hii ni ya asili na wazi.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: kulingana na mapenzi ya Mungu
  rationale: Huhifadhi maana ya kupatana na mapenzi ya Mungu bila kufafanua kama mateso hayo yameruhusiwa, yameamriwa, au yanahusianaje vinginevyo na mapenzi yake.
- source_word: πιστῷ κτίστῃ
  choice: Muumba mwaminifu
  rationale: πιστός hapa humweleza Muumba kuwa mwaminifu na wa kutegemewa; mpangilio huu ni wa kawaida katika Kiswahili na humtambulisha Mungu bila kulazimisha kibainishi kisichokuwapo katika Kigiriki.
- source_word: παρατιθέσθωσαν
  choice: wamkabidhi
  rationale: Amri ya kati ina wazo la kuweka kitu katika uangalizi salama wa mwingine; 'wamkabidhi' ni ya moja kwa moja na inafaa kwa kumtegemea Mungu.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: nafsi zao
  rationale: ψυχή inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. 'Nafsi zao' huhifadhi istilahi kuu na uzito wake, huku maana pana zikitajwa katika tanbihi.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: huku wakitenda mema
  rationale: Huonyesha tendo jema linaloambatana na kujikabidhi kwao kwa Mungu; ni Kiswahili cha asili kinachohifadhi hali ya tendo linaloendelea.
theological_decisions:
- issue: Uhusiano wa mateso na mapenzi ya Mungu
  choice: kulingana na mapenzi ya Mungu
  alternative: kwa mapenzi ya Mungu
  rationale: Kigiriki husema mateso ni kwa kupatana na mapenzi ya Mungu, lakini hakielezi kwa undani kama ni ruhusa, uamuzi, au idhini yake. Tafsiri haiondoi mvutano huo wa kiteolojia.
- issue: Maana ya ψυχή katika muktadha
  choice: nafsi zao
  alternative: uhai wao; wao wenyewe
  rationale: '''Nafsi'' huhifadhi ulinganifu wa kileksika na maana ya kitheolojia, huku tanbihi ikikiri kuwa neno hilo linaweza kumaanisha kwa upana uhai au mtu mwenyewe.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. 'Hata wale' huhifadhi καί, na 'huku wakitenda mema' huwasilisha kitendo kinachoambatana na kujikabidhi.
