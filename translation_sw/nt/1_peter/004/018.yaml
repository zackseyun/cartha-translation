  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: sw
  text: Na ikiwa mwenye haki anaokolewa kwa shida[a], yule asiyemcha Mungu na mwenye dhambi ataonekana wapi?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anaokolewa kwa taabu” au “anaokolewa kwa shida sana.” Maana ni kwamba mwenye haki anaokolewa kupitia majaribu makali, wala si kwamba wokovu wenyewe una shaka.
    reason: lexical_alternative
  - marker: b
    text: Au, “yule asiyemcha Mungu na mwenye dhambi atapatikana wapi?”
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: mwenye haki
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino katika umoja wa kiwakilishi; “mwenye haki” ni Kiswahili cha kawaida na huhifadhi mtindo wa kimethali.
- source_word: μόλις
  choice: kwa shida
  rationale: Neno hili huonyesha ugumu au kunusurika kwa taabu. “Kwa shida” ni la asili katika Kiswahili na halidai kwamba wokovu wenyewe hauna uhakika.
- source_word: σῴζεται
  choice: anaokolewa
  rationale: Kitenzi cha sasa katika hali ya kutendwa kinahifadhiwa kwa “anaokolewa”; katika muktadha huu kinaweza kueleza wokovu unaopatikana katikati ya majaribu makali.
- source_word: ἀσεβής
  choice: yule asiyemcha Mungu
  rationale: Kauli hii huwasilisha maana ya mtu asiye na uchaji kwa Mungu kwa lugha ya kawaida na ya kibiblia, bila kuichanganya na “mwenye dhambi.”
- source_word: ἁμαρτωλός
  choice: mwenye dhambi
  rationale: Ni tafsiri ya kawaida inayobaki tofauti na ἀσεβής, kama ilivyo katika Kigiriki.
- source_word: ποῦ
  choice: wapi
  rationale: Huhifadhi swali la mahali na nguvu yake ya balagha kwa Kiswahili cha kawaida.
- source_word: φανεῖται
  choice: ataonekana
  rationale: Huhifadhi maana ya moja kwa moja ya wakati ujao, “ataonekana,” pamoja na mwangwi wa mtindo wa kimethali; “atapatikana” ni uwezekano mwingine.
theological_decisions:
- issue: Maana ya μόλις σῴζεται
  choice: Maneno yanaonyesha ugumu na mateso yanayoambatana na kuokolewa kwa mwenye haki katika muktadha wa hukumu na majaribu.
  alternative: Kuelewa kwamba wokovu wa mwisho wa mwenye haki hauna uhakika na hupatikana kwa bahati ndogo tu.
  rationale: Muktadha wa 1 Petro 4 unahusu mateso, hukumu inayoanzia katika nyumba ya Mungu, na kuvumilia. Tafsiri “anaokolewa kwa shida” huhifadhi mvutano wa maandiko bila kuamua kimadhehebu kuhusu uhakika wa wokovu.
- issue: Umoja wa kiwakilishi wa ὁ δίκαιος
  choice: mwenye haki
  alternative: watu wenye haki
  rationale: Kigiriki kina umoja wa kiume wenye maana ya kiwakilishi. Umoja umehifadhiwa ili kudumisha muundo mfupi wa kimethali bila kuubadili kuwa wingi.
- issue: Tofauti kati ya ἀσεβής na ἁμαρτωλός
  choice: yule asiyemcha Mungu na mwenye dhambi
  alternative: waovu
  rationale: Maneno mawili tofauti katika chanzo yamehifadhiwa badala ya kuunganishwa kuwa sifa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na umoja wa kiwakilishi umehifadhiwa.
