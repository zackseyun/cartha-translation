  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: sw
  text: Lakini ikiwa anateseka kwa kuwa Mkristo, asione aibu; bali amtukuze Mungu katika jina hilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika jambo hili” au “kwa sababu ya jina hilo.” Kigiriki kinasema “katika jina hilo,” huenda kikirejelea jina “Mkristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Inawakilisha sharti la εἰ pamoja na utofautishaji wa kiasi wa δέ kwa Kiswahili cha kawaida.
- source_word: ὡς Χριστιανός
  choice: kwa kuwa Mkristo
  rationale: Χριστιανός ni jina lililozoeleka la mfuasi wa Kristo. Katika Kiswahili, ‘kwa kuwa Mkristo’ huonyesha kwa kawaida kwamba mateso yanahusiana na kutambulika kwake kama Mkristo.
- source_word: μὴ αἰσχυνέσθω
  choice: asione aibu
  rationale: Kauli hii inadumisha nguvu ya amri ya nafsi ya tatu na ni ya asili katika Kiswahili cha sasa.
- source_word: δοξαζέτω δὲ
  choice: bali amtukuze
  rationale: ‘Bali’ inaonyesha wazi utofauti kati ya kuona aibu na kumtukuza Mungu; ‘amtukuze’ inadumisha nguvu ya amri.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya kitenzi δοξαζέτω na imetafsiriwa moja kwa moja.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: katika jina hilo
  rationale: Tafsiri hii inadumisha neno ‘jina’ na uhusiano wake na jina ‘Mkristo,’ bila kuamua kimya kimya kama maana ni ‘kwa sababu ya jina hilo’ au ‘katika jambo hili.’
- source_word: implicit verb from context (πάσχει)
  choice: anateseka
  rationale: Kitenzi hakirudiwi katika kifungu hiki cha Kigiriki, lakini kinaeleweka kutoka mstari uliotangulia. Kiswahili kinahitaji kukitaja ili sentensi iwe wazi na ya asili.
theological_decisions:
- issue: Maana ya ἐν τῷ ὀνόματι τούτῳ
  choice: Maneno ‘katika jina hilo’ yanadumishwa, yakielekea kurejelea jina ‘Mkristo.’
  alternative: ‘Kwa sababu ya jina hilo’ au ‘katika jambo hili.’
  rationale: Χριστιανός ndilo rejeleo la karibu, na ὄνομα kwa kawaida humaanisha jina au utambulisho. Hata hivyo, matumizi ya ἐν yanaweza kueleweka kwa njia zaidi ya moja, kwa hiyo tanbihi inadumisha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Kitenzi ‘anateseka’ kimewekwa wazi kutokana na muktadha ili kuepuka sentensi isiyo ya asili katika Kiswahili; kiunganishi cha tanbihi kinadumisha utata halisi wa kirai cha mwisho.
