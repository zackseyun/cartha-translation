id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: sw
  text: Kwa maana wakati umefika wa hukumu kuanza na watu wa nyumbani mwa Mungu[a]; na ikiwa inaanza kwanza na sisi, mwisho[b] wa wale wasiotii[c] Habari Njema ya Mungu utakuwaje?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyumba ya Mungu.” Neno la Kigiriki linaweza kumaanisha nyumba au watu wa nyumba; hapa yaelekea linawarejelea watu wa Mungu kama watu wa nyumbani mwake.
    reason: lexical_alternative
  - marker: b
    text: Au “matokeo.” Neno la Kigiriki linaweza kumaanisha mwisho, matokeo, au tokeo la mwisho.
    reason: lexical_alternative
  - marker: c
    text: “Wale wasiotii” pia yaweza kutafsiriwa “wale wanaokataa kuamini,” kwa kuwa kitenzi cha Kigiriki kinaweza kuonyesha kutotii na kutokuamini katika kuitikia Habari Njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linatoa sababu ya kauli iliyotangulia; “Kwa maana” ni kiunganishi cha kisababisho kilicho cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ὁ καιρός
  choice: wakati umefika
  rationale: καιρός humaanisha wakati ufaao au uliowekwa, si muda wa kawaida tu. Kauli “wakati umefika” inaeleza kwa kawaida kwamba muda huo maalumu sasa umewadia.
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: wa hukumu kuanza
  rationale: Muundo huu unaonyesha kwamba huu ndio wakati wa kuanza kwa hukumu. “Hukumu” huhifadhi upana wa κρίμα bila kuibana kuwa adhabu ya mwisho au nidhamu pekee.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: na watu wa nyumbani mwa Mungu
  rationale: ἀπό katika muktadha wa kitenzi “kuanza” hutafsiriwa kwa kawaida kwa “kuanza na.” “Watu wa nyumbani mwa Mungu” huonyesha kwamba οἶκος inawarejelea watu wa Mungu, huku tanbihi ikihifadhi maana mbadala ya “nyumba.”
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: na ikiwa inaanza kwanza na sisi
  rationale: Kitenzi “inaanza” kimerudiwa kwa uwazi kutoka kishazi kilichotangulia. “Na” linaonyesha muunganiko mwepesi wa δέ, na “na sisi” linaendeleza wazo la hukumu kuanza kwa kundi fulani.
- source_word: τέλος
  choice: mwisho
  rationale: “Mwisho” ni neno la kawaida linaloweza kumaanisha kikomo au matokeo ya mwisho, hivyo huhifadhi upana wa τέλος na uzito wa swali la balagha.
- source_word: ἀπειθούντων
  choice: wale wasiotii
  rationale: Ushiriki huu unaweza kuhusisha kutotii na kukataa kuamini. “Wale wasiotii” huhifadhi nguvu ya tendo na uhusiano wake na Habari Njema; maana nyingine imeonyeshwa katika tanbihi.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: Habari Njema ya Mungu
  rationale: Hii ni lugha ya sasa na iliyo wazi kwa εὐαγγέλιον, huku “ya Mungu” ikihifadhi uwezekano wa Habari Njema kuwa ya Mungu au kutoka kwake.
theological_decisions:
- issue: Asili ya κρίμα kwa watu wa Mungu
  choice: hukumu
  alternative: adhabu; nidhamu
  rationale: “Hukumu” haisemi kwamba watu wa Mungu wanahukumiwa adhabu ya mwisho, wala haipunguzi uzito wa tendo hilo kuwa nidhamu tu. Inahifadhi mvutano wa andiko kwamba utendaji wa Mungu wa kuhukumu huanza kwa watu wake.
- issue: Kirejelewa cha οἶκος τοῦ θεοῦ
  choice: watu wa nyumbani mwa Mungu
  alternative: nyumba au hekalu la Mungu
  rationale: Muktadha wa 1 Petro na maneno yanayofuata “na sisi” yanaonyesha jumuiya ya watu wa Mungu badala ya jengo. Tafsiri kuu huweka hilo wazi, huku tanbihi ikihifadhi maana halisi inayowezekana ya “nyumba.”
- issue: Kutotii Habari Njema na kutokuamini
  choice: wale wasiotii
  alternative: wale wanaokataa kuamini
  rationale: Kitenzi cha Kigiriki kinaweza kuunganisha kutotii na kutokuamini. Tafsiri kuu haibadili dhana hiyo kuwa imani ya kiakili tu, na tanbihi inaonyesha upande wa kukataa kuamini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wazi na wenye hadhi. “Habari Njema” linaeleweka kwa urahisi kuliko istilahi ya pekee bila kupoteza maana ya εὐαγγέλιον. Muundo wa swali la mwisho umehifadhiwa ili kudumisha nguvu ya balagha ya asili.
