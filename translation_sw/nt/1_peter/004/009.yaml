lexical_decisions:
- source_word: φιλόξενοι
  choice: Mkaribishane
  rationale: Kivumishi cha Kigiriki kinatumika kama agizo katika muktadha. ‘Mkaribishane’ ni Kiswahili cha asili kinachowasilisha tendo la kuonyeshana ukarimu na kupokea wageni, huku kikilingana na wazo la uelekeo wa kila mmoja kwa mwenzake.
- source_word: εἰς ἀλλήλους
  choice: -shane (katika ‘Mkaribishane’)
  rationale: Kiambishi cha kutendeana ‘-shane’ kinawasilisha kwa kawaida maana ya kila mmoja kumtendea mwenzake, bila kulazimisha kirai kizito ‘kwa ninyi kwa ninyi.’
- source_word: ἄνευ
  choice: bila
  rationale: Hii ndiyo njia ya kawaida na wazi ya kuonyesha kutokuwapo kwa jambo katika Kiswahili.
- source_word: γογγυσμοῦ
  choice: kunung’unika
  rationale: Neno hili linaonyesha maneno ya kutoridhika au malalamiko ya chini kwa chini katika mazingira ya jumuiya. Ni la asili na lenye maana mahususi zaidi kuliko ‘kulalamika.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kutendeana umechaguliwa ili kuwasilisha kwa ufupi na kwa kawaida maana ya εἰς ἀλλήλους; tanbihi inadumisha njia mbadala iliyo wazi zaidi.
