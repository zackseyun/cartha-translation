  text: Be hospitable to one another without grumbling[a].
translation:
  language: sw
  text: Mkaribishane bila kunung’unika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Onyeshaneni ukarimu bila kulalamika.”
