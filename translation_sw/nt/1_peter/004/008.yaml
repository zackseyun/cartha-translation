id: 1PE.4.8
reference: 1 Peter 4:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: sw
  text: Zaidi ya yote, dumisheni upendo wa dhati[a] kati yenu[c], kwa sababu upendo hufunika[b] wingi wa dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wa kina.”
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yana mwangwi wa Mithali 10:12. “Hufunika” pia linaweza kueleweka kuwa kutoyasisitiza au kutoyachochea makosa.
    reason: cross_reference
  - marker: c
    text: Au, “mkiwa na upendo wa dhati kati yenu.”
    reason: source_structure_alternative
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Zaidi ya yote
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kipaumbele kikuu, wala si mfuatano wa wakati tu.
- source_word: εἰς ἑαυτοὺς
  choice: kati yenu
  rationale: Katika muktadha huu wa jumuiya, kirai hiki cha kujirejelea kinaonyesha upendo wa pande zote miongoni mwa waamini.
- source_word: ἀγάπην
  choice: upendo
  rationale: Hili ndilo neno la kawaida na linalofaa kimuktadha kwa ἀγάπη.
- source_word: ἐκτενῆ
  choice: wa dhati
  rationale: Kivumishi hiki hubeba wazo la kitu kilichonyoshwa kwa nguvu, na hivyo upendo wenye bidii, kina, na ustahimilivu. “Wa dhati” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ἔχοντες
  choice: dumisheni
  rationale: Ingawa kimuundo ni kitenzi-shirikishi cha wakati uliopo, hapa kinaendeleza mfululizo wa mawaidha kutoka mstari uliotangulia. “Dumisheni” huwasilisha wito wa kuendelea kuwa na upendo kwa Kiswahili cha kawaida.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huanzisha sababu ya himizo lililotangulia na huonyesha wazi uhusiano wa kisababu.
- source_word: καλύπτει
  choice: hufunika
  rationale: Huhifadhi sitiari ya Kigiriki na mwangwi wa Mithali 10:12 bila kuamua kimya-kimya kama maana ni kusamehe, kutoyasisitiza makosa, au kuyaficha.
- source_word: πλῆθος
  choice: wingi
  rationale: Huhifadhi maana ya jumla ya idadi kubwa na uzito wa usemi kuliko paraphrase rahisi ya “nyingi” pekee.
- source_word: ἁμαρτιῶν
  choice: wa dhambi
  rationale: Ni kijalizo cha kawaida cha umilikaji kinachowasilisha maana ya ἁμαρτιῶν bila kuipunguza kuwa aina fulani ya makosa.
theological_decisions:
- issue: Maana ya “upendo hufunika wingi wa dhambi”
  choice: Kudumisha sitiari “hufunika” bila kubainisha dhambi hizo ni za nani wala namna hasa upendo unavyozifunika.
  alternative: “Upendo huyapuuza makosa mengi” au “upendo huleta msamaha wa dhambi nyingi.”
  rationale: Usemi huu ni wa kimithali na una mwangwi wa Mithali 10:12. Kigiriki hakilazimishi fasiri moja ya kimafundisho; sitiari inaacha mvutano halisi kati ya kutoyachochea makosa, kuyaficha, na msamaha bila kuingiza wazo la kustahili wokovu au fundisho jingine lisilo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dumisheni” hutoa nguvu ya himizo kwa namna ya kawaida, huku tanbihi ikihifadhi muundo wa karibu zaidi na kitenzi-shirikishi cha Kigiriki. Sitiari “hufunika” imeachwa wazi kwa makusudi.
