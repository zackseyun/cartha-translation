  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: sw
  text: Kuhusu wokovu huu, manabii waliotabiri kuhusu neema kwa ajili yenu[a] walitafuta kwa bidii na wakachunguza kwa makini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neema ambayo ingewajia.” Maana ya wakati ujao mara nyingi hueleweka kutokana na muktadha, ingawa haijasemwa wazi katika mstari huu.
    reason: alternative_reading
  - marker: b
    text: 'Au kwa mpangilio huu: “Kuhusu wokovu huu, walitafuta kwa bidii na wakachunguza kwa makini manabii waliotabiri kuhusu neema kwa ajili yenu.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Kuhusu wokovu huu
  rationale: περί pamoja na hali ya umilikishi huanzisha mada, ‘kuhusu.’ Kiwakilishi ἧς kinarejelea wokovu uliotajwa katika muktadha uliotangulia; ‘huu’ ni ya asili zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ‘ambao.’
- source_word: σωτηρίας
  choice: wokovu
  rationale: Katika muktadha huu σωτηρία hubeba maana pana ya tendo la Mungu la kuokoa; ‘wokovu’ huhifadhi uzito huo wa kitheolojia na mwendelezo wa kifungu.
- source_word: ἐξεζήτησαν
  choice: walitafuta kwa bidii
  rationale: Kitenzi ἐκζητέω kinaonyesha kutafuta kwa juhudi au kwa makini. ‘Kwa bidii’ huonyesha nguvu hiyo bila kukifanya kifungu kuwa kizito.
- source_word: ἐξηραύνησαν
  choice: kuchunguza kwa makini
  rationale: ἐξεραυνάω humaanisha kuchunguza au kutafuta kwa undani. Tafsiri tofauti na ya ἐξεζήτησαν huhifadhi msisitizo wa vitenzi viwili vinavyofuatana.
- source_word: προφῆται
  choice: manabii
  rationale: Neno linawataja manabii, na kirai cha kishiriki kinachofuata kinabainisha ni manabii gani wanaozungumziwa.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: waliotabiri juu ya neema kwa ajili yenu
  rationale: Kirai cha kishiriki kinawafafanua manabii. περί huonyesha yaliyokuwa maudhui ya unabii, na εἰς ὑμᾶς inaeleza mwelekeo au manufaa ya neema kwa wasomaji bila kuongeza wazi wazo la wakati ujao.
- source_word: χάριτος
  choice: neema
  rationale: Katika muktadha huu χάρις ni fadhili ya Mungu inayohusiana na wokovu; ‘neema’ ni neno la kawaida, linaloeleweka, na lenye uzito unaofaa.
- source_word: εἰς ὑμᾶς
  choice: kwa ajili yenu
  rationale: Kirai hiki huhifadhi maana ya neema inayowaelekea na kuwanufaisha wasomaji. ‘Kwa ajili yenu’ ni Kiswahili cha kawaida katika muundo huu.
theological_decisions:
- issue: Kama kueleza wazi kwamba neema ilikuwa bado itakuja
  choice: neema kwa ajili yenu
  alternative: neema ambayo ingewajia
  rationale: Mwelekeo wa wakati ujao unaweza kueleweka kutokana na muktadha na kazi ya manabii, lakini mstari huu wenyewe hauna kitenzi au kishiriki kinachosema wazi ‘itakayokuja.’ Matini kuu kwa hiyo haiongezi wazo hilo, nalo linawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi huhifadhi mada iliyotangulizwa na vitenzi viwili vya Kigiriki huku ukibaki wa asili katika Kiswahili.
