source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: sw
  text: 'Kwa hiyo, mkiwa mmefunga viuno vya akili zenu[a] na mkiwa na akili timamu, wekeni tumaini lenu kikamilifu[b] katika neema mnayoletewa katika kufunuliwa kwa Yesu Masihi.[c]


    [a] Kwa maana halisi, “mkiwa mmefunga viuno vya akili zenu”; yaani, mkiwa mmeandaa akili zenu kwa ajili ya kutenda.


    [b] Au, “na mkiwa na akili timamu kabisa, wekeni tumaini lenu katika neema mnayoletewa.” Kielezi cha Kigiriki kinaweza kuhusishwa ama na kuwa na akili timamu ama na kuweka tumaini kikamilifu.


    [c] Kigiriki, “Yesu Kristo.” Neno “Kristo” ni jina la cheo lenye maana ya “Masihi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mkiwa mmefunga viuno vya akili zenu”; yaani, mkiwa mmeandaa akili zenu kwa ajili ya kutenda.
    reason: lexical_alternative
  - marker: b
    text: Au, “na mkiwa na akili timamu kabisa, wekeni tumaini lenu katika neema mnayoletewa.” Kielezi cha Kigiriki kinaweza kuhusishwa ama na kuwa na akili timamu ama na kuweka tumaini kikamilifu.
    reason: alternative_reading
  - marker: c
    text: Kigiriki, “Yesu Kristo.” Neno “Kristo” ni jina la cheo lenye maana ya “Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia, kwa lugha ya kawaida na yenye heshima.
- source_word: ἀναζωσάμενοι
  choice: mkiwa mmefunga
  rationale: Huhifadhi sitiari ya kufunga mavazi kiunoni ili kuwa tayari kutenda, pamoja na hali ya tendo lililotangulia amri kuu.
- source_word: τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: viuno vya akili zenu
  rationale: Huhifadhi taswira ya kushangaza ya Kigiriki; maana yake ya kuandaa akili kwa tendo imefafanuliwa katika tanbihi.
- source_word: νήφοντες
  choice: mkiwa na akili timamu
  rationale: Katika muktadha huu neno linahusu utulivu na uwazi wa akili, si hasa kujiepusha na ulevi.
- source_word: τελείως
  choice: kikamilifu
  rationale: Katika matini kuu limehusishwa na amri ya kuweka tumaini, huku uwezekano wa kulihusisha na kuwa na akili timamu ukihifadhiwa katika tanbihi.
- source_word: ἐλπίσατε
  choice: wekeni tumaini lenu
  rationale: Huonyesha amri ya kuelekeza tumaini kwa uamuzi, badala ya kueleza tu hali ya kutumaini.
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: katika neema mnayoletewa
  rationale: Huhifadhi hali endelevu ya kauli tendwa ya φερομένην bila kuigeuza moja kwa moja kuwa wakati ujao.
- source_word: ἐν ἀποκαλύψει
  choice: wakati ... atakapofunuliwa
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya wakati inayotawala katika kishazi hiki.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa linasikika kama jina la cheo; “Masihi” huhifadhi maana hiyo wazi kwa Kiswahili.
theological_decisions:
- issue: Kuhifadhi sitiari ya kufunga viuno vya akili
  choice: Sitiari imehifadhiwa katika matini kuu na kufafanuliwa katika tanbihi.
  alternative: andaeni akili zenu kwa ajili ya kutenda
  rationale: Taswira ya chanzo ni yenye nguvu na inaeleweka kwa msaada mfupi wa tanbihi; kuibadili kabisa kungeondoa umbo la usemi wa Kigiriki.
- issue: Neno τελείως linahusishwa na sehemu gani ya sentensi
  choice: Katika matini kuu linahusishwa na “wekeni tumaini lenu.”
  alternative: na mkiwa na akili timamu kabisa
  rationale: Mpangilio wa Kigiriki unaruhusu usikivu wa aina zote mbili. Chaguo moja linahitajika kwa Kiswahili fasaha, lakini utata wa kweli umehifadhiwa katika tanbihi.
- issue: Jinsi ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha wa kufunuliwa kwake, neno hilo bado lina nguvu ya jina la cheo; “Masihi” hulifanya hilo lisikike bila kuongeza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka. Sitiari ya asili imehifadhiwa bila kufanya sentensi kuwa ya kizamani; tanbihi zinaeleza taswira, utata wa kisarufi, na jina la cheo “Masihi.”
