translation:
  language: sw
  text: Kama watoto wa utii[a], msiishi mkifuata tamaa mlizokuwa nazo zamani katika ujinga wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto watiifu.” Kigiriki kinasema kihalisi, “watoto wa utii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Kama
  rationale: Hutambulisha hali au utambulisho ambao kwa huo wasomaji wanapaswa kuitikia wito huu; “Kama” ni ya kawaida na inafaa katika himizo.
- source_word: τέκνα ὑπακοῆς
  choice: watoto wa utii
  rationale: Muundo wa nomino mbili umehifadhiwa ili kuonyesha utambulisho unaotawaliwa na utii, ingawa “watoto watiifu” ni Kiswahili laini zaidi.
- source_word: μὴ συσχηματιζόμενοι
  choice: msijifananishe
  rationale: Katika muktadha huu wa himizo, kauli hii ina nguvu ya katazo linaloendelea na inaonyesha wajibu wa wasomaji kutokubali maisha yao yaumbwe kwa mfano wa tamaa hizo.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: na tamaa
  rationale: “Tamaa” linafikisha maana ya matamanio yenye nguvu na yasiyofaa katika muktadha huu bila kuifunga maana kwenye dhambi za kingono pekee.
- source_word: πρότερον
  choice: mlizokuwa nazo zamani
  rationale: Kirai hiki kinaonyesha kuwa tamaa hizo zilihusika na maisha yao ya awali; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: katika ujinga wenu
  rationale: Tafsiri hii ya moja kwa moja huhifadhi hali yao ya awali ya kutokuwa na ujuzi bila kuongeza ufafanuzi wa kiteolojia ambao mstari wenyewe hautamki wazi.
theological_decisions:
- issue: Iwapo muundo τέκνα ὑπακοῆς ulainishwe kuwa kivumishi
  choice: watoto wa utii
  alternative: watoto watiifu
  rationale: Muundo halisi umehifadhiwa ili kubakiza mkazo wa utambulisho unaotambulishwa na utii, huku tanbihi ikitoa Kiswahili cha kawaida zaidi bila kuondoa mvutano wa usemi wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Watoto wa utii” si usemi wa kawaida sana, lakini umehifadhiwa kwa makusudi ili kuonyesha muundo na mkazo wa Kigiriki; tanbihi inatoa usemi laini zaidi.
