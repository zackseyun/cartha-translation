  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: sw
  text: mkijua kwamba mlikombolewa[a] kutoka katika mwenendo wenu usio na maana mliourithi kutoka kwa baba zenu[b], si kwa vitu vinavyoharibika kama fedha au dhahabu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlilipiwa fidia ili kuwekwa huru.” Kitenzi cha Kigiriki kina wazo la kuachiliwa kwa malipo.
    reason: lexical_alternative
  - marker: b
    text: Au, “mliopokezewa kutoka kwa mababu zenu.” Kihalisi, “uliopokezwa kutoka kwa baba zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: mkijua
  rationale: Huhifadhi umbo la kirai tegemezi la Kigiriki na uhusiano wake na himizo linalozunguka mstari huu.
- source_word: ἐλυτρώθητε
  choice: mlikombolewa
  rationale: Kitenzi hiki kina maana ya kuachiliwa kwa kulipiwa fidia. ‘Mlikombolewa’ ni Kiswahili cha kawaida chenye uzito wa kibiblia, bila kufafanua kupita kiasi namna ya ukombozi katika kishazi hiki.
- source_word: φθαρτοῖς
  choice: vitu vinavyoharibika
  rationale: Kivumishi kimetumiwa kama nomino na kinaonyesha vitu visivyodumu, kwa kulinganisha na thamani isiyoharibika katika mstari unaofuata.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: kama fedha au dhahabu
  rationale: Fedha na dhahabu ni mifano ya vitu vinavyoharibika; ‘kama’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἐκ
  choice: kutoka katika
  rationale: Huonyesha kutolewa au kutengwa na hali ya awali, yaani mwenendo wao wa zamani.
- source_word: ματαίας
  choice: usio na maana
  rationale: Huwasilisha wazo la ubatili, utupu, au kutokuwa na matokeo kwa lugha inayoeleweka kwa urahisi.
- source_word: ἀναστροφῆς
  choice: mwenendo
  rationale: Katika muktadha huu neno linahusu namna ya kuishi na tabia ya mtu; ‘mwenendo’ ni fasaha na pana vya kutosha.
- source_word: πατροπαραδότου
  choice: mlioachiwa na baba zenu
  rationale: Huhifadhi wazo la kitu kilichopokezwa kutoka kwa waliotangulia pamoja na lugha ya Kigiriki inayowataja ‘baba.’
theological_decisions:
- issue: Lugha ya mapokeo yaliyopokezwa
  choice: mlioachiwa na baba zenu
  alternative: mliorithi kutoka kwa mababu zenu
  rationale: Tafsiri kuu huhifadhi rejeo la wazi kwa ‘baba’ na tendo la kupokezwa, huku tanbihi ikionyesha maana pana inayoweza kuwahusu mababu au wahenga.
- issue: Istilahi ya ukombozi
  choice: mlikombolewa
  alternative: mlilipiwa fidia ili kuwekwa huru
  rationale: ‘Mlikombolewa’ huhifadhi mwangwi mpana wa kibiblia, huku tanbihi ikifafanua picha ya kuachiliwa kwa malipo bila kuingiza maelezo ya kimafundisho yasiyotajwa katika kishazi hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa kawaida kwa Kiswahili huku uhusiano wa ukombozi, mwenendo wa zamani, na tofauti ya fedha na dhahabu ukihifadhiwa.
