  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: sw
  text: kwa maana imeandikwa[a], “Mtakuwa watakatifu, kwa sababu mimi ni mtakatifu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa namna ya moja kwa moja zaidi kama amri, “Iweni watakatifu.” Kigiriki kinafuata maneno ya nukuu ya Maandiko kwa kutumia umbo la wakati ujao, “Mtakuwa watakatifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: kwa maana
  rationale: Inaonyesha sababu ya himizo lililotangulia na ni kiunganishi cha kawaida, chenye hadhi, katika Kiswahili.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Ni kauli ya kawaida ya kutambulisha nukuu ya Maandiko na inadumisha wazo la jambo lililoandikwa lenye mamlaka inayoendelea.
- source_word: ὅτι (ya kwanza)
  choice: alama za kunukuu
  rationale: Hutambulisha nukuu; katika Kiswahili cha kawaida haihitaji kutafsiriwa kwa neno tofauti kabla ya nukuu ya moja kwa moja.
- source_word: Ἅγιοι
  choice: watakatifu
  rationale: Huwasilisha utakatifu katika muktadha wa kimaadili na wa agano, si kutengwa pekee.
- source_word: ἔσεσθε
  choice: mtakuwa
  rationale: Inahifadhi umbo la wakati ujao la Kigiriki na pia huacha wazi nguvu yake ya kuamuru katika mtindo wa nukuu ya Maandiko.
- source_word: ὅτι (ya pili)
  choice: kwa sababu
  rationale: Inaonyesha wazi kuwa utakatifu wa Mungu ndio msingi wa wito wa kuwa watakatifu.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kinadumishwa ili kuhifadhi msisitizo wa Mungu kujitaja mwenyewe.
- source_word: ἅγιος
  choice: mtakatifu
  rationale: Kinadumisha ulinganifu wa msamiati kati ya utakatifu wa watu na utakatifu wa Mungu.
theological_decisions:
- issue: Nguvu ya ἔσεσθε ya wakati ujao katika nukuu kuhusu utakatifu
  choice: Mtakuwa watakatifu
  alternative: Iweni watakatifu; mtakuwa watakatifu kama utabiri tu
  rationale: “Mtakuwa” huhifadhi umbo la wakati ujao katika Kigiriki, ambalo katika mtindo wa kisheria na wa kuhimiza wa Maandiko linaweza kuwa na nguvu ya amri. Tanbihi inaeleza maana hiyo bila kuondoa mvutano wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Kwa maana” linaunganisha mstari huu kwa kawaida na himizo lililotangulia, huku “mtakuwa” likihifadhi umbo na mvutano wa nukuu ya Kigiriki.
