  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: sw
  text: kulingana na ujuzi wa tangu awali wa Mungu Baba[b], katika utakaso wa Roho, kwa ajili ya utii na kunyunyiza kwa damu[c] ya Yesu Masihi[a]. Neema na amani ziongezwe kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutumiwa kama cheo au kwa namna inayokaribia jina; hapa limetafsiriwa “Masihi” ili kuhifadhi maana yake kama cheo.
    reason: alternative_reading
  - marker: b
    text: “Ujuzi wa tangu awali” hutafsiri neno πρόγνωσις. Wafafanuzi hutofautiana kuhusu kama hapa linasisitiza Mungu kujua mapema, kuchagua mapema, au mambo yote mawili.
    reason: lexical_alternative
  - marker: c
    text: Maneno “kunyunyiza kwa damu” huenda yanarejelea picha za agano na utakaso katika Agano la Kale, hasa Kutoka 24:8.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: kulingana na ujuzi ... wa tangu awali
  rationale: «Kulingana na» huonyesha kanuni au ulinganifu unaoletwa na κατά; «ujuzi wa tangu awali» huhifadhi maana ya msingi ya πρόγνωσις bila kuamua kama neno hilo linasisitiza kujua mapema, kuchagua mapema, au yote mawili.
- source_word: θεοῦ πατρός
  choice: wa Mungu Baba
  rationale: Hutambulisha mwenye ujuzi huo wa tangu awali kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: katika utakaso wa Roho
  rationale: «Utakaso» huhifadhi nomino ἁγιασμός, na «wa Roho» hubaki karibu na muundo wa Kigiriki kuliko ufafanuzi mpana kama «kwa kazi ya Roho ya kuwatakasa».
- source_word: εἰς ὑπακοὴν
  choice: kwa ajili ya kutii
  rationale: Huwasilisha kusudi au matokeo yanayoweza kuonyeshwa na εἰς kwa lugha ya kawaida.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: na kunyunyiziwa kwa damu
  rationale: Hutoa picha halisi ya kunyunyiza damu huku ikitumia muundo wa Kiswahili unaoeleweka na kuhifadhi mwangwi wa agano na utakaso.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ya Yesu Masihi
  rationale: «Masihi» huhifadhi nguvu ya Χριστός kama cheo; katika muundo huu wa Kiswahili hakuna haja ya kuongeza kibainishi kinacholingana na «the» ya Kiingereza.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Neema na amani na ziongezwe kwenu
  rationale: Huhifadhi baraka au ombi linaloonyeshwa na hali ya optative ya πληθυνθείη na picha yake ya kuongezeka.
theological_decisions:
- issue: Maana ya πρόγνωσις kuhusiana na uteuzi
  choice: ujuzi wa tangu awali
  alternative: uchaguzi wa tangu awali; kuamuliwa tangu awali
  rationale: Tafsiri haipanui neno hilo kuwa mfumo fulani wa kiteolojia, bali huhifadhi mvutano kati ya kujua mapema na kusudi au uchaguzi wa Mungu.
- issue: Mhusika anayeonyeshwa na πνεύματος
  choice: Roho
  alternative: roho ya mwanadamu au maana isiyo ya nafsi
  rationale: Muundo wa utatu unaotaja Mungu Baba, Roho, na Yesu Masihi unaunga mkono kuelewa kuwa huyu ni Roho Mtakatifu; herufi kubwa huonyesha jambo hilo bila kuongeza neno lisilopo.
- issue: Nguvu ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Cheo «Masihi» huonyesha wazi maana ya Χριστός katika muktadha huu, badala ya kukifanya kiwe jina tu.
- issue: Uhusiano wa ἁγιασμός na πνεῦμα
  choice: utakaso wa Roho
  alternative: kutakaswa na Roho
  rationale: Muundo wa nomino umehifadhiwa ili kutofanya uhusiano wa kisarufi kuwa wazi zaidi kuliko Kigiriki, ingawa muktadha unaelekea kuonyesha kazi ya Roho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka. Muundo wa kifungu umewekwa karibu na Kigiriki, lakini viunganishi na ngeli zimeundwa kwa matumizi ya kawaida ya Kiswahili. Alama za tanbihi zimehamishwa kwenye maneno yanayohusika moja kwa moja ili kila tanbihi ilingane na mada yake.
