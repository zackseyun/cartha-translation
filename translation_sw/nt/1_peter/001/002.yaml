  verdict: revise
  source_fidelity: 'The draft accurately reflects the Greek sequence and its triadic structure: God''s foreknowledge, the Spirit''s sanctification, and Jesus the Messiah''s blood. However, «kwa ajili ya kutii» uses an infinitive (‘to obey’) where ὑπακοή is the noun ‘obedience,’ and «kunyunyiziwa» is passive (‘to be sprinkled’) rather than the noun/action ‘sprinkling.’ The revision retains the source''s concise and somewhat open genitival phrasing while using natural Swahili.'
  naturalness: «Neema na amani na ziongezwe kwenu» is understandable but has an unnecessary repeated conjunction. «Neema na amani ziongezwe kwenu» is smoother. Moving «wa tangu awali» directly after «ujuzi» prevents it from sounding as though it modifies «Mungu Baba.»
  terminology: «Mungu Baba,» «Roho,» «utakaso,» and «Masihi» are suitable Standard East African Swahili renderings. «Masihi» appropriately retains Χριστός as a title. «Ujuzi wa tangu awali» preserves the debated force of πρόγνωσις without imposing foreordination or mere prescience.
  issues:
  - severity: medium
    issue: «kutii» renders the noun ὑπακοή with an infinitive.
    rationale: The Greek has ‘for obedience,’ not explicitly ‘for obeying.’ «kwa ajili ya utii» preserves the nominal form and works idiomatically in Swahili.
  - severity: medium
    issue: «kunyunyiziwa kwa damu» is a passive infinitive construction.
    rationale: It means ‘to be sprinkled with blood,’ whereas ῥαντισμός is the noun ‘sprinkling.’ «kunyunyiza kwa damu» keeps the action noun sense without specifying an agent beyond the Greek.
  - severity: low
    issue: Placement of «wa tangu awali» permits avoidable attachment ambiguity, and the blessing has a redundant conjunction.
    rationale: Placing the phrase after «ujuzi» clearly modifies foreknowledge; omitting the second «na» gives idiomatic Swahili without changing the optative blessing.
