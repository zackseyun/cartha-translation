  text: huku mkipokea matokeo ya imani yenu[a], yaani wokovu wa nafsi zenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwisho,” “lengo,” au “tokeo” la imani yenu.
    reason: lexical_alternative
  - marker: b
    text: Au “wokovu wa maisha yenu” au “wokovu wenu wenyewe.” Neno la Kigiriki linaweza kumaanisha “nafsi,” “maisha,” au “ninyi wenyewe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: huku mkipokea
  rationale: Muundo huu unaonyesha tendo linaloendelea na kuunganisha mstari huu na sentensi iliyotangulia, kama ilivyo kwa hali ya kushiriki ya Kigiriki, bila kulazimisha tofauti ya kauli ambayo si muhimu hapa.
- source_word: τέλος
  choice: matokeo
  rationale: Katika muktadha huu neno linaonyesha kile ambacho imani inafikia au kuleta. “Matokeo” ni ya asili katika Kiswahili na hayaelekezi tu mwisho wa wakati.
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ndilo neno la kawaida na linalofaa hapa kwa mwitikio wa waamini wa kumwamini Mungu; muktadha haulazimishi maana ya “uaminifu.”
- source_word: ὑμῶν
  choice: yenu
  rationale: Kiwakilishi hiki kimetafsiriwa moja kwa moja kama umilikishi wa nafsi ya pili wingi na kimeunganishwa na “imani.”
- source_word: σωτηρίαν
  choice: wokovu
  rationale: “Wokovu” linahifadhi maana ya kuokolewa katika muktadha wa waraka huu na mwendelezo wake wa kitheolojia.
- source_word: ψυχῶν
  choice: nafsi
  rationale: “Nafsi” ni tafsiri ya moja kwa moja na inayotambulika ya ψυχή hapa, huku tanbihi ikihifadhi uwezekano wa maana ya “maisha” au “watu wenyewe” bila kuingiza mgawanyo mkali wa mwili na nafsi.
theological_decisions:
- issue: Maana ya πίστις katika kirai “imani yenu”
  choice: imani
  alternative: kumtumaini; uaminifu
  rationale: Kirai hiki kwa kawaida kinaelekea kwenye imani ya wasomaji. “Imani” huhifadhi istilahi pana ya maandiko bila kuamua kuwa hapa lazima iwe tendo la kutumaini au sifa ya uaminifu.
- issue: Maana ya ψυχαί katika “wokovu wa nafsi zenu”
  choice: nafsi
  alternative: maisha; ninyi wenyewe
  rationale: Tafsiri hii inafuata kwa karibu maneno ya Kigiriki lakini haidai kwamba wokovu ni wa sehemu isiyo ya mwili pekee. Tanbihi inahifadhi upana wa maana ya neno la asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Huku mkipokea” hudumisha uhusiano wa kisarufi na mstari uliotangulia; “yaani” huonyesha kwamba “wokovu wa nafsi zenu” unafafanua “matokeo” bila kuongeza dai jipya.
