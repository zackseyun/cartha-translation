  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: sw
  text: ili uhalisi uliothibitishwa wa imani yenu—ulio wa thamani kubwa kuliko dhahabu iharibikayo, ijapokuwa hujaribiwa kwa moto—uonekane kuwa wa kuleta sifa, utukufu na heshima wakati wa kufunuliwa kwa Yesu Masihi.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jaribio la imani yenu.” Neno la Kigiriki linaweza kusisitiza ama mchakato wa kujaribiwa ama uhalisi unaothibitishwa kutokana na jaribio.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yesu Kristo.” Hapa “Masihi” linatafsiri cheo Χριστός kulingana na maana yake.
    reason: lexical_alternative
  - marker: c
    text: Au, “uonekane kuwa wa sifa, utukufu na heshima.”
    reason: previous_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: uhalisi uliothibitishwa
  rationale: Nomino hii hapa inaelekea kusisitiza ubora halisi unaodhihirishwa kwa kujaribiwa, si tendo la kujaribu peke yake; tafsiri hii pia inafaa katika ulinganisho na dhahabu.
- source_word: πίστεως
  choice: imani
  rationale: Katika muktadha huu neno linarejelea imani ya waamini inayojaribiwa; “imani” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: πολυτιμότερον
  choice: ya thamani kubwa kuliko
  rationale: Huhifadhi ulinganisho wa thamani na dhahabu kwa Kiswahili cha kawaida na wazi.
- source_word: χρυσίου
  choice: dhahabu
  rationale: Ni tafsiri ya moja kwa moja ya nomino katika ulinganisho.
- source_word: ἀπολλυμένου
  choice: iharibikayo
  rationale: Huhifadhi wazo kwamba hata dhahabu si ya kudumu, tofauti na thamani ya imani iliyothibitishwa.
- source_word: διὰ πυρὸς ... δοκιμαζομένου
  choice: hujaribiwa kwa moto
  rationale: “Kwa moto” huonyesha njia au chombo cha kujaribia, na “hujaribiwa” huhifadhi uhusiano wa kimsamiati na δοκίμιον bila kulazimisha maana mahususi ya kuyeyusha.
- source_word: εὑρεθῇ εἰς
  choice: uonekane kuwa wenye kuleta
  rationale: Huhifadhi hali ya kutendwa ya εὑρεθῇ na kueleza kwa Kiswahili cha asili matokeo yanayoelekezwa na εἰς, bila kuyafanya kuwa ya uhakika kupita hali tegemezi ya Kigiriki.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: sifa, utukufu na heshima
  rationale: Huhifadhi vipengele vyote vitatu na mpangilio wake, bila kubainisha asiyeainishwa katika Kigiriki kuwa ndiye anayepokea au kutoa mambo hayo.
- source_word: ἐν ἀποκαλύψει
  choice: wakati ... atakapofunuliwa
  rationale: Hutoa maana ya wakati iliyo ya asili zaidi katika muktadha na kuonyesha wazi kwamba tukio ni kufunuliwa kwa Yesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” huwasilisha maana ya cheo Χριστός kwa lugha ya kawaida ya kibiblia ya Kiswahili.
theological_decisions:
- issue: Maana ya τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: “uhalisi uliothibitishwa wa imani yenu” huelekeza kwenye imani inayodhihirishwa kuwa halisi kwa majaribu
  alternative: “kujaribiwa kwa imani yenu,” kwa kusisitiza mchakato wa kujaribiwa
  rationale: δοκίμιον inaweza kuhusishwa na mchakato au matokeo ya jaribio, lakini hapa ulinganisho na dhahabu iliyojaribiwa unaunga mkono zaidi ubora uliothibitishwa; uwezekano mwingine umehifadhiwa katika tanbihi.
- issue: Mhusika wa “sifa, utukufu na heshima”
  choice: Tafsiri haibainishi ni nani anayetoa au kupokea sifa, utukufu na heshima
  alternative: Heshima wanayopewa waamini; sifa inayoelekezwa kwa Mungu au Kristo; au uthibitisho wa waamini mbele za Mungu
  rationale: Kigiriki hakitaji wazi mhusika au mpokeaji wa orodha hii, hivyo tafsiri inaacha mvutano huo wazi.
- issue: Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha moja kwa moja maana ya cheo ‘Mtiwa-Mafuta’; mbadala wa kimapokeo wa Kiswahili umewekwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unahifadhi hoja ndefu ya Kigiriki kwa kutumia vistari, lakini kifungu cha mwisho kimetolewa kwa mtindo wa kawaida wa Kiswahili: “wakati Yesu Masihi atakapofunuliwa.”'
