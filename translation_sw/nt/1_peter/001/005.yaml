  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: sw
  text: ninyi mnaolindwa kwa nguvu za Mungu kwa njia ya imani[a], kwa ajili ya wokovu ulio tayari kufunuliwa wakati wa mwisho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya kumtumaini”; kwa uwezekano mdogo hapa, “kwa njia ya uaminifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika wakati wa mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς
  choice: ninyi mnao-
  rationale: Kifungu hiki kinawarejelea walengwa waliotajwa katika mstari uliotangulia. ‘Ninyi mnao-’ huonyesha uhusiano huo kwa uwazi katika Kiswahili.
- source_word: φρουρουμένους
  choice: mnaolindwa
  rationale: Kauli tendwa ya wakati uliopo inaonyesha tendo linaloendelea kufanywa kwa walengwa. ‘Kulindwa’ huhifadhi maana ya ulinzi bila kuongeza maelezo yasiyomo katika matini.
- source_word: ἐν δυνάμει θεοῦ
  choice: kwa nguvu za Mungu
  rationale: Hapa ἐν inaonyesha njia au uwezo unaotenda pamoja na kauli tendwa. Usemi huu ni wa asili katika Kiswahili na unaonyesha kwamba nguvu za Mungu ndizo zinazolinda.
- source_word: διὰ πίστεως
  choice: kwa njia ya imani
  rationale: διά pamoja na hali milikishi huonyesha njia inayotumika. ‘Imani’ ni tafsiri ya kawaida ya πίστις; uwezekano wa ‘kumtumaini’ au ‘uaminifu’ umehifadhiwa katika tanbihi.
- source_word: εἰς σωτηρίαν
  choice: kwa ajili ya wokovu
  rationale: εἰς huonyesha lengo au matokeo yanayotazamiwa. Tafsiri hii huhifadhi mwelekeo wa mbele wa wokovu unaotajwa.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: ulio tayari kufunuliwa
  rationale: Muundo wa kivumishi na kitenzi-jina umetafsiriwa kwa njia ya kawaida na ya moja kwa moja, huku kauli tendwa ikihifadhiwa.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: katika wakati wa mwisho
  rationale: καιρός humaanisha wakati maalumu au mwafaka. Tafsiri hii huhifadhi maana ya wakati wa mwisho bila kuingiza mfumo fulani wa matukio ya mwisho.
theological_decisions:
- issue: Uhusiano kati ya ulinzi wa Mungu na mwitikio wa mwanadamu katika διὰ πίστεως
  choice: Mungu ndiye anayelinda kwa nguvu zake, na imani ndiyo njia inayotajwa katika ulinzi huo.
  alternative: Imani inaweza kueleweka kuwa kumtumaini Mungu, au—kwa uwezekano mdogo hapa—uaminifu.
  rationale: Sarufi inaweka nguvu za Mungu kuwa uwezo wa ulinzi na imani kuwa njia. Tafsiri inadumisha vipengele vyote bila kuamua mjadala wa kimadhehebu kuhusu kudumu au kuanguka katika imani.
- issue: Wakati wa wokovu
  choice: Wokovu unaelekezwa kwenye kufunuliwa kwake wakati wa mwisho.
  alternative: Agano Jipya pia linaweza kuzungumzia wokovu kwa hali ya sasa, lakini mstari huu unasisitiza ufunuo wake wa wakati ujao.
  rationale: Maneno ‘ulio tayari kufunuliwa’ yanaelekeza mbele. Tafsiri haiifanyi kauli hii ikanushe vipengele vingine vya wokovu vinavyoweza kutajwa kwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaendelea kutoka mstari uliotangulia, kwa hiyo ‘ninyi mnao-’ umetumiwa kuonyesha walengwa wazi. Istilahi za kawaida ‘imani,’ ‘wokovu,’ na ‘kufunuliwa’ zimetumiwa bila kuongeza msimamo wa kimadhehebu.
