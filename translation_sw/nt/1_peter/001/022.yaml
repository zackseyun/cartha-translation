review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents purification, obedience to the truth, sincere familial love, reciprocal love, and the textual variant. However, “Kwa kuwa” presents the participle as an explicit cause, and “hata mkawa na” makes the εἰς phrase an asserted result rather than retaining its purposive orientation. A temporal participial construction and “kwa ajili ya” more closely preserve the Greek relations.
  naturalness: The revised sentence is fluent Standard East African Swahili and retains the elevated exhortative register. “Kutoka moyoni” and “kwa bidii” are natural renderings in this context.
  terminology: '“Nafsi zenu,” “kweli,” “upendo wa kindugu,” and “pendaneni” are appropriate. The lexical footnote requires correction: “wanawake kwa wanaume” does not mean that both women and men are included; it must say “wanaume na wanawake” or equivalent.'
  issues:
  - severity: medium
    issue: Participial and εἰς relations are over-specified
    rationale: “Kwa kuwa” is explicitly causal, whereas the perfect participle primarily marks prior completed action; “hata mkawa na” recasts εἰς as a resulting state. “Mkiisha ... kwa ajili ya ...” retains the prior action and purpose without asserting more than the source.
  - severity: high
    issue: Footnote a has an erroneous gender-inclusive explanation
    rationale: The phrase “wanawake kwa wanaume” means women to men, not women and men. This fails to communicate that φιλαδελφία includes all fellow believers, including both sisters and brothers.
  revised_text: Mkiisha kuzitakasa nafsi zenu kwa kuitii kweli, kwa ajili ya upendo wa kindugu usio na unafiki[a], pendaneni kwa bidii kutoka moyoni[b].
