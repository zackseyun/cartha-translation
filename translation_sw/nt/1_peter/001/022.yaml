source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: sw
  text: Mkiisha kuzitakasa nafsi zenu kwa kuitii kweli, kwa ajili ya upendo wa kindugu usio na unafiki[a], pendaneni kwa bidii kutoka moyoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wa dhati kwa waamini wenzenu.” Neno la Kigiriki linalotafsiriwa “upendo wa kindugu” linaonyesha upendo wa kifamilia kati ya waamini, wakiwemo wanawake na wanaume.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina, “kutoka katika moyo safi.”
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: kwa kuwa mmejitakasa
  rationale: Kauli timilifu ya hali ya kushiriki inaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea kuwa muhimu kabla ya amri kuu. Muundo huu wa Kiswahili unaeleza uhusiano huo kwa kawaida bila kuufanya kuwa sababu ya lazima.
- source_word: ψυχὰς
  choice: nafsi zenu
  rationale: Neno ψυχή linaweza kumaanisha nafsi, maisha, au mtu mwenyewe. “Nafsi zenu” huhifadhi taswira ya chanzo huku likirejelea utu wao wa ndani, si sehemu iliyotenganishwa na mtu mzima.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: kwa kuitii kweli
  rationale: ἐν pamoja na hali ya dative hapa inaweza kuonyesha njia au mazingira. “Kwa kuitii kweli” ni Kiswahili cha asili kinachoonyesha kwamba utakaso unahusishwa na utii kwa ile kweli.
- source_word: ἀληθείας
  choice: kweli
  rationale: Ingawa Kigiriki kina kibainishi, Kiswahili kwa kawaida hakihitaji neno linalolingana na “the.” Katika muktadha huu “kweli” inaeleweka kuwa ujumbe wa kweli wa Injili.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: hata mkawa na upendo wa kindugu usio na unafiki
  rationale: εἰς huonyesha lengo au matokeo. “Hata mkawa na” huwasilisha matokeo kwa Kiswahili fasaha, na “usio na unafiki” huhifadhi maana ya moja kwa moja ya ἀνυπόκριτον.
- source_word: φιλαδελφίαν
  choice: upendo wa kindugu
  rationale: Hili ni pendo la kifamilia kati ya waamini. “Wa kindugu” linahifadhi taswira ya udugu na tofauti yake na kitenzi cha jumla ἀγαπάω kinachofuata, bila kuwalenga wanaume pekee.
- source_word: ἐκ καρδίας
  choice: kutoka moyoni
  rationale: Hili ndilo somo la SBLGNT bila kivumishi “safi.” Tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ἀγαπήσατε
  choice: pendaneni
  rationale: Amri ya aoristi inatolewa kwa namna ya kawaida na ya moja kwa moja. Kiambishi cha kurejeana kinaunganisha kitenzi na ἀλλήλους kwa Kiswahili fasaha.
- source_word: ἀλλήλους
  choice: -aneni katika “pendaneni”
  rationale: Kiswahili huonyesha urejeshano kwa kiambishi -an- ndani ya kitenzi; hivyo maana ya “ninyi kwa ninyi” inawasilishwa bila kurudia maneno yasiyohitajika.
- source_word: ἐκτενῶς
  choice: kwa bidii
  rationale: Kielezi hiki huonyesha nguvu, juhudi, na udumifu wa upendo. “Kwa bidii” ni cha sasa na kinachoeleweka, bila kutumia lugha ya kizamani.
theological_decisions:
- issue: Tofauti kati ya φιλαδελφία na ἀγαπάω katika mstari mmoja
  choice: Kutafsiri φιλαδελφία kuwa “upendo wa kindugu” na ἀγαπήσατε kuwa “pendaneni.”
  alternative: Kutumia “upendo” au “penda” kwa maneno yote mawili.
  rationale: Chaguo hili linahifadhi tofauti ya msamiati na mwendo wa balagha wa Kigiriki bila kudai kwamba maneno hayo yanaonyesha aina mbili za upendo zinazotenganishwa kabisa.
- issue: Nguvu ya kijinsia ya φιλαδελφία
  choice: Kutumia “upendo wa kindugu” na kueleza katika tanbihi kuwa unawahusu waamini wote.
  alternative: “Upendo kwa waamini wenzenu” au “upendo kwa ndugu wa kiume na wa kike.”
  rationale: “Kindugu” ni jumuishi kwa kawaida katika Kiswahili na bado huhifadhi taswira ya familia iliyo katika neno la Kigiriki.
- issue: Tofauti ya nakala baada ya ἐκ καρδίας
  choice: Kutafsiri “kutoka moyoni” bila kuongeza “safi.”
  alternative: “Kutoka katika moyo safi.”
  rationale: SBLGNT iliyotolewa haina καθαρᾶς. Tofauti hiyo inastahili kutajwa katika tanbihi, lakini haipaswi kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi tendo lililotangulia na amri kuu, huku “upendo wa kindugu” na “pendaneni” vikidumisha tofauti ya maneno mawili ya Kigiriki.
