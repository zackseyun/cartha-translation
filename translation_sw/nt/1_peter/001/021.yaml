  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: sw
  text: Ninyi mnaomwamini Mungu kupitia kwake, Mungu aliyemfufua kutoka miongoni mwa wafu na kumpa utukufu, kwa matokeo kwamba imani yenu na tumaini lenu ziwe kwa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale walio waaminifu kwa Mungu kupitia kwake.” Hata hivyo, hapa inaelekea zaidi kumaanisha wale wanaomwamini Mungu kupitia Kristo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: kupitia kwake
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au upatanishi; “kupitia kwake” linaonyesha kwamba kumwamini Mungu kunawezeshwa kupitia Kristo bila kuongeza wazo lisilomo katika matini.
- source_word: πιστοὺς εἰς θεόν
  choice: mnamwamini Mungu
  rationale: Ingawa πιστός inaweza kumaanisha “mwaminifu,” muundo wake pamoja na εἰς θεόν hapa unaelekea kumaanisha watu wanaomwamini Mungu. Muundo wa kitenzi ni wa kawaida na wazi katika Kiswahili.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: aliyemfufua kutoka kwa wafu
  rationale: Huu ni usemi wa kawaida wa Agano Jipya kuhusu ufufuo. “Kutoka kwa wafu” huhifadhi wazo la ἐκ νεκρῶν kwa lugha ya asili ya Kiswahili.
- source_word: δόξαν αὐτῷ δόντα
  choice: na kumpa utukufu
  rationale: Tafsiri hii inahifadhi kitendo cha Mungu kumpa Kristo utukufu na ulinganifu wake na tendo la kumfufua.
- source_word: ὥστε
  choice: ili
  rationale: “Ili” huunganisha matendo ya Mungu kwa Kristo na hali inayofuata ya imani na tumaini la waamini. Kwa kuwa ὥστε inaweza kusikika kama kusudi au matokeo, uwezekano wa matokeo umeonyeshwa katika tanbihi.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: imani yenu na tumaini lenu
  rationale: “Imani” na “tumaini” ni maneno ya kawaida, sahihi, na yenye hadhi; viambishi vya umilikishi vinarudiwa ili sentensi iwe wazi na ya asili.
- source_word: εἶναι εἰς θεόν
  choice: viwe kwa Mungu
  rationale: “Kwa Mungu” huonyesha mwelekeo na mlengwa wa imani na tumaini. Pia huepuka usemi usio wa kawaida “ndani ya Mungu.”
theological_decisions:
- issue: Maana ya πιστούς
  choice: Watu wanaomwamini Mungu kupitia Kristo
  alternative: Watu walio waaminifu kwa Mungu kupitia Kristo
  rationale: εἰς θεόν baada ya πιστούς inaunga mkono maana ya kuamini au kutumaini. Maana mbadala ya “waaminifu” imehifadhiwa katika tanbihi bila kuingiza mkazo wa kimadhehebu.
- issue: Nafasi ya Kristo katika kumfikia Mungu kwa imani
  choice: “Kupitia kwake” huonyesha upatanishi wa Kristo
  alternative: “Kwa sababu yake” kama sababu pana zaidi
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au upatanishi kwa usahihi zaidi kuliko sababu ya jumla, bila kuongeza maelezo ya kiteolojia yasiyotajwa moja kwa moja.
- issue: Nguvu ya kishazi kinachoanza na ὥστε
  choice: “ili” katika matini kuu
  alternative: “na matokeo yake ni kwamba”
  rationale: ὥστε inaweza kuwasilisha matokeo, huku katika muktadha pia ikiruhusu kusikika kwa kusudi. Matini kuu ni fupi na ya asili, na tanbihi inalinda uwezekano wa kusoma kishazi kama matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. “Mnamwamini Mungu” ni ya asili kuliko nomino “waamini,” na “kwa Mungu” huhifadhi mwelekeo wa εἰς bila kutumia Kiswahili kisicho cha kawaida.
