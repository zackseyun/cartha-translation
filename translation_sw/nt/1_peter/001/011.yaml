id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: sw
  text: wakichunguza ni mtu gani au ni wakati wa aina gani ambao Roho wa Masihi aliyekuwa ndani yao alikuwa akionyesha, alipokuwa akishuhudia mapema juu ya mateso yanayomhusu Masihi[a] na utukufu mbalimbali baada ya hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mateso ya Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: wakichunguza
  rationale: Kitenzi endelevu kinaunganisha shughuli ya manabii na mstari uliotangulia na kudumisha wazo la uchunguzi wa makini.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: ni mtu gani au ni wakati gani
  rationale: Huhifadhi pande mbili za swali—mtu na wakati—bila kuzifanya kuwa swali moja la wakati tu.
- source_word: ἐδήλου
  choice: alikuwa akiuonyesha
  rationale: Muundo wa hali ya kuendelea unaakisi aspekti ya imperfect, yaani Roho alikuwa akiendelea kutoa ishara kuhusu mtu au wakati huo.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: Roho wa Masihi aliyekuwa ndani yao
  rationale: Huhifadhi uhusiano wa moja kwa moja kati ya Roho na Masihi, pamoja na ukweli kwamba Roho alikuwa ndani ya manabii.
- source_word: προμαρτυρόμενον
  choice: aliposhuhudia mapema
  rationale: Huhifadhi maana ya kutoa ushuhuda na kiambishi προ-, kinachoonyesha jambo lililofanywa kabla.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: mateso yatakayompata Masihi
  rationale: Huwasilisha kwa Kiswahili cha kawaida mateso yaliyoelekezwa kwa au yaliyomhusu Masihi bila kuyafanya wazi kuwa mateso ya wengine kwa ajili yake; uwezekano wa ‘mateso ya Masihi’ umehifadhiwa katika tanbihi.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: utukufu mbalimbali baada ya hayo
  rationale: ‘Utukufu mbalimbali’ huhifadhi wingi wa δόξας kwa njia ya asili zaidi kuliko ‘utukufu mbalimbali mbalimbali,’ huku ‘baada ya hayo’ ikidumisha mpangilio wa wakati.
theological_decisions:
- issue: Maana ya ‘Roho wa Masihi’ kuhusiana na manabii
  choice: Roho wa Masihi aliyekuwa ndani yao
  alternative: Roho wa kinabii aliyesema kuhusu Masihi
  rationale: Tafsiri inadumisha kauli nzito ya Kigiriki bila kupunguza uhusiano wa Roho na Masihi kuwa maelezo tu kuhusu Masihi.
- issue: Nguvu ya εἰς katika τὰ εἰς Χριστὸν παθήματα
  choice: mateso yatakayompata Masihi
  alternative: mateso ya Masihi
  rationale: Kiswahili hiki huonyesha mateso yaliyoelekezwa kwa Masihi au yaliyomhusu, huku tanbihi ikihifadhi uchanganuzi wa kawaida na unaowezekana wa umilikaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi mwendelezo na mstari uliotangulia, pamoja na utata halisi wa kirai kinachohusu mateso ya Masihi.
