    text: Au, “mateso ya Masihi.”
    reason: alternative_reading
  revision_rationale: Revision preserves the source’s twofold inquiry, including the qualitative sense of ποῖον καιρόν; keeps ‘Roho wa Masihi’ and the plural sense of ‘utukufu mbalimbali’; and uses a broader rendering for the disputed εἰς Χριστόν phrase rather than introducing an unmarked future sense. The alternative possessive reading remains anchored at the phrase in question.
