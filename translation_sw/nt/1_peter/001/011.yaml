  to: wakichunguza ni mtu gani au ni wakati wa aina gani ambao Roho wa Masihi aliyekuwa ndani yao alikuwa akionyesha, alipokuwa akishuhudia mapema juu ya mateso yanayomhusu Masihi[a] na utukufu mbalimbali baada ya hayo.
