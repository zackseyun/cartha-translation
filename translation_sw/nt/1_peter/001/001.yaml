  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: sw
  text: 'Petro, mtume wa Yesu Masihi, kwa wateule wanaoishi ugenini katika utawanyiko[a] huko Ponto, Galatia, Kapadokia, Asia na Bithinia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “wanaoishi ugenini katika utawanyiko” yanaweza pia kutafsiriwa “wageni wakaaji wa Utawanyiko.” Huenda yakarejelea Utawanyiko wa Wayahudi na pia hali pana ya watu wa Mungu kuishi mbali na makao yao ya kweli.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: Πέτρος
  choice: Petro
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Neno hili linaonyesha cheo na mamlaka ya Petro kama aliyetumwa rasmi, si mjumbe wa kawaida tu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” huhifadhi maana ya kichwa Χριστός kama Mtiwa-Mafuta, huku muundo mzima ukibaki wa kawaida na wenye heshima katika Kiswahili.
- source_word: ἐκλεκτοῖς
  choice: wateule
  rationale: “Wateule” huonyesha kwamba waliandikiwa wamechaguliwa bila kuamua mfumo maalumu wa kitheolojia.
- source_word: παρεπιδήμοις
  choice: wanaoishi ugenini
  rationale: Usemi huu wa asili unaeleweka kwa wasomaji wa sasa na unaonyesha hali ya watu wanaokaa mahali pasipo kwao bila kulazimisha ikiwa ni uhamisho halisi au taswira ya kiroho.
- source_word: διασπορᾶς
  choice: katika utawanyiko
  rationale: Huhifadhi wazo la watu waliotawanyika pamoja na mwangwi wake wa kihistoria na kitheolojia, bila kulifanya kwa lazima kuwa jina rasmi.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: huko Ponto, Galatia, Kapadokia, Asia na Bithinia
  rationale: Majina ya maeneo yametolewa kwa maumbo yanayotambulika katika Kiswahili; “huko” imeongezwa ili kuonyesha kwa kawaida uhusiano wa mahali.
theological_decisions:
- issue: Maana ya ἐκλεκτοῖς
  choice: wateule
  alternative: waliochaguliwa
  rationale: “Wateule” ni fupi, yenye heshima na ya kawaida, lakini haitaji wala kuamua fundisho fulani la kimadhehebu kuhusu uchaguzi.
- issue: Uhusiano wa παρεπιδήμοις διασπορᾶς
  choice: wanaoishi ugenini katika utawanyiko
  alternative: wageni wa Utawanyiko
  rationale: Tafsiri hii inaacha wazi kama maelezo yanahusu zaidi hali yao ya kijamii na kijiografia, utambulisho wa Wayahudi waliotawanyika, au hali ya kiroho ya watu wa Mungu.
- issue: Maana ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huweka wazi nguvu ya neno hili kama cheo cha Mtiwa-Mafuta bila kukana kwamba “Kristo” ni umbo la jadi linalojulikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayosomeka kwa urahisi. Muundo wa salamu umehifadhiwa kwa alama ya nukta mbili kwa kuwa sentensi inaendelea katika mstari unaofuata.
