  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: sw
  text: Mkiwa mmezaliwa upya, si kwa mbegu inayoharibika bali kwa mbegu isiyoharibika, kupitia neno la Mungu lililo hai na linalodumu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia neno la Mungu aliye hai na anayedumu.” Katika Kigiriki, maneno “aliye hai” na “anayedumu” yanaweza kueleza ama “neno” ama “Mungu,” ingawa muktadha unapendelea yaeleze “neno.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: mme­zaliwa upya
  rationale: Kauli timilifu tendwa inaonyesha tendo lililotimizwa ambalo matokeo yake yanaendelea. “Mmezaliwa upya” ni Kiswahili cha kawaida kinachohifadhi maana ya kuzaliwa na hali ya kutendwa; “kwa kuwa” huunganisha kirai hiki cha kishiriki na muktadha wake.
- source_word: σπορᾶς
  choice: mbegu
  rationale: Katika ulinganisho huu wa kuzaliwa, “mbegu” ni tafsiri ya kawaida na ya wazi, na inafaa kwa utofautishaji wa kile kinachoharibika na kisichoharibika.
- source_word: φθαρτῆς
  choice: inayoharibika
  rationale: Neno hili linaeleza kitu chenye kuweza kuharibika au kutoweka. “Inayoharibika” ni ya kawaida katika Kiswahili cha sasa na inatofautiana wazi na “isiyoharibika.”
- source_word: ἀφθάρτου
  choice: isiyoharibika
  rationale: Tafsiri hii huhifadhi ulinganifu wa moja kwa moja na φθαρτῆς bila kuingiza maana ya ziada.
- source_word: διὰ
  choice: kwa njia ya
  rationale: διά pamoja na umilikishi huonyesha njia au chombo ambacho tendo limetimizwa. “Kwa njia ya” ni wazi na ya asili katika Kiswahili.
- source_word: λόγου
  choice: neno
  rationale: “Neno” ni tafsiri ya moja kwa moja ya λόγος hapa na huhifadhi mwangwi wa muktadha unaofuata kuhusu neno linalodumu; “ujumbe” pia ungewezekana lakini ni fafanuzi zaidi.
- source_word: ζῶντος
  choice: lililo hai
  rationale: Kishiriki hiki kinafanya kazi kama kivumishi. Upatanisho wa ngeli katika “lililo hai” unalihusisha na “neno” kwa mujibu wa usomaji unaopendelewa.
- source_word: θεοῦ
  choice: la Mungu
  rationale: 'Umilikishi huu kwa kawaida humtegemea λόγου: “neno la Mungu.” “Kutoka kwa Mungu” ungeeleza chanzo kwa namna iliyo wazi zaidi kuliko muundo wa Kigiriki.'
- source_word: μένοντος
  choice: linalodumu
  rationale: “Linalodumu” huonyesha hali inayoendelea ya kubaki bila kutumia “linalokaa,” ambalo katika Kiswahili linaweza kueleweka hasa kama kuketi au kuishi mahali fulani.
theological_decisions:
- issue: Iwapo ζῶντος na μένοντος zinaeleza “neno” au “Mungu”
  choice: 'Vishiriki vyote vinaeleza “neno”: “neno la Mungu lililo hai na linalodumu.”'
  alternative: “neno la Mungu aliye hai na anayedumu.”
  rationale: Kwa sarufi ya Kigiriki, ζῶντος na μένοντος zinaweza kupatana na λόγου au θεοῦ kwa sababu zote ni za kiume, umoja, katika umilikishi. Muktadha wa karibu, hasa mstari wa 25 unaosisitiza kudumu kwa neno, unapendelea kuvihusisha na “neno.” Hata hivyo, usomaji unaovihusisha na “Mungu” unawezekana na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa kuwa” huwasilisha uhusiano wa kishiriki na muktadha kwa lugha ya kawaida. Urudiaji wa “mbegu” katika sehemu ya pili umechaguliwa kwa uwazi, kwa kuwa kuacha nomino kungesikika pungufu. Tanbihi imewekwa baada ya kirai chenye utata, na upatanisho wa ngeli katika Kiswahili lazima uchague wazi kati ya “neno” na “Mungu.”
