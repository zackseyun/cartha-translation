  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: sw
  text: Walifunuliwa kwamba, katika mambo hayo, hawakuwa wakijitumikia wenyewe, bali walikuwa wakiwahudumia ninyi[a]. Mambo hayo sasa yametangazwa kwenu kupitia wale waliowahubiria habari njema[b] kwa Roho Mtakatifu aliyetumwa kutoka mbinguni—mambo ambayo malaika wanatamani kuyachunguza kwa makini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuwa wakijitumikia wenyewe, bali walikuwa wakiwahudumia ninyi.” Katika Kigiriki, umbo la maneno linaonyesha wale walionufaika na huduma ya manabii.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliowatangazia injili.” Kigiriki kimetumia kitenzi chenye maana ya kutangaza habari njema.
    reason: lexical_alternative
  - marker: c
    text: “Kuyachunguza kwa makini” pia kunaweza kutafsiriwa “kuyachungulia” au “kuinama ili kuyatazama.” Maneno hayo yanaonyesha kutazama kwa hamu na umakini mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: Walifunuliwa
  rationale: Kiwakilishi hiki kinawarejelea manabii wa mstari uliotangulia. Katika Kiswahili, mhusika anaweza kuingizwa moja kwa moja katika kitenzi bila kuongeza nomino isiyokuwamo katika sentensi hii.
- source_word: ἀπεκαλύφθη
  choice: walifunuliwa
  rationale: Huhifadhi kauli ya kutendwa na maana ya kufunuliwa kwa jambo la Mungu bila kumtaja wazi mtendaji ambaye Kigiriki hakumtaji.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά
  choice: huduma yao katika mambo hayo haikuwa kwa ajili yao wenyewe, bali kwa ajili yenu
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba viwakilishi vya hali ya tatu vinataja wanufaika wa huduma, huku αὐτά ikirejelea mambo yaliyotabiriwa. Pia huhifadhi hali endelevu ya kitenzi cha wakati uliopita kwa kueleza huduma yao.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Mambo hayo sasa yametangazwa kwenu
  rationale: Kauli ya kutendwa imehifadhiwa, na 'sasa' inaunganisha huduma ya zamani ya manabii na tangazo lililowafikia wasomaji.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: kupitia wale waliowahubiria habari njema
  rationale: Hutafsiri wazo la kitenzi εὐαγγελίζω kwa lugha inayoeleweka, badala ya kuligeuza bila ulazima kuwa istilahi ya kitaalamu.
- source_word: πνεύματι ἁγίῳ
  choice: kwa Roho Mtakatifu
  rationale: Hali ya tatu inaeleweka hapa kama njia au wakala wa kutangazwa kwa habari njema. Muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: aliyetumwa kutoka mbinguni
  rationale: Huhifadhi kauli ya kutendwa na kuonyesha kwamba kishazi hiki kinamfafanua Roho Mtakatifu.
- source_word: ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: malaika wanatamani kuyachunguza kwa makini
  rationale: Wakati wa sasa wa 'wanatamani' unaonyesha hamu inayoendelea. 'Kuyachunguza kwa makini' huwasilisha kutazama kwa shauku na umakini bila kufanya taswira ya kuinama iwe nzito au isiyo ya kawaida.
theological_decisions:
- issue: Rejeleo la πνεύματι ἁγίῳ
  choice: Roho Mtakatifu binafsi ndiye wakala wa kutangazwa kwa habari njema
  alternative: roho takatifu kama nguvu au hali ya kiroho kwa ujumla
  rationale: Muktadha wa ujumbe wa wokovu na kishazi 'aliyetumwa kutoka mbinguni' vinaunga mkono rejeleo la Roho Mtakatifu. Tafsiri haiongezi maelezo zaidi ya hayo.
- issue: Uhusiano kati ya huduma ya manabii na waamini wa baadaye
  choice: Huduma ya manabii katika mambo hayo ilikuwa kwa manufaa ya waamini walioambiwa habari njema baadaye
  alternative: Manabii walihudumia wao wenyewe au watu wa wakati wao pekee
  rationale: Tofauti ya wazi kati ya 'si kwa ajili yao wenyewe' na 'bali kwa ajili yenu' imehifadhiwa, bila kudai kwamba huduma yao haikuwa na manufaa yoyote kwa watu wa wakati wao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili iwe wazi kwa msomaji wa kawaida, huku uhusiano wa mambo yaliyotabiriwa, tangazo la habari njema, na hamu ya malaika ukihifadhiwa. Istilahi za kidhehebu zimeepukwa.
