  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: sw
  text: bali kwa damu ya thamani ya Masihi[a], kama ile ya mwana-kondoo asiye na dosari wala doa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo.” Neno la Kigiriki Χριστοῦ ni cheo kinachomaanisha “Masihi,” lakini kwa mapokeo hutafsiriwa “Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: bali
  rationale: 'Inaonyesha ulinganifu mkali na kauli ya kukanusha katika mstari uliotangulia: si kwa vitu vinavyoharibika, bali kwa damu.'
- source_word: τιμίῳ
  choice: ya thamani
  rationale: Huwasilisha thamani kuu na heshima ya damu kwa Kiswahili cha kawaida chenye hadhi, bila kuifanya lugha ionekane ya kibiashara.
- source_word: αἵματι
  choice: damu
  rationale: Tafsiri halisi huhifadhi taswira ya dhabihu na kifo badala ya kuibadili kuwa ufafanuzi wa kitheolojia.
- source_word: ὡς
  choice: kama ile ya
  rationale: Inaonyesha kwa uwazi kuwa damu inalinganishwa na ile ya mwana-kondoo, huku ikibaki ya kawaida katika Kiswahili.
- source_word: ἀμνοῦ
  choice: mwana-kondoo
  rationale: Ni neno la kawaida na la moja kwa moja linalohifadhi mwangwi wa dhabihu bila kuufafanua ndani ya matini.
- source_word: ἀμώμου
  choice: asiye na dosari
  rationale: Huhifadhi wazo la kutokuwa na kasoro linalofaa kwa lugha ya dhabihu.
- source_word: καὶ
  choice: wala
  rationale: Katika muundo wa Kiswahili ‘asiye na ... wala ...’, huunganisha kwa kawaida sifa mbili hasi huku ikidumisha utofauti wake.
- source_word: ἀσπίλου
  choice: doa
  rationale: Hutofautisha sifa hii na ‘dosari’ na kuhifadhi taswira ya kutokuwa na waa au uchafu.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa ni cheo cha kimasiya katika hali ya umilikishi; ‘Masihi’ huwasilisha maana ya cheo hicho kwa uwazi, huku ‘Kristo’ ikiwekwa kama mbadala katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo cha kimasiya, si lazima kama sehemu ya jina la pekee. ‘Masihi’ huhifadhi maana ya cheo; ‘Kristo’ ni tafsiri ya kimapokeo na imeonyeshwa katika tanbihi.
- issue: Uhusiano wa ulinganisho wa ὡς ἀμνοῦ na damu
  choice: kama ile ya mwana-kondoo
  alternative: kama mwana-kondoo
  rationale: Muundo uliochaguliwa unaweka wazi kwamba ulinganisho unahusu damu, bila kufuta taswira kwamba Masihi anahusishwa na mwana-kondoo wa dhabihu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Bali’ hudumisha mkazo wa ulinganifu na mstari uliotangulia; ‘asiye na dosari wala doa’ ni ya kawaida, yenye mlingano, na huhifadhi istilahi mbili tofauti za Kigiriki.
