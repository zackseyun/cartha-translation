  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: ἀλλὰ ni “bali”; τιμίῳ αἵματι ni “damu ya thamani”; na “kama ile ya mwana-kondoo asiye na dosari wala doa” hudumisha ulinganisho wa ὡς pamoja na sifa mbili tofauti, ἀμώμου na ἀσπίλου. “Ya Masihi” hutoa kwa usahihi umilikishi wa Χριστοῦ.'
