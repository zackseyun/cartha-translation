  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: sw
  text: Lakini neno la Bwana linadumu milele.” Na hili ndilo neno lililotangazwa kwenu kama habari njema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno lililohubiriwa kwenu kama injili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: neno
  rationale: “Neno” linahifadhi mwangwi wa Isaya 40:8 na linafaa katika sehemu zote mbili, huku likiweza kumaanisha neno lililotamkwa au ujumbe.
- source_word: κυρίου
  choice: la Bwana
  rationale: Hii ni tafsiri ya kawaida na yenye heshima ya muundo wa umilikaji κυρίου, bila kuamua zaidi utambulisho unaodokezwa na muktadha wa nukuu.
- source_word: μένει
  choice: linadumu
  rationale: “Linadumu” linaeleza kuendelea kuwapo kwa uthabiti na kwa lugha ya kawaida ya Kiswahili cha sasa.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Hii ndiyo njia ya kawaida na ya asili ya kueleza muda usio na mwisho katika Kiswahili.
- source_word: τοῦτο δέ ἐστιν
  choice: Na hili ndilo
  rationale: “Na” linaonyesha mpito mwepesi wa δέ, na “hili ndilo” linaunganisha nukuu na matumizi yake kwa wasomaji.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: neno lililohubiriwa ... kuwa habari njema
  rationale: Muundo huu unahifadhi “neno” kwa ajili ya uhusiano na nukuu, huku ukionyesha wazi maana ya kitenzi εὐαγγελίζω ya kutangaza habari njema.
- source_word: εἰς ὑμᾶς
  choice: kwenu
  rationale: “Kwenu” ni Kiswahili cha asili kinachoonyesha kuwa tangazo lilielekezwa kwa wasikilizaji.
theological_decisions:
- issue: Uhusiano wa “neno la Bwana” na nukuu ya Isaya 40:8 pamoja na habari njema iliyotangazwa
  choice: Kudumisha “neno la Bwana” katika nukuu, kisha kulitambulisha kuwa neno lililohubiriwa kwa wasomaji kama habari njema.
  alternative: Kutafsiri kila mahali kwa ufafanuzi zaidi kuwa “ujumbe kutoka kwa Bwana.”
  rationale: Hili linahifadhi mwangwi wa Maandiko na pia matumizi ya Petro kwa tangazo la habari njema, bila kuyafanya mawazo hayo mawili kuwa kitu kimoja kwa njia ya ufafanuzi uliozidi matini.
- issue: Tafsiri ya εὐαγγελισθέν
  choice: Kutumia maneno yaliyo wazi ya “habari njema.”
  alternative: “Neno lililohubiriwa kwenu kama injili.”
  rationale: “Habari njema” linaonyesha wazi nguvu ya kitenzi εὐαγγελίζω kwa wasomaji wa sasa bila kuongeza maudhui ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya kufunga nukuu imehifadhiwa kwa sababu kifungu cha kwanza ni mwisho wa nukuu iliyoanza katika mstari uliotangulia.
