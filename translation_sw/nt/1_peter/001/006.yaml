base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: sw
  text: Katika hayo mnafurahi sana,[a] ingawa sasa kwa muda mfupi, ikiwa ni lazima, mmehuzunishwa na majaribu ya namna mbalimbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnafurahi kwa shangwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Katika hayo
  rationale: Kiwakilishi hiki kinaelekea kurejelea ujumla wa wokovu, tumaini, na urithi uliotajwa katika mistari iliyotangulia. “Katika hayo” ni Kiswahili cha kawaida kinachohifadhi wazo la kuwa katika hali au msingi huo bila kulifanya wazi zaidi kuliko Kigiriki.
- source_word: ἀγαλλιᾶσθε
  choice: mnafurahi sana
  rationale: Kitenzi kinaonyesha furaha kubwa au kushangilia. “Mnafurahi sana” ni cha asili na kinawasilisha uzito wake kuliko “mnafurahi” peke yake.
- source_word: ὀλίγον ἄρτι
  choice: sasa kwa muda mfupi
  rationale: 'Tafsiri hii inadumisha vipengele vyote viwili vya wakati: hali ya sasa na ufupi wa muda.'
- source_word: εἰ δέον
  choice: ikiwa ni lazima
  rationale: Huhifadhi maana ya sharti pamoja na ulazima bila kueleza chanzo au kusudi la ulazima huo.
- source_word: λυπηθέντες
  choice: mmehuzunishwa
  rationale: Umbo hili linahifadhi hali ya kutendwa na uzito wa kihisia wa kupata huzuni.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: na majaribu ya namna mbalimbali
  rationale: Katika muktadha wa mateso na kupimwa kwa imani, “majaribu” linaweza kutaja hali ngumu zinazowajaribu waamini. “Na” linawasilisha majaribu kama sababu au mazingira ya huzuni kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya πειρασμοῖς katika muktadha wa mateso
  choice: majaribu
  alternative: vipimo; vishawishi
  rationale: Muktadha wa huzuni na kupimwa kwa imani katika mstari unaofuata unaelekeza hasa kwenye hali ngumu zinazojaribu imani. Hata hivyo, neno la Kigiriki lina wigo mpana, hivyo tanbihi inadumisha uwezekano wa maana ya “vipimo” na kutaja kwamba katika miktadha mingine linaweza kumaanisha “vishawishi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida huku sharti la “ikiwa ni lazima” na utata wa πειρασμοῖς vikihifadhiwa.
