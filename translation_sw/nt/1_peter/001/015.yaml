  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: sw
  text: bali kama yeye aliyewaita alivyo mtakatifu, ninyi wenyewe pia iweni watakatifu[a] katika mwenendo wenu wote[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fanyikeni watakatifu.” Kitenzi cha Kigiriki kinaweza kusisitiza kuingia katika hali hii au kuionyesha, ingawa “iweni watakatifu” ni himizo la kawaida zaidi hapa.
    reason: lexical_alternative
  - marker: b
    text: Au “katika namna yenu yote ya kuishi.” Neno la Kigiriki linaweza kumaanisha mwenendo mzima wa mtu au maisha yake yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: bali
  rationale: Huonyesha utofauti na tamaa za zamani zilizotajwa katika muktadha uliotangulia; “bali” ni kiunganishi cha kawaida na chenye uzito unaofaa hapa.
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: kama yeye aliyewaita alivyo mtakatifu
  rationale: 'κατά inaonyesha ulinganifu: maisha ya waamini yapaswa kulingana na utakatifu wa aliyewaita. Muundo huu wa Kiswahili unakamilisha ulinganisho kwa njia ya asili bila kuufanya kuwa maelezo ya ziada.'
- source_word: τὸν καλέσαντα ὑμᾶς
  choice: yeye aliyewaita
  rationale: Kirai nomino chenye participio kinawakilishwa kwa kishazi rejeshi cha kawaida katika Kiswahili, huku tendo la wito na walengwa wake vikihifadhiwa.
- source_word: ἅγιον … ἅγιοι
  choice: mtakatifu … watakatifu
  rationale: Marudio ya mzizi uleule yanahifadhi ulinganifu uliokusudiwa kati ya utakatifu wa Mungu na wito wa waamini kuwa watakatifu.
- source_word: καὶ αὐτοὶ
  choice: ninyi wenyewe pia
  rationale: “Ninyi wenyewe” huhifadhi mkazo wa αὐτοί, na “pia” huwakilisha καί.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: katika mwenendo wenu wote
  rationale: ἀναστροφή humaanisha mwenendo au namna nzima ya kuishi. “Mwenendo wenu wote” ni lugha ya sasa, ya asili, na yenye uzito wa kimaadili; kiwakilishi “wenu” kinaeleweka kutokana na muktadha.
- source_word: γενήθητε
  choice: iweni
  rationale: Amri hii inaweza kuwa na wazo la kuingia katika hali au kuidhihirisha, lakini “iweni” ni himizo la asili la Kiswahili na halisisitizi kupita kiasi mchakato ambao haujaelezwa wazi katika mstari.
theological_decisions:
- issue: Uhusiano kati ya utakatifu wa Mungu na wito wa waamini
  choice: kama yeye aliyewaita alivyo mtakatifu … iweni watakatifu
  alternative: kwa kufuata mfano wa Mtakatifu aliyewaita … iweni watakatifu
  rationale: Chaguo hili huhifadhi ulinganifu wa moja kwa moja wa Kigiriki bila kuongeza wazi wazo la “mfano,” na huhifadhi marudio ya “mtakatifu/watakatifu.”
- issue: Nguvu ya amri γενήθητε
  choice: iweni watakatifu
  alternative: kuweni watakatifu / fanyikeni watakatifu
  rationale: “Iweni watakatifu” ni amri ya kawaida na yenye heshima. Haileti kwa lazima mfumo fulani wa kiteolojia kuhusu mchakato wa kutakaswa, huku tanbihi ikihifadhi uwezekano wa maana ya “kuwa/kuingia katika hali.”
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwenendo” linaeleweka kwa wasomaji wa kawaida na huhifadhi uzito wa kimaadili wa kifungu. Mpangilio wa tanbihi umeunganishwa na maneno yanayohusika moja kwa moja: [a] kwa γενήθητε na [b] kwa ἀναστροφή.'
