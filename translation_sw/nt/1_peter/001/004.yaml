  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: sw
  text: katika urithi usioharibika, usio na unajisi, na usionyauka, uliohifadhiwa mbinguni kwa ajili yenu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: kuingia katika urithi
  rationale: Muktadha wa mstari uliotangulia unaunganisha tumaini hai na kufikia urithi; “kuingia katika” hudumisha mwelekeo wa εἰς bila kuifanya sentensi kuwa ngumu katika Kiswahili.
- source_word: ἄφθαρτον
  choice: usioharibika
  rationale: Hutoa maana ya kutoweza kuoza, kuangamia, au kuharibika, na inalingana na nomino “urithi.”
- source_word: ἀμίαντον
  choice: usio na unajisi
  rationale: Hudumisha wazo la kutotiwa doa au kunajisiwa bila kulipunguza kuwa usafi wa kawaida tu.
- source_word: ἀμάραντον
  choice: usionyauka
  rationale: Hudumisha taswira ya kitu kisichofifia wala kunyauka.
- source_word: τετηρημένην
  choice: uliohifadhiwa
  rationale: Kauli timilifu tendwa inaonyesha urithi ambao umewekwa salama na unaendelea kuhifadhiwa.
- source_word: ἐν οὐρανοῖς
  choice: mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili kwa wingi wa Kigiriki “katika mbingu,” bila kulazimisha wingi usio wa kawaida.
- source_word: εἰς ὑμᾶς
  choice: kwa ajili yenu
  rationale: Katika muktadha wa kitu kilichohifadhiwa, kifungu hiki kinaonyesha walengwa au wanufaika wa urithi.
theological_decisions:
- issue: Uhusiano wa εἰς na “urithi”
  choice: kuingia katika urithi
  alternative: kwa ajili ya urithi
  rationale: “Kuingia katika” huhifadhi mwendo au lengo lililodokezwa na εἰς na kuendana na “alituzalia upya ... kuingia katika” katika sentensi pana, bila kuongeza maelezo ya kidhehebu.
- issue: Mahali urithi unapohifadhiwa
  choice: mbinguni
  alternative: katika mbingu
  rationale: Kiswahili cha kawaida hutumia “mbinguni”; maana ya eneo la kimbingu inadumishwa bila kudai tafsiri maalumu ya mpangilio wa mbingu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Marudio ya “usio...” yamehifadhiwa ili kuonyesha msisitizo wa sifa tatu za Kigiriki.
