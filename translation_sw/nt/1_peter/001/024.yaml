id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: sw
  text: Kwa maana wanadamu wote[a] ni kama nyasi, na utukufu wao wote[b] ni kama ua la nyasi; nyasi zikauka, nalo ua likaanguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wanadamu wote. Kigiriki kinasema kihalisi “kila mwili,” kikitoa mwangwi wa Isaya 40:6 na kusisitiza kuwa wanadamu ni wenye kufa.
    reason: lexical_alternative
  - marker: b
    text: Au “fahari yao yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Kwa maana
  rationale: Inaonyesha kuwa nukuu hii inatoa msingi wa kauli iliyotangulia, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: πᾶσα σὰρξ
  choice: wote wenye mwili
  rationale: Inadumisha picha ya Kigiriki ya ‘mwili’ huku ikimaanisha wanadamu wote katika udhaifu na hali yao ya kufa, si asili yenye dhambi.
- source_word: ὡς χόρτος
  choice: ni kama majani
  rationale: ‘Majani’ ni neno la kawaida katika Kiswahili kwa mimea inayokauka na linafaa katika taswira ya kishairi inayotokana na Isaya 40:6.
- source_word: πᾶσα δόξα αὐτῆς
  choice: utukufu wao wote
  rationale: ‘Utukufu’ huhifadhi maana ya δόξα na mwangwi wa kibiblia; kiwakilishi cha wingi ‘wao’ kinarejelea kwa kawaida ‘wote wenye mwili’ katika Kiswahili.
- source_word: ὡς ἄνθος χόρτου
  choice: ni kama ua la majani
  rationale: Tafsiri hii inadumisha uhusiano wa moja kwa moja kati ya ua na majani badala ya kubadili taswira kuwa ‘ua la kondeni.’
- source_word: ἐξηράνθη
  choice: yalikauka
  rationale: Kitenzi hiki kinaeleza kwa kawaida majani kupoteza ubichi na kukauka.
- source_word: ἐξέπεσεν
  choice: likaanguka
  rationale: Kinadumisha kwa urahisi picha ya ua kudondoka au kuanguka bila kuongeza maelezo yasiyosemwa wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya σάρξ katika nukuu kuhusu hali ya mwanadamu kufa
  choice: wote wenye mwili
  alternative: wanadamu wote
  rationale: Muktadha unahusu udhaifu na maisha mafupi ya wanadamu, si upotovu wa kimaadili. Kutaja ‘mwili’ kunahifadhi pia mwangwi wa Isaya 40:6, huku tanbihi ikifafanua maana.
- issue: Maana ya δόξα katika taswira ya maisha yanayopita
  choice: utukufu
  alternative: fahari
  rationale: ‘Utukufu’ huhifadhi upana na mwangwi wa neno δόξα; katika muktadha huu linaweza kumaanisha pia fahari au uzuri wa nje, jambo linaloonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kishairi unaofaa kwa nukuu ya Maandiko. Muundo wa sentensi na nukta mkato unahifadhi mtiririko wa nukuu kama sentensi moja.
