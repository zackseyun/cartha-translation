id: 1PE.1.17
reference: 1 Peter 1:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: sw
  text: Na ikiwa mnamwita Baba yule anayehukumu bila upendeleo kulingana na kazi ya kila mtu, ishini kwa hofu[b] wakati wa kukaa kwenu kama wageni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au, “kwa kicho” au “kwa hofu yenye staha.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wakati wa ugeni wenu.” Neno la Kigiriki linaweza kumaanisha kuishi kama mgeni au mkazi wa muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: mnamwita
  rationale: Kitenzi hiki hapa kinaonyesha kumwita au kumwelekea Mungu kwa jina la Baba. “Mnamwita Baba” ni Kiswahili cha kawaida na pia kinaacha wazi maana ya kumwomba au kumwitia Mungu.
- source_word: πατέρα
  choice: Baba
  rationale: Neno hili ni kiarifu cha yule anayeitwa; waamini humwita Mungu “Baba.” Herufi kubwa inaonyesha kuwa ni jina linalotumiwa kumrejelea Mungu.
- source_word: ἀπροσωπολήμπτως
  choice: bila upendeleo
  rationale: Usemi huu unaonyesha kuhukumu bila kuzingatia hadhi ya nje wala kumpendelea mtu. “Bila upendeleo” ni wazi na wa kawaida katika Kiswahili.
- source_word: κρίνοντα
  choice: anayehukumu
  rationale: Kivumishi-endelevu cha Kigiriki kinamtambulisha Mungu kuwa yeye anayehukumu. Umbo la Kiswahili “anayehukumu” linadumisha tendo linalomtambulisha.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: kulingana na kazi ya kila mtu
  rationale: κατά pamoja na hali ya kushutumiwa huonyesha kipimo au msingi wa hukumu. ἔργον ni umoja wenye maana ya jumla; “kazi ya kila mtu” inadumisha uwajibikaji wa kila mmoja bila kuongeza mfumo wa kiteolojia.
- source_word: ἐν φόβῳ
  choice: kwa hofu
  rationale: φόβος inaweza kumaanisha hofu, kicho, au hofu yenye staha. “Kwa hofu” inadumisha uzito na mvutano wa neno badala ya kuupunguza kuwa staha pekee.
- source_word: παροικίας
  choice: kukaa kwenu kama wageni
  rationale: Nomino hii hueleza hali ya kuishi mahali kama mgeni au mkazi wa muda. Usemi huu ni wa asili katika Kiswahili na haudokezi bila lazima uhamisho wa kisiasa.
- source_word: ἀναστράφητε
  choice: ishini
  rationale: Katika muktadha huu kitenzi kinaagiza namna ya kuendesha maisha. “Ishini” ni agizo la kawaida, lenye nguvu ya kimaadili, na linaeleweka kwa urahisi.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: wakati wote wa kukaa kwenu kama wageni
  rationale: χρόνον huonyesha muda ambao tendo linaendelea. “Wakati wote” linaonyesha kipindi kizima, na sehemu iliyobaki inadumisha wazo la ukaaji wa muda kama wageni.
theological_decisions:
- issue: Maana ya φόβος kwa kumhusu Mungu ambaye ni Baba na Mwamuzi
  choice: Kudumisha “hofu” katika matini kuu
  alternative: kicho; hofu yenye staha
  rationale: Aya inaunganisha ubaba wa Mungu na hukumu yake isiyo na upendeleo. “Hofu” inadumisha uzito wa kimaadili na mvutano kati ya ukaribu na uwajibikaji badala ya kuufanya usemi kuwa wa staha tu.
- issue: Upeo wa hukumu kulingana na kazi
  choice: Kutafsiri moja kwa moja “kulingana na kazi ya kila mtu”
  alternative: hukumu ya mwisho ya matendo ya waamini; kanuni ya jumla ya tathmini ya Mungu
  rationale: Kigiriki kinasema kwamba Mungu huhukumu bila upendeleo kulingana na kazi ya kila mtu. Tafsiri haipaswi kuingiza msimamo maalumu kuhusu sifa, wokovu, au uhakika wa wokovu ambao aya yenyewe hauelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa msomaji wa kawaida. “Kukaa kwenu kama wageni” limechaguliwa badala ya neno la kifasihi zaidi “uhamiaji” au usemi unaoweza kudokeza uhamisho wa kisiasa. Mpangilio wa sentensi unafuata hoja ya Kigiriki huku ukibaki wa kawaida katika Kiswahili.
