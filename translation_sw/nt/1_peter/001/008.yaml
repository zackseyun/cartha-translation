  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: sw
  text: Ingawa hamjamwona, mnampenda. Ingawa sasa hammwoni, bado mnamwamini na mnafurahi kwa furaha isiyoweza kuelezwa na iliyojaa utukufu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “furaha isiyoweza kuelezwa na iliyotukuzwa,” au “furaha isiyoweza kuelezwa na yenye utukufu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: Ingawa hamjamwona
  rationale: Kirai tegemezi cha hali ya kukubali kinawasilisha kutomwona Kristo hapo awali huku matokeo yake yakiendelea hadi sasa; wakati timilifu wa Kiswahili ni wa kawaida na wazi.
- source_word: ἀγαπᾶτε
  choice: mnampenda
  rationale: Wakati wa sasa unaonyesha upendo unaoendelea, na kiambishi cha yambwa kinamrejelea Kristo kwa kawaida.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: kwa kumwamini
  rationale: Muundo huu unamtaja Kristo kuwa mlengwa wa imani. 'Kumwamini' ni Kiswahili cha kawaida na huhifadhi maana ya kuamini au kuweka imani kwake.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: sasa hammwoni
  rationale: Huhifadhi tofauti ya wakati kati ya kutomwona hapo awali na kutomwona kwa sasa.
- source_word: ἀγαλλιᾶσθε
  choice: mnafurahi
  rationale: Kitenzi kinaonyesha furaha kuu; ukubwa wake unaendelezwa wazi na kirai kinachofuata bila kutumia neno lisilo la kawaida.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: kwa furaha isiyoweza kuelezwa
  rationale: Dativu inaonyesha namna ya kufurahi, na kivumishi kinaeleza furaha iliyo nje ya uwezo wa maneno.
- source_word: δεδοξασμένῃ
  choice: iliyojaa utukufu
  rationale: Kiswahili hiki ni cha asili na kinahifadhi uhusiano na utukufu pamoja na hali inayotokana na tendo la kutukuza; uwezekano wa 'iliyotukuzwa' umewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya πιστεύοντες pamoja na εἰς ὃν
  choice: kwa kumwamini
  alternative: kwa kumtumaini
  rationale: Maandishi yanamtaja Kristo kuwa mlengwa wa imani. 'Kumwamini' ni pana na ya moja kwa moja, bila kupunguza maana iwe tumaini pekee.
- issue: Ufafanuzi wa δεδοξασμένῃ χαρᾷ
  choice: furaha ... iliyojaa utukufu
  alternative: furaha ... iliyotukuzwa; furaha yenye utukufu
  rationale: Participio timilifu ya kutendwa inaweza kusisitiza furaha iliyotukuzwa au iliyopewa utukufu. Matini kuu inatumia Kiswahili kinachoeleweka, huku tanbihi ikihifadhi maumbo mengine yanayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili fupi zinahifadhi ulinganifu wa kutomwona lakini kumpenda na kutomwona sasa lakini kumwamini na kufurahi.
