base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: sw
  text: Yeye alijulikana kabla ya kuwekwa msingi wa ulimwengu[a], lakini alifunuliwa mwishoni mwa nyakati kwa ajili yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alichaguliwa tangu awali.” Kigiriki kinasema “alijulikana kabla”; hilo linaweza kudokeza kusudi la Mungu, lakini halilazimishi maana pana zaidi ya “alichaguliwa” katika matini kuu.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika nyakati hizi za mwisho.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: alijulikana kabla
  rationale: Huhifadhi maana ya msingi ya kitenzi προγινώσκω, ‘kujua kabla,’ bila kuingiza moja kwa moja wazo lenye nguvu zaidi la kuchaguliwa au kuamuliwa tangu awali. Kauli tendwa inahifadhiwa kwa ‘alijulikana.’
- source_word: πρὸ καταβολῆς κόσμου
  choice: kabla ya kuwekwa msingi wa ulimwengu
  rationale: Hii ni namna ya asili na yenye hadhi ya kuwasilisha nahau inayorejelea wakati kabla ya uumbaji, huku ikidumisha taswira ya ‘msingi wa ulimwengu.’
- source_word: φανερωθέντος
  choice: alifunuliwa
  rationale: Neno hili linaonyesha kwamba yeye alidhihirishwa au akawekwa wazi. ‘Alifunuliwa’ ni Kiswahili cha sasa kinachoeleweka na kinachohifadhi kauli tendwa ya Kigiriki.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: mwishoni mwa nyakati
  rationale: Huhifadhi kwa karibu wazo la ‘mwisho wa nyakati’ na uzito wake wa kieskatolojia bila kuongeza neno la kuashiria ‘hizi,’ ambalo halipo wazi katika Kigiriki.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: 'Huwasilisha kwa kawaida maana ya manufaa au kusudi ya διά pamoja na accusative: kufunuliwa kwake kulikuwa kwa manufaa ya wasomaji.'
theological_decisions:
- issue: Maana ya προεγνωσμένου kuhusu Kristo kabla ya uumbaji
  choice: alijulikana kabla
  alternative: alichaguliwa tangu awali; aliwekwa tangu awali
  rationale: Tafsiri kuu inahifadhi dhana ya kujulikana kabla na mvutano wa kiteolojia wa kifungu. Ingawa katika matumizi ya kibiblia kujua kabla kunaweza kuhusisha kusudi la Mungu, neno lenyewe halilazimishi kutafsiri moja kwa moja kuwa kuchaguliwa au kuamuliwa tangu awali.
- issue: Nguvu ya wakati katika ἐπ’ ἐσχάτου τῶν χρόνων
  choice: mwishoni mwa nyakati
  alternative: katika nyakati hizi za mwisho
  rationale: Chaguo hili linafuata kwa karibu muundo wa Kigiriki na haliongezi ‘hizi.’ Tafsiri mbadala ni ya kawaida na inaeleza vizuri kipindi cha mwisho, hivyo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtiririko wa hoja kutoka mstari uliotangulia kwa kutumia ‘Yeye,’ na istilahi za kibiblia zimetumiwa bila kuwa nzito kupita kiasi.
