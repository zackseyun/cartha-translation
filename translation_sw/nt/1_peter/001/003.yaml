  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: sw
  text: Ahimidiwe Mungu na Baba wa Bwana wetu Yesu Masihi[a], ambaye kwa rehema yake nyingi ametufanya tuzaliwe upya[b] ili tuwe na tumaini lililo hai, kwa njia ya ufufuo wa Yesu Masihi kutoka kwa wafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “ametuzalia upya.” Kitenzi cha Kigiriki kinadumisha taswira ya kuzaliwa au kuzalishwa upya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Ahimidiwe
  rationale: Katika kauli hii ya sifa kwa Mungu, “Ahimidiwe” ni Kiswahili cha kawaida na cha heshima; huepuka maana ya kwamba mwanadamu anampa Mungu baraka.
- source_word: θεὸς καὶ πατὴρ
  choice: Mungu na Baba
  rationale: Inahifadhi nomino zote mbili na uhusiano unaoelezwa katika muundo wa Kigiriki.
- source_word: κυρίου
  choice: Bwana
  rationale: Inatunza κύριος kama cheo chenye uzito, si salamu ya heshima tu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” huonyesha Χριστός kama cheo chenye maana badala ya kukifanya tu sehemu ya jina.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: Kwa wingi wa rehema yake
  rationale: Kauli hii ya asili na ya sasa inaonyesha kwamba tendo la Mungu linalingana na ukubwa au wingi wa rehema yake.
- source_word: ἀναγεννήσας
  choice: ametufanya tuzaliwe upya
  rationale: Inahifadhi picha ya kuzaliwa upya na inaonyesha wazi kwamba Mungu ndiye mtendaji.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: ili tuwe na tumaini lililo hai
  rationale: “Ili” huwasilisha lengo au matokeo ya εἰς kwa Kiswahili cha kawaida, huku “tumaini lililo hai” ikihifadhi sitiari ya asili.
- source_word: δι’ ἀναστάσεως
  choice: kwa njia ya kufufuka
  rationale: Inadhihirisha maana ya njia au chombo inayobebwa na διά pamoja na jenitivi.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa kawaida wa Kiswahili katika habari ya ufufuo na unahifadhi wazo la kutoka miongoni mwa waliokufa.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός kama cheo cha Yesu
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” inabeba maana ya cheo cha Χριστός. “Kristo” ni mbadala wa jadi unaojulikana, lakini unaweza kusikika kama sehemu ya jina bila kuonyesha maana ya cheo.
- issue: Uhusika wa Mungu katika ἀναγεννήσας
  choice: ametufanya tuzaliwe upya
  alternative: ametupa uzazi mpya
  rationale: Kigiriki kinamwonyesha Mungu wazi kuwa mtendaji wa kuzaliwa upya. Tafsiri hii inahifadhi uhusika huo bila kuongeza mfumo mpana wa kimadhehebu.
- issue: Uhusiano wa εἰς ἐλπίδα ζῶσαν na kuzaliwa upya
  choice: ili tuwe na tumaini lililo hai
  alternative: kuingia katika tumaini lililo hai
  rationale: Chaguo kuu linaeleza kwa kawaida lengo au matokeo bila kuamua zaidi ya maandishi; mbadala huhifadhi zaidi taswira ya mwelekeo lakini si wa kawaida sana katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kigiriki imegawanywa baada ya kauli ya sifa ili kuongeza uwazi bila kubadili uhusiano wa mawazo.
