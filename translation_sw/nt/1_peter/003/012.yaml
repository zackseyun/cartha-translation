id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: sw
  text: Kwa maana macho ya Bwana huwaelekea wenye haki, na masikio yake husikia maombi yao; lakini uso wa Bwana uko dhidi ya wale wanaotenda maovu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha, neno hili linatoa msingi wa kauli iliyotangulia; “Kwa maana” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kisababishi.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: macho ya Bwana huwaelekea wenye haki
  rationale: Huhifadhi taswira ya macho ya Bwana, huku “huwaelekea” ikionyesha uangalifu unaoelekezwa kwa watu wenye haki.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: masikio yake husikiliza dua yao
  rationale: Kigiriki ni usemi wenye kitenzi kilichodokezwa, kihalisi “masikio yake kuelekea dua yao.” “Husikiliza” huwasilisha kwa Kiswahili maana ya kuwa makini bila kuondoa taswira ya masikio.
- source_word: πρόσωπον δὲ κυρίου
  choice: lakini uso wa Bwana
  rationale: “Uso” huhifadhi taswira ya moja kwa moja ya maandiko na δέ hapa inaonyesha utofauti, hivyo “lakini.”
- source_word: ἐπὶ ποιοῦντας κακά
  choice: uko dhidi ya wale wanaotenda maovu
  rationale: Katika kishazi hiki hasi, ἐπί inaonyesha upinzani; “wale wanaotenda maovu” huhifadhi nguvu ya kitenzi cha participio badala ya kutumia jina la jumla tu.
theological_decisions:
- issue: Lugha ya kimfano kuhusu macho, masikio, na uso wa Mungu
  choice: Kuhifadhi moja kwa moja taswira za macho, masikio, na uso
  alternative: 'Kutafsiri kwa ufafanuzi: “Bwana huwalinda ... husikia ... na huwapinga”'
  rationale: Taswira hizi ni sehemu ya nguvu ya kifasihi na kiteolojia ya dondoo la Zaburi. Kuzihifadhi huepuka kufifisha usemi au kuufanya dai la kimwili lisilokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dua” limetumiwa kwa δέησις kwa kuwa linaonyesha ombi linaloelekezwa kwa Mungu; sentensi imeweka usambamba wa macho, masikio, na uso.
