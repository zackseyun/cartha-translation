  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: sw
  text: Ubatizo, unaolingana na hayo, sasa unawaokoa ninyi pia—si kuondolewa kwa uchafu wa mwili, bali ni ombi kwa Mungu la kuwa na dhamiri njema[a]—kwa njia ya ufufuo wa Yesu aliye Masihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bali ni ahadi inayotolewa kwa Mungu kutokana na dhamiri njema.” Neno la Kigiriki lililotafsiriwa “ombi” (ἐπερώτημα) linaweza pia kueleweka kuwa “ahadi” au “jibu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: unaolingana na hayo
  rationale: Kauli hii inaunganisha ubatizo na tukio la maji lililotangulia. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha ulinganifu huo bila kutumia istilahi nzito ya kitaalamu.
- source_word: σῴζει
  choice: unawaokoa
  rationale: Kitenzi cha wakati uliopo kimetafsiriwa moja kwa moja bila kudhoofisha madai ya andiko; maelezo yanayofuata yanafafanua maana yake.
- source_word: βάπτισμα
  choice: Ubatizo
  rationale: Hili ndilo neno la kawaida na sahihi; muktadha wenyewe unatofautisha ubatizo na kuosha uchafu wa nje.
- source_word: σαρκὸς
  choice: mwili
  rationale: Katika muktadha huu σάρξ inahusu upande wa kimwili unaoweza kuwa na uchafu. 'Mwili' ni Kiswahili cha asili na wazi zaidi hapa kuliko 'nyama'.
- source_word: ἀπόθεσις ῥύπου
  choice: kuondolewa kwa uchafu
  rationale: Kauli hii inaeleza usafishaji wa nje na kuhifadhi tofauti ya Petro kati ya kuondoa uchafu wa mwili na jambo la dhamiri mbele za Mungu.
- source_word: συνειδήσεως ἀγαθῆς
  choice: la kuwa na dhamiri njema
  rationale: Muundo wa Kigiriki umebanwa na unaweza kueleweka kwa njia zaidi ya moja. Katika matini kuu, kauli hii inaonyesha jambo linaloombwa kwa Mungu, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: ἐπερώτημα
  choice: ombi
  rationale: Neno hili linaweza kumaanisha ombi, ahadi, au jibu. 'Ombi' linafaa pamoja na εἰς θεόν, yaani jambo linaloelekezwa kwa Mungu, na halilazimishi teolojia mahususi ya kiapo cha ubatizo.
- source_word: εἰς θεόν
  choice: kwa Mungu
  rationale: Hii inaonyesha wazi anayeelekezewa ombi katika Kiswahili cha kawaida.
- source_word: δι’ ἀναστάσεως
  choice: kwa njia ya ufufuo
  rationale: διά pamoja na hali milikishi inaonyesha njia au chombo; 'kwa njia ya' inahifadhi maana hiyo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός ina nguvu ya cheo hapa. 'Masihi' ni namna ya kawaida ya Kiswahili ya kuhifadhi cheo hicho.
theological_decisions:
- issue: Uhusiano wa ubatizo na wokovu
  choice: Kudumisha kauli ya moja kwa moja kwamba ubatizo 'unawaokoa,' kisha kuacha maelezo ya Petro mwenyewe yaweke mipaka ya maana.
  alternative: Kusema tu kwamba ubatizo ni ishara ya wokovu, au kuongeza ufafanuzi wa kisakramenti wa dhehebu fulani.
  rationale: Andiko linauhusisha ubatizo moja kwa moja na kuokoa, lakini mara moja linakanusha kwamba ni usafishaji wa kawaida wa mwili na linauunganisha na dhamiri mbele za Mungu na ufufuo wa Yesu. Tafsiri haipaswi kudhoofisha wala kupanua madai hayo.
- issue: Maana ya ἐπερώτημα katika muktadha wa ubatizo
  choice: Kutumia 'ombi' katika matini kuu.
  alternative: '''Ahadi'' au ''jibu.'''
  rationale: Maana ya neno hili inabishaniwa kwa halali. 'Ombi' linaendana vizuri na mwelekeo kwa Mungu, lakini 'ahadi' ni uwezekano muhimu na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku uhusiano wa ubatizo na tukio lililotangulia, kauli ya kuokoa, na utata wa ἐπερώτημα vikihifadhiwa.
