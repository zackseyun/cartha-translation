  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: sw
  text: Vivyo hivyo, enyi wake, jitiisheni kwa waume zenu wenyewe, ili hata kama baadhi ya waume hao hawalitii neno[a], wapate kushawishika bila neno kwa mwenendo wa wake zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawautii ujumbe”; yaani, wanaukataa ujumbe wa Injili.
    reason: Mbadala huu unaonyesha kwamba λόγος hapa ni ujumbe wa Injili na kwamba ἀπειθέω inaweza kuhusisha kutokuamini pamoja na kutotii.
lexical_decisions:
- source_word: Ὁμοίως
  choice: Vivyo hivyo
  rationale: Kiunganishi hiki kinaendeleza mawaidha ya mpangilio wa nyumbani kutoka sehemu iliyotangulia kwa Kiswahili cha kawaida na chenye heshima.
- source_word: γυναῖκες
  choice: enyi wake
  rationale: Muktadha wa ‘waume zenu wenyewe’ unahitaji maana ya wake, si wanawake kwa ujumla.
- source_word: ὑποτασσόμεναι
  choice: jitiisheni
  rationale: Kiswahili cha asili hutumia himizo la moja kwa moja hapa; kitenzi cha kujirejelea kinahifadhi wazo la kujiweka chini ya mpangilio bila kuongeza dhana ya utiifu usio na mipaka.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: kwa waume zenu wenyewe
  rationale: ἀνήρ humaanisha mume katika muktadha huu, na ‘wenyewe’ huhifadhi mkazo wa ἰδίοις kwa mwenzi wa ndoa wa mtu.
- source_word: ἵνα
  choice: ili
  rationale: Hutambulisha kusudi au matokeo yanayokusudiwa kwa njia ya kawaida katika Kiswahili.
- source_word: καὶ εἴ τινες
  choice: hata ikiwa baadhi yao
  rationale: ‘Hata ikiwa’ huhifadhi nguvu ya concessive ya καὶ εἴ, na ‘baadhi yao’ humrejelea kwa uwazi baadhi ya waume.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: hawalitii neno
  rationale: Huhifadhi upande wa kutotii katika ἀπειθέω na istilahi ya kibiblia ‘neno,’ huku tanbihi ikifafanua maana ya ujumbe wa Injili.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: kwa mwenendo wa wake zao
  rationale: ‘Mwenendo’ huonyesha namna ya maisha au tabia inayoonekana; ‘wake zao’ huweka wazi uhusiano wa ndoa unaodokezwa.
- source_word: ἄνευ λόγου
  choice: bila neno
  rationale: Huhifadhi usemi mfupi na urudiaji wa λόγος, pamoja na tofauti ya kimakusudi kati ya ‘neno’ la ujumbe na kutosema neno.
- source_word: κερδηθήσονται
  choice: wapate kuvutwa
  rationale: Ni usemi wa kawaida wa Kiswahili kwa maana ya kushawishiwa au kupatikana upande fulani, na hauongezi kwa uwazi hatua maalumu ya wokovu ambayo kitenzi chenyewe hakitaji.
theological_decisions:
- issue: Maana ya ὑποτασσόμεναι katika mawaidha ya nyumbani
  choice: jitiisheni
  alternative: watiini; mkiwa chini ya mamlaka ya
  rationale: Tafsiri inadumisha mpangilio wa uhusiano unaoelezwa na ὑποτάσσω bila kuufanya kuwa amri ya utiifu kamili wala dai la uduni wa asili.
- issue: Maana ya ἀπειθοῦσιν τῷ λόγῳ
  choice: hawalitii neno
  alternative: hawauamini ujumbe; wanakataa kuitii Injili
  rationale: Kitenzi kinaweza kujumuisha kutokuamini na kutotii. Matini kuu huhifadhi mvutano huo kwa ‘hawalitii neno,’ na tanbihi inaonyesha kwamba ‘neno’ ni ujumbe wa Injili.
- issue: Maana ya κερδηθήσονται katika muktadha wa ushuhuda
  choice: wapate kuvutwa
  alternative: wapate kuongolewa; wapate kupatikana
  rationale: ‘Kuvutwa’ huhifadhi sitiari ya kuwavuta au kuwashinda watu bila kutamka moja kwa moja hitimisho la kitheolojia ambalo mstari huu haulielezi kwa neno maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa himizo umetumiwa badala ya tafsiri nzito ya kishiriki, na urudiaji wa ‘neno ... bila neno’ umehifadhiwa kwa sababu ya athari yake ya balagha.
