  rationale: The revision replaces an unnatural and potentially misleading expression with a standard Swahili restraint construction. It preserves the Greek’s generic singular, imperative force, concrete imagery of tongue and lips, and the broad contrast between evil speech and deceitful speech. The existing footnote anchor and lexical alternative are retained.
