id: 1PE.3.10
reference: 1 Peter 3:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: sw
  text: Kwa maana, anayetaka kuupenda uzima na kuona siku njema, basi auzuie ulimi wake usiseme mabaya, na midomo yake isiseme udanganyifu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hila.” Neno la Kigiriki linaweza kumaanisha udanganyifu, hila, au usaliti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: anayetaka
  rationale: Kirai hiki kinamtaja kwa ujumla mtu yeyote mwenye kutaka jambo hilo. Kiswahili kinaweza kuhifadhi umoja na maana jumuishi bila kutaja jinsia.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha msingi wa Maandiko unaounga mkono himizo lililotangulia.
- source_word: ζωὴν ἀγαπᾶν
  choice: kuupenda uzima
  rationale: Huhifadhi kitenzi ‘kupenda’ na nomino ‘uzima’ kwa namna ya asili na yenye hadhi katika Kiswahili.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: kuona siku njema
  rationale: Huhifadhi taswira halisi ya ‘kuona’ huku kirai kikimaanisha kupitia siku zilizo njema; hakifupishi wema huo kuwa ustawi wa mali.
- source_word: παυσάτω
  choice: na auepushe
  rationale: Huwasilisha nguvu ya amri ya nafsi ya tatu na maana ya kuzuia au kujitenga na jambo fulani, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: ulimi wake na uovu
  rationale: Kiambishi milikishi kinaongezwa kwa ufasaha wa Kiswahili, huku ‘uovu’ ukiachwa kuwa mpana kama ilivyo κακόν na taswira ya ulimi ikihifadhiwa.
- source_word: χείλη
  choice: midomo yake
  rationale: Wingi na taswira halisi ya viungo vya usemi vinahifadhiwa; umilikishi unadumisha uhusiano na mtu mmoja anayetajwa.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: isiseme udanganyifu
  rationale: Huwasilisha maana ya kuzuia usemi wa uongo wa hila kwa Kiswahili cha sasa kinachoeleweka; tanbihi inahifadhi mbadala ‘hila’ na upana wa neno la Kigiriki.
theological_decisions:
- issue: Umoja jumuishi na uwakilishi wa jinsia
  choice: Kutumia ‘anayetaka’ pamoja na ‘ulimi wake’ na ‘midomo yake’ bila kumtaja mwanamume.
  alternative: Kutumia ‘yeyote anayetaka’ au kauli ya wingi.
  rationale: Kigiriki kinatumia umoja kwa maana jumuishi. Kiswahili hudumisha umoja huo kwa kawaida bila kuingiza maana maalumu ya jinsia.
- issue: Uhusiano wa kutaka uzima mwema na wajibu wa maadili
  choice: 'Kuhifadhi muundo wa himizo: ‘na auepushe ... na ... isiseme’.'
  alternative: Kutafsiri kama ahadi ya masharti, kana kwamba mwenendo huo unahakikisha siku za mafanikio.
  rationale: Andiko linatoa mwongozo wa maadili kwa anayetaka kuupenda uzima na kuona siku njema; halifafanui hapa kwamba matokeo hayo ni dhamana ya ustawi wa mali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa ulimi na midomo umehifadhiwa bila kuufanya mstari kuwa wa kizamani.
