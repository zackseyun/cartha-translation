review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the generic participial subject, the desire to love life and see good days, and the broad sense of δόλος. However, “auepushe ulimi wake na uovu” is not a sound Swahili construction for restraining speech: it can suggest keeping the tongue away from evil rather than ceasing evil speech. The imperative governing both tongue and lips needs clearer expression.'
  naturalness: The opening is natural, but “na auepushe ulimi wake na uovu” is awkward and its initial “na” after the purpose expression is structurally unnecessary. “Auzuie ulimi wake usiseme mabaya” is idiomatic Standard East African Swahili and clearly conveys the injunction.
  terminology: “Uzima,” “siku njema,” “ulimi,” “midomo,” and “udanganyifu” are appropriate. The footnote’s “hila” is a useful lexical alternative. “Mabaya” in the revised wording naturally represents evil speech without narrowing the verse to a particular kind of wrongdoing.
  issues:
  - severity: medium
    issue: The phrase “auepushe ulimi wake na uovu” is semantically and idiomatically defective.
    rationale: Kiswahili normally expresses restraint of speech with constructions such as “auzuie ulimi wake usiseme mabaya.” The draft’s wording does not clearly express the Greek command to stop the tongue from evil.
  - severity: low
    issue: The connective “na” before “auepushe” is misplaced in the Swahili sentence structure.
    rationale: The imperative consequence follows more naturally with “basi” after the introductory relative clause; this also reflects the exhortative force of παυσάτω.
  revised_text: Kwa maana, anayetaka kuupenda uzima na kuona siku njema, basi auzuie ulimi wake usiseme mabaya, na midomo yake isiseme udanganyifu[a].
  revised_footnotes:
  - marker: a
    text: Au, “hila.” Neno la Kigiriki linaweza kumaanisha udanganyifu, hila, au usaliti.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural and potentially misleading expression with a standard Swahili restraint construction. It preserves the Greek’s generic singular, imperative force, concrete imagery of tongue and lips, and the broad contrast between evil speech and deceitful speech. The existing footnote anchor and lexical alternative are retained.
