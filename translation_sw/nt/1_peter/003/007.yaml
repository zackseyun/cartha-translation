id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: sw
  text: Vivyo hivyo, ninyi waume, ishini na wake zenu kwa ufahamu[a], mkiwapa heshima kama kwa chombo dhaifu zaidi, yaani cha kike[b], na kama pia warithi pamoja wa neema ya uzima[c], ili maombi yenu yasizuiwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ujuzi.”
    reason: lexical_alternative
  - marker: b
    text: “Chombo dhaifu zaidi” ni sitiari ambayo huenda inarejelea udhaifu wa kimwili au mazingira ya kijamii yaliyomweka mwanamke katika hatari zaidi, si kwamba ana thamani ndogo. Sentensi inayofuata inathibitisha kuwa wake pia ni warithi pamoja wa neema ya uzima.
    reason: cultural_note
  - marker: c
    text: Au, “warithi wenza wa neema ya uzima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: ninyi waume
  rationale: Katika muktadha wa maelekezo ya kifamilia baada ya 3:1, neno hili linarejelea waume waliooa, si wanaume kwa ujumla.
- source_word: ὁμοίως
  choice: Vivyo hivyo
  rationale: Inahifadhi kiunganishi cha kulinganisha na maelekezo yaliyotangulia.
- source_word: συνοικοῦντες
  choice: ishini na wake zenu
  rationale: Kitenzi kinahusu kuishi pamoja katika ndoa; kutaja wake kunaweka wazi yule anayelengwa kutokana na muktadha.
- source_word: κατὰ γνῶσιν
  choice: kwa ujuzi
  rationale: 'Inahifadhi upana wa usemi wa Kigiriki: kuishi kwa namna inayoongozwa na ufahamu sahihi. Kiswahili cha kawaida zaidi kimetolewa katika tanbihi.'
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: kama walio chombo dhaifu zaidi
  rationale: Inahifadhi sitiari ya chombo na hali ya ulinganisho ya ‘dhaifu zaidi’ bila kuigeuza kuwa dai la thamani ndogo.
- source_word: ἀπονέμοντες τιμήν
  choice: mkiwapa heshima
  rationale: Ni Kiswahili cha asili kinachoonyesha kumpa mtu heshima inayomstahili.
- source_word: συγκληρονόμοις
  choice: warithi pamoja nanyi
  rationale: Inaeleza wazi ushirika wa wake na waume katika urithi huku ikizingatia umbo linalowezekana la wingi katika ushahidi wa matini.
- source_word: χάριτος ζωῆς
  choice: neema ya uzima
  rationale: 'Inahifadhi muundo na uwezekano wa maana zaidi ya moja: neema iliyo uzima au neema inayotoa uzima.'
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: ili maombi yenu yasizuiwe
  rationale: Inaonyesha kusudi au matokeo na kuhifadhi hali ya kutendwa ya kitenzi.
theological_decisions:
- issue: Maana ya ‘chombo dhaifu zaidi’
  choice: Sitiari na hali ya ulinganisho zimehifadhiwa bila kudai uduni wa thamani au hali ya kiroho.
  alternative: Kufasiri moja kwa moja kuwa dhaifu kimwili au aliye hatarini zaidi kijamii.
  rationale: Matini haitaji aina ya udhaifu; pia inaamuru wake waheshimiwe na kuwaita warithi pamoja wa neema ya uzima.
- issue: Ushirika katika urithi
  choice: Wake wanaelezwa kuwa warithi pamoja na waume wa neema ya uzima.
  alternative: Kufafanua urithi huo moja kwa moja kuwa uzima wa milele au zawadi ya maisha ya sasa.
  rationale: Usemi wa Kigiriki unaacha wigo wa maana wazi, hivyo tafsiri haubani maana kuliko matini.
- issue: Uhusiano wa ὡς καὶ na amri ya kutoa heshima
  choice: Imetafsiriwa ‘kwa kuwa wao pia’ ili kutoa Kiswahili kinachoeleweka na kuonyesha msingi wa kuwaheshimu.
  alternative: ‘kama pia warithi pamoja’ au ‘wakiwa pia warithi pamoja,’ ambazo hufuata umbo la Kigiriki kwa karibu zaidi lakini ni nzito au tata katika Kiswahili.
  rationale: Katika sentensi hii ὡς inaweza kuwasilisha msingi ambao waume wanapaswa kuutambua; tafsiri inaepuka kuongeza tofauti ya hadhi, huku tanbihi ikihifadhi mbadala wa karibu zaidi na umbo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Ishini na wake zenu’ ni cha asili kuliko tafsiri ya neno kwa neno ya ‘kaeni pamoja.’ ‘Chombo’ kimehifadhiwa kwa sababu ni sitiari muhimu ya matini; tanbihi inazuia isieleweke kama dai la uduni wa mwanamke.
