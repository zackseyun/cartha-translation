lexical_decisions:
- source_word: ἐκκλινάτω
  choice: na aache
  rationale: Amri ya nafsi ya tatu, umoja, inaelekeza mtu ajitenge kwa makusudi na uovu. Katika Kiswahili, “aache uovu” ni ya kawaida na hudumisha wazo la kugeuka kutoka mwenendo huo.
- source_word: δὲ
  choice: Bali
  rationale: Kiunganishi hiki kinaendeleza wazo huku kikionyesha utofauti mdogo na mstari uliotangulia; “Bali” kinafaa katika mtiririko wa himizo.
- source_word: ἀπὸ κακοῦ
  choice: uovu
  rationale: Hapa κακόν ina maana ya kimaadili, si madhara au mkosi; “uovu” inaonyesha wazi tofauti yake na mema.
- source_word: ποιησάτω ἀγαθόν
  choice: atende mema
  rationale: “Kutenda mema” ni msemo wa kawaida wa kimaadili na huhifadhi wazo la kuchukua hatua lililo katika kitenzi cha Kigiriki.
- source_word: ζητησάτω
  choice: atafute
  rationale: “Kutafuta” huhifadhi maana ya ζητέω na pia tofauti ya kimakusudi na διώκω inayofuata.
- source_word: εἰρήνην
  choice: amani
  rationale: “Amani” ni tafsiri ya kawaida na pana inayofaa maana ya kibiblia ya εἰρήνη katika muktadha huu.
- source_word: διωξάτω αὐτήν
  choice: na kuifuatilia
  rationale: Kitenzi διώκω hapa kina nguvu ya kuendelea kuifuata amani kwa bidii. Kiambishi “-i-” kinarejelea wazi amani.
- source_word: 3rd person singular imperatives across the verse
  choice: na aache ... atende ... atafute ... kuifuatilia
  rationale: Miundo ya Kiswahili yenye hali tegemezi inadumisha amri za nafsi ya tatu umoja kwa njia ya asili, huku mhusika mmoja akiwa na maana ya uwakilishi.
theological_decisions:
- issue: Nguvu ya uwakilishi ya umoja katika amri
  choice: Kutumia nafsi ya tatu umoja katika matini kuu
  alternative: Kutumia wingi wa kijumla au kuelekeza moja kwa moja kwa “wewe”
  rationale: Kigiriki kina amri za nafsi ya tatu umoja zenye maana ya kumwakilisha mtu yeyote. Kiswahili kinaweza kuhifadhi umoja huo bila kulazimika kutaja jinsia, hivyo maana ya kijumla na umbo la chanzo vyote vinadumishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kishairi wa himizo na mfuatano wa “kutafuta” kisha “kufuatilia” umehifadhiwa.
