  text: Bali aache uovu, atende mema[a]; atafute amani na aifuatie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu yeyote aache uovu, atende mema; atafute amani na aifuatie.” Kigiriki kinatumia umoja wa kiume kwa maana ya kumwakilisha mtu yeyote.
