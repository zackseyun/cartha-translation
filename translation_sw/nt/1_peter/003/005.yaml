  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: sw
  text: Kwa maana, hapo zamani pia wanawake watakatifu waliomtumaini Mungu walijipamba kwa namna hiyo, wakijitiisha kwa waume zao wenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: ndivyo ... walivyojipamba
  rationale: Muundo huu wa Kiswahili unaonyesha namna iliyotajwa katika muktadha uliotangulia na kuhifadhi nguvu ya kielezi cha namna.
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba mstari huu unatoa msingi au maelezo ya himizo lililotangulia.
- source_word: ποτε
  choice: wa zamani
  rationale: Katika muundo 'wanawake ... wa zamani,' inaelekeza kwa wanawake wa vizazi vya kale kwa Kiswahili cha kawaida.
- source_word: ἅγιαι γυναῖκες
  choice: wanawake watakatifu
  rationale: Inahifadhi kivumishi 'watakatifu' bila kukipunguza kuwa sifa ya jumla kama 'wacha Mungu.'
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: waliomtumaini Mungu
  rationale: '''Kumtumaini Mungu'' ni usemi wa asili katika Kiswahili unaowasilisha kumweka Mungu kuwa tegemeo la tumaini.'
- source_word: ἐκόσμουν ἑαυτάς
  choice: walivyojipamba
  rationale: '''Kujipamba'' hudumisha kiungo cha kileksia na mada ya pambo katika muktadha wa karibu.'
- source_word: ὑποτασσόμεναι
  choice: kwa kujitiisha
  rationale: Muundo huu unaonyesha namna walivyojipamba na unahifadhi maana ya ushiriki wa hiari inayoweza kuonyeshwa na umbo la kati.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: kwa waume zao wenyewe
  rationale: '''Waume'' ndiyo maana inayokusudiwa katika muktadha wa ndoa, na ''zao wenyewe'' huhifadhi ἰδίοις na kuweka mipaka ya uhusiano huo.'
theological_decisions:
- issue: Kauli kuhusu kujitiisha katika ndoa
  choice: kwa kujitiisha kwa waume zao wenyewe
  alternative: kwa kuwa chini ya mamlaka ya waume zao
  rationale: Tafsiri iliyochaguliwa huhifadhi uhusiano wa kisarufi wa tendo hili na kujipamba, pamoja na kikomo cha wazi cha 'waume zao wenyewe,' bila kuipanua kauli kuwa dai kuhusu wanawake wote na wanaume wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umetengenezwa upya kidogo ili sentensi isomeke kiasili huku uhusiano wa οὕτως na ἐκόσμουν pamoja na hali ya ὑποτασσόμεναι ukihifadhiwa.
