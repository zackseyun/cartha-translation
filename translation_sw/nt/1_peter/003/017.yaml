base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: sw
  text: Kwa maana ni afadhali kuteseka kwa kutenda mema[a], ikiwa mapenzi ya Mungu yakitaka hivyo[b], kuliko kuteseka kwa kutenda maovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuteseka huku mkitenda mema ... kuliko huku mkitenda maovu.” Miundo ya Kigiriki inaweza kuonyesha sababu (“kwa kutenda”) au, kwa ujumla zaidi, hali inayoandamana na mateso (“huku mkitenda”).
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi Kigiriki kinasema, “ikiwa mapenzi ya Mungu yakitaka hivyo.” Huu ni usemi wa kusisitiza unaorudia wazo la “mapenzi” na “kutaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: ni afadhali
  rationale: Kivumishi cha kulinganisha kimetumika bila kutaja nomino na kwa kawaida hutoa maana ya ‘ni afadhali’; usemi huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huunganisha aya hii na yaliyotangulia kwa kutoa sababu au ufafanuzi.
- source_word: ἀγαθοποιοῦντας
  choice: kwa kutenda mema
  rationale: Kirai endelevu kinatofautishwa na κακοποιοῦντας. ‘Kwa kutenda’ kinaweza kueleweka kuwa sababu ya kuteseka au mazingira ambamo mateso hutokea, bila kulazimisha maana moja pekee; tanbihi inaweka wazi uwezekano huo.
- source_word: εἰ θέλοι
  choice: ikiwa ... yatataka
  rationale: Optative pamoja na εἰ huonyesha hali inayowezekana au yenye masharti. ‘Ikiwa ... yatataka’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo bila kuifanya kuwa kauli ya uhakika.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: mapenzi ya Mungu
  rationale: Hii ndiyo tafsiri ya kawaida, ya moja kwa moja, na yenye hadhi ya muundo huu wa Kigiriki.
- source_word: πάσχειν
  choice: kuteseka
  rationale: Infinitivu inayokamilisha wazo la κρεῖττον; ‘kuteseka’ ni ya moja kwa moja na ya kawaida.
- source_word: ἢ
  choice: kuliko
  rationale: Kiunganishi cha kawaida cha ulinganisho baada ya ‘ni afadhali’.
- source_word: κακοποιοῦντας
  choice: kwa kutenda maovu
  rationale: Inahifadhi ulinganifu wa kisarufi na kimaana na ‘kwa kutenda mema’.
theological_decisions:
- issue: Uhusiano wa mateso na mapenzi ya Mungu
  choice: Aya inasema kwa masharti kwamba huenda kuteseka wakati au kwa sababu ya kutenda mema kukawa ndani ya mapenzi ya Mungu, bila kufafanua namna Mungu anavyohusiana kisababishi na kila tukio la mateso.
  alternative: Kutafsiri kana kwamba Mungu anaamuru moja kwa moja kila tukio la mateso, au kana kwamba anaruhusu tu bila kuhusika kwa namna yoyote.
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ hutaja mapenzi ya Mungu kwa hali ya masharti, lakini haisuluhishi mjadala mpana kuhusu kuamuru na kuruhusu. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. ‘Ni afadhali’ na ‘mapenzi ya Mungu’ ni misemo ya asili yenye uzito unaofaa maandiko. Urudiaji wa ‘kuteseka’ katika sehemu ya pili umeongezwa kwa uwazi wa Kiswahili, kwa kuwa Kigiriki kinautegemeza kutoka sehemu ya kwanza.
