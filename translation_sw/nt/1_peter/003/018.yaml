  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: sw
  text: Kwa maana Masihi pia aliteseka mara moja kwa ajili ya dhambi[a], mwenye haki kwa ajili ya wasio na haki, ili awalete ninyi kwa Mungu[b]. Aliuawa katika mwili, lakini akahuishwa katika roho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “alikufa” badala ya “aliteseka.”
    reason: textual_variant
  - marker: b
    text: Au “akahuishwa kwa Roho.” Kigiriki kinaweza kumaanisha ama “katika roho,” yaani katika hali au nyanja ya roho, ama kwa utendaji wa Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Masihi
  rationale: Limedumishwa kama cheo chenye maana ya Mpakwa Mafuta, badala ya kulifanya jina tu.
- source_word: ἅπαξ
  choice: mara moja
  rationale: Huwakilisha maana ya moja kwa moja ya kielezi bila kuongeza wazi wazo la ‘mara moja tu milele.’
- source_word: περὶ ἁμαρτιῶν
  choice: kwa ajili ya dhambi
  rationale: Katika muktadha huu wa ukombozi, kirai kinaonyesha kuwa mateso yake yalihusu na yalikuwa kwa ajili ya dhambi.
- source_word: ἔπαθεν
  choice: aliteseka
  rationale: Hili ndilo somo la SBLGNT; somo jingine la hati fulani, ‘alikufa,’ limewekwa katika tanbihi.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: mwenye haki kwa ajili ya wasio na haki
  rationale: Huhifadhi ulinganisho na nguvu ya uwakilishi/manufaa bila kufafanua zaidi nadharia fulani ya upatanisho.
- source_word: προσαγάγῃ
  choice: awalete
  rationale: Kitenzi kina maana ya kuwaleta watu mbele ya Mungu au kuwapa njia ya kumfikia; ‘awalete kwa Mungu’ ni Kiswahili cha kawaida na wazi.
- source_word: θανατωθεὶς
  choice: Aliuawa
  rationale: Huhifadhi hali tendwa ya kitenzi, huku sentensi mbili fupi zikifanya Kiswahili kiwe cha kawaida zaidi kuliko muundo mzito wa kishiriki.
- source_word: σαρκὶ
  choice: katika mwili
  rationale: Katika Kiswahili, ‘katika mwili’ huwasilisha kwa kawaida upande wa kuwako kwake kimwili na kwa kufa, bila kutumia ‘mwili wa dhambi.’
- source_word: ζῳοποιηθεὶς
  choice: akahuishwa
  rationale: Huwasilisha hali tendwa ya kupewa uhai kwa ufupi na kwa lugha ya heshima.
- source_word: πνεύματι
  choice: katika roho
  rationale: Huhifadhi ulinganifu wa dative na σαρκί pamoja na utata kati ya eneo/upande wa roho na utendaji wa Roho Mtakatifu.
theological_decisions:
- issue: Maana ya ulinganisho wa σαρκὶ na πνεύματι
  choice: ‘katika mwili ... katika roho’
  alternative: ‘katika mwili ... kwa Roho’
  rationale: Kigiriki kinaweza kueleweka kuwa kinataja nyanja/upande wa kuwako au utendaji wa Roho Mtakatifu. Matini kuu haiamui utata huo; uwezekano wa pili umeonyeshwa katika tanbihi.
- issue: Nguvu ya uwakilishi au ubadala katika δίκαιος ὑπὲρ ἀδίκων
  choice: ‘mwenye haki kwa ajili ya wasio na haki’
  alternative: ‘asiye na hatia badala ya wenye hatia’
  rationale: Tafsiri iliyochaguliwa huonyesha wazi manufaa na uwakilishi, lakini haiongezi maelezo ya kimafundisho ambayo hayajasemwa moja kwa moja na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili ili kuepuka mlolongo mzito wa vishiriki bila kupoteza uhusiano wa kimantiki. ‘Masihi’ limetumiwa kama cheo; ‘wasio na haki’ ni wazi na halina mtindo wa zamani kupita kiasi.
