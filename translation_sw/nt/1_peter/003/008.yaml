id: 1PE.3.8
reference: 1 Peter 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: sw
  text: Hatimaye, ninyi nyote iweni na nia moja, wenye kushiriki hisia za wengine, wenye upendo wa kindugu[a], wenye moyo wa huruma, na wenye unyenyekevu wa moyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye kupendana kama ndugu.” Kigiriki kinatumia lugha ya familia ya ndugu, ikiwajumuisha waumini wote.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za kale zina “wenye adabu” au “wenye urafiki” badala ya “wenye unyenyekevu wa moyo.”
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: Hatimaye
  rationale: Ni kiashirio cha mpito kinachoanzisha muhtasari wa mwisho wa mawaidha; “Hatimaye” ni Kiswahili cha kawaida na chenye heshima katika muktadha huu.
- source_word: πάντες
  choice: ninyi nyote
  rationale: Nomino hii inawahutubia wasikilizaji wote kwa pamoja; “ninyi nyote” huweka wazi usemi huo wa moja kwa moja.
- source_word: ὁμόφρονες
  choice: muwe na nia moja
  rationale: Hueleza umoja wa mtazamo na mwelekeo wa fikira bila kudai kwamba kila mtu lazima awe na maoni sawa katika kila jambo.
- source_word: συμπαθεῖς
  choice: wenye kuhurumiana
  rationale: Huhifadhi wazo la kushiriki na kuguswa na hisia au hali za wengine; umbo la kutendeana linafaa kwa mawaidha yanayoelekezwa kwa jumuiya.
- source_word: φιλάδελφοι
  choice: wenye kupendana kama ndugu
  rationale: Huhifadhi taswira ya kifamilia ya neno la Kigiriki huku “ndugu” katika Kiswahili ikiweza kutumiwa kwa watu wa jinsia zote katika jumuiya.
- source_word: εὔσπλαγχνοι
  choice: wenye moyo wa rehema
  rationale: Hueleza huruma ya ndani na moyo wenye wema; msemo huu ni wa asili, unaeleweka, na huhifadhi taswira ya moyo.
- source_word: ταπεινόφρονες
  choice: wanyenyekevu wa moyo
  rationale: Huhifadhi maana ya unyenyekevu kama mwelekeo wa ndani wa fikira na tabia, badala ya tendo la nje pekee.
theological_decisions:
- issue: Lugha ya kindugu katika φιλάδελφοι
  choice: wenye kupendana kama ndugu
  alternative: wenye upendo wa kindugu; wenye kupendana kama kaka na dada
  rationale: Tafsiri inadumisha taswira ya familia katika Kigiriki. Neno “ndugu” katika Kiswahili sanifu linaweza kujumuisha wanaume na wanawake, hivyo halihitaji upanuzi wa lazima katika matini kuu.
- issue: Tofauti ya matini katika kivumishi cha mwisho
  choice: ταπεινόφρονες = wanyenyekevu wa moyo
  alternative: φιλόφρονες = wenye adabu au wenye urafiki
  rationale: SBLGNT ina ταπεινόφρονες, kwa hiyo maana ya unyenyekevu ndiyo inayowekwa katika matini kuu; usomaji mwingine muhimu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umehifadhiwa kwa urahisi wa kusoma, huku vivumishi vya Kigiriki vikielezwa kwa vifungu vya asili vya Kiswahili. Kila alama ya tanbihi imetiwa katika matini kuu.
