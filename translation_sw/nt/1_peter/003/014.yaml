id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: sw
  text: Lakini hata kama mtateseka kwa sababu ya haki, heri yenu. Msiogope hofu yao[a], wala msifadhaike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msiwaogope” au “msiogope kile wanachokiogopa.” Kauli ya Kigiriki “hofu yao” inafuata kwa karibu maneno ya Isaya 8:12 na inaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: Lakini hata kama mtateseka
  rationale: 'Muundo huu unaonyesha hali ya uwezekano yenye maana ya kukubali jambo: mateso yanaweza kutokea ingawa kufanya yaliyo ya haki kungetarajiwa kuleta mema. “Hata kama” huleta maana hiyo kwa Kiswahili cha kawaida, na “mtateseka” hudumisha uwezekano huo bila kuufanya kuwa tukio la hakika.'
- source_word: διὰ δικαιοσύνην
  choice: kwa sababu ya haki
  rationale: διά pamoja na hali ya accusative inaonyesha sababu. “Kwa sababu ya haki” ni ya asili katika Kiswahili na huhifadhi neno kuu δικαιοσύνη bila kulifupisha kuwa tendo moja tu kama “kufanya mema.”
- source_word: μακάριοι
  choice: heri yenu
  rationale: “Heri yenu” ni usemi wa Kiswahili unaoeleweka na wenye hadhi ya kibiblia kwa hali ya kupata kibali au neema, si furaha ya kihisia tu. Pia huonyesha wazi kwamba wasomaji ndio wanaoitwa wenye heri.
- source_word: τὸν ... φόβον αὐτῶν
  choice: hofu yao
  rationale: 'Kivumishi kimilikishi cha Kigiriki kina utata: kinaweza kumaanisha hofu wanayoisababisha, au jambo ambalo wao hulihofu. “Hofu yao” hufuata kwa karibu mwangwi wa Isaya 8:12 na kudumisha utata huo.'
- source_word: μὴ φοβηθῆτε
  choice: Msiogope
  rationale: 'Ni katazo kwa wingi. “Msiogope” ni la kawaida na huhifadhi urudiaji wa mzizi wa maana kati ya φόβον na φοβηθῆτε: “hofu ... msiogope.”'
- source_word: μηδὲ ταραχθῆτε
  choice: wala msifadhaike
  rationale: “Msifadhaike” huwasilisha hali ya kushtushwa au kuvurugika moyoni, huku “wala” ikiunganisha katazo la pili kwa njia ya kawaida.
theological_decisions:
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: kutenda yaliyo sawa; uadilifu
  rationale: Katika muktadha huu neno linahusu mwenendo unaolingana na mapenzi ya Mungu, lakini neno la jumla “haki” huhifadhi upana wa kimaadili na kiteolojia wa δικαιοσύνη bila kulifanya lihusu haki ya kijamii peke yake au tendo moja maalumu.
- issue: Utata wa τὸν φόβον αὐτῶν
  choice: hofu yao
  alternative: kuwaogopa wao; kile wanachokiogopa
  rationale: Kauli hiyo ina mwangwi wa Isaya 8:12 na inaweza kueleweka kwa zaidi ya namna moja. Tafsiri kuu haipaswi kuamua kimya-kimya ikiwa ni hofu wanayoisababisha au hofu waliyo nayo; maelezo ya chini yanataja uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Heri yenu” hudumisha sauti ya kibiblia bila kuwa ya kizamani; “hofu yao” imeachwa kwa makusudi ili kuhifadhi mwangwi wa Maandiko na utata wa chanzo.
