  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: sw
  text: bali utu wa siri wa moyoni[a], katika uzuri usioharibika[b] wa roho ya upole na utulivu[c], ambao ni wa thamani kubwa mbele za Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “mtu wa siri wa moyoni.” Neno la Kigiriki linaweza kumaanisha mtu au mwanadamu kwa ujumla; hapa linamaanisha nafsi ya ndani.'
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika kile kisichoharibika cha roho ya upole na utulivu.” Neno “uzuri” limeongezwa kutokana na ulinganisho na mapambo ya nje katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: c
    text: “Utulivu” hapa hurejelea hali ya ndani yenye amani; haimaanishi lazima kunyamaza.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: utu wa ndani uliofichika moyoni
  rationale: Kirai hiki kinamaanisha nafsi ya ndani, si mwanamume. “Utu wa ndani” ni Kiswahili cha asili kinachoeleweka, huku “uliofichika moyoni” kikihifadhi wazo la κρυπτός na καρδία bila kuleta umahususi wa kijinsia usiokuwamo hapa.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: katika uzuri usioharibika
  rationale: Kigiriki kina kivumishi kilichotumiwa bila nomino iliyotajwa wazi. “Uzuri” umeongezwa kutokana na muktadha wa urembo wa nje katika mstari uliotangulia; “usioharibika” huhifadhi maana kuu ya ἀφθάρτῳ.
- source_word: πραέως
  choice: upole
  rationale: “Upole” huwasilisha πραΰς kwa Kiswahili cha sasa bila kudokeza udhaifu.
- source_word: ἡσυχίου
  choice: utulivu
  rationale: Katika muktadha huu neno linamaanisha hali tulivu na yenye amani, wala si lazima kutosema. “Utulivu” huepuka maana finyu ya ukimya wa sauti.
- source_word: πνεύματος
  choice: roho
  rationale: “Roho” ndiyo sawia ya moja kwa moja na huhifadhi lugha ya kiantropolojia ya andiko; “tabia” ingekuwa fasiri zaidi.
- source_word: ὅ ἐστιν
  choice: ambao ni
  rationale: Kiwakilishi hiki kinaunganisha tathmini inayofuata na uzuri wa roho uliotajwa kabla; upatanisho wa “ambao” unafuata “uzuri” katika Kiswahili.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida na wenye hadhi unaoonyesha tathmini ya Mungu.
- source_word: πολυτελές
  choice: wa thamani kubwa
  rationale: Huwasilisha wazo la kitu chenye thamani kuu au cha gharama kubwa na kudumisha ulinganisho na mapambo ya nje.
theological_decisions:
- issue: Usemi wa kiantropolojia katika muktadha unaowahusu wanawake
  choice: “utu wa ndani uliofichika moyoni,” bila kutumia neno linalomaanisha mwanamume
  alternative: “mtu wa siri wa moyoni” au “mwanadamu wa ndani”
  rationale: ἄνθρωπος hapa humaanisha nafsi ya ndani, si jinsia ya kiume. “Utu wa ndani” hudumisha maana hiyo katika Kiswahili cha kawaida na huepuka kidokezo cha mwanamume ambacho kingepotosha muktadha.
- issue: Kuongeza nomino iliyodokezwa na ἀφθάρτῳ
  choice: 'Kuongeza “uzuri”: “katika uzuri usioharibika”'
  alternative: “katika kile kisichoharibika” au “katika sifa isiyoharibika”
  rationale: Kigiriki ni kifupi na kinaacha nomino bila kutajwa. Muktadha wa mapambo katika mstari wa 3 unaunga mkono “uzuri,” lakini tanbihi inaweka wazi kuwa neno hilo limejazwa kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umetiririshwa kwa urahisi wa usomaji huku ukihifadhi sitiari ya moyo na roho, ubainifu wa kile kisichoharibika, na tathmini ya Mungu.
