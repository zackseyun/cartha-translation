id: 1PE.3.22
reference: 1 Peter 3:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: sw
  text: ambaye yuko kwenye mkono wa kuume wa Mungu, baada ya kwenda mbinguni, huku malaika, mamlaka na nguvu zikiwa zimetiishwa kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅς
  choice: ambaye
  rationale: Kiwakilishi rejeshi kinamrejelea Yesu Kristo katika mstari uliotangulia na kuhifadhi muunganisho wa sentensi ya Kigiriki.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: mkono wa kuume wa Mungu
  rationale: Nahau hii ya kibiblia inahifadhi picha ya nafasi ya heshima na mamlaka bila kuifafanua kupita kiasi.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: baada ya kwenda mbinguni
  rationale: Huwasilisha tendo lililotangulia huku ‘mbinguni’ ikiwa njia ya kawaida ya Kiswahili ya kueleza mwendo kuelekea au kuingia mbinguni.
- source_word: ὑποταγέντων αὐτῷ
  choice: zikiwa zimetiishwa chini yake
  rationale: Huhifadhi hali ya kutendwa na maana ya viumbe na mamlaka kuwekwa chini ya utawala wake; ‘chini yake’ ni Kiswahili cha asili zaidi kuliko ‘kwake’ katika muundo huu.
- source_word: ἀγγέλων
  choice: malaika
  rationale: Katika muktadha wa kuinuliwa kwa Kristo na nguvu za ulimwengu wa kiroho, neno hili linamaanisha viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: ἐξουσιῶν
  choice: mamlaka
  rationale: Huhifadhi wazo la wenye mamlaka au madaraka na kulitofautisha na ‘nguvu’ linalofuata.
- source_word: δυνάμεων
  choice: nguvu
  rationale: Ni tafsiri fupi na ya kawaida ya neno hili katika orodha ya nguvu za ulimwengu wa kiroho.
theological_decisions:
- issue: Kuinuliwa kwa Kristo mkono wa kuume wa Mungu
  choice: Kuhifadhi nahau ya kibiblia ‘mkono wa kuume wa Mungu’.
  alternative: mahali pa heshima kuu kando ya Mungu
  rationale: Nahau ya chanzo ina uzito wa kimahali na kimamlaka; kuibadili kuwa maelezo ya heshima pekee kungepunguza maana yake.
- issue: Utambulisho wa malaika, mamlaka na nguvu
  choice: Kuhifadhi orodha pana bila kusema kama wote ni wema, waovu, au mchanganyiko.
  alternative: viumbe wa kimalaika pekee; au nguvu za kiroho zenye uadui pekee
  rationale: Kigiriki hakiainishi maadili ya makundi haya, kwa hiyo tafsiri haipaswi kuingiza mfumo mwembamba wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Baada ya kwenda’ hutiririsha kishiriki cha Kigiriki kwa kawaida, na ‘huku ... zikiwa zimetiishwa’ huhifadhi uhusiano wa kisarufi bila kufanya sentensi kuwa nzito.
