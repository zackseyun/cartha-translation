review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the relative connection to the preceding reference, the exaltation idiom, the antecedent movement into heaven, and the threefold list. However, the locative expression lacks the required Swahili locative marker: “yuko mkono wa kuume” is not well formed as written. The passive subjection is adequately represented by “zikiwa zimetiishwa,” and “kwake” directly reflects αὐτῷ without adding an unnecessary spatial nuance.'
  naturalness: Adding “kwenye” makes the biblical idiom grammatical and natural in Standard East African Swahili. The participial relationships are conveyed smoothly by “baada ya kwenda mbinguni” and “huku ... zikiwa zimetiishwa.”
  terminology: “Mkono wa kuume wa Mungu,” “mbinguni,” “malaika,” “mamlaka,” and “nguvu” are suitable, established biblical terminology. “Kwake” is preferable here to “chini yake,” since the latter is interpretively more spatial whereas the Greek dative states the one to whom they are subjected.
  issues:
  - severity: medium
    issue: Missing locative marker in “ambaye yuko mkono wa kuume wa Mungu.”
    rationale: The Greek ἐν requires a locative expression, and Standard Swahili requires “kwenye” (or “katika”) here. Without it, the clause is grammatically defective.
  - severity: low
    issue: “Chini yake” is less direct than the source’s dative αὐτῷ.
    rationale: Subjection certainly implies being under Christ’s authority, but “kwake” more directly preserves the passive construction “subjected to him” without adding spatial imagery.
  revised_text: ambaye yuko kwenye mkono wa kuume wa Mungu, baada ya kwenda mbinguni, huku malaika, mamlaka na nguvu zikiwa zimetiishwa kwake.
  revised_footnotes: []
