revisions:
- from: ambaye yuko mkono wa kuume wa Mungu, baada ya kwenda mbinguni, huku malaika, mamlaka na nguvu zikiwa zimetiishwa chini yake.
  to: ambaye yuko kwenye mkono wa kuume wa Mungu, baada ya kwenda mbinguni, huku malaika, mamlaka na nguvu zikiwa zimetiishwa kwake.
  rationale: The revision corrects the malformed locative phrase by adding “kwenye” and renders the recipient of subjection as “kwake,” while retaining the draft’s natural formal register, participial sequencing, and deliberate non-specification of the moral identity of the heavenly powers.
