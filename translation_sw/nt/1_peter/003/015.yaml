  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: sw
  text: Lakini mioyoni mwenu, mhesabuni Masiya aliye Bwana kuwa mtakatifu[a]. Iweni tayari siku zote kutoa utetezi kwa kila mtu anayewauliza sababu kuhusu tumaini lililo ndani yenu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata maneno ya Kigiriki kwa karibu zaidi: “mtakaseni Masiya kuwa Bwana mioyoni mwenu.”'
    reason: lexical_alternative
  - marker: b
    text: “Ndani yenu” pia inaweza kueleweka kuwa “miongoni mwenu.”
    reason: genuine_ambiguity
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: Masiya aliye Bwana
  rationale: Χριστός limetafsiriwa kama cheo “Masiya,” na κύριος kama “Bwana.” Muundo huu unahifadhi utambulisho wa Masiya kuwa Bwana bila kuifanya “Kristo” kuwa jina lisilotafsiriwa.
- source_word: ἁγιάσατε
  choice: mhesabuni ... kuwa mtakatifu
  rationale: Kitenzi humaanisha kutakasa au kutambua kuwa mtakatifu. Kwa kuwa Masiya ndiye mtendewa, usemi huu unaonyesha waumini kumtambua na kumheshimu kama mtakatifu, si kumfanya awe mtakatifu.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: mioyoni mwenu
  rationale: Huhifadhi wazo la ndani ya nafsi na wingi wa kiwakilishi.
- source_word: ἕτοιμοι ἀεὶ
  choice: Muwe tayari siku zote
  rationale: Ni Kiswahili cha kawaida kinachohifadhi wazo la utayari wa daima.
- source_word: πρὸς ἀπολογίαν
  choice: kutoa utetezi
  rationale: ἀπολογία ni jibu la kujitetea au maelezo yanayotetea msimamo; “kutoa utetezi” huhifadhi uzito huo kuliko “kujibu” pekee.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: mbele ya kila mtu anayewauliza sababu
  rationale: παντί ina maana jumuishi ya “kila mtu,” na λόγος hapa ni sababu au maelezo yanayoombwa.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: ya tumaini lililo ndani yenu
  rationale: Hufuata kwa karibu uhusiano wa kirai cha Kigiriki na kuhifadhi hali ya tumaini kuwamo ndani ya waumini au miongoni mwao.
theological_decisions:
- issue: Maana ya Χριστός
  choice: Masiya
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός ni cheo cha yule aliyeahidiwa, hivyo “Masiya” huwasilisha maana ya cheo hicho moja kwa moja.
- issue: Maana ya ἁγιάσατε Masiya akiwa mtendewa
  choice: mhesabuni ... kuwa mtakatifu
  alternative: mtakaseni Masiya kuwa Bwana
  rationale: Chaguo hili huepuka kudokeza kwamba waumini wanamfanya Masiya awe mtakatifu, huku likihifadhi amri ya kumtambua kama mtakatifu mioyoni mwao.
- issue: Uhusiano wa κύριον na Χριστόν
  choice: Masiya aliye Bwana
  alternative: Masiya kuwa Bwana
  rationale: Kigiriki kinaweza kuwasilishwa kama kumtakasa Masiya “akiwa Bwana” au “kuwa Bwana.” Tafsiri kuu inatamka uhusiano huo kwa Kiswahili cha asili, huku tanbihi ikihifadhi muundo wa karibu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mhesabuni ... kuwa mtakatifu” limetumiwa ili kuwasilisha ἁγιάσατε kwa kawaida bila kupoteza maana yake ya utakatifu; “kutoa utetezi” huhifadhi ladha ya maelezo ya kutetea imani.
