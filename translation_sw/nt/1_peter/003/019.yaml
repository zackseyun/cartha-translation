lexical_decisions:
- source_word: ἐν ᾧ
  choice: katika hiyo
  rationale: Kirai hiki kinadumisha maana ya msingi ya ‘katika ambayo/hiyo’ na uhusiano wake na wazo lililotangulia, bila kuamua kama maana ni hali, nafsi, au chombo.
- source_word: καὶ
  choice: pia
  rationale: Hapa καί inaongeza tendo jingine linalohusiana na sentensi iliyotangulia; ‘pia’ huonyesha nyongeza hiyo kwa Kiswahili cha kawaida.
- source_word: τοῖς ... πνεύμασιν
  choice: roho
  rationale: ‘Roho’ ndilo neno la moja kwa moja na halitambulishi viumbe hawa kuwa wanadamu waliokufa au malaika walioanguka.
- source_word: ἐν φυλακῇ
  choice: zilizokuwa gerezani
  rationale: φυλακή hapa hueleweka kiasili kuwa mahali pa kufungwa au kuzuiliwa; ‘gerezani’ ni tafsiri wazi bila kuongeza maelezo yasiyomo.
- source_word: πορευθεὶς
  choice: alikwenda
  rationale: Kitenzi-shirikishi cha Kigiriki kimewasilishwa kwa kitenzi kamili ili sentensi iwe ya kawaida katika Kiswahili, huku wazo la kwenda likihifadhiwa.
- source_word: ἐκήρυξεν
  choice: akazitangazia
  rationale: κηρύσσω humaanisha kutoa tangazo hadharani. ‘Akazitangazia’ huhifadhi wazo la kutangaza bila kudai kwamba ujumbe ulikuwa Injili, hukumu, au tangazo la ushindi.
theological_decisions:
- issue: Kirejeleo cha ἐν ᾧ
  choice: Imetafsiriwa kwa namna isiyoamua mjadala kuwa ‘katika hiyo.’
  alternative: ‘ndani yake’ au ‘kwa hiyo’
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja kuhusiana na fungu lililotangulia. Tafsiri haipaswi kuamua kimyakimya namna au njia ya tangazo la Kristo.
- issue: Utambulisho wa ‘roho zilizokuwa gerezani’
  choice: Utambulisho wao haujafafanuliwa katika matini kuu.
  alternative: Wanadamu waliokufa, malaika walioanguka, au kundi pana la roho zilizofungwa
  rationale: Kirai cha Kigiriki hakiwatambulishi kwa uhakika wa kutosha; kutaja kundi maalumu kungeingiza tafsiri ya kitheolojia ndani ya matini.
- issue: Aina ya ujumbe katika ἐκήρυξεν
  choice: Imetafsiriwa ‘akazitangazia.’
  alternative: ‘akazihubiria’ au ‘akazitolea tangazo’
  rationale: Kitenzi chenyewe kinaonyesha tendo la kutangaza lakini hakitaji yaliyomo katika ujumbe; kwa hiyo tafsiri haibainishi kama ulikuwa ujumbe wa wokovu, hukumu, au ushindi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘alikwenda akazitangazia’ ni wa kawaida na huhifadhi tendo la kwenda pamoja na kutangaza. Upatanisho wa ngeli katika ‘roho zilizokuwa’ na kiambishi ‘-zi-’ umefuata matumizi ya kawaida ya nomino ‘roho’ katika wingi.
