  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: sw
  text: bali kwa upole na hofu[a], mkiwa na dhamiri njema, ili katika jambo ambalo mnalisingiziwa[b], wale wanaokashifu mwenendo wenu mwema katika Masihi[c] waaibishwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa upole na kicho,” au “kwa upole na heshima.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika jambo ambalo mnasemwa vibaya.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki “katika Kristo”; yaani, katika Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: upole
  rationale: “Upole” huonyesha mwenendo wa unyenyekevu usio mkali na ni neno la kawaida, lenye heshima katika Kiswahili cha sasa.
- source_word: φόβου
  choice: hofu
  rationale: “Hofu” huhifadhi upana wa neno la Kigiriki, ambalo hapa linaweza kueleweka pia kuwa kicho au heshima; kitu kinachoogopwa hakijatajwa wazi.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: mkiwa na dhamiri njema
  rationale: Muundo huu huhifadhi hali inayoandamana na agizo na kurudia wazo la wema lililomo pia katika maelezo ya mwenendo.
- source_word: ἐν ᾧ
  choice: katika jambo lile
  rationale: Kirai hiki hudumisha rejeo pana la jambo au eneo ambamo wasomaji wanasemwa vibaya bila kulifafanua kupita maandishi.
- source_word: καταλαλεῖσθε
  choice: mnalisingiziwa
  rationale: “Kusingiziwa” hutoa maana ya kusemwa kwa uadui au kwa kuchafuliwa jina, kwa Kiswahili cha kawaida na chenye nguvu inayolingana na muktadha.
- source_word: καταισχυνθῶσιν
  choice: waaibishwe
  rationale: Huhifadhi kauli tendwa na dhana ya kusudi au matokeo iliyo katika ἵνα pamoja na hali ya utegemezi.
- source_word: ἐπηρεάζοντες
  choice: wanaokashifu
  rationale: “Kukashifu” huonyesha shambulio la uadui dhidi ya mwenendo wa waamini na linafaa hasa katika muktadha wa maneno ya lawama.
- source_word: ἀναστροφήν
  choice: mwenendo
  rationale: “Mwenendo” ni tafsiri fupi na ya kawaida ya namna ya kuishi, huku ikihifadhi mkazo wa kimaadili.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Χριστός hapa linafanya kazi kama cheo; “Masihi” huwasilisha maana ya cheo hicho badala ya kulinakili tu.
- source_word: ἀγαθὴν
  choice: mwema/njema
  rationale: Mzizi mmoja wa Kiswahili umetumiwa kwa dhamiri na mwenendo ili kuhifadhi urudiaji wa ἀγαθός kwa namna inayopatana kisarufi na nomino husika.
theological_decisions:
- issue: Maana ya φόβου katika kirai “kwa upole na hofu”
  choice: hofu bila kutaja kitu kinachoogopwa
  alternative: kicho; heshima; kumcha Mungu
  rationale: Muktadha wa karibu hautaji wazi mhusika au kitu kinachoogopwa. Tafsiri pana huhifadhi mvutano huo badala ya kuamua kwamba ni kumcha Mungu au kuwaheshimu watu.
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki maana ya cheo bado iko hai; “Masihi” huiwasilisha wazi, huku tafsiri ya kimapokeo “Kristo” ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi uhusiano wa kishiriki na kusudi uliomo katika Kigiriki, bila kufafanua zaidi kitu kinachoogopwa au jambo ambalo waamini wanasemwa vibaya.
