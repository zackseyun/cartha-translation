  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: sw
  text: ambao hapo zamani waliasi, wakati subira ya Mungu ilipokuwa ikingoja katika siku za Noa, safina ilipokuwa ikitengenezwa. Katika safina hiyo waliingia watu wachache—yaani, watu wanane[a]—na wakafikishwa salama kupitia maji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi wanane.”
    reason: lexical_alternative
  - marker: b
    text: Au, “waliokolewa kupitia maji”; pia yaweza kuwa “waliokolewa kwa njia ya maji.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν ποτε
  choice: ambao hapo zamani hawakutii
  rationale: Kitenzi ἀπειθέω kinaonyesha kukataa kutii; ποτε huonyesha wakati wa zamani. Tafsiri hii ni ya kawaida katika Kiswahili na haipunguzi maana kuwa kutokuamini kiakili tu.
- source_word: ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία
  choice: uvumilivu wa Mungu ulipokuwa ukingoja
  rationale: Kauli ya wakati uliopita isiotimilika inaonyesha kungoja kulikokuwa kukiendelea. Muundo huu pia unadumisha taswira ya Kigiriki ambamo uvumilivu wa Mungu ndio unaongoja.
- source_word: κατασκευαζομένης κιβωτοῦ
  choice: safina ilipokuwa ikitengenezwa
  rationale: κατασκευάζω hapa ni kutayarisha au kutengeneza. 'Ikitengenezwa' ni ya asili na inafaa muktadha wa safina bila kubana maana kuwa ujenzi pekee.
- source_word: εἰς ἣν
  choice: ni ndani yake
  rationale: εἰς huonyesha kuingia ndani ya safina. Kwa Kiswahili, 'ni ndani yake' huunganisha sentensi kwa ufasaha huku muktadha ukidokeza kuingia humo.
- source_word: ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί
  choice: watu wachache—yaani, watu wanane
  rationale: ψυχαί hutumiwa kuhesabu watu, si kutoa fundisho maalumu kuhusu nafsi. Kurudia 'watu' kunafanya hesabu iwe wazi kwa msomaji wa kawaida.
- source_word: διεσώθησαν δι’ ὕδατος
  choice: walifikishwa salama kupitia maji
  rationale: διασῴζω husisitiza kuhifadhiwa na kufikishwa salama katikati ya hatari. 'Kupitia maji' huhifadhi uwezekano wa διά kuonyesha kupitia au kwa njia ya maji bila kuamua mapema uhusiano wa kiteolojia na ubatizo katika mstari unaofuata.
theological_decisions:
- issue: Maana ya wokovu au kuhifadhiwa katika διεσώθησαν
  choice: walifikishwa salama kupitia maji
  alternative: waliokolewa kupitia maji
  rationale: Katika simulizi la gharika, kitenzi kinaeleza kuhifadhiwa salama katika hatari. Tafsiri kuu inaweka mbele tukio halisi bila kuondoa maana pana ya kuokolewa; mbadala umewekwa katika tanbihi ili kudumisha mvutano wa kiteolojia kuelekea mstari unaofuata.
- issue: Maana ya ψυχαί
  choice: watu
  alternative: nafsi
  rationale: Hapa neno linahesabu wanadamu waliokuwa ndani ya safina, wala halilazimishi mgawanyo wa kiteolojia kati ya mwili na nafsi. Mbadala wa karibu zaidi na umbo la Kigiriki umehifadhiwa katika tanbihi.
- issue: Nguvu ya διὰ pamoja na ὕδατος
  choice: kupitia maji
  alternative: kwa njia ya maji
  rationale: Kishazi kinaweza kueleweka kwa upande wa kupita katikati ya maji au maji kuwa njia inayohusika. Tafsiri kuu na tanbihi hazifungi uwezekano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili ili kuepuka sentensi ndefu isiyo ya asili, lakini uhusiano wa kisarufi na mstari uliotangulia umehifadhiwa kwa 'ambao'. Alama zote za tanbihi zimewekwa katika matini kuu.
