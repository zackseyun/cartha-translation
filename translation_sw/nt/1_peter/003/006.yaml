  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: sw
  text: kama Sara alivyomtii Abrahamu, akimwita bwana. Nanyi mmekuwa watoto wake ikiwa mnatenda mema na hamuogopi kitisho chochote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hofu yoyote” au “jambo lolote la kutisha.”
    reason: Neno la Kigiriki πτόησις linaweza kumaanisha kitisho, hofu kuu, au jambo linalotia hofu.
lexical_decisions:
- source_word: ὡς
  choice: kama ... alivyofanya
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba Sara anatolewa kuwa mfano unaolingana na himizo lililotangulia.
- source_word: ὑπήκουσεν
  choice: alimtii
  rationale: Kitenzi ὑπακούω hapa kina maana ya kutii au kusikia na kufuata; “alimtii” ni tafsiri ya moja kwa moja na ya kawaida pamoja na yambwa Abrahamu.
- source_word: κύριον
  choice: bwana
  rationale: Hapa si cheo cha Mungu, bali ni jina la heshima ambalo Sara alimpa Abrahamu. Herufi ndogo inazuia maana ya kimungu isidhaniwe.
- source_word: καλοῦσα
  choice: akimwita
  rationale: Huhifadhi maana ya usemi wa Sara na huonyesha namna au ushahidi wa utii wake.
- source_word: ἧς ... τέκνα
  choice: watoto wake
  rationale: Kiwakilishi kinamrejelea Sara, na “watoto wake” huhifadhi taswira ya uhusiano wa kifamilia kwa Kiswahili cha kawaida.
- source_word: ἐγενήθητε
  choice: mmekuwa
  rationale: Hueleza kuingia katika hali au utambulisho ambao matokeo yake yanaendelea kuwapo sasa.
- source_word: ἀγαθοποιοῦσαι
  choice: ikiwa mnatenda mema
  rationale: Kishiriki kina uhusiano wa kimasharti katika muktadha; “ikiwa” huufanya uhusiano huo ueleweke kwa kawaida katika Kiswahili bila kuubadili kuwa dai pana zaidi.
- source_word: μὴ φοβούμεναι
  choice: hamwogopi
  rationale: Kauli ya kitenzi iliyonyambuliwa ni ya asili katika Kiswahili na huwasilisha hali inayoendelea ya kutokuwa na hofu.
- source_word: μηδεμίαν πτόησιν
  choice: kitisho chochote
  rationale: πτόησις inaweza kumaanisha hofu, jambo la kutisha, au kitisho. “Kitisho chochote” kinafaa katika muktadha wa shinikizo au vitisho, huku tanbihi ikihifadhi maana nyingine halali.
theological_decisions:
- issue: Utii wa Sara kama mfano kwa wake Wakristo
  choice: Kutumia “alimtii” bila kuongeza dai pana la kimafundisho kuhusu ndoa.
  alternative: Kutumia neno hafifu zaidi kama “alijinyenyekeza kwa.”
  rationale: “Alimtii” ndiyo maana ya wazi ya ὑπήκουσεν. Tafsiri haipaswi kuipunguza kwa sababu za kitamaduni wala kuipanua kuwa mfumo kamili wa mafundisho ya ndoa.
- issue: Nguvu ya kimasharti ya ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι
  choice: Kuieleza kwa “ikiwa mnatenda mema na hamwogopi...”
  alternative: 'Kuieleza kwa maelezo ya hali: “mkitenda mema na bila kuogopa...”'
  rationale: Vishiriki vinaeleza namna wasomaji wanavyojionyesha kuwa watoto wa Sara, vikiwa na dhana ya kimasharti. “Ikiwa” huweka wazi uhusiano huo huku ikihifadhi mvutano wa himizo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Bwana” limeandikwa kwa herufi ndogo kwa sababu linamhusu Abrahamu, si Mungu. Alama ya tanbihi imewekwa baada ya “kitisho chochote,” ambako tofauti ya kileksika inahusika.
