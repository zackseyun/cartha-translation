  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: sw
  text: 'Kujipamba kwenu kusiwe kwa nje: kusuka nywele, kuvaa mapambo ya dhahabu, au kuvaa mavazi[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kujipamba kwenu kusiwe kwa nje—kusuka nywele, kuvaa mapambo ya dhahabu, au kuvaa mavazi.” Katika muktadha, Petro anatofautisha pambo la nje na utu wa ndani (mstari wa 4). Hivyo maneno haya yanaweza kueleweka kuwa yanaweka kipaumbele kwa tabia ya ndani, badala ya kuwa marufuku kamili ya kutunza nywele au kuvaa mapambo na mavazi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧν
  choice: kwenu
  rationale: Kiwakilishi cha uhusiano katika hali ya umilikaji kinawarejelea wanawake au wake waliotajwa katika mstari uliotangulia; “kwenu” huleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἔστω οὐχ
  choice: kusiwe ... tu
  rationale: Muundo huu unahifadhi nguvu ya agizo hasi. Neno “tu” linaonyesha ulinganisho na utu wa ndani katika mstari unaofuata bila kugeuza maneno hayo kuwa marufuku ya moja kwa moja ya kila pambo la nje.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: kujipamba ... kwa nje
  rationale: κόσμος hapa ni mpangilio au pambo, si “ulimwengu”; “kujipamba kwa nje” ni lugha ya sasa na hudokeza tofauti na utu wa moyoni katika mstari wa 4.
- source_word: ἐμπλοκῆς τριχῶν
  choice: kusuka nywele
  rationale: Huwasilisha kwa kawaida kitendo cha kupanga nywele kwa kuzisuka.
- source_word: περιθέσεως χρυσίων
  choice: kuvaa mapambo ya dhahabu
  rationale: περίθεσις ni kitendo cha kuweka au kuzungushia mwili, na χρυσίων ni vitu vya dhahabu vinavyotumiwa kama mapambo.
- source_word: ἢ
  choice: au
  rationale: Kiunganishi rahisi cha kutenganisha vipengele vya orodha.
- source_word: ἐνδύσεως ἱματίων
  choice: kuvaa mavazi
  rationale: Tafsiri ya kawaida ya kitendo cha kujivika nguo, huku ikidumisha ulinganifu wa orodha.
theological_decisions:
- issue: Ikiwa Petro anakataza kabisa kusuka nywele, mapambo ya dhahabu na mavazi, au anaweka pambo la ndani mbele ya pambo la nje
  choice: Maana ya kulinganisha imeonyeshwa kwa “kusiwe kwa nje tu,” huku tofauti na utu wa ndani ikibaki wazi katika muktadha.
  alternative: Marufuku kamili ya kusuka nywele, kuvaa dhahabu na kuvaa mavazi.
  rationale: Mstari wa 4 unatofautisha pambo la nje na utu wa moyoni. Kusoma maneno haya kama marufuku kamili kungejumuisha hata kuvaa mavazi; kwa hiyo tafsiri inaonyesha kipaumbele cha tabia ya ndani bila kufuta nguvu ya agizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kujipamba” na “mapambo” vinaeleweka kwa urahisi, na dashibodi ya mwisho inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
