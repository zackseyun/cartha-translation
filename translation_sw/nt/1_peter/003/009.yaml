base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: sw
  text: Msilipe uovu kwa uovu wala tusi kwa tusi[a]. Badala yake, barikini, kwa sababu mliitwa kwa ajili ya jambo hili[b], ili mrithi baraka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno ya kutukana kwa maneno ya kutukana.” Neno la Kigiriki linaweza kumaanisha usemi wa kutusi au kudhalilisha.
    reason: lexical_alternative
  - marker: b
    text: Huenda “jambo hili” likarejelea kuitikia kutendewa vibaya kwa kubariki badala ya kulipiza; linaweza pia kueleweka kwa upana zaidi kuwa maisha ya kutolipiza kisasi. Mungu ndiye anayeeleweka kuwa mpigaji wa wito huo.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: msilipe
  rationale: Katika muktadha huu wa mawaidha, kitenzi hiki kina maana ya kulipa au kurudisha tendo kwa kulipiza. Muundo wa kukataza unaifanya sentensi iwe ya kawaida na yenye nguvu katika Kiswahili.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: uovu kwa uovu
  rationale: Huhifadhi uzito wa kimaadili wa κακόν na muundo wa kulipiza unaoonyeshwa na ἀντί.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: tusi kwa tusi
  rationale: λοιδορία humaanisha maneno ya kutukana au kudhalilisha; “tusi” ni neno la sasa, wazi, na linaendeleza usambamba wa sentensi.
- source_word: τοὐναντίον δὲ
  choice: Badala yake
  rationale: Hutoa ugeuzi mkali kutoka kulipiza kisasi kwenda kubariki kwa lugha ya Kiswahili iliyo ya kawaida na yenye hadhi.
- source_word: εὐλογοῦντες
  choice: barikini
  rationale: Huhifadhi wazo la kunena mema au kuomba fadhili za Mungu juu ya mwingine bila kulipunguza kuwa kusema maneno mazuri tu. Yule anayebarikiwa anaachwa kutambulika kutokana na muktadha, kama ilivyo katika Kigiriki.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi msingi wa himizo hili.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: mliitwa kwa ajili ya jambo hili
  rationale: Huhifadhi rejeo la τοῦτο bila kulifafanua kupita kiasi; katika muktadha linaelekea kwenye mwenendo uliotajwa wa kubariki badala ya kulipiza.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa kwa njia ya kawaida katika Kiswahili.
- source_word: εὐλογίαν
  choice: baraka
  rationale: Neno hili linaweza kumaanisha baraka itokayo kwa Mungu; Kiswahili hakihitaji kibainishi kisicho maalumu hapa.
- source_word: κληρονομήσητε
  choice: mrithi
  rationale: Huhifadhi taswira ya kupokea kama urithi, badala ya maana pana tu ya kupokea.
theological_decisions:
- issue: Rejeo la εἰς τοῦτο ἐκλήθητε
  choice: “Jambo hili” linaachwa likirejelea kwa karibu kubariki badala ya kulipiza, bila kufafanua zaidi katika matini.
  alternative: Wito huo unaweza kueleweka kwa upana kuwa wito wa maisha ya Kikristo yanayojumuisha mateso na kutolipiza kisasi.
  rationale: Muktadha wa karibu unaunga mkono uhusiano na himizo lililotangulia, lakini usemi wa Kigiriki hauelezi rejeo lake kwa undani; kwa hiyo tafsiri inadumisha upana huo.
- issue: Mtendaji wa wito katika ἐκλήθητε
  choice: Matini inatumia kauli tendwa “mliitwa,” huku tanbihi ikieleza kwamba Mungu ndiye anayeeleweka kuwa aliwaita.
  alternative: Kutaja moja kwa moja katika matini, “Mungu aliwaita.”
  rationale: Kauli tendwa ya Kigiriki haimtaji Mungu waziwazi, ingawa katika muktadha wa kitheolojia yeye ndiye mtendaji anayeeleweka; kutomtaja katika matini huepuka kuongeza maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kimawaidha. “Wala” imetumiwa katika katazo linalounganisha mambo mawili, na “Badala yake” linaweka wazi ugeuzi mkali wa mwenendo.
