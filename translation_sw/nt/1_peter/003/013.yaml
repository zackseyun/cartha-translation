  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: sw
  text: Na ni nani atakayewadhuru ikiwa mtakuwa na bidii katika kutenda mema?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa mtakuwa wenye shauku kwa mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Tena
  rationale: Kiunganishi hiki kinaendeleza mtiririko wa wazo kutoka aya iliyotangulia kwa namna ya asili katika Kiswahili.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: ni nani atakayewadhuru
  rationale: Huhifadhi swali la balagha na maana ya wakati ujao ya kirai cha Kigiriki, huku kikiwa cha kawaida na wazi katika Kiswahili.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Huonyesha sharti bila kuongeza wazo la uhakika au masharti makali yasiyomo katika chanzo.
- source_word: τοῦ ἀγαθοῦ
  choice: mema
  rationale: Nomino kivumishi ya Kigiriki inaelekeza kwa mambo yaliyo mema; 'mema' ni usemi mfupi na wa kawaida katika Kiswahili.
- source_word: ζηλωταὶ γένησθε
  choice: mtakuwa na bidii kwa ajili ya
  rationale: Huwasilisha hali ya kuwa watu wenye juhudi kubwa kwa jambo fulani na kudumisha kipengele cha γένησθε cha kuingia au kuwa katika hali hiyo.
theological_decisions:
- issue: Nguvu ya swali la balagha kuhusu kudhuriwa kwa sababu ya kufanya mema
  choice: 'Swali limeachwa kama uhakikisho wa jumla: ''ni nani atakayewadhuru?'''
  alternative: Kulifanya kuwa ahadi ya moja kwa moja kwamba waamini hawawezi kamwe kupata madhara
  rationale: Muktadha unaofuata unakubali uwezekano wa kuteseka kwa ajili ya haki. Kwa hiyo tafsiri haiondoi mvutano kati ya uhakikisho huu wa balagha na uwezekano halisi wa mateso.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Kuwadhuru' ni pana vya kutosha kujumuisha kuumiza au kuwatendea vibaya, na 'kuwa na bidii kwa ajili ya mema' huhifadhi uzito wa ζηλωταί bila kuwa lugha ya kitaalamu.
