  source_fidelity: '"Tena" is a possible connective, but "Na" more directly represents Καὶ. The principal wording accurately retains the rhetorical future question and conditional sense. However, "bidii kwa ajili ya mema" is less idiomatic and can be unclear as to what the zeal concerns. Rendering the phrase as commitment to doing good is natural Swahili and conveys the contextual force of ζηλωταὶ τοῦ ἀγαθοῦ without turning the rhetorical question into an absolute promise.'
  naturalness: '"Na ni nani atakayewadhuru ikiwa mtakuwa na bidii katika kutenda mema?" is fluent, current Standard East African Swahili. "Kuwadhuru" appropriately covers the broad sense of κακώσων.'
  terminology: '"Mema" and "kutenda mema" are established, neutral biblical Swahili expressions. "Bidii" is suitable for ζηλωταί; the alternative "shauku" usefully reflects the lexical range without imposing a theological interpretation.'
  issues:
  - severity: low
    issue: The connective "Tena" is slightly more marked than the Greek Καὶ.
    rationale: Καὶ here simply continues the discourse. "Na" is the most neutral and direct equivalent.
  - severity: medium
    issue: '"Mtakuwa na bidii kwa ajili ya mema" is idiomatically imprecise.'
    rationale: In contemporary Standard East African Swahili, "bidii katika kutenda mema" more clearly expresses zealous commitment to what is good. The former can sound like exertion undertaken on behalf of unspecified good things.
  - severity: low
    issue: The footnote's alternative adds "kufanya" while the main text does not clearly express the activity.
    rationale: Aligning the main translation and alternative avoids an unnecessary disparity in how the object of zeal is understood.
