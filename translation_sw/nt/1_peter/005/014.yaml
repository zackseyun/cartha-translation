base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: sw
  text: Salimianeni kwa busu la upendo. Amani iwe kwenu nyote mlio katika Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mapokeo ya tafsiri, “Kristo.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: Salimianeni
  rationale: Kitenzi hiki cha kuamuru pamoja na kiwakilishi cha kutendeana kinawataka waumini watende tendo la kusalimiana; “Salimianeni” ni Kiswahili cha kawaida na huhifadhi maana ya kutendeana.
- source_word: ἐν φιλήματι ἀγάπης
  choice: kwa busu la upendo
  rationale: “Kwa” huonyesha namna ya salamu; “busu la upendo” huhifadhi nomino φίλημα na uhusiano wake na ἀγάπη bila kuufafanua kupita kiasi.
- source_word: εἰρήνη ὑμῖν πᾶσιν
  choice: Amani iwe kwenu nyote
  rationale: Ingawa Kigiriki kina kauli fupi ya nomino, Kiswahili huhitaji “iwe” ili baraka hiyo isikike ya kawaida na yenye hadhi; “kwenu nyote” huhifadhi upeo jumuishi.
- source_word: τοῖς ἐν Χριστῷ
  choice: mlio katika Masihi
  rationale: Kirai chenye kibainishi kinarejelea watu walio “katika” Χριστός. “Mlio” huifanya sentensi iwe wazi, huku “Masihi” ikitafsiri cheo cha Mtiwa-Mafuta badala ya kukichukulia kama jina.
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika kirai ἐν Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός kimsingi ni cheo chenye maana ya Mtiwa-Mafuta. “Masihi” huhifadhi maana hiyo katika kauli ya muungano wa waumini naye; “Kristo,” lililozoeleka katika mapokeo ya Kiswahili, limewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Salimianeni” ni fupi na ya kawaida; “busu la upendo” huhifadhi taswira ya chanzo. Alama ya tanbihi imewekwa baada ya “Masihi,” ambako tofauti ya tafsiri inahusika.
