base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: sw
  text: Kwa hiyo, jinyenyekezeni[a] chini ya mkono wenye nguvu wa Mungu, ili awainue kwa wakati unaofaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Nyenyekezweni ... ili awainue kwa wakati unaofaa.” Amri ya Kigiriki ina umbo la hali ya kutendwa, ingawa hapa mara nyingi hueleweka kwa maana ya kujirejelea: “jinyenyekezeni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: jinyenyekezeni
  rationale: Ingawa kitenzi hiki ni cha hali ya kutendwa kwa umbo, katika himizo hili kinaweza kueleweka kwa maana ya kujirejelea. “Jinyenyekezeni” ni Kiswahili cha kawaida kinachohifadhi nguvu ya amri, huku tanbihi ikihifadhi uwezekano wa tafsiri ya hali ya kutendwa.
- source_word: οὖν
  choice: kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na kauli iliyotangulia kuhusu Mungu kuwapinga wenye kiburi na kuwapa wanyenyekevu neema.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: chini ya mkono wenye nguvu
  rationale: Inahifadhi sitiari ya kibiblia kuhusu uwezo na utawala wa Mungu kwa lugha ya asili na inayoeleweka katika Kiswahili.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Ni umilikishi unaotambulisha mkono unaozungumziwa kuwa wa Mungu.
- source_word: ἵνα
  choice: ili
  rationale: Inaeleza kusudi au matokeo yanayokusudiwa kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ὑμᾶς ὑψώσῃ
  choice: awainue
  rationale: Mhusika anayeeleweka ni Mungu. “Awainue” huhifadhi wazo la Mungu kuwapa heshima au kuwatetea wanyenyekevu bila kulazimisha msamiati mzito.
- source_word: ἐν καιρῷ
  choice: kwa wakati unaofaa
  rationale: καιρός hapa ni wakati unaofaa au uliowekwa, si wakati wa mfululizo wa saa pekee.
theological_decisions:
- issue: Hali ya kitenzi na utendaji katika Ταπεινώθητε
  choice: Amri imetafsiriwa “jinyenyekezeni,” huku maneno “chini ya mkono wenye nguvu wa Mungu” yakionyesha kuwa ni kujisalimisha kwa uwezo wa Mungu.
  alternative: Nyenyekezweni
  rationale: Tafsiri kuu ni ya kawaida na yenye nguvu katika Kiswahili, lakini tanbihi inahifadhi umbo la Kigiriki la hali ya kutendwa na mvutano kati ya wajibu wa wanadamu kujinyenyekeza na utendaji wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sitiari ya “mkono wenye nguvu” imehifadhiwa kwa sababu ni wazi na ina mwangwi wa matumizi ya Agano la Kale.
