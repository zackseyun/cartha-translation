base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: sw
  text: Na Mchungaji Mkuu atakapofunuliwa,[a] mtapokea taji ya utukufu isiyonyauka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakapotokea.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki linalotafsiriwa “taji” linaweza kumaanisha shada lililotolewa kama tuzo ya ushindi au heshima, si hasa taji la kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: atakapofunuliwa
  rationale: Kauli ya kutendwa ya wakati uliopita katika muundo wa genitive absolute ina maana ya wakati. Kiswahili ‘atakapofunuliwa’ huhifadhi maana ya kufunuliwa na huonyesha tukio la wakati ujao kwa kawaida; ‘atakapotokea’ pia yawezekana lakini hupunguza kidogo wazo la kufunuliwa.
- source_word: ἀρχιποίμενος
  choice: Mchungaji Mkuu
  rationale: Neno ambatano humaanisha mchungaji aliye mkuu au wa juu kuliko wengine. ‘Mchungaji Mkuu’ ni wazi, la kawaida, na linafaa kama cheo kinachomhusu Yesu katika muktadha.
- source_word: κομιεῖσθε
  choice: mtapokea
  rationale: Kitenzi cha wakati ujao hapa kinaonyesha kupokea tuzo. ‘Mtapokea’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: ἀμαράντινον
  choice: isiyonyauka
  rationale: Kivumishi kinaeleza kitu kisichopoteza hali yake mpya au uzuri wake. ‘Isiyonyauka’ huhifadhi picha ya shada la maua bila kuongeza maana pana zaidi ya kutoharibika.
- source_word: τῆς δόξης
  choice: ya utukufu
  rationale: Muundo wa umilikaji umehifadhiwa kwa ‘ya utukufu,’ badala ya kuufafanua kuwa tu ‘taji tukufu,’ hivyo sitiari fupi ya Kigiriki inadumu.
- source_word: στέφανον
  choice: taji
  rationale: ‘Taji’ ndilo neno linaloeleweka kwa urahisi, ingawa στέφανος linaweza kumaanisha shada lililotolewa kama tuzo ya ushindi au heshima, si lazima taji la kifalme; ufafanuzi huo umewekwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa ‘Mchungaji Mkuu’
  choice: Cheo kinachomhusu Yesu
  alternative: Kutotumia herufi kubwa kama cheo
  rationale: Muktadha wa uchungaji na kufunuliwa kwa wakati ujao unaelekeza kwa Yesu. Herufi kubwa zinaonyesha matumizi ya kicheo bila kuongeza maelezo ya kimafundisho ndani ya aya.
- issue: Lugha ya kufunuliwa katika wakati wa mwisho
  choice: atakapofunuliwa
  alternative: atakapotokea
  rationale: Kauli ya kutendwa huhifadhi wazo la udhihirisho lililomo katika Kigiriki na haifafanui kupita kiasi namna ya tukio hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. ‘Isiyonyauka’ hudumisha picha hai ya shada, na mpangilio wa tanbihi umewekwa mara baada ya maneno yanayohusika.
