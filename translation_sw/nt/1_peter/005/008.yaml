  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: sw
  text: Iweni na akili timamu[a]; kesheni. Adui yenu, Ibilisi, huzunguka[b] kama simba anayenguruma, akitafuta mtu wa kummeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Iweni na kiasi.” Kitenzi cha Kigiriki kwa maana yake ya msingi humaanisha kuwa na kiasi, yaani kutokuwa mlevi; lakini hapa kimetumiwa kitamathali kumaanisha kuwa na fikra zilizo wazi na kujitawala.
    reason: lexical_alternative
  - marker: b
    text: Au, “huzunguka akivizia.” Kitenzi cha Kigiriki kwa maana ya karibu ni “hutembea huku na huku” au “huzunguka”; taswira ya simba inaweza kudokeza kuvizia.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: Muwe na akili timamu
  rationale: Kitenzi hiki kimetumiwa hapa kwa maana ya kitamathali ya kuwa na fikra zilizo wazi na kujitawala, si kwa maana ya moja kwa moja ya kutolewa na ulevi. Kauli hii pia inakitofautisha na γρηγορήσατε.
- source_word: γρηγορήσατε
  choice: kesheni
  rationale: Amri hii ina maana ya kuendelea kuwa macho na makini dhidi ya hatari; “kesheni” ni kauli ya kawaida ya kibiblia na ya asili katika Kiswahili.
- source_word: ἀντίδικος
  choice: Adui
  rationale: Neno linaweza kutaja mpinzani wa kisheria, lakini katika muktadha huu humaanisha mpinzani mwenye uhasama kwa upana zaidi.
- source_word: διάβολος
  choice: Ibilisi
  rationale: Hapa neno hilo linamtaja yule kiumbe mwovu anayejulikana, wala si mchongezi wa kawaida.
- source_word: ὡς λέων ὠρυόμενος
  choice: kama simba anayenguruma
  rationale: Inahifadhi wazi tashbihi na taswira ya tishio la simba.
- source_word: περιπατεῖ
  choice: huzunguka
  rationale: Inatoa maana ya kwenda huku na huku kwa njia ya asili katika Kiswahili bila kuongeza moja kwa moja wazo la kuvizia.
- source_word: ζητῶν
  choice: akitafuta
  rationale: Inahifadhi tendo linaloendelea pamoja na kusudi la kutafuta shabaha.
- source_word: τινα
  choice: mtu
  rationale: Kiwakilishi kisichobainisha mtu mmoja kimetolewa kwa Kiswahili cha kawaida bila kumtaja mtu maalumu.
- source_word: καταπιεῖν
  choice: kummeza
  rationale: Hii ndiyo maana halisi ya kumeza kabisa, nayo inafaa moja kwa moja katika taswira ya simba; dokezo linaonyesha tafsiri ya kimuktadha “kumrarua na kumla.”
theological_decisions:
- issue: Ikiwa διάβολος itafsiriwe kama jina la kiumbe mwovu au kama nomino ya kawaida “mchongezi”
  choice: Ibilisi
  alternative: mchongezi
  rationale: Muktadha unamtaja mpinzani binafsi wa waamini; “Ibilisi” huonyesha matumizi hayo ya Agano Jipya bila kuongeza fundisho lisilokuwamo katika mstari.
- issue: Kiwango cha tishio kinachoingizwa katika tafsiri ya περιπατεῖ
  choice: huzunguka
  alternative: huzunguka akivizia
  rationale: “Huzunguka” inahifadhi maana ya msingi ya kitenzi, huku tashbihi ya simba anayenguruma ikibeba tishio. Tafsiri yenye “kuvizia” ingeongeza maana inayodokezwa na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Muwe na akili timamu” ni cha kisasa na wazi; “kesheni” huhifadhi uzito wa amri ya kibiblia. Muundo wa sentensi unadumisha tashbihi na mfuatano wa matendo ya Kigiriki.
