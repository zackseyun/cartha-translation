base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: sw
  text: Mpingeni huyo, mkiwa imara katika imani, mkijua kwamba mateso hayohayo yanawapata ndugu zenu wa imani[a] waliomo ulimwenguni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jumuiya nzima ya waamini, wanaume na wanawake.
    reason: cultural_note
  - marker: b
    text: Au, “mateso hayohayo yanakamilishwa miongoni mwa ndugu zenu wa imani waliomo ulimwenguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: huyo
  rationale: Kiwakilishi hiki kinamrejelea Ibilisi aliyetajwa katika mstari wa 8; ‘huyo’ ni rejeo la kawaida na wazi katika Kiswahili.
- source_word: ἀντίστητε
  choice: Mpingeni
  rationale: Amri hii inadai upinzani thabiti na wa makusudi; ‘mpingeni’ ni ya asili na hudumisha nguvu ya kitenzi.
- source_word: στερεοὶ τῇ πίστει
  choice: mkiwa imara katika imani
  rationale: Huwasilisha hali ambayo waamini wanapaswa kumpinga Ibilisi. ‘Katika imani’ hudumisha uwezekano wa kurejelea imani ya Kikristo au utegemezi thabiti wa Mungu bila kuamua kupita kiasi.
- source_word: εἰδότες
  choice: mkijua
  rationale: Umbo la kitenzi tegemezi linahifadhiwa kwa njia ya kawaida ya Kiswahili na linaonyesha maarifa yanayoambatana na amri.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: mateso yayo hayo
  rationale: Hii ni tafsiri ya karibu inayoonyesha mateso yanayofanana, bila kudai kwamba matukio yenyewe yanafanana kwa kila undani.
- source_word: ἀδελφότητι
  choice: ndugu zenu wa imani
  rationale: Nomino ya Kigiriki inarejelea jumuiya nzima ya waamini. Usemi huu ni wa asili, jumuishi, na unadumisha taswira ya kifamilia.
- source_word: ἐν τῷ κόσμῳ
  choice: waliomo ulimwenguni
  rationale: Inaonyesha mahali ilipo jumuiya ya waamini kwa tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἐπιτελεῖσθαι
  choice: yanawapata
  rationale: Katika muktadha huu kitenzi cha kutendwa kinaeleza mateso yanayotokea kwa waamini. ‘Yanawapata’ ni Kiswahili cha kawaida; maana ya kukamilishwa imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya τῇ πίστει
  choice: katika imani
  alternative: thabiti kwa imani
  rationale: Tafsiri hii inadumisha mvutano kati ya imani kama tumaini la mtu na imani ya Kikristo inayoshikiliwa, bila kuingiza msimamo wa kimadhehebu.
- issue: Maana ya ἐπιτελεῖσθαι
  choice: yanawapata
  alternative: yanakamilishwa
  rationale: Chaguo kuu ni la asili na linafaa muktadha, lakini tanbihi inahifadhi maana halisi inayowezekana ya kuendelezwa au kukamilishwa.
- issue: Upeo wa ἀδελφότητι
  choice: ndugu zenu wa imani
  alternative: jumuiya yenu ya waamini
  rationale: Inarejelea waamini wote, wanawake kwa wanaume, huku ikihifadhi lugha ya udugu wa kifamilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa ‘mkiwa … mkijua’ hudumisha mtiririko wa Kigiriki bila kuwa mgumu; ‘ndugu wa imani’ ni usemi wa kawaida unaojumuisha jumuiya yote.
