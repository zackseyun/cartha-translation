  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: sw
  text: Mamlaka ni yake milele na milele.[a] Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “mpaka enzi za enzi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῷ
  choice: ni wake
  rationale: Kiwakilishi cha dative kinamrejelea Mungu katika muktadha uliotangulia. Muundo wa Kiswahili “ni wake” huwasilisha kwa kawaida kwamba uwezo huo ni wa Mungu, huku ukidumisha sauti ya sifa.
- source_word: κράτος
  choice: uwezo wa kutawala
  rationale: Katika maneno haya ya sifa, κράτος ni nguvu au mamlaka yenye ufanisi wa kutawala, si nguvu ya mwili tu. “Uwezo wa kutawala” ni wazi kwa wasomaji wa kisasa na huepuka kuchanganya neno hili na cheo au eneo linalotawaliwa.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Hii ni nahau ya kusisitiza muda usio na mwisho. “Milele na milele” ni usemi wa kawaida wa kibiblia na wa Kiswahili unaohifadhi msisitizo huo.
- source_word: ἀμήν
  choice: Amina
  rationale: Hili ni umbo la kawaida la Kiswahili la neno la kiliturujia linalothibitisha yaliyonenwa.
theological_decisions:
- issue: Kitenzi kisichotajwa wazi katika maneno ya sifa
  choice: Uwezo wa kutawala ni wake
  alternative: Uwezo wa kutawala uwe kwake
  rationale: Kigiriki hakina kitenzi hapa. “Ni wake” huonyesha kuwa uwezo huo ni wa Mungu bila kuufanya usemi kuwa ombi; hata hivyo, muundo wa Kigiriki unaweza pia kueleweka kama tamko la sifa lenye maana ya “uwe kwake.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa sifa umehifadhiwa bila kuongeza maelezo ya kimadhehebu.
