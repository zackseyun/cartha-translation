  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: sw
  text: wala msiwatawale kwa mabavu wale waliokabidhiwa kwenu[a], bali muwe mifano kwa kundi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msitawale kwa mabavu juu ya mafungu yenu.” Kigiriki kinasema kwa maana halisi “mafungu yaliyogawiwa,” yaelekea kikirejelea sehemu za kundi la Mungu zilizokabidhiwa kwa uangalizi wa kila mzee.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: wala msi-
  rationale: Inaendeleza ukanushaji wa mstari uliotangulia na kutaja namna ya uchungaji iliyokatazwa; muundo wa Kiswahili wenye amri hasi ni wa kawaida na wazi.
- source_word: κατακυριεύοντες
  choice: watawale kwa mabavu
  rationale: Kitenzi hiki kinamaanisha kutumia mamlaka kwa ubabe au kwa kuwakandamiza wengine, si kutekeleza uongozi halali tu.
- source_word: τῶν κλήρων
  choice: wale waliokabidhiwa kwenu
  rationale: Kwa maana halisi ni ‘mafungu yaliyogawiwa’; katika muktadha huu kinarejelea sehemu za kundi la Mungu zilizowekwa chini ya uangalizi wa wazee. Tafsiri hii inasisitiza dhamana badala ya umiliki, huku tanbihi ikihifadhi taswira ya asili.
- source_word: ἀλλὰ
  choice: bali
  rationale: Inaonyesha tofauti thabiti kati ya matumizi mabaya ya mamlaka na uongozi kwa mfano.
- source_word: τύποι
  choice: mifano
  rationale: Neno hili linamaanisha vielelezo au mifano ya kuigwa; ‘mifano’ ni neno la kawaida na linaloeleweka kwa urahisi.
- source_word: γινόμενοι
  choice: muwe
  rationale: Katika Kiswahili, ‘muwe mifano’ hutoa kwa kawaida wito wa kuonyesha kwa vitendo tabia inayopaswa kuigwa, ingawa kitenzi cha Kigiriki kwa undani kina wazo la ‘kuwa/kufanyika’.
- source_word: τοῦ ποιμνίου
  choice: kundi
  rationale: Ni taswira ya kichungaji inayorejelea jumuiya ya waamini; ‘kundi’ ni tafsiri sanifu na ya asili katika muktadha huu.
theological_decisions:
- issue: Maana ya κλήρων kuhusiana na uongozi wa kanisa
  choice: Inarejelea waamini waliokabidhiwa kwa uangalizi wa wazee, si mali inayomilikiwa na wazee.
  alternative: Kutafsiri moja kwa moja ‘mafungu’ bila maelezo, au kuelewa kuwa ni maeneo ya mamlaka ya wazee.
  rationale: Muktadha unawahimiza wazee kulichunga kundi la Mungu. ‘Wale waliokabidhiwa kwenu’ hudumisha wazo la uwakili na huepuka kudokeza umiliki; tanbihi inahifadhi maana halisi na uwezekano wa ‘mafungu’.
- issue: Nguvu ya κατακυριεύοντες
  choice: Inakataza kutumia mamlaka kwa ubabe au ukandamizaji, si kila namna ya uongozi.
  alternative: Kuelewa kuwa inakataza wazee kuwa na jukumu lolote la kuongoza.
  rationale: Maana ya kitenzi inalenga matumizi mabaya ya mamlaka. Tofauti katika mstari huu ni kati ya uongozi wa mabavu na uongozi kwa mfano, wala si kati ya uongozi na kutokuwa na uongozi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kutawala kwa mabavu’ kinaeleza matumizi ya mamlaka kwa ubabe bila kukana uongozi halali; ‘waliokabidhiwa kwenu’ ni ya asili kwa wasomaji wa kawaida, huku tanbihi ikihifadhi sitiari ya κλήρων.
