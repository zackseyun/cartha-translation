  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: sw
  text: Yule[a] aliye Babeli[b], aliyechaguliwa pamoja nanyi, anawasalimu; vivyo hivyo Marko, mwanangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye ufafanuzi zaidi, “Kanisa lililo Babeli, lililochaguliwa pamoja nanyi.” Kigiriki kina kibainishi na kivumishi vya umoja wa kike, lakini nomino inayorejelewa haikutajwa.
    reason: alternative_reading
  - marker: b
    text: “Babeli” huenda ni jina la mfano linalorejelea Roma katika matumizi ya Kikristo ya awali; matini yenyewe inasema “Babeli.”
    reason: cultural_note
  - marker: c
    text: “Mwanangu” huenda inaonyesha uhusiano wa kiroho, si wa kuzaliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: anawasalimu
  rationale: Kitenzi hiki humaanisha kusalimu au kutuma salamu; “anawasalimu” ni Kiswahili cha kawaida na kinafaa katika muktadha wa barua.
- source_word: ἡ ἐν Βαβυλῶνι συνεκλεκτὴ
  choice: Yule aliye Babeli, aliyechaguliwa pamoja nanyi
  rationale: Kigiriki kina kibainishi na kivumishi vya umoja wa kike bila nomino iliyotajwa. “Yule” huacha mhusika bila kutajwa wazi, badala ya kuongeza “kanisa” katika matini kuu; jinsia ya kisarufi haiwezi kuonyeshwa kikamilifu kwa umbo hili la kawaida la Kiswahili.
- source_word: ἐν Βαβυλῶνι
  choice: aliye Babeli
  rationale: Jina la mahali lililo katika matini linadumishwa bila kulifasiri kuwa Roma.
- source_word: συνεκλεκτὴ
  choice: aliyechaguliwa pamoja nanyi
  rationale: Huwasilisha wazi wazo la kuchaguliwa pamoja na waandikiwa kwa Kiswahili cha asili.
- source_word: Μᾶρκος
  choice: Marko
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: ὁ υἱός μου
  choice: mwanangu
  rationale: Huhifadhi lugha halisi ya uhusiano wa mwana bila kuongeza neno “wa kiroho,” ambalo halipo wazi katika Kigiriki.
theological_decisions:
- issue: Mhusika wa ἡ ... συνεκλεκτὴ
  choice: 'Mhusika anaachwa bila nomino iliyotajwa wazi: “Yule ... aliyechaguliwa pamoja nanyi.”'
  alternative: “Kanisa lililo Babeli, lililochaguliwa pamoja nanyi,” au mwanamke fulani Mkristo.
  rationale: Kigiriki kina umbo la umoja wa kike lakini hakitaji nomino. Matini kuu haiongezi “kanisa”; tanbihi inaonyesha tafsiri hiyo ya kawaida.
- issue: Maana ya Babeli
  choice: “Babeli” linadumishwa katika matini kuu.
  alternative: Kulielewa kama ishara ya Roma, au kama Babeli halisi ya Mesopotamia.
  rationale: Matini yenyewe inataja Babeli, na utambulisho wake unabishaniwa; kwa hiyo tafsiri hailitatui suala hilo kimyakimya.
- issue: Maana ya “mwanangu” kuhusu Marko
  choice: Lugha halisi ya kifamilia inadumishwa.
  alternative: “mwanangu wa kiroho.”
  rationale: Huenda uhusiano unaokusudiwa ni wa kiroho, lakini Kigiriki hakisemi hivyo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Yule aliye...” unahifadhi kutotajwa kwa nomino katika Kigiriki, ingawa Kiswahili hakiwezi kuonyesha moja kwa moja umoja wa kike bila kuongeza ufafanuzi. Alama zote za tanbihi zimo katika matini kuu.
