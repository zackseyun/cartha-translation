  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: sw
  text: 'Kwa hiyo, wazee walio miongoni mwenu nawasihi, mimi ambaye ni mzee mwenzao na shahidi wa mateso ya Masihi[a], na pia mshiriki wa utukufu unaokaribia kufunuliwa[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mateso ya Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Masihi” au, kwa namna ya jadi, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “mshiriki wa utukufu utakaofunuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: wazee
  rationale: Katika muktadha huu wa jumuiya ya waamini, neno hili linamaanisha viongozi wa kanisa, si wanaume wenye umri mkubwa tu. “Wazee” ni neno la kawaida la Kiswahili linalohifadhi kazi hiyo bila kuingiza cheo cha dhehebu fulani.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho au uhusiano wa kimantiki na maelezo yaliyotangulia.
- source_word: ἐν ὑμῖν
  choice: walio miongoni mwenu
  rationale: Hii ni njia ya kawaida na wazi ya kueleza kwamba wazee hao wako ndani ya jumuiya inayozungumziwa.
- source_word: παρακαλῶ
  choice: ninawasihi
  rationale: “Kusihi” linaonyesha ombi lenye uzito na msukumo wa kichungaji, bila kulifanya kuwa amri kali.
- source_word: συμπρεσβύτερος
  choice: mzee mwenzao
  rationale: Huhifadhi wazo kwamba msemaji ana hadhi na wajibu uleule wa uzee pamoja nao.
- source_word: μάρτυς
  choice: shahidi
  rationale: Neno hili linaweza kumaanisha anayeshuhudia au kutoa ushuhuda; hapa halipaswi kufasiriwa moja kwa moja kuwa mtu aliyeuawa kwa ajili ya imani.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: wa mateso ya Masihi
  rationale: Muundo huu unaeleweka kwa kawaida kuwa mateso yaliyompata Masihi. “Masihi” huhifadhi maana ya cheo Χριστός.
- source_word: κοινωνός
  choice: mwenye kushiriki
  rationale: Hueleza mtu anayepata sehemu katika jambo fulani. Kauli hii ni ya kawaida zaidi katika Kiswahili kuliko nomino inayoweza kusikika kama ushirika wa kibiashara.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: katika utukufu unaokaribia kufunuliwa
  rationale: Huhifadhi hali ya wakati ujao yenye matarajio katika μέλλω pamoja na hali tendwa ya ἀποκαλύπτεσθαι.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ kama cheo cha kikristo
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός bado ina nguvu ya cheo kinachomaanisha Mpakwa-Mafuta. “Masihi” huonyesha maana hiyo wazi, huku “Kristo” ikitolewa katika tanbihi kama namna ya jadi.
- issue: Nguvu ya μελλούσης ἀποκαλύπτεσθαι
  choice: unaokaribia kufunuliwa
  alternative: utakaofunuliwa
  rationale: Tafsiri iliyochaguliwa huhifadhi matarajio au ukaribu unaoweza kudokezwa na μέλλω, bila kuamua mjadala mpana kuhusu wakati kamili wa ufunuo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “mimi nikiwa” unaweka wazi apposition ya Kigiriki bila kuibadili kuwa dai tofauti; kolononi ya mwisho imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
