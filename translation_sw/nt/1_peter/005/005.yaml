  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: sw
  text: Vivyo hivyo, ninyi mlio vijana[a], jitiisheni kwa wazee. Nanyi nyote, jivikeni unyenyekevu ninyi kwa ninyi[b], kwa sababu Mungu huwapinga wenye kiburi, lakini huwapa neema wanyenyekevu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninyi wanaume vijana.” Kigiriki kimetumia wingi wa kiume, ingawa wengine hulielewa neno hili kwa maana pana ya washiriki wa kanisa walio vijana.
    reason: lexical_alternative
  - marker: b
    text: Au, “jifungeni unyenyekevu.” Kitenzi cha Kigiriki huleta picha ya kuvaa au kujifunga vazi, na hivyo kusisitiza kujivika unyenyekevu kwa makusudi.
    reason: lexical_alternative
  - marker: c
    text: Nukuu au dokezo la Methali 3:34 katika tafsiri ya Kigiriki ya Agano la Kale (LXX).
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: Vivyo hivyo
  rationale: Ni kiunganishi cha kawaida kinachohusianisha himizo hili na maagizo yaliyotangulia.
- source_word: νεώτεροι
  choice: ninyi wanaume vijana
  rationale: Nomino hii ya wito iko katika wingi wa kiume na inatofautishwa na wazee; tafsiri hii inahifadhi jinsia iliyo wazi katika Kigiriki bila kuficha uwezekano wa maana pana zaidi, ambao umeelezwa katika tanbihi.
- source_word: ὑποτάγητε
  choice: jitiisheni kwa
  rationale: Huhifadhi maana ya kujitia chini ya uongozi au mamlaka kwa hiari; ni sahihi zaidi hapa kuliko kitenzi chenye maana ya kutii amri moja kwa moja.
- source_word: πρεσβυτέροις
  choice: wazee
  rationale: Muktadha wa 5:1–4 unaelekeza kwa wazee wa kanisa, huku neno la Kiswahili likihifadhi ufupi na mwangwi wa neno la asili.
- source_word: πάντες
  choice: nyote
  rationale: Hupanua himizo kutoka kwa wanaume vijana hadi kwa jumuiya nzima.
- source_word: ἀλλήλοις
  choice: mnapotendeana
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la uhusiano wa pande zote, yaani, jinsi waumini wanavyotendeana.
- source_word: ταπεινοφροσύνην
  choice: unyenyekevu
  rationale: Ni neno la kawaida na lenye heshima linalowasilisha hali ya kujiona kwa unyenyekevu na kuwatendea wengine vivyo hivyo.
- source_word: ἐγκομβώσασθε
  choice: jivikeni
  rationale: Huhifadhi sitiari ya kuvaa au kufunga vazi, ikionyesha kuchukua unyenyekevu kwa makusudi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha msingi wa Maandiko unaotolewa kwa ajili ya himizo.
- source_word: ὑπερηφάνοις
  choice: wenye kiburi
  rationale: Ni tafsiri ya kawaida ya kivumishi kilichotumiwa kama nomino kwa watu wenye majivuno.
- source_word: ἀντιτάσσεται
  choice: huwapinga
  rationale: Huwasilisha kwa uwazi nguvu ya Mungu kujiweka dhidi ya wenye kiburi.
- source_word: ταπεινοῖς ... δίδωσιν χάριν
  choice: huwapa neema wanyenyekevu
  rationale: Huhifadhi utofautishaji wa moja kwa moja kati ya wenye kiburi na wanyenyekevu, pamoja na neno la kitheolojia 'neema'.
theological_decisions:
- issue: Rejeo la πρεσβυτέροις
  choice: wazee wa kanisa
  alternative: wanaume wenye umri mkubwa kwa ujumla
  rationale: Muktadha wa karibu katika 5:1–4 unawataja wazi wazee wanaolichunga kundi, hivyo hapa inaelekea zaidi kuwa kundi la viongozi wa kanisa. Hata hivyo, maandishi yametumia tu 'wazee' ili kutopanua neno la asili.
- issue: Jinsia katika νεώτεροι
  choice: ninyi wanaume vijana
  alternative: ninyi mlio vijana; vijana wote
  rationale: Umbo la Kigiriki ni wingi wa kiume. Tafsiri inalihifadhi hilo, huku tanbihi ikitaja uwezekano wa kulielewa kwa maana pana zaidi. Neno πάντες linalofuata linaonyesha wazi kwamba agizo la unyenyekevu linawahusu wote.
- issue: Nguvu ya ὑποτάγητε
  choice: jitiisheni kwa
  alternative: watiini
  rationale: Kitenzi cha asili kinaeleza kujiweka chini ya uongozi au mamlaka, si lazima utii wa amri mahususi. Hivyo 'jitiisheni' huhifadhi mvutano huo bila kuongeza mamlaka isiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Jitiisheni” huhifadhi maana ya kujitia chini ya uongozi bila kuifanya kuwa amri ya kutii kila jambo, na “jivikeni unyenyekevu” huhifadhi sitiari hai ya Kigiriki. Alama zote za tanbihi zimewekwa katika mstari mkuu karibu na maneno yanayohusika.
