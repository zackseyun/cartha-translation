review_pass:
  verdict: revise
  source_fidelity: The imperative, the divine ownership of the flock, the participial oversight, and both negative-positive contrasts are represented faithfully. However, “kwa bidii” primarily denotes diligence rather than the ready eagerness of προθύμως, and “kwa tamaa ya faida ya aibu” is less direct and less idiomatic than a formulation expressing pursuit of disgraceful gain.
  naturalness: The register is generally clear Standard East African Swahili. “Kwa moyo” is a natural idiom here for eager, wholehearted service; “kwa kutafuta faida ya aibu” is clearer and more idiomatic than the draft’s nominal chain.
  terminology: “Lichungeni,” “kundi la Mungu,” and “mkilisimamia” appropriately retain the pastoral metaphor, divine ownership, and non-technical sense of oversight. “Kulingana na Mungu” deliberately retains the compressed ambiguity of κατὰ θεόν, with an appropriately anchored explanatory footnote.
  issues:
  - severity: medium
    issue: “bali kwa bidii” for προθύμως
    rationale: “Kwa bidii” normally emphasizes diligence or industriousness. προθύμως emphasizes readiness, eagerness, and wholehearted willingness; “bali kwa moyo” better conveys this without repeating “kwa hiari.”
  - severity: low
    issue: “wala si kwa tamaa ya faida ya aibu” for μηδὲ αἰσχροκερδῶς
    rationale: The phrase is understandable but stylistically heavy and introduces “tamaa” explicitly. “Wala si kwa kutafuta faida ya aibu” more directly and naturally expresses the mercenary pursuit denoted by the Greek adverb.
  revised_text: Lichungeni kundi la Mungu lililo kati yenu, mkilisimamia, si kwa kulazimishwa bali kwa hiari, kulingana na Mungu[a]; wala si kwa kutafuta faida ya aibu, bali kwa moyo.
  revised_footnotes:
  - marker: a
    text: Au, “kama Mungu apendavyo” au “kulingana na mapenzi ya Mungu.”
    reason: Tafsiri mbadala inayofafanua kirai kifupi κατὰ θεόν bila kulazimisha ufafanuzi huo katika matini kuu.
  revision_rationale: 'Marekebisho mawili pekee yamefanywa: “kwa kutafuta faida ya aibu” huweka kwa Kiswahili cha kawaida msukumo wa kutafuta faida yenye fedheha, na “kwa moyo” hutoa utayari wenye hamu wa προθύμως kwa usahihi zaidi kuliko “kwa bidii.” Kirai chenye utata κατὰ θεόν na tanbihi yake vimehifadhiwa.'
