id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: sw
  text: Lichungeni kundi la Mungu lililo kati yenu, mkilisimamia, si kwa kulazimishwa bali kwa hiari, kulingana na Mungu[a]; wala si kwa kutafuta faida ya aibu, bali kwa moyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama Mungu apendavyo” au “kulingana na mapenzi ya Mungu.”
    reason: Tafsiri mbadala inayofafanua kirai kifupi κατὰ θεόν bila kulazimisha ufafanuzi huo katika matini kuu.
lexical_decisions:
- source_word: ποιμάνατε
  choice: Lichungeni
  rationale: Kitenzi hiki cha agizo kinadumisha sitiari ya mchungaji anayelilisha, kulilinda na kulitunza kundi, bila kukigeuza kuwa cheo maalumu cha kanisa.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: kundi la Mungu lililo kati yenu
  rationale: “Kundi” linadumisha picha ya kondoo, “la Mungu” linaonyesha wazi umiliki wa Mungu, na “lililo kati yenu” halidokezi kwamba wazee ndio wamiliki wake.
- source_word: ἐπισκοποῦντες
  choice: mkilisimamia
  rationale: Hueleza tendo la kuangalia na kusimamia kundi bila kutumia jina la cheo cha kikanisa au kuingiza mfumo fulani wa uongozi wa kanisa.
- source_word: μὴ ἀναγκαστῶς
  choice: si kwa kulazimishwa
  rationale: Huwasilisha kutenda kwa shinikizo au kwa lazima na kuweka wazi tofauti yake na huduma ya hiari.
- source_word: ἀλλὰ ἑκουσίως
  choice: bali kwa hiari
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaoonyesha utayari wa ndani kinyume cha kulazimishwa.
- source_word: κατὰ θεόν
  choice: kulingana na Mungu
  rationale: Tafsiri hii inadumisha ufupi na mvutano wa kirai cha Kigiriki bila kukifafanua moja kwa moja kuwa mapenzi, kiwango, au namna ya Mungu; maana laini zaidi imetolewa katika tanbihi.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: wala si kwa tamaa ya faida ya aibu
  rationale: Inadumisha wazo la msukumo wa kutafuta faida yenye fedheha bila kuifanya maana kuwa faida haramu pekee.
- source_word: ἀλλὰ προθύμως
  choice: bali kwa bidii
  rationale: “Kwa bidii” huonyesha utayari wenye hamu na nguvu, huku ikitofautishwa na “kwa hiari” iliyotumika kwa ἑκουσίως.
theological_decisions:
- issue: Ikiwa ἐπισκοποῦντες itafsiriwe kama cheo maalumu cha kanisa
  choice: Imetafsiriwa kwa maelezo ya tendo, “mkilisimamia.”
  alternative: mkitumikia kama waangalizi / maaskofu
  rationale: Katika muktadha, neno hili linaeleza kazi inayofanywa na wazee. Tafsiri ya kitendo huepuka kuingiza cheo cha baadaye au mfumo wa madhehebu, huku ikidumisha wazo la usimamizi na uangalizi.
- issue: Kiwango cha kufafanua κατὰ θεόν
  choice: Kirai “kulingana na Mungu” kimedumishwa katika matini kuu, na ufafanuzi mbadala umewekwa katika tanbihi.
  alternative: kama Mungu apendavyo / kulingana na mapenzi ya Mungu
  rationale: Kirai cha Kigiriki ni kifupi na kinaweza kueleweka kwa kuhusishwa na mapenzi, kiwango, au namna inayompendeza Mungu. Kutokifafanua kupita kiasi katika matini kuu kunadumisha uwazi wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya uchungaji imedumishwa; lugha ya cheo maalumu cha kikanisa imeepukwa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
