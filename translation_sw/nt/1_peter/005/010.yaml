id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: sw
  text: Lakini Mungu wa neema yote, aliyewaita kuingia katika utukufu wake wa milele katika Masihi, mkiisha kuteseka kwa muda mfupi, yeye mwenyewe atawakamilisha[a], atawafanya imara, atawapa nguvu, na atawaweka juu ya msingi imara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawarejesha katika hali inayofaa” au “atawatengeneza upya.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi zaidi, “atawawekea msingi”; Kigiriki kinatumia taswira ya msingi wa jengo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: wa neema yote
  rationale: Muundo huu unaonyesha ukamilifu wa neema inayotoka kwa Mungu bila kugawanya neema hiyo katika aina zilizobainishwa.
- source_word: καλέσας ὑμᾶς
  choice: aliyewaita
  rationale: Kauli ya wakati uliopita inasomeka kwa kawaida katika Kiswahili na kuhifadhi Mungu kama mtendaji wa wito.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: kuingia katika utukufu wake wa milele
  rationale: Neno εἰς lina mwelekeo wa kuelekea au kuingia; usemi huu wa Kiswahili unaonyesha kushiriki katika utukufu huo, si kufika tu mahali fulani.
- source_word: ἐν Χριστῷ
  choice: ndani ya Masihi
  rationale: Χριστός hapa ni cheo cha Mtiwa-Mafuta, na ἐν inaonyesha uhusiano au umoja na Masihi.
- source_word: ὀλίγον παθόντας
  choice: baada ya kuteseka kwa muda mfupi
  rationale: ὀλίγον inaeleweka vizuri kama muda mfupi, na kirai kinatangulia matendo ya Mungu yanayoelezwa kwa wakati ujao.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Huhifadhi msisitizo wa Kigiriki kwamba Mungu binafsi ndiye atakayewatendea mambo haya.
- source_word: καταρτίσει
  choice: atawarekebisha
  rationale: Kitenzi kinaweza kumaanisha kurudisha katika hali inayofaa, kukamilisha, au kutengeneza; 'kuwarekebisha' huhifadhi wazo la urejesho baada ya mateso.
- source_word: στηρίξει
  choice: atawathibitisha
  rationale: Hutoa wazo la kuwafanya wawe thabiti na wasiyumbishwe, huku likitofautishwa kwa kadiri iwezekanavyo na vitenzi vinavyolizunguka.
- source_word: σθενώσει
  choice: atawatia nguvu
  rationale: Ni Kiswahili cha kawaida na cha moja kwa moja kwa wazo la kuwafanya wawe na nguvu.
- source_word: θεμελιώσει
  choice: atawaweka juu ya msingi imara
  rationale: Huhifadhi wazi taswira ya msingi iliyomo katika kitenzi cha Kigiriki.
theological_decisions:
- issue: Maana ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo cha Mtiwa-Mafuta. 'Masihi' hutafsiri maana ya cheo hicho, huku 'Kristo' likiwa umbo la kimapokeo lililotoholewa.
- issue: Uhusiano kati ya mateso na matendo ya Mungu
  choice: baada ya kuteseka kwa muda mfupi
  alternative: mkiisha kuteseka kidogo
  rationale: Tafsiri inaonyesha mateso kuwa ya muda wenye mipaka na matendo ya Mungu kufuata, bila kuingiza mfumo wa kiteolojia usiotajwa na mstari.
- issue: Nguvu ya εἰς kuelekea utukufu
  choice: kuingia katika utukufu wake wa milele
  alternative: kufikia utukufu wake wa milele
  rationale: '''Kuingia katika'' huhifadhi mwelekeo na wazo la kushiriki katika utukufu, lakini haielezi kwa undani namna au wakati wa utimilifu wake.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi mfululizo wa vitenzi vinne na msisitizo wa “yeye mwenyewe,” huku maneno ya kawaida yakitumika ili mstari ueleweke kwa wasomaji wengi.
