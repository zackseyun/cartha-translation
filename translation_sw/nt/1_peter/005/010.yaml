revisions:
- from: Lakini Mungu wa neema yote, aliyewaita kuingia katika utukufu wake wa milele ndani ya Masihi, baada ya kuteseka kwa muda mfupi, yeye mwenyewe atawarekebisha[a], atawathibitisha, atawatia nguvu, na atawaweka juu ya msingi imara[b].
  to: Lakini Mungu wa neema yote, aliyewaita kuingia katika utukufu wake wa milele katika Masihi, mkiisha kuteseka kwa muda mfupi, yeye mwenyewe atawakamilisha[a], atawafanya imara, atawapa nguvu, na atawaweka juu ya msingi imara[b].
  rationale: The revision replaces potentially misleading correction language with a primary rendering that better fits καταρτίσει, makes the sufferers explicit, improves the idiomatic rendering of ἐν Χριστῷ, and clarifies the sense of στηρίξει. It retains the source’s sequence, emphasis, temporal limitation, and foundation imagery without resolving interpretive questions beyond the text.
  reviewer_model: gpt-5.6-terra
