review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comprehensive scope of πᾶσαν, the anxious sense of μέριμνα, the participial connection to v. 6, the divine referent supplied by context, and God's concern for the readers. However, “kumtwika yeye mahangaiko” shifts the εικόνα of ἐπιρίπτω ἐπ’ αὐτόν from casting a burden onto him to burdening him; a direct rendering of the motion onto him is preferable.
  naturalness: “Huku mkiyatupa mahangaiko yenu yote juu yake” is clear, idiomatic Standard East African Swahili and retains the metaphor without suggesting that God is unwillingly burdened. “Anawajali” is natural and appropriately pastoral.
  terminology: “Mahangaiko” suitably renders anxious cares in contemporary formal Swahili. The pronoun “yake” preserves the Greek pronoun while footnote c correctly identifies God from v. 6. The lexical notes should describe the Greek participial phrase rather than call it a single word.
  issues:
  - severity: medium
    issue: “mkimtwika yeye mahangaiko yenu yote” weakens the directional metaphor of ἐπιρίψαντες ἐπ’ αὐτόν.
    rationale: Kumtwika can mean to impose a load upon someone, whereas the Greek explicitly depicts casting the anxieties onto him. “Mkiyatupa ... juu yake” represents both the action and ἐπί with the accusative more directly.
  - severity: low
    issue: Footnote b calls a multiword Greek construction “Neno la asili.”
    rationale: The note concerns the participle and its prepositional complement, not one word; revising it improves accuracy.
  - severity: low
    issue: Footnote a includes “anajishughulisha nanyi,” which is less precise as a lexical alternative for μέλει περὶ ὑμῶν.
    rationale: It can imply merely being occupied with the readers rather than caring for them. A literal explanatory gloss is safer.
