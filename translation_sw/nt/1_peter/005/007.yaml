translation:
  language: sw
  text: huku mkiyatupa mahangaiko yenu yote juu yake[b][c], kwa sababu anawajali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anawahangaikia.” Kwa maana halisi, “ni jambo la maana kwake kuhusu ninyi.”
    reason: lexical_alternative
  - marker: b
    text: Kishirikishi cha Kigiriki kinaweza kutafsiriwa, “mkiwa mmetupa [mahangaiko yenu] juu yake,” au “mkiyatupa [mahangaiko yenu] juu yake.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, Mungu, kama inavyoonekana katika muktadha wa karibu (mstari wa 6).
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: mahangaiko yenu yote
  rationale: “Mahangaiko” huonyesha wasiwasi au mawazo yanayomsumbua mtu, na “yote” huhifadhi nguvu ya πᾶσαν.
- source_word: ἐπιρίψαντες ἐπ’ αὐτόν
  choice: huku mkimtwika yeye
  rationale: Kitenzi “kumtwika” huhifadhi picha ya kuweka mzigo juu ya mwingine; “huku” huunganisha kishirikishi hiki na agizo la mstari uliotangulia bila kukifanya agizo jipya lililojitegemea.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya kumtwika Mungu mahangaiko.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: anawajali
  rationale: Ni Kiswahili cha kawaida na chenye nguvu ya kihusiano kinachoonyesha kwamba hali yao ni jambo la maana kwake.
theological_decisions:
- issue: Mrejelewa wa αὐτόν/αὐτῷ
  choice: yeye/kiima kilichofichika katika “anawajali,” yaani Mungu kwa muktadha
  alternative: kumtaja Mungu moja kwa moja katika maandishi
  rationale: Mstari wa 6 unamtaja Mungu, hivyo ndiye mrejelewa wa kawaida; hata hivyo, viwakilishi vinahifadhi namna ya Kigiriki bila kuongeza jina katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mkimtwika” hudumisha sitiari ya kuhamisha mzigo, huku “mahangaiko” likieleweka kwa urahisi kama wasiwasi unaolemea.
