  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: sw
  text: Kupitia Silvano, ndugu mwaminifu, kama ninavyomwona, nimewaandikia kwa ufupi[a], nikiwahimiza na kushuhudia kwamba hii ndiyo neema ya kweli ya Mungu. Simameni imara ndani yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimewaandikia kwa maneno machache.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina, “ambamo mnasimama,” badala ya “Simameni imara ndani yake.”
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: kupitia Silvano
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au uwakala. Tafsiri hii inadumisha uwezekano kwamba Silvano alihusika katika kufikisha au kuandaa barua bila kubainisha jukumu lake kupita ushahidi wa matini.
- source_word: Σιλουανοῦ
  choice: Silvano
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kigiriki Σιλουανός; halibadilishwi kuwa Sila, ambalo ni umbo jingine la jina hilo.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: ndugu mwaminifu
  rationale: πιστός hapa ni sifa ya kuaminika au uaminifu, na mhusika ni mwanamume maalumu; kwa hiyo 'ndugu mwaminifu' ni sahihi na ya kawaida.
- source_word: ὡς λογίζομαι
  choice: kama ninavyomwona
  rationale: Usemi huu unaonyesha tathmini binafsi ya mwandishi kuhusu Silvano. 'Kama ninavyomwona' ni wa asili na huhifadhi sauti hiyo bila kudokeza shaka isiyokuwamo.
- source_word: δι’ ὀλίγων
  choice: kwa ufupi
  rationale: Ni nahau inayomaanisha kuandika kwa maneno machache. 'Kwa ufupi' ni Kiswahili cha kawaida na chenye maana hiyo.
- source_word: ἔγραψα
  choice: nimewaandikia
  rationale: Wakati timilifu wa Kiswahili unafaa kwa matumizi ya aoristi ya kibarua, ambapo tendo la kuandika limekamilika lakini barua iko mbele ya wasomaji.
- source_word: παρακαλῶν
  choice: nikiwahimiza
  rationale: παρακαλέω katika muktadha huu ni kusihi au kuhimiza. 'Kuhimiza' huhifadhi uzito wa mawaidha huku ikiwa ya kawaida kwa wasomaji wa leo.
- source_word: ἐπιμαρτυρῶν
  choice: na kushuhudia
  rationale: Kitenzi hiki kina nguvu ya kutoa ushahidi wa kuthibitisha. 'Kushuhudia' huhifadhi dhana hiyo kuliko neno dhaifu kama 'kuthibitisha' peke yake.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: kwamba hii ndiyo neema ya kweli ya Mungu
  rationale: Tafsiri inadumisha kiwakilishi 'hii' bila kulazimisha rejeo lake liwe jambo moja mahsusi, na 'neema ya kweli ya Mungu' hufuata uhusiano wa maneno ya Kigiriki kwa uwazi.
- source_word: εἰς ἣν στῆτε
  choice: Simameni imara ndani yake
  rationale: στῆτε katika matini hii ni amri, nayo inataka uthabiti. 'Ndani yake' humrejelea 'neema' na kuwasilisha kwa Kiswahili wazo la kudumu katika eneo au hali hiyo.
theological_decisions:
- issue: Rejeo la 'hii' katika 'hii ndiyo neema ya kweli ya Mungu'
  choice: '''Hii'' imeachwa ikiwa na upana wa kurejelea ujumbe na mawaidha ya barua kama ushuhuda wa neema ya Mungu.'
  alternative: Inaweza kurejelea kwa namna finyu zaidi uzoefu wa wasomaji wa neema au ujumbe wa injili uliowasilishwa kupitia Silvano.
  rationale: Muktadha wa kuandika, kuhimiza, na kushuhudia unapendelea ujumbe wa barua kwa ujumla, lakini matini haifungi kabisa upeo wa kiwakilishi. Tafsiri haiondoi utata huo.
- issue: Nguvu ya στῆτε mwishoni mwa aya
  choice: 'Amri: ''Simameni imara ndani yake.'''
  alternative: 'Baadhi ya hati zina kauli elezi: ''ambayo ndani yake mnasimama.'''
  rationale: Matini ya SBLGNT iliyotolewa ina στῆτε kama amri. Tofauti ya hati imehifadhiwa katika tanbihi badala ya kubadilisha matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa sentensi umefanywa wa asili kwa Kiswahili huku kishazi cha tathmini kuhusu Silvano, utata wa rejeo la 'hii,' na tofauti ya matini katika tamati vikihifadhiwa.
