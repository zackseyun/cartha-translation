  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: sw
  text: Yeye alipotukanwa, hakurudisha matusi; alipokuwa akiteseka, hakutoa vitisho, bali aliendelea kujikabidhi[a] kwa yule anayehukumu kwa haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hakitaji wazi kile alichokabidhi; pia inaweza kueleweka kuwa aliendelea kukabidhi jambo lake kwa yule anayehukumu kwa haki.
    reason: textual_ambiguity
lexical_decisions:
- source_word: λοιδορούμενος
  choice: alipotukanwa
  rationale: Kitenzi hiki huonyesha kutendewa vibaya kwa maneno. “Kutukanwa” ni Kiswahili cha kawaida na cha moja kwa moja kinachohifadhi maana hiyo.
- source_word: οὐκ ἀντελοιδόρει
  choice: hakurudisha matusi
  rationale: Tamko hili linaonyesha kwamba hakulipiza kwa maneno ya matusi. Muundo huu ni wa asili katika Kiswahili na unahifadhi nguvu ya ἀντί- ya kutenda kwa kurudisha.
- source_word: πάσχων
  choice: alipokuwa akiteseka
  rationale: Kirai hiki kinaonyesha hali iliyokuwa ikiendelea na kinadumisha ulinganifu na tukio la kutukanwa.
- source_word: οὐκ ἠπείλει
  choice: hakutisha
  rationale: Kitenzi ἀπειλέω humaanisha kutoa vitisho. “Hakutisha” ni usemi mfupi na wa kawaida unaoeleza kwamba hakutoa vitisho kwa waliomtesa.
- source_word: παρεδίδου
  choice: aliendelea kujikabidhi
  rationale: Wakati usiotimilifu wa kitenzi unaonyesha mwitikio endelevu au wa mara kwa mara. “Aliendelea kujikabidhi” unaonyesha kujiweka kwa uaminifu chini ya hukumu ya Mungu, huku tanbihi ikihifadhi kutokutajwa wazi kwa kile kilichokabidhiwa katika Kigiriki.
- source_word: τῷ κρίνοντι δικαίως
  choice: kwa yeye anayehukumu kwa haki
  rationale: Muundo huu unahifadhi maelezo ya Kigiriki badala ya kuyafupisha kuwa cheo kama “Mwamuzi mwenye haki,” na haumtajii mhusika kwa jina ambalo halipo katika mstari.
- source_word: δὲ
  choice: bali
  rationale: “Bali” huonyesha tofauti kati ya kutolipiza kisasi na mwitikio chanya wa kujikabidhi kwa anayehukumu kwa haki.
- source_word: ὃς
  choice: Yeye
  rationale: Kiwakilishi hiki kinamrejelea Kristo aliyetajwa katika mstari uliotangulia. “Yeye” huwezesha sentensi kusomeka kwa kawaida kama mstari unaojitegemea katika Kiswahili.
theological_decisions:
- issue: Mhusika wa “yeye anayehukumu kwa haki”
  choice: Ameelezwa bila kutajwa kwa jina, kama ilivyo katika Kigiriki.
  alternative: Kumtaja wazi kuwa Mungu au Mungu Baba.
  rationale: Muktadha unaelekeza kwa Mungu, lakini mstari wenyewe unatumia maelezo badala ya jina au cheo mahususi. Tafsiri inahifadhi namna hiyo na haiongezi ubainishaji wa kitheolojia.
- issue: Kitu kilichokabidhiwa katika παρεδίδου
  choice: Maandishi makuu yametumia “kujikabidhi,” huku tanbihi ikionyesha kwamba yambwa halijaelezwa wazi katika Kigiriki.
  alternative: “Alimkabidhi jambo lake” au “aliwaacha mikononi mwa” anayehukumu kwa haki.
  rationale: Katika muktadha, kujikabidhi mwenyewe ni uelewaji wenye nguvu, lakini Kigiriki kinaacha yambwa bila kutajwa. Tanbihi inalinda utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Hakurudisha matusi” na “hakutisha” ni miundo inayoeleweka kwa urahisi bila kupunguza uzito wa maelezo ya mateso ya Kristo.
