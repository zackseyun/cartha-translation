    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Jitiisheni
  rationale: Kitenzi hiki ni agizo linalowataka waamini wajitie chini ya mamlaka kwa hiari. “Jitiisheni” ni Kiswahili cha sasa na huhifadhi nguvu ya himizo.
- source_word: πάσῃ
  choice: kila
  rationale: 'Kwa kuwa linaambatana na nomino ya umoja, neno hili lina maana ya kugawa: “kila,” si “wote.”'
- source_word: ἀνθρωπίνῃ
  choice: wa kibinadamu
  rationale: Kivumishi hiki kinaonyesha kwamba utaratibu huo ni wa jamii ya wanadamu; hakisemi moja kwa moja kwamba ni mwovu wala kwamba haumo chini ya enzi ya Mungu.
- source_word: κτίσει
  choice: utaratibu
  rationale: Ingawa neno hili mara nyingi humaanisha “kiumbe” au “uumbaji,” hapa muktadha wa mfalme na watawala katika mstari unaofuata unaelekeza kwenye utaratibu wa kijamii au kiraia. “Utaratibu” ni wa kawaida zaidi kuliko “taasisi” na haugeuzi neno moja kwa moja kuwa “mamlaka.”
- source_word: διὰ τὸν κύριον
  choice: kwa ajili ya Bwana
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu au kusudi. Tafsiri hii inaonyesha kuwa kujitiisha kunatokana na uhusiano na Bwana.
- source_word: κύριον
  choice: Bwana
  rationale: Neno la Kigiriki linatoa cheo “Bwana” bila kutaja wazi “Yesu” au “Mungu”; tafsiri haibainishi zaidi ya maandishi.
- source_word: εἴτε
  choice: iwe ni
  rationale: 'Hufungua sehemu ya kwanza ya muundo unaoendelea katika mstari unaofuata: iwe ni kwa mfalme au kwa watawala.'
- source_word: βασιλεῖ
  choice: mfalme
  rationale: Maana ya msingi ni “mfalme.” Ingawa katika mazingira ya Waroma huenda ikamhusu Kaisari, “mfalme” huhifadhi upana wa neno la Kigiriki.
- source_word: ὡς ὑπερέχοντι
  choice: kama mwenye mamlaka ya juu
  rationale: Kirai kinaonyesha cheo au mamlaka iliyo juu ya wengine. Tafsiri hii ni wazi na haidai mamlaka isiyo na mipaka kama ambavyo “mkuu kabisa” ingeweza kudokeza.
theological_decisions:
- issue: Maana ya mamlaka ya kiraia katika κτίσει
  choice: Imetafsiriwa “utaratibu wa kibinadamu.”
  alternative: “kila agizo la mwanadamu,” “kila kiumbe cha kibinadamu,” au “kila taasisi ya kibinadamu”
  rationale: Muktadha unaozungumzia mfalme na watawala unaonyesha miundo ya kiraia, si wajibu wa kumtii kila mtu. “Utaratibu wa kibinadamu” huhifadhi wazo la mpangilio wa jamii bila kudai kwamba chanzo chake ni cha kibinadamu pekee.
- issue: Anayerejelewa na κύριον
  choice: Imeachwa kuwa “Bwana.”
  alternative: “Yesu” au “Mungu”
  rationale: Kigiriki hakumtaji zaidi ya cheo hiki. Kuacha “Bwana” huhifadhi uwezekano na uzito wa kitheolojia wa maandishi bila kuingiza ubainishaji usioandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. “Jitiisheni” huhifadhi agizo la wingi; “utaratibu wa kibinadamu” huepuka lugha nzito ya kisheria, na koma ya mwisho inaonyesha sentensi kuendelea katika mstari wa 14.
