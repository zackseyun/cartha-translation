translation:
  language: sw
  text: Jitiisheni kwa kila utaratibu wa kibinadamu[a] kwa ajili ya Bwana, iwe ni kwa mfalme kama mwenye mamlaka ya juu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila kilichoumbwa na wanadamu”; katika tafsiri ya jadi, “kila agizo la mwanadamu.” Hapa kirai hiki kinarejelea taratibu au taasisi za kiraia, kama inavyoonekana katika kutajwa kwa mfalme na watawala.
    reason: lexical_alternative
  - marker: b
