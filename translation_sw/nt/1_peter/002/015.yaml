  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: sw
  text: 'Kwa maana haya ndiyo mapenzi ya Mungu: kwamba kwa kutenda mema mnyamazishe ujinga wa watu wapumbavu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki maana yake halisi ni “kufunga kinywa,” yaani kumzuia mnyama kwa lijamu; hapa kimetumiwa kwa sitiari kumaanisha kukomesha maneno ya uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya himizo lililotangulia; “Kwa maana” huonyesha uhusiano huo wa kisababu kwa Kiswahili cha kawaida.
- source_word: οὕτως
  choice: ni haya
  rationale: Pamoja na kirai “mapenzi ya Mungu,” neno hili linaelekeza kwenye namna iliyotajwa; “ni haya” ni usemi wa asili na wazi katika Kiswahili.
- source_word: θέλημα
  choice: mapenzi
  rationale: “Mapenzi” ni tafsiri iliyozoeleka na inayoeleweka ya kusudi au nia ya Mungu katika muktadha huu.
- source_word: ἀγαθοποιοῦντας
  choice: kwa kutenda mema
  rationale: Kirai hiki cha hali ya kuendelea kinaonyesha njia ambayo kunyamazisha kunatimizwa; “kwa kutenda mema” huhifadhi nguvu hiyo ya kiutendaji.
- source_word: φιμοῦν
  choice: mnyamazishe
  rationale: Kitenzi hiki maana yake halisi ni kufunga kinywa kwa lijamu, lakini hapa kimetumiwa kwa sitiari kumaanisha kukomesha madai au maneno ya uhasama; “mnyamazishe” ni wazi na cha asili.
- source_word: ἀγνωσίαν
  choice: ujinga
  rationale: Neno hili linamaanisha kutokuwa na maarifa au ufahamu; “ujinga” huhifadhi pia mwelekeo wake hasi katika muktadha huu.
- source_word: ἀφρόνων ἀνθρώπων
  choice: wa watu wapumbavu
  rationale: “Watu” huwakilisha maana ya jumla ya ἀνθρώπων bila kuifanya ihusu wanaume pekee, na “wapumbavu” huonyesha ukosefu wa busara unaomaanishwa na ἀφρόνων.
theological_decisions:
- issue: Uwakilishi wa kijinsia wa ἀνθρώπων
  choice: watu
  alternative: wanaume
  rationale: Rejeleo ni kwa wanadamu wapinzani kwa ujumla, si wanaume pekee; “watu” huhifadhi upana wa maana ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa wingi “mnyamazishe” unaendeleza walengwa wa himizo katika muktadha. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kirai kinachohusika.
