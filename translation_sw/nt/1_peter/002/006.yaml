  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: sw
  text: 'Kwa maana Maandiko yanasema: “Tazama, ninaweka katika Sayuni jiwe la pembe, lililochaguliwa na lenye heshima; na yeyote anayemwamini[a] hakika hataaibishwa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, kiwakilishi cha Kigiriki kinaweza kurejelea “jiwe”; hapa kimetafsiriwa kwa mtu kwa sababu Petro analihusisha jiwe hilo na Kristo katika muktadha unaozunguka.
    reason: alternative_reading
  - marker: b
    text: 'Au: “hataaibishwa kamwe.” Muundo wa Kigiriki unasisitiza sana ukanushaji.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Kwa maana
  rationale: Inaingiza ushahidi wa Maandiko unaounga mkono kauli iliyotangulia; ‘Kwa maana’ ni ya kawaida na inaonyesha uhusiano wa maelezo.
- source_word: περιέχει ἐν γραφῇ
  choice: Maandiko yanasema
  rationale: Nahau ya Kigiriki ni isiyo ya kawaida kihalisi (‘imo/imeandikwa katika andiko’). Kiswahili hiki ni cha asili na kinafikisha maana kwamba dondoo hilo limo katika Maandiko bila kuiga muundo usioeleweka.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Inahifadhi mwito wa kinabii wa kuvuta fikira kwa lugha yenye hadhi na inayoeleweka.
- source_word: τίθημι
  choice: ninaweka
  rationale: Kitenzi hiki kinafaa kwa tendo la kuweka jiwe katika mfano wa ujenzi; ‘ninaweka’ pia huhifadhi wakati wa sasa wa Kigiriki.
- source_word: ἐν Σιὼν
  choice: katika Sayuni
  rationale: Inahifadhi maana ya mahali ya ἐν kwa Kiswahili cha kawaida.
- source_word: λίθον ἀκρογωνιαῖον
  choice: jiwe la pembeni
  rationale: Ni istilahi wazi na ya kawaida kwa jiwe muhimu linalowekwa kwenye pembe ya jengo; haiongezi dhana ya ‘kuu’ ambayo haijasemwa wazi.
- source_word: ἐκλεκτὸν
  choice: lililochaguliwa
  rationale: Inahifadhi wazo la kuchaguliwa bila kuingiza istilahi nzito ya kimafundisho.
- source_word: ἔντιμον
  choice: lenye heshima
  rationale: Neno linaweza kuonyesha heshima au thamani. Chaguo hili linatanguliza wazo la heshima, linalojitokeza pia katika muktadha wa karibu.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: yeyote anayemwamini
  rationale: ‘Yeyote’ huwasilisha vizuri kishiriki chenye maana ya mtu kwa ujumla; ‘anamwamini’ ni Kiswahili cha asili kwa imani inayoelekezwa kwa mtu.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: hakika hataaibishwa
  rationale: ‘Hakika’ huhifadhi ukanushaji wenye mkazo wa οὐ μή, na ‘hataaibishwa’ huakisi hali ya kutendwa ya kitenzi.
theological_decisions:
- issue: Rejeo la αὐτῷ katika dondoo la Isaya kama Petro anavyolitumia
  choice: 'limetafsiriwa kwa mtu: ‘anamwamini’'
  alternative: ‘anayeliamini’ au ‘anayelitegemea,’ kwa kurejelea jiwe
  rationale: Ingawa taswira ya moja kwa moja ni jiwe, muktadha wa 1 Petro 2:4–8 unalitumia jiwe hilo kumhusu Kristo. Kiswahili cha mtu kinahifadhi matumizi hayo ya Petro bila kuondoa taswira ya jiwe; tanbihi inaonyesha uwezekano wa kisarufi wa kurejelea jiwe.
- issue: Maana ya ἔντιμον
  choice: lenye heshima
  alternative: la thamani / la thamani kubwa
  rationale: Neno la Kigiriki linaweza kubeba maana ya heshima na thamani. ‘Lenye heshima’ huhifadhi mada ya heshima katika muktadha, huku uwezekano wa thamani ukiendelea kutambuliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa kwa mtiririko wa kawaida wa Kiswahili, huku sauti ya dondoo la kinabii, mfano wa jiwe, na mkazo wa ukanushaji vikihifadhiwa.
