base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: sw
  text: Kwa maana mlikuwa kama kondoo waliopotea[a], lakini sasa mmemrudia[b] Mchungaji na Mwangalizi[c] wa nafsi zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliotangatanga” au “waliopotoshwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mmerudi kwake”; umbo la Kigiriki pia linaweza kueleweka kwa maana ya kutendwa, “mlirudishwa kwake.”
    reason: alternative_reading
  - marker: c
    text: Au, “Mlinzi”; kijadi, “Askofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Kwa maana mlikuwa
  rationale: “Kwa maana” linaonyesha kuwa mstari huu unatoa msingi wa kauli iliyotangulia, na “mlikuwa” linaeleza hali yao ya zamani iliyoendelea kwa muda.
- source_word: ὡς πρόβατα
  choice: kama kondoo
  rationale: “Kama” linahifadhi ulinganisho, na “kondoo” ni neno la kawaida na la asili katika Kiswahili.
- source_word: πλανώμενοι
  choice: wanaopotea
  rationale: Chaguo hili linadumisha mfano wa kondoo wanaoenda kombo bila kuamua wazi kama walipotea wenyewe au walipotoshwa na mwingine.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: lakini sasa mmemrudia
  rationale: “Lakini sasa” linaonyesha tofauti kubwa na hali ya zamani. “Mmemrudia” ni Kiswahili cha kawaida kinachoeleza kurudi kwa mtu anayelengwa huku umbo la Kigiriki likibaki na uwezekano wa maana ya kutendwa.
- source_word: ἐπὶ τὸν ποιμένα
  choice: Mchungaji
  rationale: ποιμήν humaanisha mchungaji; herufi kubwa inaonyesha matumizi yake hapa kama cheo cha Kristo.
- source_word: καὶ ἐπίσκοπον
  choice: na Mwangalizi
  rationale: “Mwangalizi” linaonyesha mtu anayesimamia na kutunza wengine bila kuingiza maana ya baadaye ya cheo maalumu cha kanisa.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: wa nafsi zenu
  rationale: “Nafsi” linahifadhi upana wa ψυχή, ambalo linaweza kumaanisha nafsi, uhai, au mtu mwenyewe, na linafaa katika muktadha wa utunzaji wa kiroho.
theological_decisions:
- issue: Kutumia ἐπίσκοπος kama cheo cha Kristo
  choice: Mwangalizi
  alternative: Mlinzi; Askofu
  rationale: “Mwangalizi” linahifadhi maana ya mtu anayeangalia na kutunza bila kuingiza mfumo fulani wa uongozi wa kanisa kupitia “Askofu,” wala kupunguza wazo hilo kuwa ulinzi pekee.
- issue: Nuansi ya kauli katika ἐπεστράφητε
  choice: mmemrudia
  alternative: mlirudishwa kwake
  rationale: Kitenzi hiki chenye umbo la kutendwa kinaweza kutumiwa kwa maana ya kati au isiyoeleza mtendaji. Tafsiri kuu ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa kutendwa bila kuamua kabisa uhusiano kati ya tendo la Mungu na mwitikio wa mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Taswira ya kichungaji imehifadhiwa, na “Mchungaji” pamoja na “Mwangalizi” yametumiwa kama vyeo vya Kristo bila kuingiza msamiati wenye mwelekeo wa dhehebu fulani.
