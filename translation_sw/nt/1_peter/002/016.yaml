  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: sw
  text: kama watu huru, wala msiutumie uhuru kama kifuniko cha uovu, bali kama watumwa wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wa Mungu.” Neno la Kigiriki linaweza kumaanisha watumishi au watumwa; hapa “watumwa” linahifadhi tofauti yenye nguvu zaidi na “watu huru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: watu huru
  rationale: Huwataja wasomaji kwa pamoja na kuhifadhi maana ya hali ya kuwa huru bila kudokeza kuwa ni wanaume pekee.
- source_word: ἐπικάλυμμα
  choice: kifuniko
  rationale: Huhifadhi taswira ya kitu kinachoficha uovu na ni neno la kawaida katika Kiswahili cha sasa.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: msiutumie uhuru
  rationale: Muundo wa Kigiriki unasema kihalisi kuwa na uhuru kama kifuniko; Kiswahili cha kawaida hutumia kitenzi hiki kueleza wazi matumizi ya uhuru, huku nguvu ya katazo ikitokana na muktadha.
- source_word: κακίας
  choice: uovu
  rationale: Neno hili linahusu ubaya au mwenendo mwovu kwa upana; “nia mbaya” ingekuwa finyu mno katika muktadha huu.
- source_word: δοῦλοι
  choice: watumwa
  rationale: Huhifadhi maana yenye nguvu ya kuwa mali ya mwingine na kuendeleza kinaya cha watu walio huru ambao hata hivyo ni wa Mungu kabisa.
- source_word: θεοῦ δοῦλοι
  choice: watumwa wa Mungu
  rationale: Muundo huu unaonyesha kuwa wao ni wa Mungu na huhifadhi tofauti ya kimakusudi kati ya uhuru wao na kumilikiwa kwao na Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri δοῦλοι katika utambulisho wa waamini
  choice: watumwa wa Mungu
  alternative: watumishi wa Mungu
  rationale: Mstari unaweka kwa makusudi uhuru sambamba na kuwa mali ya Mungu kabisa. “Watumwa” huhifadhi mkazo na mvutano huo; “watumishi” lingeupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Muishi” limetumiwa katika kishazi cha mwisho ili Kiswahili kisikike kwa kawaida na kuweka wazi namna wanavyopaswa kuishi, huku sentensi ikiendelea kutegemea agizo la muktadha mpana.
