  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: sw
  text: 'Kwa maana hili ni jambo la neema[a]: ikiwa mtu, kwa sababu ya dhamiri inayomwelekea Mungu[b], anavumilia maumivu, huku akiteseka isivyo haki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo la kustahili sifa” au “jambo linalopata kibali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kuwa anamkumbuka Mungu” au “kwa sababu ya dhamiri yake mbele za Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γὰρ
  choice: Kwa maana hili
  rationale: “Kwa maana” linaonyesha kwamba sentensi hii inaeleza sababu ya yaliyotangulia, na “hili” linaelekeza mbele kwenye hali inayofafanuliwa katika kishazi kinachofuata.
- source_word: χάρις
  choice: jambo la neema
  rationale: Neno hili linadumisha uhusiano wa kileksika na “neema,” huku “jambo la” likifanya kauli iwe ya kawaida zaidi kwa Kiswahili. Katika muktadha linaweza kumaanisha jambo linalostahili kibali au sifa, lakini tafsiri kuu haiongezi wazi “mbele za Mungu,” jambo ambalo halijasemwa moja kwa moja katika kishazi hiki.
- source_word: διὰ συνείδησιν θεοῦ
  choice: kwa sababu ya kumtambua Mungu
  rationale: Kirai hiki ni kifupi na kinaweza kuhusisha ufahamu, kumkumbuka Mungu, au dhamiri iliyoelekezwa kwake. “Kumtambua Mungu” linaonyesha kuwa Mungu ndiye anayezingatiwa na ndiye sababu ya kuvumilia, bila kulifunga neno συνείδησις katika maana ya dhamiri ya maadili pekee.
- source_word: ὑποφέρει
  choice: anavumilia
  rationale: Kitenzi hiki kinaonyesha kustahimili kwa subira chini ya hali ngumu; “anavumilia” ni cha kawaida na wazi katika Kiswahili cha sasa.
- source_word: λύπας
  choice: huzuni
  rationale: “Huzuni” linaweza kujumuisha maumivu na dhiki za kihisia au za kimazingira zinazokusudiwa na wingi λύπας. Kiswahili kinaweza kutumia nomino hii kwa maana ya jumla bila kulazimisha wingi wa maumbo.
- source_word: πάσχων ἀδίκως
  choice: huku akiteseka isivyo haki
  rationale: 'Muundo huu unaonyesha hali inayoandamana na kuvumilia: mtu anateseka bila haki. “Isivyo haki” ni ya kawaida na haisemi kwa lazima ikiwa mateso hayo ni kinyume cha sheria.'
- source_word: τις
  choice: mtu
  rationale: “Mtu” linawakilisha kiwakilishi kisichobainisha mtu fulani na haliongezi jinsia ambayo haijasisitizwa na chanzo.
theological_decisions:
- issue: Maana ya χάρις katika muktadha
  choice: jambo la neema
  alternative: jambo la kustahili sifa; jambo linalopata kibali
  rationale: Tafsiri inadumisha mwangwi wa kitheolojia wa “neema” na pia maana yake ya jambo la kupendeza au linalostahili kibali, bila kuingiza maneno “mbele za Mungu” ambayo hayapo wazi katika kishazi hiki.
- issue: Maana ya συνείδησις θεοῦ
  choice: kumtambua Mungu
  alternative: kumkumbuka Mungu; dhamiri mbele za Mungu
  rationale: Kirai cha Kigiriki kinaweza kueleweka kama ufahamu unaomwelekea Mungu au dhamiri katika uhusiano na Mungu. Tafsiri kuu inaweka motisha inayomwelekea Mungu, na tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kirai “kwa sababu ya kumtambua Mungu” karibu na “anavumilia” unapunguza uwezekano wa kukihusisha kimakosa na kutendewa isivyo haki. Alama za tanbihi [a] na [b] zimewekwa mara tu baada ya maneno yanayohusika.
