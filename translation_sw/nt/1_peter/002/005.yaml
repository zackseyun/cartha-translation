id: 1PE.2.5
reference: 1 Peter 2:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: sw
  text: Ninyi wenyewe pia[a], kama mawe yaliyo hai, mnajengwa kuwa nyumba ya kiroho[d], mpate kuwa ukuhani mtakatifu[b], ili mtoe dhabihu za kiroho zinazokubalika kwa Mungu kwa njia ya Yesu Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninyi pia ni kama mawe yaliyo hai.”
    reason: Mpangilio wa Kigiriki unaweza kuwasilishwa kwa kuifanya tashbihi kuwa sehemu ya kauli kwa uwazi zaidi.
  - marker: b
    text: Au, “kwa ajili ya ukuhani mtakatifu” au “kuwa ukuhani mtakatifu.” Kihusishi cha Kigiriki kinaweza kuonyesha lengo au matokeo.
    reason: Huhifadhi uwezekano wa kisarufi wa εἰς bila kuamua kwa uhakika uhusiano wake.
  - marker: c
    text: Kigiriki, “Yesu Kristo”; hapa Χριστός limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.
    reason: Hufafanua uamuzi wa kutafsiri cheo badala ya kutumia umbo la kimapokeo “Kristo.”
  - marker: d
    text: Au, “mnajengwa kama nyumba ya kiroho, mpate kuwa ukuhani mtakatifu.”
    reason: Kishazi nomino “nyumba ya kiroho” kinaweza kueleweka kama hali au utambulisho wa jengo linalojengwa.
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: Ninyi wenyewe pia
  rationale: “Ninyi wenyewe” huhifadhi mkazo wa kiwakilishi αὐτοί, na “pia” huonyesha nguvu ya kuongezea ya καί inayowaunganisha wasomaji na Kristo, jiwe lililo hai katika muktadha uliotangulia.
- source_word: ὡς λίθοι ζῶντες
  choice: kama mawe yaliyo hai
  rationale: Huhifadhi wazi tashbihi ya mawe na sifa ya kuwa hai, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: οἰκοδομεῖσθε
  choice: mnajengwa
  rationale: Huhifadhi kauli tendwa na hali ya tendo linaloendelea bila kumtaja wazi mtendaji ambaye mstari wenyewe hamtaji.
- source_word: οἶκος πνευματικός
  choice: nyumba ya kiroho
  rationale: Ni tafsiri ya karibu na ya kawaida inayodumisha sitiari ya jengo na kutobainisha zaidi maana ya πνευματικός kuliko chanzo.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: mpate kuwa ukuhani mtakatifu
  rationale: “Mpate kuwa” huwasilisha lengo au matokeo yanayoweza kuonyeshwa na εἰς; “ukuhani” hudumisha wazo la kundi la kikuhani, si makuhani mmoja mmoja tu.
- source_word: ἀνενέγκαι
  choice: ili mtoe
  rationale: Katika muktadha wa dhabihu, ἀναφέρω humaanisha kutoa dhabihu. “Ili” huonyesha kusudi la kitenzi-jina cha Kigiriki kwa Kiswahili cha kawaida.
- source_word: πνευματικὰς θυσίας
  choice: dhabihu za kiroho
  rationale: Huhifadhi lugha ya dhabihu na kivumishi πνευματικός bila kueleza dhabihu hizo ni nini hasa.
- source_word: εὐπροσδέκτους θεῷ
  choice: zinazokubalika kwa Mungu
  rationale: Hufikisha lugha ya dhabihu kupokewa au kukubaliwa na Mungu kwa usemi wa kawaida na wenye heshima.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kwa njia ya Yesu Masihi
  rationale: “Kwa njia ya” huonyesha uhusiano wa njia au upatanishi wa διά pamoja na hali ya umilikishi; “Masihi” hutafsiri Χριστός kama cheo cha Yesu.
theological_decisions:
- issue: Kauli na mtendaji katika οἰκοδομεῖσθε
  choice: Kauli tendwa “mnajengwa,” bila kumtaja mtendaji
  alternative: “mnajijenga”
  rationale: Umbo la Kigiriki ni la kauli tendwa au kati, lakini muktadha unaunga mkono kupokea tendo la kujengwa. Tafsiri haiongezi jina la mtendaji ambalo halipo katika mstari.
- issue: Uhusiano wa εἰς ἱεράτευμα ἅγιον na οἶκος πνευματικός
  choice: “mpate kuwa ukuhani mtakatifu,” ikionyesha lengo au matokeo
  alternative: “kwa ajili ya ukuhani mtakatifu” au “kuwa ukuhani mtakatifu”
  rationale: εἰς inaweza kuonyesha lengo au matokeo. Usemi huu ni wa kawaida katika Kiswahili lakini tanbihi inadumisha uwezekano mwingine wa kisarufi.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός imeambatanishwa na Yesu kama cheo; “Masihi” huhifadhi maana ya cheo hicho bila kubadili dai la kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mnajengwa” na “nyumba ya kiroho” hudumisha sitiari na kauli tendwa; “ukuhani mtakatifu” hudumisha lugha ya kikuhani ya chanzo, huku tanbihi zikihifadhi utata wa kisarufi.
