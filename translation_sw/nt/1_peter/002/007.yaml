  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: sw
  text: Kwa hiyo, heshima hiyo ni yenu ninyi mnaoamini[a]; lakini kwa wale wasioamini[b], “Jiwe ambalo wajenzi walilikataa, hilo limekuwa jiwe kuu la pembeni.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “thamani hiyo ni kwa ajili yenu ninyi mnaoamini,” yaani, jiwe lina thamani kubwa kwa waamini.
    reason: alternative_reading
  - marker: b
    text: Au, “wale wasiotii”; kitenzi hiki kinaweza kumaanisha kukataa kuamini na hivyo kutotii.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “kichwa cha pembe.” Tafsiri nyingine hutumia “jiwe la pembeni” au “jiwe la msingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: heshima
  rationale: Neno hilo linaweza kumaanisha heshima, thamani, au hali ya kuwa na thamani kubwa. Katika kishazi hiki, “heshima hiyo ni yenu” huhifadhi muundo mfupi wa Kigiriki na utofautishaji kati ya wanaoamini na wasioamini bila kulazimisha maana ya thamani ya jiwe pekee.
- source_word: τοῖς πιστεύουσιν
  choice: ninyi mnaoamini
  rationale: Huhifadhi usemi wa moja kwa moja kwa wasomaji pamoja na maana ya kitenzi cha kuamini.
- source_word: ἀπιστοῦσιν
  choice: wale wasioamini
  rationale: Hii ndiyo maana ya moja kwa moja katika utofautishaji na “mnaoamini”; maana inayoweza kuhusisha kutotii imewekwa katika tanbihi.
- source_word: λίθος
  choice: jiwe
  rationale: Ni neno la kawaida na la asili katika Kiswahili kwa mfano huu wa ujenzi.
- source_word: ἀπεδοκίμασαν
  choice: walilikataa
  rationale: Hutoa maana ya kukataa kitu baada ya kukichunguza au kukitathmini, kwa lugha ya kawaida na wazi.
- source_word: οἱ οἰκοδομοῦντες
  choice: wajenzi
  rationale: Hii ni tafsiri ya asili ya kivumishi-tenzi kilichotumiwa kama nomino katika mfano wa ujenzi.
- source_word: κεφαλὴν γωνίας
  choice: jiwe kuu la pembeni
  rationale: Kiswahili cha neno kwa neno, “kichwa cha pembe,” hakitoi kwa uwazi picha ya usanifu. “Jiwe kuu la pembeni” huhifadhi picha ya jiwe lenye nafasi kuu kwenye pembeni huku tanbihi ikionyesha muundo halisi na mbadala wa kimapokeo.
theological_decisions:
- issue: Maana ya ἡ τιμή kwa uhusiano na waamini na Kristo aliye jiwe
  choice: Kishazi kinasema kwamba heshima hiyo ni ya waamini.
  alternative: “Thamani hiyo ni kwa ajili yenu ninyi mnaoamini,” yaani, jiwe lina thamani kubwa kwa waamini.
  rationale: Muundo ὑμῖν ... ἡ τιμή unaelekea moja kwa moja kusema kwamba heshima ni yao waamini na unaafikiana na wazo la kutopata aibu katika muktadha. Uhusiano na thamani ya jiwe katika mstari uliotangulia unabaki uwezekano halisi na umehifadhiwa katika tanbihi.
- issue: Maana ya κεφαλὴ γωνίας
  choice: “Jiwe kuu la pembeni” limetumiwa ili picha ya usanifu ieleweke kwa Kiswahili cha sasa.
  alternative: “Kichwa cha pembe,” “jiwe la pembeni,” au “jiwe la msingi.”
  rationale: Kigiriki kina maana halisi ya “kichwa cha pembe,” lakini usemi huo si wa asili wala wazi katika Kiswahili. Tafsiri kuu huhifadhi ukuu wa jiwe na mahali pake pembeni bila kuamua kwa uhakika kazi yake mahususi ya usanifu; tanbihi huhifadhi usemi halisi na mapokeo mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa sentensi umefanywa kuwa wa asili kwa kuweka “heshima hiyo ni yenu,” huku utofautishaji wa waamini na wasioamini na dondoo la Zaburi vikihifadhiwa. Alama zote za tanbihi zimo katika matini kuu.
