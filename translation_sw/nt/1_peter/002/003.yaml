  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: sw
  text: ikiwa kweli mmeonja kwamba Bwana ni mwema[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa mmeonja.” Kigiriki kinatumia muundo wa sharti ambao unaweza kudhania kwamba sharti hilo ni kweli.
    reason: alternative_reading
  - marker: b
    text: Neno “mwema” linaweza pia kutafsiriwa “mwenye fadhili” au “mwenye neema.” Maneno haya yana mwangwi wa Zaburi 34:8.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: ikiwa kweli
  rationale: Huhifadhi muundo wa sharti wa Kigiriki huku neno “kweli” likionyesha kuwa msemaji anatazamia sharti hilo kuwa limetimia.
- source_word: ἐγεύσασθε
  choice: mmeonja
  rationale: Huhifadhi taswira halisi ya kuonja, inayopatana na habari ya lishe katika 2:2–3 na mwangwi wa Zaburi 34:8, huku pia ikiruhusu maana ya kupitia jambo kwa uzoefu.
- source_word: ὅτι
  choice: kwamba
  rationale: 'Hutambulisha moja kwa moja maudhui ya kile walichoonja: kwamba Bwana ni mwema.'
- source_word: χρηστὸς
  choice: mwema
  rationale: Ni tafsiri pana na ya kawaida inayohifadhi mwangwi wa Zaburi 34:8; neno la Kigiriki linaweza pia kusisitiza wema wenye fadhili au neema.
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi cheo chenye uzito wa kitheolojia bila kumtaja mhusika kwa ufafanuzi wa ziada, na hivyo kuacha wazi uhusiano wake na Kristo katika muktadha pamoja na mwangwi wa Zaburi.
theological_decisions:
- issue: Nguvu ya kishazi cha sharti εἰ
  choice: ikiwa kweli mmeonja
  alternative: kwa kuwa mmeonja
  rationale: Kigiriki kinatumia sharti ambalo huenda linadhania kuwa jambo hilo ni kweli. Tafsiri kuu inahifadhi umbo la sharti na msisitizo wake wa balagha bila kuligeuza moja kwa moja kuwa dai.
- issue: Anayerejelewa kwa cheo “Bwana”
  choice: Bwana
  alternative: Bwana (Kristo)
  rationale: Muktadha unahusianisha cheo hiki kwa karibu na Yesu, lakini maneno hayo pia yanarejelea Zaburi 34:8. Kutoweka “Kristo” ndani ya matini kunahifadhi mvutano na mwangwi huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mmeonja” ni cha kawaida na huhifadhi taswira ya lishe; “ikiwa kweli” ni ya asili na inabeba sharti pamoja na matarajio kwamba limekwisha timia.
