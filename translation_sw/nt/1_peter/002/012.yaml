source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: sw
  text: Mwenendo wenu kati ya watu wa mataifa uwe mzuri, ili katika mambo ambayo wanawasingizia kuwa watenda maovu, wakitazama matendo yenu mema, wamtukuze Mungu katika siku ya kujiliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siku ambayo Mungu atakapokuja kuwafikia.” Neno la Kigiriki linaweza kumaanisha ujio au ziara yenye kuleta neema, uchunguzi, au hukumu.
    reason: Kuhifadhi upana na utata wa maana ya ἐπισκοπή bila kuamua kwa nguvu aina ya ujio wa Mungu unaokusudiwa.
lexical_decisions:
- source_word: ἀναστροφή
  choice: mwenendo
  rationale: Neno hili humaanisha namna ya kuishi au tabia inayoonekana katika maisha; “mwenendo” ni la kawaida, lenye heshima, na linafaa katika muktadha huu.
- source_word: ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu linarejelea wale walio nje ya jumuiya ya waumini, hasa wasio Wayahudi; “watu wa mataifa” huhifadhi maana hiyo bila kutumia neno lisiloeleweka kwa urahisi.
- source_word: καλήν
  choice: mzuri
  rationale: Hueleza mwenendo ulio mwema na wenye kuvutia kimaadili; “mzuri” ni wa asili katika Kiswahili pamoja na “mwenendo.”
- source_word: καταλαλοῦσιν
  choice: wanawasingizia
  rationale: Kitenzi kina maana ya kusema vibaya dhidi ya mtu; hapa mashtaka ya kuwaita waumini watenda maovu yanaelezwa kwa asili kama kuwasemea kwa uongo au kuwasingizia.
- source_word: ἐποπτεύοντες
  choice: wakitazama
  rationale: Husisitiza kuona au kuchunguza kwa macho; “wakitazama” huhifadhi uhusiano wa moja kwa moja na matendo mema yanayoonekana.
- source_word: ἐπισκοπή
  choice: kujiliwa
  rationale: Nomino hii inaweza kumaanisha ziara au ujio wa Mungu wenye kusudi la neema au hukumu; “kujiliwa” huhifadhi wazo la Mungu kuja kuwafikia watu bila kuliamulia kabisa.
theological_decisions:
- issue: Maana ya ἐν ἡμέρᾳ ἐπισκοπῆς
  choice: katika siku ya kujiliwa kwake
  alternative: katika siku ya Mungu kuja kuwafikia / katika siku ya ukaguzi
  rationale: Kirai kinaweza kueleweka kuwa siku ya Mungu kuja kwa neema, kwa uchunguzi, au kwa hukumu. Tafsiri kuu huhifadhi mvutano huo, na tanbihi inaeleza uwezekano wa maana.
- issue: Uhusiano wa ἐν ᾧ na masingizio
  choice: katika mambo ambayo wanawasingizia
  alternative: ingawa wanawasingizia
  rationale: Muundo wa Kigiriki ni halisi zaidi kama “katika jambo/mambo ambayo,” ukirejelea msingi au eneo la masingizio. Hivyo tafsiri haibadilishi kimya kimya muundo huo kuwa kauli ya concessive “ingawa.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mantiki na mvutano wa Kigiriki huku ikiepuka msamiati wa kimadhehebu. “Kujiliwa” ni la kibiblia lakini bado linaeleweka; tanbihi inafafanua maana yake.
