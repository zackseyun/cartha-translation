  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: sw
  text: Mnapomjia[a], jiwe lililo hai, lililokataliwa na watu, lakini mbele za Mungu limechaguliwa na ni la thamani,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkimjia,” au, “Mkiendelea kumjia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: yeye
  rationale: Kiwakilishi kinadumisha rejeo la Kigiriki bila kuingiza jina la Yesu waziwazi; pamoja na kitenzi “mnapomjia” kinaonyesha mwelekeo wa kumwelekea.
- source_word: προσερχόμενοι
  choice: mnapomjia
  rationale: Muundo huu wa wakati unaoendelea unaonyesha tendo la wasomaji la kuendelea kumjia, na unasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: λίθον ζῶντα
  choice: jiwe lililo hai
  rationale: “Jiwe” huhifadhi taswira ya jiwe la ujenzi, na “lililo hai” hudumisha fumbo lenye mkazo la chanzo.
- source_word: ὑπὸ ἀνθρώπων
  choice: na watu
  rationale: ἄνθρωποι hapa inawahusu wanadamu kwa jumla; “watu” ni ya kawaida, jumuishi, na inatofautisha hukumu ya kibinadamu na tathmini ya Mungu.
- source_word: ἀποδεδοκιμασμένον
  choice: lililokataliwa
  rationale: Huwasilisha kwa uwazi hali iliyotokana na kuchunguzwa na kukataliwa, bila kufanya sentensi kuwa nzito.
- source_word: παρὰ δὲ θεῷ
  choice: lakini mbele za Mungu
  rationale: “Mbele za Mungu” huonyesha hadhi au tathmini kwa mtazamo wa Mungu, na kuhifadhi utofauti na kukataliwa na watu.
- source_word: ἐκλεκτὸν
  choice: limechaguliwa
  rationale: Hutoa maana ya kuchaguliwa na Mungu kwa lugha ya kawaida bila kutumia istilahi nzito ya kiteolojia.
- source_word: ἔντιμον
  choice: ni la thamani
  rationale: Huhifadhi maana ya kuthaminiwa sana na pia inafaa kwa taswira ya jiwe; muundo huu huepuka utata wa kukifanya kitenzi “limechaguliwa” kitawale kivumishi hiki.
theological_decisions:
- issue: Rejeo la kiwakilishi na taswira ya jiwe
  choice: Kudumisha kiwakilishi “yeye” huku muktadha ukimtambulisha kuwa Bwana Yesu/Masihi.
  alternative: Kuingiza wazi “Yesu” au “Kristo.”
  rationale: Muktadha wa 2:3–8 unaonyesha kuwa anayerejelewa ni Kristo, lakini mstari huu wenyewe unatumia kiwakilishi; tafsiri haiongezi jina lisilokuwapo katika chanzo.
- issue: Maana ya ὑπὸ ἀνθρώπων
  choice: “na watu”
  alternative: “na wanadamu” au “na wanaume”
  rationale: Katika muktadha huu neno linawakilisha tathmini ya kibinadamu kwa jumla, si wanaume pekee. “Watu” ni sahihi na ya asili katika Kiswahili bila kupunguza utofauti wa watu na Mungu.
- issue: Uhusiano wa ἐκλεκτὸν na ἔντιμον na Mungu
  choice: “mbele za Mungu limechaguliwa na ni la thamani”
  alternative: “limechaguliwa na kuheshimiwa na Mungu”
  rationale: Kigiriki kinaweza kueleweka kama kueleza hadhi ya jiwe kwa Mungu—teule na lenye thamani. Tafsiri inadumisha lugha ya thamani na mvutano wa kisarufi bila kubadili ἔντιμον kuwa tendo la moja kwa moja la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha taswira ya ujenzi na mpangilio wa utofauti kati ya kukataliwa na watu na kuthaminiwa mbele za Mungu.
