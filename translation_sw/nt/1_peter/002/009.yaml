revisions:
- from: Lakini ninyi ni jamii iliyochaguliwa[a], ukuhani wa kifalme, taifa takatifu, watu walio mali yake mwenyewe, ili mpate kutangaza sifa kuu[b] za yule aliyewaita kutoka gizani na kuingia katika nuru yake ya ajabu.
  to: Lakini ninyi ni jamii iliyochaguliwa[a], ukuhani wa kifalme, taifa takatifu, watu wa milki yake mwenyewe, ili mpate kutangaza fadhila[b] za yule aliyewaita kutoka gizani kuingia katika nuru yake ya ajabu.
  rationale: The revision clarifies the Greek directional construction, improves the idiomatic expression of special possession, and uses a term for τὰς ἀρετὰς that better retains the breadth of divine excellencies. No doctrinal interpretation beyond the verse is introduced.
