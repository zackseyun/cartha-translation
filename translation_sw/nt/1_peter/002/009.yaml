id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: sw
  text: Lakini ninyi ni jamii iliyochaguliwa[a], ukuhani wa kifalme, taifa takatifu, watu wa milki yake mwenyewe, ili mpate kutangaza fadhila[b] za yule aliyewaita kutoka gizani kuingia katika nuru yake ya ajabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukoo uliochaguliwa.” Neno la Kigiriki linaweza kumaanisha ukoo, jamii, au watu wenye asili moja.
    reason: lexical_alternative
  - marker: b
    text: Au, “sifa” au “matendo makuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Lakini ninyi
  rationale: “Lakini” inaonyesha utofauti na maelezo yaliyotangulia kuhusu wasioamini, na “ninyi” inadumisha mkazo wa kiwakilishi kilichotajwa waziwazi.
- source_word: γένος ἐκλεκτόν
  choice: jamii iliyochaguliwa
  rationale: γένος inaweza kumaanisha ukoo, jamii, au watu wenye asili moja. “Jamii” inadumisha maana ya utambulisho wa pamoja bila kuleta dhana za kisasa za kibaguzi zinazoweza kuambatana na “rangi.”
- source_word: βασίλειον ἱεράτευμα
  choice: ukuhani wa kifalme
  rationale: Tafsiri hii inadumisha kwa ufupi vipengele vyote viwili vya kifalme na kikuhani katika msemo unaorejelea Kutoka 19:6.
- source_word: ἔθνος ἅγιον
  choice: taifa takatifu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi maana ya watu waliowekwa wakfu na kutengwa kwa ajili ya Mungu.
- source_word: λαὸς εἰς περιποίησιν
  choice: watu walio mali yake mwenyewe
  rationale: περιποίησις hapa huonyesha umiliki wa pekee. Kiwakilishi “yake” kinamrejelea Mungu kwa mujibu wa muktadha, ingawa hakitajwi wazi katika kirai hiki cha Kigiriki.
- source_word: ὅπως
  choice: ili
  rationale: “Ili” huonyesha kusudi la utambulisho na wito wa watu hao.
- source_word: τὰς ἀρετὰς
  choice: sifa kuu
  rationale: ἀρετή inaweza kumaanisha ubora unaostahili kusifiwa na, kwa muktadha, inaweza kuhusisha pia matendo makuu ya Mungu. “Sifa kuu” inadumisha upana huo kuliko kuielekeza kwa matendo pekee.
- source_word: ἐξαγγείλητε
  choice: mpate kutangaza
  rationale: Kitenzi hiki kina nguvu ya kutangaza hadharani; “mpate” baada ya “ili” kinaonyesha tendo lililokusudiwa.
- source_word: τοῦ ... καλέσαντος
  choice: za yule aliyewaita
  rationale: Muundo huu unamtambulisha Mungu kwa tendo lake la kuita bila kuongeza jina lake mahali ambapo halipo katika Kigiriki.
- source_word: ἐκ σκότους ... εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: kutoka gizani na kuingia katika nuru yake ya ajabu
  rationale: Tafsiri hii inadumisha mwendo wa kutoka katika hali au eneo moja na kuingia jingine, pamoja na taswira ya giza na nuru.
theological_decisions:
- issue: Majina ya pamoja yanayotokana na lugha ya agano la Israeli
  choice: Kudumisha moja kwa moja “jamii iliyochaguliwa,” “ukuhani wa kifalme,” na “taifa takatifu.”
  alternative: Kuyafanya majina hayo kuwa maelezo ya jumla au mafumbo ili kupunguza athari zake za kiteolojia.
  rationale: Aya yenyewe inatumia kwa makusudi majina ya agano kwa wasomaji wa Petro. Tafsiri inadumisha dai hilo bila kuamua kwa msomaji mfumo mpana wa kiteolojia kuhusu uhusiano kati ya Israeli na jumuiya hii.
- issue: Mwenye watu katika λαὸς εἰς περιποίησιν
  choice: Kuweka wazi kwa “yake” kwamba watu hao ni mali ya Mungu.
  alternative: Kuacha kirai kisicho na mwenye dhahiri, kama “watu kwa ajili ya kumilikiwa.”
  rationale: Muktadha unamtambulisha Mungu kuwa ndiye mwenye watu hao. Kiswahili cha kawaida huhitaji uhusiano huo kuwekwa wazi, lakini tafsiri haiongezi madai zaidi ya muktadha.
- issue: Upeo wa τὰς ἀρετὰς
  choice: Kutumia “sifa kuu,” inayoweza kujumuisha tabia na kazi za Mungu zinazostahili kusifiwa.
  alternative: Kutumia “matendo makuu,” ambayo yanaelekeza maana hasa kwenye kazi zake.
  rationale: Neno la Kigiriki linaweza kutaja ubora au jambo linalostahili sifa. Tafsiri kuu inadumisha upana huo, huku maana inayolenga matendo ikiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Jamii” huepuka maana potovu ya kikabila au kibaguzi; “ukuhani wa kifalme” na “taifa takatifu” hudumisha mwangwi wa lugha ya agano. Muundo wa mwisho umefanywa wa kawaida kwa Kiswahili kwa kutumia “kutoka ... na kuingia ...” bila kuondoa taswira ya Kigiriki.
