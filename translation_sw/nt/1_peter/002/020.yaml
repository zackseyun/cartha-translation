id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: sw
  text: Kwa maana, ni sifa gani ikiwa, mkitenda dhambi na kupigwa, mnavumilia? Lakini ikiwa, mkitenda mema na kuteseka, mnavumilia, hilo ni neema mbele za Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hilo hupata kibali kwa Mungu,” au, “hilo linastahili sifa mbele za Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: sifa
  rationale: Katika swali hili la balagha, neno hili linamaanisha sifa au ustahili wa kupongezwa, si umaarufu kwa maana pana.
- source_word: ἁμαρτάνοντες
  choice: mnatenda dhambi
  rationale: Tafsiri hii huhifadhi wazi uzito wa kimaadili na kitheolojia wa kutenda dhambi.
- source_word: κολαφιζόμενοι
  choice: kupigwa
  rationale: Kitenzi hiki hurejelea kupigwa, hasa kwa ngumi; ‘kupigwa’ ni wazi na ya kawaida katika Kiswahili cha sasa bila kuongeza maelezo yasiyosemwa moja kwa moja.
- source_word: ὑπομενεῖτε
  choice: mnavumilia
  rationale: ‘Kuvumilia’ huonyesha kubaki imara chini ya mateso na huhifadhi urudiaji wa kitenzi katika sehemu zote mbili.
- source_word: ἀγαθοποιοῦντες
  choice: mnatenda mema
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida kwa kutenda yaliyo mema au yenye manufaa.
- source_word: πάσχοντες
  choice: kuteseka
  rationale: Neno hili lina maana pana ya kupitia mateso; tafsiri hii haiibani kuwa aina fulani tu ya kutendewa vibaya.
- source_word: χάρις
  choice: neema
  rationale: ‘Neema’ huhifadhi uwazi wa kileksika na mwangwi wa kitheolojia, huku tanbihi ikionyesha maana ya kimuktadha ya kibali au jambo linalostahili sifa.
- source_word: παρὰ θεῷ
  choice: mbele za Mungu
  rationale: Kirai hiki kinaonyesha jambo lilivyo katika uwepo au tathmini ya Mungu; ‘mbele za Mungu’ ni usemi wa kawaida na wenye heshima.
theological_decisions:
- issue: Maana ya χάρις katika kifungu cha mwisho
  choice: hilo ni neema mbele za Mungu
  alternative: hilo hupata kibali kwa Mungu; hilo linastahili sifa mbele za Mungu
  rationale: Muktadha unaweza kuelekeza kwenye kibali au pongezi kutoka kwa Mungu, lakini ‘neema’ huhifadhi neno muhimu la chanzo na mvutano wake wa kitheolojia. Tanbihi hutoa maana mbadala ya kimuktadha bila kuifungia tafsiri upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Miundo ya vitenzi vya wakati unaoendelea imetumiwa kudokeza hali zinazoendelea katika vishirikishi vya Kigiriki. Urudiaji wa ‘mnavumilia’ umehifadhiwa kwa ajili ya msisitizo wa kifungu.
