  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: sw
  text: na, “jiwe la kujikwaa na mwamba wa kuangusha.” Wanajikwaa kwa sababu hawalitii neno; na kwa hilo pia waliwekwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: na kwa ajili ya hilo pia waliteuliwa.'
    reason: ἐτέθησαν inaweza kutafsiriwa ‘waliwekwa’ au ‘waliteuliwa,’ na εἰς ὃ ina kirejeleo chenye utata kiasi.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: jiwe la kujikwaa
  rationale: Huhifadhi taswira ya kitu kinachosababisha mtu ajikwae, kwa lugha ya kawaida na yenye hadhi.
- source_word: πέτρα σκανδάλου
  choice: mwamba wa kuangusha
  rationale: Hutofautisha πέτρα ‘mwamba’ na λίθος ‘jiwe’ na kuwasilisha wazo la kikwazo kinachosababisha kuanguka.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: kwa sababu hawalitii neno
  rationale: ἀπειθέω hapa ina maana ya kutokutii; muundo huu unaonyesha uhusiano wa kutokutii neno na kujikwaa.
- source_word: ἐτέθησαν
  choice: waliwekwa
  rationale: Hufuata kitenzi cha hali ya kutendwa bila kumtaja wazi mtendaji, kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Kirejeleo cha εἰς ὃ katika kauli ya mwisho
  choice: kwa hilo pia waliwekwa
  alternative: waliwekwa ili wasitii / wajikwae
  rationale: Kigiriki kinaweza kuhusisha ‘hilo’ na kujikwaa kulikotajwa, lakini hakisemi wazi kwamba waliwekwa ili wasitii. Tafsiri inahifadhi mvutano huo bila kuufafanua kidhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Jiwe’ na ‘mwamba’ hudumisha utofauti wa istilahi za Kigiriki; sentensi ya mwisho imeachwa na kiwango cha utata kilichopo katika chanzo.
