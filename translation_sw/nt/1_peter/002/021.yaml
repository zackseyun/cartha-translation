  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: sw
  text: Kwa maana mlitiwa mwito kwa kusudi hili, kwa kuwa Masihi naye aliteseka kwa ajili yenu, akiwaachia kielelezo[a], ili mfuate nyayo zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfano wa kufuatwa.” Neno la Kigiriki linaweza kumaanisha kielelezo cha maandishi kilichowekwa mbele ya wanafunzi ili wanakili kwa kukifuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: jambo hili
  rationale: Hurejelea yaliyotangulia kuhusu kuvumilia mateso yasiyo ya haki; muundo huu ni wa kawaida katika Kiswahili na hauongezi kusudi lisilotajwa wazi.
- source_word: ἐκλήθητε
  choice: mliitiwa
  rationale: Kauli ya kutendwa inadumisha wazo la mwito, pamoja na uzito wake wa kitheolojia, bila kufafanua zaidi namna ya mwito huo.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha msingi au sababu ya mwito uliotajwa.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός inatumika kama cheo cha Mtiwa-Mafuta, si kama jina la kawaida tu.
- source_word: ἔπαθεν
  choice: aliteseka
  rationale: Inatafsiri kitenzi bila kuongeza kwamba alikufa au kubainisha aina ya mateso ambayo mstari huu hautaji.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Inahifadhi maana pana ya kutenda kwa manufaa au kwa niaba ya wengine bila kulazimisha ufafanuzi mmoja tu wa kitheolojia.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: akiwaachia
  rationale: Inadumisha uhusiano wa kirai tegemezi na Masihi na kuonyesha kuwa kielelezo kiliachwa kwa ajili ya wasomaji.
- source_word: ὑπογραμμὸν
  choice: kielelezo
  rationale: Neno hili linaeleza mfano wa kufuatwa kwa ufasaha; taswira mahsusi ya kielelezo cha maandishi kwa wanafunzi imehifadhiwa katika tanbihi.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa Kiswahili cha kawaida na fasaha.
- source_word: ἐπακολουθήσητε
  choice: mfuate
  rationale: Baada ya 'ili,' umbo hili la Kiswahili huwasilisha kusudi la kufuata bila kufanya sentensi kuwa nzito.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: nyayo zake
  rationale: Inahifadhi taswira halisi ya kufuata alikopita mtu na pia maana yake ya kuiga mwenendo wake.
theological_decisions:
- issue: Maana ya ὑπὲρ ὑμῶν kuhusiana na mateso ya Masihi
  choice: kwa ajili yenu
  alternative: kwa niaba yenu; badala yenu
  rationale: Tafsiri hii inadumisha maana ya manufaa na uwakilishi, na inaweza kubeba mwangwi wa kuchukua nafasi, bila kuifanya aya hii iseme kwa uwazi zaidi ya ilivyosema katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili lakini unahifadhi mtiririko wa hoja, taswira ya nyayo, na uhusiano kati ya mateso ya Masihi na mwito wa waamini.
