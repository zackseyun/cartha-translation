id: 1PE.2.11
reference: 1 Peter 2:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: sw
  text: Wapenzi, nawasihi, kama wageni na wakaaji wa muda[a], mjiepushe na tamaa za mwili[b], ambazo hupigana vita dhidi ya nafsi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wasio wenyeji na wakazi wa muda.” Maneno haya mawili yanasisitiza kwamba waumini hawafungamani kikamilifu na enzi au jamii ya sasa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tamaa za kimwili.” Inaweza pia kutafsiriwa “tamaa zitokanazo na mwili”; “tamaa za dhambi” ni tafsiri yenye ufafanuzi zaidi.
    reason: lexical_alternative
  - marker: c
    text: “Nafsi” hapa inaweza pia kueleweka kuwa “uhai” au “mtu mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Wapenzi
  rationale: Ni kivumishi cha wito katika wingi kinachoonyesha upendo wa dhati. “Wapenzi” ni cha asili, chenye heshima, na kinahifadhi uhusiano wake na lugha ya upendo.
- source_word: παρακαλῶ
  choice: nawasihi
  rationale: Katika muktadha huu kitenzi kinaonyesha himizo la dhati, si ombi la kawaida wala faraja tu. “Nawasihi” kinabeba uzito huo kwa Kiswahili cha sasa.
- source_word: ὡς
  choice: kama
  rationale: Kinawatambulisha wasomaji kwa hali wanayopaswa kuzingatia. “Kama” hakiongezi maana ya sababu ambayo haijasemwa wazi.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: wageni na wakaaji wa muda
  rationale: Maneno haya mawili yanaonyesha kwa pamoja kutokuwa wenyeji kamili na kukaa mahali kwa muda. Tafsiri hii ni wazi kwa msomaji wa kawaida huku ikidumisha utofauti wa maneno hayo.
- source_word: ἀπέχεσθαι
  choice: mjiepushe na
  rationale: Himizo linahusu kuendelea kujitenga na kutoshiriki katika jambo fulani. “Mjiepushe na” ni usemi wa kawaida na wenye nguvu ya kimaadili.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: tamaa za mwili
  rationale: “Tamaa” hapa zina mwelekeo mbaya wa kimaadili, lakini neno lenyewe lina maana pana kuliko tamaa ya kingono. “Za mwili” kinahifadhi sitiari na uhusiano wa σαρκικός na σάρξ bila kuifafanua mapema kuwa “asili ya dhambi.”
- source_word: αἵτινες
  choice: ambazo
  rationale: Kiwakilishi hiki kinaanzisha maelezo ya tabia ya tamaa hizo; “ambazo” kinaunganisha sentensi kwa kawaida.
- source_word: στρατεύονται
  choice: hupigana vita
  rationale: Kitenzi kinatumia taswira ya kijeshi ya kushambulia kwa uadui. “Hupigana vita” kinahifadhi nguvu na mwendelezo wa taswira hiyo.
- source_word: κατὰ τῆς ψυχῆς
  choice: dhidi ya nafsi
  rationale: “Nafsi” kinahifadhi upana wa ψυχή kama uhai au utu wa ndani bila kulazimisha maana ya maisha ya kimwili pekee au mgawanyo maalumu wa mwili na roho.
theological_decisions:
- issue: Maana ya σαρκικῶν katika muktadha wa maadili
  choice: za mwili
  alternative: za dhambi
  rationale: “Za mwili” kinadumisha sitiari ya chanzo na mvutano wa kitheolojia wa neno la asili. “Za dhambi” kingekuwa ufafanuzi wa maana badala ya kuacha lugha ya chanzo isikike.
- issue: Maana ya ψυχή
  choice: nafsi
  alternative: uhai au mtu mwenyewe
  rationale: “Nafsi” kinabeba uzito wa kiutu na wa ndani wa neno hilo, lakini hakipaswi kuchukuliwa kuwa kinathibitisha hapa mgawanyo wa kiufundi kati ya mwili na roho. Tanbihi inahifadhi uwezekano wa maana pana zaidi.
- issue: Utambulisho wa παροίκους καὶ παρεπιδήμους
  choice: wageni na wakaaji wa muda
  alternative: wahamiaji na wapitaji
  rationale: Jozi hii inadumisha hali ya wasomaji ya kutokuwa wenyeji kamili na ya makao yasiyo ya kudumu, bila kuamua ikiwa maelezo hayo ni ya kijamii tu au pia yana maana ya kitheolojia kuhusu kutokuwa wa enzi hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “Wapenzi” kwa sauti ya kichungaji, “mjiepushe” kwa himizo la wazi, na “hupigana vita” ili kuhifadhi taswira hai ya kijeshi. Istilahi za kitheolojia zimeachwa na upana wake pale ambapo Kigiriki kina utata wa kweli.
