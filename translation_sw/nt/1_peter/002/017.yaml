  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: sw
  text: Waheshimuni watu wote; wapendeni jamaa ya waamini[a]; mcheni Mungu; mheshimuni mfalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jumuiya ya ndugu waamini.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki ni “mfalme,” lakini katika mazingira ya Dola ya Roma huenda linamrejelea Kaisari.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: watu wote
  rationale: Neno hili limetumika kama nomino na linawahusu watu wote. “Watu wote” ni Kiswahili cha kawaida kinachoweka wazi upeo wake wa jumla.
- source_word: τιμήσατε / τιμᾶτε
  choice: waheshimuni / mheshimuni
  rationale: Kitenzi kilekile cha Kigiriki kimerudiwa mwanzoni na mwishoni; kwa hiyo mzizi uleule wa Kiswahili, “heshimu,” umetumiwa ili kuhifadhi urudiaji huo. Tofauti ya hali ya tendo kati ya amri hizo mbili haihitaji kuonyeshwa kwa maneno ya ziada katika sentensi hii fupi.
- source_word: τὴν ἀδελφότητα
  choice: jamaa ya waamini
  rationale: Neno hili humaanisha ushirika wa kindugu wa waamini. “Jamaa ya waamini” ni ya asili katika Kiswahili, inaendeleza taswira ya familia, na inaonyesha kwamba kinachokusudiwa ni jumuiya ya waamini, si wanaume peke yao.
- source_word: ἀγαπᾶτε
  choice: wapendeni
  rationale: “Penda” ni tafsiri ya moja kwa moja na ya kawaida. Amri ya Kiswahili inaweza kuwasilisha tendo linaloendelea bila kuongeza neno kama “endelea.”
- source_word: τὸν θεὸν
  choice: Mungu
  rationale: Hiki ndicho kipashio cha moja kwa moja cha kitenzi φοβεῖσθε na kinatafsiriwa kwa namna ya kawaida kuwa “Mungu.”
- source_word: φοβεῖσθε
  choice: mcheni
  rationale: “Kumcha Mungu” huhifadhi uzito wa kitenzi cha Kigiriki kuliko kukipunguza kuwa heshima ya kawaida, na ni usemi wa asili katika Kiswahili cha kibiblia na cha sasa.
- source_word: τὸν βασιλέα
  choice: mfalme
  rationale: Maana ya moja kwa moja ya βασιλεύς ni “mfalme.” Katika mazingira ya Kirumi huenda mtawala anayelengwa ni Kaisari, yaani maliki; uwezekano huo umewekwa katika tanbihi badala ya kubadili neno la matini.
theological_decisions:
- issue: Tofauti kati ya wajibu kwa Mungu na wajibu kwa mtawala wa kiraia
  choice: “Mcheni Mungu” lakini “mheshimuni mfalme”
  alternative: Kutumia “mheshimuni Mungu” au “mstahini Mungu,” na “mheshimuni mtawala”
  rationale: 'Matini inatumia vitenzi tofauti kimakusudi: Mungu anapaswa kuogopwa/kuchwa, ilhali mfalme anapaswa kuheshimiwa. Tafsiri hii inadumisha tofauti na mpangilio huo bila kuingiza nadharia pana zaidi ya kisiasa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano mfupi wa amri na urudiaji wa “heshimu” umehifadhiwa. “Jamaa ya waamini” huepuka dhana kwamba wanaume pekee ndio wanaokusudiwa huku ikidumisha taswira ya kifamilia ya neno la Kigiriki.
