  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: sw
  text: au kwa watawala[a], kama wale waliotumwa na yeye ili kuwaadhibu watenda maovu na kuwasifu watenda mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliotumwa kupitia kwake,” ikimrejelea mfalme aliyetajwa katika mstari uliotangulia; wengine huelewa “kupitia kwake” kwa maana pana zaidi, ya Mungu kupanga mamlaka.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: au kwa
  rationale: 'Inaendeleza muundo wa uchaguzi ulioanza katika mstari uliotangulia: ‘iwe kwa mfalme ... au kwa watawala.’'
- source_word: ἡγεμόσιν
  choice: watawala
  rationale: Neno hili humaanisha maafisa wenye mamlaka ya kutawala; ‘watawala’ ni la kawaida na halibainishi kupita kiasi cheo fulani cha utawala wa Roma.
- source_word: ὡς
  choice: kama
  rationale: Linawatambulisha watawala kwa sifa yao kama waliotumwa, huku likihifadhi uhusiano wa moja kwa moja wa sentensi ya Kigiriki.
- source_word: δι’ αὐτοῦ
  choice: naye
  rationale: διά pamoja na hali ya umilikishi huonyesha wakala au njia. ‘Naye’ ni Kiswahili cha asili katika muundo ‘waliotumwa naye’ na kwa kawaida humrejelea mfalme wa mstari uliotangulia.
- source_word: πεμπομένοις
  choice: watu waliotumwa
  rationale: Kirai hiki kinaonyesha kwamba watawala wamepewa mamlaka kwa kutumwa; ‘waliotumwa’ huhifadhi maana bila kuongeza wazo lenye nguvu zaidi la kupewa agizo rasmi.
- source_word: εἰς ἐκδίκησιν
  choice: ili kuwaadhibu
  rationale: Katika muktadha wa utawala, neno hili linaeleza kutekelezwa kwa adhabu au haki dhidi ya wakosaji. Muundo wa kusudi ni wa asili katika Kiswahili.
- source_word: κακοποιῶν
  choice: watenda maovu
  rationale: Huwataja watu wenye sifa ya kutenda uovu; tafsiri hii ni fupi, ya heshima, na huhifadhi wazo la kitendo.
- source_word: ἔπαινον
  choice: kuwasifu
  rationale: Hueleza sifa au pongezi inayotolewa kwa wenye mwenendo mwema na inasawazisha kimuundo ‘kuwaadhibu.’
- source_word: ἀγαθοποιῶν
  choice: watenda mema
  rationale: Huwataja watu wanaotenda mema; tafsiri hii ni ya kawaida na inalingana na ‘watenda maovu.’
theological_decisions:
- issue: Mrejelewa wa αὐτοῦ katika δι’ αὐτοῦ
  choice: Kiwakilishi katika ‘naye’ kwa kawaida kinamrejelea mfalme/mfalme mkuu aliyetajwa katika mstari uliotangulia.
  alternative: Baadhi huelewa kwamba mamlaka hizo zimetumwa kupitia Mungu au ndani ya mpango wake wa mamlaka.
  rationale: Mfalme ndiye mtangulizi wa karibu zaidi katika muktadha na maana hiyo inafaa wazo la mamlaka ya kiraia iliyokabidhiwa. Tanbihi inahifadhi uwezekano mpana wa kumrejelea Mungu bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Watawala’ huepuka kubainisha kupita kiasi mfumo wa majimbo ya Roma; ulinganifu wa ‘watenda maovu’ na ‘watenda mema’ huifanya sentensi iwe wazi na rahisi kusomeka.
