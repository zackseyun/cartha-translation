base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: sw
  text: Ninyi ambao zamani hamkuwa watu[a], lakini sasa ni watu wa Mungu; ninyi ambao hamkuwa mmepata rehema[b], lakini sasa mmepata rehema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Petro anadokeza Hosea 1:9–10; 2:23, akitumia kwa wasomaji wake lugha ya kurejeshwa kwa Israeli kueleza utambulisho wao wa sasa kuwa watu wa Mungu.
    reason: cross_reference
  - marker: b
    text: 'Au: “ninyi ambao hamkuonyeshwa rehema, lakini sasa mmeonyeshwa rehema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: ninyi ambao
  rationale: Kiwakilishi hiki cha uhusiano kinawarejelea wasomaji waliotajwa katika mstari uliotangulia; “ninyi ambao” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ποτε
  choice: hapo zamani
  rationale: Huonyesha hali yao ya awali ikilinganishwa na hali yao ya sasa; “hapo zamani” ni ya kawaida na yenye heshima.
- source_word: λαὸς
  choice: watu / watu wa Mungu
  rationale: λαός hapa ina maana ya jumuiya yenye utambulisho wa pamoja. “Hamkuwa watu” huhifadhi usemi wa Kigiriki usiosema wazi “watu wa Mungu” katika sehemu ya kwanza, huku “watu wa Mungu” ikitafsiri λαὸς θεοῦ kwa kawaida.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Huhifadhi uhusiano wa umilikaji katika kirai λαὸς θεοῦ na maana yake ya agano.
- source_word: οὐκ ἠλεημένοι
  choice: hamkuwa mmepata rehema
  rationale: Muundo huu huonyesha hali ya awali ya kutokuwa wapokeaji wa rehema na kudumisha ulinganifu wa kileksia na sehemu inayofuata.
- source_word: ἐλεηθέντες
  choice: mmepata rehema
  rationale: Huwasilisha tendo la Mungu la rehema pamoja na hali ya sasa inayotokana nalo, kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: lakini
  rationale: Huonyesha wazi tofauti na mabadiliko kati ya hali ya zamani na ya sasa katika vifungu vyote viwili.
- source_word: νῦν
  choice: sasa
  rationale: Huonyesha hali yao ya sasa ikilinganishwa moja kwa moja na hali yao ya zamani.
theological_decisions:
- issue: Dokezo la Hosea na lugha ya utambulisho wa watu wa agano
  choice: Kuhifadhi tofauti kati ya “hamkuwa watu” na “sasa ni watu wa Mungu.”
  alternative: Kutafsiri sehemu ya kwanza kwa ufafanuzi zaidi kuwa “hamkuwa watu wa Mungu.”
  rationale: Kigiriki katika sehemu ya kwanza hakisemi wazi “wa Mungu,” ingawa kinadokeza Hosea. Tafsiri hii huhifadhi maneno ya kifungu, mabadiliko ya utambulisho wa jumuiya, na mvutano wa kiteolojia bila kuingiza dai finyu la kikabila au la kimadhehebu.
- issue: Rehema kama kitu kilichopokewa au tendo walilotendewa
  choice: “Hamkuwa mmepata rehema ... sasa mmepata rehema.”
  alternative: “Hamkuonyeshwa rehema ... sasa mmeonyeshwa rehema.”
  rationale: Kauli tendwa ya Kigiriki inaweza kuwasilishwa kwa njia zote mbili. Chaguo kuu ni la kawaida katika Kiswahili na linaonyesha hali ya wapokeaji; tanbihi huhifadhi uwezekano wa kusisitiza tendo walilotendewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “ninyi ambao” na “lakini sasa” yamehifadhiwa ili kuonyesha usambamba na mabadiliko makali ya kifungu cha Kigiriki.
