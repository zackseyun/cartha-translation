id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: sw
  text: Yeye mwenyewe alizibeba dhambi zetu mwilini mwake juu ya mti[a], ili, baada ya kufa kwa dhambi, tuishi kwa haki. Kwa jeraha lake[b] mliponywa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya msalaba”; Kigiriki ni “juu ya mti,” huenda kikitoa mwangwi wa Kumbukumbu la Torati 21:23.
    reason: alternative_reading
  - marker: b
    text: Au “kwa alama ya kipigo chake” au “kwa mchubuko wake”; nomino ya umoja inatoa mwangwi wa Isaya 53:5.
    reason: lexical_alternative
  - marker: c
    text: Uponyaji umetajwa kwa maana pana. Katika muktadha unahusiana na dhambi na haki, lakini maneno yenyewe hayauwekei mpaka wa kuwa uponyaji wa mwili pekee wala wa kiroho pekee.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: alizibeba
  rationale: Kitenzi hiki kinaweza kumaanisha kupandisha, kutoa kama sadaka, au kubeba. “Alizibeba” kinahifadhi wazo la Kristo kubeba dhambi zetu na mwangwi wa Isaya 53 bila kulazimisha maana moja ya kiufundi ya dhabihu.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: mwilini mwake
  rationale: Hii ni njia ya asili ya Kiswahili ya kuonyesha kwamba mateso na kubeba dhambi yalihusisha mwili wake halisi.
- source_word: ἐπὶ τὸ ξύλον
  choice: juu ya mti
  rationale: ξύλον ni “mti” au “kuni.” “Mti” kinahifadhi neno la Kigiriki na mwangwi unaowezekana wa Kumbukumbu la Torati 21:23, huku hapa kikirejelea msalaba.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: tukiwa tumeachana na dhambi
  rationale: ἀπογίνομαι huonyesha kuondoka au kukoma kwa uhusiano fulani. Kauli hii ya Kiswahili inaeleza kuvunjika kabisa kwa uhusiano na dhambi kwa lugha ya kawaida, bila kudokeza kwamba dhambi ndizo zilizosababisha kifo chao.
- source_word: τῇ δικαιοσύνῃ
  choice: tuishi maisha ya uadilifu
  rationale: Katika muktadha huu δικαιοσύνη inaelekeza kwenye maisha yaliyo sawa mbele za Mungu. “Maisha ya uadilifu” ni Kiswahili cha sasa na cha wazi kuliko “kuishi kwa haki,” ambacho kinaweza kueleweka kama kuishi kwa ajili ya haki za mtu.
- source_word: μώλωπι
  choice: jeraha
  rationale: μώλωψ ni jeraha au alama iliyoachwa na kipigo. “Jeraha” ni neno la kawaida linalohifadhi umoja wa nomino na mwangwi wa Isaya 53:5.
- source_word: ἰάθητε
  choice: mliponywa
  rationale: Hii inawakilisha hali ya kutendwa ya wakati uliopita na kuhifadhi upana wa lugha ya kuponywa bila kuifunga kwa uponyaji wa mwili pekee.
- source_word: αὐτὸς
  choice: Yeye mwenyewe
  rationale: Kauli hii inahifadhi mkazo wa kiwakilishi cha Kigiriki kwamba yeye binafsi ndiye aliyebeba dhambi zetu.
theological_decisions:
- issue: Upeo wa uponyaji katika kishazi cha mwisho
  choice: Kudumisha “mliponywa” bila kutaja kwamba ni uponyaji wa mwili pekee au wa roho pekee.
  alternative: Uponyaji wa mwili pekee; uponyaji wa kiroho kutoka dhambini; au uponyaji wa jumla wenye mkazo wa wokovu.
  rationale: Muktadha wa karibu unahusu dhambi, uadilifu, na mateso ya Kristo, kwa hiyo uponyaji unahusiana wazi na kurejeshwa kutoka dhambini. Hata hivyo, neno lenyewe ni pana, nalo linaendeleza mwangwi wa Isaya 53; tafsiri haipaswi kulifinya kuwa fomula nyembamba ya kimafundisho.
- issue: Tafsiri ya ξύλον
  choice: Kutumia “mti” katika matini kuu.
  alternative: Msalaba.
  rationale: Ingawa mstari huu unarejelea kusulubiwa kwa Yesu, Kigiriki kimetumia ξύλον badala ya σταυρός. “Mti” kinahifadhi uchaguzi huo wa mwandishi na mwangwi wa Maandiko ya awali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “mwilini mwake” na “tuishi maisha ya uadilifu” umechaguliwa kwa uasili wa Kiswahili; “mti” na “jeraha” vimehifadhi taswira na miangwi ya Maandiko ya Kigiriki.
