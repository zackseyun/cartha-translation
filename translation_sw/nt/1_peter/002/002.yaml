  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: sw
  text: Kama watoto wachanga waliozaliwa karibuni, yatamanini sana maziwa safi ya kiroho[a], ili kwa hayo mpate kukua kuelekea wokovu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maziwa safi ya kiakili” au “maziwa safi yanayopatana na akili.” Kivumishi cha Kigiriki kinaweza kumaanisha kinachohusu akili, busara, au maisha ya ndani; katika muktadha huu huenda kinarejelea lishe ya kiroho badala ya maziwa halisi.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya nakala za kale hazina maneno “kuelekea wokovu.”
    reason: textual_variant
lexical_decisions:
- source_word: ὡς
  choice: Kama
  rationale: Huanzisha ulinganisho, si utambulisho; ni njia ya kawaida ya kuwasilisha tashbihi kwa Kiswahili.
- source_word: ἀρτιγέννητα βρέφη
  choice: watoto wachanga waliozaliwa karibuni
  rationale: Huhifadhi maana ya watoto waliozaliwa muda mfupi uliopita na taswira ya uchanga bila kuwa nzito isivyo lazima.
- source_word: τὸ λογικὸν
  choice: ya kiroho
  rationale: Katika sitiari hii, neno linaonyesha lishe isiyo maziwa halisi bali inayohusu maisha ya ndani. Tafsiri za karibu zaidi na maana ya akili zimehifadhiwa katika tanbihi kwa sababu neno hilo lina utata halisi.
- source_word: ἄδολον
  choice: safi
  rationale: Hutoa wazo la kitu kisichochanganywa wala kughushiwa, na huambatana kwa kawaida na 'maziwa' katika Kiswahili.
- source_word: γάλα
  choice: maziwa
  rationale: Huhifadhi sitiari kuu ya lishe; 'maziwa' ndilo neno la kawaida la Kiswahili.
- source_word: ἐπιποθήσατε
  choice: yatamanini sana
  rationale: Huwasilisha agizo la kuwa na shauku kubwa bila kutumia lugha ya mazungumzo mno.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi la agizo kwa njia ya kawaida na wazi.
- source_word: ἐν αὐτῷ
  choice: kwa hayo
  rationale: Hurejelea maziwa kama njia ambayo ukuaji unatokea; upatanisho wa kisarufi wa Kiswahili unahitaji 'hayo' kwa 'maziwa'.
- source_word: αὐξηθῆτε
  choice: mpate kukua
  rationale: Hutoa kwa kawaida kusudi la kitenzi cha Kigiriki kilicho katika hali ya kutendwa, bila kulazimisha muundo mzito wa Kiswahili.
- source_word: εἰς σωτηρίαν
  choice: kuelekea wokovu
  rationale: Huhifadhi mwelekeo au lengo lililo katika εἰς bila kuamua kimadhehebu iwapo wokovu unaozungumziwa ni wa sasa tu au wa wakati ujao tu.
theological_decisions:
- issue: Maana ya λογικός katika sitiari ya maziwa
  choice: ya kiroho
  alternative: ya kiakili; yanayopatana na akili
  rationale: Katika muktadha wa kuzaliwa upya na kukua, 'ya kiroho' huwasilisha kwa ufasaha kwamba maziwa hayo ni lishe ya maisha ya ndani, si maziwa halisi. Hata hivyo, maana inayohusiana na akili au busara ni halali na imewekwa katika tanbihi ili utata wa Kigiriki usifichwe.
- issue: Nguvu ya εἰς σωτηρίαν
  choice: kukua kuelekea wokovu
  alternative: kukua kwa ajili ya wokovu; kukua hata kufikia wokovu
  rationale: Lugha ya mwelekeo huhifadhi mwendo kuelekea utimilifu wa wokovu bila kuingiza fundisho maalumu kuhusu hatua za wokovu, utakaso, au uhakika wa wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo 'yatamanini sana' huhifadhi uzito wa agizo, na 'kuelekea wokovu' huhifadhi mvutano wa kitheolojia wa εἰς σωτηρίαν.
