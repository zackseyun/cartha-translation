base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: sw
  text: Enyi watumishi wa nyumbani[a], jitiisheni kwa mabwana zenu kwa heshima kamili[b], si kwa wale walio wema na wapole tu, bali pia kwa wale wasio wa haki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa wa nyumbani.” Neno la Kigiriki οἰκέται linarejelea hasa watu wa utumishi wa nyumbani walio chini ya mamlaka ya bwana wa nyumba.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “kwa hofu yote”; hapa maana yake ni heshima yenye unyenyekevu.
    reason: lexical_alternative
  - marker: c
    text: Au, “wakorofi.” Neno la Kigiriki kwa msingi humaanisha “waliopinda” au “waliopotoka,” na kwa mfano linaweza kumaanisha wasio wa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: watumishi wa nyumbani
  rationale: Neno hili linawahusu hasa watu waliokuwa chini ya mamlaka ya mkuu wa nyumba na kufanya huduma za nyumbani. Tafsiri hii inaonyesha mazingira ya nyumbani bila kuficha kwamba katika muktadha huo wangeweza kuwa watumwa; hilo limebainishwa katika tanbihi.
- source_word: ὑποτασσόμενοι
  choice: jitiisheni
  rationale: Ingawa ni umbo la kitenzi-shirikishi, katika muktadha lina nguvu ya amri. “Jitiisheni” ni Kiswahili cha kawaida kinachoonyesha kujiweka chini ya mamlaka.
- source_word: ἐν παντὶ φόβῳ
  choice: kwa heshima yote
  rationale: φόβος inaweza kumaanisha hofu, uchaji, au heshima. Hapa kirai kinaeleza mwenendo wa unyenyekevu na heshima, huku maana halisi ya “hofu” ikihifadhiwa katika tanbihi.
- source_word: δεσπόταις
  choice: mabwana zenu
  rationale: δεσπότης humaanisha mwenye mamlaka juu ya watumishi au watumwa wa nyumbani. “Mabwana” linaonyesha uhusiano huo wa mamlaka bila kuchanganya neno hili na cheo cha kimungu.
- source_word: ἀγαθοῖς
  choice: walio wema
  rationale: Huhifadhi maana pana ya kimaadili ya ἀγαθός na kutofautishwa kwake na sifa inayofuata.
- source_word: ἐπιεικέσιν
  choice: wapole
  rationale: ἐπιεικής huonyesha upole, ustahimilivu, na utendaji wa haki wenye kiasi. “Wapole” ni neno fupi na la kawaida linalofaa katika muktadha huu.
- source_word: σκολιοῖς
  choice: waliopotoka
  rationale: σκολιός kwa msingi humaanisha kilichopinda au kupotoka, na kwa mfano humweleza mtu asiye mwadilifu au anayewatendea wengine vibaya. “Waliopotoka” huhifadhi sitiari hiyo bila kuibana maana kuwa ukali pekee.
theological_decisions:
- issue: Kutafsiri hadhi ya οἰκέται bila kupunguza wala kuzidisha hali yao ya kijamii
  choice: watumishi wa nyumbani
  alternative: watumwa wa nyumbani
  rationale: Neno la msingi linaonyesha wategemezi wa nyumbani waliokuwa chini ya mamlaka ya bwana; wengi wao walikuwa watumwa. Matini kuu inabaki ya kawaida na inayoeleweka, huku tanbihi ikihifadhi kwa uwazi tafsiri ya “watumwa wa nyumbani.”
- issue: Ikiwa φόβος itafsiriwe kama hofu au kwa maana yake ya kimuktadha
  choice: kwa heshima yote
  alternative: kwa hofu yote
  rationale: Muktadha unasisitiza kujitiisha kwa heshima. Hata hivyo, kwa kuwa neno la Kigiriki linaweza kumaanisha “hofu,” maana hiyo haijaondolewa bali imewekwa katika tanbihi.
- issue: Ikiwa σκολιοῖς ifafanuliwe kuwa wakali au wasio wa haki
  choice: waliopotoka
  alternative: wakali au wasio wa haki
  rationale: Tafsiri iliyochaguliwa huhifadhi sitiari pana ya kitu kilichopinda, hivyo haifungi maana katika ukali au ukosefu wa haki pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima, na inayoeleweka kwa wasomaji wa kawaida. Mwito “Enyi” unaweka wazi kundi linalozungumziwa; “jitiisheni” huwasilisha nguvu ya amri ya kitenzi-shirikishi katika muktadha. Tanbihi zinahifadhi utata wa kihistoria na kileksika bila kuingiza msimamo wa kimadhehebu.
