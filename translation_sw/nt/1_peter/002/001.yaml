  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: sw
  text: Kwa hiyo, baada ya kuacha[a] uovu wote, hila yote, unafiki wote, wivu wote, na masengenyo yote[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkiwa mmeacha.” Kitenzi cha Kigiriki kinaonyesha tendo la kuondoa linalotangulia agizo katika mstari wa 2.
    reason: lexical_alternative
  - marker: b
    text: Au “maneno yote ya kuwasema wengine vibaya.” Neno la Kigiriki linahusu kwa upana usemi dhidi ya wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: mkiwa mmeacha
  rationale: Kirai hiki cha hali kinaonyesha tendo la kuondoa lililo maandalizi kwa agizo kuu katika mstari wa 2. “Mkiwa mmeacha” huhifadhi uhusiano huo bila kulifanya kuwa agizo tofauti.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na muktadha uliotangulia, hasa 1:22–25.
- source_word: πᾶσαν κακίαν
  choice: kila aina ya uovu
  rationale: Katika orodha hii κακία yahusu ubaya au nia mbaya kwa wengine; Kiswahili “kila aina ya uovu” ni cha kawaida na huhifadhi upana wa neno.
- source_word: πάντα δόλον
  choice: udanganyifu wote
  rationale: δόλος ni hila au tabia ya kudanganya; “udanganyifu” ni neno la sasa na linaloeleweka wazi.
- source_word: ὑποκρίσεις
  choice: unafiki
  rationale: Ingawa Kigiriki kina wingi, Kiswahili kwa kawaida hutumia nomino ya dhana “unafiki”; maana ya matendo au namna mbalimbali za unafiki haipotei katika muktadha wa orodha.
- source_word: φθόνους
  choice: wivu
  rationale: Kiswahili hutumia “wivu” kama nomino ya dhana, hata ambapo Kigiriki kina wingi.
- source_word: πάσας καταλαλιάς
  choice: kila namna ya kuwasema wengine vibaya
  rationale: καταλαλιά ni usemi dhidi ya wengine unaowaharibia sifa; tafsiri hii huhifadhi upana wake kuliko neno lenye maana ya kisheria pekee.
theological_decisions:
- issue: Maneno ya orodha ya maovu na upeo wake wa kimaadili
  choice: Kutafsiri kila ovu kwa lugha halisi na wazi bila kuongeza ufafanuzi wa kimadhehebu
  alternative: Kutumia “uovu wote” kwa κακία au “masingizio yote” kwa καταλαλιάς
  rationale: Aya ni himizo la kimaadili. Tafsiri iliyochaguliwa huhifadhi nguvu ya orodha na upana wa maneno ya Kigiriki bila kuingiza fundisho lisilosemwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Aya inaendelezwa hadi mstari wa 2, kwa hiyo koma ya mwisho imehifadhiwa. Wingi wa Kigiriki katika ὑποκρίσεις na φθόνους umetolewa kwa nomino za dhana zinazotumika kwa kawaida katika Kiswahili.
