  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: sw
  text: Yeye hakutenda dhambi yoyote[b], wala udanganyifu[a] haukupatikana kinywani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hila”; neno la Kigiriki linaweza kumaanisha udanganyifu, ulaghai, au usaliti.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yana mwangwi wa Isaya 53:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: Yeye
  rationale: Kiwakilishi hiki kinamrejelea Kristo aliyetajwa katika muktadha uliotangulia. “Yeye” huendeleza rejeo hilo kwa Kiswahili cha kawaida bila kuongeza mkazo usiokuwamo katika Kigiriki.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: hakutenda dhambi yoyote
  rationale: Kitenzi ποιέω pamoja na ἁμαρτία humaanisha kwa kawaida ‘kutenda dhambi.’ Neno “yoyote” linaonyesha wazi nguvu ya ukanushi bila kubadili maana.
- source_word: οὐδὲ
  choice: wala
  rationale: “Wala” linaunganisha vipashio viwili hasi kwa njia ya kawaida na sahihi katika Kiswahili.
- source_word: εὑρέθη
  choice: haukuonekana
  rationale: Huu ni usemi wa kutendwa unaohifadhi wazo la kwamba udanganyifu haukuonekana au kugunduliwa, bila kutaja mtendaji.
- source_word: δόλος
  choice: udanganyifu
  rationale: “Udanganyifu” ni neno la sasa na linaloeleweka, likijumuisha wazo la hila, ulaghai, au kusema kwa nia ya kupotosha.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: kinywani mwake
  rationale: Tafsiri hii ya karibu inahifadhi taswira ya kinywa na mwangwi wa Isaya 53:9.
theological_decisions:
- issue: Mwangwi wa Isaya 53:9 katika maelezo ya kutokuwa na dhambi na udanganyifu kwa Kristo
  choice: 'Kudumisha maneno ya karibu na Kigiriki: “hakutenda dhambi yoyote” na “udanganyifu haukupatikana kinywani mwake.”'
  alternative: “Hakuwahi kufanya dhambi, wala hakuwahi kusema kwa udanganyifu.”
  rationale: Muundo wa karibu na chanzo unahifadhi nguvu ya dai kuhusu Kristo na mwangwi wa Isaya bila kulipanua kuwa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa karibu na chanzo ili kuhifadhi mwangwi wa Agano la Kale.
