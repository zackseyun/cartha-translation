  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: sw
  text: Kwa maana waliondoka kwa ajili ya Jina, bila kupokea chochote kutoka kwa watu wa mataifa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wapagani” au “wasioamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Pamoja na nomino katika hali ya genitivi, ὑπέρ hapa inaonyesha sababu au kusudi la kuondoka kwao, si kutenda badala ya mtu mwingine.
- source_word: τοῦ ὀνόματος
  choice: Jina
  rationale: Kigiriki kinasema kihalisi “Jina,” ikiwa ni namna ya heshima ya kumrejelea Yesu/Bwana bila kumtaja wazi. Herufi kubwa huhifadhi uzito huo huku tafsiri ikiepuka kuongeza jina lisilomo katika mstari.
- source_word: ἐξῆλθον
  choice: waliondoka
  rationale: Kitenzi hiki kinaeleza kutoka au kuanza safari; “waliondoka” ni Kiswahili cha kawaida na chenye heshima kinachofaa muktadha wa safari ya huduma.
- source_word: μηδὲν λαμβάνοντες
  choice: bila kupokea chochote
  rationale: Kirai shirikishi kinaonyesha jinsi walivyoondoka. “Bila kupokea chochote” huwasilisha wazi kwamba hawakukubali msaada wa mali au fedha kutoka kwa kundi linalotajwa.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: kutoka kwa watu wa mataifa
  rationale: ἐθνικοί hapa inawataja watu walio nje ya jumuiya ya waamini kwa mtazamo wa Kiyahudi-Kikristo. “Watu wa mataifa” huhifadhi rangi ya kihistoria na kileksika bila kuibana maana kuwa ya waabudu sanamu pekee.
theological_decisions:
- issue: Mrejelewa wa “Jina”
  choice: Kumrejelea Yesu/Bwana kwa heshima, lakini kumwacha bila kutajwa wazi kama ilivyo katika Kigiriki.
  alternative: “jina la Kristo” au “jina lake”
  rationale: Muktadha wa utume unaonyesha mrejelewa, lakini matini yenyewe inatumia kifupi cha heshima “Jina.” Kukihifadhi huepuka kuongeza ufafanuzi usiotajwa wazi na hudumisha mvutano wa kitheolojia wa usemi huo.
- issue: Maana ya ἐθνικῶν
  choice: “watu wa mataifa” katika matini kuu.
  alternative: “wapagani” au “wasioamini”
  rationale: Neno hilo linaweza kumaanisha watu wasio Wakristo katika muktadha huu, lakini pia lina historia ya kuwataja watu wa mataifa mengine. Tafsiri kuu huhifadhi pande hizo, na tanbihi inaonyesha maana zinazowezekana kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa kawaida; “Jina” limeandikwa kwa herufi kubwa ili kuonyesha matumizi yake ya heshima, na “watu wa mataifa” limehifadhiwa badala ya tafsiri finyu zaidi.
