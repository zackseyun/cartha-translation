  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: sw
  text: Mpendwa[a], unatenda kwa uaminifu katika lolote unalowafanyia ndugu[b], na hasa wale walio wageni kwako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mpendwa wangu.” Neno hili ni mwito wenye upendo; halisemi wazi kwamba anayehutubiwa ni rafiki.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” ni la wingi wa kiume. Katika muktadha linamaanisha waamini wenzao, ingawa huenda kundi hilo lilijumuisha wanawake.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: “na hilo kwa wageni.” Hawa ni ndugu ambao Gayo hakuwafahamu binafsi, si lazima watu wa taifa jingine.'
    reason: source_ambiguity
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Mpendwa
  rationale: Ni nomino ya mwito ya umoja yenye upendo. “Mpendwa” huhifadhi joto la salamu hiyo na mtindo wenye heshima wa barua bila kuongeza wazo la urafiki ambalo halijasemwa wazi.
- source_word: πιστὸν ποιεῖς
  choice: unatenda kwa uaminifu
  rationale: Nahau hii inaweza kutafsiriwa neno kwa neno kuwa “unafanya jambo la uaminifu,” lakini “unatenda kwa uaminifu” ni Kiswahili cha kawaida kinachohifadhi sifa ya uaminifu na kutegemeka kwa Gayo.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: katika lolote unalowafanyia
  rationale: Kiwakilishi cha uhusiano pamoja na ἐάν na kitenzi tegemezi hutoa maana isiyo na kikomo, “lolote.” Kitenzi ἐργάζομαι hapa kinahusu matendo ya msaada, kwa hiyo “unalowafanyia” ni cha asili na kinaonyesha walengwa wa matendo hayo.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: unalo­wafanyia ndugu
  rationale: εἰς ina maana ya kunufaisha katika muktadha huu. “Ndugu” ni neno la kawaida la Kiswahili kwa waamini wenzao na halilazimishi maana ya ndugu wa damu.
- source_word: καὶ τοῦτο ξένους
  choice: tena hasa wanapokuwa wageni kwako
  rationale: Kirai hiki kinasisitiza kwamba huduma hiyo inawahusu ndugu ambao Gayo hakuwafahamu binafsi. “Tena hasa” huonyesha nguvu ya καὶ τοῦτο kwa Kiswahili cha asili, huku tanbihi ikihifadhi muundo wa moja kwa moja zaidi.
- source_word: ξένους
  choice: wageni kwako
  rationale: ξένος hapa humaanisha watu wasiojulikana kwa mwenyeji, si lazima watu wa taifa jingine. Kuongeza “kwako” kunafafanua uhusiano huo bila kuwafanya wawe wageni wa kigeni.
theological_decisions:
- issue: Utambulisho wa “ndugu”
  choice: Neno limeachwa kuwa “ndugu,” likiwaelekeza wasomaji kwa waamini wenzao katika muktadha.
  alternative: ndugu wa kiume pekee; au ndugu wa kiume na wa kike
  rationale: ἀδελφούς ni wingi wa kiume kisarufi, lakini katika matumizi ya Kikristo inaweza kutaja kundi la waamini ambalo huenda lilijumuisha wanawake. Tafsiri haibani kundi kwa wanaume pekee, na tanbihi inaeleza hali ya neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida bila kupoteza sifa ya uaminifu, maana isiyo na kikomo ya “lolote,” au msisitizo kwamba waliopokea huduma walikuwa wageni kwa Gayo.
