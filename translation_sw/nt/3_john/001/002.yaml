source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: sw
  text: Mpendwa, ninaomba kwamba ufanikiwe katika mambo yote na uwe na afya njema, kama vile nafsi yako inavyofanikiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama vile mambo yanavyokwenda vema kwa nafsi yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Mpendwa
  rationale: Nomino ya kumwita mtu mmoja kwa upendo; “Mpendwa” ni ya asili, yenye heshima, na inadumisha uhusiano wake na wazo la upendo.
- source_word: περὶ πάντων
  choice: katika mambo yote
  rationale: Kirai hiki kinaeleza upeo wa ombi—kwa habari ya mambo yote—wala si kipaumbele cha “zaidi ya yote.”
- source_word: εὔχομαί
  choice: ninaomba
  rationale: Katika muktadha huu wa barua, kitenzi kinaweza kueleza ombi la sala au tamanio; “ninaomba” kinadumisha maana ya kidini bila kulazimisha zaidi ya maandishi.
- source_word: σε εὐοδοῦσθαι
  choice: kwamba ufanikiwe
  rationale: Kitenzi kina maana ya mambo kumwendea mtu vizuri au yeye kufanikiwa; “ufanikiwe” ni kifupi na cha kawaida katika Kiswahili.
- source_word: ὑγιαίνειν
  choice: uwe na afya njema
  rationale: Hapa kitenzi kinahusu afya ya mwili; kauli hii ni ya kawaida na wazi kwa wasomaji wa kisasa.
- source_word: καθὼς
  choice: kama vile
  rationale: Huanzisha ulinganisho kati ya hali ya nje ya mhusika na hali ya roho yake.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: roho yako inavyofanikiwa
  rationale: Tafsiri hii inadumisha mwangwi wa kitenzi εὐοδόομαι kilichotumiwa mapema na pia hali endelevu inayoonyeshwa na wakati wa sasa.
- source_word: ψυχή
  choice: roho
  rationale: Katika muktadha unaotofautisha afya ya mwili na hali ya ndani, “roho” ni neno la kawaida la kibiblia; tanbihi inahifadhi uwezekano wa maana pana ya nafsi ya ndani.
theological_decisions:
- issue: Maana ya περὶ πάντων katika ombi la mwanzo
  choice: katika mambo yote
  alternative: zaidi ya yote
  rationale: Kigiriki kinaelekea kuonyesha upeo wa kufanikiwa, si kwamba ombi hili lina kipaumbele kuliko mambo mengine.
- issue: Maana ya ψυχή
  choice: roho
  alternative: nafsi ya ndani / maisha
  rationale: “Roho” inadumisha utofauti na afya ya mwili bila kufafanua kwa lazima nadharia maalumu kuhusu muundo wa mwanadamu; tanbihi inaonyesha upana wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa leo, huku upeo wa περὶ πάντων, mwangwi wa εὐοδόομαι, na uwezekano wa maana ya ψυχή vikidumishwa.
