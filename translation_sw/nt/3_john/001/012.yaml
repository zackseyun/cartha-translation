  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: sw
  text: Demetrio ameshuhudiwa[a] na wote, na ile kweli yenyewe[b]. Sisi pia tunamshuhudia, nawe unajua kwamba ushuhuda wetu ni wa kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote wametoa ushuhuda kumhusu.” Kauli timilifu tendwa ya Kigiriki inaonyesha ushuhuda uliokwisha kutolewa na unaoendelea kuthibitisha sifa yake.
    reason: lexical_alternative
  - marker: b
    text: “Kweli yenyewe” inaweza kumaanisha kwamba maisha ya Demetrio yanapatana na kweli, au, kwa maana pana zaidi, kwamba kweli—yaani ujumbe wa injili—inamshuhudia.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: Demetrio
  rationale: Jina la mtu limetoholewa kwa kufuata matumizi ya kawaida katika Biblia za Kiswahili.
- source_word: μεμαρτύρηται
  choice: ameshuhudiwa
  rationale: Kauli timilifu tendwa inaonyesha ushuhuda uliotolewa ambao bado una uzito; muktadha unaonyesha kuwa ni ushuhuda mwema bila kuongeza kivumishi kisichopo katika Kigiriki.
- source_word: ὑπὸ πάντων
  choice: na wote
  rationale: ὑπό pamoja na umilikishi huonyesha watendaji wa kauli tendwa; ‘na wote’ ni muundo wa kawaida wa Kiswahili.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: na hata na ile kweli yenyewe
  rationale: ‘Yenyewe’ huhifadhi mkazo wa αὐτῆς, na ‘ile kweli’ huhifadhi usemi wenye maana pana wa Kiyohana bila kuufasiri kuwa injili au mwenendo wa Demetrio pekee.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Sisi pia tunamshuhudia
  rationale: Kiwakilishi ‘sisi’ huhifadhi mkazo wa ἡμεῖς, ‘pia’ huwasilisha nguvu ya nyongeza, na yambwa ‘m-’ huonyesha wazi kuwa ushuhuda huu unamhusu Demetrio.
- source_word: οἶδας
  choice: unajua
  rationale: 'οἶδα ina umbo la timilifu lakini hutumika kwa maana ya hali ya sasa: ‘kujua.’'
- source_word: ἡ μαρτυρία ἡμῶν
  choice: ushuhuda wetu
  rationale: Huhifadhi uhusiano wa kileksia na kitenzi ‘kushuhudia’ na ni Kiswahili cha kawaida.
- source_word: ἀληθής ἐστιν
  choice: ni wa kweli
  rationale: Tafsiri ya moja kwa moja huhifadhi uhusiano na ἀληθείας (‘kweli’) iliyotangulia.
theological_decisions:
- issue: Maana ya ‘ile kweli yenyewe’ katika matumizi ya Kiyohana
  choice: Kuhifadhi usemi ‘ile kweli yenyewe’ bila kuubana kwa tafsiri moja
  alternative: ‘injili yenyewe’ au ‘maisha yake yanayopatana na kweli’
  rationale: Kigiriki kinaweza kudokeza kwamba maisha ya Demetrio yanapatana na kweli, au kwamba kweli/injili yenyewe inamshuhudia. Tafsiri kuu inahifadhi upana huo wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo ‘ameshuhudiwa’ umechaguliwa ili kuhifadhi kauli tendwa na kutoongeza neno ‘mwema’ lisilopo wazi katika Kigiriki. Alama ya tanbihi [a] iko katika matini kuu.
