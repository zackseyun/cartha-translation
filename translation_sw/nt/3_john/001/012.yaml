    issue: The main text says “na hata na ile kweli yenyewe.”
    rationale: The word “hata” (“even”) is not represented in ὑπὸ αὐτῆς τῆς ἀληθείας. The Greek has a second additive καί, so “na ile kweli yenyewe” is more exact.
  - severity: low
    issue: The sole footnote combines a note on the perfect passive with an interpretive note on “kweli yenyewe,” while its anchor follows “wote.”
    rationale: Separate anchors make each note’s referent clear and preserve the English audit trail’s distinct lexical and alternative-reading notes.
