  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: sw
  text: Mzee kwa Gayo, mpendwa, ambaye ninampenda katika kweli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kweli”; au, “katika ile kweli.” Kirai cha Kigiriki kinaweza kumaanisha upendo wa dhati, upendo unaotegemea kweli ya Injili, au yote mawili.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Mzee
  rationale: Katika utambulisho huu wa mwandishi, neno hili linaweza kuonyesha hadhi au huduma ya mwandishi. “Mzee” ni neno la kawaida na lenye heshima katika Kiswahili, bila kuingiza cheo cha kiibada kisichotajwa wazi.
- source_word: Γαΐῳ
  choice: kwa Gayo
  rationale: Dativu inaonyesha anayeandikiwa barua; “kwa Gayo” ni muundo wa kawaida wa anuani ya barua. “Gayo” ni umbo la jina lililozoeleka katika Biblia za Kiswahili.
- source_word: τῷ ἀγαπητῷ
  choice: mpendwa
  rationale: “Mpendwa” huonyesha upendo wa mwandishi na kudumisha uhusiano wa kimsamiati na kitenzi ἀγαπῶ kinachofuata.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: ambaye ninampenda
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kuwa Gayo ndiye anayependwa. Kiambishi cha nafsi katika “ninampenda” kinatosha kuwakilisha ἐγώ bila kuongeza mkazo usio wa lazima.
- source_word: ἐν ἀληθείᾳ
  choice: katika kweli
  rationale: Tafsiri hii ya karibu inahifadhi uwezekano wa maana ya upendo wa kweli, upendo ulio ndani au unaotegemea kweli ya Injili, au maana zote mbili.
theological_decisions:
- issue: Maana ya ἀλήθεια katika kirai cha mwisho
  choice: katika kweli
  alternative: kwa kweli; katika ile kweli
  rationale: Maandishi ya Yohana mara nyingi hutumia “kweli” kwa kina cha kiteolojia, lakini hapa kirai kinaweza pia kueleza unyoofu wa upendo. Tafsiri kuu haiamui kimya kimya kati ya maana hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya kirai kinachofafanuliwa.
