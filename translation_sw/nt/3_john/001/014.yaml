  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: sw
  text: Lakini ninatumaini kukuona hivi karibuni, nasi tutazungumza ana kwa ana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “mdomo kwa mdomo.” Usemi huu unamaanisha mazungumzo ya moja kwa moja, yaani, “ana kwa ana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: ninatumaini
  rationale: Kitenzi cha wakati uliopo kinaeleza tumaini au matarajio binafsi ya mwandishi; “ninatumaini” ni tafsiri ya kawaida na ya asili katika hitimisho la barua.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye utofautishaji mdogo kutoka kwa habari iliyotangulia kuhusu kuandika; “Lakini” kinahifadhi mgeuko huo wa wazo.
- source_word: εὐθέως
  choice: hivi karibuni
  rationale: Ingawa neno hili linaweza kumaanisha “mara moja,” katika muktadha wa ziara inayotarajiwa linaonyesha ukaribu wa wakati; “hivi karibuni” ni Kiswahili cha asili.
- source_word: σε ἰδεῖν
  choice: kukuona
  rationale: Hii inafuata kwa karibu maana ya kuona mtu binafsi bila kuongeza kwa wazi dhana ya “kukuzuru,” ingawa ziara inadokezwa na muktadha.
- source_word: στόμα πρὸς στόμα
  choice: ana kwa ana
  rationale: Kwa neno moja moja ni “mdomo kwa mdomo,” lakini ni nahau inayomaanisha mazungumzo ya moja kwa moja watu wakiwa pamoja. “Ana kwa ana” ni nahau ya kawaida ya Kiswahili na huepuka maana potovu.
- source_word: λαλήσομεν
  choice: tutazungumza
  rationale: Wakati ujao unaonyesha mazungumzo yanayotarajiwa. “Tutazungumza” ni ya asili, yenye hadhi, na inaonyesha mawasiliano ya pande mbili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, na yenye hadhi. Muundo wa sentensi unahifadhi mpito wa δέ na maana ya wakati ujao bila kufanya usemi wa Kigiriki kuwa mgumu au wenye kupotosha.
