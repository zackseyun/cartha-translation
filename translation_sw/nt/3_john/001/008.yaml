  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: sw
  text: Kwa hiyo, sisi tunapaswa kuwapokea watu kama hao[a], ili tupate kuwa wafanyakazi wenzi kwa ajili ya kweli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaweza pia kuwa na maana ya kuwakaribisha kwa ukarimu na kuwasaidia kwa mahitaji yao.
    reason: lexical_alternative
  - marker: b
    text: Au, “pamoja na kweli” au “katika kweli.” Dativi ya Kigiriki inaweza kueleweka kwa njia zaidi ya moja; matini kuu inaeleza ushirika katika kazi inayotumikia kweli.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς οὖν
  choice: Kwa hiyo, sisi
  rationale: ‘Kwa hiyo’ linaonyesha hitimisho linalotokana na mstari uliotangulia, na ‘sisi’ limewekwa wazi ili kuhifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: ὀφείλομεν
  choice: tunapaswa
  rationale: Linaeleza wajibu wa kimaadili kwa Kiswahili cha kawaida bila kuufanya kuwa amri kali kuliko ilivyo katika Kigiriki.
- source_word: ὑπολαμβάνειν
  choice: kuwakaribisha na kuwasaidia
  rationale: Katika muktadha huu, kitenzi kinahusu kuwapokea wahudumu wasafiri kwa ukarimu na kuwategemeza; maneno haya mawili yanafikisha maana hiyo kwa uwazi.
- source_word: τοὺς τοιούτους
  choice: watu kama hao
  rationale: Linaonyesha watu wa aina iliyotajwa katika muktadha, bila kuongeza ubainishaji wa kijinsia usiolazimishwa na kusudi la sentensi.
- source_word: ἵνα
  choice: ili
  rationale: Linaonyesha kusudi kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: συνεργοὶ γινώμεθα
  choice: tuwe washiriki katika kazi
  rationale: Linaonyesha kwamba kwa kuwategemeza watu hao, waamini wanakuwa wenzao katika kazi; ‘tuwe’ ni ya asili zaidi hapa kuliko tafsiri nzito ya moja kwa moja ya ‘tupate kuwa.’
- source_word: τῇ ἀληθείᾳ
  choice: kwa ajili ya kweli
  rationale: Dativi inaweza kueleweka kwa njia zaidi ya moja. Matini kuu inaonyesha kushiriki katika kazi inayotumikia kweli, huku uwezekano wa ‘pamoja na kweli’ au ‘katika kweli’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa τῇ ἀληθείᾳ na συνεργοὶ
  choice: ‘kwa ajili ya kweli,’ yaani kushiriki katika kazi inayotumikia na kuendeleza kweli
  alternative: ‘pamoja na kweli’ au ‘katika kweli’
  rationale: Muktadha unahusu kuwategemeza wale walioondoka kwa ajili ya Jina. Hata hivyo, dativi ya Kigiriki ni yenye uwezekano zaidi ya mmoja, kwa hiyo matini kuu inatumia maana inayofaa muktadha na tanbihi inahifadhi tafsiri nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuwakaribisha na kuwasaidia’ kinafafanua kwa kawaida ukarimu na utegemezaji unaodokezwa na muktadha. Alama zote za tanbihi zimewekwa katika matini kuu.
