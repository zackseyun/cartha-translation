  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: sw
  text: Kwa maana nilifurahi sana wakati ndugu[a] walipokuja na kushuhudia ukweli wako[b], kama vile unavyoenenda katika kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waamini wenzake.” Kigiriki kinasema “ndugu,” neno ambalo katika matumizi ya kifamilia miongoni mwa waamini linaweza kurejelea waamini wa jinsia zote.
    reason: lexical_alternative
  - marker: b
    text: Au, “na kushuhudia uaminifu wako kwa ile kweli.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Kwa maana nilifurahi sana
  rationale: “Nilifurahi” linaonyesha maana tendaji ya umbo hili la kitenzi, “sana” linahifadhi kiwango cha λίαν, na “kwa maana” linaunganisha mstari huu na maelezo yaliyotangulia.
- source_word: ἐρχομένων ἀδελφῶν
  choice: ndugu walipokuja
  rationale: Muundo wa kishirikishi unaeleweka hapa kwa maana ya wakati. “Ndugu” linahifadhi lugha ya kifamilia ya jumuiya ya waamini bila kulazimisha jinsia ya watu waliorejelewa.
- source_word: μαρτυρούντων σου τῇ ἀληθείᾳ
  choice: na kushuhudia kuhusu ukweli wako
  rationale: “Kushuhudia” linahifadhi dhana ya kutoa ushahidi. “Kuhusu ukweli wako” ni Kiswahili cha kawaida kinachofuata kwa ukaribu muundo wenye kiwakilishi σου, huku tanbihi ikieleza maana inayowezekana ya uaminifu wa Gayo kwa ile kweli.
- source_word: καθὼς
  choice: kama vile
  rationale: Linaonyesha ulinganifu kati ya ushuhuda wa ndugu na mwenendo halisi wa Gayo.
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: unavyoenenda katika kweli
  rationale: “Kuenenda” linahifadhi sitiari ya περιπατέω kuhusu mwenendo wa maisha, na “katika kweli” linadumisha msamiati wa Kiyohana bila kuufupisha kuwa mafundisho au uadilifu pekee.
theological_decisions:
- issue: Maana ya ἀλήθεια katika muktadha wa mwenendo wa Kiyohana
  choice: kweli katika sehemu zote mbili
  alternative: uaminifu; ile kweli iliyo ndani yako
  rationale: Neno “kweli” linahifadhi mvutano kati ya ukweli unaokiriwa na maisha yanayoupatanisha. Halifungi maana katika unyoofu wa tabia au usahihi wa mafundisho peke yake.
- issue: Maana ya σου τῇ ἀληθείᾳ
  choice: ukweli wako
  alternative: uaminifu wako kwa ile kweli
  rationale: Tafsiri kuu inabaki karibu na umbo la Kigiriki na inadumisha utata wake wa kweli inayomhusu Gayo au uhusiano wake na kweli; tanbihi inatoa ufafanuzi unaowezekana bila kuuingiza katika maandishi kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Kuushuhudia kuhusu” limeepukwa; “kushuhudia kuhusu” ni la kawaida zaidi. Sitiari ya “kuenenda katika kweli” imehifadhiwa kwa sababu ni muhimu katika mtindo na teolojia ya Kiyohana.
