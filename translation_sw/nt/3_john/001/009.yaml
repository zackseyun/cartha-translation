  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: sw
  text: Niliandika jambo fulani kwa kanisa[a], lakini Diotrefe, ambaye anapenda kuwa wa kwanza kati yao, hatupokei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niliandika ujumbe mfupi kwa kanisa.” Kigiriki kina usemi usio mahsusi (“jambo fulani”), na baadhi ya hati za kale zina maneno yaliyopanuliwa.
    reason: textual_variant
  - marker: b
    text: Au, “hatukaribishi” au “hatutambui.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: Niliandikia
  rationale: Wakati timilifu sahili wa Kigiriki unaelezwa kwa wakati uliopita; pamoja na yambwa 'kanisa,' kitenzi 'andikia' ni cha kawaida na wazi katika Kiswahili.
- source_word: τι
  choice: jambo fulani
  rationale: Kiwakilishi kisichodhihirisha cha Kigiriki humaanisha kitu au jambo lisilotajwa wazi; 'jambo fulani' huhifadhi kutokuwa mahsusi kwa usemi bila kuongeza yaliyomo.
- source_word: τῇ ἐκκλησίᾳ
  choice: kanisa
  rationale: Hapa ἐκκλησία ni kusanyiko la waamini wa mahali fulani; 'kanisa' ndilo neno la kawaida na linaloeleweka zaidi katika Kiswahili cha sasa.
- source_word: ἀλλ’
  choice: lakini
  rationale: Neno hili linaonyesha utofauti wa wazi kati ya tendo la mwandishi na mwitikio wa Diotrefe.
- source_word: ὁ φιλοπρωτεύων
  choice: ambaye anapenda kuwa wa kwanza
  rationale: Usemi huu huonyesha kupenda cheo cha kwanza au ukuu; tafsiri hii ni ya kawaida na huhifadhi uzito wa kimaadili bila kuamua aina rasmi ya mamlaka.
- source_word: αὐτῶν
  choice: kati yao
  rationale: Huonyesha kundi ambalo ndani yake Diotrefe anataka kuwa wa kwanza, bila kudai kwa lazima kwamba ana mamlaka rasmi juu yao.
- source_word: Διοτρέφης
  choice: Diotrefe
  rationale: Jina limetoholewa kwa tahajia na matamshi yaliyozoeleka katika Biblia za Kiswahili.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: hatupokei
  rationale: Neno 'kupokea' huhifadhi upana wa ἐπιδέχομαι, ambao unaweza kuhusisha kuwakaribisha watu, kuwakubali, au kutambua ujumbe na nafasi yao.
theological_decisions:
- issue: Maana ya upinzani wa Diotrefe
  choice: hatupokei
  alternative: hatukaribishi; hatutambui
  rationale: Tafsiri pana haifungi maana kwenye ukarimu pekee wala kwenye kutambua mamlaka pekee. Hivyo hudumisha uwezekano wa maana zote unaoruhusiwa na Kigiriki na huepuka kuingiza madai maalumu ya kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo ni wa moja kwa moja, huku tanbihi zikihifadhi tofauti ya maandishi na upana wa kimaana.
