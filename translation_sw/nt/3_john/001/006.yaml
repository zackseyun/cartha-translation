  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: sw
  text: Nao walitoa ushuhuda mbele ya kanisa kuhusu upendo wako; utafanya vyema ukiwaandaa hao waendelee na safari yao kwa namna inayomstahili Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukiwasaidia kuendelea na safari yao”; neno la Kigiriki linaweza kumaanisha kuwatuma wasafiri waende mbele huku ukiwapa msaada unaohitajika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: walishuhudia
  rationale: Wakati uliopita unaonyesha tendo lililotukia; ‘walishuhudia’ ni ya kawaida na inadumisha maana ya kutoa ushuhuda au taarifa.
- source_word: σου τῇ ἀγάπῃ
  choice: kuhusu upendo wako
  rationale: Dativi inaonyesha jambo lililoshuhudiwa; ‘kuhusu upendo wako’ ni Kiswahili cha kawaida na wazi.
- source_word: ἐνώπιον ἐκκλησίας
  choice: mbele ya kanisa
  rationale: Inadumisha wazo la kutoa ushuhuda hadharani katika uwepo wa jumuiya ya waamini.
- source_word: καλῶς ποιήσεις
  choice: utafanya vyema
  rationale: Inahifadhi umbo la wakati ujao pamoja na nguvu yake ya pongezi na himizo la adabu.
- source_word: προπέμψας
  choice: ukiwasaidia kuendelea na safari yao
  rationale: Kitenzi hiki hakimaanishi kuwaaga tu, bali mara nyingi kinahusisha kuwapatia wasafiri msaada wa kuwawezesha kuendelea.
- source_word: ἀξίως τοῦ θεοῦ
  choice: kwa namna inayomstahili Mungu
  rationale: Inaonyesha kwamba namna ya kuwasaidia inapaswa kuendana na heshima na tabia ya Mungu.
theological_decisions:
- issue: Maana ya προπέμπω katika ukarimu wa Kikristo
  choice: ukiwasaidia kuendelea na safari yao
  alternative: ukiwapeleka waendelee na safari yao
  rationale: Maana ya muktadha inaweza kujumuisha msaada wa vitendo kwa wasafiri, lakini haibainishi aina maalumu ya msaada; tafsiri hii inadumisha upana huo.
- issue: Kipimo kinachoonyeshwa na ἀξίως τοῦ θεοῦ
  choice: kwa namna inayomstahili Mungu
  alternative: kwa namna inayowastahili watu wa Mungu
  rationale: Genitivi ya Kigiriki inamtaja Mungu moja kwa moja; haipaswi kubadilishwa kimya kimya kuwa hadhi ya wajumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao’ linaunganisha aya na waliotajwa awali; sentensi mbili zimetumiwa kwa mtiririko wa kawaida bila kupoteza uhusiano wa vifungu vya Kigiriki.
