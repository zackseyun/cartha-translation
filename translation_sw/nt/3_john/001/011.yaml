  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: sw
  text: Mpendwa, usiige lililo baya, bali lililo jema. Atendaye mema[a] anatoka kwa Mungu; atendaye mabaya hajamwona Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule anayefanya mema ... yule anayefanya mabaya”; vishiriki vya Kigiriki vinaweza kukazia tendo linaloendelea au mwenendo bainifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Mpendwa
  rationale: Nomino ya kumwita mtu mmoja kwa upendo; “Mpendwa” huhifadhi ukaribu na mtindo wa Kiyohana kwa Kiswahili cha heshima.
- source_word: μὴ μιμοῦ
  choice: usiige
  rationale: Kitenzi cha amri chenye katazo; “usiige” huwasilisha moja kwa moja wazo la kufuata mfano wa tabia fulani.
- source_word: τὸ κακὸν
  choice: lililo baya
  rationale: Kivumishi cha jinsi ya kati kimetumiwa kama nomino kuonyesha jamii ya kimaadili kwa ujumla; “lililo baya” ni la kawaida na linaepuka kuifanya kuwa tendo moja tu.
- source_word: τὸ ἀγαθόν
  choice: lililo jema
  rationale: Huhifadhi ulinganifu wa kimaadili na “lililo baya” katika Kiswahili cha kawaida.
- source_word: ὁ ἀγαθοποιῶν
  choice: atendaye mema
  rationale: Kishiriki cha wakati uliopo kilichotumiwa kama nomino kinaweza kuonyesha utendaji unaoendelea au tabia bainifu; “atendaye mema” huhifadhi maana hiyo kwa ufupi.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: anatoka kwa Mungu
  rationale: Huhifadhi wazo la asili au chanzo katika usemi wa Kiyohana bila kulibadili kuwa mfumo maalumu wa kiteolojia.
- source_word: ὁ κακοποιῶν
  choice: atendaye mabaya
  rationale: Huhifadhi ulinganifu na “atendaye mema” pamoja na uwezekano wa maana ya mwenendo unaoendelea au bainifu.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: hajamwona Mungu
  rationale: Huhifadhi kitenzi halisi cha kuona na nguvu ya hali timilifu ya Kigiriki, badala ya kukifasiri moja kwa moja kuwa “hamjui Mungu.”
theological_decisions:
- issue: Uhusiano wa mwenendo wa kimaadili na uhusiano na Mungu katika usemi wa Kiyohana
  choice: Kuhifadhi kauli kwamba atendaye mema anatoka kwa Mungu, na atendaye mabaya hajamwona Mungu.
  alternative: Kufafanua kauli hizo kuwa fundisho maalumu kuhusu kuzaliwa upya, ukamilifu usio na dhambi, au kutokuwapo kabisa kwa uhusiano wowote wa awali na Mungu.
  rationale: Matini hutumia vipimo vya kimaadili na kiroho vya Kiyohana. Tafsiri inahifadhi makundi yake yenyewe—“anatoka kwa Mungu” na “hajamwona Mungu”—bila kuyaongeza au kuyapunguza kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Mpendwa” huhifadhi sauti ya upendo; “lililo baya/lililo jema” na “atendaye mema/mabaya” huleta ulinganifu wa kifasihi bila kuwa wa kizamani kupita kiasi.
