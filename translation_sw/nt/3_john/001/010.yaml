  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: sw
  text: Kwa sababu hiyo, nikija, nitayataja matendo anayofanya, akieneza maneno maovu yasiyo na maana juu yetu; naye, bila kuridhika na hayo, yeye mwenyewe hawakaribishi ndugu[a], huwazuia wale wanaotaka kuwakaribisha, na kuwafukuza kutoka katika kanisa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa huenda ni waamini Wakristo waliokuwa wakisafiri, hasa wahudumu waliotajwa katika muktadha. Kitenzi kilichotafsiriwa “kuwakaribisha” kinaweza pia kutafsiriwa “kuwapokea,” hasa kwa maana ya kuwapa ukarimu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwatoa katika kusanyiko.” “Kanisa” hapa linamaanisha jumuiya ya waamini, si jengo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Inaonyesha wazi uhusiano wa sababu na matokeo, kama usemi wa Kigiriki.
- source_word: ἐὰν ἔλθω
  choice: nikija
  rationale: Ni sharti linalotazamia uwezekano wa kuja kwa mwandishi na ni la kawaida katika Kiswahili.
- source_word: ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: nitakumbusha matendo yake anayofanya
  rationale: Hudumisha wazo la kuyarejesha matendo yake katika kumbukumbu au kuyafanya yatiliwe maanani, bila kuongeza hadharani au namna maalumu ya uwajibikaji.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: anasema upuzi dhidi yetu kwa maneno maovu
  rationale: ‘Anasema upuzi’ huonyesha mazungumzo matupu au yasiyo na maana ya φλυαρέω, huku ‘dhidi yetu’ na ‘maneno maovu’ vikihifadhi uhasama na chombo cha usemi.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: Wala haridhiki na hayo
  rationale: Ni Kiswahili cha asili kinachoonyesha kuwa mwenendo wake mbaya hauishii katika maneno hayo.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: yeye mwenyewe hawakaribishi ndugu
  rationale: ‘Kuwakaribisha’ hufaa kwa muktadha wa kuwapokea wageni na kuwapa ukarimu; ‘ndugu’ huhifadhi lugha ya kifamilia ya jumuiya ya waamini.
- source_word: τοὺς βουλομένους κωλύει
  choice: wale wanaotaka kuwakaribisha huwazuia
  rationale: Kitenzi kilichodokezwa kutoka kishazi kilichotangulia kimewekwa wazi kwa ufasaha, huku βούλομαι na κωλύω zikitafsiriwa kama kutaka na kuzuia.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: kuwafukuza kutoka katika kanisa
  rationale: Huhifadhi nguvu ya tendo la kuwaondoa katika kusanyiko la waamini bila kuamua utaratibu rasmi uliotumiwa.
theological_decisions:
- issue: Maana ya τοὺς ἀδελφούς katika muktadha wa ukarimu wa kanisa
  choice: ndugu
  alternative: waamini wenzake / ndugu wa kiume
  rationale: Neno la Kigiriki ni la kiume kwa umbo na huenda linarejelea wahudumu Wakristo waliokuwa wakisafiri. ‘Ndugu’ ni neno la kawaida la Kikristo katika Kiswahili na halilazimishi kupanua wala kubana rejeo kuliko muktadha unavyoruhusu.
- issue: Maana ya ἐκκλησία katika tendo la kuwafukuza
  choice: kanisa
  alternative: kusanyiko
  rationale: Katika muktadha huu neno linarejelea jumuiya ya waamini ya mahali pamoja. ‘Kanisa’ ni tafsiri ya kawaida, lakini halipaswi kueleweka hapa kuwa jengo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa kwa alama ya nukta baada ya shtaka la maneno ili iwe rahisi kueleweka, huku mfululizo wa makosa yake ukihifadhiwa. Lugha ya ‘upunzi’ imeepukwa; ‘upuuzi’ ni ya kawaida na inaonyesha mazungumzo matupu bila kutumia msemo wa mitaani.
