base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: sw
  text: Nilikuwa na mambo mengi ya kukuandikia, lakini sitaki kukuandikia kwa wino na kalamu ya mwanzi;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ
  choice: mambo mengi
  rationale: Kivumishi cha wingi kisicho na nomino kimetumiwa kama nomino; “mambo mengi” ni Kiswahili cha kawaida kinachohifadhi maana ya wingi.
- source_word: εἶχον
  choice: Nilikuwa na
  rationale: Kauli ya wakati uliopita isiotimilika ya ἔχω imehifadhiwa kwa usemi wa Kiswahili “nilikuwa na,” ikitambulisha mambo aliyokusudia kuandika.
- source_word: γράψαι σοι
  choice: ya kukuandikia
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida tendo lililokusudiwa na pia unajumuisha maana ya σοι, yaani mwandikiwa.
- source_word: ἀλλ’ οὐ θέλω
  choice: lakini sitaki
  rationale: “Sitaki” ni usemi wa sasa, wa kawaida na wa moja kwa moja, unaowasilisha nia au kutotaka bila kuongeza uzito usiokuwamo katika maandishi.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: kwa wino na kalamu
  rationale: διά pamoja na hali ya umilikaji huonyesha njia au chombo. “Kwa wino na kalamu” ni ya kawaida katika Kiswahili; κάλαμος kihalisi ni mwanzi uliotumiwa kama kalamu, lakini kazi yake ndiyo muhimu hapa.
- source_word: γράφειν
  choice: kukuandikia
  rationale: Kitenzi-jina cha wakati wa sasa kinatafsiriwa kwa muundo wa kawaida wa Kiswahili bila kulazimisha tofauti ya aspekti ambayo muktadha hauhitaji ielezwe wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa barua ya kibiblia. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya “kalamu” na “kalamu ya mwanzi” si lazima kwa uelewa wa aya; “kalamu” huwasilisha kazi ya κάλαμος kwa uwazi.
