  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: sw
  text: 'Sina furaha kubwa kuliko hii: kusikia kwamba watoto wangu wanaenenda katika kweli[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri halisi zaidi, “Sina furaha iliyo kubwa kuliko mambo haya.”
    reason: lexical_alternative
  - marker: b
    text: Inaelekea kwamba “watoto wangu” ni watoto wa kiroho—waumini walio chini ya uangalizi wa kichungaji wa mwandishi.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν
  choice: kubwa kuliko
  rationale: Ni kivumishi cha kulinganisha kinachoeleza χαράν; usemi huu wa Kiswahili unaonyesha wazi maana ya furaha iliyo kuu zaidi.
- source_word: τούτων
  choice: hii
  rationale: Ingawa neno la Kigiriki ni la wingi, hapa linaelekeza kwa jambo linalofuata—kusikia kwamba watoto wake wanaenenda katika kweli. ‘Hii’ ni ya kawaida zaidi katika Kiswahili, huku tafsiri halisi zaidi ikitolewa katika tanbihi.
- source_word: χαράν
  choice: furaha
  rationale: ‘Furaha’ ni tafsiri ya kawaida na ya asili ya χαρά na inadumisha uzito wa hisia katika sentensi.
- source_word: ἵνα ἀκούω
  choice: kusikia kwamba
  rationale: Hapa ἵνα inaeleza jambo linalofanya furaha hiyo iwepo, si kusudi tu. ‘Kusikia kwamba’ ni ya asili na inaonyesha maudhui ya habari anayopokea mwandishi.
- source_word: τὰ ἐμὰ τέκνα
  choice: watoto wangu
  rationale: Inahifadhi taswira ya kifamilia ya τέκνα bila kuamua katika matini kuu kwamba ni watoto wa kimwili au wa kiroho.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: katika kweli
  rationale: Inadumisha usemi mpana wa Kiyohana unaoweza kuhusisha kweli inayokiriwa na maisha yanayoongozwa nayo, bila kuufupisha kuwa unyoofu au mafundisho pekee.
- source_word: περιπατοῦντα
  choice: wanaenenda
  rationale: ‘Wanaenenda’ inadumisha sitiari ya kutembea kama mwenendo wa maisha. Ni lugha yenye hadhi, inayotambulika katika matumizi ya kibiblia ya Kiswahili, bila kufafanua sitiari kupita kiasi.
theological_decisions:
- issue: Ikiwa τέκνα inamaanisha watoto wa kimwili au wa kiroho
  choice: Kudumisha ‘watoto wangu’ katika matini kuu.
  alternative: watoto wangu wa kiroho; watu niliowaongoza wamwamini Kristo
  rationale: Muktadha unaashiria sana watoto wa kiroho walio chini ya malezi yake, lakini Kigiriki kinatumia neno la kifamilia. Tafsiri inadumisha taswira hiyo na tanbihi inaeleza maana inayowezekana.
- issue: Maana ya ἐν τῇ ἀληθείᾳ
  choice: katika kweli
  alternative: kwa unyoofu; kwa kufuata mafundisho ya kweli
  rationale: Katika maandishi ya Kiyohana, ‘kweli’ inaweza kujumuisha mafundisho ya kweli na mwenendo unaolingana nayo. Usemi mpana unahifadhi mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na wazi; ‘wanaenenda’ umetumiwa kwa makusudi ili kuhifadhi sitiari ya Kigiriki ya mwenendo wa maisha.
