  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: sw
  text: Amani iwe kwako[a]. Marafiki wanakusalimu. Wasalimu marafiki kwa majina[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Amani kwako.” Kigiriki kinasema kwa ufupi, “Amani kwako,” kama baraka ya barua.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema kihalisi “kwa jina”; usemi huo unamaanisha kuwasalimu marafiki kila mmoja binafsi, kwa kumtaja jina.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Amani iwe kwako
  rationale: Hii ni baraka fupi ya mwishoni mwa barua. Kiswahili huhitaji kitenzi kilichodokezwa katika Kigiriki; “iwe kwako” ni ya asili na inadumisha maana bila kuipanua kupita kiasi.
- source_word: ἀσπάζονταί σε
  choice: wanakusalimu
  rationale: Kitenzi hiki hutumiwa kwa salamu katika barua. “Wanakusalimu” ni tafsiri fupi, ya kawaida, na inayoeleweka katika Kiswahili cha sasa.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: marafiki
  rationale: Neno φίλοι linamaanisha marafiki; limetafsiriwa vivyo hivyo katika sehemu zote mbili bila kulibadilisha kuwa istilahi nyingine kama “ndugu.”
- source_word: ἀσπάζου
  choice: Wasalimu
  rationale: Umbo la amri la umoja limewasilishwa moja kwa moja, nalo linadumisha ulinganifu na “wanakusalimu” katika sentensi iliyotangulia.
- source_word: κατ’ ὄνομα
  choice: mmoja mmoja kwa jina
  rationale: Usemi huu unasisitiza salamu ya binafsi kwa kila rafiki. “Mmoja mmoja kwa jina” ni Kiswahili cha asili kinachohifadhi picha ya kumtambua kila mtu kwa jina.
