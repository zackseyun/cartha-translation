id: TIT.3.3
reference: Titus 3:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: sw
  text: Kwa maana sisi wenyewe pia hapo zamani tulikuwa wapumbavu, wasiotii, tukipotoshwa[a], tukiwa watumwa wa tamaa na raha mbalimbali, tukiishi katika uovu na wivu, wenye kuchukiza[b], tukichukiana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukidanganywa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wenye kuchukiwa.” Kivumishi cha Kigiriki kinaweza kumaanisha wenye kuchukiza au wenye kuchukiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Kwa maana sisi wenyewe pia hapo zamani tulikuwa
  rationale: ‘Kwa maana’ linaonyesha uhusiano wa γάρ na yaliyo kabla; ‘sisi wenyewe pia’ linahifadhi msisitizo wa καὶ ἡμεῖς, na ‘hapo zamani’ linaonyesha ποτε kwa Kiswahili cha kawaida.
- source_word: ἀνόητοι
  choice: wapumbavu
  rationale: Linaonyesha ukosefu wa ufahamu na busara ya kimaadili katika orodha hii ya mwenendo mbaya.
- source_word: ἀπειθεῖς
  choice: wasiotii
  rationale: Linafaa kwa maana ya kukataa kushawishika na hivyo kutotii, bila kuongeza dhana ya uasi iliyo wazi zaidi kuliko neno la Kigiriki.
- source_word: πλανώμενοι
  choice: tukipotoshwa
  rationale: 'Muundo huu unahifadhi uwezekano mkubwa wa maana ya kutendwa: kuongozwa katika njia isiyo sahihi. ‘Tukidanganywa’ limewekwa kama uwezekano katika tanbihi.'
- source_word: δουλεύοντες
  choice: tukiwa watumwa wa
  rationale: Linaonyesha nguvu ya lugha ya utumwa na hali ya kufungwa chini ya tamaa na anasa, badala ya maana hafifu ya kuzitumikia tu.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: tamaa na anasa mbalimbali
  rationale: ‘Tamaa’ hapa ni pana kuliko tamaa ya ngono pekee; ‘anasa’ linaonyesha raha zinazotafutwa kwa kujifurahisha. ‘Mbalimbali’ linaeleweka kuhusiana na makundi yote mawili.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: tukiishi katika uovu na wivu
  rationale: διάγοντες linaeleza namna maisha yalivyoendeshwa. ‘Uovu’ ni neno la kawaida na pana linalofaa kwa κακία, huku ‘wivu’ likiwakilisha φθόνος.
- source_word: στυγητοί
  choice: wenye kuchukiza
  rationale: Linafuata maana tendaji ya ‘hateful/detestable’ na linaungana vizuri na ‘tukichukiana.’ Maana ya kutendwa, ‘wenye kuchukiwa,’ imehifadhiwa katika tanbihi.
- source_word: μισοῦντες ἀλλήλους
  choice: tukichukiana sisi kwa sisi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kuheshimiana kinyume, yaani kila mmoja kumchukia mwenzake.
theological_decisions:
- issue: Nguvu ya δουλεύοντες inapohusishwa na tamaa na anasa
  choice: tukiwa watumwa wa tamaa na anasa mbalimbali
  alternative: tukitumikia tamaa na anasa mbalimbali
  rationale: Muktadha unaonyesha kufungwa kimaadili katika hali ya zamani. Lugha ya kuwa watumwa inahifadhi uzito wa δουλεύω bila kuingiza mfumo wa mafundisho usiotajwa na aya.
- issue: Maana ya στυγητοί
  choice: wenye kuchukiza
  alternative: wenye kuchukiwa
  rationale: Kivumishi cha Kigiriki kinaweza kueleweka kwa maana tendaji au tendwa. Maandishi makuu yanachagua maana tendaji inayofaa katika orodha ya tabia, lakini tanbihi inahifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya ‘tuki-’ unahifadhi mtiririko wa vihusishi vya Kigiriki na umoja wa orodha. Tanbihi zote zimewekewa alama katika maandishi.
