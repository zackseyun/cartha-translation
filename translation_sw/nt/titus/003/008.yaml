  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: sw
  text: Kauli hii ni ya kuaminika, nami nataka usisitize kwa uthabiti mambo haya, ili wale waliomwamini Mungu waweke bidii katika kutenda matendo mema[a]. Mambo haya ni mema na yenye manufaa kwa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wajitoe katika matendo mema”; au, “wawe mstari wa mbele katika matendo mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Neno hili ni la kuaminika
  rationale: Kauli hii ya kawaida katika Nyaraka za Kichungaji inarejelea ujumbe au tamko lililotangulia, si neno moja tu. Kiswahili ‘Neno hili ni la kuaminika’ ni cha kawaida, chenye heshima, na hudumisha uhusiano huo wa kimuktadha.
- source_word: περὶ τούτων
  choice: mambo haya
  rationale: Hurejelea mambo yaliyotangulia ambayo Tito anatakiwa kuyakazia; ‘mambo haya’ ni ya asili katika Kiswahili bila kuhitaji kutafsiri kihusishi hicho kando.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: nataka uyasisitize ... kwa uthabiti
  rationale: βούλομαι huonyesha nia ya msemaji, na διαβεβαιόομαι huonyesha kusisitiza au kuthibitisha kwa nguvu na uhakika. ‘Kwa uthabiti’ huepuka maana ya kujiamini binafsi pekee.
- source_word: ἵνα φροντίζωσιν
  choice: ili ... wawe waangalifu
  rationale: φροντίζω huonyesha kufikiria kwa makini na kuwa na bidii kuhusu jambo; ‘wawe waangalifu’ hudumisha wazo la uangalifu unaokusudiwa.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: kujitoa kutenda matendo mema
  rationale: Katika muktadha huu προΐστασθαι ina maana ya kujishughulisha kwa bidii au kujitoa kwa matendo mema, si lazima kuyaongoza. ‘Kujitoa kutenda’ huonyesha dhamira ya kudumu kwa Kiswahili cha kawaida.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: wale waliomwamini Mungu
  rationale: Kauli ya wakati timilifu huonyesha walioingia katika hali ya imani na wanaendelea humo. Kitenzi cha Kiswahili ‘kumwamini’ kinaweza kumaanisha kumwamini mtu na kuweka tumaini kwake, hivyo huhifadhi kwa asili mvutano wa maana katika dative θεῷ.
- source_word: καλὰ καὶ ὠφέλιμα
  choice: mema na yenye manufaa
  rationale: ‘Mema’ huhifadhi ubora wa kimaadili na ‘yenye manufaa’ huonyesha faida au msaada unaotolewa.
- source_word: τοῖς ἀνθρώποις
  choice: kwa watu
  rationale: ἀνθρώποις inawahusu wanadamu kwa ujumla, si wanaume pekee; ‘watu’ ni tafsiri wazi na jumuishi.
theological_decisions:
- issue: Uhusiano wa imani na matendo mema
  choice: Waliomwamini Mungu wanahimizwa kujitoa kutenda matendo mema.
  alternative: Kutafsiri matendo mema kuwa msingi au njia ya kupata wokovu.
  rationale: Mpangilio wa Kigiriki unaweka imani kwanza na matendo mema kama matokeo yanayokusudiwa kwa walioamini tayari; tafsiri haitoi dai la kimadhehebu kuhusu sifa ya matendo.
- issue: Maana ya πιστεύω pamoja na dative θεῷ
  choice: waliomwamini Mungu
  alternative: waliomwamini Mungu kwa maana ya kukubali maneno yake tu; au walioweka imani yao katika Mungu
  rationale: Kiswahili ‘kumwamini Mungu’ ni cha asili na kinaweza kubeba maana za kuamini asemacho na kumtegemea, bila kulazimisha upande mmoja wa uwezekano wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa uwazi kwa wasomaji wa kawaida, huku ikihifadhi msisitizo wa διαβεβαιοῦσθαι na uwezekano wa maana katika προΐστασθαι. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachohusika.
