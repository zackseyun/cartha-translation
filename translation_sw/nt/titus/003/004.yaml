lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini ... ulipodhihirika
  rationale: ὅτε huanzisha kishazi cha wakati, huku δέ ikiweka utofauti mpole na hali iliyoelezwa kabla; muundo wa Kiswahili wenye “Lakini” na kitenzi cha “-po-” huwasilisha yote mawili kwa kawaida.
- source_word: χρηστότης
  choice: wema
  rationale: Neno hili humaanisha wema, ukarimu, au kutendea wengine kwa fadhili. “Wema” ni la kawaida na lenye hadhi, na linabaki tofauti na “upendo” unaofuata.
- source_word: φιλανθρωπία
  choice: upendo ... kwa wanadamu
  rationale: Hurejelea upendo au nia njema inayowaelekea wanadamu. Tafsiri hii inaweka wazi walengwa wa upendo bila kutumia maana ya kiufundi ya kisasa.
- source_word: ἐπεφάνη
  choice: ulipodhihirika
  rationale: Kitenzi kinaeleza kujitokeza au kuonekana wazi. “Kudhihirika” huhifadhi maana ya ufunuo/ujitokezaji bila kueleza kwa ziada namna ulivyotokea.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: wa Mungu Mwokozi wetu
  rationale: Kirai hiki kinategemeza “wema” na “upendo” kwa Mungu na kuhifadhi “Mwokozi wetu” kama cheo cha Mungu kwa mpangilio wa kawaida wa Kiswahili.
theological_decisions:
- issue: Mrejelewa wa “Mungu Mwokozi wetu”
  choice: Tafsiri inahifadhi cheo “Mungu Mwokozi wetu” bila kuongeza ufafanuzi wa nafsi ndani ya mstari.
  alternative: Kumtaja wazi Mungu Baba katika tafsiri.
  rationale: Katika muktadha mpana, cheo hiki kwa kawaida humrejelea Mungu Baba, huku mstari wa 6 ukimtaja Yesu Kristo tofauti. Hata hivyo, Kigiriki cha mstari huu hakisemi “Baba,” kwa hiyo tafsiri haiongezi neno hilo wala kuondoa uzito wa cheo hicho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa wa kawaida kwa Kiswahili huku ukihifadhi kishazi cha wakati, utofauti wa δέ, na uhusiano wa sifa zote mbili na Mungu.
