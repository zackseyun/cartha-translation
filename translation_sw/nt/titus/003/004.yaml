  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: sw
  text: Lakini wema na upendo wa Mungu Mwokozi wetu kwa wanadamu ulipodhihirika,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo kwa watu”; neno la Kigiriki humaanisha nia njema au upendo unaowaelekea wanadamu.
