  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: sw
  text: Wasaidie kwa bidii Zena mwanasheria na Apolo kuendelea na safari yao,[a] ili wasikose chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wapeleke kwa bidii Zena mwanasheria na Apolo waendelee na safari yao.” Kitenzi kinaweza kumaanisha kuwasaidia kwa mahitaji ya safari, si kuwaaga au kuwatuma tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: Zena
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika tafsiri za Kiswahili.
- source_word: τὸν νομικὸν
  choice: mwanasheria
  rationale: νομικός humaanisha mtu mwenye ujuzi wa sheria; hapa ni maelezo ya Zena na inaelekea kuwa kazi au utaalamu wake, si cheo maalumu cha kidini.
- source_word: Ἀπολλῶν
  choice: Apolo
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: σπουδαίως
  choice: kwa bidii
  rationale: Kirai hiki kinaonyesha juhudi na uangalifu wa dhati bila kulazimisha maana ya kufanya haraka pekee.
- source_word: πρόπεμψον
  choice: Msaidie ... katika safari yao
  rationale: Katika muktadha wa safari, προπέμπω inaweza kumaanisha kuwasaidia wasafiri kuendelea, kutia ndani kuwapatia mahitaji yao, si kuwaaga au kuwatuma tu.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: ili wasikose chochote
  rationale: Huhifadhi kusudi la sentensi na upana wa usemi wa Kigiriki kuhusu kutopungukiwa na chochote kinachohitajika.
