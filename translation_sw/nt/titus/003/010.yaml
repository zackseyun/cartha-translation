  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: sw
  text: Mkatae mtu anayesababisha migawanyiko baada ya kumwonya mara ya kwanza na ya pili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayeunda makundi”; katika tafsiri za jadi, “mzushi.” Neno la Kiyunani huenda linamaanisha mtu anayesababisha migawanyiko ya kimakundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: anayesababisha migawanyiko
  rationale: Katika matumizi ya Kiyunani cha Koine, neno hili hapa linaelekea kumtaja mtu anayeanzisha au kuendeleza makundi yenye kuleta mgawanyiko. Tafsiri hii inaeleza athari yake kwa jumuiya bila kuingiza maana ya baadaye ya kitaalamu ya uzushi wa kimafundisho.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: “Mtu” ni tafsiri ya kawaida na ya asili ya ἄνθρωπον katika muktadha huu, ambapo neno hilo linamtaja mtu mmoja bila kulazimisha jinsia katika Kiswahili.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: baada ya kumwonya mara ya kwanza na ya pili
  rationale: Kauli hii huhifadhi mpangilio wa maonyo mawili yanayolenga kumrekebisha mtu kabla ya hatua ya mwisho kuchukuliwa; pia ni Kiswahili cha sasa na cha kawaida.
- source_word: παραιτοῦ
  choice: Mkatae
  rationale: Amri hii inaonyesha kukataa kuendelea kushirikiana na mtu huyo au kutomkubali baada ya maonyo kurudiwa. “Mkatae” huhifadhi uzito na ufupi wa amri ya Kiyunani.
theological_decisions:
- issue: Iwapo αἱρετικὸν itafsiriwe kwa lugha ya baadaye ya uzushi wa kimafundisho au kwa maana yake inayowezekana zaidi ya kuleta migawanyiko
  choice: anayesababisha migawanyiko
  alternative: mzushi; mwenye kuunda makundi
  rationale: Muktadha unahusu nidhamu kwa mtu anayedumu baada ya maonyo. Tafsiri iliyochaguliwa huepuka kuingiza maana maalumu ya baadaye ya “mzushi,” huku tanbihi ikihifadhi uwezekano huo wa jadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Muundo wa amri umewekwa moja kwa moja, na maana inayowezekana ya baadaye ya “mzushi” imehifadhiwa katika tanbihi badala ya kulazimishwa katika matini.
