lexical_decisions:
- source_word: οὗ
  choice: ambaye
  rationale: Kiwakilishi hiki kinamrejelea Roho Mtakatifu katika mstari wa 5. “Ambaye” ni Kiswahili cha kawaida kwa rejeleo la nafsi na kinaacha uhusiano huo wazi.
- source_word: ἐξέχεεν
  choice: alimmimina
  rationale: Kitenzi ἐκχέω humaanisha kumimina; umbo lenye kiambishi cha yambwa “-m-” linapatana na rejeleo la nafsi, yaani Roho Mtakatifu.
- source_word: ἐφ’ ἡμᾶς
  choice: juu yetu
  rationale: Huhifadhi wazo la kuelekezwa au kumiminwa juu ya watu kwa Kiswahili cha kawaida.
- source_word: πλουσίως
  choice: kwa wingi
  rationale: Hutoa maana ya wingi au utele bila kutumia kauli isiyo ya kawaida kama “kwa utajiri” katika muktadha huu.
- source_word: διὰ
  choice: kupitia
  rationale: διά pamoja na jenitivi huonyesha njia au wakala; “kupitia” ni fupi na ya kawaida.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu, Masihi
  rationale: Χριστός hapa inachukuliwa kuwa cheo chenye maana ya Masihi. Koma husaidia Kiswahili kueleza cheo hicho kwa kawaida bila kukifanya sehemu isiyoeleweka ya jina.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: na Mwokozi wetu
  rationale: Kirai hiki kinaeleza zaidi utambulisho wa Yesu; “Mwokozi wetu” huhifadhi cheo na umilikaji kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Rejeleo la kiwakilishi οὗ
  choice: “ambaye” anamrejelea Roho Mtakatifu aliyetajwa katika Tito 3:5.
  alternative: “ambacho,” ikiwa Roho angeelezwa kwa namna isiyo ya kinafsi.
  rationale: Kisintaksia, rejeleo la karibu ni Roho Mtakatifu. “Ambaye” linaonyesha rejeleo la nafsi bila kuondoa uwezekano wa kueleza mbadala katika tanbihi.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki linafanya kazi kama cheo; “Masihi” huwasilisha maana ya cheo hicho, huku umbo la jadi “Kristo” likitajwa katika tanbihi.
- issue: Uhusiano wa τοῦ σωτῆρος ἡμῶν na Ἰησοῦ Χριστοῦ
  choice: “na Mwokozi wetu” linaeleza Yesu kuwa Masihi na Mwokozi wetu.
  alternative: “Yesu Masihi, Mwokozi wetu,” bila kiunganishi “na.”
  rationale: Kigiriki kina kirai cha ufafanuzi kinachomtaja Yesu kuwa Mwokozi wetu. Kiswahili chenye “na” ni cha kawaida na hakimaanishi watu wawili kwa sababu vyeo vyote vinafuata jina moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi hii inaendeleza sarufi ya mstari wa 5; jina “Mungu” limewekwa wazi ili kuzuia utata wa kiima katika dondoo inayosimama peke yake, bila kubadili rejeleo la Kigiriki.
