id: TIT.3.5
reference: Titus 3:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: sw
  text: si kutokana na matendo ya haki[a] tuliyofanya sisi wenyewe, bali kulingana na rehema yake alituokoa, kwa njia ya kuoshwa[b] kwa kuzaliwa upya na kufanywa upya na Roho Mtakatifu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha “haki” au “uadilifu”; hapa “haki” limetumiwa kwa maana yake pana.
    reason: alternative_reading
  - marker: b
    text: “Kuoshwa” kunaweza kurejelea ubatizo, picha ya kutakaswa, au yote mawili; Kigiriki hakilazimishi uchaguzi huo ufanywe wazi katika matini kuu.
    reason: lexical_alternative
  - marker: c
    text: Au “kufanywa upya kunakotokana na Roho Mtakatifu.” Muundo wa Kigiriki unaruhusu tofauti ndogo katika namna ya kuhusianisha “Roho Mtakatifu” na “kufanywa upya.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: si kutokana na matendo
  rationale: “Kutokana na” linaonyesha chanzo au msingi unaokanushwa na ἐκ, huku likidumisha utofautishaji na rehema ya Mungu.
- source_word: τῶν ἐν δικαιοσύνῃ
  choice: ya haki
  rationale: Kirai hiki kinaeleza sifa ya matendo. “Ya haki” ni lugha ya kawaida ya Kiswahili na kinahifadhi wigo wa δικαιοσύνη bila kuyaeleza kama njia ya kuhesabiwa haki.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: tuliyofanya sisi wenyewe
  rationale: “Sisi wenyewe” linahifadhi msisitizo wa kiwakilishi cha Kigiriki ἡμεῖς.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: kulingana na rehema yake
  rationale: “Kulingana na” linaakisi κατά kama kipimo au msingi na kudumisha utofautishaji kati ya matendo yetu na rehema yake.
- source_word: ἔσωσεν ἡμᾶς
  choice: alituokoa
  rationale: “Kuokoa” ni neno la kawaida na linalofaa katika muktadha huu wa wokovu.
- source_word: διὰ λουτροῦ
  choice: kwa njia ya kuoshwa
  rationale: “Kwa njia ya” linaonyesha chombo au njia, na “kuoshwa” linaacha wazi ikiwa picha hiyo inahusu ubatizo, utakaso, au yote mawili.
- source_word: παλιγγενεσίας
  choice: kwa kuzaliwa upya
  rationale: “Kuzaliwa upya” ni usemi wa asili na unaoeleweka unaowasilisha maana ya παλιγγενεσία ya kuzaliwa tena au kuanzishwa kwa maisha mapya.
- source_word: καὶ ἀνακαινώσεως
  choice: na kufanywa upya
  rationale: Nomino ya Kigiriki imewasilishwa kwa umbo la kitendo-tendwa linalosikika kwa kawaida katika Kiswahili na kubaki sambamba na “kuzaliwa upya.”
- source_word: πνεύματος ἁγίου
  choice: na Roho Mtakatifu
  rationale: “Na” hapa linaonyesha mtendaji wa kufanywa upya, huku muundo wa Kigiriki na uhusiano wake na nomino zilizotangulia ukifafanuliwa katika tanbihi.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika kirai kinachoeleza matendo
  choice: haki
  alternative: uadilifu au matendo yanayotenda haki
  rationale: “Haki” ndilo neno pana la kawaida katika Kiswahili, na linaweza kujumuisha uadilifu na haki ya kijamii bila kuamua maana kwa namna finyu.
- issue: Maana ya διὰ λουτροῦ παλιγγενεσίας
  choice: kwa njia ya kuoshwa kwa kuzaliwa upya
  alternative: kwa njia ya uoshaji wa ubatizo unaoleta kuzaliwa upya; au kwa njia ya kutakaswa kunakohusiana na kuzaliwa upya
  rationale: Tafsiri haiongezi neno “ubatizo” wala kubadili picha kuwa utakaso tu, kwa kuwa λουτρόν inaweza kuibua ubatizo, kuoshwa kiishara, au yote mawili.
- issue: Uhusiano wa πνεύματος ἁγίου na ἀνακαινώσεως
  choice: kufanywa upya na Roho Mtakatifu
  alternative: kufanywa upya kwa Roho Mtakatifu
  rationale: Tafsiri kuu inaonyesha Roho Mtakatifu kama mtendaji wa kufanywa upya, ambalo ndilo somo linalowezekana zaidi, bila kudai kwamba mjadala wa kisarufi umefungwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unahifadhi utofautishaji wa matendo ya wanadamu na rehema ya Mungu, huku ukiepuka kuamua kimadhehebu maana ya “kuoshwa.”
