  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: sw
  text: Watu wetu[a] nao wajifunze kujishughulisha[b] na matendo mema kwa ajili ya kutimiza mahitaji ya lazima[c], ili wasiwe wasiozaa matunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walio wetu” au “watu wetu wenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kujitoa kwa matendo mema” au “kuongoza katika matendo mema.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mahitaji ya dharura.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: wajifunze
  rationale: Kauli ya kuamuru nafsi ya tatu wingi; muundo wa Kiswahili unahifadhi himizo bila kulifanya kuwa amri kali kupita kiasi.
- source_word: οἱ ἡμέτεροι
  choice: watu wetu
  rationale: Kwa maana halisi ni ‘walio wetu’; hapa inaelekea kumaanisha watu wa jumuiya ya waamini inayohusishwa na Paulo na Tito. ‘Watu wetu’ ni ya kawaida na haiwekei jinsia isiyokuwamo katika Kigiriki.
- source_word: καλῶν ἔργων
  choice: matendo mema
  rationale: Ni tafsiri ya kawaida na wazi inayohifadhi msisitizo unaorudiwa katika Tito kuhusu matendo yenye manufaa ya kimaadili.
- source_word: προΐστασθαι
  choice: kujitoa katika
  rationale: Kitenzi kinaweza kumaanisha kuongoza, kusimamia, kushughulikia, au kujitoa. Katika muktadha huu, ‘kujitoa katika’ huonyesha ushiriki wa makusudi na wa kudumu bila kuamua kimya kimya kwamba maana yake ni uongozi.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: ili kutimiza mahitaji ya lazima
  rationale: Kifungu kinaelekeza matendo mema kwenye mahitaji halisi na ya lazima. ‘Kutimiza mahitaji’ ni Kiswahili cha kawaida kuliko ‘kwa mahitaji ya lazima,’ huku ‘ya lazima’ kikihifadhi nguvu ya ἀναγκαίας.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: wasije wakawa wasiozaa matunda
  rationale: Muundo huu unahifadhi kusudi la ἵνα pamoja na taswira halisi ya kutokuwa na matunda, badala ya kuibadili kuwa ‘kutofaa’ au ‘kutokuwa na matokeo.’
theological_decisions:
- issue: Upeo wa οἱ ἡμέτεροι
  choice: Watu wetu
  alternative: Walio wetu; watu wetu wenyewe
  rationale: Kifungu ni cha uhusiano na jumuiya, si istilahi maalumu ya kimafundisho. Tafsiri hii inahusisha jumuiya ya waamini bila kuingiza kizuizi cha kijinsia.
- issue: Maana ya προΐστασθαι katika uhusiano na matendo mema
  choice: Kujitoa katika
  alternative: Kushughulika na; kuongoza katika
  rationale: Kigiriki kinaweza kuelekea kwenye ushiriki wa bidii au kuchukua uongozi. Maandishi makuu yanatoa maana inayofaa zaidi katika muktadha, huku tanbihi ikihifadhi uwezekano mwingine wa kileksika.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Watu wetu nao’ ni mpangilio wa asili unaoakisi δὲ καὶ. Alama za tanbihi zimehifadhiwa katika mpangilio wa toleo la Kiingereza lililotolewa: [c][b][a].'
