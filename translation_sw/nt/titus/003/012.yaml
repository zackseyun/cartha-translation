  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: sw
  text: Nitakapomtuma Artema au Tikiko kwako, jitahidi kuja kwangu huko Nikopoli, kwa maana nimeamua kukaa huko wakati wa majira ya baridi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Nitakapomtuma
  rationale: Muundo huu wa Kiswahili unaonyesha tukio mahususi linalotarajiwa wakati ujao na kudumisha hali ya utegemezi iliyo katika ὅταν pamoja na kitenzi cha hali tegemezi.
- source_word: Ἀρτεμᾶν
  choice: Artema
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: ἢ
  choice: au
  rationale: Kiunganishi kinaonyesha kwamba mmoja kati ya wajumbe wawili atatumwa.
- source_word: Τυχικόν
  choice: Tikiko
  rationale: Jina limetoholewa kwa kufuata mfumo wa sauti na tahajia ya Kiswahili.
- source_word: σπούδασον
  choice: jitahidi
  rationale: Amri hii inaonyesha bidii na dhamira ya kutenda kwa wakati, bila kuifanya iwe amri ya kuharakisha tu.
- source_word: ἐλθεῖν πρός με
  choice: kuja kwangu
  rationale: Kitenzi cha mwendo kinaelekezwa kwa msemaji, hivyo 'kuja kwangu' ni cha asili na sahihi.
- source_word: εἰς Νικόπολιν
  choice: huko Nikopoli
  rationale: Hutaja mahali ambapo Paulo anataka Tito aje kwake; 'huko' huepuka kurudia 'kwangu kwenda' na kubaki wazi kuwa Nikopoli ndilo lengo.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huanzisha sababu ya ombi lililotangulia katika lugha yenye hadhi lakini inayoeleweka.
- source_word: κέκρικα
  choice: nimeamua
  rationale: Wakati timilifu unaonyesha uamuzi uliofanywa na ambao bado una nguvu wakati wa kuandika.
- source_word: παραχειμάσαι
  choice: kukaa huko wakati wa majira ya baridi
  rationale: Hueleza kukaa mahali wakati wote au sehemu ya msimu wa baridi; usemi huu ni wa kawaida na wazi kuliko neno lisilozoeleka la kitenzi kimoja.
