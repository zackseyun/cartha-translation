  source_fidelity: 'Matini inafuata kwa uaminifu muundo na maana ya Kigiriki: tukio la wakati ujao lenye utegemezi (Ὅταν πέμψω), uchaguzi kati ya Artema na Tikiko, amri ya bidii (σπούδασον), mwelekeo wa kuja kwa Paulo, Nikopoli kama mahali lengwa, na uamuzi uliokwisha kufanywa wa kukaa huko kipindi cha baridi.'
