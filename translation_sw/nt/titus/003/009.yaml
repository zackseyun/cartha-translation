source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: sw
  text: Lakini epuka mabishano ya kipumbavu[a], nasaba, ugomvi, na mabishano kuhusu sheria[b], kwa maana mambo hayo hayana faida na ni ya bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mijadala” au “makisio” badala ya “mabishano.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mabishano ya kisheria”; yaani, mabishano kuhusu sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: ya kipumbavu
  rationale: Usemi huu unaonyesha kwamba mijadala hiyo haina hekima wala maana katika matokeo yake, bila kuifanya kuwa maelezo ya upungufu wa akili.
- source_word: ζητήσεις
  choice: mijadala
  rationale: Katika muktadha huu neno linamaanisha maswali au uchunguzi unaozusha ubishi; “mijadala” ni ya kawaida na inaacha uwezekano huo wazi. Tanbihi inataja tafsiri mbadala zenye mkazo zaidi wa ubishi au makisio.
- source_word: γενεαλογίας
  choice: nasaba
  rationale: Tafsiri ya moja kwa moja inayohifadhi upana wa neno bila kuamua kwamba linahusu mfumo fulani wa Kiyahudi, wa Kinostiki, au mwingine.
- source_word: ἔρεις
  choice: ugomvi
  rationale: Neno hili huonyesha uhasama na mfarakano. “Ugomvi” hulitofautisha kwa kiasi na μάχας inayofuata, ingawa maana zake zinakaribiana.
- source_word: μάχας νομικὰς
  choice: mabishano kuhusu sheria
  rationale: Muktadha unaonyesha mapambano ya maneno, si vita vya kimwili wala kesi mahakamani. “Kuhusu sheria” huonyesha wazi kwamba νομικὰς inaeleza mada ya mabishano.
- source_word: περιΐστασο
  choice: epuka
  rationale: Kitenzi cha amri kinamtaka Tito ajitenge na mambo hayo; “epuka” ni kifupi, cha kawaida, na chenye nguvu inayofaa.
- source_word: ἀνωφελεῖς
  choice: hayana faida
  rationale: Usemi huu unaonyesha kwamba mambo hayo hayaleti manufaa.
- source_word: μάταιοι
  choice: ni ya bure
  rationale: Usemi huu unaonyesha utupu na kutokuwa na matokeo yenye maana, huku ukitofautiana na “hayana faida” iliyotangulia.
theological_decisions:
- issue: Maana mahususi ya “nasaba” na “mabishano kuhusu sheria”
  choice: Maneno yametafsiriwa kwa upana bila kutaja mfumo fulani wa kihistoria au wa kidini.
  alternative: Kuyafafanua kuwa mijadala kuhusu asili ya Kiyahudi, makisio ya Kinostiki, au aina nyingine mahususi ya uzushi.
  rationale: Aya yenyewe haitoi maelezo ya kutosha kuhalalisha ufafanuzi mmoja mahususi. Tafsiri pana huhifadhi utata wa chanzo na huepuka kuingiza hitimisho la kimadhehebu au la kihistoria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Orodha ya mambo ya kuepukwa imehifadhiwa, pamoja na tofauti ya kiasi kati ya “ugomvi” na “mabishano.” Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini kuu.
