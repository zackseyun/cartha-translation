id: TIT.3.15
reference: Titus 3:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: sw
  text: Wote walio pamoja nami wanakusalimu. Wasalimu wale wanaotupenda katika imani.[a] Neema iwe nanyi nyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika ile imani”; pia yaweza kuwa, “kwa uaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: wanakusalimu
  rationale: Katika hitimisho la barua, ἀσπάζομαι humaanisha kutoa salamu. Umbo hili la Kiswahili ni la kawaida na pia linaonyesha kuwa kiwakilishi σε ni cha umoja.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: Wote walio pamoja nami
  rationale: Huhifadhi πάντες (‘wote’) na wazo la watu walio pamoja na mwandishi bila kuongeza utambulisho wao.
- source_word: ἄσπασαι
  choice: Wasalimu
  rationale: Amri hii ya umoja imetafsiriwa kwa njia fupi na ya kawaida katika salamu za barua.
- source_word: τοὺς φιλοῦντας ἡμᾶς
  choice: wale wanaotupenda
  rationale: φιλέω hapa huonyesha upendo wa kindugu au uhusiano wa karibu; ‘wanatupenda’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: ἐν πίστει
  choice: katika imani
  rationale: Huhifadhi maana ya msingi ya πίστις na uwezekano kwamba imani ndiyo mazingira au msingi wa upendo huo, bila kuufanya usemi kuwa maalumu kuliko Kigiriki.
- source_word: ἡ χάρις
  choice: Neema
  rationale: Ni neno la kawaida la Kikristo kwa χάρις na linafaa katika baraka ya mwisho ya Paulo.
- source_word: μετὰ πάντων ὑμῶν
  choice: iwe nanyi nyote
  rationale: Kitenzi ‘iwe’ kinaeleweka katika baraka hiyo, ‘nanyi’ huhifadhi wingi wa ὑμῶν, na ‘nyote’ huhifadhi πάντων.
theological_decisions:
- issue: Maana ya πίστις katika ἐν πίστει
  choice: imani
  alternative: ile imani; uaminifu
  rationale: ‘Imani’ ndiyo maana inayofaa zaidi hapa na inaweza kueleza mazingira ya pamoja ya upendo wa waamini. Hata hivyo, Kigiriki kinaweza pia kueleweka kuwa ‘katika ile imani’ au ‘kwa uaminifu,’ kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Tofauti ya umoja katika ‘wanakusalimu/wasalimu’ na wingi katika ‘nanyi nyote’ imehifadhiwa.
