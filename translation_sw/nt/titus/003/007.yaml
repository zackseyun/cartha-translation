translation:
  language: sw
  text: ili, tukiisha kuhesabiwa haki[b] kwa neema yake, tupate kuwa warithi kulingana na tumaini la uzima wa milele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika tumaini la uzima wa milele.”
    reason: lexical_alternative
  - marker: b
    text: “Kuhesabiwa haki” pia kunaweza kutafsiriwa “kutangazwa kuwa wenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili kwamba
  rationale: Huanzisha kusudi au matokeo; “ili kwamba” ni ya kawaida na huhifadhi nguvu ya kisharti cha kusudi.
- source_word: δικαιωθέντες
  choice: baada ya kuhesabiwa haki
  rationale: Huhifadhi hali ya kutendwa na kuonyesha kwamba tendo hili linatangulia kuwa warithi, bila kufafanua zaidi namna ya kuhesabiwa haki.
- source_word: τῇ ἐκείνου χάριτι
  choice: kwa neema yake
  rationale: “Kwa” huonyesha neema kama njia au msingi wa tendo, huku “yake” ikihifadhi kutotajwa wazi kwa mhusika anayerejelewa.
- source_word: κληρονόμοι
  choice: warithi
  rationale: Huhifadhi taswira ya urithi iliyo katika neno la Kigiriki na ni Kiswahili cha kawaida.
- source_word: γενηθῶμεν
  choice: tupate kuwa
  rationale: Huonyesha kuingia katika hali ya kuwa warithi na pia hulingana kwa kawaida na kisharti cha kusudi kinachoanza kwa ἵνα.
- source_word: κατ’ ἐλπίδα
  choice: kulingana na tumaini
  rationale: Huhifadhi kwa karibu uhusiano unaoonyeshwa na κατά bila kuamua iwapo tumaini ni mazingira, kipimo, au mwelekeo wa urithi.
- source_word: ζωῆς αἰωνίου
  choice: la uzima wa milele
  rationale: Ni usemi wa kawaida wa kibiblia na huonyesha kwamba uzima wa milele ndio jambo linalotumainiwa.
theological_decisions:
- issue: Maana ya δικαιωθέντες katika muktadha wa wokovu
  choice: kuhesabiwa haki
  alternative: kutangazwa kuwa wenye haki
  rationale: “Kuhesabiwa haki” hudumisha istilahi kuu ya kibiblia na hali ya kutendwa, bila kufunga maana katika maelezo fulani ya kitheolojia; tafsiri mbadala imewekwa katika tanbihi.
- issue: Mhusika anayerejelewa na ἐκείνου
  choice: yake
  alternative: ya Mungu / ya Yesu Kristo
  rationale: Kiwakilishi cha Kiswahili kinahifadhi kiwango cha kutotajwa wazi kilichopo katika Kigiriki na hakilazimishi kumtaja Mungu au Yesu Kristo moja kwa moja.
- issue: Uhusiano unaoonyeshwa na κατ’ ἐλπίδα
  choice: kulingana na tumaini la uzima wa milele
  alternative: katika tumaini la uzima wa milele
  rationale: Tafsiri kuu hufuata muundo wa κατά kwa karibu, huku mbadala ukionyesha uwezekano wa kuuelewa usemi huu kama hali ya kutumaini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “baada ya … tupate kuwa” ni wa asili na huhifadhi mpangilio wa tendo linalotangulia na matokeo yake. Alama zote za tanbihi zimewekwa katika matini kuu.
