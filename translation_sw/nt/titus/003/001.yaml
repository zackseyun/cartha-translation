  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: sw
  text: Endelea kuwakumbusha wajitiishe kwa watawala na wenye mamlaka[a], watii, na wawe tayari kwa kila kazi njema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wawatii watawala na wenye mamlaka.”
    reason: Mbadala huu huonyesha uwezekano wa kueleza ὑποτάσσεσθαι na πειθαρχεῖν kwa kitenzi “kutii” katika Kiswahili, bila kutumia usemi usio wa kawaida au kuongeza maana.
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Endelea kuwakumbusha
  rationale: Kitenzi cha wakati uliopo katika hali ya kuamuru kinaonyesha agizo la kuendelea kufanya hivyo; usemi huu unaonyesha wazi tendo linaloendelea kwa Kiswahili cha kawaida.
- source_word: αὐτοὺς
  choice: wa-
  rationale: Kiambishi cha yambwa katika “kuwakumbusha” kinawarejelea waamini ambao Tito anapaswa kuwaelekeza.
- source_word: ἀρχαῖς
  choice: watawala
  rationale: Katika muktadha huu wa kiraia, neno hili linamaanisha viongozi wenye madaraka ya kutawala, si mamlaka za kiroho.
- source_word: ἐξουσίαις
  choice: wenye mamlaka
  rationale: Likitumiwa pamoja na ἀρχαῖς, linataja watu au vyombo vilivyopewa mamlaka; tafsiri hii inadumisha jozi ya maneno ya Kigiriki.
- source_word: ὑποτάσσεσθαι
  choice: wajitiishe kwa
  rationale: Hueleza kujiweka chini ya utaratibu au mamlaka. “Wajitiishe kwa” ni ya asili na yenye heshima bila kudokeza utumwa.
- source_word: πειθαρχεῖν
  choice: watii
  rationale: Kitenzi hiki humaanisha kutii mamlaka. “Watii” ni kifupi na cha kawaida, huku yambwa wake ukibaki wazi kwa mujibu wa muundo wa Kigiriki.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: kwa kila kazi njema
  rationale: πρός hapa huonyesha jambo ambalo mtu yuko tayari kulifanya; usemi huu unahifadhi upeo wa “kila” na maana ya kimaadili ya kazi njema.
- source_word: ἑτοίμους εἶναι
  choice: wawe tayari
  rationale: Usemi huu unaonyesha hali endelevu ya kuwa tayari, na umetafsiriwa kwa Kiswahili cha moja kwa moja na cha kawaida.
theological_decisions:
- issue: Upeo wa kujitiisha kwa miundo ya serikali
  choice: Mstari umetafsiriwa kama wito wa jumla wa kujitiisha kwa watawala na wenye mamlaka na kuwatii, bila kuongeza kwamba utii huo hauna mipaka katika kila hali.
  alternative: Kutafsiri kwa namna inayodokeza wazi utii usio na masharti kwa mamlaka za serikali.
  rationale: Maneno ἀρχαῖς na ἐξουσίαις katika muktadha huu yanaelekea kwa watawala na mamlaka za kiraia. Tafsiri inahifadhi agizo lenyewe bila kulipanua ili kutatua hali ambazo mstari hauzitaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Endelea kuwakumbusha” huonyesha nguvu ya agizo endelevu; “watawala na wenye mamlaka” huhifadhi jozi ya maneno ya chanzo.
