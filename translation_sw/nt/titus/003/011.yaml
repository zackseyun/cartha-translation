lexical_decisions:
- source_word: εἰδὼς
  choice: ukijua
  rationale: Kitenzi-shirikishi hiki kinaungana na agizo la mstari uliotangulia na mhusika wake anayetekeleza agizo hilo. “Ukijua” huhifadhi uhusiano huo bila kulazimisha maana ya sababu.
- source_word: ἐξέστραπται
  choice: amepotoka
  rationale: Kauli timilifu inaonyesha hali ya sasa iliyotokana na kugeuka hapo awali. “Amepotoka” ni Kiswahili cha kawaida na huonyesha tendo lililotokea pamoja na matokeo yake yanayoendelea.
- source_word: ὁ τοιοῦτος
  choice: mtu kama huyo
  rationale: Kirai hiki kinamrejelea mtu mwenye kuleta migawanyiko katika muktadha. Ingawa umbo la Kigiriki ni la kiume umoja, “mtu kama huyo” ni usemi wa asili wa Kiswahili na hauondoi urejeo wa mtu mmoja.
- source_word: ἁμαρτάνει
  choice: anaendelea kutenda dhambi
  rationale: Wakati uliopo unaonyesha tendo linaloendelea. “Anaendelea kutenda dhambi” huwasilisha hali hiyo kwa Kiswahili wazi, bila kudai zaidi ya muktadha.
- source_word: ὢν
  choice: naye
  rationale: Kitenzi-shirikishi kinaunganisha sifa ya mwisho na maelezo yaliyotangulia. Katika Kiswahili, “naye” huleta muunganiko wa asili bila kulazimisha ikiwa maana ni ya sababu au ya wakati.
- source_word: αὐτοκατάκριτος
  choice: amejihukumu mwenyewe
  rationale: Neno hili linaonyesha kwamba mtu huyo amehukumiwa kwa mwenendo au ushahidi wake mwenyewe. Tafsiri hii huhifadhi nguvu ya kujirejelea bila kuingiza hukumu rasmi ya mwisho.
theological_decisions:
- issue: Urejeo wa kijinsia katika ὁ τοιοῦτος
  choice: mtu kama huyo
  alternative: mwanamume kama huyo
  rationale: Kigiriki kina umbo la kisarufi la kiume umoja, lakini katika muktadha kirai ni cha kimuundo na kinamaanisha mtu wa aina hiyo. “Mtu kama huyo” ni sahihi na cha asili katika Kiswahili bila kubadili idadi ya umoja.
- issue: Nguvu ya αὐτοκατάκριτος
  choice: amejihukumu mwenyewe
  alternative: anajihukumu mwenyewe
  rationale: Tafsiri iliyochaguliwa inaonyesha hali ya kuhukumiwa inayotokana na matendo au ushahidi wa mtu mwenyewe, bila kuamua kwamba mstari huu unaeleza hukumu ya mwisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umefanywa wa asili kwa Kiswahili huku hali ya kauli timilifu, tendo linaloendelea, na utata wa αὐτοκατάκριτος vikihifadhiwa.
