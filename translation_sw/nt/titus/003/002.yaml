base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: sw
  text: wasimseme vibaya mtu yeyote[a], wasiwe wagomvi[b], wawe wenye kiasi[c], na waonyeshe upole wote kwa watu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasiseme mabaya juu ya mtu yeyote.” Kitenzi hiki kinaweza kumaanisha kusema kwa dharau au kwa ubaya dhidi ya mtu, kwa maana pana kuliko tusi la moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Au, “wawe wapenda amani.” Neno la Kigiriki linamaanisha kutokuwa tayari kugombana au kupigana.
    reason: lexical_alternative
  - marker: c
    text: Au, “wawe wapole,” “wawe wenye kuwajali wengine,” au “wawe wavumilivu.” Neno hili linaweza kuonyesha kiasi, usawaziko, na kutosisitiza haki ya mtu mwenyewe kwa ukali.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: mtu yeyote
  rationale: Kirai hiki, kikiwa yambwa cha βλασφημεῖν, kinahifadhi upeo wa katazo linalomhusu kila mtu bila ubaguzi.
- source_word: βλασφημεῖν
  choice: wasimtukane
  rationale: Katika muktadha huu wa mwenendo kati ya watu, kitenzi kinamaanisha kusema maneno ya kudhalilisha au ya kumharibia mwingine sifa, si kumkufuru Mungu. ‘Kumtukana’ ni wazi na ya kawaida, huku tanbihi ikihifadhi maana pana zaidi.
- source_word: ἀμάχους εἶναι
  choice: wasiwe wagomvi
  rationale: Tafsiri hii inahifadhi umbo hasi na wazo la kutopenda ugomvi au mapambano; pia ni ya kawaida katika Kiswahili cha sasa.
- source_word: ἐπιεικεῖς
  choice: waungwana
  rationale: ‘Waungwana’ hapa linaonyesha watu wenye upole, busara, na moyo wa kuwafikiria wengine, bila kurudia moja kwa moja ‘upole’ linalotafsiri πραΰτητα.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: waonyeshe upole wa kila namna
  rationale: Kirai hiki kinaonyesha kwamba sifa hiyo ionekane katika mwenendo na kuhifadhi msisitizo wa πᾶσαν kwa Kiswahili cha kawaida.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: kwa watu wote
  rationale: ἄνθρωποι linawahusu wanadamu kwa ujumla, na ‘watu wote’ linahifadhi maana hiyo pamoja na upeo wake wa ulimwengu wote.
theological_decisions:
- issue: Upeo wa πάντας ἀνθρώπους
  choice: watu wote
  alternative: kila mtu
  rationale: Nomino ya Kigiriki inawahusu wanadamu wote bila kuwalenga wanaume pekee; tafsiri hii inahifadhi upeo wa jumla bila kuingiza maana ya kijinsia isiyokusudiwa.
- issue: Kutofautisha ἐπιεικεῖς na πραΰτητα
  choice: waungwana … upole
  alternative: wapole … upole
  rationale: Maneno mawili yana maeneo ya maana yanayokaribiana lakini si sawa kabisa. Kutumia ‘waungwana’ kwa ἐπιεικεῖς na ‘upole’ kwa πραΰτητα kunahifadhi tofauti hiyo bila kuifanya kuwa tofauti kali kuliko ilivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa wingi unaendeleza mfululizo wa maagizo kutoka muktadha uliotangulia. ‘Waungwana’ limetumiwa kwa maana ya mwenendo wa kiasi na wa kuwafikiria wengine, si hadhi ya kijamii.
