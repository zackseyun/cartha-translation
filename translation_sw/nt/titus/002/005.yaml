base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: sw
  text: wenye kiasi, walio safi, wanaofanya kazi za nyumbani[a], wenye fadhili, wanaojitiisha kwa waume zao wenyewe[b], ili neno la Mungu lisitukanwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaoshughulika na kazi za nyumbani.” Neno la Kiyunani ni adimu na linamaanisha kujishughulisha na kazi zinazohusu nyumba.
    reason: lexical_alternative
  - marker: b
    text: Au “wanaojiweka chini ya waume zao wenyewe.”
    reason: lexical_alternative
  - marker: c
    text: Au “lisikashifiwe”; kwa maana ya karibu zaidi, “lisifanywe kuwa la kufuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: wenye kiasi
  rationale: Kirai hiki kinaeleza kuwa na akili timamu kunakoonekana katika kujizuia na kuendesha maisha kwa busara. “Wenye kiasi” ni Kiswahili cha kawaida na chenye heshima katika orodha ya maadili.
- source_word: ἁγνάς
  choice: walio safi
  rationale: Neno hili hapa linaonyesha usafi wa kimaadili. “Walio safi” huhifadhi maana pana bila kuibana kwa usafi wa kingono pekee.
- source_word: οἰκουργούς
  choice: wanaofanya kazi za nyumbani
  rationale: Neno hili adimu huunganisha dhana za nyumba na kazi. Tafsiri hii inaonyesha kushughulika na kazi za nyumbani bila kudai kwamba wanawake wanapaswa kuzuiwa wasitoke nyumbani.
- source_word: ἀγαθάς
  choice: wenye fadhili
  rationale: Katika orodha ya mwenendo, “wenye fadhili” huonyesha wema unaodhihirika katika jinsi mtu anavyowatendea wengine; “wema” pia ingewezekana lakini ni pana zaidi.
- source_word: ὑποτασσομένας
  choice: wanaojitiisha kwa
  rationale: Tafsiri hii huhifadhi tendo la kujiweka chini katika mpangilio wa uhusiano, bila kuongeza mfumo mpana wa kimadhehebu ambao mstari wenyewe hautamki.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: waume wao wenyewe
  rationale: Katika muktadha wa ndoa, ἀνδράσιν humaanisha “waume.” “Wao wenyewe” huhifadhi ἰδίοις na kuweka wazi kwamba kauli inahusu waume zao, si wanaume wote.
- source_word: ἵνα μὴ
  choice: ili ... lisi-
  rationale: “Ili” huwasilisha wazi kusudi linaloletwa na ἵνα, huku kiambishi hasi “lisi-” kikihifadhi μὴ.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Hii ni tafsiri ya moja kwa moja na iliyozoeleka ya ujumbe unaotoka kwa Mungu katika muktadha huu.
- source_word: βλασφημῆται
  choice: lisitukanwe
  rationale: Kitenzi hiki kinaweza kumaanisha kusemwa vibaya, kukashifiwa, au kukufuriwa. Kwa kuwa kinacholengwa ni neno la Mungu, “lisitukanwe” ni cha kawaida na huhifadhi wazo la kulivunjia heshima hadharani.
theological_decisions:
- issue: Kutafsiri οἰκουργούς bila kuifanya iwe amri ya kutotoka nyumbani
  choice: wanaofanya kazi za nyumbani
  alternative: wanaokaa nyumbani na kuitunza
  rationale: Neno la Kiyunani linasisitiza kazi inayohusiana na nyumba, lakini halitamki wazi zuio la kutoka nyumbani. Tafsiri iliyochaguliwa haiongezi dai hilo.
- issue: Kuwasilisha ὑποτασσομένας bila kuingiza mfumo wa kimadhehebu
  choice: wanaojitiisha kwa waume wao wenyewe
  alternative: walio chini ya waume wao wenyewe
  rationale: “Wanaojitiisha” huhifadhi maana ya mpangilio wa uhusiano na hali ya kishiriki ya neno la Kiyunani. Kutaja “waume wao wenyewe” kunazuia kuipanua kauli hii iwahusu wanaume wote.
- issue: Kuhifadhi upeo wa βλασφημῆται inapolenga neno la Mungu
  choice: lisitukanwe
  alternative: lisikashifiwe; kwa maana ya karibu zaidi, lisikufuriwe
  rationale: Neno la Kiyunani linaweza kueleza kashfa au usemi wa kufuru. Maandishi makuu yanatumia Kiswahili cha kawaida, na tanbihi huhifadhi uwezekano mpana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umehifadhiwa ili mstari huu uweze kuungana kwa kawaida na kitenzi cha kufundisha kilicho katika muktadha uliotangulia. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
