  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: sw
  text: Wanaume wazee wawe na kiasi, wenye heshima, wenye kujitawala, na walio imara katika imani[a], upendo na uvumilivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu.” Neno la Kigiriki πίστις linaweza kumaanisha “imani” au “uaminifu,” kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: wanaume wazee
  rationale: Katika maagizo kwa makundi ya nyumbani, neno hili linamaanisha wanaume wenye umri mkubwa, si viongozi wenye cheo cha wazee wa kanisa.
- source_word: νηφαλίους
  choice: wenye kiasi
  rationale: Neno linaweza kumaanisha kutolewa na ulevi, na kwa upana kuwa na kiasi na utulivu wa akili. 'Wenye kiasi' linabeba maana pana ya maadili bila kuiwekea mipaka ya pombe pekee.
- source_word: σεμνούς
  choice: wenye heshima
  rationale: Hueleza mwenendo mzito na wenye staha unaostahili kuheshimiwa; huu ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: σώφρονας
  choice: wenye kujitawala
  rationale: Hueleza busara yenye nidhamu na uwezo wa kudhibiti nafsi; 'wenye kujitawala' ni wazi katika orodha hii ya sifa.
- source_word: ὑγιαίνοντας
  choice: walio imara
  rationale: Kihalisi ni 'wenye afya,' lakini hapa ni sitiari ya kuwa thabiti au timamu katika sifa zinazofuata. 'Imara' huhifadhi wazo hilo kwa Kiswahili cha kawaida.
- source_word: τῇ πίστει
  choice: katika imani
  rationale: πίστις inaweza kumaanisha imani au uaminifu. 'Imani' ndiyo maana kuu katika matini, huku uwezekano wa 'uaminifu' ukihifadhiwa katika tanbihi.
- source_word: τῇ ἀγάπῃ
  choice: upendo
  rationale: ἀγάπη hutafsiriwa kwa kawaida kuwa 'upendo'; kihusishi 'katika' kinatawala pia nomino hii katika mfululizo wa Kiswahili.
- source_word: τῇ ὑπομονῇ
  choice: uvumilivu
  rationale: Neno hili hueleza kudumu kwa subira chini ya shida. 'Uvumilivu' ni la kawaida na linaeleweka kwa wasomaji wengi.
- source_word: εἶναι
  choice: wawe
  rationale: Infinitivu hii inaendeleza nguvu ya agizo kutoka muktadha uliotangulia; 'wawe' huwasilisha agizo hilo kwa ufupi na kwa kawaida.
theological_decisions:
- issue: Maana ya πίστις katika orodha ya sifa
  choice: imani
  alternative: uaminifu
  rationale: Katika mfululizo wa imani, upendo na uvumilivu, πίστις inaweza kueleweka kama kumwamini Mungu au kama uaminifu wa mtu. Matini kuu inatumia 'imani,' na tanbihi inalinda maana nyingine halali bila kuamua mvutano kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa orodha umehifadhiwa, huku 'katika' ikieleweka kutawala imani, upendo na uvumilivu.
