  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: sw
  text: tukingojea tumaini lenye baraka na kutokea kwa utukufu wa Mungu mkuu na Mwokozi wetu[a], Yesu Masihi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ingawa uwezekano huu ni mdogo, “utukufu wa Mungu mkuu na wa Mwokozi wetu Yesu Masihi,” kwa kuelewa “Mungu” na “Mwokozi” kuwa wanarejelea watu wawili tofauti badala ya kuwa cheo kimoja cha Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: tukilitazamia
  rationale: Kitenzi hiki huonyesha kungoja kwa matarajio; umbo la kuendeleza sentensi linahifadhi nguvu ya kirai tegemezi cha Kigiriki.
- source_word: μακαρίαν ἐλπίδα
  choice: tumaini lenye baraka
  rationale: Hili ni tumaini la wakati ujao ambalo huleta baraka, si tamanio lisilo na hakika; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ἐπιφάνειαν
  choice: kufunuliwa
  rationale: Neno hili linamaanisha kudhihirika au kuonekana wazi. ‘Kufunuliwa’ linaeleweka kwa urahisi na linafaa kwa tukio la mwisho linalotazamiwa.
- source_word: δόξης
  choice: utukufu
  rationale: Tafsiri ya moja kwa moja inayohifadhi muundo wa ‘kufunuliwa kwa utukufu’.
- source_word: μεγάλου θεοῦ
  choice: Mungu wetu mkuu
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi kivumishi ‘mkuu’ pamoja na ‘wetu’ kinachohusiana na kirai chote.
- source_word: σωτῆρος ἡμῶν
  choice: Mwokozi
  rationale: ‘Mwokozi’ ndiyo istilahi ya kawaida na inayofaa katika muktadha huu; ‘wetu’ tayari imewekwa baada ya ‘Mungu’ na kwa Kiswahili inaweza kutawala nomino zote mbili zilizounganishwa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa ni cheo; ‘Masihi’ huwasilisha maana yake badala ya kuacha unukuzi wa kimapokeo.
theological_decisions:
- issue: Je, ‘Mungu wetu mkuu na Mwokozi, Yesu Masihi’ humrejelea mtu mmoja au watu wawili?
  choice: 'Mtu mmoja: Yesu Masihi anatambulishwa kuwa Mungu wetu mkuu na Mwokozi.'
  alternative: 'Watu wawili: Mungu mkuu, na Mwokozi wetu Yesu Masihi.'
  rationale: Katika Kigiriki, nomino mbili za mtu zilizo katika umoja zinatawaliwa na kibainishi kimoja, kisha zinafuatwa na ‘Yesu Masihi’; kwa kawaida muundo huo humrejelea mtu mmoja. Hata hivyo, uwezekano wa kuutafsiri kuwa marejeleo mawili umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tukilitazamia’ linaunganisha mstari huu na wazo la mstari uliotangulia. Alama ya tanbihi imewekwa baada ya ‘Mwokozi’ ili kuonyesha kwa uwazi mahali pa utata wa kisarufi.
