  text: Kwa maana neema ya Mungu imedhihirika, ikileta wokovu kwa watu wote.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “imedhihirika ikiwaokoa watu wote,” au “imedhihirika kwa watu wote.” Kivumishi cha Kigiriki σωτήριος (“inayookoa,” “inayoleta wokovu”) na kirai cha dativu πᾶσιν ἀνθρώποις vinaweza kuhusishwa kwa namna tofauti kidogo.
    reason: lexical_alternative
  - marker: b
    text: “Watu wote” hutafsiri neno la Kigiriki anthrōpois, ambalo hapa linamaanisha wanadamu kwa ujumla, si wanaume pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: imedhihirika
  rationale: Kitenzi hiki hapa kina maana ya kutokea au kuwa wazi kwa kuonekana. “Imedhihirika” ni Kiswahili cha sasa chenye hadhi, kinachohifadhi wazo la neema ya Mungu kuonekana wazi bila kukifanya kitenzi hiki kiwe taarifa ya ufunuo kwa maneno.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa msingi au maelezo ya mausia yaliyotangulia. “Kwa maana” huonyesha uhusiano huo kwa kawaida katika Kiswahili.
- source_word: χάρις
  choice: neema
  rationale: “Neema” ni neno la kawaida na linalofaa katika muktadha huu kwa fadhili ya Mungu yenye nguvu ya kuokoa.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: 'Muundo huu unahifadhi kwa uwazi uhusiano wa genitivi: neema inayomhusu au inayotoka kwa Mungu, bila kulazimisha ufafanuzi mmoja tu.'
- source_word: σωτήριος
  choice: ikileta wokovu
  rationale: Kivumishi hiki huonyesha kile kinachookoa au kuleta wokovu. “Ikileta wokovu” ni muundo wa kawaida wa Kiswahili na unaunganisha maana hiyo na “neema” bila kuongeza maelezo ya kimafundisho.
- source_word: πᾶσιν ἀνθρώποις
  choice: kwa watu wote
  rationale: ἄνθρωποι linawahusu wanadamu kwa ujumla, si wanaume pekee. “Kwa watu wote” huhifadhi upana wa kauli na hufuatana kwa kawaida na “ikileta wokovu,” huku tanbihi ikitaja uwezekano mwingine wa kisarufi.
theological_decisions:
- issue: Upeo wa πᾶσιν ἀνθρώποις kuhusiana na wokovu
  choice: kwa watu wote
  alternative: kwa kila aina ya watu; kwa wanadamu wote
  rationale: Tafsiri inahifadhi upana wa maneno ya Kigiriki bila kuamua kama yanamaanisha kila mtu mmoja mmoja bila ubaguzi au watu wa kila kundi. Hivyo mvutano wa kiteolojia unabaki kama ulivyo katika chanzo.
- issue: Uhusiano wa σωτήριος na πᾶσιν ἀνθρώποις
  choice: ikileta wokovu kwa watu wote
  alternative: inayookoa watu wote; imedhihirika kwa watu wote
  rationale: Kigiriki kinaruhusu tofauti ndogo katika jinsi kivumishi na kirai cha dativu vinavyohusishwa. Matini kuu inatumia muundo wa asili wa Kiswahili, na tanbihi inahifadhi mibadala halisi bila kuamua matokeo yake ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Imedhihirika” huchaguliwa badala ya “imefunuliwa” ili kuhifadhi maana ya kutokea au kuwa wazi kwa kuonekana; sentensi ni fupi na inaeleweka kwa msomaji wa kawaida.
