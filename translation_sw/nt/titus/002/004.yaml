lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au matokeo ya maagizo yaliyotangulia; “ili” ni ya kawaida na huhifadhi nguvu ya kishazi cha kusudi.
- source_word: σωφρονίζωσι
  choice: wawafundishe
  rationale: Kitenzi kinaweza kumaanisha kuongoza, kushauri, au kufundisha mtu awe na mwenendo wa busara na kiasi. Katika muktadha huu, “wawafundishe” huonyesha malezi yanayoathiri mwenendo bila kukibana kitenzi kuwa mafundisho ya kiakili tu.
- source_word: τὰς νέας
  choice: wanawake vijana
  rationale: Kivumishi cha kike chenye kibainishi kinawarejelea wanawake walio vijana kwa kulinganishwa na wanawake wazee wa muktadha. Tafsiri hii haiwabani kuwa “wake vijana,” kwa kuwa neno “wake” halipo wazi katika Kigiriki.
- source_word: φιλάνδρους
  choice: kuwapenda waume zao
  rationale: Kivumishi hiki hueleza upendo kwa mume. Muundo wa kitenzi ni wa asili katika Kiswahili na unawasilisha tabia inayokusudiwa.
- source_word: εἶναι
  choice: kuwa, ikiwakilishwa kimaana katika muundo “kuwapenda”
  rationale: Katika Kiswahili, tafsiri halisi “kuwa wenye kuwapenda” ingekuwa nzito. Muundo wa kikamilisho “kuwapenda” huwasilisha maana hiyo kwa ufasaha.
- source_word: φιλοτέκνους
  choice: '[kuwapenda] watoto wao'
  rationale: Kivumishi hiki hueleza upendo kwa watoto. Kitenzi “kuwapenda” kinatumika kwa pamoja kwa vipashio viwili, na hivyo kudumisha ulinganifu wa jozi ya Kigiriki kwa Kiswahili cha asili.
theological_decisions:
- issue: Wigo wa “wanawake vijana” katika muktadha wa maagizo ya nyumbani
  choice: Kutafsiri moja kwa moja kuwa “wanawake vijana” bila kuwabana kuwa wake vijana wala kufanya mstari huu kuwa ufafanuzi kamili wa nafasi ya wanawake wote.
  alternative: “wake vijana,” au kufafanua kifungu kama kanuni ya nyumbani inayowahusu wanawake wote bila kujali hali yao
  rationale: Kigiriki kinataja wanawake vijana, huku sifa zinazofuata zikidhania hali ya kuwa na waume na watoto kwa wale wanaoelekezwa. Tafsiri inahifadhi mazingira hayo bila kuongeza mipaka isiyosemwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “kuwapenda waume zao na watoto wao” umechaguliwa kwa ufasaha; tanbihi huhifadhi umbo la kisifa la maneno ya Kigiriki. Alama zote za tanbihi zimewekwa mwishoni mwa kishazi kwa mpangilio wa kawaida wa [a], [b], [c].
