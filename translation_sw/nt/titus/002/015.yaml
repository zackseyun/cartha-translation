base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: sw
  text: Kwa mamlaka kamili, nena mambo haya, himiza, na ukemee. Mtu yeyote asikudharau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asikupuuze” au “asikuangalie kwa dharau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea maagizo yaliyotangulia bila kuyafupisha kuwa mafundisho pekee.
- source_word: λάλει
  choice: Nena
  rationale: Kitenzi hiki cha kuamuru kinadai kuendelea kuyasema mambo hayo; “nena” ni cha moja kwa moja na chenye hadhi bila kuongeza maana maalumu ya kufundisha.
- source_word: παρακάλει
  choice: himiza
  rationale: Katika muktadha huu wa kichungaji, neno lina nguvu ya kusihi na kuhimiza watu watende inavyowapasa.
- source_word: ἔλεγχε
  choice: kukemea
  rationale: Neno linahusu kufichua lililo baya na kulisahihisha; “kukemea” linahifadhi nguvu yake ya kurekebisha.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: kwa mamlaka kamili
  rationale: ἐπιταγή inaweza kumaanisha agizo au mamlaka. Hapa kirai kinaonyesha uzito kamili wa mamlaka katika kunena, kuhimiza na kukemea; “mamlaka kamili” ni Kiswahili cha asili kuliko “mamlaka yote.”
- source_word: μηδείς
  choice: Mtu yeyote asi-
  rationale: Muundo huu unatoa katazo linalomhusu kila mtu bila ubaguzi.
- source_word: σου
  choice: -ku-
  rationale: Kiwakilishi cha Kigiriki kinamtaja Tito kama anayelengwa na kitendo; Kiswahili hukiwakilisha kiasili kwa kiambishi cha yambwa “-ku-.”
- source_word: περιφρονείτω
  choice: asikudharau
  rationale: Kitenzi kinaweza kumaanisha kumdharau, kumwona kuwa hafai, au kupuuza. “Asikudharau” linahifadhi nguvu ya msingi ya kutomwona Tito kuwa wa thamani au mamlaka.
theological_decisions:
- issue: Nguvu ya huduma ya Tito katika μετὰ πάσης ἐπιταγῆς
  choice: Tito anapaswa kunena, kuhimiza na kukemea kwa mamlaka kamili.
  alternative: Kirai hicho kinaweza kueleweka kuwa kinahusu sauti ya kuamuru tu, au mamlaka ya ujumbe pekee.
  rationale: Kirai hicho kinarekebisha amri zinazotangulia na kinaonyesha uzito wa utekelezaji wake. Tafsiri haiongezi dai la kwamba mamlaka hiyo ni ya Tito kwa kujitegemea, wala haifungi maana yake kwa sauti ya kuamuru pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi za amri zinahifadhi mkazo wa Kigiriki. Alama ya tanbihi imewekwa baada ya “asikudharau,” neno ambalo tanbihi inalifafanua.
