lexical_decisions:
- source_word: Δούλους
  choice: Watumwa
  rationale: Katika muktadha huu, δοῦλος inawahusu watu walio chini ya mamlaka ya mabwana wenye haki ya umiliki; “watumwa” linaonyesha wazi hali hiyo ya kijamii bila kuipunguza kuwa utumishi wa hiari.
- source_word: ἰδίοις δεσπόταις
  choice: kwa mabwana wao wenyewe
  rationale: δεσπότης hapa ni mwenye mamlaka juu ya mtumwa, na ἰδίοις inasisitiza uhusiano na mabwana wao wenyewe. “Mabwana” ni neno la kawaida na lenye hadhi katika muktadha huu.
- source_word: ὑποτάσσεσθαι
  choice: wajitiishe
  rationale: Kitenzi hiki kinaeleza kujiweka chini ya mamlaka. “Wajitiishe” huhifadhi maana hiyo kwa usahihi kuliko “watii,” ambalo lingeweza kuifanya iwe amri ya kutekeleza maagizo pekee.
- source_word: ἐν πᾶσιν
  choice: katika mambo yote
  rationale: Tafsiri hii huhifadhi upana wa kirai cha Kigiriki bila kuingiza masharti yasiyotajwa wazi katika mstari huu.
- source_word: εὐαρέστους εἶναι
  choice: wawapendeze
  rationale: εὐάρεστος humaanisha kuwa mwenye kupendeza au kukubalika. Kiambishi cha yambwa “-wa-” kinaelekeza kwa mabwana waliotajwa na kufanya sentensi iwe ya asili kwa Kiswahili.
- source_word: μὴ ἀντιλέγοντας
  choice: wala wasiwajibu kwa ubishi
  rationale: ἀντιλέγω inaweza kumaanisha kusema dhidi ya, kupinga, au kujibu kwa ubishi. Katika muktadha wa mahusiano ya nyumbani, tafsiri hii inaonyesha upinzani wa maneno bila kudai kwamba kila kutokubaliana ndiko kunakolengwa.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mazingira ya utumwa
  choice: watumwa
  alternative: watumishi
  rationale: Kutajwa kwa δεσπόταις kunaonyesha hali halisi ya utumwa na mamlaka ya mabwana. “Watumwa” hailainishi hali hiyo kuwa huduma ya hiari, wala tafsiri yenyewe haimaanishi kuhalalisha taasisi ya utumwa.
- issue: Upeo wa “katika mambo yote”
  choice: kuhifadhi kauli pana kama ilivyo
  alternative: kuiongezea kikomo kinachofafanua mambo halali pekee
  rationale: Mstari wenyewe unatumia kauli pana ἐν πᾶσιν bila kueleza kikomo. Tafsiri haiingizi ufafanuzi wa kiteolojia ambao haujasemwa hapa, hivyo inadumisha mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mausia umehifadhiwa kwa vitenzi vya hali ya kutakiwa (“wajitiishe,” “wawapendeze,” “wasiwajibu”).
