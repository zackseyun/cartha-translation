translation:
  language: sw
  text: Watumwa[a] wajitiishe kwa mabwana wao katika mambo yote, wawapendeze, wala wasiwapinge kwa maneno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi” au “watumwa waliofungwa katika utumishi”; neno la Kigiriki doulous linaweza kuwataja watu wanaotumikia, lakini hapa hali ya utumwa inaonekana kuwa ndiyo inayokusudiwa.
