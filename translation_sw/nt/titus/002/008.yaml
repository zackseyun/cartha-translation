  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: sw
  text: usemi wenye uzima[a] usioweza kulaumiwa[b], ili mpinzani[c] aone haya, akiwa hana jambo lolote baya la kusema juu yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno lenye uzima” au “ujumbe wenye uzima.”
    reason: lexical_alternative
  - marker: b
    text: Au “usio na lawama” au “usio wazi kwa ukosoaji.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “yule aliye upande unaopinga,” yaani, mpinzani.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: usemi
  rationale: Katika muktadha huu neno hilo linahusu yale anayosema Tito na namna anavyosema anapofundisha. “Usemi” hudumisha umoja wa neno la Kigiriki bila kulifanya kuwa neno moja tu.
- source_word: ὑγιῆ
  choice: wenye uzima
  rationale: Tafsiri hii inadumisha sitiari ya afya inayotumiwa katika Waraka kwa Tito kueleza usahihi wa kimafundisho na kimaadili.
- source_word: ἀκατάγνωστον
  choice: usioweza kulaumiwa
  rationale: Kirai hiki kinaeleza usemi ambao hauwezi kushutumiwa kwa msingi halali. “Kulaumiwa” ni ya kawaida na pana kuliko istilahi nzito ya kisheria “kuhukumiwa.”
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi au matokeo yaliyokusudiwa kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: ὁ ἐξ ἐναντίας
  choice: mpinzani
  rationale: Hii ni tafsiri ya kawaida ya nahau inayomaanisha mtu aliye upande unaopinga, bila kuongeza kwamba anampinga nani hasa.
- source_word: ἐντραπῇ
  choice: aone haya
  rationale: Usemi huu wa Kiswahili huwasilisha hali ya kuaibika au kutiwa aibu katika mazingira ya kijamii na kimaadili, bila kuipunguza kuwa soni ya muda mfupi.
- source_word: μηδὲν ἔχων λέγειν
  choice: kwa kuwa hana jambo lolote ... la kusema
  rationale: Uundaji huu ni wa asili katika Kiswahili na unadumisha maana ya kutokuwa na dai au shtaka lolote la kutoa.
- source_word: περὶ ἡμῶν
  choice: juu yetu
  rationale: Inadumisha nafsi ya kwanza wingi ya Kigiriki bila kuibadili kuwa “juu yako” wala kuifafanua kupita maandishi.
- source_word: φαῦλον
  choice: baya
  rationale: “Baya” linabeba uzito wa kimaadili wa neno hilo katika muktadha wa kusema jambo la kushutumu, huku likisomeka kwa kawaida.
theological_decisions:
- issue: Wigo wa nafsi ya kwanza wingi katika περὶ ἡμῶν
  choice: juu yetu
  alternative: juu yako; juu yetu sisi Wakristo; juu ya mafundisho yetu
  rationale: Maandishi ya Kigiriki yanasema “sisi” bila kufafanua kama yanawahusu Paulo na Tito tu au jamii pana ya waamini. Tafsiri haibani wala kupanua rejeo hilo.
- issue: Hali inayotajwa na ἐντραπῇ
  choice: aone haya
  alternative: aaibishwe; aaibike
  rationale: Umbo la Kigiriki linaweza kueleweka kama kuingia katika hali ya aibu au kutiwa aibu. “Aone haya” linadumisha mvutano huo bila kulazimisha mtendaji wa nje.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Usemi wenye uzima” inadumisha sitiari ya Kigiriki inayojirudia katika waraka, na sentensi imepangwa kwa mtiririko wa kawaida bila kufuta utata wa “juu yetu” au wa hali ya aibu.
