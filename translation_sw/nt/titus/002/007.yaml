  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: sw
  text: Kwa kila namna[a], jionyeshe kuwa kielelezo[b] cha matendo mema; katika mafundisho yako[c] uwe na uadilifu[d] na staha[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mambo yote.” Kigiriki kinaweza pia kutafsiriwa rasmi zaidi kuwa “kuhusu mambo yote,” lakini hapa huenda maana yake ni “kwa kila namna.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mfano” au “kigezo” cha matendo mema.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika mafundisho” au “katika fundisho.”
    reason: lexical_alternative
  - marker: d
    text: Au, “kutoharibika,” “usafi,” au “kutokuwa na upotovu.” Neno linaweza kueleza ubora wa mafundisho, wa mfundishaji, au yote mawili.
    reason: lexical_alternative
  - marker: e
    text: Au, “uzito unaostahili heshima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ πάντα
  choice: Kwa kila namna
  rationale: Kirai hiki kinatumika kama kielezi kinachoonyesha upana wa mwenendo wa Tito. ‘Kwa kila namna’ ni Kiswahili cha kawaida kinachohifadhi wazo la ukamilifu wa namna mbalimbali bila kukifanya kirai hiki kiwe mada ya mambo yote.
- source_word: σεαυτὸν παρεχόμενος
  choice: jionyeshe
  rationale: Kitenzi cha kujirejelea kinaonyesha kwamba Tito anapaswa kujidhihirisha mwenyewe kwa mwenendo wake. ‘Jionyeshe’ ni cha asili na huhifadhi nguvu ya kujirejelea.
- source_word: τύπον
  choice: kielelezo
  rationale: Katika muktadha huu wa maadili, neno hili linamaanisha mfano unaostahili kuigwa. ‘Kielelezo’ linaonyesha wazi mfano au kigezo cha kufuatwa.
- source_word: καλῶν ἔργων
  choice: cha matendo mema
  rationale: Hili ni tamko la moja kwa moja linalofafanua aina ya kielelezo kinachokusudiwa, bila kuongeza maana ya kimadhehebu.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: katika mafundisho yako
  rationale: Muktadha unamhusu Tito katika kazi yake ya kufundisha. Kivumishi ‘yako’ kinaweka rejeo hilo wazi kwa Kiswahili cha asili, huku tanbihi ikihifadhi uwezekano wa tafsiri rasmi zaidi.
- source_word: ἀφθορίαν
  choice: uadilifu
  rationale: Neno la Kigiriki lina wazo la kutoharibika au kutokuwa na upotovu. Katika muktadha wa mafundisho, ‘uadilifu’ ni la asili na pana vya kutosha kuonyesha usafi na kutopotoka bila kulazimisha maana moja finyu.
- source_word: σεμνότητα
  choice: staha
  rationale: Neno hili linaonyesha uzito wa tabia unaostahili heshima. ‘Staha’ ni Kiswahili cha sasa na chenye hadhi, huku tanbihi ikitaja ‘uzito’ kama uwezekano mwingine.
theological_decisions:
- issue: Iwapo διδασκαλία litafsiriwe kwa istilahi ya kikanisa
  choice: mafundisho yako
  alternative: fundisho; mafundisho
  rationale: ‘Mafundisho’ linaeleweka kwa urahisi na linaweza kujumuisha tendo na yaliyomo katika kufundisha bila kulifinya kuwa mfumo rasmi wa mafundisho ya kidini.
- issue: Jinsi ya kueleza ἀφθορίαν katika uhusiano na mafundisho
  choice: uadilifu
  alternative: kutoharibika; usafi; kutokuwa na upotovu
  rationale: ‘Uadilifu’ huhifadhi wazo la mafundisho yasiyoharibiwa na mwenendo mwaminifu, lakini tanbihi inadumisha upana wa neno la asili badala ya kuamua kimya-kimya kama linahusu hasa maadili, maudhui ya mafundisho, au yote mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri ‘jionyeshe’ na ‘uwe na’ unaunganisha vipashio kwa mtiririko wa asili wa Kiswahili, huku alama ya nuktamkato ikihifadhi mgawanyo wa sentensi ya Kigiriki. ‘Uadilifu’ limetumiwa badala ya neno gumu na lisilo la kawaida ‘kutoharibika,’ huku tanbihi ikihifadhi nguvu na utata wa neno la asili.
