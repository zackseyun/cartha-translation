- from: Lakini wewe, sema mambo yanayofaa mafundisho yenye uzima.[a]
  to: Lakini wewe, sema yale yanayofaa kwa mafundisho yaliyo sahihi.[a]
  rationale: The revision preserves the explicit contrast (“Lakini wewe”), the broad command to speak, and the plural content (“yale”). It supplies the natural Swahili connector “kwa” and renders the Greek idiom of healthy/sound teaching with the clear primary reading “mafundisho yaliyo sahihi.” The footnote retains the health metaphor as a lexical alternative.
