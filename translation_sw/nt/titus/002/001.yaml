review_pass:
  verdict: revise
  source_fidelity: The contrast in Σὺ δέ and the imperative λάλει are represented well. However, “mafundisho yenye uzima” normally suggests life-giving or living teaching rather than teaching that is healthy/sound, and the construction “yanayofaa mafundisho” lacks the needed connector for the intended relation.
  naturalness: “Lakini wewe, sema” is natural Standard East African Swahili. “Yale yanayofaa kwa mafundisho yaliyo sahihi” is grammatically complete, clear, and suitably direct.
  terminology: “Mafundisho yaliyo sahihi” accurately communicates the contextual force of ὑγιαινούσῃ διδασκαλίᾳ without implying that the teachings themselves are alive. The alternative “mafundisho yenye afya” retains the Greek health metaphor and is appropriately placed in a footnote.
  issues:
  - severity: medium
    issue: “Mafundisho yenye uzima” is not an adequately precise rendering of ὑγιαινούσῃ διδασκαλίᾳ.
    rationale: The Greek metaphor denotes healthy, sound teaching. In contemporary Swahili, “yenye uzima” more readily means living or life-giving, which shifts the metaphor and may alter the sense.
  - severity: medium
    issue: The phrase “mambo yanayofaa mafundisho” is grammatically incomplete/awkward.
    rationale: The relationship expressed by πρέπει with the dative is naturally conveyed with “kwa” or with a verb such as “yanayopatana na.”
  revised_text: Lakini wewe, sema yale yanayofaa kwa mafundisho yaliyo sahihi.[a]
  revised_footnotes:
  - marker: a
    text: Au “mafundisho yenye afya.”
    reason: lexical_alternative
