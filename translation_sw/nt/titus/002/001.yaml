  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: sw
  text: Lakini wewe, sema yale yanayofaa kwa mafundisho yaliyo sahihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafundisho yenye afya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Lakini wewe
  rationale: Kiwakilishi kilichotajwa wazi pamoja na δέ kinaonyesha tofauti kati ya Tito na walimu wa uongo waliotangulia kutajwa. “Lakini wewe” huleta tofauti hiyo kwa Kiswahili cha kawaida bila kuzidisha msisitizo.
- source_word: λάλει
  choice: sema
  rationale: Kitenzi kina maana pana ya kusema au kunena. “Sema” huhifadhi agizo bila kulifinya liwe mafundisho rasmi pekee.
- source_word: ἃ
  choice: mambo
  rationale: Kiwakilishi cha uhusiano cha wingi kisicho na jinsia kinarejelea yale ambayo Tito anapaswa kusema. “Mambo” hudumisha dhana ya wingi kwa lugha ya kawaida.
- source_word: πρέπει
  choice: yanayofaa
  rationale: Neno linaeleza yanayostahili au yanayolingana kwa kufaa. “Yanayofaa” ni la asili na hudumisha wazo la ufaafu.
- source_word: ὑγιαινούσῃ
  choice: yenye uzima
  rationale: Neno hutumia sitiari ya afya kueleza hali ya mafundisho yaliyo sahihi na yenye manufaa. “Yenye uzima” huhifadhi sitiari hiyo kwa Kiswahili kinachoeleweka.
- source_word: διδασκαλίᾳ
  choice: mafundisho
  rationale: Neno linaweza kumaanisha tendo au yaliyomo katika kufundisha. “Mafundisho” ni neno la kawaida linaloweza kubeba pande zote mbili.
theological_decisions:
- issue: Tafsiri ya τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: mafundisho yenye uzima
  alternative: mafundisho sahihi
  rationale: “Mafundisho yenye uzima” huhifadhi sitiari ya Kigiriki ya afya bila kuamua kimya kimya kwamba neno linamaanisha tu usahihi wa kimafundisho. Tanbihi inatoa tafsiri ya wazi zaidi ya maana inayokusudiwa katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa moja kwa moja kama Kigiriki, huku tofauti inayomhusu Tito na sitiari ya afya vikihifadhiwa.
