id: TIT.2.14
reference: Titus 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: sw
  text: ambaye alijitoa mwenyewe kwa ajili yetu, ili atukomboe kutoka katika kila uasi wa sheria na ajisafishie watu walio mali yake mwenyewe,[a] wenye bidii katika matendo mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wake wa thamani” au “watu wa pekee.” Kigiriki kinasisitiza watu wanaomilikiwa naye kwa namna ya pekee, kwa mwangwi wa lugha ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: alijitoa mwenyewe
  rationale: Kitenzi hiki kinaonyesha kujitoa kwa hiari. ‘Alijitoa mwenyewe’ ni Kiswahili cha kawaida kinachohifadhi msisitizo wa kiwakilishi rejeshi.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Usemi huu unahifadhi maana pana ya kutenda kwa faida yetu au kwa niaba yetu bila kuamua kwa tafsiri hii pekee mtazamo maalumu wa upatanisho.
- source_word: ἵνα λυτρώσηται
  choice: ili atukomboe
  rationale: ‘Kukomboa’ huhifadhi wazo la kuachilia au kuokoa kwa gharama na pia mwangwi wake wa kitheolojia.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: kutoka katika kila uasi wa sheria
  rationale: ‘Uasi wa sheria’ ni mahususi kuliko ‘uovu’ na huwasilisha ἀνομία kama hali au mwenendo wa kutotii sheria; ‘kila’ huhifadhi upeo wa πάσης.
- source_word: καθαρίσῃ ἑαυτῷ
  choice: ajitakasee
  rationale: Muundo huu wa Kiswahili unaunganisha kutakasa na wazo la kufanya hivyo kwa ajili yake mwenyewe, kama inavyoonyesha ἑαυτῷ.
- source_word: λαὸν περιούσιον
  choice: watu walio mali yake mwenyewe
  rationale: Huhifadhi maana ya watu wanaomilikiwa naye kwa namna ya pekee na mwangwi wa lugha ya agano, bila kuishia tu kwenye sifa pana ya kuwa ‘maalumu.’
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: wenye bidii katika matendo mema
  rationale: ‘Wenye bidii’ ni usemi wa sasa na wa kawaida unaoonyesha hamu na kujitoa kwa dhati kufanya matendo mema.
theological_decisions:
- issue: Maana ya ὑπὲρ ἡμῶν katika kujitoa kwa Kristo
  choice: kwa ajili yetu
  alternative: kwa niaba yetu; badala yetu
  rationale: ‘Kwa ajili yetu’ huacha wazi upana wa maana ya kutenda kwa manufaa yetu na uwezekano wa maana ya uwakilishi, bila kulazimisha aya hii peke yake kueleza mfumo mmoja mahususi wa upatanisho.
- issue: Mwangwi wa agano katika λαὸν περιούσιον
  choice: watu walio mali yake mwenyewe
  alternative: watu wake wa thamani; watu wa pekee
  rationale: Tafsiri hii inatanguliza wazo la kuwa mali yake kwa namna maalumu, kama katika lugha ya agano ya Agano la Kale la Kigiriki, huku tanbihi ikionyesha tafsiri mbadala za asili zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘ajitakasee’ ni mfupi na wa asili, huku ‘watu walio mali yake mwenyewe’ ukihifadhi msisitizo wa umiliki wa kiagano. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachohusika.
