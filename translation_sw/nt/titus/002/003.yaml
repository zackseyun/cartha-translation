  to: Vivyo hivyo, wanawake wenye umri mkubwa wawe na mwenendo unaofaa utakatifu. Wasiwe wasingiziaji[a], wala waliotiishwa na divai nyingi[b], na wawe walimu wa mambo mema.
  rationale: Marekebisho yanaboresha uelekeo wa maana ya ἱεροπρεπεῖς, kuchagua neno sahihi zaidi kwa διάβολοι, na kuondoa «bali» ili orodha ibaki sawa na sintaksia na mantiki ya chanzo. «Waliotiishwa» hudumisha kwa Kiswahili taswira ya hali ya kutiishwa inayotokana na kitenzi cha wakati timilifu cha kauli ya kupokea δεδουλωμένας.
