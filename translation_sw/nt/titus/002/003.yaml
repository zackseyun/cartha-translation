  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: sw
  text: Vivyo hivyo, wanawake wenye umri mkubwa wawe na mwenendo unaofaa utakatifu. Wasiwe wasingiziaji[a], wala waliotiishwa na divai nyingi[b], na wawe walimu wa mambo mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “washtaki wa uongo” au “waenezaji wa porojo zenye nia mbaya.” Neno la Kigiriki linahusiana na neno linalotafsiriwa mara nyingi “Ibilisi,” lakini hapa linamaanisha watu wanaowasingizia wengine.
    reason: lexical_alternative
  - marker: b
    text: Au “waraibu wa divai nyingi.” Kigiriki husema kwa maana halisi “waliotiishwa na divai nyingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: wanawake wenye umri mkubwa
  rationale: Hurejelea wanawake walioendelea kwa umri, sambamba na wanaume wenye umri mkubwa katika mstari uliotangulia. Usemi huu ni wa kawaida na wenye heshima katika Kiswahili cha sasa.
- source_word: ὡσαύτως
  choice: Vivyo hivyo
  rationale: Hudumisha uhusiano wa himizo hili na himizo lililotangulia.
- source_word: ἐν καταστήματι
  choice: wawe na mwenendo
  rationale: Kirai hiki huhusu tabia au namna ya mtu kujionyesha kwa nje; “mwenendo” ni neno la kawaida na linalofaa katika muktadha wa maadili.
- source_word: ἱεροπρεπεῖς
  choice: unaostahili utakatifu
  rationale: Kivumishi hiki hueleza jambo linalofaa kwa yaliyo matakatifu. Tafsiri hii inahifadhi dhana hiyo bila kuibana kuwa heshima ya kijamii pekee.
- source_word: μὴ διαβόλους
  choice: Wasiwe wachongezi
  rationale: Hapa διάβολος hurejelea watu wanaowasingizia au kuwachongea wengine, si Ibilisi. “Wachongezi” ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: wala watumwa wa divai nyingi
  rationale: Huhifadhi taswira halisi ya kutawaliwa kama mtumwa iliyomo katika kitenzi δουλόω, badala ya kuibadili moja kwa moja kuwa uraibu.
- source_word: καλοδιδασκάλους
  choice: wawe walimu wa mambo mema
  rationale: Neno ambatani linaeleza watu wanaofundisha yaliyo mema. Tafsiri hii inaonyesha wazi kuwa “mema” ni maudhui ya mafundisho, si sifa ya ustadi wa mwalimu.
theological_decisions:
- issue: Taswira ya utumwa katika onyo kuhusu divai
  choice: watumwa wa divai nyingi
  alternative: waraibu wa divai nyingi
  rationale: Kigiriki hutumia lugha ya kuwekwa utumwani ili kueleza kutawaliwa na divai. Kudumisha taswira hiyo kunahifadhi uzito wa usemi wa chanzo bila kuufasiri tu kwa istilahi ya kitabibu au kitabia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa baada ya himizo la kwanza ili isomeke kwa urahisi; “bali” huunganisha kwa kawaida makatazo na wajibu chanya bila kubadili mantiki ya orodha ya Kigiriki.
