review_pass:
  verdict: revise
  source_fidelity: 'Rasimu inafuata kwa karibu orodha ya sifa katika Kigiriki: wanawake wazee, mwenendo unaofaa utakatifu, kutokuwa wasingiziaji, kutotiishwa na divai nyingi, na kufundisha yaliyo mema. Hata hivyo, «unaostahili utakatifu» huelekeza maana kwa namna isiyo ya kawaida; «unaofaa utakatifu» huwasilisha ἱεροπρεπεῖς kwa usahihi zaidi. Pia «bali» hudokeza upinzani ambao hauko wazi katika orodha ya Kigiriki.'
  naturalness: Kiswahili kinarekebishwa ili kisomeke kwa urahisi na kwa usahihi wa kisarufi. «Waliotiishwa na divai nyingi» ni usemi wa kawaida zaidi kuliko «watumwa wa divai nyingi», huku ukidumisha taswira ya δουλόω. «Wasingiziaji» hueleza διάβολοι kwa usahihi zaidi kuliko «wachongezi», ambalo linaweza kumaanisha watoa taarifa au wasaliti.
  terminology: «Mwenendo unaofaa utakatifu» huhifadhi rejista ya kimaadili na ya heshima ya ἱεροπρεπεῖς. «Wasingiziaji» huhifadhi maana ya kashfa/singizio ya διάβολοι bila kumrejelea Ibilisi. Lugha ya kutiishwa inahifadhi taswira ya utumwa katika δεδουλωμένας.
  issues:
  - severity: medium
    issue: «Unaostahili utakatifu» si uundaji wa kawaida wala mwelekeo sahihi zaidi wa ἱεροπρεπεῖς.
    rationale: Kigiriki kinaeleza mwenendo unaofaa mambo matakatifu/utakatifu, si utakatifu unaostahiliwa na mwenendo. «Unaofaa utakatifu» husahihisha uhusiano huo.
  - severity: medium
    issue: «Wachongezi» ni pana na inaweza kueleweka kama watoa siri au wasaliti, badala ya wasemaji wa kashfa.
    rationale: διάβολοι katika muktadha huu humaanisha wasingiziaji au wasemaji wa kashfa. «Wasingiziaji» ni sahihi zaidi.
  - severity: low
    issue: «Bali» huongeza mkazo wa ulinganisho/kinyume ambao haujaonyeshwa katika orodha ya Kigiriki.
    rationale: Kiunganishi «na» huendeleza orodha ya sifa kwa uwazi bila kuongeza mantiki ya upinzani.
