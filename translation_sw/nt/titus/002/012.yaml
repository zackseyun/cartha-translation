  text: nayo hutufundisha[a] ili, baada ya kukataa kutomcha Mungu na tamaa za kidunia[b], tuishi kwa kujitawala, kwa haki, na kwa kumcha Mungu[c] katika enzi hii ya sasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutulea” au “hututia nidhamu”; neno la Kigiriki linahusu mafundisho yanayomjenga mtu na kuunda tabia yake.
    reason: lexical_alternative
  - marker: b
    text: Au, “shauku za kidunia.”
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki kina vielezi vitatu: “kwa kujitawala, kwa haki, na kwa kumcha Mungu,” yaani kuishi kwa kujizuia, kwa kutenda yaliyo sawa, na kwa uchaji kwa Mungu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: hutufundisha
  rationale: Kitenzi hiki kina maana ya kufundisha kwa namna inayomlea na kumjenga mtu kitabia. “Hutufundisha” ni ya kawaida na hueleweka, huku tanbihi ikihifadhi wazo pana la malezi na nidhamu.
- source_word: ἵνα
  choice: kwamba
  rationale: Baada ya “hutufundisha,” “kwamba” huanzisha kwa kawaida katika Kiswahili kusudi na maudhui ya mafundisho yanayofuata.
- source_word: ἀρνησάμενοι
  choice: baada ya kuikataa
  rationale: Kauli hii inaonyesha kukataa kwa dhati kunakotangulia maisha mapya. “Baada ya kuikataa” huhifadhi uhusiano huo wa wakati bila kulazimisha tafsiri ya kitendo cha mara moja tu.
- source_word: ἀσέβειαν
  choice: hali ya kutomcha Mungu
  rationale: Hii huonyesha mwenendo usio na heshima na uchaji kwa Mungu kwa lugha ya kawaida, bila kuifanya iwe dai la kwamba mtu haamini kuwapo kwa Mungu.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: tamaa za kidunia
  rationale: Huhifadhi maana ya tamaa zinazotawaliwa na mfumo na maadili ya ulimwengu; “tamaa” inaweza kujumuisha hamu kali au shauku mbaya.
- source_word: σωφρόνως
  choice: kwa kiasi
  rationale: Hueleza kuishi kwa kujitawala na kwa busara, mada muhimu katika Tito, kwa mtindo wa kawaida wa Kiswahili.
- source_word: δικαίως
  choice: kwa haki
  rationale: Huhifadhi umbo la kielezi na maana ya mwenendo unaolingana na yaliyo sawa.
- source_word: εὐσεβῶς
  choice: kwa kumcha Mungu
  rationale: Hueleza maisha ya uchaji na uelekeo kwa Mungu kwa lugha iliyo wazi kwa wasomaji wa kawaida.
- source_word: ζήσωμεν
  choice: tuishi
  rationale: Kiswahili tegemezi huwasilisha kwa kawaida kusudi la ἵνα bila kuongeza uhakika au amri ambayo haijawekwa wazi.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: katika enzi hii ya sasa
  rationale: “Enzi” huhifadhi wazo la kipindi au mpangilio wa sasa unaotofautishwa na enzi ijayo, badala ya kumaanisha wakati tu.
theological_decisions:
- issue: Uhusiano wa παιδεύουσα na neema iliyotajwa katika mstari uliotangulia
  choice: “nayo hutufundisha”
  alternative: “ikitufundisha”
  rationale: Kiambishi “-yo” kinaonyesha kwamba neema ndiyo inayofanya tendo hilo na hudumisha mwendelezo wa sentensi bila kurudia nomino ambayo haimo katika kipande kilichotolewa.
- issue: Utatu wa vielezi σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: “kwa kiasi, kwa haki, na kwa kumcha Mungu”
  alternative: “maisha ya kiasi, ya haki, na ya kumcha Mungu”
  rationale: Chanzo kina vielezi vitatu vinavyorekebisha “tuishi.” Kuvihifadhi kama virai vya kielezi kunatunza muundo na vipengele vitatu bila kubadili kuwa sifa za nomino.
- issue: Nguvu ya ἀρνησάμενοι
  choice: “baada ya kuikataa”
  alternative: “tukiikana”
  rationale: Uundaji huu unaonyesha tendo linalotangulia kitenzi kikuu, lakini haubainishi kimadhehebu namna au wakati maalumu wa kukataa huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vielezi umehifadhiwa kwa uwazi; “enzi hii ya sasa” inadumisha mwelekeo wa kieskatolojia wa αἰών. Alama zote za tanbihi zimewekwa mara moja katika maandishi.
