  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: sw
  text: wasiibe, bali waonyeshe uaminifu kamili[a], ili kwa kila jambo walipambe fundisho la Mungu Mwokozi wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiyunani linalotafsiriwa “uaminifu” mara nyingi pia humaanisha “imani”; hapa lina maana ya kuwa mwaminifu na mwenye kutegemeka kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: wasiibe
  rationale: Kitenzi hiki humaanisha kujichukulia mali ya mwingine. Katika muktadha wa watumwa na mabwana, “wasiibe” ni wazi, cha kawaida, na hakibani maana kwenye aina fulani tu ya wizi.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: waonyeshe uaminifu kamili
  rationale: Katika muktadha huu πίστις inaelekea kumaanisha uaminifu au kutegemeka katika mwenendo. “Uaminifu kamili” huonyesha nguvu ya πᾶσαν na sifa chanya ya ἀγαθήν kwa Kiswahili cha kawaida.
- source_word: κοσμῶσιν
  choice: walipambe
  rationale: “Walipambe” huhifadhi sitiari ya kufanya fundisho lionekane zuri na lenye heshima kwa mwenendo wao.
- source_word: διδασκαλίαν
  choice: fundisho
  rationale: “Fundisho” ni neno la kawaida na linaloeleweka, nalo linawakilisha διδασκαλία bila uzito wa kitaalamu usio wa lazima.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: la Mungu Mwokozi wetu
  rationale: Muundo huu huhifadhi kwa uwazi cheo kinachotolewa kwa Mungu katika kifungu hiki bila kuingiza utambulisho mwingine usiotajwa moja kwa moja hapa.
- source_word: ἐν πᾶσιν
  choice: kwa kila jambo
  rationale: Usemi huu wa asili katika Kiswahili huwasilisha upana wa mwenendo unaokusudiwa na kirai cha Kiyunani.
theological_decisions:
- issue: Maana ya πίστις katika muktadha wa kimaadili
  choice: uaminifu kamili
  alternative: imani njema kwa ukamilifu
  rationale: Ingawa πίστις mara nyingi hutafsiriwa “imani,” hapa mwenendo wa watumwa kwa mabwana wao unaelekeza zaidi kwenye uaminifu na kutegemeka. Tanbihi inahifadhi uhusiano wa neno hilo na “imani” bila kufanya maandishi makuu yasikike yasiyo ya asili.
- issue: Anayerejelewa na “Mungu Mwokozi wetu”
  choice: Mungu Mwokozi wetu
  alternative: Mungu wetu aliye Mwokozi
  rationale: Tafsiri inafuata moja kwa moja kirai cha Kiyunani na haitambulishi kifungu hiki waziwazi na Kristo, kwa kuwa mstari wenyewe unasema “Mungu Mwokozi wetu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka, huku sitiari ya “kulipamba fundisho” ikihifadhiwa.
