  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: sw
  text: Vivyo hivyo, wahimize wanaume vijana[a] wawe na kiasi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vijana wa kiume.” Kigiriki kinawarejelea hasa wanaume vijana, si vijana wote kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “wawe na busara” au “wawe na akili timamu.” Neno la Kigiriki linakazia uamuzi mzuri pamoja na kujizuia kwa nidhamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: wanaume vijana
  rationale: Nomino iliyodokezwa na kivumishi cha kulinganisha cha jinsia ya kiume, katika muktadha unaotaja makundi kwa umri na jinsia, inarejelea wanaume walio vijana; tafsiri haipanui maana kuwa vijana wote kwa ujumla.
- source_word: ὡσαύτως
  choice: Vivyo hivyo
  rationale: Inaunganisha agizo hili na maelekezo yanayotangulia na kudumisha mtiririko wa kulinganisha kwa Kiswahili cha kawaida.
- source_word: παρακάλει
  choice: wahimize
  rationale: Kitenzi cha amri cha wakati wa sasa kinamtaka Tito aendelee kuwasihi kwa msisitizo. ‘Wahimize’ ni cha asili na kina nguvu zaidi kuliko kuwaomba tu, bila kuwa cha kitaalamu kupita kiasi.
- source_word: σωφρονεῖν
  choice: wawe na kiasi
  rationale: Kauli hii huunganisha busara, uamuzi timamu, na kujizuia katika mwenendo. ‘Wawe na kiasi’ ni usemi mfupi, wa kawaida, na unaofaa katika muktadha wa maadili.
theological_decisions:
- issue: Rejeo la jinsia katika νεωτέρους
  choice: wanaume vijana
  alternative: vijana kwa ujumla
  rationale: Muundo wa karibu wa kifungu unayataja makundi tofauti kwa umri na jinsia. Tafsiri hii inadumisha rejeo mahususi la kiume bila kulifanya liwahusu vijana wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wanaume vijana’ huweka wazi jinsia ya kundi huku ‘wawe na kiasi’ ikibeba upana wa maana ya busara na kujitawala.
