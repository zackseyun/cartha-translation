  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: sw
  text: Mmoja wao, nabii wao wenyewe, alisema, “Wakrete ni waongo siku zote, wanyama waovu, walafi wavivu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “matumbo mavivu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Mmoja wao ... alisema
  rationale: Muundo huu unahifadhi maana ya mtu mmoja kutoka miongoni mwao na ni wa kawaida katika Kiswahili.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: nabii wao wenyewe
  rationale: Unasisitiza kwamba nabii huyo alikuwa wa Wakrete wenyewe, kama ἴδιος inavyodokeza.
- source_word: Κρῆτες
  choice: Wakrete
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa Krete.
- source_word: ἀεὶ ψεῦσται
  choice: waongo siku zote
  rationale: Unatoa moja kwa moja maana ya kuwa waongo daima au kila wakati katika kauli hii ya kinukuu.
- source_word: κακὰ θηρία
  choice: wanyama waovu
  rationale: Unahifadhi taswira halisi ya wanyama pamoja na hukumu ya kimaadili iliyomo katika κακά.
- source_word: γαστέρες ἀργαί
  choice: walafi wavivu
  rationale: Kihalisi ni ‘matumbo mavivu’; katika muktadha ni lugha ya dharau kwa watu wanaopenda kula lakini hawataki kufanya kazi. ‘Walafi wavivu’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kauli kali ya jumla kuhusu kundi la kikabila iliyonukuliwa na Paulo
  choice: Kuandika nukuu hiyo moja kwa moja bila kupunguza ukali wake
  alternative: Kuifafanua kwa maneno laini ili kupunguza dharau yake
  rationale: Andiko linaitambulisha wazi kuwa kauli ya nabii wao wenyewe. Tafsiri inapaswa kuhifadhi ukali na mvutano wa kinukuu bila kuigeuza kuwa dai lililofafanuliwa kuhusu kila Mkret(e) katika kila wakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wanyama waovu’ huhifadhi sitiari ya Kigiriki, huku ‘walafi wavivu’ ikitoa maana yake kwa lugha inayoeleweka. Alama ya tanbihi imewekwa baada ya nukuu inayohusika.
