id: TIT.1.5
reference: Titus 1:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: sw
  text: Kwa sababu hii nilikuacha Krete, ili uweke sawa mambo yaliyobaki[a] na uteue wazee katika kila mji[b], kama nilivyokuagiza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yaliyokuwa yakikosekana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mji kwa mji.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kama nilivyokuamuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Kwa sababu hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya sababu inayotolewa na kifungu cha Kigiriki.
- source_word: ἀπέλιπόν
  choice: nilikuacha
  rationale: Huwasilisha kwa uwazi tendo la Paulo la kumwacha Tito Krete bila kuongeza msisitizo usio wa lazima wa ‘nyuma.’
- source_word: ἐν Κρήτῃ
  choice: Krete
  rationale: Jina la kisiwa limetolewa kwa tahajia inayotumiwa kwa kawaida katika Kiswahili.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: τὰ λείποντα
  choice: mambo yaliyobaki
  rationale: Huhifadhi wazo la mambo yaliyosalia kufanywa bila kuamua kimyakimya kwamba yalikuwa kasoro; maana mbadala ya ‘yaliyopungua’ imewekwa katika tanbihi.
- source_word: ἐπιδιορθώσῃ
  choice: uweke sawa
  rationale: Hujumuisha wazo la kurekebisha na kupanga vizuri mambo yaliyokuwa bado hayajakamilika, kwa lugha ya kawaida na yenye hadhi.
- source_word: καταστήσῃς
  choice: uteue
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwaweka watu rasmi katika jukumu fulani; ‘uteue’ ni cha asili na sahihi.
- source_word: κατὰ πόλιν
  choice: katika kila mji
  rationale: Huonyesha maana ya mgawanyo ya κατά pamoja na nomino ya umoja; yaani uteuzi ufanyike katika miji mbalimbali, mji kwa mji.
- source_word: πρεσβυτέρους
  choice: wazee
  rationale: Katika muktadha huu neno linarejelea viongozi wanaotambuliwa katika kanisa, si wanaume wenye umri mkubwa tu. ‘Wazee’ ni neno la kawaida la Kiswahili lisilolazimisha mfumo wa baadaye wa dhehebu fulani.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: kama nilivyokuagiza
  rationale: ‘Kuagiza’ hudumisha mamlaka ya maelekezo ya Paulo huku ikiepuka kufanya sauti iwe kali kuliko lazima; ‘kuamuru’ pia inawezekana.
theological_decisions:
- issue: Istilahi ya uongozi wa kanisa katika πρεσβυτέρους
  choice: wazee
  alternative: makasisi; wanaume wazee
  rationale: ‘Wazee’ huonyesha jukumu la uongozi linalokusudiwa katika muktadha bila kuingiza muundo maalumu wa madhehebu ya baadaye wala kulifanya neno lihusu umri pekee.
- issue: Nguvu ya διεταξάμην
  choice: nilivyokuagiza
  alternative: nilivyokuamuru; nilivyokuelekeza
  rationale: Kigiriki kinaweza kueleza agizo lenye mamlaka. ‘Nilivyokuagiza’ huhifadhi mamlaka hiyo kwa Kiswahili cha kawaida bila kuzidisha ukali wake.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka kwa wasomaji wa kawaida na chenye hadhi inayofaa maandiko. Muundo wa sentensi unaendeleza kusudi na matendo mawili yanayolingana: kuweka sawa na kuteua.'
