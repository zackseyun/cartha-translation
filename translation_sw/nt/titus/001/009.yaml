base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: sw
  text: akishikamana kwa uthabiti na neno la kuaminika linalopatana na mafundisho[a], ili aweze kuhimiza kwa mafundisho yenye afya na kuwakemea[b] wale wanaolipinga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akilishikilia kwa uthabiti neno aminifu kulingana na mafundisho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwathibitishia makosa wale wanaolipinga.” Kitenzi cha Kigiriki kinaweza kumaanisha kufichua au kuthibitisha kosa la mtu, na pia kumkemea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: akishikamana kwa uthabiti na
  rationale: Kitenzi hiki kinaonyesha kuendelea kulishikilia jambo kwa uimara. Kauli hii ni ya asili katika Kiswahili na inadumisha maana ya uaminifu thabiti.
- source_word: πιστοῦ λόγου
  choice: neno la kuaminika
  rationale: Hapa πιστός inaelekea kumaanisha kinachostahili kuaminiwa au kutegemewa. Neno λόγος limetafsiriwa ‘neno’ bila kulifanya istilahi nzito ya kitaalamu.
- source_word: κατὰ τὴν διδαχήν
  choice: linalopatana na mafundisho
  rationale: κατά pamoja na hali ya kushutumiwa huonyesha upatano na kiwango fulani. Muundo huu unaonyesha kwamba neno hilo linakubaliana na mafundisho yanayotambuliwa.
- source_word: παρακαλεῖν
  choice: kuhimiza
  rationale: Katika muktadha wa uongozi na ufundishaji, ‘kuhimiza’ huwasilisha wito wenye uzito wa kuwasaidia watu kuitikia mafundisho, si kuwafariji tu.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: kwa mafundisho yenye uzima
  rationale: ὑγιαίνω hutumia taswira ya afya au uzima kueleza mafundisho yaliyo sahihi na yenye manufaa. ‘Yenye uzima’ huhifadhi taswira hiyo kwa Kiswahili cha sasa.
- source_word: ἀντιλέγοντας
  choice: wale wanaolipinga
  rationale: Kishiriki hiki kinawahusu watu wanaosema kinyume cha neno au mafundisho yaliyotajwa. Kiambishi ‘-li-’ kinaonyesha rejeo hilo bila kuongeza maelezo marefu.
- source_word: ἐλέγχειν
  choice: kuwakemea
  rationale: Neno hili linaweza kujumuisha kufichua kosa, kuthibitisha kuwa mtu amekosea, na kumkaripia kwa kusudi la kurekebisha. ‘Kuwakemea’ huhifadhi nguvu ya marekebisho ya kichungaji; maana ya ‘kuwathibitishia makosa’ imehifadhiwa katika tanbihi.
- source_word: δυνατὸς ᾖ
  choice: aweze
  rationale: Kauli hii ya kawaida ya Kiswahili huonyesha uwezo unaokusudiwa na kishazi cha ἵνα.
theological_decisions:
- issue: Rejeo la ‘mafundisho’ na ‘neno la kuaminika’
  choice: Kauli kuu inayadokeza mafundisho ya Kikristo yanayotambuliwa na kukabidhiwa viongozi wa kanisa.
  alternative: Mafundisho ya jumla kuhusu mwenendo mwema.
  rationale: Kibainishi katika τὴν διδαχήν na matumizi ya πιστοῦ λόγου katika Nyaraka za Kichungaji yanaelekea kwenye hazina thabiti ya mafundisho. Tafsiri haiongezi istilahi za mifumo ya baadaye ya kiteolojia.
- issue: Maana ya ἐλέγχειν kuhusu wapinzani
  choice: kuwakemea
  alternative: kuwathibitishia makosa
  rationale: Muktadha unaunganisha mafundisho chanya na kuwakabili wanaopinga. ‘Kuwakemea’ huhifadhi upande wa marekebisho, huku tanbihi ikihifadhi uwezekano wa maana ya kuwakanusha kwa hoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha uhusiano kati ya kushikamana na neno, uwezo wa kuhimiza, na wajibu wa kuwakabili wapinzani. ‘Mafundisho yenye uzima’ huhifadhi taswira ya Kigiriki ya afya bila kutumia jargon nzito ya kidhehebu.
