  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: sw
  text: katika tumaini la uzima wa milele, ambao Mungu asiye kusema uongo aliuahidi kabla ya zama kuanza[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kabla ya wakati kuanza.” Kigiriki kinasema kihalisi, “kabla ya nyakati za milele” au “kabla ya zama za milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: katika tumaini
  rationale: Kirai hiki ni cha asili katika Kiswahili na kinaonyesha kwamba utume unaotajwa katika muktadha unahusiana na tumaini hili, bila kulazimisha maana ya sababu au msingi pekee.
- source_word: ζωῆς αἰωνίου
  choice: la uzima wa milele
  rationale: Hii inaonyesha kwamba uzima wa milele ndio kitu kinachotumainiwa, huku ikihifadhi lugha ya kawaida ya Agano Jipya.
- source_word: ἣν
  choice: ambao
  rationale: Kiwakilishi hiki kinarejelea moja kwa moja 'uzima wa milele,' nomino ya ngeli ya M–MI katika Kiswahili, badala ya kurejelea 'tumaini.'
- source_word: ἐπηγγείλατο
  choice: aliuahidi
  rationale: Kitenzi hiki kinatoa maana ya ahadi kwa uwazi na kiambishi 'u' kinaonyesha kuwa kilichoahidiwa ni uzima wa milele.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: Mungu asiye kusema uongo
  rationale: Tafsiri hii ni ya kawaida na yenye heshima, na haiongezi dai lenye nguvu zaidi la kwamba Mungu 'hawezi' kusema uongo.
- source_word: πρὸ χρόνων αἰωνίων
  choice: kabla ya nyakati za kale
  rationale: Neno 'nyakati' linawakilisha χρόνων, na 'za kale' linafikisha nguvu ya αἰωνίων katika kirai hiki bila kuamua kwa uhakika kwamba Kigiriki kinasema 'kabla ya wakati kuanza.'
theological_decisions:
- issue: Kirai cha wakati πρὸ χρόνων αἰωνίων na ahadi ya Mungu
  choice: kabla ya nyakati za kale
  alternative: kabla ya wakati kuanza; kabla ya zama kuanza
  rationale: Tafsiri kuu inadumisha namna isiyo ya kawaida ya kirai cha Kigiriki na dai lake kwamba ahadi hiyo ilitangulia nyakati za kihistoria, bila kubainisha ahadi hiyo ilitolewa kwa nani au jinsi ilivyohusiana na kusudi la Mungu la kabla ya historia.
- issue: Maelezo ya Mungu kama ἀψευδής
  choice: Mungu asiye kusema uongo
  alternative: Mungu asiyeweza kusema uongo; Mungu wa kweli
  rationale: Chaguo hili linatafsiri sifa iliyotajwa moja kwa moja bila kuibadilisha kuwa kauli pana zaidi ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo umehifadhi uhusiano wa mstari huu na sentensi ndefu inayoanza katika mstari wa 1. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
