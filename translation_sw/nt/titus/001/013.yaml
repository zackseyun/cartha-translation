  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: sw
  text: Ushuhuda huu ni wa kweli. Kwa sababu hiyo, wakemee kwa ukali, ili wawe wazima katika imani[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kigiriki kinaweza kumaanisha wawe wazima katika imani yao, au wawe wazima katika imani ya Kikristo kama maudhui ya mambo yanayoaminiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: ushuhuda
  rationale: Neno hili linadumisha maana ya kauli ya ushahidi kuhusu Wakrete iliyonukuliwa katika mstari uliotangulia.
- source_word: ἀληθής
  choice: wa kweli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kivumishi kinachoeleza kwamba ushuhuda huo unalingana na hali halisi.
- source_word: δι’ ἣν αἰτίαν
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha hitimisho linalotokana na kauli iliyotangulia na kinasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: ἔλεγχε
  choice: wakemee
  rationale: Kitenzi hiki cha amri kinamtaka Tito awakabili na kuwaonya kwa kusahihisha makosa yao; “wakemee” kinahifadhi uzito huo kuliko “wasahihishe.”
- source_word: ἀποτόμως
  choice: kwa ukali
  rationale: Kirai hiki kinaonyesha ukali na uthabiti wa kukemea bila kudokeza adhabu ambayo haikutajwa.
- source_word: ὑγιαίνωσιν
  choice: wawe imara
  rationale: Kitenzi kina picha ya kuwa na afya, lakini hapa kimetumiwa kwa maana ya hali njema au thabiti ya kiroho na kimafundisho. “Wawe imara” ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: πίστει
  choice: imani
  rationale: Kiswahili “imani” kinaweza kurejelea hali ya kuamini au imani ya Kikristo kama mfumo wa mambo yanayoaminiwa, hivyo kinadumisha uwezekano wa maana zote mbili.
theological_decisions:
- issue: Maana ya ἐν τῇ πίστει
  choice: katika imani
  alternative: katika ile imani; katika imani yao
  rationale: Katika Nyaraka za Kichungaji, kirai hiki kinaweza kutaja imani ya Kikristo kama mafundisho yanayoaminiwa, lakini pia kinaweza kueleweka kuwa hali yao ya kuamini. Maandishi makuu ya Kiswahili yanadumisha utata huo, na tanbihi inaueleza wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa ukali” kinahifadhi nguvu ya agizo, huku “wawe imara” kikitoa kwa lugha ya kawaida maana ya sitiari ya afya. Alama ya tanbihi imewekwa baada ya “imani,” ambako utata unaoelezwa unatokea.
