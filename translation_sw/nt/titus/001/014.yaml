  text: wasiyazingatie hadithi za Kiyahudi wala amri za watu wanaoupa ukweli kisogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasijitolee kwa hadithi za Kiyahudi na amri za watu wanaoupa ukweli kisogo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: wasisikilize
  rationale: Kitenzi hiki kinaendeleza himizo la mstari uliotangulia na kueleza wasichopaswa kufanya. ‘Wasisikilize’ ni Kiswahili cha kawaida kinachoonyesha kuelekeza fikira na kukubali ushawishi wa jambo.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: hadithi za Kiyahudi
  rationale: μῦθος hapa ni simulizi iliyobuniwa au isiyo ya kweli; ‘hadithi’ ni neno la kawaida, huku ‘za Kiyahudi’ likihifadhi sifa ya asili au tabia yake bila kudokeza Wayahudi wote.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: amri za watu
  rationale: Hili linabaki karibu na muundo wa Kigiriki na linaonyesha kuwa maagizo hayo yametokana na wanadamu, bila kutumia lugha inayoweza kueleweka kuwa ya wanaume pekee.
- source_word: ἀποστρεφομένων
  choice: wanaoupa ... kisogo
  rationale: Tamathali hii ya kawaida huhifadhi picha ya kugeuka na kujitenga iliyomo katika kitenzi cha Kigiriki, badala ya kuifupisha kuwa ‘wanaoukataa’.
- source_word: τὴν ἀλήθειαν
  choice: ukweli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ἀλήθεια; haiongezi ufafanuzi kuwa ni injili ingawa muktadha unaweza kuhusisha maana hiyo.
theological_decisions:
- issue: Kirejewa cha kiambishi ἀποστρεφομένων
  choice: 'Kinaeleza ‘watu’: ‘amri za watu wanaoupa ukweli kisogo.’'
  alternative: Kinaweza kuhusishwa kwa upana zaidi na hadithi na amri kama mambo yatokanayo na watu wanaoupa ukweli kisogo.
  rationale: Upatanisho wa hali ya umilikishi na wingi, pamoja na ukaribu wa ἀνθρώπων, hufanya ‘watu’ kuwa kirejewa cha kawaida zaidi. Tafsiri haiongezi dai jingine la kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wanaoupa ukweli kisogo’ ni tamathali inayoeleweka kwa urahisi na kuhifadhi picha ya kugeuka. Kiunganishi ‘wala’ kinaonyesha kwamba mambo yote mawili yanakataliwa katika mwendelezo wa himizo la mstari uliotangulia.
