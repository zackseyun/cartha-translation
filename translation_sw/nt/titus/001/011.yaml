  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: sw
  text: Ni lazima wazuiwe kusema,[a] kwa maana wanavuruga kaya zote[b] kwa kufundisha mambo ambayo hawapaswi kufundisha, kwa ajili ya faida ya aibu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “vinywa vyao vifungwe.”
    reason: lexical_alternative
  - marker: b
    text: “Kaya zote” hapa yaelekea kumaanisha familia pamoja na watu wanaotegemea nyumba hizo, wala si majengo tu.
    reason: cultural_note
  - marker: c
    text: Au, “faida chafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: Ni lazima wazuiwe kusema
  rationale: Muundo huu unaonyesha ulazima wa kukomesha mafundisho yao. Unatoa maana ya nahau ya Kigiriki ya ‘kufunga kinywa’ bila kudokeza adhabu ya kimwili ambayo andiko halitaji.
- source_word: οἵτινες
  choice: kwa maana
  rationale: 'Kiwakilishi hiki hapa kina nguvu ya kutoa sababu: mwenendo wao unaofuata unaeleza kwa nini ni lazima wazuiwe kusema.'
- source_word: ὅλους οἴκους
  choice: kaya nzima
  rationale: οἶκος katika muktadha huu yaweza kumaanisha jamaa pamoja na watu wanaotegemea nyumba hiyo, si jengo peke yake. ‘Kaya’ ni neno la kawaida la Kiswahili linalowasilisha kitengo hicho cha kijamii.
- source_word: ἀνατρέπουσιν
  choice: wanavuruga
  rationale: Kitenzi kina maana ya kupindua, kuvuruga, au kuharibu utaratibu. ‘Wanavuruga’ huonyesha athari kubwa kwa kaya bila kulazimisha maana ya kuangamiza kabisa.
- source_word: διδάσκοντες
  choice: kwa kufundisha
  rationale: Kirai hiki kinaonyesha njia wanayotumia kuvuruga kaya.
- source_word: ἃ μὴ δεῖ
  choice: mambo yasiyowapasa
  rationale: Huhifadhi wazo la mambo ambayo hawapaswi kufundisha na hukaa kwa asili katika Kiswahili sanifu.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: kwa ajili ya faida ya aibu
  rationale: 'Huhifadhi hukumu ya kimaadili iliyo katika αἰσχρός: faida hiyo ni ya kudhalilisha au ya aibu, si faida tu iliyopatikana kwa njia ya kawaida.'
theological_decisions:
- issue: Aina ya hatua dhidi ya walimu wa uongo
  choice: Ni lazima wazuiwe kusema
  alternative: Ni lazima wafungwe vinywa
  rationale: Andiko linataka mafundisho yao yenye madhara yakomeshwe, lakini halitaji njia mahsusi ya kiraia, kimwili, au ya kinidhamu. Tafsiri hii huhifadhi nguvu ya ulazima bila kuingiza hatua isiyotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wazuiwe kusema’ ni wazi kwa msomaji wa kawaida; ‘kaya nzima’ huwasilisha maana ya kijamii ya οἶκος. Alama zote za tanbihi zimewekwa katika matini kwa mpangilio wa kawaida wa [a], [b], [c].
