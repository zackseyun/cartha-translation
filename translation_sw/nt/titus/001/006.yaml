base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: sw
  text: ikiwa mtu hana lawama, ni mume wa mke mmoja[b], ana watoto waaminifu[a], wasio na shtaka la ufisadi[c] wala waasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto waamini.” Neno la Kigiriki πιστά linaweza kumaanisha “waaminifu” au “waamini.”
    reason: alternative_reading
  - marker: b
    text: Au, “mwanamume wa mwanamke mmoja.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, mwenendo wa ovyo usio na kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: hana lawama
  rationale: Ni usemi wa kawaida na wenye heshima unaoonyesha kwamba hakuna msingi halali wa kumshitaki mtu, bila kudai kwamba hana dhambi kabisa.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: mume wa mke mmoja
  rationale: Hufuata kwa uwazi muundo wa Kigiriki na kuacha wazi maswali yanayobishaniwa kuhusu maana kamili ya sifa hii.
- source_word: τέκνα
  choice: watoto
  rationale: Ni neno la kawaida na la asili katika muktadha wa familia.
- source_word: πιστά
  choice: waaminifu
  rationale: Huhifadhi maana ya uaminifu na kutegemeka; maana nyingine inayowezekana ya 'waamini' imewekwa katika tanbihi.
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: hawashtakiwi kwa maisha ya ufisadi
  rationale: Huhifadhi wazo la shtaka katika κατηγορία na kueleza kwa Kiswahili cha kawaida mwenendo usio na kiasi wa ἀσωτία.
- source_word: ἀνυπότακτα
  choice: waasi
  rationale: Huonyesha kukataa kutii au kuwa chini ya utaratibu unaofaa, kwa neno linaloeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya πιστά katika τέκνα ἔχων πιστά
  choice: watoto waaminifu
  alternative: watoto waamini
  rationale: πιστά inaweza kumaanisha waaminifu au wanaoamini. Maandishi makuu yanatumia maana pana, huku tanbihi ikihifadhi uwezekano wa maana ya imani ya Kikristo.
- issue: Nguvu ya μιᾶς γυναικὸς ἀνήρ
  choice: mume wa mke mmoja
  alternative: mwanamume wa mwanamke mmoja
  rationale: Tafsiri ya wazi huzuia kuingiza hitimisho la kimadhehebu kuhusu hali ya ndoa, uaminifu wa kingono, au kuoa tena.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mtiririko wa orodha ya sifa, na utata halisi wa πιστά na μιᾶς γυναικὸς ἀνήρ umeachwa wazi.
