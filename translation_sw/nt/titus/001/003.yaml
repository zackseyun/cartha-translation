    text: 'Kishazi hiki kinaweza pia kuhusishwa na “neno lake”: “neno lake ... nililokabidhiwa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: alilifunua
  rationale: Kitenzi hiki kinaonyesha kwamba Mungu aliliweka wazi jambo lililokuwa halijadhihirishwa. “Alilifunua” ni Kiswahili cha sasa, cha kawaida, na kinadumisha wazo la ufunuo.
- source_word: καιροῖς ἰδίοις
  choice: kwa nyakati alizoziteua mwenyewe
  rationale: Kirai hiki kinarejelea nyakati zilizo chini ya mamlaka na mpango wa Mungu. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha nguvu ya ἰδίοις, ingawa maana halisi zaidi ni “kwa nyakati zake mwenyewe.”
- source_word: τὸν λόγον αὐτοῦ
  choice: neno lake
  rationale: λόγος hapa ni ujumbe wa Mungu, unaohusiana na ahadi iliyotajwa katika muktadha. “Neno lake” linadumisha istilahi pana ya chanzo bila kuibana iwe “injili” pekee.
- source_word: ἐν κηρύγματι
  choice: kwa njia ya tangazo
  rationale: ἐν hapa inaonyesha njia ambayo neno lilifunuliwa. “Tangazo” linaweza kueleweka kama ujumbe uliotangazwa, huku tanbihi ikihifadhi uwezekano wa tendo la kuhubiri.
- source_word: ὃ
  choice: nililokabidhiwa
  rationale: Kiwakilishi cha uhusiano kinaweza kurejelea kwa karibu zaidi “tangazo.” Muundo wa Kiswahili pia unaacha uwezekano wa kukihusisha na “neno,” kwa kuwa nomino zote mbili ziko katika ngeli ya LI-YA.
- source_word: ἐπιστεύθην
  choice: nililokabidhiwa
  rationale: Hapa πιστεύω katika hali ya kutendwa ina maana ya kukabidhiwa wajibu au kitu cha kusimamia, si kuamini. Tafsiri hii inaonyesha wazi kwamba Paulo alipewa amana hiyo.
- source_word: κατ’ ἐπιταγὴν
  choice: kulingana na amri
  rationale: κατά pamoja na ἐπιταγή huonyesha kwamba huduma hiyo ilitokana na na kupatana na agizo lenye mamlaka.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: ya Mungu Mwokozi wetu
  rationale: Muundo huu unamtaja Mungu kwa cheo “Mwokozi wetu,” kama ilivyo kawaida katika Nyaraka za Kichungaji, bila kuongeza alama ya kimadhehebu.
theological_decisions:
- issue: Mtendaji aliyedokezwa katika ἐφανέρωσεν na maana ya καιροῖς ἰδίοις
  choice: Mungu ndiye mtendaji aliyedokezwa; nyakati hizo ni alizoziteua mwenyewe.
  alternative: Tafsiri isiyo na mtendaji binafsi, kama “wakati ufaao ulipofika, neno lake lilifunuliwa.”
  rationale: Muktadha uliotangulia unamtaja Mungu kuwa ndiye aliyeahidi, kisha hapa anamdhihirisha neno lake. Tafsiri iliyochaguliwa inadumisha mwendelezo huo na maana ya umilikaji katika ἰδίοις.
- issue: Kirejelewa cha kiwakilishi ὃ
  choice: Kisintaksia kinarejelea kwa karibu zaidi “tangazo,” yaani tangazo ambalo Paulo alikabidhiwa.
  alternative: Kinaweza kurejelea “neno lake,” yaani neno ambalo Paulo alikabidhiwa.
  rationale: κήρυγμα ndicho kirejelewa cha karibu, na ἐπιστεύθην hutumika kwa kawaida kuhusu kitu kilichokabidhiwa kwa mtu. Hata hivyo, umbo la Kiswahili na tanbihi vinahifadhi uwezekano wa kukihusisha kiwakilishi hicho na “neno lake.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Tangazo” limetumiwa kwa maana ya ujumbe unaotangazwa; tanbihi inaeleza maana mbadala ya tendo la kuhubiri. Mpangilio wa sentensi unahifadhi muunganiko wake na mstari uliotangulia.
