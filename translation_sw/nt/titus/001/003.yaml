  text: lakini katika nyakati zake mwenyewe[a], alilifunua neno lake kwa njia ya tangazo[b] nililokabidhiwa[c], kulingana na amri ya Mungu Mwokozi wetu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kwa nyakati zinazofaa.” Kigiriki kihalisi: “katika nyakati zake mwenyewe”; yaelekea ni nyakati alizoweka Mungu.'
