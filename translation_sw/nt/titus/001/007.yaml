  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: sw
  text: Kwa maana mwangalizi[a] hana budi kuwa asiye na lawama, akiwa msimamizi wa Mungu; asiwe mwenye kufanya apendavyo, asiwe mwepesi wa hasira, asiwe mtu wa mvinyo, asiwe mpiga watu, wala asiwe mwenye kutafuta faida ya aibu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “askofu.” Neno la Kigiriki humaanisha mtu anayesimamia; “mwangalizi” huepuka kuingiza maana za baadaye za cheo cha kanisa ambazo huenda zikahusishwa na “askofu.”
    reason: alternative_reading
  - marker: b
    text: Au “mwenye kutafuta faida isiyo ya haki.” Kigiriki hukazia faida inayotafutwa kwa njia yenye aibu kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: lazima
  rationale: Huonyesha wazi ulazima na wajibu unaodaiwa na neno la Kigiriki.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Hudumisha uhusiano wa maelezo na mstari uliotangulia kwa Kiswahili cha kawaida.
- source_word: ἐπίσκοπον
  choice: mwangalizi
  rationale: Hutoa maana ya mtu anayesimamia bila kuingiza moja kwa moja cheo cha baadaye cha kikanisa.
- source_word: ἀνέγκλητον
  choice: asiwe na shtaka
  rationale: Hueleza kutokuwapo kwa shtaka halali dhidi yake bila kudai ukamilifu usio na kosa lolote.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: kwa kuwa ni msimamizi wa mali ya Mungu
  rationale: Hufafanua wajibu wa kuaminiwa na kuwajibika unaobebwa na οἰκονόμος; 'mali' hapa ni pana kuliko fedha pekee.
- source_word: αὐθάδη
  choice: mwenye kujipendeza
  rationale: Hunasa tabia ya kutawaliwa kwa kiburi na matakwa yake mwenyewe, si ukaidi peke yake.
- source_word: ὀργίλον
  choice: mwepesi wa hasira
  rationale: Huonyesha mwelekeo wa kukasirika upesi, wala si tukio moja tu la hasira.
- source_word: πάροινον
  choice: mlevi
  rationale: Ni neno la kawaida na linaloeleweka kwa mtu anayetawaliwa na matumizi ya mvinyo; katika Kiswahili linaweza kurejelea ulevi kwa ujumla.
- source_word: πλήκτην
  choice: mpenda vurugu
  rationale: Huonyesha mtu mwenye tabia ya kupiga au kutumia nguvu bila kutumia usemi usio wa kawaida wa 'mpigaji'.
- source_word: αἰσχροκερδῆ
  choice: mwenye tamaa ya faida ya aibu
  rationale: Hudumisha pamoja wazo la tamaa na ubaya wa kimaadili wa faida, ambao unaweza kuwa mpana kuliko udanganyifu wa kisheria.
theological_decisions:
- issue: Tafsiri ya ἐπίσκοπος katika muktadha wa uongozi wa kanisa
  choice: mwangalizi
  alternative: askofu
  rationale: ‘Mwangalizi’ hufuata maana ya msingi ya neno bila kuingiza miundo ya baadaye ya madhehebu au ngazi za uongozi ambazo mstari wenyewe hauzibainishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umehifadhiwa kwa mtiririko wa kawaida; alama zote za tanbihi [a] na [b] zimo katika matini kuu.
