  source_fidelity: Marekebisho yanahitajika ili kudumisha maana ya maneno muhimu ya Kigiriki. ὡς θεοῦ οἰκονόμον si sababu ('kwa kuwa') wala hasa msimamizi wa mali ya Mungu, bali nafasi yake kama msimamizi wa Mungu. πάροινον haipaswi kufanywa moja kwa moja 'mlevi,' kwa kuwa hueleza mtu mwenye tabia ya kuhusishwa na mvinyo/unywaji wa kupita kiasi. πλήκτην ni mtu anayepiga au hutumia ukatili, si kwa upana tu 'mpenda vurugu.'
