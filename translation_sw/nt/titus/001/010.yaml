  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: sw
  text: Kwa maana kuna watu wengi wasiotii, wanaosema mambo yasiyo na maana na wadanganyifu, hasa wale wa tohara[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale wa kundi la tohara” au “wale waliotoka katika tohara.” Huenda usemi huu unawahusu wapinzani Wayahudi au waliokuwa wakisisitiza tohara, lakini Kigiriki hakisemi hivyo kwa uwazi kamili.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa sababu ya maagizo yaliyotangulia, na ni kiunganishi cha kawaida na cha wazi katika Kiswahili.
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino katika muktadha; kuongeza “watu” hufanya sentensi iwe ya kawaida katika Kiswahili bila kuongeza maana mpya.
- source_word: ἀνυπότακτοι
  choice: wasiotii
  rationale: Neno hili linamaanisha watu wasiokubali kutii mamlaka inayowastahili; “wasiotii” ni wazi na la kawaida kuliko istilahi nzito zaidi.
- source_word: ματαιολόγοι
  choice: wanaosema mambo yasiyo na maana
  rationale: Huwataja watu ambao maneno yao ni matupu au hayana faida. Kauli hii ni ya asili na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: φρεναπάται
  choice: wadanganyifu
  rationale: Hutoa maana ya watu wanaowadanganya au kuwapotosha wengine; “wadanganyifu” ni neno fupi na la kawaida linalohifadhi hukumu hasi ya Kigiriki.
- source_word: μάλιστα
  choice: hasa
  rationale: Hulitilia mkazo kundi fulani ndani ya kundi kubwa lililotajwa.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: wale wa tohara
  rationale: Hufuata kwa uwazi usemi mfupi wa Kigiriki, “wale wa/kutoka katika tohara,” bila kuongeza neno “kundi” wala kuwataja moja kwa moja kuwa Wayahudi.
theological_decisions:
- issue: Wanaorejelewa na usemi “wale wa tohara”
  choice: Usemi umetafsiriwa kwa uwazi kama “wale wa tohara” bila kuwataja moja kwa moja kuwa Wayahudi au kundi la tohara.
  alternative: “wale wa kundi la tohara” au “wale waliotoka katika tohara”
  rationale: Huenda usemi huu unawahusu wapinzani Wayahudi au waliokuwa wakisisitiza tohara, lakini Kigiriki hakisemi hayo kwa uwazi kamili. Tafsiri kuu inadumisha ufupi na utata halisi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhiwa, na koma ya mwisho inadumisha mwendelezo wa sentensi katika mstari unaofuata.
