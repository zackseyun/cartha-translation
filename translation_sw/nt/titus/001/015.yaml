id: TIT.1.15
reference: Titus 1:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: sw
  text: Kwa walio safi[a], vitu vyote ni safi; lakini kwa wale waliotiwa unajisi na wasioamini, hakuna kitu kilicho safi. Bali akili zao pamoja na dhamiri zao zimetiwa unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “safi” katika mstari huu linaweza kumaanisha usafi wa kidini au wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: vitu vyote
  rationale: Nomino ya wingi isiyo na jinsia imetumiwa kwa maana pana. “Vitu vyote” huhifadhi upeo mpana na muundo wa kimethali wa sentensi.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: safi / walio safi
  rationale: “Safi” ni lugha ya kawaida na yenye heshima, na inaweza kubeba maana za usafi wa kidini na wa kimaadili bila kuamua moja pekee.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: kwa wale waliotiwa unajisi
  rationale: Kauli timilifu ya Kigiriki inaonyesha hali ya sasa iliyotokana na kutiwa unajisi. Usemi huu huhifadhi hali hiyo na ulinganifu wake na kitenzi cha mwisho.
- source_word: ἀπίστοις
  choice: wasioamini
  rationale: Katika muktadha huu neno linaelekea kumaanisha kutokuwa na imani, wala si hasa kukosa uaminifu.
- source_word: οὐδὲν καθαρόν
  choice: hakuna kitu kilicho safi
  rationale: Huhifadhi ulinganifu wa moja kwa moja na kishazi cha kwanza na kuendeleza uwanja uleule wa maana.
- source_word: ἀλλὰ
  choice: Badala yake
  rationale: 'Huonyesha kwa uwazi tofauti kali: tatizo halisi haliko katika vitu vya nje bali katika hali ya ndani ya watu hao.'
- source_word: μεμίανται
  choice: zimetiwa unajisi
  rationale: Kauli timilifu inasisitiza hali inayoendelea kutokana na uchafuzi wa awali; tafsiri hii pia inaunganisha kitenzi na “waliotiwa unajisi.”
- source_word: νοῦς
  choice: akili
  rationale: Ni neno la kawaida la Kiswahili kwa uwezo wa kufikiri na kutambua.
- source_word: συνείδησις
  choice: dhamiri
  rationale: Ni tafsiri ya kawaida ya uwezo wa ndani wa kutambua na kuhukumu yaliyo mema au mabaya.
- source_word: καὶ ... καὶ
  choice: akili zao na dhamiri zao zote
  rationale: “Zote” huonyesha kwamba viungo vyote viwili vya ndani vimeathiriwa, kama unavyosisitiza muundo wa Kigiriki.
theological_decisions:
- issue: Upeo wa lugha ya usafi
  choice: καθαρός imetafsiriwa “safi” kila inapotokea ili kuhifadhi maana za usafi wa kidini na wa kimaadili.
  alternative: Kutumia “isiyo najisi” au lugha nyingine inayosisitiza hasa usafi wa kidini.
  rationale: Muktadha unahusisha masharti ya usafi na kanuni za Kiyahudi, lakini kauli hiyo pia inaelekea kwenye hali ya ndani ya mtu. “Safi” huhifadhi upana na mvutano huo bila kuufanya uwe wa kiibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kimethali wa kishazi cha kwanza na ulinganifu wa maneno ya usafi na unajisi umehifadhiwa.
