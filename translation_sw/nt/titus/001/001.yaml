  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: sw
  text: Paulo, mtumwa wa Mungu na mtume wa Yesu Masihi, kwa ajili ya imani ya wateule wa Mungu[a] na ujuzi[b] wa kweli unaopatana na uchaji wa Mungu[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliochaguliwa na Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ujuzi kamili.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kweli inayoongoza kwenye uchaji wa Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili linaonyesha kuwa Paulo ni mali ya Mungu na yuko chini ya mamlaka yake kabisa; “mtumishi” lingepunguza uzito wa hali hiyo.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Hili ndilo neno la kawaida na sahihi katika Kiswahili kwa mtu aliyetumwa rasmi akiwa na mamlaka.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” linahifadhi maana ya Χριστός kama cheo cha Mpakwa Mafuta, huku likibaki la kawaida katika Kiswahili cha kibiblia.
- source_word: κατὰ
  choice: kwa ajili ya
  rationale: Katika muktadha huu linaeleza mwelekeo au kusudi la utume wa Paulo, bila kulazimisha maana finyu ya “kulingana na.”
- source_word: πίστιν
  choice: imani
  rationale: Hapa neno linaelekea kumaanisha mwitikio wa kumwamini Mungu unaohusishwa na wateule wake.
- source_word: ἐκλεκτῶν θεοῦ
  choice: wateule wa Mungu
  rationale: Usemi huu unahifadhi wazi tendo la Mungu la kuchagua bila kuingiza mfumo maalumu wa kimadhehebu.
- source_word: ἐπίγνωσιν
  choice: ujuzi
  rationale: “Ujuzi” ni wa kawaida na wa asili; uwezekano wa maana yenye mkazo zaidi, “ujuzi kamili,” umehifadhiwa katika tanbihi.
- source_word: ἀληθείας
  choice: kweli
  rationale: Katika Kiswahili “ujuzi wa kweli” huwasilisha kwa kawaida maarifa ya ile kweli inayokusudiwa, bila kuhitaji kibainishi tofauti.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: unaopatana na uchaji wa Mungu
  rationale: Hii inahifadhi uhusiano mpana unaoonyeshwa na κατά bila kuamua kimya kimya kwamba kweli hiyo ndiyo inayosababisha uchaji.
- source_word: εὐσέβειαν
  choice: uchaji wa Mungu
  rationale: Usemi huu ni wa wazi kwa wasomaji wa sasa na unaonyesha maisha ya heshima na kujitoa kwa Mungu.
theological_decisions:
- issue: Maana ya ἐκλεκτῶν θεοῦ
  choice: wateule wa Mungu
  alternative: waliochaguliwa na Mungu
  rationale: “Wateule” ni kifupi, cha kawaida, na kinahifadhi uchaguzi wa Mungu bila kufafanua zaidi ya maandishi.
- issue: Uhusiano wa κατὰ πίστιν ... καὶ ἐπίγνωσιν na utume wa Paulo
  choice: kwa ajili ya imani ... na ujuzi
  alternative: kulingana na imani ... na ujuzi
  rationale: Sintaksia ya Kigiriki imebanwa na inaweza kueleweka kwa zaidi ya njia moja. Tafsiri kuu inaonyesha mwelekeo wa huduma ya Paulo, huku uwezekano mwingine ukiendelea kutambuliwa.
- issue: Uhusiano wa kweli na εὐσέβεια
  choice: kweli unaopatana na uchaji wa Mungu
  alternative: kweli inayoongoza kwenye uchaji wa Mungu
  rationale: Tafsiri kuu haibadili uhusiano mpana wa κατά kuwa sababu ya moja kwa moja; maana ya matokeo inawezekana na imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Mtumwa” limehifadhiwa kwa uzito wa δοῦλος; “uchaji wa Mungu” limetumiwa badala ya “utauwa” ili kuwa wazi zaidi kwa msomaji wa kawaida.
