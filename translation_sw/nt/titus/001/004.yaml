lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: mwanangu wa kweli
  rationale: Katika salamu hii, usemi huo unaonyesha uhusiano halisi wa kiroho, si uzazi wa kimwili. Ingawa Kigiriki hakina kiwakilishi cha kumiliki, Kiswahili cha kawaida huhitaji ‘-angu’ ili uhusiano unaodokezwa na kauli hii ueleweke kwa urahisi.
- source_word: κατὰ κοινὴν πίστιν
  choice: kwa msingi wa imani tunayoshiriki
  rationale: ‘Kwa msingi wa’ linaonyesha uhusiano au msingi unaoletwa na κατά, huku ‘imani tunayoshiriki’ likihifadhi maana ya κοινήν bila kudokeza kwamba ni imani ya aina tofauti.
- source_word: χάρις καὶ εἰρήνη
  choice: Neema na amani
  rationale: Hizi ni istilahi za kawaida za baraka katika salamu za Paulo na zinawakilisha moja kwa moja χάρις na εἰρήνη.
- source_word: θεοῦ πατρὸς
  choice: Mungu Baba
  rationale: Kigiriki hakisemi ‘Baba yetu’ hapa; ‘Mungu Baba’ hudumisha usahihi huo.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: ‘Masihi’ hutafsiri maana ya cheo Χριστός badala ya kukinakili tu, na mpangilio wa maneno unafuata Kigiriki huku ukibaki wenye kueleweka katika Kiswahili.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: Mwokozi wetu
  rationale: Kirai hiki kinamtambulisha Masihi Yesu moja kwa moja kuwa Mwokozi wetu.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: ‘Masihi’ huhifadhi maana ya cheo cha Kigiriki, badala ya kutegemea umbo lililonakiliwa la ‘Kristo’.
- issue: Kirejeleo cha τοῦ σωτῆρος ἡμῶν
  choice: ‘Mwokozi wetu’ linamtambulisha Masihi Yesu
  alternative: Kirai hicho kingeweza kusikika kwa upana zaidi kana kwamba kinahusiana na vyanzo vyote viwili vya baraka
  rationale: Mpangilio wa Kigiriki na kibainishi τοῦ vinaunganisha kwa kawaida zaidi cheo hiki na Χριστοῦ Ἰησοῦ kilicho karibu nacho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mwanangu’ ni nahau asilia kwa uhusiano wa kiroho katika barua; ‘kwa msingi wa’ hufanya uhusiano wa κατά uwe wazi bila kuufanya kuwa wa kimwili.
