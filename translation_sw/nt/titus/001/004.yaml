  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: sw
  text: 'Kwa Tito, mwanangu wa kweli katika imani yetu ya pamoja[a]: Neema na amani kutoka kwa Mungu Baba na Masihi Yesu[b], Mwokozi wetu.'
  philosophy: optimal-equivalence
  footnotes:
