base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: sw
  text: Wanadai kwamba wanamjua Mungu[a], lakini kwa matendo yao wanamkana[b]. Wao ni wenye kuchukiza[c], wasiotii, na wasiofaa kwa tendo lolote jema[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanakiri kwamba wanamjua Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “lakini matendo yao yanaonyesha kuwa wanamkana.”
    reason: clarity_alternative
  - marker: c
    text: Au, “wa kuchukiza sana.”
    reason: lexical_alternative
  - marker: d
    text: Au, “waliokataliwa kwa kila tendo jema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογοῦσιν
  choice: Wanadai
  rationale: Katika muktadha huu, kauli yao ya kumjua Mungu inatofautishwa na matendo yao. “Wanadai” ni Kiswahili cha kawaida kinachoonyesha dai la wazi bila kudokeza kuwa ni la kweli.
- source_word: εἰδέναι
  choice: kwamba wanamjua
  rationale: Infinitivu hii inaeleza jambo wanalodai; “wanamjua” huhifadhi maana ya kuwa na ujuzi au uhusiano wa kumtambua Mungu.
- source_word: θεὸν
  choice: Mungu
  rationale: Ni yambwa ya εἰδέναι na hutafsiriwa moja kwa moja kwa neno la kawaida “Mungu.”
- source_word: τοῖς δὲ ἔργοις
  choice: lakini kwa matendo yao
  rationale: Dativu inaweza kueleza njia au eneo la udhihirisho. “Kwa matendo yao” huonyesha kwamba mwenendo wao ndio unaodhihirisha kumkana Mungu.
- source_word: ἀρνοῦνται
  choice: wanamkana
  rationale: “Kumkana” ni kitenzi cha kawaida na chenye nguvu kinachobeba yambwa Mungu kutoka kishazi cha kwanza.
- source_word: βδελυκτοὶ
  choice: wenye kuchukiza
  rationale: Huhifadhi ukali wa hukumu ya kimaadili huku ikiwa lugha ya sasa na inayoeleweka; haipunguzi maana kuwa kutopendeza tu.
- source_word: ἀπειθεῖς
  choice: wasiotii
  rationale: Katika muktadha wa maadili, neno hili linaonyesha kukataa kutii, si kutosadikishwa tu.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: kwa tendo lolote jema
  rationale: πρός hapa huonyesha kufaa au uwezo kuhusiana na kazi njema. Pamoja na ukanushi wa “wasiofaa,” Kiswahili cha kawaida hutumia “lolote” kwa maana ya kutofaa kwa tendo jema hata moja.
- source_word: ἀδόκιμοι
  choice: wasiofaa
  rationale: Neno hili huonyesha kushindwa kufikia kipimo kinachohitajika na hivyo kutokuwa na ufaafu kwa matendo mema.
theological_decisions:
- issue: Uhusiano kati ya dai la mdomo na kumkana Mungu kwa matendo
  choice: Wanasema kuwa wanamjua Mungu, lakini mwenendo wao unafanya kazi kama kumkana yeye mwenyewe.
  alternative: Kuchukulia kwamba wanakana kweli ya Mungu kwa ujumla, badala ya kumkana Mungu mwenyewe.
  rationale: “Mungu” ndiye yambwa katika kishazi cha kwanza, na kwa kawaida hubaki kuwa yambwa inayoeleweka ya “wanamkana.” Tafsiri haiongezi maelezo ya kimafundisho yasiyosemwa na maandishi.
- issue: Upeo wa πᾶν katika usemi hasi
  choice: “kwa tendo lolote jema,” yaani hawafai kwa tendo jema hata moja.
  alternative: “kwa kila tendo jema,” tafsiri iliyo karibu zaidi na mpangilio wa maneno ya Kigiriki.
  rationale: Katika Kiswahili, “wasiofaa kwa tendo lolote jema” huwasilisha kwa kawaida nguvu ya usemi hasi pamoja na πᾶν bila kubadili upeo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza uhusiano wa kimantiki wa Kigiriki. “Wanadai” na “wanamkana” huweka wazi mgongano kati ya kauli na mwenendo.
