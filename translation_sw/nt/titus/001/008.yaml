lexical_decisions:
- source_word: ἀλλὰ
  choice: bali
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya sifa mbaya zilizotajwa katika mstari uliotangulia na sifa njema zinazotakiwa hapa.
- source_word: φιλόξενον
  choice: mkarimu kwa wageni
  rationale: Neno hili humaanisha kuwapokea na kuwahudumia wageni kwa ukarimu. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: φιλάγαθον
  choice: mwenye kupenda mema
  rationale: Tafsiri hii inahifadhi wazi wazo la mtu anayependa yaliyo mema, badala ya kulifanya neno hili kuwa sifa ya jumla isiyo na kitu kinachopendwa.
- source_word: σώφρονα
  choice: mwenye busara
  rationale: Katika orodha hii neno linadokeza kuwa na fikira timamu, kiasi, na uamuzi mzuri. “Mwenye busara” ni ya asili katika Kiswahili na hailifanyi kuwa sawa kabisa na ἐγκρατῆ.
- source_word: δίκαιον
  choice: mwadilifu
  rationale: Hapa neno linaeleza unyoofu na haki katika mwenendo. “Mwadilifu” huwasilisha maana hiyo kwa lugha ya kawaida bila kuifanya iwe ya kimahakama tu.
- source_word: ὅσιον
  choice: mtakatifu
  rationale: Neno linahusu maisha yanayolingana na utauwa na yaliyo matakatifu. “Mtakatifu” inadumisha uzito wa kidini wa sifa hiyo, huku uwezekano wa “mcha Mungu” ukitajwa katika tanbihi.
- source_word: ἐγκρατῆ
  choice: mwenye kujitawala
  rationale: Neno hili linasisitiza kutawala tamaa na misukumo ya mtu mwenyewe. Tafsiri hii inalifanya litofautiane na σώφρονα, linalotafsiriwa “mwenye busara.”
theological_decisions:
- issue: Kutofautisha sifa zinazokaribiana σώφρονα na ἐγκρατῆ
  choice: Kutafsiri σώφρονα kuwa “mwenye busara” na ἐγκρατῆ kuwa “mwenye kujitawala”
  alternative: Kutafsiri kwa maneno yanayokaribiana zaidi, kama “mwenye kiasi” na “mwenye kujizuia”
  rationale: 'Maneno ya Kigiriki yana maana zinazokaribiana lakini si sawa kabisa: la kwanza linasisitiza fikira timamu na uamuzi wa kiasi, na la pili kutawala tamaa na misukumo. Tafsiri iliyochaguliwa inahifadhi tofauti hiyo bila kuongeza fundisho la dhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Orodha imewekwa kwa muundo unaorudiwa wa “mwenye” pale panapohitajika ili isomeke kwa urahisi. Tofauti ya σώφρονα na ἐγκρατῆ imehifadhiwa kwa “mwenye busara” na “mwenye kujitawala.”
