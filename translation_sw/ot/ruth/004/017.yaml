base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: sw
  text: Kisha wanawake jirani wakampa jina, wakisema, “Naomi amezaliwa mwana wa kiume[a].” Nao wakamwita Obedi. Alikuwa baba yake Yese, baba yake Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu, “Mwana wa kiume amezaliwa kwa Naomi.” Wanawake wanazungumzia kurejeshwa kwa familia ya Naomi kupitia mtoto wa Ruthu, si kwamba Naomi ndiye mama aliyemzaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: wanawake jirani
  rationale: Nomino ya kike katika wingi inawataja wanawake walioishi karibu; usemi huu ni wa kawaida katika Kiswahili na unahifadhi jinsia na ukaribu wao.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: wakampa jina
  rationale: Nahau hiyo kwa karibu ni ‘wakamwitia jina’; ‘wakampa jina’ ni Kiswahili cha kawaida kinachoonyesha tendo la kumpa mtoto jina huku kikihifadhi tofauti na kifungu kinachofuata kinachotaja jina lenyewe.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Hutambulisha moja kwa moja yaliyosemwa na wanawake.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: Naomi amezaliwa mwana
  rationale: Muundo huu wa Kiswahili unahifadhi kauli tendwa na Naomi kama mhusika anayepokea manufaa ya kuzaliwa kwa mtoto, bila kudai kwamba yeye ndiye mama aliyemzaa.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: Nao wakamwita Obedi
  rationale: Ni usemi wa kawaida wa Kiswahili wa kumpa mtu jina, na unalitaja jina waziwazi.
- source_word: עוֹבֵד
  choice: Obedi
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa kama ‘mtumishi’ au ‘anayehudumu’; ‘Obedi’ ni umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: אֲבִי
  choice: baba yake
  rationale: Nasaba ya karibu hapa inaunga mkono maana halisi ya baba, si maana pana ya babu au babu wa zamani.
- source_word: יִשַׁי
  choice: Yese
  rationale: Ni umbo la jina hili lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: דָוִד
  choice: Daudi
  rationale: Ni umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa Naomi na mtoto katika tangazo ‘Naomi amezaliwa mwana’
  choice: Kudumisha usemi unaomhusisha Naomi moja kwa moja katika maandishi bila kumtaja kuwa mama mzazi.
  alternative: ‘Naomi amepata mjukuu’ au ‘Naomi amepewa mwana.’
  rationale: Kiebrania kinawasilisha mtazamo wa wanawake jirani kuhusu kurejeshwa kwa ukoo na familia ya Naomi kupitia mtoto wa Ruthu. Kutafsiri ‘mjukuu’ kungeondoa mvutano wa kifasihi na kifamilia uliomo katika kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Naomi amezaliwa mwana’ umechaguliwa kwa makusudi ili kuhifadhi mtazamo na mvutano wa maandishi ya Kiebrania; tanbihi huzuia kueleweka vibaya kuwa Naomi ndiye mama mzazi.
