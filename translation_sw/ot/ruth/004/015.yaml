  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: sw
  text: Naye atakurejeshea uhai[a] na kukutunza katika uzee wako[b], kwa maana binti-mkwe wako, anayekupenda, amemzaa—yeye ambaye ni bora kwako kuliko wana saba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “atakurejeshea maisha yako.” Kiebrania: “mwenye kurejesha uhai/nafsi.”'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maana halisi husema “mvi zako,” yaani, uzee wako.
    reason: lexical_alternative
  - marker: c
    text: “Wana saba” hutumia idadi ambayo mara nyingi huonyesha utimilifu au ukamilifu. Maana yake ni kwamba Ruthu alikuwa wa thamani kubwa kwa Naomi kuliko baraka iliyotamaniwa ya kuwa na wana wengi.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Naye atakuwa
  rationale: Kauli hii katika muktadha inaeleza matokeo ya wakati ujao kuhusu mtoto; “atakuwa” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: mwenye kurudisha uhai
  rationale: מֵשִׁיב huonyesha kurudisha au kurejesha, na נֶפֶשׁ hapa ina maana halisi ya uhai/maisha, si lazima nafsi isiyo ya mwili. Kauli hii pia huhifadhi taswira ya Kiebrania.
- source_word: וּלְכַלְכֵּל
  choice: na mwenye kukutegemeza
  rationale: Kitenzi hiki huonyesha kutunza, kulisha, au kutoa mahitaji kwa kudumu. “Kukutegemeza” kinafaa kwa habari ya mahitaji ya Naomi uzeeni na kinaendana na muundo wa kirai kilichotangulia.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: katika uzee wako
  rationale: Neno שֵׂיבָה kwa msingi humaanisha mvi na kwa upana uzee. Kiswahili “katika uzee wako” huwasilisha maana ya nahau hiyo kwa uwazi.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu inayotegemeza kauli iliyotangulia.
- source_word: כַלָּתֵךְ
  choice: mkwe wako
  rationale: Katika muktadha ni Ruthu, mke wa mwana wa Naomi aliyefariki. “Mkwe” ni neno la kawaida la Kiswahili kwa uhusiano huu bila kuongeza maelezo yasiyomo katika mstari.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: anayekupenda
  rationale: Hali ya upendo uliothibitishwa inaendelea wakati wa kauli hii; wakati wa sasa huwasilisha uhusiano huo wa kudumu kwa kawaida.
- source_word: יְלָדַתּוּ
  choice: amemzaa
  rationale: Kiambishi cha nafsi ya kiume kinamrejelea mtoto aliyetajwa katika muktadha. Kiswahili hiki ni kifupi na hakiongezi nomino nyingine.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: yeye aliye bora kwako
  rationale: Muundo wenye מן una maana ya ulinganisho wa thamani au manufaa; “bora kwako” huhifadhi ulinganisho na upande wa uhusiano.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: kuliko wana saba
  rationale: Kiebrania kinataja wana wa kiume waziwazi, na saba hudokeza ukamilifu au wingi uliotimia. Tafsiri inadumisha jinsia na idadi ya chanzo.
theological_decisions:
- issue: Maana ya נֶפֶשׁ
  choice: uhai
  alternative: nafsi; maisha; mtu mwenyewe
  rationale: Muktadha unahusu kurejeshwa kwa maisha ya Naomi na kutunzwa kwake baadaye, si ufafanuzi wa kimaumbile kuhusu nafsi. “Uhai” huepuka kuingiza dhana ya baadaye isiyolazimishwa na mstari.
- issue: Ulinganisho wa מִשִּׁבְעָה בָּנִים
  choice: wana saba
  alternative: watoto saba
  rationale: Chanzo kinasema “wana” kwa kusudi na kinaakisi matarajio ya kijamii ya wakati huo kuhusu wana kama warithi na wategemezaji wa wazazi uzeeni. Jinsia ya neno haipaswi kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi bila kuwa kigumu. Muundo wa sambamba “mwenye kurudisha… na mwenye kukutegemeza” unahifadhi usawaziko wa Kiebrania. Neno “mkwe” limetumiwa kwa maana ya binti-mkwe kulingana na muktadha; hakuna ufafanuzi wa kimadhehebu ulioongezwa.
