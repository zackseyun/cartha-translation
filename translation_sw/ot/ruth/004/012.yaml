base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: sw
  text: Na nyumba yako[a] iwe kama nyumba ya Peresi, ambaye Tamari alimzalia Yuda, kwa uzao[b] ambao Yahweh atakupa kupitia kwa mwanamke huyu mchanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba” hapa inamaanisha pia jamaa, ukoo, au nasaba, si jengo la kuishi tu.
    reason: cultural_note
  - marker: b
    text: Kiebrania kinasema kihalisi “mbegu,” neno linalotumiwa kwa kawaida kumaanisha mtoto au wazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: na iwe
  rationale: Muundo huu wa Kiswahili unaonyesha ombi au baraka, sawasawa na nguvu ya hali ya kutakia katika Kiebrania.
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: nyumba yako / kama nyumba ya Peresi
  rationale: “Nyumba” huhifadhi sitiari ya Kiebrania huku katika muktadha ikimaanisha pia jamaa, ukoo, au nasaba.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: ambaye Tamari alimzalia Yuda
  rationale: Inafuata kwa karibu kishazi cha uhusiano na kitenzi cha kuzaa, na ni usemi wa kawaida wa Kiswahili katika muktadha wa nasaba.
- source_word: מִן הַזֶּרַע
  choice: kwa uzao
  rationale: זֶרַע ni “mbegu” kihalisi lakini hapa humaanisha mtoto au wazao; “uzao” ni wazi na huhifadhi maana ya kizazi. Kihusishi “kwa” kinaunganisha ukuaji wa nyumba na uzao bila kulazimisha maana ya kisababishi pekee.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: ambao Yahweh atakupa
  rationale: Huwasilisha moja kwa moja uzao kama zawadi inayotarajiwa kutoka kwa Mungu ndani ya baraka hii.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania linawakilishwa kama jina binafsi, Yahweh.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: kupitia kwa mwanamke huyu kijana
  rationale: “Mwanamke huyu kijana” huonyesha maana ya נַעֲרָה bila kutumia “msichana,” ambalo lingeweza kudokeza umri mdogo kupita kiasi; “kupitia kwa” huonyesha chanzo cha kimama kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya בֵּית katika baraka ya uzao
  choice: nyumba
  alternative: jamaa, familia, ukoo, au nasaba
  rationale: “Nyumba” hudumisha sitiari pana ya Kiebrania, inayoweza kujumuisha familia, ukoo, na nasaba bila kuifupisha kwa maana moja tu.
- issue: Uhusiano wa מִן הַזֶּרַע na baraka kuu
  choice: kwa uzao
  alternative: kutokana na uzao; kwa sababu ya uzao
  rationale: Kiebrania kinaweza kueleweka kwa maana ya chanzo au njia. “Kwa uzao” huhifadhi upana huo na huepuka kuongeza kwa uhakika maana ya kisababishi ambayo haijaelezwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “na iwe” unaendeleza sauti ya baraka; majina yametoholewa kama Peresi, Tamari, na Yuda.
