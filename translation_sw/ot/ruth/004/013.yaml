base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: sw
  text: Basi Boazi akamchukua Ruthi, naye akawa mke wake. Akamwingilia, na Yahwe akamjalia kushika mimba[a]; naye akazaa mwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe akampa mimba” au “Yahwe akamwezesha kupata mimba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Kitenzi לקח kimsingi ni ‘chukua.’ Katika muktadha huu kinahusu kumchukua mwanamke katika ndoa, na kishazi kinachofuata kinaeleza wazi kwamba Ruthi akawa mke wake.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: naye akawa mke wake
  rationale: Hii ni nahau inayoonyesha kuingia rasmi katika hali ya ndoa; tafsiri hii ni ya kawaida na huhifadhi mfululizo wa simulizi.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Akaingia kwake
  rationale: Nahau ya Kiebrania inarejelea muungano wa kingono kwa lugha ya staha. Tafsiri hii huhifadhi tasfida na ufupi wa chanzo bila kuongeza maelezo ya wazi zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: Yahwe akamjalia kushika mimba
  rationale: הֵרָיוֹן hurejelea kutungwa kwa mimba au mimba. ‘Akamjalia kushika mimba’ ni Kiswahili cha kawaida na cha heshima kinachohifadhi wazi kwamba Yahwe ndiye aliyempa uwezo huo.
- source_word: וַתֵּלֶד בֵּן
  choice: naye akazaa mwana
  rationale: Tafsiri hii ni fupi, ya kawaida katika simulizi, na inawakilisha moja kwa moja ילד pamoja na בן.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Utendaji wa Mungu katika kutungwa kwa mimba ya Ruthi
  choice: Yahwe akamjalia kushika mimba
  alternative: Yahwe akampa mimba
  rationale: Kiebrania kinamtaja Yahwe wazi kuwa mtoaji wa kutungwa kwa mimba. Tafsiri inahifadhi utendaji huo wa Mungu bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni mwepesi kueleweka, huku tasfida ya Kiebrania ‘akaingia kwake’ ikihifadhiwa. Alama ya tanbihi imewekwa kwenye kishazi kinachohusu kutungwa kwa mimba, ambako ndiko chaguo la kileksika linapotokea.
