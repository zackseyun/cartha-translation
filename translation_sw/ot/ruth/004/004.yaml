base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: sw
  text: 'Nami nikaona vema nikujulishe[a] hivi: ‘Linunue mbele ya watu walioketi hapa na mbele ya wazee wa watu wangu. Ikiwa utalikomboa, likomboe; lakini ikiwa yeye hatalikomboa[b], niambie, ili nijue, kwa maana hakuna mwingine wa kulikomboa isipokuwa wewe, nami ndiye ninayefuata baada yako.’ Naye akasema, ‘Mimi nitalikomboa.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, neno kwa neno, “nifunue sikio lako,” yaani, “nikujulishe.”
    reason: lexical_alternative
  - marker: b
    text: Maandishi ya Kiebrania yanasema “ikiwa yeye hatalikomboa.” Kwa kuzingatia muktadha, wengine huelewa maana kuwa “ikiwa hutalikomboa,” wakisawazisha mabadiliko kutoka nafsi ya pili kwenda nafsi ya tatu.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: nikujulishe
  rationale: Nahau hii, ambayo neno kwa neno ni ‘nifunue sikio lako,’ humaanisha kumjulisha mtu jambo. ‘Nikujulishe’ hutoa maana hiyo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: קְנֵה
  choice: linunue
  rationale: Katika muktadha huu wa mali na haki ya ukombozi, kitenzi kina maana ya kununua au kujipatia kisheria. ‘Linunue’ ni wazi na cha asili, huku muktadha ukionyesha kwamba ununuzi huo unahusiana na ukombozi wa mali.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: mbele ya watu walioketi hapa
  rationale: Kirai kinaonyesha tendo la wazi mbele ya mashahidi. ‘Hapa’ linaeleweka kutokana na mazingira ya mkutano langoni na hufanya Kiswahili kiwe cha asili.
- source_word: זִקְנֵי עַמִּי
  choice: wazee wa watu wangu
  rationale: Hawa ni viongozi wanaotambuliwa na jumuiya. Tafsiri hii inadumisha maana pana ya עַמִּי bila kuibana kuwa ukoo.
- source_word: תִּגְאַל ... גְּאָל
  choice: Ikiwa utalikomboa, likomboe
  rationale: Kurudiwa kwa mzizi גאל kumehifadhiwa ili kuonyesha msisitizo wa Kiebrania na wajibu au haki ya kifamilia ya kukomboa mali.
- source_word: וְאִם לֹא יִגְאַל
  choice: lakini ikiwa yeye hatalikomboa
  rationale: Maandishi ya Kimasora yana umbo la nafsi ya tatu umoja, ‘yeye hatalikomboa.’ Mabadiliko hayo ya ghafla kutoka nafsi ya pili yamehifadhiwa badala ya kusawazishwa kimya kimya.
- source_word: הַגִּידָה לִּי
  choice: niambie
  rationale: Hii ni amri ya moja kwa moja ambayo ‘niambie’ huiwasilisha kwa Kiswahili cha asili.
- source_word: אֵין זוּלָתְךָ לִגְאוֹל
  choice: hakuna mwingine wa kulikomboa isipokuwa wewe
  rationale: Tafsiri hii inaonyesha wazi upekee wa mtu huyo katika mpangilio wa haki ya ukombozi.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: nami ndiye ninayefuata baada yako
  rationale: Kirai kinaonyesha nafasi inayofuata katika mpangilio wa haki au wajibu wa kisheria, si kufuata kimwili tu.
- source_word: אָנֹכִי אֶגְאָל
  choice: Mimi nitalikomboa
  rationale: Kiwakilishi ‘Mimi’ kinahifadhi msisitizo wa אָנֹכִי, na kiambishi cha kitu kinafafanua mali inayozungumziwa.
theological_decisions:
- issue: Tafsiri ya גאל katika muktadha wa sheria ya kifamilia
  choice: komboa
  alternative: nunua tena; tekeleza wajibu wa mkombozi wa ukoo
  rationale: ‘Komboa’ hudumisha maana ya msingi ya kisheria na kifamilia pamoja na mwangwi mpana wa kibiblia, bila kuingiza maelezo marefu ya kiufafanuzi ndani ya mstari.
- issue: Mabadiliko kutoka nafsi ya pili kwenda nafsi ya tatu katika וְאִם לֹא יִגְאַל
  choice: ikiwa yeye hatalikomboa
  alternative: ikiwa hutalikomboa
  rationale: Maandishi ya Kimasora yana nafsi ya tatu. Tafsiri kuu inaihifadhi ili kutofuta mvutano wa kisarufi; usomaji laini wa kimuktadha umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Msamiati wa ‘kukomboa’ umehifadhiwa kwa uthabiti, huku ‘linunue’ ikitumika kwa קְנֵה ili kutofautisha ununuzi wenyewe na utekelezaji wa haki ya ukombozi. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja mahali zinapohusika.
