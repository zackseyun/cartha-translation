base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: sw
  text: 'Hapo zamani, katika Israeli kulikuwa na desturi hii kuhusu ukombozi na ubadilishanaji[a]: ili kuthibitisha jambo lolote[b], mtu alikuwa akivua kiatu chake na kumpa mwenzake; na hii ndiyo iliyokuwa uthibitisho[c] katika Israeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhamisho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuthibitisha kila shughuli.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ushuhuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: Hapo zamani
  rationale: Hueleza wakati uliopita kwa lugha ya kawaida na kuonyesha kwamba aya hii inafafanua desturi ya zamani.
- source_word: הַגְּאוּלָּה
  choice: ukombozi
  rationale: Neno hili linadumisha maana ya kukomboa au kununua tena katika mazingira ya wajibu na haki za ukoo.
- source_word: הַתְּמוּרָה
  choice: ubadilishanaji
  rationale: Linawakilisha kubadilisha au kuhamisha kitu bila kufafanua kupita kiasi aina kamili ya tendo la kisheria.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: ili kuthibitisha jambo lolote
  rationale: Linahifadhi upana wa כָּל דָּבָר na maana ya kuthibitisha au kuhalalisha jambo.
- source_word: שָׁלַף
  choice: alivua
  rationale: Kwa kiatu, 'kuvua' ndiyo kauli ya asili na ya kawaida katika Kiswahili, huku ikihifadhi tendo halisi.
- source_word: נַעֲלוֹ
  choice: kiatu chake
  rationale: Nַעַל ni kifaa cha mguuni; 'kiatu' ni neno la kawaida na linaloeleweka kwa urahisi katika Kiswahili sanifu.
- source_word: לְרֵעֵהוּ
  choice: mwenzake
  rationale: Huwasilisha maana ya mshirika au yule mtu mwingine katika shughuli hii bila kudokeza lazima jirani wa makazi.
- source_word: הַתְּעוּדָה
  choice: uthibitisho
  rationale: Katika muktadha huu neno linaonyesha tendo au ishara iliyothibitisha rasmi makubaliano; 'uthibitisho' ni ya kawaida kuliko istilahi nzito ya kisheria.
