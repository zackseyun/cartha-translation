  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: sw
  text: Kisha akachukua[a] wanaume kumi kutoka miongoni mwa wazee wa mji, akawaambia, “Ketini hapa.” Nao wakaketi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawateua wanaume kumi kutoka miongoni mwa wazee wa mji.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchukua kwa kusudi fulani; hapa yaelekea aliwateua wawe mashahidi katika shauri la kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: Maana ya msingi ya לקח ni ‘kuchukua.’ Katika muktadha huu inahusu kuwachukua au kuwateua wazee kwa kusudi la shughuli ya kisheria; tafsiri hii huhifadhi usemi wa Kiebrania, huku tanbihi ikieleza maana ya kimuktadha.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: wanaume kumi
  rationale: Kirai hiki kinawahusu wazi wanaume kumi waliokuwa washiriki katika kikao cha hadhara.
- source_word: מִזִּקְנֵי הָעִיר
  choice: miongoni mwa wazee wa mji
  rationale: ‘Miongoni mwa’ huhifadhi maana ya kuchaguliwa kutoka katika kundi la wazee, nao ‘wazee wa mji’ ni viongozi wa kiraia waliotambuliwa.
- source_word: וַיֹּאמֶר
  choice: kuwaambia
  rationale: Ingawa kitenzi chenyewe ni ‘akasema,’ katika Kiswahili cha kawaida muundo wenye shamirisho la watu wengi unaeleweka kwa urahisi kama ‘kuwaambia’ kabla ya kauli iliyonukuliwa.
- source_word: שְׁבוּ
  choice: Ketini
  rationale: Amri ya wingi ya ישב inawaagiza wanaume hao kuketi ili kushiriki kikaoni; ‘Ketini’ ni ya moja kwa moja na ya kawaida.
- source_word: פֹה
  choice: hapa
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya kielezi cha mahali פֹה.
- source_word: וַיֵּשֵׁבוּ
  choice: wakaketi
  rationale: Huhifadhi marudio ya mzizi ישב na kueleza mwitikio wao wa mara moja kwa amri hiyo.
