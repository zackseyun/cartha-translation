lexical_decisions:
- source_word: וְ
  choice: aka- / naye
  rationale: Kiunganishi kinaendeleza orodha ya ukoo. Katika Kiswahili, mfuatano wa matendo unaelezwa kwa kawaida kwa wakati wa -ka-, huku “naye” ikiunganisha kishazi cha pili kwa uwazi.
- source_word: עֹבֵד
  choice: Obedi
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Hifili ya ילד katika orodha ya ukoo humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni usemi mfupi, wa kawaida, na unaohifadhi maana ya ukoo wa kibaba.
- source_word: אֶת
  choice: '[halitafsiriwi kivyake]'
  rationale: Ni alama ya yambwa bainifu katika Kiebrania; kazi yake inaonyeshwa na kiambishi cha yambwa -m- katika “akamzaa.”
- source_word: יִשַׁי / יִשָׁי
  choice: Yese
  rationale: Hili ni umbo la jadi lililozoeleka kwa jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ni umbo la jadi na linalotambulika sana katika Kiswahili kwa jina דוד.
theological_decisions:
- issue: Uwasilishaji wa kitenzi cha ukoo
  choice: akamzaa
  alternative: akawa baba ya
  rationale: “Akamzaa” huhifadhi maana ya kibayolojia na kiukoo ya kitenzi cha Kiebrania bila kutumia lugha ya kizamani wala kuongeza dai la kiteolojia lisilomo katika andiko.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi, wenye heshima na wa kawaida kwa orodha ya ukoo. Majina yametumia maumbo ya kibiblia yaliyozoeleka: Obedi, Yese, na Daudi.'
