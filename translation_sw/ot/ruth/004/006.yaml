base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: sw
  text: Kisha yule mkombozi[a] akasema, “Siwezi kuikomboa kwa ajili yangu mwenyewe, nisije nikauharibu urithi wangu. Wewe mwenyewe jikombozee haki yangu ya ukombozi[b], kwa maana siwezi kuikomboa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mkombozi” hapa ni jamaa wa karibu aliyekuwa na haki ya kwanza kabla ya Boazi ya kukomboa mali ya ukoo.
    reason: cultural_note
  - marker: b
    text: Kiebrania kwa uhalisi zaidi ni “ukombozi wangu.” Hapa neno hilo linamaanisha haki au wajibu wa kisheria wa kukomboa mali na kuendeleza ukoo wa familia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: mkombozi
  rationale: Neno hili linamtaja mtu mwenye haki na wajibu wa kifamilia wa kukomboa mali. “Mkombozi” ni fupi na huhifadhi uhusiano wake na mzizi גאל; maelezo ya kifamilia yanafafanuliwa katika tanbihi.
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: kuikomboa / tumia haki yangu ya ukombozi / kuikomboa
  rationale: Maneno ya mzizi גאל yamewakilishwa kwa msamiati wa “komboa/ukombozi.” Katika amri, “tumia haki yangu ya ukombozi” huonyesha kwa Kiswahili cha kawaida kwamba Boazi anaachiwa haki ya kisheria ya kufanya ukombozi.
- source_word: לִי
  choice: kwa ajili yangu mwenyewe
  rationale: Huonyesha kwamba ukombozi ungefanywa kwa manufaa yake mwenyewe na ungeathiri mali yake.
- source_word: פֶּן
  choice: nisije
  rationale: Huwasilisha kwa kawaida hofu au matokeo yanayoepukwa.
- source_word: אַשְׁחִית
  choice: nikauharibu
  rationale: Katika muktadha huu humaanisha kuutia urithi katika hasara kubwa, si lazima kuuangamiza kabisa.
- source_word: נַחֲלָתִי
  choice: urithi wangu
  rationale: Hurejelea mali ya kurithi ya mtu huyo; tafsiri ya moja kwa moja ni wazi katika muktadha.
- source_word: לְךָ אַתָּה
  choice: wewe mwenyewe
  rationale: Huhifadhi mkazo wa kiwakilishi cha Kiebrania na kuonyesha kwamba Boazi ndiye achukue haki hiyo.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza maelezo yanayorudia sababu ya kukataa kwake.
