  text: Amminadab fathered Nahshon[a], and Nahshon fathered Salmah.
translation:
  language: sw
  text: Aminadabu akamzaa Nashoni, naye Nashoni akamzaa Salma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Salma; baadhi ya tafsiri za Kiingereza hutumia “Salmoni” kwa kupatanisha jina hili na nasaba sambamba.'
