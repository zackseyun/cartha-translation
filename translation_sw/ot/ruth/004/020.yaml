lexical_decisions:
- source_word: עַמִּינָדָב
  choice: Aminadabu
  rationale: Jina la mtu limetoholewa kwa tahajia inayotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika orodha ya vizazi, umbo la Hifili la ילד humaanisha kuwa baba wa mtu. “Akamzaa” ni usemi wa kawaida na wenye kueleweka katika nasaba za Kiswahili.
- source_word: אֶת
  choice: '[halitafsiriwi kama neno tofauti]'
  rationale: Ni kiashiria cha yambwa mahsusi katika Kiebrania; kazi yake inaonyeshwa na mpangilio wa maneno katika Kiswahili.
- source_word: נַחְשׁוֹן
  choice: Nashoni
  rationale: Jina la mtu limetoholewa katika umbo la kawaida la Kiswahili.
- source_word: וְ
  choice: naye
  rationale: Katika kishazi cha pili, kiunganishi hiki kinaunganisha hatua inayofuata ya nasaba; “naye” ni cha asili katika Kiswahili na hudumisha uhusiano huo bila kuongeza maana ya sababu.
- source_word: שַׂלְמָה
  choice: Salma
  rationale: Hili linawakilisha moja kwa moja umbo la jina la Kiebrania katika mstari huu, tofauti na umbo la kimapokeo “Salmoni” linalojulikana katika nasaba zinazolingana.
