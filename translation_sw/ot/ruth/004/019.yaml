  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: Hezroni
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili; kiunganishi cha Kiebrania kimewakilishwa na mtiririko wa simulizi kupitia “akamzaa” badala ya kuweka “na” mwanzoni mwa mstari.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hiphil ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida, na huhifadhi maana ya nasaba ya upande wa baba.
- source_word: אֶת
  choice: '[hakijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa mahsusi kisicho na neno linalolingana moja kwa moja katika Kiswahili; kazi yake inaonyeshwa na mpangilio wa sentensi.
- source_word: רָם
  choice: Ramu
  rationale: Jina la mtu limetoholewa katika umbo linalosomeka kwa urahisi kwa wasemaji wa Kiswahili.
- source_word: וְ/רָם
  choice: na Ramu
  rationale: Kiunganishi וְ kinaunganisha kishazi cha pili cha nasaba na kimetafsiriwa wazi kuwa “na”.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi kilichorudiwa kimetafsiriwa kwa namna ileile ili kudumisha ulinganifu wa nasaba.
- source_word: עַמִּינָדָב
  choice: Aminadabu
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida na linalotamkika kwa urahisi katika Kiswahili.
