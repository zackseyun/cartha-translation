base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: sw
  text: Boazi akaenda langoni,[a] akaketi huko. Mara yule mkombozi aliyemtaja Boazi alikuwa akipita. Boazi akamwambia, “Njoo kando, ukae hapa, ewe fulani.”[b] Naye akaja kando, akaketi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lango la mji lilikuwa mahali pa umma ambapo mashauri ya kisheria na shughuli za kiraia zilifanyika.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania: “Peloni Almoni,” nahau yenye maana kama “fulani” au “mtu wa fulani,” ikiacha jina la mtu huyo bila kutajwa kwa makusudi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: alipanda kwenda langoni
  rationale: Kitenzi עָלָה kina maana ya kupanda au kwenda juu; tafsiri hii inadumisha mwelekeo wa usemi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: הַשַּׁעַר
  choice: langoni
  rationale: Ni lango la mji, ambalo lilikuwa mahali pa shughuli za umma na mashauri ya kisheria; maelezo hayo yametolewa katika tanbihi.
- source_word: וְהִנֵּה
  choice: Mara
  rationale: Katika simulizi, הִנֵּה huvuta fikira kwenye tukio muhimu linalotokea ghafla. “Mara” ni ya asili katika Kiswahili na hudumisha uhai wa simulizi.
- source_word: הַגֹּאֵל
  choice: mkombozi
  rationale: גֹּאֵל ni jamaa mwenye haki au wajibu wa kukomboa mali au mtu. “Mkombozi” hudumisha neno kuu bila kuingiza ufafanuzi wote ndani ya mstari.
- source_word: עֹבֵר
  choice: alikuwa akipita
  rationale: Muundo wa kushiriki unaonyesha tendo lililokuwa likiendelea wakati Boazi alipomwona.
- source_word: אֲשֶׁר דִּבֶּר בֹּעַז
  choice: ambaye Boazi alikuwa amesema habari zake
  rationale: Kifungu kinamtambulisha kuwa mtu ambaye Boazi alikuwa amemtaja hapo awali.
- source_word: סוּרָה שְׁבָה פֹה
  choice: Geuka, uketi hapa
  rationale: “Geuka” hudumisha wazo la kuacha njia aliyokuwa akifuata, na “uketi hapa” ni mwaliko wa kawaida lakini wenye heshima kiasi.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: ewe fulani
  rationale: Nahau hii huficha jina kwa makusudi. “Ewe fulani” inafaa kwa kumwita mtu moja kwa moja bila kutaja jina lake.
- source_word: וַיָּסַר וַיֵּשֵׁב
  choice: akageuka, akaketi
  rationale: Tafsiri inarudia maneno ya amri ya Boazi, kama Kiebrania kinavyofanya, na kuonyesha kwamba mtu huyo alitii.
theological_decisions:
- issue: Maana ya kisheria na kifamilia ya גֹּאֵל
  choice: mkombozi
  alternative: jamaa-mkombozi
  rationale: “Mkombozi” ni tafsiri fupi na yenye ulinganifu wa kileksia; muktadha wa kitabu unaonyesha kuwa ni jamaa mwenye nafasi ya kisheria. “Jamaa-mkombozi” ingeweka ufafanuzi huo moja kwa moja lakini ingekuwa nzito na yenye kuelekeza zaidi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa urahisi. Kumbuka: alama ya tanbihi [b] lazima iwe baada ya “ewe fulani”; imeingizwa katika rasimu ya mwisho kama inavyotakiwa.'
