  text: וַ/יֹּ֧אמֶר הַ/גֹּאֵ֛ל לְ/בֹ֖עַז קְנֵה לָ֑/ךְ וַ/יִּשְׁלֹ֖ף נַעֲלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: sw
  text: Basi huyo mkombozi wa ukoo akamwambia Boazi, “Jinunulie mwenyewe.” Kisha akavua kiatu chake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kuvua kiatu kulikuwa ishara ya kimila ya kuthibitisha shughuli hii ya kisheria; linganisha Ruthu 4:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Basi ... akamwambia
  rationale: Waw ya mfululizo inaendeleza simulizi; “Basi” na umbo la “aka-” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַגֹּאֵל
  choice: huyo mkombozi wa ukoo
  rationale: Neno גֹּאֵל humaanisha jamaa wa karibu mwenye wajibu wa kisheria wa kukomboa mali au kuendeleza ukoo. “Mkombozi wa ukoo” ni wazi na linafaa katika muktadha huu.
- source_word: לְבֹעַז
  choice: akamwambia Boazi
  rationale: Kiambishi cha yambwa katika “akamwambia” kinawakilisha לְ, na jina בֹּעַז limetoholewa kwa umbo la Kiswahili “Boazi.”
- source_word: קְנֵה לָךְ
  choice: Jinunulie mwenyewe
  rationale: Amri קְנֵה pamoja na לָךְ inaonyesha kwamba Boazi achukue ununuzi huo kwa ajili yake mwenyewe; umbo la kujirejelea linaeleza maana hiyo kwa Kiswahili cha asili.
- source_word: וַיִּשְׁלֹף
  choice: Kisha akavua
  rationale: Kitenzi kinamaanisha kuchomoa au kuondoa; kuhusu kiatu, “kuvua” ndilo neno la kawaida na sahihi.
- source_word: נַעֲלוֹ
  choice: kiatu chake
  rationale: נַעַל ni vazi la mguuni, mara nyingi aina ya kiatu au kandambili ya kale. “Kiatu” ni neno pana, la kawaida, na haliongezi maelezo yasiyo wazi katika mstari wenyewe.
theological_decisions:
- issue: Maana ya הַגֹּאֵל kama jukumu la kifamilia na kisheria
  choice: mkombozi wa ukoo
  alternative: jamaa mwenye haki ya ukombozi
  rationale: Chaguo hili linahifadhi dhana ya ukombozi na uhusiano wa ukoo bila kuifanya kuwa fundisho maalumu la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa Maandiko. Jina “Boazi” limetumiwa kwa umbo lililozoeleka katika Kiswahili. Alama ya tanbihi imewekwa baada ya taarifa kuhusu kuvua kiatu, ambako maelezo hayo yanahusika moja kwa moja.
