  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
translation:
  language: sw
  text: Kisha Naomi akamchukua mtoto, akamweka mapajani mwake, akawa mlezi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mama mlezi”; neno la Kiebrania humaanisha mwanamke anayemtunza na kumlea mtoto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: akamchukua
  rationale: Kitenzi לקח katika mfululizo wa masimulizi kina maana ya moja kwa moja ya kumchukua; muktadha unaonyesha tendo la kumchukua mtoto.
- source_word: הַיֶּלֶד
  choice: mtoto
  rationale: יֶלֶד inaweza kumaanisha mtoto au mvulana; katika muktadha wa mtoto mchanga, “mtoto” ni ya asili na inafaa umri wake.
- source_word: וַתְּשִׁתֵהוּ
  choice: akamweka
  rationale: Kitenzi שׁית kina maana ya kuweka; “akamweka” ni Kiswahili cha kawaida na hakiongezi maelezo yasiyo katika chanzo.
- source_word: בְחֵיקָהּ
  choice: mapajani mwake
  rationale: חֵיק hurejelea eneo la kifua au mapaja ambako mtoto hushikwa; “mapajani mwake” ni wazi na ya kawaida katika Kiswahili cha kisasa.
- source_word: וַתְּהִי לוֹ
  choice: akawa ... wake
  rationale: Muundo היה + ל unaonyesha jukumu au uhusiano uliotokea; “akawa ... wake” unaueleza kwa Kiswahili cha kawaida.
- source_word: לְאֹמֶנֶת
  choice: mlezi
  rationale: אֹמֶנֶת humaanisha mwanamke anayemtunza na kumlea mtoto. “Mlezi” huepuka maana ya kitabibu ambayo “muuguzi” ingedokeza, huku ikihifadhi wazo kuu la utunzaji na malezi.
