base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: sw
  text: Ndipo wanawake wakamwambia Naomi, “Yahwe na abarikiwe, ambaye leo hakukuacha bila mkombozi[a][b]. Na jina lake lijulikane katika Israeli[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkombozi wa ukoo” au “mlinzi-mkombozi.” Neno la Kiebrania linamaanisha jamaa wa karibu mwenye wajibu wa kifamilia na kisheria wa kuilinda na kuirejeshea familia haki na mwendelezo wake.
    reason: lexical_alternative
  - marker: b
    text: Huenda “mkombozi” hapa anarejelea hasa mtoto mchanga aliyezaliwa; wengine hulielewa neno hilo kwa upana zaidi kwa kuzingatia jukumu la Boazi kama mkombozi katika sura hii.
    reason: alternative_reading
  - marker: c
    text: Kiebrania kihalisi, “jina lake na liitwe katika Israeli”; usemi huo unaweza kumaanisha kwamba jina lake lijulikane, litajwe, au liheshimiwe miongoni mwa Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Ndipo ... wakamwambia
  rationale: Muundo wa wayyiqtol unaendeleza mfululizo wa simulizi; “ndipo” pamoja na “wakamwambia” ni Kiswahili cha asili kinachoonyesha tukio linalofuata.
- source_word: הַנָּשִׁים
  choice: wanawake
  rationale: Nomino ya wingi yenye uainisho inawarejelea wanawake wa jamii waliokuwapo katika tukio hili.
- source_word: בָּרוּךְ יְהוָה
  choice: Yahwe na abarikiwe
  rationale: Huhifadhi mfumo wa baraka wa Kiebrania huku ikitumia jina la Mungu, Yahwe, badala ya kulibadilisha kuwa cheo.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: ambaye ... hakukuacha bila
  rationale: Hifili ya שבת hapa ina maana ya kutomwacha Naomi akose mkombozi; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: גֹּאֵל
  choice: mkombozi
  rationale: Neno hili huhifadhi wazo kuu la ukombozi bila kuficha kwamba katika Ruthu lina jukumu maalumu la kifamilia na kisheria; maana hiyo inaelezwa katika tanbihi.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi hiki cha wakati.
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: Jina lake na litajwe
  rationale: Kauli hii huhifadhi kwa ukaribu taswira ya Kiebrania ya jina ‘kuitwa’ au kutajwa, huku ikieleweka kama ombi kwamba jina hilo lijulikane na liheshimiwe.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Huonyesha eneo au jamii ambamo jina hilo litatambuliwa.
theological_decisions:
- issue: Mhusika anayeitwa “mkombozi” (גֹּאֵל)
  choice: Maandishi makuu hayabainishi ikiwa “mkombozi” ni mtoto aliyezaliwa au yanahusisha kwa upana zaidi kazi ya ukombozi ya Boazi kupitia mtoto huyo.
  alternative: Neno hilo linaweza kueleweka kuwa linamhusu hasa Obedi, mtoto aliyezaliwa, au kuwa linamrejelea Boazi kama mkombozi wa kifamilia.
  rationale: Muktadha wa karibu baada ya kuzaliwa kwa mtoto, hasa maneno kuhusu “jina lake,” unaelekeza kwa mtoto; hata hivyo, mfumo wa kifamilia na kisheria wa sura nzima unaendeleza pia jukumu la Boazi. Tafsiri haiondoi mvutano huu uliomo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na hadhi inayofaa maandiko. “Yahwe na abarikiwe” huhifadhi muundo wa baraka, na “Jina lake na litajwe” huhifadhi taswira ya asili bila kulazimisha maana moja tu.
