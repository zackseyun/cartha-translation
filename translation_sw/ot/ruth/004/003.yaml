base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: sw
  text: Kisha akamwambia mkombozi wa ukoo, “Naomi, aliyerudi kutoka nchi ya Moabu, anauza[a] sehemu ya shamba iliyokuwa ya ndugu yetu Elimeleki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ameuza.” Kitenzi cha Kiebrania kinaweza kumaanisha tendo lililokamilika, lakini hapa kimetafsiriwa kuwa tendo la sasa katika majadiliano ya kisheria yanayoendelea.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akamwambia
  rationale: Muundo wa masimulizi unasogeza tukio mbele; “Kisha” hudumisha mfuatano kwa Kiswahili cha kawaida.
- source_word: לַגֹּאֵל
  choice: mkombozi wa ukoo
  rationale: גֹּאֵל humaanisha mtu wa ukoo mwenye wajibu wa kisheria wa kukomboa mali au jamaa; usemi huu huonyesha dhana hiyo bila kuifungamanisha na fundisho maalumu la dhehebu.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: sehemu ya shamba
  rationale: Huwakilisha kwa karibu sehemu au kipande cha shamba na ni usemi wa asili katika Kiswahili.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: iliyokuwa ya ndugu yetu Elimeleki
  rationale: Kiambishi לְ kinaonyesha umiliki au uhusiano. “Ndugu yetu” huhifadhi lugha pana ya undugu wa ukoo bila kudai lazima awe ndugu wa tumbo.
- source_word: מָכְרָה
  choice: anauza
  rationale: Ingawa kitenzi cha Kiebrania kinaweza kueleweka kuwa tendo lililokamilika, muktadha wa majadiliano ya kisheria unaruhusu uuzaji unaowasilishwa kuwa wa sasa.
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: הַשָּׁבָה
  choice: aliyerudi
  rationale: Hutambulisha Naomi kuwa yule aliyerudi, huku ikionyesha kwamba kurudi kwake tayari kulitokea.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: kutoka nchi ya Moabu
  rationale: Neno la Kiebrania kwa halisi ni “uwanja/mashamba ya Moabu,” lakini hapa ni nahau ya nchi au eneo la Moabu; “nchi ya Moabu” ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
