base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: sw
  text: Ndipo Boazi akawaambia wazee na watu wote, “Ninyi ni mashahidi leo kwamba nimepata umiliki[a], kutoka mkononi mwa Naomi[b], wa kila kitu kilichokuwa cha Elimeleki, na kila kitu kilichokuwa cha Kilioni na Maloni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimenunua”; kitenzi cha Kiebrania kinaweza kumaanisha kupata umiliki kwa njia ya ununuzi katika shughuli ya kisheria.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kutoka mkononi mwa Naomi”; huu ni usemi unaomaanisha kutoka katika umiliki au mamlaka ya Naomi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo Boazi akawaambia
  rationale: Muundo wa usimulizi unaoanza na waw-consecutive unasogeza simulizi mbele. “Ndipo ... akawaambia” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: wazee na watu wote
  rationale: Maneno haya yanahifadhi makundi yote mawili yaliyokuwapo kama hadhira katika shughuli hiyo ya kisheria.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Ninyi ni mashahidi leo
  rationale: Huhifadhi msisitizo wa kiwakilishi cha Kiebrania na kueleza wazi hadhi yao ya kuwa mashahidi siku hiyo.
- source_word: קָנִיתִי
  choice: nimejipatia
  rationale: Kitenzi hiki cha Kiebrania kinaweza kumaanisha kupata umiliki, hasa kwa ununuzi katika shughuli ya kisheria. “Nimejipatia” hakilazimishi maana ya malipo ya fedha, huku tanbihi ikihifadhi uwezekano wa “nimenunua.”
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: mali yote iliyokuwa ya Elimeleki
  rationale: Usemi wa Kiebrania unaomaanisha kitu kilichokuwa mali ya mtu umetolewa kwa Kiswahili wazi bila kuongeza aina ya mali inayohusika.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: na mali yote iliyokuwa ya Kilioni na Maloni
  rationale: Huhifadhi ulinganifu na fungu linalomtaja Elimeleki na kuwataja wamiliki wote wawili bila kubadili uhusiano wao na mali.
- source_word: מִיַּד נָעֳמִי
  choice: kutoka mkononi mwa Naomi
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania ya “mkono,” ambayo katika muktadha huu huonyesha umiliki au mamlaka ya Naomi juu ya mali.
theological_decisions:
- issue: Asili ya shughuli ya Boazi
  choice: Kutumia “nimejipatia” kwa uhamisho wa mali
  alternative: “nimenunua”
  rationale: Mstari unazungumzia mali iliyohusishwa na Elimeleki, Kilioni na Maloni na iliyotoka chini ya mamlaka ya Naomi. Tafsiri pana inaepuka kudai zaidi ya maandishi kwamba shughuli hiyo ilikuwa ununuzi wa fedha, huku tanbihi ikihifadhi maana hiyo inayowezekana.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili: Boazi, Naomi, Elimeleki, Kilioni na Maloni. Lugha ya kisheria imewekwa wazi bila kuwa nzito kupita kiasi.'
