base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: sw
  text: Ndipo watu wote waliokuwa langoni, pamoja na wazee, wakasema, “Sisi ni mashahidi. Yahweh na amfanye mwanamke anayeingia katika nyumba yako awe kama Raheli na Lea, ambao wote wawili waliijenga nyumba ya Israeli. Nawe ufanikiwe[a] katika Efratha, na ujipatie jina katika Bethlehemu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utende kwa ushujaa” au “uonyeshe uwezo”; neno la Kiebrania linaweza kumaanisha ushujaa, nguvu, utajiri, au mafanikio.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: Sisi ni mashahidi
  rationale: Kiebrania kina nomino ‘mashahidi’ bila kitenzi; Kiswahili cha mazungumzo ya moja kwa moja huhitaji kishazi kamili ili kauli hii ieleweke kwa kawaida.
- source_word: יִתֵּן יְהוָה
  choice: Yahwe na amfanye
  rationale: Muundo huu ni ombi au baraka. Ingawa נתן kimsingi ni ‘kutoa,’ hapa pamoja na yambwa na ulinganisho maana ya kawaida ni ‘amfanye ... awe kama.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja katika matini ya Kiebrania, hivyo limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: mwanamke anayekuja nyumbani mwako
  rationale: Huhifadhi hali ya tendo linaloendelea au lililo karibu kutokea na picha halisi ya kuingia katika nyumba kwa njia ya ndoa.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: ambao wote wawili waliijenga nyumba ya Israeli
  rationale: Huhifadhi sitiari ya kujenga nyumba, huku ‘wote wawili’ ikiwakilisha wazi שְׁתֵּיהֶם na kujenga kukidokeza kuanzishwa kwa ukoo au taifa.
- source_word: וַעֲשֵׂה חַיִל
  choice: Nawe ufanikiwe
  rationale: Katika baraka hii ya ndoa, kitenzi pamoja na חַיִל kinaweza kueleza kusitawi au kufanikiwa, ingawa pia kinaweza kumaanisha kutenda kwa ushujaa au kuonyesha uwezo; utata huo umehifadhiwa katika tanbihi.
- source_word: בְּאֶפְרָתָה
  choice: katika Efratha
  rationale: Jina la mahali limehifadhiwa kwa umbo linalofaa Kiswahili.
- source_word: וּקְרָא שֵׁם
  choice: na ujipatie jina
  rationale: Kifungu hiki kinaelekea kumaanisha kupata sifa au umaarufu; ‘ujipatie jina’ huhifadhi taswira ya Kiebrania na kueleweka kwa kawaida katika Kiswahili.
- source_word: בְּבֵית לָחֶם
  choice: katika Bethlehemu
  rationale: Hili ni toleo la kawaida la jina la mahali, na ‘katika’ linaonyesha sifa inayopatikana ndani ya jamii hiyo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina la agano moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana pana ya חַיִל katika baraka
  choice: ufanikiwe
  alternative: utende kwa ushujaa / uonyeshe uwezo
  rationale: Muktadha wa ndoa, ukoo, na hadhi ya kijamii unaunga mkono mafanikio au kusitawi, lakini maana za uwezo na ushujaa hazijaondolewa kimyakimya na zimeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa baraka na sitiari za ‘nyumba’ na ‘jina’ zimehifadhiwa bila kufanya sentensi kuwa ngumu. Alama ya tanbihi imewekwa baada ya ‘ufanikiwe,’ ambako kifungu chenye utata וַעֲשֵׂה חַיִל kinatokea.
