source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: sw
  text: Tena, Ruthi Mmoabu, mke wa Mahloni, nimemjipatia[a] kuwa mke wangu, ili kulisimamisha jina la marehemu juu ya urithi wake[b], ili jina la marehemu lisikatiliwe mbali miongoni mwa ndugu zake wala langoni mwa mahali pake[c]. Ninyi ni mashahidi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimemnunua.” Kitenzi cha Kiebrania kinaweza kumaanisha kujipatia kwa kununua katika shughuli ya kisheria.
    reason: lexical_alternative
  - marker: b
    text: Yaani, ili kuhifadhi mwendelezo wa ukoo wa marehemu na hadhi yake ya kisheria kuhusiana na mali yake ya urithi.
    reason: cultural_note
  - marker: c
    text: Lango lilikuwa mahali pa hadhara ambako mashauri ya kisheria yalishuhudiwa na kuamuliwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Inaendeleza na kuongeza tangazo hili kwenye shughuli ya kisheria iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: Ruthi Mmoabu
  rationale: Jina limetoholewa kwa matumizi ya Kiswahili, na jina la utaifa limetafsiriwa kwa namna ya kawaida.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: mke wa Mahloni
  rationale: Hufuata moja kwa moja muundo wa Kiebrania; ingawa Ruthi alikuwa mjane, neno lenyewe hapa ni ‘mke,’ si ‘mjane.’
- source_word: קָנִיתִי לִי
  choice: nimejipatia
  rationale: Kitenzi קנה kinaweza kumaanisha kupata au kununua. ‘Nimejipatia’ kinahifadhi maana ya kujipatia katika shughuli ya kisheria bila kumfanya Ruthi aonekane tu kama bidhaa; tafsiri ya ‘nimenunua’ imewekwa katika tanbihi.
- source_word: לְאִשָּׁה
  choice: awe mke wangu
  rationale: Ni Kiswahili cha asili kinachoonyesha wazi kusudi la ndoa lililomo katika kirai cha Kiebrania.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: ili kuliendeleza jina la marehemu
  rationale: Huwasilisha kusudi la kudumisha jina, ukoo na hadhi ya marehemu kwa lugha ya sasa; ‘marehemu’ inafaa kwa heshima na haiongezi jina la mtu lisilokuwamo.
- source_word: עַל נַחֲלָתוֹ
  choice: katika urithi wake
  rationale: Inaunganisha jina la marehemu na mali yake ya urithi kwa namna inayoeleweka katika Kiswahili.
- source_word: וְלֹא יִכָּרֵת
  choice: lisitoweke
  rationale: Hutoa matokeo ya kutokatiliwa mbali kwa jina kwa Kiswahili cha kawaida, huku uzito wa kupotea kwa ukoo na hadhi ukiendelea kuonekana.
- source_word: מֵעִם אֶחָיו
  choice: miongoni mwa ndugu zake
  rationale: ‘Ndugu’ hufuata אחים na pia inaweza kueleweka katika mazingira mapana ya ukoo bila kulazimisha maana finyu kuliko muktadha.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: wala katika lango la mji wake
  rationale: ‘Lango’ limehifadhiwa kwa sababu ndilo eneo la hadhara na la kisheria; ‘mji wake’ hutoa maana ya mahali pake kwa Kiswahili cha kawaida.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Ninyi ni mashahidi leo
  rationale: Tangazo la kisheria limewasilishwa wazi, huku kiwakilishi ‘Ninyi’ kikihifadhi msisitizo wa Kiebrania.
theological_decisions:
- issue: Hali ya tendo la Boazi kwa Ruthi katika shughuli ya ukombozi wa kifamilia
  choice: nimejipatia awe mke wangu
  alternative: nimenunua awe mke wangu; nimemchukua awe mke wangu
  rationale: Uteuzi huu unahifadhi upande wa shughuli ya kisheria wa קנה na kusudi la ndoa, bila kuufanya mstari kuwa simulizi la kimapenzi tu wala kudai kupita kiasi kwamba Ruthi alinunuliwa kama mali ya kawaida.
- issue: Maana ya kuendeleza jina la marehemu
  choice: kuliendeleza jina la marehemu katika urithi wake
  alternative: kulisimamisha jina la marehemu juu ya urithi wake
  rationale: Kiswahili kilichochaguliwa kinaeleza kwa kawaida mwendelezo wa ukoo na uhusiano wa kisheria na urithi. Tanbihi inaweka wazi muktadha bila kuubadili kuwa fundisho maalumu la kimadhehebu.
- issue: Upeo wa אֶחָיו
  choice: ndugu zake
  alternative: jamaa zake; kaka zake
  rationale: ‘Ndugu’ huhifadhi istilahi ya kindugu na pia uvumilivu wa maana unaohitajika katika muktadha wa ukoo; ‘kaka’ ingekuwa finyu mno, na ‘jamaa’ ingeondoa kabisa neno la msingi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtindo wa tangazo la kisheria, lakini huepuka miundo migumu isiyo ya kawaida kama ‘juu ya urithi wake’ na ‘lango la mahali pake.’ Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayofafanuliwa.
