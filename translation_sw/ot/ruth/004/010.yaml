  terminology: Ruthi, Mmoabu, Mahloni, marehemu, urithi, na mashahidi zinafaa. "Kulisimamisha jina" na "lisikatiliwe mbali" huhifadhi lugha rasmi ya kisheria ya chanzo bila kuelekeza tafsiri ya kimadhehebu.
