source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: sw
  text: Ndipo Boazi akasema[a], “Siku utakapoinunua shamba kutoka kwa Naomi, utamchukua pia Ruthi, Mmoabu, mke wa marehemu[b], ili kuendeleza jina la marehemu katika urithi wake.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania yaliyowekewa irabu yanasema kihalisi, “nimempata” (au “nimenunua”) Ruthi, Mmoabu. Kwa kuzingatia muktadha, wengi wanaelewa maana kuwa “utamchukua pia.”
    reason: textual_variant
  - marker: b
    text: Au, “mke wa yule aliyekufa.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, ili ukoo wa marehemu na haki yake katika mali ya urithi viendelee kuhifadhiwa.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: Siku utakapolinunua
  rationale: Huhifadhi usemi wa wakati wenye mazingira ya shughuli ya kisheria. Kitenzi ‘kununua’ kinafaa kwa shamba linalokombolewa, huku muundo wa wakati ujao ukimlenga mkombozi wa karibu.
- source_word: הַשָּׂדֶה
  choice: shamba
  rationale: Ni tafsiri ya moja kwa moja ya sehemu maalumu ya ardhi inayozungumziwa, badala ya neno pana zaidi ‘ardhi’.
- source_word: מִיַּד נָעֳמִי
  choice: kutoka kwa Naomi
  rationale: Nahau ya Kiebrania ‘kutoka mkononi mwa Naomi’ inaonyesha uhamisho kutoka katika milki au mamlaka yake. Kiswahili cha kawaida huwasilisha maana hiyo kwa uwazi kwa kusema ‘kutoka kwa Naomi’.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה … קניתי
  choice: utamchukua pia Ruthi Mmoabu
  rationale: Kifungu cha Kiebrania kina ugumu wa kisintaksia na wa kimatini. Muktadha unaonyesha kwamba ukombozi wa shamba unahusisha pia kumchukua Ruthi katika wajibu wa kuendeleza jina la marehemu. ‘Utamchukua’ huepuka kumweleza mwanamke kana kwamba ni bidhaa, huku ikihifadhi wazo la wajibu wa kindoa katika muktadha huu.
- source_word: אֵשֶׁת הַמֵּת
  choice: mke wa marehemu
  rationale: Huwasilisha kwa ufupi na kwa kawaida maana halisi ya ‘mke wa aliyekufa.’ ‘Mjane’ lingeongeza ufafanuzi ambao haupo moja kwa moja katika usemi wa Kiebrania.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: ili jina la marehemu liendelee
  rationale: Nahau ya ‘kulisimamisha jina’ inamaanisha kuendeleza ukoo, hadhi, na dai la marehemu. Kiswahili hiki ni cha kawaida na kinahifadhi lengo la nahau bila kuwa kigumu.
- source_word: עַל נַחֲלָתוֹ
  choice: kwenye urithi wake
  rationale: Huhifadhi uhusiano kati ya jina la marehemu na mali yake ya urithi kwa Kiswahili cha kawaida, bila kulazimisha usemi usio wa kawaida ‘juu ya urithi wake.’
theological_decisions:
- issue: Ugumu wa kimatini na kisintaksia katika kifungu kinachomhusu Ruthi na neno קניתי
  choice: 'Maana ya muktadha imetafsiriwa kama maneno yanayoelekezwa kwa mkombozi wa karibu: akinunua shamba, atamchukua pia Ruthi.'
  alternative: 'Kufuata moja kwa moja usomaji wa Kimasora wa nafsi ya kwanza: ‘nimemchukua/nimempata Ruthi Mmoabu,’ au kuunganisha ‘kutoka kwa Ruthi’ na ununuzi wa shamba kwa namna nyingine.'
  rationale: Maandishi ya Kimasora yaliyowekewa irabu yana nafsi ya kwanza umoja, lakini mtiririko wa simulizi unaonyesha Boazi akimweleza mkombozi wa karibu wajibu utakaomwangukia akiikomboa ardhi. Matini kuu inatoa maana hiyo ya kimuktadha, huku tanbihi ikihifadhi usomaji halisi wa Kimasora.
- issue: Maana ya kuendeleza jina la marehemu katika urithi wake
  choice: Nahau imewasilishwa kama kuendelea kwa jina la marehemu kwenye urithi wake.
  alternative: Kutafsiri kihalisi zaidi, ‘kulisimamisha jina la marehemu juu ya urithi wake.’
  rationale: Tafsiri hii huhifadhi uhusiano wa kisheria na kifamilia bila kuamua zaidi ya matini kuhusu namna kamili ya desturi hiyo; tanbihi inaeleza maana ya kitamaduni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Utamchukua’ ni usemi wa kawaida katika muktadha wa ndoa na wajibu wa kifamilia; huepuka dhana ya kumnunua Ruthi kama mali. ‘Jina … liendelee’ hufanya nahau ya Kiebrania ieleweke kwa wasomaji wa kawaida huku tanbihi ikihifadhi maelezo ya kitamaduni.
