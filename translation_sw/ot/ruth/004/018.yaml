lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Hivi ndivyo
  rationale: Muundo huu unatambulisha kwa Kiswahili sehemu mpya ya nasaba kwa njia ya kawaida na yenye heshima. Kiunganishi cha Kiebrania hakijatafsiriwa kwa neno la muda kama “sasa,” kwa kuwa hapa kina kazi ya kuunganisha na kutambulisha taarifa.
- source_word: תּוֹלְדוֹת
  choice: vizazi
  rationale: “Vizazi” kinadumisha usemi rasmi wa nasaba na maana pana ya neno la Kiebrania, ambalo katika muktadha huu linaweza kumaanisha wazao au ukoo.
- source_word: פָּרֶץ
  choice: Peresi
  rationale: Jina limetoholewa kutoka Kiebrania kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: הוֹלִיד
  choice: alimzaa
  rationale: Katika orodha ya nasaba, kitenzi hiki humaanisha kuwa baba wa mtu. “Alimzaa” ni kifupi, cha kawaida katika Kiswahili, na kinafaa kwa mtindo wa nasaba.
- source_word: אֶת
  choice: '[alama ya yambwa mahsusi, haitafsiriwi]'
  rationale: Chembe hii ya Kiebrania huonyesha yambwa mahsusi na haina neno la moja kwa moja la kuitafsiri katika Kiswahili.
- source_word: חֶצְרוֹן
  choice: Hesroni
  rationale: Jina limetoholewa kutoka Kiebrania kwa umbo la kawaida na linalotambulika katika Kiswahili.
