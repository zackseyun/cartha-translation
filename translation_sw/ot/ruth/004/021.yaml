- source_word: בֹּעַז
  choice: Boazi
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: וּ/בֹעַז
  choice: naye Boazi
  rationale: “Naye” linaonyesha wazi kiunganishi cha Kiebrania na mabadiliko ya mhusika katika mfululizo wa nasaba kwa Kiswahili cha kawaida.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi kilekile kimerudiwa ili kudumisha ulinganifu wa nasaba na wa matini ya Kiebrania.
- source_word: עוֹבֵד
  choice: Obedi
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
