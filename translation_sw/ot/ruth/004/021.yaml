  rationale: Hiphil ya ילד katika nasaba humaanisha kumzaa au kuwa baba ya mtu. “Akamzaa” ni fupi, ya kawaida katika nasaba za Kiswahili, na inaendeleza mfuatano wa simulizi.
- source_word: אֶת
  choice: '[halijatafsiriwa moja kwa moja]'
