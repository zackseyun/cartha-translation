translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na hadhi inayofaa maandiko. Mpangilio “wote wawili, Maloni na Kilioni” huhifadhi msisitizo wa Kiebrania, na “watoto” huhifadhi upana wa neno la asili badala ya kulibana kimya kimya kuwa “wana.”
