base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: sw
  text: Kisha wote wawili, Mahloni na Kilyoni, wakafa pia; yule mwanamke akabaki bila watoto wake wawili[a] na bila mume wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanawe wawili.” Kiebrania kinasema “watoto wake wawili,” kwa kutumia neno linaloweza kurejelea wazao kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: wakafa
  rationale: Kitenzi hiki cha masimulizi kinaendeleza mfuatano wa matukio yaliyopita; “wakafa” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: גַם
  choice: pia
  rationale: Neno hili linaonyesha kuwa vifo vya wana hao viliongezeka juu ya msiba wa awali wa kifo cha Elimeleki.
- source_word: שְׁנֵי/הֶם
  choice: wote wawili
  rationale: Usemi huu unasisitiza kwamba hao wawili walikufa; “wote wawili” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: מַחְלוֹן וְ/כִלְי֑וֹן
  choice: Maloni na Kilioni
  rationale: Majina yametoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku yakifuata maumbo ya Kiebrania.
- source_word: וַ/תִּשָּׁאֵר֙
  choice: akabaki
  rationale: Kitenzi שׁאר humaanisha kubaki au kuachwa; katika muktadha huu “akabaki bila” huwasilisha kwa kawaida hali ya kunyang’anywa wapendwa wake.
- source_word: הָֽ/אִשָּׁ֔ה
  choice: huyo mwanamke
  rationale: Kiebrania kinasema “mwanamke,” si jina Naomi wala “mke.” Kionyeshi “huyo” hufanya rejeo hilo lisikike la kawaida katika Kiswahili bila kulibadili.
- source_word: מִ/שְּׁנֵ֥י יְלָדֶ֖י/הָ
  choice: bila watoto wake wawili
  rationale: Kihusishi hapa kinaonyesha kutengwa au kupungukiwa. יְלָדִים ni neno pana la watoto au wazao, ingawa hapa linawarejelea wana wawili waliokuwa watu wazima.
- source_word: וּ/מֵ/אִישָֽׁ/הּ
  choice: na bila mume wake
  rationale: אִישׁ ikiwa na kiambishi cha umilikaji hapa humaanisha “mume”; kurudia “bila” huhifadhi wazo la hasara mbili na kufanya sentensi iwe wazi.
