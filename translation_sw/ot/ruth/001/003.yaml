lexical_decisions:
- source_word: וַיָּמָת
  choice: Kisha ... akafa
  rationale: Kitenzi cha mfululizo wa masimulizi kinasogeza tukio mbele; “Kisha” kinaonyesha ufuatano huo kwa Kiswahili cha kawaida bila kulazimisha kiunganishi cha moja kwa moja.
- source_word: אֱלִימֶלֶךְ
  choice: Elimeleki
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אִישׁ נָעֳמִי
  choice: mume wa Naomi
  rationale: Katika muundo huu אִישׁ humaanisha mume, si mwanamume kwa ujumla; tafsiri hii inaweka wazi uhusiano wa ndoa.
- source_word: וַתִּשָּׁאֵר
  choice: akabaki
  rationale: Kitenzi kinaeleza kubaki baada ya kifo na hasara. “Akabaki” ni cha kawaida na chenye heshima katika masimulizi ya Kiswahili.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: Naomi akabaki pamoja na wanawe wawili
  rationale: Kiebrania kinamtaja Naomi na wanawe wawili kuwa ndio waliobaki. “Pamoja na” huhifadhi wazo hilo kwa Kiswahili cha asili na huepuka muundo usio kamili wa “akabaki, na wanawe wawili.”
