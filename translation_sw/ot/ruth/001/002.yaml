base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: sw
  text: Jina la mtu huyo lilikuwa Elimeleki, jina la mke wake lilikuwa Naomi, na majina ya wanawe wawili yalikuwa Maloni na Kilioni. Walikuwa watu wa Efratha, kutoka Bethlehemu ya Yuda. Walifika katika mashamba ya Moabu[a], wakawa huko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi ya Moabu” au “eneo la Moabu.” Kiebrania ni “mashamba ya Moabu.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakakaa huko” au “wakaishi huko.” Kiebrania kihalisi ni “wakawa huko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: Jina la mtu huyo lilikuwa
  rationale: Inahifadhi mtindo wa Kiebrania wa kutaja jina kwa Kiswahili sanifu na cha kawaida; “mtu huyo” humrejelea wazi mtu aliyetajwa katika mstari uliotangulia.
- source_word: אֱלִימֶלֶךְ
  choice: Elimeleki
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Jina limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: שְׁנֵי בָנָיו
  choice: wanawe wawili
  rationale: Muundo huu ni wa kawaida katika Kiswahili na huhifadhi idadi pamoja na uhusiano wa kifamilia.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Maloni na Kilioni
  rationale: Majina yametoholewa kufuatana na matamshi ya Kiebrania na muundo wa majina katika Kiswahili.
- source_word: אֶפְרָתִים
  choice: Waefratha
  rationale: Neno linawaonyesha watu waliohusishwa na Efratha, si kabila la Efraimu; umbo la Kiswahili linaweka wazi kuwa ni kundi la watu.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: kutoka Bethlehemu ya Yuda
  rationale: Hutambulisha Bethlehemu iliyoko Yuda kwa mtindo wa kawaida wa Kiswahili.
- source_word: וַיָּבֹאוּ
  choice: Walifika
  rationale: Katika simulizi, kitenzi hiki huonyesha kufika kwao mahali walikokusudia; “walifika” ni cha asili kuliko “walikuja” bila kubadili maana.
- source_word: שְׂדֵי מוֹאָב
  choice: maeneo ya Moabu
  rationale: Ingawa maana halisi ni “mashamba ya Moabu,” wingi huu unaweza kumaanisha nchi au eneo la Moabu; “maeneo” ni wazi na la kawaida, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: וַיִּהְיוּ שָׁם
  choice: wakaishi huko
  rationale: Kiebrania halisi ni “wakawa huko”; katika muktadha huu Kiswahili “wakaishi huko” huwasilisha hali yao ya kuendelea kuwapo bila kudai muda maalumu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Viunganishi vimepunguzwa kiasi ili sentensi isomeke kwa kawaida, huku mfuatano wa taarifa za Kiebrania ukihifadhiwa.
