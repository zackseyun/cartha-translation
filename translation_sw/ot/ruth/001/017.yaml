base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: sw
  text: Mahali utakapokufa, nami nitakufa, na huko nitazikwa. Yahweh anitendee hivyo, na zaidi ya hayo[a], ikiwa kitu chochote isipokuwa kifo kitatutenganisha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “Yahweh anitendee hivyo, na hivyo aongeze.” Hii ni kauli ya kiapo cha Kiebrania inayomwomba Mungu alete hukumu ikiwa kiapo kitavunjwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ikiwa kitu chochote ila kifo kitatutenganisha.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Utakapokufa
  rationale: Muundo wenye ב na אֲשֶׁר unaonyesha mahali; katika Kiswahili, mahali hapo linaeleweka kwa kawaida ndani ya kishazi ‘utakapokufa,’ bila kuongeza maneno mazito kama ‘mahali ambapo.’
- source_word: תָּמוּתִי / אָמוּת
  choice: utakapokufa, nami nitakufa
  rationale: Urudiaji wa kitenzi מות umehifadhiwa ili kuonyesha ulinganifu na uzito wa ahadi ya Ruthu.
- source_word: וְשָׁם
  choice: na huko
  rationale: ‘Huko’ hurejelea kwa kawaida mahali ambapo Naomi atakufa na hudumisha mwendelezo wa sentensi.
- source_word: אֶקָּבֵר
  choice: nitazikwa
  rationale: Niphal ya קבר ina maana ya kutendwa; ‘nitazikwa’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: Yahwe na anitendee hivyo, na hata zaidi
  rationale: Hii ni kauli ya kawaida ya kiapo kinachojiwekea hukumu. Tafsiri hii inadumisha uzito wake huku ikieleweka katika Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika tetragramatoni limetoholewa kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muktadha wa kiapo, כִּי hutanguliza sharti ambalo likivunjwa litaleta hukumu iliyoombwa katika kiapo.
- source_word: הַמָּוֶת
  choice: kifo
  rationale: Kiswahili hakihitaji alama tofauti ya uainishaji hapa; ‘kifo’ hutaja jambo pekee linaloruhusiwa kuwatenganisha.
- source_word: יַפְרִיד
  choice: kitatutenganisha
  rationale: Hiphil ya פרד humaanisha kusababisha kutengana. Kiambishi ‘-tu-’ kinaonyesha kwa kawaida kutenganishwa kwa Ruthu na Naomi.
- source_word: בֵּינִי וּבֵינֵךְ
  choice: kitatutenganisha
  rationale: Ingawa Kiebrania husema kihalisi ‘kati yangu na kati yako,’ Kiswahili cha kawaida huieleza hali hiyo kwa yambwa ya wingi ‘kututenganisha.’
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa kiapo cha Ruthu
  choice: ikiwa kitu chochote ila kifo kitatutenganisha
  alternative: ikiwa kifo kitatutenganisha
  rationale: Katika kauli hii ya kiapo, maana inayokusudiwa ni kwamba kifo pekee ndicho kinachoweza kuvunja kifungo hicho; Ruthu anajiwekea hukumu ikiwa sababu nyingine yoyote itawatenganisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito unaofaa kiapo. Muundo wa kishairi wa ahadi umehifadhiwa bila kutumia misamiati ya kale isiyo ya lazima.
