revisions:
- from: Basi akaondoka mahali alipokuwa[a], pamoja na wakwe zake wawili, nao wakashika njia ili kurudi katika nchi ya Yuda.
  to: Basi akatoka mahali alipokuwa, pamoja na binti-mkwe zake wawili, nao wakashika njia kurudi katika nchi ya Yuda.
  rationale: The revision replaces the imprecise kinship term “wakwe” with “binti-mkwe,” and uses “akatoka” in the text to represent the Hebrew verb directly. The narrative progression, plural travel action, purpose of return, and destination remain intact. The footnote is retained as a natural contextual alternative rather than as the sole preservation of the Hebrew verb’s basic sense.
