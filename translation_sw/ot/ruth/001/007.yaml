  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: sw
  text: Basi akatoka mahali alipokuwa, pamoja na binti-mkwe zake wawili, nao wakashika njia kurudi katika nchi ya Yuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Basi akaondoka
  rationale: Kiunganishi cha simulizi kinaendeleza matukio; “basi” kinaonyesha mwendelezo kwa Kiswahili cha kawaida. Ingawa kitenzi יצא kwa msingi ni ‘kutoka,’ katika muktadha huu ‘akaondoka’ kinaeleza mwendo huo kwa kawaida bila kuongeza wazo jipya; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: mahali alipokuwa
  rationale: Hii ni tafsiri ya kawaida na fupi ya ‘kutoka mahali ambako alikuwa,’ ikiepuka urudiaji usio wa lazima katika Kiswahili.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: pamoja na wakwe zake wawili
  rationale: Katika muktadha, כַּלָּה humaanisha binti-mkwe. Kiswahili ‘wakwe zake’ kinaeleweka hapa kwa kuwa ni wake wa wanawe waliokufa, ingawa neno ‘mkwe’ lina upeo mpana zaidi katika matumizi ya Kiswahili.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: nao wakashika njia
  rationale: Kauli hii ya asili ya Kiswahili inaonyesha kwamba wanawake hao walianza na kuendelea na safari yao, huku ikihifadhi picha ya ‘njia’ iliyo katika Kiebrania.
- source_word: לָשׁוּב
  choice: ili kurudi
  rationale: Kitenzi שׁוב kina maana ya ‘kurudi’ na ni neno muhimu linalojirudia katika sura hii. ‘Ili’ linaonyesha kusudi la safari.
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: katika nchi ya Yuda
  rationale: אֶרֶץ limetafsiriwa wazi kuwa ‘nchi,’ na Yuda limehifadhiwa kama jina la eneo lao la kwenda.
