  to: Ikawa, katika siku za waamuzi walipohukumu, kulikuwa na njaa katika nchi. Mwanamume mmoja aliondoka Bethlehemu ya Yuda kwenda kukaa kwa muda katika mashamba ya Moabu[a]—yeye, mke wake, na wanawe wawili.
