  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: sw
  text: Ikawa, katika siku za waamuzi walipohukumu, kulikuwa na njaa katika nchi. Mwanamume mmoja aliondoka Bethlehemu ya Yuda kwenda kukaa kwa muda katika mashamba ya Moabu[a]—yeye, mke wake, na wanawe wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika eneo/nchi ya Moabu.” Kiebrania, kwa neno kwa neno, ni “katika mashamba ya Moabu.” “Kukaa kwa muda” huweza kudokeza kuishi kama mgeni, wala si lazima makazi ya kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hufungua simulizi kwa namna ya kawaida na yenye hadhi, huku ikibeba mwendelezo wa wayyiqtol bila kuongeza neno la wakati lisilokuwapo katika Kiebrania.
- source_word: בִּימֵי שְׁפֹט הַשֹּׁפְטִים
  choice: katika siku ambazo waamuzi walihukumu
  rationale: Inahifadhi nahau ya wakati pamoja na urudiaji wa mzizi שׁפט ('waamuzi walihukumu'), ambao ni dhahiri pia katika Kiswahili.
- source_word: רָעָב
  choice: njaa
  rationale: Ni neno la kawaida na sahihi kwa upungufu mkubwa wa chakula katika eneo.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Inadumisha maana pana ya הארץ bila kubainisha kimyakimya kuwa ni Yuda au Israeli, ingawa muktadha unaweza kuelekeza huko.
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: Hutambulisha mwanamume fulani katika simulizi kwa Kiswahili cha kawaida; utambulisho wake utaelezwa katika mstari unaofuata.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: Bethlehemu ya Yuda
  rationale: Hutofautisha mji huu na Bethlehemu nyingine na kufuata kwa karibu uhusiano wa majina ya mahali katika Kiebrania.
- source_word: לָגוּר
  choice: kwenda kukaa kwa muda
  rationale: גור hudokeza ukaaji wa muda kama mgeni, si lazima uhamaji wa kudumu; kifungu hiki ni wazi zaidi kwa wasomaji wa sasa kuliko neno la kale au lisilo la kawaida.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: katika maeneo ya Moabu
  rationale: Wingi wa שׂדה unaweza kumaanisha mashamba au eneo/nchi. 'Maeneo' ni Kiswahili cha asili kinachowasilisha matumizi hayo ya kieneo bila kulazimisha picha ya mashamba yaliyolimwa pekee.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: yeye, mke wake, na wanawe wawili
  rationale: Inahifadhi orodha rahisi na msisitizo wa kwamba familia nzima iliandamana naye.
theological_decisions:
- issue: Jukumu la waamuzi katika שְׁפֹט הַשֹּׁפְטִים
  choice: waamuzi walihukumu
  alternative: waamuzi walitawala
  rationale: Kiebrania hurudia mzizi wa 'kuhukumu' na linaweza kujumuisha utawala au uongozi. Tafsiri inahifadhi mwangwi huo na upana wa maana badala ya kuufupisha kuwa utawala pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa 'waamuzi walihukumu' umehifadhiwa kimakusudi kwa sababu unaakisi muundo wa Kiebrania. 'Kukaa kwa muda' huepuka msamiati mgumu huku ikihifadhi hali ya ukaaji wa muda kama mgeni.
