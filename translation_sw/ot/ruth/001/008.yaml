  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ לִ/שְׁתֵּ֣י כַלֹּתֶ֔י/הָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְ/בֵ֣ית אִמָּ֑/הּ יעשה יְהוָ֤ה עִמָּ/כֶם֙ חֶ֔סֶד כַּ/אֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם הַ/מֵּתִ֖ים וְ/עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: sw
  text: Naomi akawaambia binti-wakwe zake wawili, “Nendeni, rudini, kila mmoja nyumbani kwa mama yake. Yahweh na awatendee fadhili[a], kama mlivyowatendea waliokufa na mlivyonitendea mimi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “upendo thabiti,” “upendo wa uaminifu,” au “uaminifu wa agano” (Kiebrania: hesed).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: binti-wakwe zake wawili
  rationale: Katika muktadha huu כַּלָּה humaanisha wake za wana wa Naomi. ‘Binti-wakwe’ ni neno la kawaida na sahihi katika Kiswahili sanifu.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: Nendeni, rudini
  rationale: Vitenzi vyote viwili vya amri vimehifadhiwa ili kuonyesha msisitizo wa ombi la Naomi badala ya kuvifupisha kuwa amri moja.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: kila mmoja nyumbani kwa mama yake
  rationale: אִשָּׁה imetumiwa hapa kwa maana ya mgawanyo, ‘kila mmoja.’ Kauli mahususi ‘nyumbani kwa mama yake’ imehifadhiwa badala ya kujumlishwa kuwa nyumba ya jamaa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama ‘Yahweh,’ si kubadilishwa kuwa cheo.
- source_word: חֶסֶד
  choice: fadhili
  rationale: ‘Fadhili’ huwasilisha tendo la wema na uaminifu katika dua hii kwa lugha ya Kiswahili iliyo wazi; upana wa maana ya חֶסֶד umeonyeshwa katika tanbihi.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: kama mlivyowatendea waliokufa na mlivyonitendea mimi
  rationale: Kitenzi עשה pamoja na חֶסֶד kina maana ya kumtendea mtu fadhili. Kurudia kitenzi kwa namna ya asili ya Kiswahili kunaweka wazi kuwa fadhili hizo zilitendewa waliokufa na Naomi pia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, si cheo. ‘Yahweh’ hulihifadhi kama jina huku ‘Yehova’ likiwa namna nyingine iliyozoeleka ya kulitaja.
- issue: Upeo wa maana ya חֶסֶד
  choice: fadhili
  alternative: upendo thabiti / upendo wa uaminifu / uaminifu wa agano
  rationale: Katika baraka ya Naomi, neno hili linaeleza wema unaotendwa kwa uaminifu. Tafsiri kuu haifungi maana katika istilahi moja ya kiteolojia, na tanbihi huhifadhi vivuli vyake vingine vya maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘Nendeni, rudini’ yanahifadhi msisitizo wa Kiebrania, na ‘Yahweh na awatendee’ ni muundo wa dua unaoeleweka kwa wasomaji wa kawaida.
