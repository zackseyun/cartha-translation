  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: sw
  text: Ndipo akainuka yeye pamoja na binti zake-wakwe, akarudi kutoka nchi ya Moabu, kwa kuwa akiwa katika nchi ya Moabu alikuwa amesikia kwamba Yahwe alikuwa amewatembelea watu wake ili awape chakula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate.” Neno la Kiebrania lechem mara nyingi humaanisha mkate hasa, lakini pia linaweza kumaanisha chakula au riziki kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Ndipo akainuka
  rationale: Kitenzi cha mfululizo wa simulizi kinaendeleza tukio linalofuata; “ndipo” na “akainuka” vinahifadhi mwendo huo kwa Kiswahili cha heshima na cha kawaida.
- source_word: וְכַלֹּתֶיהָ
  choice: pamoja na wakwe zake
  rationale: Katika muktadha hawa ni wake za wanawe; “wakwe zake” ni usemi wa kawaida wa Kiswahili kwa uhusiano huu, na “pamoja na” huonyesha ushirika unaokusudiwa hapa.
- source_word: וַתָּשָׁב
  choice: akaondoka ... ili arudi nyumbani
  rationale: שורש שׁוב humaanisha kurudi au kugeuka kurudi. Kwa kuwa mstari unaofuata unaeleza safari yenyewe, usemi huu unaonyesha kwa kawaida kwamba aliondoka Moabu kwa kusudi la kurudi alikotoka, bila kudokeza kuwa tayari alikuwa amefika.
- source_word: מִשְּׂדֵי מוֹאָב / בִּשְׂדֵה מוֹאָב
  choice: katika nchi ya Moabu / nchini Moabu
  rationale: שׂדה hapa hutaja eneo au nchi, si lazima mashamba yanayolimwa. Kiswahili “nchi ya Moabu” kinatoa maana ya kieneo kwa uwazi na kwa kawaida.
- source_word: כִּי שָׁמְעָה
  choice: kwa sababu ... alikuwa amesikia
  rationale: כִּי inaleta sababu ya kuondoka kwake, na wakati timilifu “alikuwa amesikia” unaonyesha kwamba habari hiyo ilitangulia uamuzi wa kurudi.
- source_word: פָּקַד
  choice: alikuwa amewajia
  rationale: Katika muktadha huu פקד huonyesha ujio au hatua ya Yahwe kwa manufaa ya watu wake. “Amewajia” huhifadhi taswira ya kuwatembelea bila kufafanua kupita kiasi namna ya msaada wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi, si kubadilishwa kwa cheo. Umbo “Yahwe” linafuata tahajia ya kawaida na matamshi yanayofaa Kiswahili.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עם katika muktadha huu ni jamii iliyo katika uhusiano na Yahwe; “watu wake” huhifadhi maana hiyo ya uhusiano.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: na kuwapa chakula
  rationale: לֶחֶם inaweza kumaanisha mkate hasa au chakula kwa upana. Katika muktadha wa njaa, “chakula” huwasilisha vizuri maana ya riziki kwa ujumla; maana halisi zaidi imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulihifadhi kama “Yahwe” kunatofautisha jina hilo na cheo, bila kuingiza ufafanuzi wa dhehebu.
- issue: Maana ya hatua ya Yahwe katika פקד
  choice: alikuwa amewajia watu wake
  alternative: alikuwa amewajali watu wake
  rationale: “Amewajia” huhifadhi kwa kiasi fulani taswira na upana wa kitenzi cha Kiebrania, huku muktadha wenyewe—kuwapa chakula—ukionyesha kwamba ujio huo ulikuwa wa neema. “Amewajali” ni wazi zaidi lakini hufafanua maana badala ya kuhifadhi mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umehifadhiwa bila kuwa mgumu; “nchi ya Moabu” imetumiwa badala ya “mashamba ya Moabu” kwa sababu neno la Kiebrania lina maana ya eneo hapa. Kielezi “nyumbani” kinafafanua mwelekeo wa kurudi kwa lugha ya kawaida kutokana na muktadha, bila kutaja Yuda moja kwa moja.
