  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: sw
  text: Lakini akawaambia[a], “Msiniite Naomi; niiteni Mara, kwa maana Mwenyezi amenitendea kwa uchungu mwingi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Naomi linahusishwa na kupendeza, ilhali Mara linamaanisha “mchungu.”
    reason: Maelezo haya yanaonyesha mchezo wa maana kati ya majina hayo na kauli ya Naomi kuhusu uchungu wake.
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: Lakini akawaambia
  rationale: Kiunganishi kinaendeleza simulizi huku muktadha ukionyesha jibu la kusahihisha; ‘lakini’ huonyesha tofauti hiyo kwa kawaida. Kiwakilishi cha kike wingi kinarejelea wanawake wa Bethlehemu, na ‘akawaambia’ ni Kiswahili fasaha bila kulazimisha kutaja jinsia hapa.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: Msiniite Naomi
  rationale: קרא pamoja na jina humaanisha kumwita mtu kwa jina fulani. ‘Msiniite’ pia huhifadhi amri iliyoelekezwa kwa watu wengi.
- source_word: קְרֶאןָ לִי מָרָא
  choice: niiteni Mara
  rationale: Muundo wa amri ya wingi na urudiaji wa ‘ita’ huhifadhi ulinganifu na utofautishaji wa majina hayo mawili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya Naomi kutaka kuitwa kwa jina jingine.
- source_word: הֵמַר ... לִי מְאֹד
  choice: amenifanya niwe na uchungu mwingi
  rationale: Hifili ya מרר inaweza kumaanisha kufanya kuwa mchungu au kusababisha uchungu. Kauli hii ni ya kawaida katika Kiswahili, huhifadhi uhusiano wa kimsamiati na Mara (‘uchungu’), na haiongezi dai lisilo wazi kwamba Mungu alimtendea kwa namna yenye chuki.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Ni cheo cha Mungu. ‘Mwenyezi’ ni tafsiri ya kawaida na iliyo wazi katika Kiswahili, badala ya kunakili Shaddai bila kueleza maana.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu שַׁדַּי
  choice: Mwenyezi
  alternative: Shaddai
  rationale: Neno hili limetumiwa kama cheo cha Mungu; kulitafsiri huwasilisha maana yake kwa msomaji wa kawaida bila kulifanya kuwa jina binafsi.
- issue: Wakala wa Mungu katika uchungu wa Naomi
  choice: amenifanya niwe na uchungu mwingi
  alternative: amenitendea kwa uchungu mwingi
  rationale: Tafsiri iliyochaguliwa inafuata kwa karibu maana sababishi ya הֵמַר na kuhifadhi mvutano wa kauli ya Naomi kwamba Mwenyezi ndiye aliyesababisha hali yake ya uchungu, bila kufafanua zaidi namna ya tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msiniite ... niiteni’ huhifadhi kauli ya moja kwa moja na amri za wingi; ‘uchungu mwingi’ ni ya kawaida na inaendeleza mchezo wa maneno wa Kiebrania.
