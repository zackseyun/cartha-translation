source:
  edition: WLC
  text: הֲ/לָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲ/לָהֵן֙ תֵּֽעָגֵ֔נָה לְ/בִלְתִּ֖י הֱי֣וֹת לְ/אִ֑ישׁ אַ֣ל בְּנֹתַ֗/י כִּֽי מַר לִ֤/י מְאֹד֙ מִ/כֶּ֔ם כִּֽי יָצְאָ֥ה בִ֖/י יַד יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: sw
  text: Je, mngewangojea mpaka wakue? Je, mngejizuia kuolewa kwa ajili yao? La[a], binti zangu! Maana hali yangu ni chungu sana kuliko hali yenu[b], kwa sababu mkono wa Yahweh umejitokeza dhidi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msifanye hivyo, binti zangu.”
    reason: אַל inaweza kueleweka kama katazo linalokatiza wazo la kungoja na kubaki bila kuolewa, ingawa “La” huonyesha vizuri nguvu yake katika muktadha.
  - marker: b
    text: Au, “Maana nina uchungu mwingi sana kwa ajili yenu.” Kiebrania kinaweza kueleweka kwa njia zote mbili.
    reason: Kirai מִכֶּם kinaweza kuonyesha ulinganisho (“kuliko hali yenu”) au uhusiano wa sababu/masilahi (“kwa ajili yenu”); tanbihi huhifadhi uwezekano huo.
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: mngewangojea
  rationale: Kitenzi שׂבר hapa kina maana ya kungoja au kutarajia; katika muktadha huu Naomi anauliza kama wangewangojea wanawe wa kudhaniwa wakue.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: mpaka wakue
  rationale: Hueleza kungoja hadi wana hao wa kudhaniwa wafikie umri wa kuoa; usemi huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: תֵּעָגֵנָה ... לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: mngejizuia kuolewa
  rationale: Kitenzi עגן ni adimu, lakini kirai kinachofuata kinaelekeza kwenye kujizuia kuingia katika ndoa. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi uwezekano wa ‘kubaki bila kuolewa.’
- source_word: אַל בְּנֹתַי
  choice: La, binti zangu!
  rationale: אַל hapa ina nguvu ya kukataa wazo lililotangulia, si amri rahisi tu. ‘La’ huwasilisha jibu la Naomi kwa kawaida na kwa hisia.
- source_word: כִּי מַר לִי מְאֹד מִכֶּם
  choice: Maana hali yangu ni chungu sana kuliko yenu
  rationale: 'Tafsiri kuu inachukua מִכֶּם kwa maana ya ulinganisho: uchungu wa hali ya Naomi ni mkubwa kuliko wa wakwe zake. Tanbihi inaonyesha uwezekano mwingine wa kisarufi.'
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: mkono wa Yahwe umegeuka dhidi yangu
  rationale: Huu ni usemi wa kitamathali kuhusu tendo la Mungu lililomletea Naomi mateso. ‘Umegeuka dhidi yangu’ ni Kiswahili cha asili kinachohifadhi maana ya uadui katika בִי bila kupunguza dai la Naomi kuhusu utendaji wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalotamkika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Kauli ya Naomi kuhusu Mungu kuwa chanzo cha mateso yake
  choice: kwa sababu mkono wa Yahwe umegeuka dhidi yangu
  alternative: kwa sababu Yahwe ameniletea mateso haya
  rationale: Tafsiri iliyochaguliwa inadumisha taswira ya ‘mkono’ na mvutano wa kiteolojia wa kauli ya Naomi kwamba Yahwe ametenda dhidi yake, bila kuipunguza au kuifafanua kwa mfumo fulani wa kimadhehebu.
- issue: Maana ya מִכֶּם katika maelezo ya uchungu wa Naomi
  choice: hali yangu ni chungu sana kuliko yenu
  alternative: nina uchungu mwingi sana kwa ajili yenu
  rationale: Kiambishi מִן kinaweza kueleweka kwa kulinganisha au kuhusiana na wao. Maana ya kulinganisha inafaa vizuri katika muktadha, lakini uwezekano wa pili umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali ya balagha yamewekwa kwa mtiririko wa kawaida; ‘kuolewa’ huweka wazi muktadha wa ndoa, na jina ‘Yahwe’ linahifadhi jina binafsi la Mungu.
