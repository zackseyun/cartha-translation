base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: sw
  text: Nao wakaoa wanawake Wamoabu.[a] Mmoja aliitwa Orpa, na mwingine aliitwa Ruthu. Wakaishi huko takriban miaka kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wakajitwalia wake Wamoabu.” Katika Kiebrania usemi huu una maana ya kuoa wanawake Wamoabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים
  choice: wakaoa wanawake
  rationale: Muungano wa kitenzi נָשָׂא na נָשִׁים ni nahau yenye maana ya kuoa. Kiswahili cha kawaida hutumia “kuoa wanawake”; tafsiri ya neno kwa neno imehifadhiwa katika tanbihi.
- source_word: מֹאֲבִיּוֹת
  choice: Wamoabu
  rationale: Hutambulisha wanawake hao kuwa watu wa Moabu; “Wamoabu” ni umbo la kawaida la Kiswahili kwa watu wa taifa hilo.
- source_word: שֵׁם הָאַחַת עָרְפָּה וְשֵׁם הַשֵּׁנִית רוּת
  choice: Mmoja aliitwa Orpa, na mwingine aliitwa Ruthu
  rationale: Huwasilisha kwa Kiswahili cha asili fomula ya majina na utofautishaji wa wanawake hao wawili bila kubadili maana.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Wakaishi huko
  rationale: יָשַׁב hapa hueleza kuishi au kukaa mahali kwa muda mrefu; “wakaishi huko” ni wazi na ya kawaida.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: karibu miaka kumi
  rationale: Kiambishi כְּ kinaonyesha makadirio, kwa hiyo “karibu miaka kumi” huhifadhi maana hiyo.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Jina limenakiliwa kwa tahajia inayofaa Kiswahili.
- source_word: רוּת
  choice: Ruthu
  rationale: Jina limenakiliwa kwa namna iliyozoeleka katika Kiswahili.
