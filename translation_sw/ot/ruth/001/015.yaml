base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: sw
  text: Akasema, “Tazama, shemeji yako amerudi[a] kwa watu wake na kwa miungu yake[b]. Rudi ukamfuate shemeji yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amerejea.” Kitenzi cha Kiebrania cha “kurudi” kinajirudia katika mstari huu, kwa tendo la Orpa na katika amri kwa Ruthu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kwa miungu yake”; wengine hutafsiri “kwa mungu wake,” lakini huenda wingi huu unamaanisha miungu ya Moabu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Akasema
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kuendeleza simulizi na kutambulisha maneno ya Naomi, huku ikihifadhi mtiririko wa wayyiqtol ya Kiebrania.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira za Ruthu kwenye jambo lililotokea. “Tazama” ni la heshima, linaeleweka, na lina nguvu inayolingana na kiashiria cha Kiebrania.
- source_word: שָׁבָה
  choice: amerudi
  rationale: Kauli timilifu ya שוב inaonyesha kurudi ambako kumetimia. “Amerudi” ni ya asili na pia huwezesha mzizi huo huo kurudiwa katika amri inayofuata.
- source_word: יְבִמְתֵּךְ
  choice: shemeji yako
  rationale: Katika muktadha huu, neno hilo linamtaja mwanamke aliye katika uhusiano wa kindugu kwa njia ya ndoa. “Shemeji yako” ndilo neno la kawaida na linaloeleweka katika Kiswahili, na limerudiwa kwa uthabiti.
- source_word: אֶל עַמָּהּ
  choice: kwa watu wake
  rationale: עַם hapa inamaanisha jamii au watu wa kabila lake, si familia ya karibu tu. “Kwa watu wake” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: na kwa miungu yake
  rationale: Umbo la wingi linaelekea kutaja miungu ya Moabu katika muktadha huu. “Miungu yake” huhifadhi wingi na halichanganyi ibada hiyo na ibada ya Mungu wa Israeli.
- source_word: שׁוּבִי
  choice: Rudi
  rationale: Amri ya שוב kwa Ruthu imetafsiriwa kwa neno lilelile la msingi lililotumiwa kwa tendo la Orpa, hivyo kurudia kwa Kiebrania kunahifadhiwa kwa njia ya asili.
- source_word: אַחֲרֵי
  choice: ukamfuate
  rationale: Kiebrania kina picha ya Ruthu kwenda baada ya shemeji yake. “Ukamfuate” ni Kiswahili cha asili kinachohifadhi wazo la kufuata njia aliyochukua Orpa.
theological_decisions:
- issue: Tafsiri ya אֱלֹהֶיהָ kuhusu ibada ya Wamoabu
  choice: miungu yake
  alternative: mungu wake
  rationale: Ingawa אֱלֹהִים wakati mwingine inaweza kutumiwa kwa maana ya umoja, hapa umbo na mazingira ya kurudi kwa watu na dini ya Moabu yanaunga mkono wingi. Tafsiri hii huhifadhi maana inayowezekana zaidi bila kuingiza dhana ya ibada ya agano kwa BWANA.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi ya Biblia lakini si wa kizamani kupita kiasi. Kurudiwa kwa שוב kumehifadhiwa kwa “amerudi” na “Rudi,” na utata wa אֱלֹהֶיהָ umeelezwa katika tanbihi.
