base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: sw
  text: Rudini, binti zangu; nendeni, kwa maana nimezeeka sana nisiweze kuolewa[a]. Hata kama ningesema[b], ‘Bado nina tumaini’—hata kama ningekuwa na mume usiku huu na hata ningezaa wana—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nisiweze kuwa na mume.” Kiebrania ni halisi zaidi, “kutokana na kuwa kwa mwanamume/mume.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinaweka mfululizo wa hali za kudhaniwa: “Kwa maana, kama ningesema, ‘Nina tumaini,’ hata kama ningekuwa na mume usiku huu, na hata kama ningezaa wana—”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: Rudini
  rationale: Amri ya wingi kwa wanawake kutoka שוב; inaonyesha Naomi anawahimiza warudi walikotoka.
- source_word: בְנֹתַי
  choice: binti zangu
  rationale: Inadumisha jina la kifamilia na la upendo ambalo Naomi anatumia kwa wakwe zake.
- source_word: לֵכְנָה
  choice: nendeni
  rationale: Ni amri ya pili ya wingi kwa wanawake; tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: זָקַנְתִּי
  choice: nimezeeka mno
  rationale: Kauli timilifu inaonyesha hali ya sasa iliyotokana na kuzeeka; ‘mno’ huonyesha athari inayodokezwa na muktadha bila kubadili hoja.
- source_word: מִהְיוֹת לְאִישׁ
  choice: nisiweze kuwa na mume
  rationale: Kirai cha Kiebrania ni halisi ‘kuwa kwa mwanamume/mume’; ‘kuwa na mume’ ni Kiswahili cha kawaida kinachohifadhi maana ya hali ya ndoa.
- source_word: כִּי אָמַרְתִּי
  choice: Hata kama ningesema
  rationale: Hapa כִּי inaanzisha hali ya kudhaniwa katika mfululizo wa uwezekano usiotarajiwa, si sababu ya moja kwa moja.
- source_word: יֶשׁ לִי תִקְוָה
  choice: Bado nina tumaini
  rationale: Inawakilisha muundo wa kuwepo ‘kuna tumaini kwangu’ kwa Kiswahili cha kawaida; ‘bado’ huonyesha nguvu ya hoja kwamba tumaini hilo lingekuwapo hata sasa.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: hata kama ningekuwa na mume usiku huu
  rationale: Inahifadhi hali ya kudhaniwa, msisitizo wa ‘usiku huu,’ na nahau ya kuwa na mume bila kulazimisha maelezo ya ziada kuhusu sherehe ya ndoa.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: na hata ningezăa wana
  rationale: ילד inahusu kuzaa, na בָנִים ni wana wa kiume; lugha hiyo inadumishwa kwa sababu ni muhimu katika hoja ya ukoo na ndoa.
theological_decisions:
- issue: Kudumisha lugha mahsusi ya wana wa kiume katika muktadha wa kuendeleza ukoo
  choice: wana
  alternative: watoto
  rationale: Kiebrania kinasema wazi בָנִים, ‘wana,’ na hoja inayofuata inahusu wana ambao wangekua na kuwa waume wa Ruthu na Orpa; hivyo haifai kuifanya kuwa ‘watoto.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti na mstari unaoachwa wazi mwishoni umehifadhiwa kwa sababu sentensi na hoja ya Naomi zinaendelea katika mstari unaofuata.
