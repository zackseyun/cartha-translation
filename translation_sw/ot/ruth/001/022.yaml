base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: sw
  text: Basi Naomi akarudi pamoja na Ruthu, Mmoabu, binti-mkwe wake, aliyerudi kutoka mashamba ya Moabu.[a] Nao wakafika Bethlehemu mwanzoni mwa mavuno ya shayiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana pana, “nchi ya Moabu.” Kiebrania kinasema kihalisi, “mashamba ya Moabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב kina maana ya kurudi; “akarudi” ni tafsiri fupi na ya kawaida inayodumisha mwendelezo wa simulizi.
- source_word: הַמּוֹאֲבִיָּה
  choice: Mmoabu
  rationale: Kivumishi cha kike cha kikabila kimetumiwa kama jina la utambulisho; “Mmoabu” hudumisha msisitizo wa asili ya Ruthu.
- source_word: כַלָּתָהּ
  choice: mkwe wake
  rationale: “Mkwe” ni neno la kawaida la Kiswahili kwa binti-mkwe katika muktadha huu; kiwakilishi “wake” kinaonyesha uhusiano na Naomi.
- source_word: עִמָּהּ
  choice: pamoja naye
  rationale: Hutoa maana ya kuandamana na Naomi kwa Kiswahili cha kawaida.
- source_word: הַשָּׁבָה
  choice: aliyerudi pamoja naye
  rationale: Kivumishi-tendo hiki ni cha kike, umoja, na kwa kawaida humrejelea Ruthu. Muundo huu unahifadhi maelezo hayo huku ukieleza kwamba alifuatana na Naomi.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: kutoka mashamba ya Moabu
  rationale: שָׂדֶה humaanisha kihalisi “shamba”; wingi umehifadhiwa, huku tanbihi ikionyesha maana pana inayowezekana ya eneo au nchi.
- source_word: וְהֵמָּה בָּאוּ
  choice: Nao wakafika
  rationale: Kiwakilishi huru cha wingi kina msisitizo mdogo; “Nao” huudumisha, na “wakafika” ni ya asili zaidi kwa kufika mahali panapotajwa.
- source_word: בֵּית לֶחֶם
  choice: Bethlehemu
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: בִּתְחִלַּת קְצִיר שְׂעֹרִים
  choice: mwanzoni mwa mavuno ya shayiri
  rationale: Hutoa kwa uwazi kipindi cha kuanza kwa mavuno ya zao la shayiri kwa Kiswahili cha kawaida.
