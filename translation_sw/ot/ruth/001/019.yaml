base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: sw
  text: Basi, hao wawili wakaendelea na safari mpaka walipofika Bethlehemu. Walipofika Bethlehemu, mji wote ukataharuki kwa sababu yao, na wanawake wakasema, “Je, huyu ni Naomi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלַכְנָה
  choice: wakaendelea na safari
  rationale: Kitenzi katika mfululizo wa masimulizi kinaonyesha kuendelea kwa safari; usemi huu ni wa kawaida kwa Kiswahili na hauongezi jambo lisilokuwapo katika muktadha.
- source_word: שְׁתֵּיהֶם
  choice: hao wawili
  rationale: Inahifadhi msisitizo kwamba Naomi na Ruthu walisafiri pamoja wakiwa wawili.
- source_word: עַד בֹּאָנָה
  choice: mpaka walipofika
  rationale: עַד pamoja na בוא huonyesha mwisho wa safari; tafsiri hii ni wazi na ya asili katika Kiswahili.
- source_word: בֵּית לָחֶם
  choice: Bethlehemu
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili badala ya kutafsiriwa maana yake ya moja kwa moja.
- source_word: וַיְהִי כְּבֹאָנָה
  choice: Walipofika
  rationale: Muundo huu unaingiza tukio linalofuata kwa maana ya wakati; Kiswahili hakihitaji kutafsiri kwa ukavu ‘ikawa walipofika.’
- source_word: וַתֵּהֹם
  choice: ukataharuki
  rationale: Kitenzi המה kinaonyesha msukosuko au taharuki ya jamii. ‘Ukataharuki’ huwasilisha mwitikio mkubwa bila kudai kwamba kulitokea ghasia.
- source_word: כָּל הָעִיר
  choice: mji wote
  rationale: Huhifadhi wazo la mwitikio wa jumuiya nzima na ni usemi wa kawaida wa Kiswahili.
- source_word: עֲלֵיהֶן
  choice: kwa sababu yao
  rationale: Kihusishi עַל hapa kinaonyesha chanzo au sababu ya taharuki, yaani kuwasili kwao.
- source_word: וַתֹּאמַרְנָה
  choice: wanawake wakasema
  rationale: Umbo la kitenzi ni la wingi wa kike, hivyo kuwataja wanawake waziwazi kunahifadhi taarifa ya kisarufi ya Kiebrania.
- source_word: הֲזֹאת נָעֳמִי
  choice: Je, huyu ni Naomi?
  rationale: Swali hili la moja kwa moja linahifadhi mshangao wa kujaribu kumtambua bila kuongeza maneno ya kufasiri kama ‘kweli.’
