base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: sw
  text: Yahwe na awajalie mpate pumziko[a], kila mmoja katika nyumba ya mume wake.” Kisha akawabusu, nao wakapaza sauti zao na kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usalama” au “maisha yaliyotulia”; hapa neno la Kiebrania linalotafsiriwa “pumziko” linamaanisha hali ya utulivu na usalama katika nyumba ya mume.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: awajalie
  rationale: Kauli hii ya baraka au ombi inaelezwa kwa Kiswahili cha kawaida na chenye heshima kwa kutumia ‘awajalie’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa moja kwa moja katika maandishi ya Kiebrania.
- source_word: וּמְצֶאןָ
  choice: mpate
  rationale: Kitenzi kinaendeleza ombi la baraka; ‘mpate’ huunganika kwa kawaida na ‘awajalie’.
- source_word: מְנוּחָה
  choice: pumziko
  rationale: Neno hili huhifadhi maana ya msingi ya kupumzika au kutulia, huku muktadha ukionyesha maisha salama na yaliyotulia katika ndoa.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: kila mmoja wenu katika nyumba ya mume wake
  rationale: Muundo ni wa kugawa maana kwa wanawake hao wawili; ‘kila mmoja wenu’ huifanya maana hiyo iwe wazi bila kuiongezea.
- source_word: וַתִּשַּׁק לָהֶן
  choice: Kisha akawabusu
  rationale: ‘Kisha’ huwasilisha kwa kawaida mfuatano wa simulizi wa kitenzi cha Kiebrania.
- source_word: וַתִּשֶּׂאנָה קוֹלָן
  choice: wakapaza sauti zao
  rationale: Huhifadhi nahau ya Kiebrania ya kuinua sauti kwa kilio cha kusikika, na inaeleweka kwa urahisi katika Kiswahili.
- source_word: וַתִּבְכֶּינָה
  choice: na kulia
  rationale: Ni tafsiri ya moja kwa moja ya kitendo cha kulia, ikiungana kiasili na kupaza sauti.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Aya inatumia Tetragramatoni moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kulibadili kuwa cheo kama ‘BWANA’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Nahau ya Kiebrania ‘kupaza sauti’ imehifadhiwa kwa kuwa ni wazi katika Kiswahili; tanbihi inaeleza maana pana ya ‘pumziko’ katika muktadha wa ndoa.
