  text: Lakini wakamwambia, “La, tutarudi pamoja nawe kwa watu wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Lakini wakamwambia
  rationale: Kitenzi cha wingi wa kike pamoja na waw kinaendeleza simulizi; “Lakini” linaonyesha kwa kawaida utofauti kati ya jibu lao na agizo la Naomi lililotangulia, huku kiambishi -mw- kikimtaja Naomi kama anayesemeshwa.
- source_word: כִּי
  choice: La
  rationale: Katika jibu hili la moja kwa moja, כִּי linaweza kuonyesha msisitizo wa kupinga walichoambiwa. “La” ni jibu la heshima na la kawaida linalodhihirisha kukataa kwao kurudi bila Naomi.
- source_word: אִתָּךְ
  choice: pamoja nawe
  rationale: Kirai hiki kinaonyesha kuandamana na Naomi; “pamoja nawe” ni Kiswahili cha kawaida na huhifadhi msisitizo wa kuwa naye.
- source_word: נָשׁוּב
  choice: tutarudi
  rationale: Mzizi שׁוב humaanisha kurudi; “tutarudi” huhifadhi neno kuu linalorudiwa katika Ruthu 1.
- source_word: לְעַמֵּךְ
  choice: kwa watu wako
  rationale: עַם hapa inawahusu watu wa Naomi kama jamii yake, si jamaa wa karibu pekee. “Kwa watu wako” ni usemi wa kawaida wa Kiswahili unaoonyesha mahali walipo watu hao.
