base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/014.yaml
  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: sw
  text: Ndipo wakapaza sauti zao, wakalia tena. Orpa akambusu mama mkwe wake,[a] lakini Ruthu akashikamana naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na Ruthu akashikamana naye.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “na,” lakini muktadha unaonyesha tofauti kati ya busu la Orpa na kuendelea kwa Ruthu kushikamana naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: wakapaza sauti zao
  rationale: Nahau ya Kiebrania ina maana halisi ya kuinua sauti; “kupaza sauti” ni Kiswahili cha kawaida kinachoonyesha kilio cha kusikika bila kufafanua kupita kiasi.
- source_word: וַתִּבְכֶּינָה
  choice: wakalia
  rationale: Kitenzi kinaonyesha kulia kwa machozi; uchaguzi huu ni wa kawaida na unaendana na simulizi.
- source_word: עוֹד
  choice: tena
  rationale: Katika muktadha, kielezi hiki kinaonyesha kurudiwa kwa kilio kilichotajwa awali.
- source_word: וַתִּשַּׁק
  choice: akambusu
  rationale: Kitenzi kina maana ya kumbusu, na kiambishi cha yambwa kinamrejelea mama mkwe.
- source_word: לַחֲמוֹתָהּ
  choice: mama mkwe wake
  rationale: Nomino humaanisha hasa mama mkwe; kiambishi cha nafsi ya tatu umoja wa kike kinamrejelea Orpa.
- source_word: דָּבְקָה בָּהּ
  choice: akashikamana naye
  rationale: “Kushikamana” huhifadhi maana ya kuwa karibu na kutomwacha mtu, pamoja na nguvu ya kihisia ya דבק, bila kuingiza maana ya kiteolojia isiyotajwa wazi.
- source_word: וְ
  choice: lakini
  rationale: Ingawa kiunganishi cha Kiebrania kwa kawaida ni “na,” muktadha unaonyesha tofauti kati ya busu la Orpa na kushikamana kwa Ruthu.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: רוּת
  choice: Ruthu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa kishazi cha Ruthu na tendo la Orpa
  choice: lakini Ruthu akashikamana naye
  alternative: na Ruthu akashikamana naye
  rationale: Kiunganishi וְ kinaweza kutafsiriwa moja kwa moja kuwa “na,” lakini mwendelezo wa simulizi unaashiria utofautishaji. Tanbihi inadumisha uwezekano wa kimuundo wa tafsiri nyingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. “Wakapaza sauti zao” huhifadhi nahau ya chanzo kwa namna inayoeleweka, na “akashikamana naye” huepuka lugha nzito au ya kimadhehebu.
