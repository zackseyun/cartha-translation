  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: sw
  text: Niliondoka nikiwa nimejaa, lakini Yahwe amenirudisha nikiwa mtupu. Kwa nini mnaniita Naomi, ilhali Yahwe ameshuhudia dhidi yangu[a], na Mwenyezi ameniletea maafa[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amenitesa.” Kitenzi cha Kiebrania kinaweza kumaanisha kujibu au kushuhudia dhidi ya mtu; katika muktadha huu pia kinaweza kueleweka kuwa kumtesa au kumtaabisha.
    reason: lexical_alternative
  - marker: b
    text: Au, “amenitendea mabaya.” Usemi wa Kiebrania unahusu kusababisha madhara, shida, au maafa; haumaanishi lazima kutenda uovu wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: nikiwa nimejaa
  rationale: Inahifadhi sitiari ya hali yake ya awali na utofautishaji wa moja kwa moja na רֵיקָם, bila kufafanua kimabavu kama alimaanisha familia, mali, au vyote.
- source_word: הָלַכְתִּי
  choice: Niliondoka
  rationale: Katika muktadha huu kitenzi cha kwenda kinaonyesha kuondoka kwake Bethlehemu; “niliondoka” ni Kiswahili cha kawaida na wazi.
- source_word: וְרֵיקָם
  choice: nikiwa mtupu
  rationale: Inahifadhi mkazo na sitiari ya Kiebrania inayokinzana na “nikiwa nimejaa.” “Bila kitu” au “mikono mitupu” zingeweza kueleweka, lakini zingefafanua maana zaidi.
- source_word: הֱשִׁיבַנִי
  choice: amenirudisha
  rationale: Hifili ya שוב ina maana ya kusababisha mtu arudi; “amenirudisha” ni ya asili na inadumisha uwakala wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa na cheo, hivyo kutunza hadhi yake kama jina binafsi.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: Kwa nini mnaniita Naomi
  rationale: Wingi wa kike katika kitenzi unaelekezwa kwa wanawake wa Bethlehemu; Kiswahili hakihitaji kuonyesha jinsia hiyo katika umbo la kitenzi.
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Jina la mtu limetoholewa. Maana yake inayohusiana na uzuri au kupendeza haijaingizwa katika matini kuu.
- source_word: עָנָה בִי
  choice: ametoa ushahidi dhidi yangu
  rationale: Inawakilisha maana ya kimahakama ya kujibu au kushuhudia dhidi ya mtu, huku tanbihi ikihifadhi uwezekano wa kuielewa kama kutesa au kutaabisha.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Cheo cha Mungu kimetafsiriwa kwa neno la Kiswahili linaloonyesha uwezo mkuu, badala ya kutoholewa kama Shaddai.
- source_word: הֵרַע לִי
  choice: ameniletea maafa
  rationale: Inaonyesha kwa uwazi kuwa Naomi anahusisha mateso yake na tendo la Mungu, bila kutumia usemi “amenitendea uovu,” ambao kwa Kiswahili unaweza kudokeza kwamba Mungu ametenda dhambi.
theological_decisions:
- issue: Kauli ya Naomi kuhusu tendo la Mungu katika mateso yake
  choice: Kudumisha uwakala wa Mungu kwa usemi “Yahwe ametoa ushahidi dhidi yangu” na “Mwenyezi ameniletea maafa.”
  alternative: Kulainisha kuwa Mungu aliruhusu tu maafa yampate, au kutafsiri עָנָה moja kwa moja kuwa “amenitesa.”
  rationale: Kiebrania kinahusisha Yahwe na Shaddai moja kwa moja na hali chungu ya Naomi. Tafsiri inadumisha mvutano huo wa kiteolojia bila kuugeuza kuwa ruhusa isiyo ya moja kwa moja; pia “maafa” huepuka kudokeza uovu wa kimaadili kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “nimejaa/mtupu” umehifadhiwa kwa makusudi ili kudumisha sitiari na ukinzani mkali wa Kiebrania. Viashiria [a] na [b] vimewekwa kwenye vifungu vinavyohusika moja kwa moja.
