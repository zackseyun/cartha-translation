  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: sw
  text: Naomi alipoona kwamba Ruthu alikuwa ameazimia kwenda pamoja naye, aliacha kusema naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: alipoona
  rationale: Muundo huu unaendeleza simulizi huku ukionyesha uhusiano wa wakati kati ya kuona kwa Naomi na kitendo kilichofuata.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha jambo ambalo Naomi alitambua, yaani azimio la Ruthu.
- source_word: מִתְאַמֶּצֶת
  choice: alikuwa ameazimia
  rationale: Hitpaeli ya אמץ inaonyesha mtu kujitia nguvu au kuwa thabiti; ‘ameazimia’ ni Kiswahili cha kawaida kinachoonyesha uamuzi imara.
- source_word: לָלֶכֶת אִתָּהּ
  choice: kwenda pamoja naye
  rationale: הלד katika muktadha wa safari ni ‘kwenda,’ na אִתָּהּ inaonyesha kuandamana na Naomi.
- source_word: וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ
  choice: aliacha kusema naye
  rationale: Tafsiri hii inadumisha maana ya msingi ya kuacha kusema na haiongezi kwamba Naomi aliacha ‘kumsihi’ au ‘kumshawishi,’ jambo ambalo muktadha unaweza kudokeza lakini Kiebrania halisemi wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ‘Naomi’ na ‘Ruthu’ yametumiwa kuondoa utata wa viwakilishi ambao ungekuwa mkubwa zaidi katika Kiswahili, bila kubadili wahusika au mantiki ya mstari. Kauli ‘aliacha kusema naye’ imeachwa kwa upana wake wa Kiebrania badala ya kufasiri yaliyokuwa yakisemwa.
