base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: sw
  text: Lakini Naomi akasema, “Rudini, binti zangu. Kwa nini mwende pamoja nami? Je, bado nina wana tumboni mwangu ili wawe waume zenu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lakini Naomi akasema
  rationale: Waw-consecutive inaendeleza simulizi, lakini katika muktadha huu kauli ya Naomi inapingana na kusudi lao la kwenda naye; “Lakini” huwasilisha uhusiano huo wa kimazungumzo kwa Kiswahili cha kawaida.
- source_word: שֹׁבְנָה
  choice: Rudini
  rationale: Kitenzi שוב hapa ni amri kwa wanawake wawili ya kugeuka na kurudi; “Rudini” ni fupi, wazi, na ya kawaida.
- source_word: בְנֹתַי
  choice: binti zangu
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania na inaonyesha upendo wa kifamilia wa Naomi kwa wakwe zake bila kuhitaji ufafanuzi katika matini.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: Kwa nini mwende pamoja nami?
  rationale: Umbo la imperfect katika swali hili la balagha linaweza kutolewa kwa subjunctive ya Kiswahili “mwende,” ambayo huonyesha kupinga pendekezo hilo kwa njia ya kawaida.
- source_word: הַעוֹד לִי
  choice: Je, bado nina
  rationale: עוד pamoja na kiwakilishi cha mwenye kitu huonyesha kuendelea kwa kuwapo au umiliki; “bado nina” ni Kiswahili wazi na cha asili.
- source_word: בָנִים
  choice: wana
  rationale: Kiebrania kinataja wana wa kiume, jambo muhimu kwa hoja ya ndoa inayofuata; “wana” huhifadhi umahususi huo.
- source_word: בְּמֵעַי
  choice: tumboni mwangu
  rationale: Neno hilo linaweza kumaanisha sehemu za ndani au tumbo la uzazi; katika muktadha wa kuzaa wana, “tumboni mwangu” ni usemi wa kawaida unaohifadhi taswira ya chanzo.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: ambao watakuwa waume zenu
  rationale: Kifungu hiki kihalisi hueleza wana hao kuwa waume wao; “watakuwa waume zenu” huhifadhi maana ya ndoa na nguvu ya swali la dhahania bila kuingiza maelezo ya ziada.
theological_decisions:
- issue: Dokezo la desturi ya ndoa inayomhusu mjane
  choice: Kuacha hoja ikiwa swali la dhahania kuhusu wana wa Naomi kuwa waume zao
  alternative: Kufafanua moja kwa moja kwamba inahusu ndoa ya kurithi mjane au wajibu wa jamaa
  rationale: Mstari wenyewe hautaji kwa jina desturi maalumu; tafsiri huhifadhi dokezo la kijamii na mvutano wa simulizi bila kuingiza mfumo wa kitheolojia au kisheria usioelezwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Binti zangu” ni usemi wa kawaida wa upendo wa kifamilia na unaeleweka katika muktadha kuwa anawaambia wakwe zake. Hakuna tanbihi inayohitajika, hivyo hakuna alama ya tanbihi katika matini.
