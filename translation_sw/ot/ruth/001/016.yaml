base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: sw
  text: Lakini Ruthu akasema, “Usinisihi[a] nikuache, nirudi nyuma nisikufuate tena. Kwa maana uendako nitaenda, na ulalapo[b] nitalala. Watu wako watakuwa watu wangu, na Mungu wako atakuwa Mungu wangu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Usinishinikize,” “usinisihi sana,” au “usinisistizie.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha kukaa au kulala mahali usiku.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, maneno “Watu wako watu wangu, na Mungu wako Mungu wangu” hayana kitenzi kinacholingana na “kuwa”; yanaweza kueleweka kwa maana ya sasa au ya wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: Usinisihi
  rationale: Katika muundo huu, פגע ב ina maana ya kumsihi au kumsisitizia mtu. “Usinisihi” ni Kiswahili cha kawaida kinachoonyesha ombi la Ruthu kwamba Naomi aache kumshawishi arudi, bila kudokeza mguso wa kimwili au uadui.
- source_word: לְעָזְבֵךְ
  choice: nikuache
  rationale: עזב hapa humaanisha kuondoka kwa mtu au kumwacha. “Nikuache” ni ya kawaida na haiongezi uzito wa maana ya kutelekeza ambao muktadha haulazimishi.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: nirudi nisikufuate
  rationale: Maneno ya Kiebrania yana wazo la kurudi kutoka nyuma ya Naomi, yaani kuacha kumfuata. Kiswahili hiki cha kawaida kinahifadhi tendo la kurudi na uhusiano wake na kumfuata Naomi.
- source_word: כִּי
  choice: Kwa maana
  rationale: כִּי inaanzisha sababu ya ombi la Ruthu; “Kwa maana” huonyesha uhusiano huo kwa uwazi na kwa hadhi.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: uendako nitaenda
  rationale: Muundo huu wa Kiswahili ni mfupi, wa kawaida, na unahifadhi usambamba wa kishairi wa chanzo.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: ulalapo nitalala
  rationale: לון hasa ni kukaa au kulala mahali usiku. “Ulalapo nitalala” ni usemi wa asili wa Kiswahili na unadumisha usambamba wa kauli.
- source_word: עַמֵּךְ עַמִּי
  choice: Watu wako watakuwa watu wangu
  rationale: Kishazi cha Kiebrania hakina kitenzi kinacholingana na “kuwa.” Wakati ujao unafaa katika muktadha wa ahadi ya Ruthu, bila kuondoa uwezekano wa kukisoma kama utambulisho wa sasa.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: na Mungu wako atakuwa Mungu wangu
  rationale: Muundo wa umoja na muktadha humwelekeza Mungu wa Naomi. Kurudia “atakuwa” hufanya Kiswahili kiwe wazi na chenye usambamba, huku tanbihi ikihifadhi hali ya vishazi vya Kiebrania visivyo na kitenzi.
theological_decisions:
- issue: 'Vishazi vya utambulisho visivyo na kitenzi: עַמֵּךְ עַמִּי וֵאלֹהַיִךְ אֱלֹהָי'
  choice: 'Kutumia wakati ujao katika vishazi vyote viwili: “watakuwa” na “atakuwa.”'
  alternative: “Watu wako ni watu wangu, na Mungu wako ni Mungu wangu,” au muundo mfupi usio na kitenzi.
  rationale: Kiebrania hakibainishi wakati kwa kitenzi katika vishazi hivi. Wakati ujao unaonyesha kwa kawaida ahadi ambayo Ruthu anaitoa katika muktadha, lakini tanbihi inaweka wazi uwezekano wa maana ya sasa na hivyo haiamui kimya kimya utata wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya usemi wa kiapo. Usambamba wa “uendako nitaenda, na ulalapo nitalala” umehifadhiwa. Jina limetolewa kama “Ruthu,” umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
