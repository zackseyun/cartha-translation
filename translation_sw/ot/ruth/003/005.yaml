  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Naye akamwambia
  rationale: Kitenzi cha wayyiqtol kinaendeleza simulizi kwa wakati uliopita. Muundo “akamwambia” ni wa kawaida katika Kiswahili cha simulizi na unaunganisha kitendo hiki na kilichotangulia.
- source_word: אֵלֶיהָ
  choice: -mw- katika “akamwambia”
  rationale: Kihusishi אֶל chenye kiambishi cha nafsi ya tatu umoja wa kike kinaonyesha anayeelekezewa maneno. Kiswahili huiwakilisha kwa kawaida kwa kiambishi yambwa ndani ya kitenzi.
- source_word: כֹּל אֲשֶׁר
  choice: Yote
  rationale: Muundo huu unaonyesha ujumla wa mambo yatakayosemwa. “Yote” ni wa asili na wazi katika Kiswahili bila kuongeza maana.
- source_word: תֹּאמְרִי
  choice: utakayosema
  rationale: Qal imperfect ya nafsi ya pili umoja wa kike inahusu maagizo ambayo Naomi atatoa. Muundo wa wakati ujao wa uhusiano “utakayosema” unaeleza maana hiyo kwa kawaida katika Kiswahili.
- source_word: אֶעֱשֶׂה
  choice: nitafanya
  rationale: Qal imperfect ya nafsi ya kwanza umoja inaonyesha azimio la Ruthu. “Nitafanya” ni tafsiri ya moja kwa moja na haiingizi yambwa lisilo wazi katika Kiebrania.
