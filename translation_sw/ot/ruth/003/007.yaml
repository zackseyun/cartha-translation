base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: sw
  text: Boazi akala, akanywa, moyo wake ukachangamka[a], kisha akaenda kujilaza ukingoni mwa lundo la nafaka. Ndipo Ruthu akaja kimya-kimya, akafunua miguu ya Boazi[b], akalala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wake ukawa na furaha” au “akawa katika hali nzuri.” Usemi wa Kiebrania unaonyesha uchangamfu, lakini wenyewe haulazimishi maana ya kwamba alikuwa amelewa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “akafunua miguu yake.” Baadhi ya wafafanuzi huona hili kuwa tendo halisi tu, huku wengine wakiona huenda kuna dokezo lenye maana ya kingono. Maneno ya Kiebrania yenyewe yana kiasi na hayasemi wazi kwamba tendo la ngono lilitokea.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: akala
  rationale: Kauli ya usimulizi inatafsiriwa kwa wakati uliopita wa Kiswahili bila kuongeza maana ya kwamba alikuwa amemaliza kula kabla ya tendo linalofuata.
- source_word: וַיֵּשְׁתְּ
  choice: na kunywa
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi 'kunywa'; muktadha hautaji kufafanua alichokunywa wala kudokeza ulevi.
- source_word: וַיִּיטַב לִבּוֹ
  choice: akawa na moyo wa furaha
  rationale: Huhifadhi taswira ya Kiebrania kuhusu moyo kuwa katika hali nzuri huku ikieleweka kwa Kiswahili cha sasa; haidai kwamba Boazi alikuwa amelewa.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: akaenda kulala
  rationale: Katika usimulizi wa Kiswahili, mwendo huu unaelezwa kwa kawaida kwa 'akaenda.' Hapa 'kulala' humaanisha kujilaza, bila kulazimisha wazo kwamba tayari alikuwa usingizini.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: pembeni mwa lundo la nafaka
  rationale: קצה ni ukingo au mwisho, na עֲרֵמָה katika muktadha huu ni lundo la nafaka kwenye uwanja wa kupuria.
- source_word: בַלָּט
  choice: kimya-kimya
  rationale: Hutoa maana ya kuja kwa utulivu na kwa siri bila kuingiza hukumu kali ya kimaadili.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: akafunua miguu yake
  rationale: 'Huhifadhi usemi wa moja kwa moja wa Kiebrania na kutatua kiwakilishi kwa muktadha: miguu ni ya Boazi. Haitangulizi tafsiri ya kingono.'
- source_word: וַתִּשְׁכָּב
  choice: akilala
  rationale: Ni tafsiri rahisi ya tendo la kujilaza; mstari wenyewe hausemi wazi kwamba kulikuwa na tendo la ngono.
theological_decisions:
- issue: Ikiwa matendo ya Ruthu katika mstari huu yadokeze wazi tendo la ngono
  choice: 'Kuhifadhi maelezo halisi na yenye kiasi: alifunua miguu ya Boazi, kisha akalala.'
  alternative: Kutafsiri kwa namna inayodokeza moja kwa moja utongozaji au tendo la ngono.
  rationale: Kiebrania kinaeleza kuja kwake kimya-kimya, kufunua miguu ya Boazi, na kulala. Kwa kuwa hakisemi wazi kwamba tendo la ngono lilitokea, tafsiri haiongezi hitimisho hilo na inaacha mvutano wa kifasiri uliomo katika simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi vya -ka- unafaa usimulizi. Jina 'Ruthu' limetajwa badala ya kiwakilishi pekee ili rejeleo liwe wazi kwa msomaji wa mstari huu, huku hakuna maelezo ya ziada ya kifasiri yaliyoingizwa.
