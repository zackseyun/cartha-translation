  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: sw
  text: Sasa basi, binti yangu, usiogope. Yote utakayosema nitakufanyia, kwa maana watu wote wa mji wangu[a] wanajua kwamba wewe ni mwanamke mwenye sifa njema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “lango lote la watu wangu.” Katika Israeli ya kale, lango la mji lilikuwa mahali pa shughuli za umma, mashauri, na taratibu za kisheria; hapa “lango” humaanisha jumuiya yote ya mji.
    reason: cultural_note
  - marker: b
    text: Au, “mwanamke hodari,” “mwanamke anayestahili,” au “mwanamke bora.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: binti yangu
  rationale: Inahifadhi namna ya karibu na yenye ulinzi ya Boazi kumwita Ruthu, bila kudokeza lazima kuwa ni binti yake wa kuzaa.
- source_word: אַל תִּירְאִי
  choice: usiogope
  rationale: Ni katazo lenye kutia moyo, na kauli hii ni ya kawaida, fupi, na yenye heshima katika Kiswahili.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: Yote utakayosema nitakufanyia
  rationale: Inadumisha kitenzi cha Kiebrania ‘kusema’ badala ya kukifasiri kwa upana mdogo kuwa ‘kuomba,’ ingawa muktadha unaonyesha ombi.
- source_word: כָּל שַׁעַר עַמִּי
  choice: watu wangu wote langoni
  rationale: ‘Lango’ limetumiwa kimetonimia kwa watu waliokusanyika katika mahali pa shughuli za umma na kisheria. Kiswahili hiki ni cha asili zaidi kuliko tafsiri ya neno kwa neno ‘lango lote la watu wangu,’ huku picha ya lango ikihifadhiwa.
- source_word: אֵשֶׁת חַיִל
  choice: mwanamke mwenye sifa bora
  rationale: Kauli hii hujumuisha ustahili, uwezo, nguvu ya tabia, na heshima. ‘Mwenye sifa bora’ huwasilisha sifa njema inayotambuliwa hadharani bila kuifupisha kuwa uadilifu wa kimaadili pekee au kuipa maana ya kijeshi tu.
theological_decisions:
- issue: Jinsi ya kutafsiri sifa אֵשֶׁת חַיִל
  choice: mwanamke mwenye sifa bora
  alternative: mwanamke hodari; mwanamke anayestahili; mwanamke bora
  rationale: Chaguo hili linahifadhi upana wa sifa ya Ruthu—ustahili, uwezo, nguvu, na uadilifu—bila kuingiza fundisho la dhehebu wala kuifungia kauli hiyo katika maana moja tu. Njia nyingine halali zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya heshima, na inayoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku taswira ya ‘lango’ na upana wa אֵשֶׁת חַיִל vikihifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
