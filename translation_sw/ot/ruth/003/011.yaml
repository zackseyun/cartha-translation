  to: Sasa basi, binti yangu, usiogope. Yote utakayosema nitakufanyia, kwa maana watu wote wa mji wangu[a] wanajua kwamba wewe ni mwanamke mwenye sifa njema.[b]
  rationale: The revision renders the Hebrew gate-metonym as the whole town in natural Swahili and explains the literal civic-gate imagery in a properly anchored note. It also improves idiom while retaining the source’s warm address, broad promise, and commendation of Ruth’s publicly recognized worth.
