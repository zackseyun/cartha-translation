reference: Ruth 3:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: sw
  text: Na sasa, je, Boazi si jamaa yetu[a], ambaye ulikuwa pamoja na wasichana wake[b]? Tazama, usiku wa leo anapepeta shayiri kwenye uwanja wa kupuria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wa ukoo wetu.” Neno la Kiebrania linaweza kumaanisha mtu aliye na uhusiano wa kifamilia au wa ukoo, wala si mtu anayefahamika tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “watumishi wake wa kike.” Neno la Kiebrania linaweza kumaanisha wafanyakazi au wahudumu wa kike wa Boazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na maana ya wakati ya עַתָּה, huku ikianzisha hatua inayofuata katika mpango wa Naomi kwa Kiswahili cha kawaida.
- source_word: הֲלֹא
  choice: je, ... si
  rationale: Muundo huu wa swali la balagha unatarajia jibu la kukubali na ni wa asili katika Kiswahili.
- source_word: מֹדַעְתָּנוּ
  choice: jamaa yetu
  rationale: Katika muktadha huu neno linaashiria uhusiano wa kifamilia au wa ukoo, si mtu anayefahamika tu.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: ambaye ulikuwa pamoja na wasichana wake
  rationale: Inahifadhi kishazi cha uhusiano na ushirika wa Ruthu na wanawake vijana wa Boazi bila kulazimisha maana ya utumwa; katika muktadha wao ni wafanyakazi au wahudumu wake.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linavuta fikira kwenye hali ya karibu na kudumisha lugha yenye hadhi bila kuwa ngumu kueleweka.
- source_word: זֹרֶה
  choice: anapepeta
  rationale: Kauli endelevu inawakilisha vizuri participle ya Kiebrania, ambayo inaonyesha shughuli ya sasa au iliyokaribia kufanyika.
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: anapepeta shayiri kwenye uwanja wa kupuria
  rationale: Ingawa muundo wa Kiebrania kwa karibu unasema ‘uwanja wa kupuria wa shayiri,’ maana ya kitendo ni kwamba shayiri ndiyo inayopепetwa kwenye uwanja wa kupuria. Kiswahili hiki kinaeleza tendo kwa usahihi na kwa kawaida.
- source_word: הַלָּיְלָה
  choice: usiku wa leo
  rationale: Ni namna ya kawaida na wazi ya kuwasilisha wakati unaomaanishwa na kielezi hiki.
