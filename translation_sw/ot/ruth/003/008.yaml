  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: sw
  text: Ikawa usiku wa manane, yule mtu akashtuka, akajigeuza[a]; na tazama, mwanamke alikuwa amelala miguuni pake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, akajipinda au akajizungusha. Kitenzi cha Kiebrania ni adimu na huenda kinaonyesha kwamba alisogea, alijipinda, au alijizungusha kwa mshtuko.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha “mahali pa miguu yake,” yaani eneo la miguu au sehemu ya chini ya miguu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi mwendelezo wa simulizi unaoletwa na wayyiqtol ya היה kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: usiku wa manane
  rationale: Ni usemi wa kawaida wa Kiswahili kwa katikati ya usiku na unawakilisha rejeo la wakati kwa ufupi.
- source_word: וַיֶּחֱרַד
  choice: akashtuka
  rationale: חרד huonyesha mwitikio wa ghafla unaoweza kuhusisha hofu, mshtuko, au kutetemeka. Katika muktadha huu, ‘akashtuka’ ni ya asili na haibainishi sababu zaidi ya inavyoruhusu matini.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: איש humrejelea Boazi kama mwanamume katika simulizi; ‘yule mtu’ hudumisha rejeo hilo bila kuingiza maana ya mume.
- source_word: וַיִּלָּפֵת
  choice: na kujigeuza
  rationale: Kitenzi hiki ni adimu na mwendo kamili unaokusudiwa hauna uhakika. ‘Kujigeuza’ ni tafsiri ya tahadhari inayoonyesha mwendo wa mwili bila kuufafanua kupita kiasi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: הנה huonyesha ugunduzi wa ghafla au mshangao. ‘Na tazama’ huhifadhi nguvu hiyo ya kisimulizi kwa lugha yenye hadhi na inayoeleweka.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: Neno אשה hapa humaanisha mwanamke, si mke.
- source_word: שֹׁכֶבֶת
  choice: alikuwa amelala
  rationale: Kauli ya kushiriki huonyesha hali iliyoendelea wakati Boazi alipogundua uwepo wake; muundo huu wa Kiswahili unaonyesha hali hiyo kwa kawaida.
- source_word: מַרְגְּלֹתָיו
  choice: miguuni pake
  rationale: Hii ndiyo tafsiri ya kawaida ya mahali karibu na miguu yake, huku maelezo ya chini yakihifadhi uwezekano wa maana pana inayohusu eneo la miguu au sehemu ya chini ya miguu.
theological_decisions:
- issue: Uwezekano wa kulisoma tukio hili kama dokezo la kingono
  choice: Kueleza moja kwa moja kwamba mwanamke alikuwa amelala miguuni pa Boazi.
  alternative: Kutumia usemi wenye dokezo zaidi, kama ‘karibu na sehemu ya chini ya miguu yake,’ ili kusisitiza uwezekano wa maana fiche.
  rationale: Kiebrania hakisemi wazi kwamba tendo la kingono lilitokea. Tafsiri inahifadhi mvutano wa simulizi bila kuingiza hukumu ya kimaadili au hitimisho la kitheolojia lisilotajwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Usiku wa manane’ na ‘miguuni pake’ ni misemo ya kawaida; ‘na tazama’ imehifadhiwa ili kuonyesha mshangao wa ghafla wa simulizi. Alama zote za maelezo ya chini zimewekwa mahali zinapohusika katika matini kuu.
