  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, chenye hadhi na kinachoeleweka kwa urahisi. Tafsiri inadumisha swali la balagha na taswira ya Kiebrania ya “mahali pa kupumzika,” huku tanbihi ikifafanua maana zake zinazowezekana.
