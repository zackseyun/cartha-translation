base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: sw
  text: Kisha Naomi, mama mkwe wake, akamwambia, “Binti yangu, je, nisikutafutie mahali pa kupumzika[a], ili upate hali njema?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pumziko,” “usalama,” au “makao.” Katika muktadha huu Naomi anatafuta ustawi wa kudumu wa Ruthu, huenda kupitia ndoa, lakini Kiebrania kinasema “mahali pa kupumzika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; “Kisha” ni ya kawaida katika Kiswahili cha masimulizi, na “akamwambia” inaonyesha wazi anayeelekezewa maneno.
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: חֲמוֹתָהּ
  choice: mama mkwe wake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu ya kike inamtambulisha Naomi kwa uhusiano wake na Ruthu. “Mama mkwe” ni Kiswahili cha kawaida na sahihi.
- source_word: בִּתִּי
  choice: Binti yangu
  rationale: Inahifadhi mwito wa kifamilia wenye upendo bila kuongeza hisia ambazo hazijasemwa wazi katika Kiebrania.
- source_word: הֲלֹא
  choice: je, nisi-
  rationale: Muundo huu unawasilisha swali la balagha linalotarajia jibu la kukubali, kwa Kiswahili cha asili.
- source_word: אֲבַקֶּשׁ
  choice: nikutafutie
  rationale: Kitenzi בקש humaanisha kutafuta. Umbo la kutendea linaonyesha kwamba Naomi anatafuta kwa manufaa ya Ruthu, kama inavyoonyeshwa na לָךְ.
- source_word: מָנוֹחַ
  choice: mahali pa kupumzika
  rationale: Inahifadhi taswira ya mahali au hali ya pumziko na utulivu, bila kutaja ndoa moja kwa moja ingawa muktadha unaielekea.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: ili upate mema
  rationale: Ni usemi wa Kiswahili unaoeleza matokeo yenye manufaa na ustawi wa Ruthu, badala ya wema wa kinadharia tu.
