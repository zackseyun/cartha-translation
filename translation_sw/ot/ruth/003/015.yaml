base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: sw
  text: Kisha akasema, “Leta vazi la kujifunika lililo juu yako, ukishike.” Basi akakishika. Akapima vipimo sita vya shayiri[a], akaviweka juu yake. Kisha Boazi akaingia mjini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “shayiri sita”; kipimo hakikutajwa, kwa hiyo neno “vipimo” limeongezwa ili maana iwe wazi.'
    reason: lexical_alternative
  - marker: b
    text: Andiko la Kimasora linasema kwamba Boazi ndiye aliyeingia mjini. Baadhi ya matoleo ya kale na tafsiri nyingi husoma kwamba Ruthu ndiye aliyeingia mjini.
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: Leta
  rationale: Ni amri kwa mwanamke inayomtaka Ruthu atoe vazi alilokuwa amevaa; “leta” ni ya kawaida na inafaa muktadha.
- source_word: הַמִּטְפַּחַת
  choice: vazi la kujifunika
  rationale: Neno hili linamaanisha vazi au kitambaa kikubwa cha kujifunika, ambacho hapa kinatumika kubebea nafaka. Tafsiri hii huepuka kudokeza kimakosa kitambaa chepesi cha uso.
- source_word: וְאֶחֳזִי בָהּ
  choice: ulitandaze na kulishika
  rationale: Kitenzi chenyewe humaanisha kushika; “kulitandaza” linaeleza kwa kiasi kidogo tendo linalohitajika ili vazi lipokee shayiri, huku “kulishika” likihifadhi maana ya moja kwa moja.
- source_word: וַיָּמָד
  choice: akapima
  rationale: Huhifadhi tendo la kupima na kutenga kiasi cha nafaka.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: vipimo sita vya shayiri
  rationale: Kiebrania kinasema kihalisi “shayiri sita” bila kutaja kipimo. “Vipimo” linaongezwa kwa uwazi bila kubainisha kipimo kisichotajwa.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: na kumwekea mzigo huo
  rationale: Kishazi kinaeleza kuwekwa kwa shayiri iliyopimwa juu ya Ruthu ili aibebe. “Mzigo huo” hutaja kwa kawaida kile kinachorejelewa kwa umoja wa ujumla.
- source_word: וַיָּבֹא הָעִיר
  choice: Kisha akaingia mjini
  rationale: Kitenzi katika Andiko la Kimasora ni cha jinsia ya kiume, hivyo mhusika katika matini kuu ni Boazi; tofauti ya “akaingia” haionyeshi jinsia kwa Kiswahili, kwa hiyo tanbihi inabainisha jambo hilo.
theological_decisions:
- issue: Mhusika wa kishazi cha mwisho וַיָּבֹא הָעִיר
  choice: Boazi ndiye aliyeingia mjini
  alternative: Ruthu ndiye aliyeingia mjini
  rationale: Hili ni suala la kimatini na kifasiri, si fundisho la dhehebu. Andiko la Kimasora lina kitenzi cha kiume; baadhi ya matoleo ya kale yana usomaji unaomrejelea Ruthu. Kwa kuwa Kiswahili hakionyeshi jinsia katika “akaingia,” tanbihi huhifadhi tofauti hiyo kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. “Vazi la kujifunika” limechaguliwa badala ya neno linaloweza kudokeza pazia jepesi; muundo wa masimulizi umehifadhiwa kwa sentensi fupi na za asili.
