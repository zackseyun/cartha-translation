  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: sw
  text: Jioshe[a], ujipake mafuta, na uvae vazi lako[b]; kisha ushuke kwenda kwenye uwanja wa kupuria[c]. Usijitambulishe kwa huyo mwanamume mpaka atakapomaliza kula na kunywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Jioge.” Kitenzi cha Kiebrania kinaweza kumaanisha kuosha au kuoga mwili.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinataja vazi kwa ujumla, huenda vazi la nje. Tafsiri nyingine hufafanua zaidi kuwa mavazi bora au ya sherehe.
    reason: lexical_alternative
  - marker: c
    text: 'Umbo la konsonanti katika Kiebrania si la kawaida hapa; kutokana na muktadha, kwa kawaida linaeleweka kuwa mwendelezo wa agizo la Naomi kwa Ruthu: “ushuke kwenda kwenye uwanja wa kupuria.”'
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: Jioshe
  rationale: Kitenzi רחץ kinaweza kumaanisha kuosha au kuoga mwili. “Jioshe” ni Kiswahili cha kawaida na kinahifadhi maana ya tendo linalomrejelea mhusika mwenyewe.
- source_word: וָסַכְתְּ
  choice: ujipake mafuta
  rationale: סוך humaanisha kujipaka au kutiwa mafuta/manukato. “Ujipake mafuta” ni sahihi na inaeleweka bila kuongeza wazo lisilo wazi la marashi.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: uvae vazi lako
  rationale: שִׂמְלָה ni neno la jumla kwa vazi, mara nyingi vazi la nje. “Vazi lako” huhifadhi ujumla huo bila kuongeza kwamba lilikuwa vazi bora au la sherehe.
- source_word: וירדתי הַגֹּרֶן
  choice: kisha ushuke kwenda kwenye uwanja wa kupuria
  rationale: Umbo la konsonanti si la kawaida, lakini muktadha unalihitaji agizo la nafsi ya pili ya kike kwa Ruthu. “Ushuke” linaendeleza mlolongo wa maagizo, na גֹּרֶן ni uwanja wa kupuria.
- source_word: אַל תִּוָּדְעִי
  choice: Usijionyeshe
  rationale: Nifali ya ידע hapa ina maana ya kutambulika au kujifanya ajulikane. “Usijionyeshe” ni ya asili katika Kiswahili na inaonyesha wajibu wa Ruthu kubaki bila kuonekana kwake.
- source_word: לָאִישׁ
  choice: kwa yule mwanamume
  rationale: Kiebrania kinamtaja mwanamume mahsusi anayejulikana katika muktadha, yaani Boazi, lakini hakitumii jina lake. “Yule mwanamume” huhifadhi namna hiyo ya kumrejelea.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: mpaka atakapomaliza kula na kunywa
  rationale: כלה pamoja na vitenzi-jina huonyesha kukamilika kwa matendo. Kauli hii ni ya kawaida na wazi katika Kiswahili.
