base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: sw
  text: Naye akasema, “Ubarikiwe na Yahweh, binti yangu. Umeifanya fadhili yako ya mwisho kuwa kubwa kuliko ile ya kwanza, kwa kutowafuata vijana wa kiume, wawe maskini au matajiri.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania חֶסֶד, lililotafsiriwa “fadhili,” linaweza pia kumaanisha “upendo thabiti,” “uaminifu,” au “upendo wa agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: Ubarikiwe na Yahweh
  rationale: Kauli hii ni tamko la baraka. ‘Ubarikiwe’ ni Kiswahili cha kawaida chenye nguvu ya dua, huku ‘Yahweh’ ikihifadhi jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: בִּתִּי
  choice: binti yangu
  rationale: Inahifadhi sitiari ya kifamilia na sauti ya upendo ya mtu mwenye umri na hadhi ya juu akimwambia Ruthu.
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: Fadhili hii yako ya mwisho umeifanya kuwa kubwa kuliko ile ya kwanza
  rationale: Inatoa wazi ulinganisho kati ya tendo la sasa la Ruthu na fadhili yake ya awali, bila kupoteza dhana ya kwamba tendo la mwisho limeizidi la kwanza.
- source_word: חַסְדֵּךְ
  choice: fadhili hii yako
  rationale: ‘Fadhili’ hapa ni tendo la wema wenye uaminifu na kujitoa kwa ajili ya Naomi na ukoo wake. Neno hili ni la asili na lenye heshima katika Kiswahili, huku maelezo ya chini yakihifadhi upana wa maana.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: kwa kuwa hukuwafuata
  rationale: Kifungu hiki kinaeleza jinsi fadhili ya mwisho ilivyokuwa kubwa. ‘Kuwafuata’ huhifadhi nahau ya Kiebrania ya kutafuta hao wanaume kama wenzi.
- source_word: הַבַּחוּרִים
  choice: vijana
  rationale: Katika muktadha huu ni wanaume vijana wanaoweza kuoa; ‘vijana’ ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: wawe maskini au matajiri
  rationale: Inahifadhi mgawanyo unaojumuisha hali zote za kiuchumi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya חֶסֶד katika sifa inayotolewa ndani ya simulizi
  choice: fadhili
  alternative: upendo thabiti; uaminifu; upendo wa agano
  rationale: Muktadha unasifu tendo halisi la Ruthu lenye ukarimu na uaminifu kwa familia ya Naomi, si hisia tu. ‘Fadhili’ linaeleweka vizuri katika simulizi, na maana pana zinawekwa katika tanbihi bila kulazimisha tafsiri ya kimadhehebu.
- issue: Uwasilishaji wa יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa kuwa wa asili katika Kiswahili huku ulinganisho, baraka, na sauti ya kifamilia ya Boazi vikihifadhiwa.
