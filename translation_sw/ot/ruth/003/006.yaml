translation:
  language: sw
  text: Basi akashuka mpaka kwenye uwanja wa kupuria, akafanya yote kama mama mkwe wake alivyomwagiza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kisha akashuka mpaka kwenye uwanja wa kupuria, akafanya yote sawasawa na mama mkwe wake alivyokuwa amemwagiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: akashuka kwenda
  rationale: Kitenzi ירד kinaonyesha mwendo wa kushuka; ‘akashuka kwenda’ ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo na kuunganisha kwa urahisi mahali alipokwenda.
- source_word: הַגֹּרֶן
  choice: uwanja wa kupuria
  rationale: גורן ni eneo la kilimo ambako nafaka hupuriwa; ‘uwanja wa kupuria’ ni istilahi ya kawaida na inayoeleweka katika Kiswahili sanifu.
- source_word: וַתַּעַשׂ
  choice: akafanya
  rationale: עשה ni kitenzi kipana cha kufanya; hapa kinaeleza kutekeleza maagizo yaliyotangulia.
- source_word: כְּכֹל אֲשֶׁר
  choice: yote kama ... alivyo-
  rationale: Muundo huu unaonyesha kufuata kikamilifu yaliyosemwa; tafsiri hii huhifadhi wazo la jumla la כֹל kwa lugha ya kawaida.
- source_word: צִוַּתָּה
  choice: alivyomwagiza
  rationale: צוה hubeba maana ya kuamuru au kuagiza. Katika uhusiano huu, ‘kumwagiza’ huhifadhi nguvu ya maagizo bila kuwa nzito au isiyo ya kawaida.
- source_word: חֲמוֹתָהּ
  choice: mama mkwe wake
  rationale: חמותהּ humaanisha hasa mama mkwe wake; kiambishi cha umilikaji kimehifadhiwa kwa ‘wake’.
- source_word: וַ
  choice: Basi
  rationale: Waw ya mwanzo inaendeleza masimulizi na kuonyesha hatua inayofuata kutokana na maagizo ya mstari uliotangulia; ‘Basi’ ni kiunganishi cha asili katika Kiswahili cha masimulizi.
