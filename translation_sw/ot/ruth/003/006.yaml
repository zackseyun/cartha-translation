  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mtindo ni wa masimulizi ulio wazi; ‘uwanja wa kupuria’ hudumisha mazingira ya kilimo, na ‘mama mkwe’ ni istilahi ya kawaida ya undugu.
