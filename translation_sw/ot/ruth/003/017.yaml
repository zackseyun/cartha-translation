  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: sw
  text: Akasema, “Alinipa vipimo hivi sita vya shayiri[a], kwa maana alisema, ‘Usiende kwa mama mkwe wako mikono mitupu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “shayiri hizi sita.” Kipimo mahsusi hakitajwi; “vipimo” imeongezwa ili kufafanua.
    reason: Neno “vipimo” ni ufafanuzi unaodokezwa na muktadha, si kipimo kilichotajwa katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Akasema
  rationale: Wayyiqtol ya אָמַר inaendeleza simulizi na kuanzisha taarifa ya Ruthu; kiambishi cha kike katika Kiswahili kinawakilisha mhusika wa kike kwa kawaida.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: vipimo hivi sita vya shayiri
  rationale: Maandishi ya Kiebrania yanasema kihalisi ‘shayiri hizi sita’ bila kutaja kipimo. ‘Vipimo’ kinaongezwa ili Kiswahili kiwe wazi na cha kawaida, huku kutotajwa kwa kipimo maalumu kukihifadhiwa.
- source_word: נָתַן לִי
  choice: alinipa
  rationale: Qal perfect ya nafsi ya tatu umoja wa kiume pamoja na kiambishi cha yambwa cha nafsi ya kwanza umoja hutafsiriwa kwa wakati uliopita wa kisimulizi.
- source_word: כִּי אָמַר
  choice: kwa maana alisema
  rationale: כִּי inaanzisha sababu au ufafanuzi wa zawadi; ‘kwa maana’ huhifadhi uhusiano huo kwa lugha yenye hadhi na inayoeleweka.
- source_word: אַל תָּבֹאִי
  choice: Usiende
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kwenda kulingana na mtazamo. Kwa kuwa Boazi anamwambia Ruthu arudi kwa mama mkwe wake, ‘usiende’ ni cha kawaida katika Kiswahili.
- source_word: רֵיקָם
  choice: mikono mitupu
  rationale: Nahau hii ya Kiswahili inaeleza kwa kawaida maana ya kwenda bila zawadi au kitu chochote.
- source_word: אֶל חֲמוֹתֵךְ
  choice: kwa mama mkwe wako
  rationale: חֲמוֹת ni ‘mama mkwe’; ‘kwa’ ni preposisheni ya kawaida ya Kiswahili kwa mwendo kuelekea kwa mtu.
