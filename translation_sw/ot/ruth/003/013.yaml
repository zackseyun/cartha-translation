  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: sw
  text: Kaa hapa usiku huu, na asubuhi, ikiwa atakukomboa[a], ni vema akukomboe. Lakini ikiwa hataki kukukomboa, basi mimi mwenyewe nitakukomboa, kama Yahweh aishivyo. Lala mpaka asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “kukomboa” kunamaanisha kutimiza wajibu wa kifamilia wa mkombozi wa jamaa wa karibu.
    reason: Kufafanua maana maalumu ya kisheria na kifamilia ya גאל katika muktadha huu.
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: Kaa hapa usiku huu
  rationale: Kitenzi לון humaanisha kukaa au kulala mahali usiku. Kauli hii ni ya kawaida katika Kiswahili na inatofautisha agizo hili na שִׁכְבִי, ambalo limetafsiriwa “Lala” mwishoni mwa aya.
- source_word: וְהָיָה בַבֹּקֶר
  choice: na asubuhi
  rationale: Kauli hii fupi inaendeleza mfuatano wa matukio kwa mtindo wa asili wa Kiswahili.
- source_word: אִם יִגְאָלֵךְ
  choice: ikiwa atakukomboa
  rationale: Mzizi גאל umehifadhiwa kwa lugha ya ukombozi, huku maana yake maalumu ya wajibu wa kifamilia ikielezwa katika tanbihi.
- source_word: טוֹב יִגְאָל
  choice: vema; na akukomboe
  rationale: Neno טוֹב limetumika kwa ufupi kuonyesha kukubali matokeo hayo; hali ya kutaka katika “akukomboe” inaonyesha ruhusa au ukubali wa Boazi bila kuongeza maelezo yasiyomo.
- source_word: לֹא יַחְפֹּץ לְגָאֳלֵךְ
  choice: hataki kukukomboa
  rationale: חפץ hapa inaonyesha nia au utayari. “Hataki” ni ya kawaida, wazi, na inadumisha maana ya hiari.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: basi mimi mwenyewe nitakukomboa
  rationale: “Mimi mwenyewe” linaonyesha mkazo wa אָנֹכִי, na “basi” linaweka wazi tofauti na uwezekano uliotajwa kabla.
- source_word: חַי יְהוָה
  choice: kama Yahwe aishivyo
  rationale: Hii ni kauli ya kiapo. Tafsiri hii inadumisha muundo wa Kiebrania na jina binafsi la Mungu.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: Lala mpaka asubuhi
  rationale: שכב humaanisha kulala chini; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya גאל katika muktadha wa kisheria na kifamilia wa kitabu cha Ruthu
  choice: Kutumia “komboa” katika matini kuu na kueleza wajibu wa mkombozi wa jamaa katika tanbihi
  alternative: Kutimiza wajibu wa mkombozi wa jamaa
  rationale: “Komboa” inadumisha kiungo cha msamiati na dhamira pana ya ukombozi, bila kuficha kwamba hapa tendo hilo lina maana maalumu ya kifamilia na kisheria.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu, hivyo “Yahwe” linalihifadhi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo mfupi “vema; na akukomboe” umehifadhi ufupi na mkazo wa Kiebrania.
