base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: sw
  text: Akasema, “Wewe ni nani?” Naye akasema, “Mimi ni Ruthu, mjakazi wako. Utandaze bawa lako[a] juu ya mjakazi wako, kwa maana wewe ni mkombozi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Utandaze ukingo wa vazi lako juu ya mjakazi wako.” Neno la Kiebrania linaweza kumaanisha “bawa” au ukingo wa vazi, na huenda maneno haya yanadokeza kwa makusudi ulinzi pamoja na dai la ndoa.
    reason: lexical_alternative
  - marker: b
    text: Au “mkombozi wa ukoo,” yaani, mwanafamilia mwenye jukumu linalotambuliwa la kutenda kwa niaba ya jamaa yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: Wewe ni nani?
  rationale: Ni swali la moja kwa moja la kutaka kumtambua mtu; mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: אָנֹכִי רוּת
  choice: Mimi ni Ruthu
  rationale: Sentensi ya Kiebrania isiyo na kitenzi imetafsiriwa kwa muundo wa kawaida wa kujitambulisha katika Kiswahili.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: mtumishi wako
  rationale: Neno אמה humaanisha mtumishi wa kike. “Mtumishi wako” ni la asili, lenye heshima, na linadumisha kujinyenyekeza kwa Ruthu bila kutumia lugha ya kizamani; marudio yake yamehifadhiwa.
- source_word: וּפָרַשְׂתָּ
  choice: Litandaze
  rationale: Kitenzi פרשׂ hapa kina maana ya kunyoosha au kutandaza kitu juu ya mwingine. Kiambishi “li-” kinarejelea bawa na kufanya ombi lisikike kwa kawaida katika Kiswahili.
- source_word: כְנָפֶךָ
  choice: bawa lako
  rationale: כנף linaweza kumaanisha “bawa” au ukingo wa vazi. Maandishi makuu yanahifadhi picha halisi ya bawa na mwangwi wake wa ulinzi, huku maana ya ukingo wa vazi ikielezwa katika tanbihi.
- source_word: עַל
  choice: juu ya
  rationale: Huu ni ulinganifu wa kawaida wa Kiswahili unaofaa picha ya kufunika na kulinda.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי linatoa sababu ya ombi la Ruthu. “Kwa maana” linaunganisha ombi na sababu yake kwa uwazi na kwa hadhi.
- source_word: גֹאֵל
  choice: mkombozi
  rationale: גאל humtaja mtu mwenye jukumu la kifamilia na kisheria la kukomboa. “Mkombozi” linahifadhi neno kuu bila kupachika maelezo yote katika mazungumzo; tanbihi inafafanua kipengele cha ukoo.
theological_decisions:
- issue: Nguvu ya sitiari ya “bawa lako” katika ombi la Ruthu
  choice: Kuhifadhi “bawa lako” katika maandishi makuu na kuacha dokezo la vazi na ndoa lielezwe katika tanbihi.
  alternative: “ukingo wa vazi lako,” ambalo lingeweka wazi zaidi ishara ya dai au ombi la ndoa.
  rationale: 'Huenda Kiebrania kinakusudia maana mbili kwa pamoja: ukingo wa vazi katika tukio lenyewe na picha pana ya ulinzi chini ya bawa. Kutumia “bawa” kunahifadhi utajiri na mvutano huo bila kuamua maana moja pekee.'
- issue: Tafsiri ya גֹאֵל
  choice: Kutumia “mkombozi” katika maandishi makuu na kueleza jukumu la ukoo katika tanbihi.
  alternative: “mkombozi wa ukoo” katika maandishi makuu.
  rationale: Neno la Kiebrania lina vipengele vya kisheria, kifamilia, na urejesho. “Mkombozi” linahifadhi istilahi kuu, na tanbihi inaeleza wajibu wa kifamilia muhimu katika kitabu cha Ruthu bila kuyafanya mazungumzo yawe mazito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo ni ya kawaida na wazi; “mtumishi wako” huhifadhi unyenyekevu wa Ruthu, na picha ya “bawa” imeachwa bila kufafanuliwa kupita kiasi katika maandishi makuu.
