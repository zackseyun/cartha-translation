base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: sw
  text: Ndipo akasema, “Ngoja, binti yangu, mpaka ujue jambo hilo litakavyoishia[a], kwa maana yule mtu[b] hatatulia mpaka atakapomaliza jambo hilo leo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hilo litakavyokuwa.” Nahau ya Kiebrania ni kihalisi “jambo litakavyoanguka.”
    reason: lexical_alternative
  - marker: b
    text: “Yule mtu” anamrejelea Boazi, ingawa Kiebrania kinatumia usemi wa dhahiri “yule mtu” badala ya kumtaja kwa jina hapa.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁבִי
  choice: Ngoja
  rationale: Kitenzi hiki humaanisha kihalisi ‘kaa’ au ‘baki,’ lakini hapa Naomi anamwagiza Ruthu akae alipo na kusubiri matokeo. ‘Ngoja’ huwasilisha maana hiyo ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: בִתִּי
  choice: binti yangu
  rationale: Inahifadhi mwito wa upendo wa Naomi pamoja na kiwakilishi cha umilikaji kilicho wazi katika Kiebrania.
- source_word: תֵּדְעִין
  choice: ujue
  rationale: 'ידע hapa inaelekea kwenye wakati ujao: Ruthu atasubiri mpaka matokeo yatakapojulikana kwake.'
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: jambo hilo litakavyoishia
  rationale: Nahau ya Kiebrania ni kihalisi ‘jambo litakavyoanguka.’ ‘Litakavyoishia’ ni nahau ya asili ya Kiswahili inayowasilisha matokeo bila kuingiza ufafanuzi usio katika matini; taswira halisi imehifadhiwa katika tanbihi.
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Kiebrania kinasema ‘mtu huyo’ au ‘yule mtu’ badala ya kumtaja Boazi kwa jina. Tafsiri hii inadumisha urejeo wa kimuktadha bila kuingiza jina katika matini.
- source_word: יִשְׁקֹט
  choice: hatatulia
  rationale: שׁקט humaanisha kutulia au kuwa bila shughuli. Katika muktadha huu inaonyesha kwamba mtu huyo hataacha kushughulikia jambo hilo.
- source_word: כִּי אִם
  choice: mpaka atakapo-
  rationale: Muundo huu unaonyesha hali pekee itakayomfanya mtu huyo atulie; katika Kiswahili, muundo wa ‘hatatulia mpaka atakapo…’ huwasilisha nguvu hiyo kwa kawaida.
- source_word: כִּלָּה
  choice: amalize
  rationale: כלה humaanisha kukamilisha au kufikisha mwisho. ‘Amalize’ inadumisha maana ya msingi bila kuamua kwa ziada jinsi suala hilo litakavyotatuliwa.
- source_word: הַדָּבָר
  choice: jambo hilo
  rationale: דבר ni neno pana linalorejelea suala linalosubiri kushughulikiwa; ‘jambo hilo’ ni la asili na linafaa muktadha.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi hiki cha wakati.
