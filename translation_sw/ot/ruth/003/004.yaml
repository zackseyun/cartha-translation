base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: sw
  text: Atakapolala, tambua mahali alikolala. Kisha uende, ufunue miguu yake[a], nawe ulale[b]. Yeye atakuambia unachopaswa kufanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “sehemu ya miguuni pake” au “sehemu yake ya chini.” Usemi wa Kiebrania unaweza kumaanisha eneo la miguuni, si miguu peke yake.
    reason: lexical_alternative
  - marker: b
    text: Umbo lililoandikwa katika Kiebrania linasema, “na nitalala,” lakini usomaji wa kimapokeo na muktadha vinaelekeza maana, “nawe ulale.”
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: Atakapolala
  rationale: Muundo huu unaanzisha wakati wa hatua inayofuata katika mfululizo wa maagizo. Kiswahili cha wakati ujao chenye maana ya wakati kinawasilisha kwa kawaida wazo la ‘wakati atakapolala.’
- source_word: וְיָדַעַתְּ
  choice: tambua
  rationale: Ingawa ידע kwa msingi ni ‘kujua,’ hapa Naomi anamwagiza Ruthu atambue kwa makini mahali Boazi atakapolala.
- source_word: אֶת־הַמָּקוֹם אֲשֶׁר יִשְׁכַּב שָׁם
  choice: mahali atakapolala
  rationale: מקום ni ‘mahali,’ na kishazi kinachofuata kinabainisha mahali pa kulala. Kielezi שָׁם hakihitaji kutafsiriwa kando kwa sababu tayari kimo katika maana ya ‘mahali.’
- source_word: וּבָאת
  choice: Kisha uende
  rationale: בוא inaweza kumaanisha kuja au kwenda kulingana na mtazamo. Katika agizo la Naomi kwa Ruthu, ‘uende’ ni Kiswahili cha kawaida, na ‘kisha’ hudumisha mfuatano wa vitendo.
- source_word: וְגִלִּית
  choice: ufunue
  rationale: Kitenzi גלה katika muundo huu humaanisha kuondoa kilichofunika au kufunua; ‘ufunue’ ni tafsiri ya moja kwa moja isiyoongeza ufafanuzi wa tukio.
- source_word: מַרְגְּלֹתָיו
  choice: miguu yake
  rationale: Neno hili linaweza kumaanisha miguu au eneo la miguuni. ‘Miguu yake’ ni tafsiri wazi na ya kawaida, huku upana wa maana ukihifadhiwa katika tanbihi.
- source_word: וְשָׁכָבְתִּי / וְשָׁכַבְתְּ
  choice: nawe ulale
  rationale: 'Maana inayosomwa kimapokeo na inayotakiwa na muktadha ni nafsi ya pili ya kike umoja: Ruthu ndiye anayepaswa kulala. ‘Nawe’ humtaja mhusika huyo wazi bila kuficha tofauti ya maandishi, ambayo imeelezwa katika tanbihi.'
- source_word: וְהוּא יַגִּיד לָךְ
  choice: Yeye atakuambia
  rationale: נגד katika Hifili humaanisha ‘kuambia’ au ‘kutangaza.’ Kiwakilishi ‘Yeye’ kinahifadhi msisitizo wa kiwakilishi cha Kiebrania.
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: unachopaswa kufanya
  rationale: Kishazi hiki kinaelekea kwenye maagizo ambayo Boazi atampa Ruthu; ‘unachopaswa kufanya’ huwasilisha nguvu hiyo elekezi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utata unaowezekana wa kingono katika agizo la kufunua miguu ya Boazi na kulala
  choice: Kudumisha maneno ya moja kwa moja bila kutangaza kuwa tendo hilo ni la kingono au kwamba halina maana yoyote ya kingono.
  alternative: Kulieleza kama sitiari ya kujikaribisha kingono, au kulieleza kama tendo la kawaida tu la kumwamsha Boazi.
  rationale: Maneno ya Kiebrania yanaacha mvutano wa kimakusudi katika simulizi. Tafsiri inataja ‘miguu’ na ‘kulala’ bila kuongeza maelezo yanayoamua maana hiyo, huku tanbihi ikihifadhi uwezekano mpana wa מַרְגְּלֹתָיו.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mfuatano wa maagizo umewekwa wazi kwa ‘Kisha,’ lakini utata wa simulizi kuhusu kufunua miguu na kulala haujaondolewa.
