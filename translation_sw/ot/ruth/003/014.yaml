revisions:
- from: Basi akalala miguuni pake mpaka asubuhi, naye akaamka kabla mtu hajaweza kumtambua mwenzake.[a] Naye akasema,[b] “Isijulikane kwamba mwanamke huyo alikuja kwenye uwanja wa kupuria nafaka.”
  to: Basi akalala miguuni pake mpaka asubuhi; akaondoka kabla mtu hajaweza kumtambua mwenzake.[a] Naye akasema,[b] “Isijulikane kwamba mwanamke alikuja kwenye uwanja wa kupuria.”
  rationale: The revision renders Ruth’s action with “akaondoka,” which better represents her rising and departing in the narrative. It also removes an unnecessary demonstrative from “mwanamke huyo” and uses the concise, natural term “uwanja wa kupuria.” The speaker remains unnamed, the command remains passive and non-disclosing, and no interpretation of the scene’s sexual or moral implications is added.
