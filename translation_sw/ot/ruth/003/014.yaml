base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: sw
  text: Basi akalala miguuni pake mpaka asubuhi; akaondoka kabla mtu hajaweza kumtambua mwenzake.[a] Naye akasema,[b] “Isijulikane kwamba mwanamke alikuja kwenye uwanja wa kupuria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “kabla mwanamume hajamtambua mwenzake.” Usemi huu wa Kiebrania unamaanisha kabla watu hawajaweza kutofautishana katika mwanga hafifu.
    reason: lexical_alternative
  - marker: b
    text: Kutokana na muktadha, inaelekea sana kwamba msemaji ni Boazi, ingawa matini ya Kiebrania inasema tu, “Naye akasema.”
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: miguuni pake
  rationale: Hurejelea mahali pa miguu ya Boazi. Usemi huu ni wa kawaida katika Kiswahili na hauongezi maelezo kuhusu kitanda, mkao, au maana ya kingono.
- source_word: בטרום
  choice: kabla
  rationale: Neno hili linaonyesha wakati uliotangulia tukio jingine; “kabla” linatoa maana hiyo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: יכיר
  choice: hajaweza kumtambua
  rationale: Kitenzi hiki hapa kina maana ya kumtambua au kumtofautisha mtu. Muundo huu unaonyesha kwamba mwanga ulikuwa bado hautoshi watu kutambuana.
- source_word: איש את רעהו
  choice: mtu hajaweza kumtambua mwenzake
  rationale: Ingawa maneno ya Kiebrania kwa karibu ni “mwanamume ... mwenzake,” huu ni usemi unaomaanisha watu kuweza kutambuana. Kiswahili hiki ni cha asili na kinahifadhi maana ya usemi huo.
- source_word: אל יוודע
  choice: Isijulikane
  rationale: Muundo wa Kiebrania ni katazo au agizo la kutotangazwa kwa jambo, katika hali ya kutendwa. “Isijulikane” ni fupi, ya asili, na inadumisha hali hiyo.
- source_word: האשה
  choice: mwanamke huyo
  rationale: Nomino ina kibainishi maalumu katika Kiebrania na inamrejelea Ruthu. “Mwanamke huyo” huonyesha urejeo maalumu bila kutaja jina ambalo halipo katika kishazi hiki.
- source_word: הגרן
  choice: uwanja wa kupuria nafaka
  rationale: Hili ndilo eneo la kilimo ambako nafaka ilipuriwa; tafsiri hii inaeleweka wazi kwa wasomaji wa Kiswahili.
- source_word: ויאמר
  choice: Naye akasema
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu, umoja, kiume bila kulitaja jina la msemaji. Tafsiri inadumisha kutotajwa kwa jina hilo.
theological_decisions:
- issue: Utambulisho wa msemaji wa ויאמר
  choice: “Naye akasema” bila kumtaja Boazi katika matini kuu.
  alternative: “Kisha Boazi akasema.”
  rationale: Muktadha unaonyesha kwa nguvu kwamba msemaji ni Boazi, lakini Kiebrania hakitaji jina lake. Tafsiri haiongezi uhakika ambao haujaelezwa moja kwa moja katika chanzo.
- issue: Dokezo la kimaadili au kingono katika Ruthu kulala miguuni pa Boazi
  choice: Kutumia maelezo ya mahali, “akalala miguuni pake,” bila ufafanuzi wa ziada.
  alternative: Kutumia usemi unaodokeza kuwa walifanya ngono, au kuongeza maneno yanayokanusha wazi kwamba walifanya ngono.
  rationale: Aya inaeleza mahali na wakati, lakini haisemi wazi kwamba tendo la kingono lilitokea wala kwamba halikutokea. Tafsiri inadumisha mvutano wa simulizi bila kuamua jambo linalobishaniwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Sentensi ni rahisi kueleweka bila kupoteza muundo wa simulizi, hali ya kutendwa katika katazo, au utata halisi kuhusu msemaji na maana ya Ruthu kulala miguuni pa Boazi.
