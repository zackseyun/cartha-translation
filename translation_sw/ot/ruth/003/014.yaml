review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves Ruth’s lying at Boaz’s feet, the early-morning timing, the non-disclosure command, and the unnamed masculine speaker. However, “akaamka” primarily means “woke up” and can understate the Hebrew וַתָּקָם, “she rose/got up.”
  naturalness: The Swahili is generally clear and appropriately formal. “Akaondoka” is natural in this narrative context and more idiomatically expresses that she rose and left before recognition was possible. “Uwanja wa kupuria nafaka” is understandable, though “uwanja wa kupuria” is sufficiently clear and less cumbersome.
  terminology: “Miguuni pake,” “Isijulikane,” and “Boazi” are suitable. The definite Hebrew phrase הָאִשָּׁה is better represented naturally as “mwanamke,” since Swahili does not normally require a demonstrative here; “mwanamke huyo” can add a deictic emphasis not required by the source.
  issues:
  - severity: medium
    issue: “akaamka” for וַתָּקָם
    rationale: The Hebrew verb means that Ruth rose/got up. While “akaamka” may sometimes be understood as getting up, its central sense is waking from sleep. “Akaondoka” naturally conveys the narrative action and avoids narrowing the sense to waking.
  - severity: low
    issue: “mwanamke huyo” for הָאִשָּׁה
    rationale: The demonstrative “huyo” can mean “that woman” and introduces a nuance of pointing or contrast. Contextual definiteness is naturally conveyed by “mwanamke” in Swahili.
  - severity: low
    issue: “uwanja wa kupuria nafaka” is slightly overexplicit
    rationale: The Hebrew names the threshing floor. “Uwanja wa kupuria” is a standard, clear equivalent; adding “nafaka” is not materially wrong but is unnecessary.
  revised_text: Basi akalala miguuni pake mpaka asubuhi; akaondoka kabla mtu hajaweza kumtambua mwenzake.[a] Naye akasema,[b] “Isijulikane kwamba mwanamke alikuja kwenye uwanja wa kupuria.”
  revised_footnotes:
