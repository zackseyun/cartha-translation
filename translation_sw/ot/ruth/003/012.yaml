  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: sw
  text: Na sasa, ni kweli kwamba mimi ni mkombozi wa ukoo[a]; lakini pia kuna mkombozi wa ukoo aliye wa karibu zaidi kuliko mimi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkombozi” au “jamaa mwenye haki ya kukomboa.” Neno la Kiebrania humaanisha jamaa wa karibu mwenye majukumu yanayotambuliwa ya kukomboa au kulinda familia na mali yake.
    reason: lexical_alternative
  - marker: b
    text: “Aliye wa karibu zaidi” hapa humaanisha mwenye uhusiano wa karibu zaidi wa kifamilia, katika suala la haki za ukombozi wa ukoo; si mtu aliye karibu zaidi kimahali.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na alama ya wakati na mpito wa hoja עַתָּה kwa Kiswahili cha kawaida.
- source_word: כִּי אָמְנָם כִּי אִם
  choice: ni kweli kwamba
  rationale: Muundo huu unathibitisha kwa wazi jambo ambalo Boazi anakubali; tafsiri hii ni ya asili katika Kiswahili bila kuongeza mkazo usiokuwamo.
- source_word: גֹאֵל
  choice: mkombozi wa ukoo
  rationale: Neno hili linamtaja ndugu mwenye haki na wajibu unaotambuliwa wa kukomboa mali au kuilinda familia. Nyongeza “wa ukoo” inaepusha kueleweka kama ukombozi wa kiroho kwa ujumla.
- source_word: אָנֹכִי
  choice: mimi ni
  rationale: Kiwakilishi huru kinaweka mkazo fulani kwa msemaji; “mimi ni” kinaonyesha uwazi huo kwa Kiswahili.
- source_word: וְגַם יֵשׁ
  choice: lakini pia yupo
  rationale: וְגַם huongeza jambo linaloweka mpaka kwa dai la Boazi. “Lakini pia” linaonyesha uhusiano huo wa kimuktadha, na “yupo” linafaa kwa mtu.
- source_word: קָרוֹב מִמֶּנִּי
  choice: aliye jamaa wa karibu zaidi kuliko mimi
  rationale: Katika muktadha wa haki za kifamilia, ukaribu ni wa undugu, si wa mahali. Kutaja “jamaa” kunafanya maana hiyo iwe wazi bila kubainisha daraja lisilotajwa.
theological_decisions:
- issue: Maana ya גֹאֵל katika utaratibu wa kifamilia wa Israeli
  choice: mkombozi wa ukoo
  alternative: mkombozi; jamaa mwenye haki ya kukomboa
  rationale: Hapa neno linahusu haki na wajibu wa ndugu katika familia, si moja kwa moja ukombozi wa kiroho. “Mkombozi wa ukoo” huhifadhi wazo la kukomboa na kulifunga kwa muktadha wa undugu.
- issue: Maana ya קָרוֹב katika dai la Boazi
  choice: jamaa wa karibu zaidi
  alternative: aliye karibu zaidi
  rationale: Muktadha unaonyesha kwamba anayezungumziwa ana uhusiano wa karibu zaidi wa kifamilia na hivyo ana haki ya kutangulia. Tafsiri haibainishi ni uhusiano gani hasa, kwa kuwa mstari wenyewe hausemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mkombozi wa ukoo” limetumiwa kwa uthabiti ili kuonyesha mazingira ya kisheria na kifamilia; maelezo ya chini yanahifadhi namna nyingine zinazowezekana.
