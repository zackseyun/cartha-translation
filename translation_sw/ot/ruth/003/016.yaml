base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: sw
  text: Alipofika kwa mama mkwe wake[a], mama mkwe wake akasema, “Wewe ni nani, binti yangu?” Kisha Ruthu akamsimulia yote ambayo yule mwanamume alikuwa amemtendea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kutafsiri maana inayodokezwa, “Ilikuwaje kwako, binti yangu?” Kiebrania kinasema moja kwa moja, “Wewe ni nani, binti yangu?” Huenda swali hilo linahusu hali mpya ya Ruthu au matokeo ya mkutano wake.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא אֶל חֲמוֹתָהּ
  choice: Alipofika kwa mama mkwe wake
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida, huku חֲמוֹת ikitafsiriwa kwa usahihi kuwa ‘mama mkwe.’
- source_word: וַתֹּאמֶר
  choice: mama mkwe wake akasema
  rationale: Kitenzi cha Kiebrania hakitaji wazi mhusika, lakini Kiswahili kingeweza kufanya kiwakilishi ‘akasema’ kitatanishe; kurudia ‘mama mkwe wake’ kunabainisha kuwa msemaji ni Naomi bila kubadili maana.
- source_word: מִי אַתְּ
  choice: Wewe ni nani
  rationale: Hii inadumisha maana ya moja kwa moja ya Kiebrania na fumbo lake, badala ya kuamua kimya-kimya kwamba swali linahusu tu matokeo ya mkutano au hali mpya ya Ruthu.
- source_word: בִּתִּי
  choice: binti yangu
  rationale: Ni namna ya upendo ya kumwita Ruthu, na pia inadumisha picha halisi ya uhusiano wa kifamilia katika Kiebrania.
- source_word: וַתַּגֶּד לָהּ
  choice: Kisha Ruthu akamsimulia
  rationale: ‘Akamsimulia’ ni Kiswahili cha asili kwa kutoa taarifa kamili ya yaliyotokea; jina ‘Ruthu’ linaondoa utata wa viwakilishi katika sentensi yenye wanawake wawili.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לָהּ הָאִישׁ
  choice: yote ambayo yule mwanamume alikuwa amemtendea
  rationale: ‘Yote ambayo’ huonyesha ukamilifu wa taarifa. ‘Alikuwa amemtendea’ huakisi tendo lililotangulia, na ‘yule mwanamume’ huhifadhi namna Kiebrania isivyotaja jina la Boazi katika kishazi hiki.
theological_decisions:
- issue: Maana ya swali מִי אַתְּ baada ya mkutano wa Ruthu na Boazi
  choice: Kuhifadhi tafsiri halisi ‘Wewe ni nani?’ katika matini
  alternative: ‘Ilikuwaje kwako?’ au ‘Sasa hali yako ni ipi?’
  rationale: Swali linaweza kudokeza matokeo ya mkutano au mabadiliko ya hali ya Ruthu, lakini Kiebrania hakufafanui hilo moja kwa moja. Matini inadumisha mvutano huo, na maelezo ya chini yanatoa uwezekano wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Majina ya wahusika yamerudiwa pale ambapo viwakilishi pekee vingezua utata. Tafsiri halisi ya swali la Naomi imehifadhiwa, huku maana inayowezekana kimuktadha ikiwekwa katika tanbihi.
