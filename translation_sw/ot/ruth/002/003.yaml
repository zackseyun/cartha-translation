base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: sw
  text: Basi akaenda, akafika, akaokota nafaka zilizobaki shambani nyuma ya wavunaji. Kwa bahati[a], akajikuta katika sehemu ya shamba iliyokuwa ya Boazi, ambaye alikuwa wa ukoo wa Elimeleki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, Kiebrania ni “bahati yake ikatokea”—nahau inayoonyesha jambo lililoonekana kuwa la bahati kwa mtazamo wa kibinadamu; hata hivyo, simulizi pana la kitabu hiki pia linamwalika msomaji kuona uongozi wa Mungu.
    reason: Kufafanua nahau ya Kiebrania na kuhifadhi mvutano kati ya bahati inavyoonekana kwa binadamu na uongozi wa Mungu unaodokezwa na simulizi.
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך kinaonyesha mwendo wa kawaida; “akaenda” ni usemi wa asili na huhifadhi mfuatano wa simulizi ya Kiebrania.
- source_word: וַתָּבוֹא
  choice: akafika
  rationale: בוא baada ya “akaenda” huendeleza hatua za simulizi. “Akafika” ni ya kawaida katika Kiswahili na hutofautisha kuwasili na kuondoka.
- source_word: וַתְּלַקֵּט
  choice: akaokota masazo
  rationale: לקט hapa ni kuokota nafaka iliyobaki baada ya wavunaji. “Kuokota masazo” hueleweka kwa urahisi kuliko istilahi maalumu isiyo ya kawaida.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: Hutoa maana ya mahali ambako uvunaji ulikuwa ukiendelea kwa Kiswahili cha kawaida.
- source_word: אַחֲרֵי הַקֹּצְרִים
  choice: nyuma ya wavunaji
  rationale: 'אַחֲרֵי ina maana ya mahali katika muktadha huu: Ruthu aliokota masazo akiwafuata waliokuwa wakivuna.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: Ikawa kwa bahati akafika
  rationale: Usemi huu wenye kitenzi na nomino za mzizi mmoja unaonyesha jambo lililoonekana kuwa la bahati kwa mtazamo wa kibinadamu. Tafsiri hii ni ya kawaida bila kuondoa kejeli ya kisimulizi.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: sehemu ya shamba
  rationale: חלקה ni kipande au sehemu ya ardhi; usemi huu ni wazi na wa kawaida.
- source_word: לְבֹעַז
  choice: iliyokuwa ya Boazi
  rationale: Herufi לְ hapa inaonyesha umiliki au uhusiano; “ya Boazi” huonyesha hilo kwa Kiswahili cha asili.
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: ambaye alikuwa wa ukoo wa Elimeleki
  rationale: מִשְׁפָּחָה hapa ni kundi pana la kifamilia. “Ukoo” huwasilisha maana hiyo vizuri kuliko “familia,” ambayo mara nyingi hueleweka kama familia ya karibu tu.
theological_decisions:
- issue: Jambo linaloonekana kuwa la bahati na uongozi wa Mungu katika simulizi
  choice: Kudumisha usemi wa kawaida “kwa bahati” katika matini kuu
  alternative: Kusema wazi kwamba Mungu alimwongoza Ruthu hadi shamba la Boazi
  rationale: Kiebrania kinaeleza tukio kwa mtazamo wa kibinadamu kana kwamba limetokea kwa bahati, huku simulizi pana likimwalika msomaji kuona uongozi wa Mungu. Tafsiri haipaswi kuondoa mvutano huo kwa kuongeza maelezo ya moja kwa moja kuhusu uongozi wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Masazo” yanafafanuliwa kwa muktadha wa wavunaji; “ukoo” limetumiwa kwa kundi pana la kifamilia. Mfuatano “akaenda, akafika, akaokota” huhifadhi mwendo wa hatua kwa hatua wa simulizi la Kiebrania.
