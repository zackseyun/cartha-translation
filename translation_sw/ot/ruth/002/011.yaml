  - severity: low
    issue: Maneno ya utangulizi wa tanbihi hayana ufasaha wa kawaida.
    rationale: “Kwa neno moja moja” si usemi sanifu wa kueleza tafsiri halisi. “Kwa maneno halisi” hueleweka na hudumisha kusudi la tanbihi.
