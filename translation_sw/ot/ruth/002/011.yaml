translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sentensi inadumisha mtiririko wa simulizi na msisitizo wa taarifa kamili bila kuongeza ufafanuzi wa kimadhehebu.
