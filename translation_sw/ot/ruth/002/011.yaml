  verdict: revise
  source_fidelity: Tafsiri kwa jumla inanasa msisitizo wa taarifa iliyotolewa kikamilifu, matendo ya Ruthu kwa mama mkwe wake, kifo cha mume wake, kuondoka kwake katika nchi ya asili, na kwenda kwa watu asiowafahamu. Hata hivyo, kiambishi cha wingi katika “ulivyowaacha baba yako na mama yako na nchi yako” huifanya ‘nchi’ ionekane kama sehemu ya yambwa ya watu; muundo wenye orodha wazi huwakilisha vyema yambwa zote tatu za Kiebrania.
  naturalness: Kiswahili ni cha kawaida na chenye register inayofaa simulizi. “Kwa neno moja moja” katika tanbihi si usemi wa kawaida; “Kwa maneno halisi” ni fasaha zaidi. Orodha yenye koma pia huondoa utata wa kisarufi.
  terminology: “Boazi,” “mama mkwe,” “mume,” na “nchi yako ya kuzaliwa” zinafaa. “Hapo awali” ni tafsiri laini inayokubalika ya nahau תְּמוֹל שִׁלְשׁוֹם, mradi usemi halisi ubaki katika tanbihi.
