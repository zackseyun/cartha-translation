base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: sw
  text: Ndipo Boazi akamjibu, “Nimeelezwa kwa kina mambo yote uliyomfanyia mama mkwe wako baada ya kifo cha mume wako, na jinsi ulivyoacha baba yako, mama yako, na nchi yako ya kuzaliwa, ukaenda kwa watu ambao hukuwa umewajua hapo awali.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, “jana au juzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: Nimeelezwa kwa kina
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi cha kutendwa unasisitiza kwamba taarifa ilimfikia Boazi kikamilifu. Tafsiri hii inadumisha hali ya kutendwa na msisitizo kwa Kiswahili cha kawaida.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: mambo yote uliyomfanyia mama mkwe wako
  rationale: “Mambo yote” huonyesha ujumla wa כֹּל, na “uliyomfanyia” huwasilisha kwa ufasaha tendo lililomwelekea na kumnufaisha mama mkwe.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: baada ya kifo cha mume wako
  rationale: Inafuata muundo wa jina katika Kiebrania na kudumisha uzito wa simulizi.
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: ulivyowaacha baba yako na mama yako
  rationale: “Uliyowaacha” ni ya kawaida na isiyo na mzigo wa ziada wa maana; kila mzazi anatajwa kando kama katika chanzo.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: nchi yako ya kuzaliwa
  rationale: Huwasilisha maana ya nchi ya asili au mahali pa kuzaliwa kwa lugha ya sasa iliyo wazi.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: ukaenda kwa watu
  rationale: Hudumisha kitenzi cha kwenda na mtazamo wa safari ya Ruthu, bila kuibadili kuwa “ukaja.”
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: ambao hukuwa umewajua
  rationale: Kitenzi ידע hapa kinaonyesha kutofahamiana kibinafsi na jamii hiyo, si ukosefu wa taarifa tu.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: hapo awali
  rationale: Nahau hiyo ina maana ya wakati uliotangulia. “Hapo awali” ni Kiswahili fasaha katika muktadha huu, huku usemi halisi ukihifadhiwa katika tanbihi.
