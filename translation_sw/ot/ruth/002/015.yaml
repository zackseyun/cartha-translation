  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. “Kuokota masazo” linafafanua desturi ya mavuno kwa msomaji wa sasa, huku “miganda” likihifadhi taswira ya kilimo ya chanzo.
