base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: sw
  text: Alipoinuka kwenda kuokota masazo, Boazi akawaamuru vijana wake akisema, “Mwache aokote hata miongoni mwa miganda[a], wala msimwaibishe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kati ya miganda.” Kihusishi cha Kiebrania maana yake halisi ni “kati ya,” lakini “miongoni mwa” ni cha asili zaidi hapa kwa shughuli inayofanyika kati ya miganda.
    reason: lexical_alternative
  - marker: b
    text: Au “msimfedheheshe.” Kitenzi cha Kiebrania kinaweza kumaanisha kumsababishia mtu aibu, fedheha, au kudharauliwa hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Alipoinuka
  rationale: Muundo huu unaendeleza simulizi na wakati huohuo unaonyesha kuwa agizo la Boazi lilihusiana na Ruthu kuinuka kwake ili arudi kazini.
- source_word: לְלַקֵּט
  choice: kwenda kuokota masazo
  rationale: Kitenzi לקט katika mazingira ya mavuno humaanisha kuokota masazo yaliyobaki baada ya wavunaji. Neno “kwenda” linaeleza kwa Kiswahili cha kawaida kusudi la kuinuka kwake.
- source_word: וַיְצַו ... לֵאמֹר
  choice: Boazi akawaamuru ... akisema
  rationale: “Akawaamuru” linahifadhi uzito wa agizo la צוה, na “akisema” linaakisi utangulizi wa maneno ya moja kwa moja katika Kiebrania.
- source_word: נְעָרָיו
  choice: vijana wake
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au msaidizi. Hapa inawarejelea wanaume vijana waliokuwa wakifanya kazi chini ya mamlaka ya Boazi, hivyo tafsiri hii inadumisha maana yake ya msingi bila kuficha jinsia.
- source_word: גַּם
  choice: hata
  rationale: '“Hata” linaonyesha upanuzi wa ruhusa kwa ukarimu: Ruthu hakuruhusiwa kuokota pembezoni tu, bali pia mahali pa miganda.'
- source_word: בֵּין הָעֳמָרִים
  choice: katikati ya miganda
  rationale: בֵּין kimsingi ni “kati ya,” na עֳמָרִים ni miganda ya nafaka iliyokusanywa. “Katikati ya miganda” ni ya asili katika Kiswahili na inadumisha taswira ya mahali.
- source_word: תְּלַקֵּט
  choice: Mwache aokote
  rationale: Kitenzi hiki kina nguvu ya ruhusa ndani ya agizo linalowaelekea vijana wa Boazi. “Mwache aokote” kinaonyesha kwamba wasimzuie Ruthu.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: wala msimwaibishe
  rationale: Hifili ya כלם humaanisha kumsababishia mtu aibu au fedheha. “Msimwaibishe” ni Kiswahili cha kawaida na huwasilisha katazo la kumtendea kwa namna ya kumtia aibu.
