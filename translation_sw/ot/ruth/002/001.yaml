base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: sw
  text: Naomi alikuwa na jamaa wa mume wake, mtu mwenye uwezo mkubwa na hadhi[a], kutoka katika ukoo wa Elimeleki[b]. Jina lake lilikuwa Boazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu shujaa mwenye nguvu,” “mtu mashuhuri,” au “mtu tajiri.” Kirai cha Kiebrania huunganisha mawazo ya nguvu, uwezo, hadhi na mali.
    reason: lexical_alternative
  - marker: b
    text: Au “familia ya Elimeleki.” Neno la Kiebrania linaweza kumaanisha kundi pana la jamaa au ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנָעֳמִי
  choice: Naomi alikuwa na
  rationale: Muundo huu unaanzisha habari mpya kuhusu Naomi. Kiswahili cha masimulizi hakihitaji kuongeza neno la wakati kama “basi” au “sasa” hapa.
- source_word: מידע לְאִישָׁהּ
  choice: jamaa wa mume wake
  rationale: Neno hilo humaanisha mtu anayejulikana au aliye na uhusiano, na kutajwa kwa ukoo wa Elimeleki katika muktadha kunaonyesha uhusiano wa kijamaa. “Jamaa” ni lugha ya kawaida na haimtambulishi mapema kama mkombozi wa ukoo.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: mtu mwenye uwezo na hadhi kubwa
  rationale: Kirai hiki kinaweza kujumuisha uwezo, nguvu, mali, ushawishi na cheo katika jamii. Katika mazingira haya yasiyo ya kivita, tafsiri hii huhifadhi upana wa maana bila kuingiza wazo la ushujaa wa kijeshi.
- source_word: מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: kutoka katika ukoo wa Elimeleki
  rationale: מִשְׁפָּחָה hapa yaelekea kutaja kundi pana la watu wenye undugu, wala si familia ya nyumbani pekee; “ukoo” linafaa katika muktadha huo.
- source_word: וּשְׁמוֹ בֹּעַז
  choice: Jina lake lilikuwa Boazi
  rationale: Huu ni utambulisho wa mhusika katika simulizi la wakati uliopita. “Boazi” ni umbo la jina lililozoeleka katika Kiswahili cha Biblia.
