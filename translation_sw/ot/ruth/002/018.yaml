base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: sw
  text: Akaichukua, akaingia mjini, na mama mkwe wake akaona nafaka aliyokuwa ameokota. Kisha Ruthu akatoa na kumpa kile alichokuwa amebakiza baada ya kushiba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kula akashiba.”
    reason: Tofauti ya kileksia inayoweka wazi kwamba hali ya kushiba ilitokana na mlo uliotajwa katika muktadha.
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: Akaichukua
  rationale: Kitenzi נשׂא kina maana ya kuinua au kubeba. Katika muktadha huu Ruthu anachukua nafaka aliyookota ili kuipeleka nyumbani; “akaichukua” ni ya kawaida na inahifadhi tendo hilo.
- source_word: הָעִיר
  choice: mjini
  rationale: עִיר humaanisha mji. Muundo “akaingia mjini” ni Kiswahili cha kawaida na cha asili kwa kuingia katika mji wa Bethlehemu.
- source_word: חֲמוֹתָהּ
  choice: mama mkwe wake
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa uhusiano unaotajwa, na kiambishi cha Kiebrania kinaonyesha kuwa ni mama mkwe wa Ruthu.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: nafaka aliyokuwa ameokota
  rationale: לקט ni kuokota masazo ya mavuno nyuma ya wavunaji. Kutaja “nafaka” kunafanya tendo hilo lieleweke katika Kiswahili cha kawaida huku “ameokota” likihifadhi picha ya ukusanyaji wa masazo.
- source_word: וַתּוֹצֵא
  choice: akatoa
  rationale: Katika Hifili, יצא humaanisha kutoa au kuleta nje. Hapa Ruthu anatoa kile alichohifadhi kutoka katika mlo wake.
- source_word: וַתִּתֶּן לָהּ
  choice: na kumpa
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba Ruthu alimpa mama mkwe wake, huku ukiendelea kwa urahisi kutoka kwa kitenzi kilichotangulia.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: kile alichokuwa amebakiza
  rationale: הותירה humaanisha kuacha au kubakiza. Wakati timilifu wa Kiswahili unaonyesha kwamba chakula kilikuwa kimebakizwa mapema wakati wa mlo.
- source_word: מִשָּׂבְעָהּ
  choice: baada ya kushiba
  rationale: Nomino שׂבע pamoja na מִן inaonyesha hali au hatua ya kuwa ameshiba. “Baada ya kushiba” ni fupi, ya kawaida, na haiingizi maelezo yasiyokuwapo katika chanzo.
