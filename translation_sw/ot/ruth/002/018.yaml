translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina “Ruthu” limerudiwa katika sentensi ya pili ili kuzuia utata wa viwakilishi kati yake na mama mkwe wake. Alama ya tanbihi imewekwa kwenye kishazi kinachohusu kushiba, ambacho ndicho tanbihi inachofafanua.
