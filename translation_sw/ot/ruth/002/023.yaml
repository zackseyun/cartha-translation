base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: sw
  text: Basi Ruthu akaendelea kuwa karibu na wasichana wa Boazi[a] ili kuokota masazo, mpaka mavuno ya shayiri na ya ngano yalipomalizika. Naye aliishi pamoja na mama mkwe wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kushikamana na wasichana wa Boazi ili kuokota masazo.” Kitenzi cha Kiebrania kinaweza kusisitiza kushikamana kwa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikaa pamoja na mama mkwe wake.” Kitenzi cha Kiebrania kinaweza kumaanisha kukaa, kubaki, au kuishi, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: akaendelea kuwa karibu
  rationale: Kitenzi דבק kina maana ya kushikamana au kubaki karibu. Katika muktadha huu kinaonyesha kwamba Ruthu aliendelea kuambatana kwa karibu na kundi hilo, bila kudokeza lazima kushikana kimwili.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: na wafanyakazi vijana wa kike wa Boazi
  rationale: נַעֲרוֹת hapa inawahusu wanawake vijana waliokuwa wakifanya kazi kwa Boazi. Kutaja 'wafanyakazi' kunafanya jukumu lao katika muktadha wa mavuno lieleweke, huku 'wa kike' ikihifadhi jinsia ya nomino ya Kiebrania.
- source_word: לְלַקֵּט
  choice: ili kuokota masazo
  rationale: Kitenzi לקט kinamaanisha kuokota mabaki ya mazao yaliyosalia baada ya wavunaji. 'Kuokota masazo' ni usemi wa kawaida na unaoeleweka kwa msomaji wa Kiswahili kuliko neno la kiufundi lisilozoeleka.
- source_word: עַד כְּלוֹת
  choice: mpaka ... yalipomalizika
  rationale: Muundo huu unaonyesha kuendelea kwa tendo hadi mavuno yote mawili yalipokamilika. Kiswahili hiki ni cha asili na kinahifadhi upeo wa wakati.
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: mavuno ya shayiri na ya ngano
  rationale: Tafsiri hii inahifadhi kwa uwazi vipindi vyote viwili vya mavuno na ulinganifu wa vifungu vya Kiebrania.
- source_word: וַתֵּשֶׁב
  choice: aliishi pamoja
  rationale: ישב inaweza kumaanisha kukaa, kubaki, au kuishi. Katika muktadha huu inaelekea kueleza makao yake pamoja na Naomi, lakini tanbihi inahifadhi uwezekano wa maana ya 'alikaa/alibaki'.
- source_word: אֶת חֲמוֹתָהּ
  choice: na mama mkwe wake
  rationale: Pamoja na ישב, kifungu hiki kinaonyesha kuishi au kukaa na mtu. 'Mama mkwe wake' ni tafsiri ya kawaida na sahihi ya חֲמוֹתָהּ.
