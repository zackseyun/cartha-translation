translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. 'Kuokota masazo' linaeleza desturi ya kukusanya mabaki ya mazao baada ya wavunaji. Jina 'Ruthu' limetajwa badala ya kiwakilishi pekee ili mwanzo wa mstari usomeke kwa uwazi; 'Boazi' na 'mama mkwe' ni maumbo yanayoeleweka kwa upana.
