  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: sw
  text: Kisha Ruthu, yule Mmoabu, akasema, “Pia aliniambia, ‘Endelea kuwa karibu na vijana wangu[a] mpaka watakapomaliza mavuno yangu yote.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa umbo la kiume, “vijana wangu.” Hata hivyo, kwa kuzingatia muktadha wa mistari ya 8 na 22, tafsiri nyingine husema “wanawake vijana wangu.”
    reason: textual_contextual_ambiguity
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza masimulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: Ruthu, yule Mmoabu
