  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: Ruthu ndiye mzungumzaji; גַּם כִּי imewakilishwa kwa “Pia”; agizo la תִּדְבָּקִין limewasilishwa kwa kawaida kama “Endelea kuwa karibu”; na mwisho wa muda pamoja na umilikaji wa mavuno umehifadhiwa. “Vijana wangu” ni tafsiri salama ya הַנְּעָרִים, huku tanbihi ikitaja umbo la kiume la Kiebrania na mvutano wa kimuktadha bila kubadili matini kuu.'
