base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: sw
  text: Basi akaokota masazo shambani mpaka jioni. Kisha akapura yale aliyokuwa ameokota, ikawa karibu efa moja ya shayiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa ilikuwa kipimo cha kale cha vitu vikavu, karibu lita 20–22.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: Basi akaokota masazo
  rationale: Kitenzi לקט katika muktadha huu humaanisha kuokota mabaki ya mazao yaliyoachwa na wavunaji. “Kuokota masazo” kinaweka wazi desturi hiyo ya kilimo bila kutumia neno la jumla kama “kukusanya.” “Basi” linaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: שׂדה hapa ni shamba ambamo Ruthu alikuwa akifanya kazi; “shambani” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Kirai hiki kinaonyesha muda alioufanya kazi. “Mpaka jioni” ni cha kawaida na kinaakisi maana ya Kiebrania bila kuifanya kuwa lazima jua lilikuwa limezama kabisa.
- source_word: וַתַּחְבֹּט
  choice: akapura
  rationale: חבט hapa ni kupiga masuke yaliyookotwa ili kutenganisha punje na mabua. “Kupura” ni neno mahususi la Kiswahili kwa tendo hilo la kilimo.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: yale aliyokuwa ameokota
  rationale: Kirai husika kinarejelea mazao ambayo Ruthu alikuwa ameyaokota. Muundo huu ni wa asili katika Kiswahili na unadumisha uhusiano na kitenzi cha awali.
- source_word: וַיְהִי
  choice: nayo yakawa
  rationale: Hiki ni kishazi cha matokeo kinachotaja kiasi kilichopatikana. Kiwakilishi “nayo” kinarejelea yaliyopurwa, na “yakawa” kinaendeleza simulizi kwa kawaida.
- source_word: כְּאֵיפָה
  choice: karibu efa moja
  rationale: Kiambishi כ־ kinaonyesha makadirio, kwa hiyo “karibu” kinahifadhi kutokuwa kamili kwa kipimo. “Efa” linahifadhi kipimo cha kihistoria, huku maelezo ya kisasa yakitolewa katika tanbihi.
- source_word: שְׂעֹרִים
  choice: ya shayiri
  rationale: שׂערים ni shayiri. “Ya shayiri” huambatana kwa kawaida na kirai cha kipimo na hakiongezi maelezo yasiyokuwamo katika chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Neno la kilimo “akapura” limetumiwa kwa usahihi, huku “akaokota masazo” likifafanua kwa lugha ya kawaida tendo maalumu la kuokota mabaki baada ya wavunaji. Alama ya tanbihi imewekwa baada ya “efa moja ya shayiri,” ambako maelezo ya kipimo yanahusika.
