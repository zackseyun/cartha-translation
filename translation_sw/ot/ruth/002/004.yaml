  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: sw
  text: Tazama,[a] Boazi akaja kutoka Bethlehemu, akawaambia wavunaji, “Yahwe awe pamoja nanyi.”[b] Nao wakamjibu, “Yahwe akubariki.”[c]
  philosophy: optimal-equivalence
