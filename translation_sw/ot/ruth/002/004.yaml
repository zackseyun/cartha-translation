    text: 'Kiebrania kihalisi: “Yahwe pamoja nanyi.” Usemi huu ni salamu yenye maana ya ombi la baraka; unaweza pia kueleweka, “Yahwe yuko pamoja nanyi.”'
    reason: source_ambiguity
  - marker: c
