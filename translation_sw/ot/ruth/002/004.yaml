lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili linaingiza tukio jipya kwa msisitizo na uhai. “Tazama” ni namna fupi na yenye hadhi ya kuhifadhi kazi hiyo ya kisimulizi bila kuongeza maana isiyokuwamo.
- source_word: בֹּעַז
  choice: Boazi
  rationale: Jina limeandikwa kwa umbo linalotumiwa kwa kawaida katika Kiswahili na linaloweza kutamkwa kwa urahisi.
- source_word: בָּא מִבֵּית לֶחֶם
  choice: akaja kutoka Bethlehemu
  rationale: Kitenzi בוא na kihusishi מִן vinaonyesha kuja kutoka mahali fulani; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לַקֹּצְרִים
  choice: akawaambia wavunaji
  rationale: קצר humaanisha kuvuna mazao. “Wavunaji” linafaa kwa mazingira ya shamba na ni la kawaida kuliko tafsiri ya kiufundi zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina la kibinafsi lililo katika Kiebrania.
- source_word: עִמָּכֶם
  choice: awe pamoja nanyi
  rationale: Kiebrania kinasema kihalisi “Yahwe pamoja nanyi” bila kitenzi. Katika salamu hii, “awe” huwasilisha kwa kawaida nguvu ya ombi au baraka.
- source_word: יְבָרֶכְךָ
  choice: akubariki
  rationale: Umbo la kitenzi linaeleza tamanio au baraka. Katika Kiswahili, “Yahwe akubariki” huonyesha maana hiyo kwa njia ya kawaida na fupi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni YHWH. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya usemi יְהוָה עִמָּכֶם
  choice: Yahwe awe pamoja nanyi
  alternative: Yahwe yuko pamoja nanyi
  rationale: Muktadha wa salamu na jibu la wafanyakazi unaunga mkono kuuelewa usemi huu kama ombi la baraka, si taarifa tu. Hata hivyo, kwa kuwa Kiebrania hakina kitenzi kilichoandikwa, uwezekano wa tafsiri ya taarifa umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo yamewekwa kwa lugha rahisi ya salamu za shambani; “nanyi” hudumisha wingi wa עִמָּכֶם, huku “akubariki” hudumisha umoja wa יְבָרֶכְךָ unaomwelekea Boazi.
