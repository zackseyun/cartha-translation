base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: sw
  text: Akasema, “Tafadhali niruhusu niokote masazo na kuyakusanya kati ya miganda nyuma ya wavunaji.” Basi akaja, naye amekaa hapa tangu asubuhi mpaka sasa; ameketi kibandani kwa muda mfupi tu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amepumzika kibandani kwa muda mfupi tu.” Kifungu cha mwisho katika Kiebrania ni kigumu; neno lililotafsiriwa “kibandani” kwa kawaida humaanisha “nyumbani” au “katika nyumba,” lakini hapa huenda linamaanisha kibanda cha wafanyakazi shambani.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: Tafadhali niruhusu niokote masazo
  rationale: Kauli ya kutaka pamoja na נָא inaonyesha ombi la heshima. ‘Kuokota masazo’ ni usemi wa kawaida unaoeleza kuokota mabaki ya mavuno.
- source_word: וְאָסַפְתִּי
  choice: na kuyakusanya
  rationale: Inatofautisha kitendo cha kukusanya na לקט, yaani kuokota masazo.
- source_word: בָעֳמָרִים
  choice: kati ya miganda
  rationale: עֳמָרִים ni mashina ya nafaka yaliyofungwa kuwa miganda; ‘kati ya’ linafaa kwa mazingira ya shamba.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: nyuma ya wavunaji
  rationale: 'Inahifadhi maana ya mahali: Ruthu alifuata nyuma ya wafanyakazi waliokuwa wakivuna.'
- source_word: וַתָּבֹא וַתַּעֲמוֹד
  choice: Basi akaja, naye amekaa hapa
  rationale: Ingawa תעמד kwa msingi ni ‘akasimama,’ hapa pamoja na kipindi kinachofuata inaonyesha kuendelea kuwepo na kufanya kazi. ‘Amekaa hapa’ ni Kiswahili cha kawaida kwa kuendelea kuwa mahali, si lazima kuketi.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: tangu asubuhi mpaka sasa
  rationale: Huonyesha muda unaoendelea kuanzia asubuhi hadi wakati wa taarifa.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: ameketi kibandani kwa muda mfupi tu
  rationale: Kifungu hiki cha Kiebrania ni kigumu. Tafsiri hii inaeleza kwamba muda wake wa kuketi au kupumzika katika makao ya wafanyakazi ulikuwa mfupi, huku tanbihi ikihifadhi ugumu na uwezekano mwingine.
