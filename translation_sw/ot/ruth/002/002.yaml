base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: sw
  text: Ruthu Mmoabu akamwambia Naomi, “Tafadhali, niruhusu niende shambani nikaokote masuke nyuma ya yule ambaye nitapata kibali machoni pake[a].” Naomi akamwambia, “Nenda, binti yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “ambaye nitapata kibali machoni pake.” Hii ni nahau inayomaanisha mtu ambaye atanionea kibali au upendeleo.
    reason: Hufafanua nahau bila kufinya maana yake kuwa ruhusa pekee.
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: Mmoabu
  rationale: Ni jina la asili ya Ruthu na linadumisha msisitizo wa simulizi kwamba alikuwa mwanamke kutoka Moabu.
- source_word: אֵלְכָה נָּא
  choice: Tafadhali, niruhusu niende
  rationale: Huwasilisha ombi la heshima linaloonyeshwa na cohortative pamoja na נָא, badala ya kauli rahisi ya wakati ujao.
- source_word: הַשָּׂדֶה
  choice: shambani
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kwenda katika eneo la kilimo linalokusudiwa hapa.
- source_word: וַאֲלַקֳטָּה
  choice: nikaokote
  rationale: Katika muktadha wa mavuno, kitenzi hiki kinaonyesha kuokota mazao yaliyosalia; ‘kuokota’ ni cha kawaida na kinaeleweka kwa urahisi.
- source_word: בַשִּׁבֳּלִים
  choice: masuke
  rationale: Neno linamaanisha masuke au vichwa vya nafaka, si miganda iliyofungwa.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: nyuma ya yule ambaye nitapata kibali machoni pake
  rationale: Inadumisha picha ya kufuata nyuma wakati wa mavuno, umoja wa mhusika asiyeainishwa, na nahau ya Kiebrania ya kupata kibali machoni pa mtu.
- source_word: חֵן
  choice: kibali
  rationale: Katika mazingira haya ya kijamii, neno linamaanisha kukubaliwa au kutazamwa kwa upendeleo, bila kulipa maana maalumu ya kiteolojia.
- source_word: לְכִי בִתִּי
  choice: Nenda, binti yangu
  rationale: Inahifadhi amri rahisi pamoja na namna ya upendo ambayo Naomi anatumia kumwita Ruthu.
