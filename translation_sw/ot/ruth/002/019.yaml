base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: sw
  text: Mama mkwe wake akamuuliza, “Umeokota masazo ya mavuno wapi leo, na umefanya kazi wapi? Abarikiwe aliyekujali.” Basi akamweleza mama mkwe wake mambo aliyoyafanya pamoja naye[a], akasema, “Jina la mtu ambaye nimefanya kazi pamoja naye leo ni Boazi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa halisi zaidi kinasema, “kile alichofanya pamoja naye,” na baadaye, “mtu ambaye nimefanya pamoja naye leo.” Katika muktadha huu, usemi huo unahusu kazi ya shambani.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: mama mkwe wake
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa mama wa mume katika muktadha huu.
- source_word: לִקַּטְתְּ
  choice: umeokota masazo
  rationale: Kitenzi kinahusu kuokota masazo ya mavuno yaliyobaki shambani; tafsiri hii inaeleweka kwa urahisi na kuhifadhi mazingira maalumu ya kilimo.
- source_word: וְאָנָה עָשִׂית
  choice: na umefanya kazi wapi
  rationale: Ingawa עשה kwa msingi ni ‘kufanya,’ hapa muktadha wa kuokota masazo unaonyesha kazi ya shambani.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: Na abarikiwe aliyekujali
  rationale: מכירך humaanisha aliyemtambua au kumwangalia Ruthu kwa makusudi; ‘aliyekujali’ huwasilisha uangalifu huo wenye fadhili kwa Kiswahili cha kawaida.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: mtu ambaye alikuwa amefanya kazi kwake
  rationale: Kiebrania ni halisi zaidi, ‘alichofanya pamoja naye.’ Katika muktadha huu, Kiswahili ‘kufanya kazi kwake’ huepuka kudokeza kimakosa kwamba Boazi na Ruthu walikuwa wafanyakazi wenza, huku tanbihi ikihifadhi muundo halisi.
- source_word: אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: ambaye nimefanya kazi kwake
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inaonyesha kwamba kazi ya Ruthu ilifanyika katika eneo au chini ya mamlaka ya mtu huyo; usemi halisi zaidi umeonyeshwa katika tanbihi.
- source_word: בֹּעַז
  choice: Boazi
  rationale: Umbo ‘Boazi’ limezoeleka na linafuata urekebishaji wa kawaida wa jina hili la Kiebrania katika Kiswahili.
