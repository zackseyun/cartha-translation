translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa Maandiko. ‘Kuokota masazo’ kimetumiwa badala ya istilahi isiyoeleweka kwa wasomaji wengi, na muundo wa baraka umehifadhiwa bila kuongeza ufafanuzi wa kiteolojia.
