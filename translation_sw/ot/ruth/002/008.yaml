  to: Ndipo Boazi akamwambia Ruthu, “Je, hujasikia, binti yangu? Usiende kuokota masazo katika shamba lingine, wala usiondoke hapa; bali ushikamane na wasichana wangu.”
  rationale: The revised text restores the Hebrew rhetorical question, uses an agriculturally apt expression for gleaning, and translates נַעֲרֹתָי without adding an unwarranted servant-status nuance. “Ushikamane na” retains the sense of דבק, to stay closely attached to a group.
