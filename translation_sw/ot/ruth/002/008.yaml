review_pass:
  verdict: revise
  source_fidelity: Rhetorical question הֲלוֹא שָׁמַעַתְּ is not an imperative; it is best retained as “Je, hujasikia?” The prohibitions and instruction to remain with Boaz's female workers are otherwise represented.
  naturalness: The revision uses idiomatic Standard East African Swahili while retaining the direct, protective register of Boaz's speech.
  terminology: “Kuokota masazo” clearly conveys gleaning. “Wasichana wangu” represents נַעֲרֹתָי (“my young women”) without adding the stronger and potentially misleading status term “watumishi.”
  issues:
  - severity: medium
    issue: The opening rhetorical question is rendered as the imperative “Sikiliza.”
    rationale: Although “Listen” follows the English audit trail, the Hebrew explicitly asks, “Have you not heard, my daughter?” A direct Swahili rhetorical question preserves both form and discourse force.
  - severity: medium
    issue: “Watumishi wangu wa kike” adds a servant-status sense not explicit in נַעֲרֹתָי.
    rationale: The Hebrew denotes Boaz's young women/female workers. “Wasichana wangu” preserves the reference without over-specifying their social or employment status.
  - severity: low
    issue: “Masalia” is less precise and less natural here than “masazo.”
    rationale: In an agricultural gleaning context, “masazo” naturally refers to what remains after harvesting.
  revised_text: Ndipo Boazi akamwambia Ruthu, “Je, hujasikia, binti yangu? Usiende kuokota masazo katika shamba lingine, wala usiondoke hapa; bali ushikamane na wasichana wangu.”
