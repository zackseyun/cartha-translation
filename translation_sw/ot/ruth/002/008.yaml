base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: sw
  text: Ndipo Boazi akamwambia Ruthu, “Je, hujasikia, binti yangu? Usiende kuokota masazo katika shamba lingine, wala usiondoke hapa; bali ushikamane na wasichana wangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Sikiliza
  rationale: Muundo wa Kiebrania ni swali la balagha, kihalisi ‘Je, hujasikia?’ Katika muktadha huu hutumika kuvuta usikivu na kusisitiza agizo linalofuata; ‘Sikiliza’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: לִלְקֹט
  choice: kuokota masalia
  rationale: Kitenzi kinamaanisha kukusanya masazo ya mavuno yaliyoachwa shambani; ‘kuokota masalia’ hufafanua tendo kuliko ‘kuokota’ peke yake.
- source_word: תִדְבָּקִין
  choice: ukae karibu
  rationale: Mzizi דבק una wazo la kushikamana au kubaki karibu. Hapa unamhimiza Ruthu asijitenge na kundi la watumishi wa kike.
- source_word: נַעֲרֹתָי
  choice: watumishi wangu wa kike
  rationale: Katika mazingira ya mavuno, neno hilo linaelekea kumaanisha wanawake vijana walio katika kikundi cha wafanyakazi wa Boazi; ‘watumishi wangu wa kike’ huonyesha jukumu lao bila kulazimisha umri maalumu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Jina בֹּעַז limetolewa kwa umbo la Kiswahili ‘Boazi,’ na רוּת kwa ‘Ruthu.’
