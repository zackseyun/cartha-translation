base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: sw
  text: Naomi akamwambia binti-mkwe wake[a], “Abarikiwe na Yahwe, ambaye hajawaacha walio hai wala waliokufa bila fadhili zake.” Kisha Naomi akamwambia, “Mtu huyo ni jamaa yetu wa karibu; yeye ni mmoja wa wakombozi wetu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Abarikiwe na Yahwe, yeye ambaye hajawaacha walio hai wala waliokufa bila fadhili zake,” ikiwa “fadhili zake” zinaeleweka kuwa za Boazi badala ya za Yahwe.'
    reason: alternative_reading
  - marker: b
    text: Au, “mmoja wa jamaa zetu wakombozi.” Neno la Kiebrania humaanisha jamaa wa karibu mwenye haki au wajibu unaotambuliwa wa kukomboa mtu wa familia au mali yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: Na abarikiwe na Yahwe
  rationale: Kauli isiyo na kitenzi ina nguvu ya tamko au ombi la baraka. Muundo huu ni wa kawaida na wenye heshima katika Kiswahili, huku ‘na Yahwe’ ikimtaja Mungu kuwa chanzo cha baraka.
- source_word: חַסְדּוֹ
  choice: fadhili zake
  rationale: חֶסֶד inaweza kumaanisha fadhili, upendo thabiti, au uaminifu wa agano. ‘Fadhili’ ni neno la kawaida na lenye hadhi linalofaa muktadha, bila kufuta uwezekano kwamba kiwakilishi hicho kinamhusu Yahwe au Boazi.
- source_word: לֹא עָזַב
  choice: hajawaacha ... bila
  rationale: Muundo huu wa Kiswahili huwasilisha maana ya kutowaacha au kutowatelekeza kwa habari ya fadhili, na ni wa asili zaidi kuliko kuunganisha moja kwa moja ‘kuacha’ na ‘fadhili’.
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: walio hai wala waliokufa
  rationale: Baada ya kauli hasi, ‘wala’ huonyesha kwa kawaida kwamba makundi yote mawili yamekusudiwa, sawa na waw ya Kiebrania katika muktadha huu.
- source_word: קָרוֹב לָנוּ
  choice: jamaa yetu wa karibu
  rationale: קָרוֹב hapa inaonyesha ukaribu wa ukoo, si umbali wa mahali. ‘Jamaa yetu wa karibu’ ni wazi na ya kawaida katika Kiswahili.
- source_word: מִגֹּאֲלֵנוּ
  choice: mmoja wa wakombozi wetu
  rationale: Neno hili humaanisha jamaa mwenye haki au wajibu unaotambuliwa wa kukomboa mtu wa familia au mali. Tafsiri kuu huhifadhi neno ‘mkombozi,’ huku tanbihi ikieleza maana yake ya kifamilia na kisheria.
theological_decisions:
- issue: Kirejeleo cha viwakilishi katika kauli ya baraka
  choice: Naomi anamwombea Boazi baraka kutoka kwa Yahwe, na ‘ambaye ... fadhili zake’ katika matini kuu inarejelea Yahwe.
  alternative: ‘Fadhili zake’ zinaweza kurejelea Boazi, hivyo sentensi inaweza kueleweka kuwa Boazi hajawaacha walio hai wala waliokufa bila fadhili zake.
  rationale: Boazi ndiye anayerejelewa na ‘abarikiwe,’ ilhali kishazi cha ‘ambaye’ kinaweza kwa kawaida kumrejelea Yahwe aliye karibu zaidi kisarufi. Hata hivyo, Kiebrania hakiondoi kirejeleo cha Boazi, kwa hiyo utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mkwe wake’ linafuata matumizi ya kawaida ya Kiswahili kwa binti mkwe; tanbihi zimewekwa mara tu baada ya sehemu zinazohusika. Jina ‘Yahwe’ limehifadhiwa kulingana na safu ya ushauri ya POB.
