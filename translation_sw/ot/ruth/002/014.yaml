  to: Wakati wa chakula, Boazi akamwambia Ruthu, “Njoo hapa, ule mkate kidogo, na uchovye tonge lako katika divai yenye uchachu.[a]” Basi akaketi kando ya wavunaji, naye Boazi akampa nafaka iliyokaangwa. Ruthu akala akashiba, na akawa na kilichobaki.
