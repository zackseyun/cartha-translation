  text: וַ/יֹּאמֶר֩ לָ֨/ה בֹ֜עַז לְ/עֵ֣ת הָ/אֹ֗כֶל גֹּ֤שִֽׁי הֲלֹם֙ וְ/אָכַ֣לְתְּ מִן הַ/לֶּ֔חֶם וְ/טָבַ֥לְתְּ פִּתֵּ֖/ךְ בַּ/חֹ֑מֶץ וַ/תֵּ֨שֶׁב֙ מִ/צַּ֣ד הַ/קּֽוֹצְרִ֔ים וַ/יִּצְבָּט לָ֣/הּ קָלִ֔י וַ/תֹּ֥אכַל וַ/תִּשְׂבַּ֖ע וַ/תֹּתַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: sw
  text: Wakati wa chakula, Boazi akamwambia Ruthu, “Njoo hapa, ule mkate kidogo, na uchovye tonge lako katika divai yenye uchachu.[a]” Basi akaketi kando ya wavunaji, naye Boazi akampa nafaka iliyokaangwa. Ruthu akala akashiba, na akawa na kilichobaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siki.” Neno la Kiebrania חֹמֶץ linaweza kumaanisha siki au kinywaji cha divai yenye uchachu; katika muktadha huu wa chakula cha wavunaji, huenda divai yenye uchachu ndiyo iliyokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: Wakati wa chakula
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili unaoonyesha wakati wafanyakazi walipokula.
- source_word: גֹּשִׁי הֲלֹם
  choice: Njoo hapa
  rationale: Inawasilisha kwa kawaida amri ya kike ya kumkaribisha Ruthu asogee karibu.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: ule mkate
  rationale: Kitenzi pamoja na מִן kina maana ya kula kiasi cha mkate; Kiswahili hakihitaji kutaja ‘baadhi ya’ ili kuwasilisha maana hiyo kwa kawaida.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: uchovye kipande chako katika divai chachu
  rationale: ‘Kipande chako’ kinadumisha upana mdogo wa פַּת bila kuongeza ‘cha mkate’ moja kwa moja. חֹמֶץ inaweza kuwa siki au kinywaji cha divai kilichochacha; muktadha wa chakula cha wavunaji unaunga mkono ‘divai chachu,’ huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: kando ya wavunaji
  rationale: Ni Kiswahili cha kawaida kinachohifadhi mahali pake pembeni mwa watu waliokuwa wakivuna.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: Boazi akampa nafaka iliyokaangwa
  rationale: Kitenzi adimu kinaonyesha kumpa au kumfikishia chakula. Kurudia jina ‘Boazi’ huondoa utata wa kiwakilishi kwa Kiswahili, na קָלִי ni nafaka iliyokaangwa au kukaushwa kwa moto.
- source_word: וַתִּשְׂבַּע
  choice: akashiba
  rationale: ‘Akashiba’ ni neno la asili na lililo wazi kwa hali ya kula mpaka kutosheka.
- source_word: וַתֹּתַר
  choice: akabakiza kiasi
  rationale: Inadumisha wazo kwamba Ruthu alibakiza sehemu ya chakula baada ya kushiba, bila kutaja kwa uhakika chakula gani.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Jina ‘Ruthu’ limetajwa badala ya kiwakilishi katika sehemu mbili ili kuzuia utata wa wahusika; hakuna tofauti ya kitheolojia iliyolazimika kuamuliwa.
