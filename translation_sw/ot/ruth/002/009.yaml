base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: sw
  text: Macho yako yaelekee shamba wanamovuna, nawe uende nyuma yao. Je, sijawaamuru vijana wa kiume wasikuguse[a]? Ukipata kiu, nenda kwenye mitungi, unywe maji ambayo vijana wa kiume wamechota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana inayosisitizwa na muktadha, “wasikuwekee mkono.” Kiebrania kinasema moja kwa moja “wasikuguse,” lakini huenda onyo hilo linajumuisha ulinzi dhidi ya kunyanyaswa au kushambuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ
  choice: Macho yako yawe
  rationale: Kirai cha Kiebrania kina maana ya agizo lisilo na kitenzi kilichotamkwa wazi. Kiswahili hiki kinahifadhi picha ya macho na nguvu ya agizo kwa njia ya kawaida.
- source_word: בַּשָּׂדֶה אֲשֶׁר יִקְצֹרוּן
  choice: kwenye shamba wanamovuna
  rationale: “Shamba” linafaa kwa eneo linalolimwa, na “wanamovuna” linaonyesha shughuli inayoendelea inayolitambulisha shamba hilo.
- source_word: וְהָלַכְתִּ אַחֲרֵיהֶן
  choice: nawe ufuate nyuma yao
  rationale: Hili ni agizo linalomwelekeza Ruthu aende nyuma ya kundi la wanawake; “nyuma yao” linahifadhi uhusiano wa mahali unaoonyeshwa na Kiebrania.
- source_word: הֲלוֹא צִוִּיתִי
  choice: Je, sijawaamuru
  rationale: Muundo wa swali la balagha umehifadhiwa, pamoja na mamlaka iliyo katika kitenzi cha kuamuru.
- source_word: הַנְּעָרִים
  choice: vijana
  rationale: Katika muktadha huu neno linawahusu wafanyakazi wa kiume wa Boazi; “vijana” ni tafsiri fupi na ya kawaida, huku upatanisho wa kisarufi ukionyesha wingi.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: wasikuguse
  rationale: Hii inahifadhi maana ya msingi ya “kugusa” bila kuifungia katika aina moja tu ya madhara; maana pana ya kimuktadha imeelezwa katika tanbihi.
- source_word: וְצָמִת
  choice: Ukipata kiu
  rationale: Kiswahili hiki huwasilisha hali inayotarajiwa kwa kawaida na kwa uwazi.
- source_word: הַכֵּלִים
  choice: mitungi
  rationale: Ingawa neno la Kiebrania ni pana, yaani vyombo, katika muktadha wa maji ya kunywa “mitungi” ni picha halisi na inayoeleweka.
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: unywe maji ambayo vijana wameyateka
  rationale: “Maji” yamewekwa wazi kutokana na muktadha, na “wameyateka” linaonyesha maji yaliyokwisha kutolewa kisimani kabla ya kunywa.
theological_decisions:
- issue: Upeo wa maana ya נגע katika onyo la Boazi
  choice: wasikuguse
  alternative: wasikunyanyasе / wasikuwekee mkono
  rationale: Maana ya moja kwa moja imehifadhiwa katika matini ili kutoamua kimya kimya aina mahususi ya tishio. Tanbihi inaonyesha kuwa katika muktadha kugusa kunaweza kujumuisha kunyanyasa au kushambulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida, huku picha ya Kiebrania na tofauti kati ya kundi la wanawake wanaovuna na vijana wa kiume zikihifadhiwa kadiri Kiswahili kinavyoruhusu.
