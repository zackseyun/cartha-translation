base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: sw
  text: Kisha akasema, “Na nipate kibali machoni pako, bwana wangu, kwa maana umenifariji na umesema kwa upole na mjakazi wako,[a] ingawa mimi si kama mmoja wa wajakazi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “umezungumza na moyo wa mjakazi wako,” yaani, umesema naye kwa upole au kwa njia ya kumtia moyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: Na nipate kibali
  rationale: Kauli hii ni ombi au tamanio la heshima, si taarifa rahisi ya wakati ujao. “Kupata kibali” ni usemi wa kawaida wa Kiswahili unaowasilisha wazo la kukubaliwa kwa neema.
- source_word: בְּעֵינֶיךָ
  choice: machoni pako
  rationale: Inahifadhi taswira ya nahau ya Kiebrania kuhusu jinsi mtu anavyotazamwa au kukubaliwa, na inaeleweka katika Kiswahili.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumwita Boazi, si jina la Mungu. Herufi ndogo inasaidia kuonyesha kuwa ni cheo cha kibinadamu.
- source_word: נִחַמְתָּנִי
  choice: umenifariji
  rationale: Kitenzi kinaonyesha faraja aliyopewa Ruthu katika hali yake ya udhaifu; “umenifariji” ni sahihi na ya kawaida.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: umemsemesha kwa upole
  rationale: Nahau hii ina maana ya kusema kwa upole, kwa wema, au kwa njia inayotia moyo. Tafsiri hii ni ya asili katika Kiswahili, huku taswira halisi ya “moyo” ikihifadhiwa katika tanbihi.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: mjakazi wako / wajakazi wako
  rationale: Nomino ya Kiebrania inamtaja mtumishi wa kike. “Mjakazi” inadumisha jinsia na hali ya kijamii ya usemi wa Ruthu bila kulazimisha maana kali zaidi ya utumwa.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: ingawa mimi si kama mmoja
  rationale: '“Ingawa” inaonyesha wazi tofauti inayokusudiwa: Boazi amemtendea Ruthu kwa wema licha ya Ruthu kujiona kuwa na hadhi ya chini kuliko wajakazi wake.'
