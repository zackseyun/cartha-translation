base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: sw
  text: Ndipo akaanguka kifudifudi, akainama mpaka chini, akamwambia, “Kwa nini nimepata kibali machoni pako, hata unijali[a], ingawa mimi ni mwanamke mgeni?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unitambue,” “unione,” au “unikiri.”
    reason: Neno la Kiebrania linaweza kumaanisha kumtambua, kumwangalia kwa makini, kumjali, au kukiri uwepo wa mtu katika muktadha huu.
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: akaanguka kifudifudi
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo la kuanguka uso ukiwa chini kama ishara ya unyenyekevu mkubwa, bila kulazimisha urudiaji usio wa kawaida wa neno ‘uso.’
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: akainama mpaka chini
  rationale: Huhifadhi tendo la kuinama kwa heshima hadi chini bila kudokeza ibada ya kidini katika muktadha huu wa kijamii.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja linalotaka sababu na ndilo tamko la asili katika Kiswahili cha sasa.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nimepata kibali machoni pako
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya kupata kibali machoni mwa mtu, huku ‘kibali’ kikifaa katika muktadha huu wa mahusiano ya kijamii.
- source_word: לְהַכִּירֵנִי
  choice: hata ukanitambua
  rationale: Kitenzi kinaweza kumaanisha kutambua, kuangalia kwa makini, au kujali. ‘Ukanitambua’ huhifadhi maana ya msingi na mshangao wa Ruthu kwamba Boazi amemwona na kumjali.
- source_word: וְאָנֹכִי
  choice: ingawa mimi ni
  rationale: 'Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofauti wenye maana ya kukubali hali: Boazi amempa kibali licha ya hadhi yake.'
- source_word: נָכְרִיָּה
  choice: mwanamke mgeni
  rationale: Huhifadhi wazi umbo la kike la neno la Kiebrania na hali ya Ruthu kama mtu wa taifa jingine.
theological_decisions:
- issue: Iwapo וַתִּשְׁתַּחוּ ina maana ya ibada ya kidini
  choice: Imetafsiriwa kama tendo la kuinama kwa heshima mbele ya Boazi, si kumwabudu
  alternative: Kutumia neno ‘kuabudu,’ ambalo lingetoa maana ya kidini iliyo wazi zaidi
  rationale: Katika simulizi hili Ruthu anamwitikia Boazi kwa unyenyekevu wa kijamii. Muktadha haudai kwamba tendo hilo ni ibada kwa Mungu au kwa Boazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kifudifudi’ na ‘akainama mpaka chini’ zinaonyesha kwa pamoja mfululizo wa ishara mbili za unyenyekevu katika Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kitenzi cha kusema ili iambatane na maelezo ya usemi unaofuata bila kukatiza swali.
