base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: sw
  text: Yahweh akulipe kwa kazi yako, na thawabu yako[a] iwe kamili kutoka kwa Yahweh, Mungu wa Israeli, ambaye umekuja kutafuta hifadhi chini ya mabawa yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujira wako uwe kamili.” Neno la Kiebrania linaweza kumaanisha ujira au thawabu, na “kamili” linatokana na mzizi uleule unaohusiana na “akulipe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: na akulipe
  rationale: Piel ya שׁלם ina nguvu ya ombi au baraka hapa; “na akulipe” ni ya asili katika Kiswahili na hudumisha wazo la Mungu kulipa mema aliyotenda Ruthu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: פָּעֳלֵךְ
  choice: kwa kazi yako
  rationale: פֹּעַל inaweza kumaanisha kazi au tendo; “kazi yako” ni fupi na inaendana na lugha ya malipo, huku ikirejelea matendo ya uaminifu ya Ruthu.
- source_word: וּתְהִי
  choice: na ... na iwe
  rationale: Muundo huu unaendeleza ombi la baraka sambamba na “na akulipe.”
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: thawabu yako
  rationale: Neno linaweza kumaanisha ujira au thawabu; katika muktadha huu ni malipo ya Mungu, si lazima mshahara wa ajira.
- source_word: שְׁלֵמָה
  choice: iwe kamili
  rationale: “Kamili” huhifadhi maana ya ukamilifu na mwangwi wa mzizi שׁלם uliopo pia katika יְשַׁלֵּם.
- source_word: מֵעִם
  choice: kutoka kwa
  rationale: Kihusishi kinaonyesha chanzo cha thawabu, yaani Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni ufasiri wa kawaida na wa moja kwa moja wa muundo wa umilikaji.
- source_word: אֲשֶׁר בָּאת לַחֲסוֹת
  choice: ambaye umekuja kutafuta hifadhi
  rationale: “Umekuja kutafuta hifadhi” hudumisha kusudi linaloonyeshwa na infinitivu na kuunganisha kishazi rejeshi kwa Mungu wa Israeli.
- source_word: תַּחַת כְּנָפָיו
  choice: chini ya mabawa yake
  rationale: Taswira halisi ya mabawa imehifadhiwa kama picha ya ulinzi badala ya kufupishwa kuwa “chini ya ulinzi wake.”
theological_decisions:
- issue: Ufasiri wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya kupata hifadhi chini ya mabawa ya Mungu
  choice: chini ya mabawa yake
  alternative: chini ya ulinzi wake
  rationale: Taswira ya kishairi na kitheolojia ya Kiebrania imehifadhiwa bila kuibainisha kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa baraka umehifadhiwa kwa “na akulipe ... na ... na iwe,” na taswira ya mabawa imeachwa wazi.
