base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: sw
  text: Kisha Naomi akamwambia Ruthu, mkwewe, “Ni vizuri, binti yangu, uende pamoja na vijana wake wa kike, ili watu wasije wakakukuta[a] katika shamba lingine.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasije wakakusumbua/kukushambulia.” Kitenzi cha Kiebrania kinaweza kumaanisha kukutana tu na mtu au kukutana naye kwa nia ya kumdhuru. Katika muktadha huu, Naomi anaonekana kuhofia usalama wa Ruthu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: כַּלָּתָהּ
  choice: mkwewe
  rationale: Neno hili linamtambulisha Ruthu kwa uhusiano wake na Naomi. “Mkwewe” ni tafsiri ya kawaida ya Kiswahili katika muktadha huu.
- source_word: טוֹב
  choice: Ni vizuri
  rationale: Inahifadhi tathmini rahisi ya Naomi bila kuifanya kuwa kauli ya kiwango cha juu kama “ni bora zaidi.”
- source_word: בִּתִּי
  choice: binti yangu
  rationale: Ni usemi wa kifamilia na wa upendo hapa, wala haumaanishi kwamba Ruthu ni binti wa kumzaa Naomi.
- source_word: כִּי תֵצְאִי
  choice: uende
  rationale: כִּי inaanzisha jambo ambalo Naomi analiona kuwa jema, na תֵצְאִי kimsingi ni kwenda au kutoka. Kiswahili “uende” ni cha asili bila kuongeza wazi tendo la kuokota masazo ambalo halimo katika kitenzi.
- source_word: עִם נַעֲרוֹתָיו
  choice: pamoja na vijana wake wa kike
  rationale: Nomino ya wingi wa kike inawarejelea wafanyakazi vijana wa Boazi. Tafsiri hii haiongezi hadhi ya utumishi ambayo haijaelezwa moja kwa moja.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: ili wasije wakakukuta[a]
  rationale: Kitenzi פגע kinaweza kumaanisha kukutana na mtu, kumkuta, au kumdhuru katika mkutano wenye uhasama. “Wakakukuta” huhifadhi upana huo kadiri inavyowezekana, huku muundo wa “wasije” ukionyesha tahadhari ya Naomi.
- source_word: בְּשָׂדֶה אַחֵר
  choice: katika shamba lingine
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha mahali.
