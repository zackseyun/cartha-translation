base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: sw
  text: Ndipo yule kijana aliyesimamia wavunaji akajibu, akasema, “Yeye ni msichana Mmoabu aliyerudi pamoja na Naomi kutoka mashamba ya Moabu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka shamba la Moabu”; neno la Kiebrania liko katika umoja, lakini linaweza kueleweka kwa maana ya pamoja likimaanisha maeneo ya kilimo ya Moabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Katika simulizi, kitenzi ענה hutanguliza jibu; ‘akajibu’ ni cha kawaida na huhifadhi uhusiano wake na ‘akasema’.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: נַעַר humaanisha kijana au mtumishi. Muktadha unaeleza wajibu wake kando, hivyo ‘kijana’ huepuka kuingiza cheo kisichotajwa moja kwa moja.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: aliyesimamia wavunaji
  rationale: Kirai kinaonyesha kwamba alikuwa amewekwa juu ya wavunaji katika nafasi ya usimamizi. ‘Aliyesimamia’ ni Kiswahili cha kawaida kinachowasilisha wajibu huo bila kumwita kwa cheo maalumu.
- source_word: הַקּוֹצְרִים
  choice: wavunaji
  rationale: Neno linawataja watu wanaovuna nafaka; ‘wavunaji’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Huhifadhi mfuatano wa kawaida wa simulizi ya Kiebrania baada ya ‘akajibu’.
- source_word: נַעֲרָה
  choice: mwanamke kijana
  rationale: Neno linamaanisha mwanamke mwenye umri mdogo. ‘Mwanamke kijana’ ni wazi na yenye heshima, bila kumfanya aonekane mtoto.
- source_word: מוֹאֲבִיָּה
  choice: Mmoabu
  rationale: Huhifadhi moja kwa moja utambulisho wake wa kikabila na wa asili.
- source_word: הִיא
  choice: Huyu ni
  rationale: Katika jibu la kumtambulisha mtu anayeonekana au anayerejelewa, ‘Huyu ni’ ni Kiswahili cha asili na huwasilisha kauli ya utambulisho.
- source_word: הַשָּׁבָה
  choice: aliyerudi
  rationale: שורש שוב ina maana ya kurudi; ‘aliyerudi’ pia huhifadhi motifu ya kurudi katika simulizi la Ruthu.
- source_word: עִם נָעֳמִי
  choice: pamoja na Naomi
  rationale: Huwasilisha wazi maana ya kuandamana bila kuongeza maelezo.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: kutoka mashambani mwa Moabu
  rationale: Umoja שְׂדֵה unaweza kutumiwa kwa maana ya pamoja au ya eneo la kilimo. ‘Mashambani mwa Moabu’ ni ya asili na huwasilisha maana hiyo ya eneo.
