lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza matukio kwa mfuatano; “Kisha” ni wa kawaida katika Kiswahili na huhifadhi mwendelezo huo.
- source_word: בֹּעַז
  choice: Boazi
  rationale: Jina limetoholewa kwa umbo linalotambulika na lililozoeleka katika Kiswahili.
- source_word: לְנַעֲרוֹ
  choice: kijana wake
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au mhudumu. “Kijana wake” huhifadhi maana ya msingi bila kuingiza hadhi ya utumishi isiyosemwa wazi; jukumu lake la usimamizi linaelezwa na kishazi kinachofuata.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: aliyekuwa amesimama kuwasimamia wavunaji
  rationale: Kitenzi נצב katika Niphal pamoja na עַל kinaonyesha mtu aliyewekwa au aliyesimama juu ya wengine kwa jukumu la usimamizi. Tafsiri hii huhifadhi taswira ya kusimama na maana ya kusimamia; קֹצְרִים ni “wavunaji.”
- source_word: לְמִי
  choice: ni wa nani
  rationale: Nahau hii huuliza kuhusu uhusiano wa kijamii, kaya, au mtu ambaye mwanamke huyo anahusishwa naye. “Ni wa nani” ni swali la kawaida la Kiswahili lakini linaweza kueleweka kama umiliki, kwa hiyo tanbihi inaeleza upana wake.
- source_word: הַנַּעֲרָה
  choice: mwanamke kijana
  rationale: נַעֲרָה humaanisha mtu wa kike mwenye umri mdogo. “Mwanamke kijana” ni lugha ya sasa na haiamui kwamba alikuwa msichana mdogo au mtumishi.
- source_word: הַזֹּאת
  choice: huyu
  rationale: Kionyeshi hiki kinarejelea mwanamke kijana aliyekuwa mbele yao; “huyu” ndilo umbo la kawaida la Kiswahili kwa ngeli ya mtu.
