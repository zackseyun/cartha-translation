  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: sw
  text: Tena, mngoe kwa makusudi baadhi ya mashuke kutoka katika miganda[a] kwa ajili yake, myaache ili aviokote[b]; wala msimkemee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafungu ya mashina.” Neno la Kiebrania linamaanisha mafungu ya mashina yaliyokusanywa.
    reason: lexical_alternative
  - marker: b
    text: Au “mwacheni aokote.” Kitenzi cha Kiebrania ni istilahi ya kawaida ya kuokota nafaka shambani baada ya kuvuna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Neno hili linaendeleza na kuongeza mkazo kwa agizo lililotangulia kwa Kiswahili cha kawaida.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: lazima mwawatolee
  rationale: 'Muundo wa kitenzi pamoja na kitenzi-jina cha mkazo unaonyesha agizo la makusudi na lenye nguvu: wafanyakazi watoe nafaka, si waiangushe kwa bahati.'
- source_word: לָהּ
  choice: mwawatolee
  rationale: Kiambishi cha utendea -e- pamoja na kiwakilishi -wa- kinaonyesha kwamba kitendo kinafanywa kwa manufaa yake.
- source_word: מִן הַצְּבָתִים
  choice: baadhi ya mashuke kutoka katika miganda
  rationale: צבתים ni mafungu ya mashina yaliyokusanywa; “miganda” ni istilahi ya kawaida ya kilimo, huku “mashuke” yakibainisha kile kinachotolewa.
- source_word: וַעֲזַבְתֶּם
  choice: na kuyaacha
  rationale: Inaonyesha kwamba mashuke yaliyotolewa yaachwe pale ili Ruthu ayaokote.
- source_word: וְלִקְּטָה
  choice: ili ayaokote
  rationale: לקט ni neno la kawaida la kuokota masazo ya mavuno shambani; “ayaokote” ni wazi na ya asili katika muktadha huu.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: wala msimkemee
  rationale: גער humaanisha kukemea au kumkaripia mtu kwa nguvu; “msimkemee” huhifadhi uzito wa katazo.
