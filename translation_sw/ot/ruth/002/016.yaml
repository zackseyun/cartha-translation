review_pass:
  verdict: revise
  source_fidelity: 'Rasimu inafuata kwa jumla mfuatano wa Kiebrania: agizo la nyongeza, utoaji wa makusudi kutoka katika mafungu yaliyokusanywa, kuviacha, Ruthu kuviokota, na katazo la kumkemea. Hata hivyo, “mwawatolee” si umbo sahihi au wazi hapa: kiambishi -wa- hurejelea wao, si Ruthu mmoja, na kitenzi hakielezi vizuri tendo la kung’oa/kutoa nafaka kutoka migandani. Marekebisho yanahifadhi msisitizo wa שֹׁל תָּשֹׁלּוּ kwa “kwa makusudi.”'
  naturalness: “Mngoe ... kwa ajili yake” ni Kiswahili Sanifu cha kawaida na hueleza kwa uwazi kuwa wafanyakazi wanapaswa kutoa nafaka kwa makusudi kwa manufaa ya Ruthu. “Myaache” na “aviokote” vina viambishi vinavyorejelea “mashuke” kwa ulinganifu wa kisarufi.
  terminology: “Mashuke” na “miganda” vinafaa katika muktadha wa uvunaji. Tanbihi ya kwanza yahifadhi mbadala wa kileksia “mafungu ya mashina.” Tanbihi ya pili inapaswa kuwa mbadala halisi wa tafsiri (“mwacheni aokote”), badala ya ufafanuzi unaoweza kudokeza kwamba ni masazo tu ya kawaida; katika mstari huu nafaka inaachwa kwa makusudi.
  issues:
  - severity: high
    issue: “mwawatolee” ina kiambishi cha yambwa -wa- kisichomrejelea Ruthu mmoja na ni tungo isiyo wazi katika muktadha.
    rationale: Kiebrania לָהּ ni ‘kwa ajili yake’ (umoja wa kike), ilhali -wa- kwa kawaida ni ‘wao.’ Pia kitenzi kinahitaji kueleza kitendo cha makusudi cha kutoa/kuvuta nafaka kutoka katika miganda.
  - severity: medium
    issue: Tanbihi b haijawasilishwa kama mbadala wa tafsiri.
    rationale: Tanbihi ya Kiingereza ina ‘Or let her glean.’ Ufafanuzi “Yaani, aokote masazo...” unaongeza maelezo badala ya kutoa mbadala, na ‘masazo’ inaweza kuficha ukweli kwamba nafaka hiyo imeachwa kwa makusudi.
  revised_text: Tena, mngoe kwa makusudi baadhi ya mashuke kutoka katika miganda[a] kwa ajili yake, myaache ili aviokote[b]; wala msimkemee.
