  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: sw
  text: Yule mtu akasema, “Wameondoka hapa, kwa maana niliwasikia wakisema,[a] ‘Twendeni Dothani.’[b]” Basi Yosefu akawafuata ndugu zake, akawakuta huko Dothani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilisikia wakisema.”
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, jina “Dothani” lina kiambishi kinachoonyesha mwendo kuelekea mahali hapo; kihalisi, “kuelekea Dothani.”
    reason: cultural_note
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: Wameondoka hapa
  rationale: Kitenzi נסע hapa kinaonyesha kuondoka mahali na kuendelea na safari. Kauli hii ni ya kawaida katika Kiswahili na haitilii mkazo usio lazima juu ya kuvunja kambi.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya mtu huyo kujua kwamba ndugu zake walikuwa wameondoka.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: niliwasikia wakisema
  rationale: Muundo huu unahifadhi maana ya kusikia watu waliotajwa katika muktadha wakiwa wanasema; kiambishi cha ‘wa-’ kinawarejelea ndugu za Yosefu bila kuhitaji kurudia nomino.
- source_word: נֵלְכָה
  choice: Twendeni
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha wito au azimio la pamoja unaowakilishwa na kohotativi ya Kiebrania.
- source_word: דֹּתָיְנָה
  choice: Dothani
  rationale: Jina la mahali limetoholewa kwa umbo linalotambulika katika Kiswahili; muktadha na kiambishi elekezi cha Kiebrania vinaonyesha mwendo kuelekea huko.
- source_word: אַחַר אֶחָיו
  choice: akawafuata ndugu zake
  rationale: Kitenzi ‘kufuata’ kinaonyesha kwa kawaida kwenda nyuma ya watu ili kuwafikia, bila kuongeza wazo lenye nguvu zaidi la kuwasaka.
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: akawakuta huko Dothani
  rationale: ‘Kuwakuta’ ni usemi wa asili wa Kiswahili kwa kumpata mtu mahali fulani; ‘huko’ linaonyesha mahali palipotajwa awali.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Viunganishi vya ‘aka-’ vinadumisha mfululizo wa matukio ya simulizi, huku usemi wa moja kwa moja ukibaki wa kawaida.
