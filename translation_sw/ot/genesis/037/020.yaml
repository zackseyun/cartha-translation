base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: sw
  text: Basi sasa, njooni, tumuue na tumtupe ndani ya mojawapo ya mashimo[a], nasi tutasema, ‘Mnyama mkali wa mwituni amemla.’ Kisha tutaona ndoto zake zitakuwaje.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani ya mojawapo ya mabirika.” Neno la Kiebrania בּוֹר linaweza kumaanisha shimo, birika, au sehemu ya kuhifadhia maji kama kisima, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inahifadhi nguvu ya kiunganishi pamoja na dharura ya wakati katika pendekezo la ndugu zake.
- source_word: לְכוּ
  choice: njooni
  rationale: Hapa amri ya wingi inatumika kama mwito wa kuanza hatua ya pamoja, si kama agizo halisi la kuondoka.
- source_word: וְנַהַרְגֵהוּ
  choice: tumuue
  rationale: Muundo wa Kiebrania unaonyesha pendekezo la kitendo cha pamoja; Kiswahili cha kuhimiza kinafikisha maana hiyo kwa kawaida.
- source_word: וְנַשְׁלִכֵהוּ
  choice: na kumtupa
  rationale: Kitenzi kinamaanisha kutupa; muundo huu unaunganisha kwa kawaida vitendo viwili vilivyopendekezwa.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: ndani ya mojawapo ya mashimo
  rationale: בּוֹר inaweza kuwa shimo au birika la kuhifadhia maji; ‘shimo’ ni neno pana na linalofaa katika muktadha huu.
- source_word: וְאָמַרְנוּ
  choice: nasi tutasema
  rationale: Inaonyesha hatua inayofuata katika mpango wao na inahifadhi nafsi ya kwanza wingi.
- source_word: חַיָּה רָעָה
  choice: mnyama mkali
  rationale: Kirai kinamaanisha mnyama hatari au mbaya; ‘mnyama mkali’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: אֲכָלָתְהוּ
  choice: amemrarua
  rationale: Ingawa kitenzi msingi ni ‘kula,’ katika taarifa ya kushambuliwa na mnyama ‘amemrarua’ huwasilisha kwa kawaida maana ya kumla kabisa au kumwangamiza, kama ‘devoured.’
- source_word: וְנִרְאֶה
  choice: Kisha tutaona
  rationale: Inafikisha matokeo ya dhihaka wanayotarajia baada ya kutekeleza mpango wao.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: ndoto zake zitakuwaje
  rationale: Inahifadhi kwa karibu swali la Kiebrania huku ikionyesha changamoto yao ya dhihaka kuhusu matokeo ya ndoto zake.
theological_decisions:
- issue: Nguvu ya וְנִרְאֶה na maana ya mwisho wa ndoto
  choice: Kisha tutaona ndoto zake zitakuwaje
  alternative: Kisha tutaona nini kitakachotokea kwa ndoto zake
  rationale: Chaguo kuu linabaki karibu na muundo halisi wa Kiebrania na halifungi iwapo wanamaanisha kutimia, matokeo, au kubatilika kwa ndoto hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa moja kwa moja umewekwa wazi, na sauti ya njama pamoja na dhihaka ya ndugu zake imehifadhiwa.
