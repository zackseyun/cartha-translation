  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: sw
  text: Ndugu zake walipoona kwamba baba yao alimpenda kuliko ndugu zake wote, wakamchukia, wala hawakuweza kusema naye kwa amani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuweza kusema naye kwa urafiki,” yaani, hawakuweza kuzungumza naye kama watu wenye uhusiano mwema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: walipoona
  rationale: Muundo huu unaonyesha mfuatano wa simulizi na uhusiano wa wakati kati ya kuona kwao na chuki iliyofuata.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu neno linawarejelea ndugu wa kiume wa Yosefu; Kiswahili kwa kawaida hutumia “ndugu zake,” huku muktadha ukibainisha jinsia.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha jambo waliloliona, yaani kwamba baba yao alimpenda Yosefu zaidi.
- source_word: אָהַב
  choice: alimpenda
  rationale: Kitenzi cha Kiebrania humaanisha moja kwa moja “kupenda”; wazo la upendeleo linatokana na ulinganisho unaofuata, si kwa kubadili kitenzi kuwa “alimpendelea.”
- source_word: אֲבִיהֶם
  choice: baba yao
  rationale: Kiambishi cha nafsi ya tatu wingi kinawarejelea ndugu kwa pamoja, hivyo “baba yao” ni sahihi na ya kawaida.
- source_word: מִכָּל אֶחָיו
  choice: kuliko ndugu zake wote
  rationale: Huhifadhi ulinganisho wa Kiebrania bila kuongeza neno lisilo wazi katika matini kama “wengine.”
- source_word: וַיִּשְׂנְאוּ
  choice: wakamchukia
  rationale: Kitenzi kina maana ya moja kwa moja ya “kuchukia,” na “waka-” kinaendeleza mfuatano wa simulizi.
- source_word: וְלֹא יָכְלוּ
  choice: wala hawakuweza
  rationale: Huhifadhi maana ya kutoweza na kuunganisha kwa kawaida hali hiyo na chuki iliyotangulia.
- source_word: דַּבְּרוֹ
  choice: kusema naye
  rationale: Kiambishi kinamrejelea Yosefu. “Kusema naye” ni Kiswahili cha kawaida kwa kuzungumza na mtu.
- source_word: לְשָׁלֹם
  choice: kwa amani
  rationale: Huhifadhi taswira ya msingi ya שָׁלוֹם na pia inaweza kumaanisha kuzungumza kwa urafiki au bila uhasama.
