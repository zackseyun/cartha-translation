  language: sw
  text: Wakaambiana, “Tazama, huyu bwana wa ndoto anakuja!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “bwana wa ndoto.” Usemi huu wa Kiebrania unaweza kumaanisha mtu anayehusishwa sana na ndoto; hapa ndugu zake wanamsema Yosefu kwa dhihaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Wakaambiana
  rationale: Usemi wa Kiebrania, kwa maana halisi ‘mtu akamwambia ndugu yake,’ una maana ya kutendeana; ‘wakaambiana’ ni Kiswahili cha kawaida kinachohifadhi mfuatano wa simulizi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa mtu anayeonekana akikaribia; ‘Tazama’ ni la sasa, lenye hadhi, na linafaa katika usemi wa moja kwa moja.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: bwana wa ndoto
  rationale: Tafsiri hii inadumisha taswira halisi ya בעל (‘bwana/mwenye’) na dhihaka ya ndugu zake, bila kuifupisha kuwa ‘mwotaji’ na hivyo kupoteza upekee wa msemo.
- source_word: הַלָּזֶה
  choice: huyu
  rationale: Kiwakilishi hiki kinamwonyesha Yosefu moja kwa moja na katika muktadha kinaweza kubeba sauti ya dharau.
- source_word: בָּא
  choice: anakuja
  rationale: Umbo la kitenzi linaonyesha tendo linaloendelea la kukaribia; ‘anakuja’ ni tafsiri ya kawaida na sahihi.
