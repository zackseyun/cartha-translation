translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi ‘bwana wa ndoto’ umehifadhiwa ili kubeba taswira na kejeli ya Kiebrania; alama ya mshangao inaonyesha dhihaka yenye msisitizo katika usemi wao.
