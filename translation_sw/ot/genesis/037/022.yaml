base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: sw
  text: Rubeni akawaambia, “Msimwage damu. Mtupeni katika shimo hili lililo nyikani[a], wala msimtie mkono.” Alisema hivyo ili amwokoe mikononi mwao[b] na kumrudisha kwa baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “birika.” Neno la Kiebrania linaweza kumaanisha shimo au birika lililochimbwa kwa ajili ya kuhifadhi maji.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka mikononi mwao,” yaani, kutoka katika uwezo wao.'
    reason: idiom_clarification
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: Msimwage damu
  rationale: Inahifadhi nahau ya Kiebrania ya ‘kumwaga damu,’ inayodokeza mauaji na hatia ya damu, bila kuifafanua kupita kiasi kuwa ‘msimuue.’
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: Mtupeni
  rationale: Ni amri ya kawaida na ya moja kwa moja inayoonyesha tendo la kumtupa ndani ya shimo.
- source_word: הַבּוֹר
  choice: shimo
  rationale: Neno la Kiebrania linaweza kumaanisha shimo au birika la kuhifadhia maji; ‘shimo’ linafaa kwa maana pana katika simulizi, huku maana mahususi zaidi ikihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: lililo nyikani
  rationale: ‘Nyikani’ huonyesha eneo lisilokaliwa au la malisho pori, bila kulazimisha wazo la jangwa la mchanga.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: lakini msimnyoshee mkono
  rationale: Inahifadhi picha ya mkono katika nahau ya Kiebrania na kueleza katazo la kumfanyia ukatili, kwa lugha ya Kiswahili inayoeleweka.
- source_word: לְמַעַן הַצִּיל אֹתוֹ מִיָּדָם
  choice: Alisema hivyo ili amwokoe mikononi mwao
  rationale: ‘Ili’ huonyesha kusudi la siri la Rubeni, na ‘mikononi mwao’ huhifadhi nahau ya kuwa chini ya uwezo wao.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: na kumrudisha kwa baba yake
  rationale: Huwasilisha kwa kawaida tendo lililokusudiwa la kumpeleka Yosefu tena kwa baba yake.
- source_word: רְאוּבֵן
  choice: Rubeni
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Uhusiano wa kauli ya Rubeni na maelezo ya kusudi lake
  choice: Kufunga maneno ya moja kwa moja baada ya ‘msimnyoshee mkono,’ kisha kusema ‘Alisema hivyo ili…’
  alternative: Kuendeleza kishazi cha kusudi ndani ya maneno yaliyonukuliwa
  rationale: Kishazi kinachoanza na לְמַעַן ni maelezo ya msimulizi kuhusu nia ya Rubeni, si sehemu ya maneno aliyowaambia ndugu zake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Nahau muhimu za Kiebrania zimehifadhiwa pale zinapoeleweka kwa Kiswahili, na maelezo mafupi yametolewa pale yanapohitajika.
