  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: sw
  text: Hivi ndivyo vizazi vya Yakobo:[a] Yosefu alipokuwa na umri wa miaka kumi na saba, alikuwa akichunga mifugo pamoja na ndugu zake. Naye, akiwa kijana, alikuwa pamoja na wana wa Bilha na wana wa Zilpa, wake wa baba yake. Yosefu akamletea baba yao taarifa mbaya kuwahusu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hii ndiyo historia ya ukoo wa Yakobo.” Neno la Kiebrania toledot mara nyingi huanzisha sehemu mpya katika Mwanzo na linaweza kumaanisha yanayotokana na mtu, si wazao wake tu.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema “baba yao,” kikimtaja Yakobo kuwa baba wa Yosefu na wa ndugu hao kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: vizazi
  rationale: Neno hili ni kichwa cha kimuundo kinachotumiwa mara kwa mara katika Mwanzo na linaweza kumaanisha vizazi au historia inayotokana na mtu. “Vizazi” linadumisha istilahi hiyo huku tanbihi ikionyesha maana pana zaidi.
- source_word: הָיָה רֹעֶה
  choice: alikuwa akichunga
  rationale: Muundo wa Kiebrania unaonyesha shughuli iliyokuwa ikiendelea; Kiswahili hiki kinaonyesha hali hiyo kwa njia ya kawaida.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: mifugo pamoja na ndugu zake
  rationale: Muktadha unaonyesha Yosefu alikuwa akifanya kazi ya kuchunga akiwa pamoja na ndugu zake, si kwamba ndugu zake ndio aliowachunga. “Mifugo” halibani צֹאן kuwa kondoo pekee.
- source_word: נַעַר
  choice: kijana
  rationale: Yosefu ametajwa kuwa na miaka kumi na saba; “kijana” linafaa kwa umri huo na halimfanyi kuwa mtoto mdogo au mtumishi bila ushahidi wa kutosha.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: alikuwa pamoja na wana wa Bilha na wana wa Zilpa
  rationale: Sintaksia ya Kiebrania ni ngumu. “Pamoja na” linaonyesha uhusiano wake na ndugu hao bila kuamua kwamba alikuwa akiwahudumia.
- source_word: נְשֵׁי אָבִיו
  choice: wake wa baba yake
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi kinachowatambulisha Bilha na Zilpa.
- source_word: דִּבָּתָם רָעָה
  choice: taarifa mbaya kuwahusu
  rationale: Kishazi kinamaanisha habari au taarifa isiyofaa kuhusu wao; tafsiri hii haiongezi bila msingi kwamba taarifa hiyo ilikuwa ya uongo.
- source_word: אֶל אֲבִיהֶם
  choice: kwa baba yao
  rationale: Kiambishi cha Kiebrania ni cha wingi na kinamtaja Yakobo kuwa baba wa Yosefu na ndugu zake kwa pamoja.
theological_decisions:
- issue: Kama taarifa ya Yosefu ilikuwa ya kweli au ya kashfa
  choice: taarifa mbaya
  alternative: mashtaka ya uongo
  rationale: Kiebrania kinaeleza ubaya wa taarifa au habari bila kuamua wazi kama ilikuwa ya kweli au ya uongo; tafsiri haipaswi kumhukumu Yosefu zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi zimegawanywa ili kuepuka mzigo wa sintaksia bila kuficha uhusiano wa vifungu vya Kiebrania. Majina Bilha na Zilpa yameandikwa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili.
