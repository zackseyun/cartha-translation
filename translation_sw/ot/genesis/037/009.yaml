  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: sw
  text: 'Kisha akaota ndoto nyingine, akawasimulia ndugu zake ndoto hiyo, akisema, “Tazama, nimeota ndoto nyingine: jua, mwezi, na nyota kumi na moja zilikuwa zikiniinamia[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zilikuwa zikijisujudu mbele yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama kwa unyenyekevu sana; hapa kinaonyesha kutoa heshima, wala si ibada ya kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: Kisha akaota ndoto nyingine
  rationale: Muundo wa wayyiqtol unaendeleza simulizi, na ‘kisha’ unaonyesha mfuatano huo kwa Kiswahili cha kawaida. ‘Ndoto nyingine’ huwasilisha kurudiwa kwa ndoto bila uzito usio wa lazima.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: akawasimulia ndugu zake
  rationale: Kitenzi ‘kusimulia’ kinafaa kwa kueleza yaliyomo katika ndoto. Kiswahili huwaruhusu ndugu kuwa yambwa moja kwa moja bila kulazimisha ‘aliwasimulia hiyo’.
- source_word: הִנֵּה
  choice: Tazama
  rationale: ‘Tazama’ ni neno la heshima na linaloeleweka linalovuta fikira za msikilizaji kama הִנֵּה.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: nimeota ndoto nyingine
  rationale: Wakati timilifu ‘nimeota’ unafaa kwa ndoto iliyotokea karibuni ambayo sasa inasimuliwa; uradidi wa mzizi katika ‘kuota ndoto’ ni wa kawaida katika Kiswahili.
- source_word: וְהִנֵּה
  choice: ':'
  rationale: Alama ya nukta mbili inaleta picha ya ndoto kwa njia ya asili, huku nguvu ya kuvuta fikira ikiwa tayari imewasilishwa na ‘Tazama’.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: jua, mwezi, na nyota kumi na moja
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya vitu vya angani na idadi yake.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: zilikuwa zikiniinamia
  rationale: Muundo huu unaonyesha tendo linaloendelea ndani ya ndoto. ‘Kuniinamia’ huonyesha kuinama kwa heshima au kujisalimisha bila kulifanya tendo hilo kuwa ibada ya kimungu.
theological_decisions:
- issue: Maana ya מִשְׁתַּחֲוִים katika ndoto ya Yosefu
  choice: zilikuwa zikiniinamia
  alternative: zilikuwa zikiniabudu
  rationale: Muktadha wa karibu unahusu utiifu au heshima ya kifamilia, na utimilifu wa baadaye ni kuinama mbele ya Yosefu. ‘Kuniinamia’ huhifadhi maana hiyo bila kuingiza dai la ibada ya kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mtindo wa simulizi umehifadhiwa kwa mfululizo wa vitenzi vya ‘aka-’, na maneno ya kidini yasiyodaiwa na muktadha yameepukwa.
