  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: sw
  text: Akarudi kwa ndugu zake, akasema[a], “Kijana hayupo, nami—niende wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Kijana hayupo, nami—ninakuja wapi?” Nahau ya Kiebrania ina maana ya “niende wapi?” au “nifanye nini?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Akarudi
  rationale: Kitenzi שוב katika mfuatano wa simulizi kinaonyesha kurudi; “akarudi” ni cha kawaida na kinaendeleza mtiririko wa matukio.
- source_word: אֶל אֶחָיו
  choice: kwa ndugu zake
  rationale: אֶל huonyesha mwelekeo, na אֶחָיו ni ndugu zake wa kiume; katika muktadha huu “kwa ndugu zake” ni Kiswahili cha kawaida.
- source_word: הַיֶּלֶד
  choice: Kijana
  rationale: יֶלֶד inaweza kumaanisha mtoto au kijana. Kwa kuwa Yosefu alikuwa na umri wa miaka kumi na saba, “kijana” ni ya asili na inafaa katika muktadha bila kupunguza uzito wa hisia.
- source_word: אֵינֶנּוּ
  choice: hayupo
  rationale: Neno hili linaonyesha kutokuwapo. “Hayupo” huhifadhi maana hiyo bila kudai kwamba Yosefu alikuwa amekufa.
- source_word: וַאֲנִי
  choice: nami—
  rationale: Kiwakilishi cha nafsi kimesisitizwa na kinaonyesha ghafla hangaiko la binafsi la Reubeni; kistari kirefu kinahifadhi mkato huo wa kihisia.
- source_word: אָנָה אֲנִי בָא
  choice: niende wapi?
  rationale: Kwa muundo wa karibu sana ni swali la kuelekea mahali gani, likitumia kitenzi “kuja”; katika muktadha huu ni nahau ya dhiki inayomaanisha “niende wapi?” au “nifanye nini?”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi na kistari kirefu vinadumisha mshtuko na hangaiko la Reubeni; “hayupo” huepuka kudokeza kifo ambacho Kiebrania hakitaji wazi.
