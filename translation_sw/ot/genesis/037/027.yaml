  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: mwito wa wingi wa kuchukua hatua (“Njooni”), pendekezo la “tumuuze,” kundi la Waishmaeli, taswira ya kutoweka mkono juu yake, sababu ya undugu wa nyama moja, na hitimisho kwamba ndugu zake walisikiliza. “Wakamsikiliza” ni uwakilishi wa kiasi wa וַיִּשְׁמְעוּ katika muktadha huu, bila kulazimisha tafsiri ya ‘walikubaliana.’'
