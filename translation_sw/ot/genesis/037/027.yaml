base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: sw
  text: Njooni, tumuuze kwa Waishmaeli, wala mkono wetu usiwe juu yake,[a] kwa maana yeye ni ndugu yetu, nyama yetu wenyewe.[b] Ndugu zake wakamsikiliza.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkono wetu usiwe juu yake,” yaani, tusimdhuru sisi wenyewe.'
    reason: lexical_alternative
  - marker: b
    text: Au “jamaa yetu ya damu.”
    reason: lexical_alternative
  - marker: c
    text: “Wakamsikiliza” hapa pia inaweza kueleweka kuwa “wakakubaliana naye” au “wakatii shauri lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Njooni
  rationale: Amri ya wingi ya הלך inatumika hapa kama mwito wa kuchukua hatua; “Njooni” ni ya kawaida na yenye heshima katika mazungumzo ya kushauriana.
- source_word: וְנִמְכְּרֶנּוּ
  choice: tumuuze
  rationale: Umbo hili lina nguvu ya pendekezo au himizo la nafsi ya kwanza wingi; “tumuuze” linaonyesha kusudi hilo kwa uwazi.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: kwa Waishmaeli
  rationale: Ni jina la kundi la watu lenye kihusishi; Kiswahili cha kawaida hutumia “kwa” kuonyesha wanaopokea kitu kinachouzwa.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: wala mkono wetu usiwe juu yake
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania huku tanbihi ikieleza maana yake ya kutomdhuru moja kwa moja.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya pendekezo la Yuda.
- source_word: אָחִינוּ
  choice: ndugu yetu
  rationale: Neno hili linaonyesha wazi uhusiano wa kindugu, bila kuupanua au kuudhoofisha.
- source_word: בְשָׂרֵנוּ
  choice: nyama yetu wenyewe
  rationale: Huhifadhi sitiari halisi ya Kiebrania ya uhusiano wa damu; tanbihi inaeleza maana ya undugu wa karibu.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: Ndugu zake wakamsikiliza
  rationale: שמע inaweza kumaanisha kusikia, kusikiliza, au kukubali/kutii. “Wakamsikiliza” huhifadhi upana huo bila kuamua kupita kiasi kwamba walikubaliana kikamilifu.
