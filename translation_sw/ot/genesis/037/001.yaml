lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Yakobo akaishi
  rationale: Kitenzi ישׁב hapa kina maana pana ya kukaa au kuishi mahali. “Akaishi” ni Kiswahili cha kawaida na huendeleza simulizi bila kudokeza wazi kwamba makazi yalikuwa ya kudumu.
- source_word: בְּאֶרֶץ
  choice: katika nchi
  rationale: אֶרֶץ katika muktadha huu ni eneo la kijiografia; “nchi” huhifadhi maana hiyo vizuri.
- source_word: מְגוּרֵי אָבִיו
  choice: ambamo baba yake alikuwa ameishi kama mgeni
  rationale: מְגוּרִים hudokeza ukaaji wa mtu asiye mwenyeji au mkaaji wa kudumu. Muundo huu ni wa kawaida katika Kiswahili na huhifadhi wazo la baba yake kuishi huko kama mgeni.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Marudio ya “katika nchi” yamehifadhiwa kwa kuwa Kiebrania kinarudia בְּאֶרֶץ, na “Kanaani” hutaja eneo hilo waziwazi.
