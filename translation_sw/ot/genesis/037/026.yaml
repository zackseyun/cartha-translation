  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: sw
  text: Ndipo Yuda akawaambia ndugu zake, “Tutapata faida gani tukimuua ndugu yetu na kuificha damu yake[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuifunika damu yake.” Usemi wa Kiebrania unaweza kudokeza kuficha umwagaji damu au hatia ya mauaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akawaambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida; kitenzi chenye kiambishi cha watendewa wengi kinaonyesha kuwa alisema kwa ndugu zake.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אֶל אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu neno la Kiebrania la wingi wa kiume linawahusu ndugu wa kiume wa Yusufu, huku 'ndugu zake' likiwa la kawaida na sahihi katika Kiswahili.
- source_word: מַה בֶּצַע
  choice: Tutapata faida gani
  rationale: בֶּצַע humaanisha faida au pato, mara nyingi likiwa na wazo la kujinufaisha; swali hili la kawaida la Kiswahili linadumisha hesabu ya kimasilahi ya Yuda.
- source_word: כִּי נַהֲרֹג
  choice: tukimuua
  rationale: 'Hapa כִּי pamoja na kitenzi cha nafsi ya kwanza wingi huwasilisha hali inayodhaniwa katika swali: ''ikiwa tutamuua''; ''tukimuua'' ni muundo asilia wa Kiswahili.'
- source_word: אָחִינוּ
  choice: ndugu yetu
  rationale: Tafsiri ya moja kwa moja inayohifadhi uzito wa uhusiano wa kifamilia katika hoja ya Yuda.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: na kuificha damu yake
  rationale: Tafsiri hii inahifadhi taswira halisi ya 'damu yake' na wakati huohuo inatumia kitenzi cha Kiswahili kinachoeleweka kama kuficha umwagaji damu au hatia.
theological_decisions:
- issue: Maana ya msemo 'kuificha damu yake'
  choice: Taswira ya damu imehifadhiwa katika matini, huku tanbihi ikieleza maana yake ya kimethali.
  alternative: na kuficha mauaji yake / na kuficha hatia yetu
  rationale: Kiebrania kinaweza kumaanisha kuficha umwagaji damu au wajibu wa mauaji. Kutaja moja ya maana hizo pekee katika matini kungeondoa kwa kimya upana na taswira ya usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali umewekwa wa kawaida kwa wasomaji wengi, lakini taswira ya Kiebrania ya 'damu yake' imehifadhiwa na kufafanuliwa kwa tanbihi.
