  yaml_path: translation/ot/genesis/037/006.yaml
  text: And he said to them[a], “Please listen to this dream that I dreamed.”
translation:
  language: sw
  text: Akawaambia, “Tafadhali, sikilizeni ndoto hii niliyoota[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia nomino na kitenzi vyenye mzizi mmoja: “ndoto hii niliyoota.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Akawaambia
  rationale: Kitenzi hiki cha Kiswahili kinaendeleza simulizi na kujumuisha kwa kawaida maana ya ‘alisema kwao,’ huku kikionyesha kwamba Yusufu anawaelekezea ndugu zake maneno.
- source_word: שִׁמְעוּ נָא
  choice: Tafadhali, sikilizeni
  rationale: ‘Sikilizeni’ ni amri ya wingi inayodai usikivu, na ‘tafadhali’ huwakilisha נָא, ambayo hapa inalainisha amri au kuifanya kuwa ombi la kusisitiza.
- source_word: הַחֲלוֹם הַזֶּה
  choice: ndoto hii
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unawakilisha nomino yenye kibainishi pamoja na kiashiria cha karibu.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: niliyoota
  rationale: Kishazi hiki cha uhusiano kinamrejelea msemaji na kuhifadhi uhusiano wa kimzizi kati ya nomino ‘ndoto’ na kitenzi ‘oota’ bila kufanya sentensi kuwa nzito.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. ‘Akawaambia’ linaendeleza mtiririko wa kisimulizi kwa ufasaha, na ‘ndoto hii niliyoota’ linahifadhi urudiaji wa asili unaoweza kusikika kawaida katika Kiswahili.
