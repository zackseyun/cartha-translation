base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: sw
  text: Lakini Reubeni aliposikia hayo, alimwokoa mikononi mwao, akasema, “Tusimuue.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia hayo
  rationale: Kitenzi שׁמע kwa msingi ni ‘kusikia.’ ‘Hayo’ linaelekeza kwa mpango au maneno ya ndugu katika mstari uliotangulia, na muundo wa ‘aliposikia’ unaonyesha mfuatano wa wakati kwa Kiswahili cha kawaida.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: וַיַּצִּלֵהוּ
  choice: alimwokoa
  rationale: נצל katika Hifili humaanisha kuokoa au kukomboa kutoka hatarini; ‘alimwokoa’ ni wazi na ya kawaida katika muktadha huu.
- source_word: מִיָּדָם
  choice: mikononi mwao
  rationale: Kauli hii inahifadhi taswira ya Kiebrania ya kuwa chini ya nguvu au udhibiti wao, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: ‘Akasema’ ni njia ya kawaida ya kuendeleza masimulizi na kutambulisha usemi wa moja kwa moja.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: Tusimuue
  rationale: Kwa maana halisi, kauli hii inahusu kutompiga kwa kuondoa uhai; katika muktadha ni nahau ya kumpiga hadi kufa. ‘Tusimuue’ hutoa maana hiyo kwa Kiswahili cha asili bila kuongeza wazo lisilokuwamo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Taswira ya ‘mikononi mwao’ imehifadhiwa, huku nahau ya mwisho ikitafsiriwa kwa maana yake ya kawaida.
