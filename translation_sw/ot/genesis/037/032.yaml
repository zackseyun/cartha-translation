  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: sw
  text: Kisha wakatuma lile joho lenye mikono mirefu[a] na kulipeleka kwa baba yao. Wakasema, “Hili tumelipata. Tafadhali, tambua kama ni joho la mwanao au la.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joho la mapambo,” “joho lililopambwa sana”; kijadi, “joho la rangi nyingi.” Maana ya usemi wa Kiebrania si hakika.
    reason: lexical_alternative
  - marker: b
    text: Neno “tambua” ni muhimu katika simulizi pana, ambamo kutambua na kutotambua hujitokeza tena na tena.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Kisha wakatuma
  rationale: Kitenzi שׁלח hapa kina maana ya ‘kutuma’; ‘kisha’ kinaendeleza mfuatano wa masimulizi unaoonyeshwa na waw.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: lile joho lenye mikono mirefu
  rationale: כְּתֹנֶת ni vazi kama kanzu au joho, huku maana ya פַּסִּים ikiwa na utata. Huenda inaonyesha vazi lililofika kwenye viganja au nyayo, hivyo joho refu au lenye mikono mirefu, si lazima la rangi nyingi. Tanbihi inadumisha utata huo.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: na kulipeleka kwa baba yao
  rationale: Kiswahili hutumia ‘kulipeleka’ kwa kawaida kwa kitu kinachopelekwa kwa mtu; kiambishi -li- kinarejelea joho. ‘Baba yao’ huhifadhi maneno ya Kiebrania bila kuongeza jina Yakobo.
- source_word: זֹאת מָצָאנוּ
  choice: Tumelipata hili
  rationale: Huhifadhi kauli fupi na ya kijanja ya ndugu. Wakati timilifu wa Kiswahili unaeleza kupata kulikotokea na matokeo yake ya sasa.
- source_word: הַכֶּר נָא
  choice: Tafadhali tambua
  rationale: נכר katika hifili humaanisha kutambua au kubaini utambulisho. ‘Tambua’ ni ya asili na pia huhifadhi mwangwi wa mada ya kutambua na kutotambua katika simulizi.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: kama ni joho la mwanao au la
  rationale: ‘Kama ... au la’ huwasilisha swali lisilo la moja kwa moja la Kiebrania. ‘Mwanao’ huhifadhi namna ndugu wanavyojitenga na Yosefu kwa kusema ‘mwana wako.’
