review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys Jacob's rebuke, the rhetorical question, the emphatic prospect of the family coming, and non-cultic obeisance. However, the initial verb construction is less clear than it should be about the dream being recounted, and "kukuinamia mpaka chini" is not the most idiomatic or exact way to express bowing down before someone to the ground.
  naturalness: The register is generally modern Standard East African Swahili. "Akawaeleza baba yake na ndugu zake ndoto hiyo" makes the opening fully clear and natural. "kuinama mbele yako hadi nchi" is more natural and represents both the personal orientation (before you) and the directional "to the ground."
  terminology: '"Kumkemea" appropriately renders גער. "Ndugu zake" is acceptable, with the narrative context specifying Joseph''s brothers. "Kuinama mbele yako hadi nchi" preserves the social obeisance sense of השתחוה without introducing worship terminology. The footnote''s alternative should use the natural reflexive form "kujinyenyekeza" rather than the less fitting "kujisujudu" as a lexical alternative.'
  issues:
  - severity: medium
    issue: The opening "Akamsimulia baba yake na ndugu zake" leaves the recounted object unexpressed and is syntactically less transparent with two coordinated recipients.
    rationale: The Hebrew's object is contextually the dream. Making it explicit as "ndoto hiyo" preserves the meaning and gives a clear, natural Swahili construction.
  - severity: medium
    issue: '"kukuinamia mpaka chini" does not explicitly express "before you" and is less idiomatic for the Hebrew phrase combining obeisance with movement toward the ground.'
    rationale: '"kuinama mbele yako hadi nchi" retains the relational orientation of לְךָ and the directional force of אָרְצָה while avoiding an unwarranted worship sense.'
  - severity: low
    issue: The footnote alternative "kujisujudu mbele yako" is awkwardly formed and can carry a stronger devotional association than needed.
    rationale: '"kujinyenyekeza mbele yako" is idiomatic and conveys deep obeisance without making a cultic claim.'
  revised_text: Akawaeleza baba yake na ndugu zake ndoto hiyo. Baba yake akamkemea, akamwambia, “Ni ndoto gani hii uliyoota? Je, kweli mimi, mama yako, na ndugu zako tutakuja kuinama mbele yako hadi nchi[a]?”
  revised_footnotes:
