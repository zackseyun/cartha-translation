revisions:
- from: Akamsimulia baba yake na ndugu zake. Baba yake akamkemea, akamwambia, “Ni ndoto gani hii uliyoota? Je, kweli mimi, mama yako, na ndugu zako tutakuja kukuinamia mpaka chini[a]?”
  to: Akawaeleza baba yake na ndugu zake ndoto hiyo. Baba yake akamkemea, akamwambia, “Ni ndoto gani hii uliyoota? Je, kweli mimi, mama yako, na ndugu zako tutakuja kuinama mbele yako hadi nchi[a]?”
  rationale: 'The revision explicitly identifies the dream as the thing Joseph recounted, improving clarity without adding information beyond the immediate context. It also renders the final Hebrew expression more precisely and idiomatically: the family would bow before Joseph, with their bowing directed down to the ground. The footnote retains the relevant lexical alternative and the non-worship contextual clarification.'
  reviewer_model: gpt-5.6-terra
