base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: sw
  text: Akawaeleza baba yake na ndugu zake ndoto hiyo. Baba yake akamkemea, akamwambia, “Ni ndoto gani hii uliyoota? Je, kweli mimi, mama yako, na ndugu zako tutakuja kuinama mbele yako hadi nchi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kujinyenyekeza mbele yako.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama sana kwa heshima; hapa kinarejelea unyenyekevu mbele ya mtu, si lazima kuabudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Akamsimulia
  rationale: Kitenzi ספר katika piel humaanisha kusimulia au kueleza. ‘Akamsimulia’ ni Kiswahili cha kawaida na huacha kitu kinachosimuliwa—ndoto—kieleweke kutokana na muktadha.
- source_word: אָבִיו ... אֶחָיו
  choice: baba yake ... ndugu zake
  rationale: Haya ni maneno ya moja kwa moja ya uhusiano wa kifamilia. ‘Ndugu zake’ ni ya kawaida katika Kiswahili; muktadha unaonyesha kuwa hapa ni ndugu wa kiume.
- source_word: וַיִּגְעַר בּוֹ
  choice: akamkemea
  rationale: גער huonyesha karipio kali la maneno. ‘Kumkemea’ huhifadhi uzito huo vizuri kuliko ‘kumkaripia’ au ‘kumfokea.’
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: Ni ndoto gani hii uliyoota?
  rationale: Muundo huu ni wa kawaida na wenye nguvu katika Kiswahili, huku ukihifadhi urudiaji wa mzizi wa Kiebrania kwa ‘ndoto’ na ‘uliyoota.’
- source_word: הֲבוֹא נָבוֹא
  choice: Je, kweli ... tutakuja
  rationale: Muundo wa infinitive absolute pamoja na kitenzi chenye ukomo unasisitiza tendo. ‘Kweli ... tutakuja’ huwasilisha msisitizo huo kwa Kiswahili cha asili.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: mimi, mama yako, na ndugu zako
  rationale: Orodha ya wahusika imehifadhiwa kwa mpangilio wa chanzo, kwa uakifishaji wa kawaida wa Kiswahili.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ
  choice: kukuinamia
  rationale: Katika muktadha huu השתחוה ni tendo la kunyenyekea mbele ya mtu, si lazima ibada. ‘Kukuinamia’ ni fupi, ya asili, na huhifadhi maana ya utiifu.
- source_word: אָרְצָה
  choice: mpaka chini
  rationale: Umbo lenye mwelekeo la neno ‘ardhi’ linaonyesha kuinama kuelekea ardhini. ‘Mpaka chini’ huonyesha kina cha kuinama kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya השתחוה katika muktadha usio wa ibada
  choice: kukuinamia mpaka chini
  alternative: kukuabudu; kujitupa chini mbele yako
  rationale: Kitenzi kinaweza kumaanisha kuabudu kinapotumiwa katika muktadha wa Mungu, lakini hapa kinahusu unyenyekevu wa kifamilia katika ndoto ya Yosefu. Tafsiri hii haiongezi dai la ibada ambalo muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, huku msisitizo wa swali la baba na tofauti kati ya kuinama kwa utiifu na kuabudu vikihifadhiwa.
