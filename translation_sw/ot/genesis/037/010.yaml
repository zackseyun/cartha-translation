    text: Au “kujinyenyekeza mbele yako.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama sana kwa heshima; hapa kinarejelea unyenyekevu mbele ya mtu, si lazima kuabudu.
    reason: lexical_alternative
  revision_rationale: 'The revision explicitly identifies the dream as the thing Joseph recounted, improving clarity without adding information beyond the immediate context. It also renders the final Hebrew expression more precisely and idiomatically: the family would bow before Joseph, with their bowing directed down to the ground. The footnote retains the relevant lexical alternative and the non-worship contextual clarification.'
