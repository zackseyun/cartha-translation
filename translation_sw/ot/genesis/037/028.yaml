base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: sw
  text: Kisha Wamidiani, wafanyabiashara, wakapita. Wakamvuta na kumwinua Yosefu kutoka shimoni[a], wakamuuza Yosefu kwa Waishmaeli kwa vipande ishirini vya fedha[b]. Halafu wakampeleka Yosefu Misri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “wakamvuta Yosefu juu na kumtoa shimoni.”'
    reason: Vitenzi viwili vya Kiebrania vinaweza kuwasilishwa kwa mpangilio huu wa asili zaidi katika Kiswahili.
  - marker: b
    text: 'Kiebrania: “kwa ishirini fedha.” Kipimo hakijatajwa wazi; kwa hiyo, tafsiri imetumia “vipande vya fedha.”'
    reason: Kuepuka kuingiza kipimo kama ‘shekeli’ ambacho hakijaandikwa wazi katika mstari huu.
  - marker: c
    text: Kiebrania hutumia vitenzi vya wingi—“wakamvuta,” “wakaminua,” “wakamuuza,” na “wakampeleka.” Baada ya kutajwa kwa Wamidiani wafanyabiashara, Waishmaeli pia hutajwa katika uuzaji; hivyo kuna utata fulani kuhusu kundi linalorejelewa katika baadhi ya matendo.
    reason: Kuhifadhi utata wa wahusika uliomo katika muundo wa matini ya Kiebrania.
lexical_decisions:
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: watu Wamidiani, waliokuwa wafanyabiashara
  rationale: Inahifadhi nomino ‘watu,’ utambulisho wao kama Wamidiani, na kazi yao ya biashara, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: וַיַּעַבְרוּ
  choice: wakapita
  rationale: Kitenzi kinaonyesha mwendo wa kupita mahali hapo; ‘wakapita’ ni cha asili na hakiongezi wazo la kuwasili lisilo wazi katika chanzo.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: wakamvuta Yosefu na kumpandisha
  rationale: 'Tafsiri inahifadhi vitenzi viwili vya Kiebrania: kumvuta na kumsogeza juu kutoka shimoni.'
- source_word: מִן הַבּוֹר
  choice: kutoka shimoni
  rationale: בּוֹר inaweza kuwa shimo au kisima cha kuhifadhia maji; ‘shimo’ linafaa katika muktadha huu bila kulazimisha maana finyu zaidi.
- source_word: וַיִּמְכְּרוּ
  choice: wakamuuza
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi, bila kuongeza maelezo yasiyomo katika matini.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: kwa Waishmaeli
  rationale: Inadumisha kundi lililotajwa wazi kama wapokeaji katika uuzaji.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: kwa vipande ishirini vya fedha
  rationale: Kiebrania kinasema kihalisi ‘kwa ishirini fedha’ bila kutaja kipimo; ‘vipande’ huwezesha Kiswahili cha kawaida bila kuingiza ‘shekeli’ katika matini.
- source_word: וַיָּבִיאוּ ... מִצְרָיְמָה
  choice: wakampeleka Yosefu Misri
  rationale: Katika muktadha wa kusafirisha mtu kuelekea nchi nyingine, ‘kumpeleka ... Misri’ ni Kiswahili cha asili na kinaonyesha mwelekeo uliomo katika umbo la Kiebrania.
theological_decisions:
- issue: Wahusika wanaorejelewa na vitenzi vya wingi baada ya kutajwa kwa Wamidiani na Waishmaeli
  choice: Kutumia kiambishi cha wingi ‘wa-’ bila kutaja tena kundi linalotenda kila tendo
  alternative: Kufafanua kwamba Wamidiani walifanya matendo yote, au kwamba Waishmaeli ndio waliompeleka Yosefu Misri
  rationale: Kiebrania kinatumia vitenzi vya wingi baada ya kutaja makundi yote mawili, hivyo hakiondoi kabisa utata wa kundi linalorejelewa katika kila tendo. Tafsiri haipaswi kuingiza upatanisho usioelezwa wazi na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ‘Wamidiani’ na ‘Waishmaeli’ yanafuata maumbo ya kawaida ya majina ya makundi ya watu; sentensi zimeunganishwa kwa mtiririko wa simulizi bila kuondoa marudio muhimu ya chanzo.
