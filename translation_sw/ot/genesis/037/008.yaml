  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: sw
  text: Ndugu zake wakamwambia, “Je, kweli utakuwa mfalme juu yetu? Je, kweli utatutawala?” Basi wakazidi kumchukia kwa sababu ya ndoto zake na maneno yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: Je, kweli utakuwa mfalme
  rationale: Muundo wa kitenzi kisoukomo pamoja na kitenzi chenye nafsi unasisitiza swali; “kweli” huwasilisha msisitizo huo kwa Kiswahili cha kawaida, huku “kuwa mfalme” kikihifadhi maana ya msingi ya מלך.
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: Je, kweli utatutawala
  rationale: Marudio ya mzizi yanaonyesha msisitizo; “kweli” huuhifadhi, na “kutawala” hutofautisha usemi huu kwa kiasi na “kuwa mfalme” wa kishazi kilichotangulia.
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא
  choice: wakazidi kumchukia
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kuongezeka zaidi kwa chuki.
- source_word: דְּבָרָיו
  choice: maneno yake
  rationale: Tafsiri ya moja kwa moja inayohifadhi uwezekano wa kurejelea maneno aliyosema kuhusu ndoto zake bila kuyafafanua zaidi.
theological_decisions:
- issue: Ikiwa maswali ya ndugu yanatabiri utawala wa Yosefu au yanaukataa kwa dhihaka
  choice: Yameachwa kama maswali yenye msisitizo
  alternative: Kuyatafsiri wazi kuwa kauli za dhihaka au kukataa kabisa
  rationale: Kiebrania kina maswali ya balagha yenye msisitizo, lakini hakielezi moja kwa moja kiwango cha dhihaka; tafsiri haiamui zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Juu yetu” limehifadhiwa katika kishazi cha kwanza ili kuonyesha wazo la mamlaka, na kishazi cha pili kimetolewa kwa namna ya kawaida zaidi kama “utatutawala.”
