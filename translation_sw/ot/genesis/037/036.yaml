  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: sw
  text: Nao Wamedani[a] wakamuuza, wakimpeleka Misri, kwa Potifa, afisa[b] wa Farao, mkuu wa walinzi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Wamedani.” Kwa kuzingatia simulizi linalozunguka kifungu hiki na tafsiri za kale, wengine huelewa kuwa ni “Wamidiani.”'
    reason: alternative_reading
  - marker: b
    text: Au “towashi wa Farao” au “afisa wa ikulu ya Farao.” Neno la Kiebrania linaweza kumaanisha towashi kihalisi au afisa wa kifalme.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mkuu wa wachinjaji.” Katika mazingira ya kifalme, huenda cheo hiki kilimaanisha mkuu wa walinzi, walinzi wa mfalme, au watekelezaji wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: Nao Wamedani
  rationale: Kiunganishi וְ kimetafsiriwa kwa mtiririko wa simulizi kuwa “Nao.” Usomaji wa kimapokeo wa WLC ni “Wamedani”; muktadha na tafsiri za kale zinaunga mkono uwezekano wa “Wamidiani,” ambao umehifadhiwa katika tanbihi.
- source_word: מָכְרוּ אֹתוֹ
  choice: wakamuuza
  rationale: Kitenzi cha Qal timilifu katika simulizi kimetafsiriwa kwa wakati uliopita, na kiambishi cha yambwa kinamrejelea Yosefu.
- source_word: אֶל מִצְרָיִם
  choice: huko Misri
  rationale: אֶל kwa kawaida huonyesha mwelekeo kuelekea Misri. Katika Kiswahili cha kawaida, kwa kuwa mnunuzi anatajwa mara moja, “huko Misri” huwasilisha kwa ufasaha kwamba mauzo yalikamilishwa Misri bila kuunda usemi usio wa kawaida.
- source_word: לְפוֹטִיפַר
  choice: kwa Potifa
  rationale: לְ humtambulisha Potifa kuwa mnunuzi; “kwa Potifa” ni muundo wa kawaida wa Kiswahili katika usemi wa kumuuza mtu kwa mtu mwingine.
- source_word: סְרִיס פַּרְעֹה
  choice: ofisa wa Farao
  rationale: סָרִיס inaweza kumaanisha towashi kihalisi au ofisa wa kifalme. “Ofisa” ni wazi na haifungi maana katika uwezekano mmoja; maana nyingine imewekwa tanbihini.
- source_word: שַׂר הַטַּבָּחִים
  choice: mkuu wa walinzi
  rationale: Katika mazingira ya jumba la kifalme, usemi huu unaashiria cheo cha mkuu wa kikosi cha ulinzi au watekelezaji wa hukumu. “Mkuu wa walinzi” ni Kiswahili cha kawaida na chenye hadhi, huku maana ya karibu zaidi ya maneno ikihifadhiwa katika tanbihi.
