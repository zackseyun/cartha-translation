translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa fupi kwa mtindo wa simulizi. “Nao” huendeleza simulizi, na “huko Misri” huepuka muundo usio wa kawaida huku ikidokeza mwisho wa safari iliyoelekezwa Misri. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
