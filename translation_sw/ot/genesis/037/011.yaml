  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: sw
  text: Basi ndugu zake wakamwonea wivu, lakini baba yake akaliweka jambo hilo moyoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baba yake akauhifadhi usemi huo,” yaani, aliendelea kukumbuka na kuufikiria ujumbe wa Yosefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: wakamwonea wivu
  rationale: Kitenzi קנא hapa kinaonyesha wivu uliochochewa na ndoto za Yosefu na nafasi yake; usemi huu ni wa kawaida katika Kiswahili na unadumisha maana ya Kiebrania.
- source_word: בּוֹ
  choice: -mw-
  rationale: Kiambishi cha yambwa katika 'wakamwonea' kinamtaja Yosefu kama mlengwa wa wivu, sawasawa na בּוֹ baada ya קנא.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu neno la Kiebrania la wingi wa kiume linawataja wana wa Yakobo wenzake Yosefu; 'ndugu zake' ni usemi wa kawaida wa Kiswahili kwa ndugu wa kiume katika simulizi hili.
- source_word: וְאָבִיו
  choice: lakini baba yake
  rationale: 'Ingawa וְ kwa kawaida ni ''na,'' hapa linaunganisha miitikio inayotofautiana: wivu wa ndugu na kutafakari kwa baba. ''Lakini'' huonyesha utofauti huo kwa Kiswahili cha asili.'
- source_word: שָׁמַר
  choice: akaliweka ... moyoni
  rationale: שׁמר humaanisha kuweka au kutunza; katika muktadha huu ni kuendelea kukumbuka na kulitafakari jambo. Nahau 'kuweka moyoni' hutoa maana hiyo kwa Kiswahili cha kawaida bila kulifanya kuwa uamuzi wa mwisho.
- source_word: אֶת־הַדָּבָר
  choice: jambo hilo
  rationale: דָּבָר inaweza kumaanisha neno, usemi, au jambo. 'Jambo hilo' linabaki pana vya kutosha kurejelea habari ya ndoto na umuhimu wake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kuweka jambo moyoni' ni nahau inayoeleweka kwa urahisi na inawakilisha maana ya kutunza jambo akilini na kuendelea kulitafakari.
