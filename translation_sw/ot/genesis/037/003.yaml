  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: sw
  text: Israeli alimpenda Yosefu kuliko wanawe wengine wote, kwa sababu alikuwa mwana wa uzee wake; naye akamtengenezea kanzu iliyopambwa sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama ilivyotafsiriwa kimapokeo, “kanzu ya rangi nyingi.” Maana ya usemi wa Kiebrania si hakika; huenda unamaanisha kanzu iliyopambwa sana au kanzu iliyofika kwenye vifundo vya mikono na miguu, wala si lazima iwe ya rangi nyingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la Israeli limehifadhiwa kama lilivyo katika maandishi ya Kiebrania, badala ya kulibadilisha kuwa Yakobo. Kiunganishi וְ hakihitaji kutafsiriwa kwa neno la mwanzo katika Kiswahili.
- source_word: אָהַב
  choice: alimpenda
  rationale: Kitenzi hiki humaanisha kupenda. Ingawa muktadha unaonyesha upendeleo, tafsiri inadumisha maana ya moja kwa moja ya kitenzi.
- source_word: מִכָּל בָּנָיו
  choice: kuliko wanawe wengine wote
  rationale: Hii huwasilisha ulinganisho wa Kiebrania kwa Kiswahili cha kawaida na kubainisha kwamba Yosefu analinganishwa na wana wengine wa Israeli.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatanguliza sababu ya Israeli kumpenda Yosefu kwa namna ya pekee.
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: alikuwa mwana wa uzee wake
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania na uhusiano wake na uzee wa Israeli bila kuongeza maelezo yasiyotajwa wazi.
- source_word: וְעָשָׂה לוֹ
  choice: naye akamtengenezea
  rationale: Umbo hili linaonyesha kwamba Israeli alitengeneza vazi kwa ajili ya Yosefu; 'akamtengenezea' ni usemi wa asili wa Kiswahili unaobeba maana hiyo.
- source_word: כְּתֹנֶת
  choice: kanzu
  rationale: כְּתֹנֶת ni vazi refu au vazi linalovaliwa mwilini. 'Kanzu' ni neno linaloeleweka na linafaa katika mazingira haya kuliko 'koti' la kisasa.
- source_word: פַּסִּים
  choice: iliyopambwa sana
  rationale: Maana kamili ya neno hili si hakika. Chaguo hili linatoa picha ya vazi maalumu bila kudai kwa uhakika kwamba lilikuwa la rangi nyingi au kwamba lilifika kwenye vifundo vya mikono na miguu.
