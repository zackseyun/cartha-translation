  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: Israeli ndiye mtenda, Yosefu ndiye anayependwa kuliko wana wengine, sababu inaelezwa kwa nahau ya “mwana wa uzee wake,” na Israeli anatengeneza vazi kwa ajili yake. “Iliyopambwa sana” ni uchaguzi wa tahadhari unaokubaliana na kutokuwa hakika kwa פַּסִּים na mkondo wa ukaguzi wa Kiingereza.'
