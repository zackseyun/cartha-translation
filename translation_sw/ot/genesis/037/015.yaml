  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: sw
  text: Mwanamume mmoja akamkuta, na tazama, alikuwa akitanga-tanga shambani. Mwanamume huyo akamuuliza, “Unatafuta nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: akamkuta
  rationale: Kitenzi מצא katika Qal kina maana ya ‘kupata/kukuta.’ ‘Akamkuta’ ni cha kawaida katika masimulizi ya Kiswahili na kinaonyesha kwamba mtu huyo alimwona Yosefu akiwa pale.
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: איש hapa ni mwanamume mmoja asiyepewa jina. ‘Mtu mmoja’ ni usemi wa kawaida wa Kiswahili unaodumisha umoja na kutokujulikana kwake bila kulazimisha neno ‘mwanamume’ mahali ambapo si lazima.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: הנה huvuta fikira kwenye hali inayogunduliwa katika simulizi. ‘Na tazama’ inadumisha msisitizo huo wa uwasilishaji, ingawa ina ladha ya lugha rasmi ya simulizi la Biblia.
- source_word: תֹעֶה
  choice: alikuwa akizunguka-zunguka
  rationale: Kishirikishi cha תעה kinaonyesha kwenda huku na huku au kupotoka njia. ‘Akizunguka-zunguka’ kinadumisha wazo la kutanga bila kuamua wazi kwamba Yosefu alikuwa amepotea kabisa.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: שדה humaanisha shamba au eneo la wazi. ‘Shambani’ ni tafsiri fupi na ya kawaida inayofaa muktadha huu.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: akamuuliza
  rationale: שאל ni ‘kuuliza.’ ‘Akamuuliza’ ni ya moja kwa moja na ya asili katika Kiswahili cha masimulizi.
- source_word: לֵאמֹר
  choice: —
  rationale: Muundo huu wa Kiebrania hutambulisha maneno ya moja kwa moja. Katika Kiswahili kazi yake inatekelezwa kwa ‘akamuuliza’ ikifuatiwa na maneno ndani ya alama za kunukuu; kuongeza ‘akisema’ kungekuwa kizito bila kuongeza maana.
- source_word: מַה תְּבַקֵּשׁ
  choice: Unatafuta nini?
  rationale: בקש humaanisha kutafuta. Swali ‘Unatafuta nini?’ ni la kawaida, la sasa, na linawasilisha maana ya Kiebrania moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida. ‘Na tazama’ kimetumiwa kudumisha nguvu ya הנה, huku ‘akizunguka-zunguka’ kikihifadhi uwezekano wa kutanga au kupotoka bila kuamua kwamba Yosefu alikuwa amepotea kabisa.
