  text: וְ֠/הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּ/ת֣וֹךְ הַ/שָּׂדֶ֔ה וְ/הִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖/י וְ/גַם נִצָּ֑בָה וְ/הִנֵּ֤ה תְסֻבֶּ֨ינָה֙ אֲלֻמֹּ֣תֵי/כֶ֔ם וַ/תִּֽשְׁתַּחֲוֶ֖יןָ לַ/אֲלֻמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: sw
  text: Tazama, tulikuwa tukifunga miganda katikati ya shamba; na tazama, mganda wangu ukainuka na pia ukasimama wima; na tazama, miganda yenu ikauzunguka[a] mganda wangu na kuuinamia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikakusanyika kuuzunguka”; kitenzi cha Kiebrania kinaweza kueleza kugeuka au kwenda kuzunguka.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuusujudia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Kirai hiki kimerudiwa mara tatu katika usimulizi wa ndoto. “Na tazama” kinadumisha urudiaji, msisitizo, na uhai wa simulizi kwa Kiswahili chenye hadhi.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: tukifunga miganda
  rationale: Kitenzi na nomino yenye mzizi mmoja hueleza kazi ya kufunga nafaka kuwa miganda; tafsiri hii inadumisha picha ya kilimo kwa lugha ya kawaida.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: katikati ya shamba
  rationale: “Katikati ya” kinahifadhi maana ya mahali ya בְּתוֹךְ badala ya kuifanya kuwa “shambani” tu.
- source_word: קָמָה
  choice: ukainuka
  rationale: Kitenzi kinaonyesha mwendo wa mganda kutoka chini kwenda juu, kabla ya hali ya kusimama iliyo katika kitenzi kinachofuata.
- source_word: וְגַם נִצָּבָה
  choice: na pia ukasimama wima
  rationale: “Pia” linawakilisha וְגַם, na “kusimama wima” linaonyesha kwamba mganda uliendelea kuwa umesimama baada ya kuinuka.
- source_word: תְסֻבֶּינָה
  choice: ikauzunguka
  rationale: Kitenzi kina wazo la kugeuka au kwenda kuzunguka. “Ikauzunguka” kinahifadhi mwendo wa kuzunguka bila kuongeza kwamba miganda ilikusanyika.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: kuuinamia
  rationale: Kitenzi humaanisha kuinama chini mbele ya mwingine. “Kuuinamia” ni cha kawaida na hakiongezi kwa lazima wazo maalumu la ibada.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: mganda wangu / miganda yenu
  rationale: Maneno haya yanadumisha kwa uthabiti picha ya miganda na tofauti kati ya mganda mmoja wa Yosefu na miganda mingi ya ndugu zake.
theological_decisions:
- issue: Iwapo kuinama kwa miganda kunapaswa kutafsiriwa wazi kuwa ibada au utiifu wa kisiasa
  choice: kuuinamia
  alternative: kuusujudia
  rationale: Maana ya msingi katika picha ya ndoto ni kuinama chini mbele ya mganda mwingine. Tafsiri haipaswi kuamua mapema ikiwa tendo hilo ni ibada, heshima, au utiifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa “na tazama” umehifadhiwa ili kuonyesha mtiririko na msisitizo wa simulizi la ndoto; alama za nuktamkato zinatenganisha sehemu zake tatu bila kuondoa muundo huo.
