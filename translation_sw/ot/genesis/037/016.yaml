  text: Akasema, “Ninawatafuta ndugu zangu. Tafadhali niambie wanachunga wapi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Ka- ya masimulizi huwasilisha mfuatano wa tendo kwa Kiswahili cha kawaida na kulingana na wayyiqtol ya אמר.
- source_word: אֶת אַחַי
  choice: ndugu zangu
  rationale: אֶת ni kiashiria cha shamirisho mahsusi, na אַחַי humaanisha ndugu zangu; katika muktadha hawa ni ndugu zake wa kiume.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: Ninawatafuta
  rationale: Kiwakilishi huru pamoja na kitenzi shiriki huonyesha tendo linaloendelea; umbo la wakati uliopo linaeleza kwa kawaida kwamba anawatafuta wakati huo.
- source_word: הַגִּידָה נָּא לִי
  choice: Tafadhali niambie
  rationale: Amri ya Hiphil pamoja na נָא ni ombi la heshima; tafadhali hudumisha adabu hiyo.
- source_word: אֵיפֹה
  choice: wapi
  rationale: Kielezi hiki cha kuuliza huulizia mahali; wapi ni sawa la kawaida katika muundo huu.
- source_word: הֵם רֹעִים
  choice: wanachungia
  rationale: Kitenzi shiriki רֹעִים katika muktadha wa mifugo humaanisha kutunza au kulisha mifugo malishoni. Wanachungia ni usemi wa kawaida unaoweza kutumiwa bila kuongeza shamirisho lisilotajwa wazi katika Kiebrania.
