base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: sw
  text: Walimwona kwa mbali, na kabla hajawakaribia, wakapanga njama[a] dhidi yake ili wamuue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakafanya hila dhidi yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kupanga njama au kutenda kwa hila; hapa muktadha unaonyesha wazi kwamba walipanga kumuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ
  choice: Walimwona
  rationale: Kitenzi cha masimulizi ראה pamoja na kiwakilishi cha yambwa kinamaanisha kwamba walimwona Yosefu; wakati uliopita wa Kiswahili unafaa kwa mtiririko wa simulizi.
- source_word: מֵרָחֹק
  choice: kwa mbali
  rationale: Hii ni njia ya kawaida na ya asili katika Kiswahili ya kueleza kwamba mtu alionekana akiwa bado mbali.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: na kabla hajawakaribia
  rationale: בְּטֶרֶם huanzisha kishazi cha wakati chenye maana ya ‘kabla’; ‘hajawakaribia’ huhifadhi wazo la kufika karibu nao kwa Kiswahili cha kawaida.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: wakapanga njama dhidi yake
  rationale: Hitpaeli ya נכל hapa inaonyesha kupanga kwa hila kwa nia mbaya. ‘Wakapanga njama dhidi yake’ ni ya asili na inaendana wazi na kusudi la kumuua linalofuata.
- source_word: לַהֲמִיתוֹ
  choice: ili wamuue
  rationale: Infinitivu ya Hifili ya מות pamoja na kiambishi cha nafsi inaonyesha kusudi la njama yao; ‘ili wamuue’ hulieleza wazi na kwa ufupi.
