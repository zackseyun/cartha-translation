  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: sw
  text: Ndipo Israeli akamwambia Yosefu, “Je, ndugu zako hawachungi mifugo wako Shekemu?[a] Njoo, nikutume kwao.” Naye akamwambia, “Mimi hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
