lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanatumia jina Israeli katika mstari huu, si Yakobo.
- source_word: הֲלוֹא
  choice: Je, ... hawa-?
  rationale: Muundo huu wa swali hasi unahifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: אַחֶיךָ
  choice: ndugu zako
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya pili ya kiume inawarejelea ndugu wa Yosefu.
- source_word: רֹעִים
  choice: wanachunga mifugo
  rationale: Kitenzi רעה hapa kinaeleza kazi ya uchungaji; neno 'mifugo' linaweka wazi kitu kinachochungwa bila kukifunga kwa aina moja ya wanyama.
- source_word: בִּשְׁכֶם
  choice: huko Shekemu
  rationale: Kiambishi ב kinaonyesha mahali; 'huko' ni cha kawaida katika Kiswahili kwa eneo lililo mbali na msemaji.
- source_word: לְכָה
  choice: Njoo
  rationale: Amri hii hutumika kama mwito au agizo la kuanza hatua; 'Njoo' ni sawia ya moja kwa moja bila kuongeza msisitizo.
- source_word: וְאֶשְׁלָחֲךָ
  choice: nikutume
  rationale: Muundo huu baada ya amri unaeleza kusudi au hatua inayofuata kwa ufasaha wa kawaida wa Kiswahili.
- source_word: אֲלֵיהֶם
  choice: kwao
  rationale: Kiwakilishi kinawarejelea ndugu waliotajwa; 'kwao' ni kifupi na cha asili katika Kiswahili.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Huu ni usemi wa kujitokeza na kuonyesha utayari; tafsiri hii inadumisha umbo la kifasihi bila kuongeza maelezo kama 'niko tayari.'
