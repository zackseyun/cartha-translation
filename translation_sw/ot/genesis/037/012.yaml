  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. “Wakaenda” huendeleza mfuatano bila kuongeza neno la wakati lisilomo katika chanzo. Alama ya tanbihi [a] imewekwa baada ya jina la mahali.
