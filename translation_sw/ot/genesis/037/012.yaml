  text: Ndugu zake wakaenda kulichunga kundi la baba yao katika Shekemu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huko Shekemu” au “kwenye Shekemu.” Kihusishi cha Kiebrania kinaweza kuonyesha mahali ndani ya mji au mahali/eneo lililo karibu nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: Umbo la wayyiqtol linaendeleza mfuatano wa matukio; “wakaenda” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu neno linawarejelea ndugu wa kiume wa Yosefu. Kiswahili cha kawaida hutumia “ndugu zake”; muktadha unaweka wazi kuwa ni wale wanaume waliotajwa.
- source_word: לִרְעוֹת
  choice: kulichunga
  rationale: Kitenzi רעה hapa ni kutunza na kulisha mifugo. “Kulichunga” ni usemi wa kawaida kwa tendo hilo na huendana na kundi kama yambwa.
- source_word: אֶת
  choice: '[alama ya yambwa haitafsiriwi]'
  rationale: אֵת ni alama ya yambwa maalumu katika Kiebrania na haina neno huru linalolingana nayo katika Kiswahili.
- source_word: צֹאן
  choice: kundi
  rationale: צֹאן ni jina la mkusanyiko wa mifugo midogo, hasa kondoo na mbuzi. “Kundi” huhifadhi maana ya pamoja bila kubainisha aina moja ya mnyama.
- source_word: אֲבִיהֶם
  choice: la baba yao
  rationale: Muundo huu unaonyesha umilikaji; “la baba yao” ni Kiswahili cha kawaida na kinachoeleweka wazi.
- source_word: בִּשְׁכֶם
  choice: huko Shekemu
  rationale: Kihusishi ב kinaweza kuonyesha kuwa ndani ya mahali au katika eneo lake. “Huko Shekemu” ni cha asili katika simulizi na hakilazimishi mpaka mkali wa kijiografia.
