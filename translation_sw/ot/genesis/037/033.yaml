  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: sw
  text: Akaitambua, akasema, “Ni vazi la mwanangu. Mnyama mkali wa porini amemla. Hakika Yosefu ameraruliwa vipande-vipande.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: Akaitambua
  rationale: Kitenzi נכר katika Hifili humaanisha kutambua; kiambishi cha kitu kinarejelea kanzu, na Kiswahili hutumia ngeli yake kwa kawaida.
- source_word: כְּתֹנֶת בְּנִי
  choice: kanzu ya mwanangu
  rationale: כְּתֹנֶת ni vazi refu linalovaliwa mwilini; “kanzu” ni neno la kawaida na lenye hadhi katika Kiswahili, huku muundo wa “ya mwanangu” ukihifadhi uhusiano wa umilikaji.
- source_word: חַיָּה רָעָה
  choice: mnyama mkali
  rationale: חַיָּה hapa ni mnyama wa porini, na רָעָה katika muktadha huu hudokeza hatari au ukali, si lazima ubaya wa kimaadili. “Mnyama mkali” ni usemi wa asili unaofaa kwa mnyama anayewinda.
- source_word: אֲכָלָתְהוּ
  choice: amemla
  rationale: Kitenzi kinataja kula kwa mnyama; “amemla” ni cha moja kwa moja na cha kawaida katika Kiswahili, huku muktadha ukionyesha kuwa ni kumla kabisa.
- source_word: טָרֹף טֹרַף
  choice: Hakika ... ameraruliwa vipandevipande
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi cha hali ya kutendwa unasisitiza uhakika na ukali wa tendo. “Hakika” hubeba msisitizo huo, na “ameraruliwa vipandevipande” huwasilisha matokeo ya shambulio kwa lugha ya kawaida.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: “Yosefu” ni umbo sanifu na linalotambulika sana la jina la Kiebrania יוֹסֵף katika Kiswahili.
