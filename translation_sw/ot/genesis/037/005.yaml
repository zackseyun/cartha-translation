translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo ‘akaota ndoto’ umehifadhiwa kwa kuwa ni wa kawaida katika Kiswahili na unaakisi muundo wa Kiebrania. Alama ya tanbihi [a] imewekwa katika matini kuu kama ilivyotakiwa.
