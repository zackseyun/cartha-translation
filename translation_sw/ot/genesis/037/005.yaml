  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: sw
  text: Yosefu akaota ndoto[a], akawaambia ndugu zake, nao wakazidi kumchukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Yosefu akaota ndoto.”
