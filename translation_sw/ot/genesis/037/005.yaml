lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: Yosefu akaota ndoto
  rationale: Muundo wa Kiebrania una kitenzi na nomino zenye mzizi mmoja, kihalisi ‘akaota ndoto.’ Kiswahili pia hutumia kwa kawaida muundo ‘kuota ndoto,’ hivyo maana na umbo la msisitizo vinaweza kuhifadhiwa bila lugha kuwa ngumu.
- source_word: וַיַּגֵּד
  choice: akawaambia
  rationale: Kitenzi נגד hapa kina maana ya kusema, kusimulia, au kujulisha. ‘Akawaambia’ ni ya kawaida katika simulizi na yambwa inayorejelewa—ndoto—inaeleweka kutokana na sentensi iliyotangulia.
- source_word: לְאֶחָיו
  choice: ndugu zake
  rationale: Nomino ya Kiebrania katika wingi wa kiume humaanisha ndugu zake wa kiume katika muktadha huu. Kiswahili ‘ndugu zake’ ni usemi wa kawaida; muktadha wa simulizi unatambulisha kuwa ni wana wa kiume wa baba mmoja.
- source_word: וַיּוֹסִפוּ עוֹד
  choice: wakazidi
  rationale: Mchanganyiko wa יסף na עוד unaonyesha kuongezeka zaidi. ‘Wakazidi’ huwasilisha ongezeko hilo kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: שְׂנֹא אֹתוֹ
  choice: kumchukia
  rationale: Kitenzi-jina kinachofuata יסף kina maana ya ‘kuongeza kumchukia’; baada ya ‘wakazidi,’ ‘kumchukia’ huunda sentensi ya asili na kuhifadhi maana hiyo.
- source_word: וַ
  choice: aka- / waka- / nao waka-
  rationale: Viunganishi vya simulizi vimetafsiriwa kwa viambishi vya mfululizo vya Kiswahili. ‘Nao’ kabla ya tendo la ndugu huweka wazi mabadiliko ya mtenda bila kuongeza kiashiria cha wakati kisichokuwamo katika chanzo.
