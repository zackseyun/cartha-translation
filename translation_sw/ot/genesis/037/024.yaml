  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: sw
  text: Kisha wakamchukua na kumtupa ndani ya shimo[a]. Shimo hilo lilikuwa tupu; halikuwa na maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “birika”; neno la Kiebrania bor linaweza kumaanisha shimo au birika la kuhifadhia maji, jambo linaloafikiana na maelezo kwamba halikuwa na maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: Kisha wakamchukua
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza mfululizo wa matukio. ‘Kisha’ ni kiunganishi cha kawaida katika simulizi ya Kiswahili, na ‘wakamchukua’ linadumisha maana ya kawaida ya לקח bila kuongeza wazo la kumkamata kwa nguvu.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: na kumtupa
  rationale: השליך humaanisha kutupa; ‘kumtupa’ ni neno la sasa, wazi, na lenye nguvu inayolingana na kitendo bila kukitia chumvi.
- source_word: הַבֹּרָה
  choice: ndani ya shimo
  rationale: בּוֹר inaweza kumaanisha shimo au birika la kuhifadhia maji. ‘Shimo’ linahifadhi upana wa neno la Kiebrania; uwezekano wa ‘birika’ umewekwa katika tanbihi.
- source_word: וְהַבּוֹר רֵק
  choice: Shimo hilo lilikuwa tupu
  rationale: Kifungu hiki kinatoa maelezo ya hali ya shimo. Sentensi mpya ya Kiswahili inaonyesha nguvu hiyo ya ufafanuzi kwa kawaida, huku רֵק likitafsiriwa ‘tupu.’
- source_word: אֵין בּוֹ מָיִם
  choice: halikuwa na maji
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kueleza kwamba maji hayakuwamo, huku ikihifadhi kutajwa kwa maji moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida na unaeleweka kwa urahisi; tafsiri haibainishi zaidi ya Kiebrania kama mahali hapo palikuwa shimo la kawaida au birika la maji.
