  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: sw
  text: Ikawa, Yosefu alipowafikia ndugu zake, wakamvua Yosefu vazi lake, lile vazi la pekee[a] alilokuwa amevaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vazi lenye mikono mirefu,” “vazi lililopambwa sana,” au “vazi la rangi nyingi.” Maana ya usemi wa Kiebrania כְּתֹנֶת הַפַּסִּים haina uhakika; tafsiri ya kimapokeo “vazi la rangi nyingi” inawezekana, lakini huenda isiwe maana sahihi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ikawa ... alipo-
  rationale: Muundo huu unaendeleza simulizi na kuonyesha wakati wa tukio kwa Kiswahili cha kawaida bila kunakili nahau ya Kiebrania neno kwa neno.
- source_word: בָּא
  choice: alipofika
  rationale: Katika muktadha huu, kitenzi kinaonyesha Yosefu kufika mahali walipokuwa ndugu zake; ‘alipofika’ ni ya asili katika simulizi la Kiswahili.
- source_word: אֶל אֶחָיו
  choice: kwa ndugu zake
  rationale: Wingi wa kiume katika muktadha huu unawahusu kaka zake Yosefu; ‘ndugu zake’ ni usemi wa kawaida wa Kiswahili unaofaa kwa uhusiano huo.
- source_word: וַיַּפְשִׁיטוּ
  choice: wakamvua
  rationale: Kitenzi kinaeleza kumwondolea mtu vazi, na muktadha unaonyesha kitendo walichomfanyia Yosefu.
- source_word: כֻּתָּנְתּוֹ
  choice: kanzu yake
  rationale: ‘Kanzu’ ni jina linaloeleweka la vazi refu linalovaliwa mwilini na linafaa zaidi hapa kuliko neno pana ‘vazi.’
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: ile kanzu maalumu
  rationale: Maana kamili ya פַּסִּים haijulikani kwa uhakika. ‘Maalumu’ inaonyesha kuwa kanzu hiyo ilikuwa ya pekee bila kulazimisha maana ya rangi nyingi, mikono mirefu, au mapambo.
- source_word: אֲשֶׁר עָלָיו
  choice: aliyokuwa amevaa
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayoeleza kwamba kanzu hiyo ilikuwa mwilini mwa Yosefu wakati huo.
