  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: sw
  text: Ndipo Yakobo akararua mavazi yake, akajifunga nguo ya gunia kiunoni[a], akamwombolezea mwanawe kwa siku nyingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viunoni.” Kiebrania hurejelea kihalisi eneo la kiuno au viuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: akararua
  rationale: Katika muktadha wa maombolezo, kitenzi קרע humaanisha kurarua mavazi kama ishara ya huzuni; “akararua” huhifadhi tendo halisi kwa Kiswahili cha kawaida.
- source_word: שִׂמְלֹתָיו
  choice: mavazi yake
  rationale: שִׂמְלָה ni neno la jumla kwa nguo au mavazi; “mavazi yake” ni la asili na lenye hadhi bila kuyafanya kuwa majoho mahususi.
- source_word: שַׂק
  choice: nguo ya gunia
  rationale: Neno hili hurejelea kitambaa kigumu kilichovaliwa wakati wa maombolezo; “nguo ya gunia” linaeleweka kwa wasomaji wa Kiswahili na kuhifadhi maana ya kitamaduni.
- source_word: בְּמָתְנָיו
  choice: kiunoni
  rationale: מָתְנַיִם hurejelea eneo la kiuno au viuno; “kiunoni” ni usemi wa kawaida wa Kiswahili unaoonyesha mahali nguo hiyo ilipofungwa.
- source_word: וַיִּתְאַבֵּל
  choice: kumwombolezea
  rationale: Muundo wa kitenzi אבל unaonyesha kuingia katika hali na desturi za maombolezo; “kumwombolezea” hudokeza maombolezo ya kufiwa kuliko huzuni ya jumla.
- source_word: עַל־בְּנוֹ
  choice: mwanawe
  rationale: עַל pamoja na kitenzi cha kuomboleza humtaja anayelengwa na maombolezo; kiambishi cha mtendewa katika “kumwombolezea mwanawe” ni cha asili katika Kiswahili.
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Tafsiri hii huhifadhi moja kwa moja maana ya muda mrefu iliyo katika kauli ya Kiebrania.
