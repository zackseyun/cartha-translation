translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “N服uo ya gunia” imeepukwa kwa sababu ya hitilafu; maandishi yametumia “nguo ya gunia.” Alama ya tanbihi imewekwa baada ya “kiunoni,” ambako ufafanuzi wake unahusika moja kwa moja.
