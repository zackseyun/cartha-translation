  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: sw
  text: Ndipo wanawe wote wa kiume na mabinti zake wote wakainuka ili kumfariji, lakini akakataa kufarijika. Akasema, “Kwa maana nitashuka mpaka Sheoli[a] kwa mwanangu, nikiwa na maombolezo.” Basi baba yake akamlilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kaburini”; Kiebrania, “Sheoli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Kitenzi קום ni kitenzi cha kawaida cha simulizi chenye maana ya kuinuka; hapa kinaonyesha kuja kwao kumfariji bila kuongeza maelezo yasiyokuwamo.
- source_word: כָל־בָּנָיו וְכָל־בְּנֹתָיו
  choice: wanawe wote wa kiume na wa kike
  rationale: Kiebrania kinataja wana wa kiume na mabinti kwa namna tofauti; tafsiri inadumisha tofauti hiyo huku ikitumia Kiswahili cha kawaida.
- source_word: לְנַחֲמוֹ
  choice: ili kumfariji
  rationale: Katika muktadha wa msiba, piel ya נחם ina maana ya kumpa mtu faraja.
- source_word: וַיְמָאֵן לְהִתְנַחֵם
  choice: akakataa kufarijika
  rationale: מאן huonyesha kukataa, na hitpael ya נחם hapa inaweza kutolewa kwa maana ya kupokea faraja; usemi huu ni wa asili katika Kiswahili.
- source_word: כִּי
  choice: La
  rationale: Katika kauli hii כִּי inaweza kuimarisha azimio la Yakobo, si lazima iwe kiunganishi cha sababu; “La” huunganisha kukataa kwake na kauli inayofuata kwa Kiswahili cha asili.
- source_word: אֵרֵד
  choice: nitashuka
  rationale: Inadumisha taswira ya Kiebrania ya kushuka kwenda mahali pa wafu.
- source_word: אֶל־בְּנִי
  choice: kwa mwanangu
  rationale: אֶל kwa kawaida ni kuelekea au kwa; tafsiri hii inadumisha wazo la kwenda aliko mwanaye bila kuongeza ufafanuzi.
- source_word: אָבֵל
  choice: nikiwa na huzuni
  rationale: Neno linaonyesha hali ya kuwa mwombolezaji; Kiswahili hiki kinaeleza hali yake ya kuomboleza kwa uwazi na kwa kawaida.
- source_word: שְׁאֹלָה
  choice: kwenda Sheoli
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda Sheoli. Jina Sheoli linahifadhi dhana pana ya eneo la wafu badala ya kuipunguza kuwa kaburi tu.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: Basi baba yake akaendelea kumlilia
  rationale: Kitenzi בכה pamoja na kiwakilishi cha mtendewa kina maana ya kumlilia. “Akaendelea” huonyesha maombolezo yanayoendelea katika muktadha, ingawa umbo lenyewe ni tukio la simulizi.
theological_decisions:
- issue: Maana ya שְׁאוֹל (Sheoli)
  choice: Sheoli
  alternative: kaburini; katika makao ya wafu
  rationale: “Sheoli” huhifadhi istilahi ya Kiebrania na upana wake wa maana kuhusu eneo la wafu, bila kuilinganisha moja kwa moja na kaburi wala kuingiza fundisho la baadaye kuhusu maisha baada ya kifo.
- issue: Uhusiano wa “kwa mwanangu,” “nikiwa na huzuni,” na “Sheoli”
  choice: nitashuka kwenda Sheoli kwa mwanangu nikiwa na huzuni
  alternative: nitashuka kwa mwanangu nikiwa na huzuni, hadi Sheoli
  rationale: Mpangilio wa Kiebrania unaweza kuhusianisha maneno haya kwa zaidi ya namna moja. Mpangilio wa Kiswahili unaweka Sheoli kama mwisho wa kushuka, mwana kama yule anayefuatwa huko, na huzuni kama hali ya Yakobo, bila kudai zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa upya kidogo ili isomeke kwa kawaida, huku istilahi “Sheoli” na utata wa mahusiano ya virai ukihifadhiwa. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizoongezwa katika rasimu hii.
