translation:
  language: sw
  text: Kisha wakachukua kanzu[a] ya Yosefu, wakamchinja beberu, na wakaichovya kanzu hiyo katika damu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joho” au “vazi”; neno la Kiebrania humaanisha vazi la aina ya kanzu.
