lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kisha wakachukua
  rationale: Umbo la wayyiqtol linaendeleza mfululizo wa simulizi; “Kisha” na “waka-” vinatoa mtiririko wa asili wa Kiswahili.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: kanzu ya Yosefu
  rationale: כְּתֹנֶת ni vazi refu linalofanana na kanzu; usemi wa umilikaji umetafsiriwa kwa muundo wa kawaida wa Kiswahili.
- source_word: וַיִּשְׁחֲטוּ
  choice: wakamchinja
  rationale: Kitenzi kinamaanisha kumuua mnyama kwa kumchinja, si kumuua tu kwa namna yoyote.
- source_word: שְׂעִיר עִזִּים
  choice: beberu
  rationale: Kirai cha Kiebrania kinamtaja mbuzi dume; “beberu” ni neno la kawaida na mahususi katika Kiswahili Sanifu.
- source_word: וַיִּטְבְּלוּ
  choice: kuichovya
  rationale: Kitenzi kina maana ya kuchovya au kuzamisha katika kimiminika; “chovya” ni cha asili kwa tendo linaloelezwa hapa.
- source_word: הַכֻּתֹּנֶת
  choice: kanzu hiyo
  rationale: “Hiyo” inaonyesha wazi kuwa ni vazi lilelile lililotajwa awali huku ikidumisha istilahi ileile.
- source_word: בַּדָּם
  choice: katika damu
  rationale: Kihusishi chenye kiambishi cha uamilifu kinaonyesha damu ya beberu aliyetajwa, ingawa Kiswahili hakihitaji kibainishi sawa na cha Kiebrania.
