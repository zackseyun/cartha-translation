  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: sw
  text: Rubeni alirudi kwenye shimo[a]; kumbe, Yosefu hakuwamo shimoni, naye akararua mavazi yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kisima cha maji”; neno la Kiebrania bor linaweza kumaanisha shimo au kisima cha maji.
    reason: lexical_alternative
  - marker: b
    text: Kurarua mavazi kulikuwa desturi ya kuonyesha huzuni, mshtuko, au mfadhaiko mkubwa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: aliporudi
  rationale: Kitenzi שוב hapa kinaonyesha Rubeni kurudi mahali alipokuwa amekwenda awali; “aliporudi” ni Kiswahili cha kawaida na huhifadhi mfuatano wa simulizi.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: shimo / shimoni
  rationale: בּוֹר inaweza kumaanisha shimo au kisima cha kuhifadhia maji. “Shimo” linaeleweka kwa urahisi na linafaa katika muktadha huu, huku “kisima” likihifadhiwa katika tanbihi kama maana nyingine inayowezekana.
- source_word: וְהִנֵּה
  choice: kumbe
  rationale: הִנֵּה huvuta fikira kwenye jambo lililogunduliwa ghafla. “Kumbe” huleta kwa njia ya asili mshangao wa Rubeni anapoona kwamba Yosefu hayumo.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: Yosefu hakuwamo shimoni
  rationale: אֵין hapa huonyesha kutokuwapo. Kauli hii ni ya kawaida katika Kiswahili na haisemi zaidi ya andiko, kama ambavyo “alikuwa ameondoka” ingefanya.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: Rubeni akararua mavazi yake
  rationale: Usemi huu unaeleza kitendo halisi kilichokuwa ishara ya huzuni au mfadhaiko. Kurudia jina “Rubeni” huondoa utata wa kiwakilishi katika Kiswahili, na “mavazi” ni neno la heshima na linaloeleweka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kumbe” limetumiwa badala ya tafsiri nzito zaidi ya הִנֵּה ili kuhifadhi ugunduzi wa ghafla kwa lugha ya kawaida. “Basi” linaendeleza matokeo ya ugunduzi huo bila kuongeza tafsiri ya kihisia isiyosemwa wazi.
