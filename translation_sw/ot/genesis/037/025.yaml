base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: sw
  text: Kisha wakaketi kula. Wakainua macho yao, wakaona, tazama, msafara wa Waishmaeli ukija kutoka Gileadi. Ngamia wao walikuwa wamebeba gundi, zeri na manemane. Msafara huo ulikuwa ukielekea Misri kuvipeleka huko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa maana ya msingi ni “mkate,” hapa neno hilo linatumika kwa maana pana ya chakula au mlo; “kula chakula” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: msafara wa Waishmaeli
  rationale: אֹרְחָה ni msafara wa wasafiri au wafanyabiashara, nao wanatambulishwa kuwa Waishmaeli.
- source_word: נְכֹאת
  choice: ubani
  rationale: Ni dutu yenye harufu nzuri iliyosafirishwa kama bidhaa; utambulisho wake kamili wa kibotania haujulikani, na “ubani” ni istilahi ya Kiswahili inayoeleweka bila kudai spishi mahususi.
- source_word: צְרִי
  choice: zeri
  rationale: Hurejelea utomvu au dawa yenye harufu nzuri, kwa desturi ikitafsiriwa “zeri”; istilahi hii huhifadhi utofauti wake na bidhaa nyingine katika orodha.
- source_word: לֹט
  choice: manemane
  rationale: Utambulisho wa dutu hii una mjadala, lakini “manemane” ni tafsiri ya jadi na inayoeleweka kwa bidhaa ya kunukia katika muktadha huu.
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: kuvipeleka Misri
  rationale: Kitenzi kihalisi ni “kushusha,” kikionyesha safari kuelekea Misri; Kiswahili cha kawaida hutumia “kupeleka,” huku kiambishi “-vi-” kikirejelea bidhaa zilizotajwa.
