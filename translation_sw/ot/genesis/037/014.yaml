  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: sw
  text: Akamwambia, “Tafadhali nenda ukaangalie hali ya ndugu zako na hali ya kundi, kisha unirudishie habari.” Basi akamtuma kutoka Bonde la Hebroni, naye akafika Shekemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Tafadhali nenda
  rationale: Kitenzi cha amri לֶךְ ni ‘nenda,’ na נָא hulainisha ombi; ‘Tafadhali nenda’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: ukaangalie hali ya
  rationale: ראה hapa ni kuchunguza au kujua hali, huku שׁלום ikimaanisha ustawi au hali njema. ‘Angalie hali ya’ ni ya asili na haiamui mapema kwamba walikuwa salama.
- source_word: אַחֶיךָ
  choice: ndugu zako
  rationale: Katika muktadha huu neno la Kiebrania linawarejelea ndugu wa kiume wa Yosefu; ‘ndugu zako’ ni usemi wa kawaida wa Kiswahili unaofaa muktadha.
- source_word: הַצֹּאן
  choice: kundi
  rationale: צאן ni kundi la mifugo midogo, hasa kondoo na mbuzi. ‘Kundi’ huhifadhi maana ya pamoja bila kubainisha aina moja tu.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: kisha unirudishie habari
  rationale: Muundo huu una maana ya kurudi na taarifa. ‘Unirudishie habari’ huonyesha wazi kurudi na kutoa taarifa kwa Kiswahili cha kawaida.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: kutoka Bonde la Hebroni
  rationale: Huhifadhi wazi עֵמֶק, ‘bonde,’ pamoja na uhusiano wake na Hebroni.
- source_word: שְׁכֶמָה
  choice: akafika Shekemu
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea Shekemu; katika mfuatano wa simulizi, ‘akafika Shekemu’ huwasilisha kwa kawaida kwamba alienda na kufika huko.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Kurudiwa kwa ‘hali ya’ kunahifadhi ulinganifu wa matumizi mawili ya שְׁלוֹם bila kutumia istilahi nzito isiyo ya kawaida.
