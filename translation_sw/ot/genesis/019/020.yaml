  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: inahifadhi msisitizo wa הִנֵּה, toni ya kusihi ya נָא, ukaribu wa mji kama mahali pa kukimbilia, na urudiaji wa מִצְעָר (“mdogo”). Kifungu cha mwisho kimetafsiriwa kwa maana ya nahau, “ili niwe hai,” ambacho kwa usahihi huwasilisha kusudi/matokeo ya וּתְחִי נַפְשִׁי badala ya literalism isiyo ya kawaida.'
