  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: sw
  text: “Tazama, tafadhali, mji huu uko karibu kiasi cha kuweza kuukimbilia, nao ni mdogo. Tafadhali, niruhusu nikimbilie huko—je, si mdogo?—ili niwe hai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa dharura; “Tazama” ni la heshima na la kawaida katika usimulizi wa kibiblia wa Kiswahili.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe hii huonyesha ombi la kusihi; “tafadhali” huwasilisha adabu na uharaka wake.
- source_word: הָעִיר הַזֹּאת
  choice: mji huu
  rationale: Huwakilisha moja kwa moja nomino na kiashiria bila kuamua ikiwa ni mji mkubwa au mdogo.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: uko karibu kiasi cha kuweza kuukimbilia
  rationale: Hueleza ukaribu unaomwezesha Loti kukimbilia mjini humo; kiambishi “u-” kinaweka wazi kuwa mji ndio mahali pa kukimbiliwa.
- source_word: וְהִיא מִצְעָר
  choice: nao ni mdogo
  rationale: “Mdogo” huhifadhi maana ya udogo na kuandaa urudiaji wake katika swali linalofuata.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: Tafadhali, niruhusu nikimbilie huko
  rationale: Kauli ya kusihi ya nafsi ya kwanza inaomba ruhusa ya kukimbilia mahali hapo; tafsiri hii ni ya asili katika Kiswahili.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: je, si mdogo?
  rationale: Huhifadhi swali la balagha na urudiaji wa neno linalomaanisha udogo.
- source_word: וּתְחִי נַפְשִׁי
  choice: ili niwe hai
  rationale: נֶפֶשׁ hapa humwakilisha mtu mwenyewe, na kiunganishi kinaonyesha kusudi au matokeo ya kukimbilia huko; “ili niwe hai” huwasilisha maana ya nahau kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa “mdogo” umehifadhiwa kwa sababu ni sehemu ya hoja ya Loti. Nahau ya mwisho imetafsiriwa kwa maana yake badala ya usemi usio wa kawaida “nafsi yangu iishi.”
