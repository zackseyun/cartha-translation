base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: sw
  text: Ikawa walipowatoa nje, akasema, “Kimbia ili uokoe maisha yako! Usitazame nyuma yako, wala usisimame mahali popote katika uwanda. Kimbilia milimani,[a] usije ukaangamia.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mlima” au “katika nchi ya vilima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “usije ukafagiliwa mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: nje
  rationale: Kielezi hiki chenye maana ya mwelekeo kinaonyesha kutoka ndani ya mji kwenda nje; “nje” ni Kiswahili cha kawaida na sahihi.
- source_word: הִמָּלֵט
  choice: Kimbia ili uokoe / Kimbilia
  rationale: Amri hii inaonyesha kuponyoka kwa haraka. Miundo hii miwili ya mzizi wa Kiswahili “kimbia” hudumisha urudiaji wa amri huku ikieleza kusudi katika matumizi ya kwanza na mwelekeo katika la pili.
- source_word: עַל נַפְשֶׁךָ
  choice: ili uokoe maisha yako
  rationale: Hii ni nahau inayohusu kuokoa uhai wa mtu, si “nafsi” kwa maana finyu ya kiroho. Tafsiri hii ni ya kawaida na inadumisha uzito wa amri.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: Usitazame nyuma yako
  rationale: Inadumisha picha halisi ya kutazama upande wa nyuma bila kuibadili kuwa maelezo ya nia au majuto.
- source_word: וְאַל תַּעֲמֹד
  choice: wala usisimame
  rationale: Katika onyo hili, kitenzi kinakataza kusimama au kukawia wakati wa kukimbia. “Usisimame” ni sahihi na ya kawaida katika Kiswahili.
- source_word: בְּכָל הַכִּכָּר
  choice: mahali popote katika uwanda
  rationale: כִּכָּר hapa ni eneo tambarare la Yordani, na בְּכָל katika muktadha wa katazo lina maana ya kutosimama popote ndani yake.
- source_word: הָהָרָה
  choice: milimani
  rationale: Umbo lenye kiambishi cha mwelekeo linaonyesha kukimbilia eneo la juu. “Milimani” ni la kawaida na linafaa kwa utofauti wa kijiografia kati ya uwanda na eneo la vilima, huku tanbihi ikihifadhi uwezekano wa umoja au maana ya nchi ya vilima.
- source_word: פֶּן תִּסָּפֶה
  choice: usije ukaangamia
  rationale: Kitenzi kinaweza kumaanisha kuangamia au kuondolewa katika maafa pamoja na wengine. “Ukaangamia” ni cha asili na hakibainishi kupita kiasi namna ya maangamizi.
theological_decisions:
- issue: Utambulisho wa msemaji
  choice: akasema
  alternative: wakasema / malaika akasema
  rationale: Kitenzi cha Kiebrania ni cha umoja, lakini sentensi haitaji wazi msemaji ni nani. Tafsiri inadumisha umoja bila kuongeza utambulisho ambao matini hauelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli fupi za amri zinadumisha uharaka wa tukio. Viashiria vyote vya tanbihi vimewekwa moja kwa moja baada ya maneno yanayohusika.
