  naturalness: Rasimu ina Kiswahili kinachoeleweka, lakini “Tafadhali, na niwalete kwenu” si laini katika muktadha huu. “Niruhusuni niwalete” ni ombi la asili linalowasilisha kohotativi. “Chini ya kivuli cha paa langu” pia ni sahihi zaidi na ya kawaida kuliko “dari yangu.”
  terminology: “Mwanamume,” “binti wawili,” na “wanaume hawa” zinafaa. “Paa” ndilo neno linalofaa kwa קֹרָה katika taswira ya hifadhi; “dari” kwa kawaida humaanisha sehemu ya ndani ya juu ya chumba.
