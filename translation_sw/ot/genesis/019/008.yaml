base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: sw
  text: Tazama, tafadhali, nina binti wawili ambao hawajamjua mwanamume.[a] Tafadhali, niruhusuni niwalete kwenu, nanyi mwafanyie yaliyo mema machoni penu. Ila wanaume hawa msiwafanyie lolote, kwa maana wamekuja chini ya kivuli cha paa langu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hawajawahi kuwa na uhusiano wa kingono na mwanamume; kwa tafsiri ya kawaida, “ambao ni mabikira.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “chini ya kivuli cha paa langu,” nahau inayoonyesha ulinzi unaowastahili wageni walioingia nyumbani mwa mtu.'
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tazama
  rationale: הִנֵּה huvuta usikivu kwa dharura; katika muktadha huu נָא huongeza sauti ya kusihi. “Tazama” ni ya heshima na ya kawaida katika usimulizi wa kibiblia, bila kutumia tamko la kizamani lisiloeleweka.
- source_word: שְׁתֵּי בָנוֹת
  choice: binti wawili
  rationale: Ni uhamisho wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: ambao hawajamjua mwanamume
  rationale: Inahifadhi nahau ya Kiebrania ya “kumjua mwanamume,” ambayo hapa humaanisha kuwa na uhusiano wa kingono, bila kuifafanua kupita kiasi ndani ya matini.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: Tafadhali, na niwalete kwenu
  rationale: Umbo la kohotativi linaonyesha nia au ombi la Loti; “na niwalete” pamoja na “tafadhali” huwasilisha sauti ya kusihi kwa Kiswahili cha kawaida.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: nanyi mwafanyie yaliyo mema machoni penu
  rationale: Inahifadhi taswira ya Kiebrania “mema machoni penu” na ukali wa pendekezo bila kulainisha maana yake.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: Ila msiwafanyie lolote wanaume hawa
  rationale: “Ila” huonyesha kizuizi chenye nguvu cha רַק, huku “msiwafanyie lolote” ikitoa katazo kamili kwa Kiswahili cha asili.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: kwa maana wamekuja
  rationale: 'Huwasilisha nguvu ya kisababishi katika muktadha: kuja kwao nyumbani kwa Loti ndiko kunakotajwa kuwa msingi wa wajibu wake wa kuwalinda.'
- source_word: בְּצֵל קֹרָתִי
  choice: chini ya kivuli cha dari yangu
  rationale: Inahifadhi taswira halisi ya “kivuli” na “dari,” pamoja na maana ya kitamaduni ya hifadhi chini ya ukarimu wa mwenye nyumba.
theological_decisions:
- issue: Iwapo pendekezo la Loti lilainishwe kwa sababu ya ukali wake wa kimaadili
  choice: Kudumisha maana ya wazi na yenye kushtua ya Kiebrania bila kuipunguza
  alternative: Kutumia usemi laini kama “mwafanyie mtakavyo” au kuficha kitendo kinachopendekezwa
  rationale: Matini haisemi kwamba pendekezo hilo ni jema, lakini inalitoa kwa ukali. Tafsiri haipaswi kuingiza kibali cha kimaadili wala kuficha uzito wa maneno hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa sasa. Nahau kuu za Kiebrania zimehifadhiwa pale zinapoeleweka, na maelezo muhimu yametolewa katika tanbihi.
