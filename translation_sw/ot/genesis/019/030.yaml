base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: sw
  text: Kisha Loti akapanda kutoka Soari, akaishi katika nchi ya milima pamoja na binti zake wawili, kwa sababu aliogopa kuishi Soari. Kwa hiyo akaishi pangoni[a], yeye na binti zake wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika pango hilo.” Kibainishi kinaweza kuonyesha pango maalumu alilokaa, ingawa pango hilo halikutajwa hapo awali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kinaonyesha kwenda juu; “akapanda” kinahifadhi mwelekeo wa kijiografia kwa Kiswahili cha kawaida.
- source_word: מִצּוֹעַר
  choice: kutoka Soari
  rationale: Kihusishi מן kinaonyesha mwendo wa kuondoka mahali paitwapo Soari.
- source_word: וַיֵּשֶׁב בָּהָר
  choice: akaishi katika nchi ya milima
  rationale: ישב hapa humaanisha kukaa kama mkazi, na הַר ya umoja inaweza kutaja eneo la milima kwa maana ya kijumla.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: pamoja na binti zake wawili
  rationale: Hutoa kwa Kiswahili cha asili maana ya kwamba binti zake wawili walikuwa naye bila kuongeza wazo jipya.
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: kwa sababu aliogopa kuishi Soari
  rationale: כִּי inaeleza sababu, ירא hali ya kuogopa, na ישב hapa ni kuishi mahali.
- source_word: בַּמְּעָרָה
  choice: pangoni
  rationale: Muundo wa Kiswahili “pangoni” ni wa kawaida na haumlazimishi msomaji kuamua ikiwa pango hilo lilikuwa limetajwa au kutambulika tayari; tofauti ya kibainishi cha Kiebrania imehifadhiwa katika tanbihi.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: yeye na binti zake wawili
  rationale: Inahifadhi urudiaji wa Kiebrania unaosisitiza waliokaa pangoni.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya masimulizi ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Nchi ya milima” huhifadhi maana ya topografia ya בָּהָר, huku “pangoni” likiwa neno la kawaida la Kiswahili.
