  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: sw
  text: 'Akamwambia, “Tazama, nimekukubalia[a] ombi hili pia: sitauangamiza mji ulioutaja.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “nimeuinua uso wako”; ni nahau inayomaanisha “nimekuonyesha fadhili” au “nimekukubalia ombi lako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linadumisha nguvu ya kuvuta usikivu katika jibu, kwa lugha ya kibiblia iliyo wazi na yenye hadhi.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: nimekukubalia ombi
  rationale: Nahau hiyo, ambayo kihalisi ni ‘nimeuinua uso wako,’ hapa ina maana ya kumwonyesha mtu fadhili kwa kukubali ombi lake. Kiswahili hiki kinawasilisha maana hiyo kwa kawaida.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: hili pia
  rationale: ‘Hili’ linarejelea ombi alilotoka kulitoa Loti, na ‘pia’ linahifadhi nguvu ya nyongeza ya גַּם bila kurudia neno ‘ombi’ kwa namna nzito.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: sitauangamiza
  rationale: Muundo huu unaeleza jambo ambalo msemaji hatafanya. Katika Kiswahili, ‘angamiza’ huwasilisha kwa kawaida maangamizi makubwa yanayokusudiwa na הפך, ingawa picha halisi ni ya kuupindua.
- source_word: הָעִיר
  choice: mji huo
  rationale: Nomino maalumu katika muktadha inarejelea mji ambao Loti ametaja; ‘huo’ ni rejeleo la kawaida la Kiswahili.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: uliosema habari zake
  rationale: Linahifadhi wazo la kusema kuhusu mji huo kwa Kiswahili cha sasa na kinachoeleweka.
