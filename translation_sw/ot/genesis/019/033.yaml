base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: sw
  text: Basi usiku huo wakampa baba yao divai anywe, na binti mkubwa akaingia, akalala na baba yake. Naye hakujua alipolala wala alipoinuka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “hakujua katika kulala kwake na kuinuka kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: wakampa ... divai anywe
  rationale: Hifili ya שׁקה ina maana ya kumnywesha au kumpa mtu kinywaji; muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya kusababisha anywe.
- source_word: יַיִן
  choice: divai
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa יין katika Kiswahili cha Biblia.
- source_word: בַּלַּיְלָה הוּא
  choice: usiku huo
  rationale: Ni usemi wa wakati unaorejelea usiku maalumu uliotajwa katika simulizi.
- source_word: הַבְּכִירָה
  choice: binti mkubwa
  rationale: Neno la Kiebrania humaanisha mzaliwa wa kwanza wa kike; katika muktadha wa mabinti wawili, 'binti mkubwa' ni wazi na la kawaida, huku likihifadhi mpangilio wa kuzaliwa.
- source_word: וַתָּבֹא
  choice: akaingia
  rationale: Kitenzi kinaonyesha kuingia alikokuwa baba yake; 'akaingia' ni wazi na cha kawaida bila kuongeza maelezo yasiyosemwa.
- source_word: וַתִּשְׁכַּב אֶת
  choice: akalala na
  rationale: Huu ni usemi wa staha unaomaanisha kujamiiana; 'kulala na' huhifadhi staha na maana ya chanzo.
- source_word: וְלֹא יָדַע
  choice: hakujua
  rationale: ידע hapa humaanisha kutotambua au kutokuwa na ufahamu wa kilichotokea; 'hakujua' ni karibu na muundo wa chanzo.
- source_word: בְּשִׁכְבָהּ
  choice: wakati binti yake alipolala
  rationale: Infinitivu yenye kiambishi inaonyesha wakati wa tendo. Kutaja 'binti yake' huondoa utata wa kiwakilishi kwa Kiswahili bila kuongeza 'naye,' jambo ambalo chanzo halirudii waziwazi katika kishazi hiki.
- source_word: וּבְקוּמָהּ
  choice: wala alipoondoka
  rationale: קוּם kimsingi ni kuinuka; hapa, katika mfuatano wa kuingia na kulala, 'kuondoka' huwasilisha kwa kawaida mwisho wa tukio. Maana halisi zaidi imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Usemi wa staha 'akalala na' umehifadhiwa badala ya lugha ya wazi zaidi. Kiunganishi 'Naye' kinadumisha mtiririko wa simulizi, na tanbihi inalinda muundo na maana ya karibu zaidi ya vifungu vya mwisho vya Kiebrania.
