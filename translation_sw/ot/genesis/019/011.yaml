base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: sw
  text: Nao wakawapiga kwa upofu[a] wanaume waliokuwa mlangoni mwa nyumba, kuanzia mdogo hadi mkubwa; wakajichosha wakijaribu kuupata mlango.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupofushwa kwa mng'ao” au “kuchanganyikiwa kwa kuona”; neno hili adimu la Kiebrania huenda likamaanisha zaidi ya upofu wa kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: wakawapiga
  rationale: Kauli ya Hiphil ya נכה kwa kawaida humaanisha kupiga au kupatwa kwa pigo; hapa “wakawapiga kwa upofu” ni Kiswahili cha asili kinachoonyesha kusababishwa kwa hali hiyo.
- source_word: הָאֲנָשִׁים
  choice: wale wanaume
  rationale: Nomino hii ni wingi wa kiume na katika muktadha inawahusu wanaume waliokuwa nje ya nyumba ya Loti.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: waliokuwa kwenye mwingilio wa nyumba
  rationale: Kirai hiki kinawatambulisha kwa mahali walipokuwa; “mwingilio wa nyumba” huhifadhi maana pana ya פֶּתַח kwa Kiswahili cha sasa.
- source_word: בַּסַּנְוֵרִים
  choice: kwa upofu
  rationale: סַנְוֵרִים ni neno adimu linaloeleza kushindwa kuona sawasawa kulikosababishwa kwa njia isiyo ya kawaida. “Upofu” ndio tafsiri kuu iliyo wazi zaidi, huku uwezekano wa kupofushwa kwa mng'ao au kuchanganyikiwa kwa kuona ukihifadhiwa katika tanbihi.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: wadogo kwa wakubwa
  rationale: Hii ni nahau jumuishi inayomaanisha kundi lote bila kubainisha lazima umri au hadhi; muundo huu wa Kiswahili huhifadhi wigo huo na sintofahamu yake.
- source_word: וַיִּלְאוּ
  choice: wakajichosha
  rationale: לָאָה huonyesha kuchoka au kuishiwa nguvu; “wakajichosha” huwasilisha matokeo ya juhudi yao isiyofanikiwa.
- source_word: לִמְצֹא
  choice: wakijaribu kuupata
  rationale: Kauli hii inaonyesha lengo la juhudi zao; “wakijaribu” huweka wazi kwamba walitafuta bila mafanikio bila kuongeza wazo lisilokuwapo katika muktadha.
- source_word: הַפָּתַח
  choice: mlango
  rationale: פֶּתַח inaweza kuwa uwazi, mwingilio, au nafasi ya mlango. “Mlango” ni neno la kawaida na la asili hapa kwa mahali walipokuwa wakijaribu kupata.
theological_decisions:
- issue: Asili ya hali inayotajwa na סַנְוֵרִים
  choice: upofu uliowapata kwa tendo la hao wageni
  alternative: hali ya kupofushwa kwa mng'ao au kuchanganyikiwa kwa kuona
  rationale: Simulizi linaonyesha kwa wazi tatizo lisilo la kawaida la kuona lililowazuia kupata mlango, lakini neno la Kiebrania ni adimu na huenda likamaanisha zaidi ya upofu wa kawaida. Tafsiri kuu ni wazi, huku tanbihi ikihifadhi uwezekano huo wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “wadogo kwa wakubwa” umehifadhi usemi jumuishi wa Kiebrania bila kuufanya mahsusi kuwa wa umri au hadhi; tanbihi imehifadhi maana pana ya neno adimu la tatizo la kuona.
