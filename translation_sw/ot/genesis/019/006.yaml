  text: Loti akatoka akawaendea penye ingilio[a], akaufunga mlango nyuma yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka mlangoni.” Kiebrania hutofautisha ingilio au uwazi (פֶּתַח) na mlango wenyewe (דֶּלֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi cha mfululizo wa simulizi kutoka יצא kinaendeleza tukio kwa tendo rahisi la wakati uliopita; “akatoka” ni la kawaida na huhifadhi wazo la kutoka nje.
- source_word: אֲלֵהֶם
  choice: kwenda kwao
  rationale: אֶל pamoja na kiambishi cha nafsi ya tatu wingi huonyesha mwendo kuelekea kwa watu waliokuwa nje; “kwenda kwao” huonyesha mwelekeo huo kwa Kiswahili cha kawaida.
- source_word: לוֹט
  choice: Loti
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: הַפֶּתְחָה
  choice: penye mwingilio
  rationale: פֶּתַח ni uwazi au mwingilio, na he ya mwelekeo huonyesha kusogea kuelekea hapo. “Penye mwingilio” hutofautisha sehemu hiyo na mlango wenyewe unaotajwa baadaye.
- source_word: וְהַדֶּלֶת
  choice: mlango
  rationale: דֶּלֶת hapa ni mlango wenyewe, tofauti na פֶּתַח, yaani uwazi au mwingilio.
- source_word: סָגַר
  choice: akaufunga
  rationale: סגר humaanisha kufunga; “akaufunga mlango” ni usemi wa kawaida, wazi na wenye uhai katika simulizi.
- source_word: אַחֲרָיו
  choice: nyuma yake
  rationale: 'Maana hapa ni ya mahali: Loti alipotoka nje, aliufunga mlango akiwa ameupita, hivyo mlango ukawa nyuma yake.'
