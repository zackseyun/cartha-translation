translation:
  language: sw
  text: Lakini Loti akawaambia, “La, tafadhali, mabwana zangu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana wangu.” Umbo la Kiebrania אֲדֹנָי linaweza kueleweka katika baadhi ya usomaji kama namna ya heshima ya kumwita mmoja; hata hivyo, muktadha wa wingi (“akawaambia”) unaunga mkono “mabwana zangu” hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi, lakini hapa jibu la Loti linapinga agizo lililotangulia; kwa hiyo “Lakini” linaonyesha uhusiano wa kimuktadha. Kitenzi pamoja na אֲלֵהֶם kimetafsiriwa kwa Kiswahili cha kawaida kuwa “akawaambia.”
- source_word: לוֹט
  choice: Loti
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: אֲלֵהֶם
  choice: -wa- (akawaambia)
  rationale: Kihusishi אֶל chenye kiambishi cha nafsi ya tatu wingi humaanisha “kwao”; katika Kiswahili maana hiyo hujitokeza kiasili ndani ya kitenzi “akawaambia,” bila kuwataja wazi kuwa watu au malaika.
- source_word: אַל
  choice: La
  rationale: Ingawa אַל kwa kawaida ni neno la kukataza, katika ombi hili lisilo na kitenzi linakataa pendekezo lililotangulia. “La” ni jibu la heshima na lenye nguvu linalofaa katika muktadha huu.
- source_word: נָא
  choice: tafadhali
  rationale: Neno hili huonyesha ombi au unyenyekevu; “tafadhali” linawasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: אֲדֹנָי
  choice: mabwana zangu
  rationale: Muktadha wa wingi katika “kwao” unaunga mkono kuwa Loti anawahutubia wageni wawili. “Mabwana zangu” linahifadhi wingi na maana ya heshima ya אֲדוֹן.
theological_decisions:
- issue: Ikiwa אֲדֹנָי hapa ni cheo cha Mungu katika umoja (“Bwana wangu”) au ni namna ya kuwahutubia wageni/malaika wengi (“mabwana zangu”)
  choice: 'Wingi unaowahusu wageni/malaika: “mabwana zangu”'
  alternative: “Bwana wangu”
  rationale: Kiwakilishi cha wingi katika אֲלֵהֶם (“kwao”) na wageni wawili katika muktadha wa karibu vinaunga mkono usemi wa wingi. Hata hivyo, kwa kuwa umbo אֲדֹנָי linaweza kueleweka katika baadhi ya usomaji kuwa usemi wa heshima wa umoja au cheo cha Mungu, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “La, tafadhali” linaonyesha upinzani wa Loti pamoja na ombi lake la heshima; “mabwana zangu” linadumisha wingi wa muktadha bila kufafanua kimadhehebu utambulisho wa waliohutubiwa.
