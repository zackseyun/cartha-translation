base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: sw
  text: Yule mdogo pia akazaa mwana, akamwita Ben-Ami[a]. Yeye ndiye baba wa Waamoni[b] hata leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ben-Ami huenda humaanisha “mwana wa watu wangu” au “mwana wa jamaa yangu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wana wa Amoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: Yule mdogo
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino na katika muktadha kinamrejelea binti mdogo wa Loti; “yule mdogo” ni ya asili na huhifadhi ulinganisho.
- source_word: גַם הִוא
  choice: pia
  rationale: Huonyesha kwamba binti mdogo naye alifanya kama mkubwa; “pia” huwasilisha maana hiyo kwa ufupi na kwa ufasaha.
- source_word: יָלְדָה בֵּן
  choice: akazaa mwana
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya Kiswahili kwa simulizi la kuzaliwa.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: akamwita jina lake
  rationale: Huhifadhi kwa kiasi kikubwa fomula ya Kiebrania ya kuita jina, badala ya kuirahisisha kabisa kuwa “akamwita.”
- source_word: בֶּן עַמִּי
  choice: Ben-Ami
  rationale: Jina la mtu limetoholewa, huku maana yake muhimu kwa simulizi ikielezwa katika tanbihi.
- source_word: הוּא אֲבִי
  choice: Yeye ndiye baba
  rationale: Hutoa kwa uwazi kishazi kisicho na kitenzi na huhifadhi taswira ya ukoo; hapa “baba” ina maana ya babu au mwanzilishi wa taifa.
- source_word: בְנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ingawa kihalisi ni “wana wa Amoni,” jina la kawaida la kundi hilo katika Kiswahili ni “Waamoni”; umbo halisi limehifadhiwa katika tanbihi.
- source_word: עַד הַיּוֹם
  choice: hata leo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuendelea kwa hali hiyo mpaka wakati wa msimuliaji.
