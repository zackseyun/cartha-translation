  yaml_path: translation/ot/genesis/019/036.yaml
  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: sw
  text: Basi, binti wote wawili wa Loti wakapata mimba kwa baba yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana halisi: “kutoka kwa baba yao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: wakapata mimba
  rationale: Kitenzi הרה katika umbo la wingi wa kike kinaonyesha kuwa binti hao walipata kuwa wajawazito. “Wakapata mimba” ni Kiswahili cha kawaida, wazi, na cha sasa.
- source_word: שְׁתֵּי
  choice: wote wawili
  rationale: Namba hii inaonyesha kwamba binti hao wawili kwa pamoja ndio wanaozungumziwa; “wote wawili” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: בְנוֹת לוֹט
  choice: binti ... wa Loti
  rationale: Muundo wa Kiebrania unaonyesha uhusiano wa binti hao na Loti; Kiswahili hutumia kwa kawaida “binti wa Loti.”
- source_word: מֵאֲבִיהֶן
  choice: kwa baba yao
  rationale: Kihusishi מִן hapa huonyesha chanzo au ubaba wa mimba. “Kwa baba yao” ni usemi mfupi na wa asili unaowasilisha kwamba baba yao ndiye aliyewapa mimba, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya muundo wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Lugha ni ya kawaida, yenye staha na inayoeleweka katika Kiswahili Sanifu cha Afrika Mashariki. “Basi” huendeleza mtiririko wa simulizi wa וַ־, na sentensi haisitiri wala kupanua maana ya uhusiano wa kifamilia uliomo katika Kiebrania.
