base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: sw
  text: Basi Loti akatoka, akazungumza na wana-wakwe zake[a], waliokuwa karibu kuwaoa binti zake, akawaambia, “Inukeni, tokeni mahali hapa, kwa sababu Yahweh yu karibu kuuangamiza mji.” Lakini wana-wakwe zake waliona kana kwamba alikuwa akifanya mzaha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana-wakwe zake waliokuwa wamewaoa binti zake”; maneno ya Kiebrania yanaweza kumaanisha wanaume waliokuwa tayari wamewaoa binti za Loti au wale waliokuwa karibu kuwaoa.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “akawa kama mtu anayefanya mzaha machoni pa wana-wakwe zake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו
  choice: wana-wakwe zake
  rationale: Neno חָתָן linaweza kumaanisha mkwe wa kiume au bwana-arusi. ‘Wana-wakwe zake’ ni Kiswahili cha kawaida kinachoonyesha uhusiano wao na Loti bila kuondoa utata wa hali ya ndoa.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: waliokuwa karibu kuwaoa binti zake
  rationale: Kirai hiki kihalisi kinawahusu ‘waliokuwa wakiwachukua binti zake’ katika ndoa. Muktadha unaunga mkono ndoa iliyokusudiwa au iliyokuwa karibu kufungwa, lakini tanbihi inahifadhi uwezekano wa kuwa tayari walikuwa wamewaoa.
- source_word: קוּמוּ צְּאוּ
  choice: Inukeni, tokeni
  rationale: Vitenzi viwili vya amri vinatunza msisitizo, mpangilio na uharaka wa Kiebrania kwa Kiswahili cha sasa.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Pamoja na ‘tokeni,’ kifungu hiki ni cha kawaida na kinahifadhi maana ya kuondoka katika eneo hilo maalumu.
- source_word: מַשְׁחִית
  choice: yu karibu kuuangamiza
  rationale: Hali ya kushiriki ya Kiebrania inaonyesha tendo linalokaribia kutokea katika muktadha huu, si lazima uharibifu ambao tayari umeanza.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kwa namna ya kawaida katika tahajia ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הָעִיר
  choice: mji
  rationale: Nomino yenye uamilifu wa kujulikana inarejelea mji unaozungumziwa tayari; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: כִּמְצַחֵק
  choice: kana kwamba alikuwa akifanya mzaha
  rationale: Tafsiri hii inaonyesha kuwa wana-wakwe walimwona Loti kama mtu asiyezungumza kwa uzito, bila kuifanya maana kuwa dhihaka kwa lazima.
- source_word: בְּעֵינֵי חֲתָנָיו
  choice: wana-wakwe zake waliona
  rationale: Nahau ya Kiebrania ‘machoni pa’ imetolewa kwa Kiswahili cha asili kama mtazamo au hukumu yao.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tahajia ikifuatisha matumizi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Amri fupi zinahifadhi uharaka wa tukio, na tanbihi zinatunza utata halisi kuhusu hali ya ndoa na nahau ya Kiebrania.
