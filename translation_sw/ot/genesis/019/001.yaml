  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: sw
  text: Malaika hao wawili walifika Sodoma jioni. Loti alikuwa ameketi kwenye lango la Sodoma.[a] Loti alipowaona, alisimama kwenda kuwalaki, kisha akainama kifudifudi hadi ardhini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lango la Sodoma” hapa ni eneo la lango la mji, mahali pa wazi palipotumiwa pia kwa shughuli za jamii na za utawala.
    reason: cultural_note
  - marker: b
    text: Au, “akajilaza kifudifudi, uso wake ukielekea ardhini.” Kiebrania kinaeleza tendo kamili la kuinama sana mbele yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: walifika
  rationale: Kitenzi בוא hapa kinasimulia kuwasili mahali; “walifika” ni cha kawaida katika masimulizi ya Kiswahili na kinaendana na kiambishi cha mwelekeo katika סְדֹמָה.
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: malaika hao wawili
  rationale: Ingawa מַלְאָךְ inaweza kumaanisha mjumbe, muktadha wa simulizi lililotangulia unawatambulisha hawa kuwa wajumbe wa mbinguni; “hao” pia huunganisha kwa kawaida na wageni waliotangulia kutajwa.
- source_word: סְדֹמָה
  choice: Sodoma
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwamba walikwenda Sodoma; pamoja na “walifika,” jina la mahali halihitaji kihusishi kingine katika Kiswahili.
- source_word: בָּעֶרֶב
  choice: jioni
  rationale: Hiki ni kishazi cha wakati wa kuwasili; “jioni” ni usemi wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: יֹשֵׁב
  choice: alikuwa ameketi
  rationale: Hali ya kitenzi kishirikishi inaweka mandhari ya tendo lililokuwa linaendelea; “alikuwa ameketi” huhifadhi hali hiyo ya nyuma ya simulizi.
- source_word: בְּשַׁעַר סְדֹם
  choice: kwenye lango la Sodoma
  rationale: “Kwenye lango” ni Kiswahili cha kawaida na kinaweza kurejelea eneo lote la lango la mji, si tundu la kuingilia pekee; tanbihi inaeleza maana ya kitamaduni.
- source_word: וַיַּרְא לוֹט
  choice: Loti alipowaona
  rationale: Yambwa la kuona linaeleweka kutokana na muktadha. “Alipowaona” huonyesha kwa ufasaha ufuatano wa kumwona na kisha kuinuka bila kuongeza dai jipya.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: alisimama kwenda kuwalaki
  rationale: Muundo huu unaunganisha kuinuka na kwenda kuwapokea wanaokuja; “kuwalaki” huwasilisha tendo la kwenda kukutana nao kwa ukarimu.
- source_word: וַיִּשְׁתַּחוּ
  choice: akainama kifudifudi
  rationale: Kitenzi kinaweza kueleza kusujudu katika ibada au kuinama kwa heshima. Hapa usemi huu unaonyesha heshima kubwa bila kuamua kwamba Loti aliwaabudu.
- source_word: אַפַּיִם אָרְצָה
  choice: kifudifudi hadi ardhini
  rationale: Nahau hii inaeleza kuinama sana, uso ukielekea ardhini. Tafsiri hii ni ya asili katika Kiswahili na inahifadhi uzito wa tendo bila kudai wazi kwamba uso uligusa ardhi.
theological_decisions:
- issue: Iwapo וַיִּשְׁתַּחוּ ielezwe kuwa ibada au kuinama kwa heshima
  choice: kuinama kwa heshima (“akainama kifudifudi”)
  alternative: “akasujudu” au “aliwaabudu”
  rationale: שׁחה inaweza kutumiwa kwa ibada kwa Mungu au kwa kuinama mbele ya wanadamu na malaika. Muktadha unaonyesha mapokezi ya wageni wenye hadhi, lakini aya yenyewe haisemi kwa lazima kwamba Loti aliwaabudu; hivyo tafsiri haiongezi dai hilo la kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na hadhi inayofaa maandiko. “Kuwalaki” ni neno sanifu linaloeleweka kwa mapokezi ya wageni; “kifudifudi” huepuka kuingiza maana ya ibada isiyolazimishwa na muktadha. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyoelezwa.
