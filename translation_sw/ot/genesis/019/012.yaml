  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: sw
  text: Kisha wale wanaume wakamwambia Loti, “Je, una mtu mwingine hapa? Mkwe wako[a], wanao, binti zako, na wote walio wako katika mji[b]—watoe mahali hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bwana-arusi wako”; hapa yaelekea zaidi kuwa mkwe, yaani mwanamume aliyeoa au anayetarajiwa kumwoa binti ya Loti.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “na vyote vilivyo vyako katika mji”; katika muktadha, yaelekea kuwa watu wote wa familia au nyumba ya Loti waliokuwa mjini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: wale wanaume
  rationale: Nomino ya Kiebrania humaanisha kwa kawaida ‘wanaume.’ Ingawa muktadha mpana unawatambulisha kuwa malaika, mstari huu wenyewe unawaita wanaume.
- source_word: עֹד מִי לְךָ פֹה
  choice: Je, una mtu mwingine hapa?
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuuliza kama bado kuna mtu mwingine aliye na uhusiano na Loti mahali hapo.
- source_word: חָתָן
  choice: mkwe wako
  rationale: Katika muktadha huu neno linaelekea kumaanisha mwanamume aliyeoa au anayetarajiwa kumwoa binti ya Loti. ‘Mkwe wako’ ni ya asili katika Kiswahili na haibani hali kuwa ndoa tayari imefungwa.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: wanao, binti zako
  rationale: Tafsiri ya moja kwa moja ya majina ya ukoo yenye viambishi vya umilikaji; ‘wanao’ hapa ina maana ya wana wa kiume, ikitofautishwa na ‘binti zako.’
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: na wote walio wako katika mji
  rationale: Muktadha unahusu watu wanaopaswa kuondolewa mjini. Kauli hii huhifadhi maana ya uhusiano au kuwa chini ya nyumba ya Loti bila kuifanya mali isiyo hai.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: watoe mahali hapa
  rationale: Amri ya umoja inaelekezwa kwa Loti, na kiambishi ‘wa-’ kinarejelea watu waliotajwa. ‘Mahali hapa’ ni Kiswahili cha kawaida kwa mahali panapozungumziwa.
theological_decisions:
- issue: Kama הָאֲנָשִׁים watambulishwe kuwa malaika katika matini kuu
  choice: wale wanaume
  alternative: wale malaika / wale wajumbe
  rationale: Ingawa simulizi linadhihirisha utambulisho wao wa kimalaika, mstari huu unatumia neno la kawaida la Kiebrania linalomaanisha wanaume; tafsiri haiongezi utambulisho wa kitheolojia usiotajwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku ukihifadhi neno ‘wanaume’ na upana wa uhusiano katika ‘walio wako.’
