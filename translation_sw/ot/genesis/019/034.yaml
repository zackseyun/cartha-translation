- from: Ikawa siku iliyofuata, mzaliwa wa kwanza akamwambia mdogo wake, “Tazama, usiku uliopita nililala na baba yangu. Tumpe mvinyo anywe usiku huu pia; kisha uingie ulale naye, ili tumhifadhie baba yetu uzao.”
  to: Ikawa siku iliyofuata, binti mzaliwa wa kwanza akamwambia binti mdogo, “Tazama, usiku uliopita nililala na baba yangu. Tumpe divai anywe usiku huu pia; kisha njoo, ulale naye, ili tuendeleze uzao kupitia baba yetu.”
  rationale: Marekebisho huondoa tendo lililoongezwa la “kuingia,” hurekebisha uhusiano wa “uzao” na baba yao ili ulingane na מֵאָבִינוּ, na hufanya jinsia ya binti wote wawili iwe wazi. Maana ya simulizi na euphemism ya matini ya Kiebrania vimehifadhiwa.
