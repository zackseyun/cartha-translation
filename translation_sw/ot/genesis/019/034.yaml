  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/תֹּ֤אמֶר הַ/בְּכִירָה֙ אֶל הַ/צְּעִירָ֔ה הֵן שָׁכַ֥בְתִּי אֶ֖מֶשׁ אֶת אָבִ֑/י נַשְׁקֶ֨/נּוּ יַ֜יִן גַּם הַ/לַּ֗יְלָה וּ/בֹ֨אִי֙ שִׁכְבִ֣י עִמּ֔/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: sw
  text: Ikawa siku iliyofuata, binti mzaliwa wa kwanza akamwambia binti mdogo, “Tazama, usiku uliopita nililala na baba yangu. Tumpe divai anywe usiku huu pia; kisha njoo, ulale naye, ili tuendeleze uzao kupitia baba yetu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Ikawa siku iliyofuata
  rationale: Inahifadhi utangulizi wa kisimulizi wa Kiebrania kwa Kiswahili cha asili na chenye hadhi.
- source_word: הַבְּכִירָה ... הַצְּעִירָה
  choice: mzaliwa wa kwanza ... mdogo wake
  rationale: “Mzaliwa wa kwanza” huhifadhi msisitizo wa mpangilio wa kuzaliwa; “mdogo wake” ni usemi wa kawaida unaoonyesha uhusiano wao.
- source_word: הֵן
  choice: Tazama
  rationale: Ni neno la kuvuta fikira, lenye hadhi na linaloeleweka katika Kiswahili cha sasa.
- source_word: שָׁכַבְתִּי אֶת־אָבִי / שִׁכְבִי עִמּוֹ
  choice: nililala na baba yangu / ulale naye
  rationale: Inahifadhi sitiari ya kingono ya Kiebrania bila kuifanya kuwa ya kitabibu au kuificha kabisa.
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: Tumpe mvinyo anywe
  rationale: 'Inaonyesha wazi maana sababishi ya kitenzi: kumpa mvinyo ili anywe.'
- source_word: גַּם הַלַּיְלָה
  choice: usiku huu pia
  rationale: Inahifadhi wakati unaorejelewa pamoja na wazo la kurudia lililo katika גַּם.
- source_word: וּבֹאִי
  choice: kisha uingie
  rationale: Katika muktadha, kitenzi cha kuja kinaelekeza kuingia mahali baba alipokuwa; “kisha” huonyesha mfuatano wa matendo.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: ili tumhifadhie baba yetu uzao
  rationale: Piel ya חיה ina maana ya kuhifadhi au kudumisha hai; זרע hapa ni uzao. Muundo huu unaonyesha lengo la kuendeleza uzao unaotokana na baba yao.
theological_decisions:
- issue: Je, simulizi linahalalisha kitendo hicho?
  choice: Tafsiri imesimulia maneno bila kuongeza hukumu wala uhalalishaji.
  alternative: Kuongeza maneno yanayoonyesha wazi lawama au idhini.
  rationale: Kiebrania katika mstari huu kinaripoti mpango wa binti mkubwa bila kutoa tathmini ya moja kwa moja; tafsiri inapaswa kuhifadhi hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisimulizi, cha sasa na chenye hadhi. Sitiari ya kingono imehifadhiwa kwa “kulala na,” ambayo inaeleweka katika muktadha bila lugha ya kitabibu.
