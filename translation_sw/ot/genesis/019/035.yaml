base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: sw
  text: Usiku huo pia wakampa baba yao divai anywe. Binti yule mdogo akaamka, akalala naye; lakini baba yao hakujua binti huyo alipolala wala alipoamka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa namna iliyo karibu zaidi na muundo wa Kiebrania, “hakujua kuhusu kulala kwa binti huyo wala kuamka kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: wakampa ... anywe
  rationale: Hifili ya שׁקה ina maana ya kumpa au kumnywesha mtu. Kauli hii inahifadhi maana ya kusababisha anywe bila kuongeza moja kwa moja dai kwamba walimlevya.
- source_word: גַּם
  choice: pia
  rationale: Inaonyesha kuwa tendo la usiku uliotangulia lilirudiwa katika usiku huu.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku huo
  rationale: Hii ni namna ya kawaida na ya moja kwa moja ya kueleza wakati katika Kiswahili.
- source_word: אֶת אֲבִיהֶן יָיִן
  choice: baba yao divai
  rationale: Muundo wa Kiswahili “wakampa baba yao divai anywe” unaonyesha kwamba baba ndiye aliyenyweshwa na divai ndiyo aliyopewa.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: Yule binti mdogo akaamka
  rationale: הַצְּעִירָה ni yule wa kike aliye mdogo. Kutaja “binti” kunafanya rejeo liwe wazi, na “akaamka” ni simulizi la kawaida kwa kuinuka kutoka usingizini au mahali pa kulala.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: akalala naye
  rationale: Ni nahau ya Kiswahili inayoeleweka kwa uhusiano wa kingono katika muktadha huu, huku ikibaki karibu na nahau ya Kiebrania.
- source_word: וְלֹא יָדַע
  choice: hakujua
  rationale: ידע hapa inahusu kutotambua au kutokuwa na ufahamu; “hakujua” huhifadhi usemi wa chanzo bila kuufafanua kupita kiasi.
- source_word: בְּשִׁכְבָהּ
  choice: alipolala
  rationale: ב pamoja na umbo la kitenzi-jina na kiambishi cha kike ina kazi ya wakati hapa. “Alipolala” ni ya kawaida na huhifadhi rejeo kwa binti.
- source_word: וּבְקֻמָהּ
  choice: alipoamka
  rationale: Kauli hii inalingana na iliyotangulia na huonyesha wakati binti alipoinuka baada ya kulala.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa mfululizo wa simulizi umehifadhiwa kwa vitenzi vya “aka-”. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua, badala ya baada ya “usiku huo” kama ilivyoonekana katika safu ya ushauri ya Kiingereza.
