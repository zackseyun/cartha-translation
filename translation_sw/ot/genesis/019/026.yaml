base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: sw
  text: Lakini mke wake, akiwa nyuma yake, akatazama nyuma[a], akawa nguzo ya chumvi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatazama kutoka nyuma yake.” Kiebrania kinasema kihalisi kwamba alitazama “kutoka nyuma yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: akatazama nyuma
  rationale: Kitenzi נבט humaanisha ‘kutazama’ au ‘kuangalia.’ Katika muktadha huu, pamoja na מֵאַחֲרָיו, ‘akatazama nyuma’ ni Kiswahili cha kawaida kinachoonyesha tendo bila kuongeza nia yake.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume humaanisha moja kwa moja ‘mke wake,’ yaani mke wa Loti katika muktadha.
- source_word: מֵאַחֲרָיו
  choice: akiwa nyuma yake
  rationale: Kiebrania kinasema kihalisi ‘kutoka nyuma yake.’ Tafsiri hii inaonyesha mahali mke huyo alipokuwa kuhusiana na Loti, huku ‘akatazama nyuma’ ikitoa tendo hilo kwa Kiswahili cha asili.
- source_word: וַתְּהִי
  choice: akawa
  rationale: Katika mfululizo huu wa masimulizi, היה inaonyesha kuingia katika hali mpya; ‘akawa’ huhifadhi dai la mabadiliko kwa ufupi na kwa kawaida.
- source_word: נְצִיב
  choice: nguzo
  rationale: נְצִיב huonyesha kitu kilichosimamishwa au kilichosimama; katika muktadha huu ‘nguzo’ ndiyo tafsiri iliyo wazi na ya kawaida.
- source_word: מֶלַח
  choice: ya chumvi
  rationale: Muundo wa סמיכות kati ya נְצִיב na מֶלַח hutafsiriwa kwa kawaida ‘nguzo ya chumvi.’
theological_decisions:
- issue: Hali ya mabadiliko ya mke wa Loti
  choice: akawa nguzo ya chumvi
  alternative: akawa kama nguzo ya chumvi
  rationale: Kiebrania hakina alama ya tashbihi. Tafsiri inatoa dai la simulizi moja kwa moja bila kulilegeza kuwa mlinganisho wala kuongeza ufafanuzi wa kitheolojia.
- issue: Uhusiano wa kishazi מֵאַחֲרָיו na tendo la kutazama
  choice: akiwa nyuma yake, akatazama nyuma
  alternative: akatazama kutoka nyuma yake
  rationale: Kiebrania kinaweza kusikika kama kinataja mahali alipokuwa au mwelekeo wa kutazama. Matini kuu inahifadhi habari zote mbili kwa Kiswahili cha kawaida, na tanbihi inaonyesha umbo la karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘akiwa nyuma yake’ huepuka uradidi usio wa kawaida wa ‘nyuma’ bila kuficha utata wa Kiebrania; utata huo umeonyeshwa katika tanbihi.
