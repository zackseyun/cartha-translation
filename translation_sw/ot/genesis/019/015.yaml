  text: וּ/כְמוֹ֙ הַ/שַּׁ֣חַר עָלָ֔ה וַ/יָּאִ֥יצוּ הַ/מַּלְאָכִ֖ים בְּ/ל֣וֹט לֵ/אמֹ֑ר קוּם֩ קַ֨ח אֶֽת אִשְׁתְּ/ךָ֜ וְ/אֶת שְׁתֵּ֤י בְנֹתֶ֨י/ךָ֙ הַ/נִּמְצָאֹ֔ת פֶּן תִּסָּפֶ֖ה בַּ/עֲוֺ֥ן הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: sw
  text: Kulipopambazuka, malaika wakamhimiza Loti, wakisema, “Inuka, mchukue mke wako na binti zako wawili waliopo hapa, usije ukaangamizwa katika adhabu[a] ya mji huu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uovu wa mji huu” au “hatia ya mji huu.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, au adhabu inayotokana na hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: Kulipopambazuka
  rationale: Kifungu hiki kinawasilisha kwa Kiswahili cha kawaida hali ya mapambazuko kuwa yameanza, huku kikihifadhi maana ya wakati ya maandishi ya Kiebrania.
- source_word: וַיָּאִיצוּ
  choice: wakamhimiza
  rationale: Kitenzi hiki kinaonyesha kumsisitiza mtu achukue hatua haraka; “wakamhimiza” ni cha asili na kinafaa kwa hatari iliyokuwa karibu.
- source_word: הַמַּלְאָכִים
  choice: malaika
  rationale: Ingawa nomino ya Kiebrania inaweza kumaanisha wajumbe kwa upana, katika muktadha huu ni wajumbe wa mbinguni.
- source_word: קוּם קַח
  choice: Inuka, mchukue
  rationale: Amri zote mbili zimehifadhiwa, pamoja na uharaka wake.
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת
  choice: mke wako na binti zako wawili waliopo hapa
  rationale: “Waliopo hapa” hutoa maana ya kishirikishi “waliopatikana/waliopo” kwa Kiswahili cha kawaida na kuwatofautisha na wengine waliotajwa katika muktadha.
- source_word: פֶּן תִּסָּפֶה
  choice: usije ukaangamizwa
  rationale: Muundo huu unaonyesha onyo la uwezekano wa kuangamia pamoja na wengine katika hukumu inayokuja.
- source_word: בַּעֲוֺן הָעִיר
  choice: katika adhabu ya mji huu
  rationale: Katika muktadha wa hukumu, עָוֹן inaweza kutaja matokeo au adhabu ya hatia. Tafsiri hii inaeleza hatari iliyomkabili Loti, huku maana nyingine halali zikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya עָוֹן katika muktadha wa hukumu
  choice: adhabu ya mji huu
  alternative: uovu wa mji huu; hatia ya mji huu
  rationale: Neno la Kiebrania linaweza kumaanisha uovu, hatia, au adhabu inayotokana na hatia. Muktadha wa kuangamizwa kwa Sodoma unaunga mkono “adhabu,” lakini tanbihi inahifadhi utata halisi wa neno hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Inuka” na “usije ukaangamizwa” huhifadhi uzito na uharaka wa onyo bila kutumia lugha ya kizamani kupita kiasi.
