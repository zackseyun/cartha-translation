base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: sw
  text: Kwa maana tuko karibu kuangamiza mahali hapa, kwa sababu kilio chao[a] kimekuwa kikubwa mbele za Yahwe, naye Yahwe ametutuma kuangamiza mahali hapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilio dhidi yao kimekuwa kikubwa mbele za Yahwe.” Muundo wa Kiebrania unaweza kutafsiriwa moja kwa moja kuwa “kilio chao,” lakini katika muktadha wengi huuelewa kuwa kilio kilichotolewa dhidi ya watu wa mahali hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: tuko karibu kuangamiza
  rationale: Hii ni kauli ya Hifili katika umbo la kitenzi-jina cha wingi, ambayo hapa inaonyesha tendo lililo karibu kutokea. Usemi huu wa Kiswahili unaonyesha hukumu inayokaribia bila kuifanya kuwa wakati ujao wa kawaida tu.
- source_word: הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Huhifadhi maana ya kawaida ya מָקוֹם na nguvu ya kiashiria הַזֶּה kwa Kiswahili cha asili.
- source_word: גָדְלָה
  choice: kimekuwa kikubwa
  rationale: Kauli timilifu ya גדל inaonyesha ongezeko lililofikia hali yake ya sasa; tafsiri hii huhifadhi maana hiyo ya matokeo.
- source_word: צַעֲקָתָם
  choice: kilio chao
  rationale: צְעָקָה ni kilio cha dhiki au malalamiko makali, na kiambishi cha nafsi ya tatu wingi humaanisha moja kwa moja ‘chao.’ Maana ya kimuktadha ya kilio dhidi yao imehifadhiwa katika tanbihi.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huu ni usemi wa kawaida na wenye hadhi katika Kiswahili kwa maana ya kuwa mbele au katika uwepo wa Mungu, bila kufuata kihalisi ‘uso wa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: ametutuma
  rationale: Wakati timilifu wa Kiswahili huunganisha tendo la kutumwa lililokamilika na utume wao unaoendelea wakati wa kusema.
- source_word: לְשַׁחֲתָהּ
  choice: kupaangamiza
  rationale: Kiambishi ‘pa’ kinarejelea kwa kawaida ‘mahali hapa,’ huku ‘angamiza’ ikidumisha mzizi uleule wa maana uliotumiwa mwanzoni mwa mstari.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya צַעֲקָתָם
  choice: kilio chao
  alternative: kilio dhidi yao
  rationale: Kiambishi cha Kiebrania kwa muundo wake wa moja kwa moja ni ‘chao,’ lakini muktadha unaweza kumaanisha kilio kilichotolewa dhidi ya watu wa mahali hapo. Utata huo haujaamuliwa kimya kimya; maana mbadala imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tuko karibu kuangamiza’ huwasilisha ukaribu wa tendo, na ‘kupaangamiza’ ni marejeo ya kawaida kwa ‘mahali hapa.’ Tanbihi imewekwa mara tu baada ya ‘kilio chao,’ ambako utata wa tafsiri unatokea.
