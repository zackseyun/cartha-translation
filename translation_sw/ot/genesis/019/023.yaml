  text: הַ/שֶּׁ֖מֶשׁ יָצָ֣א עַל הָ/אָ֑רֶץ וְ/ל֖וֹט בָּ֥א צֹֽעֲרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: sw
  text: Jua lilikuwa limechomoza juu ya nchi[a], naye Loti alikuwa amefika Soari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dunia.”
    reason: lexical_alternative
  - marker: b
    text: Au “Jua lilichomoza juu ya nchi, naye Loti akafika Soari.” Vitenzi vya Kiebrania vinaweza pia kutafsiriwa kwa wakati uliopita sahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: Jua
  rationale: Nomino yenye kibainishi; katika Kiswahili, “jua” kwa kawaida halihitaji kibainishi tofauti.
- source_word: יָצָא
  choice: lilikuwa limechomoza
  rationale: Ingawa kitenzi יָצָא kimsingi humaanisha “kutoka,” kinapotumiwa kuhusu jua humaanisha kuchomoza. Kauli ya wakati uliopita timilifu inaonyesha hali iliyokuwa tayari imetimia wakati wa tukio linalofuata.
- source_word: עַל הָאָרֶץ
  choice: juu ya nchi
  rationale: עַל ni “juu ya,” na אֶרֶץ hapa inafaa kueleweka kama eneo la simulizi, yaani “nchi”; hata hivyo, “dunia” pia inawezekana na imeonyeshwa katika tanbihi.
- source_word: וְלוֹט
  choice: naye Loti
  rationale: Kiunganishi וְ pamoja na jina la mtu kimetafsiriwa kwa mtiririko wa asili wa Kiswahili kama “naye Loti.”
- source_word: בָּא
  choice: alikuwa amefika
  rationale: בוא inaweza kumaanisha kuja, kuingia, au kufika. “Kufika” ni ya asili kwa mwendo unaolenga mahali na inaonyesha kuwa Loti alikuwa tayari amewasili.
- source_word: צֹעֲרָה
  choice: Soari
  rationale: Jina lina kiambishi cha Kiebrania kinachoonyesha mwendo kuelekea mahali; maana hiyo imebebwa na kitenzi “amefika,” hivyo hakuna haja ya kuongeza “hadi” au “kwenda.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa wakati uliopita timilifu umechaguliwa ili kuonyesha kwamba kuchomoza kwa jua na kufika kwa Loti kulikuwa kumetimia kabla ya tukio linalofuata, huku tanbihi ikihifadhi uwezekano wa wakati uliopita sahili.
