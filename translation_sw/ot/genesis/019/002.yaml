base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: sw
  text: Naye akasema, “Tafadhali, mabwana zangu[a], mgeukie nyumbani kwa mtumishi wenu, mkalale humo usiku na mkaoshe miguu yenu. Kisha mtaamka asubuhi na mapema na kuendelea na safari yenu.” Lakini wakasema, “La, bali tutalala katika uwanja wa mji[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bwana wangu,” ikiwa אֲדֹנַי linaeleweka hapa kuwa namna ya heshima katika umoja; katika muktadha huu maana ya wingi inafaa zaidi kwa sababu Loti anawahutubia wageni wawili.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania linamaanisha eneo la wazi la umma mjini, kama vile uwanja au plasa, wala si lazima barabara pekee.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: Tafadhali
  rationale: Katika muktadha huu, maneno haya yanavuta usikivu kwa heshima na kusisitiza ombi; “Tafadhali” huwasilisha kazi hiyo kwa Kiswahili cha kawaida bila kuyafanya kuwa agizo la kutazama.
- source_word: אֲדֹנַי
  choice: mabwana zangu
  rationale: Loti anawahutubia wageni wawili kwa heshima. Wingi wa vitenzi na viwakilishi katika aya unaunga mkono maana ya wingi, bila kuingiza hapa cheo cha Mungu.
- source_word: סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם
  choice: geukeni mje nyumbani mwa mtumishi wenu
  rationale: “Geukeni mje” huhifadhi wazo la kuacha njia na kuelekea nyumbani kwake, huku “mtumishi wenu” ikidumisha namna ya kujishusha kwa heshima.
- source_word: וְלִינוּ
  choice: mlaleni humo usiku
  rationale: Kitenzi kinamaanisha kukaa au kulala mahali usiku; usemi huu ni wa kawaida na unaeleweka katika muktadha wa ukarimu.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: na kuosha miguu yenu
  rationale: Tafsiri ya moja kwa moja inafaa na huhifadhi desturi ya ukarimu ya wakati huo.
- source_word: וְהִשְׁכַּמְתֶּם
  choice: mtaamka asubuhi na mapema
  rationale: Huwasilisha wazi tendo la kuamka mapema siku inayofuata bila kulifanya kuwa amri kali.
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: na kuendelea na safari yenu
  rationale: Ni Kiswahili cha asili kinachowasilisha kuondoka na kuendelea katika njia yao.
- source_word: כִּי
  choice: bali
  rationale: 'Baada ya kukataa, chembe hii ina nguvu ya utofautishaji: hawataingia nyumbani, bali watalala katika eneo la wazi.'
- source_word: בָרְחוֹב
  choice: katika uwanja wa mji
  rationale: Neno hili hapa linaelekea kumaanisha eneo la wazi la umma mjini, si barabara tu.
- source_word: נָלִין
  choice: tutalala
  rationale: Huhifadhi maana ileile ya kukaa mahali usiku kwa namna fupi na ya kawaida katika jibu lao.
theological_decisions:
- issue: Ikiwa אֲדֹנַי ni cheo cha Mungu au ni namna ya kuwaheshimu wageni
  choice: mabwana zangu
  alternative: bwana wangu
  rationale: Muktadha wa karibu unaonyesha Loti akizungumza na wageni wawili, na vitenzi pamoja na viwakilishi vya wingi vinaunga mkono anwani ya kibinadamu ya wingi. Tanbihi inadumisha uwezekano wa kisarufi wa kuichukua kama anwani ya umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Ombi la Loti limewasilishwa kwa heshima na kwa wingi; marudio ya chembe mbili za ombi katika Kiebrania yamekusanywa kwa “Tafadhali” ili kuepuka Kiswahili kisicho cha kawaida. “La, bali” huhifadhi tofauti iliyo wazi katika jibu la wageni.
