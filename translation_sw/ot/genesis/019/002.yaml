review_pass:
  verdict: revise
  source_fidelity: 'Maana kuu inafuata Kiebrania kwa usahihi: Loti anawaomba wageni wawili waingie nyumbani kwake, walale, waoshe miguu yao, waondoke mapema, nao wanakataa wakipendelea kulala katika eneo la wazi la mji. Hata hivyo, “na kuosha miguu yenu” haidumishi vizuri mfuatano wa vitenzi vya wingi vinavyowaelekeza wageni; “mkaoshe” huwakilisha vizuri zaidi wito huo wa ukarimu.'
  naturalness: “Geukeni mje nyumbani mwa mtumishi wenu” inaeleweka lakini si ya asili sana katika Kiswahili Sanifu. “Tafadhali, mabwana zangu, mgeukie nyumbani kwa mtumishi wenu” husikika kwa urahisi zaidi na huhifadhi wazo la kugeuka kutoka njiani na kuelekea nyumbani. Mfuatano “mkalale ... mkaoshe” pia ni wa kawaida zaidi kuliko infinitivu “na kuosha.”
  terminology: “Mabwana zangu” ni anwani ya heshima ya wingi inayofaa katika muktadha. “Uwanja wa mji” hutoa maana ya רְחוֹב kama eneo la wazi la umma. Tanbihi zote mbili zinahitaji tu kusafishwa kidogo katika uundaji wa Kiswahili; nanga zake zibaki mahali pale pale.
  issues:
  - severity: medium
    issue: Muundo wa kitenzi katika “Mlaleni humo usiku na kuosha miguu yenu” haulingani.
    rationale: Baada ya amri ya wingi “mlaleni,” “kuosha” ni infinitivu. Kiebrania kina mfuatano unaowaalika wageni walale na waoshe miguu yao; “mkalale humo usiku na mkaoshe miguu yenu” ni sahihi na ya asili zaidi.
  - severity: low
    issue: “Geukeni mje nyumbani mwa mtumishi wenu” ni usemi usio laini katika Kiswahili Sanifu.
    rationale: “Mgeukie nyumbani kwa mtumishi wenu” hueleza mwaliko wa kugeukia makao ya Loti kwa mtiririko wa kawaida zaidi, huku ikihifadhi unyenyekevu wa “mtumishi wenu.”
  - severity: low
    issue: Tanbihi a hutumia “anwani” kwa maana ya title/address.
    rationale: “Namna ya heshima” au “jina la heshima” ni usemi wa Kiswahili unaofaa zaidi katika maelezo haya.
