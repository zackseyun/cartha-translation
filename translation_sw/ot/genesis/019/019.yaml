  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: sw
  text: Tazama, tafadhali, mtumishi wako amepata kibali machoni pako, nawe umeonyesha fadhili zako kuu ulizonitendea kwa kuuhifadhi uhai wangu[a]. Lakini mimi siwezi kukimbilia mlimani, nisije nikapatwa na maafa[b] nikafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upendo wako mwaminifu” au “rehema zako.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “uovu”; hapa maana yake ni maafa au janga ambalo lingempata Loti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tazama, tafadhali
  rationale: “Tazama” huvuta usikivu, na “tafadhali” huhifadhi ombi la heshima na lenye haraka linaloletwa na נָא.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: amepata kibali machoni pako
  rationale: Huhifadhi nahau na taswira ya Kiebrania huku ikieleweka kwa Kiswahili cha sasa.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika usemi huu wa kujishusha mbele ya mwenye mamlaka, “mtumishi” linafaa kuliko “mtumwa,” kwa kuwa hali ya utumwa si jambo linalosisitizwa hapa.
- source_word: וַתַּגְדֵּל חַסְדְּךָ
  choice: umezidisha fadhili zako
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kuifanya חסד kuwa kubwa bila kutumia muundo mgumu usio wa kawaida.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: kwangu
  rationale: Katika muktadha wa fadhili, kifungu hiki kinaonyesha tendo lililofanywa kwa ajili ya Loti; “kwangu” huunganisha maana hiyo kwa kawaida.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: kwa kuhifadhi uhai wangu
  rationale: Hueleza kusudi au matokeo ya kumwacha hai bila kuingiza kwa lazima maana pana ya kitheolojia ya wokovu.
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: Lakini mimi siwezi
  rationale: “Lakini” huonyesha tofauti na fadhili zilizotajwa, huku “mimi” ikihifadhi msisitizo wa אָנֹכִי.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: kukimbilia mlimani
  rationale: Huhifadhi mwendo wa kuelekea mlima unaoonyeshwa na kiambishi cha mwelekeo katika Kiebrania; “mlimani” ni ya kawaida katika Kiswahili.
- source_word: פֶּן תִּדְבָּקַנִי
  choice: nisije nikapatwa
  rationale: Huwasilisha matokeo yanayoogopwa na maana ya janga kumfikia au kumkamata Loti.
- source_word: הָרָעָה
  choice: maafa
  rationale: Ingawa neno linaweza kumaanisha “uovu,” hapa linarejelea janga la uharibifu linalomtishia Loti.
theological_decisions:
- issue: Maana ya חֶסֶד katika ombi kwa wajumbe wa Mungu
  choice: fadhili zako
  alternative: upendo wako mwaminifu; rehema zako
  rationale: “Fadhili” huonyesha wema wenye neema uliotendwa kwa Loti bila kulazimisha neno hili kuwa istilahi maalumu ya agano katika muktadha huu. Tanbihi huhifadhi upana wa maana unaoweza kujumuisha upendo mwaminifu au rehema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi na msisitizo wa Loti umehifadhiwa, huku nahau zisizo za kawaida zikisawazishwa kwa ulinganifu bora.
