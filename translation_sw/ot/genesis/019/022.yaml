  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: sw
  text: “Fanya haraka, kimbilia huko, kwa maana siwezi kufanya jambo lolote mpaka utakapofika huko.” Kwa hiyo mji huo uliitwa[b] Soari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Soari linafanana kwa sauti na neno la Kiebrania linalomaanisha “dogo” au “lisilo na maana kubwa”; tazama Mwanzo 19:20.
    reason: cross_reference
  - marker: b
    text: Kwa tafsiri ya neno kwa neno zaidi, “aliita jina la mji Soari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Fanya haraka
  rationale: Kauli ya amri inaonyesha uharaka; usemi huu ni wa kawaida na wenye nguvu katika Kiswahili sanifu.
- source_word: הִמָּלֵט
  choice: ukimbilie
  rationale: Kauli ya amri ya mzizi מלט humaanisha kuponyoka au kujinusuru. Katika muktadha huu, “ukimbilie huko” kwa kawaida huonyesha kukimbia ili kupata usalama mahali palipotajwa.
- source_word: שָׁמָּה
  choice: huko
  rationale: Kielezi hiki kinaelekeza kwenye mahali pa mbali palipotajwa, hivyo “huko” kinafaa katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya amri iliyotangulia kwa lugha ya simulizi yenye hadhi na inayoeleweka.
- source_word: לֹא אוּכַל
  choice: siwezi
  rationale: Hutaja kutoweza moja kwa moja bila kulainisha au kufasiri sababu yake kiteolojia.
- source_word: לַעֲשׂוֹת דָּבָר
  choice: kufanya jambo lolote
  rationale: Kiebrania ni ‘kufanya jambo’; “jambo lolote” huwasilisha maana ya jumla kwa Kiswahili cha kawaida.
- source_word: עַד בֹּאֲךָ
  choice: mpaka utakapofika
  rationale: Muundo huu unarejelea kuwasili kwa mhusika katika mji na ni wa asili katika Kiswahili.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha hitimisho kinachotambulisha maelezo ya jina la mahali.
- source_word: קָרָא שֵׁם הָעִיר
  choice: mji huo uliitwa
  rationale: Kiebrania kinasema kihalisi ‘aliita jina la mji’; kauli tendwa ya Kiswahili ni ya asili na inahifadhi maana bila kubainisha mtendaji ambaye hajatajwa wazi.
- source_word: צֹעַר
  choice: Soari
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili badala ya kutafsiriwa.
theological_decisions:
- issue: Kauli ya kutoweza katika muktadha wa hukumu
  choice: siwezi kufanya jambo lolote
  alternative: siruhusiwi kufanya jambo lolote; siwezi kufanya jambo hili
  rationale: לֹא אוּכַל hutaja kutoweza moja kwa moja, na דָבָר ni neno la jumla. Tafsiri inahifadhi mvutano wa simulizi bila kuamua kama msemaji ni malaika au anazungumzia ruhusa ya Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Kauli za amri zimewasilishwa kwa uharaka wa asili, na usemi wa kutoweza umeachwa wazi bila ufafanuzi wa kimadhehebu. Alama za tanbihi zimewekwa kwenye jina na kishazi cha kulitaja jina la mji, ambako maelezo yake yanahusika moja kwa moja.
