base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: sw
  text: Lakini alikawia, ndipo wale watu[a] wakashika mkono wake, mkono wa mke wake, na mikono ya binti zake wawili, kwa sababu Yahwe alimhurumia. Kisha wakamtoa na kumweka nje ya mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha, watu hawa ni wale wajumbe wa kimalaika; Kiebrania cha aya hii kinawaita “watu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: alikawia
  rationale: Kitenzi kinaonyesha kuchelewa au kukawia wakati hatua ya haraka ilihitajika; “alikawia” ni ya kawaida na haiongezi wazo la kutokuwa na uhakika kiakili.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Kiebrania cha aya hii kinawaita moja kwa moja “watu,” ingawa muktadha unawatambulisha kuwa wajumbe wa kimalaika.
- source_word: וַיַּחֲזִקוּ
  choice: wakamshika
  rationale: Katika muundo huu, kitenzi kina maana ya kumkamata au kumshika kwa nguvu; “wakamshika” pamoja na muktadha wa uokoaji wa haraka hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: mkono wake, mkono wa mke wake, na mikono ya binti zake wawili
  rationale: Marudio ya “mkono” katika Kiebrania yamehifadhiwa kwa kiasi kikubwa, huku wingi “mikono” ukionyesha kwa kawaida kwamba kila binti alishikwa mkono.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: kwa sababu Yahwe alimhurumia
  rationale: Hii inawasilisha kwa Kiswahili cha asili nguvu ya kisababishi ya kihusishi, pamoja na huruma ya Yahwe iliyomwelekea Loti.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la “Yahwe,” kulingana na desturi ya mradi ya kutafsiri jina hilo waziwazi.
- source_word: וַיֹּצִאֻהוּ
  choice: wakamtoa
  rationale: Hifili ya יצא inaonyesha kusababisha mtu atoke; “wakamtoa” ni fupi, wazi, na ya kawaida katika simulizi.
- source_word: וַיַּנִּחֻהוּ
  choice: kumweka
  rationale: Hifili ya נוח hapa ina maana ya kumweka mtu mahali fulani, si lazima kumwacha kwa maana ya kumtelekeza.
- source_word: מִחוּץ לָעִיר
  choice: nje ya mji
  rationale: Kirai kinaonyesha mahali nje ya mipaka ya mji.
theological_decisions:
- issue: Utambulisho wa waokoaji katika simulizi
  choice: wale watu
  alternative: wale malaika
  rationale: Ingawa muktadha mpana unaonyesha kuwa wao ni wajumbe wa kimalaika, aya yenyewe inatumia neno la kawaida “watu.” Tafsiri kuu inahifadhi namna hiyo ya simulizi bila kuingiza ufafanuzi ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi kasi ya simulizi na marudio muhimu ya “mkono,” bila kuwa mzito kupita kiasi.
