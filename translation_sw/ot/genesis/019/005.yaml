base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: sw
  text: Wakamwita Loti na kumwambia, “Wako wapi wale wanaume waliokuja kwako usiku huu? Walete nje kwetu ili tuwajue[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi kulingana na muktadha, “ili tufanye nao ngono.” Kiebrania kinasema “ili tuwajue.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: Wakamwita Loti
  rationale: Kitenzi קרא pamoja na אֶל hapa kina maana ya kumwita mtu au kumwitia; tafsiri hii inadumisha mfuatano rahisi wa simulizi bila kuongeza nguvu ya ‘kupiga kelele’ ambayo haijaelezwa wazi.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: na kumwambia
  rationale: Muundo huu ni wa kawaida na wa asili katika Kiswahili kwa kuendeleza tendo linalofuata la kusema na Loti.
- source_word: אַיֵּה הָאֲנָשִׁים
  choice: Wako wapi wale wanaume
  rationale: אַיֵּה ni swali la mahali, na אֲנָשִׁים hapa inawataja wageni wa kiume kwa wazi. ‘Wale’ inafaa kwa watu waliotambuliwa na kishazi kinachofuata.
- source_word: אֲשֶׁר בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: waliokuja kwako usiku huu
  rationale: ‘Usiku huu’ ni Kiswahili cha sasa na cha kawaida kinachowasilisha maana ya הַלָּיְלָה katika muktadha huu.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: Walete nje kwetu
  rationale: Hifili ya יצא ina maana ya kuwasababisha watoke; ‘walete nje’ ni amri ya asili kwa Kiswahili na ‘kwetu’ inadumisha mwelekeo wa אֵלֵינוּ.
- source_word: וְנֵדְעָה אֹתָם
  choice: ili tuwajue
  rationale: ידע kimsingi ni ‘kujua.’ Tafsiri kuu inadumisha usemi wa Kiebrania na mvutano wake wa kifasihi, huku tanbihi ikifafanua maana ya kingono inayokusudiwa katika muktadha.
theological_decisions:
- issue: Iwapo kusudi la kingono la וְנֵדְעָה אֹתָם lielezwe wazi katika matini kuu
  choice: Kudumisha usemi ‘ili tuwajue’ katika matini kuu na kueleza maana ya kingono katika tanbihi.
  alternative: Kutafsiri moja kwa moja ‘ili tufanye nao ngono’ au ‘ili tuwalawiti.’
  rationale: Kitenzi ידע kwa kawaida humaanisha ‘kujua,’ ingawa muktadha huu unaonyesha kusudi la kingono lenye uhasama. Kudumisha neno la chanzo katika matini kuu huepuka kufuta kwa ukimya utata wa usemi na kuingiza ufafanuzi wote ndani ya tafsiri; tanbihi humsaidia msomaji kuelewa maana inayowezekana sana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo ‘Wakamwita Loti na kumwambia’ ni wa kisimulizi na wa asili; ‘usiku huu’ huepuka usemi wa kizamani. Alama ya tanbihi imewekwa baada ya usemi unaofafanuliwa.
