  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: sw
  text: Yule wa kwanza kuzaliwa akazaa mwana, akamwita Moabu[a]. Yeye ndiye baba wa Moabu hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baba wa Wamoabu hadi leo.” Kiebrania husema kihalisi, “baba wa Moabu,” kwa kutumia jina la baba wa ukoo kumaanisha watu waliotokana naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: akazaa
  rationale: Kitenzi ילד katika Qal hapa humaanisha kuzaa; “akazaa mwana” ni usemi wa kawaida na wenye hadhi katika simulizi.
- source_word: הַבְּכִירָה
  choice: Yule mzaliwa wa kwanza
  rationale: Umbo la kike linamtaja binti mkubwa wa Loti kwa cheo cha uzaliwa. “Mzaliwa wa kwanza” huhifadhi maana ya Kiebrania kuliko kuibadili kuwa tu “binti mkubwa.”
- source_word: בֵּן
  choice: mwana
  rationale: Neno hili linamaanisha mwana wa kiume; katika muktadha wa kibiblia “mwana” ni la asili na wazi.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: akamwita jina lake
  rationale: Huhifadhi kwa namna inayoeleweka fomula ya Kiebrania, “akaita jina lake,” badala ya kuifupisha kabisa kuwa “akamwita.”
- source_word: מוֹאָב
  choice: Moabu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הוּא
  choice: Yeye ndiye
  rationale: Kiwakilishi huru kinasisitiza na kumrejelea mwana aliyetajwa; “yeye ndiye” huonyesha urejeshi huo kwa kawaida.
- source_word: אֲבִי מוֹאָב
  choice: baba wa Moabu
  rationale: Hii ndiyo tafsiri ya karibu ya Kiebrania. Katika muktadha “baba” humaanisha babu wa ukoo au mwanzilishi wa watu wa Moabu; ufafanuzi umewekwa tanbihuni bila kuondoa usemi wa asili.
- source_word: עַד הַיּוֹם
  choice: hadi leo
  rationale: Ni usemi wa kawaida wa Kiswahili unaolingana na nahau ya Kiebrania inayorejelea wakati wa msimulizi.
