base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: sw
  text: 'Kabla hawajalala, wanaume wa mji huo, yaani wanaume wa Sodoma, waliizunguka nyumba[a]: kuanzia vijana hadi wazee[b], watu wote kutoka kila upande wa mji[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikusanyika kuizunguka nyumba.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzunguka au kukusanyika kuzunguka kitu; muktadha unaonyesha umati ulioizingira nyumba.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka kijana hadi mzee”; hii ni njia ya kusema kwamba watu wa umri mbalimbali walikuwapo.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kutoka mwisho” au “kutoka ukingo”; hapa yaelekea maana yake ni kutoka kila upande au kila sehemu ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: Kabla hawajalala
  rationale: Kirai hiki kinaonyesha kwamba tendo lililofuata lilitokea kabla ya wao kulala. Tafsiri hii ni ya kawaida na inahifadhi maana halisi bila kuongeza wazo la ‘kwenda kitandani.’
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: wanaume wa mji huo, yaani wanaume wa Sodoma
  rationale: Neno אַנְשֵׁי linarejelea wanaume, na kirai cha pili kinautambulisha mji unaokusudiwa. ‘Yaani’ linaonyesha uhusiano huo wa ufafanuzi kwa Kiswahili cha kawaida.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: waliizunguka nyumba
  rationale: Kitenzi kinaweza kumaanisha kuzunguka au kukusanyika kuizunguka kitu; katika muktadha huu, ‘waliizunguka’ linaonyesha umati ulioifunga nyumba pande zote.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: kuanzia vijana hadi wazee
  rationale: Hii ni tamathali inayotaja ncha mbili za umri ili kuonyesha wigo mzima. Tafsiri hiyo ni ya asili katika Kiswahili na haibani maneno hayo kuwa ‘mvulana’ na ‘mzee mmoja’ tu.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: עָם ni nomino ya pamoja inayomaanisha watu au umma. ‘Watu wote’ huhifadhi msisitizo wa ujumla huku mwanzo wa aya ukiendelea kubainisha kwamba waliotajwa ni wanaume.
- source_word: מִקָּצֶה
  choice: kutoka kila upande wa mji
  rationale: Ingawa kihalisi ni ‘kutoka mwisho/ukingo,’ hapa linaeleweka kiidioma kuwa watu walitoka sehemu mbalimbali za mji. ‘Kila upande wa mji’ ni wazi na ya kawaida.
theological_decisions:
- issue: Lugha ya kijinsia katika kueleza umati
  choice: Kuhifadhi ‘wanaume wa mji’ na ‘wanaume wa Sodoma,’ kisha kutafsiri כָּל הָעָם kuwa ‘watu wote.’
  alternative: Kutumia ‘watu wa mji’ katika sehemu zote.
  rationale: Kiebrania kwanza kinatumia neno linalomaanisha wanaume (אַנְשֵׁי), kisha nomino ya pamoja עָם. Kuhifadhi tofauti hiyo huepuka kufifisha maneno ya chanzo au kuyabana zaidi ya yalivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umefanywa kuwa wazi kwa kutumia ‘yaani,’ huku marudio ya Kiebrania na tofauti kati ya ‘wanaume’ na ‘watu wote’ vikihifadhiwa. Alama zote za tanbihi zimewekwa karibu na vifungu vinavyohusika.
