lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: akawasihi sana
  rationale: Kitenzi פצר kinaonyesha kusihi au kushinikiza kwa nguvu, na מְאֹד huongeza uzito wa tendo hilo. ‘Akawasihi sana’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: wakageuka wakaenda kwake
  rationale: Neno סור lina wazo la kugeuka au kuacha njia iliyokusudiwa; tafsiri hii huhifadhi picha hiyo huku ikieleweka kwa urahisi.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: kuingia nyumbani mwake
  rationale: Huwasilisha kwa kawaida mwendo kuelekea ndani ya nyumba yake.
- source_word: מִשְׁתֶּה
  choice: karamu
  rationale: Neno hili humaanisha karamu au dhifa, mara nyingi likihusisha kunywa, lakini muktadha haulazimishi kutaja kinywaji.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Huwasilisha kwa uwazi wingi wa nomino ya Kiebrania na maana ya mikate iliyotengenezwa bila chachu.
- source_word: אָפָה
  choice: akaoka
  rationale: Ni kitenzi cha kawaida cha Kiswahili kwa tendo la kuoka mikate.
- source_word: וַיֹּאכֵלוּ
  choice: nao wakala
  rationale: Huhifadhi mwendelezo wa simulizi na hitimisho rahisi kwamba wageni walikula.
