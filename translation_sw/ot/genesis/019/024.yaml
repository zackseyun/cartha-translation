  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: sw
  text: Ndipo Yahweh akanyesha salfa na moto juu ya Sodoma na Gomora kutoka kwa Yahweh, kutoka mbinguni[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri za jadi mara nyingi hutumia “kiberiti,” istilahi nyingine ya Kiswahili ya salfa. Neno la Kiebrania גָּפְרִית humaanisha salfa.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa Kiebrania: “kutoka kwa Yahweh, kutoka mbinguni.” Kurudiwa kwa jina la Mungu kumedumishwa kama kulivyo katika maandishi ya chanzo badala ya kurahisishwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linatunza jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: הִמְטִיר
  choice: akanyesha
  rationale: Kitenzi hiki katika Hiphil humaanisha “kusababisha kunyesha” au “kunyesha chini”; “akanyesha” linahifadhi taswira ya kitu kinachoshuka kama mvua.
- source_word: גָּפְרִית
  choice: salfa
  rationale: “Salfa” ni neno la sasa na sahihi kwa dutu inayotajwa; “kiberiti” ni mbadala wa jadi lakini katika matumizi ya sasa linaweza pia kueleweka kuwa kijiti cha kuwashia moto.
- source_word: אֵשׁ
  choice: moto
  rationale: Ni kisawe cha moja kwa moja na cha kawaida, kikiendeleza jozi ya “salfa na moto.”
- source_word: עַל
  choice: juu ya
  rationale: Kinaonyesha kwa uwazi mahali hukumu ilipoelekezwa.
- source_word: סְדֹם וְעֲמֹרָה
  choice: Sodoma na Gomora
  rationale: Haya ndiyo maumbo ya kawaida ya majina hayo katika Kiswahili.
- source_word: מֵאֵת יְהוָה
  choice: kutoka kwa Yahweh
  rationale: Kifungu hiki kinataja chanzo na kinahifadhi kurudiwa kwa jina la Mungu kama lilivyo katika Kiebrania.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Huwasilisha chanzo cha juu kinachotajwa na neno la Kiebrania הַשָּׁמַיִם kwa Kiswahili cha kawaida bila kulazimisha umbo la wingi lisilo la kawaida.
- source_word: וַ
  choice: Ndipo
  rationale: Kinaendeleza mfuatano wa simulizi kwa Kiswahili cha asili.
theological_decisions:
- issue: Kurudiwa kwa jina la Mungu katika “Yahweh ... kutoka kwa Yahweh”
  choice: Kurudia jina hilo katika maandishi makuu bila kulirahisisha.
  alternative: “Ndipo Yahweh akanyesha ... kutoka mbinguni” au “Yahweh akanyesha ... kutoka kwake mwenyewe mbinguni.”
  rationale: Kiebrania kinataja יהוה mara mbili. Tafsiri inatunza muundo huo na mvutano wake wa kifasiri bila kuamua kimya-kimya suala la utendaji au uhusiano unaoweza kudhaniwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio unabaki karibu na Kiebrania ili kuhifadhi taswira ya kunyesha na kurudiwa kusiko kwa kawaida kwa jina Yahweh; koma husaidia kutenganisha virai viwili vya chanzo bila kuvifasiri upya.
