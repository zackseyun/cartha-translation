base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: sw
  text: Binti mzaliwa wa kwanza akamwambia mdogo wake, “Baba yetu ni mzee, na hakuna mwanamume katika nchi wa kuingia kwetu[a] kama ilivyo desturi ya dunia yote[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye kufafanua zaidi, “wa kujamiiana nasi.” Kiebrania kinatumia usemi wa staha “kuingia kwetu.”
    reason: lexical_alternative
  - marker: b
    text: “Kama ilivyo desturi ya dunia yote” yaelekea kumaanisha kufuata mwenendo wa kawaida wa wanadamu, hasa kuhusu muungano wa kingono na kuendeleza uzao.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: Binti mzaliwa wa kwanza
  rationale: Neno hili la kike humaanisha aliyezaliwa kwanza au aliye mkubwa. Kutaja “binti” huifanya sentensi iwe wazi na ya kawaida kwa Kiswahili, huku “mzaliwa wa kwanza” ikihifadhi msisitizo wa mpangilio wa kuzaliwa.
- source_word: הַצְּעִירָה
  choice: mdogo wake
  rationale: Kivumishi hiki cha kike humaanisha aliye mdogo. “Mdogo wake” ni Kiswahili cha kawaida na huonyesha uhusiano wake na binti mzaliwa wa kwanza bila kurudia neno “binti.”
- source_word: אָבִינוּ זָקֵן
  choice: Baba yetu ni mzee
  rationale: Hii inawakilisha moja kwa moja kishazi cha Kiebrania kisicho na kitenzi na ni usemi wa kawaida wa Kiswahili.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: na hakuna mwanamume katika nchi
  rationale: אִישׁ hapa humaanisha mwanamume, jambo muhimu katika muktadha wa kupata uzao. “Katika nchi” huhifadhi maana pana ya בָאָרֶץ bila kuongeza neno lisilokuwapo kama “hii.”
- source_word: לָבוֹא עָלֵינוּ
  choice: wa kuingia kwetu
  rationale: Huu ni usemi wa staha unaohusu kujamiana. Tafsiri hii inadumisha sitiari ya Kiebrania badala ya kuifafanua moja kwa moja katika matini kuu.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: kama ilivyo desturi ya dunia yote
  rationale: “Desturi” huwasilisha maana ya njia au mwenendo wa kawaida wa wanadamu kwa Kiswahili kinachoeleweka, huku “dunia yote” ikihifadhi upana wa usemi wa Kiebrania.
theological_decisions:
- issue: Maana ya “kuingia kwetu”
  choice: Usemi wa staha wa Kiebrania umehifadhiwa katika matini kuu na kufafanuliwa katika tanbihi.
  alternative: “Kulala nasi” au “kufanya ngono nasi.”
  rationale: Hii huepuka kufanya matini iwe wazi zaidi kuliko ilivyo katika Kiebrania, bila kuficha maana yake kwa msomaji.
- issue: Maana ya “desturi ya dunia yote”
  choice: Usemi mpana wa Kiebrania umehifadhiwa, huku muktadha wake wa muungano wa kingono na kuendeleza uzao ukielezwa katika tanbihi.
  alternative: “kama wanaume na wanawake wanavyofanya kila mahali.”
  rationale: Tafsiri iliyochaguliwa huhifadhi upeo na mvutano wa usemi wa asili badala ya kuufungia katika ufafanuzi mmoja ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi wa staha wa Kiebrania umehifadhiwa; alama za tanbihi zimewekwa karibu na vifungu vinavyoelezwa.
