  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: sw
  text: Abrahamu akaamka asubuhi na mapema, akaenda mahali ambapo alikuwa amesimama mbele za Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa tafsiri ya karibu: “mbele ya uso wa Yahwe,” nahau yenye maana ya “mbele za Yahwe” au “katika uwepo wa Yahwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: akaamka ... na mapema
  rationale: Hifili ya שׁכם humaanisha kuamka au kuanza shughuli mapema. Kiswahili cha kawaida hutumia ‘akaamka asubuhi na mapema,’ kikihifadhi msisitizo wa wakati.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: בֹּקֶר ni ‘asubuhi’; pamoja na kitenzi kilichotangulia, ‘asubuhi na mapema’ ni usemi wa asili wa Kiswahili.
- source_word: אֶל הַמָּקוֹם
  choice: akaenda mahali
  rationale: אֶל huonyesha mwelekeo kuelekea mahali. Kiswahili kinahitaji kitenzi cha mwendo ili kuwasilisha kwa kawaida wazo la kuelekea huko, ingawa kitenzi hicho kinaeleweka katika muundo wa Kiebrania.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: alipokuwa amesimama
  rationale: Kishazi hiki kinarejelea tendo la awali; ‘alipokuwa amesimama’ huwasilisha rejeo hilo kwa Kiswahili cha kawaida bila kutafsiri שָׁם kwa uradidi usio wa lazima.
- source_word: אֶת־פְּנֵי
  choice: mbele za
  rationale: Katika muundo עמד את־פני, maneno haya ni nahau ya kuwa mbele ya mtu au katika uwepo wake. ‘Mbele za’ ni tafsiri fupi na ya kawaida ya Kibiblia katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama ‘Yahwe,’ umbo linalotumika katika Kiswahili, badala ya kulibadili kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi kwa tahajia ya kawaida ya Kiswahili, bila kulibadili kuwa cheo.
- issue: Nahau ya kusimama אֶת־פְּנֵי יְהוָה
  choice: mbele za Yahwe
  alternative: mbele ya uso wa Yahwe; katika uwepo wa Yahwe
  rationale: ‘Mbele za Yahwe’ huhifadhi maana ya kuwa katika uwepo wake bila kufanya usemi wa Kiebrania kuhusu ‘uso’ usikike kama maelezo ya kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi wenye viambishi ‘aka-’ umetumiwa kwa mtiririko wa kawaida; tanbihi huhifadhi umbo halisi la nahau ya Kiebrania.
