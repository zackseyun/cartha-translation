  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: sw
  text: Naye akayapindua miji ile[a], na tambarare yote[b], na wakaaji wote wa miji hiyo, pamoja na mimea ya ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akayageuza.” Kitenzi cha Kiebrania kinaweza kusisitiza kupinduliwa kwa maangamizi.
    reason: lexical_alternative
  - marker: b
    text: “Tambarare” hapa inarejelea eneo la tambarare ya Yordani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: akayapindua
  rationale: Kitenzi הפך kinaonyesha kupindua kwa maangamizi; “akayapindua” huhifadhi taswira hiyo halisi kuliko neno la jumla “akaangamiza.”
- source_word: הֶעָרִים הָאֵל
  choice: miji ile
  rationale: Kiwakilishi אֵל kinarejelea miji mahususi iliyotajwa katika simulizi; “miji ile” ni rejeleo la kawaida na la asili katika Kiswahili.
- source_word: כָּל הַכִּכָּר
  choice: eneo lote la tambarare
  rationale: כִּכָּר hapa ni wilaya au eneo la tambarare ya Yordani, si umbo la duara tu; “eneo lote la tambarare” linaweka wazi kuwa ni sehemu nzima ya kijiografia.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: wakaaji wote wa miji hiyo
  rationale: Umbo la kishirikishi kutoka ישב linamaanisha watu waliokuwa wakiishi humo; “wakaaji” ni sahihi, fupi, na ya kawaida.
- source_word: צֶמַח הָאֲדָמָה
  choice: mimea ya ardhi
  rationale: צֶמַח hurejelea uoto unaochipuka, na אֲדָמָה ni ardhi au udongo; “mimea ya ardhi” ni lugha ya kawaida inayohifadhi maana ya kimwili na kilimo.
theological_decisions:
- issue: Mtendaji asiyetajwa wazi wa kitenzi cha umoja
  choice: Kutumia “Naye” bila kumtaja Mungu au BWANA wazi katika mstari huu
  alternative: Kusema “Mungu” au “BWANA” moja kwa moja
  rationale: Kiebrania kina kitenzi cha umoja lakini hakimtaji mtendaji katika kishazi hiki; muktadha uliotangulia humtambulisha. “Naye” huhifadhi mshikamano wa simulizi bila kuongeza jina lisilokuwapo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mfululizo wa Kiebrania huku ukitumia viunganishi vya asili vya Kiswahili.
