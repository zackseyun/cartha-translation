base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: sw
  text: Akatazama Sodoma na Gomora na nchi yote ya uwanda, akaona, na tazama, moshi wa nchi ulikuwa ukipaa kama moshi wa tanuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama moshi wa tanuru ya kuchomea matofali.”
    reason: Neno la Kiebrania כִּבְשָׁן linaweza kumaanisha tanuru au tanuru ya kuchomea matofali.
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: Akatazama
  rationale: Kitenzi kinaonyesha kutazama eneo kutoka mahali palipoinuka. Kiswahili ‘akatazama’ ni cha asili katika simulizi; muktadha wa aya iliyotangulia unaonyesha mahali aliposimama bila kulazimisha kuongeza ‘chini.’
- source_word: עַל פְּנֵי
  choice: Sodoma na Gomora ... na nchi yote
  rationale: Nahau ya Kiebrania yenye maana halisi ya kutazama ‘juu ya uso wa’ eneo imetolewa kwa mpangilio wa kawaida wa Kiswahili, huku wazo la kulikagua eneo zima likihifadhiwa.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodoma na Gomora
  rationale: Haya ndiyo maumbo ya majina ya mahali yaliyozoeleka katika Kiswahili.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: nchi yote ya Uwanda
  rationale: כִּכָּר hapa ni eneo tambarare linalojulikana katika simulizi. ‘Uwanda’ huhifadhi rejeo hilo la kijiografia, na herufi kubwa hulitambulisha kuwa eneo maalumu.
- source_word: וַיַּרְא
  choice: akaona
  rationale: Tafsiri ya moja kwa moja inayohifadhi mfuatano na msisitizo wa simulizi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi ishara ya Kiebrania ya jambo linaloonekana ghafla na kwa uzito, badala ya kuifuta katika tafsiri.
- source_word: עָלָה
  choice: ulikuwa ukipanda
  rationale: Muundo huu unaonyesha tukio linaloendelea kuonekana, yaani moshi ukienda juu.
- source_word: קִיטֹר
  choice: moshi
  rationale: Hii ndiyo maana ya msingi; hakuna kivumishi kilichoongezwa ambacho kingezidisha maelezo ya chanzo.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Muktadha unahusu eneo maalumu lililokuwa likionekana, si dunia nzima.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: kama moshi wa tanuru
  rationale: כִּבְשָׁן inaweza kuwa tanuru au mahali pa kuchomea vitu kama matofali. ‘Tanuru’ ni neno fupi na linaloeleweka, huku uwezekano wa pili ukihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Kirai ‘na tazama’ kimehifadhiwa makusudi ili kuonyesha nguvu ya וְהִנֵּה. Alama ya tanbihi imewekwa baada ya ‘tanuru,’ ambako tofauti ya kileksia inahusika.
