  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: sw
  text: Basi ikawa, Mungu alipoharibu miji ya uwanda, Mungu akamkumbuka Abrahamu[a] na kumtoa Loti katikati ya maangamizi[b], alipoziangamiza miji ambayo Loti alikuwa ameishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “Mungu akamkumbuka Abrahamu” haimaanishi kwamba Mungu alikuwa amemsahau. Ni nahau ya Kiebrania inayoonyesha kwamba Mungu alimjali Abrahamu kwa uaminifu na akachukua hatua.
    reason: cultural_note
  - marker: b
    text: Neno la Kiebrania linaweza pia kutafsiriwa “kupinduliwa” au “uharibifu.” Linatokana na mzizi uleule wa neno linalotafsiriwa “alipoziangamiza” baadaye katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Basi ikawa
  rationale: Huhifadhi kiashiria cha kisimulizi kinachoanzisha hali ya wakati, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּשַׁחֵת אֱלֹהִים
  choice: Mungu alipoharibu
  rationale: Muundo wa kitenzi-jina wenye בְּ una maana ya wakati; ‘alipoharibu’ unaonyesha wazi hali hiyo bila kufanya sentensi kuwa nzito.
- source_word: עָרֵי הַכִּכָּר
  choice: miji ya uwanda
  rationale: כִּכָּר hapa ni eneo tambarare la Yordani; ‘uwanda’ ni neno la kawaida linalofaa muktadha wa kijiografia.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: Mungu akamkumbuka Abrahamu
  rationale: Huhifadhi nahau ya Kiebrania na mvuto wake wa kiteolojia bila kuibadili kuwa ufafanuzi kama ‘akatenda kwa ajili ya Abrahamu.’
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: na kumtoa Loti
  rationale: Katika muktadha huu wa kuokolewa, ‘kumtoa’ huwasilisha mwendo wa Loti kutoka eneo la maangamizi kwa njia ya asili kuliko ‘kumtuma atoke,’ ambalo lingeweza kudokeza amri tu.
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: katikati ya maangamizi
  rationale: ‘Katikati ya’ huhifadhi wazo la תּוֹךְ, na ‘maangamizi’ hutoa kwa Kiswahili cha kawaida maana ya tukio la kuangushwa na kuharibiwa, ingawa mwangwi wa mzizi הפך unaelezwa katika tanbihi.
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: alipoipindua miji
  rationale: Huhifadhi maana halisi ya הפך na hali ya wakati ya בַּ, huku kiambishi cha ngeli katika ‘alipoipindua’ kikirejelea miji kama kitu kimoja cha kisarufi kwa mujibu wa matumizi ya kawaida.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: ambayo Loti alikuwa ameishi
  rationale: Wakati timilifu ‘alikuwa ameishi’ unaweka makao ya Loti kabla ya maangamizi na unafuata mtiririko wa simulizi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ‘Mungu akamkumbuka Abrahamu’
  choice: Nahau ‘akamkumbuka Abrahamu’ imehifadhiwa katika maandishi makuu.
  alternative: Mungu akatenda kwa ajili ya Abrahamu / Mungu akamjali Abrahamu kwa uaminifu
  rationale: Katika masimulizi ya Kiebrania, Mungu ‘kukumbuka’ mara nyingi humaanisha kumjali mtu kwa uaminifu na kuchukua hatua, si kwamba alikuwa amemsahau. Tafsiri ya moja kwa moja huhifadhi mvutano na mwangwi wa kibiblia, huku tanbihi ikizuia uelewa usiofaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Basi ikawa’ umetumiwa kuhifadhi mwanzo wa kisimulizi bila kutumia lugha ya kizamani. Sentensi inadumisha kurudiwa kwa jina ‘Mungu’ kama katika Kiebrania na inalinda nahau ya ‘kukumbuka’ dhidi ya ufafanuzi wa kimadhehebu.
