base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: sw
  text: Wakasema, “Rudi nyuma![a]” Kisha wakasema, “Huyu alikuja kuishi kama mgeni, na sasa anajifanya hakimu![b] Sasa tutakutendea vibaya zaidi kuliko tutakavyowatendea wao.”[c] Wakamsonga sana yule mtu, Loti, kisha wakasogea ili kuuvunja mlango.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Simama mbali!” au “Ondoka hapo!”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatilia mkazo tendo la kuhukumu; pia inaweza kutafsiriwa, “na sasa anahukumu kweli!”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “tutakutendea mabaya kuliko wao”; ni tishio la kumdhuru Loti vibaya zaidi kuliko wageni wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: Rudi nyuma!
  rationale: Amri hii ya kiuadui inamtaka Loti aondoke njiani au arudi nyuma. “Rudi nyuma!” ni ya kawaida, yenye nguvu, na inaacha uwezekano wa maana ya “Simama mbali!” katika tanbihi.
- source_word: הָאֶחָד בָּא לָגוּר
  choice: Huyu alikuja kuishi hapa kama mgeni
  rationale: גור inaeleza kuishi mahali kama mtu asiye mwenyeji. “Kama mgeni” inaeleweka kwa wasomaji wa sasa, huku “Huyu” ikihifadhi sauti ya dharau ya הָאֶחָד bila kutumia lugha isiyo ya kawaida.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: na sasa anajifanya hakimu!
  rationale: Muundo wa kitenzi pamoja na jina-kitenzi unatilia mkazo shtaka lao kwamba Loti anajipa mamlaka ya kuwahukumu. Kauli hii ya Kiswahili ni ya asili na huhifadhi dharau yao, bila kudai kwamba Loti alikuwa hakimu rasmi.
- source_word: נָרַע לְךָ מֵהֶם
  choice: tutakutendea vibaya zaidi kuliko tutakavyowatendea wao
  rationale: 'Hiphil ya רעע ni kutenda uovu au kusababisha madhara. Tafsiri hii inaweka wazi ulinganisho wa tishio: Loti atafanyiwa mabaya kuliko wageni, bila kutaja aina ya madhara ambayo Kiebrania hakuitaji wazi.'
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: Wakamsonga sana yule mtu, Loti
  rationale: Katika muktadha wa kusogea kuuvunja mlango, פצר inaonyesha shinikizo la kimwili, si kusihi kwa maneno tu. “Sana” inawakilisha מְאֹד, na “yule mtu, Loti” huhifadhi apposition ya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: wakasogea ili kuuvunja mlango
  rationale: נגשׁ pamoja na infinitive inaonyesha kusogea kwa kusudi fulani. “Kuuvunja mlango” hudumisha maana ya שׁבר na nguvu inayodokezwa na muktadha.
theological_decisions:
- issue: Asili ya tishio kwa Loti na ulinganisho na wageni
  choice: Kutafsiri tishio kwa ujumla kuwa watamtendea Loti vibaya zaidi kuliko watakavyowatendea wageni
  alternative: Kutaja wazi aina maalumu ya unyanyasaji waliokusudia
  rationale: Kiebrania kinatumia kauli pana ya ‘kutenda uovu/madhara’ na hakitaji hapa aina maalumu ya tendo. Tafsiri haipaswi kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo yana ukali wa umati bila kutumia misimu. “Kuishi hapa kama mgeni” ni wazi kuliko istilahi nzito za kisheria, na “wakamsonga sana” huonyesha shinikizo la kimwili linaloendana na muktadha.
