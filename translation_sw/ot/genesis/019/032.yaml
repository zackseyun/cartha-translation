review_pass:
  verdict: revise
  source_fidelity: “Njooni” is a plural imperative, whereas לְכָה is feminine singular, addressed by the older daughter to her sister. The causative sense of נַשְׁקֶה is otherwise conveyed well by “tumpe ... anywe,” and the final purpose clause accurately preserves the intended continuation of lineage through their father.
  naturalness: The wording is generally clear and suitably restrained. Replacing “Njooni” with the singular “Njoo” corrects the addressee while remaining natural in Standard East African Swahili. “Tulale naye” appropriately retains the source euphemism.
  terminology: “Divai,” “baba yetu,” and “uzao” are appropriate. “Kupitia baba yetu” communicates the paternal means/source without unwarranted theological or interpretive expansion.
  issues:
  - severity: medium
    issue: “Njooni” does not match the singular feminine imperative לְכָה.
    rationale: The Hebrew speaker addresses one sister (“Come,” feminine singular), then includes both of them in the subsequent cohortatives. Swahili “Njooni” addresses multiple hearers and obscures that distinction.
  revised_text: Njoo, tumpe baba yetu divai anywe, kisha tulale naye, ili kupitia baba yetu tuhifadhi uzao.
