  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: sw
  text: Njoo, tumpe baba yetu divai anywe, kisha tulale naye, ili kupitia baba yetu tuhifadhi uzao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: Njooni
  rationale: Ni usemi wa kuhamasisha hatua. Wingi unafaa kwa kuwa dada mkubwa anamshirikisha mdogo wake; “Njooni” ni wa kawaida na wenye nguvu ya mwaliko wa kutenda.
- source_word: נַשְׁקֶה
  choice: tumpe ... anywe
  rationale: Hifili ina maana ya kusababisha au kumpa mtu anywe. Muundo huu ni wa asili katika Kiswahili na huhifadhi maana ya kisababishi bila kudokeza kwa lazima matumizi ya nguvu.
- source_word: אָבִינוּ
  choice: baba yetu
  rationale: Tafsiri ya moja kwa moja ya nomino yenye kiambishi kimilikishi; imerudiwa kama ilivyo katika Kiebrania.
- source_word: יַיִן
  choice: divai
  rationale: Neno la kawaida la Kiswahili kwa kinywaji cha יין.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: kisha tulale naye
  rationale: שכב pamoja na עִם ni tasfida ya tendo la ngono. “Kulala naye” huhifadhi tasfida hiyo kwa lugha ya sasa bila kuwa wazi kupita kiasi.
- source_word: וּנְחַיֶּה
  choice: ili ... tuhifadhi
  rationale: Hapa kitenzi kina wazo la kudumisha au kuhifadhi hai. Pamoja na זרע, kinamaanisha kuhakikisha uzao unaendelea.
- source_word: מֵאָבִינוּ
  choice: kupitia baba yetu
  rationale: מן huonyesha chanzo cha uzao. “Kupitia baba yetu” ni ya asili katika Kiswahili na inaonyesha kwamba uzao unaokusudiwa utatokana naye.
- source_word: זָרַע
  choice: uzao
  rationale: Katika muktadha huu זרע humaanisha watoto au mwendelezo wa kizazi, si mbegu halisi. “Uzao” ni sahihi, wenye heshima, na wa kawaida.
