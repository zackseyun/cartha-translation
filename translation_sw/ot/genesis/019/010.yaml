  text: וַ/יִּשְׁלְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת יָדָ֔/ם וַ/יָּבִ֧יאוּ אֶת ל֛וֹט אֲלֵי/הֶ֖ם הַ/בָּ֑יְתָ/ה וְ/אֶת הַ/דֶּ֖לֶת סָגָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: sw
  text: Lakini wale wanaume[a] wakanyoosha mikono yao, wakamwingiza Loti ndani ya nyumba pamoja nao, kisha wakaufunga mlango.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wale wanaume”; muktadha mpana unawatambulisha kuwa wajumbe wa kimalaika.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: wale wanaume
  rationale: Nomino ya Kiebrania humaanisha moja kwa moja ‘wanaume.’ Ingawa muktadha mpana unawatambulisha kuwa wajumbe wa kimalaika, tafsiri inadumisha neno lililotumiwa katika mstari huu.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: wakanyoosha mikono yao
  rationale: Hii ni nahau ya Kiebrania ya kupeleka mkono ili kufanya jambo. ‘Wakanyoosha mikono yao’ ni Kiswahili cha kawaida kinachoonyesha kitendo hicho wazi.
- source_word: וַיָּבִיאוּ
  choice: wakamwingiza
  rationale: Hifili ya בוא ina maana ya kumleta au kumwingiza. Kwa kuwa mwendo unaelekea ndani ya nyumba, ‘wakamwingiza’ ni ya asili na sahihi kuliko kuongeza wazo la kumvuta ambalo halijaelezwa moja kwa moja.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: ndani ya nyumba pamoja nao
  rationale: Kirai hiki kinaonyesha kwamba Loti aliingizwa nyumbani walimokuwa wale wanaume. ‘Pamoja nao’ huhifadhi maana ya אֲלֵיהֶם kwa Kiswahili kinachoeleweka.
- source_word: הַדֶּלֶת
  choice: mlango
  rationale: דֶּלֶת ni neno la kawaida kwa mlango; hakuna haja ya kulipanua kuwa ‘mlango wa kuingilia.’
- source_word: סָגָרוּ
  choice: wakaufunga
  rationale: ‘Kufunga mlango’ ndiyo kauli ya kawaida ya Kiswahili kwa kitendo cha kuufanya usiwe wazi, na inafaa mwendo wa haraka wa simulizi.
- source_word: וַ
  choice: Lakini
  rationale: Kiunganishi hapa kinaendeleza simulizi huku kikionyesha tofauti na tendo la umati katika mstari uliotangulia; ‘Lakini’ huwasilisha tofauti hiyo kwa kawaida.
theological_decisions:
- issue: Iwapo הָאֲנָשִׁים watajwe wazi kuwa malaika
  choice: Kudumisha ‘wale wanaume’ katika matini kuu
  alternative: wale malaika; wale wageni
  rationale: Muktadha unadhihirisha kwamba wao ni wajumbe wa kimalaika, lakini mstari huu wenyewe unawaita ‘wanaume.’ Tafsiri haingizi utambulisho wa kimuktadha mahali ambapo mwandishi ametumia neno la kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi ‘wakanyoosha… wakamwingiza… wakaufunga’ unadumisha kasi ya simulizi. ‘Pamoja nao’ ni ya asili kuliko kuiga moja kwa moja mpangilio wa Kiebrania ‘kwao, kuelekea nyumbani.’
