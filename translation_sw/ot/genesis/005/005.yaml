  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: sw
  text: Siku zote za Adamu alizoishi zilikuwa miaka mia tisa na thelathini[a], naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania “adam” linaweza kumaanisha “mwanadamu” au “wanadamu” katika miktadha mingine, lakini hapa linamtaja Adamu, mtu binafsi katika ukoo huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: zilikuwa
  rationale: Katika kauli hii ya muhtasari wa ukoo, kitenzi היה kinaeleza jumla ya muda wa maisha; “zilikuwa” ni cha asili kwa Kiswahili na kinapatana na “siku zote.”
- source_word: כָּל יְמֵי
  choice: siku zote
  rationale: Inahifadhi nahau ya Kiebrania inayohesabu maisha kwa “siku” pamoja na muundo unaorudiwa katika ukoo huu.
- source_word: אָדָם
  choice: Adamu
  rationale: Katika muktadha huu wa ukoo, neno hili ni jina la mtu binafsi, si rejeo la jumla kwa mwanadamu au wanadamu.
- source_word: אֲשֶׁר חַי
  choice: ambazo Adamu aliishi
  rationale: Kishazi hiki kinazifafanua “siku”; kurudia jina kunafanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili.
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: miaka mia tisa na thelathini
  rationale: Inatoa idadi kamili kwa maneno na kudumisha mtindo wa kifasihi wa simulizi la ukoo.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Inahifadhi hitimisho fupi na zito linalorudiwa katika Mwanzo 5 bila kulainisha maana ya kifo.
theological_decisions:
- issue: Maana ya אָדָם
  choice: Adamu kama jina la mtu
  alternative: mwanadamu / wanadamu
  rationale: Muktadha wa ukoo unamtaja mtu aliyepewa jina Adamu. Maana pana ya neno hilo katika miktadha mingine inaelezwa katika tanbihi bila kufifisha rejeo la hapa.
- issue: Kuhifadhi kauli ya kifo
  choice: naye akafa
  alternative: kisha akafa
  rationale: Kiebrania hakilazimishi nyongeza ya “kisha”; tafsiri hii huhifadhi uradidi mkali unaosisitiza hali ya mwanadamu kufa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “siku zote ... zilikuwa miaka” umehifadhiwa kwa sababu ya fomula ya ukoo, huku “naye akafa” ikitoa hitimisho la kawaida, fupi na lenye uzito.
