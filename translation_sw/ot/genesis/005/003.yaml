base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: sw
  text: Adamu aliishi miaka mia moja na thelathini, akazaa mwana kwa mfano wake, kwa sura yake,[a] akamwita jina lake Sethi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “kwa mfano wake, kwa sura yake” yanatoa mwangwi wa Mwanzo 1:26–27.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְחִי
  choice: alipokuwa na umri wa
  rationale: Katika taarifa za nasaba, kitenzi חיה pamoja na idadi ya miaka hueleza umri wa mtu wakati wa tukio linalofuata; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: אָדָם
  choice: Adamu
  rationale: Hapa ni jina la mtu katika nasaba, si neno la jumla linalomaanisha mwanadamu.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: miaka 130
  rationale: Huwakilisha moja kwa moja idadi ya Kiebrania kwa mtindo wa kawaida wa Kiswahili.
- source_word: וַיּוֹלֶד
  choice: alimzaa mwana
  rationale: Hifili ya ילד ikiwa na mhusika wa kiume humaanisha kuzaa au kuwa baba wa mtoto; 'alimzaa mwana' ni ya asili katika Kiswahili na hudumisha jukumu la baba. Neno 'mwana' linaeleweka kutokana na kutajwa kwa Sethi.
- source_word: בִּדְמוּתוֹ
  choice: aliyefanana naye
  rationale: דמות huonyesha ufanano. Usemi huu ni wa asili kwa Kiswahili huku ukihifadhi wazo la mwana kufanana na Adamu.
- source_word: כְּצַלְמוֹ
  choice: kwa mfano wake
  rationale: צלם kwa kawaida ni 'mfano,' na kiambishi כ hapa kinaweza kuwakilishwa kwa 'kwa'; usemi huo pia huhifadhi mwangwi wa Mwanzo 1:26–27.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: akamwita Sethi
  rationale: Hii ndiyo njia ya asili ya Kiswahili ya kuwasilisha nahau ya Kiebrania 'akaliita jina lake Sethi' bila kubadili maana.
- source_word: שֵׁת
  choice: Sethi
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa mwana wa Adamu na ufanano na mfano wa Adamu
  choice: Maneno yametafsiriwa moja kwa moja kuwa mwana alifanana na Adamu na alikuwa kwa mfano wake.
  alternative: Kuyafasiri kama kauli kwamba mfano wa Mungu ulipungua au ulipotea baada ya anguko.
  rationale: Aya hii inatoa mwangwi wa Mwanzo 1:26–27 lakini haielezi athari zake zote za kiteolojia. Tafsiri inahifadhi mwangwi na mvutano huo bila kuamua mjadala wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa umri umetolewa kwa namna ya kawaida katika masimulizi ya nasaba; istilahi mbili tofauti, דמות na צלם, zimehifadhiwa kwa 'kufanana' na 'mfano'.
