  yaml_path: translation/ot/genesis/005/025.yaml
  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: sw
  text: Methusela aliishi miaka mia moja themanini na saba, akamzaa Lameki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo rasmi zaidi, “akawa baba ya Lameki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika fomula hii ya nasaba, kitenzi חיה kinaeleza umri wa mtu kabla ya kumzaa mwana aliyetajwa; “aliishi” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: מְתוּשֶׁלַח
  choice: Methusela
  rationale: Jina limetoholewa kwa umbo linalotambulika na lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: miaka mia moja themanini na saba
  rationale: Mpangilio halisi wa Kiebrania wa ‘saba na themanini ... na mia’ umetolewa kwa mpangilio wa kawaida wa namba katika Kiswahili bila kubadili thamani yake.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Hifili ya ילד katika nasaba humaanisha kwamba mwanaume alimzaa au akawa baba wa mtu; “akamzaa” ni fupi, ya asili, na inadumisha mfuatano wa simulizi.
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa maalumu kisicho na neno linganifu la lazima katika Kiswahili; kazi yake inaonyeshwa na kiambishi cha yambwa katika “akamzaa.”
- source_word: לָמֶךְ
  choice: Lameki
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalotambulika katika mapokeo mapana ya Biblia.
