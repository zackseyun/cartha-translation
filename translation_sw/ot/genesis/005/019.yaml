lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi חיה kinaeleza muda ambao mtu aliendelea kuishi; “aliishi” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יֶרֶד
  choice: Yeredi
  rationale: Umbo hili linafuata kwa karibu jina la Kiebrania Yered huku likiwa rahisi kutamkwa katika Kiswahili.
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Hiki ni kiunganishi cha kawaida cha wakati kinachoonyesha kipindi kilichofuata kuzaliwa kwa Henoko.
- source_word: הוֹלִידוֹ אֶת־חֲנוֹךְ
  choice: kumzaa Henoko
  rationale: Hifili ya ילד humtaja baba kama aliyesababisha kuzaliwa; katika Kiswahili, “kumzaa” inaweza kutumiwa kwa mzazi wa kiume katika taarifa za nasaba na ni ya asili kuliko “kumzalisha.”
- source_word: חֲנוֹךְ
  choice: Henoko
  rationale: “Henoko” ni umbo la Kiswahili linalotambulika na linalokaribia matamshi ya Kiebrania kuliko umbo la Kiingereza “Enoch.”
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: miaka mia nane
  rationale: Huu ndio mpangilio wa kawaida wa namba na nomino katika Kiswahili kwa muda huu.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi hiki kinaendeleza mfuatano wa simulizi na kinadumisha tendo la uzazi lililotajwa wazi katika Kiebrania.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; “wana na binti” huhifadhi utofauti huo.
