lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi חיה katika muundo huu wa nasaba humaanisha ‘aliishi’; wakati uliopita unafaa simulizi la Kiswahili.
- source_word: קֵינָן
  choice: Kenani
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania kwa matamshi na tahajia ya kawaida ya Kiswahili.
- source_word: שִׁבְעִים שָׁנָה
  choice: miaka sabini
  rationale: Kirai hiki kinaonyesha umri wa Kenani wakati alipomzaa Mahalaleli; mpangilio huu ni mfupi na unaeleweka katika muktadha wa nasaba.
- source_word: וַיּוֹלֶד
  choice: kisha akamzaa
  rationale: Katika nasaba, ילד humaanisha mwanaume kumzaa mtoto, yaani kuwa baba yake. ‘Kisha’ huonyesha mwendelezo wa simulizi unaowakilishwa na kiunganishi cha Kiebrania.
- source_word: אֶת
  choice: '[hakijatafsiriwa kivyake]'
  rationale: Hiki ni kiashiria cha yambwa mahsusi katika Kiebrania na hakina neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: מַהֲלַלְאֵל
  choice: Mahalaleli
  rationale: Jina limetoholewa kutoka umbo la Kiebrania na kupewa mwisho unaorahisisha matamshi ya Kiswahili.
