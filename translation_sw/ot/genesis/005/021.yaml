lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi חיה kinaonyesha muda wa maisha hadi tukio la kumzaa mwana; “aliishi” ni tafsiri ya kawaida na ya asili kwa Kiswahili.
- source_word: חֲנוֹךְ
  choice: Henoko
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: miaka sitini na mitano
  rationale: Mpangilio huu wa nambari ni wa kawaida katika Kiswahili cha sasa na unahifadhi kwa usahihi umri uliotajwa.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Katika nasaba, ילד ikiwa na mhusika wa kiume humaanisha kumzaa au kuwa baba wa mtoto. “Akamzaa” ni fupi, ya asili, na inadumisha mfuatano wa simulizi wa kiambishi וַ־.
- source_word: אֶת
  choice: '[haijatafsiriwa kando]'
  rationale: Hiki ni kiashiria cha yambwa tendwa katika Kiebrania na hakina neno linalolingana moja kwa moja katika Kiswahili.
- source_word: מְתוּשָׁלַח
  choice: Methusela
  rationale: Jina limetoholewa kwa umbo linalotambulika na lililozoeleka katika Kiswahili.
