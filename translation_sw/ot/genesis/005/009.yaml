  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: sw
  text: Enoshi aliishi miaka tisini, akamzaa Kenani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba unaotaja umri, kitenzi חיה humaanisha kwamba mtu aliishi muda uliotajwa; “aliishi” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: אֱנוֹשׁ
  choice: Enoshi
  rationale: Jina limetoholewa kutoka umbo la Kiebrania Enosh kwa kuzingatia matamshi na tahajia ya kawaida ya Kiswahili.
- source_word: תִּשְׁעִים שָׁנָה
  choice: miaka tisini
  rationale: Huu ndio mpangilio wa kawaida wa Kiswahili wa kutaja umri au muda, ingawa Kiebrania hutumia nomino ya umoja katika muundo huu.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Hiphil ya ילד katika nasaba humtaja mwanaume kama mzazi aliyemzaa mtoto. “Akamzaa” ni fupi, ya asili katika Kiswahili, na inaendeleza mfuatano wa simulizi.
- source_word: אֶת
  choice: '[haijatafsiriwa kivyake]'
  rationale: Ni alama ya yambwa mahususi katika Kiebrania, isiyo na maana ya kileksika inayohitaji neno tofauti katika Kiswahili.
- source_word: קֵינָן
  choice: Kenani
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania Kenan kwa kufuata maumbo ya majina yaliyozoeleka katika Kiswahili.
