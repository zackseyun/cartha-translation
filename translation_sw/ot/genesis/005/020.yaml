  text: So all the days of Yered were nine hundred and sixty-two years[a], and he died.
translation:
  language: sw
  text: Hivyo, siku zote za Yeredi zilikuwa miaka mia tisa na sitini na miwili, naye akafa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Hivyo, ... zilikuwa
  rationale: Kitenzi cha mfululizo wa simulizi kinatanguliza muhtasari wa maisha; “Hivyo” kinaonyesha matokeo ya hesabu iliyotangulia kwa Kiswahili cha kawaida.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Inahifadhi nahau ya nasaba ya Kiebrania inayomaanisha jumla ya muda wa maisha, huku ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: יֶרֶד
  choice: Yeredi
  rationale: Unukuzi huu unakaribia umbo la jina la Kiebrania na una muundo unaotamkika kwa urahisi katika Kiswahili.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: miaka mia tisa sitini na miwili
  rationale: Vipashio vya hesabu ya Kiebrania vimepangwa kwa utaratibu wa kawaida wa Kiswahili, bila kurudia neno “miaka”.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Inahifadhi fomula ya kufunga taarifa za nasaba na kuunganisha kishazi kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “siku zote za” umehifadhiwa kwa ukaribu na Kiebrania badala ya kufafanua kuwa “muda wote wa maisha.” Hakuna tanbihi iliyohitajika kwa kuwa Yeredi ni unukuzi wa moja kwa moja unaofaa katika Kiswahili.
