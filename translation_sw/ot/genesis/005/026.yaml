lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika simulizi la ukoo, kitenzi hiki kinataja muda ambao Methusela aliendelea kuishi baada ya kuzaliwa kwa mwana aliyetajwa.
- source_word: מְתוּשֶׁלַח
  choice: Methusela
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת לֶמֶךְ
  choice: Baada ya kumzaa Lameki
  rationale: Huhifadhi uhusiano wa wakati na maana ya Hiphil ya ילד kwamba Methusela alimzaa Lameki; ni usemi mfupi na wa kawaida katika Kiswahili.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: miaka 782
  rationale: Jumla ya Kiebrania, ambayo mpangilio wake halisi ni miaka miwili na themanini na miaka mia saba, imetolewa kwa tarakimu kwa uwazi bila kupoteza maana.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: akazaa wana na mabinti
  rationale: Kitenzi 'akazaa' kinaendeleza mfuatano wa simulizi, na 'wana na mabinti' huhifadhi utajo wa wazi wa watoto wa kiume na wa kike.
