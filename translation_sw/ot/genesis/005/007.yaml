base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/007.yaml
  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: sw
  text: Baada ya Sethi kumzaa Enoshi, aliishi miaka mia nane na saba, akazaa wana na mabinti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi hiki katika ukoo kinaeleza muda ambao Sethi aliendelea kuishi baada ya kuzaliwa kwa Enoshi; “aliishi” ni Kiswahili cha kawaida na sahihi.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת אֱנוֹשׁ
  choice: Baada ya kumzaa Enoshi
  rationale: “Baada ya” linaonyesha ufuatano wa wakati, na “kumzaa” linahifadhi maana ya kiukoo ya kitenzi ילד katika kausativi, huku Sethi akiwa baba aliyetajwa.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: miaka mia nane na saba
  rationale: Mpangilio wa nambari umewekwa katika mtindo wa kawaida wa Kiswahili bila kubadili jumla ya miaka 807.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Muundo huu unaendeleza simulizi na kueleza kwamba Sethi alipata watoto wengine; “akazaa” ni wa asili katika Kiswahili na unaendana na kitenzi cha awali.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Tafsiri hii inadumisha kutajwa wazi kwa watoto wa kiume na wa kike badala ya kutumia neno la jumla “watoto”.
