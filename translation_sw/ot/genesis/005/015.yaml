  language: sw
  text: Mahalaleli aliishi miaka sitini na mitano, akamzaa Yaredi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi hiki kinaonyesha miaka aliyoishi kabla ya tukio linalofuata; “aliishi” ni Kiswahili cha kawaida na sahihi.
- source_word: מַהֲלַלְאֵל
  choice: Mahalaleli
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Biblia za Kiswahili badala ya kutafsiri maana yake.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: miaka sitini na mitano
  rationale: Mpangilio wa Kiebrania ni ‘miaka mitano na mwaka sitini’; mpangilio umegeuzwa kuwa wa kawaida katika Kiswahili huku thamani kamili ya miaka 65 ikihifadhiwa.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Katika nasaba, ילד humaanisha mwanaume kumzaa mtoto, yaani kuwa baba yake. “Akamzaa” ni usemi mfupi, wa kawaida, na unaohifadhi mfuatano wa simulizi.
- source_word: אֶת יָרֶד
  choice: Yaredi
  rationale: אֶת ni kiashiria cha yambwa mahsusi na hakihitaji neno tofauti katika Kiswahili; jina limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia za Kiswahili.
