base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: sw
  text: Baada ya kumzaa Mahalaleli, Kenani aliishi miaka mia nane na arobaini, naye akazaa wana na binti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika nasaba za Mwanzo, kitenzi hiki huonyesha muda ambao mtu aliendelea kuishi; “aliishi” ni Kiswahili cha kawaida na sahihi.
- source_word: קֵינָן
  choice: Kenani
  rationale: Umbo la jina linalofuata matamshi ya Kiebrania na muundo unaoeleweka katika Kiswahili.
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Huonyesha kipindi kilichofuata kuzaliwa kwa Mahalaleli.
- source_word: הוֹלִידוֹ
  choice: kumzaa
  rationale: Hiphil ya ילד ikiwa na mhusika wa kiume humaanisha kusababisha kuzaliwa au kuwa baba wa mtoto. Kiswahili hutumia “zaa” pia kwa baba katika muktadha huu wa nasaba.
- source_word: מַהֲלַלְאֵל
  choice: Mahalaleli
  rationale: Unukuzi wa jina la Kiebrania uliorekebishwa kwa matamshi na maumbo ya Kiswahili.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: miaka mia nane na arobaini
  rationale: Hutoa jumla ileile ya miaka 840 kwa mpangilio wa kawaida wa namba katika Kiswahili.
- source_word: וַיּוֹלֶד
  choice: naye akazaa
  rationale: Hudumisha uhusiano wa kileksia na “kumzaa” huku ikitoa mfuatano wa kawaida wa kisimulizi katika Kiswahili.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Hifadhi tofauti ya wazi ya Kiebrania kati ya watoto wa kiume na wa kike badala ya kutumia neno la jumla “watoto”.
