  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio “Baada ya kumzaa Mahalaleli” ni wa asili katika Kiswahili na unaweka wazi kwamba miaka 840 ni kipindi baada ya kuzaliwa kwake. “Wana na binti” ni usemi wa kibiblia lakini bado unaeleweka kwa urahisi.
