  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: sw
  text: Basi siku zote za Lameki zilikuwa miaka mia saba na sabini na saba,[a] naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kihalisi, Kiebrania hupanga idadi hii hivi: “miaka sabini na saba, na miaka mia saba”; yaani, miaka 777.'
    reason: Mpangilio wa idadi katika Kiebrania ni tofauti na mpangilio wa kawaida wa Kiswahili.
lexical_decisions:
- source_word: וַיְהִי
  choice: Basi, ... zilikuwa
  rationale: Muundo huu unatoa muhtasari wa mfululizo wa simulizi. “Basi” huhifadhi uhusiano huo kwa Kiswahili cha kawaida, huku “zilikuwa” ikikamilisha sentensi ya idadi ya siku.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Huu ni msemo wa Kiebrania unaomaanisha jumla ya muda wa maisha; tafsiri hii huhifadhi taswira ya chanzo na inaeleweka kwa urahisi.
- source_word: לֶמֶךְ
  choice: Lameki
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: mia saba sabini na saba
  rationale: Kiebrania hutaja vitengo, makumi, kisha mamia; Kiswahili cha kawaida hupanga jumla hiyo kuwa 777 kwa mpangilio huu wa asili.
- source_word: שָׁנָה
  choice: miaka
  rationale: Ingawa Kiebrania hutumia umbo la umoja katika muundo huu wa namba, Kiswahili huhitaji wingi “miaka” baada ya idadi hii.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huhifadhi hitimisho fupi na lenye uzito linalorudiwa katika nasaba ya Mwanzo 5, na kiunganishi huendeleza mfululizo wa simulizi.
theological_decisions:
- issue: Mfumo wa kutaja muda wa maisha katika nasaba ya Mwanzo 5
  choice: Kutaja miaka 777 moja kwa moja kama muhtasari wa muda wa maisha, bila maelezo ya kiufafanuzi ndani ya aya.
  alternative: Kutafsiri idadi hiyo kuwa ya kiishara au kuitilia shaka ndani ya tafsiri.
  rationale: Maandishi ya Kiebrania yanatoa idadi ya miaka na taarifa ya kifo moja kwa moja. Tafsiri haipaswi kuingiza ufafanuzi wa kiishara au msimamo mwingine ambao maandishi yenyewe hayasemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Msemo “siku zote za” umehifadhiwa ili kuakisi mtindo wa nasaba ya Kiebrania, huku idadi ikiwekwa katika mpangilio wa kawaida wa Kiswahili.
