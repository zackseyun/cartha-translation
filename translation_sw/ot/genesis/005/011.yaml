lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: zilikuwa
  rationale: Katika muhtasari huu wa nasaba, kitenzi hiki kinaeleza jumla ya muda wa maisha; “zilikuwa” ni cha asili na kinaendana na kiima “siku.”
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Huhifadhi muundo wa kawaida wa Kiebrania wa kueleza muda wote wa maisha huku ikibaki wazi na ya kawaida katika Kiswahili.
- source_word: אֱנוֹשׁ
  choice: Enoshi
  rationale: Umbo hili linaakisi jina la Kiebrania Enosh kwa namna inayotamkika kwa kawaida katika Kiswahili.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: miaka mia tisa na mitano
  rationale: Mpangilio wa namba umewekwa kwa desturi ya Kiswahili ili kuwasilisha kwa uwazi jumla ya miaka 905, badala ya kuiga kwa ugumu mpangilio wa Kiebrania.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huhifadhi fomula ya kufunga taarifa ya nasaba; “naye” huunganisha kwa kawaida matokeo hayo na mhusika aliyetajwa.
