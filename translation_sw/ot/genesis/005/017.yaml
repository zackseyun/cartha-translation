lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: zilikuwa
  rationale: Katika ka formula ya ukoo, kitenzi hiki kinajumlisha muda wote wa maisha; “zilikuwa” ni cha asili katika Kiswahili na kinakubaliana na “siku.”
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Huhifadhi kwa uwazi nahau ya Kiebrania na msisitizo wake wa kujumuisha maisha yote, badala ya kuibadili kuwa “umri.”
- source_word: מַהֲלַלְאֵל
  choice: Mahalaleli
  rationale: Jina limetoholewa kwa namna inayotambulika na kutamkika kwa Kiswahili, kwa kufuata matumizi ya kawaida ya majina ya Biblia.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: miaka mia nane tisini na mitano
  rationale: Mpangilio wa idadi umewekwa katika Kiswahili cha kawaida huku thamani kamili ya miaka 895 ikihifadhiwa; neno “miaka” halijarudiwa kwa kuwa Kiswahili hulitumia mara moja kwa idadi nzima.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huhifadhi hitimisho la kawaida na lenye uzito katika Mwanzo 5, huku “naye” ikiunganisha kwa kawaida na mhusika aliyetajwa.
