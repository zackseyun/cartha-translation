base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: sw
  text: Henoko alitembea pamoja na Mungu[a] kwa miaka mia tatu baada ya kumzaa Methusela, naye akazaa wana na mabinti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliishi katika ushirika na Mungu.” Nahau ya Kiebrania ni, kwa maana halisi, “alitembea pamoja na Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: alitembea pamoja na
  rationale: Nahau ya Kiebrania inahifadhiwa kwa sitiari ya kutembea, huku “pamoja na” ikionyesha uhusiano wa karibu unaodokezwa na muktadha.
- source_word: אֶת הָאֱלֹהִים
  choice: pamoja na Mungu
  rationale: Katika nahau hii אֶת ina maana ya uhusiano wa kuwa pamoja; “Mungu” ni namna ya kawaida na yenye heshima katika Kiswahili.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: baada ya kumzaa Methusela
  rationale: Inaonyesha wazi kwamba kuzaliwa kwa Methusela kulitangulia kipindi cha miaka mia tatu. “Kumzaa” huhifadhi maana ya mzazi wa kiume ya kausativi ya ילד bila kutumia lugha ya kizamani.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: kwa miaka mia tatu
  rationale: “Kwa” huonyesha kwa kawaida muda uliodumu tendo katika Kiswahili na kuondoa uwezekano wa kuunganisha miaka hiyo kimakosa na kumzaa Methusela.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: naye akazaa wana na mabinti
  rationale: Tafsiri inataja jinsia zote kama Kiebrania badala ya kuzijumlisha kwa neno “watoto”; “naye” huunganisha sentensi kwa ufasaha.
theological_decisions:
- issue: Maana ya uhusiano wa Henoko na Mungu katika nahau “alitembea pamoja na Mungu”
  choice: Kuhifadhi sitiari ya kutembea pamoja na Mungu katika matini kuu
  alternative: aliishi katika ushirika na Mungu
  rationale: Sitiari ya Kiebrania ina uzito wa kitheolojia na inaacha wazi upana wa uhusiano huo; tafsiri ya ufafanuzi ingeubana maana bila ulazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa maneno unaweka wazi kwamba miaka mia tatu ni muda ambao Henoko alitembea pamoja na Mungu baada ya kuzaliwa kwa Methusela.
