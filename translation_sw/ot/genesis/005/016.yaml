  text: Baada ya Mahalaleli kumzaa Yaredi, aliishi miaka mia nane na thelathini, akazaa wana na mabinti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi חיה katika muundo huu wa nasaba kinaeleza muda ambao Mahalaleli aliendelea kuishi baada ya kuzaliwa kwa mwana aliyetajwa.
- source_word: מַהֲלַלְאֵל
  choice: Mahalaleli
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Baada ya kumzaa
  rationale: Kirai hiki kinaonyesha wakati uliofuata baada ya Mahalaleli kuwa baba yake Yaredi; ‘kumzaa’ ni usemi wa kawaida wa Kiswahili kwa mwanaume kuzaa mtoto.
- source_word: יֶרֶד
  choice: Yaredi
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayoeleweka kwa wasomaji wa Kiswahili.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: miaka mia nane na thelathini
  rationale: Mpangilio wa namba umewekwa kwa mtindo wa kawaida wa Kiswahili huku jumla ya miaka 830 ikihifadhiwa.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi ילד katika kauli ya Hifili hapa humaanisha kuwa baba au kuzaa; ‘akazaa’ ni fasaha na kinaendeleza mfululizo wa simulizi.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Tafsiri hii inahifadhi utajo wa wazi wa watoto wa kiume na wa kike badala ya kutumia neno la jumla ‘watoto’.
