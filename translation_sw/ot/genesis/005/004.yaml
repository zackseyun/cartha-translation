  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: sw
  text: Baada ya Adamu kuwa baba wa Sethi[a], aliishi miaka mia nane, akawa baba wa wana na binti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “siku za Adamu ... zilikuwa miaka mia nane” baada ya yeye kuwa baba wa Sethi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: Adamu aliishi
  rationale: Kiebrania husema kihalisi kwamba “siku za Adamu ... zilikuwa”; Kiswahili cha kawaida hutumia “Adamu aliishi” kueleza muda wa maisha kwa uwazi na kwa uasilia.
- source_word: אָדָם
  choice: Adamu
  rationale: Katika nasaba hii neno hilo ni jina la mtu maalumu, si rejeleo la jumla kwa mwanadamu.
- source_word: אַחֲרֵי
  choice: Baada ya
  rationale: Ni kihusishi cha wakati kinachoonyesha kipindi kinachofuata tukio lililotajwa.
- source_word: הוֹלִידוֹ
  choice: kumzaa
  rationale: Hifili ya ילד hapa ina maana ya kumzaa au kuwa baba wa mtoto. “Kumzaa” ni ya kawaida katika Kiswahili na inadumisha uhusiano wa moja kwa moja wa nasaba.
- source_word: אֶת שֵׁת
  choice: Sethi
  rationale: אֶת ni kiashiria cha yambwa mahususi kisichohitaji kutafsiriwa; שֵׁת limetoholewa kama jina “Sethi” kwa matumizi ya kawaida ya Kiswahili.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: miaka mia nane
  rationale: Hii ni idadi ya moja kwa moja inayoonyesha muda wa miaka 800.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi kinatokana na mzizi uleule ילד. “Akazaa” kinaendeleza mtiririko wa simulizi na maana ya kupata uzao.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; “wana na binti” huhifadhi utofautishaji huo badala ya kuujumlisha kama “watoto” tu.
theological_decisions:
- issue: Maana ya אָדָם
  choice: Adamu kama jina la mtu
  alternative: mwanadamu
  rationale: Muktadha wa nasaba unamtaja mtu aliyepewa jina, Adamu, wala si wanadamu kwa ujumla.
