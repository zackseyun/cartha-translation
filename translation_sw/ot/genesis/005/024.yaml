base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: sw
  text: Henoko alitembea pamoja na Mungu, naye hakuwapo tena[a], kwa sababu Mungu alimchukua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana halisi zaidi, “naye hakuwapo.” Usemi wa Kiebrania unaonyesha kwamba Henoko hakuwapo pale tena.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: alitembea
  rationale: Kitenzi katika hitpaeli kinaonyesha mwenendo wa maisha unaoendelea, si mwendo wa kimwili tu. “Alitembea” linahifadhi tamathali ya Kiebrania na maana yake ya uhusiano na mwenendo.
- source_word: אֶת הָאֱלֹהִים
  choice: pamoja na Mungu
  rationale: Baada ya kitenzi הלך, אֶת huonyesha kuandamana. “Pamoja na Mungu” ni Kiswahili cha kawaida kinachohifadhi nguvu ya uhusiano katika usemi huo.
- source_word: וְאֵינֶנּוּ
  choice: naye hakuwapo tena
  rationale: Usemi huu kwa maana halisi ni “naye hakuwapo.” Neno “tena” linaeleza kwamba Henoko hakuwa pale tena bila kufafanua kupita kiasi jinsi alivyoondoka.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatanguliza sababu ya kutokuwapo kwa Henoko.
- source_word: לָקַח אֹתוֹ
  choice: alimchukua
  rationale: לקח kwa kawaida humaanisha “chukua.” Tafsiri hii inadumisha ufupi wa Kiebrania bila kuongeza alikopelekwa au namna ya kuchukuliwa kwake.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu nomino hii inamtaja Mungu mmoja wa simulizi.
theological_decisions:
- issue: Iwapo ielezwe wazi kwamba Henoko hakufa au alihamishwa kwenda mbinguni
  choice: 'Kudumisha usemi wenye tahadhari wa kifungu: “naye hakuwapo tena, kwa sababu Mungu alimchukua.”'
  alternative: “hakufa”; “Mungu alimchukua kwenda mbinguni”; au “Mungu alimhamisha”
  rationale: Kifungu kinaashiria tendo la pekee la Mungu, lakini Kiebrania hakisemi wazi “kwenda mbinguni” wala hakikanushi kifo moja kwa moja hapa. Tafsiri haiongezi ufafanuzi wa baadaye na hivyo inadumisha mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Alitembea pamoja na Mungu” linadumisha tamathali ya asili huku likieleweka kama mwenendo wa maisha, na “hakuwapo tena” ni la kawaida bila kueleza zaidi ya matini.
