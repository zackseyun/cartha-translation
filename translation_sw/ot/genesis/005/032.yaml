lexical_decisions:
- source_word: וַיְהִי
  choice: alipokuwa
  rationale: Katika muktadha huu, kitenzi kinaanzisha hali ya wakati. “Alipokuwa” ni Kiswahili cha kawaida kinachounganisha umri wa Nuhu na tendo linalofuata bila kutumia fomula nzito ya kisimulizi.
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: na umri wa miaka mia tano
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau ya Kiebrania בן pamoja na idadi ya miaka.
- source_word: וַיּוֹלֶד
  choice: akawazaa
  rationale: Katika kausativi ya Kiebrania na ikiwa mtendaji ni mwanamume, kitenzi hiki humaanisha kuzaa watoto kama baba. “Akawazaa” ni wazi, kifupi na cha kawaida katika Kiswahili.
- source_word: נֹחַ
  choice: Nuhu
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili sanifu.
- source_word: שֵׁם
  choice: Shemu
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: חָם
  choice: Hamu
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: יָפֶת
  choice: Yafethi
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Shemu, Hamu na Yafethi
  rationale: Viashiria vya yambwa vya Kiebrania havihitaji kutafsiriwa; orodha imetolewa kwa mpangilio wa maandishi ya Kiebrania na kwa uunganishaji wa kawaida wa Kiswahili.
theological_decisions:
- issue: Je, mpangilio wa Shemu, Hamu na Yafethi unaonyesha mpangilio wao wa kuzaliwa au kwamba wote walizaliwa mwaka mmoja?
  choice: Kudumisha mpangilio wa majina katika Kiebrania bila kuongeza dai kuhusu mpangilio wa kuzaliwa au mwaka mmoja wa kuzaliwa.
  alternative: Kupanga majina kulingana na mpangilio unaodhaniwa wa kuzaliwa, au kutafsiri kana kwamba wote watatu walizaliwa Nuhu alipokuwa na miaka mia tano.
  rationale: Mstari unataja umri wa Nuhu na wana hao, lakini mpangilio wa orodha si lazima uwe mpangilio wa kuzaliwa, wala maneno hayalazimishi hitimisho kwamba wote walizaliwa mwaka mmoja. Tanbihi huhifadhi mvutano huo bila kuingiza upatanisho katika matini.
- issue: Kurudiwa kwa jina נֹחַ katika vifungu viwili
  choice: Kutumia kiambishi cha nafsi katika “akawazaa” baada ya jina “Nuhu” kutajwa mwanzoni.
  alternative: 'Kurudia jina: “Nuhu ... Nuhu akawazaa.”'
  rationale: Kurudia jina ni kawaida katika mtindo wa kisimulizi wa Kiebrania, lakini Kiswahili sanifu hutumia kiambishi cha nafsi kwa urahisi wakati mtendaji yuko wazi. Hakuna maana inayopotea.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida, huku ukidumisha mpangilio wa majina na maana ya msingi ya Kiebrania.
