lexical_decisions:
- source_word: וַיְהִי
  choice: Basi, ... zilikuwa
  rationale: Muundo huu unawasilisha hitimisho la mfululizo wa simulizi kwa Kiswahili cha kawaida bila kuiga mpangilio wa kitenzi wa Kiebrania kwa namna isiyo ya asili.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Tafsiri hii inadumisha nahau halisi ya Kiebrania inayomaanisha jumla ya muda wa maisha, huku ikibaki wazi na ya asili kwa Kiswahili.
- source_word: חֲנוֹךְ
  choice: Henoko
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: mia tatu sitini na mitano
  rationale: Mpangilio wa namba umewekwa kwa namna ya kawaida katika Kiswahili cha kisasa, huku jumla ya miaka 365 ikihifadhiwa.
- source_word: שָׁנָה ... שָׁנָה
  choice: miaka
  rationale: Ingawa Kiebrania hutumia nomino ya umoja katika muundo huu wa namba, Kiswahili sanifu hutumia wingi “miaka”.
