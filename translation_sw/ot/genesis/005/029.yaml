base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: sw
  text: Akamwita Noa[a], akisema, “Huyu ndiye atakayetufariji kutokana na kazi yetu na taabu ya mikono yetu, na kutokana na ardhi ambayo Yahwe ameilaani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina “Noa” linasikika kama neno la Kiebrania linalohusiana na “pumziko” au “nafuu.” Kuna mchezo wa sauti kati ya jina hilo na kitenzi kilichotafsiriwa “atatufariji”; yaweza pia kutafsiriwa “atatuletea nafuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ נֹחַ
  choice: Akamwita Noa
  rationale: Katika Kiswahili, ‘akamwita Noa’ ni njia ya kawaida na wazi ya kuwasilisha fomula ya Kiebrania ya kumpa jina, bila kutumia muundo mzito wa ‘akaliita jina lake.’
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno ya moja kwa moja na kudumisha mtiririko wa simulizi.
- source_word: זֶה
  choice: Huyu ndiye
  rationale: Hudumisha nguvu ya kiashiria kinachomwelekeza mtoto huyu hasa, kwa Kiswahili cha kawaida.
- source_word: יְנַחֲמֵנוּ
  choice: atakayetufariji
  rationale: Kitenzi נחם kwa kawaida humaanisha kufariji au kutuliza. ‘Atakayetufariji’ hudumisha maana yake ya moja kwa moja, huku tanbihi ikieleza mchezo wa sauti unaohusisha jina Noa na wazo la pumziko au nafuu.
- source_word: מִמַּעֲשֵׂנוּ
  choice: kutokana na kazi yetu
  rationale: מַעֲשֶׂה hapa inahusu kazi au shughuli ya binadamu, si matendo kwa maana ya kimaadili.
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: na taabu ya mikono yetu
  rationale: ‘Taabu’ huwasilisha uchungu na usumbufu wa kazi unaorejelea Mwanzo 3:17; ‘ya mikono yetu’ hudumisha taswira ya Kiebrania ya kazi ya mikono.
- source_word: מִן־הָאֲדָמָה
  choice: inayotokana na ardhi
  rationale: Muundo huu unaunganisha taabu ya kazi na ardhi iliyolaaniwa kwa Kiswahili kinachoeleweka, huku ukihifadhi uhusiano na simulizi la laana ya ardhi.
- source_word: אֲשֶׁר אֵרְרָהּ
  choice: ambayo ... ameilaani
  rationale: Kishazi hiki kinarejelea ardhi; kiwakilishi ‘-i-’ kinakubaliana na nomino ‘ardhi’ katika matumizi ya kawaida ya Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu linatoholewa moja kwa moja badala ya kubadilishwa kwa cheo ‘BWANA’; ‘Yahwe’ ni umbo linalosomeka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Mchezo wa maneno kati ya נֹחַ na יְנַחֲמֵנוּ
  choice: Maandishi makuu yanatumia ‘atakayetufariji,’ na tanbihi inaeleza uhusiano wa sauti na ‘pumziko’ au ‘nafuu.’
  alternative: ‘atatuletea nafuu’ au ‘atatupumzisha’
  rationale: נחם humaanisha hasa kufariji, lakini jina Noa linasikika karibu na mzizi unaohusishwa na pumziko. Tafsiri kuu haibadilishi kitenzi kuwa ‘kupumzisha,’ jambo ambalo lingeficha tofauti ya kimofolojia; tanbihi huhifadhi mchezo wa majina na maana pana inayokusudiwa.
- issue: Uhusiano wa מִן־הָאֲדָמָה na vifungu vinavyotangulia
  choice: ‘inayotokana na ardhi’ inachukuliwa kuwa inafafanua taabu ya mikono yao.
  alternative: ‘atatufariji ... kutokana na ardhi’
  rationale: Kiebrania kinaweza kusikika kana kwamba ‘kutokana na ardhi’ linaunganishwa na mlolongo mzima wa faraja kutoka katika kazi na taabu. Kiswahili kilichochaguliwa huonyesha uhusiano wa karibu wa taabu na ardhi iliyolaaniwa bila kudai kuwa ardhi yenyewe ndiyo kitu pekee wanachofarijiwa kutoka kwake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Akamwita Noa’ umechaguliwa badala ya tafsiri ngumu ya neno kwa neno. ‘Yahwe’ limetumika kama jina la Mungu.
