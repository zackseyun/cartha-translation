lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: zilikuwa
  rationale: Katika muhtasari huu wa nasaba, kitenzi hiki kinafanya kazi kama kiunganishi rahisi; “zilikuwa” ni cha asili kwa Kiswahili.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Huhifadhi kwa uwazi na kwa Kiswahili cha kawaida mtindo unaorudiwa katika Mwanzo 5, badala ya kuufupisha kuwa “maisha yote ya.”
- source_word: מְתוּשֶׁלַח
  choice: Methusela
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת
  choice: mia tisa sitini na tisa
  rationale: Mpangilio wa namba umewekwa katika muundo wa kawaida wa Kiswahili, huku jumla ya miaka 969 ikihifadhiwa.
- source_word: שָׁנָה ... שָׁנָה
  choice: miaka
  rationale: Ingawa Kiebrania hutumia umbo la umoja katika muundo huu wa namba, Kiswahili sanifu hutumia wingi “miaka.”
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huhifadhi hitimisho la kawaida la simulizi huku kiwakilishi cha kuunganisha kikifanya sentensi iwe ya asili na wazi kwa Kiswahili.
