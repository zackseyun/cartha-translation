  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: sw
  text: Sethi aliishi miaka 105, akamzaa Enoshi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo rasmi zaidi, “akawa baba yake Enoshi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika fomula za nasaba, kitenzi חיה huonyesha muda ambao mtu aliishi kabla ya tukio linalofuata; “aliishi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: שֵׁת
  choice: Sethi
  rationale: “Sethi” ni umbo la jina linalotambulika katika Kiswahili sanifu na linalowakilisha jina la Kiebrania שֵׁת.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: miaka 105
  rationale: Usemi wa Kiebrania, kihalisi “miaka mitano na mwaka mia,” unamaanisha miaka 105; tarakimu hutoa maana hiyo kwa uwazi katika Kiswahili cha sasa.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Katika muktadha wa nasaba, ילד humaanisha kumzaa au kuwa baba wa mtoto. “Akamzaa” ni usemi mfupi, wa kawaida, na unaofaa kwa mtiririko wa simulizi.
- source_word: אֶת אֱנוֹשׁ
  choice: Enoshi
  rationale: Kiashiria cha yambwa אֶת hakihitaji kutafsiriwa; “Enoshi” ni umbo la Kiswahili linalotokana na jina la Kiebrania אֱנוֹשׁ.
