base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: sw
  text: Hiki ndicho kitabu cha vizazi vya Adamu.[b] Siku[a] Mungu alipomuumba mwanadamu, alimfanya kwa ufanano na Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu alipomuumba mwanadamu.” Nahau ya Kiebrania “katika siku” inaweza kutumiwa kwa maana ya wakati, yaani “wakati” au “alipo-.”
    reason: lexical_alternative
  - marker: b
    text: Neno la kwanza la Kiebrania ni jina “Adamu”; neno hilohilo linapotokea mara ya pili linaweza kumaanisha “mwanadamu” au “wanadamu,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: Hiki ndicho kitabu
  rationale: Kishazi nomino cha Kiebrania kinatanguliza kichwa cha habari; “Hiki ndicho” ni Kiswahili cha kawaida kinachowasilisha kiashirio hicho, huku “kitabu” kikidumisha maana ya hati iliyoandikwa.
- source_word: תּוֹלְדֹת
  choice: vizazi
  rationale: Neno hili kuu katika muundo wa Mwanzo linaweza kumaanisha vizazi, wazao, au habari inayowahusu; “vizazi” hudumisha istilahi pana bila kuifinyanga kuwa nasaba pekee.
- source_word: אָדָם (occurrence 1)
  choice: Adamu
  rationale: Katika kichwa cha nasaba, neno hili linamtaja babu mwenye jina Adamu, ambaye uzao wake unaorodheshwa baadaye.
- source_word: בְּיוֹם בְּרֹא
  choice: Siku ... alipomuumba
  rationale: Muundo wa Kiebrania unaonyesha wakati, kihalisi “katika siku ya kuumba”; Kiswahili hiki kinadumisha neno “siku” na wakati huohuo kinasomeka kwa kawaida.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi na muktadha vinaonyesha maana ya umoja; “Mungu” ndiyo tafsiri ya kawaida.
- source_word: אָדָם (occurrence 2)
  choice: mwanadamu
  rationale: Hapa neno linarejelea binadamu kwa ujumla katika simulizi la uumbaji, si lazima jina binafsi la Adamu. “Mwanadamu” huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: kwa kufanana na Mungu
  rationale: דְּמוּת humaanisha ufanano au mfanano. Usemi huu huepuka kulichanganya na צֶלֶם, “sura,” ambalo halipo katika mstari huu.
- source_word: עָשָׂה אֹתוֹ
  choice: alimfanya
  rationale: עָשָׂה ni “kufanya,” na kiambishi cha yambwa cha umoja katika “alimfanya” kinawakilisha kiwakilishi cha Kiebrania kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana mbili za אָדָם katika mstari mmoja
  choice: “Adamu” kama jina katika kichwa, kisha “mwanadamu” katika kifungu cha uumbaji
  alternative: Kutumia “Adamu” mara zote mbili, au “mtu” katika tukio la pili
  rationale: Mara ya kwanza neno linaanzisha nasaba ya mtu aliyeitwa Adamu; mara ya pili linaakisi uumbaji wa binadamu. Tofauti hii huhifadhi kazi mbili za neno la Kiebrania bila kudai kwamba tukio la pili linamhusu mtu mmoja tu.
- issue: Uhusiano wa דְּמוּת na lugha ya uumbaji katika Mwanzo
  choice: “kwa kufanana na Mungu”
  alternative: “kwa sura ya Mungu”
  rationale: Mstari huu una דְּמוּת, si צֶלֶם. Kutumia lugha ya kufanana hudumisha tofauti ya msamiati na hakupatanishi mstari kimyakimya na vifungu vinavyotumia “sura.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Hiki ndicho kitabu” huhifadhi mtindo wa kichwa rasmi; “kwa kufanana na Mungu” ni usemi wa sasa unaodumisha tofauti kati ya ‘ufanano’ na ‘sura.’
