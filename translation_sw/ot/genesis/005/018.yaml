  register: Kiswahili sanifu cha Afrika Mashariki; sentensi ni ya kisasa, yenye heshima na rahisi kueleweka. Muundo wa umri umetumiwa badala ya tafsiri neno kwa neno ya 'aliishi miaka 162' ili kuwasilisha kwa kawaida uhusiano wa wakati unaokusudiwa katika fomula ya nasaba.
