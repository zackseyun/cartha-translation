base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/018.yaml
  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: sw
  text: Yaredi alipokuwa na umri wa miaka 162, alimzaa Henoko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: alipokuwa na umri wa
  rationale: Katika fomula hii ya nasaba, kitenzi חיה pamoja na idadi ya miaka kinaeleza umri wa Yaredi kabla ya kumzaa mwana; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: יֶרֶד
  choice: Yaredi
  rationale: Jina limeandikwa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili, huku likikaribia matamshi ya Kiebrania Yered.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: miaka 162
  rationale: Mpangilio wa Kiebrania unatoa jumla ya miaka mia moja sitini na miwili; tarakimu zinaifanya taarifa ya nasaba isomeke kwa urahisi bila kubadili maana.
- source_word: וַיּוֹלֶד
  choice: alimzaa
  rationale: Katika nasaba, ילד katika kausativi humaanisha kwamba mwanamume alimzaa au akawa baba wa mtu; 'alimzaa' ni usemi mfupi, wa kawaida katika Kiswahili cha Biblia, na muktadha unaweka wazi uzazi wa baba.
- source_word: אֶת חֲנוֹךְ
  choice: Henoko
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi; Henoko ni umbo la jina linalotambulika katika Kiswahili.
