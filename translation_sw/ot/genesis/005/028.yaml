- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: miaka 182
  rationale: Mpangilio wa nambari wa Kiebrania umetolewa kwa mpangilio wa kawaida na ulio wazi katika Kiswahili.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Katika Hifili ikiwa mhusika ni mwanamume, ילד humaanisha kumzaa au kuwa baba wa mtoto; ‘akamzaa’ ni usemi mfupi, wa kawaida, na unaofaa katika nasaba.
- source_word: בֵּן
  choice: mwana
  rationale: Neno linamaanisha mwana wa kiume; Kiswahili hakihitaji kibainishi kisichodhahiri kama ‘a’ ya Kiingereza.
