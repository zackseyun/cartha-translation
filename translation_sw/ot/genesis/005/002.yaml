base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: sw
  text: Mwanamume na mwanamke aliwaumba; akawabariki na kuwapa jina “Mwanadamu”[a] siku walipoumbwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, Adamu. Neno hilo linaweza kumaanisha “mwanadamu” au “wanadamu” kwa ujumla, na pia ni jina binafsi Adamu.
    reason: alternative_reading
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: Mwanamume na mwanamke
  rationale: Hutofautisha jinsia hizo mbili kwa Kiswahili cha kawaida na chenye heshima, huku ukidumisha ulinganifu wa maneno ya Kiebrania.
- source_word: בְּרָאָם
  choice: aliwaumba
  rationale: Kitenzi cha umoja kinamrejelea Mungu, na kiambishi -wa- kinawarejelea wote wawili.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: akawabariki
  rationale: Ni usemi mfupi na wa kawaida unaohifadhi tendo la Mungu la kuwapa baraka.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: na kuwapa jina
  rationale: Huhifadhi wazo la jina moja walilopewa wote wawili, badala ya kulifanya kuwa majina tofauti.
- source_word: אָדָם
  choice: Mwanadamu
  rationale: Katika muktadha huu neno linawahusu mwanamume na mwanamke kwa pamoja. Umoja wa ‘Mwanadamu’ pia unaakisi jina moja la pamoja katika Kiebrania.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: siku walipoumbwa
  rationale: Ni Kiswahili cha asili kinachohifadhi wakati uliotajwa na hali ya kutendwa ya Kiebrania.
theological_decisions:
- issue: Maana ya pamoja ya אָדָם na uwezekano wa kuwa jina binafsi
  choice: Mwanadamu
  alternative: Adamu
  rationale: Kwa kuwa kifungu kinawataja mwanamume na mwanamke pamoja na kusema walipewa jina moja, maana ya pamoja ndiyo inayotawala. Tanbihi inadumisha uwezekano halisi wa kusoma umbo lilelile la Kiebrania kama jina ‘Adamu’, hasa kwa kuzingatia nasaba inayofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuwapa jina’ ni cha asili zaidi kuliko tafsiri ngumu ya neno kwa neno, huku ‘Mwanadamu’ likihifadhi umoja wa jina la pamoja.
