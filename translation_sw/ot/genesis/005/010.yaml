base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: sw
  text: Baada ya Enoshi kumzaa Kenani, aliishi miaka mia nane na kumi na mitano, akazaa wana na binti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi חיה katika mtindo huu wa nasaba kina maana ya kuishi kwa muda uliotajwa; “aliishi” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: אֱנוֹשׁ
  choice: Enoshi
  rationale: Umbo “Enoshi” linafuata kwa karibu jina la Kiebrania Enosh huku likitumia umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Hiki ni kihusishi cha wakati kinachoonyesha kipindi kilichofuata kuzaliwa kwa Kenani.
- source_word: הוֹלִידוֹ
  choice: kumzaa
  rationale: Hifili ya ילד katika nasaba humaanisha kuwa baba au kuzaa. Katika Kiswahili, “kumzaa” hutumiwa pia kumhusu baba na ni ya kawaida kuliko maelezo marefu “kuwa baba yake.”
- source_word: אֶת קֵינָן
  choice: Kenani
  rationale: Alama ya yambwa אֶת haitafsiriwi; “Kenani” linaakisi jina la Kiebrania קֵינָן badala ya umbo lililoathiriwa na Kigiriki.
- source_word: חֲמֵשׁ עֶשְׂרֵה ... וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: miaka mia nane na kumi na mitano
  rationale: Kiebrania hutaja 15 + 800; mpangilio huu ni wa kawaida katika Kiswahili na huhifadhi jumla ya miaka 815.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi cha nasaba ילד kimetafsiriwa kwa uthabiti kama “kuzaa”; kiambishi “aka-” kinaendeleza mfululizo wa matukio kwa kawaida.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; “wana na binti” huhifadhi tofauti hiyo badala ya kutumia “watoto” kwa ujumla.
theological_decisions: []
