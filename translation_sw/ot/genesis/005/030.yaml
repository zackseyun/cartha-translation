base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: sw
  text: Baada ya kumzaa Nuhu, Lameki aliishi miaka mingine 595, akazaa wana na binti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba wa Mwanzo 5, kitenzi hiki kinaonyesha muda ambao Lameki aliendelea kuishi baada ya tukio lililotajwa.
- source_word: אַֽחֲרֵי
  choice: baada ya
  rationale: Ni kihusishi cha wakati kinachoonyesha kipindi kilichofuata kuzaliwa kwa Nuhu.
- source_word: הוֹלִידוֹ
  choice: kumzaa
  rationale: Hiphil ya ילד katika nasaba humaanisha kuwa baba wa mtoto. Kiswahili hutumia kwa kawaida 'kumzaa' kwa mzazi wa kiume pia, na muktadha unamtambulisha Lameki wazi kuwa baba.
- source_word: נֹחַ
  choice: Nuhu
  rationale: Jina limetolewa kwa umbo lililozoeleka katika tafsiri na matumizi ya Biblia ya Kiswahili.
- source_word: חָמֵשׁ וְתִשְׁעִים ... וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: miaka mingine 595
  rationale: Kiebrania kinatoa jumla ya miaka 95 pamoja na 500. Kiswahili cha kawaida huweka jumla hiyo kama 595; 'mingine' huonyesha wazi kuwa hii ni miaka baada ya kuzaliwa kwa Nuhu.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Huhifadhi maana ya kuwa baba wa watoto katika nasaba na pia mwendelezo wa simulizi unaoonyeshwa na wayyiqtol.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Huhifadhi kutajwa kwa watoto wa kiume na wa kike badala ya kulainisha kuwa 'watoto' kwa ujumla.
