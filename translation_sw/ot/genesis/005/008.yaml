lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: zilikuwa
  rationale: Kitenzi hiki katika muundo wa nasaba kinatoa muhtasari wa jumla ya siku za maisha; “zilikuwa” ni Kiswahili cha kawaida kinachodumisha maana ya moja kwa moja.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Hii inadumisha nahau ya Kiebrania na urudiaji wake wa kimakusudi katika Mwanzo 5, huku ikieleweka kwa msomaji wa Kiswahili.
- source_word: שֵׁת
  choice: Sethi
  rationale: Jina limetolewa kwa umbo lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: שְׁתֵּים עֶשְׂרֵה ... וּתְשַׁע מֵאוֹת שָׁנָה
  choice: miaka mia tisa na kumi na miwili
  rationale: Kiebrania kinataja kumi na miwili kisha mia tisa; Kiswahili huweka tarakimu katika mpangilio huu wa kawaida bila kubadili jumla ya miaka 912.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Kauli hii fupi inadumisha fomula nzito inayorudiwa mwishoni mwa taarifa za nasaba na kuunganisha sentensi kwa kawaida katika Kiswahili.
