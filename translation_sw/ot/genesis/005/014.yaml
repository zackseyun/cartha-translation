lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Basi, ... zilikuwa
  rationale: Muundo huu unaendeleza simulizi la ukoo; “Basi” huonyesha mwendelezo kwa Kiswahili cha kawaida bila kufanya sentensi iwe ngumu.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Huhifadhi kwa karibu tamko la Kiebrania linalorudiwa katika nasaba hii, huku likimaanisha jumla ya muda wa maisha.
- source_word: קֵינָן
  choice: Kenani
  rationale: Umbo hili la jina limezoeleka katika Kiswahili na linaakisi jina la Kiebrania kuliko umbo lililoathiriwa na mapokeo ya Kigiriki.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: miaka mia tisa na kumi
  rationale: Mpangilio wa idadi umewekwa katika namna ya kawaida ya Kiswahili, bila kubadili thamani ya miaka 910.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huhifadhi hitimisho rahisi na la moja kwa moja la nasaba, huku kiunganishi “naye” kikirejelea Kenani kwa uwazi.
