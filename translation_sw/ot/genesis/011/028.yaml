  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: sw
  text: Harani akafa mbele ya baba yake Tera[a], katika nchi alikozaliwa, huko Uru ya Wakaldayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kabla ya baba yake Tera,” yaani, baba yake akiwa bado hai. Nahau ya Kiebrania kihalisi ni “juu ya uso wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Wayyiqtol ya מות inasimulia tukio la wakati uliopita moja kwa moja; “akafa” ni Kiswahili cha kawaida na cha masimulizi.
- source_word: עַל־פְּנֵי
  choice: mbele ya
  rationale: Kauli hii inaweza kumaanisha mbele ya mtu au kabla yake kwa maana ya kufa wakati mtu huyo angali hai. “Mbele ya” huhifadhi taswira na utata wa Kiebrania, huku tanbihi ikieleza maana nyingine inayowezekana.
- source_word: תֶּרַח אָבִיו
  choice: baba yake Tera
  rationale: Muundo huu unamtambulisha Tera kuwa baba ya Harani; mpangilio huu ni wa asili katika Kiswahili.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: katika nchi alikozaliwa
  rationale: מוֹלֶדֶת hurejelea nchi au mahali pa kuzaliwa na asili; tafsiri hii ni wazi na ya kawaida.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: huko Uru ya Wakaldayo
  rationale: אוּר limetoholewa kama jina la mahali “Uru,” na כַּשְׂדִּים limetafsiriwa kwa jina la watu “Wakaldayo.” “Huko” huonyesha kwa kawaida kwamba ni mahali maalumu.
