lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika simulizi la nasaba, kitenzi חיה kinaonyesha kuendelea kuishi kwa muda uliotajwa; “aliishi” ni Kiswahili cha kawaida na sahihi.
- source_word: שֵׁם
  choice: Shemu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: אַחֲרֵי
  choice: Baada ya
  rationale: Kihusishi hiki kinaonyesha kipindi kilichofuata kuzaliwa kwa Arpakshadi.
- source_word: הוֹלִידוֹ
  choice: kumzaa
  rationale: Hifili ya ילד katika nasaba humaanisha mwanaume kuwa mzazi wa mtoto; “kumzaa” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo katika muktadha.
- source_word: אַרְפַּכְשָׁד
  choice: Arpakshadi
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalotambulika na linalofuata sauti za jina la Kiebrania.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: miaka mia tano
  rationale: Huu ndio mpangilio wa kawaida wa Kiswahili kwa kutaja muda wa miaka 500.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi kimerudiwa kwa maana ya kupata watoto; “akazaa” hudumisha uhusiano wa kitendo kinachofuata na hulingana na matumizi ya nasaba.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; “wana na binti” ni sahihi kuliko neno la jumla “watoto”.
