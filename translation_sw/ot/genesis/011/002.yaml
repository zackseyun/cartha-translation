  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: sw
  text: Walipokuwa wakisafiri kutoka mashariki[a], walipata uwanda katika nchi ya Shinari, wakakaa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokuwa wakisafiri kuelekea mashariki.” Kirai cha Kiebrania מִקֶּדֶם kinaweza kueleweka kuwa kinaonyesha mahali walikotoka (“kutoka mashariki”) au mwelekeo wa safari (“kuelekea mashariki”).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: Walipokuwa wakisafiri
  rationale: Muundo huu wa wakati unaingiza mazingira ya tendo linalofuata kwa Kiswahili cha sasa na cha asili. ‘Kusafiri’ huhifadhi maana ya kuondoka na kuendelea na safari bila kulazimisha dhana mahususi zaidi ya uhamiaji.
- source_word: מִקֶּדֶם
  choice: kutoka mashariki
  rationale: Kihusishi מִן kwa kawaida huonyesha mahali pa kuanzia, hivyo ‘kutoka mashariki’ limewekwa katika matini; hata hivyo, kirai kinaweza pia kueleweka kuwa kinaonyesha mwelekeo wa kwenda mashariki, jambo linalohifadhiwa katika tanbihi.
- source_word: וַיִּמְצְאוּ
  choice: walipata
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa tendo la kupata au kukuta mahali.
- source_word: בִקְעָה
  choice: uwanda
  rationale: Neno hili humaanisha eneo pana tambarare au bonde pana; ‘uwanda’ linafaa kwa mazingira ya kijiografia hapa.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: katika nchi ya Shinari
  rationale: ‘Nchi’ huhifadhi אֶרֶץ kama jina rasmi la eneo, huku Shinari likinakiliwa kama jina la mahali kwa tahajia inayosomeka kwa Kiswahili.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: wakakaa huko
  rationale: Katika muktadha huu ישב huonyesha kukaa mahali baada ya safari. ‘Wakakaa huko’ ni ya asili na yenye hadhi, bila kuamua kupita kiasi ikiwa makazi hayo yalikuwa ya kudumu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Utata halisi wa מִקֶּדֶם umehifadhiwa kwa kuweka usomaji unaopendelewa katika matini na mwingine katika tanbihi.
