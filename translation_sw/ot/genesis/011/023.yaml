  text: Baada ya kumzaa Nahori, Serugi aliishi miaka mia mbili, akazaa wana na binti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi חיה kinaeleza muda ambao mtu aliendelea kuishi; “aliishi” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: שְׂרוּג
  choice: Serugi
  rationale: Jina limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili, kwa kuongezwa irabu ya mwisho kulingana na matumizi ya kawaida ya majina ya Biblia.
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Huonyesha wakati unaofuata tukio la kumzaa Nahori.
- source_word: הוֹלִידוֹ
  choice: kumzaa
  rationale: Hifili ya ילד katika nasaba humtaja baba kama mwenye kumzaa mtoto; Kiswahili “kumzaa” hutumiwa pia kwa baba na ni cha moja kwa moja.
- source_word: נָחוֹר
  choice: Nahori
  rationale: Jina limetoholewa kwa mtindo wa kawaida wa Kiswahili.
- source_word: מָאתַיִם שָׁנָה
  choice: miaka mia mbili
  rationale: Hiki ni kipindi cha miaka 200; mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Hifadhi mwendelezo wa simulizi na maana ileile ya genealogia ya ילד bila kutumia lugha ya kizamani.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Hifadhi utofautishaji wa wazi wa Kiebrania kati ya watoto wa kiume na wa kike; “wana” ni neno la Kiswahili lenye hadhi linalofaa katika nasaba.
