  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: sw
  text: Tera akawachukua Abramu mwanawe, Loti mwana wa Harani, yaani mjukuu wa Tera[a], na Sarai binti-mkwe wake, mke wa Abramu mwanawe. Wakatoka pamoja[b] kutoka Uru wa Wakaldayo ili kwenda katika nchi ya Kanaani. Walipofika mpaka Harani, wakakaa huko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Loti mwana wa Harani, mwana wa mwanawe”; yaani, Loti alikuwa mjukuu wa Tera.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa tafsiri ya karibu zaidi: “wakatoka pamoja nao.” Rejeo la “nao” si wazi, kwa sababu waliotoka na wale walioandamana nao wanaonekana kuwa kundi lilelile.'
    reason: textual_ambiguity
  - marker: c
    text: Au, “wakafanya makao huko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Huhifadhi maana ya msingi ya לקח, huku muktadha ukionyesha kuwa Tera aliwachukua watu wa familia katika safari.
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: Loti mwana wa Harani, yaani mjukuu wake
  rationale: Kiebrania halisi kina muundo ‘Loti mwana wa Harani, mwana wa mwanawe’; ‘yaani mjukuu wake’ huweka uhusiano wazi kwa Kiswahili cha kawaida bila kuacha kumtaja Harani.
- source_word: כַּלָּתוֹ
  choice: mkwewe
  rationale: Katika muktadha huu כלה humaanisha mke wa mwana wa Tera. ‘Mkwewe’ ni neno la kawaida la Kiswahili, na apposisheni inayofuata ‘mke wa Abramu mwanawe’ huondoa uwezekano wa mkanganyiko.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: wakatoka pamoja
  rationale: MT ina kitenzi cha wingi ‘wakatoka’ na kiambishi cha wingi ‘pamoja nao,’ ambacho huleta rejeo gumu linaloonekana kuingiliana. ‘Wakatoka pamoja’ huwasilisha wazo la kundi kusafiri kwa pamoja huku tanbihi ikihifadhi ugumu wa muundo wa chanzo.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: katika Uru wa Wakaldayo
  rationale: ‘Uru’ ni umbo la kawaida la jina la mahali katika Kiswahili cha Biblia; ‘Wakaldayo’ humwakilisha gentiliki כַּשְׂדִּים kwa namna inayoeleweka.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: ili kwenda katika nchi ya Kanaani
  rationale: Infinitivu pamoja na kiishio cha mwelekeo huonyesha kusudi na mahali walikokusudia kwenda.
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: Walipofika mpaka Harani
  rationale: עַד ina wazo la kufika ‘mpaka’ au ‘hadi’ Harani; muundo wa ‘walipofika’ ni wa asili katika Kiswahili na unaunganisha tukio na kukaa kwao.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: wakakaa huko
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kufanya makao. ‘Wakakaa huko’ huhifadhi upana huo bila kuamua kwa nguvu kama kukaa kulikuwa kwa muda au kwa kudumu.
theological_decisions:
- issue: Rejeo gumu katika וַיֵּצְאוּ אִתָּם
  choice: wakatoka pamoja
  alternative: wakatoka pamoja nao
  rationale: Muundo wa MT una wingi kwa ‘wakatoka’ na ‘pamoja nao,’ ingawa makundi yanayorejelewa yanaonekana kuingiliana. Tafsiri kuu iwe ya asili lakini isiufiche ushahidi; umbo halisi zaidi limewekwa katika tanbihi.
- issue: Uhusiano kati ya kusudi la kwenda Kanaani na kukaa Harani
  choice: Walipofika mpaka Harani, wakakaa huko
  alternative: Lakini walipofika mpaka Harani, wakakaa huko
  rationale: Waw ya Kiebrania haisemi wazi ‘lakini.’ Tafsiri haiongezi uadui wa kimantiki, ingawa mfuatano wenyewe unaonyesha kwamba safari iliyolenga Kanaani ilisimama Harani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa kwa usomaji rahisi. Majina ‘Tera, Abramu, Loti, Harani, Sarai, Uru, Wakaldayo, Kanaani’ yanafuata maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Tafsiri inalenga ulinganifu mwafaka na huhifadhi utata wa וַיֵּצְאוּ אִתָּם katika tanbihi.
