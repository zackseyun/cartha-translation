revisions:
- from: Kisha Yahwe akasema, “Tazama, wao ni taifa moja, na wote wana lugha moja; na hili ndilo waliloanza kufanya. Sasa hakuna lolote wanalopanga kufanya litakalokuwa haliwezekani kwao.[a]”
  to: Yahwe akasema, “Tazama, wao ni jamii moja, na wote wana lugha moja; na hili ndilo waliloanza kufanya. Sasa hakuna jambo lolote wanalopanga kufanya litakaloshindikana kwao.[a]”
  rationale: The revision removes the potentially political sense of taifa, improves the naturalness of the final Swahili clause, and revises the alternative footnote to an idiomatic expression of the Hebrew lexical ambiguity. It does not imply unlimited human power, divine approval, or a particular theological explanation.
