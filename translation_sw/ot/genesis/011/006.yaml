  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: sw
  text: Yahwe akasema, “Tazama, wao ni jamii moja, na wote wana lugha moja; na hili ndilo waliloanza kufanya. Sasa hakuna jambo lolote wanalopanga kufanya litakaloshindikana kwao.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna jambo lolote wanalopanga kufanya ambalo watazuiwa kulifanya.”
    reason: Neno la Kiebrania linaweza kumaanisha jambo ambalo haliwezekani kwao au jambo ambalo watazuiwa kulifanya.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa umbo la kawaida la Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: הֵן
  choice: Tazama
  rationale: Linadumisha nguvu ya neno la kuvuta fikira kwa mtindo wenye heshima na unaoeleweka.
- source_word: עַם אֶחָד
  choice: taifa moja
  rationale: Katika muktadha huu linamaanisha jamii moja ya watu; ‘taifa moja’ ni usemi wa asili wa Kiswahili bila kulazimisha dhana ya dola ya kisiasa.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: wote wana lugha moja
  rationale: שָׂפָה ni ‘mdomo’ kihalisi lakini hapa ni nahau ya lugha; tafsiri hii inahifadhi mkazo wa wote kuwa na lugha moja.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: na hili ndilo waliloanza kufanya
  rationale: Hifili ya חלל hapa ina maana ya kuanza; tafsiri haiongezi waziwazi dhana ya ‘mwanzo tu’ isiyosemwa moja kwa moja.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: hakuna lolote ... litakalokuwa haliwezekani kwao
  rationale: Nifali ya בצר inaweza kumaanisha kuzuiliwa au kutowezekana; katika muktadha wa uwezo wao wa kutekeleza mipango, usemi huu ni wa asili na wenye nguvu katika Kiswahili.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: lolote wanalopanga kufanya
  rationale: יזם huonyesha kupanga, kukusudia, au kubuni; ‘wanalopanga’ ni wazi na la kawaida.
theological_decisions:
- issue: Upeo wa kauli kuhusu uwezo wa wanadamu
  choice: Kauli inasema kuwa, katika muktadha huu, miradi inayopangwa na wanadamu walioungana haitakuwa haiwezekani kwao.
  alternative: Hakuna jambo walilokusudia kufanya litakalozuiliwa wasilifanye.
  rationale: Tafsiri inadumisha mvutano wa simulizi kuhusu nguvu ya umoja wa lugha na kusudi, bila kudai kuwa wanadamu wana uwezo usio na mipaka wala kwamba Mungu anaidhinisha mradi wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umefuatwa kwa ukaribu pale ulipo wa asili katika Kiswahili; nahau zimewasilishwa kwa maana yake.
