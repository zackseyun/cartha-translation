base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: sw
  text: Wakasema, “Haya, tujijengee mji na mnara wenye kilele chake mbinguni,[a] na tujifanyie jina, tusije tukatawanyika juu ya uso wa dunia yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnara wenye kilele chake kinachofika mbinguni.” Kiebrania husema kihalisi, “na kilele chake mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Haya
  rationale: Ni kihisishi cha mwaliko kinachohimiza tendo la pamoja; “Haya” ni cha kawaida katika Kiswahili cha sasa na kinahifadhi nguvu ya himizo.
- source_word: נִבְנֶה לָּנוּ
  choice: na tujijengee
  rationale: Muundo wa nafsi ya kwanza wingi unaonyesha himizo la pamoja, huku לָנוּ ikionyesha kujifanyia wenyewe; “tujijengee” ni ya asili na fupi katika Kiswahili.
- source_word: עִיר
  choice: mji
  rationale: “Mji” ni neno la kawaida la Kiswahili kwa makazi ya mjini na haliongezi wazo lisilokuwapo katika muktadha.
- source_word: מִגְדָּל
  choice: mnara
  rationale: Maana ya msingi ni jengo refu au mnara; hakuna msingi wa kulifanya mahsusi kuwa ngome ya kijeshi.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: ambao kilele chake kiko mbinguni
  rationale: “Kilele” huwasilisha רֹאשׁ kwa kawaida katika habari ya jengo, na “kiko mbinguni” huhifadhi dai la mahali la Kiebrania bila kuongeza wazi kitenzi “kufika.”
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: na tujifanyie jina
  rationale: Nahau “kujifanyia jina” inaeleweka kuwa kupata sifa au umaarufu na pia inadumisha taswira halisi ya “jina.”
- source_word: פֶּן
  choice: tusije
  rationale: “Tusije” huonyesha kusudi hasi au matokeo yanayoogopwa kwa njia ya asili katika Kiswahili.
- source_word: נָפוּץ
  choice: tukatawanyika
  rationale: “Kutawanyika” huwasilisha kuenezwa au kusambaa huku na huku; umbo hili la Kiswahili halilazimishi kutaja mtendaji ambaye Kiebrania haumtaji.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: juu ya uso wa dunia yote
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania “juu ya uso wa” na, katika simulizi la awali la Mwanzo, הָאָרֶץ inaelekea kumaanisha dunia nzima.
theological_decisions:
- issue: Upeo wa הָאָרֶץ katika simulizi la Babeli
  choice: dunia
  alternative: nchi
  rationale: Muktadha wa Mwanzo 11 unahusu kuenea kwa wanadamu katika ulimwengu unaokaliwa, si eneo moja tu; “dunia” inafaa zaidi kwa upeo huo.
- issue: Maana ya “kujifanyia jina”
  choice: Kudumisha nahau bila kuifafanua kuwa sifa au umaarufu
  alternative: na tujipatie sifa
  rationale: Kiebrania kinatumia “jina,” ambalo linaweza kujumuisha sifa, umaarufu, na kudumu kwa kumbukumbu. Kutunza nahau huhifadhi upana na mvutano wake wa kifasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Haya” na “na tujijengee” ni vya kawaida na vinaonyesha himizo la pamoja. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
