  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: sw
  text: Baada ya Shela kumzaa Eberi, aliishi miaka 403, akazaa wana na mabinti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi חיה kinaonyesha kuendelea kuishi kwa muda uliotajwa.
- source_word: שֶׁלַח
  choice: Shela
  rationale: Jina limetoholewa kwa namna inayokaribia umbo la Kiebrania na kufaa matamshi ya Kiswahili.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: Baada ya Shela kumzaa Eberi
  rationale: הוליד katika nasaba humaanisha mwanaume kumzaa au kuwa baba wa mtu; ‘kumzaa’ ni usemi wa kawaida wa Kiswahili katika nasaba na hapa mhusika ametajwa wazi ili sentensi isomeke kwa urahisi.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Jina limetoholewa kutoka umbo la Kiebrania kwa kuongezwa irabu ya mwisho ili lisomeke kwa kawaida katika Kiswahili.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: miaka 403
  rationale: Kirai cha Kiebrania ‘miaka mitatu na miaka mia nne’ ni namna ya kutaja jumla ya miaka 403; tarakimu huwasilisha idadi hiyo kwa uwazi na kwa ufupi.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kwa mhusika wa kiume katika muhtasari wa nasaba, ילד humaanisha kupata au kuzaa watoto; ‘akazaa’ huhifadhi uhusiano huo wa nasaba bila kutumia lugha ya kizamani.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Kiebrania kinataja jinsia zote mbili wazi; ‘wana na mabinti’ huhifadhi maelezo hayo.
