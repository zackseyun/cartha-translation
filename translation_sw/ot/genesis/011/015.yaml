translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio wa kirai cha ‘baada ya’ umewekwa mwanzoni ili kuondoa uwezekano wa miaka 403 kuonekana kuwa muda wa tendo la kumzaa Eberi, huku maana ya Kiebrania ikihifadhiwa.
