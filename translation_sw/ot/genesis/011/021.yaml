base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: sw
  text: Baada ya kumzaa Serugi, Reu aliishi miaka mia mbili na saba, na akazaa wana na binti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi חיה humaanisha kuishi; pamoja na אַחֲרֵי, Kiswahili cha kawaida hutumia ‘aliishi ... baada ya’.
- source_word: רְעוּ
  choice: Reu
  rationale: Jina limeandikwa kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: baada ya ... kumzaa
  rationale: Muundo huu unaonyesha kipindi kilichofuata Reu kumzaa Serugi; ‘kumzaa’ ni lugha ya kawaida ya nasaba kwa baba kuwa mzazi wa mtoto.
- source_word: אֶת שְׂרוּג
  choice: Serugi
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi; jina Serugi limetumiwa kwa umbo lililozoeleka katika Kiswahili.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: miaka mingine 207
  rationale: Thamani ya namba ya Kiebrania ni miaka 207. ‘Mingine’ huonyesha wazi kuwa hii ni miaka aliyoishi baada ya kuzaliwa kwa Serugi, maana iliyomo katika muundo wa sentensi.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Katika nasaba yenye mhusika wa kiume, ילד katika Hifili humaanisha kuwa baba wa watoto; ‘akazaa’ huhifadhi mtindo wa nasaba kwa Kiswahili kifupi na cha asili.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; ‘wana na mabinti’ huhifadhi utofautishaji huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Mpangilio wa kishazi umegeuzwa kwa uasilia wa Kiswahili bila kubadili uhusiano wa wakati katika Kiebrania.
