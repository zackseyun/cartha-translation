    issue: The subject is delayed after the opening temporal phrase.
    rationale: “Baada ya kumzaa Serugi, Reu aliishi ...” is clearer and more idiomatic, while retaining the source’s temporal relation.
  revised_text: Baada ya kumzaa Serugi, Reu aliishi miaka mia mbili na saba, na akazaa wana na binti.
