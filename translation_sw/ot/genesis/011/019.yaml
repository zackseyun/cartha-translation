base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: sw
  text: Baada ya kumzaa Reu, Pelegi aliishi miaka mia mbili na tisa, akazaa wana na mabinti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika fomula hii ya nasaba, kitenzi חיה kinaonyesha muda ambao Pelegi aliendelea kuishi baada ya tukio lililotajwa.
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Ni kihusishi cha wakati kinachoonyesha kipindi kilichofuata kuzaliwa kwa Reu.
- source_word: הוֹלִידוֹ
  choice: kumzaa
  rationale: Hifili ya ילד katika nasaba humtaja baba kuwa mzazi; Kiswahili cha kawaida hutumia 'kumzaa' kwa maana hii bila ulazima wa kutumia maelezo marefu.
- source_word: אֶת רְעוּ
  choice: Reu
  rationale: Jina la mtu limetoholewa moja kwa moja, huku kiambishi cha yambwa wa Kiswahili kikionyeshwa katika 'kumzaa'.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: miaka mia mbili na tisa
  rationale: Mpangilio wa idadi umewekwa kwa namna ya kawaida katika Kiswahili, bila kubadili jumla ya miaka 209.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi ילד kimerudiwa kwa maana ya kupata watoto akiwa baba; 'akazaa' ni kifupi, cha asili katika Kiswahili, na kinaendeleza mfululizo wa simulizi.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Maneno ya Kiebrania yanataja wazi watoto wa kiume na wa kike, hivyo hayajafupishwa kuwa 'watoto'.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishazi cha wakati mwanzoni ni wa asili katika Kiswahili na unaweka wazi kuwa miaka 209 ilihesabiwa baada ya kuzaliwa kwa Reu. Hakuna alama za tanbihi zinazohitajika.
