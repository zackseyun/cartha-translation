  text: Serug lived thirty years and fathered Nahor.
translation:
  language: sw
  text: Serugi aliishi miaka thelathini, akamzaa Nahori.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi חיה katika mfululizo wa masimulizi kinaanzisha taarifa ya umri katika nasaba; “aliishi” ni tafsiri ya kawaida na yenye hadhi katika Kiswahili.
- source_word: שְׂרוּג
  choice: Serugi
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: miaka thelathini
  rationale: Hii ni semi ya Kiebrania inayotaja umri; “miaka thelathini” ni ya asili katika Kiswahili, huku muktadha ukionyesha kuwa ni umri.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Hiphil ya ילד katika nasaba humtaja mwanaume kama mzazi wa ukoo. “Akamzaa” ni usemi mfupi na wa kawaida wa kibiblia katika Kiswahili, bila kutumia lugha ya kizamani isiyoeleweka.
- source_word: אֶת
  choice: '[haijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania na hakihitaji neno linalolingana nacho katika Kiswahili; kazi yake inaonekana katika kiambishi cha yambwa “-m-” katika “akamzaa.”
- source_word: נָחוֹר
  choice: Nahori
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
