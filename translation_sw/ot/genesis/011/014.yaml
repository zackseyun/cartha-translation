lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: Shelahi
  rationale: Jina limetoholewa moja kwa moja kutoka katika umbo la Kiebrania שֶׁלַח, huku irabu ya mwisho ikisaidia matamshi ya kawaida ya Kiswahili.
- source_word: חַי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi hiki kinaeleza muda alioishi mtu kabla ya tukio linalofuata.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: miaka thelathini
  rationale: Hiki ni kirai cha kawaida na cha wazi cha Kiswahili kinachoonyesha umri wake wakati wa tukio linalofuata.
- source_word: וַ/יּוֹלֶד
  choice: akamzaa
  rationale: Hiphil ya ילד katika nasaba humaanisha kwamba mwanamume alimzaa au akawa baba wa mtu; 'akamzaa' ni fupi, ya asili, na hudumisha mtazamo wa nasaba wa kiume.
- source_word: אֶת
  choice: '[haijatafsiriwa]'
  rationale: Ni kiashiria cha yambwa tendwa kisicho na neno huru linalolingana nacho katika Kiswahili; kazi yake inaonyeshwa na muundo wa sentensi.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Jina limetoholewa moja kwa moja kutoka עֵבֶר, na irabu ya mwisho imeongezwa kwa matamshi ya asili ya Kiswahili.
