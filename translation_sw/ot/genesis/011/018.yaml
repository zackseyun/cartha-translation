  text: Peleg lived thirty years and fathered Reu.
translation:
  language: sw
  text: Pelegi aliishi miaka thelathini, kisha akamzaa Reu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi חיה kinaonyesha umri aliofikia mtu kabla ya tukio linalofuata; “aliishi” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: פֶלֶג
  choice: Pelegi
  rationale: Jina limeandikwa kwa umbo lililozoeleka katika tafsiri za Kiswahili na linalopatana na mfumo wa sauti wa Kiswahili.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: miaka thelathini
  rationale: Kirai cha Kiebrania kinafanya kazi kama maelezo ya umri; tafsiri hii ni ya asili bila kuongeza neno lisilokuwapo moja kwa moja katika matini.
- source_word: וַיּוֹלֶד
  choice: kisha akamzaa
  rationale: Katika nasaba, ילד humaanisha mwanaume kumzaa au kumtokeza mwana; “akamzaa” ni usemi wa kawaida wa Biblia ya Kiswahili, na “kisha” huonyesha mfuatano unaobebwa na וַ־.
- source_word: אֶת
  choice: '[haikutafsiriwa]'
  rationale: Hiki ni kiashiria cha yambwa mahsusi katika Kiebrania na hakina neno la moja kwa moja linalohitajika katika Kiswahili.
- source_word: רְעוּ
  choice: Reu
  rationale: Jina limenukuliwa kwa umbo la kawaida na linalotambulika katika Kiswahili.
