  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: sw
  text: 'Hivi ndivyo vizazi vya Tera: Tera akawa baba wa Abramu, Nahori na Harani; Harani naye akawa baba wa Loti.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Hivi ndivyo
  rationale: Muundo huu wa Kiswahili unatambulisha sehemu mpya kwa njia ya kawaida bila kuongeza neno la wakati kama “sasa”; kiunganishi cha Kiebrania kinaeleweka katika mtiririko wa habari.
- source_word: תּוֹלְדֹת
  choice: vizazi vya
  rationale: “Vizazi vya” huhifadhi istilahi ya kimuundo inayojirudia katika Mwanzo na upana wake, unaoweza kuhusisha ukoo pamoja na simulizi linalotokana nao.
- source_word: תֶּרַח
  choice: Tera
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: הוֹלִיד
  choice: akawazaa / akamzaa
  rationale: Katika nasaba, Hiphil ya ילד humaanisha kuzaa au kuwa baba wa mtu. “Akawazaa” na “akamzaa” ni Kiswahili cha kawaida, kifupi na kinacholingana na idadi ya yambwa.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: Abramu, Nahori na Harani
  rationale: Viashiria vya yambwa havitafsiriwi; orodha imetolewa kwa mpangilio wa chanzo, na majina yametoholewa kwa maumbo ya Kiswahili.
- source_word: וְ/הָרָן
  choice: naye Harani
  rationale: “Naye” huunganisha kishazi hiki na kilichotangulia na kuweka Harani kuwa kiima bila kuongeza wazo la wakati.
- source_word: הוֹלִיד אֶת לֽוֹט
  choice: akamzaa Loti
  rationale: Kitenzi kilekile cha nasaba kimetafsiriwa kwa uthabiti; “Loti” ni umbo la jina lililotoholewa katika Kiswahili.
