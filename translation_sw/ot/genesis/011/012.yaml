lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpakshadi
  rationale: Kiunganishi וְ kinawakilishwa kwa mtiririko wa sentensi badala ya kutafsiriwa kwa neno “na”; jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: חַי חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: alipokuwa na umri wa miaka thelathini na mitano
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kueleza umri katika fomula ya nasaba; maana ya mpangilio halisi wa Kiebrania, “miaka mitano na thelathini,” imehifadhiwa bila kuiga mpangilio usio wa kawaida katika Kiswahili.
- source_word: וַ/יּוֹלֶד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida, na inafaa kwa mhusika wa kiume katika muktadha huu.
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa mahsusi katika Kiebrania; kazi yake inaonyeshwa na kiambishi cha yambwa -m- katika “akamzaa.”
- source_word: שָׁלַח
  choice: Shela
  rationale: Jina limenukuliwa kutoka umbo la Kiebrania שָׁלַח kwa tahajia ya Kiswahili; “Sala” ni umbo linalopatikana katika mapokeo mengine.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Sentensi imeunganisha fomula ya umri na tendo la kuzaa kwa “alipokuwa … akamzaa,” huku ikihifadhi mfuatano wa nasaba. Tanbihi za mpangilio halisi wa namba na visawe vya kitenzi hazikuongezwa kwa kuwa hazihitajiki ili kuelewa maandishi ya Kiebrania kwa Kiswahili.
