  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: sw
  text: Tera aliishi miaka sabini, akawa baba wa Abramu[a], Nahori, na Harani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kiebrania, “akawazaa.” Kitenzi cha Kiebrania kinachotumiwa katika nasaba hakilazimishi kuelewa kwamba wana hao walizaliwa kwa mpangilio uleule waliotajwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: akaishi
  rationale: Kitenzi חיה katika taarifa hii ya nasaba kinaonyesha kwamba Tera alifikia au aliishi hadi umri uliotajwa. “Akaishi” kinafuata muundo wa Kiebrania na kinaeleweka kwa urahisi katika muktadha.
- source_word: שִׁבְעִים שָׁנָה
  choice: miaka sabini
  rationale: Hii inawakilisha moja kwa moja usemi wa Kiebrania, huku muktadha ukionyesha kuwa ni umri aliofikia Tera.
- source_word: וַיּוֹלֶד
  choice: akawazaa
  rationale: Katika nasaba, ילד humaanisha kuwa baba au kuzaa watoto. “Akawazaa” ni usemi wa kawaida na wenye hadhi katika Kiswahili, bila kutumia lugha nzito isiyo ya kawaida.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: Abramu, Nahori na Harani
  rationale: Alama ya yambwa inayorudiwa inamtambulisha kila mwana. Orodha ya Kiswahili yenye koma na “na” ya mwisho huwasilisha jambo hilo kwa kawaida bila kupoteza maana.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: נָחוֹר
  choice: Nahori
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: הָרָן
  choice: Harani
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili; herufi ya mwanzo ya Kiebrania hapa ni sehemu ya tahajia ya jina, si kibainishi kinachopaswa kutafsiriwa.
theological_decisions:
- issue: Mpangilio wa nasaba na maana ya umri
  choice: Mstari umetafsiriwa kama taarifa ya nasaba kwamba Tera, baada ya kuishi miaka sabini, aliwazaa Abramu, Nahori na Harani, bila kudai kwamba orodha hiyo inaonyesha kwa lazima mpangilio kamili wa kuzaliwa.
  alternative: Majina yanaweza kueleweka kuwa yameorodheshwa kwa mpangilio mkali wa kuzaliwa, au kwamba Tera alianza kupata wana akiwa na miaka sabini bila wote kuzaliwa kwa wakati mmoja.
  rationale: Kiebrania kinataja miaka sabini na wana hao watatu lakini hakisuluhishi moja kwa moja maswali yote ya mpangilio na kronolojia yanayotokana na mistari ya baadaye. Tafsiri na tanbihi zinahifadhi mvutano huo badala ya kuingiza upatanisho usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisasa, wa heshima na unaosomeka kwa urahisi. Muundo wa nasaba umehifadhiwa bila kutumia istilahi za kale zisizo za lazima.
