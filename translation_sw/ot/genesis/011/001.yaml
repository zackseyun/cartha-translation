  text: וַֽ/יְהִ֥י כָל הָ/אָ֖רֶץ שָׂפָ֣ה אֶחָ֑ת וּ/דְבָרִ֖ים אֲחָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/001.yaml
  text: The whole earth had one language and the same words[a].
translation:
  language: sw
  text: Dunia yote ilikuwa na lugha moja na maneno yaleyale[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na msamiati mmoja” / “na usemi uleule.” Kiebrania kwa tafsiri ya moja kwa moja kinasema, “na maneno, mamoja/yaleyale.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ilikuwa na
  rationale: Muundo huu unaanzisha hali ya simulizi. Kiswahili cha sasa huieleza hali hiyo kwa kawaida kwa kitenzi cha wakati uliopita bila kutumia kishazi kizito kama “ikawa kwamba.”
- source_word: כָל הָאָרֶץ
  choice: dunia yote
  rationale: Ingawa אֶרֶץ inaweza kumaanisha “nchi” au “dunia,” muktadha wa Babeli unawahusu wanadamu kwa upana; “dunia yote” ni tafsiri ya kawaida na wazi ya כָל הָאָרֶץ.
- source_word: שָׂפָה אֶחָת
  choice: lugha moja
  rationale: שָׂפָה maana yake ya msingi ni “mdomo,” lakini katika nahau hii humaanisha lugha au usemi. “Lugha moja” ni Kiswahili cha kawaida kinachohifadhi umoja unaoonyeshwa na אֶחָת.
- source_word: וּדְבָרִים אֲחָדִים
  choice: na maneno yaleyale
  rationale: דְּבָרִים kwa kawaida humaanisha “maneno” au “mambo.” Hapa, pamoja na “lugha moja,” inaelekea kusisitiza msamiati au namna moja ya kujieleza. “Maneno yaleyale” huhifadhi maana ya kileksia na kutokufanya kirai hiki kuwa marudio tu ya “lugha moja.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni wa asili katika Kiswahili huku ukihifadhi tofauti kati ya “lugha” na “maneno” katika Kiebrania.
