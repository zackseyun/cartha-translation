lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: Siku zote za Tera zilikuwa
  rationale: Neno kwa neno, kirai hiki ni ‘siku za Tera zilikuwa’; kuongeza ‘zote’ kunafanya iwe wazi kwa Kiswahili cha kawaida kwamba kinatajwa jumla ya muda wa maisha yake huku taswira ya Kiebrania ya ‘siku’ ikihifadhiwa.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: miaka mia mbili na mitano
  rationale: Mpangilio wa tarakimu wa Kiebrania umewekwa katika mpangilio wa kawaida wa Kiswahili, na ‘miaka’ limetumiwa kwa upatanisho wa kawaida wa Kiswahili.
- source_word: תֶרַח
  choice: Tera
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות kinamaanisha moja kwa moja ‘kufa’; ‘akafa’ ni tafsiri ya wazi isiyotumia lugha ya kupunguza ukali wa maana.
- source_word: בְּחָרָן
  choice: huko Harani
  rationale: Kiambishi ב kinaonyesha mahali alikofia. ‘Huko’ ni ya asili kwa rejeo la mahali lililotangulia katika simulizi, na ‘Harani’ ni umbo la jina lililozoeleka katika Kiswahili.
