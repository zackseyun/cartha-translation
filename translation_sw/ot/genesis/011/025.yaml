  text: Nahori aliishi miaka mia moja na kumi na tisa baada ya kuwa baba wa Tera, akawa baba wa wana na mabinti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika taarifa za nasaba, kitenzi hiki kinaonyesha muda ambao mtu aliendelea kuishi; “aliishi” ni Kiswahili cha kawaida na cha heshima.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: baada ya kumzaa
  rationale: Muundo huu unaonyesha kipindi kilichofuata kuzaliwa kwa mwana aliyetajwa; “kumzaa” huhifadhi maana tendaji ya ילד na hutumika kwa kawaida pia kumhusu baba.
- source_word: תֶּרַח
  choice: Tera
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: miaka mia moja na kumi na tisa
  rationale: Kiebrania kina jumla ya miaka 119; mpangilio huu wa nambari ni wa kawaida katika Kiswahili.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi hiki kinarudia ילד katika kauli ya nasaba; “akazaa” ni kifupi, cha asili, na huhifadhi uhusiano wa mfululizo wa matukio.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; “wana na mabinti” huhifadhi utofauti huo badala ya kuujumlisha kuwa “watoto”.
