translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la nasaba. Kipashio cha muda kimewekwa baada ya idadi ya miaka ili kuondoa uwezekano wa kusoma kana kwamba Eberi alimzaa Pelegi akiwa na umri wa miaka 430.
