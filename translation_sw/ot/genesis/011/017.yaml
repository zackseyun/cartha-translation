base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: sw
  text: Eberi akaishi miaka mia nne na thelathini baada ya kumzaa Pelegi, akazaa wana na mabinti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: akaishi
  rationale: Katika nasaba, kitenzi חיה humaanisha kuishi; umbo la masimulizi linaonyeshwa kwa “akaishi” kwa Kiswahili cha kawaida.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Jina limeandikwa kwa namna inayofuata matamshi ya Kiebrania na muundo wa majina unaosomeka kwa Kiswahili.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: baada ya kumzaa Pelegi
  rationale: הוליד katika nasaba hueleza mwanaume kumzaa mtoto; “kumzaa” ni ya asili na ya sasa katika Kiswahili, huku ikihifadhi maana ya uzazi wa baba.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: miaka mia nne na thelathini
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi jumla kamili ya miaka 430.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi hiki kimerudiwa katika kauli ya nasaba; “akazaa” kinahifadhi maana ya kuzaa au kupata wazao bila kutumia lugha ya kizamani.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; “wana na mabinti” kinadumisha utofautishaji huo.
