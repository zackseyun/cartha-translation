  text: And Reu lived thirty-two years and fathered Serug.
translation:
  language: sw
  text: Reu alipokuwa na umri wa miaka thelathini na miwili, alimzaa Serugi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: alipokuwa na umri wa
  rationale: Katika fomula hii ya nasaba, kitenzi חיה pamoja na idadi ya miaka kinaonyesha umri wa Reu kabla ya kumzaa mwanawe. Muundo huu ni wa kawaida na wa wazi katika Kiswahili.
- source_word: רְעוּ
  choice: Reu
  rationale: Jina la mtu limenukuliwa kwa namna inayolingana na matumizi ya kawaida ya Kiswahili.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: miaka thelathini na miwili
  rationale: Mpangilio wa nambari umewekwa kwa mtindo wa kawaida wa Kiswahili huku thamani kamili ya miaka 32 ikihifadhiwa.
- source_word: וַיּוֹלֶד
  choice: alimzaa
  rationale: Katika muktadha wa nasaba, ילד katika kausativi humaanisha kumzaa au kuwa baba wa mtoto. Kiswahili hutumia kwa kawaida 'alimzaa' pia kwa baba katika taarifa za nasaba.
- source_word: אֶת
  choice: '[haijatafsiriwa kando]'
  rationale: Hiki ni kiashiria cha yambwa mahususi katika Kiebrania, kisicho na neno la moja kwa moja katika Kiswahili.
- source_word: שְׂרוּג
  choice: Serugi
  rationale: Umbo 'Serugi' linafuata namna ya kawaida ya kuandika jina hili katika mapokeo ya Biblia ya Kiswahili na linaweza kutamkwa kwa urahisi.
