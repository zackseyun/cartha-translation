  text: Eber lived thirty-four years and fathered Peleg.
translation:
  language: sw
  text: Eberi aliishi miaka thelathini na minne, akamzaa Pelegi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika kaida ya nasaba, kitenzi hiki kinaonyesha muda alioishi kabla ya kumzaa mwana aliyetajwa; “aliishi” ni tafsiri ya kawaida na ya asili kwa Kiswahili.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Jina la Kiebrania עֵבֶר limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili, kwa kuongezwa irabu ya mwisho kulingana na matumizi ya kawaida ya majina ya Biblia.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: miaka thelathini na minne
  rationale: Mpangilio wa Kiebrania ni “minne na thelathini,” lakini Kiswahili cha kawaida hutaja idadi hii kama “thelathini na minne,” bila kubadili thamani yake.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Katika nasaba yenye mhusika wa kiume, ילד humaanisha kumzaa au kuwa baba wa mtoto. “Akamzaa” ni fupi, ya kawaida, na hudumisha mfuatano wa simulizi unaoonyeshwa na וַ־.
- source_word: אֶת
  choice: '[haijatafsiriwa kando]'
  rationale: Hiki ni kiashiria cha yambwa mahsusi katika Kiebrania; kazi yake inaonyeshwa na muundo wa kawaida wa sentensi ya Kiswahili.
- source_word: פָּלֶג
  choice: Pelegi
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa umbo linalofaa matamshi na sarufi ya Kiswahili.
