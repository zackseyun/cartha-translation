  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: sw
  text: Hivi ndivyo vizazi vya Shemu. Shemu alikuwa na umri wa miaka mia moja alipomzaa Arpakshadi[a], miaka miwili baada ya gharika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Arpakshadi kwa mapokeo mengine huandikwa Arfaksadi, umbo linalotokana na Kigiriki badala ya Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Hivi ndivyo vizazi vya
  rationale: Nahau hii ya kichwa cha nasaba inayorudiwa katika Mwanzo imehifadhiwa kwa Kiswahili cha kawaida na chenye hadhi; “vizazi” hubakiza maana yake ya kinasaba bila kuifafanua kupita kiasi.
- source_word: שֵׁם
  choice: Shemu
  rationale: Jina limenukuliwa kwa umbo lililozoeleka katika Kiswahili.
- source_word: בֶּן מְאַת שָׁנָה
  choice: alikuwa na umri wa miaka mia moja
  rationale: Hii ni tafsiri ya kiasili ya nahau ya Kiebrania inayosema kihalisi ‘mwana wa miaka mia moja.’
- source_word: וַיּוֹלֶד
  choice: alipomzaa
  rationale: Hiphil ya ילד katika nasaba inaeleza mwanaume kumzaa mtoto; “alipomzaa” ni ya kawaida na wazi katika Kiswahili, na muundo wa wakati unaunganisha umri wake na tukio hilo.
- source_word: אַרְפַּכְשָׁד
  choice: Arpakshadi
  rationale: Umbo hili linafuata konsonanti za jina la Kiebrania kwa namna inayotamkika kwa Kiswahili, badala ya umbo lililopitia Kigiriki.
- source_word: שְׁנָתַיִם
  choice: miaka miwili
  rationale: Umbo la uwili la neno ‘mwaka’ limetafsiriwa moja kwa moja.
- source_word: אַחַר הַמַּבּוּל
  choice: baada ya gharika
  rationale: Kirai cha wakati chenye nomino maalumu katika muktadha; “gharika” ni neno la kawaida la kibiblia kwa mafuriko makubwa ya siku za Nuhu.
