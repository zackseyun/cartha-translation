translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Mpangilio wa sentensi mbili zilizounganishwa kwa nuktamkato umehifadhi msisitizo wa maelezo ya pili bila kuongeza kiashiria cha wakati kisichokuwamo wazi katika chanzo.
