  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: sw
  text: Sarai alikuwa tasa[a]; hakuwa na mtoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sarai alikuwa tasa; hakuwa na uzao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: alikuwa
  rationale: Kitenzi hiki kinaendeleza simulizi na kueleza hali ya Sarai. Kiswahili hakihitaji kiunganishi cha mwanzo hapa; “alikuwa” huwasilisha hali hiyo kwa kawaida.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: עֲקָרָה
  choice: tasa
  rationale: Neno hili humaanisha kutoweza kuzaa. “Tasa” ni neno fupi, la kawaida, na lenye hadhi katika Kiswahili; “asiye na mtoto” lingeingiliana na maelezo yanayofuata.
- source_word: אֵין לָהּ
  choice: hakuwa na
  rationale: Muundo wa Kiebrania unaokanusha kuwapo kwa kitu kwake unaelezwa kwa Kiswahili cha kawaida kwa muundo wa umilikaji, “hakuwa na.”
- source_word: וָלָד
  choice: mtoto
  rationale: Nomino hii hurejelea aliyezaliwa, yaani mtoto au uzao. “Mtoto” ni ya moja kwa moja na ya kawaida katika muktadha huu, huku “uzao” ikibaki kuwa tafsiri mbadala inayowezekana.
