base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: sw
  text: Abramu na Nahori wakajitwalia wake[a]. Jina la mke wa Abramu lilikuwa Sarai, na jina la mke wa Nahori lilikuwa Milka, binti wa Harani, baba wa Milka na Yiska.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa usemi wa kawaida zaidi, “Abramu na Nahori walioa.” Kiebrania kinasema kihalisi kwamba “walijitwalia wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: wakajitwalia
  rationale: Kitenzi לקח maana yake ya msingi ni ‘chukua’; katika muktadha wa ndoa, ‘wakajitwalia’ huhifadhi tamathali ya Kiebrania huku kikieleweka kuwa walioa.
- source_word: לָהֶם
  choice: -ji-
  rationale: Kiambishi cha kujirejelea katika ‘wakajitwalia’ kinaonyesha kwamba kila mmoja alijitwalia mke, na hivyo kinawakilisha maana ya לָהֶם hapa.
- source_word: נָשִׁים
  choice: wake
  rationale: Ingawa neno hili linaweza kumaanisha ‘wanawake,’ muktadha wa ndoa unahitaji maana ya ‘wake.’
- source_word: שֵׁם
  choice: Jina la ... lilikuwa
  rationale: Muundo huu unahifadhi urudiaji rasmi wa ‘jina la’ katika Kiebrania na bado ni wa kawaida katika Kiswahili.
- source_word: אֵשֶׁת
  choice: mke wa
  rationale: Katika muundo unaotaja mume, neno hili lina maana dhahiri ya ‘mke wa.’
- source_word: שָׂרָי
  choice: Sarai
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: בַּת
  choice: binti wa
  rationale: Hili ndilo neno la kawaida la Kiswahili linaloonyesha uhusiano wa mtoto wa kike na mzazi.
- source_word: הָרָן
  choice: Harani
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: אֲבִי
  choice: baba wa
  rationale: Maana ya moja kwa moja ya neno ni ‘baba’; muktadha wa nasaba hauhitaji maana pana ya ‘babu’ au ‘mzee wa ukoo.’
- source_word: יִסְכָּה
  choice: Yiska
  rationale: Utohozi huu unafuata kwa karibu matamshi ya jina la Kiebrania na ni rahisi kusoma kwa Kiswahili.
