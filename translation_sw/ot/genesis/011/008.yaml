  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: sw
  text: Basi Yahweh akawatawanya kutoka pale juu ya uso wa dunia yote[a], nao wakaacha kuujenga mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika dunia yote” au “kote duniani”; Kiebrania halisi, “juu ya uso wa dunia yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: akawatawanya
  rationale: Kitenzi פוץ hapa kinaonyesha Yahweh aliwasababisha watu watawanyike; ‘akawatawanya’ ni Kiswahili cha kawaida na kinadumisha muktadha wa hukumu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: מִשָּׁם
  choice: kutoka pale
  rationale: Kirai hiki cha mahali kinarejelea eneo la Babeli na kimetafsiriwa kwa Kiswahili cha kawaida.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: katika uso wa dunia yote
  rationale: Hifadhi picha ya Kiebrania ya kuwa ‘juu ya uso wa dunia yote,’ huku ‘katika uso wa’ kikieleweka kama kuenea katika eneo lote.
- source_word: וַיַּחְדְּלוּ
  choice: wakaacha
  rationale: חדל humaanisha kukoma au kuacha; ‘wakaacha’ huungana kwa kawaida na tendo linalofuata.
- source_word: לִבְנֹת
  choice: kuujenga
  rationale: Kitenzi-jina cha Kiebrania kimetolewa kwa muundo wa Kiswahili unaohitajika baada ya ‘wakaacha,’ pamoja na kiambishi cha yambwa kinachorejelea mji.
- source_word: הָעִיר
  choice: mji
  rationale: Nomino yenye uainisho inarejelea mji uliokuwa ukijengwa katika muktadha wa karibu; uainisho unaonekana kupitia ‘kuujenga mji.’
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; ‘Yahweh’ linahifadhi jina binafsi badala ya kuliweka kama cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi ‘akawatawanya ... wakaacha’ unafuata mfuatano wa vitenzi vya Kiebrania. Tanbihi inadumisha taswira halisi na pia kutoa usemi wa kawaida zaidi.
