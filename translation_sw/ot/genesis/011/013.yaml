base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: sw
  text: Arpakshadi akaishi miaka 403 baada ya kuwa baba yake Shela, akawa na wana na mabinti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: akaishi
  rationale: Katika mtindo wa nasaba, kitenzi hiki kinaonyesha muda ambao mtu aliendelea kuishi; “akaishi” ni Kiswahili cha kawaida na wazi.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshadi
  rationale: Jina limetoholewa kutoka umbo la Kiebrania kwa tahajia inayoweza kutamkwa kwa urahisi katika Kiswahili.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֶׁלַח
  choice: baada ya kumzaa Shela
  rationale: Kauli hii inaonyesha wakati baada ya Arpakshadi kuwa baba ya Shela. “Kumzaa” ni usemi mfupi na unaoeleweka katika mtindo wa nasaba za Biblia.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: miaka 403
  rationale: Mpangilio wa namba umewekwa kwa namna ya kawaida ya Kiswahili huku idadi kamili ikihifadhiwa; tarakimu hurahisisha usomaji wa nasaba.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Katika muktadha huu wa nasaba, neno linamhusu mhusika wa kiume kama mzazi; “akazaa” linaendeleza kwa ufupi fomula ya nasaba.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; “wana na mabinti” kinahifadhi utofautishaji huo.
theological_decisions: []
