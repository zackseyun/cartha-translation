base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: sw
  text: Ndiyo maana pakaitwa Babeli[a], kwa kuwa huko Yahweh akaichanganya lugha ya dunia yote, na kutoka huko Yahweh akawatawanya juu ya uso wa dunia yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Babeli huleta sauti inayofanana na kitenzi cha Kiebrania balal, “kuchanganya”; mchezo huo wa maneno unaeleza jina hilo katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Ndiyo sababu
  rationale: Usemi huu unaonyesha hitimisho linalotokana na tukio lililotangulia na unasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: קָרָא שְׁמָהּ
  choice: jina lake likawa
  rationale: Huwasilisha kwa Kiswahili sanifu fomula ya Kiebrania ya kuita jina bila kumtaja mhusika asiyeelezwa katika maandishi.
- source_word: בָּבֶל
  choice: Babeli
  rationale: Jina hili limetoholewa kwa namna iliyozoeleka katika Kiswahili; tanbihi inaeleza mchezo wa sauti na kitenzi cha Kiebrania בָּלַל.
- source_word: בָּלַל
  choice: aliichanganya
  rationale: Kitenzi hiki kina maana ya kuchanganya au kuvuruga; “aliichanganya” hudumisha uhusiano wake na lugha moja iliyotajwa na tukio la simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: lugha ya dunia yote
  rationale: Neno שָׂפָה kwa maana halisi ni “mdomo,” lakini hapa ni nahau inayomaanisha lugha; tafsiri hii ni wazi na huhifadhi upeo wa “dunia yote.”
- source_word: הֱפִיצָם
  choice: akawatawanya
  rationale: Hiphili ya פוץ inaonyesha kusababisha watu waenee katika maeneo mbalimbali; “akawatawanya” ni ya kawaida na sahihi katika muktadha huu.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: juu ya uso wa dunia yote
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania na pia marudio ya “dunia yote” katika mstari.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “jina lake likawa” huepuka kuongeza wazi “mji” au “mahali” pasipotajwa katika mstari, huku ukitoa sentensi ya kawaida. Marudio ya “dunia yote” na taswira ya “uso wa dunia” yamehifadhiwa kwa ukaribu na Kiebrania.
