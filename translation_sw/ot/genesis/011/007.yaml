  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: sw
  text: Njoni, tushuke huko na tuichanganye lugha yao, ili mtu asielewe lugha ya mwenzake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: Njoni
  rationale: Wito wa pamoja unaolingana na umbo la wingi katika muktadha na kuendeleza mwangwi wa mstari wa 3 na wa 4.
- source_word: נֵרְדָה
  choice: tushuke
  rationale: Huhifadhi uhusishi wa msemaji pamoja na wengine na maana halisi ya kushuka.
- source_word: וְנָבְלָה
  choice: na tuichanganye
  rationale: Huwasilisha kusudi la kufanya lugha yao ivurugike bila kupoteza nguvu ya kitendo cha Kiebrania.
- source_word: שְׂפָתָם
  choice: lugha yao
  rationale: Ingawa שָׂפָה kimsingi ni 'mdomo', hapa humaanisha lugha; Kiswahili cha kawaida huhitaji 'lugha'.
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: mtu mmoja ... lugha ya mwenzake
  rationale: Huhifadhi muundo wa mtu kwa mwenzake na uhusiano wa kirafiki/kijamii unaodokezwa na רֵעַ.
theological_decisions:
- issue: 'Wingi katika maneno ya Mungu: ''Njoni, tushuke'''
  choice: Kuhifadhi wingi bila kuufafanua
  alternative: Kutafsiri kwa umoja au kuongeza maelezo kuhusu maana ya wingi huo
  rationale: Nakala ya Kiebrania ina wingi halisi, lakini mstari wenyewe hauelezi chanzo au maana yake ya kitheolojia; tafsiri haipaswi kuamua jambo hilo kimyakimya.
- issue: Matokeo yaliyokusudiwa ya kuchanganywa kwa lugha
  choice: ili mtu mmoja asiweze kuelewa lugha ya mwenzake
  alternative: ili wasielewane wao kwa wao
  rationale: Chaguo kuu huhifadhi kwa karibu muundo wa Kiebrania wa אִישׁ ... רֵעֵהוּ na kusudi linaloelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Njoni' ni wito wa kawaida kwa kundi; 'mwenzake' ni ya asili zaidi kuliko 'jirani yake' hapa na haibani רֵעַ kuwa jirani wa makazi pekee.
