  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: sw
  text: Ndipo Yahweh akashuka kuona mji na mnara ambayo wanadamu walikuwa wamejenga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Kitenzi hiki huhifadhi maana halisi ya kushuka na taswira ya Mungu inayotumiwa katika simulizi; kiambishi “aka-” kinaendeleza mfuatano wa matukio.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa namna ya kulitamka katika Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: לִרְאֹת
  choice: ili auone
  rationale: Huhifadhi maana ya kawaida ya ‘kuona’ na kusudi la kushuka bila kuongeza wazo la kufanya ukaguzi.
- source_word: הָעִיר
  choice: mji
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya עִיר.
- source_word: הַמִּגְדָּל
  choice: mnara
  rationale: Hii ndiyo tafsiri ya kawaida ya מִגְדָּל katika muktadha wa simulizi la Babeli.
- source_word: אֲשֶׁר
  choice: ambao
  rationale: Kiwakilishi hiki cha uhusiano kinaeleza kwa kawaida mnara uliokuwa umejengwa.
- source_word: בָּנוּ
  choice: walikuwa wameujenga
  rationale: Muundo huu unaonyesha kuwa ujenzi ulitangulia tendo la Yahwe kushuka, huku upatanisho wa ‘-u-’ ukirejelea mnara.
- source_word: בְּנֵי הָאָדָם
  choice: wanadamu
  rationale: Ingawa muundo wa Kiebrania ni ‘wana wa adam/mwanadamu,’ ni nahau inayowarejelea binadamu kwa ujumla. ‘Wanadamu’ ni ya asili katika Kiswahili na huhifadhi maana ya pamoja bila kudokeza wanaume pekee.
theological_decisions:
- issue: Maelezo ya Yahwe kushuka kwa namna ya kibinadamu
  choice: Kuhifadhi usemi halisi “akashuka”
  alternative: aliangalia chini; alielekeza fikira zake
  rationale: Kiebrania kinatumia taswira thabiti ya simulizi. Tafsiri haipunguzi taswira hiyo kwa kuifanya wazo dhahania.
- issue: Maana ya בְּנֵי הָאָדָם
  choice: wanadamu
  alternative: wana wa mwanadamu
  rationale: Usemi wa Kiebrania una umbo la kiume lakini unawahusu binadamu kwa pamoja. Kiswahili ‘wanadamu’ kina uhusiano wa kietimolojia na adam/mwanadamu na huwasilisha maana hiyo ya jumla kwa lugha ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kisimulizi na ya asili, huku ikihifadhi taswira ya Yahwe kushuka na kuona.
