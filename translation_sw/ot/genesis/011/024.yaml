  text: Nahori aliishi miaka ishirini na tisa, kisha akamzaa Tera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Katika mtindo wa nasaba, kitenzi חיה kinaonyesha muda alioishi kabla ya tukio linalofuata; “aliishi” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: נָחוֹר
  choice: Nahori
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: miaka ishirini na tisa
  rationale: Mpangilio halisi wa Kiebrania ni “tisa na ishirini,” lakini Kiswahili cha kawaida huweka makumi kabla ya vitengo.
- source_word: וַיּוֹלֶד
  choice: kisha akamzaa
  rationale: Hifili ya ילד katika nasaba humaanisha kwamba mwanamume alimzaa au akawa baba wa mtoto; “akamzaa” ni usemi mfupi na wa kawaida wa nasaba katika Kiswahili, huku “kisha” ikionyesha mfuatano wa simulizi wa וַ־.
- source_word: אֶת
  choice: '[haijatafsiriwa kando]'
  rationale: Kiashiria cha yambwa mahususi hakina neno linalolingana nacho moja kwa moja katika Kiswahili; maana yake inaonyeshwa na mpangilio wa sentensi.
- source_word: תָּרַח
  choice: Tera
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
