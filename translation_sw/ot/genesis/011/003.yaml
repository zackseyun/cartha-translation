base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: sw
  text: 'Wakaambiana, “Haya, tutengeneze matofali na tuyachome kabisa.” Matofali yakawa badala ya mawe[a], na lami[b] ikawa badala ya chokaa.


    [a] Au, “Matofali yakawa kwao badala ya mawe.”


    [b] Neno la Kiebrania חֵמָר linamaanisha lami ya asili, yaani bitumeni, iliyotumiwa katika ujenzi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Matofali yakawa kwao badala ya mawe.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania חֵמָר linamaanisha lami ya asili, yaani bitumeni, iliyotumiwa katika ujenzi.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: Wakaambiana
  rationale: Nahau hii ina maana ya watu kusemezana wao kwa wao. “Wakaambiana” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kulazimisha muundo wa Kiebrania wa “mtu kwa jirani yake.”
- source_word: הָבָה
  choice: Haya
  rationale: Chembe hii inaanzisha himizo. “Haya” ni ya asili katika Kiswahili cha sasa na inafaa kabla ya pendekezo la pamoja.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: na tutengeneze matofali
  rationale: Kitenzi kinachotokana na neno la “tofali” kinamaanisha kutengeneza matofali; tafsiri hii ni wazi na ya kawaida.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: na kuyachoma kabisa
  rationale: Muundo wa kitenzi pamoja na nomino yenye mzizi uleule unatilia mkazo uchomaji kamili. “Kabisa” huonyesha nguvu hiyo kwa Kiswahili cha asili.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: Matofali yakawa badala ya mawe
  rationale: 'Kauli inaonyesha ubadilishaji wa nyenzo: matofali yalitumiwa mahali pa mawe. Wingi ni wa kawaida katika Kiswahili wakati wa kutaja nyenzo hizi kwa ujumla.'
- source_word: הַחֵמָר
  choice: lami
  rationale: חֵמָר hapa ni bitumeni au lami ya asili iliyotumiwa katika ujenzi. “Lami” ndiyo istilahi inayoeleweka kwa urahisi zaidi katika Kiswahili cha kawaida.
- source_word: לַחֹמֶר
  choice: badala ya chokaa
  rationale: חֹמֶר hapa ni kiunganishi cha ujenzi kinachofanya kazi ya mortar. “Chokaa” hutaja kwa kawaida mchanganyiko wa kuunganishia matofali au mawe, na “badala ya” huhifadhi wazo la uingizwaji.
