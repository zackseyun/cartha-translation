translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakaambiana” na “Haya” hufanya mazungumzo yasikike ya kawaida, huku “yakawa badala ya” ikihifadhi ulinganisho wa vifaa vya ujenzi katika Kiebrania.
