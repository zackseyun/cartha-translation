  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: sw
  text: Kwa maana nchi yote unayoiona nitawapa wewe na uzao wako[a] milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wako.” Neno la Kiebrania זֶרַע linaweza kumaanisha “mbegu,” “uzao,” au “wazao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linaunganisha agizo la kutazama na maelezo ya ahadi ya Mungu, bila kulazimisha maana kali ya sababu.
- source_word: כָּל הָאָרֶץ
  choice: nchi yote
  rationale: Huhifadhi maana ya eneo lote linaloonekana na ni usemi wa kawaida katika Kiswahili sanifu.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: unayoiona
  rationale: Kishazi hiki cha uhusiano kinawasilisha kwa kawaida tendo la sasa la kuona katika muktadha.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: nitakupa wewe
  rationale: Wakati ujao unaonyesha ahadi; kiwakilishi 'wewe' kinaweka wazi na kusisitiza mpokeaji kama ilivyo katika Kiebrania.
- source_word: וּלְזַרְעֲךָ
  choice: na uzao wako
  rationale: '''Uzao'' huhifadhi tabia ya זֶרַע kama nomino ya jumla inayoweza kumaanisha wazao kwa pamoja bila kuamua mapema umoja au wingi.'
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida na yenye uzito wa muda unaoendelea au wa kudumu, bila kuingiza mfumo fulani wa kieskatolojia.
theological_decisions:
- issue: Muda wa ahadi ya nchi katika עַד עוֹלָם
  choice: milele
  alternative: daima; hata wakati usio na mwisho
  rationale: ‘Milele’ huakisi maana ya wazi ya muda wa kudumu au usio na kikomo katika ahadi hii, huku ikiacha uhusiano wake mpana wa kiagano ufasiriwe kwa kuzingatia muktadha.
- issue: Maana ya pamoja ya זֶרַע
  choice: uzao wako
  alternative: wazao wako
  rationale: ‘Uzao’ huhifadhi uwezekano wa nomino ya pamoja na mvutano wake wa kimatini, badala ya kuifanya wazi kuwa wingi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ni wa asili katika Kiswahili huku ukihifadhi kiunganishi cha mwanzo, ukamilifu wa nchi, msisitizo wa mpokeaji, maana ya pamoja ya ‘uzao,’ na uzito wa ‘milele.’
