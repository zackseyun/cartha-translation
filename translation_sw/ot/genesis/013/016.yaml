  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: sw
  text: Nitaufanya uzao wako[a] uwe kama mavumbi ya ardhi[b], hivi kwamba, ikiwa mtu anaweza kuhesabu mavumbi ya ardhi, basi uzao wako pia utaweza kuhesabiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wako”; neno la Kiebrania lina maana ya msingi ya “mbegu” na hapa ni nomino ya kijumla inayotaja uzao.
    reason: lexical_alternative
  - marker: b
    text: Au “nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Nitaufanya ... kuwa
  rationale: Kitenzi שׂים kwa kawaida humaanisha ‘kuweka,’ lakini pamoja na shamirisho na kishazi cha ulinganisho hapa kina maana ya kumfanya au kuufanya uwe kwa namna fulani. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: זֶרַע ni nomino ya kijumla inayoweza kumaanisha mbegu au wazao. ‘Uzao wako’ huhifadhi hali yake ya umoja wa kijumla bila kulazimisha maana ya mtu mmoja wala kuifanya iwe wingi moja kwa moja.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: kama mavumbi ya nchi
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania na maana ya wingi usiohesabika. ‘Nchi’ hapa inaweza kueleweka kwa upana kama ardhi au dunia.
- source_word: אֲשֶׁר אִם
  choice: ikiwa
  rationale: Katika muktadha huu mfuatano huo unaanzisha sharti la kinadharia linaloonyesha ukubwa wa ahadi; ‘ikiwa’ ni muundo wa asili wa Kiswahili.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa Kiebrania kina nomino ya umoja yenye umbo la kiume, hapa imetumiwa kwa maana ya jumla. ‘Mtu’ katika Kiswahili ni linganisho la kawaida lisilopoteza maana hiyo.
- source_word: לִמְנוֹת
  choice: kuhesabu
  rationale: Kitenzi מנה hapa humaanisha kuhesabu vitu kimoja baada ya kingine; ‘kuhesabu’ ndilo neno la kawaida na sahihi.
- source_word: גַּם
  choice: pia
  rationale: ‘Pia’ huonyesha ulinganifu kati ya uwezekano wa kuhesabu mavumbi na wa kuhesabu uzao wa Abramu.
- source_word: יִמָּנֶה
  choice: utaweza kuhesabiwa
  rationale: Nifali isiyotimilifu iko katika jawabu la sharti la kinadharia. Muundo wa uwezekano ‘utaweza kuhesabiwa’ unalingana na ‘ikiwa mtu anaweza’ kuliko tamko la moja kwa moja la wakati ujao.
theological_decisions:
- issue: Maana ya kijumla ya זֶרַע katika ahadi kwa Abramu
  choice: uzao wako
  alternative: wazao wako; mbegu yako
  rationale: Aya inazungumzia watu watakaotokana na Abramu kama kundi lisilohesabika. ‘Uzao’ huhifadhi umoja wa kijumla wa neno la Kiebrania bila kuingiza hapa tafsiri mahsusi ya mtu mmoja.
- issue: Matumizi ya jumla ya אִישׁ
  choice: mtu
  alternative: mwanamume
  rationale: 'אִישׁ ina umbo la kiume, lakini katika sentensi hii ina nguvu ya jumla: yeyote anayejaribu kuhesabu. Kiswahili ‘mtu’ huwasilisha matumizi hayo kwa usahihi na kwa kawaida.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sharti umehifadhiwa ili kuonyesha hoja ya kinadharia ya maandishi ya Kiebrania, na taswira ya mavumbi haijafafanuliwa kupita kiasi.
