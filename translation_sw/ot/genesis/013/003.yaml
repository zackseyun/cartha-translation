translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Negebu' na 'Betheli' zimetumiwa kama maumbo ya majina yanayoeleweka katika mapokeo ya Biblia ya Kiswahili; 'Ai' limehifadhiwa kwa umbo lake fupi. Tanbihi imewekwa baada ya sentensi kwa kuwa inafafanua kirai 'hatua kwa hatua'.
