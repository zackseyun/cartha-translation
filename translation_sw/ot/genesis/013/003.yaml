  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: sw
  text: Akasafiri hatua kwa hatua[a] kutoka Negebu mpaka Betheli, hadi mahali ambapo hapo mwanzo hema lake lilikuwa, kati ya Betheli na Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kufuata hatua za safari zake,” yaani, akihama kwa hatua kutoka kambi moja hadi nyingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Akasafiri
  rationale: Katika simulizi la safari lenye maelezo ya njia, kitenzi hiki kinaelezwa kwa kawaida kama kusafiri, badala ya neno la jumla zaidi 'kwenda'.
- source_word: לְמַסָּעָיו
  choice: hatua kwa hatua
  rationale: Neno מַסָּע linaweza kuashiria hatua ya safari inayohusisha kuvunja kambi; wingi wake hapa unaonyesha mwendo wa hatua mfululizo kutoka kambi moja hadi nyingine.
- source_word: מִנֶּגֶב
  choice: kutoka Negebu
  rationale: Katika mazingira haya ya kijiografia, נֶגֶב linaelekea kutaja eneo la Negebu, si mwelekeo wa kusini tu.
- source_word: וְעַד בֵּית אֵל
  choice: mpaka Betheli
  rationale: עַד huonyesha kikomo au mwisho wa safari; 'mpaka' ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: עַד הַמָּקוֹם
  choice: hadi mahali
  rationale: עַד ya pili inabainisha zaidi mahali alikofikia; 'hadi mahali' huhifadhi mkazo huo bila kuwa nzito.
- source_word: אֲשֶׁר הָיָה שָׁם אהל/ה
  choice: ambapo hema lake lilikuwa hapo
  rationale: Kirai kinarejelea eneo la awali la hema la Abramu; 'ambapo ... hapo' huhifadhi pia שָׁם bila kuvuruga Kiswahili.
- source_word: בַּתְּחִלָּה
  choice: mwanzoni
  rationale: Neno hili linaelekeza nyuma kwenye kambi ya awali katika simulizi.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: kati ya Betheli na Ai
  rationale: Muundo בֵּין ... וּבֵין unaonyesha mahali kati ya miji hiyo miwili; הָעָי ni jina la mahali, Ai.
