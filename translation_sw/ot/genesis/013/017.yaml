  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: sw
  text: Inuka, utembee katika nchi kwa urefu na upana wake, kwa maana nitakupa nchi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּם
  choice: Inuka
  rationale: Amri ya moja kwa moja ya קום ina maana ya kuinuka au kusimama; “Inuka” ni ya kawaida, yenye heshima, na inahifadhi nguvu ya amri.
- source_word: הִתְהַלֵּ֣ךְ
  choice: utembee
  rationale: Hithpaeli ya הלך hapa inaonyesha kutembea huku na huko katika eneo; “utembee” ni ya asili katika Kiswahili na vifungu vinavyofuata vinaonyesha kwamba ni kuipitia nchi.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ katika muktadha huu ni nchi au eneo aliloonyeshwa Abramu, si dunia kwa ujumla.
- source_word: לְאָרְכָּהּ
  choice: katika urefu wake
  rationale: אֹרֶךְ ni “urefu”; muundo huu unaonyesha kuipitia nchi kwa upande wa urefu wake.
- source_word: וּלְרָחְבָּהּ
  choice: na upana wake
  rationale: רֹחַב ni “upana”; ikiunganishwa na “urefu” inaeleza ukubwa wote wa nchi.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inaleta sababu ya amri iliyotangulia; “kwa maana” inadumisha uhusiano huo wa maelezo.
- source_word: לְךָ
  choice: nitakupa
  rationale: Kiambishi cha mtendewa “-ku-” katika “nitakupa” humtaja Abramu kuwa mpokeaji wa zawadi kwa njia ya kawaida ya Kiswahili.
- source_word: אֶתְּנֶנָּה
  choice: nitakupa nchi hiyo
  rationale: Kitenzi cha wakati usiotimilika kina maana ya ahadi ya wakati ujao. Ingawa Kiebrania kinatumia kiwakilishi cha kike kinachorejelea nchi, kurudia “nchi hiyo” ni wazi na kwa kawaida zaidi kuliko kiwakilishi kisicho cha asili katika Kiswahili.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha kike katika אֶתְּנֶנָּה
  choice: Kimefasiriwa kwa kurudia “nchi hiyo,” kikirejelea nchi iliyoahidiwa.
  alternative: “nitakupa hiyo” au “nitakupa” bila kutaja kitu kinachotolewa
  rationale: Kiambishi cha umoja wa kike katika Kiebrania kwa kawaida kinarejelea אֶרֶץ, “nchi.” Kurudia nomino katika Kiswahili kunahifadhi maana hiyo bila kuongeza maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio “katika nchi, katika urefu wake na upana wake” umehifadhi kwa kiasi muundo wa Kiebrania huku ukibaki wazi kwa msomaji wa kawaida.
