base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: sw
  text: Je, nchi yote haiko mbele yako? Tafadhali, jitenga nami. Ukienda upande wa kushoto[a], mimi nitaenda upande wa kulia; na ukienda upande wa kulia, mimi nitaenda upande wa kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakitaji kitenzi katika vishazi hivi vya masharti; kihalisi, “Ikiwa kushoto, basi mimi nitaenda kulia; na ikiwa kulia, basi mimi nitaenda kushoto.” Tafsiri imeongeza “ukienda upande wa” ili maana iwe wazi katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... haiko
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukubali; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: כָל הָאָרֶץ
  choice: nchi yote
  rationale: אָ֫רֶץ hapa ni eneo lote lililokuwa wazi kwa makazi, si dunia nzima. “Nchi yote” ni usemi wa kawaida unaohifadhi maana hiyo.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Huhifadhi taswira ya Kiebrania kwamba nchi iko wazi mbele ya Loti na inaweza kuchaguliwa naye.
- source_word: הִפָּרֶד נָא מֵעָלָי
  choice: Tafadhali, jitenga nami
  rationale: Kitenzi cha Niphal kinaeleza kujitenga, na נָא hulainisha agizo kuwa ombi la heshima. “Jitenga nami” ni ya asili katika Kiswahili bila kuongeza wazo la ugomvi.
- source_word: אִם הַשְּׂמֹאל
  choice: Ukienda upande wa kushoto
  rationale: Kiebrania kimeacha kitenzi katika kishazi hiki; “ukienda upande wa” kinakamilisha maana inayodokezwa na muktadha ili Kiswahili kiwe wazi.
- source_word: וְאֵימִנָה
  choice: mimi nitaenda upande wa kulia
  rationale: Umbo elekezi kutoka ימין linaonyesha mwendo kuelekea kulia. Kiwakilishi “mimi” kinasisitiza utofautishaji na chaguo la Loti.
- source_word: וְאִם הַיָּמִין
  choice: na ukienda upande wa kulia
  rationale: Kitenzi kilichodokezwa kimewekwa wazi kama katika kishazi cha kwanza, huku ulinganifu wa sentensi ukihifadhiwa.
- source_word: וְאַשְׂמְאִילָה
  choice: mimi nitaenda upande wa kushoto
  rationale: Umbo elekezi kutoka שׂמאל linaonyesha mwendo wa Abramu kuelekea upande ulio kinyume; tafsiri inadumisha muundo wenye uwiano.
theological_decisions: []
