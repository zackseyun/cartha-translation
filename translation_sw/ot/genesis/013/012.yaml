base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: sw
  text: Abramu aliishi katika nchi ya Kanaani, naye Loti aliishi katika miji ya uwanda huo, akapiga hema yake hadi Sodoma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaweka kambi yake kuelekea Sodoma.” Kitenzi cha Kiebrania kinaweza kumaanisha kupiga hema au kukaa kambini. Maana yake ni kwamba kambi ya Loti ilienea upande wa Sodoma, si lazima kwamba wakati huu alikuwa tayari ameingia au kuishi ndani ya mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: aliishi
  rationale: Kitenzi hiki hapa kinaonyesha kukaa au kuishi mahali; “aliishi” ni Kiswahili cha sasa, cha kawaida na kinachofaa kwa maana hiyo.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Tafsiri hii inadumisha nomino אֶרֶץ, “nchi,” na kutumia umbo la kawaida la jina Kanaani katika Kiswahili.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: katika miji ya uwanda huo
  rationale: כִּכָּר hapa inarejelea uwanda uliotajwa katika muktadha. “Uwanda huo” ni wazi na wa kawaida, huku ikidumisha uhusiano wa miji na eneo hilo.
- source_word: וַיֶּאֱהַל
  choice: akapiga hema yake
  rationale: Kitenzi kinatokana na neno la hema na kinaweza kumaanisha kupiga hema au kukaa kambini. Tafsiri hii inahifadhi taswira halisi ya Kiebrania bila kudai kwamba Loti tayari aliishi ndani ya Sodoma.
- source_word: עַד סְדֹם
  choice: hadi Sodoma
  rationale: עַד huonyesha mwisho au upeo wa eneo. “Hadi Sodoma” inadumisha wazo la kufikia upande wa Sodoma bila kulazimisha maana ya kuingia mjini.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Umbo la jina linalotumiwa kwa kawaida katika tafsiri za Kiswahili.
- source_word: לוֹט
  choice: Loti
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Umbo la kawaida la jina la mahali hapa katika Kiswahili.
