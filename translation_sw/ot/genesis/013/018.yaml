base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: sw
  text: Basi Abramu akahamisha hema lake, akaja, akakaa karibu na mialoni ya Mamre[a], iliyoko Hebroni, na huko akamjengea Yahweh madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miti ya terebinthi ya Mamre”; neno la Kiebrania linaweza kumaanisha miti mikubwa kama mialoni au terebinthi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: akahamisha hema lake
  rationale: Kitenzi kinachotokana na אהל kinaonyesha kusafiri au kuhamia pamoja na hema; tafsiri hii ni ya asili katika Kiswahili na haijirudii na vitenzi vinavyofuata vya kuja na kukaa.
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Huhifadhi mfuatano wa kawaida wa simulizi na maana ya kitenzi cha mwendo bila kuongeza wazo la kuwasili lisilotajwa wazi.
- source_word: וַיֵּשֶׁב
  choice: kukaa
  rationale: Katika muktadha huu neno lina maana ya kuishi au kufanya makao; 'kukaa' ni la kawaida na linaacha kiwango cha kudumu kwa makao bila kukibainisha kupita kiasi.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: karibu na mialoni ya Mamre
  rationale: Kiambishi בְּ kinaweza kuonyesha mahali penye miti hiyo; 'karibu na' ni ya asili kwa eneo linalotambulishwa kwa miti. אֵלֹנֵי huenda ikamaanisha mialoni au miti ya terebinthi, hivyo utata wa aina ya miti umehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: iliyoko Hebroni
  rationale: Kishazi hiki kinatambulisha mahali pa mialoni ya Mamre kwa Kiswahili cha kawaida; umoja wa kisarufi unarejelea eneo linaloitwa Mamre.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: na huko akamjengea ... madhabahu
  rationale: Huhifadhi שָׁם ('huko') na tendo la kujenga madhabahu. Muundo 'akamjengea Yahweh madhabahu' unaeleza kwa kawaida kwamba madhabahu hiyo iliwekwa wakfu kwake.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kama jina maalumu 'Yahweh' badala ya kulibadilisha kuwa cheo; kiambishi לְ kimewasilishwa kwa muundo wa Kiswahili 'akamjengea'.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, si cheo. 'Yahweh' hulihifadhi wazi bila kuingiza desturi ya kulibadilisha kuwa 'BWANA' wala umbo la baadaye 'Yehova'.
- issue: Aina ya miti katika אֵלֹנֵי מַמְרֵא
  choice: mialoni ya Mamre
  alternative: miti ya terebinthi ya Mamre
  rationale: Neno la Kiebrania linaweza kutaja miti mikubwa kama mialoni au terebinthi. 'Mialoni' inafaa katika matini kuu, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi umehifadhi mtiririko wa simulizi, huku usemi usio wa kawaida wa tafsiri neno kwa neno ukiepukwa.
