lexical_decisions:
- source_word: נָשָׂא
  choice: kuwategemeza
  rationale: Katika muktadha huu kitenzi kina maana ya nchi kuwa na uwezo wa kuwahimili au kuwapatia mahitaji watu hao pamoja na mali na mifugo yao; “kuwategemeza” ni ya asili na inaeleweka kwa urahisi.
- source_word: רְכוּשָׁם
  choice: mali zao
  rationale: Neno linahusu mali waliyokuwa nayo, hasa mifugo na vitu vyao, hivyo “mali zao” hudumisha upana wa maana.
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: kuishi pamoja
  rationale: Ingawa יָשַׁב inaweza kumaanisha kukaa au kuishi, hapa inahusu wao kuendelea kuishi katika eneo moja; “kuishi pamoja” ni Kiswahili cha kawaida na sahihi katika muktadha.
