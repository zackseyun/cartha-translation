  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipashio vikuu vya Kiebrania: Loti anaelekeza macho yake, anaona kikar ya Yordani, eneo hilo linaelezwa kuwa lenye maji tele kabla ya Yahwe kuharibu Sodoma na Gomora, na linafananishwa na bustani ya Yahwe na nchi ya Misri. Hata hivyo, “ulikuwa na maji tele kila mahali” inaweza kusikika kana kwamba uwanda ulifunikwa na maji, badala ya kuwa wenye umwagiliaji/maji ya kutosha. Muundo wa kitenzi cha hali pia unaweza kueleza sifa hiyo kwa karibu zaidi.'
