  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: sw
  text: Loti akainua macho yake, akaona uwanda wote wa Yordani[a], uliokuwa umetiwa maji tele kila mahali kabla ya Yahwe kuharibu Sodoma na Gomora, kama bustani ya Yahwe[b], kama nchi ya Misri, kuelekea Soari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “eneo lote tambarare la Yordani,” au kwa tafsiri ya karibu zaidi, “duara lote la Yordani.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “bustani ya Yahwe” inadokeza ustawi na rutuba ya bustani ya Edeni.
    reason: cross_reference
  - marker: c
    text: Au “unapokaribia Soari.” Usemi wa Kiebrania huonyesha mwelekeo kuelekea Soari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: akainua macho yake
  rationale: Inahifadhi nahau ya Kiebrania ya kuelekeza macho huku ikieleweka kwa urahisi katika Kiswahili.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: uwanda wote wa Yordani
  rationale: כִּכָּר hapa hueleza eneo tambarare au wilaya pana inayohusiana na Mto Yordani; “uwanda” ni ya asili na haibani maana kuwa bonde pekee.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: kwamba ulikuwa na maji tele kila mahali
  rationale: מַשְׁקֶה huonyesha eneo lililokuwa na maji mengi au lililomwagiliwa vizuri; usemi huu ni wa kawaida na unaendeleza wazo la eneo lote.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: kabla Yahwe hajaharibu
  rationale: לִפְנֵי ni ya wakati hapa, na שׁחת hurejelea kuangamizwa kwa miji hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כְּגַן יְהוָה
  choice: kama bustani ya Yahwe
  rationale: Inahifadhi tashbihi ya Kiebrania na mwangwi unaowezekana wa bustani ya Edeni bila kuufanya kuwa wazi kuliko chanzo.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: kama nchi ya Misri
  rationale: Neno “nchi” linawakilisha אֶרֶץ na kudumisha ulinganisho wa kijiografia.
- source_word: בֹּאֲכָה צֹעַר
  choice: kuelekea Soari
  rationale: Nahau hii huonyesha mwelekeo au njia ya kukaribia Soari; tafsiri hii hailazimishi maana ya kufika huko.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina binafsi la Mungu, si cheo; “Yahwe” ni utohozi unaofaa kwa Kiswahili.
- issue: Uhusiano wa “bustani ya Yahwe” na Edeni
  choice: Kuhifadhi usemi wa chanzo na kueleza mwangwi katika tanbihi
  alternative: kama bustani ya Edeni
  rationale: Kifungu chenyewe hakisemi “Edeni”; hivyo tafsiri haipaswi kufuta uwezekano kwamba usemi una maana pana zaidi, ingawa huenda unadokeza Edeni.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa heshima na unaoeleweka. Sentensi imegawanywa ili kuzuia msongamano huku uhusiano wa tashbihi ukibaki wazi. Majina yametolewa kwa maumbo ya kawaida ya Kiswahili: Loti, Yordani, Sodoma, Gomora, Misri, na Soari.'
