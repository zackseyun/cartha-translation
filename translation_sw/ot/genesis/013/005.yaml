  text: Loti naye, aliyekuwa akiandamana na Abramu, alikuwa na mifugo midogo, ng’ombe, na mahema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: pia
  rationale: Kielezi hiki kinaonyesha kwamba Loti naye alikuwa na mali; muunganiko na simulizi lililotangulia unabaki wazi bila kulazimisha kurudia kiunganishi mwanzoni.
- source_word: לְלוֹט ... הָיָה
  choice: Loti ... alikuwa na
  rationale: Huu ni muundo wa Kiebrania unaoonyesha umiliki; Kiswahili cha kawaida hutumia ‘alikuwa na’ badala ya tafsiri sisisi ‘kulikuwa kwa Loti.’
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: aliyesafiri pamoja na Abramu
  rationale: Kitenzi-shirikishi kinamtambulisha Loti kama aliyekuwa akiandamana na Abramu. ‘Aliyesafiri pamoja na’ ni cha asili na hudumisha maana ya kuandamana.
- source_word: צֹאן
  choice: makundi ya kondoo na mbuzi
  rationale: Neno hili linahusu mifugo midogo kwa ujumla, hasa kondoo na mbuzi; kutaja wote wawili huepuka kueleweka kuwa kondoo peke yao.
- source_word: וּבָקָר
  choice: makundi ya ng’ombe
  rationale: Neno hilo humaanisha mifugo ya jamii ya ng’ombe; ‘makundi ya ng’ombe’ ni wazi na linaendana na wingi wa kimakusanyo.
- source_word: וְאֹהָלִים
  choice: na mahema
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya nomino hii ya wingi ni ‘mahema.’
