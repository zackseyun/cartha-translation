translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Majina yametolewa kwa maumbo ya kawaida ya Biblia ya Kiswahili: Loti na Abramu. Hakuna tanbihi iliyohitajika kwa kuwa upana wa maana ya צאן umewekwa wazi katika matini.'
