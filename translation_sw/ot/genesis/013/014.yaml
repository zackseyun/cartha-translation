base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: sw
  text: Yahweh akamwambia Abramu[a], baada ya Loti kutengana naye, “Tafadhali inua macho yako na utazame kutoka mahali ulipo, kuelekea kaskazini, kusini, mashariki na magharibi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yahweh” (יהוה), jina la Mungu.'
    reason: Kubainisha kwamba neno hili ni jina la Mungu katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: וַיהוָה
  choice: Kisha Yahwe
  rationale: Kiunganishi וַ kinaendeleza simulizi, na jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: אָמַר אֶל־אַבְרָם
  choice: akamwambia Abramu
  rationale: Muundo wa Kiswahili “akamwambia” unawakilisha kwa kawaida kitendo cha kusema kwa mtu; jina אַבְרָם limetoholewa kwa umbo la kawaida “Abramu.”
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: baada ya Loti kutengana naye
  rationale: אַחֲרֵי huonyesha wakati unaofuata, na Nifali ya פרד hapa ina maana ya kujitenga au kutengana; “naye” humrejelea Abramu bila kuongeza maelezo yasiyomo.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Tafadhali inua macho yako
  rationale: Amri שָׂא imehifadhiwa kwa “inua,” huku נָא ikiwakilishwa na “tafadhali” ili kudumisha ulainishaji wa ombi; taswira ya “macho yako” imehifadhiwa.
- source_word: וּרְאֵה
  choice: utazame
  rationale: Katika mfuatano wa amri za Kiswahili, “utazame” ni mwaliko wa kuelekeza macho na kutazama, sawasawa na maana ya ראה katika muktadha huu.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר־אַתָּה שָׁם
  choice: kutoka mahali ulipo
  rationale: Huu ni usemi wa kawaida na sahihi wa Kiswahili unaobainisha mahali pa kutazamia; שָׁם imo kimaana ndani ya “ulipo.”
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: kuelekea kaskazini, kusini, mashariki na magharibi
  rationale: Kiambishi elekezi ־ָה katika maneno ya pande za dunia kinawakilishwa na “kuelekea”; mpangilio wa Kiebrania umehifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa urahisi. Mtindo wa simulizi umetumiwa kwa “Kisha ... akamwambia,” huku taswira ya Kiebrania “inua macho yako” ikihifadhiwa. Alama ya tanbihi [a] ipo katika matini kuu.
