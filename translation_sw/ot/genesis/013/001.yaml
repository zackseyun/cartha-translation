base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: sw
  text: Basi Abramu akapanda kutoka Misri—yeye na mke wake, na vyote alivyokuwa navyo—pamoja na Loti, kuelekea Negebu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande wa kusini.” Neno la Kiebrania negev linaweza kumaanisha eneo la kusini linaloitwa Negebu, au kwa ujumla upande wa kusini au nchi ya kusini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu. “Akapanda” kinadumisha taswira ya kijiografia ya simulizi la Biblia kuhusu kutoka Misri kuelekea nchi ya Kanaani, badala ya kukirahisisha kuwa “akaondoka.”
- source_word: מִמִּצְרַיִם
  choice: kutoka Misri
  rationale: Huwakilisha moja kwa moja kihusishi מן pamoja na jina la mahali מִצְרַיִם.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: pamoja na mke wake
  rationale: Kauli hii ya asili humtaja Abramu mwenyewe na mke wake; Kiswahili cha “pamoja na mke wake” ni cha kawaida na wazi bila mkazo usio wa lazima.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: vyote alivyokuwa navyo
  rationale: Huhifadhi upana wa kirai, ambacho kinaweza kujumuisha mali na vyote vilivyokuwa chini ya Abramu, bila kukifupisha kuwa vitu vya kimwili pekee.
- source_word: וְלוֹט עִמּוֹ
  choice: na Loti akiwa pamoja naye
  rationale: Huhifadhi kutajwa kwa Loti kama mwandamani wa Abramu katika safari.
- source_word: הַנֶּגְבָּה
  choice: wakaelekea Negebu
  rationale: נֶגֶב hapa inaweza kuwa jina la eneo la kusini la Kanaani au kueleza upande wa kusini. “Negebu” huhifadhi maana ya jina la mahali, huku “wakaelekea” ikiwakilisha kiambishi cha mwelekeo bila kudai kwa nguvu kwamba tayari waliingia ndani ya eneo hilo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umerahisishwa kwa usomaji wa kawaida huku mfuatano wa wahusika na vitu katika Kiebrania ukihifadhiwa. Alama ya tanbihi [a] imewekwa baada ya “Negebu,” ambako utata wa kimsamiati unatokea.
