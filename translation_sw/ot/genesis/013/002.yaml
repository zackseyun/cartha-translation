- source_word: וְ/אַבְרָם
  choice: Abramu
  rationale: Kiunganishi ו־ kinaendeleza simulizi, lakini Kiswahili hakihitaji kuanza sentensi kwa “Na” hapa; jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: כָּבֵד מְאֹד
  choice: alikuwa tajiri sana
  rationale: Ingawa כָּבֵד kwa msingi humaanisha “mzito,” hapa ni nahau inayoonyesha utajiri mwingi; מְאֹד imetafsiriwa “sana.”
- source_word: בַּ/מִּקְנֶה
  choice: kwa mifugo
  rationale: מִקְנֶה hapa inarejelea mali ya wanyama wa kufugwa, yaani mifugo; “kwa” huonyesha aina ya mali aliyokuwa nayo kwa wingi.
- source_word: בַּ/כֶּסֶף
  choice: fedha
  rationale: כֶּסֶף katika orodha hii ya mali inamaanisha metali ya fedha, si pesa kwa ujumla.
- source_word: וּ/בַ/זָּהָב
  choice: na dhahabu
  rationale: Tafsiri hii huhifadhi kiunganishi na kutaja aina ya tatu ya utajiri kwa Kiswahili cha kawaida.
