  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu Abramu, hali yake ya kuwa tajiri sana, na orodha ya maeneo matatu ya utajiri wake: mifugo, fedha, na dhahabu. Kuacha kiunganishi cha mwanzo ו־ ni jambo la kawaida katika Kiswahili na hakupunguzi mwendelezo wa simulizi.'
