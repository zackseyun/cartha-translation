  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: sw
  text: Wanaume wa Sodoma walikuwa waovu sana na wakosefu sana dhidi ya Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa waovu sana na wakosefu sana mbele za Yahwe.”
    reason: Kihusishi לַיהוָה kinaweza pia kueleweka kuwa uovu na dhambi zao zilikuwa mbele za Yahwe, yaani machoni pake.
lexical_decisions:
- source_word: וְ/אַנְשֵׁי
  choice: Wanaume wa
  rationale: אַנְשֵׁי ni wingi wa muundo tegemezi wa אִישׁ na hapa inawarejelea wanaume wa Sodoma. Kiunganishi וְ hakihitaji neno tofauti mwanzoni mwa sentensi katika Kiswahili, kwa kuwa mtiririko wa simulizi unakibeba.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: רָעִים
  choice: waovu
  rationale: Katika muktadha huu neno linaonyesha ubaya wa kimaadili, si hali mbaya kwa ujumla.
- source_word: וְ/חַטָּאִים
  choice: na walimtendea ... dhambi
  rationale: Muundo huu wa kitenzi ni wa asili katika Kiswahili na unaonyesha kwamba wanaume hao walitenda dhambi, huku ukidumisha ulinganifu wa maana na רָעִים.
- source_word: לַ/יהוָה
  choice: walimtendea Yahwe dhambi
  rationale: ל pamoja na lugha ya kutenda dhambi inaweza kuonyesha yule aliyekosewa; umbo hili linatoa kwa Kiswahili cha kawaida maana ya kutenda dhambi dhidi ya Yahwe.
- source_word: מְאֹד
  choice: sana
  rationale: Neno hili linatoa msisitizo mkubwa kwa maelezo ya uovu na dhambi. Katika Kiswahili, kuliweka baada ya “waovu” kunafanya sentensi iwe ya kawaida bila kuondoa uzito wa tathmini nzima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya לַיהוָה pamoja na חַטָּאִים
  choice: walimtendea Yahwe dhambi
  alternative: wenye dhambi mbele za Yahwe
  rationale: Kihusishi ל kinaweza kuonyesha kwamba Yahwe ndiye aliyekosewa, lakini pia kinaweza kueleweka kuwa hali yao ilikuwa mbele zake au machoni pake. Tafsiri kuu inachagua maana ya kumkosea, na tanbihi inahifadhi uwezekano mwingine halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wanaume” huhifadhi urejeleo mahususi wa kiume wa אַנְשֵׁי; “walimtendea Yahwe dhambi” ni ya kawaida zaidi kuliko usemi wa moja kwa moja usiozoeleka kama “wenye dhambi dhidi ya Yahwe.”
