base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: sw
  text: Basi Abramu akamwambia Loti, “Tafadhali, pasiwe na ugomvi kati yangu na wewe, wala kati ya wachungaji wangu na wachungaji wako, kwa maana sisi ni ndugu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “ndugu” hapa linamaanisha jamaa wa ukoo; Abramu na Loti hawakuwa wana wa wazazi wale wale. Kiebrania kinasema kwa namna halisi, “sisi ni watu ndugu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Basi Abramu akamwambia
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza tukio; “Basi ... akamwambia” ni wa kawaida katika Kiswahili na unahifadhi mfuatano wa simulizi.
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: Tafadhali, pasiwe na ugomvi
  rationale: “Tafadhali” linaonyesha ombi la upole la נָא, huku “pasiwe” likihifadhi ombi hasi; “ugomvi” ni neno la kawaida linalofaa kwa mzozo unaotajwa.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: kati yangu na wewe
  rationale: Linahifadhi kwa uwazi muundo wa Kiebrania unaotaja pande zote mbili badala ya kuufupisha kuwa “kati yetu.”
- source_word: וּבֵין רֹעַי וּבֵין רֹעֶיךָ
  choice: wala kati ya wachungaji wangu na wachungaji wako
  rationale: “Wachungaji” katika Kiswahili linaweza kumaanisha watunza mifugo kwa upana, si kondoo pekee; “wala” linaunganisha kwa kawaida sehemu ya pili ya ombi hasi.
- source_word: כִּי
  choice: kwa maana
  rationale: Linaonyesha sababu ya ombi la Abramu kwa njia ya asili na yenye heshima.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: sisi ni ndugu
  rationale: Kirai hiki kinasisitiza uhusiano wao wa kifamilia. “Ndugu” ni Kiswahili cha kawaida kinachoweza kumaanisha jamaa wa ukoo kwa upana, kama matumizi ya אַחִים hapa.
theological_decisions:
- issue: Maana ya אַחִים kuhusu uhusiano wa Abramu na Loti
  choice: sisi ni ndugu
  alternative: sisi ni jamaa wa ukoo
  rationale: Ingawa Abramu alikuwa mjomba wa Loti, אַחִים linaweza kutaja ndugu wa ukoo kwa maana pana. “Ndugu” linadumisha taswira na mvuto wa kifamilia bila kudai kwamba walikuwa wana wa wazazi wale wale; tanbihi inaeleza upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha marudio ya “kati” kutoka Kiebrania, lakini hutumia “wala” ili ombi hasi lisikike kwa kawaida. “Pasiwe” linaipa kauli uzito wa staha bila kuwa la kizamani kupita kiasi.
