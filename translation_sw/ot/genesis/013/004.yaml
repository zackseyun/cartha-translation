  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: sw
  text: mpaka mahali pa madhabahu ambayo alikuwa ameijenga huko awali. Huko Abramu akaliitia jina la Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kijadi hutafsiriwa “BWANA.” “Yahweh” ni tahajia nyingine ya “Yahwe,” na “Yehova” ni umbo jingine la kimapokeo. Nahau “kuliitia jina la Yahwe” pia inaweza kumaanisha kulitangaza jina la Yahwe au kumwomba Yahwe kwa jina.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: mahali pa madhabahu
  rationale: Hutafsiri kirai cha mahali kwa Kiswahili cha kawaida na kuhifadhi rejeo la madhabahu iliyotajwa awali.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyokuwa ameijenga
  rationale: Ingawa עשה kimsingi ni ‘fanya/tengeneza,’ kwa madhabahu Kiswahili cha asili hutumia ‘jenga’; wakati timilifu huonyesha tendo lililotangulia simulizi hili.
- source_word: שָׁם בָּרִאשֹׁנָה
  choice: hapo hapo mwanzo
  rationale: Huhifadhi kielezi cha mahali na maana ya kurudi kwenye eneo la awali; ‘mwanzo’ hapa ni wakati wa ziara ya kwanza, si mwanzo wa uumbaji.
- source_word: וַיִּקְרָא שָׁם אַבְרָם
  choice: Hapo Abramu akaliitia
  rationale: Muundo wa simulizi ‘aka-’ ni wa kawaida katika Kiswahili, na ‘hapo’ huhifadhi marudio ya שָׁם.
- source_word: בְּשֵׁם יְהוָה
  choice: jina la Yahwe
  rationale: Pamoja na ‘liitia,’ kirai hiki huhifadhi nahau ya kumwomba au kumwabudu Mungu kwa kulitaja jina lake bila kuibana iwe sala binafsi pekee au tangazo la hadharani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Unukuzi unaotumika kwa kawaida katika Kiswahili wa jina la Kiebrania YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
theological_decisions:
- issue: Maana ya nahau קרא בשם יהוה
  choice: akaliitia jina la Yahwe
  alternative: akalitangaza jina la Yahwe / akamwomba Yahwe kwa jina
  rationale: Nahau ya Kiebrania inaweza kujumuisha kumwomba, kumwabudu, au kulitangaza jina; ‘kuliitia jina’ huhifadhi upana huo kwa kiwango kikubwa kuliko kuchagua maana moja tu.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; ‘Yahwe’ hulihifadhi katika matini kuu, huku tanbihi ikitaja mapokeo mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Madhabahu,’ ‘Abramu,’ na ‘Yahwe’ vinafuata matumizi yanayoeleweka katika muktadha wa Biblia. Muundo umehifadhi marudio ya mahali katika Kiebrania bila kufanya sentensi kuwa nzito.
