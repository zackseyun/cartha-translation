  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: sw
  text: Basi Loti akajichagulia tambarare yote ya Yordani, naye Loti akasafiri kuelekea mashariki[a]; nao wakatengana, kila mmoja na ndugu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alisafiri kutoka mashariki.” Kifungu cha Kiebrania kinaweza kuonyesha mwelekeo wa safari au mahali safari ilipoanzia.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ לוֹט
  choice: Loti akajichagulia
  rationale: Kitenzi בחר pamoja na לוֹ kinaonyesha kwamba Loti alichagua kwa ajili yake mwenyewe; “akajichagulia” ni usemi wa asili na mfupi wa Kiswahili.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: eneo lote tambarare la Yordani
  rationale: כִּכָּר hapa ni eneo tambarare linalohusishwa na Yordani; “eneo lote tambarare” huepuka maana ya umbo la duara huku ikihifadhi sifa ya kijiografia.
- source_word: וַיִּסַּע
  choice: akaelekea
  rationale: נסע huonyesha kuondoka au kuanza safari, mara nyingi baada ya kung’oa kambi. Pamoja na “mashariki,” “akaelekea” ni Kiswahili cha kawaida kinachoonyesha mwendo wa safari bila kuongeza maelezo yasiyotajwa.
- source_word: מִקֶּדֶם
  choice: mashariki
  rationale: Katika muktadha, neno hilo linaeleweka vizuri zaidi kama mwelekeo wa safari, yaani kuelekea mashariki; uwezekano wa maana “kutoka mashariki” umehifadhiwa katika tanbihi.
- source_word: וַיִּפָּרְדוּ
  choice: wakatengana
  rationale: Nifali ya פרד inaonyesha kutengana kwa pande zote mbili; “wakatengana” ni ya kawaida na inadumisha maana hiyo.
- source_word: אִישׁ מֵעַל אָחִיו
  choice: kila mmoja na ndugu yake
  rationale: Muundo wa Kiebrania ni wa ugawaji katika umoja na una neno “ndugu.” Kiswahili hiki kinahifadhi lugha ya undugu na maana kwamba kila mmoja alitengana na mwenzake.
theological_decisions:
- issue: Lugha ya undugu yenye jinsia
  choice: kila mmoja na ndugu yake
  alternative: wakatengana wao kwa wao
  rationale: Neno אָחִיו linamaanisha “ndugu yake.” Kulihifadhi kunaonyesha uhusiano wa kifamilia kati ya Abramu na Loti bila kulazimisha Kiswahili kisicho cha kawaida.
- issue: Utata wa mwelekeo katika מִקֶּדֶם
  choice: akaelekea mashariki
  alternative: akaondoka kutoka mashariki
  rationale: Muktadha unaunga mkono mwendo kuelekea mashariki, lakini umbo la Kiebrania linaweza pia kuonyesha mahali safari ilipoanzia. Tanbihi inadumisha utata huo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha sasa na chenye heshima. Muundo wa vitenzi vya mfululizo umehifadhi mwendo wa simulizi; tanbihi pekee inaeleza utata wa Kiebrania.
