base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: sw
  text: Kukawa na ugomvi kati ya wachungaji wa mifugo ya Abramu na wachungaji wa mifugo ya Loti. Wakati huo, Wakanaani na Waperizi[a] walikuwa wakiishi katika nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hutumia majina ya umoja yenye maana ya kijumla: “Mkanaani na Mperizi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Kukawa na
  rationale: Huwasilisha kwa njia ya kawaida ya Kiswahili tukio la kisimulizi pamoja na maana ya kuwepo.
- source_word: רִיב
  choice: ugomvi
  rationale: Neno hili linaonyesha mzozo au mabishano kati ya makundi mawili; ‘ugomvi’ ni la sasa, wazi, na lenye uzito unaofaa.
- source_word: רֹעֵי מִקְנֵה
  choice: wachungaji wa mifugo
  rationale: ‘Wachungaji’ hapa si wa kondoo pekee, kwa kuwa מִקְנֶה ni neno pana kwa wanyama wanaofugwa; ‘mifugo’ huhifadhi upana huo.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na
  rationale: Huhifadhi muundo unaotofautisha pande mbili za ugomvi.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: Wakanaani na Waperizi
  rationale: Ingawa Kiebrania kina majina ya umoja yenye maana ya kijumla, Kiswahili cha kawaida hutumia majina ya makabila katika wingi.
- source_word: אָז
  choice: Wakati huo
  rationale: Huonyesha wakati unaohusiana na simulizi kwa Kiswahili cha kawaida na kisicho na utata.
- source_word: יֹשֵׁב
  choice: walikuwa wakikaa
  rationale: Muundo huu unaonyesha hali iliyoendelea, kama kishiriki cha Kiebrania, na unapatana na makundi mawili yanayotajwa kwa maana ya wingi.
- source_word: בָּאָרֶץ
  choice: katika nchi hiyo
  rationale: ‘Nchi hiyo’ ni ya asili katika Kiswahili na huhifadhi maana ya eneo husika bila kuibana kuwa ‘taifa’.
theological_decisions:
- issue: Dokezo linalowezekana la kiagano katika הָאָרֶץ
  choice: nchi hiyo
  alternative: eneo hilo
  rationale: ‘Nchi hiyo’ hudumisha uzito wa kijiografia wa neno hilo katika Mwanzo na uwezekano wa mwangwi wa kiagano, bila kuongeza maelezo ya kitheolojia yasiyosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa ‘Wakati huo’ ni wa kawaida kuliko kuuingiza katikati ya kitenzi. Alama ya tanbihi [a] imewekwa baada ya kauli inayohusika.
