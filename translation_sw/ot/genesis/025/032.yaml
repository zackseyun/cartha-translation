  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָ/מ֑וּת וְ/לָ/מָּה זֶּ֥ה לִ֖/י בְּכֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: sw
  text: Esau akasema[a], “Tazama, mimi ninakaribia kufa; basi, haki hii ya mzaliwa wa kwanza itanifaa nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninaenda kufa; basi, kwa nini nihitaji haki hii ya mzaliwa wa kwanza?”
    reason: Mbadala huu unahifadhi kwa karibu zaidi muundo wa Kiebrania הוֹלֵךְ לָמוּת na swali וְלָמָּה ... לִי.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kiunganishi na kitenzi cha mfululizo wa simulizi vimetafsiriwa kwa ‘akasema,’ namna ya kawaida na ya asili ya kuendeleza simulizi katika Kiswahili.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina limetolewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira za msikilizaji kwa kauli inayofuata; ‘Tazama’ lina heshima, linaeleweka, na linahifadhi nguvu yake.
- source_word: אָנֹכִי
  choice: mimi
  rationale: Kiwakilishi huru kina mkazo; kutaja ‘mimi’ wazi kunahifadhi mkazo huo katika Kiswahili.
- source_word: הוֹלֵךְ לָמוּת
  choice: ninakaribia kufa
  rationale: Muundo wa הלך pamoja na kitenzi-jina unaonyesha kuelekea katika matokeo, hapa kifo kinachodaiwa kuwa karibu, si lazima mwendo halisi.
- source_word: וְלָמָּה זֶּה לִי
  choice: basi, ... itanifaa nini?
  rationale: Hili ni swali la balagha linalotoa hitimisho kutokana na madai ya Esau. ‘Itanifaa nini?’ huwasilisha kwa Kiswahili cha kawaida maana ya ‘kwa nini/kwa faida gani kwangu’ bila kuongeza ufafanuzi usio katika matini.
- source_word: בְּכֹרָה
  choice: haki hii ya mzaliwa wa kwanza
  rationale: Neno linamaanisha hadhi na haki zinazomhusu mwana wa kwanza. Kauli hii ni wazi kwa wasomaji wa Kiswahili na inahifadhi maana ya kijamii na kisheria.
theological_decisions:
- issue: Nguvu ya kauli ya Esau kwamba anakufa
  choice: Kauli imetafsiriwa kuwa anakaribia kufa bila kuamua kama alikuwa katika hatari halisi ya kifo au alikuwa akitia chumvi kwa sababu ya njaa.
  alternative: ‘Ninaenda kufa,’ ambayo inaweza kuhifadhi kwa karibu zaidi taswira ya Kiebrania lakini inaweza kusikika kama mwendo halisi au kauli ya jumla katika Kiswahili.
  rationale: Kiebrania kinatoa madai ya Esau bila kufafanua kama ni halisi au ya kutia chumvi; tafsiri inahifadhi mvutano huo wa kisimulizi na kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Tazama’ limetumiwa kama kivuta-fikira cha simulizi, na ‘haki ya mzaliwa wa kwanza’ huepuka istilahi finyu ya kimadhehebu.
