base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: sw
  text: Hivi ndivyo vizazi vya Ishmaeli[a], mwana wa Abrahamu, ambaye Hajiri, Mmisri, mtumwa wa kike wa Sara[b], alimzalia Abrahamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na hivi ndivyo vizazi vya Ishmaeli.” Neno la Kiebrania תּוֹלְדוֹת (toledot) ni kichwa kinachojirudia katika kitabu cha Mwanzo; linaweza pia kutafsiriwa “wazao” au “ukoo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mjakazi wa Sara.” Neno la Kiebrania שִׁפְחָה humaanisha mtumishi wa kike au mtumwa wa kike; hapa “mtumwa wa kike” hutumika kuonyesha wazi hali yake ya kutokuwa huru.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Hivi ndivyo
  rationale: Hiki ni kifungu cha kawaida na cha asili cha Kiswahili cha kuanzisha taarifa ya nasaba; kiunganishi וְ hakihitaji kutafsiriwa kwa lazima kuwa “na” katika kichwa hiki.
- source_word: תֹּלְדֹת
  choice: vizazi
  rationale: “Vizazi” huhifadhi istilahi inayojirudia katika Mwanzo na upana wake wa maana kuhusu uzao au ukoo, bila kuifanya kuwa “wazao” pekee.
- source_word: יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: בֶּן אַבְרָהָם
  choice: mwana wa Abrahamu
  rationale: Hili ni tamko la kawaida la Kiswahili linalohifadhi uhusiano wa kifamilia wa muundo wa Kiebrania.
- source_word: אֲשֶׁר יָלְדָה
  choice: ambaye ... alimzalia
  rationale: Kitenzi cha Kiebrania kina Hajiri kama mtendaji wa kike; “alimzalia Abrahamu” huonyesha kwa kawaida kwamba alimzaa Ishmaeli na Abrahamu ndiye baba.
- source_word: הָגָר הַמִּצְרִית
  choice: Hajiri Mmisri
  rationale: Jina na utambulisho wa asili ya Hajiri umetolewa kwa namna fupi na ya kawaida katika Kiswahili.
- source_word: שִׁפְחַת שָׂרָה
  choice: mjakazi wa Sara
  rationale: “Mjakazi” ni neno la Kiswahili linaloeleweka kwa mwanamke aliye katika utumishi wa chini; tanbihi inaweka wazi kwamba Kiebrania kinaweza kumaanisha mtumwa wa kike.
- source_word: לְאַבְרָהָם
  choice: Abrahamu
  rationale: Katika muundo “alimzalia Abrahamu,” Kiswahili huwasilisha kwa kawaida uhusiano wa kuzaa mtoto ambaye Abrahamu ndiye baba.
