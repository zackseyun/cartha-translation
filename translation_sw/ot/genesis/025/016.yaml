  rationale: 'Marekebisho mawili ya tahadhari yamefanywa: “makazi” imechaguliwa kama tafsiri pana ya חַצְרֵיהֶם, na “makundi yao ya watu” imetumika kwa אֻמֹּתָם ili kuwasilisha maana ya vikundi vya watu bila kudokeza mataifa ya kisasa. Kazi ya “kulingana na” imehifadhiwa ili kuonyesha uhusiano wa uorodheshaji wa majina na maeneo, kama ilivyo katika Kiebrania na katika njia ya ukaguzi wa Kiingereza.'
