  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa 'Hawa ndio ... na haya ndiyo ...' umehifadhi muundo wa Kiebrania. Maneno 'kulingana na' yanadumisha uwezekano kwamba kishazi cha maeneo kinaainisha majina, huku tanbihi zikihifadhi upana wa msamiati wa maeneo na uongozi.
