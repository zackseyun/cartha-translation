base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Ishmaeli, na haya ndiyo majina yao kulingana na makazi yao[a] na kambi zao[b]: wakuu[c] kumi na wawili kwa makundi yao ya watu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vijiji vyao.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha vituo au makazi yenye ulinzi.
    reason: lexical_alternative
  - marker: c
    text: Au, “viongozi.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Hawa ndio
  rationale: Muundo huu wa Kiswahili unaakisi kiashiria pamoja na kiwakilishi cha Kiebrania na kwa kawaida hutambulisha au kujumlisha orodha.
- source_word: בְּנֵי יִשְׁמָעֵאל
  choice: wana wa Ishmaeli
  rationale: Katika muktadha huu ni wana halisi wa Ishmaeli waliotajwa katika orodha iliyotangulia, si wazao kwa maana pana.
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: na haya ndiyo majina yao
  rationale: Tafsiri ya moja kwa moja inayohifadhi urudiaji wa אֵלֶּה na kutofautisha kisarufi watu (hawa) na majina (haya).
- source_word: בְּחַצְרֵיהֶם
  choice: kulingana na vijiji vyao
  rationale: חָצֵר inaweza kumaanisha kijiji au makazi; 'vijiji' ni neno la kawaida na linaloeleweka. 'Kulingana na' huonyesha kwamba majina yanahusishwa au kuorodheshwa kwa maeneo hayo bila kulazimisha maana ya kukaa ndani yake.
- source_word: וּבְטִירֹתָם
  choice: na kambi zao
  rationale: טִירָה inaweza kutaja kambi, kituo, au makazi yenye ulinzi. 'Kambi' huhifadhi hali ya makazi yasiyo ya kudumu bila kuongeza dhana ya ngome isiyo wazi kabisa katika muktadha.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: wakuu kumi na wawili
  rationale: נָשִׂיא humaanisha mkuu au kiongozi wa kundi. 'Wakuu' linafaa kwa viongozi wa makundi ya kikabila na halidokezi bila lazima mfumo rasmi wa kifalme.
- source_word: לְאֻמֹּתָם
  choice: kwa mataifa yao
  rationale: אֻמָּה hurejelea makundi ya watu au mataifa. 'Mataifa yao' huhifadhi wingi na maana ya utambulisho wa makundi ya watu.
theological_decisions: []
