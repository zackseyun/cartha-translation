  source_fidelity: 'Maana ya jumla imehifadhiwa vizuri: wana wa Ishmaeli, majina yao yakihusishwa na makazi na kambi zao, na wakuu kumi na wawili. Hata hivyo, “mataifa yao” huweza kusikika kama dola za kisasa na ni pana kidogo kwa אֻמֹּתָם, ambayo hapa inarejelea makundi ya watu. “Makazi” ni istilahi pana zaidi na salama kwa חַצְרֵיהֶם kuliko “vijiji.”'
