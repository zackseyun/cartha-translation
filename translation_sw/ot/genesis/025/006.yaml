  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: sw
  text: Lakini Abrahamu aliwapa zawadi wana wa masuria wake; naye, alipokuwa bado hai, aliwatuma waende mbali na Isaka mwanawe, kuelekea mashariki, katika nchi ya mashariki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: Lakini Abrahamu aliwapa zawadi wana wa masuria wake
  rationale: Kiunganishi kinaonyesha tofauti na fungu lililotangulia kuhusu urithi wa Isaka. “Masuria” ni neno la kawaida la Kiswahili kwa wanawake waliokuwa na hadhi ya kindoa iliyo chini ya mke mkuu. Mpangilio huu ni wa asili katika Kiswahili na unaweka wazi kwamba Abrahamu ndiye aliyetoa zawadi.
- source_word: נָתַן ... מַתָּנֹת
  choice: aliwapa zawadi
  rationale: Huwasilisha kwa uwazi tendo la kutoa na walengwa wake bila kuongeza kwamba zawadi hizo zilikuwa urithi.
- source_word: וַיְשַׁלְּחֵם מֵעַל יִצְחָק בְּנוֹ
  choice: aliwaondoa karibu na Isaka mwanawe na kuwapeleka
  rationale: Kitenzi na kirai cha utengano vinaonyesha kuwatuma waende na kuwatenga na Isaka. Usemi huu unahifadhi maana zote mbili kwa Kiswahili cha kawaida.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: alipokuwa bado hai
  rationale: Hueleza kwa kawaida kwamba Abrahamu alifanya hayo kabla ya kufa.
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: upande wa mashariki, katika nchi ya mashariki
  rationale: Huhifadhi mwelekeo wa kwenda mashariki na maelezo ya eneo la mashariki, pamoja na urudiaji wa mzizi wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Tafsiri imehifadhi tofauti kati ya Isaka kama mrithi katika muktadha na wana wa masuria bila kuwaita zawadi hizo urithi. Hakuna tanbihi iliyohitajika kwa sababu maana ya maneno na miundo inaweza kutolewa wazi katika matini.
