  terminology: “Masuria,” “zawadi,” “Isaka mwanawe,” na “nchi ya mashariki” ni istilahi zinazofaa katika Kiswahili sanifu. “Abrahamu” ni tahajia ya kawaida katika tafsiri za Kiswahili.
