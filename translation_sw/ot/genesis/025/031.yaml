lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kauli ya wayyiqtol inaendeleza masimulizi; “akasema” ni namna ya kawaida ya Kiswahili ya kuonyesha mfuatano huo.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מִכְרָה
  choice: niuzie
  rationale: Ni amri ya kitenzi מכר, ‘kuuza’; umbo “niuzie” linaunganisha kwa kawaida mnufaika anayeelezwa na לִי.
- source_word: כַיּוֹם
  choice: leo
  rationale: Kirai hiki kinaweza kumaanisha “leo” au “kuanzia leo,” kikisisitiza shughuli ya mara moja yenye nguvu ya kudumu.
- source_word: אֶת
  choice: '[kiashiria cha yambwa mahsusi, hakitafsiriwi]'
  rationale: אֶת huonyesha yambwa mahsusi na kwa kawaida hakina neno la kutafsiriwa moja kwa moja katika Kiswahili.
- source_word: בְּכֹרָתְךָ
  choice: haki yako ya mzaliwa wa kwanza
  rationale: בְּכֹרָה hurejelea hadhi pamoja na haki na mapendeleo ya mwana wa kwanza; kirai hiki ni wazi zaidi kwa wasomaji wa Kiswahili kuliko neno moja lisilo la kawaida.
- source_word: לִי
  choice: ni- katika “niuzie”
  rationale: Kiambishi cha yambwa “ni-” huwasilisha kwa kawaida maana ya “kwangu/mimi” pamoja na kitenzi “uza.”
