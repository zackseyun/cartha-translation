base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: sw
  text: Ikawa baada ya kifo cha Abrahamu, Mungu akambariki Isaka mwanawe, naye Isaka akaishi karibu na Beer-Lahai-Roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer-Lahai-Roi ni jina la kisima; jina hilo la Kiebrania lilitajwa hapo awali katika Mwanzo 16:14.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi mwendelezo wa simulizi unaoletwa na muundo wa Kiebrania, huku ikiwa lugha ya Kiswahili iliyo fasaha na yenye hadhi.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: baada ya kifo cha Abrahamu
  rationale: Huwasilisha kwa kawaida na kwa usahihi uhusiano wa wakati katika kishazi cha Kiebrania.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: Mungu akambariki
  rationale: Kitenzi ברך hapa kina maana ya moja kwa moja ya kubariki, na אֱלֹהִים humrejelea Mungu.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: Isaka mwanawe
  rationale: Hufuata mpangilio wa Kiebrania kwa kumtaja Isaka kwanza, kisha kumtambua kuwa mwana wa Abrahamu.
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: Katika muhtasari huu wa simulizi, ישב hueleza kuishi au kukaa mahali; “akaishi” ni Kiswahili cha sasa na cha kawaida.
- source_word: עִם
  choice: karibu na
  rationale: Ingawa mara nyingi humaanisha “pamoja na,” mbele ya jina la mahali hapa huonyesha ukaribu wa mahali, si ushirika na mtu.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lahai-Roi
  rationale: Ni jina maalumu la kisima lililotajwa tayari katika Mwanzo 16:14; limetoholewa kwa herufi za Kiswahili badala ya kutafsiriwa.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika simulizi hili
  choice: Mungu
  alternative: Uungu
  rationale: Muktadha humrejelea wazi Mungu aliyembariki Isaka; “Mungu” ndiyo tafsiri ya kawaida, wazi, na isiyoingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Kiunganishi “naye” hutenganisha kwa uwazi tendo la Mungu na makazi ya Isaka bila kupoteza mtiririko wa Kiebrania.
