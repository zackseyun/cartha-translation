base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: sw
  text: Vijana walipokua, Esau akawa mwindaji stadi, mtu wa porini; lakini Yakobo alikuwa mtu mtulivu[a], aliyeishi mahemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnyofu,” “asiye na lawama,” au “asiye na hila.” Neno la Kiebrania linaweza kumaanisha ukamilifu, unyoofu, kutokuwa na hatia, au urahisi wa tabia kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: Wale vijana walipokua
  rationale: Katika muktadha wa wana hao mapacha kukomaa, kitenzi kinaeleza kukua kwao; “vijana” ni Kiswahili cha sasa kinachofaa katika hatua yao ya kuelekea utu uzima.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: mwindaji stadi
  rationale: Muundo huu unaonyesha ujuzi na uzoefu katika kuwinda, si kujua kuwinda kwa nadharia tu.
- source_word: אִישׁ שָׂדֶה
  choice: mtu wa nyikani
  rationale: Neno שָׂדֶה hapa linaelekea kumaanisha eneo la wazi lisilo la makazi, ambako Esau aliwinda; “nyikani” huwasilisha tofauti na maisha ya Yakobo mahemani bila tafsiri ngumu ya neno kwa neno.
- source_word: אִישׁ תָּם
  choice: mtu mtulivu
  rationale: תָּם linaweza kuonyesha ukamilifu, unyoofu, kutokuwa na hatia, au hali isiyo na hila; katika ulinganisho huu wa maisha ya Esau na Yakobo, “mtulivu” ni ya asili, huku tanbihi ikihifadhi uwezekano mwingine wa maana.
- source_word: יֹשֵׁב אֹהָלִים
  choice: aliyeishi mahemani
  rationale: Kirai kinaonyesha makao au mtindo wa maisha wa kawaida wa Yakobo na kinatofautiana na maisha ya Esau nyikani.
theological_decisions:
- issue: Maana ya תָּם katika maelezo ya Yakobo
  choice: mtu mtulivu
  alternative: mtu mnyofu; mtu asiye na lawama; mtu asiye na hila
  rationale: Muktadha wa karibu unalinganisha mitindo ya maisha ya ndugu hao. Tafsiri kuu haifanyi hukumu kali ya kimaadili juu ya Yakobo, lakini tanbihi inahifadhi upana halisi wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyikani” limetumiwa kwa maana ya eneo la wazi la uwindaji, na “mahemani” limehifadhi picha ya maisha ya kuhamahama. Alama ya tanbihi imewekwa mara moja baada ya neno lenye utata.
