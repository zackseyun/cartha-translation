base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: sw
  text: 'Hii ndiyo miaka ya maisha ya Ishmaeli: miaka mia moja na thelathini na saba. Akakata roho, akafa, akakusanywa pamoja na watu wake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Akakusanywa pamoja na watu wake” ni nahau ya Kiebrania inayotumiwa katika taarifa za kifo. Inaweza kumaanisha kuungana na waliotangulia kufa, kuzikwa miongoni mwa jamaa zake, au yote mawili.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: Hii ndiyo miaka ya maisha ya Ishmaeli
  rationale: Muundo huu wa Kiswahili unaonyesha kuwa kauli hii ni muhtasari wa urefu wa maisha ya Ishmaeli, huku ukihifadhi wazo la Kiebrania la ‘miaka ya maisha.’
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: miaka mia moja thelathini na saba
  rationale: Huwasilisha jumla kamili ya miaka 137 kwa mpangilio wa kawaida na unaoeleweka katika Kiswahili.
- source_word: וַיִּגְוַע
  choice: Akakata roho
  rationale: Kitenzi hiki humaanisha kufikia mwisho wa uhai au kutoa pumzi ya mwisho. ‘Akakata roho’ ni usemi wa kawaida wa Kiswahili unaokitofautisha na kitenzi kinachofuata, ‘akafa.’
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kimetafsiriwa tofauti na וַיִּגְוַע ili kuhifadhi vitenzi viwili vya kifo vilivyotumiwa mfululizo katika Kiebrania.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: akakusanywa kwa watu wake
  rationale: Huhifadhi nahau ya Kiebrania badala ya kuifasiri moja kwa moja kuwa maziko au kuungana na waliotangulia kufa.
theological_decisions:
- issue: Maana ya usemi wa kifo ‘akakusanywa kwa watu wake’
  choice: Nahau imehifadhiwa bila kuamua maana yake kwa undani.
  alternative: ‘akazikwa pamoja na jamaa zake’ au ‘akaungana na watu wake waliokufa’
  rationale: Kiebrania kinaweza kudokeza kukusanywa kwa mababu, kuzikwa miongoni mwa jamaa, au yote mawili; tafsiri haipaswi kuondoa utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Mfuatano ‘akakata roho, akafa’ umehifadhi marudio ya makusudi ya Kiebrania.
