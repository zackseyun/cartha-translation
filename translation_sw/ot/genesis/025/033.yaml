  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: sw
  text: Yakobo akasema, “Niapie leo.[a]” Basi Esau akamwapia Yakobo, kisha akauza haki yake ya mzaliwa wa kwanza kwa Yakobo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Niapie siku hii.”
    reason: lexical_alternative
  - marker: b
    text: “Haki ya mzaliwa wa kwanza” inahusu haki na hadhi zinazomhusu mwana wa kwanza.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: Niapie
  rationale: Kauli ya amri katika fomula ya kiapo, pamoja na לִּי, inaomba kiapo kifanywe kwa Yakobo; “niapie” ni ya moja kwa moja na ya asili katika Kiswahili.
- source_word: כַּיּוֹם
  choice: leo
  rationale: Usemi huu wa wakati unaweza kumaanisha “leo,” “siku hii,” au “kuanzia leo”; “leo” ni wazi na huhifadhi ufupi wa Kiebrania, huku mbadala zikitajwa katika tanbihi.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: akamwapia
  rationale: Huhifadhi uhusiano wa kitenzi na amri ya Yakobo na kuonyesha kwamba Esau alimwapia Yakobo.
- source_word: וַיִּמְכֹּר
  choice: akamuuzia
  rationale: Kitenzi מכר kinamaanisha kuuza; “akamuuzia” huhifadhi dhana halisi ya muamala na humtaja Yakobo kama mpokeaji.
- source_word: בְּכֹרָתוֹ
  choice: haki yake ya mzaliwa wa kwanza
  rationale: Tafsiri hii inaeleweka kwa wasomaji wa sasa na huwasilisha haki na hadhi zinazomhusu mwana wa kwanza bila kutegemea istilahi isiyoeleweka kwa urahisi.
- source_word: לְיַעֲקֹב
  choice: Yakobo
  rationale: Kiambishi לְ humtaja Yakobo kuwa mpokeaji wa kile kilichouzwa; muundo “akamuuzia Yakobo” ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Asili ya uhamisho wa בְּכֹרָה
  choice: akamuuzia Yakobo haki yake ya mzaliwa wa kwanza
  alternative: akamuuzia Yakobo uzaliwa wake wa kwanza
  rationale: Mstari unaeleza muamala halisi wa kuachia haki na hadhi ya mwana wa kwanza. Tafsiri iliyochaguliwa huweka dhana ya kifamilia na kisheria bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni mfupi na wa moja kwa moja; jina “Esau” limetajwa wazi pale ambapo Kiebrania kina kiwakilishi ili kuzuia utata wa mhusika katika Kiswahili.
