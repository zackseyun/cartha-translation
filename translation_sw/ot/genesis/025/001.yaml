  text: Abraham took another wife[a], and her name was Keturah.
translation:
  language: sw
  text: Abrahamu akaoa mke mwingine[a], na jina lake lilikuwa Ketura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Abrahamu akaoa tena.” Kiebrania hutumia usemi wa nyongeza: “Abrahamu akaongeza na kuchukua mke.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: mwingine
  rationale: Kitenzi יסף kina maana ya kuongeza au kufanya tena. Katika muundo huu, “mke mwingine” huwasilisha kwa Kiswahili cha kawaida wazo la kwamba Abrahamu aliongeza mke, bila kutumia tafsiri ngumu ya neno kwa neno.
- source_word: וַיִּקַּח
  choice: akaoa
  rationale: Neno לקח linapotumiwa pamoja na אִשָּׁה ni nahau ya Kiebrania yenye maana ya kumchukua mwanamke awe mke. “Akaoa” ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: אִשָּׁה
  choice: mke
  rationale: Ingawa אִשָּׁה linaweza kumaanisha mwanamke au mke, hapa muundo wake pamoja na לקח unaonyesha wazi uhusiano wa ndoa.
- source_word: וּשְׁמָהּ
  choice: naye aliitwa
  rationale: Huu ni usemi wa kawaida wa Kiswahili wa kutambulisha jina la mtu, huku ukihifadhi maana ya kishazi cha Kiebrania, “na jina lake lilikuwa.”
- source_word: קְטוּרָה
  choice: Ketura
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Iwapo maana ya kuongeza au kurudia katika וַיֹּסֶף iwekwe wazi kuhusiana na Abrahamu kuoa
  choice: Abrahamu akaoa mke mwingine
  alternative: Abrahamu akaoa tena
  rationale: Kiebrania kinaweza kusisitiza kuongeza au kufanya tena. “Mke mwingine” huonyesha wazi maana ya nyongeza, huku tanbihi ikihifadhi uwezekano wa kuitafsiri kama “akaoa tena,” bila kuamua zaidi ya ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya kisasa, yenye staha na inayoeleweka kwa urahisi. “Akaoa” limetumiwa badala ya tafsiri ya moja kwa moja “akamchukua mke,” ambayo si ya kawaida katika Kiswahili cha sasa.
