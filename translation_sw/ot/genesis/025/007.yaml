- source_word: אֲשֶׁר חָי
  choice: aliyoishi
  rationale: Kishazi rejeshi kimehifadhiwa kwa kuwa kinarudia na kusisitiza muda halisi ambao Abrahamu aliishi.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: miaka mia moja sabini na mitano
  rationale: Hesabu ya Kiebrania ya 100 + 70 + 5 imetolewa kwa mpangilio wa kawaida wa namba katika Kiswahili bila kubadili jumla.
