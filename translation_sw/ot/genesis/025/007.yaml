- source_word: וְאֵלֶּה
  choice: Hii ndiyo
  rationale: Kishazi hiki kinatanguliza muhtasari wa umri wa Abrahamu; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
