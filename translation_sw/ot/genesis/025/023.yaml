base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: sw
  text: 'Yahwe akamwambia:


    “Mataifa mawili yako tumboni mwako,

    na jamii mbili zitatengana kutoka ndani yako.

    Jamii moja itakuwa na nguvu kuliko nyingine,

    na mkubwa atamtumikia mdogo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mkubwa … mdogo” pia inaweza kueleweka kuwa “aliye mkubwa kwa umri … aliye mdogo kwa umri,” au “aliye mkuu … aliye wa cheo cha chini.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu kwa umbo la kawaida la Kiswahili, badala ya kulibadili kuwa cheo.
- source_word: שְׁנֵי גיים
  choice: mataifa mawili
  rationale: גוי hapa inaonyesha makundi mawili ya kikabila na kisiasa yatakayotokana na wale mapacha; “mataifa” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: בְּבִטְנֵךְ
  choice: tumboni mwako
  rationale: Katika muktadha wa ujauzito, usemi huu wa kawaida wa Kiswahili unaonyesha kwa wazi mahali watoto walipo.
- source_word: שְׁנֵי לְאֻמִּים
  choice: jamii mbili
  rationale: “Jamii” hutofautisha לְאֻמִּים na “mataifa” ya mstari wa kwanza huku ikidumisha usambamba wa kishairi.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: zitatengana kutoka ndani yako
  rationale: Inatunza maana ya kutoka ndani ya Rebeka pamoja na hali ya kutengana kwa jamii hizo, bila kudai kwamba mgawanyiko huo ulikamilika kabla ya kuzaliwa.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: Jamii moja itakuwa na nguvu kuliko nyingine
  rationale: Muundo wa kulinganisha unasema kwamba moja ya jamii hizo itakuwa yenye nguvu kuliko nyingine; Kiswahili hiki ni wazi na cha asili.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: na mkubwa atamtumikia mdogo
  rationale: “Mkubwa” na “mdogo” yanaweza kuonyesha umri au hadhi/uwezo, hivyo yanatunza kwa kiasi kizuri upana wa maneno ya Kiebrania רַב na צָעִיר.
theological_decisions:
- issue: Maana ya וְרַב יַעֲבֹד צָעִיר
  choice: mkubwa atamtumikia mdogo
  alternative: aliye mkubwa kwa umri atamtumikia aliye mdogo kwa umri; au aliye mkuu atamtumikia aliye mdogo
  rationale: Muktadha wa mapacha unaunga mkono tofauti ya umri, lakini maneno ya Kiebrania yanaweza pia kuonyesha ukubwa au hadhi. Kiswahili “mkubwa ... mdogo” kinatunza mvutano huo badala ya kuufunga kwa tafsiri moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha ya sasa yenye heshima. Usambamba wa “mataifa mawili / jamii mbili” umetunzwa, na “mkubwa / mdogo” umechaguliwa ili kuhifadhi utata halisi wa Kiebrania.
