lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: shamba
  rationale: Nomino yenye kibainishi inarejelea eneo la maziko lililotajwa tayari; “shamba” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: אֲשֶׁר
  choice: ambalo
  rationale: Kiwakilishi rejeshi kinakubaliana na “shamba” na kuanzisha kishazi kinacholifafanua.
- source_word: קָנָה
  choice: alinunua
  rationale: Katika muktadha wa shughuli ya ardhi, kitenzi hiki kina maana halisi ya kununua.
- source_word: מֵאֵת
  choice: kutoka kwa
  rationale: Huonyesha watu ambao mali ilinunuliwa kwao; usemi huu ni wa kawaida katika Kiswahili.
- source_word: בְּנֵי חֵת
  choice: wazao wa Hethi
  rationale: Huhifadhi muundo wa kifamilia au kikabila wa Kiebrania na uhusiano na jina Hethi bila kudokeza kwamba ni wana wa moja kwa moja pekee.
- source_word: שָׁמָּה
  choice: humo
  rationale: Kielezi cha mahali kinarejelea ndani ya shamba hilo, hasa eneo la maziko.
- source_word: קֻבַּר
  choice: walizikwa
  rationale: Ingawa Kiebrania kina kitenzi cha umoja kilichotangulia kiima ambatano, Kiswahili cha kawaida hutumia wingi ili kuonyesha wazi kwamba Abrahamu na Sara wote walizikwa.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: na Sara mkewe
  rationale: Hufuata mpangilio wa Kiebrania kwa karibu huku ikibaki ya asili na yenye heshima katika Kiswahili.
