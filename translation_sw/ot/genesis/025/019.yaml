  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: sw
  text: 'Hivi ndivyo vizazi vya Isaka[a], mwana wa Abrahamu: Abrahamu alimzaa Isaka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “habari” au “ukoo”; neno la Kiebrania toledot ni istilahi ya kichwa inayojirudia katika kitabu cha Mwanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hivi ndivyo
  rationale: Muundo huu unaanzisha sehemu mpya kwa Kiswahili cha kawaida na kuhifadhi kazi ya kishazi kama kichwa, bila kuongeza neno la wakati lisilokuwapo wazi katika Kiebrania.
- source_word: תּוֹלְדֹת
  choice: vizazi
  rationale: Neno hili ni istilahi inayojirudia katika Mwanzo kama kichwa cha habari kuhusu yatokanayo na mtu au ukoo wake. “Vizazi” huhifadhi upana na ulinganifu wa muundo huo kuliko tafsiri finyu zaidi.
- source_word: יִצְחָק
  choice: Isaka
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia ya Kiswahili.
- source_word: בֶּן אַבְרָהָם
  choice: mwana wa Abrahamu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kirai cha nasaba, ikitambulisha wazi uhusiano wa Isaka na Abrahamu.
- source_word: הוֹלִיד
  choice: alimzaa
  rationale: Katika muktadha huu wa nasaba, kitenzi cha Kiebrania kinamaanisha kwamba Abrahamu alimzaa Isaka. Kiswahili hutumia “zaa” kwa mzazi wa kiume pia, kwa hiyo ni wazi na asilia.
- source_word: אֶת יִצְחָק
  choice: Isaka
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi kwa neno tofauti; yambwa wake umetafsiriwa kuwa “Isaka.”
theological_decisions:
- issue: Tafsiri ya fomula ya תּוֹלְדֹת inayojirudia katika Mwanzo
  choice: vizazi
  alternative: habari; ukoo; historia ya jamaa
  rationale: “Vizazi” huhifadhi istilahi pana ya kimuundo inayotumiwa kama kichwa katika Mwanzo, bila kuamua kimyakimya kwamba sehemu inayofuata ni masimulizi tu, orodha ya wazao tu, au historia ya familia kwa maana finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Hivi ndivyo” unasomeka kwa urahisi kama kichwa cha sehemu; majina “Isaka” na “Abrahamu” yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili.
