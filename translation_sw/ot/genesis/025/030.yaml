base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: sw
  text: Esau akamwambia Yakobo, “Tafadhali, nipe baadhi ya hicho chekundu, hicho chekundu hapo, niweze kukimeza kwa pupa, kwa maana nimechoka sana.” Ndiyo sababu aliitwa Edomu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Jina Edomu linafanana kwa sauti na neno la Kiebrania linalomaanisha “chekundu,” hivyo mstari huu una mchezo wa maneno.
    reason: cross_reference
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: nipe nimeze kwa pupa
  rationale: Kauli ya Hiphil yenye kiambishi cha nafsi ya kwanza inaomba Yakobo ampe chakula ili akimeze kwa pupa. Tafsiri hii inadumisha dharura na usemi usio na ustaarabu mwingi wa Esau bila kutumia Kiswahili kisicho cha kawaida.
- source_word: נָא
  choice: Tafadhali
  rationale: Ni chembe ya ombi; “tafadhali” ndiyo njia ya kawaida ya kuionyesha katika Kiswahili cha sasa, huku muktadha ukibaki na hisia ya haraka.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: baadhi ya hicho chekundu, hicho chekundu hapo
  rationale: Kiebrania hurudia kivumishi “chekundu” bila kutaja chakula. Muundo huu unahifadhi udondoshaji huo, marudio ya Esau, na nguvu ya kuonyesha kitu iliyo katika הַזֶּה.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: kwa maana nimechoka sana
  rationale: עָיֵף huonyesha uchovu mkubwa. “Nimechoka sana” ni Kiswahili cha kawaida na hakiongezi wazo la kuzirai ambalo huenda likawa kali mno.
- source_word: עַל כֵּן
  choice: Ndiyo sababu
  rationale: Ni kiunganishi cha hitimisho kinachoanzisha maelezo ya jina; “Ndiyo sababu” ni cha asili na wazi katika Kiswahili.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: aliitwa Edomu
  rationale: Kauli ya Kiebrania ni fomula ya kumpa jina. Kiswahili “aliitwa Edomu” ni cha kawaida na kinaacha kutotajwa kwa mtendaji kama ilivyo katika umbo la kitenzi.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Jina la mahali na la ukoo limetoholewa kwa tahajia inayotumika katika Kiswahili. Uhusiano wake wa sauti na neno la Kiebrania la “chekundu” unaelezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio yasiyo laini ya “hicho chekundu” yamedumishwa kwa makusudi ili kuonyesha udondoshaji na msukumo wa usemi wa Kiebrania. “Nipe nimeze kwa pupa” ni ya kawaida zaidi kuliko tafsiri halisi isiyo ya asili kama “nilishe,” lakini bado inaonyesha maana ya kumeza kwa ulafi.
