lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן kina maana ya msingi ya ‘kutoa/kumpa.’ Muundo wa simulizi wa wayyiqtol umetafsiriwa kwa wakati uliopita; kiambishi -m- kinaonyesha mpokeaji.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: אֶת
  choice: '[hakijatafsiriwa kivyake]'
  rationale: Ni alama ya yambwa moja kwa moja katika Kiebrania na hakina neno huru linalolingana nacho katika Kiswahili; kazi yake inaonekana katika mpangilio wa sentensi.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: kila kitu alichokuwa nacho
  rationale: Kirai hiki kihalisi ni ‘yote yaliyokuwa yake.’ Tafsiri iliyochaguliwa ni ya kawaida na wazi katika Kiswahili, huku ikidumisha wigo kamili wa mali ya Abrahamu.
- source_word: לְיִצְחָק
  choice: Isaka
  rationale: Kihusishi לְ kinaonyesha mpokeaji. Katika Kiswahili, maana ya ‘kwa Isaka’ imejengwa kwa kawaida ndani ya kitenzi ‘akampa,’ hivyo jina linafuata bila kihusishi.
