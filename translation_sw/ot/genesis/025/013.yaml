  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: sw
  text: 'Na haya ndiyo majina ya wana wa Ishmaeli, kwa majina yao, kulingana na vizazi vyao[a]: Mzaliwa wa kwanza wa Ishmaeli alikuwa Nebayothi, kisha Kedari, Adbeeli, na Mibsamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na nasaba zao.” Neno la Kiebrania linaweza kumaanisha mistari ya uzao katika muktadha wa nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na haya ndiyo
  rationale: Huhifadhi kiunganishi cha Kiebrania na kuanzisha orodha mpya kwa mtindo wa kawaida wa masimulizi ya Kiswahili.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: majina ya wana wa Ishmaeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa nasaba.
- source_word: בִּשְׁמֹתָם
  choice: kwa majina yao
  rationale: Huhifadhi urudiaji wa kimakusudi na mtindo rasmi wa kifungu cha Kiebrania.
- source_word: לְתוֹלְדֹתָם
  choice: kulingana na vizazi vyao
  rationale: Neno hili katika muktadha wa nasaba linaweza kumaanisha vizazi au mistari ya ukoo; chaguo hili huhifadhi upana wake bila kulifanya kuwa makabila.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: mzaliwa wa kwanza wa Ishmaeli
  rationale: Humtambulisha Nebayothi wazi kuwa mwana wa kwanza huku likidumisha lugha ya nasaba.
- source_word: נְבָיֹת
  choice: Nebayothi
  rationale: Tahajia hii inafuata namna iliyozoeleka ya kuandika jina hili katika Kiswahili.
- source_word: קֵדָר
  choice: Kedari
  rationale: Tahajia ya Kiswahili inayotambulika kwa jina hili.
- source_word: אַדְבְּאֵל
  choice: Adbeeli
  rationale: Tahajia ya Kiswahili inayotambulika kwa jina hili.
- source_word: מִבְשָׂם
  choice: Mibsamu
  rationale: Tahajia ya Kiswahili inayotambulika kwa jina hili.
