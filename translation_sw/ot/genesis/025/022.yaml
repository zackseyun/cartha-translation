  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipengele vya Kiebrania: watoto wanatenda kwa kurudiana ndani ya Rebeka; kauli ya masharti na swali la Rebeka zimehifadhiwa; na לדרוש את יהוה imewasilishwa kama kwenda kumwuliza Yahwe katika muktadha wa kutafuta jibu la kiungu. Neno “watoto” linafaa kwa muktadha wa kabla ya kuzaliwa bila kuondoa ukweli kwamba baadaye wanatajwa kuwa wana.'
