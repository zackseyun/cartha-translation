base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: sw
  text: Watoto wakasukumana ndani yake, naye akasema, “Ikiwa ni hivyo, kwa nini niko hivi?[a]” Basi akaenda kumwuliza Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nini mimi?” Kauli ya Kiebrania ni fupi na ina utata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: wakasukumana
  rationale: Umbo la kitenzi linaonyesha tendo la kurudiana na lenye nguvu kati ya watoto. ‘Wakasukumana’ ni Kiswahili cha kawaida kinachoonyesha msukosuko wa watoto bila kuzidisha maana kuwa walipondana.
- source_word: הַבָּנִים
  choice: watoto
  rationale: Ingawa neno linaweza kumaanisha ‘wana,’ hapa bado wako tumboni; ‘watoto’ ni la asili zaidi katika Kiswahili na haliukanushi kwamba walikuwa wa kiume.
- source_word: בְּקִרְבָּהּ
  choice: ndani yake
  rationale: Hii inafuata maana ya ‘katikati/ndani yake’ bila kuongeza moja kwa moja neno ‘tumbo,’ ambalo linaeleweka kutokana na muktadha lakini halipo katika kirai hiki.
- source_word: אִם כֵּן
  choice: Ikiwa ni hivyo
  rationale: Kirai hiki kinaanzisha mwitikio wa Rebeka kwa hali inayomsumbua na kimewasilishwa kwa Kiswahili cha wazi na cha asili.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: kwa nini niko hivi?
  rationale: Kiebrania ni kifupi na kina utata. Tafsiri hii inaonyesha kilio cha Rebeka kuhusu hali yake bila kukifanya kwa lazima kuwa swali la kifalsafa kuhusu kuwapo kwake.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: akaenda kumwuliza Yahwe
  rationale: Katika muktadha huu, kitenzi kinamaanisha kutafuta jibu au mwongozo wa Mungu. ‘Kumwuliza’ ni wazi na cha kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ huhifadhi jina hilo kama jina binafsi badala ya kuweka cheo mahali pake.
- issue: Utata wa kilio cha Rebeka לָמָּה זֶּה אָנֹכִי
  choice: kwa nini niko hivi?
  alternative: kwa nini mimi?
  rationale: Kauli ya Kiebrania imeachwa kwa ufupi na inaweza kueleweka kwa namna zaidi ya moja. Tafsiri kuu inafaa muktadha wa ujauzito wenye maumivu, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida, huku utata halisi wa kauli ya Rebeka ukihifadhiwa katika tanbihi.
