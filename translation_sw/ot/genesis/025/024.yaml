  text: Siku zake za kuzaa zilipotimia, tazama, kulikuwa na mapacha tumboni mwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ
  choice: Siku zake ... zilipotimia
  rationale: Nahau ya Kiebrania inaonyesha kwamba kipindi kilichowekwa kilikamilika. Kiswahili hiki kinahifadhi picha ya ‘siku zake’ huku kikisomeka kwa kawaida.
- source_word: לָלֶדֶת
  choice: za kuzaa
  rationale: Inaeleza kusudi au wakati wa kujifungua; ‘za kuzaa’ inaungana kwa kawaida na ‘siku zake’ katika sentensi hii.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Inahifadhi kiashiria cha kisimulizi kinachovuta fikira kwenye jambo muhimu au la kushangaza linalofuata.
- source_word: תוֹמִם
  choice: mapacha
  rationale: Ni neno la kawaida na sahihi la Kiswahili kwa watoto wawili waliomo katika ujauzito mmoja.
- source_word: בְּבִטְנָהּ
  choice: tumboni mwake
  rationale: Katika muktadha wa ujauzito, usemi huu wa kawaida wa Kiswahili huonyesha ndani ya tumbo la uzazi bila kulazimisha istilahi ya kitaalamu.
