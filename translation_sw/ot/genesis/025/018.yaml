base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: sw
  text: Wakaishi kuanzia Havila hadi Shuri, ambayo iko mkabala na Misri, ukienda kuelekea Ashuru.[a] Naye akakaa mkabala na ndugu zake wote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina “Ashuru” linaweza pia kutafsiriwa “Ashiria.”
    reason: lexical_alternative
  - marker: b
    text: Kifungu cha Kiebrania kinaweza pia kueleweka kuwa aliishi kwa uhasama na ndugu zake wote; kwa tafsiri ya moja kwa moja zaidi, “akaanguka mbele ya ndugu zake wote.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: Wakaishi
  rationale: Kitenzi cha Kiebrania kina maana ya kukaa au kuishi mahali; “wakaishi” ni cha kawaida na kinafaa kwa maelezo ya eneo walilokalia.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: kuanzia Havila hadi Shuri
  rationale: Huu ni usemi wa mipaka ya eneo, kutoka mahali pamoja hadi pengine.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: ulio mkabala na Misri
  rationale: עַל־פְּנֵי inaweza kumaanisha mbele ya au mkabala na; tafsiri hii inahifadhi maelezo ya kijiografia bila kubainisha upande usiotajwa wazi.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: unapoelekea Ashuru
  rationale: Umbo lenye kiambishi cha mwelekeo linaonyesha safari kuelekea Ashuru.
- source_word: עַל־פְּנֵי כָל־אֶחָיו נָפָל
  choice: Naye akakaa mkabala na ndugu zake wote
  rationale: Usemi huu una utata. “Mkabala na” huhifadhi maana ya mahali na pia uwezekano wa uhusiano wa kupingana, huku “akakaa” ikitoa maana inayofaa muktadha badala ya tafsiri ya moja kwa moja “akaanguka.”
theological_decisions:
- issue: Maana ya עַל־פְּנֵי כָל־אֶחָיו נָפָל
  choice: Naye akakaa mkabala na ndugu zake wote
  alternative: Aliishi kwa uhasama na ndugu zake wote; au kwa tafsiri ya moja kwa moja, akaanguka mbele ya ndugu zake wote
  rationale: Kifungu cha Kiebrania ni cha kinahau na kinaweza kueleweka kijiografia au kama kuonyesha upinzani. Matini kuu inatumia lugha isiyoamua kabisa kati ya maana hizo, na tanbihi inaweka wazi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Majina ya mahali yametolewa kama Havila, Shuri na Ashuru. Muundo wa wingi katika sentensi ya kwanza na umoja katika ya pili umehifadhiwa ili kuonyesha ukoo wa Ishmaeli kisha Ishmaeli kama mwakilishi wake.
