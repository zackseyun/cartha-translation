base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: sw
  text: Wanawe, Isaka na Ishmaeli, wakamzika katika pango la Makpela, katika shamba la Efroni, mwana wa Sohari, Mhiti, lililo mkabala na Mamre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “lililo mbele ya Mamre” au “linaloelekeana na Mamre.” Usemi wa Kiebrania unaweza kuonyesha mahali palipo mbele ya au mkabala na alama fulani ya eneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: wakamzika
  rationale: Kitenzi hiki kinaendeleza mfululizo wa masimulizi; kiambishi “waka-” kinaonyesha tukio lililofuata, na “-m-” humrejelea Abrahamu.
- source_word: אֹתוֹ
  choice: -m-
  rationale: Kiambishi cha yambwa cha nafsi ya tatu umoja humrejelea Abrahamu aliyetajwa katika muktadha uliotangulia.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: Wanawe Isaka na Ishmaeli
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unaonyesha wazi kwamba Isaka na Ishmaeli ni wana wa Abrahamu.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: katika pango la Makpela
  rationale: Ingawa אֶל mara nyingi humaanisha kuelekea, katika muktadha wa maziko Kiswahili cha kawaida hutumia “katika.” Jina Makpela limetoholewa kama jina la mahali.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: katika shamba la Efroni
  rationale: Kirai hiki kinafafanua zaidi mahali pa maziko; “katika” ni cha kawaida na huepuka tafsiri isiyo ya kawaida ya kuelekea shambani.
- source_word: בֶּן צֹחַר
  choice: mwana wa Sohari
  rationale: Hii ni tafsiri ya moja kwa moja ya uhusiano wa ukoo.
- source_word: הַחִתִּי
  choice: Mhiti
  rationale: Neno la Kiebrania ni utambulisho wa kikabila, uliotolewa kwa umbo la kawaida la Kiswahili.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: lililo mkabala na Mamre
  rationale: Katika maelezo ya kijiografia, עַל־פְּנֵי inaweza kumaanisha kuwa mbele ya, kukabili, au kuwa mkabala na mahali fulani. “Mkabala na” ni wazi bila kuongeza upande wa dira ambao haujatajwa.
