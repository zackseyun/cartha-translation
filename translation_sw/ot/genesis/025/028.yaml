  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: sw
  text: Isaka alimpenda Esau kwa sababu mawindo yalikuwa kinywani mwake[a], lakini Rebeka alimpenda Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa sababu mawindo yalikuwa kinywani mwake.” Huenda usemi huu unamaanisha kwamba Isaka alimpendelea Esau kwa sababu alifurahia mawindo ambayo Esau alimletea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: alimpenda
  rationale: Qal wayyiqtol ya אָהַב inaeleza tendo la wakati uliopita katika simulizi; “alimpenda” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: אֶת עֵשָׂו
  choice: Esau
  rationale: אֶת ni kiashiria cha yambwa tendwa na hakitafsiriwi; jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatanguliza sababu ya Isaka kumpenda Esau.
- source_word: צַיִד
  choice: mawindo
  rationale: צַיִד hurejelea mnyama au chakula kilichopatikana kwa kuwinda; “mawindo” huhifadhi upana huo bila kuifanya iwe nyama ya aina fulani.
- source_word: בְּפִיו
  choice: yalikuwa kinywani mwake
  rationale: Huhifadhi taswira halisi ya Kiebrania, “katika kinywa chake,” bila kuamua kimya kimya kwamba maana pekee ni Isaka kufurahia kula mawindo ya Esau.
- source_word: וְרִבְקָה
  choice: lakini Rebeka
  rationale: Ingawa וְ kwa kawaida ni “na,” hapa inaunganisha vifungu vyenye upendeleo unaotofautiana wa wazazi; “lakini” huonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: אֹהֶבֶת
  choice: alimpenda
  rationale: Kirai shirikishi kinaweza kuonyesha hali endelevu au ya kawaida; wakati uliopita ni wa asili katika muktadha huu wa simulizi.
- source_word: אֶת יַעֲקֹב
  choice: Yakobo
  rationale: אֶת haitafsiriwi, na jina linatolewa kwa umbo lake lililozoeleka katika Kiswahili.
