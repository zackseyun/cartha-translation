  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: sw
  text: Yokshani akamzaa Sheba na Dedani. Wana wa Dedani walikuwa Ashuri[a], Letushi, na Leumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Huenda majina haya yakawa majina ya koo: Ashuri, Letushi, na Leumi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: Yokshani
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: יָלַד
  choice: akamzaa
  rationale: Katika nasaba, kitenzi hiki huonyesha kuwa mwanamume alimzaa au alikuwa baba wa mtu; ‘akamzaa’ ni kifupi, cha kawaida, na kinafuata umbo la Kiebrania.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Jina limetoholewa badala ya kutafsiriwa.
- source_word: דְּדָן
  choice: Dedani
  rationale: Jina limetoholewa kwa umbo linalofaa matamshi ya Kiswahili.
- source_word: בְנֵי
  choice: wana wa
  rationale: Huhifadhi maana ya msingi ya ‘wana,’ huku ikiruhusu uwezekano wa kuwa hawa ni wazao au koo.
- source_word: הָיוּ
  choice: walikuwa
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi kinachotambulisha majina yanayofuata.
- source_word: אַשּׁוּרִם
  choice: Waashuri
  rationale: Umbo la wingi lenye kiambishi Wa- linaonyesha kwa kawaida watu au ukoo katika Kiswahili bila kuligeuza kuwa jina la kawaida.
- source_word: לְטוּשִׁים
  choice: Waletushi
  rationale: Jina la ukoo au kundi limetoholewa na kupewa umbo la wingi la Kiswahili.
- source_word: לְאֻמִּים
  choice: Waleumi
  rationale: Limetoholewa kama jina la ukoo badala ya kutafsiriwa kuwa ‘mataifa,’ kwa kuwa muktadha unalitumia kama jina maalumu.
theological_decisions:
- issue: Ikiwa majina matatu ya mwisho ni wana binafsi au majina ya koo
  choice: Maandishi makuu yanatumia ‘wana’ na majina ya makundi yenye Wa-, huku tanbihi ikitaja uwezekano wa majina ya koo.
  alternative: Kuyataja yote kama majina ya watu binafsi bila tanbihi.
  rationale: Kiebrania kinasema kihalisi ‘wana wa Dedani,’ lakini maumbo ya wingi yanaweza kutaja koo au makundi ya watu; tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa nasaba umewekwa kwa ufupi; majina yametoholewa kwa namna inayosomeka kwa urahisi.
