  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: sw
  text: Wa kwanza akatoka, akiwa mwekundu[a]; mwili wake wote ulikuwa kama joho lenye nywele[b], nao wakamwita Esau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwekundu-kidogo” au “mwenye wekundu.” Kivumishi cha Kiebrania kinaeleza sura yenye wekundu.
    reason: lexical_alternative
  - marker: b
    text: Au “kama vazi la nywele” au “kama joho la nywele.” Kiebrania hutumia tashbihi yenye maneno ya “joho/vazi” na “nywele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi cha kawaida cha kutoka kinaeleza kuzaliwa kwa mtoto kwa lugha ya moja kwa moja na ya asili katika Kiswahili.
- source_word: הָרִאשׁוֹן
  choice: wa kwanza
  rationale: Kinamtambulisha pacha aliyetoka kwanza na kuhifadhi mpangilio wa kuzaliwa.
- source_word: אַדְמוֹנִי
  choice: akiwa mwekundu
  rationale: Hueleza sura au rangi yenye wekundu; tafsiri hii ni ya kawaida na pia haifuti uhusiano wa baadaye wa kimatamshi na Edomu.
- source_word: כֻּלּוֹ
  choice: mwili wake wote
  rationale: Huweka wazi kwamba maelezo yanahusu mwili wake mzima, badala ya kuacha kiwakilishi kisicho wazi katika Kiswahili.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: kama joho lenye manyoya
  rationale: Huhifadhi tashbihi ya Kiebrania inayolinganishwa na joho au vazi la manyoya, bila kuibadili kuwa maelezo tambarare kwamba tu alifunikwa na nywele.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: wakamwita
  rationale: Ni namna ya asili ya Kiswahili ya kuwasilisha fomula ya Kiebrania ya kumpa mtu jina.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina la mtu limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
