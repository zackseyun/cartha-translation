base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: sw
  text: Baadaye ndugu yake akatoka, huku mkono wake ukishika kisigino cha Esau; kwa hiyo akaitwa Yakobo.[a] Isaka alikuwa na umri wa miaka sitini walipozaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Yakobo linasikika kama neno la Kiebrania linalohusiana na “kisigino,” na baadaye linahusishwa pia na wazo la kuchukua nafasi ya mwingine; jambo hilo linalingana na mkono wake kushika kisigino cha Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Baadaye
  rationale: Huonyesha mfuatano wa matukio baada ya kuzaliwa kwa Esau, kwa Kiswahili cha kawaida na fasaha.
- source_word: יָצָא אָחִיו
  choice: ndugu yake akatoka
  rationale: Huhifadhi picha halisi ya kutoka tumboni bila kuongeza neno 'pacha,' ambalo halipo katika kirai hiki.
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: huku mkono wake ukiushika
  rationale: Muundo wa 'huku ... uki-' unaonyesha tendo linaloendelea wakati wa kutoka kwake na unasomeka kwa kawaida katika Kiswahili.
- source_word: בַּעֲקֵב עֵשָׂו
  choice: kisigino cha Esau
  rationale: Hutoa maana ya moja kwa moja ya עָקֵב na uhusiano wake na Esau.
- source_word: וַיִּקְרָא שְׁמוֹ יַעֲקֹב
  choice: kwa hiyo akaitwa Yakobo
  rationale: Muundo wa kutendwa ni wa asili katika Kiswahili na hauamui wazi nani aliyempa jina; 'kwa hiyo' huonyesha uhusiano wa kisimulizi na kushikwa kwa kisigino.
- source_word: בֶּן שִׁשִּׁים שָׁנָה
  choice: alikuwa na umri wa miaka sitini
  rationale: Hii ndiyo namna ya kawaida ya kueleza umri katika Kiswahili.
- source_word: בְּלֶדֶת אֹתָם
  choice: walipozaliwa
  rationale: Huonyesha wakati wa kuzaliwa kwa wote wawili bila kuongeza mhusika wa tendo ambaye hajatajwa wazi katika Kiebrania.
