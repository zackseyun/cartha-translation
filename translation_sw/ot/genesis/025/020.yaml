base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: sw
  text: Isaka alikuwa na umri wa miaka arobaini alipomwoa Rebeka[a], binti ya Bethueli Mwaramu kutoka Padan-Aramu, dada ya Labani Mwaramu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “alipomchukua Rebeka … kuwa mke wake.”
    reason: lexical_alternative
  - marker: b
    text: “Mwaramu” ni sahihi zaidi kuliko tafsiri ya zamani ya kimapokeo, “Msiria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: Isaka alikuwa na umri wa miaka arobaini
  rationale: Nahau ya Kiebrania ya kutaja umri imetafsiriwa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: alipomwoa
  rationale: Katika muktadha wa ndoa, לקח pamoja na לְאִשָּׁה humaanisha kumchukua mwanamke kuwa mke; ‘alimwoa’ ni Kiswahili cha asili, huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
- source_word: רִבְקָה
  choice: Rebeka
  rationale: Umbo hili la jina linatumika na kutambulika sana katika Biblia za Kiswahili.
- source_word: בַּת בְּתוּאֵל
  choice: binti ya Bethueli
  rationale: Huhifadhi taarifa rasmi ya ukoo kwa lugha ya kawaida ya Kiswahili.
- source_word: הָאֲרַמִּי
  choice: Mwaramu
  rationale: Huwakilisha kwa usahihi jina la kabila אֲרַמִּי kuliko neno la kimapokeo ‘Msiria’.
- source_word: מִפַּדַּן אֲרָם
  choice: kutoka Padan-Aramu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa, kwa kuwa ni jina maalumu.
- source_word: אֲחוֹת לָבָן
  choice: dada ya Labani
  rationale: Huhifadhi taarifa ya undugu iliyo katika maandishi ya Kiebrania.
