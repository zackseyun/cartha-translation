lexical_decisions:
- source_word: חֲדַד
  choice: Hadadi
  rationale: Jina la mtu katika orodha ya wana wa Ishmaeli; umbo la Kiswahili linafuata kwa karibu konsonanti za Kiebrania huku likiwa rahisi kutamkwa.
- source_word: תֵימָא
  choice: Tema
  rationale: Jina la mtu au kabila linalohusishwa pia na mahali; limetoholewa moja kwa moja bila kuongeza sauti isiyodaiwa na Kiebrania.
- source_word: יְטוּר
  choice: Yeturi
  rationale: Jina limetoholewa kutoka Kiebrania kwa kuhifadhi sauti ya yod ya mwanzo na kuweka umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: נָפִישׁ
  choice: Nafishi
  rationale: Jina limetoholewa kwa kuwakilisha פ hapa kwa sauti ya f na ש kwa sh, katika umbo linalotamkika kwa Kiswahili.
- source_word: קֵדְמָה
  choice: Kedema
  rationale: Jina limetoholewa kwa kutumia k ya kawaida ya Kiswahili na kuhifadhi mpangilio mkuu wa sauti za Kiebrania.
- source_word: וְ / וָ
  choice: na
  rationale: Kiunganishi cha Kiebrania kinaunganisha majina katika orodha; Kiswahili cha kawaida hutumia koma na “na” kabla ya jina la mwisho.
