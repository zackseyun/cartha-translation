  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: sw
  text: Na wana wa Midiani walikuwa Efa, Eferi, Hanoki[a], Abida na Eldaa. Hawa wote walikuwa wana wa Ketura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Hanok; katika mapokeo jina hili pia huandikwa Henoko.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Wana wa Midiani
  rationale: Nomino ya uhusiano בְּנֵי ni ya kiume na katika muktadha huu wa nasaba inamaanisha “wana,” si neno la jumla “watoto.” Kiunganishi וּ־ hakihitaji kutafsiriwa kwa “na” mwanzoni mwa sentensi katika Kiswahili cha kawaida.
- source_word: עֵיפָה
  choice: Efa
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likifuata matamshi ya Kiebrania.
- source_word: וָעֵפֶר
  choice: Eferi
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili; irabu ya mwisho hurahisisha matamshi bila kubadili utambulisho wa jina.
- source_word: וַחֲנֹךְ
  choice: Hanoki
  rationale: Tahajia hii inafuata kwa karibu jina la Kiebrania חֲנֹךְ na kulifanya litamkike kwa kawaida katika Kiswahili; tanbihi inataja umbo la kimapokeo “Henoko.”
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Utohozi wa moja kwa moja na unaotamkika kwa kawaida wa jina la Kiebrania.
- source_word: וְאֶלְדָּעָה
  choice: Eldaa
  rationale: Utohozi huu huhifadhi silabi na irabu ndefu inayoashiriwa na umbo la Kiebrania bila kuongeza konsonanti isiyokuwapo.
- source_word: כָּל אֵלֶּה
  choice: Hawa wote
  rationale: Hili ni fumbo la kawaida la Kiswahili linalohifadhi msisitizo wa ujumla wa orodha.
- source_word: בְּנֵי קְטוּרָה
  choice: walikuwa wana wa Ketura
  rationale: Kurudia “wana wa” huhifadhi mtindo wa nasaba wa Kiebrania na kubainisha uhusiano wao na Ketura.
