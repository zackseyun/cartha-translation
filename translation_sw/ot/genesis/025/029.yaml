lexical_decisions:
- source_word: וַיָּזֶד
  choice: alikuwa akipika
  rationale: Kitenzi זיד hapa kinamaanisha kuandaa chakula kwa kukichemsha. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha tendo lililokuwa likiendelea.
- source_word: נָזִיד
  choice: mchuzi
  rationale: נָזִיד ni chakula kilichopikwa kwa kuchemshwa, yaani mchuzi mzito au kitoweo; “mchuzi” ni neno la kawaida na linafaa katika muktadha huu.
- source_word: וַיָּבֹא
  choice: akaja
  rationale: בוא humaanisha kuja au kuingia. “Akaja” huonyesha kurudi kwake kutoka nje bila kuongeza maelezo yasiyo wazi katika chanzo.
- source_word: מִן הַשָּׂדֶה
  choice: kutoka nyikani
  rationale: שׂדה inaweza kumaanisha shamba, eneo la wazi, au pori. Kwa kuwa Esau alikuwa mwindaji, “nyikani” huwasilisha hapa eneo la wazi la nje kwa Kiswahili cha kawaida.
- source_word: וְהוּא עָיֵף
  choice: akiwa amechoka sana
  rationale: Muundo huu unatoa hali ya Esau alipowasili. עָיֵף huonyesha uchovu mkubwa; “amechoka sana” ni wazi na ya asili.
