  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: Yakobo ndiye mtoaji; Esau ndiye anayekula, kunywa, kuinuka, na kuondoka; na hitimisho linahifadhi kauli kwamba Esau aliidharau haki ya mzaliwa wa kwanza. “Mkate,” “mchuzi wa dengu,” na “haki ya mzaliwa wa kwanza” zinawakilisha vizuri לֶחֶם, נְזִיד עֲדָשִׁים, na הַבְּכֹרָה.'
