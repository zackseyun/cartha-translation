  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: sw
  text: Yakobo akampa Esau mkate na mchuzi wa dengu[a]. Esau akala, akanywa, akainuka, akaenda zake. Hivyo Esau akaidharau haki ya mzaliwa wa kwanza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitoweo cha dengu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akaonyesha dharau kwa haki ya mzaliwa wa kwanza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: akampa
  rationale: Kitenzi cha kawaida cha kutoa kinafaa katika simulizi hili bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: לֶחֶם
  choice: mkate
  rationale: Ingawa neno hili wakati mwingine linaweza kumaanisha chakula kwa ujumla, kutajwa pamoja na mchuzi kunapendelea maana halisi ya mkate.
- source_word: נְזִיד עֲדָשִׁים
  choice: mchuzi wa dengu
  rationale: Kirai hiki kinamaanisha chakula kilichopikwa kwa dengu; 'mchuzi wa dengu' ni usemi wa kawaida na unaoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: akala, akanywa, akainuka, akaenda zake
  rationale: Mfululizo wa vitenzi vyenye kiambishi 'aka-' unahifadhi mwendo wa haraka na mfupi wa simulizi la Kiebrania kwa Kiswahili cha asili.
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Hii ni tafsiri ya moja kwa moja, ya heshima na inayoeleweka ya tendo la kuinuka.
- source_word: וַיֵּלַךְ
  choice: akaenda zake
  rationale: Usemi huu unaonyesha wazi kuondoka kwake na ni wa kawaida katika simulizi la Kiswahili.
- source_word: וַיִּבֶז
  choice: akaidharau
  rationale: Kitenzi hiki huonyesha kutothamini na kuonyesha dharau; 'dharau' huhifadhi nguvu ya hukumu ya simulizi bila ufafanuzi wa ziada.
- source_word: הַבְּכֹרָה
  choice: haki ya mzaliwa wa kwanza
  rationale: Kirai hiki kinaeleza kwa uwazi hadhi na mapendeleo ya kifamilia na kisheria yaliyomhusu mzaliwa wa kwanza.
theological_decisions:
- issue: Msisitizo wa simulizi kuhusu jinsi Esau alivyoithamini hadhi yake ya mzaliwa wa kwanza
  choice: Hivyo Esau akaidharau haki ya mzaliwa wa kwanza
  alternative: Esau akaonyesha dharau kwa haki ya mzaliwa wa kwanza
  rationale: '''Hivyo'' linaonyesha kuwa sentensi ya mwisho ni hitimisho la matendo yaliyotangulia, huku ''akaidharau'' ikihifadhi tathmini ya kimaadili ya maandishi bila kuipanua.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfululizo wa 'aka-' umetumiwa kudumisha kasi ya simulizi; 'akaenda zake' ni wa asili zaidi kuliko tafsiri ngumu ya neno kwa neno.
