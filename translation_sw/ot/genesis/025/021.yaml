base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: sw
  text: Isaka akamwomba Yahwe kwa ajili ya mke wake[a], kwa kuwa mke wake alikuwa tasa. Yahwe akaitikia ombi lake[b], naye Rebeka, mke wake, akapata mimba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa mkabala na mke wake”; maneno ya Kiebrania yanaweza kueleza mahali alipokuwa Isaka au kwamba alimwomba Mungu kuhusu au kwa niaba ya mke wake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia mzizi uleule wa kitenzi kwa tendo la Isaka la kuomba na kwa Yahwe kuitikia ombi lake.
    reason: wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: akamwomba / akakubali maombi yake
  rationale: Mzizi uleule wa Kiebrania umetumiwa katika vishazi vyote viwili. Kiswahili cha kawaida hakiwezi kurudia kitenzi hicho kwa namna ileile bila kuwa kizito; jozi hii inaonyesha kwa ufasaha kwamba Isaka aliomba na Yahwe akaitikia kwa kulikubali ombi lake.
- source_word: לַיהוָה / יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: kwa ajili ya mke wake
  rationale: Ingawa לְנֹכַח kwa msingi inaweza kumaanisha “mbele ya” au “mkabala na,” katika muktadha huu inaeleza kwamba sala ilihusu au ilikuwa kwa niaba ya mke wake.
- source_word: עֲקָרָה
  choice: tasa
  rationale: “Tasa” ni neno la kawaida na mahususi kwa hali ya kutoweza kupata mtoto; halisemi tu kwamba mtu hakuwa na watoto wakati huo.
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Hii ni njia ya asili na wazi katika Kiswahili cha sasa ya kueleza kwamba Rebeka alichukua mimba.
- source_word: רִבְקָה
  choice: Rebeka
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili na linawakilisha רִבְקָה kwa utambuzi rahisi.
theological_decisions:
- issue: Kurudia kwa mzizi עתר na jinsi ya kueleza jibu la Mungu bila kudokeza kwamba sala ilimlazimisha Mungu
  choice: Isaka akamwomba Yahwe ... Yahwe akakubali maombi yake
  alternative: Isaka akamsihi Yahwe ... Yahwe akakubali kusihiwa naye
  rationale: Tafsiri iliyochaguliwa inahifadhi uhusiano kati ya ombi na jibu la Mungu kwa Kiswahili cha kawaida, bila kuonyesha kwamba matokeo yalitokea kwa njia ya lazima au ya kiufundi.
- issue: Jinsi ya kutafsiri יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu יהוה, kwa hiyo “Yahwe” linahifadhi jina hilo badala ya kuliwakilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa masimulizi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Tasa” huhifadhi ufupi wa asili, na “akapata mimba” ni ya sasa na ya asili kuliko usemi mzito wa kitabibu.
