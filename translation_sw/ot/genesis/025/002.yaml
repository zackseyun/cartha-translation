translation:
  language: sw
  text: Naye akamzalia Zimrani, Yokshani, Medani, Midiani, Ishbaki na Shua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Naye akamzalia
  rationale: Kitenzi ילד katika Qal wayyiqtol nafsi ya tatu, umoja wa kike, kinasimulia tendo la zamani. Muundo wa Kiswahili “akamzalia” ni wa asili katika muktadha wa ukoo na unaonyesha kwamba mwanamke ndiye aliyezaa.
- source_word: לוֹ
  choice: -m- katika “akamzalia”
  rationale: Kihusishi ל pamoja na kiambishi cha nafsi humtaja baba wa watoto; katika Kiswahili maana hii inaelezwa kwa kiambishi cha yambwa katika kitenzi “akamzalia”.
- source_word: אֶת
  choice: '[hakijatafsiriwa kando]'
  rationale: Hiki ni kiashiria cha yambwa tendwa kinachotangulia kila jina; hakina neno la pekee la Kiswahili hapa, bali kinawakilishwa na mpangilio wa kawaida wa sentensi.
- source_word: זִמְרָן
  choice: Zimrani
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili na kufuata matumizi yaliyozoeleka ya majina ya Biblia.
- source_word: יָקְשָׁן
  choice: Yokshani
  rationale: Jina limetoholewa kutoka Kiebrania, huku yod ya mwanzo ikiwakilishwa kwa “Y” na vokali zikiongezwa kwa matamshi ya asili ya Kiswahili.
- source_word: מְדָן
  choice: Medani
  rationale: Jina la mtu limetoholewa kwa karibu na umbo la Kiebrania na kwa matamshi yanayofaa Kiswahili.
- source_word: מִדְיָן
  choice: Midiani
  rationale: Umbo hili linadumisha tofauti ya Kiebrania kati ya Medani na Midiani na linaendana na jina linalojulikana katika Kiswahili cha Biblia.
- source_word: יִשְׁבָּק
  choice: Ishbaki
  rationale: Jina limetoholewa kwa karibu na sauti za Kiebrania; “I” ya mwanzo inatoa matamshi ya kawaida na rahisi katika Kiswahili.
- source_word: שׁוּחַ
  choice: Shua
  rationale: Jina limetoholewa kwa umbo rahisi la Kiswahili; konsonanti ya mwisho ya Kiebrania haitolewi kama sauti tofauti katika matumizi haya.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya ukoo. Kiunganishi “Naye” kinaendeleza simulizi kutoka mstari uliotangulia, na majina yametoholewa kwa matamshi yanayoeleweka kwa wasomaji wa kawaida.
