base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: sw
  text: Abrahamu akakata roho, akafa katika uzee mwema, mzee na mwenye kutosheka[a]; akakusanywa kwa watu wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye kuridhika.” Kiebrania kinasema “mzee na mwenye kutosheka”; tafsiri nyingine huongeza “siku” ili kueleza nahau hiyo kuwa maisha yaliyofikia utimilifu.
    reason: lexical_alternative
  - marker: b
    text: “Akakusanywa kwa watu wake” ni nahau ya jadi ya Kiebrania kuhusu kifo. Inaweza kudokeza kuungana na jamaa waliokufa, lakini maneno yenyewe hayaelezi jambo hilo lilitokea kwa namna gani hasa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: akakata roho
  rationale: Katika taarifa za kifo, kitenzi גוע huonyesha mtu kufikia mwisho wa uhai. Nahau hii ya Kiswahili ni ya kawaida na inakitofautisha na וַיָּמָת kinachofuata.
- source_word: וַיָּמָת
  choice: akafa
  rationale: מות ni kitenzi cha kawaida cha kufa; tafsiri ya moja kwa moja inadumisha uwazi wa Kiebrania bila kutumia lugha ya kuficha kifo.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: akiwa katika uzee mwema
  rationale: 'Maneno haya yanaeleza hali ambayo Abrahamu alikuwa nayo alipokufa: uzee uliokuwa mwema au wenye ukamilifu. Muundo huu unahifadhi wazo la uzee na sifa yake chanya.'
- source_word: זָקֵן
  choice: akiwa mzee
  rationale: Tafsiri hii ya moja kwa moja inadumisha namna Kiebrania kinavyoongeza maelezo ya uzee badala ya kuyafupisha yote kuwa kirai kimoja.
- source_word: וְשָׂבֵעַ
  choice: na aliyeshiba
  rationale: שָׂבֵעַ humaanisha aliyeshiba au aliyeridhika. ‘Aliyeshiba’ inadumisha sitiari na kutotaja kitu ambacho Kiebrania hakijataja, huku tanbihi ikifafanua matumizi yake katika muktadha wa maisha yaliyofikia utimilifu.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: akakusanywa kwa watu wake
  rationale: Hii inadumisha nahau ya jadi ya Kiebrania kuhusu kifo pamoja na hali yake ya kutokuwa na maana moja tu, badala ya kuifasiri waziwazi kuwa maziko au maisha baada ya kifo.
- source_word: עַמָּיו
  choice: watu wake
  rationale: עם pamoja na kiambishi cha umilikaji ni ‘watu wake.’ Chaguo hili halibani maana iwe mababu pekee, jamaa pekee, au kundi la kikabila.
theological_decisions:
- issue: Maana ya ‘akakusanywa kwa watu wake’
  choice: Kudumisha nahau ya kifo bila kubainisha hasa inavyotokea
  alternative: Kuitafsiri kuwa alizikwa katika kaburi la ukoo, au aliungana na jamaa zake waliokufa katika maisha baada ya kifo
  rationale: Nahau ya Kiebrania inaweza kudokeza kuungana na jamaa katika kifo, lakini mstari wenyewe hauelezi kama inahusu maziko, kuungana na mababu, au hali ya ufahamu baada ya kifo. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Akakata roho’ ni nahau ya asili ya Kiswahili; ‘aliy­eshiba’ inadumisha sitiari fupi ya Kiebrania, na tanbihi huzuia maana yake isieleweke vibaya. Muundo wa marudio ‘akiwa… akiwa…’ unaakisi mkusanyiko wa maelezo katika chanzo bila kuwa mzito kupita kiasi.
