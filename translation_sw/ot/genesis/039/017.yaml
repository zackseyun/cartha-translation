  yaml_path: translation/ot/genesis/039/017.yaml
  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: sw
  text: Kisha akazungumza naye kwa maneno kama haya, akisema, “Yule mtumwa Mwebrania uliyemleta kwetu alinijia kunidhihaki[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kunifanyia mchezo”; katika muktadha huu huenda maneno hayo yana dokezo la kumdhalilisha au kumnyanyasa kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: Kisha akazungumza na mumewe
  rationale: Wayyiqtol inaendeleza simulizi. Kisarufi אֵלָיו ni ‘naye/kwake’; ‘mumewe’ huweka rejea ya kiwakilishi wazi kwa Kiswahili bila kutumia jina la Potifa.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: kwa maneno kama haya
  rationale: Huhifadhi maana linganishi ya כ na kutambulisha yaliyomo katika taarifa yake kwa Kiswahili cha kawaida.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni namna ya kawaida ya kutafsiri kiambishi cha kunukuu kinachoanzisha maneno ya moja kwa moja.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: yule mtumwa Mwebrania
  rationale: ‘Mtumwa’ huonyesha hadhi ya utumwa wa nyumbani kwa usahihi kuliko ‘mtumishi’; ‘Mwebrania’ ni jina la mtu wa kabila hilo na linasikika kiasili baada ya nomino.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: uliyemleta kwetu
  rationale: Huhifadhi lawama inayomwelekea mumewe pamoja na wingi wa nafsi ya kwanza ‘kwetu’.
- source_word: בָּא אֵלַי
  choice: alinijia
  rationale: Huonyesha mwendo kuelekea kwake bila kuingiza moja kwa moja maana ya tendo la ngono ambayo kitenzi hiki pekee hailazimishi.
- source_word: לְצַחֶק בִּי
  choice: ili anifanyie mzaha
  rationale: צחק pamoja na ב inaweza kumaanisha kumfanyia mtu mchezo, kumdhihaki, au kumtendea kwa namna yenye dokezo la kingono. ‘Anifanyie mzaha’ huhifadhi upana huo kwa kadiri inayowezekana, huku tanbihi ikieleza dokezo la muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mtumwa’ limetumiwa badala ya ‘mtumishi’ ili kuonyesha hali yake ya kijamii. Alama ya tanbihi [a] imewekwa mara baada ya kirai husika.
