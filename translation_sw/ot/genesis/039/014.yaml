  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: sw
  text: Ndipo akawaita wanaume wa nyumba yake, akawaambia, “Tazameni, ametuletea[b] mwanamume Mwebrania ili atuchezee[a]. Alikuja kwangu ili alale nami, nami nikapiga kelele kwa sauti kubwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili atudhihaki” au “ili atufanyie mchezo.” Kitenzi cha Kiebrania kinaweza kumaanisha kumdhihaki mtu au kumfanyia mchezo wa kumfedhehesha; katika shtaka la mke wa Potifa, kinaweza pia kuwa na dokezo la udhalilishaji wa kingono.
    reason: lexical_alternative
  - marker: b
    text: Au “ametuingizia mwanamume Mwebrania.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: Ndipo akawaita wanaume wa nyumba yake
  rationale: “Ndipo” huendeleza mfuatano wa simulizi, na “wanaume wa nyumba yake” huhifadhi jinsia ya אַנְשֵׁי pamoja na maana ya watu wa nyumbani.
- source_word: רְאוּ
  choice: Tazameni
  rationale: Ni amri ya kuvuta usikivu, kwa Kiswahili cha sasa na chenye hadhi.
- source_word: הֵבִיא לָנוּ
  choice: ametuletea
  rationale: Huhifadhi hali ya kusababisha ya kitenzi בוא na kiwakilishi cha ‘sisi,’ huku ikisomeka kwa ufasaha katika hotuba ya moja kwa moja.
- source_word: אִישׁ עִבְרִי
  choice: mwanamume Mwebrania
  rationale: Huhifadhi wazi utambulisho wa Yosefu kuwa mwanamume na kuwa Mwebrania, pamoja na sauti ya shtaka.
- source_word: לְצַחֶק בָּנוּ
  choice: ili atuchezee
  rationale: '“Atuchezee” huhifadhi upana wa צחק: kufanya mchezo na mtu, kumdhihaki, au kumfedhehesha; muktadha pia unaruhusu dokezo la unyanyasaji wa kingono bila kulifanya kuwa maana pekee.'
- source_word: בָּא אֵלַי לִשְׁכַּב עִמִּי
  choice: Alikuja kwangu ili alale nami
  rationale: Hufuata kwa karibu nahau ya Kiebrania ya kujamiiana bila kutumia lugha ya mtaani.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: nami nikapiga kelele kwa sauti kubwa
  rationale: “Kupiga kelele” inafaa hali ya dharura, na “kwa sauti kubwa” huakisi usemi wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Atuchezee” limechaguliwa ili kudumisha utata halisi wa kitenzi צחק badala ya kulifanya shtaka liwe na maana moja tu. Viashiria vya tanbihi vimewekwa karibu na maneno vinayoyafafanua.
