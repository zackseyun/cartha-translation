  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: sw
  text: Basi Potifa akaacha kila kitu alichokuwa nacho mikononi mwa Yosefu, wala hakujishughulisha na chochote isipokuwa chakula alichokula.[a] Yosefu alikuwa na umbo zuri na sura nzuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkate aliokula”; hapa “mkate” yaelekea humaanisha chakula kwa ujumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: akaacha
  rationale: Kitenzi עזב kimsingi humaanisha ‘kuacha’; katika muktadha huu kinaonyesha kwamba Potifa alimwachia Yosefu mali na shughuli zake bila kulazimisha maana ya ‘kukabidhi’ ndani ya matini.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: kila kitu alichokuwa nacho
  rationale: Ni usemi mpana na wa kawaida unaojumuisha mali na mambo yote ya Potifa.
- source_word: בְּיַד יוֹסֵף
  choice: mikononi mwa Yosefu
  rationale: Nahau hii ya Kiswahili huhifadhi taswira ya Kiebrania ya ‘mkono’ ikimaanisha usimamizi au mamlaka.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: wala hakujishughulisha na chochote kilichokuwa chini ya uangalizi wake
  rationale: Kiebrania halisi ni kigumu kutafsiri neno kwa neno. Katika muktadha, Potifa hakufuatilia mambo ambayo Yosefu alisimamia; tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi na maneno ya asili.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Hutambulisha jambo pekee lililoondolewa katika kauli iliyotangulia.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: chakula alichokula
  rationale: Ingawa לֶחֶם kwa kawaida ni ‘mkate’, hapa yaelekea inasimama kwa chakula kwa ujumla; tanbihi inaonyesha maana halisi ya neno.
- source_word: יְפֵה תֹאַר
  choice: umbo zuri
  rationale: Hurejelea mpangilio au umbile la mwili na hivyo kutofautishwa na sura inayoonekana.
- source_word: וִיפֵה מַרְאֶה
  choice: sura nzuri
  rationale: Hurejelea mwonekano unaovutia na huhifadhi urari wa semi mbili za Kiebrania.
