    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: Ikawa aliposikia
  rationale: Muundo huu unahifadhi mtiririko wa kisimulizi wa וַיְהִי huku כְשָׁמְעוֹ ikitafsiriwa kwa kishazi cha wakati cha Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha maudhui ya kile alichosikia, kwa hiyo “kwamba” inafaa kisarufi na kimuktadha.
- source_word: הֲרִימֹתִי קוֹלִי
  choice: nimepaza sauti yangu
  rationale: “Kupaza sauti” ni nahau ya kawaida ya Kiswahili inayolingana na maana halisi ya kuinua sauti; wakati timilifu unaonyesha tendo lililotangulia kusikia kwake.
- source_word: וָאֶקְרָא
  choice: na kupiga kelele
  rationale: Katika muktadha huu קרא inaonyesha kilio kikubwa cha kuomba msaada au kutoa tahadhari. “Kupiga kelele” ni ya kawaida bila kubainisha maneno ambayo hakuyasema.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: aliacha vazi lake
  rationale: “Vazi” linahifadhi umoja wa בגד na linafaa kwa mtindo wa simulizi wenye hadhi.
- source_word: אֶצְלִי
  choice: kando yangu
  rationale: Huwasilisha ukaribu wa kimahali unaoweza kumaanishwa na אֶצְלִי, huku tanbihi ikihifadhi uwezekano wa “kwangu.”
- source_word: וַיָּנָס
  choice: akakimbia
  rationale: Katika Kiswahili cha kawaida, “akakimbia” huonyesha kuondoka kwa haraka kwa sababu ya hofu au kutoroka.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: na kwenda nje
  rationale: Huwasilisha wazi mwelekeo wa kutoka nje uliomo katika הַחוּצָה na pia huhifadhi kitenzi cha pili tofauti na kukimbia.
