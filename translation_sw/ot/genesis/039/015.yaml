  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: sw
  text: Ikawa, aliposikia kwamba nilipaza sauti yangu na kupiga kelele[a], aliacha vazi lake kando yangu[b], akakimbia, akatoka nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilipaza sauti yangu na kuita.”
    reason: lexical_alternative
  - marker: b
