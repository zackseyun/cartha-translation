  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: sw
  text: Lakini Yahwe alikuwa pamoja na Yosefu, akamwonyesha fadhili za kudumu[a], na akamjalia kibali machoni pa mkuu wa gereza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo mwaminifu.” Neno la Kiebrania חֶסֶד pia linaweza kumaanisha wema wenye uaminifu au fadhili.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili, badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: וַיְהִי ... אֶת
  choice: alikuwa pamoja na
  rationale: Muundo huu unaeleza uwepo na ushirika; “alikuwa pamoja na” ni wa kawaida na hudumisha kauli inayojirudia katika simulizi la Yosefu.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: akamwonyesha fadhili za kudumu
  rationale: Katika nahau hii, נָטָה pamoja na חֶסֶד humaanisha kumwonyesha mtu wema wa uaminifu. Kauli hii ni ya asili kwa Kiswahili na haidai wazi kwamba agano limetajwa katika mstari huu.
- source_word: חִנּוֹ
  choice: akamjalia kibali
  rationale: חֵן hapa ni kukubaliwa au kupendelewa na mtu mwenye mamlaka; “kibali” linafaa katika mazingira ya usimamizi wa gereza.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Nahau ya Kiebrania imehifadhiwa kwa usemi wa Kiswahili unaoeleweka na unaomaanisha “mbele ya” au “kwa maoni ya.”
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: mkuu wa gereza
  rationale: Hili linadumisha wazo la afisa mkuu aliyesimamia gereza bila kulazimisha cheo mahususi zaidi ya Kiebrania.
- source_word: וַ
  choice: Lakini
  rationale: Ingawa kiunganishi kinaendeleza simulizi, hapa pia kinaonyesha tofauti kati ya kufungwa kwa Yosefu na uwepo wa Yahwe pamoja naye.
theological_decisions:
- issue: Maana ya חָסֶד kuhusu wema wa Mungu kwa Yosefu
  choice: fadhili za kudumu
  alternative: upendo mwaminifu; wema; uaminifu wa agano
  rationale: חָסֶד hubeba wazo la wema wenye uaminifu na uthabiti. “Fadhili za kudumu” huhifadhi uzito huo bila kusema moja kwa moja kwamba agano rasmi ndilo linalorejelewa, jambo ambalo mstari huu haulitaji wazi.
- issue: Uwasilishaji wa יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kutumia jina “Yahwe” huhifadhi jina binafsi katika matini ya Kiebrania; tahajia imezoeshwa kwa mfumo wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo “akamwonyesha … na akamjalia” unaendeleza mtiririko wa simulizi, huku “mkuu wa gereza” ukibaki karibu na muundo wa Kiebrania.
