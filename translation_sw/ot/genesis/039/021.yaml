  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipashio vya Kiebrania: uwepo wa Yahwe pamoja na Yosefu, tendo la kumwonyesha חֶסֶד, na kumpa kibali mbele ya afisa mkuu wa gereza. “Fadhili za kudumu” ni tafsiri salama ya חֶסֶד katika muktadha huu na haiongezi dai la agano ambalo halijaelezwa wazi katika mstari.'
