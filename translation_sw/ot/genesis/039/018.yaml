  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: sw
  text: Ikawa, nilipoinua sauti yangu na kupiga kelele, aliacha vazi lake[a] kando yangu, akakimbilia nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguo yake.” Neno la Kiebrania בֶּגֶד ni neno la jumla kwa vazi au nguo, wala halibainishi aina hususa ya nguo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: Ikawa nilipoinua
  rationale: Muundo huu unaanzisha kishazi cha wakati. ‘Ikawa nilipoinua’ huhifadhi mtiririko wa simulizi na maana ya kuinua sauti bila kuwa tafsiri ngumu isiyo ya kawaida.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: Hii ndiyo maana ya kawaida ya קוֹל katika muktadha huu na huunda usemi wa asili wa Kiswahili ‘kuinua sauti.’
- source_word: וָאֶקְרָא
  choice: na kupiga kelele
  rationale: קרא inaweza kumaanisha kuita au kulia kwa sauti; hapa mazingira ya taharuki yanafaa ‘kupiga kelele,’ bila kubainisha maneno yaliyosemwa.
- source_word: וַיַּעֲזֹב
  choice: aliacha
  rationale: עזב hapa inaeleza kuacha kitu mahali, hivyo ‘aliacha’ ni ya kawaida na sahihi.
- source_word: בִּגְדוֹ
  choice: vazi lake
  rationale: בֶּגֶד ni neno la jumla la nguo au vazi na halitambui aina maalumu ya nguo.
- source_word: אֶצְלִי
  choice: kando yangu
  rationale: אצל huonyesha ukaribu wa mahali. ‘Kando yangu’ huhifadhi maana hiyo bila kulazimisha wazo la umiliki.
- source_word: וַיָּנָס הַחוּצָה
  choice: akakimbilia nje
  rationale: נוס huonyesha kukimbia kwa haraka ili kuondoka, na הַחוּצָה inaelekeza mwendo kwenda nje; ‘akakimbilia nje’ ni ya asili na huhifadhi pande zote mbili.
