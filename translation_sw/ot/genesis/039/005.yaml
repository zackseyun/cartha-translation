base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: sw
  text: Tangu alipomweka kuwa msimamizi wa nyumba yake na wa vyote alivyokuwa navyo[a], Yahwe aliibariki nyumba ya yule Mmisri kwa sababu ya Yosefu. Baraka ya Yahwe ilikuwa juu ya vyote alivyokuwa navyo[b], nyumbani na shambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangu wakati huo, alipomkabidhi asimamie nyumba yake na vyote alivyokuwa navyo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya kila kitu alichokuwa nacho, nyumbani na shambani.”
    reason: previous_rendering
lexical_decisions:
- source_word: מֵאָז
  choice: Tangu wakati
  rationale: Huonyesha mwanzo wa kipindi ambacho hali inayofuata iliendelea; usemi huu unaunganika kwa kawaida na kishazi kinachofuata.
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: alipomweka kuwa msimamizi wa nyumba yake na wa mali yake yote
  rationale: Kitenzi katika Hiphil kinaonyesha kukabidhi usimamizi. Kiswahili hiki kinaweka wazi mamlaka ya Yosefu bila kudai kuwa alimiliki mali hiyo.
- source_word: וַיְבָרֶךְ
  choice: aliibariki
  rationale: Huhifadhi maana ya moja kwa moja ya ברך; mafanikio ni matokeo ya baraka, si mbadala wa neno lenyewe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu lililoandikwa katika matini ya Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: בֵּית הַמִּצְרִי
  choice: nyumba ya yule Mmisri
  rationale: Hurejelea nyumba au kaya ya Potifa; kiashiria 'yule' kinafanya rejeo hili kuwa la kawaida na wazi katika Kiswahili.
- source_word: בִּגְלַל יוֹסֵף
  choice: kwa sababu ya Yosefu
  rationale: בגלל huonyesha sababu; tafsiri hii ni wazi na ya moja kwa moja.
- source_word: בִּרְכַּת יְהוָה בְּכָל אֲשֶׁר יֶשׁ־לוֹ
  choice: Baraka ya Yahwe ilikuwa juu ya mali yake yote
  rationale: Huhifadhi wazo la baraka inayokalia au kuifikia mali yote ya Mmisri.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: nyumbani na shambani
  rationale: Huhifadhi taswira halisi na merizimu inayojumuisha shughuli za nyumbani na za mashambani.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu moja kwa moja. 'Yahwe' hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo au kutumia umbo la jadi lenye historia tofauti ya matamshi.
- issue: Asili ya mafanikio ya nyumba ya Mmisri
  choice: Yahwe aliibariki kwa sababu ya Yosefu
  alternative: Yahwe aliifanikisha nyumba hiyo
  rationale: Tafsiri inahifadhi lugha ya baraka na uhusiano wa kisababishi uliopo katika matini, bila kueleza zaidi namna au msingi wa kitheolojia wa baraka hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. 'Msimamizi' ni neno linaloeleweka kwa kawaida na linaonyesha jukumu rasmi. 'Nyumbani na shambani' huhifadhi muundo wa Kiebrania kwa mtiririko wa asili wa Kiswahili.
