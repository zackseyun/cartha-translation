base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: sw
  text: bwana wake akaona kwamba Yahweh alikuwa pamoja naye, na kwamba Yahweh alifanya kila jambo alilofanya lifanikiwe mikononi mwake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupitia mkono wake” au “chini ya usimamizi wake”; Kiebrania kihalisi, “mkononi mwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi ראה katika usimulizi kina maana ya moja kwa moja ya ‘kuona’; hapa pia kinadokeza kutambua kutokana na matokeo, bila kuhitaji kulifafanua zaidi.
- source_word: אֲדֹנָיו
  choice: Bwana wake
  rationale: Kinamtaja Potifa kama mwenye mamlaka juu ya Yosefu katika mazingira ya utumwa wa nyumbani. ‘Bwana wake’ ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: אִתּוֹ
  choice: alikuwa pamoja naye
  rationale: Kirai hiki kinaeleza uwepo wa Mungu pamoja na Yosefu na kinahifadhi rejeleo la kiwakilishi la Kiebrania.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: kila jambo alilofanya
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya jumla ya ‘yote aliyokuwa akifanya’ katika muktadha wa usimulizi.
- source_word: מַצְלִיחַ
  choice: alifanikisha
  rationale: 'Hifili ya צלח ni ya kisababishi: Yahweh ndiye aliyesababisha shughuli za Yosefu zifanikiwe.'
- source_word: בְּיָדוֹ
  choice: mikononi mwake
  rationale: Huhifadhi taswira ya Kiebrania ya kitu kuwa ‘mkononi’ mwa Yosefu, huku tanbihi ikionyesha uwezekano wa maana ya njia, uwakala, au usimamizi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha kuufafanua msemo בְּיָדוֹ
  choice: mikononi mwake katika matini kuu
  alternative: kupitia mkono wake au chini ya usimamizi wake
  rationale: Msemo unaweza kuonyesha njia, uwakala, au eneo la wajibu. Kuhifadhi taswira ya mkono pamoja na tanbihi huepuka kuamua kimya kimya maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha urahisi wa usimulizi wa Kiebrania; taswira ya ‘mkono’ imehifadhiwa, ingawa umbo la wingi ‘mikononi’ linasikika kwa kawaida zaidi katika Kiswahili.
