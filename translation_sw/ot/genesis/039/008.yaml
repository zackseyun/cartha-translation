translation:
  language: sw
  text: Lakini Yosefu akakataa, akamwambia mke wa bwana wake, “Tazama, bwana wangu hajishughulishi na chochote kilicho nyumbani[a], naye kila kitu alicho nacho amekiweka mikononi mwangu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania halisi: “hajui pamoja nami kilicho nyumbani.” Huu ni usemi wa kiidiomu unaoweza kumaanisha kwamba bwana wake alimwachia Yosefu usimamizi wa mambo ya nyumba wala hakujishughulisha nayo.'
    reason: lexical_alternative
  - marker: b
    text: 'Au, “amenikabidhi kila kitu alicho nacho.” Kiebrania halisi: “ameweka mkononi mwangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Lakini Yosefu akakataa
  rationale: Kitenzi humaanisha kukataa; ‘Lakini’ kinaonyesha utofauti na ombi la mwanamke katika mstari uliotangulia. Jina ‘Yosefu’ linawekwa wazi kwa sababu Kiswahili huhitaji kiima cha asili katika mwanzo huu wa nukuu.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: akamwambia mke wa bwana wake
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa kijamii kati ya Yosefu, bwana wake, na mke wa bwana huyo.
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili huvuta usikivu kwa jambo linalofuata; ‘Tazama’ ni la heshima na linaeleweka katika usimulizi wa kibiblia.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: kwa kuwa mimi nipo hapa, bwana wangu hajishughulishi na mambo ya nyumba
  rationale: Kiebrania halisi ni ‘hajui pamoja nami kilicho nyumbani.’ Tafsiri hii huwasilisha maana ya kwamba uwepo na usimamizi wa Yosefu humfanya bwana wake asiwe na haja ya kushughulikia mambo ya nyumba, huku tanbihi ikihifadhi umbo halisi na uwezekano wa uhusiano wa maneno.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: kila kitu alicho nacho
  rationale: Huwasilisha kwa kawaida jumla ya mali na mambo yote ya bwana wake.
- source_word: נָתַן בְּיָדִי
  choice: ameweka ... mikononi mwangu
  rationale: Inahifadhi sitiari ya Kiebrania ya kuweka katika mkono, ambayo katika Kiswahili pia inaweza kueleweka kuwa kukabidhi chini ya mamlaka au uangalizi wa mtu.
