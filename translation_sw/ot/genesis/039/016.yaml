lexical_decisions:
- source_word: וַתַּנַּח
  choice: akaiweka
  rationale: Kitenzi hiki kina maana ya kuacha au kuweka kitu mahali; hapa “akaiweka” ni ya kawaida na inaonyesha kuwa aliihifadhi nguo hiyo kwa kusudi.
- source_word: בִּגְדוֹ
  choice: nguo yake
  rationale: בֶּגֶד humaanisha nguo au vazi; “nguo yake” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֶצְלָהּ
  choice: karibu naye
  rationale: Kirai hiki humaanisha kuwa kitu kilikuwa kando yake au mikononi mwake; “karibu naye” huhifadhi maana bila kudokeza mahali maalumu pasipotajwa.
- source_word: אֲדֹנָיו
  choice: bwana wa Yosefu
  rationale: Kiwakilishi cha Kiebrania kinamrejelea Yosefu. Kutaja “Yosefu” huondoa utata wa Kiswahili kuhusu ni bwana wa nani bila kubadili rejeleo.
- source_word: אֶל־בֵּיתוֹ
  choice: nyumbani
  rationale: Kwa muktadha wa kurudi katika nyumba yake, “nyumbani” ni usemi wa asili wa Kiswahili unaowasilisha maana ya kuingia au kufika nyumbani.
