  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: sw
  text: Ikawa siku moja[a], aliingia nyumbani kufanya kazi yake, na hapakuwa na yeyote miongoni mwa wanaume wa nyumba hiyo humo ndani ya nyumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “kama siku hii” au “katika siku hii.” Usemi wa Kiebrania ni wa kiidioma; huenda unamaanisha siku fulani au tukio kama hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi fomula ya masimulizi inayoanzisha tukio linalofuata, kwa mtindo mfupi na wenye hadhi unaoeleweka katika Kiswahili.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: siku moja kama hiyo
  rationale: Usemi huu wa Kiebrania unaelekea kutaja tukio fulani la aina hiyo, si kusisitiza tarehe maalumu. Tafsiri hii inadumisha muundo wa chanzo huku tanbihi ikieleza maana yake ya kiidioma.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: aliingia nyumbani
  rationale: Kitenzi בוא pamoja na kiambishi cha mwelekeo kinaonyesha kwenda ndani ya nyumba. 'Aliingia nyumbani' ni ya kawaida na wazi katika Kiswahili.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: kufanya kazi yake
  rationale: מְלָאכָה humaanisha kazi, jukumu, au shughuli. 'Kazi yake' ni pana na ya kawaida, hivyo haiingizi maana finyu isiyothibitishwa na muktadha.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: wala hapakuwa na yeyote miongoni mwa wanaume wa nyumba hiyo
  rationale: Muundo hasi unaonyesha kutokuwapo kwa mtu, na אֲנָשִׁים hapa ni 'wanaume'; tafsiri inahifadhi rejeo hilo la kijinsia badala ya kulipanua kuwa watu wote wa nyumbani.
- source_word: שָׁם בַּבָּיִת
  choice: humo nyumbani
  rationale: '''Humo'' huwakilisha שָׁם na kurudia mahali pa ndani ya nyumba kwa Kiswahili cha kawaida bila kuondoa msisitizo wa mahali.'
