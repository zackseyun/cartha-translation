  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: sw
  text: Ikawa bwana wake aliposikia maneno ambayo mke wake alimwambia, akisema, “Mtumwa wako[a] amenitendea mambo kama haya[b],” hasira yake ikawaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi wako.” Neno la Kiebrania עֶבֶד linaweza kumaanisha mtumwa au mtumishi; hapa “mtumwa” linafaa kwa sababu ya hadhi ya Yosefu katika nyumba hii.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mujibu wa maneno haya.” Kirai cha Kiebrania kinaweza kumaanisha “mambo kama haya” au kuelekeza kwenye mashtaka yaliyosimuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kiunganishi cha simulizi kinachoendeleza tukio linalofuata kwa lugha ya kawaida ya Biblia ya Kiswahili.
- source_word: כִשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo wa wakati unaonyesha kwamba hasira iliwaka baada ya kusikia maneno hayo; ‘aliposikia’ ni wa asili na sahihi.
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika muktadha huu neno linamtaja Potifa akiwa mwenye mamlaka na mmiliki wa Yosefu; ‘bwana wake’ huhifadhi uhusiano huo bila kumaanisha Bwana Mungu.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: maneno ambayo mke wake alimwambia
  rationale: Huhifadhi nomino ‘maneno’ na maana ya kumweleza mumewe, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni utangulizi wa kawaida wa maneno yaliyonukuliwa.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: mambo kama haya
  rationale: Huwasilisha maana ya kulinganisha au kuelekeza kwenye aina ya matendo yaliyodaiwa, bila kulazimisha tafsiri moja ya kirai hicho.
- source_word: עָשָׂה לִי
  choice: amenitendea
  rationale: Kitenzi hiki ni Kiswahili cha asili kwa ‘amenifanyia/amenitendea’ na hakiongezi waziwazi wazo la ‘dhidi yangu,’ ambalo halipo moja kwa moja katika kihusishi cha Kiebrania.
- source_word: עַבְדְּךָ
  choice: mtumwa wako
  rationale: Ingawa עבד inaweza kumaanisha mtumishi au mtumwa, hadhi ya Yosefu katika nyumba ya Potifa ilikuwa ya utumwa; ‘mtumwa’ huiweka wazi.
- source_word: וַיִּחַר אַפּוֹ
  choice: hasira yake ikawaka
  rationale: Huhifadhi sitiari ya Kiebrania ya hasira kuwaka badala ya kuirahisisha kuwa ‘akakasirika.’
