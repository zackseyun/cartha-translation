base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: sw
  text: Hakuna mtu aliye mkuu kuliko mimi katika nyumba hii[a], wala bwana wangu hajaninyima kitu chochote isipokuwa wewe, kwa sababu wewe ni mke wake. Basi, ningewezaje kufanya uovu huu mkubwa[b] na kumkosea Mungu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakuna yeyote katika nyumba hii aliye mkuu kuliko mimi.” Kiebrania kinakana kihalisi kuwapo kwa mtu aliye mkuu kuliko Yosefu ndani ya nyumba hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kosa hili kubwa.” Neno la Kiebrania רָעָה linaweza kumaanisha uovu, ubaya, au kosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: Hakuna mtu aliye mkuu kuliko mimi
  rationale: Muundo wa אֵין pamoja na kivumishi unakana kuwapo kwa mtu aliye mkuu kuliko Yosefu, si kwa kawaida kulinganisha mtu fulani wa kiume naye.
- source_word: בַּבַּיִת הַזֶּה
  choice: katika nyumba hii
  rationale: Nyumba hapa yaweza kumaanisha jengo au kaya na usimamizi wake; 'nyumba hii' huhifadhi taswira ya Kiebrania na inaeleweka katika muktadha.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: h留?
  rationale: placeholder
theological_decisions:
- issue: Rejeo la אֱלֹהִים katika maneno ya Yosefu
  choice: Mungu
  alternative: mungu fulani
  rationale: Katika simulizi la Mwanzo, Yosefu anamrejelea Mungu anayemwabudu; pia kauli hii inaonyesha kosa la kiadili dhidi ya Mungu, si uvunjaji wa uaminifu wa kijamii pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Bwana wangu' imewekwa wazi kwa kuwa kiima cha kitenzi katika Kiebrania kinamrejelea Potifa kwa muktadha. Lugha imehifadhi uzito wa hoja ya Yosefu kuhusu uaminifu kwa bwana wake na dhambi dhidi ya Mungu.
