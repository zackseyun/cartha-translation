  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: sw
  text: Yahweh alikuwa pamoja na Yosefu, naye akawa mtu mwenye kufanikiwa; naye alikuwa nyumbani mwa bwana wake Mmisri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶת יוֹסֵף
  choice: pamoja na Yosefu
  rationale: Muundo huu unaonyesha uwepo na fadhili za Mungu kwa Yosefu; “Yosefu” ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: אִישׁ מַצְלִיחַ
  choice: mtu mwenye kufanikiwa
  rationale: Kirai hiki kinamwelezea Yosefu kama mtu ambaye mambo yake yanafanikiwa; hakikomei katika maana ya kuwa tajiri.
- source_word: בְּבֵית אֲדֹנָיו
  choice: nyumbani mwa bwana wake
  rationale: Huhifadhi maana ya kuwa ndani ya nyumba ya mwenye mamlaka juu yake kwa Kiswahili cha asili.
- source_word: הַמִּצְרִי
  choice: Mmisri
  rationale: Nomino hii inamtambulisha bwana wake Yosefu kwa utaifa wake, kulingana na muundo wa Kiebrania.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: alikuwa ... akawa ... alikuwa
  rationale: Uradidi wa vitenzi umehifadhiwa kwa kiwango cha kawaida katika Kiswahili, huku “akawa” ikionyesha hali inayofuata katika simulizi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Matini ya Kiebrania hutumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya mafanikio ya Yosefu
  choice: mtu mwenye kufanikiwa
  alternative: mtu aliyestawi
  rationale: Uchaguzi huu huhifadhi maana pana ya kufanikiwa au kustawi bila kuifanya ihusu hasa utajiri wa mali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa ulinganifu bora, ukihifadhi uradidi wa simulizi na tofauti kati ya uwepo wa Yahweh, mafanikio ya Yosefu, na mahali alipokuwa.
