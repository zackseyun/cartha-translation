  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: sw
  text: Mkuu wa gereza akawakabidhi Yosefu wafungwa wote waliokuwa gerezani,[a] na kila jambo lililofanywa humo, yeye ndiye aliyekuwa akilifanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akaweka mkononi mwa Yosefu,” nahau yenye maana ya kuwakabidhi chini ya mamlaka na uangalizi wake.'
    reason: lexical_alternative
  - marker: b
    text: 'Au, kwa maana ya uwajibikaji katika muktadha: “yeye ndiye aliyekuwa akilisimamia.” Kiebrania humkazia Yosefu kuwa ndiye aliyekuwa akifanya kila lililofanywa humo.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: Mkuu wa gereza
  rationale: Neno שַׂר humaanisha mkuu au msimamizi; hapa ni afisa aliyekuwa na mamlaka juu ya gereza.
- source_word: בְּיַד יוֹסֵף
  choice: akawakabidhi Yosefu
  rationale: Nahau ya Kiebrania ‘kutia mkononi mwa’ ina maana ya kukabidhi chini ya mamlaka au uangalizi wa mtu; Kiswahili hiki ni cha kawaida na wazi.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Umbo la jina lililozoeleka na linalosomeka kwa kawaida katika Kiswahili.
- source_word: כָּל הָאֲסִירִם
  choice: wafungwa wote
  rationale: אֲסִירִים ni watu waliofungwa; ‘wafungwa’ ndilo neno la kawaida katika muktadha wa gereza.
- source_word: אֲשֶׁר בְּבֵית הַסֹּהַר
  choice: waliokuwa gerezani
  rationale: Hutaja mahali walipokuwa wafungwa kwa Kiswahili cha kawaida bila kurudia ‘gereza’ kwa uzito usiohitajika.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: na shughuli zote zilizofanywa humo
  rationale: Partisipu ya wingi isiyo na kiima mahsusi inahusu yote yaliyofanyika humo; ‘shughuli’ huonyesha utendaji wa gereza bila kulazimisha kiima kisichotajwa.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: yeye ndiye aliyezisimamia
  rationale: הוּא ni ya mkazo, na היה pamoja na partisipu huonyesha jukumu la kuendelea. ‘Aliyezisimamia’ linaeleza kwamba Yosefu ndiye aliyekuwa akihakikisha shughuli zinafanywa, bila kudai kwamba alizifanya zote mwenyewe.
theological_decisions:
- issue: Kiwango cha ushiriki wa Yosefu katika shughuli za gereza
  choice: yeye ndiye aliyezisimamia
  alternative: yeye ndiye aliyekuwa akizifanya
  rationale: Kiebrania kinaweza kusemwa kwa karibu kuwa ‘yeye alikuwa akifanya,’ lakini muktadha wa kukabidhiwa wafungwa unaelekeza kwenye uwajibikaji na usimamizi. Tanbihi huhifadhi uwezekano wa tafsiri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Gereza,’ ‘wafungwa,’ na ‘kusimamia’ ni maneno ya kawaida yanayoeleweka, huku muundo ukihifadhi mkazo wa Kiebrania juu ya jukumu la Yosefu.
