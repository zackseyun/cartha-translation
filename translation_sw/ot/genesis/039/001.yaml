  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: sw
  text: Yosefu alikuwa amepelekwa Misri, na Potifa, afisa wa Farao[a], mkuu wa walinzi, Mmisri[b], akamnunua kutoka kwa Waishmaeli waliokuwa wamempeleka huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “towashi wa Farao.” Neno la Kiebrania linaweza kumaanisha afisa wa kifalme au mwanamume aliyehasiwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi ya muundo wa Kiebrania, “mwanamume Mmisri.”
    reason: previous_rendering
lexical_decisions:
- source_word: הוּרַד
  choice: alikuwa amepelekwa
  rationale: Kauli ya kutendwa ya mzizi ירד inaonyesha kuwa Yosefu alisababishwa kwenda Misri. Kiswahili cha kawaida ‘alikuwa amepelekwa’ kinaonyesha tendo lililotangulia ununuzi bila kuleta picha isiyokusudiwa ya kushushwa kwa kitu.
- source_word: מִצְרָיְמָה
  choice: Misri
  rationale: Kiambishi cha mwelekeo kinaonyesha kwamba Misri ndiyo mahali alikopelekwa; katika Kiswahili, ‘kupelekwa Misri’ huonyesha mwelekeo huo kiasili bila kuhitaji ‘kwenda’ au ‘mpaka’.
- source_word: וַיִּקְנֵהוּ
  choice: akamnunua
  rationale: Katika muktadha wa kuuzwa kwa Yosefu, קנה humaanisha kununua. Muundo wa ‘aka-’ unaendeleza simulizi na kuunganisha tendo hili na lililotangulia.
- source_word: סְרִיס פַּרְעֹה
  choice: ofisa wa Farao
  rationale: סְרִיס inaweza kumaanisha ofisa wa ikulu au towashi. Maana pana ya cheo ndiyo inayofaa zaidi katika matini kuu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: שַׂר הַטַּבָּחִים
  choice: mkuu wa walinzi
  rationale: Kifungu hiki hutaja mkuu wa kikosi cha kifalme ambacho huenda kilikuwa na kazi ya ulinzi na utekelezaji wa hukumu. ‘Mkuu wa walinzi’ ni wazi na hakifungii maana kwenye jukumu moja lenye mjadala.
- source_word: אִישׁ מִצְרִי
  choice: Mmisri
  rationale: Hutambulisha utaifa wa Potifa. ‘Mmisri’ ni Kiswahili fasaha na cha kawaida; kuongeza ‘mwanamume’ kungekuwa na uzito usio wa lazima katika orodha hii ya maelezo.
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: kutoka kwa Waishmaeli
  rationale: Neno kwa neno ni ‘kutoka mkononi mwa,’ lakini katika ununuzi nahau hiyo humaanisha tu chanzo cha mtu aliyenunuliwa. ‘Kutoka kwa’ ni ya kawaida na sahihi.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: waliokuwa wamempeleka huko
  rationale: Kishazi hiki kinawarudia Waishmaeli na kinaonyesha kuwa wao ndio waliomfikisha Yosefu Misri kabla Potifa hajamnunua. ‘Huko’ huhifadhi שָׁמָּה.
theological_decisions:
- issue: Maana ya סְרִיס katika cheo cha Potifa
  choice: ofisa wa Farao
  alternative: towashi wa Farao
  rationale: Neno la Kiebrania linaweza kutaja ama ofisa wa kifalme ama mwanamume aliyehasiwa. Simulizi halilazimishi maana ya kimaumbile, kwa hiyo matini kuu inatumia maana pana ya kiutawala na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili orodha ya vyeo vya Potifa isomeke kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Yosefu, Potifa, Farao, na Waishmaeli.'
