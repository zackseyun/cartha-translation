  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: sw
  text: Baada ya mambo hayo, mke wa bwana wake akamtupia Yosefu macho[a], akamwambia, “Lala nami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “akainua macho yake kumwelekea Yosefu,” nahau ambayo hapa inaonyesha kumkazia macho kwa tamaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo hayo
  rationale: Kirai hiki kinaanzisha tukio lililofuata katika simulizi. Tafsiri hii inafuata kwa karibu usemi wa Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: akamtazama Yosefu kwa kumtamani
  rationale: Kihalisi ni ‘akainua macho yake kumwelekea.’ Katika muktadha huu ni mtazamo ulioelekezwa kwake kwa tamaa, si kumwangalia tu; tafsiri hii inaweka maana hiyo wazi bila kuongeza tendo lisilokuwamo.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: mke wa bwana wake
  rationale: Muundo huu unamtambulisha mwanamke kwa uhusiano wake na bwana wa Yosefu. Kiswahili hiki ni wazi na cha asili.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: ‘Yosefu’ ni umbo la kawaida la jina hili katika Kiswahili na linatambulika kwa urahisi na wasomaji wa Afrika Mashariki.
- source_word: שִׁכְבָה עִמִּי
  choice: Lala nami
  rationale: Amri hii pamoja na ‘nami’ ni pendekezo la moja kwa moja la kufanya ngono. ‘Lala nami’ huhifadhi ufupi na ukali wa usemi wa Kiebrania huku ikiwa ya asili katika Kiswahili.
