  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: sw
  text: Ikawa, alipokuwa akimsemesha Yosefu siku baada ya siku, Yosefu hakumsikiliza; hakulala kando yake[a] wala kuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulala naye.” Kiebrania kinaweza kuwa na maana ya kingono; “kulala kando yake” huhifadhi usemi wa asili, huku kauli inayofuata, “kuwa pamoja naye,” ikibaki na uzito wake wenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya masimulizi inayoendeleza tukio linalofuata; “Ikawa” huhifadhi kazi hiyo kwa lugha fupi na yenye hadhi.
- source_word: כְּדַבְּרָהּ
  choice: alipokuwa akizungumza
  rationale: Muundo wa wakati pamoja na “siku baada ya siku” unaonyesha tendo lililorudiwa; hali ya kuendelea katika Kiswahili huwasilisha msisitizo huo kwa kawaida.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili Sanifu, linalowakilisha jina la Kiebrania יוֹסֵף.
- source_word: יוֹם יוֹם
  choice: siku baada ya siku
  rationale: Urudiaji wa nomino ya Kiebrania unaonyesha jambo lililoendelea kurudiwa; usemi huu wa Kiswahili unaonyesha shinikizo lake la kila siku.
- source_word: שָׁמַע אֵלֶיהָ
  choice: hakumsikiliza
  rationale: שׁמע pamoja na אֶל humaanisha kumsikiliza au kumtii mtu. “Hakumsikiliza” huhifadhi maana pana bila kuifanya iwe utii pekee.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: kwa kulala kando yake
  rationale: שׁכב inaweza kumaanisha kulala chini na pia mahusiano ya kingono, huku אֵצֶל ikiwa na maana ya kuwa kando au karibu. Tafsiri hii huhifadhi picha ya mahali na pia utata wa kimuktadha.
- source_word: לִהְיוֹת עִמָּהּ
  choice: au kuwa pamoja naye
  rationale: היה עם ni kuwa pamoja na mtu. Kauli hii huhifadhi upana wa kukataa kwake, si tendo la kingono tu bali pia ukaribu wa kuhatarisha uaminifu wake.
