  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. Jina limetolewa kwa umbo la kawaida la Kiswahili, ‘Yosefu.’ ‘Bwana’ hapa limeandikwa kwa herufi ndogo ili kuonyesha bwana wa kibinadamu, si Mungu.
