base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: sw
  text: Basi bwana wa Yosefu akamchukua, akamtia gerezani[a], mahali ambapo wafungwa wa mfalme walifungwa[b]. Naye akawa humo gerezani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “nyumba ya sohar”; huenda sohar ni istilahi ya Kimisri kwa gereza au nyumba ya kizuizini.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania kinarudia mzizi wenye maana ya “funga”: kihalisi, “mahali ambapo wafungwa wa mfalme walifungwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: bwana wa Yosefu
  rationale: Katika muktadha huu אֲדֹנֵי humaanisha bwana wa kibinadamu aliyekuwa na mamlaka juu ya Yosefu, si cheo cha Mungu. Kiswahili ‘bwana wa Yosefu’ ni cha kawaida na kinafaa katika mazingira ya utumwa wa nyumbani.
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Kitenzi לקח kwa kawaida humaanisha ‘chukua’; ‘akamkamata kwa nguvu’ kingeongeza ukali usioelezwa wazi katika chanzo.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: na kumtia gerezani
  rationale: נתן pamoja na אֶל hapa humaanisha kumweka mtu ndani ya mahali fulani. ‘Kumtia gerezani’ ni usemi wa kawaida wa Kiswahili unaoonyesha kuingizwa kifungoni.
- source_word: בֵּית הַסֹּהַר
  choice: gereza
  rationale: Kirai hiki kihalisi ni ‘nyumba ya sohar’; katika muktadha kinaashiria wazi mahali pa kifungo. ‘Gereza’ ni neno la kawaida, la sasa na lenye heshima.
- source_word: מְקוֹם אֲשֶׁר
  choice: mahali ambapo
  rationale: Tafsiri hii inadumisha kirai cha Kiebrania kinacholifafanua gereza badala ya kukifupisha.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: wafungwa wa mfalme walifungwa
  rationale: Chanzo kinarudia mzizi אסר, kwanza kwa watu waliofungwa na kisha kwa hali yao ya kufungwa. Marudio ‘wafungwa ... walifungwa’ yanaeleweka katika Kiswahili na kuhifadhi msisitizo huo.
- source_word: וַיְהִי שָׁם
  choice: Naye akawa humo
  rationale: היה pamoja na שָׁם hueleza kuwapo kwa Yosefu mahali hapo; ‘akawa humo’ hudumisha maana bila kuongeza wazo la kukaa kwa muda mrefu.
- source_word: בְּבֵית הַסֹּהַר
  choice: gerezani
  rationale: Chanzo kinarudia mahali pa kifungo mwishoni. Kurudia ‘gerezani’ kunahifadhi msisitizo wa Kiebrania.
