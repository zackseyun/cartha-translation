base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: sw
  text: Ndipo akamshika kwa vazi lake[a], akisema, “Lala nami!”[b] Lakini akaacha vazi lake mkononi mwake, akakimbia, akatoka nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguo yake.” Neno la Kiebrania ni la jumla kwa kitu kinachovaliwa na halibainishi aina maalumu ya vazi.
    reason: lexical_alternative
  - marker: b
    text: Kauli hii ni mwaliko wa kujamiiana; Kiebrania hutumia kihalisi kitenzi “kulala” kama msemo wa staha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: akamshika
  rationale: Kitenzi תפשׂ kinaonyesha kumkamata au kumshika mtu kwa nguvu; “akamshika” ni cha kawaida na kinafaa kwa tendo la ghafla katika muktadha huu.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: kwa vazi lake / vazi lake
  rationale: בגד ni neno la jumla kwa nguo au vazi. “Vazi” halibainishi bila msingi kama lilikuwa joho au koti, na kirai “akamshika kwa vazi lake” kinadumisha wazo kwamba alimshika yeye kupitia vazi lake.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Muundo huu unatambulisha maneno ya moja kwa moja; “akisema” unaakisi vizuri mtiririko wa simulizi la Kiebrania.
- source_word: שִׁכְבָה עִמִּי
  choice: Lala nami!
  rationale: שׁכב pamoja na עִם ni msemo wa staha wenye maana ya kujamiiana. “Lala nami” huhifadhi picha ya lugha ya asili na bado inaeleweka kwa Waswahili wa leo.
- source_word: וַיַּעֲזֹב
  choice: akaacha
  rationale: עזב hapa humaanisha kuacha kitu mahali kilipokuwa; “akaacha” ni ya kawaida na sahihi kwa vazi lililobaki mkononi mwa mwanamke.
- source_word: בְּיָדָהּ
  choice: mkononi mwake
  rationale: יד humaanisha “mkono,” na kirai hiki kinaonyesha kwamba vazi lilibaki katika milki yake ya kimwili.
- source_word: וַיָּנָס
  choice: akakimbia
  rationale: נוס huonyesha kukimbia ili kujiokoa; “akakimbia” ni ya asili na inadumisha haraka ya tendo.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: akatoka nje
  rationale: Muundo huu unaonyesha kutoka ndani kuelekea nje. “Akatoka nje” ni Kiswahili cha kawaida na huhifadhi tendo tofauti linalofuata kukimbia.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi, wa sasa na wenye hadhi. Mfuatano wa vitenzi “akakimbia, akatoka nje” umehifadhiwa ili kuonyesha hatua mbili za maandishi ya Kiebrania. Alama za tanbihi zimewekwa kulingana na maudhui yake: [a] kwa “vazi,” na [b] kwa msemo “Lala nami.”'
