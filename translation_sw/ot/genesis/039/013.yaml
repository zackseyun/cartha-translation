lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha hatua inayofuata katika simulizi na pia huakisi kitenzi היה bila kutumia muundo mzito usio wa lazima.
- source_word: כִּרְאוֹתָהּ
  choice: alipoona
  rationale: Muundo wa כ pamoja na kitenzi-jina cha ראה na kiambishi cha nafsi ya tatu ya kike una maana ya wakati, inayotolewa kwa kawaida kwa ‘alipoona.’
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי hutambulisha jambo aliloona, hivyo ‘kwamba’ huonyesha wazi kishazi cha maudhui.
- source_word: עָזַב
  choice: alikuwa ameacha
  rationale: Maana ya msingi ni ‘kuacha’; wakati timilifu huonyesha kwamba kitendo kilikuwa kimetangulia kuona kwake.
- source_word: בִּגְדוֹ
  choice: vazi lake
  rationale: בגד ni neno la jumla kwa vazi au nguo; ‘vazi’ huhifadhi upana huo bila kulifanya kuwa ‘joho’ mahususi.
- source_word: בְּיָדָהּ
  choice: mkononi mwake
  rationale: Tafsiri hii huhifadhi picha halisi ya kitu kilichobaki katika mkono wake na ni Kiswahili cha kawaida.
- source_word: וַיָּנָס
  choice: amekimbilia
  rationale: נוס humaanisha kukimbia ili kujiokoa au kuondoka haraka; ‘amekimbilia’ huwasilisha mwendo huo wa kutoroka katika muktadha huu.
- source_word: הַחוּצָה
  choice: nje
  rationale: Neno hili linaonyesha mwendo kuelekea upande wa nje; ‘nje’ ni usemi wa asili katika Kiswahili pamoja na ‘amekimbilia.’
