  source_fidelity: 'Maana ya Kiebrania imewasilishwa kwa usahihi kwa ujumla: Yosefu alipata kibali, akamtumikia Potifa, kisha Potifa akamweka juu ya nyumba yake na kumkabidhi vyote. Hata hivyo, "akavitia mkononi mwake" huacha urejeo wa "mwake" ukiwa na utata wa kisarufi katika Kiswahili, ambapo unaweza kueleweka kuwa ni mkono wa Potifa badala ya wa Yosefu.'
