  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: sw
  text: Yosefu akapata kibali machoni pake, akamtumikia. Potifa akamweka kuwa msimamizi wa nyumba yake, na vyote alivyokuwa navyo akavitia mkononi mwa Yosefu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akavitia mkononi mwa Yosefu,” ni nahau yenye maana kwamba Potifa alivikabidhi chini ya mamlaka au uangalizi wa Yosefu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא יוֹסֵף חֵן בְּעֵינָיו
  choice: Yosefu akapata kibali machoni pake
  rationale: Inahifadhi nahau ya Kiebrania ya ‘kupata kibali machoni pa mtu’ kwa Kiswahili cha asili na chenye hadhi.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: akamtumikia
  rationale: שרת hapa inaonyesha huduma binafsi ya Yosefu kwa Potifa; ‘akamtumikia’ ni wazi na ya kawaida.
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: akamweka kuwa msimamizi wa nyumba yake
  rationale: Muundo huu wa פקד una maana ya kumkabidhi mtu usimamizi; ‘msimamizi’ huwasilisha wajibu huo bila kufinyiza ‘nyumba’ kuwa jengo pekee.
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: vyote alivyokuwa navyo
  rationale: Ni usemi mpana unaojumuisha mali na vitu vyote vya Potifa.
- source_word: נָתַן בְּיָדוֹ
  choice: akavitia mkononi mwake
  rationale: Inahifadhi taswira halisi ya ‘mkono’ inayomaanisha mamlaka, dhamana, au uangalizi, huku tanbihi ikifafanua nahau hiyo.
