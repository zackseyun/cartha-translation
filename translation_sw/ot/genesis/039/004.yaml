translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Kiambishi cha mhusika katika ‘akamweka’ na ‘akavitia’ kinafuata mtiririko wa Kiebrania, huku muktadha ukionyesha kwamba Potifa ndiye anayemweka Yosefu na kumkabidhi mali zake.
