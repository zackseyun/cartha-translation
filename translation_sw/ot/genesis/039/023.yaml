base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: sw
  text: Mkuu wa gereza hakushughulika na jambo lolote lililokuwa chini ya mamlaka ya Yosefu[a], kwa sababu Yahweh alikuwa pamoja naye; na kila alichofanya, Yahweh alikifanikisha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mkononi mwake”; yaani, jambo lililokabidhiwa chini ya usimamizi wake. Pia yaweza kutafsiriwa, “Mkuu wa gereza hakukagua jambo lolote lililokuwa mikononi mwa Yosefu.”
    reason: cultural_note
  - marker: b
    text: Au, “Yahweh alisababisha kila alichofanya lifanikiwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: Mkuu wa gereza
  rationale: Neno שַׂר humaanisha mkuu au afisa mwenye mamlaka, na בֵּית הַסֹּהַר ni gereza. Tafsiri hii ni ya kawaida na huhifadhi wazo la cheo cha usimamizi.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: hakushughulika na jambo lolote
  rationale: Katika muktadha huu, usemi wa Kiebrania hauonyeshi tu kuona kwa macho, bali kutokagua au kutohangaikia mambo aliyokabidhiwa Yosefu.
- source_word: בְּיָדוֹ
  choice: lililokuwa chini ya mamlaka ya Yosefu
  rationale: Kwa maana halisi ni ‘mkononi mwake,’ lakini hapa ni nahau ya jambo lililokabidhiwa chini ya udhibiti wake. Kutaja Yosefu huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: kwa sababu Yahweh alikuwa pamoja naye
  rationale: בַּאֲשֶׁר ina maana ya sababu hapa, na אִתּוֹ huonyesha uwepo na msaada wa Yahweh pamoja na Yosefu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeendelezwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: na kila alichofanya
  rationale: Muundo huu wa uhusiano unajumuisha shughuli zote za Yosefu na unasikika kwa kawaida katika Kiswahili.
- source_word: מַצְלִיחַ
  choice: alikifanikisha
  rationale: 'Hifili ya צלח ina nguvu ya kisababishi: Yahweh alisababisha jambo alilofanya Yosefu lifanikiwe.'
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; ‘Yahweh’ huhifadhi jina hilo bila kulibadili kuwa cheo.
- issue: Mhusika anayefanikisha kazi ya Yosefu
  choice: Yahweh alikifanikisha
  alternative: kila alichofanya kilifanikiwa
  rationale: Muundo wa Kiebrania unamtaja Yahweh wazi kuwa mtendaji anayesababisha mafanikio, hivyo tafsiri tendaji huhifadhi msisitizo huo wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa urahisi. ‘Hakushughulika’ huwasilisha maana ya kiutendaji ya רֹאֶה katika muktadha, huku tanbihi ikihifadhi taswira halisi ya ‘mkononi mwake.’
