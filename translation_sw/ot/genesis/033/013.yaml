base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: sw
  text: Lakini akamwambia, “Bwana wangu anajua kwamba watoto ni dhaifu, na kondoo na ng’ombe wanaonyonyesha watoto wao wako chini ya uangalizi wangu.[a] Wakiendeshwa kwa nguvu kwa siku moja, kondoo wote watakufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kondoo na ng’ombe wanaonyonyesha watoto wao ni jukumu langu.” Kirai cha Kiebrania ni nahau inayounganisha hali ya wanyama wanaonyonyesha watoto wao na wajibu wa Yakobo wa kuwatunza.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Ni namna ya heshima ambayo Yakobo anatumia kumwambia Esau, si jina la Mungu. ‘Bwana wangu’ huhifadhi heshima na tofauti ya kijamii katika simulizi.
- source_word: הַיְלָדִים רַכִּים
  choice: watoto ni dhaifu
  rationale: רַכִּים inaonyesha ulaini, udogo au hali ya kutoweza kustahimili safari ngumu. ‘Ni dhaifu’ huwasilisha uwezekano wao wa kuathirika bila kudai wazi umri ambao Kiebrania hakitaji.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: kondoo na ng’ombe
  rationale: Majina haya ya mkusanyo yanataja mifugo midogo, hasa kondoo na mbuzi, pamoja na ng’ombe. Katika Kiswahili cha kawaida, ‘kondoo na ng’ombe’ ni fupi na ya asili, ingawa ‘kondoo’ hapa inawakilisha kundi la mifugo midogo.
- source_word: עָלוֹת עָלָי
  choice: wanaonyonyesha wako chini ya uangalizi wangu
  rationale: Kirai hiki kigumu kinaunganisha hali ya wanyama wenye watoto wanaonyonya na wajibu unaomwelemea Yakobo. Tafsiri hii inaonyesha maana zote mbili bila kulazimisha muundo wa Kiebrania usio wa kawaida katika Kiswahili.
- source_word: וּדְפָקוּם
  choice: Wakiendeshwa kwa nguvu
  rationale: Kitenzi kinaashiria kuendesha mifugo kwa ukali au kasi kupita uwezo wake. Muundo wa kutendwa huhifadhi mtendaji asiyeainishwa katika Kiebrania.
- source_word: יוֹם אֶחָד
  choice: hata siku moja
  rationale: ‘Hata’ huonyesha kwamba muda wa siku moja tu ungetosha kuleta madhara, huku maana ya msingi ya ‘siku moja’ ikihifadhiwa.
- source_word: וָמֵתוּ כָּל־הַצֹּאן
  choice: kondoo wote watakufa
  rationale: Kiebrania kinatumia nomino ya mkusanyo kwa mifugo midogo. Kiswahili cha asili hutumia wingi ‘kondoo wote’ kueleza matokeo kwa kundi zima.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa urahisi. Sentensi ya masharti imetolewa kwa muundo wa kawaida wa Kiswahili, na nahau tata ya Kiebrania imefafanuliwa kwa kiasi bila kuondoa utata wake kabisa.
