  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: sw
  text: Hapo akasimamisha madhabahu, akaiita El-Elohe-Israeli[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hapo akasimamisha madhabahu, akamwita, ‘Ee Mungu, Mungu wa Israeli,’” au, “akatangaza juu yake, ‘Mungu, Mungu wa Israeli.’” Kiebrania kinaweza kueleweka kuwa aliipa madhabahu jina au kuwa alimwita Mungu/alitoa tangazo kumhusu.
    reason: alternative_reading
  - marker: b
