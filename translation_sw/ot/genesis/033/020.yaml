lexical_decisions:
- source_word: וַיַּצֶּב
  choice: akasimamisha
  rationale: Hifili ya נצב humaanisha kusimamisha au kuweka kitu; “akasimamisha” ni ya kawaida na inafaa kwa kujenga au kuweka madhabahu mahali pake.
- source_word: שָׁם
  choice: hapo
  rationale: Kielezi hiki huonyesha mahali palipotajwa tayari; “hapo” ni tafsiri ya moja kwa moja na ya asili katika muktadha.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali au jengo la kutolea dhabihu.
- source_word: וַיִּקְרָא לוֹ
  choice: akaiita
  rationale: Muundo קרא + ל unaweza kumaanisha kuita au kumpa jina. Katika muktadha huu, kiwakilishi kinaeleweka kwa kawaida kurejelea madhabahu, ingawa uwezekano wa kumwitia Mungu au kutangaza juu ya madhabahu umehifadhiwa katika tanbihi.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: El-Elohe-Israeli
  rationale: Kwa kuwa kirai hiki kinafanya kazi kama jina la madhabahu katika usomaji mkuu, kimetoholewa badala ya kutafsiriwa ndani ya mstari. Umbo “Israeli” linafuata tahajia ya Kiswahili, na maana yake imeelezwa katika tanbihi.
theological_decisions:
- issue: Iwapo kirai cha mwisho ni jina la madhabahu au tamko/ombi linalomhusu Mungu
  choice: Kukichukulia kuwa jina ambalo Yakobo aliipa madhabahu
  alternative: Aliomba kwa Mungu akisema, “Mungu, Mungu wa Israeli,” au akatangaza juu ya madhabahu, “Mungu, Mungu wa Israeli.”
  rationale: Baada ya kauli ya kusimamisha madhabahu, sintaksia inaunga mkono kwa kawaida tendo la kuipa jina, sawa na miundo mingine ya majina katika Mwanzo. Hata hivyo, ufupi wa Kiebrania unaruhusu pia usomaji wa kumwitia Mungu au kutoa tangazo, kwa hiyo utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “Madhabahu” limehifadhiwa kama istilahi ya kawaida ya Biblia; jina la Kiebrania limetoholewa na kufafanuliwa katika tanbihi.
