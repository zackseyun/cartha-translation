  text: So Esau returned that day on his way to Seir[a].
translation:
  language: sw
  text: Basi Esau akarudi siku hiyo njiani kwake kuelekea Seiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika mfuatano wa masimulizi kinaonyesha tendo lililokamilika la kurudi; “akarudi” ni cha kawaida na sahihi katika Kiswahili.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huwasilisha kwa kawaida katika Kiswahili maana ya wakati ya neno kwa neno “katika siku hiyo,” bila kuongeza wazo la “siku ileile.”
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina la mtu limetolewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: לְדַרְכּוֹ
  choice: akaelekea
  rationale: Kirai hiki kwa maana ya msingi ni “kwenda katika njia yake.” Katika muktadha wa kuendelea na safari, “akaelekea” ni cha asili na huepuka marudio yasiyo ya lazima baada ya “akarudi.”
- source_word: שֵׂעִירָה
  choice: Seiri
  rationale: Herufi ya mwisho yenye kuonyesha mwelekeo inaashiria mwendo kuelekea Seiri; kwa Kiswahili mwelekeo huo tayari unaonyeshwa na kitenzi “akaelekea.”
