  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: sw
  text: Yakobo akasema, “La, tafadhali. Ikiwa nimepata kibali machoni pako, basi pokea zawadi yangu kutoka mkononi mwangu, kwa maana nimeuona uso wako kama mtu auonavyo uso wa Mungu[a], nawe umenipokea kwa wema[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “uso wa mungu.” Hata hivyo, katika muktadha huu “Mungu” inafaa zaidi kwa sababu Yakobo alikuwa ametoka kukutana na Mungu huko Penieli (Mwa. 32:30).
    reason: alternative_reading
  - marker: b
    text: Au, “umenikubali” au “umependezwa nami.” Kitenzi cha Kiebrania kinaonyesha kupokewa kwa kibali.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן
  choice: kibali
  rationale: Katika nahau 'kupata kibali machoni pa mtu,' neno hili linaonyesha kukubaliwa au kutendewa kwa wema bila kuingiza maana finyu ya kidhehebu.
- source_word: בְּעֵינֶיךָ
  choice: machoni pako
  rationale: Huhifadhi taswira ya Kiebrania na ni nahau ya kawaida na inayoeleweka katika Kiswahili.
- source_word: מִנְחָתִי
  choice: zawadi yangu
  rationale: Katika muktadha huu ni zawadi ya upatanisho ambayo Yakobo anamshawishi Esau aipokee; 'sadaka' ingeweza kudokeza ibada isiyokusudiwa hapa.
- source_word: מִיָּדִי
  choice: kutoka mkononi mwangu
  rationale: Huhifadhi usemi halisi unaofaa tukio la Yakobo kumpa Esau zawadi moja kwa moja.
- source_word: עַל־כֵּן
  choice: kwa sababu
  rationale: Katika muktadha huu usemi unaanzisha sababu ya ombi la Yakobo; tafsiri hii ni ya asili katika Kiswahili cha sasa.
- source_word: רָאִיתִי פָנֶיךָ
  choice: kuuona uso wako
  rationale: Muundo wa kitenzi-jina unaungana kwa kawaida na ulinganisho unaofuata na kuhifadhi wazo la kuona uso.
- source_word: כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: ni kama kuuona uso wa Mungu
  rationale: Huhifadhi ulinganisho wenye nguvu wa Kiebrania na mwangwi wake wa tukio la Penieli, bila kuupunguza.
- source_word: וַתִּרְצֵנִי
  choice: umenipokea kwa wema
  rationale: Huwasilisha kukubaliwa kwa namna yenye neema au upendeleo katika mapatano ya Esau na Yakobo.
- source_word: אַל נָא אִם נָא
  choice: La, tafadhali. Ikiwa
  rationale: Hutoa kukataa kwa heshima lakini kwa msisitizo, kisha kuanzisha ombi la Yakobo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Rejeleo la אֱלֹהִים katika ulinganisho wa kuuona uso
  choice: Mungu
  alternative: mungu mmoja
  rationale: Muktadha wa karibu wa simulizi, hasa Yakobo kuuona uso wa Mungu huko Penieli, unaunga mkono zaidi rejeleo la Mungu. Tanbihi inadumisha uwezekano wa kimsamiati bila kuondoa mvutano wa usemi wa Yakobo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Nahau 'machoni pako' na taswira 'kutoka mkononi mwangu' zimehifadhiwa kwa kuwa zinaeleweka vizuri. Sentensi imetiririshwa kwa ulinganifu wa 'kuuona ... kama kuuona'.
