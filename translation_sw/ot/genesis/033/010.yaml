  naturalness: Most wording is clear Standard East African Swahili. ‘Kwa sababu kuuona uso wako’ is somewhat awkward after ‘kwa sababu’; a finite construction is more idiomatic and also better reflects the Hebrew verbal form.
  terminology: '‘Kibali machoni pako,’ ‘zawadi yangu,’ ‘Mungu,’ and ‘umenipokea kwa wema’ are appropriate. The alternative in footnote a should be ‘uso wa mungu’ rather than ‘uso wa mungu mmoja’: the latter adds the specific notion ‘one,’ which is not present in the possible indefinite reading.'
