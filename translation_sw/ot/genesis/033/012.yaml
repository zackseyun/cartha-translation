lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akasema
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha akasema” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: נִסְעָה
  choice: Tuondoke
  rationale: Kitenzi hiki ni cohortative cha nafsi ya kwanza wingi, kikitoa pendekezo la kuanza safari; “Tuondoke” ni cha asili katika muktadha huu.
- source_word: וְנֵלֵכָה
  choice: twende
  rationale: Katika muktadha wa safari, הלך humaanisha kwenda au kusafiri; “twende” hudumisha mwaliko wa pamoja na uratibu wa vitenzi.
- source_word: וְאֵלְכָה
  choice: nami nitaenda
  rationale: Imperfect ya nafsi ya kwanza umoja hapa inaeleza hatua ambayo Esau anajitolea kufanya sambamba na pendekezo la safari.
- source_word: לְנֶגְדֶּךָ
  choice: mbele yako
  rationale: נגד inaweza kuonyesha nafasi mbele ya mtu, mkabala wake, au katika uhusiano naye. Katika safari hii, “mbele yako” hufuata maana ya kimsingi inayofaa, huku uwezekano wa uandamani ukibaki katika utata wa muktadha.
