base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: sw
  text: Yakobo akasafiri hadi Sukothi[a]. Huko akajijengea nyumba na akatengeneza vibanda kwa ajili ya mifugo yake. Kwa hiyo akapaita mahali hapo Sukothi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Sukothi linasikika kama neno la Kiebrania linalomaanisha “vibanda” au “makao ya muda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסַע
  choice: akasafiri
  rationale: Kitenzi kinaonyesha kuondoka na kuelekea mahali pengine; “akasafiri” ni Kiswahili cha kawaida kinachofaa mwendo wa simulizi.
- source_word: סֻכֹּתָה
  choice: hadi Sukothi
  rationale: He ya mwelekeo inaonyesha mwendo kuelekea Sukothi; “hadi” huwasilisha kwa kawaida kwamba Yakobo alifika huko katika muktadha huu.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: akajijengea nyumba
  rationale: Umbo la kujitendea “akajijengea” linaeleza kwa ufupi na kwa kawaida kwamba alijenga nyumba kwa matumizi yake mwenyewe.
- source_word: מִקְנֵהוּ
  choice: mifugo yake
  rationale: Neno hili linarejelea wanyama wanaomilikiwa; “mifugo” ni pana kuliko “ng’ombe” na linafaa kwa makundi ya wanyama wa Yakobo.
- source_word: עָשָׂה סֻכֹּת
  choice: kuwajengea ... vibanda
  rationale: סֻכּוֹת ni makao au miundo ya muda; “vibanda” linaonyesha miundo hiyo kwa lugha ya kawaida na linawezesha kueleza uhusiano wake na jina Sukothi katika tanbihi.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kirai hiki kinaanzisha sababu ya kupewa jina kwa mahali na kuhifadhi uhusiano wa kisababishi.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: akapaita mahali hapo
  rationale: Hii ni njia ya asili ya Kiswahili ya kuwasilisha nahau ya Kiebrania ya kukipa mahali jina bila kufanya sentensi kuwa nzito.
- source_word: סֻכּוֹת
  choice: Sukothi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; mchezo wa maneno kati ya jina hilo na vibanda unaelezwa katika tanbihi.
