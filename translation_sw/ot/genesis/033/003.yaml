  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: sw
  text: Naye yeye mwenyewe akatangulia mbele yao, akainama hadi ardhini mara saba[a], hadi alipomkaribia ndugu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajisujudu”; kitenzi cha Kiebrania kinaweza kumaanisha tendo kamili la kujinyenyekeza kwa heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Lakini yeye mwenyewe
  rationale: Kiwakilishi huru kinasisitiza kwamba Yakobo binafsi ndiye aliyetangulia; katika muktadha huu וְ inaweza kuonyesha badiliko kutoka kwa mpangilio wa familia kwenda kwa tendo lake mwenyewe.
- source_word: עָבַר לִפְנֵיהֶם
  choice: akatangulia mbele yao
  rationale: Katika muktadha wa Yakobo kwenda mbele ya familia yake kumlaki Esau, usemi huu unaonyesha kuchukua nafasi ya mbele, si kuvuka tu.
- source_word: וַיִּשְׁתַּחוּ ... אַרְצָה
  choice: akainama mpaka chini
  rationale: Huhifadhi tendo la kimwili la kujishusha kuelekea ardhini bila kulifasiri moja kwa moja kuwa ibada; tanbihi inaonyesha uwezekano wa kusujudu kabisa.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya idadi na marudio.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: hadi alipomkaribia ndugu yake
  rationale: 'Muundo unaweka kikomo cha tendo lililorudiwa: aliendelea kufanya hivyo alipokuwa akimkaribia ndugu yake. Kiswahili hiki ni cha asili na kinahifadhi wazo la kukaribia.'
theological_decisions:
- issue: Iwapo tendo la וַיִּשְׁתַּחוּ linamaanisha ibada au heshima kwa mtu
  choice: akainama mpaka chini
  alternative: akamsujudia
  rationale: Muktadha unaelekeza kwenye kitendo cha heshima na kujinyenyekeza mbele ya Esau, lakini neno lenyewe linaweza kueleza kusujudu kabisa. Tafsiri kuu haiongezi dhana ya ibada isiyolazimishwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yeye mwenyewe” huhifadhi msisitizo wa Kiebrania, na “akatangulia mbele yao” ni usemi wa kawaida unaofaa mwendo wa simulizi.
