base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: sw
  text: Esau akakimbia kwenda kumlaki Yakobo, akamkumbatia, akamwangukia shingoni, akambusu[a], nao wakalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Matini ya Kimasoreti, neno lililotafsiriwa “akambusu” limewekewa nukta juu yake kwa namna isiyo ya kawaida. Baadhi ya wafasiri huona alama hiyo kuwa ishara ya shaka au mkazo, lakini maana ya wazi ya Kiebrania hapa ni “akambusu.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: akakimbia
  rationale: Kitenzi רוץ humaanisha kukimbia; chaguo hili linadumisha mwendo wa ghafla na wa haraka katika simulizi.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: לִקְרָאתוֹ
  choice: kwenda kumlaki Yakobo
  rationale: Kirai לקראת hutaja kwenda kukutana na mtu. 'Kumlaki' ni Kiswahili fasaha kinachoonyesha kwenda kumpokea au kukutana naye; jina 'Yakobo' linaweka wazi kiwakilishi bila kubadili maana.
- source_word: וַיְחַבְּקֵהוּ
  choice: akamkumbatia
  rationale: חבק humaanisha kumkumbatia; neno hili ni la kawaida, lenye hadhi, na linafaa kwa tendo la upendo katika muktadha.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: akamwangukia shingoni
  rationale: Tafsiri hii inadumisha taswira halisi ya nahau ya Kiebrania ya kumwangukia mtu shingoni katika kumbatio la hisia.
- source_word: וַיִּשָּׁקֵהוּ
  choice: akambusu[a]
  rationale: Katika muundo huu נשק humaanisha 'kumbusu.' Maana ya moja kwa moja imehifadhiwa, huku alama zisizo za kawaida za Kim Masora zikielezwa katika tanbihi.
- source_word: וַיִּבְכּוּ
  choice: nao wakalia
  rationale: Kitenzi cha wingi kinaonyesha kwamba wote wawili walilia. 'Wakalia' ni Kiswahili cha kawaida na chenye uzito unaofaa simulizi.
theological_decisions:
- issue: Jinsi ya kuelewa matendo ya Esau kwa Yakobo
  choice: Mfululizo wa matendo umetafsiriwa moja kwa moja kama lugha ya mapatano ya kweli, bila kuongeza shaka.
  alternative: Kueleza busu kuwa la kinafiki au la kutia shaka kutokana na mapokeo ya baadaye ya ufasiri.
  rationale: Simulizi la Kiebrania linaonyesha mfululizo wa haraka wa vitendo vya upendo. Tafsiri inadumisha maana yake ya wazi na kuacha alama za Kim Masora zielezwe katika tanbihi badala ya kuingiza ufasiri katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya simulizi umehifadhiwa kwa viambishi vya -ka-. 'Kumlaki' limetumiwa kwa maana ya kwenda kukutana na kumpokea mtu, na jina 'Yakobo' limetajwa ili kuepusha mlolongo wa viwakilishi usio wazi.
