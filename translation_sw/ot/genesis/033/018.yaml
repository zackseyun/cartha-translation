base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: sw
  text: Yakobo alifika salama katika mji wa Shekemu[a], ulio katika nchi ya Kanaani, alipowasili kutoka Padani-Aramu[b], naye akapiga kambi mbele ya mji huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yakobo alifika Salemu, mji wa Shekemu.” Neno la Kiebrania שָׁלֵם (shalem) linaweza kueleweka kuwa “salama” au “kwa amani,” au kuwa jina la mahali, “Salemu.”
    reason: alternative_reading
  - marker: b
    text: Au, “alipokuja kutoka Padani-Aramu.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּבֹא
  choice: alifika
  rationale: Kitenzi בוא hapa kinaeleza kuwasili kwa Yakobo; “alifika” ni Kiswahili cha kawaida na cha asili katika simulizi.
- source_word: שָׁלֵם
  choice: salama
  rationale: 'Kwa kawaida hapa neno hili linaeleza hali ya Yakobo alipowasili: akiwa salama au mzima. Uwezekano wa kulisoma kama jina la mahali, Salemu, umehifadhiwa katika tanbihi.'
- source_word: עִיר שְׁכֶם
  choice: katika mji wa Shekemu
  rationale: Muundo huu unamtaja Shekemu kuwa mji alikofika Yakobo; “mji wa Shekemu” ni usemi wa asili wa Kiswahili.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: ulio katika nchi ya Kanaani
  rationale: Kishazi hiki kinatambulisha mahali Shekemu ilipokuwa, kwa mtindo wa Kiswahili sanifu.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: alipokuwa akitoka Padani-Aramu
  rationale: ב pamoja na kitenzi-jina na kiambishi cha nafsi ina maana ya wakati. Tafsiri hii huepuka urudiaji usio wa lazima wa “alifika” huku ikidumisha wazo la safari yake kutoka Padani-Aramu.
- source_word: פַּדַּן אֲרָם
  choice: Padani-Aramu
  rationale: Jina la mahali limetoholewa kwa tahajia inayoeleweka katika Kiswahili.
- source_word: וַיִּחַן
  choice: akapiga kambi
  rationale: Kitenzi hiki katika muktadha huu humaanisha kuweka au kupiga kambi; usemi “akapiga kambi” ni wa kawaida katika Kiswahili cha kisasa.
- source_word: אֶת־פְּנֵי הָעִיר
  choice: mbele ya mji huo
  rationale: Nahau ya Kiebrania inaonyesha eneo lililokuwa mbele ya mji au kuukabili mji; “mbele ya mji huo” huhifadhi maana hiyo ya mahali.
