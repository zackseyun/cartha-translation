  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: sw
  text: Ndipo Esau akasema, “Tafadhali, niruhusu niwaache pamoja nawe baadhi ya watu walio pamoja nami.” Lakini Yakobo akasema, “Kwa nini jambo hili? Nipate kibali machoni pa bwana wangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּֽיגָה נָּ֣א
  choice: Tafadhali, acha niwaache
  rationale: Huwakilisha ombi la hiari lenye heshima; kitenzi katika muktadha huu kina maana ya kuwaacha au kuwaweka watu fulani pamoja na Yakobo.
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: baadhi ya watu walio pamoja nami
  rationale: Neno מִן lina maana ya kuchukua sehemu kutoka katika kundi, hivyo ‘baadhi ya watu’ ni wazi na ya asili kwa Kiswahili.
- source_word: לָמָּה זֶּה
  choice: Kwa nini hivyo?
  rationale: Huhifadhi ufupi na hali ya swali la Kiebrania bila kulipanua kwa maelezo yasiyokuwamo.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: Na nipate kibali machoni pa bwana wangu
  rationale: Huhifadhi nahau ya Kiebrania ‘kupata kibali machoni pa’ na namna ya heshima ‘bwana wangu’; umbo la ombi linaendelezwa bila kulifanya dai la uhakika.
theological_decisions:
- issue: Utambulisho wa msemaji wa pili
  choice: Lakini Yakobo akasema
  alternative: Lakini akasema
  rationale: Kiebrania kinatumia kiwakilishi kisichotaja jina, lakini Yakobo ndiye msemaji anayeeleweka katika muktadha. Kutaja jina huondoa mkanganyiko wa Kiswahili bila kubadili maana.
- issue: Maana ya ombi la Yakobo kuhusu kibali
  choice: Na nipate kibali machoni pa bwana wangu
  alternative: Nimekwisha kupata kibali machoni pa bwana wangu
  rationale: Kitenzi אֶמְצָא ni umbo lisilokamilika linaloweza kusikika kama ombi au matakwa. Tafsiri haiongezi wazo la ukamilifu ambalo halijawekwa wazi katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo yamewekwa kwa lugha inayoeleweka kwa urahisi huku nahau muhimu ya Kiebrania ‘machoni pa’ ikihifadhiwa.
