lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akasema
  rationale: Waw mfululizo inaendeleza simulizi, huku “Lakini” ikionyesha utofauti wa upole katika jibu la Esau, anayekataa zawadi ya Yakobo.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: יֶשׁ לִי רָב
  choice: Mimi nina tele
  rationale: Nahau hii inaonyesha kuwa Esau ana mali nyingi. “Nina tele” ni Kiswahili cha kawaida kinachosisitiza wingi, bila kuipunguza maana kuwa utoshelevu tu.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: Inahifadhi umilikishi wa nafsi ya kwanza na hali ya ukaribu katika namna Esau anavyomwita Yakobo.
- source_word: יְהִי לְךָ אֲשֶׁר לָךְ
  choice: vilivyo vyako na viwe vyako
  rationale: Muundo wa kutakia/kuruhusu wa היה unawasilishwa kwa “na viwe,” na kishazi kizima kinaonyesha kwa kawaida kwamba Yakobo abaki na mali yake bila kuongeza wazi wazo la ‘kubaki’ lisilotajwa moja kwa moja.
