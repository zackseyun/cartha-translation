  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: sw
  text: “Tafadhali pokea zawadi yangu iliyoletwa kwako, kwa maana Mungu amenifadhili, na kwa maana nina kila kitu.” Yakobo akamsisitiza, naye Esau akaipokea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: zawadi yangu
  rationale: Neno hilo kwa kawaida humaanisha ‘baraka yangu,’ lakini katika muktadha huu linataja zawadi ambayo Yakobo anamtolea Esau; ‘zawadi yangu’ huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: חַנַּנִי
  choice: amenifadhili
  rationale: Huwasilisha tendo la Mungu la kumtendea Yakobo kwa neema na ukarimu bila kulifanya kuwa kauli ya dhehebu.
- source_word: יֶשׁ לִי כֹל
  choice: nina kila kitu
  rationale: Inafuata upana wa kauli ya Kiebrania na kudumisha utofauti wake na kauli ya Esau katika mstari wa 9.
- source_word: וַיִּפְצַר בּוֹ
  choice: Yakobo akamsisitiza
  rationale: Kitenzi kinaonyesha kusihi au kushinikiza kwa bidii; kutaja Yakobo huondoa utata wa viwakilishi katika Kiswahili.
- source_word: וַיִּקָּח
  choice: naye Esau akaipokea
  rationale: Katika muktadha Esau ndiye aliyekubali na kuipokea zawadi; majina yanawekwa wazi kwa uelewekevu wa kawaida.
theological_decisions:
- issue: Maana ya בִּרְכָתִי katika upatanisho wa Yakobo na Esau
  choice: zawadi yangu
  alternative: baraka yangu
  rationale: Ingawa ‘baraka’ ndiyo maana ya msingi na inaweza kuwa na mwangwi wa simulizi la awali, kitu kinacholetwa na kupokelewa hapa ni zawadi. Matini kuu inatanguliza maana ya kimuktadha bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tafadhali pokea’ ni ombi la kawaida lenye adabu; majina ya wahusika yametumiwa badala ya viwakilishi vyenye uwezekano wa kutatanisha.
