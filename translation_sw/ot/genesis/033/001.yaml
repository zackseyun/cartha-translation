translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi lenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania 'akainua macho yake' umehifadhiwa, huku 'akaona' likitumiwa kwa וַיַּרְא. Alama ya Kiebrania וְהִנֵּה haijatafsiriwa kwa 'tazama' ili kuepuka amri isiyo ya asili katika Kiswahili; athari yake ya kuvuta fikira imewasilishwa kwa mfuatano hai wa simulizi.
