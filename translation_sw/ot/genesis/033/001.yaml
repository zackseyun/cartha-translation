base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: sw
  text: Kisha Yakobo akainua macho yake[a], akaona, na tazama[b], Esau alikuwa anakuja, na pamoja naye walikuwa wanaume mia nne. Basi akawagawa watoto kati ya Lea, Raheli, na vijakazi wawili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatazama juu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “tazama,” alama hai ya kuvuta fikira kwa ujio wa Esau.
    reason: lexical_alternative
  - marker: c
    text: Au, “watumishi wa kike wawili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: akainua macho yake
  rationale: Nahau ya Kiebrania imehifadhiwa kwa Kiswahili cha kawaida na chenye hadhi; inaonyesha Yakobo akielekeza macho yake juu ili kutazama.
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi hiki kwa kawaida humaanisha kuona; baada ya 'akainua macho yake' kinatoa mfuatano wa asili bila kurudia wazo la kutazama.
- source_word: וְהִנֵּה
  choice: imewasilishwa kwa mpangilio hai wa sentensi, bila neno la moja kwa moja
  rationale: Kihisishi hiki huvuta fikira kwa jambo linaloonekana ghafla. Katika Kiswahili, 'tazama' hapa kingesikika kama amri kwa msomaji; uhai wake umebebwa na ufuatano wa 'akaona Esau anakuja.'
- source_word: בָּא
  choice: anakuja
  rationale: Umbo la participle linaonyesha Esau akiwa njiani na akikaribia, si kwamba tayari amefika.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: na pamoja naye walikuwa wanaume mia nne
  rationale: Inahifadhi wazo la Esau kuandamana na kundi kubwa na kuonyesha uwepo wao pamoja naye.
- source_word: וַיַּחַץ
  choice: akawagawa
  rationale: Hueleza kuwatenga au kuwapanga watoto katika makundi tofauti.
- source_word: הַיְלָדִים
  choice: watoto
  rationale: Hili ndilo neno la kawaida na wazi kwa watoto wa nyumba ya Yakobo.
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: kati ya Lea, Raheli, na wale vijakazi wawili
  rationale: עַל inayorudiwa inaonyesha watoto kugawanywa katika makundi yanayohusishwa na wanawake hao. 'Vijakazi' huonyesha watumishi wa kike wa nyumbani bila kuongeza dai maalumu kuhusu hali yao ya kisheria.
