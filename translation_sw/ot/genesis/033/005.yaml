base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: sw
  text: Akainua macho yake, akawaona wale wanawake na watoto, akasema, “Hawa walio pamoja nawe ni nani?”[a] Naye akasema, “Ni watoto ambao Mungu amemjalia mtumishi wako.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawa ni nani kwako?” Kirai cha Kiebrania ni cha kinahau na kinauliza utambulisho wa wale walio pamoja na Yakobo.
    reason: lexical_alternative
  - marker: b
    text: Au kwa urahisi, “Ni watoto ambao Mungu amempa mtumishi wako.” Kitenzi cha Kiebrania pia kina maana ya kuonyesha fadhili au neema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת־עֵינָיו
  choice: Akainua macho yake
  rationale: Inahifadhi nahau ya Kiebrania ya kuinua macho, yaani kutazama juu, huku ikibaki wazi na ya kawaida katika Kiswahili.
- source_word: וַיַּרְא
  choice: akawaona
  rationale: Kitenzi cha kuona kimeunganishwa kwa kawaida na wahusika wanaofuata; kiambishi -wa- kinawarejelea wanawake na watoto.
- source_word: הַנָּשִׁים
  choice: wale wanawake
  rationale: Neno la Kiebrania humaanisha ‘wanawake’; halijafanywa kuwa ‘wake’ ili kutoongeza uhusiano maalumu ambao haukutajwa moja kwa moja katika mstari.
- source_word: הַיְלָדִים
  choice: watoto
  rationale: Hili ndilo neno la kawaida na la asili katika muktadha huu kwa watoto au vijana wa familia.
- source_word: מִי אֵלֶּה לָּךְ
  choice: Hawa walio pamoja nawe ni nani?
  rationale: Kirai cha Kiebrania ni ‘Hawa ni nani kwako?’; tafsiri kuu inaeleza kwa Kiswahili cha kawaida swali kuhusu watu wanaoandamana na Yakobo, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: חָנַן
  choice: amemjalia
  rationale: ‘Kumjalia’ huwasilisha tendo la kutoa pamoja na wazo la fadhili au neema lililomo katika kitenzi cha Kiebrania, bila maelezo marefu yasiyo ya lazima.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hilo linamrejelea Mungu mmoja na kwa kawaida hutafsiriwa ‘Mungu’.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Hiki ni kijirejeleo cha heshima ambacho Yakobo anatumia anapozungumza na Esau; ‘mtumishi wako’ huhifadhi unyenyekevu huo bila kudokeza kwa lazima hali ya utumwa.
theological_decisions:
- issue: Wazo la fadhili za Mungu katika jibu la Yakobo
  choice: Watoto wanaelezwa kuwa wale ambao Mungu amemjalia mtumishi wake
  alternative: Watoto ambao Mungu amempa mtumishi wako
  rationale: Kitenzi חנן kina wazo la kuonyesha fadhili au neema; ‘amemjalia’ huhifadhi wazo hilo bila kuingiza mafundisho ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi ‘Akainua… akawaona… akasema’ huhifadhi mwendo wa simulizi la Kiebrania. ‘Naye akasema’ huacha utambulisho wa msemaji wa pili ueleweke kutokana na muktadha, kama ulivyo katika chanzo.
