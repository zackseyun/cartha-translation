lexical_decisions:
- source_word: מִי לְךָ
  choice: yana maana gani
  rationale: Katika muktadha huu, nahau hiyo inauliza kusudi au maana ya makundi yaliyotangulia, si utambulisho wake. Usemi huu ni wa kawaida katika Kiswahili na hauongezi kusudi mahususi lisilotajwa wazi.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: makundi haya yote
  rationale: Ingawa מַחֲנֶה iko katika umoja na mara nyingi humaanisha “kambi,” hapa inaelekea kurejelea mkusanyiko mzima wa makundi ya mifugo na watumishi ambao Yakobo aliwatanguliza. Wingi wa Kiswahili unaeleweka kwa urahisi katika muktadha huu.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: niliyokutana nayo
  rationale: Huwasilisha moja kwa moja maana ya Esau kukutana njiani na makundi yaliyotangulizwa.
- source_word: לִמְצֹא חֵן
  choice: ili nipate kibali
  rationale: Muundo wa kitenzi-jina unaonyesha kusudi. “Kupata kibali” ni Kiswahili cha kawaida kinachowasilisha kutaka mtazamo mwema wa mwingine.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Inahifadhi taswira ya nahau ya Kiebrania, huku maana yake ya kuwa na kibali kwa mtu ikibaki wazi katika Kiswahili.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa ni namna ya Yakobo kumheshimu Esau, wala si jina la Mungu. “Bwana wangu” huhifadhi heshima na tofauti ya hadhi iliyomo katika usemi.
