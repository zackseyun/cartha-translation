translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji huku ukihifadhi mfuatano wa simulizi na utata wa neno la kale kesita. Alama ya tanbihi imewekwa baada ya ‘kesita mia moja,’ ambako neno linalofafanuliwa linatokea.
