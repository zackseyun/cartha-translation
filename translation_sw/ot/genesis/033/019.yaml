  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: sw
  text: Naye akanunua sehemu ya shamba ambako alikuwa amepiga hema yake kutoka kwa wana wa Hamori, baba ya Shekemu, kwa kesita mia moja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kesita; kipimo au kitu cha malipo cha kale ambacho thamani yake kamili haijulikani. Kwa kawaida limetafsiriwa kwa njia mbalimbali, kama vile ‘vipande vya pesa.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: akanunua
  rationale: Katika muktadha wa shughuli ya ardhi, קנה humaanisha kununua; umbo la simulizi linaendelezwa kwa kitenzi ‘akanunua.’
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: sehemu ya shamba
  rationale: חֶלְקָה ni sehemu au kipande maalumu cha ardhi; ‘sehemu ya shamba’ ni ya asili na haiongezi maelezo yasiyomo katika Kiebrania.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: ambako alikuwa amepiga hema yake
  rationale: נטה pamoja na אֹהֶל ni nahau ya kupiga hema; ‘alikuwa amepiga’ huonyesha kuwa tendo hilo lilitangulia ununuzi.
- source_word: מִיַּד
  choice: kutoka kwa
  rationale: Ingawa maana ya neno kwa neno ni ‘kutoka mkononi mwa,’ hapa nahau hiyo huonyesha wale ambao ardhi ilinunuliwa kwao; ‘kutoka kwa’ ni Kiswahili cha kawaida kisichopotosha.
- source_word: בְּנֵי חֲמוֹר
  choice: wana wa Hamori
  rationale: Huhifadhi uhusiano wa ukoo unaoelezwa na muundo wa Kiebrania, kwa kutumia umbo la jina lililozoeleka katika Kiswahili.
- source_word: אֲבִי שְׁכֶם
  choice: baba ya Shekemu
  rationale: Kirai hiki kinamtambulisha Hamori kuwa baba ya mtu aitwaye Shekemu, huku kikihifadhi apposition ya Kiebrania.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: kwa kesita mia moja
  rationale: קְשִׂיטָה ni kipimo au kitu cha malipo cha kale ambacho thamani yake kamili haijulikani; kulitohoa kama ‘kesita’ huepuka usahihi wa bandia.
