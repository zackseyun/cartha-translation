base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: sw
  text: Tafadhali, bwana wangu apite mbele ya mtumishi wake, nami nitasafiri polepole, kwa mwendo wa mifugo iliyo mbele yangu na kwa mwendo wa watoto, mpaka nitakapomjia bwana wangu huko Seiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: Tafadhali, ... atangulie
  rationale: Kauli ya ombi pamoja na נָא inaonyesha ombi la heshima; “atangulie” pia hudokeza kwenda mbele.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ambayo Yakobo anatumia kumwita Esau, bila maana ya kimungu katika muktadha huu.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: mbele ya mtumishi wake
  rationale: Inahifadhi taswira ya mahali na namna ya Yakobo kujitaja kwa unyenyekevu katika nafsi ya tatu.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: nitasafiri polepole
  rationale: Kitenzi cha Kiebrania kinaonyesha kusonga kwa uangalifu au kwa utaratibu; Kiswahili hiki ni cha kawaida na hakilazimishi maana ya kuwaongoza wengine.
- source_word: לְרֶגֶל
  choice: kwa mwendo wa
  rationale: Nahau ya Kiebrania, kihalisi “kwa mguu wa,” humaanisha kurekebisha mwendo kulingana na kasi ya wengine.
- source_word: הַמְּלָאכָה
  choice: mifugo
  rationale: Ingawa neno hilo mara nyingi humaanisha kazi, mali, au milki, katika mazingira haya ya kichungaji linaelekea kurejelea wanyama wanaosafirishwa.
- source_word: אֲשֶׁר לְפָנַי
  choice: iliyo mbele yangu
  rationale: Inafuata moja kwa moja maelezo ya mahali katika Kiebrania bila kuongeza dhana ya umiliki au uangalizi.
- source_word: הַיְלָדִים
  choice: watoto
  rationale: Neno hilo linawarejelea watoto wa Yakobo; “watoto” ni sahihi na ya kawaida katika Kiswahili cha sasa.
- source_word: עַד אֲשֶׁר אָבֹא
  choice: mpaka nitakapomjia
  rationale: Inaonyesha mpaka wa wakati na kuja kwa mtu anayelengwa.
- source_word: שֵׂעִירָה
  choice: huko Seiri
  rationale: He ya uelekeo inaonyesha kuelekea Seiri; “huko Seiri” huunganisha kwa kawaida mahali na kumjia Esau.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa urahisi. Marudio ya “bwana wangu” na kujitaja kama “mtumishi wake” yamehifadhiwa ili kuonyesha adabu ya Yakobo. Hakuna tanbihi iliyohitajika; utata wa אֶתְנָהֲלָה umehifadhiwa kwa “nitasafiri,” na maana ya kimuktadha ya הַמְּלָאכָה imetolewa kama “mifugo.”
