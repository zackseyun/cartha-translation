  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: sw
  text: Lea pia akakaribia[a] pamoja na watoto wake, nao wakainama[b]. Baadaye Yosefu na Raheli wakakaribia, nao wakainama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akasogea karibu”; kitenzi hicho pia hutumika kwa Yosefu na Raheli.
    reason: lexical_alternative
  - marker: b
    text: Au “walisujudu”; kitenzi cha Kiebrania kinaweza kumaanisha kuinama kwa kina kwa heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: akakaribia / wakakaribia
  rationale: Kitenzi נגשׁ kinaonyesha kusogea au kuja karibu. “Kukaribia” ni Kiswahili cha kawaida kinachohifadhi mwendo kuelekea kwa Esau bila kuongeza maelezo yasiyokuwapo.
- source_word: גַּם
  choice: pia
  rationale: Neno גַּם linaonyesha kuwa Lea na watoto wake ni kundi jingine katika mfuatano wa waliomjia Esau.
- source_word: וִילָדֶיהָ
  choice: pamoja na watoto wake
  rationale: יְלָדִים ni neno pana kwa watoto, si wana wa kiume pekee. “Pamoja na” linaunganisha watoto na kitendo cha Lea kwa Kiswahili cha kawaida huku likihifadhi umoja wa kitenzi cha Kiebrania.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: wakasujudu
  rationale: Kitenzi שׁחה hapa kinaonyesha kuinama kwa unyenyekevu na heshima. “Kusujudu” linafaa katika simulizi hili na haliongezi mtendwa ambaye Kiebrania hakumtaji wazi katika aya hii.
- source_word: וְאַחַר
  choice: Baadaye
  rationale: “Baadaye” linaonyesha wazi hatua inayofuata katika mfuatano wa makundi.
- source_word: יוֹסֵף וְרָחֵל
  choice: Yosefu na Raheli
  rationale: Mpangilio wa majina katika Kiebrania umehifadhiwa.
theological_decisions:
- issue: Maana ya tendo la וַיִּשְׁתַּחֲוּ
  choice: wakasujudu
  alternative: wakainama chini
  rationale: Tafsiri inahifadhi tendo la heshima kuu bila kulieleza moja kwa moja kuwa ibada ya kidini; uwezekano wa kuelewa tendo hilo kama kuinama umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa leo, unahifadhi mpangilio wa simulizi na mpangilio wa majina ya Kiebrania, na huepuka kuongeza kwamba walimsujudia Esau ingawa muktadha unaelekeza kwake.
