  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: sw
  text: Kisha wale watumishi wa kike na watoto wao wakakaribia na kuinama[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumwa wa kike”; neno la Kiebrania humaanisha watumishi wanawake ambao katika jamii hiyo wangeweza kuwa watumwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kusujudu,” yaani kuinama chini sana kwa ishara ya heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: wakakaribia
  rationale: Kitenzi נגשׁ katika mfululizo wa simulizi kinaonyesha kusogea karibu; “wakakaribia” ni Kiswahili cha kawaida na huhifadhi hatua hiyo ya simulizi.
- source_word: הַשְּׁפָחוֹת
  choice: wale watumishi wa kike
  rationale: שִׁפְחָה humaanisha mtumishi mwanamke, na katika mazingira ya kale angeweza kuwa mtumwa. “Watumishi wa kike” huonyesha jinsia kwa uwazi bila kutumia lugha ya kizamani wala kuamua zaidi ya mstari unavyosema.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: na watoto wao
  rationale: 'Kiwakilishi huru הֵנָּה kinawarejelea watumishi hao kwa msisitizo, huku וְיַלְדֵיהֶן ikiwa “na watoto wao.” Kiswahili cha kawaida huunganisha kundi lote kama kiima: “wale watumishi wa kike na watoto wao.”'
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: kuinama
  rationale: Kitenzi hiki huonyesha kuinama chini kwa heshima au kutoa heshima. “Kuinama” ni cha asili katika Kiswahili; dokezo linaeleza kwamba tendo hilo lingeweza kuwa kusujudu.
