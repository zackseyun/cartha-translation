lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Akawaweka
  rationale: Kitenzi שׂוּם humaanisha kuweka au kupanga; hapa kinaeleza Yakobo alivyowapanga watu kwa nafasi.
- source_word: הַשְּׁפָחוֹת
  choice: wajakazi
  rationale: שִׁפְחָה humaanisha mtumishi wa kike mwenye hadhi ya chini katika nyumba, na wakati mwingine inaweza kumaanisha mwanamke mtumwa. 'Wajakazi' ni neno la heshima na linaloeleweka katika Kiswahili cha Biblia bila kuficha kabisa hadhi yao ya chini.
- source_word: יַלְדֵיהֶן
  choice: watoto wao
  rationale: Neno יֶלֶד hapa ni la ujumla na halimaanishi wana wa kiume pekee.
- source_word: רִאשֹׁנָה
  choice: mbele
  rationale: Umbo hili linaonyesha nafasi ya kwanza katika mpangilio; katika muktadha wa kukutana na Esau, 'mbele' linaonyesha vizuri nafasi ya kundi.
- source_word: לֵאָה
  choice: Lea
  rationale: Jina limetolewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: אַחֲרֹנִים
  choice: nyuma yao
  rationale: Katika kundi la pili, neno linaonyesha kuwa Lea na watoto wake waliwekwa baada ya kundi la kwanza, si kwamba walikuwa wa mwisho kabisa.
- source_word: רָחֵל
  choice: Raheli
  rationale: Jina limetolewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina limetolewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: אַחֲרֹנִים
  choice: mwisho
  rationale: Katika kundi la tatu na la mwisho, neno linaonyesha nafasi yao ya mwisho katika mpangilio.
