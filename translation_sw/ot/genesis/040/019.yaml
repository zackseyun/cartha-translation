base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: sw
  text: Katika siku tatu zijazo, Farao atainua kichwa chako kutoka juu yako[a], kisha atakutundika juu ya mti[b], na ndege watakula nyama yako kutoka juu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “atainua kichwa chako kutoka juu yako”; huenda huu ni mchezo wa maneno wa kutisha unaotumia usemi uleule uliotumiwa kwa maana njema katika ufafanuzi wa ndoto ya mnyweshaji. Hapa inadokezwa kwamba kichwa kitaondolewa.
    reason: lexical_alternative
  - marker: b
    text: Au, “atakutundika kwenye mbao” au “atakuchomeka kwenye nguzo.” Kwa Kiebrania, “juu ya mti.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Baada ya siku tatu zaidi
  rationale: Huwasilisha kwa Kiswahili cha kawaida muda uliobaki kabla ya tukio, bila kutumia muundo wa kizamani.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: atakiinua kichwa chako kutoka juu yako
  rationale: Huhifadhi nahau ya Kiebrania na mchezo wake wa maneno unaogeuza kwa namna ya kutisha usemi uleule uliotumiwa kwa maana njema katika mstari wa 13; kirai kinachofuata hudokeza kuondolewa kwa kichwa.
- source_word: וְתָלָה אוֹתְךָ עַל עֵץ
  choice: kisha atakutundika juu ya mti
  rationale: תלה ni ‘tundika/ning’iniza,’ na עֵץ ni ‘mti’ au ‘mbao.’ Tafsiri hii huhifadhi taswira ya msingi bila kuamua kimya kimya kama adhabu ilikuwa kutundikwa au kutundikwa kwa kuchomekwa kwenye nguzo.
- source_word: וְאָכַל הָעוֹף
  choice: na ndege wataila
  rationale: עוֹף ni nomino ya umoja yenye maana ya jamii; wingi ‘ndege’ ni wa kawaida katika Kiswahili. ‘Kula’ hudumisha maana ya moja kwa moja ya אכל bila kuiongeza kupita kiasi.
- source_word: אֶת בְּשָׂרְךָ
  choice: nyama yako
  rationale: ‘Nyama’ ni neno la kawaida na halisi kwa בשר katika muktadha wa mwili, nalo huhifadhi ukali wa taswira kuliko ‘mwili.’
- source_word: מֵעָלֶיךָ
  choice: kutoka juu yako
  rationale: Marudio yamehifadhiwa kama yalivyo katika Kiebrania, yakionyesha ndege wakiondoa nyama kutoka kwenye mwili uliotundikwa.
theological_decisions:
- issue: Kuhifadhi nahau na ukali wa taswira ya hukumu bila kuifafanua kupita chanzo
  choice: Kudumisha ‘atakiinua kichwa chako kutoka juu yako’ na ‘atakutundika juu ya mti.’
  alternative: ‘Farao atakukata kichwa na kuutundika mwili wako kwenye nguzo.’
  rationale: Tafsiri mbadala inaeleza maana inayowezekana wazi zaidi, lakini huondoa nahau na mwangwi wa kifasihi wa mstari wa 13, na pia huamua aina mahususi ya kifaa cha kunyongea. Chaguo hili huhifadhi utata na kejeli ya simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo usio wa kawaida kidogo ‘kutoka juu yako’ umehifadhiwa kwa sababu una uzito wa kifasihi katika Kiebrania; tanbihi husaidia kuufafanua. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
