  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: sw
  text: Yosefu akaja kwao asubuhi, akawaona, na tazama, walikuwa wamefadhaika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wamesononeka,” “wamehuzunika,” au “wamekunja nyuso.” Neno la Kiebrania linaeleza hali ya kufadhaika au kusononeka iliyoonekana wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: akaja kwao
  rationale: Kitenzi בוא pamoja na אֲלֵיהֶם kinaonyesha mwendo kuelekea kwa wafungwa; “akaja kwao” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo bila kuongeza wazo la kuingia mahali.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Hiki ni kirai cha wakati; “asubuhi” ni tafsiri ya kawaida, fupi na sahihi katika simulizi.
- source_word: וַיַּרְא אֹתָם
  choice: akawaona
  rationale: ראה ikiwa na yambwa wa moja kwa moja ina maana ya kuona; “akawaona” huhifadhi mfuatano wa matendo bila kuifanya iwe ‘akawatazama’ au ‘akawachunguza.’
- source_word: וְהִנָּם
  choice: na tazama
  rationale: Neno la uwasilishaji הִנֵּה pamoja na kiambishi linavuta fikira kwenye hali ambayo Yosefu aliiona. “Na tazama” huhifadhi msisitizo huo wa kisimulizi.
- source_word: זֹעֲפִים
  choice: walikuwa wamefadhaika
  rationale: Kivumishi hiki kinaeleza hali ya nje inayoonyesha kuvurugika au kusononeka. “Wamefadhaika” huhifadhi maana pana ya taabu ya kihisia bila kuibana kuwa hasira au huzuni peke yake.
