  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: sw
  text: Kwa maana kwa hakika nilitekwa kutoka nchi ya Waebrania,[a] na hata hapa sikufanya jambo lolote la kunifanya niwekwe shimoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hakika niliibwa” au “niliibwa na kuondolewa.” Kiebrania hutumia kitenzi-jina cha mkazo pamoja na kitenzi kikuu ili kutia msisitizo.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “shimo” linaweza kumaanisha shimo la gereza au chumba cha gereza.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa Yusufu anatoa sababu au maelezo kwa ombi lake katika muktadha.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: kwa hakika nilitekwa
  rationale: Muundo wa kitenzi-jina halisi pamoja na kitenzi kilichokamilika unasisitiza tendo. “Nilitekwa” ni Kiswahili cha kawaida kwa mtu aliyechukuliwa kwa nguvu, huku “kwa hakika” ikihifadhi msisitizo wa Kiebrania.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: kutoka nchi ya Waebrania
  rationale: Inahifadhi jina la kikabila bila kudai kuwa eneo hilo lilikuwa dola yenye mipaka maalumu.
- source_word: וְגַם פֹּה
  choice: na hata hapa
  rationale: 'Inahifadhi msisitizo wa nyongeza: licha ya kutekwa kwake, Yusufu pia hakuwa na hatia huko Misri.'
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: sikufanya jambo lolote
  rationale: Ni usemi wa kawaida unaohifadhi ukanushaji kamili wa Yusufu.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: la kunifanya niwekwe
  rationale: Kwa Kiswahili, muundo huu unaeleza kwa kawaida kuwa hakufanya jambo ambalo lingetoa sababu ya kufungwa kwake, bila kuongeza shtaka mahsusi lisilotajwa.
- source_word: בַּבּוֹר
  choice: shimoni
  rationale: Neno בּוֹר kimsingi ni shimo au kisima; hapa linarejelea mahali pa kifungo. “Shimoni” huhifadhi taswira ya Kiebrania, huku tanbihi ikifafanua maana ya kimuktadha.
