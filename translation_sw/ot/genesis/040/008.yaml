base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: sw
  text: Wakamwambia, “Tumeota ndoto, na hakuna mtu wa kuifasiri.” Yosefu akawaambia, “Je, tafsiri si za Mungu? Tafadhali, nisimulieni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: Tumeota ndoto
  rationale: Kiebrania kinatumia nomino na kitenzi vya mzizi mmoja, kihalisi ‘ndoto tumeota.’ Kiswahili ‘tumeota ndoto’ ni cha kawaida na kinadumisha uhusiano huo wa kileksia pamoja na umuhimu wa ndoto hiyo kwa wakati huu.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: lakini hakuna mtu wa kuifasiri
  rationale: Kishiriki פֹתֵר humaanisha mfasiri au mtu anayefasiri. Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba hakuna mfasiri anayepatikana, bila kuongeza dai kwamba hakuna yeyote mwenye uwezo kabisa.
- source_word: הֲלוֹא
  choice: Je, ... si
  rationale: Chembe hii huanzisha swali la balagha linalotarajia kukubaliwa. ‘Je, ... si’ huhifadhi nguvu hiyo kwa Kiswahili sanifu.
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: tafsiri si za Mungu
  rationale: Kihusishi ל־ kinaonyesha kuwa tafsiri ni za Mungu au hutoka kwake. Usemi ‘za Mungu’ ni mfupi, wa asili, na hauamui kupita kiasi kati ya umiliki na chanzo.
- source_word: פִּתְרֹנִים
  choice: tafsiri
  rationale: Neno la Kiebrania ni la wingi, lakini ‘tafsiri’ katika Kiswahili lina umbo lilelile katika umoja na wingi; muktadha wa ndoto zao mbili unawezesha maana ya wingi.
- source_word: סַפְּרוּ נָא לִי
  choice: Tafadhali, nisimulieni ndoto zenu
  rationale: סַפְּרוּ ni amri ya wingi, נָא huonyesha ombi la adabu, na לִי ni ‘kwangu.’ Kitu kinachosimuliwa hakitajwi wazi katika Kiebrania; ‘ndoto zenu’ hukiweka wazi kwa kawaida kutokana na muktadha bila kukichanganya na ‘tafsiri.’
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo na matumizi mapana ya Biblia ya Kiswahili.
theological_decisions:
- issue: Rejeo la אֱלֹהִים katika kauli ya Yosefu
  choice: Mungu
  alternative: mungu fulani / miungu
  rationale: Katika simulizi la Yosefu, kauli hii inamhusu Mungu ambaye ndiye mwenye au chanzo cha tafsiri za ndoto. Muktadha hauonyeshi mjadala wa jumla kuhusu miungu mingi.
- issue: Maana ya tafsiri kuwa ‘za Mungu’
  choice: tafsiri si za Mungu
  alternative: Mungu ndiye anayetoa tafsiri
  rationale: Muundo uliochaguliwa huhifadhi upana wa Kiebrania kuhusu umiliki au chanzo, badala ya kuufanya kwa lazima kuwa kauli kuhusu utoaji pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Aya imetumia swali la balagha la kawaida na imeepuka lugha ya kimadhehebu. Hakuna tanbihi inayohitajika; tofauti za muundo wa Kiebrania zinaweza kuwasilishwa kwa uwazi katika tafsiri yenyewe.
