base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: sw
  text: Ikawa kwamba siku ya tatu, siku ya kuzaliwa kwa Farao, aliwaandalia watumishi wake wote karamu; naye aliinua kichwa cha mkuu wa wanyweshaji na cha mkuu wa waokaji[a] kati ya watumishi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya kimuktadha, inaweza kutafsiriwa “aliwatenga” au “aliwatambua.” Kiebrania husema kihalisi, “aliinua kichwa cha.” Nahau hiyo imehifadhiwa hapa kwa sababu simulizi linalozunguka mstari huu linaitumia kwa matokeo mawili tofauti kwa maafisa hao wawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Ikawa siku ya tatu
  rationale: Muundo huu unaendeleza mfululizo wa simulizi na kuhifadhi kishazi cha wakati bila kutumia lugha nzito isiyo ya kawaida.
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: siku ya kuzaliwa kwa Farao
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya siku ya kuadhimisha kuzaliwa kwa Farao.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: Akawaandalia karamu
  rationale: מִשְׁתֶּה ni karamu, mara nyingi yenye kunywa; 'akawaandalia karamu' ni Kiswahili cha kawaida kinachoonyesha kuwa Farao ndiye aliyeifanya kwa ajili yao.
- source_word: לְכָל עֲבָדָיו
  choice: watumishi wake wote
  rationale: Katika mazingira ya jumba la kifalme, neno hili linawahusu kwa upana watumishi na maafisa wa Farao; 'watumishi' halilazimishi maana ya utumwa ambayo si hoja kuu hapa.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: akakiinua kichwa cha
  rationale: Nahau ya Kiebrania imehifadhiwa ili kudumisha mchezo wa maneno unaounganisha mstari huu na matokeo mawili tofauti katika mistari 13 na 19.
- source_word: שַׂר הַמַּשְׁקִים
  choice: mkuu wa wanyweshaji
  rationale: Ni cheo cha afisa aliyesimamia huduma ya vinywaji katika jumba la kifalme; tafsiri hii ni wazi na inafaa mazingira hayo.
- source_word: שַׂר הָאֹפִים
  choice: mkuu wa waokaji
  rationale: Ni cheo sambamba cha afisa aliyesimamia waokaji.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: kati ya watumishi wake
  rationale: Kishazi hiki kinaonyesha kuwa tendo hilo lilifanyika miongoni mwa watumishi wa kifalme.
