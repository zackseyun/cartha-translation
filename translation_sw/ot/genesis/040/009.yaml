translation:
  language: sw
  text: Basi mnyweshaji mkuu akamsimulia Yosefu ndoto yake, akamwambia, “Katika ndoto yangu, tazama[a], mzabibu ulikuwa mbele yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika ndoto yangu kulikuwa na mzabibu mbele yangu.” Kiebrania kinatumia neno la kuvuta fikira, “tazama” (וְהִנֵּה), ili kuitambulisha picha ya ndoto kwa msisitizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: akamsimulia
  rationale: Kitenzi ספר katika piel humaanisha kusimulia au kueleza; “akamsimulia” ni Kiswahili cha kawaida na huonyesha aliyesimuliwa kupitia kiambishi -m-.
- source_word: שַׂר הַמַּשְׁקִים
  choice: mkuu wa wanyweshaji
  rationale: Kirai hiki kinamtaja afisa mkuu aliyesimamia wahudumu wa vinywaji vya mfalme; tafsiri hii ni wazi na huepuka neno la kale lisiloeleweka kwa urahisi.
- source_word: אֶת חֲלֹמוֹ
  choice: ndoto yake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume ina maana ya moja kwa moja ya “ndoto yake.”
- source_word: לְיוֹסֵף
  choice: Yosefu
  rationale: Katika muundo “akamsimulia Yosefu,” kiambishi -m- pamoja na jina Yosefu huwasilisha kwa kawaida maana ya Kiebrania “kwa Yosefu.”
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: Kitenzi hiki cha Kiswahili kinajumuisha tendo la kusema na yule anayeambiwa, hivyo kinahifadhi לוֹ kwa lugha ya kawaida.
- source_word: בַּחֲלוֹמִי
  choice: Katika ndoto yangu
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kirai kinachoanzisha maelezo ya ndoto.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: “Tazama” huhifadhi alama ya kuvuta fikira na uhai wa picha ya ndoto bila kuibadili tu kuwa kauli ya kuwapo.
- source_word: גֶפֶן
  choice: mzabibu
  rationale: גֶפֶן humaanisha mzabibu; “mzabibu” ni neno mahususi na la kawaida katika Kiswahili.
- source_word: לְפָנַי
  choice: ulikuwa mbele yangu
  rationale: Kirai kinamaanisha “mbele yangu”; kitenzi “ulikuwa” kinaongezwa ili sentensi iwe kamili na ya asili katika Kiswahili.
