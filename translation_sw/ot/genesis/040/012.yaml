  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: sw
  text: 'Ndipo Yosefu akamwambia, “Hii ndiyo tafsiri yake: yale matawi[a] matatu ni siku tatu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matawi ya mzabibu” au “mikunjo”; neno la Kiebrania lililotafsiriwa “matawi” linaweza kuwa na maana hizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa usimulizi unaendeleza tukio kwa mpangilio; ‘Ndipo’ pamoja na kitenzi cha masimulizi ni Kiswahili cha kawaida na huhifadhi mfuatano huo.
- source_word: לוֹ
  choice: akamwambia
  rationale: Kiambishi ‘-mw-’ kinahifadhi wazi mtendewa wa kiume aliyeonyeshwa na kiwakilishi cha Kiebrania bila kuongeza jina lake.
- source_word: פִּתְרֹנוֹ
  choice: tafsiri yake
  rationale: Katika muktadha huu neno linahusu kufafanuliwa kwa ndoto; ‘tafsiri’ ni sahihi na ya kawaida, na ‘yake’ huhifadhi kiambishi cha umilikishi.
- source_word: שְׁלֹשֶׁת
  choice: matatu / tatu
  rationale: Kurudiwa kwa namba katika Kiebrania kumehifadhiwa ili kudumisha muundo wa kufananisha ishara na maana yake.
- source_word: הַשָּׂרִגִים
  choice: yale matawi
  rationale: Neno linaweza kumaanisha matawi, machipukizi, au mikunjo ya mzabibu; ‘matawi’ ni wazi na la kawaida katika taswira ya mzabibu bila kubainisha kupita kiasi.
- source_word: יָמִים
  choice: siku
  rationale: Ni nomino ya kawaida ya wakati na imefasiriwa moja kwa moja kwa kuwa ishara inalinganishwa na kipindi cha siku.
- source_word: הֵם
  choice: ni
  rationale: Kiwakilishi huru kinatilia mkazo ulinganifu wa kiarifu; katika Kiswahili ulinganifu huo huwasilishwa kwa kawaida na ‘ni’.
