lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: akawakasirikia
  rationale: Kitenzi קצף huonyesha hasira. Muundo huu ni wa kawaida katika simulizi la Kiswahili na unaonyesha kwamba hasira ya Farao iliwaelekea watu hao bila kuzidisha ukali wake.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: שְׁנֵי סָרִיסָיו
  choice: maafisa wake wawili
  rationale: סָרִיס inaweza kumaanisha afisa wa ikulu au towashi. Kwa kuwa hapa watu hao wanatajwa kwa vyeo vyao vya kikazi, “maafisa” linafaa bila kudai hali yao ya kimwili.
- source_word: שַׂר הַמַּשְׁקִים
  choice: mkuu wa wanyweshaji
  rationale: שַׂר humaanisha mkuu, na הַמַּשְׁקִים ni wale wanaotoa kinywaji. Tafsiri hii ni fupi, inayoeleweka, na inahifadhi cheo cha kazi.
- source_word: שַׂר הָאֹפִים
  choice: mkuu wa waokaji
  rationale: Neno שַׂר humtaja kiongozi wa kundi, na הָאֹפִים ni waokaji; hivyo tafsiri hii inahifadhi maana na muundo wa cheo.
- source_word: עַל ... עַל ... וְעַל
  choice: akawakasirikia ...—... na ...
  rationale: עַל inayofuata kitenzi cha hasira hutaja waliolengwa na hasira. Kiambishi “-wa-” katika “akawakasirikia” kinawajumuisha maafisa hao wawili, na mstari mrefu unaonyesha kwamba vyeo vinavyofuata vinawatambulisha maafisa hao.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. “Maafisa” ni la kisasa na la kawaida, huku vyeo “mkuu wa wanyweshaji” na “mkuu wa waokaji” vikihifadhi mazingira ya ikulu. Mstari mrefu unaweka vyeo hivyo katika uhusiano wa ufafanuzi na “maafisa wake wawili” bila kuongeza “yaani” isiyopo wazi katika Kiebrania.
