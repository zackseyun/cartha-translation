  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: sw
  text: Mkuu wa waokaji alipoona kwamba Yosefu alikuwa amefasiri vizuri, akamwambia Yosefu, “Mimi pia niliota ndoto. Tazama, juu ya kichwa changu kulikuwa na vikapu vitatu vya mikate myeupe[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vikapu vitatu vya vitu vilivyookwa.” Maana ya neno la Kiebrania חֹרִי haina uhakika; huenda linaeleza yaliyomo kuwa mikate au maandazi meupe, au vikapu kuwa vya kusokotwa au vyenye matundu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: mkuu wa waokaji
  rationale: Neno שַׂר linaonyesha mkuu au afisa mwenye mamlaka, na הָאֹפִים ni waokaji. Kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: כִּי טוֹב פָּתָר
  choice: kwamba Yosefu alikuwa amefasiri vizuri
  rationale: Muundo huu unaonyesha kwamba tafsiri ilionekana kuwa nzuri au imefanywa kwa ustadi. Jina Yosefu limetajwa ili kuepuka utata wa kiima katika Kiswahili bila kuifanya maana kuwa ‘ya kupendeza’ pekee.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: Mimi pia niliota ndoto
  rationale: Kirai cha Kiebrania ni cha mkato, lakini katika muktadha kinaanzisha simulizi ya ndoto ya mwokaji. Tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo la kujiunga na msimulizi wa awali.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Hiki ni kiashiria cha mazungumzo kinacholeta picha ya ndoto kwa uhai. ‘Tazama’ ni cha heshima, kinaeleweka, na kinahifadhi msisitizo huo.
- source_word: שְׁלֹשָׁה סַלֵּי
  choice: vikapu vitatu
  rationale: Huu ndio maana ya moja kwa moja ya kirai cha idadi na nomino katika hali ya muunganiko.
- source_word: חֹרִי
  choice: vya mikate myeupe
  rationale: Neno hili ni gumu na huenda likaeleza yaliyomo kuwa mikate au maandazi meupe, au likaeleza vikapu kuwa vya kusokotwa au vyenye matundu. Maana ya kimapokeo inayohusiana na mikate imewekwa katika matini, huku utata wa kileksika ukihifadhiwa katika tanbihi.
- source_word: עַל רֹאשִׁי
  choice: juu ya kichwa changu
  rationale: Hii ni tafsiri wazi na ya asili ya mahali pa vikapu.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: ‘Yosefu’ ni umbo lililozoeleka katika Kiswahili Sanifu na linaakisi jina la Kiebrania kwa uwazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. ‘Tazama’ limetumiwa kuhifadhi uhai wa simulizi la ndoto, na tanbihi inalinda utata halisi wa חֹרִי.
