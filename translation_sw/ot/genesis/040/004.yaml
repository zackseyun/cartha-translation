  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: sw
  text: Basi mkuu wa walinzi akamweka Yosefu awe pamoja nao[a], naye akawahudumia. Wakakaa kizuizini kwa muda fulani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamteua Yosefu awasimamie.” Kitenzi cha Kiebrania kinaweza kumaanisha kumteua mtu kwa jukumu; uhusiano wa Yosefu na wafungwa hao unaweza kueleweka kuwa wa kuwahudumia au kuwasimamia.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wakawa siku kizuizini,” nahau ya Kiebrania inayomaanisha kwamba walikaa huko kwa kipindi fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: akamweka
  rationale: Kitenzi פקד hapa kinaonyesha kumpa mtu jukumu au kumweka katika nafasi fulani. “Akamweka” ni cha kawaida katika Kiswahili na, pamoja na maelezo ya chini, hakifungi maana kuwa huduma tu au usimamizi tu.
- source_word: שַׂר הַטַּבָּחִים
  choice: mkuu wa walinzi
  rationale: Ingawa jina hili kihalisi linahusiana na wachinjaji au watekelezaji wa hukumu, katika muktadha wa Mwanzo linamtaja afisa mkuu mwenye wajibu wa ulinzi wa kifalme na mambo ya gereza. “Mkuu wa walinzi” ni tafsiri ya asili na inayoeleweka.
- source_word: אֶת יוֹסֵף אִתָּם
  choice: Yosefu awe pamoja nao
  rationale: Kirai hiki kinamweka Yosefu katika uhusiano na wafungwa hao bila kuamua kwa lazima kama alikuwa mhudumu wao au msimamizi wao.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: naye akawahudumia
  rationale: שרת humaanisha kutumikia au kuhudumia. “Akawahudumia” ni Kiswahili cha sasa kinachofaa katika mazingira haya na hakina lazima maana maalumu ya kidini.
- source_word: וַיִּהְיוּ יָמִים
  choice: Wakakaa ... kwa muda fulani
  rationale: Usemi wa Kiebrania, kihalisi “wakawa siku,” ni nahau inayoonyesha kwamba walibaki huko kwa kipindi kisichotajwa.
- source_word: בְּמִשְׁמָר
  choice: kizuizini
  rationale: מִשְׁמָר huonyesha hali ya kuwekwa chini ya ulinzi au kizuizi. “Kizuizini” huhifadhi wazo hilo bila kulazimisha neno kuwa jengo la gereza pekee.
