lexical_decisions:
- source_word: וְאֵת
  choice: Lakini akam-
  rationale: Kiunganishi kinaonyesha tofauti na aya iliyotangulia, ambamo mkuu wa wanyweshaji alirudishwa katika cheo chake. Alama ya yambwa ya Kiebrania imewakilishwa kwa kawaida ndani ya kiambishi cha yambwa cha Kiswahili.
- source_word: שַׂר הָאֹפִים
  choice: mkuu wa waokaji
  rationale: שַׂר humaanisha mkuu au afisa mwenye mamlaka; katika mazingira ya ikulu, ‘mkuu wa waokaji’ ni usemi wa kawaida na sahihi.
- source_word: תָּלָה
  choice: akamtundika
  rationale: Kitenzi hiki kimsingi humaanisha kutundika. Tafsiri hii inahifadhi upana wake bila kuamua kimyakimya ikiwa lilikuwa tendo la kunyonga, kutundika baada ya kuuawa, au aina nyingine ya kuonyesha mwili.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Usemi huu unaonyesha kwamba tukio lilitokea sawasawa na fasiri ya Yosefu.
- source_word: פָּתַר
  choice: alivyokuwa amewafasiria
  rationale: Katika muktadha wa ndoto, פתר humaanisha kufasiri. Muundo huu unaonyesha kuwa fasiri ilitangulia kutimia kwake.
- source_word: לָהֶם
  choice: -wa-
  rationale: Kiwakilishi cha wingi kinawahusu maafisa wote wawili na kimewasilishwa kwa kiambishi cha yambwa cha wingi katika ‘amewafasiria’.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina יוֹסֵף katika Biblia ya Kiswahili.
