base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: sw
  text: Lakini ukinikumbuka mambo yatakapokuendea mema, tafadhali unitendee fadhili. Unitaje kwa Farao, na unitoe kutoka nyumba hii[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Nyumba” hapa inarejelea mahali pa kifungo.
    reason: contextual_clarification
lexical_decisions:
- source_word: כִּי אִם
  choice: Lakini
  rationale: Kirai hiki kinaanzisha ombi lenye msisitizo baada ya Yusufu kufasiri ndoto. “Lakini” huhifadhi nguvu yake ya kugeuza fikira bila kufanya sentensi ya Kiswahili kuwa ngumu; wazo la wakati au sharti linaendelezwa na kifungu kinachofuata.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: unikumbuke[a]
  rationale: Kitenzi זכר humaanisha kumkumbuka au kumweka mtu akilini. אִתְּךָ, kihalisi “pamoja nawe,” ni sehemu ya usemi wa Kiebrania ambayo haihitaji kutafsiriwa neno kwa neno katika Kiswahili; maana yake imehifadhiwa, na umbo la kihalisi limeonyeshwa katika tanbihi.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: mambo yatakapokuendea mema
  rationale: Kifungu hiki kinataja wakati mhudumu wa mvinyo atakaporejeshwa katika hali njema. Tafsiri hii ni ya kawaida katika Kiswahili cha sasa na huhifadhi maana ya wakati ya כַּאֲשֶׁר.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: na tafadhali unitendee fadhili
  rationale: נָא imewakilishwa kwa “tafadhali,” na חֶסֶד hapa ni tendo la wema na uaminifu wa kibinafsi, si lazima istilahi rasmi ya agano.
- source_word: חָסֶד
  choice: fadhili
  rationale: “Fadhili” huwasilisha wema wa vitendo ambao Yusufu anaomba, huku ikiacha nafasi kwa wazo la uaminifu lililomo katika neno la Kiebrania.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: Unitaje kwa Farao
  rationale: Hifili ya זכר hapa ina maana ya kumleta Yusufu katika fikira za Farao. “Unitaje kwa Farao” ni wazi, fasaha, na huhifadhi kusudi hilo.
- source_word: וְהוֹצֵאתַנִי
  choice: na unitoe
  rationale: Hifili ya יצא ina maana ya kusababisha mtu atoke. “Unitoe” huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: מִן הַבַּיִת הַזֶּה
  choice: katika nyumba hii[b]
  rationale: Kiebrania kinasema “nyumba,” ingawa muktadha unaonyesha mahali pa kifungo. Matini kuu huhifadhi taswira ya chanzo, na tanbihi hufafanua maana ya kimuktadha.
theological_decisions:
- issue: Uhusiano wa כִּי אִם na כַּאֲשֶׁר katika ombi la Yusufu
  choice: Kuitafsiri kama ombi linalotazamia wakati mambo yatakapomwendea mema mhudumu wa mvinyo
  alternative: “Lakini ikiwa utanikumbuka mambo yatakapokuendea mema”
  rationale: Kiswahili cha matini kuu kinaonyesha kwa kawaida tukio linalotarajiwa la kurejeshwa kwake, bila kugeuza ombi kuwa sharti kali. Hata hivyo, nguvu ya masharti inayowezekana katika כִּי אִם haitumiki kutatua hoja yoyote ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa ombi umegawanywa katika sentensi mbili ili usomeke kwa urahisi bila kupoteza mfululizo wa vitenzi vya Kiebrania.
