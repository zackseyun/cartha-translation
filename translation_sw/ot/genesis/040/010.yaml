  text: na kwenye mzabibu kulikuwa na matawi matatu[a]. Ulipokuwa ukichipua, maua yake yakachomoza[b], na vishada vyake vikaiva vikawa zabibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “machipukizi matatu” au “vitawi vitatu.”
