    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: na kwenye mzabibu
  rationale: Kiunganishi na kihusishi chenye kibainishi vimetafsiriwa kwa njia ya kawaida inayoonyesha matawi kuwa juu ya mzabibu.
- source_word: שָׂרִיגִם
  choice: matawi
  rationale: Neno hilo humaanisha matawi au machipukizi ya mzabibu; “matawi” ni la kawaida na linaeleweka kwa urahisi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: כְפֹרַחַת
  choice: ulipokuwa ukichipua
  rationale: Muundo huu unaonyesha hatua inayoendelea katika ukuaji wa mzabibu na kuanzisha mfuatano wa haraka kutoka kuchipua hadi kuzaa zabibu.
- source_word: עָלְתָה נִצָּהּ
  choice: maua yake yakatokea
  rationale: Kauli hiyo inaeleza kutokea kwa ua la mzabibu; wingi ni wa kawaida katika Kiswahili kwa maana hii ya kijumla.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: vishada vyake vikaiva vikawa zabibu
  rationale: Tafsiri hii huhifadhi matumizi ya “zabibu” kama matokeo ya kuiva kwa vishada na kutoa mfuatano wa kawaida wa Kiswahili.
