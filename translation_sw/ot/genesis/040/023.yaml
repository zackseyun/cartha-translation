  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: sw
  text: Lakini mkuu wa wanyweshaji hakumkumbuka Yosefu[a]; kisha akamsahau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye mkuu wa wanyweshaji hakumkumbuka Yosefu; kisha akamsahau.”
    reason: Kiunganishi וְ kinaweza kutafsiriwa kwa mwendelezo rahisi kama “Naye” badala ya ulinganisho “Lakini.”
lexical_decisions:
- source_word: וְ/לֹא
  choice: Lakini ... haku-
  rationale: Kiunganishi pamoja na ukanushi kinaendeleza simulizi huku kikionyesha tofauti na kutimia kwa tafsiri ya Yosefu katika mstari uliotangulia; “Lakini” ni ya kawaida na wazi katika Kiswahili.
- source_word: זָכַר
  choice: kumkumbuka
  rationale: Kitenzi kimsingi humaanisha “kukumbuka.” Katika muktadha kinadokeza pia kutomfanyia Yosefu jambo aliloomba, lakini tafsiri hii haiongezi wazo hilo moja kwa moja.
- source_word: שַׂר הַמַּשְׁקִים
  choice: mkuu wa wanyweshaji
  rationale: Ni cheo cha ofisa mkuu wa ikulu aliyesimamia huduma ya vinywaji; tamko hili ni la asili katika Kiswahili na linadumisha wazo la cheo hicho.
- source_word: אֶת יוֹסֵף
  choice: Yosefu
  rationale: Kihusishi cha Kiebrania kinachoonyesha yambwa tendwa hakiwakilishwi kwa neno tofauti katika Kiswahili; jina limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: bali alimsahau
  rationale: Kitenzi humaanisha “kusahau,” na kiambishi cha yambwa kinamrejelea Yosefu. “Bali” huhifadhi urudiaji wenye msisitizo bila kuufanya usemi usikike usio wa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “hakumkumbuka ... alimsahau” umehifadhiwa kwa kuwa ni msisitizo wa maandishi ya Kiebrania.
