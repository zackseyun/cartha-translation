  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: sw
  text: Kikombe cha Farao kilikuwa mkononi mwangu, nami nikachukua zabibu, nikazikamua ndani ya kikombe cha Farao, kisha nikaweka kikombe hicho kwenye kiganja cha Farao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹס
  choice: kikombe
  rationale: Ni neno la kawaida na la asili kwa chombo cha kunywea; linafaa katika mazingira ya ikulu bila kuongeza wazo lisilomo katika Kiebrania.
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Linadumisha picha halisi ya simulizi ya ndoto na ni usemi wa kawaida katika Kiswahili.
- source_word: וָאֶקַּח אֶת הָעֲנָבִים
  choice: Nikachukua zabibu
  rationale: Kitenzi cha mfululizo “nikachukua” kinaonyesha hatua inayofuata katika simulizi, na “zabibu” ni kisawe cha moja kwa moja.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: nikazikamua ndani ya kikombe cha Farao
  rationale: שׂחט hapa hueleza kukamua au kubinya ili kutoa umajimaji. “Nikazikamua ndani ya” huwasilisha kwa uwazi tendo la kutoa maji ya zabibu yaingie kikombeni.
- source_word: וָאֶתֵּן אֶת הַכּוֹס עַל כַּף פַּרְעֹה
  choice: nikakiweka kikombe mkononi mwa Farao
  rationale: Ingawa נתן mara nyingi humaanisha “kutoa,” hapa muktadha unaonyesha kukiweka kikombe mkononi. “Mkononi” ni Kiswahili cha kawaida kwa wazo la Kiebrania “juu ya kiganja.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi zinadumisha mtiririko wa simulizi, huku viambishi vya ngeli katika “nikazikamua” na “nikakiweka” vikirejelea zabibu na kikombe kwa uwazi.
