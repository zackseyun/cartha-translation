  verdict: revise
  source_fidelity: 'Maana ya msingi imehifadhiwa: kikombe cha Farao kiko mkononi mwa msemaji, anachukua zabibu na kuzikamua ndani ya kikombe cha Farao. Hata hivyo, kauli ya mwisho inahitaji kurekebishwa ili itoe kwa usahihi zaidi עַל כַּף (“juu/kwenye kiganja”) na tendo la kuweka kikombe.'
  naturalness: “Nikakiweka kikombe” si mpangilio wa kawaida hapa, kwa kuwa kiambishi cha yambwa -ki- tayari kinarejelea kikombe halafu nomino “kikombe” inarudiwa bila uhitaji. “Nikaweka kikombe hicho kwenye kiganja cha Farao” ni ya asili na wazi zaidi.
  terminology: “Kikombe,” “Farao,” na “zabibu” zinafaa. “Kiganja” ni sahihi kwa כַּף katika mstari huu na huepuka kupanua maana hadi “mkono” kwa ujumla.
  issues:
