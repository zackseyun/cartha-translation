  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: sw
  text: Akamrudisha mkuu wa wanyweshaji katika kazi yake[a], na mkuu wa wanyweshaji akakiweka kikombe mkononi mwa Farao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “katika huduma yake ya kuwanywesha.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema tu, “naye akaweka”; muktadha unaonyesha kuwa ni mkuu wa wanyweshaji.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: akamrudisha
  rationale: Hifili ya שׁוב ina maana ya kumfanya mtu arudi katika hali au cheo chake cha awali; “akamrudisha” ni ya kawaida na inaonyesha kurejeshwa kazini.
- source_word: שַׂר הַמַּשְׁקִים
  choice: mkuu wa wanyweshaji
  rationale: שַׂר ni mkuu au afisa, na הַמַּשְׁקִים ni watumishi waliowapa wengine vinywaji katika ikulu.
- source_word: עַל מַשְׁקֵהוּ
  choice: katika kazi yake
  rationale: Kirai hiki kihalisi kinahusu huduma yake ya kuwanywesha watu; “katika kazi yake” kinawasilisha kwa Kiswahili cha kawaida kurejeshwa katika wajibu huo.
- source_word: וַיִּתֵּן
  choice: akaweka
  rationale: Ingawa נתן mara nyingi ni “kutoa,” hapa kikombe kinawekwa mkononi mwa Farao, hivyo “akaweka” linafaa katika muktadha.
- source_word: הַכּוֹס
  choice: kikombe
  rationale: Ni tafsiri ya moja kwa moja ya nomino hiyo.
- source_word: עַל כַּף פַּרְעֹה
  choice: mkononi mwa Farao
  rationale: כַּף kihalisi ni kiganja, lakini katika usemi huu Kiswahili cha kawaida hutumia “mkononi.”
theological_decisions:
- issue: Mtendaji wa וַיִּתֵּן katika kishazi cha pili
  choice: naye akaweka
  alternative: mkuu wa wanyweshaji akaweka / Farao akaweka
  rationale: Kitenzi cha Kiebrania hakitaji tena kiima. Muktadha wa huduma ya kikombe unaelekeza kwa mkuu wa wanyweshaji, lakini muundo wa kisarufi unaweza kuonekana ukiendeleza kiima cha awali, yaani Farao. Kiwakilishi “naye” pamoja na tanbihi kinahifadhi kiasi cha utata wa asili bila kutoa maana isiyo ya kawaida kuwa Farao alijiwekea kikombe mkononi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa kawaida na wenye heshima. “Mkuu wa wanyweshaji” huhifadhi cheo cha ikulu, huku “katika kazi yake” kikiepuka usemi mgumu usio wa kawaida.
