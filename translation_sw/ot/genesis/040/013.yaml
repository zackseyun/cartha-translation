base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: sw
  text: Katika siku tatu zijazo, Farao atakiinua kichwa chako[a] na kukurudisha katika cheo chako. Nawe utaweka kikombe cha Farao mkononi mwake, kama ilivyokuwa desturi ya awali ulipokuwa mnyweshaji wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “atakiinua kichwa chako.” Hapa ni nahau inayoonyesha kurejeshwa katika upendeleo; maneno halisi hayo pia huandaa matumizi yenye maana tofauti katika mstari wa 19.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Baada ya siku tatu zaidi
  rationale: Inaonyesha muda wa siku tatu uliobaki kabla ya tukio; usemi huu ni wa asili katika Kiswahili na huhifadhi mtazamo wa mbele.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: atakiinua kichwa chako
  rationale: Huhifadhi nahau halisi ya Kiebrania na uhusiano wake wa kifasihi na matumizi yenye matokeo tofauti katika mstari wa 19; kishazi kinachofuata kinaonyesha kuwa hapa maana yake ni kurudishwa kwa upendeleo.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: na kukurudisha katika cheo chako
  rationale: כֵּן hapa ni nafasi au wadhifa uliowekwa. ‘Cheo chako’ kinaeleweka katika mazingira ya utumishi wa kifalme bila kuwa cha kitaalamu kupita kiasi.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: utaweka kikombe cha Farao mkononi mwake
  rationale: Huhifadhi tendo halisi la kumpa Farao kikombe kwa kukiweka mkononi mwake na husikika kwa kawaida katika Kiswahili.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: kama ilivyokuwa desturi ya awali
  rationale: מִשְׁפָּט hapa humaanisha utaratibu au desturi iliyokuwa imezoeleka, si hukumu ya kisheria.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: ulipokuwa mnyweshaji wake
  rationale: מַשְׁקֶה ni cheo cha mtumishi wa ikulu aliyemhudumia mfalme kinywaji; ‘mnyweshaji’ ni neno la Kiswahili linalotambulisha jukumu hilo kwa ufupi.
