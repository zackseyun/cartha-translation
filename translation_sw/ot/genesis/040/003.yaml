  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: sw
  text: Akawaweka chini ya ulinzi katika nyumba ya mkuu wa walinzi[a], ndani ya gereza, mahali ambapo Yosefu alikuwa amefungwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu zaidi na maneno ya Kiebrania, “mkuu wa wachinjaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Akawaweka
  rationale: Ingawa kitenzi hiki kwa msingi kina maana ya ‘kutoa,’ katika muktadha huu kinamaanisha kuwaweka watu chini ya ulinzi; ‘akawaweka’ ni Kiswahili cha kawaida na sahihi.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiambishi cha yambwa kinawarejelea wale maofisa wawili waliotajwa katika muktadha uliotangulia.
- source_word: בְּמִשְׁמַר
  choice: chini ya ulinzi
  rationale: Neno linaweza kumaanisha ulinzi, kuwekwa kizuizini, au kifungo. ‘Chini ya ulinzi’ linaendeleza maana ya hali ya kuzuiliwa bila kuongeza dhana isiyo wazi katika chanzo.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: katika nyumba ya mkuu wa walinzi
  rationale: Cheo hiki kinatumika kwa Potifa katika simulizi. ‘Mkuu wa walinzi’ ni cha asili katika Kiswahili na kinafaa muktadha wa ikulu na gereza, huku maana halisi zaidi ikielezwa katika tanbihi.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: ndani ya gereza
  rationale: Kirai hiki humaanisha gereza. ‘Ndani ya gereza’ kinaonyesha kuwa gereza lilikuwa katika nyumba au eneo la mkuu wa walinzi na kinatoa Kiswahili kinachosomeka vizuri.
- source_word: מְקוֹם
  choice: mahali
  rationale: Hutambulisha ufafanuzi wa gereza kuwa ndilo eneo ambako Yosefu alizuiliwa.
- source_word: אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: ambapo Yosefu alikuwa amefungwa
  rationale: אָסוּר linaweza kumaanisha aliyefungwa au aliyezuiliwa gerezani. ‘Alikuwa amefungwa’ huhifadhi picha ya msingi ya Kiebrania na pia inaeleweka katika muktadha wa gereza; שָׁם imewakilishwa kiasili na ‘ambapo.’
