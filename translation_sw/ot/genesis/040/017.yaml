base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/017.yaml
  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: sw
  text: na katika kikapu cha juu kulikuwa na kila aina ya chakula cha Farao—kazi ya mwokaji[a]—na ndege walikuwa wakivila kutoka katika kikapu kilichokuwa juu ya kichwa changu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyakula vilivyookwa na mwokaji,” yaani, vilivyoandaliwa kwa ajili ya Farao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: na katika kikapu cha juu
  rationale: Neno עֶלְיוֹן linaonyesha kikapu cha juu kabisa; “kikapu cha juu” ni Kiswahili cha kawaida na huhifadhi uhusiano wa mahali.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: kulikuwa na kila aina ya chakula cha Farao
  rationale: Muundo מִכֹּל pamoja na nomino ya jumla unaonyesha aina mbalimbali. “Chakula cha Farao” huhifadhi uwezekano wa maana ya chakula chake au chakula kilichoandaliwa kwa ajili yake.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: kazi ya mwokaji
  rationale: Hili ndilo linalokaribia zaidi maana halisi ya Kiebrania, huku tanbihi ikieleza kuwa huenda ikamaanisha vyakula vilivyookwa na mwokaji.
- source_word: וְהָעוֹף
  choice: na ndege
  rationale: עוֹף inaweza kutumiwa kwa maana ya jumla ya viumbe warukao; wingi “ndege” ni wa kawaida katika muktadha huu.
- source_word: אֹכֵל
  choice: walikuwa wakivila
  rationale: Kauli ya kushiriki inaonyesha tendo lililokuwa likiendelea katika ndoto; “walikuwa wakivila” huhifadhi hali hiyo na kiambishi -vi- hurejelea aina za vyakula.
- source_word: מִן הַסַּל
  choice: kutoka katika kikapu
  rationale: מן huonyesha chanzo; tafsiri hii ni wazi na ya kawaida.
- source_word: מֵעַל רֹאשִׁי
  choice: kilichokuwa juu ya kichwa changu
  rationale: מֵעַל huonyesha mahali juu ya kichwa bila kulazimisha maana ya kugusana moja kwa moja.
theological_decisions: []
