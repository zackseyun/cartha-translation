  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa sentensi umeweka wazi kwamba kikapu ndicho kilichokuwa juu ya kichwa, huku usemi halisi “kazi ya mwokaji” ukihifadhiwa na kufafanuliwa katika tanbihi.
