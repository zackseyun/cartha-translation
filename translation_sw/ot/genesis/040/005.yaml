base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: sw
  text: Nao wote wawili wakaota ndoto[a], kila mmoja ndoto yake, usiku mmoja, kila mmoja kulingana na tafsiri ya ndoto yake[b]—mnyweshaji na mwokaji waliokuwa katika utumishi wa mfalme wa Misri[c], waliokuwa wamefungwa gerezani[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote wawili waliota ndoto ... usiku uleule.” Kiebrania hutumia muundo wa kitenzi na nomino ya mzizi mmoja, kwa maana ya karibu, “wakaota ndoto,” pamoja na kirai “usiku mmoja.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kila ndoto ikiwa na tafsiri yake.” Kiebrania hukazia kwamba ndoto ya kila mmoja ilikuwa na tafsiri iliyoilingana.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana ya karibu, “waliokuwa wa mfalme wa Misri.” Kirai hicho kinaweza kuonyesha uhusiano wao rasmi na utumishi wa mfalme.
    reason: lexical_alternative
  - marker: d
    text: Au, “waliokuwa wamefungwa katika nyumba ya gereza.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם
  choice: wakaota ndoto
  rationale: Kiswahili hutumia kwa kawaida muundo wa kitenzi na nomino yenye mzizi unaohusiana, “kuota ndoto”; hivyo muundo wa Kiebrania umehifadhiwa kwa namna ya asili.
- source_word: שְׁנֵיהֶם
  choice: wote wawili
  rationale: Inaonyesha wazi kwamba maafisa hao wawili kila mmoja aliota ndoto.
- source_word: אִישׁ חֲלֹמוֹ
  choice: kila mmoja ndoto yake
  rationale: Inahifadhi maana ya kugawa jambo kwa kila mtu mmoja mmoja bila kurudia neno “mtu” kwa namna isiyo ya asili katika Kiswahili.
- source_word: בְּלַיְלָה אֶחָד
  choice: usiku mmoja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati; inaweza pia kueleweka kuwa waliziota katika usiku uleule.
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: kila mmoja ndoto yake yenye tafsiri yake
  rationale: Inaonyesha kwamba kila ndoto ilikuwa na tafsiri inayolingana nayo. Muundo huu ni wazi katika Kiswahili huku ukihifadhi mgawanyo unaorudiwa katika Kiebrania.
- source_word: הַמַּשְׁקֶה
  choice: mnyweshaji
  rationale: Neno hili humaanisha afisa wa kifalme aliyekuwa na jukumu la kumpa mfalme kinywaji; “mkuu” halijaelezwa katika mstari huu.
- source_word: הָאֹפֶה
  choice: mwokaji
  rationale: Ni tafsiri ya moja kwa moja ya jina la kazi; cheo cha “mkuu” hakijaelezwa hapa.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: waliokuwa katika utumishi wa mfalme wa Misri
  rationale: Inaeleza uhusiano wao rasmi na mfalme kwa Kiswahili cha asili bila kudokeza kwamba walikuwa mali yake binafsi.
- source_word: אֲסוּרִים
  choice: walikuwa wamefungwa
  rationale: Kitenzi kinaweza kumaanisha kufungwa kwa kamba au kutiwa kizuizini; katika muktadha wa gereza, “wamefungwa” huhifadhi maana zote mbili kwa kiasi fulani.
- source_word: בֵּית הַסֹּהַר
  choice: gerezani
  rationale: Ni namna ya kawaida na yenye hadhi ya kueleza mahali pa kifungo katika Kiswahili; tafsiri sisisi “nyumba ya gereza” ingekuwa nzito na isiyo ya kawaida.
