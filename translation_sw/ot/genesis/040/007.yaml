  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: sw
  text: Basi akawauliza maafisa wa Farao[a] waliokuwa kizuizini pamoja naye katika nyumba ya bwana wake, akisema, “Kwa nini leo nyuso zenu zimejaa huzuni?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matowashi wa Farao”; neno la Kiebrania linaweza kumaanisha matowashi halisi au, kwa maana pana zaidi, maafisa wa ikulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Basi akawauliza
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; “Basi” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: סְרִיסֵי פַרְעֹה
  choice: maofisa wa Farao
  rationale: סָרִיס inaweza kumaanisha matowashi halisi au maofisa wa ikulu; hapa cheo chao ndicho kinachosisitizwa, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Huhifadhi kiwakilishi cha Kiebrania bila kumtaja Yosefu kwa ufafanuzi usio katika kirai chenyewe.
- source_word: בְמִשְׁמַר
  choice: chini ya ulinzi
  rationale: Neno hili huonyesha hali au mahali pa kuzuiliwa; katika muktadha huu “chini ya ulinzi” ni Kiswahili cha asili kinachoeleweka.
- source_word: בֵּית אֲדֹנָיו
  choice: katika nyumba ya bwana wake
  rationale: Hurejelea nyumba ya bwana wa Yosefu; “bwana” na “nyumba” huhifadhi maana ya msingi ya Kiebrania na mazingira ya simulizi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi kishazi cha Kiebrania kinachoanzisha usemi wa moja kwa moja.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kiulizi hiki.
- source_word: פְּנֵיכֶם רָעִים
  choice: nyuso zenu zimekunjamana
  rationale: Kirai hiki, kihalisi “nyuso zenu ni mbaya,” ni nahau ya kuonekana mwenye huzuni au mashaka; “zimekunjamana” huwasilisha hali inayoonekana usoni bila kuitafsiri kuwa hisia pekee.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni kisawe cha kawaida cha Kiswahili cha usemi huu wa wakati.
