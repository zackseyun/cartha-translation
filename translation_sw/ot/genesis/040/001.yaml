  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: sw
  text: Baada ya mambo hayo[a], mnyweshaji wa mfalme wa Misri na mwokaji wakamkosea bwana wao, mfalme wa Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya matukio hayo.” Kifungu hiki cha Kiebrania cha kuendeleza masimulizi kinaweza kutafsiriwa kwa kufuata muundo wake zaidi kuwa, “Ikawa baada ya mambo hayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo hayo
  rationale: Ni mpito wa kawaida wa masimulizi ya Kiebrania. Usemi huu unahifadhi muundo wa chanzo huku ukisomeka kwa kawaida katika Kiswahili; tafsiri pana zaidi imewekwa katika tanbihi.
- source_word: חָטְאוּ
  choice: wakamkosea
  rationale: Katika muundo huu wenye ל inayoonyesha aliyekosewa, kitenzi kina maana ya kumtendea mtu kosa au kutenda dhambi dhidi yake. “Wakamkosea” ni ya asili katika Kiswahili na inadumisha uzito wa kimaadili na kimahusiano bila kudai kwa uwazi aina mahususi ya kosa.
- source_word: מַשְׁקֵה
  choice: mnyweshaji
  rationale: Neno hilo linamtaja mtumishi wa kifalme aliyehudumia vinywaji. “Mnyweshaji” ni neno la Kiswahili linaloeleweka na haliongezi cheo cha ukuu ambacho hakijasemwa wazi katika aya hii.
- source_word: הָאֹפֶה
  choice: mwokaji
  rationale: Umbo lenye kibainishi linamaanisha “mwokaji.” Tafsiri hii ya moja kwa moja haiongezi kimilikishi kisichotajwa katika chanzo.
- source_word: לַאֲדֹנֵיהֶם
  choice: bwana wao
  rationale: אדון hapa ni mkuu wao wa kibinadamu. “Bwana wao” ni ya asili katika Kiswahili na muktadha pamoja na kirai kinachofuata vinaondoa utata wowote na cheo cha Mungu.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Kirai hiki kinamtambulisha kwa kurudia aliye bwana wao. Kurudia kunahifadhi msisitizo na muundo wa Kiebrania.
theological_decisions:
- issue: Uzito wa חָטְאוּ katika muktadha wa kosa dhidi ya mfalme
  choice: wakamkosea
  alternative: wakatenda dhambi dhidi ya
  rationale: “Wakamkosea” huhifadhi wazo la kosa dhidi ya mtu bila kulazimisha msomaji kuelewa kwamba simulizi linatoa hukumu mahususi ya kidini; hata hivyo halidhoofishi tendo hilo kuwa kutompendeza mfalme tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Msamiati ni rahisi kwa wasomaji wa kawaida; “mnyweshaji” na “mwokaji” zinadumisha majukumu ya ikulu bila kuongeza vyeo visivyotajwa.
