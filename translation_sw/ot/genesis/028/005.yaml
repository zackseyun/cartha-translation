base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: sw
  text: Basi Isaka akampeleka Yakobo, naye akaenda Padan-Aramu, kwa Labani mwana wa Bethueli, Mwaramu[a], ndugu wa Rebeka, mama wa Yakobo na Esau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa desturi ya tafsiri za zamani, “Msiria.” Kiebrania humaanisha kwa usahihi zaidi Mwaramu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akamruhusu Yakobo aondoke
  rationale: Katika muktadha huu שׁלח ni kumwacha au kumtuma mtu aende. Kiswahili hiki kinaonyesha Isaka alimwondosha Yakobo kwa kusudi bila kudokeza kuwa alimfukuza.
- source_word: וַיֵּלֶךְ
  choice: naye akaenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda; muundo huu unahifadhi mfuatano wa matendo uliowekwa na וַ.
- source_word: פַּדֶּנָה אֲרָם
  choice: Padan-Aramu
  rationale: Ni jina la mahali; kiambishi cha mwelekeo katika Kiebrania kinawakilishwa na muktadha wa kitenzi 'akaenda'.
- source_word: בֶּן בְּתוּאֵל
  choice: mwana wa Bethueli
  rationale: Huu ni muundo wa kawaida wa nasaba, uliotolewa kwa Kiswahili cha asili.
- source_word: הָאֲרַמִּי
  choice: Mwaramu
  rationale: אֲרַמִּי humtaja mtu wa Aramu, si kwa usahihi zaidi Msiria; 'Mwaramu' huhifadhi utambulisho wa kihistoria na kikabila.
- source_word: אֲחִי רִבְקָה
  choice: ndugu ya Rebeka
  rationale: אֲחִי humtambulisha Labani kuwa ndugu wa kiume wa Rebeka; kwa kuwa Labani tayari ametajwa, 'ndugu ya Rebeka' ni ya kawaida na wazi katika Kiswahili.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: mama ya Yakobo na Esau
  rationale: Kirai hiki kinamtambulisha Rebeka waziwazi na kinahifadhi majina yote mawili kwa mpangilio wa chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yameandikwa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili; sentensi imehifadhi mlolongo wa taarifa wa Kiebrania bila kufanya iwe ngumu kusomeka.
