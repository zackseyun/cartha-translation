  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: sw
  text: Basi Esau akaenda kwa Ishmaeli, akamwoa Mahalathi, binti ya Ishmaeli, mwana wa Abrahamu, dada ya Nebayothi, kuwa mke wake zaidi ya wake zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “pamoja na wake zake.” Kirai cha Kiebrania kinaonyesha kwamba Mahalathi alikuwa mke wa ziada, si mbadala wa wake ambao Esau tayari alikuwa nao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל
  choice: Esau akaenda kwa Ishmaeli
  rationale: Muundo wa masimulizi wa וַיֵּלֶךְ unaendeleza tukio linalofuata; ‘akaenda kwa’ ni Kiswahili cha kawaida kwa kwenda kumwona mtu bila kuongeza mkazo usio katika Kiebrania.
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Kitenzi לקח kimsingi ni ‘chukua’; maana ya ndoa inawekwa wazi na maneno yanayofuata ‘awe mke wake,’ hivyo nahau ya Kiebrania inahifadhiwa kwa Kiswahili kinachoeleweka.
- source_word: מָחֲלַת
  choice: Mahalathi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa Waswahili badala ya kutafsiriwa maana yake.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: binti ya Ishmaeli mwana wa Abrahamu
  rationale: Huhifadhi mfuatano wa ukoo uliomo katika Kiebrania kwa lugha ya kawaida na iliyo wazi.
- source_word: אֲחוֹת נְבָיוֹת
  choice: dada ya Nebayothi
  rationale: Kirai hiki kinamtambulisha Mahalathi zaidi; tafsiri ya moja kwa moja ni ya asili katika Kiswahili.
- source_word: עַל נָשָׁיו
  choice: pamoja na wake zake wengine
  rationale: 'Katika muktadha huu עַל inaonyesha nyongeza: Mahalathi alikuwa mke wa ziada, si mbadala wa wake waliokuwapo. Neno ‘wengine’ linafanya maana hiyo iwe wazi kwa msomaji wa kawaida.'
- source_word: לוֹ לְאִשָּׁה
  choice: awe mke wake
  rationale: Hii ni nahau ya kumchukua mwanamke katika ndoa; tafsiri hii ni ya kawaida na huhifadhi kusudi na uhusiano unaoonyeshwa na לוֹ.
