  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: sw
  text: Ndipo Yakobo akaamka usingizini mwake, akasema, “Hakika[a] Yahwe yuko mahali hapa, nami sikujua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hakika” pia inaweza kutafsiriwa “kweli” au “bila shaka”; hapa linaonyesha utambuzi wa ghafla wa Yakobo kwamba Yahwe yuko mahali hapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: akaamka
  rationale: Kitenzi hiki humaanisha kuamka kutoka usingizini; “akaamka” ni usemi wa kawaida na unaofaa mtiririko wa simulizi.
- source_word: מִשְּׁנָתוֹ
  choice: usingizini mwake
  rationale: Kirai hiki kinaonyesha kwamba Yakobo aliamka kutoka katika usingizi wake; tafsiri hii ni ya asili katika Kiswahili.
- source_word: אָכֵן
  choice: Hakika
  rationale: Chembe hii husisitiza utambuzi wa ghafla au uthibitisho; “Hakika” inadumisha mshangao wa Yakobo.
- source_word: יֵשׁ
  choice: yupo
  rationale: Neno hili linaonyesha kuwapo. Kwa kuwa kiima ni Mungu mwenye nafsi, “yupo” ni la asili kuliko “yuko” katika muktadha huu na linaeleza uwepo wake mahali hapo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בַּמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Kirai hiki kinarejelea mahali hususa ambapo Yakobo alilala na kuota ndoto; “mahali hapa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְאָנֹכִי
  choice: nami
  rationale: Kiwakilishi huru kinasisitiza tofauti kati ya kuwapo kwa Yahwe na kutokujua kwa Yakobo; “nami” kinadumisha ulinganisho huo kwa Kiswahili fasaha.
- source_word: לֹא יָדָעְתִּי
  choice: sikujua
  rationale: Kitenzi kinaeleza kutokujua kwa Yakobo kabla ya ufunuo huo. Kiebrania hakitaji yambwa wazi, na Kiswahili kinaweza kuhifadhi hali hiyo kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya kuwapo kwa Yahwe mahali hapo
  choice: Yahwe yupo mahali hapa
  alternative: Yahwe amejidhihirisha mahali hapa
  rationale: Tafsiri inahifadhi dai rahisi la Kiebrania kuhusu kuwapo kwa Yahwe bila kulifafanua kwa namna inayoweza kuondoa mvutano wa kiteolojia kuhusu uwepo wa Mungu na utambuzi wa Yakobo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo mfupi wa Kiebrania na mshangao wa Yakobo umehifadhiwa.
