lexical_decisions:
- source_word: וַיֵּצֵא
  choice: aliondoka
  rationale: Kitenzi יצא hapa kinaonyesha kuondoka mahali; “aliondoka” ni Kiswahili cha kawaida na kinachowasilisha maana hiyo moja kwa moja.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: מִבְּאֵר שָׁבַע
  choice: Beer-sheba
  rationale: Kihusishi מִן kinaonyesha mahali alikotoka. “Beer-sheba” huhifadhi kwa uwazi jina la mahali la Kiebrania.
- source_word: וַיֵּלֶךְ
  choice: akaelekea
  rationale: הלך ni kitenzi cha kawaida cha kwenda. Pamoja na umbo lenye kiambishi cha mwelekeo חָרָנָה, “akaelekea” huonyesha mwendo katika mwelekeo wa Harani bila kudai zaidi ya maandishi.
- source_word: חָרָנָה
  choice: Harani
  rationale: Jina חָרָן limetolewa kwa umbo la Kiswahili “Harani”; kiambishi cha Kiebrania -ָה kinaonyesha mwendo kuelekea mahali hapo, jambo linalowasilishwa na “akaelekea.”
