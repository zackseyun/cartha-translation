  text: Yakobo aliondoka Beer-sheba, akaelekea Harani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuelekea Harani,” kwa kiambishi cha mwelekeo kilichoongezwa kwenye jina “Harani.”'
