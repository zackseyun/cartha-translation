base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: sw
  text: Na jiwe hili nililolisimamisha kuwa nguzo litakuwa nyumba ya Mungu, na katika vyote utakavyonipa, hakika nitakutolea sehemu ya kumi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצֵּבָה
  choice: nguzo
  rationale: Neno hilo humaanisha jiwe lililosimamishwa kama alama au mnara; “nguzo” ni fupi, ya kawaida, na inadumisha picha halisi ya jiwe lililosimamishwa.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: litakuwa nyumba ya Mungu
  rationale: Muundo wa Kiebrania unasema moja kwa moja “nyumba ya Mungu.” Tafsiri hii inadumisha kauli hiyo bila kufafanua zaidi kama hekalu au madhabahu.
- source_word: תִּתֶּן לִי
  choice: utakavyonipa
  rationale: Kauli ya wakati ujao inaingia kwa kawaida katika muktadha wa nadhiri na inahusishwa na “vyote” kwa muundo wa Kiswahili ulio wazi.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: hakika nitakutolea sehemu ya kumi
  rationale: Infinitivi kamili pamoja na kitenzi kilichonyambuliwa husisitiza tendo. “Hakika” huhifadhi msisitizo huo, na “sehemu ya kumi” inaeleweka kwa wasomaji wa kawaida bila kuingiza istilahi ya kitaasisi.
- source_word: לָךְ
  choice: nitakutolea
  rationale: Kiambishi “-ku-” katika kitenzi kinamtaja Mungu wazi kuwa mpokeaji wa sehemu ya kumi.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: jiwe hili nililolisimamisha
  rationale: “Kulisimamisha” linafaa kwa tendo la kuinua jiwe ili liwe nguzo, na ni la asili katika Kiswahili.
theological_decisions:
- issue: Maana ya nadhiri ya Yakobo kuhusu jiwe
  choice: Kauli “litakuwa nyumba ya Mungu” imehifadhiwa kama ilivyo, ikionyesha mahali patakatifu au alama inayohusishwa na kukutana na Mungu.
  alternative: Kulieleza jiwe lenyewe kuwa patakatifu, au kulifanya unabii wa moja kwa moja kuhusu hekalu la baadaye.
  rationale: Kiebrania kinahusianisha jiwe lililosimamishwa na “nyumba ya Mungu,” lakini hakifafanui zaidi. Tafsiri haiongezi teolojia ya hekalu ya baadaye.
- issue: Usemi wa kutoa sehemu ya kumi
  choice: Nadhiri imetafsiriwa kuwa ahadi iliyosisitizwa ya kumtolea Mungu sehemu ya kumi ya vyote atakavyompa Yakobo.
  alternative: Kutumia istilahi rasmi ya kidini “zaka” kwa namna inayoweza kudokeza mfumo wa sheria au taasisi ya baadaye.
  rationale: Maandishi yanazungumzia sehemu ya kumi iliyoahidiwa kwa nadhiri. “Sehemu ya kumi” huhifadhi maana bila kuingiza kwa lazima taratibu za baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa leo, huku ukidumisha msisitizo wa Kiebrania kwa neno “hakika.” Hakuna tanbihi iliyowekwa kwa kuwa maelezo ya Kiingereza kuhusu alama [a] hayaendani na sehemu iliyoalamishwa, na tofauti ya “nyumba ya Mungu” dhidi ya “nyumba moja ya Mungu” haihitajiki katika Kiswahili hiki.
