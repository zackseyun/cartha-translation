id: GEN.28.14
reference: Genesis 28:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: sw
  text: Uzao wako utakuwa kama mavumbi ya dunia, nawe utaenea kuelekea magharibi na mashariki, kaskazini na kusini; na katika wewe na katika uzao wako familia zote za dunia zitabarikiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “familia zote za dunia zitajibariki katika wewe na katika uzao wako.” Kitenzi cha Kiebrania kinaweza pia kueleweka kwa maana ya kujirejelea au ya kati.
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְעֲךָ / וּבְזַרְעֶךָ
  choice: uzao wako
  rationale: Neno זֶרַע ni nomino ya pamoja inayoweza kumaanisha wazao. “Uzao” huhifadhi umoja wa kisarufi na maana ya pamoja bila kulazimisha tafsiri kuwa mtu mmoja au wengi.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: kama mavumbi ya dunia
  rationale: Huhifadhi tashbihi ya Kiebrania kuhusu wingi usiohesabika; “dunia” inafaa katika upeo mpana wa ahadi hii.
- source_word: וּפָרַצְתָּ
  choice: utaenea
  rationale: Kitenzi kina picha ya kufurukuta au kupanuka kwa nguvu. Katika muktadha wa mielekeo minne, “utaenea” ni Kiswahili cha kawaida kinachoonyesha upanuzi wa uzao.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: kuelekea magharibi na mashariki, kaskazini na kusini
  rationale: Viambishi vya mwelekeo vinaonyesha kuenea upande wa kila mojawapo ya pande nne. “Kusini” ndiyo maana inayofaa ya נֶגֶב katika orodha hii.
- source_word: וְנִבְרֲכוּ
  choice: zitabarikiwa
  rationale: Nifali ya ברך imetafsiriwa kwa maana ya kutendwa, inayofaa katika muundo wa ahadi za mababu; uwezekano wa maana ya kujirejelea umehifadhiwa katika tanbihi.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: ndani yako na uzao wako
  rationale: “Ndani ya” huhifadhi kwa ukaribu kihusishi ב cha fomula ya ahadi, badala ya kukifafanua moja kwa moja kuwa “kupitia.”
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: familia zote za dunia
  rationale: מִשְׁפְּחֹת ni makundi ya kifamilia au koo; “familia” ni ya kawaida na yenye hadhi. “Dunia” huonyesha upeo wa ulimwengu mzima katika fomula hii.
theological_decisions:
- issue: Maana ya ברך katika Nifali ndani ya fomula ya baraka kwa mababu
  choice: familia zote za dunia zitabarikiwa
  alternative: familia zote za dunia zitajibariki ndani yako na uzao wako
  rationale: Maana ya kutendwa ni ya moja kwa moja na inafaa katika muktadha wa ahadi, lakini muundo wa Kiebrania unaweza pia kueleweka kwa maana ya kujirejelea au ya kati; tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa pande nne umefanywa kuwa wa kawaida kwa Kiswahili huku maana ya mwelekeo ikihifadhiwa. Tanbihi imewekwa baada ya kishazi kinachohusika, na alama [a] imo katika matini kuu.
