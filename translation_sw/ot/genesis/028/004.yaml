source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: sw
  text: Naye akupe baraka ya Abrahamu, wewe pamoja na uzao wako ulio pamoja nawe[a], ili uimiliki nchi unamoishi kama mgeni[b], ambayo Mungu alimpa Abrahamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “uzao” liko katika umoja wa kisarufi, lakini hapa lina maana ya pamoja na linaweza kumaanisha wazao.
    reason: lexical_alternative
  - marker: b
    text: Au “ili uirithi nchi unamoishi kama mgeni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Naye akupe
  rationale: 'Katika muktadha wa baraka, umbo hili linaeleza ombi au tamanio: “akupe.” Kiunganishi וְ kinahifadhiwa kwa “Naye,” kwa kuwa mstari unaendeleza baraka iliyotangulia.'
- source_word: בִּרְכַּת אַבְרָהָם
  choice: baraka ya Abrahamu
  rationale: Muundo wa Kiebrania umehifadhiwa kwa uwazi na unaendeleza mwangwi wa ahadi ya agano iliyohusishwa na Abrahamu.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: wewe pamoja na uzao wako ulio pamoja nawe
  rationale: “Uzao” ni wa kawaida katika Kiswahili cha Biblia na unaweza kuwa na maana ya jumla kama זֶרַע. Kauli “ulio pamoja nawe” imehifadhiwa badala ya kuondolewa, kwa sababu imo wazi katika Kiebrania.
- source_word: לְרִשְׁתְּךָ
  choice: ili uimiliki
  rationale: ל pamoja na kitenzi-jina huonyesha kusudi au matokeo. “Uimiliki” hutoa maana ya kuipata na kuishikilia nchi, huku uwezekano wa “uirithi” ukibainishwa katika tanbihi.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: nchi unamoishi kama mgeni
  rationale: מְגוּרִים hurejelea makao ya muda ya mtu asiye mwenyeji. Usemi huu ni wa asili katika Kiswahili na huhifadhi wazo la maisha ya wahenga kama wageni katika nchi iliyoahidiwa.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: ambayo Mungu alimpa Abrahamu
  rationale: Huu ni uhamishaji wa moja kwa moja wa kishazi rejeshi; אֱלֹהִים imetafsiriwa “Mungu.”
theological_decisions:
- issue: Maana ya kiagano ya baraka ya Abrahamu
  choice: Kudumisha maneno “baraka ya Abrahamu” na lugha ya kuimiliki nchi bila kuyafafanua kuwa ustawi wa jumla.
  alternative: “baraka aliyoahidiwa Abrahamu” au “ili uirithi nchi”
  rationale: Mstari unarejelea moja kwa moja ahadi ya Abrahamu katika baraka ya Isaka kwa Yakobo. Tafsiri inahifadhi uhusiano huo bila kuongeza ufafanuzi wa kimadhehebu; “uimiliki” ni maana ya moja kwa moja, ingawa “uirithi” ni uwezekano halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Abrahamu,” “uzao,” na “baraka” hudumisha sajili ya kawaida ya kibiblia bila kuwa ya kizamani kupita kiasi.
