  source_fidelity: Tafsiri inawakilisha kwa uaminifu ombi la baraka katika וְיִתֶּן kwa “Naye akupe,” na huhifadhi “baraka ya Abrahamu,” wahusika wawili wa kupokea baraka (Yakobo na uzao wake), kusudi la kuimiliki nchi, hali ya ukaaji wa kigeni, na kishazi kwamba Mungu alimpa Abrahamu nchi hiyo. “Nchi unamoishi kama mgeni” ni uhamishaji wa asili na wa kutosha wa אֶרֶץ מְגֻרֶיךָ, bila kudai maana zaidi ya matini.
