  terminology: “Baraka,” “uzao,” “kuimiliki,” “mgeni,” “Mungu,” na “Abrahamu” ni istilahi sahihi na za kawaida katika Kiswahili cha Afrika Mashariki. Tanbihi (a) inaeleza vizuri umoja wa kisarufi na maana ya pamoja ya זַרְעֲךָ; tanbihi (b) hutoa mbadala halali wa “uirithi.” Alama za tanbihi zimewekwa kwenye vipashio vinavyohusika.
