  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: sw
  text: Na tazama, mimi niko pamoja nawe. Nitakulinda[a] popote utakapokwenda, nami nitakurudisha katika nchi hii. Kwa maana sitakuacha[b] mpaka nitakapofanya yale niliyokuambia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitakutunza.”
    reason: lexical_alternative
  - marker: b
    text: Au “sitakutelekeza.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “yale niliyokuambia”; kwa kuwa maneno hayo ni ahadi, wengine hutafsiri “yale niliyokuahidi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi dhima ya chembe ya Kiebrania ya kuvuta fikira na kuupa ujumbe uhai, kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: אָנֹכִי עִמָּךְ
  choice: mimi niko pamoja nawe
  rationale: Kiwakilishi huru אָנֹכִי kina mkazo; “mimi” kinauonyesha kwa kawaida, huku “pamoja nawe” kikihifadhi lugha ya uwepo wa Mungu.
- source_word: וּשְׁמַרְתִּיךָ
  choice: nitakulinda
  rationale: Kitenzi שׁמר kinaweza kumaanisha kulinda, kutunza, au kuangalia. “Nitakulinda” ni cha kawaida na kinaonyesha wazi ulinzi unaokusudiwa bila kupanua maana kupita kiasi.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: popote utakapokwenda
  rationale: Hii ni tafsiri ya asili ya Kiswahili ya usemi unaohusu kila mahali ambako Yakobo atakwenda.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: nitakurudisha
  rationale: Muundo wa Hifili wa שוב una nguvu ya kusababisha; “nitakurudisha” unaonyesha kwa usahihi kwamba Mungu ndiye atakayemrudisha Yakobo.
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: katika nchi hii
  rationale: Ingawa אֲדָמָה pia huweza kumaanisha ardhi au udongo, hapa muktadha wa ahadi kwa mababu unaelekeza kwenye eneo hili; “nchi” ni ya kawaida na inafaa kimuktadha.
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha msingi au hakikisho la ahadi iliyotangulia.
- source_word: לֹא אֶעֱזָבְךָ
  choice: sitakuacha
  rationale: עזב inaweza kumaanisha kuacha, kutupa, au kutelekeza. “Sitakuacha” ni pana, ya kawaida, na inahifadhi ahadi ya uwepo bila kuiongezea uzito usio wa lazima.
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: mpaka nitakapofanya
  rationale: Muunganiko huu unaonyesha kikomo cha wakati wa kutimizwa kwa jambo; Kiswahili hiki kinawasilisha kwa kawaida tendo litakalokuwa limetimizwa.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: yale niliyokuambia
  rationale: Kiebrania kinasema kihalisi yale Mungu aliyosema kwa Yakobo, si moja kwa moja “aliyoahidi.” “Niliyokuambia” ni cha kawaida na kinabaki karibu na chanzo.
theological_decisions:
- issue: Lugha ya uwepo, ulinzi, na uaminifu wa agano
  choice: 'Ahadi imetafsiriwa kwa maneno ya moja kwa moja: Mungu yuko pamoja na Yakobo, atamlinda, atamrudisha, na atatimiza alichosema.'
  alternative: Kutumia lugha nzito zaidi kama “sitakutelekeza” au kutafsiri kwa upanuzi kama “nitakuangalia na kukurudisha nyumbani.”
  rationale: Chaguo hili linahifadhi mada za uwepo wa Mungu, ulinzi, kurudi katika nchi, na uaminifu kwa neno lake bila kuingiza kauli za kimadhehebu au kufafanua zaidi ya andiko.
- issue: Maana ya דִּבַּרְתִּי katika muktadha wa ahadi
  choice: yale niliyokuambia
  alternative: yale niliyokuahidi
  rationale: Maneno yaliyotangulia ni ahadi, lakini kitenzi chenyewe ni “kusema/kunena.” Matini kuu inahifadhi usemi mpana wa chanzo, na tanbihi inaonyesha tafsiri ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa kwa mtiririko wa asili wa Kiswahili huku urudiaji wa ahadi za nafsi ya kwanza ukihifadhiwa. Viashiria vyote vya tanbihi vimewekwa karibu na maneno yanayohusika.
