base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: sw
  text: Ondoka, uende Padan-Aramu, nyumbani kwa Bethueli, baba ya mama yako, ukajitwalie kutoka huko mke miongoni mwa binti za Labani, ndugu wa kiume wa mama yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa lugha fupi zaidi ya ukoo, “baba ya mama yako” ni “babu yako,” na “ndugu wa kiume wa mama yako” ni “mjomba wako.” Maandishi makuu yanahifadhi kwa uwazi zaidi misemo ya ukoo ya Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Ondoka
  rationale: Amri ya קום humaanisha kuinuka au kuondoka; katika mfululizo huu wa amri, “Ondoka” ni Kiswahili cha kawaida na chenye hadhi kinachoelekeza kuanza safari.
- source_word: לֵךְ֙
  choice: uende
  rationale: Amri ya הלך ni “kwenda”; muundo “Ondoka, uende” unasikika kwa kawaida katika Kiswahili na kuhifadhi amri zote mbili.
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: Padan-Aramu
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili; kiambishi elekezi cha Kiebrania kinawasilishwa na mwelekeo uliomo katika “uende.”
- source_word: בֵּ֥יתָה בְתוּאֵ֖ל
  choice: nyumbani kwa Bethueli
  rationale: בַּיִת katika muundo huu inaweza kuelekeza kwenye nyumba au kaya; “nyumbani kwa Bethueli” ni ya asili katika Kiswahili na inadumisha maana ya mahali anapoishi au kaya yake.
- source_word: אֲבִ֣י אִמֶּ֑ךָ
  choice: baba ya mama yako
  rationale: Huhifadhi kwa uwazi usemi halisi wa ukoo wa Kiebrania bila kuubadili kimya kuwa “babu yako.”
- source_word: וְ/קַח לְ/ךָ֤
  choice: ukajitwalie
  rationale: Kitenzi “jitwalie” kinawasilisha לקח pamoja na לְךָ, yaani kuchukua kwa ajili yako mwenyewe; “uka-” kinaendeleza kusudi la safari kwa Kiswahili cha kawaida.
- source_word: מִ/שָּׁם֙
  choice: huko
  rationale: Katika muktadha wa kwenda mahali fulani kisha kuchukua mke kutoka mahali hapo, “huko” huwasilisha kwa kawaida maana ya “kutoka huko” bila urudiaji mzito.
- source_word: אִשָּׁ֔ה
  choice: mke
  rationale: Muktadha wa kutafuta mwenzi wa ndoa unaonyesha maana maalumu ya “mke,” si “mwanamke” kwa ujumla.
- source_word: מִ/בְּנ֥וֹת לָבָ֖ן
  choice: miongoni mwa binti za Labani
  rationale: 'Huwasilisha maana ya sehemu ya kundi iliyo katika מִן: achague mmoja kati ya binti za Labani.'
- source_word: אֲחִ֥י אִמֶּֽ/ךָ
  choice: ndugu ya mama yako
  rationale: Huhifadhi usemi wa Kiebrania kwa uwazi; tanbihi inaonyesha istilahi fupi ya kawaida “mjomba wako.”
