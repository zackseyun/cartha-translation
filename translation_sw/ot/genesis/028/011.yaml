  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: sw
  text: Akafika mahali fulani, akakaa hapo usiku[a], kwa sababu jua lilikuwa limetua. Akachukua jiwe moja kati ya mawe ya mahali hapo[b], akaliweka chini ya kichwa chake[c], kisha akajilaza mahali hapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akalala hapo usiku.” Kitenzi cha Kiebrania humaanisha kukaa au kulala mahali usiku.
    reason: lexical_alternative
  - marker: b
    text: Au, “akachukua baadhi ya mawe ya mahali hapo.” Muundo wa Kiebrania unaweza kueleweka kuwa wa sehemu kutoka katika nomino ya wingi, ingawa kwa kawaida muktadha hueleweka kumaanisha jiwe moja.
    reason: alternative_reading
  - marker: c
    text: “Chini ya kichwa chake” hutafsiri neno la Kiebrania linaloweza kurejelea eneo la kichwa au tegemeo la kichwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע
  choice: Akafika
  rationale: Katika muktadha wa safari, פגע pamoja na mahali inaeleza kufika au kuwasili, bila kulazimisha wazo la kukutana na mtu au kufika kwa bahati.
- source_word: בַּמָּקוֹם
  choice: mahali fulani
  rationale: Ingawa Kiebrania kina kibainishi, hapa ni kutajwa kwa kwanza; 'mahali fulani' ni Kiswahili cha kawaida na pia hudokeza kwamba mahali hapo patakuwa na umuhimu katika simulizi.
- source_word: וַיָּלֶן
  choice: akalala huko usiku
  rationale: לון humaanisha kukaa mahali usiku. Kauli hii ni ya kawaida na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: kwa sababu jua lilikuwa limetua
  rationale: בוא linapotumiwa kuhusu jua ni nahau ya kutua kwa jua; wakati uliotangulia unaonyesha sababu ya yeye kusimama na kukaa hapo usiku.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: Akachukua jiwe moja kati ya mawe ya mahali hapo
  rationale: מִן pamoja na wingi 'mawe' linaweza kuwa la sehemu; tafsiri ya jiwe moja ni ya kawaida katika muktadha, huku tanbihi ikihifadhi uwezekano wa kuelewa mawe kadhaa.
- source_word: מְרַאֲשֹׁתָיו
  choice: chini ya kichwa chake
  rationale: Neno hilo hurejelea eneo la kichwa au tegemeo la kichwa. 'Chini ya kichwa chake' linaeleza kazi ya jiwe kwa Kiswahili cha kawaida bila kulitafsiri moja kwa moja kuwa mto.
- source_word: וַיִּשְׁכַּב
  choice: akajilaza
  rationale: שכב hapa linaeleza tendo la kulala chini au kujilaza; 'akajilaza' haliongezi dai kwamba tayari alikuwa amelala usingizi.
- source_word: בַּמָּקוֹם הַהוּא
  choice: mahali hapo
  rationale: Kurudia 'mahali' kunahifadhi msisitizo wa simulizi juu ya eneo hilo badala ya kutumia 'huko' pekee.
