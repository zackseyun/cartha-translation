  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: sw
  text: Na tazama, Yahwe alikuwa amesimama juu yake[a], akasema, “Mimi ni Yahwe, Mungu wa Abrahamu baba yako, na Mungu wa Isaka. Nchi hii unayoilalia nitakupa wewe na uzao wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kando yake” au “juu yake,” ikiwa kiwakilishi kinamrejelea Yakobo badala ya ngazi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi kazi ya kishazi hiki ya kuvuta uangalifu na kuleta uhai katika simulizi, kwa Kiswahili cha sasa chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji wa jina la Mungu, YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: נִצָּב
  choice: alikuwa amesimama
  rationale: Umbo la participle linaonyesha hali inayoendelea katika maono; tafsiri hii huonyesha kuwa Yakobo alimwona akiwa tayari amesimama.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi cha umoja wa kiume kinaweza kurejelea ngazi iliyo katika muktadha wa karibu, lakini umbo hili la Kiswahili linahifadhi kiasi fulani utata wa iwapo kinarejelea ngazi au Yakobo; tanbihi inaeleza uwezekano huo.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Mungu wa Abrahamu baba yako
  rationale: Inafuata kwa karibu mfuatano wa Kiebrania bila kulazimisha alama ya uakifishaji inayoweza kutatua sintaksia kupita kiasi; ‘baba’ hapa inaweza kuwa kwa maana pana ya babu wa ukoo.
- source_word: הָאָרֶץ
  choice: Nchi hii
  rationale: Katika ahadi kwa mababu, הָאָרֶץ ni nchi, si udongo tu. ‘Hii’ huunganisha wazi nomino na kishazi kinachofuata kuhusu mahali Yakobo amelala.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: unayoilalia
  rationale: Ni Kiswahili cha asili kinachohifadhi tendo la sasa na uhusiano wa mahali, yaani kulala juu ya nchi hiyo.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: nitakupa wewe
  rationale: Wakati ujao unafaa katika muktadha wa ahadi; ‘wewe’ hudhihirisha walengwa wa kwanza wa ahadi kama ilivyo לְךָ.
- source_word: וּלְזַרְעֶךָ
  choice: na uzao wako
  rationale: ‘Uzao’ huhifadhi maana ya pamoja ya nomino ya umoja זֶרַע na ni ya kawaida katika Kiswahili cha kibiblia kinachoeleweka.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la binafsi YHWH; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kirejelewa cha עָלָיו katika maono
  choice: juu yake, ikiwezekana ikirejelea ngazi
  alternative: kando yake au juu yake, ikirejelea Yakobo
  rationale: Ngazi ndiyo nomino ya karibu katika muktadha, lakini kiwakilishi kinaweza kufasiriwa kuwa kinamrejelea Yakobo. Tafsiri na tanbihi hazifuti utata huo.
- issue: Maana ya ‘Abrahamu baba yako’
  choice: imehifadhiwa bila koma ya ufafanuzi
  alternative: Mungu wa baba yako Abrahamu
  rationale: Mfuatano wa Kiebrania unaweza kumwita Abrahamu ‘baba’ kwa maana ya babu wa ukoo. Uandishi huu unabaki karibu na chanzo bila kuamua sintaksia zaidi ya lazima.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa usawa bora: unafuata kwa karibu chanzo cha Kiebrania huku ukitumia misemo ya kawaida kama ‘unayoilalia.’ Jina ‘Yahwe’ na neno ‘uzao’ yamehifadhiwa kwa usahihi wa kitheolojia na kileksika.'
