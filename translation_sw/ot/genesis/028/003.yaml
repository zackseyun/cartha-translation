  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: sw
  text: Mungu Mwenyezi[a] akubariki, akufanye uzae, na akuzidishe, ili uwe kusanyiko la mataifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “El Shaddai”; kwa kawaida hutafsiriwa “Mungu Mwenyezi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  rationale: Hutafsiri cheo cha Mungu kwa Kiswahili kinachoeleweka na kilichozoeleka, huku maana ya msingi ya אֵל kama ‘Mungu’ ikihifadhiwa. Umbo la Kiebrania limeonyeshwa katika tanbihi.
- source_word: יְבָרֵךְ
  choice: akubariki
  rationale: Kauli tegemezi ya Kiswahili inaonyesha ombi au tamko la baraka, sawasawa na matumizi ya Kiebrania yenye nguvu ya jussive katika muktadha huu.
- source_word: וְיַפְרְךָ
  choice: akufanye uzae
  rationale: Huhifadhi maana ya kisababishi ya Hifili ya פרה kwa lugha ya kawaida ya Kiswahili bila kufafanua moja kwa moja kuwa kinachokusudiwa ni wazao.
- source_word: וְיַרְבֶּךָ
  choice: akuzidishe
  rationale: Huhifadhi kisababishi na kishamirisho cha nafsi ya pili kilicho katika Kiebrania; katika baraka hii ongezeko linadokeza kuongezeka kwa Yakobo kupitia wazao wake.
- source_word: וְהָיִיתָ
  choice: ili uwe
  rationale: Huonyesha kwa kawaida uhusiano wa kusudi au matokeo kati ya baraka zilizotangulia na kuwa kwa Yakobo kusanyiko la mataifa.
- source_word: לִקְהַל עַמִּים
  choice: kusanyiko la mataifa
  rationale: ‘Kusanyiko’ huhifadhi wazo la קהל kama kundi lililokusanywa, na ‘mataifa’ huhifadhi wingi wa עַמִּים badala ya kuugeuza kuwa watu wengi tu.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  alternative: El Shaddai
  rationale: Cheo kimetafsiriwa badala ya kuandikwa kwa matamshi yake tu, ili maana yake iwafikie wasomaji wa kawaida; umbo la asili limehifadhiwa katika tanbihi bila kulazimisha ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi katika hali ya kutakia unaendeleza sauti ya baraka. Neno “kusanyiko” limechaguliwa ili kuhifadhi taswira ya קהל, ingawa usemi huo ni rasmi zaidi kuliko lugha ya mazungumzo.
