  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: sw
  text: Akaliita mahali pale Betheli[a], lakini hapo awali jina la mji huo lilikuwa Luzu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betheli maana yake ni “nyumba ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: Akaliita jina
  rationale: Muundo huu unahifadhi kwa njia ya kawaida ya Kiswahili nahau ya Kiebrania ya ‘kuliita jina,’ huku ukionyesha wazi tendo la kupatia jina.
- source_word: הַמָּקוֹם הַהוּא
  choice: mahali pale
  rationale: Neno מקום ni ‘mahali,’ na הַהוּא linaonyesha mahali palipotajwa tayari; ‘pale’ ni ya kawaida na fasaha katika Kiswahili.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili badala ya kutafsiriwa katika matini kuu; maana yake imeelezwa katika tanbihi.
- source_word: וְאוּלָם
  choice: lakini
  rationale: Kiunganishi hiki kinaanzisha ufafanuzi wenye utofautishaji; ‘lakini’ ni sahihi na ya kawaida.
- source_word: לוּז
  choice: Luzu
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: שֵׁם הָעִיר
  choice: jina la mji huo
  rationale: Huhifadhi uhusiano wa Kiebrania wa ‘jina la mji’; ‘huo’ huweka wazi kuwa ni mji unaohusiana na mahali pale.
- source_word: לָרִאשֹׁנָה
  choice: hapo awali
  rationale: Katika muktadha huu linaonyesha jina la zamani la mji; ‘hapo awali’ ni la asili na linafikisha maana ya wakati uliotangulia.
