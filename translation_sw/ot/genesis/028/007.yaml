  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: sw
  text: na kwamba Yakobo aliwasikiliza baba yake na mama yake[a], akaenda Padani-Aramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwatii baba yake na mama yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikia na pia kuzingatia au kutii katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: alimsikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל kinaweza kumaanisha kusikiliza kwa makini au kutii. Katika muktadha huu Yakobo anafuata maagizo ya wazazi wake; “alimsikiliza” huhifadhi wazo la kusikia na kulizingatia bila kufunga maana katika “alitii” pekee.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: baba yake na mama yake
  rationale: Kiswahili cha kawaida hakihitaji kurudia kiunganishi kinacholingana na אֶל kabla ya kila nomino. Umilikishi umerudiwa ili wazazi wote wawili watajwe wazi kama katika Kiebrania.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda. “Akaenda” ni tafsiri ya moja kwa moja na huendeleza mfuatano wa simulizi unaoonyeshwa na וַ־.
- source_word: פַּדֶּנָה אֲרָם
  choice: Padani-Aramu
  rationale: Hili ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa. Kiishio cha kuelekea mahali katika פַּדֶּנָה kinawakilishwa kiasili na muundo wa Kiswahili “akaenda Padani-Aramu.”
- source_word: וַ
  choice: na kwamba
  rationale: Kifungu hiki kinaendeleza sentensi tegemezi kutoka mstari uliotangulia. “na kwamba” huhifadhi uhusiano huo wa kisintaksia badala ya kukifanya kiwe kauli mpya inayojitegemea.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Mwanzo wa “na kwamba” umehifadhi kwa sababu mstari huu unategemea kisintaksia taarifa iliyotangulia. Jina la mahali limetoholewa kama “Padani-Aramu.”
