  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: sw
  text: nami nikirudi salama nyumbani kwa baba yangu,[a] ndipo Yahweh atakuwa Mungu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikirudi kwa amani nyumbani kwa baba yangu.” Neno la Kiebrania linaweza kusisitiza amani, usalama, au hali njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: nami nikirudi
  rationale: Kitenzi שוב humaanisha ‘kurudi.’ Muundo wa ‘nikirudi’ unaendeleza sharti la nadhiri ya Yakobo kutoka mistari iliyotangulia kwa Kiswahili cha kawaida.
- source_word: בְשָׁלוֹם
  choice: salama
  rationale: שָׁלוֹם hapa inaweza kumaanisha kwa amani, kwa usalama, au katika hali njema. ‘Salama’ ni ya kawaida katika muktadha wa kurudi bila madhara, huku tanbihi ikihifadhi upana wa maana.
- source_word: אֶל בֵּית אָבִי
  choice: nyumbani kwa baba yangu
  rationale: Kauli hii huhifadhi maana ya nyumba na familia ya baba kwa Kiswahili cha asili na kinachoeleweka.
- source_word: וְהָיָה
  choice: ndipo ... atakuwa
  rationale: Katika mfululizo huu wa nadhiri, וְהָיָה inaanzisha tokeo la masharti yaliyotangulia. ‘Ndipo’ huonyesha uhusiano huo wazi kwa Kiswahili bila kuondoa mvutano wa kiteolojia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: לִי לֵאלֹהִים
  choice: atakuwa Mungu wangu
  rationale: Ingawa muundo wa moja kwa moja ni ‘atakuwa kwangu kuwa Mungu,’ Kiswahili cha kawaida hutumia ‘atakuwa Mungu wangu,’ ambacho kinahifadhi uhusiano unaokusudiwa.
theological_decisions:
- issue: Iwapo kauli ya Yakobo inaonyesha kumkubali Yahweh kwa masharti au ni tamko la nadhiri lisilo na masharti
  choice: Kuhifadhi nguvu ya sharti na tokeo kwa ‘nikirudi ... ndipo Yahweh atakuwa Mungu wangu.’
  alternative: ‘nami nitarudi salama ... na Yahweh atakuwa Mungu wangu,’ bila kusisitiza uhusiano wa sharti na tokeo.
  rationale: Mfuatano wa Kiebrania unaendeleza masharti ya nadhiri ya Yakobo kutoka mistari iliyotangulia. Tafsiri inapaswa kuhifadhi mvutano huo badala ya kuugeuza kimyakimya kuwa tamko lisilo na masharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyumbani kwa baba yangu’ ni ya asili zaidi kuliko muundo mzito ‘kwenye nyumba ya baba yangu.’
