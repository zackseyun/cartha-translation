review_pass:
  verdict: revise
  source_fidelity: The sequence of Jacob's early rising, taking the stone, erecting it as a pillar, and pouring oil on it is accurately retained. However, "kichwani pake" normally means on/upon his head in modern Swahili, whereas the Hebrew expression identifies the stone as having been placed at the location of his head. "Karibu na kichwa chake" conveys this without asserting that it was under his head.
  naturalness: The narrative chain is fluent Standard East African Swahili. Replacing the potentially misleading locative phrase and specifying the upper part of the erected stone improves clarity while retaining a natural narrative register.
  terminology: '"Nguzo" is an appropriate concise rendering of מַצֵּבָה, with "jiwe lililosimamishwa" a suitable lexical-alternative footnote. "Kilele chake" is idiomatic for the top/head of an inanimate upright object and avoids ambiguity in "juu yake."'
  issues:
  - severity: medium
    issue: '"alilokuwa ameweka kichwani pake" is spatially misleading.'
    rationale: In ordinary Swahili, "kichwani pake" means on Jacob's head. The Hebrew מְרַאֲשֹׁתָיו refers to the place at/by his head; it should not be rendered as though the stone rested on his head.
  - severity: low
    issue: '"juu yake" leaves the referent and the sense of the stone''s upper end less explicit.'
    rationale: The Hebrew says literally "on its head," meaning the top of the stone/pillar. "Juu ya kilele chake" expresses this naturally and precisely.
  revised_text: Yakobo akaamka asubuhi na mapema, akalichukua jiwe alilokuwa ameweka karibu na kichwa chake, akalisimamisha kuwa nguzo[a], kisha akamimina mafuta juu ya kilele chake[b].
  revised_footnotes:
  - marker: a
    text: Au, “jiwe lililosimamishwa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “juu ya kichwa chake.”
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the Swahili spatial sense of the stone''s earlier placement: it was at/near Jacob''s head, not on his head. It also renders the stone''s "head" as its upper end in idiomatic Swahili. The descriptive wording for the standing stone and the pouring of oil is preserved without adding theological interpretation.'
