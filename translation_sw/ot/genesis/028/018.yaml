- from: Yakobo akaamka asubuhi na mapema, akalichukua jiwe alilokuwa ameweka kichwani pake, akalisimamisha kuwa nguzo[a], kisha akamimina mafuta juu yake[b].
  to: Yakobo akaamka asubuhi na mapema, akalichukua jiwe alilokuwa ameweka karibu na kichwa chake, akalisimamisha kuwa nguzo[a], kisha akamimina mafuta juu ya kilele chake[b].
  rationale: 'The revision corrects the Swahili spatial sense of the stone''s earlier placement: it was at/near Jacob''s head, not on his head. It also renders the stone''s "head" as its upper end in idiomatic Swahili. The descriptive wording for the standing stone and the pouring of oil is preserved without adding theological interpretation.'
  reviewer_model: gpt-5.6-terra
