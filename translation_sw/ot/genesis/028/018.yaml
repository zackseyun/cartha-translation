base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: sw
  text: Yakobo akaamka asubuhi na mapema, akalichukua jiwe alilokuwa ameweka karibu na kichwa chake, akalisimamisha kuwa nguzo[a], kisha akamimina mafuta juu ya kilele chake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jiwe lililosimamishwa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “juu ya kichwa chake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: akaamka asubuhi na mapema
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kuamka mapema wakati wa asubuhi na kuhifadhi msisitizo wa wakati uliopo katika Kiebrania.
- source_word: הָאֶבֶן
  choice: jiwe
  rationale: Ni nomino ya umoja yenye uhusiano bayana katika muktadha; Kiswahili hutumia 'jiwe' kwa usahihi na kwa kawaida.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: alilokuwa ameweka kichwani pake
  rationale: '''Kichwani pake'' hudumisha wazo la mahali pa upande wa kichwa bila kulazimisha maana ya ''chini ya kichwa,'' ambayo haijasemwa wazi hapa.'
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: akalisimamisha kuwa nguzo
  rationale: Kitenzi 'akalisimamisha' kinaonyesha tendo la kuliweka jiwe wima, na 'kuwa nguzo' kinawasilisha matokeo yake kwa lugha inayoeleweka.
- source_word: מַצֵּבָה
  choice: nguzo
  rationale: '''Nguzo'' ni tafsiri fupi na yenye hadhi; maana mahsusi ya jiwe lililosimamishwa imehifadhiwa katika tanbihi.'
- source_word: וַיִּצֹק שֶׁמֶן
  choice: akamimina mafuta
  rationale: Hufuata tendo lililotajwa wazi la kumimina mafuta bila kulifasiri mapema kama kupaka mafuta kwa kusudi la kuweka wakfu.
- source_word: עַל רֹאשָׁהּ
  choice: juu yake
  rationale: Ni Kiswahili cha kawaida kwa sehemu ya juu ya kitu kisicho na uhai; maana halisi ya 'juu ya kichwa chake' imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Umuhimu wa kiibada wa מַצֵּבָה na tendo la kumimina mafuta
  choice: Kusimulia tendo kwa maelezo bila kulipa hukumu ya kidini
  alternative: Kutafsiri kwa ufafanuzi zaidi kama 'jiwe la ukumbusho' au 'akalipaka mafuta'
  rationale: Kiebrania kinasimulia kusimamishwa kwa jiwe na kumiminwa kwa mafuta bila kutoa hapa hukumu chanya au hasi. Tafsiri elezi huhifadhi mvutano huo na haingizi tathmini kutoka vifungu vya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi kupitia vitenzi vya mfululizo. Lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida; 'kisha' husaidia kutenganisha tendo la mwisho bila kupoteza mwendo wa simulizi.
