base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: sw
  text: Akaogopa, akasema, “Mahali hapa panatia hofu jinsi gani![a] Mahali hapa si pengine bali ni nyumba ya Mungu, na hili ni lango la mbingu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mahali hapa panaogofya jinsi gani!” Neno la Kiebrania linaweza kueleza hofu, kitisho, au uchaji wenye hofu.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa Kiebrania, kihalisi: “lango la mbingu.” “Mbingu” hapa kwa kawaida humaanisha makao ya Mungu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: Akaogopa
  rationale: Kitenzi ירא hapa kinasimulia mwitikio wa Yakobo wa hofu baada ya maono. “Akaogopa” ni Kiswahili cha kawaida na hakifanyi hofu hiyo kuwa uchaji tu.
- source_word: מַה נּוֹרָא
  choice: panatisha na kustaajabisha jinsi gani
  rationale: נוֹרָא inaweza kuonyesha hofu, kitisho, na mshangao wenye uchaji. Muunganiko huu unahifadhi mvutano huo wa maana bila kuugeuza kuwa woga hasi pekee au kuvutiwa kwa kawaida.
- source_word: הַמָּקוֹם הַזֶּה
  choice: Mahali hapa
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kirai chenye kiashiria.
- source_word: אֵין זֶה כִּי אִם
  choice: Hapa si pengine bali ni
  rationale: Nahau hii ya Kiebrania inasisitiza utambulisho wa mahali. Kauli hii ni ya asili katika Kiswahili na inahifadhi msisitizo wa “si kingine ila.”
- source_word: בֵּית אֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Inafuata kwa uwazi muundo wa Kiebrania na kudumisha lugha takatifu bila kudokeza kwamba tayari palikuwa na hekalu lililojengwa hapo.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: lango la mbingu
  rationale: “Mbingu” ni neno la kawaida la Kiswahili kwa שָׁמַיִם na linaweza kutaja makao ya Mungu; taswira ya lango imehifadhiwa.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika muktadha wenye mrejeo wa umoja
  choice: Mungu
  alternative: miungu
  rationale: Ingawa umbo la neno ni la wingi, muktadha wa maono na agano la Yakobo unamtaja Mungu mmoja; matumizi haya ya umoja ni ya kawaida katika Kiebrania cha Biblia.
- issue: Mchanganyiko wa hofu na uchaji katika נוֹרָא
  choice: panatisha na kustaajabisha
  alternative: panatisha; panaogofya; panastaajabisha
  rationale: Tafsiri iliyochaguliwa inadumisha kwa pamoja kitisho na mshangao unaotokana na uwepo wa Mungu, bila kuamua kwamba neno lina maana ya hofu tupu au uchaji mtupu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. “Panatisha na kustaajabisha” kimetumiwa kuhifadhi upana wa maana ya נוֹרָא. Alama zote za tanbihi zimewekwa katika matini kuu.
