translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Nahau “binti za Kanaani” imehifadhiwa kwa kuwa inaeleweka katika muktadha; “usioe” limetumika badala ya tafsiri neno kwa neno “usichukue mke” ili kutoa maana ya kawaida ya usemi wa ndoa.
