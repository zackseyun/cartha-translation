  language: sw
  text: Kisha Isaka akamwita Yakobo, akambariki na kumwamuru, akisema, “Usioe mwanamke miongoni mwa binti za Kanaani.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: קרא pamoja na אֶל na mtu humaanisha kumwita au kum召; “akamwita” ni ya kawaida na inafaa mfululizo wa simulizi.
- source_word: וַיְבָרֶךְ
  choice: akambariki
  rationale: ברך ni kitenzi cha kawaida chenye maana ya kubariki.
- source_word: וַיְצַוֵּהוּ
  choice: kumwamuru
  rationale: צוה huonyesha amri yenye mamlaka; “kumwamuru” inadumisha uzito wa agizo la baba.
- source_word: וַיֹּאמֶר לוֹ
  choice: akisema
  rationale: “Akisema” huunganisha kwa kawaida mfululizo wa vitenzi na kuanzisha usemi wa moja kwa moja bila marudio mazito.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: Usioe mwanamke yeyote
  rationale: Katika muktadha huu לקח אשה ni kumchukua mwanamke awe mke, yaani kuoa; usemi huu wa Kiswahili unaweka wazi marufuku ya ndoa.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: miongoni mwa binti za Kanaani
  rationale: Tafsiri hii inahifadhi nahau halisi ya Kiebrania, “binti za Kanaani,” inayowarejelea wanawake Wakanaani.
- source_word: וַ
  choice: Kisha
  rationale: Waw ya mwanzo inaendeleza mfuatano wa simulizi; “Kisha” ni ya asili katika Kiswahili cha kisasa.
