base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: sw
  text: Ndipo Yakobo akaweka nadhiri, akisema, “Ikiwa Mungu atakuwa pamoja nami na kunilinda katika safari hii ninayoenda, na kunipa mkate wa kula na vazi la kuvaa,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: Yakobo akaweka nadhiri
  rationale: Muundo wa kitenzi נדר pamoja na nomino נֶדֶר unaonyesha tendo rasmi la kuweka nadhiri. ‘Akaweka nadhiri’ ni Kiswahili cha kawaida na chenye heshima bila kurudia maneno kwa namna isiyo ya asili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha moja kwa moja yaliyomo katika nadhiri na ni usemi wa kawaida wa simulizi la Kibiblia kwa Kiswahili.
- source_word: אִם
  choice: Ikiwa
  rationale: Huhifadhi wazi muundo wa sharti katika Kiebrania bila kuugeuza kuwa uhakika wala kuufanya uonyeshe shaka zaidi ya maandishi.
- source_word: אֱלֹהִים עִמָּדִי
  choice: Mungu atakuwa pamoja nami
  rationale: Huwasilisha uwepo wa Mungu kwa Yakobo kwa njia ya moja kwa moja; hapa אֱלֹהִים humrejelea Mungu aliyemtokea Yakobo.
- source_word: וּשְׁמָרַנִי
  choice: na kunilinda
  rationale: Mzizi שׁמר unaweza kumaanisha kulinda, kuhifadhi, au kuangalia. ‘Kunilinda’ ni ya asili katika muktadha wa safari na hubeba wazo la ulinzi wa Mungu.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: katika safari hii ninayoenda
  rationale: דֶּרֶךְ kwa msingi ni njia, lakini katika muktadha huu inahusu mwendo au safari ya Yakobo. Tafsiri hii huhifadhi pia kishazi cha Kiebrania kinachoeleza anakoenda bila kuwa nzito kupita kiasi.
- source_word: וְנָתַן לִי
  choice: na kunipa
  rationale: Kitenzi kinaendelea ndani ya sharti lililoanzishwa na ‘ikiwa’; muundo wa Kiswahili wenye ‘na kunipa’ unaunganisha matendo hayo kwa kawaida.
- source_word: לֶחֶם לֶאֱכֹל
  choice: mkate wa kula
  rationale: Huhifadhi neno halisi לֶחֶם, ‘mkate,’ pamoja na matumizi yake yanayoweza pia kuwakilisha chakula kwa ujumla.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: na vazi la kuvaa
  rationale: ‘Vazi’ hutoa maana ya kawaida ya בֶּגֶד na kudumisha ulinganifu wa ‘mkate wa kula’ na ‘vazi la kuvaa.’
theological_decisions:
- issue: Asili ya sharti katika nadhiri ya Yakobo
  choice: ‘Ikiwa Mungu atakuwa pamoja nami’
  alternative: ‘Mungu atakapokuwa pamoja nami’ au ‘Kwa kuwa Mungu atakuwa pamoja nami’
  rationale: Chembe אִם kwa kawaida huanzisha sharti. ‘Ikiwa’ huhifadhi mvutano wa maandishi kuhusu kama Yakobo anaonyesha kutokuwa na hakika au anasema kwa kutegemea ahadi, bila kutatua suala hilo katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. ‘Nadhiri’ ni istilahi iliyozoeleka na sahihi; ‘safari hii ninayoenda’ ni ya kueleweka kwa wasomaji wa kawaida huku ikibaki karibu na muundo wa chanzo.
