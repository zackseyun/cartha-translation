  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: sw
  text: Esau aliona kwamba Isaka alikuwa amembariki Yakobo na kumtuma kwenda Padan-Aramu ili ajichukulie mke kutoka huko, na kwamba Isaka alipombariki Yakobo, alimwamuru akisema, “Usichukue mke kutoka miongoni mwa binti za Kanaani.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka miongoni mwa wanawake Wakanaani.” Kiebrania kinasema kihalisi, “kutoka miongoni mwa binti za Kanaani.”
    reason: Toleo mbadala linafafanua kwamba usemi wa Kiebrania unawahusu wanawake wa Kanaani.
lexical_decisions:
- source_word: וַיַּרְא
  choice: Esau aliona
  rationale: Kitenzi cha masimulizi kinaendeleza tukio; hakuna neno la wazi la wakati linalohitaji kuongezwa kama ‘basi’ au ‘sasa’.
- source_word: בֵרַךְ
  choice: alikuwa amembariki
  rationale: Kauli hii ilitangulia kuona kwa Esau, hivyo muundo huu unaonyesha kwa kawaida mpangilio wa matukio katika Kiswahili.
- source_word: וְשִׁלַּח אֹתוֹ
  choice: na kumtuma
  rationale: Inaunganisha kitendo cha kumtuma na kile cha kumbariki kama mambo ambayo Esau aliyatambua.
- source_word: פַּדֶּנָה אֲרָם
  choice: kwenda Padan-Aramu
  rationale: Jina la mahali limetoholewa kwa namna inayoeleweka katika Kiswahili, huku kiambishi cha mwelekeo cha Kiebrania kikionyeshwa na ‘kwenda’.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: ili ajichukulie mke kutoka huko
  rationale: Inahifadhi kusudi la safari, maana ya kujifanyia mwenyewe iliyo katika לוֹ, na mahali ambako mke angepatikana.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: alipombariki
  rationale: Muundo wa ‘alipo-’ unaonyesha kwa kawaida mazingira ya wakati wa amri bila kuamua zaidi ya maandishi.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: alimwamuru akisema
  rationale: ‘Alimwamuru’ linaonyesha nguvu ya צוה, na ‘akisema’ linahifadhi utangulizi wa maneno ya moja kwa moja.
- source_word: לֹא תִקַּח
  choice: Usichukue
  rationale: Ni katazo la moja kwa moja kwa nafsi ya pili umoja na ni la kawaida, lenye nguvu katika Kiswahili.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: kutoka miongoni mwa binti za Kanaani
  rationale: Inahifadhi picha halisi ya Kiebrania ya ‘binti za Kanaani’ huku ‘miongoni mwa’ ikifanya maana ya kuchagua mke kutoka kundi hilo iwe wazi.
