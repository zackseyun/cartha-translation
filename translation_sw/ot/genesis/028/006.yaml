translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa sentensi ndefu umehifadhi uhusiano wa vipashio vya Kiebrania, lakini umetumiwa kwa mtiririko wa kawaida wa Kiswahili.
