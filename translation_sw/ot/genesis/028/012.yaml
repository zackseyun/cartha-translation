  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: sw
  text: Akaota ndoto, na tazama, ngazi[a] ilikuwa imewekwa ardhini, na kilele chake kilifika mbinguni. Na tazama, malaika wa Mungu walikuwa wakipanda na kushuka juu yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha kwa upana zaidi muundo au njia ya kupandia, si lazima ngazi nyembamba yenye vidato.
    reason: lexical_alternative
  - marker: b
    text: Au yawezekana, “juu yake,” likirejelea Yakobo; hata hivyo, kirejelewa cha kawaida zaidi katika muktadha ni ngazi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: Akaota ndoto
  rationale: Muundo wa masimulizi wa wayyiqtol unaendeleza simulizi; Kiswahili cha “aka-” kinaonyesha mfuatano huo kwa kawaida.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Neno hili linawasilisha kwa msisitizo jambo linaloonekana ghafla katika ndoto; “tazama” linadumisha nguvu hiyo ya kisanaa.
- source_word: סֻלָּם
  choice: ngazi
  rationale: Neno la Kiebrania linaonyesha kitu cha kupandia na kushukia bila kubainisha kwa hakika kama ni ngazi yenye vidato au njia pana ya kupandia. “Ngazi” ni neno la kawaida la Kiswahili linaloweza kubeba taswira hiyo kwa upana.
- source_word: מֻצָּב
  choice: ilikuwa imesimamishwa
  rationale: Kauli tendwa inaonyesha ngazi ikiwa imewekwa na kusimama mahali pake.
- source_word: אַרְצָה
  choice: juu ya ardhi
  rationale: Hali ya ngazi duniani inawekwa kinyume na ncha yake inayofika mbinguni; “ardhi” linafaa kwa utofautishaji huu wa ulimwengu na mbingu.
- source_word: וְרֹאשׁוֹ
  choice: na ncha yake
  rationale: Ingawa רֹאשׁ maana yake ya msingi ni “kichwa,” kwa kitu hurejelea sehemu yake ya juu; “ncha yake” ni Kiswahili cha kawaida katika taswira hii.
- source_word: מַגִּיעַ הַשָּׁמָיְמָה
  choice: ilifika mbinguni
  rationale: Kirai kinaonyesha ncha ya ngazi ikienea hadi mbinguni; tafsiri hii ni ya kawaida na haiongezi wazo la kuzigusa mbingu.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: malaika wa Mungu
  rationale: Katika ndoto hii, wajumbe hao ni viumbe wa mbinguni, hivyo “malaika” linafaa kuliko neno pana zaidi “wajumbe.”
- source_word: עֹלִים וְיֹרְדִים
  choice: walikuwa wakipanda na kushuka
  rationale: Vitenzi vya hali endelevu vinaonyesha mwendo unaoendelea ndani ya maono.
- source_word: בּוֹ
  choice: juu yake
  rationale: Kiwakilishi cha umoja wa kiume kwa kawaida zaidi kinarejelea ngazi iliyotajwa karibu, huku uwezekano wa kurejelea mtu ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Taswira ya סֻלָּם
  choice: ngazi
  alternative: muundo au njia ya kupandia
  rationale: Kiebrania hakilazimishi taswira mahususi ya ngazi nyembamba yenye vidato. “Ngazi” ni tafsiri ya kawaida inayobaki wazi vya kutosha bila kuingiza maana ya kimadhehebu.
- issue: Kirejelewa cha בּוֹ
  choice: juu yake, yaani juu ya ngazi
  alternative: juu yake, yaani juu ya Yakobo
  rationale: Ngazi ndiyo nomino inayotangulia na ndiyo kirejelewa cha kawaida zaidi katika muktadha. Hata hivyo, umbo la Kiebrania linaweza kueleweka kuwa linamrejelea Yakobo, kwa hiyo uwezekano huo umetajwa katika tanbihi bila kuamua mvutano huo kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Akaota ndoto” na “walikuwa wakipanda na kushuka” ni miundo ya kawaida ya kisimulizi; “tazama” limedumishwa ili kuhifadhi msisitizo wa maono. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
