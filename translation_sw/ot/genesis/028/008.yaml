- source_word: בְּנוֹת כְּנָעַן
  choice: binti za Kanaani
  rationale: Hufuata kwa karibu usemi wa Kiebrania na kuhifadhi namna yake ya kifamilia na kikabila.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi nahau ya Kiebrania ya kuonyesha maoni au tathmini, na inaeleweka katika Kiswahili.
- source_word: יִצְחָק אָבִיו
  choice: Isaka baba yake
  rationale: Hufuata mpangilio wa Kiebrania na ni usemi wa kawaida na wazi katika Kiswahili.
