lexical_decisions:
- source_word: וַיַּרְא
  choice: Ndipo Esau akaona
  rationale: Muundo wa masimulizi unaendeleza tukio kwa kitenzi cha kawaida ‘akaona’; ‘ndipo’ huonyesha mwendelezo bila kubadili kuona kuwa kufahamu moja kwa moja.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha maudhui ya jambo ambalo Esau aliona.
- source_word: רָעוֹת
  choice: walikuwa wabaya
