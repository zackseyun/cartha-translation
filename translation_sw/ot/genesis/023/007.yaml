lexical_decisions:
- source_word: וַיָּקָם
  choice: Ndipo Abrahamu akainuka
  rationale: Kitenzi cha Kiebrania קום katika mfululizo wa simulizi kinaonyesha kuinuka au kusimama; “akainuka” ni cha asili katika Kiswahili, na “ndipo” linaonyesha hatua inayofuata.
- source_word: וַיִּשְׁתַּחוּ
  choice: akainama mbele ya
  rationale: Kitenzi שׁחה kinaonyesha kuinama chini kwa heshima. “Akainama mbele ya” huhifadhi tendo la mwili na heshima bila kulazimisha maana ya kujilaza kifudifudi.
- source_word: לְעַם הָאָרֶץ
  choice: mbele ya watu wa nchi hiyo
  rationale: ל hutaja wale walioelekezewa tendo la kuinama; Kiswahili cha asili hutumia “kuinama mbele ya.” עַם הָאָרֶץ imehifadhiwa kwa karibu kama “watu wa nchi hiyo,” ikimaanisha wenyeji wa eneo hilo.
- source_word: לִבְנֵי חֵת
  choice: wana wa Hethi
  rationale: Tafsiri ya karibu ya muundo wa Kiebrania “wana wa Hethi,” unaolitaja kundi kwa nasaba; “Wahiti” ni kisawe cha kimuktadha na kimetolewa katika tanbihi.
- source_word: חֵת
  choice: Hethi
  rationale: Jina limeandikwa kwa umbo la Kiswahili linalotambulika na linalofaa kwa matamshi ya Kiswahili.
