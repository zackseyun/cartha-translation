base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: sw
  text: Sara akafa katika Kiriath-arba, yaani Hebroni[a], katika nchi ya Kanaani. Abrahamu akaja kumwombolezea Sara na kumlilia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiriath-arba hapa linatambulishwa kuwa Hebroni.
    reason: cross_reference
  - marker: b
    text: Au, “kumfanyia Sara maombolezo na kumlilia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: akafa
  rationale: Kitenzi מות kinasema kifo moja kwa moja; “akafa” ni Kiswahili cha kawaida na chenye uzito unaofaa, bila kupunguza ukali wa kauli.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: huko Kiriath-arba
  rationale: Jina la mahali limetoholewa kwa herufi za Kilatini badala ya kutafsiriwa; “huko” linaonyesha mahali palipotajwa katika simulizi.
- source_word: הִוא חֶבְרוֹן
  choice: yaani, Hebroni
  rationale: Kauli hii ya Kiebrania inatambulisha Kiriath-arba kuwa Hebroni; “yaani” huwasilisha ufafanuzi huo kwa Kiswahili cha sasa.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Neno אֶרֶץ limetafsiriwa wazi kuwa “nchi,” hivyo muundo kamili wa Kiebrania umehifadhiwa.
- source_word: וַיָּבֹא
  choice: akaja
  rationale: בוא inaweza kumaanisha kuja au kwenda kulingana na mtazamo; “akaja” linafuata mtazamo wa simulizi bila kuongeza maelezo ya mahali.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: kumwombolezea Sara
  rationale: ספד hueleza maombolezo, mara nyingi yaliyo wazi au yenye vilio; “kumwombolezea” ni la asili katika muktadha wa msiba na linahifadhi mhusika anayelengwa.
- source_word: וְלִבְכֹּתָהּ
  choice: na kumlilia
  rationale: בכה ni kulia kwa huzuni; “kumlilia” linahifadhi kiambishi cha yambwa kinachomrejelea Sara na linafaa kwa sajili ya msiba.
