lexical_decisions:
- source_word: וַיָּקָם
  choice: Kisha Abrahamu akainuka
  rationale: Kitenzi cha usimulizi kinaendeleza mfuatano wa matukio; “kisha ... akainuka” ni Kiswahili cha kawaida na huhifadhi tendo la kuinuka.
- source_word: מֵעַל פְּנֵי
  choice: kutoka mbele ya
  rationale: Huhifadhi kwa ukaribu nahau ya Kiebrania inayomaanisha kuondoka mbele ya au karibu na mwili wa marehemu.
- source_word: מֵתוֹ
  choice: marehemu wake
  rationale: Kiebrania kinasema kwa ufupi “mfu wake/marehemu wake.” “Marehemu wake” ni ya asili na yenye staha katika Kiswahili, huku muktadha ukibainisha kwamba ni Sara bila kuongeza neno “mke” katika maandishi.
- source_word: וַיְדַבֵּר אֶל
  choice: akasema na
  rationale: Muundo huu unamaanisha kusema au kuzungumza na watu fulani. “Akasema na” ni wa kawaida na pia huacha “akisema” itangulize maneno yanayofuata.
- source_word: בְּנֵי חֵת
  choice: wana wa Hethi
  rationale: Huhifadhi usemi halisi wa Kiebrania, “wana wa Hethi,” badala ya kuugeuza moja kwa moja kuwa jina la kabila.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Huhifadhi kiunganishi rasmi kinachotanguliza yaliyomo katika hotuba ya mstari unaofuata.
