  text: וְ/יִתֶּן לִ֗/י אֶת מְעָרַ֤ת הַ/מַּכְפֵּלָה֙ אֲשֶׁר ל֔/וֹ אֲשֶׁ֖ר בִּ/קְצֵ֣ה שָׂדֵ֑/הוּ בְּ/כֶ֨סֶף מָלֵ֜א יִתְּנֶ֥/נָּה לִ֛/י בְּ/תוֹכְ/כֶ֖ם לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: sw
  text: ili anipe pango la Makpela, ambalo ni lake, lililo kwenye ukingo wa shamba lake.[a] Kwa malipo kamili ya fedha,[b] anipe pango hilo miongoni mwenu, liwe milki ya maziko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lililo mwisho wa shamba lake.” Neno la Kiebrania linaweza kumaanisha ukingo, mwisho, au sehemu ya mbali ya shamba.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kwa fedha kamili,” nahau inayomaanisha kulipa bei yote.
    reason: lexical_alternative
  - marker: c
    text: Au, “liwe milki ya kaburi.” Kiebrania kinakazia umiliki halali wa eneo hilo, wala si ruhusa tu ya kulitumia kwa maziko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן לִי
  choice: ili anipe
  rationale: Katika muktadha wa ombi la Abrahamu lililoanza katika mstari uliotangulia, umbo hili linaeleza kusudi la kuwaomba watu wamshawishi Efroni; “ili anipe” ni Kiswahili cha kawaida kinachohifadhi ombi hilo.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: pango la Makpela
  rationale: Muundo wa Kiebrania unaunganisha nomino na jina maalumu; “pango la Makpela” ni wazi na hulihifadhi jina kwa unukuzi.
- source_word: אֲשֶׁר לוֹ
  choice: ambalo ni lake
  rationale: Kauli hii rahisi inaonyesha umiliki bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: lililo kwenye ukingo wa shamba lake
  rationale: קָצֶה inaweza kumaanisha ukingo, mwisho, au sehemu ya mbali. “Ukingo” ni ya asili katika maelezo ya mipaka ya shamba, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: בְּכֶסֶף מָלֵא
  choice: kwa malipo kamili ya fedha
  rationale: Hii ni nahau ya kulipa thamani yote, si kupata zawadi au punguzo. Tafsiri hii inaeleza maana ya biashara na bado inataja fedha.
- source_word: יִתְּנֶנָּה לִי
  choice: na anipe pango hilo
  rationale: Kitenzi cha chanzo ni נתן, “kutoa/kumpa,” hata katika shughuli yenye malipo. “Anipe” hulihifadhi hilo; “pango hilo” huweka wazi kiwakilishi cha kike cha Kiebrania kwa Kiswahili.
- source_word: בְּתוֹכְכֶם
  choice: mbele yenu
  rationale: Katika mazungumzo haya ya hadhara, maneno haya yanaonyesha kwamba jumuiya inashuhudia na kutambua uhamisho wa mali. “Mbele yenu” ni Kiswahili cha kawaida kuliko tafsiri sisisi “katikati yenu.”
- source_word: לַאֲחֻזַּת קָבֶר
  choice: liwe milki ya kuzikia
  rationale: אֲחֻזָּה ni mali au milki inayoshikiliwa kisheria, si ruhusa ya kutumia mahali kwa muda tu. “Milki ya kuzikia” huhifadhi uzito huo wa umiliki.
