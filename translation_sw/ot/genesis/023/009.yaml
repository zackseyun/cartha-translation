  to: ili anipe pango la Makpela, ambalo ni lake, lililo kwenye ukingo wa shamba lake.[a] Kwa malipo kamili ya fedha,[b] anipe pango hilo miongoni mwenu, liwe milki ya maziko.[c]
  rationale: The revision renders בְּתוֹכְכֶם directly as “miongoni mwenu,” preserving the public communal setting without overinterpreting it as physical presence alone. It also recasts the final purpose clause as “liwe milki ya maziko,” which is idiomatic Swahili and retains the legal force of אֲחֻזַּת קָבֶר. The opening “ili anipe” is retained because this verse continues Abraham's request from the preceding verse.
