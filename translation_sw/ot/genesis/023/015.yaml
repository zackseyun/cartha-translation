  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo wa Kiebrania: mwito wa heshima wa umoja, ombi la kusikilizwa, ardhi yenye thamani ya shekeli mia nne za fedha, swali la balagha la kupunguza uzito wa bei, na amri ya kumzika aliyekufa. “Mzike marehemu wako” huwasilisha kwa kawaida amri ya umoja yenye ‘mfu wako’ bila kuongeza tafsiri ya kidhehebu.'
