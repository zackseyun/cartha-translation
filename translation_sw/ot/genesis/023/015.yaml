  terminology: “Bwana wangu” ni mwito wa heshima kwa binadamu na hauleti madai ya cheo cha uungu katika muktadha huu. “Shekeli mia nne za fedha” huhifadhi kipimo na dutu ya fedha ya chanzo. “Marehemu wako” ni istilahi yenye heshima na inayoeleweka kwa urahisi kwa mfu mmoja anayelengwa katika muktadha.
