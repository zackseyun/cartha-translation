base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: sw
  text: '“Bwana wangu, nisikilize: kipande cha ardhi chenye thamani ya shekeli mia nne za fedha[a]—hicho ni kitu gani kati yangu na wewe? Mzike marehemu wako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “ardhi—shekeli mia nne za fedha—hiyo ni kitu gani kati yangu na wewe?” Kiebrania kimefupisha usemi, na swali hili la balagha linapunguza uzito wa bei wakati wa mazungumzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Ni namna ya heshima ya kumwambia Efroni, si jina la Mungu. Inahifadhi unyenyekevu wa kijamii na umoja wa anayesemeshwa.
- source_word: שְׁמָעֵנִי
  choice: nisikilize
  rationale: Kauli ya kuomba kwa heshima lakini moja kwa moja; ni Kiswahili cha kawaida na cha sasa.
- source_word: אֶרֶץ
  choice: kipande cha ardhi
  rationale: Katika mazungumzo haya neno linamaanisha eneo maalumu la mali, si ardhi kwa ujumla.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: chenye thamani ya shekeli mia nne za fedha
  rationale: Kiebrania kimefupisha usemi wa thamani au bei ya ardhi. Kirai hiki kinaifanya maana ieleweke kwa Kiswahili bila kubadili kiasi au fedha inayotajwa.
- source_word: בֵּינִי וּבֵינְךָ
  choice: kati yangu na wewe
  rationale: Inahifadhi nafsi ya kwanza na ya pili katika umoja na sauti binafsi ya mazungumzo.
- source_word: מַה הִוא
  choice: hicho ni kitu gani
  rationale: Ni swali la balagha linalopunguza uzito wa kiasi hicho kati ya wahusika wawili.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: Mzike marehemu wako
  rationale: Amri ya moja kwa moja inamhusu Sara, mtu aliyekufa. ‘Marehemu’ ni neno la sasa, la heshima na linaloeleweka kwa urahisi.
