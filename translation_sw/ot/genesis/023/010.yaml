  terminology: “Efroni,” “Abrahamu,” “wana wa Hethi,” na “Mhiti” ni sahihi na zinaendeleza tofauti iliyopo katika Kiebrania kati ya usemi wa ukoo na utambulisho wa kikabila. Maelezo ya chini ya ukurasa yanabaki yanafaa.
