base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: sw
  text: Efroni alikuwa ameketi miongoni mwa wana wa Hethi[a], naye Efroni, Mhiti, akamjibu Abrahamu, huku wana wa Hethi wakisikia, mbele ya wote walioingia katika lango la mji wake, akisema:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wahiti” badala ya “wana wa Hethi” katika sehemu zote mbili; Kiebrania kinasema kihalisi “wana wa Hethi.”
    reason: lexical_alternative
  - marker: b
    text: Lango la mji lilikuwa mahali pa hadhara ambapo shughuli za kisheria na kibiashara zilifanywa mbele ya mashahidi.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: alikuwa ameketi
  rationale: Kirai hiki huonyesha hali ya Efroni wakati wa tukio, si tendo rahisi lililokamilika.
- source_word: בְּתוֹךְ
  choice: kati ya
  rationale: Katika mazingira haya ya kusanyiko, maana ni kuwa miongoni mwa kundi lililokusanyika.
- source_word: בְּנֵי חֵת
  choice: wana wa Hethi
  rationale: Huhifadhi kwa uwazi usemi halisi wa Kiebrania na kuutofautisha na jina la kikabila 'Mhiti' linalofuata.
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Ni tafsiri ya kawaida na ya asili katika mazungumzo; kiambishi cha yambwa humtaja Abrahamu wazi.
- source_word: הַחִתִּי
  choice: Mhiti
  rationale: Hili ni jina la kikabila linalomtambulisha Efroni; Kiswahili kwa kawaida halihitaji kibainishi cha pekee hapa.
- source_word: בְּאָזְנֵי
  choice: huku ... wakisikia
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kusema hadharani ndani ya usikivu wa mashahidi.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: huku wote waliokuwa wakiingia katika lango la mji wake wakisikia
  rationale: Hutaja hadhara ya mashahidi waliokuwapo penye lango na kuhifadhi maana ya tendo lililofanyika hadharani.
- source_word: שַׁעַר עִירוֹ
  choice: lango la mji wake
  rationale: Huhifadhi muundo na maana ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: לֵאמֹר
  choice: 'Alisema:'
  rationale: Huanzisha kwa kawaida maneno ya moja kwa moja yanayofuata katika mstari unaofuata.
