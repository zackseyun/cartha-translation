lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: wakamjibu
  rationale: Kitenzi ענה katika Qal wayyiqtol kinaonyesha jibu linalofuata katika masimulizi; “wakamjibu” ni Kiswahili cha kawaida na kinahifadhi mfuatano wa simulizi.
- source_word: בְנֵי חֵת
  choice: Wana wa Hethi
  rationale: Tafsiri hii inahifadhi kwa karibu usemi wa Kiebrania wa ukoo, “wana wa Hethi,” pamoja na jina la mtu Hethi; “Wahiti” limetolewa kama uwezekano katika tanbihi.
- source_word: אֶת אַבְרָהָם
  choice: Abrahamu
  rationale: אֶת ni kiashiria cha yambwa maalumu na hakihitaji neno tofauti katika Kiswahili; jina limetolewa kwa umbo la Kiswahili “Abrahamu.”
- source_word: לֵאמֹר
  choice: wakimwambia
  rationale: Muundo huu hutanguliza maneno ya moja kwa moja. “Wakimwambia” ni wa asili katika Kiswahili na, pamoja na kiambishi -mw-, unaonyesha kuwa maneno yanaelekezwa kwa Abrahamu.
- source_word: לוֹ
  choice: -mw- katika “wakimwambia”
  rationale: Kihusishi ל pamoja na kiambishi cha nafsi ya tatu umoja wa kiume kimewakilishwa ndani ya kitenzi cha Kiswahili, kikimtambulisha Abrahamu kuwa anayeambiwa.
