  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: sw
  text: Akazungumza nao, akisema, “Ikiwa mnataka nimzike marehemu wangu, nimwondoe mbele yangu, nisikilizeni, mkamwombe Efroni mwana wa Sohari kwa niaba yangu[a],”
  philosophy: optimal-equivalence
  footnotes:
