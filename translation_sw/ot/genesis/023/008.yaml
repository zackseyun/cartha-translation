    text: Au, “mkamsihi Efroni mwana wa Sohari kwa niaba yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwendea mtu au kumtolea ombi kwa niaba ya mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: Akazungumza nao, akisema
  rationale: Muundo huu unahifadhi wazo la kusema nao na fomula ya Kiebrania inayoanzisha usemi wa moja kwa moja, huku ukiendelea kueleweka katika Kiswahili sanifu.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: Ikiwa mnataka
  rationale: Hii ni nahau inayoonyesha nia au utayari wao; tafsiri hii ni ya kawaida na haileti matumizi magumu ya neno ‘nafsi’.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: nimzike marehemu wangu
  rationale: Kiambishi cha nafsi ya kwanza kinachoeleweka katika kitenzi-jina kimewekwa wazi. ‘Marehemu wangu’ huhifadhi umoja na uhusiano bila kuongeza kwamba ni mke katika matini.
- source_word: מִלְּפָנַי
  choice: mbali na macho yangu
  rationale: Kimsingi ni ‘kutoka mbele yangu’; katika muktadha wa mazishi, usemi huu unaonyesha kumwondoa marehemu asionekane mbele yake.
- source_word: שְׁמָעוּנִי
  choice: nisikilizeni
  rationale: Amri hii ya wingi inawataka wasikie na kuitikia ombi lake; ‘nisikilizeni’ ni ya moja kwa moja na ya sasa.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: mkamsihi Efroni ... kwa niaba yangu
  rationale: פגע pamoja na ב katika muktadha huu inaweza kumaanisha kumfikia mtu kwa ombi au kumsihi. Tafsiri hii inaonyesha kwamba wazungumze na Efroni kwa niaba ya Abrahamu bila kudokeza utaratibu rasmi wa kidini.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: Efroni mwana wa Sohari
  rationale: Majina yamenukuliwa kwa maumbo yanayofaa matamshi ya Kiswahili, na בן imetafsiriwa wazi kuwa ‘mwana wa’.
