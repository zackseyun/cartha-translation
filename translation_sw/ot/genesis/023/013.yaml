base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: sw
  text: 'Akanena na Efroni mbele ya watu wa nchi, akisema, “Laiti ungenisikiliza[a]: ninakupa fedha kwa ajili ya shamba[b]; ipokee kutoka kwangu, ili nimzike marehemu wangu huko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tafadhali, nisikilize.” Kiebrania kina ombi la adabu lenye muundo usio kamili.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “nimeitoa fedha ya shamba.” Kauli timilifu huenda inaonyesha toleo rasmi katika mapatano; pia yaweza kueleweka, “nitakupa fedha kwa ajili ya shamba.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Akanena na
  rationale: Kitenzi דבר kinaonyesha kusema au kunena; “akanena na” kinadumisha mtiririko wa simulizi na uzito wa mazungumzo rasmi.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: watu wa nchi wakisikia
  rationale: Hii ni nahau yenye maana ya kusema hadharani huku jamii ya eneo hilo ikisikia; tafsiri hii ni ya kawaida kuliko “masikioni mwa” bila kupoteza mazingira ya kisheria na kijamii.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: Laiti unisikilize
  rationale: Kifungu hiki ni cha kusihi kwa adabu na kina muundo usio kamili. “Laiti unisikilize” kinafikisha nguvu ya ombi bila kulazimisha ufafanuzi wa ziada.
- source_word: נָתַתִּי כֶּסֶף הַשָּׂדֶה
  choice: ninakupa fedha ya shamba
  rationale: Kauli timilifu ya Kiebrania hapa yaweza kuwa toleo rasmi linalotekelezwa kwa kutamkwa katika mapatano. Wakati wa sasa wa Kiswahili unaonyesha utoaji huo wa papo hapo; “fedha” huhifadhi maana halisi ya כֶּסֶף na pia matumizi yake kama malipo.
- source_word: קַח מִמֶּנִּי
  choice: ipokee kutoka kwangu
  rationale: Ingawa קח kimsingi ni “chukua,” katika mapatano haya Abrahamu anamwomba Efroni aikubali fedha. “Ipokee” ni ya asili katika Kiswahili na kiwakilishi “i-” kinarejelea fedha iliyotajwa.
- source_word: וְאֶקְבְּרָה
  choice: ili nimzike
  rationale: Umbo la cohortative linaonyesha kusudi la Abrahamu; “ili nimzike” linaeleza kusudi hilo kwa Kiswahili cha kawaida.
- source_word: מֵתִי
  choice: maiti wangu
  rationale: Kiebrania kinasema kihalisi “mfu wangu/maiti wangu.” Tafsiri hii inadumisha usemi wa jumla na uzito wake bila kuingiza jina la Sara kutoka muktadha.
- source_word: שָׁמָּה
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea shamba au eneo linalozungumziwa; “huko” ni sawa ya kawaida katika Kiswahili.
