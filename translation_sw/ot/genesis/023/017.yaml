base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: sw
  text: Basi shamba la Efroni lililoko Makpela, mbele ya Mamre—shamba hilo, pango lililokuwa ndani yake, na kila mti uliokuwa shambani, katika mipaka yake yote inayolizunguka—likathibitishwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “likaimarishwa kisheria” au “umiliki wake ukahamishwa”; hapa kitenzi cha Kiebrania huenda kina maana ya kisheria ya kuthibitisha umilikaji katika muktadha wa mauzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: likathibitishwa
  rationale: Katika muktadha huu wa ununuzi wa ardhi, kitenzi קום kina maana ya kisheria ya kuthibitisha au kuhalalisha mali katika shughuli hiyo, si kusimama kimwili tu.
- source_word: שְׂדֵה עֶפְרוֹן
  choice: shamba la Efroni
  rationale: Muundo wa umilikaji wa Kiebrania unatafsiriwa kwa kawaida na kwa uwazi kuwa “shamba la Efroni.”
- source_word: בַּמַּכְפֵּלָה
  choice: lililokuwa Makpela
  rationale: Makpela ni jina la mahali; muundo huu unaonyesha mahali shamba lilipokuwa bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: לִפְנֵי מַמְרֵא
  choice: mbele ya Mamre
  rationale: Huhifadhi maana ya msingi ya לִפְנֵי na kutobainisha bila ushahidi kama ni upande wa mashariki, kuelekeana, au karibu.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: yaani, shamba hilo, pango lililokuwa ndani yake
  rationale: “Yaani” huonyesha uorodheshaji wa kisheria unaofafanua mali iliyohusika, huku shamba na pango vikitajwa kando kama katika Kiebrania.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: na kila mti uliokuwa shambani
  rationale: כָל pamoja na nomino ya umoja yenye maana ya mkusanyiko inaweza kutafsiriwa kwa usambazaji kuwa “kila mti,” jambo linalofaa katika orodha ya mali.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: ndani ya mipaka yake yote kuzunguka
  rationale: Huwasilisha wazo la eneo lote lililomo ndani ya mpaka wake wa pande zote, kwa lugha ya Kiswahili inayoeleweka huku ikihifadhi msisitizo wa kisheria.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mtindo wa orodha ya kisheria wa chanzo, huku “yaani” ikisaidia uwazi. Alama ya tanbihi [a] imewekwa baada ya kitenzi kinachohusika.
