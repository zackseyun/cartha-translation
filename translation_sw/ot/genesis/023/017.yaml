review_pass:
  verdict: revise
  source_fidelity: The draft correctly captures the legal/property-confirmation force of וַיָּקָם, the inventory-like enumeration, and the deliberately non-specific spatial expression לִפְנֵי מַמְרֵא. However, “lililokuwa Makpela” is not idiomatic for a location and should be replaced with a locative expression.
  naturalness: The sentence generally maintains an appropriate formal legal-register style. “Yaani” adds an explanatory relation not required by the Hebrew, while “ndani ya mipaka yake yote kuzunguka” is awkward. A more direct inventory construction and clearer boundary phrase are preferable.
  terminology: “Efroni,” “Makpela,” and “Mamre” are suitable established transliterations. “Likathibitishwa” is an appropriate rendering of the legal sense in context. The note should avoid the ambiguous added referent in “kuwa mali yake.”
  issues:
  - severity: medium
    issue: 'Non-idiomatic location clause: “lililokuwa Makpela.”'
    rationale: For a field situated at a named place, Standard East African Swahili naturally uses “lililoko Makpela” or “lililokuwa katika Makpela.” The draft wording can sound as though Makpela is a temporal/state predicate rather than a location.
  - severity: low
    issue: “Yaani” adds an explicit explanatory gloss.
    rationale: The Hebrew resumes and inventories the property components; it does not explicitly say “that is.” Removing it preserves the formal cadastral style more closely.
  - severity: medium
    issue: “ndani ya mipaka yake yote kuzunguka” is syntactically awkward.
    rationale: The source emphasizes the entire surrounding boundary. “katika mipaka yake yote inayolizunguka” expresses this comprehensively and naturally without altering the legal scope.
  - severity: low
    issue: Footnote alternative “likahamishwa kuwa mali yake” has an unspecified possessive referent.
    rationale: The Hebrew verse itself does not state “whose” property it became. “umiliki wake ukahamishwa” retains the transfer alternative without introducing an ambiguous owner.
  revised_text: Basi shamba la Efroni lililoko Makpela, mbele ya Mamre—shamba hilo, pango lililokuwa ndani yake, na kila mti uliokuwa shambani, katika mipaka yake yote inayolizunguka—likathibitishwa[a].
  revised_footnotes:
  - marker: a
    text: Au “likaimarishwa kisheria” au “umiliki wake ukahamishwa”; hapa kitenzi cha Kiebrania huenda kina maana ya kisheria ya kuthibitisha umilikaji katika muktadha wa mauzo.
    reason: lexical_alternative
  revision_rationale: The revision corrects the locative construction, removes an unnecessary explanatory insertion, and smooths the boundary wording while preserving the Hebrew legal inventory, its comprehensive scope, and the cautious legal sense reflected in the footnote.
