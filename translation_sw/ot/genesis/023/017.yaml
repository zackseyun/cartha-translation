- from: Basi shamba la Efroni lililokuwa Makpela, mbele ya Mamre—yaani, shamba hilo, pango lililokuwa ndani yake, na kila mti uliokuwa shambani, ndani ya mipaka yake yote kuzunguka—likathibitishwa[a].
  to: Basi shamba la Efroni lililoko Makpela, mbele ya Mamre—shamba hilo, pango lililokuwa ndani yake, na kila mti uliokuwa shambani, katika mipaka yake yote inayolizunguka—likathibitishwa[a].
