  source_fidelity: 'Msingi wa tafsiri unafuata Kiebrania vizuri: Abrahamu anamsikiliza Efroni, anapima fedha, kiasi kinatajwa hadharani mbele ya wana wa Hethi, na kiasi ni shekeli mia nne za fedha. Hata hivyo, kishazi ''aliyokuwa ametaja wana wa Hethi wakisikia'' kinaweza kisomeke kana kwamba Abrahamu ndiye aliyetaja fedha, ilhali kitenzi cha Kiebrania kinamrejelea Efroni. Pia ''akampimia'' peke yake halielezi kwa uwazi tendo la kupima kwa uzani.'
  naturalness: Kiswahili ni sanifu kwa ujumla, lakini kurejesha kiima 'Efroni alikuwa amesema' na kupanga upya 'wana wa Hethi wakisikia' kunafanya sentensi iwe wazi na ya asili zaidi. 'Kwa kipimo kinachokubalika kwa wafanyabiashara' hutoa usemi wa kawaida unaohifadhi uwezekano wa maana ya kiwango cha kibiashara.
