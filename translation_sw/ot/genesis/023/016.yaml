base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: sw
  text: 'Basi Abrahamu akamsikiliza Efroni, akampimia Efroni kwa mizani fedha ambayo Efroni alikuwa amesema, wana wa Hethi[a] wakisikia: shekeli mia nne za fedha, kwa kipimo kinachokubalika kwa wafanyabiashara[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wahiti”; kihalisi, “wana wa Hethi.”
    reason: lexical_alternative
  - marker: b
    text: Au “iliyokuwa ikitumika katika biashara,” au “kwa kipimo cha kawaida cha wafanyabiashara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: Abraham akamsikiliza Efroni
  rationale: Nahau שׁמע אל humaanisha kumsikiliza au kumtii mtu. “Akamsikiliza” inadokeza kuwa Abraham alikubali kuendelea kwa masharti ya Efroni bila kuongeza wazo la makubaliano rasmi lisilotajwa wazi.
- source_word: וַיִּשְׁקֹל
  choice: akampimia
  rationale: Kitenzi שקל kinamaanisha kupima kwa uzani, hasa fedha kabla ya matumizi ya sarafu. “Akampimia” kinahifadhi tendo halisi la kupima fedha na pia kinaonyesha kuwa fedha hiyo ilitolewa kwa Efroni.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: כֶּסֶף ni fedha kama metali na pia malipo. Neno la Kiswahili “fedha” linahifadhi maana zote mbili kwa kawaida.
- source_word: אֲשֶׁר דִּבֶּר
  choice: aliyokuwa ametaja
  rationale: Ingawa דבר kimsingi ni “kusema,” katika muktadha huu kinarejelea kiasi cha fedha ambacho Efroni alikuwa amekisema. “Ametaja” ni la kawaida katika mazungumzo ya bei bila kuondoa maana ya usemi.
- source_word: בְּאָזְנֵי בְנֵי חֵת
  choice: wana wa Hethi wakisikia
  rationale: Hili linaonyesha kwa Kiswahili cha kawaida kwamba bei ilitajwa hadharani mbele ya mashahidi, huku likihifadhi wazi kipengele cha kusikia kilicho katika nahau ya Kiebrania “masikioni mwa.”
- source_word: בְנֵי חֵת
  choice: wana wa Hethi
  rationale: Tafsiri hii inahifadhi muundo wa kikabila na kifamilia wa Kiebrania. Jina linalofahamika zaidi, “Wahiti,” limetolewa katika tanbihi.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: shekeli mia nne za fedha
  rationale: Hii inahifadhi kipimo cha kale na aina ya mali iliyopimwa kwa lugha iliyo wazi na ya kawaida.
- source_word: עֹבֵר לַסֹּחֵר
  choice: iliyokubalika katika biashara
  rationale: Nahau hii inaelekea kumaanisha fedha iliyotambulika au iliyokubalika katika shughuli za biashara. Tafsiri hii ni ya asili kwa Kiswahili na haifungi kabisa uwezekano wa maana ya kipimo cha kawaida cha wafanyabiashara.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “wana wa Hethi wakisikia” unaepuka usemi usio wa kawaida “masikioni mwa” lakini unahifadhi hali ya shughuli hiyo kufanyika hadharani. “Fedha” imetumiwa kwa maana ya metali ya malipo, si sarafu za kisasa.
