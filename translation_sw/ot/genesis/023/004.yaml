base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: sw
  text: Mimi ni mgeni na mkazi kati yenu. Nipeni sehemu ya ardhi ya kuzikia[a] kati yenu, ili nimzike marehemu wangu mbali na macho yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa kuzikia”; neno la Kiebrania pia lina maana ya ardhi inayoshikiliwa kama milki, wala si mahali tu pa kuchimba kaburi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “kutoka mbele yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: mgeni
  rationale: Neno hili humaanisha mtu anayeishi nje ya ukoo na nchi yake bila hadhi kamili ya mwenyeji; “mgeni” ni la kawaida na linadumisha hali ya Abrahamu ya kuwa mtu wa nje.
- source_word: וְתוֹשָׁב
  choice: na mkazi
  rationale: תוֹשָׁב humwonyesha mtu anayeishi mahali bila kuwa mwenyeji mwenye haki kamili ya kumiliki ardhi. “Mkazi” linaweka mvutano wa maana katika jozi “mgeni na mkazi” bila kuongeza wazo lisilotajwa wazi la muda mfupi.
- source_word: עִמָּכֶם
  choice: kati yenu
  rationale: Ingawa kwa msingi ni “pamoja nanyi,” hapa kirai kinaonyesha kuishi na kushughulika ndani ya jamii yao; “kati yenu” ni Kiswahili cha asili katika miktadha yote miwili.
- source_word: תְּנוּ לִי
  choice: Nipeni
  rationale: Amri ya נתן ni ombi la moja kwa moja. “Nipeni” huhifadhi uwazi huo bila kuamua kama mali itatolewa bure au kwa malipo, jambo linalofafanuliwa baadaye katika simulizi.
- source_word: אֲחֻזַּת קֶבֶר
  choice: milki ya kaburi
  rationale: אֲחֻזָּה linaweza kumaanisha ardhi inayoshikiliwa kama milki, si mahali tu pa kuchimba kaburi. “Milki ya kaburi” inadumisha uzito wa kisheria na wa umiliki ulio muhimu katika sura hii.
- source_word: וְאֶקְבְּרָה
  choice: ili nimzike
  rationale: Umbo la hiari linalofuata ombi linaonyesha kusudi; “ili nimzike” ni la asili na linawasilisha kusudi hilo.
- source_word: מֵתִי
  choice: mfu wangu
  rationale: Kiebrania kinamtaja marehemu wa familia kwa usemi mfupi “mfu wangu” bila kumtaja Sara kwa jina. Tafsiri hii inadumisha usemi huo bila kuongeza ufafanuzi.
- source_word: מִלְּפָנַי
  choice: mbali na macho yangu
  rationale: Maana ya neno kwa neno ni “kutoka mbele yangu.” Katika muktadha wa maziko, “mbali na macho yangu” ni Kiswahili cha kawaida kinachohifadhi picha ya kutomwona tena marehemu.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Jozi “mgeni na mkazi” imehifadhi mvutano wa hali ya Abrahamu: anaishi ndani ya jamii hiyo lakini hana hadhi kamili ya mwenyeji mwenye ardhi. Lugha ya “milki” inadumisha mwelekeo wa kisheria wa sura hii.'
