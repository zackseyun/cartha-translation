  naturalness: “Mgeni na mkazi,” “Nipeni,” and “kati yenu” are natural Standard East African Swahili. Replacing “milki ya kaburi” with “sehemu ya ardhi ya kuzikia” gives a clear, idiomatic expression for the requested burial holding. “Marehemu wangu” is more current and respectful than the relatively uncommon nominal “mfu wangu.”
  terminology: The revised wording retains the legal-landed nuance of אֲחֻזַּת through “sehemu ya ardhi,” with the footnote explicitly preserving the sense of a holding or possession. “Marehemu wangu” appropriately renders the Hebrew idiom מֵתִי without identifying Sarah by name.
