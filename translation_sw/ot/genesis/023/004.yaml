  - severity: low
    issue: “mfu wangu” is less idiomatic in contemporary formal Swahili.
    rationale: Although lexically possible, “marehemu wangu” is more natural and suitably respectful while retaining the source’s non-specific reference to Abraham’s deceased family member.
