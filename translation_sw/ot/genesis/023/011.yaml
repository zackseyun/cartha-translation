base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: sw
  text: '“La, bwana wangu, nisikilize: ninakupa shamba, na pango lililomo ninakupa. Mbele ya watu wa jamii yangu[a] ninakupa hilo. Mzike mfu wako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ninakupa hadharani mbele ya watu wa jamii yangu.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: La
  rationale: Hapa ni jibu la heshima la kukataa au kusahihisha pendekezo la Abrahamu; “La” ni la kawaida na lina nguvu inayofaa katika Kiswahili.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumwita Abrahamu na huhifadhi unyenyekevu wa kijamii bila kudokeza lazima uhusiano wa utumwa.
- source_word: שְׁמָעֵנִי
  choice: nisikilize
  rationale: Amri hii ni ombi la moja kwa moja la Abrahamu atilie maanani maneno ya Efroni; “nisikilize” ni Kiswahili cha sasa na cha asili.
- source_word: הַשָּׂדֶה
  choice: shamba
  rationale: Neno hili humaanisha shamba au eneo la wazi; katika muktadha wa uhamishaji wa mali, “shamba” ni wazi na mahususi.
- source_word: נָתַתִּי לָךְ
  choice: ninakupa
  rationale: Kauli timilifu ya Kiebrania inatumika hapa kama tendo linalotekelezwa kwa kutamkwa; wakati wa sasa wa Kiswahili huonyesha utoaji unaofanyika katika maneno hayo.
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: pango lililomo ndani yake
  rationale: Huhifadhi wazi uhusiano wa mahali kati ya pango na shamba, huku ikiwa ya kawaida katika Kiswahili.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: Mbele ya watu wa jamii yangu
  rationale: Nahau halisi ni “mbele ya macho ya wana wa watu wangu”; tafsiri hii huwasilisha tendo la hadharani mbele ya mashahidi wa jamii bila Kiswahili kisicho cha kawaida.
- source_word: קְבֹר מֵתֶךָ
  choice: Mzike mfu wako
  rationale: Huhifadhi amri ya moja kwa moja na umoja wa Kiebrania, unaomrejelea Sara bila kumtaja moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Marudio ya “ninakupa” yamehifadhiwa kwa sababu yanaonyesha msisitizo wa tamko la hadharani la uhamishaji wa mali. “Watu wa jamii yangu” limetumiwa badala ya tafsiri sisisi “wana wa watu wangu,” ambayo si ya kawaida katika Kiswahili.
