base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: sw
  text: “Tusikilize, bwana wangu. Wewe ni mkuu wa Mungu[a] miongoni mwetu. Mzike mfu wako katika makaburi yetu yaliyo bora zaidi. Hakuna hata mmoja wetu atakayekunyima kaburi lake ili kukuzuia kumzika mfu wako.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu mwenye nguvu sana miongoni mwetu.” Kirai cha Kiebrania “mkuu wa Mungu” kinaweza kutumiwa kama namna ya kusisitiza kiwango cha juu sana.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi na muundo wa Kiebrania, “hakuna hata mmoja wetu atakayekunyima kaburi lake kutokana na kumzika mfu wako.” Kifungu hiki kina maana ya kumzuia kumzika mfu wake.
    reason: source_structure
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: Tusikilize
  rationale: Ni amri yenye kiambishi cha nafsi ya kwanza wingi; “tusikilize” ni ombi la moja kwa moja na la kawaida katika Kiswahili.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Inahifadhi heshima na unyenyekevu wa namna Abrahamu anavyoitwa, bila kuifanya kuwa cheo cha kidini.
- source_word: נְשִׂיא אֱלֹהִים
  choice: mkuu wa Mungu
  rationale: Inahifadhi muundo halisi na utata wa Kiebrania, ambao unaweza kumaanisha mkuu anayehusishwa na Mungu au, kimatumizi ya nahau, mkuu mwenye nguvu sana.
- source_word: בְּתוֹכֵנוּ
  choice: miongoni mwetu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha nafasi ya Abrahamu katikati ya jamii hiyo.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: katika kaburi bora zaidi kati ya makaburi yetu
  rationale: מבחר huonyesha kilicho bora au cha kuchaguliwa; usemi huu ni wa kawaida na unaendeleza heshima ya pendekezo lao.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: Mzike marehemu wako
  rationale: Inatoa amri moja kwa moja kwa lugha yenye hadhi; “marehemu” ni ya kawaida na yenye staha kuliko “mfu” katika muktadha huu.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Hakuna hata mmoja wetu
  rationale: Katika ujenzi huu wa kukanusha, kirai hicho kina maana ya kwamba si mtu hata mmoja miongoni mwao.
- source_word: אֶת־קִבְרוֹ
  choice: kaburi lake
  rationale: Umoja wenye umilikaji unamhusu kila mmoja wao kwa namna ya mgawanyo.
- source_word: לֹא יִכְלֶה מִמְּךָ
  choice: hatakayekunyima
  rationale: Kitenzi hapa kina wazo la kuzuia au kukataa kumpa mtu kitu; “kunyima” linafaa kwa haki ya kutumia kaburi.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: na kukuzuia kumzika marehemu wako
  rationale: Kiambishi מן pamoja na kitenzi-jina kinaonyesha tendo linalozuiwa; tafsiri hii inaweka wazi uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya נְשִׂיא אֱלֹהִים
  choice: mkuu wa Mungu
  alternative: mkuu mwenye nguvu sana
  rationale: Matini kuu inahifadhi rejeo la wazi kwa Mungu na utata wa kirai cha asili; tanbihi inatoa uwezekano wa matumizi yake kama kiwango cha juu sana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Bwana wangu” ni namna ya heshima ya kijamii, “marehemu” inaleta staha inayofaa mazungumzo ya mazishi, na sentensi ya mwisho imewekwa kwa mtiririko wa kawaida huku tanbihi ikihifadhi muundo wa Kiebrania.
