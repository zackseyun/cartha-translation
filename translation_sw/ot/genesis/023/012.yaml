  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: sw
  text: Kisha Abrahamu akainama mbele ya watu wa nchi ile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajisujudu mbele ya watu wa nchi ile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: akainama
  rationale: Kitenzi hiki kinaonyesha kuinama kwa heshima au unyenyekevu. Katika mazungumzo haya na Wahiti, “akainama” huwasilisha ishara ya kimwili ya heshima bila kudokeza ibada kwa Mungu.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili kwa maana ya kuwa mbele au katika uwepo wa watu hao.
- source_word: עַם
  choice: watu
  rationale: Neno hili linarejelea wakazi wa mahali hapo kama jamii iliyoshuhudia shughuli hiyo; “watu” ni chaguo la kawaida na wazi.
- source_word: הָאָרֶץ
  choice: nchi ile
  rationale: Katika kirai עַם הָאָרֶץ, maana ni watu wa eneo hilo. “Nchi ile” ni ya asili katika Kiswahili na inaonyesha nchi inayozungumziwa katika muktadha.
- source_word: וַ
  choice: Kisha
  rationale: Kiunganishi hiki pamoja na wayyiqtol kinaendeleza simulizi kwa hatua inayofuata; “Kisha” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika tafsiri za Biblia za Kiswahili.
