lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika masimulizi ya mazungumzo kinaonyesha jibu linalofuata kauli iliyotangulia; “akamjibu” ni Kiswahili cha kawaida na huhifadhi mfuatano wa simulizi.
- source_word: עֶפְרוֹן
  choice: Efroni
  rationale: Jina la mtu limetoholewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֶת אַבְרָהָם
  choice: Abrahamu
  rationale: אֶת ni kiashiria cha yambwa na hakihitaji neno tofauti katika Kiswahili; Abrahamu ndiye anayejibiwa.
- source_word: לֵאמֹר
  choice: akamwambia
  rationale: Baada ya kitenzi cha kujibu, לֵאמֹר hutambulisha maneno yanayofuata. “Akamwambia” ni ya asili zaidi katika Kiswahili kuliko tafsiri halisi ya “akisema,” huku ikihifadhi kazi yake ya kutambulisha usemi.
- source_word: לוֹ
  choice: -mw-
  rationale: Kiwakilishi cha yambwa katika “akamwambia” kinarejelea Abrahamu na kuwakilisha לוֹ bila kurudia jina lake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo “akamjibu … akamwambia” unasomeka kwa urahisi katika simulizi na huhifadhi utangulizi maradufu wa usemi uliopo katika Kiebrania.
