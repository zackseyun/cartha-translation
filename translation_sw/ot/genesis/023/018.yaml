  text: לְ/אַבְרָהָ֥ם לְ/מִקְנָ֖ה לְ/עֵינֵ֣י בְנֵי חֵ֑ת בְּ/כֹ֖ל בָּאֵ֥י שַֽׁעַר עִירֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/018.yaml
  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: sw
  text: kuwa mali ya Abrahamu mbele ya wana wa Hethi[a], mbele ya wote walioingia katika lango la mji wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wahiti,” badala ya “wana wa Hethi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: ya Abrahamu
  rationale: Katika muktadha huu wa uhamisho wa kisheria, kiambishi לְ kinaonyesha kwamba mali hiyo ilikabidhiwa iwe ya Abrahamu; Kiswahili cha umilikaji ni cha asili zaidi kuliko tafsiri neno kwa neno ya ‘kwa Abrahamu’.
- source_word: לְמִקְנָה
  choice: kuwa mali
  rationale: מִקְנָה hapa ni kitu kilichopatikana kwa ununuzi na kuwa milki; ‘kuwa mali’ linaonyesha matokeo ya shughuli hiyo ya kisheria.
- source_word: לְעֵינֵי
  choice: mbele ya
  rationale: Nahau hii inaonyesha jambo lililofanyika wazi mbele ya mashahidi. ‘Mbele ya’ ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi maana hiyo bila kulazimisha taswira isiyo ya kawaida.
- source_word: בְנֵי חֵת
  choice: wana wa Hethi
  rationale: Huhifadhi muundo wa Kiebrania ‘wana wa Hethi’ na namna kundi hili linavyotajwa katika simulizi; ‘Wahiti’ ni kisawe halali cha kikabila.
- source_word: בְּכֹל בָּאֵי
  choice: mbele ya wote walioingia
  rationale: Kifungu kinaipanua hadhira ya mashahidi kwa wote waliokuwa wakiingia eneo la lango; wakati uliopita unalingana vizuri na simulizi la Kiswahili.
- source_word: שַׁעַר עִירוֹ
  choice: lango la mji wake
  rationale: Huhifadhi uhusiano wa maneno ya Kiebrania na mazingira ya kiraia na kisheria ya lango la mji.
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia ulinganifu bora: imehifadhi lugha ya uhamisho wa mali na ushuhuda wa hadharani huku ikiepuka tungo ngumu ya neno kwa neno.'
