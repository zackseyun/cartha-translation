  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: sw
  text: Hivyo shamba hilo na pango lililokuwa ndani yake vilihamishiwa Abrahamu kutoka kwa wana wa Hethi, kuwa milki ya maziko.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wahiti.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vikawa milki ya Abrahamu kuwa mahali pa kuzikia.” Kitenzi cha Kiebrania hapa, katika muktadha wa ununuzi, kinaonyesha uhamisho wa umiliki uliotambuliwa kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: vikathibitishwa kuwa mali
  rationale: Katika muktadha huu wa kisheria, kitenzi קום kinaonyesha kwamba umiliki wa shamba na pango ulitambuliwa na kuthibitishwa rasmi; usemi huu unadumisha maana hiyo bila kutumia tafsiri halisi isiyofaa ya 'vikasimama'.
- source_word: הַשָּׂדֶה
  choice: shamba
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya חלק ya ardhi iliyonunuliwa.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: na pango lililokuwa ndani yake
  rationale: Inahifadhi kishazi rejeshi cha Kiebrania na kuonyesha kwamba pango lilikuwa ndani ya shamba.
- source_word: לְאַבְרָהָם
  choice: kuwa mali ya Abrahamu
  rationale: Katika muundo huu wa kisheria, לְ humtaja Abrahamu kama aliyepokea umiliki.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: kwa ajili ya maziko
  rationale: Pamoja na 'kuwa mali,' usemi huu unaonyesha kwamba eneo hilo lilikuwa milki iliyokusudiwa kwa maziko, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מֵאֵת
  choice: kutoka kwa
  rationale: Huonyesha upande ambao mali ilitoka katika shughuli hii ya ununuzi.
- source_word: בְּנֵי חֵת
  choice: wana wa Hethi
  rationale: Inafuata kwa uwazi muundo wa Kiebrania; 'Wahiti' ni tafsiri halali ya kimuktadha na imewekwa katika tanbihi.
