  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: sw
  text: Baada ya hayo, Abrahamu akamzika Sara mkewe katika pango la shamba la Makpela, lililoelekeana na Mamre[a] (yaani, Hebroni), katika nchi ya Kanaani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lililo mkabala na Mamre.” Usemi wa Kiebrania unaonyesha mahali palipo mbele ya au panapoelekeana na Mamre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Hiki ni kishazi cha mpito wa wakati kinachomaanisha ‘baada ya hayo’ au ‘baadaye’; uchaguzi huu unaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: קָבַר
  choice: akamzika
  rationale: Kitenzi hiki humaanisha wazi ‘kuzika’; umbo la ‘aka-’ linafaa katika mfuatano wa simulizi baada ya kishazi cha wakati.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: Sara mkewe
  rationale: Mpangilio huu unafuata Kiebrania na ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: אֶל
  choice: katika
  rationale: Ingawa kihusishi hicho kwa msingi kinaweza kuwa ‘kwenda/kuingia,’ pamoja na tendo la kuzika na mahali, Kiswahili cha kawaida husema mtu alizikwa ‘katika’ pango.
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: pango la shamba la Makpela
  rationale: Hii inadumisha uhusiano wa mfululizo wa nomino katika Kiebrania kati ya pango, shamba, na Makpela bila kuongeza ufafanuzi usiotajwa.
- source_word: הַמַּכְפֵּלָה
  choice: Makpela
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili; kibainishi cha Kiebrania hakihitaji kutafsiriwa kando katika jina hili.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: lililoelekeana na Mamre
  rationale: Usemi huo unaonyesha uhusiano wa mahali mbele ya au mkabala na Mamre. ‘Lililoelekeana na’ ni Kiswahili cha kawaida na hakiongezi upande maalumu wa dira.
- source_word: הִוא חֶבְרוֹן
  choice: yaani, Hebroni
  rationale: Maneno haya yanatoa ufafanuzi wa jina la mahali; ‘yaani’ huwasilisha utambulisho huo kwa Kiswahili cha sasa.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Neno ‘nchi’ limedumishwa kwa sababu linatajwa wazi katika Kiebrania na ni sehemu ya usemi rasmi wa kijiografia.
theological_decisions: []
