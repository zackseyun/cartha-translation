base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: sw
  text: Kisha akasema, “Tafadhali, bwana wangu asikasirike, nami nitasema mara hii tu. Labda watu kumi watapatikana huko.” Naye akasema, “Sitapaharibu kwa ajili ya hao kumi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: Tafadhali, bwana wangu asikasirike
  rationale: Muundo huu unaonyesha ombi la heshima la Abrahamu na maana ya nahau ya Kiebrania inayohusu kuwaka kwa hasira. Herufi ndogo katika “bwana wangu” huhifadhi uwezekano wa kuwa ni namna ya heshima ya kumwita anayezungumziwa bila kuamua wazi kuwa hapa ni jina la Mungu.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: nami nitasema mara hii tu
  rationale: Kitenzi cha cohortative kinaonyesha ombi au kusudi la kuendelea kusema, na אַךְ הַפַּעַם linaweka mpaka kwamba hili ndilo ombi la mwisho.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: Labda watu kumi watapatikana huko
  rationale: אוּלַי huonyesha uwezekano, na Niphal ya מצא imetafsiriwa kwa hali ya kutendwa. “Watu” imeongezwa kwa uwazi wa kawaida wa Kiswahili kwa sababu namba hiyo inawahusu watu katika muktadha.
- source_word: לֹא אַשְׁחִית
  choice: Sitapaharibu
  rationale: Hiphil ya שׁחת humaanisha kuharibu. Kiambishi “pa” kinarejelea mahali au mji unaoeleweka kutokana na muktadha, huku Kiebrania kikiacha yambwa bila kutajwa wazi.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: kwa ajili ya hao kumi
  rationale: בַּעֲבוּר huonyesha sababu au uzingatiaji wa watu hao, na “hao” huonyesha kuwa ni wale kumi waliotajwa sasa hivi.
theological_decisions:
- issue: Anayerejelewa na אֲדֹנָי na matumizi ya herufi kubwa
  choice: bwana wangu
  alternative: Bwana wangu
  rationale: Ingawa muktadha mpana unasimulia kujitokeza kwa Mungu, neno lenyewe hapa si jina la agano YHWH. Herufi ndogo huhifadhi namna ya heshima ya usemi na kutatua kwa kiwango cha chini utata wa utambulisho wa anayesemeshwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na mtiririko wa kawaida. Lugha ya mazungumzo imehifadhiwa bila kuwa ya kizamani; “nami nitasema mara hii tu” huonyesha unyenyekevu na ukomo wa ombi.
