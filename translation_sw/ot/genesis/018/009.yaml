  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa mazungumzo umehifadhiwa; ‘Yuko pale’ hudumisha nguvu ya kielekezi הִנֵּה bila kutumia ‘Tazama,’ ambalo lingesikika lisilo la kawaida katika jibu hili.
