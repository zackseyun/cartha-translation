base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: sw
  text: Wakamwuliza, “Sara mke wako yuko wapi?” Akajibu, “Yuko pale, ndani ya hema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Wakamwuliza
  rationale: Kitenzi kwa wingi pamoja na ‘kwake’ kinaanzisha swali walilomwelekezea Abrahamu. ‘Wakamwuliza’ ni Kiswahili cha kawaida kinachobeba tendo la kusema na hali ya kuuliza bila kupoteza mfuatano wa simulizi.
- source_word: אַיֵּה
  choice: yuko wapi?
  rationale: Kielezi hiki huuliza mahali. Kwa mtu, Kiswahili sanifu hutumia ‘yuko wapi?’
- source_word: שָׂרָה אִשְׁתֶּךָ
  choice: Sara mke wako
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili, na אִשְׁתֶּךָ humaanisha wazi ‘mke wako.’
- source_word: וַיֹּאמֶר
  choice: Akajibu
  rationale: Ingawa kitenzi chenyewe ni ‘akasema,’ hapa kinatoa jibu la moja kwa moja kwa swali; ‘akajibu’ ni sawia kimaana na cha asili katika Kiswahili.
- source_word: הִנֵּה בָאֹהֶל
  choice: Yuko pale, ndani ya hema
  rationale: הִנֵּה inaelekeza fikira kwenye mahali (‘pale’), na בָאֹהֶל ni ‘ndani ya hema.’ Kiwakilishi na kitenzi vilivyodokezwa katika Kiebrania vimewekwa wazi kwa Kiswahili cha kawaida.
