review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequence of actions, the proximity expressed by עָלָיו, Abraham's running from the tent entrance, and the non-theologically predetermined sense of וַיִּשְׁתַּחוּ. However, “watu watatu” does not explicitly retain the source’s designation of the visitors as male, and “akainama mpaka chini” can suggest an ordinary bow more readily than the groundward gesture in the Hebrew.
  naturalness: The narrative is clear and reads naturally in Standard East African Swahili. “Wanaume watatu” is equally natural in this context, and “akainama mpaka ardhini” is a more idiomatic and suitably strong expression for the final gesture.
  terminology: “Wanaume watatu” preserves אֲנָשִׁים without importing later interpretations. “Akainama mpaka ardhini” describes profound obeisance without choosing “akaabudu.” The revised footnote retains the alternative of full prostration and explicitly avoids requiring a worship sense.
  issues:
  - severity: medium
    issue: “Watu watatu” leaves the explicitly male wording of אֲנָשִׁים unspecified.
    rationale: Although “watu” is natural Kiswahili and contextually possible, the Hebrew plainly calls them “men.” “Wanaume watatu” is natural, accurate, and does not add interpretation.
  - severity: low
    issue: “Akainama mpaka chini” somewhat understates or ambiguously expresses the groundward act, and footnote b’s “akajilaza kifudifudi mpaka chini” is awkward.
    rationale: The Hebrew verb denotes bowing down/prostrating oneself toward the ground. “Akainama mpaka ardhini” is idiomatic and preserves the physical gesture without rendering it as worship; “akasujudu mpaka ardhini” is a clearer alternative for full prostration.
  revised_text: Akainua macho yake, akatazama, na tazama, wanaume watatu walikuwa wamesimama karibu naye.[a] Alipowaona, alikimbia kutoka mlangoni mwa hema kwenda kuwalaki, akainama mpaka ardhini.[b]
  revised_footnotes:
  - marker: a
    text: Au, “wamesimama kando yake”; kihusishi cha Kiebrania kinaweza kuonyesha ukaribu wa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “akasujudu mpaka ardhini.” Kitenzi hiki kinaeleza ishara ya heshima kubwa, lakini chenyewe hakilazimishi maana ya “kuabudu.”
    reason: alternative_reading
  revision_rationale: Marekebisho yanahifadhi jinsia iliyo wazi katika maandishi ya Kiebrania kwa “wanaume watatu” na kuimarisha uwasilishaji wa tendo la kuinama kuelekea ardhini, bila kutatua mapema kama tendo hilo lilikuwa ibada. Alama za tanbihi na maana zake zimehifadhiwa.
