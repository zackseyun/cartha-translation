base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: sw
  text: Akainua macho yake, akatazama, na tazama, wanaume watatu walikuwa wamesimama karibu naye.[a] Alipowaona, alikimbia kutoka mlangoni mwa hema kwenda kuwalaki, akainama mpaka ardhini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamesimama kando yake”; kihusishi cha Kiebrania kinaweza kuonyesha ukaribu wa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “akasujudu mpaka ardhini.” Kitenzi hiki kinaeleza ishara ya heshima kubwa, lakini chenyewe hakilazimishi maana ya “kuabudu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Akainua macho yake
  rationale: Inahifadhi nahau hai ya Kiebrania kwa Kiswahili kinachoeleweka; ‘akatazama juu’ ingekuwa laini zaidi lakini ingepunguza taswira ya chanzo.
- source_word: וַיַּרְא
  choice: akatazama
  rationale: Katika tukio la kwanza, kitenzi kinafuata ‘akainua macho yake’; ‘akatazama’ kinaonyesha kuelekeza macho bila kurudia mapema ‘akaona’.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Kinahifadhi alama ya kisimulizi inayowasilisha tukio kwa uhai na kuvuta fikira za msomaji.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: watu watatu
  rationale: Katika Kiswahili, ‘watu watatu’ ni usemi wa kawaida kwa wanaume watatu wanaotajwa hapa; muktadha unaonyesha jinsia bila kutumia usemi mzito usio wa kawaida.
- source_word: נִצָּבִים עָלָיו
  choice: walikuwa wamesimama karibu naye
  rationale: Kihusishi kinaweza kuonyesha ukaribu au mahali waliposimama kuhusiana naye. ‘Karibu naye’ ni wazi na hakidokezi bila lazima kwamba walikuwa wamemwelemea.
- source_word: וַיַּרְא
  choice: Alipowaona
  rationale: Tafsiri ya wakati inaunganisha kwa kawaida kuona kwake na hatua iliyofuata ya kukimbia kuwalaki.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: alikimbia ... kwenda kuwalaki
  rationale: ‘Alikimbia’ huhifadhi tendo halisi na ari ya Ibrahimu; ‘kuwalaki’ ni neno la heshima na la kawaida katika simulizi la ukarimu.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: kutoka mlangoni mwa hema
  rationale: ‘Mlangoni mwa hema’ ni usemi wa asili wa Kiswahili kwa uwazi au kiingilio cha hema.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: akainama mpaka chini
  rationale: Inaonyesha tendo la kuinama kwa heshima bila kuamua kwamba kitenzi lazima kimaanishe ibada.
theological_decisions:
- issue: Ikiwa tendo la Ibrahimu litafsiriwe kuwa ibada kwa mhusika wa kimungu
  choice: akainama mpaka chini
  alternative: akaabudu; akajilaza kifudifudi mpaka chini
  rationale: Kitenzi cha Kiebrania kinaweza kueleza kusujudu au kuinama mbele ya wanadamu au mbele za Mungu. Kwa kuwa mstari huu unawatambulisha kwanza kama watu watatu, ‘akaabudu’ ingeamua mapema suala la kitafsiri ambalo mstari wenyewe haulifafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Viunganishi vya mfululizo ‘aka-’ vinadumisha mwendo wa simulizi la Kiebrania; ‘na tazama’ huhifadhi msisitizo wa ghafla wa וְהִנֵּה.
