lexical_decisions:
- source_word: הַבָּקָר
  choice: kundi
  rationale: Neno hili hapa linamaanisha kwa ujumla kundi la ng’ombe ambamo Abrahamu alikwenda kuchagua mnyama; “kundi” ni la asili katika Kiswahili kwa muktadha huu.
- source_word: רָץ
  choice: akakimbia
  rationale: Huhifadhi maana ya moja kwa moja na uhai wa simulizi, pamoja na haraka ya ukarimu wa Abrahamu.
- source_word: בֶּן־בָּקָר
  choice: ndama
  rationale: Kirai hiki ni nahau inayomaanisha ng’ombe mchanga; “ndama” ni tafsiri wazi na ya kawaida katika muktadha wa kuandaa chakula.
- source_word: רַךְ וָטוֹב
  choice: mwororo na mzuri
  rationale: “Mwororo” huonyesha ulaini wa mnyama/chakula, na “mzuri” huhifadhi tathmini pana ya ubora bila kuibana kuwa “mnono” au “bora sana.”
- source_word: הַנַּעַר
  choice: kijana
  rationale: Neno la Kiebrania linaweza kumaanisha mvulana, kijana, au mtumishi kulingana na muktadha. “Kijana” huhifadhi maana ya msingi bila kuamua kwamba alikuwa mtumishi.
- source_word: וַיְמַהֵר
  choice: akafanya haraka
  rationale: Huonyesha kitendo cha kutenda upesi na kudumisha msisitizo wa simulizi kuhusu ukarimu wa haraka.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: kumwandaa
  rationale: Ingawa kitenzi kwa upana ni “kufanya,” katika muktadha wa chakula maana yake ya kawaida ni kumwandaa ndama awe chakula. Kiambishi “mw-” kinarejelea ndama kama mnyama wa ngeli ya A-WA.
