base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: sw
  text: Abrahamu hakika atakuwa taifa kubwa na lenye nguvu, na mataifa yote ya dunia yatabarikiwa katika yeye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mataifa yote ya dunia yatajibarikia katika yeye.” Muundo wa Kiebrania unaweza kueleweka hivyo, ingawa matini kuu umeutafsiri kama kauli ya kutendwa: “yatabarikiwa katika yeye.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: hakika atakuwa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kisicho timilifu unasisitiza uhakika wa jambo la wakati ujao. “Hakika atakuwa” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: לְגוֹי
  choice: taifa
  rationale: גוי humaanisha taifa au kundi la watu; “taifa” linafaa katika ahadi kwa Abrahamu na kudumisha ulinganifu na mataifa yanayotajwa baadaye.
- source_word: גָּדוֹל
  choice: kubwa
  rationale: “Kubwa” huhifadhi maana ya ukubwa wa idadi na pia hadhi katika muktadha wa ahadi.
- source_word: וְעָצוּם
  choice: lenye nguvu
  rationale: עצום inaweza kueleza nguvu, uwezo, au wingi. “Lenye nguvu” ni la asili kwa Kiswahili na halifanyi maana kuwa wingi pekee.
- source_word: וְנִבְרְכוּ
  choice: yatabarikiwa
  rationale: Nifali ya ברך imewasilishwa kama kauli ya kutendwa, yaani mataifa yatapokea baraka; uwezekano wa maana ya kujirejelea umehifadhiwa katika tanbihi.
- source_word: בּוֹ
  choice: katika yeye
  rationale: “Katika yeye” hufuata kwa karibu בּוֹ na kuhifadhi wazo la baraka inayohusiana na Abrahamu bila kuongeza wazi dhana ya chombo kama “kupitia kwake.”
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: mataifa yote ya dunia
  rationale: Ni usemi wenye upeo wa ulimwengu mzima; “mataifa” hudumisha neno lilelile la msingi la גוי, na “dunia” linafaa kuliko “nchi” hapa.
theological_decisions:
- issue: Maana ya kauli ya baraka kwa mataifa katika ahadi kwa Abrahamu
  choice: 'Mataifa yanaonyeshwa kuwa wapokeaji wa baraka kuhusiana na Abrahamu: “yatabarikiwa katika yeye.”'
  alternative: Mataifa “yatajibariki kwa kumtaja yeye,” yakimtumia Abrahamu kama mfano katika kauli ya baraka.
  rationale: Nifali ya ברך inaweza kueleweka kama kauli ya kutendwa au kwa maana ya kujirejelea. Kauli ya kutendwa inafaa muktadha mpana wa ahadi, lakini maana nyingine ya Kiebrania haijaondolewa na imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa maneno unahifadhi msisitizo wa Kiebrania na utata halisi wa kauli ya baraka.
