base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: sw
  text: “Nami nilete kipande cha mkate[a] ili mpate nguvu[b]; ndipo mtaendelea na safari, kwa kuwa ndiyo maana mmepitia kwa mtumishi wenu.” Wakasema, “Sawa, fanya kama ulivyosema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kiebrania inaweza pia kutafsiriwa “tonge la mkate.” Ni usemi wa unyenyekevu katika mazingira ya ukarimu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “itegemezeni mioyo yenu.” Nahau ya Kiebrania inamaanisha kupata nguvu au kuburudishwa kwa kula.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: Nami nilete
  rationale: Kitenzi cha uamuzi/ombi katika nafsi ya kwanza kinaonyesha ombi la heshima la Abrahamu la kuwahudumia wageni, si taarifa rahisi ya wakati ujao.
- source_word: פַת לֶחֶם
  choice: kipande cha mkate
  rationale: Hutaja kiasi kidogo cha mkate na kudumisha usemi wa unyenyekevu unaofaa mazingira ya ukarimu, kwa Kiswahili cha kawaida.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: ili mjitie nguvu
  rationale: Nahau hii humaanisha kupata nguvu au kuburudishwa kwa kula. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi taswira halisi ya moyo.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: baada ya hapo mnaweza kuendelea na safari
  rationale: Katika muktadha huu עבר hueleza kuendelea na safari baada ya kupumzika na kula.
- source_word: כִּי עַל כֵּן
  choice: maana ndiyo sababu
  rationale: Muunganiko huu unatoa sababu ya mwaliko wa Abrahamu bila kuufanya usemi wa Kiebrania kuwa mgumu katika Kiswahili.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: mmepitia kwa mtumishi wenu
  rationale: Huhifadhi wazo la wageni kupita mahali alipo Abrahamu na pia lugha yake ya kujishusha.
- source_word: עַבְדְּכֶם
  choice: mtumishi wenu
  rationale: Hapa ni namna ya Abrahamu kujitaja kwa heshima na unyenyekevu, si dai kwamba yeye ni mtumwa wao.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Sawa, fanya
  rationale: Jibu fupi linakubali pendekezo lake; “Sawa” huwasilisha ukubali huo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: kama ulivyosema
  rationale: Huthibitisha pendekezo ambalo Abrahamu amemaliza kulitoa.
