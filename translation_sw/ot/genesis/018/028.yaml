base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: sw
  text: Tuseme kwamba idadi ya waadilifu hamsini itapungua kwa watano—je, utauangamiza mji wote kwa sababu ya upungufu wa watano?[a] Naye akasema, “Sitauangamiza nikikuta humo watu arobaini na watano.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tuseme kwamba katika wale waadilifu hamsini watakosekana watano—je, utauangamiza mji wote kwa sababu ya upungufu wa watano?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Tuseme kwamba
  rationale: Kishazi hiki kinaanzisha hali ya kudhani katika ombi la Abrahamu; ni cha kawaida katika Kiswahili na kinahifadhi maana ya ‘ikiwa itakuwa kwamba’.
- source_word: יַחְסְרוּן ... חֲמִשָּׁה
  choice: watapungua watano
  rationale: Kitenzi חסר pamoja na idadi kinaonyesha kwamba kundi linalotarajiwa la hamsini lina upungufu wa watano, si kwamba watu watano maalumu hawapo.
- source_word: חֲמִשִּׁים הַצַּדִּיקִם
  choice: wale waadilifu hamsini
  rationale: ‘Waadilifu’ huhifadhi maana ya kimaadili na kihukumu ya צַדִּיקִים; ‘wale’ huonyesha kundi maalumu linalotajwa katika muktadha.
- source_word: הֲתַשְׁחִית
  choice: je, utauangamiza
  rationale: Hiphil ya שׁחת hapa ni kuharibu au kuangamiza. ‘Kuangamiza’ linafaa kwa hukumu ya mji na linarudiwa katika jibu.
- source_word: בַּחֲמִשָּׁה
  choice: kwa sababu ya hao watano
  rationale: ב hapa linaonyesha sababu au msingi. ‘Hao’ hurejelea upungufu wa watu watano bila kudokeza kwamba wenyewe ndio waliosababisha hukumu.
- source_word: אֶת כָּל הָעִיר
  choice: mji wote
  rationale: Ni Kiswahili cha kawaida kinachohifadhi ujumla wa כָּל.
- source_word: לֹא אַשְׁחִית
  choice: Sitauangamiza
  rationale: Kiwakilishi tamati ‘-u-’ kinarejelea mji na kinahifadhi urudiaji wa kitenzi kilichotumiwa katika swali.
- source_word: אִם אֶמְצָא שָׁם
  choice: nikipata humo
  rationale: Muundo wa ‘-ki-’ huonyesha sharti kwa kawaida; ‘humo’ hurejelea ndani ya mji.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: watu arobaini na watano
  rationale: Idadi inaeleweka kuwa ya waadilifu; kuongeza ‘watu’ kunafanya Kiswahili kiwe wazi na cha kawaida bila kubadili rejeleo.
theological_decisions:
- issue: Tafsiri ya צַדִּיקִים
  choice: waadilifu
  alternative: wenye haki
  rationale: ‘Waadilifu’ linaonyesha watu wenye uadilifu katika maana ya kimaadili na kihukumu bila kulifanya neno liwe dai finyu la kimadhehebu. ‘Wenye haki’ linawezekana, lakini katika Kiswahili cha sasa linaweza kusikika kama wenye madai au stahili fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mazungumzo umehifadhiwa, na sintaksia imewekwa wazi kwamba idadi ya waadilifu inapungua kutoka hamsini hadi arobaini na watano.
