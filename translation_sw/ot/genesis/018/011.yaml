lexical_decisions:
- source_word: זְקֵנִים
  choice: wazee
  rationale: Neno hili linaonyesha umri mkubwa; “wazee” ni Kiswahili cha kawaida na chenye heshima.
- source_word: בָּאִים בַּיָּמִים
  choice: wakiwa wameendelea sana katika siku zao
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya ‘kuingia/kuendelea katika siku,’ huku ikieleweka kuwa walikuwa wamefikia umri mkubwa.
- source_word: חָדַל לִהְיוֹת
  choice: ilikuwa imekoma
  rationale: Huwasilisha wazi hali iliyokuwa tayari imeacha kuwapo.
- source_word: אֹרַח כַּנָּשִׁים
  choice: desturi ya wanawake
  rationale: “Desturi” huakisi maana ya njia au mwenendo katika nahau hii ya staha, bila kuifafanua moja kwa moja ndani ya mstari.
- source_word: לְשָׂרָה
  choice: kwa Sara
  rationale: Kiambishi ל hapa huonyesha jambo linalomhusu Sara; “kwa Sara” ni usemi wa asili katika Kiswahili.
