  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: sw
  text: Kisha Yahwe[a] akaondoka alipokuwa amemaliza kusema na Abrahamu, naye Abrahamu akarudi mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Jina hili hutoholewa pia kama “Yahweh” au “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaondoka
  rationale: Katika simulizi, הלך hapa inaonyesha kuondoka baada ya mazungumzo; “akaondoka” ni ya kawaida na haiongezi mahali alikokwenda.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר כִּלָּה
  choice: baada ya kumaliza
  rationale: Muundo huu unaonyesha kwamba kuzungumza kulikamilika kabla ya kuondoka; Kiswahili hiki kinaonyesha wazi mfuatano huo.
- source_word: לְדַבֵּר אֶל אַבְרָהָם
  choice: kusema na Abrahamu
  rationale: Ingawa אֶל kimsingi ni “kwa/kuelekea,” katika muktadha wa mawasiliano “kusema na Abrahamu” ni Kiswahili cha kawaida bila kubadili maana.
- source_word: שָׁב
  choice: akarudi
  rationale: שׁוב hapa humaanisha kurudi; “akarudi” inafaa mtiririko wa simulizi.
- source_word: לִמְקֹמוֹ
  choice: mahali pake
  rationale: Huhifadhi maana pana ya מָקוֹם, “mahali,” bila kuifanya iwe “nyumbani,” jambo lisilotajwa wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza namna nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa vitenzi vya mfululizo umehifadhi mwendo wa simulizi; “mahali pake” limeachwa kwa upana wake wa asili.
