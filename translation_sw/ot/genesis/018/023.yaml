base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: sw
  text: Ndipo Abrahamu akakaribia, akasema, “Je, kweli utawaangamiza[a] wenye haki pamoja na waovu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawafagilia mbali” au “utawateketeza”; kitenzi cha Kiebrania kina maana ya kuwaondoa katika hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: akakaribia
  rationale: Kitenzi נגשׁ kina maana ya kukaribia. “Akakaribia” kinaonyesha Abrahamu kusogea karibu, huku pia kikifaa kwa hatua yake ya kuanza kusihi.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: אמר ni kitenzi cha kawaida cha kusema; “akasema” kinafaa katika mtiririko wa masimulizi.
- source_word: הַאַף
  choice: Je, kweli
  rationale: Kiulizi הַ pamoja na אַף kinakazia swali. “Je, kweli” kinafikisha mshangao na uzito wa ombi la Abrahamu bila kulipanua kupita kiasi.
- source_word: תִּסְפֶּה
  choice: utawaangamiza
  rationale: ספה hapa humaanisha kuwaondoa katika hukumu, kuwaangamiza au kuwafutilia mbali. “Utawaangamiza” ni wazi na ya asili katika Kiswahili; tanbihi inahifadhi taswira mbadala ya kufagilia mbali.
- source_word: צַדִּיק
  choice: wenye haki
  rationale: Ingawa neno la Kiebrania liko katika umoja, limetumiwa kwa maana ya kundi kwa ujumla. “Wenye haki” ni usemi wa kawaida wa Kiswahili na huhifadhi kategoria ya kimaadili.
- source_word: עִם
  choice: pamoja na
  rationale: “Pamoja na” linaonyesha kwamba wenye haki wangepata hatima ileile na waovu katika hukumu.
- source_word: רָשָׁע
  choice: waovu
  rationale: Ingawa umbo la Kiebrania ni la umoja, maana yake ni ya kundi kwa ujumla. “Waovu” linadumisha utofautishaji wa kimaadili dhidi ya “wenye haki.”
theological_decisions:
- issue: Kategoria za kimaadili zilizo katika umoja wa kijumla
  choice: Kutafsiri צַדִּיק na רָשָׁע kwa wingi wa kijumla kuwa “wenye haki” na “waovu.”
  alternative: “Mwenye haki” na “mwovu.”
  rationale: Kiebrania kinatumia maumbo ya umoja kuwakilisha makundi ya watu na kuweka wazi kanuni ya haki ya Mungu. Kiswahili cha wingi wa kijumla kinafikisha maana hiyo kwa kawaida bila kuifanya aya ihusu watu wawili tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Je, kweli” huhifadhi mkazo wa swali, na “pamoja na” huweka wazi hatima ya pamoja inayoulizwa.
