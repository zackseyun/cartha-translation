  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: sw
  text: Yahwe akasema, “Nikipata watu waadilifu hamsini ndani ya mji wa Sodoma, nitasamehe[a] mahali pote kwa ajili yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaepusha mahali pote na hukumu kwa ajili yao.” Kitenzi cha Kiebrania kinaweza kumaanisha kubeba au kuondoa hatia, kusamehe, au kuzuia hukumu; katika muktadha huu kinaonyesha kutoleta hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililo katika Kiebrania badala ya kulibadilisha kuwa cheo; tahajia hii ni ya kawaida na husomeka kwa urahisi katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa masimulizi wa Kiebrania unaendeleza tukio; katika Kiswahili, “akasema” huonyesha mwendelezo huo kwa kawaida bila kulazimisha kiunganishi “na”.
- source_word: אִם אֶמְצָא
  choice: nikipata
  rationale: Huwasilisha sharti la Kiebrania kwa Kiswahili cha kawaida na wazi.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: watu waadilifu hamsini
  rationale: צַדִּיקִם inarejelea watu wenye uadilifu; “watu” haibani maana kwa wanaume pekee.
- source_word: בְּתוֹךְ הָעִיר
  choice: ndani ya mji
  rationale: Inahifadhi maana ya kuwa katika sehemu ya ndani ya mji kwa usemi wa kawaida wa Kiswahili.
- source_word: וְנָשָׂאתִי
  choice: nitausamehe
  rationale: Katika muktadha huu, kitenzi נָשָׂא kina maana ya kuondoa au kutotekeleza hukumu dhidi ya mahali; “nitausamehe” huhifadhi pia wigo wa maana unaohusiana na kusamehe.
- source_word: לְכָל הַמָּקוֹם
  choice: mahali pote
  rationale: Huwakilisha eneo lote linalokabili hukumu, si sehemu moja tu.
- source_word: בַּעֲבוּרָם
  choice: kwa ajili yao
  rationale: Ni usemi wa kawaida unaoonyesha kuwa watu hao ndio sababu ya kuhurumiwa kwa mahali pote.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וְנָשָׂאתִי katika hukumu ya Sodoma
  choice: nitausamehe
  alternative: nitauepusha na hukumu; sitauangamiza
  rationale: Kitenzi kinaweza kueleza kubeba au kuondoa hatia, kusamehe, au kuzuia hukumu. “Nitausamehe” hudumisha maana hiyo pana, huku tanbihi ikifafanua nguvu yake katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kimazungumzo ya simulizi lakini haijawa ya mtaani. “Watu waadilifu” ni jumuishi na inaeleweka kwa wasomaji wa kawaida.
