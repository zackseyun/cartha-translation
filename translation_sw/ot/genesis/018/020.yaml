base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: sw
  text: Ndipo Yahwe akasema, “Kilio dhidi ya Sodoma na Gomora[a] ni kikubwa, na dhambi yao ni nzito sana[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kilio cha Sodoma na Gomora ni kikubwa.” Kiebrania kinaweza kutafsiriwa kwa ukaribu zaidi kwa namna hii; tafsiri kuu inaweka wazi kwamba kilio hicho kinaelekezwa dhidi yao.
    reason: lexical_alternative
  - marker: b
    text: Yaani, dhambi yao ni mbaya sana. Kiebrania kinasema kihalisi kuwa dhambi yao ni “nzito sana,” nahau inayoonyesha uzito mkubwa wa jambo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo wa masimulizi wenye waw-consecutive unasogeza simulizi mbele; “Ndipo ... akasema” ni Kiswahili cha asili kinachoonyesha mfuatano wa matukio.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi unaotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: Kilio dhidi ya Sodoma na Gomora
  rationale: זַעֲקָה ni kilio kikubwa kinachotokana na dhuluma au uovu. “Dhidi ya” huweka wazi maana inayodokezwa na muktadha kwamba kilio hicho kinawahusu na kuwashitaki miji hiyo, huku tanbihi ikihifadhi tafsiri ya karibu zaidi na muundo wa Kiebrania.
- source_word: כִּי רָבָּה
  choice: ni kikubwa
  rationale: Kivumishi cha Kiebrania kinaeleza ukubwa au wingi wa kilio; “ni kikubwa” ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: וְחַטָּאתָם
  choice: na dhambi yao
  rationale: Nomino ya umoja yenye kiambishi cha wingi inarejelea kwa ujumla uovu wa wakazi; “dhambi yao” huhifadhi umoja huo wa kijumla.
- source_word: כִּי כָבְדָה מְאֹד
  choice: ni nzito sana
  rationale: כבד maana yake ya msingi ni kuwa nzito, na hapa inaonyesha uzito mkubwa wa kimaadili. Kiswahili pia hutumia “nzito” kwa jambo lenye uzito au ubaya mkubwa, hivyo taswira ya Kiebrania inaweza kuhifadhiwa kwa kawaida.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo; kwa hiyo limedumishwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa “BWANA”.
- issue: Kilio cha Sodoma na Gomora kinaelekezwa kwa nani
  choice: Kilio dhidi ya Sodoma na Gomora
  alternative: Kilio cha Sodoma na Gomora
  rationale: Muundo wa Kiebrania unaweza kutafsiriwa kihalisi kuwa “kilio cha,” lakini muktadha unaonyesha kilio kilichotokea kwa sababu ya uovu wao. Tafsiri kuu inaweka uhusiano huo wazi, na tanbihi inahifadhi uwezekano wa muundo wa karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa msomaji wa kawaida huku ikihifadhi taswira ya Kiebrania ya dhambi kuwa “nzito.”
