base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: sw
  text: Nitashuka sasa nione kama wametenda kikamilifu sawasawa na kilio chake kilichonifikia[a]; na kama sivyo[b], nitajua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama wametenda kabisa sawasawa na kilio kilichonifikia.” Nahau ya Kiebrania inayotumia “kutenda” na “ukamilifu” inauliza kama uovu ulioripotiwa unalingana kikamilifu na kilio hicho.
    reason: lexical_alternative
  - marker: b
    text: Au, “na ikiwa sivyo.”
    reason: previous_rendering
lexical_decisions:
- source_word: אֵרֲדָה
  choice: Nitashuka
  rationale: Kauli ya cohortative ya nafsi ya kwanza inaonyesha azimio au kusudi la msemaji; wakati ujao wa Kiswahili unawasilisha nguvu hiyo kwa kawaida.
- source_word: נָּא
  choice: sasa
  rationale: Hapa neno hili linaashiria uharaka au kuimarisha azimio, si ombi la heshima kwa mtu mwingine.
- source_word: וְאֶרְאֶה
  choice: nione
  rationale: Kitenzi kinamaanisha kuona kwa kusudi la kuthibitisha hali; 'nione' huhifadhi taswira ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: הַכְּצַעֲקָתָהּ
  choice: kulingana na kilio chake
  rationale: צעקה ni kilio kinachotokana na dhuluma au uovu mkubwa. Kiambishi cha umoja wa kike kinarejelea mji au eneo linalozungumziwa; 'chake' huhifadhi muundo huo bila kuamua wazi kuwa ni kilio dhidi yake.
- source_word: הַבָּאָה אֵלַי
  choice: kilichonifikia
  rationale: Kirai cha Kiebrania kinachofafanua 'kilio' kinatolewa kwa kishazi rejeshi cha kawaida na fasaha katika Kiswahili.
- source_word: עָשׂוּ כָּלָה
  choice: wametenda kabisa
  rationale: Nahau ngumu inauliza kama matendo yao yanalingana kikamilifu na kilio kilichofika; tafsiri hii ni ya asili huku ikihifadhi wazo la ukamilifu na mtendaji wa wingi asiyeainishwa.
- source_word: וְאִם לֹא
  choice: na kama sivyo
  rationale: Huhifadhi sharti la kinyume kwa Kiswahili cha kawaida bila kulazimisha maana zaidi.
- source_word: אֵדָעָה
  choice: nitajua
  rationale: Huhifadhi kitenzi 'kujua' na nguvu ya azimio ya umbo la Kiebrania badala ya kukitafsiri kwa ufafanuzi kama 'nitagundua'.
theological_decisions:
- issue: Uchunguzi wa Mungu unaoelezwa kwa lugha ya kibinadamu
  choice: Kuhifadhi maneno ya Mungu 'kushuka,' 'kuona,' na 'kujua.'
  alternative: Kutafsiri kwa ufafanuzi kama 'nitachunguza na kuhukumu' ili kuepuka lugha ya kibinadamu kuhusu Mungu.
  rationale: Simulizi la Kiebrania linamweleza Mungu kwa lugha inayofanana na matendo ya mwanadamu. Tafsiri inahifadhi mvutano huo badala ya kuutatua kwa maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida, huku nahau ngumu, kiambishi cha 'kilio chake,' na lugha ya Mungu kushuka na kuona vikihifadhiwa bila kupewa ufafanuzi wa kimadhehebu.
