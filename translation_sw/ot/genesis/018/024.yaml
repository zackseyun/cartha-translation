base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: sw
  text: Huenda kuna watu hamsini waadilifu ndani ya mji.[a] Je, kweli utaufagilia mbali, wala hutauiepusha mahali hapo kwa ajili ya wale waadilifu hamsini waliomo ndani yake?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tuseme kuna watu hamsini waadilifu ndani ya mji.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Je, kweli utaufagilia mbali na kutosamehe mahali hapo kwa sababu ya wale waadilifu hamsini waliomo ndani yake?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Huenda
  rationale: Huanzisha dhana ya Abrahamu kwa namna ya tahadhari na ya uwezekano; ni ya kawaida katika Kiswahili bila kuifanya kuwa taarifa ya uhakika.
- source_word: יֵשׁ
  choice: kuna
  rationale: Ni muundo wa kawaida wa Kiswahili unaoonyesha kuwapo, na pamoja na “huenda” unatoa maana ya hali inayodhaniwa.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: watu hamsini waadilifu
  rationale: צַדִּיקִם humaanisha watu wenye uadilifu bila kulazimisha jinsia ya kiume; “watu ... waadilifu” ni wazi na ya kawaida.
- source_word: בְּתוֹךְ הָעִיר
  choice: katikati ya mji
  rationale: Huhifadhi wazo la kuwa ndani ya eneo la mji; hapa “katikati” haikulazimishi maana ya kitovu halisi bali kuwamo mjini.
- source_word: הַאַף
  choice: kweli
  rationale: Huonyesha msisitizo wa swali la balagha kwa Kiswahili cha kawaida.
- source_word: תִּסְפֶּה
  choice: utaufagilia mbali
  rationale: Huhifadhi taswira yenye nguvu ya kufutilia mbali kwa hukumu, badala ya kutumia tu neno la jumla “kuharibu.”
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: wala hutauacha mahali hapo
  rationale: Katika muktadha huu נשא inaonyesha kutotekeleza maangamizi dhidi ya mahali; “kuacha” hutoa maana ya kukiepusha bila kuingiza kwa lazima dhana finyu ya kusamehe dhambi.
- source_word: לְמַעַן
  choice: kwa ajili ya
  rationale: Huonyesha kwamba kuwapo kwa waadilifu ndiko kunakotolewa kuwa msingi wa kutouangamiza mji.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: waliomo ndani yake
  rationale: Hurejelea wazi wale waadilifu waliomo mjini na kuhifadhi kishazi cha uhusiano cha Kiebrania kwa Kiswahili fasaha.
theological_decisions:
- issue: Maana ya נשא katika “wala hutauacha mahali hapo”
  choice: Kutafsiri kuwa kuacha/kuepusha mahali hapo na maangamizi
  alternative: kusamehe mahali hapo
  rationale: Muktadha wa karibu unatofautisha kuufagilia mbali mji na kutofanya hivyo kwa ajili ya waadilifu. “Kuacha” huhifadhi maana ya kisheria na kisimulizi bila kuamua kimya kimya kwamba neno hilo linamaanisha hasa msamaha wa dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni wazi kwa msomaji wa kawaida; taswira ya kitenzi cha Kiebrania imehifadhiwa katika “utaufagilia mbali,” huku utata wa נשא kati ya kuacha na kusamehe ukionyeshwa katika tanbihi.
