  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: sw
  text: Akamwambia tena, “Labda arobaini watapatikana huko.” Naye akasema, “Sitalifanya kwa ajili ya hao arobaini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: Akaendelea kusema
  rationale: Muundo יסף + עוד + kitenzi-jina unaonyesha kuendelea au kurudia kusema. “Akaendelea kusema” ni Kiswahili cha kawaida kinachohifadhi wazo hilo bila tafsiri ngumu ya neno kwa neno.
- source_word: אֵלָיו
  choice: naye
  rationale: Kiambishi cha urejeshi katika “naye” kinaonyesha kwamba Abrahamu aliendelea kusema na yule aliyekuwa akizungumza naye, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אוּלַי
  choice: Labda
  rationale: “Labda” huwasilisha uwezekano wa kukisia katika ombi la Abrahamu kwa lugha ya kawaida na yenye heshima.
- source_word: יִמָּצְאוּן
  choice: watapatikana
  rationale: Nifali ya מצא ni hali ya kutendwa, “kupatikana”; wakati ujao unafaa kwa hali hii ya kudhaniwa katika mazungumzo.
- source_word: שָׁם
  choice: humo
  rationale: “Humo” ni kielezi cha mahali kinachorejelea ndani ya mji au eneo linalozungumziwa, na ni cha asili zaidi hapa kuliko “pale”.
- source_word: אַרְבָּעִים
  choice: watu arobaini
  rationale: Ingawa Kiebrania kinataja tu “arobaini,” muktadha unaonyesha watu; kuongeza “watu” kunafanya Kiswahili kiwe wazi bila kubadili maana.
- source_word: לֹא אֶעֱשֶׂה
  choice: Sitalifanya
  rationale: Kitenzi עשה hakitaji tendo lenyewe bali huliacha lieleweke kutokana na muktadha. “Sitalifanya” huhifadhi udokezi huo bila kutaja moja kwa moja kuangamiza.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: kwa ajili ya hao arobaini
  rationale: “Kwa ajili ya” huonyesha kwamba tendo litaachwa kwa sababu ya hao arobaini, huku “hao” ikirejelea watu waliotajwa katika sentensi iliyotangulia.
theological_decisions:
- issue: Tendo la Mungu lisilotajwa wazi katika לֹא אֶעֱשֶׂה
  choice: Kuhifadhi tendo likiwa limedokezwa kwa “Sitalifanya.”
  alternative: “Sitauangamiza mji” au “Sitauharibu.”
  rationale: Kiebrania hakitaji wazi tendo wala kitu kinachotendewa; muktadha unalifanya lieleweke. Tafsiri kuu haipaswi kulifafanua zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa mazungumzo umewekwa wa kawaida, na udokezi wa Kiebrania katika jibu la Mungu umehifadhiwa.
