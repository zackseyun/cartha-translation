base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: sw
  text: Kisha akasema, “Tazama, tafadhali, nimejipa ujasiri wa kusema na Bwana wangu. Labda watu ishirini watapatikana huko.” Naye akasema, “Sitaharibu mahali hapo kwa ajili ya hao ishirini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tazama, tafadhali
  rationale: Huhifadhi kauli ya kuvuta fikira pamoja na sauti ya heshima ya נָא; ni Kiswahili kinachoeleweka bila kutumia mtindo wa kizamani kupita kiasi.
- source_word: הוֹאַלְתִּי
  choice: nimethubutu
  rationale: Katika ombi hili la unyenyekevu, kitenzi kinaonyesha kuchukua ujasiri au kujipa ruhusa ya kusema, si kuanza tu.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: kusema na Bwana wangu
  rationale: Hutoa maana ya moja kwa moja ya kumwelekea mhusika wa kiungu kwa heshima; ‘Bwana’ ni cheo hapa, si uwakilishi wa jina YHWH.
- source_word: אוּלַי
  choice: Labda
  rationale: Huhifadhi uwezekano na sauti ya tahadhari katika maombezi ya Abrahamu.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: watapatikana huko watu ishirini
  rationale: Huhifadhi hali tendwa ya kitenzi huku ‘watu’ ikiongezwa kwa uwazi wa kawaida wa Kiswahili kutokana na muktadha wa wenye haki.
- source_word: לֹא אַשְׁחִית
  choice: Sitapaharibu
  rationale: Kiambishi cha mahali ‘pa’ kinawakilisha kitu kisichotajwa wazi—mahali au mji unaozungumziwa—bila kukilazimisha kuwa Sodoma pekee.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: kwa ajili ya hao ishirini
  rationale: Hueleza mantiki ya kuisitiri mahali kwa sababu ya watu ishirini waliotajwa, na ‘hao’ hudumisha urejeo maalumu wa kifungu chenye kiainishi.
theological_decisions:
- issue: Tafsiri ya אֲדֹנָי katika maneno ya Abrahamu
  choice: Bwana wangu
  alternative: bwana wangu
  rationale: Muktadha mpana humtambulisha anayesemeshwa kuwa wa kiungu. Herufi kubwa inaonyesha cheo cha kiungu bila kuingiza jina la agano YHWH, ambalo halitumiki katika kifungu hiki.
- issue: Kitu kinachoharibiwa hakitajwi wazi katika לֹא אַשְׁחִית
  choice: Sitapaharibu
  alternative: Sitauharibu mji huo
  rationale: Kiebrania hakina nomino ya wazi hapa. Umbo la mahali katika Kiswahili huhifadhi upana wa urejeo kwa mji au eneo linalozungumziwa badala ya kuufanya ‘mji’ kuwa wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mazungumzo na hali tendwa vimehifadhiwa, lakini ‘watu’ imeongezwa ili idadi ya watu isikike kwa kawaida. Hakuna alama za tanbihi kwa kuwa rasimu hii haihitaji tanbihi.
