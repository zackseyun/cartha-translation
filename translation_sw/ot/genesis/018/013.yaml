base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: sw
  text: BWANA akamwambia Abrahamu, “Kwa nini Sara alicheka, akisema, ‘Je, kweli nitazaa, hali mimi nimezeeka?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
- source_word: הַאַף אֻמְנָם
  choice: Je, kweli
  rationale: Huonyesha swali la mshangao na kutokuamini lililomo katika mkusanyiko huu wa maneno bila kuliongezea ufafanuzi.
- source_word: אֵלֵד
  choice: nitazaa
  rationale: Kitenzi cha Kiebrania kinamaanisha kuzaa; Kiswahili hiki ni cha moja kwa moja na hakiongezi nomino ‘mtoto’ ambayo haimo wazi katika mstari.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: hali mimi nimezeeka
  rationale: '‘Hali’ huwasilisha matumizi ya kiambatani ya waw katika muktadha huu: Sara anauliza kama atazaa akiwa tayari amezeeka.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu YHWH
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwasilishaji wa kawaida na unaotambulika sana katika Biblia za Kiswahili; herufi kubwa hutofautisha jina la Mungu na cheo cha kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa swali umehifadhi mshangao wa Sara, na usemi wa moja kwa moja umewekwa kwa mtiririko wa kawaida wa Kiswahili.
