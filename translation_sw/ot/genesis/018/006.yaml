  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: sw
  text: Abrahamu akaingia haraka hemani, akamwambia Sara, “Fanya haraka, kanda sea tatu[a][b] za unga laini, na utengeneze mikate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sea ilikuwa kipimo cha zamani cha vitu vikavu; sea tatu ni karibu lita 20–22.
    reason: cultural_note
  - marker: b
    text: Au, “vipimo vitatu vya unga laini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: akafanya haraka
  rationale: Kitenzi hiki kinaonyesha kutenda kwa haraka; usemi huu ni wa kawaida katika Kiswahili na unahifadhi uharaka wa simulizi.
- source_word: הָאֹהֱלָה
  choice: kwenda ndani ya hema
  rationale: Kiambishi cha mwelekeo kinaonyesha mwendo kuelekea hemani; muktadha unaonyesha Abrahamu aliingia ili kusema na Sara.
- source_word: מַהֲרִי
  choice: Haraka!
  rationale: Ni amri ya haraka iliyoelekezwa kwa Sara; tamko hili fupi linaonyesha msisitizo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: שְׁלֹשׁ סְאִים
  choice: sea tatu
  rationale: Sea ni kipimo mahususi cha zamani. Kukihifadhi kunaonyesha kwa uwazi kitengo halisi cha matini chanzo, huku tanbihi ikieleza ukubwa wake na kutoa tafsiri mbadala.
- source_word: קֶמַח סֹלֶת
  choice: unga laini
  rationale: Kirai hiki kinamaanisha unga wa hali nzuri uliosagwa vizuri; “unga laini” ni wazi na cha kawaida katika Kiswahili.
- source_word: לוּשִׁי
  choice: ukande
  rationale: Kitenzi kinahusu hasa kukanda unga, si kuchanganya tu.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: na kutengeneza mikate
  rationale: עֻגוֹת ni mikate ya mviringo, huenda iliyotayarishwa haraka. “Mikate” ni neno la kawaida lisiloongeza mbinu ya kuipika ambayo matini haijaitaja.
