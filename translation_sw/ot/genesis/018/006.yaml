  - severity: medium
    issue: Muundo wa amri “ukande na kutengeneza mikate” haulingani.
    rationale: Baada ya “ukande,” sehemu ya pili inahitaji kitenzi cha amri kinacholingana, yaani “utengeneze,” badala ya kitenzi-jina “kutengeneza.”
  - severity: low
