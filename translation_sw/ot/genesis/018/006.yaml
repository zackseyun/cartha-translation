  source_fidelity: 'Maana kuu imehifadhiwa: Abrahamu anaenda kwa haraka hemani kwa Sara, na anamwamuru aandaye sea tatu za unga laini kwa kukanda na kutengeneza mikate. Hata hivyo, “chukua” huongeza kitenzi ambacho hakipo wazi katika Kiebrania, na mfuatano “ukande na kutengeneza” haulingani kisarufi na amri ya pili.'
  naturalness: Sentensi ya mwanzo ya rasimu ni nzito kidogo (“akafanya haraka kwenda ndani ya hema kwa Sara”). “Akaingia haraka hemani, akamwambia Sara” ni ya kawaida zaidi katika Kiswahili Sanifu. Amri mbili sambamba, “kanda ... na utengeneze ...,” ni fasaha na wazi.
  terminology: “Sea” huhifadhi kipimo cha kale cha matini, na tanbihi hueleza maana yake. “Unga laini” ni sahihi kwa קֶמַח סֹלֶת. “Mikate” ni tafsiri salama ya עֻגוֹת bila kudokeza keki tamu au mbinu mahsusi ya kuoka.
