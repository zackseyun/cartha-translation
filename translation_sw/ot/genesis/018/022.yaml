base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: sw
  text: Kisha wale watu wakageuka kutoka hapo, wakaelekea Sodoma[a]. Lakini Abrahamu alikuwa bado amesimama mbele ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya ushahidi wa kale unasoma, “Yahwe alikuwa bado amesimama mbele ya Abrahamu.” Maandishi ya Kiebrania ya Kimasora yanasoma, “Abrahamu alikuwa bado amesimama mbele ya Yahwe.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: wakageuka
  rationale: Kitenzi פנה hapa kinaonyesha kubadili mwelekeo na kuondoka mahali walipokuwa; “wakageuka” huhifadhi mwendo wa simulizi bila kuongeza maelezo.
- source_word: מִשָּׁם
  choice: kutoka hapo
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kielezi cha mahali.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Nomino ya Kiebrania ni “watu/wanaume”; “wale watu” ni ya asili katika muktadha na haingizi moja kwa moja tafsiri kuhusu utambulisho wao.
- source_word: וַיֵּלְכוּ סְדֹמָה
  choice: wakaelekea Sodoma
  rationale: Kiambishi cha mwelekeo katika סְדֹמָה kinaonyesha kwenda upande wa Sodoma; “wakaelekea” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: alikuwa bado amesimama
  rationale: Muundo huu unaonyesha hali inayoendelea; kauli hii ya Kiswahili huonyesha wazi kwamba Abrahamu aliendelea kusimama.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Huhifadhi maana ya kuwa mbele ya mtu au katika uwepo wake, kwa mtindo wa Kiswahili unaofaa simulizi la Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kwa umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Umbo la kishazi cha mwisho
  choice: Abrahamu alikuwa bado amesimama mbele za Yahwe
  alternative: Yahwe alikuwa bado amesimama mbele ya Abrahamu
  rationale: Maandishi ya Kimasora yaliyotolewa yanasema kwamba Abrahamu ndiye aliyesimama mbele za Yahwe. Usomaji mwingine wa kale umehifadhiwa katika tanbihi bila kubadili matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni mwepesi kueleweka; “wale watu” huhifadhi lugha ya juu ya simulizi bila kuamua wazi utambulisho wao, na tanbihi huonyesha tofauti halisi ya maandishi.
