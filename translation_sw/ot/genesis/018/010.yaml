  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: sw
  text: Naye akasema, “Hakika nitarudi kwako majira kama haya mwakani,[a] na tazama, Sara mke wako atakuwa na mwana.” Sara alikuwa akisikiliza mlangoni mwa hema, nalo lilikuwa nyuma yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wakati huu wa uhai”; katika muktadha huu maana yake ni majira kama haya mwaka ujao.
    reason: lexical_alternative
  - marker: b
    text: Kwa hali halisi, Kiebrania ni “naye/alikuwa nyuma yake.” Virejeo vya viwakilishi ni vifupi; inaeleweka kwa kawaida kuwa hema au mlango wake ulikuwa nyuma ya msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Huhifadhi mtiririko wa simulizi wa Kiebrania bila kutaja wazi utambulisho wa msemaji.
- source_word: שׁוֹב אָשׁוּב
  choice: Hakika nitarudi
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi unasisitiza uhakika wa kurudi; “hakika” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: אֵלֶיךָ
  choice: kwako
  rationale: Huwakilisha moja kwa moja kiambishi cha nafsi ya pili umoja wa kiume bila kuongeza jina la anayesemeshwa.
- source_word: כָּעֵת חַיָּה
  choice: majira kama haya mwakani
  rationale: Ni nahau inayorejelea wakati au majira yanayolingana katika mwaka unaofuata; tafsiri hii ni ya asili na inaeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi nguvu ya chembe ya kuelekeza fikira katika tangazo hili zito.
- source_word: בֵן
  choice: mwana
  rationale: “Mwana” ni neno la heshima na la kawaida katika sajili ya kibiblia kwa mtoto wa kiume.
- source_word: לְשָׂרָה אִשְׁתֶּךָ
  choice: Sara mke wako atakuwa na mwana
  rationale: Huwasilisha kwa Kiswahili cha asili maana ya muundo wenye ל, yaani mwana kuwa wa Sara.
- source_word: שָׂרָה שֹׁמַעַת
  choice: Sara alikuwa akisikiliza
  rationale: Muundo wa kuendelea huonyesha tendo lililokuwa likiendelea wakati wa mazungumzo.
- source_word: פֶּתַח הָאֹהֶל
  choice: kwenye mwingilio wa hema
  rationale: Hutoa mahali pa Sara kwa lugha iliyo wazi na yenye hadhi.
- source_word: וְהוּא אַחֲרָיו
  choice: uliokuwa nyuma yake
  rationale: Inachukua kiwakilishi kuwa kinarejelea mwingilio wa hema, huku tanbihi ikihifadhi ufupi na utata wa viwakilishi vya Kiebrania.
theological_decisions:
- issue: Utambulisho wa msemaji
  choice: Kumrejelea tu kwa “yeye” iliyomo katika “akasema”
  alternative: “BWANA akasema” au “mmoja wa wale watu akasema”
  rationale: Kitenzi cha Kiebrania hapa kina nafsi ya tatu umoja bila kumtaja tena msemaji; kutaja utambulisho wake kungeingiza uamuzi wa kifasiri kutoka muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Majira kama haya mwakani” limetumiwa kama nahau ya asili; utata wa mwisho wa mstari umehifadhiwa katika tanbihi.
