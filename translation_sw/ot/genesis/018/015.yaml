base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: sw
  text: Lakini Sara akakana[a], akisema, “Sikucheka,” kwa sababu aliogopa. Lakini akasema, “La[b], bali ulicheka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sara alisema uongo,” au, “Sara alikana.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kukana au kusema lisilo kweli; hapa kinahusu kukana kwake kwamba alikuwa amecheka.
    reason: lexical_alternative
  - marker: b
    text: Msemaji hajatajwa wazi katika kifungu hiki; muktadha unamhusisha na BWANA katika simulizi linalozunguka mstari huu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: akakana
  rationale: Kitenzi כחשׁ katika piel kinaweza kumaanisha kukana au kusema uongo. Katika muktadha huu Sara anakana kwamba alicheka; “akakana” ni ya asili na haiongezi hukumu ya kimaadili isiyolazimishwa na neno lenyewe.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni tamko la kawaida la Kiebrania linalotanguliza usemi wa moja kwa moja; “akisema” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: לֹא צָחַקְתִּי
  choice: Sikucheka
  rationale: Huwakilisha moja kwa moja kitenzi timilifu cha nafsi ya kwanza umoja kilichokanushwa.
- source_word: כִּי יָרֵאָה
  choice: kwa sababu aliogopa
  rationale: כִּי hapa inaonyesha sababu ya kukana kwa Sara; tafsiri hii inaweka wazi uhusiano huo wa kisababishi.
- source_word: וַיֹּאמֶר
  choice: Lakini akasema
  rationale: Waw ya kisimulizi inaendeleza tukio, huku “Lakini” ikionyesha wazi tofauti kati ya kukana kwa Sara na jibu linalomsahihisha.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: Sivyo; ulicheka
  rationale: לֹא ya kwanza inakataa madai ya Sara, na כִּי inasisitiza jibu linalopingana nalo. “Sivyo; ulicheka” ni jibu la kawaida la Kiswahili linalohifadhi ukali wa masahihisho bila kuongeza maneno yasiyokuwapo.
theological_decisions:
- issue: Utambulisho wa msemaji katika וַיֹּאמֶר
  choice: Kutumia “akasema” bila kumtaja msemaji
  alternative: “BWANA akasema” au “mmoja wa wale watu akasema”
  rationale: Kifungu hiki kina kitenzi cha kiume umoja lakini hakimtaji tena mhusika. Muktadha mpana humhusianisha msemaji na BWANA, lakini mstari wenyewe haurudii jina hilo; kwa hiyo tafsiri inaacha muktadha utambulishe msemaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “Sivyo” hutumika kama jibu la kupinga madai yaliyotangulia, na utambulisho usiotajwa wazi wa msemaji umehifadhiwa.
