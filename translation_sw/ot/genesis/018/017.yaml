  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: sw
  text: Yahwe akasema[a], “Je, nimfiche Abraham jambo ninalofanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Je, ninamficha Abraham jambo ninalofanya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַֽ/יהֹוָ֖ה
  choice: Yahwe
  rationale: Limetafsiriwa kama jina la agano la Mungu kwa umbo la Kiswahili linalosomeka kwa kawaida, badala ya cheo ‘BWANA’.
- source_word: אָמָ֑ר
  choice: akasema
  rationale: Wayyiqtol inaendeleza simulizi; ‘akasema’ ni wakati uliopita wa kisimulizi unaofaa katika Kiswahili.
- source_word: הַֽ/מְכַסֶּ֤ה אֲנִי֙
  choice: Je, nimfiche
  rationale: Swali lenye kiambishi cha kuuliza na participle lina nguvu ya kujadiliana moyoni; umbo la ‘nimfiche’ huhifadhi maana ya ‘Je, nifanye hivyo?’ bila kulifanya kuwa taarifa ya kawaida.
- source_word: מֵֽ/אַבְרָהָ֔ם
  choice: Abraham
  rationale: Katika Kiswahili, kitenzi ‘kumficha mtu jambo’ huwasilisha kwa kawaida maana ya kutomjulisha; hivyo maana ya מִן imebebwa na muundo wa kitenzi bila kuongeza ‘kutoka kwa’ isiyo ya kawaida.
- source_word: אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה
  choice: jambo ninalofanya
  rationale: Hufuata kwa karibu participle ya Kiebrania ‘ninalofanya’ na kuhifadhi uwezekano wa tendo linaloendelea au lililo karibu kutendeka, bila kuongeza wazi ‘ninalokaribia kufanya’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina maalumu la Mungu, tetragramatoni; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya swali הַמְכַסֶּה אֲנִי
  choice: Je, nimfiche
  alternative: Je, ninamficha
  rationale: Chaguo kuu linaonyesha swali la kujadiliana kuhusu hatua itakayochukuliwa, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya umbo la participle.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida. Muundo ‘kumficha mtu jambo’ umetumiwa kwa ufasaha wa Kiswahili, na tanbihi imehifadhi usomaji wa karibu zaidi wa participle ya Kiebrania.
