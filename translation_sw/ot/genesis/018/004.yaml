  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: sw
  text: Tafadhali, mletewe maji kidogo, mkanawe miguu yenu, kisha mpumzike chini ya mti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjiegemeze chini ya mti.” Kitenzi cha Kiebrania kinaweza kumaanisha kihalisi “kujiegemeza” au “kuegemea”; hapa kinaonyesha kupumzika kivulini kama sehemu ya ukarimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: Tafadhali, na yaletwe
  rationale: Kauli ya kutendwa yenye maana ya ombi la heshima imehifadhiwa kwa muundo wa Kiswahili wa ‘na yaletwe,’ huku נָא ikiwakilishwa na ‘Tafadhali.’
- source_word: מְעַט מַיִם
  choice: maji kidogo
  rationale: Huhifadhi maana ya kiasi kidogo cha maji na unasikika kwa kawaida katika Kiswahili.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: mnawishe miguu yenu
  rationale: Kitenzi cha Kiebrania ni agizo/ombi kwa wageni katika muktadha wa ukarimu; ‘mnawishe’ ni mwaliko wa heshima unaofaa kwa wingi.
- source_word: וְהִשָּׁעֲנוּ
  choice: mpumzike
  rationale: Ingawa maana ya msingi ni kujiegemeza au kuketi kwa kuegemea, katika muktadha huu kitenzi kinaeleza kupumzika chini ya kivuli; ‘mpumzike’ ni cha kawaida na cha heshima.
- source_word: תַּחַת הָעֵץ
  choice: chini ya mti
  rationale: Hutoa kwa uwazi mahali palipoonyeshwa na kihusishi na hudumisha umahususi wa mti unaojulikana katika muktadha.
