base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: sw
  text: Kisha akachukua maziwa yaliyoganda[a], maziwa, na ndama aliyekuwa ameandaliwa, akaviweka mbele yao. Naye alikuwa amesimama karibu nao chini ya ule mti, walipokuwa wakila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “krimu” au “siagi”; neno la Kiebrania linamaanisha chakula kizito cha maziwa, na maana yake kamili hutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: maziwa yaliyoganda
  rationale: Neno hili linamaanisha chakula kizito cha maziwa, ambacho huenda kilikuwa maziwa yaliyoganda, krimu, au siagi. Katika mazingira ya ufugaji ya simulizi hili, “maziwa yaliyoganda” ni tafsiri ya kawaida isiyoleta picha ya siagi ya mezani ya kisasa.
- source_word: חָלָב
  choice: maziwa
  rationale: Hili ndilo neno la kawaida la Kiebrania kwa maziwa.
- source_word: וּבֶן הַבָּקָר
  choice: yule ndama
  rationale: Kirai hiki, kihalisi “mwana wa ng’ombe,” ni nahau inayomaanisha ng’ombe mchanga; pia kinarejelea mnyama maalumu aliyeandaliwa katika mstari uliotangulia.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyekuwa ameandaliwa
  rationale: Ingawa kitenzi kina maana pana ya kufanya au kutengeneza, katika muktadha wa chakula kinamaanisha kuandaa. Muundo wa kutendwa huepuka kumtaja Abrahamu kuwa ndiye aliyemwandaa, kwa kuwa mstari uliotangulia unasema mtumishi ndiye aliyefanya hivyo.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: akaviweka mbele yao
  rationale: Nahau ya Kiebrania ya kutoa mbele yao hapa inamaanisha kuweka chakula mbele ya wageni. Kiambishi “vi-” kinarejelea kwa kawaida vitu vyote vya chakula vilivyotajwa.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: Naye akasimama karibu nao
  rationale: Kihalisi ni “alikuwa amesimama juu yao,” lakini katika muktadha huu inaonyesha mwenyeji aliyesimama karibu na wageni akiwahudumia; “karibu nao” huepuka dhana potovu ya kuwakalia au kuwatawala.
- source_word: תַּחַת הָעֵץ
  choice: chini ya ule mti
  rationale: Tafsiri ya moja kwa moja na ya kawaida; kibainishi kinaonyesha mti uliokwisha kutajwa katika muktadha.
- source_word: וַיֹּאכֵלוּ
  choice: walipokuwa wakila
  rationale: Huwasilisha kwa Kiswahili uhusiano wa wakati kati ya kusimama kwa Abrahamu karibu nao na kula kwa wageni, bila kubadili maana ya simulizi.
theological_decisions:
- issue: Iwapo utambulisho wa wageni uonyeshwe kwa maneno yanayotanguliza tafsiri ya baadaye ya kiteolojia
  choice: Mstari umetafsiriwa kwa lugha ya kawaida ya simulizi la ukarimu wa Abrahamu.
  alternative: Kutumia lugha iliyotukuzwa zaidi ili kudokeza moja kwa moja hali ya kimungu ya wageni.
  rationale: Mstari wenyewe unaeleza ukarimu na huduma ya Abrahamu. Tafsiri haipaswi kuingiza hitimisho la Kikristo kuhusu Kristo au Utatu ambalo halijaelezwa wazi katika maneno haya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Maziwa yaliyoganda” ni rahisi kueleweka katika mazingira ya ufugaji; “akaviweka mbele yao” ni ya kawaida katika muktadha wa kuandaa chakula; na “karibu nao” huonyesha huduma ya mwenyeji huku tanbihi ikihifadhi usemi halisi wa Kiebrania.
