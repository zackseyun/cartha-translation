base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: sw
  text: Akasema[a], “Bwana wangu, ikiwa nimepata kibali machoni pako, tafadhali usimpite mtumishi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Bwana,” ikiwa maneno ya Abrahamu yanaelekezwa hasa kwa Mungu badala ya kuwa namna ya heshima ya kumwambia mgeni.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Akasema
  rationale: Ka- ya usimulizi hutoa mtiririko wa kawaida wa simulizi la Kiebrania bila kulazimisha tofauti kati ya ‘na’ na ‘kisha’.
- source_word: אֲדֹנָי
  choice: Bwana wangu
  rationale: Ni namna ya heshima ya kumwambia aliye mkuu; pia inadumisha uwezekano kwamba Abrahamu anamwambia Mungu, bila kulazimisha hitimisho hilo katika matini kuu.
- source_word: אִם נָא
  choice: ikiwa
  rationale: Inaingiza ombi la heshima. Hisia ya kusihi katika נָא imeonyeshwa baadaye kwa ‘tafadhali,’ ili Kiswahili kisijirudie kwa namna isiyo ya kawaida.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nimepata kibali machoni pako
  rationale: Inahifadhi nahau na taswira ya Kiebrania kwa Kiswahili kinachoeleweka, bila kuingiza maana za kiteolojia zisizolazimishwa na muktadha.
- source_word: אַל נָא
  choice: tafadhali usimpite
  rationale: Inaunganisha katazo na ombi la heshima kwa Kiswahili cha kawaida, huku ikidumisha sauti ya kusihi.
- source_word: תַעֲבֹר מֵעַל
  choice: usimpite
  rationale: Kitenzi pamoja na kihusishi kinaonyesha kupita mbele ya mtu na kuendelea na safari; ‘usimpite’ ni fupi na ya kawaida katika muktadha huu.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Hapa ni kujitaja kwa unyenyekevu mbele ya aliye mkuu au mgeni mwenye kuheshimiwa, si kusisitiza hali ya utumwa.
theological_decisions:
- issue: Iwapo אֲדֹנָי itafsiriwe kama jina la kumwelekea Mungu (‘Bwana’) au kama namna ya heshima (‘bwana wangu’)
  choice: Bwana wangu
  alternative: Bwana
  rationale: Mwanzo 18 inasema BWANA alimtokea Abrahamu, lakini katika mstari huu Abrahamu anamwelekea mtu mmoja kati ya wageni kwa viambishi vya nafsi ya pili umoja. ‘Bwana wangu’ huhifadhi heshima na utata wa kimuktadha; uwezekano wa kumwelekea Mungu umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Bwana wangu’ ni cha heshima bila kuwa kizito kupita kiasi; ‘mtumishi wako’ huhifadhi unyenyekevu wa usemi wa kale.
