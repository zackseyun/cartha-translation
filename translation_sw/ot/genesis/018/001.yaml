base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: sw
  text: Yahwe alimtokea karibu na mialoni ya Mamre[a], alipokuwa ameketi kwenye mlango wa hema wakati wa joto la mchana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karibu na mivinje ya Mamre.” Neno la Kiebrania linaweza kumaanisha miti mikubwa kama mialoni au mivinje.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: alimtokea
  rationale: Huwasilisha kwa kawaida tendo la kuonekana kwa mtu mwingine, huku ikidumisha wazo halisi la kujidhihirisha kwa kuonekana bila kuongeza ufafanuzi wa kitheolojia.
- source_word: אֵלָיו
  choice: -m- katika “alimtokea”
  rationale: Kiambishi cha yambwa cha nafsi ya tatu umoja kinamrejelea Abrahamu kutokana na muktadha uliotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo, kulingana na maandishi ya Kiebrania.
- source_word: בְּאֵלֹנֵי
  choice: karibu na mialoni ya
  rationale: Kihusishi kinaonyesha mahali, na neno la miti linaweza kumaanisha mialoni au miti mikubwa kama mivinje; “mialoni” ni wazi katika matini kuu, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: מַמְרֵא
  choice: Mamre
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: וְהוּא יֹשֵׁב
  choice: alipokuwa ameketi
  rationale: Muundo huu unaonyesha hali ya wakati huo kama mandharinyuma ya kutokea kwa Yahwe, kwa Kiswahili cha kawaida na cha simulizi.
- source_word: פֶּתַח הָאֹהֶל
  choice: kwenye mlango wa hema
  rationale: “Mlango” hapa ni uwazi au mahali pa kuingilia hema, si lazima jani la mlango; usemi huu ni wa kawaida na unaeleweka.
- source_word: כְּחֹם הַיּוֹם
  choice: wakati wa joto la mchana
  rationale: Huhifadhi maana ya kipindi cha joto cha siku bila kubainisha saa kamili kama vile adhuhuri.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Utata kuhusu aina halisi ya miti umehifadhiwa kwa tanbihi.
