  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: sw
  text: Kisha wale watu wakainuka kutoka pale, wakatazama chini kuelekea Sodoma[a], naye Abrahamu akaandamana nao ili kuwasindikiza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakatazama kutoka juu upande wa Sodoma.” Kitenzi cha Kiebrania hudokeza kutazama kutoka mahali palipoinuka.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili kuwaaga waendelee na safari.” Usemi wa Kiebrania unahusu kuandamana na wageni wanaoondoka na kuwaacha waendelee na safari yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaonyesha kuinuka baada ya tukio lililotangulia; “wakainuka” huhifadhi tendo hilo bila kulifasiri moja kwa moja kuwa kuondoka.
- source_word: מִשָּׁם
  choice: kutoka pale
  rationale: Ni tafsiri ya kawaida na ya asili ya kielezi cha mahali, ikionyesha mpito kutoka eneo walilokuwako.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Kiebrania kinatumia neno la kawaida אֲנָשִׁים, “watu/wanaume.” “Wale watu” ni Kiswahili cha kawaida na huhifadhi mvutano wa simulizi bila kuwatambulisha mapema kuwa malaika.
- source_word: וַיַּשְׁקִפוּ
  choice: wakatazama chini
  rationale: Kitenzi שׁקף mara nyingi hudokeza kutazama kutoka mahali palipoinuka; “wakatazama chini” huhifadhi maana hiyo ya mwelekeo.
- source_word: עַל־פְּנֵי סְדֹם
  choice: kuelekea Sodoma
  rationale: Kirai hiki kinaonyesha mwelekeo kuelekea Sodoma; maana ya kutazama kutoka juu tayari imebebwa na “wakatazama chini.”
- source_word: הֹלֵךְ עִמָּם
  choice: akaandamana nao
  rationale: Muundo wa kishirikishi unaonyesha tendo linaloendelea la Abrahamu kwenda pamoja nao. “Akaandamana nao” ni ya asili na huonyesha ufuatanaji huo.
- source_word: לְשַׁלְּחָם
  choice: ili kuwasindikiza
  rationale: Katika muktadha wa ukarimu, שׁלח hapa ni kuandamana na wageni wanaoondoka na kuwaaga waendelee na safari; “kuwasindikiza” huwasilisha maana hiyo kwa ufupi.
theological_decisions:
- issue: Utambulisho wa הָאֲנָשִׁים katika muktadha
  choice: Kutafsiri “wale watu” katika matini kuu
  alternative: “wale wageni” au “wale malaika”
  rationale: Aya yenyewe inatumia nomino ya kawaida inayomaanisha watu/wanaume. Kutowaita “malaika” hapa huhifadhi namna simulizi linavyofunua utambulisho wao hatua kwa hatua na huepuka kuingiza hitimisho la kimuktadha ndani ya neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. “Wale watu” ni cha kawaida kuliko “wale wanaume” katika simulizi hili na bado huhifadhi neno la Kiebrania bila kulifasiri kuwa “wageni” au “malaika.” Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
