  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: sw
  text: Kwa maana nimemjua[a], ili awaagize wanawe[b] na watu wa nyumbani mwake baada yake, nao waishike njia ya Yahweh[c] kwa kutenda uadilifu na haki, ili Yahweh amtimizie Abrahamu yale aliyosema kumhusu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimemchagua.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kujua,” lakini hapa kinaweza kuwa na maana ya kujua kwa uhusiano wa pekee au ya kumchagua.
    reason: alternative_reading
  - marker: b
    text: Kiebrania kinasema kihalisi “wanawe,” katika umbo la kiume; kutajwa kwa watu wa nyumbani mwake kunapanua kundi linalohusika.
    reason: lexical_alternative
  - marker: c
    text: Yaani, mwenendo wa maisha anaoutaka Yahweh.
    reason: cultural_note
  - marker: d
    text: Au, “yale aliyomwahidi.” Kiebrania kinasema kwa karibu zaidi, “yale aliyosema kumhusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutanguliza sababu ya kauli iliyotangulia na hudumisha nguvu yake ya ufafanuzi kwa Kiswahili cha kawaida.
- source_word: יְדַעְתִּיו
  choice: nimemjua
  rationale: Kitenzi ידע kwa msingi humaanisha ‘kujua’; hapa kinaweza pia kudokeza uhusiano wa pekee au uteuzi, lakini tafsiri ya moja kwa moja huhifadhi mvutano huo.
- source_word: לְמַעַן אֲשֶׁר
  choice: kusudi
  rationale: Huonyesha lengo au matokeo yanayokusudiwa kwa lugha fupi na ya asili.
- source_word: יְצַוֶּה
  choice: awaagize
  rationale: Piel ya צוה ina nguvu ya kuamuru au kutoa agizo. ‘Awaagize’ ni ya heshima na hudumisha mamlaka ya kauli bila kuwa ngumu.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Nomino ya Kiebrania ni wingi wa kiume, ‘wanawe’; tafsiri hii hudumisha umbo la chanzo, huku ‘watu wa nyumbani mwake’ ikipanua kundi linalohusika.
- source_word: בֵּיתוֹ
  choice: watu wa nyumbani mwake
  rationale: Katika muktadha huu בית ni jamaa na watu walio chini ya nyumba yake, si jengo lenyewe.
- source_word: אַחֲרָיו
  choice: baada yake
  rationale: Huonyesha mfuatano wa vizazi baada ya Abrahamu.
- source_word: וְשָׁמְרוּ
  choice: nao waishike
  rationale: שׁמר pamoja na ‘njia’ humaanisha kuifuata au kuitunza kwa uaminifu; ‘waishike’ ni usemi wa kawaida wa Kiswahili.
- source_word: דֶּרֶךְ יְהוָה
  choice: njia ya Yahweh
  rationale: Ni usemi wa kimaadili unaomaanisha mwenendo anaoutaka Yahweh; ‘njia’ huhifadhi sitiari ya chanzo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: kwa kutenda uadilifu na haki
  rationale: Infinitivu inaeleza namna ya kuishika njia ya Yahweh. ‘Uadilifu na haki’ hutofautisha maneno hayo mawili yanayohusiana bila kuyaunganisha kuwa dhana moja.
- source_word: לְמַעַן הָבִיא
  choice: kusudi ... amletee
  rationale: Hudumisha kishazi cha pili cha kusudi na wazo la Yahweh kumfikishia Abrahamu jambo alilosema.
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: yale aliyosema kumhusu
  rationale: Hufuata kwa karibu maana ya ‘aliyosema kumhusu’ bila kuibadili moja kwa moja kuwa ‘aliyomwahidi,’ ingawa ahadi inadokezwa na muktadha.
theological_decisions:
- issue: Ikiwa ידע itafsiriwe kwa maana ya uteuzi au ya kujua kwa uhusiano
  choice: nimemjua
  alternative: nimemchagua
  rationale: Maana ya msingi ya kitenzi ni ‘kujua,’ lakini muktadha unaweza kujumuisha kibali na uteuzi wa pekee. Maandishi makuu hayafungi tafsiri hiyo; uwezekano wa ‘nimemchagua’ umewekwa katika tanbihi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kina jina binafsi la Mungu. ‘Yahweh’ hulihifadhi badala ya kutumia cheo mbadala.
- issue: Uhusiano kati ya usemi wa Mungu na ahadi yake kwa Abrahamu
  choice: yale aliyosema kumhusu
  alternative: yale aliyomwahidi
  rationale: Kiebrania kinasema kwa upana ‘aliyosema kumhusu.’ ‘Aliyomwahidi’ inawezekana kimuktadha lakini ingefanya maana ya ahadi kuwa wazi zaidi kuliko muundo wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi vifungu viwili vya kusudi vya Kiebrania, huku msamiati kama ‘watu wa nyumbani,’ ‘uadilifu,’ na ‘haki’ ukibaki wazi kwa msomaji wa kawaida.
