base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: sw
  text: Kisha akasema, “Tafadhali, Bwana wangu[a] asikasirike, nami nitasema. Labda watu thelathini watapatikana huko.” Naye akasema, “Sitafanya hivyo ikiwa nitapata watu thelathini huko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana wangu.” Cheo hiki cha Kiebrania kinaweza kusomwa kama namna ya heshima ya kumwita mtu; hapa kimeandikwa kwa herufi kubwa kwa sababu muktadha unaonyesha anayesemeshwa kuwa Bwana.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: asikasirike
  rationale: Kauli hii ya heshima yenye ombi la upole imewasilishwa kwa Kiswahili cha kawaida kama ombi lisilo la moja kwa moja; muktadha na mpangilio wa maneno unaendeleza sauti ya unyenyekevu.
- source_word: לַאדֹנָי
  choice: Bwana wangu
  rationale: Huhifadhi cheo chenye kiambishi cha nafsi ya kwanza, ‘bwana wangu,’ na herufi kubwa inaonyesha kuwa anayesemeshwa anaeleweka katika muktadha kuwa Bwana.
- source_word: וַאֲדַבֵּרָה
  choice: nami nitasema
  rationale: Huwasilisha kohortativi kama nia au ombi la unyenyekevu la kuendelea kusema, bila kulipanua mno.
- source_word: אוּלַי
  choice: Labda
  rationale: Neno hili linaonyesha uwezekano na sauti ya tahadhari katika maombezi ya Abrahamu.
- source_word: יִמָּצְאוּן
  choice: watapatikana
  rationale: Kauli ya kutendwa ya kitenzi מצא imehifadhiwa kwa umbo la kutendwa la Kiswahili.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinaelekeza kwenye mji au eneo lililokuwa likizungumziwa; ‘huko’ ni la kawaida na wazi katika Kiswahili.
- source_word: שְׁלֹשִׁים
  choice: thelathini
  rationale: Ni tafsiri ya moja kwa moja ya namba, huku nomino ‘watu’ ikibaki kudokezwa kama ilivyo katika Kiebrania.
- source_word: לֹא אֶעֱשֶׂה
  choice: Sitafanya hivyo
  rationale: Kitendwa hakijatajwa katika Kiebrania lakini kinaeleweka kuwa ni tendo la kuuangamiza mji; ‘hivyo’ huhifadhi ufupi bila kulitaja wazi zaidi kuliko chanzo.
- source_word: אִם אֶמְצָא
  choice: nikipata
  rationale: Umbo la masharti la Kiswahili linaonyesha kwa kawaida maana ya ‘ikiwa nitapata’ kwa kauli fupi na ya moja kwa moja.
theological_decisions:
- issue: Jinsi ya kutafsiri אֲדֹנָי katika hotuba ya Abrahamu
  choice: Bwana wangu
  alternative: bwana wangu
  rationale: Muktadha wa tukio unaonyesha Abrahamu anamwelekea mhusika wa kiungu, hivyo herufi kubwa inafaa; tanbihi huhifadhi uwezekano wa kulisoma kama jina la heshima kwa mkuu bila kuingiza jina la agano ambalo halipo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaendeleza unyenyekevu wa Abrahamu na ufupi wa jibu, huku ukiacha ‘watu’ kudokezwa baada ya ‘thelathini’ kama katika chanzo.
