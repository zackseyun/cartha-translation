base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: sw
  text: Ndipo Ibrahimu akajibu na kusema[a], “Tazama, naomba, nimethubutu kusema na Bwana wangu, ingawa mimi ni mavumbi na majivu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana wangu.” Umbo la Kiebrania linaweza kutumiwa kumwita mtu kwa heshima; hapa “Bwana” limeandikwa kwa herufi kubwa kwa sababu muktadha unaonyesha kwamba anayesemeshwa ni BWANA.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Huhifadhi kitenzi cha simulizi kinachoanzisha jibu katika mazungumzo.
- source_word: וַיֹּאמַר
  choice: na kusema
  rationale: Huhifadhi jozi ya vitenzi ya Kiebrania badala ya kuvifupisha kuwa kitenzi kimoja.
- source_word: הִנֵּה נָא
  choice: Tazama, tafadhali
  rationale: “Tazama” huvuta fikira, na “tafadhali” huhifadhi ombi la heshima la נָא kwa Kiswahili cha sasa.
- source_word: הוֹאַלְתִּי
  choice: nimethubutu
  rationale: Huwasilisha kujipa moyo au kuthubutu kufanya jambo katika muktadha wa unyenyekevu, bila kupoteza ujasiri wa Abrahamu.
- source_word: לְדַבֵּר
  choice: kusema na
  rationale: Katika Kiswahili, “kusema na” ni njia ya kawaida ya kueleza kumwelekea mtu kwa maneno; huepuka “kuzungumza na,” ambayo inaweza kusisitiza mazungumzo ya pande mbili.
- source_word: אֶל אֲדֹנָי
  choice: na Bwana wangu
  rationale: Huhifadhi maana ya “bwana wangu”; herufi kubwa inaonyesha kwamba muktadha unamtambulisha anayeambiwa kuwa BWANA, bila kubadili neno lenyewe kuwa jina la agano.
- source_word: וְאָנֹכִי
  choice: ingawa mimi ni
  rationale: 'Kiunganishi cha Kiebrania kina nguvu ya utofautishaji katika muktadha: Abrahamu anatofautisha ujasiri wake wa kusema na udogo wake.'
- source_word: עָפָר וָאֵפֶר
  choice: mavumbi na majivu
  rationale: Ni usemi unaoonyesha udhaifu, umauti, na kutokuwa na maana kwa mwanadamu; “mavumbi na majivu” ni Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Tafsiri ya אֲדֹנָי katika maneno ya Abrahamu
  choice: Bwana wangu
  alternative: bwana wangu
  rationale: Umbo la Kiebrania linaweza kuwa heshima kwa mkuu wa kibinadamu, lakini muktadha wa karibu unamwonyesha Abrahamu akimsemesha mgeni wa kiungu anayehusishwa na BWANA. Herufi kubwa huonyesha utambulisho huo wa kimuktadha huku tanbihi ikihifadhi uwezekano wa umbo la heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akajibu na kusema” umehifadhi marudio ya kimtindo ya Kiebrania; “Tazama, tafadhali” inadumisha uzito wa heshima bila kutumia lugha iliyopitwa na wakati.
