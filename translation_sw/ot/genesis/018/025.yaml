base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: sw
  text: Hasha kwako kufanya jambo kama hilo—kumwua mwenye haki pamoja na mwovu, ili mwenye haki awe sawa na mwovu. Hasha kwako! Je, Mwamuzi wa dunia yote hatatenda kwa haki?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה
  choice: Hasha kwako
  rationale: Usemi huu wa Kiswahili unaonyesha kwa nguvu kukataa na kuchukizwa na wazo hilo, huku ukihifadhi mwelekeo wa maneno 'kwako'.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: kufanya jambo kama hilo
  rationale: Ni usemi wa kawaida na wa wazi unaowasilisha maana ya kukataa kutenda jambo la aina hiyo.
- source_word: לְהָמִית
  choice: kumwua
  rationale: Kitenzi cha Kiebrania ni cha kisababishi, lakini katika Kiswahili 'kumwua' huwasilisha kwa kawaida na moja kwa moja kitendo cha kusababisha kifo.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Huhifadhi maana ya kimaadili na kimahakama katika utofautishaji wake na mwovu.
- source_word: עִם רָשָׁע
  choice: pamoja na mwovu
  rationale: Umoja wa Kiebrania umehifadhiwa, nao unaweza kutumiwa kiwakilishi kwa tabaka husika katika Kiswahili.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: hata mwenye haki awe sawa na mwovu
  rationale: Huonyesha matokeo yasiyokubalika kwamba mwenye haki na mwovu wangetendewa bila tofauti; 'sawa na' ni ya kawaida katika Kiswahili.
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: Mwamuzi wa dunia yote
  rationale: Hutumika kama cheo cha Mungu na kuhifadhi upeo wa ulimwengu mzima.
- source_word: מִשְׁפָּט
  choice: kutenda kwa haki
  rationale: Katika swali hili la balagha, neno linahusu kutenda kwa uadilifu wa kimahakama, si kutoa hukumu tu.
theological_decisions:
- issue: Namna ya kutafsiri changamoto ya balagha ya Abrahamu kuhusu tabia ya Mungu
  choice: Je, Mwamuzi wa dunia yote hatatenda kwa haki?
  alternative: Je, Mwamuzi wa dunia yote hatafanya yaliyo ya haki?
  rationale: Swali linatarajia jibu la kukubali na kuhifadhi ujasiri wa Abrahamu wa kukata rufaa kwa haki ya Mungu bila kupunguza mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Marudio ya 'Hasha kwako' yamehifadhiwa kwa msisitizo wa matini ya Kiebrania.
