  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: sw
  text: Basi Sara akacheka moyoni mwake, akisema, “Baada ya mimi kuchakaa, je, nitapata raha[a], ilhali bwana wangu ni mzee?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitapata furaha.” Huenda neno hili likadokeza raha ya kimapenzi au kurudi kwa nguvu za ujana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: akacheka
  rationale: Kitenzi צחק katika qal hapa humaanisha kucheka; muktadha unaonyesha mwitikio wa ndani wa Sara, si dhihaka ya wazi.
- source_word: בְּקִרְבָּהּ
  choice: moyoni mwake
  rationale: Kihalisi ni ‘ndani yake.’ Usemi ‘moyoni mwake’ ni wa kawaida katika Kiswahili na unaonyesha kwamba kicheko na maneno hayo yalikuwa ya ndani.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Nomino-kitenzi hii inatanguliza maneno yaliyonukuliwa; ‘akisema’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: אַחֲרֵי בְלֹתִי
  choice: Baada ya mimi kuchakaa
  rationale: בלה hubeba maana ya kuchakaa au kuharibika kwa kuzeeka. ‘Kuchakaa’ huhifadhi taswira hiyo ya mwili bila kuifanya iwe tu ‘kuzeeka,’ kwa kuwa uzee wa Abrahamu umetajwa kando.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: nitapata raha
  rationale: Muundo wa Kiswahili ‘nitapata raha’ unaeleza kwa kawaida swali la iwapo raha au furaha hiyo itakuwa yake, bila kufafanua kupita kiasi aina yake.
- source_word: עֶדְנָה
  choice: raha
  rationale: Neno hili adimu linaweza kumaanisha raha au furaha, huenda likiwa na vidokezo vya raha ya ndoa au nguvu za ujana. ‘Raha’ huhifadhi upana huo.
- source_word: וַאדֹנִי
  choice: ilhali bwana wangu
  rationale: Kiunganishi kimetafsiriwa ‘ilhali’ ili kuonyesha hali inayotofautishwa katika muktadha. ‘Bwana wangu’ ni namna ya heshima ambayo Sara anamtaja Abrahamu, si jina la Mungu.
- source_word: זָקֵן
  choice: ni mzee
  rationale: Hii ni tafsiri nyofu na ya kawaida ya kivumishi kinachoeleza uzee wa Abrahamu.
theological_decisions:
- issue: Maana pana ya עֶדְנָה katika kauli ya Sara
  choice: nitapata raha
  alternative: nitapata raha ya kimapenzi; nitapata tena nguvu za ujana
  rationale: Kiebrania huenda kinahusisha raha ya kimwili na uwezo wa kuzaa, lakini hakifafanui maana moja pekee. Tafsiri kuu imeacha maana hiyo ikiwa pana, na uwezekano mahususi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Moyoni mwake’ linaonyesha mwitikio wa ndani, ‘kuchakaa’ linahifadhi taswira ya Kiebrania, na ‘ilhali’ linaonyesha utofauti wa kimuktadha.
