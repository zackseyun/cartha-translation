base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: sw
  text: Je, kuna jambo lolote gumu mno kwa Yahwe?[a] Kwa wakati uliowekwa nitarudi kwako, majira kama haya mwakani,[b] naye Sara atakuwa na mwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, kuna jambo lolote la ajabu mno kwa Yahwe?” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa jambo ni la ajabu sana au liko nje ya uwezo wa kibinadamu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania, kwa karibu: “kama wakati wa uhai.” Maana ya nahau hii ina utata; huenda ikimaanisha majira kama haya mwaka unaofuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: kuna jambo lolote gumu mno
  rationale: Kitenzi פלא katika Niphal kinaweza kumaanisha kuwa jambo la ajabu, lisilo la kawaida, au lililo nje ya uwezo. Katika swali hili la balagha, “gumu mno” huonyesha jambo linalodhaniwa kuzidi uwezo bila kulifanya moja kwa moja kuwa “lisilowezekana.”
- source_word: מֵיְהוָה
  choice: kwa Yahwe
  rationale: Pamoja na פלא, kihusishi מן huonyesha mpaka wa uwezo au ulinganisho; Kiswahili cha kawaida hutumia “gumu mno kwa Yahwe.” Jina la agano יְהוָה limetafsiriwa “Yahwe.”
- source_word: דָּבָר
  choice: jambo lolote
  rationale: דָּבָר hapa ina maana pana ya jambo au kitu. “Jambo lolote” ni Kiswahili cha asili katika swali hili la balagha.
- source_word: לַמּוֹעֵד
  choice: Wakati uliowekwa
  rationale: מוֹעֵד ni wakati ulioteuliwa au uliowekwa. Tafsiri hii inadumisha wazo la wakati maalumu bila kuongeza maelezo yasiyokuwapo.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: nitakurudia
  rationale: שׁוּב hapa ni kurudi, na kiambishi cha nafsi ya pili ya kiume umoja kinamrejelea Abrahamu. “Nitakurudia” ni fupi na ya asili.
- source_word: כָּעֵת חַיָּה
  choice: majira kama haya mwakani
  rationale: Hii ni nahau yenye ugumu wa kale, ambayo katika muktadha inaelekea kutaja majira hayohayo mwaka unaofuata. Tafsiri hii ni wazi kwa msomaji wa kisasa huku tanbihi ikihifadhi umbo la karibu zaidi na Kiebrania.
- source_word: וּלְשָׂרָה בֵן
  choice: naye Sara atakuwa na mwana
  rationale: Kifungu cha Kiebrania hakina kitenzi kilichoandikwa, lakini muktadha wa ahadi unaelekeza hali ya wakati ujao. “Atakuwa na mwana” huwasilisha maana yake kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la pekee la Mungu, si cheo cha kawaida. “Yahwe” hulihifadhi kwa uangavu bila kulibadilisha kuwa cheo.
- issue: Nguvu ya swali la balagha
  choice: Je, kuna jambo lolote gumu mno kwa Yahwe?
  alternative: Je, kuna jambo lolote la ajabu mno kwa Yahwe?; Je, kuna jambo lisilowezekana kwa Yahwe?
  rationale: “Gumu mno” hudumisha mkazo kwamba ahadi haizidi uwezo wa Yahwe, lakini haifanyi maana kuwa kali zaidi kwa kutumia “lisilowezekana.” Tanbihi inahifadhi maana mbadala ya jambo la ajabu au la kushangaza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali ni wa kawaida na wazi; “mwana” limetumiwa badala ya “mtoto wa kiume” ili kudumisha ufupi na sauti ya kifasihi ya simulizi.
