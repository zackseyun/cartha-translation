  text: וַ/יֹּ֨אמֶר אֱלֹהִ֤ים לְ/יִשְׂרָאֵל֙ בְּ/מַרְאֹ֣ת הַ/לַּ֔יְלָה וַ/יֹּ֖אמֶר יַעֲקֹ֣ב יַעֲקֹ֑ב וַ/יֹּ֖אמֶר הִנֵּֽ/נִי׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: sw
  text: Mungu akamwambia Israeli katika maono ya usiku, “Yakobo, Yakobo.” Naye akasema, “Mimi hapa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema na / akisema / akajibu
  rationale: Kitenzi אמר kimsingi humaanisha ‘kusema.’ Katika kishazi cha kwanza, ‘akasema na’ kinaonyesha anayelengwa na usemi; ‘akisema’ kinaingiza maneno yenyewe; katika jibu la Yakobo, ‘akajibu’ ni Kiswahili cha asili kinachoonyesha kazi ya usemi bila kubadili maana.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo humrejelea Mungu mmoja na kitenzi chake kina maana ya umoja.
- source_word: לְיִשְׂרָאֵל
  choice: na Israeli
  rationale: Muundo ‘akasema na Israeli’ ni wa kawaida katika Kiswahili na unahifadhi jina Israeli lililotumiwa katika usimulizi, bila kulibadili kuwa Yakobo.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: katika maono ya usiku
  rationale: Tafsiri hii inahifadhi wingi wa מַרְאֹת na mazingira ya usiku kwa lugha ya kawaida na yenye hadhi.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: Yakobo! Yakobo!
  rationale: Kurudiwa kwa jina kunahifadhiwa ili kuonyesha mwito wa moja kwa moja wenye mkazo na ukaribu.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Hili ni jibu la kawaida la Kiswahili linaloonyesha kuwapo na kuwa tayari kuitika.
theological_decisions:
- issue: Kubadilishana kwa majina Israeli na Yakobo
  choice: Kuhifadhi ‘Israeli’ katika usimulizi na ‘Yakobo’ katika mwito wa Mungu
  alternative: Kutumia Yakobo au Israeli kote kwa ulinganifu
  rationale: Maandishi ya Kiebrania yanabadilisha majina hayo kimakusudi; kuyahifadhi huepuka kuyasawazisha na kudumisha mvutano wa kifasihi na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘akasema ... akisema’ unafuata marudio ya וַיֹּאמֶר katika chanzo huku ukiendelea kueleweka kwa msomaji wa kawaida.
