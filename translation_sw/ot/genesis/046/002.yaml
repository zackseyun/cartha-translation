- from: Mungu akasema na Israeli katika maono ya usiku, akisema, “Yakobo! Yakobo!” Naye akajibu, “Mimi hapa.”
  to: Mungu akamwambia Israeli katika maono ya usiku, “Yakobo, Yakobo.” Naye akasema, “Mimi hapa.”
  rationale: The revision uses akamwambia to represent God’s speech as addressed to Israeli, avoids the conversational implication of kusema na, and gives the direct speech a natural formal Swahili introduction. It retains every substantive source element, including the deliberate Israeli/Yakobo alternation, plural night visions, name repetition, and Yakobo’s conventional response.
  reviewer_model: gpt-5.6-terra
