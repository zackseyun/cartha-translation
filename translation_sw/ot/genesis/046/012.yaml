base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: sw
  text: Wana wa Yuda walikuwa Eri, Onani, Shela, Peresi na Zera. Lakini Eri na Onani walikufa[a] katika nchi ya Kanaani. Wana wa Peresi walikuwa Hesroni na Hamuli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kimetumia kitenzi cha umoja pamoja na kiima ambatani “Eri na Onani,” jambo la kawaida katika Kiebrania; maana yake hapa ni ya wingi: “Eri na Onani walikufa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: Wana wa Yuda
  rationale: Muundo wa nasaba בְּנֵי יְהוּדָה unamaanisha wana wa moja kwa moja wa Yuda; kiunganishi וּ־ kinaendeleza orodha, lakini Kiswahili hakihitaji lazima kuanza sentensi kwa “na” ili kuonyesha mwendelezo huo.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: Eri, Onani, Shela, Peresi na Zera
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili, huku orodha ikiwasilishwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: וַיָּמָת
  choice: walikufa
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja na kinatangulia kiima ambatani, kinawahusu Eri na Onani wote; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: katika nchi ya Kanaani
  rationale: Tafsiri inahifadhi nomino אֶרֶץ, “nchi,” badala ya kufupisha kuwa “Kanaani” pekee.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: Wana wa Peresi walikuwa
  rationale: Katika muktadha huu wa nasaba, היה hutambulisha majina ya wana wa Peresi; “walikuwa” ni muundo wa kawaida wa Kiswahili na haupanui maana kuwa wazao wa mbali.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: Hesroni na Hamuli
  rationale: Majina yametoholewa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili.
