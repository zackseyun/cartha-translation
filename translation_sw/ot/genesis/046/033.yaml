translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Swali limetafsiriwa kwa ‘kazi’ badala ya istilahi rasmi zaidi kama ‘taaluma’ ili kuendana na muktadha wa wachungaji na upana wa מַעֲשֵׂיכֶם.
