translation:
  language: sw
  text: Na itakuwa kwamba Farao atakapowaita na kuwaambia, “Kazi yenu ni nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na itakuwa ... atakap(o)-
  rationale: Muundo huu wa Kiebrania unaanzisha hali inayotarajiwa kutokea baadaye. Kiswahili ‘Na itakuwa ... atakapowaita’ kinahifadhi mfuatano huo wa wakati kwa lugha ya kawaida na yenye hadhi.
- source_word: יִקְרָא לָכֶם
  choice: atakapowaita
  rationale: Kitenzi קרא pamoja na ל hapa kina maana ya kuwaita watu waje mbele yake; ‘kuwaita’ ni cha asili katika Kiswahili na hakiongezi urasmi usio lazima.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: וְאָמַר
  choice: na kuwauliza
  rationale: Kiebrania kimsingi ni ‘na kusema,’ lakini maneno yanayofuata ni swali la moja kwa moja. ‘Kuwauliza’ ni Kiswahili cha kawaida kinachowasilisha tendo la kusema bila kubadili yaliyomo katika swali.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Kazi yenu ni nini?
  rationale: מַעֲשֵׂיכֶם inaweza kumaanisha kazi au shughuli yao. Katika muktadha Farao anauliza aina ya kazi wanayofanya; usemi huu ni wazi na wa kawaida bila kuibana maana kuwa taaluma rasmi pekee.
