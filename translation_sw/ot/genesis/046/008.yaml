  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: sw
  text: 'Haya ndiyo majina ya wana wa Israeli waliokuja Misri: Yakobo na wanawe.[a] Mzaliwa wa kwanza wa Yakobo alikuwa Reubeni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata mpangilio wa maneno ya Kiebrania kwa karibu zaidi: “Haya ndiyo majina ya wana wa Israeli waliokuja Misri, Yakobo na wanawe.”'
    reason: Muundo wa “Yakobo na wanawe” ni wa ufafanuzi katika Kiebrania, lakini uhusiano wake na kirai kilichotangulia unaweza kuonekana usio wa kawaida katika Kiswahili.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Haya ndiyo
  rationale: Kifungu hiki kinaanzisha orodha mpya. Kiswahili cha sasa hakihitaji kuanza kwa “Na”; “Haya ndiyo” ni cha kawaida na bado kinatimiza kazi ya utangulizi wa Kiebrania.
- source_word: שְׁמוֹת
  choice: majina
  rationale: Hii ndiyo maana ya kawaida ya nomino hii katika wingi, na hapa inaanzisha orodha ya ukoo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana” linafaa kwa sababu orodha inayofuata inawataja watoto wa kiume wa Yakobo, huku “Israeli” likihifadhiwa kama jina lake.
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: waliokuja Misri
  rationale: Kirai tegemezi cha wakati uliopita ni cha kawaida katika Kiswahili na kiambishi cha mwelekeo katika מִצְרַיְמָה kinaelezwa kwa mwendo wa kwenda Misri.
- source_word: יַעֲקֹב וּבָנָיו
  choice: Yakobo na wanawe
  rationale: Maneno hayo yamehifadhiwa kama ufafanuzi unaofuata kirai cha awali; kistari kirefu kinaonyesha uhusiano huo bila kuyageuza kuwa sentensi tofauti.
- source_word: בְּכֹר יַעֲקֹב
  choice: Mzaliwa wa kwanza wa Yakobo
  rationale: Hili linahifadhi uhusiano wa umilikaji na msisitizo wa mpangilio wa kuzaliwa kwa lugha ya kawaida.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Jina limetolewa kwa umbo lake la kawaida katika matumizi ya Biblia ya Kiswahili.
