base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: sw
  text: Hawa ndio wana wa Lea aliomzalia Yakobo huko Padan-Aramu, pamoja na Dina, binti yake Yakobo. Jumla ya wanawe wa kiume na binti zake ilikuwa thelathini na watatu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “nafsi/watu wote,” nahau inayomaanisha jumla ya watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: wana wa Lea
  rationale: Neno la Kiebrania בְּנֵי ni wingi wa kiume, “wana,” na hapa ni kichwa cha ukoo; halipanuliwi kuwa “watoto” ingawa Dina pia ametajwa.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: aliomzalia Yakobo
  rationale: Kitenzi יָלַד chenye mtenda wa kike humaanisha kuzaa; “aliomzalia Yakobo” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: בְּפַדַּן אֲרָם
  choice: huko Padan-Aramu
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa; “huko” hufanya sentensi isikike kiasili.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: pamoja na Dina binti yake
  rationale: “Pamoja na” huonyesha kwamba Dina anaongezwa katika hesabu baada ya kichwa kinachosema “wana wa Lea.” Kiwakilishi cha “yake” kinaachwa na rejeleo lilelile lenye utata kama Kiebrania.
- source_word: כָּל נֶפֶשׁ
  choice: jumla ... ilikuwa watu
  rationale: Katika muktadha wa sensa au ukoo, נֶפֶשׁ humaanisha watu, si “nafsi” kwa maana ya kiteolojia; muundo wa jumla unatoa Kiswahili fasaha.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: wanawe wa kiume na wa kike
  rationale: Kiebrania hutaja wana wa kiume na mabinti kando; tafsiri inahifadhi tofauti hiyo bila kutumia muundo mzito wa “wanawe na binti zake.”
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: thelathini na watatu
  rationale: Hii ndiyo namba ya kawaida ya Kiswahili, ikipatana kisarufi na “watu.”
