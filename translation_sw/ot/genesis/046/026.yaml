base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: sw
  text: Watu wote wa Yakobo waliokuja Misri, waliotokana na viuno vyake, bila kuhesabu wake za wana wa Yakobo, walikuwa watu sitini na sita kwa jumla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: Watu wote
  rationale: Katika muktadha huu wa kuhesabu ukoo, נֶפֶשׁ humaanisha watu binafsi, si ‘nafsi’ kwa maana ya sehemu isiyo ya mwili.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: wa nyumba ya Yakobo waliokuja Misri
  rationale: לְיַעֲקֹב inaonyesha uhusiano wao na Yakobo; ‘wa nyumba ya Yakobo’ ni Kiswahili cha asili kinachoepuka kudai kwamba kila mmoja alisafiri pamoja naye wakati uleule.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: yaani, wazao wake mwenyewe
  rationale: Nahau hii, kihalisi ‘waliotoka katika paja lake,’ humaanisha wazao wake wa kibiolojia. Tafsiri ya maana ni wazi na ya heshima katika Kiswahili cha sasa.
- source_word: מִלְּבַד
  choice: bila kuhesabu
  rationale: Neno hili linaonyesha kwamba wake za wana wa Yakobo hawakujumuishwa katika jumla ya watu sitini na sita.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: wake za wana wa Yakobo
  rationale: Huhifadhi uhusiano wa kimilikishi kwa lugha iliyo wazi na ya kawaida.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: walikuwa watu sitini na sita kwa jumla
  rationale: Hutoa hesabu ya mwisho kwa Kiswahili fasaha huku ikihifadhi maana ya נֶפֶשׁ kama ‘watu.’
