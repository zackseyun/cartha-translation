  rationale: Jina limetoholewa kwa kufuata sauti ya Kiebrania na mazoea ya majina ya Biblia katika Kiswahili.
- source_word: וְ/כַרְמִי
  choice: Karmi
  rationale: Jina limetoholewa moja kwa moja, huku ו ya mwisho ikiwakilishwa na “na” katika orodha.
