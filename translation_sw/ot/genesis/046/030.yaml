  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: sw
  text: Kisha Israeli akamwambia Yosefu[a], “Sasa naweza kufa, baada ya kuuona uso wako, kwa kuwa bado uko hai.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Sasa nitakufa, baada ya kuuona uso wako, kwa sababu bado uko hai.” Kitenzi cha Kiebrania kinaweza kuonyesha azimio au utayari; matini kuu hutoa maana hiyo kwa Kiswahili cha kawaida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “kisha” pamoja na kitenzi cha mfululizo “akamwambia” ni Kiswahili cha kawaida kinachohifadhi ufuatano.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanatumia wazi jina Israeli, si Yakobo; umbo la kawaida la jina hilo katika Kiswahili limetumiwa.
- source_word: אֶל יוֹסֵף
  choice: akamwambia Yosefu
  rationale: Muundo wa Kiswahili wa “kumwambia mtu” unawasilisha kwa kawaida kitenzi na kihusishi cha Kiebrania.
- source_word: אָמ֣וּתָה
  choice: naweza kufa
  rationale: Kohortativi hapa inaonyesha utayari wa kihisia baada ya furaha ya kumwona Yosefu akiwa hai, wala si kuomba ruhusa ya kufa. “Naweza kufa” huwasilisha maana hiyo ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: הַפָּעַם
  choice: Sasa
  rationale: Ingawa kihalisi ni “wakati huu/mara hii,” katika muktadha inaashiria hali ya sasa baada ya huzuni ya muda mrefu; “sasa” ni fupi na ya asili.
- source_word: אַחֲרֵי רְאוֹתִי
  choice: kwa kuwa nimeuona
  rationale: Muundo huu ni mfupi na unaweza kusomwa kwa maana ya wakati au sababu. Katika sentensi hii, “kwa kuwa nimeuona” huwasilisha kwa ufasaha hali iliyomwezesha Israeli kusema anaweza kufa.
- source_word: אֶת פָּנֶיךָ
  choice: uso wako
  rationale: Taswira halisi ya “uso wako” imehifadhiwa badala ya kuirahisisha kuwa “wewe,” kwa kuwa inasisitiza kukutana ana kwa ana.
- source_word: כִּי
  choice: na kujua kwamba
  rationale: כִּי hapa inaunganisha kuona uso wa Yosefu na ukweli kwamba bado yu hai. Kiswahili cha matini kuu kinaweka wazi maana inayodokezwa, huku tanbihi ikihifadhi muundo rasmi zaidi.
- source_word: עוֹדְךָ חָי
  choice: bado uko hai
  rationale: 'עוֹד pamoja na kiambishi cha nafsi na חָי huonyesha kuendelea kwa hali: Yosefu angali hai. “Bado uko hai” ni Kiswahili cha sasa na wazi.'
theological_decisions:
- issue: Nguvu ya kohortativi אָמוּתָה
  choice: naweza kufa
  alternative: acha nife / nitakufa
  rationale: Muktadha unaonyesha utayari au kutosheka kwa Israeli, si ombi la ruhusa wala utabiri wa kifo cha mara moja. Tafsiri haiongezi dai la kitheolojia kuhusu wakati wa kifo chake.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Matini kuu ni ya ulinganifu mwafaka: imehifadhi jina “Israeli” na taswira ya “uso wako,” huku ikifafanua kwa njia ya kawaida maana ya usemi mfupi wa Kiebrania. Alama ya tanbihi [a] imewekwa katika matini kuu.'
