base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: sw
  text: Ndipo Yosefu akaandaa gari lake la farasi, akaenda kumlaki Israeli baba yake huko Gosheni. Akajionyesha kwake[a], akamwangukia shingoni, akaendelea kulia shingoni mwake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatokea mbele yake” au “akaonekana kwake.” Kitenzi cha Kiebrania kinaweza kutafsiriwa hivyo; hapa kinaonyesha Yosefu akijitokeza mbele ya baba yake walipokutana.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “akalia shingoni mwake bado/zaidi.” Neno la mwisho la Kiebrania linaweza kumaanisha “bado,” “zaidi,” au “tena”; hapa linaelekea kuonyesha kilio kilichoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר ... מֶרְכַּבְתּוֹ
  choice: akaandaa gari lake la farasi
  rationale: Kitenzi אָסַר kimsingi ni ‘kufunga,’ lakini kinapotumiwa pamoja na gari humaanisha kulifungia wanyama wa kulikokota na hivyo kulitayarisha kwa safari. Usemi huu wa Kiswahili unaeleza kitendo hicho kwa kawaida bila kuleta picha ya kulifunga gari kwa kamba.
- source_word: וַיַּעַל לִקְרַאת
  choice: akaenda kumlaki
  rationale: Ingawa עָלָה kwa kawaida ni ‘kupanda/kwenda juu,’ hapa simulizi linalenga safari ya Yosefu kwenda kumkaribisha baba yake. ‘Kumlaki’ linaonyesha kwa usahihi kwenda kumkuta mtu anayewasili.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: Israeli baba yake
  rationale: Jina lililotumiwa katika Kiebrania, Israeli, limehifadhiwa badala ya kubadilishwa kuwa Yakobo.
- source_word: גֹּשְׁנָה
  choice: huko Gosheni
  rationale: Kiambishi cha mwelekeo kinaonyesha kuelekea Gosheni, lakini kwa muundo wa Kiswahili mahali pa kukutana panaelezwa kwa kawaida kama ‘huko Gosheni.’
- source_word: וַיֵּרָא אֵלָיו
  choice: Akajionyesha kwake
  rationale: Nifali ya ראה hapa inaonyesha kwamba Yosefu alijifanya aonekane kwa baba yake, yaani alifika mbele yake. Tafsiri hii huhifadhi zaidi umbo la Kiebrania na tendo la makusudi la kujitokeza.
- source_word: וַיִּפֹּל עַל־צַוָּארָיו
  choice: akamwangukia shingoni
  rationale: Huu ni usemi wa Kiebrania wa kumkumbatia mtu kwa hisia nyingi. Kiswahili hiki kinahifadhi picha halisi na kinaeleweka katika muktadha.
- source_word: וַיֵּבְךְּ עַל־צַוָּארָיו עוֹד
  choice: akaendelea kulia shingoni mwake kwa muda mrefu
  rationale: עוֹד inaweza kumaanisha ‘bado/zaidi’; katika tukio hili inaonyesha kwamba kilio kiliendelea. ‘Kwa muda mrefu’ huwasilisha nguvu ya muda bila kupoteza picha ya Yosefu akiwa shingoni mwa baba yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. ‘Gari la farasi’ linaepusha maana ya gari la kisasa, ‘kumlaki’ linafaa kwa tukio la kumkuta mgeni anayewasili, na picha ya kumwangukia mtu shingoni imehifadhiwa kwa sababu ndiyo kitovu cha hisia za mkutano huu.
