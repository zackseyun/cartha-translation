lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kauli hii inatoa muhtasari wa orodha iliyotangulia; muundo huu ni wa kawaida katika Kiswahili na hauhitaji kuingiza wakati wa kitenzi usiowekwa wazi katika Kiebrania.
- source_word: בְּנֵי רָחֵל
  choice: wana wa Raheli
  rationale: Neno בְּנֵי humaanisha kihalisi ‘wana wa’; ‘wana’ huhifadhi umbo la kiume la matini katika muktadha huu wa nasaba.
- source_word: רָחֵל
  choice: Raheli
  rationale: Jina la mtu limetolewa kwa umbo linalotambulika na lililozoeleka katika Kiswahili cha Biblia.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: aliomzalia Yakobo
  rationale: Kiebrania kina kauli ya kutendwa, ‘waliozaliwa kwa Yakobo’; Kiswahili cha kawaida hueleza uhusiano huu kwa kauli ‘Raheli aliomzalia Yakobo,’ bila kubadili maana ya uzazi na nasaba.
- source_word: כָּל נֶפֶשׁ
  choice: jumla watu
  rationale: Katika orodha ya nasaba נֶפֶשׁ hutumiwa kuhesabu watu, si kutaja ‘roho’ kwa maana ya kiteolojia. ‘Jumla watu’ huwasilisha kazi ya nahau hiyo kwa uwazi.
- source_word: אַרְבָּעָה עָשָׂר
  choice: kumi na wanne
  rationale: Hii ndiyo idadi ya kawaida ya Kiswahili; upatanisho wa ngeli unafuata ‘watu.’
