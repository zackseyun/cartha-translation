  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: sw
  text: 'Na wana wa Simeoni: Yemueli, Yamini, Ohadi, Yakini, Sohari, na Shauli, mwana wa mwanamke Mkanaani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Nao wana wa Simeoni walikuwa
  rationale: Kiunganishi וּ kinaendeleza orodha ya nasaba, na muundo huu ni wa kawaida katika Kiswahili huku ukihifadhi uhusiano wa maandishi ya Kiebrania.
- source_word: יְמוּאֵל
  choice: Yemueli
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na maumbo ya kawaida ya majina katika Kiswahili.
- source_word: וְיָמִין
  choice: Yamini
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania kwa umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: וְאֹהַד
  choice: Ohadi
  rationale: Jina limetoholewa kwa uaminifu katika umbo la kawaida la Kiswahili.
- source_word: וְיָכִין
  choice: Yakini
  rationale: Herufi ya kwanza ya Kiebrania י imetolewa kama y, na jina limepewa umbo linalofaa fonolojia ya Kiswahili.
- source_word: וְצֹחַר
  choice: Zohari
  rationale: Utohozi huu unawakilisha jina la Kiebrania kwa namna iliyo wazi na ya kawaida katika Kiswahili.
- source_word: וְשָׁאוּל
  choice: na Shauli
  rationale: Shauli linaakisi kwa uwazi konsonanti na vokali za jina la Kiebrania שָׁאוּל na pia ni umbo linalotambulika katika Kiswahili.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: mwana wa mwanamke Mkanaani
  rationale: Nomino ya Kiebrania ni ya kike na inamtaja mwanamke wa Kanaani; tafsiri hii huhifadhi jinsia hiyo wazi bila kutumia usemi wenye utata.
