  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. Majina yametoholewa kutoka Kiebrania badala ya kufuata bila uchunguzi maumbo ya Kiingereza. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti ya Kiingereza kati ya Shaul na Saul haitokei kwa namna ileile katika Kiswahili.
