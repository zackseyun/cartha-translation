base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: sw
  text: Kisha Yosefu akawaambia ndugu zake na watu wa nyumbani kwa baba yake[a], “Nitapanda kwenda kwa Farao na kumwarifu, nami nitamwambia, ‘Ndugu zangu na watu wa nyumbani kwa baba yangu, waliokuwa katika nchi ya Kanaani, wamekuja kwangu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyumba ya baba yake”; hapa “watu wa nyumbani kwa baba yake” humaanisha jamaa au kaya, wala si jengo wanamoishi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha Yosefu akawaambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: אֶל אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu אַחַיו inawahusu ndugu wa kiume wa Yosefu; Kiswahili “ndugu zake” ni cha kawaida na muktadha huweka wazi warejelewa.
- source_word: וְאֶל בֵּית אָבִיו
  choice: na watu wa nyumba ya baba yake
  rationale: בֵּית אָבִיו hapa ni jamaa au kaya ya baba, si jengo pekee. “Watu wa nyumba” huhifadhi taswira ya Kiebrania huku ikitoa maana ya kundi la kifamilia.
- source_word: אֶעֱלֶה
  choice: Nitapanda kwenda
  rationale: Neno עלה lina maana halisi ya kupanda au kwenda juu. Uundaji huu unahifadhi mwelekeo huo bila kufanya Kiswahili kiwe kigumu.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: kwenda kumpa Farao habari
  rationale: Hifili ya נגד ina wazo la kumjulisha au kumpa taarifa; usemi huu unafaa mazingira ya kutoa taarifa kwa mfalme.
- source_word: וְאֹמְרָה אֵלָיו
  choice: nami nitamwambia
  rationale: Huhifadhi azimio la nafsi ya kwanza na hatua inayofuata katika mpango wa Yosefu.
- source_word: אַחַי
  choice: Ndugu zangu
  rationale: Inawarejelea ndugu halisi wa Yosefu na ni tafsiri ya kawaida ya Kiswahili.
- source_word: וּבֵית אָבִי
  choice: na watu wa nyumba ya baba yangu
  rationale: Hutoa maana ya kitengo cha familia na wakati huohuo huhifadhi tamathali ya “nyumba ya baba” iliyo katika Kiebrania.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: waliokuwa katika nchi ya Kanaani
  rationale: Kiebrania hakina kitenzi dhahiri katika kishazi hiki; wakati uliopita unafaa kwa sababu sasa wamekwisha kuja kwa Yosefu.
- source_word: בָּאוּ אֵלַי
  choice: wamekuja kwangu
  rationale: Kauli timilifu inaeleza tendo lililokamilika lenye matokeo ya sasa; “wamekuja” hulifikisha hilo kwa Kiswahili.
