base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: sw
  text: Kisha Yakobo akaondoka kutoka Beer-sheba[a], nao wana wa Israeli wakambeba Yakobo, baba yao, watoto wao wadogo, na wake zao katika mikokoteni ambayo Farao alikuwa ametuma ili zimbebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “akainuka kutoka Beer-sheba.” Katika muktadha wa safari, usemi huo unamaanisha kuondoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Kitenzi hiki kwa maana ya msingi ni ‘aliinuka,’ lakini kinapofuatwa na מִן pamoja na jina la mahali katika simulizi la safari, humaanisha kuondoka au kuanza safari. ‘Akaondoka’ ni Kiswahili cha kawaida na kinachofikisha maana hiyo.
- source_word: מִבְּאֵר שָׁבַע
  choice: Beer-sheba
  rationale: Jina la mahali limeandikwa kwa namna inayokaribia umbo la Kiebrania; maana ya kiambishi מִן imejumuishwa katika kitenzi ‘akaondoka.’
- source_word: וַיִּשְׂאוּ
  choice: wakambeba
  rationale: נשׂא humaanisha kubeba. Katika muktadha huu Yakobo alisafirishwa kwa magari, hivyo ‘wakambeba’ huhifadhi picha ya kumchukua na kumsafirisha bila kutumia neno pana zaidi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Katika muktadha huu maneno hayo yanawahusu wana wa kiume wa Yakobo, ambaye pia anaitwa Israeli. ‘Wana wa Israeli’ ni sahihi zaidi hapa kuliko ‘watoto wa Israeli,’ ambalo lingeweza kujumuisha jinsia zote.
- source_word: אֲבִיהֶם
  choice: baba yao
  rationale: Hili ni umbo la kawaida la umilikaji na linamtambulisha Yakobo kuwa baba yao.
- source_word: טַפָּם
  choice: watoto wao wadogo
  rationale: טַף hurejelea hasa watoto wadogo, ingawa wakati mwingine inaweza kuwajumuisha wategemezi. Tafsiri hii inahifadhi wazo kuu linalokusudiwa hapa.
- source_word: נְשֵׁיהֶם
  choice: wake zao
  rationale: Katika muktadha huu wa familia, נָשִׁים ina maana ya wake zao, si wanawake kwa ujumla.
- source_word: בָּעֲגָלוֹת
  choice: katika magari
  rationale: עֲגָלוֹת ni magari au mikokoteni ya usafiri. ‘Magari’ hapa ni neno la kawaida la Kiswahili kwa vyombo hivyo vya kubebea, bila kudokeza magari ya injini katika muktadha huu wa kale.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: ambayo Farao alikuwa ameyatuma
  rationale: Wakati timilifu ‘alikuwa ameyatuma’ unaonyesha kwa kawaida kwamba Farao aliyapeleka kabla ya safari hii, kama mfuatano wa simulizi unavyodokeza.
- source_word: לָשֵׂאת אֹתוֹ
  choice: ili yambebe
  rationale: Muundo huu unaonyesha kusudi, na kiwakilishi cha umoja kinamrejelea Yakobo. Upatanisho wa ngeli katika ‘yambebe’ unarejelea magari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo wa mstari wa Kiebrania na marejeo ya wazi kwa Yakobo yamehifadhiwa bila kuondoa marudio yenye kusudi.
