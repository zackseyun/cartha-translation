base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: sw
  text: Watu hao ni wachungaji wa kondoo na mbuzi,[a] kwa maana wamekuwa wafugaji wa mifugo; nao wameleta makundi yao ya kondoo na mbuzi, makundi yao ya ng’ombe, na kila kitu walicho nacho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watu hao walikuwa wachungaji wa kondoo na mbuzi, kwa maana walikuwa wafugaji wa mifugo; nao walileta...” Vitenzi vya Kiebrania vilivyo katika hali timilifu vinaweza pia kutafsiriwa kwa wakati uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Watu hao
  rationale: Nomino yenye uainishaji inawarejelea wazi ndugu za Yosefu waliotajwa katika muktadha; “watu hao” ni ya asili katika Kiswahili na haihitaji kuanza sentensi kwa kiunganishi.
- source_word: רֹעֵי צֹאן
  choice: wachungaji wa kondoo na mbuzi
  rationale: צֹאן ni mifugo midogo kwa ujumla, hasa kondoo na mbuzi. Kutaja aina zote mbili kunazuia maana kufupishwa kuwa kondoo pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa maelezo ya sababu ya kuitwa kwao wachungaji.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: wafugaji wa mifugo
  rationale: Kirai kinaonyesha watu wenye shughuli ya kutunza na kufuga wanyama; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: הָיוּ
  choice: wamekuwa
  rationale: Kauli timilifu inaonyesha kazi yao iliyozoeleka hadi wakati wa mazungumzo; “wamekuwa” huhifadhi uhusiano huo na hali ya sasa.
- source_word: וְצֹאנָם
  choice: makundi yao ya kondoo na mbuzi
  rationale: Huhifadhi maana ya mkusanyiko wa mifugo midogo bila kuibana kwa kondoo pekee.
- source_word: וּבְקָרָם
  choice: makundi yao ya ng’ombe
  rationale: בקר hurejelea ng’ombe; “makundi” hudumisha ulinganifu na kundi la mifugo midogo.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: kila kitu walicho nacho
  rationale: Ni usemi wa asili unaohifadhi maana pana ya mali zao zote.
- source_word: הֵבִיאוּ
  choice: wameleta
  rationale: Kauli timilifu inaeleza tendo lililokamilika ambalo matokeo yake yanaonekana katika hali ya sasa baada ya kuwasili kwao.
