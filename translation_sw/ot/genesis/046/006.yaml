  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: sw
  text: Wakachukua mifugo yao na mali zao walizokuwa wamepata katika nchi ya Kanaani, wakafika Misri—Yakobo na wazao wake wote pamoja naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wote wa uzao wake.” Neno la Kiebrania linaweza kumaanisha mbegu, uzao, au wazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Wakachukua
  rationale: Kitenzi cha masimulizi kinaonyesha tendo linalofuata katika mfululizo; kiambishi “waka-” kinahifadhi mtiririko huo kwa Kiswahili cha kawaida.
- source_word: מִקְנֵיהֶם
  choice: mifugo yao
  rationale: Neno hili linahusu kwa upana wanyama wanaofugwa, si ng’ombe pekee; “mifugo” ni sawa la asili na lenye upana unaofaa.
- source_word: רְכוּשָׁם
  choice: mali zao
  rationale: Linamaanisha vitu au mali walizomiliki, likitofautishwa na mifugo iliyotajwa kwanza.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: walizokuwa wamepata
  rationale: Kauli hii inaonyesha mali zilizopatikana kabla ya safari; “walizokuwa wamepata” ni ya kawaida na haibainishi isivyohitajika kama zilinunuliwa au kukusanywa.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: katika nchi ya Kanaani
  rationale: Inahifadhi usemi kamili wa Kiebrania na uhalisia wa mahali.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: wakaenda Misri
  rationale: Kiishio cha mwelekeo kinaonyesha safari kuelekea Misri. Kwa mtazamo wa simulizi la kuondoka Kanaani, “wakaenda” ni Kiswahili cha asili kuliko “wakaja,” bila kuzidisha maana kuwa walivuka mpaka.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: Yakobo na wazao wake wote pamoja naye
  rationale: Katika muktadha huu זֶרַע humaanisha watoto au watu wa ukoo waliotokana na Yakobo; “wazao” huhifadhi maana hiyo kwa lugha ya kawaida.
