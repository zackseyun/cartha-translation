  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: sw
  text: Hawa ndio wana wa Bilha, ambaye Labani alimpa Raheli binti yake, naye akamzalia Yakobo watoto hawa. Jumla yao ilikuwa watu saba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kila nafsi, saba”—nahau inayomaanisha jumla ya watu saba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: Hawa ndio wana wa Bilha
  rationale: Muundo huu unatambulisha watu waliotajwa katika orodha; “wana” linadumisha maana ya kiume ya בְּנֵי katika muktadha huu wa nasaba.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: ambaye Labani alimpa Raheli binti yake
  rationale: Kiwakilishi cha uhusiano kinamrejelea Bilha, na לְ linaonyesha mpokeaji wa tendo la kutoa. “Binti yake” linaweka wazi kiambishi cha umilikaji cha Kiebrania.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: naye akamzalia Yakobo watoto hawa
  rationale: “Akamzalia” ni Kiswahili cha kawaida katika taarifa za nasaba na kinahifadhi uhusiano wa uzazi unaoonyeshwa na לְיַעֲקֹב. Neno “watoto” limewekwa kwa uwazi wa Kiswahili bila kubadili watu wanaorejelewa.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: Jumla yao walikuwa watu saba
  rationale: נֶפֶשׁ katika hesabu hii ni nahau inayomaanisha watu, si “roho” kwa maana ya sehemu isiyo ya mwili. Tafsiri hii inawasilisha jumla kwa Kiswahili cha asili.
