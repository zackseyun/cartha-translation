base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: sw
  text: Akasema, “Mimi ni Mungu, Mungu wa baba yako. Usiogope kushuka kwenda Misri[a], kwa maana huko nitakufanya kuwa taifa kubwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiwe na hofu ya kushuka kwenda Misri.” Kiebrania kinaunganisha kitenzi “kuogopa” na kitenzi-jina “kushuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Mungu
  rationale: Katika kauli “Mimi ni Mungu,” Kiswahili hutambulisha msemaji kwa njia ya asili na yenye msisitizo; “El” lingehamisha jina badala ya kutafsiri cheo.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Mungu wa baba yako
  rationale: Huhifadhi umoja wa “baba yako” na utambulisho wa Mungu kwa uhusiano wake na baba wa Yakobo.
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja dhidi ya hofu, lililotolewa kwa Kiswahili cha kawaida na cha sasa.
- source_word: מֵרְדָה
  choice: kushuka
  rationale: Huhifadhi taswira ya Kiebrania ya kushuka kuelekea Misri badala ya kuifanya tu “kwenda.”
- source_word: מִצְרַיְמָה
  choice: kwenda Misri
  rationale: Kiambishi cha mwelekeo kinaonyesha mwendo kuelekea Misri; “kwenda Misri” ni wazi na cha kawaida katika Kiswahili.
- source_word: לְגוֹי גָּדוֹל
  choice: kuwa taifa kubwa
  rationale: 'Muundo huu unaonyesha matokeo: Yakobo atafanywa awe taifa kubwa.'
- source_word: אֲשִׂימְךָ
  choice: nitakufanya
  rationale: Ingawa kitenzi kinaweza kumaanisha kuweka, hapa pamoja na “kuwa taifa kubwa” kinamaanisha kumfanya au kumwunda awe hivyo.
- source_word: שָׁם
  choice: huko
  rationale: Hurejelea Misri kama mahali ambapo ahadi hiyo itatimizwa.
theological_decisions:
- issue: Utambulisho wa Mungu kwa kumrejelea babu wa Yakobo
  choice: Mungu wa baba yako
  alternative: Mungu wa baba zako
  rationale: Kiebrania kina umoja, “baba yako”; tafsiri hiyo huhifadhi uhusiano mahususi wa kifamilia na wa ahadi bila kuupanua kimafafanuzi kuwa “baba zako.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kushuka kwenda Misri” huhifadhi nahau ya kijiografia ya Kiebrania huku ikibaki wazi kwa msomaji wa kawaida.
