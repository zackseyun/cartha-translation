base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: sw
  text: Mimi mwenyewe nitashuka pamoja nawe kwenda Misri, na mimi mwenyewe hakika nitakupandisha pia; naye Yosefu ataweka mkono wake juu ya macho yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya kawaida ya msemo huu, “Yosefu atakufumba macho,” yaani Yosefu atakuwapo wakati Yakobo atakapokufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Mimi mwenyewe
  rationale: Kiwakilishi huru kimetajwa na kurudiwa ili kusisitiza; “Mimi mwenyewe” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: אֵרֵד עִמְּךָ מִצְרַיְמָה
  choice: nitashuka pamoja nawe mpaka Misri
  rationale: Huhifadhi lugha ya mwelekeo ya kushuka kwenda Misri, huku “mpaka Misri” ikionyesha lengo la mwendo kwa njia ya asili.
- source_word: אַעַלְךָ
  choice: nitakupandisha tena
  rationale: Hifili ya עלה ina maana ya kusababisha au kumleta mtu apande; “nitakupandisha” huhifadhi maana hiyo. “Tena” huonyesha mwendo wa kurudi kutoka Misri bila kufafanua namna ya kutimizwa kwake.
- source_word: גַם עָלֹה
  choice: hakika ... tena
  rationale: “Hakika” huhifadhi msisitizo wa kitenzi-jina kisicho na kikomo, na “tena” hubeba nguvu ya nyongeza ya גַם katika muktadha huu.
- source_word: וְיוֹסֵף
  choice: naye Yosefu
  rationale: Kiunganishi pamoja na jina kimetolewa kwa Kiswahili cha asili, huku jina likifuata umbo la kawaida la Kiswahili.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: ataweka mkono wake juu ya macho yako
  rationale: Tafsiri hii huhifadhi picha halisi ya Kiebrania bila kuibadili moja kwa moja kuwa ufafanuzi wa kufumba macho wakati wa kifo.
theological_decisions:
- issue: Maana ya ahadi ya Mungu ya ‘kukupandisha’ kutoka Misri
  choice: Maneno yanabaki yakimhusu Yakobo moja kwa moja bila kutaja kama ni yeye akiwa hai, mwili wake kwa ajili ya maziko, au uzao wake katika kutoka Misri.
  alternative: Kufafanua kuwa Yakobo angerudi akiwa hai, mwili wake ungepelekwa Kanaani kwa maziko, au uzao wake pekee ndio ungeondolewa Misri.
  rationale: Kiebrania ni kifupi na kinaweza kuwa na tabaka zaidi ya moja za utimizo; tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
- issue: Mkono wa Yosefu juu ya macho ya Yakobo
  choice: Picha halisi imehifadhiwa katika matini, na maana yake inayowezekana imeelezwa katika tanbihi.
  alternative: Kutafsiri moja kwa moja ‘Yosefu atakufumba macho.’
  rationale: Tamathali inaeleweka kuwa Yosefu atakuwapo Yakobo anapokufa na kufumba macho yake, lakini matini yenyewe inatumia picha ya kuweka mkono juu ya macho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “mimi mwenyewe” yamehifadhiwa kwa msisitizo; “pamoja nawe” ni rasmi kwa kiasi bila kuwa ya kizamani.
