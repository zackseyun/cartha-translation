  text: 'Na wana wa Gadi: Sifioni[a], Hagi, Shuni, Esboni, Eri, Arodi na Areli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kina jina צִפְיוֹן (Sifioni); katika Hesabu 26:15 jina linalolingana lina umbo צְפוֹן (Sefoni).
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: Na wana wa Gadi walikuwa
  rationale: בְנֵי ni wingi wa 'wana' katika hali ya kuunganishwa na jina linalofuata; kiunganishi וּ kimetafsiriwa 'Na' ili kuhifadhi mwendelezo wa orodha. 'Walikuwa' limeongezwa kwa ufasaha wa Kiswahili bila kubadili maana ya kishazi cha orodha.
- source_word: צִפְיוֹן
  choice: Sifioni
  rationale: Jina limenukuliwa kwa kuzingatia umbo la Kiebrania la aya hii, צִפְיוֹן, na tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: וְחַגִּי
  choice: Hagi
  rationale: Jina la mtu limenukuliwa kwa tahajia ya Kiswahili; dageshi katika גּ haijawakilishwa kwa kurudia konsonanti, jambo lisilo la kawaida katika tahajia ya Kiswahili.
- source_word: שׁוּנִי
  choice: Shuni
  rationale: Jina limenukuliwa moja kwa moja kwa mfumo unaosomeka katika Kiswahili, huku sauti שׁ ikiwakilishwa kwa 'sh'.
- source_word: וְאֶצְבֹּן
  choice: Esboni
  rationale: Jina limenukuliwa kwa kuakisi konsonanti na vokali za Kiebrania huku likipewa umbo linalotamkika kwa urahisi katika Kiswahili.
- source_word: עֵרִי
  choice: Eri
  rationale: Jina limenukuliwa moja kwa moja kwa tahajia ya Kiswahili.
- source_word: וַאֲרוֹדִי
  choice: Arodi
  rationale: Jina limenukuliwa moja kwa moja; kiunganishi cha Kiebrania kimewakilishwa na mpangilio na viunganishi vya orodha ya Kiswahili.
- source_word: וְאַרְאֵלִי
  choice: Areli
  rationale: Jina limenukuliwa moja kwa moja kwa tahajia inayosomeka katika Kiswahili.
