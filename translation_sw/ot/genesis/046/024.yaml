lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: בְּנֵי ni wingi wa muundo wa umilikishi wa neno ‘mwana’; katika orodha ya ukoo ‘wana wa’ ni tafsiri ya kawaida. Kiunganishi וּ kimetafsiriwa ‘Na’ ili kuhifadhi mwendelezo wa orodha.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: יַחְצְאֵל
  choice: Yahseeli
  rationale: Jina limetoholewa kwa Kiswahili kwa kukaribia konsonanti za Kiebrania huku likibaki rahisi kutamkwa; tofauti za tahajia zinawezekana.
- source_word: וְגוּנִי
  choice: Guni
  rationale: Jina limetoholewa moja kwa moja; kiunganishi chake kinawakilishwa na mpangilio wa orodha.
- source_word: וְיֵצֶר
  choice: Yeseri
  rationale: Jina limetoholewa kwa kuwakilisha yod ya mwanzo kwa ‘Y’ na kulifanya litamkike kwa kawaida katika Kiswahili.
- source_word: וְשִׁלֵּם
  choice: Shilemu
  rationale: Jina limetoholewa kwa Kiswahili; ‘sh’ huwakilisha שׁ, na vokali ya mwisho husaidia matamshi ya kawaida bila kujaribu kuonyesha udurufu wa konsonanti usio wa kawaida katika tahajia ya Kiswahili.
