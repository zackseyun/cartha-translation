base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: sw
  text: ndipo mtasema, “Sisi, watumishi wako, tumekuwa wafugaji tangu ujana wetu hadi sasa, sisi pia, na baba zetu pia,” ili mpate kukaa katika nchi ya Gosheni, kwa maana kila mchungaji wa kondoo ni chukizo kwa Wamisri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: ndipo mtasema
  rationale: Waw pamoja na kitenzi timilifu huendeleza agizo la awali kwa mfuatano; ‘ndipo mtasema’ ni ya kawaida na inahifadhi maana ya hatua inayofuata.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: wafugaji
  rationale: Kirai hiki humaanisha watu wanaojishughulisha na mifugo. ‘Wafugaji’ ni Kiswahili cha kawaida, wazi, na hakifungi maana kwenye aina moja ya mnyama.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Hapa ni namna ya kujitaja kwa unyenyekevu mbele ya Farao, si msisitizo wa hali ya utumwa.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: tangu ujana wetu mpaka sasa
  rationale: Huhifadhi kipindi kinachoanzia ujana na kuendelea hadi wakati wa kusema.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: sisi na baba zetu pia
  rationale: Huhifadhi msisitizo wa mwendelezo wa kazi hiyo katika vizazi vyote viwili.
- source_word: בַּעֲבוּר
  choice: Semeni hivyo ili
  rationale: Neno hili linaingiza kusudi. Kurudia ‘Semeni hivyo’ kwa uwazi kunafanya uhusiano wa kusudi uwe wa kawaida katika Kiswahili bila kubadili maana.
- source_word: תֵּשְׁבוּ
  choice: mpate kukaa
  rationale: Katika muktadha wa kupewa eneo la kuishi, ‘kukaa’ hutoa maana ya kuishi au kufanya makao bila kulazimisha mojawapo.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: katika nchi ya Gosheni
  rationale: Huhifadhi neno אֶרֶץ, ‘nchi/eneo,’ lililo wazi katika Kiebrania.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: ni chukizo kwa Wamisri
  rationale: ‘Chukizo’ hudumisha nguvu ya neno la Kiebrania na muundo huu huonyesha wazi kuwa Wamisri ndio wanaowaona hivyo.
- source_word: כָּל רֹעֵה צֹאן
  choice: kila mchungaji wa kondoo
  rationale: Huhifadhi wazi רֹעֵה, ‘mchungaji,’ na צֹאן, kundi la kondoo au mbuzi; katika muktadha huu tafsiri ya kawaida ‘mchungaji wa kondoo’ inafaa.
