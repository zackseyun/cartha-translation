base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: sw
  text: Basi Israeli akaondoka pamoja na kila kitu kilichokuwa chake[a], akafika Beer-sheba, akatoa dhabihu kwa Mungu wa baba yake Isaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na yote aliyokuwa nayo.” Kirai cha Kiebrania kina maana pana ya kila kilichokuwa chake, ikiwemo watu wa nyumbani na mali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: akaondoka
  rationale: Katika simulizi, נסע humaanisha kung'oa kambi na kuanza safari; “akaondoka” ni Kiswahili cha kawaida kinachoonyesha mwanzo wa safari.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanatumia jina Israeli, si Yakobo; uchaguzi huo wa simulizi umehifadhiwa.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: pamoja na wote aliokuwa nao
  rationale: Kirai hiki kinaweza kujumuisha watu wa nyumba yake na mali zake. “Wote aliokuwa nao” kinahifadhi upana huo bila kukihusisha na mali peke yake.
- source_word: וַיָּבֹא
  choice: akafika
  rationale: בוא pamoja na mahali panapoelekea humaanisha kufika huko; “akafika” ni ya asili katika muktadha huu.
- source_word: בְּאֵרָה שָּׁבַע
  choice: Beer-sheba
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika matumizi ya Biblia ya Kiswahili; kiambishi elekezi cha Kiebrania kimewakilishwa na muundo wa kitenzi “akafika.”
- source_word: וַיִּזְבַּח זְבָחִים
  choice: na kutoa dhabihu
  rationale: Muundo wa Kiebrania hutumia kitenzi na nomino zenye mzizi mmoja; Kiswahili cha asili husema “kutoa dhabihu” bila kurudia mzizi kwa namna isiyo ya kawaida.
- source_word: לֵאלֹהֵי
  choice: kwa Mungu wa
  rationale: Katika muktadha wa dhabihu, ל humtambulisha anayepokea ibada; “kwa Mungu wa” ni muundo wa kawaida na wazi wa Kiswahili.
- source_word: אָבִיו יִצְחָק
  choice: baba yake Isaka
  rationale: Muundo huu unamtambulisha Isaka hasa kuwa baba yake Israeli; haujapanuliwa kuwa “mababu zake.”
theological_decisions:
- issue: Kumtaja Mungu kuwa “Mungu wa baba yake Isaka” badala ya kutumia kauli pana kuhusu mababu
  choice: Mungu wa baba yake Isaka
  alternative: Mungu wa mababu zake
  rationale: Kiebrania kinamtaja Isaka waziwazi na kwa umoja. Tafsiri inadumisha uhusiano huo mahususi bila kuupanua kitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetiririshwa kwa vitenzi vinavyofuatana. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya “wote aliokuwa nao” na “vyote alivyokuwa navyo” inaweza kuhifadhiwa moja kwa moja kwa uchaguzi mpana wa “wote.”
