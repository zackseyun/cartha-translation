lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na wana wa
  rationale: בְּנֵי ni wingi wa hali ya kuunganisha wa neno ‘mwana’; katika orodha hii ya ukoo, ‘wana wa’ ni tafsiri ya kawaida na ya moja kwa moja. Kiunganishi וּ kimetafsiriwa ‘Na’ ili kuhifadhi mwendelezo wa orodha.
- source_word: זְבוּלֻן
  choice: Zabuloni
  rationale: Ni jina la mtu; limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: סֶרֶד
  choice: Seredi
  rationale: Ni jina la mtu; limetoholewa kwa mfumo wa kawaida wa Kiswahili kwa kuongeza irabu ya mwisho ili liwe rahisi kutamkwa.
- source_word: וְ/אֵלוֹן
  choice: Eloni
  rationale: Ni jina la mtu, si nomino ya kawaida yenye maana ya ‘mwaloni.’ Kiunganishi chake kinawakilishwa katika mpangilio wa orodha, na jina limetoholewa kwa matamshi ya Kiswahili.
- source_word: וְ/יַחְלְאֵל
  choice: Yaleeli
  rationale: Ni jina la mtu. Herufi ya kwanza ya Kiebrania י imewakilishwa kwa ‘Y,’ na umbo limebadilishwa kwa kiasi kinachofaa mfumo wa sauti wa Kiswahili.
