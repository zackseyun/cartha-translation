  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: sw
  text: Na wana wa Zabuloni ni Seredi, na Eloni, na Yahleeli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahleeli pia hutoholewa Yaleeli au Yachleeli.
