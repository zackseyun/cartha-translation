  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: sw
  text: Na wana wa Benyamini walikuwa Bela, Bekeri[a], Ashbeli, Gera, Naamani, Ehi[b], Roshi, Mupimu[c], Hupimu, na Ardi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika tafsiri nyingi za jadi za Kiingereza, בֶּכֶר huandikwa “Becher.”
    reason: lexical_alternative
  - marker: b
    text: Katika Hesabu 26:38, nasaba inayolingana ya wazao wa Benyamini ina “Ahiramu” mahali ambapo mstari huu unasoma “Ehi.”
    reason: cross_reference
  - marker: c
    text: Baadhi ya mapokeo ya nasaba yanayolingana yana umbo tofauti kama “Shupimu” badala ya “Mupimu”; tafsiri hii inafuata Matini ya Kimasora hapa.
    reason: textual_variant
  - marker: d
    text: Katika 1 Mambo ya Nyakati 8:3 kuna umbo la jina linalohusiana, “Adari,” katika nasaba ya Benyamini; mstari huu unasoma “Ardi.”
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: Na wana wa Benyamini walikuwa
  rationale: Kiunganishi וּ kinaendeleza orodha iliyotangulia; muundo wa nasaba unatafsiriwa kwa Kiswahili cha kawaida huku ‘walikuwa’ ikisaidia kuanzisha orodha kwa ufasaha bila kubadili maana.
- source_word: בֶּלַע
  choice: Bela
  rationale: Jina la mtu limenukuliwa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּכֶר
  choice: Bekeri
  rationale: Jina la mtu limenukuliwa kutoka umbo la Kiebrania, na irabu ya mwisho imeongezwa kulifanya litamkike kwa urahisi katika Kiswahili.
- source_word: אַשְׁבֵּל
  choice: Ashbeli
  rationale: Jina limenukuliwa kwa kufuata kwa karibu sauti za Kiebrania na muundo wa matamshi ya Kiswahili.
- source_word: גֵּרָא
  choice: Gera
  rationale: Jina la mtu limenukuliwa badala ya kutafsiriwa.
- source_word: נַעֲמָן
  choice: Naamani
  rationale: Umbo hili linafuata matamshi ya jina la Kiebrania na matumizi yanayoeleweka katika Kiswahili.
- source_word: אֵחִי
  choice: Ehi
  rationale: Maandishi ya Kimasora katika mstari huu yana jina Ehi; umbo tofauti katika nasaba inayolingana halijaingizwa katika matini kuu.
- source_word: רֹאשׁ
  choice: Roshi
  rationale: Katika orodha hii neno hili ni jina la mtu, kwa hiyo limenukuliwa, wala halijatafsiriwa kuwa ‘kichwa’ au ‘mkuu.’
- source_word: מֻפִּים
  choice: Mupimu
  rationale: Matini kuu inafuata umbo la Kimasora Muppim, lililorekebishwa kwa matamshi ya Kiswahili; tofauti ya nasaba nyingine imewekwa katika tanbihi.
- source_word: חֻפִּים
  choice: Hupimu
  rationale: Jina limenukuliwa kutoka umbo la Kimasora kwa namna inayotamkika kwa Kiswahili.
- source_word: אָרְדְּ
  choice: Ardi
  rationale: Matini ya mstari huu ina Ard; umbo linalohusiana katika nasaba nyingine halijachukua nafasi ya usomaji huu.
