base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Zilpa, ambaye Labani alimpa Lea, binti yake; naye akamzalia Yakobo hawa: watu kumi na sita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi kumi na sita.” Neno la Kiebrania nefesh hapa ni matumizi ya kiidioma ya kuhesabu watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: Hawa ndio wana wa Zilpa
  rationale: Muundo huu unatambulisha kwa kawaida kundi lililotangulia kutajwa. “Wana” ni tafsiri ya moja kwa moja ya בְּנֵי na katika Kiswahili inaweza kulihusu kwa upana kundi la watoto au wazao.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: ambaye Labani alimpa Lea, binti yake
  rationale: Kishazi rejeshi kinamhusu Zilpa. Koma zinaonyesha wazi kwamba Lea ndiye binti ya Labani bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: naye akamzalia Yakobo hawa
  rationale: “Akamzalia” ni usemi wa kawaida wa nasaba unaohifadhi uhusiano wa kitenzi ילד na Yakobo kama baba. “Hawa” hurejelea kundi lililoorodheshwa bila kulifafanua zaidi.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: watu kumi na sita
  rationale: Katika hesabu ya nasaba, נֶפֶשׁ hutumiwa kiidioma kumaanisha mtu anayehesabiwa. “Watu” ni wazi na ya asili katika Kiswahili cha sasa.
