    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: Wana wa Asheri
  rationale: Neno בְּנֵי ni wingi wa ‘wana’ katika hali ya kuunganisha; katika orodha ya ukoo, ‘wana wa’ ni Kiswahili cha kawaida na cha wazi. Kiunganishi cha mwanzo hakihitaji kutafsiriwa kando.
- source_word: יִמְנָה
  choice: Imna
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, bila kuongeza sauti isiyokuwamo katika Kiebrania.
- source_word: וְיִשְׁוָה
  choice: Ishva
  rationale: Jina limetoholewa moja kwa moja; kiunganishi chake kinawakilishwa kiasili katika mpangilio wa orodha ya Kiswahili.
- source_word: וְיִשְׁוִי
  choice: Ishvi
  rationale: Jina limehifadhi tofauti yake na Ishva kama ilivyo katika maandishi ya Kiebrania.
- source_word: וּבְרִיעָה
  choice: na Beria
  rationale: Kiunganishi kimetafsiriwa kama ‘na’ kabla ya jina la mwisho katika orodha.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: na Sera, dada yao
  rationale: Muundo wa Kiebrania ni kifungu cha kiambatisho, kihalisi ‘na Sera dada yao’; koma huufanya uhusiano huo uwe wazi bila kuingiza kitenzi kisichotajwa.
- source_word: וּבְנֵי בְרִיעָה
  choice: Wana wa Beria
  rationale: Hiki ni kipengele kidogo kipya cha ukoo. Sentensi mpya huonyesha mgawanyo huo kwa Kiswahili cha asili.
- source_word: חֶבֶר
  choice: Heberi
  rationale: Jina limetoholewa kwa umbo linalofaa mfumo wa sauti wa Kiswahili.
- source_word: וּמַלְכִּיאֵל
  choice: na Malkieli
  rationale: Jina limetoholewa huku kiunganishi וּ kikionyeshwa kwa ‘na’.
