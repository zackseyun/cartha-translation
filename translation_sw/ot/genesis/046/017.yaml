  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo mfupi na wenye heshima unaofaa orodha ya ukoo. Kitenzi ‘walikuwa’ kimeongezwa katika vifungu vya orodha ili sentensi zisomeke kwa urahisi, huku ‘dada yao’ ikihifadhiwa kama kiambatisho cha Kiebrania.
