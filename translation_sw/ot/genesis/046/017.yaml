  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: sw
  text: 'Wana wa Asheri: Yimna[a], Yishwa, Yishwi na Beria; na Sera, dada yao[b]. Wana wa Beria: Heberi na Malkieli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Yimna pia linaweza kutoholewa Imna.
    reason: lexical_alternative
  - marker: b
