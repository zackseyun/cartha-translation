  rationale: Jina la mtu limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֵשֶׁת
  choice: mke wa
  rationale: Katika muundo huu unaohusishwa na Yakobo, maana ya kimahusiano ni “mke wa,” si “mwanamke.”
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina la mtu limetolewa kwa umbo la kawaida la Kiswahili; uhusiano wa Kiebrania umeonyeshwa kwa “mke wa Yakobo.”
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina la mtu limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וּ/בִנְיָמִן
  choice: na Benyamini
  rationale: Kiunganishi וּ kimetafsiriwa “na,” nacho jina limetolewa kwa umbo la kawaida la Kiswahili.
