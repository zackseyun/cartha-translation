- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa hali ya kuambatanisha wa neno linalomaanisha “wana.” Katika orodha hii ya ukoo, linawataja moja kwa moja wana wawili wa Raheli.
- source_word: רָחֵל
