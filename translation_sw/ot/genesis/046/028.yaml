base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: sw
  text: Alimtuma Yuda atangulie kwenda kwa Yosefu, ili aonyeshe njia ya kwenda Gosheni kabla ya Yakobo kufika[a]; nao wakaingia katika nchi ya Gosheni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili amwelekeze Yakobo kuelekea Gosheni,” “ili apate maelekezo kwa ajili ya Yakobo kuhusu Gosheni,” au, “ili afanye maandalizi kwa ajili yake huko Gosheni.” Kifungu cha Kiebrania kimebanwa; kitenzi kinaweza kumaanisha kuonyesha, kuelekeza, au kufundisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: alimtuma
  rationale: Kitenzi cha kawaida cha kutuma; kiambishi cha yambwa kinamtaja Yuda kwa njia ya asili katika Kiswahili.
- source_word: לְפָנָיו
  choice: atangulie
  rationale: Katika muktadha wa safari, msemo huu unaonyesha kwamba Yuda alitumwa aende mbele ya Yakobo, kabla yake.
- source_word: לְהוֹרֹת
  choice: ili amwonyeshe njia
  rationale: Hifili ya ירה inaweza kumaanisha kuelekeza, kufundisha, au kuonyesha. Katika muktadha huu wa safari, 'kuonyesha njia' ni ya kawaida na inadumisha wazo la mwongozo bila kuongeza dhana mahususi ya kufanya maandalizi.
- source_word: גֹּשְׁנָה
  choice: ya kwenda Gosheni
  rationale: Herufi ya mwelekeo mwishoni mwa jina inaonyesha mwendo kuelekea Gosheni; Kiswahili huieleza kwa kawaida kwa 'kwenda Gosheni'.
- source_word: וַיָּבֹאוּ
  choice: nao wakafika
  rationale: '''Wakafika'' ni simulizi la kawaida la Kiswahili kwa mwendo uliofikia mwisho, na linafaa kwa kuingia katika eneo la Gosheni.'
- source_word: אַרְצָה גֹּשֶׁן
  choice: katika nchi ya Gosheni
  rationale: Tafsiri hii inahifadhi maana ya Gosheni kama eneo au nchi, si mahali tu kwa ujumla.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: Yuda / Yosefu / Gosheni
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Mhusika anayeelekeza na maana ya kusudi la kutumwa kwa Yuda
  choice: Yuda alitumwa atangulie kwa Yosefu ili amwonyeshe Yakobo njia ya kwenda Gosheni.
  alternative: Yuda alitumwa kupata maelekezo kutoka kwa Yosefu au kufanya maandalizi ya kuwasili Gosheni.
  rationale: Kifungu cha Kiebrania kimebanwa na kinaweza kueleweka kwa njia zaidi ya moja. Matini kuu inafuata maana ya moja kwa moja ya 'kuonyesha/kuelekeza' katika muktadha wa safari, huku tanbihi ikihifadhi uwezekano wa kupokea maelekezo au kufanya maandalizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. 'Atangulie' huepuka tafsiri nzito ya neno kwa neno ya 'mbele yake,' na tanbihi inalinda utata halisi wa Kiebrania.
