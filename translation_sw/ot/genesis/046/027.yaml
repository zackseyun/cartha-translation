base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: sw
  text: Nao wana wa Yosefu waliozaliwa kwake nchini Misri walikuwa watu wawili.[a] Watu wote wa nyumba ya Yakobo waliokuja Misri walikuwa sabini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “nafsi”; hapa neno hilo linamaanisha watu mmoja mmoja katika hesabu ya familia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: Nao wana wa Yosefu
  rationale: בְּנֵי hapa inawahusu wana wa kiume wa Yosefu waliotajwa katika muktadha; “wana” ni sahihi na ya kawaida. Kiunganishi וּ kimetafsiriwa “Nao” ili kuendeleza orodha kwa ufasaha.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: waliozaliwa kwake
  rationale: Kauli tendwa ya ילד pamoja na ל־ ina maana ya waliozaliwa kwake; muundo huu unadumisha mtazamo wa Kiebrania bila kugeuza kuwa kauli tendi.
- source_word: בְמִצְרַיִם
  choice: nchini Misri
  rationale: Ni matumizi ya mahali ya בְּ. “Nchini Misri” ni Kiswahili sanifu na cha asili katika muktadha huu.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: watu wawili
  rationale: 'נֶפֶשׁ katika hesabu ya ukoo humaanisha mtu mmoja mmoja, si nafsi kama sehemu isiyo ya mwili. Kiswahili huhitaji upatanisho wa wingi: “watu wawili.”'
- source_word: כָּל הַנֶּפֶשׁ
  choice: Watu wote
  rationale: Ingawa נֶפֶשׁ ni umoja katika Kiebrania, hapa ni nomino ya kuhesabia watu kwa ujumla; “Watu wote” ni muundo wa kawaida wa Kiswahili.
- source_word: לְבֵית יַעֲקֹב
  choice: wa nyumba ya Yakobo
  rationale: Kirai hiki kinaonyesha washiriki wa familia au kaya pana ya Yakobo. “Nyumba ya Yakobo” inadumisha maana ya kifamilia na ya kijumuiya.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: waliokuja Misri
  rationale: Kivumishi-ashiria cha Kiebrania kinawakilishwa kwa kishazi rejeshi. He ya mwelekeo katika מִצְרַיְמָה inaonyeshwa kiasili kwa kitenzi “kuja” pamoja na “Misri.”
- source_word: שִׁבְעִים
  choice: walikuwa sabini
  rationale: Kishazi cha Kiebrania hakina kitenzi wazi na kinatoa jumla; “walikuwa sabini” ni kifupi, wazi, na karibu na muundo wa chanzo.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika hesabu ya ukoo
  choice: watu
  alternative: nafsi
  rationale: Aya inahesabu washiriki wa nyumba ya Yakobo, wala haitoi fundisho kuhusu asili ya nafsi. “Watu” huwasilisha maana ya nahau ya kuhesabu bila kuingiza maana ya kiteolojia isiyokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyumba ya Yakobo” imehifadhiwa kama usemi wa kifamilia-kijumuiya, huku “watu” ikitumika kwa uwazi katika hesabu.
