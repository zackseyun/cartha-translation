lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: walizaliwa kwa Yusufu
  rationale: Kauli ya kutendwa ya ילד inaeleza kwamba watoto walizaliwa kwa Yusufu. Wingi umetumiwa kwa sababu majina mawili, Manase na Efraimu, ndiyo yanayofuata; muundo huu pia unaepuka Kiswahili kisicho wazi cha kusema kana kwamba Yusufu mwenyewe alizaliwa.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Neno אֶרֶץ limehifadhiwa kama “nchi,” kwa ufasaha wa heshima unaobaki karibu na muundo wa Kiebrania.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: ndiye aliyemzalia watoto hao
  rationale: Muundo huu unahifadhi tendo la mama la kuzaa na maana ya kumzalia Yusufu, huku ukirejelea Manase na Efraimu kwa uwazi katika Kiswahili cha sasa.
- source_word: אָסְנַת
  choice: Asenathi
  rationale: Tahajia ya kawaida ya jina hili katika Kiswahili.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: binti ya Potifera
  rationale: Kirai cha uhusiano kinamtambulisha Asenathi kuwa binti ya Potifera; jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: כֹּהֵן אֹן
  choice: kuhani wa Oni
  rationale: כֹּהֵן limetafsiriwa moja kwa moja kuwa “kuhani,” na jina la mahali אֹן limetoholewa kuwa “Oni” badala ya kubadilishwa na jina lake la baadaye la Kigiriki.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Manase na Efraimu
  rationale: Viashiria vya yambwa אֶת havitafsiriwi; majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili.
