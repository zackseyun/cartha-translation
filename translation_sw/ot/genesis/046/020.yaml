  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: sw
  text: Manase na Efraimu walizaliwa kwa Yusufu katika nchi ya Misri; Asenathi, binti ya Potifera, kuhani wa Oni[a], aliwazalia Yusufu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oni ni mji wa Misri ambao baadaye ulijulikana kwa Kigiriki kama Heliopoli.
