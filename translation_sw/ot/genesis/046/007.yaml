  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: sw
  text: Wanawe wa kiume na wajukuu wake wa kiume waliokuwa pamoja naye[a], binti zake na wajukuu wake wa kike[b], na wazao wake wote[c], aliwaleta pamoja naye Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa wanawe.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “binti za wanawe.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mbegu yake”; yaani, wazao wake wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: wanawe wa kiume
  rationale: Katika mstari huu neno hilo linamaanisha watoto wa kiume, kwa kuwa binti wanatajwa tofauti baadaye.
- source_word: וּבְנֵי בָנָיו
  choice: na wajukuu wake wa kiume
  rationale: Kiebrania kinasema kihalisi ‘wana wa wanawe’; Kiswahili cha kawaida hutumia ‘wajukuu wake wa kiume,’ huku tanbihi ikihifadhi muundo mahususi wa ukoo.
- source_word: אִתּוֹ
  choice: pamoja naye
  rationale: Hueleza kuandamana kwao naye.
- source_word: בְּנֹתָיו
  choice: binti zake
  rationale: Ni tafsiri ya moja kwa moja ya watoto wake wa kike, wanaotofautishwa na wanawe wa kiume.
- source_word: וּבְנוֹת בָּנָיו
  choice: na wajukuu wake wa kike
  rationale: Kiebrania kinasema kihalisi ‘binti za wanawe’; tafsiri hii ni ya kawaida katika Kiswahili, na tanbihi inaonyesha maana mahususi ya asili.
- source_word: וְכָל זַרְעוֹ
  choice: pamoja na wazao wake wote
  rationale: זֶרַע kihalisi ni ‘mbegu,’ lakini katika muktadha wa familia humaanisha wazao kwa ujumla.
- source_word: הֵבִיא
  choice: aliwaleta
  rationale: Hifili ya בוא ina maana ya kusababisha kuja au kuleta; ‘aliwaleta’ huhifadhi maana hiyo ya kisababishi.
- source_word: מִצְרָיְמָה
  choice: Misri
  rationale: Kiishio cha mwelekeo kinaonyesha safari kuelekea Misri; katika muundo wa Kiswahili wenye ‘aliwaleta,’ jina la mahali linaeleweka kama kikomo cha safari.
