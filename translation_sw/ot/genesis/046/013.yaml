lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na wana wa
  rationale: Neno בְּנֵי ni wingi wa hali ya kuunganisha wa ‘wana’; kiunganishi וּ kimetafsiriwa ‘Na’ ili kudumisha mtiririko wa orodha.
- source_word: יִשָׂשכָר
  choice: Isakari
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Jina la mtu katika nasaba; limetoholewa badala ya kutafsiriwa maana yake.
- source_word: וּ/פֻוָּה
  choice: Puva
  rationale: Jina limetoholewa kwa kufuata kwa karibu umbo la Kiebrania פֻוָּה; umbo mbadala ‘Pua’ limehifadhiwa katika tanbihi.
- source_word: וְ/י֥וֹב
  choice: Yobu
  rationale: Andiko la Kimasora hapa lina יוֹב; ‘Yobu’ ni umbo la kawaida la jina hilo kwa Kiswahili. Tofauti ya 1 Mambo ya Nyakati 7:1 imeonyeshwa katika tanbihi.
- source_word: וְ/שִׁמְרֽוֹן
  choice: na Shimroni
  rationale: Jina limetoholewa kwa mtindo wa kawaida wa Kiswahili, huku kiunganishi cha Kiebrania kikihifadhiwa kama ‘na’.
