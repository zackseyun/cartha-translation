lexical_decisions:
- source_word: וַתֵּלֶד
  choice: akamzalia
  rationale: Kitenzi cha mfululizo wa simulizi kinaendeleza tukio linalofuata; muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba Zilpa alimzaa mtoto ambaye baba yake ni Yakobo.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: שִׁפְחַת לֵאָה
  choice: mtumishi wa kike wa Lea
  rationale: Kirai hiki kinabainisha hadhi ya Zilpa kuhusiana na Lea na kuhifadhi bayana jinsia ya neno la Kiebrania bila kutumia lugha ya kizamani.
- source_word: בֵּן שֵׁנִי
  choice: mwana wa pili
  rationale: Hii inahifadhi maana ya moja kwa moja kwamba huyo alikuwa mwana wa pili aliyezaliwa na Zilpa kwa Yakobo katika muktadha huu.
- source_word: לְיַעֲקֹב
  choice: akamzalia Yakobo
  rationale: Kiambishi cha yambwa katika akamzalia kinaonyesha uhusiano wa baba au mhusika anayehusishwa na uzazi, kwa Kiswahili cha kawaida na fasaha.
