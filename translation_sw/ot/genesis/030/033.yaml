base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: sw
  text: '“Basi uadilifu wangu utanitetea wakati ujao[a][b], utakapokuja kukagua ujira wangu[e]: kila mbuzi asiye na madoadoa madogo au mabaka, na kila kondoo asiye na rangi iliyokolea[c][d], akipatikana kwangu, atahesabiwa kuwa ameibwa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki yangu” au “uaminifu wangu utanitetea.” Hapa neno la Kiebrania linahusu unyofu wa Yakobo ambao ungeweza kuthibitishwa katika mpango wa ujira.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “siku ya kesho”; kauli hiyo inaweza kumaanisha “kesho” au, kwa ujumla zaidi, wakati wa baadaye ambapo Labani atakapokagua mifugo.
    reason: lexical_alternative
  - marker: c
    text: Au “kahawia.” Neno la Kiebrania hutaja mnyama mwenye rangi nyeusi kiasi au kahawia.
    reason: lexical_alternative
  - marker: d
    text: Au “kila asiye na madoadoa madogo au mabaka miongoni mwa mbuzi, na kila asiye na rangi iliyokolea miongoni mwa kondoo.”
    reason: previous_rendering
  - marker: e
    text: Au “utakapokuja kuchunguza ujira wangu mbele yako.” Kauli “mbele yako” inasisitiza kuwa uchunguzi huo ungefanywa mbele ya Labani na chini ya uamuzi wake.
    reason: previous_rendering
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: utanitetea
  rationale: Kitenzi ענה pamoja na בִּי hapa kinaonyesha uadilifu wa Yakobo ukitoa ushahidi kwa niaba yake. ‘Utanitetea’ ni Kiswahili cha kawaida kinachohifadhi picha ya ushahidi unaomjibu mshtaki.
- source_word: צִדְקָתִי
  choice: uadilifu wangu
  rationale: Katika mpango huu wa ujira, neno hilo linahusu mwenendo wa Yakobo unaoweza kuthibitishwa kuwa mnyofu. ‘Uadilifu’ huhifadhi uzito wa kimaadili wa neno bila kulifanya liwe fundisho maalumu la kidini.
- source_word: בְּיוֹם מָחָר
  choice: wakati ujao
  rationale: Kihalisi ni ‘siku ya kesho,’ lakini katika muktadha linaweza kumaanisha wakati wa baadaye ambapo Labani atakagua mifugo. Tanbihi inadumisha uwezekano wa maana ya ‘kesho.’
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: utakapokuja kukagua ujira wangu
  rationale: Kauli hiyo inaelekea kwenye uchunguzi wa baadaye wa sehemu ya mifugo iliyo ujira wa Yakobo. ‘Kukagua’ huwasilisha tendo linalodokezwa kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi muundo wenye ‘mbele yako.’
- source_word: נָקֹד
  choice: madoadoa madogo
  rationale: Neno hili hutaja alama ndogo ndogo za rangi, na hivyo linatofautishwa na טָלוּא, yaani mabaka makubwa zaidi.
- source_word: טָלוּא
  choice: mabaka
  rationale: Neno hili hueleza ngozi yenye vipande au mabaka ya rangi tofauti. ‘Mabaka’ ni neno la kawaida na wazi katika Kiswahili.
- source_word: חוּם
  choice: rangi iliyokolea
  rationale: Neno hilo huenda likamaanisha rangi ya kahawia au rangi nyingine nyeusi kiasi. ‘Iliyokolea’ huepuka kubainisha kwa uhakika kivuli cha rangi ambacho hakijulikani kabisa.
- source_word: בָּעִזִּים
  choice: miongoni mwa mbuzi
  rationale: Hutaja kundi la mbuzi linalohusika katika sharti la ujira.
- source_word: בַּכְּשָׂבִים
  choice: miongoni mwa kondoo
  rationale: כְּשָׂבִים inaweza kutaja kondoo au wana-kondoo. ‘Kondoo’ ni neno pana na la kawaida linalofaa kwa kundi la mifugo katika muktadha huu.
- source_word: גָּנוּב הוּא אִתִּי
  choice: akipatikana kwangu, atahesabiwa kuwa ameibwa
  rationale: Kiebrania kinasema kwa ufupi kwamba mnyama asiyetimiza alama zilizokubaliwa, akipatikana kwa Yakobo, ni wa wizi. Tafsiri hii inaweka wazi maana hiyo ya hukumu bila kubadili dai.
theological_decisions:
- issue: Maana ya צִדְקָתִי katika muktadha wa ujira
  choice: uadilifu wangu
  alternative: haki yangu; uaminifu wangu
  rationale: Aya inazungumzia unyofu wa Yakobo unaoweza kukaguliwa katika makubaliano ya mifugo. ‘Uadilifu’ huhifadhi maana ya kimaadili na uwezekano wa kuthibitishwa bila kuingiza maana finyu ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Uadilifu,’ ‘kukagua,’ na ‘rangi iliyokolea’ ni maneno ya sasa yasiyoegemea dhehebu. Muundo wa orodha umewekwa wazi, na utata halisi wa ‘kesho/wakati ujao,’ ‘kahawia/rangi iliyokolea,’ na ‘kondoo/wana-kondoo’ haujafichwa.
