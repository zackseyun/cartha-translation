review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Laban's small prior holdings, their great increase, and Jacob's question about providing for his household. However, “tangu nilipokuja” makes the blessing explicitly durative (“since I came”), whereas לְרַגְלִי is an idiom more suitably rendered here as “kwa kuja kwangu,” with the causal possibility retained in the note. “Nitaanza” adds an explicit beginning not stated in the Hebrew.
  naturalness: The proposed revision is fluent Standard East African Swahili. “Kwa kuja kwangu” is natural in this context, and “nitakapoiandalia mahitaji nyumba yangu” communicates the economic force of doing/providing for one’s household without the extra inception implied by “nitaanza.”
  terminology: “Yahwe” consistently represents the divine name rather than substituting a title. “Nyumba yangu” appropriately retains the Hebrew household/house sense. The footnotes are revised for idiomatic and accurate Swahili, including a clear literal gloss of the Hebrew idiom.
  issues:
  - severity: medium
    issue: “tangu nilipokuja” over-specifies the force of לְרַגְלִי.
    rationale: “Tangu” expresses an action continuing from a past point. The Hebrew idiom can refer to Jacob’s coming/presence or to blessing on his account, but does not itself require the durative sense.
  - severity: low
    issue: “nitaanza lini” adds an unstated element of beginning.
    rationale: The Hebrew asks when Jacob too will act/provide for his household; it does not explicitly say “begin.”
  - severity: low
    issue: The existing footnote wording is not fully idiomatic and its literal gloss is imprecise in form.
    rationale: “Kwa neno kwa neno” is clearer than “Kwa karibu,” and “kwenye mguu wangu” better reflects the singular Hebrew expression than the current explanatory phrasing.
  revised_text: Kwa maana kile kidogo ulichokuwa nacho kabla sijaja kimeongezeka na kuwa kingi sana, na Yahwe amekubariki kwa kuja kwangu.[a] Sasa basi, nami nitakapoiandalia lini nyumba yangu mwenyewe mahitaji?[b]
  revised_footnotes:
  - marker: a
    text: Kwa neno kwa neno, “kwenye mguu wangu.” Nahau hii inaweza kumaanisha “kwa kuja kwangu” au “kwa sababu yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nami nitafanya lini jambo kwa ajili ya nyumba yangu mwenyewe?”
    reason: lexical_alternative
  revision_rationale: The revision avoids making the foot idiom durative while preserving its contextual arrival-based sense and its possible causal sense in a footnote. It also removes the added “start” and gives a natural Swahili expression for Jacob’s provision for his own household. No disputed theological or interpretive claim is introduced.
