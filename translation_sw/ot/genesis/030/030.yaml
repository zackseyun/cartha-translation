- from: Kwa maana kile kidogo ulichokuwa nacho kabla sijaja kimeongezeka na kuwa kingi sana, na Yahwe amekubariki tangu nilipokuja.[a] Sasa basi, nami nitaanza lini kuikimu nyumba yangu mwenyewe?[b]
  to: Kwa maana kile kidogo ulichokuwa nacho kabla sijaja kimeongezeka na kuwa kingi sana, na Yahwe amekubariki kwa kuja kwangu.[a] Sasa basi, nami nitakapoiandalia lini nyumba yangu mwenyewe mahitaji?[b]
  rationale: The revision avoids making the foot idiom durative while preserving its contextual arrival-based sense and its possible causal sense in a footnote. It also removes the added “start” and gives a natural Swahili expression for Jacob’s provision for his own household. No disputed theological or interpretive claim is introduced.
