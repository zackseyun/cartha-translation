base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: sw
  text: Kwa maana kile kidogo ulichokuwa nacho kabla sijaja kimeongezeka na kuwa kingi sana, na Yahwe amekubariki kwa kuja kwangu.[a] Sasa basi, nami nitakapoiandalia lini nyumba yangu mwenyewe mahitaji?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “kwenye mguu wangu.” Nahau hii inaweza kumaanisha “kwa kuja kwangu” au “kwa sababu yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nami nitafanya lini jambo kwa ajili ya nyumba yangu mwenyewe?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ
  choice: kile kidogo ulichokuwa nacho
  rationale: Kifungu hiki kinarejelea mali chache ambazo Labani alikuwa nazo; tafsiri hii ni ya kawaida na inaweka mkazo wa Kiebrania juu ya uchache wake.
- source_word: לְפָנַי
  choice: kabla sijaja
  rationale: Ingawa maana ya karibu ni ‘mbele yangu,’ katika muktadha huu Yakobo analinganisha hali ya Labani kabla ya kuwasili kwake na ongezeko lililofuata.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: kimeongezeka na kuwa kingi sana
  rationale: Kitenzi פרץ kinaonyesha ongezeko kubwa au la ghafla, na לָרֹב huonyesha wingi; Kiswahili hiki kinafikisha wazo hilo kwa kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: לְרַגְלִי
  choice: tangu nilipokuja
  rationale: Nahau hii, ambayo kwa karibu ni ‘kwenye mguu wangu,’ inaweza kuonyesha kuja kwa Yakobo au baraka zilizotokea kwa sababu yake. Maandishi makuu yanatumia maana inayofaa kwa mlinganisho wa wakati, huku tanbihi ikihifadhi uwezekano wa kisababishi.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: nami nitaanza lini kuikimu nyumba yangu mwenyewe?
  rationale: Swali linasisitiza kwamba baada ya kumtajirisha Labani, Yakobo anahitaji pia kushughulikia mahitaji ya watu wa nyumbani mwake. ‘Kuikimu’ huwasilisha maana ya kiuchumi iliyodokezwa na עשה לְבית.
theological_decisions:
- issue: Uandishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: ‘Yahwe’ linawakilisha jina la Kiebrania moja kwa moja bila kulibadilisha kuwa cheo au kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Nyumba’ imehifadhiwa kwa sababu inaweza kujumuisha familia na mali ya nyumbani; ‘kuikimu’ hufanya maana ya kimuktadha iwe wazi bila kupanua kupita kiasi.
