  yaml_path: translation/ot/genesis/030/021.yaml
  text: Afterward she bore a daughter and called her name Dinah.
translation:
  language: sw
  text: Baadaye akamzaa binti, akamwita Dina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Baadaye
  rationale: Inaonyesha mfuatano wa wakati baada ya kuzaliwa kwa watoto waliotajwa kabla, kwa Kiswahili cha kawaida na cha masimulizi.
- source_word: יָלְדָה
  choice: akamzaa
  rationale: Kitenzi hiki cha Kiswahili kinaonyesha kwa ufupi kuwa yeye alimzaa mtoto, huku kiambishi cha ngeli ya mtu kikirejelea kitu kinachofuata, yaani binti.
- source_word: בַּת
  choice: binti
  rationale: Huwakilisha moja kwa moja nomino ya Kiebrania inayomaanisha mtoto wa kike.
- source_word: וַ/תִּקְרָא אֶת שְׁמָהּ
  choice: akamwita
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kumpa mtu jina, na unaendeleza mfuatano wa masimulizi unaoonyeshwa na wayyiqtol ya Kiebrania.
- source_word: דִּינָה
  choice: Dina
  rationale: Ni umbo la jina hili linalotumiwa kwa kawaida katika tafsiri za Kiswahili na linafuata matamshi yanayofaa ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, yenye heshima na ya kawaida katika masimulizi ya Biblia. Muundo wa ‘akamzaa ... akamwita’ unaakisi mfuatano wa vitenzi vya Kiebrania bila kufanya sentensi kuwa ngumu.
