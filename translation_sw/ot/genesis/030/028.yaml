lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Kisha akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: נָקְבָה
  choice: Taja
  rationale: Kitenzi נקב hapa humaanisha kutaja au kubainisha wazi kiasi kinachotakiwa.
- source_word: שְׂכָרְךָ
  choice: ujira wako
  rationale: שָׂכָר hapa ni malipo ya kazi; “ujira” linafaa katika uhusiano wa kazi kati ya Labani na Yakobo.
- source_word: עָלַי
  choice: kwangu
  rationale: Ingawa maana ya msingi ni “juu yangu,” katika msemo huu neno hilo linaelekeza dai au wajibu kwa msemaji. Maana yake imewakilishwa kwa mtiririko wa “nami nitakupa,” huku mbadala wa moja kwa moja zaidi ukiwekwa katika tanbihi.
- source_word: וְאֶתֵּנָה
  choice: nami nitakupa
  rationale: Umbo hili linaonyesha ahadi ya msemaji kutoa ujira; Kiswahili hutumia kiambishi cha yambwa “-ku-” kwa anayepokea bila kulazimika kurudia “ujira.”
