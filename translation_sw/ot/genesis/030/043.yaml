base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: sw
  text: Mtu huyo akastawi sana sana, akawa na makundi mengi ya kondoo na mbuzi, watumwa wa kike na watumwa wa kiume[a], ngamia na punda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wa kike na watumishi wa kiume.” Maneno ya Kiebrania yanaweza kutafsiriwa kwa ujumla kuwa watumishi wa nyumbani, lakini katika orodha hii yanaonyesha pia hali ya utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹץ
  choice: akastawi
  rationale: Kitenzi פרץ kimsingi hudokeza kuvunja na kuenea kwa nguvu; katika muktadha huu kinaonyesha kuongezeka sana kwa mali na mafanikio. “Akastawi” ni Kiswahili cha kawaida kinachowasilisha maana hiyo ya kimuktadha.
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Kiebrania kinasema kihalisi “mtu huyo,” kikimrejelea Yakobo kutokana na muktadha bila kutaja jina lake tena.
- source_word: מְאֹד מְאֹד
  choice: sana sana
  rationale: Kurudiwa kwa מְאֹד kunasisitiza kiwango kikubwa mno; urudiaji “sana sana” huhifadhi msisitizo wa chanzo kwa Kiswahili cha asili.
- source_word: וַיְהִי לוֹ
  choice: akawa na
  rationale: Muundo huu unaonyesha hali mpya ya kumiliki iliyotokana na ukuaji uliotangulia; “akawa na” ni wa moja kwa moja na wa kawaida katika simulizi.
- source_word: צֹאן רַבּוֹת
  choice: makundi mengi ya kondoo na mbuzi
  rationale: צֹאן ni jina la jumla kwa mifugo midogo, hasa kondoo na mbuzi; “makundi mengi” huwasilisha wingi wa רַבּוֹת huku ufafanuzi wa aina za mifugo ukizuia kueleweka kuwa kondoo pekee.
- source_word: שְׁפָחוֹת
  choice: watumwa wa kike
  rationale: Neno hili humaanisha wanawake waliokuwa katika hali ya utumwa au utumishi wa nyumbani. Kwa kuwa hapa wanatajwa pamoja na mali nyingine alizopata Yakobo, “watumwa wa kike” huonyesha wazi hali yao ya kijamii badala ya kuilainisha.
- source_word: עֲבָדִים
  choice: watumwa wa kiume
  rationale: Katika jozi hii neno linawarejelea wanaume waliokuwa katika hali ya utumwa. Ufafanuzi wa jinsia huhifadhi utofautishaji uliopo kati ya שְׁפָחוֹת na עֲבָדִים.
- source_word: גְמַלִּים
  choice: ngamia
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wanyama hao.
- source_word: חֲמֹרִים
  choice: punda
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wanyama hao.
theological_decisions:
- issue: Kutafsiri שְׁפָחוֹת na עֲבָדִים kwa lugha ya utumwa au ya utumishi
  choice: watumwa wa kike na watumwa wa kiume
  alternative: watumishi wa kike na watumishi wa kiume
  rationale: Maneno ya Kiebrania yanaweza kutaja watumishi wa nyumbani, lakini yanaweza pia kuonyesha hali ya kutokuwa huru. Kutajwa kwa watu hawa katika orodha ya mali aliyokuwa nayo Yakobo kunafanya “watumwa” kuwa tafsiri iliyo wazi zaidi kuhusu hali yao, bila kuhalalisha wala kulainisha taasisi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Urudiaji “sana sana” umehifadhiwa ili kuonyesha msisitizo wa Kiebrania. Orodha imewekwa kwa namna ya asili katika Kiswahili bila kupoteza mkusanyiko wa mali unaosisitizwa na chanzo.
