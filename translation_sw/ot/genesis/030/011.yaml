  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: sw
  text: Lea akasema, “Bahati njema![a]” Basi akamwita mtoto huyo Gadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania בגד ni magumu kuelewa. Huenda ni mshangao unaomaanisha “Bahati njema!”; kwa mapokeo, wengine hutafsiri “Kikosi!” Jina Gadi linafanana kwa sauti na neno la Kiebrania linalotumiwa katika mchezo huu wa maneno.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: akasema
  rationale: Kitenzi cha simulizi kinaendeleza mfululizo wa matukio; “akasema” ni cha kawaida na cha asili katika simulizi la Kiswahili.
- source_word: לֵאָה
  choice: Lea
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: בגד
  choice: Bahati njema!
  rationale: Maneno haya ya Kiebrania yana utata, lakini huenda ni mshangao unaohusiana na גד, yaani “bahati.” Tafsiri hii inafaa muktadha wa kumpa mtoto jina Gadi.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: Basi akamwita mtoto huyo
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kumpa mtu jina, huku “Basi” ikionyesha uhusiano kati ya mshangao wa Lea na jina alilompa mtoto.
- source_word: גָּד
  choice: Gadi
  rationale: “Gadi” ni umbo la jina hili lililozoeleka katika Kiswahili; linawakilisha jina la Kiebrania Gad.
