translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “matawi” kwa uwazi wa kitu halisi na “na hivyo” kuonyesha kuwa kumenya kulisababisha sehemu nyeupe kuonekana. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na majina ya miti yanayohusika.
