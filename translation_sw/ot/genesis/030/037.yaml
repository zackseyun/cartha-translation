base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: sw
  text: Kisha Yakobo akajichukulia vijiti vya popla vibichi[a], vya mlozi[b], na vya platanasi[c]. Akamenya magome yake, akiacha mistari myeup[e] na kufunua sehemu nyeupe ya vijiti hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mti wa storaksi”; utambulisho kamili wa לִבְנֶה haujulikani kwa hakika, ingawa “popla” ni tafsiri ya kawaida.
    reason: lexical_alternative
  - marker: b
    text: Tafsiri fulani za zamani hutaja mti wa hazeli, lakini “mlozi” inaelekea zaidi kuwa maana ya לוּז.
    reason: lexical_alternative
  - marker: c
    text: Inaelekea kuwa platanasi (plane tree); tafsiri fulani za zamani hutaja mti wa chestnati.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: matawi
  rationale: Katika muktadha huu ni vipande vya miti vilivyokatwa; “matawi” ni neno la kawaida na la asili kwa vitu hivi kuliko “fimbo,” ambalo lingeweza kudokeza vifaa vya kutembelea au kupigia.
- source_word: לִבְנֶה לַח
  choice: matawi mabichi ya mti wa popla
  rationale: לַח inaonyesha miti iliyokuwa mibichi au yenye unyevunyevu, yaani iliyokatwa karibuni. Utambulisho wa לִבְנֶה si hakika, lakini popla ni tafsiri inayokubalika sana.
- source_word: לוּז
  choice: mlozi
  rationale: Neno la Kiebrania linaelekea kumaanisha mlozi kuliko mti wa hazeli unaopatikana katika mapokeo fulani ya zamani.
- source_word: עֶרְמוֹן
  choice: mkuyu-maji
  rationale: Linaelekea kutaja plane tree; “mkuyu-maji” ni jina la Kiswahili linalotumika kwa mti huo, ingawa utambulisho wa jina hili la kale si hakika kabisa.
- source_word: וַיְפַצֵּל
  choice: akayamenya
  rationale: Kitendo ni kuondoa sehemu za gome la matawi ili sehemu nyeupe ya ndani ionekane.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: mistari myeupe
  rationale: Inaeleza alama nyeupe zilizoonekana baada ya sehemu za gome kumenywa; “mistari myeupe” huwasilisha matokeo hayo kwa Kiswahili cha kawaida.
- source_word: מַחְשֹׂף הַלָּבָן
  choice: na hivyo kuufunua weupe
  rationale: Huhifadhi dhana ya kuweka wazi sehemu nyeupe iliyofichwa chini ya gome.
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: wa matawi hayo
  rationale: Kiswahili cha kawaida huonyesha kwa umilikaji weupe uliokuwa sehemu ya matawi; tafsiri ya moja kwa moja “uliokuwa juu ya matawi” ingesikika kana kwamba weupe ulikuwa tayari juu ya gome.
