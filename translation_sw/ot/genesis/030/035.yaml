base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: sw
  text: Siku hiyo akawatenga beberu waliokuwa na milia[a] na mabaka, na mbuzi wote wa kike waliokuwa na madoa madogo na mabaka—kila mmoja aliyekuwa na sehemu nyeupe—na kila mwanakondoo wa kahawia[b]; akawaweka chini ya uangalizi wa wanawe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye mikanda”; neno la Kiebrania linarejelea alama za mistari au mikanda kwenye wanyama.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwenye rangi ya kahawia iliyokolea”; neno la Kiebrania חוּם linaweza kumaanisha kahawia yenye ukolezi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni, “akawatia mkononi mwa wanawe,” nahau yenye maana ya kuwaweka chini ya mamlaka au uangalizi wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: akawatenga
  rationale: Hifili ya סור hapa inaonyesha kuwa wanyama waliondolewa na kutengwa na kundi; “akawatenga” ni ya asili katika muktadha wa mifugo.
- source_word: הַתְּיָשִׁים
  choice: beberu
  rationale: Neno hili humaanisha mbuzi dume; “beberu” ni istilahi sanifu na fupi ya Kiswahili.
- source_word: הָעֲקֻדִּים
  choice: wenye milia
  rationale: Neno la Kiebrania linaashiria alama kama mikanda au mistari kwenye ngozi; “wenye milia” linaeleweka kwa urahisi.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: wenye madoadoa / madoadoa makubwa
  rationale: Mzizi huu unaashiria rangi yenye mabaka au madoa; “madoadoa” ni lugha ya kawaida, na katika mfululizo wa pili ukubwa umeelezwa ili kutofautisha na נְקֻדּוֹת.
- source_word: הָעִזִּים
  choice: mbuzi wote wa kike
  rationale: Ingawa neno linaweza kumaanisha mbuzi kwa ujumla, ulinganisho wake na beberu waliotajwa kwanza unaonyesha mbuzi wa kike.
- source_word: הַנְּקֻדּוֹת
  choice: wenye madoamadoa
  rationale: Neno hili linaashiria nukta au madoa madogo; uchaguzi huu unalitofautisha na טלאות, yaani mabaka au madoa makubwa.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: kila aliyekuwa na weupe wowote
  rationale: Huhifadhi wazo la kila mnyama aliyekuwa na sehemu yoyote nyeupe bila kudai kwamba alikuwa mweupe kabisa.
- source_word: כָל חוּם בַּכְּשָׂבִים
  choice: kila mwanakondoo mwenye rangi ya kahawia iliyokolea
  rationale: חוּם inaelekea kumaanisha kahawia au rangi iliyokolea; tafsiri hii huhifadhi rangi ya kahawia na pia ukolezi wake. כְּשָׂבִים hapa limetafsiriwa kama wanakondoo.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: akawaweka chini ya uangalizi wa wanawe
  rationale: “Kutoa mkononi mwa” ni nahau ya Kiebrania ya kuweka chini ya mamlaka au uangalizi wa mtu.
