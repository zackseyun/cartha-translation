base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: sw
  text: Na kila mara wanyama wenye nguvu katika kundi walipokuwa katika joto[a], Yakobo alikuwa akiweka fimbo hizo katika vyombo vya kunyweshea[b], mbele ya macho ya wanyama hao, ili wapandane karibu na fimbo hizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walipokuwa wakipandana.” Neno la Kiebrania linahusu hali ya wanyama kuwa katika joto na tayari kwa kupandana.
    reason: lexical_alternative
  - marker: b
    text: Au “katika mifereji ya kunyweshea” au “katika njia za maji.” Neno la Kiebrania linarejelea sehemu ambako wanyama walikuja kunywa maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל
  choice: Na kila mara ... walipokuwa
  rationale: Muundo huu unaonyesha tukio la kawaida lililorudiwa; ‘kila mara’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יַחֵם ... לְיַחְמֶנָּה
  choice: walipokuwa wakipandana ... ili wapandane
  rationale: Katika muktadha wa ufugaji, mzizi huu unahusu wanyama kuwa katika joto na kupandana. ‘Kupandana’ ni wazi, ya asili, na hailazimishi maana ya kutunga mimba.
- source_word: הַצֹּאן
  choice: wanyama ... katika kundi
  rationale: צאן ni jina la pamoja la mifugo midogo, yaani kondoo na mbuzi; ‘wanyama katika kundi’ huepuka kuitafsiri kana kwamba ni kondoo peke yao.
- source_word: הַמְקֻשָּׁרוֹת
  choice: wenye nguvu zaidi
  rationale: Neno hili linatofautishwa na wanyama dhaifu katika mstari unaofuata na hapa linaelekea kumaanisha wanyama imara au wenye nguvu.
- source_word: וְשָׂם
  choice: aliweka
  rationale: Kitenzi kinamaanisha kuweka; muktadha wa ‘kila mara’ tayari unaonyesha kuwa tendo hili lilifanywa kwa kurudiwa.
- source_word: הַמַּקְלוֹת
  choice: fimbo
  rationale: ‘Fimbo’ ni neno la kawaida kwa vijiti au matawi yaliyotumiwa na Yakobo katika mpango huu.
- source_word: לְעֵינֵי הַצֹּאן
  choice: mbele ya macho yao
  rationale: Huhifadhi msisitizo wa Kiebrania kuhusu wanyama kuziona fimbo, huku kiwakilishi kikirejelea wanyama kwa uwazi.
- source_word: בָּרֳהָטִים
  choice: ndani ya vyombo vya kunyweshea
  rationale: Neno linarejelea vyombo au mifereji ambako mifugo ilinywa maji; tafsiri hii ni wazi bila kubainisha umbo lake kupita ushahidi.
- source_word: בַּמַּקְלוֹת
  choice: huku fimbo hizo zikiwa mbele yao
  rationale: Kihusishi kinaweza kuwa cha mahali au mazingira. Kauli hii hueleza kuwa kupandana kulifanyika fimbo zikiwa hapo mbele yao, bila kudai kwamba fimbo ndizo zilizosababisha tendo hilo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia ‘wanyama katika kundi’ ili kujumuisha kondoo na mbuzi, na imeweka wazi tendo linalorudiwa bila lugha nzito au ya kale.
