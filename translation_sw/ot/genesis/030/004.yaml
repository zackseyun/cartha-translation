lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Basi akampa
  rationale: Waw-consecutive inaendeleza simulizi; “Basi” huonyesha matokeo na mfuatano kwa Kiswahili cha kawaida, huku “akampa” ikijumuisha kiwakilishi cha yule aliyepewa.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Jina limetoholewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שִׁפְחָתָהּ
  choice: mtumishi wake wa kike
  rationale: Neno שִׁפְחָה humaanisha mtumishi wa kike mwenye hadhi ya chini katika nyumba. Tafsiri hii ni wazi, ya sasa, na haitaji umri ambao Kiebrania hakitaji.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Muundo huu huonyesha kupewa katika uhusiano wa kindoa; tafsiri hii ni ya asili katika Kiswahili bila kufafanua kupita kiasi hadhi hiyo.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: akaingia kwake
  rationale: Hii huhifadhi lugha ya staha ya Kiebrania kuhusu kujamiana, na muktadha unaifanya maana ieleweke bila kuifanya wazi zaidi kuliko chanzo.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
