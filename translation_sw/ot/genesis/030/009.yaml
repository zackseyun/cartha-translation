base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: sw
  text: Lea alipoona kwamba alikuwa ameacha kuzaa,[a] akamchukua Zilpa, mtumishi wake wa kike,[b] akampa Yakobo awe mke wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amekoma kuzaa”; Kiebrania, “alikuwa amesimama kuzaa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mjakazi wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Lea alipoona
  rationale: Muundo wa wakati unaunganisha alichotambua Lea na tendo lililofuata, huku ukitoa mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaanzisha jambo alilotambua Lea, si sababu ya tendo lake.
- source_word: עָמְדָה מִלֶּדֶת
  choice: alikuwa ameacha kuzaa
  rationale: Nahau ya Kiebrania עמד + מן + kitenzi-jina humaanisha kuacha au kukoma kufanya jambo; 'kuzaa' huhifadhi muktadha wa uzazi kwa lugha ya kawaida.
- source_word: שִׁפְחָתָהּ
  choice: mtumishi wake wa kike
  rationale: Huhifadhi jinsia na hadhi yake ya chini katika kaya bila kutumia neno la kizamani; tanbihi inaonyesha uwezekano wa 'mjakazi wake.'
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Huhifadhi wazi lugha rasmi ya ndoa katika usemi wa Kiebrania wa kumpa mtu kuwa mke, badala ya kuingiza hadhi ya 'suria' ambayo haikutajwa hapa.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: לְיַעֲקֹב
  choice: akampa Yakobo
  rationale: Huwakilisha kiambishi cha yambwa kisicho cha moja kwa moja kwa muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Hadhi ya Zilpa katika kaya na lugha ya ndoa
  choice: Kutafsiri שִׁפְחָה kama 'mtumishi wake wa kike' na לְאִשָּׁה kama 'awe mke wake,' bila kulegeza mojawapo.
  alternative: Kutumia 'mjakazi' au kumwita 'suria.'
  rationale: Kiebrania humtambulisha Zilpa kuwa mtumishi wa Lea na pia husema alipewa Yakobo kuwa mke. Tafsiri inahifadhi mvutano huo bila kuingiza istilahi nyingine ya hadhi ya ndoa isiyotumiwa katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Muundo wa vitenzi mfululizo ('akamchukua ... akampa') unaendeleza simulizi kwa uwazi. Alama zote za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
