  text: Lea akapata mimba tena, akamzalia Yakobo mwana wa kiume wa sita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Kitenzi הרה humaanisha kushika au kupata mimba. “Akapata mimba” ni Kiswahili cha kawaida, wazi, na chenye hadhi katika simulizi la kuzaliwa.
- source_word: עוֹד
  choice: tena
  rationale: Katika mfuatano huu wa simulizi, עוֹד huonyesha kurudiwa kwa tendo; “tena” huwasilisha maana hiyo kwa kawaida.
- source_word: וַתֵּלֶד
  choice: akamzalia
  rationale: Kitenzi ילד hapa humaanisha kuzaa. Muundo “akamzalia Yakobo” pia huhifadhi uhusiano unaoonyeshwa na לְיַעֲקֹב.
- source_word: בֵּן
  choice: mwana
  rationale: בֵּן humaanisha mwana wa kiume; katika muktadha huu “mwana” ni neno la kawaida na maana ya kiume iko wazi katika mpangilio wa wana wa Yakobo.
- source_word: שִׁשִּׁי
  choice: wa sita
  rationale: Namba ya mpangilio שִׁשִּׁי inaonyesha kwamba huyu alikuwa mwana wa sita ambaye Lea alimzalia Yakobo.
- source_word: לְיַעֲקֹב
  choice: Yakobo
  rationale: Kihusishi לְ kinaonyesha uhusiano wa kumzalia Yakobo. Katika Kiswahili, maana hiyo imeingizwa kwa kawaida katika kitenzi “akamzalia.”
