  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa kawaida kwa wasomaji wengi; istilahi za rangi zimefafanuliwa kwa njia inayoeleweka huku kutokuwa hakika kwa tofauti ya maneno ya Kiebrania kukihifadhiwa katika tanbihi.
