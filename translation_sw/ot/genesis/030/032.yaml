  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: sw
  text: Niruhusu leo nipitie katika kundi lako lote, nikiondoa humo kila kondoo mwenye madoadoa madogo na mabaka, kila kondoo mwenye rangi ya giza[a], na kila mbuzi mwenye mabaka na madoadoa madogo[b]; nao watakuwa ujira wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye rangi ya kahawia.” Neno la Kiebrania חוּם linaweza kumaanisha rangi ya giza au ya kahawia miongoni mwa kondoo.
    reason: lexical_alternative
  - marker: b
    text: Maneno yaliyotafsiriwa “mabaka” (טָלוּא) na “madoadoa madogo” (נָקֹד) yote yanaeleza mifumo ya rangi, na tofauti kamili kati yake si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: niruhusu nipite
  rationale: Kauli ya nafsi ya kwanza katika muktadha wa pendekezo la Yakobo inaeleweka kwa maana ya kuomba ruhusa, huku ikihifadhi tendo la ‘kupita’.
- source_word: בְּכָל צֹאנְךָ
  choice: katika kundi lako lote
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; ‘kundi’ ni la kawaida na halitangulizi mgawanyo unaofuata.
- source_word: הַיּוֹם
  choice: Leo
  rationale: Hutoa wazi maana ya wakati ya neno la Kiebrania.
- source_word: הָסֵר מִשָּׁם
  choice: nikiondoa humo
  rationale: Inaonyesha kitendo cha kuwatenga na kuwaondoa wanyama hao kutoka kundini.
- source_word: נָקֹד
  choice: mwenye madoadoa madogo
  rationale: Neno hili huelekea kuonyesha alama ndogo za rangi; usemi huu unalitofautisha kwa kadiri iwezekanavyo na טָלוּא.
- source_word: טָלוּא
  choice: mwenye mabaka
  rationale: ‘Mabaka’ huonyesha maeneo makubwa au yasiyo sawa ya rangi, bila kudai tofauti kamili isiyothibitishwa na neno linaloandamana nalo.
- source_word: חוּם
  choice: mwenye rangi nyeusi-kahawia
  rationale: Neno linaonyesha rangi ya giza au kahawia; muungano huu huhifadhi upana huo bila kuuchagua upande mmoja tu.
- source_word: בַּכְּשָׂבִים
  choice: kondoo
  rationale: Katika muktadha wa kundi, neno linarejelea jamii ya kondoo kwa kulinganisha na mbuzi.
- source_word: בָּעִזִּים
  choice: mbuzi
  rationale: Ni tafsiri ya kawaida ya kundi la mbuzi bila kuongeza jinsia ambayo muktadha hauhitaji.
- source_word: וְהָיָה שְׂכָרִי
  choice: Hao watakuwa ujira wangu
  rationale: Kirejeleo cha wanyama waliotengwa kinafanywa wazi kwa Kiswahili cha kawaida, na ‘ujira’ linafaa kwa malipo ya kazi.
