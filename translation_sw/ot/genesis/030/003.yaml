base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: sw
  text: Ndipo akasema, “Huyu hapa Bilha, mjakazi wangu. Ingia kwake, ili azae juu ya magoti yangu[a], nami pia nijengwe kupitia kwake.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “azae juu ya magoti yangu.” Huenda usemi huu unarejelea desturi ambayo mtoto aliyezaliwa na mjakazi alipokewa kwa ishara kuwa mtoto wa mke.
    reason: cultural_note
  - marker: b
    text: Au, “nami pia nipate watoto kupitia kwake.” Kiebrania kinasema “nijengwe,” kikitumia sitiari ya kujenga familia kwa kupata uzao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: mjakazi wangu
  rationale: Neno אמה humaanisha mtumishi wa kike aliye chini ya mamlaka ya mwingine. ‘Mjakazi’ ni neno la kawaida na lenye heshima katika Kiswahili, huku likihifadhi tofauti ya hadhi iliyopo katika matini.
- source_word: בֹּא אֵלֶיהָ
  choice: Ingia kwake
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kufanya ngono. Tafsiri hii inahifadhi lugha ya staha na picha ya matini chanzi bila kuieleza kwa maneno makali zaidi.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: ili azae juu ya magoti yangu
  rationale: Tafsiri ya karibu inahifadhi usemi wa kitamaduni wenye utata wa kiasi; tanbihi inaeleza kwamba huenda unahusu mtoto kupokewa kwa ishara kuwa wa Raheli.
- source_word: וְאִבָּנֶה
  choice: nami pia nijengwe
  rationale: Kitenzi hiki kwa maana ya moja kwa moja ni ‘kujengwa,’ lakini hapa ni sitiari ya kupata watoto au kuimarishwa kifamilia. Kuhifadhi ‘nijengwe’ kunadumisha sitiari ya Kiebrania.
- source_word: מִמֶּנָּה
  choice: kupitia kwake
  rationale: Kirai hiki kinamtaja Bilha kuwa njia ambayo Raheli anatarajia kupata watoto na kujengwa kifamilia.
- source_word: גַם אָנֹכִי
  choice: nami pia
  rationale: Huhifadhi msisitizo wa kwamba Raheli mwenyewe anatarajia kushiriki katika matokeo hayo licha ya kutokuwa na watoto.
theological_decisions:
- issue: Hadhi ya mtoto atakayezaliwa na Bilha
  choice: Usemi ‘azae juu ya magoti yangu’ umehifadhiwa, na desturi inayowezekana imeelezwa katika tanbihi bila kudai uhakika.
  alternative: Kutafsiri moja kwa moja kuwa mtoto huyo angehesabiwa kuwa wa Raheli.
  rationale: Matini inatumia usemi wa kitamaduni bila kufafanua kikamilifu utaratibu au hadhi ya mtoto; hivyo haifai kuondoa utata huo katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Nahau ya kujamiiana imetafsiriwa kwa lugha ya staha, huku sitiari na usemi wa kitamaduni wa Kiebrania vikihifadhiwa na kufafanuliwa kwa tanbihi.
