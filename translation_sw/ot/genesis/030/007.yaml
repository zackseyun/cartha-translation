  text: Bilha, mtumwa wa kike wa Raheli, akapata mimba tena, akamzalia Yakobo mwana wa pili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Kitenzi הרה humaanisha kupata mimba; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: עוֹד
  choice: tena
  rationale: Katika simulizi hili neno hili linaonyesha kurudiwa kwa tukio la kupata mimba.
- source_word: וַתֵּלֶד
  choice: akamzalia
  rationale: Kitenzi ילד pamoja na לְיַעֲקֹב kinaelezwa kwa kawaida kwa Kiswahili kuwa alimzalia Yakobo mtoto.
- source_word: שִׁפְחַת
  choice: mtumwa wa kike
  rationale: שִׁפְחָה humtaja mwanamke aliye katika hali ya utumwa au utumishi wa hadhi ya chini; tafsiri hii inaweka wazi hali yake ya kutokuwa huru.
- source_word: בֵּן שֵׁנִי
  choice: mwana wa pili
  rationale: Hii inafuata maana ya moja kwa moja ya kirai hicho na inasikika kiasili katika Kiswahili.
- source_word: לְיַעֲקֹב
  choice: akamzalia Yakobo
  rationale: Kihusishi לְ hapa huonyesha uhusiano wa uzazi; muundo wa Kiswahili unawasilisha maana ya kumzalia Yakobo mwana.
- source_word: בִּלְהָה ... רָחֵל
  choice: Bilha, mtumwa wa kike wa Raheli
  rationale: Muundo huu unahifadhi jina la Bilha mbele na kisha unamtambulisha kwa uhusiano na hadhi yake kwa Raheli.
