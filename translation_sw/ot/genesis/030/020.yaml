base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: sw
  text: Lea akasema, “Mungu amenizawadia zawadi njema. Wakati huu mume wangu ataniheshimu[a], kwa sababu nimemzalia wana sita.” Basi akamwita Zebuluni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ataishi nami” au “atakaa nami.” Kitenzi cha Kiebrania ni nadra na kinahusishwa kwa mchezo wa maneno na jina Zebuluni; huenda maana yake ikahusisha heshima na pia kuishi au kubaki pamoja na Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: amenizawadia zawadi njema
  rationale: Kauli hii ni ya asili na inayoeleweka katika Kiswahili, huku ikihifadhi urudiaji wa mzizi unaowakilisha mchezo wa maneno wa kitenzi na nomino katika Kiebrania.
- source_word: הַפַּעַם
  choice: Wakati huu
  rationale: Hutoa maana ya hatua hii mpya katika hali ya Lea bila kuongeza wazo lisilokuwamo katika matini.
- source_word: יִזְבְּלֵנִי
  choice: ataniheshimu
  rationale: Inafaa katika muktadha wa tumaini la Lea kwamba kuzaa wana sita kutabadili jinsi mume wake anavyomthamini; hata hivyo, kwa kuwa kitenzi cha Kiebrania ni nadra, maana nyingine imehifadhiwa katika tanbihi.
- source_word: אִישִׁי
  choice: mume wangu
  rationale: Hii ndiyo tafsiri ya kawaida na wazi katika muktadha wa ndoa.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: nimemzalia wana sita
  rationale: Muundo huu wa Kiswahili huhifadhi tendo la Lea na kiwakilishi cha yule aliyemzalia, yaani mume wake.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: Basi akamwita Zebuluni
  rationale: Ni namna ya asili ya Kiswahili ya kuwasilisha fomula ya Kiebrania ya kumpa mtoto jina.
- source_word: זְבֻלוּן
  choice: Zebuluni
  rationale: Hili ni umbo lililozoeleka la jina hili katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya kitenzi הנדירה יִזְבְּלֵנִי
  choice: ataniheshimu
  alternative: ataishi/atakaa nami
  rationale: Matini inaweza kueleza kupewa heshima au mume kukaa pamoja na Lea. Tafsiri kuu hufuata maana inayofaa tumaini lake la kuthaminiwa, lakini tanbihi huhifadhi uwezekano halisi wa maana ya kukaa pamoja naye na uhusiano wake na jina Zebuluni.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji katika “amenizawadia zawadi” umeachwa kwa makusudi ili kuakisi mchezo wa maneno wa Kiebrania, ingawa mchezo wa sauti unaohusisha jina Zebuluni hauwezi kuhifadhiwa kikamilifu.
