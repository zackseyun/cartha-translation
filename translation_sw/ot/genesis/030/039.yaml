  text: וַ/יֶּחֱמ֥וּ הַ/צֹּ֖אן אֶל הַ/מַּקְל֑וֹת וַ/תֵּלַ֣דְןָ הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/טְלֻאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: sw
  text: Basi, wanyama wa kundi wakapandana mbele ya zile fimbo, nao wakazaa watoto wenye milia[a], madoadoa[b], na mabaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye mikanda”; tafsiri nyingine za zamani hutumia maneno yenye maana ya alama za duara au mistari inayozunguka mwili.
    reason: lexical_alternative
  - marker: b
    text: Tofauti kamili kati ya “madoadoa” (נְקֻדִּים) na “mabaka” (טְלֻאִים) si hakika; neno la mwisho pia linaweza kutafsiriwa “wenye viraka” au “wenye madoa yasiyo sawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: wakapandana
  rationale: Katika muktadha wa uzalishaji wa wanyama, kitenzi hiki kinahusu kuingia katika joto la kupandana na tendo la kupandana; “wakapandana” ni wazi na cha kawaida katika Kiswahili.
- source_word: הַצֹּאן
  choice: wanyama wa kundi
  rationale: צאן ni jina la pamoja la mifugo midogo, hasa kondoo na mbuzi. “Wanyama wa kundi” huepuka kulifanya kuwa kundi la kondoo pekee na linafaa pamoja na kitenzi cha wingi.
- source_word: אֶל הַמַּקְלוֹת
  choice: mbele ya zile fimbo
  rationale: Ingawa אֶל kwa kawaida humaanisha “kuelekea/kwenda kwa,” katika mpangilio wa aya zinazozunguka inaonyesha mahali wanyama walipopandana huku fimbo zikiwa mbele yao.
- source_word: וַתֵּלַדְןָ
  choice: wakazaa watoto
  rationale: Kitenzi ילד humaanisha kuzaa. Neno “watoto” limeongezwa kwa uwazi kwa kuwa Kiebrania kinafuatisha kitenzi moja kwa moja na vivumishi vinavyoeleza watoto waliozaliwa.
- source_word: עֲקֻדִּים
  choice: wenye milia
  rationale: Neno linaeleza alama zinazofanana na mikanda au milia; “wenye milia” ni Kiswahili cha sasa na kinachoeleweka kwa urahisi.
- source_word: נְקֻדִּים
  choice: madoadoa
  rationale: Neno hili linaashiria alama ndogo kama nukta; “madoadoa” linatofautisha kwa kadiri inayowezekana alama hizi na mabaka ya neno linalofuata.
- source_word: וּטְלֻאִים
  choice: mabaka
  rationale: Neno hili linaelekea kueleza alama kubwa zaidi zisizo sawa, kama viraka au madoa mapana; “mabaka” linaonyesha tofauti hiyo bila kudai usahihi usiokuwapo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unarudia rejeo la wanyama kwa kiwakilishi “nao” badala ya kurudia kirai kizima, ili sentensi isikike kawaida bila kupoteza mtiririko wa Kiebrania. “Zile fimbo” huunganisha aya hii na fimbo zilizotajwa katika muktadha uliotangulia.
