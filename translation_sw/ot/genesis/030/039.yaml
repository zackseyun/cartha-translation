  source_fidelity: 'Tafsiri inawasilisha kwa uaminifu mtiririko wa Kiebrania: mifugo hupandana katika mpangilio wa fimbo, kisha huzaa watoto wenye aina tatu za alama. “Mbele ya zile fimbo” ni ufasiri wa muktadha unaokubalika kwa אֶל הַמַּקְלוֹת, bila kudai zaidi ya muktadha unavyoruhusu. “Wakapandana” hufikisha vizuri matumizi ya kiidiomu ya וַיֶּחֱמוּ katika muktadha wa uzazi wa wanyama.'
