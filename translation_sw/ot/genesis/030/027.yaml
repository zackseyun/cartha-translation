base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: sw
  text: Ndipo Labani akamwambia, “Kama nimepata kibali machoni pako, tafadhali baki[a]. Nimejua kwa njia ya ramli[b] kwamba Yahwe amenibariki kwa sababu yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “baki” halipo wazi katika Kiebrania, lakini linakamilisha ombi la Labani kulingana na muktadha.
    reason: ellipsis_supplied
  - marker: b
    text: Au, “Nimefanya uaguzi.” Kitenzi cha Kiebrania kinaweza kumaanisha kufanya uaguzi au kusoma ishara; wengine hukitafsiri “nimejua kwa uzoefu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו לָבָן
  choice: Ndipo Labani akamwambia
  rationale: Muundo huu unawakilisha mfululizo wa simulizi na unaonyesha kwa kawaida kwamba Labani alimwambia Yakobo.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Kama nimepata kibali machoni pako, tafadhali baki
  rationale: “Nimepata kibali machoni pako” huhifadhi taswira ya nahau ya Kiebrania. נָא hulainisha ombi, hivyo imetafsiriwa “tafadhali”; “baki” limeongezwa kutokana na muktadha kwa sababu ombi lenyewe limeachwa bila kutajwa wazi katika Kiebrania.
- source_word: נִחַשְׁתִּי
  choice: Nimegundua kwa kupiga ramli
  rationale: Kitenzi hiki katika piel kwa kawaida huhusu uaguzi au kutafuta ishara. Tafsiri hii inaonyesha kwamba Labani alifikia hitimisho lake kwa njia ya ramli bila kupunguza maana hiyo kuwa uzoefu wa kawaida tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וַיְבָרֲכֵנִי
  choice: amenibariki
  rationale: Kauli ya wakati timilifu inaonyesha tendo la baraka lililotokea na ambalo matokeo yake yanaonekana katika hali ya sasa ya Labani.
- source_word: בִּגְלָלֶךָ
  choice: kwa sababu yako
  rationale: Hii ni njia ya kawaida na wazi ya kuwasilisha maana ya sababu katika Kiswahili cha sasa.
- source_word: לָבָן
  choice: Labani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Njia ambayo Labani alipata ujuzi wake
  choice: kwa kupiga ramli
  alternative: kwa uzoefu
  rationale: Maana kuu ya נִחַשְׁתִּי hapa inahusu uaguzi au usomaji wa ishara. Tafsiri haihalalishi tendo hilo wala kulifanya dai la Mungu; inaripoti tu maneno ya Labani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau “kibali machoni pako” imehifadhi taswira ya Kiebrania, huku “tafadhali baki” ikifanya ombi lililodokezwa lieleweke kwa kawaida.
