base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: sw
  text: Akaweka fito alizokuwa amezimenya magome katika mifereji, katika hori za maji[a] ambako kundi lilikuja kunywa, mbele ya kundi hilo; nao wakapandana[b] walipokuja kunywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia maneno mawili yanayohusiana, “mifereji” na “hori za maji.” Huenda yote mawili yanafafanua kwa ukamilifu zaidi eneo lilelile la kunyweshea mifugo, wala si lazima yawe maeneo mawili tofauti.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakawa katika joto walipokuja kunywa.” Kitenzi cha Kiebrania kinaweza kueleza kwa halisi zaidi hali ya wanyama kuwa katika joto, huku kupandana kukidokezwa na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: Akaweka
  rationale: Kitenzi hiki humaanisha kuweka kitu mahali au katika nafasi fulani; “akaweka” ni cha kawaida na kinaendeleza simulizi.
- source_word: הַמַּקְלוֹת
  choice: fito
  rationale: Katika muktadha huu ni matawi au vijiti vilivyoandaliwa na Yakobo; “fito” linaonyesha vijiti virefu bila kudokeza fimbo za kutembelea.
- source_word: אֲשֶׁר פִּצֵּל
  choice: alizokuwa amemenya magome
  rationale: Yakobo alikuwa ameondoa sehemu za magome ili kuacha mistari myeupe ionekane; usemi huu unaeleza tendo hilo wazi na kwa Kiswahili cha kawaida.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: katika mifereji, ndani ya hori za maji
  rationale: Maneno mawili yanayohusiana yanaeleza eneo la kunyweshea mifugo. Tafsiri inadumisha maelezo hayo mawili bila kuyafanya kwa lazima kuwa maeneo mawili tofauti.
- source_word: הַצֹּאן
  choice: kundi
  rationale: Neno la Kiebrania ni jina la mkusanyiko wa mifugo midogo, yaani kondoo na mbuzi; “kundi” linahifadhi maana hiyo ya pamoja.
- source_word: לְנֹכַח הַצֹּאן
  choice: mbele ya kundi hilo
  rationale: Kirai kinaonyesha kwamba fito ziliwekwa moja kwa moja mbele ya wanyama; kurudia “kundi” kunafuata msisitizo wa chanzo na kuondoa utata wa kiwakilishi.
- source_word: וַיֵּחַמְנָה
  choice: wakapandana
  rationale: Kimsingi kitenzi kinaweza kueleza wanyama kuwa katika joto, lakini katika muktadha wa uzalishaji tendo la kupandana ndilo linalodokezwa. Mbadala wa karibu zaidi umehifadhiwa katika tanbihi.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: walipokuja kunywa
  rationale: Muundo huu unaonyesha wakati tendo lilipotokea; “walipokuja kunywa” ni wa asili na sahihi.
