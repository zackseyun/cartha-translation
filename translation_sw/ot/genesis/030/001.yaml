base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: sw
  text: Raheli alipoona kwamba hakumzalia Yakobo watoto[a], alimwonea wivu dada yake. Akamwambia Yakobo, “Nipe watoto, la sivyo nitakufa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana”; hapa limetafsiriwa “watoto” kwa sababu muktadha unahusu tamaa ya Raheli kupata uzao, si lazima watoto wa kiume pekee.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Raheli alipoona
  rationale: Muundo wa wakati unaunganisha alichotambua Raheli na mwitikio wake unaofuata, huku ukiendeleza simulizi kwa Kiswahili cha asili.
- source_word: כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: kwamba hakumzalia Yakobo watoto
  rationale: Kitenzi יָלַד kinapomhusu mwanamke humaanisha kuzaa; kiambishi cha mtendewa katika “hakumzalia” kinawakilisha uhusiano wa לְיַעֲקֹב kwa Kiswahili cha kawaida.
- source_word: וַתְּקַנֵּא ... בַּאֲחֹתָהּ
  choice: alimwonea wivu dada yake
  rationale: קנא katika muktadha huu ni kumwonea mtu wivu kwa sababu ya alicho nacho; usemi huu ni wa kawaida na unafaa kwa wivu wa Raheli kuhusu uzazi wa dada yake.
- source_word: הָבָה לִּי בָנִים
  choice: Nipe watoto
  rationale: בָנִים kwa umbo ni “wana,” lakini katika ombi hili la kupata uzao inarejelea watoto kwa ujumla; tanbihi inadumisha maana halisi ya neno.
- source_word: וְאִם אַיִן
  choice: la sivyo
  rationale: Nahau hii inaleta matokeo mbadala yenye uzito baada ya dai la Raheli; “la sivyo” hudumisha nguvu hiyo kwa Kiswahili cha asili.
- source_word: מֵתָה אָנֹכִי
  choice: nitakufa
  rationale: Kauli fupi na kali inadumisha hali ya kukata tamaa na matokeo yanayoonekana kuwa karibu bila kuifafanua kisaikolojia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina Raheli limetajwa mara moja katika kishazi cha kwanza, kisha viwakilishi vimetumiwa kwa mtiririko wa kawaida. Sentensi imegawanywa ili simulizi na usemi wa moja kwa moja visomeke kwa urahisi.
