base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: sw
  text: Ndipo Raheli akasema[a], “Nimepigana mieleka ya Mungu na dada yangu, nami pia nimeshinda.” Kwa hiyo akamwita Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Nimepigana mieleka ya Mungu.” Kirai hiki kinaweza pia kumaanisha “mieleka ya kimungu,” au, kwa namna ya kusisitiza, “mieleka mikubwa sana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: mieleka ya Mungu
  rationale: 'Hufuata kwa karibu muundo wa Kiebrania na kudumisha utata wake: unaweza kurejelea mieleka inayohusishwa na Mungu au, kwa matumizi ya kusisitiza, mieleka mikubwa sana. Pia huhifadhi taswira na mchezo wa maneno unaoelekea kwa jina Naftali.'
- source_word: נִפְתַּלְתִּי
  choice: nimepigana mieleka
  rationale: Kitenzi kinahusiana kimzizi na jina Naftali. Kiswahili hiki ni cha kawaida na huhifadhi taswira halisi ya kushindana badala ya kuifanya kuwa ‘nimehangaika’ tu.
- source_word: עִם אֲחֹתִי
  choice: na dada yangu
  rationale: ‘Na’ ndilo sawia la moja kwa moja la עִם; katika muktadha wa mieleka linaweza kueleweka kwa maana ya ushindani bila kulazimisha tafsiri ‘dhidi ya.’
- source_word: גַּם יָכֹלְתִּי
  choice: nami pia nimeshinda
  rationale: Katika muktadha huu יכל huonyesha kufanikiwa au kumudu katika ushindani. ‘Nimeshinda’ ni ya asili na wazi kwa msomaji wa sasa.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: Kwa hiyo akamwita jina lake Naftali
  rationale: Huhifadhi kwa kiwango kikubwa fomula ya Kiebrania ya kuita jina na kuunganisha kauli ya Raheli na jina la mtoto.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Ni umbo lililozoeleka katika Kiswahili la jina hili la Kiebrania na bado linaonyesha uhusiano wa sauti na maelezo yaliyotangulia kadiri inavyowezekana.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kirai נַפְתּוּלֵי אֱלֹהִים
  choice: ya Mungu katika maandishi, huku uwezekano wa maana ya kusisitiza ukielezwa katika tanbihi
  alternative: mieleka mikubwa sana / mieleka ya kimungu
  rationale: Kiebrania kina utata wa kweli. Tafsiri rasmi zaidi haiondoi rejeo linalowezekana kwa Mungu, na tanbihi inazuia wasomaji wasifikiri kuwa hiyo ndiyo maana pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa urahisi. ‘Kupigana mieleka’ ni usemi wa sasa na wazi; muundo ‘akamwita jina lake’ umehifadhiwa kwa sababu ya umuhimu wa fomula ya kutoa jina na mchezo wa maneno wa Kiebrania.
