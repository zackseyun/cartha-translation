  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: sw
  text: Lakini kundi lilipokuwa dhaifu[a], Yakobo hakuweka vijiti hivyo mbele yao[b]. Kwa hiyo, wanyama dhaifu wakawa wa Labani, na wenye nguvu[c] wakawa wa Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kutaja wanyama dhaifu au wasio na nguvu; wengine hulielewa kwa maana mahususi zaidi ya wanyama waliochelewa kupandana au walio duni.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hakuweka vijiti mbele ya wanyama hao, kama ilivyoelezwa katika mistari iliyotangulia.
    reason: cross_reference
  - marker: c
    text: Au, “wenye uimara” au “wenye afya na nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף
  choice: lilipokuwa dhaifu
  rationale: Muundo wenye ב na kitenzi-jina unaonyesha wakati au hali. ‘Dhaifu’ huhifadhi utofauti na wanyama wenye nguvu bila kulazimisha maana mahususi ya kuchelewa kuzaa au kupandana.
- source_word: הַצֹּאן
  choice: kundi
  rationale: צֹאן ni nomino ya jumla kwa mifugo midogo, hasa kondoo na mbuzi. ‘Kundi’ ni neno la kawaida na la asili katika muktadha huu wa ufugaji.
- source_word: לֹא יָשִׂים
  choice: hakuweka vijiti hivyo mbele yao
  rationale: שׂים humaanisha ‘kuweka.’ Ingawa kitu kinachowekwa hakitajwi moja kwa moja katika mstari huu, muktadha wa mistari iliyotangulia unaonyesha kuwa ni vijiti; ‘mbele yao’ huonyesha mahali vilipowekwa katika simulizi.
- source_word: וְהָיָה
  choice: Kwa hiyo ... wakawa
  rationale: 'Hapa muundo unaonyesha matokeo: mgawanyo wa wanyama dhaifu kwa Labani na wenye nguvu kwa Yakobo.'
- source_word: הָעֲטֻפִים
  choice: wanyama dhaifu
  rationale: Neno hili linatokana na mzizi uleule wa הַעֲטִיף na linawataja wanyama wasio na nguvu katika utofauti na kundi jingine.
- source_word: לְלָבָן
  choice: wa Labani
  rationale: Kiambishi ל kinaonyesha umiliki au mgao; ‘wa Labani’ ni usemi mfupi na wa kawaida wa Kiswahili.
- source_word: וְהַקְּשֻׁרִים
  choice: wenye nguvu
  rationale: Umbo hili si la kawaida, lakini katika muktadha linapinganishwa na wanyama dhaifu na hivyo linaeleweka kuwa wanyama imara au wenye nguvu.
- source_word: לְיַעֲקֹב
  choice: wa Yakobo
  rationale: Kama ilivyo kwa לְלָבָן, kiambishi ל kinaonyesha umiliki au mgao.
