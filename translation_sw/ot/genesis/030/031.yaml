  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: sw
  text: Akasema, “Nikupe nini?” Yakobo akasema, “Usinipe chochote. Ukinitendea jambo hili, nitarudi[a] kuchunga kundi lako na kulilinda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaanza tena kuchunga kundi lako na kulilinda.” Kitenzi cha Kiebrania kinaweza kuonyesha ama kurudi ama kuanza tena kazi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: Nikupe nini?
  rationale: Muundo wa kuuliza wenye kitenzi cha nafsi ya kwanza unaeleza swali la Labani kuhusu malipo atakayompa Yakobo; ‘Nikupe nini?’ ni wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: Usinipe chochote
  rationale: Kikanushi pamoja na kitenzi hapa kinaonyesha Yakobo anakataa malipo; amri hasi ya Kiswahili inaleta maana hiyo wazi na kwa lugha ya kawaida.
- source_word: מְאוּמָה
  choice: chochote
  rationale: Katika tungo hasi neno hili humaanisha ‘kitu chochote’; ‘chochote’ ni kifupi na cha asili katika Kiswahili.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Ukinitendea jambo hili
  rationale: Huhifadhi sharti pamoja na wazo la kumfanyia Yakobo jambo maalumu, bila kuligeuza waziwazi kuwa ombi au makubaliano.
- source_word: אָשׁוּבָה
  choice: nitarudi
  rationale: Kitenzi שׁוב kinaweza kumaanisha kurudi au kuanza tena kazi. ‘Nitarudi’ huhifadhi maana yake ya msingi, huku tanbihi ikieleza uwezekano wa ‘nitaendelea tena.’
- source_word: אֶרְעֶה
  choice: kuchunga
  rationale: רעה katika muktadha wa mifugo humaanisha kuitunza na kuilisha; ‘kuchunga’ ndilo neno la kawaida na pana la Kiswahili kwa kazi hiyo.
- source_word: צֹאנְךָ
  choice: kundi lako
  rationale: צֹאן ni jina la pamoja la mifugo midogo, hasa kondoo na mbuzi. ‘Kundi lako’ ni tafsiri fupi inayofaa katika muktadha, ingawa aina hizo mbili hazitajwi moja moja.
- source_word: אֶשְׁמֹר
  choice: kulilinda
  rationale: שׁמר hapa inaongeza wazo la kulitazama na kulihifadhi kundi dhidi ya hatari; ‘kulilinda’ linaonyesha jukumu hilo wazi.
