  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mazungumzo yamewekwa kwa lugha ya kawaida bila kuondoa urudiaji wa kisimulizi. Kiashiria [a] kimewekwa baada ya ‘nitarudi,’ mahali panapohusika moja kwa moja na utata wa kitenzi cha Kiebrania.
