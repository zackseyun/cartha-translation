  rationale: Kitenzi ילד humaanisha kuzaa. Muundo wa Kiswahili 'akamzalia Yakobo' huwasilisha kwa kawaida uhusiano unaoonyeshwa na kiambishi לְ.
- source_word: לְיַעֲקֹב
  choice: Yakobo
  rationale: לְ hapa huonyesha kwamba mtoto alizaliwa kwa ajili ya Yakobo au akiwa mwana wake; kiambishi cha utendea katika 'akamzalia' kinabeba maana hiyo bila kulazimisha usemi mzito.
- source_word: בֵּן
  choice: mwana wa kiume
  rationale: בֵּן ni mwana wa kiume. Kauli hii ni wazi na ya kawaida katika Kiswahili, huku ikitofautisha na maana pana ya 'mwana'.
