lexical_decisions:
- source_word: וַתַּהַר
  choice: Akachukua mimba
  rationale: Kitenzi הרה humaanisha kupata au kuchukua mimba; usemi huu ni wa kawaida katika Kiswahili na unadumisha mfuatano wa simulizi.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: ילד pamoja na בֵּן humaanisha kuzaa mwana wa kiume; “mwana” ni neno la heshima linalofaa mtindo wa simulizi la Biblia.
- source_word: וַתֹּאמֶר
  choice: akasema
  rationale: Huu ni mwendelezo wa kawaida wa simulizi, unaowasilishwa kwa kiambishi cha mfuatano “aka-”.
- source_word: אָסַף
  choice: ameondoa
  rationale: Katika muktadha huu אסף ina maana ya kuondoa; hali timilifu ya Kiswahili inaonyesha matokeo yanayoendelea ya tendo hilo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha Kiebrania kiko katika umoja, na muktadha unamtaja Mungu mmoja.
- source_word: חֶרְפָּתִי
  choice: aibu yangu
  rationale: חֶרְפָּה hujumuisha aibu, fedheha, au shutuma ya kijamii. “Aibu yangu” ni ya kawaida na inayoeleweka, huku ikidumisha uzito wa kijamii wa hali hiyo.
theological_decisions:
- issue: Maana ya umoja ya אֱלֹהִים
  choice: Mungu
  alternative: miungu
  rationale: Upatanisho na kitenzi cha umoja אָסַף pamoja na muktadha unahitaji rejeo la umoja; hakuna upanuzi wa kiteolojia unaohitajika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “aka-” unadumisha mfululizo wa matendo katika simulizi. “Aibu” ni ya kawaida zaidi kuliko “fedheha” au “shutumu” na inafaa katika usemi wa moja kwa moja.
