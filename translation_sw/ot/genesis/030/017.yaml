lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: akamsikiliza
  rationale: Muundo wa שׁמע pamoja na אֶל hapa unaonyesha kusikiliza kwa makini na kuitikia, si kusikia sauti tu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika simulizi hili neno hili linamtaja Mungu mmoja wa kweli.
- source_word: לֵאָה
  choice: Lea
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Kiswahili.
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Ni usemi wa kawaida na ulio wazi katika Kiswahili cha sasa kwa maana ya kushika mimba.
- source_word: וַתֵּלֶד לְיַעֲקֹב
  choice: akamzalia Yakobo
  rationale: Muundo huu wa Kiswahili unawakilisha kwa kawaida kitenzi ילד pamoja na yambwa isiyo ya moja kwa moja yenye ל.
- source_word: בֵּן חֲמִישִׁי
  choice: mwana wa tano
  rationale: Huhifadhi maana ya mwana wa kiume na nafasi yake ya tano katika mfululizo unaozungumziwa.
theological_decisions:
- issue: Itikio la Mungu linalodokezwa na שׁמע אֶל
  choice: Mungu akamsikiliza Lea
  alternative: Mungu akamsikia Lea
  rationale: “Akamsikiliza” huonyesha usikivu wenye kuitikia unaodokezwa na nahau ya Kiebrania, bila kuongeza maelezo ya kitheolojia yasiyosemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya nuktamkato baada ya tanbihi inatenganisha kwa uwazi itikio la Mungu na matokeo yaliyofuata.
