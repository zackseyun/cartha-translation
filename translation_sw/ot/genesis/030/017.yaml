  text: Mungu akamsikiliza Lea[a]; naye akapata mimba, akamzalia Yakobo mwana wa tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu akamsikia Lea.”
