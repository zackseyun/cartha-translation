revisions:
- from: Lakini Lea akamwambia, “Je, ni jambo dogo kwamba umemchukua mume wangu, hata sasa unataka kuchukua pia tunguja za mwanangu?” Raheli akasema, “Basi, atalala nawe usiku huu kwa kubadilishana na tunguja za mwanao.”
  to: Lakini Lea akamwambia, “Je, ni jambo dogo kwamba umemchukua mume wangu, na je, utachukua pia tunguja za mwanangu?” Raheli akasema, “Basi, atalala nawe usiku huu kwa kubadilishana na tunguja za mwanao.”
  rationale: The revision removes the unsupported temporal adverb “sasa” and restores the Hebrew's parallel rhetorical-question structure. It otherwise retains the draft's accurate names, natural Swahili register, euphemistic “atalala nawe,” and established rendering “tunguja.”
  reviewer_model: gpt-5.6-terra
