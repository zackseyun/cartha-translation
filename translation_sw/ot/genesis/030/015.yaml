base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: sw
  text: Lakini Lea akamwambia, “Je, ni jambo dogo kwamba umemchukua mume wangu, na je, utachukua pia tunguja za mwanangu?” Raheli akasema, “Basi, atalala nawe usiku huu kwa kubadilishana na tunguja za mwanao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: Je, ni jambo dogo
  rationale: Huhifadhi swali la kejeli la Kiebrania kwa Kiswahili cha kawaida na chenye uzito.
- source_word: קַחְתֵּךְ אֶת אִישִׁי
  choice: umemchukua mume wangu
  rationale: Kitenzi 'chukua' kinadumisha nguvu ya lawama katika chanzo bila kufafanua zaidi aina ya kuchukuliwa.
- source_word: דּוּדָאֵי
  choice: tunguja
  rationale: Ni jina la Kiswahili linalotumiwa kwa mandrake, mmea unaorejelewa katika muktadha huu.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: atalala nawe
  rationale: Huhifadhi usemi wa chanzo, ambao katika muktadha una maana ya mahusiano ya ndoa, bila kuufanya wazi zaidi kuliko Kiebrania.
- source_word: תַּחַת
  choice: kwa kubadilishana na
  rationale: Katika muamala huu neno linaonyesha badilishano au malipo badala ya tunguja.
theological_decisions:
- issue: Maana ya 'atalala nawe'
  choice: Kudumisha usemi 'atalala nawe'
  alternative: atafanya mapenzi nawe
  rationale: Chanzo kinatumia usemi wa kulala pamoja; tafsiri iliyochaguliwa huhifadhi staha na kiwango chake cha uwazi bila kuficha maana ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina Lea na Raheli yamewekwa wazi ili kuondoa utata wa viwakilishi unaoweza kutokea katika mstari uliotengwa, huku mazungumzo na lawama ya Lea vikihifadhiwa.
