base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: sw
  text: Yakobo alipokuja kutoka shambani jioni, Lea akatoka kumlaki, akasema, “Lazima uje kwangu, kwa maana nimekuajiri kwa dudaimu za mwanangu.”[a] Basi akalala naye usiku huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana hakika nimekuajiri kwa dudaimu za mwanangu.” Muundo wa Kiebrania unaweza kusisitiza dai la Lea, nao unaunganisha kuajiri huko na dudaimu kuwa bei au njia ya makubaliano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  choice: aliporudi kutoka shambani
  rationale: Ingawa בוא kimsingi ni ‘kuja/kuingia,’ katika muktadha huu Yakobo anatoka shambani na kurudi mahali familia ilipo; ‘aliporudi’ ni Kiswahili cha kawaida kinachoonyesha mwendo huo bila kuongeza mahali pasipotajwa.
- source_word: בָּעֶרֶב
  choice: jioni
  rationale: Ni tafsiri fupi na ya kawaida ya kirai cha wakati.
- source_word: לִקְרָאתוֹ
  choice: kwenda kumlaki
  rationale: ‘Kumlaki’ huonyesha Lea alitoka akielekea kwa Yakobo ili kukutana naye.
- source_word: אֵלַי תָּבוֹא
  choice: Lazima uje kwangu
  rationale: Kauli hii ni dai la moja kwa moja na lenye msisitizo; ‘uje kwangu’ inadumisha staha na maana ya kimuktadha bila kuwa chafu.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: nimekuajiri
  rationale: Mzizi unaorudiwa unaonyesha tendo la kuajiri kwa malipo na unaweza pia kuleta msisitizo. Kiswahili hiki ni cha asili; uwezekano wa msisitizo umeelezwa katika tanbihi.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: kwa dudaimu za mwanangu
  rationale: ב hapa inaonyesha njia au bei ya makubaliano. ‘Kwa’ huhifadhi uhusiano huo bila kufafanua kupita kiasi; ‘dudaimu’ ni jina la kimapokeo la mmea unaokusudiwa.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: akalala naye
  rationale: Hii inadumisha tamathali ya staha ya Kiebrania kuhusu mahusiano ya kingono na ni kauli inayoeleweka katika Kiswahili.
- source_word: בַּלַּיְלָה הוּא
  choice: usiku huo
  rationale: Ni namna ya kawaida ya Kiswahili ya kuwasilisha kirai hiki cha wakati.
