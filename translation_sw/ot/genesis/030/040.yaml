base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: sw
  text: Yakobo akawatenga wana-kondoo, akawafanya kondoo waelekee wale wenye milia[a] na wote wenye rangi ya giza[b] katika kundi la Labani.[c] Kisha akajiwekea makundi tofauti, wala hakuyatia pamoja na kundi la Labani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye mikanda”; neno la Kiebrania hueleza wanyama wenye alama kama mikanda au milia.
    reason: lexical_alternative
  - marker: b
    text: Au “wote wenye rangi ya kahawia.”
    reason: lexical_alternative
  - marker: c
    text: Inawezekana pia kutafsiri “kutoka katika kundi la Labani.”
    reason: source_ambiguity
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: wana-kondoo
  rationale: Neno כְּשָׂבִים kwa kawaida humaanisha wana-kondoo au kondoo wachanga; “wana-kondoo” ni mahususi na la kawaida katika Kiswahili.
- source_word: הִפְרִיד
  choice: akawatenga
  rationale: Hifili ya פרד humaanisha kutenga au kugawanya; “akawatenga” linaonyesha wazi tendo la kuwaondoa katika kundi jingine.
- source_word: פְּנֵי הַצֹּאן
  choice: akawafanya kondoo waelekee
  rationale: Ingawa Kiebrania kinasema kihalisi “nyuso za kundi,” maana ya usemi huo ni kuwaelekeza wanyama upande fulani. Tafsiri hii ni ya asili kwa Kiswahili huku ikihifadhi tendo hilo.
- source_word: עָקֹד
  choice: wenye milia
  rationale: עָקֹד hueleza wanyama wenye alama kama mikanda au mistari; “wenye milia” ni wazi na ya kawaida.
- source_word: כָל חוּם
  choice: wote wenye rangi nyeusi
  rationale: חוּם huonyesha rangi nyeusi au ya kahawia. “Rangi nyeusi” hapa inaepuka kuifanya rangi hiyo kuwa kahawia pekee, huku uwezekano huo ukibainishwa katika tanbihi.
- source_word: בְּצֹאן לָבָן
  choice: katika kundi la Labani
  rationale: Maana ya kawaida ya בְּ hapa ni ya mahali, yaani wanyama waliokuwa ndani ya kundi la Labani. Uwezekano wa kuielewa kama “kutoka katika” umehifadhiwa katika tanbihi.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: Kisha akajiwekea makundi yake kando
  rationale: Kifungu hiki kinaunganisha wazo la kuyaweka makundi kwa ajili yake mwenyewe na kuyatenga; Kiswahili hiki kinatoa maana zote mbili kwa uwazi.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: wala hakuyatia pamoja na kundi la Labani
  rationale: Kiambishi cha yambwa kinarejelea makundi yaliyotengwa, na עַל hapa huonyesha uhusiano au kuwekwa pamoja na kundi la Labani.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Usemi halisi “nyuso za kundi” umewekwa kwa Kiswahili cha kawaida kama “akawafanya kondoo waelekee.” Utata wa rangi חוּם na wa kihusishi בְּ umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
