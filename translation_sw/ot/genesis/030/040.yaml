  terminology: Majina Yakobo na Labani, pamoja na “wana-kondoo” na “wenye milia,” yanafaa. “Wenye rangi ya giza” huhifadhi vizuri zaidi upana wa חוּם kuliko “wenye rangi nyeusi”; tanbihi inaweza kubakiza “kahawia” kama uwezekano wa kileksia.
