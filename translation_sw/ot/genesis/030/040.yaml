  source_fidelity: 'Tafsiri inafuata kwa karibu muundo na maana ya Kiebrania: Yakobo anawatenga wana-kondoo, anaelekeza kundi kuelekea wanyama wenye milia na wenye rangi ya giza, kisha anatenga makundi yake na kundi la Labani. Hata hivyo, “rangi nyeusi” huelekea kumaanisha black pekee, ilhali חוּם ina uwanja mpana wa rangi ya giza au kahawia.'
