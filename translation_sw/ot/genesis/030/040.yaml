    rationale: Kifungu וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ kinaweka mbele tendo la kuyaweka makundi peke yake kwa ajili ya Yakobo. Marekebisho madogo huifanya maana hiyo iwe wazi zaidi.
  - severity: low
    issue: Tanbihi a ina “mistari ya madoa,” ambayo si mbadala wa karibu zaidi wa “milia.”
    rationale: עָקֹד hurejelea alama za mikanda, pete, au milia; “wenye mikanda” ni mbadala wa Kiswahili ulio wazi zaidi.
