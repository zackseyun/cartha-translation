  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: sw
  text: Ndipo Lea akasema, “Nina furaha![a] Kwa maana wanawake wataniita mwenye furaha.” Basi akamwita Asheri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Asheri linahusiana kimatamshi na maneno ya Kiebrania yanayomaanisha “furaha” na “kuita mwenye furaha” katika kauli ya Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: Nina furaha!
  rationale: Kauli ya mshangao inaonyesha furaha ya Lea kwa Kiswahili cha kawaida na kuhifadhi kiambishi cha nafsi ya kwanza.
- source_word: אִשְּׁרוּנִי
  choice: wataniita mwenye furaha
  rationale: Kitenzi katika Piel humaanisha kumtangaza au kumwita mtu mwenye furaha; tafsiri hii pia hudumisha uhusiano wa kimatamshi na jina Asheri kadiri Kiswahili kinavyoruhusu.
- source_word: בָּנוֹת
  choice: wanawake
  rationale: Ingawa maana ya msingi ni “binti,” hapa wingi huo unatumiwa kwa maana pana ya wanawake; “wanawake” ni tafsiri ya asili na iliyo wazi katika muktadha.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: Basi akamwita jina lake Asheri
  rationale: Inafuata kwa karibu fomula ya Kiebrania ya kutoa jina huku ikibaki yenye kueleweka kwa Kiswahili.
- source_word: אָשֵׁר
  choice: Asheri
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa; tanbihi inaeleza maana na mchezo wa maneno.
