base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: sw
  text: Wakati wa mavuno ya ngano, Reubeni alienda akapata tunguja[a] shambani, akazileta kwa Lea, mama yake. Ndipo Raheli akamwambia Lea, “Tafadhali nipe baadhi ya tunguja za mwanao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “matunda ya mapenzi”; neno la Kiebrania דּוּדָאִים linataja mmea ambao kimapokeo hutambuliwa kuwa tunguja (mandrake), na katika simulizi linalozunguka mstari huu unahusishwa na uzazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: Wakati wa mavuno ya ngano
  rationale: Kirai hiki kinaonyesha majira ya mavuno ya ngano. “Wakati wa” ni Kiswahili cha kawaida na cha asili kuliko kuiga moja kwa moja nahau ya Kiebrania “katika siku za.”
- source_word: וַיֵּלֶךְ
  choice: alienda
  rationale: Kitenzi הלך hapa kinaendeleza simulizi kwa maana rahisi ya kwenda; maandishi hayasemi wazi kwamba alitoka nje.
- source_word: דּוּדָאִים
  choice: tunguja
  rationale: “Tunguja” ni jina lililozoeleka katika tafsiri za Biblia za Kiswahili kwa mmea unaotambuliwa kimapokeo kuwa mandrake. Kwa kuwa utambulisho wake wa kibotania si hakika kabisa, maelezo ya chini yanahifadhi uwezekano huo.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: שָׂדֶה hapa ni shamba au eneo la mashambani; “shambani” ni tafsiri fupi na ya kawaida katika mazingira haya ya kilimo.
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: akamletea Lea mama yake
  rationale: Hiphili ya בוא ina maana ya kuleta. “Akamletea” huwasilisha kwa kawaida kwamba Reubeni alileta mimea hiyo kwa Lea, ambaye anatambulishwa kuwa mama yake.
- source_word: תְּנִי נָא לִי
  choice: Tafadhali nipe
  rationale: Chembe נָא huonyesha ombi au usisitizo wa heshima; “tafadhali” huiwasilisha kwa Kiswahili cha sasa.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: baadhi ya tunguja za mwanao
  rationale: מִן ina maana ya sehemu ya jumla hapa, hivyo “baadhi ya” ni ya asili kuliko tafsiri ya moja kwa moja “kutoka katika.” Umilikaji wa tunguja hizo kwa mwana wa Lea umehifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo wa vitenzi unaendeleza mfululizo wa matukio kwa urahisi bila kuiga sintaksia ya Kiebrania kwa namna ngumu. Alama ya tanbihi imewekwa baada ya “tunguja,” kwa kuwa tanbihi inahusu דּוּדָאִים, si mavuno ya ngano.
