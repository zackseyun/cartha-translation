base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: sw
  text: Nipe wake zangu na watoto wangu, ambao nimekutumikia kwa ajili yao[a], ili niende; kwa maana wewe unajua utumishi wangu niliokutumikia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao kwa ajili yao nimekutumikia,” kwa kuelekeza urejeo hasa kwa wake waliotajwa, badala ya familia yote.
    reason: lexical_alternative
  - marker: b
    text: “Utumishi” pia unaweza kutafsiriwa “kazi” au “taabu.” Tafsiri hii imetumia “utumishi” ili kuonyesha urudiaji wa mzizi uleule wa Kiebrania unaomaanisha kutumikia au kufanya kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: Nipe
  rationale: Kauli ya amri ya נתן ikielekezwa kwa Labani; kiambishi -pe kinaonyesha kwa kawaida na kwa uwazi maana ya ‘nipe.’
- source_word: נָשַׁי
  choice: wake zangu
  rationale: Wingi wenye kiambishi cha nafsi ya kwanza kutoka אִשָּׁה; katika muktadha huu ni wake wa Yakobo.
- source_word: יְלָדַי
  choice: watoto wangu
  rationale: Neno la kawaida la kifamilia linalotokana na ילד; ‘watoto wangu’ ni Kiswahili cha kawaida na sahihi katika muktadha.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָהֵן
  choice: ambao nimekutumikia kwa ajili yao
  rationale: Kirai husika kinaunganishwa na waliotajwa, huku בָהֵן ya kike ikiweza kuelekeza hasa kwa wake; ‘kwa ajili yao’ huhifadhi msingi au sababu ya utumishi bila kuufanya urejeo huo kuwa finyu kupita kiasi.
- source_word: וְאֵלֵכָה
  choice: nami nitaondoka
  rationale: Cohortative ya הלך inaonyesha nia ya Yakobo kuondoka; ‘nitaondoka’ ni ya asili katika ombi hili na huonyesha kuondoka mahali, si kutembea tu.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza sababu ya ombi kwa lugha ya kawaida yenye hadhi.
- source_word: יָדַעְתָּ
  choice: wewe unajua
  rationale: Wakati timilifu wa Kiebrania una umuhimu wa sasa; kiwakilishi ‘wewe’ kinatunza msisitizo unaotokana na אַתָּה.
- source_word: עֲבֹדָתִי
  choice: utumishi
  rationale: Nomino kutoka mzizi עבד; ‘utumishi’ huhifadhi uhusiano wa kileksia na kitenzi kinachofuata.
- source_word: אֲשֶׁר עֲבַדְתִּיךָ
  choice: niliokutumikia
  rationale: Huhifadhi urudiaji wa mzizi עבד kwa kutumia ‘utumishi’ na ‘kutumikia,’ huku ikibaki Kiswahili kinachoeleweka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘utumishi niliokutumikia’ ni wa makusudi ili kuhifadhi urudiaji wa mzizi wa Kiebrania, ingawa ni rasmi kidogo. Alama zote za tanbihi zimewekwa katika matini.
