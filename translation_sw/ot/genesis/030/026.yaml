review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the family terms, the explanatory כי, and the repeated עבד wordplay. However, “nami nitaondoka” is a simple future statement, whereas וְאֵלֵכָה is cohortative and expresses Jacob’s intended/requested departure. The possessive sense of עֲבֹדָתִי (“my service”) should also be represented explicitly.
  naturalness: The wording is generally clear, formal, and natural Standard East African Swahili. “ili niende” is a more idiomatic and source-faithful way to express the requested purpose than “nami nitaondoka.” “Utumishi wangu niliokutumikia” is deliberately formal but acceptable and preserves the Hebrew repetition.
  terminology: “Wake zangu,” “watoto wangu,” “kutumikia,” and “utumishi” are suitable. Retaining “utumishi” / “kutumikia” appropriately reflects the repeated Hebrew root עבד without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: The cohortative וְאֵלֵכָה is rendered as the indicative future “nami nitaondoka.”
    rationale: The Hebrew expresses Jacob’s volitional aim following his request. “ili niende” retains this nuance without adding a separate future assertion.
  - severity: low
    issue: The possessive suffix in עֲבֹדָתִי is not explicit in “utumishi niliokutumikia.”
    rationale: “Utumishi wangu” directly represents “my service” and makes Jacob’s claim clearer.
  - severity: low
    issue: Footnote a’s proposed alternative “ili niwapate” adds an acquisition nuance not directly stated in the Hebrew.
    rationale: The note should instead describe the possible narrower antecedent of בָהֵן—especially the wives—without introducing extra interpretation.
  revised_text: Nipe wake zangu na watoto wangu, ambao nimekutumikia kwa ajili yao[a], ili niende; kwa maana wewe unajua utumishi wangu niliokutumikia[b].
  revised_footnotes:
  - marker: a
    text: Au, “ambao kwa ajili yao nimekutumikia,” kwa kuelekeza urejeo hasa kwa wake waliotajwa, badala ya familia yote.
    reason: lexical_alternative
  - marker: b
    text: “Utumishi” pia unaweza kutafsiriwa “kazi” au “taabu.” Tafsiri hii imetumia “utumishi” ili kuonyesha urudiaji wa mzizi uleule wa Kiebrania unaomaanisha kutumikia au kufanya kazi.
    reason: lexical_alternative
  revision_rationale: Revision replaces the indicative future with a purposive/cohortative-equivalent expression, explicitly renders the possessive “my service,” and adjusts footnote a so that it reflects the source’s referential ambiguity without adding the idea of obtaining the wives.
