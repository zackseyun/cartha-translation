base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: sw
  text: Ndipo Raheli akasema, “Mungu ameamua kesi yangu, na pia ameisikia sauti yangu na amenipa mwana wa kiume.” Kwa hiyo akamwita Dani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Dani linahusiana na kitenzi cha Kiebrania kinachomaanisha “kuhukumu” au “kuamua kesi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּנַנִּי
  choice: ameamua kesi yangu
  rationale: Kitenzi cha Kiebrania kina maana ya kimahakama na kina kiambishi cha nafsi ya kwanza umoja. Usemi huu unaonyesha kwamba Mungu ametoa uamuzi kuhusu hali ya Raheli, bila kuongeza wazo lenye nguvu zaidi la ‘kumthibitisha kuwa mwenye haki.’
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi kisarufi, kitenzi chake ni cha umoja na katika simulizi kinamrejelea Mungu mmoja.
- source_word: שָׁמַע בְּקֹלִי
  choice: ameisikia sauti yangu
  rationale: Tafsiri hii inahifadhi usemi wa Kiebrania unaotaja ‘sauti yangu’ na bado ni wa kawaida na unaoeleweka katika Kiswahili.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: na kunipa mwana
  rationale: Inawasilisha moja kwa moja tendo la Mungu la kumpa Raheli mwana wa kiume; ‘mwana’ huhifadhi umahususi wa בֵּן.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachoonyesha kuwa jina lililotolewa linatokana na maelezo yaliyotangulia.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: akamwita jina Dani
  rationale: Usemi huu ni wa asili katika Kiswahili na unahifadhi kitendo cha kumpa mtoto jina lililofafanuliwa na kauli ya Raheli.
- source_word: דָּן
  choice: Dani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili; uhusiano wake na kitenzi cha Kiebrania unaelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya kauli ya Raheli kuhusu tendo la Mungu la kimahakama
  choice: Mungu ameamua kesi yangu
  alternative: Mungu amenihukumu; Mungu amenitendea haki
  rationale: ‘Ameamua kesi yangu’ huhifadhi taswira ya kimahakama na uwezekano wa tendo lililomnufaisha Raheli, bila kuifanya kauli kuwa fundisho mahususi la kuhesabiwa haki au kuthibitishwa kuwa mwenye haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo ‘ameamua kesi yangu’ umechaguliwa ili kudumisha lugha ya kimahakama na mchezo wa maneno wa Kiebrania, ambao umefafanuliwa kwa tanbihi.
