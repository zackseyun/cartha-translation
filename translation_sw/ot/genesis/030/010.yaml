lexical_decisions:
- source_word: וַתֵּלֶד
  choice: akamzalia
  rationale: Kitenzi cha simulizi kinaendeleza mfuatano wa matukio; muundo “akamzalia Yakobo” unaonyesha kwa kawaida kwamba Yakobo ndiye baba wa mtoto.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: שִׁפְחַת
  choice: mtumishi wa kike
  rationale: Neno la Kiebrania humaanisha mtumishi mwanamke mwenye hadhi ya chini katika nyumba. Tafsiri hii ni ya sasa, inaonyesha jinsia, na haiongezi dhana kuhusu umri wake.
- source_word: לֵאָה
  choice: wa Lea
  rationale: Uhusiano wa umilikaji katika muundo wa Kiebrania umetafsiriwa kwa muundo wa kawaida wa Kiswahili.
- source_word: לְיַעֲקֹב
  choice: Yakobo (katika “akamzalia Yakobo”)
  rationale: 'Kihusishi kinaonyesha baba au mnufaika; Kiswahili cha kawaida hutumia kiambishi cha yambwa pamoja na jina: “akamzalia Yakobo.”'
- source_word: בֵּן
  choice: mwana
  rationale: Katika muktadha huu neno linamaanisha mtoto wa kiume; “mwana” ni la kawaida na lenye hadhi katika simulizi la Biblia.
