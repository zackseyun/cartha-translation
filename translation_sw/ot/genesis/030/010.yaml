  text: Zilpa[a], mtumishi wa kike wa Lea, akamzalia Yakobo mwana wa kiume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kijakazi.” Neno la Kiebrania שִׁפְחָה humaanisha mtumishi mwanamke wa nyumbani mwenye hadhi ya chini.
