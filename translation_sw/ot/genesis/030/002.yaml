base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: sw
  text: Ndipo Yakobo akamkasirikia Raheli, akasema[a], “Je, mimi ninachukua nafasi ya Mungu, ambaye amekunyima uzao wa tumbo lako[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “hasira ya Yakobo iliwaka dhidi ya Raheli.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “tunda la tumbo,” nahau inayomaanisha watoto au uzao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: akamkasirikia
  rationale: Nahau ya Kiebrania inaonyesha hasira iliyowaka; kitenzi hiki ni cha asili katika Kiswahili cha sasa na kinahifadhi nguvu ya usemi bila tafsiri ngumu ya neno kwa neno.
- source_word: בְּרָחֵל
  choice: Raheli
  rationale: Kiambishi cha yambwa katika ‘akamkasirikia Raheli’ kinaonyesha wazi kuwa Raheli ndiye aliyeelekezewa hasira.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: Je, mimi niko mahali pa Mungu
  rationale: תחת hapa hueleza kuchukua nafasi au mamlaka ya mwingine, si kuwa chini yake; usemi huu unahifadhi swali la Yakobo na maana yake.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Muktadha na kitenzi cha umoja vinaonyesha kuwa neno hili linamtaja Mungu mmoja.
- source_word: אֲשֶׁר מָנַע
  choice: ambaye amekunyima
  rationale: Kauli hii inamtaja Mungu kuwa ndiye aliyemzuia Raheli kupata uzao, huku wakati timilifu ukionyesha hali yenye matokeo yanayoendelea.
- source_word: מִמֵּךְ
  choice: amekunyima
  rationale: Kiambishi ‘-ku-’ pamoja na kitenzi ‘nyima’ huwasilisha kwa kawaida dhana ya kuondolewa au kutopatiwa kitu.
- source_word: פְּרִי בָטֶן
  choice: uzao wa tumbo
  rationale: Hifadhi ya picha ya tumbo la uzazi na maana ya watoto au kizazi, kwa Kiswahili kinachoeleweka na chenye hadhi.
theological_decisions:
- issue: Utendaji wa Mungu katika kutopata watoto
  choice: Yakobo anasema kwamba Mungu ndiye aliyemnyima Raheli uzao wa tumbo.
  alternative: Kulichukulia tamko hilo kuwa swali la balagha tu lisilothibitisha utendaji wa Mungu.
  rationale: Kishazi אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן kinamtambulisha Mungu moja kwa moja kuwa aliyemnyima Raheli uzao; tafsiri haipunguzi wala kuongeza dai hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Uzao wa tumbo’ huhifadhi sitiari ya Kiebrania huku tanbihi ikitoa umbo lake halisi zaidi.
