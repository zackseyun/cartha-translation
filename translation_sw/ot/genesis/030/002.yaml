    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “hasira ya Yakobo iliwaka dhidi ya Raheli.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “tunda la tumbo,” nahau inayomaanisha watoto au uzao.'
    reason: lexical_alternative
  revision_rationale: 'Marekebisho haya yanahifadhi maana ya Kiebrania kwa usahihi zaidi na kuboresha Kiswahili cha sasa: Yakobo anakataa kuchukua nafasi ya Mungu, na Mungu anatajwa wazi kuwa ndiye aliyemnyima Raheli uzao wa tumbo lake. Tanbihi zinaendelea kuonyesha nahau ya Kiebrania bila kuongeza tafsiri ya kiteolojia.'
