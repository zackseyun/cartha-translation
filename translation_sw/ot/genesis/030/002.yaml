review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Jacob’s anger toward Rachel, his denial of occupying God’s role, and his attribution of Rachel’s childlessness to God’s withholding. The phrase “uzao wa tumbo” lacks the possessive relationship conveyed by מִמֵּךְ in this context and is less idiomatic without “lako.”
  naturalness: “Akamkasirikia Raheli” is natural Standard East African Swahili. “Je, mimi niko mahali pa Mungu?” is understandable, but “Je, mimi ninachukua nafasi ya Mungu?” more naturally expresses the Hebrew idiom of substitution or prerogative rather than physical location.
  terminology: Use “uzao wa tumbo lako” for פְּרִי בָטֶן. It retains the biblical bodily metaphor while making clear that the withheld offspring are Rachel’s. “Mungu” and the divine-agency clause are appropriate.
  issues:
  - severity: medium
    issue: The expression “uzao wa tumbo” omits “lako.”
    rationale: The Hebrew says that God withheld “fruit of the womb” from Rachel. In Swahili, adding “lako” makes the referent explicit and produces a more complete, idiomatic possessive expression.
  - severity: low
    issue: “Niko mahali pa Mungu” can be heard spatially.
    rationale: The Hebrew תחת expresses being in God’s place or exercising God’s prerogative. “Ninachukua nafasi ya Mungu” communicates this role/substitution sense naturally in modern Swahili.
  revised_text: Ndipo Yakobo akamkasirikia Raheli, akasema[a], “Je, mimi ninachukua nafasi ya Mungu, ambaye amekunyima uzao wa tumbo lako[b]?”
  revised_footnotes:
