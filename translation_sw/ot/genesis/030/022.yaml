  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: sw
  text: Kisha Mungu akamkumbuka Raheli[a], akamsikiliza[b], na akalifungua tumbo lake la uzazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwangalia Raheli kwa fadhili” au “akamjali Raheli.” Katika Kiebrania, “kukumbuka” hapa ni nahau ya kibiblia inayomaanisha kwamba Mungu alimwelekezea mtu uangalifu wake kwa fadhili na akachukua hatua, si kwamba alikuwa amemsahau.
    reason: lexical_alternative
  - marker: b
    text: Au, “akamsikia.” Kitenzi cha Kiebrania kinaweza kudokeza kusikia kwa makini au kuitikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: akamkumbuka
  rationale: Neno זכר hapa ni nahau ya kibiblia inayoonyesha kwamba Mungu alimwelekezea Raheli fikira kwa fadhili na akachukua hatua; tafsiri ya moja kwa moja inadumisha nahau hiyo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Vitenzi vya umoja vinaonyesha wazi kwamba neno hili linamtaja Mungu mmoja.
- source_word: אֶת רָחֵל
  choice: Raheli
  rationale: אֶת ni kiashiria cha yambwa tendwa, na jina רָחֵל limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: akamsikiliza
  rationale: שׁמע pamoja na אֶל huonyesha kusikiliza kwa makini au kwa nia ya kuitikia; ‘akamsikiliza’ huhifadhi maana hiyo bila kuongeza kwa wazi kwamba alijibu ombi.
- source_word: וַיִּפְתַּח
  choice: akaufungua
  rationale: פתח humaanisha ‘kufungua’; kitenzi halisi kimehifadhiwa ili kudumisha taswira ya Kiebrania.
- source_word: רַחְמָהּ
  choice: tumbo lake la uzazi
  rationale: רֶחֶם ni tumbo la uzazi. Usemi ‘akaufungua tumbo lake la uzazi’ huhifadhi nahau ya Kiebrania badala ya kuifafanua kuwa alimpa uwezo wa kupata mimba.
- source_word: וַ
  choice: Kisha / na
  rationale: Viunganishi hivi vinaendeleza mfululizo wa masimulizi; ‘Kisha’ mwanzoni ni ya kawaida katika Kiswahili cha sasa, huku ‘na’ ikidumisha uhusiano wa kishazi kinachofuata.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kuwa ‘alimkumbuka’ Raheli
  choice: Kudumisha ‘akamkumbuka’ katika matini kama nahau ya kibiblia ya uangalifu wa Mungu unaoleta tendo la fadhili.
  alternative: alimwangalia Raheli kwa fadhili / akamjali Raheli
  rationale: Kiebrania hakidokezi kwamba Mungu alikuwa amemsahau kama wanadamu wanavyosahau. Hata hivyo, kubadili nahau hiyo katika matini kuu kungepunguza uzito wa mtindo wa kibiblia; vitendo vinavyofuata vinafafanua maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida lakini wenye staha. ‘Tumbo la uzazi’ ni wazi kwa msomaji wa sasa na huhifadhi taswira ya chanzo. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayohusika.
