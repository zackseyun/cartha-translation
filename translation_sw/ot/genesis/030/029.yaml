  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: sw
  text: Akamwambia, “Wewe unajua jinsi nilivyokutumikia, na jinsi mifugo yako ilivyokuwa kwangu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri halisi zaidi ni, “jinsi mifugo yako ilivyokuwa pamoja nami.” Huenda msemo huu wa Kiebrania unarejelea hali au kustawi kwa mifugo ya Labani ilipokuwa kwa Yakobo, wala si mahali ilipokuwa tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Akamwambia
  rationale: Muundo wa kawaida wa simulizi kwa wayyiqtol; kiambishi -mw- kinawakilisha ‘alimwambia yeye’ kwa Kiswahili cha asili.
- source_word: אַתָּה יָדַעְתָּ
  choice: Wewe unajua
  rationale: Kiwakilishi huru ‘wewe’ kinadumisha msisitizo wa אַתָּה, huku kitenzi timilifu cha hali יָדַעְתָּ kikielezwa kwa wakati wa sasa.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: jinsi nilivyokutumikia
  rationale: עבד hapa humaanisha kumtumikia au kumfanyia mtu kazi; ‘kutumikia’ huhifadhi wazo la kazi pamoja na uhusiano wa aliye chini ya mwingine.
- source_word: מִקְנְךָ
  choice: mifugo yako
  rationale: מִקְנֶה ni jina la jumla la wanyama wanaofugwa katika makundi, hivyo ‘mifugo’ ni pana na ya kawaida.
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: jinsi mifugo yako ilivyokuwa chini ya uangalizi wangu
  rationale: Kiebrania halisi ni ‘jinsi mifugo yako ilivyokuwa pamoja nami.’ Katika muktadha huu, ‘chini ya uangalizi wangu’ huwasilisha kwa Kiswahili asilia kwamba mifugo ilikuwa mikononi mwa Yakobo bila kuamua kimya kimya kuwa kishazi hicho lazima kirejelee kustawi kwake.
