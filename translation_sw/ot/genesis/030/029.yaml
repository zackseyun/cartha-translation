translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Akamwambia’ ni mtiririko wa kawaida wa simulizi; ‘mifugo’ inaeleweka kwa upana kuliko ‘ng’ombe.’ Alama ya tanbihi imewekwa baada ya kishazi inachofafanua.
