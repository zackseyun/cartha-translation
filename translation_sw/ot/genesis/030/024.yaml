lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: Akamwita
  rationale: Katika Kiswahili, kitenzi ‘kumwita’ katika muktadha huu hueleza kwa kawaida tendo la kumpa mtoto jina, huku kikihifadhi kwa ufupi fomula ya Kiebrania ya ‘kuliita jina lake.’
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha moja kwa moja maneno yanayoeleza jina.
- source_word: יֹסֵף
  choice: na aniongezee
  rationale: Hifili ya יסף ina maana ya ‘kuongeza’; muundo wa Kiswahili wenye ‘na’ unaonyesha ombi au tamani, bila kuugeuza kuwa taarifa ya uhakika.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina binafsi la Mungu lililoandikwa kwa tetragramatoni, badala ya kulibadili kuwa cheo.
- source_word: לִי
  choice: aniongezee
  rationale: Kiambishi ‘-ni-’ na kauli ya kutendea ‘-ezea’ vinawasilisha maana ya kuongeza kwa ajili yangu/kuniwekea zaidi kwa namna ya kawaida ya Kiswahili.
- source_word: בֵּן אַחֵר
  choice: mwana mwingine
  rationale: ‘Mwana’ hapa ni mtoto wa kiume, na ‘mwingine’ linatunza maana ya mwana mmoja zaidi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kitenzi יֹסֵף katika kauli ya Raheli
  choice: 'ombi/tamani: “na aniongezee”'
  alternative: 'taarifa: “ataniongezea” au “ameniongezea”'
  rationale: Muktadha wa kumpa mtoto jina unaunga mkono kusoma kauli hii kama ombi linalohusishwa na jina Yosefu; tafsiri haifanyi kuwa ahadi au taarifa iliyotimia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa leo, na tanakali ya jina Yosefu pamoja na kitenzi cha Kiebrania imeelezwa katika tanbihi.
