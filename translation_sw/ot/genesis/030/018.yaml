  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: sw
  text: Lea akasema, “Mungu amenipa ujira wangu, kwa sababu nilimpa mume wangu kijakazi wangu.” Basi akamwita Isakari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Isakari linahusishwa kwa sauti na neno la Kiebrania linalomaanisha “ujira” au “malipo,” kama inavyoonyesha maelezo ya Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: Mungu amenipa
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililokamilika lenye matokeo ya sasa katika maelezo ya Lea kuhusu kuzaliwa kwa mtoto.
- source_word: שְׂכָרִי
  choice: ujira wangu
  rationale: “Ujira” huhifadhi maana halisi ya malipo na pia mwangwi wa kimatamshi unaohusishwa na jina Isakari; “thawabu yangu” ingewezekana lakini ingepunguza dhana ya malipo.
- source_word: אֲשֶׁר
  choice: kwa sababu
  rationale: Ingawa kwa kawaida ni kishazi rejeshi, hapa inaeleweka kwa nguvu ya kisababishi katika maelezo ya Lea.
- source_word: נָתַתִּי שִׁפְחָתִי לְאִישִׁי
  choice: nilimpa mume wangu kijakazi wangu
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi tendo la Lea, uhusiano wa ndoa, na hadhi ya mtumishi wa kike bila kudokeza umri wake.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Basi akamwita jina lake
  rationale: Huhifadhi kwa uwazi nahau ya Kiebrania ya kumwita mtoto jina na mfuatano wa simulizi.
- source_word: יִשָּׂשכָר
  choice: Isakari
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili; tanbihi inaeleza uhusiano wake na neno la Kiebrania la ujira.
theological_decisions:
- issue: Maelezo ya Lea kuhusu tendo la Mungu na ujira
  choice: Maneno ya Lea yametafsiriwa moja kwa moja kuwa Mungu alimpa ujira, bila kuyathibitisha wala kuyakosoa kitheolojia.
  alternative: Kutumia “thawabu” ili kupunguza dhana ya kubadilishana au malipo.
  rationale: Aya inaripoti tafsiri ya Lea mwenyewe kuhusu tukio; tafsiri inapaswa kuhifadhi mvutano huo bila kuongeza hukumu ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kijakazi” limetumiwa kwa mtumishi wa kike; ni neno fupi na linalofaa katika muktadha wa Biblia.
