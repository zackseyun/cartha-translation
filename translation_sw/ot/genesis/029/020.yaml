  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: sw
  text: Hivyo Yakobo akafanya kazi kwa ajili ya Raheli kwa miaka saba; na miaka hiyo ilionekana kwake kama siku chache tu, kwa sababu alimpenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “na ilikuwa machoni pake kama siku chache.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: akafanya kazi
  rationale: Kitenzi עבד kinaweza kumaanisha kutumikia au kufanya kazi. Katika muktadha huu kinataja kazi aliyofanya Yakobo kama sehemu ya makubaliano ya kumwoa Raheli; “akafanya kazi” ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: בְּרָחֵל
  choice: kwa ajili ya Raheli
  rationale: Kihusishi ב hapa kinaonyesha kwamba kazi hiyo ilifanywa kwa kusudi linalomhusu Raheli. “Kwa ajili ya Raheli” huhifadhi maana hiyo bila kuongeza wazi kwamba alikuwa malipo au mali ya kubadilishwa.
- source_word: שֶׁבַע שָׁנִים
  choice: kwa miaka saba
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muda uliotajwa.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: nayo ikaonekana kwake
  rationale: Nahau ya Kiebrania “ikawa machoni pake” inaeleza jinsi alivyouona au kuuhisi muda huo. “Ikaonekana kwake” huwasilisha mtazamo huo kwa Kiswahili cha asili.
- source_word: כְּיָמִים אֲחָדִים
  choice: kuwa siku chache tu
  rationale: Kirai hiki kina maana halisi ya “kama siku chache.” Neno “tu” linawasilisha kwa kawaida ufupi aliouhisi Yakobo bila kubadili ulinganisho.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: kwa sababu alimpenda
  rationale: Muundo huu unaonyesha sababu au hali iliyofanya miaka hiyo ionekane mifupi. Tafsiri hii ni ya kawaida na inahifadhi wazi upendo wa Yakobo kwa Raheli.
