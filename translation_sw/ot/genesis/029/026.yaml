lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni njia ya kawaida ya Kiswahili ya kuendeleza simulizi kwa kitenzi cha kusema.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: Haifanywi hivyo
  rationale: Muundo huu unahifadhi usemi usiotaja mtendaji na maana ya desturi inayokubalika katika jamii.
- source_word: בִּמְקוֹמֵנוּ
  choice: kwetu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha mahali au jamii ya Labani na desturi yake, huku maana halisi ikiwa ‘mahali petu.’
- source_word: לָתֵת
  choice: kumtoa
  rationale: Katika muktadha wa binti kuolewa, ‘kumtoa’ ni usemi wa kawaida wa Kiswahili; unaendeleza wazo la Kiebrania la ‘kutoa’ bila kuongeza moja kwa moja maneno ‘aolewe.’
- source_word: הַצְּעִירָה
  choice: mdogo
  rationale: Kivumishi cha Kiebrania ni cha kike na kimetumika kama nomino; muktadha unaonyesha kuwa ni binti mdogo.
- source_word: לִפְנֵי
  choice: kabla ya
  rationale: Hapa neno linaonyesha kutangulia kwa mpangilio, si mahali pa kimwili.
- source_word: הַבְּכִירָה
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi msisitizo wa Kiebrania kuhusu mpangilio wa kuzaliwa kuliko neno la jumla ‘mkubwa.’
