  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: sw
  text: Akawauliza, “Je, hali yake ni njema?”[a] Wakasema, “Hali yake ni njema. Tazama, Raheli, binti yake, anakuja pamoja na kundi la mifugo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mambo yake yako vema?” Kiebrania kinatumia shalom kwa maana ya hali njema au ustawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: Je, yuko salama?
  rationale: Hapa שָׁלוֹם inaulizia hali njema na usalama wa Labani, si amani kwa maana ya kutokuwapo kwa vita. Kiswahili ‘yuko salama’ ni cha kawaida na kinadumisha swali kuhusu hali yake.
- source_word: שָׁלוֹם
  choice: Yuko salama
  rationale: Jibu linarudia neno la swali na kuthibitisha kuwa Labani yuko katika hali njema; kitenzi ‘yuko’ kinakamilisha usemi kwa Kiswahili cha kawaida.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili linaelekeza uangalifu kwa jambo linaloonekana wakati huo. ‘Tazama’ linahifadhi nguvu hiyo kwa lugha yenye hadhi lakini inayoeleweka.
- source_word: רָחֵל
  choice: Raheli
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: בִּתּוֹ
  choice: binti yake
  rationale: Kiambishi kinamrejelea Labani; tafsiri inaweka wazi uhusiano wa kifamilia bila kuongeza jina ambalo halijarudiwa katika kirai hiki.
- source_word: בָּאָה
  choice: anakuja
  rationale: Umbo hili linaonyesha tukio linaloendelea mbele ya wahusika, hivyo ‘anakuja’ linafaa katika simulizi hili la papo hapo.
- source_word: עִם הַצֹּאן
  choice: pamoja na kundi la mifugo
  rationale: צֹאן ni wanyama wadogo wafugwao kwa ujumla, hasa kondoo na mbuzi. ‘Kundi la mifugo’ halifungi maana kwa kondoo pekee.
