base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: sw
  text: BWANA alipoona kwamba Lea anachukiwa, alifungua tumbo lake la uzazi, lakini Raheli alikuwa tasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Uwakilishi wa kawaida na wenye heshima wa jina la agano YHWH katika tafsiri za Biblia za Kiswahili.
- source_word: שְׂנוּאָה
  choice: anachukiwa
  rationale: Huhifadhi maana ya moja kwa moja ya kitenzi cha Kiebrania na mvutano wa simulizi, bila kuilegeza kuwa ‘hapendwi’.
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: alifungua tumbo lake la uzazi
  rationale: Huhifadhi taswira ya Kiebrania huku ikieleweka kwa Kiswahili cha sasa kuwa Mungu alimpa uwezo wa kupata mimba.
- source_word: עֲקָרָה
  choice: tasa
  rationale: Neno la kawaida, fasaha, na sahihi kwa hali ya kutoweza kuzaa.
theological_decisions:
- issue: Nguvu ya neno שְׂנוּאָה kuhusu jinsi Lea alivyotendewa
  choice: anachukiwa
  alternative: hapendwi
  rationale: Chanzo kinasema kwa nguvu ‘anachukiwa’; tafsiri haipaswi kuondoa ukali au mvutano huo kwa sababu ya muktadha wa upendeleo wa Yakobo.
- issue: Uhusika wa Mungu katika uwezo wa Lea kuzaa
  choice: alifungua tumbo lake la uzazi
  alternative: alimwezesha kupata watoto
  rationale: Taswira ya chanzo imehifadhiwa bila kuongezea maelezo ya kimafundisho yasiyosemwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unadumisha utofautishaji wa Lea na Raheli.
