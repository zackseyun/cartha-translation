  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Juma la arusi” linaeleweka kuliko tafsiri ya neno kwa neno pekee, na tanbihi huhifadhi usemi halisi wa Kiebrania. Alama za tanbihi zimewekwa mara moja kila moja mahali zinapohusika.
