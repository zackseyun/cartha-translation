base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: sw
  text: Timiza juma la arusi la huyu[a], nasi tutakupa huyu mwingine pia[b], kwa kazi utakayonifanyia[c] kwa miaka mingine saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “juma la huyu”; maneno hayo yanahusu juma la desturi la sherehe za arusi.
    reason: cultural_note
  - marker: b
    text: Au, “utapewa huyu pia.” Umbo la Kiebrania ni nafsi ya tatu, umoja, jinsi ya kike, lakini katika muktadha maana yake ni ahadi ya Labani ya kumpa pia binti yake mwingine.
    reason: lexical_alternative
  - marker: c
    text: Au, “utakayonitumikia.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutumikia” au “kufanya kazi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Timiza
  rationale: Kauli ya amri inaagiza Yakobo akamilishe kipindi kilichowekwa; “timiza” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: שְׁבֻעַ זֹאת
  choice: juma la arusi ya huyu
  rationale: Kihalisi ni “juma la huyu”; katika muktadha ni juma la sherehe za arusi ya Lea. “Huyu” huhifadhi kiwakilishi cha kuonyesha bila kurudia jina.
- source_word: וְנִתְּנָה לְךָ
  choice: nasi tutakupa
  rationale: Umbo la Kiebrania ni nafsi ya tatu, umoja, jinsi ya kike, lakini hapa lina maana isiyoainisha mtendaji; usemi wa Kiswahili huwasilisha kwa kawaida ahadi ya Labani na watu wake.
- source_word: גַּם אֶת זֹאת
  choice: huyu mwingine pia
  rationale: Inamhusu Raheli, binti mwingine. “Mwingine” huweka tofauti kati yake na Lea, huku “pia” ikihifadhi nguvu ya גַּם.
- source_word: בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי
  choice: kwa kazi utakayonifanyia
  rationale: Nomino na kitenzi vinatokana na mzizi עבד, wenye maana ya kufanya kazi au kutumikia. Katika mpango huu wa ajira, “kazi utakayonifanyia” ni Kiswahili cha asili na kinaonyesha masharti ya ahadi.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: kwa miaka mingine saba
  rationale: Huwasilisha kwa uwazi kipindi cha ziada cha miaka saba.
