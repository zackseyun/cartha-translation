  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: sw
  text: Ndipo Yakobo akamwambia Labani, “Nipe mke wangu, kwa kuwa siku zangu zimetimia, ili nimwingilie[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “niingie kwake,” ni tasfida ya kawaida inayomaanisha kukamilisha ndoa kwa kujamiana.
