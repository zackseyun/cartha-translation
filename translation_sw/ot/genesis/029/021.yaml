lexical_decisions:
- source_word: הָבָה
  choice: Nipe
  rationale: Kauli ya ombi au amri kwa Labani; ‘Nipe’ huweka wazi mpokeaji aliyedokezwa na inafaa katika muktadha wa Labani kumkabidhi Raheli.
- source_word: אֶת אִשְׁתִּי
  choice: mke wangu
  rationale: אִשָּׁה hapa humaanisha mke, kwa kuwa Raheli ndiye mwenzi wa ndoa aliyekusudiwa baada ya kipindi walichokubaliana.
- source_word: כִּי מָלְאוּ יָמָי
  choice: kwa maana muda wangu umetimia
  rationale: Kihalisi ni ‘siku zangu zimetimia’; katika muktadha hurejelea kukamilika kwa kipindi cha utumishi walichokubaliana. ‘Muda wangu umetimia’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: ili niingie kwake
  rationale: בוא אל ni tasfida ya Kiebrania kuhusu kukamilisha ndoa kwa kujamiana. Tafsiri hii huhifadhi tasfida, staha, na dhumuni linaloonyeshwa na umbo la kitenzi.
