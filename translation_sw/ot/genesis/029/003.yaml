base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: sw
  text: Makundi yote ya mifugo yalikuwa yakikusanyika huko, nao walikuwa wakilivingirisha lile jiwe kutoka juu ya mdomo wa kisima[a], na kuinywesha mifugo ile, na kisha kulirudisha jiwe mahali pake juu ya mdomo wa kisima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mdomo wa kisima,” yaani uwazi wa kisima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: yalikuwa yakikusanyika
  rationale: Niphal imperfecti katika muktadha huu inaeleza tendo la kawaida lililorudiwa; muundo huu wa Kiswahili unaonyesha hali hiyo bila kuifanya kuwa tukio moja tu.
- source_word: כָל הָעֲדָרִים
  choice: makundi yote ya mifugo
  rationale: עֲדָרִים ni makundi ya wanyama wafugwao, hasa mifugo midogo; tafsiri hii ni ya kawaida na haiibani maana kuwa kondoo pekee.
- source_word: וְגָלֲלוּ
  choice: walikuwa wakilibingirisha
  rationale: Kitenzi kinaonyesha kusogeza jiwe kwa kulivingirisha na, katika mfululizo huu, tendo la kawaida lililorudiwa.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: kutoka kwenye mdomo wa kisima
  rationale: Inahifadhi picha halisi ya nahau ya Kiebrania 'mdomo wa kisima,' yaani uwazi wake, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וְהִשְׁקוּ
  choice: kuyanywesha
  rationale: Hiphil ya שׁקה humaanisha kuwapa maji au kuwafanya wanywe; 'kunywesha' ni kitenzi cha kawaida kwa mifugo.
- source_word: אֶת הַצֹּאן
  choice: makundi hayo
  rationale: צֹאן ni nomino ya pamoja inayoweza kurejelea mifugo midogo. 'Makundi hayo' huunganisha rejeo hili na makundi yaliyotajwa mwanzoni bila kulazimisha aina moja ya mnyama.
- source_word: וְהֵשִׁיבוּ
  choice: walilirudisha
  rationale: Hiphil ya שוב hapa ni kulifanya jiwe lirudi mahali pake; 'kulirudisha' ni ya moja kwa moja na ya asili.
- source_word: לִמְקֹמָהּ
  choice: mahali pake
  rationale: Kiambishi cha kike kinarejelea jiwe, na kirai kinaonyesha kurudishwa katika nafasi yake ya kawaida.
