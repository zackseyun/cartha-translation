  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: sw
  text: Labani akasema, “Ni afadhali nikupe yeye kuliko kumpa mwanamume mwingine. Kaa nami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni namna ya kawaida ya Kiswahili ya kuendeleza simulizi na kuanzisha maneno ya moja kwa moja.
- source_word: טוֹב
  choice: ni afadhali
  rationale: Katika muundo wa kulinganisha wenye maana ya ‘bora ... kuliko,’ ‘ni afadhali’ ni Kiswahili cha kawaida na huonyesha ulinganisho wazi.
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: nimpe yeye kwako
  rationale: Kitenzi chenye kiambishi cha nafsi ya kwanza kimetafsiriwa kwa muundo wa kawaida wa Kiswahili; ‘kwako’ hudumisha wazo la kumpa mtu huyo kwa Yakobo katika muktadha wa ndoa.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: kuliko kumpa mwanamume mwingine
  rationale: Muundo huu unaonyesha upande wa pili wa ulinganisho; tafsiri inadumisha kitendo cha kumpa na mhusika mwingine bila kuongeza maana ya ‘mume.’
- source_word: אִישׁ אַחֵר
  choice: mwanamume mwingine
  rationale: Hii huhifadhi maana ya moja kwa moja ya Kiebrania bila kufasiri neno hilo kuwa ‘mume mwingine.’
- source_word: שְׁבָה
  choice: kaa
  rationale: Amri ya ישׁב hapa inaweza kumaanisha kukaa au kubaki mahali; ‘kaa’ ni fupi, ya asili, na inafaa mwaliko wa kuendelea kuwa hapo.
- source_word: עִמָּדִי
  choice: pamoja nami
  rationale: Huwasilisha kwa kawaida wazo la kuendelea kukaa na Labani.
