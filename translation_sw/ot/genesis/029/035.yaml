base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: sw
  text: Akapata mimba tena, akazaa mwana wa kiume. Akasema, “Wakati huu nitamsifu Yahwe.” Kwa hiyo akamwita Yuda.[a] Kisha akaacha kuzaa watoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Yuda linasikika kama kitenzi cha Kiebrania kinachomaanisha “kusifu” au “kushukuru.”
    reason: Kufafanua mchezo wa maneno kati ya אוֹדֶה na יְהוּדָה na kuhifadhi maana zote mbili zinazowezekana za kitenzi.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Akachukua mimba tena
  rationale: Kitenzi הרה kinaonyesha kushika au kuchukua mimba, na עוֹד hapa huonyesha kurudiwa kwa jambo katika mfululizo wa kuzaliwa kwa watoto.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya nahau ya Kiebrania ילד pamoja na בן.
- source_word: הַפַּעַם
  choice: Wakati huu
  rationale: Maneno haya yanatofautisha tukio hili na kuzaliwa kwa watoto waliotangulia bila kuongeza hisia zisizotajwa wazi.
- source_word: אוֹדֶה
  choice: nitamsifu
  rationale: Muundo wa ידה unaweza kumaanisha kusifu au kutoa shukrani. 'Nitamsifu' ni ya asili katika Kiswahili na inadumisha uhusiano wa kimatamshi na jina Yuda, huku uwezekano wa maana ya kushukuru ukitajwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kwa namna ya kawaida katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: עַל כֵּן קָרְאָה שְׁמוֹ יְהוּדָה
  choice: Kwa hiyo akamwita Yuda
  rationale: Muundo huu unaonyesha matokeo na utoaji wa jina. Kiswahili cha kawaida hutumia 'akamwita' badala ya kufuata kihalisi 'akaliita jina lake'.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: Kisha akaacha kuzaa watoto
  rationale: עמד ikifuatwa na מן pamoja na kitenzi-jina humaanisha kukoma kufanya jambo. Neno 'watoto' linaweka maana kamili kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אוֹדֶה
  choice: nitamsifu
  alternative: nitamshukuru
  rationale: Kitenzi kinaweza kuonyesha sifa au shukrani. Maandishi makuu yanatumia 'nitamsifu' ili kudumisha maelezo ya jina Yuda, na tanbihi inahifadhi maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Miundo ya vitenzi vya mfululizo imetumiwa kuonyesha mwendo wa simulizi.
