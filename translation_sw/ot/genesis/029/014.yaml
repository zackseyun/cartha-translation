lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na unaonyesha kwamba Labani alisema maneno hayo kwa Yakobo.
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa neno hilo linasisitiza uthibitisho wa undugu, si kuweka kikomo; “Hakika” linaakisi msisitizo huo kwa ufasaha.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: mfupa wangu na nyama yangu
  rationale: Taswira halisi ya Kiebrania imehifadhiwa kwa sababu ni nahau ya undugu wa damu na ina mwangwi mpana wa kibiblia; maelezo yanawekwa katika tanbihi.
- source_word: וַיֵּשֶׁב עִמּוֹ
  choice: Naye akakaa pamoja naye
  rationale: Katika muktadha huu, kitenzi kinaonyesha kubaki au kukaa kwa Labani kwa muda; usemi huu ni wa kawaida na haudokezi makazi ya kudumu.
- source_word: חֹדֶשׁ יָמִים
  choice: kwa mwezi mmoja
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kiebrania inayomaanisha kipindi cha mwezi; inaepuka Kiswahili kisicho cha kawaida kama “mwezi wa siku.”
