base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: sw
  text: Ikawa Yakobo alipomwona Raheli[a], binti Labani, ndugu wa kiume wa mama yake, na kuliona kundi la mifugo la Labani, ndugu wa kiume wa mama yake, Yakobo akakaribia, akalivingirisha jiwe lililokuwa juu ya mdomo wa kisima, kisha akalinywesha kundi la mifugo la Labani, ndugu wa kiume wa mama yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarudia maneno “ndugu wa kiume wa mama yake” mara tatu katika aya hii, kikikazia uhusiano wa kifamilia kati ya Yakobo na Labani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ikawa ... alipomwona
  rationale: Inahifadhi fomula ya simulizi na maana ya wakati ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: רָאָה
  choice: alipomwona ... na kuliona
  rationale: Kitenzi hiki kinaonyesha kuona moja kwa moja; upatanisho wa ngeli umewekwa wazi kwa Raheli na kundi la mifugo.
- source_word: בַּת
  choice: binti
  rationale: Hutaja uhusiano wa Raheli na Labani kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: אֲחִי אִמּוֹ
  choice: ndugu wa kiume wa mama yake
  rationale: Huhifadhi maana mahususi ya ndugu wa kiume wa mama, bila kudokeza lazima kwamba alikuwa mkubwa kama neno ‘kaka’ au kufupisha uhusiano kuwa ‘mjomba’.
- source_word: צֹאן
  choice: kundi la mifugo
  rationale: צֹאן ni jina la mkusanyiko wa mifugo midogo, mara nyingi kondoo na mbuzi; tafsiri hii haibani maana kuwa kondoo peke yao.
- source_word: וַיִּגַּשׁ
  choice: akakaribia
  rationale: Inaonyesha Yakobo kusogea karibu na kisima na tukio linalofuata.
- source_word: וַיָּגֶל
  choice: akalivingirisha
  rationale: Huhifadhi picha halisi ya kulisogeza jiwe kwa kulivingirisha badala ya kusema tu aliliondoa.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: kutoka kwenye mdomo wa kisima
  rationale: Huhifadhi sitiari ya Kiebrania ya ‘mdomo’ kama sehemu iliyo wazi ya kisima, huku ikieleweka katika muktadha.
- source_word: וַיַּשְׁקְ
  choice: akalinywesha
  rationale: Hutoa maana ya kuwapa mifugo maji kwa kitenzi cha kawaida na kifupi cha Kiswahili.
