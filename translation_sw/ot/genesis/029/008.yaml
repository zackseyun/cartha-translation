lexical_decisions:
- source_word: נוּכַל
  choice: hatuwezi
  rationale: Kitenzi hiki kinaeleza kutoweza kwa nafsi ya kwanza wingi; “hatuwezi” ni cha moja kwa moja na cha kawaida katika Kiswahili.
- source_word: יֵאָסְפוּ
  choice: yakusanyike
  rationale: Kauli ya kutendwa ya אסף inaonyesha makundi kuletwa pamoja; hali ya utegemezi baada ya “mpaka” inafaa katika Kiswahili.
- source_word: הָעֲדָרִים
  choice: makundi
  rationale: עדר humaanisha makundi ya wanyama, hasa mifugo; “makundi” huhifadhi maana pana bila kuainisha wanyama zaidi ya maandishi.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: na walivingirishe jiwe
  rationale: גלל ni kuviringisha. Tafsiri hii huhifadhi tendo na mtendaji wa wingi asiyeainishwa wazi katika Kiebrania.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: kutoka kwenye mdomo wa kisima
  rationale: “Mdomo wa kisima” huhifadhi taswira halisi ya nahau ya Kiebrania huku ikieleweka kwa Kiswahili.
- source_word: וְהִשְׁקִינוּ
  choice: ndipo tunapowanywesha
  rationale: Kauli ya kusababisha ya שקה ni kuwapa wanyama maji; “ndipo” huonyesha kuwa tendo hili hufuata kukusanyika kwa makundi na kuondolewa kwa jiwe.
- source_word: הַצֹּאן
  choice: kondoo
  rationale: “Kondoo” ni tafsiri ya kawaida katika mazingira haya ya kichungaji, ingawa neno la Kiebrania linaweza kumaanisha kwa ujumla mifugo midogo, hasa kondoo na mbuzi; upana huo umeonyeshwa katika tanbihi.
