translation:
  language: sw
  text: Wakasema, “Hatuwezi mpaka makundi yote ya mifugo yakusanyike na walingirishe jiwe kutoka juu ya mdomo wa kisima; ndipo tunawanywesha kondoo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifugo”; neno la Kiebrania linaweza kumaanisha kwa ujumla mifugo midogo, hasa kondoo na mbuzi.
