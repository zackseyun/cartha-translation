lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: Yakobo akaondoka
  rationale: Nahau ya Kiebrania, kwa maana halisi ‘Yakobo akainua miguu yake,’ inaonyesha kuanza tena safari, huenda kwa ari; ‘akaondoka’ ni Kiswahili cha kawaida kinachowasilisha tendo hilo bila tafsiri ngumu isiyo ya kawaida.
- source_word: אַרְצָה
  choice: mpaka nchi
  rationale: He ya mwelekeo inaonyesha mwendo kuelekea mahali; ‘mpaka nchi’ huwasilisha wazi mwelekeo wa safari.
- source_word: בְנֵי קֶדֶם
  choice: watu wa mashariki
  rationale: Ingawa muundo wa maneno ni ‘wana wa mashariki,’ ni usemi wa Kiebrania unaowataja watu wa eneo la mashariki. ‘Watu wa mashariki’ ni wa asili katika Kiswahili na hauzuii maana kwa wanaume pekee.
