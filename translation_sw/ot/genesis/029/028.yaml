  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: sw
  text: Yakobo akafanya hivyo na akakamilisha juma hili[a]; kisha Labani akampa Raheli, binti yake, kuwa mke wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juma la arusi.” Neno la Kiebrania humaanisha kipindi cha siku saba; katika muktadha huu yaelekea ni juma la sherehe za arusi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: Yakobo akafanya hivyo
  rationale: Kifungu hiki kinarejelea maagizo ya Labani katika mstari uliotangulia. “Akafanya hivyo” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza maelezo yasiyosemwa wazi.
- source_word: וַיְמַלֵּא
  choice: akakamilisha
  rationale: Katika muundo huu wa kitenzi, מלא humaanisha kukamilisha au kutimiza kipindi cha wakati. “Akakamilisha” inafaa kwa juma na ni ya kawaida katika Kiswahili cha sasa.
- source_word: שְׁבֻעַ זֹאת
  choice: juma hilo[a]
  rationale: שְׁבֻעַ ni kipindi cha siku saba. Katika muktadha huu kinahusu juma la sherehe za arusi ya Lea. “Juma hilo” ni wazi na asilia kwa Kiswahili, huku tanbihi ikihifadhi uwezekano wa kuelewa maneno hayo kuwa “juma la arusi ya huyo [Lea].”
- source_word: וַיִּתֶּן לוֹ
  choice: Kisha Labani akampa
  rationale: Mtendaji asiyeandikwa wazi ni Labani kutokana na muktadha. Kutaja jina lake huondoa utata katika Kiswahili, na “kisha” huonyesha mfuatano wa matukio.
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: Raheli binti yake
  rationale: Tafsiri hii inafuata kwa uwazi mtendwa na maelezo ya uhusiano yaliyomo katika Kiebrania.
- source_word: לוֹ לְאִשָּׁה
  choice: awe mke wake
  rationale: Muundo huu unaeleza kumpa mwanamke katika ndoa. “Awe mke wake” ni Kiswahili cha kawaida na chenye heshima.
