  yaml_path: translation/ot/genesis/029/011.yaml
  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: sw
  text: Kisha Yakobo akambusu Raheli[a], akapaza sauti yake, akalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamsalimu Raheli kwa busu.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kubusu,” lakini katika muktadha huu busu hilo linaweza pia kuwa salamu ya kifamilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: akambusu
  rationale: Kitenzi נשק katika qal kwa kawaida humaanisha ‘kubusu.’ Katika muktadha huu ni tendo halisi la kumbusu, ambalo pia linaweza kuwa salamu ya kifamilia.
- source_word: לְרָחֵל
  choice: Raheli
  rationale: Herufi ל huonyesha anayepokea tendo la kubusu; Kiswahili huweka kiambishi cha yambwa katika kitenzi ‘akambusu,’ hivyo jina linatolewa kwa kawaida kama ‘Raheli.’
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: akapaza sauti yake
  rationale: Hii ni nahau ya Kiebrania inayoonyesha kutoa sauti kwa nguvu, hapa ikitanguliza kilio. ‘Kupaza sauti’ ni Kiswahili cha asili kinachohifadhi maana na ladha ya kifasihi.
- source_word: וַיֵּבְךְּ
  choice: akalia
  rationale: Kitenzi בכה humaanisha kulia au kutoa machozi. ‘Akalia’ ni cha kawaida, chenye hadhi, na kinaeleweka wazi katika Kiswahili cha sasa.
- source_word: וַ
  choice: Kisha / aka-
  rationale: Waw ya usimulizi huendeleza mfuatano wa matukio. ‘Kisha’ na vitenzi vya mfululizo vyenye ‘aka-’ vinawasilisha mtiririko huo kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi yenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa ‘aka-’ umetumiwa kuhifadhi mwendelezo wa matendo, huku nahau ‘akapaza sauti yake’ ikihifadhi taswira ya Kiebrania bila kuwa ngeni.
