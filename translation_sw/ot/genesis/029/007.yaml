  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: sw
  text: Kisha akasema, “Tazameni, bado kuna muda mwingi wa mchana; wakati wa kukusanya mifugo bado haujafika. Linywesheni kundi[a], kisha nendeni mkalichunge.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kundi” hapa linamaanisha mifugo midogo, hasa kondoo na mbuzi; neno la awali “mifugo” lina maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazameni
  rationale: Kihisishi hiki kinavuta usikivu wa wasikilizaji; “Tazameni” ni cha kawaida, chenye heshima, na kinafaa kwa watu wengi wanaoambiwa.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: bado kuna muda mrefu kabla ya jioni
  rationale: Nahau ya Kiebrania husema kihalisi kwamba siku bado ni “kubwa/ndefu,” yaani muda mwingi wa mchana umesalia. Tafsiri hii inawasilisha maana hiyo kwa Kiswahili cha kawaida bila kudokeza kwamba urefu wa siku yenyewe umebadilika.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: wakati wa kukusanya mifugo bado haujafika
  rationale: Muundo wa Kiebrania unaonyesha kwamba huu si wakati unaofaa wa mifugo kukusanywa. “Mifugo” huhifadhi upana wa nomino ya mkusanyiko מִקְנֶה.
- source_word: הַשְׁקוּ
  choice: Wapeni ... maji
  rationale: Kauli ya kuamuru ya Hifili humaanisha kuwapa wanyama maji au kuwafanya wanywe; usemi huu ni wazi na wa asili kwa Kiswahili.
- source_word: הַצֹּאן
  choice: makundi
  rationale: צֹאן ni nomino ya mkusanyiko kwa mifugo midogo, hasa kondoo na mbuzi. Katika muktadha huu, “makundi” ni ya asili na haibani maana kuwa kondoo peke yao.
- source_word: וּלְכוּ רְעוּ
  choice: kisha nendeni mkayachunge
  rationale: 'Huhifadhi mfuatano wa amri: baada ya kuyanywesha, waende wakayalishe na kuyatunza malishoni.'
