review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the plural address, the contrast between broad מִקְנֶה (‘livestock’) and narrower צֹאן (‘flock/small livestock’), and the sequence of watering before grazing. However, ‘kabla ya jioni’ makes the implied endpoint more explicit than the Hebrew idiom, which states only that much of the day remains. ‘Makundi’ is also overly broad in Swahili (‘groups’) and does not clearly identify the single collective flock denoted by הַצֹּאן.
  naturalness: ‘Bado kuna muda mwingi wa mchana’ is idiomatic contemporary Standard East African Swahili and communicates the temporal sense without importing ‘evening.’ ‘Linywesheni kundi’ and ‘mkalichunge’ are natural plural imperatives with a singular collective object.
  terminology: ‘Mifugo’ appropriately renders מִקְנֶה. ‘Kundi’ is preferable to ‘makundi’ here because the Hebrew has the definite singular collective הַצֹּאן; the footnote clarifies that it refers to small livestock, ordinarily sheep and goats, rather than a generic human or animal group.
  issues:
  - severity: medium
    issue: The phrase ‘kabla ya jioni’ adds a specific temporal endpoint.
    rationale: עוֹד הַיּוֹם גָּדוֹל means that much of the day remains; although evening is contextually foreseeable, it is not expressed in the Hebrew and need not be supplied.
  - severity: medium
    issue: ‘Makundi’ is semantically too general and changes the singular collective reference.
    rationale: הַצֹּאן refers to the flock, namely small livestock such as sheep or goats. In Swahili, ‘makundi’ can mean groups generally; singular collective ‘kundi’ better fits the source and the following singular object concord.
  revised_text: Kisha akasema, “Tazameni, bado kuna muda mwingi wa mchana; wakati wa kukusanya mifugo bado haujafika. Linywesheni kundi[a], kisha nendeni mkalichunge.”
  revised_footnotes:
