  to: Kisha akasema, “Tazameni, bado kuna muda mwingi wa mchana; wakati wa kukusanya mifugo bado haujafika. Linywesheni kundi[a], kisha nendeni mkalichunge.”
  rationale: The revision removes the added reference to evening, renders the remaining-day idiom naturally, and replaces the generic plural ‘makundi’ with a singular collective term that better reflects הַצֹּאן. It retains the Hebrew distinction between broad livestock and the flock of small livestock, as well as the plural imperatives addressed to the shepherds.
