  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: sw
  text: Asubuhi ilipofika, kumbe alikuwa Lea! Yakobo akamwambia Labani, “Ni nini hiki ulichonitendea? Je, sikukutumikia ili nimpate Raheli? Basi kwa nini umenidanganya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: kumbe
  rationale: Katika muktadha huu neno linaonyesha ugunduzi wa ghafla na mshangao asubuhi; “kumbe” ni la kawaida na lenye nguvu hiyo katika Kiswahili.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: sikukutumikia
  rationale: Kitenzi עבד hapa kinamaanisha kufanya kazi au kutumikia chini ya Labani; “kukutumikia” huhifadhi uhusiano huo kwa ufupi na kwa kawaida.
- source_word: רִמִּיתָנִי
  choice: umenidanganya
  rationale: Hueleza udanganyifu wa makusudi wa Labani bila kuongeza namna nyingine ya udanganyifu isiyotajwa katika maandishi.
