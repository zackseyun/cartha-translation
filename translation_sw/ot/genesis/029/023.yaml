  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: sw
  text: Ikawa jioni, akamchukua Lea binti yake, akamleta kwa Yakobo, naye Yakobo akaingia kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “akaingia kwake” hutafsiri nahau ya Kiebrania inayomaanisha alijamiiana naye.
