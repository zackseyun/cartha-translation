lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Ikawa jioni
  rationale: Muundo huu unahifadhi mfuatano wa kisimulizi wa וַיְהִי na kuweka wazi wakati uliotajwa na בָעֶרֶב, kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Kitenzi לקח hapa kina maana ya moja kwa moja ya kumchukua Lea; tafsiri hii haiongezi namna ambayo alimpeleka.
- source_word: לֵאָה בִתּוֹ
  choice: Lea binti yake
  rationale: Inafuata kwa karibu mpangilio wa Kiebrania wa jina likifuatiwa na uhusiano wa kifamilia, huku ikibaki ya kawaida katika Kiswahili.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: akamleta kwa Yakobo
  rationale: Hifili ya בוא humaanisha ‘kuleta.’ Jina ‘Yakobo’ limetumiwa badala ya kiwakilishi ili kuepuka utata wa marejeo ya viwakilishi katika Kiswahili.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: naye Yakobo akaingia kwake
  rationale: Kauli בוא אל ni nahau ya Kiebrania inayodokeza kujamiiana. ‘Akaingia kwake’ huhifadhi lugha ya staha na dokezo la chanzo; tanbihi inaeleza maana yake.
