base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: sw
  text: Labani aliposikia habari kuhusu Yakobo, mwana wa dada yake, alikimbia kwenda kumlaki, akamkumbatia, akambusu, kisha akamleta nyumbani kwake. Halafu Yakobo akamsimulia Labani mambo haya yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo wa כ pamoja na kitenzi-jina unaanzisha kishazi cha wakati; “aliposikia” ni Kiswahili cha kawaida bila kusisitiza mno kwamba tendo lilikuwa la papo hapo.
- source_word: שֵׁמַע יַעֲקֹב
  choice: habari kuhusu Yakobo
  rationale: שֵׁמַע hapa ni habari au taarifa inayomhusu Yakobo, si tendo la kusikia tu.
- source_word: בֶּן אֲחֹתוֹ
  choice: mwana wa dada yake
  rationale: Huhifadhi wazi namna ya undugu iliyoelezwa moja kwa moja katika Kiebrania badala ya kutumia neno pana “mpwa wake.”
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: alikimbia kwenda kumlaki
  rationale: “Kumlaki” huonyesha kwenda kukutana na mtu anayekuja na inafaa katika muktadha huu wa mapokezi.
- source_word: וַיְחַבֶּק לוֹ
  choice: akamkumbatia
  rationale: Ni tafsiri ya kawaida na yenye hadhi ya חבק katika simulizi.
- source_word: וַיְנַשֵּׁק לוֹ
  choice: na kumbusu
  rationale: Inatafsiri moja kwa moja tendo la busu katika salamu ya kifamilia bila kuongeza maana nyingine.
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: kisha akamleta nyumbani kwake
  rationale: Hifil ya בוא ina maana ya kumleta; “nyumbani kwake” ni njia ya asili ya kutafsiri אֶל־בֵּיתוֹ kwa Kiswahili.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: Halafu Yakobo akamsimulia Labani
  rationale: ספר katika Piel ni kusimulia au kueleza. Jina “Yakobo” linawekwa wazi kwa sababu kiima hubadilika kutoka Labani kwenda Yakobo.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: mambo haya yote
  rationale: דברים hapa inahusu kwa upana mambo au matukio aliyosimulia Yakobo, si maneno pekee.
