  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: sw
  text: Ndipo Labani akamwambia Yakobo[a], “Je, kwa kuwa wewe ni jamaa yangu, unapaswa kunifanyia kazi bure? Niambie ujira wako uwe nini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndugu yangu”; hapa neno hilo limetumiwa kwa maana pana ya jamaa au mtu wa ukoo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: Kwa kuwa
  rationale: 'Kishazi hiki kinaweka msingi wa swali la balagha linalofuata: undugu wao haupaswi kuwa sababu ya Yakobo kufanya kazi bila malipo.'
- source_word: אָחִי
  choice: jamaa yangu
  rationale: Ingawa neno hili kwa kawaida humaanisha ‘ndugu yangu,’ hapa linatumika kwa maana pana ya mtu wa ukoo; Yakobo alikuwa mpwa wa Labani.
- source_word: וַעֲבַדְתַּנִי
  choice: utanifanyia kazi
  rationale: Katika muktadha wa kupanga ujira, kitenzi kinaeleza kazi inayofanywa kwa ajili ya Labani. Wakati ujao ndani ya swali la balagha unasikika kwa kawaida katika Kiswahili.
- source_word: חִנָּם
  choice: bure
  rationale: Neno hili linaonyesha kufanya kazi bila malipo na linaendana moja kwa moja na kutajwa kwa ujira katika kishazi kinachofuata.
- source_word: הַגִּידָה לִּי
  choice: Niambie
  rationale: Ni amri ya moja kwa moja yenye yambwa ya nafsi ya kwanza, iliyotafsiriwa kwa Kiswahili cha kawaida na chenye heshima.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: ujira wako uwe nini
  rationale: ‘Ujira’ ni neno la kawaida kwa malipo ya kazi; muundo wa ‘uwe nini’ unaonyesha kwamba kiasi au aina ya malipo bado inapaswa kuamuliwa.
