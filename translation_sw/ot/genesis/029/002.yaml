translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Marudio ya “tazama” yamehifadhiwa kwa sababu yana kazi ya wazi ya kisimulizi; maelezo ya kunywesha yamelainishwa kiasi ili yawe ya asili katika Kiswahili, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
