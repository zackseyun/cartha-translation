base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: sw
  text: Akatazama,[a] na tazama, kulikuwa na kisima shambani; na tazama,[b] makundi matatu ya kondoo yalikuwa yamelala kando yake.[c] Kwa maana kutoka katika kisima hicho walikuwa wakiyanywesha makundi hayo.[d] Nalo jiwe lililokuwa juu ya mdomo wa kisima[e] lilikuwa kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaona.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinarudia “tazama” mara mbili ili kufanya simulizi liwe hai na kuvuta usikivu.
    reason: lexical_alternative
  - marker: c
    text: Au “karibu nacho”; kihalisi, “juu yake.”
    reason: lexical_alternative
  - marker: d
    text: Au “kwa maana kutoka katika kisima hicho waliyanywesha makundi.” Mtendaji hajatajwa wazi katika Kiebrania; kitenzi kinaweza kueleza tendo la desturi.
    reason: lexical_alternative
  - marker: e
    text: Kihalisi, “juu ya kinywa cha kisima,” yaani juu ya tundu lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Akatazama
  rationale: Kitenzi hiki kinaendeleza simulizi na kuelekeza macho ya msomaji kwenye mandhari mpya. “Akatazama” ni cha asili na chenye uhai; “akaona” pia kinawezekana.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: na tazama ... na tazama
  rationale: Kurudia “tazama” kunahifadhi msisitizo na uhai wa chembe ya Kiebrania inayovuta usikivu, ingawa Kiswahili kingeweza kulainisha usemi huu.
- source_word: בְאֵר בַּשָּׂדֶה
  choice: kisima shambani
  rationale: Hii ni tafsiri ya moja kwa moja, ya kawaida na inayoeleweka ya kisima kilichokuwa katika eneo la shamba au uwanda.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: makundi matatu ya kondoo
  rationale: עֵדֶר ni kundi la mifugo, na צֹאן hurejelea mifugo midogo, hasa kondoo na mbuzi. “Kondoo” linafaa katika mandhari hii na linaendelea kwa urahisi katika Kiswahili.
- source_word: רֹבְצִים
  choice: yalikuwa yamelala
  rationale: Kishirikishi hiki hueleza wanyama waliolala chini au waliopumzika. “Yalikuwa yamelala” kinahifadhi picha halisi bila kuongeza sababu ya kupumzika kwao.
- source_word: עָלֶיהָ
  choice: kando yake
  rationale: Kihalisi neno hili linaweza kuwa “juu yake,” lakini kwa kurejelea kisima linaonyesha ukaribu wa makundi na kisima. “Kando yake” ni usemi wa asili wa Kiswahili.
- source_word: מִן הַבְּאֵר הַהִוא יַשְׁקוּ הָעֲדָרִים
  choice: watu walikuwa wakichota maji katika kisima hicho na kuyanywesha makundi hayo
  rationale: Kitenzi cha Kiebrania ni cha kusababisha kunywa, yaani kunywesha, na mtendaji wa wingi hakutajwa. Kutaja kuchota maji kunafanya hatua hiyo ieleweke kwa Kiswahili bila kumtambulisha mtendaji zaidi ya “watu”; hali ya mazoea ya tendo imehifadhiwa kwa “walikuwa waki-”.
- source_word: עַל פִּי הַבְּאֵר
  choice: juu ya mdomo wa kisima
  rationale: Usemi wa Kiebrania ni “juu ya kinywa cha kisima.” “Mdomo wa kisima” huhifadhi taswira hiyo na humaanisha tundu au uwazi wa kisima.
- source_word: וְהָאֶבֶן גְּדֹלָה
  choice: Nalo jiwe ... lilikuwa kubwa
  rationale: Muundo wa kishazi kamili umehifadhiwa ili kutoa maelezo ya jiwe na kuandaa tukio linalofuata.
