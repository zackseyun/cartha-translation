  language: sw
  text: Alipokuwa bado akizungumza nao, Raheli akaja na kundi la baba yake, kwa kuwa alikuwa mchungaji[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa mchungaji wa kike.” Kiebrania kinatumia umbo la kike la neno “mchungaji” kumtambulisha Raheli katika wajibu huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Alipokuwa bado akizungumza nao
  rationale: Muundo huu unaonyesha kwamba mazungumzo yalikuwa yakiendelea Raheli alipokuja; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וְרָחֵל
  choice: Raheli
  rationale: Jina limetolewa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: בָּאָה
  choice: akaja
  rationale: Kitenzi hiki kinaendeleza simulizi na kuonyesha kuwasili kwa Raheli mahali walipokuwapo Yakobo na wachungaji.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: na kundi la mifugo la baba yake
  rationale: צֹאן hurejelea kundi la wanyama wadogo wa kufugwa, hasa kondoo na mbuzi. “Kundi la mifugo” huepuka kulibana neno hilo kuwa kondoo pekee, huku umilikaji ukitolewa kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Inaingiza maelezo ya sababu ya Raheli kuja pamoja na kundi hilo.
- source_word: רֹעָה הִוא
  choice: alikuwa mchungaji
  rationale: Kirai hiki kinatambulisha kazi au wajibu wa Raheli, si kitendo cha muda mfupi tu. Kiswahili hutumia “mchungaji” kwa mwanamume au mwanamke.
