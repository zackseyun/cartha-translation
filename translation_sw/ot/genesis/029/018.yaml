  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: sw
  text: Yakobo alimpenda Raheli, akasema, “Nitakutumikia miaka saba kwa ajili ya Raheli, binti yako mdogo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: alimpenda
  rationale: Kitenzi אָהַב humaanisha kupenda moja kwa moja. ‘Alimpenda’ ni Kiswahili cha kawaida na hakiingizi maana ya ziada ya ‘alikuwa amempenda kimahaba.’
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: אמר ni kitenzi cha kawaida cha kusema; ‘akasema’ pia huendeleza mtiririko wa simulizi kwa njia ya asili katika Kiswahili.
- source_word: אֶעֱבָדְךָ
  choice: nitakutumikia
  rationale: עבד hapa hueleza huduma au kazi ambayo Yakobo atamfanyia Labani. ‘Nitakutumikia’ huhifadhi wazo la kumhudumia mtu bila kulifanya kuwa shughuli ya kibiashara tu.
- source_word: שֶׁבַע שָׁנִים
  choice: miaka saba
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha namba na nomino.
- source_word: בְּרָחֵל
  choice: ili nimwoe Raheli
  rationale: בְּ hapa huonyesha msingi au malipo ya huduma katika mpango wa ndoa. Kiswahili ‘ili nimwoe Raheli’ huweka wazi maana inayotokana na muktadha bila kudokeza kwamba Raheli ni bidhaa ya kununuliwa.
- source_word: בִּתְּךָ
  choice: binti yako
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya pili umoja.
- source_word: הַקְּטַנָּה
  choice: mdogo
  rationale: Ingawa neno hilo kimsingi linaweza kumaanisha ‘dogo,’ katika kulinganisha ndugu humaanisha aliye na umri mdogo; ‘binti yako mdogo’ ni usemi wa kawaida wa Kiswahili.
- source_word: וַ
  choice: muendelezo wa simulizi kwa ‘aka-’
  rationale: Viunganishi vya waw-consecutive vinaendeleza simulizi. Kiswahili huwasilisha mtiririko huo kwa asili kupitia umbo la ‘aka-’ katika ‘akasema,’ bila kulazimisha ‘na’ mwanzoni.
