review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders Jacob's love, his offer to serve Laban, the seven-year period, and Rachel as Laban's younger daughter. However, “ili nimwoe Raheli” explicitly states the purpose as marrying Rachel, whereas the Hebrew uses the more compact exchange/basis expression “for Rachel.” Though marriage is clear from the broader narrative, this wording adds a specific element not stated in the verse itself.
  naturalness: The Swahili is fluent, idiomatic Standard East African Swahili, with a suitable narrative register. “Kwa ajili ya Raheli” is natural here and retains the concise formulation of the source.
  terminology: “Yakobo,” “Raheli,” “alimpenda,” “nitakutumikia,” “miaka saba,” and “binti yako mdogo” are appropriate and clear. “Binti yako mdogo” naturally conveys the familial comparative sense of “your younger daughter.”
  issues:
  - severity: medium
    issue: The phrase “ili nimwoe Raheli” is more explicit than the Hebrew.
    rationale: The Hebrew preposition בְּ in this context marks Rachel as the basis/exchange for Jacob's service. It does not expressly use a verb meaning “marry.” Replacing it with “kwa ajili ya Raheli” preserves the source's concise phrasing without importing the unstated verb.
