base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: sw
  text: Akapata mimba tena, akazaa mwana, kisha akasema, “Sasa, mara hii mume wangu ataungana nami[a], kwa sababu nimemzalia wana watatu.” Kwa hiyo akaitwa Lawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mume wangu ataunganishwa nami.” Kitenzi cha Kiebrania kina uhusiano wa sauti na jina Lawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Akapata mimba tena
  rationale: Kauli hii ni ya asili na inayoeleweka katika Kiswahili cha sasa; neno “tena” linawakilisha עוֹד.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: Hii ndiyo njia fupi na ya kawaida ya kueleza kuzaliwa kwa mtoto wa kiume katika simulizi.
- source_word: עַתָּה הַפַּעַם
  choice: Sasa, mara hii
  rationale: Inahifadhi msisitizo wa maneno yote mawili ya Kiebrania bila kuufanya usemi kuwa mzito.
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: mume wangu ataambatana nami
  rationale: “Ataambatana nami” huonyesha tumaini la Lea kwamba mume wake atakuwa amefungamana naye, huku tanbihi ikihifadhi maana mbadala ya kuunganishwa.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: kwa sababu nimemzalia wana watatu
  rationale: Muundo huu wa Kiswahili unaonyesha sababu, kitendo kilichokamilika chenye umuhimu wa sasa, na kiwakilishi לוֹ.
- source_word: עַל כֵּן קָרָא שְׁמוֹ לֵוִי
  choice: Kwa hiyo mtoto huyo akaitwa Lawi
  rationale: Kauli tendwa huepuka kutaja kwa uhakika mhusika aliyempa jina, kwa kuwa kitenzi cha Kiebrania hakina kiima kilichotajwa wazi; “Lawi” ni uhamishaji wa kawaida wa jina.
theological_decisions:
- issue: Mchezo wa maneno kati ya יִלָּוֶה na לֵוִי
  choice: Kutumia “ataambatana nami” katika matini na kueleza uhusiano wa sauti katika tanbihi
  alternative: ataunganishwa nami
  rationale: Kiebrania huunganisha tumaini la Lea na jina Lawi kwa maana na sauti. Kiswahili hakiwezi kuiga mchezo huo moja kwa moja, hivyo tanbihi inauhifadhi bila kulazimisha maana moja.
- issue: Utambulisho wa aliyempa mtoto jina
  choice: 'Kutumia kauli tendwa: “mtoto huyo akaitwa Lawi”'
  alternative: akamwita Lawi / akampa jina Lawi
  rationale: Kitenzi קָרָא ni nafsi ya tatu, umoja, kiume, lakini kiima hakitajwi wazi. Kauli tendwa haiingizi kiima kisichotajwa na inalinda utata wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa simulizi umehifadhiwa bila lugha ya kale isiyo ya lazima.
