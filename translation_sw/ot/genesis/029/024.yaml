  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: sw
  text: Labani akampa Lea, binti yake, Zilpa, kijakazi wake, awe kijakazi wa Lea[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi wa kike.” Neno la Kiebrania humaanisha mtumishi wa kike mwenye hadhi tegemezi, yaelekea akiwa mtumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן katika mfululizo wa simulizi humaanisha ‘alitoa/alimpa’; ‘akampa’ ni ya kawaida na huonyesha wazi mpokeaji.
- source_word: לָהּ ... לְלֵאָה בִתּוֹ
  choice: Lea binti yake
  rationale: Kiwakilishi ‘kwake’ kinafafanuliwa na kirai kinachofuata, ‘Lea binti yake’; Kiswahili cha kawaida huunganisha habari hiyo kama mpokeaji bila kurudia ‘kwake’.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Biblia ya Kiswahili.
- source_word: שִׁפְחָתוֹ
  choice: mtumishi wake wa kike
  rationale: שִׁפְחָה humaanisha mtumishi wa kike mwenye hadhi tegemezi, yaelekea katika hali ya utumwa; tafsiri hii huhifadhi jinsia na uhusiano wa utegemezi bila kutumia neno la kizamani.
- source_word: שִׁפְחָה
  choice: awe mtumishi wake
  rationale: Nomino ya mwisho inaonyesha jukumu ambalo Zilpa alipewa. Muundo ‘awe mtumishi wake’ ni Kiswahili cha asili na unaweka wazi uhusiano unaodokezwa na sentensi.
