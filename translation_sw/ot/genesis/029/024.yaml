    issue: Ambiguous possessive reference
    rationale: In the current wording, “mtumishi wake” can be read as Zilpah being Leah’s servant before the transfer, while the final “mtumishi wake” can be read as Laban’s servant. The Hebrew identifies Zilpah first as Laban’s servant and gives her to Leah in the role of Leah’s servant.
  - severity: low
    issue: Less natural lexical phrasing
    rationale: “Mtumishi wa kike” is grammatical but cumbersome in this context. “Kijakazi” is conventional, clear, and suitable to the source’s register.
