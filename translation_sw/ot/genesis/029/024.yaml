  verdict: revise
  source_fidelity: 'The draft correctly identifies Laban as giver, Leah as recipient and daughter, Zilpah as Laban’s female servant, and the final phrase as the role for which she was given. However, the two unanchored possessives in “mtumishi wake wa kike ... awe mtumishi wake” are ambiguous in Swahili: they may be attached to Leah rather than Laban in the first instance, and to Laban rather than Leah in the second.'
  naturalness: “Mtumishi wake wa kike” is understandable but less idiomatic in this biblical-narrative register than “kijakazi wake.” The revision uses natural Standard East African Swahili and makes each relationship explicit without adding interpretive content.
  terminology: “Kijakazi” is an established biblical Swahili term for a female servant of the dependent status denoted by שִׁפְחָה. The footnote retains a modern lexical alternative and notes the probable enslaved status without overstating it.
  issues:
