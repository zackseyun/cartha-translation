  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: sw
  text: Macho ya Lea yalikuwa laini[a], lakini Raheli alikuwa na umbo zuri na mwonekano mzuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Macho ya Lea yalikuwa mororo,” “dhaifu,” au “yenye wororo.” Kivumishi cha Kiebrania kinaweza kudokeza ulaini au wororo; maana kamili hapa haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: Macho
  rationale: Nomino hii ya wingi katika hali ya kuambatana inarejelea moja kwa moja macho ya Lea, si mwonekano wake kwa ujumla.
- source_word: רַכּוֹת
  choice: laini
  rationale: Kivumishi hiki kinaweza kumaanisha ulaini, wororo, au udhaifu. “Laini” kinahifadhi maana ya msingi bila kuingiza hukumu hasi isiyo ya lazima; utata unawekwa katika tanbihi.
- source_word: יְפַת תֹּאַר
  choice: umbo zuri
  rationale: Kirai hiki kinaeleza uzuri wa umbo au maumbile ya mwili; tafsiri hii ni ya kawaida na inaweka tofauti na sura inayoonekana.
- source_word: וִיפַת מַרְאֶה
  choice: sura nzuri
  rationale: מַרְאֶה hurejelea mwonekano unaoonekana. “Sura nzuri” ni Kiswahili cha kawaida na hudumisha maelezo ya pili sambamba na “umbo zuri.”
- source_word: וְ
  choice: lakini
  rationale: Ingawa kiunganishi kwa kawaida ni “na,” hapa kinafanya kazi ya kulinganisha Lea na Raheli kwa utofautishaji; “lakini” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
