translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kisimulizi na unaeleweka kwa urahisi. Tafsiri imehifadhi “wanaume” badala ya kuipanua kuwa “watu,” kwa kuwa Kiebrania kimetumia umbo la kiume waziwazi.
