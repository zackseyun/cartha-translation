  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: sw
  text: Basi Labani akawakusanya wanaume wote wa mahali pale, akafanya karamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “karamu” hutumiwa kwa sherehe yenye chakula na mara nyingi huhusisha pia kunywa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: akawakusanya
  rationale: Kitenzi אסף hapa kinamaanisha kuwaleta watu pamoja; “akawakusanya” ni Kiswahili cha kawaida na kinafuata mfuatano wa simulizi.
- source_word: לָבָן
  choice: Labani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: wanaume wote wa mahali pale
  rationale: אַנְשֵׁי ni umbo la uundaji la wingi wa kiume la אִישׁ, hivyo “wanaume” huhifadhi maana ya wazi ya Kiebrania; “mahali pale” ni ya asili katika simulizi la Kiswahili bila kulazimisha maana ya “mji.”
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: עשה ni kitenzi kipana chenye maana ya kufanya au kutengeneza; pamoja na מִשְׁתֶּה, “akafanya karamu” ni usemi mfupi, wa kawaida, na ulio karibu na Kiebrania.
- source_word: מִשְׁתֶּה
  choice: karamu
  rationale: Neno hili hutaja sherehe yenye chakula na mara nyingi vinywaji; “karamu” ni tafsiri ya asili na yenye hadhi katika muktadha wa harusi.
