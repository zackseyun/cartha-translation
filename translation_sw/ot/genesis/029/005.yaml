lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Akawaambia
  rationale: Muundo huu wa kawaida wa masimulizi ya Kiswahili unawakilisha mfuatano wa waw, kitendo cha kusema, na walengwa ‘kwao’ bila uzito usio wa lazima.
- source_word: הֲיְדַעְתֶּם
  choice: Je, mnamjua
  rationale: Katika muktadha huu יָדַע inauliza kama wana ufahamu wa mtu au wamefahamiana naye; ‘mnamjua’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: לָבָן
  choice: Labani
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: בֶּן נָחוֹר
  choice: mwana wa Nahori
  rationale: Huhifadhi maana ya moja kwa moja ya בֶּן kama ‘mwana’ na utambulisho wa ukoo bila kuibadili kuwa ‘mzao.’
- source_word: וַיֹּאמְרוּ
  choice: Wakasema
  rationale: Kiambishi ‘ka’ kinaendeleza mfuatano wa masimulizi kwa njia ya asili katika Kiswahili.
- source_word: יָדָעְנוּ
  choice: Tunamjua
  rationale: Hurejelea mzizi uleule wa ‘kujua’ uliotumiwa katika swali; kiambishi cha yambwa ‘-m-’ kinawekwa wazi kwa Kiswahili cha kawaida ingawa yambwa haikutajwa katika jibu la Kiebrania.
