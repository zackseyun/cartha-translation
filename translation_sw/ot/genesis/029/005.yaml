  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: sw
  text: Akawaambia, “Je, mnamjua Labani mwana wa Nahori?” Wakasema, “Tunamjua.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Tunajua”; neno “yeye” linaeleweka kutokana na muktadha.'
