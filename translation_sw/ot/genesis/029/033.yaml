base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: sw
  text: Kisha akapata mimba tena, akazaa mwana. Akasema, “Kwa kuwa Yahwe amesikia kwamba ninachukiwa[a], amenipa huyu pia.” Basi akamwita Simeoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sipendwi” au “ninapendwa kidogo.” Neno la Kiebrania kihalisi ni “ninachukiwa,” lakini katika muktadha linaweza kumaanisha kukataliwa au kupendwa kidogo kuliko mwingine.
    reason: lexical_alternative
  - marker: b
    text: Jina Simeoni linasikika kama neno la Kiebrania linalomaanisha “amesikia.”
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Kisha akapata mimba tena
  rationale: Kauli hii inaendeleza simulizi, huku עוֹד ikionyesha kwamba tendo hilo limetokea tena.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: Ni tafsiri fupi na ya kawaida ya Kiswahili inayohifadhi wazi kwamba mtoto aliyezaliwa alikuwa wa kiume.
- source_word: כִּי שָׁמַע יְהוָה
  choice: Kwa kuwa Yahwe amesikia
  rationale: כִּי hapa inatoa sababu ya kauli ya Lea; njeo ya 'amesikia' inaonyesha tendo lililokamilika lenye umuhimu kwa hali ya sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja kwa umbo linalofaa tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: kwamba ninachukiwa
  rationale: שְׂנוּאָה kwa maana yake ya moja kwa moja ni 'anayechukiwa.' Tafsiri hii haiupunguzi ukali wa neno, ingawa muktadha unaweza kuonyesha kutopendwa au kupendwa kidogo kuliko mwingine.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: amenipa huyu pia
  rationale: Kiwakilishi 'huyu' kinamrejelea mwana aliyezaliwa, na 'pia' kinahifadhi maana ya גַּם ya nyongeza.
- source_word: וַתִּקְרָא שְׁמוֹ שִׁמְעוֹן
  choice: Basi akamwita Simeoni
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza kumpa mtu jina, huku uhusiano wa jina na kitenzi 'amesikia' ukifafanuliwa katika tanbihi.
- source_word: שִׁמְעוֹן
  choice: Simeoni
  rationale: Hili ni umbo lililozoeleka la jina hilo katika Kiswahili na linadumisha kwa kiasi uhusiano wa kimatamshi na mzizi wa Kiebrania unaomaanisha 'kusikia.'
theological_decisions:
- issue: Jinsi ya kutafsiri maelezo ya Lea kuhusu hali yake katika uhusiano wake
  choice: ninachukiwa
  alternative: sipendwi; ninapendwa kidogo
  rationale: Neno la Kiebrania ni neno lenye nguvu linalomaanisha 'kuchukiwa.' Ingawa katika muktadha linaweza kuonyesha kukataliwa au kupendwa kidogo kuliko mwingine, matini kuu inadumisha nguvu na mvutano wa lugha ya chanzo.
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina binafsi la Mungu. Kulihifadhi kama 'Yahwe' kunatofautisha jina hilo na cheo na kunafuata ushahidi wa lugha ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka katika usomaji wa kawaida; 'ninachukiwa' huhifadhi ukali wa Kiebrania, na tanbihi hutoa uwezekano wa maana linganishi bila kuuingiza kimya kimya katika matini.
