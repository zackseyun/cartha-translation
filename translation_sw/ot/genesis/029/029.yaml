lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן katika mfuatano wa masimulizi kinaeleza tendo lililopita; “akampa” ni Kiswahili cha kawaida na pia huonyesha mpokeaji.
- source_word: לָבָן
  choice: Labani
  rationale: Jina la mtu limeandikwa kwa umbo lililozoeleka katika Kiswahili.
- source_word: לְרָחֵל
  choice: Raheli
  rationale: Kiambishi ל־ kinamtaja mpokeaji; maana hiyo imeingizwa katika kitenzi “akampa”.
- source_word: בִּתּוֹ
  choice: binti yake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu ya kiume inamtambulisha Raheli kuwa binti ya Labani.
- source_word: אֶת
  choice: '[halijatafsiriwa kivyake]'
  rationale: Ni alama ya yambwa mahususi, isiyo na neno la moja kwa moja katika Kiswahili.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Jina la mtu limeandikwa kwa umbo la Kiswahili linalokaribia jina la Kiebrania.
- source_word: שִׁפְחָתוֹ
  choice: mtumishi wake wa kike
  rationale: שִׁפְחָה humaanisha mtumishi wa kike au mwanamke aliye katika hali ya utumwa. Tafsiri hii inahifadhi jinsia iliyotajwa bila kudokeza umri ambao Kiebrania hakitaji.
- source_word: לָהּ
  choice: wa Raheli
  rationale: Kiwakilishi kinamrejelea Raheli; kutaja jina tena huondoa utata wa viwakilishi katika Kiswahili.
- source_word: לְשִׁפְחָה
  choice: awe mtumishi
  rationale: Muundo wa ל־ unaonyesha jukumu au kusudi la Bilha kwa Raheli. “Awe mtumishi” ni usemi wa asili wa Kiswahili, huku jinsia ikiwa tayari wazi kwa jina Bilha na sentensi iliyotangulia.
