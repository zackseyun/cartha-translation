base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: sw
  text: Yakobo akawaambia, “Ndugu zangu, ninyi mmetoka wapi?” Wakasema, “Tumetoka Harani.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם יַעֲקֹב
  choice: Yakobo akawaambia
  rationale: Kitenzi אמר ni kitenzi cha kawaida cha kusema, na לָהֶם huonyesha walengwa wa maneno. Muundo huu ni wa kawaida katika Kiswahili na huhifadhi mwendelezo wa simulizi unaoonyeshwa na וַ.
- source_word: אַחַי
  choice: Ndugu zangu
  rationale: Maana ya moja kwa moja ni ‘ndugu zangu.’ Hapa ni namna ya kirafiki na yenye staha ya kuwahutubia wanaume, wala si lazima iwe dai la undugu wa damu.
- source_word: מֵאַיִן אַתֶּם
  choice: ninyi mmetoka wapi?
  rationale: מֵאַיִן huuliza asili au mahali mtu alikotoka. ‘Mmetoka wapi?’ ni Kiswahili cha kawaida; ‘ninyi’ hudhihirisha kiwakilishi cha wingi אַתֶּם na kuleta mkazo wa asili bila kulazimisha tafsiri ya neno kwa neno.
- source_word: וַיֹּאמְרוּ
  choice: Wakasema
  rationale: אמר ni kitenzi cha kawaida cha kusema. ‘Wakasema’ ni cha karibu na chanzo kuliko ‘wakajibu,’ ingawa muktadha unaonyesha kuwa ni jibu.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: Tumetoka Harani
  rationale: מִן huonyesha mahali pa asili, na kiwakilishi אֲנָחְנוּ kinawakilishwa na kiambishi ‘tu-’. ‘Tumetoka Harani’ ni jibu kamili na la kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ndugu zangu’ inadumisha lugha ya undugu ya Kiebrania kwa namna inayoeleweka kama salamu ya kirafiki katika muktadha. Hakuna tanbihi iliyohitajika kwa kuwa maana hiyo hubebwa kwa kawaida na Kiswahili.
