  source_fidelity: Tafsiri inawakilisha kwa uaminifu kauli ya Yakobo, mwito wa “ndugu zangu,” swali la asili yao, na jibu kwamba wametoka Harani. “Mmetoka wapi?” hutafsiri kwa usahihi מֵאַיִן אַתֶּם, na “Tumetoka Harani” huwasilisha kwa kawaida katika Kiswahili maana ya מֵחָרָן אֲנָחְנוּ.
