base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: sw
  text: Lea akapata mimba, akazaa mwana wa kiume[a], akamwita Reubeni, kwa maana alisema, “Kwa kuwa Yahwe ameona mateso yangu, sasa mume wangu atanipenda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Reubeni linasikika kama maneno ya Kiebrania yanayomaanisha “tazama, mwana,” na hapa Lea analihusianisha na maneno, “Yahwe ameona mateso yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Kitenzi הרה kinaonyesha kushika au kupata mimba; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana wa kiume
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kuzaliwa kwa mtoto wa kiume, huku ukihifadhi mtiririko mfupi wa simulizi.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: akamwita jina lake
  rationale: Tafsiri hii inahifadhi kaida ya Kiebrania ya kutoa jina na kutayarisha msomaji kwa mchezo wa maneno unaohusiana na Reubeni.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Jina limetoholewa kwa umbo linalotumiwa sana katika Kiswahili; mchezo wake wa maneno wa Kiebrania umeelezwa katika tanbihi.
- source_word: כִּי אָמְרָה
  choice: kwa maana alisema
  rationale: כִּי hapa linaanzisha sababu ya jina; ‘kwa maana’ linaonyesha uhusiano huo kwa Kiswahili cha asili.
- source_word: כִּי רָאָה יְהוָה
  choice: Kwa kuwa Yahwe ameona
  rationale: Kauli hii inaeleza msingi wa tumaini la Lea. ‘Ameona’ huhifadhi tendo lililotimia lenye matokeo katika hali ya sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: בְּעָנְיִי
  choice: mateso yangu
  rationale: עֳנִי linaweza kumaanisha taabu, unyonge, au mateso; ‘mateso yangu’ ni la kawaida, lenye uzito, na halibani maana kuwa aina moja tu ya shida.
- source_word: כִּי עַתָּה
  choice: sasa
  rationale: Neno hili linaonyesha matarajio mapya ya Lea baada ya kuzaliwa kwa mwana.
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: mume wangu atanipenda
  rationale: Katika muktadha wa ndoa אִישִׁי humaanisha ‘mume wangu,’ na אהב huhifadhiwa kwa kitenzi cha moja kwa moja ‘kupenda.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina maalumu la Mungu, si cheo. ‘Yahwe’ hulihifadhi kama jina huku likifuata tahajia ya kawaida ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi ni mfupi na wa asili, huku kaida ya kutaja jina na mchezo wa maneno wa Kiebrania vikihifadhiwa kwa tanbihi.
