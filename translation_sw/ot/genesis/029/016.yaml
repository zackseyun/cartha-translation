  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mkubwa’ na ‘mdogo’ ni maneno ya kawaida ya kutofautisha umri wa ndugu wawili. Muundo sambamba wa ‘jina la ... lilikuwa’ umehifadhiwa ili kuakisi marudio ya Kiebrania bila kufanya sentensi kuwa ngumu.
