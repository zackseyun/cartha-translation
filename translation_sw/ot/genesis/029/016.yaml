  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: sw
  text: Labani alikuwa na binti wawili[a]; jina la mkubwa lilikuwa Lea, na jina la mdogo lilikuwa Raheli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa Labani [walikuwako] binti wawili,” ambayo ni nahau yenye maana ya “Labani alikuwa na binti wawili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְלָבָן
  choice: Labani alikuwa na
  rationale: Muundo wa Kiebrania wa kihusishi, kihalisi ‘kwa Labani [walikuwako],’ ni nahau ya kuonyesha umiliki. ‘Labani alikuwa na’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuongeza neno la wakati kama ‘sasa.’
- source_word: שְׁתֵּי בָנוֹת
  choice: binti wawili
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa nomino pamoja na idadi.
- source_word: שֵׁם
  choice: jina la ... lilikuwa
  rationale: Marudio ya muundo unaotaja jina yamehifadhiwa ili kudumisha ulinganifu wa vifungu viwili vya Kiebrania.
- source_word: הַגְּדֹלָה
  choice: mkubwa
  rationale: Katika muktadha wa dada wawili, neno hili linaonyesha aliyezaliwa kwanza au mwenye umri mkubwa, si ukubwa wa mwili.
- source_word: לֵאָה
  choice: Lea
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וְשֵׁם
  choice: na jina la
  rationale: Kiunganishi na marudio ya muundo wa kutaja jina vimehifadhiwa kwa uwazi na mlingano.
- source_word: הַקְּטַנָּה
  choice: mdogo
  rationale: Katika uhusiano wa dada wawili, neno hili humaanisha mwenye umri mdogo, si mdogo kwa umbo.
- source_word: רָחֵל
  choice: Raheli
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
