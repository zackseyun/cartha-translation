  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: sw
  text: Yakobo akamwambia Raheli kwamba alikuwa jamaa wa baba yake, na kwamba alikuwa mwana wa Rebeka.[a] Kisha Raheli akakimbia, akamwambia baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “ndugu wa kiume wa baba yake.” Hapa neno “ndugu” limetumiwa kwa maana pana ya jamaa wa kiume; hasa, Yakobo alikuwa mpwa wa Labani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: akamwambia
  rationale: Hifili ya נגד hapa ina maana ya kumwambia au kumjulisha mtu; “akamwambia” ni ya kawaida na inafaa katika simulizi.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya yale Yakobo aliyomwambia Raheli.
- source_word: אֲחִי אָבִיהָ
  choice: jamaa ya baba yake
  rationale: Ingawa kwa umbo la moja kwa moja ni “ndugu wa kiume wa baba yake,” אָח inaweza kutumiwa kwa maana pana ya jamaa wa kiume. Yakobo alikuwa mpwa wa Labani, hivyo “jamaa ya baba yake” huwasilisha uhusiano huo bila kumfanya ndugu halisi wa Labani.
- source_word: בֶן רִבְקָה
  choice: mwana wa Rebeka
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya uhusiano wa mwana na mama.
- source_word: וַתָּרָץ
  choice: akakimbia kwenda
  rationale: רץ humaanisha kukimbia; kuongezwa kwa “kwenda” hufanya mfuatano wa kitendo usikike kwa kawaida katika Kiswahili bila kupunguza kasi ya simulizi.
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: kumwambia baba yake
  rationale: Hifili ya נגד tena ina maana ya kutoa habari; “kumwambia baba yake” ni Kiswahili cha kawaida na wazi.
