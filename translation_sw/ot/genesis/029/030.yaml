  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: sw
  text: Basi Yakobo akamwingilia Raheli pia, akampenda Raheli kuliko Lea[a]; naye akaendelea kufanya kazi kwa Labani kwa miaka mingine saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akampenda Raheli badala ya Lea.” Kihusishi cha Kiebrania kinaweza kuonyesha utofautishaji, ingawa hapa maana ya kawaida zaidi ni “kuliko Lea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל רָחֵל
  choice: akaingia pia kwa Raheli
  rationale: Katika muktadha huu wa ndoa, בוא אֶל ni nahau inayodokeza kuingia kwa mwanamke na kuitimiza ndoa. Kiswahili ‘kuingia kwa’ kinahifadhi dokezo hilo bila kulifanya wazi kupita kiasi; ‘pia’ linawakilisha גַּם.
- source_word: וַיֶּאֱהַב ... אֶת רָחֵל
  choice: akampenda Raheli
  rationale: אָהַב ni kitenzi cha kawaida cha ‘kupenda’; hakuna kielezi cha kusisitiza katika kitenzi chenyewe.
- source_word: מִלֵּאָה
  choice: kuliko Lea
  rationale: מִן baada ya kitenzi cha hisia hapa kwa kawaida huonyesha ulinganisho, hivyo ‘kuliko Lea’ ni tafsiri ya asili na ya moja kwa moja.
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: akaendelea kumtumikia Labani
  rationale: עבד ni ‘kutumikia/kufanya kazi,’ na עִמּוֹ inaeleza kuendelea kwake katika utumishi chini ya Labani. Jina ‘Labani’ linaweka rejeleo wazi kwa msomaji wa Kiswahili.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: kwa miaka mingine saba
  rationale: עוֹד pamoja na hesabu na אֲחֵרוֹת huonyesha kipindi cha nyongeza; ‘miaka mingine saba’ ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Maana ya ulinganisho katika מִלֵּאָה
  choice: akampenda Raheli kuliko Lea
  alternative: akampenda Raheli badala ya Lea
  rationale: Kihusishi מִן kinaweza kueleweka kwa namna ya ulinganisho au utofautishaji. Muktadha unaunga mkono zaidi kiwango cha upendo, lakini uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. ‘Akaingia kwa Raheli’ huhifadhi nahau ya Kiebrania na dokezo la kuitimiza ndoa bila maelezo ya wazi kupita kiasi. Tanbihi imewekwa baada ya sentensi kwa kuwa inahusu kishazi cha ulinganisho.
