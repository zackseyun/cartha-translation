  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: sw
  text: Mungu akaviweka katika anga la mbingu ili vitoe mwanga juu ya dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika anga lililotandazwa la mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akaviweka
  rationale: Kitenzi נתן hapa kina maana ya kuweka au kupanga mahali; “akaviweka” ni Kiswahili cha kawaida kinachoonyesha kitendo cha Mungu cha kuviweka vile vianga mahali pake.
- source_word: אֹתָם
  choice: -vi-
  rationale: Kiwakilishi hiki kinarejelea vianga vilivyotajwa katika mstari uliotangulia; kiambishi cha yambwa “-vi-” kinapatana na nomino “vianga” katika muktadha.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linaambatana na kitenzi cha umoja na linamtaja Muumba mmoja; “Mungu” ndilo neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: בִּרְקִיעַ
  choice: katika anga
  rationale: רָקִיעַ hueleza nafasi iliyotandazwa au eneo pana la juu. “Anga” ni neno la asili na linaloeleweka kwa wasomaji wa Kiswahili, bila kulazimisha taswira mahususi ya kisayansi au ya anga ngumu.
- source_word: הַשָּׁמַיִם
  choice: la mbingu
  rationale: Muundo “anga la mbingu” huhifadhi uhusiano wa maneno ya Kiebrania na sauti yenye hadhi ya simulizi la uumbaji, huku “mbingu” likiwa neno la kawaida la Kiswahili kwa שָׁמַיִם.
- source_word: לְהָאִיר
  choice: ili viangaze
  rationale: Hiphil ya אור ina maana ya kusababisha nuru au kutoa mwanga. “Ili viangaze” ni usemi wa kawaida wa Kiswahili unaowasilisha kusudi hilo kwa uwazi.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: עַל inaweza kumaanisha juu ya, kwenye, au kuelekea uso wa kitu. Hapa “juu ya dunia” huonyesha kwamba nuru yao inaifikia dunia huku ikihifadhi upana wa kihusishi cha Kiebrania.
theological_decisions:
- issue: Neno la kikosmolojia רָקִיעַ katika simulizi la uumbaji
  choice: katika anga
  alternative: katika anga lililotandazwa; katika kuba la mbingu
  rationale: “Anga” linafikisha dhana ya eneo pana la juu kwa Kiswahili cha sasa bila kuingiza maelezo ya kisayansi ya kisasa wala kudai wazi kwamba maandiko yanaeleza kuba ngumu. Tanbihi inahifadhi uwezekano wa tafsiri iliyo karibu zaidi na wazo la kitu kilichotandazwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama Kiebrania, na kiunganishi “aka-” kinaendeleza mfululizo wa simulizi. “Viangaze” kinarejelea vianga vya mstari uliotangulia.
