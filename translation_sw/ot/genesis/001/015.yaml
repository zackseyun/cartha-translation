id: GEN.1.15
reference: Genesis 1:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָי֤וּ לִ/מְאוֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הָאִ֖יר עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: sw
  text: Na viwe mianga[a] katika anga la mbingu[b], ili vitoe nuru juu ya dunia. Ikawa hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vinavyotoa nuru.” Neno la Kiebrania humaanisha vitu vinavyotoa nuru, si nuru yenyewe tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika kuba la mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Na viwe
  rationale: Katika mfululizo wa amri ya uumbaji ulioanza katika mstari uliotangulia, muundo huu unaendeleza maana ya kutaka jambo litendeke, badala ya kutoa tu taarifa ya wakati ujao.
- source_word: לִמְאוֹרֹת
  choice: mianga
  rationale: Neno la Kiebrania linamaanisha vitu vinavyotoa nuru. “Mianga” ni neno la kawaida na linalofaa kwa vitu vya angani, huku tanbihi ikihifadhi ufafanuzi wa maana yake halisi.
- source_word: בִּרְקִיעַ
  choice: katika anga
  rationale: “Anga” ni Kiswahili cha sasa na cha kawaida kinachowasilisha eneo lililotandazwa juu bila kutumia istilahi nzito au ya kizamani.
- source_word: הַשָּׁמַיִם
  choice: la mbingu
  rationale: “Mbingu” huhifadhi usemi wa Kiebrania na mwendelezo wa msamiati wa simulizi la Mwanzo 1.
- source_word: לְהָאִיר
  choice: ili vitoe nuru
  rationale: Kitenzi cha Kiebrania kina maana ya kusababisha mwanga, hivyo “kutoa nuru” ni sahihi zaidi kuliko kusema tu “kung'aa.”
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: Usemi huu unaonyesha mahali nuru inapoelekezwa na unasikika kwa kawaida katika Kiswahili.
- source_word: וַיְהִי כֵן
  choice: Ikawa hivyo
  rationale: Hii ni kauli ya kawaida ya kutimizwa kwa amri inayorudiwa katika Mwanzo 1; tafsiri hii ni fupi, ya asili, na yenye hadhi.
theological_decisions:
- issue: Maana ya kutaka au kuamuru katika וְהָיוּ ndani ya usemi wa uumbaji
  choice: Na viwe
  alternative: Navyo vitakuwa
  rationale: Muktadha unaendeleza agizo la Mungu kuhusu kazi ya mianga, kisha unafuatwa na kauli ya kutimizwa kwake. Tafsiri ya kutaka jambo litendeke huhifadhi muundo huo bila kuongeza fundisho la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Anga la mbingu” huhifadhi muundo wa chanzo, na “ili vitoe nuru” huwasilisha wazi maana sababishi ya kitenzi.
