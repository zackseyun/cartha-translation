base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: sw
  text: Mungu akasema, “Maji na yajae makundi ya viumbe hai[a], na ndege[b] waruke juu ya dunia, katika anga la mbingu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Maji na yajae viumbe hai tele.” Kiebrania hutumia kitenzi na nomino zenye mzizi mmoja, kwa maana ya viumbe kujaa au kusongamana kwa wingi, ili kusisitiza wingi wa uhai.
    reason: lexical_alternative
  - marker: b
    text: Au “viumbe virukavyo.” Neno la Kiebrania linaweza kuwa pana kuliko ndege pekee.
    reason: lexical_alternative
  - marker: c
    text: “Anga” hapa hutafsiri neno la Kiebrania רָקִיעַ (raqia), ambalo pia linaweza kufasiriwa kuwa “uwanda uliotandazwa” au “kuba ya anga.” Kirai cha Kiebrania kinasema kwa karibu “juu ya uso wa anga la mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa masimulizi wenye waw-consecutive unaendeleza mfululizo wa matukio; “akasema” ni wa kawaida na wa asili katika masimulizi ya Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Nomino hii inaambatana na kitenzi cha umoja katika Mwanzo 1 na humrejelea Mungu mmoja, Muumba.
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: Maji na yajae makundi kwa makundi
  rationale: Kirai hiki kinawakilisha kitenzi na nomino zenye mzizi mmoja katika Kiebrania na kusisitiza wingi wa viumbe vinavyosongamana, huku kikibaki cha asili kwa Kiswahili.
- source_word: נֶפֶשׁ חַיָּה
  choice: viumbe hai
  rationale: Katika muktadha huu kirai kinamaanisha viumbe vyenye uhai, bila kuingiza dhana ya kitaalamu kuhusu nafsi.
- source_word: עוֹף
  choice: ndege
  rationale: “Ndege” ni tafsiri ya kawaida na inayoeleweka, ingawa neno la Kiebrania linaweza kujumuisha viumbe virukavyo kwa maana pana zaidi; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: יְעוֹפֵף
  choice: waruke
  rationale: Hutoa kwa uwazi hali ya agizo au ruhusa ya kitenzi cha Kiebrania na mwendo wa kuruka.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: Katika muktadha wa kuruka, kihusishi kinaonyesha kuwa viumbe hao wako juu ya dunia, si kwamba wanaigusa.
- source_word: עַל פְּנֵי רְקִיעַ הַשָּׁמָיִם
  choice: katika anga la mbingu
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa taswira ya kuruka mbele au katika sehemu inayoonekana ya anga; maana halisi na chaguo za kikosmolojia zimeelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika simulizi la uumbaji
  choice: viumbe hai
  alternative: nafsi zilizo hai; viumbe vyenye uhai
  rationale: Kirai hapa kinataja uhai wa wanyama wala hakitoi dai maalumu kuhusu asili au sehemu za nafsi.
- issue: Tafsiri ya רְקִיעַ
  choice: anga
  alternative: uwanda uliotandazwa; kuba ya anga
  rationale: “Anga” ni neno linaloeleweka na lisilolazimisha mfano mmoja maalumu wa muundo wa ulimwengu; uwezekano wa picha nyingine za neno la Kiebrania umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Marudio “makundi kwa makundi” yanahifadhi msisitizo wa Kiebrania bila kufanya sentensi kuwa ngumu; tanbihi zinahifadhi upana wa עוֹף na utata wa רָקִיעַ.
