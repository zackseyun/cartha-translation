  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: sw
  text: Mungu akaumba viumbe wakubwa wa baharini[a], na kila kiumbe hai kinachosogea, ambacho maji yalijaa nacho kwa wingi, kwa aina zake, na kila ndege mwenye mabawa kwa aina yake. Mungu akaona kuwa ni vyema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanyama wakubwa wa baharini wa kutisha” au “majoka makubwa.” Neno la Kiebrania tanninim linaweza kumaanisha viumbe wakubwa wenye umbo la nyoka au wa kutisha; hapa muktadha wa majini unaunga mkono “viumbe wakubwa wa baharini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: akaumba
  rationale: Kitenzi 'umba' huhifadhi maana ya tendo la Mungu la kuumba na mtindo wa simulizi unaoendelea katika Mwanzo 1.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linaambatana na kitenzi cha umoja na linamtaja Mungu mmoja.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: viumbe wakubwa wa baharini
  rationale: Katika muktadha wa viumbe vya majini, tafsiri hii ni wazi na ya kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya majitu au majoka ya baharini.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: kila kiumbe hai
  rationale: Hapa נֶפֶשׁ חַיָּה humaanisha kiumbe chenye uhai, si 'nafsi' katika maana ya kiteolojia ya baadaye.
- source_word: הָרֹמֶשֶׂת
  choice: kinachotembea
  rationale: Neno hili linaeleza mwendo kwa upana; 'kinachotembea' halibani maana kuwa kutambaa pekee.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: ambacho maji yalijaa nacho
  rationale: Usemi huu unaonyesha wingi wa viumbe vilivyojaa majini kwa Kiswahili cha kawaida.
- source_word: לְמִינֵהֶם
  choice: kwa aina zake
  rationale: Huhifadhi uainishaji wa viumbe katika simulizi la uumbaji na upatanisho wa wingi wa rejeleo.
- source_word: כָּל עוֹף כָּנָף
  choice: kila ndege mwenye mabawa
  rationale: Huwakilisha wazi nomino ya jamii ya ndege pamoja na sifa ya kuwa na mabawa.
- source_word: לְמִינֵהוּ
  choice: kwa aina yake
  rationale: Kiambishi cha umoja kinaendana na usemi wa kijumla 'kila ndege.'
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Mungu akaona kuwa ni vyema
  rationale: Huhifadhi kauli ya tathmini inayorudiwa katika Mwanzo 1 kwa Kiswahili cha heshima na cha asili.
theological_decisions:
- issue: Maana ya תַּנִּינִם katika muktadha wa uumbaji, yenye uwezekano wa mihusiano ya kimajazi au kihadithi
  choice: viumbe wakubwa wa baharini
  alternative: majitu makubwa ya baharini; majoka makubwa ya baharini
  rationale: Muktadha wa karibu unaorodhesha viumbe vya majini vilivyoumbwa na Mungu. Tafsiri kuu haiongezi dhana za kihadithi, lakini tanbihi huhifadhi upana halisi wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi unaoendelea umehifadhiwa kwa 'aka-', na utata halisi wa tanninim umeonyeshwa katika tanbihi.
