id: GEN.1.28
reference: Genesis 1:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: sw
  text: Mungu akawabariki, naye Mungu akawaambia, “Zaeni, mkaongezeke, mkaijaze dunia na kuitiisha; mtawale[a] samaki wa baharini, ndege wa angani, na kila kiumbe hai kinachotembea juu ya dunia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muwe na mamlaka juu ya.”
    reason: Mbadala huu unaonyesha maana ya utawala iliyo katika רדה, ingawa ‘mtawale’ ni fupi na ya kawaida zaidi katika matini kuu.
  - marker: b
    text: Au, “kila kiumbe hai kitambaacho duniani.”
    reason: ‘Kitambaacho’ ni tafsiri halali ya הָרֹמֶשֶׂת na hukazia mwendo juu ya ardhi, lakini inaweza kueleweka kwa maana nyembamba zaidi.
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: akawabariki
  rationale: Kitenzi hiki kinamaanisha Mungu aliwapa baraka, si kwamba alisema mema kuwahusu tu. ‘Akawabariki’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linaambatana na vitenzi vya umoja na humrejelea Mungu mmoja.
- source_word: פְּרוּ
  choice: Zaeni
  rationale: Amri hii inahusu kuwa na uzao. ‘Zaeni’ ni ya asili katika Kiswahili na inaeleza maana hiyo wazi.
- source_word: וּרְבוּ
  choice: mkaongezeke
  rationale: Kitenzi kinamaanisha kuongezeka kwa idadi. Umbo hili linaendeleza mfululizo wa amri kwa Kiswahili cha kawaida.
- source_word: וּמִלְאוּ
  choice: mkaijaze
  rationale: Maana ya msingi ni kujaza; kiambishi ‘-i-’ kinairejelea dunia kwa uwazi.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika simulizi la uumbaji wa ulimwengu mzima, neno hili linarejelea dunia, si eneo fulani la nchi.
- source_word: וְכִבְשֻׁהָ
  choice: na kuitiisha
  rationale: ‘Kuitiisha’ huhifadhi nguvu ya kitenzi cha Kiebrania, yaani kuifanya iwe chini ya mamlaka, bila kuongeza wazo la kuitunza tu au la kuitumia vibaya.
- source_word: וּרְדוּ
  choice: mtawale
  rationale: Kitenzi kinaeleza kutumia mamlaka ya kutawala. ‘Mtawale’ ni wazi, cha sasa, na hakidhoofishi nguvu ya agizo.
- source_word: בִּדְגַת הַיָּם
  choice: samaki wa baharini
  rationale: Kirai hiki kinawataja samaki hasa, si viumbe wote wa baharini kwa ujumla.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: ‘Ndege’ ndiyo maana ya kawaida katika muktadha huu, na ‘angani’ ni Kiswahili cha asili kwa eneo wanamoruka.
- source_word: בְכָל חַיָּה
  choice: kila kiumbe hai
  rationale: Neno hili lina maana pana ya kiumbe au mnyama hai; tafsiri hii hailibani kuwa wanyama wa porini pekee.
- source_word: הָרֹמֶשֶׂת
  choice: kinachotembea juu ya dunia
  rationale: Kitenzi kinahusu kusonga juu ya ardhi na kinaweza kutumiwa kwa viumbe vidogo. ‘Kinachotembea’ huhifadhi upana wake; ‘kitambaacho’ ni mbadala halali lakini mwembamba zaidi.
theological_decisions:
- issue: Nguvu ya agizo la mwanadamu kwa uumbaji katika כבש na רדה
  choice: Kudumisha lugha yenye nguvu ya mamlaka kwa ‘kuitiisha’ na ‘kutawala’.
  alternative: ‘Kuitunza’ au ‘kuwa wasimamizi wake’.
  rationale: Vitenzi vya Kiebrania vina nguvu kuliko utunzaji peke yake. Tafsiri haiongezi wazo la unyonyaji wala hailainishi agizo kuwa uwakili tu.
- issue: Upeo wa הָאָרֶץ
  choice: dunia
  alternative: nchi
  rationale: Muktadha wa Mwanzo 1 ni uumbaji wa ulimwengu wote; kwa hiyo agizo hili halihusu eneo maalumu la nchi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘Mungu’ yamedumishwa kwa sababu yako wazi katika Kiebrania, huku ‘naye’ ikifanya sentensi isomeke kwa kawaida. Mfululizo wa maumbo ‘mka-’ unaunganisha maagizo bila kuyageuza kuwa maelezo yasiyo ya amri.
