base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: sw
  text: Mungu akaona kuwa nuru ilikuwa njema, na Mungu akatenga[a] nuru na giza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akatenganisha nuru na giza”; kitenzi cha Kiebrania kinaweza pia kumaanisha kuweka tofauti kati ya vitu viwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi ראה katika mtiririko huu wa kisimulizi humaanisha ‘akaona’; pia kinabeba wazo la kutambua au kutathmini bila kulifanya wazi kupita kiasi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino hii ina umbo la wingi, hapa ina upatanisho wa kitenzi wa umoja na inamtaja Muumba mmoja.
- source_word: הָאוֹר
  choice: nuru
  rationale: ‘Nuru’ ni neno la kawaida na lenye hadhi linalorejelea nuru iliyotajwa katika mstari uliotangulia; Kiswahili hakihitaji kutafsiri kibainishi cha Kiebrania kwa neno tofauti.
- source_word: כִּי
  choice: kuwa
  rationale: Hapa כִּי inatanguliza yaliyotambuliwa na Mungu; ‘kuwa’ ni kiunganishi cha kawaida cha Kiswahili katika muundo huu.
- source_word: טוֹב
  choice: njema
  rationale: ‘Njema’ huhifadhi maana pana ya tathmini ya טוֹב bila kuibana kuwa yenye kupendeza au yenye manufaa pekee.
- source_word: וַיַּבְדֵּל
  choice: akatenga
  rationale: בדל humaanisha kutenga, kutenganisha, au kuweka tofauti. ‘Akatenga’ ni ya asili katika Kiswahili na haibainishi kama utengano huo ulikuwa wa mahali, wakati, au dhana.
- source_word: בֵּין ... וּבֵין
  choice: nuru na giza
  rationale: Baada ya kitenzi ‘kutenga,’ muundo huu wa Kiswahili huwasilisha kwa kawaida uhusiano unaoelezwa na Kiebrania ‘kati ya ... na kati ya ...’.
- source_word: הַחֹשֶׁךְ
  choice: giza
  rationale: ‘Giza’ ni tafsiri ya kawaida ya חֹשֶׁךְ na linarejelea giza lililotajwa tayari; kibainishi cha Kiebrania hakidai neno jingine katika Kiswahili.
theological_decisions:
- issue: Kurudiwa kwa kiima אֱלֹהִים katika vifungu vyote viwili
  choice: 'Kurudia ‘Mungu’: ‘Mungu akaona ... na Mungu akatenga ...’'
  alternative: 'Kutumia kiwakilishi katika kifungu cha pili: ‘naye akatenga ...’'
  rationale: Kiebrania kinataja Mungu waziwazi katika vifungu vyote viwili. Kurudia jina kunahifadhi mdundo na msisitizo wa chanzo bila kuongeza tafsiri ya kimafundisho.
- issue: Aina ya utengano kati ya nuru na giza
  choice: Kutumia ‘akatenga’ bila kueleza utengano ulifanyikaje
  alternative: ‘Akatenganisha’ au ‘akaweka tofauti kati ya’
  rationale: Andiko halisemi kama utengano huo ni wa mahali, wakati, au dhana. Tafsiri inaacha suala hilo wazi kama lilivyo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Muundo wa simulizi wa ‘aka-’ umehifadhi mwendelezo wa vitenzi vya Kiebrania, huku kurudiwa kwa ‘Mungu’ kukifuata chanzo.
