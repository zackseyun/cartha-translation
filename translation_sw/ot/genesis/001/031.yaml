base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: sw
  text: Mungu akaona kila kitu alichokifanya, na tazama, kilikuwa chema sana. Ikawa jioni, ikawa asubuhi—siku ya sita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi ראה katika umbo la masimulizi kina maana ya moja kwa moja ya ‘kuona’; hapa pia kinadokeza tathmini, bila kulazimisha maelezo hayo ndani ya tafsiri.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino hii ina umbo la wingi, hapa ina upatanisho wa kitenzi cha umoja na inamtaja Muumba mmoja; ‘Mungu’ ndiyo tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: kila kitu alichokuwa amefanya
  rationale: Hii inajumlisha uumbaji wote. ‘Alichokuwa amefanya’ huonyesha kwa kawaida katika Kiswahili kwamba kazi hiyo ilitangulia tathmini ya Mungu.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: הִנֵּה huvuta fikira za msomaji na kuleta msisitizo wa wazi; ‘tazama’ huhifadhi nguvu hiyo ya kimazungumzo na hadhi ya kifungu.
- source_word: טוֹב מְאֹד
  choice: chema sana
  rationale: טוֹב ni ‘chema/nzuri’ na מְאֹד hukitia nguvu. ‘Chema sana’ huhifadhi tathmini pana bila kuifunga kwenye wema wa kimaadili, uzuri wa kuonekana, au ufaafu wa kiutendaji pekee.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Ikawa jioni, ikawa asubuhi
  rationale: Muundo unaorudiwa huhifadhi fomula ya kufunga siku katika Mwanzo 1 na unasikika kwa kawaida na kwa hadhi katika Kiswahili.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: siku ya sita
  rationale: Nomino pamoja na namba ya mpangilio yenye uainisho hutafsiriwa kwa kawaida ‘siku ya sita.’
theological_decisions:
- issue: Asili ya wema wa uumbaji katika טוֹב מְאֹד
  choice: chema sana
  alternative: nzuri sana; chema kupita kiasi
  rationale: ‘Chema sana’ huhifadhi uthibitisho mpana wa maandiko kuhusu uumbaji bila kuamua kwamba wema huo ni wa kimaadili, wa uzuri, au wa kiutendaji pekee.
- issue: Fomula ya siku na mijadala kuhusu siku za uumbaji
  choice: Ikawa jioni, ikawa asubuhi—siku ya sita
  alternative: Kulikuwa na jioni, kukawa na asubuhi, siku ya sita
  rationale: Tafsiri inafuata kwa karibu mpangilio wa Kiebrania bila kuongeza maelezo yanayoamua urefu au kazi ya kifasihi ya siku hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi kueleweka na yenye hadhi. ‘Tazama’ limedumishwa kwa sababu ya msisitizo wa הִנֵּה; ‘chema’ limetumiwa badala ya ‘nzuri’ ili kutoa tathmini pana na inayolingana vizuri na ngeli ya ‘kitu.’ Hakuna tanbihi zinazohitajika.
