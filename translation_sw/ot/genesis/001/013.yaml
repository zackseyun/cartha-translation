translation:
  language: sw
  text: Ikawa jioni, ikawa asubuhi—siku ya tatu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ikawa
  rationale: Katika kibwagizo hiki cha simulizi, kitenzi היה pamoja na waw mfululizo kinaonyesha kutokea kwa hatua inayofuata. “Ikawa” ni ya asili katika Kiswahili cha Biblia na huhifadhi urudiaji na mwendo wa Kiebrania.
- source_word: עֶרֶב
  choice: jioni
  rationale: Neno hili humaanisha jioni au wakati wa machweo; “jioni” ndilo neno la kawaida na wazi katika kibwagizo hiki.
- source_word: בֹּקֶר
  choice: asubuhi
  rationale: Neno hili humaanisha asubuhi; uchaguzi huu huhifadhi ulinganifu wa moja kwa moja na “jioni.”
- source_word: יוֹם
  choice: siku
  rationale: Katika muktadha huu, neno hili hutaja siku iliyohesabiwa katika mfuatano wa simulizi la uumbaji.
- source_word: שְׁלִישִׁי
  choice: ya tatu
  rationale: Ni kivumishi cha mpangilio kinachomaanisha “ya tatu” na kuelezea “siku.”
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Ikawa jioni, ikawa asubuhi
  rationale: Kurudia “ikawa” huhifadhi muundo, mdundo, na kibwagizo cha Kiebrania, huku sentensi ikibaki ya kawaida na inayoeleweka katika Kiswahili.
theological_decisions:
- issue: Kutafsiri kibwagizo cha siku ya uumbaji bila kuingiza msimamo maalumu kuhusu mpangilio au urefu wake
  choice: Ikawa jioni, ikawa asubuhi—siku ya tatu.
  alternative: Ikawa jioni, ikawa asubuhi, siku ya tatu.
  rationale: Tafsiri hii huonyesha wazi mfuatano wa simulizi bila kuamua ikiwa “siku” zinapaswa kufasiriwa kwa namna fulani ya kiakili, kifasihi, au kikronolojia. Kistari kirefu husaidia usomaji tu na hakiongezi dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na rahisi kueleweka. Muundo wa kibwagizo cha Kiebrania umehifadhiwa bila kuwa mgumu kwa msomaji wa kawaida.
