base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: sw
  text: Mungu akamuumba mwanadamu kwa mfano wake[a]; kwa mfano wa Mungu alimuumba; mwanamume na mwanamke aliwaumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “ubinadamu”: Neno la Kiebrania adam hapa liko katika umoja lakini linawakilisha jamii yote ya wanadamu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: akamuumba / alimuumba / aliwaumba
  rationale: Kitenzi “umba” ndicho neno la kawaida la Kiswahili kwa uumbaji wa Mungu; kurudiwa mara tatu kunahifadhi msisitizo na muundo wa Kiebrania, huku viambishi vya yambwa vikionyesha mabadiliko kutoka umoja kwenda wingi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania lina sura ya wingi, kitenzi cha umoja hapa kinaonyesha Mungu mmoja; “Mungu” ni tafsiri ya kawaida na sahihi.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: Hapa nomino ya umoja inawakilisha jamii yote ya wanadamu, kama inavyothibitishwa na mabadiliko ya baadaye kwenda “aliwaumba.” “Mwanadamu” ni ya asili katika Kiswahili na inaweza kumaanisha binadamu kwa uwakilishi bila kumwekea jinsia ya kiume pekee.
- source_word: בְּצַלְמוֹ
  choice: kwa mfano wake
  rationale: “Kwa mfano wake” ni usemi wa kawaida na wenye hadhi unaowasilisha בְּ pamoja na צֶלֶם bila kuamua zaidi ikiwa maana ni “katika” au “kama”; “wake” inamrejelea Mungu.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: kwa mfano wa Mungu
  rationale: Kurudiwa kwa “mfano” kunahifadhi usambamba na msisitizo wa kifungu cha Kiebrania.
- source_word: אֹתוֹ
  choice: -mu- katika “alimuumba”
  rationale: Kiambishi cha yambwa cha umoja kinahifadhi kurejelewa kwa הָאָדָם kama mwanadamu wa uwakilishi.
- source_word: זָכָר וּנְקֵבָה
  choice: mwanamume na mwanamke
  rationale: Katika Kiswahili cha kawaida, jozi hii huwasilisha kwa uwazi tofauti ya kijinsia ya זָכָר וּנְקֵבָה. “Wa kiume na wa kike” ingekuwa ya karibu zaidi kimuundo lakini si ya asili sana inapowarejelea watu katika sentensi hii.
- source_word: אֹתָם
  choice: -wa- katika “aliwaumba”
  rationale: Kiambishi cha yambwa cha wingi kinahifadhi mabadiliko ya makusudi kutoka mwanadamu wa uwakilishi katika umoja kwenda watu katika wingi.
theological_decisions:
- issue: Uwasilishaji wa אָדָם katika muktadha wa mwanadamu anayewakilisha jamii yote
  choice: mwanadamu
  alternative: binadamu wote; huyo mtu
  rationale: Kiebrania hutumia umoja wenye viwakilishi vya umoja, kisha hubadilika kwenda wingi katika “aliwaumba.” “Mwanadamu” huhifadhi umoja huo na maana ya jamii ya wanadamu bila kuufanya mstari umhusu mwanamume mmoja tu. Tanbihi inaweka wazi matumizi haya ya uwakilishi.
- issue: Maana ya בְּ katika vifungu vya “mfano”
  choice: kwa mfano wake / kwa mfano wa Mungu
  alternative: katika mfano wake; akiwa mfano wake
  rationale: “Kwa mfano” ni Kiswahili cha kawaida cha usemi huu na hakilazimishi tafsiri ya kwamba mwanadamu ndiye mfano wenyewe, wala hakifuti uhusiano unaoelezwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa vipashio vitatu na urudiaji wa “umba” na “mfano” umehifadhiwa. Alama [a] imewekwa mara moja baada ya kifungu kinachohusika.
