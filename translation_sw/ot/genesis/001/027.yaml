revisions:
- from: Kwa hiyo Mungu akamuumba mwanadamu kwa mfano wake[a]; kwa mfano wa Mungu alimuumba; mwanamume na mwanamke aliwaumba.
  to: Mungu akamuumba mwanadamu kwa mfano wake[a]; kwa mfano wa Mungu alimuumba; mwanamume na mwanamke aliwaumba.
  rationale: The revision removes the unsupported inferential force of “Kwa hiyo” while retaining the source’s threefold repetition, singular representative wording, and final plural. The footnote is adjusted to give a direct, natural collective alternative in Kiswahili.
  reviewer_model: gpt-5.6-terra
