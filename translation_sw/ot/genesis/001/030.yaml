  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: sw
  text: Na kwa kila mnyama wa nchi, na kwa kila ndege wa angani, na kwa kila kiumbe kitambaacho juu ya nchi chenye uhai, kila mmea wa kijani ni chakula. Ikawa hivyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: mnyama wa nchi
  rationale: Hutaja wanyama wa nchi kwa ujumla bila kuongeza wazo la kwamba wote ni wanyama wa porini.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: Ni Kiswahili cha kawaida na cha sasa kwa viumbe warukao katika anga katika muktadha huu.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: kila kiumbe kitambaacho juu ya nchi
  rationale: Hudumisha picha halisi ya viumbe wanaotambaa au kwenda karibu na ardhi, huku 'kiumbe' ikifanya kishazi kiwe cha kawaida.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: ambacho kina uhai
  rationale: נֶפֶשׁ חַיָּה hapa humaanisha kiumbe au uhai ulio hai, si נִשְׁמַת חַיִּים, yaani 'pumzi ya uhai.' Tafsiri hii ni ya asili na haichanganyi semi hizo mbili.
- source_word: כָל יֶרֶק עֵשֶׂב
  choice: kila mmea wa kijani
  rationale: Huwasilisha mimea ya kijani inayotolewa kuwa chakula kwa lugha wazi ya kisasa.
- source_word: לְאָכְלָה
  choice: utakuwa chakula
  rationale: Kirai kihusishi kinaonyesha kusudi, 'kwa ajili ya chakula'; kitenzi kimejazwa kwa Kiswahili ili sentensi ikamilike, kwa kuzingatia tamko la mstari uliotangulia.
- source_word: וַיְהִי כֵן
  choice: Ikawa hivyo
  rationale: Ni fomula fupi, ya kawaida na yenye hadhi inayotumiwa kuonyesha kutimia kwa tamko katika Mwanzo 1.
theological_decisions:
- issue: Maana ya נֶפֶשׁ חַיָּה kuhusu wanyama
  choice: kina uhai
  alternative: ndani yake mna kiumbe hai; kina nafsi hai
  rationale: Kirai hiki kinatambulisha uhai wa kiumbe. 'Pumzi ya uhai' ingehamisha hapa kirai tofauti cha Kiebrania cha Mwanzo 2:7. 'Nafsi hai' inawezekana kwa ukaribu wa kimuundo lakini katika Kiswahili inaweza kuingiza maana nzito ya kiteolojia isiyolazimishwa na muktadha.
- issue: Kitenzi kinachoeleweka katika kifungu cha chakula
  choice: utakuwa chakula
  alternative: nimewapa kuwa chakula; ni chakula
  rationale: Kiebrania cha mstari huu hakirudii kitenzi נָתַתִּי cha mstari wa 29, lakini muundo wake unategemea muktadha huo. Kiswahili kinahitaji kiarifu wazi; wakati ujao huwasilisha agizo au mpango wa Mungu bila kudai kwamba kitenzi hicho kimeandikwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka. Urudiaji wa 'na kwa kila' umehifadhiwa ili kudumisha mwendo na msisitizo wa Kiebrania.
