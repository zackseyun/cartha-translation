  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: sw
  text: Mungu akafanya wanyama wa porini kwa aina zao[a], mifugo kwa aina zake, na kila kiumbe kitambaacho ardhini kwa aina yake[b][c]. Mungu akaona kwamba ilikuwa vyema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanyama wa mwitu wa nchi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina “kwa aina yake” au “kwa aina zao.” Hapa “aina” humaanisha makundi ya viumbe; si lazima ilinganishwe na uainishaji wa kisasa wa kisayansi.
    reason: cultural_note
  - marker: c
    text: Au, “kila kiumbe kitambaacho juu ya ardhi.” Kiebrania hutumia neno tofauti hapa na lile lililotumiwa mapema katika mstari kwa “nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה humaanisha kwa kawaida ‘kufanya’ au ‘kutengeneza.’ ‘Akafanya’ ni cha moja kwa moja na cha asili katika muktadha wa uumbaji bila kuongeza wazo lisilo wazi katika Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika Mwanzo 1, nomino hii yenye umbo la wingi inaambatana na kitenzi cha umoja na humrejelea Muumba mmoja; ‘Mungu’ ndiyo tafsiri sanifu ya Kiswahili.
- source_word: חַיַּת הָאָרֶץ
  choice: wanyama wa mwituni
  rationale: Kirai hiki kinamaanisha wanyama wa nchi kavu wasiofugwa, wanaotofautishwa na mifugo na viumbe watambaao. ‘Wanyama wa mwituni’ huonyesha tofauti hiyo kwa Kiswahili cha sasa na cha kawaida.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: kwa aina zao / kwa aina zake / kwa aina yake
  rationale: מין humaanisha aina au kundi. ‘Kwa aina...’ huhifadhi maana bila kuingiza uainishaji wa kisasa wa kisayansi; viwakilishi vimepatana na ngeli za nomino za Kiswahili.
- source_word: הַבְּהֵמָה
  choice: mifugo
  rationale: בהמה hapa inarejelea hasa wanyama wakubwa wanaofugwa, tofauti na wanyama wa mwituni. ‘Mifugo’ ni neno wazi na pana kuliko ‘ng’ombe.’
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: kila kiumbe kitambaacho ardhini
  rationale: רמש hurejelea viumbe vidogo vinavyosonga karibu na ardhi. ‘Kiumbe kitambaacho’ ni cha asili kuliko nomino ‘kitambaacho’ peke yake, na ‘ardhini’ hudumisha tofauti ya הָאֲדָמָה na הָאָרֶץ.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Mungu akaona kwamba ilikuwa vyema
  rationale: Hiki ndicho kibwagizo cha tathmini katika Mwanzo 1. ‘Ilikuwa vyema’ ni Kiswahili cha kawaida chenye hadhi na hakiongezi kiashiria kisichokuwamo katika chanzo.
theological_decisions:
- issue: Kutafsiri makundi ya viumbe bila kuingiza uainishaji wa kisasa wa kisayansi
  choice: aina
  alternative: spishi
  rationale: Neno la Kiebrania מין humaanisha aina au kundi. ‘Aina’ huhifadhi uainishaji wa andiko lenyewe bila kulifanya neno hilo lilingane kimakosa na dhana ya kisasa ya spishi za kibiolojia.
- issue: Kutofautisha הָאָרֶץ na הָאֲדָמָה katika mstari mmoja
  choice: wa mwituni ... ardhini
  alternative: wa nchi ... wa nchi
  rationale: ‘Ardhini’ kwa הָאֲדָמָה huhifadhi wazo la sehemu ya chini au udongo ambako viumbe hutambaa. Katika חַיַּת הָאָרֶץ, tafsiri ya kimuktadha ‘wanyama wa mwituni’ huwasilisha kundi la wanyama wa nchi kavu wasiofugwa bila kulazimisha urudiaji usio wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetumia ‘aka-’ kwa mwendelezo wa matendo. ‘Wanyama wa mwituni,’ ‘mifugo,’ na ‘viumbe watambaao’ yanadumisha makundi matatu ya Kiebrania kwa lugha inayoeleweka kwa wasomaji wa kawaida.
