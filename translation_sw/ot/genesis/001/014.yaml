  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: sw
  text: Mungu akasema, “Na kuwe na mianga katika anga la mbingu ili kutenganisha mchana na usiku; nayo iwe kwa ishara, kwa nyakati zilizowekwa, na kwa siku na miaka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְאֹרֹת
  choice: mianga
  rationale: Neno hili linamaanisha vitu vinavyotoa au kubeba nuru. “Mianga” ni la kawaida na linafaa kwa muktadha wa jua, mwezi, na nyota bila kutumia istilahi nzito.
- source_word: רָקִיעַ
  choice: anga
  rationale: Katika Kiswahili cha kawaida, “anga” hueleza eneo lililotandazwa juu ya dunia kwa urahisi, bila kuingiza picha maalumu ya kuba ngumu.
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: “Mbingu” huhifadhi maana ya eneo la juu na hadhi ya kifasihi ya simulizi, huku kirai “anga la mbingu” kikifuata muundo wa Kiebrania.
- source_word: לְהַבְדִּיל
  choice: ili kutenganisha
  rationale: Infinitivu inaonyesha kusudi; “ili kutenganisha” ni ya asili na huhifadhi wazo linalorudiwa la kutenga katika Mwanzo 1.
- source_word: בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: mchana na usiku
  rationale: Baada ya kitenzi “kutenganisha,” muundo huu ni wa kawaida katika Kiswahili na unawakilisha pande mbili zilizotajwa katika Kiebrania.
- source_word: לְאֹתֹת
  choice: iwe ishara
  rationale: “Ishara” huacha maana pana ya vitu vinavyotumika kama alama au viashiria bila kuibana kwa matumizi fulani.
- source_word: לְמוֹעֲדִים
  choice: iwe ya kuonyesha nyakati zilizowekwa
  rationale: Huhifadhi maana pana ya nyakati maalumu au zilizoteuliwa, na huepuka kuibana kuwa majira ya hali ya hewa au sikukuu za ibada pekee.
- source_word: לְיָמִים וְשָׁנִים
  choice: siku na miaka
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya vipimo viwili vya wakati vilivyotajwa.
- source_word: יְהִי ... וְהָיוּ
  choice: Na kuwe na ... nayo iwe
  rationale: Muundo huu huhifadhi mtindo wa amri ya uumbaji. Umoja wa kisarufi katika “nayo iwe” unapatana na ngeli ya “mianga” katika Kiswahili, ingawa marejeo yake ni mengi.
theological_decisions:
- issue: Maana ya מוֹעֲדִים katika muktadha wa uumbaji
  choice: nyakati zilizowekwa
  alternative: majira; sikukuu
  rationale: Muktadha unahusu mpangilio wa ulimwengu na upimaji wa wakati. Tafsiri hii huhifadhi uwezekano wa neno hilo kujumuisha nyakati za sherehe mahali pengine bila kuingiza maana ya kiibada kwa lazima hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Anga la mbingu” limetumiwa kuhifadhi uhusiano wa maneno ya chanzo; “nyakati zilizowekwa” huhifadhi upana wa maana bila kuamua kuwa ni majira au sikukuu pekee.
