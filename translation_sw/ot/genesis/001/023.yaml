  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: sw
  text: Ikawa jioni, ikawa asubuhi—siku ya tano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kulikuwa na jioni, kulikuwa na asubuhi—siku ya tano.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ikawa
  rationale: Katika kibwagizo hiki cha masimulizi, kitenzi hiki kinaonyesha kutokea au kuwapo kwa hali. “Ikawa” ni cha asili katika Kiswahili, kinadumisha urudiaji wa Kiebrania, na hakiongezi ufafanuzi usiokuwamo.
- source_word: עֶרֶב
  choice: jioni
  rationale: Neno hili humaanisha jioni; “jioni” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: בֹקֶר
  choice: asubuhi
  rationale: Neno hili humaanisha asubuhi; uchaguzi huu unahifadhi ulinganifu wa “jioni” na “asubuhi.”
- source_word: יוֹם
  choice: siku
  rationale: Hapa neno hili linaitaja siku ya uumbaji kwa namba. “Siku” ni kisawe cha moja kwa moja bila kuamua kimbele urefu au asili yake.
- source_word: חֲמִישִׁי
  choice: ya tano
  rationale: Ni namba ya mpangilio inayohusiana na “siku”; “ya tano” ndiyo namna ya kawaida na sahihi katika Kiswahili.
theological_decisions:
- issue: Asili ya kibwagizo cha siku ya uumbaji
  choice: Kudumisha maneno ya wakati, “Ikawa jioni, ikawa asubuhi—siku ya tano,” bila kufasiri urefu au asili ya siku hiyo.
  alternative: Kutafsiri kwa namna inayodokeza wazi siku ya saa 24, au kwa namna inayodokeza enzi ndefu.
  rationale: Kiebrania kina kibwagizo cha jioni na asubuhi pamoja na siku yenye namba, lakini mstari wenyewe hautatui mijadala ya baadaye kuhusu muda au muundo wa kifasihi wa siku za uumbaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi, na rahisi kueleweka. Urudiaji wa muundo wa Kiebrania umehifadhiwa. Alama ya tanbihi [a] imewekwa katika maandishi.
