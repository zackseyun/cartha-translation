  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kiebrania: Mungu anaita nuru mchana na giza usiku, kisha hurudiwa fomula ya jioni na asubuhi. “Siku ya kwanza” ni ufasiri wa kawaida wa יוֹם אֶחָד katika mfuatano huu, na tanbihi huhifadhi kwa usahihi umbo la Kiebrania “siku moja.”'
  naturalness: Kiswahili ni sanifu, cha asili, na kina mdundo unaofaa kwa simulizi la Biblia. “Mchana” na “usiku” ni jozi ya kawaida kwa kipindi cha nuru na kipindi cha giza katika muktadha huu. Muundo “Mungu akaiita nuru mchana, na giza akaliita usiku” unaeleweka vizuri bila kuhitaji kuongeza “kuwa.”
  terminology: “Mungu,” “nuru,” “giza,” “mchana,” “usiku,” “jioni,” na “asubuhi” ni istilahi sahihi na za register inayofaa. Herufi kubwa katika “Mchana” na “Usiku” zinaweza kuashiria majina yaliyotolewa; hazibadili maana. Alama ya tanbihi [a] ipo mahali sahihi na tanbihi yake inalingana na tofauti ya kileksika inayokusudiwa.
