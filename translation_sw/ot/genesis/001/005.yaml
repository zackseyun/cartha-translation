  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לָ/אוֹר֙ י֔וֹם וְ/לַ/חֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם אֶחָֽד׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: sw
  text: Mungu akaiita nuru Mchana, na giza akaliita Usiku. Ikawa jioni, ikawa asubuhi—siku ya kwanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “siku moja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akaiita
  rationale: Kitenzi קרא katika muundo wa kutaja jina kina maana ya ‘kuita/kupa jina’; ‘akaiita’ ni ya kawaida na inadumisha namna ya usemi wa Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino hii ina umbo la wingi, hapa ina upatanisho wa kitenzi cha umoja na humrejelea Muumba mmoja.
- source_word: לָאוֹר
  choice: nuru
  rationale: Katika muundo huu kihusishi ל־ huonyesha kitu kinachopewa jina; Kiswahili cha kawaida hutumia ‘kuiita nuru’ bila kuiga kihusishi hicho moja kwa moja.
- source_word: יוֹם
  choice: Mchana
  rationale: Hapa יוֹם ni jina linalopewa nuru na, likilinganishwa na ‘Usiku,’ humaanisha kipindi chenye nuru; ‘Mchana’ huzuia kuchanganya jina hili na ‘siku’ ya fomula ya mwisho.
- source_word: וְלַחֹשֶׁךְ
  choice: na giza
  rationale: Muundo sambamba unaonyesha giza kuwa kitu cha pili kinachopewa jina; ‘na giza akaliita’ ni Kiswahili cha asili.
- source_word: קָרָא
  choice: akaliita
  rationale: Kurudia kitenzi kunahifadhi usambamba na mdundo wa Kiebrania.
- source_word: לָיְלָה
  choice: Usiku
  rationale: Hili ndilo jina linalopewa giza; herufi kubwa inaashiria tendo la kutaja jina.
- source_word: וַיְהִי עֶרֶב
  choice: Ikawa jioni
  rationale: ‘Ikawa’ hudumisha mfuatano wa simulizi na fomula inayorudiwa, huku עֶרֶב ikitafsiriwa kwa maana yake ya kawaida ‘jioni.’
- source_word: וַיְהִי בֹקֶר
  choice: ikawa asubuhi
  rationale: Tafsiri hii inadumisha urudiaji wa Kiebrania na kutumia maana ya kawaida ya בֹקֶר.
- source_word: יוֹם אֶחָד
  choice: siku ya kwanza
  rationale: Kiswahili cha kawaida hutumia namba ya mpangilio katika mfululizo huu; tafsiri halisi zaidi ‘siku moja’ imehifadhiwa katika tanbihi kwa kuwa Kiebrania hutumia namba ya kuhesabu ‘moja.’
theological_decisions:
- issue: Tafsiri ya יוֹם אֶחָד mwishoni mwa fomula ya siku ya uumbaji
  choice: siku ya kwanza
  alternative: siku moja
  rationale: Kiebrania hutumia אֶחָד, ‘moja,’ si namba ya mpangilio ‘kwanza.’ Hata hivyo, katika Kiswahili simulizi hili linaeleweka kwa kawaida kama mwanzo wa mfululizo kwa kusema ‘siku ya kwanza.’ Kwa kuwa tofauti ya umbo inaweza kuwa na umuhimu wa kifasiri, ‘siku moja’ imeonyeshwa katika tanbihi bila kulazimisha hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. ‘Mchana’ na ‘Usiku’ hutofautisha majina ya nuru na giza, huku ‘siku’ ikibaki katika fomula ya mwisho. Usambamba wa ‘akaiita/akaliita’ na ‘ikawa/ikawa’ umehifadhiwa.
