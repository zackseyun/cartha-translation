base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: sw
  text: 'Mungu akafanya mianga miwili mikubwa: mwanga mkubwa zaidi utawale mchana, na mwanga mdogo zaidi utawale usiku, na nyota.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה kwa kawaida humaanisha ‘kufanya’ au ‘kutengeneza.’ ‘Akafanya’ ni tafsiri ya moja kwa moja na haiongezi dhana ya ‘kuweka’ ambayo inatokana na kazi ya mianga katika muktadha.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika Mwanzo 1, אֱלֹהִים linapotumiwa pamoja na kitenzi cha umoja humrejelea Mungu mmoja; ‘Mungu’ ndiyo tafsiri sanifu ya Kiswahili.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: mianga miwili mikubwa
  rationale: מָאוֹר ni kitu kinachotoa au kubeba nuru. ‘Mianga’ ni neno la kawaida na lenye kueleweka, huku ‘mikubwa’ likiwakilisha גְּדֹלִים kwa uwazi.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: mwanga mkubwa zaidi
  rationale: Ingawa muundo wa Kiebrania ni ‘mwanga mkubwa,’ jozi inayotofautisha mkubwa na mdogo inaelezwa kwa Kiswahili cha kawaida kwa ‘mkubwa zaidi’ na ‘mdogo zaidi.’
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: utawale mchana
  rationale: מֶמְשֶׁלֶת lina maana ya utawala. Muundo ‘utawale mchana’ ni mfupi, wa asili, na unaendeleza kusudi linaloonyeshwa na לְ.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: mwanga mdogo zaidi
  rationale: קָטֹן humaanisha mdogo. ‘Mdogo zaidi’ hudumisha ulinganisho wenye uwiano na ‘mkubwa zaidi.’
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: utawale usiku
  rationale: Huu ni muundo uleule wa kishazi kilichotangulia; ‘utawale usiku’ hudumisha maana na ulinganifu.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: pamoja na nyota
  rationale: Kiunganishi pamoja na kiashiria cha yambwa huongeza kitu kingine kilichofanywa. ‘Pamoja na nyota’ huwasilisha nyongeza hiyo kwa Kiswahili cha asili bila kuifanya kuwa kishazi kipya.
theological_decisions:
- issue: Kutaja miili ya angani bila kutumia majina ya jua na mwezi
  choice: Kudumisha ‘mwanga mkubwa zaidi’ na ‘mwanga mdogo zaidi.’
  alternative: jua na mwezi
  rationale: Kiebrania kimetumia מָאוֹר (‘mwanga/kitu chenye kutoa mwanga’), si majina ya kawaida ya jua na mwezi. Kudumisha mtindo huo huheshimu uchaguzi wa maneno wa matini asili na hakupachiki maneno yasiyomo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku ukidumisha urudiaji na ulinganifu wa Kiebrania. Hakuna tanbihi iliyohitajika; maana ya kuongeza nyota imewasilishwa wazi kwa ‘pamoja na nyota.’
