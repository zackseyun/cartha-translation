  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: sw
  text: Mungu akaliita anga[b] “Mbingu”[a]. Ikawa jioni, ikawa asubuhi—siku ya pili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Anga.” Neno la Kiebrania שָׁמַיִם linaweza kurejelea anga au mbingu; hapa ndilo jina ambalo Mungu analipa anga.
    reason: lexical_alternative
  - marker: b
    text: Au “eneo lililotandazwa” au “kuba.” Neno la Kiebrania רָקִיעַ hurejelea kitu kilichotandazwa au kupanuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akaliita
  rationale: Kitenzi קרא pamoja na ל hapa kinaonyesha kumpa kitu jina. “Akaliita” ni usemi wa kawaida wa Kiswahili unaohifadhi tendo la kutaja jina.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kisarufi, kitenzi chake ni cha umoja na katika muktadha huu linamtaja Muumba mmoja.
- source_word: לָרָקִיעַ
  choice: lile eneo lililotandazwa
  rationale: רָקִיעַ hutokana na wazo la kitu kilichotandazwa au kupanuliwa. Tafsiri hii inaonyesha maana hiyo bila kulazimisha picha maalumu ya kiumbo kama “kuba”; “lile” hurejelea kitu kilichoumbwa katika mstari uliotangulia.
- source_word: שָׁמָיִם
  choice: Mbingu
  rationale: Hili ndilo jina ambalo Mungu analipa eneo lililotandazwa. “Mbingu” huhifadhi hadhi ya simulizi na upana wa neno la Kiebrania, ambalo linaweza kurejelea anga au mbingu.
- source_word: וַיְהִי
  choice: ikawa
  rationale: “Ikawa” ni mtiririko wa asili wa kisimulizi na unafaa katika kibwagizo kinachorudiwa kuhusu siku za uumbaji.
- source_word: עֶרֶב
  choice: jioni
  rationale: Ni tafsiri ya kawaida na wazi ya עֶרֶב katika kibwagizo cha siku za uumbaji.
- source_word: בֹקֶר
  choice: asubuhi
  rationale: Ni tafsiri ya kawaida na wazi ya בֹקֶר katika kibwagizo cha siku za uumbaji.
- source_word: יוֹם שֵׁנִי
  choice: siku ya pili
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kutaja siku kwa mpangilio, huku ikihifadhi maana ya namba ya daraja ya Kiebrania.
theological_decisions:
- issue: Maana ya jina שָׁמָיִם linalopewa רָקִיעַ
  choice: Mbingu
  alternative: Anga
  rationale: “Mbingu” hudumisha mtindo wa juu wa simulizi na kutofunga neno kwenye anga linaloonekana pekee. Tanbihi inahifadhi uwezekano wa “anga” bila kuingiza mpangilio wa baadaye wa kikosmolojia.
- issue: Taswira inayohusishwa na רָקִיעַ
  choice: eneo lililotandazwa
  alternative: anga; kuba
  rationale: Uchaguzi huu unaweka wazi wazo la msingi la kitu kilichotandazwa, lakini hauamui kwamba maandishi yanafundisha muundo maalumu wa anga. “Kuba” inawezekana kama taswira, ila ni tafsiri yenye ufasiri mkubwa zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisimulizi. “Lile eneo lililotandazwa” ni wazi zaidi kuhusu maana ya msingi ya רָקִיעַ kuliko neno “anga” pekee, huku “Mbingu” likitumiwa kama jina rasmi ndani ya sentensi.
