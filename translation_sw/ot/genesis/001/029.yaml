  terminology: “Tazama,” “nimewapa,” “mmea,” “dunia yote,” na “chakula chenu” zinafaa kwa Kiswahili Sanifu na kwa rejista ya kifungu. Hakuna istilahi ya kiteolojia inayohitaji kubadilishwa.
