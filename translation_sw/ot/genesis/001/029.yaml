  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: sw
  text: Mungu akasema, “Tazama[a], nimewapa kila mmea[b] unaotoa mbegu ulio juu ya uso wa dunia yote, na kila mti wenye tunda lenye mbegu[c]. Vyote hivyo vitakuwa chakula chenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Angalieni.” Neno la Kiebrania הִנֵּה linavuta usikivu kwa jambo linalofuata.
    reason: lexical_alternative
  - marker: b
    text: Au, “kila aina ya uoto unaotoa mbegu.” Neno עֵשֶׂב linaweza kumaanisha uoto kwa maana pana.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “kila mti ambamo mna tunda la mti linalotoa mbegu.”'
    reason: formal_rendering
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha kawaida na chenye hadhi kinachovuta usikivu wa wasikilizaji kwa jambo linalofuata, bila kutumia lugha nzito isiyo ya kawaida.
- source_word: נָתַתִּי
  choice: nimewapa
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo lililokamilika lenye matokeo ya sasa; pia kiambishi -wa- kinaonyesha kwamba Mungu anawaambia watu zaidi ya mmoja.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: kila mmea unaotoa mbegu
  rationale: עֵשֶׂב hapa ni uoto kwa maana pana, si lazima majani ya viungo; usemi huu ni wa asili katika Kiswahili na unaonyesha hali ya kutoa mbegu.
- source_word: אֲשֶׁר עַל־פְּנֵי כָל־הָאָרֶץ
  choice: ulio juu ya uso wa dunia yote
  rationale: Inahifadhi taswira ya Kiebrania ya kuwa juu ya uso wa nchi/dunia na, katika muktadha wa uumbaji, 'dunia yote' inaeleweka kwa urahisi.
- source_word: כָּל הָעֵץ
  choice: kila mti
  rationale: Muundo wa כָּל pamoja na nomino ya umoja una maana ya kugawa mmoja mmoja, ambayo 'kila mti' huiwasilisha vizuri.
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: wenye tunda linalotoa mbegu
  rationale: Umetoa Kiswahili cha asili huku ukihifadhi jambo kuu kwamba tunda lililo katika mti lina mbegu; tanbihi inaonyesha muundo wa karibu zaidi na Kiebrania.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: Vyote hivyo vitakuwa chakula chenu
  rationale: Kiwakilishi cha kijumla 'vyote hivyo' kinarejelea mimea na miti iliyotajwa, huku 'chakula chenu' kikieleza wazi kusudi la zawadi hiyo kwa wale wanaosemeshwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Tazama' huhifadhi nguvu ya kuvuta usikivu; 'mmea' huepuka kuifanya עֵשֶׂב kuwa mimea ya viungo pekee. Upatanisho wa wingi katika sentensi ya mwisho ni wa asili katika Kiswahili, ingawa Kiebrania hutumia kitenzi cha umoja kwa vitu vilivyotajwa kwa ujumla.
