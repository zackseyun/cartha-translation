  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם רְבִיעִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: sw
  text: Ikawa jioni, ikawa asubuhi—siku ya nne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Ikawa jioni na ikawa asubuhi, siku ya nne.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ikawa
  rationale: Katika kibwagizo hiki cha simulizi, kitenzi היה kinaonyesha kutokea kwa jioni na asubuhi na kukamilika kwa siku; “ikawa” ni ya asili katika Kiswahili na hudumisha mwendo wa Kiebrania bila kulazimisha maana ya mabadiliko.
- source_word: עֶרֶב
  choice: jioni
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa kipindi cha jioni katika Kiswahili sanifu.
- source_word: וַיְהִי
  choice: ikawa
  rationale: Kurudia tafsiri ileile kunahifadhi urari na kibwagizo cha Kiebrania.
- source_word: בֹּקֶר
  choice: asubuhi
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa wakati wa asubuhi.
- source_word: יוֹם רְבִיעִי
  choice: siku ya nne
  rationale: Muundo huu wa Kiswahili hutambulisha siku kwa namba ya mpangilio kwa njia ya kawaida, wazi na yenye hadhi.
theological_decisions:
- issue: Kutafsiri kibwagizo cha siku ya uumbaji bila kuingiza msimamo maalumu kuhusu mpangilio wa nyakati au urefu wa siku hizo
  choice: Ikawa jioni, ikawa asubuhi—siku ya nne.
  alternative: Ikawa jioni na ikawa asubuhi, siku ya nne.
  rationale: Tafsiri inahifadhi maneno na urari wa kibwagizo cha Kiebrania bila kuamua mjadala mpana kuhusu asili au muda wa siku za uumbaji. Kistari kinatenganisha kwa uwazi utambulisho wa siku bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, rahisi kueleweka na yenye hadhi. Urudiaji wa “ikawa” umehifadhiwa ili kuonyesha kibwagizo cha simulizi la Kiebrania.
