base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: sw
  text: na kutawala juu ya mchana na juu ya usiku, na kutenganisha nuru na giza.[a] Mungu akaona kwamba ni vyema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kutofautisha kati ya nuru na giza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: na kutawala
  rationale: Muundo wa kiunganishi pamoja na kitenzi-jina unaendeleza kusudi la mianga iliyotajwa katika mstari uliotangulia. “Kutawala” ni Kiswahili cha kawaida kinachohifadhi wazo la jukumu la kuongoza bila kudokeza kwamba mianga ni miungu.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: mchana na usiku
  rationale: Jozi hii ya kawaida katika Kiswahili inawakilisha vipindi viwili vinavyotawaliwa na mianga. Katika muktadha huu “mchana” ni ya asili zaidi kuliko “siku,” ambayo pia inaweza kumaanisha kipindi cha saa ishirini na nne.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: na kutenganisha
  rationale: בדל katika simulizi hili hueleza kuwekwa kwa mpaka au tofauti kati ya sehemu za uumbaji. “Kutenganisha” huhifadhi maana hiyo ya msingi na mwangwi wake katika Mwanzo 1.
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: nuru na giza
  rationale: Baada ya “kutenganisha,” Kiswahili cha kawaida kinaweza kutaja vitu viwili moja kwa moja. “Nuru” na “giza” huhifadhi nomino bainifu za Kiebrania bila kuongeza ufafanuzi usiokuwamo.
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: Mungu akaona
  rationale: “Akaona” huendeleza mfuatano wa simulizi kwa kawaida katika Kiswahili na kuhifadhi Mungu kuwa mhusika anayekagua kazi ya uumbaji.
- source_word: כִּי טוֹב
  choice: kuwa ni vyema
  rationale: טוב hapa hujumuisha uzuri, ufaafu na hali ya kuwa sawa katika mpangilio wa uumbaji. “Vyema” ni usemi wa kawaida na wenye hadhi unaoacha upana huo wa maana.
theological_decisions:
- issue: Jukumu la mianga katika uumbaji
  choice: Mianga imepewa jukumu la kutawala mchana na usiku na kudumisha utengano wa nuru na giza.
  alternative: Usemi wenye uhuishaji zaidi ungeweza kudokeza kwamba mianga inatawala kwa mamlaka yake yenyewe au ni viumbe vya kiungu.
  rationale: Kiebrania huipa mianga kazi ndani ya uumbaji uliopangwa na Mungu. “Kutawala” huhifadhi nguvu ya משל, huku kauli ya mwisho ikidumisha Mungu kuwa mwenye mamlaka anayekagua uumbaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mchana na usiku” ni ya kawaida na wazi; “ni vyema” huhifadhi mtindo wa kauli inayojirudia katika simulizi la uumbaji. Alama ya tanbihi imewekwa baada ya kishazi inachohusu.
