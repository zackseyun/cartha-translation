  source_fidelity: Tafsiri inawakilisha kwa uaminifu amri ya Hifili yenye nchi kama kiima, makundi matatu ya wanyama, urudiaji wa “kwa aina zake,” na fomula ya utimilifu “Ikawa hivyo.” “Nchi” inafaa kwa הָאָרֶץ katika muktadha wa nchi kavu wa simulizi la uumbaji, na “wanyama wa porini wa nchi” huhifadhi tofauti ya חַיְתוֹ־אֶרֶץ na mifugo.
  naturalness: Kiswahili cha tafsiri kuu ni cha asili, sanifu, na chenye mtindo unaofaa kwa simulizi takatifu. Hata hivyo, maneno “kwa neno halisi” katika tanbihi hayatumiki kwa kawaida kwa maana ya “literally” katika Kiswahili hiki; “kwa maana halisi” ni wazi na ya kawaida zaidi.
  terminology: “Viumbe hai,” “mifugo,” “viumbe vitambaavyo,” na “wanyama wa porini” ni istilahi zinazofaa na hazibani maana ya Kiebrania kupita kiasi. Tanbihi irekebishwe ili itoe mbadala wa kileksia kwa Kiswahili, “nafsi hai,” badala ya umbo la kutafsiri sauti “nefeshi hai,” ambalo halijulikani kwa msomaji wa kawaida na halitoi mbadala wa tafsiri moja kwa moja.
  issues:
