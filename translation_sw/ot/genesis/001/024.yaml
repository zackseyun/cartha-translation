base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: sw
  text: 'Mungu akasema, “Nchi na itoe viumbe hai[a] kwa aina zake: mifugo, viumbe vitambaavyo, na wanyama wa porini wa nchi kwa aina zake.” Ikawa hivyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viumbe vyenye uhai”; kwa maana halisi, “nafsi hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצֵא
  choice: na itoe
  rationale: Hifili ya kuamuru yenye הָאָרֶץ kama kiima inaagiza nchi isababishe viumbe hai vitokee; muundo huu wa Kiswahili ni wa asili na huhifadhi nguvu ya amri na maana ya kisababishi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu אֶרֶץ ni eneo la nchi kavu linalotofautishwa na anga na maji; “nchi” ni neno la kawaida la Kiswahili na linafaa kwa eneo hilo la uumbaji.
- source_word: נֶפֶשׁ חַיָּה
  choice: viumbe hai
  rationale: Kirai hiki humaanisha uhai wenye uhai wa wanyama; wingi unafaa kwa makundi yanayofuata bila kuingiza dhana maalumu ya kiteolojia kuhusu “roho.”
- source_word: לְמִינָהּ
  choice: kwa aina zake
  rationale: Ingawa muundo wa Kiebrania ni umoja wa kike unaorejelea kundi, maana yake ni ya mgawanyo kwa aina mbalimbali; “kwa aina zake” huiwasilisha kwa kawaida.
- source_word: בְּהֵמָה
  choice: mifugo
  rationale: Neno hili hapa linataja hasa kundi la wanyama wakubwa wanaofugwa au waliofugika, likitofautishwa na wanyama wa porini.
- source_word: רֶמֶשׂ
  choice: viumbe vitambaavyo
  rationale: Hutaja viumbe vidogo vinavyosonga karibu na ardhi; tafsiri hii inadumisha upana wa maana bila kutaja spishi zisizotajwa.
- source_word: חַיְתוֹ אֶרֶץ
  choice: wanyama wa porini wa nchi
  rationale: Kirai hiki hutofautisha wanyama wasiofugwa na mifugo; “wa nchi” huhifadhi kihalisi uhusiano wa Kiebrania na eneo la nchi kavu.
- source_word: וַיְהִי כֵן
  choice: Ikawa hivyo
  rationale: Ni fomula fupi ya kutimia inayorudiwa katika Mwanzo 1; tafsiri hii ni ya asili, makini, na yenye uzito unaofaa.
theological_decisions:
- issue: Iwapo נֶפֶשׁ itafsiriwe kwa neno lenye mzigo maalumu wa kiteolojia
  choice: viumbe hai
  alternative: nafsi hai; viumbe vyenye uhai
  rationale: Katika muktadha huu kirai kinawahusu wanyama walio hai kwa ujumla, wala hakitoi tamko mahususi kuhusu asili ya kimetafizikia ya wanyama. Tafsiri iliyochaguliwa haiingizi mjadala wa baadaye kuhusu “nafsi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Nchi na itoe” huhifadhi amri ya Mungu na nchi kama kiima; istilahi za makundi ya wanyama ni rahisi kueleweka huku zikidumisha tofauti za maandishi ya Kiebrania.
