lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mungu akasema
  rationale: Kitenzi hiki kinaendeleza simulizi. Muundo wa Kiswahili “Mungu akasema” huhifadhi mtiririko huo kwa kawaida bila kulazimisha maana ya wakati kwa kuongeza “kisha”.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ya Kiebrania ni la wingi, hapa lina upatanisho wa kitenzi cha umoja na linamtaja Muumba mmoja; “Mungu” ndiyo tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: יְהִי
  choice: Na liwe
  rationale: Hii ni amri ya matakwa inayotamka tendo la uumbaji. “Na liwe” ni usemi wa asili na wenye hadhi katika Kiswahili unaohifadhi nguvu ya tamko hilo.
- source_word: רָקִיעַ
  choice: anga
  rationale: Neno hili humaanisha kitu kilichotandazwa au eneo lililoenea. “Anga” ni neno la kawaida la Kiswahili linalofaa katika muktadha huu, huku tanbihi ikihifadhi tafsiri halisi zaidi zinazowezekana kuhusu taswira ya kale.
- source_word: בְּתוֹךְ
  choice: katikati ya
  rationale: Kirai hiki kinaonyesha mahali palipo ndani au miongoni mwa maji. “Katikati ya” ni cha kawaida na kinaakisi maana ya Kiebrania.
- source_word: הַמָּיִם
  choice: maji
  rationale: מַיִם huyataja maji ya awali kwa ujumla. Kiswahili “maji” tayari ni nomino ya wingi na huhifadhi taswira hiyo kwa kawaida.
- source_word: וִיהִי מַבְדִּיל
  choice: nalo litenganishe
  rationale: Muundo huu unaendeleza maana ya matakwa na kueleza kazi ya anga. Kiwakilishi “nalo” humtambulisha wazi mhusika wa tendo, yaani anga.
- source_word: בֵּין מַיִם לָמָיִם
  choice: maji na maji
  rationale: Huu ndio mwangwi wa karibu wa usemi wa Kiebrania unaotofautisha mkusanyo mmoja wa maji na mwingine; baada ya “litenganishe,” usemi huu unaeleweka katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri רָקִיעַ kuhusiana na taswira ya kale ya ulimwengu
  choice: anga
  alternative: utando, tao, au kuba
  rationale: Aya inaeleza Mungu akiweka kitu kilichoenea ili kitenganishe maji. “Anga” ni wazi na la kawaida bila kuamua kimya kimya muundo mahususi wa taswira hiyo; tanbihi huhifadhi uwezekano wa tafsiri zilizo halisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. “Na liwe” huhifadhi uzito wa tamko la uumbaji, na viambishi vya ngeli katika “nalo litenganishe” vinapatana na “anga.”
