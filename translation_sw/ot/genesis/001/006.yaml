  text: Mungu akasema, “Iwe anga[a] katikati ya maji, nayo itenganishe maji na maji[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “firmamenti,” “tao,” au “kuba.” Neno la Kiebrania רָקִיעַ linamaanisha kitu kilichotandazwa; tafsiri hutofautiana kulingana na jinsi zinavyoonyesha wazi taswira ya kale ya ulimwengu.
