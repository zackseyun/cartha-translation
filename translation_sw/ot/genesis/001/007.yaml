  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: sw
  text: Mungu akafanya anga[a], akayatenganisha maji yaliyokuwa chini ya anga na maji yaliyokuwa juu ya anga. Ikawa hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anga lililotandazwa”; pia yawezekana “kuba.” Tafsiri ya kimapokeo ni “firmamenti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akalifanya
  rationale: Kitenzi עשה kwa kawaida humaanisha ‘kufanya’ au ‘kutengeneza.’ ‘Akalifanya’ ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu wa uumbaji.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika Mwanzo 1, אֱלֹהִים huambatana na kitenzi cha umoja na humrejelea Mungu mmoja, Muumba.
- source_word: הָרָקִיעַ
  choice: anga
  rationale: רָקִיעַ hueleza kitu kilichotandazwa au eneo pana lililoenea. ‘Anga’ ni neno la Kiswahili la sasa, linaloeleweka kwa urahisi, bila kulazimisha umbo maalumu la kikosmolojia.
- source_word: וַיַּבְדֵּל
  choice: akayatenganisha
  rationale: בדל humaanisha kutenganisha au kuweka vitu mbali mbali; ‘akayatenganisha’ linaendeleza wazo la Mungu kuweka mipaka katika simulizi la uumbaji.
- source_word: בֵּין ... וּבֵין
  choice: '... na ...'
  rationale: Muundo wa Kiebrania unaonyesha utengano kati ya pande mbili. Pamoja na kitenzi ‘kutenganisha,’ Kiswahili cha asili hutumia ‘kutenganisha X na Y.’
- source_word: הַמַּיִם
  choice: maji
  rationale: מַיִם ni neno lenye umbo la wingi lakini hutumika kama nomino ya kitu kisichohesabika; ‘maji’ hulingana nalo kimaana na kisarufi.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: yaliyokuwa chini ya anga
  rationale: Tafsiri hii inadumisha uhusiano wa mahali na utofautishaji wa wima kati ya ‘chini’ na ‘juu.’
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: yaliyokuwa juu ya anga
  rationale: ‘Juu ya anga’ ni tafsiri wazi ya מֵעַל לָרָקִיעַ na inalingana na ‘chini ya anga.’
- source_word: וַיְהִי כֵן
  choice: Ikawa hivyo
  rationale: Huu ni usemi unaojirudia katika Mwanzo 1 kuonyesha kwamba agizo la Mungu lilitimizwa; ‘Ikawa hivyo’ ni wa asili na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya רָקִיעַ katika muktadha wa uumbaji wenye athari za kikosmolojia
  choice: anga
  alternative: anga lililotandazwa; kuba; firmamenti
  rationale: ‘Anga’ ni la kawaida na lenye kueleweka katika Kiswahili cha Afrika Mashariki. Halilazimishi wazo la kuba ngumu, lakini tanbihi inahifadhi uwezekano wa kuelewa רָקִיעַ kama kitu kilichotandazwa au kama kuba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umehifadhiwa kwa vitenzi vya mfululizo ‘akalifanya’ na ‘akayatenganisha,’ huku usemi wa mwisho ‘Ikawa hivyo’ ukidumisha kibwagizo cha sura.
