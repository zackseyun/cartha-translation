  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: sw
  text: Mungu akaiita nchi kavu Nchi[a], na mkusanyiko wa maji akauita Bahari. Mungu akaona kuwa ni vyema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi” au “ardhi” bila herufi kubwa; neno la Kiebrania אֶרֶץ linaweza kuwa nomino ya kawaida au, katika muktadha huu wa kutaja, jina linalopewa nchi kavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: akapaita / akauita
  rationale: Katika muktadha huu kitenzi kinamaanisha kuita kwa jina. Miundo hii ya Kiswahili ni ya asili na inadumisha urudiaji wa tendo la kutaja.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino ya Kiebrania ina umbo la wingi, hapa ina upatanisho wa kitenzi cha umoja na inamtaja Muumba mmoja.
- source_word: לַיַּבָּשָׁה
  choice: pakavu
  rationale: Nomino hii hutaja sehemu kavu inayotofautishwa na maji yaliyokusanywa. 'Pakavu' ni fupi, ya asili, na haichanganyiki na jina linalofuata, 'Nchi'.
- source_word: אֶרֶץ
  choice: Nchi
  rationale: Hapa אֶרֶץ ndilo jina linalopewa pakavu. Herufi kubwa inaonyesha kazi yake kama jina katika usemi huu, bila kuifanya lazima imaanishe sayari kwa maana ya kisasa.
- source_word: מִקְוֵה
  choice: mkusanyiko
  rationale: Neno hili linamaanisha maji yaliyokusanyika au mkusanyo wake; 'mkusanyiko' hudumisha dhana hiyo kwa Kiswahili cha kawaida.
- source_word: הַמַּיִם
  choice: maji
  rationale: Katika Kiswahili 'maji' tayari ni nomino ya wingi na ndiyo sawa ya kawaida ya neno la Kiebrania.
- source_word: יַמִּים
  choice: Bahari
  rationale: Neno la Kiebrania ni la wingi na hutaja maeneo ya maji yaliyokusanywa. Kiswahili hutumia 'bahari' kwa umbo lilelile katika umoja na wingi; herufi kubwa huonyesha kwamba hapa linatumika kama jina.
- source_word: וַיַּרְא
  choice: akaona
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida katika kauli ya tathmini inayorudiwa katika Mwanzo 1.
- source_word: כִּי טוֹב
  choice: kuwa ni vyema
  rationale: Kauli hii huhifadhi upana wa טוֹב bila kuifinya iwe uzuri wa sura au manufaa pekee; 'vyema' pia hupatana kwa asili na tathmini ya hali nzima.
theological_decisions:
- issue: Iwapo אֶרֶץ litafsiriwe kama nomino ya kawaida au jina katika kauli ya kutaja
  choice: Kutumia jina 'Nchi'
  alternative: Kutumia nomino ya kawaida 'nchi' au 'ardhi'
  rationale: Kwa kuwa Mungu anataja pakavu kwa jina, herufi kubwa inaonyesha kazi ya neno katika simulizi. Tanbihi huhifadhi uwezekano halisi wa kulisoma kama nomino ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa 'akapaita ... akauita' huhifadhi ulinganifu wa Kiebrania; 'pakavu' huepuka urudiaji usio wazi wa 'nchi'.
