  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: sw
  text: Mungu akasema, “Maji yaliyo chini ya mbingu[a] yakusanyike mahali pamoja, na nchi kavu ionekane.” Ikawa hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anga.” Neno la Kiebrania שָׁמַיִם linaweza kumaanisha anga au mbingu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kiambishi ‘aka-’ kinaendeleza mfululizo wa simulizi kwa njia ya kawaida katika Kiswahili bila kusisitiza mpangilio wa wakati kupita kiasi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika Mwanzo 1 nomino hii inaambatana na kitenzi cha umoja na humrejelea Mungu mmoja Muumba; ‘Mungu’ ndilo neno la kawaida na sahihi katika Kiswahili.
- source_word: יִקָּווּ
  choice: na yakusanyike
  rationale: Kauli ya kutendwa yenye maana ya amri au mapenzi imewasilishwa kwa kiunganishi ‘na’ pamoja na hali tegemezi, muundo wa kawaida wa amri ya nafsi ya tatu katika Kiswahili.
- source_word: הַמַּיִם
  choice: maji
  rationale: ‘Maji’ ni nomino ya kawaida ya Kiswahili yenye umbo la wingi na inalingana vyema na maana ya Kiebrania.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: yaliyo chini ya mbingu
  rationale: Muundo huu unaonyesha mahali maji yalipo. ‘Mbingu’ huhifadhi msamiati wenye hadhi wa simulizi huku uwezekano wa maana ‘anga’ ukibainishwa katika tanbihi.
- source_word: אֶל מָקוֹם אֶחָד
  choice: mahali pamoja
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha kukusanywa kuelekea eneo moja na kuhifadhi dhana ya אֶחָד.
- source_word: וְתֵרָאֶה
  choice: na nchi kavu ionekane
  rationale: Hali tegemezi ‘ionekane’ huendeleza amri ya Mungu na kuwasilisha maana ya kujitokeza ili kuonekana bila kuongeza uhusiano wa kusudi usioelezwa wazi.
- source_word: הַיַּבָּשָׁה
  choice: nchi kavu
  rationale: ‘Nchi kavu’ ni usemi wa kawaida unaotaja ardhi iliyofunuliwa na kuitofautisha na maji, sambamba na mstari wa 10.
- source_word: וַיְהִי כֵן
  choice: Ikawa hivyo
  rationale: Huu ni usemi mfupi, wa asili, unaofaa kama kibwagizo cha kutimia kwa amri katika Mwanzo 1.
theological_decisions:
- issue: Maana ya שָׁמַיִם katika simulizi la uumbaji
  choice: mbingu
  alternative: anga
  rationale: Neno la Kiebrania linaweza kumaanisha anga au mbingu. ‘Mbingu’ huhifadhi mtindo wenye hadhi na mwendelezo wa msamiati wa Mwanzo 1, huku tanbihi ikihifadhi maana nyingine halali bila kuingiza mfumo maalumu wa elimu ya ulimwengu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri za nafsi ya tatu umetolewa kwa ‘na’ pamoja na hali tegemezi; sentensi imeepuka tafsiri ngumu ya neno kwa neno huku ikihifadhi mtiririko na utata halisi wa שָׁמַיִם.
