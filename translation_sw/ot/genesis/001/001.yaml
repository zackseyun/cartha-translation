  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: sw
  text: Hapo mwanzo, Mungu alipoumba mbingu na dunia[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Kwa kawaida mstari huu hutafsiriwa kama sentensi kamili: “Hapo mwanzo, Mungu aliumba mbingu na dunia.” Hata hivyo, Kiebrania kinaweza pia kusomwa kama kishazi tegemezi cha wakati: בְּרֵאשִׁית (“hapo mwanzo”) hufuatiwa na בָּרָא (“aliumba”), muundo unaofanana na Mwanzo 2:4b. Katika usomaji huo, kishazi kikuu hupatikana katika mstari wa 3: “Mungu akasema, ‘Iwe nuru.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Hapo mwanzo, … alipoumba
  rationale: Neno רֵאשִׁית lina maana ya “mwanzo.” Kwa kuwa hapa halina kibainishi na linafuatwa na kitenzi בָּרָא, muundo “Mungu alipoumba” unaonyesha kwa Kiswahili kwamba hii ni sentensi tegemezi ya wakati, huku “Hapo mwanzo” ikihifadhi uzito wa neno la kwanza la Kiebrania.
- source_word: בָּרָא
  choice: alipoumba
  rationale: Kitenzi בָּרָא ndicho kitenzi cha kawaida cha Kiebrania kinachotumiwa kwa tendo la Mungu la kuumba. “Aliumba” ni sawia ya moja kwa moja, na kiambishi -po kinaonyesha uhusiano wa wakati bila kufafanua isivyofaa namna ya uumbaji.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la אֱלֹהִים lina sura ya wingi, hapa linaambatana na kitenzi cha umoja בָּרָא; kwa hiyo rejeleo ni Mungu mmoja.
- source_word: אֵת
  choice: '[halijatafsiriwa; kiashiria cha yambwa tendwa]'
  rationale: אֵת huonyesha yambwa tendwa yenye uainisho katika Kiebrania, lakini halina neno linalolingana nalo moja kwa moja katika Kiswahili; kazi yake inaeleweka kutokana na muundo wa sentensi.
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: “Mbingu” huhifadhi umbo na maana pana ya הַשָּׁמַיִם. Pamoja na “dunia,” maneno hayo yanaeleza kwa ujumla viumbe vyote.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: אָ֫רֶץ linaweza kumaanisha “nchi” au “dunia,” lakini likioanishwa na “mbingu” katika muktadha huu wa ulimwengu mzima, “dunia” ndilo chaguo linalofaa.
theological_decisions:
- issue: Muundo wa kishazi cha ufunguzi
  choice: 'Kishazi tegemezi cha wakati: “Hapo mwanzo, Mungu alipoumba mbingu na dunia—”'
  alternative: 'Sentensi kamili inayojitegemea: “Hapo mwanzo, Mungu aliumba mbingu na dunia.”'
  rationale: Kutokuwapo kwa kibainishi katika בְּרֵאשִׁית, kufuatiwa kwake mara moja na kitenzi בָּרָא, na miundo inayofanana katika Mwanzo 2:4b na Hosea 1:2 vinaunga mkono usomaji wa kishazi tegemezi cha wakati. Tafsiri hii haikusudii kuamua kwa njia ya tafsiri mafundisho yote kuhusu namna uumbaji ulivyoanza; usomaji wa jadi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Hapo mwanzo” ni usemi wa kawaida wa kibiblia, na “alipoumba” huonyesha utegemezi wa kishazi kwa njia ya asili katika Kiswahili. Kistari kirefu mwishoni kinaonyesha kuwa wazo linaendelea katika mistari inayofuata.
