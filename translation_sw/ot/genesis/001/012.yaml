base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: sw
  text: 'Ardhi ikatoa uoto: mimea inayotoa mbegu kwa aina zake[a], na miti inayozaa matunda yenye mbegu ndani yake[b], kwa aina zake. Mungu akaona kwamba ni vyema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kwa aina zake” humaanisha kulingana na aina au makundi yake; neno la Kiebrania hapa si istilahi ya kisasa ya kitaalamu kama “spishi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa karibu zaidi: “ambayo mbegu yake imo ndani yake.” Katika Kiebrania viwakilishi ni vya umoja; tafsiri kuu hueleza wazi kwamba mbegu iko ndani ya tunda.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: ikatoa
  rationale: Hifili ya יצא inaonyesha ardhi ikisababisha uoto utokee. “Ikatoa” ni ya kawaida, fupi, na inadumisha wazo la ardhi kuleta uoto bila kudokeza mchakato wa kisayansi usiotajwa.
- source_word: הָאָרֶץ
  choice: Ardhi
  rationale: Katika muktadha wa ulimwengu unaoumbwa katika Mwanzo 1, “ardhi” inafaa kuliko maana finyu ya eneo au nchi.
- source_word: דֶּשֶׁא
  choice: uoto
  rationale: Neno hili ni la ujumla kwa mimea michanga au kijani kinachochipuka, si nyasi pekee. “Uoto” linafunika maana hiyo ya pamoja kwa Kiswahili cha sasa.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: mimea inayotoa mbegu
  rationale: עֵשֶׂב hapa ni mimea au majani ya aina mbalimbali, nayo kishiriki מַזְרִיעַ pamoja na זֶרַע kinaonyesha uwezo unaoendelea wa kutoa mbegu.
- source_word: לְמִינֵהוּ
  choice: kwa aina zake
  rationale: מין humaanisha aina au kundi la viumbe katika lugha ya kifungu, wala si istilahi ya kisasa ya kitaalamu ya “spishi.”
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: na miti inayozaa matunda
  rationale: Ingawa עֵץ ni umbo la umoja, limetumiwa kwa maana ya pamoja. Kiswahili cha wingi hapa ni cha kawaida na “kuzaa matunda” ni usemi unaofaa.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: yenye mbegu ndani yake
  rationale: Usemi huu unaonyesha kwamba mbegu imo ndani ya tunda. Uundaji huu ni wa kawaida kwa Kiswahili huku tanbihi ikihifadhi muundo wa karibu zaidi wa Kiebrania.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Mungu akaona kwamba ni vyema
  rationale: Huu ndio usemi wa tathmini unaorudiwa katika Mwanzo 1. “Ni vyema” ni wa heshima na wa kawaida, bila kuongeza kiwakilishi kinachobana rejeleo.
theological_decisions:
- issue: Kutafsiri makundi ya uumbaji bila kuingiza taksonomia ya kisasa
  choice: kwa aina zake
  alternative: kwa spishi zake
  rationale: מין hutaja aina au makundi kama yanavyoelezwa na maandiko ya kale; haitumii istilahi ya kisasa ya kibiolojia. “Kwa aina zake” huepuka kuingiza mjadala wa kisayansi au wa kimadhehebu ambao mstari hautamki.
- issue: Rejeleo la mbegu iliyo ndani
  choice: matunda yenye mbegu ndani yake
  alternative: miti ambayo mbegu yake imo ndani yake
  rationale: Kisintaksia, Kiebrania kina viwakilishi vya umoja vinavyoweza kufuatilia mti kwa maana ya pamoja, lakini kimaana mbegu inaeleweka kuwa ndani ya tunda. Tafsiri kuu inatoa maana ya kawaida; tanbihi inaonyesha kwa karibu zaidi umbo la chanzo bila kujenga dai la ziada la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Uoto” linatenganisha neno la ujumla דֶּשֶׁא na “mimea” ya עֵשֶׂב; sentensi inadumisha mwendo wa simulizi kwa vitenzi “ikatoa” na “akaona.” Alama zote za tanbihi zimewekwa moja kwa moja katika matini.
