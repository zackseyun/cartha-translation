  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: sw
  text: Mungu akavibariki, akisema, “Zaeni na mkaongezeke, mkajaze maji ya baharini; ndege[a] nao waongezeke duniani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viumbe warukao”; neno la Kiebrania עוֹף linaweza kumaanisha kwa upana zaidi viumbe warukao, si ndege pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: akawabariki
  rationale: Kauli ya piel ya ברך inaonyesha Mungu akiwapa baraka; ‘akawabariki’ ni tafsiri ya kawaida, ya asili, na yenye hadhi katika Kiswahili.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiwakilishi hiki kinawarejelea viumbe wa majini na ndege waliotajwa katika mstari uliotangulia.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika Mwanzo 1, nomino hii ina upatanisho wa kitenzi wa umoja na inamtaja Muumba mmoja.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni muundo wa kawaida unaotanguliza usemi wa moja kwa moja; ‘akisema’ ni wa asili katika masimulizi ya Kiswahili.
- source_word: פְּרוּ
  choice: Zaeni
  rationale: Kitenzi פרה katika muktadha huu wa baraka na agizo kinahusu kuzaa na kuleta uzao; ‘Zaeni’ ni wazi na cha kawaida kuliko tafsiri ya neno kwa neno ‘kuweni na matunda.’
- source_word: וּרְבוּ
  choice: mkaongezeke
  rationale: רבה hapa inamaanisha kuwa wengi kwa idadi. ‘Mkaongezeke’ huungana kwa asili na ‘Zaeni’ na kuhifadhi nguvu ya agizo ndani ya baraka.
- source_word: וּמִלְאוּ
  choice: mkajaze
  rationale: מלא humaanisha kujaza; umbo la ‘mkajaze’ linaendeleza mfululizo wa maagizo kwa Kiswahili cha asili.
- source_word: אֶת־הַמַּיִם בַּיַּמִּים
  choice: maji ya baharini
  rationale: Kiswahili cha kawaida husema ‘maji ya baharini’; usemi huu unawakilisha maji yaliyo katika bahari bila urudiaji mzito wa ‘maji katika bahari.’
- source_word: וְהָעוֹף
  choice: nao ndege
  rationale: עוֹף mara nyingi humaanisha ndege lakini inaweza kujumuisha viumbe warukao kwa upana zaidi; ‘ndege’ ni chaguo la kawaida katika muktadha huu, huku tanbihi ikihifadhi uwezekano mpana.
- source_word: יִרֶב
  choice: waongezeke
  rationale: Umbo hili lina nguvu ya kutakia au kuagiza, si taarifa tambarare ya wakati ujao. ‘Waongezeke’ huhifadhi hali hiyo.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: אָרֶץ hapa ni eneo la nchi kavu ambako ndege wanaongezeka; ‘duniani’ ni usemi wa asili na unaofaa katika Kiswahili cha Mwanzo 1.
theological_decisions:
- issue: Asili ya usemi katika baraka
  choice: 'Vitenzi vimetafsiriwa kama baraka inayotolewa kwa namna ya agizo: ‘Zaeni na mkaongezeke ... nao ndege waongezeke.’'
  alternative: 'Kutafsiri vitenzi vyote kama maagizo ya moja kwa moja tu, au kutafsiri kifungu cha mwisho kama taarifa ya wakati ujao: ‘ndege wataongezeka.’'
  rationale: Kiebrania kinaonyesha Mungu akibariki kwa kutumia maumbo ya amri na ya kutakia. Tafsiri inahifadhi mvutano kati ya baraka na agizo badala ya kuifanya iwe amri tu au unabii tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘Zaeni na mkaongezeke’ ni wa kawaida na huepuka tafsiri isiyo ya asili ya nahau ya Kiebrania. Alama ya tanbihi imewekwa baada ya ‘akawabariki’ kufuatana na safu ya ushauri ya Kiingereza, ingawa maelezo yake yanahusu utambulisho mpana unaowezekana wa wale waliobarikiwa.
