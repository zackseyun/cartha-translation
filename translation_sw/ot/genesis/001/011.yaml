  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: sw
  text: 'Mungu akasema, “Ardhi na ichipushe uoto[a]: mimea itoayo mbegu, na miti ya matunda izaayo matunda kwa aina zake[b], yenye mbegu zake ndani yake[c], juu ya ardhi.” Ikawa hivyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ardhi na itoe uoto.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kwa aina yake”; umoja umetumiwa kwa maana ya kugawa, yaani kila kundi kwa aina yake.'
    reason: lexical_alternative
  - marker: c
    text: Au, “ambao mbegu yake imo ndani yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: na ichipushe
  rationale: Kauli ya kusababisha yenye maana ya amri au matakwa inaelekezwa kwa ardhi. “Na ichipushe” huhifadhi wazo la ardhi kufanya uoto uchipuke kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: דֶּשֶׁא
  choice: uoto
  rationale: Neno hili ni la ujumla kwa mimea michanga au kijani inayochipuka; “uoto” halibanwi kuwa nyasi pekee.
- source_word: עֵשֶׂב
  choice: mimea
  rationale: Hurejelea mimea isiyo miti. “Mimea” ni wazi kwa msomaji wa sasa na haileti maana finyu ya mimea ya viungo au dawa.
- source_word: מַזְרִיעַ זֶרַע
  choice: itoayo mbegu
  rationale: Kirai hiki kinaonyesha sifa ya mimea ya kuendelea kutoa mbegu. Uundaji huu ni wa asili na huhifadhi uwezo wake wa kuzaana.
- source_word: עֵץ פְּרִי
  choice: miti ya matunda
  rationale: Kirai cha Kiebrania kinataja miti inayotambulishwa kwa kuzaa matunda; wingi wa Kiswahili hutumika kwa kawaida kueleza kundi hilo.
- source_word: עֹשֶׂה פְּרִי
  choice: izaayo matunda
  rationale: “Kuzaa matunda” ni usemi wa kawaida wa kilimo na huonyesha tendo linaloitambulisha miti hiyo.
- source_word: לְמִינוֹ
  choice: kwa aina zake
  rationale: Ingawa Kiebrania kina kiambishi cha umoja, umoja huo unatumiwa kwa maana ya kugawa kila kundi kwa aina yake. Wingi unafaa kwa mtiririko wa Kiswahili, huku tanbihi ikihifadhi umbo la asili.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: yenye mbegu zake ndani yake
  rationale: Kirai kinaeleza kwamba mbegu ya kila aina imo ndani ya matunda au mmea wenyewe. Tafsiri ya wingi inapatana kwa kawaida na “miti,” bila kupoteza maana ya kugawa kwa kila aina.
- source_word: עַל הָאָרֶץ
  choice: juu ya ardhi
  rationale: Hii ni tafsiri ya kawaida ya mahali, inayofaa katika muktadha wa uumbaji na ukuaji wa mimea.
- source_word: וַיְהִי כֵן
  choice: Ikawa hivyo
  rationale: Hii ni kauli fupi ya kutimia inayorudiwa katika Mwanzo 1; huhifadhi uzito na mwendo wa simulizi.
theological_decisions:
- issue: Upeo wa makundi ya mimea iliyoumbwa
  choice: 'Kutafsiri maneno ya Kiebrania kama makundi mapana lakini yanayotofautishwa: uoto, mimea itoayo mbegu, na miti ya matunda.'
  alternative: Kuyajumlisha yote kuwa “mimea ya kila aina,” au kuyafanya yaonekane kama uainishaji wa kisasa wa kisayansi.
  rationale: Aya hutumia lugha ya kawaida ya uchunguzi kueleza mpangilio wa viumbe vya mimea. Tafsiri inadumisha tofauti zilizomo katika maandishi bila kuingiza uainishaji wa kisasa wala kuyafuta makundi hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ardhi” inafaa kwa sehemu inayotoa mimea; “uoto” huhifadhi upana wa דֶּשֶׁא. Miundo “itoayo” na “izaayo” ina ladha ya kibiblia bila kuwa ya kizamani kupita kiasi.
