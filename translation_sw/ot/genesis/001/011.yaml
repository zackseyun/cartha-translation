  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: amri elekezi kwa ardhi, makundi matatu ya uoto, utoaji/uzazi wa mbegu na matunda, mpangilio wa aina, na kauli ya kutimia. Wingi wa Kiswahili katika “aina zake” na “mbegu zake” unasomeka kwa maana ya kugawa, sawa na umoja wa Kiebrania unaotumika kwa namna hiyo.'
