base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: sw
  text: Na dunia ilikuwa bila umbo na tupu; giza lilikuwa juu ya uso wa kilindi, na Roho wa Mungu[a] alikuwa akipepea juu ya uso wa maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upepo utokao kwa Mungu” au “upepo wa Mungu” ulikuwa ukipepea juu ya uso wa maji.
    reason: Usomaji mwingine unaowezekana wa וְרוּחַ אֱלֹהִים, kwa kuwa רוּחַ linaweza kumaanisha “roho” au “upepo.”
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Nayo dunia
  rationale: Huwakilisha kiunganishi ו kwa njia ya kawaida ya Kiswahili na kudumisha mwendelezo wa simulizi bila kuongeza wazo la wakati kama ‘Sasa.’
- source_word: הָיְתָה
  choice: haikuwa … nayo ilikuwa
  rationale: Kitenzi hapa kinaeleza hali ya dunia, si lazima mabadiliko ya hali; kwa hiyo maana ya ‘ilikuwa’ imehifadhiwa badala ya ‘ikawa.’
- source_word: תֹהוּ וָבֹהוּ
  choice: haikuwa na umbo, nayo ilikuwa tupu
  rationale: Kauli hii ya Kiswahili inaeleza kwa uwazi hali ya kutokuwa na umbo na utupu, huku ikidumisha vipengele viwili vya usemi wa Kiebrania.
- source_word: וְחֹשֶׁךְ
  choice: giza
  rationale: Ni kisawe cha moja kwa moja na cha kawaida katika Kiswahili.
- source_word: עַל־פְּנֵי
  choice: juu ya uso wa
  rationale: Inahifadhi taswira ya mahali iliyo katika nahau ya Kiebrania kuliko kutumia ‘juu ya’ peke yake.
- source_word: תְהוֹם
  choice: kilindi
  rationale: ‘Kilindi’ huonyesha kina kikubwa cha maji bila kuingiza taswira za kimitholojia zisizosemwa wazi katika maandishi.
- source_word: וְרוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: רוּחַ inaweza kumaanisha roho, upepo, au pumzi. Toleo kuu linatumia usomaji wenye nguvu na wa jadi wa ‘Roho wa Mungu,’ huku uwezekano wa upepo ukihifadhiwa katika tanbihi.
- source_word: מְרַחֶפֶת
  choice: alikuwa akitanda
  rationale: Muundo endelevu unaonyesha tendo linaloendelea; ‘akitanda’ hutoa picha ya kuwapo na kusogea juu ya eneo bila kupunguza kitenzi kuwa ‘alikuwa’ tu.
- source_word: הַמָּיִם
  choice: maji
  rationale: ‘Maji’ ndilo neno la kawaida la Kiswahili lenye umbo la wingi na linafaa kwa taswira ya maji ya mwanzo.
theological_decisions:
- issue: Ikiwa הָיְתָה inaeleza hali iliyokuwapo au mabadiliko ya hali
  choice: ilikuwa
  alternative: ikawa
  rationale: Muktadha unaeleza hali ya dunia katika hatua hii ya simulizi. Kiebrania hakilazimishi wazo kwamba dunia ilibadilika na kuwa hivyo, kwa hiyo tafsiri haiongezi dai hilo.
- issue: Ikiwa וְרוּחַ אֱלֹהִים ni Roho wa Mungu au upepo utokao kwa Mungu
  choice: Roho wa Mungu
  alternative: upepo utokao kwa Mungu; upepo wa Mungu
  rationale: Usemi wa Kiebrania una utata halisi. Usomaji wa ‘Roho wa Mungu’ umetumiwa katika maandishi makuu, na usomaji wa upepo umewekwa katika tanbihi ili kutohitimisha kimya kimya suala ambalo chanzo kinaliacha wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘Nayo dunia’ huhifadhi kiunganishi cha Kiebrania kwa mtiririko wa kawaida. Alama ya tanbihi imewekwa baada ya ‘Roho wa Mungu,’ sehemu inayohusika moja kwa moja na usomaji mbadala.
