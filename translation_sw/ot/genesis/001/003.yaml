  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: sw
  text: Mungu akasema[a], “Iwe nuru,” ikawa nuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nuru iwepo.” Kiebrania kinatumia umbo la jussive linaloonyesha matakwa au amri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Wayyiqtol ya אמר inaendeleza simulizi. Kiambishi “aka-” kinaonyesha mfuatano wa tukio kwa Kiswahili cha kawaida bila kuongeza tafsiri ya kiunganishi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino ya Kiebrania ina umbo la wingi, hapa ina upatanisho wa kitenzi cha umoja na inamtaja Muumba mmoja; “Mungu” ndiyo tafsiri ya kawaida ya Kiswahili.
- source_word: יְהִי
  choice: Iwe
  rationale: Hili ni umbo la jussive la היה linaloonyesha matakwa au amri. “Iwe” ni tamko fupi, la asili, na lenye nguvu ya amri ya uumbaji katika Kiswahili.
- source_word: אוֹר
  choice: nuru
  rationale: Maana ya msingi ni mwanga/nuru. “Nuru” inafaa kwa mtindo wa kifasihi wenye hadhi na haiwekei maana hii kikomo cha chanzo maalumu au sitiari.
- source_word: וַיְהִי
  choice: ikawa
  rationale: Wayyiqtol ya היה inaripoti kutimia mara moja kwa tamko la Mungu. “Ikawa” ni fupi na ya asili, huku ikihifadhi uhusiano wa matokeo.
- source_word: אוֹר
  choice: nuru
  rationale: Kurudia “nuru” kunahifadhi urudiaji wa Kiebrania na kusisitiza kutimia kwa amri.
theological_decisions:
- issue: Jinsi ya kutafsiri amri ya Mungu ya kuumba
  choice: Iwe nuru
  alternative: Na iwe nuru
  rationale: Jussive ya Kiebrania huonyesha matakwa au amri yenye nguvu. “Iwe nuru” huhifadhi ufupi na uzito wa tamko bila kueleza zaidi namna ambavyo amri hiyo ilitekelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi ili kuakisi ufupi na nguvu ya Kiebrania; “nuru” limetumiwa mara zote mbili kuhifadhi urudiaji wa chanzo.
