  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: sw
  text: Kisha Mungu akasema, “Na tumfanye mwanadamu[a] kwa mfano wetu, kwa kufanana nasi[b], nao watawale[c] samaki wa baharini, ndege wa angani[d], mifugo, dunia yote, na kila kiumbe kitambaacho juu ya dunia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “jamii ya wanadamu” au “ubinadamu.” Neno la Kiebrania adam hapa ni umoja wenye maana ya pamoja: mwanadamu kama jamii moja; ndiyo maana sentensi inaendelea kwa wingi, “nao watawale.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kauli za wingi “Na tumfanye” na “mfano wetu” zimehifadhiwa kama zilivyo katika Kiebrania. Zimeeleweka kwa namna mbalimbali: kuwa Mungu anajadiliana, anamwambia baraza la mbinguni, au—katika usomaji wa Kikristo wa Maandiko yote—kuwa ni dokezo linalopatana na ufunuo wa baadaye kuhusu Utatu.'
    reason: alternative_reading
  - marker: c
    text: Au “wawe na mamlaka juu ya.”
    reason: lexical_alternative
  - marker: d
    text: Au “ndege wa mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha sasa na cha kawaida.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi kiko katika umoja katika muktadha huu, hivyo neno la kawaida “Mungu” linafaa.
- source_word: נַעֲשֶׂה
  choice: Na tumfanye
  rationale: Umbo la nafsi ya kwanza wingi lenye maana ya kuazimia au kuhimiza linawakilishwa kwa kawaida na “Na tumfanye,” huku wingi wa Kiebrania ukihifadhiwa bila kufafanuliwa kitheolojia.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Hapa אדם ni umoja wenye maana ya pamoja, yaani jamii ya wanadamu ikionwa kama aina moja. “Mwanadamu” huhifadhi umoja wa kisarufi na maana pana ya kibinadamu; “nao watawale” huonyesha wazi wingi wa kiwakilishi unaofuata.
- source_word: בְּצַלְמֵנוּ
  choice: kwa mfano wetu
  rationale: צלם humaanisha mfano, sura, au uwakilishi. “Kwa mfano wetu” ni usemi wa kawaida wa kibiblia unaohifadhi uhusiano unaoonyeshwa na ב.
- source_word: כִּדְמוּתֵנוּ
  choice: kwa kufanana nasi
  rationale: כ pamoja na דמות huonyesha ulinganifu. Tafsiri hii ni ya asili kwa Kiswahili na hudumisha tofauti ya maneno kati ya “mfano” na “kufanana.”
- source_word: וְיִרְדּוּ
  choice: nao watawale
  rationale: Kitenzi cha nafsi ya tatu wingi kina nguvu ya kuagiza au kueleza kusudi baada ya “Na tumfanye.” “Watawale” ni wazi na ya sasa, bila uzito wa lugha ya kizamani.
- source_word: בִדְגַת הַיָּם
  choice: samaki wa baharini
  rationale: Ni uwasilishaji wa kawaida na wa moja kwa moja wa muundo wa Kiebrania.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: עוף hapa hurejelea viumbe warukao, hasa ndege; השמים katika muktadha huu inaweza kutafsiriwa kwa kawaida kuwa “anga.”
- source_word: וּבַבְּהֵמָה
  choice: mifugo
  rationale: בהמה hapa inaelekea kumaanisha wanyama wa kufugwa kama kundi; “mifugo” ni sahihi na ya kawaida.
- source_word: וּבְכָל הָאָרֶץ
  choice: dunia yote
  rationale: Katika Mwanzo 1, ארץ ina upeo wa dunia nzima, si nchi fulani tu.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: kila kiumbe kitambaacho
  rationale: רמש hueleza viumbe wanaosonga karibu na ardhi. “Kiumbe kitambaacho” ni wazi na pia huakisi urudiaji wa mzizi katika kishiriki kinachofuata.
theological_decisions:
- issue: Kauli ya wingi katika “Na tumfanye ... mfano wetu”
  choice: Kuhifadhi kauli ya wingi bila kutaja Mungu anamwambia nani au kutoa ufafanuzi wa kitheolojia katika matini kuu.
  alternative: Kuifafanua kama majadiliano ya Mungu mwenyewe, hotuba kwa baraza la mbinguni, au dokezo linalopatana na ufunuo wa baadaye kuhusu Utatu.
  rationale: Kiebrania kina maumbo ya nafsi ya kwanza wingi. Tafsiri inapaswa kuhifadhi mvutano huo badala ya kuutatua kwa ufafanuzi.
- issue: Maana ya pamoja ya אָדָם ikiwa katika umoja
  choice: Kutumia “mwanadamu” katika matini kuu kama nomino ya umoja inayowakilisha wanadamu kwa pamoja.
  alternative: “Jamii ya wanadamu” au “ubinadamu.”
  rationale: “Mwanadamu” huhifadhi umoja wa kisarufi na maana wakilishi, huku “nao watawale” ikidhihirisha kwamba jamii ya wanadamu ndiyo inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la uumbaji lakini kinachoeleweka kwa wasomaji wa kawaida. “Na tumfanye” huhifadhi wingi wa chanzo; “mwanadamu” ni wa asili kuliko “mtu” katika usemi huu na hubeba maana ya jamii kwa pamoja. Alama zote za tanbihi zimewekwa katika matini kuu.
