base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: sw
  text: Akasema, “Niapie,” naye akamwapia. Kisha Israeli akainama kwenye kichwa cha kitanda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya ncha ya fimbo.” Konsonanti za Kiebrania zinaweza kusomwa hivyo; maana hii inaonekana katika Tafsiri ya Sabini (Septuajinti) na katika Waebrania 11:21.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה
  choice: Niapie
  rationale: Amri hii katika kauli ya kiapo inaelekezwa moja kwa moja kwa Yosefu. “Niapie” ni Kiswahili cha kawaida, kifupi, na chenye nguvu inayolingana na ombi la Yakobo.
- source_word: וַיִּשָּׁבַע
  choice: akamwapia
  rationale: Inaendeleza mzizi uleule wa kiapo na kuweka wazi kwa njia ya kawaida ya Kiswahili kwamba Yosefu alimwapia Yakobo.
- source_word: וַיִּשְׁתַּחוּ
  choice: akainama
  rationale: Kitenzi kinaweza kumaanisha kuinama, kusujudu, au kuabudu kulingana na muktadha. Hapa “akainama” huhifadhi tendo la mwili bila kuamua kimya kimya kwamba kitendo hicho kilikuwa ibada.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina lililotumiwa na maandishi ya Kiebrania limehifadhiwa badala ya kubadilishwa kuwa “Yakobo.”
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: kwenye kichwa cha kitanda
  rationale: Usemi huu ni wa asili katika Kiswahili na huonyesha mahali au upande wa kichwa cha kitanda bila kulazimisha maana ya kwamba Israeli alikuwa juu ya kitanda chenyewe.
- source_word: הַמִּטָּה
  choice: kitanda
  rationale: Uwekaji wa irabu wa maandishi ya Kimasoreti unasomeka mittah, “kitanda,” na maana hiyo inafaa muktadha wa udhaifu wa Yakobo.
theological_decisions:
- issue: Waebrania 11:21, kwa kufuata mapokeo yanayoonekana katika Septuajinti, huonyesha usomaji wa “fimbo” badala ya “kitanda.”
  choice: kitanda
  alternative: fimbo
  rationale: Tafsiri kuu inafuata uwekaji wa irabu wa maandishi ya Kimasoreti, הַמִּטָּה, “kitanda.” Hata hivyo, kwa kuwa konsonanti za Kiebrania zinaweza pia kusomwa kuwa “fimbo,” na usomaji huo una umuhimu katika Septuajinti na Waebrania 11:21, umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Niapie” na “akamwapia” hudumisha mshikamano wa neno la kiapo, huku “akainama” ikihifadhi utata kati ya tendo la mwili na tendo linaloweza kuwa la ibada.
