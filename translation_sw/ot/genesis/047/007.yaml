  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: sw
  text: Kisha Yosefu akamleta Yakobo, baba yake, na kumweka mbele ya Farao[a], naye Yakobo akambariki[b] Farao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamsimamisha mbele ya Farao.”
    reason: lexical_alternative
  - marker: b
    text: “Akambariki” huenda ikajumuisha tamko rasmi la baraka, si salamu ya adabu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: akamleta
  rationale: Hifili ya בוא ina maana ya kusababisha mtu aje; “akamleta” ni Kiswahili cha kawaida kinachowasilisha tendo la Yosefu la kumwingiza Yakobo mbele ya Farao.
- source_word: אָבִיו
  choice: baba yake
  rationale: Kiambishi cha nafsi ya tatu umoja kinamhusu Yosefu; “baba yake” ni usemi wa kawaida na wazi.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: kumweka mbele ya
  rationale: Hifili ya עמד kihalisi ni “kumsimamisha”; katika mazingira ya kukutana na mfalme, “kumweka mbele ya” ni ya asili na bado inadumisha wazo la kumwasilisha katika uwepo rasmi.
- source_word: לִפְנֵי פַרְעֹה
  choice: mbele ya Farao
  rationale: לִפְנֵי humaanisha “mbele ya” au “katika uwepo wa”; tafsiri hii ni fupi, wazi, na ya kawaida.
- source_word: וַיְבָרֶךְ
  choice: akambariki
  rationale: ברך kwa kawaida humaanisha “bariki.” Tafsiri hii haipunguzi tendo la Yakobo kuwa salamu ya adabu tu.
- source_word: פַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: וַ
  choice: Kisha / aka- / naye
  rationale: Viunganishi hivi vinaendeleza mfululizo wa simulizi kwa Kiswahili cha asili bila kurudia “na” kwa namna nzito.
theological_decisions:
- issue: Maana ya tendo la Yakobo kwa Farao
  choice: Yakobo alimbariki Farao kwa kweli
  alternative: Yakobo alimsalimu Farao kwa heshima tu
  rationale: Kitenzi ברך kina maana yake ya kawaida ya “kubariki.” Hivyo mvutano wa simulizi—mzee huyo mgeni akimbariki mfalme mkuu—unahifadhiwa badala ya kufifishwa kuwa salamu ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akamleta ... na kumweka” ni mwepesi kusomeka; “akambariki” huhifadhi maana ya msingi na uzito wa kitheolojia wa kitenzi cha Kiebrania.
