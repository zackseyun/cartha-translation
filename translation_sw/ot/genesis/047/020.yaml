base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: sw
  text: Basi Yosefu akamnunulia Farao ardhi yote ya Misri[a], kwa sababu kila Mmisri aliuza shamba lake, maana njaa ilikuwa kali kwao[b]. Hivyo ardhi ikawa mali ya Farao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yosefu akaipata ardhi yote ya Misri kwa ajili ya Farao.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “njaa ilikuwa na nguvu juu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: akamnunulia
  rationale: Katika muktadha wa kuuza mashamba, kitenzi קנה kinaonyesha ununuzi. Muundo huu pia unaonyesha kwamba Yosefu alinunua kwa ajili ya Farao.
- source_word: אַדְמַת מִצְרַיִם
  choice: ardhi yote ya Misri
  rationale: Neno אַדְמָה hapa linamaanisha ardhi kama mali inayoweza kumilikiwa na kuuzwa, si udongo tu.
- source_word: לְפַרְעֹה
  choice: Farao
  rationale: Kiambishi cha mtendewa katika “akamnunulia Farao” kinaonyesha kwamba Farao ndiye aliyenufaika na kuwa mmiliki wa ardhi hiyo.
- source_word: מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: kila Mmisri aliuza shamba lake
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida maana ya wingi wa jumla pamoja na mgawanyo wa אִישׁ, yaani kila mmoja aliuza shamba lake.
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: njaa ilikuwa kali sana kwao
  rationale: חזק kwa njaa huonyesha ukali au nguvu yake. “Ilikuwa kali sana kwao” ni ya kawaida na huhifadhi wazo la shinikizo lililowapata.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: ardhi ikawa mali ya Farao
  rationale: Kifungu kinaeleza matokeo ya kisheria ya uhamisho wa umiliki; “mali ya Farao” kinaeleza wazi hali hiyo mpya.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Akamnunulia Farao” huepuka uwezekano wa kueleweka kwamba Yosefu alinunua ardhi kutoka kwa Farao, huku “ikawa mali ya Farao” ikifafanua matokeo ya umiliki.
