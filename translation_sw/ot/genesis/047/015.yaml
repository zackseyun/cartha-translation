translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa urahisi. “Tupe” huhifadhi ukali wa ombi la watu wenye njaa, na “mbele yako” huhifadhi usemi wa chanzo bila kuufafanua kupita kiasi.
