base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: sw
  text: Fedha ilipokwisha katika nchi ya Misri na katika nchi ya Kanaani[a], Wamisri wote[b] walimjia Yosefu wakisema, “Tupe mkate[c]. Kwa nini tufe mbele yako? Maana fedha imekwisha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha “fedha” (metali) au “pesa.”
    reason: Mbadala wa kileksika wa כֶּסֶף.
  - marker: b
    text: Kihalisi, “Misri yote ilimjia Yosefu.”
    reason: Maandishi ya Kiebrania hutumia jina la nchi kuwakilisha watu wake.
  - marker: c
    text: “Mkate” hapa linaweza kumaanisha chakula kwa ujumla katika muktadha wa njaa.
    reason: לֶחֶם maana yake ya msingi ni mkate, lakini inaweza kutumiwa kwa maana pana ya chakula.
lexical_decisions:
- source_word: וַיִּתֹּם הַכֶּסֶף
  choice: Fedha ilipokwisha
  rationale: Kitenzi תמם kinaonyesha kuisha kabisa; “ilipokwisha” ni Kiswahili cha kawaida na huunganisha kwa ufasaha hali hii na tukio linalofuata. “Fedha” hapa ina maana ya pesa au njia ya malipo.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: katika nchi ya Misri na nchi ya Kanaani
  rationale: Ingawa מן kwa kawaida huweza kuwa “kutoka,” hapa maana ya kimuktadha ni kwamba fedha iliyokuwa katika nchi hizo iliisha. “Katika” ni ya asili zaidi katika Kiswahili na huepuka picha isiyo wazi ya fedha kutoka mahali.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם אֶל יוֹסֵף
  choice: Wamisri wote walimjia Yosefu
  rationale: Kiebrania husema kihalisi “Misri yote,” lakini jina la nchi linawakilisha watu wake. “Wamisri wote” huwasilisha metonimia hiyo wazi na kwa kawaida.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: Tupe chakula
  rationale: הָבָה לָּנוּ ni ombi la moja kwa moja la kupewa. לֶחֶם maana yake ya msingi ni mkate, lakini katika muktadha wa njaa inaweza kumaanisha chakula kwa ujumla; “chakula” hutoa maana inayokusudiwa kwa msomaji wa kawaida.
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: Kwa nini tufe mbele yako?
  rationale: Swali la balagha linaonyesha ombi la dharura. “Mbele yako” huhifadhi maana ya נֶגְדֶּךָ bila kuongeza neno “macho,” ambalo halipo wazi katika maandishi.
- source_word: כִּי אָפֵס כָּסֶף
  choice: Maana fedha imekwisha
  rationale: אָפֵס huonyesha kutokuwapo tena au kuisha. “Imeisha” ni fupi, ya asili, na inarudia hoja ya mwanzo wa mstari.
