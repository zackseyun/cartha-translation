  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: sw
  text: Yakobo akamwambia Farao, “Siku za miaka ya ugeni wangu[a] ni mia moja na thelathini. Siku za miaka ya maisha yangu zimekuwa chache na za taabu[b], wala hazijafikia siku za miaka ya maisha ya baba zangu katika siku za ugeni wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miaka ya kukaa kwangu kama mgeni.” Neno la Kiebrania linamaanisha kuishi kama mkazi wa muda au mgeni.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi na Kiebrania, “chache na mbaya.” Hapa “mbaya” humaanisha zilizojaa shida na mateso.
    reason: lexical_clarification
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: kukaa kwangu kama mgeni / walipokuwa wakikaa kama wageni
  rationale: Neno la Kiebrania linamaanisha kuishi mahali kama mkazi wa muda au mgeni. Kiswahili hiki ni cha asili na kinadumisha hali ya mababu kama wageni wakaaji bila kuingiza wazo la kiroho la hija.
- source_word: יְמֵי שְׁנֵי
  choice: siku za miaka ya
  rationale: Muundo huu unahifadhi uradidi wa makusudi wa ‘siku’ na ‘miaka’ unaotoa uzito wa heshima kwa maelezo ya muda wa maisha.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: mia moja na thelathini
  rationale: Huu ndio usemi wa kawaida na sahihi wa idadi hiyo katika Kiswahili cha sasa.
- source_word: מְעַט וְרָעִים
  choice: chache na za taabu
  rationale: ‘Chache’ huonyesha kwamba muda wa maisha ulikuwa mfupi ukilinganishwa na wa baba zake; katika muktadha huu רָעִים inaeleza maisha yaliyojaa shida, si uovu wa kimaadili.
- source_word: חַיַּי / חַיֵּי אֲבֹתַי
  choice: maisha yangu / maisha ya baba zangu
  rationale: Maneno haya yanarejelea maisha au muda wa kuishi na yanahifadhi mwendelezo wa kifamilia wa maandishi.
- source_word: הִשִּׂיגוּ
  choice: hazijafikia
  rationale: Kitenzi kina maana ya kufikia au kuifikia; hapa kinaonyesha kwamba urefu wa maisha ya Yakobo haujalingana na ule wa baba zake.
- source_word: אֲבֹתַי
  choice: baba zangu
  rationale: Katika muktadha Yakobo anawarejelea mababu wa ukoo wake. ‘Baba zangu’ ni tafsiri ya moja kwa moja inayohifadhi lugha ya kifamilia.
theological_decisions:
- issue: Yakobo kujieleza kuwa mgeni mkazi
  choice: kukaa kama mgeni
  alternative: hija
  rationale: Andiko linaeleza kwanza hali halisi ya mababu kuishi kama wageni wakaaji katika nchi. Tafsiri hii haigeuzi neno hilo kimya-kimya kuwa mfano wa safari ya kiroho.
- issue: Maana ya רָעִים kuhusu siku za maisha
  choice: za taabu
  alternative: za uovu
  rationale: Kivumishi kinaweza kumaanisha ‘mbaya’ au ‘ovu,’ lakini hapa kinaeleza shida na mateso yaliyompata Yakobo, si kwamba siku zenyewe zilikuwa na uovu wa kimaadili. Tanbihi inadumisha usemi mbadala wa karibu zaidi na umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘siku za miaka’ umehifadhiwa kwa makusudi ili kudumisha uzito na uradidi wa Kiebrania, huku ‘kukaa kama mgeni’ ikitoa maana ya מְגוּרִים kwa lugha ya asili.
