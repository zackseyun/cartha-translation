translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi, cha sasa na chenye hadhi. Tafsiri imetumia “mahitaji” ili kuhifadhi uwezekano wa nahau ya Kiebrania kuonyesha kiasi kinacholingana na watoto, huku tanbihi ikitaja pia maana ya idadi.
