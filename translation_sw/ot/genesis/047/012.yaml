  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: sw
  text: Yosefu akawapatia baba yake, ndugu zake, na watu wote wa nyumbani mwa baba yake chakula[a], kulingana na idadi ya watoto wadogo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate.” Neno la Kiebrania mara nyingi humaanisha mkate kihalisi, lakini hapa huenda linamaanisha chakula kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kulingana na kinywa cha watoto wadogo”; hii ni nahau inayoweza kumaanisha kulingana na idadi yao au mahitaji yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: akawapatia
  rationale: Kitenzi כלכל katika muktadha huu humaanisha kuwategemeza au kuwapa mahitaji ya kimwili. “Akawapatia” kinaeleza kwa Kiswahili cha kawaida kwamba Yosefu aliwapa chakula walichohitaji.
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa לֶחֶם inaweza kumaanisha “mkate” kihalisi, hapa inatumika kwa maana pana ya chakula au mahitaji ya chakula wakati wa njaa.
- source_word: כָּל בֵּית אָבִיו
  choice: watu wote wa nyumba ya baba yake
  rationale: Neno “nyumba” hapa linamaanisha jamii ya nyumbani au watu wa ukoo wanaomtegemea mkuu wa nyumba, si jengo pekee.
- source_word: לְפִי
  choice: kulingana na mahitaji ya
  rationale: Kirai hiki, ambacho kihalisi kinahusisha “kinywa,” huonyesha kipimo au mgao unaolingana na wale wanaolishwa. “Mahitaji” huhifadhi wazo la kuwapa chakula kwa kiasi kinachowafaa bila kulazimisha maana ya idadi pekee.
- source_word: הַטָּף
  choice: watoto wao wadogo
  rationale: טַף humaanisha watoto wadogo katika familia. Kiwakilishi “wao” kinafafanua kwa njia ya kawaida ya Kiswahili kwamba watoto hao walikuwa wa familia zilizotajwa.
- source_word: אָבִיו ... אֶחָיו
  choice: baba yake, ndugu zake
  rationale: Haya ni maneno ya kawaida ya uhusiano wa kifamilia. Katika muktadha huu “ndugu zake” linawarejelea ndugu wa kiume wa Yosefu.
