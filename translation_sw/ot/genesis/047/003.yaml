base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: sw
  text: Farao akawaambia ndugu zake, “Kazi yenu ni nini?” Wakamwambia Farao, “Watumishi wako ni wachungaji wa mifugo[a], sisi pamoja na baba zetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kondoo na mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Kazi yenu ni nini?
  rationale: Kirai hiki kinauliza shughuli au kazi yao ya kujipatia riziki. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana ya swali kuhusu kazi yao.
- source_word: רֹעֵה צֹאן
  choice: wachungaji wa mifugo[a]
  rationale: צֹאן hurejelea hasa mifugo midogo, yaani kondoo na mbuzi. ‘Wachungaji wa mifugo’ ni usemi wa asili wa Kiswahili, huku tanbihi ikibainisha upeo wa neno la Kiebrania.
- source_word: עֲבָדֶיךָ
  choice: Watumishi wako
  rationale: Hapa neno hili ni namna ya kujitaja kwa unyenyekevu mbele ya Farao, wala muktadha haulazimishi maana ya utumwa wa kumilikiwa.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: sisi na baba zetu pia
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba kazi hiyo iliendelea katika vizazi vyao, kama msisitizo wa גַּם ... גַּם katika Kiebrania.
- source_word: אֶל אֶחָיו
  choice: akawaambia ndugu zake
  rationale: Tafsiri inadumisha kiwakilishi cha Kiebrania; katika muktadha, hawa ni ndugu za Yosefu ambao amewaleta mbele ya Farao.
