base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: sw
  text: Wakati wa mavuno, mtampa Farao sehemu moja ya tano, na sehemu nne za tano[a] zitakuwa zenu kwa ajili ya mbegu ya kupanda shambani, chakula chenu, chakula cha watu wa nyumbani mwenu, na chakula cha watoto wenu wadogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mikono minne”; hii ni nahau inayomaanisha sehemu nne zilizobaki kati ya tano, yaani sehemu nne za tano.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: Wakati wa mavuno
  rationale: Nomino תְּבוּאָה inaweza kumaanisha mazao au mavuno; pamoja na kiambishi ב na katika muktadha huu wa mgao wa mazao, usemi wa wakati ‘Wakati wa mavuno’ unaeleza kwa kawaida wakati mazao yanapopatikana.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: mtampa Farao sehemu moja ya tano
  rationale: חֲמִישִׁית ni moja ya tano. Muundo huu wa Kiswahili unaonyesha wazi sehemu ya mazao inayopaswa kupewa Farao.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: na sehemu nne za tano[a]
  rationale: Kiebrania husema kihalisi ‘mikono minne,’ nahau inayomaanisha sehemu nne zilizobaki kati ya tano. Tafsiri ya maana yake inaeleweka kwa msomaji wa Kiswahili, huku tanbihi ikihifadhi taswira ya asili.
- source_word: יִהְיֶה לָכֶם
  choice: zitakuwa zenu
  rationale: Kauli hii inaonyesha kuwa sehemu nne zilizobaki zimetengwa kuwa mali yao au kwa matumizi yao.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: kwa ajili ya mbegu ya kupanda shambani
  rationale: Kirai hiki kinaonyesha nafaka inayohifadhiwa ili kupandwa shambani katika msimu unaofuata; tafsiri hii inaweka wazi kusudi la mbegu.
- source_word: וּלְאָכְלְכֶם
  choice: chakula chenu
  rationale: Muundo unaotokana na אכל hapa unamaanisha chakula kwa ajili yao wenyewe; ‘chakula chenu’ ni wa kawaida na mfupi.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: chakula cha watu walio katika nyumba zenu
  rationale: Kirai cha uhusiano kinaelekea kuwarejelea watu wa nyumba zao. Kutaja ‘watu’ huondoa utata usio wa lazima kuhusu vitu vilivyomo nyumbani.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: na chakula cha watoto wenu
  rationale: טַף kwa kawaida humaanisha watoto wadogo au wategemezi wa familia. ‘Watoto wenu’ ni usemi wa kawaida unaohifadhi mwelekeo wa kifamilia wa neno hilo.
