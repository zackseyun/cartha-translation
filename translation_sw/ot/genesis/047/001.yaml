base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: sw
  text: 'Ndipo Yosefu akaenda kwa Farao na kumwarifu hivi: “Baba yangu na ndugu zangu, pamoja na makundi yao ya mifugo midogo, ng’ombe wao, na kila kitu walicho nacho, wamekuja[a] kutoka nchi ya Kanaani; na tazama, wako[b] katika nchi ya Gosheni.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuja.” Kauli ya Kiebrania inaweza kusisitiza ama tukio la kuwasili lililokamilika ama matokeo yake ya sasa.
    reason: lexical_alternative
  - marker: b
    text: Au “na sasa wako” au “na hapa wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaenda kwa Farao
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kuingia. Kwa kuwa Farao ndiye anayefikiwa katika muktadha wa ikulu, “akaenda kwa Farao” ni Kiswahili cha kawaida bila kudai kwamba Yosefu aliingia ndani ya jengo fulani.
- source_word: וַיַּגֵּד ... וַיֹּאמֶר
  choice: na kumwarifu hivi
  rationale: Vitenzi viwili vya Kiebrania vinaanzisha taarifa na maneno ya Yosefu. Kiswahili cha “kumwarifu hivi” kinahifadhi dhana ya kutoa taarifa na kuanzisha nukuu bila urudiaji usio wa kawaida.
- source_word: אָבִי וְאַחַי
  choice: Baba yangu na ndugu zangu
  rationale: Huu ni uhamishaji wa moja kwa moja na wa kawaida wa viambishi vya umilikaji; katika muktadha huu “ndugu” ni wanaume, yaani kaka na ndugu zake Yosefu.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: pamoja na makundi yao ya kondoo na mbuzi, ng’ombe wao
  rationale: צאן ni mifugo midogo, hasa kondoo na mbuzi, huku בקר ikiwa ng’ombe au mifugo mikubwa. Ufafanuzi huu unaweka wazi tofauti hiyo kwa msomaji wa kawaida.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: na kila kitu walicho nacho
  rationale: Maneno haya yanajumlisha mali zao zote kwa Kiswahili cha kawaida kilicho karibu na muundo wa Kiebrania.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: wamekuja kutoka nchi ya Kanaani
  rationale: Kauli timilifu ya Kiebrania inaeleza kuwasili kulikokamilika ambako matokeo yake yanaendelea kuwapo; “wamekuja” huonyesha vyema hali hiyo katika Kiswahili.
- source_word: וְהִנָּם
  choice: na sasa wako
  rationale: הנה pamoja na kiambishi chake huvuta fikira kwenye hali iliyopo. “Na sasa wako” ni ya asili katika Kiswahili na huhifadhi mkazo wa kuwaona au kuwafikiria wakiwa huko sasa.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: katika nchi ya Gosheni
  rationale: Neno המארץ, “nchi/eneo,” limedumishwa ili kuhifadhi maelezo ya kijiografia ya maandishi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. “Kumwarifu” linafaa kwa taarifa rasmi kwa mfalme; “na sasa wako” huepuka uzito usio wa lazima wa “tazama” huku tanbihi ikihifadhi chaguo hilo la karibu zaidi na Kiebrania.
