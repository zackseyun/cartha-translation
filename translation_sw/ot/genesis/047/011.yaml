  to: Basi Yosefu akawafanya baba yake na ndugu zake wakae, akawapa ardhi iwe milki yao katika nchi ya Misri, katika sehemu bora zaidi ya nchi[a], katika nchi ya Ramesesi, kama Farao alivyoamuru.
