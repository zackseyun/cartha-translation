base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: sw
  text: Basi Yosefu akawafanya baba yake na ndugu zake wakae, akawapa ardhi iwe milki yao katika nchi ya Misri, katika sehemu bora zaidi ya nchi[a], katika nchi ya Ramesesi, kama Farao alivyoamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika sehemu teule ya nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: akawakalisha
  rationale: Hifili ya ישׁב ina maana ya kusababisha wakae au kuwaweka mahali pa kuishi. “Akawakalisha” ni ya kawaida katika Kiswahili na inadumisha maana hiyo ya kisababishi.
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: baba yake na ndugu zake
  rationale: Kiebrania kinawataja waziwazi baba na ndugu zake; tafsiri haipanui usemi huo kuwa “familia yake.” Katika muktadha huu “ndugu zake” inawarejelea kaka zake Yosefu.
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: akawapa eneo la kumiliki
  rationale: אֲחֻזָּה ni ardhi au eneo linaloshikiliwa kama milki. Usemi huu unaonyesha umilikaji wa ardhi bila kuingiza dhana maalumu ya urithi.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Neno אֶרֶץ limetafsiriwa kuwa “nchi,” kwa kufuata maana ya kijiografia na marudio ya kifungu.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: katika sehemu bora zaidi ya nchi hiyo
  rationale: מֵיטַב humaanisha sehemu iliyo bora au teule zaidi. Tafsiri hii ni ya asili katika Kiswahili na inadumisha kiwango cha ubora kinachodokezwa na neno hilo.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: katika nchi ya Ramesesi
  rationale: “Nchi” inadumisha marudio ya אֶרֶץ na inaweza kumaanisha eneo au wilaya iliyohusishwa na Ramesesi. Jina limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: kama Farao alivyoamuru
  rationale: Kifungu kinaonyesha kwamba Yosefu alitenda sawasawa na agizo la Farao; wakati uliopita katika “alivyoamuru” unafaa mtiririko wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye heshima. “Eneo la kumiliki” limetumiwa badala ya “urithi” ili kuepuka maana ya ziada ya kiteolojia ambayo haijahitajika hapa.
