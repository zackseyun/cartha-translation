base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: sw
  text: Kwa nini tufe mbele ya macho yako[a], sisi pamoja na ardhi yetu? Utununue sisi na ardhi yetu kwa mkate[b], nasi pamoja na ardhi yetu tutakuwa watumwa[c] wa Farao. Utupe mbegu ili tuishi, tusife, na ardhi isiwe ukiwa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “machoni pako.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kwa chakula; kihalisi, “kwa mkate.”
    reason: lexical_alternative
  - marker: c
    text: Au, “watumishi.” Neno la Kiebrania linaweza kutaja aina mbalimbali za utumishi, lakini hapa hali ya kufungwa kiuchumi ndiyo inayojitokeza zaidi.
    reason: lexical_alternative
  - marker: d
    text: Au, “ibaki ukiwa” au “iachwe tupu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: Kwa nini tufe
  rationale: Huwasilisha swali la kusihi na maana ya kitenzi cha Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְעֵינֶיךָ
  choice: mbele ya macho yako
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania, inayomaanisha kutokea mahali ambapo Yosefu anaona.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: sisi pamoja na ardhi yetu
  rationale: Huwakutanisha watu na ardhi kama vitu viwili vilivyo katika hatari, bila kufanya sentensi kuwa ngumu.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: Utununue sisi na ardhi yetu
  rationale: Kitenzi קנה hapa kinamaanisha ununuzi katika hali ya njaa; umbo lenye kiambishi cha kutendwa kwa niaba, 'utununue,' ni ombi la kawaida katika Kiswahili.
- source_word: בַּלָּחֶם
  choice: kwa mkate
  rationale: Huhifadhi nomino halisi 'mkate' na kutumia 'kwa' kuonyesha bei au kitu kinachotolewa kwa kubadilishana.
- source_word: עֲבָדִים לְפַרְעֹה
  choice: watumwa wa Farao
  rationale: Katika muktadha huu wa kupoteza uhuru kwa sababu ya njaa, 'watumwa' huonyesha kwa uwazi zaidi hali ya utegemezi na umilikiwa kuliko 'watumishi.'
- source_word: וְתֶן זֶרַע
  choice: Utupe mbegu
  rationale: Ingawa 'tu-' haijaandikwa kama kiwakilishi tofauti katika Kiebrania, walengwa wanaeleweka katika muktadha; kuiongeza hufanya Kiswahili kiwe wazi na cha kawaida. 'Mbegu' hudumisha maana ya nafaka ya kupanda.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: na ardhi isiwe ukiwa
  rationale: Huwasilisha matokeo ya ardhi kuachwa bila kulimwa au wakazi, huku ikihifadhi lugha pana ya Kiebrania.
