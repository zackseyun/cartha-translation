translation:
  language: sw
  text: Kisha Yakobo akambariki Farao, akaondoka katika hadhira ya Farao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamsalimu Farao” / “akaagana na Farao”; kitenzi cha Kiebrania kwa kawaida humaanisha “bariki,” lakini katika muktadha wa hadhira rasmi ya mfalme kinaweza pia kuhusisha salamu au kuaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: akambariki
  rationale: Kitenzi ברך kwa kawaida humaanisha ‘bariki.’ Katika mazingira haya ya kukutana na mfalme kinaweza pia kuhusisha salamu rasmi au kuaga; hata hivyo, maana yake ya kawaida inafaa zaidi na inalingana na matumizi yake katika mstari wa 7 na hapa.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Umbo la kawaida la Kiswahili la jina יעקב.
- source_word: אֶת
  choice: '[hakikutafsiriwa]'
  rationale: Ni kiashiria cha yambwa mahususi katika Kiebrania; hakina neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Umbo la kawaida la Kiswahili la cheo cha kifalme פרעה.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא humaanisha kutoka au kwenda nje. ‘Akatoka’ kinaonyesha kwa kawaida mwendo wa Yakobo kuondoka katika mkutano huo.
- source_word: מִלִּפְנֵי
  choice: mbele ya Farao
  rationale: Nahau hii humaanisha kihalisi ‘kutoka mbele ya’ mtu, na hapa inaeleza kuondoka katika hadhira ya Farao. Kiswahili ‘akatoka mbele ya Farao’ ni cha kawaida na huhifadhi taswira ya maandishi ya Kiebrania.
