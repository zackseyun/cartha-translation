translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi ‘Kisha … aka-’ ni wa asili, huku ‘mbele ya Farao’ ukihifadhi kwa kiasi taswira ya nahau ya Kiebrania.
