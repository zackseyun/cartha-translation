  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: sw
  text: Siku za Israeli za kufa zilipokaribia, alimwita mwanawe Yosefu, akamwambia, “Ikiwa nimepata kibali machoni pako, tafadhali weka mkono wako chini ya paja langu[a], na unitendee kwa fadhili na uaminifu[b]. Tafadhali usinizike nchini Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kuweka mkono chini ya paja kulikuwa ishara ya kiapo kizito katika masimulizi ya mababu; linganisha Mwanzo 24:2.
    reason: cultural_note
  - marker: b
    text: Au, “wema wa kudumu na uaminifu.” Maneno ya Kiebrania חֶסֶד וֶאֱמֶת yanaeleza fadhili zenye ushikamanifu na zinazotegemeka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: Wakati muda wa Israeli kufa ulipokaribia
  rationale: Nahau ya Kiebrania husema kihalisi kwamba ‘siku za Israeli zilikaribia kufa.’ ‘Muda wa Israeli kufa ulipokaribia’ huhifadhi maana ya kukaribia kwa kifo kwa Kiswahili cha kawaida bila kudokeza kwamba siku zenyewe zinakufa.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Chanzo kinatumia jina Israeli, si Yakobo; umbo la kawaida la Kiswahili limehifadhiwa.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: mwanawe Yosefu
  rationale: ‘Mwanawe’ huonyesha uhusiano uliotajwa wazi, na ‘Yosefu’ ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Ikiwa nimepata kibali machoni pako
  rationale: Huu ni usemi wa heshima wa Kiebrania. ‘Kibali’ hutoa maana ya חֵן, huku ‘machoni pako’ ikihifadhi taswira ya chanzo.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: tafadhali weka mkono wako chini ya paja langu
  rationale: Ombi limetafsiriwa kwa uwazi na ishara halisi ya kiapo imehifadhiwa; tanbihi inaeleza desturi hiyo.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: na unitendee wema wa kudumu na uaminifu
  rationale: ‘Unitendee’ ni Kiswahili cha kawaida kwa tendo linaloelekezwa kwa mtu. ‘Wema wa kudumu na uaminifu’ hudumisha uzito wa fadhili yenye ushikamanifu na kutegemeka bila kuingiza neno ‘agano’ ambalo halipo wazi katika mstari.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: Tafadhali usinizike nchini Misri
  rationale: נָא huonyesha ombi la kusihi, na ‘nchini Misri’ ni usemi wa kawaida na ulio wazi katika Kiswahili.
theological_decisions:
- issue: Maana ya חֶסֶד וֶאֱמֶת katika ombi la kiapo cha kifamilia
  choice: wema wa kudumu na uaminifu
  alternative: fadhili thabiti na uaminifu; upendo thabiti na uaminifu
  rationale: Jozi hii inaunganisha wema wenye ushikamanifu na kutegemeka. Tafsiri iliyochaguliwa huhifadhi uzito huo bila kuamua kwamba neno ‘agano’ lazima litajwe moja kwa moja.
- issue: Ishara ya kuweka mkono chini ya paja
  choice: Kuhifadhi maneno halisi katika matini na kueleza desturi katika tanbihi
  alternative: Kufafanua moja kwa moja kuwa ‘niapie’
  rationale: Kuhifadhi ishara hiyo kunatunza uhalisi na mvutano wa kitamaduni wa simulizi; tanbihi humsaidia msomaji bila kufuta taswira ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa kawaida kwa msomaji wa leo, huku jina ‘Israeli,’ taswira ya ‘machoni pako,’ na ishara ya kiapo chini ya paja vikihifadhiwa.
