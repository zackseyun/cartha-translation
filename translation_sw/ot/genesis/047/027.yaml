  terminology: “Israeli,” “Misri,” na “Gosheni” ni majina yanayofaa katika Kiswahili sanifu. “Wakazaa na kuongezeka sana” huhifadhi jozi ya Kiebrania פרה ורבה na mwangwi wake wa Mwanzo. Tanbihi irejeshe “mali” badala ya “milki,” na iepuke “wakashikwa,” ambayo katika Kiswahili kawaida humaanisha kukamatwa badala ya maana ya kitenzi cha Kiebrania katika kauli ya Niphal.
