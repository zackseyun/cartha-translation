base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: sw
  text: Basi Israeli akakaa katika nchi ya Misri, katika nchi ya Gosheni. Nao wakajipatia mali humo[a], wakazaa na kuongezeka sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakapata umiliki humo,” “wakaimarika humo,” au, kwa tafsiri ya karibu zaidi, “wakashikamana nayo.” Kitenzi cha Kiebrania kinaweza kumaanisha kupata sehemu ya kumiliki au kuwa na makao imara katika nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akafanya makao
  rationale: Usemi huu unaonyesha kukaa kwa uthabiti na kuanzisha makazi, si kuwapo kwa muda tu.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina lililotumiwa katika Kiebrania limehifadhiwa; umoja wake pia unadumisha mpito wa makusudi kwenda kwenye vitenzi vya wingi vinavyoihusu nyumba yake.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Neno 'nchi' limehifadhiwa ili kuonyesha msisitizo wa kieneo uliomo katika maandishi ya Kiebrania.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: katika nchi ya Gosheni
  rationale: Muundo wa Kiebrania umefuatwa na Gosheni imeonyeshwa kuwa eneo maalumu ndani ya Misri.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: wakapata milki humo
  rationale: Hii inaeleza kupata sehemu au umiliki katika nchi na hivyo kuimarika humo, huku tanbihi ikihifadhi upana wa maana ya kitenzi cha Kiebrania.
- source_word: וַיִּפְרוּ
  choice: wakazaa
  rationale: Neno hili linahifadhi lugha ya uzao na mwangwi wa baraka ya kuzaa inayojirudia katika Mwanzo.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: wakaongezeka sana
  rationale: Tafsiri hii ni ya kawaida na wazi, na inawasilisha ongezeko kubwa la idadi.
theological_decisions:
- issue: Maana wakilishi ya 'Israeli'
  choice: Kudumisha 'Israeli' katika umoja, kisha kutumia wingi kwa nyumba au wazao wake
  alternative: Kutafsiri tangu mwanzo kuwa 'Waisraeli' au kubadili jina kuwa 'Yakobo'
  rationale: Maandishi yanaanza na jina 'Israeli' pamoja na kitenzi cha umoja, kisha yanahamia vitenzi vya wingi. Kudumisha mpito huo kunahifadhi namna baba wa ukoo anavyowakilisha familia yake bila kuondoa mvutano wa kisarufi na kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi ya pili inahifadhi mabadiliko kutoka umoja wa 'Israeli' kwenda wingi unaoihusu familia yake. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachofafanuliwa.
