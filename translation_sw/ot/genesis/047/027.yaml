  source_fidelity: 'Maana ya jumla imehifadhiwa vizuri: umoja wa “Israeli” kisha wingi wa familia yake, pamoja na “wakazaa na kuongezeka sana.” Hata hivyo, “akafanya makao” si uwasilishaji wa moja kwa moja na wa kawaida zaidi wa וַיֵּשֶׁב katika muktadha huu; “akakaa” huhifadhi vizuri maana ya kukaa/kuishi/kutulia. Kwa וַיֵּאָחֲזוּ בָהּ, “wakapata milki” inaweza kusikika kama kupata mamlaka au utawala, ilhali kitenzi kinaelekea kupata umiliki/mahali pa kushikilia au kuimarika katika nchi. “Wakajipatia mali” ni salama zaidi, huku tanbihi ikihifadhi mbadala.'
