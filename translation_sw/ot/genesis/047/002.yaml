  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: sw
  text: Kutoka miongoni mwa ndugu zake, Yosefu akachukua wanaume watano na kuwasimamisha mbele ya Farao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka ukingoni/mwisho wa ndugu zake” au “kutoka miongoni mwa ndugu zake walio bora zaidi.” Kihalisi, usemi wa Kiebrania unahusisha “kutoka mwisho/ukingo wa,” lakini hapa huenda una maana kwamba Yosefu alichukua watano kutoka miongoni mwa ndugu zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: Kutoka miongoni mwa
  rationale: Ingawa קָצֶה kwa kawaida humaanisha “mwisho” au “ukingo,” pamoja na מִן na katika muktadha huu usemi huo unaeleweka kwa maana ya kuchukua baadhi kutoka katika kundi kubwa. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu אָח inawahusu ndugu wa kiume wa Yosefu. Kiswahili “ndugu zake” ni cha kawaida na muktadha unaweka wazi kuwa ni wanaume.
- source_word: לָקַח
  choice: akachukua
  rationale: לָקַח kimsingi humaanisha “kuchukua.” “Akachukua” huhifadhi maana hiyo bila kuifanya kwa lazima kuwa “akachagua,” ingawa uteuzi unaeleweka kutokana na muktadha.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: wanaume watano
  rationale: Hii inawakilisha moja kwa moja namba na nomino ya Kiebrania, na ni wazi kuwa wanaume hao walikuwa miongoni mwa ndugu zake Yosefu.
- source_word: וַיַּצִּגֵם
  choice: akawasimamisha
  rationale: Hifili ya יָצַג ina maana ya kuwaweka au kuwasimamisha watu mbele ya mtu mwingine. “Akawasimamisha” ni ya asili katika tukio hili la kufikishwa mbele ya mfalme na huhifadhi taswira halisi kuliko “akawatambulisha.”
- source_word: לִפְנֵי פַרְעֹה
  choice: mbele ya Farao
  rationale: לִפְנֵי humaanisha “mbele ya” au “katika uwepo wa.” Usemi “mbele ya Farao” ni mfupi, wa kawaida, na unafaa mazingira ya kifalme.
