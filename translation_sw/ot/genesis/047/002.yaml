translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Mfuatano wa vitenzi vya wakati uliopita kwa kiambishi -ka- unafaa simulizi ya Biblia. Tanbihi inadumisha utata halisi wa וּמִקְצֵה bila kulazimisha mapokeo yanayosema waliochukuliwa walikuwa bora zaidi.
