lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa waw-consecutive unaendeleza simulizi kwa tukio linalofuata; ‘Ndipo ... akamwambia’ ni Kiswahili cha kawaida kinachoonyesha mfuatano huo na pia mlengwa wa usemi.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo jina la cheo cha mfalme wa Misri lililozoeleka katika Kiswahili cha Biblia.
- source_word: אֶל יוֹסֵף
  choice: akamwambia Yosefu
  rationale: Kihusishi אֶל kinamtaja anayeelekezewa usemi; Kiswahili hulieleza kwa kawaida ndani ya kitenzi ‘akamwambia,’ huku יוֹסֵף likiwa ‘Yosefu.’
- source_word: לֵאמֹר
  choice: limeachwa bila neno tofauti
  rationale: Baada ya kitenzi cha kusema, לֵאמֹר hutanguliza maneno ya moja kwa moja; kulitafsiri tena kama ‘akisema’ kungekuwa na uradidi usio wa lazima katika Kiswahili cha sasa.
- source_word: אָבִיךָ
  choice: Baba yako
  rationale: Ni nomino yenye kiambishi cha umilikaji cha nafsi ya pili, ikielekezwa kwa Yosefu.
- source_word: וְאַחֶיךָ
  choice: na ndugu zako
  rationale: אַחִים hapa humaanisha ndugu wa kiume wa Yosefu. Katika Kiswahili ‘ndugu’ halibainishi jinsia kisarufi, lakini muktadha unawatambulisha kuwa kaka au ndugu zake wa kiume.
- source_word: בָּאוּ
  choice: wamekuja
  rationale: Kitenzi timilifu kinaripoti tendo lililokamilika lenye umuhimu wa sasa katika mazungumzo; ‘wamekuja’ linaonyesha maana hiyo kwa kawaida.
- source_word: אֵלֶיךָ
  choice: kwako
  rationale: Kihusishi pamoja na kiambishi cha nafsi ya pili kinaonyesha mwendo kuelekea kwa Yosefu; ‘kwako’ ni tafsiri fupi na ya kawaida bila kuongeza wazo la ‘hapa.’
