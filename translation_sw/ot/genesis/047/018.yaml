base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: sw
  text: Mwaka huo ulipokwisha, walimjia katika mwaka wa pili, wakamwambia, “Hatutaweza kumficha bwana wangu kwamba pesa zimekwisha[a], na mifugo imekuwa mali ya bwana wangu. Mbele ya bwana wangu hakujabaki chochote isipokuwa miili yetu[b] na ardhi yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fedha zimekwisha.” Neno la Kiebrania ni “silver”; mara nyingi hutumiwa kumaanisha pesa za malipo.
    reason: lexical_alternative
  - marker: b
    text: Au, “sisi wenyewe.” Kiebrania kinasema kihalisi “miili yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: Mwaka huo ulipokwisha
  rationale: Kitenzi תמם kinaonyesha kufikia mwisho; muundo huu ni wa kawaida katika Kiswahili na unaendeleza uhusiano wa wakati.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: katika mwaka wa pili
  rationale: Huhifadhi usemi wa Kiebrania ‘mwaka wa pili’ bila kuubadili kimya kimya kuwa ‘mwaka uliofuata.’
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: Hatutamficha bwana wangu jambo hili
  rationale: כחד katika piel ni kuficha au kusitiri. ‘Jambo hili’ linaweka wazi yambwa linalodokezwa, huku ‘bwana wangu’ ikihifadhi kiambishi cha umoja cha Kiebrania.
- source_word: תַּם הַכֶּסֶף
  choice: fedha imekwisha
  rationale: תם hapa ni kuisha kabisa; ‘fedha’ ni neno la kawaida la Kiswahili kwa mali inayotumiwa kulipa, ingawa Kiebrania kihalisi kina ‘silver.’
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: na mifugo imekuwa mali ya bwana wangu
  rationale: מִקְנֵה הַבְּהֵמָה inahusu mali ya mifugo, na אֶל אֲדֹנִי katika muktadha huu inaonyesha kuwa umiliki umehamia kwa bwana wao.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: Mbele ya bwana wangu hakujabaki chochote
  rationale: Huhifadhi taswira ya Kiebrania ‘mbele ya bwana wangu’ na kueleza kwa Kiswahili cha kawaida kwamba hakuna kilichosalia.
- source_word: בִּלְתִּי אִם גְּוִיָּתֵנוּ וְאַדְמָתֵנוּ
  choice: isipokuwa miili yetu na ardhi yetu
  rationale: בִּלְתִּי אִם ni kishazi cha kuondoa, na גְּוִיָּתֵנוּ hapa hurejelea miili au nafsi zao wakiwa hai; ‘miili yetu’ huhifadhi ukonkriti wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa heshima ‘bwana wangu’ umehifadhiwa katika umoja kama ulivyo katika Kiebrania, ingawa kundi ndilo linalozungumza. Alama za tanbihi zimewekwa baada ya maneno yanayohusika, si katika nafasi zilizohamishwa katika safu ya mashauriano ya Kiingereza.
