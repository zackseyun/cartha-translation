base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: sw
  text: Wakamwambia Farao, “Tumekuja kukaa kwa muda katika nchi[a], kwa sababu hakuna malisho kwa ajili ya kondoo na mbuzi wa watumishi wako, maana njaa ni kali katika nchi ya Kanaani. Sasa basi, tafadhali waruhusu watumishi wako wakae katika nchi ya Gosheni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukaa kama wageni katika nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָגוּר
  choice: kuishi kwa muda
  rationale: Kitenzi גור hapa kinaonyesha kukaa kama wageni au wakazi wa muda, si makazi ya kudumu; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: בָּאָרֶץ
  choice: katika nchi hii
  rationale: אֶרֶץ inarejelea eneo la Misri walilofikia; kiwakilishi “hii” kinaweka wazi rejeo linaloeleweka katika mazungumzo bila kuongeza jina lisilo katika maandishi.
- source_word: מִרְעֶה
  choice: malisho
  rationale: Neno hili humaanisha sehemu au chakula cha kulishia wanyama; “malisho” ni neno fupi na la kawaida katika muktadha wa ufugaji.
- source_word: לַצֹּאן
  choice: kwa ajili ya mifugo
  rationale: צֹאן ni jina la mkusanyiko wa wanyama wadogo wa kufugwa, hasa kondoo na mbuzi; “mifugo” huhifadhi upana huo bila kutaja aina moja tu.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: ya watumishi wako
  rationale: Kirai kinaonyesha umilikaji na pia kinahifadhi namna yao ya kujitaja kwa unyenyekevu mbele ya Farao.
- source_word: כָבֵד הָרָעָב
  choice: njaa ni kali
  rationale: כָבֵד maana yake ya msingi ni “nzito,” lakini inapohusishwa na njaa hueleza ukali wake; “kali” ni Kiswahili cha asili katika muktadha huu.
- source_word: יֵשְׁבוּ נָא
  choice: tafadhali waruhusu ... wakae
  rationale: Muundo wa ombi pamoja na נָא unaonyesha dua yenye heshima; “tafadhali waruhusu ... wakae” huwasilisha kwa kawaida ombi hilo bila kudokeza lazima makazi yawe ya kudumu.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Ingawa עבד pia linaweza kumaanisha mtumwa, hapa ni namna ya heshima na unyenyekevu ya kujitaja mbele ya mfalme.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: nchi ya Gosheni
  rationale: Tafsiri hii inahifadhi muundo wa Kiebrania na kutaja wazi eneo la kijiografia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kuishi kwa muda” limetumiwa badala ya istilahi nzito ili kuhifadhi dhana ya ukaaji usio wa kudumu; “watumishi wako” inadumisha lugha ya heshima ya ikulu.
