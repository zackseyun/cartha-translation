  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: sw
  text: “Nitakapolala na baba zangu[a], unibebe kutoka Misri, ukani zike katika mahali pa maziko yao[b].” Naye akasema, “Mimi nitafanya kama ulivyosema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mababu zangu.” Usemi wa Kiebrania wa “kulala na baba zangu” ni nahau inayohusishwa na kifo na maziko.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika kaburi lao” au “katika eneo lao la maziko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: Nitakapolala
  rationale: Kitenzi שׁכב kimsingi ni ‘kulala’ au ‘kujilaza,’ na hapa ni nahau inayohusishwa na kifo na maziko. ‘Nitakapolala’ huhifadhi taswira ya Kiebrania huku ikionyesha kwa Kiswahili uhusiano wa wakati na maagizo yanayofuata.
- source_word: עִם אֲבֹתַי
  choice: pamoja na baba zangu
  rationale: Neno אָבוֹת linaweza kumaanisha baba au mababu. ‘Baba zangu’ huhifadhi lugha ya kifamilia ya nahau ya Kiebrania, huku tanbihi ikionyesha maana mbadala ‘mababu zangu.’
- source_word: וּנְשָׂאתַנִי
  choice: unichukue
  rationale: Katika muktadha huu נשׂא humaanisha kuuchukua au kuusafirisha mwili. ‘Unichukue’ ni ya kawaida na ya heshima katika Kiswahili; wazo la kuondolewa Misri linawekwa wazi na kirai kinachofuata.
- source_word: מִמִּצְרַיִם
  choice: kutoka Misri
  rationale: Hutafsiri kwa kawaida maana ya מן ya kuondoka au kuondolewa mahali fulani bila kuongeza maelezo yasiyomo katika matini.
- source_word: וּקְבַרְתַּנִי
  choice: unizike
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya קבר katika Kiswahili.
- source_word: בִּקְבֻרָתָם
  choice: mahali walipozikwa
  rationale: Neno קְבֻרָה hapa linaelekeza kwenye mahali pa maziko yao. Usemi huu ni wa asili katika Kiswahili na hauamui bila sababu kama ni kaburi moja, pango, au aina nyingine ya eneo la maziko.
- source_word: וַיֹּאמַר
  choice: Naye akasema
  rationale: Huhifadhi mtiririko wa kawaida wa simulizi la Kiebrania na kumrejelea Yosefu bila kuongeza jina lisilo katika mstari huu.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: Mimi nitafanya
  rationale: Kiwakilishi huru אָנֹכִי kina uzito wa msisitizo; kutaja ‘Mimi’ wazi huhifadhi msisitizo huo kwa Kiswahili.
- source_word: כִדְבָרֶךָ
  choice: kama ulivyosema
  rationale: Ni Kiswahili cha kawaida kinachowasilisha maana ya ‘sawasawa na neno lako’ au kutii ombi lililotolewa.
theological_decisions:
- issue: Nahau ya kulala pamoja na baba zake
  choice: Taswira ya ‘kulala’ imehifadhiwa bila kuitafsiri moja kwa moja kuwa ‘kufa.’
  alternative: Nitakapokufa na kuungana na mababu zangu
  rationale: Matini ya Kiebrania hutumia nahau yenye taswira ya kulala; kuitaja ‘kufa’ na ‘kuungana’ kungeeleza maana kwa namna ambayo inaondoa taswira na huenda ikaongeza dhana isiyotamkwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa ombi umewekwa wa kawaida katika Kiswahili, huku taswira ya Kiebrania, msisitizo wa ‘Mimi,’ na kutobainishwa kwa aina halisi ya mahali pa maziko vikihifadhiwa.
