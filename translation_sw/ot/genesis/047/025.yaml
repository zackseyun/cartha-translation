  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: sw
  text: Nao wakasema, “Umetuweka hai. Tupate kibali machoni pa bwana wangu[a], nasi tutakuwa watumwa wa Farao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tupate kibali kwa bwana wangu.” Usemi “kupata kibali machoni pa” ni nahau ya Kiebrania ya kuomba upendeleo kwa heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakasema
  rationale: Kiunganishi pamoja na kitenzi cha masimulizi kimetafsiriwa kwa mtiririko wa kawaida wa Kiswahili, kikianzisha maneno yao ya moja kwa moja.
- source_word: הֶחֱיִתָנוּ
  choice: Umetuweka hai
  rationale: Hifili ya חיה ina maana ya kusababisha mtu aishi au kuhifadhi uhai wake. Tafsiri hii inadumisha maana hiyo bila kuingiza wazo la wokovu wa kiroho.
- source_word: נִמְצָא חֵן
  choice: Na tupate kibali
  rationale: Umbo la yiqtol la nafsi ya kwanza wingi linaeleweka hapa kama ombi la heshima. ‘Na tupate’ ni njia ya kawaida ya Kiswahili ya kuwasilisha ombi hilo.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: machoni pa bwana wangu
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania ya ‘kupata kibali machoni pa’ na pia umilikishi wa umoja katika ‘bwana wangu,’ akimaanisha Yosefu.
- source_word: וְהָיִינוּ
  choice: nasi tutakuwa
  rationale: Katika muktadha huu, kitenzi kinaonyesha matokeo au ahadi inayofuata ombi lao; wakati ujao unaeleza hilo kwa kawaida.
- source_word: עֲבָדִים
  choice: watumwa
  rationale: Katika mazingira haya ya kiuchumi, neno hilo linaonyesha hali ya watu waliofungwa katika utumishi wa Farao, si wafanyakazi wa kawaida tu.
- source_word: לְפַרְעֹה
  choice: wa Farao
  rationale: Muundo huu wa Kiswahili unaonyesha kwa ufupi kwamba utumwa wao ungekuwa chini ya mamlaka na umiliki wa Farao.
