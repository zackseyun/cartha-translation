  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: sw
  text: Hakukuwa na chakula katika nchi yote[a], kwa sababu njaa ilikuwa kali sana; nayo nchi ya Misri na nchi ya Kanaani zikadhoofika[b] kwa sababu ya njaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mkate”; hapa huenda neno hilo linamaanisha chakula kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au “zikanyong’onyea” au “zikalegea.” Kitenzi cha Kiebrania kimetumiwa kisitiari kueleza jinsi njaa ilivyozidhoofisha Misri na Kanaani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa maana yake ya kawaida ni “mkate,” katika muktadha wa njaa neno hili linatumika kwa maana pana ya chakula kwa ujumla.
- source_word: אֵין
  choice: hakukuwa na
  rationale: Hii ni tafsiri ya kawaida ya kikanushi cha uwepo katika simulizi la wakati uliopita.
- source_word: בְּכָל הָאָרֶץ
  choice: katika nchi yote
  rationale: Hapa neno הָאָרֶץ linarejelea eneo lote lililoathiriwa katika muktadha, si dunia nzima.
- source_word: כָבֵד ... מְאֹד
  choice: ilikuwa kali sana
  rationale: Kwa habari ya njaa, maana ya kisitiari ya “nzito sana” ni ukali mkubwa; Kiswahili cha kawaida husema “njaa kali sana.”
- source_word: הָרָעָב
  choice: njaa
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa hali ya upungufu mkubwa wa chakula inayozungumziwa hapa.
- source_word: וַתֵּלַהּ
  choice: zikadhoofika
  rationale: Kitenzi kinaonyesha kuchoka, kulegea, au kunyong’onyea kutokana na njaa. “Zikadhoofika” kinaeleweka kwa urahisi na kinadumisha taswira ya nchi hizo kuathiriwa kana kwamba ni watu.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: nchi ya Misri na nchi ya Kanaani
  rationale: Kurudia “nchi ya” kunafuata muundo wa Kiebrania na kudumisha mkazo wa kijiografia.
- source_word: מִפְּנֵי הָרָעָב
  choice: kwa sababu ya njaa
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kishazi kinachoonyesha sababu.
