translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza mwendelezo wa Kiebrania. “Makundi ya kondoo na mbuzi” na “makundi ya ng’ombe” yanaweka wazi makundi mawili ya mifugo, na “kwa kubadilishana na” linafafanua hali ya biashara bila kudokeza malipo ya fedha.
