base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: sw
  text: Basi wakaleta mifugo yao kwa Yosefu, naye Yosefu akawapa chakula kwa kubadilishana na farasi, makundi ya kondoo na mbuzi, makundi ya ng’ombe, na punda. Akawatunza[a] kwa chakula kwa kubadilishana na mifugo yao yote[b] katika mwaka huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “akawaongoza kwa chakula.” Kitenzi hicho kinaweza kumaanisha kuongoza, kuelekeza, kusimamia, au kutunza; hapa huenda kinamaanisha kuwategemeza wakati wa njaa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mifugo yao yote.” Muktadha unaonyesha kwamba mifugo hiyo ilitolewa kwa kubadilishana na chakula.
    reason: previous_rendering
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: mifugo yao / mifugo yao yote
  rationale: Neno hili linahusu kwa ujumla wanyama wa kufugwa waliomilikiwa, si ng’ombe peke yao; “mifugo” ni neno la kawaida na pana katika Kiswahili.
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa maana ya msingi inaweza kuwa “mkate,” katika habari hii ya njaa neno hilo linamaanisha chakula cha kuwategemeza watu kwa upana. “Chakula” ni cha asili zaidi katika Kiswahili na kinafaa katika muktadha huu.
- source_word: בַּסּוּסִים
  choice: kwa kubadilishana na farasi
  rationale: Kihusishi ב kinaonyesha kitu kilichotolewa kama malipo ya kubadilishana; usemi huu unaweka wazi kwamba Yosefu alitoa chakula na kupokea farasi.
- source_word: מִקְנֵה הַצֹּאן
  choice: makundi ya kondoo na mbuzi
  rationale: צֹאן ni kundi la mifugo midogo linaloweza kujumuisha kondoo na mbuzi; kutaja aina zote mbili huepuka kulipunguza kuwa kondoo pekee.
- source_word: מִקְנֵה הַבָּקָר
  choice: makundi ya ng’ombe
  rationale: Kifungu hiki kinarejelea mifugo mikubwa, hasa ng’ombe; “makundi ya ng’ombe” ni wazi na cha kawaida.
- source_word: חֲמֹרִים
  choice: punda
  rationale: Hili ndilo neno la kawaida la Kiswahili cha sasa.
- source_word: וַיְנַהֲלֵם
  choice: akawatunza
  rationale: Kitenzi נהל kinaweza kumaanisha kuongoza, kusimamia, au kutunza. Katika muktadha wa njaa, kinaonyesha kwamba Yosefu aliwategemeza kwa kuwapa chakula, huku tanbihi ikihifadhi taswira halisi ya “kuongoza.”
- source_word: בַּלֶּחֶם
  choice: kwa chakula
  rationale: Kihusishi kinaonyesha njia aliyotumia kuwatunza; tafsiri hii pia inadumisha kurudiwa kwa neno לֶחֶם katika aya.
- source_word: בְּכָל מִקְנֵהֶם
  choice: kwa kubadilishana na mifugo yao yote
  rationale: Kifungu hiki kinajumlisha shughuli nzima ya kubadilishana. Kutaja wazi kubadilishana huepuka dhana kwamba chakula kilikuwa kwa ajili ya kulisha mifugo.
- source_word: בַּשָּׁנָה הַהִוא
  choice: katika mwaka huo
  rationale: Hiki ni kirai cha wakati kinachoonyesha kipindi ambacho mpango huo ulifanyika.
