  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: sw
  text: Nchi ya Misri iko mbele yako.[a] Wape baba yako na ndugu zako makao katika sehemu bora zaidi ya nchi; waishi katika nchi ya Gosheni. Na ikiwa unajua kwamba miongoni mwao wamo watu wenye uwezo,[b] waweke kuwa wasimamizi wa mifugo yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Iko mbele yako” ni nahau ya Kiebrania ambayo hapa inaweza kumaanisha kwamba nchi hiyo iko wazi kwake ili achague mahali pa kuwakalisha.
    reason: cultural_note
  - marker: b
    text: Au “watu hodari,” “watu stadi,” au, kihalisi zaidi, “watu wenye nguvu/uwezo.” Katika muktadha huu, kirai hicho si lazima kimaanishe ushujaa wa kivita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: Nchi ya Misri iko mbele yako
  rationale: Inahifadhi taswira ya nahau ya Kiebrania huku tanbihi ikieleza kwamba katika muktadha huu Farao anampa Yosefu uhuru wa kuchagua mahali nchini Misri.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: katika sehemu bora zaidi ya nchi
  rationale: מֵיטַב inaonyesha sehemu iliyo bora au teule; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: הוֹשֵׁב
  choice: Wape ... makao
  rationale: Kauli ya kusababisha ya ישׁב inamtaka Yosefu awafanye wakae huko; usemi huu unaeleza maana hiyo kwa Kiswahili cha kawaida.
- source_word: יֵשְׁבוּ
  choice: waishi
  rationale: Hapa ישׁב inahusu kukaa au kuishi mahali fulani, si kitendo cha kuketi.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: katika nchi ya Gosheni
  rationale: Neno 'nchi' limehifadhiwa kwa kuwa linatajwa wazi katika Kiebrania.
- source_word: וְאִם יָדַעְתָּ
  choice: Na ikiwa unajua kwamba
  rationale: Inahifadhi muundo wa sharti unaotegemea yale Yosefu anayoyajua kuhusu ndugu zake.
- source_word: אַנְשֵׁי חַיִל
  choice: watu wenye uwezo
  rationale: Katika muktadha wa usimamizi wa mifugo, kirai hiki kinaelekea kumaanisha watu hodari, stadi, au wenye sifa zinazofaa, wala si lazima mashujaa wa vita.
- source_word: וְשַׂמְתָּם
  choice: waweke kuwa
  rationale: שׂים ni kuweka au kuteua; hapa inahusu kuwapa jukumu rasmi la usimamizi.
- source_word: שָׂרֵי מִקְנֶה
  choice: wasimamizi wa mifugo
  rationale: שָׂרֵי humaanisha viongozi, maafisa, au wasimamizi, na מִקְנֶה ni mifugo; tafsiri hii inafaa muktadha wa kazi waliyopewa.
- source_word: עַל אֲשֶׁר לִי
  choice: wa mifugo yangu
  rationale: Kiebrania kinasema kihalisi 'juu ya kile kilicho changu'; muktadha unaonyesha kwamba kinachokusudiwa ni mifugo ya Farao.
