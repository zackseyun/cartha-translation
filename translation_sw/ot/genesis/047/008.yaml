  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: sw
  text: Farao akamwambia Yakobo, “Siku za miaka ya maisha yako ni ngapi?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Siku za miaka ya maisha yako ni ngapi?” Huu ni msemo rasmi wa Kiebrania wa kuuliza umri wa Yakobo.'
    reason: cultural_note
  - marker: b
    text: 'Kwa Kiswahili cha kawaida zaidi: “Una umri wa miaka mingapi?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa kawaida katika Kiswahili na kuhifadhi maana ya ‘akasema kwa’ bila kubadili kitenzi kuwa ‘akauliza.’
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo jina la cheo cha mfalme wa Misri lililozoeleka katika Kiswahili cha Biblia.
- source_word: אֶל יַעֲקֹב
  choice: Yakobo
  rationale: Kiambishi cha yambwa katika ‘akamwambia’ kinawakilisha אֶל, naye יַעֲקֹב anatajwa kwa umbo la kawaida la Kiswahili, ‘Yakobo.’
- source_word: כַּמָּה
  choice: ni ngapi
  rationale: Ni swali la idadi, likirejelea siku katika msemo unaofuata.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: Siku za miaka ya maisha yako
  rationale: Tafsiri hii inadumisha msemo rasmi wa Kiebrania unaotaja ‘siku,’ ‘miaka,’ na ‘maisha,’ badala ya kuufupisha kimya-kimya kuwa swali la kawaida kuhusu umri.
