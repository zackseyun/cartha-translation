  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: sw
  text: Yakobo aliishi katika nchi ya Misri kwa miaka kumi na saba, na siku za Yakobo, yaani miaka ya maisha yake,[a] zilikuwa miaka mia moja arobaini na saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “siku za Yakobo, miaka ya maisha yake,” nahau ya Kiebrania inayomaanisha muda wote wa maisha yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi חיה katika muktadha huu kinaeleza kwamba Yakobo aliendelea kuishi kwa kipindi kilichotajwa; “aliishi” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Inahifadhi nomino אֶרֶץ (“nchi”) iliyo wazi katika Kiebrania, huku ikibaki Kiswahili cha kawaida.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: miaka kumi na saba
  rationale: Huu ni mpangilio wa kawaida wa namba hiyo katika Kiswahili.
- source_word: יְמֵי יַעֲקֹב
  choice: Siku za Yakobo
  rationale: Inahifadhi taswira na nahau ya Kiebrania badala ya kuibadili moja kwa moja kuwa “maisha ya Yakobo.”
- source_word: שְׁנֵי חַיָּיו
  choice: yaani miaka ya maisha yake
  rationale: Kirai hiki kinafafanua “siku za Yakobo.” Neno “yaani” linaonyesha uhusiano huo wa ufafanuzi kwa Kiswahili cha asili bila kubadili maana.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: miaka mia moja arobaini na saba
  rationale: Mpangilio wa namba umewekwa kwa namna ya kawaida katika Kiswahili na jumla ya miaka imehifadhiwa sawasawa.
