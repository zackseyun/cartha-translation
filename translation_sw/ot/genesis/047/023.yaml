  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: sw
  text: Kisha Yosefu akawaambia watu, “Tazameni, leo nimewanunua ninyi na ardhi yenu kwa ajili ya Farao. Hizi hapa mbegu kwa ajili yenu, nanyi mtaipanda ardhi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha Yosefu akawaambia
  rationale: Waw ya kisimulizi inaendeleza mfuatano wa matukio; “Kisha” ni ya kawaida katika simulizi la Kiswahili, na “akawaambia” humfaa msemaji anayelihutubia kundi.
- source_word: הָעָם
  choice: watu
  rationale: Neno hili linarejelea wananchi wa Misri waliohutubiwa kwa pamoja; “watu” ni tafsiri wazi na ya kawaida.
- source_word: הֵן
  choice: Tazameni
  rationale: Chembe hii inatanguliza tangazo lenye mkazo; wingi “Tazameni” unalingana na kundi linalohutubiwa na kuhifadhi nguvu ya kuelekeza fikira.
- source_word: קָנִיתִי
  choice: nimewanunua
  rationale: Katika muktadha huu wa kiuchumi na kisheria, קנה ina maana ya kununua au kupata kuwa mali; “nimewanunua” ni ya moja kwa moja na inaendana na 47:19, huku muktadha ukionyesha kuwa walikuwa watumishi wa Farao.
- source_word: אֶתְכֶם
  choice: ninyi
  rationale: Kiwakilishi hiki kinawarejelea watu wenyewe kama walengwa wa shughuli hiyo; “ninyi” hudumisha mkazo wa Kiebrania baada ya kiambishi cha yambwa katika “nimewanunua.”
- source_word: הַיּוֹם
  choice: leo
  rationale: Hutaja wakati wa shughuli hiyo kwa lugha ya kawaida na sahihi.
- source_word: אַדְמַתְכֶם
  choice: ardhi yenu
  rationale: אדמה hapa ni mashamba au ardhi yao ya kilimo; “ardhi yenu” ni pana, wazi, na inafaa katika muktadha wa umiliki.
- source_word: לְפַרְעֹה
  choice: kwa ajili ya Farao
  rationale: Lamed inaonyesha kwamba Yosefu alifanya ununuzi huo kwa niaba na manufaa ya Farao, si kwamba alijinunulia mwenyewe.
- source_word: הֵא
  choice: Hizi hapa
  rationale: Chembe hii inaonyesha kitu kinachotolewa mbele yao; “Hizi hapa” ni usemi wa asili wa Kiswahili unaoafikiana na nomino ya wingi “mbegu.”
- source_word: זֶרַע
  choice: mbegu
  rationale: Neno hili linamaanisha mbegu ya kupanda; wingi wa Kiswahili ni wa kawaida kwa kiasi cha mbegu kinachogawiwa.
- source_word: וּזְרַעְתֶּם
  choice: nanyi mtaipanda
  rationale: Waw imehifadhiwa kwa “nanyi,” na umbo la kitenzi katika muktadha huu linaeleza hatua inayofuata kwa nguvu ya maagizo au matarajio. “Mtaipanda” ni Kiswahili cha asili na huhifadhi umbo la taarifa la Kiebrania bila kuligeuza kimyakimya kuwa amri ya moja kwa moja.
- source_word: הָאֲדָמָה
  choice: ardhi
  rationale: Hurejelea ardhi inayolimwa; “ardhi” hudumisha ulinganifu na matumizi ya awali ya אדמה.
theological_decisions:
- issue: Maana ya kununuliwa kwa watu
  choice: nimewanunua ninyi na ardhi yenu
  alternative: nimewapata ninyi na ardhi yenu kuwa mali
  rationale: Tafsiri ya moja kwa moja ya קנה inahifadhi ukali wa hali ya kiuchumi na kisheria iliyoelezwa katika kifungu bila kuipunguza. Muktadha wa aya zinazozunguka unaeleza namna walivyokuwa chini ya Farao.
- issue: Nguvu ya kitenzi וּזְרַעְתֶּם
  choice: nanyi mtaipanda ardhi
  alternative: pandeni ardhi
  rationale: Umbo hilo linaweza kufanya kazi kwa maana ya maagizo katika muktadha, lakini tafsiri yenye wakati ujao huhifadhi kwa karibu zaidi muundo wa Kiebrania na mvutano kati ya taarifa na agizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Tazameni” na “Hizi hapa” huhifadhi chembe za Kiebrania kwa lugha ya sasa; hakuna istilahi ya zamani au ya kimadhehebu iliyoingizwa.
