revisions:
- from: Lakini hakununua ardhi ya makuhani, kwa sababu makuhani walipewa posho[a] na Farao, nao walikula posho ambayo Farao aliwapa. Kwa hiyo hawakuiuza ardhi yao.
  to: Isipokuwa ardhi ya makuhani, yeye hakuiununua, kwa kuwa makuhani walikuwa na fungu kutoka kwa Farao, nao walikula fungu lao ambalo Farao aliwapa. Kwa hiyo hawakuiuza ardhi yao.
  rationale: The revision replaces the adversative ‘Lakini’ with the exception marker ‘Isipokuwa,’ replaces potentially misleading ‘posho’ with ‘fungu,’ and adjusts the footnote to reflect an assigned provision. It preserves the Hebrew’s concrete statement that the priests ate their allotted portion and its causal conclusion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:07:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Joseph as the implicit subject, the priests' land, Pharaoh as provider, the concrete verb ‘ate,’ and the concluding reason they did not sell. However, ‘Lakini’ (‘but’) does not adequately render רַק, which marks the sole exception (‘Only/Except’). ‘Posho’ commonly denotes an allowance, especially a travel or incidental-expense allowance, and is less suitable for the food provision explicitly eaten in this verse.
  naturalness: The sentence is generally fluent Standard East African Swahili. ‘Isipokuwa’ naturally expresses the exceptional force here. ‘Fungu’ is clear and idiomatic for an assigned portion; repeating it preserves the Hebrew’s repeated חֹק / חֻקָּם without awkwardness.
  terminology: ‘Makuhani,’ ‘Farao,’ ‘ardhi,’ and ‘fungu’ are appropriate. The footnote should describe the provision as an assigned portion/provision rather than ‘mahitaji,’ which can mean needs rather than what was assigned to meet them.
  issues:
  - severity: medium
    issue: ‘Lakini’ renders רַק inadequately.
    rationale: רַק introduces an exception to the preceding account, not primarily an adversative contrast. ‘Isipokuwa’ directly conveys ‘except/only.’
  - severity: medium
    issue: ‘Posho’ is an imprecise rendering of חֹק / חֻקָּם in this food context.
    rationale: Although it can mean an allowance, ‘posho’ often suggests expense money and does not naturally fit something that is eaten. ‘Fungu’ preserves the sense of an assigned portion and works naturally with ‘walikula.’
  - severity: low
    issue: The footnote’s ‘mahitaji waliyotengewa’ is broader than the source term’s assigned provision.
    rationale: The Hebrew refers to the allotted provision/portion itself, not simply to the priests’ needs.
  revised_text: Isipokuwa ardhi ya makuhani, yeye hakuiununua, kwa kuwa makuhani walikuwa na fungu kutoka kwa Farao, nao walikula fungu lao ambalo Farao aliwapa. Kwa hiyo hawakuiuza ardhi yao.
  revised_footnotes:
  - marker: a
    text: Au “mgao maalumu,” “sehemu,” au “chakula walichopangiwa.” Maneno ya Kiebrania חֹק / חֻקָּם hapa yanamaanisha fungu walilotengewa, wala si hasa sheria au amri.
    reason: lexical_alternative
  revision_rationale: The revision replaces the adversative ‘Lakini’ with the exception marker ‘Isipokuwa,’ replaces potentially misleading ‘posho’ with ‘fungu,’ and adjusts the footnote to reflect an assigned provision. It preserves the Hebrew’s concrete statement that the priests ate their allotted portion and its causal conclusion.
