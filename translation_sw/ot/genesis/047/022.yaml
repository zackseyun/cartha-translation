  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi na wa kawaida, huku marudio ya “posho” na kitenzi halisi “walikula” yakihifadhiwa kutoka katika Kiebrania.
