base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: sw
  text: Isipokuwa ardhi ya makuhani, yeye hakuiununua, kwa kuwa makuhani walikuwa na fungu kutoka kwa Farao, nao walikula fungu lao ambalo Farao aliwapa. Kwa hiyo hawakuiuza ardhi yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno hili linaonyesha hali ya pekee inayotofautiana na muhtasari uliotangulia; “Lakini” huleta tofauti hiyo kwa Kiswahili cha kawaida bila kudai kwamba ardhi yenyewe ndiyo kiima cha sentensi.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: ardhi ya makuhani
  rationale: Ni muundo wa umilikaji unaorejelea ardhi iliyokuwa mali ya makuhani.
- source_word: קָנָה
  choice: hakununua
  rationale: Muktadha ni wa Yosefu kununua ardhi wakati wa njaa; “kununua” ni neno la kawaida na sahihi.
- source_word: חֹק / חֻקָּם
  choice: posho / posho yao
  rationale: Hapa neno hilo linaashiria mgao rasmi wa mahitaji kutoka kwa Farao, si hasa sheria au amri. “Posho” ni ya asili na inafaa kwa kitu walichoweza kula.
- source_word: מֵאֵת פַּרְעֹה
  choice: na Farao
  rationale: Kiswahili cha kutendwa, “walipewa posho na Farao,” kinaeleza wazi kwamba Farao ndiye chanzo na mtoaji wa posho.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: nao walikula posho
  rationale: Inahifadhi kitenzi halisi cha Kiebrania “kula” na kuonyesha kwamba posho hiyo ilikuwa riziki yao.
- source_word: אֲשֶׁר נָתַן לָהֶם פַּרְעֹה
  choice: ambayo Farao aliwapa
  rationale: Kishazi hiki kinafafanua moja kwa moja chanzo cha posho bila kuongeza maana.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Huonyesha wazi matokeo ya sababu iliyotangulia.
- source_word: מָכְרוּ
  choice: hawakuiuza
  rationale: Kitenzi cha biashara kimefasiriwa moja kwa moja, huku kiambishi cha yambwa kikirejelea ardhi.
- source_word: אַדְמָתָם
  choice: ardhi yao
  rationale: Hurejelea mali yao ya ardhi kwa lugha ya kawaida.
theological_decisions: []
