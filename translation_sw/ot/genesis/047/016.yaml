  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: sw
  text: Yosefu akasema, “Leteni mifugo yenu, nami nitawapa[a] badala ya mifugo yenu, ikiwa fedha imekwisha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “nami nitawapa kwa/badala ya mifugo yenu”; kitu kitakachotolewa hakitajwi wazi. Muktadha wa njaa unaonyesha kuwa ni chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Leteni
  rationale: Amri ya wingi hapa inadai wakabidhi au walete mali yao; ‘Leteni’ ni ya asili katika mazingira haya ya shughuli ya kubadilishana.
- source_word: מִקְנֵיכֶם
  choice: mifugo yenu
  rationale: מִקְנֶה ni neno pana kwa wanyama wanaofugwa kama mali, hivyo ‘mifugo’ ni sahihi kuliko neno linalomaanisha ng’ombe pekee.
- source_word: וְאֶתְּנָה לָכֶם
  choice: nami nitawapa chakula
  rationale: Kiebrania hakitaji kitu kinachotolewa, lakini muktadha wa karibu wa njaa na ununuzi wa chakula unakibainisha. Kiswahili cha kawaida kinahitaji kirai kamili; ‘chakula’ kinaongezwa kwa uwazi wa kimuktadha.
- source_word: בְּמִקְנֵיכֶם
  choice: badala ya mifugo yenu
  rationale: 'בְּ hapa inaonyesha mabadilishano: chakula kinatolewa kwa kubadilishwa na mifugo.'
- source_word: אִם
  choice: ikiwa
  rationale: Maana ya msingi ya אִם ni ya sharti, ‘ikiwa.’ Ingawa katika muktadha inaweza kueleweka kwa maana ya ‘kwa kuwa,’ tafsiri hii inadumisha uwezekano wa kisarufi bila kuufuta.
- source_word: אָפֵס כָּסֶף
  choice: fedha imekwisha
  rationale: אָפֵס huonyesha kitu kumalizika au kutokuwapo tena; ‘fedha imekwisha’ ni Kiswahili cha kawaida na chenye ufupi.
