  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia ‘chakula’ kama kijalizo kinachodokezwa wazi na muktadha, huku ‘ikiwa’ ikihifadhi hali ya sharti iliyopo katika Kiebrania.
