  verdict: revise
  source_fidelity: 'Maana kuu imehifadhiwa: Yosefu aliweka kanuni ya kisheria kuhusu ardhi ya Misri, sehemu ya tano ikimhusu Farao, huku ardhi ya makuhani ikiwa ubaguzi. Hata hivyo, muundo wa mwisho wa rasimu, “Isipokuwa ardhi ya makuhani peke yao ...,” una mchanganyiko usio wa kawaida wa viashiria vya ubaguzi na unaweza kufanya “peke yao” isikike kama inawarejelea makuhani badala ya ardhi yao.'
  naturalness: Kiswahili kwa ujumla kinaeleweka, lakini “akafanya jambo hilo kuwa sheria” ni laini na wazi zaidi kuliko “akaiweka kuwa sheria” kwa kuwa kiwakilishi kinarejelea mpango uliotangulia. “Ardhi ya makuhani pekee haikuwa ya Farao” ni ya asili zaidi na bado inaweka mkazo wa ubaguzi.
  terminology: “Yosefu,” “Farao,” “sheria,” na “sehemu ya tano” ni istilahi zinazofaa katika Kiswahili Sanifu cha Afrika Mashariki. “Sehemu ya tano” huwakilisha לַחֹמֶשׁ vizuri; tanbihi ya asilimia ishirini ni mbadala unaofaa.
  issues:
