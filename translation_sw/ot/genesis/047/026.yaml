    rationale: “Isipokuwa ardhi ya makuhani peke yao haikuwa ya Farao” huweka pamoja “Isipokuwa” na “peke yao” kwa namna nzito, na “peke yao” inaweza kusomwa kama ikiwahusu makuhani. Kiebrania husisitiza kwamba ardhi ya makuhani ndiyo ubaguzi pekee.
  - severity: low
    issue: Kirejeo cha “akaiweka” si wazi kabisa
    rationale: Kiambishi cha yambwa katika “akaiweka” kinaweza kusikika kikirejelea nomino ya kiume kama “sheria,” ilhali אֹתָהּ hurejelea mpango/utaratibu uliotajwa katika muktadha uliotangulia. “Akafanya jambo hilo kuwa sheria” hulifanya rejeo hilo liwe wazi.
  - severity: low
