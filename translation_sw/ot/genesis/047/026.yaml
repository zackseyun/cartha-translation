    rationale: Kwa kuwa tafsiri kuu tayari inatafsiri חֹמֶשׁ kuwa “sehemu ya tano,” sentensi “Kiebrania kinamaanisha sehemu moja ya tano” hairuhusu tofauti ya maana zaidi. Tanbihi ifafanue mbadala wa asilimia ishirini kwa ufupi.
