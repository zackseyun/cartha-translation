  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: sw
  text: 'Kwa hiyo Yosefu akafanya jambo hilo kuwa sheria inayodumu hadi leo kuhusu ardhi ya Misri: sehemu ya tano ni ya Farao.[a] Ardhi ya makuhani pekee haikuwa ya Farao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asilimia ishirini ni ya Farao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ ... לְחֹק
  choice: akaiweka kuwa sheria
  rationale: Kitenzi שׂוּם pamoja na לְחֹק kina maana ya kuweka au kuanzisha jambo kuwa kanuni yenye nguvu ya kisheria; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: inayodumu hadi leo
  rationale: Kirai kinaonyesha kwamba sheria hiyo iliendelea kuwa na nguvu mpaka wakati wa msimuliaji; uhusishaji huu huepuka kudokeza kwamba tendo la kuiweka liliendelea.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: kuhusu ardhi ya Misri
  rationale: עַל hapa huonyesha eneo au jambo ambalo sheria inahusu, si lazima nafasi ya kimwili juu ya ardhi.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: sehemu moja ya tano ni ya Farao
  rationale: חֹמֶשׁ ni sehemu ya tano, yaani asilimia ishirini; muundo wa Kiswahili unaeleza kwa kawaida yaliyomo katika sheria huku ukihifadhi uhusiano wa sehemu hiyo na Farao.
- source_word: רַק ... לְבַדָּם
  choice: Isipokuwa ... peke yao
  rationale: רַק huanzisha hali ya pekee, na לְבַדָּם huitilia mkazo; Kiswahili hiki kinahifadhi nguvu ya vyote bila kuwa kizito mno.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: haikuwa ya Farao
  rationale: Muundo היה ל־ unaonyesha umiliki au hali ya kuwa mali ya mtu. Katika muktadha huu unakanusha kwamba ardhi ya makuhani ilikuwa mali ya Farao.
