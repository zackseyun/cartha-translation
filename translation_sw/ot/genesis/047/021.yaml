  text: Akawahamisha watu[a] kwenda mijini, kutoka upande mmoja wa eneo la Misri hadi upande mwingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwapeleka mijini.” Baadhi ya tafsiri, kwa kufuata uelewa tofauti wa matini, hutafsiri kwamba Yosefu aliwafanya watu kuwa watumishi; lakini Kiebrania hapa kinazungumzia moja kwa moja zaidi kuwahamisha.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: watu
  rationale: Neno hili linarejelea kwa ujumla wakazi wa Misri walioathiriwa na sera ya Yosefu; “watu” ni tafsiri ya kawaida na ya wazi katika Kiswahili.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: akawahamisha
  rationale: Hifili ya עבר hapa ina maana ya kusababisha watu waondoke au kuhamishwa. Ingawa Kiebrania kinatumia kiwakilishi cha umoja kwa kundi la watu, Kiswahili hutumia upatanisho wa wingi.
- source_word: לֶעָרִים
  choice: kwenda mijini
  rationale: Kihusishi ל kinaonyesha mahali walikoelekezwa. “Kwenda mijini” huonyesha wazi kwamba walihamishwa kuelekea katika miji bila kulazimisha maana ya ziada.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: kutoka upande mmoja wa eneo la Misri hadi upande mwingine
  rationale: Hii ni semi inayoonyesha eneo lote. “Eneo” linafaa kwa גְבוּל hapa kuliko “mpaka,” ambao ungeweza kueleweka kama mstari wa mpaka tu.
theological_decisions:
- issue: Kitendo cha Yosefu kwa wakazi wa Misri
  choice: akawahamisha kwenda mijini
  alternative: akawafanya watumishi; aliwahamisha kutoka mji mmoja hadi mwingine
  rationale: Maandishi ya Kimasora yanaeleza moja kwa moja kuhamishwa kwa watu. Hayasemi wazi kwamba walifanywa watumishi, kwa hiyo tafsiri haiingizi wazo hilo katika matini kuu; uwezekano huo unatajwa katika tanbihi kama usomaji tofauti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Muundo “Nao watu” unadumisha msisitizo wa Kiebrania kwa kuwaweka watu mbele ya sentensi.
