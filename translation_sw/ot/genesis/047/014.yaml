base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: sw
  text: Yosefu akakusanya fedha yote[a] iliyopatikana katika nchi ya Misri na katika nchi ya Kanaani kwa nafaka walizokuwa wakinunua, naye Yosefu akaiingiza fedha hiyo katika nyumba ya Farao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pesa yote.” Kiebrania kinasema kihalisi “fedha yote,” kikitaja madini yaliyotumiwa kama njia ya malipo.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Farao” inaweza kumaanisha si makao ya kifalme tu, bali pia watu wa nyumbani mwa Farao au hazina yake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: akakusanya
  rationale: Kitenzi לקט humaanisha kukusanya vitu kutoka sehemu au shughuli mbalimbali; ‘akakusanya’ ni cha kawaida na kinaonyesha fedha iliyopatikana kupitia miamala mingi.
- source_word: כָּל הַכֶּסֶף
  choice: fedha yote
  rationale: כֶּסֶף humaanisha kihalisi ‘fedha’ kama madini na pia fedha inayotumiwa kulipia. Neno la Kiswahili ‘fedha’ linahifadhi maana hizo zote mbili.
- source_word: הַנִּמְצָא
  choice: iliyopatikana
  rationale: Huhifadhi maana ya kitu kilichopatikana au kuwapo katika nchi hizo bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: katika nchi ya Misri na katika nchi ya Kanaani
  rationale: Muundo huu unafuata msisitizo wa kijiografia wa Kiebrania na unasikika kwa kawaida katika Kiswahili sanifu.
- source_word: בַּשֶּׁבֶר
  choice: kwa nafaka
  rationale: Katika simulizi hili שֶׁבֶר ni nafaka inayouzwa wakati wa njaa, na kihusishi ב kinaonyesha malipo yaliyotolewa kwa nafaka hiyo.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: walizokuwa wakinunua
  rationale: Kitenzi שבר katika muktadha huu humaanisha kununua nafaka; muundo wa ‘walizokuwa wakinunua’ unaonyesha tendo lililoendelea.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: akaiingiza fedha hiyo katika nyumba ya Farao
  rationale: Kiishio cha kuelekeza katika בֵּיתָה kinaonyesha mwendo wa kuingia ndani. ‘Nyumba ya Farao’ inahifadhi upana wa usemi wa Kiebrania kuliko kuufanya moja kwa moja kuwa ‘ikulu’ au ‘hazina’.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. ‘Fedha’ linafaa kwa sababu katika Kiswahili linaweza kumaanisha madini ya fedha na pia pesa. Marudio ya ‘Yosefu’ katika sentensi ya pili yanafuata msisitizo wa maandishi ya Kiebrania.
