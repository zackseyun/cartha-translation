base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: sw
  text: Kisha Yosefu akaagiza vyombo vyao[a] vijazwe nafaka, fedha za kila mmoja[b] zirudishwe katika gunia lake, na wapewe chakula cha njiani. Ndivyo walivyofanyiwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vifaa vyao vya kubebea.” Neno la Kiebrania lina maana pana kuliko “gunia,” ambalo limetajwa baadaye kwa neno tofauti.
    reason: lexical_alternative
  - marker: b
    text: “Fedha” hapa pia inaweza kumaanisha “pesa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Naye akawafanyia hivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akaagiza
  rationale: Kitenzi צוה kinaonyesha kutoa amri; “akaagiza” ni Kiswahili cha kawaida na chenye hadhi kinachofaa kwa muundo wa maagizo unaofuata.
- source_word: כְּלֵיהֶם
  choice: vyombo vyao
  rationale: כְּלִי ni neno pana kwa chombo au kifaa cha kubebea. “Vyombo” huhifadhi upana huo na kulitofautisha na שַׂק, “gunia,” linalotokea baadaye katika mstari.
- source_word: בָּר
  choice: nafaka
  rationale: בָּר hapa ni nafaka katika muktadha wa njaa nchini Misri; “nafaka” ni sahihi na halibani maana kuwa ngano pekee.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם
  choice: fedha za kila mmoja zirudishwe
  rationale: כֶּסֶף maana yake ya msingi ni fedha ya metali na pia hutumiwa kwa pesa. “Fedha” huhifadhi maana halisi na matumizi yake kama malipo katika simulizi.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: katika gunia lake
  rationale: אִישׁ ina matumizi ya kugawa, “kila mmoja,” na שַׂק ni gunia hasa. “Katika gunia lake” ni ya asili kwa tendo la kurudisha fedha ndani ya gunia.
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  choice: na wapewe chakula cha njiani
  rationale: צֵדָה ni mahitaji, hasa chakula, ya safari. Katika muktadha huu “chakula cha njiani” ni wazi na cha kawaida bila kupoteza wazo la maandalizi ya safari.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Ndivyo walivyofanyiwa
  rationale: Kitenzi cha Kiebrania ni umoja lakini mtendaji hajatajwa wazi. Muundo huu wa Kiswahili unaeleza kuwa maagizo yalitekelezwa kwa ajili yao bila kumtaja au kumsisitiza mtendaji fulani.
