translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia maumbo ya kutendwa katika maagizo ili kutotaja wasaidizi ambao maandishi ya Kiebrania hayawataji. Tofauti kati ya כְּלִי (“vyombo”) na שַׂק (“gunia”) imehifadhiwa.
