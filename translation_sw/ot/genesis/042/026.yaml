  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa mfululizo “wakapakia ... wakaondoka” unaakisi mwendo wa masimulizi ya Kiebrania bila kuwa mgumu kwa msomaji wa kawaida.
