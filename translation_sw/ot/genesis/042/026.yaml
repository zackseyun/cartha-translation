  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: sw
  text: Kisha wakapakia nafaka yao juu ya punda wao, wakaondoka hapo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyakula vyao” au “nafaka waliyonunua.” Neno la Kiebrania linaweza kumaanisha mahitaji ya chakula, lakini katika muktadha huu linaelekea zaidi kurejelea nafaka waliyoipata Misri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: wakapakia
  rationale: Ingawa kitenzi נשׂא kimsingi humaanisha kuinua au kubeba, katika muktadha wa kuweka mizigo juu ya wanyama wa safari, “wakapakia” hutoa maana ya kawaida kwa Kiswahili.
- source_word: שִׁבְרָם
  choice: nafaka yao
  rationale: Katika simulizi la Yosefu, שֶׁבֶר kwa kawaida hurejelea nafaka inayopatikana au kununuliwa wakati wa njaa. “Nafaka yao” ni wazi na mafupi huku tanbihi ikihifadhi maana pana zinazowezekana.
- source_word: עַל חֲמֹרֵיהֶם
  choice: juu ya punda wao
  rationale: עַל pamoja na kitenzi cha kupakia huonyesha mahali mzigo ulipowekwa. “Juu ya punda wao” ni Kiswahili cha kawaida na huhifadhi picha ya matini.
- source_word: וַיֵּלְכוּ מִשָּׁם
  choice: wakaondoka hapo
  rationale: Muunganiko wa הלך na מִשָּׁם unaonyesha kuondoka mahali hapo; “wakaondoka hapo” ni wa asili, wazi, na wa karibu na maana ya Kiebrania.
theological_decisions: []
