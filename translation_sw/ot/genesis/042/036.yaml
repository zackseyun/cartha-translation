review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jacob's lament, the repeated loss/absence of Joseph and Simeon, and the intended taking of Benjamin. However, “Mambo haya yote yamenipata mimi” omits the adversative force of עָלַי ... כֻּלָּנָה (“all these have been against me”). “Ndipo” is not required by the Hebrew narrative conjunction. The child-loss sense of שִׁכַּלְתֶּם is retained naturally in the revision without unnecessarily specifying “wangu.”
  naturalness: The revised wording is idiomatic Standard East African Swahili and preserves a dignified, plaintive register. “Mmenifanya nifiwe na watoto” is a natural expression of bereavement, while “yamekuwa kinyume changu” clearly expresses Jacob's sense that the events have turned against him.
  terminology: 'Personal names are retained in conventional Swahili biblical forms: Yakobo, Yosefu, Simeoni, and Benyamini. No theological terminology requires adjustment.'
  issues:
  - severity: medium
    issue: The final clause lacks the adversative sense of the Hebrew.
    rationale: “Yamenipata mimi” means that the events happened to Jacob, but עָלַי הָיוּ כֻּלָּנָה conveys that they have been against him. “Yamekuwa kinyume changu” retains this force.
  - severity: low
    issue: “Ndipo” adds a connective nuance not expressed distinctly in the source.
    rationale: The Hebrew waw-consecutive simply advances the narrative; direct narration is closer and smoother here.
  - severity: low
    issue: The lexical-alternative footnote for the final clause is absent.
    rationale: The English audit trail's b marker is misplaced after Benjamin, but its stated alternative belongs to the final Hebrew clause. Placing [b] at the final clause gives the note a correct anchor.
