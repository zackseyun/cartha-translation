base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: sw
  text: Yakobo, baba yao, akawaambia, “Mmenifanya nifiwe na watoto[a]. Yosefu hayupo tena, Simeoni pia hayupo, nanyi mnataka kumchukua Benyamini. Mambo haya yote yamekuwa kinyume changu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mmenifanya nibaki bila watoto.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Wote wako dhidi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: Mmenifanya nifiwe na watoto wangu
  rationale: Katika kauli ya Piel, kitenzi hiki humaanisha kusababisha mtu afiwe au kubaki bila watoto. Kiswahili hiki kinaweka wazi hasara ya wana inayodokezwa na muktadha na kuhifadhi uzito wa maombolezo ya Yakobo.
- source_word: אֵינֶנּוּ
  choice: hayupo tena
  rationale: Nahau hii inaonyesha kutokuwapo au kupotea, si ukanushaji wa kuwako tu. ‘Hayupo tena’ ni ya kawaida na yenye uzito katika Kiswahili.
- source_word: תִּקָּחוּ
  choice: mnataka kumchukua
  rationale: Ingawa umbo la Kiebrania ni imperfect, hapa linaonyesha hatua inayokusudiwa ambayo Yakobo anaipinga. ‘Mnataka kumchukua’ huwasilisha kusudi hilo kwa Kiswahili cha kawaida.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: Mambo haya yote yamenipata mimi
  rationale: Kauli hii inaonyesha mkusanyiko wa matukio mazito yaliyomwangukia Yakobo. Tafsiri hii ni ya asili katika Kiswahili na inahifadhi msisitizo wa עָלַי juu ya Yakobo kama mwathiriwa, bila kulazimisha maana ya uadui wa moja kwa moja.
- source_word: אֹתִי
  choice: -ni- / mimi
  rationale: Yambwa ‘mimi’ imehifadhiwa katika muundo wa kitenzi, na msisitizo wa mateso ya Yakobo unaonekana pia katika kishazi cha mwisho ‘yamenipata mimi’.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Yakobo, baba yao
  rationale: Mpangilio huu unafuata Kiebrania kwa karibu na unasikika kwa ufasaha katika Kiswahili.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa maombolezo umewekwa kwa lugha rahisi lakini yenye uzito. Alama [a] imewekwa baada ya kishazi kinachohusika. Tofauti inayohusishwa katika data ya Kiingereza na alama [b] haijawekwa kwa Benyamini, kwa kuwa inaelekea kuwa alama iliyohamishwa kimakosa: mbadala ‘Wote wako dhidi yangu’ unahusu kishazi cha mwisho, si תִּקָּחוּ.'
