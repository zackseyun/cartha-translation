base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: sw
  text: Nao wakasema, “Sisi watumishi wako ni ndugu kumi na wawili, wana wa mtu mmoja katika nchi ya Kanaani. Tazama, mdogo wetu kabisa yuko pamoja na baba yetu leo, na mmoja hayuko[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “na mmoja hayuko,” usemi wa kuficha hali ambao unaweza kumaanisha “ameondoka” au kudokeza kwamba amekufa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakasema
  rationale: Inahifadhi mwendelezo wa kisimulizi wa wayyiqtol kwa Kiswahili cha kawaida.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Ni lugha ya kujishusha kwa heshima mbele ya mtawala, si dai kwamba wao ni watumwa halisi.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: Sisi ... ni ndugu kumi na wawili
  rationale: Inawasilisha kwa kawaida katika Kiswahili idadi yao na uhusiano wao wa kindugu.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: wana wa mtu mmoja
  rationale: Inadumisha lugha ya kiume ya chanzo na kurejelea wana wa kiume wa Yakobo.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Inahifadhi nomino iliyo wazi 'nchi' na jina la mahali.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha uwasilishaji chenye uzito unaofaa na kinachoeleweka katika sajili ya Biblia ya Kiswahili.
- source_word: הַקָּטֹן
  choice: mdogo wetu
  rationale: Muktadha unaonyesha ndugu aliye mdogo zaidi; kiwakilishi 'wetu' huweka rejeleo wazi kwa Kiswahili bila kubadili maana.
- source_word: אֶת אָבִינוּ
  choice: yuko pamoja na baba yetu
  rationale: אֶת hapa inaonyesha uandamani, si alama ya yambwa.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni ulinganifu wa moja kwa moja wa kielezi cha wakati.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: na mmoja hayupo tena
  rationale: Inahifadhi usemi wa kificho wa Kiebrania unaoweza kumaanisha kutokuwapo au kudokeza kifo bila kuamua wazi.
theological_decisions:
- issue: Lugha ya kijinsia ya undugu
  choice: wana wa mtu mmoja
  alternative: watoto wa mtu mmoja
  rationale: Kiebrania ni cha kiume hasa na muktadha unawahusu wana wa kiume wa Yakobo.
- issue: Utata wa hali ya Yosefu katika אֵינֶנּוּ
  choice: mmoja hayupo tena
  alternative: mmoja amekufa
  rationale: Usemi wa chanzo ni wa kificho na hauthibitishi kifo moja kwa moja; tafsiri inadumisha mvutano huo wa kisimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida huku ukihifadhi urudiaji, lugha ya heshima, na utata wa chanzo.
