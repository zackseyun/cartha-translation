  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi yenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya Kiebrania ‘uchi wa nchi’ imehifadhiwa, huku maana yake ya kiidioma ikielezwa katika tanbihi.
