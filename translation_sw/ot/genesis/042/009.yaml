  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: sw
  text: Ndipo Yosefu akakumbuka ndoto alizokuwa ameota kuwahusu, akawaambia, “Ninyi ni wapelelezi! Mmekuja kuona uchi wa nchi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maeneo ya nchi yaliyo wazi au dhaifu.” Kiebrania husema halisi “uchi wa nchi,” nahau inayomaanisha maeneo yaliyo wazi kwa shambulio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: akakumbuka
  rationale: Kitenzi hiki kinaendeleza simulizi na kueleza kwamba wakati huo Yosefu alizikumbuka ndoto; ‘akakumbuka’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: ndoto alizokuwa ameota
  rationale: Huhifadhi uhusiano wa kitenzi na nomino katika Kiebrania kwa njia ya asili katika Kiswahili, huku wakati timilifu ukionyesha kuwa ndoto hizo zilikuwa za zamani.
- source_word: לָהֶם
  choice: kuwahusu
  rationale: Katika muktadha, ndoto zilihusu ndugu zake Yosefu. ‘Kuwahusu’ huwasilisha maana hiyo kwa uwazi bila kulazimisha maana ya ‘kwa ajili yao.’
- source_word: מְרַגְּלִים
  choice: wapelelezi
  rationale: Katika shtaka hili neno linamaanisha watu wanaochunguza nchi kwa siri; ‘wapelelezi’ ni neno la kawaida na linalofaa muktadha wa ujasusi.
- source_word: לִרְאוֹת
  choice: kuona
  rationale: Hili ndilo neno la moja kwa moja la Kiebrania. Maana pana ya kuchunguza kwa siri inaeleweka kutokana na shtaka la kuwa wapelelezi.
- source_word: עֶרְוַת הָאָרֶץ
  choice: uchi wa nchi
  rationale: Huhifadhi taswira halisi na kali ya Kiebrania badala ya kuifafanua kimya kimya; tanbihi inaeleza kwamba ni nahau ya maeneo yaliyo wazi au dhaifu kwa mashambulizi.
- source_word: בָּאתֶם
  choice: mmekuja
  rationale: Wakati timilifu wa Kiswahili unaonyesha kuwasili kwao ambako bado kuna umuhimu katika shtaka la sasa.
