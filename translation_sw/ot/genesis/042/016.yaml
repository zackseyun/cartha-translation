translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kama kweli iko pamoja nanyi’ umehifadhiwa kwa makusudi ili kutunza nahau na mvutano wa Kiebrania, huku tanbihi ikifafanua maana. Viashiria vyote vya tanbihi vimewekwa mara moja katika matini kuu.
