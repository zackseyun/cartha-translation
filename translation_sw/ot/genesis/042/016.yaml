base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: sw
  text: Mtumeni mmoja wenu[a] akamlete ndugu yenu, nanyi mkae kifungoni[b], ili maneno yenu yajaribiwe, kama kweli iko pamoja nanyi[c]. Lakini ikiwa sivyo, kama Farao aishivyo[d], hakika ninyi ni wapelelezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “na akamchukue ndugu yenu.” Kitenzi cha Kiebrania kwa kawaida humaanisha “chukua,” lakini hapa kinahusu kwenda kumchukua ndugu huyo na kumleta.
    reason: lexical_alternative
  - marker: b
    text: Au, “nanyi mfungwe” au “nanyi mbaki chini ya ulinzi.” Kitenzi cha Kiebrania kinaweza kumaanisha kufungwa au kuzuiliwa mahabusu.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “kama kweli iko pamoja nanyi,” yaani, kama mnasema kweli.
    reason: lexical_alternative
  - marker: d
    text: “Kama Farao aishivyo” ni kauli ya kiapo inayotaja uhai wa Farao.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: Mtumeni mmoja wenu
  rationale: Kauli ya amri ya wingi pamoja na מן na namba moja humaanisha kumchagua na kumtuma mtu mmoja kutoka katika kundi.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: akamlete ndugu yenu
  rationale: Ingawa לקח kwa kawaida humaanisha ‘chukua,’ hapa mtu huyo anapaswa kwenda kumchukua ndugu yao na kumleta kwa Yosefu; ‘akamlete’ huonyesha mwendo unaokusudiwa kwa Kiswahili cha kawaida.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: nanyi mkae kifungoni
  rationale: Nifali ya אסר ina maana ya kufungwa au kuzuiliwa chini ya ulinzi. ‘Mkae kifungoni’ ni ya asili na huonyesha kwamba wengine wanabaki mahabusu.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: ili maneno yenu yajaribiwe
  rationale: בחן katika nifali humaanisha kupimwa au kuchunguzwa. ‘Maneno yenu’ huhifadhi taswira ya Kiebrania badala ya kuifasiri kuwa ‘simulizi yenu.’
- source_word: הַאֱמֶת אִתְּכֶם
  choice: kama kweli iko pamoja nanyi
  rationale: Huhifadhi kwa karibu nahau ya Kiebrania, ‘kweli iko pamoja nanyi,’ huku dokezo likifafanua maana yake ya kusema kweli.
- source_word: וְאִם לֹא
  choice: Lakini ikiwa sivyo
  rationale: Huanzisha matokeo yaliyo kinyume endapo madai yao hayatathibitishwa.
- source_word: חֵי פַרְעֹה
  choice: kama Farao aishivyo
  rationale: Hii ni kauli ya kiapo inayotaja uhai wa Farao; tafsiri hii huhifadhi muundo na uzito wake.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: hakika ninyi ni wapelelezi
  rationale: כִּי hapa ina nguvu ya kusisitiza hitimisho la shtaka; ‘hakika’ huwasilisha msisitizo huo.
