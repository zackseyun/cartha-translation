  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: sw
  text: Sisi ni ndugu kumi na wawili, wana wa baba yetu. Mmoja hayupo, na ndugu yetu mdogo kuliko wote yuko pamoja na baba yetu leo katika nchi ya Kanaani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: Sisi ni ndugu kumi na wawili
  rationale: Kauli isiyo na kitenzi katika Kiebrania imetolewa kwa Kiswahili cha kawaida kwa kutumia “ni”; kiwakilishi huru “sisi” kinahifadhi msisitizo wa אֲנַחְנוּ.
- source_word: בְּנֵי אָבִינוּ
  choice: wana wa baba yetu
  rationale: Huhifadhi ufafanuzi wa kifamilia na muundo wa Kiebrania kwa lugha ya kawaida na yenye heshima.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: Mmoja hayupo
  rationale: “Hayupo” ni tafsiri ya moja kwa moja na ya kawaida ya nahau hii, huku ikihifadhi uwezekano wa kumaanisha amepotea, ameondoka, au anadhaniwa kuwa amekufa bila kuamua maana moja pekee.
- source_word: וְהַקָּטֹן
  choice: na mdogo wetu
  rationale: Katika muktadha wa ndugu, neno hili humtaja ndugu aliye mdogo kuliko wote. “Mdogo wetu” ni la kawaida zaidi kuliko “yule mdogo” na linaweka wazi uhusiano uliopo katika muktadha.
- source_word: הַיּוֹם אֶת אָבִינוּ
  choice: yuko pamoja na baba yetu leo
  rationale: אֶת hapa inaonyesha kuwa pamoja na mtu, si alama ya shamirisho. “Leo” imehifadhiwa, na mpangilio huu unasikika kwa kawaida katika Kiswahili.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Tafsiri inahifadhi neno “nchi” lililo wazi katika Kiebrania na jina la mahali kwa umbo lililozoeleka katika Kiswahili cha Biblia.
