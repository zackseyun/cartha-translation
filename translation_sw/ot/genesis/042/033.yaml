review_pass:
  verdict: revise
  source_fidelity: 'Tafsiri inafuata kwa usahihi muundo mkuu wa Kiebrania: cheo cha mtu huyo, kipimo cha kuthibitisha uaminifu wao, kumwacha ndugu mmoja, na amri ya kuchukua mahitaji ya nyumbani na kwenda. Hata hivyo, «kwangu» hubadili kidogo «pamoja nami», na «chakula» ni pana kuliko muktadha wa nafaka unaodokezwa na simulizi.'
  naturalness: Kiswahili cha rasimu kinaeleweka na kina hadhi inayofaa. Marekebisho madogo yanafanya uhusiano wa «pamoja nami» na kifungu kuhusu njaa ya kaya zao uwe wa kawaida zaidi katika Kiswahili Sanifu.
  terminology: «Bwana wa nchi», «watu waaminifu», na «ndugu yenu mmoja» zinafaa. «Nafaka» hutoa kwa usahihi kitu kinachodokezwa na usemi wa Kiebrania katika muktadha wa ununuzi wa chakula nchini Misri, bila kudai kwamba neno hilo limo wazi katika kifungu chenyewe.
  issues:
  - severity: low
    issue: «mwacheni kwangu» badala ya «mwacheni ... pamoja nami»
    rationale: אִתִּי maana yake hasa «pamoja nami/kwangu mimi» katika maana ya kuwa chini ya ulinzi wa msemaji. «Kwangu» inaweza kusikika hasa kama mahali pake; «pamoja nami» huhifadhi uhusiano wa chanzo kwa karibu zaidi.
  - severity: low
    issue: «chakula» ni pana kuliko dokezo la muktadha
    rationale: Kiebrania kina usemi wa kidondoshi, «chukueni njaa ya nyumba zenu», unaomaanisha mahitaji ya njaa hiyo. Kwa kuwa muktadha wa karibu ni nafaka, «nafaka» ni ufafanuzi unaolingana na muktadha na mkondo wa ukaguzi wa Kiingereza.
  - severity: low
    issue: «njaa katika nyumba zenu» inaweza kueleweka kama njaa iliyoko kimahali ndani ya majengo
    rationale: «njaa inayozikabili familia zenu» hueleza kwa kawaida zaidi njaa inayowapata watu wa kaya, huku ikidumisha maana ya «nyumba zenu» kama households.
