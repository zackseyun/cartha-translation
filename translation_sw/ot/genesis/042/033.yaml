  to: 'Kisha yule mtu, bwana wa nchi, akatuambia, ‘Kwa hili nitajua kwamba ninyi ni watu waaminifu: mwacheni ndugu yenu mmoja pamoja nami; chukueni nafaka kwa ajili ya njaa inayozikabili familia zenu, kisha mwende.’'
