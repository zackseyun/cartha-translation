base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: sw
  text: 'Kisha yule mtu, bwana wa nchi, akatuambia, ‘Kwa hili nitajua kwamba ninyi ni watu waaminifu: mwacheni ndugu yenu mmoja pamoja nami; chukueni nafaka kwa ajili ya njaa inayozikabili familia zenu, kisha mwende.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: yule mtu, bwana wa nchi
  rationale: Muundo wa Kiebrania una nomino ya kawaida ‘mtu’ ikifuatiwa na maelezo ya cheo ‘bwana wa nchi’; Kiswahili hiki kinahifadhi uhusiano huo wa uambatano na mamlaka yake.
- source_word: בְּזֹאת
  choice: Kwa jambo hili
  rationale: Kirai kinaonyesha kipimo au njia ambayo kwayo msemaji atawatambua; ‘kwa jambo hili’ ni wazi na ya kawaida katika Kiswahili.
- source_word: אֵדַע
  choice: nitajua
  rationale: Yiqtol hapa inaeleza matokeo ya baadaye yanayotegemea kutimizwa kwa agizo.
- source_word: כֵנִים
  choice: watu waaminifu
  rationale: Katika muktadha huu neno linawahusu watu wasio wadanganyifu wala wapelelezi; ‘watu waaminifu’ huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: ndugu yenu mmoja
  rationale: Kirai kinamtaja ndugu mmoja kutoka katika kundi lao; mpangilio huu ni wa asili katika Kiswahili.
- source_word: הַנִּיחוּ אִתִּי
  choice: mwacheni kwangu
  rationale: Hiphil ya הניח hapa ina maana ya kumwacha mtu abaki pamoja na msemaji.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: chakula kwa ajili ya njaa katika nyumba zenu
  rationale: Kiebrania kwa maneno halisi kinasema wachukue ‘njaa ya nyumba zenu,’ lakini ni usemi uliodondosha kitu kinachochukuliwa. Muktadha unaonyesha kuwa ni chakula kinachohitajika kwa sababu ya njaa; ‘chakula’ ni pana kidogo kuliko ‘nafaka’ na huepuka kubana zaidi ya maandishi yenyewe.
- source_word: קְחוּ וָלֵכוּ
  choice: chukueni ... kisha mwende
  rationale: Vitenzi viwili vya kuamuru vinahifadhiwa kwa mpangilio wake, huku ‘kisha’ ikifanya mfuatano uwe wa asili kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa moja kwa moja umewekwa kwa mtiririko wa kawaida bila kuongeza ufafanuzi wa kimadhehebu. Hakuna tanbihi iliyohitajika kwa kuwa udondoshaji katika רַעֲבוֹן בָּתֵּיכֶם umefafanuliwa kwa kiasi kidogo ndani ya tafsiri.
