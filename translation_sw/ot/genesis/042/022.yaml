base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: sw
  text: Ndipo Reubeni akawajibu, akisema, “Je, sikuwaambia, ‘Msimtendee dhambi mvulana huyo’? Lakini hamkusikiliza. Na sasa, tazama, damu yake inadaiwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶחֶטְאוּ בַיֶּלֶד
  choice: msimtendee mvulana huyo dhambi
  rationale: Kitenzi חטא pamoja na ב humaanisha kutenda dhambi dhidi ya mtu; usemi huu unahifadhi dhana ya hatia ya kimaadili na mlengwa wake.
- source_word: הַיֶּלֶד
  choice: mvulana huyo
  rationale: Hapa יֶלֶד humrejelea Yosefu wakati wa tukio la zamani; “mvulana huyo” ni ya asili na hudumisha rejeo maalumu.
- source_word: דָמוֹ ... נִדְרָשׁ
  choice: damu yake inadaiwa
  rationale: Huu ni usemi wa uwajibikaji kwa kumwaga damu. “Inadaiwa” hudumisha sitiari na hali ya kitenzi bila kutaja wazi mhusika anayeidai.
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira kwenye matokeo ya sasa na linafaa kwa kauli hii nzito.
theological_decisions:
- issue: Mhusika anayeidai damu ya Yosefu
  choice: 'Kauli tendwa isiyotaja mhusika: “damu yake inadaiwa”'
  alternative: “Mungu anatudai damu yake” au “tunaadhibiwa kwa damu yake”
  rationale: Kiebrania hakimtaji anayeidai damu wala hakifafanui moja kwa moja namna ya malipo; tafsiri inadumisha utata huo na wazo la uwajibikaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kurudia לֵאמֹר umerahisishwa kwa mazungumzo ya asili bila kupoteza maana; “tazama” limehifadhiwa kwa msisitizo wa הִנֵּה.
