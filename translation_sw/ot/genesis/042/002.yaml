  source_fidelity: The draft accurately conveys Jacob's statement, the grain available in Egypt, the downward journey, purchase, and the purpose of survival. A small revision better represents the Hebrew dative לָנוּ (‘for us’) directly in the Swahili verb.
  naturalness: The proposed wording is clear Standard East African Swahili. Using the applicative form mkatununulie is more idiomatic and compact than mkanunue ... kwa ajili yetu. The repeated location/source wording remains somewhat emphatic, as in the Hebrew.
