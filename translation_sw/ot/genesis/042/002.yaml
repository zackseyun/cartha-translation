base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: sw
  text: Akasema, “Tazama, nimesikia kwamba kuna nafaka huko Misri. Shukeni huko, mkatununulie nafaka kutoka huko, ili tuishi wala tusife.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kiashiria hiki huvuta fikira kwa habari inayofuata; “Tazama” kinahifadhi msisitizo wake kwa lugha yenye hadhi.
- source_word: שָׁמַעְתִּי
  choice: nimesikia
  rationale: Wakati timilifu wa Kiswahili unaonyesha habari iliyopatikana ambayo bado ina umuhimu wakati wa kusema.
- source_word: שֶׁבֶר
  choice: nafaka
  rationale: Katika muktadha wa njaa, neno hili linamaanisha nafaka inayopatikana kwa kununuliwa, si chakula kwa ujumla.
- source_word: רְדוּ
  choice: Shukeni
  rationale: Linahifadhi maana ya mwelekeo wa kushuka kutoka Kanaani kwenda Misri.
- source_word: שָׁמָּה
  choice: huko
  rationale: Ni kielezi cha mwelekeo kinachoonyesha waende mahali palipotajwa, yaani Misri.
- source_word: וְשִׁבְרוּ
  choice: mkanunue nafaka
  rationale: Kitenzi hiki katika muktadha huu humaanisha kununua nafaka; kutaja “nafaka” kwa uwazi ni kwa kawaida na wazi katika Kiswahili.
- source_word: לָנוּ
  choice: kwa ajili yetu
  rationale: Kinawasilisha wazi kwamba ununuzi huo ungewafaidi Yakobo na watu wa nyumbani mwake.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Kinahifadhi kihusishi cha Kiebrania kinachoonyesha kwamba nafaka ipatikane kutoka Misri.
- source_word: וְנִחְיֶה
  choice: ili tuishi
  rationale: “Ili” linaonyesha kusudi au matokeo yaliyotamaniwa ya safari na ununuzi.
- source_word: וְלֹא נָמוּת
  choice: wala tusife
  rationale: Muundo huu wa Kiswahili unahifadhi ulinganifu wenye msisitizo kati ya kuishi na kutokufa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Tazama” limetumiwa kwa sauti ya simulizi la Maandiko bila kutumia lugha ya kale kupita kiasi; marudio ya “huko” yanadumisha viashiria viwili vya mahali vilivyo katika Kiebrania.
