source:
  edition: WLC
  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: sw
  text: Mleteni kwangu ndugu yenu mdogo kuliko wote, ili nijue kwamba ninyi si wapelelezi, bali ni watu waaminifu. Kisha nitamrudisha ndugu yenu kwenu, nanyi mtaweza kufanya biashara katika nchi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nanyi mtaweza kuzunguka katika nchi.” Kitenzi cha Kiebrania kinaweza kueleweka kwa maana pana ya kusafiri au kuzunguka, ingawa maana ya kufanya biashara inafaa zaidi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: Mleteni
  rationale: Kauli ya kuamuru ya Hifili kutoka בוא inaeleza agizo la kumleta mtu; umbo lenye kiambishi cha yambwa ni la asili katika Kiswahili.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ndugu yenu mdogo zaidi
  rationale: Katika muktadha wa ndugu wa familia, הַקָּטֹן humaanisha aliye mdogo kuliko wote; tafsiri hii ni wazi na ya kawaida.
- source_word: וְאֵדְעָה
  choice: ili nijue
  rationale: Kohotativi baada ya agizo inaonyesha kusudi au matokeo yaliyokusudiwa; 'ili nijue' huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם
  choice: kwamba ninyi si wapelelezi
  rationale: מְרַגְּלִים hapa ni nomino ya watu wanaopeleleza kwa siri; 'wapelelezi' inafaa katika shtaka la Yosefu.
- source_word: כִּי כֵנִים אַתֶּם
  choice: bali ni watu waaminifu
  rationale: כֵנִים huonyesha uaminifu au ukweli wa watu; 'watu waaminifu' huhifadhi utofautishaji na wapelelezi bila kuongeza wazo la maadili lisilo lazima.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: nitawarudishia ndugu yenu
  rationale: Ndugu anayerejelewa anazuiliwa; kitenzi 'kuwarudishia' huonyesha kwa kawaida kwamba atakabidhiwa tena kwao, jambo linalodokezwa na muktadha.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: nanyi mtaweza kufanya biashara katika nchi hii
  rationale: סחר mara nyingi huhusu biashara; muktadha wa kununua nafaka wakati wa njaa unaunga mkono maana hii, huku tanbihi ikihifadhi uwezekano mpana wa kuzunguka nchini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa hotuba ya moja kwa moja umehifadhiwa; 'ninyi' imetumiwa kusisitiza utofautishaji wa kisemantiki kati ya kuwa wapelelezi na kuwa watu waaminifu.
