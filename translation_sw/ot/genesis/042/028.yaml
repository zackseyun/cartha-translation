base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: sw
  text: Akawaambia ndugu zake, “Fedha yangu imerudishwa, na tazama, iko katika gunia langu!” Ndipo mioyo yao ikazimia, nao wakatetemeka. Wakaambiana, “Ni nini hiki Mungu ametutendea?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּשַׁב
  choice: imerudishwa
  rationale: Kauli ya kutendwa ya kitenzi שוב inaonyesha kwamba fedha ilisababishwa kurudi; ‘imerudishwa’ huwasilisha hali iliyogunduliwa katika usemi wa moja kwa moja.
- source_word: כַּסְפִּי
  choice: fedha yangu
  rationale: ‘Fedha’ huhifadhi maana halisi ya כסף na pia ni neno la kawaida la Kiswahili kwa mali ya malipo katika muktadha huu.
- source_word: אַמְתַּחַת
  choice: gunia
  rationale: Neno hili linamaanisha kifaa cha kubebea nafaka au mahitaji; ‘gunia’ linafaa kwa mazingira ya usafirishaji wa nafaka.
- source_word: וְגַם הִנֵּה
  choice: tazama, imo humu
  rationale: ‘Tazama’ hudhihirisha mshangao wa הִנֵּה, na ‘imo humu’ husisitiza kwamba fedha ilipatikana ndani ya gunia lake; maana ya msisitizo wa גַם imewasilishwa kwa mpangilio wa sentensi badala ya ‘pia’ isiyo ya asili hapa.
- source_word: וַיֵּצֵא לִבָּם
  choice: mioyo yao ikawatoka
  rationale: Huhifadhi taswira halisi ya Kiebrania, huku tanbihi ikieleza maana ya nahau kuwa walivunjika moyo au kuishiwa ujasiri.
- source_word: וַיֶּחֶרְדוּ
  choice: wakatetemeka
  rationale: Huwasilisha mtikisiko unaotokana na hofu bila kuongeza maelezo yasiyotajwa wazi.
- source_word: אִישׁ אֶל אָחִיו
  choice: wakaambiana
  rationale: Ni Kiswahili cha asili chenye nguvu ya mgawanyo na kubadilishana ya usemi wa Kiebrania; tanbihi huhifadhi umbo halisi, ‘kila mmoja kwa ndugu yake.’
- source_word: מַה זֹּאת
  choice: Ni jambo gani hili
  rationale: Huhifadhi swali la mshangao bila kuligeuza kuwa swali la ‘kwa nini.’
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Sintaksia na muktadha wa simulizi zinaonyesha rejeo la umoja kwa Mungu.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika swali la hofu la ndugu hao
  choice: Mungu
  alternative: mungu; miungu
  rationale: Ingawa umbo la neno ni la wingi kimofolojia, sintaksia na muktadha vinaunga mkono rejeo la umoja. Tafsiri haitoi ufafanuzi wa kitheolojia unaozidi kauli yenyewe.
- issue: Usemi wenye jinsia אִישׁ אֶל אָחִיו
  choice: wakaambiana, pamoja na tanbihi ‘kila mmoja kwa ndugu yake’
  alternative: kila mtu akamwambia ndugu yake
  rationale: Matini inawahusu ndugu wa kiume. Kiswahili cha matini kuu ni cha asili, huku tanbihi ikihifadhi wazi uhusiano na umbo la mgawanyo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Fedha,’ ‘gunia,’ na ‘wakatetemeka’ ni maneno ya sasa na ya kawaida; taswira ya moyo imehifadhiwa kwa sababu ni muhimu katika chanzo na imefafanuliwa katika tanbihi.
