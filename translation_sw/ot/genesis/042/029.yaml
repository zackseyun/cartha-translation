  language: sw
  text: Kisha wakafika kwa Yakobo baba yao katika nchi ya Kanaani, wakamweleza yote yaliyowapata[a], wakisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa kufuata maneno moja kwa moja, kinasema, “kwa Yakobo baba yao, kuelekea nchi ya Kanaani.” Tafsiri imesema kwa mtindo wa kawaida, “kwa Yakobo baba yao katika nchi ya Kanaani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kisha wakafika
  rationale: Wayyiqtol ya בוא inaendeleza mfuatano wa simulizi; “Kisha wakafika” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: kwa Yakobo baba yao
  rationale: אֶל huonyesha mwelekeo wa kwenda kwa mtu, na אֲבִיהֶם humtaja Yakobo kuwa baba yao.
- source_word: אַרְצָה כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Kiambishi cha mwelekeo katika אַרְצָה kinaonyesha kwenda kuelekea au kuingia nchi ya Kanaani. Baada ya “wakafika kwa Yakobo,” Kiswahili cha kawaida hutaja mahali alikokuwa kwa kusema “katika nchi ya Kanaani,” huku tanbihi ikihifadhi muundo halisi.
- source_word: וַיַּגִּידוּ לוֹ
  choice: wakamweleza
  rationale: Hifili ya נגד humaanisha kueleza au kutoa taarifa; “wakamweleza” ni ya kawaida na inaunganisha kwa uwazi kitendo na Yakobo.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: yote yaliyowapata
  rationale: Muundo huu unarejelea mambo yote yaliyotukia kwao; “yote yaliyowapata” ni wa asili katika Kiswahili na huhifadhi wazo la matukio yaliyowafikia.
- source_word: לֵאמֹר
  choice: wakisema,
  rationale: Neno hili linaanzisha maneno ya moja kwa moja yanayofuata katika mstari unaofuata; “wakisema,” linaonyesha mwendelezo huo.
