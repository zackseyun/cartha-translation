  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: sw
  text: Yosefu aliwatambua ndugu zake, lakini wao hawakumtambua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: aliwatambua
  rationale: Hifili ya נכר hapa ina maana ya kumtambua mtu aliyekuwa anajulikana kabla. Kitenzi “tambua” ni cha kawaida katika Kiswahili na kinahifadhi ulinganifu wa masimulizi.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אֶת־אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu, אָח katika wingi inawahusu ndugu wa kiume wa Yosefu. Kiswahili kwa kawaida hutumia “ndugu” bila kuweka alama ya jinsia, na muktadha unaweka wazi wanaorejelewa.
- source_word: וְהֵם
  choice: lakini wao
  rationale: Ingawa וְ kimsingi ni kiunganishi, hapa inaonyesha tofauti kati ya Yosefu kuwatambua na wao kutomtambua. “Lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida; “wao” husisitiza upande unaolinganishwa.
- source_word: לֹא הִכִּרֻהוּ
  choice: hawakumtambua
  rationale: Ukanushaji na kiambishi cha yambwa vimewasilishwa kwa muundo wa kawaida wa Kiswahili. Kitenzi kilekile “tambua” kimetumiwa katika vifungu vyote viwili ili kuhifadhi marudio ya נכר na kinaya cha simulizi.
