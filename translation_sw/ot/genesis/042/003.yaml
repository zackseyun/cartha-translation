  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: sw
  text: Basi ndugu kumi wa Yosefu wakashuka kwenda kununua nafaka kutoka Misri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kununua nafaka huko Misri.” Kiebrania kwa maana ya moja kwa moja zaidi kinasema “kununua nafaka kutoka Misri,” kikionyesha chanzo cha nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: wakashuka
  rationale: Kitenzi ירד kina maana ya kushuka; hapa kinahifadhi namna ya kawaida ya kijiografia ya kueleza safari ya kwenda Misri, huku kikisomeka kwa kawaida katika Kiswahili.
- source_word: אֲחֵי יוֹסֵף עֲשָׂרָה
  choice: ndugu kumi wa Yosefu
  rationale: Muundo huu unaonyesha kwamba ndugu kumi wa Yosefu ndio waliosafiri; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לִשְׁבֹּר
  choice: kwenda kununua
  rationale: Katika simulizi hili שׁבר ni nahau ya kujipatia nafaka kwa kuinunua. 'Kwenda kununua' inaeleza kusudi la safari kwa Kiswahili cha kawaida.
- source_word: בָּר
  choice: nafaka
  rationale: Neno בָּר hapa linamaanisha mazao ya nafaka, hasa katika mazingira ya njaa; 'nafaka' ni neno pana, sahihi, na la kawaida.
- source_word: מִמִּצְרָיִם
  choice: kutoka Misri
  rationale: Kihusishi מן kwa kawaida huonyesha chanzo, 'kutoka.' Tafsiri hii inadumisha wazo kwamba nafaka ilipatikana kutoka Misri, bila kuficha uwezekano wa kuelewa mahali pa ununuzi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Wakashuka' hudumisha taswira ya kijiografia ya Kiebrania; tanbihi inaonyesha tafsiri nyingine ya kimahali bila kuondoa maana ya chanzo iliyo katika maandishi.
