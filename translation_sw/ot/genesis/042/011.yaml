  text: Sisi sote ni wana wa mtu mmoja. Sisi ni waaminifu[a]; watumishi wako hawakuwa wapelelezi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanyoofu” au “wasema kweli.” Kiebrania kinawaeleza kuwa watu wa kutegemewa au wa kweli, kinyume na shtaka la kuwa wapelelezi.
    reason: lexical_alternative
  - marker: b
    text: Au “watumishi wako si wapelelezi” au “watumishi wako hawajakuwa wapelelezi.” Muundo wa Kiebrania unaweza kutafsiriwa kwa njia kadhaa za kawaida za Kiswahili.
