lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: sisi sote
  rationale: Huonyesha kundi lote la wasemaji, huku kiwakilishi “sisi” kikihifadhi msisitizo wa Kiebrania.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: wana wa mtu mmoja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wana wa kiume wa baba mmoja katika muktadha huu.
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: sisi ni
  rationale: Viwakilishi huru vya Kiebrania vina msisitizo; kurudia “sisi” katika sentensi zote mbili kunahifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: כֵּנִים
  choice: waaminifu
  rationale: Neno hili hapa linawasilisha madai yao kwamba ni watu wa kutegemewa na wasema kweli, kinyume na shtaka la upelelezi.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazungumzo na mtawala, hili ni jina la kujishusha kwa heshima, si lazima dai la kuwa watumwa.
- source_word: מְרַגְּלִים
  choice: wapelelezi
  rationale: Neno linaashiria watu wanaochunguza nchi kwa siri, hivyo “wapelelezi” ni wazi na la kawaida katika muktadha.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: si wapelelezi
  rationale: Hutoa kwa Kiswahili cha asili ukanushaji wa hali au utambulisho wao bila kulazimisha tofauti ya wakati ambayo muundo wa Kiebrania unaweza kuwakilisha kwa namna mbalimbali.
