  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi umewekwa kwa mtindo wa kawaida wa masimulizi ya Kiswahili, na utata wa וַיִּתְנַכֵּר umehifadhiwa bila kudai kujibadilisha kimwili.
