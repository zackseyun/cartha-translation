base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: sw
  text: Yosefu alipowaona ndugu zake, aliwatambua, lakini akajifanya mgeni kwao[a] na akasema nao kwa ukali. Akawaambia, “Mmetoka wapi?” Wakasema, “Tumetoka nchi ya Kanaani kuja kununua chakula[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajifanya asiyejulikana kwao.” Kiebrania kinaweza kumaanisha kujionyesha kwao kama mgeni au mtu ambaye hawakumjua; si lazima kimaanishe kubadili sura au mavazi.
    reason: lexical_alternative
  - marker: b
    text: Au, “nafaka.” Katika muktadha huu wa njaa, kitenzi cha Kiebrania mara nyingi huhusu kununua nafaka, ingawa nomino iliyotumiwa hapa ina maana pana ya “chakula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: Yosefu alipowaona ndugu zake
  rationale: Muundo wa ‘alipo-’ unaunganisha kwa Kiswahili cha asili tendo la kuwaona na matendo yanayofuata, huku ‘ndugu zake’ ikiwakilisha ndugu zake wa kiume katika muktadha.
- source_word: וַיַּכִּרֵם
  choice: aliwatambua
  rationale: Hifili ya נכר hapa ina maana ya kuwatambua au kuwabaini watu aliokuwa amewajua.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: akajifanya mgeni kwao
  rationale: Hitpaeli ya נכר inaonyesha Yosefu alijionyesha kwao kama mtu asiyejulikana au wa kigeni; tafsiri hii haidai kwamba alibadili sura au mavazi yake.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: na kusema nao kwa ukali
  rationale: קָשׁוֹת inaeleza namna alivyosema. ‘Kwa ukali’ ni Kiswahili cha kawaida kinachohifadhi uzito wa usemi wake.
- source_word: מֵאַיִן בָּאתֶם
  choice: Mmetoka wapi?
  rationale: Hili ni swali la moja kwa moja kuhusu walikotoka; umbo la wingi limehifadhiwa.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: Tumetoka nchi ya Kanaani
  rationale: ‘Nchi ya Kanaani’ huakisi muundo rasmi wa kijiografia אֶרֶץ כְּנַעַן, na kitenzi kimeelezwa wazi ili jibu lisikike kwa kawaida katika Kiswahili.
- source_word: לִשְׁבָּר אֹכֶל
  choice: kuja kununua chakula
  rationale: שבר katika simulizi la njaa humaanisha kununua mahitaji, mara nyingi nafaka, lakini אֹכֶל ni neno pana zaidi, ‘chakula.’ ‘Kuja’ huonyesha kusudi la safari kwa Kiswahili cha asili.
