base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: sw
  text: Kisha wakaambiana, “Kweli, tuna hatia kwa habari ya ndugu yetu, kwa maana tuliona dhiki ya nafsi yake[a] alipotusihi, lakini hatukumsikiliza[b]. Ndiyo maana dhiki hii imetupata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uchungu wake.” Kiebrania husema kihalisi, “dhiki ya nafsi yake,” usemi unaomaanisha uchungu wa ndani na wa kina.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia mzizi uleule kwa “dhiki” ya Yosefu na “dhiki” ya sasa ya ndugu zake, likiunganisha ukatili wao wa zamani na mateso yao ya sasa.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Kisha wakaambiana
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida maana ya wao kusema wao kwa wao, huku ‘Kisha’ ikibeba mwendelezo wa simulizi.
- source_word: אֲבָל
  choice: Kweli
  rationale: Hapa neno hili linasisitiza kukiri kwa dhati, wala halionyeshi hasa utofautishaji.
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: tuna hatia kwa sababu ya ndugu yetu
  rationale: ‘Tuna hatia’ linaonyesha uwajibikaji wa kimaadili; ‘kwa sababu ya ndugu yetu’ linaeleza jambo linalowafanya wawe na hatia bila kuongeza zaidi ya Kiebrania.
- source_word: צָרַת נַפְשׁוֹ
  choice: uchungu wa nafsi yake
  rationale: Linahifadhi picha halisi ya Kiebrania ya dhiki ya ndani na ya mtu mzima, kwa lugha yenye heshima na inayoeleweka.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: alipotusihi
  rationale: Kitenzi hiki kinaonyesha ombi la dhati na la unyenyekevu bila kuongeza wazi kitu alichoomba.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: lakini hatukumsikiliza
  rationale: Katika muktadha huu, kusikia kunamaanisha kuitikia au kutii ombi; ‘hatukumsikiliza’ ni Kiswahili cha kawaida kinachobeba maana hiyo.
- source_word: עַל־כֵּן בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: Ndiyo maana dhiki hii imetupata
  rationale: ‘Ndiyo maana’ linaonyesha matokeo, na ‘imetupata’ ni njia ya kawaida ya Kiswahili ya kueleza taabu iliyowajia.
theological_decisions:
- issue: Uhusiano kati ya hatia yao ya zamani na mateso yao ya sasa
  choice: Ndiyo maana dhiki hii imetupata
  alternative: Kwa hiyo Mungu ametuletea dhiki hii
  rationale: Kiebrania kinaeleza hitimisho lao kuhusu matokeo lakini hakimtaji Mungu moja kwa moja kuwa mtendaji; tafsiri haiongezi kauli hiyo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio kamili ya mzizi wa Kiebrania צ־ר־ר hayawezi kuhifadhiwa kwa ufasaha bila kufanya ‘uchungu’ na ‘dhiki’ kuwa neno lilelile; uchaguzi huu unatofautisha kwa kawaida mateso ya ndani ya Yosefu na taabu iliyowapata ndugu zake.
