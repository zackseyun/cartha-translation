  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: sw
  text: Lakini Yakobo hakumtuma Benyamini, ndugu yake Yosefu, pamoja na ndugu zake, kwa maana alisema, “Asije akapatwa na jambo baya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: Lakini
  rationale: 'Kiunganishi kinaendeleza simulizi huku kikionyesha utofauti na mstari uliotangulia: wale ndugu wengine walienda, lakini Benyamini hakutumwa.'
- source_word: בִּנְיָמִין
  choice: Benyamini
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: אֲחִי יוֹסֵף
  choice: ndugu yake Yosefu
  rationale: Muundo huu wa umilikaji ni wa asili katika Kiswahili na unamtambulisha Benyamini kwa uhusiano wake na Yosefu.
- source_word: לֹא שָׁלַח
  choice: hakumtuma
  rationale: Kitenzi שׁלח kwa kawaida humaanisha ‘kutuma’; umbo hili linafaa simulizi la wakati uliopita.
- source_word: אֶת אֶחָיו
  choice: pamoja na ndugu zake
  rationale: Muktadha unaonyesha kwamba Benyamini hakutumwa aende pamoja na wale ndugu wengine; ‘pamoja na’ huwasilisha maana hiyo wazi na kwa Kiswahili cha kawaida.
- source_word: כִּי אָמַר
  choice: kwa maana alisema
  rationale: כִּי hapa inatoa sababu, na אָמַר ni ‘alisema,’ bila kuibadili kwa kutafsiri kuwa ‘alifikiri.’
- source_word: פֶּן
  choice: Asije
  rationale: Muundo wa ‘asije’ unaeleza uwezekano unaohofiwa kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: יִקְרָאֶנּוּ אָסוֹן
  choice: akapatwa na maafa
  rationale: Kirai hiki kinamaanisha kwamba jambo baya au msiba unaweza kumpata; ‘akapatwa na maafa’ huhifadhi uzito na upana wa אָסוֹן bila kubainisha aina fulani ya madhara.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inafuata kwa karibu muundo na maana ya Kiebrania huku ikitumia kauli ya kawaida ‘asije akapatwa na maafa.’ Hakuna tanbihi iliyowekwa kwa kuwa tofauti ya ‘madhara/msiba/maafa’ inaweza kuwakilishwa vya kutosha na neno pana ‘maafa’ katika maandishi.
