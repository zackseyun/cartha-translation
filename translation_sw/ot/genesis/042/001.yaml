  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: sw
  text: Yakobo alipoona kwamba kulikuwa na nafaka nchini Misri, aliwaambia wanawe, “Kwa nini mnazidi kutazamana?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini mnajionyesha?” Kitenzi cha Kiebrania kinaweza kueleweka kwa njia tofauti, lakini katika muktadha huu huenda zaidi kinamaanisha kwamba ndugu hao walikuwa wakitazamana kwa kusita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Muundo huu unaonyesha tukio la Yakobo kuona na uhusiano wake wa wakati na maneno yanayofuata, huku ukiendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: כִּי יֶשׁ
  choice: kwamba kulikuwa na
  rationale: Kifungu hiki kinatambulisha jambo alilotambua Yakobo; wakati uliopita unafaa katika simulizi la Kiswahili.
- source_word: שֶׁבֶר
  choice: nafaka
  rationale: Katika muktadha wa njaa na safari ya kununua chakula, neno hili linamaanisha nafaka iliyopatikana kwa ununuzi.
- source_word: בְּמִצְרָיִם
  choice: nchini Misri
  rationale: Hutoa maana ya mahali kwa Kiswahili cha kawaida na cha heshima.
- source_word: לְבָנָיו
  choice: aliwaambia wanawe
  rationale: Marejeleo ni kwa watoto wa kiume wa Yakobo; “wanawe” ni ya asili na sahihi katika muktadha.
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Huhifadhi swali la moja kwa moja kwa lugha ya kawaida.
- source_word: תִּתְרָאוּ
  choice: mnazidi kutazamana
  rationale: Hueleza kitendo cha kurudiana kati ya ndugu pamoja na hali yao ya kusita na kutochukua hatua; maana mbadala yenyewe imehifadhiwa katika tanbihi.
