  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: sw
  text: Yule mtu, bwana wa nchi, alisema nasi kwa ukali na akatuchukulia kuwa wapelelezi wa nchi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ
  choice: Yule mtu
  rationale: Katika simulizi la ndugu kwa baba yao, kishazi hiki kinamtambulisha mtu aliyekwishatajwa; “yule mtu” ni cha kawaida na cha asili katika Kiswahili.
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: bwana wa nchi
  rationale: Huhifadhi maana ya mamlaka ya mtawala wa eneo bila kutumia cheo maalumu kisichotajwa katika Kiebrania.
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: alisema nasi kwa ukali
  rationale: Kiswahili hiki kinaakisi kihalisi muundo wa kusema ‘nasi’ na vielezi vya Kiebrania vinavyomaanisha maneno makali.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: akatuchukulia kuwa wapelelezi
  rationale: Kitenzi נתן hapa kina maana ya kuwaweka au kuwahesabu katika hali fulani; “akatuchukulia kuwa” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai kwamba waliwekwa rasmi katika cheo hicho.
- source_word: מְרַגְּלִים
  choice: wapelelezi
  rationale: Ni neno la kawaida la Kiswahili kwa watu wanaochunguza nchi kwa siri kwa kusudi la kutoa taarifa.
