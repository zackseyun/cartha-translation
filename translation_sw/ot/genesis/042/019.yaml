  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: sw
  text: Kama ninyi ni waaminifu[a], mmoja wa ndugu zenu azuiliwe mahali mnaposhikiliwa[b]; ninyi, nendeni mkapeleke nafaka kwa ajili ya njaa ya kaya zenu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama ninyi ni watu wanaosema kweli.” Neno la Kiebrania linaweza kumaanisha watu wa kweli au waaminifu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika nyumba ya kizuizi chenu.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi zaidi, “nafaka kwa ajili ya njaa ya nyumba zenu.” “Nyumba” hapa inaweza kumaanisha kaya au watu wa nyumbani.
    reason: source_ambiguity
lexical_decisions:
- source_word: כֵּנִים
  choice: waaminifu
  rationale: Katika muktadha huu neno linaonyesha kwamba ndugu hao wanasema kweli na si wapelelezi. “Waaminifu” ni Kiswahili cha kawaida kinachoweza kuhusisha uaminifu wa maneno bila kuwa kigumu.
- source_word: אֲחִיכֶם אֶחָד
  choice: mmoja wa ndugu zenu
  rationale: Huhifadhi maana ya mtu mmoja kutoka miongoni mwa ndugu hao kwa Kiswahili cha kawaida.
- source_word: יֵאָסֵר
  choice: azuiliwe
  rationale: Nifali ya אסר inaweza kumaanisha kufungwa au kuwekwa kizuizini. “Azuiliwe” inaonyesha kushikiliwa chini ya ulinzi bila kulazimisha maana ya kufungwa kwa kamba.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: mahali mnaposhikiliwa
  rationale: Kirai hicho kihalisi ni ‘katika nyumba ya ulinzi/kizuizi chenu.’ Tafsiri hii ni ya asili na inaelekeza kwenye mahali walipokuwa chini ya ulinzi bila kuingiza mfumo rasmi wa gereza.
- source_word: וְאַתֶּם לְכוּ
  choice: lakini ninyi wengine, nendeni
  rationale: Kiwakilishi huru אַתֶּם kinasisitiza tofauti kati ya ndugu mmoja atakayebaki na wale watakaoondoka. “Ninyi wengine” huweka utofauti huo wazi; “lakini” huonyesha utofauti wa kimantiki ingawa וְ yenyewe ni kiunganishi cha kawaida.
- source_word: הָבִיאוּ
  choice: mkapeleke
  rationale: Hifili ya בוא ina maana ya kuleta au kupeleka kitu hadi mahali lengwa. Kwa kuwa ndugu wanapaswa kurudi Kanaani na nafaka, “mkapeleke” ni ya kawaida kwa mtazamo wa msemaji aliyebaki Misri.
- source_word: שֶׁבֶר
  choice: nafaka
  rationale: Katika simulizi la Yusufu, שֶׁבֶר hutaja hasa nafaka inayopatikana au kununuliwa wakati wa njaa.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: kwa watu wa nyumbani mwenu wanaokabili njaa
  rationale: Muundo wa Kiebrania ni mfupi na unaweza kueleweka kama nafaka ya kukabiliana na njaa ya kaya zao. Kiswahili hiki kinaonyesha walengwa na hali yao kwa njia ya kawaida bila kusema kwamba nyumba za kimwili zina njaa.
