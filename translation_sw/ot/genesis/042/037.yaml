lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio; “Ndipo” pamoja na kitenzi cha mfululizo huwasilisha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: רְאוּבֵן
  choice: Rubeni
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אֶל אָבִיו
  choice: baba yake
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa uhusiano huu.
- source_word: לֵאמֹר
  choice: halijatafsiriwa kando
  rationale: Katika Kiswahili, maana yake tayari imo katika utangulizi wa usemi wa moja kwa moja, hivyo kuongeza “akisema” kungekuwa marudio yasiyo ya lazima.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: Unaweza kuwaua wana wangu wawili
  rationale: Hifadhi ya מות ina maana ya kusababisha kifo. Kauli hii inaonyesha dhamana kali ya Rubeni bila kuifanya amri ya moja kwa moja isivyo lazima.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: nisipomrudisha kwako
  rationale: Sharti hasi limetolewa kwa muundo wa asili wa Kiswahili; “kumrudisha” huonyesha kwa kufaa kwamba Benyamini angetakiwa kurudi kwa Yakobo.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: Mkabidhi mikononi mwangu
  rationale: “Kukabidhi” hutoa maana ya kumweka chini ya wajibu wa Rubeni, huku “mikononi mwangu” ikihifadhi taswira halisi ya Kiebrania.
- source_word: וַאֲנִי
  choice: nami mwenyewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kiebrania kina mkazo; “mwenyewe” huhifadhi mkazo huo kwa kawaida.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: nitamrudisha kwako
  rationale: Hifadhi ya שוב ina maana ya kusababisha mtu arudi; “nitamrudisha” ni ya asili na sahihi katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida, huku ukihifadhi ukali wa ahadi ya Rubeni, mkazo wa “nami mwenyewe,” na taswira ya mkono katika dokezo.
