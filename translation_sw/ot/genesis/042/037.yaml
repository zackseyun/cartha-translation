  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: sw
  text: Ndipo Rubeni akamwambia baba yake, “Uwaue wana wangu wawili nisipomrudisha kwako. Mweke mikononi mwangu[a], nami mwenyewe nitamrudisha kwako.”
  philosophy: optimal-equivalence
  footnotes:
