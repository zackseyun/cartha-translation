  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: sw
  text: Lakini mleteni kwangu ndugu yenu mdogo zaidi; maneno yenu yatathibitishwa[a], nanyi hamtakufa.” Wakafanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yataaminika” au “yatathibitishwa kuwa ya kweli.” Kitenzi cha Kiebrania kinaweza kumaanisha jambo kuthibitishwa au kukubaliwa kuwa la kutegemeka; muktadha huu unaelekea kwenye kuthibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ndugu yenu mdogo zaidi
  rationale: Katika muktadha wa ndugu wa familia moja, הַקָּטֹן humtaja aliye mdogo kuliko wengine; Kiswahili cha kawaida hutumia “mdogo zaidi” kuonyesha mpangilio huo wa umri.
- source_word: תָּבִיאוּ אֵלַי
  choice: mtakapomleta kwangu
  rationale: Hifili ya בוא ina maana ya “kuleta,” na אֵלַי ni “kwangu.” Muundo wa “mtakapomleta” unaunganisha kwa kawaida sharti la kumleta na matokeo yanayofuata bila kuongeza wazo lisilokuwamo.
- source_word: וְיֵאָמְנוּ
  choice: yatathibitishwa
  rationale: Nifali ya אמן hapa inaonyesha kwamba maneno yao yatahakikishwa kuwa ya kweli au yenye kutegemeka. “Yatathibitishwa” linafaa katika muktadha wa Yosefu kuyachunguza madai yao.
- source_word: דִבְרֵיכֶם
  choice: maneno yenu
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya wingi huu, na linadumisha uhusiano na yale waliyokuwa wamesema.
- source_word: וְלֹא תָמֻתוּ
  choice: nanyi hamtakufa
  rationale: Tafsiri hii inadumisha uratibu wa Kiebrania na uzito wa ahadi au onyo la Yosefu kuhusu matokeo ya kutii.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Nao wakafanya hivyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa ufupi kwamba walitii agizo hilo.
