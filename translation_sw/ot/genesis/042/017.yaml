  text: Akawaweka chini ya ulinzi kwa siku tatu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliwazuia kizuizini kwa siku tatu.” Kitenzi cha Kiebrania kihalisi humaanisha “kukusanya,” lakini hapa, pamoja na “mahali pa ulinzi,” hutumiwa kwa maana ya kuwaweka watu chini ya ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Akawaweka
  rationale: Kitenzi אסף kwa kawaida humaanisha ‘kukusanya,’ lakini pamoja na אֶל מִשְׁמָר hapa ni nahau ya kuwaweka watu chini ya ulinzi. ‘Akawaweka’ ni Kiswahili cha kawaida na kinaonyesha tendo hilo bila kulifafanua kupita kiasi.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiambishi cha yambwa cha wingi kinawarejelea ndugu za Yosefu.
- source_word: אֶל מִשְׁמָר
  choice: chini ya ulinzi
  rationale: Ingawa אֶל huonyesha kuelekea au kuingia katika hali fulani, muungano huu unamaanisha kuwa chini ya uangalizi wenye kizuizi. ‘Chini ya ulinzi’ ni wa kawaida na haudai kwamba walifungwa katika gereza rasmi.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: kwa siku tatu
  rationale: Kirai hiki huonyesha muda; ‘kwa siku tatu’ ni usemi wa asili katika Kiswahili.
