  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: sw
  text: Lakini wao hawakujua kwamba Yosefu aliwasikia[a], kwa kuwa mkalimani alikuwa kati yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yosefu alikuwa akisikiliza”; katika muktadha huu, kusikia kunadokeza kwamba alielewa waliyokuwa wakisema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Lakini wao
  rationale: Kiunganishi pamoja na kiwakilishi kinaonyesha tofauti na simulizi lililotangulia; “Lakini wao” ni Kiswahili cha asili na kinahifadhi mhusika aliyetajwa wazi.
- source_word: לֹא יָדְעוּ
  choice: hawakujua
  rationale: Kitenzi ידע hapa kinaonyesha kwamba hawakuwa na ufahamu wa jambo hilo; “hawakujua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי ya kwanza inaanzisha maudhui ya jambo ambalo hawakujua.
- source_word: שֹׁמֵעַ
  choice: alikuwa akielewa
  rationale: Ingawa maana ya msingi ni kusikia au kusikiliza, katika muktadha huu hoja ni kwamba Yosefu alielewa lugha na maneno yao. Umbo endelevu linaakisi kishirikishi cha Kiebrania.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili sanifu cha Biblia.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי ya pili inatoa sababu ya wao kutotambua kwamba Yosefu aliwaelewa.
- source_word: הַמֵּלִיץ
  choice: mkalimani
  rationale: Katika muktadha huu neno linamtaja mtu aliyekuwa akifasiri mawasiliano kati ya watu wa lugha tofauti.
- source_word: בֵּינֹתָם
  choice: kati yao
  rationale: Kirai kinaonyesha nafasi na jukumu la mkalimani kama mpatanishi wa mawasiliano kati ya Yosefu na ndugu zake.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Alikuwa akielewa” huweka wazi maana ya kimuktadha, huku tanbihi ikihifadhi maana ya moja kwa moja ya kitenzi cha Kiebrania.
