lexical_decisions:
- source_word: בְּזֹאת
  choice: Kwa jambo hili
  rationale: בְּ yenye maana ya njia au kigezo pamoja na זֹאת inaonyesha namna ambayo madai yao yatathibitishwa; “Kwa jambo hili” ni ya kawaida na wazi katika Kiswahili.
- source_word: תִּבָּחֵנוּ
  choice: mtajaribiwa
  rationale: Nifali ya בחן ina maana ya kufanyiwa jaribio au uchunguzi ili kuthibitisha ukweli wa madai yao.
- source_word: חֵי פַרְעֹה
  choice: Kama Farao aishivyo
  rationale: Hii ni kanuni ya kiapo inayotaja uhai wa Farao; tafsiri hii inadumisha muundo na nguvu ya kiapo kwa Kiswahili cha asili.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: hamtaondoka hapa
  rationale: Baada ya kiapo, אִם hutumika katika usemi wa Kiebrania unaosisitiza ukanushaji; kwa hiyo si sharti la kawaida bali ni kauli kali kwamba hawataondoka.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Muungano huu unaanzisha jambo pekee linaloweza kuondoa ukanushaji uliotangulia.
- source_word: בְּבוֹא
  choice: aje
  rationale: Kitenzi-jina chenye בְּ kinaonyesha hali inayohitajika kabla ya kuondoka; umbo la kitenzi “aje” ni la kawaida baada ya “isipokuwa.”
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ndugu yenu mdogo kabisa
  rationale: Katika muktadha wa ndugu wa familia, הַקָּטֹן humtaja aliye mdogo kuliko wote, yaani Benyamini; “mdogo kabisa” huhifadhi maana hiyo bila utata.
- source_word: הֵנָּה
  choice: huku
  rationale: Kielezi hiki kina maana ya mwendo kuelekea mahali alipo msemaji; “huku” huonyesha mwelekeo huo kwa Kiswahili cha sasa.
