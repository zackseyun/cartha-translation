  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: sw
  text: Basi wana wa Israeli wakaja kununua nafaka miongoni mwa watu waliokuwa wakija, kwa sababu njaa ilikuwa katika nchi ya Kanaani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi hiki kinaendeleza simulizi na kinaonyesha kufika kwao Misri; “wakaja” ni cha asili katika muktadha huu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Kirai hiki kinamaanisha kihalisi wana wa Israeli, yaani wana wa Yakobo katika muktadha huu, wala si taifa lote kwa ujumla.
- source_word: לִשְׁבֹּר
  choice: kununua nafaka
  rationale: Maana ya msingi ni “kununua,” lakini katika simulizi hili la njaa kinachonunuliwa ni nafaka; kukitaja kunafanya maana iwe wazi kwa Kiswahili.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: pamoja na wengine waliokuwa wakija
  rationale: Kirai kinaonyesha kwamba wana wa Israeli walikuwa miongoni mwa kundi kubwa la watu waliokuwa wakifika; tafsiri hii ni ya asili na huhifadhi wazo hilo.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya wao kuja kununua nafaka.
- source_word: הָיָה הָרָעָב
  choice: njaa ilikuwa
  rationale: Huhifadhi njaa inayojulikana tayari katika simulizi na kutoa sentensi ya kawaida ya Kiswahili.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Huhifadhi usemi kamili wa Kiebrania na umuhimu wa eneo katika simulizi.
