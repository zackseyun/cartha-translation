  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: sw
  text: Nasi tukamwambia, “Sisi ni watu waaminifu; hatukuwa wapelelezi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Nasi tukamwambia
  rationale: Muundo wa wayyiqtol unaendeleza mfululizo wa simulizi. Kiambishi “-ka-” kinaonyesha hatua inayofuata, na “nasi” linaunganisha kauli hii na masimulizi yaliyotangulia.
- source_word: אֵלָיו
  choice: -mwambia
  rationale: Kihusishi אֶל pamoja na kiambishi cha nafsi ya tatu umoja wa kiume kimewasilishwa kwa kiambishi-yambwa “-mw-” katika kitenzi cha Kiswahili.
- source_word: כֵּנִים
  choice: watu waaminifu
  rationale: Katika muktadha huu neno linaeleza watu walio wanyoofu na wa kuaminika, kinyume cha shtaka la upelelezi. “Watu waaminifu” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: אֲנָחְנוּ
  choice: Sisi
  rationale: Kiwakilishi huru katika Kiebrania kina mkazo; “Sisi” kinauhifadhi wazi katika Kiswahili.
- source_word: לֹא הָיִינוּ
  choice: hatukuwa
  rationale: Muundo wa kukanusha wa היה pamoja na kivumishi-tendaji unaeleza hali au shughuli ya wakati uliopita. “Hatukuwa” huhifadhi wakati huo bila kuingiza maana ya ziada.
- source_word: מְרַגְּלִים
  choice: wapelelezi
  rationale: Kivumishi-tendaji cha רגל hapa kinataja watu wanaofanya upelelezi. “Wapelelezi” ni neno la kawaida na sahihi katika muktadha wa shtaka la ujasusi.
