  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: sw
  text: Kisha mmoja wao akafungua gunia lake ili kumpa punda wake chakula mahali pa kulala. Akaiona fedha yake; kumbe ilikuwa kwenye mdomo wa mfuko wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kwenye sehemu ya wazi ya mfuko wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: akafungua
  rationale: Kitenzi פתח katika usimulizi kina maana ya kawaida ya kufungua.
- source_word: הָאֶחָד
  choice: mmoja wao
  rationale: Kihalisi ni ‘mmoja’; ‘wao’ huweka wazi kwamba alikuwa mmoja wa ndugu bila kuongeza habari mpya.
- source_word: שַׂקּוֹ
  choice: gunia lake
  rationale: שַׂק ni gunia la kubebea nafaka; ‘gunia’ pia hulitofautisha na אַמְתַּחַת baadaye katika mstari.
- source_word: לָתֵת מִסְפּוֹא לַחֲמֹרוֹ
  choice: ili kumpa punda wake chakula
  rationale: מִסְפּוֹא ni chakula cha mifugo. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha punda ndiye mpokeaji.
- source_word: בַּמָּלוֹן
  choice: mahali walipolala
  rationale: מָלוֹן ni kituo au mahali pa kulala safarini; tafsiri hii haidokezi isivyofaa kwamba palikuwa nyumba ya wageni ya kibiashara.
- source_word: כַּסְפּוֹ
  choice: fedha yake
  rationale: כֶּסֶף inaweza kumaanisha fedha kama metali au pesa; ‘fedha’ huhifadhi maana zote mbili katika Kiswahili, na hapa ni malipo yaliyorejeshwa.
- source_word: וְהִנֵּה
  choice: kumbe
  rationale: ‘Kumbe’ huonyesha ugunduzi wa ghafla na mshangao kwa lugha ya kawaida ya usimulizi.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: kwenye mdomo wa mfuko wake
  rationale: ‘Mdomo’ huhifadhi taswira ya Kiebrania ya פֶּה kwa uwazi unaoeleweka, huku ‘mfuko’ ukitofautishwa na ‘gunia’.
