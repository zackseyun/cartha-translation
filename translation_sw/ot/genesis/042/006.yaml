  text: וְ/יוֹסֵ֗ף ה֚וּא הַ/שַּׁלִּ֣יט עַל הָ/אָ֔רֶץ ה֥וּא הַ/מַּשְׁבִּ֖יר לְ/כָל עַ֣ם הָ/אָ֑רֶץ וַ/יָּבֹ֨אוּ֙ אֲחֵ֣י יוֹסֵ֔ף וַ/יִּשְׁתַּֽחֲווּ ל֥/וֹ אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: sw
  text: Yusufu ndiye aliyekuwa mtawala wa nchi; ndiye aliyewauzia nafaka watu wote wa nchi. Ndugu za Yusufu wakaja, wakainama mbele yake[a], nyuso zao zikielekea ardhini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujitupa kifudifudi mbele yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama sana au kujitupa kifudifudi kama ishara ya heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: mtawala
  rationale: Neno hili humaanisha mtu mwenye mamlaka au utawala. “Mtawala” ni Kiswahili cha kawaida na chenye hadhi, bila kubainisha cheo maalumu kisichotajwa katika maandishi.
- source_word: עַל הָאָרֶץ
  choice: wa nchi
  rationale: Katika muktadha huu אֶרֶץ ni nchi inayozungumziwa, yaani Misri, wala si dunia nzima.
- source_word: הַמַּשְׁבִּיר
  choice: aliyewauzia nafaka
  rationale: Kauli ya Hifili ya שׁבר katika simulizi hili humaanisha kuuza nafaka wakati wa njaa; kitu kinachouzwa kinaeleweka kutokana na muktadha.
- source_word: לְכָל עַם הָאָרֶץ
  choice: watu wote wa nchi
  rationale: עַם ni nomino ya jumla inayorejelea watu, na הָאָרֶץ hapa ni nchi inayozungumziwa.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: kuinama mbele yake
  rationale: Kitenzi שׁחה kinaweza kueleza kuinama sana au kujitupa kifudifudi kama ishara ya heshima na utiifu. Tafsiri hii haileti maana ya ibada ya kidini isiyodaiwa na muktadha.
- source_word: אַפַּיִם אָרְצָה
  choice: nyuso zao zikielekea ardhini
  rationale: Nahau hii inaeleza mkao wa kuinama au kujitupa kifudifudi, uso ukiwa chini; tafsiri hii ni ya asili katika Kiswahili na inadumisha picha ya mwili.
- source_word: וְ
  choice: naye / na
  rationale: Viunganishi vinaendeleza simulizi. Kiswahili kinavitumia kwa mtiririko wa kawaida bila kuongeza kiashirio cha wakati ambacho hakimo katika chanzo.
theological_decisions:
- issue: Tendo la ndugu za Yusufu mbele yake
  choice: kuinama mbele yake
  alternative: kujipigiza kifudifudi mbele yake; kumsujudia
  rationale: Tukio linaonyesha heshima na kujitiisha kwa mamlaka ya Yusufu na linahusiana na ndoto zake za awali. Maandishi hayadai kwamba walimwabudu kama Mungu, hivyo tafsiri haiongezi dai hilo la kiteolojia huku tanbihi ikihifadhi upana wa maana ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ndiye aliyekuwa” unasisitiza nafasi ya Yusufu kama ilivyo katika Kiebrania, huku sentensi zikibaki wazi kwa msomaji wa kawaida.
