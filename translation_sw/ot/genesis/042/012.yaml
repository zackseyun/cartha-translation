  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: sw
  text: Lakini akawaambia, “La, bali mmekuja kuuona[a] uchi wa nchi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupeleleza.” Kitenzi cha Kiebrania humaanisha kihalisi “kuona,” lakini katika muktadha huu Yosefu anawashutumu kuwa wamekuja kufanya upelelezi.
    reason: lexical_alternative
  - marker: b
    text: Au “sehemu zilizo wazi au zisizo na ulinzi za nchi.” Kwa Kiebrania ni kihalisi “uchi wa nchi,” sitiari ya maeneo dhaifu ambayo wavamizi au wapelelezi wangeweza kuyatumia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Lakini akawaambia
  rationale: Waw ya usimulizi inaendeleza simulizi, lakini hapa kauli inampinga msemaji wa mstari uliotangulia; “lakini” huonyesha upinzani huo kwa Kiswahili cha kawaida. אֲלֵהֶם imejumuishwa kiasili katika “akawaambia.”
- source_word: לֹא כִּי
  choice: La,
  rationale: “La” ni jibu fupi na la mkazo linalokataa madai yao. כִּי inaleta masahihisho yanayofuata; kwa Kiswahili mtiririko huo unaweza kuwasilishwa kiasili kwa koma bila kuongeza neno la ufafanuzi lisilokuwamo wazi.
- source_word: עֶרְוַת הָאָרֶץ
  choice: uchi wa nchi
  rationale: Tafsiri hii huhifadhi sitiari halisi ya Kiebrania, ambayo hapa inaelekea kumaanisha sehemu zilizo wazi au zisizo na ulinzi za nchi, badala ya kuibadilisha moja kwa moja kuwa tafsiri ya sitiari hiyo.
- source_word: בָּאתֶם
  choice: mmekuja
  rationale: Kauli timilifu inaonyesha kuja kwao ambako kusudi lake ndilo linalojadiliwa sasa; “mmekuja” ni ya kawaida na huhifadhi umuhimu wa sasa.
- source_word: לִרְאוֹת
  choice: kuona
  rationale: Kitenzi ראה humaanisha kihalisi “kuona.” Ingawa muktadha unaashiria upelelezi, kuhifadhi “kuona” hudumisha uchaguzi wa maneno wa chanzo na uhusiano wake na sitiari ya “uchi wa nchi.”
