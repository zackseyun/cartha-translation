  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya chanzo imehifadhiwa katika matini kuu, huku maana inayowezekana ikifafanuliwa katika tanbihi. Alama zote za tanbihi zimewekwa baada ya sentensi kwa sababu zote mbili zinafafanua vipengele vya kauli hiyo.
