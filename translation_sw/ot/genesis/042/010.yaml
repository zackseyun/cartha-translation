  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “bwana wangu” na “watumishi wako” unadumisha sauti ya unyenyekevu mbele ya mwenye mamlaka; sentensi imebaki rahisi na ya kawaida kwa wasomaji wengi.
