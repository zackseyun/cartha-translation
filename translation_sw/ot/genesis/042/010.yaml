  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: sw
  text: Lakini wakamwambia, “Sivyo, bwana wangu; watumishi wako wamekuja kununua chakula.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafaka.” Kiebrania kinasema “chakula,” ingawa katika muktadha huu wa njaa huenda kinachokusudiwa ni nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lakini wakamwambia
  rationale: Kiunganishi cha simulizi kinaendeleza tukio, huku “Lakini” kikionyesha kwa kawaida kwamba jibu lao linapinga shtaka la Yosefu katika mstari uliotangulia.
- source_word: אֵלָיו
  choice: wakamwambia
  rationale: Maana ya “kwake” imewasilishwa kwa kawaida ndani ya kitenzi cha Kiswahili chenye kiambishi cha yambwa -mw-.
- source_word: לֹא
  choice: Sivyo
  rationale: Hapa neno la kukanusha ni jibu la mkazo kwa shtaka; “Sivyo” ni la asili na lina maana ya “Hapana, si kama ulivyosema.”
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hifadhi ya heshima na unyenyekevu wa ndugu hao mbele ya mtawala, bila kudokeza kwamba yeye ni mmiliki wao.
- source_word: וַעֲבָדֶיךָ
  choice: watumishi wako
  rationale: Ingawa עֶבֶד inaweza kumaanisha mtumwa, hapa ni namna ya kujitaja kwa unyenyekevu mbele ya afisa mwenye mamlaka.
- source_word: בָּאוּ
  choice: wamekuja
  rationale: 'Kauli timilifu inaonyesha ujio uliokwisha kutokea wenye matokeo ya sasa: wako mbele yake kwa kusudi hilo.'
- source_word: לִשְׁבָּר
  choice: kununua
  rationale: Katika muktadha wa njaa na ugawaji wa mahitaji, kitenzi hiki kina maana ya kununua, hasa nafaka au chakula.
- source_word: אֹכֶל
  choice: chakula
  rationale: Neno la Kiebrania lina maana pana ya chakula; “nafaka” inawezekana kimuktadha lakini ni mahsusi zaidi kuliko neno lenyewe.
theological_decisions: []
