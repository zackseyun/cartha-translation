base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: sw
  text: Ikawa, walipokuwa wakimwaga yaliyomo katika magunia yao, tazama, kifurushi cha fedha cha kila mmoja kilikuwa ndani ya gunia lake.[a] Wao pamoja na baba yao walipoona vifurushi vyao vya fedha, wakaogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kibunda chake cha fedha.” Neno la Kiebrania linamaanisha kitu kilichofungwa au kuviringishwa pamoja.
    reason: Njia mbadala ya kileksia inayohifadhi maana halisi ya צְרוֹר kama kitu kilichofungwa.
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kazi ya kis叙事 ya וַיְהִי ya kuanzisha tukio jipya bila kutumia lugha ya kizamani kupita kiasi.
- source_word: מְרִיקִים שַׂקֵּיהֶם
  choice: walipokuwa wakimwaga yaliyomo katika magunia yao
  rationale: Kitenzi cha Kiebrania kinaonyesha tendo la kuondoa yaliyomo; usemi huu ni wa kawaida katika Kiswahili na unaweka wazi kwamba magunia ndiyo yaliyokuwa yakitolewa yaliyomo.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linaonyesha ugunduzi wa ghafla na mshangao; “tazama” huhifadhi msisitizo huo katika mtindo wa heshima wa kisimulizi.
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: kila mmoja akakuta kifurushi chake cha fedha
  rationale: אִישׁ imetumiwa kwa maana ya kugawa, yaani kila mtu mmoja mmoja. “Kifurushi cha fedha” huhifadhi picha ya kitu kilichofungwa, huku “akakuta” ikitoa kwa Kiswahili cha asili maana ya kuwapo kwake kulikogunduliwa.
- source_word: בְּשַׂקּוֹ
  choice: ndani ya gunia lake
  rationale: Huhifadhi mahali na umoja unaolingana na kila ndugu mmoja mmoja.
- source_word: וַיִּרְאוּ אֶת צְרֹרוֹת כַּסְפֵּיהֶם הֵמָּה וַאֲבִיהֶם
  choice: Wao pamoja na baba yao walipoona vifurushi vyao vya fedha
  rationale: Huhifadhi msisitizo kwamba ndugu hao na baba yao wote waliona fedha hizo, huku mpangilio wa Kiswahili ukiwa wa kawaida.
- source_word: וַיִּירָאוּ
  choice: wakaogopa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mwitikio wao wa hofu baada ya ugunduzi huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Magunia” linafaa kwa vyombo vya nafaka, na “tazama” linadumisha mshangao wa simulizi bila kuifanya sentensi kuwa nzito. Muundo umefanywa wa kawaida kwa Kiswahili huku urudiaji wa “vifurushi vyao vya fedha” ukihifadhiwa kutoka Kiebrania.
