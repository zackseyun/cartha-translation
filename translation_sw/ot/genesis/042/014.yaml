  text: 'Yosefu akawaambia, “Haya ndiyo niliyowaambia: ‘Ninyi ni wapelelezi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Kitenzi cha masimulizi wayyiqtol kimetafsiriwa kwa ‘aka-’; pamoja na אֲלֵהֶם, ‘akawaambia’ ni Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: הוּא אֲשֶׁר
  choice: Ni kama
  rationale: Kauli hii inasisitiza uthibitisho wa jambo alilosema Yosefu hapo awali; ‘Ni kama’ hudumisha maana hiyo kwa Kiswahili cha kawaida bila kulazimisha muundo wa Kiebrania.
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: nilivyowaambia
  rationale: Ingawa דִּבַּרְתִּי kwa msingi ni ‘nilisema/nilinena’, pamoja na walengwa wa kauli, ‘nilivyowaambia’ ni fasiri ya asili na sahihi katika muktadha.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitivu hii hutambulisha yaliyosemwa. Nukta mbili zinaonyesha kazi yake kwa Kiswahili cha sasa na kuepuka urudiaji usio wa kawaida wa ‘nilisema ... nikisema’.
- source_word: מְרַגְּלִים אַתֶּם
  choice: Ninyi ni wapelelezi
  rationale: Kirai nomino chenye kiwakilishi huru chenye msisitizo kimetolewa kwa ‘Ninyi ni wapelelezi’, kikihifadhi msisitizo wa אַתֶּם.
