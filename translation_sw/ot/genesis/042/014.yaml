translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa Kiebrania ‘nilisema ... kusema’ umesawazishwa kwa nukta mbili, huku msisitizo wa kauli na wa kiwakilishi ‘ninyi’ ukihifadhiwa.
