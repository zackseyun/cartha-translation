lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: akawaambia
  rationale: Muundo huu wa Kiswahili unasimulia tukio linalofuata na kwa kawaida huunganisha kitendo cha kusema na wale walioambiwa.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Siku ya tatu
  rationale: Huu ni usemi wa kawaida na wa asili wa wakati katika Kiswahili cha sasa.
- source_word: זֹאת עֲשׂוּ
  choice: Fanyeni hivi
  rationale: Huhifadhi kwa ufupi kielezi na amri ya wingi ya Kiebrania.
- source_word: וִחְיוּ
  choice: nanyi mtaishi
  rationale: Huonyesha matokeo yanayoweza kudokezwa na mfuatano wa amri, huku tanbihi ikihifadhi uwezekano wa kuisoma kama amri ya moja kwa moja, ‘mkaishi.’
- source_word: אֶת הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha wa simulizi, nomino yenye kibainishi inamrejelea Mungu; Kiswahili hakihitaji kibainishi hapa.
- source_word: אֲנִי יָרֵא
  choice: mimi namcha
  rationale: Kiwakilishi ‘mimi’ huhifadhi msisitizo wa אֲנִי, na ‘namcha’ huwasilisha hofu yenye heshima kama sifa ya Yosefu.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la jina lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
theological_decisions:
- issue: Maana ya ungamo אֶת הָאֱלֹהִים אֲנִי יָרֵא
  choice: Yosefu anasema wazi kwamba anamcha Mungu, na jambo hilo linaeleza msingi wa agizo lake.
  alternative: Kauli hiyo ingeweza kueleweka kwa ujumla kama kumhofu mungu katika mazingira ya ikulu ya Misri.
  rationale: Muktadha wa Mwanzo humhusianisha Yosefu na Mungu, lakini tafsiri kuu haiongezi maelezo kama ‘Mungu wa kweli’ au ‘Mungu wa baba zake,’ ambayo hayapo wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya asili, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Msisitizo wa kiwakilishi cha Kiebrania umehifadhiwa kwa ‘mimi,’ na utata wa וִחְיוּ umeonyeshwa katika tanbihi.
