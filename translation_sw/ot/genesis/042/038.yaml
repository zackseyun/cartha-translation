  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: sw
  text: Lakini akasema, “Mwanangu hatashuka pamoja nanyi, kwa maana ndugu yake amekufa, naye peke yake ndiye aliyebaki. Ikiwa atapatwa na madhara[a] njiani mtakayopita, basi mtashusha mvi zangu kwa huzuni mpaka Sheoli[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na janga likimpata katika njia mtakayopita.”
    reason: lexical_alternative
  - marker: b
    text: Sheoli ni neno la Kiebrania linalotaja ulimwengu wa wafu; au, “kaburini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: hatashuka
  rationale: Kitenzi kina maana halisi ya ‘kushuka.’ Katika Mwanzo, kwenda kutoka Kanaani hadi Misri huelezwa kama kushuka; hivyo taswira ya kijiografia imehifadhiwa.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Huwakilisha moja kwa moja ‘mwana wangu’ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אָחִיו מֵת
  choice: ndugu yake amekufa
  rationale: 'Kauli hii inaonyesha hali ya sasa kwa mtazamo wa Yakobo: anaamini ndugu yake, Yosefu, ni mfu.'
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: naye peke yake ndiye aliyebaki
  rationale: Muundo huu unahifadhi mkazo wa לְבַדּוֹ na unaeleza kwamba Benyamini ndiye pekee aliyebaki kati ya wana wa Raheli kwa mtazamo wa Yakobo.
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: Ikiwa atapatwa na madhara
  rationale: Ingawa Kiebrania kinaunganisha kishazi kwa ‘na,’ muktadha unakipa maana ya sharti. ‘Atapatwa na madhara’ ni Kiswahili cha asili kinachobakiza upana wa אָסוֹן kama madhara makubwa, janga, au msiba.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: njiani mtakayopita
  rationale: ‘Njiani’ huhifadhi maana halisi ya njia na pia hufaa katika simulizi la safari; ‘mtakayopita’ huwasilisha mwendo wao katika njia hiyo.
- source_word: וְהוֹרַדְתֶּם
  choice: mtashusha
  rationale: Hifili ya ירד humaanisha kusababisha kushuka. ‘Mtashusha’ huhifadhi uhusiano wa kimakusudi na ‘hatashuka’ mwanzoni mwa mstari.
- source_word: שֵׂיבָתִי
  choice: mvi zangu
  rationale: Huhifadhi picha halisi ya nywele za mvi badala ya kuibadili kuwa dhana ya jumla ya uzee.
- source_word: בְּיָגוֹן
  choice: kwa huzuni
  rationale: ‘Kwa huzuni’ ni usemi wa kawaida unaoonyesha hali ya majonzi ambayo Yakobo angekufa nayo.
- source_word: שְׁאֹלָה
  choice: mpaka Sheoli
  rationale: Jina la Kiebrania limehifadhiwa ili lisifinywe kuwa kaburi la kimwili pekee au kufasiriwa kikamilifu kuwa ulimwengu wa wafu.
theological_decisions:
- issue: Kutafsiri שְׁאוֹל kuwa Sheoli au kaburi
  choice: mpaka Sheoli
  alternative: mpaka kaburini; mpaka ulimwengu wa wafu
  rationale: שְׁאוֹל inaweza kumaanisha makao au ulimwengu wa wafu na si lazima iwe sawa tu na kaburi la kimwili. ‘Sheoli’ huhifadhi upana na mvutano wa neno la chanzo bila kuingiza ufafanuzi mwembamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Pamoja nanyi’ na ‘mvi zangu’ ni wazi kwa wasomaji wa kawaida, huku ‘Sheoli’ ikifafanuliwa katika tanbihi. Marudio ya mzizi wa kushuka katika ‘hatashuka’ na ‘mtashusha’ yamehifadhiwa kwa makusudi.
