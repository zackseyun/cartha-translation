base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: sw
  text: Akageuka kutoka kwao, akalia. Kisha akarudi kwao, akazungumza nao. Akamchukua Simeoni kutoka miongoni mwao, akamfunga mbele ya macho yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: Akajitenga nao
  rationale: Kirai hiki kinaonyesha Yosefu akigeuka na kujiondoa kutoka mbele yao. ‘Akajitenga nao’ ni Kiswahili cha kawaida kinachowasilisha kuondoka kwake kwa muda bila kudai zaidi ya maandishi kwamba aliwapa kisogo tu.
- source_word: וַיֵּבְךְּ
  choice: akalia
  rationale: Kitenzi בכה humaanisha kulia; ‘akalia’ ni usemi wa moja kwa moja na wa kawaida katika simulizi.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: akarudi kwao
  rationale: שוב huonyesha kurudi, na אֲלֵהֶם huonyesha kwamba alirudi walikokuwa.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: kuzungumza nao
  rationale: Huwasilisha tendo la kusema au kuzungumza nao kwa Kiswahili cha kawaida bila kuongeza yaliyosemwa.
- source_word: וַיִּקַּח מֵאִתָּם אֶת־שִׁמְעוֹן
  choice: Akamchukua Simeoni kutoka miongoni mwao
  rationale: מֵאִתָּם hapa inaonyesha kwamba Simeoni alitengwa kutoka katika kundi la ndugu zake.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: akamfunga
  rationale: אסר kimsingi ni kufunga au kuweka katika vifungo; tafsiri hii inadumisha tendo halisi lililoelezwa bila kulipanua kuwa kifungo cha gerezani.
- source_word: לְעֵינֵיהֶם
  choice: machoni pao
  rationale: Nahau hii ina maana kwamba jambo lilifanywa huku wakiliona. ‘Machoni pao’ inadumisha taswira halisi ya Kiebrania na ni ya asili katika Kiswahili.
