review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Joseph's weeping, return, speech, selection of Simeon from the group, and binding of him in the brothers' presence. However, “Akajitenga nao” shifts the concrete motion of the Hebrew (“he turned away from them”) toward a more interpretive idea of deliberately separating himself.
  naturalness: The Swahili is generally clear and modern. Using finite narrative verbs throughout improves the rhythm and directly reflects the Hebrew sequence. “Mbele ya macho yao” is more idiomatic than “machoni pao” in this context.
  terminology: “Simeoni,” “akamfunga,” and “kutoka miongoni mwao” are appropriate and accurate. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: “Akajitenga nao” is more interpretive than the source verb.
    rationale: וַיִּסֹּב means that he turned away/withdrew from them. “Kujitenga” can imply intentional social separation rather than the narrated physical turning away.
  - severity: low
    issue: “na kuzungumza nao” is less direct in a chain of completed narrative actions.
    rationale: A finite verb, “akazungumza nao,” gives a smoother and more precise narrative sequence.
  - severity: low
    issue: “machoni pao” is understandable but less idiomatic here.
    rationale: “Mbele ya macho yao” naturally conveys the public, visible action expressed by לְעֵינֵיהֶם.
