  text: וָ/אֶקֹּ֥ד וָֽ/אֶשְׁתַּחֲוֶ֖ה לַ/יהוָ֑ה וָ/אֲבָרֵ֗ךְ אֶת יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲשֶׁ֤ר הִנְחַ֨/נִי֙ בְּ/דֶ֣רֶךְ אֱמֶ֔ת לָ/קַ֛חַת אֶת בַּת אֲחִ֥י אֲדֹנִ֖/י לִ/בְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: sw
  text: Ndipo nikainama na kumwabudu Yahweh, nikambariki Yahweh, Mungu wa bwana wangu Abrahamu, aliyeniongoza katika njia ya kweli[a] ili nimchukue binti ya ndugu wa kiume wa bwana wangu kwa ajili ya mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika njia ya kweli.” Usemi huu unaweza pia kumaanisha “katika njia ya uaminifu” au “katika njia inayotegemeka,” ukikazia mwongozo wa Yahweh unaostahili kutumainiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: nikainama
  rationale: Kitenzi kinaonyesha tendo la kuinama chini; tafsiri hii huhifadhi ishara ya mwili bila kuongeza wazo mahususi la kupiga magoti.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: na kumwabudu Yahweh
  rationale: Kitenzi hiki huonyesha kujisujudu kwa heshima na, kinapoelekezwa kwa Mungu, kwa kawaida hueleza ibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: nikambariki Yahweh
  rationale: ברך inapomhusu Mungu kama mtendewa inaweza kumaanisha kumsifu au kusema mema juu yake; “nikambariki” huhifadhi uhusiano wa moja kwa moja wa kileksia.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Mungu wa bwana wangu Abrahamu
  rationale: אֲדֹנִי humtaja Abrahamu kama mwenye mamlaka juu ya mtumishi, si kama cheo cha kimungu; “bwana wangu” ni usemi wa kawaida katika muktadha huu.
- source_word: הִנְחַנִי
  choice: aliyeniongoza
  rationale: Hifili ya נחה ina maana ya kuongoza au kuelekeza, na umbo hili linafaa katika simulizi ya jambo lililokwisha kutokea.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: katika njia ya kweli
  rationale: Tafsiri hii huhifadhi picha ya njia na maana pana ya אֱמֶת, ambayo inaweza kuonyesha ukweli, uaminifu, au kutegemeka.
- source_word: לָקַחַת
  choice: ili nimchukue
  rationale: Kitenzi-jina kinaonyesha kusudi; “nimchukue” huhifadhi usemi wa maandishi katika muktadha wa kumtafutia mwana mke.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: binti ya ndugu ya bwana wangu
  rationale: Muundo huu huhifadhi wazi uhusiano wa kifamilia uliotajwa katika mnyororo wa maneno ya Kiebrania bila kuamua jinsia ya ‘ndugu’ zaidi ya maandishi.
- source_word: לִבְנוֹ
  choice: kwa ajili ya mwanawe
  rationale: Kiambishi cha umilikaji kinamrejelea bwana wa mtumishi, Abrahamu; usemi huu ni mfupi na wazi katika muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בְּדֶרֶךְ אֱמֶת
  choice: katika njia ya kweli
  alternative: katika njia ya uaminifu / katika njia ya kutegemeka
  rationale: “Ya kweli” huhifadhi utata wa אֱמֶת kati ya ukweli na uaminifu, huku tanbihi ikieleza maana nyingine inayowezekana bila kuisuluhisha kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa simulizi umefanywa wa asili kwa Kiswahili, huku urudiaji wa jina Yahweh, tendo la kuinama na kuabudu, na utata wa ‘njia ya kweli/uaminifu’ vikihifadhiwa.
