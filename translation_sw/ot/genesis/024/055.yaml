  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: sw
  text: Lakini kaka yake na mama yake wakasema, “Msichana huyo akae nasi kwa siku kadhaa[a], au siku kumi; kisha aende.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “siku, au kumi.” Kirai hiki huenda kinamaanisha “siku kadhaa, au siku kumi.”'
