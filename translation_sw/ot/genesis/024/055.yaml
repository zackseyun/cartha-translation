lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... wakasema
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja kwa namna ya kawaida ya simulizi, kiima ambatano ni ndugu yake na mama yake; Kiswahili sanifu hutumia wingi. “Lakini” linaonyesha tofauti na ombi la haraka la mtumishi katika mstari uliotangulia.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: ndugu yake na mama yake
  rationale: “Ndugu” huhifadhi rejeo la mtu mmoja bila kulazimisha jinsia katika nomino yenyewe; katika muktadha huyu ni kaka yake Rebeka. Mpangilio wa Kiebrania umehifadhiwa.
- source_word: תֵּשֵׁב
  choice: akae
  rationale: Katika ombi la kuahirisha safari, “akae” ni Kiswahili cha kawaida kinachoonyesha ruhusa au pendekezo la kubaki.
- source_word: הַנַּעֲרָ
  choice: huyu mwanamke kijana
  rationale: Hutaja mwanamke wa umri mdogo kwa lugha ya sasa yenye heshima, bila kutumia “msichana” kwa namna inayoweza kudokeza utoto.
- source_word: אִתָּנוּ
  choice: nasi
  rationale: Ni tafsiri fupi na ya kawaida ya kuwapo pamoja nasi.
- source_word: יָמִים
  choice: siku kadhaa
  rationale: Ingawa neno lenyewe ni “siku,” hapa linaweza kuwa nahau ya muda usiotajwa kwa usahihi, yaani siku kadhaa.
- source_word: אוֹ עָשׂוֹר
  choice: au kumi
  rationale: Kiebrania kinasema kihalisi “au kumi”; “siku” inaeleweka kutokana na kirai kilichotangulia, hivyo ufupi na hali ya usemi wa chanzo vimehifadhiwa.
- source_word: אַחַר
  choice: baada ya hapo
  rationale: Huonyesha wazi kuwa kuondoka kungefuata baada ya kipindi hicho.
- source_word: תֵּלֵךְ
  choice: aende
  rationale: Muktadha unamtaja huyo mwanamke kijana; hali ya kitenzi cha Kiswahili huwasilisha pendekezo au ruhusa, si ahadi ya uhakika.
