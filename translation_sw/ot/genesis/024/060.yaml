base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: sw
  text: Nao wakambariki Rebeka, wakamwambia, “Dada yetu, na uwe maelfu ya makumi elfu[a], na uzao wako umiliki lango la wale wanaouchukia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umati usiohesabika”; kihalisi, “maelfu ya makumi elfu.”
    reason: lexical_alternative
  - marker: b
    text: Au “urithi lango la adui zake.” Katika Kiebrania, “lango” ni taswira ya nguvu na mamlaka ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: wakambariki
  rationale: Kitenzi hiki kinaonyesha kwamba walitamka baraka juu ya Rebeka; “wakambariki” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: רִבְקָה
  choice: Rebeka
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili na linakaribia matamshi ya Kiebrania.
- source_word: אֲחֹתֵנוּ
  choice: Dada yetu
  rationale: Kauli hii ni mwito wa kifamilia unaoeleweka kwa urahisi katika Kiswahili.
- source_word: הֲיִי
  choice: na uwe
  rationale: Katika muktadha wa baraka, umbo hili linaeleza ombi au tamanio, si amri ya kawaida.
- source_word: לְאַלְפֵי רְבָבָה
  choice: maelfu ya makumi elfu
  rationale: Tafsiri hii inadumisha muunganiko wa Kiebrania wa “maelfu” na “makumi elfu,” huku ikibaki na maana ya ongezeko kubwa sana.
- source_word: וְיִירַשׁ
  choice: umiliki
  rationale: Kitenzi ירש hapa kina maana ya kupata au kushika milki na mamlaka, hasa katika taswira ya lango la mji.
- source_word: זַרְעֵךְ
  choice: uzao wako
  rationale: “Uzao” ni nomino ya jumla inayoweza kumaanisha kizazi au wazao, na inadumisha umbo la umoja la Kiebrania.
- source_word: שַׁעַר
  choice: lango
  rationale: “Lango” linahifadhi taswira halisi ya lango la mji, ambalo pia liliwakilisha nguvu na mamlaka ya mji.
- source_word: שֹׂנְאָיו
  choice: wale wanaouchukia
  rationale: Tafsiri hii inafuata kwa karibu maana ya “wale wanaomchukia/wanaouchukia” na inadumisha rejeo la umoja kwa “uzao” kama nomino ya jumla.
theological_decisions:
- issue: Uzao kama nomino ya jumla katika umoja
  choice: uzao wako ... wale wanaouchukia
  alternative: wazao wako ... adui zao
  rationale: Kiebrania kinatumia זֶרַע kama nomino ya jumla katika umoja na kiwakilishi cha umoja baadaye. Kiswahili kinadumisha hali hiyo kwa “uzao” na upatanisho wa umoja, bila kuamua kama rejeo ni mtu mmoja au kundi la wazao.
- issue: Maana ya kumiliki lango
  choice: umiliki lango
  alternative: ulirithi lango; uliteke lango
  rationale: “Umiliki” huhifadhi wigo wa maana wa ירש kati ya kurithi, kutwaa, na kushika mamlaka, bila kulazimisha namna mahususi ya ushindi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa baraka “na uwe ... na ... ulimiliki” unadumisha tamanio la matini ya Kiebrania. “Uzao” limechaguliwa ili kuhifadhi umoja wa kijumla na mvutano wa maana uliopo katika chanzo.
