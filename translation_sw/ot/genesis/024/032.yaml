base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: sw
  text: Basi yule mtu akaingia nyumbani. Naye akawavulia ngamia mizigo, akawapa mabua makavu na chakula cha mifugo, na akatoa maji ya kuosha miguu yake na miguu ya watu waliokuwa pamoja naye.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawafungua ngamia” au “akawaondolea vifaa.” Kiebrania kinasema kihalisi “akawafungua ngamia,” nahau inayomaanisha kulegeza au kuondoa mizigo na vifaa vyao baada ya kufika.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakimtaji mtendaji kwa jina katika sehemu hii. Vitenzi ni vya umoja na vinaweza kuendeleza rejeleo la “yule mtu,” ingawa muktadha wa ukarimu wa mwenyeji unaweza kuelekeza kwa Labani.
    reason: discourse_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: yule mtu akaingia nyumbani
  rationale: Kirai chenye he ya mwelekeo kinaonyesha kuingia kuelekea ndani ya nyumba. “Yule mtu” huhifadhi rejeleo la Kiebrania bila kuongeza cheo cha “mtumishi.”
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: akawafungulia mizigo ngamia
  rationale: Kitenzi פתח kwa kawaida ni “kufungua,” lakini hapa ni nahau ya kulegeza au kuondoa vifaa na mizigo ya ngamia baada ya safari. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: תֶּבֶן
  choice: mabua makavu
  rationale: תבן ni mabua au masalia makavu ya nafaka yaliyotumiwa kulishia wanyama; “mabua makavu” huitofautisha na nyasi kavu.
- source_word: מִסְפּוֹא
  choice: malisho
  rationale: Neno hili humaanisha chakula cha mifugo. “Malisho” ni neno la sasa, lenye hadhi, na linalofaa kwa muktadha.
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו
  choice: maji ya kuosha miguu yake
  rationale: Muundo wa kusudi umeonyeshwa kwa “maji ya kuosha,” huku kiwakilishi cha umoja kikihifadhiwa.
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: na miguu ya watu waliokuwa pamoja naye
  rationale: Huhifadhi wingi wa האנשים na kishazi cha uhusiano kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mtendaji wa vitendo vya kuwafungulia ngamia mizigo, kuwapa chakula, na kuleta maji
  choice: Kiwakilishi “naye” na viambishi vya umoja vimeachwa viendeleze simulizi bila kumtaja Labani moja kwa moja; tanbihi inaeleza utata wa rejeleo.
  alternative: Kumtaja Labani waziwazi kama mtendaji, au kueleza kwamba yule mtu mwenyewe ndiye aliyefanya yote.
  rationale: Vitenzi vya Kiebrania ni vya nafsi ya tatu umoja na havimtaji Labani. Kisarufi vinaweza kuendeleza mhusika “yule mtu,” lakini muktadha wa ukarimu wa mwenyeji unaweza kuelekeza kwa Labani. Kutomtaja mhusika kwa jina kunahifadhi mvutano huo badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya kuingia nyumbani ili mfululizo wa matendo usomeke kwa urahisi. “Mabua makavu” na “malisho” ni maneno yanayoeleweka bila kutumia msamiati wa kizamani.
