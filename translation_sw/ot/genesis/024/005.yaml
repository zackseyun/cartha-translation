  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: sw
  text: Mtumishi akamwambia, “Huenda mwanamke huyo hatakubali kunifuata kwenda nchi hii.[a] Je, basi nimrudishe mwanao katika nchi uliyotoka?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwenda nyuma yangu,” yaani, “kunifuata.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania hutumia infinitivu kamili pamoja na kitenzi finiti ili kusisitiza tendo hilo: “Je, kweli nimrudishe mwanao...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: Mtumishi
  rationale: Katika simulizi hili עֶבֶד humtaja mtu wa nyumbani aliye chini ya mamlaka ya Abrahamu. ‘Mtumishi’ ni neno la kawaida na lenye heshima, ingawa neno la Kiebrania pia linaweza kumaanisha mtumwa.
- source_word: אוּלַי
  choice: Huenda
  rationale: Huonyesha uwezekano usio na uhakika kwa Kiswahili cha sasa na cha kawaida.
- source_word: לֹא תֹאבֶה
  choice: hatakubali
  rationale: Kitenzi אָבָה kinahusu kuwa tayari au kukubali. ‘Hatakubali’ linaonyesha hiari ya mwanamke bila kulifanya tamko kuwa la kisheria kupita kiasi.
- source_word: הָאִשָּׁה
  choice: mwanamke huyo
  rationale: Kiebrania kinasema tu ‘mwanamke’; hakimtaji bado kuwa mke wala kusisitiza umri wake. ‘Huyo’ humtambulisha kama mwanamke anayezungumziwa.
- source_word: לָלֶכֶת אַחֲרַי
  choice: kunifuata
  rationale: Maana halisi ni ‘kwenda nyuma yangu’; ‘kunifuata’ ni Kiswahili cha asili kinachohifadhi wazo hilo.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: mpaka nchi hii
  rationale: אֶרֶץ ni ‘nchi’ au ‘ardhi.’ ‘Nchi hii’ ni ya kawaida katika muktadha wa eneo alilokuwamo Abrahamu, na ‘mpaka’ huonyesha mahali anakoelekea.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: Je, basi nimrudishe
  rationale: Muundo wa kitenzi kisicho na kikomo pamoja na kitenzi kamili unasisitiza tendo la kurudisha. Swali la Kiswahili linahifadhi hali ya kutaka maelekezo, huku tanbihi ikionyesha msisitizo wa Kiebrania.
- source_word: אֶת בִּנְךָ
  choice: mwanao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ‘mwana wako.’
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: katika nchi uliyotoka
  rationale: Huhifadhi wazi wazo la nchi ambayo Abrahamu alitoka, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kitenzi cha kumrudisha Isaka katika nchi ile
  choice: nimrudishe
  alternative: nimpeleke
  rationale: Kiebrania hutumia שוב, ‘kurudi/kumrudisha,’ ingawa simulizi halijasema Isaka aliwahi kuwa katika nchi hiyo. Tafsiri inadumisha mvutano huu wa matini badala ya kuutatua kwa ‘nimpeleke.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi ya usimulizi wa Maandiko. Sentensi inatumia ‘Huenda’ kwa uwezekano na ‘Je, basi’ kwa swali la kutaka maelekezo. Alama za tanbihi zimewekwa karibu na vifungu vinavyoelezwa.
