id: GEN.24.42
reference: Genesis 24:42
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: sw
  text: Leo nilifika kwenye chemchemi[a], nikasema, ‘Ee Yahweh, Mungu wa bwana wangu Abrahamu, ikiwa, tafadhali, utaifanikisha njia yangu ninayoifuata—’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kisima.” Neno la Kiebrania hasa humaanisha chemchemi au chanzo cha maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: Leo nilifika
  rationale: Waw ya usimulizi pamoja na בוא inaeleza tendo la wakati uliopita, huku הַיּוֹם ikisisitiza kwamba kuwasili kulitokea siku hiyo.
- source_word: הָעָיִן
  choice: chemchemi
  rationale: עַיִן hapa ni chanzo cha maji au chemchemi; ‘chemchemi’ ni mahususi zaidi kuliko ‘kisima’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Mungu wa bwana wangu Abrahamu
  rationale: אֲדֹנִי humtaja Abrahamu kama bwana wa mtumishi; ‘bwana wangu’ huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: ikiwa sasa unaifanikisha
  rationale: Muundo huu wa ombi una utata na ni wa hali inayoendelea; ‘ikiwa sasa’ huhifadhi אִם na hisia ya נָא bila kuugeuza waziwazi kuwa ombi la amri.
- source_word: דַּרְכִּי
  choice: njia yangu
  rationale: Tafsiri hii huhifadhi maana halisi na kiambishi cha umilikaji; katika muktadha ‘njia’ inaweza kumaanisha safari au shughuli aliyotumwa.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: ninayoifuata
  rationale: Kiswahili hiki cha kawaida huwasilisha nahau ya Kiebrania ya kwenda juu ya njia fulani bila kuiga muundo wake usio wa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu; ‘Yahweh’ hulihifadhi kwa kulitohowa bila kulibadilisha kuwa cheo.
- issue: Utata wa ombi lenye אִם na נָא
  choice: ikiwa sasa unaifanikisha
  alternative: tafadhali ifanikishe
  rationale: Chaguo kuu huhifadhi muundo wa sharti na hali ya tendo inayoendelea, badala ya kuamua kwamba maneno hayo ni ombi la moja kwa moja la amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. ‘Ee’ hudumisha sauti ya sala; mstari mrefu mwishoni huonyesha kwamba maneno yanaendelea katika mstari unaofuata.
