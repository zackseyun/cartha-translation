  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: sw
  text: Abrahamu akamwambia mtumishi wake, mzee wa nyumba yake, aliyekuwa msimamizi wa yote aliyokuwa nayo,[a] “Tafadhali weka mkono wako chini ya paja langu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “mzee wa nyumba yake, aliyetawala juu ya yote aliyokuwa nayo.” “Mzee” linaweza kuonyesha umri au ukuu wa cheo.
    reason: lexical_alternative
  - marker: b
    text: Kuweka mkono chini ya paja kulikuwa ishara ya kale ya kuapa, huenda ikionyesha kujifunga kwa dhati.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa kawaida wa masimulizi ya Kiebrania; ‘kisha’ na kitenzi cha masimulizi huendeleza tukio kwa Kiswahili cha kawaida.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Neno linaweza kumaanisha mtumishi au mtumwa; hapa muktadha unasisitiza cheo cha mtu wa kuaminika anayesimamia nyumba, hivyo ‘mtumishi’ linafaa bila kuamua hadhi yake ya kisheria.
- source_word: זְקַן בֵּיתוֹ
  choice: aliyekuwa mkuu katika nyumba yake
  rationale: זָקֵן huonyesha umri au ukuu. Katika muktadha huu, ‘mkuu katika nyumba yake’ huwasilisha hadhi ya juu ya mtumishi kwa lugha ya asili, huku tanbihi ikihifadhi uwezekano wa maana ya umri.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: na msimamizi wa mali yake yote
  rationale: Huwasilisha kwa Kiswahili cha kawaida kwamba alikuwa na mamlaka juu ya vyote Abrahamu alivyokuwa navyo, bila kutumia ‘kutawala’ ambako hapa kungekuwa kizito.
- source_word: שִׂים נָא
  choice: Tafadhali weka
  rationale: Amri pamoja na נָא ina sauti ya ombi la heshima au la dhati.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Tafsiri ya moja kwa moja.
- source_word: תַּחַת יְרֵכִי
  choice: chini ya paja langu
  rationale: Tafsiri ya moja kwa moja huhifadhi ishara maalumu ya kitamaduni; maelezo yake yanafaa kuwekwa katika tanbihi.
theological_decisions: []
translation_notes:
