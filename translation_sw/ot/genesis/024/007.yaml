  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: sw
  text: Yahwe, Mungu wa mbinguni, aliyenitoa katika nyumba ya baba yangu na katika nchi nilikozaliwa, aliyesema nami na aliyeniapia akisema, “Nitaupa uzao wako nchi hii”—yeye atamtuma malaika wake[a] mbele yako, nawe utamchukulia mwanangu mke kutoka huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wake.” Neno la Kiebrania מַלְאָךְ linaweza kumaanisha “mjumbe” au “malaika”; katika muktadha huu, yaelekea zaidi linamaanisha mjumbe wa mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi unaotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo kama BWANA.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Mungu wa mbinguni
  rationale: Hii ni kauli ya kawaida na ya asili katika Kiswahili, huku ikihifadhi uhusiano wa muundo wa Kiebrania.
- source_word: לְקָחַנִי
  choice: aliyenitoa
  rationale: Katika muktadha huu, kitenzi kinamaanisha Mungu alimwondoa Abrahamu kutoka mazingira yake ya awali; ‘kunitoa’ ni wazi na ya asili.
- source_word: מִבֵּית אָבִי
  choice: katika nyumba ya baba yangu
  rationale: Inahifadhi usemi wa kifamilia wa Kiebrania bila kuupanua kuwa ukoo au jamaa.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: na katika nchi nilikozaliwa
  rationale: Inawasilisha maana ya nchi ya kuzaliwa bila kuamua kwamba neno hilo linamaanisha hasa ukoo.
- source_word: דִּבֶּר לִי
  choice: aliyesema nami
  rationale: Kitenzi kina maana ya kusema au kunena; hakijatafsiriwa ‘aliahidi’ kwa sababu ahadi yenyewe inafuata.
- source_word: נִשְׁבַּע לִי
  choice: aliyeniapia
  rationale: Inatoa kwa ufupi na kwa kawaida maana ya kuapa kwa mtu.
- source_word: לְזַרְעֲךָ
  choice: uzao wako
  rationale: ‘Uzao’ huhifadhi wazo la nomino ya pamoja na inaweza kujumuisha vizazi vingi bila kubadilishwa kuwa wingi wa moja kwa moja.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: Nitaupa uzao wako nchi hii
  rationale: Inahifadhi ahadi ya wakati ujao na nchi kama kitu kinachotolewa kwa uzao.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru kinahifadhi mkazo wa Kiebrania kwamba Mungu mwenyewe ndiye atakayetenda.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: atamtuma malaika wake mbele yako
  rationale: ‘Malaika’ ndiyo maana inayowezekana zaidi katika muktadha wa uongozi wa Mungu, na ‘mbele yako’ inafuata kwa karibu usemi wa Kiebrania.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: nawe utamchukulia mwanangu mke
  rationale: Inahifadhi sura ya agizo na wazo la kumchukua mke kwa ajili ya mwana, kwa lugha inayoeleweka katika Kiswahili.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina la Mungu moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Maana ya מַלְאָכוֹ katika muktadha huu
  choice: malaika wake
  alternative: mjumbe wake
  rationale: Neno la Kiebrania linaweza kumaanisha mjumbe wa kibinadamu au wa mbinguni. Katika kauli hii ya uongozi wa Mungu, malaika wa mbinguni anaelekea kukusudiwa zaidi, lakini uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa marudio ‘aliyesema nami na aliyeniapia’ umehifadhiwa ili kuonyesha msisitizo wa chanzo. Alama ya tanbihi imewekwa baada ya ‘malaika wake,’ ambako utata wa kileksika unatokea.
