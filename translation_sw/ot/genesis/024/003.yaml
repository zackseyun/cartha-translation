base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: sw
  text: Nami nitakuapisha kwa Yahweh[a], Mungu wa mbingu na Mungu wa dunia, kwamba hutamchukulia mwanangu mke kutoka kwa binti za Wakanaani, ambao ninaishi miongoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH (יהוה), jina la Mungu; hapa limetolewa kwa kutoholewa kuwa “Yahweh.”'
    reason: Kufafanua jina la Mungu lililo katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: Nami nitakuapisha
  rationale: Kitenzi cha Kiebrania kiko katika Hifili na kina maana ya kumsababisha mtu aape; “nitakuapisha” kinahifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: בַּיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha yule ambaye kiapo kinaapwa kwa jina lake. Jina la Mungu יהוה limetoholewa kuwa “Yahwe.”
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: Mungu wa mbingu na Mungu wa dunia
  rationale: Marudio ya “Mungu wa” yanahifadhiwa kama katika Kiebrania. Jozi ya mbingu na dunia inaonyesha upeo wa ulimwengu wote.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: kwamba hutamchukulia
  rationale: Kishazi kinaeleza yaliyomo katika kiapo. Wakati ujao wa kukanusha unafaa kwa ahadi ya kutofanya jambo hilo na kudumisha uzito wa kiapo.
- source_word: אִשָּׁה לִבְנִי
  choice: mwanangu mke
  rationale: Katika muktadha wa ndoa, אִשָּׁה ni “mke,” na muundo “kumchukulia mwanangu mke” unaonyesha kuwa mke anatafutwa kwa ajili ya mwana.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: miongoni mwa binti za Wakanaani
  rationale: “Binti za” linahifadhi tamathali ya Kiebrania inayowarejelea wanawake wa jamii hiyo, huku “Wakanaani” likiweka wazi kundi la watu.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: ambao ninaishi kati yao
  rationale: Kauli hii inaeleza kuishi katikati ya watu hao; “ninaishi kati yao” ni ya asili na inaendeleza maana ya hali inayoendelea.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” linahifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “Mungu wa” na taswira ya “binti za Wakanaani” yamehifadhiwa, huku miundo mingine ikitolewa kwa Kiswahili cha asili.
