  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: sw
  text: Kisha mtumishi akatoa vitu vya fedha, vitu vya dhahabu na mavazi, akampa Rebeka. Pia aliwapa ndugu yake wa kiume na mama yake zawadi za thamani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi bora.” Neno la Kiebrania linaweza kumaanisha zawadi bora na zenye thamani; katika baadhi ya miktadha linaweza pia kumaanisha vyakula vitamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: akatoa
  rationale: Hifili ya יצא ina maana ya kusababisha kitu kitoke au kukitoa; “akatoa” ni ya kawaida na inaonyesha tendo halisi.
- source_word: הָעֶבֶד
  choice: mtumishi
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa; katika simulizi hili “mtumishi” ni sahihi na ya kawaida bila kuamua zaidi hali yake ya kisheria.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: vitu vya fedha, vitu vya dhahabu
  rationale: כְּלִי ni neno pana linaloweza kutaja chombo, kifaa au kitu; “vitu” huepuka kudokeza kwamba vilikuwa vyombo pekee.
- source_word: וּבְגָדִים
  choice: na mavazi
  rationale: בְּגָדִים humaanisha nguo au mavazi; “mavazi” linafaa sajili ya simulizi yenye hadhi.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: akampa Rebeka
  rationale: Kitenzi cha Kiswahili kinaunganisha kwa kawaida mpokeaji; vitu vilivyotolewa vinaeleweka kutokana na sentensi iliyotangulia.
- source_word: וּמִגְדָּנֹת
  choice: zawadi za thamani
  rationale: מִגְדָּנוֹת hurejelea vitu au zawadi bora na zenye thamani; tafsiri hii inafaa muktadha wa zawadi za ndoa huku tanbihi ikihifadhi uwezekano wa vyakula vitamu.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: ndugu yake na mama yake
  rationale: Huwatambulisha jamaa wawili wa Rebeka; “ndugu” hapa humrejelea ndugu wa kiume kulingana na אָח, bila kuongeza dhana isiyotajwa ya kuwa mkubwa au mdogo.
