  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וּ/בְנוֹת֙ אַנְשֵׁ֣י הָ/עִ֔יר יֹצְאֹ֖ת לִ/שְׁאֹ֥ב מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: sw
  text: Tazama, nimesimama kando ya chemchemi ya maji[a], nao binti za wanaume wa mji[b] wanatoka kuteka maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye chanzo cha maji.” Neno la Kiebrania linamaanisha chemchemi au chanzo cha maji, si neno la kawaida linalotumiwa kwa “kisima.”
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania ni “binti za wanaume wa mji”; katika muktadha huu unamaanisha wanawake vijana wa mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kiashiria hiki kinavuta fikira kwenye tukio la sasa. “Tazama” ni neno la kawaida, lenye hadhi, na linadumisha uhai wa usemi.
- source_word: אָנֹכִי נִצָּב
  choice: nimesimama
  rationale: Kitenzi kishirikishi cha Kiebrania kinaonyesha hali ya sasa ya mtumishi akiwa amesimama. Kiswahili huonyesha nafsi ndani ya kitenzi, hivyo si lazima kuongeza “mimi” isipokuwa kwa mkazo mkubwa zaidi.
- source_word: עַל
  choice: kando ya
  rationale: Katika muktadha wa mahali pa kuchota maji, kihusishi hiki kinaonyesha kuwa yuko karibu na chemchemi, si juu yake.
- source_word: עֵין הַמָּיִם
  choice: chemchemi ya maji
  rationale: Kirai hiki kinamaanisha chanzo cha maji au chemchemi, si neno la kawaida la Kiebrania kwa kisima. Tafsiri hii inadumisha maana ya chanzo cha maji.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: nao binti za wanaume wa mji
  rationale: Tafsiri hii inadumisha muundo wa kifamilia na kijamii wa Kiebrania pamoja na rejeo lake mahususi kwa wanaume wa mji, ingawa katika muktadha inawahusu wanawake vijana wa mji huo.
- source_word: יֹצְאֹת
  choice: wanatoka
  rationale: Kishirikishi cha kike cha wingi kinaonyesha tendo linaloendelea au linalotokea wakati huo, kwa mtazamo wa mtumishi aliyeko penye maji.
- source_word: לִשְׁאֹב מָיִם
  choice: kuteka maji
  rationale: “Kuteka maji” ni usemi wa kawaida na sahihi wa Kiswahili kwa kuchukua maji kutoka kisimani au chemchemini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Muundo “binti za wanaume wa mji” umehifadhiwa kwa sababu unaakisi kwa karibu usemi wa kijamii wa Kiebrania; tanbihi inafafanua maana yake ya kimuktadha.
