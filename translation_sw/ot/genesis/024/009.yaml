  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: sw
  text: Basi mtumishi akaweka mkono wake chini ya paja la Abrahamu, bwana wake, akamwapia kuhusu jambo hilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chini ya paja” ni tafsiri halisi ya usemi wa Kiebrania unaoeleza ishara ya kiapo kizito; baadhi huielewa kuwa ishara iliyohusiana na viuno au uzao wa agano.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: mtumishi
  rationale: Neno עֶבֶד linaweza kumaanisha mtumishi au mtumwa. Katika simulizi hili, jukumu lake katika nyumba ya Abrahamu ndilo linalosisitizwa, hivyo “mtumishi” ni la kawaida na linafaa kwa muktadha bila kufuta uhusiano wa mamlaka.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: akaweka mkono wake
  rationale: Kitenzi שׂוּם humaanisha kuweka; tafsiri hii ni ya asili katika Kiswahili na inahifadhi tendo halisi.
- source_word: תַּחַת יֶרֶךְ
  choice: chini ya paja
  rationale: יָרֵךְ kwa maana ya msingi ni paja. Tafsiri halisi inahifadhi ishara ya kiapo bila kuingiza katika matini kuu fasiri kuhusu viuno, uzazi, au uzao wa agano.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: Abrahamu, bwana wake
  rationale: Katika muktadha huu wa mamlaka ya kibinadamu, אֲדוֹן humaanisha mkuu au mwenye mamlaka juu ya mtumishi. “Bwana wake” ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano huo; koma huzuia jina na kirai kisomeke kana kwamba ni jina moja.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: akamwapia
  rationale: Nifali ya שׁבע humaanisha kuapa au kula kiapo, na לוֹ huelekeza kiapo kwa Abrahamu. “Akamwapia” ni fupi, ya kawaida, na inahifadhi mwelekeo huo wa kibinafsi.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: kuhusu jambo hilo
  rationale: דָּבָר hapa hurejelea agizo au sharti lililotangulia, kwa hiyo “jambo” linaeleza maana ya muktadha vizuri kuliko “neno” au “kitu.”
theological_decisions:
- issue: Kutafsiri ishara ya kiapo kihalisi au kuifasiri kiishara
  choice: Kuhifadhi “chini ya paja” katika matini kuu na kueleza uwezekano wa maana yake katika tanbihi.
  alternative: Kutafsiri moja kwa moja kuwa ishara iliyohusiana na viuno, sehemu za uzazi, au uzao wa agano.
  rationale: Kiebrania kinaeleza tendo la mwili bila kufafanua maana yake. Tafsiri halisi huhifadhi utata wa matini na huepuka kufanya fasiri moja kuwa ndiyo maana ya lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wa heshima. Muundo wa vitenzi mfululizo “akaweka … akamwapia” unaendana na usimulizi wa kawaida wa Kiswahili. Neno “bwana” hapa humaanisha mkuu wa mtumishi, si jina la Mungu.
