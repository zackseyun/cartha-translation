  source_fidelity: Rasimu inawakilisha vizuri tendo la causative la וַיַּבְרֵךְ, wingi wa ngamia, mahali nje ya mji, wakati wa jioni, na jinsia ya kike ya הַשֹּׁאֲבֹת. Hata hivyo, mpangilio wa maneno katika ‘Akawapigisha magoti ngamia’ si usemi wa kawaida wa Kiswahili; ‘akawapigisha ngamia magoti’ huonyesha kwa wazi kuwa ngamia ndio waliopigishwa magoti. ‘Kando ya kisima’ pia ni sawa na mahali panapokusudiwa na אֶל katika muktadha huu bila kudhoofisha uhusiano huo kwa ‘karibu na.’
