  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: sw
  text: Akawapigisha ngamia magoti nje ya mji, kando ya kisima cha maji, wakati wa jioni, wakati ambapo wanawake hutoka kuteka maji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: Akawapigisha magoti
  rationale: Kitenzi cha Kiebrania katika Hifili kina maana ya kusababisha ngamia wapige magoti. Kauli hii ni ya kawaida na inaonyesha tendo hilo kwa uwazi.
- source_word: הַגְּמַלִּים
  choice: ngamia
  rationale: Nomino ya wingi yenye kibainishi; Kiswahili hutumia umbo lilelile ‘ngamia’ kwa umoja na wingi, huku upatanisho wa ‘wa-’ ukionyesha wingi.
- source_word: מִחוּץ לָעִיר
  choice: nje ya mji
  rationale: Hutoa maana ya mahali palipo nje ya eneo la mji kwa Kiswahili cha kawaida.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: karibu na kisima cha maji
  rationale: אֶל kimsingi huonyesha kuelekea mahali; katika muktadha huu, baada ya ngamia kupiga magoti, Kiswahili huonyesha kwa kawaida mahali waliposimama kuwa karibu na kisima.
- source_word: לְעֵת עֶרֶב
  choice: wakati wa jioni
  rationale: Huhifadhi kirai cha wakati na maana yake ya moja kwa moja.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: wakati ambapo wanawake hutoka kwenda kuteka maji
  rationale: Umbo הַשֹּׁאֲבֹת ni la kike wingi, hivyo ‘wanawake’ huhifadhi taarifa ya kijinsia; ‘hutoka kwenda kuteka maji’ ni Kiswahili cha kawaida kinachoeleza shughuli yao.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘wakati’ yamehifadhiwa kwa sababu yanaakisi miundo miwili sambamba ya לְעֵת katika Kiebrania bila kuwa magumu kupita kiasi katika Kiswahili.
