base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: sw
  text: Sara, mke wa bwana wangu, alimzalia bwana wangu mwana baada ya kuzeeka kwake, na bwana wangu akampa mwana huyo mali yake yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: alimzalia
  rationale: Kitenzi hiki cha simulizi kinamaanisha kuzaa; muundo wenye kiambishi cha yambwa unaonyesha kwa kawaida kwamba alimzalia bwana wake mwana.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: mke wa bwana wangu
  rationale: Huhifadhi muundo wa umilikaji na namna ya heshima ya mtumishi akimrejelea Abrahamu.
- source_word: בֵן
  choice: mwana
  rationale: Katika Kiswahili, “mwana” ni neno la kawaida na lenye hadhi kwa mtoto wa kiume katika muktadha huu wa simulizi.
- source_word: לַאדֹנִי
  choice: bwana wangu
  rationale: Katika “alimzalia bwana wangu mwana,” uhusiano unaoonyeshwa na ל unawasilishwa kwa kawaida bila kihusishi cha ziada.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: baada ya kuwa amezeeka
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya wakati ya usemi halisi “baada ya uzee wake,” huku ikisisitiza kwamba Sara alikuwa tayari mzee.
- source_word: וַיִּתֶּן לוֹ
  choice: naye akampa huyo mwana
  rationale: Kitenzi kinaendeleza simulizi la wakati uliopita. Kirai “huyo mwana” kinaweka wazi kwamba mpokeaji ni mwana aliyetajwa, bila kubadili maana.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: mali yake yote
  rationale: Ni usemi wa asili wa Kiswahili unaojumuisha vitu vyote alivyomiliki Abrahamu.
theological_decisions:
- issue: Mhusika wa kiwakilishi katika וַיִּתֶּן לוֹ
  choice: Abrahamu ndiye anayetoa, na mwana ndiye anayepokea
  alternative: Kuacha viwakilishi pekee bila kufafanua marejeo yake
  rationale: Muktadha na sarufi vinaelekeza kwa bwana wa mtumishi kama mtendaji na mwana aliyetajwa kama mpokeaji; “huyo mwana” huondoa utata wa Kiswahili bila kuongeza dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Bwana wangu” limehifadhiwa kama namna ya heshima ya mtumishi, si jina la Mungu. Hakuna tanbihi inayohitajika; chaguo la “baada ya kuwa amezeeka” linatoa maana ya nahau ya Kiebrania kwa uwazi.
