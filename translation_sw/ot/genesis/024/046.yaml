  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. “Mtungi” na “kuwapa maji” ni maneno ya sasa yanayoeleweka kwa urahisi; tanbihi inahifadhi kutokuwazi kwa מֵעָלֶיהָ.
