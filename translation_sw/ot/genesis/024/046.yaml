base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: sw
  text: Akateremsha haraka mtungi wake kutoka begani[a], akasema, “Kunywa, nami nitawapa ngamia wako maji pia.” Basi nikanywa, naye akawapa ngamia maji pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “kutoka juu yake.” Muktadha mpana unaonyesha kuwa mtungi ulikuwa umebebwa begani, lakini sehemu ya mwili haitajwi wazi hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: haraka
  rationale: Kitenzi מהר kinaonyesha kutenda kwa upesi; matumizi ya kielezi pamoja na kitenzi kinachofuata ni ya kawaida katika Kiswahili na yanahifadhi msisitizo wa simulizi.
- source_word: וַתּוֹרֶד
  choice: akateremsha
  rationale: Hifili ya ירד humaanisha kusababisha kitu kishuke; “akateremsha” linaonyesha kwa usahihi tendo la kuushusha mtungi.
- source_word: כַּדָּהּ
  choice: mtungi wake
  rationale: כד ni chombo cha kuchotea au kubebea maji; “mtungi” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: מֵעָלֶיהָ
  choice: kutoka begani[a]
  rationale: Kiebrania kinasema kihalisi “kutoka juu yake” bila kutaja sehemu ya mwili. Muktadha mpana unaonyesha kuwa huenda mtungi ulikuwa begani; tanbihi inalinda kutokuwazi huko kwa matini chanzi.
- source_word: שְׁתֵה
  choice: Kunywa
  rationale: Amri ya moja kwa moja inahifadhi ufupi na nguvu ya usemi wa Kiebrania.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: nami nitawapa maji ngamia wako pia
  rationale: Hifili ya שקה humaanisha kumpa mtu au mnyama kinywaji. “Nitawapa maji” ni ya asili na wazi katika Kiswahili.
- source_word: וָאֵשְׁתְּ
  choice: Basi nikanywa
  rationale: “Basi” huonyesha kwa kawaida kuwa tendo hili lilifuata mwaliko wake, huku “nikanywa” likihifadhi nafsi ya kwanza ya simulizi.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: naye akawapa maji ngamia pia
  rationale: Tafsiri hii inadumisha maana ya שקה na kutaja “ngamia” bila kuongeza kimilikishi ambacho hakipo katika kishazi hiki.
theological_decisions: []
