  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: sw
  text: Alipomaliza kumpa maji, akasema, “Nitawatekea maji ngamia wako pia, mpaka wamalize kunywa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: Alipomaliza kumpa maji
  rationale: Kitenzi כלה pamoja na kitenzi-jina kinatambulisha kukamilika kwa tendo la kumpa mtu maji kabla ya tukio linalofuata. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi mfuatano wa simulizi.
- source_word: וַתֹּאמֶר
  choice: akasema
  rationale: Muundo wa simulizi wenye kiambishi -ka- unaonyesha tendo lililofuata kwa njia ya asili katika Kiswahili.
- source_word: גַּם לִגְמַלֶּיךָ
  choice: ngamia wako pia
  rationale: Neno 'pia' linahifadhi maana ya nyongeza ya גַּם, na 'wako' linawakilisha kiambishi cha nafsi ya pili umoja.
- source_word: אֶשְׁאָב
  choice: Nitawatekea maji
  rationale: Kitenzi שאב humaanisha kuteka maji. Kiambishi cha watendewa 'wa-' kinaonyesha kuwa maji hayo ni kwa ajili ya ngamia, huku 'maji' likitajwa wazi kwa ufasaha.
- source_word: עַד אִם
  choice: mpaka
  rationale: Muungano huu hutumika kama kishazi cha kikomo; 'mpaka' ni tafsiri ya kawaida na wazi katika Kiswahili.
- source_word: כִּלּוּ לִשְׁתֹּת
  choice: wamalize kunywa
  rationale: Muundo huu unahifadhi maana ya ngamia kufikia mwisho wa kunywa, na ni wa asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima na unaoeleweka kwa urahisi. Hakuna tanbihi iliyohitajika kwa sababu tofauti ya Kiingereza kati ya muundo rasmi na wa kawaida inaelezwa moja kwa moja na muundo wa Kiswahili.
