base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: sw
  text: Naye akaniambia, “Yahweh, ambaye nimeenenda mbele zake, atamtuma malaika wake pamoja nawe, na ataifanikisha safari yako[a]. Nawe utamchukulia mwanangu mke kutoka katika ukoo wangu[b] na katika nyumba ya baba yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuifanikisha njia yako.”
    reason: Neno la Kiebrania lililotafsiriwa “safari” kwa maana ya kimuktadha kwa msingi ni “njia.”
  - marker: b
    text: Au, “jamaa yangu”; neno la Kiebrania linaweza kumaanisha kundi pana la watu wenye uhusiano wa kindugu.
    reason: Huonyesha upana wa maana ya מִשְׁפָּחָה bila kuifungia katika familia ya nyumbani pekee.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa kwa kulinakili kama jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: nimetembea mbele zake
  rationale: Huhifadhi nahau ya Kiebrania kuhusu kuishi maisha yote mbele za Mungu, bila kuongeza wazi wazo la uaminifu ambalo linadokezwa lakini halijasemwa moja kwa moja.
- source_word: מַלְאָכוֹ
  choice: malaika wake
  rationale: Katika muktadha huu ni mjumbe wa mbinguni anayetumwa na Yahweh; ‘malaika’ ndiyo tafsiri ya kawaida na inayoeleweka.
- source_word: אִתָּךְ
  choice: pamoja nawe
  rationale: Huonyesha kwa kawaida kwamba malaika atasafiri na mtumishi na kumsaidia.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: na kuifanikisha safari yako
  rationale: Kauli ya kisababishi ya צלח ina maana ya kufanya njia au shughuli ifanikiwe; ‘safari’ huwasilisha maana ya ‘njia’ katika muktadha huu.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: nawe utamchukulia ... mke
  rationale: Kauli hii inaonyesha kumtafutia au kumpatia mwana mke; muundo wa Kiswahili unaweka wazi kwamba mke huyo ni kwa ajili ya mwana.
- source_word: לִבְנִי
  choice: mwanangu
  rationale: בן humaanisha mwana wa kiume, na kiambishi cha umilikaji kimehifadhiwa.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: kutoka katika ukoo wangu
  rationale: מִשְׁפָּחָה inaweza kumaanisha kundi pana la jamaa kuliko familia ya nyumbani; ‘ukoo’ huhifadhi upana huo.
- source_word: וּמִבֵּית אָבִי
  choice: na katika nyumba ya baba yangu
  rationale: Huhifadhi nahau ya Kiebrania inayoweza kumaanisha nyumba, jamaa, au nasaba ya upande wa baba.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: ‘Yahweh’ huhifadhi jina binafsi la agano na huepuka kulibadilisha kuwa cheo.
- issue: Maana ya ‘nimetembea mbele zake’
  choice: Kuhifadhi nahau ya agano
  alternative: nimeishi kwa uaminifu mbele zake
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la maisha yanayoishiwa mbele za Mungu bila kulifanya dokezo la uaminifu kuwa maelezo ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau muhimu za Kiebrania zimehifadhiwa pale zinapoeleweka, huku ‘safari’ ikitumika kwa ‘njia’ kulingana na muktadha.
