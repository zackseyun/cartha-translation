base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: sw
  text: Isaka akatoka kwenda kutafakari[a] shambani, jioni ilipokaribia. Akainua macho yake, akatazama, na tazama, ngamia walikuwa wakija.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutembea,” “kuwaza,” “kuzungumza,” au labda “kuomba” shambani. Kitenzi cha Kiebrania ni nadra, na maana yake hasa hapa haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Qal wayyiqtol ya יצא inaonyesha kutoka kimwili na kuendeleza mfululizo wa simulizi; “akatoka” ni ya kawaida na ya moja kwa moja.
- source_word: יִצְחָק
  choice: Isaka
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: לָשׂוּחַ
  choice: kwenda kutafakari
  rationale: Kitenzi שׂוח ni nadra na maana yake hapa haijulikani kwa uhakika. “Kutafakari” kinafaa kwa shughuli ya utulivu ya mtu akiwa peke yake, bila kuamua kwamba alikuwa akiomba; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: שׂדה humaanisha shamba au eneo la wazi la mashambani; “shambani” ni tafsiri fupi na ya asili katika muktadha huu.
- source_word: לִפְנוֹת עָרֶב
  choice: kuelekea jioni
  rationale: Nahau hiyo huonyesha jioni ikikaribia; “kuelekea jioni” inadumisha maana ya wakati bila tafsiri ngumu ya neno kwa neno.
- source_word: וַיִּשָּׂא עֵינָיו
  choice: akainua macho yake
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania ya kuelekeza macho juu au mbele.
- source_word: וַיַּרְא
  choice: akatazama
  rationale: Baada ya “akainua macho yake,” “akatazama” hudumisha tendo linalofuata bila kuunganisha vitenzi viwili.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: “Tazama” huvuta usikivu kwa jambo lililoonekana ghafla na kuhifadhi uhai wa simulizi.
- source_word: גְמַלִּים בָּאִים
  choice: ngamia walikuwa wakija
  rationale: Kivumishi-tendo בָּאִים kinaonyesha mwendo unaoendelea wa ngamia waliokuwa wakikaribia.
theological_decisions:
- issue: Je, לָשׂוּחַ humaanisha hasa kuomba?
  choice: kutafakari
  alternative: kuomba; kutembea; kuwaza; kuzungumza
  rationale: Maana ya kitenzi hiki nadra inabishaniwa. Matini kuu haitaji moja kwa moja sala, hivyo tafsiri haipaswi kuingiza maana hiyo kwa uhakika; tanbihi inaonyesha uwezekano mbalimbali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi wenye “aka-” umetumiwa kwa mtiririko wa matendo, huku “na tazama” ikihifadhi msisitizo wa וְהִנֵּה.
