  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: sw
  text: Ndipo Labani na Bethueli wakajibu na kusema, “Jambo hili limetoka kwa Yahwe[a]; hatuwezi kukuambia neno baya wala jema[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahwe ni jina la Mungu linalowakilishwa na herufi יהוה katika matini ya Kiebrania.
    reason: divine_name
  - marker: b
    text: Kwa karibu, “hatuwezi kusema kwako baya au jema.” Huu ni usemi unaoweza kumaanisha kwamba hawakuwa na uwezo wa kupinga au kubadili jambo ambalo Yahwe alikuwa ameamua.
    reason: idiom
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: wakajibu na kusema
  rationale: Muundo huu unahifadhi vitenzi vyote viwili vya utangulizi wa usemi katika Kiebrania, huku ukibaki wazi na wenye hadhi katika Kiswahili.
- source_word: מֵיְהוָה
  choice: limetoka kwa Yahwe
  rationale: Kihusishi מִן kinaonyesha chanzo, na jina la agano יְהוָה limetolewa kama “Yahwe.”
- source_word: הַדָּבָר
  choice: jambo hili
  rationale: דָּבָר hapa ni suala linalojadiliwa kuhusu ndoa, si neno lililotamkwa tu. “Jambo hili” linaeleweka kwa kawaida katika muktadha.
- source_word: יָצָא
  choice: limetoka
  rationale: Kitenzi kina maana ya kutoka; katika tamko hili kinaonyesha kwamba jambo hilo lina chanzo chake kwa Yahwe.
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: hatuwezi kukuambia
  rationale: Neno kwa neno ni “hatuwezi kusema/kuzungumza nawe.” “Kukuambia” ni Kiswahili cha kawaida kinachodumisha wazo la usemi unaoelekezwa kwa mtumishi.
- source_word: רַע אוֹ טוֹב
  choice: baya wala jema
  rationale: Huhifadhi mpangilio na mvutano wa jozi ya Kiebrania, huku “wala” ikifaa baada ya kukanusha katika Kiswahili. Tanbihi inaeleza matumizi yake ya kiidioma bila kulazimisha ufafanuzi huo ndani ya matini.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia moja kwa moja jina la Mungu la herufi nne; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “baya wala jema”
  choice: Kuhifadhi usemi huo katika matini na kuufafanua katika tanbihi
  alternative: Hatuwezi kupinga wala kubadili jambo hilo
  rationale: Jozi רַע אוֹ טוֹב inaweza kuwa nahau inayomaanisha kwamba hawawezi kupinga au kubadili jambo lililoamuliwa na Mungu. Tafsiri kuu inadumisha taswira na uwezekano wa maana wa chanzo, huku tanbihi ikisaidia msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. Majina “Labani” na “Bethueli” yanafuata maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili. Usemi wa Kiebrania “baya wala jema” umehifadhiwa na kufafanuliwa kwa tanbihi.
