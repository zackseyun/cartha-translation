base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: sw
  text: Akasema, “Ee Yahweh, Mungu wa bwana wangu Abrahamu, tafadhali unifanikishe leo[a], na umtendee bwana wangu Abrahamu upendo mwaminifu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tafadhali ufanye jambo hili litokee mbele yangu leo.” Kitenzi cha Kiebrania kinamwomba Mungu alete kwa uongozi wake tukio linalotazamiwa.
    reason: lexical_alternative
  - marker: b
    text: “Upendo mwaminifu” hutafsiri neno la Kiebrania hesed, ambalo pia linaweza kumaanisha fadhili zenye uaminifu au uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetajwa moja kwa moja; limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Mungu wa bwana wangu Abrahamu
  rationale: Muundo huu unaonyesha uhusiano wa mtumishi na Abrahamu; “bwana wangu” ni wa kawaida na wazi katika Kiswahili.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: tafadhali unifanikishe leo
  rationale: Kitenzi cha Hifili kinaomba Mungu alete kwa uongozi wake tukio linalotazamiwa. “Unifanikishe” ni Kiswahili cha asili kinachoeleza ombi la mafanikio bila kuficha kabisa wazo la Mungu kulifanya litokee; mbadala wa karibu umewekwa katika tanbihi.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: umtendee ... upendo mwaminifu
  rationale: Muundo wa “kutenda hesed pamoja na/kwa” umetolewa kwa Kiswahili cha kawaida, huku “upendo mwaminifu” ukihifadhi maana ya fadhili yenye uaminifu na kudumu.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: umtendee bwana wangu Abrahamu
  rationale: Ingawa עִם kwa msingi ni “pamoja na,” kitenzi “kutendea” kinaeleza kwa kawaida anayepokea tendo hilo katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֶסֶד katika ombi kwa ajili ya Abrahamu
  choice: upendo mwaminifu
  alternative: fadhili; wema; uaminifu wa agano
  rationale: “Upendo mwaminifu” huhifadhi upana wa neno, yaani fadhili, ushikamanifu na uaminifu, bila kulifungia katika tafsiri moja ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” huhifadhi mwito wa moja kwa moja katika sala; sentensi imewekwa kwa mtiririko wa asili wa Kiswahili.
