  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: sw
  text: Ndipo utakuwa huru kutokana na kiapo changu[a] utakapofika kwa jamaa yangu; nao wasipokupa, utakuwa huru kutokana na kiapo changu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “laana yangu”; neno la Kiebrania linaweza kumaanisha kiapo chenye laana au adhabu inayodokezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: utakuwa huru
  rationale: Katika muktadha wa kiapo, maneno haya yanaonyesha kuondolewa wajibu au dhima, wala si kutokuwa na hatia kwa maana ya jumla. Usemi huu pia unadumisha ulinganifu wa marudio hayo mawili katika aya.
- source_word: מֵאָלָתִי
  choice: kutokana na kiapo changu
  rationale: אָלָה hapa ni kiapo chenye wajibu na adhabu inayodokezwa. Muktadha unasisitiza kuachiliwa kutoka katika wajibu wa kiapo, huku maana ya laana ikihifadhiwa katika tanbihi.
- source_word: כִּי
  choice: utakapofika
  rationale: Hapa כִּי inaonyesha hali ya wakati inayohusiana na kuachiliwa kutoka katika wajibu; ‘utakapofika’ ni Kiswahili cha kawaida na huacha uhusiano huo wa wakati na sharti usomeke kwa kawaida.
- source_word: מִשְׁפַּחְתִּי
  choice: jamaa yangu
  rationale: Neno hili linamaanisha ukoo au familia pana. ‘Jamaa yangu’ linaeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki na linafaa kwa ndugu wa ukoo wanaokusudiwa hapa.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: nao wasipokupa
  rationale: Kitu kinachotolewa hakitajwi wazi katika Kiebrania, ingawa kinaeleweka kutokana na muktadha. Kiswahili kinaweza kuacha yambwa hilo bila kulitaja, hivyo tafsiri inahifadhi udhahiri wa chanzo bila kuongeza ‘huyo mwanamke’ au ‘binti huyo’.
theological_decisions:
- issue: Maana ya אָלָה katika muktadha wa kiapo
  choice: kiapo
  alternative: laana
  rationale: Simulizi linakazia wajibu wa kiapo ambacho Abrahamu alimwekea mtumishi. Hata hivyo, kwa kuwa neno hilo linaweza pia kumaanisha laana au adhabu iliyoambatanishwa na kiapo, maana hiyo mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo ‘wasipokupa’ umehifadhi yambwa lisilotajwa wazi katika Kiebrania.
