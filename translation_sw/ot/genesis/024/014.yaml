source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: sw
  text: 'Na iwe hivi: Msichana nitakayemwambia, ‘Tafadhali teremsha mtungi wako ili ninywe,’ naye aseme, ‘Kunywa, nami nitawanywesha ngamia wako pia,’ huyo ndiye uliyemteua kwa ajili ya mtumishi wako, kwa ajili ya Isaka.[a] Kupitia kwake[b] nitajua kwamba umemwonyesha bwana wangu upendo mwaminifu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya mtumishi wako Isaka.” Kiebrania kinaweza kusomwa kwa kiambatisho, lakini katika matini kuu “mtumishi wako” anamrejelea msemaji, na “kwa ajili ya Isaka” ni kirai tofauti.
    reason: alternative_reading
  - marker: b
    text: Au, “Kwa jambo hili.” Kiebrania kwa maana halisi kinasema “kupitia kwake,” kikitumia kiambishi cha kike kinachoweza kumrejelea msichana huyo kama ishara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Na iwe hivi
  rationale: Katika muktadha wa sala, muundo huu unaanzisha ombi kuhusu ishara inayotarajiwa; ‘Na iwe hivi’ ni wa asili na huhifadhi wazo la ombi.
- source_word: הַנַּעֲרָ
  choice: mwanamke kijana
  rationale: Neno hilo humaanisha mtu wa kike aliye kijana, hapa mwenye umri wa kuolewa. ‘Mwanamke kijana’ huepuka kumdokeza mtoto mdogo.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: Tafadhali teremsha mtungi wako
  rationale: הטה hapa ni kuinamisha au kuteremsha chombo ili mtu anywe; נָא imewakilishwa kwa ‘tafadhali’.
- source_word: וְאֶשְׁתֶּה
  choice: ili ninywe
  rationale: Huwasilisha ombi la msemaji kwa Kiswahili cha kawaida na huunganika vizuri na kitendo cha kuteremsha mtungi.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: nami nitawanywesha ngamia wako pia
  rationale: Hifili ya שׁקה ni kumpa mtu au mnyama maji anywe. ‘Kuwanywesha’ ni sahihi na ya kawaida katika muktadha huu.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: huyo ndiye uliyemteua
  rationale: Katika muktadha huu הוכיח humaanisha kumchagua au kumteua mwanamke kwa njia ya ishara ya majaliwa, si kumthibitisha kwa hoja.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: kwa ajili ya mtumishi wako Isaka
  rationale: Usomaji wa kiambatisho, yaani ‘mtumishi wako Isaka,’ ni wa moja kwa moja na wa kawaida; mpangilio wa Kiebrania unaweza pia kueleweka kama virai viwili tofauti vya kusudi, jambo lililowekwa katika tanbihi.
- source_word: וּבָהּ אֵדַע
  choice: Kupitia kwake nitajua
  rationale: Kiambishi cha kike katika בָהּ kinamrejelea mwanamke huyo kwa hali ya kawaida kabisa kama njia au ishara ambayo kwayo mtumishi atajua.
- source_word: כִּי עָשִׂיתָ חֶסֶד
  choice: kwamba umemwonyesha ... upendo mwaminifu
  rationale: חֶסֶד hujumuisha upendo, wema, na uaminifu wa kudumu. ‘Upendo mwaminifu’ huhifadhi uzito huo bila kuufanya istilahi finyu ya kidhehebu.
- source_word: עִם אֲדֹנִי
  choice: bwana wangu
  rationale: Ingawa עִם kimsingi ni ‘pamoja na,’ kitenzi ‘kumwonyesha’ kwa Kiswahili tayari kinaonyesha anayepokea upendo huo.
theological_decisions:
- issue: Mrejelewa wa ‘mtumishi wako’ katika לְעַבְדְּךָ לְיִצְחָק
  choice: 'Kirai kimesomwa kwa kiambatisho: ‘mtumishi wako Isaka.’'
  alternative: ‘kwa ajili ya mtumishi wako, kwa ajili ya Isaka,’ ambapo ‘mtumishi wako’ anaweza kumrejelea msemaji.
  rationale: Muundo wa kiambatisho ni usomaji wa kawaida na hutoa Kiswahili fasaha, lakini Kiebrania kinaruhusu kutenganisha virai hivyo; kwa hiyo usomaji mwingine haujafichwa.
- issue: Mrejelewa wa וּבָהּ
  choice: 'Kiambishi cha kike kimerejelewa kwa mwanamke: ‘Kupitia kwake.’'
  alternative: ‘Kwa jambo hili,’ yaani kwa ishara au tukio lote.
  rationale: Umbo la Kiebrania ni la kike umoja na kwa kawaida humrejelea mwanamke aliyetajwa; hata hivyo, maana pana ya ishara nzima inawezekana kimuktadha.
- issue: Maana ya חֶסֶד
  choice: upendo mwaminifu
  alternative: fadhili; wema wa kudumu
  rationale: Uamuzi huu huhifadhi pamoja neema ya tendo na uaminifu wa uhusiano, bila kulazimisha maana maalumu ya kimfumo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kama ombi la sala lenye ishara inayotarajiwa. ‘Mtungi’ na ‘kuwanywesha ngamia’ ni maneno ya kawaida na yanayoeleweka; utata halisi wa virai vya Kiebrania umehifadhiwa kwa tanbihi.
