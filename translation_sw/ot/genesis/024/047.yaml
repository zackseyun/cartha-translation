base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: sw
  text: Ndipo nikamuuliza, “Wewe ni binti wa nani?” Naye akasema, “Mimi ni binti wa Bethueli, mwana wa Nahori, ambaye Milka alimzalia Nahori.” Kisha nikamvika pete[a] puani, na vikuku mikononi mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pete ya puani.” Neno la Kiebrania linaweza kumaanisha pete kwa ujumla, na mahali ilipowekwa panaonyesha matumizi yake hapa.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “juu ya mikono yake”; katika muktadha huu huenda inamaanisha kwenye vifundo vya mikono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: Ndipo nikamuuliza
  rationale: Muundo wa Kiebrania una maana ya kuuliza kwa kutamka swali. Kiswahili cha kawaida hakihitaji kurudia ‘nikasema’ kabla ya swali lenyewe.
- source_word: בַּת מִי אַתְּ
  choice: Wewe ni binti ya nani?
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuuliza kuhusu baba au ukoo wa mwanamke, huku neno ‘binti’ likihifadhiwa.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: Mimi ni binti ya Bethueli mwana wa Nahori
  rationale: Inahifadhi mpangilio wa nasaba wa Kiebrania na inaweka jibu katika Kiswahili cha kawaida.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: ambaye Milka alimzalia Nahori
  rationale: 'Jina ‘Nahori’ limerudiwa ili kiwakilishi cha Kiebrania לּוֹ kisilete utata katika Kiswahili: Milka alimzalia Nahori mwana huyo, Bethueli.'
- source_word: הַנֶּזֶם
  choice: pete
  rationale: נֶזֶם inaweza kumaanisha pete kwa ujumla; maneno yanayofuata, ‘puani,’ yanaonyesha ilikovaliwa hapa.
- source_word: עַל אַפָּהּ
  choice: puani
  rationale: Hutoa kwa ufupi na kwa kawaida maana ya kuweka pambo kwenye pua yake.
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: na vikuku mikononi mwake
  rationale: ‘Vikuku’ ni neno la kawaida kwa mapambo haya. יָד inaweza kumaanisha mkono kwa upana, ingawa katika muktadha huu huenda vifundo vya mikono vinakusudiwa.
