base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: sw
  text: Ngamia walipomaliza kunywa, mtu huyo akachukua pete ya dhahabu[a] yenye uzito wa beka moja[b], na vikuku viwili vya mikononi mwake, vyenye uzito wa shekeli kumi za dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “pete ya puani ya dhahabu”; neno la Kiebrania linaweza kumaanisha pete inayovaliwa puani au sikioni.
    reason: lexical_alternative
  - marker: b
    text: Beka ilikuwa kipimo cha uzito kilicholingana na nusu shekeli.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: Ngamia walipomaliza kunywa
  rationale: Muundo huu unaonyesha wakati tendo lililofuata lilipotokea. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya kukamilika kwa kunywa bila kusisitiza zaidi ya maandishi kuhusu uharaka.
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Kiebrania kinasema ‘mtu’ wala si ‘mtumishi’ katika mstari huu. ‘Huyo’ humrejelea kwa kawaida mtu aliyetajwa katika muktadha bila kuongeza cheo kisichotumiwa hapa.
- source_word: נֶזֶם זָהָב
  choice: pete ya dhahabu
  rationale: Neno נֶזֶם linaweza kumaanisha pete inayovaliwa puani au sikioni. ‘Pete’ inadumisha upana huo wa maana, huku uwezekano wa pete ya puani ukielezwa katika tanbihi.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: yenye uzito wa beka moja
  rationale: בֶּקַע ni kipimo cha kale cha uzito. Jina la kipimo limehifadhiwa badala ya kubadilishwa kimya kuwa kipimo kingine; ufafanuzi unatolewa katika tanbihi.
- source_word: וּשְׁנֵי צְמִידִים
  choice: na vikuku viwili
  rationale: Tafsiri hii inadumisha wazi idadi ya vitu viwili iliyotajwa katika Kiebrania.
- source_word: עַל יָדֶיהָ
  choice: kwa ajili ya mikono yake
  rationale: Kiebrania kwa kawaida ni ‘juu ya mikono yake,’ lakini katika muktadha mtu huyo anavichukua vikuku hivyo ili avae. ‘Kwa ajili ya mikono yake’ ni ya kawaida kwa Kiswahili na haibadilishi ‘mikono’ kuwa ‘vifundo vya mikono’ bila ulazima.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: vyenye uzito wa shekeli kumi za dhahabu
  rationale: Kipimo kinachodokezwa ni shekeli. Kukitaja hufanya sentensi ieleweke kwa Kiswahili, na uzito huo unahusu vikuku viwili kwa pamoja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi na wenye heshima. Vipimo vya kale vimehifadhiwa, na utata halisi wa aina ya pete haujaondolewa katika matini kuu.
