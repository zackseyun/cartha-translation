id: GEN.24.35
reference: Genesis 24:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: sw
  text: Yahweh amembariki sana bwana wangu, naye amekuwa mtu mkuu. Amempa mifugo midogo, makundi ya ng’ombe, fedha na dhahabu, watumishi wa kiume na wa kike[a], ngamia na punda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa wa kiume na wa kike.” Maneno ya Kiebrania yanaweza kumaanisha watumishi wa nyumbani au watumwa, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa kwa kulitamka kama jina maalumu badala ya kulibadilisha kuwa cheo; tahajia “Yahwe” ni ya kawaida na rahisi kueleweka katika Kiswahili.
- source_word: בֵּרַךְ ... מְאֹד
  choice: amembariki sana
  rationale: Muundo huu wa Kiswahili unaonyesha tendo la Mungu lenye matokeo yanayoonekana sasa na kuhifadhi nguvu ya kielezi מְאֹד.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Katika muktadha huu mtumishi anamrejelea Abrahamu kama mkuu wake wa kibinadamu. “Bwana wangu” ni usemi wa asili wa Kiswahili unaohifadhi heshima na uhusiano huo.
- source_word: וַיִּגְדָּל
  choice: naye amekuwa mtu mkuu
  rationale: Huhifadhi maana pana ya kuwa mkuu—ikiwa ni pamoja na utajiri, hadhi na uwezo—bila kuifupisha kuwa utajiri pekee.
- source_word: וַיִּתֶּן לוֹ
  choice: Amempa
  rationale: Muktadha unaonyesha kuwa Yahwe ndiye anayetoa na Abrahamu ndiye anayepokea; umbo la wakati timilifu linaonyesha mali alizo nazo kutokana na tendo hilo.
- source_word: צֹאן
  choice: makundi ya kondoo na mbuzi
  rationale: Nomino hii ya jumla hujumuisha mifugo midogo, hasa kondoo na mbuzi. Kutaja aina hizo mbili kunaweka maana wazi kwa msomaji wa sasa.
- source_word: בָּקָר
  choice: makundi ya ng’ombe
  rationale: Neno hili linamaanisha mifugo ya jamii ya ng’ombe; “makundi” huhifadhi hali ya nomino ya jumla na kuendana na צֹאן.
- source_word: כֶּסֶף וְזָהָב
  choice: fedha na dhahabu
  rationale: Huhifadhi maana halisi ya madini ya thamani badala ya kugeuza כֶּסֶף kuwa pesa kwa ujumla.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: watumishi wa kiume na wa kike
  rationale: Maneno hayo yanaweza kumaanisha watumishi au watumwa kulingana na muktadha. Tafsiri kuu ni ya kawaida na inaonyesha tofauti ya jinsia; uwezekano wa hali ya utumwa umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu. Kulitaja kama “Yahwe” huhifadhi utambulisho wake kama jina badala ya kulibadilisha kuwa cheo.
- issue: Hali ya עֲבָדִם na שְׁפָחֹת katika orodha ya mali ya nyumba
  choice: watumishi wa kiume na wa kike
  alternative: watumwa wa kiume na wa kike
  rationale: Msamiati wa Kiebrania unaweza kueleza utumishi wa nyumbani au utumwa. Aya haitoi maelezo ya kutosha kuamua kwa uhakika hali yao ya kisheria, kwa hiyo tafsiri kuu haifungi maana hiyo na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi na orodha iliyo wazi zimechaguliwa kwa usomaji wa kawaida; “mtu mkuu” huhifadhi upana wa וַיִּגְדָּל bila kuifanya imaanishe utajiri pekee.
