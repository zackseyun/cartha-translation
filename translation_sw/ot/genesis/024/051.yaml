base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: sw
  text: Tazama, Rebeka yuko mbele yako. Mchukue uende, naye awe[a] mke wa mwana wa bwana wako, kama Yahwe alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye apate kuwa mke.” Kitenzi cha Kiebrania kinaweza kumaanisha “awe” au “apate kuwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Chembe hii ya kuonyesha huvuta fikira kwenye hali iliyo mbele yao; “Tazama” ni ya heshima, wazi, na yenye uhai katika Kiswahili cha sasa.
- source_word: רִבְקָה
  choice: Rebeka
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: לְפָנֶיךָ
  choice: yuko mbele yako
  rationale: Inahifadhi maana halisi ya kuwapo mbele ya mtu na pia hudokeza kwamba Rebeka yuko tayari kukabidhiwa kwa uamuzi uliotajwa.
- source_word: קַח וָלֵךְ
  choice: Mchukue uende
  rationale: Vitenzi viwili vya amri vinafuatana. Kiambishi cha yambwa “-m-” kinaweka wazi kwamba anayechukuliwa ni Rebeka.
- source_word: וּתְהִי אִשָּׁה
  choice: naye awe mke
  rationale: Kitenzi cha Kiebrania ni jussive na kinaweza kueleza ruhusa, matakwa, au matokeo yanayokusudiwa. “Awe mke” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo bila kuifanya kuwa amri ya moja kwa moja.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: wa mwana wa bwana wako
  rationale: Muundo huu wa Kiswahili unaeleza uhusiano wa ndoa kwa njia ya kawaida. “Bwana wako” hapa humaanisha mkuu wa mtumishi huyo.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama ... alivyosema
  rationale: Hueleza kwamba jambo hilo linapatana na neno ambalo tayari lilisemwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo linaloeleweka na kutamkika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu moja kwa moja. Kutumia “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya וּתְהִי katika kauli ya ndoa
  choice: naye awe mke
  alternative: naye apate kuwa mke
  rationale: “Awe” huhifadhi hali ya jussive—ruhusa, matakwa, au matokeo yanayokusudiwa—bila kulazimisha tofauti kati ya ‘kuwa’ na ‘kupata kuwa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi fupi na mpangilio wa amri zimehifadhiwa; utata wa jussive umeonyeshwa kwa tanbihi.
