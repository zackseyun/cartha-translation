  text: Rebeka alikuwa na ndugu wa kiume, na jina lake lilikuwa Labani. Labani akakimbia nje kumwendea yule mtu[b] kwenye chemchemi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye chanzo cha maji.” Neno la Kiebrania linamaanisha hasa chemchemi, si kisima kilichochimbwa.
