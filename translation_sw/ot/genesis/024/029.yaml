lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: Rebeka alikuwa na ndugu wa kiume
  rationale: 'Muundo wa Kiebrania wenye kihusishi לְ unatumiwa kuonyesha umilikaji au uhusiano: Rebeka alikuwa na ndugu. ‘Ndugu wa kiume’ ni sahihi bila kudokeza kwamba alikuwa mkubwa au mdogo kuliko Rebeka.'
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: na jina lake lilikuwa Labani
  rationale: Inahifadhi kwa uwazi fomula ya Kiebrania ya kutaja jina, huku ikitumia Kiswahili cha kawaida.
- source_word: וַ/יָּרָץ
  choice: akamkimbilia
  rationale: Kitenzi kina maana ya ‘kukimbia’; umbo ‘akamkimbilia’ linaonyesha kwa kawaida mwendo kuelekea kwa mtu aliyetajwa na אֶל.
- source_word: אֶל הָ/אִישׁ
  choice: yule mtu
  rationale: Kiebrania kinasema ‘yule mtu’ badala ya kumtambulisha wazi kuwa mtumishi wa Abrahamu; tafsiri inadumisha namna hiyo ya kumrejelea.
- source_word: הַ/ח֖וּצָ/ה
  choice: huko nje
  rationale: Neno hilo linaeleza mwelekeo au mahali pa nje, na limetafsiriwa wazi badala ya kuachwa likimezwa katika kitenzi.
- source_word: אֶל הָ/עָיִן
  choice: kwenye chemchemi
  rationale: עַיִן hapa ni chanzo cha maji kinachobubujika, kwa hiyo ‘chemchemi’ ni sahihi zaidi kuliko ‘kisima’ na inadumisha tofauti ya kileksia.
