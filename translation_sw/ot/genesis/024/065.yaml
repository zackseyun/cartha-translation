    rationale: Kitenzi hiki kwa kawaida huelekea maana ya kusalimu/kusalimia. Kiebrania hapa kinaeleza mtu anayekwenda ili kukutana nao; “kutukutana” hufikisha maana hiyo.
  - severity: low
    issue: “Uwanjani” kwa בַּשָּׂדֶה.
    rationale: “Uwanja” unaweza kumaanisha eneo la michezo au kiwanja. “Shambani” ndilo chaguo la kawaida na sahihi kwa ‘katika shamba/uwanja wa kilimo’ wa simulizi.
  - severity: low
    issue: Tanbihi ya “akajitanda utaji” si mbadala wa kawaida wa Kiswahili.
    rationale: Usemi huo hausikiki wa kawaida katika Kiswahili Sanifu na unaweza kudokeza kitendo tofauti. Mbadala salama ni “akajifunika kwa utaji.”
