  verdict: revise
  source_fidelity: 'Rasimu inafuata vizuri maana ya Kiebrania kwa ujumla: mtumishi anamtambulisha Isaka kuwa bwana wake, na Rebeka anajifunika kwa utaji. Hata hivyo, “kutulaki” humaanisha hasa kusalimu/kusalimia, wala si kwenda kukutana na mtu; hivyo haifikishi kwa usahihi לִקְרָאתֵנוּ (“kutukutana”). “Uwanjani” pia si tafsiri ya kawaida ya בַּשָּׂדֶה katika muktadha huu, ambapo “shambani” ni sahihi zaidi.'
