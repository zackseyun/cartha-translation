  terminology: “Mtumishi,” “mwanamume,” “bwana wangu,” na “utaji” zinafaa katika rejesta ya Kiswahili Sanifu. Herufi ndogo katika “bwana wangu” ni sahihi kwa kuwa ni mkuu wa kibinadamu. “Akajifunika kwa utaji” huweka wazi uhusiano wa utaji na kitendo reflexive bila kuongeza maana.
  issues:
