  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: sw
  text: Rebeka akamwambia mtumishi, “Ni nani yule mwanamume anayetembea shambani kutukutana?” Mtumishi akasema, “Huyo ni bwana wangu.” Ndipo Rebeka akachukua utaji, akajifunika kwa utaji huo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akajifunika mwenyewe kwa utaji huo.” Kitenzi cha Kiebrania kina umbo la kujirejelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: mtumishi
  rationale: Katika simulizi hili neno עֶבֶד linamtaja wakala wa nyumba ya Abrahamu; “mtumishi” ni la kawaida na linafaa kwa muktadha bila kukana kwamba neno la Kiebrania pia linaweza kumaanisha mtumwa.
- source_word: הָאִישׁ הַלָּזֶה
  choice: yule mwanamume
  rationale: Kiashiria הַלָּזֶה kinamwelekeza mtu anayeonekana akiwa mbali kiasi; “yule mwanamume” ni usemi wa asili katika Kiswahili kwa swali la kumtambua.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: anayekuja uwanjani kutulaki
  rationale: Ingawa הלך kimsingi ni kwenda au kutembea, לִקְרָאתֵנוּ huonyesha mwendo kuelekea kwao. “Anayekuja uwanjani kutulaki” ni Kiswahili cha kawaida kinachohifadhi mahali na kusudi la mwendo.
- source_word: הוּא אֲדֹנִי
  choice: Huyo ni bwana wangu
  rationale: אֲדֹנִי hapa ni cheo cha kibinadamu kinachoonyesha uhusiano wa mtumishi na mkuu wake. “Bwana wangu” ni tafsiri ya moja kwa moja na yenye hadhi, bila kukifanya kuwa cheo cha Mungu.
- source_word: הַצָּעִיף
  choice: utaji
  rationale: Neno צעיף linamaanisha kifuniko cha mwanamke; “utaji” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: וַתִּתְכָּס
  choice: akajifunika
  rationale: 'Umbo la kitenzi lina maana ya kujirejelea: Rebeka alijifunika mwenyewe kwa utaji aliouchukua.'
theological_decisions:
- issue: Maana ya אֲדֹנִי
  choice: bwana wangu
  alternative: Bwana wangu
  rationale: Herufi ndogo inaonyesha wazi kuwa anayezungumziwa ni mkuu wa kibinadamu wa mtumishi, si jina au cheo cha Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina “Rebeka” limewekwa wazi katika sentensi ya mwisho ili kuondoa utata wa kiwakilishi kwa Kiswahili bila kubadili mhusika. “Kutulaki” huhifadhi maana ya kwenda kukutana nao, huku “anayekuja” ikitoa mwelekeo wa mwendo kwa lugha ya kawaida.
