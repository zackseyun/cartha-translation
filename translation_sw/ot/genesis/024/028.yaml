  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: sw
  text: Kisha yule msichana akakimbia, akawaambia watu wa nyumba ya mama yake mambo hayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba ya mama yake.” Kauli ya Kiebrania inaweza kumaanisha jengo la nyumba lenyewe au watu wa kaya ya mama yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: akakimbia
  rationale: Kitenzi רוץ kinaonyesha mwendo wa haraka; “akakimbia” ni tafsiri ya moja kwa moja na ya kawaida katika simulizi.
- source_word: הַנַּעֲרָ
  choice: yule msichana
  rationale: נַעֲרָה humaanisha mtu wa kike aliye kijana. “Msichana” ni neno la kawaida la Kiswahili na linafaa kwa Rebeka katika muktadha huu.
- source_word: וַתַּגֵּד
  choice: kuwaambia
  rationale: Hifili ya נגד humaanisha kufanya jambo lijulikane au kueleza. Kwa kuwa walengwa ni watu wa nyumbani, “kuwaambia” ni Kiswahili cha kawaida.
- source_word: לְבֵית אִמָּהּ
  choice: watu wa nyumbani mwa mama yake
  rationale: בַּיִת inaweza kumaanisha jengo au jamaa/watu wa nyumba. Muktadha unaelekea kwa watu aliowaeleza, huku tanbihi ikihifadhi uwezekano wa maana ya nyumba yenyewe.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: mambo hayo
  rationale: דְּבָרִים inaweza kuwa maneno, mambo, au matukio. “Mambo hayo” huwasilisha kwa kawaida yale yaliyotokea na kusimuliwa.
