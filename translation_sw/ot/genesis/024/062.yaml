translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wa heshima, na unaoeleweka. “Negebu” limetoholewa kama jina la kijiografia; “eneo” limetumika kuwasilisha אֶרֶץ kwa ufasaha. Alama zote za tanbihi zimewekwa katika matini kuu.
