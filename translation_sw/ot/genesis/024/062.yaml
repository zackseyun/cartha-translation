base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: sw
  text: Isaka alikuwa amekuja kutoka Beer-Lahai-Roi[a][b], naye alikuwa akiishi katika nchi ya Negebu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Isaka alikuja kutoka Beer-Lahai-Roi.” Muundo wa Kiebrania unaweza pia kutafsiriwa kwa wakati uliopita wa kawaida badala ya wakati uliopita timilifu.
    reason: lexical_alternative
  - marker: b
    text: Beer-Lahai-Roi ni jina la mahali palipohusishwa hapo awali na Hagari (tazama Mwanzo 16:14).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא מִבּוֹא
  choice: alikuwa amerudi kutoka
  rationale: Muundo huu uliobanwa unaonyesha mwendo uliokamilika kutoka mahali fulani. Katika mtiririko wa simulizi, wakati uliopita timilifu unaweka tukio hili kabla ya tukio linalofuata; hata hivyo, Kiebrania kinaweza pia kueleweka kwa wakati uliopita wa kawaida.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lahai-Roi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa, na viunganishi vinadhihirisha kwamba ni jina ambatani.
- source_word: יוֹשֵׁב
  choice: alikuwa akiishi
  rationale: Kitenzi-shirikishi cha Kiebrania kinaonyesha hali inayoendelea ya kukaa au kuishi.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: katika eneo la Negebu
  rationale: אֶרֶץ hapa ni eneo au nchi, huku נֶגֶב likitumiwa kama jina la kijiografia la ukanda wa kusini wenye ukame.
- source_word: וְהוּא
  choice: naye
  rationale: Kiwakilishi kilicho wazi pamoja na kiunganishi kinadumisha uratibu na mgeuko mdogo wa maelezo bila kuongeza kiashiria cha wakati kisichokuwapo katika chanzo.
