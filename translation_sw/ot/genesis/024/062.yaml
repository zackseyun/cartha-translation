    reason: lexical_alternative
  - marker: b
    text: Beer-Lahai-Roi ni jina la mahali palipohusishwa hapo awali na Hagari (tazama Mwanzo 16:14).
    reason: cross_reference
  revision_rationale: Replaced "alikuwa amerudi" with "alikuwa amekuja" to avoid adding the unsupported meaning "returned." Replaced "eneo la Negebu" with "nchi ya Negebu" to represent the explicit אֶרֶץ more closely. Footnote wording was correspondingly adjusted, while markers and their placement were preserved.
