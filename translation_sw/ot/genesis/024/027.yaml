  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: sw
  text: Akasema, “Ahimidiwe Yahweh, Mungu wa bwana wangu Abrahamu, ambaye hajamwondolea bwana wangu upendo wake wa kudumu na uaminifu wake.[a] Nami, Yahweh ameniongoza njiani hadi nyumbani kwa ndugu wa bwana wangu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fadhili zake na kweli yake.” Maneno haya mawili ya Kiebrania mara nyingi huonyesha upendo wa kudumu na uaminifu unaotegemeka.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “ndugu”; hapa neno hilo linawarejelea wanaume wa ukoo wa Abrahamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Ahimidiwe
  rationale: Kauli ya baraka na sifa kwa Mungu; “Ahimidiwe” ni Kiswahili cha kawaida na chenye hadhi katika tamko la kumtukuza Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Mungu wa bwana wangu Abrahamu
  rationale: Linafuata uhusiano wa maneno ya Kiebrania na kudumisha namna mtumishi anavyomtaja Abrahamu.
- source_word: לֹא עָזַב חַסְדּוֹ וַאֲמִתּוֹ מֵעִם אֲדֹנִי
  choice: hajaacha kumwonyesha bwana wangu upendo wake thabiti na uaminifu wake
  rationale: Muundo wa Kiswahili unaeleza kwa kawaida kwamba Yahweh hakumwondolea bwana huyo fadhili na uaminifu wake, huku ukihifadhi maana ya uaminifu wa kudumu katika jozi חֶסֶד וֶאֱמֶת.
- source_word: אָנֹכִי
  choice: Nami
  rationale: Kiambishi hiki kinadumisha msisitizo wa kiwakilishi cha Kiebrania kilichotangulizwa na kuunganisha kwa kawaida ushuhuda wa msemaji na sifa iliyotangulia.
- source_word: בַּדֶּרֶךְ נָחַנִי
  choice: ameniongoza njiani
  rationale: Tafsiri ya kawaida ya Kiswahili inayoonyesha uongozi wa Yahweh wakati wa safari.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: mpaka nyumbani kwa ndugu wa bwana wangu
  rationale: “Nyumbani kwa” huonyesha mahali alipofikishwa kwa Kiswahili cha kawaida; “ndugu” huhifadhi neno la undugu huku muktadha ukieleza kuwa ni jamaa wa ukoo wa Abrahamu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulitaja kama Yahweh kunalitofautisha na cheo.
- issue: Maana ya חֶסֶד וֶאֱמֶת
  choice: upendo wake thabiti na uaminifu wake
  alternative: fadhili zake na kweli yake
  rationale: Jozi hii katika uhusiano wa kibinafsi huelekea kuonyesha upendo wa kudumu na kutegemeka. Tafsiri iliyochaguliwa ni wazi kwa wasomaji wa sasa bila kuingiza kwa lazima neno “agano,” ambalo halipo moja kwa moja katika mstari.
- issue: Maana ya אֲחֵי
  choice: ndugu
  alternative: jamaa
  rationale: Neno la Kiebrania ni “ndugu,” lakini hapa linaweza kurejelea wanaume wa ukoo au jamaa za Abrahamu; neno la msingi limehifadhiwa na upana wa muktadha umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “hajaacha kumwonyesha” badala ya kufuata kihalisi kihusishi cha Kiebrania, ili kutoa maana ya kawaida na wazi ya kutomwondolea bwana huyo upendo na uaminifu. Jina Yahweh na msisitizo wa “Nami” vimehifadhiwa.
