lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Kisha akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida na unajumuisha maana ya ‘akamwambia yeye’ bila kurudia kiwakilishi kisicho cha lazima.
- source_word: גַּם ... גַּם ... גַּם
  choice: '... na ... na pia'
  rationale: Unahifadhi mkusanyiko wa vitu unaosisitizwa na marudio ya גַּם, huku ukitoa sentensi ya asili katika Kiswahili.
- source_word: תֶּבֶן
  choice: majani makavu
  rationale: Katika muktadha wa mifugo, usemi huu unaeleweka kwa urahisi kama malighafi kavu kama nyasi au mabua; huepuka maana nyembamba isiyo hakika ya ‘nyasi’ pekee.
- source_word: מִסְפּוֹא
  choice: chakula cha mifugo
  rationale: Hurejelea chakula cha wanyama; tafsiri hii ni wazi na ya kawaida zaidi kuliko istilahi adimu.
- source_word: רַב עִמָּנוּ
  choice: tuna ... kingi
  rationale: Ingawa עִמָּנוּ ni ‘pamoja nasi,’ katika muktadha huu inaeleza kuwa vitu hivyo vinapatikana kwao; Kiswahili cha kawaida hutumia muundo wa umilikaji ‘tuna.’
- source_word: מָקוֹם לָלוּן
  choice: mahali pa kulala usiku
  rationale: Huhifadhi ujumla wa מָקוֹם na maana ya kitenzi לון ya kukaa au kulala usiku bila kudokeza lazima chumba maalumu.
