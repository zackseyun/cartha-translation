lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kiashiria hiki kinaingiza tukio kwa uhai na uharaka; “Tazama” ni cha kawaida, chenye heshima, na kinaendana na mtindo wa simulizi la kibiblia.
- source_word: נִצָּב עַל עֵין הַמָּיִם
  choice: nimesimama kando ya chemchemi ya maji
  rationale: Kitenzi kishirikishi kinaonyesha hali inayoendelea, na עֵין hapa ni chanzo au chemchemi ya maji, si kisima kwa lazima.
- source_word: וְהָיָה
  choice: Basi na iwe kwamba
  rationale: Katika muktadha huu wa ombi la ishara, usemi huu unaonyesha jambo linalotamaniwa litokee bila kulifanya kuwa taarifa ya uhakika.
- source_word: הָעַלְמָה
  choice: msichana
  rationale: Neno hili humaanisha mwanamke kijana wa umri wa kuolewa; “msichana” ni tafsiri ya asili na inayoeleweka, bila kulazimisha maana ya ubikira.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: atakayetoka kuteka maji
  rationale: Kauli hii inaeleza msichana anayetarajiwa kutoka ili kuchota maji; kutaja “maji” wazi kunafanya Kiswahili kiwe cha kawaida.
- source_word: הַשְׁקִינִי נָא מְעַט מַיִם מִכַּדֵּךְ
  choice: Tafadhali, niruhusu ninywe maji kidogo kutoka mtungini mwako
  rationale: הַשְׁקִינִי ni kausativi ya kumpa mtu anywe; muundo huu ni wa asili katika Kiswahili na נָא limetafsiriwa kwa ombi la adabu “Tafadhali.”
- source_word: כַּד
  choice: mtungi
  rationale: Neno hili linaashiria chombo cha kubebea maji; “mtungi” linafaa katika mazingira haya kuliko neno la jumla kama “chombo.”
theological_decisions:
- issue: Maana ya עַלְמָה
  choice: msichana
  alternative: bikira
  rationale: Neno la Kiebrania lenyewe humtaja mwanamke kijana wa umri wa kuolewa lakini halisemi wazi kwamba ni bikira. Tafsiri kuu haipaswi kuingiza dai pana zaidi ya ushahidi wa neno lenyewe; uwezekano huo umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo umeachwa wazi mwishoni kwa sababu sentensi ya masharti inaendelea katika mstari unaofuata.
