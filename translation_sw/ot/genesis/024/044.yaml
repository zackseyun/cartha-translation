  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: usemi wa mwanamke unaotazamiwa, msisitizo wa “pia,” kitendo cha kuteka maji kwa ajili ya ngamia, kauli ya utambulisho “huyo ndiye mwanamke,” na uteuzi wa Yahweh kwa ajili ya mwana wa bwana wa mtumishi. “Huyo ndiye” ni sahihi zaidi kuliko kuongeza kauli ya matamanio kama “na awe,” kwa kuwa הִוא הָאִשָּׁה ni kauli ya utambulisho.'
