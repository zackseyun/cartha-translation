base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: sw
  text: naye aniambie, “Wewe pia unywe, nami nitawatekea ngamia wako maji”—huyo ndiye mwanamke ambaye Yahweh amemteua[a] kwa ajili ya mwana wa bwana wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amemkusudia” au “amemchagulia.”
    reason: Kitenzi הֹכִיחַ kinaweza kuonyesha kuteua, kukusudia, au kumchagulia mtu katika muktadha huu.
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: naye aniambie
  rationale: Katika muktadha wa ishara anayoomba mtumishi, kauli hii ni sehemu ya hali inayotarajiwa; hali ya utegemezi katika Kiswahili huwasilisha vizuri maana hiyo kuliko wakati uliopita wa kawaida.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: Wewe pia unywe
  rationale: “Pia” huhifadhi mkazo wa גַּם pamoja na kiwakilishi אַתָּה, na “unywe” ni amri ya heshima inayosikika kwa kawaida katika Kiswahili.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: nami nitawatekea ngamia wako maji
  rationale: Kitenzi שׁאב humaanisha kuteka maji; kutaja “maji” wazi ni kawaida na kunathibitishwa na muktadha. Kiambishi cha ngeli katika “nitawatekea” kinarejelea ngamia.
- source_word: הִוא הָאִשָּׁה
  choice: huyo ndiye mwanamke
  rationale: Hii ni kauli ya kumtambulisha mwanamke. “Huyo ndiye” ni muundo wa kawaida wa Kiswahili unaohifadhi msisitizo wa utambulisho bila kumwita tayari “mke.”
- source_word: אֲשֶׁר הֹכִיחַ
  choice: ambaye ... amemteua
  rationale: Hiphil ya יכח hapa ina wazo la kuamua au kumteua mtu; “amemteua” huwasilisha uteuzi wa kimungu kwa lugha wazi huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limewasilishwa kama jina binafsi “Yahweh,” si kwa kubadilishwa na cheo.
- source_word: לְבֶן אֲדֹנִי
  choice: kwa ajili ya mwana wa bwana wangu
  rationale: 'Muundo huu unaonyesha uhusiano au kusudi: mwanamke aliyeteuliwa kwa ajili ya mwana wa bwana wa mtumishi.'
theological_decisions:
- issue: Nguvu ya הִוא הָאִשָּׁה katika muktadha wa ombi
  choice: huyo ndiye mwanamke
  alternative: huyo na awe mwanamke
  rationale: Kisintaksia, Kiebrania kina kauli ya utambulisho bila kitenzi cha amri. Ingawa muktadha mzima ni wa ombi la ishara, tafsiri ya kauli elekezi huhifadhi muundo halisi na haiongezi wazi nguvu ya amri ambayo haijawekwa wazi hapa.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Aya inatumia jina binafsi la Mungu, kwa hiyo limetoholewa badala ya kubadilishwa na cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Bwana wangu” hapa ni cheo cha mkuu wa mtumishi, si jina la Mungu. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
