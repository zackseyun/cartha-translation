base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: sw
  text: Ndipo Rebeka na wasichana wake[a] waliinuka, wakapanda ngamia, wakamfuata yule mtu. Mtumishi akamchukua Rebeka, akaenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanawake vijana waliomhudumia.” Neno la Kiebrania humaanisha wanawake vijana; katika muktadha huenda walikuwa wahudumu wa kike wa Rebeka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: akainuka
  rationale: Kitenzi קום kimsingi humaanisha kuinuka au kusimama. “Akainuka” kinahifadhi maana ya moja kwa moja na mfuatano wa simulizi bila kukitafsiri mapema kuwa kuanza safari.
- source_word: נַעֲרֹתֶיהָ
  choice: wasichana wake[a]
  rationale: נַעֲרָה humaanisha mwanamke kijana; katika muktadha hawa huenda walikuwa wahudumu wa kike wa Rebeka. “Wasichana wake” kinahifadhi kiini cha umri na jinsia bila kulazimisha hadhi ya utumishi.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: Wakapanda ngamia
  rationale: רכב pamoja na עַל hapa inaeleza kupanda wanyama kwa ajili ya safari. Kiswahili cha kawaida husema “kupanda ngamia,” ambacho kinafaa kwa tendo la kuanza safari.
- source_word: אַחֲרֵי הָאִישׁ
  choice: wakamfuata yule mtu
  rationale: אַחֲרֵי katika muktadha wa safari humaanisha kwenda nyuma ya mtu au kumfuata. “Wakamfuata” ni cha asili katika Kiswahili na kinaonyesha kuwa mtu huyo aliwaongoza.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Ingawa mtu anayetajwa ni mtumishi wa Abrahamu, Kiebrania hapa kinasema “mtu.” “Yule mtu” kinadumisha namna hiyo ya usimulizi na rejeo lililotangulia.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: mtumishi akamchukua Rebeka
  rationale: לקח humaanisha kuchukua. Katika muktadha ina wazo la kuondoka naye au kumsindikiza, lakini “akamchukua Rebeka” linabaki karibu na tamko la chanzo huku muktadha ukifafanua safari.
- source_word: הָעֶבֶד
  choice: mtumishi
  rationale: עֶבֶד linaweza kumaanisha mtumwa au mtumishi. Hapa anatajwa wakala wa nyumbani aliyeaminiwa na Abrahamu; “mtumishi” linafaa zaidi katika muktadha bila kuamua zaidi ya ushahidi uliopo.
- source_word: וַיֵּלַךְ
  choice: akaenda zake
  rationale: הלך humaanisha kwenda. “Akaenda zake” ni usemi wa kawaida wa Kiswahili unaoonyesha kuendelea na safari bila kuongeza lengo jipya.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa heshima na unaoeleweka kwa msomaji wa kawaida. Viunganishi vya mfululizo “aka-/waka-” vinawakilisha vizuri mfuatano wa vitenzi vya simulizi vya Kiebrania.
