base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: sw
  text: Yule msichana alikuwa mrembo sana, bikira; hakuna mwanamume aliyekuwa amemjua[a]. Akashuka hadi kwenye chemchemi[b], akajaza mtungi wake, kisha akapanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “hakuna mwanamume aliyekuwa amemjua.” Hapa “kumjua” ni njia ya staha ya kusema kwamba hakuwahi kuwa na uhusiano wa kingono na mwanamume.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania humaanisha “chemchemi” au chanzo cha maji; baadhi ya tafsiri hutumia “kisima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: yule msichana
  rationale: Neno נַעֲרָה humaanisha msichana au mwanamke kijana, mara nyingi mwenye umri wa kuolewa. “Msichana” ni neno la kawaida na la sasa katika Kiswahili, nalo linafaa katika muktadha huu.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: mzuri sana wa sura
  rationale: Kirai hiki kinaeleza uzuri wa kuonekana na kinasisitizwa na מְאֹד, “sana.” “Mzuri sana wa sura” ni cha asili katika Kiswahili na kinadumisha mkazo wa Kiebrania juu ya mwonekano.
- source_word: בְּתוּלָה
  choice: bikira
  rationale: בְּתוּלָה kwa kawaida humaanisha mwanamke ambaye hajawahi kushiriki ngono. “Bikira” ni tafsiri ya moja kwa moja, fupi, na inayofaa katika simulizi hili.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: hakuna mwanamume aliyekuwa amemjua
  rationale: Kitenzi יָדַע, “kujua,” kimetumiwa hapa kwa staha kurejelea uhusiano wa kingono. Tafsiri hii inadumisha sitiari na staha ya Kiebrania; tanbihi inaeleza maana yake.
- source_word: הָעַיְנָה
  choice: mpaka kwenye chemchemi
  rationale: עַיִן hapa ni chanzo cha maji au chemchemi, si lazima kisima kilichochimbwa. Kiambishi cha mwelekeo katika Kiebrania kinaonyeshwa kwa “mpaka kwenye.”
- source_word: כַדָּהּ
  choice: mtungi wake
  rationale: כַּד ni chombo cha kuchotea na kubebea maji. “Mtungi” ni neno la kawaida na linalofaa kwa chombo hicho katika Kiswahili cha Afrika Mashariki.
- source_word: וַתָּעַל
  choice: kisha akapanda
  rationale: עָלָה humaanisha kupanda au kwenda juu. “Akapanda” inadumisha utofautishaji wa mahali baada ya yeye kushuka kwenda kwenye chemchemi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi “akashuka … akajaza … akapanda” unadumisha mwendo wa simulizi la Kiebrania bila kuongeza kiunganishi cha wakati kisichokuwapo katika chanzo.
