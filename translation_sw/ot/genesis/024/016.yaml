  source_fidelity: 'The draft accurately renders the principal Hebrew elements: נערה as a young female, exceptional beauty, בתולה, the restrained ידע euphemism, descent to a spring, filling her water jar, and ascent. “Mpaka kwenye” is not the best rendering of the Hebrew directional ending; it can suggest a limiting sense (“as far as”) beyond the simple movement toward the spring.'
