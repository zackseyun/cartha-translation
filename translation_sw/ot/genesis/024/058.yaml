  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: sw
  text: Basi wakamwita Rebeka, wakamwambia, “Je, utaenda pamoja na mtu huyu?” Akasema, “Nitaenda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: wakamwita Rebeka
  rationale: Kitenzi קרא hapa ni kumwita mtu aje kwenye mazungumzo. “Wakamwita” ni Kiswahili cha kawaida na hakiongezi ukali wa maana ya kumwamuru afike.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: wakamwuliza
  rationale: Ingawa Kiebrania hutumia kitenzi cha kawaida cha kusema, maneno yanayofuata ni swali la moja kwa moja; “wakamwuliza” ni usemi wa asili katika Kiswahili na huhifadhi dhima ya kauli hiyo.
- source_word: הֲתֵלְכִי
  choice: utaenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda. “Utaenda” hudumisha swali la moja kwa moja bila kuongeza kwa wazi wazo la kuwa tayari.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: pamoja na mtu huyu
  rationale: אִישׁ humaanisha “mtu/mwanamume.” Chanzo hakitumii “mtumishi” hapa, kwa hiyo “mtu huyu” hudumisha namna mhusika anavyotajwa.
- source_word: וַתֹּאמֶר
  choice: akajibu
  rationale: Kiebrania hutumia “akasema,” lakini katika mfuatano huu kauli yake ni jibu la swali; “akajibu” ni Kiswahili cha kawaida na sahihi kimuktadha.
- source_word: אֵלֵךְ
  choice: Nitaenda
  rationale: Hii ni kauli fupi ya nafsi ya kwanza kutoka הלך. “Nitaenda” huwasilisha moja kwa moja uamuzi wa Rebeka bila kuongeza maelezo.
