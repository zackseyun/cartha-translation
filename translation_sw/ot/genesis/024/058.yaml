translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo wa masimulizi wenye viambishi vya mfululizo umehifadhiwa kwa namna ya asili; “pamoja na” imetumiwa ili swali lisikike kwa ufasaha.
