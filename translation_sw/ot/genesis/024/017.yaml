translation:
  language: sw
  text: Mtumishi akakimbia kwenda kumlaki, akasema[a], “Tafadhali, ninyweshe maji kidogo kutoka katika mtungi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tafadhali, nipe maji kidogo ninywe kutoka katika mtungi wako.” Amri ya Kiebrania inaweza kutafsiriwa “ninyweshe” au “nipe ninywe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: akakimbia
  rationale: Kitenzi רוץ katika usimulizi kina maana ya kukimbia; ‘akakimbia’ ni Kiswahili cha kawaida chenye kuonyesha haraka ya tendo.
- source_word: הָעֶבֶד
  choice: Mtumishi
  rationale: עֶבֶד yaweza kumaanisha mtumishi au mtumwa. Katika muktadha huu ni wakala wa nyumbani aliyeaminiwa na Abrahamu, hivyo ‘mtumishi’ inafaa bila kusisitiza hali ya utumwa ambayo mstari huu hauitangulizi.
- source_word: לִקְרָאתָהּ
  choice: kwenda kumlaki
  rationale: Muundo huu unaonyesha mwendo wa kwenda kukutana na mtu. ‘Kumlaki’ ni neno la heshima na la kawaida katika usimulizi wa Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Huu ni utangulizi wa kawaida wa maneno ya moja kwa moja katika usimulizi; ‘akasema’ huendeleza mfuatano wa matendo kwa ufasaha.
- source_word: הַגְמִיאִינִי
  choice: nipe ... ninywe
  rationale: Hiphil ya גמא pamoja na kiambishi cha nafsi ya kwanza inaweza kumaanisha ‘nipe ninywe’ au ‘niruhusu ninywe.’ Kiswahili ‘nipe ... ninywe’ kinaeleza ombi la kupewa maji kwa njia ya asili.
- source_word: נָא
  choice: Tafadhali
  rationale: נָא huonyesha ombi la adabu au kusihi; ‘tafadhali’ ndiyo tamko la kawaida la Kiswahili.
- source_word: מְעַט מַיִם
  choice: maji kidogo
  rationale: Kirai hiki humaanisha kiasi kidogo cha maji na huhifadhi unyenyekevu wa ombi.
- source_word: מִכַּדֵּךְ
  choice: kutoka katika mtungi wako
  rationale: כַּד ni chombo cha kuchotea au kubebea maji. ‘Mtungi’ ni neno linaloeleweka vizuri katika Kiswahili cha Afrika Mashariki; ‘wako’ huhifadhi kiambishi cha nafsi ya pili ya kike katika maana, ingawa Kiswahili hakionyeshi jinsia hapa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa usimulizi wenye ‘aka-’ umetumiwa ili kuhifadhi mfuatano na kasi ya matendo. ‘Kumlaki’ na ‘mtungi’ ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kuwa ya kimadhehebu.
