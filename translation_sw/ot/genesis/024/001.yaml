  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: sw
  text: Abrahamu alikuwa mzee[a], amesonga sana katika umri, na Yahweh alikuwa amembariki Abrahamu katika mambo yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “ameingia katika siku,” nahau inayomaanisha kuwa amesonga sana katika umri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abrahamu
  rationale: Waw inaunganisha simulizi, lakini Kiswahili hakihitaji kiunganishi cha mwanzo hapa; kuanza moja kwa moja na jina ni kwa kawaida na hakiongezi neno la wakati lisilokuwapo.
- source_word: זָקֵן
  choice: alikuwa mzee
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya Abrahamu ya kuwa na umri mkubwa.
- source_word: בָּא בַּ/יָּמִים
  choice: amesonga sana katika umri
  rationale: Nahau hiyo, kwa neno moja moja ‘ameingia katika siku,’ humaanisha kufikia umri mkubwa; tafsiri hii inabaki ya heshima na inaeleweka kwa urahisi.
- source_word: וַֽ/יהוָה
  choice: naye Yahweh
  rationale: Kiunganishi kinaendeleza sentensi kwa kawaida, na jina la Mungu יהוה linawakilishwa wazi kama Yahweh.
- source_word: בֵּרַךְ
  choice: alikuwa amembariki
  rationale: Kauli hii inaonyesha baraka iliyokuwa tayari imetolewa na ambayo ndiyo hali ya msingi wa simulizi wakati huo.
- source_word: בַּ/כֹּל
  choice: katika kila jambo
  rationale: Huwasilisha upana wa baraka bila kuifungia kwenye mali pekee.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina maalumu la Mungu; ‘Yahweh’ hulihifadhi wazi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Rudio la ‘Abrahamu’ limehifadhiwa kwa ukaribu na muundo wa Kiebrania.
