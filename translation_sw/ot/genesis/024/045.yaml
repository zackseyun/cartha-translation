  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: sw
  text: Kabla sijamaliza kusema moyoni mwangu[a], tazama, Rebeka akatoka akiwa na mtungi wake begani. Akashuka kwenda kwenye chemchemi[b] na kuteka maji. Kisha nikamwambia, “Tafadhali, nipe maji ninywe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kusema na moyo wangu,” nahau inayoweza kumaanisha kusema kimoyomoyo au kusali kwa kimya.'
    reason: lexical_alternative
  - marker: b
    text: Au “chanzo cha maji”; neno la Kiebrania linamaanisha chemchemi, si neno la kawaida linalotumiwa kumaanisha kisima.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: Kabla sijamaliza
  rationale: Muundo huu unaonyesha kwamba kitendo cha kusema kilikuwa bado hakijakamilika wakati Rebeka alipotokea, na ni wa kawaida katika Kiswahili.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: kusema moyoni mwangu
  rationale: Huhifadhi taswira ya Kiebrania ya kusema kwa moyo huku ukieleweka kwa kawaida kuwa usemi wa ndani au sala ya kimya.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linadumisha msisitizo wa tukio la ghafla na uwasilishaji hai wa simulizi katika lugha yenye hadhi.
- source_word: רִבְקָה
  choice: Rebeka
  rationale: Hili ndilo umbo la jina lililozoeleka katika Biblia za Kiswahili.
- source_word: יֹצֵאת
  choice: akatoka
  rationale: Kitenzi hiki kinawasilisha kwa uwazi tendo linaloonekana mara moja katika mfululizo wa simulizi.
- source_word: כַדָּהּ
  choice: mtungi wake
  rationale: כד ni chombo cha kutekea na kubebea maji; ‘mtungi’ ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: עַל־שִׁכְמָהּ
  choice: begani
  rationale: Ni tafsiri fupi na ya kawaida ya mahali mtungi ulipobebwa.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: Akashuka kwenda kwenye chemchemi
  rationale: עַיִן hapa ni chemchemi ya asili, tofauti na neno la kawaida la Kiebrania linalomaanisha kisima; ‘akashuka’ huhifadhi mwendo unaotajwa katika chanzo.
- source_word: וַתִּשְׁאָב
  choice: na kuteka maji
  rationale: Kitenzi kinamaanisha kuteka maji; kutaja ‘maji’ kunafanya usemi uwe kamili na wa kawaida kwa Kiswahili.
- source_word: הַשְׁקִינִי נָא
  choice: Tafadhali, nipe maji ninywe
  rationale: Huwakilisha ombi la heshima lililo katika נָא na maana ya kausativi ya שׁקה, yaani kumpa mtu kitu anywe.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa kisasa na wenye hadhi. ‘Tazama’ limehifadhiwa ili kuonyesha msisitizo wa ghafla wa וְהִנֵּה, na ‘chemchemi’ limetumiwa badala ya ‘kisima’ ili kufuata kwa usahihi tofauti ya kileksia katika Kiebrania.
