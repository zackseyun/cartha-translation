  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: sw
  text: Rebeka akainua macho yake, akamwona Isaka, kisha akashuka kutoka juu ya ngamia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “akaanguka kutoka juu ya ngamia.” Huenda hapa Kiebrania kinatumia “akaanguka” kwa kinahau kumaanisha kushuka kutoka kwa ngamia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ
  choice: akainua macho yake
  rationale: Huhifadhi taswira ya nahau ya Kiebrania kwa lugha ya Kiswahili inayoeleweka; ‘akatazama juu’ lingeweza kueleza mwelekeo ambao muktadha haulazimishi.
- source_word: וַתֵּרֶא
  choice: akamwona
  rationale: Kitenzi ראה hapa kina maana ya kawaida ya kuona, na kiambishi cha mtendwa kinafaa kwa Isaka ambaye ni mtu.
- source_word: אֶת יִצְחָק
  choice: Isaka
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: akashuka kutoka juu ya ngamia
  rationale: Ingawa נפל kwa kawaida ni ‘anguka,’ hapa yaelekea imetumiwa kinahau kumaanisha kushuka kutoka kwa mnyama. Tafsiri hii huepuka kudokeza ajali huku ikihifadhi wazo la kutoka juu ya ngamia.
