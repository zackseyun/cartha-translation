  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: sw
  text: Bali utaenda kwa nyumba ya baba yangu na kwa ukoo wangu[a], ukamchukulie mwanangu mke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa yangu” au “familia yangu kubwa.” Neno la Kiebrania linamaanisha kundi pana la watu wa familia moja, si watu wa kaya moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Bali
  rationale: Katika muktadha huu wa kiapo, kirai hiki kinaonyesha tofauti na katazo lililotangulia, si sharti la kawaida. “Bali” huwasilisha ugeuzaji huo kwa Kiswahili cha kawaida bila kuongeza msisitizo usio wa lazima.
- source_word: בֵּית אָבִי
  choice: nyumba ya baba yangu
  rationale: Huhifadhi picha ya Kiebrania ya “nyumba ya baba,” ambayo katika muktadha inaweza kujumuisha kaya au jamaa ya upande wa baba.
- source_word: תֵּלֵךְ
  choice: utaenda
  rationale: Wakati ujao wa Kiswahili katika agizo hili una nguvu ya wajibu kulingana na kauli ya kiapo, huku ukibaki wa asili na wenye heshima.
- source_word: מִשְׁפַּחְתִּי
  choice: ukoo wangu
  rationale: Neno hili linamaanisha kundi pana la watu wenye uhusiano wa kifamilia, si familia ya nyumbani pekee. “Ukoo” huonyesha maana hiyo vizuri katika Kiswahili cha Afrika Mashariki.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: ukamchukulie mwanangu mke
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kusudi la kumtafutia au kumletea mwana mke, huku ukidumisha kitenzi cha Kiebrania “chukua” na maana ya ל ya manufaa.
