  text: bali uende katika nchi yangu na kwa jamaa zangu[a], ukamchukulie mwanangu Isaka mke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na mahali nilipozaliwa”; neno la Kiebrania linaweza kumaanisha mahali mtu alikotoka au kundi la jamaa zake. Muktadha hapa unapendelea maana ya jamaa.
