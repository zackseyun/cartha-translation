lexical_decisions:
- source_word: כִּי
  choice: bali
  rationale: Katika muktadha huu chembe hii inaleta utofauti na katazo la mstari uliotangulia la kutomchukulia Isaka mke kutoka kwa Wakanaani.
- source_word: אֶל אַרְצִי
  choice: katika nchi yangu
  rationale: Neno אֶרֶץ linamaanisha nchi au eneo; “nchi yangu” ni la kawaida na halidokezi lazima taifa la kisasa.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: na kwa jamaa zangu
  rationale: Neno מוֹלֶדֶת linaweza kumaanisha ukoo/jamaa au mahali pa kuzaliwa. Muktadha wa kutafutiwa mke kutoka kwa watu wa Abrahamu unapendelea maana ya jamaa.
- source_word: תֵּלֵךְ
  choice: uende
  rationale: Umbo hili lina nguvu ya agizo katika muktadha wa kiapo; hali ya utegemezi ya Kiswahili “uende” huwasilisha agizo hilo kwa kawaida.
- source_word: וְלָקַחְתָּ
  choice: ukamchukulie
  rationale: Kitenzi לקח ni “chukua”; katika muktadha wa ndoa na pamoja na אִשָּׁה, “kumchukulia mtu mke” ni usemi wa kawaida unaoonyesha kusudi na mnufaika.
- source_word: אִשָּׁה
  choice: mke
  rationale: Ingawa neno hili linaweza kumaanisha mwanamke au mke, muktadha wa ndoa unahitaji “mke.”
- source_word: לִבְנִי לְיִצְחָק
  choice: mwanangu Isaka
  rationale: Virai hivi vinamtaja Isaka kwa apposition kuwa ndiye mwana anayelengwa. Kiswahili cha kawaida hakihitaji kurudia kihusishi.
