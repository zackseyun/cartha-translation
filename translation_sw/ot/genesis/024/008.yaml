  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: sw
  text: Lakini ikiwa mwanamke huyo hataki kukufuata[a], utakuwa huru kutokana na kiapo changu hiki[b]. Lakini tu, usimrudishe mwanangu huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenda nawe” au “kwenda nyuma yako”; neno kwa neno, “kwenda baada yako.”
