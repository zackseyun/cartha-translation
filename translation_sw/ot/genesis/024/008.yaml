    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaonyesha sharti lenye utofauti na agizo lililotangulia; ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: לֹא תֹאבֶה
  choice: hataki
  rationale: Kitenzi kinaonyesha kutokuwa tayari au kutokubali, bila kulazimisha maana kali zaidi ya ukaidi.
- source_word: הָאִשָּׁה
  choice: huyo mwanamke
  rationale: Anatajwa kama mwanamke ambaye bado hajawa mke wa Isaka; kiwakilishi cha kuonyesha kinatiririka kawaida katika muktadha.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: kufuatana nawe
  rationale: Katika muktadha wa safari, usemi huu unaeleza kwenda pamoja na mtumishi huku ukihifadhi wazo la kumfuata; tafsiri halisi zaidi imewekwa katika tanbihi.
- source_word: וְנִקִּיתָ
  choice: utafunguliwa
  rationale: Nifali ya נקה hapa ina maana ya kuondolewa wajibu unaofunga wa kiapo.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: kutoka katika kiapo changu hiki
  rationale: Inahifadhi kihusishi, umilikaji wa nafsi ya kwanza, na kiashiria זֹאת.
- source_word: רַק
  choice: Ila
  rationale: Inaweka mpaka mkali kwa kufunguliwa kwake kutoka katika kiapo, kwa lugha ya kawaida ya Kiswahili.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: usimrudishe mwanangu huko
  rationale: Hifili ya שוב ni ya kusababisha kurudi; 'usimrudishe' inahifadhi maana hiyo pamoja na katazo na mahali 'huko'.
