base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: sw
  text: Ikawa, mtumishi wa Abrahamu aliposikia maneno yao, akainama hadi ardhini mbele za Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasujudu hadi ardhini kwa Yahweh.” Kitenzi cha Kiebrania kinaweza kueleza kusujudu au kuinama kwa heshima ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ikawa ... alipo-
  rationale: Muundo huu unaendeleza simulizi na kuonyesha wakati wa tukio linalofuata bila kutafsiri nahau ya Kiebrania kwa namna ngumu.
- source_word: שָׁמַע
  choice: alisikia
  rationale: Kitenzi kinaeleza moja kwa moja kwamba mtumishi aliyasikia yaliyosemwa.
- source_word: עֶבֶד אַבְרָהָם
  choice: mtumishi wa Abrahamu
  rationale: Hili ni tamko la kawaida na la heshima katika Kiswahili; hapa simulizi linamtambulisha mwakilishi wa nyumba ya Abrahamu bila kusisitiza hadhi ya utumwa.
- source_word: דִּבְרֵיהֶם
  choice: maneno yao
  rationale: Linahifadhi maana halisi ya nomino ya Kiebrania na ni la kawaida katika Kiswahili.
- source_word: וַיִּשְׁתַּחוּ
  choice: akasujudu
  rationale: Kusujudu huonyesha kuinama chini kwa unyenyekevu na heshima, huku muktadha na kirai kinachofuata vikionyesha kitendo cha kimwili chenye mwelekeo wa ibada.
- source_word: אַרְצָה
  choice: mpaka nchi
  rationale: Umbo la Kiebrania linaonyesha mwelekeo wa kwenda chini; 'mpaka nchi' linaonyesha wazi kina cha kusujudu.
- source_word: לַיהוָה
  choice: mbele za Yahwe
  rationale: Katika muundo unaoandamana na kusujudu, 'mbele za' ni Kiswahili cha kawaida kinachoonyesha tendo la heshima lililoelekezwa kwa Yahwe.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; 'Yahwe' linawakilisha jina hilo badala ya kulibadili kuwa cheo.
- issue: Iwapo וַיִּשְׁתַּחוּ litafsiriwe wazi kuwa kuabudu
  choice: akasujudu mpaka nchi mbele za Yahwe
  alternative: akamwabudu Yahwe; akainama mpaka nchi mbele za Yahwe
  rationale: Kitenzi kinaweza kuwa na maana ya tendo la ibada, lakini אַרְצָה inasisitiza mkao wa mwili. Tafsiri inahifadhi kitendo hicho na uzito wake wa heshima bila kulazimisha maana pana ya 'kuabudu' pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ikawa ... aliposikia' hudumisha mwendo wa simulizi la Kiebrania; 'akasujudu mpaka nchi' ni wazi kwa msomaji wa kawaida na huhifadhi tendo la kimwili pamoja na heshima yake.
