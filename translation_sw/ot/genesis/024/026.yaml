  text: וַ/יִּקֹּ֣ד הָ/אִ֔ישׁ וַ/יִּשְׁתַּ֖חוּ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: sw
  text: Ndipo yule mtu akainama na kumsujudia Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akainama chini na kumwabudu Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: akainama
  rationale: Kitenzi קָדַד huonyesha kuinama chini; “akainama” ni Kiswahili cha kawaida kinachotofautisha tendo hili na kusujudu kunakofuata.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Kiebrania kinasema wazi “mtu,” ingawa katika muktadha huyo ni mtumishi wa Abrahamu. “Yule mtu” hudumisha neno la chanzo huku likirejelea mtu aliyekwisha tajwa.
- source_word: וַיִּשְׁתַּחוּ
  choice: kumsujudia
  rationale: Kitenzi hiki humaanisha kujishusha au kusujudu kwa heshima. Kwa kuwa tendo linaelekezwa kwa Yahwe, “kumsujudia” huhifadhi tendo la mwili pamoja na maana yake ya ibada bila kupunguza mojawapo.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya kawaida ya Kiswahili, “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu lenye herufi nne moja kwa moja; “Yahwe” huhifadhi jina hilo katika Kiswahili.
- issue: Iwapo וַיִּשְׁתַּחוּ itafsiriwe kama ibada au kama tendo la mwili
  choice: kumsujudia
  alternative: kumwabudu
  rationale: “Kumsujudia” huhifadhi picha halisi ya kujishusha mbele za Mungu na pia kwa kawaida huwasilisha heshima ya ibada katika muktadha huu. Hivyo haisuluhishi kimya kimya mvutano kati ya tendo la mwili na maana ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yule mtu” unadumisha הָאִישׁ badala ya kufafanua moja kwa moja kuwa ni mtumishi wa Abrahamu.
