  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: sw
  text: Akasema[a], “Ingia, wewe uliyebarikiwa na Yahweh. Kwa nini unasimama nje? Nimeitayarisha nyumba na mahali kwa ajili ya ngamia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbarikiwa wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; ‘Akasema’ ni njia ya kawaida na ya asili ya kusimulia tendo linalofuata katika Kiswahili.
- source_word: בּוֹא
  choice: Ingia
  rationale: Katika muktadha wa ukarimu, amri hii inamwalika mtu aingie nyumbani; ‘Ingia’ huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: בְּרוּךְ יְהוָה
  choice: wewe uliyebarikiwa na Yahweh
  rationale: Kirai hiki ni kishirikishi tendwa kinachotumiwa kama namna ya kumwita mtu. Tafsiri hii ni ya asili katika Kiswahili na inaacha wazi kuwa baraka inahusishwa na Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: Kwa nini unasimama nje?
  rationale: Inahifadhi swali la moja kwa moja pamoja na wazo la kusimama mahali palipo nje.
- source_word: פִּנִּיתִי
  choice: Nimeitayarisha
  rationale: Kitenzi kimsingi kina wazo la kuondoa vitu au kutoa nafasi; katika muktadha huu matokeo yake ni kuitayarisha nyumba kwa ajili ya mgeni.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya makao yanayotajwa hapa.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: na mahali kwa ajili ya ngamia
  rationale: Inahifadhi neno ‘mahali’ bila kuongeza kwamba ngamia walifungwa au kulazwa humo.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano katika בְּרוּךְ יְהוָה
  choice: uliyebarikiwa na Yahweh
  alternative: mbarikiwa wa Yahweh
  rationale: Kiebrania kinaweza kuwasilishwa kama aliyebarikiwa na Yahweh au aliye wa Yahweh kwa maana ya kubarikiwa. Maandishi makuu yanatumia Kiswahili cha asili kinachoelekea kwa wakala wa baraka, huku tanbihi ikihifadhi mbadala wa karibu zaidi na muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi ni wa moja kwa moja na unaofaa muktadha wa ukarimu; hakuna maelezo ya ziada kuhusu jinsi nyumba au mahali pa ngamia palivyotayarishwa.
