  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: sw
  text: Kisha mtumishi akachukua ngamia kumi miongoni mwa ngamia wa bwana wake, akaenda huku vitu vyote vya thamani vya bwana wake vikiwa mkononi mwake.[a] Akainuka, akaenda Aramu-Naharaimu,[b] kwenda mji wa Nahori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na vitu vyote vya thamani vya bwana wake vilikuwa chini ya mamlaka yake.” Nahau ya Kiebrania “mkononi mwake” inaweza kumaanisha kuwa navyo, kuvisimamia, au kuwa na mamlaka juu yake; huenda hapa inahusu zawadi za thamani alizobeba.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: Aram-naharaim; kwa kawaida limetafsiriwa “Mesopotamia” au “Aramu ya Mito Miwili.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: mtumishi
  rationale: Katika simulizi hili, עֶבֶד humaanisha mtu anayemtumikia mkuu wa nyumba. “Mtumishi” ni neno la kawaida na lenye heshima katika Kiswahili bila kuamua zaidi ya muktadha kama hali yake ilikuwa ya utumwa.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: ngamia kumi miongoni mwa ngamia wa bwana wake
  rationale: Neno מִן linaonyesha kuwa ngamia hao kumi walichaguliwa kutoka katika kundi la ngamia wa bwana wake. “Miongoni mwa” huweka wazi maana hiyo ya sehemu ya jumla.
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika mazingira ya nyumba, אָדוֹן ni mwenye mamlaka juu ya mtumishi. “Bwana wake” ni usemi wa asili katika Kiswahili na hapa si jina la Mungu.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: na mali yote njema ya bwana wake ilikuwa mkononi mwake
  rationale: טוּב hapa inaelekea kumaanisha vitu vyenye thamani au mali, si wema wa kidhahania. Tafsiri inadumisha taswira ya Kiebrania ya kuwa “mkononi mwake,” huku tanbihi ikieleza maana ya mamlaka au usimamizi inayoweza kuwamo katika nahau hiyo.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Akainuka, akaenda
  rationale: Muundo huu unadumisha vitenzi viwili na mwendo wa masimulizi ya Kiebrania. “Akainuka” pia inaweza kwa muktadha kumaanisha alianza safari.
- source_word: אֲרַם נַהֲרַיִם
  choice: Aramu-Naharaimu
  rationale: Jina la mahali limetoholewa kutoka umbo la Kiebrania badala ya kubadilishwa kuwa jina la jadi “Mesopotamia,” hivyo uhusiano wake na neno la mito unabaki bila kulazimisha tafsiri moja.
- source_word: עִיר נָחוֹר
  choice: mji wa Nahori
  rationale: Muundo huu unaweza kumaanisha mji uliohusishwa na Nahori, bila kudai kwamba yeye ndiye aliyeujenga au kwamba jina lenyewe la mji lilikuwa Nahori.
