  to: Kisha mtumishi akachukua ngamia kumi miongoni mwa ngamia wa bwana wake, akaenda huku vitu vyote vya thamani vya bwana wake vikiwa mkononi mwake.[a] Akainuka, akaenda Aramu-Naharaimu,[b] kwenda mji wa Nahori.
