  source_fidelity: 'Msingi wa tafsiri ni mwaminifu: mtumishi huchukua ngamia kumi kutoka kwa ngamia wa bwana wake, hubeba vitu vya thamani vya bwana wake, kisha huondoka kwenda Aramu-Naharaimu na mji wa Nahori. Hata hivyo, “mali yote njema” si usemi wa kawaida wala sahihi sana kwa כָּל־טוּב katika muktadha huu; “vitu vyote vya thamani” huwasilisha vizuri zaidi mali/zawadi zinazobebwa. Uhusiano wa “mkononi mwake” na vitu hivyo unapaswa kubaki wazi katika sentensi kuu.'
