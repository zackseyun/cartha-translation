  text: Abrahamu akamwambia, “Jihadhari usimrudishe mwanangu kule.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: akamwambia
  rationale: Muundo wa kawaida wa simulizi unaunganisha kitendo kinachofuata; kiambishi -mw- kinawasilisha אֵלָיו kwa Kiswahili cha kawaida na cha asili.
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Amri hii ya Kiebrania ina maana ya onyo la mtu kujilinda au kuwa mwangalifu; “Jihadhari” ni fupi, yenye hadhi, na inafikisha nguvu ya onyo.
- source_word: פֶּן
  choice: usi-
  rationale: פֶּן huanzisha onyo hasi; katika Kiswahili, utegemezi hasi wa nafsi ya pili “usi-” unatoa maana hiyo kwa njia ya asili.
- source_word: תָּשִׁיב
  choice: usimrudishe
  rationale: Hifili ya שוב ni ya kisababishi, ‘kusababisha arudi.’ “Kumrudisha” huhifadhi maana hiyo na pia haiondoi uwezekano wa kwenda naye au kumpeleka huko.
- source_word: אֶת־בְּנִי
  choice: mwanangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja imetafsiriwa moja kwa moja na kwa kawaida.
- source_word: שָׁמָּה
  choice: kule
  rationale: Kielezi hiki kinaelekeza mahali palipotajwa awali. “Kule” ni cha asili katika muktadha huu na huhifadhi wazo la kuelekea mahali hapo.
