base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: sw
  text: Bwana wangu akaniapisha, akisema, ‘Usimchukulie mwanangu mke kutoka miongoni mwa binti za Wakanaani, ambao ninaishi katika nchi yao[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kimazoea zaidi, ‘ambao ninaishi miongoni mwao.’ Kiebrania kinasema kihalisi, ‘Mkanaani, ambaye ninaishi katika nchi yake,’ kikitumia umoja wenye maana ya kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: akaniapisha
  rationale: Kauli ya kusababisha ya kitenzi שׁבע ina maana ya kumfanya mtu aape au kumweka chini ya kiapo. ‘Akaniapisha’ ni ya kawaida na inahifadhi uzito wa kiapo.
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Hapa mtumishi anamrejelea Abrahamu, mkuu wake wa kibinadamu, wala si Mungu. ‘Bwana wangu’ linaonyesha heshima na uhusiano wao kwa lugha ya simulizi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hili linaanzisha maneno ya moja kwa moja kwa njia ya kawaida katika simulizi la Kiswahili.
- source_word: לֹא תִקַּח
  choice: Usimchukulie
  rationale: Umbo hili lina nguvu ya katazo katika muktadha wa agizo lililothibitishwa kwa kiapo. Kiambishi ‘-li-’ kinaonyesha kwamba mke anachukuliwa kwa ajili ya mwana.
- source_word: אִשָּׁה
  choice: mke
  rationale: Katika muktadha wa kumwoa mtu, אִשָּׁה humaanisha ‘mke,’ si mwanamke kwa ujumla.
- source_word: לִבְנִי
  choice: mwanangu
  rationale: Kiebrania kinasema tu ‘kwa ajili ya mwanangu’; jina Isaka haliongezwi kutoka katika muktadha.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: kutoka miongoni mwa binti za Wakanaani
  rationale: Tafsiri hii inadumisha usemi wa kifamilia na kikabila wa Kiebrania huku ‘miongoni mwa’ ikifanya maana ya uchaguzi kutoka katika kundi iwe wazi kwa Kiswahili cha sasa.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: ambao ninaishi katika nchi yao
  rationale: Kiebrania hutumia umoja wa kijumla, ‘Mkanaani ... nchi yake.’ Kiswahili hutumia wingi kwa ufasaha zaidi, huku kikihifadhi mkazo wa asili juu ya nchi wanayoishi.
- source_word: יֹשֵׁב
  choice: ninaishi
  rationale: Kivumishi-tendo hiki kinaonyesha makao yanayoendelea; ‘ninaishi’ ni cha asili na cha sasa katika Kiswahili.
