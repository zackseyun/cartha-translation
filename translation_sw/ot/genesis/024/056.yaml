  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: sw
  text: Lakini akawaambia, “Msinicheleweshe, kwa kuwa Yahweh ameifanya safari yangu ifanikiwe.[a] Niacheni niende kwa bwana wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “njia yangu”; hapa inamaanisha safari au utume wa mtumishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Lakini akawaambia
  rationale: Muundo huu unaendeleza simulizi, huku ‘Lakini’ ukionyesha tofauti kati ya ombi lake na pendekezo la familia la kumchelewesha katika muktadha unaotangulia.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: Msinicheleweshe
  rationale: Kitenzi katika Hifili pamoja na אַל ni katazo la kumchelewesha au kumzuia mtu asiondoke; ‘msinicheleweshe’ ni wazi na karibu na maana ya Kiebrania.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetolewa kwa namna ya ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: ameifanikisha safari yangu
  rationale: Hifili ya צלח inaonyesha kwamba Yahweh ndiye aliyesababisha mafanikio. דֶּרֶךְ kwa msingi ni ‘njia,’ lakini hapa inahusu safari au jukumu la mtumishi.
- source_word: שַׁלְּחוּנִי
  choice: Niruhusuni niondoke
  rationale: Amri ya Pieli inaomba aachiliwe aondoke. Kiswahili hiki ni cha asili zaidi kuliko tafsiri ya neno kwa neno ‘nitumeni,’ ambayo ingeweza kudokeza kupewa kazi nyingine.
- source_word: וְאֵלְכָה
  choice: ili niende
  rationale: Umbo la kohortativi linaonyesha kusudi na nia ya msemaji baada ya wao kumruhusu kuondoka.
- source_word: לַאדֹנִי
  choice: kwa bwana wangu
  rationale: אֲדֹנִי hapa humrejelea Abrahamu, mkuu wa mtumishi, si Mungu; ‘bwana wangu’ ni usemi wa kawaida wa uhusiano huo katika Kiswahili cha kibiblia.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina binafsi la Mungu bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Msinicheleweshe’ na ‘Niruhusuni niondoke’ vinaeleweka kwa urahisi huku vikihifadhi mtiririko na kusudi la kauli ya Kiebrania.
