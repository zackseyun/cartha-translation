  text: Mtumishi akamsimulia Isaka mambo yote aliyokuwa amefanya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno yote” au “matukio yote”; neno la Kiebrania דְּבָרִים linaweza kumaanisha maneno, mambo, au matukio kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “mtumwa”; neno la Kiebrania עֶבֶד linaweza kumaanisha mtumishi au mtumwa, lakini hapa simulizi linasisitiza jukumu lake kuliko hali yake ya utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: akamsimulia
  rationale: Piel ya ספר hapa inaeleza kusimulia kwa utaratibu yaliyotokea katika safari na utume wake; “akamsimulia” ni ya kawaida na inafaa zaidi kuliko usemi wa jumla “akamwambia.”
- source_word: הָעֶבֶד
  choice: Mtumishi
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Katika muktadha huu jukumu lake katika nyumba na utume aliopewa ndilo linalosisitizwa, hivyo “mtumishi” linafaa katika matini kuu.
- source_word: לְיִצְחָק
  choice: Isaka
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: mambo yote
  rationale: דְּבָרִים linaweza kurejelea maneno, mambo, au matukio. Hapa linajumuisha yaliyohusu utume mzima wa mtumishi; “mambo yote” ni pana na ya asili katika Kiswahili.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyokuwa amefanya
  rationale: Kishazi hiki kinarejelea matendo yaliyokamilika kabla ya mtumishi kumsimulia Isaka; umbo hili linaweka wazi mpangilio huo wa matukio bila kubadili maana.
