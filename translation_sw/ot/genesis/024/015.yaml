  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: sw
  text: Ikawa, kabla hajamaliza kusema, tazama, Rebeka alikuwa akitoka, aliyekuwa amezaliwa na Bethueli, mwana wa Milka, mke wa Nahori, nduguye Abrahamu, akiwa na mtungi wake begani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutoa utangulizi wa tukio jipya katika simulizi kwa mtindo mfupi, wenye hadhi, na unaoeleweka katika Kiswahili cha Biblia.
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: kabla hajamaliza kusema
  rationale: Inadumisha maana ya kwamba tukio lilitokea kabla tendo la kusema halijakamilika.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Inahifadhi kazi ya neno la Kiebrania la kuelekeza usikivu na kuleta tukio mbele ya msomaji kwa uhai.
- source_word: יֹצֵאת
  choice: alikuwa akitoka
  rationale: Muundo endelevu unaakisi hali ya tendo lililokuwa likiendelea wakati huo, kama inavyoonyeshwa na umbo la participle.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: alikuwa amezaliwa kwa Bethueli
  rationale: Inahifadhi sauti ya kutendwa na uhusiano wa ukoo unaotajwa katika Kiebrania bila kugeuza kifungu kuwa kauli tendaji.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: mwana wa Milka, mke wa Nahori, ndugu ya Abrahamu
  rationale: 'Inadumisha mpangilio wa maelezo ya ukoo: Bethueli ni mwana wa Milka; Milka ni mke wa Nahori; Nahori ni ndugu ya Abrahamu.'
- source_word: כַּד
  choice: mtungi
  rationale: Ni neno la kawaida na linalofaa kwa chombo cha kuchotea au kubebea maji; maji hayajaongezwa kwa kuwa hayatajwi wazi katika mstari huu.
- source_word: עַל שִׁכְמָהּ
  choice: ulikuwa begani
  rationale: Ni uwasilishaji wa kawaida wa mahali pa mtungi, huku kiwakilishi katika 'mtungi wake' kikihifadhi umilikaji.
