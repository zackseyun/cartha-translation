  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: sw
  text: Sasa, ikiwa mko tayari kumtendea bwana wangu fadhili na uaminifu[a], niambieni; lakini ikiwa sivyo, niambieni, ili nigeukie upande wa kulia au wa kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “upendo wa kudumu na uaminifu.” Jozi hii ya maneno ya Kiebrania mara nyingi humaanisha fadhili za uaminifu na za kutegemewa katika mahusiano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa
  rationale: Inatanguliza hitimisho la moja kwa moja la hotuba; ‘Sasa’ ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: ikiwa mko tayari ... kumtendea
  rationale: Nahau ya Kiebrania inayounganisha wazo la ‘kuwamo kwenu’ na kitenzi endelevu inaonyesha nia au utayari wa kutenda katika hali inayofuata; tafsiri hii ni ya asili bila kuifanya kuwa amri.
- source_word: חֶסֶד וֶאֱמֶת
  choice: fadhili na uaminifu
  rationale: Jozi hii inaonyesha wema wa uhusiano unaothibitishwa kwa mwenendo wa kutegemewa. ‘Fadhili na uaminifu’ huhifadhi vipengele vyote viwili kwa lugha inayoeleweka.
- source_word: אֶת אֲדֹנִי
  choice: kumtendea bwana wangu
  rationale: Muundo wa Kiswahili huonyesha kwa kawaida anayepokea tendo kwa kitenzi ‘kumtendea’; ‘bwana wangu’ hapa ni Abrahamu, mkuu wa mtumishi.
- source_word: הַגִּידוּ לִי
  choice: niambieni
  rationale: Amri ya wingi inaomba jibu la moja kwa moja kutoka kwa jamaa waliozungumziwa; ‘niambieni’ huhifadhi wingi huo.
- source_word: וְאִם לֹא
  choice: lakini ikiwa sivyo
  rationale: Inaonyesha kwa uwazi upande wa pili wa sharti bila kuongeza maana.
- source_word: וְאֶפְנֶה
  choice: ili nigeukie
  rationale: Umbo la kohortativi linaonyesha hatua ambayo msemaji anakusudia kuchukua kutokana na jibu lao; ‘ili’ huhifadhi uhusiano wa kusudi au matokeo.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: upande wa kulia au wa kushoto
  rationale: Inahifadhi taswira halisi ya Kiebrania huku ikieleweka pia kuwa kuchagua njia nyingine.
