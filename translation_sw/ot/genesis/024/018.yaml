  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: sw
  text: Akasema, “Kunywa, bwana wangu[a].” Akaharakisha kuuteremsha mtungi wake mkononi mwake, akamnywesha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana.” Neno la Kiebrania kihalisi ni “bwana wangu,” likitumika hapa kama mwito wa heshima kwa mwanamume.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: Kunywa
  rationale: Ni amri ya nafsi ya pili, umoja, na inahifadhi mwaliko wa moja kwa moja na mfupi wa Kiebrania.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa ni namna ya heshima ya kumwita mwanamume, si jina la Mungu. Tafsiri hii inahifadhi maana halisi na unyenyekevu wa kijamii.
- source_word: וַתְמַהֵר
  choice: akafanya haraka
  rationale: Kitenzi kinaonyesha haraka; Kiswahili hiki ni cha kawaida na kinadumisha msisitizo wa kuitikia bila kukawia.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: akaushusha mtungi wake
  rationale: Inaonyesha kuuteremsha mtungi kutoka mahali alipokuwa ameubeba bila kuongeza habari ya bega ambayo haikutajwa katika mstari huu.
- source_word: עַל יָדָהּ
  choice: juu ya mkono wake
  rationale: Inafuata kwa karibu taswira halisi ya Kiebrania, huku ikiacha wazi namna hasa alivyouegemeza au kuushikilia mtungi.
- source_word: וַתַּשְׁקֵהוּ
  choice: akampa anywe
  rationale: Hifili ya שׁקה ina maana ya kumpa mtu kinywaji au kumwezesha anywe; usemi huu ni wa asili katika Kiswahili na unahifadhi maana ya kisababishi.
