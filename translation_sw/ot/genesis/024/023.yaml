translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maswali umefanywa wa asili kwa Kiswahili huku maelezo ya ukoo, kaya, wingi wa wasafiri, na kukaa usiku yakihifadhiwa.
