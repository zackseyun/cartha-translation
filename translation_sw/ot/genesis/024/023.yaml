  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: sw
  text: Akasema[a], “Wewe ni binti ya nani? Tafadhali niambie. Je, kuna nafasi katika nyumba ya baba yako ambamo tunaweza kulala usiku?”
  philosophy: optimal-equivalence
  footnotes:
