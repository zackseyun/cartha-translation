lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akauliza
  rationale: Ingawa kitenzi chenyewe ni ‘akasema,’ kinatanguliza swali la moja kwa moja; ‘akauliza’ ni Kiswahili cha kawaida kinachoonyesha kazi ya usemi bila kubadili maana.
- source_word: בַּת מִי אַתְּ
  choice: Wewe ni binti ya nani?
  rationale: Hii ni njia ya kawaida na iliyo wazi ya kuuliza utambulisho wa kifamilia kwa Kiswahili, huku ikihifadhi neno ‘binti.’
- source_word: הַגִּידִי נָא לִי
  choice: Tafadhali niambie
  rationale: ‘Tafadhali’ huwasilisha nguvu ya נָא ya kulainisha ombi, na ‘niambie’ huhifadhi anayelengwa na usemi.
- source_word: הֲיֵשׁ
  choice: Je, ... pana
  rationale: Muundo wa ‘Je’ pamoja na ‘pana’ huunda swali la kuwapo kwa kitu kwa Kiswahili sanifu na cha asili.
- source_word: בֵּית אָבִיךְ
  choice: katika nyumba ya baba yako
  rationale: ‘Nyumba ya baba yako’ huhifadhi wazo halisi la nyumba au kaya ya baba bila kulifanya kuwa ‘nyumbani’ tu.
- source_word: מָקוֹם
  choice: nafasi
  rationale: Katika muktadha wa ukarimu, ‘nafasi’ hueleza uwepo wa mahali pa kuwapa wageni malazi kwa lugha ya kawaida.
- source_word: לָנוּ
  choice: ya sisi
  rationale: Huhifadhi wingi wa nafsi ya kwanza, yaani mtumishi na wale walioandamana naye.
- source_word: לָלִין
  choice: kulala usiku
  rationale: Huwasilisha maana ya kukaa au kupata malazi kwa usiku mmoja kwa Kiswahili cha sasa kinachoeleweka kwa urahisi.
