lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Wakasema
  rationale: Wayyiqtol ya אמר inaendeleza simulizi; “Wakasema” ni mtiririko wa kawaida na wa asili katika Kiswahili.
- source_word: נִקְרָא
  choice: Tumwite
  rationale: Umbo la kohotativi linaonyesha pendekezo la pamoja, “tumwite”; ni la moja kwa moja kuliko “tumwitishe.”
- source_word: לַנַּעֲרָ
  choice: huyo msichana
  rationale: נַעֲרָה humaanisha mwanamke kijana; katika muktadha ni Rebeka aliye katika umri wa kuolewa. “Msichana” ni neno la kawaida la Kiswahili, na “huyo” humrejelea yule aliyetajwa katika mazungumzo.
- source_word: וְנִשְׁאֲלָה
  choice: tumuulize
  rationale: Kohotativi ya שאל inaendeleza pendekezo la pamoja; “tumuulize” ni tafsiri wazi na ya kawaida.
- source_word: אֶת פִּיהָ
  choice: mwenyewe
  rationale: Kirai halisi “kinywa chake” ni nahau inayosisitiza kusikia jibu lake moja kwa moja. “Tumuulize mwenyewe” huwasilisha maana hiyo kwa Kiswahili cha asili bila kuingiza maudhui ya jibu.
