  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: sw
  text: Akaharakisha, akamwaga maji ya mtungi wake katika hori[a], kisha akakimbia tena kisimani kuteka maji, akawatekea ngamia wake wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika chombo cha kunyweshea wanyama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: akafanya haraka
  rationale: Kitenzi kinaonyesha kutenda kwa haraka; usemi huu ni wa kawaida katika Kiswahili na unadumisha wazo la hatua ya upesi.
- source_word: וַתְּעַר כַּדָּהּ
  choice: akamimina maji yaliyokuwa mtungini mwake
  rationale: Kitenzi ערה kina maana ya kumwaga au kumimina yaliyomo, na כַּד ni mtungi wa kutekea maji. Kutaja maji yaliyo ndani kunafanya tendo lieleweke wazi kwa Kiswahili bila kubadili maana.
- source_word: הַשֹּׁקֶת
  choice: chombo cha kunyweshea wanyama
  rationale: Nomino hii ni chombo au hori ambamo wanyama huwekewa maji. Usemi huu unaeleweka kwa wasomaji wa maeneo mbalimbali ya Afrika Mashariki.
- source_word: וַתָּרָץ עוֹד
  choice: akakimbia tena
  rationale: עוֹד inaonyesha kurudia tendo, hivyo 'tena' inadumisha mfuatano wa simulizi.
- source_word: הַבְּאֵר
  choice: kisimani
  rationale: בְּאֵר kwa kawaida ni kisima, na hapa ndicho chanzo ambako maji yanatekwa.
- source_word: לִשְׁאֹב
  choice: kuteka maji
  rationale: Katika muktadha wa kisima, שׁאב humaanisha kuteka maji; huu ndio usemi wa kawaida wa Kiswahili.
- source_word: וַתִּשְׁאַב לְכָל גְּמַלָּיו
  choice: akawatekea ngamia wake wote
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba aliwatekea maji ngamia wote wa huyo mwanamume na unahifadhi jumla inayosisitizwa na כָּל.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Chombo cha kunyweshea wanyama' kimetumiwa katika maandishi kwa uelewekaji mpana, huku 'hori' ikihifadhiwa kama neno mbadala katika tanbihi.
