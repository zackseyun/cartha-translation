  text: Basi wakamuaga Rebeka, dada yao, aondoke pamoja na mnyonyeshaji wake[a], mtumishi wa Abrahamu, na watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mwanamke aliyemnyonyesha Rebeka alipokuwa mtoto.
