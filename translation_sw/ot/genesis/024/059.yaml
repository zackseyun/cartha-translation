lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: wakamruhusu ... aondoke
  rationale: Katika muktadha huu piel ya שׁלח inaonyesha kumwacha au kumruhusu mtu aende safari; usemi huu ni wa asili katika Kiswahili na unaonyesha kuondoka kwa Rebeka kwa ruhusa ya jamaa zake.
- source_word: רִבְקָה
  choice: Rebeka
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֲחֹתָם
  choice: dada yao
  rationale: Neno אָחוֹת hapa lina maana yake ya kawaida ya dada, kama muktadha wa familia unavyothibitisha.
- source_word: מֵנִקְתָּהּ
  choice: mlezi wake
  rationale: Umbo hili linalotokana na ינק linamaanisha mwanamke aliyemnyonyesha Rebeka na kuendelea kumlea; 'mlezi' ni la kawaida na lenye hadhi katika Kiswahili, huku maana mahususi ikihifadhiwa katika tanbihi.
- source_word: עֶבֶד אַבְרָהָם
  choice: mtumishi wa Abrahamu
  rationale: Muundo wa hali ya kutegemeana unatafsirika kwa kawaida hivi. Ingawa עֶבֶד inaweza kumaanisha mtumwa, hadhi ya utumwa si jambo linalosisitizwa katika muktadha huu.
- source_word: אֲנָשָׁיו
  choice: watu wake
  rationale: Neno אֲנָשִׁים humaanisha wanaume au watu; kiambishi kinamrejelea mtumishi wa Abrahamu. 'Watu wake' ni cha asili na hakibainishi bila ushahidi jukumu lao hususa.
