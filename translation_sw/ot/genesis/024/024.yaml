lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Akamwambia
  rationale: Kitenzi chenye kiambishi cha mtendewa kinaonyesha kwa kawaida na kwa ufupi kuwa mwanamke huyo alisema maneno hayo kwa mwanamume aliyekuwa akizungumza naye; kiambishi cha usimulizi kinaendeleza tukio linalofuata.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: Mimi ni binti ya Bethueli
  rationale: Muundo huu wa Kiswahili unawakilisha sentensi ya Kiebrania isiyo na kitenzi na unahifadhi mkazo wa kiwakilishi cha wazi אָנֹכִי (‘mimi’).
- source_word: בְּתוּאֵל
  choice: Bethueli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן מִלְכָּה
  choice: mwana ... Milka
  rationale: Uhusiano wa nasaba unaonyesha kwamba Bethueli ndiye mwana aliyemzaa Milka; neno ‘mwana’ linafaa kwa nasaba na jinsia yake.
- source_word: אֲשֶׁר יָלְדָה לְנָחוֹר
  choice: ambaye Milka alimzalia Nahori
  rationale: Kirai hiki kinaweka wazi kuwa kiwakilishi cha uhusiano kinamrejelea Bethueli na kwamba Milka ndiye aliyemzaa. Kitenzi ‘alimzalia’ kinahifadhi matumizi ya לְ katika kauli ya kuzaliwa inayomtambulisha Nahori kama baba.
- source_word: מִלְכָּה ... נָחוֹר
  choice: Milka ... Nahori
  rationale: Majina ya watu yametoholewa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili.
