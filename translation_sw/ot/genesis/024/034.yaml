lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Akasema
  rationale: Muundo wa waw-consecutive pamoja na אָמַר unaendeleza simulizi. “Akasema” ni mtiririko wa kawaida wa masimulizi ya Kiswahili bila kuipa kiunganishi maana ya ziada.
- source_word: עֶבֶד
  choice: mtumishi
  rationale: Neno עֶבֶד linaweza kumaanisha mtumishi au mtumwa. Katika utambulisho huu wa heshima ndani ya nyumba ya Abrahamu, “mtumishi” linafaa zaidi kwa muktadha, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili sanifu.
- source_word: אָנֹכִי
  choice: Mimi ni
  rationale: Kiwakilishi huru אָנֹכִי kinasisitiza utambulisho wa msemaji. “Mimi ni” kinahifadhi msisitizo huo kwa Kiswahili cha kawaida na cha asili.
