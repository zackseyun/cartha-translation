  text: Nami nikamwambia bwana wangu, “Labda mwanamke huyo hatanifuata.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: Nami nikamwambia
  rationale: Wayyiqtol ya אמר inaendeleza simulizi; “Nami nikamwambia” huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: אֶל אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa אָדוֹן inamtaja Abrahamu akiwa mkuu wa mtumishi, si Mungu. “Bwana wangu” ni namna ya kawaida na yenye heshima ya kueleza uhusiano huo.
- source_word: אֻלַי
  choice: Labda
  rationale: Neno hili huonyesha uwezekano au kutokuwa na uhakika; “labda” ni la kawaida na linaendana na muktadha.
- source_word: לֹא תֵלֵךְ ... אַחֲרָי
  choice: hatakubali kunifuata
  rationale: Muundo wa הלך pamoja na אַחֲרַי una maana ya kwenda nyuma ya msemaji au kumfuata. Katika muktadha wa ombi la kuandamana naye, “hatakubali kunifuata” ni Kiswahili cha asili kinachoonyesha uwezekano wa mwanamke kukataa kwenda naye.
- source_word: הָאִשָּׁה
  choice: mwanamke huyo
  rationale: Nomino ya Kiebrania ni “mwanamke,” si “mke” wala “msichana.” Kionyeshi “huyo” hufanya urejeleo maalumu kuwa wa kawaida katika Kiswahili bila kubadili hadhi yake.
