revisions:
- from: Ikawa[a], Labani alipoiona pete ya puani na vikuku mikononi mwa dada yake, na aliposikia maneno ya Rebeka dada yake akisema, “Hivi ndivyo yule mtu alivyoniambia,” akaenda kwa yule mtu. Kumbe, alikuwa amesimama karibu na ngamia kando ya chemchemi.[b]
  to: Ikawa kwamba Labani[a] alipoiona pete ya puani na vikuku mikononi mwa dada yake, na aliposikia maneno ambayo Rebeka, dada yake, alisema, “Hivi ndivyo mtu huyo alivyoniambia,” akaenda kwa mtu huyo. Kumbe, alikuwa amesimama karibu na ngamia wale kando ya chemchemi.[b]
  rationale: The revision removes an ambiguous participial construction by explicitly making Rebeka the speaker through a natural relative clause. It also places the contextual-clarification marker on “Labani,” which is the element the note explains, and uses consistent definite reference for the servant and camels. No theological or interpretive change is made.
