  text: וַ/יְהִ֣י כִּ/רְאֹ֣ת אֶת הַ/נֶּ֗זֶם וְֽ/אֶת הַ/צְּמִדִים֮ עַל יְדֵ֣י אֲחֹת/וֹ֒ וּ/כְ/שָׁמְע֗/וֹ אֶת דִּבְרֵ֞י רִבְקָ֤ה אֲחֹת/וֹ֙ לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר אֵלַ֖/י הָ/אִ֑ישׁ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וְ/הִנֵּ֛ה עֹמֵ֥ד עַל הַ/גְּמַלִּ֖ים עַל הָ/עָֽיִן׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: sw
  text: Ikawa kwamba Labani[a] alipoiona pete ya puani na vikuku mikononi mwa dada yake, na aliposikia maneno ambayo Rebeka, dada yake, alisema, “Hivi ndivyo mtu huyo alivyoniambia,” akaenda kwa mtu huyo. Kumbe, alikuwa amesimama karibu na ngamia wale kando ya chemchemi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Labani ndiye anayezungumziwa katika mstari huu; jina lake limetajwa katika mstari uliotangulia.
    reason: clarity
  - marker: b
    text: Au “kando ya kisima.” Neno la Kiebrania עַיִן kwa kawaida humaanisha chemchemi au chanzo cha maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiunganishi cha kawaida cha masimulizi ya Kiebrania kinachoendeleza tukio bila kutumia lugha nzito au ya kizamani.
- source_word: הַנֶּזֶם
  choice: pete ya puani
  rationale: Ingawa נֶזֶם inaweza kuwa pete kwa ujumla, Mwanzo 24:47 inaonyesha kuwa pambo hili liliwekwa puani mwa Rebeka.
- source_word: הַצְּמִדִים
  choice: vikuku
  rationale: Neno linaonyesha mapambo yaliyovaliwa kwenye mikono; “vikuku” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: עַל יְדֵי אֲחֹתוֹ
  choice: mikononi mwa dada yake
  rationale: Huhifadhi usemi halisi wa Kiebrania wa “mikono,” huku ukiendelea kueleweka kwa mapambo yanayovaliwa karibu na vifundo vya mikono.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: Hivi ndivyo yule mtu alivyoniambia
  rationale: Hutoa kwa Kiswahili cha kawaida nguvu ya כֹּה, “hivi/namna hii,” na kutambulisha yaliyosemwa.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: akaenda kwa yule mtu
  rationale: Kitenzi בוא pamoja na אֶל kinaweza kumaanisha kuja au kwenda kwa mtu; mtazamo wa simulizi hapa unaifanya “akaenda” iwe ya asili.
- source_word: וְהִנֵּה
  choice: Kumbe
  rationale: “Kumbe” huwasilisha ugunduzi wa ghafla na uzito wa uwasilishaji wa הִנֵּה kwa Kiswahili cha sasa bila kutumia “tazama” isiyo ya asili hapa.
- source_word: עֹמֵד עַל הַגְּמַלִּים
  choice: alikuwa amesimama karibu na ngamia
  rationale: Partisipio linaonyesha hali inayoendelea, na עַל hapa ina maana ya kuwa karibu au kando ya ngamia, si juu yao.
- source_word: עַל הָעָיִן
  choice: kando ya chemchemi
  rationale: עַיִן katika muktadha huu ni chanzo cha maji, hasa chemchemi; עַל inaonyesha eneo la karibu nayo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ulio wa sasa na wenye heshima. Jina “Labani” limewekwa wazi ili kuepuka kiwakilishi kisicho na mtangulizi ndani ya mstari huu pekee; tanbihi inaeleza nyongeza hiyo ya ufafanuzi.
