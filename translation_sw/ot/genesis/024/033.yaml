  verdict: revise
  source_fidelity: The opening passive accurately conveys that food was placed before the servant, and the final imperative is correctly rendered. However, “niliyokuja kusema” adds the specific idea of having come for the purpose of speaking, whereas the Hebrew says only “my words,” that is, his message or matter.
  naturalness: The draft is fluent Standard East African Swahili. “Mpaka nitakaposema maneno yangu” is also natural in a formal biblical narrative and retains the concise, deliberate tone of the speech.
  terminology: “Chakula,” “mbele yake,” “Sitakula,” and “Sema” are appropriate, clear choices. “Maneno yangu” preserves the Hebrew expression without imposing an interpretive expansion.
  issues:
  - severity: medium
    issue: “niliyokuja kusema” is interpretively narrower than the Hebrew “maneno yangu.”
    rationale: The source does not state that the servant came specifically to say these words; it states that he will not eat until he has spoken his words/message. The revised wording preserves that scope.
