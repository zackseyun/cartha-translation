base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: sw
  text: Chakula kikawekwa mbele yake ili ale, lakini akasema, “Sitakula mpaka nitakaposema maneno yangu.” Naye akasema, “Sema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם לְפָנָיו
  choice: Chakula kikawekwa mbele yake
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja wa kiume na nomino inayotajwa haipo wazi, muktadha unaonyesha kwamba kitu kilichowekwa mbele yake ni chakula. Muundo wa kutendwa katika Kiswahili haumtii mhusika asiyeelezwa na unasikika kwa kawaida.
- source_word: לֶאֱכֹל
  choice: ili ale
  rationale: Infinitivu yenye ל inaeleza kusudi. Kiswahili cha kawaida hutumia “ili ale” badala ya tafsiri ngumu zaidi “kwa ajili ya kula.”
- source_word: לֹא אֹכַל
  choice: Sitakula
  rationale: Kauli hii inaonyesha uamuzi thabiti wa kutokula kabla ya jambo jingine kutimizwa.
- source_word: עַד אִם
  choice: mpaka
  rationale: 'Katika muktadha huu kishazi kinaweka mpaka wa muda: hatakula kabla ya kusema alichokusudia.'
- source_word: דִּבַּרְתִּי דְּבָרָי
  choice: niseme niliyokuja kusema
  rationale: Kiebrania halisi ni “nimeyasema maneno yangu,” lakini Kiswahili cha sasa hueleza dhana hiyo kwa kawaida kama “niseme niliyokuja kusema.” Hii inahifadhi maana ya ujumbe au shughuli iliyomleta bila kuwa na usemi usio wa kawaida.
- source_word: דַּבֵּר
  choice: Sema
  rationale: Amri fupi “Sema” inalingana na ufupi na nguvu ya amri ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa asili na hadhi inayofaa simulizi la Biblia. Tafsiri inatanguliza uelewekevu wa kawaida huku ikihifadhi ufupi wa mazungumzo ya Kiebrania.
