base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: sw
  text: Isaka akamwingiza katika hema ya Sara, mama yake[a]. Kisha akamchukua Rebeka, naye akawa mke wake, na Isaka akampenda. Hivyo Isaka akafarijika baada ya kifo cha mama yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inaweza pia kutafsiriwa, “katika hema ya mama yake Sara.” Mpangilio wa maneno ya Kiebrania unaruhusu miundo yote miwili, bila tofauti ya msingi katika maana.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “baada ya mama yake.” Muktadha unaonyesha kwamba maana ni baada ya kufiwa na mama yake, ingawa neno “kifo” halijasemwa wazi katika Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: akamwingiza
  rationale: Hifili ya בוא pamoja na kiambishi cha nafsi ya kike ina maana ya kumsababisha aingie; “akamwingiza” ni ya asili katika Kiswahili na inaonyesha kuingia ndani.
- source_word: הָאֹהֱלָה
  choice: katika hema
  rationale: Herufi ya kuelekeza mwishoni mwa אֹהֶל inaonyesha mwendo wa kuelekea ndani ya hema; “katika hema” pamoja na kitenzi “akamwingiza” huwasilisha maana hiyo.
- source_word: שָׂרָה אִמּוֹ
  choice: ya Sara, mama yake
  rationale: Muundo huu unamtambulisha Sara kuwa mama yake Isaka na hema kuwa yake. Koma huonyesha ubainishaji huo kwa Kiswahili cha kawaida.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: akamchukua Rebeka
  rationale: לקח maana yake ya msingi ni “chukua.” Tafsiri hii inadumisha hatua tofauti kabla ya kauli inayofuata kwamba Rebeka akawa mke wake, badala ya kuziunganisha zote kuwa “akamwoa.”
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: naye akawa mke wake
  rationale: Nahau היה + ל + אשה huonyesha kuingia katika hali ya ndoa; “akawa mke wake” ni Kiswahili wazi na cha kawaida.
- source_word: וַיֶּאֱהָבֶהָ
  choice: Isaka akampenda
  rationale: אהב ni kitenzi cha kawaida cha kupenda. Kurudia jina “Isaka” kunaondoa utata wa kiwakilishi bila kubadili maana.
- source_word: וַיִּנָּחֵם
  choice: akafarijika
  rationale: Nifali ya נחם hapa inaonyesha kupokea faraja, si kutubu; “akafarijika” ni tafsiri fupi na ya asili.
- source_word: אַחֲרֵי אִמּוֹ
  choice: baada ya kifo cha mama yake
  rationale: Kihalisi ni “baada ya mama yake,” lakini katika muktadha inarejelea kipindi baada ya kufa kwa Sara. Kiswahili kinahitaji ufafanuzi huu ili sentensi iwe ya kawaida; tanbihi inahifadhi ufupi na utata wa Kiebrania.
theological_decisions:
- issue: Je, neno “kifo” liongezwe katika kauli ya mwisho?
  choice: “baada ya kifo cha mama yake” katika matini, pamoja na tanbihi
  alternative: “baada ya mama yake”
  rationale: Kifo cha Sara kinajulikana kutoka Mwanzo 23:2, na hiyo ndiyo maana ya muktadha; hata hivyo, kwa kuwa neno “kifo” halipo wazi katika Kiebrania, tanbihi inalinda uaminifu kwa umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. “Kisha” na “Hivyo” zinaonyesha maendeleo na matokeo ya simulizi; majina yametumiwa pale yanaposaidia kuondoa utata.
