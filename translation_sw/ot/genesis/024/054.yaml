  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: sw
  text: Kisha yeye na watu waliokuwa pamoja naye wakala na wakanywa, wakakaa huko usiku. Walipoamka asubuhi, akasema, “Niruhusuni niende kwa bwana wangu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania אֲדֹנִי linaweza kumaanisha “bwana wangu” katika maana ya “lord” au “master”; hapa linamrejelea Abrahamu, mwenye mamlaka juu ya mtumishi huyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: wakala na wakanywa
  rationale: Vitenzi viwili vya simulizi vimetafsiriwa kwa wakati uliopita wa mfululizo, kwa lugha fupi na ya kawaida inayohifadhi matendo yote mawili.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: yeye na watu waliokuwa pamoja naye
  rationale: Kiwakilishi cha Kiebrania kimehifadhiwa wazi, na kifungu kinaonyesha mtumishi pamoja na wasafiri wenzake bila kuongeza utambulisho usiotajwa katika mstari.
- source_word: וַיָּלִינוּ
  choice: wakakaa huko usiku
  rationale: Kitenzi לון/לין humaanisha kukaa mahali usiku. Tafsiri hii haiongezi dai kwamba walilala, ingawa hilo linawezekana katika muktadha.
- source_word: וַיָּק֣וּמוּ בַבֹּקֶר
  choice: Walipoamka asubuhi
  rationale: Hii ni kauli ya kawaida ya Kiswahili kwa kuinuka baada ya kukaa usiku na inaunganisha kwa kawaida tukio linalofuata.
- source_word: שַׁלְּחֻנִי
  choice: Niruhusuni niende
  rationale: Amri ya wingi pamoja na kiambishi cha nafsi ya kwanza inaomba mwenyeji amruhusu au amwache aondoke; muundo huu ni wa asili katika Kiswahili na huhifadhi wazo la kuagwa ili aende.
- source_word: לַאדֹנִי
  choice: kwa bwana wangu
  rationale: אָדוֹן hapa humrejelea Abrahamu kama mwenye mamlaka juu ya mtumishi. ‘Bwana wangu’ ni kauli ya heshima ya kawaida inayoweza kueleza uhusiano huo bila kuifanya kuwa cheo cha Mungu.
theological_decisions:
- issue: Maana ya אָדוֹן inapomrejelea Abrahamu
  choice: bwana wangu
  alternative: mkuu wangu
  rationale: Mrejelewa ni Abrahamu, aliye bwana wa mtumishi huyo, si Mungu. Herufi ndogo na muktadha huonyesha maana ya kibinadamu, huku tanbihi ikihifadhi uwezekano wa kutafsiri neno hilo kwa namna inayoangazia mamlaka yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi, wa sasa na wenye heshima. ‘Watu’ limetumiwa kwa kundi la wanaume katika muktadha huu kwa usemi wa kawaida, na ‘wakakaa huko usiku’ huepuka kuongeza kwamba walilala.
