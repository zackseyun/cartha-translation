  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: sw
  text: Yule mtu alikuwa akimtazama kwa makini, huku akiwa kimya[a], ili ajue kama Yahweh alikuwa ameifanikisha safari yake au la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule mtu alikuwa akimwangalia kwa mshangao, huku akiwa kimya, ili ajue kama Yahweh alikuwa ameifanikisha njia yake au la.”
    reason: Kitenzi מִשְׁתָּאֵה kinaweza kudokeza kutazama kwa mshangao, na דֶּרֶךְ linaweza kutafsiriwa moja kwa moja kuwa ‘njia.’
lexical_decisions:
- source_word: הָאִישׁ
  choice: Mtu huyo
  rationale: Nomino אִישׁ humaanisha ‘mtu’ au ‘mwanamume.’ Ingawa muktadha unamtambulisha kuwa mtumishi wa Abrahamu, tafsiri haijaingiza cheo hicho mahali ambapo Kiebrania kinasema ‘mtu.’
- source_word: מִשְׁתָּאֵה
  choice: alikuwa akimtazama kwa makini
  rationale: Umbo la participio linaonyesha tendo linaloendelea la kumwangalia kwa makini; huenda pia likawa na wazo la kustaajabu. Tafsiri hii inaeleza uchunguzi wa makini bila kulazimisha hisia ambayo haiko wazi kabisa.
- source_word: לָהּ
  choice: -mtazama
  rationale: Kihusishi chenye kiambishi cha nafsi kinaonyesha mwanamke ndiye aliyelengwa na mtazamo; Kiswahili cha kawaida huonyesha uhusiano huo ndani ya kitenzi ‘kumtazama.’
- source_word: מַחֲרִישׁ
  choice: akiwa kimya
  rationale: Participio hii humaanisha kunyamaza au kutosema. ‘Akiwa kimya’ ni Kiswahili cha kawaida kinachoonyesha hali iliyofuatana na kumtazama.
- source_word: לָדַעַת
  choice: ili ajue
  rationale: Infinitivo hii inaonyesha kusudi. ‘Ili ajue’ inahifadhi moja kwa moja maana hiyo.
- source_word: הַהִצְלִיחַ
  choice: alikuwa ameifanikisha
  rationale: Hifili ya צלח ina maana ya kusababisha jambo lifanikiwe. ‘Ameifanikisha’ inadumisha maana hiyo ya kisababishi, na ‘alikuwa’ huonyesha kuwa mafanikio yanayochunguzwa yalihusu safari iliyokuwa imefikia hatua hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: דַּרְכּוֹ
  choice: safari yake
  rationale: Ingawa דֶּרֶךְ kwa msingi ni ‘njia,’ katika simulizi hili linamaanisha safari au shughuli aliyotumwa kuitimiza. ‘Safari yake’ ni ya kawaida na inaafiki muktadha.
- source_word: אִם לֹא
  choice: au la
  rationale: Katika swali lisilo la moja kwa moja, muundo huu hukamilisha maana ya ‘kama ... au la’ kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kiebrania kinatumia moja kwa moja jina la Mungu lenye herufi nne, si cheo. ‘Yahwe’ huhifadhi jina hilo binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘alikuwa akimtazama’ unaonyesha tendo linaloendelea, huku ‘kwa makini’ ukihifadhi wazo la uchunguzi bila kuamua kwa lazima kwamba mtu huyo alishangaa.
