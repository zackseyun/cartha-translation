base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: sw
  text: Kisha Noa akamjengea Yahweh madhabahu, akachukua baadhi kutoka kwa kila aina ya mnyama safi na kila aina ya ndege safi, akatoa sadaka za kuteketezwa juu ya madhabahu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akamjengea
  rationale: Kitenzi בנה humaanisha ‘kujenga’; muundo ‘akamjengea’ pia unaonyesha kwamba madhabahu ilijengwa kwa ajili ya Yahweh, kulingana na לַיהוָה.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye heshima katika Kiswahili kwa mahali pa kutolea dhabihu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: מִכֹּל
  choice: baadhi ya kila aina ya
  rationale: Kiebrania kinasema kihalisi ‘kutoka kwa kila’; muktadha unaonyesha uteuzi wa baadhi kutoka katika kila kundi, si kuteketezwa kwa kila mnyama mmoja mmoja.
- source_word: הַבְּהֵמָה
  choice: mnyama
  rationale: בהמה hapa linaonyesha wanyama kwa jumla; ‘mnyama’ ni neno la sasa na halibani maana kuwa mifugo pekee.
- source_word: הַטְּהוֹרָה / הַטָּהֹר
  choice: safi
  rationale: ‘Safi’ linadumisha istilahi fupi ya kibiblia kwa wanyama wanaokubalika kidini bila kuongeza maelezo yasiyotajwa wazi.
- source_word: הָעוֹף
  choice: ndege
  rationale: Katika muktadha wa dhabihu, ‘ndege’ ni tafsiri ya kawaida na ya asili ya עוֹף.
- source_word: וַיַּעַל עֹלֹת
  choice: akatoa sadaka za kuteketezwa
  rationale: Hifili ya עלה pamoja na עֹלֹת ni usemi wa dhabihu unaomaanisha kutoa sadaka za kuteketezwa.
- source_word: בַּמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Huhifadhi maana ya mahali ilipotolewa sadaka na ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya sehemu katika מִכֹּל
  choice: baadhi ya kila aina ya mnyama na ndege safi
  alternative: kutoka kwa kila mnyama safi na kila ndege safi
  rationale: Neno ‘baadhi’ linaweka wazi maana ya kuchukua sehemu, huku ‘kila aina’ likiepuka kudokeza kwamba Noa aliwatoa dhabihu wanyama wote safi waliokuwapo. Usomaji wa moja kwa moja umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kisicho cha kizamani. Sentensi imegawanywa mara mbili kwa uwazi, huku mfululizo wa vitendo ukihifadhiwa kwa viambishi vya ‘aka-’.
