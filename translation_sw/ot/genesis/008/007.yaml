  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wa heshima. Muundo wa Kiebrania unaorudia wazo la kutoka na kurudi umehifadhiwa kwa Kiswahili kinachoeleweka.
