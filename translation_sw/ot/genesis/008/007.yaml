- from: Kisha akamtoa kunguru, naye akatoka, akaendelea kwenda na kurudi[a], mpaka maji yalipokauka juu ya ardhi.
  to: Kisha akamtuma kunguru, naye akatoka, akiendelea kwenda na kurudi, mpaka maji yalipokauka kutoka juu ya ardhi.
  rationale: “Akamtuma” restores the causative sense of dispatching. “Kutoka juu ya ardhi” restores the source’s indication that the waters receded or dried away from the earth. The revised wording retains both the raven’s initial departure and its continuing, repeated going and returning. The existing footnote anchor remains placed after the repeated-motion expression.
