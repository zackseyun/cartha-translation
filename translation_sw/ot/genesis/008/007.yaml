base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: sw
  text: Kisha akamtuma kunguru, naye akatoka, akiendelea kwenda na kurudi, mpaka maji yalipokauka kutoka juu ya ardhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Kisha akamtoa
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi na kinaonyesha kwamba Nuhu alimtoa ndege nje; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הָעֹרֵב
  choice: kunguru
  rationale: Hili ndilo jina la kawaida na sahihi la ndege עֹרֵב katika Kiswahili.
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: naye akatoka, akaendelea kwenda na kurudi
  rationale: Tafsiri hii inadumisha kitenzi cha kutoka na pia maana ya mwendo ulioendelea au kurudiwa-rudiwa katika muundo wa Kiebrania, bila kuongeza kwamba ndege aliruka.
- source_word: עַד
  choice: mpaka
  rationale: Ni kiunganishi cha wakati kinachoonyesha mwisho wa kipindi cha kwenda na kurudi kwa kunguru.
- source_word: יְבֹשֶׁת הַמַּיִם
  choice: maji yalipokauka
  rationale: Hutoa kwa kawaida maana ya maji kufikia hali ya kukauka katika muktadha wa simulizi.
- source_word: מֵעַל הָאָרֶץ
  choice: juu ya ardhi
  rationale: Inahifadhi taswira ya maji yaliyokuwa juu ya ardhi bila kutumia usemi mzito usio wa kawaida katika Kiswahili.
theological_decisions: []
