review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the raven and the repeated movement expressed by וַיֵּצֵא יָצוֹא וָשׁוֹב. However, “akamtoa” means ‘he took him/it out’ rather than ‘he sent out/dispatched,’ and “juu ya ardhi” does not express מֵעַל, ‘from/off the earth.’
  naturalness: The narrative is generally clear and suitably formal. Recasting the repeated action as “akatoka, akiendelea kwenda na kurudi” is natural Standard East African Swahili while retaining the explicit initial departure and iterative return.
  terminology: “Kunguru” is the standard term for raven. “Akatuma” accurately conveys dispatching the bird. “Kutoka juu ya ardhi” preserves the spatial force of the Hebrew without introducing interpretive detail.
  issues:
  - severity: medium
    issue: “akamtoa” for וַיְשַׁלַּח
    rationale: This verb normally means ‘took him/it out,’ whereas the Hebrew means that Noah sent or dispatched the raven.
  - severity: medium
    issue: “maji yalipokauka juu ya ardhi” for מֵעַל הָאָרֶץ
    rationale: This can mean that the waters dried while being on the earth; the Hebrew specifies that the waters dried up from/off the earth.
  revised_text: Kisha akamtuma kunguru, naye akatoka, akiendelea kwenda na kurudi, mpaka maji yalipokauka kutoka juu ya ardhi.
  revised_footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “akatoka, akitoka na kurudi.” Usemi wa Kiebrania unaonyesha mwendo ulioendelea au uliojirudia-rudia.
    reason: lexical_alternative
  revision_rationale: “Akamtuma” restores the causative sense of dispatching. “Kutoka juu ya ardhi” restores the source’s indication that the waters receded or dried away from the earth. The revised wording retains both the raven’s initial departure and its continuing, repeated going and returning. The existing footnote anchor remains placed after the repeated-motion expression.
