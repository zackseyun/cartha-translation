revisions:
- from: Vitoe pamoja nawe viumbe hai vyote vilivyo pamoja nawe, kutoka kwa wote wenye mwili—ndege, wanyama wa kufugwa, na kila kiumbe kitambaacho juu ya ardhi—ili vijazane kwa wingi duniani[a], vizae na kuongezeka duniani.
  to: Katika viumbe hai vyote walio pamoja nawe, miongoni mwa wote wenye mwili—ndege, wanyama wa kufugwa, na kila kiumbe kitambaacho juu ya ardhi—uwatoe pamoja nawe, ili waenee kwa wingi duniani[a], wazae na waongezeke duniani.
  rationale: 'The revision resolves the unclear rendering of “from all flesh,” corrects the footnote’s semantic drift, and retains the Hebrew sequence: bring out the creatures, let them proliferate abundantly, and let them be fruitful and multiply. Animate agreement is used throughout because the referents are animals.'
