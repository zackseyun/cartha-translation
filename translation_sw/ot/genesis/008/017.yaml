  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: sw
  text: Katika viumbe hai vyote walio pamoja nawe, miongoni mwa wote wenye mwili—ndege, wanyama wa kufugwa, na kila kiumbe kitambaacho juu ya ardhi—uwatoe pamoja nawe, ili waenee kwa wingi duniani[a], wazae na waongezeke duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wajaa tele duniani.” Kitenzi cha Kiebrania kina maana ya kuenea au kuwa wengi sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: viumbe hai vyote
  rationale: Hutoa maana pana ya viumbe vilivyo hai bila kuibana חַיָּה kuwa wanyama wa porini pekee; orodha inayofuata inatia ndani ndege, wanyama wa kufugwa, na viumbe vitambaavyo.
- source_word: אֲשֶׁר אִתְּךָ
  choice: vilivyo pamoja nawe
  rationale: Ni kishazi asili cha Kiswahili kinachohifadhi maana ya kuwa pamoja na Nuhu ndani ya safina.
- source_word: מִכָּל בָּשָׂר
  choice: kutoka kwa wote wenye mwili
  rationale: Huhifadhi nahau ya Kiebrania kuhusu wenye mwili na maana yake ya kijumla katika simulizi la gharika, bila kuongeza wazo la ‘aina’ lisilotajwa wazi.
- source_word: בָּעוֹף
  choice: ndege
  rationale: Katika orodha hii, ‘ndege’ ni neno la kawaida na sahihi kwa viumbe warukao.
- source_word: וּבַבְּהֵמָה
  choice: wanyama wa kufugwa
  rationale: Huwasilisha בְּהֵמָה kwa lugha ya sasa, hasa tofauti yake na viumbe vitambaavyo, bila kuibana kuwa ng’ombe tu.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: na kila kiumbe kitambaacho juu ya ardhi
  rationale: ‘Kiumbe kitambaacho’ hutoa maana ya viumbe vinavyosonga karibu na uso wa ardhi; ‘kitambaacho’ pia huhifadhi urudiaji wa wazo katika nomino na kitenzi cha Kiebrania kwa kadiri inayowezekana kwa Kiswahili.
- source_word: הוֹצֵא אִתָּךְ
  choice: Vitoe pamoja nawe
  rationale: 'Hifadhi nguvu ya kusababisha ya kauli ya Hifili: Nuhu anatakiwa kuvitoa viumbe, navyo vitoke pamoja naye.'
- source_word: וְשָׁרְצוּ
  choice: ili vijazane kwa wingi
  rationale: Hutoa wazo la kuenea na kuwa vingi sana, huku ‘ili’ ikionyesha matokeo yaliyokusudiwa ya amri.
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: duniani / juu ya ardhi
  rationale: Katika kauli ya kuongezeka, ‘duniani’ huonyesha upeo mpana baada ya gharika; kwa viumbe vitambaavyo, ‘juu ya ardhi’ hueleza uso ambako vinatembea.
- source_word: וּפָרוּ וְרָבוּ
  choice: vizae na kuongezeka
  rationale: Huhifadhi msamiati wa baraka ya uumbaji katika Kiswahili cha kawaida na kuonyesha mwangwi wa Mwanzo 1.
theological_decisions:
- issue: Mwangwi wa baraka ya uumbaji baada ya gharika
  choice: vijazane kwa wingi ... vizae na kuongezeka
  alternative: viongezeke sana
  rationale: Maneno haya yanahifadhi hatua mbili za Kiebrania—kujazana kwa wingi na kisha kuzaa na kuongezeka—na hivyo mwangwi wa kufanywa upya kwa uumbaji baada ya hukumu, bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Upatanisho wa ngeli ya ki-/vi- umetumiwa kwa ‘kiumbe/viumbe.’ Alama ya tanbihi imewekwa baada ya tafsiri ya וְשָׁרְצוּ, ambako chaguo la kileksia linahusika.
