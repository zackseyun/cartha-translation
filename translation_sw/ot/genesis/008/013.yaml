  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: sw
  text: Ikawa katika mwaka wa mia sita na moja[a], mwezi wa kwanza, siku ya kwanza ya mwezi, maji yalikuwa yamekauka juu ya nchi. Nuhu akaondoa kifuniko[b] cha safina, akatazama, na tazama, uso wa ardhi ulikuwa umekauka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu hausemi wazi mwaka huu unahesabiwa kwa msingi gani; kwa kuzingatia Mwanzo 7:11, yaelekea ni mwaka wa mia sita na moja wa maisha ya Nuhu.
    reason: contextual_clarification
  - marker: b
    text: Au, “paa.” Neno la Kiebrania linamaanisha kitu kinachofunika na halilazimishi maana mahsusi ya sehemu hiyo ya safina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni mwanzo wa kawaida wa simulizi unaoendeleza matukio na kutambulisha taarifa ya wakati bila kutumia lugha ya kizamani isiyo ya lazima.
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: katika mwaka wa mia sita na moja
  rationale: Huwakilisha kwa Kiswahili cha kawaida hesabu ya mwaka iliyo katika Kiebrania, huku ikiacha bila kutajwa wazi mwaka huo unahesabiwa kwa msingi gani, kama ilivyo katika mstari wenyewe.
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: mwezi wa kwanza, siku ya kwanza ya mwezi
  rationale: Neno ‘mwezi’ lililodokezwa katika kishazi cha kwanza limewekwa wazi kwa ajili ya ufasaha, na tarehe imeelezwa kwa mtindo wa kawaida wa Kiswahili.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: maji yaliyokuwa juu ya nchi yalikuwa yamekauka
  rationale: Muundo huu unaonyesha kwamba maji juu ya nchi ndiyo yaliyokauka na unahifadhi hali iliyokuwa tayari imetimia kufikia tarehe iliyotajwa.
- source_word: וַיָּסַר
  choice: akaondoa
  rationale: Kitenzi hiki kina maana ya kusogeza au kuondoa kitu; ‘akaondoa’ ni sahihi na cha kawaida katika muktadha huu.
- source_word: מִכְסֵה הַתֵּבָה
  choice: kifuniko cha safina
  rationale: ‘Kifuniko’ kinadumisha maana pana ya nomino ya Kiebrania bila kukibainisha zaidi kuwa paa, na ‘safina’ ndilo neno lililozoeleka kwa chombo cha Nuhu.
- source_word: וַיַּרְא וְהִנֵּה
  choice: akatazama, na kumbe
  rationale: ‘Akatazama’ huonyesha tendo la kuchunguza baada ya kuondoa kifuniko, na ‘kumbe’ huwasilisha nguvu ya chembe inayovuta fikira kwenye jambo lililoonekana bila kutumia usemi mzito wa tafsiri neno kwa neno.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: uso wa ardhi ulikuwa umekauka
  rationale: ‘Uso wa ardhi’ ni usemi wa Kiswahili unaoeleweka na unaodumisha taswira ya Kiebrania ya sehemu ya juu ya ardhi.
theological_decisions:
- issue: Mwaka wa mia sita na moja unahesabiwa kwa msingi gani
  choice: Msingi wa hesabu haujaongezwa katika maandishi makuu
  alternative: katika mwaka wa mia sita na moja wa maisha ya Nuhu
  rationale: Muktadha wa Mwanzo 7:11 unaelekeza kwenye umri wa Nuhu, lakini mstari huu wenyewe hautaji wazi ‘wa maisha ya Nuhu’; tafsiri haipaswi kufuta udokezi huo kwa kuongeza maelezo ndani ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. ‘Na kumbe’ limetumiwa kwa uasilia wa Kiswahili ili kuhifadhi msisitizo wa ugunduzi katika וְהִנֵּה.
