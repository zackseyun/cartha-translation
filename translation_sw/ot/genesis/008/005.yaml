  text: וְ/הַ/מַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְ/חָס֔וֹר עַ֖ד הַ/חֹ֣דֶשׁ הָֽ/עֲשִׂירִ֑י בָּֽ/עֲשִׂירִי֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: sw
  text: Maji yaliendelea kupungua mpaka mwezi wa kumi. Katika mwezi wa kumi, siku ya kwanza ya mwezi huo, vilele vya milima vilionekana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vilionwa” au “vikawa dhahiri.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa namna hizo; “vilionekana” kinaonyesha kwamba vilele viliweza kuonekana maji yalipopungua, bila kumtaja mtazamaji fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: Maji
  rationale: Katika Kiswahili, “maji” ni nomino ya wingi yenye maana ya jumla na ndiyo njia ya kawaida ya kutaja maji ya gharika.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: yaliendelea kupungua
  rationale: Muundo huu wa Kiebrania unaonyesha tendo endelevu na la hatua kwa hatua; “yaliendelea kupungua” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuongeza wazo lisilokuwamo.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: mpaka mwezi wa kumi
  rationale: חֹדֶשׁ hapa ni kipimo cha wakati, yaani “mwezi,” na msemo huu huhifadhi kikomo cha wakati kilicho katika עַד.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: Katika mwezi wa kumi, siku ya kwanza ya mwezi huo
  rationale: Kiebrania kina usemi wa tarehe ulio na udondoshaji; kuutaja mwezi waziwazi na kutumia “mwezi huo” kunatoa Kiswahili cha asili huku kukihifadhi tarehe kamili.
- source_word: נִרְאוּ
  choice: vilionekana
  rationale: Nifali ya ראה inaweza kumaanisha “vilionekana,” “vilionwa,” au “vikawa dhahiri.” “Vilionekana” ni ya moja kwa moja, ya asili, na haimtaji mtazamaji fulani.
- source_word: רָאשֵׁי הֶהָרִים
  choice: vilele vya milima
  rationale: Ingawa רֹאשׁ kihalisi ni “kichwa,” katika muktadha wa milima “vilele” huwasilisha sehemu zake za juu kwa Kiswahili cha kawaida bila kulazimisha maana ya ncha kali pekee.
