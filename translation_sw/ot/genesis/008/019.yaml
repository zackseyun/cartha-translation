base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: sw
  text: Kila mnyama, kila kiumbe kitambaacho, na kila ndege—kila kitu kinachotembea juu ya nchi—vilitoka katika safina kwa familia zao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kadiri ya familia zao.” Usemi wa Kiebrania huhifadhi wazo la makundi ya nasaba au migawanyiko miongoni mwa wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: Kila mnyama
  rationale: Katika orodha hii חַיָּה linataja wanyama wa nchi kwa utofauti na viumbe vitambaavyo na ndege; “mnyama” ni neno la kawaida lisilobainisha bila msingi kuwa ni wa kufugwa au wa porini.
- source_word: כָּל הָרֶמֶשׂ
  choice: kila kiumbe kitambaacho
  rationale: רֶמֶשׂ hurejelea viumbe wadogo wanaosonga karibu na ardhi; usemi huu ni wa asili katika Kiswahili na unafaa kwa uainishaji wa Mwanzo.
- source_word: וְכָל הָעוֹף
  choice: na kila ndege
  rationale: Ingawa עוֹף linaweza kujumuisha viumbe warukao kwa upana, “ndege” ndilo chaguo la kawaida na linalofaa katika muktadha huu.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: kila kitu kinachotembea juu ya nchi
  rationale: “Kinachotembea” huepuka marudio mazito baada ya “kitambaacho” huku kikihifadhi maana pana ya mwendo wa viumbe juu ya nchi.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: kwa familia zao
  rationale: מִשְׁפָּחָה kwa kawaida humaanisha familia au ukoo; hapa linaonyesha makundi ya wanyama kwa nasaba au migawanyiko yao bila kulitafsiri zaidi kuwa “aina.”
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: vilitoka katika safina
  rationale: Hii inawasilisha moja kwa moja kitendo cha kutoka ndani ya תֵּבָה; “safina” ni istilahi iliyozoeleka katika simulizi la Noa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Upatanisho wa ngeli katika “vilitoka” unaelekeza kwa mkusanyiko wa viumbe uliotajwa; vistari virefu vinatenga kishazi cha muhtasari kama katika tabaka la ushauri la Kiingereza.
