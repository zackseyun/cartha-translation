base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: sw
  text: Maadamu dunia itadumu,[a] wakati wa kupanda na kuvuna, baridi na joto, majira ya joto na majira ya baridi,[b] mchana na usiku havitakoma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “siku zote za dunia.”
    reason: lexical_alternative
  - marker: b
    text: Au “kiangazi na majira ya mvua”; katika hali ya hewa ya Israeli, majira ya joto kwa kawaida huwa makavu, na majira ya baridi huwa ya mvua.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: Kwa muda wote ambao dunia itakuwapo
  rationale: 'Muundo huu unaonyesha muda unaoendelea: kihalisi, ‘siku zote za dunia.’ Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha kikomo cha muda kilichomo katika Kiebrania.'
- source_word: זֶרַע
  choice: wakati wa kupanda
  rationale: Katika jozi na קָצִיר, neno hili linamaanisha shughuli au majira ya kupanda, si mbegu kama kitu.
- source_word: קָצִיר
  choice: wakati wa kuvuna
  rationale: Hii ndiyo sehemu ya pili ya jozi ya shughuli za kilimo na inasikika kwa urahisi katika Kiswahili cha sasa.
- source_word: קֹר וָחֹם
  choice: baridi na joto
  rationale: Tafsiri ya moja kwa moja inayohifadhi jozi ya hali zinazokinzana.
- source_word: קַיִץ וָחֹרֶף
  choice: kiangazi na majira ya mvua
  rationale: Katika mazingira ya Mashariki ya Kati, maneno haya yanawakilisha kwa kawaida majira ya ukavu/joto na majira ya baridi/mvua. ‘Kiangazi na majira ya mvua’ ni ya asili na wazi kwa wasomaji wa Afrika Mashariki, huku tanbihi ikihifadhi mbadala wa ‘majira ya joto na majira ya baridi.’
- source_word: יוֹם וָלַיְלָה
  choice: mchana na usiku
  rationale: Jozi ya kawaida inayoonyesha mzunguko unaoendelea wa wakati.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: havitakoma
  rationale: Kitenzi שׁבת hapa kina maana ya kukoma au kusita; kiwakilishi cha wingi kinarejelea vipindi na mizunguko iliyotajwa.
theological_decisions:
- issue: Upeo na muda wa ahadi kuhusu mizunguko ya kawaida ya uumbaji
  choice: Kauli inahusu kuendelea kwa mizunguko hii kwa muda wote ambao dunia itakuwapo.
  alternative: Kudai kwamba mizunguko hii itaendelea milele bila kikomo chochote.
  rationale: Maneno כָּל יְמֵי הָאָרֶץ yanaweka kikomo cha muda katika ‘siku zote za dunia’; tafsiri haiifanyi kauli kuwa dai lisilo na kikomo kuhusu umilele.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa jozi na urari wa kishairi wa mstari umehifadhiwa; istilahi za majira zimewekwa katika namna inayoeleweka kikanda bila kuficha maana ya mazingira ya asili.
