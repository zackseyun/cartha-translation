  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: sw
  text: Na katika mwezi wa pili, siku ya ishirini na saba ya mwezi huo, dunia[a] ilikuwa kavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi” au “ardhi.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia,” “nchi,” au “ardhi”; hapa “dunia” limetumiwa kwa sababu simulizi la gharika linaeleza kukauka kwa upeo mpana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ
  choice: Na katika mwezi
  rationale: Kiunganishi ו pamoja na kihusishi ב kinaendeleza mfuatano wa simulizi na kuanzisha taarifa ya wakati; “Na katika” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Kivumishi cha mpangilio kinaeleza mwezi; “mwezi wa pili” ni muundo wa kawaida wa Kiswahili.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: siku ya ishirini na saba ya mwezi huo
  rationale: Huu ni mtindo wa kawaida wa Kiebrania wa kutaja tarehe. Kiswahili cha sasa hutumia kwa kawaida “siku ya ishirini na saba”; “huo” hurejelea wazi mwezi wa pili uliotajwa.
- source_word: יָבְשָׁה
  choice: ilikuwa imekauka
  rationale: Qal timilifu, nafsi ya tatu umoja wa kike, inaonyesha hali iliyotimia kufikia wakati huu katika simulizi. “Ilikuwa imekauka” huonyesha kwa asili kwamba ukavu ulikuwa umekamilika, bila kudokeza tu mwanzo wa kukauka.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: אֶרֶץ inaweza kumaanisha “dunia,” “nchi,” au “ardhi.” “Dunia” inafaa upeo mpana wa simulizi la gharika, huku tanbihi ikihifadhi maana nyingine halali.
