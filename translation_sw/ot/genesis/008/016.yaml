  text: “Toka katika safina, wewe, mke wako, wanao, na wake wa wanao, pamoja nawe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: Toka
  rationale: Ni amri ya moja kwa moja kwa Noa ya kuondoka ndani ya chombo. “Toka” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: מִן הַתֵּבָה
  choice: katika safina
  rationale: Kiambishi מן kinaonyesha mwendo kutoka ndani ya safina. Katika Kiswahili, “toka katika safina” huonyesha wazi kuondoka ndani yake; תֵּבָה limetafsiriwa kwa istilahi ya Biblia iliyozoeleka, “safina.”
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi huru kinamweka Noa wazi katika orodha ya wanaotakiwa kutoka na kinadumisha msisitizo wa maandishi ya Kiebrania.
- source_word: וְאִשְׁתְּךָ
  choice: na mke wako
  rationale: Katika muktadha wa umilikaji, אִשָּׁה humaanisha mke.
- source_word: וּבָנֶיךָ
  choice: wanao
  rationale: בָּנִים hapa humaanisha wana wa kiume, jambo linalothibitishwa na kutajwa kwa wake zao. “Wanao” ni umbo la kawaida la “wana wako.”
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: na wake za wanao
  rationale: Huhifadhi kwa karibu muundo halisi wa Kiebrania, “wake za wanao,” badala ya kuubadili kuwa uhusiano wa kijamii wa “binti-wakwe zako.”
- source_word: אִתָּךְ
  choice: pamoja nawe
  rationale: Huonyesha uandamani wa watu wote waliotajwa na Noa kwa lugha ya asili na yenye staha.
