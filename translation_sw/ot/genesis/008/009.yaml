  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: sw
  text: Lakini hua hakupata mahali pa kutulia kwa wayo wa mguu wake, hivyo akarudi kwake, kwenye safina, kwa sababu maji yalikuwa juu ya uso wa dunia yote. Ndipo akanyosha mkono wake, akamchukua na akamleta ndani ya safina kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: mahali pa kutua wayo wa mguu wake
  rationale: Inahifadhi maana halisi ya mahali ambapo hua angeweza kutua na pia taswira ya Kiebrania ya wayo wa mguu, kwa lugha inayoeleweka katika Kiswahili.
- source_word: וַתָּשָׁב אֵלָיו אֶל הַתֵּבָה
  choice: hivyo akarudi kwake kwenye safina
  rationale: Neno 'hivyo' linaonyesha matokeo ya kutopata mahali pa kutua; 'kwake kwenye safina' linahifadhi marejeo yote mawili, yaani kwa Nuhu na kwenye safina.
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: maji yalikuwa juu ya uso wa dunia yote
  rationale: Tafsiri hii inadumisha taswira ya chanzo ya maji kuwa juu ya uso wa nchi/dunia badala ya kuibadili kuwa kauli ya kufunika.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: akanyosha mkono wake
  rationale: Hii ndiyo namna ya kawaida na ya asili ya kueleza nahau ya Kiebrania ya kuutuma au kuunyoosha mkono.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל הַתֵּבָה
  choice: akamwingiza kwake ndani ya safina
  rationale: 'Inahifadhi vipengele vyote viwili vya chanzo: alimleta hua kwake mwenyewe na ndani ya safina, ingawa mpangilio wake una ladha rasmi kidogo.'
