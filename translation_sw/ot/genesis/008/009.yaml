    issue: Muundo wa "mahali pa kutua wayo wa mguu wake" si wa kawaida kisarufi.
    rationale: Kiswahili huhitaji uhusiano wa wazi kama "kwa wayo wa mguu wake"; pia "kutulia" huwasilisha vizuri מָנוֹחַ, mahali pa mapumziko/pa kutua.
  - severity: low
    issue: '"Akamwingiza kwake ndani ya safina" una mpangilio mgumu usio wa kawaida.'
    rationale: Ingawa unakusudia kuhifadhi אֵלָיו na אֶל־הַתֵּבָה, "akamleta ndani ya safina kwake" ni wazi na wa asili zaidi bila kuacha kipengele chochote cha chanzo.
