base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: sw
  text: BWANA akanusa harufu ya kupendeza, naye BWANA akasema moyoni mwake, “Sitaulaani tena udongo kwa sababu ya mwanadamu, kwa maana mwelekeo wa moyo wa mwanadamu ni mbaya tangu ujana wake. Wala sitapiga tena kila kilicho hai kama nilivyofanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la agano limetafsiriwa kwa desturi pana ya Biblia za Kiswahili, kwa herufi kubwa ili kulitofautisha na neno la kawaida ‘bwana’.
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: harufu ya kupendeza
  rationale: Huwasilisha maana ya harufu inayokubalika au kupendeza bila kuongeza ufafanuzi wa kidhehebu kuhusu dhabihu.
- source_word: אֶל־לִבּוֹ
  choice: moyoni mwake
  rationale: Huhifadhi taswira halisi ya Kiebrania na katika Kiswahili humaanisha kusema kimoyomoyo.
- source_word: אֲדָמָה
  choice: udongo
  rationale: Hutofautisha ardhi/udongo uliolaaniwa na dunia kwa ujumla, na huhifadhi mwangwi wa uhusiano wa kimatamshi na אָדָם.
- source_word: יֵצֶר
  choice: mwelekeo
  rationale: Neno hilo linaweza kumaanisha umbo, kusudi, au msukumo unaoundwa ndani; ‘mwelekeo’ huhifadhi wazo la tabia ya ndani bila kulifunga kwa tendo moja tu.
- source_word: מִנְּעֻרָיו
  choice: tangu ujana wake
  rationale: Tafsiri ya moja kwa moja inayohifadhi kutotajwa kwa umri maalumu wa kuanza.
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: kuwapiga viumbe vyote vilivyo hai
  rationale: ‘Kupiga’ huhifadhi upana wa kitenzi; ‘viumbe vyote vilivyo hai’ huonyesha kuwa ‘kilicho hai’ kimetumiwa kwa maana ya pamoja.
theological_decisions:
- issue: Sababu inayohusishwa na uovu wa moyo wa mwanadamu
  choice: kwa maana mwelekeo wa moyo wa mwanadamu ni mbaya tangu ujana wake
  alternative: ingawa mwelekeo wa moyo wa mwanadamu ni mbaya tangu ujana wake
  rationale: Kiunganishi כִּי kwa kawaida ni ‘kwa maana/kwa sababu’; tafsiri haibadili kwa kimya mvutano wa kifungu kwa kukifanya kiunganishi cha kukubali hali (‘ingawa’).
- issue: Kauli ya Mungu ya ndani
  choice: akasema moyoni mwake
  alternative: akajiambia
  rationale: Huhifadhi nahau na taswira ya maandishi ya Kiebrania bila kuamua zaidi ya maandishi kuhusu namna ya usemi wa Mungu.
- issue: Upeo wa ahadi kuhusu viumbe hai
  choice: sitawapiga tena viumbe vyote vilivyo hai kama nilivyofanya
  alternative: sitaangamiza tena kila kiumbe hai
  rationale: Huhifadhi kitenzi ‘kupiga’ na upeo wa kauli kama ulivyo, bila kuingiza kitenzi maalumu zaidi ‘kuangamiza’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na marudio ya ‘BWANA’ yamehifadhiwa kwa uaminifu kwa mtindo wa Kiebrania.
