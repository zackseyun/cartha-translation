id: GEN.8.4
reference: Genesis 8:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: sw
  text: Katika mwezi wa saba, siku ya kumi na saba ya mwezi huo, safina ikatulia juu ya milima ya Ararati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “milima ya Ararati.” Hii inaelekea kumaanisha eneo la milima la Ararati, si lazima kilele kimoja maalumu kinachoitwa Mlima Ararati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: ikatulia
  rationale: Kitenzi נוח katika mfuatano wa masimulizi kinaonyesha safina ilifikia hali na mahali pa kutulia. “Ikatulia” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kitendo bila kuongeza wazo lisilo lazima la kutua kama chombo cha angani.
- source_word: הַתֵּבָה
  choice: safina
  rationale: “Safina” ndilo neno la Kiswahili lililozoeleka na linalofaa kwa תֵּבָה ya Nuhu katika muktadha huu.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: katika mwezi wa saba
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya usemi wa wakati wenye בְּ.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: siku ya kumi na saba ya mwezi huo
  rationale: Huu ni usemi wa asili wa tarehe kwa Kiswahili; “huo” huonyesha wazi kuwa ni mwezi uliotajwa tayari.
- source_word: עַל
  choice: juu ya
  rationale: Huhifadhi maana ya msingi ya mahali ya kihusishi עַל katika muktadha huu.
- source_word: הָרֵי אֲרָרָט
  choice: milima ya Ararati
  rationale: הָרֵי ni wingi katika hali ya uambatani, kwa hiyo “milima ya Ararati” huhifadhi wingi wa Kiebrania na haudai kuwa ni kilele kimoja maalumu.
theological_decisions:
- issue: Usemi wa kijiografia הָרֵי אֲרָרָט
  choice: milima ya Ararati
  alternative: Mlima Ararati
  rationale: Kiebrania kimetumia wingi, “milima.” Tafsiri haipaswi kuugeuza kuwa mlima mmoja maalumu, kwa kuwa hilo lingefanya dai la kijiografia lililo mahususi kuliko maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa tarehe ni wa kawaida na unaeleweka kwa urahisi; “ikatulia” huhifadhi mwendo wa simulizi na maana ya safina kufikia mahali pa kupumzika.
