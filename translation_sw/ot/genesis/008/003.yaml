  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: sw
  text: Maji yakarudi nyuma kutoka juu ya nchi, yakiendelea kupungua; na mwishoni mwa siku mia moja na hamsini, maji yakapungua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: yakazidi kupungua
  rationale: Kitenzi שוב kina maana ya kurudi au kugeuka nyuma; kinapotumiwa kuhusu maji yanayoondoka juu ya nchi, Kiswahili cha kawaida hueleza tendo hilo kwa ‘kupungua’. Muundo unaofuata unaonyesha kuwa hatua hiyo iliendelea.
- source_word: מֵעַל הָאָרֶץ
  choice: juu ya nchi
  rationale: Kirai hiki huhifadhi picha ya maji yaliyokuwa yamefunika nchi na sasa yakipungua kutoka juu yake; katika Kiswahili, ‘kupungua juu ya nchi’ ni ya asili kuliko tafsiri ya neno kwa neno ‘kutoka juu ya nchi’.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: yakazidi
  rationale: Muundo wa infinitivu mbili unaeleza mwendo unaoendelea au unaoongezeka hatua kwa hatua. ‘Yakazidi kupungua’ hutoa maana hiyo bila kudokeza kimakosa kuwa maji yalikuwa yakirudi huku na huku.
- source_word: וַיַּחְסְרוּ
  choice: yalikuwa yamepungua
  rationale: חסר hueleza kuwa maji yalikuwa yamekuwa machache. Kauli timilifu ya Kiswahili inaonyesha hali iliyofikiwa kufikia mwisho wa kipindi kilichotajwa.
- source_word: מִקְצֵה
  choice: baada ya
  rationale: Katika matumizi ya wakati, neno hili linaweza kumaanisha baada ya kukamilika kwa kipindi fulani. ‘Baada ya’ ni ya kawaida na wazi katika Kiswahili cha kisasa.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: siku mia moja na hamsini
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kutaja jumla ya siku 150.
