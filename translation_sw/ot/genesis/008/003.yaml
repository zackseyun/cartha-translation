translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Marudio ya neno ‘maji’ yamehifadhiwa kwa sababu yapo katika Kiebrania, huku הָלוֹךְ וָשׁוֹב ikitafsiriwa kwa maana yake ya mwendelezo badala ya tafsiri ya kimitambo inayoweza kueleweka kuwa mwendo wa kurudi-rudi.
