  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: sw
  text: Njiwa akaja kwake wakati wa jioni[a], na tazama, mdomoni mwake kulikuwa na jani la mzeituni lililochumwa hivi karibuni[b]. Basi Nuhu akajua kwamba maji yalikuwa yamepungua kutoka juu ya nchi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alimrudia”; kitenzi cha Kiebrania chenyewe humaanisha “akaja,” ingawa muktadha unaonyesha kurudi.
    reason: lexical_alternative
  - marker: b
    text: “Lililochumwa hivi karibuni” hutafsiri neno la Kiebrania linalomaanisha kitu kilichoraruliwa au kuchumwa, na hivyo kudokeza kwamba jani hilo lilikuwa limetolewa hivi karibuni kwenye mzeituni ulio hai.
    reason: lexical_alternative
  - marker: c
    text: Au “maji yalikuwa yamepwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: akaja
  rationale: Kitenzi בוא humaanisha kwa kawaida ‘kuja’; muktadha unaonyesha kuwa njiwa alimrudia Noa, lakini maana hiyo haijaelezwa moja kwa moja katika kitenzi.
- source_word: לְעֵת עֶרֶב
  choice: wakati wa jioni
  rationale: Huwasilisha kwa njia ya kawaida na iliyo wazi wakati wa siku unaotajwa na Kiebrania.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Inadumisha ishara ya kisimulizi inayovuta fikira kwenye jambo la kushangaza linalofuata.
- source_word: עֲלֵה זַיִת
  choice: jani la mzeituni
  rationale: Ni ulinganifu wa kawaida wa muundo wa Kiebrania wenye maana halisi ya ‘jani la mzeituni.’
- source_word: טָרָף
  choice: lililochumwa karibuni
  rationale: Neno linaonyesha kitu kilichoraruliwa au kuchumwa; kauli hii inadokeza kwamba jani hilo lilikuwa limetolewa hivi karibuni kwenye mti ulio hai.
- source_word: בְּפִיהָ
  choice: mdomoni mwake kulikuwa na
  rationale: Inahifadhi wazi mahali jani lilipokuwa na kutumia umbo la kawaida la Kiswahili.
- source_word: וַיֵּדַע
  choice: Basi Noa akajua
  rationale: ‘Basi’ huonyesha kwamba ufahamu wa Noa ulitokana na ishara ya jani huku simulizi likisonga mbele.
- source_word: קַלּוּ הַמַּיִם
  choice: maji ... yalikuwa yamepungua
  rationale: Mzizi קלל hapa unaonyesha kwamba maji yalikuwa yamekuwa machache au yamepungua; tafsiri hii ni ya kawaida kwa maji ya mafuriko.
- source_word: מֵעַל הָאָרֶץ
  choice: juu ya nchi
  rationale: Inahifadhi uhusiano wa mahali—maji yaliyokuwa juu ya nchi—kwa Kiswahili cha kawaida bila kuunda kauli nzito isiyo ya asili.
