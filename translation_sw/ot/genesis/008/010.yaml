  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: sw
  text: Kisha akangoja siku saba nyingine[a], halafu akamtuma tena yule njiwa kutoka katika safina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaanza kungoja siku saba nyingine”; kitenzi cha Kiebrania kinaweza kumaanisha kihalisi zaidi “akaanza,” lakini katika muktadha huu kinatumika kiidioma kwa maana ya “akangoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: akangoja
  rationale: Katika muktadha huu, kitenzi hiki pamoja na kipindi cha muda kinaeleweka kiidioma kuwa alingoja kabla ya kuchukua hatua iliyofuata; tafsiri ya moja kwa moja zaidi ya ‘akaanza’ ingekuwa isiyo wazi bila kirai cha ziada.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: siku nyingine saba
  rationale: Kirai hiki kinaonyesha kipindi cha nyongeza cha siku saba; ‘siku nyingine saba’ ni Kiswahili cha kawaida na huhifadhi wazo la muda ulioongezwa.
- source_word: וַיֹּסֶף שַׁלַּח
  choice: akamtuma tena
  rationale: Muundo wa Kiebrania una maana ya kurudia tendo; ‘tena’ huwasilisha maana hiyo kwa kawaida, na kiambishi ‘-m-’ humrejelea njiwa.
- source_word: הַיּוֹנָה
  choice: yule njiwa
  rationale: Nomino ni bayana na inamrejelea njiwa aliyetajwa tayari; ‘yule’ hutoa urejeleo huo wa kisimulizi kwa Kiswahili cha kawaida.
- source_word: מִן הַתֵּבָה
  choice: kutoka kwenye safina
  rationale: ‘Safina’ ndilo neno la kawaida la kibiblia kwa תֵּבָה katika simulizi la Nuhu, na ‘kutoka kwenye’ huonyesha mahali alikotumwa njiwa.
