translation:
  language: sw
  text: Kisha akamtuma hua kutoka kwake, ili kuona kama maji yalikuwa yamepungua kutoka juu ya uso wa ardhi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yalikuwa yamepwa.” Kitenzi cha Kiebrania kinaonyesha kwamba maji ya gharika yalikuwa yamepungua.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka juu ya uso wa ardhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Kisha akamtuma
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi na maana yake hapa ni kumtuma ndege aende; “kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַיּוֹנָה
  choice: hua
  rationale: יוֹנָה humaanisha hua au njiwa; “hua” ni neno la kawaida na linalofaa katika simulizi hili.
- source_word: מֵאִתּוֹ
  choice: kutoka kwake
  rationale: Kirai hiki kinaonyesha mwendo wa kuondoka kwa Nuhu mwenyewe au mahali alipokuwa, bila kuongeza moja kwa moja kwamba hua alitoka katika safina.
- source_word: לִרְאוֹת
  choice: ili kuona
  rationale: Kitenzi-jina hiki kinaonyesha kusudi la kumtuma hua; “ili kuona” hudumisha maana yake ya moja kwa moja.
- source_word: הֲקַלּוּ
  choice: yalikuwa yamepungua
  rationale: Katika muktadha huu קלל huonyesha kwamba maji ya gharika yalikuwa yamekuwa machache au kushuka; muundo huu pia unaonyesha hali iliyotarajiwa kuwa tayari imetokea kabla ya uchunguzi.
- source_word: הַמַּיִם
  choice: maji
  rationale: Kiswahili hutumia “maji” kama nomino ya wingi, na neno hilo linafaa kwa maji ya gharika.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: juu ya uso wa ardhi
  rationale: Hili ni tamko la asili kwa Kiswahili linalowasilisha mahali maji yalipokuwa; wazo halisi zaidi la kuondoka “kutoka juu ya uso” limehifadhiwa katika tanbihi.
