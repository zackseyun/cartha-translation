  yaml_path: translation/ot/genesis/008/018.yaml
  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: sw
  text: Basi Noa akatoka, pamoja na wanawe, mkewe, na wake wa wanawe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Basi Noa akatoka
  rationale: Muundo wa usimulizi wenye waw-consecutive unaendeleza tukio na hapa pia unaonyesha kuitikia amri iliyotangulia. “Basi ... akatoka” ni Kiswahili cha kawaida kinachohifadhi mtiririko huo bila kufafanua kupita kiasi.
- source_word: נֹחַ
  choice: Noa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: וּבָנָיו
  choice: pamoja na wanawe
  rationale: בָּנִים hapa humaanisha wana wa kiume, na kiambishi kinaonyesha kuwa ni wanawe Noa. “Pamoja na” huunganisha kwa kawaida orodha inayohitimishwa na אִתּוֹ, ‘pamoja naye.’
- source_word: וְאִשְׁתּוֹ
  choice: mkewe
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya tatu ya kiume humaanisha moja kwa moja ‘mke wake’; “mkewe” ni fupi, wazi, na ya asili katika Kiswahili.
- source_word: וּנְשֵׁי בָנָיו
  choice: wake za wanawe
  rationale: Hufuata kwa karibu maana halisi, ‘wake wa wanawe,’ huku upatanisho wa ngeli unaofaa katika Kiswahili sanifu ukiwa “wake za wanawe.” Haibadilishwi kuwa ‘mashemeji’ au usemi mwingine usio wa moja kwa moja.
- source_word: אִתּוֹ
  choice: pamoja na
  rationale: Maana ni ‘pamoja naye.’ Katika Kiswahili, kuweka “pamoja na” kabla ya orodha yote huwasilisha kwa uwazi kwamba wote walitoka pamoja na Noa, huku kuepuka hitimisho zito la ‘pamoja naye.’
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa wa asili kwa Kiswahili: kirai cha mwisho cha Kiebrania אִתּוֹ (‘pamoja naye’) kimewasilishwa mwanzoni mwa orodha kama ‘pamoja na.’ Hakuna tanbihi iliyohitajika kwa sababu tofauti za viunganishi vya usimulizi hazibadili maana kwa kiasi kinachohitaji kuonyeshwa katika aya hii.'
