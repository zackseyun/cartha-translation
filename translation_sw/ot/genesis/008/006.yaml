    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: Baada ya siku arobaini
  rationale: Mfumo wa masimulizi umeunganishwa kwa kawaida na kirai cha wakati badala ya kutafsiriwa neno kwa neno kuwa ‘ikawa’; hii huhifadhi mfuatano wa tukio kwa Kiswahili cha sasa.
- source_word: מִקֵּץ
  choice: Baada ya
  rationale: Katika usemi huu wa wakati, maana ni kufikiwa kwa mwisho wa muda uliotajwa. ‘Baada ya’ ni tafsiri ya kawaida ya Kiswahili; ‘mwishoni mwa’ pia inawezekana.
- source_word: אַרְבָּעִים יוֹם
  choice: siku arobaini
  rationale: Huu ndio mpangilio wa kawaida na sahihi wa idadi na nomino katika Kiswahili.
- source_word: וַיִּפְתַּח
  choice: alifungua
  rationale: Kitenzi פתח hapa kina maana ya kufungua.
- source_word: חַלּוֹן
  choice: dirisha
  rationale: Nomino hii kwa kawaida humaanisha dirisha au uwazi wa aina hiyo; ‘dirisha’ ndiyo tafsiri iliyo wazi zaidi katika muktadha.
- source_word: הַתֵּבָה
  choice: safina
  rationale: Katika simulizi la Noa, תֵּבָה hurejelea chombo maalumu kinachojulikana kwa Kiswahili kama safina.
- source_word: אֲשֶׁר עָשָׂה
  choice: alilokuwa ametengeneza
  rationale: Kirai hiki kinahusishwa na ‘safina’; hali ya ‘ametengeneza’ inaonyesha kwa kawaida kwamba utengenezaji ulitangulia kufunguliwa kwa dirisha.
