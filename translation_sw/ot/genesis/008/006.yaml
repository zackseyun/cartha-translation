translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Safina’ limetumiwa kama neno lililozoeleka katika simulizi la Noa; muundo wa moja kwa moja umetumiwa ili kuepuka ‘ikawa’ yenye uzito usio wa lazima, huku tofauti halisi ya usemi wa wakati ikihifadhiwa katika tanbihi.
