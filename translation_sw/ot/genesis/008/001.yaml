  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: sw
  text: Lakini Mungu akamkumbuka Noa[a], pamoja na wanyama wote wa porini na mifugo yote waliokuwa pamoja naye ndani ya safina. Mungu akaufanya upepo uvume[b] juu ya dunia, nayo maji yakapungua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu akamjali Noa.” Katika Kiebrania, “kukumbuka” mara nyingi huhusisha kuchukua hatua kwa uaminifu kwa ajili ya anayekumbukwa, wala si kukumbuka tu jambo lililosahaulika.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania רוּחַ linaweza kumaanisha “upepo,” “pumzi,” au “roho.” Hapa “upepo” inafaa zaidi na muktadha, ingawa huenda kukawa na mwangwi wa Roho au upepo juu ya maji katika Mwanzo 1:2.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: akamkumbuka
  rationale: Huhifadhi nahau ya Kiebrania na uzito wake wa kisimulizi. Katika muktadha huu haimaanishi kwamba Mungu alikuwa amemsahau Noa, bali kwamba alimkumbuka kwa namna iliyoongoza kwenye tendo la kumsaidia.
- source_word: כָּל הַחַיָּה
  choice: wanyama wote wa porini
  rationale: חַיָּה hapa inatofautishwa na בְּהֵמָה, hivyo tafsiri hii inadumisha tofauti kati ya wanyama wa porini na mifugo.
- source_word: כָּל הַבְּהֵמָה
  choice: mifugo yote
  rationale: בְּהֵמָה katika jozi hii inaelekea kumaanisha wanyama wanaofugwa; ‘mifugo’ ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: בַּתֵּבָה
  choice: ndani ya safina
  rationale: ‘Safina’ ndilo neno la Kibiblia lililozoeleka kwa chombo cha Noa, na ‘ndani ya’ huonyesha wazi mahali walipokuwapo.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: akapitisha upepo
  rationale: Muundo huu unaonyesha kisababishi cha kitenzi עבר, huku ‘upepo’ ukifaa zaidi na matokeo ya maji kupungua. Uwezekano wa maana nyingine za רוּחַ unawekwa katika tanbihi.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: אֶרֶץ inaweza kuwa ‘nchi’ au ‘dunia’; katika muktadha mpana wa simulizi la gharika, ‘dunia’ inafaa zaidi.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: maji yakapungua
  rationale: Kitenzi kina maana ya kutulia au kupungua kwa nguvu; ‘yakapungua’ ni Kiswahili cha kawaida kinachoeleza kupungua kwa maji ya gharika.
- source_word: וַ
  choice: Lakini
  rationale: Kiunganishi cha mwanzo kinaashiria badiliko la simulizi kutoka hukumu kwenda tendo la rehema; ‘Lakini’ hulionyesha kwa kawaida bila kuongeza wazo jipya.
theological_decisions:
- issue: Lugha ya kibinadamu katika usemi ‘Mungu akamkumbuka Noa’
  choice: Kudumisha usemi ‘Mungu akamkumbuka Noa’
  alternative: Mungu akamjali Noa
  rationale: Tafsiri inahifadhi usemi halisi na mvutano wake wa kiteolojia badala ya kuufafanua ndani ya matini. Katika muktadha, kukumbuka huku kunaonyesha uaminifu wa Mungu unaodhihirishwa kwa tendo, si kwamba hapo awali alikuwa amesahau.
- issue: Maana ya רוּחַ katika simulizi la gharika
  choice: upepo
  alternative: roho
  rationale: Ingawa רוּחַ inaweza kumaanisha upepo, pumzi, au roho, hapa tendo lake juu ya maji na kupungua kwa maji vinaunga mkono maana ya kimazingira ya ‘upepo.’ Mwangwi unaowezekana wa Mwanzo 1:2 haukataliwi, bali unaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa vitenzi vya mfululizo (‘akamkumbuka,’ ‘akapitisha,’ ‘yakapungua’) unadumisha mwendo wa simulizi la Kiebrania. ‘Safina’ limetumiwa kwa sababu ndilo neno la Kibiblia lililozoeleka.
