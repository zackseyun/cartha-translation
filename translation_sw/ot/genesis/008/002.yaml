  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: sw
  text: Chemchemi za kilindi na madirisha ya mbingu[a] yakafungwa, nayo mvua kutoka mbinguni ikazuiliwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malango ya mafuriko ya mbingu.” Kiebrania hurejelea kihalisi mianya au madirisha katika anga.
    reason: lexical_alternative
  - marker: b
    text: Au, “mvua kutoka mbinguni ikakoma.” Kitenzi cha Kiebrania kinaweza kusisitiza kuzuiliwa kwa mvua, na hivyo ikakoma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: yakafungwa
  rationale: Kauli ya kutendwa inawakilisha umbo la Kiebrania na inafaa kwa chemchemi na madirisha kama viima vya pamoja.
- source_word: מַעְיְנֹת
  choice: chemchemi
  rationale: Ni neno la kawaida na la asili kwa vyanzo vya maji, bila taswira inayoweza kupotosha ya mabomba ya kisasa.
- source_word: תְּהוֹם
  choice: kilindi
  rationale: Linahifadhi taswira ya kina kuu cha maji katika simulizi la Mwanzo na linaendana na matumizi ya Mwanzo 1:2.
- source_word: אֲרֻבֹּת
  choice: madirisha
  rationale: Linahifadhi maana ya moja kwa moja ya mianya au madirisha katika anga; ‘malango ya mafuriko’ ni ufafanuzi wenye nguvu zaidi na umewekwa katika tanbihi.
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: Linafaa kwa muktadha wa juu na wa kikosmolojia, na linaruhusu kurudiwa kwa neno hilo kama katika Kiebrania.
- source_word: וַיִּכָּלֵא
  choice: ikazuiliwa
  rationale: Linadumisha wazo la mvua kushikiliwa au kuzuiwa, badala ya kutaja tu matokeo kwamba ilikoma.
- source_word: הַגֶּשֶׁם
  choice: mvua
  rationale: Ni kisawe cha kawaida, wazi, na cha moja kwa moja katika Kiswahili.
- source_word: מִן הַשָּׁמָיִם
  choice: kutoka mbinguni
  rationale: Linahifadhi lugha ya kikosmolojia na urudiaji wa ‘mbingu’ uliopo katika Kiebrania.
