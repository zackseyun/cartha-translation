- from: Kisha akangoja siku nyingine saba, akamwachilia yule hua; naye hakumrudia tena.[a]
  to: Kisha akangoja siku nyingine saba, akamtuma yule hua; naye hakumrudia tena.[a]
  rationale: The revision replaces an interpretive ‘released’ verb with the source-faithful ‘sent,’ while retaining the additional seven-day interval and the dove’s failure to return. The footnote now preserves the alternative ‘no longer continued returning’ sense without adding an unwarranted absolute claim.
