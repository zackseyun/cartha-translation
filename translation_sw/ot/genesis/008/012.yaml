  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: sw
  text: Kisha akangoja siku nyingine saba, akamtuma yule hua; naye hakumrudia tena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye hakuendelea kumrudia.” Muundo wa Kiebrania uliokanushwa wenye יָסְפָה pamoja na שׁוּב unaweza kumaanisha “hakumrudia tena” au “hakuendelea kumrudia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: Kisha akangoja
  rationale: Kitenzi יחל katika muktadha huu kina maana ya kungoja. “Kisha” kinaendeleza mtiririko wa simulizi unaoonyeshwa na waw-consecutive.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: siku nyingine saba
  rationale: Kirai hiki kinaonyesha kipindi kingine cha siku saba; “siku nyingine saba” ni Kiswahili cha kawaida na huhifadhi wazo la kurudia muda uliotangulia.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: akamwachilia yule hua
  rationale: שׁלח humaanisha kutuma au kuachilia. Katika mazingira ya kumtoa ndege kutoka safinani, “akamwachilia” ni ya asili na huonyesha kwamba Nuhu alimruhusu aende bila kuongeza maelezo yasiyokuwapo. Kiambishi cha ngeli m- kinapatana na “hua.”
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  choice: naye hakumrudia tena
  rationale: Muundo uliokanushwa wa יסף pamoja na שׁוּב na עוֹד unaweza kumaanisha kwamba hua hakurudi tena au hakumrudia tena kuanzia hapo. “Hakumrudia tena” ni fupi, ya kawaida, na huhifadhi maana ya kurudi kwa Nuhu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wa heshima. “Hua” limetumiwa kwa יּוֹנָה, na kiambishi cha ngeli ya viumbe hai kimetumika kwa lugha ya kawaida. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
