translation:
  language: sw
  text: Akasema, “Ikiwa Esau atakuja kwenye kambi moja na kuishambulia, basi kambi iliyobaki itaokoka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kambi iliyobaki itakuwa kwa ajili ya kuponyoka,” yaani, itasalimika au itaepuka kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Muundo wa kawaida wa usimulizi wa Kiebrania; ‘akasema’ huendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: אִם
  choice: Ikiwa
  rationale: Huhifadhi wazi hali ya sharti na kutokuwa na uhakika katika mawazo ya Yakobo.
- source_word: יָבֹא
  choice: atakuja
  rationale: Huhifadhi maana ya msingi ya ‘kuja’; tendo la uhasama linaelezwa na kitenzi kinachofuata.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: kwenye kambi moja
  rationale: Hurejelea moja kati ya kambi mbili alizokuwa amezigawa Yakobo; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְהִכָּהוּ
  choice: na kuishambulia
  rationale: Ingawa נכה kimsingi ni ‘kupiga,’ hapa muktadha wa kambi na tishio la Esau hufanya ‘kuishambulia’ kuwa Kiswahili cha kawaida bila kuunganisha maana hiyo na kitenzi ‘kuja.’ Kiambishi ‘i’ hurejelea kambi kama kundi.
- source_word: וְהָיָה
  choice: basi ... itaokoka
  rationale: ‘Basi’ huonyesha matokeo ya sharti kwa Kiswahili cha kawaida.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: kambi iliyobaki
  rationale: Huwasilisha kwa uwazi kile kilichosalia baada ya kambi nyingine kushambuliwa.
- source_word: לִפְלֵיטָה
  choice: itaokoka
  rationale: Nomino פְלֵיטָה huonyesha kuponyoka au kusalimika; ‘itaokoka’ huwasilisha kwa kawaida matokeo ya kunusurika maangamizi.
