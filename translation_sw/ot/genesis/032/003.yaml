  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: sw
  text: Yakobo alipowaona, alisema, “Hii ni kambi ya Mungu.” Kwa hiyo akapaita mahali pale Mahanaimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Mahanaimu linasikika kama maneno ya Kiebrania yanayomaanisha “kambi mbili” au “kambi maradufu,” likiitikia maneno ya Yakobo, “Hii ni kambi ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאָם
  choice: alipowaona
  rationale: Kiambishi cha Kiebrania ni cha wingi wa kiume na kinawarejelea malaika wa Mungu waliotajwa katika mstari uliotangulia; muundo wa wakati ‘alipowaona’ unasikika kwa kawaida katika Kiswahili.
- source_word: מַחֲנֵה אֱלֹהִים זֶה
  choice: Hii ni kambi ya Mungu
  rationale: ‘Kambi’ linaendeleza maana ya מַחֲנֶה na mchezo wa maneno unaohusiana na jina Mahanaimu; ‘ya Mungu’ linaonyesha wazi uhusiano wa umilikaji katika muundo wa Kiebrania.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: akapaita mahali pale
  rationale: Hii ni tafsiri ya kawaida na wazi ya nahau ya Kiebrania ‘akaliita jina la mahali pale,’ bila kuleta ugumu usio wa lazima katika Kiswahili.
- source_word: מַחֲנָיִם
  choice: Mahanaimu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa katika matini kuu; umbo lake la Kiebrania linalodokeza ‘kambi mbili’ limeelezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye hadhi. ‘Kwa hiyo’ linaonyesha matokeo ya kauli ya Yakobo, na ‘Mahanaimu’ limehifadhiwa kama jina maalumu huku mchezo wa maneno ukifafanuliwa katika tanbihi.
