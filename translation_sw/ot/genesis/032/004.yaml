  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: sw
  text: Yakobo akatuma wajumbe wamtangulie kwenda kwa Esau ndugu yake, katika nchi ya Seiri, eneo la Edomu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “uwanja wa Edomu”; inaelekea kuwa jina la eneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Kitenzi cha masimulizi kimetafsiriwa kwa wakati wa mfululizo wa matukio, kwa namna ya kawaida katika simulizi la Kiswahili.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa na Yakobo, si malaika; “wajumbe” ni neno la kawaida na lenye hadhi.
- source_word: לְפָנָיו
  choice: wamtangulie
  rationale: Kirai hicho ni halisi ‘mbele yake’; hapa kinaonyesha kuwa walienda kabla ya Yakobo.
- source_word: אֶל עֵשָׂו אָחִיו
  choice: kwenda kwa Esau ndugu yake
  rationale: Huhifadhi mlengwa wa ujumbe na uhusiano wa kindugu kwa mpangilio wa asili wa Kiswahili.
- source_word: אַרְצָה שֵׂעִיר
  choice: katika nchi ya Seiri
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea huko; baada ya “kwenda,” ‘katika nchi ya Seiri’ hutoa Kiswahili cha asili huku likihifadhi neno ‘nchi.’
- source_word: שְׂדֵה אֱדֹם
  choice: eneo la Edomu
  rationale: Ingawa maana ya neno kwa neno ni ‘uwanja/shamba la Edomu,’ hapa kirai kinafanya kazi kama jina la eneo; ‘eneo’ ni la asili na halidokezi shamba la kilimo.
