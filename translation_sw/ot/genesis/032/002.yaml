lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: Yakobo
  rationale: Kiunganishi cha Kiebrania kinaendelezwa kwa mtiririko wa simulizi kupitia muundo wa sentensi; jina linatoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: הָלַךְ לְ/דַרְכּ/וֹ
  choice: akaendelea na safari yake
  rationale: Kirai hiki kwa maana halisi kinahusu Yakobo kwenda katika njia yake; tafsiri hii ya Kiswahili inaonyesha kwa kawaida kwamba aliendelea kusafiri.
- source_word: וַ/יִּפְגְּעוּ ב/וֹ
  choice: wakakutana naye
  rationale: Kitenzi פגע pamoja na ב kinaweza kumaanisha kukutana na mtu au kumfikia. 'Wakakutana naye' ni cha kawaida na hakiongezi wazo la uhasama au ajali.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: malaika wa Mungu
  rationale: Ingawa מַלְאָךְ inaweza kumaanisha mjumbe, muktadha wa kambi ya Mungu katika mstari unaofuata unaelekeza kwa viumbe wa mbinguni; muundo wa 'wa Mungu' pia unahifadhi kirai cha uhusiano cha Kiebrania.
theological_decisions:
- issue: Rejeo la מַלְאֲכֵי אֱלֹהִים
  choice: malaika wa Mungu, yaani viumbe wa mbinguni
  alternative: wajumbe wa Mungu
  rationale: Neno la Kiebrania linaweza kutaja wajumbe wa kibinadamu, lakini kutajwa kwa 'kambi ya Mungu' katika mstari unaofuata kunaunga mkono kwa nguvu maana ya viumbe wa mbinguni.
- issue: Namna ya kuelewa וַיִּפְגְּעוּ בוֹ
  choice: wakakutana naye
  alternative: wakamfikia / wakamkuta
  rationale: Tafsiri haibainishi ikiwa mkutano huo ulipangwa au ulitokea bila kutarajiwa, hivyo inadumisha upana wa maana ya kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Akaendelea na safari yake' ni ya kawaida kuliko tafsiri sisisi 'akaenda kwa njia yake,' huku 'malaika wa Mungu' ikidumisha lugha ya kibiblia inayoeleweka kwa urahisi.
