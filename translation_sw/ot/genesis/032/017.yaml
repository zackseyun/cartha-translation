  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: sw
  text: Akakabidhi kila kundi la wanyama peke yake kwa watumishi wake[a], akawaambia watumishi wake, “Nendeni mbele yangu, na mwache nafasi kati ya kundi moja na jingine[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi “katika mkono wa watumishi wake,” yaani, chini ya mamlaka au uangalizi wao.
    reason: lexical_alternative
  - marker: b
    text: Au, “na wekeni mwanya kati ya kundi na kundi.” Urudiaji wa Kiebrania unasisitiza kutenganishwa kwa kila kundi na jingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד
  choice: Akakabidhi ... kwa
  rationale: Muundo huu kwa kawaida una maana ya kuweka kitu chini ya mamlaka au uangalizi wa mtu. ‘Akakabidhi ... kwa’ ni Kiswahili cha asili kinachowasilisha maana hiyo bila kulazimisha nahau ya Kiebrania ‘katika mkono wa’.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha huu neno linawahusu watu wa nyumba ya Yakobo wanaotekeleza maagizo yake; hadhi yao ya kisheria haijasisitizwa. ‘Watumishi’ ni chaguo linalofaa na lenye heshima.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: kila kundi la wanyama peke yake
  rationale: 'Urudiaji wa עֵדֶר una nguvu ya mgawanyo: kila kundi lilitengwa na mengine. ‘Kundi la wanyama’ huepuka kudokeza aina moja tu ya mifugo, nayo ‘peke yake’ huhifadhi לְבַדּוֹ.'
- source_word: עִבְרוּ לְפָנַי
  choice: Tangulieni mbele yangu
  rationale: Katika safari hii, kitenzi kinamaanisha kusonga na kwenda mbele ya Yakobo, si lazima kuvuka kitu maalumu. ‘Tangulieni mbele yangu’ ni agizo la kawaida na wazi katika Kiswahili.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: na mwache nafasi
  rationale: רֶוַח ni nafasi au mwanya, na שׂים hapa ni kufanya nafasi hiyo iwepo. Kiswahili cha kawaida husema ‘kuacha nafasi’ kati ya makundi.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: kati ya kundi moja na jingine
  rationale: Usemi huu huwasilisha kwa kawaida urudiaji wa Kiebrania na wazo la kutenganisha kila kundi na linalofuata.
