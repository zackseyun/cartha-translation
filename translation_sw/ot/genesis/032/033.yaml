  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: sw
  text: Kwa sababu hiyo, mpaka leo wana wa Israeli[a] hawali kano ya nyonga[b] iliyo kwenye kiungo cha paja, kwa sababu aligusa kiungo cha paja la Yakobo kwenye kano ya nyonga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Waisraeli; kwa neno moja moja Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kinamaanisha kano fulani katika eneo la nyonga au paja. Wengine huitambulisha kwa namna mahsusi zaidi kuwa neva ya siatika au kano inayohusiana nayo.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa sababu hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuwa desturi inayotajwa inatokana na tukio lililosimuliwa.
- source_word: לֹא יֹאכְלוּ
  choice: hawali
  rationale: Kauli hasi ya wakati usiotimilifu inaeleza desturi inayoendelea; wakati wa sasa wa Kiswahili unafaa kwa maana hiyo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi usemi wa kifamilia wa Kiebrania na uhusiano wake wa karibu na Yakobo, aliyeitwa Israeli, huku ikiwa bado inaeleweka kwa Kiswahili.
- source_word: גִּיד הַנָּשֶׁה
  choice: kano ya nyonga
  rationale: “Kano” ni neno pana kwa tishu kama utepe ambalo halilazimishi utambulisho wa kitaalamu usio na hakika; “ya nyonga” huonyesha eneo linalokusudiwa katika muktadha.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: iliyo kwenye tundu la paja
  rationale: “Tundu” huwasilisha wazo la sehemu iliyobonyea au soketi, na “paja” hudumisha rejeo la יָרֵךְ bila kulifanya kuwa istilahi ya kitaalamu kupita kiasi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa desturi iliyodumu hadi wakati wa msimulizi.
- source_word: כִּי נָגַע
  choice: kwa sababu aligusa
  rationale: נגע kimsingi ni “gusa”; tafsiri hii haiongezi wazo la kupiga, ingawa mguso huo ulikuwa na nguvu katika muktadha.
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב
  choice: tundu la paja la Yakobo
  rationale: Inatafsiri maneno ya sehemu ya mwili kwa uthabiti na kifungu cha awali.
- source_word: בְּגִיד הַנָּשֶׁה
  choice: kwenye kano ya nyonga
  rationale: Kihusishi kimetafsiriwa kwa maana ya mahali pa mguso, na kirai kilichorudiwa kimewasilishwa kwa maneno yaleyale.
