  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: sw
  text: Akasema, “Hutaitwa tena Yakobo, bali Israeli, kwa maana umeshindana na Mungu[a] na wanadamu[b], nawe umeshinda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viumbe vya kiungu.” Neno la Kiebrania אֱלֹהִים katika miktadha mbalimbali linaweza kumaanisha Mungu, miungu, au viumbe vya mbinguni. Hapa matini kuu imetumia “Mungu” kwa sababu ya muktadha wa simulizi.
    reason: alternative_reading
  - marker: b
    text: Au, “wanaume” au “watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: halitaitwa
  rationale: Katika kauli ya kubadili jina, kitenzi hiki cha hali ya kutendwa kinamaanisha kwa kawaida ‘kuitwa’; muundo wa Kiswahili ni wa asili na unadumisha tamko rasmi la jina.
- source_word: עוֹד
  choice: tena
  rationale: Pamoja na ukanushi ‘hali-’, neno ‘tena’ linaonyesha kwamba jina la zamani halitaendelea kutumiwa.
- source_word: כִּי אִם
  choice: bali
  rationale: 'Huu ni utofautishaji wa majina: si Yakobo tena, bali Israeli.'
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili; mchezo wa maneno unaohusiana nalo unaendelezwa na kitenzi ‘umeshindana’.
- source_word: שָׂרִיתָ
  choice: umeshindana
  rationale: Kitenzi kina maana ya kushindana au kupambana na kinaeleza jina Israeli kwa mchezo wa maneno. ‘Umeshindana’ ni wazi bila kuifanya sentensi iwe ya kimwili kupita kiasi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu, rejeo la umoja ‘Mungu’ linafaa zaidi na linahifadhi uzito wa fumbo la pambano; uwezekano wa maana nyingine umeonyeshwa katika tanbihi.
- source_word: אֲנָשִׁים
  choice: wanadamu
  rationale: Katika utofautishaji na Mungu, ‘wanadamu’ ni Kiswahili cha kawaida na chenye hadhi kwa watu wa kibinadamu. Maana mahususi zaidi ya ‘wanaume’ imehifadhiwa katika tanbihi.
- source_word: וַתּוּכָל
  choice: nawe umeshinda
  rationale: Katika muktadha wa pambano, kitenzi יכל kinaonyesha kufanikiwa au kuwa na nguvu ya kustahimili. ‘Umeshinda’ ni usemi mfupi na wa kawaida, huku ‘nawe’ ikihifadhi mkazo wa matokeo.
theological_decisions:
- issue: Rejeo la אֱלֹהִים katika maelezo ya jina
  choice: Mungu
  alternative: viumbe vya kiungu
  rationale: Simulizi linaeleza tukio kama kukutana na Mungu, ingawa utambulisho wa mpambanaji unabaki na fumbo. Tafsiri kuu ‘Mungu’ inadumisha mvutano huo badala ya kuamua kwamba alikuwa kiumbe wa daraja la chini; tanbihi inalinda uwezekano wa kileksia.
- issue: Maana ya אֲנָשִׁים
  choice: wanadamu
  alternative: wanaume
  rationale: ‘Wanadamu’ huunda utofautishaji wa kawaida wa Kiswahili kati ya Mungu na binadamu wote, ilhali nomino ya Kiebrania inaweza pia kusomwa kwa maana mahususi ya wanaume; tanbihi inahifadhi uwezekano huo.
- issue: Nguvu ya וַתּוּכָל baada ya kushindana na Mungu
  choice: umeshinda
  alternative: umefaulu / umeweza kustahimili
  rationale: ‘Umeshinda’ hudumisha lugha yenye nguvu ya matini bila kufafanua kwa lazima kwamba Yakobo alimshinda Mungu kabisa; namna halisi ya ushindi huo inaachwa katika mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa sentensi unabaki karibu na tamko la Kiebrania huku ukitumia mpangilio wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
