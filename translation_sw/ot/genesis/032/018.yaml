base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: sw
  text: Akamwamuru yule wa kwanza, akisema, “Esau, ndugu yangu, atakapokutana nawe na kukuuliza, ‘Wewe ni wa nani? Unakwenda wapi? Na hawa walio mbele yako ni wa nani?’...”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: yule wa kwanza
  rationale: Hurejelea mtumishi aliyekuwa wa kwanza katika mpangilio wa makundi, bila kuongeza maelezo yasiyomo katika mstari.
- source_word: כִּי יִפְגָּשְׁךָ
  choice: atakapokutana nawe
  rationale: כִּי hapa inaanzisha hali inayotarajiwa; muundo wa Kiswahili wa wakati unaofaa huwasilisha maana hiyo kwa kawaida.
- source_word: לְמִי אַתָּה
  choice: Wewe ni wa nani?
  rationale: Huhifadhi usemi mfupi wa Kiebrania unaouliza mtu huyo ni wa nani, yaani yuko chini ya nani au anamhudumia nani, bila kuufafanua kupita kiasi.
- source_word: וְאָנָה תֵלֵךְ
  choice: Unakwenda wapi?
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya swali kuhusu mahali anakoelekea.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: Na hawa walio mbele yako ni wa nani?
  rationale: Huhifadhi swali la umiliki na maana ya nafasi ya לְפָנֶיךָ, bila kubainisha kwamba ni mifugo ingawa muktadha unaonyesha hivyo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya Kiebrania לֵאמֹר baada ya ‘kukuuliza’ hayajarudiwa kama ‘akisema’ kwa kuwa yangekuwa mazito na yasiyo ya kawaida katika Kiswahili; maudhui ya usemi wa moja kwa moja yamehifadhiwa. Alama ya kuendelea (...) imedumishwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
