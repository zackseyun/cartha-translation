  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: sw
  text: Yakobo akaachwa peke yake, na mtu mmoja[b] akapigana mieleka naye mpaka alfajiri ilipochomoza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka mapambazuko”; kihalisi, “mpaka kuchomoza kwa alfajiri.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “mtu mmoja”; muktadha unaofuata na Hosea 12:4 huchangia utambulisho mpana zaidi wa mhusika huyo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: akabaki
  rationale: Nifali ya יתר ina maana ya kuachwa au kubaki baada ya wengine kuondoka. Katika Kiswahili, “akabaki” ni ya asili na inaonyesha vizuri hali ya Yakobo baada ya wengine kuvuka.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: Hii ndiyo njia ya kawaida na wazi ya kueleza kwamba Yakobo hakuwa na mtu mwingine pamoja naye.
- source_word: וַיֵּאָבֵק
  choice: akapigana mieleka
  rationale: Kitenzi hiki adimu kinaeleza kushikana na kupambana kimwili, yaani kupigana mieleka, si kupambana kwa maana pana tu.
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: Kiebrania kinamtaja mhusika kwanza kama אִישׁ, “mtu/mwanamume.” “Mtu mmoja” ni ya asili katika simulizi la Kiswahili na haimtambulishi mapema kuwa malaika au Mungu.
- source_word: עִמּוֹ
  choice: naye
  rationale: Kiambishi “naye” kinaonyesha kwa ufupi na kwa kawaida kwamba mtu huyo alipigana mieleka na Yakobo.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: mpaka alfajiri ilipoanza kupambazuka
  rationale: Kifungu hicho kihalisi kinahusu kuchomoza kwa alfajiri. Tafsiri hii ni ya asili katika Kiswahili na inadumisha taswira ya nuru ya asubuhi kuanza kutokea.
theological_decisions:
- issue: Utambulisho wa אִישׁ katika tukio la mieleka
  choice: Kutafsiri “mtu mmoja” bila kumtambulisha zaidi katika matini kuu.
  alternative: “malaika” au “Mungu/BWANA akiwa katika sura ya mwanadamu”
  rationale: Mstari huu wenyewe unamtaja tu kama אִישׁ. Muktadha unaofuata na Hosea 12:4 huchangia utambulisho wake mpana, lakini tafsiri hapa inapaswa kudumisha fumbo na mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida, wazi na wenye heshima. Alama za tanbihi zimewekwa baada ya kishazi kinachohusu muda wa alfajiri; kila alama inaonekana katika matini kuu.
