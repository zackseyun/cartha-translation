base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: sw
  text: Labani akaamka asubuhi na mapema, akawabusu wanawe na binti zake[a] na kuwabariki. Kisha Labani akaondoka, akarudi mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wanawe na binti zake.” Huenda maneno haya yanawahusu wazao wa Labani, yaani wajukuu wake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: akaamka asubuhi na mapema
  rationale: Kitenzi שׁכם katika Hifili humaanisha kuamka au kuanza mapema; usemi huu ni wa kawaida katika Kiswahili na unahifadhi msisitizo wa wakati.
- source_word: וַיְנַשֵּׁק
  choice: akawabusu
  rationale: נשׁק hapa inaeleza busu la kifamilia wakati wa kuagana; ‘akawabusu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: wanawe wa kiume na binti zake
  rationale: Maneno ya Kiebrania yanataja jinsia zote mbili kwa wazi. Tafsiri hii inahifadhi tofauti hiyo na kuepuka kutumia ‘watoto’ pekee, huku tanbihi ikieleza kwamba huenda yanawahusu wajukuu wake.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: na kuwabariki
  rationale: ברך humaanisha ‘kubariki.’ Muundo huu unaunganisha kwa kawaida matendo mawili yaliyofanywa kwa watu wale wale bila kupunguza maana ya baraka ya kuagana.
- source_word: וַיֵּלֶךְ
  choice: akaondoka
  rationale: Maana ya msingi ni kwenda; ‘akaondoka’ huonyesha vizuri kuondoka kwake na huepuka urudiaji usio wa lazima kabla ya ‘akarudi.’
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: שׁוב humaanisha kurudi, na hapa inaendeleza mfululizo wa matendo ya simulizi.
- source_word: לִמְקֹמוֹ
  choice: mahali pake
  rationale: מקום ni ‘mahali.’ Tafsiri hii inabaki karibu na maandishi ya Kiebrania bila kuongeza dhana ya ‘nyumbani,’ ingawa huenda ndiyo inayokusudiwa katika muktadha.
theological_decisions:
- issue: Maneno ya ukoo yanayotaja jinsia
  choice: wanawe wa kiume na binti zake
  alternative: watoto wake; wajukuu wake
  rationale: Kiebrania kinataja ‘wana’ na ‘binti’ kwa wazi. Main text inahifadhi maumbo hayo, huku tanbihi ikiacha wazi matumizi mapana ya maneno ya ukoo ambayo yanaweza kuwahusu wazao, hasa wajukuu, bila kulazimisha ufafanuzi huo ndani ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. ‘Wanawe wa kiume’ limetumiwa ili kuonyesha wazi tofauti ya Kiebrania kati ya wana na binti; ‘mahali pake’ linahifadhi kutokuwa bayana kwa neno la asili.
