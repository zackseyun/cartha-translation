    text: Au, “hauwezi kupewa idadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinakazia tofauti kati ya hatari iliyopo na ahadi ya Mungu; “Lakini wewe” huleta nguvu hiyo ya upinzani kwa Kiswahili cha kawaida.
- source_word: אָמַרְתָּ
  choice: ulisema
  rationale: Kitenzi cha Qal perfect nafsi ya pili umoja wa kiume kinarejelea jambo ambalo Mungu alisema hapo awali.
- source_word: הֵיטֵב אֵיטִיב
  choice: Hakika nitakutendea mema
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unatia mkazo ahadi; “Hakika” huhifadhi msisitizo huo, na “nitakutendea mema” huonyesha tendo la kumletea mtu mema bila kulibana kuwa ustawi wa mali pekee.
- source_word: עִמָּךְ
  choice: -ku- katika “nitakutendea”
  rationale: Ingawa kihalisi ni “pamoja nawe,” katika nahau hii humtaja mtu anayefanyiwa mema; Kiswahili huonyesha hilo kwa kiambishi cha yambwa.
- source_word: וְשַׂמְתִּי
  choice: nami nitaufanya ... uwe
  rationale: Katika muktadha wa kuufanya uzao kuwa mwingi, שׂים ina maana ya kisababishi “kufanya uwe,” si maana ya moja kwa moja ya “kuweka.”
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: “Uzao” huhifadhi hali ya nomino ya mkusanyiko ya זֶרַע na hufaa kwa watu wanaotokana na Yakobo bila kutumia “mbegu” kwa namna isiyo ya kawaida katika Kiswahili hiki.
- source_word: כְּחוֹל הַיָּם
  choice: kama mchanga wa bahari
  rationale: Huu ni mfano wa moja kwa moja wa Kiebrania unaoeleweka kwa urahisi na kuhifadhi taswira ya wingi usiohesabika.
- source_word: אֲשֶׁר לֹא יִסָּפֵר
  choice: ambao hauwezi kuhesabiwa
  rationale: Niphal imperfect inaonyesha kutowezekana kuhesabu kwa vitendo; tafsiri hii ni ya asili na haiugeuzi kuwa wakati ujao tu.
- source_word: מֵרֹב
  choice: kwa sababu ya wingi wake
  rationale: מן pamoja na רֹב hutoa sababu ya kutohesabika kwa mchanga, yaani wingi wake mkubwa.
