translation:
  language: sw
  text: Lakini wewe ulisema, “Hakika nitakutendea mema[a], nami nitaufanya uzao wako[b] uwe kama mchanga wa bahari, ambao hauwezi kuhesabiwa[c] kwa sababu ya wingi wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hakika nitakufanyia mema.” Kiebrania kinatumia kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo ili kutia mkazo.
    reason: lexical_alternative
  - marker: b
    text: Au, “wazao wako.” Neno la Kiebrania זֶרַע ni nomino ya umoja yenye maana ya mkusanyiko wa watu wanaotokana na mtu.
    reason: lexical_alternative
