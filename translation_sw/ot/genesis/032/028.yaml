lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Akamwambia
  rationale: Kitenzi אמר pamoja na kihusishi אֶל na kiambishi cha nafsi ya tatu ya kiume kinaendeleza simulizi na kuonyesha kuwa maneno yanaelekezwa kwake. “Akamwambia” ni Kiswahili cha kawaida na fasaha.
- source_word: מַה שְּׁמֶךָ
  choice: Jina lako ni nani?
  rationale: Kirai cha Kiebrania kinauliza moja kwa moja jina la mtu. Katika Kiswahili sanifu, “Jina lako ni nani?” ni swali la kawaida na la asili, huku likihifadhi neno “jina.”
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Neno אמר ni kitenzi cha kawaida cha kusema. Ingawa hapa ni jibu, “akasema” huhifadhi uchaguzi wa Kiebrania bila kulifafanua zaidi kuwa “akajibu.”
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina hili limetolewa kwa umbo lake la Kiswahili linalotumika kwa kawaida katika mapokeo ya Biblia.
