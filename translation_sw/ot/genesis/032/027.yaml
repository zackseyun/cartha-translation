  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: sw
  text: Akasema[a], “Niachilie, kwa maana kumepambazuka[b].” Lakini akasema[c], “Sitakuachilia usiponibariki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niruhusu niende” au “Nipe ruhusa niondoke.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mapambazuko yamechomoza.”'
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hakitambui wazi wazungumzaji katika mstari huu; utambulisho wao hufahamika kutokana na simulizi linalozunguka mstari huu.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Niachilie
  rationale: Kauli ya kuamuru ya שׁלח pamoja na kiambishi cha nafsi ya kwanza inaweza kumaanisha kumwachilia au kumruhusu mtu aende. Katika muktadha wa kushindana kwa mieleka, “Niachilie” ni ya asili na inadumisha mzizi uleule unaorudiwa katika jibu.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: kwa maana kumepambazuka
  rationale: כִּי inaonyesha sababu, nayo עָלָה הַשָּׁחַר inaeleza mapambazuko yaliyofika au kuchomoza. “Kumepambazuka” ni Kiswahili cha kawaida na chenye hadhi, huku tanbihi ikihifadhi taswira halisi ya mapambazuko kuchomoza.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: Sitakuachilia
  rationale: Kitenzi kisichotimilika pamoja na ukanushi kinaonyesha kukataa kwa uthabiti. “Sitakuachilia” hurudia wazo na mzizi wa usemi wa kwanza.
- source_word: כִּי אִם
  choice: usipo-
  rationale: Muungano huu unaweka sharti la pekee. Muundo wa Kiswahili “usiponibariki” huwasilisha kwa ufupi maana ya ‘isipokuwa/unless.’
- source_word: בֵּרַכְתָּנִי
  choice: nibariki
  rationale: Ingawa Kiebrania kina umbo timilifu, baada ya כִּי אִם tendo hili ndilo sharti la kumwachilia. Kiswahili “nibariki” huonyesha tendo linalodaiwa kwa kawaida bila kulifanya kuwa tendo la wakati uliopita.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Akasema ... Lakini akasema
  rationale: Kiebrania hurudia ‘akasema,’ lakini mzungumzaji hubadilika. “Lakini” huonyesha jibu la kupinga kwa njia ya asili bila kutaja utambulisho ambao maandishi hayajaweka wazi.
theological_decisions:
- issue: Utambulisho wa wazungumzaji
  choice: 'Kudumisha vitenzi vyenye kiima kisichotajwa: “Akasema ... akasema.”'
  alternative: Kutaja wazi “yule mtu,” “Yakobo,” “malaika,” au “Mungu.”
  rationale: Katika mstari huu Kiebrania hakitaji majina wala nomino za wazungumzaji; nafsi zao hudokezwa tu na muktadha. Kutowataja kunahifadhi mvutano na utata halisi wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Niachilie” linafaa kwa muktadha wa kushikwa wakati wa mieleka; “kumepambazuka” ni la asili zaidi kuliko tafsiri ngumu ya taswira ya Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
