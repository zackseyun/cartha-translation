  text: Jua lilimchomozea alipokuwa akipita Penueli[a], naye alikuwa akichechemea kwa sababu ya paja lake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili limeandikwa hapa kwa Kiebrania kama Penueli; mahali pengine pia huandikwa Penieli.
