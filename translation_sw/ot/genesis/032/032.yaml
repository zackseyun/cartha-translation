    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: Jua lilimwangazia
  rationale: Muundo huu unasema jua lilichomoza au kumwangazia mtu. Kiswahili hiki ni cha kawaida na kinadumisha mtazamo kwamba mwanga wa jua ulimfikia yeye.
- source_word: כַּאֲשֶׁר עָבַר
  choice: alipokuwa akipita
  rationale: Kauli hii inaonyesha tukio la kupita lililoambatana kwa wakati na jua kumwangazia.
- source_word: פְּנוּאֵל
  choice: Penueli
  rationale: Jina limenukuliwa kwa namna inayosomeka kwa Kiswahili huku likifuata umbo la Kiebrania la aya hii, Penuel, badala ya kulisawazisha na Penieli.
- source_word: וְהוּא צֹלֵעַ
  choice: naye alikuwa akichechemea
  rationale: Kitenzi shirikishi cha Kiebrania kinaonyesha hali au tendo linaloendelea; 'alikuwa akichechemea' huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עַל יְרֵכוֹ
  choice: kwa sababu ya paja lake
  rationale: Ingawa עַל kimsingi inaweza kuwa 'juu ya/kwenye,' hapa inaweza kueleza sababu ya kuchechemea. יָרֵךְ ni paja au sehemu ya juu ya mguu; tafsiri hii ni wazi bila kuingiza moja kwa moja 'kiuno' kutoka muktadha uliotangulia.
theological_decisions:
- issue: Uhusiano unaoonyeshwa na עַל יְרֵכוֹ
  choice: kwa sababu ya paja lake
  alternative: kwenye paja lake / kwa paja lake
  rationale: Kiswahili cha mahali kingesikika kana kwamba mtu anachechemea juu ya paja lake. Maana ya sababu inafaa katika muktadha, lakini tanbihi inahifadhi usemi wa karibu zaidi na Kiebrania na kutotatua kabisa uwezekano wake wa kisemantiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Akichechemea' ni wazi kwa wasomaji wa kawaida; 'paja' linadumisha istilahi ya aya badala ya kuingiza kwa uhakika zaidi 'nyonga' kutokana na aya iliyotangulia.
