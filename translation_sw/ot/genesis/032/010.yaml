  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: sw
  text: Kisha Yakobo akasema, “Ee Mungu wa baba yangu Abrahamu, na Mungu wa baba yangu Isaka, ee Yahwe, uliyeniambia, ‘Rudi katika nchi yako na kwa jamaa zako[a], nami nitakutendea mema[b],’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na mahali pa asili yako”; neno la Kiebrania linaweza kumaanisha jamaa au mahali pa asili.
    reason: lexical_ambiguity
  - marker: b
    text: Au “nitakutendea vyema.” Kiebrania ni idiomu yenye maana ya kumtendea mtu kwa wema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: Kisha Yakobo akasema
  rationale: Muundo wa simulizi unaoanza kwa waw unaendeleza tukio. “Kisha” huonyesha mwendelezo huo kwa Kiswahili cha kawaida bila kulazimisha uhusiano mkali zaidi wa wakati.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: Ee Mungu wa baba yangu Abrahamu, na Mungu wa baba yangu Isaka
  rationale: “Ee” huonyesha wazi kuwa haya ni maneno ya kumwomba Mungu moja kwa moja; virai vya Kiebrania vinavyotaja uhusiano vimehifadhiwa kwa namna ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: הָאֹמֵר אֵלַי
  choice: uliyeniambia
  rationale: Kirai cha Kiebrania chenye participo kinaeleza Yahwe kuwa ndiye aliyesema na Yakobo. Kauli ya uhusiano “uliyeniambia” ni ya asili na wazi katika Kiswahili.
- source_word: שׁוּב לְאַרְצְךָ
  choice: Rudi katika nchi yako
  rationale: “Rudi” hudumisha maana ya kijiografia ya שוב, na “nchi yako” inawakilisha לְאַרְצְךָ bila kuibana kuwa mahali maalumu zaidi.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: na kwa jamaa zako
  rationale: מוֹלֶדֶת inaweza kuonyesha ukoo au mahali pa asili. “Jamaa zako” inafaa katika muktadha wa kurudi kwa watu wa ukoo, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: nami nitakutendea mema
  rationale: Hiphil ya יטב pamoja na עִם huonyesha kumtendea mtu kwa wema. “Nitakutendea mema” ni Kiswahili cha kawaida kinachohifadhi ahadi ya kumfadhili Yakobo bila kutoa dhana isiyokusudiwa ya kufanya matendo mema pamoja naye.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina na huepuka kulibadilisha kimya kimya kuwa “BWANA.”
- issue: Nguvu ya ahadi וְאֵיטִיבָה עִמָּךְ
  choice: nitakutendea mema
  alternative: nitakutendea vyema; nitafanya mambo yaende vyema kwako
  rationale: Chaguo hili linaonyesha wema wa Mungu unaoelekezwa kwa Yakobo bila kufafanua mapema aina au matokeo ya wema huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sala lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” limetumiwa kuonyesha mwito wa moja kwa moja, na sentensi imehifadhiwa kama sehemu inayoendelea katika muktadha mpana.
