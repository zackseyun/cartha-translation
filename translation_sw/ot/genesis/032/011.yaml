source:
  edition: WLC
  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: sw
  text: Sistahili[a] wema wote wa kudumu[b] wala uaminifu wote uliomtendea mtumishi wako, kwa maana nilivuka Yordani hii nikiwa na fimbo yangu, na sasa nina kambi mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno kwa neno husema, “Mimi ni mdogo kuliko wema wote ...” Hii ni nahau ya unyenyekevu inayoonyesha kwamba Yakobo hakujiona kuwa anastahili ukarimu wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania liko katika wingi na linaweza pia kutafsiriwa, “matendo yote ya wema wa kudumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: Sistahili
  rationale: Kitenzi hiki kwa maana ya msingi ni ‘nimekuwa mdogo’ au ‘mimi ni mdogo,’ lakini hapa ni nahau ya unyenyekevu inayoonyesha kuwa Yakobo hajioni kuwa anastahili ukarimu wa Mungu.
- source_word: הַחֲסָדִים
  choice: wema wote wa kudumu
  rationale: חסד hueleza wema wa dhati, mwaminifu na unaodumu katika uhusiano. Ingawa neno la Kiebrania liko katika wingi na linaweza kuelekeza kwenye matendo mengi ya wema, Kiswahili cha kawaida hutumia ‘wema wote’ kwa maana ya jumla bila kupoteza wingi wa matendo yanayokusudiwa.
- source_word: הָאֱמֶת
  choice: uaminifu wote
  rationale: Katika jozi hii pamoja na חסד, אמת humaanisha kutegemeka au uaminifu katika uhusiano, si ‘ukweli’ wa kinadharia tu.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: ambao umemtendea mtumishi wako
  rationale: Tafsiri hii inafuata maana ya msingi ya ‘uliotenda kwa mtumishi wako’ na ni ya kawaida katika Kiswahili.
- source_word: בְמַקְלִי
  choice: nikiwa na fimbo yangu
  rationale: Hutoa maana ya ‘kwa/pamoja na fimbo yangu’ kwa Kiswahili cha asili bila kuongeza wazi neno ‘tu,’ ambalo linadokezwa na muktadha lakini halipo katika maandishi.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: nilivuka Yordani hii
  rationale: Inahifadhi tendo la kuvuka na kiashiria ‘hii,’ kinachoonyesha ukaribu wa mahali katika ombi la Yakobo.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: nimekuwa kambi mbili
  rationale: Inahifadhi picha halisi ya Kiebrania kwamba Yakobo na watu wake sasa wamegawanyika na kuwa kambi mbili, kama muktadha wa karibu unavyoonyesha.
theological_decisions:
- issue: Uwasilishaji wa חסד na אמת kuhusu matendo ya Mungu kwa Yakobo
  choice: wema wa kudumu na uaminifu
  alternative: fadhili na kweli; upendo thabiti na uaminifu
  rationale: Maneno haya mawili kwa pamoja yanaonyesha wema wa Mungu ulio mwaminifu katika uhusiano na kutegemeka kwake. Tafsiri iliyochaguliwa inatofautisha dhana hizo bila kuingiza kwa lazima istilahi maalumu ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘nimekuwa kambi mbili’ umeachwa kwa makusudi ili kuhifadhi picha thabiti na mvutano wa usemi wa Kiebrania.
