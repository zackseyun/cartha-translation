translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa na wenye staha. “Wajakazi” huepuka usemi mrefu katika mstari mkuu, huku tanbihi ikionyesha wazi uwezekano wa utumwa uliomo katika neno la Kiebrania.
