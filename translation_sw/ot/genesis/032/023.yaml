base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: sw
  text: Usiku huo akainuka, akawachukua wake zake wawili, wajakazi wake wawili[a], na watoto wake kumi na mmoja, akavuka kivuko cha Yaboki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa wake wawili wa kike.” Neno la Kiebrania שִׁפְחֹתָיו linawataja wanawake waliokuwa na hadhi ya chini katika nyumba na linaweza kumaanisha watumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Kitenzi קום hapa kinaonyesha kuinuka au kuondoka ili kuchukua hatua; “akaondoka” ni cha kawaida katika simulizi la Kiswahili na hakiongezi wazo lisilokuwamo.
- source_word: בַּלַּיְלָה הוּא
  choice: Usiku huo
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili inayohifadhi wakati maalumu unaosisitizwa na kirai cha Kiebrania.
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: לקח maana yake ya msingi ni “kuchukua”; kiambishi cha ngeli ya watu kinaifanya sentensi iwe ya kawaida bila kulazimisha maana ya ziada kama “akaongoza.”
- source_word: שְׁתֵּי נָשָׁיו
  choice: wake zake wawili
  rationale: Katika muktadha huu נָשִׁים inamaanisha wake, si wanawake kwa ujumla.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: wajakazi wake wawili
  rationale: שִׁפְחָה humaanisha mtumishi wa kike aliye chini ya mamlaka ya nyumba na huenda akawa mtumwa; “wajakazi” ni neno la Kiswahili lenye heshima ya kisimulizi, huku tanbihi ikihifadhi uwezekano wa hadhi ya utumwa.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: watoto wake kumi na mmoja
  rationale: יְלָדִים ni “watoto” au “wazao,” si lazima “wana”; tafsiri haipaswi kubadili neno ili kulinganisha hesabu kwa njia ya kiufafanuzi.
- source_word: וַיַּעֲבֹר
  choice: akavuka
  rationale: Katika muktadha wa safari עבר humaanisha kuvuka.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: kivuko cha Yaboki
  rationale: מַעֲבַר ni mahali pa kuvukia, yaani kivuko; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יַבֹּק
  choice: Yaboki
  rationale: Hili ni umbo la Kiswahili la jina la mto Jabbok, likifuata kawaida ya kuwakilisha konsonanti ya kwanza ya Kiebrania kwa Y na kuongeza irabu ya mwisho kwa urahisi wa matamshi.
