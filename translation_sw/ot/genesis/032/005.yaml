base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: sw
  text: 'Akawaamuru, akisema[c], “Mtamwambia hivi bwana wangu Esau: ‘Mtumishi wako[b] Yakobo anasema hivi: Nimeishi kama mgeni kwa Labani[a], nami nimebaki huko mpaka sasa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimekaa kwa Labani kama mgeni.” Kitenzi cha Kiebrania kinaweza kusisitiza kuishi mahali kama mtu wa nje.
    reason: lexical_alternative
  - marker: b
    text: “Mtumishi wako” ni namna ya Yakobo kujitaja kwa unyenyekevu mbele ya Esau; si lazima iwe kauli ya utumwa halisi.
    reason: cultural_note
  - marker: c
    text: 'Muundo wa Kiebrania unarudia fomula za kutanguliza usemi: “akisema,” “mtamwambia hivi,” na “anasema hivi.”'
    reason: discourse_structure
lexical_decisions:
- source_word: וַיְצַו
  choice: Akawaamuru
  rationale: Kitenzi צוה kina nguvu ya kutoa amri au agizo; “akawaamuru” kinahifadhi nguvu hiyo ya maelekezo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ni fomula ya kawaida ya Kiebrania ya kutanguliza maneno yanayofuata, nayo inasikika kwa kawaida katika Kiswahili.
- source_word: כֹּה תֹאמְרוּן
  choice: Mtamwambia hivi
  rationale: כֹּה hutanguliza ujumbe hususa unaopaswa kufikishwa; umbo hili ni la kawaida na wazi katika Kiswahili.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: bwana wangu Esau
  rationale: “Bwana wangu” ni cheo cha heshima ambacho Yakobo anatumia kwa Esau, si jina la Mungu wala dai la utumwa halisi.
- source_word: כֹּה אָמַר
  choice: anasema hivi
  rationale: Hii ni fomula ya mjumbe inayowasilisha ujumbe wa msemaji; wakati wa sasa ni wa kawaida katika Kiswahili kwa utangulizi huu.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika muktadha huu neno hilo ni namna ya unyenyekevu na heshima mbele ya Esau, si lazima limaanishe mtumwa halisi.
- source_word: גַּרְתִּי
  choice: Nimeishi kama mgeni
  rationale: גור hapa hudokeza kuishi mahali kama mtu wa nje au mgeni; tafsiri hii inahifadhi maana hiyo kuliko “nimekaa” peke yake.
- source_word: וָאֵחַר עַד עָתָּה
  choice: nami nimebaki huko mpaka sasa
  rationale: Katika muktadha huu אחר huonyesha kuendelea kukaa huko hadi wakati wa sasa, si kuchelewa kufika tu.
theological_decisions:
- issue: Maana ya “bwana wangu” na “mtumishi wako”
  choice: Yamehifadhiwa kama maneno ya heshima na unyenyekevu katika ujumbe wa Yakobo.
  alternative: Kuyatafsiri kama uhusiano halisi wa bwana na mtumwa.
  rationale: Muktadha wa ujumbe wa kidiplomasia unaunga mkono lugha ya kujishusha bila kulazimisha hitimisho kwamba Yakobo alikuwa mtumwa halisi wa Esau.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Usemi “kama mgeni” umewekwa wazi ili kuhifadhi wazo la kuishi kama mtu wa nje; “bwana” limeandikwa kwa herufi ndogo kwa kuwa hapa ni cheo cha heshima kwa Esau.
