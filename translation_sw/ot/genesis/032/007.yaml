base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: sw
  text: Wale wajumbe wakarudi kwa Yakobo[a], wakisema, “Tulifika kwa ndugu yako, Esau. Na yeye pia anakuja kukutana nawe, na wanaume mia nne wako pamoja naye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ingawa uwezekano huo ni mdogo katika muktadha huu, “malaika wakarudi kwa Yakobo.” Neno la Kiebrania מַלְאָכִים linaweza kumaanisha “wajumbe” au “malaika,” lakini hapa linawahusu watu ambao Yakobo aliwatuma kwa Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: wakarudi
  rationale: Kitenzi cha simulizi kutoka שוב kinaonyesha tendo lililokamilika; “wakarudi” ni cha kawaida na kinafaa kwa wajumbe waliorejea kwa Yakobo.
- source_word: הַמַּלְאָכִים
  choice: wale wajumbe
  rationale: מַלְאָכִים linaweza kumaanisha wajumbe au malaika, lakini hapa muktadha unawahusu watu ambao Yakobo aliwatuma kwa Esau.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Muundo huu hutanguliza maneno ya moja kwa moja; “wakisema” unadumisha mtiririko wa Kiebrania kwa Kiswahili cha asili.
- source_word: בָּאנוּ
  choice: Tulifika
  rationale: בוא hapa ni nafsi ya kwanza wingi iliyokamilika. “Tulifika” huwasilisha kwa kawaida kwamba wajumbe walimfikia Esau, bila kudokeza kuwa Esau alikuwa mahali pa msemaji sasa.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Huhifadhi uhusiano wa kifamilia ambao una uzito katika simulizi.
- source_word: אֶל עֵשָׂו
  choice: kwa Esau
  rationale: Kirai cha pili kinamtambulisha ndugu huyo kuwa Esau; urudiaji wa “kwa” unahifadhi msisitizo na ufafanuzi wa Kiebrania.
- source_word: וְגַם
  choice: Yeye pia
  rationale: גם huongeza taarifa muhimu kwamba Esau mwenyewe pia yuko njiani; “Yeye pia” huonyesha nguvu hiyo ya nyongeza.
- source_word: הֹלֵךְ
  choice: anakuja
  rationale: Ingawa הלך kimsingi ni kwenda au kutembea, pamoja na לִקְרָאתְךָ Kiswahili cha kawaida husema “anakuja kukutana nawe,” huku hali endelevu ya kitenzi kishirikishi ikihifadhiwa.
- source_word: לִקְרָאתְךָ
  choice: kukutana nawe
  rationale: Huonyesha mwendo kuelekea mtu kwa ajili ya kukutana naye, bila kuamua mapema kama kusudi ni la kirafiki au la uhasama.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ
  choice: na watu mia nne
  rationale: “Watu mia nne” ni Kiswahili cha kawaida kwa kundi la wanaume katika muktadha huu; hakibadili idadi wala wazo la kundi linaloandamana naye.
- source_word: עִמּוֹ
  choice: wako pamoja naye
  rationale: Kirai kihusishi kimewasilishwa kama sentensi kamili ya Kiswahili, kikionyesha kuwa watu hao wanaandamana na Esau.
