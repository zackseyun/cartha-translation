base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: sw
  text: Yakobo akaliita jina la mahali hapo Penieli[a], “Kwa maana nimemwona Mungu uso kwa uso[c], na uhai wangu umeokolewa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Penieli linasikika kama maneno ya Kiebrania yanayomaanisha ‘uso wa Mungu,’ kulingana na maelezo ya Yakobo, ‘nimemwona Mungu uso kwa uso.’
    reason: cultural_note
  - marker: b
    text: Au, ‘nafsi yangu imeokolewa’; hapa ‘nafsi’ humaanisha ‘uhai’ au mtu mwenyewe.
    reason: lexical_alternative
  - marker: c
    text: Neno ‘Mungu’ linaweza pia kueleweka kwa maana pana kuwa ‘kiumbe cha kiungu,’ lakini muktadha unaunga mkono ‘Mungu.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא יַעֲקֹב שֵׁם הַמָּקוֹם
  choice: Yakobo akapaita mahali pale
  rationale: Katika Kiswahili, ‘kupaita mahali’ huwasilisha kwa kawaida maana ya fomula ya Kiebrania ya ‘kuliita jina la mahali,’ bila kurudia maneno kwa namna isiyo ya asili.
- source_word: פְּנִיאֵל
  choice: Penieli
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa Kiswahili huku likihifadhi uhusiano wake wa kimatamshi na ‘uso wa Mungu.’
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu ya Yakobo kukipa mahali jina hilo.
- source_word: רָאִיתִי אֱלֹהִים
  choice: nimemwona Mungu
  rationale: Muktadha unaelekeza kwa Mungu, na wakati timilifu wa Kiswahili unaonyesha tukio lililotokea lenye matokeo katika hali ya sasa.
- source_word: פָּנִים אֶל פָּנִים
  choice: uso kwa uso
  rationale: Hii ni nahau ya kawaida ya Kiswahili kwa kukutana moja kwa moja, nayo inadumisha mchezo wa maneno unaohusiana na Penieli.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: lakini uhai wangu umeokolewa
  rationale: Nefeshi hapa ni uhai wa Yakobo, si lazima nafsi isiyo ya kimwili. ‘Lakini’ huonyesha mshangao unaodokezwa na kuendelea kuishi baada ya kumwona Mungu, ingawa Kiebrania hutumia kiunganishi cha kawaida.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kauli ya Yakobo
  choice: Mungu
  alternative: kiumbe cha kiungu
  rationale: Muktadha wa simulizi na maelezo ya jina la mahali yanaunga mkono rejeo la moja kwa moja kwa Mungu, huku tanbihi ikihifadhi uwezekano mpana wa neno la Kiebrania.
- issue: Uhusiano kati ya kumwona Mungu na kuokolewa kwa uhai
  choice: lakini uhai wangu umeokolewa
  alternative: na uhai wangu umeokolewa
  rationale: '‘Lakini’ huwasilisha kwa Kiswahili tofauti inayodokezwa: Yakobo alimwona Mungu uso kwa uso, hata hivyo akaendelea kuishi. Tanbihi ya kileksika inalinda maana ya נֶפֶשׁ bila kuingiza fundisho la nafsi lisilohitajika.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nukuu zinaonyesha wazi kwamba maelezo ya nafsi ya kwanza ni kauli ya Yakobo bila kuongeza maneno kama ‘akasema.’ Alama zote za tanbihi zimo katika matini kuu.
