  text: Akawachukua, akawavusha kijito[a], akavusha vitu vyote alivyokuwa navyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bonde la mto” au “mkondo wa maji wa msimu.” Neno la Kiebrania linaweza kumaanisha kijito, bonde lenye mkondo wa maji, au mkondo unaotiririka kwa majira fulani tu.
