lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: Akawachukua
  rationale: Kitenzi לקח hapa kina maana ya moja kwa moja ya ‘kuchukua’; kiambishi -wa- kinarejelea watu waliotajwa katika muktadha uliotangulia bila kuongeza wazo lisilo katika Kiebrania.
- source_word: וַיַּעֲבִרֵם
  choice: akawavusha ng’ambo
  rationale: Muundo wa Hifili wa עבר una maana ya kusababisha wavuke. ‘Kuwavusha ng’ambo’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi.
- source_word: הַנָּחַל
  choice: kijito
  rationale: נחל inaweza kumaanisha kijito, bonde la mto, au mkondo wa maji wa msimu. ‘Kijito’ ni neno linaloeleweka kwa urahisi katika simulizi la kuvuka, huku tanbihi ikihifadhi upana wa maana ya neno la Kiebrania.
- source_word: וַיַּעֲבֵר
  choice: akavusha
  rationale: Hifili ya עבר imetafsiriwa kwa kitenzi cha kisababishi ‘kuvusha,’ na hapa yambwa lake ni vitu vya Yakobo.
- source_word: אֲשֶׁר לוֹ
  choice: vitu alivyokuwa navyo
  rationale: Kirai hiki kwa karibu ni ‘kile kilichokuwa kwake’ na katika muktadha kinamaanisha vitu au mali aliyomiliki. Tafsiri hii ni ya kawaida na inabaki karibu na muundo wa Kiebrania.
