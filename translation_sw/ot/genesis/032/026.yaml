base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: sw
  text: Alipoona kwamba hakuweza kumshinda[a], aligusa kiungio cha paja lake[b][c], na kiungio cha paja la Yakobo kikateguka alipokuwa akipigana mieleka naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuweza kumzidi nguvu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “uvungu wa paja lake”; kwa mapokeo, “uvungu wa paja.” Inaweza kumaanisha kiungio cha nyonga.'
    reason: lexical_alternative
  - marker: c
    text: Viwakilishi vya Kiebrania vina utata; aya hii haitaji tena wazi utambulisho wa mpinzani wa Yakobo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Alipoona
  rationale: Muundo huu unaonyesha kwamba kuona huku kulitokea wakati simulizi ikiendelea na unaunganisha kwa kawaida tendo hilo na lililofuata.
- source_word: לֹא יָכֹל לוֹ
  choice: hakuweza kumshinda
  rationale: יכל pamoja na ל hapa huonyesha kutoweza kumzidi mpinzani. ‘Kumshinda’ ni ya kawaida katika muktadha wa kushindana bila kudai kwamba mhusika hakuwa na uwezo wowote kabisa.
- source_word: וַיִּגַּע
  choice: aligusa
  rationale: נגע kwa kawaida humaanisha ‘gusa.’ Ingawa mguso huo ulileta athari kubwa, tafsiri inadumisha kitenzi chepesi kilichotumiwa katika Kiebrania.
- source_word: בְּכַף יְרֵכוֹ
  choice: uvungu wa paja lake
  rationale: כף pamoja na ירך humaanisha sehemu yenye uvungu kwenye kiungio cha paja na nyonga. Usemi huu unafuata taswira ya Kiebrania na kudumisha uwezekano wa maana ya ‘kiungio cha nyonga.’
- source_word: וַתֵּקַע
  choice: ukateguka
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba kiungio kilitoka mahali pake. ‘Ukateguka’ ni usemi wa sasa na wa kawaida unaoeleza jeraha hilo wazi.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: uvungu wa paja la Yakobo
  rationale: Inadumisha uchaguzi uleule wa msamiati kama kifungu kilichotangulia na kuhifadhi kutajwa wazi kwa Yakobo katika Kiebrania.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: alipokuwa akishindana naye
  rationale: Muundo wa Kiebrania unaonyesha tendo lililokuwa likiendelea wakati huohuo. Kiswahili hiki ni cha asili na hakiwataji wahusika kwa majina zaidi ya maandishi ya asili.
theological_decisions:
- issue: Wanaorejelewa na viwakilishi katika tukio la kushindana
  choice: Kuhifadhi viwakilishi bila kumtaja wazi mpinzani wa Yakobo katika aya hii.
  alternative: Kumtambulisha mhusika moja kwa moja kuwa mtu, malaika, au Mungu.
  rationale: Kiebrania cha aya hii kinatumia viwakilishi bila kurudia utambulisho wa mpinzani. Kutomtaja wazi kunahifadhi utata na mvutano wa kitheolojia unaoendelezwa hatua kwa hatua katika kifungu kizima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Uvungu wa paja’ huhifadhi taswira ya Kiebrania, huku tanbihi ikifafanua maana inayowezekana ya kiungio cha nyonga. Viwakilishi vimeachwa bila majina ya ufafanuzi ili kutatua kwa lazima utata wa maandishi ya asili.
