  text: וַ/יִּשְׁאַ֣ל יַעֲקֹ֗ב וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א שְׁמֶ֔/ךָ וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וַ/יְבָ֥רֶךְ אֹת֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: sw
  text: Kisha Yakobo akauliza, “Tafadhali niambie jina lako.” Naye akasema, “Kwa nini unauliza jina langu?” Kisha akambariki hapo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... וַיֹּאמֶר
  choice: akauliza
  rationale: Muundo wa Kiebrania unaunganisha ‘akauliza’ na ‘akasema,’ lakini katika Kiswahili cha kawaida kauli inayonukuliwa tayari inaonyesha kwamba Yakobo alisema; hivyo ‘akauliza’ huepuka urudiaji usio wa lazima bila kupoteza maana.
- source_word: הַגִּידָה נָּא
  choice: Tafadhali niambie
  rationale: Kitenzi hiki katika Hiphil humaanisha ‘ambia’ au ‘julisha,’ na נָא hulainisha ombi. ‘Tafadhali niambie’ ni ombi la heshima na la kawaida katika Kiswahili.
- source_word: שְׁמֶךָ
  choice: jina lako
  rationale: Hii ni tafsiri ya moja kwa moja inayohifadhi maana ya jina na utambulisho bila kuongeza ufafanuzi usiotajwa katika mstari.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: Kwa nini unauliza jina langu?
  rationale: ‘Kwa nini’ ni Kiswahili cha asili kwa לָמָּה זֶּה; tafsiri hii huhifadhi swali lenye msisitizo bila kuiga muundo wa Kiebrania kwa namna isiyo ya kawaida.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: Kisha akambariki hapo
  rationale: ‘Akambariki’ huwakilisha ברך na kiambishi cha yambwa אֹתוֹ, huku ‘hapo’ kikihifadhi msisitizo wa mahali katika שָׁם.
theological_decisions:
- issue: Utambulisho wa yule anayekataa kutaja jina lake
  choice: Mhusika huyo hatambulishwi wazi; ametajwa kwa ‘Naye’ na kwa viambishi vya kitenzi.
  alternative: Kumtaja kama ‘yule mtu,’ ‘Mungu,’ au ‘malaika.’
  rationale: Katika mstari huu, Kiebrania hakitaji wazi mtendaji wa ‘akasema’ na ‘akambariki.’ Kiswahili kinahifadhi hali hiyo badala ya kuamua utambulisho wake kwa msingi wa tafsiri ya muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. ‘Naye’ hudumisha uhusiano wa kisimulizi na mhusika aliyetangulia bila kumtambulisha kwa jina au cheo.
