base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: sw
  text: Tafadhali uniokoe kutoka mkononi mwa ndugu yangu, kutoka mkononi mwa Esau, kwa maana ninamwogopa; asije akaja akanipiga, mama pamoja na watoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu: “anipige, mama juu ya watoto.” Hii ni nahau ya Kiebrania ya kushambulia au kupiga mama pamoja na watoto wake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: Tafadhali uniokoe
  rationale: Kitenzi cha ombi pamoja na נָא kinaonyesha dua ya kusihi; “Tafadhali uniokoe” ni Kiswahili cha sasa na cha kawaida.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Nahau hii ya Kiebrania humaanisha kuokolewa kutoka katika mamlaka au nguvu ya mtu; taswira ya “mkono” inaeleweka pia kwa Kiswahili.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: Huhifadhi uhusiano wa karibu na mvutano kwamba tishio linatoka kwa ndugu yake Yakobo.
- source_word: יָרֵא אָנֹכִי אֹתוֹ
  choice: ninamwogopa
  rationale: Hutoa kwa njia ya kawaida hali ya sasa ya hofu ya Yakobo.
- source_word: פֶּן יָבוֹא
  choice: asije akaja
  rationale: Muundo huu wa Kiswahili huonyesha tukio linalohofiwa bila kulifanya kuwa hakika.
- source_word: וְהִכַּנִי
  choice: na kuniua
  rationale: נכה kimsingi ni kupiga, lakini katika muktadha wa kushambuliwa kwa familia nzima na nahau inayofuata inaashiria kuangamiza; “kuniua” huwasilisha hatari hiyo kwa Kiswahili cha kawaida.
- source_word: אֵם עַל בָּנִים
  choice: mama pamoja na watoto
  rationale: Ni nahau inayoonyesha mama kuangamizwa pamoja na watoto wake; tafsiri hii huhifadhi taswira ya kifamilia bila Kiswahili kisichoeleweka cha “mama juu ya watoto”.
theological_decisions:
- issue: Maana ya nahau ya vurugu אֵם עַל בָּנִים
  choice: mama pamoja na watoto
  alternative: mama na watoto
  rationale: Chaguo hili linaonyesha kuangamizwa kwa mama pamoja na watoto bila kuongeza dai maalumu zaidi ya maandishi, huku likihifadhi umoja wa “mama” na wingi wa “watoto”.
- issue: Nguvu ya וְהִכַּנִי katika muktadha
  choice: na kuniua
  alternative: na kunipiga
  rationale: Ingawa kitenzi kinaweza kumaanisha “kupiga,” nahau inayofuata inaelekeza kwenye shambulio la kuangamiza. “Kuniua” hufanya maana ya muktadha ieleweke, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya kitenzi.
translation_notes:
  register: Lugha ni ya heshima, ya maombi, na inaeleweka katika Kiswahili Sanifu cha Afrika Mashariki. Muundo wa kurudia “kutoka mkononi mwa” umehifadhiwa kwa ajili ya msisitizo wa Kiebrania.
