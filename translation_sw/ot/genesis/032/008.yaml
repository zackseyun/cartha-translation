base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: sw
  text: Ndipo Yakobo akaogopa sana na akawa na dhiki. Akawagawa watu waliokuwa pamoja naye, kondoo na mbuzi, ng’ombe, na ngamia katika kambi mbili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makundi mawili.” Neno la Kiebrania linaweza kumaanisha kambi au kundi lililojipanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא מְאֹד
  choice: akaogopa sana
  rationale: Kitenzi ירא pamoja na kisisitizi מְאֹד kinaonyesha hofu kubwa; ‘akaogopa sana’ ni Kiswahili cha kawaida na huhifadhi uzito wa usemi.
- source_word: וַיֵּצֶר לוֹ
  choice: na kufadhaika
  rationale: Nahau hii inaeleza dhiki au taabu ya ndani. ‘Kufadhaika’ ni ya asili katika Kiswahili na haipunguzi nguvu ya hali ya Yakobo.
- source_word: וַיַּחַץ
  choice: akawagawa
  rationale: חצה humaanisha kugawa au kupasua katika sehemu; hapa inaeleza hatua ya kimakusudi ya kuwafanya watu na wanyama kuwa makundi mawili.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: watu waliokuwa pamoja naye
  rationale: עָם hapa ni watu wa msafara wa Yakobo, si taifa kwa maana pana.
- source_word: הַצֹּאן
  choice: kondoo na mbuzi
  rationale: צֹאן ni jina la pamoja la mifugo midogo, hasa kondoo na mbuzi; kutaja aina hizo mbili kunaweka maana wazi kwa msomaji wa Kiswahili.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: בָּקָר humaanisha ng’ombe kama kundi la mifugo; Kiswahili hutumia ‘ng’ombe’ kwa maana hii ya pamoja.
- source_word: הַגְּמַלִּים
  choice: ngamia
  rationale: Hili ni neno la moja kwa moja na la kawaida kwa גְּמַלִּים katika muktadha huu.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: katika kambi mbili
  rationale: מַחֲנוֹת inaweza kumaanisha kambi au makundi yaliyopangwa; ‘kambi mbili’ huhifadhi istilahi ya simulizi na uhusiano wake na mstari unaofuata.
