translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili simulizi lisomeke kwa urahisi, huku mfuatano wa hofu, fadhaa, na hatua ya kugawa ukihifadhiwa. Alama ya tanbihi imewekwa baada ya ‘kambi mbili,’ ambako uchaguzi wa kileksika unahusika.
