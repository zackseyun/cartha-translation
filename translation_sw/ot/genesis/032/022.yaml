  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: sw
  text: Basi zawadi ikatangulia mbele yake[a], lakini yeye mwenyewe akabaki usiku huo kambini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kipawa.” Neno la Kiebrania מִנְחָה linaweza kumaanisha zawadi, kodi, au sadaka; hapa linamaanisha zawadi ambayo Yakobo alitanguliza kwa Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: ikatangulia
  rationale: Katika muktadha huu, kitenzi עבר kinaonyesha zawadi ikiendelea mbele ya Yakobo; “ikatangulia” huwasilisha mwendo huo kwa Kiswahili cha kawaida bila kudokeza kuvuka mpaka au kijito ambako hakutajwi katika kishazi hiki.
- source_word: הַמִּנְחָה
  choice: zawadi
  rationale: Hapa מִנְחָה ni zawadi ya Yakobo kwa Esau, si sadaka ya ibada. “Zawadi” ni neno la sasa, wazi na la kawaida; “kodi” lingetia uzito usio lazima wa utii wa kisiasa.
- source_word: עַל־פָּנָיו
  choice: mbele yake
  rationale: Nahau hii, kihalisi “mbele ya uso wake,” hapa ina maana ya kwenda mbele ya Yakobo. “Mbele yake” huhifadhi picha ya Kiebrania na kueleweka kiasili.
- source_word: וְהוּא
  choice: lakini yeye mwenyewe
  rationale: Kiwakilishi kilichotamkwa wazi kinaweka tofauti kati ya zawadi iliyotangulia na Yakobo aliyebaki; “lakini yeye mwenyewe” hudhihirisha tofauti hiyo.
- source_word: לָן
  choice: akakaa
  rationale: Kitenzi לון/לין humaanisha kukaa au kulala mahali usiku. Kwa kuwa “usiku huo” linafuata, “akakaa” ni fupi na la kawaida bila marudio yasiyo ya lazima.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku huo
  rationale: Hili ndilo tamko la kawaida na la moja kwa moja la wakati katika Kiswahili.
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: מַחֲנֶה humaanisha kambi; umbo la mahali “kambini” ni la kawaida na wazi katika Kiswahili cha kisasa.
