base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: sw
  text: Akawaamuru pia wa pili, pia wa tatu, na wote waliokuwa wakifuata makundi ya mifugo, akisema, “Mtasema hivi kwa Esau mtakapokutana naye.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: akamwamuru
  rationale: Kauli ya Piel ya צוה ina nguvu ya kutoa amri; “akamwamuru” ni ya asili na hudumisha uzito huo.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  choice: wa pili / wa tatu
  rationale: Nambari hizi zimetumiwa kama nomino bila kutaja jina; Kiswahili pia kinaweza kuacha mhusika aeleweke kutokana na muktadha.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: wote waliokuwa wakifuata nyuma ya makundi ya wanyama
  rationale: Kirai hiki huhifadhi maana ya kundi zima lililofuata makundi ya mifugo; “makundi ya wanyama” ni wazi kwa msomaji wa kawaida bila kudai aina moja ya mifugo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ndiyo njia ya kawaida ya kutambulisha maneno ya moja kwa moja, huku ikibaki karibu na muundo wa Kiebrania.
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  choice: Mtamwambia Esau maneno haya
  rationale: Kiswahili cha asili hueleza agizo hili kwa “mtamwambia ... maneno haya”; maana ya ujumbe uliowekwa mapema inadumishwa bila usemi mgumu wa neno kwa neno.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: mtakapokutana naye
  rationale: Katika muktadha wa kukabiliwa na Esau njiani, “kukutana naye” ni tafsiri ya kawaida ya maana ya muda ya מצא, huku “kumpata” ikiwa uwezekano wa karibu zaidi wa kileksika.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inatumia usawazishaji bora: inadumisha mpangilio na nguvu ya agizo la Kiebrania, lakini huepuka miundo isiyo ya kawaida kama “kulingana na neno hili mtasema.”'
