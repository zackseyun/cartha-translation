base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: sw
  text: Nanyi mtasema pia, “Tazama, mtumishi wako Yakobo yuko nyuma yetu.” Kwa maana alisema, “Nitamtuliza kwa zawadi inayokwenda mbele yangu, kisha nitaonana naye uso kwa uso; huenda akanikubali[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akauinue uso wangu,” yaani, “anikubali” au “anionyeshe kibali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika hotuba hii ya kidiplomasia, Yakobo anajishusha kwa heshima mbele ya Esau; ‘mtumishi’ linafaa kuliko ‘mtumwa’.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kiashiria hiki huvuta fikira kwa msisitizo na kinaendana na lugha ya simulizi yenye hadhi.
- source_word: אַחֲרֵינוּ
  choice: yuko nyuma yetu
  rationale: Huonyesha kwamba Yakobo anawafuata wajumbe, kwa hiyo yuko nyuma yao.
- source_word: אֲכַפְּרָה פָנָיו
  choice: Nitamtuliza
  rationale: 'Mzizi כפר umetumiwa hapa katika mazingira yasiyo ya ibada: Yakobo anataka kupunguza hasira ya Esau kwa zawadi, si kufanya upatanisho wa kidini.'
- source_word: מִנְחָה
  choice: zawadi
  rationale: Hapa ni zawadi ya kumshawishi Esau apokee Yakobo kwa amani; ‘sadaka’ ingeleta maana ya kiibada isiyokusudiwa.
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: inayotangulia mbele yangu
  rationale: Huhifadhi picha ya zawadi inayosafirishwa mbele ya Yakobo.
- source_word: אֶרְאֶה פָנָיו
  choice: nitaonana naye uso kwa uso
  rationale: Ni Kiswahili cha kawaida kinachohifadhi taswira ya uso na maana ya kukutana moja kwa moja.
- source_word: יִשָּׂא פָנַי
  choice: akanikubali
  rationale: Nahau ya Kiebrania ya ‘kuinua uso’ humaanisha kumpokea mtu kwa wema au kumwonyesha kibali; tafsiri hii ni wazi katika Kiswahili.
- source_word: אוּלַי
  choice: huenda
  rationale: Huhifadhi kutokuwa na uhakika pamoja na tumaini la Yakobo.
theological_decisions:
- issue: Maana ya כפר katika uhusiano wa kibinadamu badala ya ibada
  choice: Nitamtuliza
  alternative: Nitafanya upatanisho kwa ajili yake
  rationale: Mhusika anayelengwa ni Esau, na njia inayotumiwa ni zawadi; muktadha unaonyesha kutuliza hasira, si tendo rasmi la kafara.
- issue: Nahau יִשָּׂא פָנַי
  choice: akanikubali
  alternative: akauinue uso wangu
  rationale: Maana ya nahau ni kupokelewa kwa kibali. Tafsiri ya maana huepuka Kiswahili kisichoeleweka, huku tanbihi ikihifadhi umbo la Kiebrania.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Tafsiri imetumia ulinganifu bora: imehifadhi taswira ya kukutana uso kwa uso, lakini imetafsiri nahau zisizoeleweka moja kwa moja kwa maana yake ya kawaida. Alama [a] iko katika matini kuu na inaeleza nahau ya mwisho.'
