base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/016.yaml
  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: sw
  text: ngamia thelathini wanaonyonyesha pamoja na watoto wao, ng’ombe wa kike arobaini na mafahali kumi, punda wa kike ishirini na wana-punda kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “punda wa kiume kumi”; neno la Kiebrania linaweza kumaanisha punda mchanga au punda wa kiume.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: ngamia thelathini wanaonyonyesha
  rationale: Kirai hiki kinaonyesha ngamia wa kike wanaowanyonyesha watoto wao; Kiswahili kwa kawaida hutumia nomino ‘ngamia’ bila kubainisha jinsia kwa umbo lake.
- source_word: וּבְנֵיהֶם
  choice: pamoja na watoto wao
  rationale: Ingawa kihalisi ni ‘na wana wao,’ katika muktadha wa wanyama ‘watoto wao’ ni usemi wa kawaida na huhifadhi maana ya uzao.
- source_word: פָּרוֹת
  choice: ng’ombe wa kike
  rationale: Neno la Kiebrania linabainisha ng’ombe wa jinsia ya kike; tafsiri hii ni wazi na sahihi.
- source_word: וּפָרִים
  choice: na mafahali kumi
  rationale: Hawa ni ng’ombe wa kiume; ‘mafahali’ huhifadhi utofautishaji wa kijinsia katika orodha.
- source_word: אֲתֹנֹת
  choice: punda wa kike
  rationale: Neno linabainisha punda wa jinsia ya kike, jambo linalotolewa wazi kwa Kiswahili cha kawaida.
- source_word: וַעְיָרִם
  choice: na wana-punda kumi
  rationale: עַיִר inaweza kumaanisha punda mchanga au punda wa kiume. ‘Wana-punda’ huhifadhi dhana ya punda wachanga bila kuamua jinsia isiyotajwa kwa uhakika.
