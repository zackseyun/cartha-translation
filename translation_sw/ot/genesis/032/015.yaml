  language: sw
  text: mbuzi wa kike mia mbili na mbuzi wa kiume ishirini, kondoo wa kike mia mbili na kondoo wa kiume ishirini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִזִּים
  choice: mbuzi wa kike
  rationale: Katika orodha hii ya mifugo, nomino hii inatofautishwa na תְיָשִׁים, hivyo jinsia ya wanyama imewekwa wazi kwa Kiswahili cha kawaida.
- source_word: מָאתַיִם
  choice: mia mbili
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi 200 kwa Kiswahili.
- source_word: תְיָשִׁים
  choice: mbuzi wa kiume
  rationale: Neno la Kiebrania linamaanisha mbuzi wa kiume; usemi huu ni wazi na unaeleweka kwa wasomaji wengi kuliko istilahi maalumu ya ufugaji.
- source_word: עֶשְׂרִים
  choice: ishirini
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya idadi 20.
- source_word: רְחֵלִים
  choice: kondoo wa kike
  rationale: Neno hili linawataja kondoo wa kike na linatofautishwa na אֵילִים; tafsiri imehifadhi tofauti hiyo ya kijinsia.
- source_word: אֵילִים
  choice: kondoo wa kiume
  rationale: Neno linamaanisha kondoo wa kiume. Usemi huu wa kawaida huhifadhi maana kwa uwazi bila kutegemea istilahi ya ufugaji ambayo huenda isieleweke kwa wote.
