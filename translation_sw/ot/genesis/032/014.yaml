translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa, na wenye hadhi. Jina “Yakobo” limewekwa wazi badala ya kiwakilishi pekee ili kuepuka utata wa kawaida wa Kiswahili bila kubadili mhusika wa maandishi. Mgawanyo katika sentensi mbili unaboresha usomaji, huku koloni la mwisho likidumisha uhusiano na orodha inayofuata.
