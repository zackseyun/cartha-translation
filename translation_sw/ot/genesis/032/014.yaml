lexical_decisions:
- source_word: וַיָּלֶן
  choice: akalala
  rationale: Katika muktadha huu, kitenzi לון humaanisha kukaa mahali usiku. “Akalala huko” ni usemi wa kawaida wa Kiswahili unaowasilisha maana hiyo bila lugha ya kizamani.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinaelekeza kwenye eneo lililotajwa katika muktadha uliotangulia.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku huo
  rationale: Huu ndio ulinganifu wa kawaida na wa moja kwa moja wa kishazi cha Kiebrania kinachorejelea usiku maalumu.
- source_word: וַיִּקַּח
  choice: akatwaa
  rationale: לקח humaanisha kuchukua. “Akatwaa” ni neno la Kiswahili fasaha na lenye hadhi, linalofaa katika simulizi hili.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: miongoni mwa vitu alivyokuwa navyo
  rationale: Nahau ya Kiebrania, kwa maneno halisi, husema kuhusu kile “kilichokuja mkononi mwake,” lakini katika muktadha huu humaanisha mali iliyokuwa kwake au iliyopatikana kwa urahisi. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- source_word: מִנְחָה
  choice: zawadi
  rationale: Hapa מִנְחָה ni kitu kinachotolewa kwa mtu ili kumheshimu au kumtuliza, si sadaka ya ibada. “Zawadi” inafaa kwa muktadha huu bila kusisitiza mno wazo la kodi au utiifu wa kisiasa.
- source_word: לְעֵשָׂו אָחִיו
  choice: kwa ajili ya Esau ndugu yake
  rationale: Herufi לְ inaonyesha mpokeaji au mlengwa wa zawadi, na tafsiri hii inahifadhi wazi uhusiano wa Esau na Yakobo.
