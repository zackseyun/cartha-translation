  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: sw
  text: 'Basi Yakobo akalala huko usiku huo. Akatwaa miongoni mwa vitu alivyokuwa navyo[a] zawadi kwa ajili ya Esau ndugu yake:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, “kutoka katika kile kilichokuja mkononi mwake”; yaani, kutoka katika vitu vilivyopatikana kwake.
