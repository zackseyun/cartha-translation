  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: sw
  text: Kisha utasema, ‘Hii ni zawadi[a] ya mtumishi wako Yakobo, iliyotumwa kwa bwana wangu Esau. Na tazama, yeye pia yuko nyuma yetu[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tunu” au “zawadi ya heshima.” Neno la Kiebrania minḥah hapa linamaanisha zawadi iliyokusudiwa kumtuliza Esau na kuleta upatanisho.
    reason: lexical_alternative
