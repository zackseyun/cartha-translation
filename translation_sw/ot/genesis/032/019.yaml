lexical_decisions:
- source_word: וְאָמַרְתָ
  choice: Kisha utasema
  rationale: Waw pamoja na kitenzi timilifu inaendeleza maagizo ya Yakobo kwa watumishi; “Kisha utasema” huonyesha mfuatano na nguvu ya agizo kwa Kiswahili cha kawaida.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: ya mtumishi wako Yakobo
  rationale: Kauli hii humtambulisha Yakobo kwa unyenyekevu mbele ya Esau. Muundo wa umilikaji ni wa kawaida kwa Kiswahili na unaendana na zawadi kuwa ya Yakobo.
- source_word: מִנְחָה
  choice: zawadi
  rationale: Katika muktadha huu neno hilo linamaanisha zawadi ya kupatanisha iliyotumwa kwa Esau, si sadaka ya ibada. “Zawadi” ni wazi na ya kawaida; “kodi” ingeongeza wazo la utiifu wa kisiasa.
- source_word: שְׁלוּחָה
  choice: iliyotumwa
  rationale: Umbo la kushirikisha tendwa linaonyesha kwamba zawadi ilikuwa imetumwa; “iliyotumwa” huhifadhi hali ya kutendwa na huunganika kwa kawaida na “zawadi.”
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: kwa bwana wangu, Esau
  rationale: “Bwana wangu” huhifadhi lugha ya heshima na unyenyekevu ya Yakobo. Koma hudumisha Esau kama jina linalofafanua “bwana wangu.”
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Neno hili huvuta fikira kwa taarifa inayofuata. “Tazama” ni ya heshima na inayoeleweka katika usimulizi wa kibiblia.
- source_word: גַּם הוּא
  choice: yeye mwenyewe pia
  rationale: Muundo huu huhifadhi msisitizo kwamba, pamoja na zawadi, Yakobo mwenyewe anafuata nyuma.
- source_word: אַחֲרֵינוּ
  choice: yuko nyuma yetu
  rationale: Tafsiri hii ya moja kwa moja huonyesha mahali alipo Yakobo kuhusiana na makundi yaliyotangulia, bila kulazimisha maana ya mwendo ambayo inaweza pia kudokezwa.
