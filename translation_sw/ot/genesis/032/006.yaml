base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: sw
  text: Nina ng’ombe na punda, makundi ya kondoo na mbuzi, watumishi wa kiume na wa kike[a]. Nimetuma wajumbe kumjulisha bwana wangu, ili nipate kibali machoni pako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa wa kiume na wa kike.” Maneno ya Kiebrania yanaweza kumaanisha watumishi wa kaya waliokuwa katika hali ya utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: Nimekuwa na
  rationale: Nahau ya Kiebrania היה + ל inaeleza kuwa na mali. Kauli hii ya Kiswahili inaonyesha hali ya sasa iliyotokana na yaliyopita; pia inafaa muktadha wa ujumbe wa Yakobo kuhusu mali aliyopata.
- source_word: שׁוֹר וַחֲמוֹר
  choice: ng’ombe na punda
  rationale: Majina haya yametumiwa kwa maana ya makundi ya wanyama. Kiswahili kinaweza kutumia umoja wa kijumla kwa 'ng’ombe' na 'punda' katika orodha ya mali.
- source_word: צֹאן
  choice: makundi ya kondoo na mbuzi
  rationale: צֹאן ni jina la kijumla la mifugo midogo, hasa kondoo na mbuzi. Kutaja aina hizo mbili ni wazi kwa msomaji wa Kiswahili bila kupoteza maana ya kijumla.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: watumishi wa kiume na wa kike
  rationale: Maneno ya Kiebrania yanatofautisha jinsia na yanaweza kumaanisha watumishi walio katika hali ya utumwa. Tafsiri kuu ni ya kawaida na yenye heshima, huku tanbihi ikihifadhi uwezekano wa 'watumwa' unaoonekana katika orodha ya mali.
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: Nami nimetuma ujumbe huu kumjulisha
  rationale: Kitenzi kinaeleza hatua ambayo Yakobo amechukua karibuni. 'Ujumbe huu' hufanya lengo la kuwatuma wajumbe lieleweke kwa Kiswahili cha kawaida bila kubadili kiini cha taarifa.
- source_word: לַאדֹנִי
  choice: bwana wangu
  rationale: Hii ni kauli ya heshima kwa Esau, wala si jina la Mungu. 'Bwana wangu' huhifadhi unyenyekevu wa Yakobo.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: ili nipate kibali machoni pako
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania ya kupata mtazamo mwema, na inaeleweka katika Kiswahili sanifu.
theological_decisions:
- issue: Maana ya עֶבֶד / שִׁפְחָה katika orodha ya mali ya kaya
  choice: watumishi wa kiume na wa kike
  alternative: watumwa wa kiume na wa kike
  rationale: Muktadha wa orodha ya mali unaweza kuashiria hali ya utumwa, lakini maneno hayo yana wigo unaojumuisha watumishi wa kaya. Tafsiri kuu haitatui kimya kimya hadhi yao ya kisheria; tanbihi inaweka wazi tafsiri mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau 'machoni pako' imehifadhiwa kwa kuwa inaeleweka, na jinsia ya watumishi imeonyeshwa kama ilivyo katika Kiebrania.
