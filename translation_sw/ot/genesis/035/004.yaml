base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: sw
  text: Basi wakampa Yakobo miungu yote ya kigeni iliyokuwa mikononi mwao, pamoja na pete[a] zilizokuwa masikioni mwao. Yakobo akavificha chini ya mti wa terebinthi[b] uliokuwa karibu na Shekemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vipuli”; neno la Kiebrania linaweza kumaanisha pete zinazovaliwa sehemu mbalimbali, lakini hapa maneno yanayofuata yanabainisha kwamba zilikuwa masikioni.
    reason: lexical_alternative
  - marker: b
    text: Au “mwaloni”; hata hivyo, inaelekea neno la Kiebrania linamaanisha hasa mti wa terebinthi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Basi wakampa
  rationale: Kauli ya wayyiqtol inaendeleza mfululizo wa simulizi. “Basi” huonyesha mwendelezo huo kwa Kiswahili cha kawaida, na “wakampa Yakobo” humtaja Yakobo kwa kawaida kama mpokeaji.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: miungu yote ya kigeni
  rationale: Hili ni tamko wazi na la kawaida kwa miungu isiyo ya ibada ya agano; haliongezi dai kwamba ilikuwa sanamu tu, ingawa huenda vitu hivyo vilikuwa vielelezo vya miungu.
- source_word: אֲשֶׁר בְּיָדָם
  choice: iliyokuwa mikononi mwao
  rationale: Inahifadhi taswira halisi ya Kiebrania, “iliyokuwa mikononi mwao,” badala ya kuibadili tu kuwa umilikaji.
- source_word: וְאֶת הַנְּזָמִים
  choice: pamoja na pete
  rationale: נְזָמִים linaweza kumaanisha pete zinazovaliwa sehemu mbalimbali za mwili. “Pete” huhifadhi upana huo, huku kishazi kinachofuata kikibainisha kwamba hizi zilikuwa masikioni.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: zilizokuwa masikioni mwao
  rationale: Kiebrania kinaonyesha mahali zilipokuwa, si tendo la kuzitoa. Tafsiri hii haiongezi maana ya “kutoka masikioni mwao.”
- source_word: וַיִּטְמֹן אֹתָם
  choice: Yakobo akavificha
  rationale: Kitenzi טמן kinaweza kumaanisha kuficha, kusitiri, au kuzika. “Kuficha” huhifadhi maana pana bila kulazimisha kwamba alivizika ardhini.
- source_word: תַּחַת הָאֵלָה
  choice: chini ya mti wa terebinthi
  rationale: אֵלָה kwa kawaida humaanisha mti wa terebinthi. Jina la mti limeelezwa wazi ili lisichanganywe na mwaloni.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: uliokuwa karibu na Shekemu
  rationale: עִם likitumiwa pamoja na jina la mahali linaweza kuonyesha ukaribu. “Karibu na Shekemu” ni Kiswahili cha kawaida kinachoeleza mahali bila kudai kwamba mti ulikuwa ndani ya mji.
theological_decisions:
- issue: Uhusiano kati ya pete na ibada ya miungu ya kigeni
  choice: Pete zimetajwa kando na miungu ya kigeni bila kueleza kwa nini ziliondolewa.
  alternative: Kuzitaja pete moja kwa moja kuwa hirizi za ibada ya sanamu au mapambo yasiyokuwa na maana ya kidini.
  rationale: Andiko linatambulisha miungu hiyo kuwa ya kigeni, lakini halisemi wazi kama pete zenyewe zilikuwa hirizi za kipagani au mapambo yaliyohusishwa tu na maisha yao ya awali. Tafsiri haiongezi uamuzi ambao Kiebrania hakitoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Pamoja na” hutenganisha kwa uwazi vitu viwili vilivyotolewa, na “terebinthi” huhifadhi utambulisho unaowezekana zaidi wa mti huku tanbihi ikitoa neno mbadala la kimapokeo.
