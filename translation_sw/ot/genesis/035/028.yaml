  text: Siku za Isaka zilikuwa miaka mia moja na themanini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Siku za Isaka zilikuwa miaka mia moja na themanini”; neno “siku” limetumiwa kama nahau ya kumaanisha muda wa maisha.'
