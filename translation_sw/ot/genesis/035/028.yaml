lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: zilikuwa
  rationale: Hapa umbo hili la kitenzi היה linafanya kazi kama kishirikishi cha kisimulizi kinachotaja jumla ya muda wa maisha ya Isaka; “zilikuwa” ni Kiswahili cha kawaida na kinacholingana na kiima “siku.”
- source_word: יְמֵי
  choice: Siku za
  rationale: Kirai hiki cha Kiebrania ni nahau inayomaanisha muda wa maisha ya mtu. Kukihifadhi kama “Siku za” kunadumisha taswira ya matini chanzi, huku tanbihi ikifafanua maana yake.
- source_word: יִצְחָק
  choice: Isaka
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: miaka mia moja na themanini
  rationale: Kiebrania hutaja idadi hizi kwa kuambatanisha “mia moja mwaka” na “themanini mwaka”; Kiswahili cha kawaida huunganisha jumla hiyo na kutumia “miaka.”
- source_word: שָׁנָה
  choice: miaka
  rationale: Ingawa Kiebrania hutumia nomino ya umoja katika muundo huu wa namba, Kiswahili sanifu huhitaji wingi “miaka” kwa umri huu.
