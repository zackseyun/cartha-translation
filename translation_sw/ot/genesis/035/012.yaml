base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: sw
  text: Na nchi niliyowapa Abrahamu na Isaka[a], nitakupa; na uzao wako baada yako nitaupa nchi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimewapa Abrahamu na Isaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa ahadi kwa mababu, “nchi” hueleza eneo maalumu lililoahidiwa kwa usahihi na kwa Kiswahili cha kawaida kuliko “dunia” au “ardhi.”
- source_word: נָתַתִּי
  choice: niliyowapa
  rationale: Kauli ya wakati uliopita huhifadhi tofauti ya kimakusudi kati ya zawadi ya awali kwa Abrahamu na Isaka na utoaji wa baadaye kwa Yakobo na uzao wake.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: Abrahamu na Isaka
  rationale: Majina ya kawaida ya Kiswahili yametumiwa; kiambishi cha yambwa katika “niliyowapa” kinaonyesha kwamba wote wawili walikuwa wapokeaji.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: nitakupa wewe
  rationale: Neno “nchi” limetangulizwa kama yambwa, huku “wewe” likihifadhi msisitizo wa kiwakilishi katika Kiebrania.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: “Uzao” huhifadhi maana ya nomino ya umoja yenye dhana ya kundi, bila kuifanya moja kwa moja kuwa wingi wa “wazao” wala kutumia “mbegu,” ambalo si la kawaida hapa.
- source_word: אַחֲרֶיךָ
  choice: baada yako
  rationale: Tafsiri hii ya moja kwa moja huhifadhi wazo la wakati na la vizazi vitakavyofuata.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: nitaupa nchi hiyo
  rationale: Kurudiwa kwa tendo la kutoa na kwa nchi kumehifadhiwa; “hiyo” hurejelea kwa kawaida nchi iliyotajwa mwanzoni.
theological_decisions:
- issue: Uhusiano kati ya utoaji wa wakati uliopita na utoaji wa wakati ujao katika ahadi ya nchi
  choice: “niliyowapa” kwa tendo la awali, kisha “nitakupa” na “nitaupa” kwa wakati ujao
  alternative: “nimewapa” ili kusisitiza matokeo yanayoendelea ya ahadi ya awali
  rationale: Kiebrania kinaweka pamoja tendo la awali la Mungu la kutoa na ahadi ya utoaji wa baadaye. Tafsiri inahifadhi mvutano huo wa wakati na wa kiteolojia badala ya kuusawazisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi huhifadhi urudiaji na msisitizo wa Kiebrania bila kuwa mgumu kwa msomaji wa sasa.
