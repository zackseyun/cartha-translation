  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: sw
  text: 'Na wana wa Zilpa, mjakazi[a] wa Lea: Gadi na Asheri. Hawa ndio wana wa Yakobo waliozaliwa kwake huko Padani-Aramu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שִׁפְחָה linaweza pia kutafsiriwa “mtumishi wa kike,” au kwa namna inayoonyesha wazi zaidi hadhi yake, “mwanamke mtumwa.”
    reason: lexical_alternative
  - marker: b
    text: Aya hii inasema kwamba wana hawa walizaliwa Padani-Aramu, lakini Benyamini alizaliwa Kanaani (mist. 16–18). Huenda kauli hii ikawa muhtasari unaohusisha kipindi cha familia ya Yakobo huko Aramu, lakini maandishi hayasemi wazi jinsi Benyamini anavyohusiana na kauli hiyo.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: בְּנֵי ni wingi wa ‘mwana’ katika muundo wa umilikaji; katika orodha hii ya nasaba, ‘wana wa’ ni sahihi na ya kawaida.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: שִׁפְחַת
  choice: mjakazi wa
  rationale: ‘Mjakazi’ huonyesha kuwa מדובר mtumishi mwanamke na kwa kiasi fulani hadhi yake ya chini, bila kutumia lugha ya kizamani; tanbihi inaweka wazi uwezekano wa maana kali zaidi ya utumwa.
- source_word: לֵאָה
  choice: Lea
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili, huku muundo ‘mjakazi wa Lea’ ukihifadhi uhusiano wa umilikaji katika Kiebrania.
- source_word: גָּד וְאָשֵׁר
  choice: Gadi na Asheri
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, na kiunganishi וְ kimetafsiriwa ‘na’.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: Hawa ndio wana wa Yakobo
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida kauli ya muhtasari inayotambulisha wana waliotajwa.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: waliozaliwa kwake
  rationale: Kauli tendwa ya Kiebrania imedumishwa bila kuongeza mama kama kiima kisichotajwa; wingi wa Kiswahili unapatana na ‘wana.’
- source_word: בְּפַדַּן אֲרָם
  choice: huko Padani-Aramu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa kwa etimolojia isiyo na uhakika; ‘huko’ ni ya asili kwa kurejelea mahali pa mbali.
theological_decisions:
- issue: Kauli kwamba wana wa Yakobo walizaliwa Padani-Aramu huku Benyamini akiwa amezaliwa Kanaani
  choice: Kauli ya aya imetafsiriwa moja kwa moja, na tofauti hiyo imeelezwa katika tanbihi bila kuiondoa kwenye maandishi.
  alternative: Kuongeza ‘isipokuwa Benyamini’ au kusema kwa uhakika kwamba kauli hiyo haimhusu Benyamini.
  rationale: Kiebrania hakina maneno ‘isipokuwa Benyamini’; kuongeza maneno hayo kungetatua kimya kimya mvutano uliopo kati ya aya hii na mistari 16–18.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Majina yametumia maumbo yaliyozoeleka katika Biblia za Kiswahili. Muundo mfupi wenye nukta mbili umehifadhi mtindo wa orodha ya nasaba ya Kiebrania.
