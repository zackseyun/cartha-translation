base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: sw
  text: Kisha Isaka akakata roho, akafa, akakusanywa kwa watu wake[a], mzee, mwenye siku tele. Nao Esau na Yakobo, wanawe, wakamzika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akakusanywa kwa mababu zake” au “kwa jamaa zake.” Usemi huu wa Kiebrania ni kauli iliyozoeleka kuhusu kifo na huenda unamaanisha zaidi ya maziko ya mwili tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: akakata roho
  rationale: Kitenzi גוע katika taarifa za kifo humaanisha mtu kufikia mwisho wa uhai. “Akakata roho” ni usemi wa kawaida wa Kiswahili unaotofautisha tendo hilo na kitenzi kinachofuata, “akafa.”
- source_word: וַיָּמָת
  choice: akafa
  rationale: מות ni kitenzi cha kawaida cha kufa; tafsiri hii ya moja kwa moja inadumisha mfuatano wa vitenzi vya Kiebrania.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: akakusanywa kwa watu wake
  rationale: Huu ni usemi maalumu wa Kiebrania kuhusu kifo. Tafsiri ya karibu “kwa watu wake” inadumisha maana yake ya kifamilia na ya kitheolojia bila kuamua kwamba inahusu maziko tu au hali fulani baada ya kifo.
- source_word: זָקֵן
  choice: akiwa mzee
  rationale: Ni maelezo ya moja kwa moja ya umri wa Isaka katika taarifa ya kifo; “mzee” ni neno la kawaida na lenye heshima.
- source_word: וּשְׂבַע יָמִים
  choice: na ameshiba siku
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania inayosema kwamba Isaka alikuwa “ameshiba siku,” badala ya kuifupisha kuwa tu alikuwa na umri mkubwa.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: wakamzika
  rationale: קבר humaanisha kuzika; “wakamzika” ni tafsiri wazi, fupi, na ya kawaida.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: Esau na Yakobo, wanawe
  rationale: Mpangilio huu unadumisha majina kwanza na kisha maelezo kwamba walikuwa wanawe, kama ilivyo katika Kiebrania, huku ukisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya usemi wa kifo “akakusanywa kwa watu wake”
  choice: Usemi huo umedumishwa kwa karibu bila kubainisha kama unamaanisha maziko, kuungana na mababu, au hali ya baada ya kifo.
  alternative: Kutafsiri kuwa “akazikwa pamoja na mababu zake” au “akaungana na mababu zake baada ya kifo.”
  rationale: Kiebrania kinaacha maana hiyo ikiwa na utata wa kitheolojia. Tafsiri isiamue jambo ambalo andiko lenyewe halisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Nahau “ameshiba siku” imedumishwa kwa ajili ya taswira ya kifasihi ya taarifa ya Kiebrania kuhusu kifo.
