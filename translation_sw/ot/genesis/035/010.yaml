base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: sw
  text: Mungu akamwambia, “Jina lako ni Yakobo. Jina lako halitaitwa tena Yakobo, bali jina lako litakuwa Israeli.” Basi akamwita Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akampa jina Israeli.” Kiebrania husoma kwa karibu zaidi, “Akaliita jina lake Israeli”; yaani, “Akamwita Israeli.”
    reason: Hufafanua fomula ya Kiebrania ya kumtaja mtu jina na hutoa mbadala wa kawaida wa Kiswahili.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi, kitenzi cha umoja na muktadha vinaonyesha wazi kuwa anayerejelewa ni Mungu mmoja.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya pili umoja; kutajwa kwake tena kunadumishwa kadiri Kiswahili cha kawaida kinavyoruhusu.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: hutaitwa tena
  rationale: Kauli ya kutendwa ya קרא katika muktadha wa jina ina maana ya ‘kuitwa’; muungano wa לֹא na עוֹד unaonyesha kwamba hali hiyo haitakuwa hivyo kuanzia sasa.
- source_word: כִּי אִם
  choice: bali
  rationale: 'Muundo huu unaonyesha ulinganisho wa kubadilisha jina: si Yakobo tena, bali Israeli.'
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: jina lako litakuwa Israeli
  rationale: Inadumisha msisitizo wa jina jipya na ni kauli ya asili na yenye hadhi katika Kiswahili.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: Basi akamwita Israeli
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza tendo la kumpa au kumwita mtu jina, huku tanbihi ikihifadhi muundo halisi zaidi wa Kiebrania.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Umbo la jina lililozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Kauli ya Mungu ya kubadili jina bila kudai kwamba jina la zamani halitatumiwa kabisa baadaye
  choice: Hutaitwa tena Yakobo, bali jina lako litakuwa Israeli.
  alternative: Jina lako halitaitwa tena Yakobo, ila Israeli litakuwa jina lako.
  rationale: Tafsiri inadumisha nguvu ya tangazo rasmi la kubadili jina, lakini haiongezi ufafanuzi wa kupatanisha kauli hiyo na matumizi ya jina ‘Yakobo’ katika simulizi linalofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hutaitwa tena” ni wa kawaida kuliko “jina lako halitaitwa tena,” lakini unadumisha maana ya kauli ya kutendwa. Kiunganishi “Basi” kinaonyesha maendeleo ya simulizi bila kuongeza hitimisho la kiteolojia.
