base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: sw
  text: Debora, mlezi wa Rebeka, akafa, naye akazikwa chini ya Betheli, chini ya mwaloni[a]. Basi akaliita jina lake Aloni-bakuti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania hapa linaweza kumaanisha mwaloni au mti aina ya terebinthi; aina hususa ya mti haijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Aloni-bakuti huenda likamaanisha “Mwaloni wa Kilio”; ikiwa neno אַלּוֹן linamaanisha terebinthi, basi “Terebinthi ya Kilio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: mlezi
  rationale: Neno hilo humaanisha mwanamke aliyemnyonyesha mtoto na kumtunza. Katika muktadha huu Debora alikuwa mlezi wa Rebeka wa muda mrefu; “mlezi” ni Kiswahili cha kawaida na haisisitizi tendo la kunyonyesha wakati huo.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: chini ya Betheli
  rationale: Kirai hiki kinaonyesha mahali palipo chini ya Betheli kwa mwinuko; hakifasiriwi moja kwa moja kuwa upande wa kusini.
- source_word: תַּחַת הָאַלּוֹן
  choice: chini ya mwaloni
  rationale: תַּחַת ni “chini ya,” na אַלּוֹן kwa kawaida hutafsiriwa “mwaloni,” ingawa huenda ikamaanisha mti aina ya terebinthi; hali hiyo imeelezwa katika tanbihi.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: akauita
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu umoja wa kiume na ni tendaji, lakini mtendaji hakutajwa wazi. Kiswahili kinaweza kuacha kiima kieleweke katika mfululizo wa simulizi bila kuongeza jina lisilokuwamo katika matini.
- source_word: אַלּוֹן בָּכוּת
  choice: Aloni-bakuthi
  rationale: Jina limetoholewa kwa sauti badala ya kutafsiriwa katika matini kuu. Maana yake inayowezekana imewekwa katika tanbihi.
- source_word: וַתִּקָּבֵר
  choice: akazikwa
  rationale: Kitenzi ni katika kauli ya kutendwa; tafsiri hii haiingizi wazikaji ambao hawakutajwa.
- source_word: וַתָּמָת
  choice: akafa
  rationale: Hii ni tafsiri ya moja kwa moja ya kitenzi cha Kiebrania, bila kulainisha usemi.
