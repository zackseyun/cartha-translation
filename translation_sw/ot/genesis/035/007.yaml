base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: sw
  text: Hapo akajenga madhabahu, akaliita mahali pale El-Betheli[a], kwa sababu hapo Mungu alikuwa amejifunua kwake alipokuwa akimkimbia ndugu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El-Betheli huenda humaanisha “Mungu wa Betheli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akajenga
  rationale: Kauli ya kawaida ya kisimulizi ya kitenzi בנה, ikimaanisha kujenga; “akajenga” ni ya asili na sahihi katika mfululizo wa matukio.
- source_word: שָׁם
  choice: hapo
  rationale: Kielezi cha mahali; “hapo” kinaelekeza kwa mahali palipotajwa na pia kinaruhusu urudiaji wake baadaye katika mstari.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Neno la kawaida la Kiswahili kwa mahali pa kutolea dhabihu.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: akapaita mahali pale
  rationale: Katika muktadha wa kutoa jina, קרא + לְ pamoja na מקום humaanisha kupaita au kupatia mahali jina; kauli hii ni ya asili katika Kiswahili.
- source_word: אֵל בֵּית אֵל
  choice: El-Betheli
  rationale: Kirai hiki kinafanya kazi kama jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa katika matini kuu. Maana yake inayowezekana imehifadhiwa katika tanbihi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya kupaita mahali jina hilo.
- source_word: נִגְלוּ
  choice: alikuwa amejifunua
  rationale: Nifali ya גלה hapa inaeleza Mungu kujidhihirisha mwenyewe. Wakati timilifu “alikuwa amejifunua” unaonyesha kuwa tukio hilo lilitangulia tendo la kupaita mahali.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, katika muktadha huu linamtaja Mungu mmoja aliyekutana na Yakobo huko Betheli.
- source_word: אֵלָיו
  choice: kwake
  rationale: Utoaji wa moja kwa moja na wa kawaida wa maana ya kihusiano “kwake.”
- source_word: בְּבָרְחוֹ
  choice: alipokuwa akimkimbia
  rationale: Kitenzi-jina chenye בְ kinaonyesha hali ya wakati; muundo huu wa Kiswahili unaonyesha tendo la kukimbia lililokuwa likiendelea wakati wa tukio la awali.
- source_word: מִפְּנֵי אָחִיו
  choice: ndugu yake
  rationale: Katika muktadha wa kukimbia, מִפְּנֵי humaanisha kumkimbia au kwenda mbali na mtu; kitenzi “akimkimbia” tayari kinabeba maana ya “kutoka mbele ya.”
theological_decisions:
- issue: Umbo la wingi אֱלֹהִים pamoja na kitenzi cha wingi נִגְלוּ likimtaja Mungu wa Israeli
  choice: 'Kutafsiri kwa umoja: “Mungu alikuwa amejifunua kwake”'
  alternative: “Mungu alimtokea” au tafsiri ya kimuundo ya wingi
  rationale: Muktadha unahusu kukutana kwa Yakobo na Mungu mmoja huko Betheli. Tafsiri ya umoja haileti dhana ya miungu mingi, huku “amejifunua” ikihifadhi wazo la kujidhihirisha lililomo katika Nifali.
- issue: Kutafsiri au kutoholewa kwa אֵל בֵּית אֵל
  choice: Kutoholewa kama jina “El-Betheli” katika matini kuu
  alternative: “Mungu wa Betheli”
  rationale: Kirai hiki ndilo jina ambalo Yakobo analipa mahali. Kutoholewa kunahifadhi tendo la kutoa jina, na maana inayowezekana inaelezwa katika tanbihi bila kuifanya kuwa tafsiri pekee isiyo na utata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kisimulizi ulio wazi na wenye heshima. “Hapo” limerudiwa kwa kufuata msisitizo wa Kiebrania, na jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
