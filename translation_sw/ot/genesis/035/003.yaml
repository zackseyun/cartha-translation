base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: sw
  text: Tuinuke, twende juu hadi Betheli; huko nitamjengea madhabahu kwa ajili ya Mungu aliyenijibu[a] siku ya dhiki yangu na aliyekuwa pamoja nami katika njia niliyoipitia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayenijibu,” kwa kuhifadhi kishirikishi cha Kiebrania kama maelezo ya jumla au ya tendo linaloendelea la Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָק֥וּמָה
  choice: Na tuinuke
  rationale: Huhifadhi hali ya kuhimiza ya nafsi ya kwanza wingi, huku ikiwa Kiswahili cha sasa na chenye hadhi.
- source_word: וְנַעֲלֶ֖ה
  choice: twende
  rationale: Kitenzi kina maana ya kupanda au kwenda juu. Katika Kiswahili, ‘twende Betheli’ ni ya kawaida zaidi; mwelekeo wa safari unaeleweka bila usemi mzito wa ‘tupande kwenda.’
- source_word: בֵּֽית אֵ֑ל
  choice: Betheli
  rationale: Ni jina la mahali; umbo ‘Betheli’ linafuata matumizi yaliyozoeleka katika Kiswahili.
- source_word: וְאֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ
  choice: huko nitamjengea ... madhabahu
  rationale: Ingawa עשה ni ‘kufanya,’ Kiswahili cha kawaida husema ‘kujenga madhabahu.’ Kauli ya kutendea inaonyesha kuwa madhabahu inawekwa wakfu kwa Mungu.
- source_word: לָ/אֵ֞ל
  choice: Mungu
  rationale: Kauli ya kutendea katika ‘nitamjengea Mungu’ inawasilisha maana ya kuelekezwa au kuwekwa wakfu kwa Mungu bila kulazimisha kirai kisicho cha kawaida.
- source_word: הָ/עֹנֶ֤ה אֹתִ/י֙
  choice: aliyenijibu[a]
  rationale: Muktadha unakumbuka jibu maalumu la Mungu katika wakati uliopita. Tanbihi inahifadhi uwezekano wa kishirikishi kueleza tabia ya kuendelea.
- source_word: בְּ/י֣וֹם צָֽרָתִ֔/י
  choice: siku ya taabu yangu
  rationale: Huhifadhi nahau ya Kiebrania ‘siku ya’ na maana ya dhiki au hali ngumu bila kuongeza ufafanuzi.
- source_word: וַ/יְהִי֙ עִמָּדִ֔/י
  choice: na aliyekuwa pamoja nami
  rationale: Wakati uliopita unafaa simulizi la kukumbuka uwepo wa Mungu katika safari ya Yakobo.
- source_word: בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי
  choice: katika njia niliyoenda
  rationale: Huhifadhi picha halisi ya ‘njia’ na tendo la kwenda, kwa muundo unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Maana mahususi ya אֵל katika kauli ya Yakobo
  choice: Mungu ... Mungu aliyenijibu
  alternative: yule Mungu aliyenijibu
  rationale: Kurudiwa kwa ‘Mungu’ baada ya deshi kunadhihirisha kuwa kishazi kinamtambulisha Mungu kwa tendo lake kwa Yakobo, bila kufanya usemi wa Kiswahili kuwa mzito wala kuingiza fundisho la ziada.
- issue: Nguvu ya wakati katika kishirikishi הָעֹנֶה
  choice: aliyenijibu
  alternative: anayenijibu
  rationale: Muktadha unaelekea kwenye tukio maalumu la zamani, lakini Kiebrania pia kinaweza kueleza tabia ya Mungu ya kujibu. Uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa karibu na Kiebrania, lakini ‘kujenga madhabahu’ na ‘twende Betheli’ zimetumiwa kwa uasilia wa Kiswahili. Alama ya tanbihi imewekwa baada ya neno linalohusika moja kwa moja, ‘aliyenijibu.’
