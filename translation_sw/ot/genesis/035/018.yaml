base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: sw
  text: Ikawa, uhai wake ulipokuwa ukimtoka—kwa maana alikuwa akifa—akamwita Ben-Oni[a]; lakini baba yake akamwita Benyamini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Ben-Oni maana yake ni “mwana wa huzuni yangu” au “mwana wa mateso yangu.”
    reason: lexical_alternative
  - marker: b
    text: Huenda Benyamini maana yake ni “mwana wa mkono wa kuume”; wengine huelewa jina hilo kuwa “mwana wa kusini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת נַפְשָׁהּ
  choice: uhai wake ulipokuwa ukimtoka
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha uhai; tafsiri hii ni ya kawaida kwa Kiswahili na haingizi madai ya kiufundi kuhusu nafsi kutengana na mwili. Muundo wa ב pamoja na kitenzi-jina umetafsiriwa kwa maana ya wakati unaoendelea.
- source_word: כִּי מֵתָה
  choice: kwa maana alikuwa akifa
  rationale: Kifungu kinafafanua maneno yaliyotangulia. Ingawa kitenzi kinaweza kutafsiriwa ‘alikufa,’ mtiririko wa simulizi unaonyesha kwamba tendo la kumpa mtoto jina lilitokea alipokuwa katika hali ya kufa.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: akamwita jina lake
  rationale: Huhifadhi nahau ya Kiebrania ya kutoa jina na pia usambamba na tendo la baba katika sehemu ya pili ya mstari.
- source_word: בֶּן אוֹנִי
  choice: Ben-Oni
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa katika matini kuu; maana yake inayowezekana imewekwa katika tanbihi kwa kuwa ni muhimu kwa simulizi.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: lakini baba yake akamwita
  rationale: Kiunganishi kimetafsiriwa kwa maana ya utofautishaji kwa sababu jina alilotoa baba linapingana na lile alilotoa mama.
- source_word: בִנְיָמִין
  choice: Benyamini
  rationale: Imetumiwa namna ya kawaida ya jina hili katika Biblia za Kiswahili; maana zake za ki-etimolojia zinazowezekana zimehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya kianthropolojia ya נֶפֶשׁ katika muktadha wa kifo
  choice: uhai
  alternative: nafsi
  rationale: Neno la Kiebrania linaweza kumaanisha mtu aliye hai au uhai wake, wala si lazima liwe kauli ya kiufundi kuhusu nafsi isiyo ya mwili kuondoka mwilini. ‘Uhai’ huhifadhi maana ya simulizi bila kufunga mjadala wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa matumizi yaliyozoeleka, huku maana zake zikitolewa katika tanbihi.
