  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: sw
  text: Yakobo akapaita mahali pale ambapo Mungu alikuwa amesema naye, Betheli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betheli maana yake ni “nyumba ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: akapaita
  rationale: Katika Kiswahili, kitenzi ‘kuita’ pamoja na kiarifu cha jina kinawasilisha kwa ufasaha nahau ya Kiebrania ‘akaliita jina’; kutaja ‘jina’ tena kungekuwa kwa uzito usio wa kawaida.
- source_word: הַמָּקוֹם ... שָׁם
  choice: mahali pale ambapo
  rationale: ‘Mahali pale ambapo’ ni muundo wa kawaida wa Kiswahili unaohifadhi msisitizo wa mahali uliomo katika kibainishi na neno שָׁם, bila marudio yasiyo ya kawaida kama ‘ambapo ... huko.’
- source_word: דִּבֶּר אִתּוֹ
  choice: alikuwa amesema naye
  rationale: ‘Kusema naye’ hufuata maana ya msingi ya אִתּוֹ, ‘pamoja naye,’ na wakati uliotangulia unaonyesha kuwa mazungumzo yalitangulia tendo la kupaita mahali.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno lina maana ya umoja na linamtaja Mungu aliyesema na Yakobo.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Jina la mahali limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili badala ya kutafsiriwa ndani ya mstari.
theological_decisions:
- issue: Maana ya umoja ya אֱלֹהִים
  choice: Mungu
  alternative: miungu
  rationale: Muktadha wa simulizi na matumizi ya kisarufi humtaja Mungu mmoja aliyesema na Yakobo; tafsiri ya wingi ingepotosha maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo ‘mahali pale ambapo’ huhifadhi rejeo la mahali la Kiebrania kwa ufasaha, na ‘alikuwa amesema naye’ huhifadhi wazo la Mungu kuzungumza pamoja na Yakobo.
