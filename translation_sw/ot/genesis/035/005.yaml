base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: sw
  text: Kisha wakaondoka, na hofu iliyotoka kwa Mungu[a] ikaangukia miji iliyowazunguka, hivyo hawakuwafuatilia wana wa Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “hofu ya Mungu.”
    reason: Muundo wa Kiebrania חִתַּת אֱלֹהִים unaweza kueleweka kuwa hofu iliyotoka kwa Mungu au, kwa namna ya moja kwa moja zaidi, “hofu ya Mungu.”
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: Kisha wakaondoka
  rationale: Kitenzi נסע kinaonyesha kuondoka ili kuendelea na safari; “wakaondoka” ni Kiswahili cha kawaida na “Kisha” kinaendeleza simulizi.
- source_word: וַיְהִי חִתַּת אֱלֹהִים
  choice: hofu iliyotoka kwa Mungu ikaangukia
  rationale: Muundo huu unaonyesha tukio la hofu kuwafikia watu wa miji hiyo. “Iliyotoka kwa Mungu” huonyesha chanzo kinachowezekana cha hofu bila kuficha maana halisi zaidi ya “hofu ya Mungu,” iliyowekwa katika tanbihi.
- source_word: עַל הֶעָרִים
  choice: miji ... ikaangukia
  rationale: Muundo wa Kiswahili “ikaangukia miji” unadumisha taswira ya Kiebrania ya hofu kuwa juu ya miji kwa lugha inayoeleweka.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: iliyowazunguka
  rationale: Hii inaeleza kwa ufupi na kwa kawaida miji iliyokuwa pande zote za kundi la Yakobo.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: hivyo hawakuwafuatilia
  rationale: “Kuwafuatilia” huwasilisha nahau ya רדף אחרי, yaani kuwafuata kwa nia ya kuwakamata; “hivyo” huonyesha matokeo ya hofu iliyotangulia.
- source_word: בְּנֵי יַעֲקֹב
  choice: wana wa Yakobo
  rationale: “Wana wa Yakobo” hudumisha wazi rejeo la Kiebrania kwa watoto wake wa kiume.
theological_decisions:
- issue: Maana ya muundo חִתַּת אֱלֹהִים
  choice: hofu iliyotoka kwa Mungu
  alternative: hofu ya Mungu; au hofu kuu
  rationale: Katika muktadha, maneno haya yanaelekea kuonyesha hofu iliyosababishwa au kutumwa na Mungu na hivyo ulinzi wake kwa familia ya Yakobo. Hata hivyo, muundo wa Kiebrania unaweza kutafsiriwa moja kwa moja kuwa “hofu ya Mungu”; uwezekano huo umehifadhiwa katika tanbihi badala ya kuondolewa.
- issue: Rejeo la בְּנֵי יַעֲקֹב
  choice: wana wa Yakobo
  alternative: watoto wa Yakobo
  rationale: Nomino ya Kiebrania ni ya kiume katika muktadha huu, kwa hiyo tafsiri haibadili rejeo hilo kuwa lisiloonyesha jinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka mwendo wa simulizi kwa urahisi, huku tanbihi ikihifadhi utata halisi wa muundo wa Kiebrania.
