base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: sw
  text: Yakobo akamjia Isaka baba yake huko Mamre, Kiriath-arba (yaani, Hebroni), ambako Abrahamu na Isaka waliishi kama wageni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikaa kama wakazi wa muda.” Kitenzi cha Kiebrania kina maana ya kukaa mahali kama mgeni au mtu asiye mwenyeji, si kuishi mahali tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akamjia
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kufika. “Akamjia” kinaonyesha kwa njia ya asili kwamba Yakobo alifika mahali alipokuwa Isaka, huku kikihifadhi mtazamo wa kuja kwa baba yake.
- source_word: אֶל יִצְחָק אָבִיו
  choice: Isaka baba yake
  rationale: Muundo huu unamtaja Isaka waziwazi kuwa baba ya Yakobo; Kiswahili cha sasa hakihitaji kihusishi kingine baada ya “akamjia.”
- source_word: מַמְרֵא
  choice: Mamre
  rationale: Jina la mahali limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: קִרְיַת הָאַרְבַּע
  choice: Kiriath-arba
  rationale: Jina la mahali limehifadhiwa kama jina maalumu badala ya kutafsiriwa kuwa “mji wa Arba,” kwa kuwa kifungu kinachofuata tayari kinaitambulisha mahali hapo.
- source_word: הִוא חֶבְרוֹן
  choice: yaani, Hebroni
  rationale: Kiwakilishi pamoja na jina la mahali vinafafanua kwamba Kiriath-arba ni Hebroni; “yaani” ni njia ya kawaida na wazi ya kutoa utambulisho huo.
- source_word: אֲשֶׁר ... שָׁם
  choice: ambako
  rationale: Kirejeshi na kielezi cha mahali vimeunganishwa kwa Kiswahili asilia kuwa “ambako,” bila kupoteza maana ya mahali.
- source_word: גָּר
  choice: waliishi kama wageni
  rationale: Kitenzi גור hakimaanishi kuishi tu, bali kukaa mahali kama mgeni au mkazi asiye wa kudumu. Usemi huu unaeleweka kwa wasomaji wa sasa na kuhifadhi dhana hiyo.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abrahamu na Isaka
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
