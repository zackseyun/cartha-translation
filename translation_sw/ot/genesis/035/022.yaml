  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: sw
  text: Ikawa Israeli alipokuwa akiishi katika nchi ile, Reubeni akaenda akalala na Bilha, suria wa baba yake; naye Israeli akasikia habari hiyo.[a] Basi, wana wa Yakobo walikuwa kumi na wawili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, Kiebrania kinasema, “Israeli akasikia.” Kitu alichosikia hakitajwi, lakini kinarejelea wazi tendo la Reubeni.
    reason: lexical_alternative
  - marker: b
    text: Au kwa tafsiri ya moja kwa moja zaidi, “Na wana wa Yakobo walikuwa kumi na wawili.” Kishazi hiki kinaelekea kuwa mpito kuelekea orodha ya wana katika mistari inayofuata.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutanguliza tukio jipya katika simulizi kwa lugha ya sasa yenye hadhi, bila kutumia mtindo wa kizamani.
- source_word: בִּשְׁכֹּן
  choice: alipokuwa akiishi
  rationale: Muundo huu unaonyesha hali iliyokuwa ikiendelea wakati tukio kuu lilipotokea.
- source_word: בָּאָרֶץ הַהִוא
  choice: katika nchi ile
  rationale: Hapa אָרֶץ inarejelea eneo au nchi husika, si dunia nzima.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi hiki kimehifadhiwa kama hatua tofauti katika mfululizo wa simulizi wa Kiebrania.
- source_word: וַיִּשְׁכַּב אֶת
  choice: akalala na
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayoeleza tendo la ngono kwa uwazi unaolingana na nahau ya Kiebrania, bila maelezo ya kitabibu yasiyohitajika.
- source_word: פִּילֶגֶשׁ
  choice: suria
  rationale: Neno hili hutaja kwa ufupi mwanamke aliyekuwa na hadhi ya kindoa ya chini katika nyumba ya kale, bila kuongeza ufafanuzi katika matini kuu.
- source_word: אָבִיו
  choice: wa baba yake
  rationale: Ni muundo wa kawaida wa Kiswahili unaoonyesha umilikaji.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: naye Israeli akasikia habari hiyo
  rationale: Kiebrania hakitaji kitu kilichosikiwa, lakini Kiswahili cha kawaida hunufaika kwa kukitaja; “habari hiyo” kinarejelea wazi tendo la Reubeni bila kuongeza mwitikio wowote wa Israeli.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: Basi, wana wa Yakobo walikuwa kumi na wawili
  rationale: “Basi” linaonyesha mpito kuelekea orodha inayofuata, huku taarifa ya idadi ikitafsiriwa moja kwa moja.
theological_decisions:
- issue: Kutafsiri nahau ya tendo la ngono bila kuificha au kuifanya iwe ya kitabibu kupita kiasi
  choice: akalala na
  alternative: akafanya naye ngono
  rationale: “Akalala na” ni nahau inayoeleweka wazi katika Kiswahili cha sasa na inadumisha uzito na ufupi wa taarifa ya Kiebrania.
- issue: Kutoingiza mwitikio wa Israeli ambao haukutajwa
  choice: Israeli akasikia habari hiyo
  alternative: Israeli aliposikia akakasirika
  rationale: Matini inasema tu kwamba Israeli alisikia; haisemi hapa alijisikiaje wala alichukua hatua gani.
- issue: Kuelewa kishazi cha mwisho kama mpito wa kisimulizi
  choice: Basi, wana wa Yakobo walikuwa kumi na wawili
  alternative: Na wana wa Yakobo walikuwa kumi na wawili
  rationale: “Basi” linaashiria kwa kawaida mpito kuelekea orodha ya wana katika mistari inayofuata, bila kukipa kishazi maana ya kiitikadi isiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. “Suria” limehifadhiwa kama istilahi fupi ya kihistoria; “akalala na” linaweka wazi maana ya kingono bila lugha chafu wala maelezo ya kitabibu.
