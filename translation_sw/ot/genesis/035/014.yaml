  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: sw
  text: Yakobo akasimamisha nguzo[a] mahali ambapo alikuwa amesema naye—nguzo ya jiwe. Akamimina sadaka ya kinywaji juu yake[b], kisha akamimina mafuta juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, jiwe lililosimamishwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, sadaka ya kumiminwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: akasimamisha
  rationale: Hifili ya נצב inaonyesha kumfanya kitu kisimame; “akasimamisha” ni ya kawaida na inaeleza tendo hilo kwa uwazi.
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: nguzo ya jiwe
  rationale: Kirai hiki kinamaanisha jiwe lililosimamishwa kama alama au mnara. “Nguzo ya jiwe” ni tafsiri fupi, yenye hadhi, bila kuongeza kusudi ambalo mstari haulielezi.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: mahali ambapo alikuwa amesema naye
  rationale: Muundo huu unaonyesha kwamba kusema kulitangulia kusimamishwa kwa nguzo, huku ukihifadhi kutotajwa wazi kwa mtendaji wa kitenzi katika kirai cha Kiebrania.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: akaimiminia sadaka ya kinywaji
  rationale: Kitenzi na nomino yake zinaeleza kumimina toleo la kioevu katika ibada. “Sadaka ya kinywaji” inaeleweka katika Kiswahili cha Biblia na inahifadhi maana ya kiibada.
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: akaimiminia mafuta
  rationale: Tafsiri hii inahifadhi tendo halisi la kumimina na haitaji mafuta ya zeituni, jambo ambalo halijaelezwa wazi katika Kiebrania.
theological_decisions:
- issue: Maana ya kitendo cha Yakobo kwa nguzo na matoleo
  choice: 'Vitendo vimeelezwa tu: kusimamisha nguzo, kumimina sadaka ya kinywaji, na kumimina mafuta.'
  alternative: Kusema wazi kwamba Yakobo aliweka wakfu nguzo au aliifanya kuwa ukumbusho.
  rationale: Mstari wenyewe hautoi ufafanuzi wa moja kwa moja kuhusu kusudi la kitheolojia la vitendo hivyo; kwa hiyo tafsiri haiongezi maana ya kiibada au ya ukumbusho isiyotajwa.
- issue: Mtendaji wa kitendo cha kusema
  choice: 'Kutotaja jina la mtendaji: “alikuwa amesema naye.”'
  alternative: 'Kusema wazi: “Mungu alikuwa amesema naye.”'
  rationale: Muktadha unaonyesha kwamba Mungu ndiye aliyesema na Yakobo, lakini kirai cha Kiebrania hakilitaji jina lake hapa. Muundo uliochaguliwa unahifadhi hali hiyo bila kupotosha tendo lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi na unaoeleweka. “Akasimamisha” na “akaimiminia” huendeleza mfuatano wa matendo ya simulizi. Msamiati wa kiibada umewekwa wazi bila maelezo ya kimadhehebu.
