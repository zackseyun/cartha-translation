  language: sw
  text: Kisha Mungu akapanda kutoka kwake[a], mahali pale ambapo alikuwa amesema naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akapaa kutoka kwake.” Kiebrania kinahifadhi wazo la mwendo wa kwenda juu katika kuondoka kwa Mungu baada ya kukutana naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapaa
  rationale: Kitenzi עלה katika qal kinaonyesha mwendo wa kwenda juu. “Akapaa” kinahifadhi picha hiyo ya kwenda juu katika kuondoka kwa Mungu, badala ya kuififisha kwa tafsiri kama “akaondoka.”
- source_word: מֵעָלָיו
  choice: kutoka kwake
  rationale: Kirai hiki kihalisi kina wazo la kutoka juu ya au karibu na mtu. “Kutoka kwake” ni Kiswahili cha kawaida kinachoonyesha Mungu kuondoka kwa Yakobo bila kutoa picha isiyokusudiwa kwamba alikuwa amekaa juu yake.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi kisarufi, hapa linaambatana na kitenzi cha umoja na linamtaja Mungu mmoja.
- source_word: בַּמָּקוֹם
  choice: mahali pale
  rationale: Hapa בְּ inaonyesha mahali tukio lilipotokea. “Mahali pale” ni ya asili katika masimulizi ya Kiswahili na hudumisha marejeo ya mahali maalumu.
- source_word: אֲשֶׁר
  choice: alipo-
  rationale: Kiambishi cha mahali “alipo-” kinaunganisha kishazi tegemezi na “mahali pale” kwa Kiswahili cha kawaida.
- source_word: דִּבֶּר אִתּוֹ
  choice: alipokuwa amesema naye
  rationale: Muundo wa דבר pamoja na אֵת una maana ya kusema na mtu. Wakati wa kitendo uliotangulia kuondoka kwa Mungu unaonyeshwa kwa “alipokuwa amesema naye,” huku “naye” ikihifadhi wazo la kusema pamoja na mtu badala ya kulifanya tu kuwa kusema kwake.
theological_decisions:
- issue: Maelezo ya Mungu kuondoka kwa mwendo wa kwenda juu
  choice: Kuhifadhi lugha ya mahali na mwendo kwa kusema “Mungu akapaa kutoka kwake.”
  alternative: Mungu akaondoka kwake.
  rationale: Kiebrania kinatumia kitenzi cha kawaida cha kwenda juu. Tafsiri hii inadumisha picha ya kujidhihirisha kwa Mungu na kuondoka kwake bila kuibadili kuwa kauli isiyo na mwelekeo wa mahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akapaa” ni wazi na cha kawaida katika simulizi, huku tanbihi ikitoa “akapanda” kama namna nyingine ya kuonyesha kitenzi cha kwenda juu.
