  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: sw
  text: Ikawa, alipokuwa akipata shida katika kuzaa, mkunga akamwambia, “Usiogope, kwa maana huyu pia ni mwana wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha tukio linalofuata kwa mtindo wa masimulizi, huku ikihifadhi kiunganishi cha Kiebrania bila kutumia lugha nzito isiyo ya kawaida.
- source_word: בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: alipokuwa akipata shida katika kuzaa
  rationale: Muundo huu unaonyesha kuwa kuzaa kwake kulikuwa kugumu. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi hali ya kuendelea ya uchungu huo.
- source_word: הַמְיַלֶּדֶת
  choice: mkunga
  rationale: Hili ndilo neno sanifu la Kiswahili kwa mwanamke anayemsaidia mama wakati wa kujifungua.
- source_word: אַל תִּירְאִי
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja kwa umoja wa kike na ni usemi wa kawaida wa kumtia mtu moyo.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linatanguliza sababu ya mkunga kumwambia asihofu.
- source_word: גַּם זֶה לָךְ בֵּן
  choice: huyu pia ni mwana wako
  rationale: “Huyu” humrejelea mtoto anayezaliwa, “pia” huhifadhi maana ya nyongeza, na “ni mwana wako” huwasilisha kwa Kiswahili cha kawaida muundo halisi wa Kiebrania, ‘kwako mwana.’
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wenye hadhi lakini unaeleweka kwa urahisi. Usemi “huyu pia” umehifadhi msisitizo wa demonstrative na wazo la nyongeza bila kuingiza ufafanuzi wa kimadhehebu.
