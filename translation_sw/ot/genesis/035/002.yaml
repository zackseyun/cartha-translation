base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: sw
  text: Ndipo Yakobo akawaambia watu wa nyumbani kwake na wote waliokuwa pamoja naye, “Ondoeni miungu ya kigeni[a] iliyo miongoni mwenu, jitakaseni[b], na badilisheni mavazi yenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miungu ya wageni.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “jitakaseni” huenda inarejelea utakaso wa kiibada katika maandalizi ya kumkaribia Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: watu wa nyumbani mwake
  rationale: Neno hili kwa msingi ni ‘nyumba yake,’ lakini hapa linamaanisha watu wa jumuia ya nyumbani ya Yakobo, si jengo.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: wote waliokuwa pamoja naye
  rationale: Kirai hiki kinawarejelea watu waliokuwa wakifuatana na Yakobo; tafsiri hii ni ya kawaida na inabaki karibu na Kiebrania.
- source_word: הָסִרוּ
  choice: Ondoeni
  rationale: Amri hii inataka vitu hivyo viondolewe kutoka miongoni mwao au katika milki yao; ‘Ondoeni’ inadumisha nguvu ya amri bila kufafanua kupita maandishi.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: miungu ya kigeni
  rationale: Kirai hiki kinaweza kumaanisha miungu ya wageni au miungu iliyo ngeni; ‘miungu ya kigeni’ ni wazi na ya kawaida katika Kiswahili huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: בְּתֹכְכֶם
  choice: iliyo miongoni mwenu
  rationale: Tafsiri hii inahifadhi upana wa maana ya kuwapo katikati ya jumuiya na pia uwezekano wa kuwa katika milki yao.
- source_word: וְהִטַּהֲרוּ
  choice: jitakaseni
  rationale: Umbo la kitenzi ni la kujirejelea na linaweza kuashiria utakaso wa kiibada katika maandalizi ya kumkaribia Mungu.
- source_word: וְהַחֲלִיפוּ
  choice: mbadilishe
  rationale: Kitenzi kina maana ya kubadili au kuweka vingine; pamoja na mavazi, ‘mbadilishe’ ni tafsiri ya asili.
- source_word: שִׂמְלֹתֵיכֶם
  choice: mavazi yenu
  rationale: Neno linarejelea nguo au mavazi, hasa mavazi ya nje; ‘mavazi’ ni lugha ya sasa, yenye heshima na inayoeleweka.
theological_decisions:
- issue: Asili ya amri ya kujitakasa
  choice: jitakaseni
  alternative: jiosheni au jisafisheni
  rationale: Muktadha wa kuondoa sanamu na kujiandaa kumkaribia Mungu unaunga mkono maana inayoweza kuwa ya kiibada au ya agano. ‘Jitakaseni’ inadumisha uzito huo bila kuongeza mfumo maalumu wa taratibu ambao aya haitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Watu wa nyumbani mwake’ linaeleza maana ya kijamii ya ‘nyumba’ bila kuifanya kuwa familia ya damu pekee. Alama ya tanbihi [a] imewekwa baada ya ‘miungu ya kigeni,’ ambako maelezo yake yanahusika moja kwa moja.
