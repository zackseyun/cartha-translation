  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. “Basi” linaendeleza mfuatano wa simulizi; mabano yanahifadhi ufafanuzi wa jina la mahali. Alama ya tanbihi [a] imewekwa katika matini kuu.
