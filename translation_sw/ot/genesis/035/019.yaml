lexical_decisions:
- source_word: וַתָּמָת
  choice: akafa
  rationale: Kitenzi מות hapa kina maana ya moja kwa moja ya kufa kimwili; “akafa” ni wazi na hakitumii lugha ya kuficha ukweli.
- source_word: רָחֵל
  choice: Raheli
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: וַתִּקָּבֵר
  choice: akazikwa
  rationale: Nifali ya קבר ina maana ya kutendwa, yaani kuzikwa; Kiswahili hutumia kwa kawaida umbo la kitenzi “akazikwa.” Hakuna neno linalomaanisha “huko” katika Kiebrania.
- source_word: בְּדֶרֶךְ
  choice: njiani kuelekea
  rationale: בְּדֶרֶךְ huonyesha mahali katika njia ya safari, na mwelekeo unaofuata katika אֶפְרָתָה unaelezwa kwa Kiswahili cha kawaida kwa “njiani kuelekea.”
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Mwisho wa -ה hapa unaweza kuwakilisha umbo la jina au kuelekea mahali; “Efrata” ni unukuzi unaotambulika katika Kiswahili na unahifadhi umbo kamili la jina.
- source_word: הִוא
  choice: yaani
  rationale: Kiwakilishi hiki kinatumika kiufafanuzi kutambulisha Efrata kuwa Bethlehemu; “yaani” huwasilisha uhusiano huo kwa kawaida.
- source_word: בֵּית לָחֶם
  choice: Bethlehemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapo katika matumizi ya Biblia za Kiswahili.
