id: GEN.35.1
reference: Genesis 35:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: sw
  text: Kisha Mungu akamwambia Yakobo, “Ondoka, panda uende Betheli, ukae huko, na huko umjengee Mungu madhabahu, Mungu aliyekutokea ulipokuwa ukimkimbia Esau ndugu yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza masimulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, huku “akamwambia” ikifaa kwa usemi unaoelekezwa kwa Yakobo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kimofolojia, kitenzi cha umoja na muktadha vinaonyesha Mungu mmoja.
- source_word: קוּם
  choice: Ondoka
  rationale: Amri hii humaanisha kuinuka ili kuchukua hatua. “Ondoka” ni ya kawaida na yenye hadhi katika muktadha huu, bila kulazimisha maana ya kusimama tu.
- source_word: עֲלֵה
  choice: panda uende
  rationale: Huhifadhi wazo la kwenda juu au kupanda kuelekea Betheli kwa Kiswahili cha asili.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili badala ya kutafsiriwa kuwa “Nyumba ya Mungu.”
- source_word: וְשֶׁב שָׁם
  choice: ukae huko
  rationale: ישב hapa inaweza kumaanisha kukaa, kubaki, au kuishi. “Ukae huko” huhifadhi upana huo kwa lugha ya kawaida.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: na huko umjengee madhabahu
  rationale: Ingawa עשה ni “fanya/tengeneza,” kwa madhabahu Kiswahili cha asili hutumia “jenga.” Kiambishi -ee kinaonyesha madhabahu imewekwa wakfu kwa Mungu.
- source_word: לָאֵל
  choice: Mungu
  rationale: ל inaonyesha anayelengwa au kuwekewa wakfu madhabahu; “umjengee madhabahu Mungu” huwasilisha uhusiano huo kwa kawaida.
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: aliyekutokea
  rationale: Nifali ya ראה katika muktadha wa kujidhihirisha kwa Mungu ina maana ya “kutokea,” si tu kuonekana kwa bahati.
- source_word: בְּבָרְחֲךָ
  choice: ulipokuwa ukimkimbia
  rationale: Infinitivu yenye ב inaonyesha wakati au mazingira ya tendo. Muundo huu wa Kiswahili unaonyesha kwamba Yakobo alikuwa akikimbia ili kumwepuka Esau.
- source_word: מִפְּנֵי
  choice: ukimkimbia
  rationale: Nahau ya Kiebrania kwa maana halisi ni “kutoka mbele/uso wa.” Katika muktadha huu, Kiswahili “kumkimbia” huwasilisha kwa asili maana ya kukimbia ili kumwepuka mtu.
- source_word: עֵשָׂו אָחִיךָ
  choice: Esau ndugu yako
  rationale: Mpangilio huu unafuata Kiebrania na bado ni wa kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Rejeo la אֱלֹהִים
  choice: Mungu mmoja ndiye anayesema na Yakobo
  alternative: miungu
  rationale: Kitenzi cha umoja na muktadha wa masimulizi vinamtambulisha Mungu wa Israeli, si miungu mingi.
- issue: Uwasilishaji wa בֵּית אֵל
  choice: Betheli kama jina la mahali
  alternative: Nyumba ya Mungu
  rationale: Katika mstari huu neno hilo ni jina maalumu la mahali; kulitafsiri maana yake katika matini kuu kungeweza kulifanya lisikike kama maelezo badala ya jina.
- issue: Utambulisho katika לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: “Mungu aliyekutokea”
  alternative: “kwa Mungu aliyekutokea”
  rationale: Mungu anatambulishwa kwa tendo lake la awali la kumtokea Yakobo. Muundo wa Kiswahili wenye -jengee unaonyesha wazi kuwa madhabahu ni kwa ajili yake bila kuingiza tafsiri ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri umewekwa wa asili kwa Kiswahili, huku mfuatano wa “ondoka, panda uende ... ukae ... umjengee” ukihifadhi mwendo wa Kiebrania. Hakuna alama ya tanbihi kwa sababu maana ya nahau מִפְּנֵי imewasilishwa moja kwa moja na kwa uwazi katika matini.
