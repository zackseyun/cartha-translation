  text: 'Na wana wa Bilha, kijakazi[a] cha Raheli: Dani na Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi wa kike wa Raheli.” Neno la Kiebrania linamaanisha mtumishi wa kike mwenye hadhi ya chini kijamii; katika baadhi ya miktadha linaweza kumaanisha mtumwa wa kike.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na wana wa
  rationale: Neno בְנֵי ni wingi wa hali ya kuunganisha wa בֵּן, na hapa linataja kundi linalofuata katika orodha ya ukoo. “Wana wa” ni la moja kwa moja na la kawaida katika Kiswahili; “Na” linawakilisha kiunganishi וּ na kuhifadhi muundo wa orodha.
- source_word: בִלְהָה
  choice: Bilha
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika na iliyozoeleka katika Kiswahili.
- source_word: שִׁפְחַת
  choice: mtumishi wa kike
  rationale: שִׁפְחָה humaanisha mtumishi wa kike mwenye hadhi ya chini na katika baadhi ya miktadha anaweza kuwa mtumwa. “Mtumishi wa kike” ni lugha ya sasa, inaonyesha jinsia iliyo katika Kiebrania, na haifungi maana kwa kiwango kisicho hakika.
- source_word: רָחֵל
  choice: wa Raheli
  rationale: Muundo huu unawasilisha kwa kawaida uhusiano wa hali ya kuunganisha katika Kiswahili.
- source_word: דָּן
  choice: Dani
  rationale: Jina la mtu limetoholewa kwa umbo linalozoeleka katika mapokeo ya Kiswahili.
- source_word: וְ/נַפְתָּלִי
  choice: na Naftali
  rationale: Kiunganishi וְ kimetafsiriwa “na,” na jina limetoholewa kwa umbo linalotambulika katika Kiswahili.
