lexical_decisions:
- source_word: וַיֵּרָא
  choice: akamtokea
  rationale: Nifali ya ראה hapa inaeleza Mungu kujidhihirisha au kuonekana kwa Yakobo. ‘Akamtokea’ ni Kiswahili cha kawaida kinachohifadhi wazo la kutokea bila kubainisha namna yake.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja na muktadha vinaonyesha kuwa neno hili linamtaja Mungu mmoja.
- source_word: עוֹד
  choice: tena
  rationale: Hapa neno hili linaonyesha kurudiwa kwa tukio la Mungu kumtokea Yakobo.
- source_word: בְּבֹאוֹ
  choice: alipokuwa akitoka
  rationale: Muundo wa ב pamoja na kitenzi-jina una maana ya wakati. Kwa kuunganishwa na מִן, Kiswahili hiki huonyesha kwa kawaida kuwa Yakobo alikuwa anatoka Padani-Aramu, huku kikidumisha uhusiano wa wakati.
- source_word: מִפַּדַּן אֲרָם
  choice: Padani-Aramu
  rationale: Hili ni jina la mahali; limetoholewa badala ya kutafsiriwa, na kiambishi מִן kimewakilishwa na ‘kutoka’.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: akambariki
  rationale: Pieli ya ברך ina maana ya ‘bariki’; viambishi vya Kiswahili vinaonyesha wazi kuwa Mungu ndiye aliyebariki na Yakobo ndiye aliyebarikiwa.
