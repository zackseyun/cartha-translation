  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: sw
  text: Basi Yakobo akafika Luzi (yaani[a], Betheli), iliyoko katika nchi ya Kanaani—yeye na watu wote waliokuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinataja “Luzi ... yaani, Betheli,” na hivyo kuhifadhi jina la zamani la mahali pamoja na jina ambalo lilijulikana zaidi.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akafika
  rationale: Kitenzi בוא katika mfululizo huu wa simulizi kinaeleza kufika mahali palipokusudiwa; “akafika” ni Kiswahili cha kawaida na chenye kuzingatia mwelekeo wa simulizi.
- source_word: לוּזָה
  choice: Luzi
  rationale: Jina la mahali לוּז limetolewa kwa umbo la Kiswahili “Luzi”; he ya mwelekeo imewakilishwa na maana ya kitenzi “akafika,” si kama sehemu ya jina.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: katika nchi ya Kanaani
  rationale: Kirai hiki kinabainisha mahali Luzi ilipokuwa. Kiswahili kinaweza kutoa taarifa hiyo kwa ufupi bila kiwakilishi rejeshi, huku maana yote ikihifadhiwa.
- source_word: הִוא בֵּית אֵל
  choice: yaani, Betheli
  rationale: Kiwakilishi na jina la mahali vinatambulisha Luzi kuwa Betheli; “yaani” huwasilisha ufafanuzi huo kwa Kiswahili cha kawaida bila kudai zaidi ya utambulisho wa majina uliomo katika Kiebrania.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi hiki kinamrejelea Yakobo kwa msisitizo wa kiasi kabla ya kutaja walioandamana naye.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: pamoja na watu wote waliokuwa pamoja naye
  rationale: עָם hapa ni kundi lililoandamana na Yakobo, si lazima taifa. “Watu wote” ni ya kawaida na inaepuka maana ya kikabila isiyolazimu.
