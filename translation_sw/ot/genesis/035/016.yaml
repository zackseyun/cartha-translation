base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: sw
  text: Kisha wakaondoka Betheli. Walipokuwa bado na umbali fulani wa kwenda kabla ya kufika Efrata[a], Raheli akajifungua, naye akapata shida katika kujifungua kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Efratha,” kwa tahajia nyingine ya jina hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מִבֵּית אֵל
  choice: wakaondoka Betheli
  rationale: Kitenzi נסע katika simulizi kinaonyesha kuvunja kambi na kuendelea na safari. ‘Wakaondoka’ ni Kiswahili cha kawaida kinachoonyesha mwanzo wa safari kutoka mahali hapo.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: walipokuwa bado na umbali fulani wa kwenda
  rationale: כִּבְרַת הָאָרֶץ ni msemo adimu ambao kipimo chake kamili hakijulikani. ‘Umbali fulani’ huhifadhi kutokuwapo kwa kipimo maalumu na kueleza kwamba safari ilikuwa bado haijakamilika.
- source_word: לָבוֹא אֶפְרָתָה
  choice: kabla ya kufika Efrata
  rationale: Muundo huu unaonyesha mahali walikokuwa wakielekea na kwamba hawakuwa wamefika bado. ‘Kabla ya kufika’ huunganika kwa kawaida na wazo la umbali uliobaki.
- source_word: וַתֵּלֶד רָחֵל
  choice: Raheli akajifungua
  rationale: ילד ikiwa na mwanamke kama mtenda humaanisha kujifungua; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: akapata shida katika kujifungua kwake
  rationale: קשה hapa huonyesha ugumu au taabu katika tendo la kujifungua, bila kuongeza maelezo yasiyomo katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya Betheli ili simulizi lisomeke kwa urahisi. Alama ya tanbihi imewekwa baada ya ‘Efrata,’ neno ambalo tanbihi hiyo inalihusu.
