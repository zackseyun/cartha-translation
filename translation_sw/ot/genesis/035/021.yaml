  text: וַ/יִּסַּ֖ע יִשְׂרָאֵ֑ל וַ/יֵּ֣ט אָֽהֳלֹ֔/ה מֵ/הָ֖לְאָה לְ/מִגְדַּל עֵֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: sw
  text: Kisha Israeli akaendelea na safari, akapiga hema lake ng’ambo ya Migdal-eder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-eder maana yake ni “mnara wa kundi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: akaendelea na safari
  rationale: Kitenzi נסע katika mfululizo wa masimulizi kinaonyesha kung’oa kambi na kusafiri kuendelea mbele; usemi huu ni wa kawaida katika Kiswahili na unahifadhi mwendelezo wa tukio.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanatumia jina Israeli, si Yakobo; tafsiri inalihifadhi kama lilivyo.
- source_word: וַיֵּט
  choice: akapiga
  rationale: Kikiwa na אֹהֶל kama yambwa, נטה humaanisha kupiga au kutandaza hema; “akapiga hema” ni usemi wa kawaida wa Kiswahili.
- source_word: אָהֳלֹה
  choice: hema lake
  rationale: 'אֹהֶל ni “hema,” na kiambishi cha nafsi ya tatu ya kiume umoja kinaonyesha umilikaji: “lake.”'
- source_word: מֵהָלְאָה
  choice: ng’ambo ya
  rationale: Kielezi hiki huonyesha mahali palipo mbele zaidi au kupita sehemu fulani; “ng’ambo ya” kinawasilisha kwa kawaida maana ya kuwa upande wa pili wa alama ya mahali.
- source_word: לְמִגְדַּל עֵדֶר
  choice: Migdal-eder
  rationale: Kirai hiki kinafanya kazi kama jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa katika mstari mkuu; maana yake imewekwa katika tanbihi.
