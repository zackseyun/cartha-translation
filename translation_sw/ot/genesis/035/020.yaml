  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: sw
  text: Yakobo akasimamisha nguzo juu ya kaburi lake[a]. Hiyo ndiyo nguzo ya kaburi la Raheli hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alama ya kaburi la Raheli,” au “nguzo inayoashiria kaburi la Raheli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: akasimamisha
  rationale: Hifili ya נצב ina maana ya kusimamisha au kuweka kitu wima; “akasimamisha” ni ya kawaida na inaleta wazi tendo la kuweka jiwe hilo.
- source_word: מַצֵּבָה
  choice: nguzo
  rationale: Neno hili humaanisha jiwe lililosimamishwa au nguzo. “Nguzo” inadumisha picha halisi ya kitu kilichosimamishwa bila kuongeza moja kwa moja wazo la ukumbusho.
- source_word: עַל
  choice: juu ya
  rationale: Katika muktadha huu linaonyesha mahali pa nguzo kuhusiana na kaburi; “juu ya” inafuata maana ya msingi bila kudai muundo maalumu wa kaburi.
- source_word: קְבֻרָתָהּ
  choice: kaburi lake
  rationale: Kiambishi cha nafsi ya kike kinamrejelea Raheli; “kaburi lake” ni fupi, wazi, na hakidokezi kaburi la fahari.
- source_word: הִוא
  choice: Hiyo ndiyo
  rationale: Kiwakilishi kinarejelea nguzo iliyotajwa na kuitambulisha; Kiswahili cha “Hiyo ndiyo” ni cha asili na chenye mkazo unaofaa.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: nguzo ya kaburi la Raheli
  rationale: Muundo huu unahifadhi uhusiano wa maneno katika mnyororo wa hali ya kutegemeana wa Kiebrania, huku ukiendelea kueleweka kwa urahisi katika Kiswahili.
- source_word: עַד הַיּוֹם
  choice: hadi leo
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza kuendelea kwa jambo mpaka wakati wa msimuliaji.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi “akasimamisha” unaendana na mtiririko wa masimulizi ya Mwanzo. “Nguzo” imetumiwa badala ya “mnara” ili kuepuka picha ya jengo kubwa; tanbihi inaonyesha uwezekano wa maana ya alama ya kaburi.
