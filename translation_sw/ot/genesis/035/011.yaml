  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: sw
  text: Mungu akamwambia, “Mimi ni Mungu Mwenyezi.[a] Uzae na uongezeke. Taifa na kusanyiko la mataifa[b] yatatoka kwako, na wafalme watatoka viunoni mwako.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “El Shaddai”; kwa kawaida hutafsiriwa “Mungu Mwenyezi.” Maana kamili ya jina Shaddai haijulikani kwa hakika.'
    reason: lexical_alternative
  - marker: b
    text: Au “jumuiya ya mataifa.” Neno la Kiebrania linaweza kumaanisha kundi, jumuiya, au kusanyiko lililokusanyika.
    reason: lexical_alternative
  - marker: c
    text: “Viunoni mwako” ni nahau inayomaanisha wazao wa kimwili watakaotokana na mtu mwenyewe.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja na muktadha vinaonyesha kuwa umbo hili linamtaja Mungu wa Israeli, si miungu wengi.
- source_word: אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  rationale: Hiki ni cheo cha Mungu; tafsiri ya kawaida ya Kiswahili inaeleza maana badala ya kunukuu tu sauti ya Kiebrania.
- source_word: פְּרֵה וּרְבֵה
  choice: Uzae na uongezeke
  rationale: Vitenzi vyote viwili ni amri kwa mtu mmoja na vinaendeleza kauli ya baraka kuhusu uzao na kuongezeka.
- source_word: גּוֹי
  choice: taifa
  rationale: Katika ahadi kwa mababu, neno hili humaanisha jamii ya watu iliyoundwa kuwa taifa.
- source_word: קְהַל גּוֹיִם
  choice: kusanyiko la mataifa
  rationale: קהל hueleza kundi lililokusanyika; ‘kusanyiko’ huhifadhi picha hiyo bila kulifanya neno limaanishe tu wingi.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: yatatoka kwako
  rationale: Ingawa maana halisi ni ‘yatakuwa kutoka kwako,’ Kiswahili hiki huwasilisha kwa kawaida wazo la nasaba inayotokana na Yakobo.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino hiyo.
- source_word: מֵחֲלָצֶיךָ
  choice: viunoni mwako
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya uzao wa kimwili, huku tanbihi ikifafanua nahau hiyo.
- source_word: יֵצֵאוּ
  choice: watatoka
  rationale: Katika muktadha huu kitenzi kinaeleza wafalme watakaotokana na nasaba ya Yakobo.
theological_decisions:
- issue: Kutafsiri cheo cha Mungu אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  alternative: El Shaddai
  rationale: Kutafsiri cheo kunampa msomaji maana yake ya jadi na inayowezekana, huku tanbihi ikihifadhi umbo la Kiebrania na kutambua utata wake wa kileksika.
- issue: Kiwango cha uhalisi katika ahadi ya uzao
  choice: yatatoka kwako / watatoka viunoni mwako
  alternative: yatakuwa kutoka kwako / watatokana na mwili wako
  rationale: Tafsiri inadumisha msisitizo wa nasaba ya kimwili na picha ya Kiebrania, lakini inatumia Kiswahili kinachoeleweka katika sehemu nyingine ya kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Amri za umoja ‘uzae’ na ‘uongezeke’ zinamwelekea Yakobo binafsi; ‘kusanyiko’ huhifadhi taswira ya קהל, na ‘viunoni mwako’ huhifadhi nahau halisi kwa ufafanuzi wa tanbihi.
