  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: sw
  text: Shemu naye, baba wa wana wote wa Eberi na ndugu mkubwa wa Yafethi, alipata watoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa Yafethi, aliyekuwa mkubwa kwa umri.” Kivumishi cha Kiebrania kinachomaanisha “mkubwa” kinaweza kumwelezea Shemu au Yafethi.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/לְ/שֵׁם ... יֻלַּד גַּם הוּא
  choice: Pia Shemu ... alizaliwa watoto
  rationale: Muundo huu unahifadhi maana ya nyongeza ya גַּם הוּא na usemi wa nasaba kwamba Shemu pia alipata watoto, huku ukitumia Kiswahili cha kawaida.
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: baba ya wana wote wa Eberi
  rationale: “Baba” hudumisha taswira ya moja kwa moja ya אָב, na “wana wa Eberi” huhifadhi jina na muundo wa nasaba badala ya kuufasiri kuwa kundi jingine.
- source_word: אֲחִי יֶפֶת הַגָּדוֹל
  choice: ndugu mkubwa wa Yafethi
  rationale: Katika muktadha wa undugu, הַגָּדוֹל yaweza kuonyesha ukubwa wa umri. Matini kuu inaichukua kuwa inamwelezea Shemu, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: 'Kihusishi cha הַגָּדוֹל: humwelezea Shemu au Yafethi?'
  choice: 'Humwelezea Shemu: “ndugu mkubwa wa Yafethi.”'
  alternative: 'Humwelezea Yafethi: “ndugu wa Yafethi mkubwa.”'
  rationale: Kiebrania kinaruhusu miunganiko yote miwili. Kwa kuwa huu ni utata halisi wa kisintaksia, matini kuu inachagua usomaji mmoja unaowezekana na tanbihi inahifadhi mwingine bila kudai uhakika usiokuwapo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo ya kawaida ya kibiblia: Shemu, Eberi, Yafethi.'
