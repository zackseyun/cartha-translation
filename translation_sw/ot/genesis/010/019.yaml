base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: sw
  text: Mpaka wa Wakanaani ulianzia Sidoni, kuelekea Gerari hadi Gaza; na kuelekea Sodoma, Gomora, Adma na Seboimu, hadi Lasha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Lesha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ulikuwa
  rationale: Katika mfululizo huu wa masimulizi, kitenzi hiki kinaeleza hali ya mpaka kwa namna ya kawaida ya Kiswahili bila kufuata neno kwa neno muundo wa Kiebrania.
- source_word: גְּבוּל
  choice: mpaka
  rationale: Katika maelezo haya ya kijiografia, neno hili linamaanisha mstari au ukomo wa eneo; “mpaka” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: הַכְּנַעֲנִי
  choice: wa Wakanaani
  rationale: Ingawa jina la Kiebrania lina umbo la umoja lenye maana ya kijumla, hapa linarejelea watu wa Kanaani kama kundi; Kiswahili hutumia wingi “Wakanaani.”
- source_word: מִצִּידֹן
  choice: kuanzia Sidoni
  rationale: Kihusishi kinaonyesha mahali mpaka unapoanzia; “kuanzia” ni wazi na ya asili katika maelezo ya mipaka.
- source_word: בֹּאֲכָה
  choice: kuelekea
  rationale: Usemi huu wa Kiebrania katika maelezo ya mipaka huonyesha mwelekeo wa safari au wa mpaka. “Kuelekea” huhifadhi maana hiyo bila kuongeza nafsi isiyotajwa wazi katika chanzo.
- source_word: גְרָרָה
  choice: Gerari
  rationale: Jina la mahali limetoholewa kwa namna inayotumika kwa urahisi katika Kiswahili; he ya mwelekeo imewasilishwa na “kuelekea.”
- source_word: עַד
  choice: hadi
  rationale: Katika fomula ya mpaka, “hadi” huonyesha wazi ukomo wa eneo.
- source_word: עַזָּה
  choice: Gaza
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: Sodoma, Gomora, Adma na Seboimu
  rationale: Majina yametoholewa kwa maumbo yanayoeleweka katika Kiswahili, huku mfululizo wa maeneo yanayoeleza mpaka ukihifadhiwa.
- source_word: לָשַׁע
  choice: Lasha
  rationale: “Lasha” linafuata kwa karibu vokali za maandishi ya Kiebrania; tofauti “Lesha” imehifadhiwa katika tanbihi.
