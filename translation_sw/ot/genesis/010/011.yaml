  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: sw
  text: Kutoka nchi hiyo, Ashuru alitoka, akajenga Ninawi[a], Rehoboth-Iri, na Kala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka nchi hiyo alitoka akaenda katika Ashuru, akajenga Ninawi, Rehoboth-Iri, na Kala.” Katika usomaji huu, kiima kinaeleweka kuwa Nimrodi kutoka mstari uliotangulia, na אַשּׁוּר linamaanisha eneo la Ashuru badala ya mtu Ashuru.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָ/אָ֥רֶץ הַ/הִ֖וא
  choice: Kutoka katika nchi hiyo
  rationale: מִן huonyesha chanzo au mahali pa kuanzia, na אֶרֶץ hapa ni eneo la nchi. Kauli hii ni ya kawaida katika Kiswahili na inadumisha maana ya kijiografia.
- source_word: יָצָ֣א
  choice: alitoka
  rationale: יצא kwa kawaida humaanisha ‘kutoka.’ ‘Alitoka’ inaeleza mwendo kutoka nchi iliyotajwa bila kutumia lugha ya kizamani.
- source_word: אַשּׁ֑וּר
  choice: Ashuru
  rationale: Jina hili linaweza kumaanisha mtu Ashuru au eneo la Ashuru. Muundo wa karibu wa sentensi unaeleweka kwa kawaida kama Ashuru ndiye kiima, lakini maana ya eneo imehifadhiwa katika tanbihi.
- source_word: וַ/יִּ֨בֶן֙
  choice: na kujenga
  rationale: בנה ni kitenzi cha kawaida cha ‘kujenga.’ Tafsiri hii ni ya moja kwa moja kuliko ‘kuanzisha,’ ambayo ingeongeza ufafanuzi.
- source_word: נִ֣ינְוֵ֔ה
  choice: Ninawi
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali Nineveh.
- source_word: רְחֹבֹ֥ת עִ֖יר
  choice: Rehoboth-Iri
  rationale: Katika orodha hii ya miji, kirai hiki kinaeleweka vizuri zaidi kama jina la mahali. ‘Iri’ huhifadhi sehemu ya pili ya jina huku ikifuata matamshi ya karibu ya Kiebrania.
- source_word: כָּֽלַח
  choice: Kala
  rationale: Ni unukuzi unaofaa kwa Kiswahili wa jina hili la mahali.
theological_decisions:
- issue: Kiima na maana ya אַשּׁוּר
  choice: 'Ashuru ndiye kiima: ‘Ashuru alitoka’'
  alternative: ‘Alitoka katika nchi hiyo akaenda Ashuru,’ ambapo Nimrodi ndiye kiima kinachoeleweka kutoka mstari uliotangulia na Ashuru ni eneo
  rationale: Maandishi ya Kiebrania yanaruhusu maana zote mbili kwa sababu אַשּׁוּר linaweza kuwa jina la mtu au la eneo. Muundo wa moja kwa moja wa kishazi unaruhusu kulichukua kama kiima kilichotajwa wazi. Utata wa kweli umehifadhiwa kwa tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina ya kale yameandikwa kwa maumbo yanayofaa Kiswahili, huku utata wa kisarufi na kijiografia wa maandishi ya Kiebrania ukihifadhiwa.
