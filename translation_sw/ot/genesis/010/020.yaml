id: GEN.10.20
reference: Genesis 10:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵי חָ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹֽׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: sw
  text: Hawa ndio wana wa Hamu, kwa koo zao, kwa lugha zao, katika nchi zao, katika mataifa yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kiashiria hiki kinaanzisha kauli ya utambulisho na muhtasari; “Hawa ndio” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.
- source_word: בְנֵי חָם
  choice: wana wa Hamu
  rationale: Muundo huu kwa kawaida ni “wana wa”; katika orodha ya nasaba unaweza kuwajumuisha wazao, lakini tafsiri rasmi haifuti upana huo wa muktadha.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: לְ inaonyesha upangaji kwa makundi, na מִשְׁפָּחָה hapa ni kikundi cha ukoo, si familia ndogo tu.
- source_word: לִלְשֹׁנֹתָם
  choice: kwa lugha zao
  rationale: Ingawa לָשׁוֹן kimsingi ni “ulimi,” hapa kwa njia ya nahau humaanisha lugha.
- source_word: בְּאַרְצֹתָם
  choice: katika nchi zao
  rationale: בְּ ni ya mahali; אֶרֶץ katika wingi humaanisha nchi au maeneo yao, bila kulazimisha dhana ya dola za kisasa.
- source_word: בְּגוֹיֵהֶם
  choice: kwa mataifa yao
  rationale: גּוֹי inaonyesha jamii pana za watu au mataifa; “kwa” hapa hudumisha wazo la kuainishwa kwa makundi, tofauti na kishazi cha mahali kilichotangulia.
theological_decisions:
- issue: Maana ya “wana” katika nasaba
  choice: wana wa Hamu
  alternative: wazao wa Hamu
  rationale: Neno la Kiebrania ni la moja kwa moja “wana wa,” huku muktadha wa nasaba ukiruhusu rejeo pana kwa wazao bila kulibainisha kupita kiasi katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya “kwa” yanahifadhi mpangilio wa makundi katika Kiebrania; “katika nchi zao” linatenganisha wazi mahali na aina nyingine za uainishaji.
