    issue: The final phrase “na kwa mataifa yao” does not reflect the locative בְּ in בְּגוֹיֵהֶם.
    rationale: The source has “in their nations,” structurally parallel to “in their lands” (בְּאַרְצֹתָם). “Katika mataifa yao” preserves this relation; “kwa” instead introduces a classificatory sense.
  revised_text: Hawa ndio wana wa Hamu, kwa koo zao, kwa lugha zao, katika nchi zao, katika mataifa yao.
