review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the demonstrative summary, “sons of Ham,” and the successive clan, language, land, and nation groupings. However, the final Hebrew preposition בְּ is locative, paralleling “in their lands,” rather than classificatory “by/according to.”
  naturalness: The Swahili is clear and suitably formal. Repeating “katika” in the final two phrases gives a natural, precise rendering of the Hebrew structure. The added “na” is not required and slightly obscures the close formal parallelism.
  terminology: “Hamu,” “koo,” “lugha,” “nchi,” and “mataifa” are appropriate Standard East African Swahili biblical terminology. “Mataifa” adequately represents גּוֹיִם here without importing a specific modern political interpretation.
  issues:
