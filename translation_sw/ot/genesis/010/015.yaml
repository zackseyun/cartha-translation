  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: sw
  text: Naye Kanaani akamzaa Sidoni, mzaliwa wake wa kwanza,[a] na Hethi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hethi anahusishwa na Wahiti kama babu wa ukoo katika nasaba inayozunguka kifungu hiki.
