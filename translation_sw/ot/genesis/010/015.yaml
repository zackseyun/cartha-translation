lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Naye Kanaani
  rationale: Kiunganishi ו kinaendeleza mfululizo wa nasaba; “Naye” ni njia ya asili ya Kiswahili ya kuunganisha taarifa hii na iliyotangulia. Jina כנען limetolewa kwa umbo la kawaida la Kiswahili, “Kanaani.”
- source_word: יָלַד
  choice: akamzaa
  rationale: Katika nasaba, kitenzi ילד humaanisha kuzaa au kuwa mzazi wa mtu. “Akamzaa” ni cha kawaida, kifupi, na kinadumisha maana ya uhusiano wa moja kwa moja wa uzazi bila kutumia lugha ya kizamani.
- source_word: אֶת
  choice: '[hakijatafsiriwa]'
  rationale: Hiki ni kiashiria cha yambwa mahsusi katika Kiebrania, kisicho na neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: צִידֹן
  choice: Sidoni
  rationale: Jina hili limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili, “Sidoni.”
- source_word: בְּכֹר/וֹ
  choice: mzaliwa wake wa kwanza
  rationale: Nomino בְּכוֹר pamoja na kiambishi cha nafsi ya tatu ya kiume humtambulisha Sidoni kuwa mzaliwa wa kwanza wa Kanaani. Kauli hii ni wazi na ya asili katika Kiswahili cha sasa.
- source_word: וְ/אֶת
  choice: na
  rationale: Kiunganishi ו kinamtambulisha mzao wa pili, huku kiashiria cha yambwa אֶת hakihitaji kutafsiriwa katika Kiswahili.
- source_word: חֵת
  choice: Hethi
  rationale: Jina la mtu limetolewa kwa umbo la kawaida la Kiswahili, “Hethi.” Maelezo kwamba anahusishwa na Wahiti hayajaingizwa katika matini kuu kwa kuwa Kiebrania hapa kinataja jina pekee.
