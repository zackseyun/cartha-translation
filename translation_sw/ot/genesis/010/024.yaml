source:
  edition: WLC
  text: וְ/אַרְפַּכְשַׁ֖ד יָלַ֣ד אֶת שָׁ֑לַח וְ/שֶׁ֖לַח יָלַ֥ד אֶת עֵֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/024.yaml
  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: sw
  text: Arpakshadi akamzaa Shela[a], naye Shela akamzaa Eberi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri za kimapokeo mara nyingi hutumia maumbo “Arfaksadi” na “Sala” hapa, yaliyoathiriwa na Kigiriki; matini kuu inafuata kwa karibu zaidi maumbo ya Kiebrania “Arpakshadi” na “Shela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpakshadi
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania אַרְפַּכְשַׁד kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: יָלַד
  choice: akamzaa
  rationale: Katika nasaba yenye mtendaji wa kiume, kitenzi יָלַד humaanisha kwamba alikuwa baba wa mtu aliyetajwa. Kiswahili 'akamzaa' ni kifupi, cha asili, na kinafaa katika mfululizo wa nasaba.
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa mahsusi katika Kiebrania, kisicho na neno la pekee linalolingana nacho katika Kiswahili; kazi yake inaonyeshwa na mpangilio wa sentensi.
- source_word: שָׁלַח / שֶׁלַח
  choice: Shela
  rationale: Jina limetoholewa kutoka umbo la Kiebrania, badala ya kutumia umbo la mapokeo lililoathiriwa na Kigiriki.
- source_word: וְ/שֶׁלַח
  choice: naye Shela
  rationale: Kiunganishi וְ kimetafsiriwa 'naye' ili kuunganisha vifungu viwili kwa Kiswahili cha asili huku jina likirudiwa kama katika chanzo.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Jina עֵבֶר limetoholewa kuwa 'Eberi,' umbo linaloweza kutamkwa kwa urahisi katika Kiswahili na linalofuata jina la Kiebrania bila kuingiza H ya mapokeo mengine.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa nasaba. Muundo 'akamzaa' ni wa kawaida na unaeleweka, bila kutumia lugha ya kizamani. Kiashiria [a] kimewekwa baada ya 'Shela' kama katika safu ya mashauriano ya Kiingereza.
