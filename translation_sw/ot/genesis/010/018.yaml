  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: sw
  text: na Waarvadi, Wasemari, na Wahamathi. Baadaye koo za Wakanaani[a] zilitawanyika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “koo za Mkanaani.” Kiebrania hutumia jina la taifa katika umoja wa kijumla (“Mkanaani”) kurejelea kundi lote la watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: Waarvadi
  rationale: Jina hili la watu liko katika umoja wa kimofolojia lakini lina maana ya kijumla katika orodha ya mataifa; wingi wa Kiswahili unaonyesha kundi hilo kwa kawaida.
- source_word: הַצְּמָרִי
  choice: Wasemari
  rationale: Kama majina mengine ya watu katika muktadha huu, neno hili linatumika kwa maana ya kijumla; umbo la wingi linafaa kwa Kiswahili.
- source_word: הַחֲמָתִי
  choice: Wahamathi
  rationale: Ni jina la kijumla la watu wa Hamathi, hivyo limetafsiriwa kwa wingi wa Kiswahili.
- source_word: וְאַחַר
  choice: Baadaye
  rationale: Hutaja wakati uliofuata baada ya makundi yaliyotangulia kuorodheshwa na ni usemi wa kawaida wa Kiswahili.
- source_word: נָפֹצוּ
  choice: zilitawanyika
  rationale: Kauli ya Nifali inaonyesha kutawanyika au kusambaa; 'zilitawanyika' huhifadhi maana hiyo bila kudokeza wazi mtendaji ambaye Kiebrania hakumtaji.
- source_word: מִשְׁפְּחוֹת
  choice: koo
  rationale: Katika muktadha wa nasaba na mataifa, neno hili linamaanisha vikundi vya undugu vilivyo pana kuliko familia ya nyumbani; 'koo' ni sawa ya asili katika Kiswahili.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa neno la Kiebrania ni la umoja kimofolojia, linarejelea watu wa Kanaani kwa ujumla; wingi wa Kiswahili huwasilisha maana hiyo wazi.
