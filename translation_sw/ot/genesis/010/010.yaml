base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: sw
  text: Mwanzo wa ufalme wake ulikuwa Babeli[a], Ereki, Akadi na Kalne[b], katika nchi ya Shinari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Babiloni” badala ya Babeli.
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida Ereki hutambuliwa kuwa mji wa kale wa Uruki, na Akadi kuwa Akkad.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: ulikuwa
  rationale: Kitenzi hiki hapa kinafanya kazi kama kishirikishi cha wakati uliopita kinachoanzisha maelezo ya eneo la ufalme wa Nimrodi; “ulikuwa” ni Kiswahili cha kawaida na cha asili.
- source_word: רֵאשִׁית
  choice: Mwanzo wa
  rationale: Neno linaweza kumaanisha mwanzo, sehemu ya kwanza, au sehemu kuu. Katika muktadha wa orodha ya miji, “Mwanzo wa” huhifadhi wazo la kitovu au eneo la awali bila kulifanya kimakusudi kuwa “mji mkuu.”
- source_word: מַמְלַכְתּוֹ
  choice: ufalme wake
  rationale: Nomino hii inaweza kumaanisha ufalme, utawala wa kifalme, au enzi. Kwa kuwa miji inaorodheshwa kama sehemu za eneo lake, “ufalme wake” ndiyo tafsiri iliyo wazi zaidi.
- source_word: בָּבֶל
  choice: Babeli
  rationale: Jina la Kiebrania limenukuliwa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia; pia huhifadhi uhusiano wa kifasihi na simulizi la Mwanzo 11.
- source_word: אֶרֶךְ
  choice: Ereki
  rationale: Jina la mahali limenukuliwa kutoka umbo la Kiebrania kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kulibadilisha moja kwa moja kuwa jina la kihistoria Uruki.
- source_word: אַכַּד
  choice: Akadi
  rationale: Jina limenukuliwa kwa tahajia ya Kiswahili inayolingana na umbo la Kiebrania na utambulisho wake wa kihistoria.
- source_word: כַלְנֵה
  choice: Kalne
  rationale: Tafsiri inafuata usomaji wa Maandiko ya Kimasora katika aya hii na kulinukuu jina hilo badala ya kutumia jina jingine linalohusishwa nalo.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: katika nchi ya Shinari
  rationale: “Nchi” huhifadhi maana ya kijiografia ya אֶרֶץ, huku “Shinari” likinukuliwa kama jina la mahali.
