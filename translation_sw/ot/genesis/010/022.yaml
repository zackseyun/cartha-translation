  text: 'Wana wa Shemu: Elamu, Ashuru[b], Arpakshadi[a], Ludi, na Aramu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina “Arpakshadi”; maumbo mengine ya kimapokeo yameathiriwa na utohozi wa Kigiriki.
    reason: lexical_alternative
  - marker: b
    text: Majina “Ashuru” na “Aramu” mara nyingi huhusishwa na maeneo au mataifa yaliyojulikana baadaye kama Asiria na Siria.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni hali ya wingi ya neno בֵּן katika muundo wa umilikaji. Katika orodha hii ya ukoo, “wana wa” linafuata moja kwa moja mtazamo wa ukoo wa kiume wa Kiebrania bila kupanua maana kuwa “wazao wa.”
- source_word: שֵׁם
  choice: Shemu
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika na lililozoeleka katika Kiswahili.
- source_word: עֵילָם
  choice: Elamu
  rationale: Jina limetoholewa kutoka Kiebrania na kutumiwa hapa kama jina la mwana katika orodha ya ukoo.
- source_word: אַשּׁוּר
  choice: Ashuru
  rationale: Jina lenyewe limehifadhiwa badala ya kutafsiriwa kuwa “Ashuru ya kale/Asiria,” kwa sababu mstari huu unataja wana, ingawa jina hilo pia linahusishwa na taifa au eneo.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshadi
  rationale: Utohozi huu unafuata kwa karibu konsonanti za jina la Kiebrania kuliko umbo la kimapokeo lililoathiriwa na Kigiriki.
- source_word: לוּד
  choice: Ludi
  rationale: Ni jina la umoja hapa; halijapanuliwa kuwa jina la kundi la watu.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la Kiebrania limehifadhiwa badala ya jina la baadaye la kijiografia “Siria.”
