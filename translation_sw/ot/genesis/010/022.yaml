translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Majina yametoholewa kwa maumbo ya Kiswahili; muundo mfupi wa orodha ya ukoo umehifadhiwa. Viashirio vya tanbihi vimewekwa baada ya majina yanayohusika; tanbihi ya Arpakshadi imehamishwa kutoka nafasi isiyolingana katika safu ya mashauriano ya Kiingereza.
