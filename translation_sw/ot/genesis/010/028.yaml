lexical_decisions:
- source_word: וְ/אֶת
  choice: na
  rationale: Kiunganishi וְ kimetafsiriwa “na.” Kihisishi אֶת huonyesha yambwa tendwa bainifu katika Kiebrania, lakini hakina neno linalolingana nacho moja kwa moja katika Kiswahili; katika orodha hii ya ukoo kinaachwa bila kutafsiriwa, huku “na” ikirudiwa kwa kila jina.
- source_word: עוֹבָל
  choice: Obali
  rationale: Jina hili limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, kwa kuongeza irabu ya mwisho bila kutafsiri maana ya vipashio vyake.
- source_word: אֲבִימָאֵל
  choice: Abimaeli
  rationale: Jina hili limetoholewa kwa namna ya kawaida ya Kiswahili na halijatafsiriwa kimaanana katika orodha ya ukoo.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Jina hili limetoholewa kama “Sheba,” likihifadhi tofauti yake na jina jingine la Kiebrania linaloweza kutoholewa “Seba.”
