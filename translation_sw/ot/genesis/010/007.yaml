  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: sw
  text: Na wana wa Kushi walikuwa Seba[a], Havila, Sabta, Raama na Sabteka[b]. Na wana wa Raama walikuwa Sheba na Dedani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika nasaba, neno la Kiebrania linalotafsiriwa “wana wa” linaweza kumaanisha wazao au chimbuko la ukoo au kundi la watu, si lazima wana wa moja kwa moja tu.
    reason: cultural_note
  - marker: b
    text: Majina kadhaa katika mstari huu yanaweza kutaja watu, maeneo, au mababu ambao majina yao yalitumiwa kwa makundi ya watu, wala si watu binafsi tu.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: Huhifadhi kauli ya nasaba ya Kiebrania; katika nasaba, “wana” inaweza kumaanisha pia wazao au vikundi vilivyotokana na mtu fulani.
- source_word: כּוּשׁ
  choice: Kushi
  rationale: Jina maalumu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: סְבָא
  choice: Seba
  rationale: Jina maalumu limenukuliwa bila kulifasiri kuwa mtu, eneo, au taifa.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Jina maalumu limetoholewa kwa mtindo wa kawaida wa Kiswahili.
- source_word: סַבְתָּה
  choice: Sabta
  rationale: Tahajia hii ni ya asili na inayosomeka kwa urahisi katika Kiswahili, huku ikikaribia umbo la Kiebrania.
- source_word: רַעְמָה
  choice: Raama
  rationale: Unukuzi rahisi wa Kiswahili unaohifadhi vokali za jina la Kiebrania.
- source_word: סַבְתְּכָא
  choice: Sabteka
  rationale: Jina limetoholewa moja kwa moja kwa mfumo wa sauti wa Kiswahili.
- source_word: וּבְנֵי רַעְמָה
  choice: Wana wa Raama
  rationale: Kurudiwa kwa muundo wa nasaba kumehifadhiwa; maana pana ya wazao haijaondolewa.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Jina maalumu limetoholewa huku sauti ya herufi ya Kiebrania shin ikiwakilishwa kwa “sh”.
- source_word: דְדָן
  choice: Dedani
  rationale: Umbo la “Dedani” linafuata mazoea ya Kiswahili ya kutohhoa jina hili na ni rahisi kutamka.
