  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: sw
  text: na Wapathrusi, na Wakasluhi (ambao Wafilisti walitoka kwao)[a], na Wakaftori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kutoka huko Wafilisti walitoka.” Kiebrania kinaweza kueleweka kuwa kinaunganisha asili ya Wafilisti na Wakasluhi waliotajwa mara moja kabla.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: Wapathrusi
  rationale: Jina la kundi la watu linalotokana na Pathrosi; limetoholewa kwa muundo wa kawaida wa Kiswahili wa majina ya watu kwa kutumia kiambishi Wa-.
- source_word: כַּסְלֻחִים
  choice: Wakasluhi
  rationale: Ni jina la watu ambalo utambulisho wake nje ya Biblia hauna uhakika; kulitohowa kunahifadhi umbo la Kiebrania bila kulipa maana isiyothibitishwa.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: ambao Wafilisti walitoka kwao
  rationale: Kifungu hiki kwa neno halisi ni ‘ambao kutoka huko walitoka.’ Kiswahili cha kawaida kinaunganisha taarifa hiyo na Wakasluhi waliotajwa mara moja kabla, huku tanbihi ikihifadhi uwezekano wa kuelewa ‘kutoka huko.’
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo toleo la kawaida la Kiswahili la jina la watu hao.
- source_word: כַּפְתֹּרִים
  choice: Wakaftori
  rationale: Jina hili la watu wanaohusishwa na Kaftori limetoholewa kwa muundo wa Kiswahili wa majina ya makundi ya watu.
- source_word: וְאֶת
  choice: na
  rationale: Katika orodha hii ya nasaba, kiunganishi וְ kinawakilishwa kwa ‘na,’ ilhali alama ya yambwa אֶת haitafsiriwi moja kwa moja katika Kiswahili.
theological_decisions:
- issue: Kirejeleo cha kifungu ‘kutoka huko/ambao Wafilisti walitoka’
  choice: 'Kifungu kimeunganishwa na Wakasluhi waliotajwa mara moja kabla: ‘Wakasluhi (ambao Wafilisti walitoka kwao).’'
  alternative: 'Kinaweza kutafsiriwa kwa namna isiyobainisha kundi hususa: ‘kutoka huko Wafilisti walitoka.’'
  rationale: Mtiririko wa nasaba unaelekea kuunganisha taarifa ya asili ya Wafilisti na Wakasluhi, lakini neno la Kiebrania מִשָּׁם ni ‘kutoka huko,’ si ‘kutoka kwao.’ Tanbihi inadumisha mvutano huo bila kudai kwa nguvu zaidi ya maandishi kuwa ni uzao wa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya makundi ya watu yametumia muundo wa Wa-. Marudio ya ‘na’ yamehifadhiwa ili kuonyesha mwendelezo wa orodha ya Kiebrania.
