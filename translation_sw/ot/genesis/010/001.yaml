  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: sw
  text: 'Hivi ndivyo vizazi[a] vya wana wa Nuhu: Shemu, Hamu na Yafethi. Na wana walizaliwa kwao baada ya gharika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawa ndio wazao wa wana wa Nuhu.” Neno la Kiebrania lililotafsiriwa “vizazi” linaweza kumaanisha kwa upana ukoo au wale wanaotokana na mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hivi ndivyo
  rationale: Kauli hii inafungua sehemu mpya kwa njia ya kawaida katika Kiswahili, huku ikihifadhi nguvu ya kiunganishi na kielezi cha Kiebrania bila kuongeza wazo la wakati lisilokuwamo.
- source_word: תּוֹלְדֹת
  choice: vizazi
  rationale: Neno hili ni kauli ya kichwa inayojirudia katika Mwanzo. “Vizazi” huhifadhi uhusiano wa kifasihi na inaweza kuelekeza kwenye ukoo au wale waliotokana na mtu; tanbihi inaonyesha maana mbadala iliyo wazi zaidi.
- source_word: בְּנֵי נֹחַ
  choice: wana wa Nuhu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: שֵׁם חָם וָיָפֶת
  choice: Shemu, Hamu na Yafethi
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: וַיִּוָּלְדוּ
  choice: walizaliwa
  rationale: Kauli tendwa ya Kiebrania ina maana ya “walizaliwa,” si kwamba baba zao walifanya tendo la kuzaa.
- source_word: לָהֶם
  choice: kwao
  rationale: Katika muundo huu, “kwao” huonyesha uhusiano wa wale waliozaliwa na baba zao kwa Kiswahili kinachoeleweka.
- source_word: בָּנִים
  choice: wana
  rationale: Kiebrania kinataja wana wa kiume, na muktadha wa nasaba unaunga mkono maana hiyo badala ya neno la jumla “watoto.”
- source_word: אַחַר הַמַּבּוּל
  choice: baada ya gharika
  rationale: Hii ni kauli wazi ya wakati, na “gharika” ndilo neno la kawaida la Kiswahili kwa mafuriko hayo ya Mwanzo.
theological_decisions:
- issue: Tafsiri ya kauli ya kimuundo תּוֹלְדֹת katika Mwanzo
  choice: vizazi
  alternative: wazao; habari ya ukoo
  rationale: “Vizazi” huhifadhi mwangwi wa kauli inayopanga sehemu za kitabu bila kuamua kimya kimya kwamba neno hilo linamaanisha wazao pekee. Tanbihi inaweka wazi uwezekano huo mwingine.
- issue: Neno la jinsia בָּנִים
  choice: wana
  alternative: watoto
  rationale: Neno la Kiebrania ni la kiume, na hapa jedwali la nasaba linawahusu wazao wa kiume; “watoto” lingepunguza sifa hiyo ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa kichwa cha nasaba umehifadhiwa, na sentensi ya pili imebaki karibu na kauli tendwa ya Kiebrania bila kuibadili kuwa “wakazaa.”
