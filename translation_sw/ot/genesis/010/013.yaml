lexical_decisions:
- source_word: מִצְרַיִם
  choice: Misraimu
  rationale: Jina limetoholewa badala ya kutafsiriwa kuwa Misri, kwa kuwa hapa linamtaja babu mwenye jina linalowakilisha ukoo katika orodha ya mataifa.
- source_word: יָלַד
  choice: akawazaa
  rationale: Katika nasaba, kitenzi hiki humaanisha kuzaa au kuwa baba wa wazao; “akawazaa” ni Kiswahili cha kawaida na kinaendeleza mtiririko wa simulizi.
- source_word: אֶת
  choice: halikutafsiriwa kivyake
  rationale: Ni kiashiria cha yambwa katika Kiebrania, kisicho na neno huru linalolingana nacho katika Kiswahili.
- source_word: לוּדִים
  choice: Waludimu
  rationale: Limetoholewa kama jina la kundi la watu lenye wingi, huku kiambishi Wa- kikifanya umbo hilo lieleweke kwa kawaida katika Kiswahili.
- source_word: עֲנָמִים
  choice: Waanamimu
  rationale: Limetoholewa kama jina la kundi la watu lenye wingi bila kulihusisha kwa uhakika na taifa la baadaye.
- source_word: לְהָבִים
  choice: Walehabimu
  rationale: Limetoholewa kwa kufuata kwa karibu umbo la Kiebrania na kuepuka utambulisho wa kikabila usio na uhakika.
- source_word: נַפְתֻּחִים
  choice: Wanaftuhimu
  rationale: Limetoholewa kama jina la kundi la watu, likihifadhi umbo la Kiebrania kwa kiasi kinachofaa katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi cha kawaida cha Kiswahili kinachounganisha vipengele vya mwisho katika orodha.
