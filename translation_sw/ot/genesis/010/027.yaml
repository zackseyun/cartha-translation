lexical_decisions:
- source_word: וְ/אֶת
  choice: na
  rationale: וְ huunganisha majina katika orodha, huku אֵת ikiwa alama ya yambwa-tendwa isiyotafsiriwa kwa neno maalumu katika Kiswahili. Kwa hiyo “na” huwasilisha kwa kawaida muundo wa orodha.
- source_word: הֲדוֹרָם
  choice: Hadoramu
  rationale: Ni jina maalumu katika nasaba; limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili bila kutafsiri maana yake.
- source_word: אוּזָל
  choice: Uzali
  rationale: Ni jina maalumu; umbo “Uzali” linafuata konsonanti za Kiebrania na kulifanya jina litamkike kwa kawaida katika Kiswahili.
- source_word: דִּקְלָה
  choice: Dikla
  rationale: Ni jina maalumu; limenukuliwa kutoka Kiebrania badala ya kutafsiriwa, na tahajia “Dikla” huhifadhi kwa karibu umbo la jina la asili.
