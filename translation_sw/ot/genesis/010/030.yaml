  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: sw
  text: Makao yao yalikuwa kuanzia Mesha, ukienda kuelekea Sefari, eneo la milima la mashariki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Makao yao yalikuwa kuanzia Mesha, ukienda kuelekea Sefari, mlima wa mashariki.”
    reason: Kiebrania הַר kinaweza kumaanisha eneo la milima au mlima mmoja; kirai kinaweza pia kusomwa kama maelezo yanayoambatana na Sefari.
lexical_decisions:
- source_word: וַיְהִי
  choice: yalikuwa
  rationale: Kitenzi היה kinaunganisha maelezo haya na simulizi lililotangulia. ‘Yalikuwa’ kinakaribia muundo wa Kiebrania bila kulazimisha wazo la ‘kuenea’ ambalo halijasemwa wazi.
- source_word: מוֹשָׁבָם
  choice: makao yao
  rationale: מוֹשָׁבָם humaanisha mahali au eneo walimoishi. ‘Makao yao’ ni Kiswahili cha kawaida, chenye heshima, na kinafaa kwa maelezo ya kijiografia.
- source_word: מִמֵּשָׁא
  choice: kuanzia Mesha
  rationale: Kihusishi מִן kinaonyesha mwanzo wa eneo linaloelezwa; ‘kuanzia’ ni cha asili katika maelezo ya mipaka. Mesha ni jina la mahali lililotoholewa kwa mwandiko wa Kiswahili.
- source_word: בֹּאֲכָה
  choice: kuelekea
  rationale: Usemi huu wa kijiografia unaonyesha mwendo au mwelekeo wa kwenda mahali fulani. ‘Kuelekea’ huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: סְפָרָה
  choice: Sefari
  rationale: Ni jina la mahali; he ya mwelekeo imewasilishwa katika ‘kuelekea.’ Umbo ‘Sefari’ linafuata utamkaji na tahajia ya kawaida ya Kiswahili.
- source_word: הַר
  choice: nchi ya milima
  rationale: Katika maelezo ya kijiografia, הַר inaweza kumaanisha eneo la milima, si lazima kilele kimoja. Tafsiri kuu inatumia maana hiyo ya kikanda, huku maana ya ‘mlima’ ikihifadhiwa katika tanbihi.
- source_word: הַקֶּדֶם
  choice: ya mashariki
  rationale: קֶדֶם hapa hurejelea upande au eneo la mashariki. ‘Ya mashariki’ inaendeleza uhusiano wake na nchi ya milima bila kuongeza ufafanuzi wa kiimani.
