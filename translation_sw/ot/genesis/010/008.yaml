base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: sw
  text: Kushi akamzaa Nimrodi; yeye alianza kuwa mtu mwenye nguvu duniani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shujaa” au “mpiganaji hodari.” Neno la Kiebrania linaweza kumaanisha mtu mwenye nguvu au uwezo mkubwa, hasa katika vita.
    reason: lexical_alternative
  - marker: b
    text: Au, “nchini.” Neno la Kiebrania linaweza kumaanisha nchi au dunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכ֖וּשׁ
  choice: Kushi
  rationale: Kiunganishi וְ kinaendeleza nasaba; katika Kiswahili mwanzo wa sentensi na mfuatano wa vitenzi kwa kiambishi -ka- hufanya 'Na' isiwe lazima. Jina limetoholewa kwa matumizi ya kawaida ya Biblia ya Kiswahili.
- source_word: יָלַ֣ד
  choice: akamzaa
  rationale: Katika nasaba, ילד humaanisha kumzaa au kuwa baba wa mtu. 'Akamzaa' ni ya kawaida, wazi, na huhifadhi maana ya nasaba ya kiume.
- source_word: אֶת
  choice: '[halikutafsiriwa peke yake]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania, kisicho na neno huru linalolingana nalo katika Kiswahili.
- source_word: נִמְרֹ֑ד
  choice: Nimrodi
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: ה֣וּא
  choice: yeye
  rationale: Kiwakilishi huru kinaendeleza na kusisitiza kwa kiasi mhusika aliyetajwa, Nimrodi.
- source_word: הֵחֵ֔ל
  choice: alianza
  rationale: Hifili ya החל pamoja na kitenzi-jina humaanisha 'alianza'; tafsiri hii haiongezi wazo lisilo la lazima kwamba alikuwa wa kwanza.
- source_word: לִהְי֥וֹת
  choice: kuwa
  rationale: Kitenzi-jina cha היה pamoja na 'alianza' hutolewa kwa kawaida kuwa 'alianza kuwa'.
- source_word: גִּבֹּ֖ר
  choice: mtu mwenye nguvu
  rationale: גִּבּוֹר inaweza kumaanisha mtu hodari, shujaa, au mpiganaji. 'Mtu mwenye nguvu' huhifadhi upana wa maana bila kuifanya iwe ya kijeshi pekee.
- source_word: בָּאָֽרֶץ
  choice: duniani
  rationale: אֶרֶץ inaweza kuwa nchi au dunia. Katika muktadha mpana wa orodha ya mataifa, 'duniani' ni ya kawaida na inafaa, huku uwezekano wa 'nchini' ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa אֶרֶץ
  choice: dunia
  alternative: nchi
  rationale: Muktadha wa Mwanzo 10 unaelekea kwenye upeo mpana wa mataifa duniani, lakini neno la Kiebrania linaweza pia kumaanisha nchi; tanbihi inahifadhi utata huo.
- issue: Nguvu ya הֵחֵל לִהְיוֹת
  choice: alianza kuwa
  alternative: akawa wa kwanza kuwa
  rationale: Maana ya moja kwa moja ni kuanza kuwa. Tafsiri ya 'wa kwanza' ingeongeza wazo la kutangulia ambalo si lazima kisarufi.
- issue: Maana ya גִּבּוֹר
  choice: mtu mwenye nguvu
  alternative: shujaa au mpiganaji hodari
  rationale: Neno lina wigo mpana unaoweza kuhusisha uwezo, ushujaa, au nguvu za kivita; matini kuu haibani maana kuwa ya kijeshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'akamzaa' unafaa mfululizo wa nasaba; 'alianza kuwa' huhifadhi maana ya Kiebrania bila kuongeza wazo la kuwa wa kwanza.
