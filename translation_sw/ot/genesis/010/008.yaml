  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Kushi ndiye mtenda wa יָלַד, Nimrodi ndiye yambwa, kiwakilishi huru הוּא kinadumishwa kwa “yeye,” na הֵחֵל לִהְיוֹת kinatafsiriwa moja kwa moja kwa “alianza kuwa” bila kuongeza dhana ya kwamba alikuwa wa kwanza. “Duniani” ni tafsiri ya kawaida na sahihi ya בָּאָרֶץ katika muktadha huu, huku maana mbadala ya “nchini” ikihifadhiwa kwa tanbihi.'
