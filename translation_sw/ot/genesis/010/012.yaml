  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: sw
  text: na Reseni, kati ya Ninawi na Kalahi[a]; huo ndio mji mkubwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kalhu,” kufuatana na umbo la Kiashuru la jina la mahali panapoitwa kwa desturi “Kalahi.”
    reason: lexical_alternative
  - marker: b
    text: Kishazi “huo ndio mji mkubwa” huenda kinarejelea Reseni hasa, au eneo pana la miji kati ya Ninawi na Kalahi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi וְ pamoja na kiashiria cha yambwa אֵת kinaongeza mahali pengine katika orodha; Kiswahili huwasilisha maana hiyo kwa “na” bila kiashiria tofauti cha yambwa.
- source_word: רֶסֶן
  choice: Reseni
  rationale: Ni jina la mahali; limeandikwa kwa namna inayolingana na matamshi na matumizi ya majina ya kibiblia katika Kiswahili.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na
  rationale: Hii ndiyo namna ya kawaida na ya asili ya Kiswahili ya kuonyesha mahali palipo baina ya maeneo mawili.
- source_word: נִינְוֵה
  choice: Ninawi
  rationale: Ni umbo la jina hili la mahali lililozoeleka katika Kiswahili cha Biblia.
- source_word: כָּלַח
  choice: Kalahi
  rationale: Ni uhawilishaji wa jina la Kiebrania kwa muundo unaosomeka kwa kawaida katika Kiswahili; umbo la Kiashuru “Kalhu” limehifadhiwa katika tanbihi.
- source_word: הִוא
  choice: huo ndio
  rationale: Kiwakilishi hiki kinafanya kazi ya kurejelea na kutambulisha; “huo ndio” ni Kiswahili cha asili kinachodumisha nguvu ya kishazi bila kutaja kwa ufafanuzi eneo linalorejelewa.
- source_word: הָעִיר
  choice: mji
  rationale: Nomino yenye kibainishi katika Kiebrania imewasilishwa kwa “mji,” huku umahususi wake ukionyeshwa na muundo “huo ndio.”
- source_word: הַגְּדֹלָה
  choice: mkubwa
  rationale: Neno גָּדוֹל linaweza kumaanisha mkubwa kwa ukubwa au umuhimu; “mkubwa” huhifadhi upana huo wa maana.
theological_decisions:
- issue: Kirejelewa cha “huo ndio mji mkubwa”
  choice: Kishazi kimeachwa bila kutaja wazi kama kinarejelea Reseni au eneo pana la miji hiyo.
  alternative: Kutafsiri kwa ufafanuzi kwamba Reseni pekee ndio mji mkubwa, au kwamba eneo lote la miji kati ya Ninawi na Kalahi ndilo mji mkubwa.
  rationale: Sintaksia ya Kiebrania haiondoi utata wa kirejelewa. Tafsiri inadumisha utata huo badala ya kuamua jambo ambalo matini yenyewe hailisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Alama ya nukta mkato inadumisha uhusiano wa karibu wa kishazi cha mwisho na orodha huku ikiepuka kukifafanua kupita matini.
