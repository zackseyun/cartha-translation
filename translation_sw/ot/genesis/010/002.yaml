  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, katika matumizi ya baadaye, majina haya yanaweza kurejelea makundi ya kikabila au maeneo: “Madai” = “Wamedi,” na “Yavani” = “Ionia” au “Wayunani.” Maandishi makuu yanahifadhi majina ya nasaba ya Kiebrania kwa kuyatohoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni hali ya wingi ya neno בֵּן katika muundo wa umilikaji unaoanzisha orodha ya nasaba. “Wana wa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili, bila kuipanua kuwa “wazao wa.”
- source_word: יֶפֶת
  choice: Yafethi
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: גֹּמֶר
  choice: Gomeri
  rationale: Jina binafsi katika orodha ya wana wa Yafethi; limetoholewa badala ya kufasiriwa kama jina la kabila au eneo.
- source_word: מָגוֹג
  choice: Magogu
  rationale: Jina binafsi, ingawa katika matumizi mengine linaweza kuwa na uhusiano wa kikabila au kijiografia; hapa limehifadhiwa kama jina katika nasaba.
- source_word: מָדַי
  choice: Madai
  rationale: Hapa neno hili linafanya kazi kama jina binafsi katika nasaba. Umbo la Kiebrania limetoholewa badala ya kutafsiriwa moja kwa moja kuwa “Wamedi.”
- source_word: יָוָן
  choice: Yavani
  rationale: Jina binafsi katika jedwali la mataifa; kutoholewa kunahifadhi namna ya nasaba bila kulifasiri moja kwa moja kuwa Ionia au Wayunani.
- source_word: תֻבָל
  choice: Tubali
  rationale: Jina binafsi limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: מֶשֶׁךְ
  choice: Mesheki
  rationale: Jina binafsi limetoholewa kwa tahajia ya Kiswahili.
- source_word: תִירָס
  choice: Tirasi
  rationale: Jina binafsi limetoholewa kwa tahajia ya Kiswahili.
