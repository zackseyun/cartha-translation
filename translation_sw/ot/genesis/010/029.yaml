base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/029.yaml
  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: sw
  text: na Ofiri, Havila, na Yobabu. Hao wote walikuwa wana wa Yoktani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa Yoktani.” Neno la Kiebrania linalomaanisha “wana wa” wakati mwingine linaweza kutumiwa kwa maana pana zaidi katika nasaba, lakini hapa linaelekea zaidi kuwarejelea wana waliotajwa katika orodha hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: na; kiashiria cha yambwa kimedokezwa
  rationale: אֵת inayorudiwa huonyesha kwamba kila jina linaendeleza orodha ya yambwa kutoka mstari uliotangulia. Kiswahili hakihitaji kiashiria tofauti hapa; kiunganishi “na” kinadumisha muundo wa orodha.
- source_word: אוֹפִר
  choice: Ofiri
  rationale: Jina la pekee limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Jina la pekee limetoholewa kwa kufuata sauti ya Kiebrania na matumizi yanayoeleweka katika Kiswahili.
- source_word: יוֹבָב
  choice: Yobabu
  rationale: Jina la pekee limetoholewa kwa mfumo wa sauti wa Kiswahili; yod imetolewa kama “Y” na konsonanti ya mwisho imepewa irabu.
- source_word: כָּל אֵלֶּה
  choice: Hao wote
  rationale: Hii ni njia ya asili na fupi ya Kiswahili ya kuhitimisha orodha ya watu waliotajwa.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika muktadha huu wa nasaba, neno hilo kwa kawaida linarejelea wana wa kiume waliotajwa moja kwa moja, huku uwezekano wake mpana wa kumaanisha wazao ukihifadhiwa katika tanbihi.
- source_word: יָקְטָן
  choice: Yoktani
  rationale: Jina la pekee limetoholewa kwa tahajia ya Kiswahili inayokaribia umbo la Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kwa kuwa mstari unaanza katikati ya orodha iliyoanza katika mstari uliotangulia, “na” imehifadhiwa mwanzoni. Alama ya tanbihi imewekwa baada ya sentensi inayohusu “wana wa Yoktani,” ili ihusiane wazi na mbadala wake wa kileksika.
