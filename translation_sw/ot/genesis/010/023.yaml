lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: Nomino ya wingi katika hali ya uambatani ina maana ya moja kwa moja ya “wana wa.” Kiunganishi וּ hakijatafsiriwa kwa neno tofauti kwa sababu mstari huu unaanza kipashio kipya katika orodha ya ukoo; “walikuwa” kimeongezwa ili sentensi iwe ya kawaida na iliyo wazi kwa Kiswahili.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina maalumu limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: עוּץ
  choice: Usi
  rationale: Jina maalumu limetoholewa kwa kufuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: חוּל
  choice: Huli
  rationale: Jina maalumu limetoholewa kwa namna ya asili na inayosomeka katika Kiswahili.
- source_word: גֶתֶר
  choice: Getheri
  rationale: Jina maalumu limetoholewa kwa kuakisi konsonanti za Kiebrania huku likibaki rahisi kutamkwa kwa Kiswahili.
- source_word: מַשׁ
  choice: Mashi
  rationale: Maandishi ya Kimasora katika Mwanzo 10:23 yana מַשׁ, kwa hiyo “Mashi” limewekwa katika matini kuu badala ya kusawazishwa na “Mesheki” ya 1 Mambo ya Nyakati 1:17.
