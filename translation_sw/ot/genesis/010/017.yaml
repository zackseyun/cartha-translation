  rationale: Nomino hii ya kabila iko katika umoja wa Kiebrania lakini ina maana ya kijumla; umbo la Kiswahili la jina la watu, “Wahivi,” linawasilisha maana hiyo kwa kawaida.
- source_word: הָעַרְקִי
  choice: Waarki
  rationale: Ni jina la kijamii au kikabila linalohusishwa na Arka. “Waarki” linahifadhi sifa ya jina maalumu na muundo wa orodha.
- source_word: הַסִּינִי
  choice: Wasini
  rationale: Ni jina la kikabila katika orodha ya mataifa; “Wasini” linawasilisha maana ya kijumla na kuhifadhi jina maalumu.
