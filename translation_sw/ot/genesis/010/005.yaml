  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: sw
  text: Kutoka kwa hawa mataifa ya pwani[a] yalitengana katika nchi zao, kila moja kwa lugha yake,[b] kwa koo zao, katika mataifa yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “visiwa vya mataifa.” Neno la Kiebrania linaweza kumaanisha visiwa au maeneo ya pwani; hapa huenda linarejelea kwa upana maeneo ya kandokando ya bahari na watu wake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “mtu kwa lugha yake”; huu ni usemi wa kugawa mmoja mmoja wenye maana ya “kila moja kwa lugha yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Kutokana na hawa
  rationale: Kiambishi מִן pamoja na kiwakilishi אֵלֶּה kinaonyesha chanzo; makundi yaliyotajwa yanatokana na wazao waliotangulia.
- source_word: נִפְרְדוּ
  choice: yaligawanyika
  rationale: Nifali ya פרד ina maana ya kutengana au kugawanyika. Hapa umbo hili linadumisha uwezekano kwamba maeneo au makundi ya maeneo yalitenganishwa bila kulazimisha wazo la watu kusambaa.
- source_word: אִיֵּי הַגּוֹיִם
  choice: maeneo ya pwani ya mataifa
  rationale: אִיִּים inaweza kumaanisha visiwa au maeneo ya pwani; katika orodha hii ya mataifa, 'maeneo ya pwani' ni pana na ya kawaida zaidi, huku uhusiano wa kisarufi na 'mataifa' ukihifadhiwa.
- source_word: בְּאַרְצֹתָם
  choice: katika nchi zao
  rationale: אֶרֶץ hapa ni nchi au maeneo wanamoishi watu hawa; 'nchi zao' ni Kiswahili cha kawaida na kinadumisha maana ya kieneo.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: kila moja kwa lugha yake
  rationale: אִישׁ imetumika kwa maana ya kugawa mmoja mmoja, si lazima 'mwanamume'; לָשׁוֹן hapa ni lugha, na לְ inaonyesha upangaji kwa lugha.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה katika muktadha wa nasaba na mataifa humaanisha kundi pana la ukoo kuliko familia ya nyumbani.
- source_word: בְּגוֹיֵהֶם
  choice: katika mataifa yao
  rationale: גּוֹי ni taifa au kundi la watu; tafsiri hii inadumisha kihusishi na mlingano na 'katika nchi zao'.
theological_decisions:
- issue: Je, mhusika wa kugawanyika ni maeneo au watu wa pwani?
  choice: Maeneo ya pwani ya mataifa yaligawanyika
  alternative: Watu wa maeneo ya pwani walitawanyika
  rationale: Muundo wa moja kwa moja wa אִיֵּי הַגּוֹיִם unataja 'maeneo ya pwani/visiwa vya mataifa.' Tafsiri kuu haibadili wazi mhusika kuwa watu, ingawa muktadha wa koo, lugha na mataifa unaonyesha kuwa mgawanyiko unawahusu pia wakazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa vipashio vya nchi, lugha, koo na mataifa umehifadhiwa kwa ukaribu; alama za tanbihi [a] na [b] zimewekwa mara moja katika matini kuu.
