    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kifungu cha Kiebrania hakina kitenzi; Kiswahili cha kawaida hutumia “ndio” kutambulisha muhtasari huu kwa uwazi.
- source_word: בְנֵי
  choice: wana wa
  rationale: Huhifadhi lugha rasmi ya nasaba na muundo wa kiume wa Kiebrania; “wazao” lingeipanua maana.
- source_word: שֵׁם
  choice: Shemu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika muktadha wa kikabila na kinasaba, מִשְׁפָּחָה ni “ukoo”; “kwa” linaonyesha uainishaji unaowekwa na kiambishi לְ.
- source_word: לִלְשֹׁנֹתָם
  choice: kwa lugha zao
  rationale: Ingawa לָשׁוֹן kihalisi ni “ulimi,” hapa hurejelea lugha za makundi ya watu.
- source_word: בְּאַרְצֹתָם
  choice: katika nchi zao
  rationale: Kiambishi בְּ kina maana ya mahali; “nchi” hapa ni maeneo wanamoishi, bila kulazimisha wazo la dola za kisasa.
- source_word: לְגוֹיֵהֶם
  choice: kwa mataifa yao
  rationale: גּוֹי humaanisha taifa au kundi la watu; “kwa” hudumisha mtiririko wa uainishaji wa vifungu vyenye לְ.
