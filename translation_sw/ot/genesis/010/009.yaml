  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu maana ya msingi ya Kiebrania: Nimrodi anaelezwa kuwa “mwindaji hodari,” na לִפְנֵי יְהוָה imehifadhiwa kwa maana yake ya msingi, “mbele za Yahwe,” bila kuingiza tafsiri ya uhasama katika matini kuu. “Kwa hiyo husemwa” huwasilisha vizuri fomula עַל־כֵּן יֵאָמַר ya kuanzisha msemo unaojulikana.'
