base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: sw
  text: Alikuwa mwindaji hodari mbele za Yahwe; kwa hiyo husemwa[a], “Kama Nimrodi, mwindaji hodari mbele za Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “kwa kumkaidi Yahwe,” ikiwa maneno hayo yanaeleweka kuwa na maana ya uhasama kutokana na muktadha mpana.
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: mwindaji hodari
  rationale: Muungano huu unaeleza ustadi na uwezo wa pekee katika uwindaji. ‘Mwindaji hodari’ ni wa asili na wazi katika Kiswahili cha sasa.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Huhifadhi maana ya msingi ya kuwa mbele au katika uwepo wa mtu bila kuamua kimya kimya kuwa kauli hiyo ina maana ya uasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo ‘BWANA’.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Hutanguliza kwa njia ya kawaida sababu ya msemo unaofuata.
- source_word: יֵאָמַר
  choice: husemwa
  rationale: Kauli tendwa ya mazoea inafaa kwa msemo unaotumiwa na watu kwa ujumla.
- source_word: כְּנִמְרֹד
  choice: Kama Nimrodi
  rationale: Kiambishi cha Kiebrania kinaonyesha ulinganisho; ‘kama’ ni njia ya kawaida ya kuutambulisha kwa Kiswahili.
theological_decisions:
- issue: Nguvu ya maana ya לִפְנֵי יְהוָה kuhusu Nimrodi
  choice: mbele za Yahwe
  alternative: kwa kumkaidi Yahwe
  rationale: Maana ya msingi ni ‘mbele ya’ au ‘katika uwepo wa.’ Maana ya uhasama inawezekana kwa kufuata muktadha mpana, lakini si ya lazima katika maneno yenyewe; kwa hiyo imewekwa katika tanbihi ili kuhifadhi utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mbele za’ hudumisha mtindo wa kibiblia unaoeleweka, huku ‘husemwa’ ikionyesha msemo wa kawaida. Umbo ‘Nimrodi’ limetumiwa kwa mujibu wa matumizi yaliyozoeleka katika Kiswahili.
