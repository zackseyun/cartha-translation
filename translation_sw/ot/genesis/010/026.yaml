base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/026.yaml
  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: sw
  text: Yoktani akawazaa Almodadi, Shelefu, Hasarmavethi na Yera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָקְטָן
  choice: Yoktani
  rationale: Jina la mtu limetoholewa kwa tahajia inayopatana na matamshi na desturi ya majina ya Biblia katika Kiswahili.
- source_word: יָלַד
  choice: akawazaa
  rationale: Katika ukoo, kitenzi hiki humaanisha kumzaa au kuwa baba wa; umbo hili ni la kawaida na linaonyesha kuwa wanaotajwa ni zaidi ya mmoja.
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa mahususi katika Kiebrania, kisicho na neno la pekee linalolingana nalo katika Kiswahili.
- source_word: אַלְמוֹדָד
  choice: Almodadi
  rationale: Jina limetoholewa kwa namna ya kawaida ya Kiswahili.
- source_word: שָׁלֶף
  choice: Shelefu
  rationale: Jina limetoholewa kwa kuzingatia irabu za maandishi ya Kimasora na muundo wa matamshi ya Kiswahili.
- source_word: חֲצַרְמָוֶת
  choice: Hasarmavethi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likihifadhi kwa karibu umbo la Kiebrania.
- source_word: יָרַח
  choice: Yera
  rationale: Jina limetoholewa kutoka Kiebrania kwa kuhifadhi sauti ya mwanzo ya yod kama y, badala ya kufuata umbo la Kiingereza Jerah.
