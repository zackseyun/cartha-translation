lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Nao wana wa
  rationale: בְּנֵי ni wingi wa muundo tegemezi wa neno ‘mwana’. ‘Wana wa’ huhifadhi muundo wa nasaba wa Kiebrania, huku ‘Nao’ ikiwakilisha kiunganishi וּ kwa Kiswahili cha kawaida.
- source_word: יָוָן
  choice: Yavani
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֱלִישָׁה
  choice: Elisha
  rationale: Jina limetoholewa kwa namna ya asili inayosomeka kwa urahisi katika Kiswahili.
- source_word: וְ/תַרְשִׁישׁ
  choice: Tarshishi
  rationale: Jina limetoholewa kwa muundo unaokubalika katika Kiswahili, bila kuamua kama linamtaja mtu, watu, au mahali.
- source_word: כִּתִּים
  choice: Kitimu
  rationale: Jina la watu au mahali limetoholewa kwa namna inayolingana na mazoea ya Kiswahili.
- source_word: וְ/דֹדָנִים
  choice: Dodanimu
  rationale: Maandishi ya WLC/Masora yana דֹדָנִים, hivyo matini kuu inafuata ‘Dodanimu’; tofauti ya ‘Rodanimu’ imehifadhiwa katika tanbihi.
