base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: sw
  text: 'Eberi naye akazaliwa wana wawili: jina la mmoja lilikuwa Pelegi, kwa maana katika siku zake dunia[a] iligawanyika; na jina la ndugu yake lilikuwa Yoktani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi.” Neno la Kiebrania linaweza kumaanisha “dunia” au “nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֵבֶר יֻלַּד
  choice: Eberi naye alizaliwa
  rationale: Muundo huu unahifadhi kauli ya kutendwa ya Kiebrania na unaendeleza taarifa ya ukoo kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: שְׁנֵי בָנִים
  choice: wana wawili
  rationale: Neno בָנִים hapa linamaanisha wana wa kiume, hivyo “wana” ni sahihi kuliko neno la kijumla kama “watoto.”
- source_word: שֵׁם הָאֶחָד
  choice: Jina la mmoja
  rationale: Huhifadhi utofautishaji wa Kiebrania kati ya mwana mmoja na ndugu yake bila kuongeza wazo la kwamba alikuwa mzaliwa wa kwanza.
- source_word: פֶּלֶג
  choice: Pelegi
  rationale: Jina limetoholewa kwa namna inayolingana na matamshi na maumbo ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha maelezo yanayohusisha jina la Pelegi na mgawanyiko uliotokea katika siku zake.
- source_word: בְ/יָמָי/ו
  choice: katika siku zake
  rationale: Huhifadhi nahau ya wakati ya Kiebrania bila kuifafanua kupita kiasi kuwa muda wote wa maisha yake.
- source_word: נִפְלְגָה
  choice: iligawanyika
  rationale: Kauli hii inatoa maana ya msingi ya kitenzi פלג katika kauli ya kutendwa/kati na pia inadumisha uhusiano wa sauti na jina Pelegi kwa kadiri inayowezekana katika Kiswahili.
- source_word: הָ/אָ֔רֶץ
  choice: dunia
  rationale: Katika muktadha mpana wa orodha ya mataifa, “dunia” inafaa kwa upeo wa simulizi, ingawa “nchi” pia ni maana halali ya neno la Kiebrania.
- source_word: וְ/שֵׁ֥ם אָחִ֖י/ו
  choice: na jina la ndugu yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji wa Kiebrania.
- source_word: יָקְטָֽן
  choice: Yoktani
  rationale: Jina limetoholewa kwa kufuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
theological_decisions:
- issue: Upeo wa הָאָרֶץ katika maelezo ya jina la Pelegi
  choice: dunia
  alternative: nchi
  rationale: Muktadha wa Mwanzo 10 unahusu mataifa kwa upeo mpana, hivyo “dunia” inafaa bila kuamua namna hasa ya kihistoria ya mgawanyiko huo. Kwa kuwa neno la Kiebrania linaweza pia kumaanisha “nchi,” maana hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi ya Maandiko lakini kinachoeleweka kwa msomaji wa kawaida wa leo. Muundo “Eberi naye alizaliwa wana wawili” umetumiwa ili kuhifadhi kauli ya kutendwa ya chanzo; majina yametoholewa kama Eberi, Pelegi, na Yoktani.
