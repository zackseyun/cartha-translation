translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Neno “walikuwa” limeongezwa kwa ulaini wa sentensi ya Kiswahili bila kubadili maana ya kishazi cha orodha katika Kiebrania. Alama zote za tanbihi zimewekwa baada ya majina yanayohusika.
