lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na wana wa
  rationale: Kiunganishi ו kimetafsiriwa “Na” ili kudumisha mwendelezo wa orodha ya nasaba; בְנֵי ni wingi wa hali ya kutegemea, “wana wa,” unaofaa hapa kuliko kuufanya kwa ujumla kuwa “wazao wa.”
- source_word: חָם
  choice: Hamu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: כּוּשׁ
  choice: Kushi
  rationale: Jina limetoholewa kwa njia ya kawaida na iliyo wazi kwa wasomaji wa Kiswahili.
- source_word: וּ/מִצְרַיִם
  choice: Misraimu
  rationale: Katika nasaba hii neno linatumika kama jina la mtu au babu wa ukoo, hivyo limetoholewa badala ya kutafsiriwa “Misri.”
- source_word: וּ/פוּט
  choice: Puti
  rationale: Jina limetoholewa kwa kufuata konsonanti za Kiebrania na umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: וּ/כְנָעַן
  choice: na Kanaani
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili, huku kiunganishi kikihifadhi uratibu wa kipengele cha mwisho katika orodha.
