  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Misraimu”; tafsiri nyingi hutumia “Misri.” Katika nasaba hii, umbo la Kiebrania limetumika kama jina la mtu au babu wa ukoo.
