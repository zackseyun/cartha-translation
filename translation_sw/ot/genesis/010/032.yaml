  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: sw
  text: Hizi ndizo jamaa za wana wa Noa, kwa nasaba zao na kwa mataifa yao; na kutokana na jamaa hizi mataifa yalitengana duniani baada ya gharika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: jamaa
  rationale: Katika muhtasari huu wa nasaba, neno hili linamaanisha vikundi vya ukoo vinavyotokana na wana wa Noa. ‘Jamaa’ ni la kawaida na linaweza kujumuisha familia pana bila kutumia istilahi ya kitaalamu.
- source_word: לְתוֹלְדֹתָם
  choice: kwa nasaba zao
  rationale: תּוֹלְדוֹת hapa hurejelea mistari ya vizazi au taarifa za ukoo. ‘Kwa nasaba zao’ linaeleweka kwa urahisi na linafaa katika muhtasari wa orodha ya mataifa.
- source_word: בְּגוֹיֵהֶם
  choice: na kwa mataifa yao
  rationale: Kirai hiki ni sambamba na ‘kwa nasaba zao’ na kinaonyesha upangaji wa jamaa hizo kwa mataifa yao. Kiunganishi ‘na’ kinafanya usambamba huo uwe wa kawaida katika Kiswahili.
- source_word: וּמֵאֵלֶּה
  choice: na kutoka kwao
  rationale: Kiwakilishi cha Kiebrania kinawarejelea watu au jamaa waliotajwa, hivyo ‘kwao’ ni cha asili zaidi kuliko ‘hizi’ katika Kiswahili.
- source_word: נִפְרְדוּ
  choice: yalitawanyika
  rationale: Niphal ya פרד ina wazo la kutengana na kwenda sehemu mbalimbali. Katika muktadha wa mataifa duniani, ‘yalitawanyika’ huwasilisha matokeo hayo kwa Kiswahili cha kawaida bila kutaja mtendaji.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Neno hili linamaanisha vikundi tofauti vya watu katika jedwali la mataifa; ‘mataifa’ ndilo neno sanifu na linalofaa katika muktadha.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Hapa אֶרֶץ lina upeo mpana wa ulimwengu katika muhtasari wa kutawanyika kwa wanadamu baada ya gharika.
- source_word: אַחַר הַמַּבּוּל
  choice: baada ya gharika
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati, ikirejelea gharika iliyosimuliwa awali.
theological_decisions:
- issue: Upeo wa אֶרֶץ katika muhtasari wa kutawanyika baada ya gharika
  choice: dunia kwa maana pana
  alternative: nchi au eneo fulani
  rationale: Mwanzo 10 inatoa muhtasari wa mataifa yaliyotokana na wana wa Noa, hivyo ‘duniani’ huhifadhi upeo wa jumla wa simulizi bila kuufanya kuwa eneo maalumu.
- issue: Maana ya נִפְרְדוּ
  choice: yalitawanyika
  alternative: yalitengana au yaligawanyika
  rationale: Kitenzi kinaweza kueleza kutengana au kugawanyika. ‘Yalitawanyika’ kinafaa kwa muktadha wa mataifa kwenda sehemu mbalimbali, huku mbadala zikibaki halali kiisimu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi vifungu viwili sambamba vya Kiebrania bila kuwa mzito; hakuna istilahi ya kimadhehebu iliyoingizwa.
