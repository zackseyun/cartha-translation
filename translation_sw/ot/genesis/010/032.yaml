- from: Hizi ndizo jamaa za wana wa Noa, kwa nasaba zao na kwa mataifa yao; na kutoka kwao mataifa yalitawanyika duniani baada ya gharika.
  to: Hizi ndizo jamaa za wana wa Noa, kwa nasaba zao na kwa mataifa yao; na kutokana na jamaa hizi mataifa yalitengana duniani baada ya gharika.
  rationale: The revision replaces a contextually possible but more interpretive ‘yalitawanyika’ with ‘yalitengana,’ preserving the source verb’s central sense of separation without specifying the manner of that separation. It also clarifies the referent of ‘from these’ as the family groups named in the first clause. No footnotes are necessary, since the revised text does not depend on an unresolved textual variant or a translation choice needing explanation.
