- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Umbo la Kiebrania ni nomino ya kabila katika umoja inayowakilisha jamii nzima; kwa hiyo limetafsiriwa kwa wingi wa Kiswahili.
- source_word: הַגִּרְגָּשִׁי
