- source_word: שֻׁלְּחוּ
  choice: wakaagwa waende
  rationale: Kauli tendwa ya שלח hapa ina maana ya kuruhusiwa au kuagwa ili waondoke; usemi huu ni wa kawaida na unahifadhi wazo la kutumwa waende bila kudokeza kufukuzwa.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: wao pamoja na punda wao
  rationale: Huhifadhi kiwakilishi huru cha msisitizo na kuwaweka wanaume na punda wao pamoja kama walioondoka.
