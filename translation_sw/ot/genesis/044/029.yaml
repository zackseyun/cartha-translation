base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: sw
  text: Nanyi mkimchukua huyu pia kutoka kwangu, na msiba ukimpata, mtazishusha mvi zangu kwa huzuni hadi Sheoli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kaburi au makao ya wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקַחְתֶּם
  choice: nanyi mkimchukua
  rationale: Waw pamoja na kitenzi timilifu kinaendeleza wazo la sharti katika maneno ya Yakobo; muundo wa “mkimchukua” unaleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: גַּם
  choice: pia
  rationale: Huonyesha kuongezwa kwa Benyamini kwa wale ambao tayari Yakobo amewapoteza au wametengwa naye.
- source_word: מֵעִם פָּנַי
  choice: kutoka kwangu
  rationale: Nahau hii kihalisi huhusu kuondolewa mbele ya uso au uwepo wa msemaji; “kutoka kwangu” ni ya asili kwa Kiswahili na huhifadhi maana ya kutenganishwa na Yakobo.
- source_word: וְקָרָהוּ אָסוֹן
  choice: madhara yakimpata
  rationale: Muungano wa kitenzi “kupata/kutokea” na אָסוֹן unaeleza tukio baya linaloweza kumpata Benyamini; “madhara yakimpata” ni wazi bila kuamua kwa undani aina ya msiba.
- source_word: וְהוֹרַדְתֶּם
  choice: mtazishusha
  rationale: Hifili ya ירד ni ya kusababisha kushuka; “mtazishusha” huhifadhi picha ya kushuka kuelekea Sheoli.
- source_word: שֵׂיבָתִי
  choice: mvi zangu
  rationale: Neno linamaanisha mvi na hutumiwa kimajazi kuhusu uzee; “mvi zangu” huhifadhi taswira ya Kiebrania.
- source_word: בְּרָעָה
  choice: kwa huzuni
  rationale: Katika muktadha huu רָעָה ni hali ya taabu au huzuni, si uovu wa kimaadili; “kwa huzuni” linafaa kwa maombolezo ya Yakobo.
- source_word: שְׁאֹלָה
  choice: hadi Sheoli
  rationale: Kiambishi cha mwelekeo kinaonyesha kwenda Sheoli. Kutumia jina “Sheoli” huhifadhi dhana ya Kiebrania badala ya kuifanya iwe kaburi tu.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburini; katika makao ya wafu
  rationale: Neno la Kiebrania linaweza kurejelea makao ya wafu kwa upana kuliko kaburi la kawaida. Kulihifadhi kama “Sheoli” huepuka kuingiza ufafanuzi wa kidhehebu au usahihi wa baadaye usiokuwamo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sharti umehifadhiwa, pamoja na taswira ya mvi kushushwa hadi Sheoli.
