base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: sw
  text: Ndipo Yuda akamkaribia na kusema, “Tafadhali,[a] bwana wangu, mruhusu mtumishi wako aseme neno masikioni mwa bwana wangu,[b] wala hasira yako isiwake dhidi ya mtumishi wako,[c] kwa maana wewe ni kama Farao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nisamehe, bwana wangu.” Kifungu cha mwanzo cha Kiebrania ni ombi la heshima.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “masikioni mwa bwana wangu”; maana yake ni “ili bwana wangu asikie.”
    reason: cultural_note
  - marker: c
    text: Au, “wala usimkasirikie mtumishi wako.” Kihalisi, “wala hasira yako isiwake dhidi ya mtumishi wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו
  choice: akamkaribia
  rationale: Kitenzi נגשׁ kinaonyesha Yuda alimsogelea Yosefu; ‘akamkaribia’ ni simulizi la asili na huhifadhi tendo hilo halisi.
- source_word: בִּי אֲדֹנִי
  choice: Tafadhali, bwana wangu
  rationale: בִּי ni ombi la heshima, na ‘Tafadhali’ hulitoa kwa Kiswahili cha sasa; ‘bwana wangu’ huhifadhi heshima ya usemi wa ikulu.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: mruhusu mtumishi wako aseme neno
  rationale: Muundo huu ni ombi la unyenyekevu. ‘Mtumishi wako’ huhifadhi namna Yuda anavyojirejelea, na ‘neno’ huhifadhi nomino ya umoja דָבָר.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: masikioni mwa bwana wangu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania huku ikieleweka kwa Kiswahili kuwa ombi la kusikilizwa; tanbihi inaeleza maana ya nahau.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: wala hasira yako isimwakie mtumishi wako
  rationale: ‘Hasira isimwakie’ huhifadhi sitiari ya Kiebrania ya hasira inayowaka na kuelekeza hasira hiyo kwa mtumishi.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: kwa maana wewe ni kama Farao
  rationale: Huhifadhi ulinganisho wa moja kwa moja unaoonyesha cheo na mamlaka ya Yosefu bila kuufanya useme kwamba yeye ni sawa kabisa na Farao.
