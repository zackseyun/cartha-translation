base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: sw
  text: “Na uweke kikombe changu, kile kikombe cha fedha, katika mdomo wa gunia[a] la yule aliye mdogo kuliko wote, pamoja na fedha alizolipia nafaka[b].” Naye akafanya kama Yosefu alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mdomo wa gunia,” yaani sehemu ya gunia inayofunguliwa.
    reason: cultural_note
  - marker: b
    text: Au, “fedha ya nafaka yake”; usemi huo unamaanisha fedha zilizolipwa kwa nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: kikombe changu, kile kikombe cha fedha
  rationale: “Kikombe” ni neno la kawaida na lenye heshima kwa גְּבִיעַ; uradidi wa kiebrania umehifadhiwa ili kuonyesha msisitizo wa kikombe hicho cha fedha.
- source_word: תָּשִׂים
  choice: ukiweke
  rationale: Kitenzi שׂים humaanisha kuweka. Muundo huu unaendeleza kwa kawaida maagizo yaliyoanza katika mstari uliotangulia.
- source_word: בְּפִי אַמְתַּחַת
  choice: katika mdomo wa gunia
  rationale: Tafsiri hii inahifadhi taswira halisi ya kiebrania, ambapo “mdomo” humaanisha sehemu ya kuingilia au kufungulia gunia.
- source_word: הַקָּטֹן
  choice: yule mdogo zaidi
  rationale: Katika muktadha huu kivumishi kinamtaja ndugu aliye mdogo kuliko wote bila kuongeza nomino isiyokuwamo katika Kiebrania.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: fedha alizolipia nafaka
  rationale: כֶּסֶף ni fedha, na שִׁבְרוֹ katika simulizi hili inahusu nafaka iliyonunuliwa; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: Naye akafanya kama Yosefu alivyokuwa amesema
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha kwa usahihi kwamba mtumishi alitekeleza yale Yosefu aliyosema, bila kuyaita moja kwa moja “amri.”
