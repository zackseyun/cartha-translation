base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: sw
  text: Walipokuwa wametoka mjini lakini hawakuwa wameenda mbali, Yusufu alimwambia msimamizi wa nyumba yake[a], “Inuka, wafuatilie watu hao, na utakapowafikia, uwaambie, ‘Kwa nini mmelipa mabaya kwa mema?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “yule aliye juu ya nyumba yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר
  choice: Walikuwa wametoka mjini
  rationale: Muundo huu unaonyesha kwamba walikuwa tayari wameondoka mjini kabla ya agizo la Yusufu, kwa Kiswahili cha kawaida cha simulizi.
- source_word: לֹא הִרְחִיקוּ
  choice: hawakuwa wameenda mbali
  rationale: Hiphil ya רחק hapa humaanisha kwenda au kufika mbali; tafsiri hii ni ya asili na huhifadhi mfuatano wa matukio.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: msimamizi wa nyumba yake
  rationale: Kirai cha Kiebrania ni, kwa maana halisi, ‘yule aliye juu ya nyumba yake’; ‘msimamizi wa nyumba yake’ huwasilisha kwa uwazi jukumu la mtawala wa kaya bila kuongeza cheo maalumu kisichotajwa.
- source_word: קוּם
  choice: Inuka
  rationale: Amri ya קום humtaka mtu ainuke na kuchukua hatua mara moja; ‘Inuka’ huhifadhi umbo na msukumo wa amri.
- source_word: רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: wafuatilie watu hao
  rationale: רְדֹף אַחֲרֵי humaanisha kuwafuata kwa lengo la kuwafikia; ‘wafuatilie’ ni ya kawaida na ina nguvu inayofaa katika muktadha huu.
- source_word: וְהִשַּׂגְתָּם
  choice: utakapowafikia
  rationale: Hiphil ya נשׂג humaanisha kuwafikia au kuwapata baada ya kuwafuata; kiunganishi cha wakati kinaeleza kwa Kiswahili hatua inayotangulia amri inayofuata.
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: mmelipa mabaya kwa mema
  rationale: Piel ya שלם hapa ni kulipa au kurudisha tendo; msemo ‘kulipa mabaya kwa mema’ ni wa asili katika Kiswahili na huhifadhi mgongano wa kimaadili kati ya ubaya na wema.
