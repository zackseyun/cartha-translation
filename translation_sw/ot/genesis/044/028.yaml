  text: Mmoja aliondoka kwangu, nami nikasema, ‘Hakika ameraruliwa vipandevipande,’ na sijamwona mpaka sasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: Mmoja wao aliondoka kwangu
  rationale: Neno הָאֶחָד ni ‘mmoja’; ‘wao’ linawekwa kwa ufasaha kutokana na muktadha wa wana wawili bila kulifanya kuwa ‘yule mmoja.’ מֵאִתִּי lina maana ya kuondoka kwa msemaji.
- source_word: אַךְ טָרֹף טֹרָף
  choice: Hakika ameraruliwa vipandevipande
  rationale: אַךְ linasisitiza uhakika, na muundo wa Kiebrania wa kitenzi kisoukomo pamoja na kitenzi טָרֹף טֹרָף unasisitiza kuraruliwa kabisa, kwa kawaida na mnyama.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: na sijamwona mpaka sasa
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya Kiswahili inayohifadhi hali endelevu ya kutomwona hadi wakati wa kusema.
