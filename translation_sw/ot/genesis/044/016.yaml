  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: sw
  text: 'Yuda akasema, “Tutamwambia nini, bwana wangu? Tutasema nini? Au tutajionyeshaje kuwa wenye haki?[a] Mungu ameigundua hatia ya watumishi wako.[b][c] Hapa tuko: watumwa wa bwana wangu, sisi pamoja na yule ambaye kikombe kilipatikana mkononi mwake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tutajisafishaje?” Kitenzi cha Kiebrania kinaweza kumaanisha kujionyesha kuwa upande wa haki au kujithibitisha kuwa na haki.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “Mungu ameipata hatia ya watumishi wako”; katika muktadha, maana inaweza kuwa kwamba Mungu ameigundua au ameifunua hatia yao.
    reason: lexical_alternative
  - marker: c
    text: “Watumishi wako” ni namna ya heshima ya kujitaja mbele ya mwenye mamlaka; “watumwa” baadaye katika mstari huu huonyesha hali ya utumwa ambayo ndugu hao wanakubali.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: bwana wangu
  rationale: Hii ni njia ya heshima ya kumwita Yosefu akiwa mwenye mamlaka, wala si jina la Mungu. “Bwana wangu” ni ya kawaida na yenye staha katika mazungumzo haya.
- source_word: מַה נֹּאמַר / מַה נְּדַבֵּר
  choice: Tutamwambia nini / Tutasema nini
  rationale: Maswali haya mawili yanadumisha urudiaji wa Kiebrania na yanaonyesha kwamba Yuda hana la kusema katika kujitetea. Kiambishi cha yambwa katika “tutamwambia” kinaweka wazi anayehutubiwa bila kubadili maana.
- source_word: וּמַה נִּצְטַדָּק
  choice: Au tutajionyeshaje kuwa wenye haki?
  rationale: Kauli hii huhusu kujionyesha au kuthibitisha kwamba wako upande wa haki. Tafsiri inahifadhi maana ya msingi bila kuamua kimyakimya kwamba ni kutokuwa na hatia tu kunakokusudiwa.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu mmoja ambaye Yuda anamkiri kuwa amefichua hatia yao.
- source_word: מָצָא אֶת עֲוֹן
  choice: ameifunua hatia
  rationale: Ingawa kitenzi kwa msingi ni “amepata,” usemi huu katika muktadha una maana ya kwamba hatia iliyofichika imegunduliwa na kuwekwa wazi. “Ameifunua” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: watumishi wako / watumwa
  rationale: Mahali pa kwanza ni namna ya kujitaja kwa unyenyekevu mbele ya mkuu; mahali pa pili Yuda anakubali hali halisi ya utumwa. Kutofautisha “watumishi” na “watumwa” kunahifadhi matumizi hayo mawili.
- source_word: הִנֶּנּוּ
  choice: Sisi hapa tu
  rationale: Usemi huu wa kujiwasilisha unaonyesha kujisalimisha kwao. “Sisi hapa tu” ni wa asili katika Kiswahili na huhifadhi msisitizo wa uwepo wao.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: sisi pamoja na yule ambaye kikombe kilipatikana mkononi mwake
  rationale: Muundo huu unawahusisha ndugu wote pamoja na yule aliyekutwa na kikombe, huku “mkononi mwake” ikifuata taswira ya Kiebrania.
- source_word: הַגָּבִיעַ
  choice: kikombe
  rationale: “Kikombe” ni neno la kawaida na linaloeleweka; haliongezi urembo au umbo maalumu ambalo maandishi hayalazimishi.
theological_decisions:
- issue: Anayerejelewa na הָאֱלֹהִים katika ungamo la Yuda
  choice: Yuda anamweleza Mungu mwenyewe kuwa ndiye aliyefichua hatia yao.
  alternative: Nguvu fulani ya kimungu imegundua kosa lao.
  rationale: Muktadha wa Mwanzo na kauli ya Yuda zinaelekeza kwa Mungu mmoja, si mungu asiyeainishwa wala miungu mingi.
- issue: Hatia inayorejelewa na עֲוֹן
  choice: Kauli inaachwa kuwa ungamo la hatia yao kwa ujumla bila kuitambulisha moja kwa moja na kosa la kikombe.
  alternative: Yuda anakiri hasa kwamba wao waliiba kikombe.
  rationale: Yuda anajua mazingira ya kikombe, lakini usemi wake unaweza kurejelea hatia ya zamani ya ndugu hao ambayo Mungu sasa ameifunua. Tafsiri haifungi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Maswali mafupi yanahifadhi mfululizo wa balagha wa Kiebrania. Tofauti kati ya “watumishi” na “watumwa” imehifadhiwa ili kuonyesha adabu ya kwanza na kujisalimisha kwa pili.
