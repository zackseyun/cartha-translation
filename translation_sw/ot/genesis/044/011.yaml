translation:
  language: sw
  text: Basi wakaharakisha; kila mtu akateremsha gunia lake mpaka ardhini, na kila mtu akalifungua gunia lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarudia “kila mtu” kabla ya tendo la kushusha na kabla ya tendo la kufungua, kikisisitiza kwamba kila mtu alishusha na kufungua gunia lake mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: wakafanya haraka
  rationale: Kitenzi מהר kinaonyesha kwamba walitenda bila kukawia; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili cha sasa.
- source_word: וַיּוֹרִדוּ
  choice: akaushusha
  rationale: Hifili ya ירד ina maana ya kusababisha kitu kishuke; hapa kila mmoja alishusha gunia lake hadi chini.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: kila mmoja ... gunia lake
  rationale: אִישׁ imetumiwa kwa maana ya kugawa tendo kwa kila mtu mmoja mmoja. 'Kila mmoja' ni ya asili katika Kiswahili na haiongezi jinsia ambayo si lazima irudiwe katika muktadha huu.
- source_word: אַמְתַּחַת
  choice: gunia
  rationale: Neno hili linamaanisha mfuko wa kubebea nafaka au mahitaji; 'gunia' linafaa kwa mazingira ya simulizi.
- source_word: אָרְצָה
  choice: chini
  rationale: Umbo lenye mwelekeo linaonyesha kushushwa hadi ardhini; 'chini' linaeleza mwendo huo kwa Kiswahili cha kawaida.
- source_word: וַיִּפְתְּחוּ
  choice: akalifungua
  rationale: פתח hapa lina maana ya kawaida ya kufungua; kiambishi cha yambwa kinarejelea gunia lake kwa uwazi.
