base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: sw
  text: Yosefu akawaambia, “Ni tendo gani hili mlilofanya? Je, hamkujua kwamba mtu kama mimi hakika hupiga ramli[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hakika hufanya uaguzi,” “bila shaka angegundua kwa kupiga ramli,” au “hakika anaweza kugundua mambo kama hayo.” Kiebrania kinatumia muundo wa msisitizo wa kitenzi chenye mzizi unaohusu uaguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: Ni tendo gani hili
  rationale: Neno מַעֲשֶׂה humaanisha tendo au kitendo. ‘Tendo’ linadumisha uzito wa karipio na ni la kawaida katika Kiswahili sanifu.
- source_word: עֲשִׂיתֶם
  choice: mlilofanya
  rationale: Kauli iliyokamilika inaeleza tendo lililofanywa na ambalo ndilo msingi wa shtaka la sasa.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Je, hamkujua
  rationale: Swali hasi linatarajia jibu la kukubali; tafsiri hii inadumisha nguvu yake ya balagha.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: hakika hupiga ramli
  rationale: Muundo wa kitenzi kisoukomo kamili pamoja na kitenzi chenye kikomo unasisitiza kitendo cha uaguzi. ‘Hakika hupiga ramli’ ni Kiswahili cha kawaida na hudumisha dai la moja kwa moja bila kuamua kama Yosefu alifanya hivyo kweli au alisema kwa kujisitiri katika nafasi yake ya Kimisri.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: mtu kama mimi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mtu wa aina au cheo kama msemaji.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
theological_decisions:
- issue: Ikiwa dai la Yosefu kuhusu kupiga ramli litafsiriwe moja kwa moja au lilainishwe kuwa kujifanya au kugundua kwa ujanja
  choice: hakika hupiga ramli
  alternative: hakika angegundua kwa kupiga ramli; anaweza kugundua mambo kama hayo
  rationale: Kiebrania kinatumia mzizi נחש mara mbili kwa msisitizo na hurejelea uaguzi. Tafsiri inadumisha maneno ya Yosefu jinsi yalivyo bila kuthibitisha wala kukanusha kwamba kweli alifanya uaguzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kupiga ramli’ ni usemi unaoeleweka kwa urahisi; tanbihi inaonyesha mbadala wa ‘kufanya uaguzi’ na inadumisha utata wa dai la Yosefu.
