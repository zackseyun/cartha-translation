base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: sw
  text: Naye akasema, “Hata sasa, iwe kama mlivyosema. Yule ambaye kikombe kitapatikana kwake atakuwa mtumwa wangu[a], na ninyi mtakuwa bila hatia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza pia kutafsiriwa “mtumishi”; hapa “mtumwa” limetumiwa kwa sababu hali ya kufungwa kwa lazima kama adhabu ndiyo inayosisitizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Basi
  rationale: Katika muktadha huu kirai hicho kinaanzisha jibu la papo hapo na kukubali kwa kiwango fulani masharti yaliyotajwa. “Basi” ni Kiswahili cha kawaida kinachobeba nguvu hiyo bila usemi mgumu wa neno kwa neno kama “hata sasa.”
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: iwe kama mlivyosema
  rationale: Huwasilisha ukubali wa pendekezo lao, huku nukta baada ya sentensi hii ikitenganisha hukumu inayofuata, ambayo inapunguza adhabu waliyopendekeza katika mstari uliotangulia.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: Yule ambaye kikombe kitapatikana kwake
  rationale: Kitenzi cha Kiebrania ni cha hali ya kutendwa na kinamtambulisha mwenye kukutwa na kitu hicho. “Kikombe” kimetajwa wazi kwa ajili ya uelewekevu wa Kiswahili kutokana na muktadha wa karibu.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: atakuwa mtumwa wangu
  rationale: עָבֶד hapa inaonyesha hali ya kulazimishwa na ya adhabu, si kazi ya kawaida ya kuajiriwa; kwa hiyo “mtumwa” ni sahihi kuliko “mtumishi.”
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: na ninyi mtakuwa bila hatia
  rationale: נְקִיִּם humaanisha kutokuwa na hatia au wajibu wa adhabu. “Bila hatia” ni wazi na huhifadhi tofauti kati ya aliyekutwa na kikombe na wale wengine.
theological_decisions: []
