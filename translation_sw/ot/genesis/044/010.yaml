  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Nukta baada ya “mlivyosema” imehifadhiwa ili hukumu inayofuata isionekane kuwa marudio kamili ya pendekezo kali la ndugu katika mstari uliotangulia.
