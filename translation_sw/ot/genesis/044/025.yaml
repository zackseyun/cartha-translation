  yaml_path: translation/ot/genesis/044/025.yaml
  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: sw
  text: Kisha baba yetu akasema[a], ‘Rudini mkatununulie chakula kidogo.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Rudini mkatununulie nafaka kidogo.” Kiebrania kinatumia neno la jumla linalomaanisha “chakula,” ingawa muktadha mpana unahusu nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akasema
  rationale: Waw ya mfululizo inaendeleza simulizi; ‘Kisha’ linaonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: אָבִינוּ
  choice: baba yetu
  rationale: Katika muktadha huu neno hili linamtaja Yakobo, baba halisi wa ndugu hao.
- source_word: שֻׁבוּ
  choice: Rudini
  rationale: Amri hii inawatuma waende tena mahali walikotoka; ‘Rudini’ huhifadhi maana ya kurejea bila kuongeza maelezo yasiyokuwamo.
- source_word: שִׁבְרוּ
  choice: mkatununulie
  rationale: Katika simulizi la Yosefu, kitenzi hiki humaanisha kununua nafaka au chakula. Muundo huu wa Kiswahili unaonyesha kwa kawaida kusudi la kurudi na pia manufaa kwa ‘sisi’.
- source_word: לָנוּ
  choice: -tu-
  rationale: Kiambishi cha yambwa ‘-tu-’ katika ‘mkatununulie’ kinawasilisha maana ya ‘kwa ajili yetu’ kwa Kiswahili cha asili.
- source_word: מְעַט
  choice: kidogo
  rationale: Neno hili huonyesha kiasi kisichokuwa kikubwa.
- source_word: אֹכֶל
  choice: chakula
  rationale: Hili ni neno la jumla la chakula, kama lilivyo neno la Kiebrania; halibanwi kuwa ‘nafaka,’ ingawa muktadha unahusu nafaka.
