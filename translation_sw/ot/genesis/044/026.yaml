  terminology: “Ndugu yetu mdogo,” “kushuka,” “uso wa huyo mtu,” na “kwa maana” vinafaa kwa muktadha na rejista. Tanbihi inafafanua kwa usahihi nahau ya “kuuona uso” bila kuibadilisha katika tafsiri yenyewe.
