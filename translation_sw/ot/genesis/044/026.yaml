  text: וַ/נֹּ֕אמֶר לֹ֥א נוּכַ֖ל לָ/רֶ֑דֶת אִם יֵשׁ֩ אָחִ֨י/נוּ הַ/קָּטֹ֤ן אִתָּ֨/נוּ֙ וְ/יָרַ֔דְנוּ כִּי לֹ֣א נוּכַ֗ל לִ/רְאוֹת֙ פְּנֵ֣י הָ/אִ֔ישׁ וְ/אָחִ֥י/נוּ הַ/קָּטֹ֖ן אֵינֶ֥/נּוּ אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: sw
  text: Lakini tukasema, “Hatuwezi kushuka. Ikiwa ndugu yetu mdogo yuko pamoja nasi, tutashuka; kwa maana hatuwezi kuuona uso wa huyo mtu[a] ikiwa ndugu yetu mdogo hayuko pamoja nasi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “kuuona uso wa huyo mtu,” nahau yenye maana ya kufika mbele yake au kuja mahali alipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Lakini tukasema
  rationale: Waw inaendeleza simulizi, huku “Lakini” ikionyesha tofauti ndogo kati ya sharti lililotolewa na jibu la ndugu.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: Hatuwezi kushuka
  rationale: יכל huonyesha uwezo, na ירד ni “kushuka,” usemi unaofaa kwa safari ya kwenda Misri.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ
  choice: Ikiwa ndugu yetu mdogo yuko pamoja nasi
  rationale: Muundo chanya wa Kiebrania umehifadhiwa kama sharti tofauti. Katika muktadha, הַקָּטֹן humaanisha ndugu aliye mdogo kuliko wengine, yaani Benyamini.
- source_word: וְיָרַדְנוּ
  choice: tutashuka
  rationale: Kitenzi hiki kinaeleza matokeo ya sharti lililotangulia; wakati ujao ni wa kawaida na wazi katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha sababu ya kukataa kwao; “kwa maana” inadumisha mtiririko wenye hadhi.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: kuuona uso wa huyo mtu
  rationale: Tafsiri inadumisha taswira halisi ya Kiebrania, “kuuona uso,” huku tanbihi ikifafanua maana yake ya kuja mbele yake.
- source_word: הָאִישׁ
  choice: huyo mtu
  rationale: Nomino ya Kiebrania ni “mtu,” si cheo; kiashiria “huyo” kinamrejelea mtu aliyetajwa tayari katika masimulizi.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: ikiwa ndugu yetu mdogo hayuko pamoja nasi
  rationale: Ingawa Kiebrania kinaunganisha kishazi kwa waw, maana yake katika sentensi ni hali inayozuia wao kuonana na huyo mtu; “ikiwa” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions: []
