  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sharti la Kiebrania umehifadhiwa bila kuufanya sentensi kuwa yenye kujirudia isivyo kawaida.
