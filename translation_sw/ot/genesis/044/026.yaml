  source_fidelity: 'Tafsiri inafuata muundo na maana ya Kiebrania kwa uaminifu: kauli ya kutoweza kushuka, sharti la kuwapo kwa ndugu mdogo, matokeo ya kushuka, na sababu inayohusu kutoweza kuuona uso wa mtu huyo bila ndugu huyo. Neno “kushuka” pia huhifadhi taswira ya ירד.'
