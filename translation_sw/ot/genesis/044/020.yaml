base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: sw
  text: Nasi tukamwambia bwana wangu, ‘Tuna baba mzee, na mwana mdogo aliyezaliwa wakati baba yake alipokuwa mzee[a]. Ndugu yake amekufa, naye ndiye mwana pekee aliyebaki wa mama yake[b], na baba yake anampenda.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “mwana wa uzee wake,” yaani, mwana aliyezaliwa baba yake akiwa amezeeka.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja moja, “yeye peke yake ndiye aliyebaki kwa mama yake,” yaani, ndiye mwana pekee wa mama yake aliyesalia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumwita mtu mwenye mamlaka, huku ikihifadhi tofauti ya hadhi iliyopo katika simulizi.
- source_word: זָקֵן
  choice: mzee
  rationale: Neno hili linaeleza umri mkubwa wa baba kwa Kiswahili cha kawaida na chenye heshima.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: mwana mdogo aliyezaliwa wakati wa uzee wake
  rationale: Tafsiri hii inawasilisha maana ya mtoto wa uzeeni na pia sifa ya kuwa mdogo, kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: וְאָחִיו מֵת
  choice: Ndugu yake amekufa
  rationale: 'Huwasilisha hali yenye matokeo ya sasa: ndugu huyo hayuko hai tena.'
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: naye peke yake ndiye aliyebaki kati ya wana wa mama yake
  rationale: Hufafanua uhusiano unaoonyeshwa na לְאִמּוֹ bila kutoa dhana isiyokusudiwa kwamba aliachwa chini ya uangalizi wa mama yake; yeye ndiye mwana pekee wa mama huyo aliyesalia.
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: na baba yake anampenda
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya upendo maalumu wa baba kwa mwana huyo.
