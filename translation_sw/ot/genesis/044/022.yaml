  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: sw
  text: Tukamwambia bwana wangu, “Kijana hawezi kumwacha baba yake, kwa maana akimwacha baba yake, baba yake atakufa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kiebrania: “na akimwacha baba yake, atakufa.” Kiebrania hakimtaji wazi mtendaji wa “atakufa”; muktadha unaonyesha kuwa ni baba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Nasi tukamwambia
  rationale: Kitenzi cha simulizi katika nafsi ya kwanza wingi kinaendeleza mfuatano wa matukio; “nasi” huhifadhi kiunganishi bila kukipa maana nzito kupita kiasi.
- source_word: אֶל אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumsemesha Yosefu katika mazingira ya kifalme; “bwana wangu” ni ya kawaida, yenye staha, na haiongezi wazo lisilokuwamo la utumwa.
- source_word: לֹא יוּכַל
  choice: hawezi
  rationale: Hueleza kutokuwa na uwezo kwa Kiswahili cha sasa na cha kawaida.
- source_word: הַנַּעַר
  choice: Kijana
  rationale: Neno la Kiebrania linaweza kumaanisha mvulana au kijana. “Kijana” huhifadhi upana huo na linafaa kwa jinsi Benyamini anavyoelezwa kwa uhusiano wake na baba yake.
- source_word: לַעֲזֹב / וְעָזַב
  choice: kumwacha / akimwacha
  rationale: Mzizi hapa una maana ya kuondoka na kumwacha mtu, si lazima kumsaliti au kumtelekeza kimaadili. Muundo “akimwacha” huwasilisha uhusiano wa masharti unaodokezwa katika muktadha.
- source_word: אָבִיו
  choice: baba yake
  rationale: Tafsiri ya moja kwa moja ya umilikaji; marudio yamehifadhiwa kwa msisitizo na uwazi.
- source_word: וָמֵת
  choice: baba yake atakufa
  rationale: Muktadha unaonyesha kwamba anayetarajiwa kufa ni baba. Kiswahili kinahitaji mtendaji aeleweke wazi zaidi, lakini tanbihi inahifadhi hali ya Kiebrania ambayo haimtaji tena kwa jina.
theological_decisions:
- issue: Mtendaji wa וָמֵת (“atakufa”)
  choice: baba yake atakufa
  alternative: atakufa (bila kubainisha kama ni kijana au baba)
  rationale: Muktadha wa hoja ya Yuda, hasa hofu kuhusu athari kwa baba, unaelekeza kwa baba kuwa ndiye atakayekufa. Hata hivyo, kwa kuwa Kiebrania hakirudii nomino na hivyo huacha mtendaji kudokezwa, hali hiyo imeelezwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Bwana wangu” huhifadhi heshima ya mazungumzo ya ikulu, na “kijana” huepuka kumfanya Benyamini aonekane lazima kuwa mtoto mdogo.
