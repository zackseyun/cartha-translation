  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Ni namna ya heshima ya kumwambia mtawala moja kwa moja; inadumisha unyenyekevu wa lugha ya ikulu bila kutumia neno la kawaida mno.
- source_word: שָׁאַל
  choice: aliwauliza
  rationale: Kitenzi hiki humaanisha kuuliza au kutaka habari; “aliwauliza” ni cha kawaida na kinaendana na swali la moja kwa moja.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Ingawa עֶבֶד yaweza kumaanisha mtumwa au mtumishi, hapa ndugu wanajitaja kwa unyenyekevu mbele ya mtawala; “watumishi” huhifadhi matumizi hayo bila kusisitiza hali ya utumwa isiyolengwa katika muktadha huu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno yanayofuata; “akisema” ni tafsiri wazi inayohifadhi muundo wa chanzo.
- source_word: הֲיֵשׁ לָכֶם
  choice: Je, mna
  rationale: Muundo wa Kiebrania unauliza kuhusu kuwapo au kuwa na kitu; “Je, mna” ni Kiswahili cha kawaida na sahihi.
- source_word: אָב
  choice: baba
  rationale: Kiswahili hakihitaji kibainishi cha kutokuwa maalumu sawa na Kiingereza; “baba” huwasilisha swali kuhusu kuwapo kwa mzazi huyo.
- source_word: אָח
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kumaanisha brother katika muktadha huu; umoja unadumishwa kwa muundo wa swali.
