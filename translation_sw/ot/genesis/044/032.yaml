base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: sw
  text: Kwa maana mimi, mtumishi wako, nilijifunga kwa baba yangu kuwajibika kwa ajili ya kijana huyu,[a] nikisema, ‘Nisipomrudisha kwako, nitakuwa na hatia mbele ya baba yangu siku zote za maisha yangu.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilichukua dhamana ya kijana huyu” au “nilikuwa mdhamini wa kijana huyu kwa baba yangu.” Kitenzi cha Kiebrania kina maana ya kujifunga kuchukua jukumu kama mdhamini.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “nitakuwa nimetenda dhambi kwa/dhidi ya baba yangu siku zote.” Hapa maana yake ni kubaki na hatia au lawama mbele yake maisha yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi la Yuda na kuunganisha mstari huu na hoja iliyotangulia.
- source_word: עַבְדְּךָ
  choice: mimi, mtumishi wako
  rationale: Ni njia ya unyenyekevu ya kujitaja mbele ya mwenye mamlaka; ‘mtumishi’ inadumisha hadhi ya mazungumzo bila kusisitiza utumwa wa mali.
- source_word: עָרַב
  choice: nilijitoa kuwa mdhamini
  rationale: Kitenzi kina maana ya kuchukua jukumu binafsi kama mdhamini; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: הַנַּעַר
  choice: kijana huyu
  rationale: Neno linaweza kumaanisha mvulana au kijana; ‘kijana huyu’ linafaa kwa Benyamini na muktadha wa mazungumzo.
- source_word: מֵעִם אָבִי
  choice: mbele ya baba yangu
  rationale: Katika muundo huu linaonyesha mtu ambaye Yuda alimpa dhamana; ‘mbele ya’ pia linaendana na uwajibikaji binafsi unaoelezwa.
- source_word: לֵאמֹר
  choice: nikisema
  rationale: Ni utangulizi wa kawaida wa maneno yaliyonukuliwa.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: Nisipomrudisha kwako
  rationale: ‘Kumrudisha’ huwasilisha kwa kawaida kwamba Yuda alipaswa kumleta Benyamini tena kwa baba yake, huku kiambishi ‘-m-’ kikihifadhi mhusika.
- source_word: וְחָטָאתִי
  choice: nitakuwa na hatia
  rationale: Huhifadhi kwa karibu wazo la msingi la kutenda dhambi au kuwa na hatia, bila kulipunguza kuwa lawama ya kijamii pekee.
- source_word: לְאָבִי
  choice: mbele ya baba yangu
  rationale: Huonyesha uwajibikaji na hatia katika uhusiano na baba yake; uwezekano wa ‘dhidi ya baba yangu’ umeelezwa katika tanbihi.
- source_word: כָּל הַיָּמִים
  choice: siku zote za maisha yangu
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha muda wote uliobaki wa maisha.
theological_decisions:
- issue: Maana ya וְחָטָאתִי לְאָבִי
  choice: nitakuwa na hatia mbele ya baba yangu
  alternative: nitakuwa nimemtendea baba yangu dhambi
  rationale: Tafsiri kuu inadumisha dhana ya hatia ya kudumu katika uhusiano huo, huku tanbihi ikihifadhi maana halisi zaidi ya ‘kutenda dhambi dhidi ya/kwa baba yangu’ bila kuamua kimya kimya upeo wa kimaadili wa kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa usemi wa unyenyekevu wa Yuda umehifadhiwa, na maneno ya kisheria yamewekwa kwa namna inayoeleweka kwa msomaji wa kawaida.
