  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: sw
  text: Nao wakamwambia, “Kwa nini bwana wangu aseme maneno kama haya?[a] Hasha! Haiwezekani kwa watumishi wako kufanya jambo kama hilo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno ya namna hii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Nao wakamwambia
  rationale: Kauli hii inaendeleza mtiririko wa simulizi na kueleza kwamba ndugu walimjibu msimamizi wa Yosefu; kiwakilishi cha Kiswahili kinawakilisha kwa kawaida maana ya ‘wakamwambia yeye.’
- source_word: לָמָּה יְדַבֵּר אֲדֹנִי
  choice: Kwa nini bwana wangu aseme
  rationale: Muundo huu ni swali la heshima lenye mshangao na pingamizi. ‘Bwana wangu’ hapa ni namna ya heshima ya kumwambia mwanadamu, si jina la Mungu.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: maneno kama haya
  rationale: Tafsiri hii inadumisha rejeo mahsusi kwa maneno yaliyosemwa na maana ya ulinganisho iliyo katika kiambishi כ־.
- source_word: חָלִילָה
  choice: Hasha!
  rationale: ‘Hasha!’ ni tamko la kawaida na lenye nguvu la Kiswahili la kukataa kabisa wazo au tendo linalodaiwa, bila kuingiza rejeo la mbinguni au la Mungu lisilokuwapo wazi katika Kiebrania.
- source_word: לַעֲבָדֶיךָ
  choice: Watumishi wako
  rationale: Hili ni jina la unyenyekevu ambalo ndugu wanajitumia mbele ya mwenye mamlaka. ‘Watumishi’ linafaa zaidi hapa kuliko ‘watumwa,’ kwa kuwa muktadha ni usemi wa heshima wa walio chini yake.
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: hawawezi kufanya jambo kama hilo
  rationale: Baada ya ‘Hasha!’ Kiswahili cha kawaida huhitaji kauli kamili. ‘Hawawezi’ hapa huonyesha kwamba jambo hilo haliwafikiriki kabisa kimaadili na kimadai, si ukosefu wa uwezo wa kimwili.
