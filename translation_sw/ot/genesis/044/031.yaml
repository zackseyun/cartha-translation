  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: sw
  text: basi, atakapoona kwamba huyo kijana hayupo, atakufa; na watumishi wako watashusha mvi za mtumishi wako, baba yetu, mpaka Sheoli kwa huzuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mpaka kaburini” au “katika makao ya wafu.” Kiebrania: “Sheoli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: basi
  rationale: Hutambulisha matokeo ya sharti lililotangulia kwa Kiswahili cha kawaida bila kuiga kishazi cha Kiebrania neno kwa neno.
- source_word: כִּרְאוֹתוֹ
  choice: atakapoona
  rationale: Muundo huu unaonyesha hali ya wakati, yaani ‘wakati atakapoona.’
- source_word: כִּי אֵין הַנַּעַר
  choice: kwamba huyo kijana hayupo
  rationale: אֵין hapa huonyesha kutokuwapo; ‘hayupo’ haidokezi moja kwa moja kuwa Benyamini amekufa.
- source_word: הַנַּעַר
  choice: huyo kijana
  rationale: ‘Kijana’ ni tafsiri ya kawaida na yenye heshima ya נַעַר katika muktadha huu; kiashiria ‘huyo’ humrejelea Benyamini anayezungumziwa.
- source_word: וָמֵת
  choice: atakufa
  rationale: Kitendo kinaeleza matokeo yajayo ya baba kumwona Benyamini hayupo.
- source_word: וְהוֹרִידוּ
  choice: watashusha
  rationale: Huhifadhi taswira ya Hiphil ya ירד, ya kusababisha kushuka mpaka Sheoli.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Ni lugha ya kujishusha mbele ya mtawala, si lazima msisitizo wa hali ya utumwa.
- source_word: שֵׂיבַת
  choice: mvi
  rationale: Huhifadhi taswira halisi ya nywele za mvi inayowakilisha uzee, badala ya kuibadili moja kwa moja kuwa ‘uzee.’
- source_word: עַבְדְּךָ אָבִינוּ
  choice: za mtumishi wako, baba yetu
  rationale: 'Huhifadhi maelezo yote mawili kumhusu Yakobo: ni ‘mtumishi wako’ na ‘baba yetu.’'
- source_word: בְּיָגוֹן
  choice: kwa huzuni
  rationale: Hutoa maana ya יָגוֹן kwa Kiswahili cha asili katika nahau hii.
- source_word: שְׁאֹלָה
  choice: mpaka Sheoli
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea Sheoli; unukuzi huhifadhi upana wa maana ya neno hilo.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburini; katika makao ya wafu
  rationale: Unukuzi ‘Sheoli’ huepuka kupunguza maana kuwa kaburi tu au kuingiza ufafanuzi maalumu wa ulimwengu wa wafu; tanbihi inaonyesha maana mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umehifadhi taswira ya Kiebrania ya ‘kushusha mvi ... mpaka Sheoli,’ huku ‘basi’ na ‘atakapoona’ vikifanya sentensi isomeke kwa kawaida.
