  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: sw
  text: Yeyote kati ya watumishi wako atakayekutwa nacho[a], na afe[b]; nasi pia tutakuwa watumwa wa bwana wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno lilelile la Kiebrania limetafsiriwa “watumishi” hapa, kwa sababu ni namna ya kujitaja kwa heshima, na “watumwa” baadaye, ambako utumwa halisi unakusudiwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “atakufa.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: Yeyote kati ya watumishi wako atakayekutwa nacho
  rationale: Kifungu hiki kinaonyesha mtu mmoja asiyejulikana kutoka katika kundi hilo. “Nacho” kinarejelea kikombe kilichotajwa katika muktadha uliotangulia, na “atakayekutwa” huhifadhi hali ya kutendwa ya kitenzi cha Kiebrania.
- source_word: וָמֵת
  choice: na afe
  rationale: Kauli hii ina nguvu ya pendekezo la adhabu katika tamko lao; “na afe” ni ya kawaida na yenye uzito katika Kiswahili, bila kuifanya kitenzi kuwa cha kusababisha kifo.
- source_word: וְגַם אֲנַחְנוּ
  choice: nasi pia
  rationale: 'Huhifadhi msisitizo wa nyongeza: zaidi ya adhabu ya mwenye hatia, ndugu wengine pia wanajitoa kwa adhabu.'
- source_word: נִהְיֶה לַאדֹנִי לַעֲבָדִים
  choice: tutakuwa watumwa wa bwana wangu
  rationale: Hapa עֲבָדִים inaonyesha utumwa halisi unaopendekezwa kama adhabu, si lugha ya heshima tu. “Bwana wangu” ni cheo cha heshima kwa mtawala wa kibinadamu.
theological_decisions:
- issue: Kutafsiri עבד kwa namna tofauti katika sehemu zake mbili
  choice: “watumishi” katika kujitaja kwa heshima, lakini “watumwa” katika adhabu inayopendekezwa
  alternative: Kutumia “watumwa” au “watumishi” katika sehemu zote mbili
  rationale: Mzizi uleule wa Kiebrania umetumiwa mara mbili, lakini maana inayosisitizwa hutofautiana. Mara ya kwanza ni lugha ya kujishusha mbele ya mtawala; mara ya pili ni kuingia katika hali halisi ya utumwa. Tanbihi inahifadhi uhusiano wa maneno hayo.
- issue: Nguvu ya וָמֵת
  choice: “na afe”
  alternative: “atakufa”
  rationale: Katika muktadha wa pendekezo lao la adhabu, kauli ya kutaka au kukubali matokeo inafaa zaidi kuliko taarifa tambarare ya wakati ujao, ingawa Kiebrania kinaweza kutafsiriwa kwa kauli ya matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Bwana wangu” imeandikwa kwa herufi ndogo kwa kuwa ni cheo cha heshima kwa mwanadamu, si jina la Mungu.
