base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: sw
  text: Tazama, fedha tuliyoikuta katika vinywa vya magunia yetu[a] tuliirudisha kwako kutoka nchi ya Kanaani. Basi, tungewezaje kuiba fedha au dhahabu kutoka katika nyumba ya bwana wako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “katika kinywa cha magunia yetu,” yaani katika ufunguzi au sehemu ya juu ya gunia.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni chembe ya mazungumzo inayosisitiza hoja inayofuata; “Tazama” ni ya heshima na inaeleweka katika Kiswahili cha Biblia.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Neno hili humaanisha fedha kama metali na pia pesa; “fedha” huhifadhi urudiaji na ulinganifu wake na “dhahabu” mwishoni mwa mstari.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: kwenye midomo ya magunia yetu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya “mdomo” wa chombo; tanbihi inaeleza kuwa ni sehemu ya wazi ya gunia.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: tuliirudisha kwako
  rationale: Kauli ya kusababisha ya שוב hapa inaeleza kuifanya fedha irudi kwa mhusika anayesemeshwa; umoja wa “tuliirudisha” hurejelea fedha.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: kutoka nchi ya Kanaani
  rationale: Ni usemi wa kawaida na wa asili wa kijiografia katika Kiswahili.
- source_word: וְאֵיךְ נִגְנֹב
  choice: Basi, tungewezaje kuiba
  rationale: Swali ni la balagha na linatoa hitimisho kutokana na uaminifu wao wa awali; “tungewezaje” huwasilisha nguvu ya kimodal ya muktadha.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: kutoka katika nyumba ya bwana wako
  rationale: אדון hapa ni mkuu wa msimamizi, si jina la Mungu; “bwana wako” ni usemi wa kijamii unaofaa, huku “nyumba” ikihifadhi metonimia ya Kiebrania.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: fedha au dhahabu
  rationale: Huhifadhi jozi halisi ya metali na mwangwi wa “fedha” iliyotajwa mapema.
