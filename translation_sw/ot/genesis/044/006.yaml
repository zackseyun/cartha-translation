lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: Akawafikia
  rationale: Kitenzi נשׂג katika Hifili chenye kiambishi cha nafsi ya tatu wingi kinaonyesha kwamba msimamizi aliwafuatia na kuwafikia njiani. Kiswahili ‘akawafikia’ ni cha kawaida na kinahifadhi wazo la kuwafikia baada ya kuwafuata.
- source_word: וַיְדַבֵּר
  choice: akawaambia
  rationale: דבר humaanisha ‘kusema/kuzungumza’. Katika Kiswahili, ‘akawaambia maneno haya’ ni mtiririko wa kawaida wa kutanguliza usemi, huku maana ya kuelekeza maneno kwao ikihifadhiwa.
- source_word: אֲלֵהֶם
  choice: -wa-
  rationale: Kihusishi אֶל kinaelekeza usemi kwa ndugu hao; katika ‘akawaambia’, yambwa ‘-wa-’ huwasilisha maana ya ‘kwao’ kwa Kiswahili cha kawaida.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: Tafsiri ya moja kwa moja ya kirai hiki ni ‘maneno haya’; hapa kinatanguliza maneno halisi yanayofuata na kinasikika kwa kawaida katika Kiswahili.
