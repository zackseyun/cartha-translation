base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: sw
  text: Kisha akamwamuru yule aliyekuwa msimamizi wa nyumba yake, akisema, “Jaza magunia ya watu hao chakula, kadiri wawezavyo kubeba, na weka fedha ya kila mtu mdomoni mwa gunia lake[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mdomoni mwa gunia lake,” yaani, kwenye sehemu ya wazi ya gunia lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Kisha akamwamuru
  rationale: Muundo wa wayyiqtol unaendeleza mfululizo wa simulizi; “kisha” huonyesha hatua inayofuata, na “akamwamuru” huhifadhi maana ya kutoa amri.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: yule aliyekuwa msimamizi wa nyumba yake
  rationale: Kirai hiki kwa karibu ni ‘aliyekuwa juu ya nyumba yake’ na humaanisha mtu aliyesimamia shughuli za nyumba ya Yosefu. “Msimamizi wa nyumba yake” ni Kiswahili cha kawaida kisichoingiza cheo maalumu zaidi ya maandishi.
- source_word: מַלֵּא
  choice: Jazeni
  rationale: Ni amri ya kujaza. Wingi umetumiwa kwa kuwa maagizo yanayofuata katika Kiebrania yana umbo la wingi, yakielekezwa kwa msimamizi pamoja na watumishi wake wanaotekeleza kazi.
- source_word: אַמְתְּחֹת
  choice: magunia
  rationale: Neno hili linataja mifuko mikubwa ya kubebea chakula au nafaka safarini; “magunia” linafaa kwa mazingira haya ya kale.
- source_word: הָאֲנָשִׁים
  choice: watu hao
  rationale: Kiebrania kinasema ‘watu hao’ au ‘wanaume hao.’ “Watu hao” ni cha asili katika Kiswahili na hakiongezi utambulisho wa ‘ndugu’ ambao haujatajwa katika kirai hiki.
- source_word: אֹכֶל
  choice: chakula
  rationale: אֹכֶל ni neno pana linalomaanisha chakula. Ingawa muktadha unahusu nafaka, tafsiri pana imehifadhiwa.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: kadiri wawezavyo kubeba
  rationale: Kirai hiki huunganisha uwezo na tendo la kubeba; tafsiri hii ni ya kawaida na huhifadhi wazo la kiasi kinacholingana na uwezo wao.
- source_word: וְשִׂים
  choice: na mweke
  rationale: Kitenzi שׂים humaanisha kuweka. Umbo la wingi linafuata umbo la Kiebrania na mfululizo wa maagizo.
- source_word: כֶּסֶף אִישׁ
  choice: fedha ya kila mtu
  rationale: כֶּסֶף hapa ni fedha waliyotumia kulipia. “Ya kila mtu” huhifadhi maana ya mgawanyo ya אִישׁ bila kuongeza maelezo yasiyo katika mstari.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: mdomoni mwa gunia lake
  rationale: Kiebrania hutumia taswira ya ‘mdomo wa gunia’ kumaanisha sehemu yake ya kuingizia vitu. Taswira hiyo inaeleweka katika Kiswahili na imehifadhiwa, huku ufafanuzi ukitolewa katika tanbihi.
