  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: sw
  text: Basi Yuda na ndugu zake wakaingia nyumbani kwa Yosefu. Yosefu alikuwa bado huko, nao wakaanguka chini mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajitupa kifudifudi mbele yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakaingia
  rationale: Kitenzi בוא pamoja na kiishio cha mwelekeo katika בֵּיתָה kinaonyesha kufika na kuingia ndani ya nyumba; “wakaingia” ni simulizi la kawaida na wazi kwa Kiswahili.
- source_word: יְהוּדָה וְאֶחָיו
  choice: Yuda na ndugu zake
  rationale: Hutaja Yuda wazi kama mhusika anayeongoza huku ikihifadhi uhusiano wa kifamilia wa אֶחָיו.
- source_word: בֵּיתָה יוֹסֵף
  choice: nyumbani kwa Yosefu
  rationale: Kiishio cha mwelekeo -ָה kinaonyesha mwendo kuelekea au kuingia nyumbani; usemi huu ni wa asili katika Kiswahili na, pamoja na “wakaingia,” unaonyesha kuingia ndani.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: Yosefu alikuwa bado huko
  rationale: עֹודֶנּוּ huonyesha hali inayoendelea, yaani “bado.” Jina “Yosefu” limerudiwa badala ya kiwakilishi ili kuondoa utata wa marejeo katika Kiswahili.
- source_word: וַיִּפְּלוּ לְפָנָיו אָרְצָה
  choice: wakaanguka chini mbele yake
  rationale: Tafsiri hii huhifadhi maana ya msingi ya נפל, mwelekeo wa אָרְצָה kuelekea chini, na nahau לְפָנָיו kama “mbele yake,” bila kulazimisha kwa maneno maana ya kujisalimisha ambayo muktadha unaidokeza.
