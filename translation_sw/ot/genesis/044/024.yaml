translation:
  language: sw
  text: Tulipopanda kwenda kwa mtumishi wako, baba yangu[a], tulimweleza maneno ya bwana wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baba yangu, mtumishi wako.” Mpangilio wa Kiebrania ni “kwa mtumishi wako, baba yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Tulipofika
  rationale: Katika simulizi, fomula hii inaunganisha tukio linalofuata na yaliyotangulia. Kiswahili cha wakati kwa kiambishi -po kinaonyesha vizuri maana ya 'na ilipokuwa kwamba/tulipo' bila kuwa kizito.
- source_word: עָלִינוּ
  choice: tulifika
  rationale: Kitenzi עלה kimsingi ni 'kupanda/kwenda juu,' hapa kikieleza safari kutoka Misri kwenda Kanaani. 'Tulifika' ni cha kawaida zaidi katika Kiswahili katika muktadha huu, ingawa hakionyeshi wazi mwelekeo wa kupanda.
- source_word: אֶל
  choice: kwa
  rationale: Kwa mtu anayelengwa na mwendo, 'kwa' ni ulinganifu wa kawaida na wa asili wa אֶל katika Kiswahili.
- source_word: עַבְדְּךָ אָבִי
  choice: mtumishi wako, baba yangu
  rationale: Mpangilio huu unafuata Kiebrania na kudumisha lugha ya Yuda ya kujishusha mbele ya Yosefu. Koma inaonyesha kwamba 'baba yangu' anamfafanua huyo mtumishi.
- source_word: וַנַּגֶּד
  choice: tulimweleza
  rationale: Hifili ya נגד ina maana ya kufanya jambo lijulikane, kusema, au kutoa habari. 'Tulimweleza' ni ya asili na inafaa kwa kumfikishia mtu maneno yaliyosemwa.
- source_word: לוֹ
  choice: -m-
  rationale: Kiwakilishi cha yambwa katika 'tulimweleza' kinawakilisha 'yeye' wa Kiebrania kwa muundo wa kawaida wa Kiswahili.
- source_word: אֵת דִּבְרֵי
  choice: maneno ya
  rationale: '''Maneno ya'' huhifadhi kwa karibu דִּבְרֵי badala ya kuifasiri kwa upana kama ''ujumbe'' au ''yale aliyosema.'''
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa ni cheo cha heshima kwa mtawala wa kibinadamu, si jina la Mungu. 'Bwana wangu' huhifadhi sauti ya heshima na unyenyekevu.
