base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: sw
  text: Ukawaambia watumishi wako, ‘Ikiwa ndugu yenu mdogo zaidi hatashuka pamoja nanyi, hamtaniona tena[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya kimsemo, “hamtafika mbele yangu tena.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ukawaambia
  rationale: Wayyiqtol ya אמר inaendeleza mfululizo wa simulizi. Kiswahili hutumia kiambishi cha mfululizo -ka- kwa kawaida; pia kitenzi ‘ambia’ kinaendana na walengwa waliotajwa.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazingira haya ya mazungumzo ya heshima mbele ya mtawala, ‘watumishi’ linaonyesha namna Yuda na ndugu zake wanavyojirejelea bila kusisitiza hali ya utumwa ambayo si hoja kuu ya kishazi hiki.
- source_word: אִם לֹא
  choice: Ikiwa ... hata-
  rationale: Muundo wa sharti hasi umehifadhiwa wazi badala ya kufupishwa kuwa ‘isipokuwa,’ hivyo ukaribu na muundo wa Kiebrania unabaki.
- source_word: יֵרֵד
  choice: hatashuka
  rationale: ירד ina maana ya kushuka; safari kutoka Kanaani kwenda Misri kwa kawaida huelezwa hivyo. ‘Atashuka’ ni ya asili katika Kiswahili na huhifadhi mwelekeo wa chanzo.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ndugu yenu mdogo zaidi
  rationale: הַקָּטֹן hapa humtambulisha aliye mdogo kuliko ndugu wote, si ndugu yeyote aliye mdogo tu. ‘Mdogo zaidi’ linaweka maana hiyo wazi.
- source_word: אִתְּכֶם
  choice: pamoja nanyi
  rationale: Hii ni tafsiri ya kawaida na yenye heshima ya kiashiria cha uandamani, ikipatana na wingi wa walengwa.
- source_word: לֹא תֹסִפוּן
  choice: hamta- ... tena
  rationale: יסף pamoja na kitenzi-jina hueleza kutorudia tendo. Kiswahili cha kawaida huwasilisha jambo hilo kwa kitenzi hasi pamoja na ‘tena.’
- source_word: לִרְאוֹת פָּנָי
  choice: hamtaniona tena
  rationale: Ingawa maneno halisi ni ‘kuona uso wangu,’ huu ni msemo wa kufika mbele ya mtu. ‘Hamtaniona tena’ ni wa asili na bado unadumisha wazo la kutokutana naye; maana ya kimsemo iliyo kamili zaidi imewekwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. ‘Nanyi’ na ‘yenu’ huhifadhi wingi wa nafsi ya pili. Tafsiri inatanguliza usemi wa asili wa Kiswahili huku tanbihi ikihifadhi wazi maana ya msemo wa Kiebrania ‘kuona uso wangu.’
