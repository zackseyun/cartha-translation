  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: sw
  text: Na sasa, nitakapofika kwa mtumishi wako, baba yangu, na huyo kijana hayuko pamoja nasi—maisha ya baba yangu yakiwa yamefungamana na maisha ya huyo kijana[a]—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno yenyewe, “nafsi yake imefungamana na nafsi yake.” Kiebrania hutumia נֶפֶשׁ (nefesh, “nafsi/maisha/mtu mwenyewe”) kwa wote wawili; kiwakilishi cha pili kinamrejelea huyo kijana, Benyamini.
    reason: lexical_alternative
  - marker: b
    text: Au, “na huyo kijana hayuko pamoja nasi, huku maisha ya baba yangu yamefungamana na maisha ya huyo kijana.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huendeleza hoja ya Yuda na kuanzisha hatua inayofuata; “basi sasa” ni ya kawaida katika Kiswahili na huhifadhi nguvu ya kiunganishi וְ.
- source_word: כְּבֹאִי
  choice: nitakapofika
  rationale: 'Kihusishi כְּ pamoja na kitenzi-jina na kiambishi cha nafsi ya kwanza kina maana ya wakati unaotarajiwa: “nitakapofika.”'
- source_word: אֶל־עַבְדְּךָ אָבִי
  choice: kwa mtumishi wako, baba yangu
  rationale: Huhifadhi lugha ya heshima ya Yuda kwa Yosefu na uhusiano wa ufafanuzi kati ya “mtumishi wako” na “baba yangu.”
- source_word: הַנַּעַר
  choice: huyo kijana
  rationale: נַעַר hapa humtaja Benyamini kama kijana katika muktadha wa kifamilia; “kijana” ni ya asili na haimdokezi lazima kuwa mtoto mdogo.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: hayuko pamoja nasi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa Kiebrania unaokanusha kuwapo pamoja nao.
- source_word: וְנַפְשׁוֹ
  choice: maisha ya baba yangu
  rationale: נֶפֶשׁ katika muktadha huu humaanisha maisha au nafsi ya baba. Kutaja “baba yangu” huondoa utata wa kiwakilishi katika Kiswahili bila kubadili mhusika anayerejelewa.
- source_word: קְשׁוּרָה
  choice: yakiwa yamefungamana
  rationale: Huhifadhi hali ya kishirikishi cha kutendwa na kuonyesha uhusiano wenye nguvu bila kulazimisha maana ya kisababishi.
- source_word: בְנַפְשׁוֹ
  choice: na maisha ya huyo kijana
  rationale: Kiwakilishi cha mwisho kinamrejelea Benyamini kulingana na muktadha; kutaja “huyo kijana” wazi huzuia mkanganyiko katika Kiswahili.
