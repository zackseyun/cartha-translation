  to: Sasa basi, tafadhali, mwache mtumishi wako abaki badala ya kijana kama mtumwa wa bwana wangu; naye kijana apande pamoja na ndugu zake.[a]
  rationale: The revision improves modern Swahili flow and explicitly marks Judah's plea for permission, while preserving the Hebrew distinctions between deferential “mtumishi wako” and the offered status “mtumwa,” as well as the directional verb “apande.” The footnote remains correctly anchored to “apande.”
