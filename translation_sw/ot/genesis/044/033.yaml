  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: sw
  text: Sasa basi, tafadhali, mwache mtumishi wako abaki badala ya kijana kama mtumwa wa bwana wangu; naye kijana apande pamoja na ndugu zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linasema “apande,” usemi wa kawaida kuhusu kusafiri kutoka Misri kuelekea Kanaani.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaendeleza hoja na kuanzisha ombi kuu la Yuda kwa Kiswahili cha kawaida, huku ikihifadhi nguvu ya kiunganishi na ya wakati.
- source_word: יֵשֶׁב נָא
  choice: tafadhali ... abaki
  rationale: נָא pamoja na umbo la ombi la יֵשׁב huonyesha kusihi kwa heshima; “abaki” linafaa kwa muktadha wa Yuda kubaki nyuma.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hapa Yuda anajitaja kwa unyenyekevu mbele ya Yosefu; “mtumishi wako” huhifadhi lugha hiyo ya heshima bila kudai kwamba tayari ni mtumwa.
- source_word: תַּחַת הַנַּעַר
  choice: badala ya kijana
  rationale: תַּחַת lina maana ya kuchukua nafasi ya mwingine katika muktadha huu, si kuwa chini yake mahali.
- source_word: הַנַּעַר
  choice: kijana
  rationale: “Kijana” ni neno la kawaida na lenye hadhi linaloweza kueleza mtazamo wa Yuda kwa Benyamini bila kumfanya lazima awe mtoto mdogo.
- source_word: עֶבֶד לַאדֹנִי
  choice: awe mtumwa wa bwana wangu
  rationale: Tofauti na kujitaja kwa heshima kama “mtumishi wako,” hapa Yuda anajitolea kwa hali halisi ya utumwa katika nyumba ya Yosefu; “bwana wangu” ni cheo cha heshima kwa mtawala wa kibinadamu.
- source_word: וְהַנַּעַר יַעַל
  choice: naye kijana apande
  rationale: “Apande” huhifadhi kitenzi עָלָה na nguvu yake ya ombi; katika simulizi hii ni usemi wa safari kutoka Misri kuelekea Kanaani.
- source_word: עִם אֶחָיו
  choice: pamoja na ndugu zake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa kifamilia unaotajwa.
theological_decisions: []
