review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys Judah's plea, the substitution for the young man, the actual slave status offered to Joseph, and the upward journey with his brothers. The revision makes the permissive force of יֵשֶׁב נָא explicit in idiomatic Swahili.
  naturalness: “Tafadhali mtumishi wako abaki” is understandable but somewhat compressed in modern Standard East African Swahili. “Mwache mtumishi wako abaki” naturally expresses the requested permission. “Sasa basi” is also a smoother discourse transition than “Basi sasa.”
  terminology: “Mtumishi wako” appropriately preserves Judah's deferential self-reference, while “mtumwa” correctly renders the concrete bonded status he offers. “Bwana wangu,” “kijana,” and “apande” are suitable and retain the source register and sense.
  issues:
  - severity: low
    issue: The request construction is slightly elliptical.
    rationale: Adding “mwache” makes the polite permissive request expressed by Hebrew יֵשֶׁב נָא explicit and natural without adding substantive meaning.
  - severity: low
    issue: The opening transition is less idiomatic in its current word order.
    rationale: “Sasa basi” is the more natural standard Swahili ordering for the climactic transition וְעַתָּה.
