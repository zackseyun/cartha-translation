  text: וַֽ/יִּקְרְע֖וּ שִׂמְלֹתָ֑/ם וַֽ/יַּעֲמֹס֙ אִ֣ישׁ עַל חֲמֹר֔/וֹ וַ/יָּשֻׁ֖בוּ הָ/עִֽירָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: sw
  text: Ndipo wakararua mavazi yao[a], na kila mmoja akampakia punda wake, kisha wakarudi mjini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguo zao.” Neno la Kiebrania linaweza kumaanisha mavazi kwa ujumla, hasa mavazi ya nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: wakararua
  rationale: Kitenzi קרע kinaonyesha tendo halisi la kurarua, hapa likiwa ishara ya huzuni, mshtuko au dhiki.
- source_word: שִׂמְלֹתָם
  choice: mavazi yao
  rationale: שִׂמְלָה ni neno la jumla kwa nguo au vazi, mara nyingi vazi la nje; “mavazi” ni la kawaida na lenye hadhi katika simulizi.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: kila mmoja akampakia punda wake
  rationale: 'Ingawa kitenzi cha Kiebrania kiko katika umoja, אִישׁ ina maana ya ugawaji: kila mtu katika kundi alifanya hivyo kwa punda wake.'
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Katika muktadha huu neno hilo linatumika kiugawaji. “Kila mmoja” ni Kiswahili cha asili na hakipotezi rejeleo la wanaume waliotajwa katika simulizi.
- source_word: חֲמֹרוֹ
  choice: punda wake
  rationale: חֲמוֹר ni neno la kawaida kwa punda, na kiambishi cha umilikaji kinaonyesha punda wa kila mmoja.
- source_word: וַיָּשֻׁבוּ
  choice: wakarudi
  rationale: שורש שׁוב humaanisha kurudi; “wakarudi” hudumisha mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: הָעִירָה
  choice: mjini
  rationale: He ya uelekeo inaonyesha mwendo kuelekea mji. “Mjini” ni njia ya kawaida ya Kiswahili ya kueleza kurudi katika mji huo.
