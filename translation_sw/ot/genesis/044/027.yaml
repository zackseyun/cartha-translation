lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akatuambia
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; “Ndipo” ni ya asili katika simulizi la Kiswahili, na kitenzi chenye kiambishi -tu- kinawasilisha אֵלֵינוּ, “kwetu/sisi.”
- source_word: עַבְדְּךָ אָבִי
  choice: mtumishi wako, baba yangu
  rationale: Inahifadhi lugha ya heshima ya Yuda kwa Yosefu pamoja na utambulisho wa mhusika kuwa baba yake.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: Ninyi mnajua
  rationale: Kiwakilishi huru “Ninyi” kinahifadhi msisitizo wa kiwakilishi cha Kiebrania, huku wakati wa sasa ukionyesha maarifa ambayo bado yana umuhimu katika usemi huu.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha maudhui ya jambo linalojulikana.
- source_word: שְׁנַיִם
  choice: wawili
  rationale: Kiebrania kinasema “wawili” bila kutaja nomino. Kiswahili kinaweza kuhifadhi ufupi huo kwa ngeli ya watu, huku muktadha ukionyesha kuwa wanaozungumziwa ni wana wawili.
- source_word: יָלְדָה לִּי
  choice: alinizalia
  rationale: Ni usemi wa kawaida na mfupi wa Kiswahili unaowasilisha tendo la kuzaa pamoja na kiambishi cha mnufaika -ni-, yaani “kwa ajili yangu/kwangu.”
- source_word: אִשְׁתִּי
  choice: mke wangu
  rationale: Katika muktadha huu אִשָּׁה yenye kiambishi cha nafsi ya kwanza ina maana wazi ya “mke wangu.”
