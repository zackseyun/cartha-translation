  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: sw
  text: Lakini akasema, “Hasha, nisifanye jambo hili! Mtu ambaye kikombe kilipatikana mkononi mwake[a], ndiye atakayekuwa mtumwa wangu[b]. Lakini ninyi, pandeni kwa amani kwa baba yenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu ambaye kikombe kilipatikana kwake.” Kiebrania kinasema kihalisi, “ambaye kikombe kilipatikana mkononi mwake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mtumishi wangu.” Neno la Kiebrania עָבֶד linaweza kumaanisha mtumishi au mtumwa; hapa muktadha unaonyesha kifungo cha adhabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Hasha kwangu
  rationale: Nahau hii ya Kiswahili inaonyesha kukataa kwa nguvu na kuchukizwa na tendo linalotajwa, kama ilivyo katika Kiebrania.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: kufanya jambo hili
  rationale: Hutoa kwa uwazi tendo ambalo msemaji anakataa kulifanya.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: Mtu ambaye kikombe kilipatikana mkononi mwake
  rationale: Inahifadhi taswira halisi ya Kiebrania, ‘mkononi mwake,’ huku ikieleweka kwa Kiswahili cha kawaida kama kuwa nacho.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: ndiye atakayekuwa mtumwa wangu
  rationale: Katika muktadha huu ni kifungo cha adhabu, hivyo ‘mtumwa’ linaonyesha vizuri zaidi hali ya kulazimishwa, ingawa neno la Kiebrania linaweza pia kumaanisha mtumishi.
- source_word: וְאַתֶּם עֲלוּ
  choice: Lakini ninyi pandeni
  rationale: ‘Lakini’ linaonyesha tofauti kati ya mtu atakayezuiliwa na wale wanaoruhusiwa kuondoka; ‘pandeni’ linahifadhi kitenzi cha mwelekeo wa juu katika Kiebrania.
- source_word: לְשָׁלוֹם אֶל אֲבִיכֶם
  choice: kwa amani kwenda kwa baba yenu
  rationale: ‘Kwa amani’ hudumisha nahau ya kuondoka salama bila kuzuiwa, na ‘kwenda kwa baba yenu’ huonyesha mahali wanakoelekezwa.
