base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: sw
  text: Je, hiki si kikombe ambacho bwana wangu hutumia kunywea, na ambacho yeye hakika hutumia kuagua? Mmefanya uovu kwa kufanya hivi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwa hicho yeye hakika huagua.” Kiebrania hutumia infinitivu kamili pamoja na kitenzi kilichonyambuliwa ili kutia mkazo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mmefanya uovu katika jambo mlilofanya.”
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: Je, hiki si kile
  rationale: Hutunza swali la balagha linalotarajia jibu la kukubali, huku kiwakilishi cha ngeli ya kikombe kikiwa cha asili katika Kiswahili.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: ambacho bwana wangu hunywea
  rationale: Kitenzi 'hunywea' kinaonyesha kwa kawaida kunywa kutoka katika kikombe; 'bwana wangu' ni cheo cha kijamii cha msimamizi kwa Yosefu bila kulifanya jina la kimungu.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: na ambacho yeye hutumia kwa uaguzi
  rationale: Neno 'yeye' linatunza mkazo wa kiwakilishi, 'uaguzi' linawakilisha נחש, na muundo unaonyesha kikombe kuwa chombo kinachohusishwa na tendo hilo.
- source_word: הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  choice: Mmefanya uovu kwa kufanya hivi
  rationale: Hutunza uzito wa kimaadili wa רעע na kueleza kwa Kiswahili cha kawaida kwamba uovu huo uko katika kitendo walichofanya.
theological_decisions:
- issue: Iwapo Yosefu aonyeshwe kuwa kweli alifanya uaguzi au maneno yaelezwe tu kuwa sehemu ya kujificha au kuwajaribu ndugu zake
  choice: Kauli ya msimamizi imetafsiriwa moja kwa moja kuwa bwana wake hutumia kikombe kwa uaguzi.
  alternative: Kusema tu kwamba anaweza kubashiri kwa kikombe hicho, au kupunguza kauli ili ionekane kuwa sifa inayodhaniwa na watu.
  rationale: Kiebrania kinaweka dai hili wazi ndani ya hotuba ya msimamizi. Tafsiri haipaswi kuamua kimya kimya kama dai hilo ni ukweli wa kihistoria, mbinu ya jaribio, au sehemu ya sura ambayo Yosefu anajionyesha kuwa nayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Hiki' na 'ambacho' vinafuata ngeli ya 'kikombe' inayotokana na muktadha. Alama zote za tanbihi zimewekwa katika matini kuu.
