lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: Akapekua mizigo yao
  rationale: Kitenzi חפשׂ kinaeleza upekuzi wa mizigo ya ndugu hao. Neno “mizigo yao” limewekwa wazi kutokana na muktadha ili Kiswahili kiwe cha kawaida na kisicholeta dhana kwamba aliwatafuta watu wenyewe.
- source_word: בַּגָּדוֹל הֵחֵל
  choice: akaanzia kwa mkubwa
  rationale: Katika muktadha wa ndugu waliopangwa kwa umri, גָּדוֹל humaanisha aliye mkubwa kwa umri; muundo huu pia unaonyesha mwanzo wa upekuzi.
- source_word: וּבַקָּטֹן כִּלָּה
  choice: na kumalizia kwa mdogo
  rationale: קָטֹן hapa ni ndugu aliye mdogo kwa umri, na כִּלָּה huonyesha mwisho wa mfuatano wa upekuzi.
- source_word: וַיִּמָּצֵא
  choice: kikapatikana
  rationale: Kauli ya kutendwa katika Kiebrania imehifadhiwa badala ya kusema moja kwa moja kwamba mtumishi ndiye aliyekipata.
- source_word: הַגָּבִיעַ
  choice: Kikombe
  rationale: גָּבִיעַ ni chombo cha kunywea kinachoweza kuitwa kikombe; “kikombe” ni neno la kawaida na linaloeleweka kwa urahisi. Uwezekano wa maana mahususi zaidi umeonyeshwa katika tanbihi.
- source_word: בְּאַמְתַּחַת
  choice: katika gunia
  rationale: אַמְתַּחַת ni gunia au mfuko wa kubebea nafaka na bidhaa; “gunia” linafaa katika muktadha huu wa safari na nafaka.
- source_word: בִּנְיָמִן
  choice: Benyamini
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
