  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: sw
  text: Kisha ukawaambia watumishi wako, ‘Mshusheni kwangu, ili nimtazame[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili niweke jicho langu juu yake.” Nahau ya Kiebrania inaweza kumaanisha kumwona, kumchunguza, au kumpa uangalifu wa pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Kisha ukawaambia
  rationale: Kauli ya wayyiqtol inaendeleza mfululizo wa simulizi; “Kisha” huonyesha ufuatano kwa Kiswahili cha kawaida, na wingi wa yambwa unalingana na “watumishi wako.”
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazingira haya ya mazungumzo mbele ya mtawala, neno עבד linaonyesha uhusiano wa unyenyekevu na mamlaka; “watumishi” linafaa zaidi kuliko “watumwa.”
- source_word: הוֹרִדֻהוּ
  choice: Mleteni ashuke
  rationale: Hifili ya ירד ina maana ya kusababisha ashuke. Tafsiri hii huhifadhi wazo la kumleta pamoja na mwelekeo wa kushuka kwenda Misri.
- source_word: אֵלָי
  choice: kwangu
  rationale: Kirai hiki huonyesha kuletwa moja kwa moja kwa Yosefu; “kwangu” ni tafsiri ya kawaida na sahihi.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: ili nimtazame
  rationale: Nahau ya Kiebrania, kihalisi “niweke jicho langu juu yake,” inaweza kumaanisha kumwona, kumchunguza, au kumpa uangalifu wa pekee. “Nimtazame” ni ya asili kwa Kiswahili bila kuamua zaidi ya muktadha.
