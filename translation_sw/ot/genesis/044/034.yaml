base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: sw
  text: Kwa maana nitawezaje kwenda kwa baba yangu ikiwa kijana hayuko pamoja nami? Nisije nikaona maafa yatakayompata baba yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: kurudi
  rationale: Kitenzi hiki kimsingi ni ‘kupanda/kwenda juu,’ lakini katika muktadha wa Yuda kuondoka Misri na kwenda aliko baba yake, Kiswahili cha kawaida hueleza tendo hilo kwa ‘kurudi.’
- source_word: הַנַּעַר
  choice: kijana
  rationale: Neno linaweza kumaanisha mvulana au kijana; ‘kijana’ linafaa kwa Benyamini bila kumfanya mtoto mdogo.
- source_word: בָרָע
  choice: maafa
  rationale: רָע hapa ni mabaya au msiba utakaompata Yakobo; ‘maafa’ huwasilisha uzito wa jambo hilo kwa lugha ya asili.
- source_word: יִמְצָא אֶת אָבִי
  choice: yatakayompata baba yangu
  rationale: Nahau ya Kiebrania ‘yatampata/yatamfikia’ inatolewa kwa Kiswahili cha kawaida kama ‘yatakayompata.’
theological_decisions:
- issue: Nguvu ya kishazi פֶּן אֶרְאֶה
  choice: Siwezi kustahimili kuona
  alternative: nisije nikaona
  rationale: פֶּן kwa kawaida huonyesha jambo linalohofiwa au linaloepukwa. Katika ombi hili Yuda anasema hawezi kukabili kuona msiba wa baba yake; tafsiri hii huhifadhi nguvu ya hisia bila kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. ‘Kurudi’ ni cha asili zaidi katika muktadha kuliko tafsiri halisi ‘kupanda,’ huku muundo wa maswali na uzito wa ombi la Yuda vikihifadhiwa.
