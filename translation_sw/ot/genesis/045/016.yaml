base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: sw
  text: 'Habari hiyo ikasikika katika nyumba ya Farao: “Ndugu zake Yosefu wamekuja.” Jambo hilo likawa jema machoni pa Farao na machoni pa watumishi wake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: Habari hiyo ikasikika
  rationale: Ingawa הַקֹּל kwa msingi ni ‘sauti’, hapa kishazi kinachofuata kinaonyesha maana ya habari iliyoenea. ‘Ikasikika’ huhifadhi hali ya kutendwa ya נִשְׁמַע kwa Kiswahili cha kawaida.
- source_word: בֵּית פַּרְעֹה
  choice: katika nyumba ya Farao
  rationale: Hufuata moja kwa moja muundo wa Kiebrania bila kuibana maana kuwa ‘ikulu’ au ‘baraza la kifalme’.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika Kiswahili, alama ya nukta mbili huingiza kwa kawaida yaliyomo katika habari; kutafsiri kiwakilishi hiki kwa ‘ikisema’ kungekuwa na uzito usio wa kawaida.
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: Ndugu zake Yosefu wamekuja
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo ya sasa, sawa na muktadha wa ndugu kufika na kuwapo.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Jambo hilo likawa jema machoni pa
  rationale: Huhifadhi tamathali ya Kiebrania ya kuwa ‘jema machoni pa’ huku ‘jambo hilo’ likiweka wazi kinachotajwa na kiima kisicho dhahiri.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: ‘Watumishi’ huhifadhi upana wa עֲבָדִים, ambayo katika mazingira ya kifalme inaweza kuwahusu watumishi au maafisa bila kubainisha cheo kupita chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘machoni pa’ umehifadhiwa kwa makusudi ili kuonyesha ladha ya nahau ya Kiebrania, bila kufanya sentensi iwe ngumu.
