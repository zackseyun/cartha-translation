base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: sw
  text: Wana wa Israeli wakafanya hivyo. Yosefu akawapa mikokoteni kwa amri ya Farao[a], akawapa pia masurufu ya safari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “kwa kinywa cha Farao,” nahau yenye maana ya “kwa amri ya Farao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: wakafanya hivyo
  rationale: Ni usemi wa kawaida wa Kiebrania unaoonyesha kwamba walitekeleza yaliyokuwa yamesemwa; tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Hapa neno hilo linawahusu wana wa kiume wa Yakobo, anayeitwa Israeli; hivyo maana mahususi ya muktadha inadumishwa.
- source_word: עֲגָלֹות
  choice: mikokoteni
  rationale: Neno hilo linamaanisha vyombo vya usafiri vyenye magurudumu vya kubebea watu au mizigo. “Mikokoteni” huepuka kueleweka kama magari ya kisasa.
- source_word: עַל פִּי פַרְעֹה
  choice: kwa amri ya Farao
  rationale: Kiebrania chake ni nahau inayomaanisha kutenda kwa kufuata agizo la Farao; tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida.
- source_word: צֵדָה לַדָּרֶךְ
  choice: masurufu ya safari
  rationale: צֵדָה ni mahitaji yanayotolewa kwa ajili ya kusafiri, hasa chakula na vifaa vingine; “masurufu ya safari” huwasilisha maana hiyo kwa ufupi na kwa ufasaha.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mikokoteni” limetumiwa badala ya “magari” ili kuepuka dhana ya magari ya kisasa, na “masurufu” linadumisha wazo pana la mahitaji ya safari.
