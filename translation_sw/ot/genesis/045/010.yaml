base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: sw
  text: Utaishi katika nchi ya Gosheni, nawe utakuwa karibu nami—wewe, wanao, wana wa wanao, makundi yako ya kondoo na mbuzi, makundi yako ya ng’ombe, na vyote ulivyo navyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Utaishi
  rationale: Kitenzi ישׁב hapa kinaonyesha kukaa kwa makazi katika eneo fulani; “utaishi” ni Kiswahili cha sasa na cha kawaida.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: katika nchi ya Gosheni
  rationale: “Nchi ya Gosheni” hudumisha muundo na umahususi wa kijiografia wa Kiebrania.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: nawe utakuwa karibu nami
  rationale: Huwasilisha moja kwa moja hali ya ukaribu aliyoahidi Yosefu.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi huru kina msisitizo; kistari kirefu hutenganisha orodha na kuhifadhi msisitizo huo kwa Kiswahili cha asili.
- source_word: וּבָנֶיךָ
  choice: wanao
  rationale: בנים hapa inarejelea wana wa kiume, hasa kwa kuwa kizazi kinachofuata kimetajwa kando.
- source_word: וּבְנֵי בָנֶיךָ
  choice: wajukuu zako
  rationale: Ni sawa ya kawaida ya Kiswahili kwa maana halisi “wana wa wanao”; katika muktadha huu inadumisha kurejelewa kwa kizazi cha kiume bila muundo mzito.
- source_word: וְצֹאנְךָ
  choice: makundi yako ya kondoo na mbuzi
  rationale: צֹאן ni mifugo midogo kwa ujumla, hasa kondoo na mbuzi; kutaja wanyama hao huweka maana wazi kwa msomaji wa sasa.
- source_word: וּבְקָרְךָ
  choice: makundi yako ya ng’ombe
  rationale: בקר hurejelea ng’ombe au mifugo mikubwa, ikitofautishwa na צֹאן.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: na vyote ulivyo navyo
  rationale: Ni usemi mpana, wa kawaida na unaoeleweka unaojumuisha mali zote za Yakobo.
