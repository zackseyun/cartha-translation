  text: וַ/יֹּ֨אמֶר יוֹסֵ֧ף אֶל אֶחָ֛י/ו גְּשׁוּ נָ֥א אֵלַ֖/י וַ/יִּגָּ֑שׁוּ וַ/יֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִי/כֶ֔ם אֲשֶׁר מְכַרְתֶּ֥ם אֹתִ֖/י מִצְרָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: sw
  text: Kisha Yosefu akawaambia ndugu zake, “Tafadhali, nikaribieni.” Nao wakamkaribia. Akasema, “Mimi ni Yosefu, ndugu yenu, ambaye mlimuuza kwenda Misri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia / Akasema
  rationale: Waw-consecutive inaendeleza simulizi. ‘Kisha’ huonyesha mfuatano kwa Kiswahili cha kawaida; katika kauli ya pili, ‘akasema’ inaendeleza simulizi bila kurudia kiunganishi kizito.
- source_word: אֶל־אֶחָיו
  choice: ndugu zake
  rationale: אָח katika wingi pamoja na kiambishi cha nafsi ya tatu umoja wa kiume humaanisha moja kwa moja ‘ndugu zake.’
- source_word: גְּשׁוּ נָא אֵלַי
  choice: Tafadhali, nikaribieni
  rationale: נגשׁ ni kukaribia, na נָא huifanya kauli iwe ombi la upole. ‘Nikaribieni’ ni usemi wa asili unaohifadhi maana ya kuja karibu na msemaji.
- source_word: וַיִּגָּשׁוּ
  choice: Nao wakamkaribia
  rationale: Mzizi uleule wa ‘karibia’ umetumiwa ili kuhifadhi marudio ya Kiebrania na jibu la moja kwa moja kwa ombi la Yosefu.
- source_word: אֲנִי יוֹסֵף
  choice: Mimi ni Yosefu
  rationale: Kishazi kisicho na kitenzi katika Kiebrania kinahitaji ‘ni’ kwa Kiswahili; ‘Mimi’ huhifadhi msisitizo wa kiwakilishi אֲנִי.
- source_word: אֲחִיכֶם
  choice: ndugu yenu
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya pili wingi inamtambulisha Yosefu kuwa ndugu yao.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: ambaye mlimuuza
  rationale: Kishazi hiki ni cha moja kwa moja na cha lawama. ‘Ambaye’ humrejelea mtu kwa kawaida, na ‘mlimuuza’ huhifadhi tendo na yambwa wa nafsi ya kwanza.
- source_word: מִצְרָיְמָה
  choice: kwenda Misri
  rationale: He ya mwelekeo huonyesha mwendo kuelekea Misri. ‘Kwenda Misri’ ni ya asili katika Kiswahili na hudumisha wazo la mahali alikopelekwa kwa kuuzwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kueleweka, huku marudio ya mzizi ‘karibia’ na msisitizo wa ‘Mimi’ vikihifadhiwa.
