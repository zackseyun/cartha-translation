  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: sw
  text: Aliwapa kila mmoja wao seti moja ya nguo za kubadilisha, lakini alimpa Benyamini vipande mia tatu vya fedha[a] na seti tano za nguo za kubadilisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “fedha mia tatu”; kipimo hususa cha fedha hakikutajwa, kwa hiyo imetafsiriwa “vipande mia tatu vya fedha” badala ya neno maalumu kama “shekeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: Kila mmoja wao
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida mgawanyo unaosisitizwa na ‘kwao wote ... kwa kila mtu,’ bila urudiaji usio wa lazima.
- source_word: נָתַן
  choice: alimpa
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya kitenzi katika muktadha wa kutoa zawadi.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: nguo za kubadilisha
  rationale: Kirai hiki kinaonyesha mavazi mengine ya kuvaa badala ya yaliyovaliwa; ‘nguo za kubadilisha’ ni wazi na ya kawaida katika Kiswahili.
- source_word: וּלְבִנְיָמִן
  choice: lakini Benyamini
  rationale: Ingawa kiunganishi kinaweza kuwa ‘na,’ hapa kinaonyesha tofauti kati ya zawadi za wengine na zawadi kubwa zaidi ya Benyamini.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: vipande mia tatu vya fedha
  rationale: Kiebrania hakitaji kipimo maalumu cha fedha; ‘vipande vya fedha’ huepuka kuongeza ‘shekeli’ ambayo haipo katika maandishi.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: na nguo tano za kubadilisha
  rationale: Inadumisha istilahi ileile ya mavazi huku ikihifadhi idadi ya tano.
