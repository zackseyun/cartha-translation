base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: sw
  text: 'Na kwa baba yake akatuma hivi: punda kumi waliobeba baadhi ya vitu bora vya Misri[a], na punda-jike kumi waliobeba nafaka, mkate, na chakula cha safari kwa ajili ya baba yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka vitu vizuri vya Misri” / “kutoka utajiri wa Misri.”
    reason: Neno טוּב linaweza kumaanisha vitu vizuri, wema, au wingi wa mazao na mali ya nchi; kiambishi מִן kinaweza kutafsiriwa “baadhi ya” au “kutoka.”
lexical_decisions:
- source_word: כְּזֹאת
  choice: hivi
  rationale: Ni usemi wa kurejelea unaotanguliza orodha ya vitu vilivyotumwa; “hivi” ni ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: חֲמֹרִים
  choice: punda
  rationale: Neno la kawaida la Kiswahili kwa wanyama hawa; halibainishi jinsia kama neno linalofuata.
- source_word: נֹשְׂאִים
  choice: waliobeba
  rationale: Huwakilisha moja kwa moja hali ya wanyama kusafirisha vitu bila kuongeza wazo la jinsi walivyopakiwa.
- source_word: מִטּוּב מִצְרַיִם
  choice: baadhi ya vitu bora vya Misri
  rationale: “Baadhi ya” huhifadhi maana ya kigawanyo ya מִן, na “vitu bora” huepuka kubainisha isivyofaa kwamba vilikuwa mazao pekee.
- source_word: אֲתֹנֹת
  choice: punda-jike
  rationale: Huhifadhi ubainisho wa Kiebrania kwamba kundi la pili lilikuwa la punda wa kike.
- source_word: בָּר
  choice: nafaka
  rationale: Ni neno la jumla linalofaa kwa nafaka bila kuidhania kuwa ngano au mahindi hasa.
- source_word: לֶחֶם
  choice: mikate
  rationale: Huhifadhi maana ya kawaida ya chakula hiki na kuitofautisha na vyakula vingine vya safari.
- source_word: מָזוֹן
  choice: vyakula vya safari
  rationale: Katika muktadha huu ni mahitaji ya chakula yaliyokusudiwa kutumiwa safarini; tafsiri hii ni ya kawaida kuliko “masurufu” kwa wasomaji wengi.
- source_word: לַדָּרֶךְ
  choice: vya safari
  rationale: Hueleza kwa Kiswahili cha kawaida kusudi la vyakula hivyo, yaani kumtosha baba yake njiani.
