translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza mtiririko wa simulizi kwa “Na … akatuma,” huku orodha ikibaki wazi. “Punda-jike” hutumika ili kuhifadhi utofautishaji wa jinsia uliopo katika Kiebrania.
