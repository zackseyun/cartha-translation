base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: sw
  text: Basi sasa, si ninyi mlionituma huku, bali ni Mungu; naye amenifanya kuwa kama baba kwa Farao[a], na bwana wa nyumba yake yote, na mtawala wa nchi yote ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baba kwa Farao”; yaani, mlinzi, mshauri mkuu, au mfadhili wake.
    reason: Huonyesha taswira ya kimajazi ya אָב na mbadala wa usemi bila kuibana katika jukumu moja tu.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huunganisha kauli hii na maneno yaliyotangulia na pia kuonyesha hitimisho la Yosefu kwa Kiswahili cha kawaida.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: si ninyi mlionituma huku
  rationale: Muundo huu unahifadhi msisitizo wa kiwakilishi אַתֶּם na kutofautisha tendo la ndugu zake na kusudi la Mungu; הֵנָּה limetafsiriwa “huku” kwa kurejelea Misri.
- source_word: כִּי הָאֱלֹהִים
  choice: bali ni Mungu
  rationale: 'Baada ya ukanushaji, כִּי lina nguvu ya utofautishaji: si ninyi, bali Mungu.'
- source_word: וַיְשִׂימֵנִי
  choice: naye amenifanya kuwa
  rationale: Wakati timilifu unaonyesha tendo la Mungu ambalo matokeo yake yanaendelea katika cheo alicho nacho Yosefu sasa.
- source_word: לְאָב לְפַרְעֹה
  choice: baba kwa Farao
  rationale: Taswira ya אָב imehifadhiwa badala ya kuifupisha kuwa “mshauri,” kwa kuwa inaweza kujumuisha ushauri mkuu, ulinzi, na ufadhili.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: na bwana wa nyumba yake yote
  rationale: “Bwana” linaonyesha mamlaka ya Yosefu, huku “nyumba” likibaki pana vya kutosha kujumuisha watu na mali za Farao.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: na mtawala wa nchi yote ya Misri
  rationale: “Mtawala” linaonyesha mtu anayetawala bila kuingiza cheo mahususi zaidi kisichotajwa na Kiebrania.
theological_decisions:
- issue: Ukuu wa Mungu na uwajibikaji wa binadamu katika kauli ya Yosefu
  choice: si ninyi mlionituma huku, bali ni Mungu
  alternative: Mungu alitumia tendo lenu kunituma huku
  rationale: Kiebrania kinatoa utofautishaji mkali wa kisemantiki unaosisitiza kusudi kuu la Mungu. Tafsiri haiufuti ukweli wa tendo la ndugu unaojulikana katika simulizi, wala haiongezi mfumo wa kiteolojia unaofafanua jinsi matendo hayo mawili yanavyohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unafuata urudiaji wa viunganishi katika Kiebrania huku ukibaki wa kawaida kusomeka kwa sauti.
