  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: sw
  text: Wakamwambia, “Yosefu angali hai, naye ni mtawala wa nchi yote ya Misri.” Lakini moyo wake ukafa ganzi,[a] kwa sababu hakuwaamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wake ukazimia.” Nahau ya Kiebrania inaeleza jinsi Yakobo alivyoshtuka na kudhoofika moyoni aliposikia habari hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: Wakamwambia
  rationale: Muundo huu unawasilisha kwa Kiswahili cha kawaida kitendo cha kumweleza Yakobo na kuanzisha maneno ya moja kwa moja, bila kubakiza fomula nzito ya ‘wakisema.’
- source_word: עוֹד יוֹסֵף חַי
  choice: Yosefu angali hai
  rationale: '‘Angali hai’ huonyesha wazi hali inayoendelea: licha ya kudhaniwa kuwa amekufa, Yosefu bado yu hai.'
- source_word: וְכִי הוּא מֹשֵׁל
  choice: naye ndiye anayetawala
  rationale: Partisipio מֹשֵׁל linaonyesha utendaji wa kutawala. ‘Ndiye’ linadokeza uzito wa taarifa kwamba Yosefu mwenyewe ndiye mwenye mamlaka, bila kulifanya kuwa cheo maalumu cha Kimisri.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: nchi yote ya Misri
  rationale: Pamoja na ‘anayetawala,’ kirai hiki hueleweka kiasili kuwa eneo lote lililo chini ya mamlaka yake.
- source_word: וַיָּפָג לִבּוֹ
  choice: moyo wake ukafa ganzi
  rationale: Nahau hii inahifadhi taswira ya moyo na kueleza mshtuko uliomdhoofisha au kumfanya asiweze kuitikia mara moja. Maana yake ina uwezekano wa ‘kuzimia’ au ‘kufa ganzi,’ hivyo tanbihi inadumisha upana huo.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: kwa sababu hakuwaamini
  rationale: כִּי inaeleza sababu ya mwitikio wake; ‘kwa sababu’ huonyesha uhusiano huo wazi na kwa Kiswahili cha kawaida.
