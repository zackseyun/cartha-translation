  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: simulizi linaendelea kwa “Kisha,” Farao anamwagiza Yosefu awaambie ndugu zake, amri ya wingi “Fanyeni hivi” imehifadhiwa, na טַעֲנוּ אֶת־בְּעִירְכֶם imeeleweka sawasawa kuwa kuwabebesha wanyama mizigo. “Mwende, mrudi katika nchi ya Kanaani” huwakilisha vitenzi viwili וּלְכוּ בֹאוּ na hutoa maana inayofaa muktadha wa kurudi Kanaani, bila kudai zaidi ya matini.'
