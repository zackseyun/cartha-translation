  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi wa moja kwa moja ndani ya usemi mwingine umehifadhiwa. Vitenzi vyote viwili vya Kiebrania katika וּלְכוּ בֹאוּ vimewakilishwa bila kutumia muundo usio wa kawaida wa tafsiri ya neno kwa neno.
