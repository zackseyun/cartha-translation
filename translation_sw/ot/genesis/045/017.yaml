base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: sw
  text: 'Kisha Farao akamwambia Yosefu, “Waambie ndugu zako, ‘Fanyeni hivi: wapakieni wanyama wenu mizigo, mwende, mrudi katika nchi ya Kanaani.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” pamoja na kitenzi cha kisimulizi ni Kiswahili cha kawaida na huhifadhi hatua inayofuata.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri katika Biblia.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: Waambie ndugu zako
  rationale: Muundo huu unamwagiza Yosefu awasilishe maneno kwa ndugu zake; “waambie” ni wa kawaida na sahihi kuliko tafsiri ngumu ya neno kwa neno.
- source_word: זֹאת עֲשׂוּ
  choice: Fanyeni hivi
  rationale: Huhifadhi amri ya wingi na maana ya demonstrative kwa Kiswahili fasaha.
- source_word: טַעֲנוּ אֶת בְּעִירְכֶם
  choice: wapakieni wanyama wenu mizigo
  rationale: Kitenzi kinamaanisha kuweka mzigo juu ya mnyama wa usafiri. Muundo huu wa Kiswahili unaeleza wazi kwamba wanyama ndio wanaobebeshwa mizigo, huku בְּעִיר ikitafsiriwa kwa neno pana “wanyama.”
- source_word: וּלְכוּ בֹאוּ
  choice: mwende, mrudi
  rationale: 'Vitenzi viwili vya amri vinahifadhiwa: kuondoka walipo na kufika tena Kanaani. “Mrudi” ni ya kawaida katika muktadha kwa kuwa ndugu walikuwa wametoka Kanaani.'
- source_word: אַרְצָה כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Kiishio cha mwelekeo pamoja na אֶרֶץ kinaonyesha mwendo kuelekea nchi ya Kanaani; Kiswahili hutumia kwa kawaida “rudi katika nchi.”
