base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: sw
  text: Nao wakamweleza maneno yote ya Yosef aliyokuwa amewaambia; naye alipoiona mikokoteni[a] ambayo Yosef alikuwa amezituma ili zimchukue, roho ya Yakobo, baba yao, ikapata nguvu tena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “magari ya kubebea mizigo.” Neno la Kiebrania linamaanisha vyombo vya usafiri vya kubebea.
    reason: lexical_alternative
  - marker: b
    text: Au “roho ya Yakobo, baba yao, ikahuika,” yaani alirejewa na nguvu au kutiwa moyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: Nao wakamweleza
  rationale: Kitenzi ‘kueleza’ kinaonyesha kwa Kiswahili cha kawaida kwamba wana walimpa taarifa; ‘Nao’ na ‘waka-’ zinaendeleza mfululizo wa simulizi bila kuongeza wazo la upinzani.
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: maneno yote ambayo Yosef alikuwa amewaambia
  rationale: ‘Maneno yote’ huhifadhi nomino halisi דִּבְרֵי, na ‘alikuwa amewaambia’ huonyesha kwamba Yosef alisema maneno hayo kabla ndugu zake hawajamweleza Yakobo.
- source_word: הָעֲגָלוֹת
  choice: magari
  rationale: Katika muktadha huu neno linamaanisha vyombo vya usafiri vilivyotumwa kutoka Misri. ‘Magari’ ni neno la kawaida na linaloeleweka; tanbihi inabainisha maana mbadala ya ‘mikokoteni.’
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: ambayo Yosef alikuwa ameyatuma ili yamchukue
  rationale: ‘Yamchukue’ ni Kiswahili asilia kinachoeleza kusafirishwa kwa Yakobo kwa magari hayo, huku muundo wa wakati ukionyesha kuwa yalikuwa yametumwa tayari.
- source_word: וַתְּחִי רוּחַ
  choice: roho ... ikapata uhai tena
  rationale: Tafsiri hii huhifadhi picha ya חיה, ‘kuwa hai,’ pamoja na רוּחַ, ‘roho,’ bila kuifupisha tu kuwa ‘alifurahi’ au ‘alitiwa moyo.’
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Yakobo baba yao
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili, na jina limetoholewa kwa umbo linalotambulika katika matumizi ya Kiswahili.
theological_decisions:
- issue: Maana ya kufanywa hai kwa roho ya Yakobo
  choice: roho ya Yakobo baba yao ikapata uhai tena
  alternative: moyo wa Yakobo baba yao ukachangamka
  rationale: Neno la asili ni ‘roho,’ si ‘moyo,’ na tamathali ya kupata uhai tena inaweza kumaanisha kurudiwa na nguvu au kutiwa moyo. Tafsiri kuu huhifadhi lugha hiyo bila kudai kwamba ni ufufuo halisi.
- issue: Namna ya kuandika jina יַעֲקֹב
  choice: Yakobo
  alternative: Yaakov
  rationale: ‘Yakobo’ ni umbo la Kiswahili sanifu linalotambulika kwa jina hili la Kiebrania; halibadilishi mhusika wala kuingiza tafsiri ya maana ya jina.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Sentensi imegawanywa ili kuepuka msururu mzito wa viunganishi, huku mpangilio wa matukio na maana ya Kiebrania vikihifadhiwa. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
