revisions:
- from: Nao wakamweleza maneno yote ambayo Yosef alikuwa amewaambia. Alipoyaona magari[a] ambayo Yosef alikuwa ameyatuma ili yamchukue, roho ya Yakobo baba yao ikapata uhai tena.[b]
  to: Nao wakamweleza maneno yote ya Yosef aliyokuwa amewaambia; naye alipoiona mikokoteni[a] ambayo Yosef alikuwa amezituma ili zimchukue, roho ya Yakobo, baba yao, ikapata nguvu tena.[b]
  rationale: Tafsiri imerekebishwa ili kutumia “mikokoteni,” ambayo ni sawa zaidi na vyombo vya usafirishaji vya matini ya Kiebrania kuliko “magari” katika maana yake ya kisasa. Sehemu ya mwisho imewekwa kwa usemi wa kawaida wa Kiswahili unaowasilisha kurejea kwa nguvu kwa roho ya Yakobo, huku ukidumisha lugha ya “roho” na maisha/uhuaji ya chanzo. Alama za tanbihi zimeambatanishwa na vipashio vinavyohusika.
