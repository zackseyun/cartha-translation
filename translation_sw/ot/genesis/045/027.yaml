  - severity: low
    issue: “ikapata uhai tena” kwa וַתְּחִי רוּחַ
    rationale: Ingawa inaakisi taswira ya uhai, si usemi laini zaidi katika Kiswahili kwa hali ya mtu aliyerejea nguvu baada ya habari. “Ikapata nguvu tena” huhifadhi idiomu bila kubadilisha roho kuwa moyo.
