  source_fidelity: 'Marekebisho yanahitajika kwa neno עֲגָלוֹת: “magari” kwa Kiswahili cha sasa kwa kawaida hudokeza magari ya injini na hivyo ni pana na ya kisasa kupita kiasi kwa mikokoteni ya usafirishaji inayokusudiwa. Muundo wa “Alipoyaona” pia huongeza kidogo kiunganishi cha wakati; muundo uliorekebishwa huhifadhi mfululizo wa simulizi na uhusiano wa tukio la kuona na kufufuka moyo/roho.'
  naturalness: “Mikokoteni” ni ya asili na wazi katika muktadha wa simulizi la kale. “Roho ... ikapata nguvu tena” ni usemi wa Kiswahili unaosikika kiasili, unaodumisha “roho” ya matini na kuwasilisha idiomu ya Kiebrania ya kurejea kwa nguvu bila kudai ufufuo wa kimwili.
  terminology: Yosef na Yakobo zimehifadhiwa kama majina yaliyotoholewa kwa Kiswahili. “Roho” imehifadhiwa kwa רוח. “Mikokoteni” hutofautisha vyombo hivi vya kubebea/kuvuta na magari ya kisasa.
