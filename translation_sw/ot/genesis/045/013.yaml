  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: sw
  text: Mwambieni baba yangu kuhusu heshima yangu yote nchini Misri na kila kitu mlichokiona.[a] Fanyeni haraka, mkamshushe baba yangu huku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utukufu wangu wote nchini Misri.” Neno la Kiebrania כָּבוֹד linaweza kumaanisha heshima, utukufu, au fahari; hapa linaelekea kwenye hadhi ya juu ya Yosefu nchini Misri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתֶּם
  choice: Mwambieni
  rationale: Hifili ya נגד hapa ina maana ya kutoa habari au kufanya jambo lijulikane. “Mwambieni” ni ya kawaida na inafaa kwa agizo la moja kwa moja kwa ndugu za Yosefu.
- source_word: כָּל כְּבוֹדִי
  choice: heshima yangu yote
  rationale: כבוד inaweza kumaanisha heshima, utukufu, au fahari. Katika mazingira haya inaelekeza hasa kwenye hadhi ya juu ya Yosefu nchini Misri; “heshima yangu yote” ni ya asili na huepuka kuingiza maana ya kidini isiyokusudiwa.
- source_word: בְּמִצְרַיִם
  choice: nchini Misri
  rationale: Ni kishazi cha mahali; “nchini Misri” ni Kiswahili sanifu na cha kawaida.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: kila kitu mlichokiona
  rationale: Kishazi hiki kinajumuisha ushahidi wote ambao ndugu zake walikuwa wameuona, si hadhi yake pekee.
- source_word: מִהַרְתֶּם
  choice: Fanyeni haraka
  rationale: Katika muktadha, kitenzi kina nguvu ya agizo na kinaonyesha uharaka.
- source_word: הוֹרַדְתֶּם
  choice: mkamlete
  rationale: Hifili ya ירד kihalisi ni ‘kusababisha ashuke.’ Katika Kiswahili, “mkamlete” huwasilisha mwendo kuelekea mahali alipo msemaji kwa ufasaha; wazo la kushuka kwenda Misri limetolewa kama mbadala katika tanbihi.
- source_word: הֵנָּה
  choice: huku
  rationale: Kielezi hiki kinaonyesha mwendo kuelekea mahali alipo msemaji. “Huku” kinafaa kwa kitenzi cha mwendo “mkamlete.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Baba yangu” huhifadhi uhusiano wa kifamilia; “huku” ni ya asili pamoja na kitenzi cha mwendo. Tanbihi huhifadhi maana mbadala za כבוד na mwelekeo wa ‘kushuka’ uliomo katika הוֹרַדְתֶּם.
