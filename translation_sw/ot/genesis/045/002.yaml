lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: Akalia kwa sauti kubwa
  rationale: Nahau ya Kiebrania, kwa maana halisi ‘akatoa sauti yake katika kulia,’ inaonyesha kilio kilichosikika kwa nguvu. Kiswahili hiki ni cha kawaida na kinahifadhi maana bila kutafsiri nahau neno kwa neno.
- source_word: וַיִּשְׁמְעוּ
  choice: wakasikia
  rationale: Kitenzi hapa kinamaanisha kutambua sauti kwa kusikia, si kusikiliza kwa makini wala kutii.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa neno hilo linaweza kumaanisha ‘Misri,’ kitenzi cha wingi kinaunga mkono maana ya pamoja inayowarejelea watu wa Misri.
- source_word: וַיִּשְׁמַע
  choice: wakasikia
  rationale: Tafsiri hii hudumisha maana ya kawaida ya kusikia na urudiaji sambamba uliomo katika Kiebrania; wingi wa Kiswahili unapatana na ufafanuzi wa ‘watu wa nyumba.’
- source_word: בֵּית פַּרְעֹה
  choice: watu wa nyumba ya Farao
  rationale: ‘Nyumba’ inaweza kumaanisha jamaa, watumishi, au watu wa makao ya kifalme. Kuongeza ‘watu wa’ hufanya wazi kwamba wanaosikia ni watu, huku kukihifadhi upana wa usemi wa Kiebrania.
