  text: Basi wakapanda kutoka Misri, wakafika katika nchi ya Kanaani kwa Yakobo, baba yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakaondoka ... wakapanda
  rationale: Kitenzi עלה humaanisha kupanda. Katika safari kutoka Misri kwenda Kanaani, Kiswahili cha asili kinahitaji kuonyesha kuondoka pamoja na mwelekeo wa kupanda; hivyo mgawanyo huu huhifadhi maana bila kuwa mgumu.
- source_word: מִמִּצְרָיִם
  choice: Misri
  rationale: Kihusishi מִן kinaonyesha mahali walikotoka; maana hiyo imeunganishwa na ‘wakaondoka Misri’ kwa Kiswahili cha kawaida.
- source_word: וַיָּבֹאוּ
  choice: hadi
  rationale: בוא huonyesha kufika au kuja. Katika muundo huu, ‘hadi’ pamoja na mwendo uliotajwa huwasilisha kwamba walifika nchi ya Kanaani bila kurudia kitenzi kingine kwa uzito usio wa lazima.
- source_word: אֶרֶץ כְּנַעַן
  choice: nchi ya Kanaani
  rationale: Muundo wa Kiebrania unataja wazi ‘nchi’; ‘nchi ya Kanaani’ huhifadhi kipengele hicho na kutumia jina la kawaida la Kiswahili.
- source_word: אֶל
  choice: kwa
  rationale: Kihusishi hiki kinaonyesha walikokwenda, yaani kwa mtu; ‘kwa Yakobo’ ni Kiswahili cha kawaida katika muktadha huo.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: אֲבִיהֶם
  choice: baba yao
  rationale: Neno hili linamaanisha baba yao; hapa Yakobo ni baba yao wa moja kwa moja.
