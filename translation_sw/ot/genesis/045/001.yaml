base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: sw
  text: Ndipo Yosefu hakuweza tena kujizuia mbele ya wote waliokuwa wamesimama karibu naye[a], akapaza sauti, “Mwondoeni kila mtu hapa nilipo!” Hakuna mtu aliyebaki pamoja naye[b] Yosefu alipojitambulisha kwa ndugu zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya wote waliosimama kando yake.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maneno halisi, “hakuna mtu aliyesimama pamoja naye”; hapa maana yake ni kwamba hakuna mtu aliyebaki hapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: hakuweza tena kujizuia
  rationale: Muundo huu unaonyesha kwamba Yosefu hakuwa na uwezo wa kuendelea kujidhibiti. Neno “tena” linaeleza kwa kawaida katika Kiswahili hali iliyofikia kikomo, bila kutaja hisia ambayo Kiebrania hakuitaji waziwazi.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: mbele ya wote waliokuwa wamesimama karibu naye
  rationale: Tafsiri hii inahifadhi wazo la kuwa mbele ya watu waliokuwa wamesimama hapo karibu naye, bila kuamua moja kwa moja kwamba wote walikuwa watumishi au maafisa.
- source_word: וַיִּקְרָא
  choice: akapaza sauti
  rationale: Kitenzi kinamaanisha kuita au kusema kwa sauti. “Akapaza sauti” ni Kiswahili cha kawaida kinacholingana na uzito wa tukio bila kuongeza maneno aliyolia.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: Mwondoeni kila mtu hapa nilipo
  rationale: Amri ya wingi imeelekezwa kwa waliokuwapo, nao wanaagizwa kumwondoa kila mtu kutoka mahali alipo Yosefu. Usemi huu ni wa kawaida zaidi kuliko tafsiri sisisi ya “kutoka juu yangu” au “kutoka mbele yangu,” huku ukihifadhi hali ya kusababisha watu waondoke.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: Hakuna mtu aliyebaki pamoja naye
  rationale: Ingawa עמד kwa msingi ni “kusimama,” katika muktadha huu maana ni kwamba hakuna mtu mwingine aliyesalia kuwapo pamoja naye.
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: Yosefu alipojitambulisha kwa ndugu zake
  rationale: Hithpaeli ya ידע hapa ina maana ya kujifanya ajulikane au kujifunua. “Alipojitambulisha” ni ya kawaida na inaonyesha kwamba Yosefu ndiye aliyewawezesha ndugu zake kumtambua.
