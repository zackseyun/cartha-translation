  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu mfuatano na maana ya Kiebrania: Yosefu hawezi tena kujizuia, anawaita waliopo waondoke, na hakuna mtu mwingine anayebaki anapojitambulisha kwa ndugu zake. “Mwondoeni kila mtu hapa nilipo” inatafsiri ipasavyo amri ya wingi yenye maana ya kuwasababisha wengine waondoke mbele yake, bila kuwatambua kwa tafsiri ya ziada kama watumishi.'
