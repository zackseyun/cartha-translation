base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: sw
  text: Ndipo Yosefu akawaambia ndugu zake, “Mimi ni Yosefu. Je, baba yangu bado yu hai?” Lakini ndugu zake hawakuweza kumjibu, kwa maana walifadhaika mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliingiwa na hofu mbele yake” au “walishtuka walipomwona.” Kwa kawaida, kirai cha Kiebrania humaanisha “kutoka mbele yake/uso wake,” yaani kwa sababu ya uwepo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akawaambia” hutoa kwa kawaida אֶל אֶחָיו.
- source_word: אֶל אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu ni ndugu wa kiume wa Yosefu; Kiswahili kwa kawaida hutumia “ndugu zake” bila kulazimisha ufafanuzi usiohitajika.
- source_word: אֲנִי יוֹסֵף
  choice: Mimi ni Yosefu
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kimehifadhiwa ili kudumisha mkazo wa kujitambulisha.
- source_word: הַעוֹד אָבִי חָי
  choice: Je, baba yangu bado yu hai?
  rationale: “Bado” huonyesha kuendelea kwa hali, na “yu hai” ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: Lakini ... hawakuweza kumjibu
  rationale: “Lakini” huonyesha mgeuko wa kulinganisha baada ya swali, huku “hawakuweza kumjibu” ikihifadhi maana ya kutoweza kujibu.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya kushindwa kwao kujibu kwa mtiririko wa Kiswahili cha simulizi.
- source_word: נִבְהֲלוּ
  choice: walifadhaika
  rationale: Kitenzi kinaweza kumaanisha kushtuka, kufadhaika, au kuingiwa na hofu. “Walifadhaika” huhifadhi upana huo bila kuamua kwamba ilikuwa hofu kuu pekee.
- source_word: מִפָּנָיו
  choice: mbele yake
  rationale: Huhifadhi kwa ukaribu nahau ya Kiebrania “kutoka mbele ya uso/uwepo wake,” huku tanbihi ikieleza maana zake zinazowezekana.
