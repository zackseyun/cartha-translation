  text: Kisha Yosefu akamwangukia shingoni mwa Benyamini, ndugu yake, akalia[a]; naye Benyamini akalia shingoni mwa Yosefu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa tafsiri ya neno kwa neno, kina umbo la wingi: “akaanguka juu ya shingo za Benyamini ndugu yake ... naye Benyamini akalia juu ya shingo yake.” Umbo la wingi katika kirai hiki ni nahau ya Kiebrania ya kumkumbatia mtu shingoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: akamwangukia
  rationale: Kitenzi נפל kimehifadhiwa kwa maana yake halisi ya ‘kuanguka,’ huku muundo wa Kiswahili ukionyesha tendo la kumkumbatia mtu shingoni.
- source_word: עַל צַוְּארֵי
  choice: shingoni
  rationale: Ingawa umbo la Kiebrania ni la wingi au linalofanana na uwili, hapa ni nahau ya kumkumbatia mtu kwenye shingo; ‘shingoni’ ni ya asili na wazi katika Kiswahili.
- source_word: בִנְיָמִן אָחִיו
  choice: Benyamini ndugu yake
  rationale: Jina limetoholewa kwa matumizi ya kawaida ya Biblia za Kiswahili, na kirai ‘ndugu yake’ kinahifadhi msisitizo wa uhusiano wa kifamilia.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: akalia
  rationale: בכה humaanisha kulia; ‘akalia’ ni lugha ya kawaida, yenye hadhi, na inafaa kwa hisia za tukio hili.
- source_word: וּבִנְיָמִן
  choice: naye Benyamini
  rationale: ‘Naye’ linaunganisha kishazi cha pili kwa kawaida katika Kiswahili na kuonyesha kwamba Benyamini pia alilia bila kubadili maana.
- source_word: עַל צַוָּארָיו
  choice: shingoni mwake
  rationale: Tafsiri hii inarudia picha ya Kiebrania kwa Kiswahili cha kawaida na kumrejelea Yosefu kwa uwazi unaotokana na muktadha.
