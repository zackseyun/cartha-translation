  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: sw
  text: Na tazameni[a], macho yenu yanaona—na macho ya ndugu yangu Benyamini—kwamba ni kinywa changu kinachosema nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Na tazama, macho yenu yanaona, na macho ya ndugu yangu Benyamini, kwamba kinywa changu ndicho kinachosema nanyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazameni
  rationale: Neno hili linavuta usikivu kwa msisitizo wa moja kwa moja. “Tazameni” ni la asili na lenye hadhi katika Kiswahili cha Biblia, huku wingi ukilingana na wale ndugu wanaoambiwa.
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: macho yenu yanaona
  rationale: Tafsiri hii inadumisha taswira halisi ya macho na uthibitisho wao wa moja kwa moja; hali ya sasa ya kitenzi inaonyesha tendo linaloendelea wakati huo.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: na macho ya ndugu yangu Benyamini pia
  rationale: Inahifadhi muundo unaolingana na “macho yenu,” na “pia” husaidia sentensi isomeke kwa kawaida bila kuongeza maana mpya.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha maudhui ya yale ambayo macho yao yanathibitisha.
- source_word: פִי
  choice: kinywa changu mwenyewe
  rationale: “Kinywa changu” kinahifadhi usemi halisi wa Kiebrania, unaosisitiza kwamba Yosefu anasema nao moja kwa moja; “mwenyewe” huonyesha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: kinachosema nanyi
  rationale: Kirai hiki kinaonyesha kwamba kinywa chake ndicho kinachofanya tendo hilo sasa. “Kusema nanyi” ni Kiswahili cha asili kinacholingana na maana ya kuwaelekea katika mazungumzo.
