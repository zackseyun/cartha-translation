  to: Na tazameni[a], macho yenu yanaona—na macho ya ndugu yangu Benyamini—kwamba ni kinywa changu kinachosema nanyi.
  rationale: Revision removes the added and grammatically unsuitable 'mwenyewe,' omits the nonessential 'pia,' and retains the source's vivid parallelism through a dash. The footnote continues to offer a more formally source-shaped alternative for the attention-getting opening and focus construction.
