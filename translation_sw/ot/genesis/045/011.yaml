  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: sw
  text: Huko nitakupatia mahitaji yako, kwa sababu bado kuna miaka mitano ya njaa, ili usije ukawa maskini, wewe, watu wa nyumbani mwako, na vyote ulivyo navyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: nitakupatia mahitaji yako
  rationale: Kitenzi כלכל katika muktadha huu humaanisha kumtunza mtu kwa kumpatia mahitaji yake. Tafsiri hii ni ya kawaida na iliyo wazi kwa Kiswahili cha sasa.
- source_word: כִּי
  choice: kwa sababu
  rationale: 'Huonyesha sababu ya ahadi ya Yosefu: bado kuna miaka mitano ya njaa.'
- source_word: פֶּן תִּוָּרֵשׁ
  choice: ili usije ukawa maskini
  rationale: פֶּן huleta matokeo yanayoepukwa, na ירשׁ katika hali hii adimu ina maana ya kuwa maskini au kufilisika.
- source_word: בֵיתְךָ
  choice: watu wa nyumbani mwako
  rationale: Neno בית hapa linaelekea kumaanisha kaya ya Yakobo, si jengo pekee.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: na vyote ulivyo navyo
  rationale: Huhifadhi maana pana ya mali na vitu vyote vya Yakobo bila kuibana kwa aina fulani ya mali.
