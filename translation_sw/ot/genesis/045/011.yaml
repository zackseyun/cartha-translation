  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa onyo umewekwa kwa ‘ili usije’ ili kuhifadhi kusudi la kuzuia hali inayohofiwa.
