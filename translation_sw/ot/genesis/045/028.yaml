  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: sw
  text: Israeli akasema, “Imetosha![a] Mwanangu Yosefu angali hai. Nitakwenda nikamwone kabla sijafa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Inatosha!” Neno la Kiebrania רַב hapa ni mshangao unaoonyesha utoshelevu.
