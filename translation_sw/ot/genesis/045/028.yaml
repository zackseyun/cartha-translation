lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kauli hii inaendeleza simulizi kwa namna ya kawaida katika Kiswahili bila kuongeza maana ya wakati isiyobainishwa.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanatumia jina Israeli, si Yakobo; kwa hiyo jina hilo limehifadhiwa.
- source_word: רַב
  choice: Imetosha!
  rationale: Hapa neno hili ni mshangao unaoonyesha utoshelevu na uamuzi wa Israeli baada ya kusikia kwamba Yosefu yu hai.
- source_word: עוֹד יוֹסֵף בְּנִי חָי
  choice: Mwanangu Yosefu angali hai
  rationale: “Angali hai” huonyesha kwa kawaida kwamba Yosefu anaendelea kuwa hai, huku “mwanangu” ikihifadhi msisitizo wa kifamilia.
- source_word: אֵלְכָה
  choice: Nitakwenda
  rationale: Umbo la kuhimiza nafsi ya msemaji linaonyesha azimio thabiti; wakati ujao wa Kiswahili unaliwasilisha kwa kawaida bila kuongeza ulazima.
- source_word: וְאֶרְאֶנּוּ
  choice: nikamwone
  rationale: Muundo huu wa Kiswahili unaunganisha kwenda na kusudi linalofuata, yaani kumwona Yosefu.
- source_word: בְּטֶרֶם אָמוּת
  choice: kabla sijafa
  rationale: Huu ni usemi wa kawaida na wa moja kwa moja wa Kiswahili kwa tukio litakalotangulia kifo cha msemaji.
