base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: sw
  text: 'Nawe umeagizwa, “Fanyeni hivi: Jichukulieni magari ya kukokotwa[a] kutoka nchi ya Misri kwa ajili ya watoto wenu wadogo[b] na wake zenu; mchukue baba yenu, kisha mje[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, vyombo vya usafiri vya kukokotwa vilivyotumiwa kusafirisha watu na mizigo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linarejelea hasa watoto wadogo.
    reason: lexical_alternative
  - marker: c
    text: Inaweza pia kutafsiriwa “mrudi,” kwa kuwa muktadha unaonyesha kurudi Misri, ingawa Kiebrania kinasema tu “mje.”
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: umeagizwa
  rationale: Kauli tendwa ya צוה inaonyesha kwamba anayesemeshwa amepewa agizo; Kiswahili cha wakati timilifu kinaonyesha agizo lililotolewa na ambalo bado lina nguvu.
- source_word: זֹאת עֲשׂוּ
  choice: Fanyeni hivi
  rationale: Ni usemi wa kawaida wa kutoa agizo na unahifadhi wingi wa kitenzi עֲשׂוּ kwa Kiswahili cha asili.
- source_word: קְחוּ לָכֶם
  choice: Jichukulieni
  rationale: Umbo la kujirejelea linaonyesha maana ya לָכֶם, yaani kuchukua kwa ajili yao wenyewe, bila kuongeza maneno mazito.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: kutoka nchi ya Misri
  rationale: Inawakilisha wazi אֶרֶץ na ni usemi wa kawaida wa Kiswahili.
- source_word: עֲגָלוֹת
  choice: magari
  rationale: Hapa ni vyombo vya usafiri wa watu na mizigo; “magari” ni neno la kawaida, huku tanbihi ikifafanua kuwa ni magari ya kukokotwa, si magari ya injini.
- source_word: לְטַפְּכֶם
  choice: kwa ajili ya watoto wenu wadogo
  rationale: טַף huelekea kumaanisha watoto wadogo, si watoto au wategemezi kwa ujumla.
- source_word: וְלִנְשֵׁיכֶם
  choice: na wake zenu
  rationale: Katika muktadha wa familia, נָשִׁים ina maana ya wake.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: mchukue baba yenu
  rationale: נשא inaweza kumaanisha kuinua au kubeba, lakini katika muktadha huu inahusu kumsafirisha baba pamoja nao; “mchukue” ni ya kawaida bila kuamua kwamba lazima abebwe kwa mikono.
- source_word: וּבָאתֶם
  choice: kisha mje
  rationale: Kitenzi cha Kiebrania kinasema tu “mje”; muktadha unaonyesha kuja Misri, lakini tafsiri kuu haiongezi “mrudi”.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Wingi wa maagizo umehifadhiwa, huku “Nawe” ikidumisha umoja wa anayepokea agizo. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
