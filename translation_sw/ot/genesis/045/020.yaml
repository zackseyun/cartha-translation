  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: sw
  text: Na msihangaikie mali yenu[a], kwa maana mema yote ya nchi ya Misri ni yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “jicho lenu lisiihurumie mali yenu”; yaani, msisikitike au kuwa na wasiwasi kwa sababu ya mali mtakayoiacha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: Wala msihangaikie
  rationale: Nahau ya Kiebrania, kihalisi ‘jicho lenu lisihurumie,’ inaelekeza wasisikitike wala kuwa na wasiwasi juu ya vitu watakavyoviacha. ‘Msihangaikie’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuifanya nahau isieleweke.
- source_word: כְּלֵיכֶם
  choice: mali yenu
  rationale: כְּלִי hapa inaweza kumaanisha vyombo, vitu, vifaa, au mali za nyumbani. ‘Mali yenu’ ni pana na inafaa katika muktadha wa kuhama.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya amri iliyotangulia; ‘kwa maana’ ni cha asili na chenye hadhi katika simulizi.
- source_word: טוּב כָּל אֶרֶץ מִצְרַיִם
  choice: vitu bora vya nchi yote ya Misri
  rationale: טוּב katika muktadha huu inaashiria vitu vyema au vilivyo bora vinavyopatikana katika nchi, si wema wa kinadharia. ‘Nchi yote’ huhifadhi upeo wa כָּל אֶרֶץ.
- source_word: לָכֶם הוּא
  choice: ni vyenu
  rationale: Muundo huu unaonyesha umiliki kwa msisitizo. ‘Ni vyenu’ ni usemi wa kawaida wa Kiswahili na unapatana na nomino ya wingi ‘vitu.’
theological_decisions: []
