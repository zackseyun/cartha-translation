  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu mpangilio na maana ya Kiebrania: katazo la kuhuzunika, katazo la kujikasirikia katika muktadha wa lawama binafsi, tendo la ndugu la kumuuza Yusufu, na tendo lenye kusudi la Mungu la kumtuma mbele yao kwa ajili ya kuhifadhi uhai. Kauli “mliniuza nije hapa” hueleza kwa usahihi maana ya mwelekeo ya הֵנָּה bila kudai kwamba mauzo yenyewe yalifanyika mahali alipo.'
