  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: sw
  text: Na sasa, msihuzunike[a] wala msijikasirikie[b] kwa sababu mliniuza nije hapa, kwa maana Mungu alinituma niwatangulie ili kuhifadhi uhai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiwe na maumivu moyoni.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wala lisichome machoni penu”; ni usemi unaomaanisha kukasirika au kutoridhika. Hapa huenda unahusu kujikasirikia au kujilaumu.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa ajili ya kuhifadhi maisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi ו pamoja na maana ya wakati ya עַתָּה, huku ikianzisha ombi la Yusufu kwa njia ya kawaida katika Kiswahili.
- source_word: אַל תֵּעָצְבוּ
  choice: msihuzunike
  rationale: Kitenzi עצב hapa kinaonyesha huzuni au maumivu ya moyoni; “msihuzunike” ni wazi, cha kawaida, na chenye heshima.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: wala msijikasirikie
  rationale: Usemi wa Kiebrania, kihalisi kuhusu kuwaka machoni, unaonyesha kukasirika au kutoridhika. Katika muktadha unalenga hasira au lawama walizojielekezea wenyewe.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: kwa sababu mliniuza nije hapa
  rationale: כִּי inaeleza sababu, na הֵנָּה ina maana ya kufika mahali hapa. “Mliniuza nije hapa” huonyesha kwa kawaida kwamba kuuzwa kwake kulimleta huko bila kudokeza kwamba ndugu zake walimuuza moja kwa moja akiwa Misri.
- source_word: לְמִחְיָה
  choice: ili kuhifadhi uhai
  rationale: Nomino מחיה inaonyesha kuhifadhi maisha au kuwezesha kuendelea kuishi; muundo huu unaweka wazi kusudi bila kubainisha ni uhai wa nani pekee.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: Mungu alinituma
  rationale: Kauli ya wakati uliotimilika inafaa kutafsiriwa kwa wakati uliopita katika simulizi, na inahifadhi wazi utendaji wa Mungu.
- source_word: לִפְנֵיכֶם
  choice: niwatangulie
  rationale: Hutoa maana ya kutumwa mbele yao kwa wakati na mahali kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
theological_decisions:
- issue: Majaliwa ya Mungu na uwajibikaji wa binadamu
  choice: Kuhifadhi pamoja kauli “mliniuza” na “Mungu alinituma.”
  alternative: Kupunguza kosa la ndugu kwa kusema tu walimwondoa, au kuonyesha kwamba Mungu aliruhusu tu bila kumtuma.
  rationale: Kiebrania kinaweka sambamba tendo lenye hatia la ndugu na kusudi tendaji la Mungu. Tafsiri haifuti wala kutatua mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni rahisi kueleweka katika usomaji wa hadhara; “msijikasirikie” huhifadhi wazo la kujielekezea hasira, na “kuhifadhi uhai” huacha upeo wa maisha yanayohifadhiwa bila kuubana.
