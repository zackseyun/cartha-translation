  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: sw
  text: Akawabusu ndugu zake wote na kuwalilia. Baada ya hayo, ndugu zake wakazungumza naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: akawabusu
  rationale: Kitenzi נשׁק katika Piel kinaonyesha busu la upendo na upatanisho; “akawabusu” ni Kiswahili cha kawaida bila kuongeza wazi wazo la kurudia-rudia.
- source_word: לְכָל אֶחָיו
  choice: ndugu zake wote
  rationale: כָּל pamoja na wingi inahusu ndugu wote wa Yosefu, na mpangilio huu ni wa asili katika Kiswahili.
- source_word: וַיֵּבְךְּ עֲלֵיהֶם
  choice: na kuwalilia
  rationale: בכה ni kulia, na עַל hapa huonyesha kilio chake juu yao au akiwa amewakumbatia; “kuwalilia” huwasilisha kwa ufupi na kawaida hisia hiyo inayowaelekea.
- source_word: וְאַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Usemi huu unaonyesha mfuatano wa matukio kwa lugha ya simulizi iliyo wazi.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: ndugu zake wakazungumza naye
  rationale: דבר pamoja na אֵת inaelekea kuonyesha mazungumzo ya pamoja, si hotuba ya upande mmoja; “wakazungumza naye” ni ya asili na huhifadhi maana hiyo.
