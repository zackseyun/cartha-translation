base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: sw
  text: Kisha akawatuma ndugu zake waende, nao wakaondoka. Akawaambia, “Msigombane njiani[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msifadhaike,” “msikasirike,” au “msiogope njiani.” Kitenzi cha Kiebrania kinaweza kumaanisha aina mbalimbali za msukosuko wa hisia; “msigombane” kinafaa katika muktadha huu wa ndugu hao kusafiri pamoja baada ya Yosefu kujitambulisha kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: akawatuma ... waende
  rationale: Kitenzi cha Kiebrania katika muktadha huu kinaonyesha kuwa Yosefu aliwaondoa mbele yake kwa kuwaagiza waende. Tafsiri hii ni ya kawaida kwa Kiswahili na inaepuka kuongeza wazo mahususi la kuwaaga.
- source_word: אֶת־אֶחָיו
  choice: ndugu zake
  rationale: Neno la Kiebrania linamaanisha ndugu wa kiume, na muktadha unaonyesha wazi kuwa hawa ni ndugu zake Yosefu.
- source_word: וַיֵּלֵכוּ
  choice: nao wakaondoka
  rationale: Ingawa kitenzi kina maana pana ya kwenda au kutembea, hapa kinaendeleza simulizi kwa kuonyesha kwamba waliondoka baada ya kutumwa.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Akawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kauli ya Kiebrania inayotambulisha maneno yanayofuata.
- source_word: אַל
  choice: Msi-
  rationale: Kiambishi cha kukataza katika Kiswahili kinawasilisha kwa kawaida nguvu ya neno la Kiebrania linalotoa katazo.
- source_word: תִּרְגְּזוּ
  choice: msigombane
  rationale: Kitenzi hiki kinaweza kuonyesha aina mbalimbali za msukosuko wa hisia, kutetemeka, hasira, au hofu. Katika muktadha wa ndugu kusafiri pamoja baada ya Yosefu kujitambulisha, “msigombane” kinafaa kwa onyo dhidi ya kulaumiana au kuzozana; maana nyingine zimehifadhiwa katika tanbihi.
- source_word: בַּדָּרֶךְ
  choice: njiani
  rationale: Neno hili linarejelea njia au safari yao ya kurudi, na “njiani” ni tafsiri fupi, ya asili, na iliyo karibu na Kiebrania.
