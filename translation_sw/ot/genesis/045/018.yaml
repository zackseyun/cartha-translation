  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘watu wa nyumba zenu’ unawakilisha kaya, na nahau ‘mafuta ya nchi’ imehifadhiwa kwa ufafanuzi katika tanbihi.
