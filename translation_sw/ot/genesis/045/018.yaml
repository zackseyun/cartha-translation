base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: sw
  text: Mchukueni baba yenu na watu wa nyumba zenu, mje kwangu. Nami nitawapa yaliyo bora ya nchi ya Misri, nanyi mtakula mafuta ya nchi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu bora zaidi ya nchi.” Nahau ya Kiebrania “mafuta ya nchi” humaanisha wingi wa vitu bora kabisa vya nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: Mchukueni
  rationale: Ni amri ya wingi kutoka לקח, ikiwataka ndugu za Yosefu waende pamoja na baba yao. ‘Mchukueni’ hudumisha maana ya msingi ya kitenzi bila kuongeza wazo lisilotajwa wazi la kurudi.
- source_word: אֲבִיכֶם
  choice: baba yenu
  rationale: Ni nomino ya umoja yenye kiambishi cha nafsi ya pili wingi, ikimtaja Yakobo.
- source_word: בָּתֵּיכֶם
  choice: watu wa nyumba zenu
  rationale: Ingawa neno lenyewe ni ‘nyumba zenu,’ hapa בַּיִת humaanisha watu wa kaya na walio chini ya uangalizi wake. Usemi huu unaeleweka kwa Kiswahili na huhifadhi dhana ya kaya kuliko kusema tu ‘nyumba.’
- source_word: וּבֹאוּ אֵלַי
  choice: mje kwangu
  rationale: Hii ni amri ya wingi ya בוא pamoja na אֶל. ‘Mje kwangu’ hutoa maana ya moja kwa moja bila kuongeza ‘mrudi,’ ambalo halipo wazi katika Kiebrania.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Nami nitawapa
  rationale: Umbo hili, linalofuata amri, linafanya kazi kama ahadi au hakikisho. Wakati ujao wa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: yaliyo bora ya nchi ya Misri
  rationale: טוּב inaweza kumaanisha wema, wingi wa vitu vizuri, au sehemu bora. ‘Yaliyo bora’ huwasilisha ahadi ya kupata rasilimali bora zaidi za Misri bila kuibana kwa mazao pekee.
- source_word: וְאִכְלוּ
  choice: nanyi mtakula
  rationale: Ingawa umbo la Kiebrania ni la amri katika mfuatano, baada ya ahadi linaeleweka kwa kawaida kama matokeo ya baadaye. ‘Mtakula’ huonyesha mtiririko huo.
- source_word: חֵלֶב הָאָרֶץ
  choice: mafuta ya nchi
  rationale: חֵלֶב maana yake ya moja kwa moja ni ‘mafuta,’ lakini hapa ni nahau inayomaanisha sehemu yenye utajiri mwingi au iliyo bora kabisa. Matini kuu inahifadhi taswira ya Kiebrania, huku tanbihi ikiifafanua.
