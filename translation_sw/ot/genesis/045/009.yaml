base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: sw
  text: 'Fanyeni haraka, mpande kwa baba yangu, mkamwambie, ‘Mwanao Yosefu anasema hivi: Mungu ameniweka kuwa mtawala juu ya Misri yote. Shuka uje kwangu; usikawie.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהֲרוּ
  choice: Fanyeni haraka
  rationale: Amri ya wingi inaonyesha uharaka; usemi huu ni wa kawaida na una nguvu ya agizo.
- source_word: וַעֲלוּ
  choice: mwende juu
  rationale: Inahifadhi picha ya kijiografia ya kupanda kutoka Misri kuelekea Kanaani, kama ilivyo kawaida katika Mwanzo.
- source_word: אֶל אָבִי
  choice: kwa baba yangu
  rationale: Ni kauli ya moja kwa moja ya kuelekea aliko baba yake Yosefu bila kuongeza maelezo yasiyomo.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: mkamwambie
  rationale: Inaendeleza mfululizo wa maagizo kwa Kiswahili cha asili na kuonyesha ujumbe unaopaswa kuwasilishwa kwake.
- source_word: כֹּה אָמַר
  choice: anasema hivi
  rationale: Ni namna ya sasa na ya kawaida ya kuwasilisha fomula rasmi ya mjumbe bila kutumia lugha nzito isiyo ya lazima.
- source_word: בִּנְךָ יוֹסֵף
  choice: Mwanao Yosefu
  rationale: Inafuata mpangilio wa Kiebrania na kusisitiza uhusiano wa Yosefu na baba yake.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: Mungu ameniweka
  rationale: Kitenzi שׂים hapa kina maana ya kuweka au kuteua katika cheo; ‘ameniweka’ kinahifadhi taswira hiyo kwa ufasaha.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi na muktadha vinaonyesha rejeleo la umoja kwa Mungu ambaye Yosefu anamhesabia matukio haya.
- source_word: לְאָדוֹן
  choice: mtawala
  rationale: אָדוֹן hapa humaanisha mwenye mamlaka. ‘Mtawala’ linaeleza cheo cha Yosefu bila kumchanganya na jina la kimungu ‘Bwana.’
- source_word: לְכָל מִצְרָיִם
  choice: juu ya Misri yote
  rationale: Inaonyesha wazi upeo wa mamlaka yake katika nchi yote ya Misri.
- source_word: רְדָה אֵלַי
  choice: Shuka uje kwangu
  rationale: ‘Shuka’ huhifadhi mwelekeo wa kijiografia kuelekea Misri, na ‘uje kwangu’ huonyesha kwamba Yosefu ndiye anayezungumza na ndiye mwisho wa safari.
- source_word: אַל תַּעֲמֹד
  choice: usikawie
  rationale: Ingawa עמד kimsingi ni ‘kusimama,’ katika katazo hili maana ya kimuktadha ni kutochelewa au kutokawia.
theological_decisions:
- issue: Jinsi ya kutafsiri אֱלֹהִים katika tangazo la Yosefu
  choice: Mungu
  alternative: mungu
  rationale: Muundo wa umoja na muktadha wa maneno ya Yosefu huelekeza kwa Mungu mmoja anayemwabudu; herufi kubwa ni utambulisho wa kawaida, si nyongeza ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inadumisha uharaka wa maagizo, lugha ya kupanda na kushuka, na mamlaka ya Yosefu bila kutumia maneno ya kizamani.
