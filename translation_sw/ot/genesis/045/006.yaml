  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: sw
  text: Kwa maana njaa imekuwapo nchini kwa miaka hii miwili, na bado zimesalia miaka mitano ambayo hakutakuwa na kulima wala kuvuna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza maelezo ya Yosefu kuhusu sababu ya Mungu kumtuma mbele, na inaunganisha sentensi hii kwa kawaida na iliyotangulia.
- source_word: זֶה שְׁנָתַיִם
  choice: kwa miaka hii miwili
  rationale: Muundo huu unaonyesha kipindi cha miaka miwili ambacho tayari kimepita hadi wakati wa kusema.
- source_word: הָרָעָב
  choice: njaa
  rationale: Inarejelea njaa maalumu inayozungumziwa katika simulizi; Kiswahili hakihitaji kibainishi tofauti cha uainisho hapa.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: nchini
  rationale: Ingawa Kiebrania ni kwa uhalisi ‘katikati ya nchi,’ katika muktadha huu maana ya kawaida ni kwamba njaa imekuwapo ndani ya nchi; ‘nchini’ ni ya asili na haiongezi wazo la kuenea kila mahali.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: na bado imebaki miaka mitano
  rationale: Inaonyesha kwamba miaka mingine mitano inasalia kuanzia wakati Yosefu anaposema.
- source_word: אֲשֶׁר אֵין
  choice: ambayo hakutakuwa na
  rationale: Kishazi husika kinaeleza miaka mitano ijayo; wakati ujao unaeleweka kutokana na mtazamo wa msemaji.
- source_word: חָרִישׁ
  choice: kulima
  rationale: Neno linamaanisha shughuli ya kulima au kulima kwa jembe; ‘kulima’ ni neno la kawaida na linaloeleweka kwa urahisi.
- source_word: קָצִיר
  choice: kuvuna
  rationale: Likiwa sambamba na kulima, hapa linaeleza tendo la kuvuna; kitenzi-jina kinafanya jozi ya Kiswahili iwe ya asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio ‘kulima wala kuvuna’ unahifadhi ulinganifu wa shughuli mbili za kilimo bila kufanya sentensi kuwa nzito.
