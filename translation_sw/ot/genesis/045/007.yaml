base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: sw
  text: Mungu alinituma niwatangulie ili awawekee mabaki katika nchi[a], na kuwahifadhi hai kwa ajili ya ukombozi mkuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili awawekee manusura katika nchi,” au “ili awahifadhie uzao katika nchi.” Neno la Kiebrania linaweza kumaanisha mabaki, manusura, au uzao uliosalia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ajili ya kuokoka kukubwa,” au “ili kuwapo manusura wengi.” Kirai cha Kiebrania kinaweza kukazia tendo la kuokolewa au watu wengi waliobaki hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: alinituma
  rationale: Wayyiqtol ya שׁלח inaendeleza simulizi la wakati uliopita; ‘alinituma’ ni Kiswahili cha kawaida na sahihi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu nomino hii humrejelea Mungu mmoja katika ufafanuzi wa Yosefu kuhusu matukio.
- source_word: לִפְנֵיכֶם
  choice: niwatangulie
  rationale: Kauli ya Kiebrania ni ‘mbele yenu’; hapa inaonyesha kwamba Yosefu alitumwa Misri kabla yao. Muundo huu pia unasawiri kusudi la kutumwa kwa njia ya asili katika Kiswahili.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: ili awawekee mabaki
  rationale: שׂוּם kimsingi ni ‘kuweka’; ‘awawekee mabaki’ huhifadhi taswira hiyo na kuonyesha watu wanaobaki hai kwa ajili yao bila kuamua kwamba neno linamaanisha uzao pekee.
- source_word: שְׁאֵרִית
  choice: mabaki
  rationale: Neno hili humaanisha kile au wale waliobaki. ‘Mabaki’ huhifadhi mwangwi muhimu wa msamiati wa Biblia, huku tanbihi ikieleza maana za manusura au uzao.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ inaweza kumaanisha dunia au nchi; maana ya eneo maalumu ndiyo inayofaa katika muktadha wa njaa na Misri.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: na kuwahifadhi hai
  rationale: Hiphil ya חיה humaanisha kufanya au kudumisha uhai; ‘kuwahifadhi hai’ ni ya asili na hudokeza ulinzi wa maisha wakati wa njaa.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: kwa wokovu mkuu
  rationale: פְּלֵיטָה inaweza kueleza kuokoka, ukombozi, au kundi la manusura. ‘Wokovu mkuu’ huwasilisha matokeo makubwa ya tendo la Mungu huku tanbihi ikihifadhi maana nyingine zinazowezekana.
theological_decisions:
- issue: Iwapo שְׁאֵרִית itafsiriwe kwa neno lenye mwangwi mpana wa kibiblia au moja kwa moja kama manusura/uzao
  choice: mabaki
  alternative: manusura; uzao
  rationale: ‘Mabaki’ ni sawia na maana ya kile kinachosalia na huhifadhi mwangwi wa kibiblia bila kuingiza fundisho la baadaye; tanbihi inaweka wazi kwamba hapa inaweza kumaanisha manusura au uzao uliosalia.
- issue: Iwapo לִפְלֵיטָה גְּדֹלָה inaeleza tendo la kuokoa au watu wengi walionusurika
  choice: kwa wokovu mkuu
  alternative: kwa kuokoka kukubwa; kuwa manusura wengi
  rationale: Kirai kinaweza kuonyesha kusudi au matokeo, na פְּלֵיטָה yenyewe inaweza kumaanisha tukio la kuokoka au manusura. Maandishi makuu yanachagua matokeo ya kuokoa, huku tanbihi ikihifadhi utata halisi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa tanbihi umewekwa baada ya maneno husika: [a] baada ya ‘katika nchi’ na [b] baada ya ‘wokovu mkuu’.'
