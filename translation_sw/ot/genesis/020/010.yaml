  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: sw
  text: Kisha Abimeleki akamwambia Abrahamu[a], “Uliona nini hata ukafanya jambo hili?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ulikuwa na nini akilini hata ukafanya jambo hili?” Kiebrania kinasema kihalisi, “Uliona nini...?” Kitenzi “kuona” hapa kinaweza kutumiwa kiidioma kumaanisha jambo ambalo mtu alitambua au alilokuwa nalo akilini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa masimulizi unaendeleza tukio linalofuata; “Kisha” pamoja na kitenzi cha usimulizi huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֶל־אַבְרָהָם
  choice: akamwambia Abrahamu
  rationale: Kiswahili huonyesha anayeelekezewa maneno kwa kiambishi cha yambwa katika “akamwambia,” huku jina likibainisha mhusika.
- source_word: מָה רָאִיתָ
  choice: Uliona nini
  rationale: Tafsiri hii inadumisha taswira halisi ya kitenzi “kuona,” ingawa hapa inaweza kutumiwa kiidioma kuhusu alichotambua, alichofikiria, au alichokuwa nacho akilini.
- source_word: כִּי
  choice: hata
  rationale: Katika swali hili, “hata” huunganisha alichoona Abrahamu na tendo lililofuata kwa Kiswahili asilia, bila kuligeuza moja kwa moja kuwa swali la “kwa nini.”
- source_word: עָשִׂיתָ
  choice: ukafanya
  rationale: Kitenzi hiki kinawasilisha tendo lililofanywa na Abrahamu na kuunganishwa kwa kawaida na kishazi kilichotangulia.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דָּבָר hapa humaanisha jambo au tendo linalozungumziwa. “Jambo hili” ni la kawaida na haliongezi hukumu ya kimaadili inayoweza kudokezwa na “kitendo hiki.”
