  source_fidelity: Tafsiri inadumisha mfuatano wa kisimulizi wa וַיֹּאמֶר kwa “Kisha,” wahusika, na swali la Kiebrania מָה רָאִיתָ bila kuligeuza kuwa swali la moja kwa moja la “kwa nini.” “Uliona nini hata ukafanya jambo hili?” huwakilisha kwa karibu muundo na maana ya chanzo; “hata” hutoa kiungo cha matokeo/motisha kinachofaa kwa כִּי katika muktadha huu.
