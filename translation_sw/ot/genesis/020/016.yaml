base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: sw
  text: Naye akamwambia Sara, “Tazama, nimempa ndugu yako vipande elfu moja vya fedha. Tazama, fedha hiyo ni kifuniko cha macho[a] kwako na kwa wote walio pamoja nawe; na mbele ya kila mtu umesafishwa na lawama[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kifuniko kwa ajili ya macho.” Huenda maana yake ni fidia ya hadharani inayofunika kosa na kurudisha heshima ya Sara.
    reason: lexical_alternative
  - marker: b
    text: Au “umethibitishwa kuwa huna hatia,” au “jambo hilo limewekwa sawa mbele ya kila mtu.” Kishazi cha mwisho cha Kiebrania ni kigumu na kimeeleweka kwa njia mbalimbali.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: vipande elfu moja vya fedha
  rationale: Kiebrania kinasema kihalisi ‘elfu moja za fedha’ bila kutaja wazi sarafu au shekeli; ‘vipande vya fedha’ huhifadhi kutokubainishwa huko kwa Kiswahili cha kawaida.
- source_word: לְאָחִיךְ
  choice: ndugu yako
  rationale: Neno la Kiebrania ni ‘ndugu yako’ na linamtaja Abrahamu kulingana na jinsi Sara alivyomtambulisha; tafsiri hii huhifadhi uhusiano wa simulizi na kejeli iliyomo.
- source_word: כְּסוּת עֵינַיִם
  choice: kifuniko cha macho
  rationale: Hii ni nahau yenye maana isiyo hakika. Tafsiri ya karibu huhifadhi sitiari badala ya kuifungia katika fasiri moja; huenda fedha hiyo ilikuwa fidia ya hadharani iliyofunika kosa na kurudisha heshima ya Sara.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: kwa wote walio pamoja nawe
  rationale: Hufuata kwa karibu kihusishi לְ na kuonyesha kwamba tendo hilo lilihusu pia watu waliokuwa pamoja na Sara, huku muktadha ukidokeza ushahidi wa hadharani.
- source_word: וְאֵת כֹּל
  choice: na mbele ya kila mtu
  rationale: Kirai hiki kimebanwa kisintaksia na ni kigumu. ‘Mbele ya kila mtu’ huonyesha upana wa hadharani unaoelekea kwa watu wote na kuunganika kwa kawaida na kishazi kinachofuata.
- source_word: וְנֹכָחַת
  choice: umesafishwa lawama
  rationale: Mzizi יכח katika umbo hili unaweza kumaanisha kuthibitishwa kuwa sawa au kuondolewa lawama. Katika muktadha wa malipo ya Abimeleki na utambuzi wa hadharani wa kutokuwa na hatia kwa Sara, ‘umesafishwa lawama’ ni Kiswahili cha kawaida bila kuficha ugumu wa kifungu.
