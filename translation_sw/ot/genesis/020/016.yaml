translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Tazama’ limedumishwa kwa msisitizo wa הִנֵּה, na sitiari pamoja na utata wa mwisho vimehifadhiwa kwa maelezo ya chini.
