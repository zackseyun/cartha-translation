  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: sw
  text: Kwa maana Yahweh alikuwa amefunga kabisa[a] matumbo yote ya uzazi ya watu wa nyumbani mwa Abimeleki kwa sababu ya Sara, mke wa Abrahamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa ameyafunga kabisa matumbo yote ya uzazi.” Kiebrania hutumia kitenzi-jina kisicho na ukomo pamoja na kitenzi chenye ukomo ili kusisitiza tendo la kufunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na uliotangulia kwa kutoa sababu au maelezo.
- source_word: עָצֹר עָצַר
  choice: alikuwa amefunga kabisa
  rationale: Muundo wa kitenzi-jina kisicho na ukomo pamoja na kitenzi chenye ukomo unasisitiza tendo; kauli hii pia inaonyesha kuwa hali hiyo ilitangulia uponyaji wa mstari wa 17.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: kila tumbo la uzazi katika nyumba ya Abimeleki
  rationale: Inahifadhi taswira halisi ya 'kila tumbo' huku 'nyumba' ikitumiwa kwa maana pana ya watu wa nyumbani mwa Abimeleki.
- source_word: עַל דְּבַר
  choice: kwa sababu ya
  rationale: Katika muktadha huu kirai kinaonyesha sababu ya hukumu.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: mke wa Abrahamu
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili unaohifadhi utambulisho muhimu wa Sara katika simulizi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu; 'Yahweh' hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Sababu ya kufungwa kwa matumbo
  choice: kwa sababu ya Sara
  alternative: kuhusu Sara
  rationale: עַל דְּבַר katika muktadha huu ina nguvu ya kisababishi, lakini tafsiri haiongezi dai kwamba Sara mwenyewe alikuwa na hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Tumbo la uzazi' huhifadhi taswira ya רֶחֶם bila kutumia istilahi ya kitabibu kupita kiasi. Alama ya tanbihi imewekwa mwishoni mwa sentensi kwa sababu inaeleza msisitizo wa kirai cha awali, si jina Sara pekee.
