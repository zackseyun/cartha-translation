base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: sw
  text: Kisha Abrahamu akamwomba Mungu, naye Mungu akamponya Abimeleki, mke wake, na watumishi wake wa kike[a], nao wakazaa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa wake wa kike”; neno la Kiebrania linaweza kutaja watumishi au watumwa wa kike.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nao wakazaa.” Katika muktadha, kuzaa kwao ni matokeo ya uponyaji wa Mungu, lakini uhusiano huo haujaelezwa wazi zaidi katika Kiebrania.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: akamwomba
  rationale: Kitenzi hiki katika muundo wa Hitpaeli humaanisha kusali au kuomba. “Akamwomba Mungu” ni Kiswahili cha kawaida na wazi; muktadha unaonyesha kuwa Abrahamu aliwaombea wengine, lakini wazo hilo halijaelezwa moja kwa moja katika kitenzi chenyewe.
- source_word: אֶל הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa Kiebrania kina kibainishi, hapa neno hili linamtaja Mungu wa kweli; Kiswahili cha kawaida hakihitaji kukitafsiri kibainishi hicho kando.
- source_word: וַיִּרְפָּא
  choice: akamponya
  rationale: Mzizi רפא humaanisha kuponya. Chaguo hili linadumisha maana ya moja kwa moja bila kubainisha maradhi au hali fulani ambayo maandiko hayaitaji hapa.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Hili ni umbo la kawaida la Kiswahili la jina hilo la mtu.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji, ikimtaja mke wa Abimeleki.
- source_word: אַמְהֹתָיו
  choice: watumishi wake wa kike
  rationale: Neno אָמָה linaweza kumaanisha mtumishi wa kike au mtumwa wa kike. Tafsiri hii ni wazi kwa msomaji wa sasa, inadumisha jinsia inayotajwa, na haifichi wala haisisitizi kupita kiasi hadhi yao ya kijamii.
- source_word: וַיֵּלֵדוּ
  choice: nao wakazaa
  rationale: Kitenzi ילד hapa humaanisha kuzaa. Kiunganishi “nao” kinadumisha mtiririko wa simulizi na kuelekeza kwa wanawake waliotajwa bila kuongeza neno “watoto,” ambalo halipo wazi katika Kiebrania.
theological_decisions:
- issue: Uhusiano wa tendo la mwisho na uponyaji
  choice: Kudumisha mfuatano wa Kiebrania kwa kusema “nao wakazaa.”
  alternative: “hivyo wakaweza kuzaa” au “ili wazae”
  rationale: Muktadha, hasa mstari unaofuata, unaonyesha kuwa kuzaa kulitokana na uponyaji wa Mungu. Hata hivyo, Kiebrania hapa kinaunganisha matukio kwa “na,” bila kutaja wazi uhusiano wa matokeo; tafsiri kuu inadumisha mvutano huo badala ya kuufafanua kimyakimya.
- issue: Maana ya hadhi ya kijamii katika אָמָה
  choice: Kutumia “watumishi wake wa kike” katika matini kuu.
  alternative: “watumwa wake wa kike” au “wajakazi wake”
  rationale: Neno la Kiebrania linaweza kutaja watumishi au watumwa wa kike. Chaguo kuu ni la kawaida na lenye heshima katika Kiswahili cha sasa, huku uwezekano wa maana yenye kusisitiza utumwa ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wazi, na wenye hadhi. “Abrahamu,” “Mungu,” na “Abimeleki” yanafuata maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Matini inaepuka lugha ya kale isiyo ya lazima na pia haiongezi ufafanuzi wa kiteolojia ambao haujatamkwa moja kwa moja katika Kiebrania.
