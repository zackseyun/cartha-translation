translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Maswali na shutuma za Abimeleki zimehifadhiwa kwa lugha ya moja kwa moja; tanbihi zinaonyesha maana mbadala bila kupunguza uzito wa kimaadili.
