base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: sw
  text: Kisha Abimeleki akamwita Abrahamu na kumwambia, “Umetutendea nini? Ni dhambi gani nimekutenda dhidi yako[a], hata ukaleta dhambi kubwa juu yangu na juu ya ufalme wangu? Umenitendea mambo ambayo hayapaswi kutendwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimekukosea nini?”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “mambo ambayo hayafanywi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Katika muundo קרא ל־, kitenzi kinaweza kumaanisha kumwita au kum召? 'Akamwita' ni Kiswahili cha kawaida kinachodumisha mtiririko wa simulizi bila kuongeza wazo la amri rasmi lililo katika 'akam召'.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: Umetutendea nini?
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya swali hilo, huku hali timilifu ikionyesha tendo lililofanyika lenye athari ya sasa.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: Nimekutendea dhambi gani
  rationale: חטא hapa ni kufanya kosa au dhambi dhidi ya mtu. Usemi huu unahifadhi uzito wa kimaadili na muundo wa swali wa Kiebrania.
- source_word: כִּי
  choice: hata
  rationale: 'Katika muktadha huu כִּי inaunganisha swali la shutuma na matokeo yake: kitendo cha Abrahamu kimeleta dhambi kubwa. ''Hata'' ni kiunganishi cha asili katika Kiswahili kwa muundo huu.'
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: ukaleta ... juu yangu na juu ya ufalme wangu
  rationale: Hifili ya בוא ina maana ya kusababisha jambo liwajie watu. 'Kuleta juu ya' huhifadhi taswira ya chanzo bila kuifanya isieleweke.
- source_word: חֲטָאָה גְדֹלָה
  choice: dhambi kubwa
  rationale: Neno hili linaweza kumaanisha dhambi, kosa, au hatia; 'dhambi kubwa' linahifadhi uzito wa kimaadili wa kauli ya Abimeleki.
- source_word: מַמְלַכְתִּי
  choice: ufalme wangu
  rationale: '''Ufalme'' ni neno la kawaida na wazi kwa eneo au mamlaka ya kifalme.'
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: mambo ambayo hayapaswi kutendwa
  rationale: 'Muundo wa kutendwa una nguvu ya kikanuni: si mambo yanayofaa kufanywa. Tafsiri hii ni ya asili na inadumisha maana hiyo.'
- source_word: עָשִׂיתָ עִמָּדִי
  choice: Umenitendea
  rationale: Usemi עשה עם/עמד humaanisha kumtendea mtu au kushughulika naye kwa namna fulani; 'umenitendea' ni wa kawaida na unaendana na sauti ya shutuma.
