  rationale: Kitenzi kinaweza kumaanisha kukaa au kuishi mahali; hapa ni mwaliko wa kuchagua makao.
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: popote unapoona panafaa
  rationale: Hutoa maana ya nahau 'palipo pema machoni pako' kwa Kiswahili cha kawaida bila kupoteza uhuru wa uchaguzi unaotolewa.
