  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: sw
  text: Abrahamu akasema kumhusu Sara, mkewe[a], “Yeye ni dada yangu.” Basi Abimeleki, mfalme wa Gerari, akatuma na akamchukua Sara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwambia Sara, mkewe.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kwa namna ya moja kwa moja zaidi, lakini muktadha unapendelea maana kwamba Abrahamu alisema kuhusu Sara, kwa kuwa kauli iliyonukuliwa ni “Yeye ni dada yangu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, Abimeleki alifanya Sara aletwe kwake. Kiebrania husema tu, “akatuma na akamchukua Sara.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni kitenzi cha kawaida cha usimulizi kutoka אמר; “akasema” ni Kiswahili cha asili katika mfululizo wa matukio.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: kumhusu Sara mkewe
  rationale: Ingawa אֶל kwa kawaida humaanisha “kwa,” hapa kauli “Yeye ni dada yangu” inaonyesha kwamba Abrahamu alisema jambo kuhusu Sara. “Kumhusu” huwasilisha maana hiyo bila kudai kwamba alimsemesha Sara moja kwa moja.
- source_word: אֲחֹתִי הִוא
  choice: Yeye ni dada yangu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi kisicho na kitenzi; kiambishi cha nafsi ya kwanza katika “dada” kinawakilishwa na “yangu.”
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: שלח humaanisha “kutuma.” Watu waliotumwa hawatajwi wazi katika Kiebrania, lakini wanadokezwa na tendo la kumchukua Sara; kuwataja hufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: מֶלֶךְ גְּרָר
  choice: mfalme wa Gerari
  rationale: Muundo huu unamtambulisha Abimeleki kwa cheo chake na eneo analotawala.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: wamchukue Sara
  rationale: לקח maana yake ni “kuchukua.” Katika Kiswahili, kuunganisha tendo hili na watu waliotumwa huwasilisha kwa kawaida kwamba Abimeleki alisababisha Sara achukuliwe, bila kuongeza kwamba alimchukua kuwa mke.
theological_decisions:
- issue: Upanuzi unaoweza kufasiri kusudi la Abimeleki
  choice: wamchukue Sara
  alternative: wamchukue Sara awe mke wake
  rationale: Muktadha mpana unaonyesha kusudi la Abimeleki, lakini mstari huu hausemi wazi “awe mke wake.” Tafsiri imehifadhi kitenzi rahisi bila kuongeza kusudi lisilotajwa.
- issue: Abrahamu alisema kuhusu Sara au alimwambia Sara
  choice: akasema kumhusu Sara
  alternative: akamwambia Sara
  rationale: Kihusishi אֶל kinaweza kueleweka kwa njia zote mbili, lakini kauli ya nafsi ya tatu “Yeye ni dada yangu” inapendelea maana ya kusema kuhusu Sara. Uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa usimulizi ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Jina “Gerari” limetumiwa kwa umbo linalofaa mfumo wa sauti wa Kiswahili. Viashiria vya tanbihi vimewekwa mara tu baada ya maneno yanayohusika.
