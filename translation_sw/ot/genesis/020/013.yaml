base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: sw
  text: 'Ikawa Mungu aliponifanya nitangatange kutoka nyumba ya baba yangu[a], nikamwambia, ‘Hii ndiyo fadhili[b] utakayonitendea: kila mahali tutakapofika, sema kunihusu, “Yeye ni ndugu yangu.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliponifanya nipotee njia” / “aliponifanya niende huku na huku.” Kitenzi cha Kiebrania kina maana ya kusababisha mtu kutanga au kupotea; hapa si lazima kidokeze upotovu wa kimaadili.
    reason: lexical_alternative
  - marker: b
    text: “Fadhili” hutafsiri neno la Kiebrania hesed, ambalo pia linaweza kumaanisha upendo mwaminifu au wema wa kudumu kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: aliponisababisha nitangetange
  rationale: Huhifadhi nguvu ya kisababishi ya kitenzi cha Kiebrania na maana ya kutanga bila kudokeza lazima upotovu wa kimaadili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi, muktadha unamrejelea Mungu mmoja wa Abrahamu.
- source_word: מִבֵּית אָבִי
  choice: mbali na nyumba ya baba yangu
  rationale: Kauli hii inahusu kuondoka katika makao na jamaa ya baba; ‘nyumba ya baba yangu’ huhifadhi taswira ya kifamilia ya Kiebrania.
- source_word: חַסְדֵּךְ
  choice: fadhili utakayonitendea
  rationale: Katika ombi hili la kibinafsi, ‘fadhili’ ni tafsiri ya kawaida ya חסד, huku muundo wa Kiswahili ukieleza tendo analoombwa Sara amtendee Abrahamu.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: utakayonitendea
  rationale: Ni Kiswahili cha asili kinachowasilisha maana ya ‘utakayofanya kwangu/pamoja nami’ inapounganishwa na fadhili.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: kila mahali tutakapofika
  rationale: Huwasilisha kwa kawaida maana ya kila sehemu watakayowasili.
- source_word: אִמְרִי לִי
  choice: sema kunihusu
  rationale: Ingawa kihalisi ni ‘sema kwangu/kwa ajili yangu,’ muktadha unaonyesha kwamba Sara aseme jambo kuhusu Abrahamu mbele ya wengine.
- source_word: אָחִי הוּא
  choice: Yeye ni kaka yangu
  rationale: ‘Kaka’ huhifadhi dai mahususi la udugu linalotegemewa na simulizi, badala ya kulipanua kuwa ujamaa kwa jumla.
theological_decisions:
- issue: Mhusika anayesababisha Abrahamu kutangatanga
  choice: Mungu alimfanya Abrahamu atangatange mbali na nyumba ya baba yake
  alternative: Mungu alimruhusu Abrahamu atangatange; miungu ilimfanya atangatange
  rationale: Kiebrania humweka Mungu kama kiima cha kitenzi cha kisababishi. Tafsiri haipunguzi uwakala huo wa Mungu wala kuongeza wazo la kosa la kimaadili. Usomaji wa ‘miungu’ hauafikiani vizuri na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa msomaji wa leo huku ukihifadhi uwakala wa Mungu, taswira ya nyumba ya baba, na maana ya ombi la Abrahamu.
