base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: sw
  text: Je, si yeye mwenyewe aliyeniambia, “Yeye ni dada yangu”? Naye mwenyewe pia alisema, “Yeye ni ndugu yangu.” Nilifanya hivi kwa unyofu wa moyo wangu na usafi wa mikono yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa moyo usio na lawama na mikono safi.” Kiebrania kinatumia nahau za kimaadili na kisheria kuonyesha unyofu na kutokuwa na hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, si ...?
  rationale: Huonyesha swali linalotarajia jibu la kukubali, kwa muundo wa kawaida wa Kiswahili.
- source_word: הוּא
  choice: yeye mwenyewe
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; “mwenyewe” kinahifadhi mkazo huo.
- source_word: אָמַר לִי
  choice: aliyeniambia
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi maana ya kusema jambo kwa msemaji.
- source_word: אֲחֹתִי הִוא
  choice: Yeye ni dada yangu
  rationale: Hutoa dai la uhusiano wa kindugu moja kwa moja bila kuongeza mkazo usiokuwapo.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: Naye mwenyewe pia alisema
  rationale: “Mwenyewe” na “pia” vinahifadhi kwa njia ya asili nguvu ya kiwakilishi huru pamoja na גַּם.
- source_word: אָחִי הוּא
  choice: Yeye ni ndugu yangu
  rationale: “Ndugu” huepuka kudai umri unaoweza kudokezwa na “kaka,” huku rejea ya kiume ikieleweka katika muktadha.
- source_word: בְּתָם לְבָבִי
  choice: kwa unyofu wa moyo wangu
  rationale: “Unyofu” unaonyesha uadilifu na nia ya kweli katika dai la Abimeleki bila kumaanisha kutokuwa na dhambi kabisa.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: na usafi wa mikono yangu
  rationale: Inahifadhi taswira ya Kiebrania ya mikono safi kama ishara ya kutokuwa na hatia katika matendo.
- source_word: עָשִׂיתִי זֹאת
  choice: Nilifanya hivi
  rationale: Wakati uliopita ni wa kawaida na wa moja kwa moja katika utetezi huu wa Abimeleki.
theological_decisions:
- issue: Nahau ya kimaadili na kisheria katika utetezi wa Abimeleki
  choice: Dai limetafsiriwa kuwa “unyofu wa moyo wangu na usafi wa mikono yangu,” likihusishwa na tendo hili.
  alternative: “moyo usio na lawama na mikono safi” au “ukamilifu wa moyo wangu na kutokuwa na hatia kwa mikono yangu”
  rationale: Mstari unawasilisha utetezi wa Abimeleki kuhusu tukio hili, si dai la kutokuwa na dhambi katika maisha yake yote. Taswira na mvutano wa Kiebrania vimehifadhiwa bila kupanua upeo wa dai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali na marudio ya “mwenyewe” yamehifadhi mkazo wa Kiebrania; nahau ya moyo na mikono imebakizwa huku maelezo yakitolewa katika tanbihi.
