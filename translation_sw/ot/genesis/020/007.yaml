  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: sw
  text: Sasa basi, mrudishie huyo mtu mke wake, kwa maana yeye ni nabii, naye atakuombea, nawe utaishi. Lakini usipomrudisha, ujue kwamba hakika utakufa, wewe pamoja na wote walio wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wewe pamoja na vyote vilivyo vyako,” au “wewe pamoja na kila ulicho nacho.” Usemi wa Kiebrania ni mpana; unaweza kuwahusisha watu wa nyumba ya Abimeleki pamoja na kila kilicho mali yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito wa haraka unaoanzisha agizo; ‘Basi sasa’ hubeba maana ya wakati na hitimisho kwa Kiswahili cha kawaida.
- source_word: הָשֵׁב אֵשֶׁת הָאִישׁ
  choice: mrudishie huyo mtu mke wake
  rationale: Hifili ya שוב ina maana ya kumrudisha mtu kwa mwenye haki naye. Muundo huu ni wa asili katika Kiswahili na huhifadhi ‘huyo mtu’ badala ya kubadili mapema kuwa jina.
- source_word: כִּי נָבִיא הוּא
  choice: kwa maana yeye ni nabii
  rationale: כִּי inatoa sababu ya agizo; ‘kwa maana’ huhifadhi uhusiano huo wa maelezo, na נָבִיא ni ‘nabii.’
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: naye atakuombea
  rationale: Yiqtol inaeleweka kama jambo la baadaye/linalofuata, na בַּעַדְךָ inaonyesha sala kwa niaba ya Abimeleki. ‘Atakuombea’ ni wazi na ya asili.
- source_word: וֶחְיֵה
  choice: ili uishi
  rationale: Umbo hili linaonyesha matokeo au kusudi la sala. ‘Ili uishi’ huunganisha kwa wazi sala na kuhifadhiwa kwa uhai bila kulazimisha kuwa ni amri tofauti.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: Lakini usipomrudisha
  rationale: Kanusho pamoja na participle linaonyesha kutotekeleza au kukataa tendo. Kiswahili hutumia kwa asili sharti ‘usipomrudisha’; kiambishi cha yambwa humrejelea mke aliyetajwa.
- source_word: דַּע
  choice: ujue
  rationale: Huhifadhi amri ya moja kwa moja inayoanzisha onyo zito.
- source_word: מוֹת תָּמוּת
  choice: hakika utakufa
  rationale: Infinitive absolute pamoja na kitenzi finite husisitiza uhakika wa kifo; ‘hakika utakufa’ huwasilisha msisitizo huo kwa Kiswahili cha sasa.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: wewe pamoja na wote walio wako
  rationale: Kauli ya Kiebrania ni pana na inaweza kuwahusisha watu wa nyumba pamoja na vilivyo mali yake. Katika tishio la kufa, ‘wote walio wako’ huonyesha hasa watu huku tanbihi ikihifadhi upana wa usemi.
theological_decisions:
- issue: Upeo wa hukumu katika ‘wewe na wote/vyote vilivyo vyako’
  choice: wewe pamoja na wote walio wako
  alternative: wewe pamoja na vyote vilivyo vyako / wewe pamoja na kila ulicho nacho
  rationale: Muktadha wa simulizi unaonyesha hukumu iliyoifikia nyumba ya Abimeleki, hivyo tafsiri inayowahusisha watu inafaa. Hata hivyo, kwa kuwa usemi wa Kiebrania ni mpana, tanbihi inadumisha uwezekano wa kuhusisha pia kila kilicho chake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Maandiko. ‘Mrudishie huyo mtu mke wake’ ni ya asili kuliko kuiga mpangilio wa nomino wa Kiebrania, na ‘hakika utakufa’ huhifadhi msisitizo bila kutumia lugha ya kizamani.
