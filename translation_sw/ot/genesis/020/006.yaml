  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: sw
  text: Mungu akamwambia katika ndoto hiyo[a], “Mimi pia ninajua kwamba ulifanya jambo hili kwa unyoofu wa moyo wako. Nami nilikuzuia usinitendee dhambi. Kwa hiyo sikukuruhusu umguse[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika ndoto.” Kiebrania kinaweza kueleweka bila kuonyesha ndoto maalumu, ingawa uambishaji wake na muktadha vinaunga mkono “katika ndoto hiyo.”
    reason: lexical_alternative
  - marker: b
    text: “Umguse” hapa ni usemi wa staha unaorejelea kuwa na mahusiano ya kingono naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹם
  choice: katika ndoto hiyo
  rationale: Kiambishi cha uambishaji katika Kiebrania na muktadha wa simulizi vinaelekeza kwenye ndoto maalumu ambayo tayari inaendelea. Kiswahili hutumia ‘hiyo’ kuonyesha umaalumu huo kwa kawaida.
- source_word: גַּם אָנֹכִי
  choice: Naam, mimi / Mimi pia
  rationale: Kirai hiki kinatilia mkazo nafsi ya kwanza. Katika tukio la kwanza ‘Naam, mimi’ ni jibu la kawaida kwa madai ya Abimeleki; katika tukio la pili ‘Mimi pia’ linahifadhi marudio na wazo la Mungu mwenyewe kuchukua hatua.
- source_word: בְתָם לְבָבְךָ
  choice: kwa unyoofu wa moyo wako
  rationale: תֹּם ina maana ya ukamilifu wa kimaadili, uadilifu au unyoofu. ‘Unyoofu wa moyo’ huhifadhi tathmini ya nia bila kudai kwamba Abimeleki hakuwa na hatia katika kila jambo.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: nilikuzuia
  rationale: חָשַׂךְ hapa ina maana ya kumzuia mtu asifanye jambo. ‘Nilikuzuia’ ni Kiswahili cha kawaida na kinaonyesha wazi hatua ya Mungu ya kuzuia.
- source_word: מֵחֲטוֹא לִי
  choice: usitende dhambi dhidi yangu
  rationale: Muundo wenye מִן unaonyesha kuzuiwa kufanya tendo, na לִי humtaja Mungu kuwa ndiye anayetendewa dhambi. Tafsiri hii inadumisha wazi lugha ya dhambi iliyomo katika Kiebrania.
- source_word: לֹא נְתַתִּיךָ
  choice: sikukuruhusu
  rationale: נָתַן pamoja na kitenzi-jina hapa ni nahau yenye maana ya kuruhusu. ‘Sikukuruhusu’ ni ya asili na sahihi katika Kiswahili.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: umguse
  rationale: נגע kimsingi ni ‘gusa,’ lakini hapa ni usemi wa staha unaorejelea mahusiano ya kingono. ‘Umguse’ huhifadhi staha na udokezi wa matini ya chanzo.
theological_decisions:
- issue: Maana ya dhambi ‘dhidi yangu’ katika maneno ya Mungu
  choice: Tendo lililokusudiwa linaelezwa kuwa dhambi dhidi ya Mungu.
  alternative: Kulitafsiri kwa ujumla kuwa ‘kunikosea’ au kulenga tu kosa dhidi ya Sara na Abrahamu.
  rationale: לִי humtaja Mungu moja kwa moja kama anayetendewa dhambi. Tafsiri inadumisha upeo huo wa kiteolojia bila kukanusha kwamba tendo hilo lingekuwa pia kosa dhidi ya wanadamu.
- issue: Uhusiano kati ya unyoofu wa nia ya Abimeleki na Mungu kumzuia
  choice: 'Kauli zote mbili zimeachwa pamoja: Mungu anakiri unyoofu wa moyo wake na pia anasema alimzuia kutenda dhambi.'
  alternative: Kueleza kwamba unyoofu wake pekee ulimfanya asiwe na hatia, au kwamba kuingilia kwa Mungu kulibatilisha kabisa unyoofu wake.
  rationale: Matini inashikilia kwa pamoja wajibu na nia ya Abimeleki pamoja na hatua ya Mungu ya kumzuia. Tafsiri haisuluhishi mvutano huo kwa kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. ‘Unyoofu wa moyo’ ni wazi kwa wasomaji wa kawaida huku kikihifadhi uzito wa kimaadili wa המקור. Usemi wa staha ‘umguse’ umehifadhiwa badala ya kufafanuliwa ndani ya mstari.
