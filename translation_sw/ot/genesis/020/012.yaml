base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: sw
  text: Zaidi ya hayo,[a] kwa kweli yeye ni dada yangu—binti ya baba yangu, lakini si binti ya mama yangu—naye akawa mke wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo rasmi zaidi, “Na tena, hakika yeye ni dada yangu, binti ya baba yangu, lakini si binti ya mama yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Zaidi ya hayo
  rationale: Kiunganishi pamoja na chembe ya nyongeza kinaingiza hoja nyingine katika utetezi wa Abrahamu; usemi huu ni wa asili katika Kiswahili na huhifadhi kazi hiyo ya mazungumzo.
- source_word: אָמְנָה
  choice: kwa kweli
  rationale: Kielezi hiki kinasisitiza ukweli wa dai; “kwa kweli” ni lugha ya kawaida, yenye heshima, na inayofaa katika maelezo ya Abrahamu.
- source_word: אֲחֹתִי
  choice: dada yangu
  rationale: Ni neno la moja kwa moja la uhusiano wa kindugu lenye kiambishi cha nafsi ya kwanza umoja.
- source_word: בַת אָבִי
  choice: binti ya baba yangu
  rationale: Kirai hiki kinafafanua maana ambayo Sara ni dada yake Abrahamu na kinadumisha ulinganifu na kirai kinachofuata.
- source_word: הִוא
  choice: yeye ni
  rationale: Kiwakilishi huru katika sentensi isiyo na kitenzi huwasilishwa kwa kawaida kwa wakati wa sasa katika Kiswahili.
- source_word: אַךְ לֹא
  choice: lakini si
  rationale: Chembe hii inaweka mpaka au sifa katika dai; “lakini si” hudumisha utofautishaji wazi bila kulazimisha maana ya upekee mkali.
- source_word: בַת אִמִּי
  choice: binti ya mama yangu
  rationale: Huhifadhi maelezo ya uhusiano wa kifamilia na ulinganifu na “binti ya baba yangu.”
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: naye akawa mke wangu
  rationale: Muundo wa היה pamoja na ל unaonyesha kuingia katika hali ya ndoa; “akawa mke wangu” huhifadhi maana hiyo ya tukio kwa Kiswahili cha kawaida.
theological_decisions: []
