translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa vitenzi vya simulizi umehifadhiwa kwa ‘aka-/waka-’. Hakuna tanbihi iliyohitajika kwa sababu chaguo mbadala za Kiingereza zinaweza kuwasilishwa moja kwa moja kwa Kiswahili bila kupoteza maana muhimu.
