base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: sw
  text: Basi Abimeleki akaamka asubuhi na mapema, akawaita watumishi wake wote, akawaambia mambo hayo yote masikioni mwao; nao wanaume hao wakaogopa sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: akaamka asubuhi na mapema
  rationale: Muunganiko huu wa Kiebrania unaonyesha kuamka mapema asubuhi; usemi wa Kiswahili ni wa kawaida na unaonyesha uharaka wa simulizi.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: akawaita watumishi wake wote
  rationale: Katika muktadha huu עֲבָדָיו inawahusu watumishi wa nyumba au ikulu ya mfalme bila kusisitiza hali ya utumwa; ‘akawaita’ huwasilisha קרא kwa kawaida.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: akawaeleza mambo hayo yote
  rationale: Kitenzi na kirai hiki vinatanguliza yaliyosemwa. ‘Akawaeleza’ ni Kiswahili cha asili kinachoweka wazi kwamba aliwasimulia yaliyokuwa yametokea.
- source_word: בְּאָזְנֵיהֶם
  choice: wakiwa wanasikia
  rationale: Kihalisi ni ‘masikioni mwao,’ lakini ni nahau inayomaanisha kusema mbele yao ili wasikie; tafsiri hii huepuka usemi mgumu wa neno kwa neno.
- source_word: וַיִּירְאוּ ... מְאֹד
  choice: wakaogopa sana
  rationale: Hapa ירא inaonyesha hofu, si heshima ya kidini, na מְאֹד inasisitiza ukubwa wake.
- source_word: הָאֲנָשִׁים
  choice: watu hao
  rationale: Ingawa nomino ya Kiebrania ni ya kiume kwa umbo, katika muktadha inawarejelea watumishi waliotajwa; ‘watu hao’ ni rejeo la kawaida la Kiswahili bila kuingiza kundi jipya.
