base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: sw
  text: Lakini Mungu akamjia Abimeleki katika ndoto usiku, akamwambia, “Tazama, hakika utakufa[a] kwa sababu ya mwanamke uliyemchukua, kwa maana ana mume[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “Tazama, wewe ni mfu” au “Tazama, wewe umekufa.” Kiebrania kinaonyesha kifo kilicho hakika na kinachokaribia.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ameolewa na mume,” yaani, tayari ana mume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akamjia
  rationale: Kitenzi בוא hapa kinaeleza Mungu kumfikia Abimeleki katika tukio la ndoto; “akamjia” ni cha kawaida katika masimulizi na hakidokezi kuingia mahali fulani kimwili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Vitenzi vya umoja na muktadha wa simulizi la Abrahamu vinaonyesha kwamba anayelengwa ni Mungu mmoja.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: katika ndoto usiku
  rationale: Kauli hii ya Kiswahili ni ya asili na huhifadhi wazo la ufunuo uliotokea katika ndoto wakati wa usiku.
- source_word: הִנְּךָ מֵת
  choice: Tazama, hakika utakufa
  rationale: Muundo wa Kiebrania unaonyesha kifo kilicho hakika na kinachokaribia. Kiswahili “hakika utakufa” huwasilisha onyo hilo kwa uwazi bila kutumia kauli isiyo ya kawaida kama “wewe ni mfu.” Tanbihi huhifadhi maana halisi na uwezekano wa kuielewa kama hali ya sasa ya kuhukumiwa.
- source_word: עַל
  choice: kwa sababu ya
  rationale: Kihusishi hiki kinaonyesha sababu ya hukumu inayotangazwa.
- source_word: לָקַחְתָּ
  choice: uliyemchukua
  rationale: “Kumchukua” hudumisha upana wa kitenzi cha Kiebrania bila kuongeza wazo la kutumia nguvu ambalo halijaelezwa wazi.
- source_word: בְּעֻלַת בָּעַל
  choice: ana mume
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kueleza kwamba mwanamke huyo tayari yuko katika uhusiano wa ndoa; tanbihi inaonyesha umbo halisi zaidi la Kiebrania.
theological_decisions:
- issue: Nguvu na wakati wa onyo הִנְּךָ מֵת
  choice: hakika utakufa
  alternative: wewe umekufa / wewe ni mtu wa kufa
  rationale: Kauli ya Kiebrania inaweza kuwasilisha kifo kama hukumu ya hakika na iliyo karibu, bila kulazimisha tofauti kali kati ya sasa na wakati ujao. Tafsiri ya msingi ni ya asili katika Kiswahili, huku tanbihi ikihifadhi mvutano huo.
- issue: Maana ya hali ya ndoa katika בְּעֻלַת בָּעַל
  choice: ana mume
  alternative: ameolewa na mume
  rationale: “Ana mume” hueleza kifungo cha ndoa kilichopo kwa lugha ya kawaida bila kuingiza madai ya ziada kuhusu umiliki au mamlaka; umbo halisi zaidi linawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Tazama” limetumiwa kama alama nzito ya kuvuta fikira, na “hakika utakufa” linaepuka usemi mgumu au unaoweza kueleweka kana kwamba Abimeleki tayari alikuwa amekufa.
