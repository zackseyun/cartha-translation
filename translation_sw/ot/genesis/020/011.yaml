base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: sw
  text: Abrahamu akasema, “Kwa sababu nilisema, ‘Hakika hakuna kumcha Mungu mahali hapa, nao wataniua kwa sababu ya mke wangu.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaanzisha sababu ya Abrahamu kufanya udanganyifu wake; ‘kwa sababu’ ni ya kawaida na wazi katika Kiswahili.
- source_word: אָמַרְתִּי
  choice: nilifikiri
  rationale: Ingawa maana ya msingi ni ‘nilisema,’ hapa usemi unaonyesha wazo la ndani la Abrahamu. ‘Nilifikiri’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai kwamba alisema kwa sauti.
- source_word: רַק
  choice: hakika
  rationale: Katika muktadha huu neno linaimarisha dhana ya Abrahamu; ‘hakika’ huleta mkazo huo kwa lugha ya kawaida.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: hakuna kumcha Mungu
  rationale: Huhifadhi nahau ya kibiblia na uzito wake wa kimaadili na kidini, huku ikiwa Kiswahili cha kawaida.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Ni tafsiri ya moja kwa moja, fupi, na ya kawaida ya kirai cha mahali.
- source_word: וַהֲרָגוּנִי
  choice: nao wataniua
  rationale: Huwasilisha matokeo ambayo Abrahamu alitarajia katika wazo lake; wakati ujao unafaa ndani ya nukuu hiyo.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: kwa sababu ya mke wangu
  rationale: Kirai hiki kina maana ya ‘kwa sababu ya’ au ‘kwa ajili ya’; hapa ‘kwa sababu ya’ kinaeleza wazi kuwa mke wake ndiye aliyekuwa kichocheo cha hatari aliyohofia.
theological_decisions:
- issue: Tafsiri ya יִרְאַת אֱלֹהִים
  choice: kumcha Mungu
  alternative: kumheshimu Mungu
  rationale: ‘Kumcha Mungu’ huhifadhi nahau ya kibiblia na mvutano wake wa hofu, heshima, na uwajibikaji wa kimaadili mbele za Mungu, badala ya kuipunguza kuwa heshima pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nilifanya hivyo’ limeongezwa kwa uwazi wa uhusiano wa kisababishi katika jibu la Abrahamu, bila kubadili hoja yake. Hakuna tanbihi iliyohitajika kwa kuwa ‘kumcha Mungu’ ni nahau iliyo wazi na ya kawaida katika Kiswahili.
