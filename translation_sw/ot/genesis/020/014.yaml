base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: sw
  text: Ndipo Abimeleki akachukua kondoo na ng’ombe, watumwa wa kiume na wa kike, akampa Abrahamu; kisha akamrudishia Sara, mke wa Abrahamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח kwa kawaida humaanisha ‘kuchukua’; hapa kinaendeleza mfululizo wa simulizi bila kuongeza maana isiyokuwapo.
- source_word: צֹאן
  choice: kondoo
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; ‘kondoo’ ni tafsiri fupi na ya kawaida katika orodha hii, ingawa upana wa neno la Kiebrania unapungua kidogo.
- source_word: בָקָר
  choice: ng’ombe
  rationale: בָקָר hurejelea mifugo ya jamii ya ng’ombe kwa ujumla; ‘ng’ombe’ ni neno la kawaida na wazi katika Kiswahili.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: watumwa wa kiume na wa kike
  rationale: Maneno haya yanaweza kumaanisha watumishi au watumwa, lakini kutolewa kwao pamoja na mifugo kunafanya hali yao ya utumwa kuwa dhahiri; tafsiri hii pia inadumisha utofautishaji wa jinsia.
- source_word: וַיִּתֵּן לְאַבְרָהָם
  choice: akampa Abrahamu
  rationale: Kiswahili huunganisha kiambishi cha yambwa na kitenzi; vitu na watu waliotajwa ndio kitu kilichotolewa.
- source_word: וַיָּשֶׁב לוֹ
  choice: akamrudishia
  rationale: Hifili ya שוב ina maana ya kusababisha arudi au kurejesha. ‘Akamrudishia’ huonyesha kwa kawaida kwamba Sara alirudishwa kwa Abrahamu.
- source_word: אֵת שָׂרָה אִשְׁתּוֹ
  choice: Sara, mke wake
  rationale: Kirai kinaweka ‘mke wake’ kama maelezo ya Sara; kiwakilishi kinamhusu Abrahamu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya mfululizo ‘akachukua… akampa… akamrudishia’ unafuata mtiririko wa simulizi la Kiebrania. ‘Watumwa’ limetumiwa badala ya ‘watumishi’ ili kutoficha hali ya kijamii inayoashiriwa na muktadha wa kuwatoa pamoja na mifugo.
