  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: sw
  text: Abrahamu akasafiri kutoka huko kuelekea Negebu[a], akakaa kati ya Kadeshi na Shuri; akaishi kama mgeni huko Gerari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusini.” Neno la Kiebrania linaweza kutaja ama eneo la kusini linaloitwa Negebu au mwelekeo wa kusini kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע מִשָּׁם
  choice: akaondoka huko
  rationale: Kitenzi נסע katika mfuatano wa simulizi huonyesha kuondoka na kuanza safari kutoka mahali fulani; usemi huu ni wa kawaida katika Kiswahili na unadumisha mwendo wa simulizi.
- source_word: אַרְצָה הַנֶּגֶב
  choice: akaelekea Negebu
  rationale: He ya mwelekeo katika אַרְצָה huonyesha mwendo kuelekea eneo fulani, na הַנֶּגֶב hapa yaelekea kutaja eneo la kusini linaloitwa Negebu, huku uwezekano wa maana ya jumla 'kusini' ukihifadhiwa katika tanbihi.
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: ישב inaweza kumaanisha kukaa au kuishi mahali; 'akakaa' ni ya asili na haidai kwa lazima makazi ya kudumu.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: kati ya Kadeshi na Shuri
  rationale: Huu ni ubainishaji wa moja kwa moja wa eneo; majina ya mahali yametoholewa kwa tahajia inayosomeka kwa Waswahili.
- source_word: וַיָּגָר
  choice: akaishi kama mgeni
  rationale: גור humaanisha kuishi mahali kama mtu asiye mwenyeji au mkazi wa muda; tafsiri hii huhifadhi maana hiyo kuliko kusema tu 'akaishi.'
- source_word: בִּגְרָר
  choice: huko Gerari
  rationale: Kiambishi ב ni cha mahali, na 'huko' huunganisha sentensi kwa Kiswahili cha kawaida huku Gerari likiwa jina la mahali.
