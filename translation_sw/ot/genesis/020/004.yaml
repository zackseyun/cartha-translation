  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: sw
  text: Abimeleki hakuwa amemkaribia[a], basi akasema, “Bwana, je, utaua hata taifa la haki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kumkaribia” hapa ni nahau ya Kiebrania inayomaanisha kufanya naye ngono.
    reason: cultural_note
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: hakuwa amemkaribia
  rationale: Inahifadhi nahau ya Kiebrania ya ‘kumkaribia,’ huku muktadha ukionyesha kwamba inamaanisha kutofanya naye ngono.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Ni namna ya kawaida na yenye heshima ya kumwita Mungu hapa bila kuongeza neno lisilokuwamo katika Kiebrania.
- source_word: גּוֹי
  choice: taifa
  rationale: Neno hili ni la kijumla kwa kundi la watu au taifa, na linadumisha upeo wa pamoja wa ombi la Abimeleki.
- source_word: גַּם
  choice: hata
  rationale: 'Linaonyesha msisitizo wa swali la balagha: ‘hata taifa lenye haki?’'
- source_word: צַדִּיק
  choice: lenye haki
  rationale: Inahifadhi maana ya msingi ya uadilifu au kutokuwa na hatia bila kuifungia katika maana moja tu.
- source_word: תַּהֲרֹג
  choice: utaua
  rationale: Wakati ujao katika swali la moja kwa moja unawasilisha kwa kawaida nguvu ya kauli ya Kiebrania.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: Lakini Abimeleki ... Basi akasema
  rationale: ‘Lakini’ linaonyesha utofauti muhimu kati ya tishio la hukumu na ukweli kwamba Abimeleki hakuwa amemkaribia; ‘basi’ linaendeleza matokeo ya hali hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Upeo wa pamoja wa ‘taifa’ katika ombi la Abimeleki
  choice: taifa
  alternative: watu; jamaa ya nyumbani
  rationale: Kiebrania kinatumia jina la kijumla. ‘Taifa’ linadumisha wazo kwamba hukumu inaweza kuwahusu watu wengi, bila kuamua ukubwa kamili wa kundi hilo.
- issue: Maana ya צַדִּיק katika dai la Abimeleki
  choice: lenye haki
  alternative: lisilo na hatia
  rationale: ‘Lenye haki’ linahifadhi upana na mvutano wa neno la Kiebrania, ambalo katika muktadha linaweza kusisitiza kutokuwa na hatia katika jambo hili bila kutangaza ukamilifu wa maadili kwa kila hali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa katika sentensi mbili ili usomeke kwa urahisi. Alama ya tanbihi [a] imo katika matini na inaeleza nahau bila kuondoa taswira yake katika tafsiri.
