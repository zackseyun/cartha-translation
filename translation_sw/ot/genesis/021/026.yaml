  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: sw
  text: Abimeleki akasema, “Sikujua ni nani aliyefanya jambo hili. Wewe pia hukuniambia, nami mwenyewe sikusikia habari yake mpaka leo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kiambishi simulizi wa- kinaendeleza masimulizi; ‘akasema’ ni njia ya kawaida na yenye heshima katika Kiswahili.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: לֹא יָדַעְתִּי
  choice: Sikujua
  rationale: Qatal inaonyesha kutokujua kwa Abimeleki kabla ya kauli hii; wakati uliopita wa Kiswahili unafaa.
- source_word: מִי עָשָׂה
  choice: ni nani aliyefanya
  rationale: Hutambulisha mtu asiyejulikana aliyetenda kitendo; muundo huu ni wa asili katika Kiswahili.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דבר hapa ni tukio au suala linalobishaniwa; ‘jambo’ huhifadhi upana wa maana bila kulifafanua kupita kiasi.
- source_word: וְגַם אַתָּה
  choice: Wewe pia
  rationale: ‘Pia’ pamoja na kiwakilishi cha wazi ‘wewe’ huhifadhi msisitizo na wazo la kujumlisha lililo katika גַם.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: hukuniambia
  rationale: הגיד humaanisha kusema, kutoa taarifa, au kujulisha; ‘hukuniambia’ ni ya kawaida na sahihi katika mazungumzo haya.
- source_word: וְגַם אָנֹכִי
  choice: nami mwenyewe
  rationale: ‘Nami’ huhifadhi וְגַם, na ‘mwenyewe’ huonyesha msisitizo wa kiwakilishi kamili אָנֹכִי.
- source_word: לֹא שָׁמַעְתִּי
  choice: sikusikia habari yake
  rationale: Katika muktadha huu ‘kusikia’ ni kupata taarifa kuhusu jambo; ‘habari yake’ huweka wazi yambwa iliyodokezwa.
- source_word: בִּלְתִּי הַיּוֹם
  choice: mpaka leo
  rationale: Kirai kinaonyesha kwamba hakuwa amepata habari kabla ya siku hiyo; ‘mpaka leo’ ni tafsiri ya kawaida na wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Sentensi inadumisha msisitizo wa ‘wewe pia’ na ‘nami mwenyewe’ bila kuongeza ufafanuzi wa kimadhehebu.
