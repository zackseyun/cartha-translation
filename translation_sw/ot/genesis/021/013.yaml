base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: sw
  text: Nami nitamfanya mwana wa mtumwa huyo wa kike[a] kuwa taifa, kwa sababu yeye ni uzao wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwana wa mjakazi huyo” au “mwana wa mwanamke mtumishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Pia ... nitamfanya
  rationale: Muundo huu unaendeleza ahadi iliyotangulia na kuhifadhi maana ya nyongeza ya וְגַם kwa Kiswahili cha kawaida.
- source_word: אֶת בֶּן הָאָמָה
  choice: mwana wa mtumwa huyo wa kike
  rationale: בֶּן ni “mwana,” na אָמָה humaanisha mwanamke aliye katika hali ya utumwa au utumishi wa chini. “Mtumwa wa kike” haifichi hali yake ya kijamii; “huyo” humrejelea mwanamke aliyetajwa katika muktadha.
- source_word: לְגוֹי
  choice: kuwa taifa
  rationale: 'Pamoja na שׂים, kihusishi לְ kinaonyesha matokeo: mwana huyo atafanywa awe taifa.'
- source_word: אֲשִׂימֶנּוּ
  choice: nitamfanya
  rationale: Katika muktadha huu שׂים ina maana ya kumweka au kumfanya mtu awe katika hali fulani; “nitamfanya” ni ya asili na sahihi.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי inatoa sababu ya ahadi kuhusu mwana huyo.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: זֶרַע hapa humaanisha mtoto au mzao wa Abrahamu. “Uzao” huhifadhi upana wa neno bila kulifanya kuwa “mbegu” halisi.
- source_word: הוּא
  choice: yeye ni
  rationale: 'Kiwakilishi kilicho wazi katika Kiebrania kinahifadhiwa ili kutoa mkazo wa kawaida: yeye ni uzao wako.'
theological_decisions:
- issue: Tafsiri ya אָמָה na hali ya kijamii ya Hagari
  choice: mtumwa huyo wa kike
  alternative: mjakazi huyo / mtumishi huyo wa kike
  rationale: Neno la Kiebrania linaonyesha mwanamke mwenye hadhi ya chini aliye chini ya mamlaka ya mwingine. “Mtumwa wa kike” linaweka wazi hali hiyo bila kuipunguza, huku tanbihi ikitaja tafsiri nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku mkazo na uhusiano wa kisababishi wa Kiebrania ukihifadhiwa.
