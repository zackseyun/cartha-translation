base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: sw
  text: Sara akasema, “Mungu ameniletea kicheko; kila atakayesikia atacheka pamoja nami.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila atakayesikia atanicheka,” au “atacheka kwa ajili yangu.” Kiebrania kinaruhusu maana hizi, lakini katika muktadha huu yaelekea zaidi kuwa watu watashiriki furaha ya Sara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: akasema
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza tukio; “akasema” ni njia ya kawaida na ya asili ya Kiswahili kuonyesha mwendelezo huo.
- source_word: שָׂרָה
  choice: Sara
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: צְחֹק
  choice: kicheko
  rationale: Nomino “kicheko” huhifadhi umbo la nomino na mwangwi wa mzizi unaorudiwa katika יִצְחַק, unaohusiana pia na jina Isaka.
- source_word: עָשָׂה לִי
  choice: ameniletea
  rationale: Ingawa Kiebrania kinasema kihalisi “amenifanyia,” Kiswahili cha kawaida husema “ameniletea kicheko”; maana ya kuwa Mungu ndiye aliyesababisha kicheko kwa faida ya Sara inahifadhiwa.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu mmoja, hivyo umoja “Mungu” unafaa.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: kila atakayesikia
  rationale: Umoja wa Kiebrania una maana ya ujumla na usambazaji; “kila atakayesikia” ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: יִצְחַק
  choice: atacheka
  rationale: Kitenzi “cheka” huhifadhi maana ya msingi na mchezo wa maneno na “kicheko” pamoja na jina Isaka.
- source_word: לִי
  choice: pamoja nami
  rationale: Katika muktadha wa furaha baada ya kuzaliwa kwa Isaka, hii ndiyo maana inayowezekana zaidi; hata hivyo, dative ya Kiebrania inaweza pia kueleweka kuwa “kwa ajili yangu” au “juu yangu,” hivyo utata umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Maana ya יִצְחַק לִי katika kishazi cha mwisho
  choice: 'kushiriki kicheko cha furaha: “atacheka pamoja nami”'
  alternative: “atanicheka” au “atacheka kwa ajili yangu”
  rationale: Muktadha wa kuzaliwa kwa Isaka na kauli iliyotangulia kuhusu Mungu kumletea Sara kicheko unaelekea kwenye furaha ya pamoja. Hata hivyo, Kiebrania hakiondoi kabisa maana nyingine, kwa hiyo zimetunzwa katika tanbihi badala ya kufutwa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kicheko/atacheka” limetumiwa kuhifadhi urudiaji wa mzizi wa Kiebrania na mwangwi wa jina Isaka. Alama ya tanbihi imewekwa baada ya nukuu inayohusika.
