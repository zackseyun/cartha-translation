  text: And Abraham said[a], “I swear it.”
translation:
  language: sw
  text: Abrahamu akasema[a], “Nitaapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naapa,” au “Nitakula kiapo.”
