lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Waw-consecutive inaendeleza simulizi; “akasema” ni muundo wa kawaida na wa asili katika masimulizi ya Kiswahili.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili sanifu.
- source_word: אָנֹכִי
  choice: ni- (katika “Nitaapa”)
  rationale: Kiwakilishi huru kinasisitiza mhusika wa nafsi ya kwanza, lakini Kiswahili kwa kawaida hukibeba ndani ya kitenzi; kutaja “mimi” hapa kungeweza kuongeza mkazo usio wa lazima.
- source_word: אִשָּׁבֵעַ
  choice: Nitaapa
  rationale: Nifali ya שבע humaanisha kuapa au kula kiapo. Imperfekti hapa ni jibu la kukubali ombi lililotangulia, hivyo wakati ujao “Nitaapa” unaonyesha azimio hilo kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha fupi, ya heshima na ya kawaida katika simulizi. “Kuapa” limetumiwa moja kwa moja, huku “kula kiapo” likihifadhiwa kama badala ya kileksika.
