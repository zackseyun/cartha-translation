lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Naye akasema
  rationale: Muundo huu unaendeleza simulizi kwa njia ya kawaida ya Kiswahili huku kiwakilishi cha kike kikieleweka kutokana na muktadha.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: Ni nani ambaye angemwambia Abrahamu
  rationale: Swali hili la balagha linaonyesha mshangao kuhusu jambo ambalo halikutarajiwa; hali ya masharti katika ‘angemwambia’ inaleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: הֵינִיקָה
  choice: angenyonyesha
  rationale: Kitenzi hiki katika Hifili humaanisha kumpa mtoto maziwa ya mama; ‘kunyonyesha’ ndilo neno la kawaida na sahihi katika Kiswahili.
- source_word: בָנִים
  choice: watoto
  rationale: Ingawa neno la Kiebrania kwa kawaida humaanisha ‘wana,’ wingi wake baada ya ‘kunyonyesha’ unarejelea watoto kwa namna ya jumla; sentensi inayofuata inabainisha kwamba mtoto aliyezaliwa ni mwana.
- source_word: שָׂרָה
  choice: Sara
  rationale: Jina limetolewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: כִּי
  choice: Maana
  rationale: Hapa kiunganishi kinaanzisha sababu au msingi wa mshangao uliotangulia, si utofautishaji.
- source_word: יָלַדְתִּי
  choice: nimemzalia
  rationale: Wakati timilifu unaonyesha tukio lililokamilika lenye matokeo ya sasa; kiambishi cha mtendewa kinaonyesha kwa kawaida kwamba Sara amemzalia Abrahamu mtoto.
- source_word: בֵן
  choice: mwana
  rationale: Hili ni neno la moja kwa moja linalofaa katika muktadha wa uhusiano wa kifamilia.
- source_word: לִזְקֻנָיו
  choice: katika uzee wake
  rationale: Huu ndio usemi wa kawaida wa Kiswahili unaoeleza kwamba Abrahamu alikuwa na umri mkubwa mtoto huyo alipozaliwa.
