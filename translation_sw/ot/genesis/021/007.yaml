  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: sw
  text: Akasema, “Ni nani ambaye angemwambia Abrahamu kwamba Sara angenyonyesha watoto?[a][b] Maana nimezaa mwana katika uzee wa Abrahamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana.” Hapa limetafsiriwa “watoto” kwa sababu usemi “kunyonyesha wana” unatumika kwa maana ya jumla katika muktadha huu, ilhali kishazi kinachofuata kinabainisha kwamba mtoto huyo alikuwa mwana.'
    reason: lexical_alternative
  - marker: b
    text: Au, “Ni nani aliyekuwa amemwambia Abrahamu kwamba Sara angenyonyesha wana?”
