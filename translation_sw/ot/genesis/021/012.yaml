base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: sw
  text: Lakini Mungu akamwambia Abrahamu, “Usihuzunike[a] kwa sababu ya huyo kijana wala kwa sababu ya mtumwa wako wa kike. Lolote Sara atakalokuambia, msikilize[b], kwa maana kupitia Isaka uzao wako utaitwa[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “Lisikuwe baya machoni pako kwa sababu ya kijana”; yaani, usione jambo hilo kuwa la kuhuzunisha au lisilopendeza.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “sikiliza sauti yake”; yaani, zingatia yale Sara anayosema.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa maana katika Isaka uzao wako utaitwa.” Kauli hii inautambulisha uzao wa Abrahamu kupitia Isaka.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: Usihuzunike
  rationale: Nahau ya Kiebrania inaeleza jambo kuwa la kuhuzunisha au kutopendeza kwa mtu. ‘Usihuzunike’ ni Kiswahili cha kawaida na huwasilisha uzito wa hisia bila kulazimisha taswira isiyo ya kawaida ya ‘machoni pako.’
- source_word: הַנַּעַר
  choice: huyo kijana
  rationale: Neno נַעַר humaanisha mvulana au kijana. ‘Huyo kijana’ linamrejelea Ishmaeli kwa lugha ya sasa na ya kawaida.
- source_word: אֲמָתֶךָ
  choice: mtumwa wako wa kike
  rationale: Neno אָמָה humtaja mwanamke aliye katika hali ya utumwa au utumishi wa kumilikiwa. Tafsiri hii haifichi hadhi ya Hagara ya kutokuwa huru.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: msikilize
  rationale: Kauli hiyo kwa neno halisi ni ‘sikiliza sauti yake,’ lakini ni nahau ya kumaanisha kusikia na kuzingatia anayosema. ‘Msikilize’ ni ya asili katika Kiswahili na haiongezi nguvu ya lazima ya neno ‘mtii.’
- source_word: בְּיִצְחָק
  choice: kupitia Isaka
  rationale: Kihusishi ב hapa kinaweza kuonyesha njia au ukoo ambao kupitia kwake uzao wa Abrahamu unatambulishwa. ‘Kupitia Isaka’ huwasilisha maana hiyo wazi bila kuondoa kabisa uwezekano wa usemi wa karibu zaidi ‘katika Isaka.’
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: uzao wako utaitwa
  rationale: Kauli inadumisha wazo la kuitwa au kuteuliwa kuwa uzao wa Abrahamu. Haisemi kwamba Ishmaeli si mwana wake wa kimwili, bali inatambulisha mstari wa ahadi kupitia Isaka.
- source_word: זָרַע
  choice: uzao
  rationale: ‘Uzao’ linaweza kufanya kazi kama nomino ya pamoja, kama זֶרַע, na ni la kawaida katika Kiswahili cha Biblia na lugha rasmi.
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Lakini Mungu akamwambia
  rationale: ‘Lakini’ huonyesha utofauti na huzuni ya Abrahamu katika mstari uliotangulia, huku ‘akamwambia’ ikiendeleza simulizi.
theological_decisions:
- issue: Hadhi ya Hagara
  choice: mtumwa wako wa kike
  alternative: mjakazi wako
  rationale: Neno kuu linahifadhi hali ya Hagara ya kutokuwa huru badala ya kuilegeza kuwa tu kazi ya nyumbani. Hata hivyo, haliongezi maelezo kuhusu mfumo wa utumwa zaidi ya yaliyomo katika neno la Kiebrania.
- issue: Maana ya ahadi kuhusu uzao
  choice: kwa maana kupitia Isaka uzao wako utaitwa
  alternative: kwa maana katika Isaka uzao utaitwa kuwa wako
  rationale: Tafsiri inadumisha lugha ya ‘kuitwa’ na mvutano uliopo kati ya uhusiano wa Abrahamu na Ishmaeli kwa upande wa mwili na uteuzi wa mstari wa ahadi kupitia Isaka. Haibadili kauli hiyo kuwa ufafanuzi finyu wa kimafundisho.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa usawa bora: nahau zisizo za asili zimewasilishwa kwa Kiswahili kinachoeleweka, huku maumbo muhimu ya Kiebrania—hasa ‘sauti,’ ‘katika/kupitia Isaka,’ na ‘utaitwa’—yakihifadhiwa au kuonyeshwa katika tanbihi.'
