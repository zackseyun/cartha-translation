base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: sw
  text: Mungu alikuwa pamoja na huyo kijana, naye akakua. Aliishi nyikani, akawa mpiga upinde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: Mungu alikuwa pamoja na huyo kijana
  rationale: Nahau היה את inaonyesha uwepo wenye msaada. “Alikuwa pamoja na” ni Kiswahili cha kawaida na huhifadhi uthibitisho wa maandiko kuhusu uwepo wa Mungu bila kuongeza maelezo ya kiteolojia. “Huyo kijana” humrejelea Ishmaeli aliyetajwa katika muktadha.
- source_word: וַיִּגְדָּל
  choice: naye akakua
  rationale: Kitenzi גדל hapa kinaeleza kukua kwa kijana. “Akakua” ni cha asili, kifupi, na hakiongezi maana ya ukuu ambayo muktadha hauhitaji.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: Aliishi nyikani
  rationale: ישב hapa ni kuishi au kukaa kwa muda, na מִדְבָּר ni eneo la pori kame lisilokaliwa sana. “Nyikani” huhifadhi upana huo kuliko “jangwani,” ambalo linaweza kueleweka kuwa jangwa tupu tu.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: akawa mpiga upinde
  rationale: Muundo huu unamweleza mtu anayepiga au kutumia upinde. “Mpiga upinde” ni Kiswahili wazi na cha sasa, huku kikihifadhi kwa karibu taswira halisi ya Kiebrania.
theological_decisions:
- issue: Kauli ya uwepo wa Mungu pamoja na Ishmaeli
  choice: Mungu alikuwa pamoja na huyo kijana
  alternative: Mungu alimsaidia huyo kijana
  rationale: Tafsiri iliyochaguliwa huhifadhi kauli pana ya uwepo na uungaji mkono wa Mungu, bila kuibana iwe tendo la msaada pekee wala kuipanua kuwa hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimeunganishwa kwa mtiririko wa kawaida wa simulizi; “nyikani” na “mpiga upinde” ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kuwa ya kizamani.
