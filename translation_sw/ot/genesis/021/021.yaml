  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: sw
  text: Akaishi katika nyika ya Parani, na mama yake akamtafutia mke kutoka nchi ya Misri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Akaishi
  rationale: Kitenzi ישׁב kinaweza kumaanisha kukaa au kuishi. Katika muhtasari huu wa simulizi, “akaishi” ni Kiswahili cha kawaida kinachoonyesha makao bila kudokeza makazi ya kudumu kupita kiwango cha Kiebrania.
- source_word: בְּמִדְבַּר פָּארָן
  choice: katika nyika ya Parani
  rationale: מִדְבָּר humaanisha eneo la pori, nyika, au jangwa. “Nyika” ni pana na la kawaida katika simulizi la kibiblia; jina Parani limetoholewa kwa tahajia ya Kiswahili.
- source_word: וַתִּקַּח לֹו
  choice: akamtafutia
  rationale: Kwa maana ya msingi, לקח ni “chukua,” lakini pamoja na לוֹ na אִשָּׁה katika muktadha huu inaonyesha mama kumpatia mwanawe mwenzi wa ndoa. “Akamtafutia” ni ya asili katika Kiswahili na haidai kwa lazima kwamba yeye ndiye aliyemchagua.
- source_word: אִמּוֹ
  choice: mama yake
  rationale: Huhifadhi wazi nomino na umilikaji wa Kiebrania.
- source_word: אִשָּׁה
  choice: mke
  rationale: אִשָּׁה linaweza kuwa “mwanamke” au “mke”; muktadha wa kumtafutia mtu mwanamke unaonyesha mpango wa ndoa, hivyo “mke” ndiyo maana inayofaa hapa.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: kutoka nchi ya Misri
  rationale: Huhifadhi neno אֶרֶץ, “nchi,” na kutoa usemi wa kawaida wa Kiswahili.
