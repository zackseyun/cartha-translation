base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: sw
  text: Basi wakafanya agano huko Beer-sheba[a]. Kisha Abimeleki akainuka pamoja na Fikoli, mkuu wa jeshi lake, nao wakarudi katika nchi ya Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, Kiebrania kinasema, “wakakata agano,” nahau yenye maana ya kufanya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: wakafanya agano
  rationale: Hii ni nahau ya Kiebrania ambayo kwa neno moja moja ni ‘wakakata agano.’ Kiswahili cha sasa hueleza maana yake kwa kawaida na kwa uwazi kwa kusema ‘kufanya agano.’
- source_word: בִּבְאֵר שָׁבַע
  choice: huko Beer-sheba
  rationale: Kihusishi ב kinaweza kumaanisha ‘katika’ au ‘huko/mahali.’ ‘Huko’ linafaa kwa eneo lililotajwa katika simulizi, huku jina la mahali likihifadhiwa kwa unukuzi.
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום humaanisha kuinuka au kusimama. ‘Akainuka’ kinadumisha mfuatano wa simulizi na hadhi ya lugha bila kuwa cha kizamani.
- source_word: וּפִיכֹל
  choice: pamoja na Fikoli
  rationale: Ingawa ו ni ‘na,’ usemi ‘pamoja na Fikoli’ unaonyesha kwa kawaida kwamba Fikoli aliandamana na Abimeleki na unaandaa kitenzi cha wingi kinachofuata.
- source_word: שַׂר צְבָאוֹ
  choice: mkuu wa jeshi lake
  rationale: שַׂר ni kiongozi au mkuu, na צָבָא hapa ni jeshi. ‘Mkuu wa jeshi lake’ ni usemi wa wazi na wa kawaida katika Kiswahili.
- source_word: וַיָּשֻׁבוּ
  choice: nao wakarudi
  rationale: שׁוב hapa humaanisha kurudi. Kiwakilishi ‘nao’ kinaweka wazi kwamba Abimeleki na Fikoli ndio waliorejea.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: katika nchi ya Wafilisti
  rationale: Tafsiri hii inadumisha namna ya Kiebrania ya kutaja eneo kwa watu wanaokaa humo, badala ya kulibadili kuwa jina la eneo tu.
