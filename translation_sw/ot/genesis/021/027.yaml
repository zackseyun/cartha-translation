base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: sw
  text: Basi Abrahamu akachukua kondoo na ng’ombe, akampa Abimeleki, nao wawili wakafanya agano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, “walikata agano,” nahau ya kawaida ya Kiebrania yenye maana ya kufanya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח hapa kina maana ya kawaida ya ‘kuchukua’; umbo la ‘aka-’ linaendeleza mfuatano wa simulizi kwa Kiswahili cha asili.
- source_word: צֹאן
  choice: kondoo
  rationale: צֹאן humaanisha mifugo midogo, hasa kondoo na mbuzi. ‘Kondoo’ ni tafsiri fupi na ya kawaida inayotofautishwa wazi na ng’ombe wanaotajwa baadaye.
- source_word: וּבָקָר
  choice: na ng’ombe
  rationale: בָּקָר humaanisha mifugo mikubwa, hasa ng’ombe; ‘ng’ombe’ ni neno la kawaida na linaloeleweka kwa urahisi.
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  choice: akampa Abimeleki
  rationale: נתן ni ‘kutoa/kumpa’ katika muktadha huu. ‘Akampa Abimeleki’ ni Kiswahili cha kawaida na hakiongezi wazo la sherehe ambalo halijasemwa wazi katika Kiebrania.
- source_word: וַיִּכְרְתוּ שְׁנֵיהֶם בְּרִית
  choice: nao wawili wakafanya agano
  rationale: שְׁנֵיהֶם inawataja wazi wahusika wote wawili. Nahau כרת ברית, kwa neno moja moja ‘kukata agano,’ inaelezwa kwa Kiswahili cha sasa kama ‘kufanya agano,’ huku usemi halisi ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya nahau ya agano כרת ברית
  choice: wakafanya agano
  alternative: walikata agano
  rationale: ‘Kufanya agano’ huwasilisha maana ya nahau kwa Kiswahili cha kawaida, bila kupoteza uzito wa neno kuu ‘agano.’ Tanbihi inaonyesha kwa uwazi taswira halisi ya Kiebrania bila kulazimisha usemi usio wa kawaida katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Jina Abimeleki limetoholewa kwa tahajia ya kawaida ya Kiswahili. Alama ya tanbihi imewekwa baada ya ‘agano,’ ambako nahau inayofafanuliwa inatokea.
