  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: sw
  text: Kwa hiyo akapaita mahali pale Beer-sheba[a], kwa sababu huko wote wawili waliapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Beer-sheba kwa Kiebrania linasikika kama maneno yanayomaanisha “kisima cha saba” na pia “kisima cha kiapo”; maelezo hapa yanahusianisha jina hilo hasa na kiapo walichoapa huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kirai hiki kinaonyesha matokeo na sababu ya jina; “Kwa hiyo” ni cha kawaida na huunganisha sentensi vizuri.
- source_word: קָרָא
  choice: akapaita
  rationale: Katika muktadha huu kitenzi kina maana ya kuita au kupatia jina; “akapaita” kinabaki karibu na muundo wa Kiebrania na ni cha asili katika Kiswahili.
- source_word: לַמָּקוֹם הַהוּא
  choice: mahali pale
  rationale: Huhifadhi rejeleo la mahali maalumu lililotajwa katika muktadha pamoja na nguvu ya kiashiria הַהוּא.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-sheba
  rationale: Jina limetoholewa badala ya kutafsiriwa, huku kistari kikisaidia kuonyesha vipashio vya jina na tanbihi ikieleza mchezo wa maneno wa Kiebrania.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huanzisha sababu ya kuitwa kwa mahali hapo kwa lugha iliyo wazi na ya sasa.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea kwa kawaida mahali pale palipotajwa.
- source_word: נִשְׁבְּעוּ
  choice: waliapa
  rationale: Nifali ya שבע hapa ina maana ya kuapa; “waliapa” ni fupi, wazi, na ya asili, huku tanbihi ikihifadhi uhusiano wa neno hilo na jina.
- source_word: שְׁנֵיהֶם
  choice: wote wawili
  rationale: Huhifadhi msisitizo wa Kiebrania kwamba wahusika wawili, kila mmoja wao, waliapa.
