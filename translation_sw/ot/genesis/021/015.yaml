translation:
  language: sw
  text: Maji yalipoisha katika kiriba[a], akamtupa mvulana chini ya kichaka kimojawapo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiriba cha maji.” Kiriba ni chombo kilichotengenezwa kwa ngozi ya mnyama.
    reason: lexical_alternative
  - marker: b
    text: Au, “akamweka mvulana chini ya kichaka kimojawapo.” Kitenzi cha Kiebrania kwa kawaida huonyesha tendo lenye nguvu zaidi kuliko “akamweka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: yalipokwisha
  rationale: Kitenzi כלה hapa kinaonyesha kwamba maji yalifikia mwisho au yakaisha. Muundo wa wakati ‘yalipokwisha’ unaunganisha kwa kawaida tukio hili na hatua iliyofuata.
- source_word: הַמַּיִם
  choice: maji
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, ni nomino ya kitu kisichohesabika; ‘maji’ ndilo neno la kawaida na sahihi katika Kiswahili.
- source_word: מִן הַחֵמֶת
  choice: katika kiriba
  rationale: Kihusishi kinaonyesha chombo ambacho maji yalikuwa ndani yake na ambacho sasa kilikuwa tupu. ‘Kiriba’ ni neno la Kiswahili kwa chombo cha ngozi, na linaendeleza taswira ya chanzo.
- source_word: וַתַּשְׁלֵךְ
  choice: akamtupa
  rationale: Kitenzi שלך kwa kawaida humaanisha kutupa au kurusha. ‘Akamtupa’ kinahifadhi nguvu na uharaka wa tendo kuliko ‘akamweka,’ bila kulainisha simulizi.
- source_word: אֶת הַיֶּלֶד
  choice: mvulana
  rationale: יֶלֶד humaanisha mtoto au mvulana. ‘Mvulana’ linaonyesha rejeo la kiume na linafaa katika simulizi bila kutumia lugha ya kizamani.
- source_word: תַּחַת
  choice: chini ya
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya תַּחַת katika muktadha wa mahali.
- source_word: אַחַד הַשִּׂיחִם
  choice: mojawapo ya vichaka
  rationale: Muundo huu unamaanisha kichaka kimoja miongoni mwa vichaka; ‘mojawapo ya vichaka’ ni Kiswahili cha kawaida na sahihi.
