translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Marudio ya “kumkabili” yamehifadhiwa kwa sababu yanarudia neno lilelile la Kiebrania na kusisitiza kwamba Hajiri alibaki mbali lakini akimwelekea mvulana.
