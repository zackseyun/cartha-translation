base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: sw
  text: Kisha akaenda akaketi mkabala wake, mbali, takriban umbali wa mshale mmoja wa upinde, kwa maana alisema, “Nisione kifo cha mvulana[a].” Basi akaketi mkabala wake, akapaza sauti yake, akalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nisije nikamwona mvulana akifa.”
    reason: Tafsiri hii ya kimatendo ni njia nyingine ya kueleza kirai cha Kiebrania ambacho kihalisi kinataja kuona ‘katika/wakati wa kifo cha mvulana.’
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: kumkabili
  rationale: Neno hili linaonyesha kukaa upande unaoelekeana na mtu huku kukiwa na nafasi kati yao. “Kumkabili” huhifadhi mwelekeo huo wa mahali katika sehemu zote mbili linapotokea.
- source_word: הַרְחֵק
  choice: mbali
  rationale: Hii ni hali ya kielezi inayosisitiza umbali; “mbali” ni Kiswahili cha kawaida na wazi.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: takriban umbali wa mshale mmoja wa upinde
  rationale: Huhifadhi picha ya umbali wa kurusha mshale na pia maana ya makadirio iliyo katika כִּ.
- source_word: הַיָּלֶד
  choice: mvulana
  rationale: יֶלֶד inaweza kumaanisha mtoto wa kiume au kijana. “Mvulana” inafaa kwa umri wa Ishmaeli katika simulizi hili bila kutumia neno la kizamani.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: Nisione kifo cha mvulana
  rationale: Huhifadhi muundo wa Kiebrania unaozungumzia ‘kifo cha mvulana’ na hali ya ombi au tamanio hasi, bila kuondoa uwezekano wa tafsiri ya kimatendo.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  choice: akapaza sauti yake
  rationale: Hii ni nahau ya Kiebrania ya kuinua sauti kwa maombolezo au kusema kwa sauti; “akapaza sauti yake” ni ya asili katika Kiswahili na haichanganywi na kitenzi kinachofuata cha kulia.
- source_word: וַתֵּבְךְּ
  choice: na kulia
  rationale: Kitenzi hiki humaanisha kutoa machozi au kuomboleza; “kulia” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: לָהּ
  choice: akaketi
  rationale: Kiwakilishi hiki ni dativu ya kiethika inayoweza kudokeza kwamba alikaa mwenyewe au kwa upande wake. Hakijatafsiriwa kwa neno tofauti kwa sababu wazo la kujitenga tayari linaonyeshwa wazi na “mbali, kumkabili,” na kuongeza “peke yake” kunaweza kufifisha maana ya מִנֶּגֶד.
