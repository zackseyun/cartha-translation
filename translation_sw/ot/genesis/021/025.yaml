lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: akamlalamikia
  rationale: Katika muktadha huu kitenzi kina maana ya kumkabili mtu kwa malalamiko au lawama; ‘akamlalamikia’ ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha Abrahamu aliwasilisha shtaka lake kwa Abimeleki.
- source_word: עַל אֹדוֹת
  choice: kuhusu
  rationale: 'Kirai hiki huonyesha jambo linalohusika katika malalamiko: kisima cha maji.'
- source_word: בְּאֵר הַמַּיִם
  choice: kisima cha maji
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya aina ya kisima kinachotajwa.
- source_word: גָּזְלוּ
  choice: walikuwa wamekinyang’anya
  rationale: Kitenzi kinaonyesha kuchukua kwa nguvu au isivyo halali. Wakati timilifu uliopita unaweka kitendo kabla ya Abrahamu kulalamika.
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: watumishi wa Abimeleki
  rationale: ‘Watumishi’ ni pana na ya asili hapa, bila kulazimisha hadhi maalumu kama watumwa au maafisa.
