translation:
  language: sw
  text: Basi akamwambia Abrahamu, “Mfukuze mwanamke huyu aliye mtumwa pamoja na mwanawe, kwa maana mwana wa mwanamke huyu aliye mtumwa hatarithi pamoja na mwanangu, Isaka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: Mfukuze
  rationale: Amri hii ina maana ya kumtoa au kumfukuza kwa nguvu; ‘mfukuze’ huhifadhi ukali wake kuliko ‘mwondoe’ au ‘mpeleke.’
- source_word: הָאָמָה
  choice: mwanamke huyu mtumwa
  rationale: אָמָה humaanisha mwanamke aliye katika hali ya utumwa au utumishi wa chini. ‘Mwanamke ... mtumwa’ huonyesha hadhi yake ya kijamii na kisheria bila kutumia neno la kale lisilo wazi.
- source_word: בְּנָהּ
  choice: mwanawe
  rationale: Hili ni umbo la kawaida la umilikaji linalomaanisha ‘mwana wake’; ‘mwanawe’ ni la asili na wazi katika Kiswahili.
- source_word: כִּי לֹא יִירַשׁ
  choice: kwa maana ... hatarithi
  rationale: כִּי inatoa sababu ya agizo, na יירשׁ hapa inahusu kurithi au kuwa mrithi.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: mwana wa mwanamke huyu mtumwa
  rationale: Kurudia kirai chenye kiashiria ‘huyu’ kunahifadhi msisitizo wa Sara wa kumweka Hajiri mbali naye na hali ya usemi mkali.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: pamoja na mwanangu, pamoja na Isaka
  rationale: Kurudiwa kwa עִם kabla ya ‘Isaka’ kuna msisitizo wa kiambatano; kurudia ‘pamoja na’ kunahifadhi muundo huo na mvutano wa usemi.
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: Basi akamwambia Abrahamu
  rationale: Waw ya masimulizi inaendeleza mfuatano wa matukio; ‘Basi akamwambia’ ni simulizi la kawaida na lenye hadhi katika Kiswahili.
