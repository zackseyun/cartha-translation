  text: Abimeleki akamwambia Abrahamu, “Hawa wana-kondoo saba wa kike uliowaweka peke yao ni nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kiambishi cha masimulizi וַ kinaendeleza simulizi; katika Kiswahili, “akamwambia” huwasilisha kwa kawaida mfuatano wa tukio na anayeelekezewa maneno.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: אֶל־אַבְרָהָם
  choice: Abrahamu
  rationale: Yule anayesemeshwa anaunganishwa kiasili na kitenzi “akamwambia”; jina limetoholewa kwa matumizi ya kawaida ya Biblia ya Kiswahili.
- source_word: מָה הֵנָּה
  choice: wana maana gani?
  rationale: Kwa muundo huu, מָה huuliza maana au kusudi la kundi hili la wanyama, si utambulisho wao wa kimsingi. Kiswahili cha moja kwa moja “ni nini?” kingekuwa kisicho cha kawaida hapa, hivyo “wana maana gani?” huhifadhi nguvu ya swali bila kuligeuza kuwa swali la sababu tu.
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: Hawa wana-kondoo saba
  rationale: כְּבָשֹׂת ni wingi wa kike na humaanisha wanakondoo wa kike au kondoo wachanga wa kike. “Wana-kondoo” ni neno la kawaida la Kiswahili na “hawa” huonyesha wanyama waliokuwa karibu; jinsia ya kike haijatajwa wazi kwa kuwa “wana-kondoo wa kike” ni nzito katika mstari huu.
- source_word: אֲשֶׁר הִצַּבְתָּ לְבַדָּנָה
  choice: uliwaweka peke yao
  rationale: Hiphil ya נצב ina maana ya kuweka au kusimamisha, na לְבַדָּנָה inaonyesha kuwa walitengwa na wengine. “Uliwaweka peke yao” huhifadhi maana zote mbili kwa Kiswahili cha kawaida bila kuongeza dhana isiyokuwamo.
