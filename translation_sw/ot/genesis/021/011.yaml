  text: Jambo hilo lilikuwa baya sana machoni pa Abrahamu kwa sababu ya mwanawe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo hilo lilikuwa baya sana machoni pa Abrahamu kuhusu mwanawe.”
    reason: Kirai cha Kiebrania עַל אֹדוֹת kinaweza kueleweka kwa maana ya “kuhusu,” badala ya maana ya kisababishi “kwa sababu ya.”
lexical_decisions:
- source_word: וַיֵּרַע
  choice: lilimhuzunisha
  rationale: Kitenzi hiki pamoja na usemi בְּעֵינֵי kinaonyesha kwamba jambo hilo lilionekana baya kwa Abrahamu na likamsumbua sana. “Lilimhuzunisha” ni Kiswahili cha kawaida kinachoeleza athari hiyo bila kulifanya jambo lenyewe liitwe ovu.
- source_word: הַדָּבָר
  choice: Jambo hilo
  rationale: דָּבָר hapa inarejelea ombi la Sara katika mstari uliotangulia. “Jambo hilo” ni la asili katika Kiswahili na haliongezi maelezo yasiyokuwamo katika Kiebrania.
- source_word: מְאֹד
  choice: sana
  rationale: Hiki ni kielezi cha kiwango, na “sana” kinahifadhi mkazo wake kwa Kiswahili cha kawaida.
- source_word: בְּעֵינֵי
  choice: lilimhuzunisha Abrahamu
  rationale: Usemi wa Kiebrania “machoni pa Abrahamu” unaonyesha tathmini na mwitikio wake. Maana yake imewasilishwa kwa muundo wa kawaida wa Kiswahili; taswira halisi imehifadhiwa katika tanbihi.
- source_word: עַל אֹדוֹת
  choice: kwa sababu ya
  rationale: Kirai hiki kinaweza kuonyesha sababu au habari inayohusika. Katika muktadha huu “kwa sababu ya” kinaonyesha kwamba huzuni ya Abrahamu ilihusu mwanawe.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: בֵּן humaanisha mwana wa kiume. “Mwanawe” kinahifadhi uhusiano huo kwa ufupi na kwa usahihi.
