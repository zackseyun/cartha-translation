  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: sw
  text: Mungu akasikia sauti ya mvulana[a], na malaika wa Mungu akamwita Hagari kutoka mbinguni, akamwambia, “Una nini, Hagari? Usiogope, kwa maana Mungu amesikia sauti ya mvulana hapo alipo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilio cha mvulana” badala ya “sauti ya mvulana” katika sehemu zote mbili; neno la Kiebrania qol linaweza kumaanisha kilio kinachosikika cha mtu aliye katika dhiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: Mungu akasikia
  rationale: Kitenzi 'kusikia' ndicho kisawe cha kawaida cha שׁמע, na muundo wa '-ka-' unaendeleza mfuatano wa simulizi bila kuongeza wazo la kwamba Mungu tayari alijibu.
- source_word: אֶת קוֹל הַנַּעַר
  choice: sauti ya mvulana
  rationale: קוֹל kimsingi ni 'sauti'; katika muktadha inaweza kuwa kilio cha dhiki. 'Sauti' huhifadhi maana ya msingi na urudiaji wa kirai katika mstari huu.
- source_word: הַנַּעַר
  choice: mvulana
  rationale: נַעַר hapa inamtaja Ishmaeli kama kijana wa kiume. 'Mvulana' ni lugha ya sasa, ya kawaida, na haibainishi umri kwa usahihi usiokuwapo katika neno la Kiebrania.
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: na malaika wa Mungu akamwita
  rationale: '''Malaika wa Mungu'' huhifadhi muundo wa Kiebrania bila kufafanua zaidi utambulisho wa mjumbe huyo; ''akamwita'' ni ya asili katika simulizi la Kiswahili.'
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: '''Mbinguni'' ni usemi wa kawaida wa Kiswahili wa kueleza mahali sauti hiyo ilikotoka.'
- source_word: מַה לָּךְ
  choice: Una nini
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaouliza kinachomsumbua mtu, bila ukali unaoweza kupatikana katika 'Una shida gani?'.
- source_word: אַל תִּירְאִי
  choice: Usiogope
  rationale: Ni amri hasi ya moja kwa moja, ya asili na yenye heshima katika Kiswahili cha sasa.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: kwa maana Mungu amesikia
  rationale: '''Kwa maana'' huwasilisha sababu ya faraja, na ''amesikia'' huonyesha tendo lenye matokeo katika hali ya sasa.'
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: hapo alipo
  rationale: Usemi huu wa mahali ni wa asili katika Kiswahili na huhifadhi mkazo kwamba Mungu amemsikia mvulana katika mahali na hali yake ya sasa.
theological_decisions:
- issue: Utambulisho wa מַלְאַךְ אֱלֹהִים, ambaye katika simulizi anaweza kuhusishwa kwa karibu na Mungu
  choice: malaika wa Mungu
  alternative: malaika mmoja wa Mungu; malaika wa BWANA
  rationale: Tafsiri huhifadhi usemi wa chanzo bila kuamua ikiwa mjumbe huyo anapaswa kutambuliwa kwa namna mahususi zaidi, wala kubadili 'Mungu' kuwa jina jingine la kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa asili, wa sasa na wenye hadhi. Urudiaji wa 'sauti ya mvulana' umehifadhiwa, na kiashiria cha tanbihi [a] kimewekwa katika matini kuu.
