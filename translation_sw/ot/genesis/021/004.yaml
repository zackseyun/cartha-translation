  text: וַ/יָּ֤מָל אַבְרָהָם֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ בֶּן שְׁמֹנַ֖ת יָמִ֑ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: sw
  text: Abrahamu akamtahiri Isaka mwanawe alipokuwa na umri wa siku nane[a], kama vile Mungu alivyomwamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “mwana wa siku nane.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: akamtahiri
  rationale: Kitenzi מול humaanisha kutahiri; neno hili la kawaida la Kiswahili ni sahihi na wazi katika muktadha huu.
- source_word: אֶת יִצְחָק
  choice: Isaka
  rationale: Kiashiria cha yambwa tendwa kinafuatwa na jina la mtu, ambalo limetoholewa kwa umbo la Kiswahili linalotumika sana.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Huhifadhi msisitizo wa uhusiano wa kifamilia kati ya Abrahamu na Isaka kwa lugha ya asili na fasaha.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: alipokuwa na umri wa siku nane
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania inayomaanisha kuwa Isaka alikuwa na siku nane tangu kuzaliwa.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha kwamba tendo la Abrahamu lilipatana na agizo la Mungu.
- source_word: צִוָּה אֹתוֹ
  choice: alivyomwamuru
  rationale: Muundo huu unaonyesha kwa kawaida kwamba amri ya Mungu ilitangulia tendo la Abrahamu bila kulazimisha wakati wa kisarufi usio wazi katika Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo humrejelea Mungu mmoja na linaambatana na kitenzi cha umoja.
theological_decisions:
- issue: Uhusiano wa wakati kati ya amri ya Mungu na tendo la Abrahamu
  choice: alivyomwamuru
  alternative: kama Mungu alivyokuwa amemwamuru
  rationale: Kiebrania kinaonyesha amri iliyohusu tendo hili, na muktadha unaweka amri hiyo kabla yake. Kiswahili cha kawaida hakihitaji hali timilifu hapa; tafsiri iliyochaguliwa huhifadhi maana bila kuongeza uzito wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamtahiri” ni sahihi na asilia; “mwanawe” huhifadhi msisitizo wa kifamilia. Alama ya tanbihi [a] imewekwa baada ya kirai cha umri kinachofafanuliwa.
