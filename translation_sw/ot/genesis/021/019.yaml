base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: sw
  text: Ndipo Mungu akafungua macho yake, naye akaona kisima cha maji. Akaenda, akajaza kiriba[a] maji, kisha akampa mvulana maji anywe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiriba cha maji.” Neno la Kiebrania linamaanisha chombo cha ngozi kilichotumiwa kubebea kimiminika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: akafungua
  rationale: Kitenzi פקח humaanisha ‘kufungua,’ hasa macho. Tafsiri hii inadumisha tamathali halisi ya Kiebrania bila kueleza jinsi tendo hilo la Mungu lilivyomwezesha kuona.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika simulizi hili אֱלֹהִים humrejelea Mungu mmoja na inaambatana na kitenzi cha umoja.
- source_word: עֵינֶיהָ
  choice: macho yake
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa Kiebrania.
- source_word: וַתֵּרֶא
  choice: naye akaona
  rationale: ראה hapa ni ‘kuona’; ‘naye’ linaendeleza kwa kawaida mfuatano baada ya Mungu kufungua macho yake.
- source_word: בְּאֵר מָיִם
  choice: kisima cha maji
  rationale: Inahifadhi muundo wa Kiebrania na kukazia kwamba aliona chanzo cha maji.
- source_word: וַתֵּלֶךְ
  choice: akaenda
  rationale: Tafsiri ya kawaida ya kitenzi cha mwendo katika mfululizo wa simulizi.
- source_word: וַתְּמַלֵּא
  choice: akajaza
  rationale: מלא humaanisha ‘kujaza’; umbo hili linafaa kwa mfululizo wa vitendo vya simulizi.
- source_word: הַחֵמֶת
  choice: kiriba
  rationale: חֵמֶת ni chombo kilichotengenezwa kwa ngozi kwa kubebea kimiminika. ‘Kiriba’ ni neno fupi na linalofaa katika Kiswahili sanifu.
- source_word: מַיִם
  choice: maji
  rationale: Kiswahili husema kwa kawaida ‘kujaza kiriba maji,’ bila kuhitaji kihusishi.
- source_word: וַתַּשְׁקְ
  choice: akampa ... maji anywe
  rationale: Umbo la Hiphil la שׁקה humaanisha kumpa mtu kinywaji au kumnywesha. Usemi huu ni wa kawaida na unadumisha maana ya kisababishi.
- source_word: הַנַּעַר
  choice: mvulana
  rationale: נַעַר hapa humrejelea Ishmaeli. ‘Mvulana’ ni neno la sasa, wazi, na linalofaa muktadha.
theological_decisions:
- issue: Iwapo usemi ‘Mungu akafungua macho yake’ ufasiriwe kama tendo la Mungu lililotajwa moja kwa moja au ufafanuliwe kuwa alimsaidia tu kukiona kisima kilichokuwapo
  choice: Mungu akafungua macho yake
  alternative: Mungu akamwezesha kukiona kisima
  rationale: Kiebrania kinamhusisha Mungu moja kwa moja na tendo la kufungua macho yake. Tafsiri inadumisha usemi huo na mvutano wake wa kiteolojia bila kueleza utaratibu wa tendo hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa ‘aka-’ unadumisha mwendo wa simulizi. Alama ya tanbihi imewekwa baada ya ‘kiriba,’ ambako maelezo yake ya kileksika yanahusika.
