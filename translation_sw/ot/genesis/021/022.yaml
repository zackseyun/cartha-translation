base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: sw
  text: Ikawa wakati huo, Abimeleki na Pikoli, mkuu wa jeshi lake, wakamwambia Abrahamu, “Mungu[a] yu pamoja nawe katika yote unayofanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ingawa si uwezekano mkubwa katika muktadha huu, “mungu yuko pamoja nawe.” Neno la Kiebrania אֱלֹהִים linaweza kueleweka kwa njia tofauti katika miktadha mingine, lakini hapa kwa kawaida humrejelea Mungu anayembariki Abrahamu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hufungua tukio jipya katika simulizi kwa mtindo wa kawaida na wenye hadhi wa Kiswahili, bila kutumia usemi wa kizamani kupita kiasi.
- source_word: בָּעֵת הַהִוא
  choice: wakati huo
  rationale: Ni ulinganifu wa moja kwa moja na wa kawaida wa kirai hiki cha wakati.
- source_word: וַיֹּאמֶר
  choice: wakamwambia
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja kabla ya kiima ambatano, Kiswahili hutumia upatanisho wa wingi kwa Abimeleki na Pikoli; kiambishi -mw- humtaja Abrahamu kama anayeambiwa.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa tahajia na matamshi yaliyozoeleka katika Kiswahili.
- source_word: וּפִיכֹל
  choice: na Pikoli
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili.
- source_word: שַׂר צְבָאוֹ
  choice: mkuu wa jeshi lake
  rationale: שַׂר hapa ni kiongozi au kamanda, na צָבָא ni jeshi; ‘mkuu wa jeshi’ ni wazi na wa kawaida katika Kiswahili.
- source_word: אֶל אַבְרָהָם
  choice: Abrahamu
  rationale: Anayeambiwa amewakilishwa ndani ya kitenzi ‘wakamwambia’; jina limetoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: לֵאמֹר
  choice: —
  rationale: Kitenzi-jina hiki huanzisha maneno ya moja kwa moja. Kukiacha bila neno tofauti huepuka urudiaji usio wa kawaida baada ya ‘wakamwambia’ bila kupoteza maana.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo kwa kawaida humrejelea Mungu anayemfadhili Abrahamu, licha ya umbo lake la kisarufi linaloweza kutumiwa kwa namna nyingine katika miktadha mingine.
- source_word: עִמְּךָ
  choice: yu pamoja nawe
  rationale: Hueleza kuwapo na kumsaidia Abrahamu. ‘Yu pamoja nawe’ ni fupi, ya asili, na yenye hadhi.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: katika yote unayofanya
  rationale: Huhifadhi wigo mpana wa בְּכֹל na hali ya kawaida/inayoendelea ya kishiriki עֹשֶׂה kwa Kiswahili cha asili.
theological_decisions:
- issue: Mrejeleo wa אֱלֹהִים katika maneno ya Abimeleki
  choice: Mungu
  alternative: mungu fulani / miungu
  rationale: Muktadha wa simulizi unaonyesha kwamba Abimeleki anatambua kuwapo kwa Mungu anayempa Abrahamu mafanikio. Tafsiri ‘Mungu’ ndiyo inayofaa zaidi hapa bila kuongeza madai ya kiteolojia yasiyosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Ikawa wakati huo’ huhifadhi mpito wa kisimulizi; ‘wakamwambia’ huondoa urudiaji wa Kiebrania wa ‘kusema’ ambao usingekuwa wa asili katika Kiswahili.
