  text: וַ/תַּהַר֩ וַ/תֵּ֨לֶד שָׂרָ֧ה לְ/אַבְרָהָ֛ם בֵּ֖ן לִ/זְקֻנָ֑י/ו לַ/מּוֹעֵ֕ד אֲשֶׁר דִּבֶּ֥ר אֹת֖/וֹ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: sw
  text: Basi Sara akapata mimba, akamzalia Abrahamu mwana katika uzee wake, kwa wakati uliowekwa ambao Mungu alikuwa amemwambia Abrahamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Kitenzi הרה humaanisha kupata mimba; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: וַתֵּלֶד
  choice: akamzalia
  rationale: Kitenzi ילד hapa kinasimulia kujifungua, na kiambishi cha mtendewa kinaonyesha kwamba Sara alimzalia Abrahamu mwana.
- source_word: בֵּן
  choice: mwana
  rationale: Nomino hii inamtambulisha mtoto wa kiume; katika muktadha huu 'mwana' ni usemi wa kawaida na wenye hadhi.
- source_word: לִזְקֻנָיו
  choice: katika uzee wake
  rationale: Kirai hiki kinaonyesha hali na kipindi cha uzee wa Abrahamu, wala si kusudi.
- source_word: לַמּוֹעֵד
  choice: kwa wakati uliowekwa
  rationale: מוֹעֵד ni wakati maalumu uliokwisha kuwekwa; tafsiri hii inadumisha wazo la wakati ulioteuliwa bila kuongeza ufafanuzi wa kiteolojia.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: ambao Mungu alikuwa amemwambia
  rationale: Kishazi hiki kinarejelea wakati uliowekwa ambao Mungu alikuwa amemjulisha Abrahamu hapo awali. Kiswahili hiki ni cha kawaida na kinahifadhi uhusiano huo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa אֱלֹהִים katika muktadha huu.
- source_word: וַ
  choice: Basi
  rationale: Kiunganishi cha mwanzo kinaendeleza simulizi na kuonyesha kutimia kwa yale yaliyotangulia; 'Basi' huwasilisha mtiririko huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kuonyesha kutimia kwa neno la Mungu kwa wakati wake bila kuongeza ufafanuzi wa kimadhehebu
  choice: kwa wakati uliowekwa ambao Mungu alikuwa amemwambia
  alternative: kwa wakati maalumu ambao Mungu alikuwa amenena naye habari zake
  rationale: Chaguo hili linaunganisha kuzaliwa kwa mwana na wakati ambao Mungu alikuwa amemjulisha Abrahamu, hivyo linahifadhi msisitizo wa simulizi kuhusu kutimia kwa neno la Mungu bila kuongeza maelezo yasiyomo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi umehifadhiwa bila kuiga sintaksia ya Kiebrania kwa namna ngumu.
