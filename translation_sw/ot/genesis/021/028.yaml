lexical_decisions:
- source_word: וַיַּצֵּב
  choice: akawatenga
  rationale: Kitenzi cha Kiebrania katika Hiphil humaanisha kusababisha kitu kisimame au kukiweka mahali fulani. Katika muktadha huu, “akawatenga” huonyesha kwa Kiswahili cha kawaida kwamba aliwaweka tofauti na kundi, bila kufafanua zaidi kusudi lao.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: אֶת
  choice: '[kiashiria cha yambwa, hakitafsiriwi]'
  rationale: Kiashiria hiki cha yambwa mahususi katika Kiebrania hakina neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: שֶׁבַע
  choice: saba
  rationale: Namba ya kawaida inayovumisha nomino inayofuata.
- source_word: כִּבְשֹׂת
  choice: wana-kondoo saba wa kike
  rationale: Nomino hii humaanisha hasa wana-kondoo wa kike; tafsiri hii huhifadhi jinsia na udogo wao kwa lugha inayoeleweka.
- source_word: הַצֹּאן
  choice: kutoka katika kundi
  rationale: צֹאן ni jina la mkusanyiko wa mifugo midogo, hasa kondoo na mbuzi. “Kundi” halibani maana hiyo kuwa kondoo pekee, na “kutoka katika” huonyesha kwamba wale saba walitengwa na wengine.
- source_word: לְבַדְּהֶן
  choice: akawatenga
  rationale: Kirai hiki huonyesha kwamba hao wa kike waliwekwa peke yao au tofauti na wengine. Maana yake imeunganishwa kwa kawaida na kitenzi “akawatenga” katika Kiswahili.
