base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: sw
  text: Naye akapanda mti wa tamariski huko Beer-sheba, na hapo akaliitia jina la Yahweh,[a] Mungu wa milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akalitangaza jina la Yahweh” au “akamwomba Yahweh.” Nahau ya Kiebrania inaweza kuhusisha kutangaza na kumwomba Mungu katika mazingira ya ibada.
    reason: lexical_alternative
  - marker: b
    text: Au “Mungu wa daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: akapanda
  rationale: Kitenzi נטע katika Qal humaanisha kupanda; “akapanda” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: אֶשֶׁל
  choice: mkwaju
  rationale: Nomino אֶשֶׁל kwa kawaida hueleweka kuwa mti wa tamarisk; “mkwaju” ndilo jina la Kiswahili linalotumiwa kwa mti huo na huhifadhi umahususi wa neno kuliko “mti” tu.
- source_word: בִּבְאֵר שָׁבַע
  choice: huko Beer-sheba
  rationale: Kiambishi ב kinaonyesha mahali. “Huko” kinafuata mtiririko wa kawaida wa Kiswahili, na “Beer-sheba” huhifadhi jina la mahali kwa unukuzi unaotambulika.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: na hapo akaliitia jina la
  rationale: Nahau קרא בשם inaweza kumaanisha kuliitia jina katika ibada, kulitangaza, au kulitamka kwa kusudi la kumwomba Mungu. “Akaliitia jina la” huhifadhi zaidi mvutano huo bila kuufanya kuwa tangazo pekee au sala pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kama “Yahweh,” kwa kuhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: אֵל עוֹלָם
  choice: Mungu wa milele
  rationale: אֵל ni “Mungu,” na עוֹלָם hapa huonyesha umilele au kudumu bila mwisho. “Mungu wa milele” ni usemi wa asili, wenye heshima, na unaobeba muundo wa Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina la Mungu bila kulibadilisha kuwa cheo.
- issue: Nguvu ya nahau ya ibada קרא בשם יהוה
  choice: akaliitia jina la Yahweh
  alternative: akalitangaza jina la Yahweh; akalitaja jina la Yahweh kwa kumwomba
  rationale: Nahau hii inaweza kuhusisha kumwita Mungu katika ibada na pia kulitangaza jina lake. Tafsiri kuu huhifadhi utata huo, huku tanbihi ikionyesha maana nyingine zinazowezekana.
- issue: Maana ya אֵל עוֹלָם
  choice: Mungu wa milele
  alternative: Mungu wa daima
  rationale: “Wa milele” huwasilisha kudumu kwa Mungu bila kikomo na kudumisha nguvu ya cheo hiki bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku nahau ya ibada na cheo cha Mungu vikihifadhiwa bila kufafanuliwa kupita kiasi.
