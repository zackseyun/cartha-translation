  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: sw
  text: Inuka, umwinue mvulana huyo, na umshike imara kwa mkono wako,[a] kwa maana nitamfanya kuwa taifa kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umtegemee kwa mkono wako.” Usemi wa Kiebrania unasisitiza kumshika au kumsaidia kwa uthabiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: Inuka
  rationale: Ni amri ya umoja wa kike inayoelekezwa kwa Hagari. “Inuka” ni ya kawaida, wazi, na inadumisha nguvu ya amri.
- source_word: שְׂאִ֣י
  choice: umwinue
  rationale: Kitenzi נשׂא hapa kinaelekea kumaanisha kumwinua mvulana kutoka hali yake ya kuanguka au kulala. “Umwinue” huhifadhi taswira hiyo bila kuamua kwamba Hagari alipaswa kuendelea kumbeba.
- source_word: הַנַּעַר
  choice: huyo mvulana
  rationale: נַעַר humaanisha mvulana au kijana. Kirejeshi “huyo” ni cha asili katika muktadha huu na humtambulisha yule mvulana aliyekwisha tajwa.
- source_word: וְהַחֲזִיקִי אֶת יָדֵךְ בּוֹ
  choice: na umshike kwa nguvu kwa mkono wako
  rationale: החזיק pamoja na usemi unaohusu mkono huonyesha kumshika au kumsaidia kwa uthabiti. Tafsiri hii inadumisha mkono uliotajwa wazi na msisitizo wa nguvu, huku tanbihi ikitaja maana ya kumtegemeza.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza sababu ya amri, kwa hiyo “kwa maana” hutoa uhusiano wa maelezo kwa lugha yenye heshima na iliyo wazi.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימֶנּוּ
  choice: nitamfanya kuwa taifa kubwa
  rationale: Muundo wa ל pamoja na שׂים unaonyesha matokeo au hali atakayowekwa; usemi huu ni wa kawaida katika Kiswahili na huhifadhi ahadi ya Mungu kuhusu taifa litakalotokana naye.
theological_decisions:
- issue: Ahadi ya Mungu kuhusu wakati ujao wa Ishmaeli
  choice: Kauli imetafsiriwa moja kwa moja kuwa ahadi ya Mungu ya kumfanya mvulana kuwa taifa kubwa.
  alternative: Kuongeza maelezo yanayoainisha ahadi hii kuwa ya aina fulani ya kiagano au isiyo ya kiagano.
  rationale: Maandishi yenyewe yanaahidi hatima ya kuwa taifa kubwa, lakini hayaelezi hapa kwa istilahi za kimadhehebu aina kamili ya ahadi hiyo. Tafsiri haiongezi ufafanuzi wa kitheolojia usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Amri ni fupi na za moja kwa moja; neno “mvulana” linaeleweka kwa urahisi kuliko “kijana” katika muktadha huu, na tanbihi huhifadhi upana wa maana wa usemi wa Kiebrania kuhusu mshiko au msaada thabiti.
