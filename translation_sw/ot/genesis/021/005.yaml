  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: sw
  text: Na Abrahamu alikuwa na umri wa miaka mia moja Isaka mwanawe alipozaliwa kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “Na Abrahamu alikuwa mwana wa miaka mia moja wakati Isaka mwanawe alipozaliwa kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abrahamu
  rationale: Kiunganishi וְ kinaendeleza simulizi; katika Kiswahili, muunganiko huo unaeleweka kwa mtiririko wa sentensi bila kulazimika kutumia “na” mwanzoni. Jina limetolewa kwa umbo la Kiswahili lililozoeleka, “Abrahamu.”
- source_word: בֶּן מְאַת שָׁנָה
  choice: alikuwa na umri wa miaka mia moja
  rationale: Nahau ya Kiebrania, kihalisi “mwana wa miaka mia moja,” inaonyesha umri. Kauli iliyochaguliwa ni Kiswahili cha kawaida na sahihi.
- source_word: בְּ/הִוָּלֶד
  choice: alipozaliwa
  rationale: בְ pamoja na kitenzi-jina cha hali ya kutendwa huonyesha wakati wa tukio; “alipozaliwa” huhifadhi maana ya wakati na hali ya kutendwa kwa lugha ya asili.
- source_word: ל֔/וֹ
  choice: kwake
  rationale: Kiambishi hiki humtaja Abrahamu kuwa ndiye ambaye mtoto alizaliwa kwake; “kwake” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: אֵת יִצְחָק
  choice: Isaka
  rationale: אֵת ni kiashiria cha yambwa na hakihitaji neno tofauti katika Kiswahili. Jina יִצְחָק limetolewa kwa umbo la Kiswahili lililozoeleka, “Isaka.”
- source_word: בְּנֽ/וֹ
  choice: mwanawe
  rationale: Kiambishi cha nafsi kinaonyesha kuwa Isaka ni mwana wa Abrahamu; “mwanawe” huhifadhi uhusiano huo bila kuongeza mkazo usiokuwapo.
