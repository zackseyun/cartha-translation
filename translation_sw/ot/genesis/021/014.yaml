  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: sw
  text: Basi Abrahamu akaamka mapema asubuhi, akachukua mkate na kiriba cha maji, akampa Hagari, akaviweka begani mwake, akampa pia kijana[a], kisha akamtuma aende zake. Naye akaenda akatangatanga katika nyika ya Beer-sheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa karibu kabisa: “akiweka [vitu hivyo] begani mwake, na kijana.” Muundo umebanwa; unaweza pia kueleweka kuwa Abrahamu aliweka mahitaji begani mwa Hagari na akamkabidhi kijana. Wengine huunganisha “kijana” kwa karibu zaidi na kishazi cha “begani mwake.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: Abrahamu akaamka alfajiri
  rationale: Kauli hii huonyesha kuamka mapema asubuhi; “alfajiri” ni usemi wa kawaida na wenye hadhi unaohifadhi msisitizo wa wakati.
- source_word: לֶחֶם
  choice: mkate
  rationale: Neno hilo kimsingi humaanisha mkate; hakuna sababu ya kulipanua hapa kuwa chakula kwa ujumla.
- source_word: חֵמַת מַיִם
  choice: kiriba cha maji
  rationale: חֵמֶת ni chombo kilichotengenezwa kwa ngozi kwa ajili ya vimiminika; “kiriba cha maji” ni neno la Kiswahili linalofaa na halileti picha ya chupa ya kisasa.
- source_word: וַיִּתֵּן אֶל הָגָר
  choice: akampa Hagari
  rationale: Kitenzi cha Kiswahili pamoja na muktadha huonyesha kwamba Abrahamu alimpa Hagari mkate na kiriba cha maji bila kulazimisha kiwakilishi cha wingi kisicho cha lazima.
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: akaviweka begani mwake
  rationale: Kiwakilishi “vi-” kinarejelea vitu vya mahitaji vilivyotangulia na kufanya sentensi iwe ya asili, huku “begani mwake” ikifuata maana ya Kiebrania.
- source_word: וְאֶת הַיֶּלֶד
  choice: pamoja na kijana
  rationale: Kiebrania kinaongeza tu “na kijana.” “Pamoja na kijana” kinaonyesha kuwa kijana alikabidhiwa au aliambatana naye bila kudai kwamba aliwekwa begani.
- source_word: וַיְשַׁלְּחֶהָ
  choice: akamwacha aende
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba Abrahamu alimruhusu au alimwagiza aondoke, huku ikihifadhi uzito wa tukio.
- source_word: וַתֵּתַע
  choice: akatangatanga
  rationale: Kitenzi תעה humaanisha kutanga au kupotea njia; “akatangatanga” huhifadhi hali hiyo bila kuamua wazi kama alipotea kwa bahati.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: katika nyika ya Beer-sheba
  rationale: “Nyika” huonyesha eneo kame lisilolimwa bila kulifanya lazima kuwa jangwa la mchanga; “Beer-sheba” huhifadhi jina la mahali.
theological_decisions:
- issue: Uhusiano wa kisintaksia kati ya “kijana” na kuwekwa begani mwa Hagari
  choice: Mahitaji yaliwekwa begani mwa Hagari, naye kijana akaenda pamoja naye.
  alternative: Abrahamu aliweka mahitaji pamoja na kijana begani mwa Hagari; au alimpa Hagari mahitaji na kumkabidhi pia kijana.
  rationale: Muundo wa Kiebrania umebanwa na unaweza kuhusianisha “kijana” na kitenzi cha kutoa bila kurudia kitenzi hicho. Tafsiri kuu huepuka kutoa picha ya uhakika kwamba kijana aliwekwa begani, lakini tanbihi huhifadhi ugumu na uwezekano wa kisarufi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kiriba” na “nyika” ni maneno sahihi yanayoeleweka katika simulizi la kale; sentensi imebaki nyepesi kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya “kijana,” mahali pa utata wa kisintaksia.
