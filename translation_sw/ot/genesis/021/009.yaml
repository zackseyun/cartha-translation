base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: sw
  text: Sara akamwona mwana wa Hagari, Mmisri, ambaye Hagari alikuwa amemzalia Abrahamu, akicheka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akicheza” au “akidhihaki.” Neno la Kiebrania linaweza kumaanisha kucheka, kucheza, au kutenda kwa mzaha au dhihaka; muktadha unaweza kudokeza maana hasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Sara akamwona
  rationale: Kitenzi cha masimulizi kinaendeleza mfuatano wa matukio; “akamwona” ni cha kawaida na hakiongezi maana ya upinzani isiyosemwa wazi.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: mwana wa Hagari Mmisri
  rationale: Muundo huu unamtambulisha mwana kupitia kwa mama yake na kuhifadhi utambulisho wa Hagari kuwa Mmisri.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: ambaye Hagari alikuwa amemzalia Abrahamu
  rationale: Kumtaja Hagari tena huondoa utata usio wa lazima katika Kiswahili kuhusu mtendaji wa kuzaa; “alikuwa amemzalia” huonyesha tendo lililotangulia kumwona kwa Sara.
- source_word: מְצַחֵק
  choice: akicheka
  rationale: Kitenzi צחק kinaweza kuonyesha kucheka, kucheza, au tabia ya mzaha/dhihaka kutegemea muktadha. “Akicheka” huhifadhi maana pana bila kulazimisha dhihaka katika matini kuu.
theological_decisions:
- issue: Maana ya tendo la mwana wa Hagari katika מְצַחֵק
  choice: akicheka katika matini kuu
  alternative: akicheza au akidhihaki
  rationale: Kivumishi-tendo cha Kiebrania hakitaji kitu kinacholengwa wala hakionyeshi wazi uhasama. Muktadha unaweza kuruhusu maana hasi, lakini matini yenyewe haifungi maana hiyo; kwa hiyo utata halisi umehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umewekwa wazi na wa kawaida kwa msomaji wa leo, huku utata wa neno la mwisho ukihifadhiwa.
