base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: sw
  text: Basi, hapa uniapie kwa Mungu kwamba hutanidanganya mimi, wala watoto wangu, wala wazao wangu. Kama nilivyokutendea kwa fadhili, nawe unitendee vivyo hivyo mimi na nchi ambamo umeishi ukiwa mgeni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi
  rationale: Kirai hiki kinaendeleza hoja na kuleta ombi la sasa; “Basi” ni kiunganishi cha kawaida cha Kiswahili bila kulazimisha maana ya wakati kwa neno “sasa” pekee.
- source_word: תִּשְׁקֹר
  choice: hutanidanganya
  rationale: Kitenzi שׁקר hapa kinamaanisha kutenda kwa uongo au kwa udanganyifu; “danganya” ni cha asili na kinachoeleweka katika muktadha wa agano.
- source_word: נִינִי
  choice: watoto wangu
  rationale: Neno hilo humaanisha mtoto au uzao wa karibu; hapa limetofautishwa na neno linalofuata la kizazi cha baadaye.
- source_word: נֶכְדִּי
  choice: wazao wangu
  rationale: Hurejelea kizazi kinachoendelea au vizazi vya baadaye; “wazao” huhifadhi upana huo.
- source_word: חֶסֶד
  choice: fadhili
  rationale: Katika muktadha huu ni wema mwaminifu ulioonyeshwa katika uhusiano; “fadhili” ni neno la heshima na la kawaida bila kuongeza istilahi maalumu ya kimadhehebu.
- source_word: גַּרְתָּה
  choice: umeishi ukiwa mgeni
  rationale: Kitenzi גור kinaeleza kukaa kama mgeni au mkazi asiye mwenyeji, si kuishi tu.
theological_decisions:
- issue: Kiapo kwa Mungu
  choice: uniapie kwa Mungu
  alternative: uniapie mbele za Mungu
  rationale: בֵאלֹהִים kwa kawaida hapa inaonyesha Mungu anayetajwa kama dhamana ya kiapo; tafsiri haiongezi ufafanuzi wa kitheolojia usiotajwa.
- issue: Maana ya חֶסֶד katika uhusiano wa agano
  choice: fadhili
  alternative: upendo mwaminifu
  rationale: “Fadhili” huhifadhi maana ya wema uliotendwa bila kuamua kwamba lazima neno hilo hapa liwe istilahi kamili ya agano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umerahisishwa kwa usomaji wa kawaida huku tofauti kati ya watoto na wazao, pamoja na hali ya Abrahamu kama mgeni, ikihifadhiwa.
