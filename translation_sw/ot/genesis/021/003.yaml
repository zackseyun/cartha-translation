  text: Abrahamu akamwita mwanawe aliyezaliwa kwake, ambaye Sara alimzalia, Isaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֶׁם
  choice: akamwita ... Isaka
  rationale: Muundo wa קרא + שׁם humaanisha kumpa au kumwita mtu jina. Kiswahili “akamwita ... Isaka” ni cha kawaida, huku kikihifadhi tendo la Abrahamu la kumtaja mwanawe.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kiambishi cha umilikaji kinaonyesha wazi kuwa huyu ni mwana wa Abrahamu.
- source_word: הַנּוֹלַד לוֹ
  choice: aliyezaliwa kwake
  rationale: Huhifadhi umbo la kutendwa na pia dative לוֹ, inayosisitiza kwamba mwana huyo alizaliwa kwa Abrahamu.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: ambaye Sara alimzalia
  rationale: “Alimzalia” ni usemi wa asili wa Kiswahili unaomtaja Sara kuwa mama na kuhifadhi wazo la לוֹ, yaani kwamba alimzalia Abrahamu mwana huyo.
- source_word: יִצְחָק
  choice: Isaka
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
