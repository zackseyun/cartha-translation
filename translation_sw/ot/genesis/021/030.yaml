  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: sw
  text: Naye akasema[a], “Utachukua wana-kondoo hawa saba wa kike kutoka mkononi mwangu, ili upokeaji huo uwe ushahidi kwa niaba yangu kwamba mimi nilichimba kisima hiki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili hawa wawe ushahidi kwa niaba yangu.” Kitenzi cha Kiebrania ni cha umoja, ingawa rejeleo la karibu ni wana-kondoo saba wa kike; umoja huo unaweza kuwachukua pamoja kama kundi au kurejelea tendo la kupokea au mpangilio huo kuwa ushahidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Inaendeleza mtiririko wa simulizi wa wayyiqtol kwa Kiswahili cha kawaida, huku kiwakilishi kikirejelea Abrahamu katika muktadha.
- source_word: אֶת שֶׁבַע כְּבָשֹׂת
  choice: wana-kondoo hawa saba wa kike
  rationale: כְבָשֹׂת ni kondoo wa kike; ‘hawa’ linafaa kwa kuwa wanyama hao wako mbele yao na wametajwa katika muktadha wa karibu.
- source_word: תִּקַּח
  choice: Utachukua
  rationale: Wakati ujao katika Kiswahili unaweza kuwasilisha tendo linalotarajiwa au agizo hapa bila uzito wa lugha ya kisheria.
- source_word: מִיָּדִי
  choice: kutoka mkononi mwangu
  rationale: Inahifadhi taswira halisi ya Kiebrania ya kupokea kutoka mkononi mwa mtoaji, inayofaa kwa uhamisho rasmi.
- source_word: בַּעֲבוּר
  choice: ili
  rationale: Inaonyesha kusudi kwa njia fupi na ya asili katika Kiswahili.
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: jambo hili liwe ushahidi kwa ajili yangu
  rationale: Kitenzi cha Kiebrania ni umoja wa kike, ingawa rejeleo la karibu ni wana-kondoo saba. ‘Jambo hili’ linaacha mpangilio au tendo la kuwakabidhi kuwa ushahidi mmoja bila kulazimisha wana-kondoo wenyewe kuwa nafsi ya kisarufi ya umoja.
- source_word: כִּי חָפַרְתִּי
  choice: kwamba mimi nilichimba
  rationale: כִּי linaanzisha yaliyomo katika ushahidi. ‘Mimi’ linaweka wazi dai la Abrahamu mwenyewe bila kuongeza wazo jipya.
- source_word: הַבְּאֵר הַזֹּאת
  choice: kisima hiki
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi chenye kiashiria.
