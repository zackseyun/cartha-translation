  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: sw
  text: Mtoto akakua, akaachishwa kunyonya, naye Abrahamu akafanya karamu kubwa siku Isaka alipoachishwa kunyonya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: akakua
  rationale: Kitenzi גדל katika muktadha wa mtoto kinaeleza kukua kimwili; “akakua” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: הַיֶּלֶד
  choice: mtoto
  rationale: יֶלֶד inaweza kumaanisha mtoto au mvulana. “Mtoto” ni ya asili katika Kiswahili na haiongezi ubainishaji wa umri au jinsia zaidi ya unaohitajika katika sentensi hii.
- source_word: וַיִּגָּמַל
  choice: akaachishwa kunyonya
  rationale: Nifali ya גמל hapa ina maana ya kuacha kunyonyeshwa; muundo wa kutendwa “akaachishwa kunyonya” unaeleza wazi kwamba mtoto ndiye aliyeachishwa.
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: עשה ni “kufanya”; pamoja na karamu, “akafanya karamu” ni usemi unaoeleweka na unabaki karibu na muundo wa Kiebrania.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: karamu kubwa
  rationale: מִשְׁתֶּה ni karamu ya sherehe, na גָדוֹל ni kubwa; “karamu kubwa” ni ya kawaida, yenye heshima, na huhifadhi vipengele vyote viwili.
- source_word: בְּיוֹם
  choice: siku
  rationale: בְּיוֹם huonyesha wakati wa tukio. Katika muundo wa Kiswahili “siku ... alipo-” huwasilisha kwa kawaida maana ya “siku ambayo.”
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: Isaka alipoachishwa kunyonya
  rationale: Ingawa muundo wa Kiebrania una alama ya yambwa אֶת, maana katika muktadha ni tukio la Isaka kuachishwa kunyonya. Tafsiri ya kutendwa ni ya asili na haimwelezi kimakosa Abrahamu kuwa ndiye aliyemwachisha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa masimulizi umehifadhiwa kwa viambishi vya “aka-,” huku kifungu cha wakati kikitolewa kwa muundo wa kawaida “siku ... alipo-.” Hakuna tanbihi iliyohitajika; tanbihi za Kiingereza hazilingani na mahali zilipowekwa katika maandishi yake, na tofauti za “mtoto/mvulana” au “karamu/banaketi” hazibadili maana kiasi cha kuhitaji tanbihi katika Kiswahili.
