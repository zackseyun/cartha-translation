  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: sw
  text: Abrahamu akaishi katika nchi ya Wafilisti kwa siku nyingi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaishi kama mgeni katika nchi ya Wafilisti kwa siku nyingi.” Kitenzi cha Kiebrania kinaweza kusisitiza kuishi mahali kama mgeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: akaishi
  rationale: Kitenzi גור humaanisha kukaa au kuishi mahali kama mgeni. “Akaishi” ni lugha ya kawaida na ya asili katika Kiswahili, huku tanbihi ikihifadhi maana ya kuwa mkazi mgeni.
- source_word: בְּאֶרֶץ
  choice: katika nchi
  rationale: אֶרֶץ hapa hurejelea eneo au nchi; “katika nchi” ni tafsiri ya kawaida na yenye uwazi.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili la kundi hili la watu; pamoja na אֶרֶץ linakuwa “nchi ya Wafilisti.”
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania iliyo wazi, “siku nyingi,” na pia ni Kiswahili kinachoeleweka kwa urahisi.
- source_word: וַ
  choice: aka-
  rationale: Kiambishi cha usimulizi “aka-” kinaendeleza mfuatano wa matukio kwa njia ya asili katika Kiswahili.
