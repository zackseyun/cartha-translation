  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akaishi” limetumiwa katika maandishi makuu kwa urahisi wa kueleweka; maana mahsusi ya ukaaji wa kigeni imehifadhiwa katika tanbihi.
