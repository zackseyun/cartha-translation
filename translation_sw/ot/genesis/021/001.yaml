  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: sw
  text: Yahwe alimtembelea Sara kama alivyosema[a], naye Yahwe akamtendea Sara kama alivyokuwa amenena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimwangalia Sara.” Kitenzi cha Kiebrania kinaweza kumaanisha Mungu kumwelekezea mtu fikira zake ili atende kwa ajili yake; hapa hakimaanishi ziara ya kawaida tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: פָּקַד
  choice: alimwangalia Sara kwa kumtendea mema
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba Mungu alimwelekezea Sara fikira zake na akachukua hatua kwa manufaa yake; tafsiri hii huepuka maana ya ziara ya mahali pekee.
- source_word: כַּאֲשֶׁר אָמָר
  choice: kama alivyokuwa amesema
  rationale: Hurejelea ahadi iliyotolewa kabla ya tukio hili na kudumisha maana ya kutimizwa kwa neno la Mungu.
- source_word: וַיַּעַשׂ ... לְשָׂרָה
  choice: akamtendea Sara
  rationale: Huhifadhi upana wa kitenzi ‘alifanya’ pamoja na maana ya kitendo kilichomlenga Sara, bila kutaja mapema matokeo yanayoelezwa katika mstari unaofuata.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: kama alivyokuwa amenena
  rationale: ‘Amenena’ hutofautisha דִּבֵּר na אָמַר katika kishazi cha kwanza na kuhifadhi usambamba wa kimtindo wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya hatua ya Mungu kwa Sara
  choice: alimwangalia Sara kwa kumtendea mema
  alternative: alimtembelea Sara
  rationale: Uchaguzi huu unaonyesha uangalizi wa Mungu unaozaa tendo kwa manufaa ya Sara, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya ‘kutembelea’ bila kuifanya ionekane kama ziara ya kawaida tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Alivyokuwa amesema/amenena’ huonyesha kwamba maneno hayo yalitangulia kutimizwa kwake; ‘naye’ huunganisha vishazi kwa mtiririko wa kawaida.
