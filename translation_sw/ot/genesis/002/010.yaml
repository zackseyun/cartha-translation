  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: sw
  text: Mto ulitoka Edeni ili kuipatia bustani maji, na kutoka huko uligawanyika ukawa matawi makuu manne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vichwa vinne.” Kiebrania kinasema kihalisi “vichwa”; katika muktadha wa mto, neno hilo linaelekea kumaanisha migawanyiko yake minne mikuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: Mto
  rationale: נָהָר ni “mto.” Kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti mwanzoni mwa sentensi katika Kiswahili, kwa kuwa mwendelezo wa simulizi unaeleweka kiasili.
- source_word: יֹצֵא מֵעֵדֶן
  choice: ulitoka Edeni
  rationale: Kitenzi kishirikishi יֹצֵא kinaonyesha mto ukiendelea kutoka au kutiririka kutoka Edeni. “Ulitoka Edeni” ni usemi wa kawaida wa Kiswahili unaohifadhi dhana ya chanzo bila kuongeza maelezo yasiyokuwapo.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: ili kuunywesha bustani
  rationale: Infinitivi inaonyesha kusudi. “Kuunywesha bustani” ni lugha ya kawaida na yenye hadhi kwa kuipatia bustani maji; “kumwagilia” lingeweza kudokeza zaidi tendo la mtu.
- source_word: וּמִשָּׁם
  choice: na kutoka huko
  rationale: Maneno haya yanaonyesha hatua inayofuata katika mkondo wa mto baada ya Edeni.
- source_word: יִפָּרֵד
  choice: uligawanyika
  rationale: Nifali ya פרד inaweza kumaanisha kugawanyika au kutenganishwa. “Uligawanyika” ni ya kiasili kwa mto na haidai mtendaji wa nje.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: ukawa matawi makuu manne
  rationale: היה pamoja na לְ inaonyesha hali ya matokeo. רָאשִׁים ni “vichwa” kihalisi, lakini katika muktadha wa mto inarejelea migawanyiko yake mikuu. “Matawi makuu” linaeleweka vizuri katika Kiswahili huku tanbihi ikihifadhi usemi halisi.
