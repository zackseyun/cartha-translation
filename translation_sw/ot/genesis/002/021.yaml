  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: sw
  text: Basi Yahwe Mungu akamletea mtu huyo usingizi mzito, naye akalala. Kisha akachukua moja ya mbavu zake[a] na akafunga mahali hapo kwa nyama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande wake mmoja.” Neno la Kiebrania linaweza kumaanisha upande au sehemu ya upande, na pia ubavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: akamletea
  rationale: Hifili ya נפל ina maana ya kusababisha usingizi umwangukie mtu. Katika Kiswahili cha kawaida, “akamletea … usingizi mzito” hudumisha maana hiyo ya kisababishi bila kuiga muundo wa Kiebrania kwa namna isiyo ya kawaida.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Jina la agano יהוה limetolewa kwa uwazi kama “Yahwe,” likifuatiwa na אֱלֹהִים, “Mungu.”
- source_word: תַּרְדֵּמָה
  choice: usingizi mzito
  rationale: Neno hili humaanisha usingizi mzito sana, mara nyingi unaoletwa na Mungu; “usingizi mzito” ni wazi na wa kawaida katika Kiswahili.
- source_word: הָאָדָם
  choice: huyo mwanamume
  rationale: Katika muktadha huu מדובר על mtu mmoja wa kiume ambaye mwanamke ataumbwa kutoka kwake katika mstari unaofuata. “Huyo” huonyesha kwamba tayari ametajwa katika simulizi.
- source_word: וַיִּישָׁן
  choice: naye akalala
  rationale: Hutoa kwa uaminifu tendo rahisi la kulala na kuendeleza mtiririko wa simulizi.
- source_word: וַיִּקַּח
  choice: Kisha akachukua
  rationale: “Kisha” huonyesha mfuatano wa matendo unaowasilishwa na wayyiqtol bila kuongeza maana nyingine.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: moja ya mbavu zake
  rationale: צֵלָע linaweza kumaanisha ubavu au upande. Taswira ya sehemu ya mwili kuondolewa na mahali pake kufungwa kwa nyama inaunga mkono “ubavu”; maana mbadala imehifadhiwa katika tanbihi.
- source_word: וַיִּסְגֹּר בָּשָׂר
  choice: akafunga … kwa nyama
  rationale: סגר humaanisha kufunga, na בָּשָׂר huonyesha nyama iliyotumika kufunga mahali hapo. Muundo huu ni wa kawaida zaidi katika Kiswahili kuliko “akafunga nyama.”
- source_word: תַּחְתֶּנָּה
  choice: mahali pake
  rationale: Ingawa kimsingi linaweza kuwa “chini yake,” hapa linaelekeza kwenye mahali ambapo ubavu ulitolewa; “mahali pake” huwasilisha maana ya kimuktadha kwa uwazi.
theological_decisions:
- issue: Maana ya אָדָם katika muktadha huu
  choice: huyo mwanamume
  alternative: huyo binadamu
  rationale: Mstari unazungumzia mtu mmoja wa kiume ambaye mwanamke ataumbwa kutoka kwake, si wanadamu kwa ujumla.
- issue: Maana ya צֵלָע
  choice: ubavu
  alternative: upande
  rationale: Taswira ya sehemu ya mwili kuchukuliwa na mahali pake kufungwa kwa nyama inafanya “ubavu” kuwa tafsiri ya kawaida katika muktadha huu. Hata hivyo, “upande” ni maana halisi inayowezekana na yenye umuhimu wa kiufafanuzi, kwa hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. “Akamletea … usingizi mzito” na “akafunga mahali pake kwa nyama” huepuka tafsiri-mkopo isiyo ya kawaida huku zikihifadhi uhusiano wa matendo katika Kiebrania.
