  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: sw
  text: Kufikia siku ya saba, Mungu alikuwa amemaliza kazi yake aliyokuwa ameifanya[a]; naye siku ya saba akapumzika kutokana na kazi yake yote aliyokuwa ameifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Siku ya saba Mungu alimaliza kazi yake.” Maneno ya Kiebrania hutafsiriwa hivyo mara nyingi; “Kufikia siku ya saba” katika kifungu kikuu huwasilisha maana inayowezekana katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: alikuwa amemaliza
  rationale: Kitenzi כלה humaanisha kukamilisha au kumaliza. Wakati timilifu uliopita unaonyesha kuwa kazi ilikuwa imekwisha kufikia siku ya saba, huku dokezo likihifadhi muundo wa moja kwa moja zaidi wa Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo hili ni la wingi, hapa linaambatana na kitenzi cha umoja na humrejelea Mungu mmoja; kwa hiyo “Mungu” ndilo chaguo la kawaida na linalolingana na sarufi na muktadha.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Kufikia siku ya saba
  rationale: Kihalisi ni “siku ya saba.” “Kufikia siku ya saba” huwasilisha maana inayowezekana katika muktadha kwamba kazi ilikuwa imekamilika wakati siku hiyo ilipofika. Tafsiri ya kihalisi zaidi imehifadhiwa katika dokezo.
- source_word: מְלַאכְתּוֹ
  choice: kazi yake
  rationale: מְלָאכָה humaanisha kazi, shughuli, au jukumu. “Kazi yake” ni Kiswahili cha kawaida na kinachofaa katika simulizi la uumbaji.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyokuwa ameifanya
  rationale: עשה ni kitenzi kipana chenye maana ya kufanya au kutengeneza. “Aliyokuwa ameifanya” hudumisha upana huo na kuonyesha kuwa kazi iliyotajwa ilikuwa imekamilika.
- source_word: וַיִּשְׁבֹּת
  choice: akapumzika
  rationale: שבת kimsingi humaanisha kuacha au kukoma. Katika muktadha huu “akapumzika” ni usemi wa kawaida unaoonyesha kuacha kazi, bila kulazimisha maana ya kupona uchovu.
- source_word: מִכָּל
  choice: kutokana na ... yote
  rationale: Muundo מן pamoja na כָּל unaonyesha kwamba Mungu aliacha jumla ya kazi yake; “kutokana na kazi yake yote” huwasilisha uhusiano huo kwa Kiswahili cha asili.
theological_decisions:
- issue: Iwapo kifungu kinadokeza kwamba Mungu alifanya kazi katika siku ya saba
  choice: Kifungu kikuu kinasema “Kufikia siku ya saba, Mungu alikuwa amemaliza kazi,” kikionyesha kuwa kazi ilikuwa imekamilika siku hiyo ilipofika.
  alternative: “Siku ya saba Mungu alimaliza kazi yake,” ambalo ni fumbo la karibu zaidi na muundo wa Kiebrania.
  rationale: Kiebrania kinaweza kutafsiriwa kihalisi kuwa “siku ya saba,” lakini katika muktadha huo maneno hayo yanaweza kueleweka kana kwamba kazi fulani iliendelea ndani ya siku ya saba, ilhali kishazi kinachofuata kinasema Mungu alipumzika siku hiyo. Tafsiri kuu huonyesha maana inayowezekana katika muktadha, na dokezo huhifadhi uwazi kuhusu muundo halisi wa Kiebrania bila kuondoa mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Marudio ya “aliyokuwa ameifanya” yamehifadhiwa ili kuakisi marudio ya makusudi katika Kiebrania. Alama ya nukta mkato hutenganisha vishazi viwili vikuu kwa uwazi.
