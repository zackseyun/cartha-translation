  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: sw
  text: Basi Mungu akaibariki siku ya saba na kuitakasa[a], kwa sababu katika siku hiyo alipumzika[b] kutoka katika kazi yake yote ambayo Mungu alikuwa ameiumba kuifanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuiweka wakfu kuwa takatifu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania pia kinaweza kutafsiriwa “alikoma,” yaani, aliacha kufanya kazi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni “ambayo Mungu aliumba kufanya.” Kirai cha mwisho ni kigumu; wengine hukielewa kuwa “ambayo Mungu alikuwa ameiumba na kuifanya” au “ambayo Mungu alikuwa ameiumba kwa kuifanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: akaibariki
  rationale: Kitenzi hiki kinaonyesha Mungu akiipa siku hiyo baraka; ‘akaibariki’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Nomino hii inaambatana na kitenzi cha umoja na hapa inamtaja Mungu mmoja.
- source_word: יּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na namba ya mpangilio.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: na kuitakasa
  rationale: ‘Kuitakasa’ huhifadhi dhana ya kuifanya au kuiweka kuwa takatifu bila kulazimisha ufafanuzi mmoja tu wa kitendo hicho.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya Mungu kuibariki na kuitakasa siku hiyo.
- source_word: בּוֹ
  choice: katika siku hiyo
  rationale: Kurudia ‘siku hiyo’ huondoa utata wa kiwakilishi na ni mtindo wa kawaida wa Kiswahili katika muktadha wa wakati.
- source_word: שָׁבַת
  choice: alipumzika
  rationale: Huhifadhi uhusiano wa kimuktadha na Sabato; kitenzi pia kinaweza kumaanisha kuacha au kukoma.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: kutoka katika kazi yake yote
  rationale: ‘Kazi’ ni pana na ya kawaida, nayo muundo huu unaonyesha kwamba Mungu aliacha shughuli yake yote ya uumbaji.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים
  choice: ambayo Mungu alikuwa ameiumba
  rationale: Wakati timilifu ‘alikuwa ameiumba’ unaonyesha kazi iliyokamilishwa kabla ya pumziko la siku ya saba.
- source_word: לַעֲשׂוֹת
  choice: ili kuifanya
  rationale: Hufuata kwa karibu infinitivu ya Kiebrania na kuhifadhi ugumu wa kirai badala ya kukibadili kimya kimya kuwa vitenzi viwili vilivyoratibiwa.
theological_decisions:
- issue: Maana ya שָׁבַת na uhusiano wake na Sabato
  choice: alipumzika
  alternative: alikoma
  rationale: ‘Alipumzika’ huhifadhi uhusiano wa kikanoni na Sabato bila kusema kwamba Mungu alichoka; tanbihi inaonyesha maana nyingine ya kimsamiati.
- issue: Maana ya וַיְקַדֵּשׁ אֹתוֹ
  choice: kuitakasa
  alternative: kuiweka wakfu kuwa takatifu
  rationale: ‘Kuitakasa’ ni neno la kawaida la kibiblia linalohifadhi uzito wa utakatifu wa siku hiyo, huku njia mbadala ikieleza wazo la kuitenga kuwa takatifu.
- issue: Kirai kigumu אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: ambayo Mungu alikuwa ameiumba ili kuifanya
  alternative: ambayo Mungu alikuwa ameiumba na kuifanya
  rationale: Maandishi makuu yanafuata muundo wa Kiebrania kwa karibu na kuhifadhi mvutano wake wa kisintaksia; tanbihi inatoa tafsiri mbadala yenye ufasaha zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa mwisho umeachwa karibu na Kiebrania, huku tanbihi ikisaidia kueleza ugumu wake.
