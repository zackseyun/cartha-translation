  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: sw
  text: Basi, mbingu na dunia zikakamilika[a], na vyote vilivyomo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zikamalizika.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha “jeshi lao” au “mkusanyiko wao”; hapa linarejelea vitu vyote vinavyozijaza mbingu na dunia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: zikakamilika
  rationale: Kitenzi cha Kiebrania ni cha hali ya kutendwa na kinaonyesha kufikia ukamilifu. Katika Kiswahili, “zikakamilika” ni ya asili na huhifadhi wazo la kazi kufikia mwisho wake bila kuongeza mtendaji.
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: “Mbingu” ni namna ya kawaida na yenye hadhi ya kutaja eneo lote la juu katika simulizi la uumbaji, si anga inayoonekana tu.
- source_word: וְהָאָרֶץ
  choice: na dunia
  rationale: Katika muktadha wa uumbaji, neno hili linamaanisha dunia kama eneo la viumbe vya ardhini, wala si nchi au sehemu fulani ya ardhi.
- source_word: וְכָל
  choice: pamoja na vyote
  rationale: Kauli hii inaunganisha jumla ya vilivyo katika mbingu na dunia na kukamilika kwa maeneo hayo; “pamoja na” ni Kiswahili cha asili katika muhtasari huu.
- source_word: צְבָאָם
  choice: vilivyomo
  rationale: Neno la Kiebrania linaweza kumaanisha jeshi, mkusanyiko uliopangwa, au umati. Hapa linarejelea kwa upana vitu vyote vinavyozijaza mbingu na dunia. “Vyote vilivyomo” hutoa maana hiyo kwa Kiswahili cha sasa bila kuingiza picha ya kijeshi isiyo wazi.
theological_decisions:
- issue: Upeo wa maana ya צְבָאָם
  choice: Rejeo pana kwa vitu vyote vilivyomo katika mbingu na dunia
  alternative: Rejeo jembamba kwa nyota au majeshi ya mbinguni, au sitiari ya vikosi vilivyopangwa
  rationale: Muundo “mbingu na dunia” ni jumla inayokumbatia uumbaji wote. Kwa hiyo kirai kinachofuata kinaeleweka zaidi kama maudhui yake yote, huku tanbihi ikihifadhi taswira ya mkusanyiko au jeshi iliyomo katika neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Hivyo” linaunganisha mstari huu na simulizi lililotangulia; “zikakamilika” huhifadhi hali ya kufikia ukamilifu, na “vyote vilivyomo” huepuka kutumia “majeshi,” ambalo katika Kiswahili cha kawaida lingeweza kueleweka kijeshi mno.
