  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: sw
  text: Kisha Yahweh Mungu akamchukua mtu huyo, akamweka katika bustani ya Edeni ili ailime na aitunze.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili aifanyie kazi na kuilinda.” Vitenzi vya Kiebrania vinaweza kumaanisha “kufanya kazi/kulima” na “kutunza/kulinda/kuichunga.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “akamweka” kinaweza pia kumaanisha “akamfanya apumzike” au “akamweka akae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa uhamishaji wa sauti ili kuhifadhi jina binafsi la Kiebrania badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muungano יְהוָה אֱלֹהִים, “Yahweh Mungu” huhifadhi jina binafsi pamoja na cheo cha Uungu kwa Kiswahili cha kawaida.
- source_word: הָאָדָם
  choice: huyo mtu
  rationale: Muktadha unamrejelea mtu mmoja aliyetangulia kuumbwa; “huyo” huonyesha mrejeo huo bila kulifanya neno kuwa jina binafsi.
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: לקח hapa ina maana ya kawaida ya kumchukua mtu; tafsiri hii haiongezi namna ambayo tendo hilo lilifanyika.
- source_word: וַיַּנִּחֵהוּ
  choice: akamweka
  rationale: Hifili ya נוח inaweza kumaanisha kuweka, kumstarehesha, au kumkalisha mahali; katika simulizi la kuhamishwa hadi bustanini, “akamweka” ni ya asili na inafaa zaidi.
- source_word: בְּגַן עֵדֶן
  choice: katika bustani ya Edeni
  rationale: Hii ni tafsiri ya wazi na ya kawaida ya muundo wa Kiebrania huku ikihifadhi Edeni kama jina la mahali.
- source_word: לְעָבְדָהּ
  choice: ili ailime
  rationale: עבד inaweza kuwa kufanya kazi, kutumikia, au kulima. Bustani ikiwa ndiyo yambwa, “ailime” ni Kiswahili cha kawaida kinachoonyesha kazi ya kuitendea bustani.
- source_word: וּלְשָׁמְרָהּ
  choice: na kuitunza
  rationale: שמר inaweza kumaanisha kutunza, kulinda, au kuangalia. “Kuitunza” huhifadhi wazo pana la uangalizi bila kuingiza taswira ya kijeshi.
theological_decisions:
- issue: Kazi ya mwanadamu katika Edeni
  choice: Mstari unaeleza wajibu wa mtu wa kuilima na kuitunza bustani bila kuingiza moja kwa moja istilahi za ukuhani au mfumo wa baadaye wa kiteolojia.
  alternative: Kutafsiri vitenzi hasa kama huduma na ulinzi wa kikuhani, au kuvifanya virejelee kilimo pekee.
  rationale: Vitenzi עבד na שמר vinaweza kuwa na mwangwi wa huduma na ulinzi, lakini hapa pia vina maana za kawaida zinazofaa bustani. Tafsiri kuu inabaki ya kawaida, huku tanbihi ikihifadhi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa masimulizi “akamchukua ... akamweka” ni wa kawaida; “Edeni” ni umbo lililozoeleka la jina hilo. Alama zote za tanbihi zimewekwa katika matini kuu.
