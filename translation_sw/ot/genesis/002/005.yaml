id: GEN.2.5
reference: Genesis 2:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: sw
  text: Bado hakukuwa na kichaka chochote cha shambani[a] duniani, wala mmea wowote wa shambani haukuwa bado umechipuka, kwa sababu Yahwe Mungu hakuwa ameinyeshea dunia mvua, na hapakuwa na mwanadamu wa kuilima ardhi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kichaka cha uwandani.”
    reason: lexical_alternative
  - marker: b
    text: Au “hapakuwa na mtu wa kuifanyia kazi ardhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: kichaka cha shambani
  rationale: “Kichaka” hutofautisha שִׂיחַ na עֵשֶׂב inayofuata; “cha shambani” huhifadhi muundo wa Kiebrania bila kuongeza wazo la porini.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: hakukuwa bado ... duniani
  rationale: “Bado” huonyesha hali ya kutokuwapo mpaka wakati huo, na “duniani” inafaa muktadha mpana wa uumbaji.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: mmea ... wa shambani
  rationale: “Mmea” ni neno pana na la kawaida kwa mimea isiyo vichaka, bila kulibana kuwa majani au mimea ya chakula.
- source_word: טֶרֶם יִצְמָח
  choice: haukuwa bado umechipuka
  rationale: “Kuchipuka” huwasilisha maana ya צמח ya kuota au kutokeza kutoka ardhini.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaanzisha sababu ya kutokuwapo kwa mimea hiyo.
- source_word: הִמְטִיר
  choice: hakuwa bado amenyeshea ... mvua
  rationale: 'Muundo huu wa Kiswahili huhifadhi nguvu ya kisababishi ya hifili: Mungu ndiye anayesababisha mvua kunyesha.'
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: “Yahwe” huwakilisha jina la agano יהוה, huku אֱלֹהִים ikitafsiriwa “Mungu.”
- source_word: וְאָדָם אַיִן
  choice: hapakuwa na mwanadamu
  rationale: Katika muktadha huu אָדָם humaanisha binadamu anayehitajika kuilima ardhi; “mwanadamu” ni ya asili na haifungi maana kwa jinsia bila ulazima.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: wa kuilima ardhi
  rationale: “Kulima” huonyesha kazi ya kuitunza au kuistawisha ardhi katika muktadha huu, na “ardhi” huwakilisha אֲדָמָה.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: dunia / ardhi
  rationale: 'Maneno mawili tofauti yanahifadhiwa: אֶרֶץ ni dunia kwa upana, na אֲדָמָה ni ardhi inayolimwa.'
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina binafsi יהוה; “Yahwe” hulionyesha moja kwa moja badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אָדָם katika muktadha
  choice: mwanadamu
  alternative: mwanamume
  rationale: Hapa neno linaeleza kutokuwapo kwa binadamu wa kuilima ardhi; jinsia ya kiume si lazima ili kuwasilisha hoja ya kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “bado” yamehifadhiwa kwa kuwa טֶרֶם hutokea katika vifungu vyote viwili. “Dunia” na “ardhi” zimetofautishwa ili kuakisi אֶרֶץ na אֲדָמָה.
