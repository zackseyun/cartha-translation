base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: sw
  text: Yahwe Mungu akaotesha kutoka ardhini kila mti unaopendeza machoni na unaofaa kwa chakula, na mti wa uzima katikati ya bustani, na mti wa maarifa ya mema na mabaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai “maarifa ya mema na mabaya” kimeachwa kama kilivyo; wafafanuzi hutofautiana kuhusu kama kinamaanisha hasa utambuzi wa kimaadili, ukomavu, au maarifa mapana ya mambo yote.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: akachipusha
  rationale: Kitenzi cha Kiebrania kiko katika muundo wa kisababishi; “akachipusha” huonyesha kwamba Yahwe Mungu ndiye aliyesababisha miti ichipuke.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahwe,” huku אֱלֹהִים likitafsiriwa “Mungu.”
- source_word: מִן הָאֲדָמָה
  choice: kutoka ardhini
  rationale: אֲדָמָה hapa ni ardhi ambayo miti ilichipuka; “ardhini” ni ya kawaida na inaeleweka wazi katika Kiswahili.
- source_word: כָּל עֵץ
  choice: kila mti
  rationale: Huhifadhi maana ya kugawa ya כָּל pamoja na nomino ya umoja.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: unaopendeza kwa macho
  rationale: Hueleza mvuto wa kuonekana kwa lugha ya Kiswahili iliyo ya kawaida bila kuongeza tafsiri nyingine.
- source_word: וְטוֹב לְמַאֲכָל
  choice: na unaofaa kwa chakula
  rationale: Hutoa kwa uwazi maana ya kuwa mzuri au wa kufaa kwa kuliwa.
- source_word: וְעֵץ הַחַיִּים
  choice: pamoja na mti wa uzima
  rationale: “Mti wa uzima” ni tafsiri ya moja kwa moja na iliyozoeleka ya muundo huu.
- source_word: בְּתוֹךְ הַגָּן
  choice: katikati ya bustani
  rationale: Huhifadhi maana ya mahali ndani au katikati ya bustani kwa Kiswahili cha kawaida.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: na mti wa ujuzi wa mema na mabaya
  rationale: Huhifadhi kirai kamili bila kukifafanua kuwa utambuzi wa kimaadili, ukomavu, au ujuzi wa kila kitu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina יְהוָה; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya “ujuzi wa mema na mabaya”
  choice: Kirai kimeachwa kwa maana yake ya moja kwa moja
  alternative: utambuzi wa kimaadili; ukomavu; ujuzi wa mambo yote
  rationale: Kirai cha Kiebrania kinaweza kufasiriwa kwa njia mbalimbali; tafsiri kuu hailazimishi mojawapo ya fasiri hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “akachipusha” huhifadhi kisababishi cha Kiebrania, na “unaopendeza kwa macho” ni wa kawaida kuliko tafsiri ngumu ya neno kwa neno. Alama ya tanbihi imewekwa baada ya kirai kinachoelezwa.
