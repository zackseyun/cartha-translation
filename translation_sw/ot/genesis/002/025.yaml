  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: sw
  text: Mwanamume na mke wake wote wawili walikuwa uchi[a], wala hawakuona aibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hao wawili ... uchi”; mpangilio wa maneno unasisitiza kuwa wote wawili hawakuwa wamevaa nguo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika kishazi hiki, umbo la simulizi la היה linaunganisha tukio na yaliyotangulia huku likieleza hali; “walikuwa” ni Kiswahili cha kawaida na sahihi.
- source_word: שְׁנֵיהֶם
  choice: wote wawili
  rationale: Kauli hii inasisitiza kuwa hali hiyo iliwahusu kila mmoja wa hao wawili.
- source_word: עֲרוּמִּים
  choice: uchi
  rationale: Neno hili humaanisha kutovaa nguo. “Uchi” ni wazi, la kawaida, na lenye hadhi katika muktadha huu.
- source_word: הָאָדָם
  choice: mwanamume
  rationale: Katika muktadha huu, anayerejelewa ni mwanadamu wa kiume anayetajwa pamoja na mke wake; “mwanamume” huepuka maana ya jumla ya wanadamu.
- source_word: וְאִשְׁתּוֹ
  choice: na mke wake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu ya kiume humaanisha kwa kawaida “mke wake” hapa na huendeleza uhusiano wa ndoa uliotajwa katika mstari uliotangulia.
- source_word: וְלֹא יִתְבֹּשָׁשׁוּ
  choice: lakini hawakuona aibu
  rationale: Ingawa וְ kwa msingi ni kiunganishi, hapa kuna utofautishaji wa kimantiki kati ya kuwa uchi na kutokuwa na aibu. “Hawakuona aibu” ni usemi wa asili wa Kiswahili unaowasilisha hali ya kutopata aibu.
theological_decisions:
- issue: Maana ya הָאָדָם katika muktadha
  choice: mwanamume
  alternative: mwanadamu
  rationale: Kwa kuwa mstari unamtaja pamoja na “mke wake,” rejeo hapa ni mwanadamu wa kiume binafsi, si wanadamu kwa ujumla. Tafsiri hii inadumisha umahususi wa simulizi bila kuongeza dai pana la kiantropolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. “Wote wawili” imewekwa kati ya koma ili kuhifadhi msisitizo wa Kiebrania bila kufanya sentensi kuwa nzito.
