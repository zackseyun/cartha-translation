  text: Na dhahabu ya nchi hiyo ni nzuri; huko kuna bedola[a] na jiwe la shohamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda ni utomvu wenye harufu nzuri; utambulisho kamili wa dutu inayomaanishwa na neno la Kiebrania hauna uhakika.
