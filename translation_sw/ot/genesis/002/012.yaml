lexical_decisions:
- source_word: וּזֲהַב
  choice: Na dhahabu
  rationale: Kiunganishi וּ kinaendeleza maelezo ya mstari uliotangulia, na זָהָב humaanisha dhahabu.
- source_word: הָאָרֶץ הַהִוא
  choice: ya nchi hiyo
  rationale: אֶרֶץ hapa ni nchi au eneo linalorejelewa katika mstari uliotangulia, na הַהִוא ni 'hiyo'.
- source_word: טוֹב
  choice: ni nzuri
  rationale: Neno טוֹב linaeleza ubora wa dhahabu kwa lugha rahisi bila kuongeza ufafanuzi usiotajwa.
- source_word: שָׁם
  choice: huko kuna
  rationale: שָׁם huelekeza mahali palipotajwa, na muundo huu ni wa kawaida katika Kiswahili.
- source_word: הַבְּדֹלַח
  choice: bedola[a]
  rationale: Utambulisho kamili wa kitu hiki hauna uhakika; umbo la kunukuu jina linahifadhi upekee na kutokujulikana kwake bila kutoa uhakika wa uongo.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: na jiwe la shohamu[b]
  rationale: אֶבֶן limetafsiriwa wazi kuwa 'jiwe'; שֹׁהַם imenukuliwa kwa sababu aina kamili ya jiwe hilo haijulikani kwa hakika.
