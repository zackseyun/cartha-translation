  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: sw
  text: Ndipo Yahwe Mungu akamfanyiza mtu kwa mavumbi ya ardhi[a], akampulizia puani pumzi ya uhai, naye mtu akawa kiumbe hai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mavumbi kutoka ardhini.”
    reason: Muundo wa Kiebrania unaweka “mavumbi kutoka ardhini” kama maelezo ya kitu alichofanyizwa nacho mtu; njia zote mbili za Kiswahili zinaonyesha chanzo hicho.
  - marker: b
    text: Au, “nafsi hai”; pia inaweza kutafsiriwa “kiumbe chenye uhai.”
    reason: Neno נֶפֶשׁ lina wigo mpana wa maana. Hapa linamtaja kiumbe kizima kilicho hai, si lazima nafsi isiyo ya kimwili.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Huhifadhi jina la agano la Mungu pamoja na cheo cha kawaida cha kimungu, kwa mpangilio wa Kiebrania na kwa Kiswahili kinachoeleweka.
- source_word: וַיִּיצֶר
  choice: akamfanyiza
  rationale: Kitenzi hiki hudokeza kufanyiza au kuumba kwa kumpa kitu umbo, kama mfinyanzi; “akamfanyiza” huhifadhi picha hiyo bila kuongeza maelezo yasiyomo.
- source_word: הָאָדָם
  choice: mtu
  rationale: Katika muktadha huu neno hilo linamtaja mwanadamu mmoja anayefanyizwa, huku Kiswahili “mtu” likiwa la kawaida na lisilolazimisha jina maalumu “Adamu” kabla ya wakati.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: kwa mavumbi ya ardhi
  rationale: Huwasilisha mavumbi kama kitu ambacho mtu alifanyizwa nacho na ardhi kama chanzo chake. Kiswahili hakiwezi kuhifadhi kikamilifu mchezo wa maneno kati ya אָדָם na אֲדָמָה.
- source_word: בְּאַפָּיו
  choice: puani
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi tendo halisi la kupulizia pumzi katika pua ya mtu.
- source_word: נִשְׁמַת חַיִּים
  choice: pumzi ya uhai
  rationale: Hutoa maana ya kawaida ya kirai cha Kiebrania; wingi wa חַיִּים hapa una kazi ya dhana pana au mkazo, si lazima “uhai mbalimbali.”
- source_word: לְנֶפֶשׁ חַיָּה
  choice: kiumbe hai
  rationale: Kirai hiki humaanisha kiumbe kizima chenye uhai, si lazima sehemu isiyo ya kimwili iliyotenganishwa na mwili. Pia kinaendana na matumizi ya kirai hicho kwa wanyama katika muktadha mwingine.
theological_decisions:
- issue: Maana ya הָאָדָם katika simulizi
  choice: mtu
  alternative: mwanadamu
  rationale: Rejeo ni kwa mtu mmoja anayefanyizwa, lakini maandishi hayahitaji jina maalumu “Adamu” hapa. “Mtu” huhifadhi upekee wa mhusika na uwezekano wa uwakilishi mpana wa kibinadamu.
- issue: Maana ya לְנֶפֶשׁ חַיָּה
  choice: kiumbe hai
  alternative: nafsi hai
  rationale: “Kiumbe hai” hueleza kuwa mtu mzima akawa mwenye uhai na huepuka kuingiza bila msingi wazo kwamba נֶפֶשׁ hapa ni nafsi isiyo ya kimwili inayojitegemea. “Nafsi hai” linawezekana kimapokeo na limeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Akamfanyiza” huhifadhi picha ya kumpa umbo; “akampulizia puani” ni ya asili na halisi. Alama zote za tanbihi zimewekwa mahali panapohusika.
