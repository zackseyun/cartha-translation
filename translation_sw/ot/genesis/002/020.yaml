base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: sw
  text: Mtu huyo akawapa mifugo yote majina, ndege wa angani, na kila mnyama wa porini; lakini mtu huyo hakupata msaidizi anayelingana naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msaidizi anayemfaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: huyo mtu / kwa huyo mtu
  rationale: Kifungu cha kwanza kina kibainishi na kinamrejelea mtu mmoja katika simulizi. “Huyo mtu” hudumisha maana ya nomino ya kawaida na rejeleo lake dhahiri bila kuitafsiri mapema kuwa jina “Adamu.”
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: akawapa majina
  rationale: Nahau hii ina maana ya kuwapa viumbe majina. Kauli hii ni ya kawaida katika Kiswahili na pia inaakisi nomino ya wingi “majina.”
- source_word: הַבְּהֵמָה
  choice: mifugo yote
  rationale: Katika mgawanyo huu neno linamaanisha wanyama wanaofugwa, tofauti na ndege na wanyama wa porini. “Mifugo” ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inadumisha taswira ya Kiebrania ya viumbe warukao angani.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: kila mnyama wa porini
  rationale: Katika muktadha huu kirai kinarejelea wanyama wa nchi wasiofugwa. “Wa porini” huonyesha tofauti hiyo kwa lugha ya kawaida bila kutumia usemi wa kale.
- source_word: עֵזֶר
  choice: msaidizi
  rationale: Neno linaweza kumaanisha msaada au anayetoa msaada. Hapa linarejelea mwenzi halisi; “msaidizi” halidokezi lenyewe kuwa huyo ni wa cheo cha chini.
- source_word: כְּנֶגְדּוֹ
  choice: anayelingana naye
  rationale: Usemi huu una wazo la kuwa mbele yake na kumlingana au kuafikiana naye. “Anayelingana naye” huhifadhi ulinganifu huo bila kuamua zaidi aina ya uhusiano.
- source_word: לֹא מָצָא
  choice: hakupatikana
  rationale: Ingawa kitenzi cha Kiebrania ni cha utendaji, Kiswahili cha hali ya kutendwa kinaeleza kwa kawaida matokeo kwamba msaidizi wa namna hiyo hakuwapo miongoni mwa viumbe waliotajwa. Kauli ya utendaji imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya אָדָם katika Mwanzo 2:20
  choice: huyo mtu
  alternative: Adamu
  rationale: Muktadha unamhusu mtu mmoja bustanini, lakini matumizi yenye kibainishi bado yanatanguliza maana ya kawaida ya “mtu” kuliko jina maalumu. Tafsiri hii pia haipanui rejeleo kuwa wanadamu wote.
- issue: Uhusiano unaoelezwa na עֵזֶר כְּנֶגְדּוֹ
  choice: msaidizi anayelingana naye
  alternative: msaidizi anayemfaa
  rationale: Tafsiri iliyochaguliwa hudumisha wazo la msaada pamoja na ulinganifu bila kuingiza dhana ya uduni au kufafanua kwa kupita kiasi namna ya kufaa kwake.
- issue: Mtendaji wa לֹא מָצָא
  choice: hakupatikana
  alternative: huyo mtu hakumpata
  rationale: Kauli ya kutendwa inaweka mkazo kwenye matokeo, lakini Kiebrania chenyewe kinasema kihalisi “hakupata.” Tofauti hiyo imeelezwa katika tanbihi ili kutunza uwezekano wa kauli ya utendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Huyo mtu” hutumika kudumisha rejeleo la mhusika aliyetangulia bila kulazimisha jina “Adamu”; “mifugo” na “wanyama wa porini” huweka wazi mgawanyo wa aina za wanyama.
