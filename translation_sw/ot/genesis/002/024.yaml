  verdict: revise
  source_fidelity: The rendering accurately preserves the inferential opening (עַל־כֵּן), the masculine singular representative subject, the explicitly named father and mother, attachment to the wife, and the resultative idiom “one flesh.” However, “atamwacha baba yake na mama yake” uses a singular object concord before a coordinated pair and is less idiomatic than an unmarked verb here.
  naturalness: The register is clear, modern Standard East African Swahili. Replacing “atamwacha” with “ataacha” makes the coordinated objects read naturally without adding the sense of total abandonment.
  terminology: “Mwanamume,” “mke wake,” “atashikamana na,” and “mwili mmoja” are accurate, natural choices. The footnotes appropriately retain lexical alternatives and explain the Hebrew idiom without imposing a doctrinal interpretation.
  issues:
