    issue: Singular object concord in “atamwacha baba yake na mama yake.”
    rationale: Although understandable, the singular object marker -m- immediately preceding two coordinated human objects is stylistically awkward. “Ataacha baba yake na mama yake” naturally expresses the source’s generic “leave” without implying abandonment.
  revised_text: Kwa hiyo, mwanamume ataacha baba yake na mama yake, atashikamana na mke wake[a], nao watakuwa mwili mmoja.[b]
