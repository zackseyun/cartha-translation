  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: sw
  text: Kwa hiyo, mwanamume ataacha baba yake na mama yake, atashikamana na mke wake[a], nao watakuwa mwili mmoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataambatana na” au “atajiunga kwa karibu na.” Kitenzi cha Kiebrania kinaonyesha kushikamana kwa nguvu.
    reason: lexical_alternative
  - marker: b
    text: “Mwili mmoja” ni msemo wa Kiebrania unaojumuisha muungano wa kimwili na kuundwa kwa uhusiano mpya wa kifamilia.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na simulizi lililotangulia, kwa Kiswahili cha kawaida na cha sasa.
- source_word: יַעֲזָב
  choice: atamwacha
  rationale: Wakati ujao hapa unaeleza kanuni ya jumla, si amri ya moja kwa moja. ‘Kumwacha’ huhifadhi maana bila kudokeza kumtelekeza kabisa.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Huhifadhi nomino ya umoja yenye jinsia ya kiume katika Kiebrania na kuitumia kwa maana wakilishi katika ndoa.
- source_word: אָבִיו ... אִמּוֹ
  choice: baba yake na mama yake
  rationale: Kiebrania kinawataja wazazi wote wawili mmoja mmoja; tafsiri haijawafupisha kuwa ‘wazazi wake’.
- source_word: וְדָבַק
  choice: atashikamana na
  rationale: Kitenzi kinaonyesha kuambatana kwa nguvu na kwa kudumu. ‘Atashikamana na’ ni cha asili na huhifadhi picha ya kushikamana.
- source_word: בְּאִשְׁתּוֹ
  choice: mke wake
  rationale: Katika muktadha huu אִשָּׁה yenye kiambishi cha umilikaji humaanisha mke, si mwanamke kwa ujumla.
- source_word: וְהָיוּ
  choice: nao watakuwa
  rationale: Wingi wa kitenzi unaonyesha wahusika wote wawili. ‘Watakuwa’ huwasilisha hali mpya inayotokana na kushikamana kwao bila kuongeza kitenzi kisicho cha lazima.
- source_word: לְבָשָׂר אֶחָד
  choice: mwili mmoja
  rationale: Ni ulinganifu wa kawaida na wenye kueleweka wa nahau ya Kiebrania ‘nyama moja’; huhifadhi maana ya muungano wa kimwili na kifamilia bila kuifafanua kupita kiasi katika matini.
theological_decisions:
- issue: Lugha ya jinsia katika kanuni ya ndoa
  choice: mwanamume
  alternative: mtu
  rationale: אִישׁ ni umoja wa kiume. Kutafsiri ‘mwanamume’ huhifadhi umbo la chanzo badala ya kulifanya lisilo na jinsia.
- issue: Aina ya kauli
  choice: 'Wakati ujao unaowasilisha kanuni ya jumla: ‘atamwacha ... atashikamana ... watakuwa’'
  alternative: Amri ya moja kwa moja au maelezo ya desturi ya wakati uliopita
  rationale: Maumbo ya vitenzi vya Kiebrania yanaweka kanuni ya jumla inayotokana na simulizi la uumbaji; hayatoi amri ya moja kwa moja wala kueleza desturi ya zamani tu.
- issue: Maana ya ‘mwili mmoja’
  choice: Nahau imehifadhiwa katika matini na kufafanuliwa kwa ufupi katika tanbihi
  alternative: Kuitafsiri moja kwa moja kuwa ‘muungano wa kimwili na kifamilia’ ndani ya matini
  rationale: Nahau ina upana wa maana unaojumuisha muungano wa kimwili na kuundwa kwa uhusiano mpya wa kifamilia. Kuihifadhi huepuka kupunguza mvutano na utajiri wake wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa kifasihi kwa kiasi lakini si wa kizamani; ‘mke wake’ limetumiwa badala ya umbo lililofupishwa ‘mkewe’ ili sentensi iwe wazi na ya kawaida.
