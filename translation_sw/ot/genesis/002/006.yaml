  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: sw
  text: Lakini ukungu[a] ulikuwa ukipanda kutoka ardhini na kulowanisha uso wote wa udongo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijito” au “mtiririko wa maji”; neno hili la Kiebrania ni adimu na huenda likarejelea maji yaliyokuwa yakibubujika kutoka ardhini badala ya ukungu hewani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: Lakini ukungu
  rationale: אֵד ni neno adimu lenye maana inayobishaniwa. “Ukungu” linaendana na kitenzi cha kupanda kutoka ardhini; “Lakini” linaonyesha tofauti na kauli iliyotangulia kwamba mvua haikuwa imenyesha.
- source_word: יַעֲלֶה
  choice: ulikuwa ukipanda
  rationale: Kauli hii huonyesha tendo la kawaida au linaloendelea katika simulizi la wakati uliopita, si tukio moja tu.
- source_word: מִן הָ/אָ֑רֶץ
  choice: kutoka ardhini
  rationale: אֶרֶץ hapa ina maana pana ya ardhi katika muktadha wa uumbaji, huku ikitofautishwa na אֲדָמָה mwishoni mwa mstari.
- source_word: וְ/הִשְׁקָה
  choice: na kulowanisha
  rationale: Hifili ya שקה humaanisha kunywesha au kutia maji. “Kulowanisha” ni Kiswahili cha kawaida kinachoeleza athari ya maji bila kutumia istilahi ya kiufundi ya umwagiliaji.
- source_word: אֶת כָּל פְּנֵי
  choice: uso wote wa
  rationale: Hifadhi taswira ya Kiebrania ya “uso” huku ikitoa maana ya eneo lote la juu.
- source_word: הָֽ/אֲדָמָֽה
  choice: udongo
  rationale: אֲדָמָה hurejelea ardhi ya chini au udongo; “udongo” huhifadhi tofauti yake na אֶרֶץ, iliyotafsiriwa “ardhi.”
theological_decisions:
- issue: Maana ya אֵד
  choice: ukungu
  alternative: kijito au mtiririko wa maji
  rationale: “Ukungu” linaendana moja kwa moja na tendo la kupanda kutoka ardhini, lakini kwa kuwa neno la Kiebrania ni adimu na huenda likamaanisha maji yanayobubujika kutoka ardhini, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ulikuwa ukipanda ... na kulowanisha” unaonyesha tendo la kawaida au linaloendelea katika mazingira ya wakati uliopita.
