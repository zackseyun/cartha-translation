  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: sw
  text: Yahwe Mungu akamwamuru mtu, akisema, “Unaweza kula kwa uhuru matunda ya kila mti wa bustani.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasisitiza tendo la kula; pia yaweza kutafsiriwa, “hakika unaweza kula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akamwamuru
  rationale: Kitenzi צוה kinaonyesha amri yenye mamlaka; “akamwamuru” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Jina la Mungu יְהוָה linawakilishwa kama “Yahwe,” nalo אֱלֹהִים kama “Mungu,” kwa mpangilio wa chanzo.
- source_word: עַל־הָאָדָם
  choice: huyo mtu
  rationale: Katika muktadha huu הָאָדָם ni yule mtu mmoja aliyeumbwa na kuwekwa bustanini. “Huyo mtu” humrejelea kwa wazi bila kulifanya neno kuwa jina maalumu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Hiki ni kiashiria cha Kiebrania kinachoanzisha maneno ya moja kwa moja. Katika Kiswahili cha sasa, nukta mbili huwasilisha kazi yake kwa ufasaha kuliko “akisema” isiyo ya lazima.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: matunda ya kila mti wa bustani
  rationale: Kiebrania kinasema kwa kifupi kula “kutoka katika kila mti”; Kiswahili kwa kawaida hutaja kile kinacholiwa, yaani matunda. “Kila mti wa bustani” huhifadhi upana wa ruhusa.
- source_word: אָכֹל תֹּאכֵל
  choice: unaweza kula kwa uhuru
  rationale: Muundo wa jina-kitenzi pamoja na kitenzi chenye ukomo unasisitiza tendo la kula. Katika muktadha huu ni ruhusa, na “kwa uhuru” huonyesha msisitizo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, kwa hiyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Maana ya הָאָדָם
  choice: huyo mtu
  alternative: binadamu; wanadamu
  rationale: Muktadha unamhusu mtu mmoja maalumu katika simulizi, si wanadamu kwa ujumla.
- issue: Nguvu ya אָכֹל תֹּאכֵל
  choice: 'ruhusa iliyosisitizwa: “unaweza kula kwa uhuru”'
  alternative: 'amri: “hakika utakula”'
  rationale: Ingawa muundo wa Kiebrania unasisitiza kitenzi, muktadha unaonyesha ruhusa pana inayotangulia katazo la mstari unaofuata, si wajibu wa kula kutoka kila mti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nukta mbili zimetumiwa kwa asili kuanzisha usemi wa moja kwa moja; “kwa uhuru” huwasilisha ruhusa iliyosisitizwa bila lugha ngumu.
