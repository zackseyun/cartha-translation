  to: Yahwe Mungu akafanyiza kutoka katika ardhi kila mnyama wa porini na kila ndege wa angani.[a] Akawaleta kwa mtu ili aone angewaitaje. Jina lolote ambalo mtu alimpa kila kiumbe hai, likawa jina lake.[b]
