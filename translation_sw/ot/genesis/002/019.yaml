id: GEN.2.19
reference: Genesis 2:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: sw
  text: Yahwe Mungu akafanyiza kutoka katika ardhi kila mnyama wa porini na kila ndege wa angani.[a] Akawaleta kwa mtu ili aone angewaitaje. Jina lolote ambalo mtu alimpa kila kiumbe hai, likawa jina lake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amefanyiza.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa wakati uliopita wa kawaida; muktadha pia unaweza kueleweka kuwa tendo la kufanyiza lilikuwa limetangulia.
    reason: alternative_reading
  - marker: b
    text: Au, “Adamu” badala ya “mtu.” Kiebrania kina ha’adam, yaani, “mtu huyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: akafanyiza
  rationale: Kitenzi hiki kina maana ya kufinyanga au kufanyiza. “Akafanyiza” kinaonyesha tendo la kuunda kwa kusudi na kinafuata kwa kawaida mfululizo wa masimulizi ya Kiebrania bila kulazimisha wakati uliotangulia.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahwe,” nalo linafuatwa na cheo “Mungu,” kama ilivyo katika muundo wa Kiebrania.
- source_word: מִן הָאֲדָמָה
  choice: kutoka katika ardhi
  rationale: אֲדָמָה ni ardhi au udongo. “Ardhi” ni ya kawaida na inadumisha uhusiano wa kimatini kati ya mtu na ardhi bila kuongeza maelezo yasiyomo.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: kila mnyama wa porini
  rationale: Hii ni tafsiri ya kawaida ya wanyama wa nchi au uwanda; “wa porini” inaeleweka kwa wasomaji wa Afrika Mashariki na haibebi uzito wa lugha ya kale.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: kila ndege wa angani
  rationale: Katika muktadha huu עוֹף inaelekea kumaanisha ndege, na “wa angani” ni Kiswahili cha kawaida kinacholingana na הַשָּׁמַיִם.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: Akawaleta kwa mtu huyo
  rationale: Kiambishi “-wa-” kinaweka wazi wahusika wengi wanaoletwa. הָאָדָם ina kifungu bainishi, kwa hiyo “mtu huyo” hudumisha maana ya nomino ya kawaida badala ya kuifanya moja kwa moja kuwa jina maalumu.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: ili aone angewaitaje
  rationale: “Ili aone” hudumisha kusudi lililo katika infinitivu, na “angewaitaje” hutoa kwa Kiswahili asilia wazo la kuona majina ambayo mtu angewapa.
- source_word: נֶפֶשׁ חַיָּה
  choice: kiumbe hai
  rationale: Katika muktadha huu kirai kinataja kiumbe chenye uhai, si dhana maalumu ya kiteolojia ya “roho.”
- source_word: הוּא שְׁמוֹ
  choice: hilo likawa jina lake
  rationale: Kishazi cha Kiebrania kinathibitisha kwamba kile alichokiita ndicho kilikuwa jina la kiumbe; “likawa” ni mtiririko wa kawaida wa simulizi la Kiswahili.
theological_decisions:
- issue: Wakati wa וַיִּצֶר na mpangilio wa uumbaji
  choice: akafanyiza (wakati uliopita wa simulizi)
  alternative: alikuwa amefanyiza
  rationale: Umbo la wayyiqtol kwa kawaida huendeleza simulizi na halionyeshi lenyewe wakati uliotangulia. Tafsiri kuu haipaswi kutatua kimya kimya suala la mpangilio; uwezekano wa tendo lililotangulia umetajwa katika tanbihi.
- issue: Ikiwa הָאָדָם ni nomino ya kawaida au jina maalumu
  choice: mtu huyo
  alternative: Adamu
  rationale: Kifungu bainishi katika Kiebrania na mchezo wa maneno unaohusisha אֲדָמָה vinaunga mkono maana ya “mtu huyo.” Mapokeo ya kuisoma kama jina “Adamu” yamehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akafanyiza,” “wanyama wa porini,” na “ndege wa angani” vinaweka usahihi wa chanzo huku vikibaki wazi kwa msomaji wa kawaida. Tanbihi zimewekwa mara baada ya sehemu zinazohusika.
