base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: sw
  text: Haya ndiyo masimulizi[a] ya mbingu na dunia wakati zilipoumbwa, wakati[b] Yahwe Mungu[c] alipofanya dunia na mbingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania toledot linaweza kumaanisha “vizazi,” “masimulizi,” “historia,” au “asili”; katika Mwanzo hutumiwa mara nyingi kama kichwa kinachoanzisha sehemu mpya.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania ni “katika siku ambayo,” nahau inayoweza kumaanisha “wakati” au “wakati ambapo.”
    reason: lexical_alternative
  - marker: c
    text: Jina la Kiebrania ni YHWH, linalotafsiriwa hapa “Yahwe”; kwa desturi nyingine hutafsiriwa “BWANA,” na pia huandikwa “Yehova.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: Haya ndiyo masimulizi
  rationale: Kauli hii inaanzisha sehemu mpya ya Mwanzo. “Masimulizi” ni Kiswahili cha kawaida kinachoeleza kazi ya תוֹלְדוֹת hapa bila kuifanya sentensi isikike kana kwamba mbingu na dunia zina ukoo wa kibinadamu; tanbihi inadumisha maana halisi na mbadala zake.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: mbingu na dunia
  rationale: Inadumisha jozi inayowakilisha ulimwengu wote na pia wingi wa neno la Kiebrania שָׁמַיִם.
- source_word: בְּהִבָּרְאָם
  choice: wakati zilipoumbwa
  rationale: Muundo wa Kiebrania una maana ya wakati na kitenzi ברא kiko katika hali ya kutendwa; tafsiri hii inadumisha vipengele vyote viwili kwa Kiswahili cha kawaida.
- source_word: בְּיוֹם
  choice: wakati
  rationale: Kirai “katika siku” kinatumika hapa kama nahau ya Kiebrania yenye maana ya “wakati”; “wakati” huepuka kudokeza bila lazima kwamba kinachozungumziwa kilitokea ndani ya siku moja ya saa ishirini na nne.
- source_word: עֲשׂוֹת
  choice: alipoifanya
  rationale: Kitenzi עשה humaanisha “kufanya” au “kutengeneza”; hapa “alipoifanya” ni cha moja kwa moja na kinaendana na muundo wa wakati.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Jina la Mungu יהוה linawakilishwa kama “Yahwe,” huku אֱלֹהִים likitafsiriwa “Mungu.”
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: dunia na mbingu
  rationale: Mpangilio uliogeuzwa ikilinganishwa na sehemu ya kwanza unadumishwa kwa athari ya kifasihi.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” linawakilisha kwa uwazi zaidi jina binafsi la Kiebrania YHWH badala ya kulibadilisha kuwa cheo; tanbihi inataja desturi nyingine zinazojulikana.
- issue: Maana ya בְּיוֹם katika muktadha wa uumbaji
  choice: wakati
  alternative: siku ambayo
  rationale: Kirai hiki ni nahau ya wakati na si lazima kiweke muda wa saa ishirini na nne; tafsiri haifanyi uamuzi wa ziada kuhusu urefu wa kipindi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Masimulizi” kinaeleweka kwa urahisi kuliko “vizazi” katika muktadha wa mbingu na dunia, huku tanbihi ikihifadhi upana wa neno la Kiebrania. Marudio ya “wakati” yanadumisha miundo miwili ya wakati katika chanzo bila kuingiza hitimisho kuhusu urefu wa siku.
