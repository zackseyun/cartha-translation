revisions:
- from: Kisha huyo mwanamume akasema, “Hatimaye[a], huyu ni mfupa wa mifupa yangu na nyama ya nyama yangu. Huyu ataitwa ‘mwanamke,’ kwa sababu alitwaliwa kutoka kwa mwanamume[b].”
  to: Kisha mwanamume akasema, “Hatimaye![a] Huyu ni mfupa wa mifupa yangu, na nyama ya nyama yangu. Huyu ataitwa ‘mwanamke,’ kwa sababu alichukuliwa kutoka kwa mwanamume.”[b]
  rationale: The revision removes an unwarranted demonstrative, makes the exclamation idiomatic, and replaces a marked passive verb with a modern neutral equivalent. It preserves the Hebrew’s poetic parallelism, passive construction, causal clause, and the man/woman wordplay. The lexical alternative for זֹאת הַפַּעַם remains in a footnote without treating the idiomatic ‘Hatimaye!’ as the only possible construal.
