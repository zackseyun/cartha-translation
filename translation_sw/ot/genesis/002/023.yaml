base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: sw
  text: Kisha mwanamume akasema, “Hatimaye![a] Huyu ni mfupa wa mifupa yangu, na nyama ya nyama yangu. Huyu ataitwa ‘mwanamke,’ kwa sababu alichukuliwa kutoka kwa mwanamume.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na Kiebrania, “Wakati huu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania kuna mchezo wa maneno kati ya ʾishah, “mwanamke,” na ʾish, “mwanamume.” Kiswahili kinaonyesha mwangwi fulani kwa maneno “mwanamke” na “mwanamume,” ingawa si sawa kabisa.
    reason: wordplay
lexical_decisions:
- source_word: הָאָדָם
  choice: huyo mwanamume
  rationale: Katika muktadha huu אָדָם humtaja mwanadamu wa kiume, kwa kutofautishwa na אִשָּׁה na אִישׁ katika kauli inayofuata. ‘Huyo mwanamume’ ni ya kawaida na hudumisha rejeo hilo.
- source_word: זֹאת הַפַּעַם
  choice: Hatimaye, huyu
  rationale: Ingawa kwa muundo wa moja kwa moja ni ‘wakati huu,’ katika muktadha huu msemo unaonyesha kutambua kwamba sasa amepatikana anayelingana naye. ‘Hatimaye’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida, na ‘huyu’ huhifadhi kiwakilishi cha kuonyesha.
- source_word: עֶצֶם מֵעֲצָמַי
  choice: mfupa wa mifupa yangu
  rationale: Huu ni usemi wa asili na wenye hadhi katika Kiswahili unaohifadhi taswira na urudiaji wa Kiebrania; מִן hapa inaweza kueleza asili au uhusiano wa sehemu.
- source_word: וּבָשָׂר מִבְּשָׂרִי
  choice: na nyama ya nyama yangu
  rationale: Uamuzi huu hudumisha usambamba na ‘mfupa wa mifupa yangu’ na kuwasilisha uhusiano wa karibu unaosemwa na Kiebrania bila kufanya Kiswahili kuwa kigumu.
- source_word: לְזֹאת יִקָּרֵא אִשָּׁה
  choice: Huyu ataitwa ‘mwanamke’
  rationale: ‘Huyu’ huhifadhi msisitizo wa demonstrative זֹאת, na ‘ataitwa’ huwasilisha Niphal ya קרא kama kauli ya kutaja jina.
- source_word: כִּי מֵאִישׁ לֻקֳחָה זֹּאת
  choice: kwa sababu alitwaliwa kutoka kwa mwanamume
  rationale: ‘Kwa sababu’ huonyesha sababu ya jina; ‘alitwaliwa kutoka kwa’ hudumisha hali tendwa na wazo la asili. Kiima cha kike kinaeleweka kutokana na ‘mwanamke,’ huku demonstrative ya mwisho ikiwakilishwa na ‘huyu’ mwanzoni mwa sentensi.
theological_decisions:
- issue: Maana ya אָדָם katika muktadha
  choice: mwanamume
  alternative: mwanadamu
  rationale: Ingawa אָדָם inaweza kumaanisha mwanadamu au wanadamu kwa ujumla, hapa muktadha unaelekea kwenye utofautishaji wa kiume na kike na mchezo wa maneno wa אִישׁ/אִשָּׁה. ‘Mwanamume’ hudumisha hilo bila kuongeza dai pana la kiantropolojia.
- issue: Mchezo wa maneno kati ya אִשָּׁה na אִישׁ
  choice: mwanamke ... mwanamume
  alternative: mke ... mume
  rationale: ‘Mwanamke/mwanamume’ huonyesha mwangwi wa kimatamshi kwa kiasi fulani na huhifadhi maana pana ya woman/man. ‘Mke/mume’ ungeingiza kwa uwazi zaidi maana ya uhusiano wa ndoa, ambayo si lazima iamuliwe na maneno haya pekee.
- issue: Nguvu ya זֹאת הַפַּעַם
  choice: Hatimaye
  alternative: Wakati huu
  rationale: Kiebrania kinaweza kufuatwa moja kwa moja kama ‘wakati huu,’ lakini katika mfululizo wa simulizi kauli hiyo hubeba hisia ya kufikiwa kwa jambo lililotarajiwa. Maelezo ya chini yanahifadhi uwezekano wa tafsiri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Alitwaliwa’ limetumiwa badala ya ‘alichukuliwa’ ili kuonyesha tendo la kutolewa kutoka kwa mwanamume bila kudokeza tu kupelekwa mahali pengine. Muundo wa kishairi na usambamba wa kauli umehifadhiwa.
