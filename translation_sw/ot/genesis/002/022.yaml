  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: sw
  text: BWANA Mungu akaujenga ule ubavu[a] aliouchukua kutoka kwa mtu huyo kuwa mwanamke, kisha akamleta kwa mtu huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa "ubavu" linaweza pia kumaanisha "upande."
    reason: Huonyesha utata wa kileksia wa ṣēlāʿ bila kulazimisha maana mbadala katika maandishi makuu.
lexical_decisions:
- source_word: וַיִּבֶן (wayyiḇen)
  choice: akalijenga
  rationale: Kitenzi cha Kiebrania kinamaanisha kihalisi ‘kujenga’; tafsiri hii inahifadhi taswira ya chanzo badala ya kuifanya tu ‘akafanya.’
- source_word: יְהוָה אֱלֹהִים (YHWH ʾĕlōhîm)
  choice: BWANA Mungu
  rationale: Hufuata desturi ya Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA,’ huku ‘Mungu’ ikitafsiri ʾĕlōhîm.
- source_word: הַצֵּלָע (haṣṣēlāʿ)
  choice: lile ubavu
  rationale: Katika muktadha huu ‘ubavu’ ni tafsiri ya kawaida na inayoeleweka ya ṣēlāʿ, ingawa neno hilo pia linaweza kumaanisha ‘upande.’
- source_word: הָאָדָם (hāʾādām)
  choice: huyo mtu
  rationale: Huhifadhi maana ya ‘mtu’ yenye kibainishi, bila kulazimisha jina binafsi ‘Adamu’ katika mstari huu.
- source_word: לְאִשָּׁה (ləʾiššāh)
  choice: kuwa mwanamke
  rationale: 'Muundo huu unaonyesha matokeo ya tendo la kujenga: ubavu ulijengwa kuwa mwanamke.'
- source_word: וַיְבִאֶהָ אֶל־הָאָדָם (wayəḇiʾehā ʾel-hāʾādām)
  choice: akamleta kwa huyo mtu
  rationale: Kiwakilishi cha kike kinarejelea mwanamke; ‘akamleta kwa’ ni Kiswahili cha asili kinachohifadhi tendo la kumleta mbele ya mtu.
theological_decisions:
- issue: Taswira ya Mungu ‘kujenga’ mwanamke
  choice: akalijenga
  alternative: akalifanya
  rationale: ‘Kujenga’ ndiyo maana mahususi ya kitenzi cha chanzo na hudumisha taswira ya kifasihi na ya kitheolojia bila kuifafanua zaidi.
- issue: Je, הָאָדָם ni jina ‘Adamu’ au nomino ‘mtu’?
  choice: huyo mtu
  alternative: Adamu
  rationale: Kibainishi cha Kiebrania na muktadha wa karibu vinaunga mkono nomino ya kawaida ‘mtu’; tafsiri haipaswi kuamua kimya kimya kwamba hapa tayari ni jina binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio umerekebishwa kiasi ili sentensi isomeke kwa kawaida, huku marudio ya ‘huyo mtu’ na taswira ya ‘kujenga’ vikihifadhiwa.
