  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: sw
  text: Yahweh Mungu akapanda bustani katika Edeni, upande wa mashariki,[a] na humo akamweka mtu ambaye alikuwa amemuumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea mashariki.” Kirai cha Kiebrania kinaweza kuonyesha mahali (“upande wa mashariki”) au mwelekeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: akapanda
  rationale: Kitenzi נטע humaanisha kupanda mimea; “akapanda” ni Kiswahili cha kawaida na hudumisha taswira ya bustani.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Mungu
  rationale: Jina la Mungu יְהוָה limetoholewa kuwa “Yahweh,” na אֱלֹהִים limetafsiriwa “Mungu,” kwa kufuata mpangilio wa Kiebrania.
- source_word: גַּן
  choice: bustani
  rationale: Neno גַּן hapa linamaanisha eneo lililopandwa au kutunzwa; “bustani” ndilo neno la kawaida na wazi katika Kiswahili.
- source_word: בְעֵדֶן
  choice: katika Edeni
  rationale: עֵדֶן ni jina la mahali, lililotoholewa kwa umbo la Kiswahili “Edeni.”
- source_word: מִקֶּדֶם
  choice: upande wa mashariki
  rationale: Kirai hiki kinaweza kutaja mahali palipo mashariki au mwelekeo wa kuelekea mashariki. Maana ya mahali imetumiwa katika matini, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: וַיָּשֶׂם שָׁם
  choice: na humo akamweka
  rationale: “Humo” hurejelea kwa kawaida ndani ya bustani iliyotajwa, na “akamweka” huwasilisha maana ya kuweka mtu mahali fulani.
- source_word: הָאָדָם
  choice: mtu
  rationale: Katika muktadha huu neno lenye kibainishi linamrejelea mwanadamu mmoja aliyekuwa ameumbwa. “Mtu” ni la asili katika Kiswahili na haligeuzi jina la kawaida kuwa jina maalumu.
- source_word: אֲשֶׁר יָצָר
  choice: ambaye alikuwa amemuumba
  rationale: Kitenzi יצר kina maana ya kufinyanga au kuumba. Wakati uliotangulia unaonyesha kuwa kuumbwa kulitokea kabla ya kuwekwa bustanini.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Matini ina jina binafsi la Mungu, kwa hiyo “Yahweh” hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Uwasilishaji wa הָאָדָם
  choice: mtu
  alternative: mwanadamu / huyo mwanamume / Adamu
  rationale: Hapa neno hilo linamrejelea mwanadamu mmoja aliyekwisha kuumbwa, lakini bado ni nomino ya kawaida yenye kibainishi. “Mtu” ni sahihi na ya kawaida bila kulifanya jina “Adamu” mapema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa mwepesi kusomeka, huku utata halisi wa מִקֶּדֶם ukihifadhiwa kwa tanbihi.
