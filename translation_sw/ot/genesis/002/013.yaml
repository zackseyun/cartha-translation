  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: sw
  text: Na jina la mto wa pili ni Gihoni; huo ndio unaozunguka nchi yote ya Kushi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kushi ni jina la kale la mahali ambalo kwa kawaida limehusianishwa na maeneo ya kusini mwa Misri; maandishi ya Kiebrania yanahifadhi jina hilo lenyewe.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: Na jina
  rationale: Kiunganishi וְ kinaendeleza maelezo ya mito, na שֵׁם maana yake ni “jina.”
- source_word: הַ/נָּהָר הַ/שֵּׁנִי
  choice: la mto wa pili
  rationale: 'נָהָר ni “mto,” na הַשֵּׁנִי huonyesha mfuatano: “wa pili.”'
- source_word: גִּיחוֹן
  choice: Gihoni
  rationale: Jina hili limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הוּא
  choice: huo ndio
  rationale: Kiwakilishi hiki kinarudia na kubainisha mto uliotajwa kwa msisitizo wa asili.
- source_word: הַ/סּוֹבֵב
  choice: unaozunguka
  rationale: Kitenzi סבב kinaweza kumaanisha kwenda kuzunguka au kuzungushia; “unaozunguka” huhifadhi upana huo wa maana kwa lugha ya kawaida.
- source_word: אֵת כָּל אֶרֶץ
  choice: nchi yote ya
  rationale: כָּל אֶרֶץ hapa inaeleweka kiasili kama eneo zima linaloitwa kwa jina linalofuata.
- source_word: כּוּשׁ
  choice: Kushi
  rationale: Jina la kale la mahali limehifadhiwa badala ya kutafsiriwa kama Ethiopia, jambo ambalo lingeingiza utambulisho wa baadaye.
