translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Wakati uliopo “ni” na “unaozunguka” unafuata muundo wa Kiebrania, ambao unalitaja jina na kisha kuutambulisha mto kwa maelezo yake.
