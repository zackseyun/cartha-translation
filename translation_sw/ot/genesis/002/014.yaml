id: GEN.2.14
reference: Genesis 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: sw
  text: Na jina la mto wa tatu ni Hidekeli[a]; huo ndio unaopita mashariki mwa Ashuru[b]. Na mto wa nne ni Frati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hidekeli hutambulishwa kwa kawaida kuwa mto Tigris.
    reason: alternative_reading
  - marker: b
    text: Au, “mashariki mwa Ashiria”; Kiebrania, “mashariki mwa Ashuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: jina
  rationale: Maana ya kawaida ya neno hili, na inahifadhi muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: נָּהָר
  choice: mto
  rationale: Neno la kawaida kwa mkondo mkubwa wa maji katika muktadha huu.
- source_word: שְּׁלִישִׁי
  choice: wa tatu
  rationale: Ni namba ya mpangilio, na muundo huu unapatana kiasili na nomino 'mto'.
- source_word: חִדֶּקֶל
  choice: Hidekeli
  rationale: Jina la Kiebrania limetoholewa badala ya kubadilishwa moja kwa moja kuwa utambulisho wake wa jadi; utambulisho wa Tigris umewekwa katika tanbihi.
- source_word: הוּא הַהֹלֵךְ
  choice: huo ndio unaopita
  rationale: Huhifadhi msisitizo wa kiwakilishi הוּא na kuwasilisha kiasili mwendo wa mto unaoelezwa na kitenzi הלך.
- source_word: קִדְמַת
  choice: mashariki mwa
  rationale: Katika matumizi ya kijiografia hapa, neno hili linaonyesha mahali palipo mashariki ya eneo linalotajwa.
- source_word: אַשּׁוּר
  choice: Ashuru
  rationale: Inatohowa jina la Kiebrania bila kuamua kimya kimya kama linamaanisha jina lenyewe au nchi ya Ashiria.
- source_word: רְבִיעִי
  choice: wa nne
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya namba hii ya mpangilio.
- source_word: פְרָת
  choice: Frati
  rationale: Hili ndilo jina la Kiswahili linalotambulika kwa kawaida kwa mto Euphrates, na linaeleweka wazi kwa wasomaji wa sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi. Majina ya Hidekeli na Ashuru yametoholewa kutoka Kiebrania, huku Frati likitumia jina la Kiswahili lililozoeleka. Muundo 'huo ndio unaopita' unadumisha msisitizo wa maandishi ya chanzo bila kuwa mzito.
