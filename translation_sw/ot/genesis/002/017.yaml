  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: sw
  text: Lakini usile kutoka katika mti wa ujuzi wa mema na mabaya, kwa maana siku utakapokula kutoka katika mti huo, hakika utakufa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: lakini matunda ya mti
  rationale: Kiunganishi וּ kinaonyesha utofautishaji na ruhusa ya mstari uliotangulia, hivyo “lakini” linafaa. Kiebrania husema kihalisi “kutoka katika mti”; Kiswahili cha kawaida hutaja “matunda ya mti” ili kueleza kitu kinacholiwa bila kubadili maana.
- source_word: הַדַּעַת
  choice: ujuzi
  rationale: Nomino hii humaanisha ujuzi au kujua; “ujuzi” ni neno la kawaida na lenye hadhi katika muundo huu.
- source_word: טוֹב וָרָע
  choice: mema na mabaya
  rationale: Jozi hii ya Kiebrania huweza kuonyesha wigo mzima na pia hubeba uzito wa kimaadili. Nomino za ngeli ya 6 zinaendana kwa kawaida na “mambo” yanayodokezwa.
- source_word: לֹא תֹאכַל
  choice: usile
  rationale: Umbo hili ni katazo la moja kwa moja kwa mtu mmoja. “Usile” ni la asili, wazi, na lenye uzito ufaao katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי huanzisha sababu ya katazo. “Kwa maana” linaonyesha uhusiano huo kwa uwazi.
- source_word: בְּיוֹם אֲכָלְךָ
  choice: siku utakapokula
  rationale: Tafsiri hii inadumisha taswira ya “siku” iliyopo katika Kiebrania, huku muundo wa “utakapokula” ukiwasilisha kazi yake ya wakati bila kuamua maana yake kwa nguvu zaidi ya matini.
- source_word: מוֹת תָּמוּת
  choice: hakika utakufa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kilichonyambuliwa unasisitiza uhakika wa kifo; “hakika utakufa” ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
theological_decisions:
- issue: Nguvu ya wakati katika בְּיוֹם (“siku”) na namna kifo kinavyotimia
  choice: Kudumisha “siku utakapokula” bila kufafanua kama ni kifo cha mwili mara moja, mwanzo wa hali ya kufa, au hukumu ya kifo iliyo hakika.
  alternative: Kutafsiri kwa upana zaidi “wakati utakapokula” au kuifanya iwe hukumu ya kifo cha papo hapo.
  rationale: Kiebrania kina usemi wa wakati unaoweza kueleweka kama “siku” au kwa upana kama “wakati.” Tafsiri kuu inapaswa kuhifadhi mvutano huo badala ya kuutatua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kuleta “matunda ya mti” mbele unahifadhi msisitizo wa Kiebrania bila marudio yasiyo ya kawaida katika Kiswahili. “Hakika utakufa” ni wazi kwa msomaji wa kawaida na huhifadhi uzito wa onyo.
