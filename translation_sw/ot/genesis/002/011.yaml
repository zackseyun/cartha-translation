  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: sw
  text: Mto wa kwanza unaitwa Pishoni; huo ndio unaozunguka nchi yote ya Havila[a], ambako kuna dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huo ndio unaoizingira nchi yote ya Havila.” Kishiriki cha Kiebrania kinaweza kutafsiriwa “unaizunguka” au “unaoizingira”; katika muktadha wa mto, pia kinaweza kueleweka kuwa unapita kandokando ya nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: Mto wa kwanza unaitwa
  rationale: Katika muktadha wa mito minne, הָאֶחָד ina kazi ya kuonyesha wa kwanza katika mfuatano. Kiswahili hiki ni cha kawaida na kinaweka wazi kwamba jina linalotajwa ni la mto.
- source_word: פִּישׁוֹן
  choice: Pishoni
  rationale: Jina maalumu la mto limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: הוּא הַסֹּבֵב
  choice: huo ndio unaopita kuzunguka
  rationale: Kiwakilishi kinarejelea mto, na סבב humaanisha kwenda au kuzunguka. Kauli hii inaleta picha ya mto unaopita bila kulazimisha maana tuli ya kuizingira kabisa nchi.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: nchi yote ya Havila
  rationale: אֶרֶץ hapa ni nchi au eneo lenye jina, na כָּל imehifadhiwa kwa neno “yote.” Jina Havila limetoholewa kwa Kiswahili.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: ambako kuna dhahabu
  rationale: Kauli hii ya mahali inarejelea nchi iliyotajwa na kueleza kuwapo kwa dhahabu humo kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Muundo “Mto wa kwanza unaitwa” umetumiwa badala ya tafsiri ngumu ya neno kwa neno, huku maana ya mfuatano na ya kutaja jina ikihifadhiwa.
