  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: sw
  text: Ndipo Yahwe Mungu akasema, “Si vema mwanamume awe peke yake. Nitamfanyia msaidizi atakayelingana naye[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msaidizi anayemfaa,” “msaidizi anayefaa kwake,” au “msaidizi anayelingana naye.” Usemi wa Kiebrania unadokeza mtu anayelingana naye au aliye mbele yake kama mwandani wake, wala si msaidizi wa cheo cha chini tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limetoholewa kama jina binafsi la Mungu badala ya kubadilishwa kwa cheo kama ‘BWANA’.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa cheo cha kimungu katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: ‘Akasema’ hutoa maana ya msingi, na ‘Ndipo’ huonyesha mwendelezo wa simulizi unaobebwa na waw-consecutive.
- source_word: לֹא טוֹב
  choice: Si vema
  rationale: Usemi huu ni wa kawaida, wazi, na wenye uzito wa tathmini katika Kiswahili sanifu.
- source_word: הָאָדָם
  choice: mwanamume
  rationale: Katika muktadha huu anatajwa yule mtu mmoja wa kiume aliyeumbwa na kuwekwa bustanini, si wanadamu kwa ujumla.
- source_word: לְבַדּוֹ
  choice: awe peke yake
  rationale: Hueleza hali yake ya kuwa bila mwenzi kwa Kiswahili cha kawaida.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: Nitamfanyia
  rationale: Huhifadhi kusudi la Mungu na maana ya kumfanyia mtu huyo kwa muundo wa kawaida wa Kiswahili.
- source_word: עֵזֶר
  choice: msaidizi
  rationale: Hutaja mtu anayetoa msaada bila neno lenyewe kumweka katika cheo cha chini.
- source_word: כְּנֶגְדּוֹ
  choice: anayelingana naye
  rationale: Huwasilisha wazo la mtu anayemkabili na kumlingana, yaani anayelingana naye kwa uhusiano, bila kuingiza udogo au ukuu.
theological_decisions:
- issue: Maana ya הָאָדָם katika muktadha
  choice: mwanamume
  alternative: mtu; mwanadamu
  rationale: Simulizi linamhusu mtu mmoja wa kiume aliyekuwa bustanini. ‘Mwanamume’ huweka wazi uhusika huo bila kugeuza mstari kuwa kauli kuhusu jamii yote ya wanadamu.
- issue: Uwezekano wa kuelewa עֵזֶר כְּנֶגְדּוֹ kama cheo cha chini
  choice: msaidizi anayelingana naye
  alternative: msaidizi anayemfaa; msaidizi wa kufanana naye
  rationale: Kiebrania kinaunganisha msaada na ulinganifu au ukabilianaji. Tafsiri hii haidai kuwa msaidizi huyo ni wa chini wala wa juu, hivyo inadumisha mvutano wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Si vema’ na ‘awe peke yake’ ni miundo ya kawaida ya masimulizi ya kibiblia bila kuwa ya kizamani kupita kiasi.
