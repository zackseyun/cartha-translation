  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: sw
  text: Seti naye alizaliwa mwana, akamwita Enoshi. Wakati huo watu walianza kuliitia jina la Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa ukaribu zaidi: “Wakati huo ndipo ilipoanza kuliitia jina la Yahweh.” Kiebrania hakitaji wazi ni nani aliyeanza.'
    reason: lexical_alternative
  - marker: b
    text: 'Fasiri ya wachache huelewa kitenzi hiki kwa maana ya “lilinajisiwa,” na hivyo kupata maana kama: “Wakati huo watu walianza kulinajisi jina la Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא
  choice: Seti naye
  rationale: Muundo huu unaonyesha kuwa taarifa inayomhusu Seti inaongezwa kwa simulizi iliyotangulia. “Naye” ni ya kawaida na yenye heshima katika Kiswahili cha masimulizi.
- source_word: יֻלַּד בֵּן
  choice: akazaliwa mwana
  rationale: Huhifadhi hali ya kutendwa ya Kiebrania, yaani mwana alizaliwa kwa Seti, badala ya kuibadili moja kwa moja kuwa “akapata mwana.”
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: akamwita jina lake Enoshi
  rationale: Hufuata nahau ya Kiebrania “akaliita jina lake” kwa Kiswahili kinachoeleweka; maana yake ni kwamba alimpa jina Enoshi.
- source_word: אֱנוֹשׁ
  choice: Enoshi
  rationale: Jina la mtu limetoholewa kwa umbo linalotamkika kwa kawaida katika Kiswahili. Ingawa neno hilo linaweza kuhusiana na maana ya mwanadamu aliye dhaifu au mwenye kufa, hapa ni jina maalumu.
- source_word: אָז
  choice: Wakati huo
  rationale: Hutoa wazi maana ya wakati ya אָז bila kuifanya sentensi kuwa nzito.
- source_word: הוּחַל
  choice: walianza
  rationale: Hii ni tafsiri ya kimuktadha ya umbo la kutendwa lenye maana ya kuanza, huku Kiswahili kikitaja “watu” kama mhusika wa jumla. Umbo halisi zaidi na fasiri ya “kulinajisi” zimehifadhiwa katika tanbihi.
- source_word: לִקְרֹא בְּשֵׁם
  choice: kuliitia jina la
  rationale: Nahau hii mara nyingi humaanisha kumwomba au kumwabudu Mungu kwa kulitaja jina lake. “Kuliitia jina la” huhifadhi picha ya lugha ya chanzo na maana ya kumwomba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina maalumu la Mungu limetoholewa badala ya kubadilishwa kuwa cheo kama “Bwana.”
theological_decisions:
- issue: Maana ya הוּחַל לִקְרֹא בְּשֵׁם יְהוָה
  choice: Wakati huo watu walianza kuliitia jina la Yahweh
  alternative: Wakati huo jina la Yahweh lilianza kunajisiwa
  rationale: Katika muktadha, maana ya kuanza kumwomba Yahweh kwa jina lake ndiyo inayoeleweka zaidi. Hata hivyo, umbo הוּחַל linaweza kuhusishwa na mzizi wenye maana ya “kunajisi,” kwa hiyo uwezekano huo haujafichwa bali umewekwa katika tanbihi.
- issue: Jinsi ya kuwasilisha mtendaji asiyeelezwa katika umbo la Kiebrania
  choice: watu walianza
  alternative: ilianza kufanyika kwamba watu waliitia
  rationale: Kiebrania kina umbo la kutendwa lisilomtaji mtendaji. Kutumia “watu” katika Kiswahili huwasilisha mhusika wa jumla bila kumtambulisha mtu au kundi maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Naye,” “mwana,” na “kuliitia jina” huhifadhi hadhi na ladha ya kifasihi bila kutumia lugha ngumu kupita kiasi.
