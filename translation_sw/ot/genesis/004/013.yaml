  text: Kaini akamwambia Yahwe, “Hatia yangu ni kubwa mno nisiiweze kuibeba.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uovu wangu ni mkubwa mno nisiiweze kuubeba”; au, “Adhabu yangu ni kubwa mno nisiiweze kuistahimili.” Pia inaweza kueleweka, “Uovu wangu ni mkubwa mno kusamehewa.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, au adhabu yake; na kitenzi kinaweza kumaanisha “kubeba” au, katika miktadha mingine, “kusamehe.”
