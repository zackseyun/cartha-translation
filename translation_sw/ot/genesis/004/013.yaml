lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wenye waw-consecutive unaendeleza tukio linalofuata; “akamwambia” ni Kiswahili cha kawaida na hujumuisha kitendo pamoja na anayeelekezewa maneno.
- source_word: קַיִן
  choice: Kaini
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: עֲוֺנִי
  choice: uovu wangu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu inayotokana nao. “Uovu wangu” huakisi maana yake ya msingi hapa, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: גָּדוֹל ... מִנְּשֹׂא
  choice: ni mkubwa mno kuweza kuubeba
  rationale: Muundo wa kulinganisha unaonyesha jambo linalozidi uwezo wa kubebwa. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi kitenzi נָשָׂא kwa maana ya kubeba.
theological_decisions:
- issue: Utata wa עֲוֺנִי מִנְּשֹׂא
  choice: “Uovu wangu ni mkubwa mno kuweza kuubeba.”
  alternative: “Hatia yangu ni kubwa mno kuweza kuibeba”; “Adhabu yangu ni kubwa mno kuweza kuistahimili”; au “Uovu wangu ni mkubwa mno kusamehewa.”
  rationale: עָוֹן inaweza kutaja uovu, hatia, au adhabu yake, na נָשָׂא inaweza kumaanisha kubeba au, katika baadhi ya miktadha, kusamehe. Matini kuu inaweka maana ya moja kwa moja bila kufuta uwezekano mwingine, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa wasomaji wa kawaida. “Mkubwa” hupatana kisarufi na “uovu”; “kuubeba” huhifadhi sitiari ya Kiebrania.
