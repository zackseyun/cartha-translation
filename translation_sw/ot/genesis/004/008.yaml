base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: sw
  text: Kaini akamwambia Habili ndugu yake.[a] Walipokuwa shambani, Kaini akamwinukia Habili ndugu yake, akamuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andiko la Kiebrania la Kimasoreti linasema tu, “Kaini akamwambia Habili ndugu yake,” bila kutaja maneno aliyosema. Mashahidi wa kale, kama Septuajinti, Pentateuki ya Kisamaria, na Vulgata, wanaongeza, “Twende shambani.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל
  choice: akamwambia
  rationale: Kitenzi אמר kwa kawaida humaanisha ‘sema,’ na אֶל humwelekeza msemaji kwa mtu anayesemeshwa. ‘Akamwambia’ ni Kiswahili cha kawaida kinachowakilisha muundo huo, ingawa katika Andiko la Kimasoreti maneno yaliyosemwa hayapo.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Hili ndilo maana ya moja kwa moja ya neno lenye kiambishi cha umilikaji. Kurudia maneno haya mara mbili kunadumisha msisitizo wa simulizi kwamba aliyeuawa alikuwa ndugu yake Kaini.
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: Walipokuwa
  rationale: Muundo huu unaweka wakati wa tukio katika simulizi. ‘Walipokuwa’ ni wa asili katika Kiswahili na huhifadhi uhusiano wa wakati bila kuongeza maelezo yasiyokuwapo.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: שָׂדֶה inaweza kumaanisha shamba au eneo la wazi; ‘shambani’ ndiyo tafsiri ya kawaida na inafaa mazingira ya simulizi.
- source_word: וַיָּקָם ... אֶל
  choice: akamwinukia
  rationale: Huu ni usemi wa uhasama wenye maana ya kuinuka dhidi ya mtu. ‘Akamwinukia’ huhifadhi taswira ya Kiebrania kuliko tafsiri ya kufasiri zaidi kama ‘akamshambulia.’
- source_word: וַיַּהַרְגֵהוּ
  choice: akamuua
  rationale: Kitenzi הרג humaanisha kuua. ‘Akamuua’ ni cha moja kwa moja; ‘akamwua kikatili’ au ‘akamwua kwa mauaji’ kungeongeza tathmini isiyo ndani ya kitenzi chenyewe.
theological_decisions:
- issue: Kama yaingizwe maneno ya Kaini ambayo hayapo katika Andiko la Kimasoreti
  choice: Kufuata usomaji mfupi wa Andiko la Kimasoreti katika matini kuu na kuweka alama ya tanbihi baada ya ‘ndugu yake.’
  alternative: Kuingiza “Twende shambani” katika matini kuu kwa kufuata mashahidi wa kale kama Septuajinti, Pentateuki ya Kisamaria, na Vulgata.
  rationale: Hili hasa ni suala la uhakiki wa matini, si fundisho. Chanzo kilichotolewa cha WLC hakina maneno yaliyosemwa na Kaini, kwa hiyo matini kuu haiongezi maneno hayo. Hata hivyo, sentensi ya Kimasoreti ni ya ghafla, na ushahidi mpana wa kale unaweza kuhifadhi usomaji wa awali; kwa hiyo tofauti hiyo imeelezwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi vya mfululizo (‘akamwambia,’ ‘akamwinukia,’ ‘akamuua’) unafaa mtindo wa simulizi la Kiswahili. Usomaji mfupi wa WLC umehifadhiwa licha ya kuwa wa ghafla, huku tofauti ya mashahidi wa kale ikiwekwa wazi katika tanbihi.
