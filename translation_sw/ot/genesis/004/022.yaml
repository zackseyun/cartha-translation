base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: sw
  text: Zila naye akamzaa Tubal-kaini[a], aliyekuwa mfua wa kila chombo cha kukatia cha shaba na chuma[b]. Dada wa Tubal-kaini alikuwa Naama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfuaji au mnoaji wa kila fundi wa shaba na chuma.” Maneno ya Kiebrania baada ya “Tubal-kaini” ni magumu; wengine huyafasiri kuwa yanamtaja Tubal-kaini kuwa fundi wa shaba na chuma, badala ya mtengenezaji wa vyombo vya metali.
    reason: alternative_reading
  - marker: b
    text: “Shaba” inaweza pia kumaanisha “shaba nyekundu” (copper).
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: naye
  rationale: Katika Kiswahili, “naye” huonyesha kwa kawaida kwamba Zila pia alikuwa miongoni mwa wanawake waliozaa watoto wanaotajwa katika ukoo huu.
- source_word: יָלְדָה
  choice: akamzaa
  rationale: Hii ni tafsiri fupi na ya kawaida katika masimulizi ya ukoo, nayo inaendeleza mtiririko wa simulizi.
- source_word: תּוּבַל קַיִן
  choice: Tubal-kaini
  rationale: Jina la mtu limenukuliwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku muundo wake wa sehemu mbili ukihifadhiwa.
- source_word: לֹטֵשׁ
  choice: mfua
  rationale: Neno hili linaweza kumaanisha mtu anayefua, anayenoa, au anayegonga metali; “mfua” linafaa katika muktadha wa shaba na chuma bila kufafanua kupita kiasi mbinu hususa.
- source_word: כָּל חֹרֵשׁ
  choice: kila chombo cha kukatia
  rationale: Muundo wa Kiebrania ni mgumu. Katika muktadha wa kufua na kunoa metali, maneno haya yanaeleweka kwa uwezekano mkubwa kuwa vyombo vinavyotengenezwa, hasa vyombo vya kukatia; maana nyingine ya “kila fundi” imehifadhiwa katika tanbihi.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: “Shaba” ni neno la kawaida la Kiswahili katika orodha za metali za kale; neno la Kiebrania linaweza kurejelea shaba ya aloi au shaba nyekundu, hivyo uwezekano huo umetajwa katika tanbihi.
- source_word: בַרְזֶל
  choice: chuma
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali hii.
- source_word: אֲחוֹת
  choice: dada
  rationale: “Dada” ni neno la kawaida na linaloeleweka wazi kwa uhusiano huu wa kifamilia.
- source_word: נַעֲמָה
  choice: Naama
  rationale: Jina la mtu limenukuliwa kwa umbo la Kiswahili linalokaribia matamshi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo “naye akamzaa” unaendeleza sauti ya ukoo, na sentensi ya mwisho imetolewa kwa mpangilio wa kawaida wa Kiswahili.
