  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: sw
  text: Kwa maana Kaini atalipiziwa kisasi[a] mara saba, na Lameki mara sabini na saba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hulipiziwa kisasi”; kitenzi cha Kiebrania kinaweza kueleweka kama kauli ya kimethali au kama kisasi cha wakati ujao kilicho hakika.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “sabini na saba”; yaani, mara sabini na saba, si mara sabini mara saba.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa msingi wa majivuno ya Lameki katika mstari uliotangulia; ‘Kwa maana’ huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: שִׁבְעָתַיִם
  choice: mara saba
  rationale: Umbo hili linaonyesha kiwango cha kisasi cha saba; ‘mara saba’ ni wazi na la asili kwa Kiswahili.
- source_word: יֻקַּם
  choice: atalipiziwa kisasi
  rationale: Hili ni umbo la kutendwa la נקם, likimaanisha kwamba kisasi kitalipizwa kwa ajili ya Kaini. Wakati ujao unafaa kwa maana ya uhakika unaotazamiwa katika kauli hii ya kishairi.
- source_word: קָיִן
  choice: Kaini
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וְלֶמֶךְ
  choice: lakini Lameki
  rationale: Ingawa וְ kwa kawaida ni ‘na’, hapa ‘lakini’ huonyesha kwa asili tofauti inayoongezeka kati ya Kaini na Lameki bila kubadili uhusiano wa kishairi.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: mara sabini na saba
  rationale: Maneno hayo kihalisi ni ‘sabini na saba’; tafsiri hii huhifadhi idadi yake na ulinganifu na ‘mara saba’.
theological_decisions:
- issue: Jinsi ya kutafsiri idadi katika kauli ya kisasi cha Lameki
  choice: mara sabini na saba
  alternative: mara sabini mara saba
  rationale: Muundo wa Kiebrania שִׁבְעִים וְשִׁבְעָה kwa kawaida unamaanisha sabini na saba, si sabini mara saba. Hivyo tafsiri haileti katika Mwanzo maneno ya baadaye ya Mathayo 18:22.
- issue: Wakati wa kitenzi cha kulipiziwa kisasi
  choice: atalipiziwa kisasi
  alternative: analipiziwa kisasi
  rationale: Kitenzi cha Kiebrania kisichotimilika kinaweza kuonyesha tendo la wakati ujao lililo hakika au ukweli wa kimethali. Wakati ujao huwasilisha vizuri uhakika unaotazamiwa, huku tanbihi ikihifadhi uwezekano wa kauli ya sasa ya kimethali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kishairi umehifadhiwa, pamoja na ongezeko kutoka mara saba hadi mara sabini na saba.
