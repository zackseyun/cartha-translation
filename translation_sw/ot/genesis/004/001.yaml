id: GEN.4.1
reference: Genesis 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain, and said[b], “I have acquired a man from Yahweh.”
translation:
  language: sw
  text: Adamu akamjua[a] Hawa mkewe; naye akapata mimba, akamzaa Kaini[b], kisha akasema, “Nimepata mwanamume kutoka kwa Yahwe[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kumjua” hapa ni lugha ya staha ya Kiebrania inayomaanisha kuwa na uhusiano wa kingono.
    reason: idiom
  - marker: b
    text: Jina Kaini linasikika kama kitenzi cha Kiebrania kinachomaanisha “kupata” au “kujipatia” (qaniti).
    reason: wordplay
  - marker: c
    text: Kiebrania kwa tafsiri ya moja kwa moja kinaweza kuwa “Nimepata mwanamume pamoja na Yahwe.” Kirai hiki kinaweza pia kueleweka kuwa “kutoka kwa Yahwe” au “kwa msaada wa Yahwe”; uwezekano mwingine usio na nguvu sana ni “Nimepata mwanamume—Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאָדָם
  choice: Adamu
  rationale: Katika muktadha huu הָאָדָם inamtaja mtu maalumu, Adamu. Muundo wa masimulizi kwa kiambishi “aka-” unaendeleza uhusiano wa sentensi na yaliyotangulia.
- source_word: יָדַע
  choice: akamjua
  rationale: Kitenzi hiki maana yake ya msingi ni “kujua,” lakini hapa ni lugha ya staha kuhusu uhusiano wa kingono. Tafsiri imehifadhi tamathali ya Kiebrania, huku tanbihi ikiifafanua.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: Hawa mkewe
  rationale: Huhifadhi jina na ufafanuzi wa uhusiano kwa mpangilio wa Kiebrania unaoeleweka vizuri katika Kiswahili.
- source_word: וַתַּהַר
  choice: naye akapata mimba
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kwa kutungwa kwa mimba.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: akamzaa Kaini
  rationale: Hutoa kwa ufupi tendo la kumzaa mtoto na kuhifadhi jina la mtu kwa unukuzi wa kawaida wa Kiswahili.
- source_word: קָנִיתִי
  choice: Nimepata
  rationale: קנה hapa ina maana ya kupata au kujipatia. “Nimepata” ni ya asili katika Kiswahili na haileti wazo lisilokusudiwa la kununua au kuumba.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Neno la Kiebrania ni “mwanamume,” ingawa anayezungumziwa ni mtoto aliyezaliwa. Tafsiri haijabadilisha neno hilo kuwa “mwana” au “mtoto wa kiume.”
- source_word: אֶת יְהוָה
  choice: kutoka kwa Yahwe
  rationale: Kirai hiki kina utata. “Kutoka kwa Yahwe” kinaeleza kuwa Hawa anamkiri Yahwe kuwa chanzo cha kuzaliwa kwa Kaini, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limenukuliwa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya אֶת יְהוָה katika kauli ya Hawa
  choice: kutoka kwa Yahwe
  alternative: pamoja na Yahwe; kwa msaada wa Yahwe; nimepata mwanamume—Yahwe
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa njia zaidi ya moja. Maandishi makuu yanamwonyesha Hawa akikiri kuwa mtoto ametoka kwa Yahwe, lakini tanbihi inahifadhi utata wa kweli bila kumtambua mtoto kuwa Yahwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Nahau ya “akamjua” imehifadhiwa kwa sababu ya uzito wake wa kifasihi, na imefafanuliwa katika tanbihi; utata wa kirai cha mwisho pia umehifadhiwa wazi.
