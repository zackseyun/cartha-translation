base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: sw
  text: Lameki akawaambia wake zake, “Ada na Sila, sikieni sauti yangu; enyi wake wa Lameki, sikilizeni maneno yangu. Kwa maana nimemuua mtu kwa kunijeruhi, naam, kijana kwa kunipiga.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimemuua mtu kwa ajili ya jeraha langu, kijana kwa ajili ya chubuko langu.” Kiebrania kina nomino “jeraha” na “chubuko,” badala ya vitenzi “kunijeruhi” na “kunipiga.”
    reason: lexical_alternative
  - marker: b
    text: Wengine huyaelewa maneno ya Lameki kuwa tishio au majivuno ya jumla (“ningemuua mtu ...”), badala ya taarifa kwamba tayari amemuua mtu.
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: wake zake
  rationale: Muktadha unaonyesha wazi kuwa hawa ni wake wa Lameki; huu ndio usemi wa kawaida na sahihi katika Kiswahili.
- source_word: שְׁמַעַן קוֹלִי
  choice: sikieni sauti yangu
  rationale: Huhifadhi amri ya moja kwa moja na taswira halisi ya ‘sauti’ katika ushairi wa Kiebrania.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: yasikilizeni maneno yangu
  rationale: ‘Yasikilizeni’ huonyesha usikivu makini; wingi ‘maneno’ ni wa asili zaidi katika Kiswahili kuliko ‘neno langu’ katika muktadha huu.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha msingi au maudhui ya kauli ya Lameki bila kufafanua kupita kiasi uhusiano wake.
- source_word: אִישׁ הָרַגְתִּי
  choice: nimemuua mtu
  rationale: Kauli timilifu ya Kiebrania inaeleweka moja kwa moja kama taarifa ya tendo lililotukia; ‘mtu’ hapa ni ya asili kuliko ‘mwanamume’ bila kupoteza ulinganifu.
- source_word: לְפִצְעִי
  choice: kwa kunijeruhi
  rationale: Huwasilisha kwa Kiswahili uhusiano unaowezekana wa sababu au kisasi uliomo katika ל pamoja na nomino ‘jeraha,’ huku tanbihi ikihifadhi muundo halisi zaidi.
- source_word: יֶלֶד
  choice: kijana
  rationale: Katika ulinganifu na אִישׁ, neno hili linaashiria mtu wa umri mdogo, si lazima mtoto mdogo.
- source_word: לְחַבֻּרָתִי
  choice: kwa kunipiga
  rationale: Hutoa maana ya tukio lililosababisha jeraha au chubuko kwa lugha ya kawaida, huku tofauti ya kileksia ikifafanuliwa katika tanbihi.
theological_decisions:
- issue: Je, Lameki anaripoti mauaji yaliyotokea au anatoa tishio la jumla?
  choice: 'Kauli imetafsiriwa kama taarifa ya tendo lililotokea: ‘nimemuua.’'
  alternative: ‘Ningemuua mtu...’ au ‘nitamuua mtu...,’ ikieleweka kama tishio au majivuno ya jumla.
  rationale: Qatal ya הָרַגְתִּי kwa kawaida zaidi huripoti tendo lililotimia, lakini uwezekano wa maana ya kimasharti au ya kujigamba umehifadhiwa katika tanbihi.
- issue: Ikiwa mauaji yalikuwa kisasi au kujilinda
  choice: ‘Kwa kunijeruhi ... kwa kunipiga’ inaonyesha sababu au kichocheo bila kuyaita wazi kujilinda.
  alternative: Kutafsiri kwa namna inayodokeza moja kwa moja kwamba Lameki alijilinda.
  rationale: Kiebrania hakiamui wazi uhalali wa tendo; tafsiri haiongezi hukumu ya kimaadili au dai la kujilinda.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi na urudiaji wa mwito kwa wake wa Lameki umehifadhiwa. ‘Naam’ huimarisha mstari wa pili bila kuufanya kuwa tukio tofauti.
