translation:
  language: sw
  text: Akasema, “Umefanya nini? Sauti ya damu[a] ya ndugu yako inanililia kutoka ardhini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umbo la wingi, “damu”; umbo hili hutumiwa mara nyingi katika miktadha ya umwagaji damu. Kwa kawaida Kiswahili hutumia “damu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akasema
  rationale: Kauli ya wayyiqtol inaendeleza masimulizi; “Kisha akasema” ni ya kawaida na ya asili katika Kiswahili bila kuongeza ufafanuzi wa wakati.
- source_word: מֶה עָשִׂיתָ
  choice: Umefanya nini?
  rationale: Muundo huu wa Kiswahili unaonyesha tendo lililokamilika lenye uzito wa sasa na kuhifadhi swali la moja kwa moja la Mungu.
- source_word: קוֹל
  choice: Sauti
  rationale: “Sauti” huhifadhi taswira ya damu iliyopewa sifa ya kulia, badala ya kuifanya kuwa mlio usio na nafsi.
- source_word: דְּמֵי
  choice: damu
  rationale: Ingawa Kiebrania kina umbo la wingi, kwa kawaida Kiswahili hutumia nomino isiyohesabika “damu” katika muktadha wa umwagaji damu.
- source_word: אָחִיךָ
  choice: ya ndugu yako
  rationale: Huu ni uwasilishaji wa kawaida wa uhusiano wa umilikaji katika Kiswahili.
- source_word: צֹעֲקִים
  choice: inanililia
  rationale: Kitenzi cha umoja kinakubaliana kiasili na “damu” katika Kiswahili; “inanililia” huhifadhi tendo linaloendelea na mwelekeo wa kilio kwa Mungu.
- source_word: אֵלַי
  choice: -ni- katika “inanililia”
  rationale: Kiambishi yambwa “-ni-” kinaonyesha kwa kawaida na kwa uwazi kwamba kilio kinamwelekea Mungu.
- source_word: מִן הָאֲדָמָה
  choice: kutoka ardhini
  rationale: “Ardhi” katika matumizi haya humaanisha udongo/ardhi ambako damu ilimwagika na huhifadhi mwangwi wa אֲדָמָה katika simulizi la Kaini.
theological_decisions:
- issue: Damu ya Abeli kupewa sifa ya kulia
  choice: Kuhifadhi lugha ya kitamathali kwamba damu yenyewe inamlilia Mungu.
  alternative: Kutafsiri kwa dhana pana zaidi kuwa hatia ya umwagaji damu inadai haki.
  rationale: Kiebrania kinatoa taswira hai ya damu inayolia; kuihifadhi hudumisha nguvu ya kimaadili na kiteolojia bila kuibana katika ufafanuzi mmoja wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida, huku taswira ya damu inayolia na uhusiano wa damu na ardhi vikihifadhiwa.
