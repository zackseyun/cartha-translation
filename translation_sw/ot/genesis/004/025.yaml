  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: sw
  text: Adamu akamjua tena mke wake, naye akazaa mwana wa kiume, akamwita Sethi[a], akisema, “Mungu ameniwekea uzao mwingine badala ya Abeli, kwa sababu Kaini alimuua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, jina “Sethi” lasikika kama kitenzi kinachomaanisha “ameweka” au “ameniwekea”; hapa kuna mchezo wa maneno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: akamjua
  rationale: Kitenzi יָדַע kinapotumiwa kuhusu mke ni sitiari ya kawaida ya Kiebrania kwa mahusiano ya ndoa. “Akamjua” kinahifadhi sitiari na mtindo wa simulizi bila kuufanya wazi zaidi kuliko chanzo.
- source_word: אָדָם
  choice: Adamu
  rationale: Hapa neno hilo ni jina la mtu, si rejeo la jumla kwa mwanadamu; limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: עוֹד
  choice: tena
  rationale: Huonyesha kurudiwa kwa tendo katika simulizi; “tena” ni sawa ya asili na fupi katika Kiswahili.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana wa kiume
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ילד pamoja na בֵּן, huku ikibainisha kuwa mtoto alikuwa wa kiume.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: kumpa jina
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza fomula ya Kiebrania ya “kuita jina lake,” bila kupoteza tendo la kumtaja mtoto.
- source_word: שֵׁת
  choice: Sethi
  rationale: Ni umbo la jina hili lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: שָׁת
  choice: ameniwekea
  rationale: Kitenzi שִׁית humaanisha kuweka au kupanga. “Ameniwekea” kinadumisha maana ya msingi na kwa kadiri inavyowezekana mwangwi wa kifonetiki na jina Sethi.
- source_word: זֶרַע
  choice: uzao
  rationale: “Uzao” huwasilisha maana ya prokreasheni na uwezekano wa mwendelezo wa kizazi wa זֶרַע vizuri kuliko “mtoto,” ambalo lingefinya maana.
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika muktadha huu neno linaonyesha nafasi ya mbadala, si mahali chini ya kitu.
- source_word: הֶבֶל
  choice: Abeli
  rationale: Ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: הֲרָגוֹ
  choice: alimuua
  rationale: הרג ni kitenzi cha kawaida cha kuua. “Alimuua” ni sahihi bila kuongeza ubainifu wa kisheria uliomo katika “alimwua kwa makusudi” au istilahi nyingine.
theological_decisions:
- issue: Maelezo ya Hawa kuhusu jina la Sethi
  choice: Mungu ameniwekea uzao mwingine
  alternative: Mungu amenipa mtoto mwingine
  rationale: “Ameniwekea” hudumisha maana ya kitenzi cha Kiebrania na uhusiano wake wa kimchezo wa sauti na jina Sethi; “uzao” huhifadhi upana wa זֶרַע na wazo kwamba Mungu ndiye mtoaji.
- issue: Iwapo sitiari ya mahusiano ya ndoa ifafanuliwe wazi
  choice: Adamu akamjua tena mke wake
  alternative: Adamu akalala tena na mke wake
  rationale: Chanzo kinatumia sitiari ya kawaida. Kuihifadhi kunatunza umbile la kifasihi na kuepuka kufafanua zaidi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa vitenzi mfululizo umetumiwa kwa mtiririko wa simulizi. Kiashiria cha tanbihi [a] kimewekwa baada ya kauli nzima inayohusika na mchezo wa maneno.
