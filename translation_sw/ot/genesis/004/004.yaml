  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: sw
  text: Abeli naye akaleta baadhi ya wazaliwa wa kwanza wa kundi lake na sehemu zao za mafuta[a]. Yahwe akamtazama Abeli na sadaka yake kwa kibali[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “na kutoka katika mafuta yao”; huenda hii inamaanisha sehemu bora zenye mafuta za wanyama waliotolewa.
    reason: cultural_note
  - marker: b
    text: Au, “Yahwe alimwangalia Abeli na sadaka yake kwa kibali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶבֶל
  choice: Abeli naye
  rationale: Kiunganishi cha simulizi pamoja na גַם הוּא kinaendeleza mfuatano na kusisitiza kwamba Abeli pia alileta sadaka.
- source_word: הֵבִיא
  choice: akaleta
  rationale: Hifili ya בוא hapa ina maana ya kuleta, hasa katika muktadha wa sadaka.
- source_word: גַם הוּא
  choice: naye
  rationale: Neno hili linaonyesha kuwa Abeli pia, kama Kaini, alileta sadaka; 'naye' ni ya kawaida na yenye msisitizo unaofaa katika Kiswahili.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: baadhi ya wazaliwa wa kwanza wa kundi lake
  rationale: Muundo wa מן ni wa sehemu; hauonyeshi kwamba alitoa kila mzaliwa wa kwanza. 'Baadhi ya' huwasilisha maana hiyo wazi.
- source_word: וּמֵחֶלְבֵהֶן
  choice: na sehemu zao za mafuta
  rationale: חֵלֶב hapa inahusu mafuta halisi, yaelekeayo kuwa sehemu bora zenye mafuta za wanyama waliotolewa; tafsiri inadumisha picha ya dhabihu bila kuibadili kuwa 'sehemu bora' pekee.
- source_word: וַיִּשַׁע
  choice: akamtazama ... kwa kibali
  rationale: Kitenzi kina maana ya kutazama au kuelekea kwa mtu kwa upendeleo katika muktadha huu. Kiswahili hiki kinaonyesha mwitikio chanya bila kueleza ulidhihirishwaje.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika tetragramatoni linatoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: Abeli na sadaka yake
  rationale: Marudio ya אֶל yanamweka Abeli na sadaka yake pamoja kama walengwa wa mtazamo wa Yahwe; muundo huu ni wa kawaida katika Kiswahili.
- source_word: מִנְחָתוֹ
  choice: sadaka yake
  rationale: מִנְחָה ni zawadi au toleo linalotolewa kwa Mungu; 'sadaka' linafaa kwa muktadha wa ibada na linaeleweka kwa wasomaji wa kawaida.
theological_decisions:
- issue: Maana ya mwitikio wa Mungu katika וַיִּשַׁע
  choice: Yahwe alimtazama Abeli na sadaka yake kwa kibali, bila kutaja namna kibali hicho kilivyoonekana.
  alternative: Yahwe alimkubali Abeli na sadaka yake.
  rationale: Kitenzi kinaashiria mtazamo chanya, lakini hakisemi njia iliyotumiwa kuonyesha kukubaliwa huko. Tafsiri huepuka kuongeza utaratibu au ishara isiyotajwa katika maandishi.
- issue: Uhusiano kati ya Abeli na sadaka yake
  choice: Mtazamo wa kibali unamhusu kwanza Abeli na pia sadaka yake.
  alternative: Kibali kilihusu sadaka peke yake.
  rationale: Maandishi yanarudia אֶל mbele ya Abeli na sadaka yake, hivyo yanawataja wote wawili wazi bila kueleza sababu ya kibali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kundi' limetumiwa kwa צֹאן bila kulazimisha kama ni kondoo pekee au mbuzi pekee. Muundo wa sentensi umehifadhi mfuatano wa simulizi na koma ya mwisho kwa kuwa aya inaendelea katika mstari unaofuata.
