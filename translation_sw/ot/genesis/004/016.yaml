base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: sw
  text: Kisha Kaini akaondoka kutoka mbele za Yahweh, akakaa katika nchi ya Nodi[a], mashariki ya Edeni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Nodi linafanana kwa sauti na neno la Kiebrania linalohusiana na “kutangatanga,” likirejelea hukumu ya Kaini iliyotajwa mapema katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא kinaeleza mwendo wa kutoka. “Akatoka” kinahifadhi maana hiyo ya moja kwa moja bila kuongeza namna au sababu ya kuondoka.
- source_word: מִלִּפְנֵי
  choice: mbele za
  rationale: Kirai hiki kwa halisi ni “kutoka mbele ya/uso wa.” Katika muundo “akatoka mbele za Yahweh,” Kiswahili kinahifadhi maana ya mahali na uhusiano bila kufafanua zaidi kuwa Kaini aliweza kuondoka kabisa katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: ישב inaweza kumaanisha kuketi, kukaa, au kufanya makao. “Akakaa” ni la kawaida katika Kiswahili na katika muktadha huu linaeleweka kuwa alianza kuishi huko huku likihifadhi upana wa kitenzi cha Kiebrania.
- source_word: בְּאֶרֶץ נוֹד
  choice: katika nchi ya Nodi
  rationale: נוֹד linatumika kama jina la mahali, kwa hiyo limetoholewa kuwa “Nodi” badala ya kutafsiriwa. Mchezo wa sauti unaohusiana na kutangatanga umewekwa katika tanbihi.
- source_word: קִדְמַת עֵדֶן
  choice: mashariki ya Edeni
  rationale: Kirai hiki kinaonyesha mahali upande wa mashariki kuhusiana na Edeni. “Mashariki ya Edeni” ni kifupi, cha kawaida, na sahihi.
- source_word: עֵדֶן
  choice: Edeni
  rationale: Jina la mahali limetoholewa kwa umbo lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kueleza kuondoka kwa Kaini kuhusiana na Mungu
  choice: Kaini akatoka mbele za Yahweh
  alternative: Kaini akaondoka katika uwepo wa Yahweh
  rationale: “Mbele za Yahweh” kinakaribia nahau ya Kiebrania na kuhifadhi mvutano wa simulizi kuhusu kutengwa na Mungu, bila kudai kwamba Kaini aliweza kutoka kabisa katika uwepo wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa masimulizi “akatoka … akakaa” ni wa kawaida, na “mbele za” huhifadhi nahau ya chanzo bila kuwa mzito kupita kiasi.
