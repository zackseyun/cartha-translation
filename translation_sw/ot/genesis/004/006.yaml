  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Kaini, “Kwa nini una hasira, na kwa nini uso wako umeshuka?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nini uso wako umeinama?” Kiebrania kinasema kihalisi, “kwa nini uso wako umeanguka?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw ya usimulizi inaendeleza mfululizo wa matukio; “Ndipo” pamoja na kitenzi cha mfululizo “akamwambia” ni mtiririko wa kawaida wa simulizi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limeandikwa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: קָיִן
  choice: Kaini
  rationale: Hii ndiyo namna ya kawaida ya jina hili katika Kiswahili.
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja kuhusu sababu, na “Kwa nini” ni kauli ya kawaida na wazi katika Kiswahili.
- source_word: חָרָה לָךְ
  choice: una hasira
  rationale: Nahau ya Kiebrania inahusisha kuwaka, lakini hapa maana yake ni kukasirika; “una hasira” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: נָפְלוּ פָנֶיךָ
  choice: uso wako umekunjamana
  rationale: Nahau hii ina maana kwamba sura ya Kaini imeonyesha huzuni au kutoridhika. “Uso wako umekunjamana” ni usemi wa kawaida wa Kiswahili unaowasilisha hali hiyo, huku maana halisi ya sitiari ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; “Yahweh” linahifadhi jina hilo kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa swali ni wa kawaida; tanbihi huhifadhi sitiari halisi ya Kiebrania.
