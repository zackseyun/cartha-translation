review_pass:
  verdict: revise
  source_fidelity: 'The first question is accurately rendered by “Kwa nini una hasira?” The draft’s “uso wako umekunjamana” can suggest a wrinkled or frowning face, but it does not directly represent the Hebrew idiom “your face has fallen,” whose sense is a lowered/downcast countenance. The footnote also contains a semantic error: “umekunjua uso” means to unfold/open the face, not to be downcast.'
  naturalness: “Kwa nini uso wako umeshuka?” is natural, clear Standard East African Swahili and preserves the image of a face lowered or fallen. It is preferable to “umekunjamana,” which focuses on wrinkles/frowning.
  terminology: “Yahweh” appropriately preserves יהוה, and “Kaini” is the standard Swahili form of Cain. “Hasira” is an appropriate modern rendering of the anger idiom.
  issues:
  - severity: medium
    issue: The main rendering “uso wako umekunjamana” is not the closest natural equivalent of “your face has fallen.”
    rationale: It can describe a furrowed or wrinkled face and may imply anger, whereas the Hebrew image primarily denotes a fallen/lowered, downcast countenance.
  - severity: high
    issue: The footnote alternative “umekunjua uso kwa huzuni” is semantically unsuitable.
    rationale: Kukunja uso means to frown, but kukunjua uso means to unfold/open the face; it reverses the intended expression and does not communicate downcastness.
