  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: sw
  text: Ukitenda mema, je, hutakubaliwa?[a] Lakini usipotenda mema, dhambi imejinyata mlangoni; tamaa yake iko kwako,[b][c] lakini ni lazima uitawale.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kuinuliwa.” Huenda maana yake ni kwamba uso wa Kaini ungeinuliwa, au kwamba angekubaliwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya dhambi imejilaza mlangoni,” ingawa taswira ya karibu inaelekea zaidi kuonyesha dhambi kama mnyama aliyejinyata.
    reason: alternative_reading
  - marker: c
    text: Au, “shauku yake iko kwako” au “msukumo wake unaelekezwa kwako.” Linganisha maneno yanayofanana katika Mwanzo 3:16.
    reason: cross_reference
  - marker: d
    text: Au, “utaitawala,” au “unaweza kuitawala.” Kiebrania kinaweza kueleweka kama himizo, utabiri, au uwezekano.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: kutenda mema
  rationale: Hifili ya יטב hapa inaelekea kumaanisha kutenda yaliyo mema au sahihi, si kujisikia vizuri tu. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili sanifu.
- source_word: שְׂאֵת
  choice: kukubaliwa
  rationale: Neno hili kihalisi linahusiana na kuinua, lakini katika muktadha linaweza kueleza uso wa Kaini kuinuliwa au yeye kukubaliwa. Tafsiri ya 'kukubaliwa' huwasilisha maana kuu kwa uwazi, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: לַפֶּתַח
  choice: mlangoni
  rationale: Hii ni kauli ya mahali yenye maana ya kwenye mlango au ingilio. 'Mlangoni' ni ya asili katika Kiswahili na inadumisha taswira ya tishio lililo kwenye kizingiti.
- source_word: חַטָּאת
  choice: dhambi
  rationale: Ingawa חַטָּאת pia linaweza kumaanisha sadaka ya dhambi, kitenzi 'kuvizia/kulala kwa kujikunyata' na muktadha vinaunga mkono zaidi dhambi iliyohuishwa kama mnyama hatari.
- source_word: רֹבֵץ
  choice: inavizia
  rationale: Kishiriki hiki hutoa taswira ya mnyama aliyelala kwa kujikunyata au anayengoja kushambulia. 'Inavizia' ni ya asili na hudumisha tishio la karibu, ingawa haisemi moja kwa moja mkao wa kujikunyata.
- source_word: תְּשׁוּקָתוֹ
  choice: inakulenga kwa tamaa
  rationale: Nomino hii huonyesha tamaa, shauku, au msukumo unaomwelekea mtu. Katika sentensi kuu, 'inakulenga kwa tamaa' huepuka Kiswahili kisicho cha kawaida cha 'tamaa yake ni kwako' huku kikihifadhi mwelekeo wa hamu hiyo.
- source_word: תִּמְשָׁל בּוֹ
  choice: ni lazima uitawale
  rationale: Kauli isiyotimilika ya Kiebrania inaweza kueleweka kama himizo, utabiri, au uwezekano. Katika onyo hili, 'ni lazima uitawale' huwasilisha himizo bila kudai kwamba ushindi umeahidiwa au kwamba uwezo fulani wa kiteolojia umefafanuliwa.
theological_decisions:
- issue: Iwapo kauli ya mwisho inamwamuru Kaini aitawale dhambi, inatabiri kwamba ataitawala, au inasema anaweza kuitawala
  choice: ni lazima uitawale
  alternative: utaitawala; au unaweza kuitawala
  rationale: Kauli ya Kiebrania inaruhusu vivuli hivi tofauti. Muktadha wa onyo na mawaidha unaunga mkono himizo katika matini kuu, lakini tanbihi inadumisha uwezekano wa utabiri au uwezo bila kutatua mvutano wa kiteolojia.
- issue: Iwapo חַטָּאת hapa ni dhambi iliyohuishwa au sadaka ya dhambi
  choice: dhambi inavizia mlangoni
  alternative: sadaka ya dhambi imelala mlangoni
  rationale: Taswira ya kitu kinachovizia na kumtamani Kaini inaelekea zaidi kuifanya dhambi ionekane kama mnyama hatari. Hata hivyo, maana ya kileksika ya 'sadaka ya dhambi' inawezekana na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masharti umehifadhiwa kwa ufupi. 'Inavizia mlangoni' hudumisha taswira hai kwa wasomaji wa kawaida; tanbihi zinahifadhi maana halisi na utata wa Kiebrania.
