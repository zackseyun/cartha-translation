lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: Na jina la ndugu yake lilikuwa
  rationale: Inafuata muundo wa Kiebrania kwa Kiswahili cha kawaida na kuendeleza simulizi kutoka mstari uliotangulia.
- source_word: יוּבָל
  choice: Yubali
  rationale: Jina limetoholewa kulingana na desturi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: הוּא הָיָה
  choice: Yeye ndiye aliyekuwa
  rationale: Inahifadhi msisitizo wa kiwakilishi cha Kiebrania bila kudai maana ya ‘alikuwa baadaye’.
- source_word: אֲבִי
  choice: baba
  rationale: Inahifadhi nahau ya Kiebrania; katika muktadha huu inaweza kumaanisha mwanzilishi au mtangulizi wa kundi fulani.
- source_word: כָּל תֹּפֵשׂ
  choice: wote wanaopiga
  rationale: Ingawa kitenzi kwa maana ya msingi ni kushika au kumiliki, kinapotumiwa pamoja na ala za muziki humaanisha kuzipiga.
- source_word: כִּנּוֹר
  choice: kinubi
  rationale: ‘Kinubi’ ni jina la Kiswahili linalotambulika kwa ala ya nyuzi inayolingana kwa karibu na lyre ya kale.
- source_word: עוּגָב
  choice: filimbi
  rationale: Neno hilo linataja ala ya upepo isiyojulikana kwa uhakika; ‘filimbi’ ni tafsiri pana na ya kawaida isiyobainisha kupita ushahidi.
