  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: sw
  text: Tazama[a], leo umenifukuza kutoka kwenye uso wa ardhi, nami nitafichwa mbali na uso wako. Nitakuwa mtangatanga na mkimbizi duniani[b], na yeyote atakayenipata ataniua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nitajificha mbali na uso wako,” au “nitafichwa mbali na uwepo wako.” Kiebrania kinasema kihalisi “mbali na uso wako.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika nchi.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia” au “nchi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Chembe ya usemi inayovuta fikira na kutia mkazo; “Tazama” ni ya sasa, yenye hadhi, na inahifadhi msisitizo wa Kiebrania.
- source_word: גֵּרַשְׁתָּ
  choice: umenifukuza
  rationale: Kitenzi גרשׁ humaanisha kumfukuza au kumwondoa mtu kwa nguvu; “umenifukuza” ni wazi na cha kawaida.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: kutoka kwenye uso wa ardhi
  rationale: Inahifadhi taswira halisi ya “uso wa ardhi” na mwangwi wa ardhi iliyolaaniwa katika muktadha wa Kaini.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: nami nitafichwa mbali na uso wako
  rationale: Nifali ya סתר inaruhusu maana ya kutendwa au kujirejelea, “nitafichwa”; “uso wako” huhifadhi nahau halisi na uzito wa kutengwa na Mungu.
- source_word: נָע וָנָד
  choice: mtu wa kutangatanga na kukimbia
  rationale: Maneno haya mawili yanaeleza maisha yasiyo na makao thabiti pamoja na hali ya kuwa mkimbizi; tafsiri inadumisha uwili wake bila kuyaunganisha kuwa wazo moja.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: אֶרֶץ inaweza kumaanisha dunia au nchi; “duniani” inafaa kwa upeo mpana wa simulizi, huku “katika nchi” ikibaki kuwa uwezekano halali.
- source_word: כָל מֹצְאִי
  choice: yeyote atakayenipata
  rationale: Muundo wa כָל pamoja na kirai cha kitenzi una maana ya jumla isiyobainisha mtu fulani; usemi huu ni wa kawaida katika Kiswahili.
- source_word: יַהַרְגֵנִי
  choice: ataniua
  rationale: הרג ni kitenzi cha kawaida cha kuua; “ataniua” ni tafsiri ya moja kwa moja na ya sasa.
theological_decisions:
- issue: Nahau ya kuwapo kwa Mungu katika וּמִפָּנֶיךָ אֶסָּתֵר
  choice: nami nitafichwa mbali na uso wako
  alternative: nami nitajificha mbali na uwepo wako / nitafichwa mbali na uwepo wako
  rationale: Tafsiri kuu inadumisha “uso wako,” nahau halisi ya Kiebrania, na hivyo kuhifadhi uzito wa kimahusiano wa kutengwa na Mungu bila kuamua kimya kimya kama kauli ni ya kutendwa au ya kujirejelea. Maana ya “uwepo wako” imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira za Kiebrania “uso wa ardhi” na “uso wako” zimehifadhiwa; tanbihi zinaonyesha maana mbadala bila kuondoa utata halisi.
