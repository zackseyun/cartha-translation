  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: sw
  text: Lakini hakumwangalia Kaini kwa kibali, wala sadaka yake[a]. Kwa hiyo Kaini akakasirika sana, na uso wake ukakunjamana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakumkubali Kaini wala sadaka yake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “uso wake ukaanguka,” nahau inayoonyesha kwamba alionekana mwenye huzuni au aliyenuna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתוֹ
  choice: Kaini wala sadaka yake
  rationale: Kurudiwa kwa kihusishi kunaonyesha kwamba Kaini mwenyewe pamoja na sadaka yake ndio waliolengwa na kitendo cha kutowatazama kwa kibali. “Sadaka” ni neno la kawaida na linalofaa katika muktadha huu wa kumtolea Mungu.
- source_word: לֹא שָׁעָה
  choice: hakumwangalia kwa kibali
  rationale: Kitenzi שׁעה hapa kina maana ya kutazama au kuangalia kwa kukubali na kuonyesha fadhili. Tafsiri hii inadumisha picha ya kutazama na haiongezi sababu ya Mungu kutokubali.
- source_word: וַיִּחַר ... מְאֹד
  choice: akakasirika sana
  rationale: Nahau ya Kiebrania ina wazo la hasira kuwaka. Kiswahili cha sasa huwasilisha maana yake kwa kawaida na wazi kwa kusema “akakasirika sana.”
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: uso wake ukakunjamana
  rationale: Hii ni nahau inayoonyesha huzuni, kukata tamaa au sura ya kununa. “Uso wake ukakunjamana” ni Kiswahili cha kawaida kinachoonyesha mabadiliko yanayoonekana usoni bila kulazimisha hisia moja tu.
theological_decisions:
- issue: Sababu na hali ya mwitikio wa Mungu kwa Kaini na sadaka yake
  choice: Kusema kwamba hakumwangalia Kaini wala sadaka yake kwa kibali, bila kueleza sababu
  alternative: “Hakumkubali Kaini wala sadaka yake”
  rationale: Aya yenyewe haielezi kwa nini kibali kilizuiwa. Tafsiri inapaswa kuhifadhi ukimya huo na kuepuka kuingiza maelezo ya kimafundisho yasiyosemwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “kwa kibali” unahifadhi wazo la kutazama kwa fadhili; “uso wake ukakunjamana” huwasilisha nahau kwa lugha ya kawaida huku tanbihi ikihifadhi picha halisi ya Kiebrania.
