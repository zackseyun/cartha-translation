  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Kaini, “Abeli ndugu yako yuko wapi?” Naye akasema, “Sijui.[a] Je, mimi ni mlinzi wa ndugu yangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikujua.” Hali timilifu ya kitenzi cha Kiebrania inaweza kutafsiriwa kama kukanusha jambo la wakati uliopita, ingawa katika muktadha huu inaeleweka kwa kawaida kama dai la sasa la kutokuwa na habari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya matamshi inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia / Naye akasema
  rationale: Muundo huu unaendeleza mtiririko wa simulizi wa Kiebrania huku ukisomeka kwa kawaida katika Kiswahili. Kitenzi אמר kimehifadhiwa kwa maana ya msingi ya kusema, si kufafanuliwa kuwa kuuliza.
- source_word: אֵי
  choice: yuko wapi?
  rationale: Ni kiulizi cha mahali; kwa mtu, Kiswahili cha kawaida hutumia “yuko wapi?”
- source_word: הֶבֶל
  choice: Abeli
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Neno la Kiebrania linamaanisha ndugu wa kiume katika muktadha huu; Kiswahili “ndugu yako” ni usemi wa kawaida, na utambulisho wa Abeli tayari unaondoa utata wa jinsia.
- source_word: לֹא יָדַעְתִּי
  choice: Sijui
  rationale: Ingawa kitenzi kiko katika hali timilifu ya Kiebrania na kinaweza kutafsiriwa “Sikujua,” katika mazungumzo haya kauli ya Kaini hufanya kazi kiasili kama dai la sasa la kutokuwa na habari.
- source_word: הֲשֹׁמֵר
  choice: mlinzi
  rationale: Kitenzi שמר huhusu kulinda, kutunza, au kuangalia. “Mlinzi” linaeleza wajibu wa uangalizi bila kuongeza ufafanuzi usiomo katika matini.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kimehifadhiwa wazi.
- source_word: אָנֹכִי
  choice: mimi
  rationale: Kiwakilishi huru kina mkazo; “Je, mimi ni...” huleta mkazo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ya Kiebrania inatumia moja kwa moja jina la herufi nne la Mungu. “Yahwe” huhifadhi jina binafsi kwa umbo linalosomeka kwa kawaida katika Kiswahili, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akamwambia” huhifadhi maana ya msingi ya אמר, huku “yuko wapi?” na “Sijui” zikitoa mazungumzo ya kawaida yasiyo ya kizamani. Alama ya tanbihi imewekwa baada ya kauli inayohusika moja kwa moja.
