  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: sw
  text: Henoko akamzaa Iradi, naye Iradi akamzaa Mehuyaeli,[a] na Mehuyaeli akamzaa Methushaeli, na Methushaeli akamzaa Lameki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina tahajia mbili za jina hili katika mstari huu: Mehuyaeli na Mehiyaeli.'
