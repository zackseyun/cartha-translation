lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ
  choice: Henoko akazaliwa mwana aliyeitwa Iradi
  rationale: Nifali ya ילד ni ya kutendwa, na לַחֲנוֹךְ humtaja mzazi ambaye mtoto alizaliwa kwake. Kiswahili cha kawaida huhitaji kuongeza ‘mwana aliyeitwa’ ili kuepuka maana isiyo sahihi kwamba Henoko ndiye aliyezaliwa.
- source_word: עִירָד
  choice: Iradi
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa muundo unaotamkika kwa urahisi katika Kiswahili.
- source_word: יָלַד
  choice: akamzaa
  rationale: Katika mfululizo huu wa ukoo, Qal ya ילד humaanisha kumzaa au kuwa baba wa mtu; ‘akamzaa’ ni fupi, ya asili, na hudumisha mfuatano wa nasaba.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: Mehuyaeli
  rationale: Maumbo mawili ya tahajia ya jina lilelile yamesawazishwa katika matini kuu kwa usomaji rahisi, huku tofauti hiyo ikihifadhiwa katika tanbihi.
- source_word: מְתוּשָׁאֵל
  choice: Methushaeli
  rationale: Jina limetoholewa kutoka umbo la Kiebrania huku likipewa irabu ya mwisho inayofaa matamshi ya Kiswahili.
- source_word: לָמֶךְ
  choice: Lameki
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa umbo la kawaida na linalotamkika katika Kiswahili.
