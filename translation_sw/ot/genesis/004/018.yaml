translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa ‘akazaliwa mwana aliyeitwa’ unahifadhi kauli ya kutendwa ya Kiebrania bila kuleta utata wa kisarufi katika Kiswahili; vifungu vinavyofuata vinatumia ‘akamzaa’ kwa mfuatano wa asili wa nasaba.
