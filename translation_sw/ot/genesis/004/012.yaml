  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: sw
  text: Utakapolima ardhi[a], haitakupa tena nguvu zake[b]. Utakuwa mwenye kutangatanga na kuhamahama duniani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana ukilima ardhi,” au, “Ikiwa utalima ardhi.” Kiunganishi cha Kiebrania kinaweza kueleweka kuwa cha sababu, wakati, au sharti.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “haitaendelea kukupa nguvu zake”; yaani, uwezo wake wa kuzaa mazao.
    reason: lexical_alternative
  - marker: c
    text: Au, “Utakuwa mwenye kutangatanga na kuhamahama katika nchi.” Maneno mawili ya Kiebrania yana maana zinazokaribiana na kwa pamoja yanasisitiza hali ya Kaini ya kutotulia na kuhamahama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Utakapolima
  rationale: Kiunganishi hiki kinaeleweka hapa kwa maana ya wakati au hali ya sharti. Muundo wa ‘utakapo-’ ni wa asili katika Kiswahili na unaacha wazi kwamba matokeo hayo yatatokea Kaini anapoilima ardhi.
- source_word: תַעֲבֹד אֶת הָאֲדָמָה
  choice: utakapolima ardhi
  rationale: Kitenzi עבד hapa humaanisha kufanya kazi ya kilimo, na אֲדָמָה ni ardhi inayolimwa. ‘Kulima ardhi’ ni usemi wa kawaida na huhifadhi uhusiano wake na kazi ya Kaini.
- source_word: לֹא תֹסֵף תֵּת
  choice: haitakupa tena
  rationale: Muundo יסף pamoja na kitenzi-jina unaonyesha kutokufanya jambo tena au kutokuendelea kulifanya. ‘Haitakupa tena’ ni wa kawaida na karibu na muundo wa Kiebrania.
- source_word: כֹּחָהּ
  choice: nguvu zake
  rationale: Maana ya moja kwa moja ni ‘nguvu zake’; katika muktadha ni uwezo wa ardhi wa kuzaa mazao. Taswira hiyo imehifadhiwa badala ya kufasiriwa tu kuwa ‘mazao.’
- source_word: נָע וָנָד
  choice: mtu wa kutangatanga na kuhangaika
  rationale: Maneno haya mawili yana maana zinazokaribiana na kwa pamoja yanasisitiza hali ya kutotulia na kuhamahama. ‘Kutangatanga na kuhangaika’ ni Kiswahili cha sasa kinachoonyesha mwendo usio na makao pamoja na hali ya kutokuwa na utulivu, bila kuongeza wazo mahsusi la mkimbizi wa sheria.
- source_word: בָאָרֶץ
  choice: duniani
  rationale: אֶרֶץ linaweza kumaanisha dunia au nchi. Katika simulizi hili la mwanzo wa ulimwengu, ‘duniani’ linafaa kwa upeo mpana, huku uwezekano wa ‘katika nchi’ ukitajwa katika tanbihi.
theological_decisions:
- issue: Upeo wa hukumu ya Kaini
  choice: Hukumu halisi inayohusisha ardhi kutompatia mazao kwa nguvu zake na Kaini kukosa makao na utulivu
  alternative: Kutotulia kisaikolojia pekee, au kufukuzwa katika eneo fulani tu
  rationale: Aya yenyewe inaunganisha kutokuzalisha kwa ardhi na hali ya Kaini ya kuhamahama. Tafsiri inadumisha pande zote mbili bila kuziingiza katika mfumo wa mafundisho usiotajwa na matini.
- issue: Maana ya נָע וָנָד
  choice: Maneno mawili yenye kuingiliana yanayoimarisha hali ya kutangatanga na kutokuwa na utulivu
  alternative: ‘Mhamaji na mkimbizi,’ ambayo inaweza kudokeza bila lazima kwamba Kaini anakimbia sheria au anayewinda
  rationale: Kiebrania kina jozi ya maneno yenye maana zinazokaribiana. Kiswahili kimehifadhi msisitizo huo bila kuamua kwamba neno la pili lazima liwe na maana ya kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo ni wa moja kwa moja na wa sasa; ‘ardhi’ huhifadhi uhusiano wa simulizi na udongo unaolimwa, ‘nguvu zake’ huhifadhi sitiari ya Kiebrania, na tanbihi zinaonyesha utata halisi wa כִּי, נָע וָנָד, na אֶרֶץ.
