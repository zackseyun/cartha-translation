base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: sw
  text: Lameki akajitwalia wake wawili.[a] Jina la mmoja lilikuwa Ada, na jina la mwingine[b] lilikuwa Sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa lugha ya kawaida zaidi, “Lameki akaoa wanawake wawili.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wa pili.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akajitwalia
  rationale: Kitenzi לקח kimsingi ni ‘chukua’; pamoja na ‘wake wawili’ hapa kinaonyesha wazi kujitwalia katika ndoa, huku kikihifadhi muundo wa Kiebrania.
- source_word: לוֹ
  choice: -ji- katika ‘akajitwalia’
  rationale: Kiambishi cha kujirejelea kinaonyesha maana ya ‘kwa ajili yake mwenyewe’ kwa Kiswahili cha kawaida bila kuongeza maneno mazito.
- source_word: שְׁתֵּי נָשִׁים
  choice: wake wawili
  rationale: Ingawa נָשִׁים inaweza kumaanisha wanawake au wake, muktadha wa לקח לוֹ unaonyesha uhusiano wa ndoa.
- source_word: שֵׁם הָאַחַת
  choice: Jina la mmoja
  rationale: Huhifadhi fomula ya kutaja jina na kurejelea mmoja kati ya wawili kwa Kiswahili cha asili.
- source_word: עָדָה
  choice: Ada
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: na jina la mwingine
  rationale: Ingawa הַשֵּׁנִית kihalisi ni ‘wa pili,’ ‘mwingine’ ni ya kawaida zaidi inapozungumziwa sehemu ya pili ya jozi, bila kupoteza maana.
- source_word: צִלָּה
  choice: Sila
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili; sauti ya mwanzo ya Kiebrania ni tsadi, ambayo kwa kawaida hurahisishwa kuwa s katika majina ya Kiswahili.
theological_decisions:
- issue: Kueleza wazi kuwa Lameki alikuwa na wake wengi
  choice: wake wawili, bila maoni ya kimaadili
  alternative: wanawake wawili; alioa wanawake wawili
  rationale: Aya inasimulia kwamba Lameki alijitwalia wake wawili, lakini haitoi hukumu ya kimaadili juu ya tendo hilo. Tafsiri inaweka wazi hali ya ndoa bila kuingiza msimamo usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Akajitwalia’ huhifadhi kwa kiasi usemi wa chanzo; tanbihi inatoa usemi wa kawaida zaidi. Alama zote za tanbihi zimo katika matini kuu.
