  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: sw
  text: Ndipo Yahwe akamwambia, “Kwa hiyo, yeyote atakayemuua Kaini atalipizwa kisasi mara saba.” Naye Yahwe akaweka alama juu ya Kaini[a], ili yeyote atakayemkuta asimpige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara.” Neno la Kiebrania linaweza kumaanisha ishara au alama ya kutofautisha; andiko halisemi ilikuwa ya namna gani.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linaendeleza jina la Mungu YHWH kwa umbo la kawaida na linalosomeka katika Kiswahili.
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Linaonyesha hitimisho linalotokana na maneno yaliyotangulia kwa Kiswahili cha sasa na cha kawaida.
- source_word: כָּל הֹרֵג קַיִן
  choice: yeyote atakayemuua Kaini
  rationale: Muundo huu ni wa jumla na usioainisha mtu; kauli hii ni ya asili katika Kiswahili na inadumisha upeo wa yeyote.
- source_word: שִׁבְעָתַיִם יֻקָּם
  choice: atalipiziwa kisasi mara saba
  rationale: Kauli tendwa ya Kiebrania inaacha mtendaji bila kutajwa; tafsiri inaonyesha kwa kawaida kwamba muuaji wa Kaini ndiye atakayepatwa na kisasi, huku 'mara saba' ikihifadhi kiwango cha adhabu.
- source_word: אוֹת
  choice: alama
  rationale: Neno linaweza kumaanisha ishara au alama ya kutambulisha; 'alama' linafaa katika muktadha bila kubainisha umbo lake.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ כָּל מֹצְאוֹ
  choice: ili yeyote atakayemkuta asimpige
  rationale: Muundo huu unaonyesha kusudi la kuzuia, na 'asimpige' linaakisi נכה bila kuifanya maana iwe 'amuue' pekee.
theological_decisions:
- issue: Asili ya alama iliyowekwa juu ya Kaini
  choice: Imetafsiriwa 'alama' bila kueleza umbo au maana yake zaidi ya kazi yake ya ulinzi katika muktadha.
  alternative: '''ishara'''
  rationale: Kiebrania hakibainishi ikiwa אוֹת ilikuwa kitu cha mwili, ishara ya aina nyingine, au ilikuwa na umbo gani; tafsiri haiongezi dhana za baadaye.
- issue: Mtu anayepatwa na kisasi cha mara saba
  choice: Kauli inaonyesha kwamba yeyote anayemuua Kaini ndiye atakayelipiziwa kisasi.
  alternative: 'Kauli halisi zaidi lakini yenye utata: ''atalipizwa mara saba.'''
  rationale: Ingawa kauli tendwa ya Kiebrania ni fupi na mtendaji wake ametajwa kwa kudokezwa, muktadha ni onyo kwa muuaji wa Kaini. Kiswahili hiki kinaondoa utata wa kisarufi bila kumtaja wazi mtendaji wa kisasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili bila kufuta kauli tendwa, kusudi la ulinzi, au kutobainishwa kwa aina ya alama.
