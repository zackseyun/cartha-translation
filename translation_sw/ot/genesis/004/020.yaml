  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: sw
  text: Ada akamzaa Yabali[a]; yeye alikuwa baba wa wale wanaoishi katika mahema na kufuga mifugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baba wa wakaaji wa mahema na wafugaji wa mifugo.” Neno la Kiebrania “baba wa” linaweza kumaanisha babu wa ukoo, mwanzilishi, au mtu wa kwanza anayewakilisha mtindo fulani wa maisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: akamzaa
  rationale: Kitenzi cha Kiebrania katika simulizi la ukoo kinaeleza Ada kumzaa Yabali; “akamzaa” ni usemi mfupi, wa kawaida na unaofaa muktadha huu.
- source_word: עָדָה
  choice: Ada
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֶת
  choice: '[alama ya yambwa tendwa, haijatafsiriwa]'
  rationale: Huonyesha kwamba Yabali ndiye yambwa wa kitenzi; halina neno la pekee la kutafsiri hapa.
- source_word: יָבָל
  choice: Yabali
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: הוּא הָיָה
  choice: yeye ndiye aliyekuwa
  rationale: Hutambulisha Yabali na kueleza nafasi yake; tafsiri hii ni ya asili katika Kiswahili na haibadili maana kuwa “akawa.”
- source_word: אֲבִי
  choice: baba wa
  rationale: Inahifadhi sitiari ya Kiebrania, ambayo katika taarifa hii inaweza kumaanisha babu, mwanzilishi, au mtu wa kwanza anayewakilisha mtindo fulani wa maisha.
- source_word: יֹשֵׁב אֹהֶל
  choice: wale wanaoishi katika mahema
  rationale: Umbo la umoja lina maana ya kundi; wingi wa Kiswahili huweka wazi kwamba ni jamii ya watu wenye maisha ya kuhamahama katika mahema.
- source_word: וּמִקְנֶה
  choice: na kufuga mifugo
  rationale: מִקְנֶה humaanisha mifugo kwa upana. Kitenzi “kufuga” kinaonyesha kwa Kiswahili uhusiano unaodokezwa kati ya watu hao na mifugo yao, bila kuifinya maana kuwa ng’ombe pekee.
theological_decisions:
- issue: Maana pana ya “baba wa” katika taarifa ya kitamaduni na kiukoo
  choice: Kudumisha “baba wa” katika matini na kufafanua upana wake katika tanbihi
  alternative: babu wa; mwanzilishi wa
  rationale: Hii huhifadhi sitiari na utata halisi wa Kiebrania bila kuamua kimyakimya kama uhusiano ni wa nasaba tu au wa kuanzisha mtindo wa maisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Mahema” na “mifugo” ni maneno mapana na ya kawaida; muundo wa sentensi unabaki karibu na taarifa fupi ya ukoo ya Kiebrania.
