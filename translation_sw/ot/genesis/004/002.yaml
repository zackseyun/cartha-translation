  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: sw
  text: Kisha akamzaa tena[a] Abeli, ndugu yake Kaini. Abeli akawa mchungaji wa kondoo na mbuzi[b], lakini Kaini alikuwa akilima ardhi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaendelea kuzaa” au “akajifungua tena.” Nahau ya Kiebrania hutumia kitenzi chenye maana ya “kuongeza” pamoja na kitenzi-jina kuonyesha kurudia au kuendelea kwa tendo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linamaanisha mifugo midogo kwa ujumla, hasa kondoo na mbuzi.
    reason: cultural_note
  - marker: c
    text: Au “alikuwa mkulima wa ardhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: akamzaa tena
  rationale: Muundo wa יסף pamoja na kitenzi-jina huonyesha kurudia au kuendelea kwa tendo. Katika simulizi hili, “akamzaa tena” ni Kiswahili cha kawaida kinachoonyesha kuzaliwa kwa mtoto mwingine bila kuiga nahau ya Kiebrania neno kwa neno.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: Abeli, ndugu yake
  rationale: Viashiria viwili vya yambwa vinamtambulisha mtoto aliyezaliwa kama Abeli, ndugu yake Kaini. Mpangilio huu ni wa asili katika Kiswahili na unadumisha msisitizo wa uhusiano wao.
- source_word: הֶבֶל
  choice: Abeli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וַיְהִי
  choice: akawa
  rationale: Hapa היה hutambulisha hali au shughuli ya Abeli. “Akawa” hudumisha mwendo wa simulizi, ingawa “alikuwa” pia ingewezekana.
- source_word: רֹעֵה צֹאן
  choice: mchungaji wa kondoo na mbuzi
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi. Kutaja zote mbili huepuka kulifanya neno kuwa na maana finyu ya kondoo pekee na ni wazi kwa msomaji wa sasa.
- source_word: קַיִן
  choice: Kaini
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: alikuwa mkulima wa ardhi
  rationale: עבד pamoja na אֲדָמָה humaanisha kuifanyia kazi au kuilima ardhi. “Mkulima wa ardhi” ni ya asili na yenye heshima katika Kiswahili, huku ikihifadhi neno “ardhi” muhimu katika muktadha wa Mwanzo.
- source_word: אֲדָמָה
  choice: ardhi
  rationale: “Ardhi” hudumisha uhusiano wa kimsamiati na ardhi iliyotajwa katika simulizi la awali la Mwanzo kuliko tafsiri pana kama “shamba.”
- source_word: וְ
  choice: lakini
  rationale: Ingawa kiunganishi hiki kimsingi ni “na,” hapa “lakini” huonyesha kwa kawaida tofauti kati ya shughuli za ndugu hao bila kudokeza tathmini ya kimaadili.
theological_decisions:
- issue: Jinsi shughuli za ndugu hao zinavyowasilishwa
  choice: Shughuli zao zimeelezwa kama tofauti tu, bila kuipa mojawapo ubora wa kimaadili au wa kiroho.
  alternative: Kutumia lugha inayodokeza kwamba uchungaji au ukulima ulikuwa bora kuliko shughuli nyingine.
  rationale: Kiebrania kinaeleza kazi za Abeli na Kaini bila kutoa hukumu ya kimaadili katika mstari huu. Tafsiri inadumisha hali hiyo ya kutopendelea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. “Akamzaa” humrejelea Abeli moja kwa moja; “mchungaji wa kondoo na mbuzi” hufafanua upeo wa צֹאן; na “mkulima wa ardhi” ni usemi wa kawaida unaohifadhi dhamira ya אֲדָמָה. Alama zote za tanbihi zimo katika matini kuu.
