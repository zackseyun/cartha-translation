  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: sw
  text: Baada ya muda fulani[a], Kaini akamletea Yahwe[c] sadaka kutokana na mazao ya ardhi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa uhalisi, “kutoka mwisho wa siku”; yaani, baada ya kipindi fulani.
    reason: lexical_alternative
  - marker: b
    text: Au “matunda ya ardhi.”
    reason: lexical_alternative
  - marker: c
    text: “Yahwe” ni namna ya kulitoholea jina la Mungu YHWH; tafsiri nyingine hulitoa kuwa “BWANA” au hulitoholea “Yehova.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Baada ya ...
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha sasa bila kutumia tafsiri nzito ya neno kwa neno kama ‘ikawa kwamba.’ Nguvu ya kiunganishi cha simulizi imejumuishwa katika sentensi nzima.
- source_word: מִקֵּץ יָמִים
  choice: muda fulani
  rationale: Hii ni nahau ya muda uliopita, si rejeo la mwisho wa nyakati. ‘Muda fulani’ ni ya kawaida na inaacha urefu wa kipindi bila kubainishwa.
- source_word: וַיָּבֵא
  choice: akamletea
  rationale: Hifili ya בוא hapa ina maana ya kuleta kitu kwa mpokeaji. ‘Akamletea’ pia hudumisha mfululizo wa matukio katika simulizi.
- source_word: קַיִן
  choice: Kaini
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: kutokana na mazao ya ardhi
  rationale: פְּרִי inaweza kumaanisha tunda au mazao. Katika muktadha wa kilimo, ‘mazao’ ni ya asili zaidi kuliko ‘matunda’ na ‘ardhi’ huhifadhi uhusiano na אֲדָמָה.
- source_word: מִנְחָה
  choice: sadaka
  rationale: Neno hili linaweza kumaanisha zawadi, ushuru, au toleo. Katika muktadha wa ibada, ‘sadaka’ ni neno pana na linaloeleweka bila kubainisha aina ya sadaka zaidi ya maandishi.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kiambishi ל־ kinaonyesha mpokeaji wa sadaka, nacho jina יהוה limetoholewa kama ‘Yahwe’ ili kuhifadhi jina la Mungu lililo katika maandishi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja tetragramatoni YHWH. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza jambo hilo.
- issue: Maana ya מִקֵּץ יָמִים
  choice: Baada ya muda fulani
  alternative: Mwishoni mwa siku
  rationale: Katika muktadha huu kirai kinaeleza muda uliopita kabla ya Kaini kuleta sadaka; hakionyeshi mwisho wa nyakati. Tafsiri haiongezi maana ya kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Akamletea’ huendeleza mtiririko wa simulizi, na ‘mazao ya ardhi’ ni usemi wa kawaida unaofaa muktadha wa kilimo.
