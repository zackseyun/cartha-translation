base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: sw
  text: Na sasa umelaaniwa kutoka katika ardhi[a], iliyofungua kinywa chake ili kupokea damu[b] ya ndugu yako kutoka mkononi mwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbali na ardhi,” au “kwa ardhi.” Kiebrania kinaweza kuonyesha kwamba ardhi ndiyo chanzo cha laana au kwamba Kaini ametengwa nayo.
    reason: alternative_reading
  - marker: b
    text: Kwa Kiebrania, “damu” iko katika umbo la wingi; hapa ni nahau inayoweza kumaanisha damu iliyomwagika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi pamoja na kielezi cha wakati, na kuonyesha matokeo ya mara moja ya tendo la Kaini.
- source_word: אָרוּר אָתָּה
  choice: umelaaniwa
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoeleza hali ya Kaini kuwa chini ya laana.
- source_word: מִן הָאֲדָמָה
  choice: kutoka katika ardhi
  rationale: Inafuata kwa karibu kihusishi cha Kiebrania מִן bila kukifasiri waziwazi kuwa ardhi ndiyo mtendaji wa laana au kwamba Kaini amefukuzwa mbali nayo; tanbihi inaeleza uwezekano huo.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: iliyofumbua kinywa chake
  rationale: Inadumisha taswira ya ardhi kama kitu chenye kinywa bila kuipa jinsia ya kibinadamu isiyohitajika katika Kiswahili.
- source_word: לָקַחַת
  choice: ili kuipokea
  rationale: Katika muktadha wa ardhi kuingiza damu iliyomwagika, 'kuipokea' ni ya asili kuliko tafsiri ya moja kwa moja 'kuitwaa' huku ikihifadhi taswira.
- source_word: דְּמֵי אָחִיךָ
  choice: damu ya ndugu yako
  rationale: Ingawa 'damu' iko katika umbo la wingi katika Kiebrania, hapa ni nahau ya damu iliyomwagika; umoja ndio usemi wa kawaida katika Kiswahili.
- source_word: מִיָּדֶךָ
  choice: kutoka mkononi mwako
  rationale: Inahifadhi picha halisi ya mkono na kusisitiza uwajibikaji wa moja kwa moja wa Kaini.
theological_decisions:
- issue: Uhusiano wa laana na ardhi
  choice: Kaini amelaaniwa 'kutoka katika ardhi,' bila kubainisha zaidi maana ya uhusiano huo.
  alternative: Ardhi ndiyo inayomlaani Kaini; au Kaini ametengwa na kufukuzwa mbali na ardhi.
  rationale: Kihusishi cha Kiebrania מִן kinaweza kuonyesha chanzo au kutengwa. Tafsiri kuu na tanbihi zinahifadhi mvutano huo badala ya kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo 'kutoka katika ardhi' umeachwa kwa makusudi ili kufuata Kiebrania na kuhifadhi utata wake; tanbihi husaidia kuufafanua.
