base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: sw
  text: Kaini akamjua mke wake[a], naye akapata mimba na kumzaa Henoko. Kaini alikuwa akijenga mji[b], akauita mji huo kwa jina la mwanawe Henoko[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “akamjua mke wake” ni nahau ya Kiebrania inayomaanisha kwamba walifanya tendo la ndoa.
    reason: cultural_note
  - marker: b
    text: 'Muundo wa Kiebrania unaonyesha tendo linaloendelea: “alikuwa akijenga mji,” badala ya kusema tu “alijenga mji.”'
    reason: lexical_alternative
  - marker: c
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “akaliita jina la mji kwa jina la mwanawe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: akamjua
  rationale: Huhifadhi nahau ya Kiebrania ya 'kujua' inayomaanisha kuwa na uhusiano wa kingono katika muktadha huu; tanbihi inaifafanua kwa msomaji wa kisasa.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: אִשָּׁה inaweza kumaanisha mwanamke au mke; kiambishi cha umilikaji na muktadha wa ndoa vinaunga mkono 'mke wake'.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: akapata mimba na kumzaa
  rationale: '''Akapata mimba'' ni Kiswahili cha kawaida na wazi; ''kumzaa'' huwasilisha tendo la kuzaa mtoto aliyetajwa.'
- source_word: חֲנוֹךְ
  choice: Henoko
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: alikuwa akijenga mji
  rationale: Muundo wa היה pamoja na participle בֹּנֶה unaonyesha tendo linaloendelea, si lazima ujenzi uliokamilika.
- source_word: עִיר
  choice: mji
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa עִיר, bila kulazimisha ukubwa wa mji wa kisasa.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: akauita mji huo kwa jina la mwanawe
  rationale: Hutoa maana ya nahau ya Kiebrania kwa Kiswahili cha kawaida, huku tanbihi ikionyesha umbo lake halisi lenye kurudia neno 'jina'.
