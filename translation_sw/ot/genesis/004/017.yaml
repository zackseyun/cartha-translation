  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. Nahau ya chanzo 'akamjua' imehifadhiwa kwa hadhi ya kifasihi na kufafanuliwa katika tanbihi; hali endelevu ya ujenzi imehifadhiwa wazi.
