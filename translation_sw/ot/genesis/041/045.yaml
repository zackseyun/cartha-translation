base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: sw
  text: Farao akampa Yosefu jina Safenath-Paneah[a], akampa Asenathi, binti ya Potifera, kuhani wa Oni[b], kuwa mke wake. Kisha Yosefu akatoka, akapita katika nchi ya Misri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Safenath-Paaneah.” Maana ya jina hili la Kimisri haijulikani kwa hakika, na tafsiri zilizopendekezwa hutofautiana.
    reason: lexical_alternative
  - marker: b
    text: Oni ni mji wa Misri ambao baadaye uliitwa Heliopoli kwa Kigiriki.
    reason: cultural_note
  - marker: c
    text: Au, “katika nchi yote ya Misri.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם יוֹסֵף
  choice: akampa Yosefu jina
  rationale: Katika muktadha wa kumpa mtu jina jipya, muundo huu ni wa asili katika Kiswahili na unahifadhi wazi tendo la kumwita kwa jina.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: Safenath-Paneah
  rationale: Hili ni jina la Kimisri lenye maana isiyo na uhakika; limetoholewa badala ya kutafsiriwa.
- source_word: וַיִּתֶּן לוֹ אֶת אָסְנַת
  choice: akampa Asenathi
  rationale: Kitenzi נתן na yambwa ya mtu kinaonyesha kwamba Farao alimpa Yosefu Asenathi katika mpango wa ndoa.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: binti ya Potifera
  rationale: Majina yametoholewa kwa namna inayoeleweka katika Kiswahili, huku uhusiano wa kifamilia ukitolewa moja kwa moja.
- source_word: כֹּהֵן אֹן
  choice: kuhani wa Oni
  rationale: כֹּהֵן ni kuhani, na Oni limehifadhiwa kama jina la mahali badala ya kubadilishwa na jina la baadaye la Kigiriki.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili unaoonyesha kusudi la ndoa.
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: Kisha Yosefu akazunguka katika nchi yote ya Misri
  rationale: Katika muktadha wa mamlaka mapya ya Yosefu, usemi unaonyesha kutoka kwake na kusafiri katika eneo la Misri; 'akazunguka' ni wa asili, huku tanbihi ikihifadhi uwezekano wa tafsiri isiyoeleza kiwango hicho kwa uhakika.
