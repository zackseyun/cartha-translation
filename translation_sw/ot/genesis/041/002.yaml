base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: sw
  text: Na tazama, ng’ombe saba walikuwa wakipanda kutoka Mto Nile, wazuri kwa sura na wanene kwa mwili, nao walikuwa wakila malisho katika majani ya matete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katikati ya matete” au “katika majani ya kinamasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Huhifadhi kiashirio hai cha simulizi kinachoelekeza usikivu kwa tukio la ghafla katika ndoto.
- source_word: הַיְאֹר
  choice: Mto Nile
  rationale: Katika mazingira ya Kimisri ya Mwanzo, neno hili humaanisha hasa Nile, si mto wowote kwa ujumla.
- source_word: עֹלֹת
  choice: walikuwa wakipanda
  rationale: Kauli ya kushiriki inaonyesha tendo linaloendelea katika mandhari ya ndoto; muundo huu unahifadhi hali hiyo.
- source_word: פָּרוֹת
  choice: ng’ombe
  rationale: Neno linataja ng’ombe wa kike; katika Kiswahili cha kawaida, 'ng’ombe' ni chaguo la asili bila kuongeza umahususi usiotajwa.
- source_word: יְפוֹת מַרְאֶה
  choice: wazuri kwa sura
  rationale: Hueleza uzuri wa mwonekano kwa lugha ya sasa, wazi na yenye staha.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: wanene kwa mwili
  rationale: Huhifadhi msisitizo wa Kiebrania juu ya unene na ujazo wa mwili, badala ya kuufanya kuwa afya njema kwa ujumla.
- source_word: וַתִּרְעֶינָה
  choice: walikuwa wakilisha
  rationale: Huwasilisha tendo endelevu la kula malishoni linalounda mandhari ya ndoto.
- source_word: בָּאָחוּ
  choice: katika majani ya matete
  rationale: Hurejelea mimea ya majimaji au matete kandokando ya Nile; tanbihi huhifadhi uwezekano mwingine wa kimaana.
