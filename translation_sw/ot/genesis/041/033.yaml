  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: sw
  text: Sasa Farao na atafute[a] mtu mwenye ufahamu na hekima, na amweke juu ya nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Farao na amwone au amchague mtu mwenye ufahamu na hekima.” Kitenzi cha Kiebrania kinaweza kumaanisha kuona, kupata, au kuchagua katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa
  rationale: Inaonyesha mpito kutoka ufafanuzi wa ndoto kwenda kwenye shauri la vitendo; ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: יֵרֶא
  choice: na atafute
  rationale: Katika muktadha huu kitenzi cha kuona kina maana pana ya kumtafuta, kumtambua au kumchagua mtu anayefaa; muundo huu pia huhifadhi maana ya pendekezo au agizo lenye upole.
- source_word: פַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki katika Kiswahili cha Biblia.
- source_word: אִישׁ
  choice: mtu
  rationale: Neno la Kiswahili 'mtu' ni la kawaida katika uteuzi wa ofisa na halibadili dai la muktadha kuhusu anayeteuliwa.
- source_word: נָבוֹן וְחָכָם
  choice: mwenye ufahamu na hekima
  rationale: Hutofautisha uwezo wa kuelewa na kufanya maamuzi kwa busara na sifa pana ya hekima, bila kuyafanya maneno hayo kuwa kitu kimoja.
- source_word: וִישִׁיתֵהוּ
  choice: kisha amweke kuwa msimamizi
  rationale: Kitenzi cha Kiebrania ni 'kuweka'; katika muktadha wa utawala, usemi huu unaonyesha wazi kuwekwa katika mamlaka bila kudai cheo mahususi kisichotajwa.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: wa nchi ya Misri
  rationale: Huonyesha mamlaka juu ya nchi ya Misri kwa Kiswahili cha kawaida na chenye hadhi.
