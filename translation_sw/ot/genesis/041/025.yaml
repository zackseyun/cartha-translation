  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: sw
  text: Kisha Yosefu akamwambia Farao, “Ndoto ya Farao ni moja[a]; Mungu amemjulisha Farao kile anachokifanya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndoto za Farao ni moja.” Kiebrania kimetumia umoja, “ndoto,” lakini katika muktadha Yosefu anazichukulia ndoto mbili za Farao kuwa ujumbe mmoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “kile Mungu atakachokifanya” au “kile Mungu anachokaribia kukifanya.” Umbo la Kiebrania linaweza kutafsiriwa kwa karibu zaidi kama tendo linaloendelea, lakini hapa huenda linarejelea jambo ambalo Mungu yuko karibu kulitimiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa simulizi unaendeleza mfululizo wa matukio; ‘Kisha’ na ‘akamwambia’ ni Kiswahili cha kawaida kinachohifadhi mwendelezo huo na wazo la kusema kwa mtu.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo cha mtawala wa Misri katika Kiswahili.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: Ndoto ya Farao ni moja
  rationale: Tafsiri hii huhifadhi nomino ya umoja ‘ndoto’ na kiarifu ‘moja’ kama ilivyo katika Kiebrania, huku tanbihi ikieleza kwamba ndoto mbili zilizotangulia zinachukuliwa kuwa ujumbe mmoja.
- source_word: אֵת אֲשֶׁר
  choice: kile ambacho
  rationale: Kirai hiki kinaanzisha yambwa ya kitenzi na kwa Kiswahili cha kawaida hutoa maana ya ‘jambo ambalo’ bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu kwa namna maalumu; ‘Mungu’ ndiyo tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: עֹשֶׂה
  choice: anakifanya
  rationale: Huhifadhi kwa karibu hali ya kitenzi kishirikishi cha Kiebrania bila kulazimisha wazi maana ya wakati ujao, ingawa muktadha unaweza kuelekeza kwenye jambo ambalo Mungu yuko karibu kulifanya.
- source_word: הִגִּיד
  choice: amemjulisha
  rationale: Hiphil ya נגד ina maana ya kumwambia au kumfahamisha mtu jambo; ‘amemjulisha’ huwasilisha tendo la Mungu la kufunua jambo hilo kwa Farao kwa Kiswahili cha asili.
- source_word: לְפַרְעֹה
  choice: Farao
  rationale: Katika muundo ‘amemjulisha Farao,’ Farao ndiye yambwa anayepokea taarifa; kiambishi ‘m-’ katika kitenzi tayari huonyesha uhusiano unaowakilishwa na לְ.
theological_decisions:
- issue: Rejeo la הָאֱלֹהִים
  choice: Mungu
  alternative: huyo Mungu
  rationale: ‘Mungu’ hutambulisha rejeo maalumu la Kiebrania kwa lugha ya kawaida bila kuingiza maelezo ya ziada ya kimadhehebu.
- issue: Wakati wa tendo katika עֹשֶׂה
  choice: anakifanya
  alternative: atakachokifanya / anachokaribia kukifanya
  rationale: Kitenzi kishirikishi cha Kiebrania kinaweza kueleweka kama tendo linaloendelea au linalokaribia kutokea. Tafsiri kuu huhifadhi umbo lisiloamua zaidi, na tanbihi hutaja uwezekano wa maana ya wakati unaokaribia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji wa ‘Farao’ na uhusiano wa karibu kati ya vifungu viwili, huku tanbihi zikidumisha utata halisi wa umoja wa ‘ndoto’ na wakati wa kitenzi עֹשֶׂה.
