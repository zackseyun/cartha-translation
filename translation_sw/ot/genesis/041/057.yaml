  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: sw
  text: Watu kutoka duniani kote[a] walikuja Misri kwa Yosefu kununua nafaka, kwa sababu njaa ilikuwa kali duniani kote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka nchi yote” au “kutoka ulimwengu wote.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia,” “nchi,” au “eneo”; hapa huenda linarejelea kwa upana nchi zilizoathiriwa na njaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Watu kutoka katika nchi zote
  rationale: Kiebrania kinasema kihalisi ‘nchi/dunia yote,’ lakini kitenzi cha wingi ‘walikuja’ kinaonyesha kwamba maana ni watu wa maeneo yote yaliyoathiriwa. Ufasiri huu ni wa asili katika Kiswahili huku ukihifadhi upana wa usemi.
- source_word: בָּאוּ מִצְרַיְמָה
  choice: walikuja Misri
  rationale: Kiambishi cha mwelekeo katika מִצְרַיְמָה kinaonyesha mwendo kuelekea Misri; ‘walikuja Misri’ ni Kiswahili cha kawaida na wazi.
- source_word: לִשְׁבֹּר
  choice: kununua nafaka
  rationale: Katika muktadha wa njaa, kitenzi שׁבר humaanisha kununua au kujipatia nafaka; kutaja ‘nafaka’ huweka wazi maana iliyodokezwa.
- source_word: אֶל יוֹסֵף
  choice: kwa Yosefu
  rationale: Kihalisi ni ‘kwa Yosefu’; hapa Yosefu ndiye msimamizi wa ugawaji wa nafaka. Tafsiri hii haibadili kihusishi kuwa ‘kutoka kwa Yosefu.’
- source_word: כִּי חָזַק הָרָעָב
  choice: kwa sababu njaa ilikuwa kali
  rationale: כִּי ni kiunganishi cha sababu, na חָזַק pamoja na ‘njaa’ huelezeka kwa Kiswahili cha asili kama ‘ilikuwa kali,’ badala ya ‘ilikuwa yenye nguvu.’
- source_word: בְּכָל הָאָרֶץ
  choice: katika dunia yote
  rationale: Usemi huu unarudia אֶרֶץ kwa maana pana ya ulimwengu unaojulikana au maeneo yote yaliyoathiriwa na njaa. ‘Dunia yote’ huhifadhi msisitizo mpana wa Kiebrania.
