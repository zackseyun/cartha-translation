  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mwanzo wa mstari umefafanuliwa kwa ‘Watu kutoka katika nchi zote’ ili kuepuka taswira isiyo ya kawaida ya nchi yenyewe kuja, huku tanbihi ikihifadhi mbadala wa kitenzi cha ununuzi. Alama [a] imewekwa katika matini kuu.
