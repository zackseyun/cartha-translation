  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unaendeleza urudiaji wa maandishi ya Kiebrania huku ukisomeka kwa urahisi; alama ya tanbihi imewekwa baada ya kirai kinachoifafanua.
