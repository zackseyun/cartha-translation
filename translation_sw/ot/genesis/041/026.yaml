base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: sw
  text: Ng’ombe saba wazuri ni miaka saba, na masuke saba mazuri ya nafaka[a] ni miaka saba; hiyo ni ndoto moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vichwa vya nafaka.” Neno la Kiebrania linamaanisha sehemu ya juu ya bua inayobeba punje.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹת
  choice: ng’ombe
  rationale: Katika muktadha wa ndoto ya Farao, neno hili linarejelea ng’ombe wa kike. Kiswahili kwa kawaida hutumia “ng’ombe” bila kulazimika kutaja jinsia hapa.
- source_word: הַטֹּבֹת
  choice: wazuri / mazuri
  rationale: “Wazuri” kwa ng’ombe na “mazuri” kwa mashuke huhifadhi maana pana ya ‘wema/uzuri’ bila kuifinya kuwa afya au sura pekee.
- source_word: שָׁנִים
  choice: miaka
  rationale: Hili ndilo neno la kawaida na la moja kwa moja; alama za ndoto zinaelezwa wazi kuwa miaka.
- source_word: שִׁבֳּלִים
  choice: mashuke ya nafaka
  rationale: “Mashuke” hurejelea sehemu ya juu ya mmea inayobeba punje; nyongeza “ya nafaka” huifanya maana iwe wazi kwa msomaji wa kawaida.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: hiyo ni ndoto moja
  rationale: Kauli hii ya Kiswahili huhifadhi msisitizo wa Kiebrania kwamba makundi hayo mawili ya alama yanaunda ndoto moja yenye ujumbe mmoja.
- source_word: הֵנָּה
  choice: ni
  rationale: Kiwakilishi cha wingi cha Kiebrania kinafanya kazi ya kuunganisha kiima na kiarifu; Kiswahili hukiwasilisha kwa kawaida kwa “ni” bila kurudia kiwakilishi.
