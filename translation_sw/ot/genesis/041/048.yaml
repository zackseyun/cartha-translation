base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: sw
  text: Akakusanya chakula chote cha ile miaka saba iliyokuwa katika nchi ya Misri, akakiweka chakula hicho katika miji. Katika kila mji aliweka chakula kilichotoka katika mashamba yaliyouzunguka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: Akakusanya
  rationale: Kitenzi קבץ humaanisha kukusanya pamoja; “akakusanya” ni cha kawaida na chenye hadhi katika simulizi.
- source_word: כָּל אֹכֶל
  choice: chakula chote
  rationale: אֹכֶל ni neno pana la chakula; halipaswi kufinywa kuwa nafaka pekee ingawa muktadha ni wa mazao yaliyohifadhiwa.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: ile miaka saba iliyokuwa katika nchi ya Misri
  rationale: “Ile miaka saba” inarejelea miaka iliyotajwa tayari, na “iliyokuwa” huhifadhi kwa ukaribu usemi wa Kiebrania bila kulazimisha tafsiri ya ziada.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: akakiweka chakula hicho katika miji
  rationale: נתן hapa ina maana ya kuweka; “kukihifadhi” lingeweka wazi zaidi wazo linalotokana na muktadha kuliko kitenzi chenyewe.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: chakula kilichotoka katika mashamba yaliyouzunguka
  rationale: Usemi huu unaonyesha chakula cha mashamba yanayouzunguka kila mji; tafsiri hii ni wazi na ya asili katika Kiswahili.
- source_word: נָתַן בְּתוֹכָהּ
  choice: Katika kila mji aliweka
  rationale: 'Muundo wa kurejelea tena katika Kiebrania unaonyesha ugawaji: mazao ya eneo la kila mji yaliwekwa ndani ya mji huo. Kiswahili kinaeleza hilo kwa kawaida kwa “Katika kila mji.”'
theological_decisions: []
