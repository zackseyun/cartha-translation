base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: sw
  text: Ndipo Farao akaondoa pete yake ya muhuri[a] mkononi mwake, akaiweka kwenye mkono wa Yosefu, akamvika mavazi ya kitani bora[b], na kumwekea mkufu wa dhahabu[c] shingoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pete”; neno la Kiebrania linaweza kumaanisha pete kwa ujumla, lakini katika muktadha huu wa kifalme huenda ni pete ya muhuri ya Farao, iliyowakilisha mamlaka aliyomkabidhi Yosefu.
    reason: lexical_alternative
  - marker: b
    text: “Kitani bora” limetafsiri neno la Kiebrania שֵׁשׁ, linalomaanisha kitani cha ubora wa juu kilichohusishwa na utajiri na heshima.
    reason: cultural_note
  - marker: c
    text: Au “mkufu wa dhahabu” au “pambo la dhahabu la shingoni.” Umbo kamili la pambo linalotajwa na neno la Kiebrania halijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: akaondoa
  rationale: Kitenzi hiki humaanisha kuondoa au kuvua; “akaondoa” ni cha kawaida na kinafaa kwa tendo rasmi la kuiondoa pete.
- source_word: טַבַּעְתּוֹ
  choice: pete yake ya muhuri
  rationale: Nomino inaweza kumaanisha pete kwa ujumla, lakini katika muktadha huu wa kifalme inaelekea kuwa pete ya muhuri iliyowakilisha mamlaka aliyokabidhiwa Yosefu.
- source_word: מֵעַל יָדוֹ
  choice: mkononi mwake
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa kirai cha Kiebrania kinachoonyesha mahali pete ilipoondolewa.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: akaitia mkononi mwa Yosefu
  rationale: Ingawa נתן mara nyingi humaanisha “kutoa,” hapa kitu kinachotajwa ni pete na kinawekwa mkononi mwa Yosefu; “akaitia” huwasilisha tendo hilo kwa Kiswahili cha kawaida.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: akamvika
  rationale: “Akamvika” huhifadhi maana ya Farao kumsababishia Yosefu avae mavazi hayo na inafaa kwa tukio rasmi la kumtawaza katika cheo.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: mavazi ya kitani laini
  rationale: שֵׁשׁ ni kitani bora cha thamani kilichohusishwa na hadhi na heshima; “kitani laini” ni sahihi na inaeleweka kwa wasomaji wa sasa.
- source_word: רְבִד הַזָּהָב
  choice: mkufu wa dhahabu
  rationale: Neno hili linaonyesha pambo la shingoni, ingawa umbo lake kamili halijulikani; “mkufu wa dhahabu” ni tafsiri ya asili isiyobana maana kupita kiasi.
- source_word: עַל צַוָּארוֹ
  choice: shingoni
  rationale: Kiswahili kwa kawaida hueleza pambo kuwa limewekwa shingoni; neno hili linawasilisha kwa ufasaha maana ya Kiebrania “juu ya shingo yake.”
