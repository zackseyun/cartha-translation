review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two sets of seven, their symbolic identification with years, and the final prediction of seven years of famine. However, “waliopanda baada yao” is not natural for cows appearing in a dream and can suggest climbing; the Hebrew participle denotes their subsequent appearance. “Yaliyokaushwa” can mean simply dried, whereas שְׁדֻפוֹת expresses crop damage from the east wind, better conveyed by “yaliyochomwa.”
  naturalness: The proposed revision uses idiomatic Standard East African Swahili. “Waliojitokeza baada yao” clearly describes the cows’ appearing subsequently, and “wa sura mbaya” avoids the potentially moral sense of “wabaya” in this animal-description context.
  terminology: “Masuke,” “upepo wa mashariki,” and “njaa” are appropriate established terminology. “Wa sura mbaya” renders the cows’ undesirable appearance/condition without implying moral evil. Footnote markers are attached to the words to which their alternatives apply.
  issues:
  - severity: medium
    issue: “Waliopanda baada yao” is an unnatural and potentially misleading rendering of הָעֹלֹת אַחֲרֵיהֶן.
    rationale: For cows in this dream context, Kiswahili “kupanda” normally means to climb or go upward. The Hebrew describes cows that came up/appeared after the first group; “waliojitokeza baada yao” retains sequence and dream appearance naturally.
  - severity: medium
    issue: “Yaliyokaushwa na upepo wa mashariki” understates שְׁדֻפוֹת.
    rationale: The Hebrew participle describes grain damaged or scorched by the hot east wind, not merely grain that has become dry. “Yaliyochomwa” better conveys the damaging effect.
  - severity: low
    issue: “Wabaya” may be heard as a moral evaluation in Swahili.
    rationale: The Hebrew adjective here concerns the cows’ poor, unattractive condition. “Wa sura mbaya” makes the contextual sense explicit without theological or moral overreading.
  revised_text: Nao ng’ombe saba waliokonda na wa sura mbaya, waliojitokeza baada yao, ni miaka saba; na masuke saba[a] matupu, yaliyochomwa na upepo wa mashariki[b], yatakuwa miaka saba ya njaa.
  revised_footnotes:
  - marker: a
    text: Au, “vichwa vya nafaka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yaliyoharibiwa na upepo wa mashariki.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the idiom for the cows’ subsequent appearance, strengthens the rendering of wind-damaged grain, and clarifies that the cows are described as unattractive rather than morally bad. It retains the Hebrew sequence, parallelism, and future force of the final clause. Footnote anchors are placed directly after “masuke” and “upepo wa mashariki,” the terms to which the alternatives belong.
