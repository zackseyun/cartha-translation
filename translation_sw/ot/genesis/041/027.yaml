base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: sw
  text: Nao ng’ombe saba waliokonda na wa sura mbaya, waliojitokeza baada yao, ni miaka saba; na masuke saba[a] matupu, yaliyochomwa na upepo wa mashariki[b], yatakuwa miaka saba ya njaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vichwa vya nafaka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yaliyoharibiwa na upepo wa mashariki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: waliokonda
  rationale: Katika muktadha wa ng’ombe, neno hili linaonyesha kukonda kwa kukosa lishe; ‘waliokonda’ ni la kawaida na linaeleweka wazi.
- source_word: וְהָרָעוֹת
  choice: na wabaya
  rationale: רַע hapa inaeleza hali au sura isiyopendeza ya ng’ombe, si ubaya wa kimaadili; ‘wabaya’ huhifadhi upana wa neno la Kiebrania.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: waliopanda baada yao
  rationale: Tafsiri hii huhifadhi kitendo cha kupanda na mfuatano wa kuonekana kwa ng’ombe katika ndoto.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: ni miaka saba
  rationale: Ni utambulisho wa alama za ndoto kuwa miaka saba; Kiswahili cha kawaida hakihitaji kiwakilishi tofauti hapa.
- source_word: הַשִׁבֳּלִים
  choice: masuke
  rationale: ‘Masuke’ ni neno la kawaida la Kiswahili kwa vichwa vya nafaka na linafaa kwa taswira ya kilimo.
- source_word: הָרֵקוֹת
  choice: matupu
  rationale: Kwa masuke, neno linaonyesha kutokuwa na punje zilizojaa; ‘matupu’ huwasilisha hali hiyo moja kwa moja.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: yaliyokaushwa na upepo wa mashariki
  rationale: Kirai kinaeleza uharibifu unaosababishwa na upepo mkavu na moto wa mashariki; ‘yaliyokaushwa’ ni wazi na cha asili katika Kiswahili.
- source_word: יִהְיוּ
  choice: yatakuwa
  rationale: Kitenzi kisichotimilika kinaelekea mbele katika maelezo ya Yusufu, hivyo ‘yatakuwa’ huhifadhi nguvu ya utabiri.
- source_word: שְׁנֵי רָעָב
  choice: miaka saba ya njaa
  rationale: ‘Njaa’ ni tafsiri ya kawaida na sahihi ya רָעָב katika simulizi hili.
