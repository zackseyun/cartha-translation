revisions:
- from: Nao wale ng’ombe saba waliokonda na wabaya, waliopanda baada yao, ni miaka saba; na yale masuke saba matupu yaliyokaushwa na upepo wa mashariki yatakuwa miaka saba ya njaa.
  to: Nao ng’ombe saba waliokonda na wa sura mbaya, waliojitokeza baada yao, ni miaka saba; na masuke saba[a] matupu, yaliyochomwa na upepo wa mashariki[b], yatakuwa miaka saba ya njaa.
  rationale: The revision corrects the idiom for the cows’ subsequent appearance, strengthens the rendering of wind-damaged grain, and clarifies that the cows are described as unattractive rather than morally bad. It retains the Hebrew sequence, parallelism, and future force of the final clause. Footnote anchors are placed directly after “masuke” and “upepo wa mashariki,” the terms to which the alternatives belong.
