base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: sw
  text: Njaa ilikuwa imeenea duniani kote. Yosefu akafungua maghala yote[a] na kuwauzia Wamisri nafaka. Njaa ikazidi kuwa kali katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “akafungua vyote vilivyokuwa ndani yao.” Kirejelewa cha “yao” hakitajwi wazi; muktadha unaashiria maghala ya nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָב
  choice: njaa
  rationale: Katika simulizi hili רָעָב humaanisha ukosefu mkubwa wa chakula, hivyo “njaa” ndiyo tafsiri ya kawaida na sahihi.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: ilikuwa imeenea duniani kote
  rationale: Tafsiri hii ya kimaanisho inawasilisha wazo la njaa kuwa juu ya uso wote wa הארץ kwa Kiswahili cha kawaida. “Dunia” huhifadhi upana wa neno הארץ hapa, huku “imeenea” ikieleza kwa kawaida nahau ya Kiebrania.
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: akafungua maghala yote[a]
  rationale: Kifungu cha Kiebrania ni cha kidokezo na kwa neno moja moja ni “akafungua vyote vilivyokuwa ndani yake/yao”; muktadha unaonyesha mahali pa kuhifadhia nafaka. “Maghala yote” huwasilisha kitendo kinachokusudiwa kwa uwazi, na tanbihi huhifadhi umbo lisilo wazi la chanzo.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: akawauzia Wamisri nafaka
  rationale: Katika muktadha huu שׁבר ni kuuza nafaka au mahitaji ya chakula. Kutaja “nafaka” ni lazima ili nahau hiyo ieleweke, na “Wamisri” huwasilisha maana ya watu wa Misri.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: njaa ikazidi kuwa kali
  rationale: חזק kwa maana ya msingi ni kuwa na nguvu, lakini njaa ikiwa kiima humaanisha kuongezeka kwa ukali. “Ikazidi kuwa kali” ni Kiswahili cha asili kinachoonyesha kuongezeka huko.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Hii inafuata kikamilifu muundo wa Kiebrania na kudumisha mtindo wa simulizi la Mwanzo.
