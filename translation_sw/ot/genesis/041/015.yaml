lexical_decisions:
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Jina la cheo hiki limezoeleka katika Kiswahili cha Biblia na linaeleweka kwa wasomaji wa kawaida.
- source_word: חֲלוֹם חָלַמְתִּי
  choice: Nimeota ndoto
  rationale: Huhifadhi urudiaji wa mzizi wa Kiebrania kwa usemi wa kawaida na wa heshima wa Kiswahili.
- source_word: פֹתֵר
  choice: mtu wa kuifasiri
  rationale: Kitenzi ‘kufasiri’ kinafaa kwa kueleza maana ya ndoto bila kuongeza wazo lisilokuwapo katika chanzo.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: nimesikia ikisemwa juu yako
  rationale: Huwakilisha taarifa ambayo Farao ameisikia kuhusu Yosefu na kudumisha muundo usioeleza msemaji.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: unaposikia ndoto, unaweza kuifasiri
  rationale: Hutoa kwa Kiswahili asilia maana ya uwezo unaohusishwa na kusikia ndoto, bila kudai kwamba kusikia pekee ndiko kunakotoa tafsiri.
