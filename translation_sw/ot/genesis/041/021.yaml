revisions:
- from: Nao wakaingia matumboni mwa wale ng’ombe waliokonda[a], lakini haikuonekana kwamba walikuwa wameingia humo. Sura ya wale ng’ombe waliokonda ilikuwa mbaya kama hapo mwanzo. Ndipo nikaamka.
  to: Nao wakaingia matumboni mwa wale ng’ombe waliokonda[a], lakini haikujulikana kwamba walikuwa wameingia humo. Mwonekano wa wale ng’ombe waliokonda ulikuwa mbaya kama ilivyokuwa mwanzo. Ndipo nikaamka.
  rationale: The revision keeps the explicit antecedents that prevent the subject shift from becoming confusing in Swahili. It replaces the visually restricted “haikuonekana” with “haikujulikana,” closer to the Hebrew passive ‘was not known,’ and makes the final comparison more idiomatic without adding interpretation. The sole footnote remains correctly anchored to “matumboni.”
  reviewer_model: gpt-5.6-terra
