base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: sw
  text: Nao wakaingia matumboni mwa wale ng’ombe waliokonda[a], lakini haikujulikana kwamba walikuwa wameingia humo. Mwonekano wa wale ng’ombe waliokonda ulikuwa mbaya kama ilivyokuwa mwanzo. Ndipo nikaamka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndani yao” au “katikati yao”; katika ndoto hii, maana ni kwamba ng’ombe walionona waliingia matumboni mwa wale waliokonda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל קִרְבֶּנָה
  choice: Nao wakaingia matumboni mwa wale ng’ombe waliokonda
  rationale: Kitenzi cha wingi wa kike kinawahusu ng’ombe walionona waliokuwa wameliwa, nao wanaingia ndani ya wale waliokonda. Kutaja ‘wale ng’ombe waliokonda’ kunaondoa utata usio wa lazima katika Kiswahili, huku ‘matumboni’ ikitoa picha halisi ya ndoto.
- source_word: וְלֹא נוֹדַע
  choice: lakini haikuonekana
  rationale: Nifali ya ידע hapa inaeleza kwamba jambo hilo halikuweza kutambuliwa kwa kuangalia; ‘haikuonekana’ ni Kiswahili cha kawaida na kinacholingana na muktadha wa sura ya ng’ombe.
- source_word: כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: kwamba walikuwa wameingia humo
  rationale: Kiswahili kinatumia ‘humo’ kurudia mahali palipotajwa bila kufanya sentensi kuwa nzito, na ‘walikuwa wameingia’ huonyesha kitendo kilichotangulia hali ya kutoonekana.
- source_word: וּמַרְאֵיהֶן רַע
  choice: Sura ya wale ng’ombe waliokonda ilikuwa mbaya
  rationale: מַרְאֶה ni sura au mwonekano unaoonekana, na רַע hapa ni ‘mbaya.’ Kutaja tena ng’ombe waliokonda kunabainisha wenye sura hiyo bila kubadili maana.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: kama hapo mwanzo
  rationale: Tafsiri hii inahifadhi ulinganisho wa hali yao baada ya kula na hali yao ya kwanza katika ndoto.
- source_word: וָאִיקָץ
  choice: Ndipo nikaamka
  rationale: Kitenzi hiki kinahitimisha mfuatano wa simulizi; ‘ndipo’ huonyesha hatua inayofuata kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya wahusika yamerudiwa kwa kiasi ili kuzuia viwakilishi vya ngeli moja kuleta picha potofu kwamba ng’ombe waliingia matumboni mwao wenyewe.
