base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: sw
  text: Chakula hicho kitakuwa akiba[a] kwa ajili ya nchi kwa miaka ile saba ya njaa[c] itakayokuwa katika nchi ya Misri, ili nchi isiangamie[b] kwa sababu ya njaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa kuhifadhiwa” au “hifadhi,” kwa לְפִקָּדוֹן.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “isikatwe mbali”; maana yake hapa ni kwamba nchi isiharibiwe au isiangamie kwa sababu ya njaa.
    reason: lexical_alternative
  - marker: c
    text: Au, “akiba kwa ajili ya nchi kwa miaka saba ya njaa.” Muundo wa Kiebrania unaweza kueleweka kuwa unahusisha akiba hiyo moja kwa moja na nchi pamoja na miaka saba.
    reason: previous_rendering
lexical_decisions:
- source_word: וְהָיָה
  choice: kitakuwa
  rationale: Muundo huu katika muktadha wa mpango na utabiri unaelekeza kwenye matokeo ya wakati ujao.
- source_word: הָאֹכֶל
  choice: Chakula hicho
  rationale: אֹכֶל ni ‘chakula’ kwa maana pana; ‘hicho’ kinarejelea mazao yaliyokusanywa katika mstari uliotangulia bila kuyafanya kuwa nafaka pekee.
- source_word: לְפִקָּדוֹן
  choice: akiba
  rationale: Neno hili huonyesha kitu kilichowekwa salama kwa matumizi ya baadaye. ‘Akiba’ ni Kiswahili cha kawaida na kinafaa katika muktadha wa kuhifadhi chakula.
- source_word: לָאָרֶץ
  choice: kwa ajili ya nchi
  rationale: אֶרֶץ hapa ni nchi ya Misri; ‘kwa ajili ya nchi’ huonyesha walengwa wa akiba kwa njia ya asili katika Kiswahili.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: kwa miaka ile saba ya njaa
  rationale: ‘Ile’ huonyesha kwamba ni miaka saba maalumu iliyokwisha kutajwa katika ndoto na maelezo ya Yusufu.
- source_word: אֲשֶׁר תִּהְיֶיןָ
  choice: itakayokuwa
  rationale: Kishazi hiki cha uhusiano kinaonyesha kwamba njaa hiyo bado itatokea.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii inadumisha usemi kamili wa Kiebrania na marudio ya wazo la ‘nchi’.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ
  choice: ili nchi isiangamie
  rationale: Niphal ya כרת kwa msingi ni ‘kukatiliwa mbali’; katika muktadha huu humaanisha nchi kutoangamia au kuteketea kwa njaa. ‘Isi­angamie’ ni ya asili kwa Kiswahili, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: בָּרָעָב
  choice: kwa sababu ya njaa
  rationale: Kihusishi kinaonyesha sababu au njia ambayo nchi ingeangamia; ‘kwa sababu ya’ huwasilisha maana hiyo wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Chakula’ kimehifadhiwa badala ya ‘nafaka’ ili kutopanua umaalumu usiopo katika neno la Kiebrania; taswira ya כרת imefafanuliwa katika tanbihi kwa sababu tafsiri yake ya moja kwa moja si ya kawaida inaposemwa kuhusu nchi.
