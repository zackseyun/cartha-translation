  text: וַ/יִּשְׁלַ֤ח פַּרְעֹה֙ וַ/יִּקְרָ֣א אֶת יוֹסֵ֔ף וַ/יְרִיצֻ֖/הוּ מִן הַ/בּ֑וֹר וַ/יְגַלַּח֙ וַ/יְחַלֵּ֣ף שִׂמְלֹתָ֔י/ו וַ/יָּבֹ֖א אֶל פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: sw
  text: Ndipo Farao akatuma watu wamwite Yosefu, nao wakamtoa haraka[a] shimoni.[b] Yosefu akajinyoa, akabadilisha mavazi yake, kisha akaja kwa Farao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamharakisha kutoka.” Kitenzi cha Kiebrania kinaonyesha uharaka wa kumtoa Yosefu kifungoni.
    reason: lexical_alternative
  - marker: b
    text: Au, “gerezani.” Neno la Kiebrania humaanisha kihalisi “shimo,” lakini hapa linaweza kumaanisha sehemu ya kifungo iliyofanana na shimo au kisima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת יוֹסֵף
  choice: akatuma watu wamwite Yosefu
  rationale: Muundo huu unahifadhi vitendo vyote viwili vya kutuma na kuita, huku ukitoa Kiswahili cha kawaida kinachoeleza kwamba Farao aliwatuma watu ili Yosefu aitwe. Watu hao hawatajwi wazi katika Kiebrania, lakini wanadokezwa na kitendo kinachofuata chenye kiambishi cha wingi.
- source_word: וַיְרִיצֻהוּ
  choice: wakamtoa haraka
  rationale: Hii ni kausativi inayosisitiza kuharakishwa kwa Yosefu. Tafsiri hii inaonyesha kwamba wahudumu walimtoa akiwa na haraka bila kudai kwamba walimlazimisha kukimbia mwenyewe.
- source_word: מִן הַבּוֹר
  choice: shimoni
  rationale: בּוֹר kimsingi ni shimo, na katika muktadha huu ni mahali pa kifungo. 'Shimoni' huhifadhi taswira ya neno la Kiebrania na uhusiano wake na simulizi la awali.
- source_word: וַיְגַלַּח
  choice: akajinyoa
  rationale: Kitenzi ni cha kutenda na mhusika ni Yosefu. Kiswahili cha kawaida hutumia 'akajinyoa' kuonyesha kwa ufupi kwamba aliondoa nywele au ndevu zake kabla ya kufika kwa Farao, bila kubainisha alichonyoa ambacho maandishi hayakitaji.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: akabadilisha mavazi yake
  rationale: Hii inawakilisha moja kwa moja kubadili nguo zake kwa lugha ya sasa, ya heshima na inayoeleweka.
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: akaja kwa Farao
  rationale: '''Akaja kwa Farao'' hufuata kitenzi בוא na lengo lake bila kuongeza wazo lisilotajwa wazi la kuingia katika chumba au kusimama mbele ya kiti cha enzi.'
