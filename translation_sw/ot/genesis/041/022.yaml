base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: sw
  text: Kisha nikaona katika ndoto yangu, na tazama, masuke saba ya nafaka yakimea kwenye bua moja, yakiwa yamejaa na mazuri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Kisha nikaona
  rationale: Kitenzi cha mfululizo kinaendeleza simulizi la Farao; “Kisha nikaona” kinaonyesha ufuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: בַּחֲלֹמִי
  choice: katika ndoto yangu
  rationale: Huwakilisha moja kwa moja kihusishi, nomino, na kiambishi cha nafsi ya kwanza umoja.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Kinahifadhi uwasilishaji wa ghafla na msisitizo hai wa הִנֵּה bila kuufanya kuwa maelezo tambarare.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: masuke saba ya nafaka
  rationale: שִׁבֳּלִים hapa ni sehemu zenye punje juu ya mmea wa nafaka; “masuke ya nafaka” ni usemi wazi na wa kawaida katika Kiswahili.
- source_word: עֹלֹת
  choice: yakimea
  rationale: Umbo la participle linaonyesha tendo linaloonekana likiendelea; “yakimea” linafaa kwa picha ya masuke yanayotokea kwenye bua.
- source_word: בְּקָנֶה אֶחָד
  choice: kwenye bua moja
  rationale: קָנֶה katika muktadha wa nafaka ni bua; “kwenye” huhifadhi picha ya masuke yaliyojitokeza juu ya bua moja.
- source_word: מְלֵאֹת
  choice: yakiwa yamejaa
  rationale: Kinahifadhi maana ya msingi ya “kujaa,” ikidokeza masuke yaliyojaa punje bila kubadili kuwa “manono.”
- source_word: וְטֹבוֹת
  choice: na mazuri
  rationale: “Mazuri” huhifadhi upana wa maana ya טוֹב na kueleza ubora wa masuke bila kuongeza tafsiri maalumu kama “yenye afya.”
theological_decisions: []
