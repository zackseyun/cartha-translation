translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtiririko wa simulizi na urudiaji wa ‘mbele ya Farao’ bila kuongeza maelezo kuhusu kazi au kusudi la safari ya Yosefu.
