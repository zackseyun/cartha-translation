  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: sw
  text: Yosefu alikuwa na umri wa miaka thelathini aliposimama mbele ya Farao, mfalme wa Misri. Kisha Yosefu akaondoka kutoka mbele ya Farao, akazunguka katika nchi yote ya Misri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: alikuwa na umri wa miaka thelathini
  rationale: Nahau ya Kiebrania ya kutaja umri imetafsiriwa kwa Kiswahili cha kawaida bila uhalisia mgumu wa ‘mwana wa miaka thelathini’.
- source_word: בְּעָמְדוֹ
  choice: aliposimama
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaonyesha wakati Yosefu alipohudhuria mbele ya Farao.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii ni tafsiri fupi na ya kawaida ya uwepo wa mtu mbele ya mtawala, na inadumisha urudiaji wa neno hilo katika aya.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo hiki cha kifalme.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: mfalme wa Misri
  rationale: Kirai hiki kinamtambulisha Farao kwa cheo chake; koma hufanya uhusiano huo uwe wazi katika Kiswahili.
- source_word: וַיֵּצֵא
  choice: akaondoka
  rationale: Katika muktadha huu יצא inaonyesha kuondoka kwa Yosefu kutoka mbele ya Farao; ‘akaondoka’ ni ya asili zaidi kuliko tafsiri ya kimwili ‘akatoka’.
- source_word: מִלִּפְנֵי פַרְעֹה
  choice: mbele ya Farao
  rationale: Pamoja na kitenzi ‘akaondoka,’ kirai hiki huonyesha kuondoka katika uwepo wa Farao na kuhifadhi mwangwi wa לִפְנֵי iliyotangulia.
- source_word: וַיַּעְבֹר
  choice: akazunguka
  rationale: Kitenzi kinaeleza mwendo wa Yosefu kote nchini. ‘Akazunguka’ ni Kiswahili cha asili, lakini hakiingizi wazi kusudi la kiutawala ambalo halijasemwa katika aya.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Kirai hiki kinaonyesha kwamba mwendo wake ulihusisha nchi nzima ya Misri.
- source_word: וְ / וַ
  choice: Kisha / viambishi vya usimulizi aka-
  rationale: Mfuatano wa simulizi umeonyeshwa kwa ‘Kisha’ na maumbo ya aka-, badala ya kuongeza neno la wakati lisilokuwamo wazi katika chanzo.
