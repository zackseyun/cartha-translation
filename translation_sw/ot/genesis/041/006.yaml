  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: sw
  text: Na tazama, masuke saba membamba, yaliyokaushwa na upepo wa mashariki[a], yakichipuka baada yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yaliyopigwa na upepo wa mashariki.”
    reason: Mbadala huu unahifadhi maana ya kitenzi cha Kiebrania inayoweza kueleza masuke yaliyoharibiwa au kunyauka kwa kupigwa na upepo huo.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inadumisha kishiria hai cha simulizi kinacholeta ghafla picha mpya katika ndoto.
- source_word: שֶׁבַע
  choice: saba
  rationale: Ni tafsiri ya moja kwa moja ya namba ya msingi.
- source_word: שִׁבֳּלִים
  choice: masuke
  rationale: Neno hili humaanisha sehemu za mmea wa nafaka zenye punje, si mashina yote.
- source_word: דַּקּוֹת
  choice: membamba
  rationale: Linaonyesha masuke yaliyokuwa madogo au yasiyoshiba; ‘membamba’ ni la kawaida na linafaa picha ya kilimo.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: yaliyokaushwa na upepo wa mashariki
  rationale: Linaeleza athari ya upepo wa mashariki wenye joto na uharibifu; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: צֹמְחֹת
  choice: yakachipuka
  rationale: ‘Kuchipuka’ linaonyesha masuke yakitokea na kukua katika mfululizo wa matukio ya ndoto.
- source_word: אַחֲרֵיהֶן
  choice: baada yao
  rationale: Kiwakilishi kinarejelea masuke saba ya mstari uliotangulia na kinaweza kuonyesha kufuatana kwa wakati au nafasi.
