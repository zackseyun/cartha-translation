  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Na tazama’ inadumisha uhai wa simulizi bila kutumia lugha nzito kupita kiasi.
