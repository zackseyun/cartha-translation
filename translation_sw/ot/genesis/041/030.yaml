base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: sw
  text: Baada ya miaka hiyo, kutakuja miaka saba ya njaa. Wingi wote[a] katika nchi ya Misri utasahaulika, nayo njaa itaangamiza[b] nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tele yote.” Neno la Kiebrania humaanisha kushiba, tele, au wingi, hasa likilinganishwa na njaa.
    reason: lexical_alternative
  - marker: b
    text: Au “itaharibu nchi.” Kitenzi cha Kiebrania kinaweza kumaanisha kumaliza kabisa, kuteketeza, au kuharibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: itatokea
  rationale: Kitenzi cha Kiebrania kina maana ya kuinuka au kutokea; katika muktadha huu wa unabii, wakati ujao unaelezwa kwa Kiswahili cha kawaida.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: miaka saba ya njaa
  rationale: Hili ni tamko la kawaida na sahihi la Kiswahili kwa mfuatano wa nomino unaomaanisha miaka saba yenye njaa.
- source_word: אַחֲרֵיהֶן
  choice: baada ya miaka hiyo
  rationale: Kiwakilishi cha Kiebrania kinarejelea miaka saba iliyotangulia. Kutaja “miaka hiyo” huondoa utata wa kisarufi kwa njia ya asili bila kuongeza maana mpya.
- source_word: וְנִשְׁכַּח
  choice: itasahaulika
  rationale: Kauli ya kutendwa ya Kiswahili inalingana na muundo wa Nifali na kuonyesha kwamba tele ya awali haitakumbukwa tena.
- source_word: כָּל הַשָּׂבָע
  choice: tele yote
  rationale: שָׂבָע hueleza hali ya kushiba, kuwa na tele, au kuwa na wingi. “Tele yote” hudumisha maana pana na utofautishaji wake na njaa bila kuiwekea kikomo cha nafaka pekee.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii huhifadhi kikamilifu usemi wa kijiografia wa Kiebrania na ni ya kawaida katika Kiswahili sanifu.
- source_word: וְכִלָּה
  choice: itateketeza
  rationale: Katika muktadha huu, כלה huonyesha kuangamiza au kumaliza kabisa. “Itateketeza” huwasilisha athari kubwa ya njaa huku tanbihi ikihifadhi uwezekano wa “kuharibu.”
- source_word: הָרָעָב
  choice: njaa
  rationale: Nomino hii inarejelea njaa iliyotajwa tayari; Kiswahili hakihitaji kibainishi tofauti ili kuonyesha urejeo huo.
- source_word: אֶת הָאָרֶץ
  choice: nchi
  rationale: אָרֶץ hapa ni nchi au eneo la Misri lililotajwa katika kishazi kilichotangulia.
