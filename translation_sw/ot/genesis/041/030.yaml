translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zinasaidia usomaji wazi, huku “nayo” ikiunganisha kwa asili matokeo ya njaa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
