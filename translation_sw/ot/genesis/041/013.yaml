  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: sw
  text: 'Ikawa kama vile alivyotufasiria, ndivyo ilivyokuwa: mimi alinirejesha kwenye wadhifa wangu[a], lakini yeye alimtundika[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye nafasi yangu.” Nahau ya Kiebrania inamaanisha kurudishwa katika wadhifa rasmi aliokuwa nao hapo awali.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza kumaanisha kumtundika mtu au kuutundika mwili wake; hapa hakibainishi peke yake utaratibu kamili wa kifo.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְהִי ... כֵּן הָיָה
  choice: Ikawa ... ndivyo ilivyokuwa
  rationale: Muundo huu unahifadhi msisitizo wa kwamba mambo yalitokea sawasawa na tafsiri, huku ukisomeka kwa kawaida katika Kiswahili cha masimulizi.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Inaonyesha ulinganifu wa moja kwa moja kati ya tafsiri na yaliyotokea.
- source_word: פָּתַר לָנוּ
  choice: alivyotufasiria
  rationale: Katika muktadha wa ndoto, kitenzi hiki humaanisha kufasiri au kueleza maana ya ndoto.
- source_word: אֹתִי הֵשִׁיב
  choice: mimi akanirudisha
  rationale: Kiwakilishi huru “mimi” kinatangulizwa ili kudumisha msisitizo na utofautishaji wa Kiebrania kati ya hatima ya mnyweshaji na ya mwokaji.
- source_word: עַל כַּנִּי
  choice: kwenye wadhifa wangu
  rationale: Hii ni nahau inayorejelea kurejeshwa katika nafasi rasmi aliyokuwa nayo hapo awali; “wadhifa” ni wazi na wenye hadhi katika Kiswahili cha sasa.
- source_word: וְאֹתוֹ תָלָה
  choice: lakini yule mwingine akamtundika
  rationale: “Lakini” huonyesha tofauti kali ya matokeo, na “yule mwingine” huwasilisha utofautishaji wa kiwakilishi kilichotangulizwa katika Kiebrania. “Akamtundika” hudumisha maana ya msingi ya תלה bila kuamua zaidi ya ushahidi wa neno lenyewe.
theological_decisions:
- issue: Namna ya kifo kinachoonyeshwa na תלה
  choice: akamtundika
  alternative: akamuua kwa kumnyonga
  rationale: Kitenzi cha Kiebrania kinaweza kurejelea kutundika mtu au mwili wake, na hakielezi peke yake kwa uhakika utaratibu kamili wa kifo. Tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa masimulizi “Ikawa” na mfululizo wa “aka-” umetumiwa kwa mtiririko wa kawaida; utangulizaji wa “mimi” na usemi “yule mwingine” huhifadhi utofautishaji wa chanzo.
