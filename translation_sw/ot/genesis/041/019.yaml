translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Na tazama’ inadumisha msisitizo wa kisimulizi, huku maelezo ya ng’ombe yakitolewa kwa lugha ya sasa na ya asili.
