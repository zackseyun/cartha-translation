  text: וְ/הִנֵּ֞ה שֶֽׁבַע פָּר֤וֹת אֲחֵרוֹת֙ עֹל֣וֹת אַחֲרֵי/הֶ֔ן דַּלּ֨וֹת וְ/רָע֥וֹת תֹּ֛אַר מְאֹ֖ד וְ/רַקּ֣וֹת בָּשָׂ֑ר לֹֽא רָאִ֧יתִי כָ/הֵ֛נָּה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם לָ/רֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: sw
  text: Na tazama, ng’ombe wengine saba wakapanda baada yao; walikuwa dhaifu, wenye sura mbaya sana, na waliokonda mwili. Sikuwa nimewahi kuona ng’ombe kama hao katika nchi yote ya Misri kwa ubaya wao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwa ubaya.” Hapa usemi huo husisitiza jinsi walivyokuwa wabaya sana kwa sura na hali yao, si ubaya wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi kishazi cha kisimulizi kinacholeta kwa msisitizo sehemu inayofuata ya ndoto, kwa lugha ya Kibiblia iliyoeleweka katika Kiswahili cha sasa.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: ng’ombe wengine saba
  rationale: פָּרוֹת ni ng’ombe wa kike katika muktadha, lakini Kiswahili kwa kawaida hutumia ‘ng’ombe’ bila kulazimika kutaja jinsia; ‘wengine saba’ huonyesha kundi jingine tofauti.
- source_word: עֹל֣וֹת אַחֲרֵיהֶן
  choice: wakapanda baada yao
  rationale: ‘Wakapanda’ huhifadhi mwendo wa kutoka chini kwenda juu katika mandhari ya mto na kuendeleza simulizi la ndoto kwa ufasaha.
- source_word: דַּלּוֹת
  choice: walikuwa wamedhoofika
  rationale: Neno linaonyesha hali dhaifu na iliyodhoofika; tafsiri hii haitangulizi tu wembamba unaotajwa tena katika וְרַקּוֹת בָּשָׂר.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: wenye sura mbaya sana
  rationale: Hapa רָעוֹת haisemi ubaya wa kimaadili, bali mwonekano usiopendeza; ‘sura mbaya sana’ ni ya kawaida na sahihi.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: waliokonda mwili
  rationale: Hutoa maana ya kukonda kwa nyama/mwili kwa Kiswahili cha kawaida bila muundo mgumu wa tafsiri sisisi.
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: Sikuwa nimewahi kuona ng’ombe ... kama hao
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida kwamba Farao hakuwa ameona mfano wao hapo awali.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: katika nchi yote ya Misri
  rationale: Ni usemi wa kijiografia ulio wazi, wa kawaida, na unaolingana na wigo wa maandishi ya Kiebrania.
- source_word: לָרֹעַ
  choice: wenye hali mbaya kama hao
  rationale: Huhifadhi tathmini pana ya hali mbaya sana ya ng’ombe, ikijumuisha sura na udhaifu wao, bila kuifanya ionekane kama ubaya wa kimaadili.
