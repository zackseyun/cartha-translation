base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: sw
  text: Na tazama, ng’ombe saba walikuwa wakitoka katika Mto Nile[a], wenye miili imara[b] na maumbo mazuri, nao wakila mimea ya kinamasi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka mtoni”; katika muktadha huu wa Misri, neno la Kiebrania יְאֹר kwa kawaida humaanisha Mto Nile.
    reason: lexical_alternative
  - marker: b
    text: Au, “walionona” au “wenye nyama tele”; kwa halisi, Kiebrania kinaeleza kwamba walikuwa imara au wamejaa kimwili.
    reason: lexical_alternative
  - marker: c
    text: Au, “katikati ya matete” au “kwenye mimea ya eneo oevu”; neno la Kiebrania hurejelea mimea ya kinamasi kando ya Nile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi kiashiria hai cha simulizi kinachoelekeza fikira kwenye tukio jipya katika ndoto.
- source_word: מִן הַיְאֹר
  choice: kutoka Mto Nile
  rationale: Katika muktadha wa Misri, יְאֹר humaanisha hasa Mto Nile, ingawa neno lenyewe linaweza kutafsiriwa ‘mto.’
- source_word: עֹלֹת
  choice: walikuwa wakipanda
  rationale: Umbo la kitenzi shirikishi linaonyesha tendo lililokuwa likiendelea katika simulizi la ndoto.
- source_word: שֶׁבַע פָּרוֹת
  choice: ng’ombe saba
  rationale: פָּרוֹת ni ng’ombe wa kike; katika Kiswahili cha kawaida ‘ng’ombe’ hutosha bila kulazimisha usemi usio wa kawaida.
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: wenye miili yenye afya
  rationale: Inawasilisha hali ya kuwa imara au iliyojaa kimwili bila kuifupisha maana kuwa unene pekee.
- source_word: וִיפֹת תֹּאַר
  choice: sura nzuri
  rationale: Ni usemi wa asili na wenye heshima unaowasilisha uzuri wa umbo au mwonekano.
- source_word: וַתִּרְעֶינָה
  choice: nao wakalisha
  rationale: Kitenzi רעה hapa kinaeleza wanyama wakila mimea malishoni.
- source_word: בָּאָחוּ
  choice: majani ya kinamasi
  rationale: Neno hilo hurejelea mimea ya eneo oevu kando ya Nile; tafsiri hii huhifadhi mazingira hayo kuliko ‘malishoni’ kwa ujumla.
