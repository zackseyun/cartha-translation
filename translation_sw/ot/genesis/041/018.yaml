  naturalness: Marekebisho yanatumia «walikuwa wakitoka katika Mto Nile» kwa tendo linaloendelea katika ndoto, «wenye miili imara na maumbo mazuri» kwa Kiswahili sanifu cha asili, na «wakila mimea ya kinamasi» kwa maana ya wanyama wakila malishoni.
