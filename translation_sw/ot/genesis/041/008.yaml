  source_fidelity: 'Rasimu inafuata kwa karibu mfuatano na maana ya Kiebrania: msukosuko wa ndani wa Farao, kuitwa kwa waganga na wenye hekima wa Misri, na kiwakilishi cha wingi katika “kuzifasiri.” Hata hivyo, “akatuma watu” huongeza nomino isiyotajwa wazi katika matini, ingawa dhana ya kutuma imo katika kitenzi cha Kiebrania.'
