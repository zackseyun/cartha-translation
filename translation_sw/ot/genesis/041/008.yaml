    rationale: Kiebrania hurejelea Misri; “wenye hekima wa Misri” ni wazi na ya kawaida zaidi, bila kubadili maana.
  - severity: low
    issue: “Akawaeleza ndoto yake” si chaguo bora zaidi kwa וַיְסַפֵּר.
    rationale: Kitenzi hiki humaanisha kusimulia au kusimulia upya; “akawasimulia” huhifadhi tendo hilo kwa usahihi zaidi.
