base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: sw
  text: Asubuhi ilipofika, roho yake ikafadhaika. Basi akatuma kuwaita waganga wote wa Misri na wenye hekima wa Misri wote. Farao akawasimulia ndoto yake, lakini hapakuwa na mtu wa kuzifasiri[a] kwa Farao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuzifasiri.” Ingawa nomino iliyotangulia ni ya umoja (“ndoto yake”), kiwakilishi cha wingi huenda kinarejelea sehemu mbalimbali za ndoto hiyo au tajriba ya ndoto kwa maana ya jumla. Tafsiri nyingine hulainisha usemi huu kuwa “kuifasiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Asubuhi ilipofika
  rationale: Ni kishazi cha wakati cha Kiswahili kinachoendeleza mtiririko wa simulizi kwa kawaida.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: roho yake ikafadhaika
  rationale: Neno 'roho' linahifadhi רוּחַ, huku 'ikafadhaika' likieleza msukosuko wa ndani unaodokezwa na kitenzi פעמ.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: akatuma watu wawaite
  rationale: Kiswahili hiki kinaeleza kwa kawaida kwamba Farao alituma wajumbe ili kuwaita, huku kikihifadhi hatua zote mbili za Kiebrania.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: waganga wote wa Misri
  rationale: Katika muktadha wa Misri, neno hilo linawahusu wataalamu wa kifalme wa mambo ya siri, ibada na ufasiri wa ndoto; 'waganga' ni neno fupi na linaloeleweka bila kuwafanya kuwa madaktari wa kawaida.
- source_word: כָּל חֲכָמֶיהָ
  choice: wenye hekima wake wote
  rationale: Kiambishi 'wake' kinamrejelea Misri kama ilivyo katika Kiebrania, na 'wenye hekima' linawatofautisha na waganga waliotajwa kwanza.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: Farao akawaeleza ndoto yake
  rationale: Kiebrania cha Kim Masora kina nomino ya umoja, 'ndoto yake'; tafsiri inaihifadhi badala ya kuibadili kimya kuwa wingi.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: lakini hakukuwa na mtu wa kuzifasiri kwa Farao
  rationale: Kiambishi cha wingi 'zi-' kinawakilisha kiwakilishi cha wingi אֹתָם, na 'kwa Farao' kinahifadhi uhusiano unaoonyeshwa na לְפַרְעֹה.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Utofauti wa kisarufi kati ya 'ndoto yake' na 'kuzifasiri' umehifadhiwa kwa makusudi na kufafanuliwa katika tanbihi.
