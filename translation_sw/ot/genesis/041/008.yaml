  to: Asubuhi ilipofika, roho yake ikafadhaika. Basi akatuma kuwaita waganga wote wa Misri na wenye hekima wa Misri wote. Farao akawasimulia ndoto yake, lakini hapakuwa na mtu wa kuzifasiri[a] kwa Farao.
