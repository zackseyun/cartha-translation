base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: sw
  text: Na kuhusu ndoto hiyo kurudiwa kwa Farao mara mbili, ni kwa sababu jambo hilo limewekwa imara na Mungu[a], naye Mungu anaharakisha kulitekeleza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hilo limehakikishwa na Mungu,” au “jambo hilo ni hakika kutoka kwa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mungu atalifanya upesi,” au “Mungu yu karibu kulitekeleza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Na kuhusu
  rationale: Kifungu hiki kinaanzisha maelezo kuhusu sababu ya ndoto kurudiwa; “Na kuhusu” ni Kiswahili cha kawaida kinachohifadhi kazi hiyo ya kiusemi.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: ndoto hiyo kurudiwa
  rationale: Huhifadhi maana ya kutendwa ya kitenzi na kurejelea ndoto ambayo tayari imesimuliwa.
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: mara mbili kwa Farao
  rationale: “Mara mbili” huonyesha umbo la uwili, na “kwa Farao” ni njia ya asili ya kusema kwamba Farao ndiye aliyepewa ndoto hiyo iliyorudiwa.
- source_word: נָכוֹן הַדָּבָר
  choice: jambo hilo limeamuliwa kwa uthabiti
  rationale: נָכוֹן huonyesha kwamba jambo limesimamishwa kwa hakika na haliko katika hali ya kubadilika; tafsiri hii inahifadhi uthabiti pamoja na uamuzi unaodokezwa katika muktadha.
- source_word: מֵעִם הָאֱלֹהִים
  choice: na Mungu
  rationale: Katika muundo wa Kiswahili, “na Mungu” huonyesha Mungu kuwa chanzo na mtendaji wa uamuzi huo bila kulazimisha usemi usio wa kawaida wa “kutoka kwa Mungu.”
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: naye Mungu anafanya haraka
  rationale: Huhifadhi hali ya kitenzi cha wakati unaoendelea katika Kiebrania na maana ya tendo lililo karibu kutimizwa.
- source_word: לַעֲשֹׂתוֹ
  choice: kulitekeleza
  rationale: Kiwakilishi kinarejelea jambo lililotangazwa; “kulitekeleza” ni cha asili zaidi kuliko “kulifanya” na huonyesha kulitimiza jambo hilo bila kuongeza maelezo ya kiteolojia.
theological_decisions:
- issue: Maana ya הָאֱלֹהִים katika maelezo ya Yosefu
  choice: Mungu
  alternative: miungu
  rationale: Ingawa אֱלֹהִים lina umbo la wingi kimofolojia, sintaksia na muktadha humrejelea Mungu mmoja anayefunua na kutekeleza jambo hilo.
- issue: Uhusiano wa Mungu na jambo lililotangazwa
  choice: limeamuliwa kwa uthabiti na Mungu
  alternative: ni hakika kutoka kwa Mungu
  rationale: Tafsiri kuu inaonyesha kwamba uthabiti wa jambo unatokana na uamuzi wa Mungu, huku tanbihi ikihifadhi uwezekano wa kusisitiza chanzo au uhakika bila kuficha tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unafuata hoja ya Kiebrania huku ukiepuka tafsiri ya neno kwa neno isiyo ya kawaida katika Kiswahili.
