base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: sw
  text: Jambo hilo likawa jema machoni pa Farao na machoni pa watumishi wake wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo hilo liliwapendeza Farao na watumishi wake wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב
  choice: likawa jema
  rationale: Katika muundo huu pamoja na בְּעֵינֵי, kitenzi יטב huonyesha kuwa jambo lilikubaliwa au lilionekana kuwa jema. “Likawa jema” huhifadhi umbo na tathmini ya Kiebrania bila kubadili jambo lenyewe kuwa mtendaji.
- source_word: הַדָּבָר
  choice: jambo hilo
  rationale: דָּבָר ni neno pana linaloweza kumaanisha jambo, neno, au shauri. “Jambo hilo” hurejelea kwa kawaida ushauri wa Yosefu uliotangulia bila kulibana neno kuwa “pendekezo” pekee.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: “Machoni pa” ni nahau ya Kiswahili inayoeleweka na huhifadhi taswira na urudiaji wa Kiebrania.
- source_word: פַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: כָּל עֲבָדָיו
  choice: watumishi wake wote
  rationale: עֲבָדִים inaweza kutaja watumishi, watumwa, au maofisa. Katika mazingira ya ikulu, “watumishi” huhifadhi upana wa neno bila kulifanya liwe “maofisa” tu wala kusisitiza hali ya utumwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “machoni pa” umehifadhiwa ili kuakisi sambamba ya Kiebrania; tanbihi inatoa usemi wa Kiswahili ulio wa moja kwa moja zaidi.
