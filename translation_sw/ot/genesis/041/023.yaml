lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kisha tazama
  rationale: ‘Tazama’ huhifadhi msisitizo wa ghafla na uhai wa simulizi la ndoto; ‘kisha’ huunganisha jambo hili na tukio lililotangulia.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: masuke mengine saba
  rationale: שִׁבֳּלִים ni masuke ya nafaka, si mashina yote. ‘Mengine’ linaeleweka kutokana na אַחֲרֵיהֶם na mfululizo wa ndoto, ingawa halijasemwa kama neno tofauti mwanzoni mwa Kiebrania.
- source_word: צְנֻמוֹת
  choice: yaliyosinyaa
  rationale: Neno hili adimu linaonyesha masuke yaliyokunjamana au kudhoofika; ‘yaliyosinyaa’ hulitofautisha na דַּקּוֹת badala ya kuunganisha sifa hizo mbili.
- source_word: דַּקּוֹת
  choice: membamba
  rationale: Hutoa maana ya kuwa membamba au hafifu na huhifadhi sifa ya pili tofauti katika mlolongo wa Kiebrania.
- source_word: שְׁדֻפוֹת קָדִים
  choice: yaliyoungua kwa upepo wa mashariki
  rationale: Kirai kinaeleza uharibifu wa nafaka unaosababishwa na upepo wa mashariki wenye joto na ukavu. ‘Yaliyoungua’ ni lugha wazi na ya kawaida bila kudai kwamba yaliteketezwa kwa moto.
- source_word: צֹמְחוֹת
  choice: yakamea
  rationale: Kitenzi kinaonyesha masuke yakichipuka au kukua katika mandhari ya ndoto; ‘yakamea’ ni usemi wa kawaida wa kilimo.
- source_word: אַחֲרֵיהֶם
  choice: baada ya yale
  rationale: Hurejelea masuke saba yaliyotangulia na kuhifadhi wazo la kutokea kwa kufuatana.
