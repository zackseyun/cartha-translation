base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: sw
  text: Kabla ya mwaka wa njaa kufika[a], Asenathi, binti ya Potifera, kuhani wa On[b], alimzalia Yosefu wana wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “mwaka wa njaa” katika umoja hapa, kikirejelea mwanzo wa kipindi cha njaa.
    reason: lexical_alternative
  - marker: b
    text: On ulikuwa mji wa Misri, ambao baadaye uliitwa Heliopoli kwa Kigiriki.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד
  choice: alizaliwa
  rationale: Hii ni kauli tendwa ya ילד. Kiswahili cha kawaida hutumia umoja pamoja na mtendewa Yosefu katika muundo ‘alizaliwa wana wawili,’ badala ya muundo mzito wa ‘wana wawili walizaliwa kwake.’
- source_word: וּ/לְ/יוֹסֵף
  choice: Yosefu alizaliwa
  rationale: Herufi lamed inaonyesha uhusiano wa mzazi katika usemi wa kuzaliwa; muundo huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: בְּ/טֶרֶם
  choice: Kabla ... haujafika
  rationale: Muundo huu unaonyesha wazi kwamba kuzaliwa kulitokea kabla ya kufika kwa mwaka wa njaa.
- source_word: תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב
  choice: mwaka wa njaa haujafika
  rationale: Unahifadhi nomino ya umoja ‘mwaka’ na taswira ya kufika, huku ukirejelea mwanzo wa kipindi cha njaa.
- source_word: שְׁנֵי בָנִים
  choice: wana wawili
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa watoto wawili wa kiume katika muktadha wa ukoo.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: ambao ... alimzalia
  rationale: ‘Ambao’ inawarejelea wana wawili, na ‘alimzalia’ huhifadhi wazo la Asenathi kumzalia Yosefu bila utata.
- source_word: אָֽסְנַת
  choice: Asenathi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בַּת פּ֥וֹטִי פֶ֖רַע
  choice: binti ya Potifera
  rationale: Muundo wa Kiebrania unamtambulisha Asenathi kwa jina la baba yake; ‘binti ya’ ni Kiswahili sanifu na cha kawaida.
- source_word: כֹּהֵן אֽוֹן
  choice: kuhani wa Oni
  rationale: כֹּהֵן ni ‘kuhani’; Oni ni jina la mahali lililotoholewa kwa mfumo wa sauti wa Kiswahili.
