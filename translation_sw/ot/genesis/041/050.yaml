  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa Kiebrania kwa karibu, lakini imetumia muundo wa kawaida wa Kiswahili ‘Yosefu alizaliwa wana wawili.’ Alama zote za tanbihi zimewekwa katika matini.
