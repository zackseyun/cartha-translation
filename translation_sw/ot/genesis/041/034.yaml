  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: sw
  text: 'Farao na afanye hivi: ateue wasimamizi juu ya nchi, na aichukue sehemu ya tano ya mazao ya nchi ya Misri katika ile miaka saba ya mavuno mengi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aikusanye sehemu ya tano kutoka katika nchi ya Misri.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa kutoza au kuchukua fungu la tano wakati wa miaka ya mavuno mengi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: Farao na afanye hivi
  rationale: Kauli hii inawasilisha ushauri wa Yusufu kwa namna ya agizo la upole; neno “hivi” linaonyesha hatua zinazofuata katika muktadha.
- source_word: וְיַפְקֵד
  choice: ateue
  rationale: Hifili ya פקד hapa ina maana ya kuwaweka watu rasmi katika wajibu wa kiutawala.
- source_word: פְּקִדִים
  choice: wasimamizi
  rationale: Neno hili linaonyesha maofisa waliokabidhiwa jukumu la kusimamia; “wasimamizi” ni wazi na la kawaida katika Kiswahili cha sasa.
- source_word: עַל הָאָרֶץ
  choice: juu ya nchi
  rationale: Inahifadhi maana ya mamlaka ya kiutawala juu ya eneo la Misri, si dunia yote.
- source_word: וְחִמֵּשׁ
  choice: wakusanye sehemu ya tano
  rationale: Pieli ya חמשׁ inaelekea kumaanisha kutoza au kukusanya fungu la tano; umbo la wingi linawahusisha wasimamizi waliotajwa, huku Farao akiwa mwenye kuagiza mpango huo.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: ya mazao ya nchi ya Misri
  rationale: “Mazao” limeongezwa kwa uwazi wa kimuktadha ili kuepuka dhana kwamba sehemu ya ardhi yenyewe inachukuliwa.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: katika ile miaka saba ya mavuno mengi
  rationale: שׂבע inaashiria wingi au kushiba; katika simulizi hili inahusu hasa wingi wa mavuno.
