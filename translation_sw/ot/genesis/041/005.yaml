  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: sw
  text: Kisha akalala, akaota ndoto mara ya pili. Tazama, masuke saba ya nafaka[a] yalikuwa yakimea katika bua moja, yamejaa[b] na mazuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vichwa saba vya nafaka.” Neno la Kiebrania linaweza kumaanisha sehemu ya mmea wa nafaka inayobeba punje, yaani suke au kichwa cha nafaka.
    reason: lexical_alternative
  - marker: b
    text: Au “yenye afya” au “manono.” Kivumishi cha kwanza kinaeleza kwamba masuke hayo yalikuwa yamejaa punje vizuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: Kisha akalala
  rationale: Kitenzi cha mfululizo wa simulizi kinaendeleza tukio; “Kisha” huonyesha mp क्रम wa matukio kwa Kiswahili cha kawaida huku “akalala” ikihifadhi maana rahisi ya kulala.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: akaota ndoto mara ya pili
  rationale: שֵׁנִית ina maana ya kutendeka mara ya pili. Kauli hii ni ya asili katika Kiswahili na inadumisha tofauti na usemi mpana zaidi wa “akaota tena.”
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: הִנֵּה huwasilisha jambo kwa uhai ndani ya ndoto. “Tazama” huhifadhi nguvu hiyo ya kisemwa bila kuifanya taarifa kuwa tambarare.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: masuke saba ya nafaka
  rationale: שִׁבֳּלִים ni sehemu za juu za mimea ya nafaka zinazobeba punje. “Masuke ya nafaka” ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: עֹלֹת
  choice: yalikuwa yakimea
  rationale: Umbo la participle linaonyesha tendo linaloendelea au tukio linaloonekana kwa uhai. “Yalikuwa yakimea” hudumisha hali hiyo endelevu.
- source_word: בְּקָנֶה אֶחָד
  choice: kwenye bua moja
  rationale: קָנֶה hapa ni bua au shina la mmea. “Kwenye bua moja” ni usemi wa asili unaoonyesha masuke mengi yakitokea kwenye bua moja.
- source_word: בְּרִיאוֹת
  choice: yamejaa
  rationale: Kivumishi hiki huonyesha unene, afya, au kujaa vizuri. Kwa masuke ya nafaka, “yamejaa” hueleza kwa kawaida kwamba yana punje zilizojaa vizuri.
- source_word: וְטֹבוֹת
  choice: na mazuri
  rationale: טוֹב ni neno pana lenye maana ya uzuri au ubora. “Mazuri” huhifadhi tathmini hiyo ya jumla bila kuibana kwa maana maalumu zaidi.
