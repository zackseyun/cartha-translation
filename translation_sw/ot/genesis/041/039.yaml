  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: sw
  text: Ndipo Farao akamwambia Yosefu, “Kwa kuwa[a] Mungu amekujulisha haya yote, hakuna mtu mwenye ufahamu na hekima kama wewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya Mungu kukujulisha haya yote.” Kihusishi cha Kiebrania kinaweza kutafsiriwa rasmi zaidi kuwa “baada ya,” ingawa hapa kinaonyesha pia msingi wa hitimisho la Farao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw ya usimulizi inaendeleza mfululizo wa matukio; “Ndipo” pamoja na kitenzi cha -ka- huleta mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: אַחֲרֵי
  choice: Kwa kuwa
  rationale: Ingawa maana ya msingi ni “baada ya,” hapa kirai kinaonyesha msingi wa hitimisho la Farao. “Kwa kuwa” huwasilisha nguvu hiyo ya kisababu kwa Kiswahili cha kawaida bila kuficha uwezekano wa tafsiri rasmi zaidi.
- source_word: הוֹדִיעַ
  choice: amekujulisha
  rationale: Hifili ya ידע ina maana ya kusababisha mtu ajue au kumjulisha; “amekujulisha” ni ya asili na huhifadhi maana ya kisababishi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Muundo wa kitenzi na muktadha unaonyesha mrejelewa wa umoja; “Mungu” ndiyo tafsiri inayofaa hapa.
- source_word: אֶת כָּל זֹאת
  choice: haya yote
  rationale: Kirai hiki kinarejelea jambo lote ambalo Yosefu amelifasiri na kulieleza; “haya yote” ni kifupi na cha kawaida.
- source_word: אֵין
  choice: hakuna mtu
  rationale: Hutafsiri ukanushi wa uwepo kwa Kiswahili cha sasa na kuweka wazi kwamba linganisho linawahusu watu.
- source_word: נָבוֹן
  choice: mwenye ufahamu
  rationale: Neno linaonyesha uwezo wa kuelewa na kutambua mambo kwa kina, unaolingana na uwezo ambao Yosefu ameonyesha.
- source_word: וְחָכָם
  choice: na hekima
  rationale: Huhifadhi jozi ya sifa mbili—ufahamu na hekima—kwa lugha ya kawaida na yenye heshima.
- source_word: כָּמוֹךָ
  choice: kama wewe
  rationale: Hili ni linganisho la kawaida na la wazi katika Kiswahili baada ya “hakuna mtu.”
theological_decisions:
- issue: Mrejelewa wa אֱלֹהִים katika maneno ya Farao
  choice: Mungu
  alternative: miungu
  rationale: Ingawa אֱלֹהִים inaweza kuwa na umbo la wingi katika miktadha mingine, hapa kitenzi na muktadha humwonyesha Farao akimtaja yule Mungu aliyemfunulia Yosefu maana ya ndoto. Umoja “Mungu” unaakisi matumizi ya Kiebrania hapa bila kuongeza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo “mwenye ufahamu na hekima” ni wa kawaida kuliko vivumishi vizito, huku ukiendeleza tofauti kati ya נָבוֹן na חָכָם.
