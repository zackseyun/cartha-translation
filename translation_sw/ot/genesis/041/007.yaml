  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa urahisi. ‘Masuke’ limetumiwa kwa usahihi wa kilimo; ‘kumbe’ linatoa nguvu ya וְהִנֵּה kwa njia ya asili kuliko ‘tazama’ katika sentensi hii.
