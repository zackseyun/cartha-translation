  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: sw
  text: Na yale masuke membamba yakayameza yale masuke saba manono na yaliyojaa. Ndipo Farao akaamka, na kumbe ilikuwa ndoto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: yakayameza
  rationale: Kitenzi בלע humaanisha ‘meza’; ‘yakayameza’ kinahifadhi picha hai na isiyo ya kawaida ya ndoto bila kuongeza wazo la kurarua au kushambulia.
- source_word: הַשִּׁבֳּלִים
  choice: masuke
  rationale: Katika muktadha huu שִׁבֹּלֶת ni kichwa cha mmea wa nafaka chenye punje, si bua lote; ‘masuke’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: הַדַּקּוֹת
  choice: membamba
  rationale: Kivumishi hiki humaanisha membamba au hafifu; ‘membamba’ kinaeleza moja kwa moja hali ya masuke.
- source_word: שֶׁבַע
  choice: saba
  rationale: Ni tafsiri ya moja kwa moja ya namba ya Kiebrania.
- source_word: הַבְּרִיאוֹת
  choice: mazuri
  rationale: Kivumishi kinaweza kuonyesha hali yenye afya, iliyonawiri, au nono. Kwa masuke, ‘mazuri’ ni ya asili na kinaacha upana wa maana bila kutumia ‘yenye afya,’ ambayo si kawaida sana kwa nafaka.
- source_word: וְהַמְּלֵאוֹת
  choice: na yaliyojaa
  rationale: Kinatokana na מלא, ‘jaa’; usemi huu unaonyesha kuwa masuke yalikuwa yamejaa nafaka bila kubadili maana kuwa ‘yaliyoiva.’
- source_word: וַיִּיקַץ
  choice: akaamka
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoeleza kuamka usingizini.
- source_word: וְהִנֵּה
  choice: na kumbe
  rationale: הִנֵּה huvuta fikira kwenye ugunduzi wa ghafla. ‘Kumbe’ huwasilisha kwa Kiswahili cha asili mshangao au utambuzi wa Farao alipoamka.
- source_word: חֲלוֹם
  choice: ilikuwa ndoto
  rationale: Kiebrania kinasema kwa ufupi ‘na tazama, ndoto.’ Kiswahili huhitaji kishazi chenye kiunganishi hapa; ‘ilikuwa ndoto’ kinatoa maana kwa uwazi huku kikihifadhi ufupi.
