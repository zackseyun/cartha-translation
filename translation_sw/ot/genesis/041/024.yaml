translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida; “masuke,” “membamba,” na “yakayameza” huhifadhi picha halisi ya ndoto. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
