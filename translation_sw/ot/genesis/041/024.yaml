base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: sw
  text: Na yale masuke membamba yakayameza yale masuke saba mazuri[a]. Kisha nikawaambia wale wataalamu wa mambo ya siri[b], lakini hakuna aliyeweza kunieleza maana yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vichwa vya nafaka.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linamaanisha wataalamu wa Misri wa ibada, mambo ya siri, au kufasiri ndoto; pia linaweza kutafsiriwa “wachawi.”
    reason: cultural_note
  - marker: c
    text: Au, “hakuna aliyeweza kunifasiria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: yakayameza
  rationale: Kitenzi בלע kinaonyesha kwa picha kwamba masuke membamba yaliyal吞? Masuke mengine; “yakayameza” ni Kiswahili cha kawaida na chenye nguvu kinachohifadhi picha ya ndoto.
- source_word: שִׁבֳּלִים
  choice: masuke
  rationale: Katika muktadha wa nafaka, שִׁבֳּלִים ni masuke, yaani sehemu za mmea zinazobeba punje. Neno hili ni sahihi na la kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: הַדַּקֹּת
  choice: membamba
  rationale: דק hapa hueleza masuke yaliyo membamba au yaliyodhoofika. “Membamba” hudumisha maana ya msingi bila kuongeza sifa isiyotajwa wazi.
- source_word: הַטֹּבוֹת
  choice: mazuri
  rationale: טוב ni “nzuri.” Katika muktadha huo inaweza kudokeza masuke yenye afya au yaliyojaa, lakini “mazuri” hubaki karibu na Kiebrania.
- source_word: וָאֹמַר אֶל הַחַרְטֻמִּים
  choice: Kisha nikawaambia wale wataalamu wa mambo ya siri
  rationale: Kiebrania kinasema kihalisi kwamba Farao alisema kwa wataalamu hao; muktadha unaonyesha aliwasimulia ndoto. “Nikawaambia” ni ya asili na haisukumii ndani kiwakilishi kisichotajwa.
- source_word: הַחַרְטֻמִּים
  choice: wataalamu wa mambo ya siri
  rationale: Neno hili linawataja wataalamu wa Misri wa ibada, ishara, na kufasiri ndoto. Chaguo hili huepuka dhana ya watumbuizaji wa jukwaani inayoweza kuambatana na “wachawi.”
- source_word: וְאֵין מַגִּיד לִי
  choice: lakini hakuna aliyeweza kunieleza maana yake
  rationale: Katika muktadha wa ndoto, נגד humaanisha kuifanya maana ijulikane. “Kunieleza maana yake” huwasilisha kazi ya kufasiri, huku “aliyeweza” ikionyesha kwa kawaida kwamba hakuna aliyetoa maelezo.
