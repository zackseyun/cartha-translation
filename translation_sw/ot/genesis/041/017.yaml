  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: sw
  text: Ndipo Farao akamwambia Yosefu, “Katika ndoto yangu, tazama, nilikuwa nimesimama ukingoni mwa Mto Naili.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mto.” Katika mazingira ya Misri katika kitabu cha Mwanzo, neno hili kwa kawaida humaanisha Mto Naili.'
