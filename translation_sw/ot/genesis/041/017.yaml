lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akamwambia
  rationale: Katika simulizi lenye maneno ya moja kwa moja, ‘akamwambia’ ni Kiswahili cha kawaida kinachoonyesha tendo la kusema na anayelengwa.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: בַּחֲלֹמִי
  choice: Katika ndoto yangu
  rationale: Tafsiri hii huonyesha wazi kihusishi na kiambishi cha nafsi ya kwanza katika Kiebrania.
- source_word: הִנְנִי
  choice: tazama, nilikuwa
  rationale: ‘Tazama’ huhifadhi msisitizo na uhai wa chembe ya uwasilishaji, huku wakati uliopita ukifaa kwa Farao anaposimulia ndoto yake.
- source_word: עֹמֵד
  choice: nimesimama
  rationale: Hueleza hali ya kuwa katika mkao wa kusimama na kuungana kwa kawaida na ‘nilikuwa’ katika taarifa ya ndoto.
- source_word: עַל שְׂפַת
  choice: ukingoni mwa
  rationale: Ingawa שְׂפַת kimsingi ni ‘mdomo’ au ‘ukingo,’ katika muktadha wa mto humaanisha ukingo wa mto; muundo huu ni wa kawaida katika Kiswahili.
- source_word: הַיְאֹר
  choice: Mto Naili
  rationale: Katika mazingira ya Misri kwenye Mwanzo, neno hili kwa kawaida humrejelea Naili; tafsiri ya wazi inaambatanishwa na tanbihi inayohifadhi maana yake ya moja kwa moja, ‘mto.’
