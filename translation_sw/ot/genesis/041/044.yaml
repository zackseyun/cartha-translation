  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: sw
  text: Kisha Farao akamwambia Yosefu, “Mimi ni Farao, na bila wewe hakuna mtu atakayeinua mkono wake wala mguu wake katika nchi yote ya Misri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Mfuatano wa vitenzi unasogeza simulizi mbele; “Kisha” na “akamwambia” ni mtiririko wa kawaida wa Kiswahili na vinaonyesha mlengwa wa kauli.
- source_word: אֲנִי פַרְעֹה
  choice: Mimi ni Farao
  rationale: Huhifadhi tamko la moja kwa moja na lenye mkazo la mamlaka ya Farao bila kuongeza maana isiyosemwa wazi.
- source_word: וּבִלְעָדֶיךָ
  choice: bila ruhusa yako
  rationale: Katika muktadha wa kumkabidhi Yosefu mamlaka, neno hili linaonyesha kuwa hakuna mtu anayeweza kutenda bila idhini yake. Tafsiri hii ni ya asili katika Kiswahili na inaweka wazi maana ya kiutawala.
- source_word: לֹא יָרִים
  choice: hakuna mtu atakayeinua
  rationale: Huhifadhi taswira halisi ya kitenzi ‘kuinua’ na nguvu ya agizo la Farao.
- source_word: אִישׁ
  choice: mtu
  rationale: Hapa nomino ya Kiebrania ina maana ya jumla; “mtu” ni Kiswahili cha kawaida kinachowahusu watu wote bila kubadili maana.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: mkono wake wala mguu wake
  rationale: “Wala” linafaa katika tungo hasi ya Kiswahili, huku taswira ya Kiebrania ya mkono na mguu ikihifadhiwa.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Ni usemi wa asili na wenye heshima unaowasilisha eneo lote la Misri kwa ukaribu na maandishi ya chanzo.
theological_decisions:
- issue: Kiwango cha mamlaka ya Yosefu chini ya Farao
  choice: bila ruhusa yako
  alternative: bila wewe
  rationale: Muktadha unaonyesha mamlaka yaliyokabidhiwa Yosefu, lakini tamko “Mimi ni Farao” linaendelea kuhifadhi ukuu wa Farao; tafsiri haimfanyi Yosefu kuwa huru na Farao wala kulainisha mamlaka aliyopewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Nahau ya Kiebrania imehifadhiwa kwa taswira ya ‘kuinua mkono wala mguu,’ huku ‘bila ruhusa yako’ ikifanya maana ya mamlaka iwe wazi katika Kiswahili.
