base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: sw
  text: Farao akampandisha Yosefu katika gari la pili alilokuwa nalo, nao wakapaza sauti mbele yake, “Abrek!”[a] Naye akamweka kuwa mtawala juu ya nchi yote ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Abrek” ni neno gumu lenye maana isiyo hakika; huenda ni mwito wa Kimisri au wa Kiebrania. Wengi hulielewa kuwa na maana inayokaribia, “Pigeni magoti!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: akampandisha
  rationale: Hifili ya רכב ina maana ya kusababisha mtu apande. “Akampandisha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya usababishaji; jina “Farao” limetumiwa kufafanua kiima kinachoeleweka kutokana na muktadha.
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: katika gari lake la pili
  rationale: מִשְׁנֶה huonyesha nafasi ya pili. Kauli hii inaeleweka kwa kawaida kuwa gari la Farao lililofuata lake kuu kwa cheo; tafsiri hii ni ya asili na fupi katika Kiswahili.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: nao wakapaza sauti mbele yake
  rationale: קרא hapa ni mwito wa hadhara uliotolewa mbele ya msafara wa Yosefu. “Wakapaza sauti” huwasilisha mwito huo wa wazi bila kuamua zaidi yaliyomo.
- source_word: אַבְרֵךְ
  choice: Abrek
  rationale: Neno hili lina maana isiyo hakika na huenda ni neno la Kimisri au mwito maalumu. Kulitohoa kwa herufi kunahifadhi utata wa maandishi badala ya kulazimisha maana moja.
- source_word: וְנָתוֹן אֹתוֹ
  choice: Hivyo akamweka kuwa mtawala
  rationale: Muundo huu unaonyesha matokeo ya kumtukuza Yosefu na kumweka katika mamlaka. “Akamweka kuwa mtawala” huweka wazi kazi ya עַל katika muktadha bila kudai cheo mahususi kisichotajwa.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: juu ya nchi yote ya Misri
  rationale: עַל huonyesha mamlaka juu ya eneo lote, huku אֶרֶץ ikihifadhiwa kwa “nchi.”
