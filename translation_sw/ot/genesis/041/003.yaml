translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Na tazama’ inadumisha msisitizo wa ghafla wa ndoto, na ‘Mto Nile’ hutaja rejeleo la mazingira ya Misri waziwazi.
