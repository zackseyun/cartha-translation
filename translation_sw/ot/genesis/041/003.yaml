base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: sw
  text: Na tazama,[a] ng’ombe wengine saba wakatoka katika Mto Nile baada yao, wenye sura mbaya na miili myembamba;[b] wakasimama kando ya wale ng’ombe ukingoni mwa Mto Nile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno linalovuta uangalifu kwenye jambo la kushangaza linaloonekana katika ndoto.
    reason: discourse_marker
  - marker: b
    text: Au, “wenye mwonekano mbaya na waliokonda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi nguvu ya kishangao na uelekezaji wa simulizi, huku ikiwa lugha ya heshima na inayoeleweka.
- source_word: פָּרוֹת
  choice: ng’ombe
  rationale: Katika Kiswahili nomino hii hutumiwa kwa wanyama hawa bila kuhitaji kutaja jinsia; muktadha unaonyesha kuwa ni ng’ombe wa kike.
- source_word: אֲחֵרוֹת
  choice: wengine
  rationale: Inaonyesha kwa kawaida kundi la pili lililo tofauti na ng’ombe saba wa kwanza.
- source_word: עֹלוֹת
  choice: wakapanda
  rationale: Inaakisi mwendo wa kutoka ndani ya mto kwenda juu, na mfuatano wa simulizi unaonyeshwa kwa kiambishi -ka-.
- source_word: אַחֲרֵיהֶן
  choice: baada yao
  rationale: Maana ya mfuatano wa wakati inafaa zaidi katika mpangilio wa ndoto kuliko maana ya mahali ya ‘nyuma yao.’
- source_word: הַיְאֹר
  choice: Mto Nile
  rationale: Katika mazingira ya Kimisri, neno hili linarejelea Nile; kulitaja wazi kunamwezesha msomaji wa sasa kutambua mahali.
- source_word: רָעוֹת מַרְאֶה
  choice: wabaya kwa sura
  rationale: Inahifadhi kwa ukaribu usemi wa Kiebrania kuhusu mwonekano mbaya bila kudokeza ubaya wa kimaadili.
- source_word: דַקּוֹת בָּשָׂר
  choice: wembamba wa mwili
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi picha ya kukonda kimwili iliyomo katika Kiebrania.
- source_word: וַתַּעֲמֹדְנָה
  choice: wak...simama
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo katika simulizi.
- source_word: אֵצֶל
  choice: kando ya
  rationale: Inaonyesha ukaribu wao na kundi la kwanza kwa lugha ya kawaida.
- source_word: שְׂפַת
  choice: ukingoni
  rationale: Katika muktadha wa mto, ‘ukingo’ ni neno la kawaida linalolingana na ukingo wa maji.
