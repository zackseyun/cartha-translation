base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/053.yaml
  text: Then the seven years of abundance that had been in the land of Egypt came to an end.
translation:
  language: sw
  text: Ndipo ile miaka saba ya wingi katika nchi ya Misri ikaisha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: ikaisha
  rationale: Kitenzi כלה katika wayyiqtol kinaonyesha kufikia mwisho. Kiswahili hutumia upatanisho wa umoja kwa kirai chenye kichwa “miaka,” hivyo “ikaisha” ni ya kawaida na sahihi.
- source_word: שֶׁבַע
  choice: saba
  rationale: Ni namba ya msingi inayobainisha idadi ya miaka.
- source_word: שְׁנֵי הַשָּׂבָע
  choice: miaka saba ya wingi
  rationale: Muundo wa Kiebrania unaunganisha “miaka” na “wingi.” Mpangilio huu ni wa kawaida katika Kiswahili na unaendeleza maana ya kipindi cha mavuno mengi.
- source_word: הַשָּׂבָע
  choice: wingi
  rationale: Neno שָׂבָע hapa linamaanisha hali ya kuwa na chakula au mavuno mengi; “wingi” ni wazi, fasaha, na inafaa muktadha.
- source_word: אֲשֶׁר הָיָה
  choice: ile ... katika
  rationale: Kirai rejeshi cha Kiebrania kinaeleza miaka hiyo kama kipindi kilichokuwako Misri. Katika Kiswahili, “ile miaka ... katika nchi ya Misri” huwasilisha uhusiano huo kwa urahisi bila kirai kizito cha “ambayo ilikuwa.”
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Inahifadhi kwa uwazi אֶרֶץ, “nchi,” na ni usemi wa kawaida wa simulizi la Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “Ndipo” hudumisha mwendelezo wa simulizi wa וַ, na “ile miaka saba” hutambulisha kipindi kilichotajwa tayari.
