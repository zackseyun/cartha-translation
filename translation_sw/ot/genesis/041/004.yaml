base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: sw
  text: Ndipo wale ng’ombe wenye sura mbaya na waliokonda wakawala wale ng’ombe saba wenye sura nzuri na wanono[a]. Kisha Farao akaamka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye afya.” Neno la Kiebrania lililotafsiriwa “wanono” laweza pia kumaanisha “wenye afya” au “waliojaa”; lakini muktadha unasisitiza tofauti ya kimwili kati ya waliokonda na wanono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: wakawala
  rationale: Kitenzi kinamaanisha ‘kula’ na kinaendeleza mfuatano wa matukio katika ndoto; ‘wakawala’ ni cha kawaida na hakiongezi nguvu ya maana kama ‘wakawameza.’
- source_word: הַפָּרוֹת
  choice: ng’ombe
  rationale: Nomino ni wingi wa kike wa ‘ng’ombe’; Kiswahili hakihitaji kuonyesha jinsia hapa kwa kuwa muktadha unatosha.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: wenye sura mbaya
  rationale: Neno רָעוֹת ni ‘wabaya’ kihalisi, lakini likiambatana na ‘mwonekano/sura’ linaeleza kutopendeza kwa kuonekana. ‘Wenye sura mbaya’ ni ya asili na huhifadhi muundo wa Kiebrania.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: na waliokonda
  rationale: Kirai kina maana ya kuwa wembamba wa mwili. ‘Waliokonda’ huwasilisha hali hiyo kwa Kiswahili cha kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: wale ng’ombe saba
  rationale: Hiki ni kirai cha yambwa chenye idadi saba; ‘wale’ hurejelea ng’ombe waliotajwa katika aya iliyotangulia.
- source_word: יְפֹת הַמַּרְאֶה
  choice: wenye sura nzuri
  rationale: Huhifadhi ulinganifu wa moja kwa moja na ‘wenye sura mbaya’ na kutoa Kiswahili cha kawaida, chenye hadhi.
- source_word: וְהַבְּרִיאֹת
  choice: na wanono
  rationale: בָּרִיא inaweza kumaanisha mwenye afya, mnene, au nono. Katika ulinganifu na ng’ombe waliokonda, ‘wanono’ huonyesha tofauti ya kimwili inayokusudiwa.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: Kisha Farao akaamka
  rationale: Kitenzi kina maana ya kuamka. ‘Kisha’ huonyesha hatua inayofuata katika simulizi kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi yenye hadhi lakini kinachoeleweka kwa urahisi. Muundo sambamba wa ‘wenye sura mbaya’ na ‘wenye sura nzuri’ umehifadhiwa; ‘waliokonda’ na ‘wanono’ ni maneno ya kawaida yanayoonyesha wazi tofauti ya kimwili.
