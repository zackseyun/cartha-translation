base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: sw
  text: Yosefu akamjibu Farao, akisema, “Si mimi; Mungu atampa Farao jibu la amani[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jibu kuhusu hali njema ya Farao.” “Amani” hapa inaweza kumaanisha hali njema au ustawi, si tu kutokuwapo kwa vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Ni matumizi ya kawaida ya kitenzi ענה katika simulizi kuanzisha jibu; umbo hili linaendana kwa kawaida na mtiririko wa simulizi la Kiswahili.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: אֶת־פַּרְעֹה
  choice: Farao
  rationale: Kiambishi cha yambwa katika ‘akamjibu’ tayari kinaonyesha kwamba Farao ndiye aliyekuwa akijibiwa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Linahifadhi fomula ya Kiebrania ya kutanguliza maneno ya moja kwa moja kwa Kiswahili cha kawaida.
- source_word: בִּלְעָדָי
  choice: Si mimi
  rationale: Usemi huu wa mkato unaonyesha wazi kwamba uwezo au jibu halitoki kwa Yosefu; ni wa asili na wenye nguvu katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja na muktadha vinaonyesha kwamba anayerejelewa ni Mungu katika umoja.
- source_word: יַעֲנֶה
  choice: ndiye atakayempa ... jibu
  rationale: Muundo huu unawasilisha maana ya kutoa jibu na kusisitiza tofauti kati ya Yosefu na Mungu, huku ukifanya nahau ya Kiebrania ieleweke kiasili kwa Kiswahili.
- source_word: שְׁלוֹם פַּרְעֹה
  choice: la kumletea mema
  rationale: שָׁלוֹם hapa ina maana pana ya hali njema, usalama, au matokeo mazuri; ‘kumletea mema’ hudokeza jibu lenye manufaa bila kulifupisha kuwa amani ya moyoni tu.
theological_decisions:
- issue: Yosefu anahusisha uwezo wa kutoa jibu na nani
  choice: Yosefu anakataa kwamba jibu linatoka kwake na anamwelekeza Farao kwa Mungu kama mtoa jibu.
  alternative: Yosefu aseme tu kwa unyenyekevu kwamba si yeye, kisha Mungu atatoa jibu la amani.
  rationale: בִּלְעָדָי ikifuatiwa na אֱלֹהִים יַעֲנֶה huweka tofauti ya moja kwa moja kati ya Yosefu na Mungu, bila kuhitaji ufafanuzi wa kimadhehebu.
- issue: Maana ya שָׁלוֹם katika jibu la Mungu
  choice: Jibu litakalomletea Farao mema.
  alternative: Jibu kuhusu hali njema ya Farao, au jibu la amani.
  rationale: Neno linaweza kumaanisha hali njema au matokeo mazuri. Tafsiri inahifadhi wazo hilo pana bila kudai kwamba ujumbe wa ndoto wenyewe utakuwa mzuri katika kila jambo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Si mimi’ ni cha moja kwa moja na cha kawaida zaidi kuliko ‘haimo ndani yangu.’ Muundo ‘Mungu ndiye’ huhifadhi msisitizo wa kitheolojia wa sentensi. Hakuna tanbihi iliyowekwa kwa sababu tofauti za kileksika zimewasilishwa kwa uwazi wa kutosha katika matini.
