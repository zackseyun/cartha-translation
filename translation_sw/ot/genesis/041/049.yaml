  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: sw
  text: Yosefu akakusanya nafaka kama mchanga wa bahari, nyingi sana, hata akaacha kuzihesabu, kwa maana hazikuwa na hesabu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: akakusanya
  rationale: Kitenzi צבר kina maana ya kukusanya au kulundika kwa ajili ya kuhifadhi. Katika muktadha huu wa ukusanyaji wa mazao, “akakusanya” ni Kiswahili cha kawaida na chenye kueleweka, huku wazo la kuhifadhi likiwa wazi kutokana na muktadha.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: “Yosefu” ndiyo namna ya kawaida ya jina hili katika Biblia za Kiswahili na inawakilisha kwa uwazi jina la Kiebrania יוֹסֵף.
- source_word: בָּר
  choice: nafaka
  rationale: בָּר hapa ni zao la nafaka kwa ujumla, wala si lazima ngano pekee. “Nafaka” huhifadhi upana huo wa maana.
- source_word: כְּחוֹל הַיָּם
  choice: kama mchanga wa bahari
  rationale: Tafsiri hii huhifadhi tashbihi ya Kiebrania inayosisitiza wingi usiohesabika na ni ya kawaida katika Kiswahili cha kibiblia.
- source_word: הַרְבֵּה מְאֹד
  choice: nyingi sana
  rationale: Kirai hiki kinasisitiza wingi mkubwa. “Nyingi sana” ni cha asili katika Kiswahili na huhifadhi nguvu ya מְאֹד.
- source_word: עַד כִּי
  choice: mpaka
  rationale: Katika muktadha huu, עַד כִּי huonyesha kiwango au hatua iliyofikiwa; “mpaka” huwasilisha uhusiano huo kwa kawaida.
- source_word: חָדַל לִסְפֹּר
  choice: akaacha kuihesabu
  rationale: Kitenzi cha umoja kinaelekea kumrejelea Yosefu. Kiwakilishi “i” kinarejelea nafaka, na “akaacha kuihesabu” ni usemi wa sasa na wazi.
- source_word: כִּי אֵין מִסְפָּר
  choice: kwa maana haikuweza kuhesabika
  rationale: 'Kiebrania kwa muundo wa moja kwa moja ni “kwa maana hapakuwa na hesabu.” Tafsiri hii hutoa maana ya nahau hiyo kwa Kiswahili cha kawaida: nafaka ilikuwa nyingi kupita uwezo wa kuhesabiwa.'
