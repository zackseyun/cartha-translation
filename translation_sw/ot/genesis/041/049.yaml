  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi tashbihi na msisitizo wa Kiebrania bila kufanya sentensi kuwa nzito au isiyo ya kawaida.
