base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: sw
  text: Yosefu akamwita mzaliwa wake wa kwanza Manase[a], kwa maana alisema, “Mungu amenisahaulisha taabu yangu yote[b] na jamaa yote ya baba yangu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Manase linasikika kama neno la Kiebrania linalomaanisha ‘kusababisha kusahau’ au ‘kusahaulisha.’
    reason: lexical_alternative
  - marker: b
    text: Au, ‘dhiki yangu yote’ au ‘shughuli yangu yote yenye kuchosha.’
    reason: lexical_alternative
  - marker: c
    text: ‘Jamaa ya baba yangu’ ni msemo wa Kiebrania unaomaanisha familia au kaya ya upande wa baba.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם הַבְּכוֹר
  choice: akamwita mzaliwa wake wa kwanza
  rationale: Kitenzi קרא pamoja na שֵׁם humaanisha kumpa au kumwita mtu jina. Kiswahili cha sasa hutumia kwa kawaida ‘akamwita’ badala ya kuiga muundo wa Kiebrania ‘akaita jina la’; ‘mzaliwa wake wa kwanza’ huhifadhi maana ya הַבְּכוֹר na kuweka wazi uhusiano unaodokezwa na muktadha.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia. Uhusiano wake wa kimatamshi na נַשַּׁנִי unaelezwa katika tanbihi.
- source_word: כִּי
  choice: kwa maana alisema
  rationale: Kiunganishi kinaanzisha sababu ya jina. ‘Alisema’ huweka wazi kauli inayodokezwa bila kubadili maelezo ya Yosefu kuwa dai la msimulizi.
- source_word: נַשַּׁנִי
  choice: amenisahaulisha
  rationale: Muundo huu una maana ya kusababisha kusahau. ‘Amenisahaulisha’ ni wa asili katika Kiswahili na huhifadhi maana ya kisababishi pamoja na mwangwi wa jina Manase.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino linaonekana kuwa la wingi, kitenzi cha umoja na muktadha vinaonyesha maana ya umoja; ‘Mungu’ ndiyo tafsiri ya kawaida.
- source_word: כָּל עֲמָלִי
  choice: taabu yangu yote
  rationale: עָמָל inaweza kumaanisha taabu, dhiki, au kazi yenye kuchosha. ‘Taabu’ hujumuisha mateso na shida za Yosefu bila kuibana maana kuwa kazi pekee.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: na jamaa yote ya baba yangu
  rationale: בֵּית אָב ni msemo wa Kiebrania kuhusu familia au kaya ya upande wa baba. ‘Jamaa yote ya baba yangu’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuifanya nyumba halisi.
theological_decisions:
- issue: Kauli kwamba Yosefu aliisahau jamaa ya baba yake
  choice: 'Kauli imetafsiriwa moja kwa moja kama maelezo ya Yosefu mwenyewe: Mungu ‘amenisahaulisha ... jamaa yote ya baba yangu.’'
  alternative: Kufafanua kuwa Mungu alimwondolea tu uchungu uliohusiana na familia yake, au kuwa hii ni lugha ya kutia chumvi.
  rationale: Kiebrania kinaweka ‘taabu yangu yote’ na ‘nyumba yote ya baba yangu’ kama vitu vya kitenzi kimoja. Tafsiri haiingizi upatanisho wa kiteolojia wala kupunguza mvutano wa kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa asili kwa Kiswahili, huku maana ya kisababishi, umuhimu wa ‘mzaliwa wa kwanza,’ mchezo wa maneno wa jina Manase, na mvutano wa kauli kuhusu familia ya baba yake vikihifadhiwa.
