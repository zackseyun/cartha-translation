  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: Yosefu anamwita mzaliwa wake wa kwanza Manase, na sababu ya jina inaeleza kwamba Mungu amemsahaulisha taabu yake yote na jamaa/nyumba ya baba yake. ‘Amenisahaulisha’ huwasilisha vizuri umbo la kisababishi נַשַּׁנִי, bila kupunguza mvutano wa kauli ya pili.'
  naturalness: Kiswahili ni sanifu, cha sasa, na kinaeleweka kwa urahisi. Muundo ‘akamwita mzaliwa wake wa kwanza Manase’ ni wa kawaida na unahifadhi kwamba huyu ni mzaliwa wa kwanza bila kuongeza ‘mwana,’ ambalo halimo wazi katika Kiebrania.
  terminology: ‘Manase,’ ‘Mungu,’ ‘taabu yangu yote,’ na ‘jamaa yote ya baba yangu’ zinafaa. ‘Jamaa ya baba yangu’ ni uwasilishaji wa asili wa Kiswahili wa msemo wa ukoo/kaya wa Kiebrania, na tanbihi yake huzuia kuusoma kama jengo halisi pekee. Tanbihi a inaeleza kwa kiasi kinachofaa mchezo wa sauti kati ya Manase na kitenzi cha ‘kusahaulisha.’
