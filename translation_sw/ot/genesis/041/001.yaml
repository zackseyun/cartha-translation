  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. “Na tazama” limehifadhiwa kwa ajili ya msisitizo wa kifasihi; “Mto Nile” ni utambulisho wa wazi unaoeleweka kwa wasomaji wa kawaida.
