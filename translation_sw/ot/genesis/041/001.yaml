base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: sw
  text: Ikawa, mwishoni mwa miaka miwili kamili[a], Farao akaota ndoto; na tazama, alikuwa amesimama kando ya Mto Nile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “miaka miwili ya siku,” nahau ya Kiebrania inayomaanisha kipindi kamili cha miaka miwili.
    reason: lexical_alternative
  - marker: b
    text: Au “mto”; katika mazingira haya ya Misri, neno hilo linamaanisha Mto Nile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Baada ya
  rationale: Muundo huu wa simulizi unaonyesha kwamba kipindi kilichotajwa kilipofikia mwisho, tukio jipya likatokea. “Baada ya” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: שְׁנָתַיִם יָמִים
  choice: miaka miwili kamili
  rationale: Kirai cha Kiebrania, kihalisi “miaka miwili ya siku,” kinasisitiza kipindi kizima cha miaka miwili.
- source_word: פַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: חֹלֵם
  choice: akaota ndoto
  rationale: Ingawa umbo la Kiebrania ni participio linaloweza kuonyesha tukio likiendelea, Kiswahili cha simulizi hutumia kwa ufasaha “akaota ndoto” kuanzisha maono ya ndotoni.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi ishara ya kisimulizi inayovuta fikira kwa ghafla kwenye mandhari ya ndoto.
- source_word: עֹמֵד
  choice: alikuwa amesimama
  rationale: Huonyesha hali ambayo Farao alijikuta ndani yake katika mandhari ya ndoto.
- source_word: עַל הַיְאֹר
  choice: kando ya Mto Nile
  rationale: Katika mazingira ya Misri, יְאֹר humrejelea Nile; עַל hapa huonyesha mahali karibu na ukingo wa mto, si juu ya maji.
