  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: sw
  text: Na akamwita wa pili Efraimu[a], kwa maana Mungu amenifanya nizae matunda katika nchi ya mateso yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Efraimu linasikika kama usemi wa Kiebrania unaomaanisha “amenifanya nizae matunda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי
  choice: Na wa pili akamwita
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi kiunganishi וְ pamoja na tendo la kumpa mtoto wa pili jina.
- source_word: קָרָא
  choice: akamwita
  rationale: Katika muktadha wa kutoa jina, קרא humaanisha kumwita au kumpa jina; “akamwita” ni fasaha na ya kawaida katika simulizi la Kiswahili.
- source_word: אֶפְרָיִם
  choice: Efraimu
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: כִּי
  choice: kwa sababu alisema
  rationale: כִּי inaanzisha maelezo ya Yosefu kuhusu jina. Neno “alisema” limeongezwa kwa uwazi wa usemi katika Kiswahili bila kubadili maana.
- source_word: הִפְרַנִי
  choice: amenifanya nizae matunda
  rationale: Hifili ya פרה ina maana ya kusababisha mtu awe mwenye kuzaa matunda. Tafsiri hii inadumisha picha ya kuzaa matunda na uhusiano wa kimatamshi na jina Efraimu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha Kiebrania ni cha umoja na kinamrejelea Mungu; kwa hiyo umoja “Mungu” unafaa.
- source_word: בְּאֶרֶץ
  choice: katika nchi
  rationale: “Nchi” ni tafsiri ya moja kwa moja na ya kawaida ya אֶרֶץ katika muktadha huu.
- source_word: עָנְיִי
  choice: mateso yangu
  rationale: עֳנִי inaweza kumaanisha dhiki, taabu, au mateso. “Mateso yangu” ni lugha ya sasa, yenye uzito unaofaa, bila kufafanua mateso hayo kwa namna ambayo aya yenyewe haifanyi.
theological_decisions:
- issue: Maana ya maelezo ya Yosefu kuhusu jina
  choice: Yosefu anamweleza Mungu kuwa chanzo cha kuzaa kwake matunda huku akiendelea kuiita nchi hiyo nchi ya mateso yake.
  alternative: Kauli hiyo inaweza kurejelea mateso yake ya awali pekee, au kwa upana zaidi maisha yake ya ugenini na kutengwa na familia.
  rationale: Aya haisemi mateso hayo yalihusu kipindi gani hasa. Tafsiri inadumisha pamoja wema wa Mungu na kumbukumbu ya mateso bila kutatua mvutano huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi “akamwita” ni wa kawaida, na usemi “nizae matunda” unahifadhi taswira na mchezo wa sauti wa Kiebrania.
