base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: sw
  text: Nchi yote ya Misri ikawa na njaa, na watu wakamlilia Farao kwa ajili ya chakula.[a] Farao akawaambia watu wote wa Misri, “Nendeni kwa Yosefu. Lolote atakalowaambia, lifanyeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mkate.” Neno hilo linaweza pia kumaanisha chakula kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: ikawa na njaa
  rationale: Huwasilisha kuanza au kutokea kwa hali ya njaa katika mwendelezo wa simulizi bila kuongeza wazo lisilotajwa wazi la ‘kukumbwa’ au ‘kuteseka.’
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: Nchi yote ya Misri
  rationale: Huhifadhi nomino אֶרֶץ (‘nchi’) na wazo la eneo lote la Misri kwa Kiswahili cha kawaida.
- source_word: וַיִּצְעַק הָעָם אֶל פַּרְעֹה
  choice: watu wakamlilia Farao
  rationale: Kitenzi ‘kumlilia’ kinaonyesha kilio cha dhiki kinachoelekezwa kwa mwenye mamlaka ili kupata msaada, kama צעק katika muktadha huu.
- source_word: לַלָּחֶם
  choice: kwa ajili ya chakula
  rationale: Ingawa לֶחֶם kwa msingi ni ‘mkate,’ hapa hutumiwa kwa upana kuhusu riziki wakati wa njaa. ‘Chakula’ ni cha asili zaidi katika Kiswahili; maana halisi imeonyeshwa katika tanbihi.
- source_word: לְכָל מִצְרַיִם
  choice: watu wote wa Misri
  rationale: Jina la mahali linatumiwa kwa maana ya wakazi wake. Kulifafanua kuwa ‘watu wote wa Misri’ huondoa utata usio wa lazima na ni Kiswahili cha kawaida.
- source_word: לְכוּ אֶל יוֹסֵף
  choice: Nendeni kwa Yosefu
  rationale: Huhifadhi amri ya wingi na jina la kibiblia linalotumika kwa kawaida katika Kiswahili.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: Atakalowaambia, lifanyeni
  rationale: Mpangilio huu huhifadhi kutangulizwa kwa jambo atakalosema Yosefu na amri ya kulifanya, huku ukiendelea kuwa wa asili na unaoeleweka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Viunganishi vya ‘ika-/waka-’ vinadumisha mwendo wa simulizi la Kiebrania. Tanbihi ya Kiingereza iliyotolewa ilieleza mpangilio wa kishazi cha mwisho ingawa alama yake ilikuwa baada ya ‘hungry’; rasimu hii imeweka tanbihi ya kimatini mahali panapohusika na tofauti halisi ya לֶחֶם.
