  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: sw
  text: Nao wale ng’ombe wembamba na wenye sura mbaya wakawala wale ng’ombe saba wa kwanza wenye afya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ng’ombe waliokonda na wenye mwonekano mbaya ... wale ng’ombe saba wa kwanza wanene.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: wakawala
  rationale: Kitenzi אכל humaanisha ‘kula.’ Katika muktadha wa ndoto, ‘wakawala’ kinaeleza tendo hilo kwa Kiswahili cha kawaida bila kuongeza ukali wa maana usiotajwa wazi.
- source_word: הַפָּרוֹת
  choice: ng’ombe
  rationale: Nomino ya Kiebrania iko katika wingi wa kike na hapa inarejelea ng’ombe majike; katika Kiswahili ‘ng’ombe’ ni neno la kawaida, huku muktadha ukibainisha kundi linalorejelewa.
- source_word: הָרַקּוֹת
  choice: wembamba
  rationale: Kivumishi kinaeleza hali ya kukonda; ‘wembamba’ ni cha asili na kinachoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: וְהָרָעוֹת
  choice: wenye sura mbaya
  rationale: רעות hapa haimaanishi uovu wa kimaadili, bali mwonekano mbaya. ‘Wenye sura mbaya’ huhifadhi maana hiyo kwa uwazi.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: wale ng’ombe saba
  rationale: Kiashiria cha yambwa, namba, na nomino vimetafsiriwa kwa mpangilio wa kawaida wa Kiswahili; ‘wale’ huonyesha kundi mahususi lililotangulia.
- source_word: הָרִאשֹׁנוֹת
  choice: wa kwanza
  rationale: Kivumishi hiki hutofautisha kundi la awali katika mfuatano wa ndoto; ‘wa kwanza’ ni usemi wa kawaida na sahihi.
- source_word: הַבְּרִיאֹת
  choice: wenye afya
  rationale: Kivumishi kinaweza kueleza unono au hali nzuri ya mwili. ‘Wenye afya’ huhifadhi maana pana bila kuifunga kwa ukubwa wa mwili pekee.
theological_decisions: []
