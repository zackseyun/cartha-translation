lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta usikivu wa msikilizaji na kudumisha msisitizo wa moja kwa moja wa kauli ya Kiebrania kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: שֶׁבַע שָׁנִים
  choice: miaka saba
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kipindi hiki cha wakati.
- source_word: בָּאוֹת
  choice: inakuja
  rationale: Kauli ya wakati unaoendelea huonyesha ujio wa miaka hiyo kwa uhai zaidi kuliko kusema tu ‘itakuja’; upatanisho wa ngeli kwa ‘miaka’ unahitaji ‘inakuja’.
- source_word: שָׂבָע גָּדוֹל
  choice: wingi mkubwa wa chakula
  rationale: Katika muktadha wa simulizi la Yosefu, usemi huu unahusu kuwepo kwa chakula kingi sana. Kutaja ‘chakula’ kunatoa maana hiyo kwa Kiswahili cha kawaida bila kupunguza nguvu ya kivumishi ‘mkubwa’.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Usemi huu unaonyesha kwamba hali hiyo itaenea katika eneo lote la Misri; mpangilio huu ni wa asili katika Kiswahili.
