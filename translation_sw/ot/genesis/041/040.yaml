review_pass:
  verdict: revise
  source_fidelity: Draft captures Pharaoh's delegation of authority, universal obedience, and the sole exception of the throne. The idiom involving Joseph's 'mouth' is appropriately rendered as obedience in the main text and retained literally in a note.
  naturalness: The wording is generally standard and clear, but 'Ni kwa habari ya kiti cha enzi tu' is less idiomatic than an exception clause placed first. 'Utasimamia nyumba yangu' is a more natural rendering of administrative oversight than the nominal phrase 'utakuwa msimamizi wa nyumba yangu.'
  terminology: '''Kiti cha enzi'' and ''watatii amri yako'' are suitable. The footnote should not say that people give honor ''kwa amri ya Yosefu''; homage, if intended, is directed to Joseph, whereas obedience is according to his command.'
  issues:
  - severity: low
    issue: The throne exception is phrased somewhat awkwardly.
    rationale: Hebrew רַק naturally introduces an exception. 'Isipokuwa kwa kiti cha enzi tu' expresses this clearly and preserves the positional limitation.
  - severity: medium
    issue: Footnote's paraphrase of homage has an imprecise object.
    rationale: The literal wording is 'according to your mouth all my people shall kiss.' If rendered as homage, it would be homage to Joseph, not honor given 'by Joseph's command.' The note should distinguish obedience to his command from homage to him.
  revised_text: Wewe utasimamia nyumba yangu, na watu wangu wote watatii amri yako.[a] Isipokuwa kwa kiti cha enzi tu, nitakuwa mkuu kuliko wewe.
