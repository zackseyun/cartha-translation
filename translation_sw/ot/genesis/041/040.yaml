translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Msimamizi wa nyumba yangu’ limetumiwa badala ya muundo usio wa kawaida ‘juu ya nyumba yangu,’ na utata wa nahau ya ‘kubusu’ umehifadhiwa katika tanbihi.
