    reason: lexical_alternative
  revision_rationale: Revision improves the idiomatic Swahili expression of Pharaoh's delegated oversight and of the throne exception. The footnote preserves the literal, potentially disputed image of kissing while accurately stating the two commonly understood contextual senses without overcommitting to either.
