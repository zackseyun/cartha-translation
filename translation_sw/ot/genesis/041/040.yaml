  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: sw
  text: Wewe utasimamia nyumba yangu, na watu wangu wote watatii amri yako.[a] Isipokuwa kwa kiti cha enzi tu, nitakuwa mkuu kuliko wewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa tafsiri ya moja kwa moja, “na kwa kinywa chako watu wangu wote watabusu.” Usemi huu kwa kawaida unaeleweka hapa kuwa watu watatii amri yako au watakupa heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: msimamizi wa nyumba yangu
  rationale: Kirai hiki kinaonyesha mamlaka na usimamizi juu ya nyumba au milki ya Farao. Tafsiri hii ni ya kawaida katika Kiswahili na haipunguzi maana ya eneo zima la utawala wa nyumbani na ikulu.
- source_word: וְעַל פִּיךָ יִשַּׁק
  choice: watatii amri yako
  rationale: Ingawa maneno ya Kiebrania yanaweza kutafsiriwa moja kwa moja kuwa ‘kwa kinywa chako ... watabusu,’ katika muktadha huu yanaelekea kuonyesha kutii au kutoa heshima kwa agizo la Yosefu. Maana halisi imehifadhiwa katika tanbihi kwa sababu taswira hiyo ina utata wa kweli.
- source_word: כָּל עַמִּי
  choice: watu wangu wote
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kundi lote la watu walio chini ya Farao.
- source_word: רַק הַכִּסֵּא
  choice: Ni kwa habari ya kiti cha enzi tu
  rationale: רַק huweka mpaka au jambo la pekee, na ‘kiti cha enzi’ huhifadhi taswira ya mamlaka ya kifalme bila kuipanua.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: nitakuwa mkuu kuliko wewe
  rationale: Kirai hiki kinaonyesha cheo cha juu zaidi cha Farao; tafsiri hii inabaki karibu na Kiebrania huku muktadha wa kiti cha enzi ukifafanua kuwa ni ukuu wa nafasi.
