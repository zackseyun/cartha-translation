  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: sw
  text: Katika miaka saba ya mavuno mengi, nchi ilitoa mazao kwa makonzi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana halisi ni “kwa makonzi.” Usemi huo unaeleza wingi wa ajabu wa mazao yaliyotolewa na nchi.
