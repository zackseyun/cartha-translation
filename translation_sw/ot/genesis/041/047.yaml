lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: ilitoa mazao
  rationale: Kitenzi עשה kwa kawaida humaanisha ‘kufanya,’ lakini nchi ikiwa kiima katika muktadha wa kilimo humaanisha kutoa mazao. Tafsiri hii ni ya kawaida katika Kiswahili na inaweka wazi maana ya kilimo.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika simulizi hili neno hilo linarejelea nchi na ardhi ya kilimo ya Misri, si dunia nzima.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: Katika miaka saba ya mavuno mengi
  rationale: שׂבע huonyesha wingi au kushiba. ‘Mavuno mengi’ ni usemi wa kawaida unaoeleza kwa uwazi wingi wa mazao katika miaka hiyo.
- source_word: לִקְמָצִים
  choice: kwa makonzi
  rationale: קְמָץ ni konzi, yaani kiasi kinachoweza kushikwa mkononi. Tafsiri hii inahifadhi picha halisi ya Kiebrania badala ya kuibadili moja kwa moja kuwa ‘kwa wingi sana.’
