lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; ‘akamwambia’ ni mtiririko wa kawaida wa masimulizi ya Kiswahili na pia huonyesha anayeelekezewa maneno.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: רְאֵה
  choice: Tazama
  rationale: Amri hii inavuta fikira za Yosefu kwenye tangazo zito linalofuata; ‘Tazama’ huhifadhi nguvu hiyo kwa lugha yenye hadhi.
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: nimekuweka juu ya
  rationale: Ingawa נָתַתִּי kimsingi ni ‘nimetoa/nimempa,’ pamoja na עַל hapa inaonyesha kumweka mtu katika mamlaka. Tafsiri hii huhifadhi taswira na maana ya uteuzi bila kuongeza cheo kisichotajwa.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: nchi yote ya Misri
  rationale: Huhifadhi maana kamili ya כָּל na maana ya kieneo ya אֶרֶץ kwa Kiswahili cha kawaida.
