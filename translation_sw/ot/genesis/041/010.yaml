  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: sw
  text: Farao aliwakasirikia watumishi wake, akaniweka kizuizini[a] katika nyumba ya mkuu wa walinzi[b], mimi pamoja na mkuu wa waokaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya ulinzi”; neno la Kiebrania humaanisha kuzuiliwa kwa ulinzi, lakini si lazima limaanishe jengo rasmi la gereza.
    reason: lexical_alternative
  - marker: b
    text: “Mkuu wa walinzi” hutafsiri cheo cha ikulu ambacho, kwa maana halisi zaidi, ni “mkuu wa wachinjaji”; katika muktadha huu linaweza kurejelea mkuu wa walinzi au watekelezaji wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: aliwakasirikia
  rationale: Kitenzi hiki kinaonyesha hasira dhidi ya watu fulani. ‘Aliwakasirikia’ ni Kiswahili cha kawaida na chenye hadhi bila kuongeza ukali usioelezwa wazi.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya ikulu, neno hili linawahusu watu waliomtumikia Farao katika nyadhifa zao. ‘Watumishi wake’ huhifadhi uhusiano wao naye bila kuwalazimisha wasomaji kuelewa kwamba walikuwa watumwa.
- source_word: בְּמִשְׁמַר
  choice: kizuizini
  rationale: Nomino hii humaanisha hali ya kuzuiliwa na kulindwa. ‘Kizuizini’ huwasilisha maana hiyo bila kudai kwamba walifungwa katika jengo rasmi la gereza.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: nyumba ya mkuu wa walinzi
  rationale: Hiki ni cheo cha ikulu. Ingawa טַבָּחִים kwa maana halisi inaweza kumaanisha wachinjaji au watekelezaji wa hukumu ya kifo, katika simulizi hili ‘mkuu wa walinzi’ ni tafsiri ya kawaida na inayoeleweka ya kazi ya afisa huyo.
- source_word: שַׂר הָאֹפִים
  choice: mkuu wa waokaji
  rationale: Muundo huu humaanisha msimamizi au kiongozi wa waokaji; ‘mkuu wa waokaji’ ni wazi na sahihi katika mazingira ya ikulu.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: mimi pamoja na mkuu wa waokaji
  rationale: Kauli hii huhifadhi msisitizo wa Kiebrania kwa msemaji mwenyewe na pia huonyesha wazi kwamba mkuu wa waokaji alizuiliwa pamoja naye.
