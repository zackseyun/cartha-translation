  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: sw
  text: Ndipo mkuu wa wanyweshaji akamwambia Farao, “Leo ninayakumbuka makosa yangu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhambi zangu” au “hatia zangu.” Neno la Kiebrania linaweza kumaanisha kwa upana matendo mabaya, yawe ya kimaadili au makosa ya kiutendaji katika wajibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio. ‘Ndipo’ huonyesha mwendelezo huo kwa Kiswahili cha kawaida, na ‘akamwambia’ huunganisha kwa ufasaha kitendo cha kusema na anayesemeshwa.
- source_word: שַׂר הַמַּשְׁקִים
  choice: mkuu wa wanyweshaji
  rationale: Cheo hiki kinamtaja afisa mkuu aliyesimamia huduma ya vinywaji kwa Farao. Tafsiri hii ni wazi na haitegemei neno la kizamani.
- source_word: אֶת־פַּרְעֹה
  choice: Farao
  rationale: Ingawa אֶת ni kiashiria cha yambwa, kitenzi cha Kiswahili ‘akamwambia’ tayari kinaonyesha kwamba Farao ndiye aliyeambiwa. Jina la cheo limetoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: לֵאמֹר
  choice: akamwambia ... “...”
  rationale: Dhana ya kuanzisha maneno yanayonukuliwa imewasilishwa moja kwa moja kwa ‘akamwambia’ na alama za usemi; kuongeza ‘akisema’ kungekuwa marudio yasiyo ya lazima katika Kiswahili.
- source_word: אֶת חֲטָאַי
  choice: makosa yangu
  rationale: חטא inaweza kumaanisha dhambi, kosa, au hatia. Katika mazingira ya afisa wa ikulu aliyekuwa amemkosea Farao, ‘makosa yangu’ huhifadhi upana huo bila kuifanya kauli iwe ya kidini zaidi kuliko muktadha unavyolazimisha.
- source_word: אֲנִי מַזְכִּיר
  choice: ninayakumbuka
  rationale: Hifili ya זכר hapa ina maana ya kuyarejesha makosa akilini au kuyataja kwa kuyakumbuka. ‘Ninayakumbuka’ ni ya asili na inaendana na yambwa ya wingi ‘makosa’.
- source_word: הַיּוֹם
  choice: Leo
  rationale: ‘Leo’ ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi msisitizo wa wakati.
