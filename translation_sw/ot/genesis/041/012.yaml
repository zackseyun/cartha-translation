  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: sw
  text: Na kule pamoja nasi alikuwako kijana Mwebrania, mtumwa wa mkuu wa walinzi.[a] Tulimsimulia ndoto zetu, naye akatufasiria; alimfasiria kila mmoja ndoto yake kulingana na ndoto yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “mtumwa wa mkuu wa wachinjaji.” Katika muktadha huu, cheo hicho huenda kilimhusu mkuu wa walinzi au wa watekelezaji wa hukumu.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “kila mtu, kulingana na ndoto yake, alimfasiria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: kijana Mwebrania
  rationale: נַעַר humaanisha kijana au mwanamume kijana; “kijana Mwebrania” ni Kiswahili cha kawaida kinachoonyesha umri na utambulisho wake bila kumfanya aonekane mtoto.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Neno hili hapa linaonyesha hadhi ya mtu aliyekuwa chini ya umiliki na mamlaka ya mkuu huyo; “mtumwa” linaonyesha hali hiyo kwa uwazi kuliko “mtumishi.”
- source_word: שַׂר הַטַּבָּחִים
  choice: mkuu wa walinzi
  rationale: Hiki ni cheo cha ikulu kinachomtaja mkuu wa kikosi cha ulinzi ambacho pia kingeweza kutekeleza hukumu; “mkuu wa walinzi” ni wazi na cha asili katika muktadha huu, huku maana ya karibu zaidi ya kimuundo ikielezwa katika tanbihi.
- source_word: וַנְּסַפֶּר לוֹ
  choice: Tulimsimulia ndoto zetu
  rationale: ספר hapa ni kusimulia au kueleza jambo kwa mpangilio. Kitu kinachosimuliwa, yaani ndoto, kimetajwa wazi katika kishazi kinachofuata na kuingizwa hapa ili Kiswahili kisomeke kwa kawaida.
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: naye akatufasiria
  rationale: פתר katika muktadha wa ndoto ni kutoa fasiri. Kiambishi “-tu-” kinahifadhi maana ya “kwa ajili yetu,” huku “ndoto zetu” ikiwa tayari imetajwa katika kishazi kilichotangulia.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: alimfasiria kila mmoja kulingana na ndoto yake
  rationale: 'Tafsiri hii inahifadhi mgawanyo wa maana: kila mtu alipata fasiri iliyolingana na ndoto yake, bila marudio yasiyo ya lazima katika Kiswahili.'
