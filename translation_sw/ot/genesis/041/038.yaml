  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: sw
  text: Ndipo Farao akawaambia watumishi wake, “Je, tunaweza kumpata mtu kama huyu, ambaye ndani yake kuna roho ya Mungu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Roho wa Mungu,” “roho ya kimungu,” au “roho kutoka kwa Mungu.” Kishazi cha Kiebrania רוּחַ אֱלֹהִים kinaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akawaambia” huendana na walengwa walio wengi.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno linaweza kumaanisha watumishi au maafisa wa ikulu; “watumishi wake” ni tafsiri ya moja kwa moja bila kubainisha vyeo visivyotajwa.
- source_word: הֲנִמְצָא
  choice: Je, tunaweza kumpata
  rationale: Swali hili la balagha lina maana ya kutafuta au kupata mtu mwingine wa aina hiyo; “tunaweza kumpata” ni ya asili na huhifadhi nafsi ya kwanza wingi.
- source_word: כָזֶה אִישׁ
  choice: mtu kama huyu
  rationale: Huhifadhi nguvu ya kiashiria כָזֶה na humrejelea Yosefu moja kwa moja kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר ... בּוֹ
  choice: ambaye ndani yake mna
  rationale: Huhifadhi kwa kadiri inayowezekana muundo wa mahali wa בּוֹ, ‘ndani yake,’ bila kuugeuza kuwa kauli ya umiliki.
- source_word: רוּחַ אֱלֹהִים
  choice: roho ya Mungu
  rationale: Kauli hii huhifadhi maana ya msingi na herufi ndogo huepuka kulazimisha utambulisho mahususi ambao Kiebrania kisicho na kibainishi hakiamui wazi; uwezekano mwingine umeelezwa katika tanbihi.
theological_decisions:
- issue: Iwapo רוּחַ אֱלֹהִים inarejelea Roho wa Mungu kwa maana mahususi au roho ya kimungu kwa maana isiyobainishwa
  choice: roho ya Mungu
  alternative: Roho wa Mungu; roho ya kimungu; roho kutoka kwa Mungu
  rationale: Kishazi cha Kiebrania hakina kibainishi na kinaweza kueleweka kwa njia zaidi ya moja, hasa kikitamkwa na Farao. Tafsiri kuu inabaki karibu na muundo wa chanzo, huku tanbihi ikihifadhi utata wa kweli badala ya kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “ndani yake mna” huhifadhi wazo la Kiebrania la kuwa ndani ya mtu; tanbihi moja tu imetumiwa kwa utata halisi wa רוּחַ אֱלֹהִים.
