  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: sw
  text: Wakusanye chakula chote cha miaka hii mizuri inayokuja, na warundike nafaka chini ya mamlaka ya Farao[a] iwe chakula katika miji, na waihifadhi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chini ya mkono wa Farao,” tafsiri ya moja kwa moja zaidi ya nahau ya Kiebrania inayomaanisha mamlaka au udhibiti.
    reason: lexical_alternative
  - marker: b
    text: Au “wailinde” au “waitunze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: Wakusanye
  rationale: Katika muktadha wa pendekezo la Yosefu, hali ya kitenzi ina maana ya agizo au pendekezo; “wakusanye” huiwasilisha kwa Kiswahili cha kawaida.
- source_word: כָּל אֹכֶל
  choice: chakula chote
  rationale: אֹכֶל ni chakula au akiba ya chakula kwa maana pana; hapa inahusu mazao yatakayokusanywa.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: miaka hii mizuri inayokuja
  rationale: Huhifadhi kivumishi, wazo la kuja, na nguvu ya kiashiria הָאֵלֶּה kwa mpangilio wa asili wa Kiswahili.
- source_word: וְיִצְבְּרוּ
  choice: warundike
  rationale: Kitenzi kina maana ya kukusanya kwa wingi au kuweka katika marundo; “warundike” kinafaa kwa akiba kubwa ya nafaka.
- source_word: בָר
  choice: nafaka
  rationale: Neno hili humaanisha nafaka, hasa iliyokwisha kupurwa; “nafaka” halibani maana kuwa ngano pekee.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: chini ya mamlaka ya Farao
  rationale: Nahau ya Kiebrania “chini ya mkono wa Farao” inaonyesha mamlaka au udhibiti; tafsiri hii inatoa maana hiyo kwa uwazi.
- source_word: אֹכֶל בֶּעָרִים
  choice: iwe chakula katika miji
  rationale: 'Kirai kinaeleza kazi na mahali pa nafaka iliyohifadhiwa: itakuwa akiba ya chakula katika miji.'
- source_word: וְשָׁמָרוּ
  choice: na waihifadhi
  rationale: שׁמר inaweza kumaanisha kutunza, kulinda, au kuhifadhi. “Waihifadhi” linafaa kwa nafaka inayowekwa kwa matumizi ya baadaye huku likiacha wazo la kuitunza salama.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Miundo ya “wakusanye,” “warundike,” na “waihifadhi” inadumisha mfululizo wa mapendekezo yenye nguvu ya agizo bila kuyafanya kuwa wakati ujao wa taarifa.
