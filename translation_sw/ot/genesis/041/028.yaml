  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: sw
  text: 'Hili ndilo jambo nililomwambia Farao: Mungu amemwonyesha Farao kile anachofanya[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile ambacho Mungu yuko karibu kufanya.” Kauli endelevu ya Kiebrania inaweza kueleza tendo la sasa au lililo karibu kutokea; katika muktadha huu wa kufasiri ndoto, matukio yajayo ndiyo yanayokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: Hili ndilo jambo
  rationale: Muundo wa utambulisho wa Kiebrania umetafsiriwa kwa Kiswahili cha kawaida na chenye mkazo unaofaa; “jambo” linaonyesha maudhui ya maelezo ya ndoto.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַּרְעֹה
  choice: nililomwambia Farao
  rationale: Katika Kiswahili, “kumwambia Farao” ni ya asili zaidi kuliko “kusema kwa Farao,” huku ikihifadhi maana ya usemi uliotangulia.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Kifungu hiki kinamtaja Mungu kama jina la kawaida la rejeleo maalumu; hakuna haja ya kutafsiri kibainishi cha Kiebrania kando.
- source_word: עֹשֶׂה
  choice: anachofanya
  rationale: Kauli endelevu ya Kiebrania inaweza kueleza tendo la sasa au lililo karibu kutokea. Tafsiri kuu inahifadhi umbo lisilofunga maana kwa wakati ujao pekee.
- source_word: הֶרְאָה אֶת־פַּרְעֹה
  choice: amemwonyesha Farao
  rationale: Hifili ya ראה ina maana ya “kuonyesha/kufanya aone”; wakati timilifu wa Kiswahili unaonyesha ufunuo ambao tayari umetolewa kupitia ndoto.
theological_decisions:
- issue: Jinsi ya kumrejelea הָאֱלֹהִים katika maneno ya Yosefu
  choice: Mungu
  alternative: yule Mungu
  rationale: “Mungu” ni matumizi ya kawaida ya Kiswahili kwa rejeleo hili maalumu na hayaongezi fundisho lisilokuwamo katika Kiebrania.
- issue: Wakati wa tendo katika עֹשֶׂה
  choice: anachofanya
  alternative: anayekaribia kufanya
  rationale: Kauli endelevu yenyewe inaweza kumaanisha tendo la sasa au linalokaribia; muktadha unaelekea kwenye matukio yajayo, lakini tafsiri kuu inahifadhi mvutano huo na tanbihi inaeleza uwezekano wa wakati ujao wa karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida, huku ukihifadhi marudio ya “Farao” na utata halisi wa kauli endelevu ya Kiebrania.
