  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: sw
  text: Nasi tukaota ndoto usiku mmoja[a], mimi na yeye; kila mmoja wetu akaota ndoto kulingana na tafsiri ya ndoto yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli hii inaweza pia kueleweka, “usiku uleule.” Kiebrania, neno kwa neno, ni “usiku mmoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: Nasi tukaota ndoto
  rationale: Muundo wa ‘tukaota ndoto’ ni wa kawaida katika Kiswahili na unahifadhi kitenzi pamoja na nomino yenye mzizi unaohusiana katika Kiebrania, huku ‘nasi’ ikiendeleza simulizi.
- source_word: בְּלַיְלָה אֶחָד
  choice: usiku mmoja
  rationale: Hii inafuata kwa karibu maana ya ‘katika/usiku mmoja’ na, katika muktadha, inaonyesha kwamba wote wawili waliota katika usiku uleule bila kulazimisha ufafanuzi huo ndani ya matini kuu.
- source_word: אֲנִי וָהוּא
  choice: mimi na yeye
  rationale: Inahifadhi mpangilio na msisitizo wa Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: אִישׁ
  choice: kila mmoja wetu
  rationale: אִישׁ imetumiwa kwa maana ya kugawa mmoja mmoja; ‘kila mmoja wetu’ huonyesha wazi kwamba kila mmoja wa wale wanaume wawili alikuwa na ndoto yake.
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: kulingana na tafsiri yake
  rationale: ‘Kulingana na’ huhifadhi wazo la ulinganifu linaloletwa na כְּ, na ‘tafsiri’ ni neno la kawaida kwa kufafanua maana ya ndoto. Kiwakilishi ‘yake’ kinarejelea ndoto ya kila mmoja kwa namna ya kigawanyo.
- source_word: חָלָמְנוּ
  choice: akaota ndoto
  rationale: Kitenzi cha mwisho kinaendeleza na kukamilisha kauli ya kigawanyo. Kiswahili cha kawaida hurudia ‘akaota ndoto’ baada ya ‘kila mmoja wetu’.
