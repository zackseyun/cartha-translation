  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: sw
  text: Miaka saba ya njaa ikaanza kuja, kama Yosefu alivyosema. Kukawa na njaa katika nchi zote, lakini katika nchi yote ya Misri kulikuwa na mkate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chakula”; neno la Kiebrania lililotafsiriwa “mkate” linaweza pia kumaanisha chakula kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה
  choice: ikaanza
  rationale: Kitenzi kinaonyesha mwanzo wa kutimia kwa kipindi cha njaa; umoja unapatana kwa kawaida na kiima cha Kiswahili “miaka saba” katika ngeli ya I-ZI.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: miaka saba ya njaa
  rationale: Muundo huu ni wa kawaida na wazi katika Kiswahili, huku ukihifadhi uhusiano wa maneno ya Kiebrania.
- source_word: לָבוֹא
  choice: kuja
  rationale: Huhifadhi taswira ya Kiebrania ya miaka ya njaa kuanza kuja bila kuibadili kuwa maelezo ya jumla tu.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: kama Yosefu alivyosema
  rationale: “Kama ... alivyosema” huonyesha kwamba matukio yalitokea sawasawa na maneno ya Yosefu; Kiswahili hakihitaji wakati maalumu unaolingana na past perfect ya Kiingereza.
- source_word: וַיְהִי רָעָב
  choice: Njaa ikawa
  rationale: Ni usimulizi wa asili wa Kiswahili unaowakilisha היה ya kutokea au kuwapo bila kuongeza msisitizo.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: katika nchi zote
  rationale: “Nchi” inaweza kumaanisha maeneo au mataifa; hapa inahifadhi wingi wa אֲרָצוֹת kwa lugha inayoeleweka sasa.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: lakini katika nchi yote ya Misri
  rationale: Ingawa וּ ni kiunganishi cha “na,” muktadha unaonyesha tofauti kati ya njaa katika nchi zote na upatikanaji wa chakula Misri; “lakini” huiwasilisha kwa uwazi.
- source_word: הָיָה לָחֶם
  choice: kulikuwa na mkate
  rationale: “Mkate” huhifadhi neno halisi לֶחֶם, huku tanbihi ikieleza maana yake pana inayowezekana ya chakula au mahitaji ya chakula.
