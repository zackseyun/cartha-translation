  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹֽא יִוָּדַ֤ע הַ/שָּׂבָע֙ בָּ/אָ֔רֶץ מִ/פְּנֵ֛י הָ/רָעָ֥ב הַ/ה֖וּא אַחֲרֵי כֵ֑ן כִּֽי כָבֵ֥ד ה֖וּא מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: sw
  text: Wala wingi huo hautajulikana[a] nchini kwa sababu ya njaa hiyo itakayofuata, kwa maana njaa hiyo itakuwa kali sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hautatambuliwa” au “hautaonekana tena”; kitenzi cha Kiebrania kinaweza kumaanisha kujulikana, kutambuliwa, au kuonekana wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: hautajulikana
  rationale: Nifali ya ידע ina maana ya kujulikana, kutambuliwa, au kuonekana. “Hautajulikana” huhifadhi maana ya msingi na kuonyesha kwamba wingi wa awali hautakuwa tena dhahiri kwa sababu ya njaa.
- source_word: הַשָּׂבָע
  choice: wingi huo
  rationale: Katika muktadha huu nomino hiyo inarejelea wingi wa chakula na mavuno wa miaka saba. “Wingi huo” ni ya asili katika Kiswahili na huunganisha mstari huu na wingi uliotajwa katika mistari iliyotangulia bila kuongeza nomino isiyokuwapo wazi katika Kiebrania.
- source_word: בָּאָרֶץ
  choice: nchini
  rationale: Hapa אֶרֶץ inarejelea nchi inayokumbwa na njaa, hasa Misri katika muktadha, si dunia yote.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: 'Kihusishi hiki kinaonyesha sababu: njaa inayofuata itafanya wingi wa awali usijulikane.'
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: njaa hiyo itakayofuata
  rationale: Usemi huu huhifadhi kiashiria “hiyo” na mfuatano wa wakati, huku ukiwa wa kawaida na wazi katika Kiswahili.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: kwa maana njaa hiyo itakuwa kali sana
  rationale: כבד kwa maana halisi ni “nzito,” lakini inaposemwa kuhusu njaa humaanisha kuwa kali au yenye mateso makubwa. Kurudia “njaa hiyo” huondoa utata wa kiwakilishi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. Tafsiri huhifadhi uhusiano wa sababu, kiashiria cha “njaa hiyo,” na uzito wa njaa bila kutumia lugha ya kimadhehebu.
