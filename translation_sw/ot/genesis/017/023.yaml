  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: sw
  text: Basi Abrahamu akamchukua Ishmaeli mwanawe, pamoja na wote waliozaliwa katika nyumba yake na wote walionunuliwa kwa fedha yake—kila mwanamume miongoni mwa watu wa nyumba ya Abrahamu—akawatahiri nyama ya magovi yao siku hiyo hiyo,[a] kama Mungu alivyomwambia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika siku hii yenyewe”; usemi huu unasisitiza kwamba Abrahamu alitii mara moja siku ileile.'
    reason: lexical_alternative
  - marker: b
    text: Au, “kama Mungu alivyosema naye.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukua ... pamoja na
  rationale: לקח kwa kawaida ni ‘chukua’; hapa muundo huu wa Kiswahili unaonyesha kwamba Abrahamu aliwakusanya na kuwachukua wale wote waliotajwa ili kutekeleza agizo.
- source_word: יְלִידֵי בֵיתוֹ
  choice: waliozaliwa katika nyumba yake
  rationale: Inahifadhi taswira halisi ya waliozaliwa ndani ya nyumba/kaya yake bila kuongeza kwa wazi hadhi yao ya kijamii.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: walionunuliwa kwa fedha yake
  rationale: Kirai kinamaanisha watu waliopatikana kwa ununuzi; ‘fedha’ huhifadhi maana ya כֶּסֶף huku Kiswahili kikiwa cha kawaida.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: kila mwanamume katika watu wa nyumba ya Abrahamu
  rationale: ‘Kila mwanamume’ huonyesha ukamilifu wa כָּל זָכָר, na ‘watu wa nyumba’ huwasilisha אַנְשֵׁי בֵּית kwa lugha inayoeleweka bila urudufu usio wa lazima.
- source_word: וַיָּמָל אֶת בְּשַׂר עָרְלָתָם
  choice: akawatahiri nyama ya magovi yao
  rationale: Inatumia kitenzi cha kawaida ‘tahiri’ na pia kuhifadhi usemi halisi na wa kimwili wa Kiebrania kuhusu nyama ya magovi.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: siku iyo hiyo
  rationale: Nahau hii ya kawaida ya Kiswahili inasisitiza kwamba tendo lilifanywa mara moja siku ileile.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: kama Mungu alivyokuwa amesema naye
  rationale: ‘Amesema naye’ huhifadhi uwezekano wa maana ya kusema na/kwa mtu, na ‘alivyokuwa’ huweka tendo la kusema kabla ya utekelezaji.
theological_decisions:
- issue: Tafsiri ya אֱלֹהִים katika muktadha huu
  choice: Mungu
  alternative: miungu
  rationale: Katika Mwanzo 17, neno hili linamtaja wazi Mungu mmoja anayefanya agano na Abrahamu.
- issue: Lugha ya kijinsia katika maelezo ya nyumba
  choice: kila mwanamume katika watu wa nyumba ya Abrahamu
  alternative: kila mtu katika nyumba ya Abrahamu
  rationale: Kiebrania kinasema wazi זָכָר, ‘mwanamume wa kiume’; kwa hiyo jinsia haipaswi kufichwa katika tafsiri.
- issue: Maana ya דִּבֶּר אִתּוֹ
  choice: amesema naye
  alternative: amemwambia
  rationale: Kihusishi kinaweza kuonyesha kusema ‘na’ au ‘kwa’ mtu. Chaguo kuu huhifadhi hali ya mazungumzo bila kuondoa uwezekano wa maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Dashi hutenganisha kirai kinachofafanua kwamba wote waliotajwa walikuwa wanaume. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
