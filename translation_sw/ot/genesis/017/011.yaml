  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: sw
  text: Mtaitahiri nyama ya magovi yenu, na hiyo itakuwa ishara ya agano kati yangu na ninyi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: Mtaitahiri
  rationale: Kitenzi cha Kiebrania katika muktadha huu kina nguvu ya agizo la agano. Wakati ujao wa Kiswahili unaweza kutoa agizo hilo kwa kawaida bila kulifanya kuwa maelezo ya kutendwa tu.
- source_word: בְּשַׂר
  choice: nyama
  rationale: “Nyama” ndiyo maana ya moja kwa moja ya בָּשָׂר na inahifadhi usemi halisi wa Kiebrania katika kauli ya tohara.
- source_word: עָרְלַתְכֶם
  choice: ya magovi yenu
  rationale: Katika muktadha huu עָרְלָה ni govi. Wingi “magovi yenu” ni wa kawaida kwa Kiswahili kwa kundi la wanaume wanaoambiwa.
- source_word: וְהָיָה
  choice: nayo itakuwa
  rationale: Kiwakilishi “nayo” kinarejelea tendo/alama ya tohara iliyotajwa, huku “itakuwa” ikihifadhi maana ya baadaye ya kishazi.
- source_word: לְאוֹת
  choice: ishara
  rationale: אוֹת hapa humaanisha ishara ya agano; “ishara” ni neno wazi, la kawaida, na lisiloingiza ufafanuzi wa kimadhehebu.
- source_word: בְּרִית
  choice: agano
  rationale: “Agano” ni istilahi ya kawaida ya Kibiblia kwa בְּרִית na muktadha unaonyesha agano maalumu linalowekwa na Mungu.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: kati yangu na ninyi
  rationale: Tafsiri hii inahifadhi nafsi ya pili wingi kwa uwazi bila kuongeza wazao au wahusika wengine kutoka muktadha mpana.
theological_decisions:
- issue: Asili ya tohara kama ishara ya agano
  choice: ishara ya agano
  alternative: alama ya agano
  rationale: Maandishi yanaitaja tohara kuwa אוֹת בְּרִית. “Ishara ya agano” huhifadhi uzito wa kauli hiyo bila kuamua kama ni ya kisakramenti au ya kiishara tu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mtaitahiri” huhifadhi agizo la moja kwa moja; “magovi yenu” ni usemi wa wazi wa kianatomia unaolingana na wingi wa walengwa. Tanbihi ya Kiingereza haikuhamishwa kwa sababu inaonekana kutolingana na alama yake: mbadala “token of the covenant” unahusu לְאוֹת, si “foreskin.”'
