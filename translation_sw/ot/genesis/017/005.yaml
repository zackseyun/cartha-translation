base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: sw
  text: Jina lako halitaitwa tena Abramu, bali jina lako litakuwa Abrahamu, kwa maana nimekufanya kuwa baba wa wingi wa mataifa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi na muundo wa Kiebrania: “kwa maana nimekuweka kuwa baba wa wingi wa mataifa.”'
    reason: Mbadala wa karibu unaoonyesha kitenzi cha Kiebrania katika muundo wake wa kumweka mtu katika hadhi fulani, bila kutumia usemi usio wa asili “nimekutoa uwe.”
lexical_decisions:
- source_word: יִקָּרֵא
  choice: halitaitwa
  rationale: Nifali ya קרא katika kauli ya kubadili jina ina maana ya kutajwa au kuitwa kwa jina fulani; kauli tendwa “halitaitwa” ni ya kawaida na wazi katika Kiswahili.
- source_word: עוֹד
  choice: tena
  rationale: Pamoja na לֹא, neno hili linaonyesha kwamba matumizi ya jina la zamani yatakoma kuanzia wakati huo; “halitaitwa tena” ni usemi wa asili wa Kiswahili.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya pili umoja.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Jina limetoholewa kwa umbo linalotambulika na kutamkika kwa kawaida katika Kiswahili.
- source_word: וְהָיָה
  choice: bali ... litakuwa
  rationale: Ingawa kiunganishi ni “na” kwa umbo, hapa kinaonyesha utofauti kati ya jina la zamani na jipya; “bali” huwasilisha utofauti huo kwa Kiswahili cha kawaida bila kuongeza wazo jipya.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya jina jipya; “kwa maana” kinahifadhi uhusiano huo wa ufafanuzi.
- source_word: אַב
  choice: baba
  rationale: Maana ya kawaida ya neno hili inafaa katika muktadha wa jina na agano; “babu” au “mwasisi” kungepunguza uhusiano wa moja kwa moja uliopo katika maandishi.
- source_word: הֲמוֹן
  choice: umati
  rationale: Neno hili linaonyesha wingi mkubwa. “Umati” huhifadhi nguvu ya nomino na mwangwi wa maelezo ya jina jipya kuliko kusema tu “mengi.”
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno linamaanisha mataifa au jamii mbalimbali kwa upana; “mataifa” ni sahihi na halileti maana ya baadaye ya “watu wa Mataifa.”
- source_word: נְתַתִּיךָ
  choice: nimekufanya kuwa
  rationale: Kihalisi kitenzi ni “nimekutoa,” lakini katika muundo huu kina maana ya kumweka au kumfanya mtu awe katika nafasi fulani. “Nimekufanya kuwa” ni Kiswahili cha asili huku wakati timilifu ukihifadhiwa.
theological_decisions:
- issue: Kauli ya Mungu kuhusu ubaba wa Abrahamu kama jambo lililokamilika
  choice: nimekufanya kuwa baba wa umati wa mataifa
  alternative: nitakufanya kuwa baba wa umati wa mataifa
  rationale: Kiebrania kimetumia wakati timilifu נְתַתִּיךָ. Tafsiri inahifadhi kauli hiyo ya jambo lililotimizwa au kuamuliwa tayari, badala ya kuibadili kuwa ahadi ya wakati ujao; hivyo mvutano wa ahadi ya Mungu kutamkwa kama uhalisi uliokamilika unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametolewa kama “Abramu” na “Abrahamu.” Muundo “umati wa mataifa” umechaguliwa ili kuhifadhi wingi wa הֲמוֹן na uhusiano wake na maelezo ya jina Abrahamu.
