base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: sw
  text: 'Hili ndilo agano langu ambalo mtalishika, kati yangu na ninyi na uzao wako baada yako: kila mtu wa kiume miongoni mwenu atatahiriwa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: Hili ndilo agano langu
  rationale: Kiwakilishi cha kuonyesha cha kike kinarejelea agano; “Hili ndilo” huwasilisha kwa Kiswahili cha kawaida kishirikishi kilichodokezwa katika Kiebrania.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: ambalo mtalishika
  rationale: Kitenzi שמר katika muktadha wa agano humaanisha kulishika au kulitunza kwa utii; wakati ujao hapa una nguvu ya wajibu wa agano.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: kati yangu na ninyi na uzao wako baada yako
  rationale: “Uzao” huhifadhi hali ya pamoja ya זֶרַע na inaweza kujumuisha vizazi vinavyotokana na Abrahamu; mabadiliko kutoka wingi “ninyi” kwenda umoja “wako” yanafuata maandishi ya Kiebrania.
- source_word: הִמּוֹל לָכֶם
  choice: miongoni mwenu atatahiriwa
  rationale: Infinitivu hii ina nguvu ya amri au sharti. Muundo wa kutendwa unaeleza kwa asili kwamba tohara itafanywa kwa kila anayehusika, na לָכֶם inaonyesha kundi ambamo sharti linatumika.
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: Kirai kinataja wazi kila mtu wa jinsia ya kiume; “kila mwanamume” ni cha kawaida, wazi, na hakipanui wala kupunguza upeo wa sharti.
theological_decisions:
- issue: Upeo wa kijinsia wa sharti la ishara ya agano
  choice: kila mwanamume miongoni mwenu atatahiriwa
  alternative: ninyi nyote mtatahiriwa
  rationale: Kiebrania kinataja wazi כָּל זָכָר, hivyo tafsiri inadumisha upeo unaowahusu wanaume badala ya kuufanya kuwa wa watu wote bila kubainisha jinsia.
- issue: Maana ya זֶרַע kama nomino ya pamoja
  choice: uzao wako
  alternative: wazao wako
  rationale: “Uzao” huhifadhi umoja wa kisarufi na maana ya pamoja ya neno la Kiebrania bila kuamua kwamba linamaanisha mtu mmoja tu au wazao wengi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa agano lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi mabadiliko ya Kiebrania kutoka “ninyi” kwenda “wako” ili Abrahamu abaki rejeleo la uzao.
