base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: sw
  text: Abrahamu akamwambia Mungu, “Laiti Ishmaeli angeishi mbele zako!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Laiti Ishmaeli aishi katika uwepo wako,” au “chini ya kibali chako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa kiambishi -ka- unaendeleza simulizi kwa njia ya kawaida katika Kiswahili, huku kitenzi chenye mtendewa kikionyesha kwamba Abrahamu alisema kwa Mungu.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu nomino yenye kibainishi inamtaja Mungu maalumu anayezungumza na Abrahamu; Kiswahili cha kawaida hutumia ‘Mungu’ bila kibainishi kingine.
- source_word: לוּ
  choice: Laiti
  rationale: Hapa neno hili linaanzisha tamanio, si sharti. ‘Laiti’ linahifadhi nguvu ya kutamani na hisia ya ombi.
- source_word: יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: יִחְיֶה
  choice: angeishi
  rationale: Baada ya ‘laiti,’ hali ya masharti katika Kiswahili huwasilisha kwa kawaida tamanio linaloonyeshwa na imperfecti ya Kiebrania.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Hili ni toleo la karibu la maana halisi ‘mbele ya uso wako/katika uwepo wako,’ nalo linahifadhi uwezekano wa maana ya uwepo au kibali bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya tamanio la Abrahamu kuhusu hali ya Ishmaeli mbele za Mungu
  choice: mbele zako
  alternative: katika uwepo wako; chini ya kibali chako
  rationale: Kiebrania kinaweza kudokeza kuishi katika uwepo na kibali cha Mungu, lakini hakifafanui kikamilifu maana ya kitheolojia hapa. Tafsiri ya moja kwa moja inahifadhi mvutano huo bila kuingiza wazi baraka au agano katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Laiti’ linafaa katika usemi wa tamanio, na ‘mbele zako’ linahifadhi ufupi na utata halisi wa Kiebrania.
