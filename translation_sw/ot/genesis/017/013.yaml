base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: sw
  text: Aliyezaliwa nyumbani mwako na aliyenunuliwa kwa fedha yako lazima watahiriwe[a][b][c]. Agano langu litakuwa katika miili yenu kuwa agano la milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakika watahiriwa.” Kiebrania kinatumia kitenzi-jina huru (infinitive absolute) pamoja na kitenzi chenye ukomo ili kutia mkazo.
    reason: lexical_alternative
  - marker: b
    text: Maneno ya Kiebrania yanayotafsiriwa “aliyezaliwa nyumbani” na “aliyenunuliwa kwa fedha” yanawahusu watu wa kaya ya Abrahamu, kutia ndani waliozaliwa humo na waliopatikana kwa kununuliwa.
    reason: cultural_note
  - marker: c
    text: Au, “Aliyezaliwa nyumbani mwako na aliyenunuliwa kwa fedha yako.”
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: lazima atahiriwe kabisa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unatilia mkazo tendo la kutahiriwa. Katika muktadha wa amri, “lazima ... kabisa” huonyesha wajibu na msisitizo bila kuwa tafsiri ngumu isiyo ya kawaida.
- source_word: יְלִיד בֵּיתְךָ
  choice: aliyezaliwa nyumbani mwako
  rationale: Kirai hiki kihalisi humaanisha mtu aliyezaliwa katika nyumba au kaya. Tafsiri hii ni wazi na haiingizi moja kwa moja hadhi ya utumwa ambayo haikutajwa wazi katika kirai chenyewe.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: aliyenunuliwa kwa fedha yako
  rationale: Kirai kinamaanisha mtu aliyepatikana kwa kununuliwa. “Fedha” huhifadhi maana ya כֶּסֶף, ambayo inaweza kumaanisha fedha kama mali au njia ya malipo.
- source_word: בְרִיתִי
  choice: agano langu
  rationale: Hii ndiyo tafsiri ya kawaida na ya wazi ya ברית yenye kiambishi cha nafsi ya kwanza.
- source_word: בִּבְשַׂרְכֶם
  choice: katika miili yenu
  rationale: Kihusishi ב kinaonyeshwa kwa “katika,” na wingi wa “miili yenu” hufuata umbo la Kiebrania huku ukieleza alama ya kimwili bila kuifasiri zaidi kiteolojia.
- source_word: לִבְרִית עוֹלָם
  choice: kuwa agano la milele
  rationale: “Kuwa” huonyesha kazi au matokeo ya agano lililo katika miili yao. “Agano la milele” huhifadhi istilahi kuu ya agano na upeo wa עוֹלָם.
theological_decisions:
- issue: Uhusiano wa alama ya agano na mwili
  choice: Agano linasemwa kuwa katika miili yao kuwa agano la milele.
  alternative: Kulifafanua tohara kuwa ishara tu ya agano, au kuitambulisha moja kwa moja na agano kwa maana pana zaidi ya kisakramenti.
  rationale: Matini ya Kiebrania inaunganisha agano na mwili moja kwa moja lakini haifafanui mfumo wa kiteolojia wa uhusiano huo. Tafsiri inahifadhi mvutano huo bila kuuamua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. “Nyumbani mwako” ni ya asili zaidi kuliko “katika nyumba yako” hapa; “fedha” huhifadhi taswira ya chanzo bila kutumia neno la kizamani. Viashiria vya tanbihi vimewekwa mara tu baada ya kishazi cha tohara ambacho tanbihi zote tatu zinahusu.
