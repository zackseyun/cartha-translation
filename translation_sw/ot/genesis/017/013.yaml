  source_fidelity: The draft accurately identifies the household-born person, the person acquired with money, the covenant, and its enduring character. However, “atahir(i)we kabisa” can naturally suggest complete circumcision rather than the Hebrew infinitive-absolute emphasis, and its singular verb is not natural after the two coordinated referents in Swahili.
  naturalness: “Aliyezaliwa nyumbani mwako na aliyenunuliwa kwa fedha yako lazima watahiriwe” is clear, modern Standard East African Swahili. “Katika miili yenu” is a natural rendering of the bodily wording, and “agano la milele” preserves established biblical register.
  terminology: “Tohara,” “agano,” “fedha,” and “milele” are appropriate. The footnote should identify the Hebrew construction more accurately as an infinitive absolute rather than describe it as a finite/non-finite verb construction in potentially misleading Swahili grammatical terms.
  issues:
