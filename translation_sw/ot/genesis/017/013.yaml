    issue: “lazima atahiriwe kabisa” is semantically misleading and grammatically strained.
    rationale: Kabisa normally modifies the extent or completeness of an action in Swahili; here it may imply that the circumcision must be performed completely, rather than convey Hebrew emphatic verbal force. Also, the coordinated singular referents naturally take a plural passive predicate in Swahili.
  - severity: low
    issue: Footnote a’s description of the Hebrew verbal form is imprecise.
    rationale: The Hebrew construction is specifically an infinitive absolute followed by a finite imperfect. Naming the infinitive absolute directly is clearer and more accurate.
