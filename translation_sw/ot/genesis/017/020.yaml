base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: sw
  text: Kuhusu Ishmaeli, nimekusikia. Tazama, nimembariki; nitamfanya awe na uzao mwingi, nami nitamzidisha sana sana. Atakuwa baba wa wakuu kumi na wawili, nami nitamfanya kuwa taifa kubwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל
  choice: Naye Ishmaeli
  rationale: Kihusishi cha mada לְ pamoja na kiunganishi וּ kinaonyesha kuhamia kwa habari ya Ishmaeli; “Naye Ishmaeli” ni Kiswahili cha asili kinachohifadhi mpito huo.
- source_word: שְׁמַעְתִּיךָ
  choice: nimekusikia
  rationale: Tafsiri ya moja kwa moja ya kauli iliyokamilika, ikimaanisha kwamba Mungu amesikia ombi la Abrahamu kuhusu Ishmaeli.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Inahifadhi kishazi cha kuvuta fikira na kusisitiza tamko linalofuata.
- source_word: הִפְרֵיתִי אֹתוֹ
  choice: nitamfanya awe na uzao mwingi
  rationale: Katika muktadha wa ahadi ya ukoo, kitenzi פרה kinahusu kuongezeka kwa uzao; usemi huu ni wazi na wa kawaida kwa msomaji wa Kiswahili.
- source_word: וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד
  choice: nami nitamzidisha sana sana
  rationale: Unahifadhi nguvu ya urudiaji wa Kiebrania מְאֹד מְאֹד bila kuupunguza kuwa “sana” pekee.
- source_word: נְשִׂיאִם
  choice: wakuu
  rationale: Neno hili humaanisha viongozi au wakuu wa kikabila; “wakuu” halilazimishi dhana ya kifalme ambayo haipo wazi katika neno la chanzo.
- source_word: יוֹלִיד
  choice: Atazaa
  rationale: Kitenzi cha Hifili hapa kina maana ya kuwa baba au kuzaa; “atazaa” ni usemi mfupi na wa kawaida unaofaa kwa mhusika wa kiume katika muktadha huu.
- source_word: וּנְתַתִּיו לְגוֹי גָּדוֹל
  choice: nami nitamfanya kuwa taifa kubwa
  rationale: Ingawa נתן kimsingi ni “kutoa/kuweka,” muundo huu kwa kawaida una maana ya kumweka au kumfanya awe taifa kubwa; tafsiri hii ni ya asili na inahifadhi matokeo yaliyoahidiwa.
theological_decisions:
- issue: Uhusiano wa ahadi kwa Ishmaeli na agano kupitia Isaka
  choice: Mstari umetafsiriwa kama baraka kamili na ahadi halisi kwa Ishmaeli bila kuongeza ufafanuzi kuhusu agano.
  alternative: Kuongeza maneno yanayoonyesha kwamba baraka hii ni ya kidunia tu au iko chini ya ahadi kwa Isaka.
  rationale: Mstari wenyewe unatangaza kwamba Mungu amemsikia Abrahamu na atambariki Ishmaeli; mipaka au tofauti za kiagano zisiazimwe kutoka mistari mingine na kuingizwa hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji “sana sana” umehifadhiwa kwa msisitizo wa Kiebrania; hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
