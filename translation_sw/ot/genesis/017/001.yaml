id: GEN.17.1
reference: Genesis 17:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: sw
  text: Abramu alipokuwa na umri wa miaka tisini na tisa, Yahwe alimtokea na kumwambia, “Mimi ni Mungu Mwenyezi[a]. Tembea mbele zangu, nawe uwe mtu asiye na lawama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: El Shaddai. Kwa kawaida jina hili hutoholewa badala ya kutafsiriwa; maana kamili ya Shaddai inajadiliwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: Abramu alipokuwa na umri wa miaka tisini na tisa
  rationale: Muundo wa Kiebrania unaweka mazingira ya wakati na kutumia nahau ya kawaida ya kutaja umri. Kiswahili cha sasa hutumia kwa asili ‘alipokuwa na umri wa miaka...’.
- source_word: וַיֵּרָא
  choice: alimtokea
  rationale: Katika muktadha huu wa kisimulizi, kitenzi cha Niphal kinamaanisha kwamba Yahwe alijidhihirisha kwa Abramu; ‘alimtokea’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa badala ya kubadilishwa kuwa cheo kama ‘BWANA’, hivyo kuhifadhi matumizi yake kama jina binafsi katika maandishi ya Kiebrania.
- source_word: אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  rationale: Hii ni tafsiri inayoeleweka ya cheo hicho katika Kiswahili. Kwa kuwa maana kamili ya שַׁדַּי inajadiliwa, umbo la Kiebrania ‘El Shaddai’ limehifadhiwa katika tanbihi.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: Tembea mbele zangu
  rationale: Tafsiri hii inadumisha sitiari ya kutembea inayohusu mwenendo mzima wa maisha, pamoja na sauti yake ya agano.
- source_word: וֶהְיֵה תָמִים
  choice: nawe uwe mtu asiye na lawama
  rationale: תָמִים hapa hudokeza ukamilifu wa mwenendo, unyoofu, au kutokuwa na lawama, si lazima kutokuwa na dhambi kabisa. Usemi huu ni wa kawaida katika Kiswahili na huhifadhi uzito wa maadili bila kuzidisha maana.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku ‘Yehova’ likiwa umbo la kimapokeo lisiloakisi kwa usahihi uleule ushahidi wa matamshi ya kale.
- issue: Jinsi ya kutafsiri אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  alternative: El Shaddai; Mungu Shaddai
  rationale: ‘Mungu Mwenyezi’ huwasilisha maana ya kimapokeo ya cheo hicho kwa msomaji wa kawaida. Hata hivyo, kwa kuwa asili na maana kamili ya שַׁדַּי hazina uhakika, tanbihi inadumisha umbo ‘El Shaddai’ bila kuficha utata huo.
- issue: Maana ya תָמִים katika agizo kwa Abramu
  choice: mtu asiye na lawama
  alternative: mkamilifu; mwenye moyo mkamilifu
  rationale: Chaguo hili linaeleza uadilifu na utimilifu wa mwenendo unaotakiwa katika uhusiano wa agano bila kudai wazi ukamilifu usio na dhambi, ambao neno hilo si lazima limaanishe hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Tembea mbele zangu’ umehifadhi sitiari ya Kiebrania, huku ‘mtu asiye na lawama’ ukieleza kwa uwazi maana ya kimaadili ya תָמִים.
