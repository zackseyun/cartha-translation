  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: sw
  text: Nitambariki, tena nitakupa mwana kutoka kwake. Nitambariki, naye atakuwa mataifa[a]; wafalme wa makabila ya watu watatoka kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mataifa yatatokana naye; au, atakuwa mama wa mataifa. Kiebrania kinasema kihalisi zaidi, “atakuwa mataifa.”
    reason: Kufafanua usemi wa Kiebrania ambao ni mkali na usio wa kawaida katika Kiswahili bila kuondoa maana yake katika maandishi makuu.
lexical_decisions:
- source_word: וּבֵרַכְתִּי / וּבֵרַכְתִּיהָ
  choice: Nitambariki / Nitambariki
  rationale: Kitenzi ברך kimetafsiriwa kwa neno la kawaida la agano, “bariki,” na marudio ya Kiebrania yamehifadhiwa ili kudumisha msisitizo.
- source_word: וְגַם
  choice: tena
  rationale: “Tena” huonyesha nyongeza yenye msisitizo kwa Kiswahili cha kawaida bila kufanya sentensi kuwa nzito.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: nitakupa mwana kutoka kwake
  rationale: Ingawa נָתַתִּי ni qatal, katika muktadha huu wa ahadi inaelekea wakati ujao. “Kutoka kwake” huhifadhi wazi kwamba mwana huyo atazaliwa katika ukoo unaotoka kwa Sara.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: naye atakuwa mataifa
  rationale: Tafsiri hii huhifadhi usemi wa Kiebrania ulio mkali na wa kimakusudi, badala ya kuongeza wazi maneno kama “mama wa” au “chanzo cha.” Tanbihi hufafanua maana inayokusudiwa.
- source_word: גוֹיִם
  choice: mataifa
  rationale: “Mataifa” ni kilinganishi cha moja kwa moja na cha kawaida cha גוֹיִם katika ahadi zinazohusu vizazi.
- source_word: מַלְכֵי עַמִּים
  choice: wafalme wa jamaa za watu
  rationale: “Jamaa za watu” hutofautisha עַמִּים na גוֹיִם iliyotafsiriwa “mataifa,” huku ikionyesha makundi ya watu yaliyo chini ya wafalme.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: watatoka kwake
  rationale: Usemi huu wa asili au nasaba unaelezwa kwa Kiswahili cha kawaida kama “watatoka kwake.”
theological_decisions:
- issue: Ahadi kuhusu mataifa yatakayotokana na Sara
  choice: naye atakuwa mataifa
  alternative: naye atakuwa mama wa mataifa; mataifa yatatokana naye
  rationale: Chaguo hili huhifadhi lugha ya kijumuiya ya maandishi ya Kiebrania na upeo wa ahadi ya agano bila kuingiza neno “mama,” ambalo linaeleza maana vizuri lakini halipo wazi katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “Nitambariki” yamehifadhiwa. Usemi usio wa kawaida “atakuwa mataifa” umeachwa makusudi ili kuhifadhi mvutano wa lugha ya asili, huku tanbihi ikisaidia ufafanuzi.
