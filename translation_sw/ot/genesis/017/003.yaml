base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: sw
  text: 'Ndipo Abramu akaanguka kifudifudi, na Mungu akasema naye hivi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: akaanguka
  rationale: Kitenzi hiki cha masimulizi kinaonyesha tendo lililokamilika katika mfuatano wa matukio. “Akaanguka” kinahifadhi maana ya msingi, huku “kifudifudi” kikionyesha kwamba alikuwa amejilaza kwa heshima.
- source_word: עַל פָּנָיו
  choice: kifudifudi
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kuanguka uso ukielekea chini. “Kifudifudi” ni Kiswahili cha kawaida na chenye heshima kinachowasilisha hali hiyo bila maelezo marefu.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Jina limetoholewa kwa desturi ya Kiswahili. Katika hatua hii ya simulizi jina lake bado halijabadilishwa kuwa Abrahamu.
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Ingawa kitenzi kina maana ya “kunena/kusema,” “akasema” ni cha asili katika Kiswahili na kinafaa kabla ya maneno ya moja kwa moja yanayofuata.
- source_word: אִתּוֹ
  choice: naye
  rationale: Kihusishi hiki kimsingi ni “pamoja naye,” na katika muktadha wa usemi “akasema naye” ni Kiswahili cha asili kinachohifadhi wazo la Mungu kuzungumza na Abramu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino linaweza kuonekana la wingi, hapa kitenzi chake ni cha umoja na neno linamrejelea Mungu mmoja.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki ni kifungu cha kutambulisha maneno ya moja kwa moja. “Akisema” kinahifadhi muundo wa simulizi la Kiebrania na kuelekeza kwenye usemi unaofuata.
- source_word: וַ
  choice: Ndipo
  rationale: Kiunganishi cha mwanzo kinaonyesha mfuatano wa simulizi; “Ndipo” ni cha asili katika Kiswahili na huunganisha tendo hili na yaliyotangulia.
theological_decisions:
- issue: Rejeleo na idadi ya אֱלֹהִים
  choice: Mungu (umoja)
  alternative: miungu (wingi wa kiumbo pekee)
  rationale: Katika muktadha huu אֱלֹהִים anamrejelea Mungu wa agano anayezungumza na Abramu, na kitenzi kinapatana naye katika umoja. Tafsiri ya wingi ingepingana na sarufi na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akaanguka kifudifudi” ni wazi kwa wasomaji wa kawaida; “akasema naye, akisema” huhifadhi kwa kiasi cha asili uradidi wa fomula ya usemi wa Kiebrania.
