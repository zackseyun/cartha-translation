  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: sw
  text: Na wanaume wote wa nyumba yake, waliozaliwa nyumbani mwake na wale walionunuliwa kwa fedha kutoka kwa mgeni[a], walitahiriwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mwana wa mgeni,” nahau inayomaanisha mgeni au mtu wa nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Na ... wote
  rationale: Kiunganishi וְ kinaendeleza simulizi, na כָּל kinaonyesha ujumla; muundo huu ni wa kawaida na huhifadhi maana hiyo.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: wanaume wote wa nyumba yake
  rationale: Neno אַנְשֵׁי humaanisha wanaume, na בֵיתוֹ hapa ni nyumba kwa maana ya jamaa na watu wote walio chini ya kaya yake.
- source_word: יְלִיד בָּיִת
  choice: waliozaliwa nyumbani
  rationale: Kirai hiki kinawataja watu waliozaliwa ndani ya kaya; tafsiri hii ni ya asili katika Kiswahili cha sasa.
- source_word: וּמִקְנַת כֶּסֶף
  choice: na wale walionunuliwa kwa fedha
  rationale: Kirai cha Kiebrania kinamaanisha watu waliopatikana kwa ununuzi; 'walionunuliwa kwa fedha' huhifadhi wazi hali ya shughuli hiyo.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: kutoka kwa mgeni
  rationale: בֶּן נֵכָר ni nahau inayomaanisha mgeni au mtu wa nje, si lazima 'mwana wa mgeni' kwa maana halisi.
- source_word: נִמֹּלוּ
  choice: walitahiriwa
  rationale: Umbo la Nifali linaeleweka vyema kama tendo la kutendwa katika muktadha huu.
- source_word: אִתּוֹ
  choice: pamoja naye
  rationale: Huhifadhi maana ya kuandamana na Abrahamu katika tendo au wakati wa kutahiriwa.
