  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. 'Nyumba yake' imehifadhiwa kwa kuwa katika muktadha huu ina maana pana ya kaya, huku 'wanaume' ikiweka wazi wahusika wa tohara.
