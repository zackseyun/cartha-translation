  naturalness: '“Ambaye hajatahiriwa nyama ya govi lake” is not idiomatic Swahili: the location/anatomical specification requires a connector. “Ambaye hajatahiriwa katika nyama ya govi lake” is clear, natural formal Standard East African Swahili, and retains the Hebrew’s concrete wording.'
  terminology: “Agano,” “mtu huyo,” and “atakatiliwa mbali” appropriately preserve the covenantal and legal register. The footnotes responsibly retain the ambiguity of the sanction and of נפש.
