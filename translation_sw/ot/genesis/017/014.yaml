source:
  edition: WLC
  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: sw
  text: Na mwanamume yeyote asiyetahiriwa, ambaye hajatahiriwa katika nyama ya govi lake, mtu huyo atakatiliwa mbali kutoka kwa watu wake[a][b]; amelivunja agano langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi hiyo itakatiliwa mbali kutoka kwa watu wake.” Kiebrania hutumia neno linaloweza kumaanisha “nafsi” au “mtu,” pamoja na nahau ya adhabu ya agano, “kukatiliwa mbali.”
    reason: lexical_alternative
  - marker: b
    text: “Kukatiliwa mbali” huenda kukaonyesha hukumu kali ya agano, ikiwemo kutengwa na jumuiya au kifo, kutegemea muktadha; mstari huu wenyewe hauelezi zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: mwanamume yeyote asiyetahiriwa
  rationale: עָרֵל pamoja na זָכָר humaanisha mtu wa jinsia ya kiume ambaye hajatahiriwa. “Mwanamume ... asiyetahiriwa” ni Kiswahili cha kawaida na huhifadhi alama ya agano; “yeyote” huonyesha tabia ya jumla ya sharti hili la kisheria.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: ambaye hajatahiriwa
  rationale: Niphal ya מול ina maana ya kutendewa au hali inayotokana na tendo hilo. Kauli ya kutendwa katika Kiswahili inalingana vizuri na muundo wa Kiebrania.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: nyama ya govi lake
  rationale: Tafsiri hii huhifadhi usemi halisi na mahususi wa mwili katika Kiebrania badala ya kuufupisha kuwa kutotahiriwa tu.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo atakatiliwa mbali
  rationale: נפש hapa humaanisha mtu aliye chini ya adhabu ya agano, si lazima nafsi isiyo ya mwili. “Atakatiliwa mbali” huhifadhi taswira na ukali wa nahau ya כרת bila kuamua aina kamili ya hukumu.
- source_word: מֵעַמֶּיהָ
  choice: na watu wake
  rationale: Ingawa kiambishi cha Kiebrania kinakubaliana kisarufi na נפש, anayerejelewa ni mwanamume huyo. “Watu wake” huhifadhi maana ya עם kama jumuiya ya watu wake.
- source_word: אֶת בְּרִיתִי
  choice: agano langu
  rationale: בְּרִית ni istilahi kuu ya agano katika sura hii; “agano” ni neno sanifu lenye uzito unaofaa katika Kiswahili.
- source_word: הֵפַר
  choice: amelivunja
  rationale: הפר inaweza kumaanisha kuvunja, kukiuka, au kubatilisha agano. “Amelivunja” ni wazi, ya kawaida, na hudumisha picha ya kuvunja agano.
theological_decisions:
- issue: Maana ya adhabu ya agano כרת (“kukatiliwa mbali”)
  choice: Kuhifadhi nahau “atakatiliwa mbali” bila kutaja aina mahususi ya hukumu
  alternative: “ataondolewa katika jumuiya” au “atauawa”
  rationale: Mstari unaonyesha hukumu kali ya agano lakini hausemi wazi ikiwa ni kutengwa na jumuiya, kifo, au hukumu nyingine. Tafsiri isiamue jambo ambalo maandishi yameacha wazi.
- issue: Tafsiri ya נפש
  choice: mtu
  alternative: nafsi
  rationale: Katika muktadha huu wa kisheria, נפש humrejelea mtu mwenyewe. “Mtu” huepuka kuingiza dhana finyu ya kiantropolojia ambayo mstari haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria na uzito wa adhabu ya agano umehifadhiwa; “nyama ya govi lake” inadumisha umahususi wa Kiebrania.
