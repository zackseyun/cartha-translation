    issue: The phrase “ambaye hajatahiriwa nyama ya govi lake” is grammatically incomplete/unnatural.
    rationale: Kiswahili needs a construction such as “hajatahiriwa katika nyama ya govi lake” to express circumcision with the specified anatomical reference.
  - severity: medium
    issue: “Atakatiliwa mbali na watu wake” can be construed as an agentive phrase (‘cut off by his people’).
    rationale: The Hebrew מֵעַמֶּיהָ denotes separation from among/from his people. “Kutoka kwa watu wake” makes that relation explicit without defining the nature of the sanction.
