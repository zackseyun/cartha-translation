revisions:
- from: Nitalifanya imara agano langu kati yangu na wewe na uzao wako[a] baada yako, katika vizazi vyao vyote, kuwa agano la milele, ili niwe Mungu kwako na kwa uzao wako baada yako.[b]
  to: Nitalifanya imara agano langu kati yangu na wewe, na kati yangu na uzao wako[a] baada yako, kwa vizazi vyao vyote, kuwa agano la milele, ili niwe Mungu wako[b], na Mungu wa uzao wako baada yako.
  rationale: The revision restores the repeated 'between' structure that identifies both Abraham and his subsequent offspring as covenant parties in relation to God. It also uses the idiomatic Swahili covenant formula “Mungu wako,” while the footnote records the closer formal alternative. No doctrinal interpretation is introduced, and the collective ambiguity of “uzao” is preserved.
