  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: sw
  text: Nitalifanya imara agano langu kati yangu na wewe, na kati yangu na uzao wako[a] baada yako, kwa vizazi vyao vyote, kuwa agano la milele, ili niwe Mungu wako[b], na Mungu wa uzao wako baada yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “uzao” limetafsiri neno la Kiebrania la umoja lenye maana ya kijumla; linaweza pia kutafsiriwa “mbegu” au “wazao.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa karibu zaidi na muundo wa Kiebrania: “ili niwe Mungu kwako na kwa uzao wako baada yako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Nitalifanya imara
  rationale: Kitenzi הקים pamoja na בְּרִית kina maana ya kulisimamisha au kulithibitisha agano. “Nitalifanya imara” ni Kiswahili cha kawaida kinachohifadhi wazo la kuliweka agano katika hali thabiti bila kulichanganya na tendo la kwanza la kufanya agano.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa בְּרִית pamoja na kiambishi cha nafsi ya kwanza.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: kati yangu na wewe na
  rationale: Muundo huu unawatambulisha washirika wa agano. Kiswahili kinasawazisha urudiaji wa בֵּין bila kupoteza uhusiano unaoelezwa.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: זֶרַע ni nomino ya umoja yenye maana ya kijumla. “Uzao” huhifadhi maana hiyo vizuri kuliko “wazao,” ambayo ingeifanya iwe wingi wa wazi, na ni ya asili kuliko “mbegu” katika muktadha huu.
- source_word: אַחֲרֶיךָ
  choice: baada yako
  rationale: Huhifadhi maana ya wakati na mfuatano wa kizazi kwa njia ya moja kwa moja.
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Hueleza kuendelea kwa agano katika vizazi vinavyofuatana; “vyote” huonyesha upeo wa vizazi hivyo bila kuongeza wazo jipya.
- source_word: לִבְרִית עוֹלָם
  choice: kuwa agano la milele
  rationale: עוֹלָם katika muktadha huu huonyesha kudumu. “Agano la milele” ni usemi wa kawaida, unaoeleweka na wenye hadhi.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: ili niwe Mungu kwako
  rationale: Hufuata kwa karibu muundo wa Kiebrania wa uhusiano, yaani, “kuwa Mungu kwako,” badala ya kuufupisha moja kwa moja kuwa umilikaji.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: na kwa uzao wako baada yako
  rationale: Hutafsiri זֶרַע kwa uthabiti na kuhifadhi kurudiwa kwa ahadi kwa Abrahamu na uzao wake.
theological_decisions:
- issue: Maana ya kijumla ya זֶרַע katika ahadi ya agano
  choice: uzao wako
  alternative: wazao wako; mbegu yako
  rationale: “Uzao” unaweza kurejelea jumla ya wale wanaotokana na Abrahamu bila kuamua kimakusudi ikiwa neno hilo lazima lieleweke kama wingi tu au kama mmoja mwenye uwakilishi. Hivyo utata halisi wa Kiebrania unabaki.
- issue: Muundo wa kauli ya agano לִהְיוֹת לְךָ לֵאלֹהִים
  choice: ili niwe Mungu kwako
  alternative: ili niwe Mungu wako
  rationale: Chaguo hili linahifadhi kwa karibu namna ya uhusiano iliyo katika Kiebrania. Chaguo la kawaida zaidi la Kiswahili limetolewa katika tanbihi bila kuingiza maana ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mwendo wa kauli ya agano ya Kiebrania, huku “Nitalifanya imara” na “katika vizazi vyao vyote” zikitumiwa kwa uelewekevu wa kawaida. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
