  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: sw
  text: Kisha Mungu akamwambia Abrahamu[a], “Kuhusu Sarai, mke wako, usiite jina lake Sarai, kwa maana jina lake ni Sara.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa mtindo wa kawaida zaidi: “usiendelee kumwita Sarai; jina lake litakuwa Sara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa waw-consecutive unaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, huku “akamwambia” ikitaja kwa kawaida anayeelekezewa maneno.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa Mungu mmoja katika muktadha huu.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Jina limenakiliwa ili kuhifadhi utofauti muhimu kati ya jina la awali, Sarai, na jina jipya, Sara.
- source_word: אִשְׁתְּךָ
  choice: mke wako
  rationale: Hutoa maana ya moja kwa moja ya muundo wa umilikishi unaomtambulisha Sarai kwa uhusiano wake na Abrahamu.
- source_word: לֹא תִקְרָא אֶת שְׁמָהּ
  choice: usiliite jina lake
  rationale: Kauli hii ni katazo katika hotuba ya moja kwa moja. Tafsiri inahifadhi neno “jina” na uzito wa tamko la kubadili jina, ingawa ni rasmi kidogo katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu au ufafanuzi wa katazo na inafaa kwa mtindo wenye heshima wa simulizi.
- source_word: שָׂרָה שְׁמָהּ
  choice: jina lake ni Sara
  rationale: Kishazi kisicho na kitenzi kinatangaza jina jipya. Mpangilio huu ni wa asili kwa Kiswahili na haongezi wazi wakati ujao ambao haupo katika Kiebrania.
theological_decisions:
- issue: Namna ya kutafsiri tamko la kubadili jina
  choice: “usiliite jina lake Sarai, kwa maana jina lake ni Sara”
  alternative: “usimwite tena Sarai; jina lake litakuwa Sara”
  rationale: Chaguo kuu linahifadhi katazo na tamko la jina kama yalivyo katika Kiebrania, bila kuongeza “tena” wala kitenzi cha wakati ujao. Hivyo halisuluhishi kimyakimya mvutano kati ya maana ya kimuktadha na umbo rasmi la tamko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka. Jina שָׂרָה limetolewa kama “Sara,” umbo lililozoeleka katika Kiswahili, huku “Sarai” likihifadhiwa ili tofauti ya majina ionekane.
