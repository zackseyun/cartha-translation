lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abrahamu
  rationale: Kiunganishi ו kinaendeleza simulizi, lakini hakihitaji kutafsiriwa kwa neno la pekee hapa; mwanzo usio na “Na” ni wa kawaida na wa asili katika Kiswahili. Jina limetolewa kwa umbo la Kiswahili lililozoeleka.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: alikuwa na umri wa miaka tisini na tisa
  rationale: Nahau ya Kiebrania, kihalisi “mwana wa miaka tisini na tisa,” imetafsiriwa kwa nahau ya kawaida ya Kiswahili bila kubadili taarifa ya umri.
- source_word: בְּ/הִמֹּלוֹ
  choice: ilipotahiriwa
  rationale: ב pamoja na kitenzi-jina na kiambishi cha nafsi huonyesha wakati; umbo la kutendwa linadumisha muundo wa chanzo na kuungana kiasili na “nyama ya govi lake.”
- source_word: בְּשַׂר
  choice: nyama
  rationale: Neno hili linahifadhi rejeo halisi la sehemu ya mwili katika kauli ya tohara.
- source_word: עָרְלָתוֹ
  choice: ya govi lake
  rationale: Muundo בשר ערלתו umetolewa moja kwa moja kama “nyama ya govi lake,” badala ya kufupishwa kuwa tu kwamba Abrahamu alitahiriwa.
