id: GEN.17.8
reference: Genesis 17:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: sw
  text: Nitakupa wewe na uzao wako baada yako nchi unamoishi kama mgeni[a]—nchi yote ya Kanaani—iwe milki ya milele[b]; nami nitakuwa Mungu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi ya ukaaji wako kama mgeni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwa milki ya milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Nitakupa
  rationale: Kauli ya agano ina nguvu ya ahadi ya wakati ujao; Kiswahili cha wakati ujao kinaiwasilisha kwa kawaida.
- source_word: לְךָ
  choice: wewe
  rationale: Inaonyesha kwamba Abrahamu mwenyewe ndiye mpokeaji wa ahadi, pamoja na uzao wake.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: na uzao wako baada yako
  rationale: “Uzao” huhifadhi maana ya nomino ya mkusanyiko זֶרַע bila kuilazimisha kuwa wingi wa watu mmoja mmoja; “baada yako” huhifadhi wazo la kufuatana kwa vizazi.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: nchi unamoishi kama mgeni
  rationale: Huwasilisha hali ya kuishi katika nchi bila kuwa mwenyeji au mmiliki wake, maana ya msingi ya מְגוּרִים katika muktadha huu.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: nchi yote ya Kanaani
  rationale: Kirai hiki kinafafanua nchi iliyotajwa na kuhifadhi ukamilifu unaoonyeshwa na כָּל.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: iwe milki ya milele
  rationale: “Milki” inaonyesha mali inayoshikiliwa au kumilikiwa, na “ya milele” huhifadhi uzito wa kudumu wa עוֹלָם katika ahadi ya agano.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: nami nitakuwa Mungu wao
  rationale: Hii ni namna ya asili ya Kiswahili ya kuwasilisha fomula ya uhusiano wa agano bila kudokeza mabadiliko katika asili ya Mungu.
theological_decisions:
- issue: Kutafsiri fomula ya agano bila kuingiza maana za kimadhehebu au mafundisho ya baadaye
  choice: nami nitakuwa Mungu wao
  alternative: nami nitakuwa Mungu kwao
  rationale: Chaguo hili linaeleza uhusiano wa agano kwa uwazi na kwa Kiswahili cha kawaida, bila kudokeza kwamba Mungu anabadilika kiasili.
- issue: Nguvu ya עוֹלָם katika umiliki wa nchi
  choice: milki ya milele
  alternative: milki ya kudumu
  rationale: “Ya milele” huhifadhi upeo wenye nguvu wa neno la Kiebrania na mvutano wa ahadi ya agano bila kuufupisha kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida huku ukihifadhi lugha ya agano, maana ya pamoja ya “uzao,” na hali ya Abrahamu ya kuishi kama mgeni.
