lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: Nami nitaweka
  rationale: Kitenzi נתן kimsingi kina maana ya ‘kutoa/kuweka’; pamoja na בְּרִית, ‘kuweka agano’ ni Kiswahili cha kawaida na chenye uzito, huku kikibaki karibu na taswira ya Kiebrania.
- source_word: בְרִיתִי
  choice: agano langu
  rationale: ‘Agano’ ni neno la kawaida la Kiswahili linalohifadhi uzito rasmi na wa kitheolojia wa בְּרִית; kiambishi cha nafsi ya kwanza kimetafsiriwa ‘langu.’
- source_word: בֵּינִי וּבֵינֶךָ
  choice: kati yangu na wewe
  rationale: Hii inawasilisha moja kwa moja uhusiano unaoelezwa na kirai cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: וְאַרְבֶּה
  choice: nami nitakuzidisha
  rationale: Hifili ya רבה inaonyesha kusababisha ongezeko; ‘nitakuzidisha’ huhifadhi wazo hilo na pia kumwelekezea Abramu ahadi moja kwa moja.
- source_word: אֹתְךָ
  choice: -ku- (wewe)
  rationale: Yambwa ni nafsi ya pili umoja wa kiume na inamhusu Abramu; haijapanuliwa kuwa ‘wazao wako,’ ingawa wazao wake wanadokezwa.
- source_word: בִּמְאֹד מְאֹד
  choice: sana mno
  rationale: Maneno mawili ya kusisitiza מְאֹד מְאֹד yamewakilishwa kwa usemi wa asili wa Kiswahili wenye mkazo mkubwa.
theological_decisions:
- issue: Nahau ya agano yenye נתן + ברית
  choice: nitaweka agano langu
  alternative: nitalithibitisha agano langu / nitafanya agano langu
  rationale: ‘Nitaweka’ huhifadhi kwa karibu maana ya msingi ya נתן na ni nahau inayoeleweka katika muktadha wa agano. Tanbihi inaonyesha mbadala wa kimuktadha ‘kulithibitisha’ bila kuamua kimya kimya ikiwa tendo hilo linaanzisha au linathibitisha agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Nami … nami …’ unahifadhi viunganishi vya Kiebrania bila kufanya sentensi iwe nzito; ‘sana mno’ huhifadhi msisitizo wa marudio ya מְאֹד.
