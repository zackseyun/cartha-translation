  to: Kila mwanamume miongoni mwenu atatahiriwa akiwa na umri wa siku nane[a], katika vizazi vyenu vyote—aliyezaliwa katika nyumba yenu au aliyenunuliwa kwa fedha[b] kutoka kwa mtu yeyote wa kigeni ambaye si wa uzao wako.[c]
  rationale: 'Marekebisho haya yanadumisha maana na mpangilio wa msingi wa matini: tohara ya kila aliye wa kiume akiwa na siku nane, katika vizazi vinavyofuata, iwe amezaliwa katika nyumba au amenunuliwa kutoka kwa mtu wa kigeni asiye wa uzao wa Abrahamu. Yanaondoa miundo isiyo ya kawaida na utata usiohitajika wa Kiswahili bila kuongeza hitimisho la kiteolojia.'
