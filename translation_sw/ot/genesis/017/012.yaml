review_pass:
  verdict: revise
  source_fidelity: 'Rasimu kwa ujumla inafuata Kiebrania kwa uaminifu: sharti la siku nane, wigo wa kila aliye wa kiume, uendelevu katika vizazi, na makundi ya waliozaliwa katika nyumba na walionunuliwa vimehifadhiwa. Marekebisho yanaboresha ufasiri wa יְלִיד בָּיִת kama kuzaliwa katika nyumba ya watu wanaoelekezwa, na wa בֶּן־נֵכָר kama mtu wa kigeni badala ya ‘mgeni,’ ambalo mara nyingi humaanisha mtembeleaji katika Kiswahili cha sasa.'
  naturalness: ‘Kila wa kiume’ si usemi wa kawaida wa Kiswahili Sanifu. ‘Kila mwanamume’ ni wa kawaida katika rejesta ya kisheria/kibiblia na, katika muktadha wa ‘akiwa na umri wa siku nane,’ humjumuisha mtoto mchanga. ‘Katika vizazi vyenu vyote’ huonyesha vizuri zaidi mwendelezo wa לְדֹרֹתֵיכֶם.
  terminology: ‘Kutahiriwa,’ ‘fedha,’ na ‘uzao’ zinafaa. ‘Mtu wa kigeni’ huepuka maana ya ‘mgeni’ kama mgeni wa kutembelea, huku ikidumisha maana ya mtu asiye wa uzao wa Abrahamu. Tanbihi ya fedha ihifadhi mbadala wa ‘pesa,’ na tanbihi ya mwisho ihifadhi muundo wa kihalisi bila kudai kwamba ‘mwana wa mgeni’ ni lazima mwana wa mtu huyo kwa maana nyembamba.
  issues:
  - severity: medium
    issue: ‘Kila wa kiume’ si muundo wa kawaida wa Kiswahili Sanifu.
    rationale: Ingawa unaeleweka, usemi huo unasikika kama kivumishi kilichotumika bila nomino. ‘Kila mwanamume’ ni wa kawaida na unaendana na rejesta ya kifungu.
  - severity: low
    issue: ‘Aliyezaliwa nyumbani’ inaweza kumaanisha tu mahali pa kuzaliwa, si uanachama wa nyumba.
    rationale: יְלִיד בָּיִת hurejelea aliyezaliwa katika/wa nyumba ya bwana. ‘Aliyezaliwa katika nyumba yenu’ hutoa maana hiyo kwa uwazi zaidi.
  - severity: medium
    issue: ‘Mgeni yeyote’ inaweza kueleweka kama mtembeleaji.
    rationale: Katika matumizi ya kisasa ya Kiswahili, ‘mgeni’ mara nyingi ni mtembeleaji. ‘Mtu yeyote wa kigeni’ hutoa maana ya נֵכָר kwa usahihi zaidi.
