base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: sw
  text: Kila mwanamume miongoni mwenu atatahiriwa akiwa na umri wa siku nane[a], katika vizazi vyenu vyote—aliyezaliwa katika nyumba yenu au aliyenunuliwa kwa fedha[b] kutoka kwa mtu yeyote wa kigeni ambaye si wa uzao wako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mwana wa siku nane.”
    reason: lexical_alternative
  - marker: b
    text: Au “aliyenunuliwa kwa pesa.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kutoka kwa kila mwana wa mgeni ambaye si wa mbegu yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: akiwa na umri wa siku nane
  rationale: Nahau ya Kiebrania, kihalisi ‘mwana wa siku nane,’ inaeleza umri. Kauli hii ni ya kawaida katika Kiswahili na inadumisha sharti la wakati.
- source_word: יִמּוֹל
  choice: atatahiriwa
  rationale: Muundo wa Kiebrania una maana ya kutendwa na hapa unatoa agizo; wakati ujao wa Kiswahili unadumisha mtindo wa kisheria bila kuongeza msisitizo usio katika matini.
- source_word: לָכֶם כָּל זָכָר
  choice: kila wa kiume miongoni mwenu
  rationale: ‘Kila wa kiume’ huhifadhi upana wa כָּל זָכָר, huku ‘miongoni mwenu’ ikiwakilisha לָכֶם kwa Kiswahili cha kawaida.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu
  rationale: Kauli hii inaonyesha kuwa agizo linaendelea kutumika katika vizazi vinavyofuatana.
- source_word: יְלִיד בָּיִת
  choice: aliyezaliwa nyumbani
  rationale: Huwasilisha kwa uwazi mtu aliyezaliwa ndani ya nyumba au jamaa ya nyumbani.
- source_word: וּמִקְנַת כֶּסֶף
  choice: au aliyenunuliwa kwa fedha
  rationale: ‘Fedha’ huhifadhi taswira halisi ya כֶּסֶף na ‘aliyenunuliwa’ huonyesha kupatikana kwa njia ya ununuzi.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: kutoka kwa mgeni yeyote
  rationale: ‘Mwana wa mgeni’ ni nahau ya Kiebrania inayoweza kutolewa kwa Kiswahili cha kawaida kama ‘mgeni yeyote’; tafsiri ya kihalisi imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: ambaye si wa uzao wako
  rationale: ‘Uzao’ huwasilisha maana ya זֶרַע katika muktadha wa nasaba bila kutumia taswira isiyo ya kawaida ya ‘mbegu.’
theological_decisions:
- issue: Wigo wa agizo la tohara ndani ya nyumba ya agano la Abrahamu
  choice: Mstari unawahusisha wa kiume wote waliotajwa, wakiwemo waliozaliwa nyumbani na walionunuliwa kutoka kwa wageni, si wazao wa kimwili pekee.
  alternative: Kulihusisha agizo hasa au peke yake na wazao wa kimwili wa Abrahamu.
  rationale: Kiebrania kinataja wazi waliozaliwa nyumbani na walionunuliwa ambao si wa uzao wa Abrahamu; tafsiri inadumisha wigo huo bila kuingiza hitimisho la baadaye la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kila wa kiume’ limechaguliwa badala ya ‘kila mwanamume’ ili lisimtenge mtoto wa siku nane, na badala ya ‘kila mtoto wa kiume’ ili lisipunguze wigo wa כָּל זָכָר. Dashibodi hutenganisha aina mbili za walio ndani ya wigo wa agizo.
