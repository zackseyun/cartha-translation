  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: sw
  text: Lakini agano langu nitalithibitisha pamoja na Isaka[a], ambaye Sara atakuzalia wakati kama huu mwaka ujao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na agano langu nitalithibitisha pamoja na Isaka.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “na,” lakini muktadha unaonyesha tofauti na ahadi iliyotolewa kuhusu Ishmaeli katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Lakini
  rationale: Waw kimsingi inaweza kutafsiriwa “na,” lakini hapa inaunganisha kauli hii kwa ulinganisho wa tofauti na ahadi kuhusu Ishmaeli katika mstari uliotangulia.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: Hili ni neno la kawaida na lenye hadhi kwa בְּרִית katika muktadha wa agano; kiambishi cha nafsi ya kwanza kimeonyeshwa kwa “langu.”
- source_word: אָקִים
  choice: nitalithibitisha
  rationale: Hifili ya קום inapohusishwa na agano ina maana ya kulisimamisha kwa uthabiti au kulithibitisha. “Nitalithibitisha” ni Kiswahili cha kawaida na hakidokezi kwamba Isaka ndiye anayefanya agano.
- source_word: אֶת יִצְחָק
  choice: pamoja na Isaka
  rationale: אֶת ni alama ya yambwa, lakini katika Kiswahili agano huthibitishwa kwa kawaida “pamoja na” mshirika wa agano.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: ambaye Sara atakuzalia
  rationale: Huhifadhi kishazi husishi na maana ya לְךָ kwamba Sara atamzalia Abrahamu mwana huyo.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: wakati kama huu mwaka ujao
  rationale: מוֹעֵד ni wakati uliowekwa, na katika muundo huu pamoja na “mwaka unaofuata,” Kiswahili cha asili “wakati kama huu mwaka ujao” huwasilisha muda mahsusi bila kuwa kizito.
theological_decisions:
- issue: Mstari wa agano kupitia Isaka badala ya Ishmaeli
  choice: Kauli inasema Mungu atalithibitisha agano lake pamoja na Isaka.
  alternative: Kufanya ahadi kwa Ishmaeli katika mstari uliotangulia ionekane kuwa sehemu ileile ya agano.
  rationale: Tofauti ya kimuktadha imehifadhiwa bila kuingiza hitimisho la kitheolojia linalozidi kauli ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. Mpangilio “agano langu nitalithibitisha” unasisitiza agano kama ulivyosisitizwa katika Kiebrania.
