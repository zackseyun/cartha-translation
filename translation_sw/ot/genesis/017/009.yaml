base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: sw
  text: Mungu akamwambia Abrahamu, “Nawe, utalishika agano langu, wewe na uzao wako baada yako, kwa vizazi vyao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wenye waw-consecutive unaendeleza simulizi; “akamwambia” ni usemi wa kawaida wa Kiswahili unaojumuisha kitendo cha kusema na anayeelekezewa.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa Mungu anayesema na Abrahamu katika muktadha wa agano.
- source_word: אֶל־אַבְרָהָם
  choice: Abrahamu
  rationale: Maandishi ya Kiebrania yanatumia jina jipya Abrahamu; katika “akamwambia Abrahamu,” uhusiano unaoonyeshwa na אֶל umeelezwa kiasili kwa Kiswahili.
- source_word: וְאַתָּה
  choice: Nawe
  rationale: Kiwakilishi kilichotangulizwa kina mkazo na kuhamisha fikira kwenye wajibu wa Abrahamu; “Nawe” huhifadhi mkazo huo kwa lugha fupi na ya asili.
- source_word: אֶת־בְּרִיתִי
  choice: agano langu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza imetafsiriwa moja kwa moja, huku istilahi kuu ya agano ikihifadhiwa.
- source_word: תִשְׁמֹר
  choice: utalishika
  rationale: Kitenzi שׁמר katika muktadha wa agano humaanisha kushika au kutunza kwa uaminifu. “Utalishika” huhifadhi kauli ya wajibu bila kuongeza maana ya kimadhehebu.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: wewe na uzao wako
  rationale: “Uzao” ni neno la kawaida la Kiswahili kwa זֶרַע kama umoja wa kijumla unaorejelea watu watakaotokana na Abrahamu; “wewe” limerudiwa ili kuhifadhi msisitizo wa Kiebrania.
- source_word: אַחֲרֶיךָ
  choice: baada yako
  rationale: Hueleza ufuatano wa ukoo na ni tafsiri ya moja kwa moja, ya kawaida katika Kiswahili.
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Usemi huu unaonyesha kuendelea kwa wajibu katika vizazi vinavyofuatana; “vyote” huwasilisha upeo endelevu wa kirai hicho kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kuwasilisha wajibu wa agano bila kuingiza maana ya ziada ya kisheria au ya kimadhehebu
  choice: utalishika agano langu
  alternative: utalitunza agano langu; ni lazima ulishike agano langu
  rationale: “Utalishika” huhifadhi lugha ya agano na nguvu ya agizo la Kiebrania, bila kulifanya kuwa amri kali zaidi kwa kuongeza “ni lazima,” wala kulielekeza kwenye ufafanuzi maalumu wa kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi msisitizo wa “Nawe” na urudiaji wa “wewe,” huku “uzao” ukihifadhi umoja wa kijumla wa neno la Kiebrania.
