  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: sw
  text: Mungu akasema, “La, bali Sara mke wako atakuzalia mwana, nawe utamwita Isaka.[a] Nami nitalithibitisha agano langu pamoja naye liwe agano la milele kwa uzao wake baada yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Isaka linasikika kama kitenzi cha Kiebrania kinachomaanisha “anacheka” au “atacheka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: La, bali
  rationale: Katika muktadha huu Mungu anajibu ombi la Abrahamu kuhusu Ishmaeli. ‘La, bali’ linaonyesha nguvu ya kusahihisha ya neno hilo bila kuliongezea maana.
- source_word: יֹלֶדֶת לְךָ בֵּן
  choice: atakuzalia mwana
  rationale: Ingawa יֹלֶדֶת ni umbo la kitenzi-jina, hapa lina maana ya wakati ujao katika ahadi. ‘Atakuzalia mwana’ ni Kiswahili cha kawaida na huhifadhi maana ya לְךָ.
- source_word: וְקָרָאתָ אֶת שְׁמוֹ
  choice: utamwita
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kumpa mtoto jina, huku ikihifadhi amri au tangazo la wakati ujao katika Kiebrania.
- source_word: יִצְחָק
  choice: Isaka
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili; tanbihi inahifadhi mchezo wa sauti na kitenzi cha Kiebrania.
- source_word: וַהֲקִמֹתִי
  choice: nitalithibitisha
  rationale: Katika lugha ya agano, kitenzi hiki kina maana ya kulisimamisha au kulifanya agano liwe thabiti na lenye nguvu. ‘Nitalithibitisha’ ni cha asili katika Kiswahili na hakimaanishi kwamba agano hilo lilikuwa na Isaka tayari.
- source_word: בְּרִיתִי אִתּוֹ
  choice: agano langu pamoja naye
  rationale: ‘Pamoja naye’ hudumisha uhusiano wa agano na Isaka mwenyewe, badala ya kulieleza kama faida inayoelekezwa kwake tu.
- source_word: לִבְרִית עוֹלָם
  choice: liwe agano la milele
  rationale: Muundo huu unaonyesha matokeo au kusudi la kulithibitisha agano. ‘Agano la milele’ ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: kwa uzao wake baada yake
  rationale: ‘Uzao’ huhifadhi hali ya jina la jumla la umoja זֶרַע bila kulifafanua zaidi kuwa taifa au kundi fulani.
theological_decisions:
- issue: Upeo na mwendelezo wa ahadi ya agano
  choice: Kusema moja kwa moja kwamba Mungu atalithibitisha agano lake pamoja na Isaka, nalo litahusu uzao wake baada yake.
  alternative: Kulipunguza kuwa ahadi ya kikabila au kitaifa pekee, au kulifanya moja kwa moja kuwa ufafanuzi wa teolojia ya baadaye ya Kikristo.
  rationale: Aya yenyewe inamtaja Isaka na uzao wake bila kufafanua kwa mifumo ya kiteolojia ya baadaye. Tafsiri inahifadhi dai hilo na mvutano wake bila kupanua wala kupunguza upeo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘La, bali’ huhifadhi msisitizo wa jibu; ‘mwana’ na ‘uzao’ huhifadhi mtindo wa kibiblia bila kuwa mgumu. Alama ya tanbihi imewekwa baada ya jina ambalo tanbihi inalifafanua.
