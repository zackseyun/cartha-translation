  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: sw
  text: Nitakufanya uwe na uzao mwingi mno, nitakufanya kuwa mataifa, na wafalme watatoka kwako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: Nitakufanya uzae
  rationale: Hifili ya פרה ina maana ya kusababisha kuzaa au kuwa na uzao mwingi. Kauli hii inadumisha maana ya kisababishi na ni ya kawaida katika Kiswahili.
- source_word: בִּמְאֹד מְאֹד
  choice: sana sana
  rationale: Kurudiwa kwa מְאֹד kunasisitiza ukubwa wa ahadi; “sana sana” kunahifadhi msisitizo huo kwa lugha rahisi na ya asili.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: nitakufanya kuwa mataifa
  rationale: 'Muundo נתן pamoja na ל unaonyesha matokeo: Abrahamu atakuwa chanzo au babu wa mataifa mengi. Tafsiri hii huhifadhi usemi wa chanzo bila kuufanya kuwa wa kinadharia.'
- source_word: לְגוֹיִם
  choice: mataifa
  rationale: גּוֹיִם humaanisha mataifa au jamii za watu; hapa “mataifa” linafaa kwa makundi mbalimbali yatakayotokana na Abrahamu, bila maana maalumu ya watu wasio Wayahudi.
- source_word: וּמְלָכִים
  choice: na wafalme
  rationale: מְלָכִים ni wafalme kwa usahihi; “watawala” lingekuwa pana zaidi kuliko neno la Kiebrania.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: watatoka kwako
  rationale: Tafsiri hii inafuata kwa karibu maana ya יצא, “kutoka,” huku katika muktadha ikieleweka kwamba wafalme hao watakuwa wazao wa Abrahamu.
theological_decisions:
- issue: Upeo wa wazao walioahidiwa Abrahamu
  choice: Abrahamu atakuwa chanzo cha mataifa mengi na wafalme watatokana naye.
  alternative: Kauli hiyo ingeweza kueleweka kwa njia ya kinadharia kuwa Abrahamu anapewa hadhi miongoni mwa mataifa.
  rationale: Muktadha wa karibu wa agano unasisitiza uzao na nasaba. Hata hivyo, tafsiri inadumisha muundo wa Kiebrania bila kuingiza mfumo wa kitheolojia wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uzae” hapa huhusu kuwa na uzao mwingi, na “watatoka kwako” huhifadhi picha ya Kiebrania ya asili au nasaba. Alama [a] ipo katika matini kuu.
