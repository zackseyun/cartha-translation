  text: Siku hiyo hiyo, Abrahamu na Ishmaeli mwanawe walitahiriwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Siku iyo hiyo
  rationale: Nahau hii inasisitiza kwamba jambo lilitokea katika siku ileile iliyotajwa. “Siku iyo hiyo” ni usemi wa kawaida wa Kiswahili unaohifadhi msisitizo huo wa wakati.
- source_word: נִמּוֹל
  choice: walitahiriwa
  rationale: Kitenzi ni cha kutendwa na, ingawa kwa umbo ni cha umoja kabla ya kiima ambatano, maana yake inawahusu Abrahamu na Ishmaeli wote wawili; kwa hiyo Kiswahili hutumia wingi “walitahiriwa.”
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וְיִשְׁמָעֵאל
  choice: na Ishmaeli
  rationale: Kiunganishi וְ kimetafsiriwa “na,” na jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Nomino yenye kiambishi cha nafsi ya tatu ya kiume inaonyesha kwamba Ishmaeli ni mwana wa Abrahamu. “Mwanawe” ni tafsiri fupi na ya asili inayohifadhi uhusiano huo.
