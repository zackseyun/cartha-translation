base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: sw
  text: Ndipo Abrahamu akaanguka kifudifudi, akacheka, akasema moyoni mwake, “Je, mwana atazaliwa kwa mtu mwenye umri wa miaka mia moja? Je, Sara, mwenye umri wa miaka tisini, atazaa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: akaanguka kifudifudi
  rationale: Muunganiko huu unaonyesha kuanguka au kujitupa chini uso ukielekea ardhini. ‘Akaanguka kifudifudi’ ni Kiswahili cha kawaida kinachohifadhi tendo na mkao.
- source_word: וַיִּצְחָק
  choice: akacheka
  rationale: Kitenzi צחק humaanisha kucheka; tafsiri hii pia hudumisha uhusiano wa kimuktadha na jina Isaka bila kueleza sababu au hali ya kicheko.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: akasema moyoni mwake
  rationale: Huhifadhi nahau ya Kiebrania na kuonyesha kwamba maneno haya hayakusemwa kwa sauti.
- source_word: הַלְּבֶן
  choice: Je, mwana
  rationale: Nomino בן kwa kawaida ni ‘mwana’ au ‘mwana wa kiume.’ Hapa ‘mwana’ ni ya asili katika Kiswahili na inadumisha uteuzi wa kileksia wa Kiebrania bila kulazimisha neno la jumla ‘mtoto.’
- source_word: יִוָּלֵד
  choice: atazaliwa
  rationale: Nifali ya ילד inaeleza kuzaliwa; ‘atazaliwa’ ni kilinganishi cha moja kwa moja na cha kawaida.
- source_word: לְבֶן מֵאָה שָׁנָה
  choice: kwa mtu mwenye umri wa miaka mia moja
  rationale: Kiebrania kina nahau ‘kwa mwana wa miaka mia moja.’ Kiswahili hiki kinawasilisha umri kwa uwazi na kwa mtindo wa kawaida.
- source_word: וְאִם
  choice: Je
  rationale: Katika mfululizo huu אם inaanzisha swali la pili la balagha. Kurudia ‘Je’ kunaleta Kiswahili cha asili bila kuifanya iwe sentensi ya masharti.
- source_word: הֲבַת תִּשְׁעִים שָׁנָה
  choice: mwenye umri wa miaka tisini
  rationale: Nahau halisi ‘binti wa miaka tisini’ inaeleza umri. Kiswahili hiki kinafikisha maana bila kuongeza nomino nyingine.
- source_word: תֵּלֵד
  choice: atazaa
  rationale: Qali ya ילד ikiwa na mwanamke kama mtenda ina maana ya kuzaa; ‘atazaa’ ni fupi, wazi, na ya kawaida.
theological_decisions:
- issue: Maana ya kicheko cha Abrahamu
  choice: Kutafsiri kwa upande wowote kama ‘akacheka’
  alternative: ‘akacheka kwa kutokuamini’ au ‘akacheka kwa furaha’
  rationale: Aya haitaji wazi kama kicheko hicho kilitokana na kutokuamini au furaha. Tafsiri haipaswi kuondoa mvutano huo wa simulizi.
- issue: Nguvu ya maswali ya Abrahamu
  choice: Kuyawasilisha kama maswali ya moja kwa moja ya balagha
  alternative: Kuyageuza kuwa kauli za kutokuamini au za kushangaa kwa uhakika
  rationale: Viambishi vya swali katika Kiebrania vinaacha msimamo wa ndani wa Abrahamu ukiwa na kiasi fulani cha utata; maswali ya moja kwa moja huhifadhi hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kifudifudi’ ni neno linaloeleweka kwa urahisi kwa mkao wa uso kuelekea chini. Muundo ni wa kisimulizi na hauongezi tathmini ya kitheolojia.
