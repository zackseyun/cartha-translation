  source_fidelity: 'Tafsiri inafuata kwa uaminifu mlolongo wa Kiebrania: Abrahamu anaanguka uso chini, anacheka, na kusema moyoni mwake. “Kifudifudi” huwasilisha vyema עַל־פָּנָיו, na maswali mawili ya balagha pamoja na umri wa miaka mia moja na tisini yamehifadhiwa. “Mwana” ni tafsiri halali ya בֵּן na haiondoi utata wowote wa kifasihi unaohitaji kubainishwa zaidi.'
