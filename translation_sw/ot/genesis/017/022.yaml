  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: sw
  text: Alipomaliza kusema naye, Mungu akapaa kutoka kwa Abrahamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu akapanda kutoka kwa Abrahamu.” Kiebrania kinatumia kitenzi chenye maana ya “kwenda juu/kupaa,” kikionyesha mwisho wa kujidhihirisha kwa Mungu kwa taswira ya mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Alipomaliza
  rationale: Kitenzi cha Kiebrania kinaonyesha tendo lililokamilika na, katika mfuatano huu, kinaweka mazingira ya wakati kwa tendo kuu linalofuata.
- source_word: לְדַבֵּר
  choice: kusema
  rationale: 'Baada ya ''maliza,'' Kiswahili cha kawaida hutumia kitenzi-jina: ''maliza kusema.'''
- source_word: אִתּוֹ
  choice: naye
  rationale: Kihusishi kinaonyesha mawasiliano ya pande mbili, yaani kusema na Abrahamu; 'naye' ni ya asili na yenye ufupi katika Kiswahili.
- source_word: וַיַּעַל
  choice: akapaa
  rationale: Neno עלה lina maana halisi ya kwenda juu au kupaa. 'Akapaa' huhifadhi taswira ya kuelekea juu bila kuibadili kuwa kuondoka kwa ujumla tu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi kimofolojia, kitenzi chake ni cha umoja na muktadha unamtaja Mungu mmoja.
- source_word: מֵעַל
  choice: kutoka kwa
  rationale: Kihusishi kina maana ya kutoka juu ya/kando ya; katika muktadha huu 'kutoka kwa Abrahamu' ni Kiswahili cha kawaida huku taswira ya kupaa ikibebwa na kitenzi.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili na matumizi mapana ya Kiswahili.
theological_decisions:
- issue: Maelezo yenye taswira ya mahali kuhusu Mungu kuondoka
  choice: 'Kuhifadhi lugha ya kuelekea juu: ''Mungu akapaa kutoka kwa Abrahamu'''
  alternative: Mungu akaondoka kwa Abrahamu
  rationale: Kiebrania kinatumia wazi kitenzi cha kupaa. Tafsiri inahifadhi namna simulizi linavyoeleza mwisho wa kujidhihirisha kwa Mungu bila kutoa hitimisho la ziada kuhusu Mungu kuwa na mipaka ya mahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo 'Alipomaliza ... akapaa' unasomeka kwa urahisi, na 'akapaa' huhifadhi taswira halisi ya Kiebrania.
