  text: אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖/י אִתָּ֑/ךְ וְ/הָיִ֕יתָ לְ/אַ֖ב הֲמ֥וֹן גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: sw
  text: Mimi[a], tazama, agano langu liko nawe, nawe utakuwa baba wa mataifa mengi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi—tazama, agano langu liko nawe.” Kiwakilishi cha mwanzo na chembe hii zimetiliwa mkazo katika Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “baba wa umati wa mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Mimi nami
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo. ‘Mimi nami’ huonyesha kwa Kiswahili cha kawaida badiliko la usemi kuelekea upande wa Mungu bila kuongeza maana mpya.
- source_word: הִנֵּה
  choice: tazama
  rationale: Chembe hii huvuta fikira kwa uzito kwenye tamko linalofuata; ‘tazama’ huhifadhi nguvu hiyo katika lugha ya kibiblia inayoeleweka.
- source_word: בְרִיתִי
  choice: agano langu
  rationale: ‘Agano’ ndilo neno la kawaida na lenye uzito wa muktadha kwa בְּרִית katika simulizi la Abrahamu.
- source_word: אִתָּךְ
  choice: ni pamoja nawe
  rationale: Hutoa maana ya moja kwa moja ya ‘with you’ bila kupanua kuwa ‘kati yangu na wewe,’ jambo ambalo halijasemwa wazi hapa.
- source_word: וְהָיִיתָ
  choice: nawe utakuwa
  rationale: Muundo una nguvu ya wakati ujao au matokeo katika tamko la agano. ‘Utakuwa’ huhifadhi uwezekano wa kueleweka kama hali au nafasi atakayopewa, bila kulazimisha wazo la mabadiliko kwa kitenzi ‘kuwa’.
- source_word: לְאָב
  choice: baba wa
  rationale: Hii ni tafsiri ya asili na ya moja kwa moja ya jukumu linalotajwa; Kiswahili hakihitaji kibainishi cha Kiingereza ‘a/the’.
- source_word: הֲמוֹן
  choice: mengi
  rationale: Katika kirai ‘mataifa mengi,’ Kiswahili huwasilisha kwa kawaida wingi mkubwa unaomaanishwa na הֲמוֹן. Tanbihi huhifadhi tafsiri ya karibu zaidi ‘umati wa mataifa.’
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Neno hili linarejelea mataifa au makundi ya watu kwa upana, wala si lazima ‘Watu wa Mataifa’ kwa maana ya baadaye ya kiufundi.
theological_decisions:
- issue: Muundo wa agano na jukumu la Abrahamu
  choice: agano langu ni pamoja nawe, nawe utakuwa baba wa mataifa mengi
  alternative: ninafanya agano langu nawe; nawe utakuwa babu wa mataifa mengi
  rationale: Tafsiri inadumisha tamko la uhusiano wa agano na ahadi yake bila kuongeza kitendo cha ‘kufanya’ ambacho hakijaelezwa wazi, wala kubadili sitiari ya ‘baba’ kuwa ‘babu’ au ‘babu wa jadi.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Tazama’ na ‘agano’ huhifadhi uzito wa tamko la kibiblia; ‘pamoja nawe’ ni ya asili kuliko ‘na wewe’ baada ya ‘ni.’ Alama zote za tanbihi zimewekwa katika matini kuu.
