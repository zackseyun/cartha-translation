lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: Naye Ishmaeli
  rationale: Kiunganishi ו kinaendeleza simulizi; “Naye” ni mtiririko wa kawaida wa Kiswahili na linaunganisha mstari huu na uliotangulia bila kuongeza maana.
- source_word: בְּנ֔/וֹ
  choice: mwanawe
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja inamtambulisha Ishmaeli moja kwa moja kuwa mwana wake Abrahamu.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: alikuwa na umri wa miaka kumi na mitatu
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; imetolewa kwa Kiswahili cha sasa na cha kawaida.
- source_word: בְּ/הִמֹּל/וֹ
  choice: alipotahiriwa
  rationale: ב pamoja na kitenzi-jina huonyesha wakati, na umbo la Niphal lina maana ya kutendwa; “alipotahiriwa” huhifadhi maana zote mbili kwa ufupi na kwa kawaida.
- source_word: אֵת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni alama ya yambwa mahususi katika Kiebrania na halina neno huru linalolingana nalo katika Kiswahili.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: nyama ya govi lake
  rationale: Utoaji huu unahifadhi maneno halisi ya Kiebrania kuhusu sehemu iliyohusika katika tohara badala ya kuyafupisha kuwa “alipotahiriwa” pekee.
