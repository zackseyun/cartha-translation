  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: sw
  text: Lakini pia nitalihukumu taifa ambalo watalitumikia[a], na baada ya hayo watatoka wakiwa na mali nyingi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambalo watakuwa watumwa wake.” Kitenzi cha Kiebrania humaanisha kihalisi “kutumikia,” lakini katika muktadha kinahusu utumishi wa kulazimishwa chini ya taifa la kigeni.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakiwa na utajiri mwingi” au “wakiwa na vitu vingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Lakini pia
  rationale: Kiunganishi וְ pamoja na גַם kinaendeleza usemi huku kikiongeza mkazo. Katika muktadha huu, “Lakini pia” linaonyesha tofauti kati ya mateso ya uzao wa Abramu na hukumu ya taifa linalowatesa, bila kupoteza maana ya nyongeza.
- source_word: הַגּוֹי
  choice: taifa
  rationale: גּוֹי humaanisha taifa au watu; hapa ni mamlaka ya kigeni ambayo uzao wa Abramu utaitumikia. “Taifa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: ambalo watalitumikia
  rationale: Kitenzi עבד katika qal humaanisha kutumikia au kufanya kazi kwa ajili ya mwingine. Tafsiri hii huhifadhi usemi wa Kiebrania; katika muktadha huduma hiyo ni ya kulazimishwa, jambo linaloelezwa katika tanbihi bila kuingizwa kimya kimya katika matini kuu.
- source_word: דָּן אָנֹכִי
  choice: nitalihukumu
  rationale: Kishiriki דָּן pamoja na kiwakilishi אָנֹכִי kinaonyesha tendo la nafsi ya kwanza kwa mkazo, lenye maana ya wakati ujao katika muktadha. “Nitalihukumu” huhifadhi lugha ya kimahakama badala ya kuifupisha kuwa adhabu pekee.
- source_word: וְאַחֲרֵי כֵן
  choice: na baada ya hayo
  rationale: Kirai hiki huonyesha mfuatano wa matukio. “Na baada ya hayo” ni Kiswahili cha kawaida na huhifadhi mpito wa wakati.
- source_word: יֵצְאוּ
  choice: watatoka
  rationale: יצא humaanisha kutoka au kwenda nje. “Watatoka” ni ya moja kwa moja na inafaa kwa kuondoka katika nchi ya utumwa.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: wakiwa na mali nyingi
  rationale: רְכוּשׁ ni mali, vitu vinavyomilikiwa, au bidhaa. “Mali nyingi” ni usemi wa asili wa Kiswahili unaohifadhi wingi wa vitu walivyomiliki bila kuifanya maana kuwa utajiri wa fedha tu.
theological_decisions:
- issue: Asili ya tendo la Mungu dhidi ya taifa linalowatumikisha
  choice: nitalihukumu
  alternative: nitaiadhibu
  rationale: דָּן ni lugha ya hukumu ya kimahakama. “Nitalihukumu” huhifadhi upana wa tendo la kutoa hukumu bila kulifanya limaanishe tu matokeo ya adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida; “kulihukumu taifa” huhifadhi taswira ya kimahakama, na “mali nyingi” huepuka lugha nzito isiyo ya lazima.
