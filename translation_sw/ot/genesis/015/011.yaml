  yaml_path: translation/ot/genesis/015/011.yaml
  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: sw
  text: Ndege wawindaji wakashuka juu ya mizoga[a], naye Abramu akawafukuza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndege mwindaji akashuka juu ya mizoga.” Nomino ya Kiebrania inaweza kueleweka kuwa ya umoja yenye maana ya kundi; hapa yaelekea inamaanisha ndege kadhaa wanaokula mizoga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: wakashuka
  rationale: Kitenzi ירד kina maana ya kushuka. Umbo hili la masimulizi linaonyesha ndege wakielekea chini kwenye mizoga.
- source_word: הָעַיִט
  choice: ndege wawindaji
  rationale: עַיִט inaweza kuwa nomino ya umoja yenye maana ya mkusanyiko wa ndege wanaokula nyama. Wingi unaendana vizuri na tukio hili bila kuifinyanga maana iwe tai au tumbusi pekee.
- source_word: הַפְּגָרִים
  choice: mizoga
  rationale: פֶּגֶר humaanisha mzoga au mwili uliokufa; hapa inarejelea wanyama waliochinjwa, hivyo 'mizoga' ni sahihi kuliko 'vipande'.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: akawafukuza
  rationale: Hifili ya שוב hapa ina maana ya kuwafanya warudi au waondoke; 'akawafukuza' ni Kiswahili cha kawaida kinachoonyesha tendo la Abramu la kuwaondoa ndege.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Jina limetoholewa kwa desturi ya Kiswahili; katika hatua hii ya simulizi bado ni Abramu, si Abrahamu.
