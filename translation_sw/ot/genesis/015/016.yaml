  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: sw
  text: Nao katika kizazi cha nne watarudi hapa, kwa maana uovu wa Waamori[a] bado haujafikia kiwango chake kamili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu wa Mwamori,” neno “Mwamori” likitumiwa kwa maana ya pamoja kuhusu watu hao.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “mpaka hapa”; katika muktadha maana ni kwamba hadi wakati huo uovu wa Waamori utakuwa bado haujafikia kiwango chake kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ד֥וֹר רְבִיעִ֖י
  choice: Nao katika kizazi cha nne
  rationale: דּוֹר ni ‘kizazi,’ na רְבִיעִי ni kivumishi cha mpangilio ‘cha nne.’ ‘Katika kizazi cha nne’ ni Kiswahili cha kawaida kinachoonyesha wakati wa kurudi; ‘Nao’ huendeleza simulizi na kuwaelekeza wasomaji kwa wazao waliotajwa katika muktadha.
- source_word: יָשׁ֣וּבוּ
  choice: watarudi
  rationale: Kitenzi שׁוּב hapa kinaonyesha kurudi kwa wazao wa Abramu katika nchi hii; ‘watarudi’ huhifadhi maana ya mwendo bila kuongeza ufafanuzi usiotajwa.
- source_word: הֵ֑נָּה
  choice: hapa
  rationale: Kielezi hiki huelekeza mahali ambapo msemaji yupo au anapoonyesha. ‘Hapa’ ni cha asili na sahihi katika muktadha.
- source_word: כִּ֧י
  choice: kwa maana
  rationale: כִּי inaanzisha sababu ya kuchelewa kwa kurudi kwao. ‘Kwa maana’ hudumisha uhusiano huo wa maelezo kwa mtindo wenye heshima.
- source_word: לֹא שָׁלֵ֛ם
  choice: bado haujafikia kiwango chake kamili
  rationale: שָׁלֵם hapa huonyesha kutimia au kufikia kipimo kamili. Muundo huu wa Kiswahili unaonyesha wazi hali ya kutokamilika inayodumu hadi wakati uliowekwa.
- source_word: עֲוֺ֥ן
  choice: uovu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu ya hatia. Katika muktadha huu, ‘uovu’ huwasilisha vyema tabia ya maadili ambayo bado haijafikia kipimo kamili, bila kuifanya iwe hisia ya hatia tu.
- source_word: הָ/אֱמֹרִ֖י
  choice: Waamori
  rationale: Ingawa Kiebrania kina umbo la umoja, jina hilo linaweza kutumiwa kwa maana ya pamoja kuhusu kundi la watu. Kiswahili hutumia kwa kawaida wingi ‘Waamori.’
- source_word: עַד הֵנָּה
  choice: bado
  rationale: Kirai hiki kina maana halisi ya ‘mpaka hapa’ na katika muktadha huweka kikomo cha wakati. ‘Bado’ huingiza maana hiyo kwa kawaida katika sentensi, huku maelezo ya chini yakihifadhi muundo na uwezekano wa maana ya wakati.
theological_decisions:
- issue: Kucheleweshwa kwa hukumu na kurudi kwa wazao wa Abramu
  choice: Mstari unaunganisha wakati wa kurudi kwao na uovu wa Waamori ambao bado haujafikia kiwango chake kamili.
  alternative: Kusema wazi kwamba kuchelewa huko kimsingi kunaonyesha uvumilivu wa Mungu kwa Waamori, au kwamba kusudi lake kuu ni kuwajenga Waisraeli huko Misri.
  rationale: Andiko lenyewe linatoa kutokamilika kwa uovu wa Waamori kuwa sababu inayohusiana na wakati huo, lakini halifafanui nadharia pana zaidi ya majaliwa au kusudi la Mungu. Tafsiri inadumisha mvutano huo bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Kiwango chake kamili’ ni usemi wa asili unaohifadhi taswira ya uovu kufikia kipimo chake bila kufafanua zaidi hukumu inayofuata.
