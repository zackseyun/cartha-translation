  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: sw
  text: Kisha akamtoa nje, akamwambia, “Tazama, tafadhali, angani, na uhesabu nyota, ikiwa unaweza kuzihesabu.” Kisha akamwambia, “Ndivyo uzao wako[a] utakavyokuwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbegu yako”; nomino ya Kiebrania iko katika umbo la umoja lakini ina maana ya kijumla, na inaweza kurejelea wazao kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: akamtoa nje
  rationale: Muundo wa kisababishi wa יצא unaonyesha kumfanya mtu atoke; “akamtoa nje” ni wa kawaida na huhifadhi maana hiyo pamoja na mwelekeo wa הַחוּצָה.
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: Tafadhali tazama mbinguni
  rationale: “Tazama” huwasilisha amri הַבֶּט, “tafadhali” huonyesha nguvu ya נָא, na “mbinguni” huonyesha mwelekeo wa kiambishi cha mwisho katika הַשָּׁמַיְמָה kwa Kiswahili cha kawaida.
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: na uzihesabu nyota
  rationale: “Kuhesabu” ni kisawe cha moja kwa moja cha ספר katika muktadha huu, na kiambishi “-zi-” hurejelea nyota kwa uwazi.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: kama utaweza kuzihesabu
  rationale: Tafsiri hii huhifadhi sharti na msisitizo wa uwezo uliomo katika תּוּכַל.
- source_word: כֹּה יִהְיֶה
  choice: Ndivyo ... utakavyokuwa
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida ulinganisho wa כֹּה pamoja na hali ya wakati ujao.
- source_word: זַרְעֶךָ
  choice: uzao wako
  rationale: “Uzao” ni nomino ya umoja yenye maana ya kijumla, hivyo ni ya kawaida kwa Kiswahili na haiamui kimbele kama rejeleo ni mmoja au wengi.
theological_decisions:
- issue: Tafsiri ya זַרְעֶךָ katika ahadi ambayo inaweza kuwa na mwangwi wa umoja na wa kijumla
  choice: uzao wako
  alternative: mbegu yako; wazao wako
  rationale: “Uzao” huhifadhi hali ya nomino ya umoja na maana yake ya kijumla. “Wazao” ingeweka wingi wazi zaidi kuliko Kiebrania, na “mbegu” ingekuwa ya moja kwa moja zaidi lakini si ya kawaida katika Kiswahili cha sasa inapomaanisha watu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “kuhesabu” na mpangilio wa kauli zimehifadhiwa ili kudumisha msisitizo wa Kiebrania. Viwakilishi vya mtendaji vimeachwa bila majina, kama katika mstari wa Kiebrania, kwa kuwa muktadha hutambulisha wahusika.
