base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: sw
  text: Naye akasema, “Bwana Yahwe, nitajuaje kwamba nitamiliki nchi hiyo[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitairithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Naye akasema
  rationale: Umbo la simulizi wayyiqtol la אמר linaendeleza masimulizi; ‘Naye akasema’ ni la kawaida na la asili katika Kiswahili.
- source_word: אֲדֹנָי יֱהוִה
  choice: Bwana Yahwe
  rationale: Huhifadhi cheo אֲדֹנָי na jina la agano יהוה bila kuvichanganya; ‘Bwana Yahwe’ ni namna ya heshima na iliyo wazi katika Kiswahili.
- source_word: בַּמָּה אֵדַע
  choice: nitajuaje
  rationale: 'בַּמָּה ni ‘kwa njia gani/kwa nini,’ na pamoja na אֵדַע huunda swali la asili la Kiswahili kuhusu njia ya kupata uhakika: ‘nitajuaje.’'
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי huanzisha maudhui ya jambo ambalo Abramu anataka kulijua; ‘kwamba’ ni kiunganishi cha kawaida cha Kiswahili.
- source_word: אִירָשֶׁנָּה
  choice: nitamiliki nchi hiyo
  rationale: Kitenzi ירשׁ kinaweza kumaanisha kurithi au kumiliki/kutwaa umiliki. ‘Nitamiliki nchi hiyo’ kinaonyesha wazi umiliki wa nchi iliyotajwa katika mstari uliotangulia; kirai kamili kimetumiwa badala ya kiwakilishi pekee ili rejeleo liwe la asili na wazi kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu katika אֲדֹנָי יֱהוִה
  choice: Bwana Yahwe
  alternative: Bwana MUNGU
  rationale: ‘Yahwe’ linawakilisha moja kwa moja jina יהוה, huku ‘Bwana’ likiwakilisha אֲדֹנָי; hivyo vipengele vyote viwili vya mwito vinabaki dhahiri.
- issue: Maana ya ירשׁ kuhusu nchi iliyoahidiwa
  choice: nitamiliki nchi hiyo
  alternative: nitairithi
  rationale: Muktadha unahusu kuingia katika umiliki halisi wa nchi, lakini maana ya ‘kurithi’ yenye mguso wa ahadi ya agano pia inawezekana; kwa hiyo imehifadhiwa katika tanbihi badala ya kutupiliwa mbali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali ni wa kawaida kwa wasomaji wengi, huku jina ‘Yahwe’ na uwezekano wa maana mbili wa ירשׁ vikihifadhiwa.
