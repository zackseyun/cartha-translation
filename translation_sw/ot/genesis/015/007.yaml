  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: sw
  text: Akamwambia, “Mimi ni Yahweh, niliyekutoa katika Uru ya Wakaldayo ili nikupe nchi hii uimiliki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Akamwambia
  rationale: Muundo huu wa kawaida wa masimulizi unaendeleza tukio, na Kiswahili huunganisha kwa asili kitenzi, kiambishi cha mtendwa, na maana ya ‘akamwambia.’
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahweh
  rationale: Sentensi isiyo na kitenzi katika Kiebrania huhitaji ‘ni’ katika Kiswahili; ‘Mimi’ huhifadhi msisitizo wa אֲנִי, na jina la agano limetoholewa kuwa ‘Yahweh.’
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: niliyekutoa
  rationale: Kiwakilishi cha uhusiano na kausativi ya יצא vinaelezwa kwa Kiswahili cha kawaida kama ‘niliyekutoa,’ yaani aliyesababisha Abramu atoke.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: Uru ya Wakaldayo
  rationale: Huhifadhi jina la mahali Uru pamoja na utambulisho wa watu wa eneo hilo kwa namna inayoeleweka katika Kiswahili.
- source_word: לָתֶת לְךָ
  choice: ili nikupe
  rationale: Infinitivi yenye ל inaonyesha kusudi; ‘ili nikupe’ hutoa maana hiyo wazi na kwa mtiririko wa asili.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: Huu ndio mpangilio wa kawaida wa nomino na kionyeshi katika Kiswahili.
- source_word: לְרִשְׁתָּהּ
  choice: uimiliki
  rationale: ירשׁ hapa inahusu kuipokea na kuishikilia nchi. ‘Uimiliki’ huhifadhi kiwakilishi cha kitu cha Kiebrania na maana pana ya kumiliki bila kuilazimisha iwe urithi wa kifamilia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Maana ya לְרִשְׁתָּהּ
  choice: uimiliki
  alternative: uirithi au uitwae kuwa milki yako
  rationale: Kitenzi ירשׁ kinaweza kumaanisha kumiliki, kurithi, au kutwaa milki kulingana na muktadha. ‘Uimiliki’ ni pana na hakiongezi wazo maalumu la urithi wa kifamilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo ni wa masimulizi ya kawaida; msisitizo wa ‘Mimi’ umehifadhiwa, na hakuna istilahi ya kidhehebu iliyoingizwa.
