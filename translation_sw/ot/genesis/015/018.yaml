  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: sw
  text: Siku hiyo Yahweh alifanya agano na Abramu[a], akisema, “Nimeupa uzao wako nchi hii, kuanzia mto wa Misri[b] mpaka mto mkubwa, yaani Mto Frati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi ya Kiebrania, “alikata agano,” nahau inayomaanisha kufanya agano na ambayo huenda inahusiana na desturi ya agano inayoonyeshwa katika kifungu kinachozunguka.
    reason: lexical_alternative
  - marker: b
    text: Au “kijito cha Misri” au “wadi wa Misri.” Kiebrania kinasema “mto wa Misri,” lakini utambulisho sahihi wa eneo hilo unabishaniwa.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Ni usemi wa kawaida na wa asili katika Kiswahili unaoonyesha tukio maalumu.
- source_word: כָּרַת ... בְּרִית
  choice: alifanya agano
  rationale: Nahau ya Kiebrania ina maana halisi ya ‘alikata agano’; ‘alifanya agano’ huwasilisha maana yake kwa Kiswahili cha kawaida, huku tafsiri halisi ikihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֶת אַבְרָם
  choice: na Abramu
  rationale: Ingawa Abramu amewekwa kama yambwa katika muundo wa Kiebrania, Kiswahili cha kawaida husema kufanya agano ‘na’ mtu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni utangulizi wa kawaida wa maneno ya agano yanayofuata.
- source_word: לְזַרְעֲךָ
  choice: uzao wako
  rationale: ‘Uzao’ huhifadhi maana ya nomino ya pamoja ya זֶרַע bila kuilazimisha iwe kizazi kimoja au watu wengi mmoja mmoja.
- source_word: נָתַתִּי
  choice: Nimewapa
  rationale: Kauli timilifu ya Kiebrania imehifadhiwa kwa wakati timilifu wa Kiswahili, ikiwasilisha ardhi kama zawadi iliyotolewa kwa uhakika katika tamko la agano.
- source_word: הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: ‘Nchi’ ni neno la asili katika muktadha wa eneo linalotolewa na lenye mipaka.
- source_word: מִנְּהַר מִצְרַיִם
  choice: kuanzia mto wa Misri
  rationale: נָהָר kwa kawaida humaanisha ‘mto’; utambulisho sahihi wa mahali hapa unabaki na mjadala na umeelezwa katika tanbihi.
- source_word: עַד הַנָּהָר הַגָּדֹל
  choice: mpaka mto mkubwa
  rationale: ‘Mpaka’ huonyesha kwa kawaida kikomo cha eneo kinachodokezwa na עַד.
- source_word: נְהַר פְּרָת
  choice: yaani Mto Frati
  rationale: Nomino hii inafafanua ‘mto mkubwa’; ‘Mto Frati’ ni jina la kawaida la Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Hali ya tendo katika tamko נָתַתִּי
  choice: Nimewapa
  alternative: Ninawapa; Niliwapa
  rationale: Wakati timilifu huhifadhi tamko la agano kama utoaji uliohakikishwa, bila kuamua kimya kimya kwamba umiliki wote wa kihistoria ulikuwa tayari umetimizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umewekwa wa asili katika Kiswahili, huku vipengele vya msingi vya Kiebrania—jina Yahweh, uzao wa pamoja, wakati timilifu wa utoaji, na mipaka ya nchi—vikihifadhiwa.
