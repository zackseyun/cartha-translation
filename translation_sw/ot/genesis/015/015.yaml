  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתָּ֛ה תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ בְּ/שָׁל֑וֹם תִּקָּבֵ֖ר בְּ/שֵׂיבָ֥ה טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: sw
  text: Nawe[a], utaenda kwa baba zako kwa amani; utazikwa katika uzee mwema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mababu zako.” Kiebrania kinasema kihalisi, “kwa baba zako,” nahau ya kufa na kuungana na vizazi vilivyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Kwa habari yako
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha mabadiliko ya mada na kumweka Abramu kinyume na habari iliyotangulia kuhusu wazao wake. ‘Kwa habari yako’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: תָּב֥וֹא
  choice: utaenda
  rationale: Kitenzi hiki cha mwendo, kinapotumiwa pamoja na ‘kwa baba zako,’ ni sehemu ya nahau ya kufa. ‘Utaenda’ ni ya kawaida na inafaa zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ‘utakuja.’
- source_word: אֶל אֲבֹתֶיךָ
  choice: kwa baba zako
  rationale: Hii inadumisha picha halisi ya Kiebrania na nahau ya kuungana na vizazi vilivyotangulia. ‘Kwa mababu zako’ ni tafsiri mbadala ya maana.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Neno שָׁלוֹם lina maana za amani, uzima kamili, na hali njema. ‘Kwa amani’ ni usemi mfupi na wa kawaida unaohifadhi upana wa msingi wa maana.
- source_word: תִּקָּבֵר
  choice: utazikwa
  rationale: Hii ni kauli ya kutendwa ya kawaida inayomaanisha kuzikwa; ‘utazikwa’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: katika uzee mwema
  rationale: Kirai hiki kinaonyesha umri mkubwa unaotazamwa kuwa jambo jema. ‘Katika uzee mwema’ huhifadhi muundo na tathmini chanya ya Kiebrania bila kuongeza wazo lisilokuwamo.
theological_decisions:
- issue: Maana ya ‘utaenda kwa baba zako’
  choice: Nahau ya kifo cha Abramu na kuungana kwake na vizazi vilivyotangulia, bila kufafanua zaidi hali ya maisha baada ya kifo.
  alternative: Kurejelea kuzikwa kimwili pamoja na mababu, au kudai ushirika wenye ufahamu pamoja nao baada ya kifo.
  rationale: Usemi huu ni namna iliyozoeleka ya kuzungumzia kifo. Kwa kuwa Abramu hangezikwa kihalisi pamoja na baba zake wa karibu, maana yake inapita maziko ya kimwili pekee; hata hivyo, aya haifafanui hali ya waliokufa. Nahau imehifadhiwa ili kutotatua mvutano huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi ulinganifu wa vipashio viwili vya Kiebrania, na nahau ya ‘baba zako’ imeachwa katika matini huku maana yake ikifafanuliwa katika tanbihi.
