  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: sw
  text: Na tazama, neno la BWANA likamjia, likisema, “Mtu huyu hatakuwa mrithi wako; bali atakayetoka katika mwili wako mwenyewe ndiye atakayekuwa mrithi wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inadumisha kishazi cha Kiebrania kinachovuta fikira kwenye ufunuo unaofuata, kwa mtindo wa heshima unaoeleweka katika Kiswahili.
- source_word: דְבַר יְהוָה
  choice: neno la BWANA
  rationale: ‘Neno’ linawakilisha דָּבָר, na ‘BWANA’ linafuata desturi ya tafsiri ya jina la agano יהוה bila kuingiza matamshi yenye ubishi.
- source_word: לֹא יִירָשְׁךָ זֶה
  choice: Mtu huyu hatakuwa mrithi wako
  rationale: Kiwakilishi זֶה kinamrejelea Eliezeri aliyetajwa katika muktadha; ‘mtu huyu’ huweka rejeo hilo wazi kwa kawaida bila kuongeza utambulisho wake ndani ya aya.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: atakayetoka katika mwili wako mwenyewe
  rationale: Nahau ya Kiebrania, kihalisi ‘atakayetoka katika viungo vyako vya ndani,’ inaashiria mzao wa kimwili; tafsiri hii ni ya kawaida na yenye staha.
- source_word: הוּא יִירָשֶׁךָ
  choice: ndiye atakayekuwa mrithi wako
  rationale: Muundo wa ‘ndiye’ unahifadhi msisitizo wa kiwakilishi הוּא.
theological_decisions:
- issue: Aina ya urithi unaotajwa
  choice: mrithi wako
  alternative: atakayerithi mali yako
  rationale: Kiebrania hakitaji mali pekee; usemi mpana unadumisha upeo na mvutano wa muktadha kuhusu mrithi wa Abramu.
- issue: Asili ya mrithi aliyeahidiwa
  choice: atakayetoka katika mwili wako mwenyewe
  alternative: mwana wako mwenyewe
  rationale: Chanzo kinasema kwamba mrithi atatoka katika mwili wa Abramu, lakini hakitumii hapa neno la moja kwa moja ‘mwana’; chaguo hili haliongezi ufafanuzi kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unahifadhi msisitizo na ulinganifu wa Kiebrania bila kuwa mgumu kupita kiasi.
