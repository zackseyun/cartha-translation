  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: sw
  text: Jua lilipokuwa linakaribia kutua, usingizi mzito ukamwangukia Abramu.[a] Na tazama, hofu kuu ya giza[b] ilikuwa ikimwangukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Abramu alipatwa na hali ya njozi.” Neno la Kiebrania linaweza kumaanisha usingizi mzito usio wa kawaida, labda uliosababishwa na Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hofu kuu ya kutisha yenye giza” au “hofu kuu yenye giza.” Kiebrania huunganisha kwa mkato mawazo ya hofu na giza katika kifungu chenye taswira hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: Jua lilipokuwa likielekea kutua
  rationale: Muundo huu unaanzisha wakati wa tukio huku לָבוֹא ikionyesha jua likikaribia kutua; Kiswahili hiki ni cha kawaida na huhifadhi hali ya mchakato.
- source_word: תַרְדֵּמָה
  choice: usingizi mzito
  rationale: Neno hili kimsingi humaanisha usingizi mzito sana, ambao katika muktadha huu huenda ulisababishwa na Mungu; 'hali ya maono' ingekuwa tafsiri yenye ufasiri zaidi.
- source_word: נָפְלָה עַל אַבְרָם
  choice: ukamwangukia Abramu
  rationale: Huhifadhi taswira ya Kiebrania ya jambo kumwangukia mtu na pia mtiririko wa simulizi.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Huhifadhi mwito wa ghafla wa msomaji atazame tukio kwa uzito na uhai.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: hofu kuu yenye giza
  rationale: Huhifadhi mkusanyiko wa mawazo ya hofu, ukubwa, na giza bila kulazimisha uhusiano mmoja tu wa kisarufi kati ya hofu na giza.
- source_word: נֹפֶלֶת עָלָיו
  choice: ilikuwa ikimwangukia
  rationale: Huhifadhi hali hai na inayoendelea ya participle ya Kiebrania, tofauti na kitenzi kilichotangulia cha tukio lililotimizwa.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili kabla ya kubadilishwa kuwa Abrahamu.
theological_decisions:
- issue: Asili ya תַרְדֵּמָה katika muktadha wa ufunuo
  choice: usingizi mzito
  alternative: hali ya maono
  rationale: Neno la Kiebrania lenyewe humaanisha moja kwa moja usingizi mzito; muktadha unaweza kudokeza usingizi uliosababishwa na Mungu, lakini maandishi hayalazimishi kutafsiri hali hiyo moja kwa moja kuwa maono.
- issue: Uhusiano wa hofu na giza katika אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: hofu kuu yenye giza
  alternative: hofu kuu ya giza
  rationale: Kifungu cha Kiebrania ni kifupi na chenye msongamano wa maana. Tafsiri iliyochaguliwa huhifadhi giza kama sifa inayofungamana na hofu bila kuamua kwamba giza ndilo chanzo cha hofu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Na tazama' huhifadhi uzito wa וְהִנֵּה. Kifungu 'hofu kuu yenye giza' kimeachwa bila tanbihi ya pili kwa sababu Kiswahili hicho kinabeba kwa ufupi ukaribu wa hofu na giza katika Kiebrania.
