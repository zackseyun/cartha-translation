  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: sw
  text: Basi Abramu akamletea wanyama hao wote,[a] akawakata katikati, akaweka kila kipande kukabiliana na kile kingine;[b] lakini wale ndege hakuwakata katikati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajitwalia wanyama hao wote.” Kiebrania kinaweza kueleweka hivyo, ingawa muktadha unaunga mkono maana ya kwamba Abramu alimletea Mungu wanyama hao.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “akaweka kila kipande kukabili mwenzake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: Basi Abramu akamletea vitu hivyo vyote
  rationale: Katika muktadha wa amri ya mstari wa 9, לוֹ inaeleweka kwa kawaida kuwa ‘kwake,’ yaani kwa Mungu. ‘Akamletea’ huwasilisha tendo la kutwaa na kuleta wanyama hao kwake kwa Kiswahili cha kawaida; jina Abramu limewekwa wazi ili kuepuka utata wa viwakilishi.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: akavikata vipande viwili
  rationale: Kitenzi בתר kinaeleza kugawanya mizoga, hasa katika mazingira ya kufanya agano. ‘Kukata vipande viwili’ ni usemi wa kawaida unaohifadhi picha halisi ya mgawanyo huo.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: akaweka kila kipande kuelekeana na mwenzake
  rationale: Nahau ya mgawanyo אִישׁ ... רֵעֵהוּ ina maana ya kila kimoja na mwenzake. ‘Kuelekeana’ huonyesha mpangilio wa vipande vilivyowekwa upande mmoja kukabili upande mwingine bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: lakini ndege hakuwakata vipande viwili
  rationale: הַצִפֹּר ni umoja wenye maana ya kijumla unaowarejelea ndege waliotajwa mstari uliotangulia; wingi ‘ndege’ na kiambishi ‘-wa-’ huwasilisha rejeo hilo kwa uwazi. Kurudia ‘vipande viwili’ huonyesha kwamba kitendo kilekile hakikufanywa kwa ndege.
theological_decisions:
- issue: Lugha ya desturi ya kukata agano
  choice: Matendo yameelezwa kwa picha halisi ya wanyama kukatwa na vipande kuwekwa vikielekeana.
  alternative: Kuongeza wazi kwamba hiyo ilikuwa desturi ya kufanya agano.
  rationale: Mstari unaeleza maandalizi ya tukio la agano, lakini hauyafafanui ndani ya sentensi. Tafsiri huhifadhi mwangwi wa agano wa בתר bila kuingiza ufafanuzi wa kitheolojia katika matini.
- issue: Rejeo la לוֹ
  choice: ‘akamletea,’ likimrejelea Mungu kwa kuzingatia amri ya mstari wa 9.
  alternative: ‘akajitwalia’ au ‘akachukua kwa ajili yake mwenyewe.’
  rationale: Ingawa dative ya kujirejelea inawezekana kisarufi, mwendelezo wa קָחָה לִי katika mstari wa 9 unaunga mkono maana kwamba Abramu aliwaleta kwa Mungu. Tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Basi’ huendeleza simulizi; ‘Abramu’ huondoa utata wa kiima. Alama zote za tanbihi zimewekwa katika matini kuu.
