reference: Genesis 15:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: sw
  text: Baada ya mambo haya, neno la Yahweh likamjia Abramu katika maono, likisema, “Usiogope, Abramu. Mimi ni ngao kwako; thawabu yako itakuwa kubwa sana.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi ni ngao yako; thawabu yako ni kubwa mno.” Kiebrania hakitaji wazi ikiwa thawabu hiyo “ni” kubwa au “itakuwa” kubwa.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo haya
  rationale: Kirai hiki ni fomula ya wakati. “Mambo” huhifadhi upana wa דְּבָרִים bila kuamua kuwa ni maneno yaliyosemwa tu au matukio yaliyotangulia.
- source_word: דְבַר יְהוָה
  choice: neno la Yahwe
  rationale: Huhifadhi muundo wa Kiebrania na usemi unaotambulika wa ufunuo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetolewa kwa umbo la Kiswahili linalokaribia matamshi ya YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: likamjia Abramu
  rationale: Ni Kiswahili cha kawaida kwa tukio ambalo neno la Mungu linamfikia mtu, bila kufuata kwa ukakasi muundo wa “likawa kwa Abramu.”
- source_word: בַּמַּחֲזֶה
  choice: katika maono
  rationale: Nomino hiyo inaashiria ufunuo unaoonekana katika maono; usemi huu ni wa kawaida na wazi kwa wasomaji wa sasa.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Huhifadhi kiunganishi cha Kiebrania kinachoanzisha maneno ya moja kwa moja, huku ngeli ikirejelea “neno.”
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja, la kawaida na lenye hadhi katika Kiswahili cha kisasa.
- source_word: מָגֵן לָךְ
  choice: ngao kwako
  rationale: Kiebrania hakitumii kiambishi cha umilikaji katika “ngao,” bali kihusishi chenye maana ya “kwa ajili yako/kwako.” Tafsiri hii huhifadhi tofauti hiyo.
- source_word: שְׂכָרְךָ
  choice: thawabu yako
  rationale: Neno linaweza kumaanisha ujira, malipo au thawabu. “Thawabu” linafaa katika muktadha huu wa ahadi bila kupunguza maana kuwa mshahara wa kazi tu.
- source_word: הַרְבֵּה מְאֹד
  choice: itakuwa kubwa sana
  rationale: Kifungu cha Kiebrania hakina kitenzi kilichoandikwa. Kitenzi cha wakati ujao kimejazwa kwa sababu muktadha ni wa ahadi, huku tanbihi ikihifadhi uwezekano wa hali ya sasa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu YHWH. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Uhusiano wa vipashio katika אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: Mimi ni ngao kwako; thawabu yako itakuwa kubwa sana
  alternative: Mimi ni ngao yako; thawabu yako ni kubwa mno
  rationale: 'Mgawanyo wa vipashio katika maandishi ya Kimasora unaunga mkono kauli mbili: Mungu ni ngao kwa Abramu, na thawabu ya Abramu ni kubwa sana. Kwa kuwa Kiebrania hakina kitenzi wazi katika kauli ya pili na “ngao kwako” inaweza kutolewa kwa umilikaji katika Kiswahili, tanbihi huhifadhi tofauti hizo bila kumtambulisha Mungu moja kwa moja kuwa ndiye “thawabu,” jambo ambalo si lazima kisarufi hapa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. Jina “Abramu” limehifadhiwa kulingana na hatua hii ya simulizi, kabla ya kubadilishwa kuwa Abrahamu.
