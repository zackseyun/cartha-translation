translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya makabila yametolewa kwa ngeli ya Wa- ili yaeleweke kama makundi ya watu. Alama ya tanbihi imewekwa baada ya “Wakadmoni,” neno linalohusika moja kwa moja na maelezo hayo. Mstari unabaki kuwa kipande cha orodha inayoendelea, hivyo mstari mrefu wa mwisho umehifadhiwa.
