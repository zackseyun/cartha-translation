lexical_decisions:
- source_word: אֶת
  choice: '[halijatafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa moja kwa moja kisicho na neno huru linalolingana nacho katika Kiswahili; kazi yake inaonekana katika orodha hii ndani ya sentensi pana.
- source_word: הַקֵּינִי
  choice: Wakeni
  rationale: Ni jina la kabila lenye kibainishi, lililotumiwa kwa maana ya jamii nzima. Kiambishi Wa- kinaonyesha kundi la watu kwa Kiswahili cha kawaida.
- source_word: וְאֶת
  choice: '[kiunganishi hakijawakilishwa hapa kwa neno tofauti]'
  rationale: Kiunganishi kinaendeleza orodha, lakini katika Kiswahili si lazima kurudia “na” kati ya kila kipengele; kiashiria cha yambwa hakitafsiriwi kivyake.
- source_word: הַקְּנִזִּי
  choice: Wakenizi
  rationale: Ni jina la kabila linalotumiwa kwa maana ya jamii nzima; umbo la Kiswahili lenye Wa- linawasilisha wazi kundi la watu.
- source_word: וְאֵת
  choice: na
  rationale: Kiunganishi kinaunganisha kipengele cha mwisho katika orodha; kiashiria cha yambwa hakihitaji kutafsiriwa kivyake.
- source_word: הַקַּדְמֹנִי
  choice: Wakadmoni
  rationale: Ingawa neno hilo linahusiana na maana ya “mashariki,” hapa linafanya kazi kama jina la kabila sambamba na majina mengine ya makabila. Kulitaja kama Wakadmoni kunahifadhi hadhi yake ya jina la watu na muundo wa orodha.
