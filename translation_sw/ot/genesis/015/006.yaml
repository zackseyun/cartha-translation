  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: sw
  text: Abramu alimwamini BWANA[a], naye BWANA akamhesabia hilo kuwa haki.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimtumaini BWANA.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akalihesabu kuwa haki,” au “akalihesabia Abramu kuwa haki.”
    reason: lexical_alternative
  - marker: c
    text: Kwa kawaida, muundo wa Kiebrania unaeleweka kwamba BWANA alimhesabia Abramu kuamini kwake kuwa haki. Uwezekano mwingine, usio na nguvu sawa, humchukulia Abramu kuwa kiima cha “alihesabu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הֶאֱמִן
  choice: Naye alimwamini
  rationale: Hifili ya אמן hapa inaeleza kumwamini au kumtumaini mtu. Muundo wa Kiswahili ‘alimwamini BWANA’ ni wa kawaida na wa moja kwa moja, huku ‘alimtumaini’ likibaki kuwa badala halali.
- source_word: בַּ/יהוָה
  choice: BWANA
  rationale: Kihusishi בְּ kinaonyesha anayeelekezewa imani. Jina la agano יהוה limetafsiriwa kwa mtindo wa kawaida wa Biblia za Kiswahili kuwa ‘BWANA,’ kwa herufi kubwa.
- source_word: וַ/יַּחְשְׁבֶהָ
  choice: naye akamhesabia hilo
  rationale: חשב lina maana ya kuhesabu, kukadiria, au kuweka katika hesabu. ‘Akamhesabia hilo’ ni Kiswahili cha kawaida kinachohifadhi wazo la jambo kuwekwa kwa hesabu ya mtu; ‘hilo’ linaelekeza kwenye tendo la Abramu kuamini bila kuongeza nomino ‘imani’ katika matini.
- source_word: לּוֹ
  choice: -m- katika ‘akamhesabia’
  rationale: Kiambishi cha yambwa katika kitenzi cha Kiswahili kinaonyesha kwamba jambo hilo lilihesabiwa kwa Abramu, na hivyo kuwasilisha maana ya לּוֹ kwa njia ya kawaida.
- source_word: צְדָקָה
  choice: kuwa haki
  rationale: צְדָקָה hapa ni haki au hali ya kuwa mwenye haki. ‘Kuwa haki’ ni usemi unaoeleweka na unahifadhi uzito wa kitheolojia bila kufafanua kupita matini.
theological_decisions:
- issue: Kiima cha ‘akamhesabia’
  choice: 'BWANA ndiye kiima: BWANA alimhesabia Abramu hilo kuwa haki.'
  alternative: 'Abramu ndiye kiima: Abramu alimhesabu yeye au jambo hilo kuwa haki.'
  rationale: Muktadha na mapokeo mapana ya kibiblia yanaunga mkono BWANA kuwa kiima, ingawa Kiebrania hakirudii jina la kiima katika kishazi cha pili. Matini kuu inafuata usomaji unaowezekana zaidi, na tanbihi inahifadhi uwezekano mwingine usio na nguvu sawa.
- issue: Kirejeo cha kiambishi cha kike katika וַיַּחְשְׁבֶהָ
  choice: Kinarejelea tendo la Abramu kuamini, kilichotafsiriwa ‘hilo.’
  alternative: Kinarejelea kwa upana zaidi jibu au tumaini la Abramu.
  rationale: Kiebrania kinaweza kutumia kiambishi cha kike kurejelea tendo au jambo la kidhahania. ‘Hilo’ huhifadhi rejeo bila kuingiza moja kwa moja nomino ya kufasiri ‘imani.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘BWANA’ limetumiwa kwa יהוה. Viambishi na mpangilio wa sentensi vimechaguliwa kwa mtiririko wa asili huku utata halisi wa kisintaksia ukielezwa katika tanbihi.
