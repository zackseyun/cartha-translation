translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi, na ya kawaida kwa orodha ya majina ya jamii. Kurudiwa kwa “na” kunafuata msisitizo na mwendelezo wa maandishi ya Kiebrania.
