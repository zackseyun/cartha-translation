  language: sw
  text: na Waamori, na Wakanaani, na Wagirgashi, na Wayebusi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: na
  rationale: וְ inaendeleza orodha, nayo אֶת ni kiashiria cha yambwa mahsusi ambacho hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili. Kurudia “na” kunahifadhi muundo wa orodha ya Kiebrania.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Nomino ya Kiebrania iko katika umoja wa kijumla ikimaanisha jamii nzima; Kiswahili hutumia kawaida jina la watu la ngeli ya A-WA.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Umoja wa kijumla wa Kiebrania umetafsiriwa kwa jina la jamii katika wingi wa Kiswahili, kwa mtindo unaoeleweka na unaolingana na orodha.
- source_word: הַגִּרְגָּשִׁי
  choice: Wagirgashi
  rationale: Jina la jamii limetoholewa kwa tahajia ya Kiswahili na kuwekwa katika ngeli ya A-WA, likihifadhi utambulisho wa kundi la asili.
- source_word: הַיְבוּסִי
  choice: Wayebusi
  rationale: Jina la jamii limetafsiriwa katika wingi wa kawaida wa Kiswahili, sambamba na majina mengine katika orodha.
