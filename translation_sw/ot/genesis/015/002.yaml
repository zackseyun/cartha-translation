base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: sw
  text: Lakini Abramu akasema[a], “Bwana Yahweh, utanipa nini, kwa kuwa ninaendelea kuishi bila watoto, na mrithi wa nyumba yangu ni Eliezeri wa Damasko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina usemi usio wa kawaida, kihalisi karibu “mwana wa mesheki ya nyumba yangu”; huenda maana yake ni “msimamizi wa nyumba yangu” au “mwenye nyumba yangu/mrithi wa nyumba yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Abramu akasema
  rationale: Waw-consecutive inaendeleza simulizi, lakini hapa kauli ya Abramu inaleta hoja ya wasiwasi dhidi ya ahadi iliyotangulia; “Lakini” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֲדֹנָי יֱהוִה
  choice: Bwana Yahwe
  rationale: אֲדֹנָי ni cheo “Bwana/Mtawala,” na יֱהוִה ni jina la Mungu; tafsiri hii inahifadhi vipengele vyote viwili bila kurudia “Bwana.”
- source_word: מַה תִּתֶּן לִי
  choice: utanipa nini
  rationale: Kitenzi kisichotimilika kina maana ya wakati ujao katika muktadha huu; Kiswahili hiki ni cha moja kwa moja na cha asili.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: kwa kuwa ninaendelea bila mtoto
  rationale: Kiunganishi kinaeleza sababu ya swali, na הוֹלֵךְ hudumisha wazo la mwendo wa maisha, huku עֲרִירִי ikimaanisha kutokuwa na mtoto au uzao.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: atakayerithi nyumba yangu
  rationale: Usemi wa Kiebrania si wa kawaida na maana yake kamili haina uhakika. Muktadha wa mstari huu na unaofuata unaelekeza kwa mtu atakayerithi mali ya Abramu; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: Eliezeri wa Damasko
  rationale: Muundo huu humtambulisha Eliezeri kwa uhusiano au asili yake ya Damasko; “wa Damasko” ni Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יֱהוִה katika אֲדֹנָי יֱהוִה
  choice: Bwana Yahwe
  alternative: Bwana MUNGU
  rationale: “Yahwe” huhifadhi jina la agano lililo katika matini, huku “Bwana” ikiwakilisha cheo אֲדֹנָי.
- issue: Utambulisho wa בֶן מֶשֶׁק בֵּיתִי
  choice: atakayerithi nyumba yangu
  alternative: msimamizi wa nyumba yangu
  rationale: Muktadha unahusu ukosefu wa mtoto na mrithi, lakini usemi wenyewe ni mgumu; kwa hiyo tafsiri kuu inatoa maana inayowezekana zaidi na tanbihi inahifadhi utata wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninaendelea bila mtoto” huhifadhi kwa kiasi sitiari ya maisha yanayoendelea, na “atakayerithi nyumba yangu” hutoa maana ya kimuktadha bila kuficha utata, ambao umeelezwa katika tanbihi.
