  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: sw
  text: Akamwambia, “Niletee ng’ombe jike wa miaka mitatu[a], mbuzi jike wa miaka mitatu, kondoo dume wa miaka mitatu, hua, na kinda la njiwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalorudiwa hapa kwa kawaida hueleweka katika muktadha huu kuwa linaonyesha wanyama wenye umri wa miaka mitatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Akamwambia
  rationale: Muundo huu wa kawaida wa simulizi unaunganisha tukio linalofuata na kuonyesha kwamba Mungu alisema na Abramu, bila kulazimika kurudia kiwakilishi tofauti.
- source_word: קְחָה לִי
  choice: Niletee
  rationale: Ingawa maana ya neno kwa neno ni ‘nichukulie,’ katika muktadha huu amri inataka wanyama wapatikane na kuletwa kwa ajili ya tendo la agano; ‘niletee’ ni Kiswahili cha kawaida na sahihi kimuktadha.
- source_word: עֶגְלָה
  choice: ndama jike
  rationale: Neno hilo humaanisha ng’ombe jike mchanga; ‘ndama jike’ linaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: wa miaka mitatu
  rationale: Katika orodha hii ya wanyama, umbo hili linaeleweka kijadi kuwa linaonyesha umri wa kila mnyama.
- source_word: עֵז
  choice: mbuzi jike
  rationale: Nomino ya Kiebrania ni ya kike na hapa inamtaja mbuzi wa kike.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kondoo wa kiume.
- source_word: תֹר
  choice: hua
  rationale: ‘Hua’ ni jina la kawaida la Kiswahili kwa turtledove na linadumisha utofauti wake na njiwa anayefuata.
- source_word: גוֹזָל
  choice: kinda la njiwa
  rationale: Katika jozi hii ya wanyama wa sadaka, neno hurejelea njiwa mchanga; ‘kinda la njiwa’ ni wazi na la asili katika Kiswahili.
