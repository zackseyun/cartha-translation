    issue: “ndama jike wa miaka mitatu”
    rationale: “Ndama” normally means a calf in modern Swahili. Since the source denotes a heifer and specifies an age of three years, “ng’ombe jike wa miaka mitatu” is more accurate and avoids the incongruity of calling a three-year-old animal a calf.
  revised_text: Akamwambia, “Niletee ng’ombe jike wa miaka mitatu[a], mbuzi jike wa miaka mitatu, kondoo dume wa miaka mitatu, hua, na kinda la njiwa.”
