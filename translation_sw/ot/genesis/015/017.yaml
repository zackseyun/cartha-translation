base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: sw
  text: Ikawa, jua lilipokuwa limekwisha kutua na giza limeingia, tazama, tanuru inayofuka moshi[a] na mwenge wa moto vikapita katikati ya vipande hivyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jiko linalofuka moshi.” Neno la Kiebrania humaanisha tanuru au jiko la kuokea; katika muktadha huu linaweza kumaanisha chombo cha moto.
    reason: lexical_alternative
  - marker: b
    text: Hivi ni vipande vya wanyama waliogawanywa vilivyotayarishwa kwa ajili ya agano; tazama Mwanzo 15:10.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  choice: Ikawa jua lilipotua
  rationale: בוא likitumiwa kuhusu jua ni nahau ya kutua kwa jua. Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida huku ukihifadhi mpito wa wakati.
- source_word: וַעֲלָטָה הָיָה
  choice: na giza likaingia
  rationale: עֲלָטָה humaanisha giza au hali ya utusitusi. ‘Giza likaingia’ ni usemi wa kawaida unaoonyesha kuanza kwa hali hiyo bila kuongeza wazo la ‘giza nene’ ambalo halijaelezwa wazi hapa.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira kwa tukio linaloonyeshwa kwa namna ya wazi na ya kustaajabisha. ‘Tazama’ linadumisha uzito wa kifasihi bila kuwa la kizamani.
- source_word: תַנּוּר עָשָׁן
  choice: tanuru lililofuka moshi
  rationale: תַנּוּר ni chombo au jengo dogo la kuokea au kuwashia moto. ‘Tanuru’ linaacha upana huo wa maana, na ‘lililofuka moshi’ linaeleza kwa Kiswahili cha asili uhusiano wa muundo wa Kiebrania.
- source_word: לַפִּיד אֵשׁ
  choice: mwenge wa moto
  rationale: לַפִּיד ni mwenge, na אֵשׁ hukazia hali yake ya moto. Tafsiri hii inadumisha picha halisi na yenye uzito ya chanzo.
- source_word: אֲשֶׁר עָבַר
  choice: vikapita
  rationale: Kitenzi cha Kiebrania kiko katika umoja wa kisarufi, lakini katika muktadha tanuru na mwenge huwasilishwa pamoja kama vitu vinavyopita. Kiswahili huhitaji upatanisho wa wingi kwa viwakilishi vya ngeli vi-, bila kuamua kwamba vitu hivyo ni nafsi fulani.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: katikati ya vipande hivyo
  rationale: גְּזָרִים ni vipande vilivyokatwa vya wanyama vilivyotayarishwa hapo awali. ‘Vipande hivyo’ ni wazi na cha kawaida; muktadha tayari unaonyesha kuwa vilikatwa.
theological_decisions:
- issue: Asili ya tanuru lenye moshi na mwenge wa moto katika tukio la agano
  choice: Kueleza tu vitu vinavyoonekana bila kuvitambulisha moja kwa moja kuwa Mungu mwenyewe.
  alternative: Kusema wazi kwamba tanuru na mwenge ni udhihirisho wa uwepo wa BWANA.
  rationale: Muktadha mpana unaashiria kwa nguvu udhihirisho wa Mungu katika kufanya agano, lakini mstari huu wenyewe unataja alama zinazoonekana tu. Tafsiri ya maelezo inadumisha mvutano wa kiteolojia bila kuingiza fasiri katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Ikawa’ na ‘tazama’ vinadumisha uzito wa kifasihi wa simulizi bila kutumia lugha nzito ya kizamani. Alama zote za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
