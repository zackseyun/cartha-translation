base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: sw
  text: Kisha akamwambia Abramu, “Ujue hakika kwamba uzao wako utakuwa wageni katika nchi isiyo yao[a], na watawatumikisha[b] na kuwatesa kwa miaka mia nne.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wageni” au “watu wa ugenini”; yaani watu wanaoishi katika nchi ambayo si yao wenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “watawafanya watumike.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwalazimisha kutumika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: Ujue hakika
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi chenyewe unasisitiza uhakika; ‘Ujue hakika’ ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
- source_word: גֵר
  choice: wageni wanaoishi
  rationale: Neno hili humaanisha watu wanaokaa katika nchi isiyo yao bila kuwa wenyeji; usemi huu unaeleweka kwa urahisi kuliko istilahi ya kisheria na hauashirii tu wasafiri wa muda mfupi.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: ‘Uzao’ huhifadhi maana ya nomino ya umoja yenye kurejelea kundi la vizazi vya Abramu.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: katika nchi isiyo yao
  rationale: Tafsiri hii ni ya asili na inafuata kwa karibu wazo la Kiebrania la nchi ambayo si mali yao.
- source_word: וַעֲבָדוּם
  choice: watawatumikisha
  rationale: Katika muktadha huu kitenzi kinaashiria kuwalazimisha wengine kutumika. Kiswahili kinaonyesha wazi tofauti kati ya watendaji na uzao wa Abramu bila kugeuza vitenzi vya Kiebrania kuwa kauli tendwa.
- source_word: וְעִנּוּ אֹתָם
  choice: na kuwatesa
  rationale: Kitenzi katika piel kina maana ya kuwadhulumu au kuwatesa; ‘kuwatesa’ ni neno la kawaida na pana linalofaa kwa kutendewa kwa ukali.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: kwa miaka mia nne
  rationale: ‘Kwa’ huwasilisha kwa kawaida muda uliotajwa mwishoni mwa sentensi ya Kiebrania.
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: Kisha akamwambia Abramu
  rationale: ‘Kisha’ huendeleza mfuatano wa simulizi unaowasilishwa na waw-consecutive.
theological_decisions:
- issue: Mhusika wa vitenzi vya wingi ‘watawatumikisha na kuwatesa’
  choice: Watu wa nchi hiyo
  alternative: Watendaji wasiotajwa wazi, yaani ‘watatumikishwa na kuteswa’
  rationale: Kiebrania kina watendaji wa wingi wasiotajwa kwa nomino na watendwa wa wingi wanaorejelea uzao wa Abramu. Muktadha unaelekeza kwa watu wa nchi ya ugenini, lakini tafsiri haipaswi kuwafanya uzao wenyewe kuwa watendaji. Kirai hiki kinafafanua rejeleo kwa kiwango cha chini kinachohitajika kwa Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Abramu’ limetumika kulingana na umbo la jina katika hatua hii ya simulizi. Rejeleo la watendaji limewekwa wazi ili kuepuka utata wa viwakilishi vya wingi.
