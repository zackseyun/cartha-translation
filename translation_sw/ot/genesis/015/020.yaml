  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: sw
  text: na Wahiti, na Waperizi, na Warefai[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majitu.” Neno la Kiebrania Warefai linaweza kueleweka kwa maana hiyo katika baadhi ya miktadha, lakini hapa yaelekea zaidi kuwa jina la kundi la watu waliokaa katika nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi וְ kinaendeleza orodha ya makundi ya watu kutoka mstari uliotangulia; kiashiria cha yambwa אֵת hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: הַחִתִּי
  choice: Wahiti
  rationale: Ingawa umbo la Kiebrania ni la umoja, jina hili la watu lenye kibainishi linatumika kwa maana ya jamii nzima. Kiswahili hutumia kawaida kiambishi Wa- kwa kundi la watu.
- source_word: הַפְּרִזִּי
  choice: Waperizi
  rationale: Umbo la umoja la Kiebrania linawakilisha jamii nzima; “Waperizi” ni namna ya asili ya Kiswahili ya kutaja kundi hilo.
- source_word: הָרְפָאִים
  choice: Warefai
  rationale: Katika orodha hii ya wakazi wa nchi, neno hili linaeleweka zaidi kama jina la kundi la watu. Kulitohoa kama “Warefai” kunadumisha nguvu yake kama jina maalumu bila kuingiza tafsiri ya kimaanisho katika andiko kuu.
theological_decisions:
- issue: Iwapo רְפָאִים litafsiriwe kama jina la kabila au kwa maana ya kimaanisho
  choice: Jina la watu “Warefai”
  alternative: majitu
  rationale: Mwanzo 15:19–21 inataja jamii zilizokuwa katika nchi aliyoahidiwa Abramu, hivyo jina la watu ndilo linalofaa zaidi katika muktadha huu. Maana mbadala ya “majitu” imehifadhiwa katika tanbihi ili kutatua kimya kimya utata wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa kurudia “na” umehifadhiwa kwa kuwa mstari huu unaendeleza orodha ya mstari uliotangulia. Alama ya tanbihi imewekwa baada ya “Warefai,” neno linalohusika na tanbihi.
