base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: sw
  text: Ndipo Abramu akasema, “Tazama, hujanipa uzao, na tazama, mwana wa nyumba yangu ndiye atakayenirithi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: הֵן / וְהִנֵּה
  choice: Tazama / na tazama
  rationale: Kurudiwa kwa chembe za kuvuta fikira kunahifadhi msisitizo na uwiano wa semi hizo mbili.
- source_word: לִי לֹא נָתַתָּה זָרַע
  choice: hujanipa uzao
  rationale: Kitenzi cha timilifu kinaeleza hali iliyofikia wakati wa malalamiko ya Abramu; “uzao” huwasilisha maana ya זֶרַע kama watoto au waz descendants bila kutumia “mbegu” kwa maana halisi.
- source_word: בֶן בֵּיתִי
  choice: mwana wa nyumba yangu
  rationale: Huhifadhi picha ya Kiebrania ya mtu aliye wa nyumba ya Abramu bila kuingiza kwa wazi hadhi ya utumwa ambayo mstari huu hautaji.
- source_word: יוֹרֵשׁ אֹתִי
  choice: ndiye atakayenirithi
  rationale: Huhifadhi kitu cha moja kwa moja “mimi” katika Kiebrania na nguvu ya kishiriki inayoelekea kwenye hali ya mrithi, huku ikibaki ya kueleweka kwa Kiswahili.
theological_decisions:
- issue: Hadhi ya mtu wa nyumba ya Abramu na maana ya urithi
  choice: Mstari unasema kwa tahadhari kuwa mwana wa nyumba yake atamrithi Abramu.
  alternative: Mtumwa aliyezaliwa nyumbani mwake atakuwa mrithi wake; au mali yake itarithiwa na mtu wa nyumbani.
  rationale: Kiebrania hapa hakitumii neno la wazi la “mtumwa,” wala hakibadili “atanirithi” kuwa “atarithi mali yangu.” Tafsiri inadumisha usemi na mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” ni rasmi lakini kinaeleweka; “mwana wa nyumba yangu” na “atanirithi” zinahifadhi ukaribu na muundo wa Kiebrania.
