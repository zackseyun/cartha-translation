  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: sw
  text: Lakini Abramu akamwambia mfalme wa Sodoma, “Nimeuinua mkono wangu[a] kwa Yahwe, Mungu Aliye Juu Sana, mwenye mbingu na dunia.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nimeuinua mkono wangu” ni ishara ya kiapo katika utamaduni wa Kiebrania.
    reason: cultural_note
  - marker: b
    text: Au “muumba wa mbingu na dunia.” Neno la Kiebrania linaweza kumaanisha “mwenye,” “mmiliki,” au, katika muktadha huu, “muumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Abramu akamwambia
  rationale: Kiunganishi cha simulizi kinaendeleza tukio, lakini katika muktadha jibu la Abramu linatofautiana na pendekezo la mfalme wa Sodoma; hivyo “Lakini” ni la asili na linalofaa hapa.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Umbo hili la jina linapatana na matumizi yaliyozoeleka katika Biblia za Kiswahili na linatofautishwa na jina la baadaye, Abrahamu.
- source_word: מֶלֶךְ סְדֹם
  choice: mfalme wa Sodoma
  rationale: Huu ni uhusiano wa moja kwa moja wa nomino mbili; mfalme huyo tayari anajulikana katika muktadha.
- source_word: הֲרִימֹתִי יָדִי
  choice: Nimeuinua mkono wangu
  rationale: Tafsiri inadumisha taswira halisi ya Kiebrania ya kuinua mkono, ambayo hapa ni ishara ya kuapa, badala ya kuibadili moja kwa moja kuwa “nimeapa.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linawakilishwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: אֵל עֶלְיוֹן
  choice: Mungu Aliye Juu Zaidi
  rationale: Tafsiri hii ya cheo ni wazi, ya asili katika Kiswahili, na inadumisha maana ya ukuu wa juu kabisa.
- source_word: קֹנֵה
  choice: mwenye
  rationale: “Mwenye” linaonyesha umilikaji bila kulazimisha maana ya uumbaji; maana mbadala ya “muumba” imehifadhiwa katika tanbihi.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: mbingu na dunia
  rationale: Huu ni usemi unaojumuisha uumbaji wote, na “mbingu na dunia” ni Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya קֹנֵה שָׁמַיִם וָאָרֶץ
  choice: mwenye mbingu na dunia
  alternative: muumba wa mbingu na dunia; mmiliki wa mbingu na dunia
  rationale: Kitenzi-shirikishi cha Kiebrania kinaweza kueleweka kwa maana ya kumiliki au, katika muktadha huu, kuumba. Matini kuu inadumisha maana pana ya umilikaji, huku tanbihi ikihifadhi uwezekano muhimu wa “muumba.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kiapo umehifadhiwa kwa taswira yake halisi, huku tanbihi ikieleza maana ya kitamaduni na utata wa neno קֹנֵה.
