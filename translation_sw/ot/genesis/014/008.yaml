base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: sw
  text: Ndipo mfalme wa Sodoma, mfalme wa Gomora, mfalme wa Adma, mfalme wa Seboimu, na mfalme wa Bela (yaani, Soari) wakatoka, wakajipanga kupigana nao[a] katika bonde la Sidimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “pamoja nao vita”; inaweza pia kutafsiriwa “dhidi yao vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Ndipo ... wakatoka
  rationale: Waw ya masimulizi inaendeleza tukio, hivyo “Ndipo” ni ya asili katika Kiswahili. Ingawa kitenzi cha Kiebrania ni umoja, kinatangulia kiima ambatano cha wafalme kadhaa; wingi ni wa kawaida katika Kiswahili.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Ni tafsiri ya kawaida ya cheo hiki, na imerudiwa ili kuhifadhi mpangilio na mkazo wa Kiebrania.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: עֲמֹרָה
  choice: Gomora
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: אַדְמָה
  choice: Adma
  rationale: Unukuzi unaoeleweka wa jina la mahali.
- source_word: צביים
  choice: Seboimu
  rationale: Unukuzi wa Kiswahili unaokaribia matamshi ya Kiebrania na kufuata maumbo yaliyozoeleka ya majina ya Biblia.
- source_word: בֶּלַע הִוא צֹעַר
  choice: Bela (yaani, Soari)
  rationale: “Yaani” linaonyesha kwamba kishazi hiki kinaitambulisha Bela kuwa Soari; mabano yanawasilisha maelezo hayo kwa uwazi.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: wakajipanga kupigana
  rationale: Katika muktadha wa kijeshi, ערך pamoja na מִלְחָמָה humaanisha kupanga vikosi kwa ajili ya mapigano. Kauli hii ni ya asili katika Kiswahili na inadumisha maana ya maandalizi ya vita.
- source_word: אִתָּם
  choice: nao
  rationale: Kiwakilishi hiki kwa msingi humaanisha “pamoja nao/nao”; katika muundo wa kupigana, “kupigana nao” ni Kiswahili cha kawaida na huonyesha uadui bila kuongeza neno “dhidi” moja kwa moja katika matini.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: katika Bonde la Sidimu
  rationale: “Bonde” ni tafsiri ya kawaida ya עֵמֶק, na “Sidimu” ni unukuzi unaofaa wa jina la mahali.
theological_decisions: []
