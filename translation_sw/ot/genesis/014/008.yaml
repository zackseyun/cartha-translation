  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “mfalme” yamehifadhiwa ili kuakisi mfuatano rasmi wa Kiebrania, huku “wakajipanga kupigana nao” kikitoa usemi wa kijeshi unaoeleweka kwa msomaji wa kawaida.
