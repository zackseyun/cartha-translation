  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: sw
  text: na Wahori katika milima yao ya Seiri, mpaka El-Parani[a], iliyo kando ya nyika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “El Parani”; huenda ikamaanisha “mwaloni/mvinje wa Parani” ikiwa jina hili linaeleweka kulingana na asili ya maneno yake badala ya kuwa jina maalumu la mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֹרִי
  choice: na Wahori
  rationale: Kiunganishi na kiashiria cha yambwa vinaendeleza orodha ya makundi yaliyoshindwa katika mstari uliotangulia; kitenzi kinaeleweka kutokana na muktadha. Jina la watu limetolewa kwa namna ya kawaida ya Kiswahili, “Wahori.”
- source_word: בְּהַרְרָם שֵׂעִיר
  choice: katika milima yao ya Seiri
  rationale: Tafsiri hii inahifadhi wingi wa neno la Kiebrania “milima” na kiambishi cha umilikaji “yao,” huku Seiri ikitambulisha eneo hilo kwa lugha ya asili na wazi.
- source_word: עַד
  choice: mpaka
  rationale: Neno “mpaka” linaonyesha kikomo cha kijiografia cha safari ya kijeshi kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: אֵיל פָּארָן
  choice: El-Parani
  rationale: Kirai kimetolewa kama jina maalumu la mahali ili kuepuka kuamua bila msingi wa kutosha kama אֵיל hapa humaanisha mwaloni au mvinje.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: iliyo kando ya nyika
  rationale: Kirai hiki kinaonyesha mahali palipo karibu na nyika; “kando ya” huhifadhi maana pana ya uhusiano wa kijiografia wa עַל katika muktadha huu.
