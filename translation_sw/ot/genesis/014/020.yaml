base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: sw
  text: Na abarikiwe Mungu Aliye Juu Sana, aliyewatia adui zako mikononi mwako. Kisha akampa sehemu ya kumi ya kila kitu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mapokeo, “zaka ya kila kitu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakimtaji tena wazi mtendaji wa “akampa.” Kwa muktadha, inaeleweka zaidi kwamba Abramu alimpa Melkizedeki sehemu ya kumi ya kila kitu.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Na ahimidiwe
  rationale: Muundo huu ni tamko la baraka au sifa. ‘Ahimidiwe’ ni Kiswahili cha sasa, cha heshima, kinachowasilisha maana ya baraka inayotamkwa kwa Mungu, huku ‘Na’ ikihifadhi kiunganishi.
- source_word: אֵל עֶלְיוֹן
  choice: Mungu Aliye Juu Zaidi
  rationale: אֵל ni ‘Mungu,’ na עֶלְיוֹן ni cheo kinachoonyesha ukuu wa juu kabisa. Tafsiri hii ni wazi na ya kawaida katika Kiswahili bila kulinakili jina El.
- source_word: אֲשֶׁר
  choice: aliye
  rationale: Kiwakilishi hiki cha uhusiano kinamrejelea Mungu kama nafsi na kinaunganisha kwa kawaida sentensi ya Kiswahili.
- source_word: מִגֵּן
  choice: aliyewatia
  rationale: Katika muktadha huu kitenzi kina maana ya kuwakabidhi au kuwatia watu chini ya uwezo wa mwingine, si kuwa ngao. Pamoja na ‘mikononi mwako,’ ‘aliyewatia’ huwasilisha vizuri tukio la ushindi.
- source_word: צָרֶיךָ
  choice: adui zako
  rationale: Ni wingi wenye kiambishi cha nafsi ya pili ya kiume umoja, ukimaanisha wapinzani wenye uhasama. ‘Adui zako’ ni wazi na ya sasa.
- source_word: בְּיָדֶךָ
  choice: mikononi mwako
  rationale: Ni nahau ya Kiebrania ya kutiwa chini ya mamlaka au uwezo wa mtu. Wingi wa Kiswahili ‘mikononi’ ni nahau ya kawaida na bado huhifadhi picha halisi ya mkono.
- source_word: וַיִּתֶּן
  choice: Naye akampa
  rationale: Muundo wa simulizi unaendeleza tendo linalofuata bila kutaja tena wazi mtendaji. ‘Naye’ hudumisha kiwakilishi na kutolazimisha jina la Abramu ndani ya matini.
- source_word: לוֹ
  choice: -mpa
  rationale: Kiambishi cha yambwa ‘-m-’ kinatafsiri ‘kwake/yeye,’ ambaye kwa muktadha anaeleweka zaidi kuwa Melkizedeki.
- source_word: מַעֲשֵׂר
  choice: sehemu ya kumi
  rationale: Maana ya moja kwa moja ni sehemu moja kati ya kumi. Hii ni wazi kwa wasomaji wa sasa na haileti mapema maana za kitaasisi zinazoweza kuambatana na ‘zaka.’
- source_word: מִכֹּל
  choice: ya kila kitu
  rationale: Inaonyesha kuwa sehemu hiyo ya kumi ilitolewa kutoka katika jumla yote. ‘Ya kila kitu’ ni Kiswahili cha kawaida na pana sawasawa na chanzo.
theological_decisions:
- issue: Mtendaji asiyetajwa wazi wa וַיִּתֶּן
  choice: 'Matini inadumisha kiwakilishi: ‘Naye akampa,’ huku tanbihi ikieleza kuwa kwa muktadha Abramu ndiye anayeeleweka zaidi kuwa mtoaji.'
  alternative: Melkizedeki ndiye aliyetoa sehemu ya kumi kwa Abramu.
  rationale: Kiebrania hakirudii nomino ya mtendaji. Muktadha unaunga mkono kwa nguvu Abramu kuwa mtoaji na Melkizedeki kuwa mpokeaji, lakini tanbihi inahifadhi utata wa kisarufi uliopo badala ya kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Nahau ‘mikononi mwako’ imehifadhi picha ya Kiebrania, na ‘sehemu ya kumi’ imechaguliwa kwa uwazi wa kisasa.
