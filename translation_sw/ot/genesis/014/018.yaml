base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: sw
  text: Naye Melkizedeki, mfalme wa Salemu, akatoa mkate na divai. Yeye alikuwa kuhani wa Mungu Aliye Juu Zaidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: El Elyon, yaani, “Mungu Aliye Juu Zaidi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: Melkizedeki
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika Kiswahili badala ya kutafsiri maana yake inayowezekana.
- source_word: מֶלֶךְ שָׁלֵם
  choice: mfalme wa Salemu
  rationale: Muundo huu unaonyesha wazi cheo chake na mahali alipotawala; jina la mahali limetoholewa kwa kawaida ya Kiswahili.
- source_word: הוֹצִיא
  choice: akaleta
  rationale: Hifili ya יצא hapa ina maana ya kusababisha kitu kitoke, yaani kukileta; 'akaleta' ni ya asili katika simulizi la Kiswahili bila kuongeza lengo lisilotajwa.
- source_word: לֶחֶם וָיָיִן
  choice: mkate na divai
  rationale: Haya ndiyo maneno ya kawaida na ya moja kwa moja kwa vyakula vilivyotajwa, bila kuingiza maana ya kisakramenti.
- source_word: כֹהֵן
  choice: kuhani
  rationale: Neno hili linahifadhi cheo cha kidini bila kudokeza kwa lazima mfumo wa ukuhani wa Israeli wa baadaye.
- source_word: אֵל עֶלְיוֹן
  choice: Mungu Aliye Juu Zaidi
  rationale: Kichwa hiki cha Mungu kimetafsiriwa ili maana yake ieleweke kwa uwazi, huku umbo la Kiebrania likihifadhiwa katika tanbihi.
- source_word: וְהוּא
  choice: Yeye alikuwa
  rationale: Kiwakilishi kilichosisitizwa kinaanzisha taarifa kuhusu utambulisho wa Melkizedeki; sentensi mpya ni ya asili na huhifadhi msisitizo huo.
theological_decisions:
- issue: Iwapo mkate na divai zitafsiriwe kwa namna inayotanguliza maana ya kisakramenti ya baadaye
  choice: Maneno rahisi ya kihistoria 'akaleta mkate na divai'
  alternative: Kutumia maneno yanayodokeza kwa wazi Ekaristi au Meza ya Bwana
  rationale: Mstari wenyewe unasimulia tu tendo la kuleta mkate na divai; hautoi ufafanuzi wa kisakramenti, hivyo tafsiri haipaswi kuuongeza.
- issue: Iwapo אֵל עֶלְיוֹן litoholewe kama jina au litafsiriwe kama cheo
  choice: Mungu Aliye Juu Zaidi
  alternative: El Elyoni
  rationale: Katika muktadha huu kirai kinafanya kazi kama jina la cheo la Mungu. Kutafsiri huwasilisha maana yake kwa msomaji wa Kiswahili, huku tanbihi ikitaja umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Kiunganishi 'Naye' na mfuatano 'akaleta' vinaendeleza mtiririko wa simulizi; hakuna lugha ya kimadhehebu iliyoongezwa.
