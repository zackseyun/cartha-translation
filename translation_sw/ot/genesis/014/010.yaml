base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: sw
  text: Bonde la Sidimu lilikuwa limejaa mashimo ya lami[a], na wafalme wa Sodoma na Gomora wakakimbia, wakaanguka huko[b], nao wengine wakakimbilia milimani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mashimo ya bitumeni”; neno la Kiebrania hurejelea bitumeni, yaani lami ya asili.
    reason: lexical_alternative
  - marker: b
    text: Yaani, walianguka huko katika Bonde la Sidimu; huenda walianguka ndani ya mashimo ya lami.
    reason: lexical_alternative
  - marker: c
    text: Au “kwenye eneo la vilima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: Bonde la Sidimu
  rationale: עֵמֶק ni ‘bonde,’ na הַשִּׂדִּים ni jina la mahali; ‘Bonde la Sidimu’ ni muundo wa kawaida na wazi wa Kiswahili.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: lilikuwa limejaa mashimo ya lami
  rationale: Marudio ya בֶּאֱרֹת yanaonyesha wingi wa mashimo. חֵמָר ni bitumeni/lami ya asili; ‘lami’ ni neno la kawaida zaidi kwa wasomaji wa Kiswahili.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: Wafalme wa Sodoma na Gomora
  rationale: Ingawa מֶלֶךְ ina umbo la umoja, vitenzi vya wingi na muktadha vinaonyesha wafalme wawili, mmoja wa kila mji.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: wakaanguka humo
  rationale: Huhifadhi maana ya kawaida ya נפל, ‘kuanguka,’ bila kuongeza wazi kuwa walianguka ndani ya mashimo, jambo ambalo muktadha unadokeza lakini Kiebrania halitamki moja kwa moja.
- source_word: וְהַנִּשְׁאָרִים
  choice: nao wengine
  rationale: Hurejelea wale waliobaki; ‘wengine’ ni ya asili katika simulizi la Kiswahili bila kuwalazimisha kuitwa waokokaji.
- source_word: הֶרָה נָסוּ
  choice: wakakimbilia milimani
  rationale: הֶרָה ina kiambishi cha mwelekeo kutoka הַר; ‘milimani’ huwasilisha kwenda eneo la milima kwa Kiswahili cha kawaida.
