  text: Ndipo mfalme wa Sodoma akamwambia Abramu, “Nipe watu[a], na mali[b] ujichukulie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania ni “nafsi” (umoja), lakini limetumiwa hapa kwa maana ya jumla kurejelea watu waliopatikana tena.
    reason: lexical_alternative
  - marker: b
