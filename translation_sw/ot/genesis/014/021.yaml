    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa kusimulia unaendeleza tukio linalofuata; “Ndipo” pamoja na kitenzi cha mfululizo ni Kiswahili cha kawaida na huhifadhi mwendelezo wa simulizi.
- source_word: מֶלֶךְ סְדֹם
  choice: mfalme wa Sodoma
  rationale: Muundo wa Kiebrania unaonyesha mfalme anayehusishwa na Sodoma; jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אֶל אַבְרָם
  choice: akamwambia Abramu
  rationale: Kihusishi אֶל pamoja na kitenzi cha kusema hutafsiriwa kwa kawaida kwa muundo “akamwambia”; “Abramu” ni umbo la jina lililozoeleka katika Kiswahili.
- source_word: תֶּן לִי
  choice: Nipe
  rationale: Amri pamoja na kiambishi cha nafsi ya kwanza umoja huwasilishwa kwa ufupi na kwa kawaida kama “Nipe.”
- source_word: הַנֶּפֶשׁ
  choice: watu
  rationale: Ingawa nomino ya Kiebrania iko katika umoja na kimsingi inaweza kumaanisha nafsi, uhai, au mtu, hapa imetumiwa kwa maana ya jumla kuhusu watu waliopatikana tena.
- source_word: וְהָרְכֻשׁ
  choice: na mali
  rationale: רְכוּשׁ humaanisha mali, vitu, au milki, hasa mali inayoweza kumilikiwa; “mali” ni pana, ya asili, na inaonyesha tofauti na watu.
- source_word: קַח לָךְ
  choice: ujichukulie mwenyewe
  rationale: Amri pamoja na לָךְ inaonyesha kuchukua kwa manufaa au umiliki wa mhusika; “ujichukulie mwenyewe” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
