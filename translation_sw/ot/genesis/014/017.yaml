base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: sw
  text: Kisha mfalme wa Sodoma akatoka kumlaki Abramu, baada ya Abramu kurudi kutoka kuwashinda Kedorlaoma na wafalme waliokuwa pamoja naye, kwenye Bonde la Shawe (yaani, Bonde la Mfalme).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Kisha ... akatoka
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” na “akatoka” ni mtiririko wa kawaida wa Kiswahili.
- source_word: מֶלֶךְ סְדֹם
  choice: mfalme wa Sodoma
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja, na jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: לִקְרָאתוֹ
  choice: kwenda kumlaki
  rationale: Kitenzi “kumlaki” kinaonyesha kutoka kwa kusudi la kumpokea au kukutana na mtu anayekuja.
- source_word: אַחֲרֵי שׁוּבוֹ
  choice: baada ya Abramu kurudi
  rationale: Kiambishi cha nafsi katika Kiebrania kinaweza kuwa tata kwa Kiswahili; kutaja Abramu wazi kunazuia kisomwa kimakosa kwamba Kedorlaoma ndiye aliyerudi, kwa kuzingatia muktadha wa mstari uliotangulia.
- source_word: מֵהַכּוֹת
  choice: kutoka kumshinda
  rationale: Hiphil ya נכה katika muktadha huu wa vita ina maana ya kupata ushindi dhidi ya adui; “kumshinda” ni ya asili na wazi.
- source_word: כְּדָרלָעֹמֶר
  choice: Kedorlaoma
  rationale: Jina limetoholewa kwa sauti zinazofaa Kiswahili huku likifuata kwa karibu umbo la Kiebrania.
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: pamoja na wafalme waliokuwa pamoja naye
  rationale: Kishazi rejeshi kimehifadhiwa, na “naye” kinamrejelea Kedorlaoma katika muktadha.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: akafika katika Bonde la Shawe
  rationale: אֶל ina nguvu ya kuelekea; “akafika katika” huunganisha kwa kawaida mahali pa kukutana na sentensi ya Kiswahili bila kudai kuwa bonde ndilo lengo la pekee la kutoka kwake.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: (yaani, Bonde la Mfalme)
  rationale: Kifungu cha utambulisho kimewasilishwa kama maelezo ya mabano, sawasawa na kazi yake katika maandishi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kumlaki” ni neno fasaha na linalofaa muktadha wa mfalme kutoka kumpokea Abramu. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi inayohitajika; tanbihi za Kiingereza zilizotolewa zinaonekana kubadilishana maudhui na alama zake na hazitokani kwa lazima na ugumu wa mstari wa Kiebrania.
