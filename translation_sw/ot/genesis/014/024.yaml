base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: sw
  text: Sitachukua chochote isipokuwa kile tu ambacho vijana wamekula[a], na sehemu ya watu walioenda pamoja nami—Aneri, Eshkoli, na Mamre. Wao na wachukue sehemu yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi” au “wahudumu.” Neno la Kiebrania linaweza kumaanisha vijana au wahudumu kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “Wao watachukua sehemu yao.” Umbo la Kiebrania linaweza kueleweka kama wakati ujao, ingawa muktadha unaelekea kuonyesha ruhusa.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: Sitachukua chochote, isipokuwa tu
  rationale: Kauli hii inakamilisha maana inayodokezwa kutoka mstari uliotangulia, huku ‘isipokuwa tu’ ikihifadhi nguvu ya maneno mawili ya Kiebrania yanayoweka mpaka mkali.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: kile ambacho vijana wamekula
  rationale: ‘Vijana’ ni tafsiri ya moja kwa moja na ya kawaida ya נְּעָרִים, ingawa katika muktadha inaweza pia kumaanisha watumishi au watu wa msafara.
- source_word: וְחֵלֶק
  choice: na sehemu
  rationale: ‘Sehemu’ ni neno la kawaida la Kiswahili kwa fungu linalomstahili mtu katika mgawanyo wa nyara.
- source_word: הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי
  choice: ya watu walioenda pamoja nami
  rationale: Huhifadhi picha ya kwenda pamoja na Abramu bila kuongeza ufasiri kuhusu hadhi yao.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: Aneri, Eshkoli na Mamre
  rationale: Majina yamenukuliwa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: Wao na wachukue sehemu yao
  rationale: Muundo wa Kiswahili unaonyesha ruhusa au ridhaa inayofaa muktadha, na ‘wao’ inabeba msisitizo wa kiwakilishi cha Kiebrania.
theological_decisions:
- issue: Kuendeleza kiapo na kukataa kwa Abramu kutoka mstari uliotangulia
  choice: 'Kuweka wazi kitenzi kinachodokezwa: ‘Sitachukua chochote’'
  alternative: 'Kuacha kishazi kisicho na kitenzi: ‘isipokuwa tu kile ambacho vijana wamekula…’'
  rationale: Kiebrania kinategemea sentensi iliyotangulia, lakini Kiswahili cha kawaida huhitaji wazo hilo lielezwe ili mstari ujisimamie bila kubadili msimamo wa Abramu kuhusu nyara.
- issue: Nguvu ya יִקְחוּ katika muktadha
  choice: 'Ruhusa: ‘na wachukue’'
  alternative: 'Wakati ujao: ‘watachukua’'
  rationale: Muktadha unaonyesha Abramu akiwaruhusu washirika wake wapokee fungu lao, ingawa umbo la Kiebrania linaweza pia kueleweka kama kauli rahisi ya wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Isipokuwa tu’ huhifadhi msisitizo wa vizuizi viwili vya Kiebrania; majina yametolewa kwa maumbo yanayofaa matamshi ya Kiswahili.
