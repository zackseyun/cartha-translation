base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: sw
  text: Katika mwaka wa kumi na nne, Kedorlaomer[a] alikuja pamoja na wafalme waliokuwa pamoja naye, nao wakawashinda Warefai[b] huko Ashteroth-Karnaim, Wazuzu huko Hamu, na Waemi huko Shaveh-Kiriathaim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili huandikwa “Kedorlaoma” katika baadhi ya tafsiri za Kiswahili; “Kedorlaomer” linafuata kwa karibu zaidi umbo la Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya tafsiri huita Warefai “majitu,” lakini hapa jina lao kama kundi la watu limehifadhiwa.
    reason: lexical_alternative
  - marker: c
    text: Shaveh-Kiriathaim pia inaweza kueleweka kuwa “uwanda wa Kiriathaim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: Katika mwaka wa kumi na nne
  rationale: Kirai hiki cha wakati kinatoa Kiswahili cha kawaida na wazi; kiunganishi cha mwanzo kinaeleweka kutokana na mwendelezo wa simulizi bila kulazimika kutafsiriwa kwa “na”.
- source_word: בָּא
  choice: alikuja
  rationale: Kitenzi בוא kwa kawaida humaanisha kuja au kufika. “Alikuja” huhifadhi upana wake bila kuongeza dhana mahsusi ya kuandamana kivita.
- source_word: כְדָרְלָעֹמֶר
  choice: Kedorlaomeri
  rationale: Jina limenukuliwa kwa namna inayokaribia umbo la Kiebrania huku likipewa matamshi yanayosomeka kwa urahisi katika Kiswahili.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: pamoja na wafalme waliokuwa pamoja naye
  rationale: Huwatambulisha wafalme washirika walioandamana na Kedorlaomeri na kuhifadhi maana ya אִתּוֹ.
- source_word: וַיַּכּוּ
  choice: nao wakawashinda
  rationale: Katika muktadha wa vita, נכה ina maana ya kuwapiga na kuwashinda. “Wakawashinda” ni ya kawaida katika Kiswahili na inaeleza matokeo bila kutumia usemi wa kizamani.
- source_word: רְפָאִים
  choice: Warefaimu
  rationale: Limehifadhiwa kama jina la kundi la watu badala ya kutafsiriwa kuwa “majitu,” jambo ambalo lingeamua maana inayoweza kubishaniwa.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: huko Ashteroth-Karnaimu
  rationale: Kiambishi בְּ kinaonyesha mahali; “huko” kinafaa katika orodha ya maeneo ya mapigano, na jina la mahali limenukuliwa.
- source_word: הַזּוּזִים
  choice: Wazuzi
  rationale: Jina la kundi la watu limetoholewa kwa muundo wa majina ya watu katika Kiswahili.
- source_word: בְּהָם
  choice: huko Hamu
  rationale: הָם inaeleweka hapa kuwa jina la mahali; “huko” huonyesha eneo bila kuliongezea maana nyingine.
- source_word: הָאֵימִים
  choice: Waemi
  rationale: Jina la kundi la watu limetoholewa kwa namna ya kawaida ya Kiswahili.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: huko Shaveh-Kiriathaimu
  rationale: Limedumishwa kama jina ambatani la mahali, kulingana na mpangilio wa majina ya maeneo katika aya, bila kulazimisha שָׁוֵה kutafsiriwa kuwa “uwanda.”
theological_decisions:
- issue: Utambulisho wa Warefaimu
  choice: Jina la watu “Warefaimu” limehifadhiwa.
  alternative: “Majitu”
  rationale: Aya yenyewe inawataja kama kundi la watu katika orodha ya mataifa yaliyoshindwa; kutafsiri jina kuwa “majitu” kungeingiza tafsiri isiyolazimishwa na sentensi hii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya makundi ya watu yametoholewa kwa viambishi vya ngeli ya watu, huku majina ya mahali yakihifadhiwa kwa unukuzi unaosomeka. Muundo wa simulizi ni wa kawaida bila kuondoa urudiaji wa maana uliopo katika “pamoja na ... pamoja naye.”
