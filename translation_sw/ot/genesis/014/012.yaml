  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: sw
  text: Wakamchukua Loti[a], mpwa wa Abramu, pamoja na mali yake, wakaondoka. Loti alikuwa akiishi Sodoma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwana wa ndugu ya Abramu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Wakamchukua
  rationale: Qal wayyiqtol ya לקח ina maana ya kawaida ya ‘kuchukua’. Muktadha ni wa mateka na nyara, lakini ‘walimkamata’ ingeongeza nguvu isiyoelezwa wazi na kitenzi chenyewe.
- source_word: רְכֻשׁוֹ
  choice: mali yake
  rationale: רְכוּשׁ humaanisha mali au vitu vinavyomilikiwa; ‘mali yake’ ni Kiswahili cha kawaida, wazi, na kinafaa katika muktadha wa nyara.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: mwana wa ndugu ya Abramu
  rationale: Huhifadhi kwa uwazi muundo wa ukoo wa Kiebrania badala ya kuufupisha tu kuwa ‘mpwa wa Abramu’; tanbihi inaeleza uhusiano huo kwa lugha ya kawaida.
- source_word: וַיֵּלֵכוּ
  choice: wakaondoka
  rationale: הלך hapa inaeleza kuondoka baada ya kuwachukua mateka na mali; ‘wakaondoka’ ni ya asili zaidi katika Kiswahili kuliko ‘wakaenda’ bila kutaja walikoenda.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: Loti alikuwa akiishi Sodoma
  rationale: Kishazi hiki kinatoa maelezo ya msingi kuhusu mahali Loti alipokuwa akiishi. Kutaja ‘Loti’ badala ya kiwakilishi ‘yeye’ huondoa utata wa kawaida wa Kiswahili bila kubadili maana.
