translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Tafsiri inadumisha usemi halisi wa ukoo katika maandiko na kuufafanua kwa tanbihi; haitumii kitenzi chenye nguvu zaidi kama ‘walimkamata’ kwa sababu לקח yenyewe ni ‘kuchukua’.
