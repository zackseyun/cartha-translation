translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Hawa wote” hudumisha kutotajwa kwa nomino katika Kiebrania, huku muktadha ukibainisha wanaorejelewa. Alama ya tanbihi imewekwa mara tu baada ya “yaani” kufuatana na safu ya mashauriano.
