lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Hawa wote
  rationale: Muundo huu unaonyesha kundi zima bila kuongeza nomino “wafalme,” ambayo haipo katika Kiebrania cha mstari huu.
- source_word: חָבְרוּ
  choice: walikusanyika
  rationale: Kitenzi hiki kina maana ya kuungana au kukusanyika pamoja. “Walikutana” kingeweza kudokeza tukio la kawaida tu, na “walifanya muungano” kingekuwa fasiri yenye nguvu zaidi kuliko neno la asili.
- source_word: אֶל
  choice: katika
  rationale: Ingawa אֶל mara nyingi humaanisha “kwenda/kuelekea,” pamoja na kitenzi cha kukusanyika hapa inaeleza mahali walipokusanyika; “katika” ni Kiswahili cha kawaida.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: Bonde la Sidimu
  rationale: עֵמֶק ni “bonde,” na שִׂדִּים ni jina la mahali, lililotoholewa kuwa “Sidimu.”
- source_word: הוּא
  choice: yaani
  rationale: Kiwakilishi hiki kinaanzisha ufafanuzi unaolitambulisha Bonde la Sidimu kwa jina lingine la mahali hapo.
- source_word: יָם הַמֶּלַח
  choice: Bahari ya Chumvi
  rationale: Hili ndilo tafsiri ya moja kwa moja na ya kawaida ya jina la Kiebrania; jina la baadaye “Bahari ya Chumvi Iliyokufa” limewekwa katika tanbihi.
