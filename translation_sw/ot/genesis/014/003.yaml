  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: sw
  text: Hawa wote waliungana katika Bonde la Sidimu (yaani[a] Bahari ya Chumvi).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa jina lake la baadaye, Bahari Mfu.
