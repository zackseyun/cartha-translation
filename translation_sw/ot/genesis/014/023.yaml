base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: sw
  text: kwamba sitachukua, kuanzia uzi hadi kamba ya kandambili[a], wala chochote kilicho chako, ili usije ukasema, ‘Mimi ndiye niliyemtajirisha Abramu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia muundo wa kiapo uliodondoshwa: “ikiwa kutoka uzi hadi kamba ya kandambili, na ikiwa nitachukua chochote kilicho chako...” Maana yake ni kukataa kwa kiapo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: sitachukua ... hata
  rationale: Katika muktadha wa kiapo kinachoanza katika mstari wa 22, אִם ni sehemu ya kauli ya kiapo iliyofupishwa, si sharti la kawaida. Kiswahili kinaweka wazi kukataa kwa kiapo kwa kutumia ‘sitachukua ... hata’.
- source_word: מִחוּט וְעַד שְׂרוֹךְ נַעַל
  choice: hata uzi au ukanda wa kiatu
  rationale: ‘Uzi’ na ‘ukanda wa kiatu’ huhifadhi mifano halisi ya vitu vidogo sana; ‘hata ... au’ huwasilisha kwa Kiswahili cha kawaida maana ya kutokuchukua kitu chochote katika wigo huo.
- source_word: אֶקַּח
  choice: sitachukua
  rationale: Katika kauli hii ya kiapo, kitenzi kinaonyesha kukataa kwa uthabiti kuchukua mali yoyote.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: chochote kilicho chako
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayohifadhi maana pana ya kutokuchukua kitu chochote kinachomilikiwa na mfalme.
- source_word: וְלֹא תֹאמַר
  choice: ili usije ukasema
  rationale: Kirai hiki kinaonyesha kusudi la Abramu la kukataa mali na kwa Kiswahili huwasilisha uwezekano anaotaka kuuzuia.
- source_word: הֶעֱשַׁרְתִּי
  choice: niliyemtajirisha
  rationale: Hifili ya עשר ina maana ya ‘kumfanya awe tajiri’; ‘niliyemtajirisha’ ni fupi, wazi, na huhifadhi dai linaloweza kutolewa.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Muundo wa kiapo uliodondoshwa
  choice: 'Kutafsiri kama kukataa kwa kiapo: ‘sitachukua chochote ... hata ...’'
  alternative: 'Kutafsiri neno kwa neno kama sharti: ‘ikiwa kutoka uzi ... na ikiwa nitachukua ...’'
  rationale: Muktadha wa kuinua mkono kwa BWANA katika mstari wa 22 unaonyesha kuwa אִם inaanzisha kiapo chenye adhabu iliyodondoshwa. Tafsiri inaweka wazi kukataa huku bila kuongeza maudhui ya adhabu yasiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Ukanda wa kiatu’ unafaa zaidi kwa viatu vya kale kuliko ‘kamba ya kiatu’; ‘ili usije ukasema’ ni njia ya kawaida na yenye hadhi ya kueleza kusudi hasi.
