  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: sw
  text: Abramu aliposikia kwamba ndugu yake alikuwa ametekwa[a], akawakusanya[b] watu wake waliofunzwa, waliozaliwa katika nyumba yake, mia tatu na kumi na wanane, akawafuatilia mpaka Dani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndugu yake.” Neno hilo linaweza pia kumaanisha jamaa wa kiume wa karibu, kama vile mpwa.'
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kina maana isiyo hakika hapa; kinaweza pia kutafsiriwa “akawatoa,” “akawapanga,” au huenda “akawapa silaha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: alikuwa ametekwa
  rationale: Kauli tendwa ya kitenzi hiki inaonyesha kutekwa vitani; “ametekwa” ni ya kawaida na inahifadhi maana hiyo.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Neno la Kiebrania kwa uso wake ni “ndugu yake,” lakini linaweza pia kumaanisha jamaa wa kiume wa karibu. Kiswahili “ndugu” kinahifadhi upana huo bila kumfafanua Loti kimyakimya kuwa mpwa katika matini kuu.
- source_word: וַיַּרֶק
  choice: akawakusanya
  rationale: Kitenzi hiki kina maana inayobishaniwa katika muktadha huu. “Akawakusanya” kinaonyesha kuwaita na kuwapanga watu kwa ajili ya msako wa kijeshi bila kuamua moja kwa moja kwamba aliwapa silaha au aliwatoa nje.
- source_word: חֲנִיכָיו
  choice: watu wake waliofunzwa
  rationale: Neno linawahusu watu waliofunzwa au kuandaliwa chini ya mamlaka ya Abramu. Tafsiri hii ni wazi na haiongezi moja kwa moja neno “watumishi.”
- source_word: יְלִידֵי בֵיתוֹ
  choice: waliozaliwa katika nyumba yake
  rationale: Kirai hiki kinawatambulisha kama watu waliozaliwa ndani ya kaya ya Abramu; tafsiri inahifadhi taswira ya “nyumba” na uhusiano wao wa kijamii naye.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: mia tatu na kumi na wanane
  rationale: Inafuata idadi kamili ya Kiebrania na mtindo wa kawaida wa kuandika namba kwa maneno katika simulizi.
- source_word: וַיִּרְדֹּף
  choice: akawafuatilia
  rationale: Katika muktadha huu kitenzi kinaonyesha kuwafuata maadui kwa kusudi la kijeshi; kiambishi cha yambwa “-wa-” kinaweka wazi wahusika wanaofuatwa kutokana na muktadha.
- source_word: עַד דָּן
  choice: mpaka Dani
  rationale: “Mpaka” huonyesha kikomo cha eneo alilofikia katika kuwafuatilia, kama עַד ya Kiebrania.
theological_decisions:
- issue: Neno la undugu linalomhusu Loti
  choice: Kuhifadhi “ndugu yake” katika matini kuu
  alternative: jamaa yake; mpwa wake
  rationale: Kiebrania kinasema אָחִיו, neno linaloweza kutaja ndugu halisi au jamaa wa kiume wa karibu. “Ndugu yake” huhifadhi usemi na upana wa chanzo; tanbihi inaeleza kuwa hapa linaweza kumhusu mpwa.
- issue: Maana ya kitenzi וַיַּרֶק
  choice: akawakusanya
  alternative: akawatoa; akawapanga; akawapa silaha
  rationale: Maana mahususi ya kitenzi hiki ni tata. Tafsiri kuu inaeleza tendo la kuhamasisha kikosi bila kuamua kwa uhakika kati ya kuwaongoza watoke na kuwapa silaha; mbadala zinahifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Abramu” na “Dani” zinafuata maumbo yaliyozoeleka katika tafsiri za Biblia za Kiswahili. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
