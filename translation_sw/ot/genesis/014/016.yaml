translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wenye nusu-koloni unaonyesha vifungu viwili vya vitenzi katika Kiebrania, huku marudio ya ‘pia’ yakihifadhi mkazo wa kuongeza.
