  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: sw
  text: Akavirudisha mali zote; akamrudisha pia Loti, ndugu yake[a], pamoja na mali zake, na pia wanawake na watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndugu yake.” Hapa “ndugu” lina maana pana ya mtu wa ukoo; katika simulizi Loti ni mpwa wa Abramu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: Akavirudisha
  rationale: Kitenzi cha Hifili cha שוב hapa kina maana ya kusababisha vitu virudi, yaani kuvirudisha baada ya kuvikomboa; umbo la simulizi ‘aka-’ linaendeleza mfululizo wa matukio.
- source_word: כָּל הָרְכֻשׁ
  choice: mali zote
  rationale: רְכוּשׁ humaanisha mali, milki, au vitu vinavyomilikiwa; ‘mali zote’ ni Kiswahili cha kawaida na chenye upana unaofaa.
- source_word: וְגַם
  choice: pia / na pia
  rationale: Maneno haya yanahifadhi nguvu ya kuongeza jambo jingine, ambayo inatokea mara mbili katika Kiebrania.
- source_word: לוֹט אָחִיו
  choice: Loti, ndugu yake
  rationale: ‘Ndugu’ huhifadhi neno la Kiebrania אָח na katika Kiswahili linaweza pia kumaanisha jamaa wa ukoo, si kaka au mdogo wa kiume pekee.
- source_word: וּרְכֻשׁוֹ
  choice: pamoja na mali zake
  rationale: ‘Mali’ limetumiwa kwa uthabiti kutafsiri רְכוּשׁ; kiambishi ‘-zake’ kinamhusu Loti.
- source_word: הֵשִׁיב
  choice: akamrudisha
  rationale: Hii ni Hifili nyingine ya שוב; ‘akamrudisha’ inaonyesha kwamba Loti aliletwa tena kutoka utumwani na inadumisha kurudiwa kwa kitenzi katika chanzo.
- source_word: הַנָּשִׁים
  choice: wanawake
  rationale: Neno la Kiebrania ni pana kuliko ‘wake’; ‘wanawake’ haliongezi ubainisho usiokuwamo katika matini.
- source_word: הָעָם
  choice: watu wengine
  rationale: עָם humaanisha watu kwa ujumla. ‘Watu wengine’ hufanya sentensi ya Kiswahili iwe wazi baada ya kutajwa kwa wanawake bila kupunguza maana kuwa wanaume pekee.
