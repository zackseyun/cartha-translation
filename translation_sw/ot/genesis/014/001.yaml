base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: sw
  text: 'Ikawa katika siku za Amrafeli mfalme wa Shinari, Arioki mfalme wa Elasari, Kedorlaoma mfalme wa Elamu, na Tidali mfalme wa mataifa[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme wa Goyimu.” Neno la Kiebrania goyim kwa kawaida humaanisha “mataifa,” lakini hapa huenda likawa jina la mahali, kama yalivyo majina mengine ya mahali katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Kauli hii ya kawaida ya masimulizi inaendeleza simulizi na kuweka mazingira ya tukio bila kutumia lugha nzito au ya kizamani.
- source_word: בִּימֵי
  choice: katika siku za
  rationale: Huhifadhi muundo wa muda wa Kiebrania na ni usemi unaoeleweka katika Kiswahili cha heshima.
- source_word: אַמְרָפֶל
  choice: Amrafeli
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: מֶלֶךְ שִׁנְעָר
  choice: mfalme wa Shinari
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja, huku jina la mahali likitoholewa.
- source_word: אַרְיוֹךְ
  choice: Arioki
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: מֶלֶךְ אֶלָּסָר
  choice: mfalme wa Elasari
  rationale: Cheo na jina la mahali vimetolewa kwa uwazi na kwa kufuata muundo wa chanzo.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedorlaoma
  rationale: Utohozi huu unasomeka kwa urahisi katika Kiswahili huku ukikaribia umbo la jina la Kiebrania.
- source_word: מֶלֶךְ עֵילָם
  choice: mfalme wa Elamu
  rationale: Cheo kimetafsiriwa na jina la mahali limetoholewa kwa muundo wa Kiswahili.
- source_word: וְתִדְעָל
  choice: na Tidali
  rationale: Kiunganishi kimehifadhiwa, na jina limetoholewa kwa matamshi ya Kiswahili.
- source_word: מֶלֶךְ גּוֹיִם
  choice: mfalme wa mataifa[a]
  rationale: Maana ya kawaida ya גּוֹיִם ni ‘mataifa.’ Hata hivyo, kwa kuwa hapa inaweza kuwa jina la mahali kama majina mengine katika orodha, uwezekano huo umehifadhiwa katika tanbihi.
