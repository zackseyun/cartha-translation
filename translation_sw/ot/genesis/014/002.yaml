id: GEN.14.2
reference: Genesis 14:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: sw
  text: walifanya vita dhidi ya Bera, mfalme wa Sodoma; Birsha, mfalme wa Gomora; Shinabu, mfalme wa Adma; Shemeberi, mfalme wa Seboimu; na mfalme wa Bela (yaani, Soari).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: walifanya vita
  rationale: Huhifadhi nahau ya Kiebrania yenye maana ya kufanya au kuendesha vita, huku ikiwa Kiswahili cha sasa kinachoeleweka.
- source_word: אֶת ... וְאֶת
  choice: dhidi ya
  rationale: Katika muktadha huu viambishi hivyo vinawatambulisha wale waliopigwa vita. ‘Dhidi ya’ huonyesha wazi uhusiano wa uadui na kutawala orodha yote ya wafalme.
- source_word: בֶּרַע
  choice: Bera
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: מֶלֶךְ סְדֹם
  choice: mfalme wa Sodoma
  rationale: Muundo wa Kiebrania wa cheo na mahali umetafsiriwa moja kwa moja na kwa njia ya kawaida katika Kiswahili.
- source_word: בִּרְשַׁע
  choice: Birsha
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa maana yake.
- source_word: עֲמֹרָה
  choice: Gomora
  rationale: Imetumiwa tahajia ya jina la mahali iliyozoeleka katika Kiswahili cha Biblia.
- source_word: שִׁנְאָב
  choice: Shinabu
  rationale: Jina la mtu limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: אַדְמָה
  choice: Adma
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili.
- source_word: שֶׁמְאֵבֶר
  choice: Shemeberi
  rationale: Jina la mtu limetoholewa kwa umbo linalolingana na mfumo wa sauti wa Kiswahili.
- source_word: צביים
  choice: Seboimu
  rationale: Jina la mahali limetoholewa kwa kufuata matamshi ya maandishi ya Kiebrania na matumizi yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: מֶלֶךְ בֶּלַע
  choice: mfalme wa Bela
  rationale: Kwa kuwa maandishi hayataji jina binafsi la mfalme huyu, utambulisho wake kwa mji wake umehifadhiwa.
- source_word: הִיא צֹעַר
  choice: yaani, Soari
  rationale: Kirai hiki kinaitambulisha Bela kuwa mahali pale pale panapoitwa Soari; ‘yaani’ huwasilisha ufafanuzi huo kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Alama za nusu koloni zimetumiwa kutenganisha majina na vyeo katika orodha ndefu bila kuleta dhana kwamba ‘dhidi ya’ inawahusu wafalme wawili wa kwanza pekee.
