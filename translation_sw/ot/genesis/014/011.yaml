  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: sw
  text: Kisha wakachukua mali yote ya Sodoma na Gomora, pamoja na chakula chao chote, wakaondoka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi לקח katika mfululizo wa simulizi. Katika muktadha huu inahusisha kutwaa nyara, lakini ‘wakachukua’ haiongezi ufafanuzi usio lazima.
- source_word: כָּל
  choice: yote/chote
  rationale: Kirai hiki kimerudiwa katika Kiebrania ili kuonyesha ukamilifu wa mali na chakula kilichochukuliwa; upatanisho wa kisarufi wa Kiswahili unahitaji ‘yote’ kwa mali na ‘chote’ kwa chakula.
- source_word: רְכֻשׁ
  choice: mali
  rationale: ‘Mali’ ni neno la kawaida na lenye upana unaofaa kwa vitu vinavyomilikiwa au bidhaa zinazoweza kutwaliwa, bila kulifanya limaanishe utajiri wa fedha pekee.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodoma na Gomora
  rationale: Haya ndiyo maumbo yaliyozoeleka ya majina haya katika Kiswahili cha Biblia na yanatambulika kwa urahisi na wasomaji.
- source_word: אָכְלָם
  choice: chakula chao
  rationale: Nomino hii inamaanisha chakula, ikiwa na kiambishi cha nafsi ya tatu wingi. ‘Chakula chao’ ndiyo tafsiri ya moja kwa moja; maana ya mahitaji ya chakula ya safari au vita inawezekana kimuktadha lakini si lazima hapa.
- source_word: וַיֵּלֵכוּ
  choice: wakaondoka
  rationale: Katika muktadha wa jeshi linalotwaa mali na kisha kwenda zake, ‘wakaondoka’ huwasilisha kuondoka kwao kwa Kiswahili cha kawaida na kwa ufupi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vinavyofuatana—‘wakachukua ... wakaondoka’—unahifadhi mwendo wa simulizi la Kiebrania. Hakuna tanbihi iliyoongezwa kwa sababu אָכְלָם imetafsiriwa kwa maana yake ya msingi, ‘chakula chao’; tanbihi ya Kiingereza iliyoambatanishwa na majina ya miji inaonekana kutolingana na neno linaloelezwa.
