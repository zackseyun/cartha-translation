  source_fidelity: Tafsiri inawakilisha kwa uaminifu orodha ya wafalme na maeneo katika Kiebrania. «Dhidi ya» huwasilisha kwa usahihi matumizi ya אֶת katika muktadha huu wa pande zinazokabiliana vitani, na «wale watano» huhifadhi ufupi wa הַחֲמִשָּׁה, ambako «wafalme» inaeleweka kutokana na kifungu kilichotangulia.
  naturalness: Kiswahili ni sanifu, cha asili, na chenye mtindo mfupi unaofaa orodha hii. Tahajia za majina—Kedorlaoma, Tidali, Amrafeli, Arioko, Elamu, Goimu, Shinari, na Elasari—zinaendana na utohozi wa kawaida wa Kiswahili.
