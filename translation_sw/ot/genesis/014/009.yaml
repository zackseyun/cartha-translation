  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: sw
  text: Kedorlaoma mfalme wa Elamu, Tidali mfalme wa Goimu[a], Amrafeli mfalme wa Shinari, na Arioko mfalme wa Elasari—wafalme wanne dhidi ya wale watano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tidali mfalme wa mataifa.” Neno la Kiebrania גּוֹיִם linaweza kumaanisha “mataifa,” lakini hapa huenda pia likawa jina la mahali, “Goimu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: dhidi ya
  rationale: Katika orodha hii ya pande zinazopigana, neno hili linaonyesha upinzani kati ya wafalme wanne na wale watano; Kiswahili kinahitaji uhusiano huo usemwe wazi.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedorlaoma
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: מֶלֶךְ עֵילָם
  choice: mfalme wa Elamu
  rationale: Muundo wa umilikishi umetafsiriwa moja kwa moja na kwa kawaida katika Kiswahili.
- source_word: תִדְעָל
  choice: Tidali
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti wa Kiswahili.
- source_word: גּוֹיִם
  choice: Goimu
  rationale: Katika cheo hiki cha kifalme, neno linaweza kuwa jina la mahali; tafsiri kuu inalihifadhi kama jina huku tanbihi ikitaja maana nyingine halali.
- source_word: אַמְרָפֶל
  choice: Amrafeli
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili.
- source_word: שִׁנְעָר
  choice: Shinari
  rationale: Jina la mahali la Kiebrania limehifadhiwa badala ya kubadilishwa kuwa utambulisho wa kihistoria unaokisiwa.
- source_word: אַרְיֹוךְ
  choice: Arioko
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti wa Kiswahili.
- source_word: אֶלָּסָר
  choice: Elasari
  rationale: Jina la mahali limetoholewa bila kulihusianisha kwa kubahatisha na eneo jingine.
- source_word: אַרְבָּעָה מְלָכִים
  choice: wafalme wanne
  rationale: Idadi na nomino zimetafsiriwa moja kwa moja kwa upatanisho wa kisarufi wa Kiswahili.
- source_word: הַחֲמִשָּׁה
  choice: wale watano
  rationale: Kiebrania kinasema kwa ufupi 'wale watano,' huku 'wafalme' ikieleweka kutokana na kishazi kilichotangulia; ufupi huo umehifadhiwa kwa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametoholewa kwa urahisi wa matamshi ya Kiswahili; sentensi imehifadhi muundo mfupi wa orodha ya Kiebrania na utata halisi wa גּוֹיִם umewekwa katika tanbihi.
