  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: sw
  text: Naye akambariki, akasema, “Abramu na abarikiwe na Mungu Aliye Juu Sana, mwenye[a] mbingu na dunia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Muumba wa mbingu na dunia.” Neno la Kiebrania linaweza kumaanisha “mwenye,” “mmiliki,” au, katika muktadha huu, “Muumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: Naye akambariki
  rationale: Kauli ya masimulizi inaonyesha tendo linalofuata, na kiambishi cha yambwa kinarejelea Abramu. “Naye” huhifadhi mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Ni kauli ya kawaida ya kuanzisha maneno yanayofuata katika masimulizi; “akasema” huhifadhi mfuatano wa matendo kwa ufasaha.
- source_word: בָּרוּךְ אַבְרָם
  choice: Abramu na abarikiwe
  rationale: Muundo huu unawasilisha kwa lugha ya heshima nguvu ya tamko la baraka, badala ya kulifanya kuwa taarifa ya kawaida tu.
- source_word: לְאֵל עֶלְיוֹן
  choice: na Mungu Aliye Juu Sana
  rationale: Katika tamko hili la baraka, “na” humtaja Mungu kuwa chanzo au mtendaji wa baraka. Jina la cheo “Mungu Aliye Juu Sana” ni la asili na wazi kwa Kiswahili.
- source_word: קֹנֵה
  choice: mwenye
  rationale: Neno la Kiebrania linaweza kumaanisha mwenye au mmiliki, na katika muktadha huu pia linaweza kueleweka kuwa Muumba. “Mwenye” huhifadhi upana wake bila kuamua maana kuwa uumbaji pekee.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: mbingu na dunia
  rationale: Huu ni msemo unaojumlisha ulimwengu wote. “Mbingu na dunia” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Maana ya קֹנֵה katika cheo cha Mungu
  choice: mwenye mbingu na dunia
  alternative: Muumba wa mbingu na dunia
  rationale: Kitenzi קנה kinaweza kuonyesha kumiliki au kupata, na katika baadhi ya miktadha kuumba. Tafsiri kuu haitakiwi kufunga maana katika upande mmoja; kwa hiyo “mwenye” limetumiwa, huku “Muumba” likihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa masimulizi, na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa moja kwa moja baada ya neno linalohusika. Tofauti ya Kiingereza kati ya “heaven” na “the heavens” haikuhitaji tanbihi tofauti kwa sababu “mbingu” tayari ndiyo umbo la kawaida la Kiswahili katika usemi huu.
