base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: sw
  text: Kwa miaka kumi na miwili walimtumikia Kedorlaoma, lakini mwaka wa kumi na tatu waliasi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Kwa miaka kumi na miwili
  rationale: Kirai cha Kiebrania kinaonyesha muda; ‘kwa miaka kumi na miwili’ ni Kiswahili cha kawaida na huunganika wazi na tendo la kutumikia.
- source_word: עָבְדוּ
  choice: walimtumikia
  rationale: Kitenzi עבד humaanisha kutumikia; katika muktadha huu kinaonyesha wafalme waliokuwa chini ya mamlaka ya mtawala mwingine. ‘Walimtumikia’ huhifadhi taswira ya huduma ya kisiasa bila kuifafanua kupita kiasi.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: Kedorlaoma
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, likifuata kwa karibu matamshi yanayoashiriwa na umbo la Kiebrania.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: lakini mwaka wa kumi na tatu
  rationale: 'Ingawa kihalisi Kiebrania kina ‘na mwaka kumi na tatu,’ muktadha unaonyesha mgeuko wa wakati na hali: baada ya miaka kumi na miwili ya utumishi, waliasi katika mwaka uliofuata.'
- source_word: מָרָדוּ
  choice: waliasi
  rationale: מרד humaanisha kuasi au kuasi mamlaka; ‘waliasi’ ni neno la moja kwa moja na la kawaida katika muktadha wa kisiasa na kijeshi.
