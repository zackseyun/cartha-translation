  source_fidelity: 'Tafsiri inafuata maana ya Kiebrania kwa karibu: mtu aliyenusurika/aliyeponyoka anamletea Abramu habari; Abramu anaelezwa kuwa akiishi karibu na miti ya Mamre, Mwamori; na Mamre, Eshkoli, na Aneri wanahusishwa na Abramu kwa agano. Hata hivyo, ׳mtu mmoja׳ huongeza wazo la hesabu ambalo halimo katika הַפָּלִיט, nomino yenye kiambishi bayana ikimaanisha ‘mtu yule aliyeponyoka/aliyenusurika.’'
