base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: sw
  text: Ndipo mtu aliyeponyoka akaja na kumweleza Abramu, Mwebrania. Wakati huo Abramu alikuwa akiishi karibu na mialoni ya Mamre[a], Mwamori, ndugu wa Eshkoli na ndugu wa Aneri[b]. Mamre, Eshkoli, na Aneri walikuwa washirika wa Abramu kwa agano[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karibu na mivinje ya Mamre.” Neno la Kiebrania linaweza kumaanisha miti mikubwa, ambayo mara nyingi hutambuliwa kuwa mialoni au mivinje.
    reason: lexical_alternative
  - marker: b
    text: Au, “jamaa wa Eshkoli na jamaa wa Aneri.” Neno la Kiebrania linalotafsiriwa “ndugu” linaweza pia kumaanisha mtu wa ukoo mpana zaidi.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “wenye agano pamoja na Abramu,” yaani, watu waliounganishwa naye kwa mkataba wa ushirikiano.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: mtu mmoja aliyeponyoka
  rationale: Nomino hii humaanisha mtu aliyetoroka au kuokoka katika hatari au vita. ‘Aliyeponyoka’ inaonyesha kitendo cha kutoka salama bila kudokeza kwamba alikuwa mhalifu au mwasi.
- source_word: וַיַּגֵּד
  choice: akamweleza
  rationale: Kitenzi hiki humaanisha kueleza, kutoa habari, au kuripoti. ‘Akamweleza’ ni lugha ya kawaida na inaendeleza mtiririko wa simulizi.
- source_word: הָעִבְרִי
  choice: Mwebrania
  rationale: Hili ni jina la kijamii au kikabila analopewa Abramu katika mstari huu; ‘Mwebrania’ ndilo neno la kawaida katika Kiswahili.
- source_word: שֹׁכֵן
  choice: alikuwa akiishi
  rationale: Hali ya kushiriki inaonyesha makao yaliyoendelea wakati huo. ‘Alikuwa akiishi’ ni ya asili katika Kiswahili na huhifadhi maana hiyo ya kuendelea.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: karibu na mialoni ya Mamre
  rationale: אֵלֹנֵי hurejelea miti mikubwa ambayo mara nyingi hutambuliwa kuwa mialoni au mivinje. ‘Mialoni’ ni neno linaloeleweka kwa urahisi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: הָאֱמֹרִי
  choice: Mwamori
  rationale: Ni jina la kawaida la kabila linalomfafanua Mamre.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: ndugu ya Eshkoli na ndugu ya Aneri
  rationale: אָח kwa kawaida ni ‘ndugu,’ ingawa inaweza pia kumaanisha jamaa wa ukoo mpana. Kurudia ‘ndugu’ kunafuata muundo wa Kiebrania na uwezekano mpana unaelezwa katika tanbihi.
- source_word: בַּעֲלֵי בְרִית
  choice: washirika wa Abramu kwa agano
  rationale: Kirai hiki kihalisi ni ‘wenye agano’ na humaanisha watu waliounganishwa naye kwa mkataba au ushirikiano rasmi. Tafsiri hii inaeleweka vizuri na bado inataja agano lililo msingi wa ushirika huo.
