translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametoholewa kwa maumbo yanayotamkika kwa Kiswahili. Sentensi imegawanywa baada ya utambulisho wa Kadeshi ili simulizi lisomeke kwa urahisi bila kupoteza mfuatano wa Kiebrania.
