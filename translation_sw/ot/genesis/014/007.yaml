base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: sw
  text: Kisha wakarudi, wakafika En-mishpati (yaani, Kadeshi)[a], wakaishambulia nchi yote ya Waamaleki[b], na pia Waamori waliokuwa wakiishi katika Hazazoni-tamari[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-mishpati maana yake ni “chemchemi ya hukumu.”
    reason: cultural_note
  - marker: b
    text: Au “eneo lote la Mwamaleki.” Kiebrania kinasema kihalisi “eneo lote la Mwamaleki,” yaelekea kikimaanisha eneo walilokalia Waamaleki.
    reason: lexical_alternative
  - marker: c
    text: Hazazoni-tamari inatambulishwa kuwa En-gedi katika 2 Mambo ya Nyakati 20:2.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Kisha wakarudi
  rationale: Kitenzi cha simulizi kinaonyesha tendo lililofuata na kurudi kwao; “kisha” huendeleza mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: וַיָּבֹאוּ אֶל
  choice: na kufika
  rationale: Katika muktadha wa safari baada ya kurudi, “kufika” ni usemi wa asili unaowasilisha kuja mahali palipotajwa.
- source_word: עֵין מִשְׁפָּט
  choice: En-Mishpati
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; maana yake imeelezwa katika tanbihi.
- source_word: הִוא קָדֵשׁ
  choice: (yaani, Kadeshi)
  rationale: Kirai hiki kinatambulisha En-Mishpati kuwa Kadeshi; mabano yanaonyesha maelezo ya utambulisho.
- source_word: וַיַּכּוּ
  choice: Wakashambulia
  rationale: נכה inaweza kumaanisha kupiga au kushambulia. “Wakashambulia” hudumisha tendo la kijeshi bila kudai wazi kwamba waliwaangamiza kabisa.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: nchi yote ya Waamaleki
  rationale: שְׂדֵה maana yake ya msingi ni “uwanja/shamba,” lakini hapa inaelekea kutaja eneo walilokalia Waamaleki; “nchi” ni ya asili na huhifadhi maana ya kijiografia.
- source_word: הָעֲמָלֵקִי
  choice: Waamaleki
  rationale: Nomino ya kikabila ya umoja katika Kiebrania inatumika kwa maana ya jumla; Kiswahili hutumia wingi kwa kundi la watu.
- source_word: וְגַם
  choice: na pia
  rationale: Huhifadhi msisitizo wa kuongeza kundi jingine lililoshambuliwa.
- source_word: הָאֱמֹרִי הַיֹּשֵׁב
  choice: Waamori waliokuwa wakikaa
  rationale: Nomino ya kikabila imetolewa kwa wingi wa kijamii, na participio inaonyesha makazi yao yaliyoendelea mahali hapo.
- source_word: בְּחַצְצֹן תָּמָר
  choice: Hasason-Tamari
  rationale: Jina la mahali limetoholewa kwa muundo unaosomeka kwa Kiswahili; uhusiano wa mahali tayari unaeleweka baada ya “wakikaa.”
