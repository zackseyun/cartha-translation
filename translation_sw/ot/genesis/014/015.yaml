  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: sw
  text: Usiku, yeye pamoja na watumishi wake walijigawa dhidi yao; akawapiga na kuwafuatilia mpaka Hoba, ulioko kaskazini mwa Damasko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה הוּא וַעֲבָדָיו
  choice: Usiku, yeye na watumishi wake wakajigawa katika vikundi ili kuwashambulia
  rationale: Kitenzi חָלַק hapa kina maana ya kugawanyika kwa kusudi la shambulio; nyongeza ya ‘katika vikundi’ na ‘ili kuwashambulia’ huweka wazi maana inayodokezwa na עֲלֵיהֶם bila kudai mbinu zaidi ya maandishi.
- source_word: וַיַּכֵּם
  choice: Akawashinda
  rationale: נכה katika muktadha wa vita humaanisha kuwapiga au kuwashinda. ‘Akawashinda’ ni ya kawaida na haidai kwamba wote waliuawa, jambo linalopatana na kufuatiliwa kwao baadaye.
- source_word: וַיִּרְדְּפֵם
  choice: na kuwafuatilia
  rationale: Huwasilisha moja kwa moja wazo la kuwakimbiza maadui waliokuwa wakiondoka.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: kaskazini mwa Damasko
  rationale: Kihalisi ni ‘upande wa kushoto wa Damasko’; kwa mtazamo wa kawaida wa kale wa kuelekea mashariki, kushoto ni kaskazini. Kiswahili cha kijiografia hutumia kwa kawaida ‘kaskazini mwa’.
