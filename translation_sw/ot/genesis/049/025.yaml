  variant: Standard East African Swahili
source:
  edition: WLC
  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: sw
  text: 'kwa Mungu wa baba yako[a], atakayekusaidia,

    na kwa Mwenyezi, atakayekubariki

    kwa baraka za mbingu kutoka juu,

    baraka za kilindi kilicholala chini[b],

    baraka za matiti na tumbo la uzazi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa Mungu wa baba yako ... na pamoja na Mwenyezi.” Vihusishi vya Kiebrania na chembe iliyo kabla ya “Mwenyezi” vimetumiwa katika muundo uliobanwa; maneno hayo yanaweza kueleweka kuwa yanaonyesha chanzo, njia ya utendaji, au majina mawili yanayomrejelea mmoja.
    reason: alternative_reading
  - marker: b
    text: Au, “kilindi kinachojikunyata chini.” Kitenzi cha Kiebrania kinaweza kumaanisha “kulala” au “kujikunyata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל
  choice: kwa Mungu wa
  rationale: Kihusishi מִן katika mstari huu kinaweza kuonyesha chanzo au njia ya utendaji. “Kwa Mungu wa” kinasomeka kwa kawaida pamoja na kitenzi “atakayekusaidia,” huku uwezekano wa maana “kutoka kwa” ukihifadhiwa katika tanbihi.
- source_word: אָבִיךָ
  choice: baba yako
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya pili ya kiume inamrejelea moja kwa moja baba ya Yosefu katika baraka ya Yakobo.
- source_word: יַעְזְרֶךָ
  choice: atakayekusaidia
  rationale: Kitenzi ni nafsi ya tatu ya kiume umoja chenye yambwa ya nafsi ya pili. Kishazi cha uhusiano kinamtambulisha Mungu kuwa mtendaji bila kuondoa nguvu ya ahadi iliyo katika baraka.
- source_word: אֵת
  choice: na kwa
  rationale: Chembe אֵת kabla ya שַׁדַּי ina matumizi yasiyo ya kawaida na inaweza kuonyesha uratibu au kuwa katika uhusiano wa ufafanuzi. “Na kwa” kinadumisha ulinganifu na kishazi kinachotangulia bila kulazimisha ufafanuzi mmoja wa sintaksia.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Hili ni jina la cheo la Mungu. “Mwenyezi” linawasilisha maana ya cheo hicho kwa Kiswahili sanifu badala ya kukinakili kama “Shaddai.”
- source_word: וִיבָרְכֶךָ
  choice: atakayekubariki
  rationale: Kishazi cha uhusiano kinaonyesha wazi kwamba Mwenyezi ndiye anayebariki na kinaendana kimuundo na “atakayekusaidia.”
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: baraka za mbingu juu
  rationale: Tafsiri hii inadumisha picha ya kimaeneo na ulinganifu wa kishairi kati ya mbingu zilizo juu na kilindi kilicho chini.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: kilindi kilicholala chini
  rationale: תְּהוֹם ni kilindi au maji ya vilindi, na רֹבֶצֶת inaweza kumaanisha kulala au kujikunyata. “Kilicholala chini” ni picha ya moja kwa moja na inayoeleweka, huku maana mbadala ikiwekwa katika tanbihi.
- source_word: שָׁדַיִם
  choice: matiti
  rationale: Nomino ya wingi inataja matiti kama chanzo cha lishe na ishara ya uzao; wingi wa Kiebrania umehifadhiwa.
- source_word: רָחַם
  choice: tumbo la uzazi
  rationale: Katika muungano huu na “matiti,” neno linamaanisha kiungo cha kubeba mimba. “Tumbo la uzazi” ni Kiswahili cha kawaida, cha heshima na kinachoeleweka.
theological_decisions:
- issue: Tafsiri ya jina la cheo שַׁדַּי
  choice: Mwenyezi
  alternative: Shaddai
  rationale: Kutafsiri cheo hiki kunawasilisha maana yake kwa msomaji wa kawaida bila kuongeza madai ya kimafundisho yasiyomo katika mstari.
- issue: Uhusiano wa Mungu wa baba na Mwenyezi katika sintaksia iliyobanwa
  choice: kwa Mungu wa baba yako ... na kwa Mwenyezi
  alternative: kutoka kwa Mungu wa baba yako ... na pamoja na Mwenyezi
  rationale: Matini ya Kiebrania ni fupi na yenye utata wa vihusishi; tafsiri kuu inaonyesha Mungu kuwa chanzo au mtendaji wa msaada na baraka, huku tanbihi ikihifadhi usomaji mwingine halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari imepangwa ili kuhifadhi ulinganifu wa baraka za juu, za chini, na za uzazi. “Matiti” limetumiwa kwa maana yake ya moja kwa moja badala ya “maziwa,” ambayo ingebadili kiungo kilichotajwa katika Kiebrania.
