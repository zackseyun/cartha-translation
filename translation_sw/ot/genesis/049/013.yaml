  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: sw
  text: Zebuluni atakaa ufukweni mwa bahari[a]; naye atakuwa ufukweni mwa meli, na upande wake utaelekea Sidoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kina neno la umbo la wingi, yaani “bahari.” Katika Kiswahili, “bahari” lina umbo lilelile katika umoja na wingi.
    reason: lexical_alternative
  - marker: b
    text: Au “ubavu wake,” “mpaka wake,” au “sehemu zake za mbali zitaelekea Sidoni.” Neno la Kiebrania linaweza kumaanisha ubavu, upande, ukingo, au sehemu ya mbali katika muktadha wa kijiografia.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: Zebuluni
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: לְחֹוף
  choice: kando ya ufukwe wa
  rationale: Muundo huu unaonyesha mahali au mwelekeo kwa Kiswahili cha kawaida huku ukihifadhi taswira ya ufukwe.
- source_word: יַמִּים
  choice: bahari
  rationale: Ingawa Kiebrania kina umbo la wingi, katika Kiswahili 'bahari' linaweza kuwa umoja au wingi bila kubadilika; tanbihi inaeleza umbo la chanzo.
- source_word: יִשְׁכֹּן
  choice: atakaa
  rationale: Kitenzi kina maana ya kukaa au kuishi mahali; 'atakaa' kinafaa kwa kauli hii ya kishairi na ya kijiografia.
- source_word: וְהוּא
  choice: atakuwa
  rationale: Kinaendeleza usambamba wa kishairi na kuweka wazi kauli ya pili kuhusu Zebuluni.
- source_word: לְחֹוף אֳנִיּוֹת
  choice: kando ya ufukwe wa meli
  rationale: Tafsiri hii inafuata kwa karibu taswira halisi ya Kiebrania bila kuongeza wazo mahsusi la bandari.
- source_word: וְיַרְכָתוֹ
  choice: ubavu wake
  rationale: Neno linaweza kumaanisha ubavu, upande, mpaka, au sehemu ya mbali; 'ubavu' huhifadhi sitiari halisi, huku uwezekano wa maana ya kijiografia ukielezwa katika tanbihi.
- source_word: עַל
  choice: utaelekea
  rationale: Katika kauli hii ya kijiografia, kihusishi kinaonyesha mwelekeo au kuenea kuelekea mahali fulani.
- source_word: צִידֹן
  choice: Sidoni
  rationale: Jina la mahali limetoholewa kwa umbo linalotambulika katika Kiswahili.
