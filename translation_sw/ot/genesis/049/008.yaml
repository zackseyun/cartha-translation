base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: sw
  text: Yuda,[a] ndugu zako watakusifu; mkono wako utakuwa shingoni mwa adui zako; wana wa baba yako watakuinamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakushukuru.” Kitenzi cha Kiebrania kinaweza kumaanisha kushukuru, kukiri au kusifu; hapa “kusifu” kinafaa zaidi katika baraka hii na katika mchezo wa maneno unaohusiana na jina Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: יוֹדוּךָ
  choice: watakusifu
  rationale: Katika muktadha huu kitenzi ידה kina maana ya kusifu au kutambua kwa heshima, na pia kinaendeleza mchezo wa maneno unaohusiana na jina Yuda.
- source_word: אַחֶיךָ
  choice: ndugu zako
  rationale: Neno la Kiswahili 'ndugu' ni la kawaida kwa ndugu wa kiume katika muktadha huu wa wana wa Yakobo, bila kuingiza jinsia nyingine isiyotajwa na umbo la Kiebrania.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Taswira halisi ya mkono imehifadhiwa; hapa inadokeza nguvu na ushindi.
- source_word: בְּעֹרֶף אֹיְבֶיךָ
  choice: shingoni mwa adui zako
  rationale: עֹרֶף ni shingo au kisogo; usemi huu huhifadhi taswira ya kuwashinda na kuwatawala adui.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: watakuinamia
  rationale: Kitenzi kinaonyesha kuinama kwa heshima au kutii. 'Watakuinamia' ni usemi wa asili wa Kiswahili na hauingizi maana ya ibada ya Mungu.
- source_word: בְּנֵי אָבִיךָ
  choice: wana wa baba yako
  rationale: Tafsiri hii inahifadhi usemi halisi wa Kiebrania na mtindo wa kishairi, huku ikieleweka kuwa unawahusu ndugu zake Yuda.
theological_decisions:
- issue: Maana ya tendo la יִשְׁתַּחֲווּ לְךָ
  choice: Kuinama kwa heshima na kutii mamlaka ya kibinadamu
  alternative: Kumwabudu Yuda
  rationale: Mzungumziwa ni Yuda katika baraka ya Yakobo. Muktadha unaonyesha utiifu na heshima ya kifalme, si ibada ya kimungu; hata hivyo tendo lenyewe la kuinama limehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari na taswira halisi za Kiebrania zimehifadhiwa kadiri ya uasili wa Kiswahili.
