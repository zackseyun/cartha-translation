source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: sw
  text: 'Baraka za baba yako zimezidi baraka za wazazi wangu,

    hadi mipaka ya vilima vya kale.[a]

    Na ziwe juu ya kichwa cha Yosefu,

    juu ya utosi wa yule aliyetengwa na ndugu zake.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilima vya milele.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mkuu kati ya ndugu zake”; neno la Kiebrania linaweza kumaanisha mtu aliyewekwa wakfu au aliyetengwa.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: Baraka za baba yako
  rationale: Wingi wa בִּרְכֹת umehifadhiwa, na kiambishi cha nafsi ya pili katika אָבִיךָ kinaonyesha kwamba Yakobo anamwambia Yosefu moja kwa moja, ‘baba yako.’
- source_word: גָּבְרוּ עַל
  choice: zimezidi
  rationale: Katika muundo huu wa kulinganisha, kitenzi kinaonyesha kuwa baraka hizo ni kuu au zinafika mbali kuliko nyingine; ‘zimezidi’ ni Kiswahili cha kawaida kinachohifadhi wazo hilo.
- source_word: הוֹרַי
  choice: wazazi wangu
  rationale: Neno hili kwa msingi wake linamaanisha waliomzaa Yakobo. ‘Wazazi wangu’ ni tafsiri ya moja kwa moja na ya sasa, ingawa katika ushairi linaweza kueleweka kwa upana zaidi kuwa waliomtangulia.
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: hadi mipaka ya mbali kabisa ya vilima vya kale
  rationale: Huu ni usemi mgumu wa kishairi. Katika muktadha, תַּאֲוַת linaweza kuonyesha ukomo wa mbali au vitu vinavyotamaniwa. Maandishi makuu yanafuata maana ya kufika mbali, huku tanbihi ikihifadhi uwezekano wa ‘vitu vya thamani.’ עוֹלָם hapa imeelezwa kwa kawaida kuwa ya kale sana, bila kufuta uwezekano wa ‘milele.’
- source_word: תִּהְיֶיןָ
  choice: Na ziwe
  rationale: Katika tamko la baraka, hali hii ya kitenzi ina nguvu ya ombi au tamko la kutakia; ‘Na ziwe’ inafaa katika Kiswahili cha heshima na cha kishairi.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: juu ya kichwa cha Yosefu
  rationale: Muundo huu unaonyesha baraka zikitua au kukaa juu ya Yosefu, na unadumisha picha ya Kiebrania.
- source_word: וּלְקָדְקֹד
  choice: juu ya utosi
  rationale: קָדְקֹד ni sehemu ya juu kabisa ya kichwa. ‘Utosi’ ni neno la kawaida na fasaha linalodumisha ulinganifu na ‘kichwa.’
- source_word: נְזִיר אֶחָיו
  choice: yule aliyetengwa na ndugu zake
  rationale: נְזִיר lina wazo la mtu aliyewekwa au kutengwa kando. Tafsiri hii haimfanyi Yosefu moja kwa moja kuwa Mnadhiri kwa maana ya taasisi ya baadaye, wala haibadili neno hilo bila shaka kuwa cheo cha kisiasa.
theological_decisions:
- issue: Maana ya sifa נְזִיר אֶחָיו inayotumiwa kwa Yosefu
  choice: yule aliyetengwa na ndugu zake
  alternative: mkuu kati ya ndugu zake; yule aliyewekwa wakfu miongoni mwa ndugu zake
  rationale: ‘Aliyetengwa’ huhifadhi maana ya msingi ya kutengwa au kuwekwa kando pamoja na hali ya pekee ya Yosefu. Tanbihi inaacha wazi maana inayowezekana ya ukuu bila kuingiza kwa lazima taasisi rasmi ya Unadhiri.
- issue: Maana ya kishairi ya תַּאֲוַת katika kifungu kuhusu vilima
  choice: mipaka ya mbali kabisa
  alternative: vitu vya thamani vinavyotamaniwa
  rationale: Maandishi makuu yanaonyesha upeo wa baraka, kama muktadha wa עַד unavyodokeza. Kwa sababu neno lenyewe kwa kawaida huhusishwa pia na tamaa au kitu cha kutamanika, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi lakini unaoeleweka kwa urahisi. Mistari imedumisha ulinganifu wa baraka, kichwa na utosi. ‘Yosefu’ na ‘ndugu’ ni maumbo yaliyozoeleka katika usomaji wa Biblia wa Kiswahili.
