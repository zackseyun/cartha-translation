translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Kinono’ kimechaguliwa ili kuhifadhi sitiari ya unono/utajiri wa mazao; tanbihi inadumisha muundo halisi zaidi wa chanzo, ‘kutoka kwa Asheri’, pamoja na maana ya msingi ‘mkate’.
