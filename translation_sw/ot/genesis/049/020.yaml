  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: sw
  text: Chakula cha Asheri kitakuwa kinono[a], naye atatoa vyakula vitamu vya kifalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka kwa Asheri, mkate wake utakuwa mnono, naye atatoa vyakula vitamu vya mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/אָשֵׁר
  choice: cha Asheri
  rationale: Kihusishi מִן kinaweza kuonyesha chanzo, yaani ‘kutoka kwa Asheri’; katika Kiswahili, muundo ‘chakula cha Asheri’ ni wa kawaida na unaeleweka kama mazao au riziki itokayo katika eneo la kabila lake.
- source_word: שְׁמֵנָה
  choice: kinono
  rationale: Neno hili huonyesha unono au utajiri wa chakula. ‘Kinono’ huhifadhi picha ya Kiebrania huku kikimaanisha chakula bora na chenye wingi, si mafuta pekee.
- source_word: לַחְמֹו
  choice: chakula cha Asheri
  rationale: Ingawa לֶחֶם kwa msingi ni ‘mkate’, pia humaanisha chakula au riziki kwa ujumla. Muktadha wa vyakula vitamu unaunga mkono maana pana ya ‘chakula’; kiambishi cha umilikaji kimeelezwa kwa ‘cha Asheri’.
- source_word: וְהוּא
  choice: naye
  rationale: Kiwakilishi huru kinasisitiza na kuendeleza Asheri kama mhusika; ‘naye’ ni tafsiri ya asili inayohifadhi msisitizo huo.
- source_word: יִתֵּן
  choice: atatoa
  rationale: Kitenzi נָתַן humaanisha ‘kutoa/kupa’. ‘Atatoa’ kinafaa katika tamko hili la baraka na kinaweza kujumuisha kuzalisha au kuandaa kwa matumizi ya wengine.
- source_word: מַעֲדַנֵּי
  choice: vyakula vitamu
  rationale: Neno linamaanisha vyakula vya anasa, vya kupendeza au vya hali ya juu. ‘Vyakula vitamu’ ni Kiswahili cha sasa na kinachoeleweka kwa urahisi.
- source_word: מֶלֶךְ
  choice: vya kifalme
  rationale: Muundo wa Kiebrania ni ‘vyakula vitamu vya mfalme’. ‘Vya kifalme’ ni usemi wa asili unaohifadhi maana ya vyakula vinavyomfaa mfalme.
