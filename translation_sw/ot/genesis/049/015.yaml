  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: sw
  text: Akaona kwamba mahali pa kupumzikia ni pazuri[a], na kwamba nchi inapendeza. Basi akainamisha bega lake ili kubeba mzigo, akawa mtumishi wa kazi ya shuruti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pumziko ni jema.” Neno la Kiebrania linaweza kumaanisha “pumziko” au “mahali pa kupumzikia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akawa mtumishi wa ushuru,” au “akawa mfanyakazi wa shuruti.” Usemi wa Kiebrania unajadiliwa; unaweza kurejelea kazi ya lazima au utumishi unaohusiana na ushuru.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: mahali pa kupumzikia
  rationale: Neno hilo linaweza kumaanisha pumziko au mahali pa kupumzikia. Maana halisi ya mahali inafaa zaidi hapa kwa sababu inalingana na kutajwa kwa nchi, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: טוֹב
  choice: pazuri
  rationale: Huhifadhi urahisi na upana wa kivumishi cha Kiebrania, huku ikipatana kisarufi na ‘mahali.’
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa baraka kwa kabila, neno hili linaelekea kumaanisha eneo au nchi kuliko dunia kwa ujumla.
- source_word: נָעֵמָה
  choice: inapendeza
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba nchi hiyo ilikuwa ya kuvutia na yenye kufaa bila kuongeza msisitizo usiokuwamo katika Kiebrania.
- source_word: וַיֵּט שִׁכְמוֹ לִסְבֹּל
  choice: akainamisha bega lake ili kubeba mzigo
  rationale: Huhifadhi taswira ya mwili ya kuinamisha bega chini ya mzigo na kueleza kwa Kiswahili cha kawaida maana inayodokezwa na kitenzi ‘kubeba.’
- source_word: לְמַס עֹבֵד
  choice: mtumishi wa kazi ya shuruti
  rationale: מַס mara nyingi humaanisha kazi ya kulazimishwa au utumishi wa lazima, na עֹבֵד humtaja anayefanya kazi au kutumika. Tafsiri hii huepuka kudai moja kwa moja kwamba alikuwa mtumwa anayemilikiwa, huku ikihifadhi hali ya kulazimishwa.
theological_decisions:
- issue: Aina ya kutiishwa kwa Isakari katika kishazi cha mwisho
  choice: akawa mtumishi wa kazi ya shuruti
  alternative: akawa mtumishi aliyelipa ushuru / akawa mfanyakazi mtumwa
  rationale: Kiebrania kinaweza kueleweka kuwa utumishi wa kazi ya lazima au hali ya utiifu iliyohusisha ushuru. Maana ya kazi ya shuruti ndiyo inayofaa zaidi katika matini kuu, lakini tofauti ya kijamii na kisheria haipaswi kuamuliwa kupita ushahidi wa matini, hivyo njia nyingine zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na taswira ya bega linalobeba mzigo zimehifadhiwa; ‘kazi ya shuruti’ ni wazi na ya kawaida bila kuingiza hitimisho la kimadhehebu.
