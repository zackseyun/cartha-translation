base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: sw
  text: Kisha Yakobo akawaita wanawe, akasema, “Kusanyikeni, nami nitawaambia yatakayowapata katika siku zijazo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siku za mwisho.” Kirai cha Kiebrania kinaweza pia kuwa na maana inayohusu nyakati za mwisho katika baadhi ya miktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika muktadha huu קרא humaanisha kuwaita au kuwakusanya watu waje; ‘akawaita’ ni Kiswahili cha kawaida na sahihi.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno hili linawarejelea hasa wana wa kiume wa Yakobo wanaotajwa katika muktadha unaofuata.
- source_word: הֵאָסְפוּ
  choice: Kusanyikeni
  rationale: Amri ya Niphal inawataka wanawe wakutane pamoja; ‘Kusanyikeni’ ni ya asili na inadumisha uzito wa kauli.
- source_word: וְאַגִּידָה לָכֶם
  choice: nami nitawaambia
  rationale: Cohortative inaeleza kusudi la Yakobo baada ya amri; muundo huu unaonyesha mfuatano na nia kwa Kiswahili cha kawaida.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: yatakayowapata
  rationale: Hapa kitenzi קרה kinatumika kwa maana ya jambo kutokea au kumpata mtu; ‘yatakayowapata’ ni fasaha na wazi.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: katika siku zijazo
  rationale: Kirai hiki kinaweza kuelekeza kwa wakati ujao kwa ujumla na wakati mwingine kuwa na maana ya kieskatolojia; tafsiri hii haibani maana kupita ushahidi wa muktadha.
theological_decisions:
- issue: Iwapo בְּאַחֲרִית הַיָּמִים itafsiriwe kwa kirai chenye maana ya wazi ya kieskatolojia
  choice: katika siku zijazo
  alternative: katika siku za mwisho
  rationale: Muktadha wa karibu unahusu yatakayowapata wana wa Yakobo na makabila yao wakati ujao. Tafsiri kuu inadumisha maana pana ya wakati ujao, huku tanbihi ikihifadhi uwezekano wa maana ya ‘siku za mwisho.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi; sentensi ni wazi kwa wasomaji wa kawaida bila kuondoa uzito wa hotuba ya Yakobo.
