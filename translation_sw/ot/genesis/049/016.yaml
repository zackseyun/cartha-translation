  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: sw
  text: Dani atawahukumu watu wake kama mojawapo ya makabila ya Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dani atawatetea watu wake” au “Dani atawatendea watu wake haki.” Kitenzi cha Kiebrania kinaweza pia kumaanisha kutetea au kuhakikisha haki inatendeka, si kutoa hukumu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: Dani
  rationale: Jina la mwana wa Yakobo na la kabila lake; umbo la Kiswahili 'Dani' linafuata matumizi ya kawaida ya majina ya Biblia.
- source_word: יָדִין
  choice: atawahukumu
  rationale: Ni kitenzi cha Qal, nafsi ya tatu umoja wa kiume, chenye maana ya kuhukumu au kutekeleza haki; wakati ujao unafaa katika baraka hii ya kinabii.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Kirai hiki humaanisha moja kwa moja 'watu wake' bila kulazimisha ufafanuzi kuwa ni watu wa kabila lake.
- source_word: כְּאַחַד
  choice: akiwa mojawapo
  rationale: Huwasilisha ulinganisho na hadhi ya Dani kama mmoja wa makabila ya Israeli kwa Kiswahili cha asili.
- source_word: שִׁבְטֵי
  choice: makabila ya
  rationale: Katika muktadha huu wingi wa שֵׁבֶט unamaanisha makabila, si fimbo za enzi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la watu na taifa la Israeli.
theological_decisions:
- issue: Maana ya jukumu la Dani katika baraka
  choice: Dani anawaamua watu wake kwa mamlaka akiwa kabila kamili miongoni mwa makabila ya Israeli.
  alternative: Dani atawatetea watu wake au atawapatia haki.
  rationale: Kitenzi דין kinaweza kumaanisha kuhukumu, kutawala, kutetea, au kupatia haki. Muktadha unaunga mkono 'kuhukumu,' lakini tanbihi inadumisha uwezekano mpana wa kutetea au kupatia haki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo 'akiwa mojawapo' huepuka tafsiri ngumu ya neno kwa neno huku ukihifadhi maana ya ulinganisho.
