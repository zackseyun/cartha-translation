base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: sw
  text: katika pango lililo katika shamba la Makpela, mkabala na Mamre[a], katika nchi ya Kanaani—shamba ambalo Abrahamu alinunua kutoka kwa Efroni, Mhiti, kuwa milki ya kaburi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuelekeana na Mamre” au “mbele ya Mamre.” Usemi wa Kiebrania unaonyesha mahali pake kwa kulinganisha na Mamre.
    reason: lexical_alternative
  - marker: b
    text: Yaani, milki inayotambuliwa kisheria kwa ajili ya kaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: katika pango
  rationale: Kiambishi ב pamoja na nomino yenye uamilifu maalumu huonyesha mahali; “katika pango” ni Kiswahili cha kawaida na sahihi.
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: lililo katika shamba la Makpela
  rationale: Kishazi hiki kinabainisha mahali pango lilipo, huku Makpela likihifadhiwa kama jina la mahali.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: mkabala na Mamre
  rationale: Nahau hii inaonyesha uhusiano wa kijiografia, yaani kuwa mbele ya au kuelekeana na Mamre; “mkabala na” haiipunguzi kuwa ukaribu tu.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha kijiografia.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: shamba ambalo Abrahamu alinunua
  rationale: אֶת huonyesha kwamba “shamba” ndilo kitu kilichonunuliwa. Kurudia “shamba” kama kiambatisho baada ya mstari mrefu wa vishazi kunatoa Kiswahili wazi bila kuligeuza kuwa kirai kisicho katika Kiebrania cha “pamoja na shamba.”
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: kutoka kwa Efroni Mhiti
  rationale: מֵאֵת humtambulisha muuzaji au chanzo cha kitu kilichonunuliwa; jina la mtu limetoholewa na jina la jamii limetafsiriwa.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: liwe milki ya kuzikia
  rationale: אֲחֻזָּה linasisitiza mali inayomilikiwa kisheria, na קֶבֶר hapa huonyesha kusudi la maziko; usemi huu unahifadhi pande zote mbili kwa Kiswahili kinachoeleweka.
