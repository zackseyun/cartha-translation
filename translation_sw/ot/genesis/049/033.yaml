base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: sw
  text: Yakobo alipomaliza kuwaagiza wanawe, akavuta miguu yake hadi kitandani[a], akapumua pumzi yake ya mwisho, akakusanywa kwa watu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “akaikusanya miguu yake hadi kitandani.” Kiebrania kinatumia kitenzi chenye maana ya “kukusanya.”
    reason: lexical_alternative
  - marker: b
    text: “Akakusanywa kwa watu wake” ni msemo wa Kiebrania unaohusishwa na kifo na watu wa mtu; haumaanishi tu kuzikwa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: alipomaliza
  rationale: Kitenzi כלה kinaonyesha kukamilika kwa tendo la Yakobo la kutoa maagizo; “alipomaliza” ni Kiswahili cha kawaida na hudumisha mfuatano wa simulizi.
- source_word: לְצַוֹּת
  choice: kuwaagiza
  rationale: צוה humaanisha kuamuru au kutoa maagizo. Katika muktadha wa maelekezo yake ya mwisho, “kuwaagiza” ni ya asili na yenye uzito bila kuwa ngumu kupita kiasi.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Kiebrania kinataja wazi wana wa kiume wa Yakobo; “wanawe” ni sahihi na ya kawaida katika Kiswahili.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: akaivuta miguu yake kitandani
  rationale: Ingawa אָסַף kihalisi ni “kukusanya,” hapa inaeleza Yakobo akiirudisha au kuivuta miguu yake kitandani. Tafsiri hii inaeleweka kwa urahisi huku tanbihi ikihifadhi picha halisi ya nahau.
- source_word: הַמִּטָּה
  choice: kitandani
  rationale: מִטָּה inaweza kuwa kitanda au kochi; “kitanda” ndiyo maana ya kawaida na inayofaa mazingira haya ya mwisho wa maisha.
- source_word: וַיִּגְוַע
  choice: akapumua pumzi yake ya mwisho
  rationale: גוע hueleza kukata roho au kutoa pumzi ya mwisho. Kauli hii huhifadhi maana hiyo mahususi bila kuiunganisha na kishazi kinachofuata.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: akakusanywa kwa watu wake
  rationale: Tafsiri hii inadumisha kauli ya Kiebrania kuhusu kifo na kuunganishwa na watu wa mtu, badala ya kuipunguza iwe taarifa ya kuzikwa tu.
theological_decisions:
- issue: Maana ya “akakusanywa kwa watu wake”
  choice: Kudumisha nahau bila kuifafanua kuwa maziko tu
  alternative: alizikwa pamoja na mababu zake
  rationale: Maziko ya Yakobo yanasimuliwa baadaye, kwa hiyo kishazi hiki si taarifa rahisi ya maziko. Nahau imehifadhiwa ili kutobainisha kupita kiasi uhusiano wake na kifo, mababu na kukusanywa baada ya kufa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi umehifadhi mtiririko wa simulizi, na nahau ya mwisho imeachwa wazi ili kudumisha uzito na utata wa Kiebrania.
