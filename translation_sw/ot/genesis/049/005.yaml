lexical_decisions:
- source_word: שִׁמְעוֹן
  choice: Simeoni
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וְלֵוִי
  choice: na Lawi
  rationale: Kiunganishi na jina limetoholewa kwa desturi ya kawaida ya Kiswahili.
- source_word: אַחִים
  choice: ni ndugu
  rationale: Neno hili hapa linamaanisha ndugu wa kiume; Kiswahili hakihitaji kuonyesha jinsia kwa kuwa uhusiano wao unajulikana katika muktadha.
- source_word: כְּלֵי
  choice: silaha
  rationale: Ingawa neno linaweza kumaanisha vyombo, vifaa au zana kwa upana, kuhusishwa kwake na jeuri hapa kunalipa maana mahsusi ya silaha.
- source_word: חָמָס
  choice: jeuri
  rationale: “Jeuri” ni neno la kawaida na lenye uzito linaloeleza matumizi ya nguvu yenye kudhuru au matendo ya kikatili.
- source_word: מְכֵרֹתֵיהֶם
  choice: panga zao
  rationale: Neno hili la Kiebrania ni nadra na maana yake haina uhakika. “Panga zao” hutoa maana halisi, inayoeleweka na inayolingana na muktadha wa shambulio, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
