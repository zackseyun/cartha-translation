  language: sw
  text: Benyamini ni mbwa-mwitu araruaye[a]; asubuhi hula mawindo[b], na jioni hugawanya nyara[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Benyamini ni mbwa-mwitu mwenye ukali wa kurarua.” Kitenzi cha Kiebrania huonyesha mnyama araruaye mawindo.
    reason: lexical_alternative
