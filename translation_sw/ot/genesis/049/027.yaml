lexical_decisions:
- source_word: בִּנְיָמִין
  choice: Benyamini
  rationale: Jina maalumu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: זְאֵב יִטְרָף
  choice: mbwa mwitu mwenye kurarua
  rationale: זְאֵב ni mbwa mwitu, na kitenzi טרף kinaonyesha kurarua mawindo. Usemi huu unahifadhi picha hai ya mnyama anayewinda bila kuongeza kitu kisichotajwa katika Kiebrania.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Ni usemi wa wakati unaolingana moja kwa moja na Kiebrania na unaweka uwiano wa kishairi na “jioni.”
- source_word: יֹאכַל
  choice: hula
  rationale: Kitenzi cha Kiebrania ni neno la kawaida la kula. “Hula” kinadumisha uaminifu wa kileksia huku muktadha wa mbwa mwitu ukitoa hisia ya kula mawindo.
- source_word: עַד
  choice: mawindo
  rationale: Katika picha ya mbwa mwitu, neno hili linaeleweka vizuri kuwa kile kilichowindwa na kuliwa; hata hivyo linaweza pia kumaanisha mateka au nyara, jambo linalobainishwa katika tanbihi.
- source_word: וְלָעֶרֶב
  choice: na jioni
  rationale: Inahifadhi kiunganishi na muundo sambamba wa asubuhi na jioni.
- source_word: יְחַלֵּק שָׁלָל
  choice: hugawanya nyara
  rationale: חלק katika kauli hii ni kugawa, na שָׁלָל ni mali iliyotekwa vitani. “Hugawanya nyara” ni usemi wa kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Nguvu ya sitiari katika baraka ya Yakobo juu ya Benyamini
  choice: Mstari umetafsiriwa kama picha hai ya ukali wa mbwa mwitu na ugawaji wa nyara baada ya ushindi, bila kutaja utimizo fulani wa kihistoria.
  alternative: Kuufafanua moja kwa moja kuwa unabashiri historia ya kivita ya kabila la Benyamini.
  rationale: Kiebrania kinatoa taswira ya kishairi, lakini hakimtaji mtu au tukio maalumu la baadaye. Tafsiri inaacha uhusiano huo wazi badala ya kuingiza fasiri ya kimadhehebu au ya kihistoria katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi wa kishairi na uwiano wa “asubuhi/jioni” umehifadhiwa. “Mbwa mwitu mwenye kurarua” ni wazi kwa wasomaji wa kawaida na haudhoofishi ukali wa sitiari.
