base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: sw
  text: Yuda ni mwana wa simba; kutoka katika mawindo, mwanangu, umepanda. Alijikunyata, akalala kama simba, na kama simba jike[a]—ni nani atakayemwamsha?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama simba mkubwa.” Neno la Kiebrania hapa ni tofauti na neno la awali lililotafsiriwa “simba”; linaweza kumaanisha simba aliyekomaa na mwenye nguvu, na pia hutafsiriwa “simba jike.”
    reason: lexical_alternative
  - marker: b
    text: Picha hii ya Yuda kama simba mara nyingi huhusishwa kiishara na tumaini la baadaye la kifalme na la Kimasihi; hata hivyo, mstari wenyewe unazungumza moja kwa moja kuhusu Yuda katika baraka ya Yakobo.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: mwana wa simba
  rationale: Kirai hiki humaanisha simba mchanga. ‘Mwana wa simba’ ni cha kawaida, wazi, na kinadumisha sitiari bila kutumia neno la kizamani.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la mtu na kabila limetolewa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
- source_word: מִטֶּרֶף
  choice: kutoka kwenye mawindo
  rationale: טֶרֶף ni mnyama aliyenaswa au kuraruliwa kuwa chakula. ‘Mawindo’ kinahifadhi picha ya mnyama mwindaji, huku ‘kwenye’ kikifanya kirai kiwe cha asili katika Kiswahili.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Ni neno la moja kwa moja la Yakobo akimwambia Yuda; linaendeleza uhusiano wa kifamilia bila kuongeza kihisishi kisichomo katika Kiebrania.
- source_word: עָלִיתָ
  choice: umepanda
  rationale: Kitenzi kinaeleza mwendo wa kwenda juu. Tafsiri hii inahifadhi picha hiyo bila kuamua kwa uhakika simba amepanda kutoka mawindo kwenda wapi.
- source_word: כָּרַע
  choice: amejikunyata
  rationale: Katika picha ya simba, kitenzi kinaonyesha kuinama chini au kujikunja, si tendo la kuabudu.
- source_word: רָבַץ
  choice: amelala
  rationale: Kitenzi hutumiwa kwa mnyama anayelala chini au kupumzika. ‘Amelala’ ni wazi na cha kawaida.
- source_word: כְּאַרְיֵה
  choice: kama simba
  rationale: Ni ulinganisho wa moja kwa moja unaotumia neno la kawaida la simba.
- source_word: וּכְלָבִיא
  choice: naam, kama simba jike
  rationale: לָבִיא inaweza kumaanisha simba aliyekomaa na mwenye nguvu, na katika mapokeo mengi hutafsiriwa ‘simba jike.’ ‘Naam’ kinaonyesha urudiaji wenye mkazo, huku ‘simba jike’ kikihifadhi tofauti ya msamiati na אַרְיֵה bila kuficha uwezekano mwingine.
- source_word: מִי יְקִימֶנּוּ
  choice: ni nani atakayemwamsha?
  rationale: Hifili ya קום hapa ni kumsababisha aliyejilaza ainuke, yaani kumwamsha au kumchokoza. ‘Atakayemwamsha’ ni ya asili na haiongezi wazo la ‘kuthubutu,’ ambalo ni tafsiri ya kimuktadha.
theological_decisions:
- issue: Ikiwa picha ya simba inamhusu moja kwa moja Masihi au Yuda/kabila lake
  choice: Maana ya moja kwa moja imeachwa kuwa baraka ya Yakobo kwa Yuda na kabila lake.
  alternative: Picha hiyo inaweza kusomwa kiishara kwa kuhusishwa na tumaini la kifalme na la Kimasihi katika sehemu za baadaye za Biblia.
  rationale: Mstari wenyewe unamweleza Yuda kwa picha ya nguvu na usalama wa simba, lakini hautaji Masihi waziwazi. Tafsiri haipaswi kuingiza hitimisho la kiteolojia ambalo mstari wenyewe haujalitamka.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mabadiliko ya nafsi kutoka ‘umepanda’ kwenda ‘amejikunyata’ yamehifadhiwa kwa sababu yapo katika Kiebrania. Alama za tanbihi zimewekwa kwenye maneno yanayohusika: [a] baada ya ‘simba jike’ kwa tofauti ya לָבִיא, na [b] mwishoni kwa maelezo ya usomaji wa kiishara.'
