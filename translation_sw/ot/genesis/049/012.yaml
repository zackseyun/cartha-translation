  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: sw
  text: Macho yake ni mekundu kwa divai,[a] na meno yake ni meupe kwa maziwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Macho yake yana rangi nzito kuliko divai, na meno yake ni meupe kuliko maziwa.” Kivumishi cha Kiebrania kinachotafsiriwa “mekundu” ni nadra na maana yake hujadiliwa; kinaweza pia kudokeza rangi nzito au mng’ao. Kihusishi cha Kiebrania kinaweza kuonyesha chanzo au ulinganisho.
    reason: lexical_alternative
  - marker: b
    text: “Kwa maziwa” inaweza pia kueleweka “kuliko maziwa”; tazama tanbihi a.
    reason: translation_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: mekundu
  rationale: Kivumishi hiki ni nadra na maana yake imejadiliwa. Uhusiano wake na mzizi unaotumiwa kuhusu wekundu wa macho unaunga mkono tafsiri “mekundu”; tanbihi inahifadhi uwezekano wa maana ya kuwa na rangi nzito au kung'aa.
- source_word: עֵינַיִם
  choice: macho yake
  rationale: Tafsiri ya moja kwa moja ya nomino ya jozi “macho”; kiambishi cha umilikaji kinaonyesha mhusika anayeendelea kutoka muktadha.
- source_word: מִיָּיִן
  choice: kwa sababu ya divai
  rationale: מִן inaweza kuonyesha sababu au chanzo. Muktadha wa wingi wa divai katika mstari uliotangulia na matumizi yanayohusisha wekundu wa macho yanaunga mkono maana ya kisababishi, bila kuficha uwezekano wa ulinganisho.
- source_word: וּלְבֶן
  choice: na ... ni meupe
  rationale: Kivumishi “meupe” kimewasilishwa kwa Kiswahili cha kawaida katika kishazi sambamba.
- source_word: שִׁנַּיִם
  choice: meno yake
  rationale: Tafsiri ya moja kwa moja ya nomino ya jozi “meno,” pamoja na kiambishi cha umilikaji kinachodokezwa na muktadha.
- source_word: מֵחָלָב
  choice: kwa sababu ya maziwa
  rationale: Imetafsiriwa kwa maana ya sababu au chanzo, sambamba na “kwa sababu ya divai”; tanbihi inahifadhi usomaji wa kulinganisha.
theological_decisions:
- issue: Je, מִן katika mistari yote miwili inaonyesha sababu/chanzo au ulinganisho?
  choice: 'Sababu/chanzo: “kwa sababu ya divai ... kwa sababu ya maziwa.”'
  alternative: 'Ulinganisho: “mekundu kuliko divai ... meupe kuliko maziwa.”'
  rationale: Usomaji wa kisababishi unapatana na picha ya wingi wa divai na maziwa katika baraka hii na huepuka kulazimisha maana ya kulinganisha; kwa kuwa muundo wa Kiebrania unaruhusu pia ulinganisho, usomaji huo umewekwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kishairi lakini inayoeleweka kwa urahisi. “Kwa sababu ya” huweka wazi usomaji wa kisababishi; tanbihi zinahifadhi utata halisi wa Kiebrania kuhusu kivumishi nadra na matumizi ya מִן.
