  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: sw
  text: Yosefu ni mwana mwenye kuzaa matunda[a], mwana mwenye kuzaa matunda kando ya chemchemi; binti[b] wanapita juu ya ukuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yosefu ni tawi linalozaa matunda, tawi linalozaa matunda kando ya chemchemi.” Kiebrania ni cha kishairi na kimefupishwa; tafsiri ya kimapokeo ya “tawi” inaeleza taswira hiyo kwa uwazi zaidi.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania ni “binti.” Huenda hapa limetumiwa kisitiari kumaanisha matawi au machipukizi yanayoenea juu ya ukuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: mwana
  rationale: Maana ya kawaida ya neno hili ni “mwana.” Hili linadumisha usemi wa Kiebrania uliofupishwa badala ya kuufasiri moja kwa moja kuwa tawi.
- source_word: פֹּרָת
  choice: mwenye kuzaa matunda
  rationale: Neno hili linatokana na mzizi פרה, “kuzaa matunda, kuwa na uzao.” Usemi huu unahifadhi taswira ya matunda na unaeleweka katika lugha ya kishairi.
- source_word: בֵּן פֹּרָת
  choice: mwana mwenye kuzaa matunda
  rationale: Kirai hiki ni cha kishairi na kimefupishwa. Tafsiri hii inadumisha maana za “mwana” na “kuzaa matunda,” huku uwezekano wa “tawi linalozaa matunda” ukielezwa katika tanbihi.
- source_word: עֲלֵי עָיִן
  choice: kando ya chemchemi
  rationale: עַיִן linaweza kumaanisha “jicho” au “chemchemi.” Katika muktadha wa ustawi na kuzaa matunda, “chemchemi” inafaa, na עֲלֵי inaonyeshwa hapa kwa mahali, “kando ya.”
- source_word: בָּנוֹת
  choice: binti
  rationale: Maana yake ya moja kwa moja ni “binti.” Tafsiri hii inahifadhi sitiari ya kishairi bila kuiamua kimya kimya kuwa matawi au machipukizi.
- source_word: צָעֲדָה
  choice: wanapiga hatua
  rationale: Kitenzi hiki huonyesha kupiga hatua au kwenda kwa hatua. Kiswahili cha wingi kinafuata nomino “binti,” ingawa umbo la kitenzi cha Kiebrania ni la umoja katika mstari huu wa kishairi.
- source_word: עֲלֵי שׁוּר
  choice: juu ya ukuta
  rationale: שׁוּר hapa inaeleweka vizuri kuwa “ukuta.” Kirai kinahifadhi picha ya kuvuka au kuenea juu ya mpaka bila kutaja wazi kwamba binti ni matawi.
