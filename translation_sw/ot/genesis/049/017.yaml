base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: sw
  text: 'Dani awe nyoka kando ya barabara,

    nyoka mwenye sumu[a] kando ya njia,

    anayeuma visigino vya farasi,

    ili mpanda wake aanguke chali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bafe”; neno la Kiebrania ni adimu, na aina kamili ya nyoka haijulikani, lakini maana yake ni nyoka hatari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: na awe
  rationale: Kauli ya kutakia au kutangaza katika baraka imehifadhiwa kwa Kiswahili cha kawaida cha kishairi, badala ya kuifanya wakati ujao ulio wazi.
- source_word: דָן
  choice: Dani
  rationale: Jina la mwana wa Yakobo na kabila lake limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: נָחָשׁ
  choice: nyoka
  rationale: Neno hili ni jina la jumla la nyoka; 'nyoka' ni la asili, wazi, na linafaa katika ushairi huu.
- source_word: עֲלֵי דֶרֶךְ
  choice: kando ya barabara
  rationale: Kirai kinaweka nyoka karibu na barabara, tayari kuvizia; 'kando ya' hutoa picha hiyo kwa kawaida.
- source_word: שְׁפִיפֹן
  choice: nyoka mwenye sumu
  rationale: Neno la Kiebrania ni adimu na aina kamili ya nyoka haijulikani; tafsiri hii huonyesha hatari bila kudai spishi mahususi.
- source_word: עֲלֵי אֹרַח
  choice: kando ya njia
  rationale: Huhifadhi usambamba wa kishairi na tofauti kati ya 'barabara' na 'njia'.
- source_word: הַנֹּשֵׁךְ
  choice: anayeuma
  rationale: Huhifadhi hali ya kishiriki inayoeleza tendo bainifu la nyoka kwa Kiswahili kinachotiririka.
- source_word: עִקְּבֵי סוּס
  choice: visigino vya farasi
  rationale: Hutoa eneo la nyuma la miguu ya farasi na kuhifadhi taswira halisi ya Kiebrania.
- source_word: וַיִּפֹּל
  choice: hata ... aanguke
  rationale: Muunganisho unaendeleza matokeo ya kuumwa; 'hata' pamoja na hali tegemezi huonyesha matokeo hayo kwa kawaida bila kuyafanya maelezo ya kiufundi kupita kiasi.
- source_word: רֹכְבוֹ
  choice: mpanda farasi
  rationale: Kiambishi kinamrejelea anayempanda farasi. Kutaja 'mpanda farasi' ni wazi na kwa muktadha hakupotoshi.
- source_word: אָחוֹר
  choice: chali
  rationale: Katika muktadha wa kuanguka, 'chali' hutoa kwa asili maana ya kuanguka kuelekea nyuma.
