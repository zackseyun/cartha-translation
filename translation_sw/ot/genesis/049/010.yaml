id: GEN.49.10
reference: Genesis 49:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: sw
  text: Fimbo ya enzi haitaondoka kwa Yuda, wala fimbo ya mtawala kutoka katikati ya miguu yake, hadi Shilo atakapokuja[a]; na mataifa yatamtii.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi atakapokuja yule mwenye haki ya kutawala.” Neno la Kiebrania שילה ni gumu; pia limeeleweka kuwa cheo, jina la mahali, au rejeo la ushuru.
    reason: alternative_reading
  - marker: b
    text: Au, “na mataifa yatakusanyika kwake,” au “na mataifa yatajisalimisha kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: fimbo ya enzi
  rationale: Katika muktadha huu wa kishairi na kifalme, neno hili linaashiria mamlaka ya kutawala, si kabila wala fimbo ya kawaida. “Fimbo ya enzi” ni usemi wa kawaida wa Kiswahili unaohifadhi picha ya alama ya ufalme.
- source_word: מִיהוּדָה
  choice: kwa Yuda
  rationale: Kihusishi kinaonyesha kuondoka au kutengana na Yuda. “Haitaondoka kwa Yuda” ni Kiswahili cha kawaida na huhifadhi maana ya kwamba mamlaka hiyo itaendelea kuwa upande wa Yuda.
- source_word: מְחֹקֵק
  choice: fimbo ya mtawala
  rationale: Neno linaweza kumaanisha mwenye kutoa amri au alama ya mamlaka yake. Usambamba wake na שֵׁבֶט pamoja na mahali pake “katikati ya miguu yake” unaunga mkono maana ya fimbo inayowakilisha utawala.
- source_word: מִבֵּין רַגְלָיו
  choice: kutoka katikati ya miguu yake
  rationale: Picha halisi ya Kiebrania imehifadhiwa badala ya kuifafanua kuwa ukoo au wazao. Huenda ikadokeza mfalme aliyeketi na pia mwendelezo wa kizazi, lakini tafsiri haichagui dokezo moja pekee.
- source_word: עַד כִּי
  choice: hadi
  rationale: Huonyesha kikomo cha muda wa kauli iliyotangulia. “Hadi … atakapokuja” ni muundo wa asili na wazi katika Kiswahili.
- source_word: שילה
  choice: Shilo
  rationale: Umbo hili la Kiebrania ni gumu na tafsiri yake imejadiliwa sana. Maandishi makuu yanahifadhi usomaji wa jina “Shilo,” huku tafsiri nyingine muhimu zikitajwa katika tanbihi bila kutatua utata kwa lazima.
- source_word: וְלוֹ
  choice: na … yatamtii
  rationale: Kwa kuwa “Shilo” amechukuliwa kuwa rejeo la mtu katika maandishi makuu, kiwakilishi kimetolewa kwa muundo wa kitenzi “yatamtii,” unaosikika kwa kawaida katika Kiswahili.
- source_word: יִקְּהַת
  choice: yatamtii
  rationale: Neno hili adimu linaweza kuonyesha utii, kujisalimisha, au kukusanyika. Katika muktadha wa mamlaka ya kifalme, “yatamtii” huwasilisha kwa uwazi wazo la watu kukubali mamlaka yake; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi huu unarejelea makundi mbalimbali ya watu. “Mataifa” ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia, na linaonyesha upeo mpana kuliko kundi moja tu.
theological_decisions:
- issue: Utambulisho na tafsiri ya שילה katika kifungu chenye historia ndefu ya kufasiriwa kwa maana ya Kimasihi
  choice: Kuhifadhi “Shilo” kama jina katika maandishi makuu bila kumtambulisha wazi kuwa Masihi.
  alternative: “Yule mwenye haki ya kutawala,” “mpaka ushuru uje kwake,” au “mpaka afike Shilo.”
  rationale: Uamuzi huu unaheshimu ugumu halisi wa Kiebrania na kuzuia tafsiri isitatue mjadala wa kitheolojia ambao maandishi yenyewe hayatatui wazi. Wakati huohuo, hauzuii usomaji wa kifalme au wa Kimasihi katika muktadha mpana wa Maandiko.
- issue: Nguvu ya kifalme na uwezekano wa maana ya Kimasihi
  choice: Kutumia lugha ya kifalme—“fimbo ya enzi,” “fimbo ya mtawala,” na “mataifa yatamtii”—bila kuongeza dai la wazi la kidoktrini.
  alternative: Tafsiri ya kisiasa na ya ukoo pekee, au ufafanuzi unaomtaja Masihi moja kwa moja.
  rationale: Mstari wenyewe unaunganisha Yuda na mamlaka ya kifalme. Tafsiri inadumisha picha hiyo na upeo wake kwa mataifa, lakini haiongezi utambulisho ambao haukutajwa moja kwa moja katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Picha halisi “katikati ya miguu yake” imehifadhiwa, ilhali sintaksia ya sehemu ya mwisho imewekwa katika muundo wa kawaida wa Kiswahili.
