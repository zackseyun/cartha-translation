  text: Wakamtendea kwa ukatili[a], wakamfyatulia mishale, wakamchukia—hao wapiga mishale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walimtia uchungu, wakagombana naye, wakamchukia—hao wapiga mishale.” Kitenzi cha kati cha Kiebrania ni kigumu; kinaweza pia kueleweka kwa ujumla kuwa “waligombana naye” au “walimshambulia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: Walimshambulia kwa ukali
  rationale: Kitenzi cha Kiebrania kutoka מרר katika piel kinaweza kumaanisha kumtia uchungu au kumtendea kwa uchungu. Katika muktadha wa vitendo vya uhasama, tafsiri hii ya Kiswahili inaonyesha shambulio lenye ukali huku tanbihi ikihifadhi maana halisi mbadala.
- source_word: וָרֹבּוּ
  choice: wakampiga kwa mishale
  rationale: Umbo hili ni gumu na linaweza kueleweka kuwa walishindana naye au walimshambulia. Taswira ya ‘wapiga mishale’ mwishoni mwa mstari inaunga mkono maana ya kumlenga na kumpiga kwa mishale; tanbihi inaonyesha kutokuwa na uhakika huko.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: na kumchukia
  rationale: Kitenzi שטם huonyesha chuki au uhasama. ‘Kumchukia’ ni tafsiri fupi, wazi, na ya kawaida katika Kiswahili.
- source_word: בַּעֲלֵי חִצִּים
  choice: hao wapiga mishale
  rationale: Kwa neno moja moja ni ‘wenye mishale,’ lakini muundo huu ni nahau inayowataja wapiga mishale. ‘Hao’ huonyesha kuwa kirai hiki kinawafafanua washambuliaji waliotajwa.
