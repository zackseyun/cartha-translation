base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: sw
  text: Hawa wote ni makabila kumi na mawili ya Israeli, na haya ndiyo aliyowaambia baba yao, naye akawabariki; aliwabariki kila mmoja kwa baraka yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “aliwabariki, kila mmoja kwa kadiri ya baraka yake aliwabariki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Hawa wote
  rationale: Kauli hii ya kuonyesha inafasiriwa kwa Kiswahili cha kawaida huku ikidumisha maana ya kuwajumlisha wote waliotajwa.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: makabila kumi na mawili ya Israeli
  rationale: Muundo huu ni wa asili katika Kiswahili na unadumisha uhusiano wa moja kwa moja kati ya makabila na Israeli.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: Haya ndiyo baba yao aliyowaambia
  rationale: ‘Aliyowaambia’ ni tafsiri ya kawaida na yenye hadhi ya דִּבֶּר לָהֶם, bila kuongeza wazo lisilo wazi la kusema juu yao.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: naye akawabariki
  rationale: Kiunganishi na mfuatano wa tendo vimehifadhiwa badala ya kuufanya wazi kama kishazi cha wakati, jambo ambalo Kiebrania halilazimishi.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Nomino hii imetumiwa kwa maana ya mgawanyo, yaani kila mmoja wa wale waliotajwa.
- source_word: כְּבִרְכָתוֹ
  choice: kwa baraka yake
  rationale: Tafsiri hii inakaa karibu na maana halisi ‘kulingana na baraka yake’ na haiongezi kwa lazima wazo la ‘iliyomfaa,’ ingawa hilo linaweza kudokezwa na muktadha.
- source_word: בֵּרַךְ אֹתָם
  choice: alimbariki
  rationale: Mzizi wa ‘bariki’ unarudiwa kama katika Kiebrania; kiwakilishi cha umoja kinafuata ‘kila mmoja’ kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uhusiano wa וַיְבָרֶךְ אֹתָם na kauli iliyotangulia
  choice: naye akawabariki
  alternative: alipowabariki
  rationale: Tafsiri inahifadhi uratibu wa Kiebrania na kuepuka kuamua kwamba kishazi hiki ni cha wakati pekee.
- issue: Maana ya כְּבִרְכָתוֹ
  choice: kwa baraka yake
  alternative: kwa baraka iliyomfaa
  rationale: Kauli ya karibu zaidi na chanzo inahifadhi uwezekano kwamba ‘baraka yake’ ni baraka mahususi ya kila mmoja bila kuufanya ufafanuzi huo kuwa sehemu ya lazima ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya kauli ya kwanza ili isomeke kwa urahisi, huku urudiaji wa ‘bariki’ na muundo wa mgawanyo wa Kiebrania vikihifadhiwa.
