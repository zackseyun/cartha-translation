review_pass:
  verdict: revise
  source_fidelity: The directive to his sons, the imminent-death idiom, burial command, ancestral burial association, cave, field, personal name, and ethnic designation are all substantially represented. However, “kukusanywa kwa watu wangu” can naturally construe “watu wangu” as the agent of the passive action (“gathered by my people”), whereas the Hebrew idiom expresses being gathered/joined to one’s people. Adding “pamoja na” removes this misleading agency implication while retaining the metaphor.
  naturalness: The narrative register and sentence flow are natural Standard East African Swahili. “Niko karibu kukusanywa pamoja na watu wangu” is clearer and idiomatic in this death-context without flattening the source idiom.
  terminology: “Akawaagiza,” “Nizikeni,” “baba zangu,” “pango,” “Efroni,” and “Mhiti” are appropriate. “Baba zangu” is an established biblical expression for ancestors in this context. The footnote should be anchored to the idiom it explains, rather than to “akawaambia.”
  issues:
  - severity: medium
    issue: The preposition in “kukusanywa kwa watu wangu” is ambiguous and may imply that his people gather him.
    rationale: Hebrew אֶל־עַמִּי marks association/destination, not agency. “Pamoja na watu wangu” conveys the intended association in natural Swahili and preserves the figurative wording.
  - severity: low
    issue: Footnote marker [a] is placed after “akawaambia,” though its content explains “kukusanywa ... watu wangu.”
    rationale: Moving the marker to the idiom provides a correct and intelligible footnote anchor.
  revised_text: Kisha akawaagiza, akawaambia, “Mimi niko karibu kukusanywa pamoja na watu wangu[a]. Nizikeni pamoja na baba zangu katika pango lililo katika shamba la Efroni Mhiti,”
  revised_footnotes:
