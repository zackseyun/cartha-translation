    reason: lexical_alternative
  revision_rationale: The revision clarifies the relational force of the Hebrew idiom without replacing it with the interpretive “niko karibu kufa.” It also relocates the footnote anchor to the exact expression for which the alternative and explanation are supplied. No theological conclusion beyond the text’s idiomatic death-and-ancestral association is imposed.
