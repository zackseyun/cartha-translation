base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: sw
  text: Kisha akawaagiza, akawaambia, “Mimi niko karibu kukusanywa pamoja na watu wangu[a]. Nizikeni pamoja na baba zangu katika pango lililo katika shamba la Efroni Mhiti,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninakusanywa pamoja na watu wangu.” Nahau ya Kiebrania inahusu kifo kinachokaribia na kuungana na watu wake au mababu zake katika kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaagiza
  rationale: Kitenzi צוה kinaonyesha agizo lenye uzito. ‘Akawaagiza’ ni Kiswahili cha kawaida na chenye heshima, bila ukali usio wa lazima wa ‘akawaamuru’.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: akawaambia
  rationale: Huwakilisha kwa kawaida mtiririko wa simulizi wa formula ya kusema, bila kurudia kiwakilishi kisichohitajika katika Kiswahili.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: niko karibu kukusanywa kwa watu wangu
  rationale: Inahifadhi sitiari ya Kiebrania na maana ya tukio lililo karibu, badala ya kuirahisisha kuwa ‘niko karibu kufa’.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi usemi halisi na mguso wake wa kifamilia na kitheolojia katika muktadha wa kifo.
- source_word: קִבְרוּ אֹתִי
  choice: Nizikeni
  rationale: Ni amri ya wingi yenye yambwa ya nafsi ya kwanza; umbo hili ni la asili na sahihi katika Kiswahili.
- source_word: אֶל־אֲבֹתָי
  choice: pamoja na baba zangu
  rationale: Katika muktadha wa maziko, ‘pamoja na’ huonyesha kuzikwa walipo mababu zake; ‘baba zangu’ huhifadhi taswira ya chanzo.
- source_word: הַמְּעָרָה
  choice: pango
  rationale: Nomino humaanisha pango; muktadha tayari unaonyesha kuwa ni mahali pa maziko, hivyo hakuna haja ya kuongeza maelezo.
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: lililo katika shamba la Efroni
  rationale: Huhifadhi kishazi cha uhusiano na uhusiano wa shamba na Efroni kwa Kiswahili cha kawaida.
- source_word: הַחִתִּי
  choice: Mhiti
  rationale: Ni namna ya kawaida ya Kiswahili ya kutaja mtu wa taifa la Wahiti.
theological_decisions:
- issue: Maana ya ‘kukusanywa kwa watu wangu’
  choice: Kuhifadhi nahau ya kukusanywa kwa watu wake
  alternative: Niko karibu kufa
  rationale: Nahau inahusu kifo kinachokaribia na kuungana na watu au mababu zake katika kifo. Kuihifadhi hulinda mguso wa kifamilia na kitheolojia bila kuingiza fundisho la maisha baada ya kifo ambalo kifungu hakilifafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi umetolewa kwa urahisi wa Kiswahili, huku sitiari kuu ya Kiebrania ikihifadhiwa.
