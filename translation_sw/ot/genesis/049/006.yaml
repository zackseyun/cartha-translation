  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: sw
  text: Nafsi yangu isiingie katika baraza lao[a]; heshima yangu isiungane na kusanyiko lao[b]. Kwa maana katika hasira yao walimuua mtu, na kwa utashi wao wenyewe walimkata ng’ombe dume mishipa ya miguu ya nyuma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baraza lao la siri.” Neno la Kiebrania סוֹד linaweza kumaanisha baraza la siri au la watu wa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au “utukufu wangu usiungane na kusanyiko lao.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania שׁוֹר kwa kawaida husomwa “ng’ombe dume.” Baadhi hufasiri konsonanti hizo kwa namna tofauti na kutafsiri sehemu hii, “walibomoa ukuta.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: katika baraza lao
  rationale: סוֹד inaweza kumaanisha baraza la watu wa karibu au la siri. “Baraza” linaendeleza ulinganifu na קָהָל bila kulazimisha wazo la usiri.
- source_word: תָּבֹא נַפְשִׁי
  choice: Nafsi yangu isiingie
  rationale: Muundo wenye אַל unaonyesha tamko la kukataa au ombi lenye nguvu. Kutaja “nafsi yangu” kunahifadhi tamathali na uzito wa kishairi wa Kiebrania.
- source_word: בִּקְהָלָם
  choice: kusanyiko lao
  rationale: קָהָל ni mkutano au kundi lililokusanyika; “kusanyiko” ni Kiswahili cha kawaida na kinaendana na “baraza.”
- source_word: תֵּחַד כְּבֹדִי
  choice: heshima yangu isiungane
  rationale: יחד hapa ni kuungana au kushirikishwa, na כָּבוֹד inaweza kuwa heshima, utukufu, au hadhi. “Heshima yangu” inaeleza kujitenga kwa Yakobo na tendo lao bila kuingiza maana ya kitheolojia isiyolazimishwa na muktadha.
- source_word: בְאַפָּם
  choice: katika hasira yao
  rationale: אַף hapa ni nahau ya hasira; tafsiri hii ni wazi, ya sasa, na inafuata muundo wa kishairi.
- source_word: הָרְגוּ אִישׁ
  choice: walimuua mtu
  rationale: Umoja wa אִישׁ umehifadhiwa. Huenda kauli hii inadokeza tukio la Shekemu, lakini tafsiri haipanui maana kuwa watu wengi.
- source_word: וּבִרְצֹנָם
  choice: kwa utashi wao wenyewe
  rationale: רָצוֹן inaweza kumaanisha mapenzi, ridhaa, au utashi. Katika muktadha huu hasi, “utashi wao wenyewe” huonyesha tendo la makusudi bila kuongeza moja kwa moja wazo la ukaidi.
- source_word: עִקְּרוּ
  choice: walimkata mishipa ya miguu ya nyuma
  rationale: עקר inapohusishwa na mnyama inaeleweka kwa kawaida kuwa kumkata mishipa ya miguu ya nyuma na hivyo kumlemaza. Kiswahili hiki kinaeleza tendo hilo kwa uwazi.
- source_word: שׁוֹר
  choice: ng’ombe dume
  rationale: שׁוֹר humaanisha ng’ombe dume au fahali. “Ng’ombe dume” ni wazi kwa wasomaji wengi na inafaa kama kitu cha kitenzi עקר.
theological_decisions:
- issue: Maana ya כְּבֹדִי katika kauli ya kishairi ya Yakobo ya kujitenga na ukatili
  choice: heshima yangu
  alternative: utukufu wangu
  rationale: “Heshima yangu” inawasilisha hadhi na jina la Yakobo katika muktadha huu, huku “utukufu wangu” ukiwezekana lakini unaweza kusikika kuwa na maana maalumu ya kitheolojia isiyohitajika hapa.
- issue: Usomaji wa שׁוֹר katika sehemu ya mwisho
  choice: ng’ombe dume
  alternative: ukuta
  rationale: Uwekaji wa irabu wa Kimasora unasoma שׁוֹר, “ng’ombe dume,” na kitenzi עקר kinafaa kwa kitendo cha kumkata mnyama mishipa. Usomaji wa “ukuta” ni mbadala unaojulikana na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa “baraza lao / kusanyiko lao” na “nafsi yangu / heshima yangu” umehifadhiwa; kitendo cha kumlemaza mnyama kimeelezwa kwa maneno ya kawaida badala ya istilahi adimu.
