base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: sw
  text: Akifunga mwana-punda wake kwa mzabibu[a], na mwana wa punda-jike wake kwa mzabibu bora[b], anafua mavazi yake katika divai, na analifua joho lake katika damu ya zabibu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “punda wake mchanga”; neno la Kiebrania עִיר humaanisha punda mchanga au mwana-punda.
    reason: lexical_alternative
  - marker: b
    text: Au “mzabibu wa thamani”; neno la Kiebrania שֹׂרֵקָה humaanisha mzabibu uliochaguliwa au bora.
    reason: lexical_alternative
  - marker: c
    text: “Damu ya zabibu” ni usemi wa kishairi wa Kiebrania unaomaanisha maji ya zabibu au divai; taswira yake imehifadhiwa hapa.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: Akifunga
  rationale: Umbo la kitenzi cha hali ya kuendelea linaendeleza taswira hai ya kishairi; Kiswahili cha 'akifunga' huunganisha kwa kawaida tendo hili na tendo kuu linalofuata.
- source_word: לַגֶּפֶן
  choice: kwenye mzabibu
  rationale: Neno גפן ni mzabibu; umoja umehifadhiwa, na 'kwenye' ni ya asili kwa kitu kinachofungiwa kwenye shina la mzabibu.
- source_word: עירֹה
  choice: mwana-punda wake
  rationale: עַיִר humaanisha punda mchanga au mwana-punda. 'Mwana-punda' huhifadhi maana ya umri na kiambishi cha umilikaji bila kuifanya kuwa punda wa kawaida asiyeainishwa.
- source_word: וְלַשֹּׂרֵקָה
  choice: na ... kwenye mzabibu bora
  rationale: שֹׂרֵקָה ni mzabibu uliochaguliwa au wa thamani; 'mzabibu bora' ni wazi, wa kawaida, na huhifadhi dhana ya ubora.
- source_word: בְּנִי אֲתֹנוֹ
  choice: mtoto wa punda-jike wake
  rationale: Tafsiri hii inafuata kwa karibu 'mwana wa punda-jike wake,' ikihifadhi jinsia ya mnyama na uhusiano wake na mwana huyo.
- source_word: כִּבֵּס
  choice: anafu(a)
  rationale: Wakati uliopo unaonyesha tendo kama taswira hai na tabia ya wingi mkubwa katika baraka hii; hauamui kimya-kimya kama ni tendo lililopita au la baadaye.
- source_word: בַּיַּיִן
  choice: katika divai
  rationale: Kihusishi ב kinaeleweka kwa asili kama 'katika,' na hivyo kuhifadhi picha halisi ya kufua mavazi ndani ya divai.
- source_word: לְבֻשׁוֹ
  choice: mavazi yake
  rationale: Ingawa umbo ni la umoja, neno linaweza kuwa la kijumla kwa mavazi; wingi wa Kiswahili unasikika kwa kawaida na kuendana na mstari sambamba.
- source_word: וּבְדַם עֲנָבִים
  choice: na ... katika damu ya zabibu
  rationale: Sitiari halisi ya Kiebrania imehifadhiwa badala ya kurahisishwa kuwa juisi au divai, ili taswira ya kishairi ibaki.
- source_word: סוּתוֹ
  choice: joho lake
  rationale: '''Joho'' ni neno la vazi la nje lenye hadhi na linafaa katika usambamba wa kishairi bila kubainisha kupita kiasi aina kamili ya vazi.'
theological_decisions:
- issue: Taswira ya Kimasihi au ya kabila katika baraka ya Yakobo juu ya Yuda
  choice: Kuacha mstari uwe taswira ya kishairi ya wingi wa ajabu na ustawi bila kuongeza ufafanuzi wa Kimasihi katika matini.
  alternative: Kuutafsiri wazi kuwa unabii wa moja kwa moja wa Kimasihi, au kuwa maelezo ya kihistoria tu ya ustawi wa kabila la Yuda.
  rationale: Kiebrania chenyewe kinatoa picha ya wingi wa mizabibu na divai. Muktadha mpana unaweza kutafsiriwa kwa njia tofauti, kwa hiyo tafsiri haiingizi hitimisho la kimadhehebu lisilotajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na usambamba umehifadhiwa kwa lugha inayoeleweka kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini karibu na maneno yanayohusika.
