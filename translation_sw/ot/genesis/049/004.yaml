review_pass:
  verdict: revise
  source_fidelity: The draft properly retains the causal accusation, the euphemistic 'went up,' and the Masoretic abrupt shift to third person in the final clause. However, the opening phrase is not grammatical Swahili, and the rendering of חיללת needs a more direct transitive construction. The revision preserves the ambiguity of the final clause without importing Genesis 35:22.
  naturalness: “Uliye asiye na uthabiti” is unidiomatic and grammatically malformed. “Wewe ni mwenye kutokuwa thabiti kama maji” is natural, elevated Standard East African Swahili. “Ulikinajisi” is clearer and more idiomatic than “ukakitia unajisi.”
  terminology: “Ukuu” conveys the loss of preeminence more precisely than “mkuu,” which can primarily denote a ruler or chief. “Kitanda” is retained consistently for both the father’s bed and the speaker’s couch/bed.
  issues:
  - severity: high
    issue: Ungrammatical opening expression
    rationale: “Uliye asiye na uthabiti kama maji” combines incompatible relative constructions and does not form a natural Swahili clause or vocative.
  - severity: medium
    issue: The verb phrase for defilement is awkward
    rationale: “Ukakitia unajisi” is understandable, but “ulikinajisi” is the direct and idiomatic transitive rendering of חִלַּלְתָּ in this context.
  - severity: medium
    issue: “Hutakuwa mkuu” is less precise for lost preeminence
    rationale: It can suggest that Reuben will not be a chief. “Hutakuwa na ukuu” better conveys the contextual sense of not retaining superiority/preeminence.
  - severity: low
    issue: Footnote does not align consistently with the singular bed wording
    rationale: The draft main text uses singular “kitanda,” while the alternative uses plural “malazi”; a consistent singular term makes the textual alternative clearer.
