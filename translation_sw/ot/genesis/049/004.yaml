base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: sw
  text: Wewe ni mwenye kutokuwa thabiti kama maji,[a] hutakuwa na ukuu, kwa sababu ulipanda kitandani mwa baba yako; ndipo ulikinajisi; alipanda juu ya kitanda changu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa usemi ulio laini zaidi: “ndipo ulipokinajisi kitanda changu—ulikipanda.” Kiebrania katika kishazi cha mwisho hubadilika ghafla na kutumia nafsi ya tatu, “alipanda”; huenda ni marudio ya mshangao yanayomrejelea Reubeni.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: asiye na uthabiti
  rationale: Neno hili linaonyesha hali ya kutotulia, kutokuwa thabiti, au kufanya mambo kwa pupa isiyodhibitiwa. Usemi huu unaeleweka kwa Kiswahili cha sasa na unaendana na mfano wa maji.
- source_word: כַּמַּיִם
  choice: kama maji
  rationale: Ni tafsiri ya moja kwa moja ya tashbihi, ikihifadhi picha ya maji yasiyozuilika au yasiyotulia.
- source_word: אַל תּוֹתַר
  choice: hutakuwa mkuu
  rationale: Katika muktadha wa kupoteza ukuu wa mzaliwa wa kwanza, kitenzi kina maana ya kutokuwa na ubora au cheo cha juu. Tafsiri hii ni fupi na ya kawaida bila kufafanua zaidi ya maandishi.
- source_word: כִּי עָלִיתָ
  choice: kwa sababu ulipanda
  rationale: Inahifadhi nguvu ya kisababishi ya כִּי na kitenzi halisi 'kupanda,' ambacho hapa ni lugha ya staha inayoeleweka kuhusu kosa la kingono.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: kitandani mwa baba yako
  rationale: Ingawa Kiebrania kina umbo la wingi, umoja ni wa kawaida zaidi katika Kiswahili na unaonyesha kitanda cha ndoa cha baba bila kuwa na ugumu usio wa lazima.
- source_word: חִלַּלְתָּ
  choice: ukakitia unajisi
  rationale: Huhifadhi uzito wa maana ya kunajisi au kuhalifu utakatifu; kiwakilishi 'ki-' kinarejelea kitanda kilichotajwa.
- source_word: יְצוּעִי
  choice: malazi yangu
  rationale: Neno linaweza kumaanisha kitanda, mahali pa kulala, au malazi. 'Malazi yangu' huhifadhi nafsi ya kwanza na kuepuka urudiaji mgumu wa 'kitanda.'
- source_word: עָלָה
  choice: alipanda
  rationale: Umbo la Kiebrania ni nafsi ya tatu umoja wa kiume. Kulihifadhi kunabaki na mgeuko wa ghafla wa maandishi ya Kimasora badala ya kuusawazisha kimya kimya.
theological_decisions:
- issue: Lugha ya staha ya tendo la kingono na hukumu ya maadili juu ya Reubeni
  choice: Kuhifadhi usemi 'ulipanda kitandani mwa baba yako' na kutafsiri tendo hilo kuwa 'ukakitia unajisi.'
  alternative: Kufafanua wazi kuwa alilala na suria wa baba yake, au kutumia neno la kiibada zaidi kama 'ulikufuru.'
  rationale: Kiebrania chenyewe kinatumia lugha ya staha lakini inayoeleweka. Tafsiri inahifadhi kiwango hicho cha uwazi bila kuingiza moja kwa moja maelezo ya Mwanzo 35:22.
- issue: Utata wa kishazi cha mwisho עָלָה
  choice: 'Kuhifadhi nafsi ya tatu katika matini kuu: ''alipanda malazi yangu.'''
  alternative: Kusawazisha kuwa 'ulipanda malazi yangu' au 'ndipo ukayanajisi malazi yangu—ulipanda humo.'
  rationale: Kishazi cha mwisho kina mgeuko wa ghafla kutoka nafsi ya pili kwenda nafsi ya tatu. Matini kuu inafuata umbo la Kimasora, huku tanbihi ikieleza usomaji laini zaidi unaoweza kumrejelea Reubeni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Lugha ya staha ya Kiebrania imehifadhiwa, na mgeuko wa ghafla wa nafsi katika kishazi cha mwisho umeachwa katika matini kuu pamoja na tanbihi ya ufafanuzi.
