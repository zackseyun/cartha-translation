  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: sw
  text: Wokovu wako naugojea[a], Ee Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimeungojea ukombozi wako, Ee Yahweh.” Kiebrania kinaweza pia kutafsiriwa kwa “ukombozi” badala ya “wokovu,” na umbo la kitenzi linaweza kutolewa kama “nimeungojea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: Wokovu wako
  rationale: Nomino יְשׁוּעָה inaweza kumaanisha wokovu au ukombozi. “Wokovu” huhifadhi upana wa maana katika kauli hii ya kishairi, huku kiambishi ל־ kikielezwa kiasili na kitenzi cha Kiswahili “kungojea.”
- source_word: קִוִּיתִי
  choice: naugojea
  rationale: Kitenzi קוה huonyesha kungoja kwa tumaini na matarajio. Wakati uliopo wa Kiswahili unaonyesha matarajio yanayoendelea; umbo la Kiebrania pia linaweza kutafsiriwa kwa mtazamo wa tendo lililokamilika, “nimeungojea.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama “Yahwe,” badala ya kubadilishwa kwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Ee Yahwe
  alternative: Ee Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina hilo kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Upeo wa maana ya יְשׁוּעָה
  choice: wokovu
  alternative: ukombozi
  rationale: “Wokovu” huhifadhi maana pana ya msaada na uokozi wa Mungu bila kuifungia kauli hii katika ukombozi wa kijeshi pekee.
translation_notes:
  register: Mpangilio “Wokovu wako naugojea” unahifadhi msisitizo wa kishairi wa Kiebrania unaoweka wokovu mbele. Lugha ni ya sasa, yenye heshima, na inaeleweka kwa wasomaji wa Kiswahili sanifu cha Afrika Mashariki.
