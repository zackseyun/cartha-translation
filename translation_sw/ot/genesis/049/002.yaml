base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: sw
  text: Kusanyikeni, sikieni, enyi wana wa Yakobo; msikilizeni Israeli, baba yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutaneni, sikieni, enyi wana wa Yakobo; msikilizeni Israeli, baba yenu.” Kiebrania kinarudia amri ya kusikia ili kuitilia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: Kusanyikeni
  rationale: Amri ya wingi inaagiza wana wa Yakobo wakutane mahali pamoja; umbo la Kiswahili linaeleza kwa kawaida maana ya kujikusanya iliyomo katika kauli ya Kiebrania.
- source_word: שִׁמְעוּ
  choice: msikilize
  rationale: Katika muktadha huu amri inataka kusikia kwa makini na kutii, si kupokea sauti tu. Kurudiwa kwa neno hilo kumehifadhiwa.
- source_word: בְּנֵי יַעֲקֹב
  choice: wana wa Yakobo
  rationale: Neno la Kiebrania linawahusu hasa wana wa kiume wa Yakobo waliokusanyika kupokea maneno yake; “wana” ni sahihi na la kawaida katika Kiswahili cha Biblia.
- source_word: שִׁמְעוּ אֶל
  choice: msikilize
  rationale: Muundo huu unaelekeza usikivu kwa msemaji. Kiswahili hutumia kitenzi “sikiliza” chenye kiambishi cha yambwa bila kuhitaji kihusishi tofauti.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la agano la Yakobo limehifadhiwa tofauti na “Yakobo,” hivyo kudumisha usambamba na uzito wa kishairi wa chanzo.
- source_word: אֲבִיכֶם
  choice: baba yenu
  rationale: Tafsiri ya moja kwa moja ya umilikaji, ikiwa katika ufafanuzi wa jina “Israeli.”
theological_decisions:
- issue: Majina yanayolingana Yakobo na Israeli
  choice: 'Kuhifadhi majina yote mawili: “wana wa Yakobo ... Israeli, baba yenu”'
  alternative: Kuyapatanisha kwa kutumia jina moja tu
  rationale: Chanzo kinatumia majina yote mawili kwa makusudi katika usambamba wa kishairi. Kuyahifadhi huepuka kufifisha mwangwi wa jina la agano na utambulisho wa baba yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Enyi” limetumiwa kama mwito wa kishairi unaoeleweka, huku urudiaji wa “msikilize” ukihifadhi msisitizo wa Kiebrania.
