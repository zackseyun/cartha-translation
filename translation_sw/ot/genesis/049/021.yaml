  text: 'Naftali ni kulungu jike aliyeachwa huru,[a]

    atoaye maneno mazuri.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulungu jike aliyeachiliwa”; taswira ya Kiebrania ni ya kulungu wa kike aliyeachwa akimbie kwa uhuru.
    reason: lexical_alternative
  - marker: b
    text: Kishazi cha mwisho pia kimeeleweka kwa njia nyingine katika tafsiri za kale na za sasa, kutia ndani “atoaye semi nzuri” au, kwa maana nyingine iliyopendekezwa ya maneno ya mwisho, “azaaye watoto wazuri wa kulungu.”
