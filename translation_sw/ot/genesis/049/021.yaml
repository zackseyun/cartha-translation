lexical_decisions:
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina la mtu na kabila limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אַיָּלָה
  choice: kulungu jike
  rationale: Neno hili humaanisha mnyama wa jamii ya kulungu wa kike; tafsiri hii inahifadhi taswira ya kike kwa lugha ya kawaida na yenye heshima.
- source_word: שְׁלֻחָה
  choice: aliyeachiliwa huru
  rationale: Umbo hili la kutendwa kutoka שלח linaonyesha mnyama aliyeachiliwa ili akimbie bila kuzuiliwa; usemi huu ni wa asili katika Kiswahili.
- source_word: הַנֹּתֵן
  choice: atoaye
  rationale: Kauli endelevu ya Kiebrania imewasilishwa kwa ufupi wa kishairi. Kiswahili hakilazimishi kutaja jinsia hapa, hivyo uhusiano wa kishazi na Naftali au taswira ya kulungu haujaamuliwa kupita kiasi.
- source_word: אִמְרֵי
  choice: maneno
  rationale: Wingi huu unarejelea semi au matamshi; “maneno” ni wazi, wa kawaida, na mpana vya kutosha.
- source_word: שָׁפֶר
  choice: mazuri
  rationale: Neno hili lina wazo la uzuri au upendezi; “mazuri” ni la asili katika Kiswahili na linafaa kwa maneno au semi.
theological_decisions:
- issue: Kiima cha kishazi cha mwisho na maana ya maneno ya mwisho
  choice: Kishazi “atoaye maneno mazuri” kimeachwa kikimwelezea Naftali kupitia taswira ya kulungu.
  alternative: Kishazi kinaweza kuhusishwa moja kwa moja na kulungu; pia maneno ya mwisho yameeleweka na baadhi kuwa yanahusu kuzaa wana wa kulungu walio wazuri.
  rationale: Kiebrania ni kifupi na cha kishairi. Uwekaji wa irabu wa Kimasora unaunga mkono maana ya “atoaye maneno mazuri,” lakini sintaksia na historia ya ufasiri zinaacha uwezekano mwingine; tanbihi inahifadhi utata huo bila kuufanya kuwa fundisho maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko mfupi wa kishairi na msamiati wa sasa wenye heshima. Mistari miwili inaakisi muundo wa baraka ya kishairi; utata halisi wa Kiebrania umehifadhiwa katika tanbihi.
