  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: sw
  text: 'Reubeni, wewe ni mwana wangu wa kwanza,

    nguvu zangu na malimbuko ya nguvu zangu za uzazi.[a]

    Uliye bora kuliko wote kwa heshima,

    na uliye bora kuliko wote kwa nguvu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanzo wa nguvu zangu.” Kifungu cha Kiebrania kinarejelea udhihirisho wa kwanza wa nguvu za baba za uzazi.
    reason: lexical_alternative
  - marker: b
    text: Au, “uliye mkuu kwa heshima na mkuu kwa nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: mzaliwa wangu wa kwanza
  rationale: Huhifadhi maana ya mwana wa kwanza kwa mpangilio wa kuzaliwa pamoja na hadhi inayohusiana nayo.
- source_word: כֹּחִי
  choice: nguvu zangu
  rationale: Ni tafsiri ya moja kwa moja na ya kishairi ya nguvu au uwezo wa baba.
- source_word: רֵאשִׁית אוֹנִי
  choice: mwanzo wa uweza wangu
  rationale: Huhifadhi taswira ya kitu cha kwanza kinachotokana na nguvu za Yakobo bila kuifanya lugha iwe ya kitabibu; tanbihi inaeleza maana ya nguvu za uzazi iliyomo katika muktadha.
- source_word: יֶתֶר שְׂאֵת
  choice: umewapita wengine kwa heshima
  rationale: Kitenzi hiki cha Kiswahili kinaonyesha wazi wazo la kuzidi au kuwa mkuu zaidi, huku שׂאת ikitafsiriwa kwa maana ya heshima au kuinuliwa.
- source_word: יֶתֶר עָז
  choice: umewapita wengine kwa nguvu
  rationale: Hudumisha ulinganifu wa kishairi wa kishazi kilichotangulia na maana ya ubora au ukuu katika nguvu.
- source_word: אַתָּה
  choice: wewe ni
  rationale: Huhifadhi msisitizo wa kiwakilishi huru katika usemi wa moja kwa moja.
