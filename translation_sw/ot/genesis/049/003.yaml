  - severity: low
    issue: “Umewapita wengine” huweka kauli katika wakati timilifu.
    rationale: Vishazi vya Kiebrania ni vya kisifa na vinaeleza ubora; muundo wa Kiswahili wa sifa huepuka kudokeza tendo lililokamilika.
