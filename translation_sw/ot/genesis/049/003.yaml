  terminology: Reubeni ni tahajia ya kawaida ya Kiswahili. “Nguvu” hufaa kwa כֹּחִי. “Nguvu za uzazi” hufaa kwa אֹנִי katika muktadha huu. “Heshima” na “nguvu” hutoa maana zinazokubalika za שְׂאֵת na עָז; “bora kuliko wote” huwasilisha יֶתֶר kwa uwazi.
