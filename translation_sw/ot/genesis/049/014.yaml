  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: sw
  text: Isakari ni punda mwenye mifupa imara, aliyejilaza kati ya mazizi mawili ya kondoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katikati ya mifuko ya kubebea mizigo.” Neno la Kiebrania ni adimu, na maana yake hubishaniwa; “mazizi ya kondoo” ni maana ya kimapokeo na huenda inafaa muktadha huu wa baraka yenye picha za kichungaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: Isakari
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: חֲמֹר
  choice: punda
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili cha sasa; Kiebrania hakilazimishi kutaja jinsia ya mnyama.
- source_word: גָּרֶם
  choice: mwenye mifupa yenye nguvu
  rationale: Neno linalohusiana na ‘mfupa’ linaeleza umbile imara la punda. Kauli hii inadumisha picha halisi ya kishairi bila kutoa maana ya kuwa amekonda.
- source_word: רֹבֵץ
  choice: anayelala
  rationale: Kitenzi hiki humweleza mnyama aliyelala au kujilaza; ‘anayelala’ ni cha kawaida na kinafaa picha ya kichungaji.
- source_word: בֵּין
  choice: katikati ya
  rationale: Hutoa kwa kawaida maana ya kuwa baina ya vitu au maeneo mawili; hapa ‘katikati ya’ ni Kiswahili cha asili.
- source_word: הַמִּשְׁפְּתָיִם
  choice: mazizi ya kondoo
  rationale: Neno hili adimu lina maana inayobishaniwa. Maana ya mapokeo ya mazizi au maboma ya mifugo inafaa muktadha wa kichungaji, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
