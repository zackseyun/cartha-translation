base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: sw
  text: 'Lakini upinde wake ulibaki imara,

    na mikono yake ikawa yenye wepesi

    kwa mikono ya Mwenye Nguvu wa Yakobo;

    kutoka huko huja Mchungaji,

    Jiwe la Israeli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאֵיתָן
  choice: imara
  rationale: Neno hili linaonyesha uthabiti na nguvu; “ulibaki imara” ni Kiswahili cha kawaida kinachohifadhi maana ya upinde kutolegea chini ya mashambulizi.
- source_word: וַיָּפֹזּוּ זְרֹעֵי יָדָיו
  choice: mikono yake ikawa hodari
  rationale: Kitenzi adimu פזז huenda hapa kikaonyesha wepesi, ustadi, au nguvu. “Ikawa hodari” huhifadhi wazo la uwezo uliotiwa nguvu bila kulazimisha maana finyu ya wepesi pekee.
- source_word: אֲבִיר יַעֲקֹב
  choice: Mwenye Nguvu wa Yakobo
  rationale: Ni cheo cha Mungu kinachoonyesha uwezo mkuu; tafsiri hii ni wazi, yenye heshima, na haiongezi maelezo yasiyokuwapo.
- source_word: רֹעֶה
  choice: Mchungaji
  rationale: Huhifadhi sitiari ya kichungaji na hadhi ya cheo katika muktadha huu.
- source_word: אֶבֶן יִשְׂרָאֵל
  choice: Mwamba wa Israeli
  rationale: Ingawa אבן kwa msingi ni “jiwe,” katika cheo hiki sitiari inaonyesha uthabiti na ulinzi; “Mwamba” ni Kiswahili cha asili na chenye uzito unaofaa.
theological_decisions:
- issue: Uhusiano wa kishazi מִשָּׁם רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: kutoka huko huja Mchungaji, Mwamba wa Israeli
  alternative: kwa huyo Mchungaji, Jiwe la Israeli
  rationale: 'Kiebrania kina utata wa kisintaksia: מִשָּׁם kwa kawaida ni “kutoka huko,” lakini baadhi huunganisha kishazi hiki na chanzo cha msaada wa Yusufu. Tafsiri iliyochaguliwa huhifadhi muundo na utata wa maandishi kwa kadiri Kiswahili kinavyoruhusu.'
- issue: Utambulisho wa “Mchungaji, Mwamba wa Israeli”
  choice: vyeo vimeachwa bila kufafanuliwa zaidi
  alternative: kuvitaja wazi kuwa vinamhusu Mungu au Masihi
  rationale: Mstari wenyewe hautoi ufafanuzi wa moja kwa moja; kuongeza utambulisho maalumu kungeondoa mvutano wa kiteolojia uliomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi inayofaa baraka ya Yakobo lakini kinachoeleweka kwa msomaji wa kawaida. Mistari imepangwa kwa vishazi ili kuonyesha ushairi wa Kiebrania.
