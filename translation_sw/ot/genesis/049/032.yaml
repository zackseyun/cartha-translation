  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
translation:
  language: sw
  text: Shamba na pango lililomo vilinunuliwa kutoka kwa wana wa Hethi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa Wahiti.” Kiebrania kinasema, “kutoka kwa wana wa Hethi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Ununuzi wa shamba na pango lililomo ulifanywa kutoka kwa wana wa Hethi.”
    reason: previous_rendering
lexical_decisions:
- source_word: מִקְנֵה
  choice: vilinunuliwa
  rationale: Nomino hii inaonyesha kitu kilichopatikana kwa ununuzi. Katika Kiswahili, kauli ya kitenzi “vilinunuliwa” inaeleza kwa kawaida na kwa uwazi ununuzi wa shamba na pango, huku tanbihi ikihifadhi muundo wa sentensi ya nomino wa Kiebrania.
- source_word: הַשָּׂדֶה
  choice: shamba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa eneo la ardhi katika muktadha huu wa umiliki.
- source_word: וְהַמְּעָרָה
  choice: na pango
  rationale: Tafsiri ya moja kwa moja inayohifadhi kiunganishi na kutaja kitu cha pili kilichonunuliwa.
- source_word: אֲשֶׁר בּוֹ
  choice: lililomo
  rationale: Hueleza kwa ufupi na kwa kawaida kwamba pango limo ndani ya shamba; haiongezi maelezo yasiyokuwapo katika chanzo.
- source_word: מֵאֵת
  choice: kutoka kwa
  rationale: Huonyesha watu ambao mali ilinunuliwa kwao kwa Kiswahili cha kawaida.
- source_word: בְּנֵי חֵת
  choice: wana wa Hethi
  rationale: Inahifadhi kwa uwazi usemi wa kifamilia na jina la Kiebrania, badala ya kuubadili moja kwa moja kuwa jina la kabila.
