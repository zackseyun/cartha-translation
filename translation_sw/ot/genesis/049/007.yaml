  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: sw
  text: 'Na ilaaniwe[a] hasira yao, kwa maana ni kali,

    na ghadhabu yao, kwa maana ni ngumu.

    Nitawagawanya katika Yakobo,

    na kuwatawanya katika Israeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hasira yao imelaaniwa, kwa maana ni kali, na ghadhabu yao imelaaniwa, kwa maana ni ngumu.”
    reason: Huonyesha muundo mwingine wa Kiswahili wa tamko la laana bila kubadili kwamba hasira na ghadhabu ndizo zinazolaaniwa.
lexical_decisions:
- source_word: אָרוּר
  choice: na ilaaniwe
  rationale: Kauli ya kutendwa yenye nguvu ya tamko la laana; muundo huu wa Kiswahili unaonyesha kuwa hasira ndiyo inayolaaniwa.
- source_word: אַפָּם
  choice: hasira yao
  rationale: Ingawa neno hilo linahusiana kihalisi na pua au tundu la pua, hapa ni nahau yenye maana ya hasira.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya tamko la laana na inafaa katika ushairi wenye hadhi.
- source_word: עָז
  choice: kali
  rationale: Katika muktadha wa hasira, neno hili linaonyesha nguvu na ukali unaodhuru.
- source_word: וְעֶבְרָתָם
  choice: na ghadhabu yao
  rationale: Ghadhabu huwasilisha hasira iliyofurika na kudumisha toni nzito ya hukumu.
- source_word: קָשָׁתָה
  choice: ni katili
  rationale: Katika muktadha huu, ukakamavu au ukali wa ghadhabu unaelezwa kwa maana ya ukatili wa vurugu.
- source_word: אֲחַלְּקֵם
  choice: Nitawagawanya
  rationale: Huhifadhi tofauti ya kitenzi hiki na kitendo kinachofuata cha kuwatawanya.
- source_word: בְּיַעֲקֹב
  choice: katika Yakobo
  rationale: Yakobo linatumika kwa maana ya watu waliotokana naye; tafsiri ya moja kwa moja huhifadhi usambamba.
- source_word: וַאֲפִיצֵם
  choice: na kuwatawanya
  rationale: Huwasilisha kusababisha wasambae na ni Kiswahili cha kawaida katika muktadha huu.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Huhifadhi jina la pili na usambamba wa kishairi kati ya Yakobo na Israeli.
theological_decisions:
- issue: Kinacholaaniwa
  choice: Laana inaelekezwa kwa hasira na ghadhabu yao, si moja kwa moja kwa Simeoni na Lawi wenyewe.
  alternative: Kuwaona ndugu wenyewe kuwa ndio wanaolaaniwa.
  rationale: Kiebrania kinataja wazi hasira yao na ghadhabu yao kama vitu vinavyolaaniwa; tafsiri haipanui laana hadi kwa watu wenyewe.
- issue: Maana ya קָשָׁתָה
  choice: ni katili
  alternative: ni kali / ni ngumu
  rationale: Katika uhusiano na ghadhabu ya vurugu, “katili” huonyesha athari ya kimaadili ya ukali huo, ingawa neno la asili pia linaweza kueleweka kwa upana kuwa kali au ngumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na mtiririko wa kishairi. Mistari imepangwa ili kuhifadhi usambamba wa Kiebrania; “Yakobo” na “Israeli” zote zimedumishwa.
