  verdict: revise
  source_fidelity: The active plural forms are preserved well by “walimzika,” and Jacob’s first-person singular is accurately represented by “nilimzika.” The repeated burial verb and the two possessive phrases are retained. However, “humo” means ‘in there/therein’ and unnecessarily specifies interior location; שָׁמָּה simply means ‘there,’ pointing back to the burial place broadly.
  naturalness: The sentence is clear, dignified, and idiomatic in Standard East African Swahili. “Huko” is the more neutral and natural locative equivalent for the repeated Hebrew adverb in this context.
  terminology: The established Swahili biblical forms Abrahamu, Sara, Isaka, Rebeka, and Lea are appropriate. “Mke wake” accurately renders the Hebrew wording without adding interpretation.
  issues:
