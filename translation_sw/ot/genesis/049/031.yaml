  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: sw
  text: Huko walimzika Abrahamu na Sara mke wake; huko walimzika Isaka na Rebeka mke wake; na huko nilimzika Lea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: humo
  rationale: Kielezi hiki kinarejelea ndani ya pango la maziko lililotajwa katika muktadha. “Humo” ni cha kawaida na sahihi zaidi kuliko “huko,” kwa kuwa kinadokeza ndani ya mahali hapo.
- source_word: קָבְרוּ
  choice: walimzika
  rationale: Qal timilifu nafsi ya tatu wingi ina mtenda asiyeainishwa; Kiswahili huweza kuhifadhi kauli tendi kwa “walimzika.” Kiambishi cha yambwa -m- kinakubaliana na kila mtu anayetajwa.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume hutafsiriwa kwa kawaida “mke wake.” Kurudia usemi huo kwa Sara na Rebeka kunahifadhi muundo wa Kiebrania.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha vipashio na vifungu kwa urahisi. “Na” kinadumisha mtindo wa orodha katika maneno ya Yakobo.
- source_word: קָבַרְתִּי
  choice: nilimzika
  rationale: Qal timilifu nafsi ya kwanza umoja inaeleza tendo la Yakobo mwenyewe la zamani kuhusu Lea; wakati uliopita wa Kiswahili unafaa katika muktadha.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: walimzika ... walimzika ... nilimzika
  rationale: Kurudia mzizi wa “zika” kunahifadhi urudiaji wa קבר katika Kiebrania na kuonyesha ulinganifu wa vifungu vitatu.
- source_word: לֵאָה
  choice: Lea
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
