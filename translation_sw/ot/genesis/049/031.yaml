    issue: “Humo” is too spatially specific for שָׁמָּה.
    rationale: The Hebrew adverb denotes ‘there,’ not specifically ‘inside there.’ Although the preceding context includes a cave, the verse itself does not require an interior sense. “Huko” preserves the source’s neutral reference to the place.
