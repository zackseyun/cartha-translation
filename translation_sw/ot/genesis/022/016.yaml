lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kitenzi kinaendeleza simulizi, na kiambishi cha nafsi katika Kiswahili kinaonyesha mtendaji bila kulazimika kumtaja tena.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Nimeapa kwa nafsi yangu mwenyewe
  rationale: Hii ni kauli ya kiapo ambamo msemaji anaapa kwa nafsi yake; wakati timilifu unaonyesha kiapo kilichotolewa na chenye nguvu sasa.
- source_word: נְאֻם יְהוָה
  choice: tamko la Yahwe
  rationale: Neno נְאֻם linaashiria tangazo rasmi lenye mamlaka, huku jina la Mungu יְהוָה likihifadhiwa kama Yahwe.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: kwamba, kwa kuwa
  rationale: כִּי linaanzisha yaliyomo katika kiapo, na יַעַן אֲשֶׁר linaonyesha sababu; muundo huu huhifadhi kazi zote mbili ingawa sentensi inaendelea katika mstari unaofuata.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: umefanya jambo hili
  rationale: “Jambo hili” ni Kiswahili cha kawaida kinachoelekeza kwa tendo la Abrahamu bila kuongeza ufafanuzi usiotajwa.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: na hukumbakiza
  rationale: “Kumbakiza” hapa hutoa wazo la kutomweka mwana kando au kutomzuia asitolewe, bila kuingiza moja kwa moja maana pana zaidi ya “kumhurumia.”
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: mwanao, mwanao wa pekee
  rationale: Kurudia “mwanao” ni kwa kawaida katika Kiswahili na kunahifadhi msisitizo wa muundo wa Kiebrania; “wa pekee” huonyesha hali yake ya kuwa wa pekee au wa namna ya kipekee.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo tu; “Yahwe” hulihifadhi kwa unukuzi wa kawaida bila kulibadilisha kuwa cheo.
- issue: Maana ya יְחִידְךָ
  choice: mwanao wa pekee
  alternative: mwanao wa kipekee
  rationale: “Wa pekee” ndiyo maana ya moja kwa moja katika muktadha wa mwana, lakini tanbihi huhifadhi uwezekano wa maana ya “wa kipekee” bila kuongeza mwangwi wa kiteolojia wa baadaye.
- issue: Nguvu ya חָשַׂךְ katika muktadha wa dhabihu
  choice: hukumbakiza
  alternative: hukumwacha salama / hukumhurumia
  rationale: Chaguo hili huhifadhi wazo la kutomzuia au kutomweka kando, bila kuamua kimya kimya kwamba kitenzi chenyewe lazima kimaanishe “kumhurumia.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unaachwa ukiendelea kwa koma kwa sababu kiapo na matokeo yake yanaendelea katika mstari unaofuata.
