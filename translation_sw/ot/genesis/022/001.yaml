  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: sw
  text: Baada ya mambo hayo, Mungu alimjaribu[a] Abrahamu. Akamwambia, “Abrahamu!” Naye akasema, “Mimi hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimweka Abrahamu katika jaribio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo hayo
  rationale: וַיְהִי hapa ni kiungo cha kuendeleza simulizi, na maana yake inawasilishwa kwa Kiswahili cha kawaida kupitia kishazi cha wakati. “Mambo” linadumisha upana wa דְּבָרִים kuliko “matukio.”
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu nomino hiyo inamtaja Mungu; si jina la agano YHWH.
- source_word: נִסָּה
  choice: alimjaribu
  rationale: Kitenzi hiki hapa kina maana ya kumweka mtu katika jaribio ili adhihirishe alivyo. “Alimjaribu” ni usemi wa asili wa Kiswahili na hauongezi maelezo ambayo hayapo katika matini.
- source_word: אֶת אַבְרָהָם
  choice: Abrahamu
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi; jina linatolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Akamwambia
  rationale: Hili ni toleo la kawaida na la moja kwa moja la אמר pamoja na yambwa isiyo ya moja kwa moja.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Nahau hii inaonyesha kuwapo kwa makini na utayari wa kuitikia; “Mimi hapa” ni ya asili na inadumisha uzito wake wa kiuhusiano.
theological_decisions:
- issue: Maana ya נִסָּה Mungu akiwa mtendaji
  choice: Mungu alimjaribu Abrahamu
  alternative: Mungu alimshawishi Abrahamu
  rationale: Katika muktadha huu kitenzi kinaeleza kumweka Abrahamu katika jaribio, si kumshawishi atende uovu. Hata hivyo, tafsiri haiongezi mapema matokeo au kusudi kamili la jaribio hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa masimulizi ya kawaida; “Mimi hapa” unadumisha mwitikio wa heshima na utayari bila kutumia lugha ya kizamani.
