base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: sw
  text: Kisha wakafika mahali Mungu aliyomwambia[a]. Hapo Abrahamu akajenga madhabahu[b] na kuzipanga kuni. Akamfunga Isaka mwanawe, akamweka juu ya madhabahu, juu ya kuni zilizopangwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali ambapo Mungu alikuwa amemwambia.” Kiebrania kwa karibu zaidi husema, “mahali Mungu aliyomwambia.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema “madhabahu” pamoja na kibainishi maalumu kinacholingana kwa karibu na “ile madhabahu”; huenda kinaionyesha kuwa madhabahu maalumu iliyoandaliwa kwa dhabihu hii.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kwa neno halisi ni “juu ya kuni” au “juu kabisa ya kuni,” yaani, juu ya kuni zilizokuwa zimepangwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kisha wakafika
  rationale: Muundo wa masimulizi wa wayyiqtol unaendeleza mfuatano wa matukio. “Kisha” huonyesha mfuatano huo kwa Kiswahili cha kawaida, na “wakafika” huhifadhi kiima cha wingi.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: Mungu alipokuwa amemwambia
  rationale: Kauli hii hutambulisha mahali kwa kurejelea maelekezo ya Mungu yaliyotangulia. Wakati wa “alipokuwa amemwambia” huonyesha kwamba kusema kulitangulia kufika, bila kuongeza wazi jambo ambalo halikutajwa katika Kiebrania.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu אֱלֹהִים humrejelea Mungu wa kweli; “Mungu” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: Hapo Abrahamu akajenga madhabahu
  rationale: “Hapo” huweka wazi mahali pa tendo, na “akajenga madhabahu” ni Kiswahili cha asili. Kwa kuwa Kiswahili hakina vibainishi vinavyolingana moja kwa moja na the/an, tanbihi inaeleza uainishaji uliopo katika Kiebrania.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: na kuzipanga kuni
  rationale: Kitenzi ערך katika mazingira ya dhabihu humaanisha kupanga au kuweka kwa utaratibu. “Kuzipanga kuni” ni wazi na huhifadhi wazo la maandalizi.
- source_word: וַיַּעֲקֹד
  choice: Akamfunga
  rationale: Kitenzi עקד humaanisha kufunga. “Akamfunga” huhifadhi uzito wa tendo bila kulainisha wala kuongeza namna ambayo hakuelezwa.
- source_word: יִצְחָק בְּנוֹ
  choice: Isaka mwanawe
  rationale: Mpangilio huu unafuata kwa karibu Kiebrania na bado ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: akamweka juu ya madhabahu
  rationale: שׂים ni kitenzi cha jumla cha kuweka. “Akamweka” ni cha kawaida na hakibainishi isivyohitajika namna alivyomsogeza.
- source_word: מִמַּעַל לָעֵצִים
  choice: juu ya kuni
  rationale: Kirai hiki huonyesha nafasi iliyo juu ya kuni zilizopangwa. Katika muktadha huu “juu ya kuni” ni wazi na ya kawaida.
theological_decisions:
- issue: Umaalumu wa madhabahu ya dhabihu
  choice: madhabahu, huku tanbihi ikieleza kibainishi cha Kiebrania
  alternative: ile madhabahu
  rationale: Kiebrania kina kibainishi maalumu, lakini Kiswahili hakina mfumo wa the/an. “Ile madhabahu” kingeweza kudokeza madhabahu iliyokwisha tajwa au iliyokuwapo tayari, ingawa Abrahamu anaijenga hapa. Tafsiri kuu inaacha lugha ya Kiswahili iwe ya kawaida huku tanbihi ikihifadhi taarifa ya kimuundo ya chanzo.
- issue: Tendo la kumfunga Isaka
  choice: Akamfunga Isaka mwanawe
  alternative: Akamfunga-funga Isaka mwanawe
  rationale: “Akamfunga” hutoa maana ya msingi ya עקד bila kupunguza uzito wa tendo wala kuongeza msisitizo wa namna ya kufunga ambao matini hauelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mfululizo wa vitenzi vya ka- huhifadhi mwendo wa masimulizi; msamiati wa kawaida umetumiwa bila kuingiza istilahi za dhehebu.
