- source_word: יָלְדָה ... בָּנִים
  choice: amemzalia ... wana
  rationale: Huwasilisha kwamba Milka amemzalia Nahori watoto wa kiume, huku ‘wana’ ikiandaa orodha inayofuata.
- source_word: נָחוֹר אָחִיךָ
  choice: Nahori ndugu yako
  rationale: Huhifadhi mpangilio na uhusiano ulioelezwa katika chanzo.
