base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: sw
  text: kwamba hakika nitakubariki, na hakika nitauzidisha uzao wako[a] kama nyota za mbinguni na kama mchanga ulio kwenye ufuo wa bahari[c]; na uzao wako utamiliki lango la adui zake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “mbegu yako.” Hapa limetafsiriwa “uzao wako” kwa sababu nomino hiyo ni ya umoja yenye maana ya kijumla na inaweza kutaja wazao kama kundi.
    reason: lexical_alternative
  - marker: b
    text: Au, “wazao wako watamiliki lango la adui zao.” Kiebrania hudumisha “uzao/mbegu” katika umoja wa kisarufi na kusema “adui zake.”
    reason: alternative_reading
  - marker: c
    text: Au, “mchanga ulio juu ya ukingo wa bahari.”
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  choice: kwamba
  rationale: Katika muktadha wa kiapo unaoendelea kutoka mstari uliotangulia, neno hili linatanguliza maudhui ya tamko la Mungu; msisitizo unabebwa pia na miundo inayofuata.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: hakika nitakubariki
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kamili unasisitiza tendo. ‘Hakika nitakubariki’ ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: na hakika nitauzidisha
  rationale: Marudio ya kimofolojia yanatoa msisitizo mkubwa. ‘Hakika’ hudumisha ulinganifu na kishazi kilichotangulia, huku ‘kuuzidisha uzao’ ikiwa usemi wa asili katika muktadha huu.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: זֶרַע ni nomino ya umoja yenye maana ya kijumla. ‘Uzao’ huhifadhi maana ya kizazi au wazao kwa pamoja bila kuifanya wazi kuwa wingi tu.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: kama nyota za mbinguni
  rationale: Hili ni fumbo la kawaida na lenye hadhi katika Kiswahili, na linahifadhi picha ya maandishi ya Kiebrania.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: na kama mchanga ulio kwenye ufuo wa bahari
  rationale: ‘Ufuo wa bahari’ hutoa kwa njia ya kawaida maana ya שְׂפַת הַיָּם, kihalisi ‘mdomo/ukingo wa bahari,’ huku ‘ulio’ ukiakisi kishazi cha uhusiano אֲשֶׁר עַל.
- source_word: וְיִרַשׁ
  choice: utamiliki
  rationale: יָרַשׁ inaweza kumaanisha kurithi, kutwaa, au kumiliki. Pamoja na ‘lango la adui,’ hapa inadokeza kupata mamlaka au udhibiti.
- source_word: שַׁעַר
  choice: lango
  rationale: Tafsiri ya moja kwa moja huhifadhi tamathali ya kibiblia ambamo lango linawakilisha mamlaka juu ya mji.
- source_word: אֹיְבָיו
  choice: adui zake
  rationale: Kiambishi cha Kiebrania ni cha umoja na kinaafikiana na ‘uzao’ wa kijumla. ‘Adui zake’ huhifadhi rejeo hilo bila kulazimisha uzao kuwa mtu mmoja tu au watu wengi tu.
theological_decisions:
- issue: Umoja wa kijumla wa זֶרַע pamoja na kiambishi cha umoja katika kishazi cha mwisho
  choice: uzao wako … adui zake
  alternative: wazao wako … adui zao
  rationale: Kiebrania kinatumia nomino ya umoja yenye maana ya kijumla na kiambishi cha umoja. Tafsiri hii huhifadhi mvutano kati ya umoja na maana ya kijumla bila kuamua kimbele kwamba rejeo ni mtu mmoja pekee au kundi la wazao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Msisitizo wa miundo miwili ya Kiebrania umeonyeshwa kwa ‘hakika’; ‘uzao’ umechaguliwa ili kuhifadhi umoja wa kijumla. ‘Lango’ limeachwa kama tamathali ya kibiblia badala ya kufafanuliwa kuwa mji au mamlaka.
