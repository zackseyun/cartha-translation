  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: sw
  text: Siku ya tatu, Abrahamu akainua macho yake, akaona mahali pale kwa mbali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Siku ya tatu
  rationale: Hiki ni kirai cha wakati chenye namba ya mpangilio; tafsiri hii ni ya kawaida na haiongezi maneno yasiyokuwamo kama ‘ya safari.’
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: akainua macho yake
  rationale: Inahifadhi nahau ya Kiebrania huku ikiwa Kiswahili cha kawaida na chenye hadhi; ‘akatazama juu’ kingebadili kidogo picha ya usemi.
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi hiki kinaendeleza mfuatano wa simulizi na kwa kawaida humaanisha kuona.
- source_word: הַמָּקוֹם
  choice: mahali pale
  rationale: Nomino ina kibainishi cha ujuzi, ikirejelea mahali palipokwisha kutambulishwa katika muktadha; ‘mahali pale’ ni ya asili zaidi kuliko ‘mahali hapo’ katika sentensi hii.
- source_word: מֵרָחֹק
  choice: kwa mbali
  rationale: Kirai hiki huonyesha umbali; ‘kwa mbali’ ni tafsiri fupi, ya kawaida, na inayolingana na maana ya chanzo.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
