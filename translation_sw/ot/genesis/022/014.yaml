  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: sw
  text: Abrahamu akaliita mahali hapo, “BWANA Ataona”; kama isemwavyo hata leo, “Katika mlima wa BWANA ataonekana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה יִרְאֶה
  choice: BWANA Atatoa
  rationale: Kihalisi ni “YHWH ataona,” lakini katika muktadha wa Mungu kumwandalia Abrahamu kondoo (mst. 8, 13), kitenzi “kuona” hubeba maana ya kuona hitaji na kulishughulikia; “atatoa” huwasilisha maana hiyo kwa Kiswahili cha kawaida huku jina la agano likiwakilishwa kwa desturi ya “BWANA.”
- source_word: בְּהַר יְהוָה יֵרָאֶה
  choice: Katika mlima wa BWANA itatolewa
  rationale: Umbo יֵרָאֶה linaweza kueleweka kihalisi “itaonekana,” lakini msemo huu unaendeleza mchezo wa maneno wa יִרְאֶה na, katika muktadha, wazo la kile kinachotolewa na Mungu. Kauli tendwa isiyo na mtendaji aliyetajwa inahifadhi muundo wa Kiebrania.
- source_word: אֲשֶׁר יֵאָמֵר הַיּוֹם
  choice: Ndiyo maana hata leo husemwa
  rationale: Hutoa kwa Kiswahili cha asili maana ya msemo uliokuwa ukitumika “hadi leo,” bila kumtaja msemaji.
theological_decisions:
- issue: Maana ya mzizi ראה katika jina la mahali na msemo unaofuata
  choice: 'Kutafsiri kwa maana ya utoaji: “Atatoa / itatolewa”'
  alternative: “Ataona / itaonekana”
  rationale: Tafsiri ya utoaji inaungwa mkono na muktadha wa simulizi, hasa kauli ya Abrahamu kwamba Mungu atajipatia mwana-kondoo na kutokea kwa kondoo wa sadaka. Hata hivyo, uchaguzi huu haukusudii kufuta kabisa mchezo wa maneno wa kuona unaopatikana katika Kiebrania.
- issue: Uwakilishi wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni uwakilishi uliozoeleka, wenye heshima, na unaoeleweka sana katika Biblia za Kiswahili, bila kuingiza msimamo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na rahisi kueleweka. Herufi kubwa katika “BWANA” zinaashiria jina יהוה. Nukuu zimehifadhiwa kama jina la mahali na msemo wa jadi.
