base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: sw
  text: Akasema, “Usimnyoshee kijana mkono wako, wala usimtendee jambo lolote, kwa maana sasa ninajua kwamba unamcha Mungu, kwa kuwa hukuninyima[a] mwana wako, mwana wako wa pekee[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukumnyima.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mwana wako, wa pekee wako”; yaani, mwana wako mmoja wa pekee katika muktadha huu wa agano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: usimnyoshee ... mkono wako
  rationale: Nahau ya Kiebrania ina maana ya kunyoosha mkono dhidi ya mtu ili kumdhuru. Kauli hii ya Kiswahili inadumisha taswira ya mkono na katazo la kumdhuru kijana.
- source_word: הַנַּעַר
  choice: kijana
  rationale: Neno נַעַר linaweza kumaanisha mvulana au kijana; “kijana” ni la kawaida na halibani umri wa Isaka kuliko ushahidi wa muktadha.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: usimtendee jambo lolote
  rationale: Hutoa katazo kamili lililo katika מְאוּמָּה, yaani jambo lolote hata kidogo, kwa Kiswahili cha kawaida.
- source_word: עַתָּה יָדַעְתִּי
  choice: sasa ninajua
  rationale: Hufuata moja kwa moja usemi wa Kiebrania na kuhifadhi mvutano wa kitheolojia bila kuufafanua kwa paraphrase.
- source_word: יְרֵא אֱלֹהִים
  choice: unamcha Mungu
  rationale: “Kumcha Mungu” ni usemi wa kawaida na wenye hadhi unaobeba maana ya hofu yenye heshima bila kuifanya kuwa maelezo marefu.
- source_word: חָשַׂכְתָּ
  choice: hukumnyima
  rationale: Kitenzi kina maana ya kuzuia, kunyima, au kutomhifadhi; “hukumnyima” kinaendana vizuri na kishazi kinachofuata na kihusishi cha nafsi ya kwanza.
- source_word: יְחִידְךָ
  choice: mwana wako wa pekee
  rationale: Ingawa kihalisi ni “wa pekee wako,” muktadha humtambulisha wazi kama mwana; urudiaji wa “mwana wako” huhifadhi msisitizo wa apposition ya Kiebrania na ni wazi kwa msomaji wa Kiswahili.
- source_word: מִמֶּנִּי
  choice: kwa ajili yangu
  rationale: Kihalisi מן ni “kutoka kwangu,” lakini katika muundo wa kumnyima mtu kitu, Kiswahili cha asili hutumia “kwa ajili yangu” kueleza kwamba hakumzuia mwanawe asitolewe kwa Mungu. “Hukuninyima” pia lingewezekana, lakini lingeunda mkusanyiko mzito wa viambishi.
theological_decisions:
- issue: Maarifa ya Mungu katika usemi “sasa ninajua”
  choice: Kuhifadhi “sasa ninajua” bila kulainisha
  alternative: sasa nimeona / sasa imedhihirika
  rationale: Kiebrania kinasema wazi “sasa ninajua.” Tafsiri haiondoi mvutano wa usemi huu kuhusu maarifa ya Mungu wala kuamua ikiwa ni lugha ya kibinadamu, ya kimahusiano, au ya aina nyingine.
- issue: Maana ya “mwana wako wa pekee” kuhusu Isaka
  choice: mwana wako, mwana wako wa pekee
  alternative: mwana wako, wa pekee wako
  rationale: Usemi unahifadhi msisitizo wa Kiebrania katika muktadha wa agano bila kudai kwamba Abrahamu hakuwa na mwana mwingine kwa maana yoyote ile.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa sentensi unabaki karibu na Kiebrania, lakini viambishi na vihusishi vimepangwa kwa mtiririko wa kawaida wa Kiswahili.
