base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: sw
  text: Lakini malaika wa Yahweh[a] akamwita Ibrahimu kutoka mbinguni[b] akasema, “Ibrahimu, Ibrahimu!” Naye akasema, “Mimi hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Yahweh.” Neno la Kiebrania מַלְאָךְ linaweza kumaanisha “mjumbe” au “malaika”; hapa, muktadha wa mbinguni unaunga mkono “malaika.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, kihalisi “kutoka katika mbingu”; “kutoka mbinguni” ni usemi wa kawaida wa Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Katika simulizi hili קרא ina maana ya kumwita mtu kwa sauti; “akamwita” ni ya kawaida na haiongezi wazo lisilothibitishwa la kupaza sauti.
- source_word: אֵלָיו
  choice: -mw-
  rationale: Kiwakilishi cha yambwa katika “akamwita” kinaonyesha kwamba mwito ulimwelekea Abrahamu, kwa njia ya asili katika Kiswahili.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאָךְ inaweza kumaanisha mjumbe au malaika; kwa kuwa sauti inatoka mbinguni, “malaika” inafaa zaidi hapa. Jina la agano יְהוָה limetoholewa kuwa “Yahweh” bila kulibadili kuwa cheo.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Ingawa umbo la Kiebrania ni la wingi, “kutoka mbinguni” ndiyo nahau ya kawaida ya Kiswahili na inahifadhi maana ya chanzo cha kimbingu.
- source_word: וַיֹּאמֶר
  choice: na kusema / akasema
  rationale: אמר ni kitenzi cha kawaida cha kusema. Muundo “akamwita ... na kusema” unaepuka uradidi mzito katika kishazi cha kwanza, huku “akasema” ikitumika moja kwa moja kwa jibu la Abrahamu.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: Abrahamu, Abrahamu!
  rationale: Kurudiwa kwa jina kumehifadhiwa ili kuonyesha uzito na uharaka wa mwito.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Hili ni jibu la kawaida la Kiswahili linaloonyesha kuwapo na utayari, sawa na matumizi ya הִנֵּנִי katika simulizi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Iwapo מַלְאַךְ יְהוָה atambulishwe moja kwa moja kuwa udhihirisho wa Yahweh mwenyewe
  choice: malaika wa Yahweh
  alternative: Yahweh mwenyewe katika umbo la malaika / mjumbe wa Yahweh
  rationale: Tafsiri inahifadhi muundo wa Kiebrania bila kuamua kimafundisho utambulisho halisi wa msemaji zaidi ya maneno ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mimi hapa” ni jibu la asili na lenye uzito unaofaa; viunganishi vya simulizi vimewasilishwa kwa mtiririko wa kawaida wa Kiswahili.
