base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: sw
  text: Isaka akamwambia Ibrahimu baba yake, “Baba yangu!” Naye akasema, “Mimi hapa, mwanangu.” Isaka akasema, “Tazama, moto na kuni zipo, lakini kondoo[a] kwa ajili ya sadaka ya kuteketezwa yuko wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha kwa upana mnyama wa kundi, kama kondoo au mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia / akajibu / akauliza
  rationale: Kitenzi cha Kiebrania ni ‘akasema’ katika sehemu zote tatu, lakini Kiswahili cha masimulizi hutumia kwa kawaida ‘akamwambia,’ ‘akajibu,’ na ‘akauliza’ kulingana na kazi ya kila usemi; maana ya mazungumzo haibadilishwi.
- source_word: אָבִיו
  choice: baba yake
  rationale: Huhifadhi uhusiano wa kifamilia kwa lugha ya kawaida na yenye heshima.
- source_word: אָבִי
  choice: Baba yangu!
  rationale: Kiambishi cha nafsi ya kwanza katika Kiebrania kinaonyesha ‘yangu’; alama ya mshangao inaonyesha mwito wa moja kwa moja.
- source_word: הִנֶּנִי
  choice: Mimi hapa
  rationale: Ni usemi wa kawaida wa kujitokeza au kuitikia katika simulizi la Kiebrania; tafsiri hii ni ya asili katika Kiswahili na inadumisha mwangwi wa kifasihi.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Huhifadhi umilikishi na sauti ya upendo ya neno la Kiebrania.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huelekeza fikira kwenye vitu vilivyopo; ‘Tazama’ ni ya sasa, yenye hadhi, na inafaa katika simulizi.
- source_word: הָאֵשׁ וְהָעֵצִים
  choice: moto na kuni zipo
  rationale: ‘Kuni’ ni neno la kawaida la Kiswahili kwa mbao za kuwashia moto. ‘Zipo’ hukamilisha kwa njia ya asili kauli inayoonyesha vitu vilivyo mbele yao.
- source_word: אַיֵּה
  choice: yuko wapi
  rationale: Kondoo ni kiumbe hai, hivyo Kiswahili cha kawaida hutumia ngeli ya A-WA katika swali hili.
- source_word: הַשֶּׂה
  choice: kondoo[a]
  rationale: ‘Kondoo’ ni tafsiri fupi na ya kawaida katika muktadha wa dhabihu, ingawa neno la Kiebrania linaweza kumaanisha kwa upana zaidi mnyama mdogo wa kundi; upana huo umehifadhiwa katika tanbihi.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: Huwasilisha kusudi linaloonyeshwa na לְ na maana ya עֹלָה kama sadaka inayoteketezwa kabisa.
theological_decisions:
- issue: Upeo wa maana ya הַשֶּׂה, mnyama wa dhabihu
  choice: kondoo[a]
  alternative: mnyama mdogo wa kundi, kama mwana-kondoo au mwana-mbuzi
  rationale: Kiebrania hakibainishi bila utata kwamba ni mwana-kondoo pekee. ‘Kondoo’ ni ya kawaida katika mstari, huku tanbihi ikizuia tafsiri isifanye maana kuwa finyu kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa mfululizo wa vitenzi vya masimulizi umehifadhiwa, lakini ‘akajibu’ na ‘akauliza’ zimetumiwa ili mazungumzo yasikike ya asili bila kuondoa maana ya אמר.
