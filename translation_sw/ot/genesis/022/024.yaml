translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yeye pia” unahifadhi msisitizo wa Kiebrania, huku “aliyeitwa” ukiweka sentensi katika mtiririko wa kawaida wa Kiswahili.
