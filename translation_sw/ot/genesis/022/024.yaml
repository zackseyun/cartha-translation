  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: sw
  text: Na suria wake, ambaye jina lake lilikuwa Reuma, naye pia aliwazaa Teba, Gahamu, Tahashi, na Maaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Na suria wake
  rationale: Neno פִּילֶגֶשׁ humaanisha suria au mke wa daraja la pili. “Suria” ni neno fupi la Kiswahili linalodumisha tofauti ya kijamii na kisheria iliyomo katika maandishi.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: aliyeitwa Reuma
  rationale: Kiebrania kinasema kwa uratibu, “na jina lake [lilikuwa] Reuma.” Kiswahili cha kawaida hutumia kwa ufasaha “aliyeitwa Reuma,” bila kubadili mhusika.
- source_word: וַתֵּלֶד
  choice: akawazaa
  rationale: Katika orodha hii ya nasaba, ילד humaanisha kuzaa. Kiambishi cha ngeli ya watu kinaonyesha kuwa watoto waliotajwa ni wengi.
- source_word: גַּם הִוא
  choice: yeye pia
  rationale: Hifadhi kiwakilishi cha wazi הִוא pamoja na msisitizo wa גַּם, ukionyesha kwamba Reuma naye, kama Milka aliyetajwa kabla, alizaa watoto.
- source_word: טֶבַח וְגַּחַם וְתַּחַשׁ וְמַעֲכָה
  choice: Teba, Gahamu, Tahashi, na Maaka
  rationale: Haya ni majina ya watu katika orodha ya waliozaliwa; yametoholewa kwa mwandiko na matamshi yanayofaa Kiswahili.
