base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: sw
  text: Abrahamu akawaambia vijana wake, “Kaeni hapa pamoja na punda. Mimi na kijana tutakwenda kule, tutaabudu[a], na tutarudi kwenu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tutainama.” Kitenzi cha Kiebrania kinaweza kumaanisha kihalisi zaidi kujitupa chini katika ibada.
    reason: lexical_alternative
  - marker: b
    text: Abrahamu anasema, “tutarudi kwenu.” Maandishi hayaelezi ikiwa alikuwa akificha kusudi lake, akitarajia jambo fulani, au akiwa na uhakika kwamba Mungu angeandaa njia.
    reason: alternative_reading
lexical_decisions:
- source_word: נְעָרָיו
  choice: vijana wake
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au mhudumu. Hapa inawahusu wale wanaume wawili walioandamana na Abrahamu; ‘vijana wake’ ni ya asili na pia inadumisha uhusiano wa kileksia na נַעַר inayomtaja Isaka baadaye katika mstari.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: Kaeni hapa
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kukaa, kuishi, au kubaki. Katika agizo hili, ‘Kaeni hapa’ ni Kiswahili cha kawaida kinachowasilisha maana ya kutosonga mbele.
- source_word: עִם הַחֲמוֹר
  choice: pamoja na punda
  rationale: חֲמוֹר ni neno la kawaida la ‘punda’; ‘pamoja na’ linaonyesha wazi kuwa vijana hao walipaswa kubaki mahali hapo wakiwa na punda.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: Mimi na kijana
  rationale: נַעַר hapa inamtaja Isaka. ‘Kijana’ ni pana vya kutosha kutolazimisha umri mdogo sana na inadumisha urudiaji wa neno lililotumiwa kwa wale vijana wengine.
- source_word: נֵלְכָה עַד כֹּה
  choice: tutakwenda kule
  rationale: Muundo huu unaonyesha nia ya kwenda mahali tofauti panapoonyeshwa; ‘kule’ ni usemi wa kawaida wa Kiswahili unaolingana na maana ya deiktiki ya כֹּה.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: tutaabudu
  rationale: שָׁחָה kimsingi ni kuinama au kujitupa chini, mara nyingi kama tendo la ibada. Katika muktadha wa dhabihu, ‘tutaabudu’ huwasilisha maana kuu, huku maana halisi zaidi ikiwekwa katika tanbihi.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: kisha tutarudi kwenu
  rationale: שׁוּב humaanisha kurudi, na nafsi ya kwanza wingi imehifadhiwa katika ‘tutarudi.’ ‘Kisha’ huwasilisha kwa kawaida mfuatano unaounganishwa na וְ bila kubadili mhusika wa wingi.
theological_decisions:
- issue: Kitenzi cha wingi katika kauli ya Abrahamu kuhusu kurudi
  choice: 'Kudumisha maana ya wazi ya wingi: ‘tutarudi kwenu.’'
  alternative: Kuitafsiri kama kuficha kusudi lake kimakusudi, au kama tangazo la imani kwamba Abrahamu na Isaka wote wawili wangerudi.
  rationale: Kiebrania kinatumia nafsi ya kwanza wingi kwa kuabudu na kwa kurudi. Tafsiri inadumisha kauli hiyo bila kuamua ikiwa Abrahamu alikuwa akificha kusudi lake, akitarajia Mungu atoe njia, au akisema kwa imani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida; urudiaji wa ‘kijana/vijana’ na wingi wa ‘tutarudi’ umehifadhiwa ili kuakisi maandishi ya Kiebrania.
