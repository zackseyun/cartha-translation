lexical_decisions:
- source_word: ע֥וּץ
  choice: Uzi
  rationale: Jina limetoholewa kwa namna ya kawaida na inayosomeka kwa Waswahili, huku likiwakilisha jina la Kiebrania עוּץ.
- source_word: בְּכֹר֖וֹ
  choice: mzaliwa wake wa kwanza
  rationale: Neno בְּכוֹר linaonyesha mwana wa kwanza kwa mpangilio wa kuzaliwa; tafsiri hii inalinda maana hiyo ya nasaba.
- source_word: בּ֣וּז
  choice: Buzi
  rationale: Jina limetoholewa kwa matamshi na umbo linalofaa Kiswahili.
- source_word: אָחִ֑יו
  choice: ndugu yake
  rationale: Ni tafsiri ya moja kwa moja ya uhusiano wa kindugu. Kiwakilishi 'yake' pia hakilazimishi kufafanua zaidi rejeleo ambalo muktadha wa orodha unatoa.
- source_word: קְמוּאֵ֖ל
  choice: Kemueli
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: אֲבִ֥י
  choice: baba wa
  rationale: Hii ndiyo maana ya moja kwa moja katika kifungu cha nasaba, bila kuondoa uwezekano kwamba 'baba' hapa inaweza kumaanisha babu wa ukoo au mwanzilishi wa jamii.
- source_word: אֲרָֽם
  choice: Aramu
  rationale: Jina limetoholewa bila kulifasiri kuwa eneo au taifa, kwa kuwa matini yenyewe inatoa jina tu.
theological_decisions:
- issue: Maana ya kinasaba ya אֲבִי אֲרָם
  choice: Kemueli, baba wa Aramu
  alternative: Kemueli, babu wa ukoo wa Aramu
  rationale: Kiebrania kinasema moja kwa moja 'baba wa Aramu.' Hata hivyo, katika nasaba neno 'baba' wakati mwingine humaanisha babu wa ukoo au mwanzilishi; matini kuu inadumisha usemi wa moja kwa moja, na uwezekano mpana unaelezwa katika tanbihi.
