lexical_decisions:
- source_word: כֶּשֶׂד
  choice: Kesedi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku sauti kuu za jina la Kiebrania zikihifadhiwa.
- source_word: חֲזוֹ
  choice: Hazo
  rationale: Jina la mtu limetoholewa moja kwa moja; herufi ya mwanzo imetolewa kama H kwa tahajia rahisi na ya kawaida ya Kiswahili.
- source_word: פִּלְדָּשׁ
  choice: Pildashi
  rationale: Jina la mtu limetoholewa, na vokali ya mwisho imeongezwa ili muundo wenye konsonanti ya mwisho usomeke kwa urahisi katika Kiswahili.
- source_word: יִדְלָף
  choice: Yidlafu
  rationale: Y imetumiwa kuwakilisha yod ya mwanzo kwa uaminifu wa kifonetiki; vokali ya mwisho hurahisisha matamshi ya Kiswahili.
- source_word: בְּתוּאֵל
  choice: Bethueli
  rationale: Tahajia hii inafuata umbo la jina lililozoeleka katika Biblia za Kiswahili na kulifanya lisomeke kiasili.
- source_word: וְאֶת / וְאֵת
  choice: na
  rationale: אֵת ni kiashiria cha yambwa na hakihitaji kutafsiriwa; וְ limetolewa kwa uratibu wa orodha kwa koma na 'na' kabla ya jina la mwisho.
