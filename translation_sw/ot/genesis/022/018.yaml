  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: sw
  text: Na katika uzao wako mataifa yote ya dunia yatabarikiwa[a], kwa sababu umetii sauti yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yatajibariki.” Kitenzi cha Kiebrania hapa kinaweza kueleweka kwa maana ya kujirejelea.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: yatabarikiwa
  rationale: Kauli ya Hitpael ya ברך katika ahadi hii inaweza kueleweka kwa maana ya kupokea baraka, huku uwezekano wa maana ya kujirejelea ukihifadhiwa katika tanbihi.
- source_word: בְזַרְעֲךָ
  choice: katika uzao wako
  rationale: Uzao ni nomino ya kijumla inayoweza kumaanisha mtoto au wazao; 'katika' huhifadhi kwa kadiri iwezekanavyo kutokubainishwa kwa kiambishi ב bila kukilazimisha kuwa cha njia au wakala.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: mataifa yote ya dunia
  rationale: '''Mataifa'' ndiyo maana ya kawaida ya גוים, na ''ya dunia'' huonyesha upeo wa ulimwengu mzima katika muktadha huu.'
- source_word: עֵקֶב אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinaonyesha sababu ya kuthibitishwa kwa ahadi, na 'kwa sababu' ni Kiswahili cha kawaida na sahihi.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: umeitii sauti yangu
  rationale: Nahau ya Kiebrania ina maana ya kusikia kunakoleta utiifu; tafsiri hii huhifadhi pia taswira ya 'sauti yangu'.
theological_decisions:
- issue: Maana ya kitenzi cha ahadi kutoka ברך katika muundo wa Hitpael
  choice: Mataifa yanaelezwa kuwa yatapokea baraka katika uzao wa Abrahamu ('yatabarikiwa').
  alternative: Mataifa 'yatajibariki' katika uzao wa Abrahamu, yaani yatatumia uzao huo kama mfano au kauli ya kujitakia baraka.
  rationale: Muktadha wa agano unaunga mkono maana ya kupokea baraka, bila kuingiza hitimisho la baadaye la kimafundisho ndani ya mstari. Kwa kuwa muundo wa Kiebrania unaweza pia kueleweka kwa maana ya kujirejelea, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. 'Uzao' umechaguliwa ili kuhifadhi maana ya kijumla ya זרע, na sentensi imeweka ukaribu na muundo wa Kiebrania bila kuwa ngumu.
