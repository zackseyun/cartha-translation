  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: sw
  text: Kisha Abrahamu akanyoosha mkono wake, akachukua kisu ili amchinje mwanawe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kilichotafsiriwa “amchinje” ni mahususi zaidi kuliko neno la jumla “amuue,” na kinaweza kuwa na maana inayohusiana na dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akaunyosha
  rationale: Katika muktadha huu kitenzi kinamaanisha kunyoosha mkono kuelekea kitu, si kutuma; ‘akaunyosha’ ni Kiswahili cha kawaida na huhifadhi tendo halisi.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Tafsiri ya moja kwa moja ya nomino ya umoja yenye kiambishi cha umilikaji.
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi hiki cha kawaida kinaendeleza mfuatano wa simulizi bila kuongeza wazo la kukamata kwa nguvu.
- source_word: הַמַּאֲכֶלֶת
  choice: kisu
  rationale: Nomino inataja chombo cha kukatia kilichotumiwa kuchinja; ‘kisu’ ni neno wazi na la kawaida katika Kiswahili.
- source_word: לִשְׁחֹט
  choice: ili amchinje
  rationale: ‘Kuchinja’ ni mahususi kuliko ‘kuua’ na huhifadhi uzito wa tendo pamoja na uwezekano wa maana ya dhabihu.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Tafsiri fupi na ya kawaida ya nomino yenye kiambishi cha umilikaji.
- source_word: וַ
  choice: Kisha / aka-
  rationale: ‘Kisha’ na viambishi vya mfululizo ‘aka-’ vinaonyesha mwendelezo wa matukio katika simulizi kwa Kiswahili cha asili.
theological_decisions:
- issue: Iwapo שָׁחַט itafsiriwe kwa neno lenye maana inayoweza kuhusishwa na dhabihu
  choice: ili amchinje
  alternative: ili amuue
  rationale: ‘Kuchinja’ hudumisha umahususi wa kitenzi cha Kiebrania na nguvu ya muktadha wa dhabihu bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Muundo ‘aka-’ umetumiwa kuonyesha mfuatano wa haraka wa vitendo; ‘mwanawe’ ni wa kawaida na unaeleweka kwa urahisi.
