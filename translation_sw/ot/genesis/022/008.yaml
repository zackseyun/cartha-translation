base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: sw
  text: Abrahamu akasema[a], “Mungu atajipatia mwana-kondoo kwa ajili ya sadaka ya kuteketezwa, mwanangu.” Basi hao wawili wakaendelea kwenda pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kiebrania, “Mungu ataona kwa ajili yake mwana-kondoo kwa ajili ya sadaka ya kuteketezwa.” Kitenzi cha Kiebrania kwa msingi humaanisha “kuona,” lakini katika msemo huu kinaweza kumaanisha “kupatia” au “kuandaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa simulizi wenye waw unaendeleza tukio; “akasema” ni wa kawaida katika simulizi la Kiswahili na unaonyesha mwendelezo bila kuongeza tafsiri ya wakati.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ni kisawe cha kawaida na cha asili cha neno la Kiebrania katika kauli ya Abrahamu.
- source_word: יִרְאֶה לּוֹ
  choice: atajipatia mwenyewe
  rationale: Kitenzi ראה maana yake ya msingi ni “kuona,” lakini hapa kimetumiwa kiidioma kwa maana ya kuona kwamba kitu kinapatikana, yaani kukipatia. “Atajipatia mwenyewe” kinahifadhi pia kiwakilishi לּוֹ, ingawa ufafanuzi wa maana halisi umewekwa katika tanbihi.
- source_word: הַשֶּׂה
  choice: mwana-kondoo
  rationale: שֶׂה humaanisha mnyama mmoja wa kundi dogo, kondoo au mbuzi, mara nyingi mchanga. “Mwana-kondoo” ni usemi wa asili katika muktadha huu wa dhabihu na unaendana na swali lililotangulia.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya dhabihu inayoteketezwa yote; tafsiri hii ni wazi na inahifadhi lugha ya ibada.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Inahifadhi uhusiano wa kifamilia na sauti ya upendo katika namna ya kumwita Isaka moja kwa moja.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: Basi hao wawili wakaendelea kwenda pamoja
  rationale: Inahifadhi mkazo wa Kiebrania kwamba wote wawili walikuwa pamoja, huku “wakaendelea kwenda” ikionyesha mwendelezo wa safari kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana ya kauli ya Abrahamu kuhusu tendo la Mungu
  choice: Mungu atajipatia mwenyewe mwana-kondoo
  alternative: Mungu atajionea mwenyewe mwana-kondoo / Mungu ataona kwamba mwana-kondoo anapatikana
  rationale: Katika muktadha huu, kitenzi cha “kuona” kinaweza kutumiwa kiidioma kwa maana ya kupatia. Kutaja “mwenyewe” kunawakilisha לּוֹ bila kudai kwamba Abrahamu alikuwa akikwepa swali au akitoa unabii; hivyo mvutano wa simulizi unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Sadaka ya kuteketezwa” imetumiwa kama istilahi iliyo wazi ya dhabihu inayoteketezwa yote; urudiaji wa “hao wawili ... pamoja” umehifadhiwa kwa ajili ya mkazo wa simulizi.
