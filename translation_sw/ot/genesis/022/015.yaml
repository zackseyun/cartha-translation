  text: וַ/יִּקְרָ֛א מַלְאַ֥ךְ יְהוָ֖ה אֶל אַבְרָהָ֑ם שֵׁנִ֖ית מִן הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/015.yaml
  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: sw
  text: Malaika wa Yahweh akamwita Abrahamu mara ya pili kutoka mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mjumbe wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Kitenzi katika mfuatano wa kisimulizi kinaendeleza tukio kwa wakati uliopita; ‘akamwita’ ni ya kawaida na haiongezi wazo la kupaza sauti.
- source_word: מַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  rationale: מַלְאָךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika’; katika kauli hii kuhusu kiumbe wa mbinguni, ‘malaika’ ni tafsiri ya kawaida, huku jina la Mungu likihifadhiwa kama Yahweh.
- source_word: אֶל אַבְרָהָם
  choice: akamwita Abrahamu
  rationale: אֶל humtambulisha anayeelekezewa mwito; katika Kiswahili kiambishi cha yambwa ‘-mw-’ pamoja na jina Abrahamu huwasilisha maana hiyo kwa kawaida.
- source_word: שֵׁנִית
  choice: mara ya pili
  rationale: Huhifadhi kwa wazi maana ya mpangilio wa pili badala ya kutumia tu ‘tena’.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Ingawa umbo la Kiebrania ni la wingi, ‘kutoka mbinguni’ ndiyo nahau ya kawaida ya Kiswahili kwa mahali pa kimungu katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya מַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  alternative: Mjumbe wa Yahweh
  rationale: ‘Malaika’ inafaa kwa muktadha wa mjumbe wa mbinguni, lakini tanbihi inahifadhi uwezekano wa kileksika wa ‘mjumbe’ bila kuamua kama mhusika ni kiumbe aliyeumbwa au udhihirisho maalumu wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisimulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘akamwita Abrahamu’ ni wa asili zaidi kuliko ‘aliita kwa Abrahamu,’ na ‘mara ya pili’ huhifadhi usahihi wa Kiebrania.
