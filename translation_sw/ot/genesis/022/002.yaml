  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: sw
  text: Akasema, “Tafadhali, mchukue mwanao, mwana wako wa pekee[a], unayempenda—Isaka—uende katika nchi ya Moria, ukamtoe huko kuwa sadaka ya kuteketezwa juu ya mmoja wa milima nitakayokuambia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wako aliye wa kipekee.” Neno la Kiebrania יְחִידְךָ linaweza kusisitiza aliye mmoja tu au aliye na nafasi ya pekee; hapa linakazia hadhi ya pekee ya Isaka katika amri hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: Tafadhali
  rationale: Chembe hii huonyesha ombi au msisitizo wa kiungwana pamoja na amri; ‘tafadhali’ ni Kiswahili cha sasa na cha kawaida, bila kuipa maana ya wakati kama ‘sasa’.
- source_word: בִּנְךָ
  choice: mwanao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya בן pamoja na kiambishi cha nafsi ya pili umoja.
- source_word: יְחִידְךָ
  choice: mwana wako wa pekee
  rationale: יָחִיד inaweza kumaanisha aliye mmoja tu au wa pekee. Katika Kiswahili, ‘mwana wako wa pekee’ huhifadhi msisitizo wa hadhi ya Isaka bila kufafanua kimya kimya kama upekee huo ni wa kibayolojia, wa agano, au wa kimahusiano.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: unayempenda
  rationale: Hali ya upendo unaojulikana inaelezwa kwa kawaida katika Kiswahili kwa wakati wa sasa.
- source_word: וְלֶךְ לְךָ
  choice: uende
  rationale: Muundo wa Kiebrania unaonyesha kuondoka kwa mhusika mwenyewe; ‘uende’ ni wa asili na haongezi msisitizo usio wa lazima.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: nchi ya Moria
  rationale: אֶרֶץ inaweza kuwa nchi au eneo; ‘nchi ya Moria’ ni tafsiri ya moja kwa moja na inayotambulika.
- source_word: וְהַעֲלֵהוּ
  choice: ukamtoe huko
  rationale: Katika muktadha wa dhabihu pamoja na לְעֹלָה, Hiphil ya עלה humaanisha kumtoa kama dhabihu. ‘Ukamtoe’ huwasilisha tendo hilo kwa Kiswahili cha kawaida.
- source_word: לְעֹלָה
  choice: kuwa sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya dhabihu inayoteketezwa; chaguo hili linaweka wazi aina ya sadaka bila kupunguza uzito wa amri.
- source_word: עַל אַחַד הֶהָרִים
  choice: juu ya mmoja wa milima
  rationale: הַר kwa kawaida ni mlima, na kifungu kinaonyesha mlima mmoja miongoni mwa milima kadhaa.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: nitakayokuambia
  rationale: אמר pamoja na mtendewa hapa ni ‘kukuambia’; tafsiri hii ni ya asili na haiingizi kitenzi tofauti kama ‘kuonyesha’.
theological_decisions:
- issue: Maana ya יְחִידְךָ kuhusu Isaka licha ya kuwepo kwa Ishmaeli
  choice: mwana wako wa pekee
  alternative: mwanao wa pekee kabisa; mwanao wa kipekee
  rationale: Chaguo hili huhifadhi msisitizo wa Kiebrania kuhusu nafasi ya pekee ya Isaka katika amri na uhusiano wa Abrahamu, bila kudai kwamba Abrahamu hakuwa na mwana mwingine. Tanbihi inaeleza upana wa maana badala ya kuamua kama upekee ni wa kibayolojia, wa agano, au wa kimahusiano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa ‘mwanao, mwana wako wa pekee, unayempenda—Isaka—’ umehifadhi mkusanyiko wa misisitizo wa Kiebrania. ‘Sadaka ya kuteketezwa’ imetumiwa kama istilahi wazi ya ibada.
