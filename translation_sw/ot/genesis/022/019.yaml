  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: sw
  text: Kisha Abrahamu akarudi kwa vijana wake[a]. Wakaondoka, wakaenda pamoja mpaka Beer-sheba, naye Abrahamu akaishi Beer-sheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Abrahamu akarudi kwa vijana wake.” Isaka hatajwi katika kishazi hiki, ingawa alikuwapo katika simulizi lililotangulia.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika mfuatano huu wa masimulizi humaanisha kurudi; ‘akarudi’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: נְעָרָיו
  choice: vijana wake
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au mhudumu. ‘Vijana wake’ huhifadhi maana ya msingi bila kufafanua kupita kiasi hadhi yao, ingawa muktadha unaonyesha kuwa ndio watumishi waliokuwa wameandamana naye.
- source_word: וַיָּקֻמוּ
  choice: wakaondoka
  rationale: קום katika masimulizi mara nyingi huashiria kuanza kutenda au kuondoka. ‘Wakaondoka’ ni Kiswahili cha kawaida kinachoendeleza tendo kwa ufasaha bila ulazima wa kueleza kusimama kimwili.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: wakaenda pamoja
  rationale: הלך pamoja na יַחְדָּו huonyesha kwenda kwa pamoja; tafsiri hii ni wazi na haiongezi namna maalumu ya kusafiri.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-sheba
  rationale: Jina la mahali limenukuliwa kwa tahajia inayotambulika katika Kiswahili badala ya kutafsiriwa maana yake.
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: ישב inaweza kumaanisha kukaa au kuishi mahali. Katika muktadha wa mahali pa makazi, ‘akaishi’ ni ya kawaida na haidokezi lazima kwamba ndipo alipoanzisha makazi mapya.
theological_decisions:
- issue: Abrahamu peke yake ndiye anayetajwa kurudi kutoka mlimani, ingawa Isaka alikuwapo katika simulizi lililotangulia.
  choice: Kutafsiri mstari kama ulivyo bila kumwongeza Isaka katika maandishi makuu.
  alternative: Kusema au kudokeza wazi kwamba Abrahamu na Isaka walirudi pamoja.
  rationale: Kiebrania kinamtaja Abrahamu tu kuwa ndiye aliyerudi kwa vijana wake. Tafsiri inahifadhi ukimya huo na mvutano wa simulizi bila kuupatanisha kwa kuongeza jambo lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi vya masimulizi umetolewa kwa viambishi vya ‘-ka-’ ili maandishi yasomeke kwa kawaida; tafsiri haiongezi Isaka kwenye kishazi ambacho Kiebrania hakimtaji.
