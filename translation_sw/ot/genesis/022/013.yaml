  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: sw
  text: Ndipo Abrahamu akainua macho yake, akatazama, na tazama, nyuma yake[a] kulikuwa na kondoo dume aliyenaswa kichakani kwa pembe zake. Abrahamu akaenda, akamchukua huyo kondoo dume na kumtoa kuwa sadaka ya kuteketezwa badala ya mwanawe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyuma,” bila kutaja wazi “yake”; neno la Kiebrania אַחַר hapa linaeleweka na watafsiri wengi kama kielezi cha mahali.
    reason: lexical_alternative
  - marker: b
    text: Au “mahali pa mwanawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: akainua macho yake
  rationale: Inahifadhi nahau ya Kiebrania ya kuinua mtazamo, huku ikieleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: וַיַּרְא
  choice: akatazama
  rationale: Inaonyesha tendo la kuelekeza macho baada ya kuyainua na kuandaa ufunuo unaofuata.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Inahifadhi kazi ya kishazi cha Kiebrania cha kuvuta uangalifu wa msomaji kwa jambo linaloonekana ghafla katika simulizi.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Ni neno la kawaida na sahihi kwa kondoo wa kiume aliyekomaa katika muktadha wa dhabihu.
- source_word: אַחַר
  choice: nyuma yake
  rationale: Katika muktadha huu linaeleweka vyema kama kielezi cha mahali. Kiwakilishi “yake” kimeongezwa kwa ufasaha wa Kiswahili, ingawa hakitajwi wazi katika maandishi ya konsonanti.
- source_word: נֶאֱחַז
  choice: aliyenaswa
  rationale: Linaonyesha hali ya kondoo dume kuwa amekwama au ameshikwa bila hiari.
- source_word: בַּסְּבַךְ
  choice: kichakani
  rationale: Ni tafsiri ya kawaida ya mahali penye vichaka vilivyosongamana ambako mnyama angeweza kunaswa.
- source_word: בְּקַרְנָיו
  choice: kwa pembe zake
  rationale: Inaonyesha kwamba pembe ndizo sehemu zilizoshikwa na kichaka.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: kumtoa kuwa sadaka ya kuteketezwa
  rationale: Inawasilisha kwa Kiswahili cha kawaida maana ya tendo la dhabihu nzima ya kuteketezwa.
- source_word: תַּחַת בְּנוֹ
  choice: badala ya mwanawe
  rationale: 'Kihusishi hapa kinaonyesha wazi ubadilishanaji: kondoo dume alitolewa mahali pa mwana wa Abrahamu.'
theological_decisions:
- issue: Maana ya ubadilishanaji katika תַּחַת בְּנוֹ
  choice: badala ya mwanawe
  alternative: mahali pa mwanawe
  rationale: Maneno ya Kiebrania yanaonyesha kwamba kondoo dume alichukua nafasi ya mwana katika tendo hili la dhabihu. Tafsiri inahifadhi maana hiyo bila kuongeza ufafanuzi wa kimafundisho usiotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisasa. Nahau “akainua macho yake” na kishazi “na tazama” vinahifadhi ladha ya simulizi la Kiebrania bila kufanya mstari kuwa mgumu kueleweka. Istilahi “sadaka ya kuteketezwa” imetumiwa kwa uwazi na ulinganifu wa kibiblia.
