  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: sw
  text: Naye Bethueli akamzaa Rebeka. Hao wanane Milka alimzalia Nahori[a], ndugu yake Abrahamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo rasmi zaidi: “Hao ndio wale wanane ambao Milka alimzalia Nahori, ndugu yake Abrahamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְתוּאֵל
  choice: Naye Bethueli
  rationale: Kiunganishi ו kinaendeleza orodha ya ukoo; “Naye” ni mwendelezo wa asili katika Kiswahili. Jina limetolewa kwa umbo la Kiswahili lililozoeleka.
- source_word: יָלַד
  choice: akamzaa
  rationale: Kwa kuwa mtendaji ni mwanamume, kitenzi hiki kwa ufupi kinaeleza kuwa Bethueli alikuwa baba wa Rebeka; pia kinadumisha mtindo wa nasaba.
- source_word: אֶת רִבְקָה
  choice: Rebeka
  rationale: אֶת ni alama ya yambwa mahsusi na haitafsiriwi kama neno tofauti. Jina limetolewa kwa tahajia ya Kiswahili iliyozoeleka.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: Hao wanane
  rationale: Usemi huu unahifadhi msisitizo wa Kiebrania juu ya jumla ya watu wanane waliotajwa, bila kuongeza neno “watoto” ambalo halipo wazi katika maandishi.
- source_word: יָלְדָה
  choice: alimzalia
  rationale: Kwa Milka kama mtendaji wa kike na Nahori kama mhusika anayeletwa na לְ, “alimzalia” ni usemi wa kawaida wa Kiswahili katika taarifa ya ukoo.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: לְ/נָחוֹר
  choice: Nahori
  rationale: Kiambishi tamati -i katika “alimzalia Nahori” huwasilisha uhusiano unaoonyeshwa na לְ kwa Kiswahili cha kawaida.
- source_word: אֲחִי אַבְרָהָם
  choice: ndugu yake Abrahamu
  rationale: Kirai cha uhusiano kinamtambulisha Nahori kuwa ndugu wa Abrahamu kwa lugha ya kawaida na iliyo wazi.
