base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: sw
  text: Ibrahimu akaamka asubuhi na mapema, akamtia punda wake tandiko, akawachukua pamoja naye vijana wake wawili[a] na Isaka, mwanawe, akapasua kuni kwa ajili ya sadaka ya kuteketezwa, kisha akainuka, akaenda mahali Mungu alipokuwa amemwambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wake wawili” au “wasaidizi wake wawili”; neno la Kiebrania נְעָרִים linaweza kumaanisha vijana au wanaume wanaohudumu kama watumishi au wasaidizi, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: Abraham akaamka asubuhi na mapema
  rationale: Kitenzi kinaonyesha kuamka mapema, na msemo huu ni wa kawaida katika Kiswahili huku ukihifadhi msisitizo wa simulizi.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: akamwekea punda wake matandiko
  rationale: חבש hapa ni kumwandaa punda kwa safari kwa kumwekea matandiko au vifaa; tafsiri hii ni wazi na ya kawaida kuliko matumizi yenye utata ya 'kumtandika'.
- source_word: שְׁנֵי נְעָרָיו
  choice: vijana wake wawili
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au msaidizi. 'Vijana wake wawili' huhifadhi maana ya msingi bila kuamua kwa lazima hadhi yao ya kiutumishi.
- source_word: יִצְחָק בְּנוֹ
  choice: Isaka mwanawe
  rationale: Inahifadhi mpangilio wa Kiebrania na kukazia uhusiano wa Isaka na Abraham.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: akapasua kuni kwa ajili ya sadaka ya kuteketezwa
  rationale: בקע ni kupasua, na עֹלָה ni aina maalumu ya sadaka inayoteketezwa; muundo huu unasikika kwa kawaida katika Kiswahili.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: kisha akainuka, akaenda
  rationale: Vitenzi vyote viwili vya mfululizo vimehifadhiwa ili kudumisha mwendo na mpangilio wa simulizi la Kiebrania.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: mahali ambapo Mungu alikuwa amemwambia
  rationale: Wakati timilifu uliopita unaonyesha kuwa maelekezo yalitangulia safari, bila kuongeza maelezo yasiyosemwa moja kwa moja katika mstari huu.
theological_decisions:
- issue: Tafsiri ya neno la dhabihu עֹלָה
  choice: sadaka ya kuteketezwa
  alternative: sadaka nzima ya kuteketezwa
  rationale: Hili ni neno la kawaida na linaloeleweka kwa aina hii ya sadaka, bila kuingiza ufafanuzi wa kiteolojia ulio nje ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Maandiko. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja, yaani “vijana wake wawili”.
