base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: sw
  text: Basi Abrahamu akachukua kuni kwa ajili ya sadaka ya kuteketezwa, akamtwika mwanawe Isaka kuni hizo. Kisha akachukua moto na kisu mkononi mwake, nao wawili wakaendelea kutembea pamoja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: kuni kwa ajili ya sadaka ya kuteketezwa
  rationale: Muundo wa Kiebrania ni ‘kuni za sadaka ya kuteketezwa’; Kiswahili cha ‘kwa ajili ya’ kinaeleza kwa kawaida matumizi ya kuni huku kikihifadhi aina ya sadaka.
- source_word: וַיָּשֶׂם עַל
  choice: akamtwika
  rationale: Kitenzi hiki pamoja na kihusishi kina maana ya kuweka juu ya mtu; ‘akamtwika’ ni cha kawaida na kinaonyesha wazi mzigo aliowekewa Isaka.
- source_word: יִצְחָק בְּנוֹ
  choice: mwanawe Isaka
  rationale: Hili ni fumbo la kawaida la Kiswahili linalohifadhi uhusiano uliosisitizwa na maandishi.
- source_word: בְּיָדוֹ
  choice: mkononi
  rationale: Linawakilisha moja kwa moja umoja wa ‘katika mkono wake’ kwa usemi wa kawaida wa Kiswahili.
- source_word: הָאֵשׁ
  choice: moto
  rationale: Chanzo kinasema tu ‘moto’ bila kubainisha chombo au namna moto ulivyobebwa, hivyo tafsiri haiongezi maelezo.
- source_word: הַמַּאֲכֶלֶת
  choice: kisu
  rationale: Neno humaanisha kisu cha kuchinjia, lakini ‘kisu’ ni wazi na cha kawaida; muktadha wa sadaka unadokeza matumizi yake.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: nao wawili ... pamoja
  rationale: Kauli hii inahifadhi msisitizo wa kwamba wote wawili walikuwa pamoja.
- source_word: וַיֵּלְכוּ
  choice: wakaendelea kutembea
  rationale: Kitenzi kinaweza kumaanisha kwenda au kutembea; ‘wakaendelea kutembea’ kinafaa kwa mwendo unaoendelea katika simulizi.
theological_decisions:
- issue: Istilahi ya dhabihu katika עֹלָה
  choice: sadaka ya kuteketezwa
  alternative: sadaka ya kupaa
  rationale: Katika muktadha huu neno hilo ni istilahi ya dhabihu iliyoteketezwa kabisa; ‘sadaka ya kuteketezwa’ huwasilisha aina hiyo ya ibada bila kulazimisha maana ya kietimolojia ya ‘kupaa’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. ‘Akamtwika’ limetumiwa kwa ufupi na kwa picha halisi ya mzigo; ‘yeye mwenyewe’ linaweka wazi kwamba Abrahamu ndiye aliyebeba moto na kisu bila kuongeza jambo lisilokuwapo katika chanzo.
