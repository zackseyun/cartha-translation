  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: sw
  text: Jitengenezee safina kwa mbao za goferi[a]. Tengeneza vyumba[b] ndani ya safina, na uipake lami ndani na nje[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao za msunobari.” Neno la Kiebrania lililotafsiriwa “goferi” linapatikana hapa tu, kwa hiyo aina hasa ya mti haijulikani.
    reason: lexical_alternative
  - marker: b
    text: Au “sehemu zilizogawanywa”; kwa maana halisi, “viota.”
    reason: lexical_alternative
  - marker: c
    text: Au “uifunike” au “uizibe … kwa lami.” Kiebrania hutumia maneno yenye mzizi mmoja kwa tendo la kupaka na kwa nyenzo ya kupaka; nyenzo hiyo inaweza pia kuitwa lami asilia au bitumeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּבַת
  choice: safina
  rationale: Katika simulizi hili neno linamaanisha chombo kikubwa cha kuokolea watu na wanyama majini. “Safina” ni neno la Kiswahili lililozoeleka kwa chombo cha Nuhu, ingawa neno la Kiebrania si neno la kawaida linalomaanisha meli.
- source_word: עֲצֵי גֹפֶר
  choice: mbao za goferi
  rationale: Aina hasa ya mti unaoitwa גֹפֶר haijulikani kwa uhakika na neno hilo linapatikana hapa tu katika Biblia ya Kiebrania. Kutoholewa kwa jina hilo huepuka kulifanya dhana ya “msunobari” au aina nyingine ionekane kuwa ya hakika.
- source_word: קִנִּים
  choice: vyumba
  rationale: Maana halisi inahusiana na “viota,” lakini hapa inaelekea kumaanisha nafasi zilizogawanywa ndani ya safina. “Vyumba” ni ya kawaida na inaeleweka, huku tanbihi ikihifadhi taswira halisi na uwezekano wa “sehemu zilizogawanywa.”
- source_word: וְכָפַרְתָּ
  choice: uipake
  rationale: Katika muktadha huu kitenzi kinamaanisha kufunika au kupaka kitu kwa tabaka la kinga. Kwa kuwa nyenzo inayofuata ni lami, “uipake” ni usemi wa asili na wazi wa Kiswahili.
- source_word: בַּכֹּפֶר
  choice: lami
  rationale: Neno linataja nyenzo ya kupaka ili kuzuia maji kupenya. “Lami” ni neno linaloeleweka kwa urahisi, huku tanbihi ikionyesha kuwa lami asilia au utomvu mzito wa aina fulani unaweza kukusudiwa.
- source_word: מִבַּיִת וּמִחוּץ
  choice: ndani na nje
  rationale: Jozi hii ya virai inaonyesha kuwa nyuso zote za ndani na za nje zilipaswa kupakwa; tafsiri hii ni sahihi na ya kawaida katika Kiswahili.
- source_word: עֲשֵׂה לְךָ
  choice: Jitengenezee
  rationale: Umbo hili linaonyesha kutengeneza kwa ajili yako mwenyewe. “Jitengenezee” huhifadhi maana hiyo kwa Kiswahili cha kawaida bila kulazimisha kitenzi mahususi zaidi kama “jenga.”
- source_word: תַּעֲשֶׂה אֶת־הַתֵּבָה
  choice: Tengeneza vyumba ndani ya safina
  rationale: Mpangilio wa Kiebrania ni mgumu kuhamishwa moja kwa moja, takribani “viota/vyumba utaifanya safina.” Urekebishaji huu mdogo unaeleza kwa kawaida kuwa nafasi hizo zinapaswa kutengenezwa ndani ya safina.
