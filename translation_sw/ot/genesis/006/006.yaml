  source_fidelity: 'Tafsiri inahifadhi vipengele vya msingi vya Kiebrania: Yahwe ndiye mtenda; וַיִּנָּחֶם imetafsiriwa kwa “akajuta” kwa nguvu ya majuto kuhusu tendo lililopita; הָאָדָם imetolewa kwa maana ya kijumla kupitia “mwanadamu”; na וַיִּתְעַצֵּב pamoja na אֶל־לִבּוֹ imetolewa kwa “akaumia moyoni mwake.” Mpangilio wa vitenzi viwili—majuto, kisha maumivu ya ndani—umehifadhiwa.'
