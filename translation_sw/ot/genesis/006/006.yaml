source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: sw
  text: Yahwe akajuta kwamba alikuwa amemfanya mwanadamu duniani,[a][b] naye akaumia moyoni mwake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanadamu” au “jamii ya binadamu.” Neno la Kiebrania ’adam hapa linarejelea jamii yote ya binadamu.
    reason: lexical_alternative
  - marker: b
    text: Au “alihuzunika kwa kuwa alikuwa amemfanya.” Kitenzi cha Kiebrania נחם katika muundo huu huonyesha majuto au huzuni kuhusu tendo lililotangulia; chenyewe hakisemi kwamba Mungu alishangazwa, hakujua yatakayotokea, au alifanya kosa la kimaadili.
    reason: lexical_alternative
  - marker: c
    text: Au “moyo wake ukaumia.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: akajuta
  rationale: Nifali ya נחם pamoja na kishazi kinachotaja tendo lililotangulia huonyesha majuto au huzuni kuhusu tendo hilo. “Akajuta” huhifadhi nguvu hiyo ya kutazama nyuma, bila kuongeza wazo kwamba Yahwe alishangazwa, hakujua yatakayotokea, au alifanya kosa la kimaadili. Kitenzi kinachofuata hutaja maumivu tofauti.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa moja kwa moja wa jina la Mungu YHWH unaotumiwa katika mradi huu.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי kinaanzisha maudhui ya majuto—jambo ambalo Yahwe alijutia—ingawa maana ya kisababishi pia ipo karibu.
- source_word: עָשָׂה
  choice: alikuwa amemfanya
  rationale: Muundo huu unaonyesha wazi kwamba tendo la kumfanya mwanadamu lilitangulia majuto.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: Katika muktadha huu אָדָם inarejelea jamii ya binadamu kwa ujumla, si Adamu peke yake. Kiswahili “mwanadamu” kinaweza kutumiwa kwa maana hiyo ya kijumla.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Katika muktadha huu אֶרֶץ ni dunia, si nchi fulani; “duniani” ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: וַיִּתְעַצֵּב
  choice: akaumia
  rationale: Hitpaeli ya עצב huonyesha maumivu ya ndani. “Akaumia” huhifadhi taswira hiyo na kuitofautisha na “akajuta” iliyotangulia.
- source_word: אֶל־לִבּוֹ
  choice: moyoni mwake
  rationale: Ingawa אֶל kwa msingi ni “kwenda/kuelekea,” hapa kirai kinaeleza maumivu ya ndani. “Moyoni mwake” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
theological_decisions:
- issue: Lugha inayohusisha majuto na maumivu na Mungu
  choice: Kusema moja kwa moja kwamba Yahwe “akajuta” na “akaumia moyoni mwake.”
  alternative: Kusema tu kwamba Yahwe alihuzunika, alionekana kujuta, au akabadili nia.
  rationale: 'Kiebrania kinatumia vitenzi viwili tofauti: cha kwanza kinaonyesha majuto kuhusu tendo lililotangulia, na cha pili maumivu ya ndani. Tafsiri haiongezi wala kuondoa mvutano wa kitheolojia; maandishi hayasemi kwamba Yahwe alishangazwa, alikosa kujua yatakayotokea, au alifanya kosa la kimaadili.'
- issue: Maana ya kijumla ya הָאָדָם
  choice: Kutumia “mwanadamu” kwa maana ya jamii yote ya binadamu.
  alternative: Adamu; wanadamu; ubinadamu.
  rationale: Muktadha unahusu jamii ya binadamu kwa ujumla, si mtu mmoja aitwaye Adamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mpigo wa vitenzi viwili vya Kiebrania—majuto kisha maumivu ya ndani—bila kurudia neno “huzuni” wala kutatua mvutano wa kitheolojia ndani ya tafsiri.
