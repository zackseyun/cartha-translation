  text: 'Nuhu akazaa wana watatu: Shemu, Hamu, na Yafethi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Kitenzi ילד katika Hiphil ya masimulizi humwonyesha mzazi wa kiume kuwa chanzo cha kuzaliwa kwa watoto. Katika Kiswahili, “akazaa” ni cha kawaida na huendeleza mfululizo wa simulizi; hapa nomino “wana” na mhusika Nuhu vinaweka wazi maana ya kuwa baba.
- source_word: שְׁלֹשָׁה בָנִים
  choice: wana watatu
  rationale: בָנִים humaanisha wana wa kiume, si watoto kwa ujumla. “Wana watatu” ni tafsiri sahihi na ya asili katika Kiswahili.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Shemu, Hamu, na Yafethi
  rationale: אֶת hutambulisha yambwa bainifu na haihitaji kutafsiriwa kwa neno tofauti katika Kiswahili. Majina yameandikwa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: נֹחַ
  choice: Nuhu
  rationale: “Nuhu” ni umbo la jina hili lililozoeleka na kutambulika kwa urahisi katika Kiswahili sanifu cha Afrika Mashariki.
theological_decisions: []
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa “akazaa” unafaa simulizi la Biblia la Kiswahili na hauhitaji tanbihi ya kisawe rasmi, kwa kuwa “alimzaa” au “akawazaa” kungeweza kudokeza kwa nguvu zaidi tendo la uzazi wa kimwili la mama; “akawa baba wa” ni wazi lakini ni mrefu kuliko Kiebrania.
