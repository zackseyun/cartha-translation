  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: sw
  text: Ndipo Yahweh akasema, “Roho yangu haitashindana na mwanadamu milele[a], kwa maana yeye ni mwili[b]; kwa hiyo siku zake zitakuwa miaka mia moja na ishirini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho yangu haitakaa ndani ya mwanadamu milele.” Kitenzi cha Kiebrania ni kigumu na huenda kikamaanisha kukaa au kubaki badala ya kushindana.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa sababu yeye pia ni mwili.” Neno “mwanadamu” hapa linatafsiri neno la Kiebrania adam, ambalo liko katika umoja lakini linatumika kwa wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: יָדוֹן
  choice: haitashindana
  rationale: Kitenzi hiki kigumu kinaweza kueleweka kuwa kushindana au kubaki. Maana ya ‘kushindana’ imechaguliwa katika matini, huku uwezekano wa ‘kukaa/kubaki’ ukihifadhiwa katika tanbihi.
- source_word: רוּחִי
  choice: Roho yangu
  rationale: Kiambishi cha nafsi ya kwanza na mnenaji wa kimungu vinaelekeza kwa Roho wa Mungu, bila kulazimisha ufafanuzi wa baadaye wa kiteolojia.
- source_word: בָאָדָם
  choice: na mwanadamu
  rationale: Pamoja na maana iliyochaguliwa ya יָדוֹן, kihusishi kinaelezwa kwa ‘na’; ‘mwanadamu’ huhifadhi umoja wenye maana ya jumla ya אָדָם.
- source_word: לְעֹלָם
  choice: milele
  rationale: Hili ni neno la kawaida na la asili katika Kiswahili kwa muda usio na mwisho katika muktadha huu.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: kwa maana yeye ni mwili
  rationale: Muundo adimu umeelezwa kwa maana ya sababu. ‘Mwili’ huhifadhi taswira ya Kiebrania badala ya kuifafanua kuwa ‘mwenye kufa’; maana ya ‘pia’ imewekwa katika tanbihi.
- source_word: וְהָיוּ יָמָיו
  choice: kwa hiyo siku zake zitakuwa
  rationale: ‘Kwa hiyo’ huonyesha uhusiano wa kimantiki unaodokezwa na mfuatano wa sentensi, huku ‘siku zake’ ikihifadhi nahau ya Kiebrania.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: miaka mia moja na ishirini
  rationale: Idadi imeandikwa kwa maneno kwa mtindo wa kifasihi unaoeleweka.
theological_decisions:
- issue: Maana ya Roho wa Mungu kuhusiana na mwanadamu
  choice: Roho yangu
  alternative: pumzi yangu / pumzi yangu ya uhai
  rationale: רוּחַ linaweza kumaanisha roho, upepo, au pumzi; hapa usemi wa Mungu ‘yangu’ unapendelea ‘Roho yangu’, bila kuingiza ufafanuzi mahususi usiotajwa na aya.
- issue: Upeo wa אָדָם
  choice: mwanadamu kama umoja wa kijumla
  alternative: wanadamu / jamii ya wanadamu
  rationale: Neno la Kiebrania ni la umoja lakini linawakilisha wanadamu kwa ujumla. ‘Mwanadamu’ hudumisha umbo hilo na ni la kawaida katika Kiswahili.
- issue: Miaka mia moja na ishirini
  choice: siku zake zitakuwa miaka mia moja na ishirini
  alternative: muda uliobaki kabla ya hukumu utakuwa miaka mia moja na ishirini
  rationale: Aya yenyewe inaweza kueleweka kama ukomo wa maisha ya mwanadamu au kipindi cha muda kuelekea hukumu. Tafsiri haijaongeza ‘kabla ya gharika’, hivyo utata huo unabaki wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kifasihi lakini unaeleweka kwa msomaji wa kawaida. ‘Yahweh’ imehifadhiwa kama jina binafsi; ‘mwanadamu’ huepuka utata wa ‘mtu’ mmoja maalumu huku ikidumisha umoja wa Kiebrania.
