  verdict: approve
  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana inayochaguliwa katika Kiebrania: יָדוֹן imetolewa kwa maana yenye mjadala ya “haitashindana,” בָאָדָם kwa “na mwanadamu,” na umoja wa kijumla wa אָדָם umehifadhiwa. “Roho yangu,” “mwili,” na “siku zake zitakuwa miaka mia moja na ishirini” vinadumisha istilahi na utata wa matini. “Kwa hiyo” ni ufafanuzi mdogo wa uhusiano wa matokeo unaokubalika katika muktadha huu na unaendana na audit trail ya Kiingereza.'
