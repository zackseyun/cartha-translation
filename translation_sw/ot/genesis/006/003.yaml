  terminology: “Yahweh” huhifadhi jina la kimungu kama ilivyoamuliwa; “Roho yangu” haiongezi ufafanuzi wa kidhehebu; “mwanadamu” huwakilisha adam wa umoja wa kijumla; na “mwili” huhifadhi taswira ya בָשָׂר badala ya kuipunguza kuwa hali ya kufa. Tanbihi zinaweka wazi mbadala wa “kukaa ndani/b kubaki” na uwezekano wa “pia,” pamoja na matumizi ya adam.
