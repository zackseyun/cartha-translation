  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: sw
  text: Nami—tazama, ninaleta gharika ya maji juu ya dunia ili kuangamiza kila kiumbe chenye mwili na pumzi ya uhai[a] chini ya mbingu. Kila kilicho duniani kitakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho ya uhai.” Neno la Kiebrania רוּחַ linaweza kumaanisha “pumzi,” “upepo,” au “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Nami
  rationale: Kiunganishi pamoja na kiwakilishi huru kinakazia mhusika; “Nami” huhifadhi msisitizo na ulinganisho huo kwa Kiswahili cha kawaida.
- source_word: הִנְנִי
  choice: tazama, ninaleta
  rationale: “Tazama” huhifadhi uzito na uharaka wa tamko; nafsi ya kwanza inaelezwa katika kitenzi kinachofuata, kama ilivyo asili katika Kiswahili.
- source_word: מֵבִיא
  choice: ninaleta
  rationale: Hali ya kushiriki ya Kiebrania huonyesha tendo linalokaribia au linalotazamwa likiendelea; wakati wa sasa wa Kiswahili unaakisi umbo hilo bila kuongeza waziwazi maana ya “ninakaribia.”
- source_word: הַמַּבּוּל מַיִם
  choice: gharika ya maji
  rationale: Huhifadhi nomino maalumu ya mafuriko makuu pamoja na neno “maji,” na ni usemi wa Kiswahili unaoeleweka.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: “Dunia” inafaa upeo mpana wa simulizi kuliko “nchi,” huku “juu ya” ikihifadhi uhusiano wa kihusishi.
- source_word: לְשַׁחֵת
  choice: ili kuangamiza
  rationale: Huonyesha wazi kusudi la tendo na nguvu ya uharibifu unaokusudiwa.
- source_word: כָּל בָּשָׂר
  choice: wote wenye mwili
  rationale: Usemi huu huhifadhi dhana ya Kiebrania ya “mwili” huku ukiepuka Kiswahili kisicho cha kawaida cha “kila mwili”; unarejelea kwa upana viumbe hai vyenye mwili.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: walio na pumzi ya uhai
  rationale: “Pumzi ya uhai” inafaa zaidi muktadha wa viumbe vinavyoishi na mwangwi wa lugha ya uumbaji, bila kufuta maana mbadala ya “roho.”
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: chini ya mbingu
  rationale: Huhifadhi nahau inayomaanisha eneo lote lililo chini ya anga na upeo wake mpana.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: Kila kilicho duniani
  rationale: Ni Kiswahili cha asili kinachohifadhi nguvu ya ujumla ya kifungu.
- source_word: יִגְוָע
  choice: kitakufa
  rationale: Kitenzi cha Kiebrania humaanisha kufa au kukata roho; “kitakufa” ni wazi na huwasilisha matokeo ya moja kwa moja.
theological_decisions:
- issue: Maana ya רוּחַ katika רוּחַ חַיִּים
  choice: pumzi ya uhai
  alternative: roho ya uhai
  rationale: Katika muktadha wa gharika, kifungu kinaelekea kumaanisha pumzi inayohuisha viumbe na kina mwangwi wa Mwanzo 2:7 na 7:22. Kwa kuwa רוּחַ pia inaweza kumaanisha “roho,” maana hiyo mbadala imehifadhiwa katika tanbihi badala ya kutatuliwa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Tazama” huhifadhi uzito wa tangazo, na “gharika” hufaa muktadha wa mafuriko makuu ya simulizi.
