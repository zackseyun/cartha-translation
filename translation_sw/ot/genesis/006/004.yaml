id: GEN.6.4
reference: Genesis 6:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: sw
  text: Wanefili[a] walikuwako duniani siku hizo—na pia baadaye—wakati wana wa Mungu[b] walipoingia kwa binti za wanadamu[c], nao wakawazalia watoto. Hao ndio waliokuwa watu hodari wa tangu zamani, watu mashuhuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mapokeo, “majitu.” Neno la Kiebrania “Wanefili” linapatikana mara chache, na maana yake kamili haijulikani kwa hakika.
    reason: alternative_reading
  - marker: b
    text: “Wana wa Mungu” pia wanaweza kueleweka kuwa “viumbe wa kiungu,” au, katika baadhi ya tafsiri, watawala wa kibinadamu au ukoo wa Sethi uliomcha Mungu.
    reason: alternative_reading
  - marker: c
    text: Katika usemi “binti za wanadamu,” neno la Kiebrania linalomaanisha “mwanadamu” limetumiwa kwa maana ya jamii yote ya binadamu; yaani, hawa ni wanawake wa kibinadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: Wanefili
  rationale: Jina limetoholewa badala ya kutafsiriwa, kwa kuwa neno hili ni adimu na maana yake kamili inabishaniwa; “majitu” lingeingiza mapokeo fulani moja kwa moja katika matini.
- source_word: בָאָרֶץ
  choice: duniani
  rationale: Katika muktadha wa historia ya awali, maana pana ya dunia inafaa kuliko “katika nchi.”
- source_word: וְגַם אַחֲרֵי כֵן
  choice: na hata baadaye
  rationale: Huhifadhi nguvu ya nyongeza na maana ya wakati kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: walipoingia kwa
  rationale: Huhifadhi kwa kiasi kikubwa nahau ya Kiebrania na uhusiano wake wa wakati bila kuifanya kuwa maelezo ya wazi zaidi kuliko chanzo.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: wana wa Mungu
  rationale: Ni tafsiri ya karibu inayohifadhi uwazi wa kimakusudi kuhusu utambulisho wao.
- source_word: בְּנוֹת הָאָדָם
  choice: binti za wanadamu
  rationale: “Mwanadamu” katika Kiebrania limetumiwa kwa maana ya jamii ya binadamu; Kiswahili cha wingi kinaonyesha kwa kawaida kwamba hawa ni wanawake wa kibinadamu.
- source_word: וְיָלְדוּ לָהֶם
  choice: nao wakawazalia watoto
  rationale: Neno “watoto” linaweka wazi kitu kinachodokezwa na kitenzi, huku “wakawazalia” kikihifadhi uhusiano unaoelezwa na Kiebrania.
- source_word: הַגִּבֹּרִים
  choice: watu hodari
  rationale: Huhifadhi wazo pana la nguvu au uwezo bila kulibana kuwa “wapiganaji” wala kulipa sifa chanya ya lazima kama “mashujaa.”
- source_word: מֵעוֹלָם
  choice: wa tangu zamani
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha nyakati za kale.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: watu wenye sifa kubwa
  rationale: Huwasilisha nahau ya Kiebrania kuhusu kujulikana na kuwa na jina maarufu, kwa lugha inayoeleweka na yenye hadhi.
theological_decisions:
- issue: Utambulisho wa “wana wa Mungu”
  choice: Kudumisha usemi “wana wa Mungu” bila ufafanuzi ndani ya matini.
  alternative: Viumbe wa kiungu; watawala wa kibinadamu; au ukoo wa Sethi uliomcha Mungu.
  rationale: Kiebrania hakiamui wazi utambulisho wao katika muktadha huu; tafsiri inapaswa kuhifadhi mvutano huo wa kitheolojia.
- issue: Maana ya הַנְּפִלִים
  choice: Kutoholewa kama “Wanefili” katika matini kuu.
  alternative: Majitu; walioanguka.
  rationale: Maana na asili ya neno hilo hazina uhakika; kulitohowa huepuka kuhalalisha mapema tafsiri mojawapo inayobishaniwa.
- issue: Uhusiano wa kishazi אֲשֶׁר יָבֹאוּ
  choice: 'Kutafsiri kwa maana ya wakati: “walipoingia.”'
  alternative: “Kila walipoingia” au “baada ya kuingia.”
  rationale: Kishazi kinaeleza hali au wakati ambapo jambo lililotangulia lilitokea, lakini Kiebrania kinaweza kuruhusu tofauti ndogo ya uhusiano; tafsiri haiongezi madai yasiyolazimishwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “waliingia kwa” umechaguliwa ili kuhifadhi staha na nahau ya chanzo. “Watu hodari” huepuka maana nyembamba ya kijeshi au sifa ya kishujaa isiyolazimishwa na גִּבֹּרִים.
