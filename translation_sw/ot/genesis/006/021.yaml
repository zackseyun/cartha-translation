base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: sw
  text: Nawe, chukua kwa ajili yako baadhi ya kila aina ya chakula kinachoweza kuliwa[a], na ukusanye kwako; nacho kitakuwa chakula chako na chao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinacholiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: chukua kwa ajili yako
  rationale: Kitenzi cha amri קַח kina maana ya moja kwa moja ya ‘chukua,’ na לְךָ hapa inaonyesha manufaa kwa Nuhu mwenyewe.
- source_word: מִכָּל מַאֲכָל
  choice: baadhi ya kila aina ya chakula
  rationale: Muundo מִן + כָּל unaonyesha kuchukua kutoka katika wigo mzima wa vyakula, si kuchukua chakula chote kilichopo.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: kinachoweza kuliwa
  rationale: Niphal ya אכל inaweza kueleza chakula kinachofaa kuliwa. Tafsiri hii ni ya asili katika Kiswahili huku mbadala wa karibu zaidi na umbo la Kiebrania ukihifadhiwa katika tanbihi.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: ukikusanye kwako
  rationale: אָסַף ni ‘kusanya,’ na אֵלֶיךָ inaonyesha kukileta na kukiweka karibu na Nuhu.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: nacho kitakuwa chakula chako na chao
  rationale: 'Muundo huu unaonyesha matokeo ya amri: kile kitakachokusanywa kitakuwa chakula kwa Nuhu na kwa viumbe walio pamoja naye.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. ‘Nawe’ huhifadhi msisitizo wa kiwakilishi cha Kiebrania, na ‘chako na chao’ hutofautisha wazi Nuhu na viumbe wengine.
