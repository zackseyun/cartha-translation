base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: sw
  text: Na kutoka kwa kila kiumbe hai, kutoka kwa wote wenye mwili[a], utaleta wawili wa kila aina ndani ya safina ili uwahifadhi hai pamoja nawe; watakuwa wa kiume na wa kike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wote wenye mwili” (kwa maana halisi, “nyama yote”); usemi unaorejelea viumbe hai wenye mwili.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי
  choice: Na kutoka katika kila kiumbe hai
  rationale: Muundo huu unahifadhi kiunganishi, wazo la kuchukua kutoka katika kila kundi, na maana pana ya kitu au kiumbe kilicho hai kwa Kiswahili cha kawaida.
- source_word: מִכָּל בָּשָׂר
  choice: miongoni mwa wote wenye mwili
  rationale: Neno בָּשָׂר kwa maana halisi ni ‘mwili/nyama,’ lakini hapa usemi ‘wote wenye mwili’ unawahusu viumbe hai vya kimwili. ‘Miongoni mwa’ linaunganisha usemi huo kwa ufasaha na kifungu kilichotangulia bila kupoteza upana wake.
- source_word: שְׁנַיִם מִכֹּל
  choice: wawili wa kila aina
  rationale: 'Hii inaeleza kwa uwazi nguvu ya ugawaji ya Kiebrania: wawili wachukuliwe kutoka katika kila kundi linalohusika. Neno ‘aina’ linadokezwa na muktadha, ingawa halitajwi moja kwa moja katika Kiebrania.'
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: utaleta ... ndani ya safina
  rationale: Kitenzi cha Hiphil katika agizo kimetafsiriwa kwa wakati ujao wenye nguvu ya amri. ‘Ndani ya safina’ linaonyesha mwendo wa kuingia kwenye chombo hicho.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: ili uwahifadhi hai pamoja nawe
  rationale: ‘Kuwahifadhi hai’ linaonyesha maana sababishi ya Hiphil, yaani kuwafanya waendelee kuishi; ‘pamoja nawe’ linaonyesha uandamani.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: watakuwa wa kiume na wa kike
  rationale: Tafsiri hii ni ya moja kwa moja, ya asili katika Kiswahili, na inahifadhi taarifa kuhusu jinsia ya wale wawili.
