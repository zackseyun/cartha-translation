    text: 'Kiebrania kinarudia kitenzi “kufanya” kwa ajili ya msisitizo: “Nuhu akafanya ... ndivyo alivyofanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya’ au ‘kutengeneza.’ Hapa kinajumlisha utekelezaji wa Nuhu wa maagizo yaliyotangulia, kwa hiyo ‘akafanya’ ni tafsiri ya asili.
- source_word: נֹחַ
  choice: Nuhu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: כְּכֹל אֲשֶׁר
  choice: kama vile ... alivyo-
  rationale: Muundo huu unaonyesha kwamba tendo la Nuhu lililingana kikamilifu na yote aliyoamriwa; Kiswahili hiki ni cha kawaida na kinahifadhi wazo la ulinganifu.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Kitenzi צוה kinaonyesha amri yenye mamlaka; ‘kuamuru’ kinadumisha nguvu hiyo.
- source_word: אֹתוֹ
  choice: -m-
  rationale: Kiambishi cha yambwa katika ‘alivyomwamuru’ kinamrejelea Nuhu kama aliyepokea amri.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania lina sura ya wingi, hapa linaambatana na kitenzi cha umoja na linamrejelea Mungu mmoja.
- source_word: כֵּן
  choice: ndivyo
  rationale: ‘Ndivyo’ linarejelea namna iliyoelezwa kabla na kusisitiza ulinganifu wa tendo la Nuhu na amri.
- source_word: עָשָׂה
  choice: alivyofanya
  rationale: Kurudia kitenzi ‘kufanya’ kunahifadhi msisitizo wa Kiebrania kuhusu utekelezaji kamili wa Nuhu.
theological_decisions:
- issue: Kuhifadhi urudiaji wa kauli inayoonyesha utiifu bila kuufupisha kwa ufafanuzi
  choice: 'Kudumisha vitenzi vyote viwili: ‘Nuhu akafanya hivyo ... ndivyo alivyofanya.’'
  alternative: Nuhu alifanya yote Mungu aliyomwamuru.
  rationale: Kiebrania kinarudia עשה kwa kusudi la kusisitiza tendo la Nuhu. Kurudia ‘kufanya’ kunahifadhi msisitizo huo bila kuongeza tathmini ya kitheolojia isiyotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akafanya hivyo’ ni muhtasari wa kawaida wa maagizo yaliyotangulia, huku ‘kama vile ... ndivyo’ ikihifadhi ulinganifu na urudiaji wa Kiebrania.
