base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: sw
  text: Utaifanyia safina paa[a], na uikamilishe hadi kufikia dhiraa moja kutoka juu.[b] Utaweka mlango wa safina ubavuni mwake. Utaijenga ikiwa na ghorofa ya chini, ya pili na ya tatu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dirisha” au “mwanya wa kuingiza mwanga.” Neno la Kiebrania ni adimu na maana yake kamili haijulikani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania cha maneno haya ni kigumu. Huenda kinaeleza jinsi sehemu ya juu ya safina ilivyokamilishwa kwa dhiraa moja, labda kwa kupungua upana kuelekea juu.
    reason: textual_ambiguity
  - marker: c
    text: Au “tabaka” au “viwango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: paa
  rationale: Neno hili la Kiebrania ni adimu na maana yake kamili haijulikani. Katika muktadha wa muundo wa sehemu ya juu ya safina, “paa” linafaa, huku uwezekano wa “dirisha” au “mwanga wa juu” ukihifadhiwa katika tanbihi.
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: na kuikamilisha hadi dhiraa moja upande wa juu
  rationale: Kauli hii ni ngumu kisintaksia. Tafsiri inafuata vipengele vya Kiebrania—kukamilisha, dhiraa moja, na upande wa juu—bila kubainisha kwa uhakika kama safina ilipungua upana kuelekea juu au maagizo yalihusu nafasi iliyoachwa karibu na paa.
- source_word: פֶּתַח
  choice: mlango
  rationale: Katika maagizo ya ujenzi wa safina, “mlango” ni neno la kawaida na linaloeleweka kwa njia ya kuingilia, ingawa neno la Kiebrania linaweza pia kumaanisha uwazi au ingilio.
- source_word: בְּצִדָּהּ
  choice: ubavuni mwake
  rationale: Huwasilisha mahali pa mlango katika upande wa safina kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: ghorofa ya chini, ya pili na ya tatu
  rationale: Maneno haya yanaeleza viwango vitatu vya ndani. “Ghorofa” linaeleweka kwa wasomaji wa Kiswahili kama tabaka au sakafu tofauti za jengo au muundo mkubwa.
- source_word: תַּעֲשֶׂהָ
  choice: Utaijenga
  rationale: Kiambishi cha Kiebrania kinarejelea safina. Kitenzi “kujenga” ni cha asili katika Kiswahili kwa maagizo haya ya kutengeneza muundo wenye ghorofa.
