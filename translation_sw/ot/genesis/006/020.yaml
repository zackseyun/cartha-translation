base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: sw
  text: Ndege kwa aina zao[a], wanyama wa kufugwa kwa aina zao, na kila kiumbe kitambaacho ardhini kwa aina yake—wawili kutoka kwa kila aina watakuja kwako ili uwahifadhi hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa jinsi zao”; usemi huu una maana ileile ya msingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: ndege
  rationale: Neno עוֹף humaanisha viumbe warukao au ndege; katika orodha hii, “ndege” ni tafsiri ya kawaida na wazi katika Kiswahili.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: kwa aina zao / kwa aina yake
  rationale: מִין huonyesha kundi au aina. “Kwa aina” huhifadhi maana ya uainishaji bila kuingiza dhana ya kisasa ya kisayansi kuhusu spishi.
- source_word: הַבְּהֵמָה
  choice: wanyama wa kufugwa
  rationale: בְּהֵמָה hapa linaonyesha kundi la wanyama wa nchi kavu wanaofugwa, likitofautishwa na ndege na viumbe vitambaavyo.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: kila kiumbe kitambaacho ardhini
  rationale: רֶמֶשׂ hurejelea viumbe wadogo wanaotambaa au kusogea karibu na ardhi, na הָאֲדָמָה linaakisiwa kwa “ardhini.”
- source_word: שְׁנַיִם מִכֹּל
  choice: wawili kutoka kwa kila aina
  rationale: Kirai hiki kinamaanisha wawili kutoka katika kila kundi lililotajwa. “Wawili” linapatana kisarufi na viumbe hai, huku “kutoka kwa kila aina” likihifadhi nguvu ya mgawanyo ya מִכֹּל.
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: watakuja kwako
  rationale: Kitenzi בוא pamoja na אֶל huonyesha mwendo kuelekea kwa Nuhu; tafsiri hii haiongezi wazo la kuingia ndani ya safina, ambalo halijasemwa wazi katika kishazi hiki.
- source_word: לְהַחֲיוֹת
  choice: ili uwahifadhi hai
  rationale: Hifili ya חיה hapa ina maana ya kudumisha au kuhifadhi uhai, na umbo la kusudi linaonyeshwa kwa “ili.”
theological_decisions: []
