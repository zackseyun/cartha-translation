  source_fidelity: Tafsiri inafuata kwa uaminifu makundi matatu ya Kiebrania—ndege, wanyama wa kufugwa, na viumbe vitambaavyo ardhini—pamoja na urudiaji wa “kwa aina.” “Wawili kutoka kwa kila aina watakuja kwako” huwasilisha vizuri שְׁנַיִם מִכֹּל יָבֹאוּ אֵלֶיךָ, bila kuongeza wazo la kuingia safinani. “Ili uwahifadhi hai” hutoa kusudi la לְהַחֲיוֹת kwa usahihi.
