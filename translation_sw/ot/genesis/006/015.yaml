base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: sw
  text: 'Na hivi ndivyo utakavyoitengeneza: urefu wa safina utakuwa dhiraa mia tatu[a], upana wake dhiraa hamsini, na kimo chake dhiraa thelathini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dhiraa ilikuwa kipimo cha kale cha urefu, takribani umbali kutoka kwenye kiwiko hadi ncha za vidole.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה
  choice: Na hivi ndivyo
  rationale: Kiunganishi pamoja na kiwakilishi huanzisha maelezo ya namna ya kuitengeneza safina; usemi huu ni wa asili katika Kiswahili na unaonyesha nguvu ya maagizo.
- source_word: אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: utakavyoitengeneza
  rationale: Kitenzi עשה kina maana ya kufanya au kutengeneza; katika muktadha wa kujenga safina, “kutengeneza” kinafaa zaidi, na umbo la wakati ujao linadumisha nguvu ya agizo.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: dhiraa mia tatu
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa vipimo vya kisasa, ili kudumisha umahususi wa matini chanzo.
- source_word: הַתֵּבָה
  choice: safina
  rationale: Katika muktadha wa simulizi la Nuhu, “safina” ni istilahi ya Kiswahili inayotambulika kwa chombo hiki kikubwa cha kuokoa viumbe katika gharika.
- source_word: אֹרֶךְ
  choice: urefu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa kipimo cha upande mrefu wa kitu.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: upana wake dhiraa hamsini
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unadumisha maana ya kipimo cha upana.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: na kimo chake dhiraa thelathini
  rationale: קוֹמָה humaanisha kimo au urefu kwenda juu; “kimo” huepuka kuchanganya kipimo hiki na “urefu” uliotajwa mwanzoni.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vipimo umewekwa wazi na kwa mtiririko wa kawaida wa Kiswahili; kipimo cha kale “dhiraa” kimehifadhiwa na kufafanuliwa katika tanbihi.
