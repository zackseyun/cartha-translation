base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: sw
  text: Kisha Mungu akamwambia Noa, “Mwisho wa kila kiumbe chenye mwili umefika mbele zangu,[a] kwa maana dunia imejaa ukatili kwa sababu yao. Tazama, niko karibu kuwaangamiza pamoja na dunia.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwisho wa wote wenye mwili umefika mbele zangu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kina muundo wenye utata: kwa karibu, “ninawaangamiza wao, [et] dunia.” Hii inaweza kueleweka “ninawaangamiza pamoja na dunia” au “ninawaangamiza wao na dunia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל בָּשָׂר
  choice: mwisho wa kila kiumbe chenye mwili
  rationale: Neno קֵץ linaonyesha mwisho au ukomo, na כָּל בָּשָׂר ni usemi mpana unaojumuisha viumbe hai, si wanadamu pekee. Tafsiri hii ni wazi kwa msomaji wa sasa huku ikidumisha upana wa usemi wa Kiebrania.
- source_word: בָּא לְפָנַי
  choice: umefika mbele zangu
  rationale: Hii inadumisha taswira ya Kiebrania ya jambo kufika mbele za Mungu ili lihukumiwe, bila kuifafanua kupita kiasi.
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: dunia imejaa ukatili
  rationale: חָמָס hapa ni ukatili, jeuri, au dhuluma. ‘Ukatili’ unafaa muktadha wa uharibifu wa maadili kabla ya gharika, na ‘dunia’ inadumisha upeo mpana wa simulizi.
- source_word: מִפְּנֵיהֶם
  choice: kwa sababu yao
  rationale: 'Muundo huu una maana ya kisababishi: wao ndio sababu ya dunia kujaa ukatili.'
- source_word: וְהִנְנִי מַשְׁחִיתָם
  choice: Tazama, nitawaangamiza
  rationale: ‘Tazama’ inadumisha msisitizo wa הִנְנִי, huku wakati ujao ukieleza kwa Kiswahili cha kawaida tendo la hukumu lililo karibu kutokea.
- source_word: אֶת הָאָרֶץ
  choice: pamoja na dunia
  rationale: Muundo wa Kiebrania ni mgumu baada ya kiwakilishi cha yambwa ‘wao.’ ‘Pamoja na dunia’ huepuka maana isiyokusudiwa kwamba dunia ndiyo chombo cha maangamizi, huku ikionyesha kwamba wao na dunia wanahusishwa katika hukumu.
theological_decisions:
- issue: Upeo wa כָּל בָּשָׂר (‘wote wenye mwili’)
  choice: Kundi pana la viumbe hai walio chini ya hukumu
  alternative: Wanadamu wote pekee
  rationale: Katika simulizi la gharika, usemi huu hutumiwa kwa upeo mpana kuliko wanadamu pekee. ‘Kila kiumbe chenye mwili’ hudumisha upana huo.
- issue: Maana ya הָאָרֶץ
  choice: dunia
  alternative: nchi
  rationale: Muktadha mpana wa simulizi la gharika unaunga mkono ‘dunia’; hata hivyo, neno la Kiebrania linaweza pia kumaanisha ‘nchi’ katika miktadha mingine.
- issue: Uhusiano wa אֶת הָאָרֶץ na kitenzi מַשְׁחִיתָם
  choice: kuwaangamiza pamoja na dunia
  alternative: kuwaangamiza wao na dunia; au, kwa kufuata muundo halisi zaidi, kuwaangamiza na dunia
  rationale: Kiebrania kinaweza kueleweka kuwa wao na dunia ni vitu vinavyopata maangamizi. Tafsiri kuu inatoa Kiswahili cha kawaida bila kuficha ugumu wa kisarufi, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Kiumbe chenye mwili’ kinaweka wazi upeo mpana wa כָּל בָּשָׂר, na ‘ukatili’ ni neno la kawaida lakini zito linalofaa muktadha wa hukumu.
