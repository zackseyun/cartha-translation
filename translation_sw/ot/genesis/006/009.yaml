id: GEN.6.9
reference: Genesis 6:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: sw
  text: Hivi ndivyo vizazi vya Nuhu. Nuhu alikuwa mtu mwenye haki, asiye na lawama katika vizazi vyake.[a] Nuhu alitembea pamoja na Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa watu wa wakati wake”; au, “katika wakati wake.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Hivi ndivyo vizazi vya
  rationale: Muundo huu unahifadhi istilahi muhimu ya kimuundo תּוֹלְדֹת katika Mwanzo na wakati huohuo unasikika kama utangulizi wa sehemu mpya katika Kiswahili.
- source_word: נֹחַ
  choice: Nuhu
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אִישׁ צַדִּיק
  choice: mtu mwenye haki
  rationale: Neno 'mtu' humtaja Nuhu kwa kawaida, na 'mwenye haki' huhifadhi maana ya kimaadili na uzito wa צַדִּיק bila kuongeza madai yasiyomo katika maandishi.
- source_word: תָּמִים
  choice: asiye na lawama
  rationale: Katika maelezo ya tabia, neno hili huonyesha uadilifu au kutokuwa na lawama, si lazima ukamilifu usio na dhambi.
- source_word: הָיָה
  choice: alikuwa
  rationale: Ni tafsiri ya kawaida ya kitenzi cha hali katika wakati uliopita hapa.
- source_word: בְּדֹרֹתָיו
  choice: katika vizazi vyake
  rationale: Tafsiri hii inahifadhi wingi wa Kiebrania na uwazi wake wa kitafsiri; inaweza kueleweka kuhusu vizazi vya maisha yake au watu wa wakati wake.
- source_word: אֶת הָאֱלֹהִים
  choice: pamoja na Mungu
  rationale: Katika nahau ya kutembea, muundo huu unaonyesha ushirika au mwenendo unaohusiana na Mungu kwa Kiswahili cha kawaida.
- source_word: הִתְהַלֶּךְ
  choice: alitembea
  rationale: Inahifadhi sitiari ya Kiebrania kuhusu mwenendo wa maisha na uhusiano na Mungu, badala ya kuifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya תָּמִים katika kumweleza Nuhu
  choice: asiye na lawama, kwa maana ya uadilifu wa tabia
  alternative: mkamilifu; asiye na dosari
  rationale: Maandishi yanamsifu Nuhu kinyume na kizazi kilichopotoka, lakini hayalazimishi dai la kwamba hakuwa na dhambi kabisa.
- issue: Maana ya בְּדֹרֹתָיו
  choice: katika vizazi vyake
  alternative: miongoni mwa watu wa wakati wake; katika wakati wake
  rationale: Muundo wa karibu na Kiebrania unahifadhi wingi na utata halisi wa kishazi; maelezo mbadala yametolewa katika tanbihi bila kuamua maana kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya 'kutembea pamoja na Mungu' na istilahi ya kimuundo 'vizazi' zimehifadhiwa kwa ajili ya uhusiano wa ndani wa maandishi ya Mwanzo.
