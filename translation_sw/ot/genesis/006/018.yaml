base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: sw
  text: 'Lakini nitaweka agano langu nawe[a], nawe utaingia ndani ya safina: wewe, wanao, mke wako, na wake wa wanao pamoja nawe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitalithibitisha agano langu nawe.” Kitenzi cha Kiebrania kinaweza kuwa na maana mojawapo kati ya hizi katika muktadha wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Lakini nitalithibitisha
  rationale: Hifili ya קום pamoja na בְּרִית inaweza kumaanisha kulisimamisha au kulithibitisha agano. Kiswahili ‘kulithibitisha agano’ huhifadhi uwezekano wa kulifanya liwe imara bila kuamua kama ni jipya au tayari lipo; ‘lakini’ huonyesha tofauti na tangazo la maangamizi lililotangulia.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: ‘Agano’ ndilo neno la kawaida na lenye uzito wa kikanoni kwa בְּרִית katika Kiswahili cha Biblia.
- source_word: אִתָּךְ
  choice: pamoja nawe
  rationale: Hueleza uhusiano wa agano, na katika mwisho wa aya hueleza kuandamana; usemi huu ni wa asili na wazi kwa Kiswahili.
- source_word: וּבָאתָ
  choice: nawe utaingia
  rationale: בוא inaweza kuwa kuja, kwenda, au kuingia; safina ikiwa mahali panapoelekezwa, ‘kuingia’ ndilo chaguo la wazi zaidi.
- source_word: הַתֵּבָה
  choice: safina
  rationale: ‘Safina’ ndilo neno lililozoeleka na sahihi katika simulizi la Nuhu kwa chombo hiki kikubwa cha kuokolea.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; kimedumishwa katika orodha baada ya mstari mrefu ili kuonyesha mkazo huo kwa njia ya asili.
- source_word: וּבָנֶיךָ
  choice: wanao
  rationale: Kiebrania kinataja wana wa kiume hasa, si watoto kwa ujumla; ‘wanao’ huhifadhi maana hiyo.
- source_word: וְאִשְׁתְּךָ
  choice: mke wako
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa kifamilia unaotajwa.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: wake za wanao
  rationale: Hufuata kwa karibu muundo wa Kiebrania, ‘wake za wana wako,’ bila kuubadili kuwa istilahi yenye tafsiri zaidi kama ‘binti zako.’
theological_decisions:
- issue: Maana ya usemi kuhusu agano
  choice: nitalithibitisha agano langu pamoja nawe
  alternative: nitaweka agano langu pamoja nawe
  rationale: Kitenzi cha Kiebrania kinaweza kueleza kusimamisha au kuthibitisha agano. Maandishi yenyewe hayaamui wazi kama agano linaanzishwa hapa au ahadi iliyokuwapo inaimarishwa. Matini kuu inatumia ‘kulithibitisha,’ huku tanbihi ikihifadhi uwezekano mwingine bila kutatua mvutano wa kiteolojia kimabavu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mstari mrefu umetumiwa kuhifadhi mkazo wa kiwakilishi אַתָּה na kuanzisha orodha kwa uwazi.
