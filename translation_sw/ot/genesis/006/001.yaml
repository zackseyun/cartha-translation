base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: sw
  text: Ikawa, wanadamu[a] walipoanza kuongezeka juu ya uso wa ardhi, mabinti wakazaliwa kwao,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno la umoja “mtu,” lakini hapa linarejelea wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha hatua mpya katika simulizi na kudumisha mtiririko wa kimasimulizi wa Kiebrania bila kutumia lugha nzito au ya kizamani.
- source_word: כִּי
  choice: walipo-
  rationale: Katika muundo huu כִּי inaingiza kishazi cha wakati; kiambishi cha Kiswahili -po- kinawasilisha maana ya ‘wakati’ kwa ufasaha.
- source_word: הֵחֵל
  choice: walianza
  rationale: Kitenzi hiki katika muundo huu humaanisha kuanza kufanya jambo.
- source_word: הָאָדָם
  choice: wanadamu
  rationale: Ingawa nomino ya Kiebrania iko katika umoja wa kisarufi, hapa ina maana ya kijumla na inarejelea jamii ya binadamu, si Adamu kama mtu mmoja.
- source_word: לָרֹב
  choice: kuongezeka
  rationale: Huonyesha kuongezeka kwa idadi ya watu; ‘kuongezeka’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: juu ya uso wa ardhi
  rationale: Hudumisha taswira ya Kiebrania ya ‘uso’ huku ‘ardhi’ ikiwakilisha אֲדָמָה kwa lugha ya kawaida na yenye hadhi.
- source_word: וּבָנוֹת
  choice: na mabinti
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, na inaandaa hoja ya mstari unaofuata.
- source_word: יֻלְּדוּ לָהֶם
  choice: walipozaliwa kwao
  rationale: Muundo wa kutendwa pamoja na ל unaonyesha kwamba mabinti walizaliwa kwa wanadamu hao; kurudia muundo wa wakati kwa -po- hufanya sentensi inayoendelea hadi mstari unaofuata iwe ya asili katika Kiswahili.
theological_decisions:
- issue: Maana ya הָאָדָם katika muktadha wa jamii yote ya binadamu
  choice: wanadamu
  alternative: mtu
  rationale: Hapa הָאָדָם ni umoja wenye maana ya kijumla. ‘Wanadamu’ huepuka kuifanya irejelee kimakosa mwanamume mmoja au Adamu binafsi, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye hadhi. Koma ya mwisho imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
