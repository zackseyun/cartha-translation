base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: sw
  text: Mungu akaiona dunia, na tazama, ilikuwa imeharibika[a], kwa sababu wenye mwili wote[b] walikuwa wameiharibu njia yao duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ilikuwa imepotoka au imeangamia. Kitenzi cha Kiebrania kinaweza kuonyesha upotovu wa kimaadili pamoja na kuharibika au maangamizi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi zaidi, kila mwili. Msemo huu unaweza kuwahusu wanadamu au viumbe hai kwa maana pana zaidi.
    reason: semantic_scope
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaiona
  rationale: Kitenzi ראה katika mfululizo wa masimulizi kinamaanisha moja kwa moja ‘akaiona’; umbo hili linaendeleza mtiririko wa simulizi la Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu אֱלֹהִים humrejelea Mungu mmoja, hivyo ‘Mungu’ ndilo neno la kawaida na linalofaa.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika simulizi la gharika, ‘dunia’ linafaa kuliko ‘nchi’ kwa sababu muktadha una upeo mpana, ingawa neno la Kiebrania linaweza pia kumaanisha nchi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: הִנֵּה huvuta fikira kwa uzito kuelekea hali inayoonekana; ‘na tazama’ huhifadhi nguvu hiyo ya kisimulizi.
- source_word: נִשְׁחָתָה
  choice: ilikuwa imeharibika
  rationale: Mzizi שׁחת unaweza kuonyesha upotovu wa kimaadili pamoja na kuharibika au kuangamia. ‘Imeharibika’ huhifadhi upana huo na pia uhusiano wa mzizi na ‘wameiharibu’ katika kishazi kinachofuata.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa hutambulisha sababu ya hali ya dunia iliyoelezwa kabla yake.
- source_word: הִשְׁחִית
  choice: walikuwa wameiharibu
  rationale: Hiphil ya שׁחת ina maana ya kusababisha uharibifu. ‘Wameiharibu’ hudumisha urudiaji wa mzizi unaoonekana katika ‘imeharibika’ bila kuufanya uwe wa kimaadili au wa kimwili pekee.
- source_word: כָּל בָּשָׂר
  choice: wote wenye mwili
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania na upana wake badala ya kuiwekea kikomo kuwa wanadamu tu au kila kiumbe hai.
- source_word: דַּרְכּוֹ
  choice: njia yao
  rationale: דֶּרֶךְ hapa ni sitiari ya mwenendo au namna ya kuishi. ‘Njia yao’ huhifadhi sitiari hiyo; kiwakilishi cha umoja cha Kiebrania kimetafsiriwa kwa wingi ili kupatana kawaida na ‘wote wenye mwili’ katika Kiswahili.
- source_word: עַל הָאָרֶץ
  choice: duniani
  rationale: ‘Duniani’ ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kuwa juu au katika dunia.
theological_decisions:
- issue: Nguvu ya maana ya שׁחת katika vishazi vyote viwili
  choice: Kutumia ‘imeharibika’ na ‘wameiharibu’ ili kuhifadhi pamoja upotovu wa kimaadili na matokeo ya uharibifu.
  alternative: Kutumia ‘imepotoka ... wameipotosha’ au ‘imeangamia ... wameiangamiza’.
  rationale: Mzizi unaorudiwa unaunganisha hali ya dunia na tendo la wote wenye mwili. ‘Haribika/haribu’ huhifadhi uhusiano huo bila kufunga maana katika upotovu wa kimaadili pekee au maangamizi ya kimwili pekee.
- issue: Upeo wa כָּל בָּשָׂר
  choice: Kuhifadhi nahau kwa ‘wote wenye mwili’.
  alternative: ‘Wanadamu wote’ au ‘viumbe vyote hai’.
  rationale: Muktadha unaweza kuelekeza hasa kwa wanadamu au kwa viumbe hai kwa upana zaidi, lakini tafsiri haipaswi kuamua kimya-kimya jambo ambalo usemi wa Kiebrania huliacha likiwa pana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye hadhi. ‘Na tazama’ limehifadhiwa kwa uzito wa kisimulizi, huku ‘wote wenye mwili’ likihifadhi nahau na utata halisi wa maandishi ya Kiebrania.
