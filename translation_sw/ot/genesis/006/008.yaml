  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: sw
  text: Lakini Noa alipata kibali machoni pa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na Noa alipata neema machoni pa Yahwe.”
    reason: Tofauti hii inaonyesha kwamba וְ inaweza kutafsiriwa “na,” na חֵן pia inaweza kutafsiriwa “neema.”
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Lakini Noa
  rationale: Kiunganishi וְ kwa msingi humaanisha “na,” lakini hapa kinaonyesha tofauti kati ya hukumu ya uovu uliotangulia na hali ya Noa; “Lakini” ni ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: מָצָא
  choice: alipata
  rationale: Kitenzi מצא humaanisha “kupata” au “kuona”; katika msemo huu, “alipata kibali” ni Kiswahili cha kawaida kinachohifadhi maana ya nahau ya Kiebrania.
- source_word: חֵן
  choice: kibali
  rationale: חֵן inaweza kumaanisha kibali, neema, au kukubalika. “Kibali” linafaa katika msemo “kupata kibali machoni pa” bila kuingiza kwa lazima maana pana za kiteolojia zinazoweza kuhusishwa na “neema.”
- source_word: בְּ/עֵינֵי
  choice: machoni pa
  rationale: Hii inahifadhi taswira ya Kiebrania na ni nahau ya Kiswahili inayoeleweka kwa maana ya “katika mtazamo wa” au “mbele za.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” umbo la kawaida katika Kiswahili, badala ya kulibadilisha kwa cheo kama “BWANA.”
theological_decisions:
- issue: Maana ya חֵן kuhusu mtazamo wa Mungu kwa Noa
  choice: kibali
  alternative: neema
  rationale: “Kibali” kinadumisha nahau ya Kiebrania na mtazamo mwema wa Yahwe kwa Noa bila kuifanya aya iamue peke yake maana maalumu ya kimafundisho.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, hivyo limetoholewa badala ya kubadilishwa kwa cheo; “Yahwe” ni tahajia ya Kiswahili iliyo wazi na inayotambulika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau “alipata kibali machoni pa” imehifadhi taswira ya chanzo bila kuwa ngumu.
