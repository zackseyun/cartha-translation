  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: sw
  text: Basi Yahwe akasema, “Nitamfutilia mbali mwanadamu[a] niliyemuumba kutoka juu ya uso wa ardhi[b]—kuanzia mwanadamu hadi mifugo, hadi viumbe vitambaavyo, na hadi ndege wa angani—kwa maana ninajuta kwamba nimewafanya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanadamu.” Neno la Kiebrania adam hapa linamaanisha jamii ya wanadamu kwa ujumla, ingawa limetumiwa katika umoja wa uwakilishi.
    reason: lexical_alternative
  - marker: b
    text: “Uso wa ardhi” ni nahau ya Kiebrania inayomaanisha uso au sehemu ya juu ya ardhi.
    reason: idiom
  - marker: c
    text: Au “ninahuzunika kwa kuwa nimewafanya.” Kitenzi cha Kiebrania kinaweza kuonyesha majuto au huzuni kuhusu tendo la awali; chenyewe hakisemi kwamba Mungu alishangazwa, hakujua yatakayotokea, au alifanya kosa la kimaadili.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la Mungu YHWH kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: אֶמְחֶה
  choice: Nitamfutilia mbali
  rationale: Kitenzi מחה kina taswira ya kufuta kabisa; ‘kufutilia mbali’ ni Kiswahili cha kawaida kinachohifadhi taswira hiyo na wazo la kuondoa kutoka uso wa ardhi.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: Hapa אָדָם humaanisha jamii ya wanadamu kwa ujumla, lakini umoja wa uwakilishi umehifadhiwa ili kurudia neno hilo katika orodha inayofuata.
- source_word: אֲשֶׁר בָּרָאתִי
  choice: niliyemuumba
  rationale: Kishazi hiki cha uhusiano kinarejelea mwanadamu kama kitu cha tendo la Mungu la kuumba.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: kutoka uso wa ardhi
  rationale: Huhifadhi nahau halisi ya Kiebrania ‘uso wa ardhi’ kwa Kiswahili kinachoeleweka, badala ya kuipunguza kuwa ‘duniani.’
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמָיִם
  choice: tangu mwanadamu hata mnyama, hata kiumbe kitambaacho, na hata ndege wa angani
  rationale: Huhifadhi mpangilio unaopanuka wa orodha ya Kiebrania. Umoja wa kijumla katika ‘mnyama’ na ‘kiumbe kitambaacho’ unaendana na maumbo ya chanzo, huku ‘ndege wa angani’ ikiwa Kiswahili cha kawaida kwa nahau ya Kiebrania.
- source_word: נִחַמְתִּי
  choice: ninajuta
  rationale: Niphal ya נחם katika muktadha huu inaonyesha majuto au huzuni ya kutazama nyuma juu ya tendo lililofanywa. ‘Ninajuta’ huhifadhi mvutano huo moja kwa moja bila kudai kwamba Mungu alishangazwa au alifanya kosa la kimaadili.
- source_word: כִּי עֲשִׂיתִם
  choice: kwamba nimewafanya
  rationale: Kiambishi cha wingi kinarejelea viumbe wote waliotajwa katika orodha; wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo ya sasa.
theological_decisions:
- issue: Majuto ya Mungu katika נִחַמְתִּי
  choice: kwa maana ninajuta kwamba nimewafanya
  alternative: kwa maana ninahuzunika kwa kuwa nimewafanya
  rationale: ‘Ninajuta’ huonyesha kwa uwazi tathmini yenye huzuni kuhusu tendo la awali na huhifadhi ugumu wa kiteolojia wa maandishi. Tafsiri haiongezi madai kwamba Mungu hakujua yatakayotokea, alishangazwa, au alifanya kosa la kimaadili.
- issue: Maana ya kijumla ya הָאָדָם
  choice: mwanadamu
  alternative: wanadamu
  rationale: Umoja wa ‘mwanadamu’ unaweza kutumiwa kwa uwakilishi wa jamii nzima katika Kiswahili na huhifadhi urudiaji wa אָדָם katika kishazi kinachofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na nahau kuu za Kiebrania zimehifadhiwa kadiri zinavyobaki kueleweka; maelezo mafupi yanabeba ufafanuzi unaohitajika bila kulainisha mvutano wa maandishi.
