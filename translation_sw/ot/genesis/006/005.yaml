id: GEN.6.5
reference: Genesis 6:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: sw
  text: Yahwe akaona kwamba uovu wa wanadamu ulikuwa mwingi duniani, na kwamba kila mwelekeo wa mawazo ya mioyo yao ulikuwa uovu tu sikuzote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “uovu tu siku yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kauli ya masimulizi ya Kiebrania inaendeleza simulizi; “akaona” ni ya kawaida na sahihi katika masimulizi ya Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: uovu wa wanadamu ulikuwa mwingi
  rationale: רָעָה hapa ni uovu wa kimaadili, רַבָּה huonyesha ukubwa au wingi wake, na הָאָדָם humaanisha jamii ya wanadamu kwa ujumla.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Katika muktadha wa historia ya awali, אֶרֶץ ina maana pana ya dunia, si nchi fulani.
- source_word: יֵצֶר
  choice: mwelekeo
  rationale: Neno hili linahusu msukumo au hali inayounda fikra na makusudi ya ndani; “mwelekeo” ni tafsiri ya asili isiyopanua maana kupita kiasi.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: mawazo ya mioyo yao
  rationale: Usemi wa Kiebrania umehifadhiwa huku umoja wa kijumla wa “mtu” ukitolewa kwa wingi wa asili katika Kiswahili; “moyo” unahusisha fikra, nia na matamanio.
- source_word: רַק רַע כָּל הַיּוֹם
  choice: ulikuwa uovu tu sikuzote
  rationale: “Uovu tu” huhifadhi nguvu ya רַק, na “sikuzote” hutoa maana ya idiomu “siku yote” kama hali ya kudumu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia “Yahwe” huhifadhi jina binafsi lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kijumla ya הָאָדָם
  choice: wanadamu
  alternative: mwanadamu
  rationale: Katika mstari huu neno hilo linarejelea jamii yote ya binadamu. Wingi pia huwezesha viwakilishi vya kawaida vya Kiswahili bila kuingiza jinsia isiyokusudiwa.
- issue: Nguvu ya כָּל הַיּוֹם
  choice: sikuzote
  alternative: siku nzima
  rationale: Katika muktadha huu usemi unaonyesha hali ya daima. Maana halisi imehifadhiwa katika tanbihi ili kutodhoofisha picha ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wanadamu” na “mioyo yao” vinatumiwa kwa maana ya kijumla, na muundo unabaki karibu na urudiaji na mkazo wa Kiebrania.
