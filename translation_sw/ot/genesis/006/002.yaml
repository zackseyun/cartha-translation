  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: sw
  text: Wana wa Mungu[a] waliwaona binti za wanadamu kwamba walikuwa wazuri[b], wakajitwalia wake kutoka kwa yeyote waliyemchagua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viumbe wa kiungu.” Utambulisho wa “wana wa Mungu” unabishaniwa; fasiri kuu ni pamoja na viumbe wa mbinguni, watawala wa kibinadamu, au ukoo wa Sethi.
    reason: alternative_reading
  - marker: b
    text: Au, “wenye kuvutia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: wana wa Mungu
  rationale: Ni tafsiri ya karibu ya kirai cha Kiebrania na haibainishi kimakusudi utambulisho wa wahusika, ambao unabishaniwa.
- source_word: בְּנוֹת הָאָדָם
  choice: binti za wanadamu
  rationale: Katika muktadha huu אָדָם ni jina la pamoja linalowarejelea wanadamu; usemi huu ni wa asili katika Kiswahili na unadumisha tofauti na ‘wana wa Mungu’.
- source_word: כִּי טֹבֹת הֵנָּה
  choice: kuwa wazuri
  rationale: טוֹב hapa inaeleza uzuri wenye kuvutia katika muktadha wa kuchagua wake. ‘Wazuri’ ni ya asili na inadumisha upana wa neno kuliko kulifinya kuwa uzuri wa sura pekee.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: wakajitwalia wake
  rationale: ‘Wake’ linafaa kwa נָשִׁים katika muundo huu, na ‘wakajitwalia’ linawasilisha kitendo pamoja na maana ya לָהֶם, ‘kwa ajili yao wenyewe,’ bila kukifanya kuwa ndoa kwa ufafanuzi zaidi ya matini.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: kutoka miongoni mwa wote waliowachagua
  rationale: Tafsiri hii inahifadhi wazo la uchaguzi mpana kutoka katika kundi zima na pia huonyesha kwamba waliwachagua watu, si vitu.
theological_decisions:
- issue: Utambulisho wa ‘wana wa Mungu’
  choice: Kudumisha usemi halisi ‘wana wa Mungu’ bila kuwataja moja kwa moja kuwa viumbe wa mbinguni, watawala, au ukoo wa Sethi.
  alternative: ‘viumbe wa kiungu’
  rationale: Kirai cha Kiebrania kina tafsiri kadhaa zinazobishaniwa, na mstari wenyewe hautatui utambulisho wao. Tanbihi inaonyesha fasiri kuu bila kuamua kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ‘waliwaona … wakajitwalia’ ni wa asili na huhifadhi mfuatano wa Kiebrania. Alama zote za tanbihi zimewekwa mara moja katika matini.
