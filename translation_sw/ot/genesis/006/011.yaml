  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: sw
  text: Dunia ilikuwa imeharibika mbele za Mungu[a], nayo dunia ilikuwa imejaa ukatili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dunia ilikuwa imeharibika machoni pa Mungu”; neno linalotafsiriwa “dunia” linaweza pia kumaanisha “nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: ilikuwa imepotoka
  rationale: Kauli ya Kiebrania inaonyesha hali iliyotokea ya kuharibika au kupotoka. Katika muktadha wa uovu wa wanadamu, “ilikuwa imepotoka” ni Kiswahili cha asili kinachodokeza upotovu wa kimaadili bila kuifanya dunia kuwa mtendaji wa kitendo.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Neno אֶרֶץ linaweza kumaanisha “dunia” au “nchi.” Katika simulizi la gharika, “dunia” linafaa zaidi kwa upeo wa simulizi. Kurudiwa kwake kumehifadhiwa kama katika Kiebrania.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: mbele za Mungu
  rationale: Hii huhifadhi kwa karibu maana ya “mbele ya/katika uwepo wa Mungu” na ni usemi wa Kiswahili unaoeleweka; maana mbadala ya “machoni pa Mungu” imewekwa katika tanbihi.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Muktadha na sarufi zinaonyesha Mungu mmoja, kwa hiyo umoja umetumiwa.
- source_word: וַתִּמָּלֵא
  choice: ilikuwa imejaa
  rationale: Kauli hii inaonyesha dunia kuwa katika hali ya kujaa. “Ilikuwa imejaa” ni ya asili katika Kiswahili na inaonyesha hali iliyotokana na tendo hilo.
- source_word: חָמָס
  choice: jeuri
  rationale: חָמָס huhusu ukatili, vurugu, au udhalimu wa kijeuri. “Jeuri” ni neno fupi na pana linalohifadhi uzito wa kosa bila kulipanua kupita kiasi.
- source_word: וַ
  choice: nayo
  rationale: Waw ya pili inaunganisha kishazi na kuendeleza simulizi. “Nayo” ni kiunganishi cha asili kinachohifadhi uhusiano huo na msisitizo wa kurudiwa kwa “dunia”; waw ya kwanza haihitaji kiunganishi cha wazi mwanzoni mwa aya.
theological_decisions:
- issue: Aina ya upotovu unaoelezwa
  choice: Upotovu wa kimaadili wa dunia, hasa jamii ya wanadamu, mbele za Mungu
  alternative: Kuharibika kwa dunia kimwili
  rationale: Muktadha wa karibu unasisitiza uovu wa wanadamu na jeuri. Hata hivyo, tafsiri inadumisha mhusika mpana “dunia” badala ya kuibadili moja kwa moja kuwa “wanadamu,” hivyo haifungi kabisa upeo wa kauli ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kurudiwa kwa “dunia” kumehifadhiwa kwa uaminifu na msisitizo; “mbele za Mungu” limetumiwa badala ya usemi mzito zaidi “mbele ya uso wa Mungu.”
