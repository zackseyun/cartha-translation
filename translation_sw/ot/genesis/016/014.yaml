  text: עַל כֵּן֙ קָרָ֣א לַ/בְּאֵ֔ר בְּאֵ֥ר לַחַ֖י רֹאִ֑י הִנֵּ֥ה בֵין קָדֵ֖שׁ וּ/בֵ֥ין בָּֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: sw
  text: Kwa hiyo kisima hicho kikaitwa Beer-Lahai-Roi.[a] Tazama, kiko kati ya Kadeshi na Beredi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer-Lahai-Roi maana yake yaweza kuwa “Kisima cha Aliye Hai anionaye” au “Kisima cha Aliye Hai niliyemwona.”
    reason: Kufafanua jina la Kiebrania huku tukihifadhi utata wake halisi.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha kuwa jina la kisima lilitokana na tukio lililosimuliwa katika mstari uliotangulia.
- source_word: קָרָא
  choice: kikaitwa
  rationale: Muundo huu wa kutendwa unafaa kwa Kiswahili na unaakisi matumizi yasiyotaja wazi aliyekipa kisima jina.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lahai-Roi
  rationale: Jina la mahali limenukuliwa kwa sauti badala ya kutafsiriwa ndani ya maandishi; maana yake inaelezwa katika tanbihi kwa sababu muundo wa Kiebrania unaweza kueleweka kwa zaidi ya namna moja.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Inahifadhi kishazi cha kuelekeza usikivu kwa msisitizo wa kawaida na wenye hadhi.
- source_word: בֵּין קָדֵשׁ וּבֵין בָּרֶד
  choice: kati ya Kadeshi na Beredi
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi mahali kilipo kisima pamoja na majina ya maeneo.
theological_decisions:
- issue: Maana ya jina Beer-Lahai-Roi
  choice: Jina limeachwa katika umbo la kunukuu sauti, huku uwezekano wa maana ukitajwa katika tanbihi.
  alternative: Kulitia moja kwa moja katika maandishi kama “Kisima cha Aliye Hai Anionaye.”
  rationale: Kiebrania לַחַי רֹאִי ni kifupi na kinaweza kuhusishwa na ‘Aliye Hai anionaye’ au ‘Aliye Hai niliyemwona’; kutaja maana moja pekee katika maandishi kungesuluhisha utata huo bila lazima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi. Majina ya maeneo yameandikwa kwa maumbo yanayosomeka kwa Kiswahili; “Tazama” limehifadhi nguvu ya הִנֵּה.
