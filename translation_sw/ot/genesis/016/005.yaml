review_pass:
  verdict: revise
  source_fidelity: Draft correctly conveys Sarai’s accusation, Hagar’s conception, and the jussive appeal to Yahweh. However, “akanidharau” makes Hagar the explicit agent of contempt, whereas the Hebrew more directly states Sarai’s resulting low status in Hagar’s estimation. The rendering of בְּחֵיקֶךָ as “kifuani mwako” is overly literal and unnatural in this Swahili sentence.
  naturalness: “Mimi nilimweka mjakazi wangu kifuani mwako” is not idiomatic Standard East African Swahili. Rendering the main clause naturally as giving the female slave to Abram, with the literal idiom preserved in a footnote, is clearer and retains the source detail.
  terminology: “Mtumwa wangu wa kike” states the bonded status denoted by שִׁפְחָה more accurately than “mjakazi.” “Yahweh” appropriately represents יהוה under the supplied project decision. “Na ahukumu” naturally expresses the Hebrew jussive.
  issues:
  - severity: medium
    issue: “kifuani mwako” is an unnatural literalism in the verse body.
    rationale: Though חֵיק literally denotes bosom/lap, its contextual function is intimate reception. In Swahili, the literal phrase sounds spatially and semantically incongruous here; preserve it in a footnote instead.
  - severity: low
    issue: “akanidharau” is more interpretive than the Hebrew wording.
    rationale: וָאֵקַל describes Sarai as becoming slight or of low account in Hagar’s eyes. “Nikawa duni machoni pake” keeps Sarai’s lowered standing without unnecessarily specifying the precise outward action.
  - severity: low
    issue: “mjakazi” can understate the dependent/bonded status of שִׁפְחָה.
    rationale: The term may be understood as an ordinary domestic worker in current Swahili. “Mtumwa wa kike” more clearly reflects the social reality in the source.
  revised_text: Ndipo Sarai akamwambia Abramu, “Dhuluma niliyotendewa iko juu yako.[a] Nilimtoa mtumwa wangu wa kike kwako,[b] na alipoona kwamba ana mimba, nikawa duni machoni pake. Yahweh na ahukumu kati yangu na wewe.”
  revised_footnotes:
