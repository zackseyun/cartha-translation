  to: Ndipo Sarai akamwambia Abramu, “Dhuluma niliyotendewa iko juu yako.[a] Nilimtoa mtumwa wangu wa kike kwako,[b] na alipoona kwamba ana mimba, nikawa duni machoni pake. Yahweh na ahukumu kati yangu na wewe.”
