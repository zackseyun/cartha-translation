    text: Au, “Dhuluma yangu iwe juu yako.” Kiebrania kinaweza kutafsiriwa kwa maneno hayo ya moja kwa moja; katika muktadha Sarai anamshutumu Abramu kuwa anawajibika kwa dhuluma aliyotendewa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kifuani mwako”; hapa ni nahau ya kumpokea katika uhusiano wa karibu wa kingono.
    reason: idiom
  revision_rationale: Revision replaces an awkward literal rendering of the Hebrew idiom with natural Swahili while retaining the literal wording and its contextual sense in a footnote. It also renders Sarai’s diminished status in Hagar’s estimation more closely and makes the female slave’s status explicit.
