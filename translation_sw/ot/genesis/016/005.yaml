  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: sw
  text: Ndipo Sarai akamwambia Abramu, “Dhuluma niliyotendewa iko juu yako.[a] Nilimtoa mtumwa wangu wa kike kwako,[b] na alipoona kwamba ana mimba, nikawa duni machoni pake. Yahweh na ahukumu kati yangu na wewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dhuluma yangu iwe juu yako.” Kiebrania kinaweza kutafsiriwa kwa maneno hayo ya moja kwa moja; katika muktadha Sarai anamshutumu Abramu kuwa anawajibika kwa dhuluma aliyotendewa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kifuani mwako”; hapa ni nahau ya kumpokea katika uhusiano wa karibu wa kingono.
    reason: idiom
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: Dhuluma niliyotendewa iko juu yako
  rationale: חָמָס hapa ni dhuluma au uovu anaodai Sarai ametendewa, na עָלֶיךָ humtwika Abramu wajibu. Kauli hii inadumisha nguvu ya shtaka bila kudokeza kuwa Sarai anakiri kosa lake mwenyewe.
- source_word: שִׁפְחָתִי
  choice: mjakazi wangu
  rationale: שִׁפְחָה humaanisha mtumishi wa kike aliye chini ya mamlaka ya bibi yake, mara nyingi akiwa katika hali ya utumwa. ‘Mjakazi’ ni neno la kawaida la kibiblia katika Kiswahili na linaonyesha hadhi hiyo bila kutumia maelezo marefu ndani ya mstari.
- source_word: בְּחֵיקֶךָ
  choice: kifuani mwako
  rationale: חֵיק ni kifua au paja, na hapa ni nahau ya kupokelewa katika uhusiano wa karibu wa kingono. Tafsiri ya moja kwa moja inahifadhi taswira na staha ya Kiebrania.
- source_word: הָרָתָה
  choice: amepata mimba
  rationale: Kitenzi kinaonyesha kwamba utungaji wa mimba ulikuwa umetokea. Kauli hii ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: akanidharau
  rationale: Mzizi קלל pamoja na nahau ‘machoni pake’ unaonyesha Sarai kupunguziwa heshima katika tathmini ya Hajiri. ‘Akanidharau’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, ingawa taswira halisi imeelezwa katika tanbihi.
- source_word: יִשְׁפֹּט יְהוָה
  choice: Yahweh na ahukumu
  rationale: Umbo la kitenzi lina nguvu ya ombi au mwito wa hukumu ya Mungu, si taarifa rahisi ya wakati ujao. ‘Na ahukumu’ ni mwito wa heshima unaofaa katika Kiswahili.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: kati yangu na wewe
  rationale: Inahifadhi uwazi wa pande mbili na shtaka la moja kwa moja badala ya kulainisha kuwa ‘kati yetu.’
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. ‘Yahweh’ hulihifadhi jina la agano kama jina maalumu bila kulibadili kuwa cheo.
- issue: Nguvu ya יִשְׁפֹּט kama mwito wa hukumu
  choice: na ahukumu
  alternative: atahukumu
  rationale: Muktadha na umbo la kitenzi vinaonyesha Sarai anamwomba Yahweh awe mwamuzi, si kwamba anatabiri tu hukumu ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Ndipo’ huhifadhi mwendelezo wa simulizi; ‘mjakazi’ hufuata sajili ya kawaida ya Biblia huku tanbihi na muktadha vikisaidia kueleza hali yake ya utegemezi. Viashiria [a] na [b] vimewekwa kwenye vifungu vinavyohusika.
