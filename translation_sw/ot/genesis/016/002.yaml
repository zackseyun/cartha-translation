base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: sw
  text: Kisha Sarai akamwambia Abramu, “Tazama sasa, Yahwe amenizuia kuzaa. Tafadhali ingia kwa mtumwa wangu wa kike; huenda nijengwe kupitia kwake.”[a] Naye Abramu akaisikiliza sauti ya Sarai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “huenda nikapata watoto kupitia kwake” au “huenda nikaimarishwa kupitia kwake.” Kiebrania kinasema kihalisi, “huenda nijengwe kutoka/kupitia kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: הִנֵּה נָא
  choice: Tazama sasa
  rationale: Huhifadhi nguvu ya kuvuta usikivu ya הִנֵּה pamoja na נָא kwa lugha ya sasa.
- source_word: עֲצָרַנִי ... מִלֶּדֶת
  choice: amenizuia kuzaa
  rationale: Kitenzi kinaonyesha kuzuiliwa au kutoweza kufanya jambo; usemi huu ni wa asili na hauongezi maelezo yasiyokuwapo katika chanzo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji wa jina binafsi la Mungu katika umbo linalosomeka kwa Kiswahili.
- source_word: בֹּא נָא אֶל
  choice: Tafadhali, uingie kwa
  rationale: Huhifadhi usemi wa staha wa Kiebrania unaomaanisha kujamiana bila kuufanya wazi zaidi kuliko chanzo.
- source_word: שִׁפְחָתִי
  choice: mtumwa wangu wa kike
  rationale: Huhifadhi hadhi ya utumwa inayodokezwa na שִׁפְחָה badala ya kuilegeza kuwa mtumishi wa kawaida.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: huenda nikajengwa kwa njia yake
  rationale: Huhifadhi uwezekano wa אוּלַי na sitiari ya kujengwa katika אִבָּנֶה, huku “kwa njia yake” ikieleza uhusiano wa מִמֶּנָּה kwa Kiswahili kinachoeleweka.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: akaisikiliza sauti ya
  rationale: Huhifadhi muundo wa Kiebrania wa “kusikiliza sauti” na mwangwi wake wa kifasihi badala ya kuufupisha kuwa “akatii.”
theological_decisions:
- issue: Kauli ya Sarai kuhusu nafasi ya Yahwe katika kutokuzaa kwake
  choice: Yahwe amenizuia kuzaa
  alternative: Yahwe hakuniruhusu kuzaa
  rationale: Tafsiri inadumisha dai la moja kwa moja la Sarai kwamba Yahwe ndiye aliyemzuia kuzaa, bila kulipunguza wala kulipanua kitheolojia.
- issue: Kiwango cha uwazi katika usemi wa kujamiana
  choice: uingie kwa mtumwa wangu wa kike
  alternative: ulale na mtumwa wangu wa kike
  rationale: Chanzo kinatumia usemi wa staha; tafsiri inauhifadhi badala ya kuufanya wazi zaidi.
- issue: Sitiari ya Sarai ya “kujengwa” kupitia mtumwa wake
  choice: huenda nikajengwa kwa njia yake
  alternative: huenda nikapata watoto kupitia kwake
  rationale: Uamuzi huu huhifadhi sitiari na mvutano wa maana ya Kiebrania; maana ya kupata watoto au kuanzisha nyumba inaelezwa katika tanbihi bila kulazimishwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Matini inahifadhi usemi wa staha wa Kiebrania kuhusu kujamiana, hadhi halisi ya utumwa, sitiari ya “kujengwa,” na muundo wa “kuisikiliza sauti” bila kuufanya mstari kuwa mgumu kupita kiasi.
