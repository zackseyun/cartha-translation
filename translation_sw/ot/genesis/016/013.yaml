  to: 'Basi alimpa Yahweh, aliyesema naye, jina hili: “Wewe ni Mungu anayeniona”[a], kwa maana alisema, “Je, kweli hata hapa nimeona baada ya yule anayeniona?”[b]'
  rationale: The opening is revised to state explicitly and naturally that Hagar gave Yahweh the following name/designation. This resolves the ambiguity introduced by "akamwita Yahweh" while preserving the Hebrew naming formula's function. The difficult final clause and both footnote anchors are retained unchanged.
