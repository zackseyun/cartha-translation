  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: sw
  text: 'Basi alimpa Yahweh, aliyesema naye, jina hili: “Wewe ni Mungu anayeniona”[a], kwa maana alisema, “Je, kweli hata hapa nimeona baada ya yule anayeniona?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe ni Mungu anayeona,” au “Wewe ni Mungu wa kuona.”
    reason: lexical_alternative
  - marker: b
    text: Sehemu ya mwisho ni Kiebrania kigumu. Huenda maana yake ni, “Je, kweli hata hapa nimemwona na kubaki hai baada ya yeye kuniona?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: akamwita Yahweh
  rationale: Kiswahili hiki kinaeleza kwa kawaida kwamba Hagari alimpa Yahweh jina au sifa ya kumtambulisha, bila kutumia msemo usio wa kawaida ‘akaliita jina la Yahweh,’ ambao unaweza kueleweka kama alitamka tu jina lake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo ‘BWANA.’
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: aliyesema naye
  rationale: Kifungu hiki cha uhusiano kinamtambulisha Yahweh kuwa ndiye aliyekuwa akizungumza na Hagari; ‘alisema naye’ ni Kiswahili cha kawaida na sahihi katika muktadha.
- source_word: אַתָּה אֵל רֳאִי
  choice: Wewe ni Mungu anayeniona
  rationale: Tafsiri hii inawasilisha maana inayowezekana zaidi katika simulizi—Mungu anamwona na kumjali Hagari—huku tanbihi ikihifadhi maana nyingine zinazowezekana za neno gumu רֳאִי.
- source_word: כִּי אָֽמְרָה
  choice: kwa maana alisema
  rationale: Kifungu hiki kinaanzisha sababu au maelezo ya jina alilompa Mungu.
- source_word: הֲגַם הֲלֹם
  choice: Je, kweli hata hapa
  rationale: ‘Kweli’ na ‘hata hapa’ zinaonyesha mshangao na msisitizo wa viambishi vya Kiebrania bila kufanya sentensi kuwa nzito.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: nimeona baada ya yule anayeniona
  rationale: Kifungu cha Kiebrania ni kifupi na kigumu. Tafsiri hii inadumisha neno ‘baada ya’ na utata wa uhusiano kati ya kuona kwa Hagari na kuonekana kwake na Mungu, badala ya kuongeza moja kwa moja wazo la kubaki hai.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu, si cheo; ‘Yahweh’ hulihifadhi kwa namna ya moja kwa moja.
- issue: Maana ya cheo אֵל רֳאִי
  choice: Wewe ni Mungu anayeniona
  alternative: Wewe ni Mungu anayeona; Wewe ni Mungu wa kuona
  rationale: Chaguo kuu linafaa muktadha wa Hagari kutambua kwamba Mungu amemwona katika shida yake, lakini tanbihi inadumisha uwezekano mpana wa muundo wa Kiebrania.
- issue: Maana ya kifungu cha mwisho רָאִיתִי אַחֲרֵי רֹאִי
  choice: Je, kweli hata hapa nimeona baada ya yule anayeniona?
  alternative: Je, kweli hata hapa nimemwona na kubaki hai baada ya yeye kuniona?
  rationale: Kiebrania kina utata wa kisarufi na kimaana. Matini kuu inadumisha mvutano huo; tanbihi inatoa ufafanuzi wa jadi kuhusu Hagari kumwona Mungu na kuendelea kuwa hai bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi kuu ni rahisi kueleweka, huku ugumu halisi wa kifungu cha mwisho ukihifadhiwa badala ya kufichwa kwa ufafanuzi wa kimadhehebu.
