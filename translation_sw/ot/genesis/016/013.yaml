    text: Au, “Wewe ni Mungu anayeona,” au “Wewe ni Mungu wa kuona.”
    reason: lexical_alternative
  - marker: b
    text: Sehemu ya mwisho ni Kiebrania kigumu. Huenda maana yake ni, “Je, kweli hata hapa nimemwona na kubaki hai baada ya yeye kuniona?”
    reason: alternative_reading
  revision_rationale: The opening is revised to state explicitly and naturally that Hagar gave Yahweh the following name/designation. This resolves the ambiguity introduced by "akamwita Yahweh" while preserving the Hebrew naming formula's function. The difficult final clause and both footnote anchors are retained unchanged.
