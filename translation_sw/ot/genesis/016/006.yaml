base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: sw
  text: Kisha Abramu akamwambia Sarai, “Tazama, mtumwa wako wa kike yuko mkononi mwako; mtendee lililo jema machoni pako.” Ndipo Sarai akamtesa[a], naye akakimbia kutoka mbele yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamtendea kwa ukali” au “akamdhulumu.” Kitenzi cha Kiebrania kinaweza kumaanisha kutesa, kudhalilisha, au kutendea kwa ukali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha mazungumzo cha kawaida na chenye hadhi, kinachohifadhi nguvu ya kuelekeza fikira katika Kiebrania.
- source_word: שִׁפְחָתֵךְ
  choice: mtumwa wako wa kike
  rationale: Huweka wazi hali ya utumwa na tofauti ya kijinsia bila kuipunguza kuwa utumishi wa kawaida.
- source_word: בְּיָדֵךְ
  choice: yuko mkononi mwako
  rationale: Huhifadhi nahau ya Kiebrania inayoonyesha kuwa yuko chini ya mamlaka na uwezo wa Sarai.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: mtendee lililo jema machoni pako
  rationale: Huhifadhi nahau ya Kiebrania ya kile kilicho chema machoni mwa mtu, huku maana ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: וַתְּעַנֶּהָ
  choice: akamtesa
  rationale: Kitenzi hiki katika piel huonyesha kumdhuru, kumdhalilisha au kumtendea mtu kwa ukali. “Akamtesa” huonyesha uzito wa tendo bila kubainisha namna ya mateso ambayo kifungu hakitaji.
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: akakimbia kutoka mbele yake
  rationale: Huhifadhi tendo la kukimbia na usemi wa Kiebrania “kutoka mbele yake,” unaoonyesha kuondoka katika uwepo wake.
theological_decisions:
- issue: Hali ya kijamii ya Hagari
  choice: mtumwa wako wa kike
  alternative: kijakazi wako
  rationale: Muktadha unategemea tofauti ya mamlaka katika nyumba. Tafsiri iliyochaguliwa inaweka wazi hali yake ya kufungwa katika utumwa badala ya kuifanya ionekane kuwa ajira au huduma ya kawaida.
- issue: Ukali wa tendo la Sarai katika וַתְּעַנֶּהָ
  choice: akamtesa
  alternative: alimtendea kwa ukali / alimdhulumu
  rationale: Kiebrania kinaonyesha mateso, kudhalilishwa au kutendewa kwa ukali, lakini hakitaji aina kamili ya unyanyasaji. “Akamtesa” huhifadhi uzito huo bila kuongeza maelezo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Nahau kuu za Kiebrania zimehifadhiwa pale zinapoeleweka kwa Kiswahili, huku hali ya utumwa ikiwekwa wazi.
