base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: sw
  text: Akasema, “Hagari, mtumwa wa kike[a] wa Sarai, umetoka wapi, na unakwenda wapi?” Naye akasema, “Ninakimbia kutoka kwa Sarai, bibi yangu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjakazi” au “mtumishi wa kike”; neno la Kiebrania humaanisha mwanamke aliye katika hali ya utumwa chini ya Sarai.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya moja kwa moja, “Ninakimbia kutoka mbele ya Sarai, bibi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: mjakazi
  rationale: Neno hili linaonyesha mwanamke aliye katika hali ya utumishi chini ya Sarai. ‘Mjakazi’ ni neno la Kiswahili lenye staha na linalofaa muktadha wa kale, huku tanbihi ikibainisha kwamba hali hiyo inaweza kueleweka kuwa ya utumwa.
- source_word: אֵי מִזֶּה בָאת
  choice: umetoka wapi
  rationale: Hii ni njia ya kawaida na ya asili ya kuuliza mahali mtu alikotoka, huku ikihifadhi maana ya kirai cha Kiebrania.
- source_word: וְאָנָה תֵלֵכִי
  choice: na unakwenda wapi
  rationale: Kirai hiki huuliza mahali anakoelekea; wakati wa sasa unaoendelea unasikika kwa kawaida katika Kiswahili.
- source_word: מִפְּנֵי
  choice: ninamkimbia
  rationale: Ingawa maana ya moja kwa moja ni ‘kutoka mbele/uweponi mwa,’ katika muktadha huu kirai kinaonyesha kumtoroka mtu. Kitenzi ‘ninamkimbia’ kinawasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: גְּבִרְתִּי
  choice: bibi yangu
  rationale: Umbo la kike linamtaja mwanamke mwenye mamlaka juu ya Hagari. ‘Bibi yangu’ linaonyesha uhusiano huo wa kijamii bila kuongeza maelezo yasiyokuwamo katika aya.
- source_word: בֹּרַחַת
  choice: ninamkimbia
  rationale: Hali ya kushiriki inaonyesha tendo linaloendelea; ‘ninamkimbia’ huhifadhi maana ya kuwa njiani akitoroka.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Kiebrania hakirudii utambulisho wa msemaji katika aya hii; tafsiri inahifadhi hilo badala ya kuongeza ‘malaika wa BWANA’ kutoka aya iliyotangulia.
- source_word: הָגָר
  choice: Hagari
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Jina limetoholewa kwa kufuata matumizi ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kuonyesha hali ya kijamii ya Hagari
  choice: mjakazi
  alternative: mtumwa wa kike
  rationale: ‘Mjakazi’ ni la asili zaidi katika Kiswahili cha kifasihi na linaweza kuonyesha mwanamke aliye chini ya mamlaka ya bibi yake; tanbihi inalinda uzito wa hali ya utumwa uliomo katika neno la Kiebrania.
- issue: Kumtaja wazi msemaji kuwa malaika wa BWANA
  choice: akasema
  alternative: malaika wa BWANA akasema
  rationale: Ingawa msemaji anatambulika katika aya iliyotangulia, aya hii yenyewe ina ‘akasema’ tu. Kutotaja cheo tena kunafuata muundo wa Kiebrania na kuepuka kuongeza maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa urahisi. Mazungumzo yamewekwa kwa mtiririko wa kawaida, huku hali ya Hagari na maana ya kumtoroka Sarai zikihifadhiwa.
