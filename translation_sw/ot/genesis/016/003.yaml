  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: sw
  text: Basi Sarai, mke wa Abramu, akamchukua Hajiri, Mmisri, mtumwa wake wa kike, baada ya Abramu kukaa katika nchi ya Kanaani kwa miaka kumi, akampa Abramu, mume wake, kuwa mke wa Abramu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקַּח
  choice: akamchukua
  rationale: Hii ndiyo maana ya kawaida ya לקח katika usimulizi; kiambishi cha yambwa kinamrejelea Hajiri kwa uwazi.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, mke wa Abramu
  rationale: Muundo wa ufafanuzi unamtambulisha Sarai kwa uhusiano wake na Abramu.
- source_word: הָגָר הַמִּצְרִית
  choice: Hajiri, Mmisri
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili, na kivumishi cha asili kinaonyesha kwamba Hajiri alikuwa mwanamke wa Misri.
- source_word: שִׁפְחָתָהּ
  choice: aliyekuwa kijakazi wake
  rationale: Kijakazi huwasilisha hadhi ya mtumishi wa kike aliyefungwa katika nyumba bila kutumia neno laini lisiloonyesha utegemezi wake; kishazi hiki ni cha asili zaidi katika Kiswahili kuliko mfuatano wa nomino.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: baada ya Abramu kukaa miaka kumi katika nchi ya Kanaani
  rationale: Huwasilisha kwa kawaida kukamilika kwa kipindi cha miaka kumi tangu Abramu aanze kukaa Kanaani.
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: akampa Abramu, mume wake
  rationale: Inaendeleza Sarai kama mtendaji na kuhifadhi utambulisho wa Abramu kuwa mume wake.
- source_word: לוֹ לְאִשָּׁה
  choice: awe mke wake
  rationale: Huhifadhi neno אִשָּׁה kama 'mke' na kueleza kwa Kiswahili cha kawaida kusudi au hadhi iliyokusudiwa na tendo la kumpa.
theological_decisions:
- issue: Hadhi ya Hajiri katika uhusiano wake na Abramu
  choice: Kumwita Hajiri kijakazi wa Sarai na kusema alipewa kwa Abramu awe mke wake.
  alternative: Kusema alipewa awe suria wake.
  rationale: Kiebrania kinatumia אִשָּׁה, 'mke/mwanamke,' wala si neno maalumu la 'suria,' huku kikimtaja pia kuwa שִׁפְחָה wa Sarai. Tafsiri inahifadhi hali hizo mbili na mvutano uliomo bila kuzipatanisha kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Majina 'Abramu,' 'Sarai,' 'Hajiri,' na 'Kanaani' yanafuata maumbo ya Kibiblia yaliyozoeleka. Hakuna tanbihi inayohitajika katika aya hii; taarifa za Kiingereza zilizopewa zinaonekana kuwa na alama za tanbihi zilizohamishwa kimakosa na hazina msingi unaohitaji kuingizwa katika matini ya Kiswahili.
