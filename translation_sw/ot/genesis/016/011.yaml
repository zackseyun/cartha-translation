base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: sw
  text: Kisha malaika[a] wa Yahweh akamwambia, “Tazama, una mimba, nawe utamzaa mwana wa kiume. Utamwita Ishmaeli, kwa sababu Yahweh amesikia mateso yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika’; katika simulizi hili ‘malaika’ linaeleweka kwa kawaida kuwa mjumbe wa mbinguni, huku uhusiano wake na Yahweh ukihifadhiwa bila kuongeza utambulisho wa kitheolojia.
- source_word: הִנָּךְ הָרָה
  choice: Tazama, una mimba
  rationale: ‘Tazama’ linaonyesha mwito wa kuzingatia tangazo, na ‘una mimba’ ni Kiswahili cha sasa, wazi na cha heshima.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: nawe utamzaa mwana
  rationale: Huwasilisha tangazo la kuzaliwa kwa mtoto wa kiume kwa lugha ya asili na yenye uzito wa kibiblia.
- source_word: וְקָרָאת שְׁמוֹ
  choice: Utamwita jina lake
  rationale: Huhifadhi kwa karibu fomula ya Kiebrania ya kuita jina, ambayo ina umuhimu wa kifasihi katika masimulizi ya Biblia.
- source_word: יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili; maana yake inadokezwa na kishazi kinachofuata badala ya kutafsiriwa ndani ya jina.
- source_word: כִּי שָׁמַע יְהוָה
  choice: kwa sababu Yahweh amesikia
  rationale: כִּי hutoa sababu ya jina, na hali timilifu ‘amesikia’ huonyesha tendo lililotokea lenye umuhimu wa sasa.
- source_word: עָנְיֵךְ
  choice: mateso yako
  rationale: Neno hili linaweza kumaanisha dhiki, hali ya kuonewa, au taabu; ‘mateso yako’ ni pana, ya kawaida, na halipunguzi maana kuwa hisia pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Huhifadhi usemi wa Kiebrania na maana yake ya kawaida katika muktadha huu bila kuamua kwa ziada kama mhusika huyu ni udhihirisho maalumu wa Mungu au utambulisho mwingine wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mwana’ na fomula ‘kumwita jina lake’ zinadumisha ladha ya kibiblia bila kufanya sentensi kuwa ngumu; ‘una mimba’ na ‘mateso yako’ ni wazi kwa msomaji wa kawaida.
