- source_word: אֶת יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: אֶת ni alama ya yambwa mahsusi na haitafsiriwi kivyake; jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: לְ/אַבְרָם
  choice: -m- ... Abramu katika 'alimzalia Abramu'
  rationale: Muundo wa Kiswahili 'kumzalia mtu mtoto' unaeleza kwa kawaida uhusiano unaowakilishwa na לְ, huku ukibaki karibu na maana ya kumzaa mtoto kwa ajili ya mtu huyo.
