base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: sw
  text: Ndipo malaika wa Yahweh akamwambia, “Rudi kwa bibi yako, na ujinyenyekeze chini ya mamlaka yake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha mjumbe au malaika; katika simulizi hili la kukutana na Mungu, “malaika” ndiyo tafsiri ya kawaida na ya asili zaidi, huku jina יהוה likihifadhiwa kama Yahweh.
- source_word: שׁוּבִי
  choice: Rudi
  rationale: Ni amri ya nafsi ya pili, umoja wa kike, kutoka שוב; “Rudi” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: גְּבִרְתֵּךְ
  choice: bibi yako
  rationale: Neno hilo humaanisha mwanamke mwenye mamlaka juu ya mwingine. Katika muktadha wa Hajiri na Sarai, “bibi yako” huonyesha uhusiano huo wa kijamii kwa Kiswahili cha kawaida bila maana isiyokusudiwa ya kimapenzi inayoweza kuambatana na “mwanamke wako.”
- source_word: וְהִתְעַנִּי
  choice: ukajinyenyekeze
  rationale: Muundo wa Hitpael unaonyesha mhusika kujitia katika hali ya unyenyekevu au utegemezi. “Jinyenyekeze” huhifadhi nguvu ya kujirejelea na pia uzito wa amri, bila kuamua kimyakimya kuwa maana pekee ni kuvumilia mateso.
- source_word: תַּחַת יָדֶיהָ
  choice: chini ya mamlaka yake
  rationale: Kihalisi ni “chini ya mkono wake,” nahau ya Kiebrania inayomaanisha kuwa chini ya mamlaka au udhibiti wa mtu. Kiswahili cha asili huwasilisha maana hiyo wazi kwa “chini ya mamlaka yake.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuongeza dai jingine la kimadhehebu.
- issue: Ikiwa מַלְאַךְ itafsiriwe “malaika” au “mjumbe”
  choice: malaika
  alternative: mjumbe
  rationale: Neno la Kiebrania linaweza kuwa na maana zote mbili, lakini muktadha wa kiumbe wa mbinguni anayesema kwa mamlaka ya Yahweh unaifanya “malaika” kuwa chaguo la kawaida zaidi. Tafsiri hii haitoi uamuzi kuhusu utambulisho wake wa kina wa kitheolojia.
- issue: Maana ya וְהִתְעַנִּי katika uhusiano wa mamlaka
  choice: ukajinyenyekeze chini ya mamlaka yake
  alternative: ukubali kuteswa chini ya mkono wake
  rationale: Kitenzi kinaweza kuhusiana na kunyenyekezwa au kuteswa, hasa kwa kuzingatia 16:6, lakini hapa muundo wa kujirejelea pamoja na nahau ya kuwa chini ya mkono unaunga mkono amri ya kukubali hali ya chini ya mamlaka. Tafsiri haifanyi mateso kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Ndipo ... akamwambia” hufuata mtiririko wa usimulizi wa Kiebrania kwa njia ya asili. Nahau ya Kiebrania “chini ya mkono wake” imetolewa kwa maana yake ya kawaida, “chini ya mamlaka yake,” ili kuepuka usemi usio wa kawaida au wenye utata katika Kiswahili.
