  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: sw
  text: Malaika wa Yahwe[a] akamkuta kando ya chemchemi ya maji nyikani, kando ya chemchemi iliyo njiani kuelekea Shuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mjumbe wa Yahwe.” Neno la Kiebrania linaweza kumaanisha “malaika” au “mjumbe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: akamkuta
  rationale: Kitenzi מצא hapa kinamaanisha ‘kupata/kukuta’; kiambishi cha yambwa cha kike kinamrejelea Hagari. ‘Akamkuta’ ni simulizi la kawaida na haliongezi maana isiyokuwamo.
- source_word: מַלְאַךְ יְהוָה
  choice: Malaika wa Yahwe
  rationale: מַלְאַךְ inaweza kuwa ‘mjumbe’ au ‘malaika’; katika muktadha huu wa mjumbe wa Mungu, ‘malaika’ ni tafsiri ya kawaida, huku tanbihi ikihifadhi uwezekano wa ‘mjumbe.’ Jina יהוה limetoholewa kuwa ‘Yahwe.’
- source_word: עַל עֵין הַמַּיִם
  choice: kando ya chemchemi ya maji
  rationale: עַיִן pamoja na הַמַּיִם humaanisha chanzo au chemchemi ya maji. עַל hapa inaonyesha mahali karibu na chemchemi, hivyo ‘kando ya’ ni Kiswahili cha asili.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר ni eneo lisilokaliwa au lisilolimwa, si lazima jangwa la mchanga; ‘nyikani’ huhifadhi upana huo wa maana.
- source_word: עַל הָעַיִן
  choice: kando ya chemchemi
  rationale: Kirai hiki kinarejelea tena chemchemi ileile; kurudia ‘chemchemi’ hudumisha uhusiano wa kileksika na ufafanuzi wa mahali.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: iliyo njiani kuelekea Shuri
  rationale: דֶּרֶךְ ni njia au barabara. Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba chemchemi hiyo ilikuwa kwenye njia inayoelekea Shuri.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה katika מַלְאַךְ יְהוָה
  choice: Malaika wa Yahwe
  alternative: Malaika wa BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה, hivyo ‘Yahwe’ hulihifadhi badala ya kulibadili kuwa cheo. Tafsiri haijaribu kuamua zaidi utambulisho au asili ya ‘malaika wa Yahwe.’
- issue: Maana ya מַלְאַךְ
  choice: Malaika
  alternative: Mjumbe
  rationale: Neno la Kiebrania linaweza kumaanisha malaika au mjumbe. ‘Malaika’ linafaa katika muktadha wa mjumbe wa Mungu, lakini tanbihi inaweka wazi maana nyingine halali bila kufuta utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Nyikani’ imechaguliwa badala ya ‘jangwani’ ili kuepuka kudokeza lazima eneo la mchanga. Jina la mahali שׁוּר limetoholewa kwa umbo la Kiswahili ‘Shuri.’
