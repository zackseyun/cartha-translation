  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipengele vya msingi vya Kiebrania: malaika ndiye mtenda, kiambishi cha yambwa kinamrejelea Hagari kwa usahihi katika “akamkuta,” eneo ni chemchemi ya maji nyikani, na chemchemi hiyo iko kwenye njia kuelekea Shuri. Marudio ya “chemchemi” yanahifadhi marudio ya עַיִן katika matini.'
