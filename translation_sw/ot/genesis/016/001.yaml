translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa mara mbili ili iwe wazi kwa msomaji wa kawaida, na jina Sarai limerudiwa ili kuepuka utata wa kiwakilishi. Tanbihi inaweka wazi hali ya kijamii iliyomo katika neno la Kiebrania bila kufanya mstari mkuu kuwa mzito.
