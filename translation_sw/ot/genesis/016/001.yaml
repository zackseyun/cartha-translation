  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: sw
  text: Sarai, mke wa Abramu, hakuwa amemzalia mtoto. Alikuwa na mwanamke mtumwa[a] wa Kimisri aliyeitwa Hagari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kijakazi” au “mtumishi wa kike.” Neno la Kiebrania שִׁפְחָה humaanisha mwanamke wa nyumbani aliyekuwa katika hali ya utumwa, si mwajiriwa huru tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: Sarai
  rationale: Kiunganishi וְ kinaendeleza simulizi; katika Kiswahili mwanzo wa sentensi hauhitaji lazima kutafsiriwa kwa “na.” Jina limeandikwa Sarai kwa namna iliyozoeleka katika Kiswahili.
- source_word: אֵשֶׁת אַבְרָם
  choice: mke wa Abramu
  rationale: Huu ni uhusiano wa wazi wa umilikaji katika mnyororo wa nomino, na “mke wa Abramu” ni Kiswahili cha kawaida na sahihi.
- source_word: לֹא יָלְדָה לוֹ
  choice: hakuwa amemzalia mtoto
  rationale: Kitenzi יָלַד pamoja na לוֹ kinaonyesha kutomzalia mume mtoto. Umoja “mtoto” hapa una maana ya kutokuwa na mwana yeyote, bila kudai kwamba nomino hiyo imo wazi katika Kiebrania.
- source_word: וְלָהּ
  choice: Sarai alikuwa na
  rationale: Muundo wa Kiebrania wa umilikaji, kihalisi “na kwake kulikuwa,” umetolewa kwa Kiswahili cha kawaida. Kurudia jina kunaondoa mkanganyiko unaoweza kusababishwa na viwakilishi viwili vya kike katika sentensi.
- source_word: שִׁפְחָה
  choice: kijakazi[a]
  rationale: Neno linamaanisha mwanamke wa nyumbani aliyekuwa katika hali ya utumwa au utegemezi wa lazima. “Kijakazi” ni neno la Kiswahili lenye staha na linaloeleweka, huku tanbihi ikihifadhi wazi hadhi hiyo ya utumwa.
- source_word: מִצְרִית
  choice: Mmisri
  rationale: Kivumishi cha asili ya Misri kimetolewa kwa nomino ya kawaida ya Kiswahili inayomtaja mwanamke kutoka Misri.
- source_word: וּשְׁמָהּ הָגָר
  choice: aliyeitwa Hagari
  rationale: Huhifadhi utambulisho wa jina kwa Kiswahili cha asili. “Hagari” ni umbo la jina lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
