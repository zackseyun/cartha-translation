  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: sw
  text: Naye atakuwa mtu kama punda-mwitu[a]; mkono wake utakuwa dhidi ya kila mtu, na mkono wa kila mtu utakuwa dhidi yake; naye ataishi mkabala na ndugu zake wote[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, ni “punda-mwitu wa mtu.” Mfano huu unamlinganisha na punda-mwitu; hausemi tu kwamba yeye ni “mtu wa porini.”
    reason: lexical_alternative
  - marker: b
    text: Au “mbele ya,” “katika uwepo wa,” au “kinyume na.” Maneno ya Kiebrania yanaweza kumaanisha kuishi mbele ya, mkabala na, au dhidi ya ndugu zake.
    reason: lexical_alternative
  - marker: c
    text: Neno “ndugu” hapa linaweza kujumuisha jamaa wa karibu au makabila yenye uhusiano wa ukoo, si ndugu wa tumbo moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: mtu aliye kama punda-mwitu
  rationale: Huhifadhi wazi mfano halisi wa punda-mwitu huku ikitoa Kiswahili cha kawaida na kinachoeleweka; haififishi picha hiyo kuwa ‘mtu wa porini’ tu.
- source_word: אָדָם
  choice: mtu
  rationale: Hapa neno hilo linamhusu Ishmaeli kama mtu mmoja, si wanadamu kwa ujumla.
- source_word: יָדוֹ בַכֹּל
  choice: mkono wake utakuwa dhidi ya kila mtu
  rationale: Huhifadhi taswira ya ‘mkono’ na maana ya upinzani au uhasama inayodokezwa katika muktadha.
- source_word: וְיַד כֹּל בּוֹ
  choice: na mkono wa kila mtu dhidi yake
  rationale: Huhifadhi usambamba wa Kiebrania na uhasama unaotendana pande zote mbili.
- source_word: וְעַל־פְּנֵי
  choice: kukabiliana na
  rationale: 'Kifungu hiki kinaweza kueleza mahali au uhusiano: mbele ya, mkabala na, au katika hali ya ukaidi. ‘Kukabiliana na’ huhifadhi mvutano huo bila kuufunga kwa mwelekeo wa dira.'
- source_word: כָּל־אֶחָיו
  choice: ndugu zake wote
  rationale: ‘Ndugu’ ndiyo tafsiri ya msingi na pia inaweza kutumiwa kwa jamaa au watu wenye uhusiano wa ukoo.
- source_word: יִשְׁכֹּן
  choice: ataishi
  rationale: Ni Kiswahili cha sasa na cha kawaida kwa maana ya kukaa au kuishi mahali, huku kikifaa sauti ya unabii.
theological_decisions:
- issue: Jinsi ya kueleza sitiari פֶּרֶא אָדָם inayomhusu Ishmaeli
  choice: 'Kudumisha wazi mfano wa mnyama: ‘mtu aliye kama punda-mwitu’'
  alternative: mtu wa porini / mtu mkali
  rationale: Kiebrania kinamlinganisha moja kwa moja na punda-mwitu. Tafsiri haipaswi kuondoa sitiari hiyo wala kuongeza hukumu ya kimaadili isiyotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi sitiari ya Kiebrania na usambamba wa vifungu viwili vya ‘mkono,’ huku utata wa וְעַל־פְּנֵי ukielezwa katika tanbihi.
