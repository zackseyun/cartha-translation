  naturalness: 'Kiswahili cha rasimu kwa ujumla ni sanifu. ‘Atakuwa mtu kama punda-mwitu’ ni fupi na ya asili zaidi kuliko ‘mtu aliye kama punda-mwitu.’ Tanbihi c inahitaji kusahihishwa kisarufi: neno ‘ndugu’ ni la ngeli ya 9, hivyo ‘linaweza’ haipatani nalo bila kutaja ‘neno.’'
