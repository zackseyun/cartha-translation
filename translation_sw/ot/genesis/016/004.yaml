base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: sw
  text: Akamwingilia Hagari, naye akapata mimba. Alipoona kwamba amepata mimba, bibi yake akawa duni machoni pake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hagari akaanza kumdharau bibi yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kwamba bibi yake alionekana duni machoni mwa Hagari au kwamba Hagari alimdharau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל
  choice: akamwingilia
  rationale: Katika muktadha huu, nahau ya Kiebrania inaashiria kujamiana. “Akamwingilia” ni usemi wa Kiswahili wenye staha unaohifadhi maana bila maelezo ya wazi kupita kiasi.
- source_word: הָגָר
  choice: Hagari
  rationale: Jina limetoholewa kwa umbo linalotambulika na linalofaa katika Kiswahili.
- source_word: וַתַּהַר / הָרָתָה
  choice: akapata mimba / amepata mimba
  rationale: Uradidi wa “kupata mimba” unadumisha uradidi wa mzizi wa Kiebrania huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: וַתֵּרֶא כִּי
  choice: Alipoona kwamba
  rationale: Huhifadhi kitenzi cha kuona na mtiririko wa wakati katika simulizi, bila kukibadili kuwa “alipotambua” pekee.
- source_word: וַתֵּקַל
  choice: akawa wa kudharauliwa
  rationale: Huwakilisha hali ya kuhesabiwa duni au kustahili dharau, huku ikiepuka kudai moja kwa moja kwamba Hagari alionyesha dharau kwa matendo.
- source_word: גְּבִרְתָּהּ
  choice: bibi yake
  rationale: “Bibi” hapa ni neno la Kiswahili kwa mwanamke mwenye mamlaka juu ya mtumishi wa kike, yaani mistress, na linafaa katika mazingira haya ya kijamii.
- source_word: בְּעֵינֶיהָ
  choice: machoni pake
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha katika tathmini au mtazamo wake.
theological_decisions:
- issue: Iwapo kifungu cha mwisho kinaeleza mabadiliko katika tathmini ya Hagari au tendo la Hagari la kumdharau Sarai
  choice: bibi yake akawa wa kudharauliwa machoni pake
  alternative: akaanza kumdharau bibi yake
  rationale: Muundo uliochaguliwa hufuata kisarufi sentensi ya Kiebrania, ambamo “bibi yake” ndiye kiima, na unahifadhi mvutano kati ya kuwa duni katika tathmini ya Hagari na kudharauliwa naye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya kisasa, yenye staha na inayofaa simulizi la Biblia. Nahau “machoni pake” imehifadhiwa kwa kuwa inaeleweka, na tanbihi inaweka wazi maana yake pamoja na uwezekano mwingine wa kisarufi.
