  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: sw
  text: Hagari akamzalia Abramu mwana, naye Abramu akamwita mwanawe, ambaye Hagari alimzaa, Ishmaeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mtiririko mwingine, “Abramu akampa mwanawe, ambaye Hagari alimzaa, jina la Ishmaeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: akamzalia
  rationale: Kitenzi ילד katika Qal, kikiwa na mtenda wa kike, humaanisha kuzaa. Muundo wa Kiswahili “akamzalia Abramu” pia unaonyesha uhusiano unaowakilishwa na לְ.
- source_word: לְאַבְרָם
  choice: Abramu
  rationale: 'Kiambishi cha mtendewa katika “akamzalia Abramu” kinawasilisha maana ya לְאַבְרָם kwa Kiswahili cha kawaida: Hagari alimzaa mtoto akiwa mwana wa Abramu.'
- source_word: בֵּן
  choice: mwana
  rationale: “Mwana” ni neno la kawaida na lenye hadhi katika simulizi la kibiblia, na muktadha unaonyesha wazi kuwa ni mwana wa kiume.
- source_word: וַיִּקְרָא ... שֵׁם
  choice: akamwita ... jina la
  rationale: Muundo huu wa Kiswahili unahifadhi dhana iliyo wazi ya kumpa au kumwita mtu jina, bila kutumia tafsiri ya neno kwa neno isiyo ya kawaida.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kiambishi “-we” kinaonyesha kwa uwazi umilikaji wa Abramu kama ulivyo katika kiambishi cha Kiebrania.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: ambaye Hagari alimzaa
  rationale: Kishazi hiki kinamhusisha mwana aliyetajwa na kinadumisha kutajwa tena kwa Hagari kama katika chanzo.
- source_word: יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: “Ishmaeli” ni umbo la jina hili lililozoeleka katika Kiswahili cha Biblia.
