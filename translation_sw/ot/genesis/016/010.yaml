  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: sw
  text: Kisha malaika wa Yahweh akamwambia[a], “Nitauzidisha sana uzao wako, nao hautaweza kuhesabika kwa sababu ya wingi wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” na umbo la mfululizo “akamwambia” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha mjumbe au malaika. Katika usemi huu wa Mwanzo, “malaika” ndiyo tafsiri iliyozoeleka na inayofaa muktadha, huku “mjumbe” ikihifadhiwa katika tanbihi kama uwezekano wa kileksika.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la kibinafsi lililo katika maandishi ya Kiebrania.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Nitauzidisha sana
  rationale: Muundo wa kitenzi-jina kamili pamoja na kitenzi chenye ukomo unasisitiza ukubwa wa tendo. “Nitauzidisha sana” huwasilisha msisitizo huo kwa Kiswahili cha asili bila kuugeuza kuwa kiapo cha uhakika.
- source_word: זַרְעֵךְ
  choice: uzao wako
  rationale: זֶרַע ni nomino ya umoja yenye maana ya kijumla. “Uzao” huhifadhi maana hiyo na inaweza kurejelea vizazi vingi bila kulazimisha wingi wa kisarufi.
- source_word: וְלֹא יִסָּפֵר
  choice: hata usiweze kuhesabiwa
  rationale: Niphal ya ספר hapa ina maana ya kuhesabiwa. “Hata usiweze kuhesabiwa” huonyesha matokeo ya kuongezeka sana na hali ya kutohesabika kwa lugha ya kawaida.
- source_word: מֵרֹב
  choice: kwa sababu ya wingi wake
  rationale: 'מִן pamoja na רֹב hutoa sababu: kwa kuwa ni mwingi sana. Kiwakilishi “wake” kinarejelea “uzao,” nomino ya umoja wa kijumla.'
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo au kutumia namna nyingine ya utohozi.
- issue: Utambulisho na maana ya מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: “Malaika” inafaa kwa fomula hii ya simulizi, lakini neno la Kiebrania pia linaweza kumaanisha “mjumbe.” Tanbihi huhifadhi uwezekano huo bila kuamua zaidi utambulisho wa mhusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akamwambia” ni wa kawaida katika masimulizi ya Biblia; “uzao” huhifadhi umoja wa kijumla wa Kiebrania.
