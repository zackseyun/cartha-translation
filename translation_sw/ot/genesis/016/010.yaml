- from: Kisha malaika wa Yahweh akamwambia[a], “Nitauzidisha sana uzao wako, hata usiweze kuhesabiwa kwa sababu ya wingi wake.”
  to: Kisha malaika wa Yahweh akamwambia[a], “Nitauzidisha sana uzao wako, nao hautaweza kuhesabika kwa sababu ya wingi wake.”
  rationale: 'The revision changes only the final clause to ensure that “uzao wako” is its grammatical subject: “nao hautaweza kuhesabika.” This preserves the Hebrew sense that the offspring will be too numerous to count, rather than suggesting that Hagar herself cannot be counted.'
  reviewer_model: gpt-5.6-terra
