review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the narrative progression, the divine name, the emphatic promise to multiply Hagar's collective offspring, and the reason given for their innumerability. However, “hata usiweze kuhesabiwa” has second-person singular agreement and therefore grammatically addresses Hagar (“so that you cannot be counted”), rather than referring to “uzao wako.”
  naturalness: The wording is generally clear Standard East African Swahili. Revising the final clause with class-3 agreement makes the reference natural and unambiguous.
  terminology: “Malaika wa Yahweh,” “uzao wako,” and the footnoted alternative “mjumbe wa Yahweh” are appropriate. “Yahweh” consistently preserves the Tetragrammaton.
  issues:
  - severity: high
    issue: Incorrect subject agreement in “hata usiweze kuhesabiwa.”
    rationale: The prefix u- here is naturally read as second-person singular, making Hagar, not her offspring, the entity unable to be counted. The Hebrew verb refers to זַרְעֵךְ (“your offspring”). Class-3 agreement should explicitly refer back to “uzao.”
  revised_text: Kisha malaika wa Yahweh akamwambia[a], “Nitauzidisha sana uzao wako, nao hautaweza kuhesabika kwa sababu ya wingi wake.”
  revised_footnotes:
  - marker: a
    text: Au “mjumbe wa Yahweh.”
    reason: lexical_alternative
  revision_rationale: 'The revision changes only the final clause to ensure that “uzao wako” is its grammatical subject: “nao hautaweza kuhesabika.” This preserves the Hebrew sense that the offspring will be too numerous to count, rather than suggesting that Hagar herself cannot be counted.'
