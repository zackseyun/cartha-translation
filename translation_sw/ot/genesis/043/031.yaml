  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: sw
  text: Kisha akaosha uso wake, akatoka, akajizuia, akasema, “Leteni chakula[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkate”; hapa neno hilo huenda limetumiwa kwa maana pana ya chakula au mlo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: akaosha
  rationale: Kitenzi רחץ humaanisha kuosha; hapa kinarejelea Yusufu kuosha uso baada ya kulia.
- source_word: פָּנָיו
  choice: uso wake
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, kwa kawaida humaanisha uso wa mtu mmoja.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: יצא humaanisha kutoka; simulizi linaonyesha Yusufu akitoka mahali alipokuwa faraghani.
- source_word: וַיִּתְאַפַּק
  choice: akajizuia
  rationale: Hapa umbo la hitpael la אפק linaonyesha kuwa alidhibiti hisia zake baada ya kulia. 'Akajizuia' ni la kawaida na linahifadhi wazo la kujidhibiti.
- source_word: שִׂימוּ
  choice: Leteni
  rationale: Ingawa maana ya msingi ni 'wekeni,' katika muktadha wa mlo amri hii ina maana ya kuleta au kuandaa chakula ili kiliwe. 'Leteni' ni ya kawaida katika Kiswahili na haiongezi wazo la kupika.
- source_word: לָחֶם
  choice: chakula
  rationale: לֶחֶם humaanisha hasa 'mkate,' lakini mara nyingi hutumiwa kwa maana pana ya chakula au mlo. Katika karamu hii, 'chakula' ndiyo maana ya kimuktadha.
