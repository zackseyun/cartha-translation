lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu inayounga mkono hoja ya Yuda kwa baba yake.
- source_word: לוּלֵא
  choice: kama tusingali-
  rationale: Muundo huu unaonyesha sharti lisilotimia kuhusu wakati uliopita; Kiswahili sanifu hulieleza kwa muundo wa ‘kama tusingali…’.
- source_word: הִתְמַהְמָהְנוּ
  choice: kawia
  rationale: Kitenzi kinaweza kumaanisha kuchelewa, kukawia, au kusita. ‘Kukawia’ ni cha kawaida na kinafaa kwa kuahirishwa kwa safari katika muktadha huu.
- source_word: כִּי עַתָּה
  choice: kufikia sasa
  rationale: Katika matokeo ya sharti lisilotimia, maneno haya yanaelekeza kwenye jambo ambalo lingekuwa tayari limetokea kufikia wakati wa sasa.
- source_word: שַׁבְנוּ
  choice: tungalikuwa tumerudi
  rationale: Ingawa ni umbo la timilifu katika Kiebrania, hapa linaonyesha matokeo ambayo yangalitokea kama sharti lingetimizwa.
- source_word: זֶה פַעֲמָיִם
  choice: mara mbili
  rationale: Hii ni nahau ya Kiebrania yenye maana ya ‘mara mbili’; tafsiri hii ni ya asili na wazi katika Kiswahili.
