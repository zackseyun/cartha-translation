  text: Kwa maana kama tusingalikawia[a], kufikia sasa tungalikuwa tumerudi mara mbili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tusingalichelewa” au “tusingalisita.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchelewa, kukawia, au kusita.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tungerudi mara hizi mbili”; huu ni usemi wa Kiebrania unaomaanisha “tungerudi mara mbili.”
