translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatofautisha “nafaka” katika sehemu ya kwanza na “chakula” katika ombi, kama yalivyo maneno tofauti katika Kiebrania. Hakuna tanbihi inayohitajika kwa kuwa tofauti hiyo imeonekana moja kwa moja katika matini.
