  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: sw
  text: Walipomaliza kula nafaka waliyoileta kutoka Misri, baba yao akawaambia, “Rudini, mkatununulie chakula kidogo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Walipokuwa
  rationale: Muundo huu unaingiza tukio linalofuata kwa Kiswahili cha kawaida huku ukihifadhi uhusiano wa wakati na mtiririko wa simulizi.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: wamemaliza kula
  rationale: Kitenzi pamoja na jina-kitenzi huonyesha kukamilika kwa tendo la kula; wakati timilifu unafaa kwa tukio lililotangulia kauli ya baba yao.
- source_word: הַשֶּׁבֶר
  choice: nafaka
  rationale: Katika simulizi la Yosefu, neno hili linamaanisha hasa nafaka iliyonunuliwa wakati wa njaa, si chakula kwa ujumla.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: waliyoileta kutoka Misri
  rationale: Kishazi rejeshi ni cha asili katika Kiswahili na kinaonyesha wazi kwamba nafaka hiyo ilikuwa imeletwa kutoka Misri.
- source_word: אֲבִיהֶם
  choice: baba yao
  rationale: Huhifadhi neno la uhusiano lililotumiwa katika Kiebrania bila kulibadili kuwa jina Yakobo.
- source_word: שֻׁבוּ
  choice: Rudini
  rationale: Amri hii inawataka wafanye safari ya kurudi; “Rudini” ni ya kawaida, fupi, na yenye hadhi.
- source_word: שִׁבְרוּ
  choice: mkanunue
  rationale: Katika muktadha huu kitenzi kinamaanisha kununua nafaka au mahitaji; kiunganishi “mka-” huonyesha hatua inayofuata baada ya kurudi.
- source_word: לָנוּ
  choice: kwa ajili yetu
  rationale: Hutoa wazi maana ya kielekezi cha manufaa katika Kiswahili cha kawaida.
- source_word: מְעַט אֹכֶל
  choice: chakula kidogo
  rationale: Huhifadhi neno pana “chakula” na kiasi kidogo kinachoonyeshwa na מְעַט.
