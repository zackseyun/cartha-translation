  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: sw
  text: 'Ndipo Israeli, baba yao, akawaambia, “Ikiwa ni lazima iwe hivyo, basi fanyeni hivi: chukueni baadhi ya vitu bora vya nchi[a] katika vyombo vyenu, mkampelekee yule mtu zawadi—zeri kidogo, asali kidogo[b], resini yenye harufu nzuri na manemane[c], njugu za pistachio na lozi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baadhi ya bidhaa bora za nchi.” Usemi wa Kiebrania unahusu kwa upana vitu au bidhaa teule za nchi, si matunda pekee.
    reason: lexical_alternative
  - marker: b
    text: Katika baadhi ya miktadha, neno lililotafsiriwa “asali” linaweza kumaanisha sharubati tamu badala ya asali ya nyuki.
    reason: lexical_alternative
  - marker: c
    text: Utambulisho kamili wa vitu vya Kiebrania vilivyotafsiriwa “resini yenye harufu nzuri” na “manemane” hauna hakika; huenda vilikuwa aina mbalimbali za utomvu wenye harufu, kama vile gundi ya tragakanti au ladano.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: Israeli, baba yao
  rationale: Inadumisha jina ‘Israeli’ linalotumiwa kwa Yakobo katika simulizi hili na uhusiano wake wa kuwa baba yao, kwa mpangilio wa asili katika Kiswahili.
- source_word: אִם כֵּן אֵפוֹא
  choice: Ikiwa ni lazima iwe hivyo, basi
  rationale: Tamko hili linaonyesha kukubali hali kwa kusita, si sharti la kawaida tu.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: baadhi ya mazao bora ya nchi
  rationale: Neno hili linahusu bidhaa au mazao teule ya nchi kwa upana, wala si matunda pekee.
- source_word: בִּכְלֵיכֶם
  choice: katika vyombo vyenu
  rationale: Neno la Kiebrania ni la jumla kwa vifaa au vyombo; ‘vyombo’ huepuka kubainisha bila msingi kuwa ni mifuko.
- source_word: וְהוֹרִידוּ לָאִישׁ
  choice: mkampelekee yule mtu
  rationale: Kitenzi kinaeleza kupeleka kitu chini kuelekea Misri; Kiswahili cha muktadha hutumia kwa kawaida ‘pelekea’, huku ‘yule mtu’ likirejelea afisa aliyekwisha tajwa.
- source_word: מִנְחָה
  choice: zawadi
  rationale: Katika muktadha huu ni zawadi ya heshima, si lazima sadaka ya ibada wala ushuru wa kisiasa.
- source_word: צֳרִי
  choice: zeri
  rationale: ‘Zeri’ ni neno linaloeleweka kwa dawa au mafuta ya utomvu yenye thamani, na linaendana na bidhaa hii ya mimea.
- source_word: דְּבַשׁ
  choice: asali
  rationale: ‘Asali’ ndiyo maana ya kawaida, ingawa katika baadhi ya miktadha neno hilo linaweza kutaja sharubati tamu.
- source_word: נְכֹאת
  choice: resini yenye harufu nzuri
  rationale: Utambulisho wa mmea husika hauna hakika; tafsiri pana inaonyesha kuwa ni utomvu wa mmea wenye harufu bila kudai spishi fulani.
- source_word: לֹט
  choice: manemane
  rationale: Hili ni chaguo la jadi na linalotambulika, lakini utambulisho wake wa kibotania unabaki na mashaka na umeelezwa katika tanbihi.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: njugu za pistachio na lozi
  rationale: Majina haya ya sasa yanabainisha kwa usahihi aina mbili za kokwa zilizotajwa.
