  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa sasa. Muundo wa sentensi unahifadhi kukubali kwa Israeli kwa kusita na orodha ya bidhaa, huku tanbihi zikidumisha kutokuwa na hakika kwa majina ya mimea.
