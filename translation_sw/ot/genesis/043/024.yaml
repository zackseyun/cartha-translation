base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: sw
  text: Yule mtu akawaingiza[a] wale watu[b] nyumbani mwa Yosefu, akawapa maji, nao wakaosha miguu yao; kisha akawapa punda wao malisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaongoza wale watu kuingia nyumbani mwa Yosefu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “mtu” na “watu”; aya hii haisemi wazi kwamba mtu huyo alikuwa msimamizi wa nyumba ya Yosefu wala kwamba watu hao walikuwa ndugu wa Yosefu, ingawa muktadha unaonyesha hivyo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: akawaingiza
  rationale: Kitenzi cha Kiebrania katika kausativi kinaonyesha kwamba mtu huyo aliwafanya waingie; “akawaingiza” ni ya asili katika Kiswahili na huhifadhi mwendo wa kuingia ndani.
- source_word: הָאִישׁ
  choice: Yule mtu
  rationale: Kiebrania kinasema tu “mtu huyo”; ingawa muktadha unaonyesha alikuwa msimamizi wa nyumba ya Yosefu, cheo hicho hakijatajwa katika aya hii.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Neno la Kiebrania ni neno la kawaida linalomaanisha “watu/wanaume.” Muktadha unaonyesha ni ndugu za Yosefu, lakini aya yenyewe haiwaiti hivyo.
- source_word: בֵּיתָה יוֹסֵף
  choice: nyumbani mwa Yosefu
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kuingia ndani ya nyumba; muundo huu wa Kiswahili unaeleweka kwa kawaida pamoja na “akawaingiza.”
- source_word: וַיִּתֶּן מַיִם
  choice: akawapa maji
  rationale: Kiswahili huhitaji mtendewa katika muundo huu; “-wa-” humrejelea wale watu bila kuongeza maana mpya.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: nao wakaosha miguu yao
  rationale: 'Kitenzi cha Kiebrania ni tendaji na cha wingi: watu hao wenyewe ndio wanaotajwa kuwa waliosha miguu yao. Tafsiri tendwa ingeongeza jambo lisilosemwa.'
- source_word: מִסְפּוֹא
  choice: malisho
  rationale: Neno hili humaanisha chakula cha wanyama; “malisho” ni neno la kawaida na linalofaa katika Kiswahili cha sasa.
- source_word: לַחֲמֹרֵיהֶם
  choice: akawapa punda wao
  rationale: Kihusishi kinaonyesha walengwa wa malisho. Katika Kiswahili, “akawapa punda wao malisho” huwasilisha kwa kawaida kwamba malisho yalipewa punda hao.
