translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa sasa. Muundo “nao wakaosha” unatenganisha wazi tendo la mtu huyo na tendo la wageni, huku ukihifadhi mfuatano wa Kiebrania.
