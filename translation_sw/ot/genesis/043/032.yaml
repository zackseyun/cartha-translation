base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: sw
  text: Wakamwandalia chakula yeye peke yake, na ndugu zake peke yao, na Wamisri waliokula pamoja na Yosefu peke yao, kwa maana Wamisri hawakuweza kula pamoja na Waebrania[a], kwa sababu jambo hilo ni chukizo kwa Wamisri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kula mkate pamoja na Waebrania,” nahau yenye maana ya kushiriki mlo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Wakamwandalia chakula
  rationale: Kitenzi hiki kimsingi humaanisha ‘waliweka,’ lakini katika muktadha wa mlo kinaeleza kuwa chakula kiliandaliwa au kuwekwa mbele ya wale waliokula. ‘Wakamwandalia chakula’ ni Kiswahili cha kawaida kinachowasilisha tendo hilo bila kudokeza kuwa walitenga watu kwa nguvu.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: peke yake / peke yao
  rationale: Marudio haya yanahifadhi msisitizo wa Kiebrania kuhusu makundi matatu kula kwa kutengana.
- source_word: וְלָהֶם
  choice: na ndugu zake
  rationale: Kiwakilishi ‘wao’ kinawarejelea ndugu za Yosefu katika muktadha. Kutaja ‘ndugu zake’ huondoa utata usio wa maana katika Kiswahili huku kukihifadhi kinachorejelewa.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: waliokula pamoja naye
  rationale: Umbo la kitenzi-shirikishi limetolewa kwa kishazi cha uhusiano cha kawaida katika simulizi la Kiswahili.
- source_word: לֹא יוּכְלוּן
  choice: hawakuweza
  rationale: Huhifadhi maana ya kutoweza, ambayo katika muktadha huu inahusisha mwiko wa kijamii au kitamaduni bila kuufafanua zaidi ya maandishi.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: kula pamoja na Waebrania
  rationale: Kauli ya Kiebrania, kihalisi ‘kula mkate pamoja na Waebrania,’ ni nahau ya kushiriki mlo. Kiswahili cha kawaida hutumia ‘kula pamoja na’ kwa maana hiyo; tafsiri halisi imehifadhiwa katika tanbihi.
- source_word: תּוֹעֵבָה
  choice: chukizo
  rationale: ‘Chukizo’ lina uzito unaofaa kwa kitu kinachoonekana kuwa cha kuchukiza au kisichokubalika kabisa kidini au kitamaduni, bila kuongeza sababu ambayo maandishi hayatoi.
- source_word: מִצְרִים / הָעִבְרִים
  choice: Wamisri / Waebrania
  rationale: Haya ndiyo majina ya kawaida ya makundi hayo katika Kiswahili na yanahifadhi utofautishaji wa kikabila ulio muhimu katika mstari.
theological_decisions:
- issue: Sababu hasa ya chukizo hilo
  choice: Haijafafanuliwa; mstari unasema tu kwamba kula pamoja na Waebrania kulikuwa chukizo kwa Wamisri.
  alternative: Kueleza kuwa sababu ilikuwa ya kidini, kikabila, kitabaka, au ilihusu vyakula fulani.
  rationale: Maandishi ya Kiebrania hayataji sababu mahususi. Tafsiri haipaswi kuamua mvutano huu kwa kuingiza maelezo ya nje.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa marudio ‘peke yake/peke yao’ umehifadhiwa ili kuonyesha wazi utengano wa makundi matatu, huku ‘kula pamoja’ likiwa chaguo la kawaida na linaloeleweka kwa wasomaji wa leo.
