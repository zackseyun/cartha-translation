  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: sw
  text: Basi wakamkaribia yule mtu aliyekuwa msimamizi wa nyumba ya Yosefu, wakazungumza naye kwenye mlango wa nyumba.[a]
