lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: wakamkaribia
  rationale: Kitenzi נגשׁ kinaonyesha kusogea karibu na mtu; “wakamkaribia” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Kiebrania kinasema tu “mtu”; “yule” humrejelea mtu aliyetajwa katika muktadha bila kuongeza cheo kisichotajwa hapa.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: aliyekuwa msimamizi wa nyumba ya Yosefu
  rationale: Muundo wenye עַל unaonyesha mamlaka au usimamizi. “Msimamizi wa nyumba” ni usemi wa asili unaoonyesha kwamba alisimamia shughuli za nyumba ya Yosefu.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: wakazungumza naye
  rationale: דבר אֶל humaanisha kusema au kuzungumza na mtu; “wakazungumza naye” huunganisha simulizi kwa kawaida na maneno yanayofuata.
- source_word: פֶּתַח הַבָּיִת
  choice: kwenye mwingilio wa nyumba
  rationale: פֶּתַח inaweza kumaanisha sehemu ya kuingilia au mlango. “Mwingilio” huonyesha eneo la kuingilia bila kulazimisha maana finyu ya mlango wenyewe.
