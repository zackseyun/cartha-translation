  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: sw
  text: Nao wakaketi mbele yake kwa mpangilio wa kuzaliwa, kuanzia mzaliwa wa kwanza hadi mdogo zaidi; watu hao wakatazamana kwa mshangao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: wakaketi
  rationale: Kitenzi kiko katika kauli tendaji na kinaendeleza simulizi. “Wakaketi” ni Kiswahili cha kawaida bila kuingiza wazi wazo la kwamba walipangiwa viti, ingawa muktadha unaonyesha mpangilio.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Huhifadhi maana ya mahali na uhusiano wao na Yusufu kwa lugha ya kawaida ya Kiswahili.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: mzaliwa wa kwanza kwa kufuata mpangilio wa kuzaliwa kwake
  rationale: “Mzaliwa wa kwanza” huhifadhi hadhi ya בכור, huku katika muktadha wa kuketi בכורה ikieleweka hasa kuwa nafasi katika mpangilio wa kuzaliwa, si haki ya urithi pekee.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: hadi mdogo zaidi kwa kufuata udogo wake
  rationale: Mlingano na mzaliwa wa kwanza unaonyesha safu nzima hadi aliye mdogo zaidi. “Udogo wake” huhifadhi kwa kadiri iwezekanavyo ulinganifu wa Kiebrania unaotaja hali ya kuwa mdogo.
- source_word: וַיִּתְמְהוּ
  choice: wakatazamana kwa mshangao
  rationale: תמה huonyesha kushangaa. Pamoja na אִישׁ אֶל־רֵעֵהוּ, tafsiri hii huonyesha mwitikio wa pamoja kwa Kiswahili cha asili.
- source_word: הָאֲנָשִׁים
  choice: watu hao
  rationale: Huhifadhi rejeleo la jumla la Kiebrania kwa watu wanaume bila kuongeza moja kwa moja kwamba walikuwa ndugu zake Yusufu; katika Kiswahili cha sasa “watu hao” ni ya asili zaidi kuliko “wanaume hao” hapa.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: wakatazamana
  rationale: Umbo la kutendeana linafikisha maana ya kila mmoja kumwelekea mwenzake kwa ufupi na kwa ufasaha.
