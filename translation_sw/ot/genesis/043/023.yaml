base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: sw
  text: Akasema, “Amani iwe kwenu. Msiogope. Mungu wenu na Mungu wa baba yenu amewapa hazina[a] ndani ya magunia yenu. Fedha yenu ilinifikia[b].” Kisha akamtoa Simeoni na kumleta kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hazina iliyofichwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “Pesa yenu ilinifikia.” Neno la Kiebrania linalomaanisha “fedha” mara nyingi hutumiwa kumaanisha pesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: Amani iwe kwenu
  rationale: Hii ni kauli ya kuwatuliza yenye maana ya salamu au baraka; inahifadhi kiini cha שָׁלוֹם kwa Kiswahili cha kawaida na chenye heshima.
- source_word: אַל תִּירָאוּ
  choice: Msiogope
  rationale: Ni katazo la wingi linalowalenga ndugu wote, na hili ndilo tamko la kawaida la Kiswahili.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: Mungu wenu na Mungu wa baba yenu
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, hapa inamtaja Mungu mmoja; pia 'baba' inabaki umoja kama katika Kiebrania.
- source_word: נָתַן לָכֶם
  choice: amewapa
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililotokea ambalo matokeo yake yako wazi sasa katika magunia yao.
- source_word: מַטְמוֹן
  choice: hazina iliyofichwa
  rationale: Neno lina maana ya kitu cha thamani kilichofichwa au kuhifadhiwa; kauli hii inabeba maana hiyo kwa uwazi bila kudai kuwa fedha hiyo ilikuwa hazina tofauti.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: ndani ya magunia yenu
  rationale: Magunia yanafaa kwa muktadha wa kubebea nafaka, na 'ndani ya' huonyesha wazi mahali kilipokuwa kitu hicho.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: Fedha yenu ilinifikia
  rationale: Neno כֶּסֶף linaweza kumaanisha fedha kama metali au pesa; 'ilinifikia' huhifadhi taswira halisi ya Kiebrania ya fedha 'kuja' kwake.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: Kisha akawaletea Simeoni kutoka ndani
  rationale: Kauli hii inahifadhi maana ya Hiphil ya יצא, yaani kumtoa na kumleta kwao; 'kutoka ndani' inaeleza mwelekeo bila kubainisha mahali ambapo matini haipabainishi.
theological_decisions:
- issue: Maneno ya msimamizi kuhusu Mungu
  choice: Kauli imetafsiriwa moja kwa moja kuwa 'Mungu wenu na Mungu wa baba yenu' bila kueleza imani binafsi ya msemaji.
  alternative: Kuitafsiri kama lugha ya kidiplomasia tu, au kama ungamo kamili la imani la msimamizi.
  rationale: Kiebrania kinaripoti maneno yake lakini hakielezi hali ya imani yake; tafsiri haipaswi kuamua jambo ambalo matini imelicha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Viwakilishi vya wingi vimehifadhiwa, na sentensi imefuata mtiririko wa simulizi wa Kiebrania.
