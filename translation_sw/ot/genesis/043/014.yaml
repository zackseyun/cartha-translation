  - severity: medium
    issue: “Ili awaachilie ... warudi kwenu” humwacha mtenda wa kurejesha asiwe mahususi.
    rationale: Katika muktadha, rehema mbele ya mtu huyo zinalenga mtu huyo kuwarudisha ndugu na Benyamini. “Ili mtu huyo awarudishe kwenu” ni ya wazi, ya asili, na inafuata mstari wa ukaguzi wa Kiingereza bila kubadili maana.
  - severity: low
