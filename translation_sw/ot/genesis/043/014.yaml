  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: sw
  text: Mungu Mwenyezi na awajalie rehema mbele ya mtu huyo[a], ili mtu huyo awarudishe kwenu ndugu yenu mwingine[b] na Benyamini. Nami, nikifiwa, nimefiwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “awajalie huruma mbele ya mtu huyo.” Neno la Kiebrania linaweza kumaanisha rehema, huruma, au masikitiko ya ndani.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu yenu mwingine” ni Simeoni, aliyekuwa amezuiliwa katika Misri.
    reason: cross_reference
  - marker: c
    text: Au, “nikifiwa na watoto wangu, nimefiwa.” Kiebrania hurudia kitenzi kilekile kwa msisitizo, kikionyesha kujisalimisha kwa Yakobo kwa uchungu mbele ya jambo linaloweza kumpata.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  rationale: Hutafsiri cheo cha Mungu kwa Kiswahili cha kawaida na chenye hadhi, badala ya kukinakili kwa matamshi.
- source_word: יִתֵּן לָכֶם רַחֲמִים
  choice: na awajalie rehema
  rationale: Muundo wa ombi ‘na awajalie’ unaakisi hali ya matakwa; רַחֲמִים inaweza kumaanisha rehema, huruma, au moyo wa kuonea.
- source_word: לִפְנֵי הָאִישׁ
  choice: mbele ya huyo mtu
  rationale: Hudumisha taswira ya Kiebrania ya kuwa ‘mbele ya’ mtu huku ‘huyo’ ikirejelea wazi afisa wa Misri aliyetajwa katika muktadha.
- source_word: וְשִׁלַּח לָכֶם
  choice: ili awaachilie ... warudi kwenu
  rationale: Inaonyesha lengo linalotarajiwa la rehema na maana ya kuachiliwa na kurejeshwa kwao, kwa Kiswahili asilia.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: ndugu yenu mwingine
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya אַחֵר; katika muktadha ndugu huyo ni Simeoni.
- source_word: וַאֲנִי
  choice: Nami
  rationale: Huonyesha badiliko lenye msisitizo kuelekea hali ya Yakobo mwenyewe kwa ufupi na kwa kawaida.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: nikifiwa na watoto wangu, nimefiwa
  rationale: Huhifadhi urudiaji wa kitenzi na sauti ya Yakobo ya kukubali kwa uchungu; kutaja watoto kunafafanua maana iliyomo katika kitenzi שׁכל bila kuondoa mvutano wake.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  alternative: El Shaddai
  rationale: Cheo kinatafsiriwa ili maana yake ipatikane kwa msomaji wa kawaida; ‘Mungu Mwenyezi’ ni tafsiri ya jadi, inayoeleweka, bila kuingiza fundisho la dhehebu.
- issue: Sauti ya mwisho ya Yakobo
  choice: nikifiwa na watoto wangu, nimefiwa
  alternative: kama nilivyofiwa, nimefiwa
  rationale: Kishazi cha Kiebrania kinaweza kueleweka kwa namna zaidi ya moja, lakini katika muktadha kinaonyesha kukubali uwezekano wa kupoteza watoto; urudiaji umehifadhiwa ili kutoondoa uzito na mvutano wa kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka. Muundo wa ombi na urudiaji wa mwisho vimehifadhiwa kwa kadiri inayowezekana bila kufanya sentensi isikike ngeni.
