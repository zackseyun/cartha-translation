translation:
  language: sw
  text: Wakasema, “Tafadhali, bwana wangu[b], hakika tulishuka[a] mara ya kwanza kununua chakula.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tulishuka kweli mara ya kwanza kununua chakula.” Kiebrania hurudia wazo la kitenzi kwa umbo la infinitivu na kwa kitenzi kilichonyambuliwa ili kusisitiza.
    reason: lexical_alternative
  - marker: b
    text: “Bwana wangu” hapa ni namna ya heshima ya kumwambia mtu mwenye mamlaka, si cheo cha Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Wakasema
  rationale: Muundo wa usimulizi wa Kiebrania unaendeleza simulizi na kuanzisha maneno ya moja kwa moja; “Wakasema” ni wa kawaida na wa asili katika Kiswahili.
- source_word: בִּי
  choice: Tafadhali
  rationale: Hiki ni kihisishi cha kusihi kwa heshima, si maana halisi ya kihusishi “ndani yangu.”
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumwambia mtu mwenye mamlaka; hapa si jina au cheo cha Mungu.
- source_word: יָרֹד יָרַדְנוּ
  choice: tulishuka
  rationale: Kitenzi-jina halisi pamoja na kitenzi kilichonyambuliwa huleta msisitizo. Kiswahili cha mstari mkuu kinabaki cha kawaida, huku uwezekano wa kuonyesha msisitizo wazi zaidi ukihifadhiwa katika tanbihi [a].
- source_word: בַּתְּחִלָּה
  choice: mara ya kwanza
  rationale: Katika muktadha huu maneno hayo yanaelekeza kwenye safari yao ya awali, si mwanzo kwa maana ya jumla.
- source_word: לִשְׁבָּר
  choice: kununua
  rationale: Kitenzi kinamaanisha kujipatia mahitaji, hasa nafaka, kwa kuyanunua; “kununua” kinafaa kwa kifaa chake “chakula.”
- source_word: אֹכֶל
  choice: chakula
  rationale: Nomino hiyo ni pana kuliko “nafaka,” hata kama muktadha mpana unahusu nafaka.
theological_decisions:
- issue: Maana ya אֲדֹנִי katika muktadha huu
  choice: bwana wangu, kama neno la heshima kwa mkuu wa kibinadamu
  alternative: Bwana wangu, kama cheo cha kimungu
  rationale: Muktadha ni mazungumzo na mtawala wa Misri; neno hapa halimtaji Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Tafadhali, bwana wangu” huhifadhi unyenyekevu wa ombi bila kuwa cha kizamani; tanbihi huhifadhi msisitizo wa muundo wa Kiebrania.
