base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: sw
  text: Ikawa tulipofika mahali pa kulala, tukafungua magunia yetu, na tazama, fedha ya kila mtu ilikuwa kwenye mdomo wa gunia lake[a]—fedha yetu ikiwa na uzito wake kamili[b]—nasi tumeileta tena mikononi mwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye sehemu ya kufungulia gunia lake.” Kiebrania kinasema kihalisi “kwenye mdomo wa gunia lake.”
    reason: lexical_alternative
  - marker: b
    text: Au “fedha yetu kulingana na uzito wake”; maana yake ni kwamba kiasi kamili kilichopimwa kilikuwa kimerudishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: mahali pa kulala
  rationale: Neno מָלוֹן humaanisha mahali pa kukaa usiku safarini, si lazima nyumba ya wageni ya kibiashara; tafsiri hii haiongezi maelezo yasiyokuwamo.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: magunia yetu / gunia lake
  rationale: Neno אַמְתַּחַת linamaanisha gunia la nafaka au la safari; “gunia” linafaa katika muktadha wa simulizi la Yosefu.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Kishirikishi hiki huonyesha ugunduzi wa ghafla na kuufanya usimulizi uwe hai; “na tazama” huhifadhi nguvu hiyo.
- source_word: כֶּסֶף אִישׁ
  choice: fedha ya kila mtu
  rationale: אִישׁ hapa ina maana ya ugawaji, yaani fedha ya kila mmoja; “fedha” huhifadhi rejeo la moja kwa moja kwa fedha iliyopimwa kwa uzito.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: kwenye mdomo wa gunia lake
  rationale: Kiebrania hutumia “mdomo” kumaanisha sehemu ya kufungulia chombo; taswira hiyo inaeleweka pia katika Kiswahili na huhifadhi muundo wa chanzo.
- source_word: בְּמִשְׁקָלוֹ
  choice: ikiwa na uzito wake kamili
  rationale: Kirai hiki kinaonyesha kwamba kiasi kilekile kilichopimwa kilikuwapo, bila kupungua.
- source_word: וַנָּשֶׁב אֹתוֹ
  choice: tumeirudisha
  rationale: Kitenzi cha Kiebrania kina maana ya kurudisha. Wakati timilifu wa Kiswahili unaonyesha kwamba baada ya kuigundua waliileta tena, na sasa wanayo wanapozungumza.
- source_word: בְּיָדֵנוּ
  choice: mikononi mwetu
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba waliileta wao wenyewe wakiwa nayo, huku ikihifadhi taswira ya “mkono” katika chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Ikawa” na “na tazama” zimehifadhi mwendo na msisitizo wa usimulizi wa Kiebrania bila kufanya lugha iwe ya kizamani kupita kiasi.
