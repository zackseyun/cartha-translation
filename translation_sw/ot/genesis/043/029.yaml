  edition: WLC
  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֞רְא אֶת בִּנְיָמִ֣ין אָחִי/ו֮ בֶּן אִמּ/וֹ֒ וַ/יֹּ֗אמֶר הֲ/זֶה֙ אֲחִי/כֶ֣ם הַ/קָּטֹ֔ן אֲשֶׁ֥ר אֲמַרְתֶּ֖ם אֵלָ֑/י וַ/יֹּאמַ֕ר אֱלֹהִ֥ים יָחְנְ/ךָ֖ בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: sw
  text: Akainua macho yake, akamwona Benyamini, ndugu yake, mwana wa mama yake[a], akasema, “Je, huyu ndiye ndugu yenu wa mwisho ambaye mliniambia habari zake?” Kisha akasema, “Mungu akufanyie fadhili, mwanangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Benyamini alikuwa ndugu yake Yosefu kwa kuwa wote walikuwa wana wa mama mmoja.
    reason: Ufafanuzi huu unaonyesha msisitizo wa maneno ya Kiebrania “ndugu yake, mwana wa mama yake,” bila kuyabadilisha kuwa kifupisho ndani ya aya.
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Akainua macho yake
  rationale: Nahau ya Kiebrania imehifadhiwa kwa kuwa inaeleweka katika Kiswahili na inadumisha uhai wa simulizi.
- source_word: וַיַּרְא
  choice: akamwona
  rationale: Kitenzi ראה hapa kina maana ya moja kwa moja ya kumwona mtu.
- source_word: אֶת בִּנְיָמִין
  choice: Benyamini
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: ndugu yake, mwana wa mama yake
  rationale: Muundo wa ufafanuzi wa Kiebrania umehifadhiwa ili kusisitiza kwamba Benyamini na Yosefu walikuwa wana wa mama mmoja, bila kufupisha kwa tafsiri ya kiufafanuzi.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ndugu yenu mdogo
  rationale: Katika muktadha, הַקָּטֹן humtambulisha ndugu aliye mdogo kuliko wengine; usemi huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: ambaye mliniambia habari zake
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida maana ya kwamba walikuwa wamemweleza Yosefu habari za ndugu huyo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa אֱלֹהִים katika baraka hii.
- source_word: יָחְנְךָ
  choice: akufadhili
  rationale: Kitenzi hiki huonyesha Mungu kumwonyesha mtu wema au kibali; 'akufadhili' ni kifupi, cha heshima, na kinafaa katika kauli ya baraka.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Linahifadhi anwani ya upendo ya kiume ya maandishi ya Kiebrania.
theological_decisions:
- issue: Namna ya kuwasilisha kauli ya baraka yenye אֱלֹהִים na kitenzi cha hamu/ombi
  choice: Mungu akufadhili, mwanangu
  alternative: Mungu na akufadhili, mwanangu
  rationale: Kauli yenye 'akufadhili' inaonyesha ombi au matakwa ya baraka kwa Kiswahili cha sasa bila kuongeza maudhui ya kiteolojia. Jina la kawaida 'Mungu' limehifadhiwa badala ya kuingiza jina la agano lisilopo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na mtiririko wa kisimulizi. Muundo wa Kiebrania umehifadhiwa pale unapobaki wazi na wa kawaida katika Kiswahili.
