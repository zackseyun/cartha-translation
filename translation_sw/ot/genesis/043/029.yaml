  to: Akainua macho yake, akamwona Benyamini, ndugu yake, mwana wa mama yake[a], akasema, “Je, huyu ndiye ndugu yenu wa mwisho ambaye mliniambia habari zake?” Kisha akasema, “Mungu akufanyie fadhili, mwanangu.”
  rationale: 'Revised only the two expressions where the draft slightly weakened source-specific meaning: Benjamin is identified as the youngest brother in context, and Joseph’s blessing invokes God’s gracious favor. The wording, name form, source apposition, and footnote are otherwise retained.'
