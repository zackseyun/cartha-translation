base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: sw
  text: Wakasema, “Yule mtu alituhoji kwa kina kuhusu sisi na familia yetu, akisema, ‘Je, baba yenu angali hai? Je, mna ndugu mwingine?’ Nasi tukamweleza mambo hayo. Tungewezaje kujua kwamba angesema, ‘Mteremshe ndugu yenu’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: alituuliza kwa makini
  rationale: Muundo wa kitenzi maradufu unasisitiza kuuliza kwa kina au kwa makini; Kiswahili cha asili kinahitaji kirai hiki badala ya kurudia kitenzi.
- source_word: מוֹלַדְתֵּנוּ
  choice: jamaa yetu
  rationale: Hapa neno linahusu ukoo au familia ya asili; ‘jamaa yetu’ ni ya kawaida na inafaa maswali yaliyofuata kuhusu baba na ndugu.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: kulingana na maswali hayo
  rationale: Ingawa kwa umbo ni ‘kulingana na maneno/mambo hayo,’ katika muktadha linarejelea maudhui ya maswali ya mtu huyo; tafsiri hii ni wazi bila kuongeza habari mpya.
- source_word: הֲיָדוֹעַ נֵדַע
  choice: Tungewezaje kujua
  rationale: Kitenzi maradufu ndani ya swali la balagha kinaonyesha kutowezekana kwao kujua mapema; muundo huu wa Kiswahili huhifadhi msisitizo huo.
- source_word: הוֹרִידוּ
  choice: Mleteni ... huku chini
  rationale: Kitenzi kina maana halisi ya kumteremsha au kumleta chini, kulingana na safari ya kwenda Misri; ‘huku’ hudumisha mtazamo wa msemaji aliyekuwa Misri.
