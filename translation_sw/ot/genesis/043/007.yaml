revisions:
- from: Wakasema, “Yule mtu alituuliza kwa makini kuhusu sisi na jamaa yetu, akisema, ‘Je, baba yenu angali hai? Je, mna ndugu mwingine?’ Nasi tukamjibu kulingana na maswali hayo. Tungewezaje kujua kwamba angesema, ‘Mleteni ndugu yenu huku chini’?”
  to: Wakasema, “Yule mtu alituhoji kwa kina kuhusu sisi na familia yetu, akisema, ‘Je, baba yenu angali hai? Je, mna ndugu mwingine?’ Nasi tukamweleza mambo hayo. Tungewezaje kujua kwamba angesema, ‘Mteremshe ndugu yenu’?”
  rationale: The revision preserves the Hebrew’s emphatic close questioning and rhetorical question, uses natural contemporary Swahili for the family reference, avoids narrowing “these words/matters” to the questions alone, and renders the directional force of ‘bring down’ without importing an unnecessary deictic location.
