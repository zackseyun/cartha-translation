  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: sw
  text: Yuda akamwambia Israeli baba yake, “Mtume kijana[a] pamoja nami; nasi tuondoke, twende, ili tuishi wala tusife—sisi, wewe, na watoto wetu wadogo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mvulana.” Neno la Kiebrania נער linaweza kumaanisha mvulana, kijana, au mwanamume kijana, si mtoto mdogo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza tukio; “akamwambia” ni njia ya kawaida na yenye heshima ya kuendeleza simulizi katika Kiswahili.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: Israeli baba yake
  rationale: Linahifadhi jina “Israeli” lililo katika Kiebrania na kueleza wazi kuwa ndiye baba yake Yuda.
- source_word: שִׁלְחָה
  choice: Mpeleke
  rationale: Ni amri/ombi la moja kwa moja la kumruhusu na kumtuma kijana aende pamoja na Yuda; “mpeleke pamoja nami” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: הַנַּעַר
  choice: kijana
  rationale: נער inaweza kumaanisha mvulana, kijana, au mwanamume kijana. Kwa kuwa Benyamini si mtoto mdogo, “kijana” huhifadhi upana wa maana bila kupotosha umri wake.
- source_word: אִתִּי
  choice: pamoja nami
  rationale: Huwasilisha wazi kwamba Yuda mwenyewe ataandamana na Benyamini na kuwajibika kwa ajili yake.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: nasi tuondoke, twende
  rationale: Vitenzi vya cohortative vinahimiza hatua ya pamoja na ya haraka. “Tuondoke, twende” ni ya asili katika Kiswahili na inadumisha mfuatano wa vitenzi viwili.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: ili tuishi wala tusife
  rationale: “Ili” huonyesha kusudi au matokeo yaliyokusudiwa ya safari, huku “tuishi wala tusife” ikihifadhi ulinganifu wa Kiebrania.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: sisi, wewe, na watoto wetu wadogo
  rationale: Orodha inahifadhi makundi yote matatu yanayosisitizwa na kurudiwa kwa גם. Kiswahili hutumia orodha hii kwa ufasaha bila kulazimisha marudio yasiyo ya kawaida.
- source_word: טַפֵּנוּ
  choice: watoto wetu wadogo
  rationale: טף huelekea kutaja watoto wadogo au walio dhaifu na kuwategemea wakubwa; tafsiri hii huhifadhi wazo la udhaifu wao kuliko neno pana “watoto” pekee.
