base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: sw
  text: Chukueni fedha maradufu mikononi mwenu, na fedha iliyorudishwa vinywani mwa magunia yenu[a] irudisheni mikononi mwenu[b]; huenda ilikuwa kosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kwenye mianya ya magunia yenu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, zibebeni pamoja nanyi ili mzirejeshe.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: fedha maradufu
  rationale: Kifungu hiki kinaonyesha kiasi kilichoongezwa hadi kuwa mara mbili. “Fedha maradufu” ni kifupi, cha kawaida, na kinahifadhi nguvu ya kiasi hicho bila kueleza zaidi ya maandishi.
- source_word: קְחוּ בְיֶדְכֶם
  choice: chukueni ... mikononi mwenu
  rationale: Hifadhi taswira halisi ya ‘mkono’ katika Kiebrania na ulinganifu wake na kifungu kinachofuata, huku wingi “mikononi mwenu” ukiwa wa kawaida kwa Kiswahili unapozungumza na watu kadhaa.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: fedha iliyorudishwa
  rationale: Umbo tendwa linaonyesha kwamba fedha ilisababishwa kurudi au iliwekwa tena. “Iliyorudishwa” ni ya asili katika Kiswahili na haiwadokezi ndugu kuwa tayari ndio walioirudisha.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: kwenye midomo ya magunia yenu
  rationale: “Midomo” inahifadhi sitiari dhahiri ya Kiebrania kwa mianya ya magunia; maana ya kimazoea imefafanuliwa katika tanbihi.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: irudisheni mikononi mwenu
  rationale: Kitenzi cha kusababisha kurudi kimetafsiriwa “irudisheni,” na “mikononi mwenu” kinarudia kwa makusudi lugha ya kifungu cha kwanza.
- source_word: אוּלַי מִשְׁגֶּה הוּא
  choice: huenda lilikuwa kosa
  rationale: “Huenda” huhifadhi kutokuwa na uhakika, na “kosa” linaeleza hitilafu bila kudokeza udanganyifu au hatia ya kimaadili.
