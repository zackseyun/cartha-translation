base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: sw
  text: Yosefu alipoingia ndani ya nyumba, wakamletea zawadi iliyokuwa mikononi mwao ndani ya nyumba, kisha wakainama mpaka ardhini mbele yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא יוֹסֵף הַבַּיְתָה
  choice: Yosefu alipoingia nyumbani
  rationale: Kitenzi בוא pamoja na הַבַּיְתָה yenye he ya mwelekeo huonyesha kuingia ndani ya nyumba; muundo huu ni wa kawaida katika simulizi la Kiswahili.
- source_word: וַיָּבִיאוּ לוֹ
  choice: wakamletea
  rationale: Hifili ya בוא ina maana ya kuleta, na לוֹ inaonyesha kwamba Yosefu ndiye aliyepokea zawadi.
- source_word: הַמִּנְחָה
  choice: zawadi
  rationale: Katika muktadha huu מִנְחָה ni zawadi ya heshima iliyompelekea mtawala, si sadaka ya ibada. 'Zawadi' ni neno la kawaida lisilobana maana kuwa kodi.
- source_word: אֲשֶׁר בְּיָדָם
  choice: waliyokuwa wamebeba
  rationale: Kiebrania husema kihalisi 'iliyokuwa mikononi mwao'; Kiswahili cha sasa huwasilisha maana yake kwa kawaida zaidi kwa kusema walikuwa wameibeba.
- source_word: הַבָּיְתָה
  choice: mpaka ndani ya nyumba
  rationale: Tafsiri hii inahifadhi kutajwa kwa nyumba mara ya pili na nguvu ya mwelekeo ya umbo la Kiebrania, huku ikifanya sentensi isomeke kwa kawaida.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: wakamsujudia mpaka chini
  rationale: שׁחה huonyesha kuinama chini kwa heshima mbele ya mtu, na אָרְצָה husisitiza kuelekea ardhini. 'Kusujudia mpaka chini' huonyesha tendo hilo bila kulifanya lazima kuwa ibada ya kidini.
theological_decisions:
- issue: Ikiwa kusujudu huku ni ibada au heshima kwa mtawala
  choice: wakamsujudia mpaka chini
  alternative: wakainama mpaka chini mbele yake
  rationale: Chanzo kinaeleza tendo la kujinyenyekeza kwa heshima lakini hakilazimishi maana ya ibada ya kidini. 'Kumsujudia' katika Kiswahili kinaweza kueleza kuinama kwa kina mbele ya mkuu, na kirai 'mpaka chini' kinahifadhi אָרְצָה.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya 'nyumbani/ndani ya nyumba' yamehifadhiwa kwa sababu yapo mara mbili katika Kiebrania; tofauti ya maumbo hayo ni ya ufasaha wa Kiswahili, si kuondoa marudio.
