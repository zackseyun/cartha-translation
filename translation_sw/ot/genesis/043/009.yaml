review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Judah's emphatic personal surety, the father's right to hold him accountable, the condition of bringing Benjamin and presenting him, and lifelong culpability. However, the conditional wording "Nisipoleta yeye" is unidiomatic in Standard East African Swahili; the object pronoun should be incorporated in the verb. The main rendering of חטא as "nitakuwa nimekutenda dhambi" is defensible and preserves the Hebrew's explicit sin/guilt terminology.
  naturalness: '"Mimi mwenyewe nitakuwa mdhamini wake" and "Utamtaka kutoka mkononi mwangu" are clear and suitably formal. "Nisipoleta yeye" is not natural modern Swahili; "Nisipomleta" is the normal form. The final perfect construction, "nitakuwa nimekutenda dhambi," naturally expresses the resulting enduring culpability in this conditional pledge.'
  terminology: '"mdhamini" suitably renders the surety/guarantor role. "kutoka mkononi mwangu" appropriately retains the Hebrew accountability idiom. "kutenda dhambi" retains the moral force of חטא, while the contextual alternative "kuwa na hatia mbele yako" belongs in a footnote.'
  issues:
  - severity: medium
    issue: Unidiomatic object expression in the conditional clause
    rationale: In Standard East African Swahili, "Nisipoleta yeye" is awkward because the definite human object is normally marked on the verb. "Nisipomleta kwako" is idiomatic and retains the Hebrew sense 'if I do not bring him to you.'
  revised_text: Mimi mwenyewe nitakuwa mdhamini wake. Utamtaka kutoka mkononi mwangu. Nisipomleta kwako na kumweka mbele yako, nitakuwa nimekutenda dhambi[a] siku zangu zote.
