base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: sw
  text: Mimi mwenyewe nitakuwa mdhamini wake. Utamtaka kutoka mkononi mwangu. Nisipomleta kwako na kumweka mbele yako, nitakuwa nimekutenda dhambi[a] siku zangu zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya kimuktadha, “nitakuwa na hatia mbele yako siku zangu zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Mimi mwenyewe
  rationale: Kiwakilishi huru kina mkazo; Yuda anajitwalia wajibu binafsi.
- source_word: אֶֽעֶרְבֶ֔נּוּ
  choice: nitakuwa mdhamini wake
  rationale: Kitenzi ערב hapa humaanisha kujifanya mdhamini na kubeba wajibu kwa ajili ya mtu mwingine.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: Utamtaka kutoka mkononi mwangu
  rationale: Inahifadhi taswira halisi ya mkono kama mahali pa uwajibikaji na maana ya kudai mtu arudishwe.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: kuleta yeye kwako
  rationale: Hiphil ya בוא ni ‘kuleta’; ‘kurudisha’ inaeleweka katika muktadha lakini haijasemwa wazi katika Kiebrania.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: na kumweka mbele yako
  rationale: Inahifadhi maana halisi ya kumleta na kumsimamisha au kumweka mbele ya Yakobo.
- source_word: וְחָטָאתִי לְךָ
  choice: nitakuwa nimekutenda dhambi
  rationale: Huhifadhi kitenzi cha kawaida חטא, ‘kutenda dhambi,’ pamoja na mwelekeo wa kosa dhidi ya baba yake, bila kupunguza uzito wake kuwa lawama tu.
- source_word: כָּל הַיָּמִים
  choice: siku zangu zote
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wajibu au hatia ya kudumu maisha yote.
theological_decisions:
- issue: Maana ya וְחָטָאתִי לְךָ katika ahadi ya uwajibikaji kati ya watu
  choice: nitakuwa nimekutenda dhambi
  alternative: nitakuwa na hatia mbele yako
  rationale: Ingawa muktadha ni wa dhamana na uwajibikaji, neno la Kiebrania ni kitenzi cha kawaida cha ‘kutenda dhambi.’ Tafsiri kuu inalinda uzito wa kimaadili na mvutano wa kifungu; tanbihi inaonyesha maana ya kimuktadha ya kubaki na hatia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘kutoka mkononi mwangu’ umehifadhiwa kwa sababu taswira yake inaeleweka na ni muhimu kwa ahadi ya uwajibikaji.
