  text: Ukituma ndugu yetu pamoja nasi[a], tutashuka na kukununulia chakula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ukiwa tayari kumtuma ndugu yetu pamoja nasi.” Nahau ya Kiebrania yenye יֵשׁ pamoja na umbo la kitenzi linaloendelea inaweza kuonyesha utayari pamoja na tendo la kutuma lenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Uki-
  rationale: Kiambishi cha masharti “-ki-” kinawasilisha sharti la Kiebrania kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: ukiamua kumruhusu ... aende
  rationale: Nahau hii inaweza kuonyesha utayari pamoja na tendo la kumtuma. Kauli hii ni ya asili katika Kiswahili na inaacha uamuzi mikononi mwa baba, bila kudai kwamba safari tayari imeanza.
- source_word: אֶת אָחִינוּ
  choice: ndugu yetu
  rationale: Huhifadhi moja kwa moja uhusiano wa kifamilia unaoonyeshwa na nomino yenye kiambishi cha nafsi ya kwanza wingi.
- source_word: אִתָּנוּ
  choice: pamoja nasi
  rationale: Huwasilisha wazi maana ya kuandamana nao.
- source_word: נֵרְדָה
  choice: tutashuka
  rationale: Cohortative ya nafsi ya kwanza wingi hapa inaonyesha hatua watakayochukua sharti likitimizwa; wakati ujao wa Kiswahili ni wa asili katika sentensi hii ya masharti.
- source_word: וְנִשְׁבְּרָה
  choice: na kukununulia
  rationale: Katika muktadha wa kupata mahitaji, kitenzi שבר humaanisha kununua. Umbo “kukununulia” linajumuisha wazi mnufaika anayeonyeshwa na לְךָ.
- source_word: לְךָ
  choice: -ku- ... -ia (kukununulia)
  rationale: Viambishi vya yambwa na utendea vinaonyesha kwamba chakula kitanunuliwa kwa ajili yako.
- source_word: אֹכֶל
  choice: chakula
  rationale: Ni neno pana linalolingana na אֹכֶל; halibani maana kuwa nafaka pekee.
