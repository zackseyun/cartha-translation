base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: sw
  text: Na tumeshusha fedha nyingine mikononi mwetu ili kununua chakula.[a] Hatujui ni nani aliyeweka fedha zetu ndani ya magunia yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili kununua nafaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: Pia ... fedha nyingine
  rationale: “Fedha” kwa Kiswahili inaweza kumaanisha metali ya fedha au pesa, hivyo inadumisha kwa kawaida upana wa maana wa כֶּסֶף. “Nyingine” inaonyesha kiasi cha ziada tofauti na fedha zilizorudishwa.
- source_word: הוֹרַדְנוּ
  choice: tumeleta huku
  rationale: Hiphil ya ירד ni ‘kuleta chini.’ Katika muktadha wa safari kutoka Kanaani kwenda Misri, “tumeleta huku” hutoa Kiswahili cha kawaida na hudumisha mtazamo wa kuleta fedha mahali walipo, ingawa wazo la kushuka halitamkwi moja kwa moja ili kuepuka Kiswahili kisicho cha kawaida.
- source_word: בְ/יָדֵ/נוּ
  choice: mikononi mwetu
  rationale: Hii inadumisha taswira ya Kiebrania ya kitu kuwa ‘mkononi,’ huku wingi ukiwa wa kawaida katika Kiswahili na ukionyesha kwamba walikuwa nazo.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: ili kununua chakula
  rationale: שׁבר katika muktadha huu ni kununua mahitaji, hasa nafaka; אֹכֶל ni ‘chakula.’ Tafsiri hii hudumisha nomino pana ya chanzo, huku ‘nafaka’ ikitajwa kama uwezekano katika tanbihi.
- source_word: לֹא יָדַעְנוּ
  choice: Hatujui
  rationale: Kauli kamilifu ya Kiebrania hapa inaeleza hali ya sasa ya kutokujua; “Hatujui” ni dai la kawaida na la moja kwa moja katika usemi wao.
- source_word: מִי שָׂם
  choice: ni nani aliyeweka
  rationale: Muundo huu unatoa kwa kawaida swali lisilo la moja kwa moja la Kiebrania bila kuongeza utambulisho au nia ya mtu huyo.
- source_word: כַּסְפֵּ/נוּ
  choice: fedha zetu
  rationale: Kurudia “fedha” kunadhihirisha kurudiwa kwa כֶּסֶף katika chanzo na kunadumisha uwezekano wa maana ‘pesa’ au ‘fedha’ kama metali.
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: ndani ya magunia yetu
  rationale: אַמְתַּחַת ni gunia au mfuko wa kubebea nafaka na mahitaji. “Magunia” linafaa kwa muktadha wa ununuzi wa chakula na ni la kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. “Fedha” limetumiwa kwa makusudi kwa sababu linaweza kurejelea pesa au metali ya fedha, kama neno la Kiebrania. Usemi “mikononi mwetu” unadumisha taswira ya chanzo bila kusikika wa kizamani.
