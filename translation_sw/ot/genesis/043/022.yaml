- from: Pia tumeleta huku fedha nyingine mikononi mwetu ili kununua chakula.[a] Hatujui ni nani aliyeweka fedha zetu ndani ya magunia yetu.
  to: Na tumeshusha fedha nyingine mikononi mwetu ili kununua chakula.[a] Hatujui ni nani aliyeweka fedha zetu ndani ya magunia yetu.
  rationale: Replaced “Pia” with the unmarked connective “Na” and replaced “tumeleta huku” with “tumeshusha” to retain the source verb’s ‘bring down’ sense. All other wording and the existing footnote are retained.
  reviewer_model: gpt-5.6-terra
