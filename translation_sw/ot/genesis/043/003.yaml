lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa masimulizi wenye waw-consecutive unaendeleza tukio; “Ndipo” na “akamwambia” huonyesha mfuatano kwa Kiswahili cha asili.
- source_word: אֵלָיו
  choice: akamwambia
  rationale: Kiambishi -mw- kinawakilisha “kwake,” kikimrejelea Yakobo katika muktadha.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: הָעֵד הֵעִד
  choice: alituonya kwa mkazo
  rationale: Kitenzi-jina halisi pamoja na kitenzi kilichonyambuliwa huimarisha tendo la kuonya; usemi huu unaonyesha onyo la wazi na lenye msisitizo bila kulifanya kuwa ushuhuda wa mahakamani.
- source_word: בָּנוּ
  choice: alituonya
  rationale: Kiambishi -tu- kinatoa maana ya “sisi” kwa mtindo wa kawaida wa Kiswahili.
- source_word: הָאִישׁ
  choice: Yule mtu
  rationale: Humrejelea afisa wa Misri aliyekwishatajwa; “yule” ni ya asili katika kurejelea mtu huyo maalumu huku ikihifadhi jina la kawaida “mtu.”
- source_word: לֹא תִרְאוּ פָנַי
  choice: Hamtaona uso wangu
  rationale: Inahifadhi taswira halisi ya Kiebrania na pia inaweza kueleweka kimuktadha kuwa hawataruhusiwa kufika mbele yake.
- source_word: בִּלְתִּי
  choice: isipokuwa
  rationale: Huanzisha sharti linalozuia kuwaona bila ndugu yao kuwapo.
- source_word: אֲחִיכֶם
  choice: ndugu yenu
  rationale: Nomino iko katika umoja ikiwa na kiambishi cha wingi, ikimrejelea Benyamini.
- source_word: אִתְּכֶם
  choice: awe pamoja nanyi
  rationale: Kiswahili huhitaji kitenzi kinachoonyesha hali katika kishazi hiki; “awe” linaonyesha sharti linalodokezwa na Kiebrania.
