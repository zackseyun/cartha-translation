  text: Ndipo Israeli akasema, “Kwa nini mmeniletea taabu kwa kumwambia yule mtu kwamba bado mna ndugu mwingine[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kiebrania, “kwamba bado mna ndugu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza mfuatano wa matukio; “Ndipo” ni wa kawaida na huhifadhi nguvu hiyo ya mfuatano.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandiko ya Kiebrania yanatumia jina Israeli, si Yakobo; jina hilo limehifadhiwa kama lilivyo katika chanzo.
- source_word: לָמָה
  choice: Kwa nini
  rationale: Hili ndilo swali la moja kwa moja na la kawaida katika Kiswahili.
- source_word: הֲרֵעֹתֶם לִי
  choice: mmeniletea taabu
  rationale: Kitenzi cha Hiphil kutoka רעע kina maana ya kusababisha madhara au kutenda vibaya kwa mtu. Katika muktadha huu, Israeli analalamika kwamba taarifa yao imemletea shida; “mmeniletea taabu” ni ya kawaida bila kudokeza lazima uovu wa kimaadili.
- source_word: לְהַגִּיד
  choice: kwa kumwambia
  rationale: Kisoukomo kinaonyesha njia ambayo taabu hiyo ililetwa; “kwa kumwambia” huonyesha uhusiano huo wazi.
- source_word: לָאִישׁ
  choice: yule mtu
  rationale: Inamhusu afisa wa Misri ambaye tayari anajulikana katika simulizi; “yule mtu” ni marejeo ya kawaida katika mazungumzo haya.
- source_word: הַעוֹד לָכֶם אָח
  choice: kwamba mna ndugu mwingine
  rationale: Kirai kinauliza ikiwa bado walikuwa na ndugu. Kutokana na muktadha wa ndugu ambao tayari wamejulikana, “ndugu mwingine” huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tafsiri iliyo karibu zaidi na muundo wa Kiebrania ikitolewa katika tanbihi.
