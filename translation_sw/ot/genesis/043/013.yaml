base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: sw
  text: Mchukueni pia ndugu yenu[a], inukeni[b], mrudi kwa mtu huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndugu yenu”; katika muktadha huu ni Benyamini.'
    reason: cross_reference
