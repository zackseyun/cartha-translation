review_pass:
  verdict: revise
  source_fidelity: The draft preserves the plural imperatives, the additive force of וְאֶת ('pia'), 'your brother,' and the return command. However, 'ondokeni' interprets קוּמוּ as departure and does not retain its basic 'rise/get up' sense as closely as a safe formal-equivalence rendering can.
  naturalness: The revised wording is natural, clear Standard East African Swahili. 'Inukeni, mrudi' retains the concise, successive imperative style without sounding archaic.
  terminology: '''Ndugu yenu'' correctly leaves Benjamin unnamed in the main text. ''Mtu huyo'' is idiomatic Swahili for a previously identified specific man and avoids the more strongly distal/deictic nuance of ''yule mtu.'''
  issues:
  - severity: medium
    issue: '''Ondokeni'' narrows the meaning of קוּמוּ.'
    rationale: קוּמוּ literally commands the hearers to rise/get up. Although departure is contextually implied, 'ondokeni' makes that implication explicit and thereby loses the distinct first imperative before 'mrudi.'
  - severity: low
    issue: '''Yule mtu'' is more demonstrative than the Hebrew definite noun.'
    rationale: הָאִישׁ means 'the man,' referring anaphorically to the known official. Swahili commonly uses 'mtu huyo' for this contextual definiteness; it is less spatially/deictically marked than 'yule mtu.'
  revised_text: Mchukueni pia ndugu yenu[a], inukeni[b], mrudi kwa mtu huyo.
  revised_footnotes:
