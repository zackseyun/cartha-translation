    text: Au, “ondokeni, mrudi.”
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/אֶת
  choice: pia
  rationale: Kiunganishi pamoja na kiashiria cha yambwa kinaonyesha kwamba ndugu yao anaongezwa kwa kile wanachopaswa kuchukua; “pia” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֲחִי/כֶם
  choice: ndugu yenu
  rationale: Huhifadhi usemi halisi wa Kiebrania bila kuingiza jina Benyamini katika matini kuu.
- source_word: קָחוּ
  choice: mchukueni
  rationale: Amri ya wingi ya לקח ni “chukueni”; kiambishi cha yambwa humrejelea ndugu aliyetajwa.
- source_word: וְ/ק֖וּמוּ
  choice: ondokeni
  rationale: Katika mfuatano huu wa maagizo ya safari, קום ina maana ya kujiinua na kuanza kwenda. “Ondokeni” ni ya asili na yenye heshima kuliko “simameni,” ambayo ingeweza kudokeza kusimama tu.
- source_word: שׁ֥וּבוּ
  choice: mrudi
  rationale: שוב hapa ina maana ya kurudi mahali walikokuwa wameenda hapo awali.
- source_word: אֶל הָ/אִישׁ
  choice: kwa yule mtu
  rationale: אֶל huonyesha mwelekeo kwa mtu, na “kwa” ni ya kawaida katika Kiswahili; “yule mtu” humtambulisha mtu mahususi aliyekwisha tajwa katika muktadha bila kuongeza cheo chake.
