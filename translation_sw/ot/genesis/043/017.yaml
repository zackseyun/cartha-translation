translation:
  language: sw
  text: Basi yule mtu akafanya kama Yosefu alivyosema, akawaingiza wale watu nyumbani mwa Yosefu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה hapa kinaonyesha kutekeleza agizo; “akafanya kama … alivyosema” ni Kiswahili cha kawaida na sahihi.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Kiebrania kinasema tu “mtu”; ingawa muktadha unaonyesha alikuwa msimamizi wa nyumba ya Yosefu, tafsiri haiongezi cheo ambacho hakipo katika mstari huu.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: kama Yosefu alivyosema
  rationale: Usemi huu unaonyesha kuwa mtu huyo alitenda kulingana na agizo la Yosefu, kwa lugha ya asili ya Kiswahili.
- source_word: וַיָּבֵא
  choice: akawaingiza
  rationale: Hifili ya בוא ina maana ya kusababisha waingie au kuwaleta; pamoja na בֵּיתָה, “akawaingiza … nyumbani” huonyesha wazi mwendo wa kuingia ndani.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Neno la Kiebrania ni la jumla, “watu,” si “ndugu”; “wale watu” hudumisha namna simulizi linavyowataja hapa.
- source_word: בֵּיתָה יוֹסֵף
  choice: nyumbani mwa Yosefu
  rationale: He ya mwelekeo katika בֵּיתָה inaonyesha mwendo kuelekea au kuingia ndani ya nyumba; maana ya kuingia imebeba katika kitenzi “akawaingiza.”
