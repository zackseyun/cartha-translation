base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: sw
  text: Wakaiandaa ile zawadi mpaka Yosefu alipokuja adhuhuri, kwa sababu walikuwa wamesikia kwamba wangekula chakula huko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wangekula mkate,” usemi unaomaanisha kula pamoja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: Wakaiandaa
  rationale: Hifili ya כון hapa ina maana ya kukifanya kitu kiwe tayari. “Wakaiandaa” ni ya kawaida na hudumisha kiunganishi cha simulizi.
- source_word: הַמִּנְחָה
  choice: ile zawadi
  rationale: Katika simulizi hili מִנְחָה ni zawadi waliyopeleka ndugu zake Yosefu, si sadaka ya ibada.
- source_word: עַד בּוֹא יוֹסֵף
  choice: mpaka Yosefu alipokuja
  rationale: עַד pamoja na kitenzi-jina בּוֹא huonyesha muda unaoendelea hadi kufika kwa Yosefu.
- source_word: בַּצָּהֳרָיִם
  choice: adhuhuri
  rationale: Neno hili humaanisha katikati ya mchana; “adhuhuri” ni fasaha na ya kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: כִּי שָׁמְעוּ
  choice: kwa sababu walikuwa wamesikia
  rationale: כִּי ya kwanza ni ya kisababishi, na wakati wa hali timilifu unaonyesha kwamba habari hiyo ilitangulia maandalizi yao.
- source_word: כִּי שָׁם
  choice: kwamba ... huko
  rationale: כִּי ya pili huanzisha yaliyomo katika habari waliyosikia, huku שָׁם ikionyesha mahali.
- source_word: יֹאכְלוּ לָחֶם
  choice: wangekula chakula
  rationale: Ingawa maana ya neno kwa neno ni “wangekula mkate,” usemi huu wa Kiebrania humaanisha kula mlo; “wangekula chakula” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: “Yosefu” ni umbo la jina lililozoeleka na linalotambulika katika Kiswahili Sanifu.
