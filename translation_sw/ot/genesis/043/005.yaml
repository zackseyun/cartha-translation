  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: sw
  text: Lakini kama hutamtuma, hatutashuka, kwa maana yule mtu alituambia, ‘Hamtaona uso wangu[a] isipokuwa ndugu yenu awe pamoja nanyi.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “Hamtaona uso wangu”; hii ni nahau yenye maana ya kufika mbele ya mtu au kuingia mahali alipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini kama
  rationale: Kiunganishi hiki kinaonyesha hali inayotofautiana na sharti lililotangulia katika mstari wa 4; ‘Lakini kama’ huonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: hutamtuma
  rationale: Muundo wenye אֵין na kitenzi-shirikishi unaonyesha kukataa au kutokusudia kumtuma. Kiambishi cha yambwa ‘-m-’ kimeongezwa kutokana na muktadha, kikimaanisha Benyamini.
- source_word: לֹא נֵרֵד
  choice: hatutashuka
  rationale: ירד humaanisha kushuka, na hapa inadumisha mtazamo wa kijiografia wa safari kutoka Kanaani kwenda Misri.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa sababu ya wao kutoshuka; ‘kwa maana’ huwasilisha uhusiano huo wa kisababu kwa lugha ya heshima na iliyo wazi.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Yuda anamrejelea Yosefu bila kutaja utambulisho wake. ‘Yule mtu’ ni ya asili katika mazungumzo na haileti maarifa ambayo ndugu hawakuwa nayo.
- source_word: אָמַר אֵלֵינוּ
  choice: alituambia
  rationale: Hili ni tamko la kawaida na la asili la Kiswahili kwa kusema jambo kwa watu, huku likiandaa usemi wa moja kwa moja.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Hamtaona uso wangu
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania na nahau yake ya kufika mbele ya mtu au kuingia mahali alipo.
- source_word: בִּלְתִּי
  choice: isipokuwa
  rationale: Katika muundo huu neno hilo linaweka sharti la lazima; ‘isipokuwa’ ni sawa la asili na sahihi.
- source_word: אֲחִיכֶם
  choice: ndugu yenu
  rationale: Kiebrania hakitaji jina la Benyamini, kwa hiyo tafsiri inadumisha usemi wa chanzo na kuuacha muktadha umtambulishe.
- source_word: אִתְּכֶם
  choice: awe pamoja nanyi
  rationale: Kishazi cha Kiebrania hakina kitenzi wazi. ‘Awe pamoja nanyi’ hukamilisha sharti kwa Kiswahili cha asili bila kubadili maana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa usemi wa moja kwa moja na taswira ya ‘kuona uso’ vimedumishwa, huku tanbihi ikifafanua nahau hiyo.
