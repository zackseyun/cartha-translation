base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: sw
  text: Ndipo Yosefu akafanya haraka[a], kwa kuwa huruma yake kwa ndugu yake ilisisimka; akatafuta mahali pa kulia[b]. Akaingia chumbani, akalia humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yosefu akaharakisha.” Kiebrania hakisemi wazi kwamba aliondoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “akatafuta kulia.” Hivyo ndivyo Kiebrania kisemavyo kihalisi; wazo la mahali pa kulia linaeleweka kutokana na kuingia kwake chumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: akaondoka haraka
  rationale: Kitenzi kinamaanisha kufanya jambo kwa haraka. Muktadha unaonyesha kwamba Yosefu aliondoka mbele ya wengine ili aingie mahali pa faragha; ‘akaondoka haraka’ huwasilisha hilo kwa Kiswahili cha kawaida, ingawa wazo la kuondoka linatokana na muktadha.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: huruma yake ... ilichochewa sana
  rationale: Nahau ya Kiebrania husema kihalisi kwamba huruma zake zilisisimka au zilipata joto. Tafsiri hii inahifadhi uzito wa hisia kwa lugha ya sasa bila kutumia taswira ya viungo vya ndani isiyo ya kawaida katika Kiswahili.
- source_word: אֶל אָחִיו
  choice: kwa ndugu yake
  rationale: Kihusishi kinaelekeza huruma ya Yosefu kwa ndugu yake. Jina Benyamini halijaongezwa kwa sababu halipo katika mstari huu.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: akatafuta mahali pa kulia
  rationale: Kihalisi ni ‘akatafuta kulia’; muktadha wa kuingia chumbani unaonyesha kwamba alitafuta faragha au mahali ambapo angeweza kulia.
- source_word: הַחַדְרָה
  choice: chumbani
  rationale: Nomino ina maana ya chumba, hasa nafasi ya ndani. Umbo ‘chumbani’ linaonyesha kwa kawaida mwendo wa kuingia ndani ya chumba.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: akalia humo
  rationale: ‘Akalia’ ni tafsiri ya kawaida ya kitenzi cha kulia, na ‘humo’ huhifadhi msisitizo wa mahali uliomo katika שָׁמָּה.
