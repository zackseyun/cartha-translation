translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi wenye ‘aka-’ umetumiwa kuhifadhi mwendelezo wa matendo; maelezo yanayotokana na muktadha yamewekewa tanbihi ili kutenganisha yaliyosemwa wazi na Kiebrania na yaliyoelekezwa na muktadha.
