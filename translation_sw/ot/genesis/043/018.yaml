  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: sw
  text: Wale wanaume wakaogopa kwa sababu walikuwa wameletwa katika nyumba ya Yosefu. Wakasema, “Tumeletwa humu kwa sababu ya ile fedha iliyorudishwa katika magunia yetu mara ya kwanza, ili atafute kisingizio dhidi yetu[a], atushambulie, atuchukue kuwa watumwa, na awachukue punda wetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili apate sababu ya kutushitaki.” Nahau ya Kiebrania hapa ni ngumu na inaweza kumaanisha kutafuta nafasi au kisingizio cha kututendea kwa uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: wakaogopa
  rationale: Kitenzi ירא kinaeleza mwitikio wao wa hofu katika mfuatano wa simulizi; ‘wakaogopa’ ni Kiswahili cha kawaida na chenye usahihi.
- source_word: הָאֲנָשִׁים
  choice: wale wanaume
  rationale: Inawarejelea ndugu za Yosefu kama kundi la wanaume; ‘wale wanaume’ hudumisha rejeo la wazi la simulizi.
- source_word: הוּבְאוּ בֵּית יוֹסֵף
  choice: walikuwa wameingizwa ndani ya nyumba ya Yosefu
  rationale: Hophal ya בוא ina maana ya kusababishwa kuingia; umbo hili la Kiswahili huonyesha tendo lililotangulia na kuingizwa ndani ya nyumba.
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: kwa sababu ya ile fedha
  rationale: Kirai hiki hapa kinaonyesha sababu au tukio lililochochea hofu yao, si mada tu.
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ
  choice: iliyorudishwa ndani ya magunia yetu
  rationale: הַשָּׁב ina maana ya kitu kilichorudi au kurudishwa; אַמְתַּחַת ni gunia la safari au nafaka, hivyo ‘magunia’ linafaa katika muktadha.
- source_word: בַּתְּחִלָּה
  choice: mara ya kwanza
  rationale: Katika muktadha huu linaelekeza kwenye safari yao ya kwanza kwenda Misri, si mwanzo kwa maana ya jumla.
- source_word: אֲנַחְנוּ מוּבָאִים
  choice: tumeletwa humu
  rationale: Kirai cha kupokea tendo kinaonyesha kwamba wao ndio wanaoingizwa; ‘humu’ huonyesha kuletwa ndani ya nyumba bila kuongeza wazo jipya.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: ili atafute kisingizio dhidi yetu
  rationale: Hii ni nahau tata yenye wazo la kutafuta nafasi au sababu ya kuwageukia kwa uhasama; tafsiri hii ni ya asili huku tanbihi ikihifadhi ugumu wake.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: atushambulie
  rationale: Hitpael ya נפל pamoja na עַל inaonyesha kuwangukia kwa uhasama; ‘atushambulie’ huwasilisha maana hiyo wazi katika Kiswahili cha sasa.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: atuchukue kuwa watumwa
  rationale: עֲבָדִים hapa inaonyesha hali ya utumwa, si huduma ya kawaida; ‘watumwa’ ni sahihi kuliko ‘watumishi’.
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: na kuchukua punda wetu
  rationale: Muundo wa Kiebrania unaendeleza kitenzi ‘kuchukua’ kwa wao pamoja na punda wao; kurudia kitenzi kwa Kiswahili huleta uwazi.
