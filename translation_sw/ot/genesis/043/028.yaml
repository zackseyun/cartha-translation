  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: sw
  text: Wakasema[a], “Mtumishi wako, baba yetu, yu mzima; bado anaishi.” Kisha wakainama na kusujudu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “amani” (shalom); hapa limetumiwa kiidioma kumaanisha uzima au hali njema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: yu mzima
  rationale: Nomino hii inatumika hapa kiidioma kueleza hali njema ya mtu. ‘Yu mzima’ ni jibu la kawaida na lenye hadhi kwa swali kuhusu hali ya baba.
- source_word: לְעַבְדְּךָ
  choice: mtumishi wako
  rationale: Hapa עבד ni usemi wa unyenyekevu mbele ya mwenye mamlaka, si lazima utumwa wa kumilikiwa; ‘mtumishi wako’ huhifadhi sajili hiyo ya heshima.
- source_word: לְאָבִינוּ
  choice: baba yetu
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja; maneno haya yanafafanua kwamba ‘mtumishi wako’ ndiye baba yao.
- source_word: עוֹדֶנּוּ חָי
  choice: bado anaishi
  rationale: ‘Bado’ huhifadhi nguvu ya עוֹד, na ‘anaishi’ hutoa kwa Kiswahili cha kawaida maana ya kuendelea kuwa hai.
- source_word: וַיִּקְּדוּ
  choice: wakainama
  rationale: Kitenzi kinaeleza kuinamisha mwili kwa heshima; ‘wakainama’ hutofautisha tendo hili na kusujudu kunakofuata.
- source_word: וישתחו
  choice: kusujudu
  rationale: Kitenzi kinaonyesha kujishusha chini mbele ya mkuu. ‘Kusujudu’ huhifadhi tendo la mwili bila kulazimisha maana ya ibada ya kidini katika muktadha huu.
theological_decisions:
- issue: Maana ya tendo וישתחו mbele ya Yosefu
  choice: kusujudu
  alternative: kuabudu
  rationale: Muktadha unaonyesha heshima na unyenyekevu mbele ya Yosefu, si dai la ibada kwa Mungu. Tafsiri inahifadhi tendo lenyewe bila kuingiza hitimisho la kiteolojia lisilodaiwa na simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Yu mzima’ ni fupi na ya kawaida katika taarifa kuhusu hali ya mtu; koma baada ya ‘mtumishi wako’ husaidia kuonyesha kwamba ‘baba yetu’ ni ufafanuzi wa mtu huyo. Vitenzi viwili tofauti vimehifadhiwa ili kuonyesha kuinama na kisha kusujudu.
