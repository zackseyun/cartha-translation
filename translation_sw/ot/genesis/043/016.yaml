base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: sw
  text: Yosefu alipomwona Benyamini pamoja nao, akamwambia msimamizi wa nyumba yake, “Walete wanaume hawa ndani ya nyumba, uchinje mnyama na uandae chakula, kwa maana wanaume hawa watakula pamoja nami adhuhuri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipomwona
  rationale: Kitenzi ראה hapa kinaonyesha Yosefu alitambua uwepo wa Benyamini; “alipomwona” ni tafsiri ya kawaida na ya moja kwa moja katika mfuatano wa simulizi.
- source_word: אִתָּם
  choice: pamoja nao
  rationale: Kirai hiki kinaonyesha Benyamini alikuwa katika kundi lao; “pamoja nao” ni Kiswahili cha asili na sahihi.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: msimamizi wa nyumba yake
  rationale: Kiebrania humtaja mtu aliyekuwa juu ya nyumba ya Yosefu, yaani mwenye jukumu la kuisimamia. “Msimamizi wa nyumba yake” huwasilisha cheo hicho kwa lugha ya sasa bila kuongeza hadhi maalumu isiyotajwa.
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: Waingize watu hawa nyumbani
  rationale: Kiambishi elekezi katika הַבָּיְתָה kinaonyesha mwendo wa kuingia ndani ya nyumba. “Waingize ... nyumbani” ni agizo la kawaida katika Kiswahili na linaonyesha mwelekeo huo.
- source_word: וּטְבֹחַ טֶבַח
  choice: uchinje mnyama
  rationale: Muundo wa kitenzi na nomino wa Kiebrania, kihalisi “chinja machinjo,” ni nahau ya kuchinja mnyama kwa ajili ya mlo. Kiswahili huhitaji kutaja kitu kinachochinjwa; “mnyama” hakibainishi aina ambayo chanzo hakikutaja.
- source_word: וְהָכֵן
  choice: na kuandaa chakula
  rationale: Hiphil ya כון humaanisha kufanya tayari. Katika muktadha wa kuchinja kwa ajili ya mlo, “kuandaa chakula” huweka rejeo wazi na ni ya asili zaidi kuliko “ukiandae,” ambacho kingeweza kumrejelea mnyama badala ya mlo.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: kwa maana watu hawa watakula pamoja nami
  rationale: כִּי hutoa sababu ya maagizo, na אִתִּי ina maana ya “pamoja nami.” “Watu hawa” huwatambulisha wanaume waliotajwa katika mazingira haya bila kuleta maana ya kijinsia isiyo ya lazima katika Kiswahili.
- source_word: בַּצָּהֳרָיִם
  choice: adhuhuri
  rationale: Neno hili humaanisha wakati wa katikati ya mchana. “Adhuhuri” ni neno la kawaida la Kiswahili Sanifu kwa wakati huo.
