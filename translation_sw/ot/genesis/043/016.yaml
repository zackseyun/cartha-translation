translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi ya simulizi la Biblia. Tafsiri imedumisha mfuatano wa matendo na sababu iliyotolewa na Yosefu, huku nahau ya Kiebrania ya kuchinja ikitolewa kwa namna inayoeleweka kwa msomaji wa kawaida.
