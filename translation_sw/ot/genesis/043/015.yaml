  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: sw
  text: Basi watu hao wakachukua zawadi hii, wakachukua fedha maradufu mikononi mwao, pamoja na Benyamini. Kisha wakaondoka, wakashuka kwenda Misri, wakasimama mbele ya Yosefu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: zawadi
  rationale: Katika simulizi hili ni vitu vinavyopelekwa kwa mtawala ili kupata kibali, si sadaka ya ibada; “zawadi” ni ya kawaida na wazi.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: fedha mara mbili
  rationale: Hueleza kiasi kilichoongezwa kuwa maradufu ya fedha; tafsiri hii inadumisha maana ya kiasi.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Neno linaweza kumaanisha “fedha” kama metali au pesa; Kiswahili “fedha” kinahifadhi upana huo na kinafaa katika muktadha wa malipo.
- source_word: בְיָדָם
  choice: mikononi mwao
  rationale: Inahifadhi nahau ya Kiebrania inayomaanisha walizibeba au walikuwa nazo, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: וְאֶת בִּנְיָמִן
  choice: pamoja na Benyamini
  rationale: Kiswahili huhitaji uunganishi wa kawaida unaoonyesha kwamba Benyamini aliandamana nao; huepuka kumfanya asikike kama kitu kilichobebwa.
- source_word: וַיָּקֻמוּ
  choice: wakaondoka
  rationale: Katika muktadha wa safari, kitenzi kinaashiria kuinuka na kuanza safari; “wakaondoka” ni cha asili bila kupanua maana kupita kiasi.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: wakashuka kwenda Misri
  rationale: Inahifadhi nahau ya kijiografia ya Kiebrania ya kushuka kutoka Kanaani kwenda Misri.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: wakasimama mbele ya Yosefu
  rationale: Ni tafsiri ya moja kwa moja na wazi ya kusimama katika uwepo wa mtawala.
- source_word: הָאֲנָשִׁים
  choice: watu hao
  rationale: Kiebrania kinawaita “watu,” si “ndugu”; “watu hao” hudumisha rejeo la simulizi kwa Kiswahili cha kawaida.
