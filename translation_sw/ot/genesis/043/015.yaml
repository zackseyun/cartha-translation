  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi na kinachoeleweka kwa msomaji wa kawaida. Mfuatano wa vitenzi vya Kiebrania umehifadhiwa kwa viambishi vya “waka-”, huku miundo isiyo ya kawaida katika Kiswahili ikirekebishwa kwa kiasi.
