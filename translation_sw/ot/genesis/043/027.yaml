  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: sw
  text: Akawauliza hali zao, akasema, “Je, baba yenu mzee, ambaye mlinitajia, ana hali njema? Je, bado yuko hai?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: Akawauliza hali zao
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kiebrania ya kuuliza kuhusu shalom ya mtu, yaani hali au ustawi wake, si amani kwa maana finyu.
- source_word: הֲשָׁלוֹם
  choice: yu hali njema
  rationale: Swali linahusu hali yake kwa ujumla; usemi huu hauufanyi maana kuwa afya ya mwili pekee.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: baba yenu mzee
  rationale: Huhifadhi moja kwa moja sifa ya umri katika Kiebrania na ni usemi wa kawaida, wenye heshima katika Kiswahili.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: yule mliyeniambia habari zake
  rationale: Katika muktadha, ndugu walikuwa wamemwambia Yosefu habari za baba yao; tafsiri hii ni wazi na ya asili katika Kiswahili.
- source_word: הַעוֹדֶנּוּ חָי
  choice: bado yuko hai
  rationale: Hutoa kwa usahihi maana ya עוֹד pamoja na חָי katika swali la kawaida la Kiswahili.
