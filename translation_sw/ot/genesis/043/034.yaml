base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: sw
  text: Akawapelekea mafungu ya chakula kutoka mezani pake[a], lakini fungu la Benyamini lilikuwa mara tano ya fungu la kila mmoja wao[b]. Basi wakanywa, wakalewa pamoja naye.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni halisi, “kutoka mbele yake,” yaelekea ikimaanisha kutoka mahali pa Yosefu mwenyewe mezani.
    reason: cultural_note
  - marker: b
    text: Kiebrania ni halisi, “mikono mitano,” nahau yenye maana ya kiasi cha mara tano.
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kiebrania kinamaanisha moja kwa moja “walilewa”; wengine hukitafsiri kwa upole kuwa “wakachangamka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: Akawapelekea mafungu ya chakula
  rationale: Katika muktadha wa karamu, kirai hiki kinamaanisha kupeleka au kugawa mafungu ya chakula kwa walioketi mezani.
- source_word: מֵאֵת פָּנָיו
  choice: kutoka mezani pake
  rationale: Kiebrania ni halisi ‘kutoka mbele yake’; katika muktadha huu kinarejelea mahali pa Yosefu mwenyewe mezani, na Kiswahili hiki kinafikisha maana hiyo kwa kawaida.
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: fungu la Benyamini
  rationale: Nomino hii hapa ni kiasi cha chakula alichopewa Benyamini.
- source_word: מִמַּשְׂאֹת כֻּלָּם חָמֵשׁ יָדוֹת
  choice: mara tano zaidi ya mafungu ya kila mmoja wao
  rationale: ‘Mikono mitano’ ni nahau ya Kiebrania inayoonyesha kiasi cha mara tano; ‘kila mmoja wao’ huonyesha ulinganisho na mafungu ya ndugu wengine mmoja mmoja.
- source_word: וַיִּשְׁתּוּ
  choice: wakanywa
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya tendo la kunywa katika karamu.
- source_word: וַיִּשְׁכְּרוּ
  choice: wakalewa
  rationale: Kitenzi hiki kwa kawaida humaanisha kulewa; tafsiri haipunguzi ukali wake kuwa ‘wakafurahi’ tu.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Kiwakilishi kinamrejelea Yosefu, ambaye anatambulika wazi katika muktadha.
