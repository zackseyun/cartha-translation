base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: sw
  text: Lakini tunda la mti ulio katikati ya bustani[a], Mungu alisema, “Msile tunda lake, wala msiuguse, msije mkafa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulio ndani ya bustani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: Lakini kuhusu tunda
  rationale: Kiunganishi pamoja na kihusishi kinaendeleza utofautishaji wa maneno ya mwanamke na mstari wa 2. Kiswahili hiki ni cha kawaida na hakidai kwamba katazo linahusu sehemu fulani tu ya tunda.
- source_word: הָעֵץ
  choice: mti
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa nomino hii.
- source_word: אֲשֶׁר בְּ/תוֹךְ הַ/גָּן
  choice: ulio katikati ya bustani
  rationale: ‘Katikati ya bustani’ huwasilisha maana ya ndani au sehemu ya kati kwa Kiswahili cha kawaida.
- source_word: אָמַר אֱלֹהִים
  choice: Mungu alisema
  rationale: Kauli hii inaripoti maneno yaliyotangulia; wakati uliopita ni wa asili katika simulizi ya Kiswahili.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: Msile tunda lake
  rationale: Katika Kiswahili, ‘kula tunda lake’ ni ya asili kuliko tafsiri sisisi ya ‘kula kutoka kwake,’ huku ikibainisha kitu kinachokatazwa kuliwa.
- source_word: וְ/לֹא תִגְּעוּ בּ/וֹ
  choice: wala msiuguse
  rationale: ‘Wala’ huunganisha katazo la pili kwa kawaida, na kiambishi ‘-u-’ humrejelea mti uliotajwa.
- source_word: פֶּן תְּמֻתוּן
  choice: msije mkafa
  rationale: Muundo ‘msije mkafa’ huwasilisha kwa usahihi athari inayohofiwa au inayozuiwa na פֶּן bila kuibadili kuwa tamko la moja kwa moja la wakati ujao.
theological_decisions:
- issue: Maneno ya mwanamke yanaongeza katazo la ‘wala msiuguse’ ambalo halipo katika Mwanzo 2:17.
  choice: Kuyatafsiri maneno hayo kama yalivyo katika mstari huu.
  alternative: Kuyapatanisha na Mwanzo 2:17 kwa kuyaondoa au kuyapunguza.
  rationale: Tofauti ya simulizi na mvutano wake wa kiteolojia vinapaswa kuhifadhiwa badala ya kutatuliwa kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Msije mkafa’ ni muundo wa kawaida wa kuonyesha matokeo yanayoweza kutokea.
