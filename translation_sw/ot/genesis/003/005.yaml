  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: sw
  text: Kwa maana Mungu anajua kwamba siku mtakapokula humo, macho yenu yatafunguliwa, nanyi mtakuwa kama Mungu[a], mkijua mema na mabaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama miungu” au “kama viumbe vya kiungu.” Neno la Kiebrania אֱלֹהִים linaweza kuwa na maana hizi katika baadhi ya miktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ambayo nyoka anatoa kuunga mkono dai lake lililotangulia.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: Mungu anajua
  rationale: Wakati wa sasa wa Kiswahili unawakilisha kwa ufasaha kitenzi-partisipio cha Kiebrania pamoja na kiima chake.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa kiunganishi kinaingiza yaliyomo katika jambo ambalo Mungu analijua.
- source_word: בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ
  choice: siku mtakapokula matunda yake
  rationale: Muundo huu wa Kiswahili ni wa kawaida na huhifadhi nahau ya wakati; neno 'siku' hapa linaonyesha wakati tendo litakapotokea, si lazima kipindi cha saa ishirini na nne. 'Matunda yake' huweka wazi kile kinacholiwa kutokana na muktadha wa mti.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: macho yenu yatafunguliwa
  rationale: Kauli tendwa inaakisi umbo la Niphal na kuhifadhi sitiari ya kupata utambuzi.
- source_word: וִהְיִיתֶם
  choice: nanyi mtakuwa
  rationale: Inatoa moja kwa moja hali itakayotokea bila kulazimisha tofauti kati ya 'kuwa' na 'kuwa kama hali mpya'.
- source_word: כֵּאלֹהִים
  choice: kama Mungu
  rationale: Muktadha wa karibu unaelekea kwa Mungu mmoja, lakini maana za 'miungu' au 'viumbe vya kiungu' zinawezekana na zimehifadhiwa katika tanbihi.
- source_word: יֹדְעֵי טוֹב וָרָע
  choice: mkijua mema na mabaya
  rationale: Muundo wa kitenzi tegemezi huhifadhi ufupi wa participio na unaonyesha kwamba msemo huu unawaeleza 'ninyi'; wingi wa dhahania unasikika kwa ufasaha katika Kiswahili.
theological_decisions:
- issue: Kirejewa cha אֱלֹהִים katika כֵּאלֹהִים
  choice: kama Mungu
  alternative: kama miungu; kama viumbe vya kiungu
  rationale: Muktadha wa simulizi unamtaja Mungu mmoja, na kujua mema na mabaya kunahusishwa na hali ya kiungu. Hata hivyo, neno la Kiebrania linaweza kuwa na maana nyingine; tanbihi huhifadhi utata huo wa kweli badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtiririko wa hoja ya nyoka, kauli tendwa ya sitiari, na utata wa maana ya אֱלֹהִים kwa tanbihi.
