  naturalness: '"Basi Yahweh Mungu akampeleka kutoka bustani ya Edeni" ni Kiswahili sanifu na cha asili, na hutofautisha kwa kiasi kinachofaa kitenzi hiki na "kufukuza" cha mstari unaofuata. "Ardhi ambayo alichukuliwa kutoka humo" ni wazi na laini zaidi kuliko rasimu.'
  terminology: '"Yahweh Mungu" hufuata uamuzi wa POB wa kulitafsiri jina יְהוָה kama Yahweh. "Kulima ardhi" ni sahihi katika muktadha huu; tanbihi inatunza upeo mpana wa עבד bila kulazimisha maana ya kiteolojia.'
