base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: sw
  text: Basi Yahweh Mungu akampeleka kutoka bustani ya Edeni ili ailime ardhi[a] ambayo alichukuliwa kutoka humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aifanyie kazi.” Kitenzi cha Kiebrania kinaweza kumaanisha “kufanya kazi,” “kutumikia,” au, katika muktadha huu, “kulima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: akamtoa
  rationale: Kitenzi שׁלח katika kauli hii kina maana ya kumtoa au kumpeleka mbali. “Akamtoa” linaonyesha kuondolewa kwake Edeni bila kutumia nguvu ya maana ya “akamfukuza,” ambayo inafaa zaidi kwa kitenzi גרשׁ katika mstari unaofuata.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: “Yahwe” linawakilisha jina la agano יְהוָה, na “Mungu” linawakilisha אֱלֹהִים; mpangilio wa majina hayo mawili umehifadhiwa.
- source_word: מִגַּן עֵדֶן
  choice: katika bustani ya Edeni
  rationale: Pamoja na kitenzi “akamtoa,” “katika” linaonyesha kwa kawaida mahali alikotolewa; jina la mahali Edeni limehifadhiwa.
- source_word: לַעֲבֹד
  choice: ili ailime
  rationale: עבד linaweza kumaanisha kufanya kazi, kutumikia, au kulima. Kwa kuwa kitu chake ni ardhi, “ailime” ni usemi wa kawaida wa Kiswahili unaoeleza kazi ya kilimo bila kupanua maana isivyohitajika.
- source_word: אֶת הָאֲדָמָה
  choice: ardhi
  rationale: אֲדָמָה hapa ni ardhi au udongo ambao mwanadamu alitwaliwa kutoka humo. “Ardhi” huhifadhi uhusiano huo wa simulizi na inapatana kwa kawaida na kitenzi “kulima.”
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: ambayo kutoka humo alikuwa ametwaliwa
  rationale: Kauli tendwa ya Kiebrania imehifadhiwa, na “alikuwa ametwaliwa” linaonyesha kwamba kutwaliwa kwake kutoka ardhini kulitangulia kutolewa kwake bustanini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kazi hii na wajibu wa awali wa mwanadamu
  choice: ili ailime ardhi
  alternative: ili aifanyie kazi ardhi; ili aitumikie ardhi
  rationale: Tafsiri inahifadhi wazo la kazi ya ardhi lililopo katika simulizi bila kuongeza maelezo ya kiteolojia kuhusu laana, adhabu, au ukombozi ambayo hayajasemwa katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Akamtoa” limetofautishwa na neno lenye nguvu zaidi “akamfukuza” katika mstari unaofuata. Alama ya tanbihi [a] imewekwa mara baada ya kirai kinachohusika.
