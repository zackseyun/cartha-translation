  text: Naye akasema, “Ni nani aliyekuambia kwamba uko uchi? Je, umekula kutoka katika mti ambao nilikuamuru usile[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “usile kutoka kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Inaendeleza mtiririko wa simulizi kwa njia ya kawaida katika Kiswahili bila kutaja wazi mhusika ambaye Kiebrania hakumtaji tena katika aya hii.
- source_word: מִי הִגִּיד לְךָ
  choice: Ni nani aliyekuambia
  rationale: Ni swali la moja kwa moja na la kawaida; kitenzi נגד katika Hifili hapa humaanisha kumwambia au kumjulisha mtu.
- source_word: כִּי עֵירֹם אָתָּה
  choice: kwamba uko uchi
  rationale: Kiswahili hutumia hali ya sasa kwa hali inayomhusu Adamu wakati wa mazungumzo; עֵירֹם humaanisha kutokuwa na mavazi.
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  choice: Je, umekula kutoka katika mti ...?
  rationale: Muundo wa ‘Je, umekula’ unaonyesha swali la ndiyo au hapana kuhusu tendo lililokamilika lenye umuhimu wa sasa, huku ‘kutoka katika mti’ ikihifadhi uhusiano wa מן bila kuongeza neno ‘matunda,’ ambalo halimo katika aya.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: ambao nilikuamuru usile
  rationale: Hutoa katazo kwa Kiswahili cha kawaida na huacha maana ya ‘kutoka kwake’ ieleweke kwa kurejelea mti uliotajwa, bila kurudia kwa namna nzito.
theological_decisions:
- issue: Utambulisho wa mhusika wa kiume katika וַיֹּאמֶר
  choice: Naye akasema
  alternative: BWANA Mungu akasema
  rationale: Aya yenyewe ina kitenzi cha nafsi ya tatu ya kiume bila kutaja tena jina la msemaji. Muktadha unamtambulisha kuwa Mungu, lakini tafsiri haiongezi jina ambalo halimo katika kishazi hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘kutoka katika mti’ umehifadhiwa kwa sababu maandishi ya Kiebrania hayasemi wazi ‘matunda,’ ingawa usemi huo ni rasmi kidogo katika Kiswahili.
