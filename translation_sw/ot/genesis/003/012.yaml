  verdict: revise
  source_fidelity: 'The draft mistranslates אֲשֶׁר נָתַתָּה עִמָּדִי at its key pronominal relation: “uliyempa” means “whom you gave to her/him,” whereas the Hebrew means “whom you gave [to] me, to be with me.” The remaining clauses accurately preserve the man’s emphatic attribution to the woman, her giving him something from the tree, and his eating.'
  naturalness: The proposed revised wording is idiomatic Standard East African Swahili. “uliyenipa awe pamoja nami” naturally expresses the purpose/companionship sense of עִמָּדִי, while “yeye ndiye” appropriately conveys the emphatic independent pronoun.
  terminology: “Mwanamume” and “mwanamke” are contextually appropriate. “Matunda” is a contextually clear supplied object; the attached footnote properly identifies that it is not explicit in the Hebrew. No doctrinal interpretation has been added.
  issues:
  - severity: high
    issue: “uliyempa” has the wrong indirect-object reference.
    rationale: The Hebrew first-person suffix in עִמָּדִי (“with me”) and the construction identify the woman as the one God gave to the man. In Swahili, this requires “uliyenipa,” not “uliyempa.”
  revised_text: Mwanamume akasema, “Mwanamke uliyenipa awe pamoja nami—yeye ndiye aliyenipa matunda kutoka kwenye mti[a], nami nikala.”
