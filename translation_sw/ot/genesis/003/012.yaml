base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: sw
  text: Mwanamume akasema, “Mwanamke uliyenipa awe pamoja nami—yeye ndiye aliyenipa matunda kutoka kwenye mti[a], nami nikala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka kwenye mti.” Neno “matunda” limeongezwa kwa sababu kitu alichopewa kinaeleweka kutokana na muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: Mwanamume
  rationale: Katika muktadha huu neno hilo linamtaja mtu wa kiume mmoja, si wanadamu kwa ujumla. ‘Mwanamume’ linahifadhi maana hiyo bila kuingiza jina ‘Adamu,’ ambalo halipo wazi katika mstari huu.
- source_word: הָאִשָּׁה
  choice: Mwanamke
  rationale: Hili ndilo neno la moja kwa moja kwa mhusika anayetajwa; ‘mke’ linawezekana kimuktadha lakini lingeifanya tafsiri iwe mahususi kuliko Kiebrania.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: uliyempa awe pamoja nami
  rationale: Kauli hii inaonyesha kwamba Mungu alimpa mwanamke kuwa pamoja na mwanamume. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya uandamani.
- source_word: הִוא
  choice: yeye ndiye
  rationale: Kiwakilishi huru kina msisitizo katika Kiebrania. ‘Yeye ndiye’ kinaonyesha msisitizo huo kwa Kiswahili cha kawaida bila kuzidisha lawama.
- source_word: נָתְנָה לִי
  choice: aliyenipa
  rationale: Wakati uliopita unafaa mfululizo wa simulizi, na kiambishi cha yambwa ‘-ni-’ kinawakilisha ‘mimi.’
- source_word: מִן הָעֵץ
  choice: matunda kutoka kwenye mti
  rationale: Kiebrania kinasema kihalisi ‘kutoka kwenye mti’ bila kutaja matunda. Kiswahili kinahitaji kitu alichopewa; ‘matunda’ yanaongezwa kwa uwazi kutokana na muktadha, huku tanbihi ikihifadhi umbo la chanzo.
- source_word: וָאֹכֵל
  choice: nami nikala
  rationale: Muundo huu unahifadhi mfuatano rahisi wa matendo na kiunganishi cha Kiebrania bila kuongeza maana ya sababu kama ‘kwa hiyo.’
theological_decisions:
- issue: Kauli inaweza kudokeza kwamba mwanamume anamlaumu mwanamke na pia Mungu.
  choice: Kuhifadhi kauli ‘Mwanamke uliyempa awe pamoja nami’ bila kuipunguza wala kuikazia zaidi.
  alternative: ‘Mwanamke uliyenipa’ au ‘Mwanamke uliyemweka hapa pamoja nami.’
  rationale: Kiebrania kinaacha mvutano huo wazi. Tafsiri haipaswi kuondoa wala kuongeza lawama inayodokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Yeye ndiye’ huhifadhi msisitizo wa kiwakilishi cha Kiebrania; dash ndefu inaonyesha mkazo wa usemi bila kuongeza ufafanuzi wa kimadhehebu.
