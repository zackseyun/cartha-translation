  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: sw
  text: Mwanamke akamwambia nyoka[a], “Tunaruhusiwa kula matunda ya miti ya bustani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno kwa neno, Kiebrania husema: “matunda ya mti wa bustani”; hapa “mti” linaeleweka kwa maana ya jumla, yaani “miti.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wa waw-consecutive unaendeleza tukio. Kiswahili hutumia ‘aka-’ kwa mfuatano wa matendo, na kiambishi ‘-mw-’ huonyesha kwa kawaida anayeelekezewa maneno.
- source_word: הָאִשָּׁה
  choice: mwanamke
  rationale: Neno hili linamtaja mhusika wa kike, si hasa nafasi yake kama mke; ‘mwanamke’ ni la kawaida na linaendana na muktadha.
- source_word: הַנָּחָשׁ
  choice: nyoka
  rationale: ‘Nyoka’ ni neno la kawaida, la sasa, na lenye heshima katika Kiswahili kwa נָחָשׁ, bila kuongeza utambulisho wa kitheolojia usiotajwa katika mstari.
- source_word: מִפְּרִי
  choice: matunda ya
  rationale: Katika Kiswahili cha kawaida, ruhusa ya kula kutoka katika mazao ya miti huelezwa kwa ‘kula matunda ya’; kutafsiri מִן moja kwa moja kama ‘kutoka’ hapa kungekuwa si ya asili.
- source_word: עֵץ
  choice: miti
  rationale: Ingawa umbo la Kiebrania ni umoja, hapa linaeleweka kwa maana ya mkusanyiko au ugawaji. Wingi ‘miti’ unaonyesha ruhusa ya jumla bila kudokeza mti mmoja tu.
- source_word: הַגָּן
  choice: bustani
  rationale: ‘Bustani’ ni tafsiri ya kawaida ya גָּן na huhifadhi mazingira mahususi ya simulizi.
- source_word: נֹאכֵל
  choice: tunaruhusiwa kula
  rationale: Katika muktadha, imperfect ya nafsi ya kwanza wingi inaonyesha ruhusa, ikirejelea ruhusa ya 2:16. ‘Tunaruhusiwa kula’ ni wazi zaidi kuliko ‘tunaweza kula,’ ambayo inaweza kumaanisha uwezo tu.
theological_decisions:
- issue: Upeo wa miti au matunda yaliyoruhusiwa katika jibu la mwanamke
  choice: matunda ya miti ya bustani
  alternative: matunda ya mti wa bustani
  rationale: Ingawa עֵץ ni umoja kisarufi, muktadha unaunga mkono maana ya mkusanyiko au ugawaji inayohusu miti kwa jumla. Wingi wa Kiswahili huepuka wazo lisilokusudiwa kwamba mwanamke anataja mti mmoja tu kabla ya kueleza katazo katika mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. ‘Akamwambia’ huhifadhi mtiririko wa masimulizi kwa namna ya asili; ‘tunaruhusiwa’ huonyesha ruhusa badala ya uwezo pekee.
