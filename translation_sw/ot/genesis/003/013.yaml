base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: sw
  text: Kisha Yahwe Mungu akamwambia mwanamke, “Ni nini hiki ulichofanya?” Mwanamke akasema, “Nyoka alinidanganya, nami nikala.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA,’ hivyo kuhifadhi jina binafsi katika matini ya Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa אֱלֹהִים katika muungano ‘Yahwe Mungu.’
- source_word: לָאִשָּׁה
  choice: akamwambia mwanamke
  rationale: אִשָּׁה inaweza kumaanisha mwanamke au mke; hapa simulizi linamtaja kama ‘mwanamke,’ bila kulazimisha maana ya kindoa.
- source_word: מַה זֹּאת עָשִׂית
  choice: Ni nini hiki ulichofanya?
  rationale: Tafsiri hii inahifadhi kiulizi מַה na kionyeshi זֹּאת, na haitafsiri swali hilo kana kwamba linauliza sababu (‘Kwa nini?’).
- source_word: הַנָּחָשׁ
  choice: Nyoka
  rationale: ‘Nyoka’ ni neno la asili na la kawaida katika Kiswahili sanifu kwa kiumbe kinachotajwa hapa, huku muktadha ukibeba uzito wa kisimulizi na kitheolojia.
- source_word: הִשִּׁיאַנִי
  choice: alinidanganya
  rationale: Kitenzi hiki huonyesha kupotosha au kudanganya; ‘alinidanganya’ ni cha kisasa, wazi, na hakiongezi wazo lisilokuwamo katika Kiebrania.
- source_word: וָאֹכֵל
  choice: nami nikala
  rationale: Huhifadhi mfuatano rahisi wa matukio kwa kiunganishi, bila kuongeza kwa lazima maana ya kisababishi kama ‘kwa hiyo.’
theological_decisions:
- issue: Maelezo ya mwanamke kuhusu tendo la nyoka
  choice: Nyoka alinidanganya
  alternative: Nyoka alinipotosha
  rationale: ‘Alinidanganya’ huhifadhi madai ya udanganyifu katika Kiebrania kwa lugha inayoeleweka, bila kuamua zaidi kuhusu kiwango cha uwajibikaji wa mwanamke au kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa, wazi na chenye hadhi. Muundo ‘Ni nini hiki ulichofanya?’ umechaguliwa ili kudumisha msisitizo wa Kiebrania ingawa ni rasmi kidogo kuliko ‘Umefanya nini?’ Hakuna tanbihi iliyoongezwa kwa kuwa ‘alinidanganya’ huwasilisha maana kwa uwazi bila haja ya mbadala wa kizamani.
