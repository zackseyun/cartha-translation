  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: sw
  text: Lakini nyoka akamwambia mwanamke, “Hakika hamtakufa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina ukanushaji wenye muundo wa kusisitiza wa kitenzi “kufa”; maana yake ni, “Hakika hamtakufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akamwambia
  rationale: Kiunganishi cha simulizi kinaendeleza tukio, lakini hapa kauli ya nyoka inapingana moja kwa moja na onyo lililotangulia; kwa hiyo “Lakini” linaonyesha uhusiano huo wa upinzani kwa kawaida katika Kiswahili.
- source_word: הַנָּחָשׁ
  choice: nyoka
  rationale: נָחָשׁ humaanisha nyoka. “Nyoka” ni neno la kawaida, la sasa, na linalofaa katika simulizi hili bila kuongeza maana isiyomo katika Kiebrania.
- source_word: הָאִשָּׁה
  choice: mwanamke
  rationale: אִשָּׁה linaweza kumaanisha mwanamke au mke. Hapa “mwanamke” linadumisha namna simulizi linavyomtaja kabla ya kupewa jina Hawa.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: Hakika hamtakufa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichokanushwa unatoa mkazo wa uhakika. “Hakika hamtakufa” linaweka mkazo kwenye ukanushaji kamili na kuepuka maana yenye utata ya kwamba huenda wasife. Umbo la wingi la nafsi ya pili limehifadhiwa katika “hamta-”.
theological_decisions:
- issue: Nguvu ya nyoka kulikanusha onyo la Mungu
  choice: “Hakika hamtakufa” kama ukanushaji wa moja kwa moja na wenye mkazo
  alternative: “Hamtakufa” bila neno la mkazo
  rationale: Kiebrania kinarudia wazo la kufa kwa muundo wenye mkazo na kukana onyo la Mwanzo 2:17 moja kwa moja. Tafsiri inahifadhi ukali huo bila kuamua ikiwa kifo kinachozungumziwa ni cha mara moja au cha baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Akamwambia” ni mtiririko wa kawaida wa masimulizi, na “hamtakufa” linaonyesha wazi kwamba kauli ya Kiebrania inawaelekea watu zaidi ya mmoja.
