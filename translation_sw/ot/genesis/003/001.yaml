base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: sw
  text: Nyoka alikuwa mjanja kuliko wanyama wote wa porini ambao Yahwe Mungu alikuwa amewafanya.[a] Akamwambia mwanamke, “Je, kweli Mungu[b] alisema, ‘Msile kutoka katika mti wowote wa bustani’?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwerevu” au “mwenye hila.” Neno la Kiebrania linaweza kueleza busara katika miktadha mingine, lakini hapa lina dokezo la udanganyifu.
    reason: lexical_alternative
  - marker: b
    text: Msimulizi anasema “Yahwe Mungu,” lakini nyoka anasema “Mungu” tu; tofauti hiyo inafuata maneno ya Kiebrania.
    reason: alternative_reading
  - marker: c
    text: Au “kutoka katika kila mti wa bustani.” Katika swali hili lililokanushwa, “mti wowote” huonyesha vizuri jinsi nyoka anavyopanua katazo la Mungu kupita kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: Nyoka
  rationale: הַנָּחָשׁ ni ‘nyoka.’ Kiunganishi וְ kinaendelezwa kwa mtiririko wa simulizi bila kuongeza neno la wakati lisilokuwapo katika Kiebrania.
- source_word: עָרוּם
  choice: mjanja
  rationale: Neno hili linaweza kumaanisha kuwa mwerevu au mwenye hila. ‘Mjanja’ ni la kawaida katika Kiswahili na katika muktadha huu linaweza kubeba dokezo la udanganyifu bila kuondoa kabisa upana wa maana ya Kiebrania.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: kuliko wanyama wote wa porini
  rationale: מִן pamoja na כֹּל huunda ulinganisho. ‘Wanyama wa porini’ ni Kiswahili cha kawaida kwa viumbe wa nchi kavu au uwandani wanaotajwa hapa.
- source_word: אֲשֶׁר עָשָׂה
  choice: ambao ... alikuwa amewafanya
  rationale: Huhifadhi kitenzi עָשָׂה, ‘fanya,’ na wakati timilifu unaoonyesha kwamba kuwafanya kulitangulia tukio hili.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Huhifadhi jina la agano יְהוָה kama ‘Yahwe’ na muungano wake na אֱלֹהִים, ‘Mungu.’
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: Akamwambia mwanamke
  rationale: Muundo wa ‘aka-’ unaendeleza simulizi kwa kawaida, huku ‘mwanamke’ ikihifadhi jina analotumiwa hapa bila kumwita Hawa mapema.
- source_word: אַף כִּי אָמַר אֱלֹהִים
  choice: Je, kweli Mungu alisema
  rationale: ‘Je, kweli’ huwasilisha swali lenye mashaka na dokezo la kupinga linaloletwa na אַף כִּי, kwa Kiswahili cha kawaida.
- source_word: לֹא תֹאכְלוּ
  choice: Msile
  rationale: Umbo la wingi la katazo limehifadhiwa kwa ‘msile,’ likimhusisha mwanamke pamoja na mwingine au wengine kama ilivyo katika Kiebrania.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: matunda ya mti wowote katika bustani
  rationale: Katika swali lililokanushwa, ‘mti wowote’ huwasilisha vizuri upotoshaji wa nyoka. ‘Matunda’ yanawekwa wazi kwa Kiswahili cha asili kwa sababu kula kutoka kwa mti humaanisha kula mazao yake.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina binafsi la Mungu, kwa hiyo ‘Yahwe’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Tofauti kati ya יְהוָה אֱלֹהִים na אֱלֹהִים
  choice: Msimulizi aseme ‘Yahwe Mungu,’ lakini nyoka aseme ‘Mungu’
  alternative: Kutumia ‘Yahwe Mungu’ katika sehemu zote mbili
  rationale: Tofauti hiyo imo wazi katika Kiebrania na inaweza kuwa muhimu katika mazungumzo; haipaswi kusawazishwa.
- issue: Dokezo la kimaadili la עָרוּם
  choice: mjanja
  alternative: mwerevu; mwenye hila
  rationale: ‘Mjanja’ huruhusu maana ya werevu huku muktadha wa swali la udanganyifu ukitoa dokezo hasi; tafsiri haimtambulishi nyoka kwa mhusika mwingine wa kitheolojia ambaye hatajwi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni mwepesi, na swali la nyoka limeachwa na hali yake ya mashaka bila kufafanuliwa kupita matini.
