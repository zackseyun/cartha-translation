  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: sw
  text: Akamwambia mwanamke, “Nitazidisha sana uchungu wako na ujauzito wako[a]; kwa uchungu utazaa watoto[b]. Tamaa yako itakuwa kwa mume wako[c], naye atakutawala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutungwa kwa mimba kwako.” Neno la Kiebrania linaweza kumaanisha kutungwa kwa mimba au ujauzito.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana”; hapa yaelekea linamaanisha watoto au uzao kwa ujumla.
    reason: lexical_alternative
  - marker: c
    text: Au, “shauku.” Neno hili adimu la Kiebrania linaweza kumaanisha hamu kwa maana pana. Wengine hulielewa kuwa tamaa ya kumtawala mume (linganisha Mwanzo 4:7), na wengine kuwa shauku ya kihusiano au ya kingono.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: mwanamke
  rationale: Katika tukio hili Mungu anamwambia binadamu wa kike; neno la baadaye אִישֵׁךְ ndilo linalobainisha uhusiano wa ndoa.
- source_word: הַרְבָּה אַרְבֶּה
  choice: nitazidisha sana
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza kuongezeka kwa kiwango kikubwa; usemi huu unaweka msisitizo huo kwa Kiswahili cha kawaida.
- source_word: עִצְּבוֹנֵךְ
  choice: uchungu wako
  rationale: Neno linaweza kumaanisha uchungu, taabu, au kazi ngumu. Muktadha wa kuzaa na matumizi yanayofuata ya עֶצֶב yanaunga mkono ‘uchungu.’
- source_word: וְהֵרֹנֵךְ
  choice: mimba zako
  rationale: Neno linaweza kurejelea kutungwa kwa mimba au hali ya ujauzito. ‘Mimba zako’ ni usemi wa kawaida wa Kiswahili na unafaa kwa maana ya jumla katika muktadha huu.
- source_word: בְּעֶצֶב
  choice: kwa uchungu
  rationale: Kirai hiki kinaeleza hali au namna ya kuzaa; ‘kwa uchungu’ ni cha asili na kinafuata maana ya Kiebrania.
- source_word: תֵּלְדִי בָנִים
  choice: utazaa watoto
  rationale: Ingawa בָנִים kwa umbo ni ‘wana,’ hapa inarejelea watoto au uzao kwa ujumla.
- source_word: אִישֵׁךְ
  choice: mume wako
  rationale: Katika uhusiano unaotajwa hapa, אִישׁ humaanisha mume, si mwanamume kwa ujumla.
- source_word: תְּשׁוּקָתֵךְ
  choice: tamaa yako itakuwa kwa
  rationale: Neno hili la Kiebrania ni adimu na maana yake kamili inajadiliwa. ‘Tamaa’ huhifadhi wazo pana la hamu bila kuamua kama ni shauku ya kimapenzi, utegemezi wa kihusiano, au nia ya kutawala.
- source_word: יִמְשָׁל בָּךְ
  choice: atakutawala
  rationale: Kitenzi humaanisha kutawala au kuongoza. ‘Atakutawala’ ni tafsiri ya moja kwa moja bila kuongeza wazo lenye nguvu zaidi la ukandamizaji.
theological_decisions:
- issue: Maana ya ‘tamaa’ ya mwanamke kwa mume wake
  choice: Kutumia ‘tamaa’ bila kubainisha aina yake katika matini kuu.
  alternative: Shauku ya kingono; hamu au utegemezi wa kihusiano; au tamaa ya kumdhibiti mume, kwa kulinganisha na Mwanzo 4:7.
  rationale: תְּשׁוּקָה ni neno adimu, na muktadha haulazimishi maana moja mahususi. Tanbihi huhifadhi njia kuu za kulielewa bila kutatua mvutano wa kifasiri kimabavu.
- issue: Ikiwa kutawala kwa mume ni amri au maelezo ya hali itakayotokea
  choice: 'Kutafsiri kama maelezo ya yatakayotokea: ‘atakutawala.’'
  alternative: Kuliona kama agizo lisiloelezwa wazi kuhusu mamlaka ya mwanamume.
  rationale: Umbo la Kiebrania linasema kitakachotokea, si jambo linalopaswa kutokea. Tafsiri haiongezi dai la kimadhehebu ambalo halijawekwa wazi na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mpangilio na msisitizo wa Kiebrania huku ikitumia misemo inayoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa mara moja kila moja mahali panapohusika.
