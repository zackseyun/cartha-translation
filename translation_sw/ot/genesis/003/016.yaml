  verdict: revise
  source_fidelity: Draft follows the Hebrew clause structure and preserves the emphatic multiplication, childbirth pain, the disputed sense of תְּשׁוּקָה, and the descriptive future of the husband's rule. However, the singular suffix on וְהֵרֹנֵךְ is better represented by singular ‘ujauzito wako’ than plural ‘mimba zako.’
  naturalness: ‘Kwa mwanamke alisema’ is not idiomatic independent Kiswahili. ‘Akamwambia mwanamke’ is natural and retains the Hebrew's implied subject. The remaining phrasing is clear, dignified Standard East African Swahili.
  terminology: ‘Uchungu,’ ‘ujauzito,’ ‘watoto,’ ‘mume wako,’ ‘tamaa,’ and ‘atakutawala’ are appropriate. ‘Tamaa’ suitably retains the lexical and interpretive breadth of the rare Hebrew noun; the note supplies alternatives without deciding among them.
  issues:
  - severity: medium
    issue: Opening clause is syntactically awkward in Swahili.
    rationale: ‘Kwa mwanamke alisema’ reproduces Hebrew word order too closely and lacks a natural Swahili verbal object construction. ‘Akamwambia mwanamke’ conveys ‘to the woman he said’ idiomatically.
  - severity: low
    issue: ‘Mimba zako’ is plural whereas the Hebrew has a singular second-person suffix on הֵרֹנֵךְ.
    rationale: The intensifying verb can imply repeated pregnancies, but singular ‘ujauzito wako’ more directly preserves the Hebrew form and is natural in this context.
  - severity: low
    issue: Footnote c’s controlling-desire alternative does not identify the object in Swahili.
    rationale: ‘Tamaa ya kumtawala’ is clearer and reflects the interpretive proposal without making it the main-text meaning.
