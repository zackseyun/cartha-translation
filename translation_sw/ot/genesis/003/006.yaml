  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: sw
  text: Basi mwanamke akaona kwamba mti huo ulikuwa mzuri kwa chakula, kwamba ulipendeza machoni[a], na kwamba mti huo ulikuwa wa kutamanika kwa kumfanya mtu awe na hekima[b]. Akachukua baadhi ya matunda yake, akala. Pia akampa mume wake aliyekuwa pamoja naye, naye akala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulikuwa wa kutamanika machoni.” Usemi wa Kiebrania unasisitiza mvuto wa mti kwa kuonekana.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kupata hekima.” Kiebrania kinaweza kueleza kupata hekima au kumfanya mtu awe na hekima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: akaona
  rationale: Kitenzi cha kawaida cha kuona katika masimulizi; “akaona” kinadumisha maana ya moja kwa moja bila kuongeza tafsiri.
- source_word: הָאִשָּׁה
  choice: mwanamke
  rationale: Kinatafsiri nomino ya Kiebrania moja kwa moja na kudumisha namna mhusika anavyotajwa katika simulizi.
- source_word: טוֹב ... לְמַאֲכָל
  choice: mzuri kwa chakula
  rationale: Kinadumisha tathmini ya טוֹב na wazo la kufaa kuliwa, kwa Kiswahili cha kawaida.
- source_word: תַאֲוָה ... לָעֵינַיִם
  choice: ulipendeza machoni
  rationale: Kiswahili asilia kinachoonyesha mvuto wa kuonekana bila kuingiza mapema maana hasi ya tamaa ya dhambi.
- source_word: וְנֶחְמָד
  choice: ulitamaniwa
  rationale: Huonyesha kuwa mti ulionekana wa kuvutia au wa kutamanika, huku ikihifadhi tofauti yake na kishazi cha mvuto wa macho.
- source_word: לְהַשְׂכִּיל
  choice: kwa kumpa mtu hekima
  rationale: Hiphil ya שכל inaweza kueleza kumpatia mtu hekima au ufahamu; tafsiri hii ni ya kawaida na haimtaji mhusika asiyeelezwa wazi.
- source_word: מִפִּרְיוֹ
  choice: baadhi ya matunda yake
  rationale: Ingawa Kiebrania kwa karibu ni “kutoka katika tunda lake,” Kiswahili hiki kinaweka wazi kwa njia ya kawaida kwamba alichukua sehemu ya matunda.
- source_word: וַתִּתֵּן גַּם
  choice: Pia akampa
  rationale: “Pia” linadumisha maana ya nyongeza ya גַּם kwa mpangilio wa kawaida wa Kiswahili.
- source_word: לְאִישָׁהּ עִמָּהּ
  choice: mume wake aliyekuwa pamoja naye
  rationale: “Mume wake” inafaa kwa nomino yenye kiambishi cha umilikaji katika muktadha huu, na kishazi kinadhihirisha kwamba alikuwa pamoja naye.
theological_decisions:
- issue: Rangi ya kimaadili katika mtazamo wa mwanamke
  choice: 'Kutumia maneno yasiyoongeza hukumu ya kimaadili: “mzuri,” “ulipendeza,” na “ulitamaniwa.”'
  alternative: Kutumia maneno yenye maana hasi zaidi kama “ulichochea tamaa” au “alilitamani kwa dhambi.”
  rationale: Kiebrania kinasimulia tathmini ya mwanamke kwa lugha ya mvuto kabla ya kutaja tendo; tafsiri haipaswi kuingiza hukumu kali kuliko ilivyo katika matini.
- issue: Maana ya לְהַשְׂכִּיל
  choice: “kwa kumpa mtu hekima” katika matini, huku tanbihi ikitaja uwezekano wa “kwa kupata hekima.”
  alternative: “kwa kupata hekima.”
  rationale: Umbo la Kiebrania linaweza kueleweka kwa upande wa kupata hekima au kusababisha mtu kuwa na hekima; tanbihi inadumisha utata huo.
- issue: Kuwapo kwa mume pamoja na mwanamke
  choice: Kuweka wazi “mume wake aliyekuwa pamoja naye.”
  alternative: “akampa pia mume wake pamoja naye.”
  rationale: עִמָּהּ husema kwamba mume alikuwa pamoja naye; kishazi tegemezi ni Kiswahili wazi bila kuongeza dai kuhusu muda ambao hakuwapo au aliwasili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi vya “aka-” unafaa masimulizi. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
