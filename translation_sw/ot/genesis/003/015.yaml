base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: sw
  text: Nami nitaweka uadui[a] kati yako na mwanamke, na kati ya uzao wako[b] na uzao wake; yeye[c] atakuponda kichwa[d], nawe utamjeruhi kisigino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhasama.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “uzao” katika sehemu zote mbili; neno hilo linaweza kumaanisha wazao kwa jumla au mwakilishi mmoja.
    reason: lexical_alternative
  - marker: c
    text: Au, “huo.” Kiwakilishi cha Kiebrania ni umoja wa kiume baada ya nomino yenye maana ya mkusanyiko.
    reason: alternative_reading
  - marker: d
    text: Kiebrania kinatumia kitenzi kilekile katika vishazi vyote viwili. Kinaweza pia kutafsiriwa “piga” au “jeruhi”; “ponda” katika kishazi cha kwanza huonyesha ukali mkubwa zaidi unaodokezwa na jeraha la kichwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: uadui
  rationale: Neno hili huonyesha upinzani mkali na wa kudumu; “uadui” ni la kawaida, lenye uzito, na linafaa katika Kiswahili cha sasa.
- source_word: אָשִׁית
  choice: nitaweka
  rationale: Qal ya שׂים humaanisha kuweka au kutia; “nitaweka” ni tafsiri ya moja kwa moja na ya asili hapa.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: kati yako na huyo mwanamke
  rationale: Muundo wa uhusiano na usambamba wa Kiebrania umehifadhiwa; “huyo” humrejelea mwanamke ambaye tayari yuko katika muktadha.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: uzao wako ... uzao wake
  rationale: “Uzao” huhifadhi picha ya זֶרַע na pia uwezekano wake wa kumaanisha wazao kwa jumla au mwakilishi mmoja, bila kulazimisha “mbegu” ya kibayolojia katika Kiswahili.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi cha Kiebrania ni umoja wa kiume baada ya nomino ya mkusanyiko; “yeye” huhifadhi rejeo la mtu mmoja huku tanbihi ikibainisha uwezekano wa maana ya mkusanyiko.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: atakuponda ... utamjeruhi
  rationale: 'Kitenzi kilekile adimu kimetumiwa mara mbili katika Kiebrania, lakini sehemu zinazolengwa zinaonyesha tofauti ya ukali: jeraha la kichwa ni zito kuliko la kisigino. Tanbihi inadumisha uwazi kuhusu kurudiwa kwa kitenzi.'
- source_word: רֹאשׁ
  choice: kichwa
  rationale: Ni jina la sehemu ya mwili lenye maana ya moja kwa moja.
- source_word: עָקֵב
  choice: kisigino
  rationale: Ni jina la sehemu ya mwili lenye maana ya moja kwa moja.
theological_decisions:
- issue: Iwapo “uzao wa mwanamke” uonyeshwe kuwa wa mkusanyiko au mtu mmoja
  choice: “Uzao” imetumiwa katika sehemu zote mbili, kisha “yeye” katika sentensi inayofuata.
  alternative: Kutumia “wazao” na “wao,” au “uzao huo” na “huo.”
  rationale: Kiebrania hurudia nomino ya mkusanyiko זֶרַע kisha hutumia kiwakilishi cha umoja wa kiume. Tafsiri hii huhifadhi mvutano kati ya maana ya wazao kwa jumla na mwakilishi mmoja bila kuingiza moja kwa moja tafsiri maalumu ya kimasiya.
- issue: Ukali wa tafsiri ya שׁוּף katika kishazi cha kwanza
  choice: “Atakuponda” kwa kichwa na “utamjeruhi” kwa kisigino.
  alternative: “Atakupiga ... utampiga” au “atakuumiza ... utamuumiza.”
  rationale: Ingawa Kiebrania kina kitenzi kilekile katika vishazi vyote viwili, tofauti kati ya kichwa na kisigino inadokeza matokeo yenye viwango tofauti vya ukali. Tanbihi inaweka wazi kurudiwa kwa kitenzi na njia nyingine halali za kukitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa usambamba wa Kiebrania umehifadhiwa, huku “uzao” na tanbihi zikidumisha utata halisi wa umoja na mkusanyiko.
