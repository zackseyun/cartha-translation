  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: sw
  text: Ndipo Yahwe[a] Mungu akamwita mwanamume huyo, akamwambia, “Uko wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Kitenzi cha Kiebrania קרא katika mfululizo wa simulizi kinaonyesha kwamba Mungu alimwita mtu huyo; “akamwita” ni Kiswahili cha kawaida na chenye hadhi bila kuongeza wazo la kumwamuru afike.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Jina la agano יְהוָה limetolewa kama “Yahwe,” na אֱלֹהִים kama “Mungu,” kwa kufuata moja kwa moja jina la Mungu lililo katika matini ya Kiebrania.
- source_word: הָאָדָם
  choice: mwanamume huyo
  rationale: Katika muktadha huu neno hilo linamtaja mtu mahususi wa kiume bustanini, si wanadamu kwa ujumla. Kionyeshi “huyo” kinawakilisha umahususi wa kibainishi cha Kiebrania.
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na wazi kwamba alisema maneno hayo kwake, hivyo unahifadhi kiwakilishi לוֹ bila urudiaji usio wa kawaida.
- source_word: אַיֶּכָּה
  choice: Uko wapi?
  rationale: Ni swali la moja kwa moja kwa nafsi ya pili umoja kuhusu mahali alipo, bila kuongeza maana ya wakati au nia isiyotajwa.
- source_word: וַ
  choice: Ndipo
  rationale: “Ndipo” linaonyesha mwendelezo na hatua inayofuata katika simulizi kwa Kiswahili cha asili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina maalumu la Mungu, יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo; tafsiri iliyozoeleka “BWANA” imetajwa katika tanbihi.
- issue: Anayerejelewa na הָאָדָם
  choice: mwanamume huyo
  alternative: mtu huyo / wanadamu
  rationale: Ingawa אָדָם linaweza kumaanisha binadamu au wanadamu, hapa Mungu anamwambia mtu mmoja wa kiume katika simulizi. Tafsiri haifanyi neno hilo kuwa jina maalumu “Adamu,” wala kulipanua kuwa wanadamu wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi “akamwita … akamwambia” ni wa kawaida katika simulizi na huhifadhi mwendo wa matini ya Kiebrania.
