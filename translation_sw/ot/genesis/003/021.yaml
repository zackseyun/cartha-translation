translation:
  language: sw
  text: Yahwe Mungu aliwatengenezea mwanamume na mke wake nguo za ngozi[a], akawavika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavazi ya ngozi”; neno la Kiebrania linaweza kumaanisha vazi la aina ya tunika. Pia, “Adamu na mke wake”; neno la Kiebrania אָדָם linaweza kumaanisha “mwanamume” au kutumiwa kama jina “Adamu,” kutegemea muktadha.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahwe Mungu
  rationale: Huhifadhi jina binafsi la Mungu lililo katika tetragramatoni na kulifuata kwa cheo אֱלֹהִים, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: לְאָדָם
  choice: mwanamume
  rationale: Katika muktadha huu אָדָם inamtaja yule mtu wa kiume kwa kulinganishwa na mke wake. 'Mwanamume' ni ya kawaida na sahihi kijinsia; usomaji wa jina 'Adamu' umehifadhiwa katika tanbihi.
- source_word: וּלְאִשְׁתּוֹ
  choice: na mke wake
  rationale: Nomino אִשָּׁה pamoja na kiambishi cha nafsi ya tatu umoja wa kiume humaanisha kwa kawaida 'mke wake' katika muktadha huu wa ndoa.
- source_word: כָּתְנוֹת עוֹר
  choice: mavazi ya ngozi
  rationale: Hutoa maana ya kawaida ya mavazi ya kuvaliwa mwilini yaliyotengenezwa kwa ngozi bila kubainisha zaidi umbo lake; 'kanzu za ngozi' ni mbadala wa kileksia.
- source_word: וַיַּעַשׂ
  choice: akamtengenezea
  rationale: Kitenzi עשה kina maana ya 'kutengeneza/kufanya'; umbo lenye yambwa hutiririsha kwa Kiswahili wazo la kumtengenezea mtu mavazi.
- source_word: וַיַּלְבִּשֵׁם
  choice: akawavika
  rationale: Hifili ya לבש humaanisha kusababisha mtu avae; 'akawavika' ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
theological_decisions:
- issue: Iwapo אָדָם itafsiriwe kama jina binafsi au nomino ya kawaida
  choice: 'nomino ya kawaida: “mwanamume”'
  alternative: 'jina binafsi: “Adamu”'
  rationale: Mstari unamtaja mtu wa kiume sambamba na 'mke wake,' na katika hatua hii ya simulizi neno la Kiebrania bado linaweza kusomwa kama nomino ya kawaida. Tanbihi inahifadhi uwezekano halisi wa kulisoma kama jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi na yenye hadhi. Muundo wa mfululizo wa vitenzi 'akamtengenezea ... akawavika' unadumisha mwendo wa simulizi ya Kiebrania.
