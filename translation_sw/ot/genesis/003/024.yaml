base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: sw
  text: Hivyo akamfukuza mtu huyo; kisha akaweka makerubi na mwali wa upanga unaogeuka kila upande upande wa mashariki wa bustani ya Edeni[a], ili kulinda njia ya kuufikia mti wa uzima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inaweza pia kutafsiriwa “mashariki ya bustani ya Edeni.” Kirai cha Kiebrania kinaweza kurejelea upande wa mashariki, au upande wa mbele, wa bustani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: akamfukuza
  rationale: Kitenzi גרשׁ kinaonyesha kumtoa mtu kwa nguvu au kumfukuza; “akamfukuza” ni Kiswahili cha kawaida chenye nguvu inayofaa muktadha.
- source_word: הָאָדָם
  choice: huyo mtu
  rationale: Hapa אָדָם anamrejelea mtu mmoja aliyetajwa tayari katika simulizi, si wanadamu kwa ujumla. “Huyo mtu” huonyesha rejeleo hilo bila kulifanya jina maalumu.
- source_word: וַיַּשְׁכֵּן
  choice: akaweka
  rationale: Hifili ya שכן hapa ina maana ya kuweka au kusimamisha mahali. “Akaweka” ni ya asili katika Kiswahili na inafaa kwa walinzi waliowekwa mahali.
- source_word: מִקֶּדֶם לְגַן־עֵדֶן
  choice: upande wa mashariki wa bustani ya Edeni
  rationale: Kirai kinaashiria eneo la mashariki au upande wa mbele wa bustani; tafsiri hii ni wazi na ya kawaida huku tanbihi ikihifadhi uwezekano wa kuelewa kuwa ni mashariki ya bustani.
- source_word: הַכְּרֻבִים
  choice: makerubi
  rationale: “Makerubi” ni istilahi ya kibiblia iliyozoeleka katika Kiswahili kwa viumbe hawa wa mbinguni na inaonyesha wingi wa Kiebrania.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: mwali wa upanga unaogeuka kila upande
  rationale: Hii huhifadhi muundo wa Kiebrania, “mwali wa upanga,” pamoja na mwendo unaoendelea wa kitenzi-shirikishi, bila kuubadili moja kwa moja kuwa “upanga wa moto.”
- source_word: לִשְׁמֹר
  choice: ili kulinda
  rationale: Katika muktadha wa kuzuia mtu asifikie mti, שמר ina maana ya kulinda au kuweka chini ya ulinzi.
- source_word: דֶּרֶךְ
  choice: njia ya kuufikia
  rationale: Kiebrania kinasema kihalisi “njia ya mti wa uzima”; “njia ya kuufikia” huwasilisha kwa Kiswahili cha kawaida maana ya njia inayoelekea kwenye mti.
- source_word: עֵץ הַחַיִּים
  choice: mti wa uzima
  rationale: Hii ndiyo tafsiri ya moja kwa moja na iliyozoeleka ya kirai hiki cha Kiebrania.
theological_decisions:
- issue: Maana ya אָדָם katika muktadha wa simulizi
  choice: huyo mtu
  alternative: mwanadamu; wanadamu
  rationale: Aya inamrejelea mtu mmoja aliyefukuzwa kutoka Edeni. Tafsiri ya umoja huhifadhi rejeleo la simulizi bila kugeuza neno hilo kuwa wanadamu kwa ujumla.
- issue: Kile kinachogeuka katika kirai לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: mwali wa upanga unaogeuka kila upande
  alternative: upanga wa moto unaogeuka kila upande
  rationale: Kiebrania kina “mwali wa upanga,” huku umbo la neno linalomaanisha kugeuka likipatana kisarufi na “upanga.” Kwa kuwa ngeli ya “mwali” na “upanga” ni ileile katika Kiswahili, tafsiri hii haiamui kimya kimya kama mwali au upanga ndio unaogeuka, hivyo inadumisha mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Sentensi imetumia “Basi” na mfululizo wa vitenzi “akamfukuza… akaweka” ili kudumisha mtiririko wa simulizi la Kiebrania. Istilahi “makerubi” na “mti wa uzima” zimehifadhiwa kama lugha ya kibiblia iliyoeleweka.
