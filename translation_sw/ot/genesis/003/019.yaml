  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: sw
  text: Kwa jasho la uso wako utakula mkate mpaka utakaporudi ardhini,[a] kwa sababu ulitolewa humo; kwa maana wewe ni mavumbi, nawe utarudi mavumbini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “Kwa jasho la kipaji chako.” Kiebrania kinasema “jasho la uso wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: Kwa jasho la uso wako
  rationale: Muundo huu unafuata moja kwa moja taswira ya Kiebrania, yaani ‘kwa jasho la uso wako.’ Kiswahili ‘jasho la uso wako’ ni wazi na cha asili, huku ‘jasho la kipaji chako’ likiwa namna ya kimethali zaidi.
- source_word: תֹּאכַל לֶחֶם
  choice: utakula mkate
  rationale: לֶחֶם humaanisha hasa ‘mkate,’ ingawa hapa inaweza pia kuwakilisha chakula au riziki kwa ujumla. Tafsiri inadumisha neno halisi na taswira ya chanzo.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: mpaka utakaporudi ardhini
  rationale: אֲדָמָה ni ardhi au udongo. ‘Ardhini’ ni Kiswahili cha kawaida kinachoonyesha mahali ambako mtu anarudi na kudumisha uhusiano na asili yake.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: kwa sababu ulitwaliwa kutoka humo
  rationale: Kishazi hiki kinaeleza sababu ya kurudi ardhini. Kiwakilishi cha Kiebrania kinarejelea אֲדָמָה; ‘humo’ hurejelea ardhi kwa njia ya asili katika Kiswahili. ‘Ulitwaliwa’ pia hudumisha hali tendwa ya kitenzi.
- source_word: כִּי
  choice: kwa sababu / kwa maana
  rationale: כִּי ya kwanza inaonyesha sababu moja kwa moja, kwa hiyo ‘kwa sababu’ inafaa. Ya pili inaanzisha maelezo ya msingi kuhusu hali ya mwanadamu, kwa hiyo ‘kwa maana’ inaleta mtiririko wa kawaida bila kulazimisha kiunganishi kilekile mara zote.
- source_word: עָפָר
  choice: mavumbi
  rationale: '‘Mavumbi’ ni tafsiri ya kawaida na sahihi ya עָפָר katika tamko hili la asili na mwisho wa mwili wa mwanadamu. Pia inadumisha marudio yenye uzito: ‘wewe ni mavumbi ... utarudi mavumbini.’'
- source_word: תָּשׁוּב
  choice: utarudi
  rationale: Kitenzi hiki kinatangaza matokeo ya hakika. Wakati ujao wa Kiswahili unaonyesha wazi uhakika huo bila kutumia mtindo wa kizamani.
theological_decisions:
- issue: Kufa kwa mwanadamu na asili yake ya kimwili
  choice: Mstari umetafsiriwa kama tamko kwamba mwanadamu atarudi kimwili katika ardhi au mavumbi ambako alitwaliwa.
  alternative: Kusisitiza zaidi maana ya mfano ya kudhalilishwa kuliko kifo cha mwili.
  rationale: Muktadha wa karibu na uhusiano wa maneno אֲדָמָה (‘ardhi/udongo’) na עָפָר (‘mavumbi’) unaunga mkono kurudi kwa mwili ardhini katika kifo. Tafsiri haiongezi maelezo ya kimafundisho yaliyo nje ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ardhini’ na ‘humo’ huleta mtiririko wa asili; ‘mavumbi ... mavumbini’ hudumisha uzito na marudio ya Kiebrania.
