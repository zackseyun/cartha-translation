  text: וְ/ק֥וֹץ וְ/דַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑/ךְ וְ/אָכַלְתָּ֖ אֶת עֵ֥שֶׂב הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: sw
  text: Nayo itakuoteshea miiba na michongoma[a], nawe utakula mimea ya shambani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itakuchipushia miiba na michongoma.” Kitenzi cha Kiebrania kina maana ya kusababisha kuota, na kinarejelea ardhi iliyotajwa katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “uoto wa shambani.” Neno la Kiebrania lina maana pana ya mimea, na kwa mapokeo pia limetafsiriwa “majani ya shambani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ
  choice: miiba
  rationale: Neno קוֹץ linamaanisha uoto wenye miiba; wingi wa jumla ni wa kawaida katika Kiswahili na unafaa katika jozi hii.
- source_word: וְדַרְדַּר
  choice: michongoma
  rationale: Neno דַּרְדַּר linataja mmea au gugu lenye miiba tofauti na קוֹץ. “Michongoma” inadumisha tofauti hiyo bila kudai kwa uhakika aina maalumu ya kibotania.
- source_word: תַּצְמִיחַ לָךְ
  choice: itakuoteshea
  rationale: Muundo wa Hifili una maana ya kusababisha kuota. “Itakuoteshea” ni Kiswahili cha asili kinachohifadhi nguvu hiyo ya kisababishi pamoja na maana ya לָךְ, yaani ardhi kutoa uoto huo kwa ajili ya mwanadamu, hapa ukiwa mzigo kwake.
- source_word: וְאָכַלְתָּ
  choice: nawe utakula
  rationale: Kauli hii inaendeleza matokeo yanayotazamiwa; wakati ujao unasikika kwa kawaida na kwa uwazi katika Kiswahili.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: mimea ya shambani
  rationale: עֵשֶׂב ni neno pana kwa uoto unaoweza kuwa chakula, wala si nyasi tu. “Mimea ya shambani” ni ya kisasa, inayoeleweka, na inadumisha uhusiano na השדה.
theological_decisions:
- issue: Kirejeleo cha kitenzi cha kike umoja תַּצְמִיחַ
  choice: “Nayo” inarejelea ardhi iliyotajwa katika mstari uliotangulia.
  alternative: Kutaja wazi “ardhi” katika mstari huu, au kutumia kauli isiyo na kirejeleo dhahiri.
  rationale: Katika Kiebrania, kitenzi cha kike umoja kinarejelea kwa kawaida הָאֲדָמָה, “ardhi,” ya mstari wa 17. “Nayo” huhifadhi mfululizo huo bila kurudia nomino ambayo haimo wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Itakuoteshea” ni cha kawaida lakini bado kinahifadhi maana ya kisababishi; “mimea” huepuka kuifanya עֵשֶׂב kuwa nyasi pekee.
