  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: sw
  text: Akasema, “Nilisikia sauti[a] yako bustanini, nikaogopa kwa sababu nilikuwa uchi, hivyo nikajificha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha “mlio” au “sauti ya mtu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Huwasilisha kwa njia ya kawaida mtiririko wa masimulizi wa Kiebrania bila kuongeza msisitizo usiokuwamo.
- source_word: אֶת קֹלְךָ
  choice: sauti yako
  rationale: Neno la Kiebrania קוֹל linaweza kumaanisha sauti kwa ujumla au sauti ya kusema. ‘Sauti yako’ ni ya asili katika Kiswahili na haidai kwamba maneno yaliyotamkwa ndiyo yaliyosikiwa.
- source_word: שָׁמַעְתִּי
  choice: Nilisikia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi שמע katika muktadha huu.
- source_word: בַּגָּן
  choice: bustanini
  rationale: Mahali hapa tayari panajulikana katika muktadha; umbo la Kiswahili linaonyesha kuwa sauti ilisikiwa ndani ya bustani.
- source_word: וָאִירָא
  choice: nikaogopa
  rationale: Hueleza hofu ya Adamu kwa Kiswahili cha kawaida huku ikiendeleza mfuatano wa masimulizi.
- source_word: כִּי
  choice: kwa sababu
  rationale: 'Huwasilisha wazi maana ya kisababishi: kuwa uchi ndiko kulikotajwa kuwa sababu ya kuogopa.'
- source_word: עֵירֹם אָנֹכִי
  choice: nilikuwa uchi
  rationale: Kishazi cha Kiebrania hakina wakati uliowekwa wazi, lakini wakati uliopita unafaa katika maelezo ya Adamu kuhusu sababu ya tendo lake la awali.
- source_word: וָאֵחָבֵא
  choice: hivyo nikajificha
  rationale: ‘Nikajificha’ huhifadhi maana ya kujificha mwenyewe, na ‘hivyo’ huonyesha uhusiano wa matokeo unaoeleweka katika muktadha.
theological_decisions:
- issue: Maana ya קוֹל kuhusiana na uwepo wa Mungu
  choice: sauti yako
  alternative: mlio wako; sauti yako ya kusema
  rationale: Kiebrania kinaweza kurejelea sauti kwa ujumla au sauti ya kusema. ‘Sauti’ huhifadhi upana huo kwa Kiswahili, huku tanbihi ikionyesha uwezekano wa maana zote mbili bila kuamua kwamba hapa yalikuwa maneno yaliyotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Mfululizo wa ‘nika-’ unaleta mtiririko wa kawaida wa masimulizi.
