  text: Mwanamume akamwita mke wake Hawa[a], kwa sababu alikuwa mama wa wote walio hai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Adamu akamwita mke wake Hawa.” Kiebrania kinasema “mwanamume,” kikiwa na kibainishi.
