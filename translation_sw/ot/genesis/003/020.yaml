lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Kitenzi hiki katika muktadha wa kumpa mtu jina kina maana ya kumwita au kumtaja; “akamwita” ni Kiswahili cha kawaida na kinabaki karibu na muundo wa Kiebrania.
- source_word: הָאָדָם
  choice: mwanamume
  rationale: Neno lina kibainishi, hivyo hapa ni “mwanamume,” si lazima jina maalumu “Adamu.”
- source_word: שֵׁם אִשְׁתּוֹ
  choice: mke wake
  rationale: Katika Kiswahili, “akamwita mke wake Hawa” huwasilisha kwa kawaida tendo la kumpa jina bila kunakili kihalisi muundo usio wa kawaida wa “aliita jina la mke wake.”
- source_word: חַוָּה
  choice: Hawa
  rationale: “Hawa” ni umbo la jina hili lililozoeleka katika Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaanzisha sababu ya kuitwa kwa jina hilo.
- source_word: הָיְתָה
  choice: alikuwa
  rationale: Kitenzi kinaeleza hali, wala si lazima mabadiliko ya kuwa kitu kingine.
- source_word: אֵם כָּל חָי
  choice: mama wa wote walio hai
  rationale: Tafsiri hii huhifadhi usemi mpana wa Kiebrania bila kuufanya umaanishe wanadamu pekee au viumbe vyote kwa lazima.
theological_decisions:
- issue: Ikiwa הָאָדָם ni jina maalumu “Adamu” au maelezo “mwanamume”
  choice: mwanamume
  alternative: Adamu
  rationale: Kibainishi cha Kiebrania kinaunga mkono maana ya maelezo, “mwanamume.” Tanbihi inahifadhi usomaji wa jina maalumu unaoweza kueleweka katika muktadha.
- issue: Upeo wa maana ya אֵם כָּל חָי
  choice: mama wa wote walio hai
  alternative: mama wa viumbe vyote vilivyo hai / mama wa kila aliye hai
  rationale: Usemi wa asili ni mfupi na una upeo usioamuliwa wazi. Tafsiri haubani kwa wanadamu pekee wala kuupanua wazi kwa kila kiumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akamwita mke wake Hawa” ni wa kawaida zaidi kuliko kunakili fomula ya Kiebrania neno kwa neno; usemi “wote walio hai” huhifadhi upana na mvutano wa maana ya asili.
