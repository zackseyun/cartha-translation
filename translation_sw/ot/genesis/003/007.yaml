base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: sw
  text: Ndipo macho ya wote wawili yakafumbuliwa, wakajua kwamba walikuwa uchi. Basi wakashona majani ya mtini pamoja na kujitengenezea vifuniko vya kiunoni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguo za kiunoni” au “aproni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: yakafumbuliwa
  rationale: Huhifadhi tamathali ya Kiebrania na hali ya kutendwa ya kitenzi bila kufafanua kupita kiasi aina ya utambuzi walioupata.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: macho ya wote wawili
  rationale: Hutoa wazi msisitizo kwamba jambo hilo liliwapata wote wawili.
- source_word: וַיֵּדְעוּ
  choice: wakajua
  rationale: Ni tafsiri ya moja kwa moja ya ידע na haiongezi dhana kama aibu au dhamiri ambazo hazikutajwa wazi.
- source_word: עֵירֻמִּם
  choice: walikuwa uchi
  rationale: Ni Kiswahili cha kawaida na sahihi kinachodumisha uhusiano wa simulizi na Mwanzo 2:25.
- source_word: וַיִּתְפְּרוּ
  choice: wakashona ... pamoja
  rationale: Kitenzi 'kushona' kinaeleza tendo hilo kwa kawaida; 'pamoja' huonyesha kwamba majani yaliunganishwa.
- source_word: עֲלֵה תְאֵנָה
  choice: majani ya mtini
  rationale: Hii ndiyo namna ya kawaida na sahihi ya kutafsiri muundo wa Kiebrania unaomaanisha majani ya mti wa tini.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: kujitengenezea
  rationale: Umbo la kujirejelea linaonyesha wazi kuwa walivitengeneza kwa ajili yao wenyewe.
- source_word: חֲגֹרֹת
  choice: vifuniko vya kiunoni
  rationale: Nomino inarejelea vitu vinavyofungwa au kuzungushiwa mwilini; tafsiri hii ni wazi huku ikiepuka kubainisha kupita kiasi umbo kamili la vazi.
theological_decisions:
- issue: Uhusiano wa kujua uchi na aibu au ufahamu wa maadili
  choice: 'Kutafsiri matukio kama yalivyoelezwa: macho yakafumbuliwa, wakajua walikuwa uchi, kisha wakajitengenezea vifuniko.'
  alternative: Kuongeza kwamba waliaibika au dhamiri zao ziliamka.
  rationale: Mstari unaashiria mabadiliko ya kujitambua, lakini hautaji wazi aibu wala kueleza kiini cha mabadiliko hayo; tafsiri haipaswi kutatua mvutano huo kimafundisho.
- issue: Maana mahususi ya חֲגֹרֹת
  choice: vifuniko vya kiunoni
  alternative: nguo za ndani; aproni; mikanda
  rationale: Neno linaonyesha kitu kinachovaliwa kwa kuzungushiwa mwili, lakini umbo lake kamili halijaainishwa. Chaguo hili linatoa eneo na kazi kwa uangalifu bila kudai aina fulani ya vazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye 'Ndipo' na 'Basi' unaonyesha mfuatano wa matendo kwa kawaida. Alama [a] imewekwa baada ya neno linalohitaji ufafanuzi.
