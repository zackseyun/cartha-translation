  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: sw
  text: Ndipo YHWH Mungu akamwambia nyoka[a], “Kwa sababu umefanya jambo hili, umelaaniwa kuliko mifugo yote na kuliko kila mnyama wa mwituni. Kwa tumbo lako utakwenda, nawe utakula mavumbi[b] siku zote za maisha yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “joka,” yaani nyoka mkubwa.
    reason: lexical_alternative
  - marker: b
    text: Usemi “kula mavumbi” unaweza pia kuwa picha ya kudhalilishwa na kushindwa, wala si lazima ueleze chakula halisi pekee.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: YHWH Mungu
  rationale: Huhifadhi jina la agano la Mungu pamoja na cheo אֱלֹהִים bila kulichanganya na neno la kawaida la Kiswahili ‘Bwana’; umbo YHWH pia huepuka kudai matamshi yasiyo na uhakika.
- source_word: הַנָּחָשׁ
  choice: nyoka
  rationale: ‘Nyoka’ ni neno la kawaida na sahihi la Kiswahili kwa kiumbe kinachotajwa; Kiswahili hakihitaji neno tofauti lenye sajili ya kifasihi kama ‘serpent’ ya Kiingereza.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: Kwa sababu umefanya jambo hili
  rationale: Huwasilisha wazi uhusiano wa sababu unaoanzisha hukumu.
- source_word: אָרוּר אַתָּה מִכָּל
  choice: umelaaniwa kuliko
  rationale: ‘Kuliko’ huonyesha matumizi ya kulinganisha ya מִן kwa Kiswahili cha kawaida, huku ‘umelaaniwa’ ikidumisha kauli ya hukumu.
- source_word: הַבְּהֵמָה
  choice: mifugo
  rationale: Hurejelea kwa kawaida wanyama wa kufugwa na kuhifadhi tofauti yao na wanyama wa mwituni.
- source_word: חַיַּת הַשָּׂדֶה
  choice: mnyama wa mwituni
  rationale: Hutoa maana ya mnyama asiye wa kufugwa katika mazingira ya wazi; ni Kiswahili cha sasa na cha asili.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: Utakwenda kwa tumbo lako
  rationale: Huhifadhi kitenzi cha jumla ‘kwenda’ badala ya kuingiza ‘kutambaa,’ ambacho hakijasemwa wazi katika Kiebrania.
- source_word: וְעָפָר תֹּאכַל
  choice: nawe utakula mavumbi
  rationale: Huhifadhi taswira halisi ya kula mavumbi bila kuamua katika matini kuu ikiwa ni lishe halisi pekee au pia ishara ya kudhalilishwa.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: siku zote za maisha yako
  rationale: Huhifadhi ukamilifu na mdundo wa usemi wa Kiebrania.
theological_decisions:
- issue: Utambulisho wa nyoka
  choice: Matini kuu inamtaja tu kama nyoka.
  alternative: Kumtambua moja kwa moja kama Shetani katika tafsiri.
  rationale: Aya yenyewe inazungumza na הַנָּחָשׁ na kueleza hukumu kwa lugha ya kiumbe; haitaji jina Shetani. Uhusiano wa baadaye wa kimaandiko hauingizwi katika maneno ya aya hii.
- issue: Asili ya kula mavumbi
  choice: Kudumisha taswira bila kuifafanua katika matini kuu.
  alternative: Kutafsiri moja kwa moja kama kushindwa au kudhalilishwa.
  rationale: Usemi unaweza kueleweka kwa hali ya kiumbe na pia kama picha ya fedheha na kushindwa; tafsiri haifungi maana katika upande mmoja.
- issue: Upeo wa laana ukilinganishwa na wanyama wengine
  choice: ‘kuliko’ kama ulinganisho
  alternative: ‘kutoka miongoni mwa’ kama utengaji
  rationale: מִן inaeleweka vizuri hapa kwa matumizi ya kulinganisha, ingawa kauli haifafanui kwa kina hali ya laana ya wanyama wengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi wa Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ni wa asili bila kupoteza msisitizo, taswira, au utata halisi wa Kiebrania.
