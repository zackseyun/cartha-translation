id: GEN.3.8
reference: Genesis 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: sw
  text: Nao wakasikia sauti ya Yahwe Mungu akitembea bustanini wakati wa upepo wa siku hiyo[a][b], na mwanamume huyo[c] pamoja na mke wake wakajificha mbele za Yahwe Mungu miongoni mwa miti ya bustani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa ubaridi wa siku.” Kwa neno, “wakati wa upepo wa siku.”
    reason: lexical_alternative
  - marker: b
    text: “Sauti” pia inaweza kumaanisha “sauti ya kusema.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “mwanamume huyo”; au, “Adamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: sauti
  rationale: Neno hili linaweza kumaanisha sauti ya kusema au sauti kwa maana pana. Kiswahili “sauti” kinahifadhi utata huo bila kudai kwamba Mungu alisema maneno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo kama “BWANA.”
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na linalofaa katika Kiswahili, hapa likiwa sambamba na jina Yahwe.
- source_word: מִתְהַלֵּךְ
  choice: akitembea
  rationale: Linahifadhi taswira halisi ya Mungu akitembea bila kuilegeza au kuifafanua kiteolojia.
- source_word: בַּגָּן
  choice: bustanini
  rationale: Ni tafsiri ya kawaida ya mahali, “katika bustani,” iliyotolewa kwa Kiswahili cha asili.
- source_word: לְרוּחַ הַיּוֹם
  choice: wakati wa upepo wa siku hiyo
  rationale: Inatafsiri רוּחַ kama upepo na kuepuka kuamua bila ulazima kuwa ulikuwa “ubaridi wa jioni.”
- source_word: הָאָדָם
  choice: huyo mwanamume
  rationale: Muktadha wa “mke wake” unaelekeza kwa mwanamume mmoja; “huyo” huonyesha mhusika aliyetajwa tayari huku tanbihi ikihifadhi uwezekano wa jina Adamu.
- source_word: וְאִשְׁתּוֹ
  choice: na mke wake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kiunganishi pamoja na nomino yenye kiambishi cha umilikaji.
- source_word: מִפְּנֵי
  choice: mbali na uwepo wa
  rationale: Inahifadhi wazo la kujiondoa mbele ya uso au uwepo wa Mungu, si kujificha tu asionekane.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: katikati ya miti ya bustani
  rationale: עֵץ ya umoja imetumiwa kwa maana ya pamoja; Kiswahili huhitaji wingi “miti” katika muktadha huu.
theological_decisions:
- issue: Taswira ya Mungu akitembea bustanini
  choice: Kuhifadhi usemi halisi “akitembea”
  alternative: Kusema “akizunguka” au “uwepo wake ukipita”
  rationale: Kiebrania kinatoa taswira thabiti ya kibinadamu kuhusu Mungu. Tafsiri haiipunguzi wala kuifafanua kwa mfumo fulani wa kiteolojia.
- issue: Maana ya הָאָדָם
  choice: huyo mwanamume
  alternative: Adamu; huyo binadamu
  rationale: Kutajwa kwa “mke wake” kunaunga mkono rejeo kwa mwanamume huyo mmoja, lakini tanbihi inaacha wazi usomaji wa jina “Adamu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumiwa kwa urahisi wa kusoma, huku jina Yahwe, utata wa “sauti,” upepo wa siku, na taswira ya Mungu akitembea vikihifadhiwa.
