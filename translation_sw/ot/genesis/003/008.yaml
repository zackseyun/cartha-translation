revisions:
- from: Kisha wakasikia sauti ya Yahwe Mungu akitembea bustanini wakati wa upepo wa siku hiyo[a][b]; na huyo mwanamume[c] na mke wake wakajificha mbali na uwepo wa Yahwe Mungu katikati ya miti ya bustani.
  to: Nao wakasikia sauti ya Yahwe Mungu akitembea bustanini wakati wa upepo wa siku hiyo[a][b], na mwanamume huyo[c] pamoja na mke wake wakajificha mbele za Yahwe Mungu miongoni mwa miti ya bustani.
  rationale: The revision removes the unwarranted specification of physical distance, uses an idiomatic equivalent for hiding among the trees, and corrects the Hebrew gloss in the footnote. It otherwise preserves the draft's source-sensitive lexical choices and its restrained narrative register.
