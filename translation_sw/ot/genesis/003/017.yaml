  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: sw
  text: Akamwambia Adamu[a], “Kwa sababu uliisikiliza sauti ya mke wako[b] na ukala matunda ya mti ambao nilikuamuru, nikisema[c], ‘Usile matunda yake,’ ardhi imelaaniwa kwa sababu yako[d]. Kwa taabu[e] utakula mazao yake siku zote za maisha yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akamwambia mwanamume huyo.” Neno la Kiebrania linaweza kuwa jina “Adamu” au kumaanisha “mwanamume huyo” katika muktadha huu.
    reason: alternative_reading
  - marker: b
    text: Kirai cha Kiebrania ni “uliisikiliza sauti ya mke wako”; katika muktadha kinaweza pia kueleweka kuwa ulimsikiliza au ulifuata alichosema.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kwa muundo wa karibu zaidi: “ambao nilikuamuru, nikisema.”'
    reason: lexical_alternative
  - marker: d
    text: Au, “ardhi imelaaniwa kwa ajili yako” au “kwa habari yako.” Kirai kinaonyesha kwamba laana hiyo imetokea kwa sababu ya Adamu.
    reason: lexical_alternative
  - marker: e
    text: Neno la Kiebrania linaweza kumaanisha taabu, uchungu, maumivu, au huzuni; hapa linahusu ugumu wa kupata chakula kwa kufanya kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: Kwa Adamu
  rationale: Katika simulizi hili neno linamtaja mtu maalumu anayesemeshwa. Jina “Adamu” linafaa katika muktadha huu, huku tanbihi ikihifadhi uwezekano wa kutafsiri “kwa mwanamume huyo.”
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: uliisikiliza sauti ya mke wako
  rationale: Huhifadhi nahau ya Kiebrania inayotaja “sauti” na kuonyesha kwamba Adamu alitii au alifuata alichosema mke wake bila kuifanya maana ya utii kuwa tafsiri pekee.
- source_word: וַתֹּאכַל מִן־הָעֵץ
  choice: ukala matunda ya mti
  rationale: Kiswahili hakiwezi kusema kwa ufasaha “ukala kutoka katika mti.” Kutaja matunda kunaeleza kwa njia ya kawaida kile kinacholiwa kutoka kwa mti, kama muktadha wa simulizi unavyoonyesha.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: ambao nilikuamuru hivi kuuhusu
  rationale: Muundo huu unaonyesha kwamba amri ilihusu mti na unaunganisha kwa ufasaha maneno ya amri yanayofuata.
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: Usile matunda yake
  rationale: Ni katazo la moja kwa moja na la kawaida katika Kiswahili. “Matunda yake” linaeleza kile kinacholiwa kutoka kwa mti bila kudokeza kula kuni au mti wenyewe.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: ardhi imelaaniwa
  rationale: “Ardhi” inafaa kwa udongo unaolimwa katika muktadha huu, na mpangilio huu ni wa kawaida katika Kiswahili cha sasa.
- source_word: בַּעֲבוּרֶךָ
  choice: kwa sababu yako
  rationale: Huonyesha kisababishi—laana ya ardhi imetokea kwa sababu ya Adamu—bila maana chanya inayoweza kusikika katika “kwa ajili yako.”
- source_word: בְּעִצָּבוֹן
  choice: kwa taabu
  rationale: Katika muktadha wa kupata chakula kutoka ardhini, “taabu” huwasilisha ugumu na mateso yanayoambatana na kazi; tanbihi inahifadhi upana wa maana ya neno.
- source_word: תֹּאכֲלֶנָּה
  choice: utakula mazao yake
  rationale: Kiambishi cha Kiebrania kinarejelea ardhi, lakini maana si kula udongo wenyewe. “Mazao yake” huonyesha kwa Kiswahili cha kawaida chakula kinachopatikana kutoka ardhini.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: siku zote za maisha yako
  rationale: Huhifadhi nahau, uzito, na mwendo wa maneno ya hukumu ya Kiebrania.
theological_decisions:
- issue: Maana ya אָדָם katika muktadha wa simulizi
  choice: Adamu
  alternative: mwanamume huyo
  rationale: Aya inamwelekea mtu maalumu katika simulizi la Edeni. Hata hivyo, Kiebrania kinaweza kueleweka kama jina “Adamu” au kama “mwanamume huyo,” kwa hiyo uwezekano huo umewekwa katika tanbihi.
- issue: Uhusiano wa laana na Adamu
  choice: ardhi imelaaniwa kwa sababu yako
  alternative: ardhi imelaaniwa kwa ajili yako / ardhi imelaaniwa kwa ajili ya kosa lako
  rationale: Kiebrania kinaonyesha kuwa laana ya ardhi ni kwa sababu au kwa habari ya Adamu. Tafsiri iliyochaguliwa haisemi kwamba Adamu mwenyewe alilaaniwa, wala haiongezi wazi “kosa” lisilotajwa katika kirai hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia miundo ya kawaida kama “matunda ya mti” na “mazao yake” badala ya miundo isiyo ya kawaida ya kusema kula “kutoka” kwa mti au ardhi. Alama zote za tanbihi [a]–[e] zimewekwa katika matini kuu.
