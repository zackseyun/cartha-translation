  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: sw
  text: Hakumtambua, kwa sababu mikono yake ilikuwa na nywele kama mikono ya Esau ndugu yake; kwa hiyo akambariki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye akambariki.” Umbo la masimulizi la Kiebrania linaweza kutafsiriwa kama mfuatano wa matukio tu, ingawa hapa linaweza pia kudokeza matokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: Hakumtambua
  rationale: Kitenzi נכר katika Hifili hapa humaanisha kumtambua au kumtambua mtu ni nani; katika muktadha Isaka hakutambua kuwa aliyemgusa alikuwa Yakobo.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי inaanzisha sababu ya Isaka kutomtambua Yakobo.
- source_word: יָדָיו
  choice: mikono yake
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja, ikirejelea mikono ya Yakobo.
- source_word: כִּידֵי
  choice: kama mikono ya
  rationale: Kiambishi כְּ־ kinaonyesha ulinganisho; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Huhifadhi neno la uhusiano wa kindugu pamoja na kiambishi chake bila kulipanua.
- source_word: שְׂעִרֹת
  choice: ilikuwa na nywele
  rationale: Kiswahili cha kawaida hueleza sifa hii ya mikono kwa kusema ilikuwa na nywele; jambo hili ndilo lililomdanganya Isaka kwa njia ya kugusa.
- source_word: וַיְבָרְכֵהוּ
  choice: kwa hiyo akambariki
  rationale: Umbo la masimulizi linaendeleza tukio na katika muktadha linaweza pia kuonyesha matokeo ya kutomtambua; 'kwa hiyo' huonyesha mtiririko huo wa kimatokeo.
