  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: sw
  text: Akasema, “Ndugu yako alikuja kwa udanganyifu[a], akachukua baraka yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa hila” au “kwa njia ya udanganyifu.” Kiebrania kinatumia nomino “udanganyifu” pamoja na kihusishi, ambayo inaweza kutafsiriwa kwa njia kadhaa za kawaida katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Muundo wa kawaida wa masimulizi ya Kiebrania unaoanzisha jibu la Isaka; ‘Akasema’ ni wa asili na huhifadhi mfuatano bila kuongeza kiunganishi kisichohitajika katika Kiswahili.
- source_word: בָּא
  choice: alikuja
  rationale: Kitenzi cha tendo lililokamilika katika muktadha wa masimulizi; wakati uliopita unafaa kwa Kiswahili.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Tafsiri ya moja kwa moja ya jina lenye kiambishi cha nafsi ya pili umoja; huhifadhi mkazo wa uhusiano wa kifamilia badala ya kuweka jina la Yakobo.
- source_word: בְּמִרְמָה
  choice: kwa udanganyifu
  rationale: Kihusishi ב pamoja na nomino מִרְמָה huonyesha namna au njia. ‘Kwa udanganyifu’ huhifadhi umbo la nomino na uzito wake wa kimaadili.
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Huendeleza mfuatano wa masimulizi; ‘akachukua’ ni ya kawaida na haiongezi wazo la kutumia nguvu.
- source_word: בִּרְכָתֶךָ
  choice: baraka yako
  rationale: Tafsiri ya moja kwa moja inayohifadhi maana ya baraka ya baba iliyokusudiwa kwa Esau katika muktadha.
