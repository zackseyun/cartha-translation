  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: sw
  text: Kisha utampelekea baba yako, naye atakula, ili akubariki kabla ya kufa kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Kisha utampelekea
  rationale: Kitenzi cha nafsi ya pili umoja wa kiume katika mfuatano wa maagizo kinaelezwa kwa wakati ujao wenye nguvu ya agizo; “Kisha” linaonyesha hatua inayofuata katika mpango.
- source_word: לְאָבִיךָ
  choice: baba yako
  rationale: Ni tafsiri ya kawaida na ya asili ya אָב yenye kiambishi cha nafsi ya pili umoja; “baba” linafaa katika masimulizi yenye heshima bila kuwa la kizamani.
- source_word: וְאָכָל
  choice: naye atakula
  rationale: 'Linaendeleza mfuatano wa matendo yanayotarajiwa: baada ya kupelekewa chakula, baba atakula. “Naye” huhifadhi uhusiano wa kiunganishi na kubainisha mtendaji.'
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: ili
  rationale: Muungano huu unatambulisha kusudi la kupeleka chakula na kula kwake; “ili” ni Kiswahili cha kawaida na sahihi kwa kishazi cha kusudi.
- source_word: יְבָרֶכְךָ
  choice: akubariki
  rationale: Huhifadhi maana ya moja kwa moja ya kitenzi ברך katika muktadha wa baraka ya baba kwa mwana, huku hali ya utegemezi baada ya “ili” ikiwa ya asili kwa Kiswahili.
- source_word: לִפְנֵי מוֹתוֹ
  choice: kabla ya kufa kwake
  rationale: Huhifadhi muundo wa jina la kitendo na kiambishi kinachomhusu Isaka, pamoja na uzito wa kauli ya Kiebrania.
