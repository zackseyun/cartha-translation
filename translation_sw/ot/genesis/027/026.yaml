  yaml_path: translation/ot/genesis/027/026.yaml
  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: sw
  text: Kisha Isaka, baba yake, akamwambia, “Tafadhali, njoo karibu unibusu, mwanangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akamwambia” hujumuisha maana ya kusema kwake.
- source_word: אֵלָיו
  choice: akamwambia
  rationale: Kihusishi chenye kiambishi cha nafsi ya tatu kinaonyesha anayeelekezewa maneno; katika Kiswahili maana hiyo huwasilishwa kiasili ndani ya kitenzi “akamwambia.”
- source_word: יִצְחָק אָבִיו
  choice: Isaka, baba yake
  rationale: Mpangilio huu unahifadhi uhusiano wa kiapposisheni na msisitizo wa kifamilia wa Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: גְּשָׁה
  choice: njoo karibu
  rationale: Amri hii inamtaka mtu asogee karibu kimwili; “njoo karibu” ni ya kawaida na inafaa muktadha.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe hii hulainisha ombi; “tafadhali” ndiyo njia ya kawaida ya kuonyesha adabu hiyo katika muktadha huu.
- source_word: וּשְׁקָה לִּי
  choice: unibusu
  rationale: Kitenzi pamoja na לִי kinaonyesha Isaka ndiye anayebusuriwa. Kiswahili huwasilisha jambo hilo kwa kawaida kwa kiambishi cha yambwa “-ni-” katika “unibusu.”
- source_word: בְּנִי
  choice: mwanangu
  rationale: Kauli ya kumwita mwana imehifadhiwa, pamoja na uhusiano wa kifamilia na sauti ya upendo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa Maandiko. Hakuna tanbihi iliyowekwa kwa kuwa “njoo karibu” huwasilisha maana ya גְּשָׁה moja kwa moja; tanbihi ya Kiingereza “Approach, please” ni tofauti ya kimtindo, si maana mbadala yenye uzito katika Kiswahili.
