base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: sw
  text: Kisha Rebeka akachukua mavazi mazuri ya Esau, mwanawe mkubwa, yaliyokuwa kwake nyumbani, akamvika Yakobo, mwanawe mdogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Kisha ... akachukua
  rationale: Waw-consecutive inaendeleza mfuatano wa simulizi; “Kisha” ni ya asili katika Kiswahili na huhifadhi ufuatano huo.
- source_word: בִּגְדֵי
  choice: mavazi
  rationale: Neno hili linamaanisha vitu vya kuvaliwa; “mavazi” ni la kawaida, lenye staha, na linafaa mazingira ya simulizi.
- source_word: הַחֲמֻדֹת
  choice: mazuri
  rationale: Katika muktadha wa mavazi, neno linaonyesha kitu kinachopendwa, chenye thamani, au kilichochaguliwa. “Mazuri” ni Kiswahili cha kawaida na hakiongezi wazo lisilo lazima la anasa au kwamba hayo yalikuwa bora kuliko yote.
- source_word: בְּנוֹ הַגָּדֹל
  choice: mwanawe mkubwa
  rationale: Katika kulinganisha ndugu wawili, גָּדוֹל humtaja aliye mkubwa kwa umri; “mwanawe mkubwa” ni usemi wa kawaida wa Kiswahili na unalingana na “mwanawe mdogo” baadaye.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: yaliyokuwa kwake nyumbani
  rationale: Tafsiri hii inafuata kwa karibu maana ya mahali/umilikaji ya Kiebrania, “yaliyokuwa pamoja naye nyumbani,” bila kuongeza kwamba alikuwa ameyahifadhi kwa kusudi fulani.
- source_word: וַתַּלְבֵּשׁ
  choice: akamvika
  rationale: Kitenzi cha Kiswahili “kumvika” huonyesha kwa kawaida kumvalisha mtu mavazi yaliyotajwa na hudumisha mtiririko mfupi wa simulizi.
- source_word: בְּנוֹ הַקָּטָן
  choice: mwanawe mdogo
  rationale: קָטָן hapa inatofautisha Yakobo na Esau kwa umri, si kwa ukubwa wa mwili; “mwanawe mdogo” ni wazi na ya asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa urahisi. Muundo wa sentensi huhifadhi mfuatano wa simulizi na jozi ya mwana mkubwa/mwana mdogo. Hakuna tanbihi iliyoongezwa kwa sababu vibadala vya kileksika havihitajiki ili kuelewa mstari huu na tafsiri kuu haifuti utata muhimu wa kitheolojia.
