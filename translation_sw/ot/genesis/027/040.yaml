base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: sw
  text: Nawe utaishi kwa upanga wako, na utamtumikia ndugu yako; lakini utakapo jinasua[a], utaivunja nira yake kutoka shingoni mwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utakapokosa utulivu.” Kitenzi cha Kiebrania hapa ni kigumu; muktadha wa kuivunja nira unaunga mkono tafsiri “utakapojinasua,” lakini maana kama “utakapokosa utulivu” pia inawezekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: Nawe utaishi kwa upanga wako
  rationale: Kirai 'kwa upanga wako' kinaonyesha njia au chombo cha kujipatia maisha, huku kikihifadhi taswira halisi ya upanga.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: na utamtumikia ndugu yako
  rationale: Kitenzi עבד kinamaanisha 'kutumikia' hapa; tafsiri hii haibainishi kupita kiasi aina ya utiifu wa kijamii au kisiasa.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: lakini utakapo
  rationale: Muundo huu unaanzisha hali ya wakati ujao yenye ugeuzi wa kimawazo kutoka katika utumishi kuelekea kujikomboa.
- source_word: תָּרִיד
  choice: utakapoasi
  rationale: Kitenzi hiki cha Kiebrania ni kigumu. Katika muktadha wa kuivunja nira, 'kuasi' hutoa kwa Kiswahili wazo la kupinga na kujinasua kutoka utawala bila kurudia kitenzi 'vunja' cha kishazi kinachofuata.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: utaivunja nira yake
  rationale: פרק ina nguvu ya kuvunja au kuondoa kwa nguvu, na עֹל ni 'nira'; taswira ya utawala mzito imehifadhiwa.
- source_word: מֵעַל צַוָּארֶךָ
  choice: kutoka shingoni mwako
  rationale: Hii ni njia ya asili katika Kiswahili ya kuonyesha kuondolewa kwa nira iliyokuwa juu ya shingo.
theological_decisions:
- issue: Hali ya baadaye ya uhusiano wa Esau na Yakobo
  choice: Usemi umetafsiriwa kama utumishi unaofuatwa na uasi na kujiondoa katika utawala.
  alternative: Kuufanya utumishi kuwa wa kudumu, au kuupunguza uwe heshima ya kawaida tu kwa ndugu.
  rationale: Mstari wenyewe unataja kumtumikia ndugu na baadaye kuivunja nira yake. Tafsiri inadumisha mvutano huo bila kuingiza hitimisho pana kuhusu Edomu.
- issue: Maana ya תָּרִיד
  choice: utakapoasi
  alternative: utakapokosa utulivu / utakapotangatanga
  rationale: Muktadha wa kuivunja nira unaunga mkono wazo la uasi au kujinasua, lakini kutokuwa na uhakika kwa neno hilo kumeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Nira' imehifadhiwa kwa sababu ni taswira muhimu na neno linaloeleweka katika muktadha huu; mpangilio wa sentensi umewekwa wa asili kwa Kiswahili huku ulinganifu wa kishairi wa Kiebrania ukidumishwa.
