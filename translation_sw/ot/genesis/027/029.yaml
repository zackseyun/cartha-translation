  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: sw
  text: Mataifa yakutumikie, na mataifa yakunamie. Uwe mtawala juu ya ndugu zako, na wana wa mama yako wainame mbele yako. Wanaokulaani walaaniwe, na wanaokubariki wabarikiwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַֽעַבְד֣וּ/ךָ
  choice: yakutumikie
  rationale: Kitenzi עבד katika muktadha wa baraka hii huonyesha kutumikia au kuwa chini ya mamlaka ya mtu; “yakutumikie” ni cha kawaida na kinabaki na upana huo wa maana.
- source_word: עַמִּים
  choice: Mataifa
  rationale: עמים humaanisha vikundi vya watu au mataifa. “Mataifa” ni neno la kawaida katika Kiswahili na linafaa katika ulinganifu wa kishairi na לאמים.
- source_word: ו/ישתחו לְ/ךָ
  choice: yakusujudie
  rationale: Kitenzi השתחוה hueleza kuinama au kujilaza mbele ya mwenye cheo. “Kusujudia” huhifadhi tendo la heshima bila kulazimisha maana ya ibada kwa Mungu katika muktadha huu wa mwanadamu.
- source_word: לְאֻמִּים
  choice: makabila
  rationale: לאמים ni neno linalokaribiana na עמים kwa maana ya jumuiya au makundi ya watu. “Makabila” huleta utofauti wa kawaida wa kishairi bila kubadili wazo la vikundi vya watu.
- source_word: הֱוֵה גְבִיר
  choice: Uwe mtawala
  rationale: 'הוה pamoja na גביר huleta wazo la agizo la baraka: awe mwenye mamlaka. “Mtawala” ni la asili na huepuka kuchanganya cheo hiki cha kibinadamu na jina la Mungu “Bwana.”'
- source_word: לְ/אַחֶ֔י/ךָ
  choice: juu ya ndugu zako
  rationale: Ingawa Kiebrania hutumia ל, muundo pamoja na גביר huonyesha kuwa na mamlaka juu ya watu fulani; Kiswahili cha kawaida ni “juu ya ndugu zako.”
- source_word: בְּנֵי אִמֶּךָ
  choice: wana wa mama yako
  rationale: Tafsiri hii huhifadhi usemi halisi wa kifamilia na utofauti wake na “ndugu zako” katika mstari uliotangulia.
- source_word: אֹרְרֶי/ךָ אָר֔וּר
  choice: Wanaokulaani na walaaniwe
  rationale: Muundo huu huhifadhi kanuni ya kulipizana katika tamko la laana na kutumia hali ya kutakia inayofaa baraka ya kishairi.
- source_word: וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ
  choice: na wanaokubariki na wabarikiwe
  rationale: Huu ni ulinganifu wa moja kwa moja na tamko la laana lililotangulia; wingi wa Kiswahili unalingana kwa kawaida na “wanaokubariki.”
theological_decisions:
- issue: Lugha ya kusujudu mbele ya mwanadamu
  choice: yakusujudie / wakusujudie
  alternative: yakuinamie / wakuinamie kwa heshima; yakuabudu / wakuabudu
  rationale: Kitenzi cha Kiebrania kinaweza kutaja kujilaza kwa heshima mbele ya Mungu au mwanadamu. Katika baraka hii mhusika ni mwanadamu mwenye ukuu wa kijamii na kifamilia; “kusujudia” huhifadhi tendo na uzito wake bila kutamka kwamba ni ibada ya kimungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Hali ya kutakia “na…” imetumiwa katika baraka na laana. Hakuna tanbihi kwa sababu chaguo kuu linaweza kuhifadhi maana bila ufafanuzi wa lazima.
