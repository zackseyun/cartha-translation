  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: sw
  text: Mama yake akamwambia, “Laana yako iwe juu yangu, mwanangu. Sikiliza tu sauti yangu,[a] kisha uende ukanichukulie hao.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “sikiliza sauti yangu”; usemi huu unaweza pia kumaanisha “nitii.”
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi “hao” halitajwi wazi katika Kiebrania, bali linaeleweka kutokana na mstari uliotangulia, likirejelea wana-mbuzi.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: Mama yake akamwambia
  rationale: Muundo wa kisimulizi wa Kiswahili unaonyesha kwa kawaida tendo linalofuata kwa kiambishi -ka-. Kitenzi ‘akamwambia’ pia kinajumuisha maana ya ‘akamwambia yeye’ kwa njia ya asili.
- source_word: עָלַי קִלְלָתְךָ
  choice: Laana yako na iwe juu yangu
  rationale: Huhifadhi uhusiano wa moja kwa moja wa ‘laana yako’ na wazo la matokeo au mzigo kumwangukia Rebeka. ‘Na iwe’ hutoa tamko la kujitwika laana kwa Kiswahili cha asili bila kufafanua iwapo ni ahadi, ridhaa, au matakwa.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Ni namna ya kawaida, yenye heshima na hisia ya kifamilia ya kumwita mwana moja kwa moja.
- source_word: אַךְ
  choice: Wewe ... tu
  rationale: ‘Tu’ huonyesha kizuizi au msisitizo wa אַךְ, huku ‘wewe’ ikikazia kwamba jukumu la Yakobo ni kufanya alichoambiwa.
- source_word: שְׁמַע בְּקֹלִי
  choice: sikiliza ... sauti yangu
  rationale: Huhifadhi taswira halisi ya Kiebrania. Katika muktadha huu usemi huo unaweza pia kumaanisha kutii.
- source_word: וְלֵךְ קַח לִי
  choice: kisha uende ukanichukulie wale
  rationale: Mfuatano wa vitenzi unaonyesha maagizo yanayofuatana. ‘Wale’ inarejelea wana-mbuzi waliotajwa katika mstari uliotangulia, huku ‘-ni-’ na ‘-lie’ zikihifadhi maana ya לִי, ‘kwa ajili yangu.’
theological_decisions:
- issue: Kiwango cha kujitwika laana katika maneno ya Rebeka
  choice: Laana yako na iwe juu yangu
  alternative: Laana yako iko juu yangu
  rationale: Kiebrania ni kifungu kifupi kisicho na kitenzi, hivyo kinaweza kueleweka kama kujitwika matokeo au kama tamko lenye nguvu. Tafsiri iliyochaguliwa huhifadhi uzito huo bila kuamua kwamba laana ilikuwa tayari imemwangukia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kisimulizi ‘akamwambia’ na mfuatano ‘uende ukanichukulie’ ni wa asili; ‘mwanangu’ hudumisha ukaribu wa kifamilia. Alama zote za tanbihi zimewekwa katika matini kuu.
