  text: וַ/יִּגַּ֧שׁ יַעֲקֹ֛ב אֶל יִצְחָ֥ק אָבִ֖י/ו וַ/יְמֻשֵּׁ֑/הוּ וַ/יֹּ֗אמֶר הַ/קֹּל֙ ק֣וֹל יַעֲקֹ֔ב וְ/הַ/יָּדַ֖יִם יְדֵ֥י עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: sw
  text: Basi Yakobo akamkaribia Isaka baba yake. Isaka akamgusa-gusa, kisha akasema, “Sauti ni ya Yakobo, lakini mikono ni ya Esau.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sauti ni sauti ya Yakobo, lakini mikono ni mikono ya Esau.”
    reason: Muundo huu unafuata kwa karibu zaidi urudiaji wa nomino katika Kiebrania.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: akamkaribia
  rationale: Kitenzi נגשׁ katika qal kinaonyesha kusogea karibu na mtu; “akamkaribia” ni simulizi la kawaida la Kiswahili na linahifadhi mwendo wa tukio.
- source_word: וַיְמֻשֵּׁהוּ
  choice: akamgusa-gusa
  rationale: מושׁ hapa ni kumchunguza mtu kwa kumhisi kwa mikono ili kutambua utambulisho wake. “Akamgusa-gusa” huonyesha uchunguzi wa makusudi kuliko “akamgusa” pekee.
- source_word: הַקֹּל
  choice: Sauti
  rationale: קוֹל inaweza kumaanisha sauti kwa ujumla au sauti ya mtu. Hapa Isaka anaitambua sauti ya msemaji, hivyo “sauti” linafaa katika Kiswahili.
- source_word: קוֹל יַעֲקֹב
  choice: ni ya Yakobo
  rationale: Muundo wa umilikaji umetafsiriwa kwa Kiswahili cha kawaida kama “ni ya Yakobo”; tanbihi inahifadhi uwezekano wa kurudia nomino kama katika Kiebrania.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: lakini mikono ni ya Esau
  rationale: Ingawa וְ ni kiunganishi cha kawaida, muktadha unaonyesha wazi tofauti kati ya ushahidi wa sauti na wa mikono. “Lakini” huwasilisha utofauti huo kwa Kiswahili cha asili bila kubadili maana.
- source_word: אָבִיו
  choice: baba yake
  rationale: Hili linahifadhi wazi uhusiano wa kifamilia uliotajwa katika Kiebrania.
