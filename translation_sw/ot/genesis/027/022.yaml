translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Jina “Isaka” limerudiwa katika sentensi ya pili ili kuondoa utata wa viwakilishi vya Kiswahili kuhusu anayemgusa mwenzake na anayesema.
