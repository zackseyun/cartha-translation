base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: sw
  text: mpaka hasira ya ndugu yako ikuondokee[a], naye asahau yale uliyomtendea. Kisha nitatuma watu wakuchukue kutoka huko[b]. Kwa nini nifiwe na ninyi wawili kwa siku moja?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “mpaka hasira ya ndugu yako igeuke kutoka kwako.” Kiebrania hutumia kitenzi chenye maana ya “kugeuka/kurudi” pamoja na “hasira.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa karibu zaidi: “nitatuma na nitakuchukua kutoka huko.” Katika Kiswahili, “nitatuma watu wakuchukue” huonyesha kwa kawaida kwamba Rebeka angewatuma watu wamchukue Yakobo.'
    reason: lexical_alternative
  - marker: c
    text: Huenda kauli ya Rebeka kuhusu kufiwa na wana wote wawili inaonyesha hofu yake ya kuwapoteza wote kwa sababu ya matokeo ya mgogoro wao, si lazima kwamba wote wangekufa kwa njia ileile.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: mpaka hasira ya ndugu yako ikuondokee
  rationale: Muundo עַד pamoja na שׁוּב huonyesha kikomo cha wakati, na katika muktadha huu hasira ‘humwondokea’ mtu. Hii ni Kiswahili cha kawaida kinachohifadhi picha ya hasira kugeuka au kuondoka kutoka kwa Yakobo.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: naye asahau yale uliyomtendea
  rationale: ‘Yale uliyomtendea’ ni usemi wa asili na unaeleweka, huku ukidumisha tendo la Yakobo lililofanywa dhidi ya Esau.
- source_word: וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם
  choice: Kisha nitatuma watu wakuchukue kutoka huko
  rationale: Kiswahili huhitaji kutaja au kudokeza wanaotumwa. ‘Nitatuma watu wakuchukue’ huwasilisha mlolongo na kusudi la vitenzi ‘nitatuma’ na ‘nitakuchukua,’ bila kuongeza wazo lisilo wazi la kurudi.
- source_word: אֶשְׁכַּל גַּם שְׁנֵיכֶם
  choice: nifiwe na ninyi wawili
  rationale: Kitenzi שכל kinahusu mzazi kufiwa na watoto. ‘Nifiwe na ninyi wawili’ kinahifadhi uzito wa kifamilia na kihisia kuliko ‘niwapoteze.’
- source_word: יוֹם אֶחָד
  choice: kwa siku moja
  rationale: Hutoa maana ya msiba wa kuwapoteza wote wawili ndani ya siku moja, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya Rebeka kufiwa na wana wote wawili
  choice: Nifiwe na ninyi wawili kwa siku moja
  alternative: Niwapoteze ninyi wawili kwa siku moja
  rationale: Chanzo kinatumia neno la kufiwa na watoto, lakini hakielezi wazi kwamba wote wangekufa kwa njia ileile. Tafsiri inadumisha uzito huo bila kubainisha namna ya kumpoteza kila mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maneno ni rahisi kwa msomaji wa kawaida; “nifiwe” limehifadhiwa kwa sababu linaonyesha kwa usahihi uchungu wa mzazi unaopatikana katika kitenzi cha Kiebrania.
