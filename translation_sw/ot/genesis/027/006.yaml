  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: sw
  text: 'Rebeka akamwambia Yakobo mwanawe, “Tazama, nilimsikia baba yako akizungumza na Esau ndugu yako, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרִבְקָה אָמְרָה
  choice: Rebeka akamwambia
  rationale: Kiunganishi וְ kinaendeleza simulizi; katika Kiswahili, umbo la mfululizo ‘akamwambia’ linaonyesha mtiririko huo kwa kawaida bila kuongeza msisitizo usiokuwapo. Kitenzi ‘kumwambia’ kinafaa kwa usemi unaoelekezwa kwa mtu.
- source_word: אֶל יַעֲקֹב בְּנָהּ
  choice: Yakobo mwanawe
  rationale: Muundo wa maelezo unaomtambulisha Yakobo kuwa mwana wa Rebeka umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa jambo linalofuata. ‘Tazama’ ni la heshima na linaeleweka, bila kulibana kuwa amri ya kusikiliza tu.
- source_word: שָׁמַעְתִּי אֶת אָבִיךָ
  choice: nilimsikia baba yako
  rationale: Kauli timilifu inaeleza tukio lililokamilika; wakati uliopita wa Kiswahili unafaa katika simulizi.
- source_word: מְדַבֵּר אֶל עֵשָׂו אָחִיךָ
  choice: akizungumza na Esau ndugu yako
  rationale: Umbo la participle linaonyesha tendo lililokuwa likiendelea wakati Rebeka aliposikia. Kiswahili hutumia kwa kawaida ‘kuzungumza na’ kwa usemi unaoelekezwa kwa mtu.
- source_word: לֵאמֹר
  choice: 'akisema:'
  rationale: Neno la pili la kuanzisha usemi limewakilishwa wazi kwa ‘akisema,’ na nukta mbili zinaonyesha kwamba maneno yenyewe yanafuata katika mstari unaofuata.
