base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: sw
  text: Esau aliposikia maneno ya baba yake, akapiga kilio kikubwa sana na cha uchungu, akamwambia baba yake, “Nibariki mimi pia, baba yangu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּ/שְׁמֹעַ
  choice: aliposikia
  rationale: Muundo huu unaonyesha hali ya wakati; “aliposikia” ni Kiswahili cha kawaida kinachohifadhi mfuatano bila kuongeza wazo la kwamba ilikuwa mara ileile.
- source_word: דִּבְרֵי אָבִיו
  choice: maneno ya baba yake
  rationale: Huhifadhi maana ya moja kwa moja ya דָּבָר na ni ya asili katika Kiswahili sanifu.
- source_word: וַיִּצְעַק צְעָקָה
  choice: akapiga kilio
  rationale: Kiswahili hakitumii kwa urahisi urudiaji wa kitenzi na nomino wa Kiebrania; “akapiga kilio” huhifadhi nguvu ya tendo kwa lugha ya kawaida na yenye hadhi.
- source_word: גְּדֹלָה
  choice: kikubwa
  rationale: Ni kisawe cha moja kwa moja kinachobakiza ukubwa wa kilio bila kuifasiri kuwa sauti kubwa pekee.
- source_word: וּמָרָה
  choice: cha uchungu
  rationale: Huwasilisha uchungu mkubwa wa kihisia uliomo katika מָרָה kwa Kiswahili cha asili.
- source_word: עַד מְאֹד
  choice: sana
  rationale: Ni kiimarishi cha kawaida na chenye nguvu katika Kiswahili; pamoja na “kikubwa” kinatoa kiwango cha juu sana kinachokusudiwa.
- source_word: בָּרֲכֵנִי
  choice: Nibariki
  rationale: Huhifadhi amri ya moja kwa moja yenye kiambishi cha nafsi ya kwanza umoja.
- source_word: גַם אָנִי
  choice: mimi pia
  rationale: Huhifadhi msisitizo wa Esau kwamba yeye naye apokee baraka; “mimi” ya wazi huongeza mkazo uliopo katika Kiebrania.
- source_word: אָבִי
  choice: baba yangu
  rationale: Huhifadhi kiambishi cha umilikaji na mguso wa kihisia wa ombi hilo.
theological_decisions: []
