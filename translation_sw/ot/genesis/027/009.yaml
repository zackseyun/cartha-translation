base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: sw
  text: Nenda, tafadhali, kundini; ukachukue huko wana-mbuzi wawili wazuri kwa ajili yangu. Nami nitawaandaa kuwa vyakula vitamu[a] kwa baba yako, kama anavyopenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyakula vya ladha” au “vyakula vya kifahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Tafadhali nenda
  rationale: Kitenzi cha kuamuru לֶךְ pamoja na chembe נָא kinatoa agizo lililolainishwa au ombi la kusisitiza; “Tafadhali nenda” ni Kiswahili cha kawaida kinachobeba maana hizo.
- source_word: הַצֹּאן
  choice: kundini
  rationale: צֹאן humaanisha kundi la mifugo midogo, hasa kondoo na mbuzi. “Kundini” ni ya asili katika muktadha huu na haipunguzi maana kuwa kondoo peke yao.
- source_word: וְקַח לִי מִשָּׁם
  choice: ukanichukulie huko
  rationale: לקח ni kuchukua au kupata; umbo “ukanichukulie” linaonyesha kwamba vitu hivyo vinachukuliwa kwa ajili ya msemaji bila kuongeza kwa lazima wazo la ‘kuleta’ ambalo haliko wazi katika kitenzi chenyewe.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: wana-mbuzi wawili
  rationale: Kirai hiki kihalisi ni ‘wana wawili wa mbuzi,’ yaani mbuzi wachanga wawili. “Wana-mbuzi” ni neno sahihi na wazi katika Kiswahili Sanifu.
- source_word: טֹבִים
  choice: wazuri
  rationale: טֹבִים hapa inaeleza ubora au kufaa kwa wanyama hao. “Wazuri” huhifadhi maana pana ya neno bila kuongeza tafsiri ya ‘walionona’ au ‘bora kabisa.’
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: Nami nitawaandaa kuwa vyakula vitamu
  rationale: Kiwakilishi אֹתָם kinawarejelea wana-mbuzi, na מַטְעַמִּים ni vyakula vilivyoandaliwa kwa ladha nzuri. “Nitawaandaa kuwa vyakula vitamu” huhifadhi rejeo hilo na kusudi la mapishi kwa Kiswahili kinachoeleweka.
- source_word: לְאָבִיךָ
  choice: kwa ajili ya baba yako
  rationale: Huhifadhi uhusiano wa kifamilia na maana ya maandalizi kufanywa kwa manufaa ya baba yake.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: kama anavyopenda
  rationale: Kirai hiki kinaonyesha namna ya chakula anayopenda Isaka. “Kama anavyopenda” ni cha asili na hakiongezi kitu kinachopendwa zaidi ya muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. “Wana-mbuzi” ni sahihi kuliko usemi mrefu “mbuzi wachanga,” na “mapochopocho” limewekwa kama chaguo la chini kwa מַטְעַמִּים kwa sababu linaweza kuwa na ladha ya kimtindo au kikanda zaidi. Alama ya tanbihi imewekwa baada ya kirai kinachotafsiri מַטְעַמִּים, si baada ya wana-mbuzi.
