  text: וַ/יִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת יַעֲקֹ֔ב עַל הַ֨/בְּרָכָ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ אָבִ֑י/ו וַ/יֹּ֨אמֶר עֵשָׂ֜ו בְּ/לִבּ֗/וֹ יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔/י וְ/אַֽהַרְגָ֖ה אֶת יַעֲקֹ֥ב אָחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: sw
  text: Esau akamwekea Yakobo kinyongo kwa sababu ya baraka ambayo baba yake alikuwa amembariki nayo[a]. Esau akasema moyoni mwake[b], “Siku za maombolezo ya baba yangu zinakaribia[c]; ndipo nitakapomuua Yakobo, ndugu yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Esau akawa na uadui dhidi ya Yakobo.” Kitenzi cha Kiebrania kinaonyesha chuki au uadui unaodumu, si hisia ya muda mfupi tu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “akasema moyoni mwake.”
    reason: lexical_alternative
  - marker: c
    text: Maneno ya Kiebrania yanaweza kumaanisha siku za kumwombolezea Isaka baada ya kifo chake au siku za maombolezo ya Isaka mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: akamwekea ... kinyongo
  rationale: Kitenzi שׂטם kinaonyesha uadui au chuki inayodumu, si hisia ya muda mfupi tu. ‘Kumwekea kinyongo’ ni Kiswahili cha kawaida kinachoonyesha uhasama uliotunzwa moyoni na unaoongoza kwenye azimio la kumuua.
- source_word: עַל הַבְּרָכָה
  choice: kwa sababu ya baraka
  rationale: Kihusishi עַל hapa kinaonyesha sababu; usemi huu ni wa asili katika Kiswahili na unahifadhi uhusiano wa kisababishi.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: ambayo baba yake alikuwa amembariki nayo
  rationale: Tafsiri hii inahifadhi urudiaji wa mzizi wa ‘baraka/bariki’ katika Kiebrania na inaonyesha kuwa baba alikuwa amembariki Yakobo kwa baraka hiyo.
- source_word: בְּלִבּוֹ
  choice: moyoni mwake
  rationale: Inahifadhi nahau halisi ya Kiebrania kuhusu usemi au wazo la ndani, huku ikibaki ya kawaida na inayoeleweka katika Kiswahili.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: Siku za maombolezo ya baba yangu zinakaribia
  rationale: 'Muundo huu unahifadhi kwa kiasi kikubwa utata wa mnyororo wa maneno ya Kiebrania: unaweza kurejelea maombolezo kwa ajili ya Isaka baada ya kifo chake au, kwa uwezekano mdogo, kipindi cha huzuni cha Isaka mwenyewe.'
- source_word: וְאַהַרְגָה
  choice: ndipo nitakapomuua
  rationale: Umbo la Kiebrania linaonyesha azimio thabiti; ‘nitakapomuua’ hulihifadhi, na ‘ndipo’ huonyesha uhusiano wa wakati unaodokezwa na sentensi iliyotangulia.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: Kiwakilishi cha umilikaji kiko wazi katika Kiebrania na kinaongeza uzito wa kusikitisha wa nia ya kufanya ukatili ndani ya familia.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kumwekea kinyongo’ ni usemi unaoeleweka kwa urahisi na unaonyesha uhasama wa kudumu. Mpangilio ‘baraka ambayo ... amembariki nayo’ unahifadhi urudiaji wa Kiebrania bila kufanya sentensi iwe nzito kupita kiasi. Utata wa ‘maombolezo ya baba yangu’ umehifadhiwa katika matini na kufafanuliwa katika tanbihi.
