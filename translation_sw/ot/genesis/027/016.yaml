  text: Akaweka ngozi za wana-mbuzi juu ya mikono yake na juu ya sehemu laini ya shingo yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: ngozi
  rationale: Nomino hii ya wingi katika Kiebrania humaanisha ngozi za wanyama zilizotumiwa kama kifuniko; Kiswahili hutumia umbo lilelile ‘ngozi’ kwa umoja na wingi.
- source_word: גְּדָיֵי הָעִזִּים
  choice: za wana-mbuzi
  rationale: Kirai hiki kinamaanisha watoto wa mbuzi; ‘wana-mbuzi’ ni tafsiri fupi na ya kawaida inayotambulisha wazi wanyama hao wachanga.
- source_word: הִלְבִּישָׁה
  choice: akamvika
  rationale: Hifili ya לבש ina maana ya kumvika mtu. ‘Akamvika’ hudumisha picha ya kumfunika Yakobo kwa ngozi hizo kwa lugha ya kawaida na yenye hadhi.
- source_word: עַל יָדָיו
  choice: mikononi
  rationale: Hii ni njia ya asili ya Kiswahili ya kusema kwamba ngozi ziliwekwa juu ya mikono yake.
- source_word: חֶלְקַת צַוָּארָיו
  choice: kwenye sehemu laini ya shingo yake
  rationale: Kirai hiki hurejelea sehemu nyororo au isiyo na manyoya ya shingo; ‘sehemu laini’ huhifadhi maana halisi bila kuongeza maelezo yasiyosemwa wazi.
