review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Jacob's objection, the address to Rebekah as his mother, the attention particle הֵן, and the contrast between Esau and Jacob. However, manyoya normally denotes animal fur/feathers rather than human bodily hair, and asiye na manyoya states an absolute lack rather than the Hebrew's primary description of Jacob as 'smooth.'
  naturalness: The narrative and dialogue are otherwise natural Standard East African Swahili. Replacing manyoya with nywele za mwili and rendering חָלָק as mwenye ngozi laini gives an idiomatic, clear bodily contrast.
  terminology: Yakobo, Rebeka, Esau, mama yake, and ndugu yangu are appropriate. Nywele za mwili is the suitable human-body term; ngozi laini preserves the lexical image of חָלָק without suggesting character or manner of speech.
  issues:
  - severity: medium
    issue: The translation uses manyoya for Esau's bodily hair.
    rationale: In standard Swahili, manyoya chiefly refers to feathers or animal fur. Nywele za mwili accurately and naturally denotes the bodily hair intended by the Hebrew context.
  - severity: low
    issue: The phrase asiye na manyoya makes Jacob categorically hairless.
    rationale: The Hebrew calls Jacob 'a smooth man' (אִישׁ חָלָק). The context concerns bodily hair, but mwenye ngozi laini more closely preserves the source expression and its contrast.
  revised_text: Lakini Yakobo akamwambia Rebeka mama yake, “Tazama,[a] Esau, ndugu yangu, ni mtu mwenye nywele nyingi mwilini, nami ni mtu mwenye ngozi laini.[b]”
