base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: sw
  text: Lakini Yakobo akamwambia Rebeka mama yake, “Tazama,[a] Esau, ndugu yangu, ni mtu mwenye nywele nyingi mwilini, nami ni mtu mwenye ngozi laini.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Angalia”; neno hili linavuta usikivu na kuanzisha pingamizi la Yakobo.
    reason: lexical_alternative
  - marker: b
    text: “Ngozi laini” hapa inamaanisha kwamba Yakobo hakuwa na nywele nyingi mwilini, tofauti na Esau.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Yakobo akamwambia
  rationale: Waw ya usimulizi inaendeleza simulizi, lakini hapa kauli ya Yakobo inaleta pingamizi kwa mpango wa Rebeka; “Lakini” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אִמּוֹ
  choice: mama yake
  rationale: Neno hili linamtambulisha Rebeka kwa uhusiano wake na Yakobo; jina na uhusiano vimehifadhiwa kama katika Kiebrania.
- source_word: הֵן
  choice: Tazama
  rationale: Ni chembe ya kuvuta usikivu inayoanzisha hoja ya Yakobo. “Tazama” ni ya heshima, inaeleweka, na huhifadhi nguvu ya usemi.
- source_word: אִישׁ שָׂעִר
  choice: mtu mwenye manyoya mengi
  rationale: Kirai kinaeleza kwamba Esau alikuwa na manyoya mengi mwilini. “Mtu mwenye manyoya mengi” ni Kiswahili cha asili zaidi kuliko tafsiri ya neno kwa neno.
- source_word: וְאָנֹכִי
  choice: nami
  rationale: Kiwakilishi huru kinasisitiza tofauti kati ya Yakobo na Esau; “nami” huhifadhi kiunganishi na msisitizo huo kwa ufupi.
- source_word: אִישׁ חָלָק
  choice: mtu asiye na manyoya
  rationale: Katika muktadha huu חָלָק inatofautisha ngozi ya Yakobo na hali ya Esau ya kuwa na manyoya mengi. Ufafanuzi huu wa kawaida huepuka maana isiyokusudiwa ya tabia au usemi laini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo wa usimulizi “akamwambia” na tofauti ya “mwenye manyoya mengi ... asiye na manyoya” huwasilisha hoja kwa kawaida bila kupoteza ulinganifu wa Kiebrania.
