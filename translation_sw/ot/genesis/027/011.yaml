    reason: cultural_note
  revision_rationale: The revision corrects the body-hair terminology and retains the Hebrew description of Jacob as smooth, while the footnote supplies the contextual sense. It preserves the narrative contrast, emphasis, and modern respectful register without adding interpretive detail.
