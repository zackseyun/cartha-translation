base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: sw
  text: Akasema, “Nisogezee, nami nitakula baadhi ya mawindo ya mwanangu, ili nafsi yangu ikubariki[a].” Basi akamsogezea, naye akala; akamletea divai, naye akanywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au kwa Kiswahili cha kinahau zaidi, “ili nikubariki.” Kiebrania: “ili nafsi yangu ikubariki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה
  choice: Niletee karibu
  rationale: Kauli ya kuamuru katika shina la kusababisha ina maana ya kuleta karibu au kuwasilisha. Tafsiri hii inadumisha mwendo halisi kuelekea kwa Isaka; kitu kinacholetwa kinaeleweka kutokana na muktadha.
- source_word: וְאֹכְלָה
  choice: nami nitakula
  rationale: Cohortative ya nafsi ya kwanza inaonyesha nia ya Isaka. Muundo huu ni wa kawaida katika Kiswahili na unadumisha mfuatano wa amri kisha tendo lililokusudiwa.
- source_word: מִצֵּיד בְּנִי
  choice: baadhi ya mawindo ya mwanangu
  rationale: צַיִד ni mnyama au nyama iliyopatikana kwa kuwinda, na מִן hapa ina maana ya sehemu ya kitu. 'Baadhi ya mawindo' huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: לְמַעַן
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi; 'ili' ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: nafsi yangu ikubariki
  rationale: Kiebrania kinataja wazi 'nafsi yangu' kama kiima. Kuidumisha kunahifadhi nahau na uzito wa kauli bila kuirahisisha kimya kimya kuwa 'nikubariki.'
- source_word: וַיַּגֶּשׁ לוֹ
  choice: akamletea karibu
  rationale: Kurudiwa kwa kitenzi נגשׁ kunaitikia amri ya awali na kuhifadhi kitendo cha kuleta karibu.
- source_word: יַיִן
  choice: divai
  rationale: Hii ndiyo tafsiri sanifu ya יַיִן katika Kiswahili, bila sababu ya kuipunguza au kuifafanua kwa maneno mengine.
- source_word: וַיֵּשְׁתְּ
  choice: naye akanywa
  rationale: Ni tendo rahisi katika simulizi, linalotafsiriwa moja kwa moja.
theological_decisions:
- issue: Nahau ya Kiebrania 'nafsi yangu ikubariki'
  choice: Kuidumisha katika maandishi makuu
  alternative: ili nikubariki
  rationale: Chanzo kinatumia נַפְשִׁי kama kiima. Tafsiri kuu inadumisha umbo hilo na tanbihi inatoa Kiswahili cha kinahau zaidi, bila kulazimisha maana ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumia vitenzi vya mfululizo kwa mtiririko wa kawaida, huku nahau muhimu ya Kiebrania ikihifadhiwa na kufafanuliwa kwa tanbihi.
