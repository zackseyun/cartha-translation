base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: sw
  text: Ndipo Isaka akatetemeka kwa tetemeko kubwa sana, akasema, “Basi, ni nani yule aliyewinda mawindo na kuniletea? Nami nikala kila kitu kabla hujaja, nikambariki. Naam, naye atabarikiwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: akatetemeka
  rationale: Kitenzi hiki huonyesha kutetemeka kwa sababu ya hisia kali, hapa mshtuko na hofu; ‘akatetemeka’ huhifadhi athari ya kimwili na kihisia bila kuzidisha maana.
- source_word: חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: kwa tetemeko kubwa sana
  rationale: Nomino yenye mzizi mmoja na kitenzi inatilia tendo mkazo. Tafsiri hii huhifadhi urudiaji na nguvu ya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: מִי אֵפוֹא הוּא
  choice: Basi, ni nani yule
  rationale: אֵפוֹא ina maana ya hitimisho au msisitizo, ‘basi/ikiwa hivyo’; ‘ni nani yule’ ni ya asili katika swali la Isaka baada ya kutambua yaliyotokea.
- source_word: הַצָּד צַיִד
  choice: aliyewinda mawindo
  rationale: Huhifadhi uhusiano wa kitenzi ‘kuwinda’ na nomino ‘mawindo’; haibani maana kuwa nyama ya mnyama fulani.
- source_word: וַיָּבֵא לִי
  choice: na kuniletea
  rationale: Kiswahili kinaweza kuacha yambwa linaloeleweka kutokana na ‘mawindo’; muundo huu ni wazi na wa kawaida.
- source_word: וָאֹכַל מִכֹּל
  choice: Nami nikala baadhi ya kila kitu
  rationale: מִן ina ladha ya sehemu (‘kutoka/baadhi ya’), na כֹּל inaelekea kumaanisha kila kilicholetwa au kila sehemu ya chakula; tafsiri hii huhifadhi maana ya sehemu bila kudai kwamba alikimaliza chote.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: kabla hujaja
  rationale: Ni kifungu cha wakati cha moja kwa moja na cha kawaida katika Kiswahili.
- source_word: וָאֲבָרֲכֵהוּ
  choice: nikambariki
  rationale: Kiambishi cha nafsi ya kwanza katika kitenzi kinaonyeshwa wazi, na yambwa ‘-m-’ humrejelea mtu aliyekuja kwanza.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: Naam, naye atabarikiwa
  rationale: גַּם hapa inathibitisha kwa msisitizo kwamba baraka iliyotolewa itasimama; ‘Naam, naye’ huhifadhi uthibitisho huo na wakati/uendelevu wa יִהְיֶה.
theological_decisions:
- issue: Nguvu ya tamko la mwisho la Isaka baada ya baraka kutolewa
  choice: Tamko thabiti kwamba mtu aliyebarikiwa ataendelea kuwa amebarikiwa
  alternative: Kukubali kwa masikitiko tu kwamba yaliyotokea hayawezi kubadilishwa
  rationale: גַּם בָּרוּךְ יִהְיֶה ni uthibitisho wenye msisitizo. Tafsiri inahifadhi uzito wa baraka katika simulizi bila kueleza utaratibu wake kiteolojia au kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji ‘akatetemeka kwa tetemeko’ umehifadhiwa kwa sababu ni msisitizo halisi wa Kiebrania, si dosari ya mtindo.
