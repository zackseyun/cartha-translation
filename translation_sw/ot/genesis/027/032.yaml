  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: sw
  text: Isaka, baba yake, akamwambia[a], “Wewe ni nani?” Naye akasema, “Mimi ni mwanao, mzaliwa wako wa kwanza[b], Esau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Isaka baba yake”; limetolewa kwa mpangilio wa kawaida wa Kiswahili, “Isaka, baba yake.”'
    reason: lexical_alternative
  - marker: b
    text: Au “mwanao mkubwa”; Kiebrania ni “mzaliwa wako wa kwanza,” neno linalohifadhi mkazo wa mpangilio wa kuzaliwa ulio muhimu katika simulizi hili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: akamwambia
  rationale: Katika Kiswahili, kitenzi ‘akamwambia’ kwa kawaida na kwa usahihi huunganisha tendo la kusema na yule anayeambiwa; kinaakisi אמר pamoja na לֹו bila kulazimisha muundo mzito wa ‘akasema kwake.’
- source_word: יִצְחָק אָבִיו
  choice: Baba yake Isaka
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unadumisha uhusiano wa kifamilia pamoja na kumtambulisha msemaji; Kiebrania ni ‘Isaka baba yake.’
- source_word: מִי אַתָּה
  choice: Wewe ni nani?
  rationale: Hili ndilo swali la moja kwa moja na la kawaida katika Kiswahili, likiakisi kiulizi מִי na kiwakilishi אַתָּה.
- source_word: אֲנִי
  choice: Mimi ni
  rationale: Sentensi nomino ya Kiebrania haina kitenzi kishirikishi kilichoandikwa; Kiswahili cha kawaida hutumia ‘ni’ hapa.
- source_word: בִּנְךָ
  choice: mwanao
  rationale: בן yenye kiambishi cha nafsi ya pili umoja wa kiume humaanisha moja kwa moja ‘mwana wako’; ‘mwanao’ ni umbo la kawaida na fasaha.
- source_word: בְכֹרְךָ
  choice: mzaliwa wako wa kwanza
  rationale: בכור humaanisha mzaliwa wa kwanza na katika muktadha huu hubeba mkazo wa mpangilio wa kuzaliwa na haki inayohusiana nao. Tafsiri hii ni ya asili katika Kiswahili na haipunguzi wazo hilo kuwa tu ‘mwana mkubwa.’
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Mkazo wa בכור katika simulizi la baraka na haki ya mzaliwa wa kwanza
  choice: mzaliwa wako wa kwanza
  alternative: mwanao mkubwa
  rationale: ‘Mzaliwa wako wa kwanza’ huhifadhi wazi mpangilio wa kuzaliwa na umuhimu wake katika simulizi, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi ‘akamwambia … naye akasema’ ni wa asili na huhifadhi mfuatano wa vitenzi vya Kiebrania.
