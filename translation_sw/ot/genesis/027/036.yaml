base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: sw
  text: 'Akasema, “Je, si kwa haki anaitwa Yakobo[a]? Maana amenidanganya mara mbili hizi: alichukua haki yangu ya mzaliwa wa kwanza, na tazama, sasa amechukua baraka yangu.” Akasema, “Je, hukunibakizia baraka?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania kuna mchezo wa maneno kati ya jina “Yakobo” na kitenzi kilichotafsiriwa “amenidanganya.” Kitenzi hicho pia kinaweza kutafsiriwa “amenipokonya nafasi yangu” au “amenizidi kwa hila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: Je, si kwa haki anaitwa Yakobo?
  rationale: Swali la balagha linaonyesha uchungu wa Esau na kuanzisha mchezo wa maneno unaohusisha jina Yakobo.
- source_word: וַיַּעְקְבֵנִי
  choice: amenipokonya nafasi yangu
  rationale: Kitenzi kinadokeza kumwondoa mtu katika nafasi yake au kumshinda kwa hila. Tafsiri hii inaonyesha wazo la kuchukua nafasi au faida ya mwingine, huku tanbihi ikihifadhi uwezekano wa maana ya ‘amenidanganya.’
- source_word: זֶה פַעֲמַיִם
  choice: mara mbili hizi
  rationale: Muundo huu unahifadhi mkazo wa usemi wa Kiebrania kuliko kusema tu ‘mara mbili.’
- source_word: בְּכֹרָתִי
  choice: haki yangu ya mzaliwa wa kwanza
  rationale: Hueleza wazi hadhi na haki za kifamilia zilizomhusu mwana wa kwanza.
- source_word: וְהִנֵּה עַתָּה
  choice: na tazama, sasa
  rationale: ‘Tazama’ huhifadhi mshangao na mkazo wa kihisia wa Esau kwa lugha ya kibiblia inayoeleweka.
- source_word: בִּרְכָתִי
  choice: baraka yangu
  rationale: Ni tafsiri ya moja kwa moja ya baraka maalumu ya baba ambayo Esau anadai kuwa yake.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: Je, hukunibakizia baraka?
  rationale: ‘Kunibakizia’ ni Kiswahili cha kawaida kinachoeleza ombi la Esau kwamba huenda Isaka ameacha au amehifadhi baraka fulani kwa ajili yake.
