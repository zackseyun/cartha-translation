    rationale: The Hebrew verb is a pun on Jacob’s name and can mean deceive, overreach, or supplant. Although the context concerns displaced privilege, “nafasi yangu” interprets and narrows the verbal accusation. “Amenidanganya” gives a natural primary rendering, with the footnote preserving ‘supplanted/overreached’ possibilities.
