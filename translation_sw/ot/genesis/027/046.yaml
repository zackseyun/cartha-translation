review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Rebekah’s weariness, the causal force of the women of Heth, Jacob’s prospective marriage, and the repeated ‘daughters’ phrasing. However, ‘yatakuwa’ introduces a future verbal nuance absent from the Hebrew nominal rhetorical question. ‘Nchi hii’ likewise adds the demonstrative ‘this,’ which is not expressed in the source.
  naturalness: ‘Nimekinai maisha yangu’ and ‘ataoa mke’ are natural Standard East African Swahili. ‘Maisha ni nini kwangu?’ is both more source-near and idiomatic as a compressed rhetorical question.
  terminology: Rebeka, Isaka, Yakobo, and Hethi are suitable transliterated forms. Retaining ‘binti za Hethi’ appropriately reflects the Hebrew expression, while the footnote gives the familiar ethnic equivalent ‘Wahiti.’
  issues:
  - severity: medium
    issue: Added future sense in the closing question
    rationale: ‘Maisha yatakuwa nini kwangu?’ means ‘What will life be to me?’ The Hebrew לָמָּה לִּי חַיִּים is a verbless rhetorical question, without an explicit future form. ‘Maisha ni nini kwangu?’ better preserves this.
  - severity: low
    issue: Added demonstrative in ‘nchi hii’
    rationale: הָאָרֶץ means ‘the land’; it has no demonstrative corresponding to ‘hii.’ ‘Nchi’ is sufficient in Swahili and avoids adding specification.
