  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: sw
  text: Kisha Rebeka akamwambia Isaka, “Nimekinai maisha yangu kwa sababu ya binti za Hethi[a]. Ikiwa Yakobo ataoa mke miongoni mwa binti za Hethi kama hawa, miongoni mwa binti za nchi, maisha ni nini kwangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanawake Wahiti” au “binti za Wahiti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: Nimekinai maisha yangu
  rationale: Kitenzi קוץ katika msemo huu huonyesha kuchoshwa na kuhuzunishwa sana, hata kufikia hali ya kukirihishwa. ‘Nimekinai maisha yangu’ ni Kiswahili cha kawaida chenye uzito unaolingana na muktadha bila kuongeza wazo la moja kwa moja la kutaka kufa.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Hapa kihusishi kinaonyesha sababu, si mahali; ‘kwa sababu ya’ kinaeleza uhusiano huo wazi na kwa kawaida.
- source_word: בְּנוֹת חֵת
  choice: binti za Hethi
  rationale: Tafsiri hii inahifadhi muundo halisi wa ukoo wa Kiebrania na kulitaja jina חֵת kwa unukuzi. Maana ya kikabila, ‘wanawake Wahiti,’ imewekwa katika tanbihi.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: Ikiwa Yakobo ataoa mke
  rationale: Ingawa Kiebrania kinasema kihalisi ‘atamchukua mke,’ ‘ataoa mke’ ni usemi wa sasa na wa kawaida wa Kiswahili unaoeleza ndoa bila kupoteza maana.
- source_word: כָּאֵלֶּה
  choice: kama hawa
  rationale: Kiwakilishi hiki kinaelekeza kwa wanawake wa aina ileile na wale wanaozungumziwa tayari, yaelekea wake za Esau; ‘kama hawa’ kinahifadhi uelekezaji huo.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: miongoni mwa binti za nchi hii
  rationale: ‘Binti za nchi hii’ inadumisha sambamba ya Kiebrania na ‘binti za Hethi,’ huku ‘nchi hii’ ikieleza kwa Kiswahili cha kawaida nchi inayozungumziwa katika muktadha.
- source_word: לָמָּה לִּי חַיִּים
  choice: maisha yatakuwa nini kwangu?
  rationale: Kauli hii inadumisha swali la balagha na hali yake ya kutokuwa wazi kabisa, badala ya kulipanua kuwa ‘maisha yatakuwa na faida gani?’ au kulifanya kauli ya moja kwa moja ya kutotaka kuishi.
theological_decisions:
- issue: Utambulisho wa kikabila wa חֵת
  choice: Kubakiza ‘binti za Hethi’ katika matini kuu
  alternative: ‘wanawake Wahiti’ au ‘binti za Wahiti’
  rationale: Muundo halisi unahifadhi jina la ukoo na namna simulizi la Mwanzo linavyowasilisha mahusiano ya kifamilia na kikabila. Tanbihi inatoa maana ya kikabila iliyo wazi zaidi bila kuifanya kuwa tafsiri pekee.
- issue: Nguvu ya swali לָמָּה לִּי חַיִּים
  choice: ‘maisha yatakuwa nini kwangu?’
  alternative: ‘maisha yatakuwa na faida gani kwangu?’ au ‘kwa nini niendelee kuishi?’
  rationale: Chaguo kuu linahifadhi mvutano na ufupi wa swali la Kiebrania. Njia mbadala ya kwanza hufafanua wazo la thamani, na ya pili hulifanya kuwa kauli kali zaidi kuliko maneno yenyewe yanavyolazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Majina yamenukuliwa kama Rebeka, Isaka, Yakobo na Hethi; urudiaji wa ‘binti’ umehifadhiwa kwa sababu unaakisi sambamba muhimu ya matini ya Kiebrania.
