  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: sw
  text: Basi akaenda, akawachukua, akawaleta kwa mama yake; naye mama yake akaandaa chakula kitamu[a], kama baba yake alivyopenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “vyakula vya ladha” au “vyakula vitamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Basi akaenda
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; “Basi” ni kiunganishi cha kawaida cha simulizi katika Kiswahili.
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: Kitenzi ni “akachukua”; kiambishi cha ngeli ya wanyama kinaonyesha wana-mbuzi wawili waliotajwa katika mstari uliotangulia.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: na kuwaleta kwa mama yake
  rationale: Yambwa inaeleweka kutokana na muktadha, na “kuwaleta kwa” huwasilisha maana ya בוא pamoja na ל kwa Kiswahili cha kawaida.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: naye mama yake akaandaa
  rationale: Ingawa עשה kwa upana ni “kufanya,” inapohusu chakula, “kuandaa” ni sahihi na ya kawaida zaidi.
- source_word: מַטְעַמִּים
  choice: chakula kitamu
  rationale: Neno hilo linamaanisha chakula kilichoandaliwa kwa ladha maalumu; “chakula kitamu” ni wazi na cha kisasa, huku “vyakula vya anasa” kikiweza kudokeza anasa isiyolazimishwa na muktadha.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: kama baba yake alivyopenda
  rationale: “Kama ... alivyopenda” huhifadhi ulinganisho wa כַּאֲשֶׁר na maana ya moja kwa moja ya אָהֵב bila kuongeza maelezo.
