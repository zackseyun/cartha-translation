base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: sw
  text: Isaka akamjibu Esau, “Tazama, nimemweka kuwa bwana wako, na nimewafanya ndugu zake wote kuwa watumishi wake[a]. Nimemkimu kwa nafaka na divai mpya[b]. Na wewe basi, nikufanyie nini, mwanangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumwa wake.” Neno la Kiebrania linaweza kumaanisha watumishi au watumwa kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “Nimemsaidia kwa nafaka na divai mpya.” Kitenzi cha Kiebrania kinaweza kukazia kutegemeza au kuandalia mahitaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Katika masimulizi ya mazungumzo, kitenzi hiki huonyesha jibu; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: הֵן
  choice: Tazama
  rationale: Huhifadhi msisitizo wa kiingizi cha Kiebrania kwa lugha yenye hadhi bila kutumia mtindo wa kizamani usioeleweka.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: nimemweka kuwa bwana wako
  rationale: Huhifadhi wazo la kumweka katika cheo cha mamlaka juu ya Esau; “bwana” hapa ni mkuu mwenye mamlaka, si jina la Mungu.
- source_word: כָּל אֶחָיו
  choice: ndugu zake wote
  rationale: “Ndugu” huweza kueleza ndugu wa kiume au jamaa wa karibu kulingana na muktadha, na hapa inafaa kwa lugha ya familia.
- source_word: לַעֲבָדִים
  choice: wawe watumishi
  rationale: עבד inaweza kumaanisha watumishi au watumwa; “watumishi” huonyesha utiisho bila kuamua zaidi ya muktadha, huku mbadala ukitajwa katika tanbihi.
- source_word: דָגָן
  choice: nafaka
  rationale: Ni neno la kawaida la Kiswahili kwa mazao ya jamii ya nafaka kwa ujumla.
- source_word: תִּירֹשׁ
  choice: divai mpya
  rationale: Huhifadhi maana ya mazao mapya ya mzabibu au divai changa badala ya divai kwa ujumla.
- source_word: סְמַכְתִּיו
  choice: nimemruzuku
  rationale: Katika muktadha wa nafaka na divai, kitenzi cha kutegemeza au kuimarisha kina maana ya kumpatia mahitaji; “nimemruzuku” ni cha asili na huhifadhi wazo la kumtegemeza.
- source_word: וּלְכָה אֵפוֹא מָה אֶעֱשֶׂה
  choice: Basi, nikufanyie nini
  rationale: Hutoa geuko la kimantiki na swali la balagha kwa Kiswahili cha kawaida, bila kulazimisha maana ya kutoweza ambayo haijaonyeshwa moja kwa moja na kitenzi.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Huhifadhi mwito wa moja kwa moja wa kifamilia na hisia zake.
