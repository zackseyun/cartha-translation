  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: sw
  text: Huenda baba yangu atanipapasa[a], nami nitaonekana kwake kama mdanganyifu[b]; nami nitajiletea laana, wala si baraka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atanigusa.” Kitenzi cha Kiebrania humaanisha kugusa kwa mkono ili kutambua, kama Isaka alivyotaka kuthibitisha utambulisho wa Yakobo kwa kumgusa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama mtu anayemdhihaki mwingine” au “kama tapeli.” Neno la Kiebrania linaweza kumaanisha mtu anayemdanganya mwingine au kumfanya mwingine aonekane mpumbavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Huenda
  rationale: Huonyesha uwezekano unaomtia Yakobo hofu na kuhifadhi kutokuwa na uhakika kwa maandishi ya Kiebrania.
- source_word: יְמֻשֵּׁנִי
  choice: atanipapasa
  rationale: Kitenzi משש humaanisha kugusa kwa mikono ili kutambua; 'atanipapasa' kinafaa katika muktadha wa Isaka kuchunguza utambulisho wa Yakobo kwa kumgusa.
- source_word: אָבִי
  choice: baba yangu
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya umilikaji.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: nami nitaonekana kwake
  rationale: Huwasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania 'machoni pake,' yaani, kwa mtazamo au makadirio yake.
- source_word: כִּמְתַעְתֵּעַ
  choice: kama mdanganyifu
  rationale: Katika muktadha huu neno humaanisha mtu anayepotosha au kumhadaa mwingine; 'mdanganyifu' huhifadhi maana kuu bila kuondoa kabisa uwezekano wa dhihaka au ujanja.
- source_word: וְהֵבֵאתִי עָלַי
  choice: hivyo nitajiletea
  rationale: Muundo wa kisababishi pamoja na עָלַי una maana ya kujiletea jambo; 'hivyo' huonyesha matokeo yanayohofiwa kwa ufasaha wa Kiswahili.
- source_word: קְלָלָה
  choice: laana
  rationale: Neno la kawaida la Kiswahili linalowakilisha kinyume cha baraka katika muktadha huu.
- source_word: וְלֹא בְרָכָה
  choice: badala ya baraka
  rationale: Hutoa kwa Kiswahili cha asili tofauti ya moja kwa moja kati ya laana na baraka.
