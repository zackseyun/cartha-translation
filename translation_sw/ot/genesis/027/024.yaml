  text: Akasema[a], “Je, wewe kweli ni mwanangu Esau?” Naye akasema, “Ni mimi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa tafsiri ya neno kwa neno, “Je, wewe ndiye huyu, mwanangu Esau?” Mpangilio huu unasisitiza swali la utambulisho.
