lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Kitenzi אמר katika masimulizi kimetafsiriwa kwa njia ya kawaida; kiunganishi cha mwanzo hakihitaji kuonyeshwa kila mara katika Kiswahili.
- source_word: אַתָּה זֶה
  choice: Je, wewe kweli ni
  rationale: Muunganiko wa kiwakilishi huru na kiashiria unasisitiza swali la utambulisho; “wewe kweli ni” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Huhifadhi wazi nomino pamoja na kiambishi cha umilikaji cha nafsi ya kwanza umoja.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Kurudiwa kwa אמר kumehifadhiwa, huku “Naye” ikiendeleza mazungumzo na kuonyesha mabadiliko ya msemaji kwa uwazi.
- source_word: אָנִי
  choice: Ni mimi
  rationale: Kiwakilishi huru hapa ni jibu fupi la kujitambulisha; “Ni mimi” ni jibu la asili katika Kiswahili.
