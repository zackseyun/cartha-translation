review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Isaac's request to approach, his tactile examination, the filial address, and his uncertainty about whether the person is Esau. However, its sequence, “ili nikupapase ... nijue kama,” presents knowing as a second, separately coordinated purpose after touching. In the Hebrew, the identity question directly qualifies the requested tactile examination. A slight recasting better preserves that relationship.
  naturalness: The wording is generally clear and idiomatic Standard East African Swahili. “Kupapasa” is particularly apt in this context. Recasting the final purpose as “ili nijue kama” yields a more natural and coherent sentence.
  terminology: “Isaka,” “Yakobo,” and “Esau” are appropriate established biblical forms. “Mwanangu” preserves both occurrences of בְּנִי, and “au la” appropriately renders the alternative in the indirect question.
  issues:
  - severity: low
    issue: The purpose and identity-test clauses are awkwardly sequenced.
    rationale: “Ili nikupapase ... nijue kama” can imply two successive purposes, whereas the Hebrew has Isaac ask to feel Jacob in order to determine whether he is Esau. Moving “ili nijue kama” to govern the identity test makes this relation explicit without adding substantive meaning.
  revised_text: Kisha Isaka akamwambia Yakobo[a], “Tafadhali, njoo karibu nikupapase, mwanangu, ili nijue kama kweli wewe ni mwanangu Esau au la.”
