base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: sw
  text: Kisha Isaka akamwambia Yakobo[a], “Tafadhali, njoo karibu nikupapase, mwanangu, ili nijue kama kweli wewe ni mwanangu Esau au la.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tafadhali, njoo karibu, nami nikupapase, mwanangu, ili nijue kama kweli wewe ni mwanangu Esau au la.”
    reason: Mfuatano wa Kiebrania unaweza kuwakilishwa kwa Kiswahili kama kusudi (“njoo karibu nikupapase”) au kwa uratibu (“njoo karibu, nami nikupapase”); maana ya msingi haibadiliki.
lexical_decisions:
- source_word: גְּשָׁה נָּא
  choice: Tafadhali, njoo karibu
  rationale: Kitenzi cha amri גְּשָׁה humaanisha kukaribia, na נָּא huonyesha ombi la upole; Kiswahili hiki ni cha kawaida na chenye heshima.
- source_word: וַאֲמֻשְׁךָ
  choice: ili nikupapase
  rationale: Mzizi מושׁ hapa una maana ya kugusa kwa kupapasa ili kutambua. “Nikupapase” inaonyesha uchunguzi wa Isaka kwa kugusa, si mguso wa kawaida tu.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinaonyesha “mwanangu”; neno hili limehifadhiwa kama mwito wa moja kwa moja wenye kuonyesha uhusiano.
- source_word: הַאַתָּה זֶה
  choice: nijue kama kweli wewe ni
  rationale: Muundo wa swali unaonyesha kuwa Isaka anataka kuthibitisha utambulisho wa Yakobo. “Kama kweli wewe ni” huhifadhi hali ya mashaka kwa Kiswahili cha asili.
- source_word: בְּנִי עֵשָׂו
  choice: mwanangu Esau
  rationale: Muunganiko huu unamtaja Esau kuwa mwana anayehusika katika swali; “mwanangu Esau” ni mpangilio wa kawaida wa Kiswahili.
- source_word: אִם לֹא
  choice: au la
  rationale: Maneno haya yanakamilisha swali lenye njia mbili, “kama ... au la,” kwa Kiswahili sanifu.
- source_word: וַיֹּאמֶר
  choice: Kisha Isaka akamwambia
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; “Kisha ... akamwambia” ni simulizi la asili katika Kiswahili na huhifadhi mlengwa Yakobo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kupapasa” limetumiwa kwa sababu Isaka anachunguza utambulisho kwa kugusa; “au la” huhifadhi swali lisilotatuliwa.
