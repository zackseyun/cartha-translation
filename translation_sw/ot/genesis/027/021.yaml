  revision_rationale: 'Revision places the inferred purpose of identification immediately with the indirect question: Isaac asks to feel Jacob so that he may know whether he is truly Esau. This is natural Swahili and reflects the syntactic and contextual force of the Hebrew without overstating the tactile action or changing the uncertainty.'
