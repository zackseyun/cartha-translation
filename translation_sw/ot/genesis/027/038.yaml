  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: sw
  text: Esau akamwambia baba yake, “Je, una baraka moja tu[a], baba yangu? Nibariki mimi pia, baba yangu!” Kisha Esau akapaza sauti yake na kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “Je, baraka ni moja kwako, baba yangu?” Kiebrania kinaonyesha uchungu wa Esau kwa sababu inaonekana Isaka ana baraka moja tu ya kutoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: Je, una baraka moja tu
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa, na kwa neno moja moja ni kama, ‘Je, baraka ni moja kwako?’ Katika muktadha ni swali la mshangao na uchungu kuhusu kuwa na baraka moja tu ya kutoa. Kiswahili hiki ni cha kawaida na kinadumisha nguvu ya swali.
- source_word: אָבִי
  choice: baba yangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinaonyesha umilikaji wazi. Kurudia ‘baba yangu’ mara zote mbili kunahifadhi ombi la Esau lenye hisia na marudio ya Kiebrania.
- source_word: בָּרֲכֵנִי
  choice: Nibariki
  rationale: Ni amri ya moja kwa moja ya kitenzi ‘bariki’ yenye kiambishi cha nafsi ya kwanza umoja; ‘Nibariki’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: גַּם אָֽנִי
  choice: mimi pia
  rationale: Maneno haya yanasisitiza kwamba Esau naye anataka kujumuishwa miongoni mwa wanaopokea baraka. ‘Mimi pia’ huhifadhi msisitizo na hisia kwa Kiswahili cha kawaida.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: akapaza sauti yake
  rationale: Nahau hiyo kwa neno moja moja ni ‘aliinua sauti yake.’ ‘Akapaza sauti yake’ ni nahau ya sasa ya Kiswahili inayoonyesha kilio cha kusikika kwa nguvu.
- source_word: וַיֵּבְךְּ
  choice: kulia
  rationale: Kitenzi kinaonyesha kutoa machozi au kuomboleza. ‘Kulia’ ni neno la kawaida na sahihi katika Kiswahili cha kisasa.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
