base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: sw
  text: Yakobo akamwambia baba yake, “Mimi ni Esau, mzaliwa wako wa kwanza. Nimefanya kama ulivyoniambia. Tafadhali inuka, keti, ule mawindo yangu, ili unibariki[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu na Kiebrania, “ili nafsi yako inibariki.” Hapa “nafsi yako” ni njia ya kinahau ya kumaanisha “wewe mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל אָבִיו
  choice: Yakobo akamwambia baba yake
  rationale: Muundo wa masimulizi wenye waw-consecutive umeonyeshwa kwa ‘aka-’, ambao unaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: Mimi ni Esau, mzaliwa wako wa kwanza
  rationale: ‘Mimi’ linadumisha msisitizo wa אָנֹכִי, na ‘mzaliwa wako wa kwanza’ linaonyesha kwa usahihi dai la Yakobo kwamba yeye ndiye Esau, mzaliwa wa kwanza wa Isaka.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: Nimefanya kama ulivyoniambia
  rationale: Hii ni tafsiri ya kawaida na ya sasa ya Kiswahili inayohifadhi maana ya kutekeleza agizo la awali.
- source_word: קוּם נָא שְׁבָה
  choice: Tafadhali inuka, keti
  rationale: ‘Tafadhali’ linaonyesha nguvu ya ombi katika נָא; vitenzi viwili tofauti vya kuamuru vimehifadhiwa bila kulainisha mfuatano wake usio wa kawaida.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: ule nyama yangu ya mawindo
  rationale: צַיִד katika muktadha huu ni chakula cha nyama kilichopatikana kwa kuwinda. ‘Nyama yangu ya mawindo’ ni wazi kwa msomaji wa kawaida na hudumisha dai la msemaji kuwa ni mawindo yake.
- source_word: בַּעֲבוּר
  choice: ili
  rationale: Kiunganishi ‘ili’ kinaonyesha kusudi la tendo linaloombwa kwa ufupi na kwa kawaida.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: ili unibariki
  rationale: נֶפֶשׁ hapa ni nahau inayomrejelea mtu mwenyewe, si tamko maalumu kuhusu sehemu isiyo ya mwili. Kiswahili ‘unibariki’ kinawasilisha maana ya nahau hiyo; tafsiri ya karibu zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya נַפְשֶׁךָ katika תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: ili unibariki
  alternative: ili nafsi yako inibariki
  rationale: Katika matumizi haya, נֶפֶשׁ humaanisha mtu mwenyewe kwa njia ya kinahau. Kutafsiri ‘nafsi yako’ katika matini kuu kungeweza kudokeza dai la kianthropolojia ambalo mstari haulazimishi. Tanbihi inadumisha umbo la karibu na Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano ‘inuka, keti’ umehifadhiwa kwa sababu upo wazi katika Kiebrania, ingawa unasikika usio wa kawaida kidogo. Usemi wa kinahau kuhusu ‘nafsi’ umetafsiriwa kwa maana katika matini kuu na kufafanuliwa katika tanbihi.
