translation:
  language: sw
  text: Basi akamwendea baba yake, akasema, “Baba yangu.” Naye akasema, “Mimi hapa. Wewe ni nani, mwanangu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Basi akaingia
  rationale: Kitenzi בוא katika muktadha huu kinaendeleza simulizi na kinaonyesha Yakobo akiingia mahali alikokuwa baba yake; “akaingia” ni ya asili katika Kiswahili kuliko tafsiri ya jumla “akaja.” “Basi” linaonyesha mwendelezo wa tukio.
- source_word: אֶל אָבִיו
  choice: kwa baba yake
  rationale: Kirai kinaeleza kuelekea kwa baba yake. Kiswahili cha kawaida husema “akaingia kwa baba yake”; jina Isaka halijaongezwa kwa kuwa halipo katika Kiebrania.
- source_word: וַיֹּאמֶר
  choice: akasema / akajibu
  rationale: Katika kauli ya kwanza, “akasema” hufuata simulizi moja kwa moja. Katika kauli ya pili, “akajibu” ni Kiswahili cha asili kinachoonyesha mwitikio wa baba bila kubadili maana ya kitenzi cha kusema.
- source_word: אָבִי
  choice: Baba yangu
  rationale: Nomino ina kiambishi cha nafsi ya kwanza umoja na imetumiwa kama mwito; “Baba yangu” huhifadhi umbo na uhusiano wa Kiebrania.
- source_word: הִנֶּנִּי
  choice: Mimi hapa
  rationale: Hili ni jibu la kawaida la kuonyesha kuwapo na utayari. “Mimi hapa” ni usemi wa sasa na wa kawaida katika Kiswahili, unaohifadhi nguvu ya fomula ya Kiebrania.
- source_word: מִי אַתָּה
  choice: Wewe ni nani
  rationale: Swali linauliza moja kwa moja utambulisho wa anayesemeshwa; “Wewe ni nani?” linaakisi wazi muundo wa Kiebrania.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Nomino ina kiambishi cha nafsi ya kwanza umoja na ni mwito; “mwanangu” huhifadhi ukaribu na umilikaji uliomo katika Kiebrania.
