base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: sw
  text: “Niletee nyama ya mawindo, uniandalie chakula kitamu[a], ili nile na nikubariki mbele ya Yahweh[b] kabla sijafa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “chakula cha ladha.” Neno la Kiebrania humaanisha chakula kitamu, kilichoandaliwa kwa namna ya pekee.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina jina la Mungu יהוה (YHWH), lililotafsiriwa hapa “Yahweh.” Tafsiri za jadi mara nyingi hutumia “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָבִיאָה לִּי
  choice: Niletee
  rationale: Kitenzi hiki ni amri ya kumletea msemaji kitu; “niletee” ni tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: צַיִד
  choice: nyama ya mawindo
  rationale: Neno hili humaanisha mnyama aliyewindwa au kile kilichopatikana kwa kuwinda. “Nyama ya mawindo” inaonyesha kwa uwazi kwamba kinachokusudiwa hapa ni chakula kilichotokana na uwindaji, bila kukifinya kuwa nyama ya aina moja tu.
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: uniandalie chakula kitamu
  rationale: Ingawa עשה kwa msingi ni “fanya/tengeneza,” katika muktadha wa chakula “andaa” ni Kiswahili cha kawaida. מַטְעַמִּים hurejelea vyakula vitamu au vilivyoandaliwa kwa namna ya pekee.
- source_word: וְאֹכֵלָה וַאֲבָרֶכְכָה
  choice: ili nile na nikubariki
  rationale: Maumbo haya mawili ya kohotativi yanaonyesha kusudi au tendo linalokusudiwa; “ili nile na nikubariki” huhifadhi uhusiano huo kwa Kiswahili cha asili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי ni “mbele ya/katika uwepo wa,” na “mbele za” ni usemi wa Kiswahili unaofaa katika muktadha huu. Jina la Mungu יהוה limetoholewa kuwa “Yahwe.”
- source_word: לִפְנֵי מוֹתִי
  choice: kabla sijafa
  rationale: Ingawa muundo wa Kiebrania ni wa jina, maana yake hutolewa kwa Kiswahili cha kawaida na cha moja kwa moja kama “kabla sijafa.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku namna ya jadi “BWANA” ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Kauli za amri na kusudi zimetafsiriwa kwa mtiririko wa kawaida wa mazungumzo, huku jina la Mungu na maana ya chakula kilichoandaliwa kwa namna ya pekee zikihifadhiwa wazi.
