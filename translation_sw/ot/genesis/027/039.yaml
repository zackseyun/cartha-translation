  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: sw
  text: Ndipo baba yake Isaka akamjibu, “Tazama, makao yako yatakuwa mbali na rutuba ya ardhi, na mbali na umande utokao mbinguni.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Makao yako yatakuwa mahali penye rutuba ya ardhi na umande utokao mbinguni.” Kihusishi cha Kiebrania kinaweza kueleweka ama kwa maana chanya, “kutoka/cha,” ama kwa maana ya kutengwa, “mbali na.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Katika masimulizi, kitenzi hiki hutanguliza jibu la msemaji; ‘akamjibu’ ni Kiswahili cha kawaida na huhifadhi muundo wa mazungumzo.
- source_word: אָבִיו
  choice: baba yake
  rationale: 'Huhifadhi uhusiano uliosisitizwa katika Kiebrania, huku jina Isaka likiwekwa kwa mtindo wa kawaida wa Kiswahili: ‘Isaka, baba yake.’'
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni alama ya hotuba inayovuta makini kwa tamko zito; ‘Tazama’ ni rasmi kwa kiasi lakini inaeleweka.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: mbali na ardhi yenye rutuba
  rationale: שְׁמַנִּים humaanisha kwa picha unono au utajiri wa ardhi, yaani rutuba; מִן imetafsiriwa hapa kwa maana ya kutengwa au kunyimwa.
- source_word: מוֹשָׁבֶךָ
  choice: makao yako
  rationale: Neno hili hurejelea mahali pa kukaa au kuishi; ‘makao yako’ ni la asili, lenye hadhi, na huhifadhi maana ya mahali.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: na mbali na umande wa mbinguni
  rationale: Kama katika kishazi cha kwanza, מִן imechukuliwa kwa maana ya kutengwa, na hivyo kuonyesha kunyimwa umande.
- source_word: מֵעָל
  choice: juu
  rationale: 'Huhifadhi taswira ya anga ya Kiebrania kwa usemi mfupi na wa kawaida: ‘mbinguni juu.’'
theological_decisions:
- issue: Maana ya kihusishi מִן katika maneno ya Isaka kwa Esau
  choice: 'maana ya kutengwa: ‘mbali na’ ardhi yenye rutuba na umande wa mbinguni'
  alternative: 'maana ya chanzo au ushiriki: ‘kutokana na/katika’ rutuba ya ardhi na umande wa mbinguni'
  rationale: Muktadha wa baraka iliyopungua ya Esau na utofauti wake na baraka ya Yakobo katika mstari wa 28 unaunga mkono maana ya kutengwa. Hata hivyo, Kiebrania kinaruhusu pia usomaji chanya, kwa hiyo umehifadhiwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ hudumisha uzito wa tamko; ‘ardhi yenye rutuba’ huwasilisha kwa uwazi sitiari ya Kiebrania ya ‘unono wa ardhi.’ Alama ya tanbihi imewekwa mara moja katika maandishi baada ya tamko linalohusika.
