  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: sw
  text: Ikawa, Isaka alipokwisha kumbariki Yakobo, Yakobo akiwa ametoka tu[a] mbele ya Isaka baba yake, Esau ndugu yake akaja kutoka uwindani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kutoka alikuwa ametoka.” Kiebrania hurudia kitenzi ili kusisitiza kwamba Yakobo alikuwa ametoka muda mfupi sana tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kazi ya fomula ya kisimulizi inayoendeleza mfululizo wa matukio bila kutumia lugha nzito au ya kizamani.
- source_word: כַּאֲשֶׁר
  choice: mara tu
  rationale: Katika muktadha huu inaonyesha ukaribu wa haraka kati ya kumalizika kwa baraka na matukio yaliyofuata.
- source_word: כִּלָּה ... לְבָרֵךְ
  choice: alipomaliza kumbariki
  rationale: Muundo huu wa Kiswahili unaonyesha kukamilika kwa tendo la kubariki kwa njia ya kawaida na sahihi.
- source_word: אַךְ יָצֹא יָצָא
  choice: alikuwa ametoka tu
  rationale: Neno אַךְ pamoja na kitenzi-jina halisi na kitenzi kilichonyambuliwa husisitiza kwamba Yakobo alikuwa ameondoka muda mfupi sana kabla ya Esau kufika.
- source_word: מֵאֵת פְּנֵי
  choice: mbele ya
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la kuondoka mahali alipokuwapo Isaka, bila kulazimisha tafsiri pana kuliko Kiebrania.
- source_word: בָּא מִצֵּידוֹ
  choice: akarudi kutoka mawindoni
  rationale: בָּא inaonyesha kuja kwa Esau, na ציד hapa inaweza kuashiria shughuli ya kuwinda; 'akarudi kutoka mawindoni' ni ya asili katika muktadha wa kurudi kwake kwa baba yake.
