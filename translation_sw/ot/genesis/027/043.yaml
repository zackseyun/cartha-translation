  text: Sasa, mwanangu, nisikilize; inuka, ukimbilie kwa Labani, ndugu yangu, huko Harani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kiunganishi pamoja na kielezi huanzisha agizo la haraka kutokana na yaliyotangulia; “Basi sasa” ni ya asili katika Kiswahili na huhifadhi uhusiano huo wa kimazungumzo.
- source_word: בְנִי
  choice: mwanangu
  rationale: Huhifadhi namna ya moja kwa moja na yenye ukaribu ya mama kumwita mwanawe wa kiume.
- source_word: שְׁמַע בְּקֹלִי
  choice: nisikilize
  rationale: Nahau ya Kiebrania ni kihalisi “isikilize sauti yangu” na inaweza kudokeza kutii; “nisikilize” ni Kiswahili cha kawaida kinachohifadhi wito wa kusikia bila kufanya maana ya kutii iwe wazi kupita kiasi.
- source_word: וְקוּם
  choice: ondoka
  rationale: Kitenzi קום katika mfululizo huu wa maagizo humtaka Yakobo aanze kuchukua hatua; “ondoka” ni cha asili katika muktadha huu na huandaa agizo linalofuata.
- source_word: בְּרַח לְךָ
  choice: ukimbilie
  rationale: ברח humaanisha kukimbia ili kuepuka hatari. Muundo wenye לְךָ hauhitaji kutafsiriwa kwa neno tofauti katika Kiswahili; “ukimbilie” huonyesha kwa kawaida kukimbia kuelekea mahali pa usalama.
- source_word: אֶל לָבָן אָחִי
  choice: kwa Labani ndugu yangu
  rationale: “Kwa” huonyesha kwenda kwa mtu, huku mpangilio “Labani ndugu yangu” ukihifadhi uhusiano wa kiambatisho kwa Kiswahili cha asili.
- source_word: חָרָנָה
  choice: huko Harani
  rationale: He ya uelekeo inaonyesha mwendo kuelekea Harani. Kwa kuwa mwendo tayari umeonyeshwa na “ukimbilie kwa,” “huko Harani” hutaja mahali aliko Labani bila kurudia uelekeo kwa namna nzito.
