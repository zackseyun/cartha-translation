lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Kisha akaweka
  rationale: Kiunganishi cha masimulizi וַ kinaendeleza tukio kwa “Kisha,” na נתן pamoja na בְּיַד hapa huonyesha kuweka au kukabidhi kitu mkononi mwa mtu.
- source_word: הַמַּטְעַמִּים
  choice: vyakula vitamu
  rationale: Neno hili la wingi linamaanisha vyakula vilivyoandaliwa kwa ladha maalumu; “vyakula vitamu” ni Kiswahili cha sasa na hakiongezi aina ya chakula ambayo Kiebrania hakuitaji hapa.
- source_word: הַלֶּחֶם
  choice: mkate
  rationale: Hii ndiyo maana ya moja kwa moja ya לֶחֶם katika muktadha huu.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: ambavyo alikuwa ametayarisha
  rationale: Wakati timilifu “alikuwa ametayarisha” unaonyesha kuwa maandalizi yalitangulia kukabidhiwa; “ambavyo” inarejelea kwa pamoja vyakula na mkate.
- source_word: בְּיַד
  choice: mkononi mwa
  rationale: Hifadhi taswira halisi ya Kiebrania ya kuweka kitu katika mkono wa mtu, badala ya kuifanya tu “akampa.” Umoja wa יַד umehifadhiwa kwa “mkononi.”
- source_word: יַעֲקֹב בְּנָהּ
  choice: Yakobo mwanawe
  rationale: Mpangilio huu unafuata mfuatano wa Kiebrania na unasikika kwa kawaida katika Kiswahili.
