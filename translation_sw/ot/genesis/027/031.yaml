base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: sw
  text: Yeye pia akatayarisha chakula kitamu[a], akamletea baba yake. Kisha akamwambia baba yake, “Baba yangu na ainuke, ale mawindo ya mwanawe, ili nafsi yako ibariki[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyakula vya ladha.” Neno la Kiebrania linamaanisha vyakula vilivyotayarishwa kwa ustadi na vyenye ladha nzuri katika simulizi hili.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema, “nafsi yako ibariki.” Huu ni msemo unaoweza kumaanisha, “unibariki,” lakini maandishi makuu yanahifadhi usemi wa Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטְעַמִּים
  choice: chakula kitamu
  rationale: Neno hili linamaanisha chakula kilichotayarishwa kwa ustadi na chenye ladha nzuri katika simulizi hili. Umoja wa kimaana ‘chakula’ ni wa kawaida katika Kiswahili ingawa neno la Kiebrania lina umbo la wingi.
- source_word: גַּם הוּא
  choice: Yeye pia
  rationale: Huhifadhi msisitizo wa nyongeza na ulinganifu na kitendo cha Yakobo kilichotangulia.
- source_word: יָקֻם
  choice: Baba yangu na ainuke
  rationale: Umbo la ombi la heshima limehifadhiwa kwa nafsi ya tatu, badala ya kuligeuza kuwa amri ya moja kwa moja.
- source_word: מִצֵּיד בְּנוֹ
  choice: mawindo ya mwanawe
  rationale: ‘Mawindo’ hudumisha muktadha wa uwindaji na msemo wa Kiebrania ‘ya mwanawe’ bila kuufanya kuwa chakula cha kawaida tu.
- source_word: בַּעֲבוּר
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: תְּבָרֲכַנִּי
  choice: inibariki
  rationale: Hueleza tendo linalotamaniwa baada ya baba kula, huku likiambatana kawaida na kishazi cha kusudi ‘ili’.
- source_word: נַפְשֶׁךָ
  choice: nafsi yako
  rationale: Huhifadhi usemi wa wazi wa Kiebrania na uzito wa tukio, badala ya kuufupisha kimya kimya kuwa ‘wewe’.
- source_word: וַיָּבֵא לְאָבִיו
  choice: akamletea baba yake
  rationale: Kitenzi cha Kiswahili kinajumuisha maana ya kuleta kitu kwa mtu; chakula kinachorejelewa kinaeleweka kutokana na muktadha.
theological_decisions:
- issue: Je, נַפְשֶׁךָ itafsiriwe kama kiwakilishi cha mtu mzima au ihifadhiwe kwa maana yake ya moja kwa moja?
  choice: nafsi yako inibariki
  alternative: unibariki
  rationale: Ingawa ‘nafsi yako’ inaweza kutumika kama msemo unaomaanisha mtu mwenyewe, kuitaja wazi huhifadhi mvutano na uzito wa lugha ya chanzo bila kuweka tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. Muundo ‘Baba yangu na ainuke’ unahifadhi ombi la heshima la nafsi ya tatu; ‘nafsi yako’ inalinda usemi wa chanzo. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa.
