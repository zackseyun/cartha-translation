base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: sw
  text: Rebeka alipoambiwa maneno ya Esau, mwanawe mkubwa, alituma mtu akamwita Yakobo, mwanawe mdogo, akamwambia, “Tazama, Esau ndugu yako anajifariji kuhusu wewe kwa kupanga kukuua.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתְנַחֵם
  choice: anajifariji
  rationale: Kitenzi hiki kinaonyesha Esau akijipa faraja au kujituliza kwa wazo la kumuua Yakobo; tafsiri hii inadumisha usemi mkali na usio wa kawaida wa Kiebrania.
- source_word: לְךָ
  choice: kuhusu wewe
  rationale: Kirai hiki kinaeleza kwamba Yakobo ndiye anayelengwa na mawazo au kusudi la Esau, bila kukifanya kimaanishe msamaha.
- source_word: לְהָרְגֶךָ
  choice: kwa kupanga kukuua
  rationale: Muundo wenye לְ unaweza kueleza namna au msingi wa kujifariji kwake; ‘kwa kupanga’ huonyesha kwamba faraja yake inatokana na kusudi la kumuua Yakobo, si kwamba mauaji tayari yanafanyika.
- source_word: בְּנָהּ הַגָּדֹל / בְּנָהּ הַקָּטָן
  choice: mwanawe mkubwa / mwanawe mdogo
  rationale: Huhifadhi ulinganifu wa maelezo kuhusu wana wawili na hutumia Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya Esau ‘kujifariji’ kwa habari ya Yakobo
  choice: anajifariji kuhusu wewe kwa kupanga kukuua
  alternative: anajituliza kwa kusubiri kukuua
  rationale: Maandishi yanaunganisha kujifariji kwa Esau na kumuua Yakobo, lakini hayaelezi kwa uwazi muda au hatua zote za mpango wake. Tafsiri iliyochaguliwa inalinda mvutano huo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa uwe wa kawaida kwa msomaji, huku usemi wa Kiebrania kuhusu Esau kujifariji kwa wazo la mauaji ukihifadhiwa.
