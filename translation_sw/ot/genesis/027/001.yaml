base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: sw
  text: Ikawa, Isaka alipokuwa amezeeka, macho yake yalikuwa yamefifia, asione. Akamwita Esau, mwanawe mkubwa[a], akamwambia, “Mwanangu.” Naye akamjibu, “Mimi hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanawe wa kwanza.”
    reason: הַגָּדֹל inaweza kutafsiriwa kwa kuonyesha wazi cheo cha Esau kama mzaliwa wa kwanza badala ya usemi wa kawaida “mwanawe mkubwa.”
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ikawa ... alipokuwa
  rationale: Muundo huu unaendeleza simulizi na kutambulisha hali ya wakati bila kuongeza neno la wazi linalomaanisha ‘sasa.’
- source_word: זָקֵן
  choice: alipokuwa amezeeka
  rationale: Kitenzi hiki cha Kiswahili kinaeleza kwa kawaida kwamba Isaka alikuwa amefikia uzee.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: macho yake yakawa yamefifia asiweze kuona
  rationale: Huhifadhi taswira ya macho yaliyofifia pamoja na matokeo ya kutoweza kuona.
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Katika muktadha huu קרא ni kumwita mtu ili azungumze naye; ‘akamwita’ ni ya kawaida na hailazimishi wazo rasmi la kumwagiza afike.
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: Esau, mwanawe mkubwa
  rationale: ‘Mwanawe mkubwa’ humtofautisha Esau na mwana mdogo na huhifadhi uwezekano wa kuelewa הַגָּדֹל kuwa mkubwa au wa kwanza kwa kuzaliwa.
- source_word: בְּנִי
  choice: Mwanangu
  rationale: Huwakilisha kiambishi cha umilikaji na sauti ya kifamilia katika mwito wa moja kwa moja.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Ni jibu la kawaida la Kiswahili linaloonyesha kuwapo na utayari wa kuitikia.
