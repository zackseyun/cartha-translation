  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: sw
  text: Basi akasogea karibu, akambusu, akanusa harufu ya mavazi yake, akambariki, akasema, “Tazama, harufu ya mwanangu ni kama harufu ya shamba ambalo Yahwe amelibariki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Basi akasogea karibu
  rationale: Kauli ya masimulizi inaendeleza mfuatano wa matukio; “akasogea karibu” huonyesha wazi mwendo wa kumkaribia Isaka.
- source_word: וַיִּשַּׁק לוֹ
  choice: akambusu
  rationale: Hutoa maana ya moja kwa moja ya kumbusu mtu bila kuongeza hisia ambazo hazijaelezwa katika maandishi.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: Akasikia harufu ya mavazi yake
  rationale: Katika Kiswahili, “kusikia harufu” ni usemi wa kawaida na wa asili. Nomino “harufu” imehifadhiwa hapa na katika kauli inayofuata ili kuakisi urudiaji wa רֵיחַ katika Kiebrania.
- source_word: בְּגָדָיו
  choice: mavazi yake
  rationale: “Mavazi” ni neno la heshima na la kawaida linalohifadhi wingi wa nomino ya Kiebrania.
- source_word: וַיְבָרֲכֵהוּ
  choice: akambariki
  rationale: Tafsiri ya moja kwa moja ya kitenzi ברך pamoja na kiambishi cha mtendewa.
- source_word: רְאֵה
  choice: Tazama
  rationale: Amri hii inavuta usikivu; “Tazama” inafaa katika kauli ya baraka na bado inaeleweka katika Kiswahili cha sasa.
- source_word: רֵיחַ בְּנִי
  choice: harufu ya mwanangu
  rationale: Inadumisha nomino “harufu” na hivyo kuhifadhi urudiaji wa kimakusudi katika mstari.
- source_word: כְּרֵיחַ שָׂדֶה
  choice: ni kama harufu ya shamba
  rationale: “Kama” huonyesha tashbihi ya כ, na “shamba” ni maana ya kawaida ya שָׂדֶה katika muktadha huu.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: ambalo Yahwe amelibariki
  rationale: Kauli ya uhusiano inarejelea “shamba”; hali timilifu “amelibariki” inaonyesha tendo lenye matokeo yanayoendelea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina binafsi bila kulibadilisha kuwa cheo, huku likifuata tahajia ya kawaida ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “harufu” umehifadhiwa kwa kuwa ni sifa halisi ya mtindo wa Kiebrania, lakini muundo usio wa asili wa “kunusa harufu” umeepukwa kwa kutumia usemi wa kawaida “kusikia harufu.”
