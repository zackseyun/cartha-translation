  yaml_path: translation/ot/genesis/027/008.yaml
  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: sw
  text: Na sasa, mwanangu, sikiliza sauti yangu katika yale ninayokuamuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kiunganishi na alama ya wakati vinaanzisha agizo linalofuata; ‘Basi sasa’ ni ya asili katika Kiswahili na huhifadhi mwendelezo pamoja na uharaka.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Ni mwito wenye kiambishi cha nafsi ya kwanza umoja; ‘mwanangu’ ni namna ya kawaida na yenye hadhi ya kumwita mwana.
- source_word: שְׁמַע בְּקֹלִי
  choice: sikiliza ninachokuambia na kutii
  rationale: Nahau hii humaanisha kusikia kwa makini na kuchukua hatua ya utii. Kiswahili ‘sikiliza sauti yangu’ kingeeleweka lakini si cha kawaida hapa; tafsiri hii huhifadhi kusikiliza na maana iliyodokezwa ya kutii bila kutumia ‘tii’ peke yake.
- source_word: לַאֲשֶׁר אֲנִי מְצַוָּה אֹתָךְ
  choice: agizo nitakalokupa
  rationale: Kishazi kinaelekeza kwenye jambo analomwagiza Yakobo. ‘Agizo nitakalokupa’ ni Kiswahili cha asili kinachoonyesha amri iliyo karibu kutolewa katika mistari inayofuata.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imeepuka usemi usio wa kawaida ‘sikiliza sauti yangu’ na imewasilisha nguvu ya nahau ya Kiebrania kwa uwazi.
