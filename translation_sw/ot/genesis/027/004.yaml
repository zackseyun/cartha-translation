  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: sw
  text: Uniandalie chakula kitamu[a] kama ninavyopenda, kisha uniletee ili nile, kusudi nafsi yangu[b] ikubariki kabla sijafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chakula cha ladha” au “vyakula vitamu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nafsi yangu ikubariki,” yaani Isaka mwenyewe katika utu wake wote akubariki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה לִי
  choice: Uniandalie
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya,’ lakini katika muktadha wa mapishi ‘uniandalie’ ni Kiswahili cha kawaida na kinaonyesha pia kiwakilishi cha mnufaika לִי.
- source_word: מַטְעַמִּים
  choice: chakula kitamu
  rationale: Nomino hii inamaanisha chakula kilichoandaliwa kwa ladha maalumu. ‘Chakula kitamu’ ni wazi na cha kawaida katika Kiswahili cha kisasa bila kupunguza maana kuwa aina fulani tu ya chakula.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: kama ninavyopenda
  rationale: Kauli hii inaeleza mapendeleo ya Isaka. Kiswahili hiki ni cha kawaida na kinadumisha wazo la chakula anachokipenda.
- source_word: וְהָבִיאָה לִּי
  choice: kisha uniletee
  rationale: ‘Uniletee’ huonyesha mwendo wa kitu kuja kwa msemaji pamoja na maana ya לִי; ‘kisha’ huunganisha hatua zinazofuatana kwa ufasaha.
- source_word: וְאֹכֵלָה
  choice: ili nile
  rationale: Umbo la cohortative linaonyesha tendo analokusudia Isaka baada ya kuletewa chakula. ‘Ili nile’ linaeleza kusudi hilo kwa Kiswahili cha asili.
- source_word: בַּעֲבוּר
  choice: kusudi
  rationale: Neno hili linaanzisha kusudi la kula chakula. ‘Kusudi’ linadumisha uhusiano huo bila kurudia ‘ili’ mara mbili mfululizo.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: nafsi yangu ikubariki
  rationale: Tafsiri hii inadumisha נַפְשִׁי kama kiima cha wazi na hivyo kuhifadhi msisitizo wa Isaka mwenyewe katika utu wake wote.
- source_word: בְּטֶרֶם אָמוּת
  choice: kabla sijafa
  rationale: Kauli hii ya wakati ni tafsiri ya moja kwa moja na ya kawaida ya wazo la kufa kwa msemaji wakati ujao.
theological_decisions:
- issue: Maana ya נַפְשִׁי katika baraka
  choice: nafsi yangu ikubariki
  alternative: nikubariki
  rationale: Matini ya Kiebrania inataja ‘nafsi yangu’ waziwazi. Kuihifadhi huepuka kufuta msisitizo wa utu mzima wa Isaka, huku tanbihi ikifafanua kuwa hii ni nahau inayomhusu Isaka mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maagizo ni wa kawaida katika mazungumzo, huku ‘nafsi yangu’ ikihifadhi uzito na upekee wa lugha ya chanzo.
