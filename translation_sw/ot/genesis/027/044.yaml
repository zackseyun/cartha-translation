  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: sw
  text: Nawe ukae pamoja naye kwa siku chache, mpaka hasira kali ya ndugu yako itulie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “irudi” au “igeuke”; hapa usemi huo unamaanisha hasira kali kupungua au kutulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Nawe ukae
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kukaa, kuishi au kubaki. Hapa ni agizo la kukaa kwa muda nyumbani kwa Labani, hivyo “ukae” ni la kawaida na linafaa katika muktadha.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Kihusishi עִם chenye kiambishi cha nafsi ya tatu ya kiume kinamaanisha kuwa pamoja naye, yaani Labani katika muktadha wa karibu.
- source_word: יָמִים אֲחָדִים
  choice: kwa siku chache
  rationale: Kirai hiki ni “siku chache” kwa maana ya muda mfupi uliotarajiwa. Tafsiri hii huhifadhi namna Rebeka alivyoueleza muda huo bila kuingiza mapema matokeo ya kukaa kwa muda mrefu.
- source_word: עַד אֲשֶׁר
  choice: mpaka
  rationale: Muungano huu unaonyesha kikomo cha muda, na “mpaka” ni usemi wa kawaida wa Kiswahili.
- source_word: תָּשׁוּב
  choice: itulie
  rationale: Kitenzi שׁוב kimsingi ni kurudi au kugeuka. Kinapotumiwa kuhusu hasira kali, “itulie” hutoa maana yake ya kimuktadha kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- source_word: חֲמַת
  choice: hasira kali
  rationale: Nomino חֵמָה huonyesha hasira yenye nguvu au ghadhabu. “Hasira kali” inaeleweka kwa urahisi na huhifadhi kiwango chake cha ukali.
- source_word: אָחִיךָ
  choice: ya ndugu yako
  rationale: Muundo tegemezi wa Kiebrania unaonyesha kuwa hasira hiyo ni ya ndugu wa Yakobo; Kiswahili huiwasilisha kwa kawaida kwa “ya ndugu yako.”
