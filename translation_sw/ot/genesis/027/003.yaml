  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: sw
  text: Basi sasa, tafadhali chukua vifaa vyako—podo lako na upinde wako—uende porini ukaniwindie mawindo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito wa mazungumzo kuelekea agizo linalofuata, huku ikihifadhi wazo la wakati wa sasa.
- source_word: שָׂא נָא
  choice: tafadhali chukua
  rationale: Katika muktadha wa vifaa, kitenzi hiki kwa njia ya kawaida humaanisha ‘chukua’; נָא huonyesha ombi la heshima au msisitizo wa upole.
- source_word: כֵלֶיךָ
  choice: vifaa vyako
  rationale: Neno pana כְּלִי linaweza kumaanisha kifaa, chombo, au silaha; hapa linafafanuliwa na podo na upinde.
- source_word: תֶּלְיְךָ
  choice: podo lako
  rationale: Neno hilo linataja mfuko wa kubebea mishale; ‘podo’ ni istilahi ya kawaida na sahihi ya Kiswahili.
- source_word: וְקַשְׁתֶּךָ
  choice: na upinde wako
  rationale: Tafsiri ya moja kwa moja ya neno la kawaida la Kiebrania linalomaanisha upinde.
- source_word: וְצֵא הַשָּׂדֶה
  choice: uende porini
  rationale: שָׂדֶה inaweza kumaanisha shamba au eneo la wazi; katika muktadha wa uwindaji, ‘porini’ ni ya asili zaidi bila kudokeza shamba lililolimwa.
- source_word: וְצוּדָה לִּי צידה
  choice: ukaniwindie mawindo
  rationale: Muundo huu huhifadhi tendo la kuwinda na kusudi la kumpatia msemaji chakula kilichowindwa, kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Podo’ limetumiwa kwa quiver, na ‘porini’ kwa eneo la wazi la uwindaji. Hakuna tanbihi inayohitajika katika mstari huu.
