  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: sw
  text: Rebeka alikuwa akisikiliza Isaka alipokuwa akizungumza na Esau, mwanawe; Esau akaenda uwandani kuwinda mawindo ili ayalete.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: Rebeka
  rationale: Kiunganishi וְ kinaendeleza simulizi; mtiririko wa Kiswahili hauhitaji kuanza kwa “Na” au kuongeza “Basi.”
- source_word: שֹׁמַעַת
  choice: alikuwa akisikiliza
  rationale: Kitenzi shirikishi kinaonyesha tendo lililokuwa likiendelea kama usuli wa maneno ya Isaka. “Alikuwa akisikiliza” huonyesha hali hiyo vizuri kuliko wakati uliopita usio endelevu.
- source_word: בְּ/דַבֵּר
  choice: alipokuwa akizungumza
  rationale: בְּ pamoja na jina-kitenzi huonyesha matendo yaliyotokea kwa wakati mmoja; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: אֶל עֵשָׂו בְּנוֹ
  choice: na Esau mwanawe
  rationale: Katika Kiswahili, “kuzungumza na” ndiyo njia ya kawaida ya kueleza kuelekeza maneno kwa mtu; “mwanawe” huhifadhi uhusiano ulioelezwa na kiambishi cha Kiebrania.
- source_word: וַ/יֵּלֶךְ
  choice: naye Esau akaenda
  rationale: Muundo huu huendeleza mfululizo wa matukio na huweka wazi kuwa Esau ndiye aliyetenda.
- source_word: הַ/שָּׂדֶה
  choice: uwandani
  rationale: Katika muktadha wa uwindaji, שׂדה ni eneo la wazi au nchi ya nje, si lazima shamba lililolimwa; “uwandani” huepuka maana finyu ya “shambani.”
- source_word: לָ/צוּד צַיִד
  choice: kuwinda mawindo
  rationale: צוד ni kuwinda, na ציד hapa ni mawindo kwa maana ya wanyama wanaowindwa, bila kuyafinyisha kuwa nyama ya aina fulani.
- source_word: לְ/הָבִיא
  choice: na kuyaleta
  rationale: Jina-kitenzi la kusudi linaonyesha kwamba Esau angeleta mawindo hayo; kiwakilishi “ya-” kinarejelea “mawindo.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uwandani” limetumiwa badala ya “shambani” kwa kuwa muktadha ni uwindaji katika eneo la wazi. Muundo endelevu “alikuwa akisikiliza … alipokuwa akizungumza” huhifadhi matendo yanayotokea kwa wakati mmoja.
