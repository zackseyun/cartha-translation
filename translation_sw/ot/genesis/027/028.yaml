base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: sw
  text: Mungu na akupe umande wa mbinguni[a], rutuba ya ardhi, na wingi wa nafaka na divai mpya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baadhi ya umande wa mbingu ... na baadhi ya unono wa ardhi.” Kiebrania kinaweza kuonyesha sehemu au chanzo, na kinatumia taswira ya kilimo inayoashiria rutuba na wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Mungu na akupe
  rationale: Katika muktadha wa baraka, kitenzi hiki kinaonyesha ombi au tamko la heri, si utabiri wa kawaida tu. Muundo huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hili ni jina la cheo linalomtaja Mungu kwa uhakika; Kiswahili hakihitaji kutafsiri kibainishi cha Kiebrania kando.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: umande wa mbinguni
  rationale: Usemi huu unadumisha taswira ya umande unaohusishwa na mbingu. Kihusishi מִן kinaweza kueleweka kuwa cha chanzo au cha sehemu; maelezo ya chini yanahifadhi uwezekano huo bila kufanya sentensi kuu kuwa nzito.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: rutuba ya ardhi
  rationale: Neno la Kiebrania lina maana halisi inayohusiana na unono, lakini hapa ni taswira ya ardhi yenye rutuba na mazao mengi. “Rutuba ya ardhi” ni Kiswahili cha sasa, wazi na cha asili.
- source_word: וְרֹב
  choice: na wingi wa
  rationale: רֹב huonyesha wingi au tele; “wingi wa” inadumisha mtindo wenye hadhi wa baraka na kuunganisha nomino mbili zinazofuata.
- source_word: דָּגָן
  choice: nafaka
  rationale: Ni neno la jumla kwa mazao ya nafaka, na “nafaka” ndilo neno wazi la Kiswahili sanifu.
- source_word: וְתִירֹשׁ
  choice: na divai mpya
  rationale: תִּירוֹשׁ kwa kawaida humaanisha divai mpya au changa, tofauti na neno la jumla zaidi la divai; tafsiri hii inadumisha tofauti hiyo ya kileksika.
theological_decisions:
- issue: Asili ya tamko
  choice: 'Baraka ya kutakia mema: “Mungu na akupe”'
  alternative: 'Utabiri wa wakati ujao: “Mungu atakupa”'
  rationale: Umbo la kitenzi na muktadha wa Isaka kutoa baraka vinaunga mkono maana ya ombi au tamko la heri. Hii inadumisha nguvu ya kitendo cha kubariki bila kuongeza dai la kiteolojia lisilosemwa na maandiko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mungu na akupe” hudumisha sauti ya baraka; “rutuba” hufikisha kwa uwazi taswira ya Kiebrania ya “unono” wa ardhi. Alama ya tanbihi [a] imewekwa katika matini kuu.
