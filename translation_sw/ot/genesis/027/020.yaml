base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: sw
  text: Kisha Isaka akamwambia mwanawe, “Imekuwaje ukaipata upesi hivi, mwanangu?” Naye akajibu, “Ni kwa sababu Yahwe, Mungu wako, aliifanya ipatikane mbele yangu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alinijalia kuipata” au “alinifanikishia.” Kiebrania kinaweza kumaanisha kwamba Mungu alisababisha jambo hilo litokee au akamfanya Yakobo akipate.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה זֶּה
  choice: Imekuwaje
  rationale: Nahau hii inaonyesha mshangao wa Isaka pamoja na swali lake; “Imekuwaje” ni Kiswahili cha kawaida na cha asili.
- source_word: מִהַרְתָּ לִמְצֹא
  choice: ukaipata upesi hivi
  rationale: Muundo huu unaeleza kwa kawaida matokeo ya kuharakisha kupata, huku ukihifadhi mshangao kuhusu kasi hiyo. Kiambishi “-i-” kinarejelea kimuktadha mnyama au chakula kilichotafutwa.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Huhifadhi umilikishi wa nafsi ya kwanza na namna ya upole ya kumwita mwana.
- source_word: כִּי
  choice: Ni kwa sababu
  rationale: Hutanguliza wazi sababu inayotolewa katika jibu la Yakobo.
- source_word: הִקְרָה ... לְפָנַי
  choice: aliifanya ipatikane mbele yangu
  rationale: Huhifadhi nguvu ya kisababishi ya kitenzi na pia picha ya jambo kutokea au kupatikana mbele ya msemaji, bila kuongeza wazo la tendo halisi la kuletwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi kiambishi cha nafsi ya pili umoja; Yakobo anasema “Mungu wako,” si “Mungu wangu,” jambo muhimu katika mvutano wa simulizi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi.
- issue: Kiwango cha usababishaji wa kimungu katika הִקְרָה
  choice: aliifanya ipatikane mbele yangu
  alternative: alinijalia kuipata; alinifanikishia; aliileta kwangu
  rationale: Tafsiri iliyochaguliwa inaonyesha kuwa Yakobo anahusisha kupatikana kwake kwa haraka na tendo la Mungu, lakini haisemi kwa nguvu zaidi ya chanzo kwamba Mungu aliileta moja kwa moja au alimhakikishia mafanikio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya heshima, na rahisi kueleweka. Mazungumzo yamewekwa kwa mtiririko wa kawaida huku “Mungu wako” na utata wa kishazi cha mwisho vikihifadhiwa.
