base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: sw
  text: Mungu akamwambia Noa, “Hii ndiyo ishara ya agano ambalo nimeliweka kati yangu na kila kiumbe chenye mwili[a] kilicho duniani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kila mwili,” usemi mpana unaomaanisha viumbe hai vya duniani katika muktadha huu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wenye waw-consecutive unaendeleza simulizi; “akamwambia” ni wa kawaida katika Kiswahili na pia huonyesha anayeelekezewa maneno.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa Mungu mmoja anayesema na Noa katika muktadha huu.
- source_word: אֶל נֹחַ
  choice: Noa
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili; kiambishi “-mw-” katika “akamwambia” kinaonyesha kwamba Noa ndiye anayeambiwa.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Hii ndiyo ishara ya agano
  rationale: “Hii ndiyo” huwasilisha kwa Kiswahili fasaha kishazi cha utambulisho, na “ishara” hudumisha maana ya kitu kinachoonekana kinachothibitisha agano.
- source_word: הֲקִמֹתִי
  choice: nimeliweka
  rationale: Hiphil ya קום pamoja na בְּרִית humaanisha kuweka, kuanzisha, au kuthibitisha agano. “Nimeliweka” ni ya sasa na ya kawaida, huku hali timilifu ikionyesha tendo lililokamilika lenye umuhimu unaoendelea.
- source_word: בֵּינִי וּבֵין
  choice: kati yangu na
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaotaja pande za agano.
- source_word: כָּל בָּשָׂר
  choice: kila kiumbe chenye mwili
  rationale: Usemi wa Kiebrania ni “kila mwili,” lakini katika muktadha huu unahusu kwa upana viumbe hai vya duniani, si wanadamu peke yao. Tafsiri hii ni wazi na ya asili bila kuufinya upeo huo.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: kilicho duniani
  rationale: Kishazi hiki kinafafanua kila kiumbe chenye mwili; “duniani” hudumisha upeo wa ulimwengu mzima kuliko “nchini” au “kwenye ardhi” katika muktadha huu.
theological_decisions:
- issue: Upeo wa כָּל בָּשָׂר katika agano la Noa
  choice: kila kiumbe chenye mwili
  alternative: wanadamu wote
  rationale: Katika Mwanzo 9 usemi huu unakusudia zaidi ya wanadamu na unajumuisha viumbe hai vya duniani. Tafsiri haifupishi kimakosa upeo wa agano kuwa wa wanadamu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Agano” na “ishara” hudumisha istilahi kuu za kibiblia; “kila kiumbe chenye mwili” huwasilisha upana wa nahau ya Kiebrania kwa namna ya asili.
