base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: sw
  text: Kila kiumbe kinachosogea[a] kilicho hai kitakuwa chakula chenu. Kama nilivyowapa mimea ya kijani, nimewapa kila kitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila kiumbe kinachotambaa kilicho hai kitakuwa chakula chenu.” Neno la Kiebrania רֶמֶשׂ mara nyingi hutaja viumbe wanaotambaa au kusongamana, lakini hapa yaelekea lina maana pana kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: Kila kiumbe ... kinachotembea
  rationale: Muundo wa ‘kila’ pamoja na nomino ya umoja unaonyesha maana ya kugawa inayojumuisha wote. ‘Kiumbe kinachotembea’ ni ya kawaida katika Kiswahili na inadumisha upana wa רֶמֶשׂ katika muktadha huu bila kuifunga kwa viumbe watambaao pekee.
- source_word: אֲשֶׁר הוּא חַי
  choice: hai
  rationale: Kivumishi ‘hai’ kinaonyesha wazi kuwa kinachozungumziwa ni kiumbe kilicho hai, na kinaunganishwa kwa ufasaha na ‘kiumbe kinachotembea.’
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: kitakuwa chakula chenu
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza ruhusa na utoaji unaokusudiwa na muundo wa Kiebrania.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: Kama nilivyowapa mimea ya kijani
  rationale: ‘Mimea ya kijani’ inaeleza kwa lugha ya sasa maana ya pamoja ya uoto wa kijani uliotolewa awali kuwa chakula; kitenzi kinaeleweka kutoka נָתַתִּי na kimetumiwa katika kishazi cha kulinganisha kwa ufasaha.
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  choice: nimewapa kila kitu
  rationale: Wakati timilifu ‘nimewapa’ unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea, huku ‘kila kitu’ kikihifadhi nguvu pana ya כֹּל.
theological_decisions:
- issue: Upeo wa ruhusa ya kula baada ya gharika
  choice: Mstari unaeleza kwa upana kwamba viumbe hai vinavyotembea vimetolewa kuwa chakula cha wanadamu.
  alternative: Kufasiri רֶמֶשׂ kuwa inahusu tu viumbe watambaao au wadogo wanaotambaa.
  rationale: Ingawa רֶמֶשׂ inaweza kutaja viumbe watambaao au wanaosongamana katika mazingira mengine, hapa ‘kila’ na hitimisho ‘kila kitu’ vinaunga mkono maana pana. Tafsiri haiongezi mipaka ambayo mstari huu hauitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Muundo ‘chakula chenu’ ni wa kawaida na wazi; ‘kiumbe hai kinachotembea’ huhifadhi upana wa neno la Kiebrania. Alama ya tanbihi imewekwa baada ya ‘kila kitu’ ili kuambatana na mstari mzima unaohusika na mbadala wa kileksika.
