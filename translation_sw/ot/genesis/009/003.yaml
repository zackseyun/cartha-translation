  source_fidelity: Marekebisho yanahitajika kwa mpangilio wa virejeshi katika kishazi cha kwanza. Rasimu ya “Kila kiumbe hai kinachotembea” inaweza kusikika kama inamaanisha viumbe hai wanaotembea kwa miguu, na hivyo kupunguza kwa bahati mbaya upeo mpana wa רֶמֶשׂ katika muktadha huu. “Kila kiumbe kinachosogea kilicho hai” hufuata kwa karibu zaidi “kila kiumbe kinachosogea ambacho ni hai,” bila kuashiria mwendo wa kutembea pekee. Sehemu iliyobaki inawasilisha vizuri utoaji wa chakula na ulinganisho na mimea ya kijani.
  naturalness: “Kiumbe kinachosogea kilicho hai” ni Kiswahili Sanifu kinachoeleweka na kinaweka sifa ya uhai wazi. “Kitakuwa chakula chenu,” “Kama nilivyowapa mimea ya kijani,” na “nimewapa kila kitu” ni za asili katika rejista ya Biblia ya kisasa.
  terminology: “Kiumbe” ni pana na linafaa kwa רֶמֶשׂ katika aya hii; “kinachosogea” huhifadhi maana ya msingi ya mwendo bila kuifunga kwa watambaao au watembeao kwa miguu. Tanbihi ihamishwe hadi neno linalopewa mbadala wa kileksika, badala ya mwisho wa mstari.
