  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: sw
  text: Upinde[a] utakuwa katika wingu, nami nitauona ili nikumbuke agano la milele kati ya Mungu na kila kiumbe hai chenye mwili kilicho duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upinde wa mvua.” Neno la Kiebrania humaanisha kihalisi “upinde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: utakuwa
  rationale: Kauli hii inaendeleza maneno ya Mungu yanayoelekezwa wakati ujao; wakati ujao wa Kiswahili unafaa na hauongezi wazo la ‘kutokea’ lisilotajwa wazi.
- source_word: הַקֶּשֶׁת
  choice: upinde
  rationale: Neno la Kiebrania humaanisha kihalisi ‘upinde’; katika muktadha huu ni upinde unaoonekana angani. Tafsiri kuu inadumisha taswira ya chanzo, huku maana ya ‘upinde wa mvua’ ikielezwa katika tanbihi.
- source_word: בֶּעָנָן
  choice: winguni
  rationale: Nomino ya Kiebrania iko katika umoja na ina kibainishi. ‘Winguni’ ni usemi wa kawaida wa Kiswahili unaowasilisha wazo la kuwa ndani ya wingu bila kulazimisha wingi.
- source_word: וּרְאִיתִיהָ
  choice: nami nitauona
  rationale: Kiwakilishi tamati cha kike kinarejelea upinde. Muundo huu huhifadhi kishazi sambamba cha wakati ujao.
- source_word: לִזְכֹּר
  choice: ili nikumbuke
  rationale: Infinitivu yenye ל inaweza kuonyesha kusudi au matokeo. ‘Ili nikumbuke’ ni ya asili katika Kiswahili na huhifadhi uhusiano huo bila kufafanua zaidi.
- source_word: בְּרִית עוֹלָם
  choice: agano la milele
  rationale: Usemi huu unaonyesha agano lenye kudumu kwa vizazi; ‘agano la milele’ ni wazi, wenye hadhi, na wa kawaida katika Kiswahili.
- source_word: בֵּין אֱלֹהִים וּבֵין
  choice: kati ya Mungu na
  rationale: Kiebrania hurudia kihusishi katika muundo ‘kati ya ... na kati ya ...’; Kiswahili cha kawaida hukifupisha kuwa ‘kati ya ... na ...’.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: kila kiumbe hai
  rationale: Usemi huu unahusu viumbe vyenye uhai kwa upana, si ‘nafsi’ ya mwanadamu pekee. ‘Kila kiumbe hai’ ni sahihi na ya kawaida.
- source_word: בְּכָל בָּשָׂר
  choice: katika wote wenye mwili
  rationale: Kirai hiki kinafafanua viumbe hai kwa kurejelea wenye mwili wote. ‘Katika wote wenye mwili’ hudumisha kihusishi na upana wa ‘mwili wote’ bila kutumia usemi usio wa kawaida ‘nyama yote’.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: walio duniani
  rationale: Kishazi hiki kinabainisha viumbe walio juu ya dunia. ‘Walio duniani’ ni cha asili na hudumisha upeo wa ulimwengu mzima.
theological_decisions:
- issue: Kumbukumbu ya Mungu inayoelezwa kwa lugha ya kibinadamu
  choice: nami nitauona ili nikumbuke
  alternative: nami nitauona na kutenda kulingana na agano langu
  rationale: Tafsiri inadumisha kauli ya chanzo kwamba Mungu huona na kukumbuka, bila kuifafanua kuwa hatua ya kutenda au kuondoa mvutano wa kitheolojia uliomo katika lugha hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida huku taswira ya Kiebrania na lugha ya agano vikidumishwa. Tanbihi imewekwa mara tu baada ya neno ‘winguni’ ili ifuate mpangilio wa alama katika safu ya ushauri, ingawa inaeleza neno ‘upinde’.
