  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: sw
  text: Mungu ampanulie Yafethi; na akae[a] katika mahema ya Shemu; Kanaani na awe mtumwa wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu akae katika mahema ya Shemu”; pia yaweza kuwa, “Yafethi akae katika mahema ya Shemu.” Kiebrania hakitaji wazi kiima cha neno “akae.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: na ampanulie
  rationale: Hali ya kutakia ya kitenzi hiki inaomba Mungu amfanyie Yafethi nafasi pana au amkuze. “Ampanulie” inadumisha picha ya kupanua bila kuongeza kitu kama “mipaka,” ambacho hakitajwi katika Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi kisarufi, kitenzi ni cha umoja na kinamrejelea Mungu mmoja.
- source_word: לְיֶפֶת
  choice: Yafethi
  rationale: Jina limetoholewa kwa umbo linalotambulika katika Kiswahili; kiambishi לְ kinawakilishwa katika muundo wa kitenzi “ampanulie.”
- source_word: וְיִשְׁכֹּן
  choice: na akae
  rationale: Muundo wa kutakia unaendelezwa kwa “na akae.” Kiswahili kinaweza kuacha kiima bila kukitaja, hivyo utata wa kama anayekaa ni Mungu au Yafethi unabaki kama ulivyo katika Kiebrania.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: katika mahema ya Shemu
  rationale: Tafsiri ya mahali iliyo ya moja kwa moja inadumisha taswira halisi ya mahema badala ya kuibadili kuwa makao kwa ujumla.
- source_word: וִיהִי
  choice: na awe
  rationale: Huu ni usemi wa kutakia unaofaa mtindo wa baraka na laana katika muktadha huu.
- source_word: כְנַעַן
  choice: Kanaani
  rationale: Jina la mtu limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Katika tamko hili hali ya kutiishwa ni ya msingi; “mtumwa” huonyesha uzito wa עֶבֶד kwa uwazi kuliko “mtumishi.”
- source_word: לָמוֹ
  choice: wao
  rationale: Kiambishi hiki cha kiwakilishi kinaeleweka hapa kwa wingi, kwa kawaida kikirejelea Shemu na Yafethi pamoja.
theological_decisions:
- issue: Kiima cha maneno “na akae katika mahema ya Shemu”
  choice: 'Kiima hakitajwi katika matini kuu: “na akae.”'
  alternative: Ama Mungu akae katika mahema ya Shemu, au Yafethi akae katika mahema ya Shemu.
  rationale: Kitenzi cha Kiebrania kina kiima cha kiume umoja lakini hakikitaji waziwazi. Muktadha unaruhusu Mungu au Yafethi kuwa kiima; muundo wa Kiswahili usiotaja kiima unahifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa tamko la baraka na laana lakini kinachoeleweka kwa msomaji wa kawaida. Majina Yafethi, Shemu, na Kanaani yanafuata maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
