  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: sw
  text: 'Akasema,


    “Na abarikiwe BWANA, Mungu wa Shemu;

    Kanaani awe mtumwa wao.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: wake. Neno la Kiebrania linaweza kumrejelea Shemu kwa umoja au Shemu pamoja na watu wake.'
    reason: Kuhifadhi utata halisi wa kiambishi לָמוֹ kuhusu idadi na rejeo lake.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Ahimidiwe
  rationale: Katika baraka inayoelekezwa kwa Mungu, ‘Ahimidiwe’ ni Kiswahili cha kawaida na chenye heshima kinachoonyesha kwamba BWANA anastahili sifa, bila kudokeza kwamba mwanadamu ndiye anayempa Mungu baraka.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Katika tamko hili la kutiishwa kwa Kanaani, ‘mtumwa’ huwasilisha kwa uwazi zaidi hali nzito ya utumishi kuliko neno pana ‘mtumishi’.
- source_word: לָמוֹ
  choice: wao
  rationale: Kiambishi hiki cha kishairi kinaweza kueleweka kama wingi, na tafsiri ‘wao’ inahifadhi rejeo la pamoja linalowezekana, yaani Shemu na watu wake; utata wake unaelezwa katika tanbihi.
theological_decisions:
- issue: Mhusika anayemiliki utumwa wa Kanaani katika לָמוֹ
  choice: wao
  alternative: wake
  rationale: Umbo לָמוֹ linaweza kuwa la wingi (‘wao’) au kutumiwa kishairi kwa umoja (‘wake’). Matini kuu inachagua wingi bila kuficha uwezekano wa umoja, ambao umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi umehifadhiwa, huku ‘na awe’ ikitoa nguvu ya ombi/tamko la וִיהִי.
