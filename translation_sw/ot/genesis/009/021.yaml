base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: sw
  text: Akanywa divai[a], akalewa, akajifunua ndani ya hema lake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akanywa kutoka katika divai.” Usemi wa Kiebrania ni “kutoka katika divai,” na huenda una maana ya kunywa kiasi fulani cha divai hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa bila kujifunika” au “alikuwa amefunuliwa.” Kitenzi cha Kiebrania kinaweza kueleweka kwa maana ya hali, ingawa “akajifunua” kinaonyesha vizuri zaidi maana ya kirejezi ya muundo wake hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: Akanywa
  rationale: Qal wayyiqtol ya שׁתה inaendeleza mfululizo wa simulizi; kiambishi cha Kiswahili a-ka- huonyesha tendo lililofuata kwa njia ya asili.
- source_word: מִן הַיַּיִן
  choice: sehemu ya divai
  rationale: מִן pamoja na nomino yenye uainifu ina maana ya sehemu ya kitu hapa. ‘Sehemu ya divai’ huhifadhi maana hiyo kuliko tafsiri ya moja kwa moja ‘kutoka katika divai’.
- source_word: וַיִּשְׁכָּר
  choice: akalewa
  rationale: Qal ya שׁכר inaonyesha kuingia katika hali ya ulevi; ‘akalewa’ ni ya kawaida, wazi, na huhifadhi mfuatano wa matendo.
- source_word: וַיִּתְגַּל
  choice: akajifunua
  rationale: Hitpael ya גלה inaelekea kuwa na maana ya kujitendea hapa. ‘Akajifunua’ huhifadhi maana hiyo bila kuongeza maelezo kuhusu namna au kusudi.
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: ndani ya hema lake
  rationale: בְּתוֹךְ huonyesha kuwa katika sehemu ya ndani; ‘ndani ya hema lake’ ni Kiswahili cha sasa, wazi, na sahihi.
theological_decisions:
- issue: Tathmini ya kimaadili au kitheolojia ya ulevi na kujifunua kwa Noa
  choice: Kusimulia matendo bila kuongeza hukumu au maana ya kingono isiyotajwa wazi katika Kiebrania
  alternative: Alilala uchi ndani ya hema lake; alikuwapo bila kufunikwa ndani ya hema lake
  rationale: Mstari unaripoti kunywa, kulewa, na hali au tendo la kujifunua, lakini hautoi moja kwa moja hukumu ya kimaadili wala maelezo ya kingono. Tafsiri inaacha muktadha unaofuata uonyeshe umuhimu wa jambo hilo.
- issue: Nguvu ya kirejezi au hali katika וַיִּתְגַּל
  choice: akajifunua
  alternative: akawa amefunuliwa; akalala bila kufunikwa
  rationale: Muundo wa Hitpael unaunga mkono maana ya kirejezi, ingawa usomaji wa hali pia unawezekana. Maelezo ya chini yanahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa a-ka-, msamiati wa kawaida lakini wenye heshima, na bila kuongeza tathmini ambayo haimo wazi katika chanzo.
