  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: sw
  text: 'Nami nitalithibitisha agano langu nanyi: kila kiumbe chenye mwili[b] hakitaangamizwa[a] tena kwa maji ya gharika, wala hakutakuwa tena na gharika ya kuiangamiza dunia.


    [a] Kwa maana halisi, kitenzi cha Kiebrania ni “kukatiliwa mbali.”


    [b] Maneno “kila kiumbe chenye mwili” yanawahusu viumbe hai kwa upana, si wanadamu peke yao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, kitenzi cha Kiebrania ni “kukatiliwa mbali.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “kila kiumbe chenye mwili” yanawahusu viumbe hai kwa upana, si wanadamu peke yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: nitalithibitisha
  rationale: Kitenzi hiki katika muktadha wa agano kinaweza kumaanisha kulisimamisha au kulithibitisha. “Nitalithibitisha” ni usemi wa asili wa Kiswahili unaodumisha uzito wa ahadi hii bila kuifanya kuwa ahadi ya kawaida tu.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: “Agano” ndilo neno la kawaida na lenye hadhi kwa בְּרִית katika simulizi la Mwanzo.
- source_word: אִתְּכֶם
  choice: nanyi
  rationale: Huwasilisha kwa ufupi na kwa kawaida maana ya “pamoja nanyi,” huku ikidokeza kwamba wanaosemeshwa ni wengi.
- source_word: יִכָּרֵת
  choice: hakitaangamizwa
  rationale: Maana halisi ni “kukatiliwa mbali,” lakini katika hukumu ya gharika kitenzi kinamaanisha kuangamizwa. Tafsiri ya asili imewekwa katika tanbihi ili kuhifadhi taswira ya Kiebrania.
- source_word: כָּל בָּשָׂר
  choice: kila kiumbe chenye mwili
  rationale: Usemi huu unahifadhi wazo la “mwili” na kwa Kiswahili unaonyesha wazi kwamba rejeo ni pana kuliko wanadamu pekee.
- source_word: עוֹד
  choice: tena
  rationale: Pamoja na ukanushi katika sentensi, “tena” huleta kwa kawaida nguvu ya ahadi ya kwamba jambo hili halitatokea kamwe tena.
- source_word: מִמֵּי הַמַּבּוּל
  choice: kwa maji ya gharika
  rationale: “Kwa” huonyesha maji ya gharika kuwa njia au kisababishi cha maangamizi.
- source_word: מַבּוּל
  choice: gharika
  rationale: “Gharika” ni neno la kawaida la Kiswahili kwa mafuriko makubwa ya simulizi la Nuhu na lina hadhi inayofaa matini.
- source_word: לְשַׁחֵת
  choice: ya kuiangamiza
  rationale: Huwasilisha moja kwa moja kusudi au matokeo ya uharibifu yanayoelezwa na שׁחת.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika muktadha wa gharika na ahadi yenye upeo mpana, “dunia” inafaa kuliko “nchi,” ingawa neno la Kiebrania linaweza kuwa na maana zote mbili katika miktadha tofauti.
theological_decisions:
- issue: Upeo wa כָּל בָּשָׂר katika ahadi ya agano
  choice: kila kiumbe chenye mwili
  alternative: wanadamu wote
  rationale: Muktadha unawahusisha wanadamu na wanyama. Tafsiri hii haibani ahadi kwa wanadamu pekee, lakini inadumisha usemi wenye “mwili” wa chanzo.
- issue: Maana ya קום katika kauli kuhusu agano
  choice: nitalithibitisha agano langu
  alternative: nitalisimamisha agano langu
  rationale: Kitenzi kinaweza kueleza kulifanya agano lisimame imara au kulithibitisha. “Nitalithibitisha” ni Kiswahili cha kawaida katika muktadha huu, bila kuamua kwa ukali ikiwa agano linaanzishwa kwa mara ya kwanza au linathibitishwa rasmi.
- issue: Upeo wa הָאָרֶץ
  choice: dunia
  alternative: nchi
  rationale: Ahadi inayohusu gharika na kila kiumbe chenye mwili inaunga mkono maana pana ya “dunia,” bila kuongeza maelezo ya kimfumo yasiyosemwa na aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wa heshima na unaosomeka kwa urahisi. “Nanyi” na “wala hakutakuwa tena” hudumisha uzito wa tamko la agano bila kutumia lugha ya kizamani kupita kiasi.
