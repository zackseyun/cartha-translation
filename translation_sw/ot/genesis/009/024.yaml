  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: sw
  text: Nuhu alipozinduka baada ya kulewa divai yake, akajua kile ambacho mwanawe mdogo zaidi[a] alikuwa amemtendea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanawe mdogo.” Kivumishi cha Kiebrania kinaweza kumaanisha “mdogo,” “mchanga,” au “mdogo kuliko wote,” kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: alipozinduka
  rationale: Kitenzi יקץ humaanisha kuamka au kuzinduka kutoka usingizini. “Alipozinduka” kinaonyesha kurudi katika hali ya ufahamu bila kukitafsiri moja kwa moja kuwa ‘alipotokwa na ulevi.’
- source_word: מִיֵּינוֹ
  choice: kutokana na divai yake
  rationale: Kirai hiki kwa karibu ni ‘kutoka katika divai yake’ na katika muktadha kinaelekeza kwenye usingizi uliotokana na divai. “Kutokana na divai yake” huhifadhi uhusiano huo kwa Kiswahili cha kawaida bila kubadili neno ‘divai’ kuwa ‘ulevi.’
- source_word: וַיֵּדַע
  choice: akajua
  rationale: ידע kwa kawaida humaanisha ‘kujua.’ Hapa inaweza pia kudokeza kupata habari, lakini “akajua” hubaki karibu na mtindo wa simulizi ya Kiebrania.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: kile ... alichokuwa amemtendea
  rationale: Kifungu hiki hakitaji tendo lenyewe, bali husema tu kile alichotendewa Nuhu. Muundo wa wakati uliotangulia unaonyesha kuwa tendo lilitokea kabla ya Nuhu kuzinduka na kujua.
- source_word: בְּנוֹ הַקָּטָן
  choice: mwanawe mdogo zaidi
  rationale: קָטָן inaweza kumaanisha mdogo, mchanga, au mdogo kuliko wote kulingana na muktadha. Katika uhusiano wa wana wa familia, “mdogo zaidi” ni tafsiri inayowezekana zaidi, huku uwezekano wa “mwanawe mdogo” ukiwekwa katika tanbihi.
theological_decisions:
- issue: Tendo alilotendewa Nuhu
  choice: Kifungu kimetafsiriwa kwa ujumla kuwa “kile ... alichokuwa amemtendea” bila kulitaja tendo hilo.
  alternative: Kulieleza kuwa kuona na kutangaza uchi wa Nuhu, au kuwa tendo kali zaidi la kingono.
  rationale: Kiebrania cha aya hii hakifafanui tendo lenyewe. Tafsiri inahifadhi utata huo badala ya kuingiza ufafanuzi fulani wa kitheolojia au kisimulizi.
- issue: Anayerejelewa na “mwanawe mdogo zaidi”
  choice: Maneno בְּנוֹ הַקָּטָן yametafsiriwa “mwanawe mdogo zaidi” bila kuongeza jina.
  alternative: “Mwanawe mdogo,” au kumtaja wazi kuwa Hamu au Kanaani.
  rationale: Aya inasema tu “mwanawe mdogo/mdogo zaidi.” Kwa kuwa simulizi pana lina maswali kuhusu anayelengwa hasa, tafsiri haiongezi ufafanuzi ambao haupo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “kutokana na divai yake” umechaguliwa ili kuhifadhi nahau ya Kiebrania kwa namna inayosomeka; tendo lenyewe limeachwa bila kufafanuliwa kama lilivyo katika chanzo.
