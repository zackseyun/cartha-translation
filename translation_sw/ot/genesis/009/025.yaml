lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Huhifadhi mfuatano wa masimulizi wa wayyiqtol na kuingiza usemi wa moja kwa moja kwa Kiswahili cha kawaida.
- source_word: אָרוּר
  choice: amelaaniwa
  rationale: Ni kivumishi-kih predikati katika kishazi kisicho na kitenzi; kauli hii huhifadhi nguvu ya tamko bila kulazimisha iwe ombi au amri.
- source_word: כְּנָעַן
  choice: Kanaani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili; maandishi yanamtaja Kanaani moja kwa moja.
- source_word: עֶבֶד עֲבָדִים
  choice: mtumwa wa watumwa
  rationale: Huhifadhi urudiaji na ukali wa lugha ya utumwa katika Kiebrania. Muundo huu una nguvu ya kusisitiza cheo cha chini kabisa cha utumwa.
- source_word: יִהְיֶה
  choice: atakuwa
  rationale: Kauli ya wakati ujao inaonyesha matokeo yatakayotokea ndani ya tamko la laana.
- source_word: לְאֶחָיו
  choice: kwa ndugu zake
  rationale: Hufuata kihusishi לְ pamoja na wingi wenye kiambishi cha nafsi ya tatu ya kiume, na huhifadhi maana halisi ya ‘ndugu zake’ bila kuibadili kuwa neno pana zaidi la ukoo.
theological_decisions:
- issue: Anayelengwa na laana ya Nuhu
  choice: Kanaani ndiye anayetajwa kuwa amelaaniwa.
  alternative: Kumfanya Hamu kuwa mlengwa wa moja kwa moja wa laana.
  rationale: Kiebrania kinamtaja Kanaani waziwazi, si Hamu; tafsiri haipaswi kuhamisha laana kwa sababu ya mapokeo ya ufafanuzi.
- issue: Lugha ya utumwa
  choice: mtumwa wa watumwa
  alternative: mtumishi wa watumishi; mtumwa wa hali ya chini kabisa
  rationale: ‘Mtumwa’ huonyesha hali ya kutiishwa kwa nguvu inayokusudiwa katika muktadha huu, na urudiaji huhifadhi nahau kali ya Kiebrania badala ya kuifafanua moja kwa moja ndani ya mstari.
- issue: Nguvu ya אָרוּר
  choice: amelaaniwa
  alternative: na alaaniwe
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa na kinaweza kusikika kama tamko la hali au fomula ya laana. Matini kuu inatumia tamko la hali, huku kutolifanya kuwa amri kukiepuka kulazimisha sintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tamko la kale lakini kinachoeleweka kwa msomaji wa sasa. Muundo wa Kiebrania ‘mtumwa wa watumwa’ umehifadhiwa kwa makusudi na kufafanuliwa katika tanbihi.
