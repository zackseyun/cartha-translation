base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: sw
  text: 'na kila kiumbe hai[a] kilicho pamoja nanyi: ndege, mifugo, na kila mnyama wa porini aliye pamoja nanyi—kutoka kwa wote waliotoka katika safina—kila mnyama wa porini duniani.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “kila nafsi hai”; katika muktadha huu maana yake ni kila kiumbe chenye uhai.
    reason: lexical_alternative
  - marker: b
    text: 'Mwisho wa sentensi ni mgumu katika Kiebrania. Kwa tafsiri rasmi zaidi: “kutoka kwa wote waliotoka katika safina, kwa kila mnyama wa porini duniani.” Huenda pia maneno ya mwisho yanarudia na kusisitiza upeo wa wanyama wanaohusika.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: kila kiumbe hai
  rationale: Katika muktadha huu kirai hiki kinahusu viumbe wenye uhai, hasa wanyama. “Kiumbe hai” ni Kiswahili cha kawaida na hakileti wazo finyu la “nafsi” pekee.
- source_word: בָּעוֹף
  choice: ndege
  rationale: Ingawa עוֹף inaweza kujumuisha viumbe warukao kwa upana, “ndege” ndilo neno la kawaida na linafaa katika orodha hii.
- source_word: בַּבְּהֵמָה
  choice: mifugo
  rationale: Neno hili hapa linatofautisha wanyama wanaofugwa na wanyama wa porini; “mifugo” ni wazi na la kisasa.
- source_word: חַיַּת הָאָרֶץ
  choice: mnyama wa porini duniani
  rationale: Kirai hiki kinarejelea wanyama wa nchi kavu wasio mifugo. “Mnyama wa porini” huhifadhi tofauti hiyo kuliko neno pana “mnyama” pekee.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: kutoka kwa wote waliotoka katika safina
  rationale: Tafsiri hii inahifadhi kihusishi מִן na umbo la wingi la wale waliotoka, bila kugeuza kirai hicho kimya kimya kuwa maelezo ya kufafanua.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: hadi kwa kila mnyama wa porini duniani
  rationale: Kihusishi לְ־ na tamati inayojirudia ni ngumu kisintaksia. “Hadi kwa” kinaonyesha upeo unaoendelea huku tanbihi ikihifadhi tafsiri rasmi zaidi.
theological_decisions:
- issue: Upeo na sintaksia ya wanyama wanaoshirikishwa katika agano
  choice: Orodha inajumuisha ndege, mifugo, na wanyama wa porini, huku maneno ya mwisho yakionyesha upeo unaofikia kila mnyama wa porini duniani.
  alternative: Maneno ya mwisho yanaweza kutafsiriwa rasmi zaidi, “kwa kila mnyama wa porini duniani,” au kuchukuliwa kuwa marudio ya kufafanua.
  rationale: Kiebrania ni kifupi, chenye marudio, na kina sintaksia ngumu. Tafsiri kuu inalenga Kiswahili kinachoeleweka bila kuficha ugumu huo, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Safina,” “mifugo,” na “wanyama wa porini” ni maneno yanayoeleweka kwa urahisi; alama ya mkato mrefu inasaidia kutenganisha orodha na kifungu kigumu cha mwisho.
