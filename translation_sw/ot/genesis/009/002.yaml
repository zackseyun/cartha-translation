base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: sw
  text: Hofu yenu na kitisho chenu vitakuwa juu ya kila mnyama wa nchi, juu ya kila ndege wa angani[b], juu ya kila kitu kitambaacho ardhini, na juu ya samaki wote wa baharini[a]; wamewekwa mikononi mwenu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “samaki wote wa bahari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mbingu”; hapa pia inaweza kutafsiriwa “anga.”'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “wamepewa mikononi mwenu,” usemi unaomaanisha kuwekwa chini ya uwezo au mamlaka yenu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: watawaogopa na kuwahofu
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kuwa wanadamu ndio wanaoogopwa na kuhofiwa. Vitenzi viwili vinadumisha msisitizo wa jozi ya Kiebrania bila kutumia nomino ambazo zingekuwa tata au zisizo za kawaida katika Kiswahili.
- source_word: כָּל חַיַּת הָאָרֶץ
  choice: wanyama wote wa nchi
  rationale: Katika muktadha huu חַיָּה inarejelea kwa ujumla wanyama wa nchi kavu. Neno 'wanyama' halibani maana kwa wanyama wa porini pekee.
- source_word: כָּל עוֹף הַשָּׁמָיִם
  choice: ndege wote wa angani
  rationale: עוֹף hapa imetafsiriwa kwa neno la kawaida 'ndege,' na הַשָּׁמָיִם kwa 'angani,' usemi wa asili wa Kiswahili kwa eneo wanamoruka ndege.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: kila kiumbe kitambaacho ardhini
  rationale: רמשׂ huonyesha kusogea kwa kutambaa au kwa mwendo wa chini. 'Ardhini' linatofautisha אֲדָמָה na 'nchi' iliyotumiwa kwa אֶרֶץ mapema katika aya.
- source_word: בְכָל דְּגֵי הַיָּם
  choice: samaki wote wa baharini
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya fungu hili, ikidumisha upeo wake wa kijumla.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: wametiwa mikononi mwenu
  rationale: Usemi huu unadumisha sitiari ya Kiebrania ya kutiwa mkononi mwa mtu, huku ukieleweka kwa kawaida kuwa wamewekwa chini ya mamlaka au uwezo wake. Kauli tendwa pia imehifadhiwa.
theological_decisions:
- issue: Mamlaka ya wanadamu juu ya wanyama baada ya gharika
  choice: Kudumisha sitiari ya kutiwa mikononi mwa wanadamu bila kuipanua kuwa tamko pana la kimafundisho
  alternative: Kutafsiri moja kwa moja zaidi kuwa 'wametiishwa chini ya mamlaka yenu' au kupunguza wazo la mamlaka
  rationale: Fungu la Kiebrania linaonyesha wazi hofu ya wanyama na kuwekwa kwao chini ya uwezo wa wanadamu, lakini halifafanui hapa mipaka yote ya mamlaka hiyo. Tafsiri inadumisha mvutano huo bila kuongeza mfumo wa baadaye wa kimaadili au kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi imepangwa upya kwa kiasi ili uhusiano wa kisarufi uwe wazi katika Kiswahili, huku jozi ya 'kuogopa' na 'kuhofu,' orodha ya viumbe, kauli tendwa, na sitiari ya mkono vikihifadhiwa.
