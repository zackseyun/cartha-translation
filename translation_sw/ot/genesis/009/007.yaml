  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: sw
  text: Nanyi, zaeni, mkaongezeke; jaeni tele duniani[a], mkaongezeke humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jaaeni duniani.” Kitenzi cha Kiebrania kinaonyesha kuzaana na kuwa wengi sana, kama viumbe wanaojaa mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Nanyi
  rationale: Kiunganishi pamoja na kiwakilishi huru cha wingi huleta msisitizo na kurejelea kundi linalosemewa. “Nanyi” ni ya kawaida na huhifadhi mkazo huo bila kuongeza utofautishaji mkali usio lazima.
- source_word: פְּרוּ
  choice: zaeni
  rationale: Katika muktadha wa baraka-agizo, kitenzi hiki kinahusu kuzaa na kuwa na uzao; “zaeni” ni wazi na cha kawaida kwa Kiswahili.
- source_word: וּרְבוּ
  choice: mkaongezeke / kuongezeka
  rationale: Kitenzi kinamaanisha kuongezeka kwa idadi. Marudio yake yamehifadhiwa ili kudumisha msisitizo na ulinganifu wa Kiebrania.
- source_word: שִׁרְצוּ
  choice: jaeni tele
  rationale: Kitenzi kina picha yenye nguvu ya viumbe kuwa wengi sana au kusongamana kwa wingi. “Jaeni tele” huwasilisha wingi mkubwa kwa lugha ya asili bila kuwafananisha wanadamu moja kwa moja na wadudu.
- source_word: בָאָרֶץ
  choice: duniani
  rationale: Katika muktadha wa baada ya gharika, אֶרֶץ inaelekea kumaanisha dunia kama mahali pa wanadamu kuongezeka, si eneo dogo tu.
- source_word: וּרְבוּ בָהּ
  choice: na kuongezeka humo
  rationale: “Humo” humrejelea ‘dunia’ kwa kawaida, huku marudio ya wazo la kuongezeka yakihifadhiwa.
theological_decisions:
- issue: Uhusiano wa mstari huu na agizo la uumbaji pamoja na baraka ya baada ya gharika
  choice: Kutafsiri kama baraka-agizo lililorejeshwa kwa Noa na wanawe, bila kuongeza ufafanuzi wa kiteolojia ndani ya mstari.
  alternative: Kuueleza kama marudio tu ya Mwanzo 1:28, au kuongeza maneno yanayoufanya kuwa fomula ya kiagano pekee.
  rationale: Lugha ya Kiebrania ina miangwi ya Mwanzo 1:28, lakini tafsiri inapaswa kuhifadhi miangwi hiyo bila kuamua zaidi ya maneno yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri na marudio ya ‘kuongezeka’ umehifadhiwa; “jaeni tele” linadumisha nguvu ya picha ya Kiebrania kwa namna ya kawaida katika Kiswahili.
