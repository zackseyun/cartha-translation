  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: sw
  text: Na hakika nitaitaka damu yenu kwa ajili ya uhai wenu. Kutoka mkononi mwa kila mnyama nitaitaka, na kutoka mkononi mwa mwanadamu—kutoka mkononi mwa ndugu yake—nitautaka uhai wa mwanadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַךְ
  choice: Na hakika
  rationale: Inahifadhi kiunganishi וְ pamoja na msisitizo wa אַךְ kwa Kiswahili cha sasa chenye hadhi.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: damu yenu kwa ajili ya uhai wenu
  rationale: Inatenganisha maneno ya Kiebrania ya ‘damu’ na ‘uhai’ bila kuyachanganya kuwa neno moja, huku ikihifadhi uhusiano wao katika muktadha.
- source_word: אֶדְרֹשׁ / אֶדְרְשֶׁנּוּ
  choice: nitaitaka / nitautaka
  rationale: ‘Kudai/ kutaka’ katika muktadha huu kuna maana ya Mungu kudai hesabu kwa damu iliyomwagwa; viambishi vya Kiswahili vinapatanishwa na ‘damu’ na ‘uhai.’
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Inahifadhi taswira ya mkono na marudio ya nahau ya Kiebrania, inayodokeza mhusika anayewajibika.
- source_word: כָּל חַיָּה
  choice: kila mnyama
  rationale: ‘Mnyama’ ni neno la kawaida na sahihi, na linaendeleza tofauti ya muktadha kati ya mnyama na mwanadamu.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: Neno hili linafaa kwa matumizi wakilishi ya אָדָם na kwa tofauti kati ya binadamu na mnyama bila kulazimisha jinsia ya kiume.
- source_word: אִישׁ אָחִיו
  choice: kila mtu aliye ndugu yake
  rationale: Linahifadhi maana ya mgawanyo ya אִישׁ na lugha halisi ya undugu ya אָחִיו, ingawa rejeo la ‘yake’ hubaki na ufinyu unaofanana na muundo wa Kiebrania.
- source_word: נֶפֶשׁ הָאָדָם
  choice: uhai wa mwanadamu
  rationale: נֶפֶשׁ hapa ni uhai unaohusishwa na damu, si dai mahsusi kuhusu nafsi isiyo ya kimwili.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa kumwaga damu
  choice: uhai
  alternative: nafsi
  rationale: Muktadha wa karibu unaunganisha damu na kupotezwa kwa uhai; ‘nafsi’ ingeweza kuingiza dai la kimetafizikia lisilosisitizwa hapa.
- issue: Maana ya kiuhukumu ya דרשׁ
  choice: nitaitaka / nitautaka
  alternative: nitadai hesabu yake
  rationale: Tafsiri kuu inahifadhi usemi mfupi wa chanzo, huku maana ya kudai uwajibikaji ikitokana na muktadha bila kuongezwa moja kwa moja.
- issue: Uhusiano wa מִיַּד הָאָדָם na מִיַּד אִישׁ אָחִיו
  choice: kishazi cha pili kinafafanua cha kwanza kwa vistari virefu
  alternative: kuvitenganisha kuwa sentensi mbili
  rationale: Muundo huu unahifadhi uwezekano mkubwa kwamba ‘kutoka mkononi mwa kila mtu aliye ndugu yake’ linafafanua uwajibikaji wa mwanadamu, bila kuvunja kishazi kimoja cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘kutoka mkononi mwa’ na ‘nitaitaka/nitautaka’ yamehifadhiwa kwa sababu ni sehemu ya msisitizo na muundo wa kiuhukumu wa Kiebrania. Hakuna tanbihi iliyohitajika; kwa hiyo hakuna alama ya tanbihi katika matini.
