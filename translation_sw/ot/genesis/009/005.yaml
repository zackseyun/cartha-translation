  to: Na hakika nitaitaka damu yenu kwa ajili ya uhai wenu. Kutoka mkononi mwa kila mnyama nitaitaka, na kutoka mkononi mwa mwanadamu—kutoka mkononi mwa ndugu yake—nitautaka uhai wa mwanadamu.
