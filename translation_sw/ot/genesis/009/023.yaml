  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: sw
  text: Ndipo Shemu na Yafethi wakalichukua vazi[a], wakaliweka juu ya mabega yao, ya wote wawili; wakaenda kwa kurudi nyuma na kuufunika uchi wa baba yao. Nyuso zao zilikuwa zimeelekezwa nyuma, hivyo hawakuona uchi wa baba yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “joho.” Neno la Kiebrania linamaanisha vazi la nje lililotumiwa hapa kumfunika Nuhu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: wakalichukua
  rationale: Kitenzi לקח katika mfululizo wa masimulizi kina maana ya kawaida ya ‘kuchukua’; kiambishi cha ngeli kinaelekezwa kwa ‘vazi.’
- source_word: שֵׁם וָיֶפֶת
  choice: Shemu na Yafethi
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia na yanaendana na matamshi ya Kiebrania.
- source_word: הַשִּׂמְלָה
  choice: vazi
  rationale: שׂמלה ni vazi, hasa vazi la nje; ‘vazi’ halibainishi kupita kiasi aina yake na ni neno la kawaida lenye hadhi.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: wakaliweka juu ya mabega yao wote wawili
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la Kiebrania la kuliweka vazi begani mwa wote wawili ili walibebe pamoja.
- source_word: אֲחֹרַנִּית
  choice: kinyumenyume / nyuma
  rationale: Katika tukio la kwanza ‘kinyumenyume’ huonyesha mwendo wa kurudi nyuma; katika la pili ‘nyuma’ huonyesha mwelekeo wa nyuso, huku urudiaji wa wazo ukihifadhiwa kwa njia ya asili katika Kiswahili.
- source_word: וַיְכַסּוּ
  choice: kuufunika
  rationale: כסה hapa ni kufunika; kiambishi ‘u-’ kinarejelea ‘uchi.’
- source_word: עֶרְוַת אֲבִיהֶם
  choice: uchi wa baba yao
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kishazi hicho, ikihifadhi maana ya kufunuliwa kwa mwili pamoja na hisia ya aibu bila kuongeza fasiri ya kingono.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: Nyuso zao zilielekea nyuma
  rationale: Kiebrania hakina kitenzi wazi katika kishazi hiki; ‘zilielekea’ hukamilisha sentensi kwa Kiswahili bila kuongeza wazo jipya.
- source_word: לֹא רָאוּ
  choice: hawakuuona
  rationale: Ni tafsiri sahili ya ukanushi wa ראה, ‘hawakuona,’ ikiwa na kiambishi kinachorejelea uchi.
theological_decisions:
- issue: Maana ya ‘uchi wa baba yao’ katika mstari huu
  choice: Kufunuliwa halisi kwa mwili wa Nuhu, ambako Shemu na Yafethi wanakufunika kwa heshima
  alternative: Maana ya kitamathali ya kingono kama inayopatikana katika baadhi ya matumizi ya baadaye ya kibiblia
  rationale: Muktadha wa karibu unaeleza vazi, kutembea kinyumenyume, kufunika, na kutouona uchi. Kwa hiyo tafsiri inadumisha maneno halisi ya Kiebrania bila kuingiza maana maalumu ya kingono, huku ikiacha msomaji atambue mvutano wowote mpana wa kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa ‘waka-’ umehifadhi mwendo wa simulizi; maneno ‘uchi wa baba yao’ yanahifadhi urudiaji na uzito wa Kiebrania.
