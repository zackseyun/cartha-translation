id: GEN.9.13
reference: Genesis 9:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: sw
  text: Upinde wangu nimeuweka katika wingu[a], nao utakuwa ishara ya agano kati yangu na dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upinde wangu wa mvua.” Kiebrania kinasema kihalisi “upinde wangu,” kikitumia neno la kawaida la upinde; katika muktadha huu linarejelea upinde wa mvua ulio katika wingu.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: upinde wangu
  rationale: קֶשֶׁת ni neno la kawaida linalomaanisha upinde, hasa silaha. Katika muktadha huu, upinde ulio katika wingu unarejelea upinde wa mvua. Tafsiri kuu inadumisha taswira halisi ya Kiebrania, huku tanbihi ikifafanua maana yake katika muktadha.
- source_word: נָתַתִּי
  choice: nimeuweka
  rationale: Kitenzi נתן kinaweza kumaanisha kutoa, kuweka, au kusimamisha. Hapa ‘nimeuweka’ kinaeleza kwa kawaida tendo la Mungu la kuuweka upinde katika wingu na kinadumisha athari ya tendo hilo kwa wakati wa sasa.
- source_word: בֶּעָנָן
  choice: katika wingu
  rationale: Nomino ya Kiebrania iko katika umoja. ‘Katika wingu’ ni tafsiri ya moja kwa moja na ya kawaida kwa Kiswahili bila kuibadili kuwa wingi.
- source_word: וְהָיְתָה
  choice: nao utakuwa
  rationale: 'Katika muktadha huu umbo la kitenzi linaonyesha matokeo au kazi ya wakati ujao: upinde huo utatumika kama ishara. Kiambishi ‘-o’ kinarejelea wazi ‘upinde.’'
- source_word: לְאוֹת
  choice: ishara
  rationale: אוֹת humaanisha ishara au alama. ‘Ishara’ ni neno la kawaida na lenye hadhi linalofaa kwa alama ya agano.
- source_word: בְּרִית
  choice: agano
  rationale: ‘Agano’ ni istilahi ya kawaida ya Kiswahili kwa בְּרִית na hapa linajulikana kutokana na muktadha wa karibu.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: kati yangu na dunia
  rationale: אֶרֶץ inaweza kumaanisha nchi au dunia. Kwa kuwa simulizi la gharika na agano hili lina upeo wa ulimwengu mzima, ‘dunia’ linafaa zaidi kuliko ‘nchi.’
theological_decisions:
- issue: Kitu kinachorejelewa na קַשְׁתִּי katika muktadha wa agano
  choice: ‘Upinde’ limedumishwa katika matini kuu, likieleweka katika muktadha kuwa upinde wa mvua
  alternative: ‘Upinde wangu wa mvua’ katika matini kuu
  rationale: Kiebrania kinatumia neno la kawaida la ‘upinde,’ ambalo pia hutumiwa kwa silaha. Kudumisha ‘upinde’ kunahifadhi taswira na uwezekano wa maana unaopatikana katika lugha chanzi; tanbihi inamwezesha msomaji kutambua wazi kuwa katika muktadha huu ni upinde wa mvua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ‘Upinde wangu nimeuweka’ unadumisha mkazo wa sentensi ya Kiebrania bila kufanya Kiswahili kisiwe cha kawaida. ‘Nao’ linaunganisha vipashio kwa uwazi na mtiririko mzuri.
