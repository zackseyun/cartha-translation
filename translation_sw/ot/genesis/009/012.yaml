  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: sw
  text: Mungu akasema, “Hii ndiyo ishara ya agano ninalolitoa kati yangu nanyi na kila kiumbe hai kilicho pamoja nanyi, kwa vizazi vyote vijavyo[a]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vizazi vya milele” au “katika vizazi vyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ka- ya masimulizi inaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida bila kusisitiza kupita kiasi wakati.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa Mungu anayesema na Noa katika muktadha huu.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Hii ndiyo ishara ya agano
  rationale: Muundo huu unatambulisha ishara inayofafanuliwa baadaye; “ishara” na “agano” ni maneno ya kawaida, wazi, na yanayofaa muktadha.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: ninaloweka
  rationale: Kitenzi נֹתֵן kwa msingi ni “kutoa,” lakini katika Kiswahili “kuweka ishara ya agano” ni ya asili zaidi na bado huhifadhi wazo la Mungu kuiwasilisha au kuiweka ishara hiyo.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: kati yangu nanyi na
  rationale: Huhifadhi wahusika wote wa uhusiano wa agano kwa muundo wa Kiswahili unaosomeka kwa urahisi.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: kila kiumbe hai
  rationale: Katika muktadha huu kirai kinajumuisha wanyama; “kiumbe hai” huepuka maana finyu ya kibinadamu ambayo “nafsi” ingeweza kudokeza.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: kilicho pamoja nanyi
  rationale: Hutafsiri wazi kishazi cha uhusiano kinachovitambulisha viumbe vilivyo pamoja na Noa na walio naye.
- source_word: לְדֹרֹת עוֹלָם
  choice: kwa vizazi vyote vijavyo
  rationale: Hutoa kwa Kiswahili cha sasa wazo la mwendelezo usio na kikomo unaoelezwa na דֹרֹת pamoja na עוֹלָם.
theological_decisions:
- issue: Kitenzi נֹתֵן katika usemi wa ishara ya agano
  choice: ninaloweka
  alternative: ninayotoa
  rationale: “Ninaloweka” ni usemi wa asili wa Kiswahili kwa kuwekwa kwa ishara, huku “ninayotoa” likibaki tafsiri ya karibu zaidi ya umbo la Kiebrania. Chaguo hili haliongezi fundisho kuhusu namna agano linavyoanzishwa.
- issue: Upeo wa נֶפֶשׁ חַיָּה
  choice: kila kiumbe hai
  alternative: kila nafsi hai
  rationale: Muktadha wa agano la baada ya gharika unajumuisha wanyama. “Kiumbe hai” huhifadhi upeo huo bila kuingiza dhana maalumu kuhusu nafsi ya mwanadamu.
- issue: Nguvu ya עוֹלָם katika לְדֹרֹת עוֹלָם
  choice: kwa vizazi vyote vijavyo
  alternative: kwa vizazi vya milele
  rationale: Chaguo kuu linaonyesha mwendelezo katika vizazi bila kulazimisha usemi usio wa kawaida; tanbihi huhifadhi uwezekano wa tafsiri rasmi zaidi ya “milele.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi la Biblia lakini unaeleweka kwa msomaji wa kawaida; “nanyi” limetumiwa kwa ufupi na heshima, na tashihisi ya jinsia ya kisarufi imefuata “kiumbe.”
