base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: sw
  text: Nami nitalikumbuka agano langu lililo kati yangu na ninyi, na kila kiumbe hai chenye mwili; wala maji hayatakuwa tena gharika ya kuangamiza viumbe vyote vyenye mwili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “wote wenye mwili.” Kiebrania: “mwili wote”; usemi huu unajumuisha viumbe hai wote, si wanadamu pekee.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Nami nitalikumbuka
  rationale: Kitenzi cha Kiebrania kimehifadhiwa kwa maana yake ya moja kwa moja ya kukumbuka, huku wakati ujao ukifaa katika hotuba hii ya Mungu.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: “Agano” ni neno la kawaida na lenye uzito unaofaa kwa uhusiano rasmi na ahadi inayotajwa hapa.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: kila kiumbe hai miongoni mwa viumbe vyote vyenye mwili
  rationale: “Kiumbe hai” huonyesha uhai wenye nafsi katika muktadha huu, na kishazi kinachofuata kinaonyesha kundi pana la viumbe vyenye mwili bila kukihusisha na wanadamu peke yao.
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: wala maji hayatakuwa tena gharika
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi wazo kwamba maji hayatakuwa tena gharika.
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: ya kuangamiza viumbe vyote vyenye mwili
  rationale: “Kuangamiza” lina uzito wa kitenzi cha Kiebrania; “viumbe vyote vyenye mwili” huhifadhi upeo unaojumuisha wanadamu na wanyama.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kuwa anakumbuka
  choice: Nami nitalikumbuka
  alternative: Nami nitalitekeleza agano langu / nitaliweka akilini
  rationale: Chanzo kinasema wazi “nitakumbuka.” Tafsiri haiifafanui kimafundisho wala kuondoa mvutano wa lugha hiyo ya agano.
- issue: Upeo wa כָּל־בָּשָׂר
  choice: viumbe vyote vyenye mwili
  alternative: wote wenye mwili / viumbe vyote hai
  rationale: Upeo unajumuisha wanadamu na wanyama; “viumbe” huzuia kauli isieleweke kuwa ya wanadamu pekee, huku “vyenye mwili” ikihifadhi taswira ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Nami” na “wala” huunganisha sentensi kwa mtiririko wa hotuba ya Mungu. “Viumbe vyote vyenye mwili” limetumiwa ili kuhifadhi upana wa כָּל־בָּשָׂר bila kuifanya kauli iwahusu wanadamu pekee.
