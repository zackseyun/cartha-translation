  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: sw
  text: Nami, tazama, ninaweka agano langu nanyi na uzao wenu[a] baada yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbegu yenu.” Neno la Kiebrania ni nomino ya mkusanyiko inayoweza kumaanisha uzao au wazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Nami
  rationale: Muundo huu unaendeleza usemi huku ukitilia mkazo upande wa Mungu, kwa njia ya asili na yenye ufupi katika Kiswahili.
- source_word: הִנְנִי
  choice: tazama
  rationale: Neno hili linavuta uangalifu kwa msisitizo wa heshima na uzito bila kuligeuza kuwa kauli ya kujitambulisha.
- source_word: מֵקִים
  choice: ninaweka
  rationale: Kitenzi hiki kinaonyesha tendo la kulisimamisha au kulianzisha rasmi agano. ‘Ninaweka’ ni cha kawaida na hakilazimishi maana ya kuthibitisha upya.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: ‘Agano’ ndilo neno la kawaida la Kiswahili kwa בְּרִית katika uhusiano rasmi kati ya Mungu na wanadamu.
- source_word: אִתְּכֶם
  choice: nanyi
  rationale: Huwakilisha kwa ufupi na kwa kawaida uhusiano wa agano ‘pamoja nanyi,’ huku ikidumisha wingi wa kiwakilishi.
- source_word: וְאֶת זַרְעֲכֶם
  choice: na uzao wenu
  rationale: ‘Uzao’ huhifadhi hali ya jina la mkusanyiko la זֶרַע na linaweza kuwahusu watoto au vizazi bila kufafanua zaidi ya chanzo.
- source_word: אַחֲרֵיכֶם
  choice: baada yenu
  rationale: Tafsiri hii ni fupi na ya moja kwa moja, ikionyesha vizazi vinavyofuata.
theological_decisions:
- issue: Istilahi ya agano katika uhusiano kati ya Mungu na wanadamu
  choice: agano langu
  alternative: mapatano yangu
  rationale: ‘Agano’ huhifadhi dhana kuu ya kibiblia ya בְּרִית bila kuifanya kuwa mkataba wa kawaida wa kisekula wala kuongeza fundisho lisilosemwa katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha agano lakini kinachoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya ‘uzao wenu,’ ambako mbadala wa kileksia unahusika.
