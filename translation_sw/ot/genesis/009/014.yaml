  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: sw
  text: Na nitakapoleta mawingu juu ya dunia, upinde[a] utaonekana katika wingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upinde wa mvua.” Kiebrania hutumia neno la kawaida linalomaanisha “upinde”; hapa linarejelea upinde wa mvua, ambao ni ishara ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Na nitakapo-
  rationale: Muundo huu unaanzisha hali ya wakati ujao. Kiswahili hutumia kwa kawaida kiambishi cha wakati “-takapo-” kuonyesha maana ya “na wakati nitakapo…,” bila kulazimisha tafsiri nzito ya neno kwa neno.
- source_word: בְּעַנְנִי
  choice: nitakapoleta
  rationale: Kitenzi ענן katika muundo huu kina maana ya kutanda au kuleta mawingu. “Nitakapoleta” ni Kiswahili cha kawaida na kinaungana vizuri na nomino inayofuata.
- source_word: עָנָן
  choice: mawingu
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, inaweza kuwa na maana ya kijumla. Wingi “mawingu” unasikika kwa kawaida katika Kiswahili katika muktadha wa Mungu kuifunika dunia kwa mawingu.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: “Dunia” inafaa upeo mpana wa agano baada ya gharika, huku “juu ya” ikitoa maana ya mawingu kuwa angani yakitanda dunia.
- source_word: וְנִרְאֲתָה
  choice: utaonekana
  rationale: Nifali ya ראה inaweza kumaanisha “kuonekana” au “kutokea.” “Utaonekana” huhifadhi dhana ya kitu kuweza kuonekana pamoja na mwelekeo wa wakati ujao.
- source_word: הַקֶּשֶׁת
  choice: upinde
  rationale: קשת ni neno la kawaida la Kiebrania kwa upinde. Katika muktadha huu linarejelea upinde wa mvua, lakini “upinde” huhifadhi taswira na utata wa kileksia wa maandishi ya asili.
- source_word: בֶּעָנָן
  choice: katika wingu
  rationale: Umoja wenye kibainishi katika Kiebrania umetafsiriwa kwa umoja, “wingu,” ili kufuata kwa karibu tofauti ya maandishi kati ya matumizi ya kijumla yaliyotangulia na wingu ambamo upinde unaonekana.
theological_decisions:
- issue: Tafsiri ya קשת katika muktadha wa agano na Nuhu
  choice: upinde
  alternative: upinde wa mvua
  rationale: Maandishi yanatumia neno la kawaida kwa upinde, huku muktadha ukionyesha kwamba ni upinde wa mvua, ishara ya agano. Tafsiri kuu huhifadhi taswira ya neno la asili, na tanbihi hufafanua maana yake katika muktadha bila kuondoa mvutano huo wa kileksia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “nitakapo-” huwasilisha kwa ufasaha uhusiano wa wakati; “upinde” huhifadhi taswira ya Kiebrania, huku tanbihi ikitoa ufafanuzi unaohitajika.
