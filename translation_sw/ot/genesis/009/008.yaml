  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: sw
  text: 'Kisha Mungu akawaambia Noa na wanawe waliokuwa pamoja naye, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Kitenzi chenye waw mfululizo kinaendeleza simulizi. “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akamwambia” huwasilisha tendo la kusema kwa mhusika aliyetajwa kwanza.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu mmoja anayesema na Noa; “Mungu” ndiyo tafsiri ya kawaida na iliyo wazi.
- source_word: אֶל־נֹחַ
  choice: Noa
  rationale: Pamoja na kitenzi “akamwambia,” kiambishi cha yambwa huwasilisha maana ya kihusishi אֶל kwa Kiswahili cha asili. Jina נֹחַ limetolewa kwa umbo la kawaida la Kiswahili, “Noa.”
- source_word: וְאֶל־בָּנָיו
  choice: na wanawe
  rationale: Muunganiko huu unaongeza wale walioambiwa pamoja na Noa. בָּנָיו humaanisha wana wa kiume, hivyo “wanawe” ni sahihi kuliko neno la jumla “watoto wake.”
- source_word: אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Kirai hiki kinafafanua kuwa wana wa Noa walikuwa pamoja naye. Umbo la kishazi ni la kawaida na wazi katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki kinatanguliza maneno yanayofuata. “Akisema” kinahifadhi alama hiyo ya usemi badala ya kuiacha, ingawa katika Kiswahili wakati mwingine inaweza kuonekana ya ziada.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na hadhi inayofaa maandiko. Neno “akisema” limehifadhiwa kwa uaminifu kwa muundo wa Kiebrania na kwa kuwa linafungua hotuba ya agano inayofuata.
