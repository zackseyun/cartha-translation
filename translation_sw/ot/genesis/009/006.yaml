  source_fidelity: 'The draft accurately conveys the generic participial subject, the repeated אדם/“mwanadamu,” the passive consequence, the agentive reading of בָּאָדָם, and the grounding clause. However, the possessive in “kwa mfano wake” is referentially ambiguous in Swahili: it can be read as referring to the human being rather than explicitly to God. The Hebrew explicitly says “in the image of God.”'
