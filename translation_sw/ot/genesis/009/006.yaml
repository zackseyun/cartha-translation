base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: sw
  text: Yeyote amwagaye damu ya mwanadamu, damu yake itamwagwa na mwanadamu,[a] kwa maana Mungu alimfanya mwanadamu kwa mfano wa Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania adam, linalorudiwa katika sehemu hii ya mstari, humaanisha mwanadamu kwa ujumla au mtu, si mwanaume pekee.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa mpangilio wa maneno ulio karibu zaidi na Kiebrania: “kwa maana kwa mfano wa Mungu alimfanya mwanadamu.”'
    reason: literal_rendering
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Yeyote amwagaye
  rationale: Kirai cha wakati uliopo kinatumika kama kauli ya jumla. Muundo huu ni wa kawaida katika Kiswahili na unadumisha uzito wa kisheria na wa kimethali.
- source_word: דַּם הָאָדָם
  choice: damu ya mwanadamu
  rationale: ‘Damu’ inadumisha picha ya damu ya uhai na umwagaji damu; ‘mwanadamu’ hapa ni jina la jumla linalomhusu mtu yeyote.
- source_word: בָּאָדָם
  choice: na mwanadamu
  rationale: Herufi ב imeeleweka kwa maana ya mtendaji katika sentensi tendwa. Kiswahili hutumia ‘na’ kumtaja mtendaji, huku urudiaji wa ‘mwanadamu’ ukihifadhiwa.
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: damu yake itamwagwa
  rationale: Muundo tendwa unadumishwa bila kuongeza wazi ikiwa kauli hii ni amri au utabiri, kwa kuwa kitenzi cha Kiebrania chenyewe kinaweza kubeba uzito wa kisheria bila kuufafanua zaidi.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Inaonyesha sababu au msingi wa kauli iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: kwa mfano wake
  rationale: Kiwakilishi kinamrejelea Mungu, ambaye ndiye kiima cha kitenzi. Muundo huu ni wa asili katika Kiswahili na unahifadhi dai kwamba mwanadamu alifanywa kwa mfano wa Mungu.
- source_word: עָשָׂה אֶת הָאָדָם
  choice: alimfanya mwanadamu
  rationale: ‘Alimfanya’ ni tafsiri ya moja kwa moja ya עָשָׂה bila kuingiza kitenzi maalumu cha ‘kuumba’; ‘mwanadamu’ inadumisha urudiaji wa אָדָם.
theological_decisions:
- issue: Maana ya אָדָם katika kauli ya jumla
  choice: mwanadamu
  alternative: mtu / binadamu
  rationale: ‘Mwanadamu’ ni ya kijumla na inawahusu wanadamu wote, si wanaume pekee, huku ikiruhusu urudiaji wa neno lilelile kama katika Kiebrania.
- issue: Ikiwa בָּאָדָם humtaja mtendaji wa hukumu au eneo miongoni mwa wanadamu
  choice: na mwanadamu
  alternative: miongoni mwa wanadamu
  rationale: Maana ya kumtaja mtendaji inafaa zaidi kisarufi na kimuktadha. Tanbihi inataja tafsiri halisi zaidi bila kupanua mstari kuwa fundisho kamili kuhusu namna ya kutekeleza hukumu.
- issue: Namna ya kueleza mfano wa Mungu
  choice: Mungu alimfanya mwanadamu kwa mfano wake
  alternative: kwa mfano wa Mungu alimfanya mwanadamu
  rationale: Muundo uliochaguliwa ni wa asili katika Kiswahili na unadumisha kwamba Mungu ndiye mtendaji na kwamba mfano ni wake, bila kuongeza maelezo ya kitheolojia yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa ‘damu’ na ‘mwanadamu’ umehifadhiwa ili kudumisha usambamba na msisitizo wa Kiebrania.
