  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: sw
  text: Wana wa Noa waliotoka katika safina walikuwa Shemu, Hamu na Yafethi; naye Hamu alikuwa baba yake Kanaani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Kitenzi hiki hapa ni kiunganishi cha wakati uliopita kinachotambulisha wana wa Noa; “walikuwa” ni cha kawaida na hakiongezi wazo la kubadilika hali.
- source_word: בְנֵי נֹחַ
  choice: Wana wa Noa
  rationale: Muundo huu unawakilisha moja kwa moja mnyororo wa umilikaji wa Kiebrania na ni Kiswahili cha asili na chenye heshima.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: waliotoka katika safina
  rationale: Kivumishi-shirikishi chenye kibainishi kinawatambulisha wana kama wale waliotoka kwenye safina. “Kutoka katika” huwasilisha maana ya kuondoka ndani ya kitu.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: Shemu, Hamu na Yafethi
  rationale: Haya ni maumbo ya majina yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: naye Hamu alikuwa baba yake Kanaani
  rationale: “Naye” linaendeleza simulizi huku likitia mkazo wa kiasi kwa Hamu; “alikuwa baba yake Kanaani” huhifadhi wazi uhusiano wa kifamilia wa kishazi cha Kiebrania.
theological_decisions:
- issue: Maelezo ya ukoo kati ya Hamu na Kanaani
  choice: 'Kuhifadhi kishazi wazi katika matini kuu: “naye Hamu alikuwa baba yake Kanaani.”'
  alternative: Kukifanya kishazi hiki kuwa maelezo yasiyopewa uzito au kukiweka katika tanbihi.
  rationale: Kiebrania kinataja wazi uhusiano huu ili kuandaa simulizi linalofuata. Tafsiri haiingizi madai ya baadaye ya kitheolojia au kikabila yasiyosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. “Safina” na maumbo ya majina yametumiwa kwa sababu yanatambulika sana katika mapokeo mapana ya Biblia ya Kiswahili.
