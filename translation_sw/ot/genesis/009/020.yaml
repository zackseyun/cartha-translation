  text: Nuhu, mkulima, alianza[a] kupanda shamba la mizabibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa wa kwanza kupanda shamba la mizabibu.” Maneno ya Kiebrania yamebanwa, na wengine huielewa “alianza” kwa maana ya “alikuwa wa kwanza.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: alianza
  rationale: Kitenzi cha Kiebrania katika muktadha huu kwa kawaida humaanisha ‘alianza’; maana yake inaendelea katika kitenzi kinachofuata, ‘kupanda.’
- source_word: נֹחַ
  choice: Nuhu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אִישׁ הָאֲדָמָה
  choice: mtu wa ardhi
  rationale: Tafsiri hii inadumisha picha ya Kiebrania ya mtu anayehusishwa na ardhi na muktadha wake wa kilimo, bila kuibadili moja kwa moja kuwa jina la kazi kama ‘mkulima.’
- source_word: וַיִּטַּע
  choice: kupanda
  rationale: Hiki ndicho kitenzi cha kawaida cha Kiswahili kwa kupanda mimea; hali ya kitenzi imeunganishwa kiasili na ‘alianza.’
- source_word: כָּרֶם
  choice: shamba la mizabibu
  rationale: Hueleza kwa usahihi eneo lililopandwa mizabibu na ni usemi wa kawaida unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kuelewa mfuatano uliobanwa וַיָּחֶל ... וַיִּטַּע
  choice: alianza kupanda shamba la mizabibu
  alternative: alikuwa wa kwanza kupanda shamba la mizabibu; alianza, akapanda shamba la mizabibu
  rationale: Muundo wa Kiebrania umebanwa. Kuifanya maana ya ‘alianza’ iendelee katika ‘kupanda’ kunatoa Kiswahili cha asili na kufuata mtiririko wa simulizi bila kuongeza dai la wazi kwamba Nuhu ndiye aliyekuwa wa kwanza kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Usemi ‘mtu wa ardhi’ umehifadhiwa kwa ukaribu na chanzo ingawa ‘mkulima’ lingekuwa neno la kawaida zaidi.
