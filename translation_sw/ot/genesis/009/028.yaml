lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi חיה katika usimulizi huu kinaeleza muda ambao Nuhu aliishi baada ya gharika; “aliishi” ni tafsiri ya kawaida na ya moja kwa moja, bila kuingiza msisitizo wa kuokoka.
- source_word: נֹחַ
