  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: sw
  text: Lakini msile nyama pamoja na uhai wake[a], yaani, damu yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ila msile nyama ikiwa na uhai wake—damu yake.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweka “uhai wake” na “damu yake” sambamba kwa kifupi; pia inaweza kutafsiriwa, “uhai wake—damu yake.”
    reason: previous_rendering
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Katika muktadha huu neno hili linaweka kizuizi kwa ruhusa ya kula wanyama katika mstari wa 3; “Lakini” huonyesha utofautishaji huo kwa Kiswahili cha kawaida.
- source_word: בָּשָׂר
  choice: nyama
  rationale: Ingawa neno la Kiebrania linaweza kumaanisha mwili au nyama, hapa linahusu kinacholiwa; “nyama” ni la kawaida na wazi katika Kiswahili.
- source_word: בְּנַפְשׁוֹ
  choice: pamoja na uhai wake
  rationale: נֶפֶשׁ hapa ni uhai unaohuisha kiumbe, si “roho” kwa maana ya baadaye ya kiteolojia. “Pamoja na” linaonyesha hali ya nyama kuwa bado na uhai wake.
- source_word: דָמוֹ
  choice: damu yake
  rationale: Hutafsiri דָם moja kwa moja na kuhifadhi uhusiano wa kifungu kati ya uhai na damu bila kutumia neno la kufasiri kama “damu ya uhai.”
- source_word: בְּנַפְשׁוֹ דָמוֹ
  choice: pamoja na uhai wake, yaani, damu yake
  rationale: Maneno ya Kiebrania yamewekwa kwa ukaribu kwa uhusiano wa ufafanuzi. “Yaani” huufanya uhusiano huo ueleweke kwa Kiswahili huku tanbihi ikihifadhi uwezekano wa kuyasoma kama apposition fupi.
- source_word: לֹא תֹאכֵלוּ
  choice: msile
  rationale: Ni katazo linalowaelekea watu wengi. “Msile” ni muundo sahihi, wa asili, na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Maana ya נֶפֶשׁ kuhusiana na damu
  choice: Imetafsiriwa “uhai,” si “roho”
  alternative: “roho”
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha uhai wa kiumbe unaohusishwa na damu; “roho” ingeweza kuingiza dhana ya kiteolojia ambayo mstari haulazimishi.
- issue: Uhusiano wa “uhai wake” na “damu yake”
  choice: Umeonyeshwa kama ufafanuzi kwa “yaani”
  alternative: 'Kuweka maneno hayo sambamba bila kiunganishi: “uhai wake—damu yake”'
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kama apposition. “Yaani” huleta uwazi wa kawaida wa Kiswahili bila kubadili utambulisho unaodokezwa kati ya uhai na damu; tanbihi huhifadhi muundo mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Msile” ni katazo la wingi lenye mtiririko wa kawaida; “nyama” ni wazi zaidi kuliko “mwili” katika muktadha wa chakula. Alama zote za tanbihi zimewekwa katika matini kuu.
