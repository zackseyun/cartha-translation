base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: sw
  text: Hamu, baba yake Kanaani, akaona uchi wa baba yake[a], akawapa habari ndugu zake wawili waliokuwa nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, Kiebrania husema, “uchi wa baba yake.” Katika baadhi ya sehemu za Agano la Kale, usemi huu unaweza kutumiwa kama nahau ya kingono; hapa tafsiri inadumisha maneno ya moja kwa moja na kuliacha wazi suala hilo la ufafanuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi ראה katika mfululizo wa masimulizi kinamaanisha moja kwa moja ‘akaona’; tafsiri yenye maana nzito zaidi haijawekewa msingi na kitenzi chenyewe.
- source_word: חָם
  choice: Hamu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֲבִי כְנַעַן
  choice: baba yake Kanaani
  rationale: Muundo wa Kiebrania unamtambulisha Hamu kama baba ya Kanaani; Kiswahili asilia hutumia ‘baba yake Kanaani’.
- source_word: עֶרְוַת אָבִיו
  choice: uchi wa baba yake
  rationale: Tafsiri hii inafuata kwa karibu nahau ya Kiebrania bila kuingiza tendo mahususi la kingono ambalo halijaelezwa wazi katika mstari huu.
- source_word: וַיַּגֵּד
  choice: akawaambia
  rationale: Kitenzi נגד katika Hifili humaanisha kusema, kueleza, au kutoa habari; ‘akawaambia’ ni usemi wa kawaida wa masimulizi na unaonyesha walengwa waliotajwa.
- source_word: לִשְׁנֵי אֶחָיו
  choice: ndugu zake wawili
  rationale: Kirai kinataja wazi idadi ya ndugu wawili; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: בַּחוּץ
  choice: waliokuwa nje
  rationale: Neno linamaanisha ‘nje’ na linaelekea kutofautisha mahali walipokuwa ndugu na mahali alipokuwa Noa; kirai hiki huunganika kwa kawaida na sentensi ya Kiswahili.
theological_decisions:
- issue: Maana ya ‘uchi wa baba yake’ katika simulizi hili
  choice: Kirai kimetafsiriwa kihalisi kama ‘uchi wa baba yake,’ bila kubainisha tendo la kingono zaidi ya Hamu kumwona baba yake akiwa uchi.
  alternative: Kukitafsiri kama nahau inayodokeza kosa zito zaidi la kingono, au kama sitiari inayohusishwa na kujamiiana na mama kwa kuzingatia matumizi ya baadaye ya kisheria.
  rationale: Katika baadhi ya vifungu vya Agano la Kale, kirai hiki kinaweza kuwa na maana pana ya kingono. Hata hivyo, mstari huu unasema Hamu ‘akaona’ kisha akawaambia ndugu zake, na muktadha wa karibu unahusu hali ya Noa kufunuliwa. Tafsiri ya moja kwa moja pamoja na tanbihi inahifadhi mvutano wa kiufafanuzi bila kuutatua kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Mfuatano wa ‘akaona ... kisha akawaambia’ ni wa kawaida katika simulizi la kisasa. Tanbihi inawekwa baada ya kirai husika ili alama [a] katika matini ilingane na maelezo yake.
