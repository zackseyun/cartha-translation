  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: sw
  text: Hawa watatu walikuwa wana wa Noa, na kutoka kwa hawa, dunia yote ikakaliwa na watu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya karibu zaidi, “watu wa dunia yote wakatawanyika” au “wakasambaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: Hao watatu
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi msisitizo wa kiashiria cha Kiebrania kilichotangulizwa.
- source_word: בְּנֵי נֹחַ
  choice: walikuwa wana wa Noa
  rationale: Kiebrania hakina kitenzi bayana; “walikuwa” kinakamilisha sentensi kwa Kiswahili cha masimulizi, na “wana wa Noa” linawakilisha moja kwa moja fungu la uhusiano.
- source_word: וּמֵאֵלֶּה
  choice: na kutokana nao
  rationale: Hili linaonyesha kwamba watu wa dunia walitokana na hao wana watatu, huku “nao” likirejelea wazi waliotajwa.
- source_word: נָפְצָה
  choice: ilijaa watu
  rationale: Mzizi huu unaweza kumaanisha kutawanyika au kusambaa. Katika muktadha wa nasaba baada ya gharika, “ilijaa watu” linaeleza kwa Kiswahili cha kawaida matokeo ya kusambaa kwa wazao, bila kuficha maana halisi zaidi, ambayo imehifadhiwa katika tanbihi.
- source_word: כָל הָאָרֶץ
  choice: dunia yote
  rationale: Ingawa אֶרֶץ pia inaweza kumaanisha nchi au ardhi, muktadha wa ulimwengu baada ya gharika unaunga mkono maana pana ya “dunia yote.”
theological_decisions:
- issue: Upeo wa הָאָרֶץ katika muktadha wa mataifa baada ya gharika
  choice: dunia yote
  alternative: nchi yote; ardhi yote
  rationale: Aya hii ni muhtasari wa kuenea kwa wanadamu baada ya gharika, kwa hiyo maana ya ulimwengu mzima inafaa zaidi kuliko eneo moja tu; huu ni uamuzi wa kimuktadha na kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ilijaa watu” ni usemi unaoeleweka kwa urahisi, huku tanbihi ikihifadhi taswira na utata wa kitenzi cha Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja.
