lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: zilikuwa
  rationale: Kitenzi hiki kinatoa muhtasari wa jumla ya muda wa maisha; “zilikuwa” ni Kiswahili cha kawaida na kinapatana na kiima “siku zote.”
- source_word: כָּל יְמֵי נֹחַ
  choice: siku zote za Noa
  rationale: Uamuzi huu unahifadhi nahau ya Kiebrania na mtindo wa kifomula wa taarifa za umri katika Mwanzo, huku maana ya kipindi chote cha maisha ikibaki wazi.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: miaka mia tisa na hamsini
  rationale: Hii ni namna ya asili ya kutaja jumla hiyo kwa Kiswahili, huku kiunganishi cha sehemu mbili za namba katika Kiebrania kikihifadhiwa.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: “Naye” humrejelea Noa kwa uwazi na “akafa” huhifadhi mfuatano na hitimisho fupi la taarifa ya Kiebrania.
