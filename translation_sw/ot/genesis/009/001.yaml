  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: sw
  text: Mungu akambariki Noa na wanawe, akawaambia, “Zaeni, mkaongezeke, mkaijaze dunia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: akambariki
  rationale: Kauli hii ya Kiebrania inaonyesha Mungu akitoa baraka, si kusema mema tu; ‘akambariki’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika simulizi hili neno hili linamtaja Mungu mmoja wa kweli.
- source_word: נֹחַ
  choice: Noa
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Kiebrania kinawataja wana wa kiume wa Noa hasa, wala si watoto kwa ujumla.
- source_word: וַיֹּאמֶר לָהֶם
  choice: akawaambia
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi utangulizi wa maneno ya Mungu bila kuongeza nguvu isiyokuwamo katika chanzo.
- source_word: פְּרוּ
  choice: Zaeni
  rationale: Katika muktadha wa wanadamu, ‘zaeni’ hueleza wazi kuzaa watoto na kuhifadhi mwangwi wa agizo la Mwanzo 1:28 kwa lugha ya kawaida.
- source_word: וּרְבוּ
  choice: mkaongezeke
  rationale: Huwasilisha ongezeko la idadi ya watu kwa Kiswahili cha asili, bila kulifanya kuwa tendo la kihisabati.
- source_word: וּמִלְאוּ
  choice: na kuijaza
  rationale: Kitenzi kinamaanisha kujaza; hakihitaji dhana iliyoongezwa ya kujaza tena.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Baada ya gharika, muktadha wa ulimwengu mzima na mwangwi wa Mwanzo 1:28 unaunga mkono ‘dunia’ kuliko ‘nchi’.
theological_decisions:
- issue: Uhusiano na agizo la uumbaji katika Mwanzo 1:28
  choice: Kuhifadhi mfuatano wa baraka na maagizo ‘Zaeni, mkaongezeke na kuijaza dunia.’
  alternative: ‘Pata watoto wengi na kuenea duniani.’
  rationale: Muundo wa Kiebrania unarudia kwa makusudi lugha ya baraka ya uumbaji. Tafsiri iliyochaguliwa inadumisha mwangwi huo na mwendelezo wa wanadamu baada ya gharika bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘mkaongezeke’ unaunganisha kwa asili maagizo yanayofuatana.
