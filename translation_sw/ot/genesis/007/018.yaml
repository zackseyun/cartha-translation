  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֛יִם וַ/יִּרְבּ֥וּ מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/תֵּ֥לֶךְ הַ/תֵּבָ֖ה עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: sw
  text: Maji yakazidi kuwa na nguvu na yakaongezeka sana juu ya dunia, nayo safina ikasonga juu ya uso wa maji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “safina ikaelea juu ya maji.” Kiebrania kinasema kihalisi “ikaenda juu ya uso wa maji,” usemi unaoonyesha kusonga juu ya maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: yakazidi kuwa na nguvu
  rationale: Kitenzi גבר kinaonyesha maji kuwa yenye nguvu au kushinda. Kauli hii ya Kiswahili inahifadhi wazo la nguvu inayoongezeka bila kulifanya kuwa kupanda kwa kina tu.
- source_word: הַמַּיִם
  choice: Maji
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, katika Kiswahili sanifu ‘maji’ ndilo jina la kawaida la wingi na linafaa katika simulizi la gharika.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: yakaongezeka sana
  rationale: רבה pamoja na מְאֹד husisitiza ongezeko kubwa; tafsiri hii ni ya kawaida na wazi kwa msomaji wa Kiswahili.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: אָרֶץ linaweza kumaanisha ‘dunia’ au ‘nchi.’ ‘Dunia’ linaendana na upeo wa simulizi hili, huku utata wa jumla wa neno ukibaki kutegemea muktadha.
- source_word: וַתֵּלֶךְ
  choice: ikasonga
  rationale: הלך kimsingi ni ‘kwenda’; safina ikiwa juu ya maji, ‘ikasonga’ huonyesha mwendo bila kubainisha kupita kiasi ikiwa ilisukumwa, ilielea, au iliongozwa.
- source_word: הַתֵּבָה
  choice: safina
  rationale: ‘Safina’ ni istilahi iliyozoeleka na inayofaa kwa תבה katika simulizi la Nuhu.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: juu ya uso wa maji
  rationale: Usemi wa Kiebrania ‘juu ya uso wa maji’ unaonyesha sehemu ya juu ya maji; Kiswahili hiki ni wazi na kinadumisha taswira ya maandishi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unahifadhi mfuatano na msisitizo wa vitenzi vya Kiebrania, huku ‘ikasonga’ ikiepuka kufafanua zaidi ya chanzo namna safina ilivyotembea.
