base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: sw
  text: Nuhu alikuwa na umri wa miaka mia sita, na maji ya gharika yalikuwa juu ya dunia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “na gharika ilikuwa maji juu ya dunia.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi” badala ya “dunia.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Nuhu
  rationale: Jina נֹחַ linatolewa kwa umbo lake la Kiswahili lililozoeleka, “Nuhu.” Kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti mwanzoni mwa sentensi katika usimulizi wa kawaida wa Kiswahili.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: alikuwa na umri wa miaka mia sita
  rationale: Hii ni nahau ya Kiebrania inayosema kihalisi ‘mwana wa miaka mia sita.’ Kiswahili cha kawaida hueleza umri kwa ‘alikuwa na umri wa miaka mia sita.’
- source_word: וְ/הַ/מַּבּוּל ... מַיִם
  choice: na maji ya gharika
  rationale: Muundo wa Kiebrania unasema kihalisi kwamba ‘gharika ilikuwa maji.’ Usemi ‘maji ya gharika’ ni wa asili katika Kiswahili na unahifadhi wazi gharika pamoja na maji bila kuongeza wazo la kuja au kufunika.
- source_word: הָיָה
  choice: yalikuwa
  rationale: Kitenzi הָיָה kina maana ya msingi ya ‘kuwa.’ Tafsiri ‘yalikuwa’ huepuka kuongeza maana ya ‘yalikuja’ au ‘yalitokea,’ ambayo haijasemwa wazi katika chanzo.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: עַל ni ‘juu ya’ au ‘kwenye,’ na הָאָרֶץ inaweza kuwa ‘dunia’ au ‘nchi.’ Katika muktadha wa simulizi la gharika, ‘dunia’ inafaa katika maandishi makuu, huku uwezekano wa ‘nchi’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa הָאָרֶץ
  choice: dunia
  alternative: nchi
  rationale: Nomino ya Kiebrania inaweza kumaanisha ‘dunia’ au ‘nchi.’ Muktadha mpana wa simulizi la gharika unaunga mkono ‘dunia,’ lakini utata wa kileksika hauondolewi; ‘nchi’ imetajwa katika tanbihi bila kuamua suala la kitheolojia kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo usio wa kawaida wa Kiebrania umefanywa wa asili kwa kusema “maji ya gharika,” huku tafsiri ya karibu zaidi ikihifadhiwa katika tanbihi.
