base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: sw
  text: Nao wale walioingia[a], dume na jike, kutoka katika kila kiumbe chenye mwili[b], waliingia kama Mungu alivyomwamuru; naye Yahwe akamfungia ndani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaoingia” au “hao waliokuja ndani.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka katika mwili wote”; huu ni usemi wa jumla kuhusu viumbe hai.'
    reason: cultural_note
  - marker: c
    text: Au, “Yahwe akafunga nyuma yake.” Kiebrania hakitaji “mlango” waziwazi, ingawa unadokezwa na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: Nao walioingia ... waliingia
  rationale: Muundo huu unahifadhi kishirikishi chenye kibainishi pamoja na kitenzi kikuu kinachorudiwa katika Kiebrania. Ingawa marudio hayo ni ya kusisitiza, bado yanaeleweka kwa Kiswahili.
- source_word: זָכָר וּנְקֵבָה
  choice: dume na jike
  rationale: Haya ni maneno ya kawaida ya Kiswahili yanayotofautisha jinsia ya wanyama na yanafaa katika muktadha huu.
- source_word: מִכָּל בָּשָׂר
  choice: kutoka miongoni mwa wote wenye mwili
  rationale: Neno בָּשָׂר lina maana halisi ya ‘mwili/nyama’ lakini hapa ni usemi wa jumla kuhusu viumbe hai. ‘Wote wenye mwili’ huhifadhi taswira hiyo bila kuibadili moja kwa moja kuwa ‘kila aina ya wanyama.’
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: kama Mungu alivyomwamuru
  rationale: Kiswahili hiki cha kawaida kinaonyesha kwamba kuingia kwao kulipatana na amri ambayo Mungu alikuwa amempa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּסְגֹּר ... בַּעֲדוֹ
  choice: akamfungia ndani
  rationale: Huu ndio usemi wa kawaida wa Kiswahili unaowasilisha kwamba Yahwe alimfunga Noa akiwa salama ndani, bila kuongeza neno ‘mlango,’ ambalo halitajwi wazi katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יהוה lenyewe; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Anayefanya tendo la mwisho
  choice: Yahwe ndiye anayemfungia ndani
  alternative: Kutaja tu kwamba mlango ulifungwa
  rationale: Kiebrania humtaja Yahwe wazi kuwa mtendaji, jambo linalopaswa kuhifadhiwa bila kupunguza msisitizo wa tendo lake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari mirefu imetenganishwa kwa vistari ili marudio ya muundo wa Kiebrania yasomeke kwa urahisi.
