  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: sw
  text: Baada ya siku saba,[a] maji ya gharika yakawa juu ya dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “Ikawa baada ya siku saba.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi” au “ardhi.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia,” “nchi,” au “ardhi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: Baada ya siku saba
  rationale: Muundo huu unaonyesha kufikiwa kwa wakati baada ya kipindi kilichotajwa. Kiswahili cha kawaida hutumia kwa ufasaha “baada ya siku saba” badala ya tafsiri ya neno kwa neno “ikawa baada ya siku saba.”
- source_word: וּמֵי הַמַּבּוּל
  choice: maji ya gharika
  rationale: מֵי ni hali ya kuambatana ya “maji,” nayo מַבּוּל humaanisha gharika ya simulizi la Noa. “Maji ya gharika” ni wazi, ya asili, na yenye hadhi katika Kiswahili.
- source_word: הָיוּ עַל
  choice: yakawa juu ya
  rationale: Hii inahifadhi kwa karibu maana ya msingi “yalikuwa/yakawa juu ya,” pamoja na hali ya tukio katika mfululizo wa simulizi, bila kuongeza wazi wazo la mwendo ambalo halimo katika kitenzi chenyewe.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: אֶרֶץ inaweza kumaanisha dunia au nchi/ardhi. Katika muktadha mpana wa simulizi la gharika, “dunia” ndiyo maana inayofaa zaidi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa אֶרֶץ katika simulizi la gharika
  choice: dunia
  alternative: nchi au ardhi
  rationale: Neno la Kiebrania linaweza kutaja dunia nzima au eneo la nchi/ardhi. Muktadha wa simulizi unaunga mkono “dunia,” lakini tanbihi inahifadhi utata halisi wa kileksika bila kulazimisha hitimisho la mjadala mpana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Gharika” limetumiwa kwa mafuriko makubwa ya simulizi la Noa. Mpangilio ni wa asili katika Kiswahili huku tanbihi zikihifadhi muundo halisi wa Kiebrania na utata wa אֶרֶץ.
