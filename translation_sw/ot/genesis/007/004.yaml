base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: sw
  text: Kwa maana baada ya siku saba, nitanyesha mvua juu ya dunia kwa siku arobaini na usiku arobaini, nami nitafutilia mbali[a] kila kilicho hai ambacho nimekiumba kutoka juu ya uso wa ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitafuta.” Kitenzi cha Kiebrania kina taswira ya kufuta au kuondoa kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu ya agizo lililotangulia na kudumisha uhusiano wa maelezo kwa Kiswahili cha kawaida.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: baada ya siku saba zaidi
  rationale: Nahau hiyo inaonyesha kwamba zimebaki siku saba kabla mvua haijaanza; usemi huu ni wa asili na wazi katika Kiswahili.
- source_word: מַמְטִיר
  choice: nitanyesha mvua
  rationale: Muundo wa kisababishi unaonyesha kwamba Mungu ndiye anayesababisha mvua inyeshe; 'nitanyesha mvua' hudumisha uwakala huo.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: Katika muktadha wa gharika, 'dunia' huwasilisha upana wa אֶרֶץ bila kuibana maana kuwa eneo la mahali fulani.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: kwa siku arobaini na usiku arobaini
  rationale: Ni usemi wa kawaida wa muda katika Kiswahili na hudumisha hesabu na ulinganifu wa Kiebrania.
- source_word: וּמָחִיתִי
  choice: nami nitafutilia mbali
  rationale: Huhifadhi taswira ya kufuta au kuondoa kabisa iliyo katika kitenzi מחה huku ikiwa ya kueleweka kwa msomaji wa sasa.
- source_word: כָּל הַיְקוּם
  choice: kila kiumbe hai
  rationale: Katika muktadha huu neno linarejelea viumbe vyote vilivyo hai vinavyokabili hukumu ya gharika; tafsiri hii huepuka maana pana kupita kiasi ya 'kila kilichopo.'
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: nilichokifanya
  rationale: Huhusianisha moja kwa moja kiumbe hai na tendo la Mungu la kukiumba, kwa Kiswahili fasaha.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: kutoka juu ya uso wa ardhi
  rationale: Hudumisha nahau ya 'uso' na pia tofauti ya msamiati kati ya אֶרֶץ ('dunia') na אֲדָמָה ('ardhi').
theological_decisions:
- issue: Upeo wa hukumu ya gharika katika אֶרֶץ na הַיְקוּם
  choice: Kutumia lugha pana, 'dunia' na 'kila kiumbe hai,' bila kuifanya hukumu iwe ya eneo dogo tu.
  alternative: Kutafsiri אֶרֶץ kuwa 'nchi' au 'eneo,' jambo linaloweza kudokeza upeo wa kikanda.
  rationale: Kauli za mstari huu zinaonyesha hukumu pana juu ya viumbe ambavyo Mungu amevifanya. Tafsiri inadumisha nguvu hiyo bila kuingiza hoja za kisasa za kisayansi au msimamo wa dhehebu kuhusu ukubwa wa gharika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. 'Ardhi' imetofautishwa na 'dunia' ili kuhifadhi tofauti ya maneno ya Kiebrania.
