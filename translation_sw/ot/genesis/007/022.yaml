  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: sw
  text: Kila kiumbe katika nchi kavu ambacho kilikuwa na pumzi ya uhai katika matundu ya pua yake kilikufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kufuata maneno ya Kiebrania kwa karibu zaidi, “pumzi ya roho ya uhai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Kila kiumbe ambacho
  rationale: Kirai hiki kinajumuisha viumbe vyote vinavyotimiza sifa inayofuata. “Kiumbe” kinafaa hapa kwa kuwa muktadha unahusu wanadamu na wanyama wenye pumzi.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: pumzi ya uhai
  rationale: Muunganiko huu wa Kiebrania unaeleza pumzi inayotia au kuonyesha uhai. “Pumzi ya uhai” ni ya asili na wazi katika Kiswahili, huku tafsiri ya karibu zaidi ya muundo wa Kiebrania ikihifadhiwa katika tanbihi.
- source_word: בְּאַפָּיו
  choice: katika matundu ya pua yake
  rationale: Neno la Kiebrania ni la wingi, “matundu ya pua,” likiwa na kiambishi cha nafsi ya tatu umoja kinachotumiwa kwa mgawanyo kwa kila kiumbe.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: katika nchi kavu
  rationale: Kirai hiki kinaweka mipaka kwa viumbe vya nchi kavu na kuvitofautisha na vilivyo majini katika muktadha wa gharika.
- source_word: מֵתוּ
  choice: kilikufa
  rationale: Kitenzi kinasema moja kwa moja kwamba viumbe hivyo vilikufa; umoja unatokana na muundo wa “kila kiumbe” katika Kiswahili.
theological_decisions:
- issue: Ikiwa רוּחַ itafsiriwe moja kwa moja kama “roho” katika matini kuu
  choice: pumzi ya uhai
  alternative: pumzi ya roho ya uhai
  rationale: Katika muunganiko huu, רוּחַ inaweza kuhusiana kimaana na pumzi na kuunda wazo la pumzi yenye uhai. Tafsiri “pumzi ya roho ya uhai” inaweza kudokeza kwa Kiswahili mgawanyo wa kimetafizikia ambao huenda haukusudiwi; hata hivyo, muundo huo wa karibu na Kiebrania umeonyeshwa katika tanbihi ili kutoficha utata wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Matundu ya pua” limetumiwa badala ya “pua” ili kuwakilisha wingi wa neno la Kiebrania kwa usahihi.
