  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: sw
  text: Nuhu akafanya kulingana na yote ambayo Yahwe alimwamuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya’ au ‘kutengeneza.’ Katika muktadha wa kutii amri, ‘akafanya’ ni tafsiri ya kawaida na isiyoongeza ufafanuzi usio katika Kiebrania.
- source_word: נֹחַ
  choice: Nuhu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: כְּכֹל אֲשֶׁר
  choice: yote kama
  rationale: Muundo huu unaonyesha kwamba matendo ya Nuhu yalilingana kikamilifu na yale aliyoamriwa. ‘Akafanya yote kama...’ ni Kiswahili cha asili kinachohifadhi maana hiyo, ingawa mpangilio halisi zaidi ungekuwa ‘kulingana na yote ambayo.’
- source_word: צִוָּהוּ
  choice: alivyomwamuru
  rationale: צוה humaanisha ‘kuamuru.’ Muundo ‘kama ... alivyomwamuru’ unaonyesha kwa kawaida kwamba Nuhu alitekeleza maagizo aliyokuwa amepewa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo; ‘Yehova’ ni umbo la kimapokeo linalotokana na mchanganyiko wa konsonanti na alama za vokali za usomaji mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo ‘akafanya yote kama ... alivyomwamuru’ umechaguliwa kwa ufasaha huku ukihifadhi wazo la utiifu kamili.
