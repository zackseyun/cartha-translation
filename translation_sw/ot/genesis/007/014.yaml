base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: sw
  text: wao, pamoja na kila mnyama wa mwituni kwa aina yake, na kila mnyama wa kufugwa kwa aina yake, na kila kiumbe kitambaacho juu ya ardhi kwa aina yake, na kila ndege kwa aina yake—kila kiumbe chenye mabawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa karibu zaidi ni, “kila ndege, kila bawa.” Huu ni usemi wa uainishaji unaosisitiza ndege wote, yaani viumbe wote wenye mabawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: wao
  rationale: Kiwakilishi hiki cha wingi kinarejelea Noa na wale waliokuwa pamoja naye; “wao” huendeleza sentensi kutoka mstari uliotangulia.
- source_word: הַחַיָּה
  choice: mnyama wa mwituni
  rationale: Katika uainishaji wa wanyama katika Mwanzo, neno hili hutofautisha wanyama wa porini na בְּהֵמָה, yaani wanyama wa kufugwa.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: kwa aina yake
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili unaohifadhi dhana ya uainishaji ya מִין.
- source_word: הַבְּהֵמָה
  choice: mnyama wa kufugwa
  rationale: Huhifadhi tofauti na mnyama wa mwituni bila kulibana neno kwa ng’ombe pekee.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: kiumbe kitambaacho juu ya ardhi
  rationale: Huwakilisha viumbe vidogo vinavyosonga ardhini na kuhifadhi mwangwi wa mzizi mmoja katika nomino na kitenzi kwa kadiri Kiswahili cha kawaida kinavyoruhusu.
- source_word: הָעוֹף
  choice: ndege
  rationale: Muktadha na ufafanuzi unaofuata zinaonyesha viumbe wenye mabawa; “ndege” ni neno la kawaida na linaloeleweka.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: kila ndege wa kila aina ya mabawa
  rationale: Huhifadhi mkusanyo wa maneno ya uainishaji unaosisitiza ndege wote wenye mabawa, huku ukiepuka tafsiri isiyo ya kawaida ya “kila bawa” kana kwamba bawa lenyewe ndilo kiumbe.
