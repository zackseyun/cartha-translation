  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: sw
  text: Gharika ikaendelea duniani kwa siku arobaini,[a] nayo maji yakazidi na kuiinua safina, hata ikainuka juu ya nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Gharika ilikuwa duniani kwa siku arobaini.” Nahau ya Kiebrania inaweza kutafsiriwa kwa namna rasmi zaidi kwa kutumia “ilikuwa,” lakini “ikaendelea” huonyesha muda kwa Kiswahili cha kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ikaendelea
  rationale: Pamoja na kipindi cha “siku arobaini” na kiima “gharika,” kitenzi hiki kinaeleza kudumu kwa tukio; “ikaendelea” ni Kiswahili cha kawaida kinachoonyesha muda bila kubadili maana ya simulizi.
- source_word: הַמַּבּוּל
  choice: gharika
  rationale: Ni neno la kawaida na mahususi katika Kiswahili kwa gharika ya simulizi la Nuhu.
- source_word: אַרְבָּעִים יוֹם
  choice: kwa siku arobaini
  rationale: Ingawa Kiebrania hakina kihusishi kilicho wazi, “kwa” huonyesha muda kwa Kiswahili cha kawaida.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: אֶרֶץ inaweza kumaanisha nchi au dunia; katika kauli hii ya gharika, “dunia” inafaa kwa upeo mpana wa muktadha.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: maji yakazidi
  rationale: רבה hapa inaonyesha kuongezeka kwa kiasi au kuenea kwa maji; “yakazidi” ni ya asili na sahihi katika muktadha.
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: kuiinua safina
  rationale: נשא inaeleza maji kuipandisha safina juu; “kuiinua” huonyesha wazi tendo hilo.
- source_word: הַתֵּבָה
  choice: safina
  rationale: Hili ndilo neno lililozoeleka na linaloeleweka kwa chombo cha Nuhu.
- source_word: וַתָּרָם
  choice: ikapaa
  rationale: Kitenzi cha umoja kinakubaliana na safina na kinaonyesha matokeo ya kuinuliwa kwake; “ikapaa” ni cha asili na huhifadhi mwendo wa kwenda juu.
- source_word: מֵעַל הָאָרֶץ
  choice: juu ya nchi
  rationale: Hapa neno linaelekeza kwenye uso wa ardhi ambao safina iliinuka kutoka kwake; “juu ya nchi” huepuka kurudia “dunia” na kubaki karibu na maana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. “Safina” na “gharika” ni maneno yaliyozoeleka katika muktadha huu; alama ya tanbihi imewekwa mara baada ya kishazi kinachohusika.
