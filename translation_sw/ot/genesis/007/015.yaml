  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: sw
  text: Wakamjia Noa ndani ya safina, wawili wawili, katika kila chenye mwili kilichokuwa na pumzi ya uhai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho ya uhai.” Neno la Kiebrania רוּחַ linaweza kumaanisha “pumzi,” “upepo,” au “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Wakamjia
  rationale: Kitenzi בוא katika mfuatano wa simulizi kinaonyesha tendo la wakati uliopita; “wakamjia” kinaeleza kuja kwao kwa Noa kwa Kiswahili cha kawaida.
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: Noa ndani ya safina
  rationale: Kirai hiki kinahifadhi Noa kama anayefikiwa na safina kama mahali walipoingia, kwa mpangilio wa asili unaoeleweka katika Kiswahili.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: wawili wawili
  rationale: Kurudiwa kwa namba kunaonyesha mgawanyo katika jozi; “wawili wawili” ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: מִכָּל הַבָּשָׂר
  choice: kutoka kwa kila chenye mwili
  rationale: “Chenye mwili” kinahifadhi taswira halisi ya בָּשָׂר, huku kikirejelea kwa upana viumbe hai katika simulizi la gharika.
- source_word: אֲשֶׁר בּוֹ
  choice: ambacho ndani yake kulikuwa na
  rationale: Muundo huu unafuata kwa karibu uhusiano wa Kiebrania wa “ndani yake” bila kuubadili kuwa maelezo huru zaidi.
- source_word: רוּחַ חַיִּים
  choice: pumzi ya uhai
  rationale: Katika muktadha wa viumbe hai, “pumzi ya uhai” ni maana ya kawaida na yenye kufaa, huku tanbihi ikihifadhi uwezekano wa “roho.”
theological_decisions:
- issue: Maana ya רוּחַ katika רוּחַ חַיִּים
  choice: pumzi ya uhai
  alternative: roho ya uhai
  rationale: Muktadha unasisitiza uhai wa viumbe wanaoingia safinani, lakini neno רוּחַ linaweza pia kumaanisha “roho”; uwezekano huo umehifadhiwa katika tanbihi bila kulazimisha hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “kila chenye mwili” umechaguliwa kuhifadhi lugha ya simulizi la Kiebrania bila kuifanya kuwa istilahi ya dhehebu.
