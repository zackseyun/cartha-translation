  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Noa, “Ingia ndani ya safina, wewe pamoja na watu wote wa nyumbani mwako, kwa maana nimekuona kuwa mwenye haki mbele zangu katika kizazi hiki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehifadhiwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida; kiambishi cha mtendewa katika ‘akamwambia’ kinaonyesha kuwa Noa ndiye aliyeambiwa.
- source_word: בֹּא
  choice: Ingia ndani ya
  rationale: Amri hii inaweza kumaanisha ‘njoo’ au ‘ingia’; katika muktadha wa safina, ‘ingia ndani ya’ ni wazi na ya asili.
- source_word: בֵּיתְךָ
  choice: watu wote wa nyumbani mwako
  rationale: Neno ‘nyumba’ hapa linamaanisha jamaa au watu wa kaya, si jengo; tafsiri hii huepuka dhana ya kubeba nyumba yenyewe.
- source_word: הַתֵּבָה
  choice: safina
  rationale: ‘Safina’ ndilo neno la Kiswahili lililozoeleka kwa chombo cha Noa, ingawa neno la Kiebrania linaweza kueleza chombo cha umbo la sanduku.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya amri iliyotangulia kwa mtiririko wa asili na wenye heshima.
- source_word: רָאִיתִי
  choice: nimekuona
  rationale: Kauli timilifu ya Kiebrania inaonyesha tathmini iliyofanywa na yenye umuhimu wa sasa.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Huhifadhi maana ya hali ya uadilifu au haki bila kuongeza maelezo kuhusu msingi wake.
- source_word: לְפָנַי
  choice: mbele zangu
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha katika uwepo, uangalizi, au tathmini ya Mungu.
- source_word: בַּדּוֹר הַזֶּה
  choice: katika kizazi hiki
  rationale: ‘Kizazi’ hapa kinarejelea watu walioishi wakati mmoja na Noa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu. Kulihifadhi kama ‘Yahweh’ huepuka kulibadilisha kuwa cheo na kufuata ushahidi wa maandishi moja kwa moja.
- issue: Maana ya haki ya Noa
  choice: nimekuona kuwa mwenye haki mbele zangu
  alternative: nimekuona wewe peke yako kuwa mwenye haki; nimekuhesabu kuwa mwenye haki
  rationale: Kiebrania kinatoa tathmini ya Mungu kwamba Noa ni mwenye haki, lakini hakisemi wazi ‘peke yako’ wala hakielezi msingi au namna ya hali hiyo. Tafsiri haiongezi ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Watu wote wa nyumbani mwako’ ni wazi kwa msomaji wa kawaida na huwasilisha maana pana ya kaya; ‘safina’ huhifadhi istilahi ya kibiblia iliyozoeleka.
