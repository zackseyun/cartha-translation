base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: sw
  text: Pia, na ndege wa angani, saba saba, dume na jike, ili kuhifadhi uzao hai juu ya uso wa dunia yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jozi saba.” Kiebrania kinasema kihalisi “saba saba,” usemi wa ugawaji unaoweza kueleweka kuwa saba wa kila aina au jozi saba; matini kuu inahifadhi kwa karibu zaidi muundo wa Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Pia
  rationale: Huendeleza agizo lililotangulia kwa kuongeza jamii ya ndege bila kutia maneno yasiyokuwamo.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: katika ndege wa angani
  rationale: עוֹף hapa hurejelea ndege, na שָּׁמַיִם katika muktadha huu ni anga; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: saba saba
  rationale: Huhifadhi urudiaji wa namba katika Kiebrania na nguvu yake ya ugawaji bila kuamua kimyakimya ikiwa maana ni saba wa kila aina au jozi saba.
- source_word: זָכָר וּנְקֵבָה
  choice: dume na jike
  rationale: Ni istilahi za kawaida za jinsia ya wanyama katika Kiswahili na zinaakisi moja kwa moja usemi wa Kiebrania.
- source_word: לְחַיּוֹת זֶרַע
  choice: ili kuhifadhi uzao wao hai
  rationale: Kitenzi katika Hifili huonyesha kusababisha au kudumisha uhai; 'uzao wao' huwasilisha maana ya זֶרַע katika muktadha wa kuendelezwa kwa viumbe.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: juu ya uso wa dunia yote
  rationale: Huhifadhi taswira ya nahau ya Kiebrania huku ikibaki wazi na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Idadi inayomaanishwa na שִׁבְעָה שִׁבְעָה
  choice: saba saba
  alternative: jozi saba
  rationale: Kiebrania kina usemi wa ugawaji wenye uwezekano wa kueleweka kwa namna zaidi ya moja; tafsiri kuu haiondoi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “saba saba” umehifadhiwa makusudi ili kuakisi muundo na utata halisi wa Kiebrania; tanbihi inaeleza tafsiri mbadala.
