id: GEN.7.11
reference: Genesis 7:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: sw
  text: Katika mwaka wa mia sita wa maisha ya Noa, mwezi wa pili, siku ya kumi na saba ya mwezi huo, siku hiyo chemchemi zote za kilindi kikuu zilipasuka[a], na madirisha ya mbingu yakafunguliwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyanzo vyote vya kilindi kikuu vilipasuka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “malango ya mafuriko ya mbingu yakafunguliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: Katika mwaka wa mia sita wa maisha ya Noa
  rationale: Muundo huu huhifadhi namna ya Kiebrania ya kuhesabu tarehe kwa kurejelea umri wa Noa, huku ukitumia Kiswahili cha kawaida na kinachoeleweka.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: mwezi wa pili
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: siku ya kumi na saba ya mwezi huo
  rationale: Namba ya Kiebrania hutumika hapa kama tarehe; Kiswahili hutumia kwa kawaida umbo la namba ya mpangilio.
- source_word: בַּיּוֹם הַזֶּה
  choice: siku hiyo
  rationale: Usemi huu unarejelea kwa msisitizo siku iliyotajwa, bila kuongeza maana isiyokuwamo.
- source_word: נִבְקְעוּ
  choice: zilipasuka
  rationale: Kitenzi kinaonyesha kupasuka au kugawanyika kwa nguvu. “Zilipasuka” ni cha asili, wazi, na huhifadhi nguvu ya tukio.
- source_word: כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: chemchemi zote za kilindi kikuu
  rationale: “Chemchemi” huwasilisha מַעְיְנֹת kama sehemu zinakotoka maji, na “kilindi kikuu” huhifadhi taswira ya maji ya kina ya simulizi bila kuibadili kuwa maelezo ya kisayansi ya kisasa.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: na madirisha ya mbingu
  rationale: “Madirisha” huhifadhi taswira halisi ya אֲרֻבּוֹת, nayo “mbingu” ni namna ya kawaida ya Kiswahili ya kuwasilisha שָׁמַיִם katika muktadha huu.
- source_word: נִפְתָּחוּ
  choice: yakafunguliwa
  rationale: Umbo la kutendwa huhifadhi hali ya kitenzi cha Kiebrania na linafuatana vizuri na mtiririko wa simulizi.
theological_decisions:
- issue: Taswira ya ulimwengu kuhusu maji ya gharika
  choice: Kuhifadhi “kilindi kikuu” na “madirisha ya mbingu” kama zilivyo katika taswira ya simulizi
  alternative: Kufafanua kwa maneno kama “maji ya chini ya ardhi” na “malango ya mafuriko angani”
  rationale: Matini hutumia taswira ya kale yenye mchango muhimu katika nguvu ya simulizi. Tafsiri haipaswi kuigeuza kimyakimya kuwa maelezo ya kisayansi ya kisasa wala kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa tarehe umerudiwa kwa kiasi kinachohifadhi uzito wa Kiebrania. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika, kwa kuwa alama katika safu ya Kiingereza zilikuwa hazilingani na maelezo yake.
