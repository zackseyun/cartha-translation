  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: sw
  text: Maji yakazidi kuwa na nguvu sana sana juu ya dunia[a], na milima yote mirefu iliyo chini ya mbingu zote ikafunikwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi,” kwa neno la Kiebrania אֶרֶץ; maana yake hutegemea jinsi upeo wa gharika unavyoeleweka katika muktadha.
    reason: alternative_reading
  - marker: b
    text: Au, “chini ya mbingu yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: yakazidi kuwa na nguvu
  rationale: Kitenzi גבר huonyesha kuwa na nguvu, kushinda, au kuongezeka kwa nguvu. Katika simulizi hili, usemi huu unaonyesha maji yakitawala na kuendelea kuongezeka bila kutumia Kiswahili kisicho cha kawaida.
- source_word: מְאֹד מְאֹד
  choice: sana
  rationale: Urudiaji wa מְאֹד unasisitiza kiwango kikubwa mno. Kiswahili cha kawaida hutumia 'sana' kwa maana hii; nguvu ya urudiaji pia inaonekana katika muktadha wa 'yakazidi kuwa na nguvu.'
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: עַל ni 'juu ya,' na אֶרֶץ hapa imetafsiriwa 'dunia' kwa kuzingatia upeo mpana unaodokezwa na sehemu inayofuata, huku uwezekano wa 'nchi' ukihifadhiwa katika tanbihi.
- source_word: וַיְכֻסּוּ
  choice: ikafunikwa
  rationale: Umbo hili linaeleza milima kufunikwa. Kauli tendwa ni ya kawaida katika Kiswahili na huwasilisha wazi matokeo ya maji juu ya milima.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: milima yote mirefu
  rationale: 'Hili linafuata kwa karibu muundo na upeo wa Kiebrania: כָּל ''yote,'' הָרִים ''milima,'' na גְּבֹהִים ''mirefu.'''
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: chini ya mbingu zote
  rationale: Tafsiri hii huhifadhi wingi wa שָׁמַיִם na neno כָּל, huku 'chini ya mbingu yote' likibaki chaguo la Kiswahili lenye maana inayokaribiana.
theological_decisions:
- issue: Upeo wa אָרֶץ katika simulizi la gharika
  choice: dunia
  alternative: nchi
  rationale: Kauli 'chini ya mbingu zote' huwasilisha tukio kwa lugha yenye upeo wa jumla ndani ya simulizi. 'Dunia' inalingana na upeo huo, lakini maana ya 'nchi' ya neno אָרֶץ haijaondolewa na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi msisitizo, upeo, na uwezekano halisi wa maana za Kiebrania bila kuamua kimadhehebu suala la upeo wa gharika.
