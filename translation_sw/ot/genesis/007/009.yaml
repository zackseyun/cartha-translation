  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: sw
  text: Wawili wawili wakaja kwa Noa na kuingia ndani ya safina, dume na jike, kama vile Mungu alivyomwamuru Noa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: Wawili wawili
  rationale: Kurudiwa kwa namba kunaonyesha mgawanyo katika jozi. “Wawili wawili” ni usemi wa kawaida wa Kiswahili unaodumisha msisitizo wa chanzo.
- source_word: בָּאוּ
  choice: wakaja
  rationale: Kitenzi בוא kina maana ya kuja au kwenda kulingana na mtazamo. “Wakaja” hudumisha mtazamo wa simulizi kuelekea kwa Noa.
- source_word: אֶל נֹחַ
  choice: kwa Noa
  rationale: אֶל huonyesha mwendo kuelekea kwa Noa; “kwa Noa” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: אֶל הַתֵּבָה
  choice: na kuingia ndani ya safina
  rationale: Katika muktadha huu wa mwendo, safina ndiyo mahali pa kuishia. Kiswahili kinahitaji urekebishaji huu ili kuonyesha kwa kawaida kwamba waliingia safinani, ingawa kiunganishi na kitenzi cha kuingia vimewekwa wazi kuliko katika Kiebrania.
- source_word: זָכָר וּנְקֵבָה
  choice: dume na jike
  rationale: Huu ndio usemi wa kawaida wa kibayolojia kwa wanyama katika Kiswahili, nao unadumisha ufupi wa chanzo.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Usemi huu unaonyesha kwamba tukio lilipatana na agizo la Mungu.
- source_word: צִוָּה אֱלֹהִים
  choice: Mungu alivyomwamuru
  rationale: Muundo wa Kiswahili unaonyesha kwa kawaida kuwa agizo lilitangulia kuja kwa wanyama bila kulazimisha wakati uliopita timilifu usio wa lazima.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu אֱלֹהִים humrejelea Mungu mmoja, hivyo “Mungu” ndiyo tafsiri sanifu.
theological_decisions:
- issue: Jinsi wanyama walivyofika
  choice: Aya inasema wanyama walikuja kwa Noa kwa kupatana na agizo la Mungu, bila kueleza utaratibu uliowafanya waje.
  alternative: Kusema walikuja kwa silika pekee au kwamba Noa peke yake ndiye aliyewakusanya.
  rationale: Tafsiri inadumisha uhusiano kati ya kuja kwao na agizo la Mungu bila kuongeza maelezo ambayo hayamo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Safina” ni istilahi iliyozoeleka katika simulizi la Noa. Muundo umefanywa wa asili kwa Kiswahili huku msisitizo wa mwanzo “Wawili wawili” ukihifadhiwa.
