  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: sw
  text: Kutoka katika wanyama safi na katika wanyama ambao si safi[a], na katika ndege na kila kiumbe kitambaacho juu ya ardhi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ambao ni najisi.” Kiebrania kinasema kihalisi zaidi, “ambao si safi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: kutoka katika
  rationale: Kihusishi hiki kinaonyesha kundi ambalo viumbe walitoka; kukirudia kunahifadhi muundo na mdundo wa orodha ya Kiebrania.
- source_word: בְּהֵמָה
  choice: wanyama
  rationale: Katika muktadha huu neno linaonyesha kundi pana linalotofautishwa na ndege na viumbe vitambaavyo, si mifugo pekee.
- source_word: טְּהוֹרָה
  choice: safi
  rationale: “Safi” ni istilahi ya kawaida na inayoeleweka kwa uainishaji wa kidini wa wanyama katika muktadha huu.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: ambao si safi
  rationale: Tafsiri hii inadumisha namna ya Kiebrania ya kueleza kwa ukanushi, yaani “ambao si safi,” badala ya kuibadili moja kwa moja kuwa kivumishi kimoja.
- source_word: עוֹף
  choice: ndege
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi linalokusudiwa hapa na linaepuka usemi mpana kupita kiasi wa “viumbe warukao.”
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: kila kiumbe kitambaacho
  rationale: Usemi huu unaonyesha kwa Kiswahili cha kawaida kundi zima la viumbe wanaosonga kwa kutambaa, huku ukihifadhi wazo la kitenzi cha Kiebrania.
- source_word: עַל הָאֲדָמָה
  choice: juu ya ardhi
  rationale: Hapa אֲדָמָה ni uso wa ardhi ambako viumbe hivyo hutambaa; “juu ya ardhi” ni sahihi na ya asili katika Kiswahili sanifu.
theological_decisions:
- issue: Uainishaji wa wanyama kwa usafi
  choice: safi / si safi
  alternative: safi / najisi
  rationale: Kiebrania hutumia ukanushi halisi, “si safi,” wala si neno tofauti linalomaanisha “najisi.” Tafsiri inadumisha tofauti hiyo bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na kirudio cha “kutoka katika” vimehifadhiwa; mstari unabaki sentensi isiyokamilika kwa kutumia alama ya em dash kama katika muktadha wa chanzo.
