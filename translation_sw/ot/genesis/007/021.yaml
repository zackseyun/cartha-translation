  to: 'Viumbe vyote vyenye mwili vilivyokuwa vinasonga juu ya dunia vilikufa: ndege, mifugo, wanyama wa mwituni, kila kiumbe kitambaacho kinachotambaa juu ya dunia, na wanadamu wote.[a]'
  rationale: Marekebisho yanadumisha maana ya jumla ya כָּל־בָּשָׂר kwa usemi wa Kiswahili unaosikika kawaida, "viumbe vyote vyenye mwili," na kuifanya sentensi iwe na ulinganifu wa ngeli. "Viliyokuwa vinasonga" huwakilisha הָרֹמֵשׂ kwa maana pana inayojumuisha makundi yote katika orodha. Kirai "kiumbe kitambaacho kinachotambaa" huhifadhi, kadiri Kiswahili kinavyoruhusu, urudufu wa שֶׁרֶץ/שֹׁרֵץ na participle ya sasa. Tanbihi imeandikwa upya ili ieleze הָאָדָם kuwa nomino ya umoja yenye maana ya kijumla bila kutumia nukuu ya Kiswahili isiyo ya kawaida.
