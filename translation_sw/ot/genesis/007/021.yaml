  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: sw
  text: 'Viumbe vyote vyenye mwili vilivyokuwa vinasonga juu ya dunia vilikufa: ndege, mifugo, wanyama wa mwituni, kila kiumbe kitambaacho kinachotambaa juu ya dunia, na wanadamu wote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamii yote ya wanadamu.” Kiebrania, “adamu wote”; yaani wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: kikafa
  rationale: Kitenzi גוע humaanisha kufa au kukata roho. “Kikafa” ni kauli ya moja kwa moja, ya kawaida, na yenye hadhi katika Kiswahili cha sasa.
- source_word: כָּל בָּשָׂר
  choice: kila kiumbe chenye mwili
  rationale: Hifadhi maana ya nahau ya Kiebrania “kila chenye mwili” huku ikifanya rejeleo lake kwa viumbe hai lieleweke kwa kawaida katika Kiswahili.
- source_word: הָרֹמֵשׂ
  choice: kilichotembea
  rationale: רמש hapa ina maana pana ya kusonga au kutembea, kwa kuwa orodha inayofuata inatia ndani ndege, mifugo, wanyama wa mwituni, na viumbe vitambaavyo. “Kilichotembea” hakifungi maana kwa viumbe vitambaavyo pekee.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: “Juu ya dunia” ni tafsiri ya wazi ya עַל הָאָרֶץ na inafaa upeo wa simulizi hili bila kuibadili kuwa “nchi” au eneo maalumu.
- source_word: בָּעוֹף
  choice: ndege
  rationale: עוֹף yaweza kumaanisha viumbe warukao kwa upana, lakini “ndege” ni neno la kawaida na linalofaa katika orodha hii.
- source_word: וּבַבְּהֵמָה
  choice: mifugo
  rationale: בְּהֵמָה katika mgawanyo huu hurejelea wanyama wanaofugwa; “mifugo” hudumisha tofauti yao na wanyama wa mwituni.
- source_word: וּבַחַיָּה
  choice: wanyama wa mwituni
  rationale: חַיָּה hapa, kwa kutofautishwa na mifugo, humaanisha wanyama wasiofugwa. “Wanyama wa mwituni” ni wazi na ya kawaida.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: kila kiumbe kitambaacho kilichotambaa
  rationale: Tafsiri hii inahifadhi marudio ya mzizi mmoja katika nomino na kitenzi cha Kiebrania, huku ikirejelea kundi la viumbe vidogo vitambaavyo au kusongamana.
- source_word: וְכֹל הָאָדָם
  choice: na wanadamu wote
  rationale: הָאָדָם imetumiwa kwa maana ya kijumla, yaani jamii ya wanadamu, wala si mwanamume mmoja. “Wanadamu wote” ni ya asili, jumuishi, na sahihi katika Kiswahili.
theological_decisions:
- issue: Maana ya kijumla ya הָאָדָם
  choice: wanadamu wote
  alternative: jamii yote ya wanadamu
  rationale: Kiebrania kinarejelea jamii ya wanadamu kwa ujumla. Tafsiri haifanyi neno hilo limaanishe wanaume pekee wala mtu mmoja, na tanbihi inahifadhi namna ya umoja ya usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha na marudio ya Kiebrania katika “kitambaacho kilichotambaa” yamehifadhiwa. Alama ya tanbihi imewekwa baada ya “wanadamu wote,” ambako maelezo yake yanahusika; kuwekwa kwake baada ya “birds” katika safu ya Kiingereza ni hitilafu ya ulinganifu wa alama na tanbihi.
