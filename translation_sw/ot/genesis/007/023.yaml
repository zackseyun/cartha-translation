base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: sw
  text: Akafuta kila kiumbe hai kilichokuwa juu ya uso wa ardhi[a]—kuanzia wanadamu[b], mifugo, viumbe vitambaavyo, hadi ndege wa angani[c]. Wakafutwa kutoka duniani; Noa pekee ndiye aliyebaki, pamoja na wale waliokuwa naye ndani ya safina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akapangusa”; kitenzi cha Kiebrania kina picha ya kufuta au kupangusa kabisa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: adam, hapa likiwa na maana ya uwakilishi wa jamii ya binadamu; “kuanzia jamii ya binadamu” pia yawezekana.'
    reason: lexical_alternative
  - marker: c
    text: Au “ndege wa mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: akafuta / wakafutwa
  rationale: Mzizi מחה una picha ya kufuta au kuondoa kabisa. “Kufuta” huhifadhi picha hiyo, huku umbo la pili la Kiebrania likiwakilishwa kwa “wakafutwa.”
- source_word: כָּל הַיְקוּם
  choice: kila kiumbe hai
  rationale: Katika muktadha wa gharika, neno hili linamaanisha vyote vilivyokuwapo vikiwa hai juu ya nchi, si dhana dhahania ya ‘uwepo.’
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: juu ya uso wa ardhi
  rationale: Huhifadhi taswira ya nahau ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מֵאָדָם
  choice: kuanzia wanadamu
  rationale: אָדָם hapa inawakilisha jamii ya binadamu katika orodha ya makundi ya viumbe. “Wanadamu” ni wazi na ya kawaida katika Kiswahili, bila kuzuia maana kwa mwanamume mmoja.
- source_word: בְּהֵמָה
  choice: mifugo
  rationale: Hurejelea wanyama wa kufugwa na ni neno la sasa, wazi, na lisilo finyu kama ‘ng’ombe.’
- source_word: רֶמֶשׂ
  choice: viumbe vitambaavyo
  rationale: Hueleza viumbe vidogo vinavyotembea karibu na ardhi na hudumisha upana wa neno la Kiebrania.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: Ni usemi wa asili katika Kiswahili unaowasilisha ndege wa anga bila kulazimisha maana nyingine ya שׁמים.
- source_word: מִן הָאָרֶץ
  choice: kutoka duniani
  rationale: אֶרֶץ linaweza kumaanisha nchi au dunia; hapa ‘duniani’ linaendana na upeo wa simulizi huku lisizidishe madai ya mstari.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: wakabaki Noa tu
  rationale: “Tu” huwasilisha nguvu ya kizuizi ya אַךְ, na “wakabaki” huunganisha kwa kawaida Noa na wale waliokuwa pamoja naye.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: pamoja na wale waliokuwa naye ndani ya safina
  rationale: Huwasilisha wazi kundi lililokuwa pamoja na Noa; “safina” ni istilahi ya kawaida katika simulizi la Noa.
theological_decisions:
- issue: Upeo wa maangamizi katika lugha ya gharika
  choice: Kutafsiri moja kwa moja kwamba viumbe hai vya nchi vilivyotajwa vilifutwa, bila kupunguza au kupanua dai la mstari.
  alternative: Kuisoma kama lugha ya kutia chumvi kuhusu eneo fulani, au kama taarifa ya kisayansi inayosema wazi kwamba tukio lilikuwa la dunia nzima.
  rationale: Tafsiri inadumisha nguvu na upeo wa lugha ya Kiebrania—“kutoka duniani” na makundi yaliyotajwa—bila kuamua mjadala ambao mstari wenyewe hauufafanui kwa istilahi za kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa kwa mtiririko wa kawaida; alama zote za tanbihi [a], [b], na [c] zimo katika maandishi makuu.
