base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: sw
  text: Kutoka kwa kila mnyama aliye safi, utajichukulia jozi saba[a], dume pamoja na jike wake; na kutoka kwa wanyama ambao si safi, wawili[b], dume pamoja na jike wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, kihalisi, “saba saba, dume na jike wake.” Huenda maana yake ni jozi saba, ingawa wengine huelewa kuwa ni wanyama saba mmoja mmoja.
    reason: alternative_reading
  - marker: b
    text: Au “wanyama najisi.” Kiebrania kinasema “wanyama ambao si safi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: Katika kila mnyama
  rationale: Muundo huu unaonyesha uteuzi kutoka katika kila aina ya wanyama; Kiswahili cha kawaida hutumia ‘katika kila’ kwa maana hii ya mgawanyo.
- source_word: הַטְּהוֹרָה
  choice: aliye safi
  rationale: ‘Safi’ huhifadhi utofautishaji wa maandiko kati ya wanyama safi na wasio safi bila kuongeza wazi dhana ya kiibada ambayo haikutajwa moja kwa moja.
- source_word: תִּקַּח לְךָ
  choice: ujichukulie
  rationale: Hutoa agizo kwa njia ya kawaida ya Kiswahili na pia huwakilisha לְךָ, ‘kwa ajili yako mwenyewe.’
- source_word: שִׁבְעָה שִׁבְעָה
  choice: jozi saba
  rationale: Kurudiwa kwa namba, pamoja na ‘dume na jike lake,’ kunaelekea kuonyesha makundi saba ya jozi; utata halisi kuhusu uwezekano wa wanyama saba mmoja mmoja umehifadhiwa katika tanbihi.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: dume na jike lake
  rationale: Kwa muktadha wa wanyama, msemo wa Kiebrania ‘mume na mke wake’ unaeleza upangaji kwa jinsia; ‘dume na jike lake’ ni wa asili na wenye heshima katika Kiswahili.
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: ambao si safi
  rationale: Huhifadhi usemi hasi wa Kiebrania, ‘ambao si safi,’ badala ya kuubadili kuwa kivumishi kimoja.
- source_word: שְׁנַיִם
  choice: wawili
  rationale: Namba ya Kiebrania ni ‘wawili’; maneno yanayofuata yanaonyesha kwamba hao ni dume mmoja na jike mmoja.
theological_decisions:
- issue: Maana ya idadi ya wanyama safi
  choice: jozi saba za kila mnyama safi
  alternative: wanyama saba mmoja mmoja wa kila aina safi
  rationale: שִׁבְעָה שִׁבְעָה ikifuatwa na ‘dume na jike lake’ inaunga mkono zaidi maana ya jozi saba, lakini tafsiri ya wanyama saba mmoja mmoja ina historia na inawezekana; kwa hiyo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ujichukulie’ ni agizo la kawaida linalohifadhi wazo la ‘kwa ajili yako’; ‘dume na jike lake’ huepuka lugha ya kibinadamu isiyofaa kwa wanyama. Alama zote za tanbihi zimewekwa katika matini.
