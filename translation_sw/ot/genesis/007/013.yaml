  to: Siku hiyo hiyo Noa, pamoja na Shemu, Hamu, na Yafethi, wana wa Noa, na mke wa Noa, pamoja na wake watatu wa wanawe, waliingia safinani[a].
  rationale: Nimerekebisha «iyo» kuwa «hiyo» na kupanga upya sentensi ili Kiswahili kiwe cha kawaida na cha hadhi. «Pamoja na» ya pili hufanya kazi ya kiasili ya kuonyesha kwamba wake watatu waliandamana na kundi lililotajwa, ikihifadhi kiini cha אִתָּם bila marudio yasiyo ya lazima. Kwa kuwa tafsiri iliyorekebishwa haibaki na kiwakilishi cha mwisho kama neno tofauti, tanbihi yake ya awali imeondolewa; tanbihi ya kitenzi imehifadhiwa na kurekebishwa ili ilingane na kiima cha wingi.
