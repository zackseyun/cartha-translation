base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: sw
  text: Siku hiyo hiyo Noa, pamoja na Shemu, Hamu, na Yafethi, wana wa Noa, na mke wa Noa, pamoja na wake watatu wa wanawe, waliingia safinani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuja safinani.” Kitenzi cha Kiebrania kwa msingi ni “walikuja,” lakini katika muktadha huu kinaeleza kuingia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Siku iyo hiyo
  rationale: Nahau hii inasisitiza kwamba tukio lilitokea siku ileile hasa; usemi huu ni wa kawaida na wenye mkazo katika Kiswahili.
- source_word: בָּא
  choice: aliingia
  rationale: Ingawa kitenzi kwa msingi kina maana ya ‘alikuja,’ pamoja na אֶל הַתֵּבָה kinaeleza kuingia katika safina; ‘aliingia’ huwasilisha mwendo huo kwa kawaida.
- source_word: נֹחַ
  choice: Noa
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: וְשֵׁם וְחָם וָיֶפֶת
  choice: pamoja na Shemu, Hamu na Yafethi
  rationale: ‘Pamoja na’ huonyesha kwa uwazi kuwa waliandamana na Noa, huku majina yakiratibiwa kwa Kiswahili cha kawaida.
- source_word: בְּנֵי נֹחַ
  choice: wana wa Noa
  rationale: Huhifadhi uhusiano wa kifamilia kwa usemi wa kawaida na wenye hadhi.
- source_word: וְאֵשֶׁת נֹחַ
  choice: na mke wa Noa
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: na wake watatu wa wanawe
  rationale: Huhifadhi idadi na uhusiano wa kifamilia bila kuongeza maelezo.
- source_word: אִתָּם
  choice: pamoja nao
  rationale: Kiwakilishi cha Kiebrania ni cha wingi; ‘pamoja nao’ huhifadhi umbo hilo na uwezekano wake wa kurejelea kundi lililotajwa.
- source_word: אֶל הַתֵּבָה
  choice: ndani ya safina
  rationale: Kirai kinaonyesha mahali walikoelekea; pamoja na ‘aliingia,’ ‘ndani ya safina’ huweka wazi mwendo wa kuingia. ‘Safina’ ni istilahi iliyozoeleka katika simulizi la Noa.
