translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa orodha umehifadhiwa, na ‘pamoja nao’ limeachwa ili kutunza kiwakilishi cha wingi cha maandishi ya Kiebrania licha ya marudio madogo ya kimtindo.
