translation:
  language: sw
  text: Nuhu akaingia katika safina pamoja na wanawe, mke wake, na wake za wanawe, kwa sababu ya maji ya gharika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaingia
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kuingia kulingana na muktadha. Pamoja na אֶל הַתֵּבָה, ‘akaingia’ linaeleza kwa kawaida mwendo wa kuingia ndani ya safina.
- source_word: נֹחַ
  choice: Nuhu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na matumizi ya Kiswahili.
- source_word: בָנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linataja wana wa kiume hasa; ‘wanawe’ huhifadhi maana hiyo na ni la kawaida katika Kiswahili sanifu.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Katika muktadha huu אִשָּׁה pamoja na kiambishi cha umilikaji humaanisha wazi ‘mke wake.’
- source_word: נְשֵׁי בָנָיו
  choice: wake za wanawe
  rationale: Hili linafuata kwa uwazi muundo wa Kiebrania, ‘wake za wanawe,’ badala ya kutumia neno pana zaidi la uhusiano kama ‘mashemeji.’
- source_word: אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Kirai hiki kinahifadhi marejeo ya wazi ya Kiebrania kwamba wake za wanawe walikuwa pamoja na Nuhu, huku sentensi ikibaki ya kawaida kwa Kiswahili.
- source_word: אֶל הַתֵּבָה
  choice: katika safina
  rationale: ‘Katika safina’ pamoja na ‘akaingia’ huonyesha mwendo wa kuingia ndani. תֵּבָה kwa kawaida hutafsiriwa ‘safina’ katika simulizi la Nuhu.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: 'Katika muktadha huu kihusishi kinaonyesha sababu: waliingia safinani kwa sababu ya maji ya gharika.'
- source_word: מֵי הַמַּבּוּל
  choice: maji ya gharika
  rationale: Tafsiri hii huhifadhi nomino zote mbili za Kiebrania, ‘maji’ na ‘gharika,’ kwa lugha ya kawaida na yenye hadhi.
