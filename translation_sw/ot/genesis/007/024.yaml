  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: sw
  text: Maji yakawa na nguvu juu ya dunia kwa siku mia moja na hamsini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya nchi” badala ya “juu ya dunia”; neno la Kiebrania אֶרֶץ linaweza kumaanisha mojawapo kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: yakatawala
  rationale: Kitenzi גבר katika muktadha wa gharika kinaonyesha maji kuwa na nguvu na kushinda kabisa. “Yakatawala” ni Kiswahili cha kawaida kinachohifadhi wazo la nguvu na utawala wa maji, badala ya kusema tu yaliongezeka.
- source_word: הַמַּיִם
  choice: Maji
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, “maji” ndilo neno la kawaida la Kiswahili na linaendana vyema na muktadha wa gharika.
- source_word: עַל הָאָרֶץ
  choice: juu ya dunia
  rationale: עַל humaanisha “juu ya,” na אֶרֶץ hapa limetafsiriwa “dunia” kwa kuzingatia upeo wa jumla wa simulizi. Maana mbadala ya “nchi” imehifadhiwa katika tanbihi.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: kwa siku 150
  rationale: Usemi wa Kiebrania una maana ya muda wa siku mia moja na hamsini; “kwa siku 150” ni namna ya asili na wazi ya kuonyesha muda huo kwa Kiswahili.
theological_decisions:
- issue: Upeo wa maana ya אֶרֶץ katika simulizi la gharika
  choice: dunia
  alternative: nchi
  rationale: Muktadha wa karibu unaeleza gharika kwa maneno yenye upeo wa jumla, hivyo “dunia” inafaa zaidi hapa. Hata hivyo, kwa kuwa אֶרֶץ pia linaweza kumaanisha “nchi,” uwezekano huo haujaondolewa bali umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Yakatawala” hutoa kwa ufupi nguvu na ushindi wa maji katika simulizi.
