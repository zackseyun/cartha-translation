  text: Maji yakapanda dhiraa kumi na tano zaidi, na milima ikafunikwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבְרוּ
  choice: yakapanda juu
  rationale: Kitenzi kina wazo la maji kuongezeka na kuwa na nguvu; katika muktadha huu wa kupima kina, ‘yakapanda juu’ huwasilisha mwendo wa maji kwa Kiswahili cha kawaida.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה מִלְמַעְלָה
  choice: kwa dhiraa kumi na tano zaidi
  rationale: Huhifadhi kipimo cha kale ‘dhiraa’ na maana ya kuelekea juu/zaidi bila kuongeza ufafanuzi usiotajwa wazi katika Kiebrania.
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: na milima ikafunikwa
  rationale: Kauli tendwa ya Kiebrania imehifadhiwa kwa njia ya kawaida na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Kiwango ambacho dhiraa kumi na tano kinapimwa kutoka kwake
  choice: kwa dhiraa kumi na tano zaidi
  alternative: dhiraa kumi na tano juu ya milima
  rationale: Kiebrania kinasema ‘dhiraa kumi na tano kuelekea juu/zaidi’ kisha kwamba milima ilifunikwa; hakisemi wazi kuwa kipimo kilianzia kwenye vilele. Tafsiri iliyochaguliwa huhifadhi kutobainika huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Dhiraa’ imetumiwa kama kipimo cha kale kinachofahamika katika sajili ya Biblia; sentensi imewekwa kwa urahisi bila kuondoa mvutano wa kisemantiki wa maandishi ya Kiebrania.
