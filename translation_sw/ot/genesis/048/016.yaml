base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: sw
  text: Malaika aliyenikomboa kutoka katika mabaya yote[a], awabariki vijana hawa. Jina langu na jina la baba zangu, Abrahamu na Isaka, yaitwe juu yao[b]; nao waongezeke sana[c] katikati ya nchi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika madhara yote” au “kutoka katika kila taabu.” Neno la Kiebrania linaweza kumaanisha uovu wa kimaadili, msiba, au madhara.
    reason: lexical_alternative
  - marker: b
    text: Au, “waitwe kwa jina langu na kwa jina la baba zangu, Abrahamu na Isaka.” Nahau ya Kiebrania kwa neno halisi ni “jina langu na jina la baba zangu ... yaitwe juu yao.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wawe umati mkubwa.” Kitenzi cha Kiebrania ni adimu na hudokeza kuongezeka kwa wingi, huenda kwa taswira ya samaki.
    reason: lexical_alternative
  - marker: d
    text: Au, “katikati ya dunia.” Neno la Kiebrania linaweza kumaanisha “nchi” au “dunia,” kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: Malaika
  rationale: Katika muktadha huu מַלְאָךְ lina maana ya mjumbe wa mbinguni; “Malaika” ni la kawaida na halilazimishi utambulisho wake zaidi ya maandishi.
- source_word: הַגֹּאֵל אֹתִי
  choice: aliyenikomboa
  rationale: Kitenzi גאל hubeba wazo la kukomboa au kuokoa kwa kutenda kama mkombozi; wakati uliopita unafaa kwa ushuhuda wa Yakobo kuhusu maisha yake.
- source_word: מִכָּל רָע
  choice: kutoka katika mabaya yote
  rationale: רָע linaweza kumaanisha uovu, madhara, au taabu. “Mabaya yote” huhifadhi upana huo kuliko tafsiri inayochagua madhara pekee.
- source_word: יְבָרֵךְ
  choice: awabariki
  rationale: Yiqtol hii ina nguvu ya ombi katika baraka; umbo la Kiswahili “awabariki” linaiwasilisha kwa kawaida.
- source_word: הַנְּעָרִים
  choice: vijana hawa
  rationale: Neno linawahusu Efraimu na Manase. “Vijana hawa” ni la heshima na la kawaida kuliko “wavulana” katika muktadha wa baraka nzito.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי
  choice: Jina langu ... na yaitwe juu yao
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania ya jina kuitwa juu ya watu, huku umbo la wingi “yaitwe” likipatana na kiima ambatano katika Kiswahili.
- source_word: וְשֵׁם אֲבֹתַי אַבְרָהָם וְיִצְחָק
  choice: na jina la baba zangu, Abrahamu na Isaka
  rationale: Umoja “jina” unafuata Kiebrania na kudokeza utambulisho wa ukoo unaorithiwa.
- source_word: וְיִדְגּוּ לָרֹב
  choice: waongezeke sana
  rationale: Kitenzi adimu דגה hudokeza kuongezeka kwa wingi, labda kwa taswira ya samaki; tafsiri hii inatoa maana kuu kwa Kiswahili cha kawaida.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: katikati ya nchi
  rationale: אָֽרֶץ linaweza kuwa nchi au dunia. Muktadha wa wazao na urithi unapendelea “nchi,” huku uwezekano mpana ukibainishwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa “Malaika” katika baraka ya Yakobo
  choice: Kubaki na “Malaika” bila kufafanua asili au utambulisho wake
  alternative: Malaika kama udhihirisho wa Mungu, au kama kiumbe mjumbe anayemtumikia Mungu
  rationale: Kifungu kinamhusisha Malaika kwa karibu na kazi ya Mungu ya kumlinda Yakobo, lakini hakifafanui moja kwa moja utambulisho wake. Tafsiri haiamui mvutano huu wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa baraka umetolewa kwa viunganishi vya kutakia “awabariki,” “yaitwe,” na “waongezeke.” Nahau ya jina kuitwa juu ya watu imehifadhiwa katika matini, huku tanbihi ikitoa tafsiri laini zaidi.
