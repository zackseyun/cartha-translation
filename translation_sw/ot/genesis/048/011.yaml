  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: sw
  text: Israeli akamwambia Yosefu, “Sikutarajia kuuona uso wako, na tazama, Mungu amenijalia kuwaona hata wazao wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Ka- ya usimulizi inaendeleza simulizi kwa njia ya kawaida katika Kiswahili, huku kiambishi -mw- kikionyesha anayesemeshwa.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanatumia jina Israeli, si Yakobo; jina hilo limehifadhiwa bila kulinganisha majina kimyakimya.
- source_word: רְאֹה פָנֶיךָ
  choice: kuuona uso wako
  rationale: Huhifadhi taswira halisi na nguvu ya kihisia ya nahau ya Kiebrania, huku ikieleweka katika Kiswahili kama kumwona mtu ana kwa ana.
- source_word: לֹא פִלָּלְתִּי
  choice: Sikutarajia
  rationale: Katika muktadha huu kitenzi kina maana ya kutazamia au kudhani, si kusali kwa maana finyu.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi kiashiria cha mshangao na mkazo katika usemi wa Israeli kwa lugha ya kibiblia inayoeleweka.
- source_word: הֶרְאָה אֹתִי
  choice: amenijalia kuwaona
  rationale: Kauli ya kusababisha ya ראה inaonyesha kwamba Mungu alimpa Israeli fursa ya kuona; 'amenijalia kuwaona' ni ya asili na inaonyesha neema ya fursa hiyo bila kuongeza fundisho.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ni tafsiri ya kawaida ya cheo cha kimungu אֱלֹהִים katika muktadha huu.
- source_word: גַּם
  choice: hata
  rationale: 'Huonyesha ongezeko la kushangaza: Israeli hakumwona Yosefu tu, bali hata wazao wake.'
- source_word: זַרְעֶךָ
  choice: wazao wako
  rationale: Huwasilisha maana ya pamoja ya זרע kwa Kiswahili cha sasa bila kutumia 'mbegu,' ambayo ingesikika isiyo ya kawaida kwa watu katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya אֱלֹהִים katika simulizi la mababu
  choice: Mungu
  alternative: mungu
  rationale: Hapa neno linamtaja Mungu anayejulikana katika simulizi kama mhusika maalumu; herufi kubwa ni matumizi ya kawaida ya Kiswahili na haiongezi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'kuuona uso wako' umehifadhiwa kwa makusudi ili kudumisha taswira ya Kiebrania; 'wazao' ni wazi na wa kawaida kuliko tafsiri halisi 'mbegu.' Hakuna tanbihi iliyohitajika kwa sababu hakuna mbadala muhimu wa kimaandishi au wa kimaana unaohitaji kuonyeshwa.
