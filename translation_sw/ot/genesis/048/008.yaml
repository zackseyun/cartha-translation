  text: Israeli alipowaona wana wa Yosefu, akasema, “Hawa ni nani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipowaona
  rationale: Wayyiqtol inaendeleza simulizi na hapa inaweka mazingira ya kauli inayofuata; muundo wa Kiswahili ‘alipowaona’ unaonyesha kwa kawaida uhusiano huo wa wakati.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanatumia jina Israeli, si Yakobo; jina hilo limehifadhiwa kama lilivyo katika chanzo.
- source_word: אֶת
  choice: '[halijatafsiriwa kivyake]'
  rationale: Hiki ni kiashiria cha yambwa mahsusi katika Kiebrania, bila neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: בְּנֵי יוֹסֵף
  choice: wana wa Yosefu
  rationale: Muundo huu unamaanisha moja kwa moja ‘wana wa Yosefu’; tafsiri hii ni ya kawaida, wazi, na yenye hadhi katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akauliza
  rationale: Kitenzi chenyewe ni ‘akasema,’ lakini kwa kuwa kauli inayofuata ni swali, ‘akauliza’ ni Kiswahili cha asili kinachowasilisha tendo la usemi bila kubadili maana.
- source_word: מִי אֵלֶּה
  choice: Hawa ni nani?
  rationale: מִי huuliza utambulisho na אֵלֶּה ni kiwakilishi cha kuonyesha cha wingi; ‘Hawa ni nani?’ ndiyo mpangilio wa kawaida wa Kiswahili kwa watu waliopo.
