  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: sw
  text: Lakini watoto wako utakaozaa baada yao watakuwa wako[a]; wataitwa kwa jina la ndugu zao katika urithi wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uzao wako utakaokuwa nao baada yao.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hawangepokea sehemu tofauti za urithi wa kikabila, bali wangehesabiwa chini ya Efraimu na Manase.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: watoto wako
  rationale: Katika muktadha huu neno linarejelea watoto wengine wa Yosefu watakaozaliwa baada ya Efraimu na Manase; ‘watoto wako’ ni Kiswahili cha kawaida na hakipanui maana hadi vizazi vya mbali.
- source_word: הוֹלַדְתָּ
  choice: utakaowazaa
  rationale: Hifili ya ילד ikielekezwa kwa Yosefu humaanisha kuzaa au kupata watoto; usemi huu ni wa asili katika Kiswahili na unadumisha mtazamo wa baba bila kutumia lugha nzito ya ‘kuwazalisha’.
- source_word: אַחֲרֵיהֶם
  choice: baada yao
  rationale: Inarejelea wakati baada ya kuzaliwa kwa Efraimu na Manase na inafuata Kiebrania moja kwa moja.
- source_word: לְךָ יִהְיוּ
  choice: watakuwa wako
  rationale: Inaonyesha kuwa watoto hao watabaki kuhesabiwa kuwa wa Yosefu, tofauti na Efraimu na Manase ambao Yakobo amewachukua kuwa wake.
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: kwa majina ya ndugu zao
  rationale: Kiswahili hiki kinahifadhi wazo la kuitwa au kuhesabiwa kwa jina la ndugu zao katika mpangilio wa urithi; wingi ‘majina’ ni wa asili kwa kuwa ndugu wanaorejelewa ni wawili.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Huhifadhi neno la kifamilia la Kiebrania bila kuongeza majina ya Efraimu na Manase katika matini kuu.
- source_word: יִקָּרְאוּ
  choice: wataitwa
  rationale: Hii ndiyo maana ya moja kwa moja ya niphal ya קרא, huku muktadha ukidokeza pia kuhesabiwa chini ya jina fulani.
- source_word: בְּנַחֲלָתָם
  choice: katika urithi wao
  rationale: Huhifadhi neno נַחֲלָה na kulihusisha wazi na mgao wa urithi wa kikabila.
theological_decisions:
- issue: Hadhi ya watoto wa Yosefu watakaozaliwa baadaye
  choice: Matini inasema watakuwa wa Yosefu na wataitwa kwa majina ya ndugu zao katika urithi wao.
  alternative: Kusema moja kwa moja kwamba hawatapokea urithi tofauti wa kikabila.
  rationale: Maelezo ya mfumo wa urithi yanawekwa katika tanbihi badala ya kuingizwa katika matini, ili kutohalalisha zaidi ya usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa kishazi umefanywa wa asili kwa Kiswahili, huku uhusiano wa watoto hao na urithi wa ndugu zao ukihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
