  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: sw
  text: Yosefu akawachukua wote wawili—Efraimu katika mkono wake wa kulia, upande wa kushoto wa Israeli, na Manase katika mkono wake wa kushoto, upande wa kulia wa Israeli—akawasogeza karibu na Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: Kitenzi hiki kinaendeleza simulizi na kuonyesha Yosefu aliwachukua wanawe wote wawili ili kuwaweka mbele ya Israeli.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: upande wa kushoto wa Israeli / upande wa kulia wa Israeli
  rationale: Ingawa מִן kwa kawaida huweza kumaanisha ‘kutoka’, hapa misemo inaeleza mahali pa kila mwana kwa kulinganisha na Israeli; ‘upande wa’ ni ya asili katika Kiswahili na haiashirii mwendo kutoka upande huo.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: akawaleta karibu naye
  rationale: Huhifadhi maana ya kusogeza watu karibu na Israeli, huku kiwakilishi cha wingi kikirejelea wana wote wawili.
