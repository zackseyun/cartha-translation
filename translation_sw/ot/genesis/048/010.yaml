base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: sw
  text: Macho ya Israeli yalikuwa yamefifia kwa sababu ya uzee[a], naye hakuweza kuona. Basi Yosefu akawaleta karibu na Israeli[b], naye Israeli akawabusu na kuwakumbatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Macho ya Israeli yalikuwa mazito kwa sababu ya uzee.” Hii ni nahau inayomaanisha kwamba uwezo wake wa kuona ulikuwa umedhoofika.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakitaji Yosefu au Israeli kwa jina katika kishazi hiki; muktadha unaonyesha kwamba Yosefu ndiye aliyewaleta wanawe karibu na Israeli.
    reason: source_ambiguity
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: Macho ya Israeli
  rationale: Muundo wa umilikaji umetafsiriwa kwa Kiswahili cha kawaida, huku jina “Israeli” likihifadhiwa kama lilivyo katika maandishi ya Kiebrania.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: yalikuwa yamefifia kwa sababu ya uzee
  rationale: Kitenzi hicho kihalisi humaanisha “yalikuwa mazito,” lakini kinapotumiwa kuhusu macho kinaonyesha uwezo wa kuona uliodhoofika. “Yamefifia” hutoa maana ya nahau kwa lugha ya kawaida, na “kwa sababu ya uzee” huonyesha chanzo au sababu.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: hakuweza kuona
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kutoweza kuona.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: Yosefu akawaleta karibu na Israeli
  rationale: Hifili ya נגשׁ humaanisha kuwaleta karibu. Kiebrania hakitaji jina la mtendaji, lakini muktadha wa mstari wa 9 unaonyesha kuwa Yosefu ndiye anayewaleta wanawe kwa Israeli. Majina yametajwa ili kuzuia viwakilishi vya Kiswahili visitoe maana potovu.
- source_word: וַיִּשַּׁק לָהֶם
  choice: Israeli akawabusu
  rationale: Kiambishi cha wingi kimewasilishwa kwa “-wa-”. Jina “Israeli” limetajwa ili iwe wazi kwamba yeye, si Yosefu, ndiye anayewabusu.
- source_word: וַיְחַבֵּק לָהֶם
  choice: na kuwakumbatia
  rationale: “Kuwakumbatia” ni neno la asili, lenye hadhi inayofaa simulizi, linaloonyesha tendo la upendo.
theological_decisions:
- issue: Mtendaji wa וַיַּגֵּשׁ na mabadiliko ya mtendaji katika vitenzi vinavyofuata
  choice: Yosefu akawaleta karibu na Israeli, naye Israeli akawabusu na kuwakumbatia
  alternative: akawaleta karibu naye, akawabusu na kuwakumbatia
  rationale: Kitenzi cha Kiebrania hakimtaji mtendaji kwa jina, lakini ombi la Israeli katika mstari wa 9 na mfuatano wa matendo vinaunga mkono kwamba Yosefu aliwaleta wanawe kwake, kisha Israeli akawakumbatia. Ufafanuzi huu hauongezi dai la kiteolojia; unaepusha tu utata unaoweza kupotosha katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Majina ya wahusika yamerudiwa pale ambapo viwakilishi pekee vingefanya mtendaji aeleweke vibaya.
