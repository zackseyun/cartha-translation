  text: וַ/יִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת יְמִינ֜/וֹ וַ/יָּ֨שֶׁת עַל רֹ֤אשׁ אֶפְרַ֨יִם֙ וְ/ה֣וּא הַ/צָּעִ֔יר וְ/אֶת שְׂמֹאל֖/וֹ עַל רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת יָדָ֔י/ו כִּ֥י מְנַשֶּׁ֖ה הַ/בְּכֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: sw
  text: Ndipo Israeli akanyosha mkono wake wa kulia, akauweka juu ya kichwa cha Efraimu, ingawa ndiye aliyekuwa mdogo, na mkono wake wa kushoto juu ya kichwa cha Manase. Aliiweka mikono yake kwa kukusudia[a], kwa kuwa Manase ndiye aliyekuwa mzaliwa wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliivusha mikono yake.” Kifungu cha Kiebrania kinaweza kukazia kwamba aliipanga mikono yake kwa makusudi na kwa ustadi; muktadha unaonyesha kuwa kufanya hivyo kulihusisha kuivusha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akanyosha
  rationale: Katika muktadha wa tendo la mkono, kitenzi hiki humaanisha kunyoosha mkono, si kutuma.
- source_word: וַיָּשֶׁת
  choice: akauweka
  rationale: Hueleza kuweka mkono juu ya kichwa kwa tendo la makusudi.
- source_word: וְהוּא הַצָּעִיר
  choice: ingawa ndiye aliyekuwa mdogo
  rationale: 'Muundo huu unaonyesha hali ya kutarajiwa kinyume: Efraimu alipokea mkono wa kulia licha ya kuwa mdogo.'
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: Aliiweka mikono yake kwa kukusudia
  rationale: Kiebrania kinaweza kusisitiza upangaji wa mikono kwa akili na makusudi; muktadha unaonyesha kwamba mikono iliwekwa kwa kuvushwa. Tafsiri kuu huhifadhi wazo la makusudi huku tanbihi ikifafanua matokeo ya kimwili.
- source_word: הַבְּכֹר
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi maana ya kuzaliwa kwanza na umuhimu wake wa kijamii katika muktadha wa baraka.
theological_decisions:
- issue: Maana ya שִׂכֵּל אֶת יָדָיו
  choice: Yakobo aliweka mikono yake kwa makusudi, na katika muktadha aliivusha.
  alternative: Yakobo alivusha mikono yake.
  rationale: Muktadha unaonyesha wazi kwamba mkono wa kulia uliwekwa juu ya Efraimu na wa kushoto juu ya Manase. Hata hivyo, neno lenyewe linaweza kukazia upangaji wa makusudi au wa ustadi. Tafsiri na tanbihi kwa pamoja zinahifadhi maana zote bila kuingiza fundisho la baadaye kuhusu kubadilishwa kwa haki ya mzaliwa wa kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mzaliwa wa kwanza’ huhifadhi uzito wa kitamaduni wa הַבְּכֹר; ‘aliyekuwa mdogo’ ni ya kawaida na inaeleweka katika kulinganisha ndugu wawili.
