base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: sw
  text: Siku hiyo akawabariki[a], akisema, “Kupitia kwako Israeli atabariki, akisema, ‘Mungu akufanye uwe kama Efraimu na kama Manase.’” Naye akamweka Efraimu mbele ya Manase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndani yako Israeli atabariki,” yaani, Israeli atatumia majina ya Efraimu na Manase katika kuwabariki wengine.
    reason: Mbadala wa kileksika kwa בְּךָ na ufafanuzi wa matumizi ya kauli ya baraka.
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: akawabariki
  rationale: Kauli ya Piel ya ברך ina maana ya ‘kubariki,’ na kiambishi cha yambwa cha wingi kinawahusu Efraimu na Manase pamoja.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huhifadhi rejeo mahususi la wakati kwa Kiswahili cha kawaida na cha asili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni namna ya kawaida ya Kiswahili ya kuanzisha maneno yaliyonukuliwa moja kwa moja.
- source_word: בְּךָ
  choice: kupitia kwenu
  rationale: Ingawa Kiebrania kina kiambishi cha umoja, muktadha unawahusu hao wana wawili na majina yao kama kielelezo cha baraka. ‘Kupitia kwenu’ huwasilisha dhana ya chombo au rejeo bila kufafanua zaidi ya maandishi.
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: Israeli atabariki
  rationale: Wakati usiotimilika unaweza kueleza tendo la baadaye au desturi. Jina ‘Israeli’ limeachwa bila kupanuliwa ili lihifadhi maana ya Yakobo na ya watu watakaotokana naye.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: Mungu na akufanye uwe
  rationale: Muundo huu wa matamanio unafaa katika baraka; ‘akufanye uwe’ huwasilisha maana ya שׂים katika usemi wa kulinganisha.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: kama Efraimu na kama Manase
  rationale: Kurudia ‘kama’ kunahifadhi marudio ya kiambishi כ na mdundo wa Kiebrania.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: Naye akamweka Efraimu mbele ya Manase
  rationale: Huhifadhi picha halisi ya kumweka mmoja mbele ya mwingine pamoja na wazo linalodokezwa la kumpa Efraimu nafasi ya kwanza.
theological_decisions:
- issue: Rejeo la ‘Israeli’ katika kauli ya baraka
  choice: Israeli
  alternative: Yakobo; watu wa Israeli
  rationale: Kiebrania kinasema tu ‘Israeli.’ Kutopanua jina hilo huhifadhi uwezekano wa maana ya babu Yakobo na maana ya kijumuiya ya taifa lake.
- issue: Umoja wa בְּךָ na יְשִׂמְךָ katika muktadha wa wana wawili
  choice: ‘kwenu’ katika utangulizi wa kauli, lakini ‘akufanye’ ndani ya kauli ya baraka
  alternative: 'Kutumia umoja kila mahali: ‘kupitia kwako’'
  rationale: Kauli yenyewe ni mfano wa baraka anayoambiwa mtu mmoja, hivyo ‘akufanye’ ni umoja. Katika utangulizi, Efraimu na Manase kwa pamoja ndio rejeo la majina yatakayotumiwa; ‘kwenu’ huzuia Kiswahili kueleweka kana kwamba ni mmoja wao pekee, huku tanbihi ikihifadhi umbo la karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Basi’ huunganisha mstari na simulizi lililotangulia; ‘Naye’ huhifadhi kiunganishi cha Kiebrania bila kulazimisha hitimisho la kisababishi.
