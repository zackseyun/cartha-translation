base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: sw
  text: Mtu akamwarifu Yakobo, akisema, “Tazama, mwanao Yosefu amekuja kwako.” Ndipo Israeli akajitia nguvu, akaketi juu ya kitanda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב
  choice: Mtu akamwarifu Yakobo
  rationale: Kitenzi cha Kiebrania kina mtendaji ambaye hajatajwa. Kiswahili cha kawaida kinaweza kumwakilisha kwa ‘mtu’ bila kubuni utambulisho wake; ‘akamwarifu’ huwasilisha maana ya kumjulisha au kumpasha habari.
- source_word: וַיֹּאמֶר
  choice: akisema
  rationale: Huhifadhi kitenzi cha pili cha usemi katika Kiebrania na kukiunganisha kwa kawaida na taarifa iliyotangulia.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuelekeza usikivu linalolingana na nguvu ya הִנֵּה na linafaa kwa lugha ya heshima ya Maandiko.
- source_word: בִּנְךָ יוֹסֵף
  choice: mwanao Yosefu
  rationale: Huwasilisha moja kwa moja kirai cha umilikaji na jina la mtu kwa tahajia ya kawaida ya Kiswahili.
- source_word: בָּא אֵלֶיךָ
  choice: amekuja kwako
  rationale: Hali timilifu inaonyesha kuwasili kulikokamilika na ambako ni muhimu kwa hali ya sasa.
- source_word: וַיִּתְחַזֵּק
  choice: akajitia nguvu
  rationale: Muundo wa Hitpael una maana ya kujitia au kujipa nguvu; tafsiri hii huhifadhi urejezi huo bila kuufanya kuwa ujasiri wa kihisia pekee.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Huhifadhi badiliko la makusudi kutoka jina Yakobo kwenda Israeli kama lilivyo katika Kiebrania.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: akaketi juu ya kitanda
  rationale: Hutoa maana ya kuketi akiwa kitandani na kuhifadhi kihusishi ‘juu ya’ kilicho katika matini, bila kuongeza maelezo yasiyotajwa.
theological_decisions:
- issue: Kutumiwa kwa majina Yakobo na Israeli katika mstari mmoja
  choice: Kuhifadhi badiliko la jina kama lilivyo katika Kiebrania
  alternative: Kutumia Yakobo kote kwa ulaini wa mtindo
  rationale: Badiliko hilo linaweza kuwa na umuhimu wa kifasihi au kitheolojia; kulisawazisha kungefuta mvutano uliopo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Maandiko lakini kinachoeleweka kwa msomaji wa leo. ‘Tazama’ limetumiwa kwa mkazo wa kuelekeza usikivu, na sentensi imehifadhi vitendo vyote viwili vya kutoa taarifa na kusema.
