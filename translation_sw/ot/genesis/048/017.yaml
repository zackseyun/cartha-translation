  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: sw
  text: Yosefu alipoona kwamba baba yake alikuwa ameweka mkono wake wa kulia juu ya kichwa cha Efraimu, jambo hilo halikumpendeza[a]. Basi akaushika mkono wa baba yake ili auondoe juu ya kichwa cha Efraimu na kuuweka juu ya kichwa cha Manase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri iliyo karibu zaidi na nahau ya Kiebrania, “jambo hilo lilikuwa baya machoni pake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: alipoona kwamba
  rationale: Muundo huu unaonyesha wakati wa tukio na pia unatambulisha jambo aliloliona Yosefu kwa Kiswahili cha kawaida.
- source_word: יָשִׁית
  choice: alikuwa ameweka
  rationale: Kauli ya wakati uliopita timilifu inaonyesha kwamba Yosefu aliona mkono ukiwa tayari umewekwa.
- source_word: יַד יְמִינוֹ
  choice: mkono wake wa kulia
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja, inayohifadhi umuhimu wa mkono wa kulia katika tendo la kubariki.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: jambo hilo halikumpendeza
  rationale: Huwasilisha kwa Kiswahili cha asili maana ya nahau ya Kiebrania kwamba jambo lilikuwa baya au lisilopendeza machoni pake, bila kudokeza lazima uovu wa kimaadili.
- source_word: וַיִּתְמֹךְ
  choice: akaushika
  rationale: Kitenzi kinaweza kumaanisha kushikilia, kutegemeza, au kukamata; hapa Yosefu anaushika mkono wa baba yake ili kuuelekeza kwingine bila kulazimisha dhana ya nguvu kupita kiasi.
- source_word: לְהָסִיר אֹתָהּ
  choice: ili auondoe
  rationale: Kiambishi cha kusudi na kitenzi vinaonyesha nia ya kuutoa au kuugeuza mkono kutoka mahali ulipokuwa.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: juu ya kichwa cha Efraimu na kuuweka juu ya kichwa cha Manase
  rationale: Kiswahili huhitaji kukamilisha kwa uwazi mwendo kutoka kichwa kimoja hadi kingine; 'kuuweka juu ya' huhifadhi mwelekeo na mahali pa mwisho.
