translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia mtiririko wa kawaida wa simulizi huku ikihifadhi tendo halisi la kuweka na kuhamisha mkono. Nahau ya Kiebrania imewekwa katika Kiswahili laini kwenye matini, na umbo lake la karibu zaidi limeonyeshwa katika tanbihi.
