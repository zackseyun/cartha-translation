base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: sw
  text: Akambariki Yosefu, akasema, “Mungu ambaye baba zangu Abrahamu na Isaka walienenda mbele zake, Mungu ambaye amenichunga tangu mwanzo wa maisha yangu hadi leo,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: Akambariki Yosefu
  rationale: Inahifadhi kauli ya moja kwa moja ya Kiebrania kwamba Yakobo alimbariki Yosefu, bila kuibadili ili ilingane na kutajwa kwa wana wa Yosefu katika muktadha.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika Kiswahili, “Mungu” tayari ni jina mahususi na la kawaida katika mwito huu; kujaribu kuiga kibainishi cha Kiebrania kwa “yule Mungu” kungeweza kuleta utofautishaji usiokusudiwa.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: ambaye baba zangu ... waliishi mbele zake
  rationale: “Waliishi mbele zake” huhifadhi taswira ya mwenendo mzima wa maisha katika uwepo wa Mungu na chini ya macho yake, badala ya kuifupisha kuwa utii pekee.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abrahamu na Isaka
  rationale: Haya ndiyo maumbo ya kawaida ya majina haya katika Biblia za Kiswahili.
- source_word: הָרֹעֶה אֹתִי
  choice: ambaye amenichunga
  rationale: Kitenzi “kuchunga” kinadumisha taswira hai ya mchungaji anayelinda, kuongoza, na kukimu, huku wakati timilifu ukionyesha utunzaji ulioendelea hadi sasa.
- source_word: מֵעוֹדִי
  choice: tangu mwanzo wa maisha yangu
  rationale: Kauli hii inaonyesha kipindi cha mapema kabisa cha kuwako kwa Yakobo bila kuifunga maana kwenye ujana au tukio la kuzaliwa pekee.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hadi leo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwendelezo mpaka wakati wa kusema.
theological_decisions:
- issue: Nahau ya mababu kuenenda mbele za Mungu
  choice: baba zangu Abrahamu na Isaka waliishi mbele zake
  alternative: baba zangu Abrahamu na Isaka walienenda mbele zake
  rationale: “Waliishi mbele zake” ni Kiswahili cha sasa na cha kueleweka kinachohifadhi wazo la maisha yaliyoendeshwa katika uwepo wa Mungu, bila kuifanya nahau hiyo imaanishe tu kufuata au kutii.
- issue: Taswira ya Mungu kama mchungaji
  choice: Mungu ambaye amenichunga
  alternative: Mungu ambaye amekuwa mchungaji wangu
  rationale: Muundo wa kitenzi unahifadhi nguvu hai ya participio ya Kiebrania na taswira pana ya utunzaji wa mchungaji, bila kuipunguza kuwa utoaji wa chakula pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayosomeka kwa urahisi. Muundo wa baraka umeachwa wazi kwa kuwa sentensi inaendelea katika mstari unaofuata. Hakuna alama za tanbihi kwa sababu maelezo ya Kiingereza yaliyotolewa yanaonekana kuwa yamebadilishana mahali na hayalingani na vifungu vilivyowekewa alama.
