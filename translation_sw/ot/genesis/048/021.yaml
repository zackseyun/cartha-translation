  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: sw
  text: Kisha Israeli akamwambia Yosefu, “Tazama, ninakaribia kufa, lakini Mungu atakuwa pamoja nanyi[a] na atawarudisha katika nchi ya baba zenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinaweza pia kutafsiriwa, “na Mungu atakuwa pamoja nanyi.” Kiunganishi chake kwa kawaida ni “na,” lakini hapa huenda kinaonyesha utofautishaji: Israeli anakufa, lakini Mungu ataendelea kuwa pamoja nao. Pia, “nanyi” na “atawarudisha” ni maneno ya wingi, hivyo ahadi inaenea zaidi ya Yosefu peke yake hadi kwa familia au wazao wake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw ya usimulizi inaendeleza mfululizo wa matukio; “Kisha” ni Kiswahili cha sasa na cha asili kinachohifadhi mtiririko huo.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanatumia jina Israeli, si Yakobo; jina hilo limehifadhiwa.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha usemi kinachovuta fikira za msikilizaji; “Tazama” kina hadhi inayofaa bila kupoteza nguvu yake.
- source_word: אָנֹכִי מֵת
  choice: mimi niko karibu kufa
  rationale: Muundo wa kivumishi-tendo unaonyesha kifo kilicho karibu, si kwamba tayari amekufa.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: lakini Mungu atakuwa pamoja nanyi
  rationale: Ingawa waw kimsingi ni “na,” muktadha unaonyesha utofautishaji kati ya kufa kwa Israeli na kuendelea kwa uwepo wa Mungu.
- source_word: עִמָּכֶם
  choice: pamoja nanyi
  rationale: Kiambishi cha Kiebrania ni cha wingi; “nanyi” kinaonyesha wazi kwamba ahadi inawafikia zaidi ya Yosefu peke yake.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: na atawarudisha
  rationale: Hifili ya שוב ina maana ya kusababisha kurudi; “atawarudisha” huhifadhi maana hiyo ya kisababishi na wingi wa walengwa.
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: katika nchi ya baba zenu
  rationale: Huhifadhi kwa ukaribu usemi wa Kiebrania kuhusu nchi ya mababu wa kiume na maana ya nchi ya urithi.
theological_decisions:
- issue: Wahusika wanaorejelewa na viwakilishi vya wingi katika ahadi
  choice: Kutumia “nanyi” na “atawarudisha” ili kuhifadhi wingi.
  alternative: Kutumia umoja kana kwamba ahadi inaelekezwa kwa Yosefu peke yake.
  rationale: Viambishi vya Kiebrania ni vya wingi, hivyo ahadi inapanuka kwa familia au wazao wa Yosefu bila kulazimisha utambulisho wao kwa undani zaidi.
- issue: Nguvu ya waw kabla ya kauli kuhusu uwepo wa Mungu
  choice: Kutafsiri kwa “lakini.”
  alternative: Kutafsiri kwa “na.”
  rationale: '“Lakini” huonyesha utofautishaji unaoeleweka katika muktadha: Israeli atakufa, ila Mungu ataendelea kuwa pamoja nao; tanbihi inahifadhi uwezekano wa kiunganishi sahili.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. “Tazama” inadumisha uzito wa usemi, na maumbo ya wingi yamewekwa wazi kwa sababu Kiswahili, tofauti na Kiingereza, huyatofautisha.
