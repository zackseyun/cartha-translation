translation:
  language: sw
  text: Kisha Yosefu akawaondoa kutoka katikati ya magoti yake[a], naye akainama kifudifudi hadi ardhini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kando ya magoti yake.” Kirai cha Kiebrania kinaweza kueleza kwamba wavulana hao walikuwa karibu sana na Yakobo katika tukio la kuwabariki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: akawaondoa
  rationale: Hifili ya יצא ina maana ya kusababisha watoke; “akawaondoa” huonyesha kwamba Yosefu aliwaondoa wanawe kutoka mahali walipokuwa karibu na Yakobo bila kuongeza namna ya mwendo.
- source_word: אֹתָם
  choice: wa-
  rationale: Kiambishi cha yambwa katika “akawaondoa” kinawarejelea Efraimu na Manase.
- source_word: מֵעִם בִּרְכָּיו
  choice: kutoka katikati ya magoti yake
  rationale: Kirai cha Kiebrania kinaeleza mahali walipokuwa watoto karibu sana na Yakobo. “Katikati ya magoti yake” hutoa taswira ya kawaida ya tukio, huku tanbihi ikihifadhi uwezekano wa maana “kando ya magoti yake.”
- source_word: וַיִּשְׁתַּחוּ
  choice: akainama kifudifudi
  rationale: Kitenzi kinaonyesha kuinama kwa heshima; “kifudifudi” pamoja na “mpaka chini” huwasilisha mkao kamili unaoelezwa na kirai kinachofuata.
- source_word: לְאַפָּיו
  choice: kifudifudi
  rationale: Kirai hiki kwa maana halisi huelekeza uso wake chini; Kiswahili “kifudifudi” ni njia ya kawaida na yenye hadhi ya kueleza mkao huo.
- source_word: אָרְצָה
  choice: mpaka chini
  rationale: Umbo lenye kuelekeza la neno ‘ardhi/nchi’ hapa humaanisha kuelekea ardhini; “mpaka chini” huonyesha mwelekeo na ukamilifu wa kuinama.
theological_decisions:
- issue: Mrejelewa wa kiambishi cha umilikaji katika “magoti yake”
  choice: Magoti ya Yakobo
  alternative: Magoti ya Yosefu
  rationale: Muktadha unaonyesha Yosefu akiwaondoa wanawe kutoka mahali walipokuwa karibu na Yakobo baada ya Yakobo kuwakumbatia na kuwaweka kwa ajili ya baraka. Hivyo kiambishi cha nafsi ya tatu kwa kawaida kinamrejelea Yakobo; huu ni uamuzi wa kimuktadha, si wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akawaondoa” ni wazi na cha kawaida; “akainama kifudifudi mpaka chini” huonyesha ishara ya heshima bila kutumia lugha ya kimadhehebu. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kirai husika.
