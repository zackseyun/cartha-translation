  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: sw
  text: Yakobo akamwambia Yosefu, “Mungu Mwenyezi[a] alinitokea Luzu katika nchi ya Kanaani, akanibariki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “El Shaddai.” Kwa kawaida hutafsiriwa “Mungu Mwenyezi”; maana kamili ya Shaddai inajadiliwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa usimulizi wa Kiebrania unaendeleza tukio linalofuata; ‘akamwambia’ ni wa kawaida katika masimulizi ya Kiswahili na pia huonyesha mlengwa Yosefu.
- source_word: אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  rationale: Ni cheo cha Mungu. Tafsiri hii ni ya kawaida, yenye hadhi, na inaeleweka kwa urahisi, huku tanbihi ikihifadhi mjadala kuhusu maana kamili ya Shaddai.
- source_word: נִרְאָה אֵלַי
  choice: alinitokea
  rationale: Kitenzi hiki kinaeleza kujidhihirisha kwa kuonekana; ‘alinitokea’ ni Kiswahili cha kawaida bila kuongeza maelezo yasiyosemwa wazi katika Kiebrania.
- source_word: בְּלוּז
  choice: huko Luzu
  rationale: ‘Huko’ huonyesha mahali ambapo tukio lilitokea kwa mtiririko wa kawaida wa Kiswahili; Luzu ni umbo la jina la mahali linalofaa katika Kiswahili.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Huhifadhi neno ‘nchi’ lililo wazi katika muundo wa Kiebrania na kutaja eneo kwa usahihi.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: akanibariki
  rationale: Kiambishi ‘aka-’ kinaendeleza mfuatano wa tendo la mhusika yuleyule, naye kiambishi ‘-ni-’ kinahifadhi maana ya ‘mimi.’
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu אֵל שַׁדַּי
  choice: Mungu Mwenyezi
  alternative: El Shaddai; Mungu Mwenye Nguvu
  rationale: ‘Mungu Mwenyezi’ hutafsiri cheo kwa Kiswahili sanifu na hudumisha maana iliyozoeleka. Kwa kuwa maana mahususi ya שַׁדַּי bado inajadiliwa, umbo la Kiebrania linawekwa katika tanbihi ili kutoficha utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa usimulizi umetumia ‘aka-’ kwa mtiririko wa kawaida, bila kuingiza ufafanuzi wa kimadhehebu.
