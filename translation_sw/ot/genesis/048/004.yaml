base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: sw
  text: Akaniambia, “Tazama, nitakufanya uzae sana na uongezeke; nitakufanya kuwa kusanyiko la mataifa, nami nitawapa wazao wako baada yako ardhi hii iwe milki ya milele.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Tazama
  rationale: Huhifadhi kishazi cha kuvuta fikira na kusisitiza ahadi inayofuata, kwa lugha ya kibiblia inayoeleweka katika Kiswahili.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: nitakufanya uzae sana na kuwa wengi
  rationale: Huwakilisha kwa kawaida jozi ya vitenzi vya Kiebrania kuhusu kuzaa na kuongezeka, bila kuvifupisha kuwa wazo moja.
- source_word: לִקְהַל עַמִּים
  choice: kuwa kusanyiko la mataifa
  rationale: ‘Kusanyiko’ huhifadhi maana ya קהל, huku ‘mataifa’ ikionyesha wingi wa עמים bila kuamua ikiwa makundi hayo ni makabila au jamii nyingine.
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: wazao wako baada yako
  rationale: ‘Wazao’ ni uwasilishaji wa kawaida wa maana ya pamoja ya זרע katika muktadha wa ukoo.
- source_word: אֲחֻזַּת עוֹלָם
  choice: milki yao ya milele
  rationale: ‘Milki’ huonyesha ardhi inayoshikiliwa kama mali ya kudumu; kiwakilishi ‘yao’ kinafafanua kwa kawaida kwamba milki hiyo ni ya wazao waliotajwa.
theological_decisions:
- issue: Muda na upeo wa ahadi ya nchi
  choice: milele
  alternative: daima
  rationale: ‘Milele’ huhifadhi uzito na upeo usiofafanuliwa wa עוֹלָם bila kuingiza mfumo wa kiteolojia unaoeleza namna ahadi hiyo inavyotimizwa.
- issue: Utambulisho wa ‘kusanyiko la mataifa’
  choice: kusanyiko la mataifa
  alternative: jumuiya ya watu wa mataifa mbalimbali
  rationale: Tafsiri ya karibu inaacha wazi utambulisho na muundo wa makundi yanayoahidiwa, badala ya kuufafanua kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ahadi wenye vipashio vinavyofuatana umehifadhiwa, lakini sentensi imetiririshwa kwa uakifishaji wa kawaida wa Kiswahili.
