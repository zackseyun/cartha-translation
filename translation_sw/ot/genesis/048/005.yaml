base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: sw
  text: Na sasa, wana wako wawili waliozaliwa kwako katika nchi ya Misri kabla sijaja kwako nchini Misri ni wangu. Efraimu na Manase watakuwa wangu, kama vile Rubeni na Simeoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Efraimu na Manase watahesabiwa kuwa wana wa Yakobo mwenyewe, wenye hadhi kama ya Rubeni na Simeoni. Kirai “kabla sijaja” kinaweza kutafsiriwa kwa namna rasmi zaidi, “hadi nilipokuja kwako nchini Misri.”
    reason: Ufafanuzi wa kitamaduni na mbadala wa kileksia.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Hudumisha kiunganishi cha hotuba na mkazo wa hatua mpya katika maneno ya Yakobo.
- source_word: שְׁנֵי בָנֶיךָ
  choice: wana wako wawili
  rationale: Ni Kiswahili cha kawaida kinachohifadhi idadi na umilikaji.
- source_word: הַנּוֹלָדִים לְךָ
  choice: waliozaliwa kwako
  rationale: Huwasilisha kirai elezi cha Kiebrania kwa lugha ya asili na iliyo wazi.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi neno אֶרֶץ, ‘nchi’, lililotajwa wazi katika chanzo.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרַיְמָה
  choice: kabla sijaja kwako Misri
  rationale: Katika muktadha, עַד huweka mpaka wa wakati na kuwabainisha wana waliozaliwa kabla ya Yakobo kufika; ‘Misri’ huhifadhi mahali palipotajwa tena katika Kiebrania.
- source_word: לִי הֵם
  choice: ni wangu
  rationale: Huhifadhi dai fupi na lenye nguvu la Yakobo bila kuingiza istilahi ya kisheria isiyopo katika chanzo.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: Efraimu na Manase
  rationale: Haya ni maumbo ya majina yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: kama vile Rubeni na Simeoni
  rationale: Huonyesha ulinganisho wa hadhi unaowakilishwa na kiambishi כ.
- source_word: יִהְיוּ לִי
  choice: watakuwa wangu
  rationale: Huhifadhi kauli ya wakati ujao na mwangwi wa ‘ni wangu’ katika sehemu iliyotangulia.
theological_decisions:
- issue: Maana ya dai la Yakobo juu ya Efraimu na Manase
  choice: Kutafsiri moja kwa moja kuwa ‘ni wangu’ na ‘watakuwa wangu,’ huku maelezo yakifafanua hadhi yao.
  alternative: Kusema wazi, ‘ninawafanya kuwa wana wangu’ au ‘ninawaasili.’
  rationale: Kiebrania kinaonyesha kuhesabiwa kwao kuwa wana wa Yakobo, lakini hakitumii istilahi mahsusi ya kisheria ya kuasili; hivyo tafsiri haibainishi kupita kiasi namna ya tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; marudio ya ‘Misri’ yamehifadhiwa kwa kuwa yapo wazi katika Kiebrania.
