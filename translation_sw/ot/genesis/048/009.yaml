  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אָבִ֔י/ו בָּנַ֣/י הֵ֔ם אֲשֶׁר נָֽתַן לִ֥/י אֱלֹהִ֖ים בָּ/זֶ֑ה וַ/יֹּאמַ֕ר קָֽחֶ/ם נָ֥א אֵלַ֖/י וַ/אֲבָרֲכֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: sw
  text: Yosefu akamwambia baba yake, “Hawa ni wanangu ambao Mungu amenipa hapa[a].” Naye akasema, “Tafadhali walete kwangu[b], nami nitawabariki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali hapa.” Usemi wa Kiebrania unaweza kuelekeza kwa umahususi zaidi mahali Yosefu alipokuwa.
    reason: lexical_alternative
  - marker: b
    text: Au “Wachukue, tafadhali, uwalete kwangu ili niwabariki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל אָבִיו
  choice: Yosefu akamwambia baba yake
  rationale: Muundo wa “aka-” unaendeleza mfuatano wa kisimulizi wa waw-consecutive kwa Kiswahili cha kawaida, huku “baba yake” ikihifadhi uhusiano wa kifamilia na hadhi ya simulizi.
- source_word: בָּנַי הֵם
  choice: Hawa ni wanangu
  rationale: בָּנַי ni wana wa kiume, lakini katika Kiswahili “wanangu” ni utambulisho wa kawaida na wa asili kwa wana wa mtu katika muktadha huu; “hawa” inaonyesha wale waliokuwa mbele yao.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: ambao Mungu amenipa
  rationale: “Amenipa” huonyesha tendo la zamani lenye matokeo ya sasa, na “Mungu” ni umoja unaodaiwa wazi na muktadha.
- source_word: בָּזֶה
  choice: hapa
  rationale: Neno hili la kuashiria linaweza kumaanisha “hapa” au kwa umahususi zaidi “mahali hapa”; “hapa” ni la asili na huhifadhi upeo huo bila kuufafanua kupita kiasi.
- source_word: קָחֶם נָא אֵלַי
  choice: Tafadhali walete kwangu
  rationale: Ingawa לָקַח mara nyingi ni “chukua,” mwelekeo אֵלַי (“kwangu”) na muktadha wa kuwasogeza watoto kwa Yakobo hufanya “walete kwangu” kuwa Kiswahili cha kawaida. “Tafadhali” huwakilisha chembe ya ombi נָא.
- source_word: וַאֲבָרֲכֵם
  choice: nami nitawabariki
  rationale: Huhifadhi uhusiano wa ombi na kusudi/tendo linalofuata kwa kauli ya moja kwa moja na ya asili.
theological_decisions:
- issue: Rejeo la אֱלֹהִים katika kauli ya Yosefu
  choice: Mungu, kwa umoja, akiwa mtoaji wa wana wa Yosefu
  alternative: mungu au miungu kwa maana ya jumla
  rationale: Muktadha wa simulizi la mababu unaonyesha kwamba Yosefu anamrejelea Mungu mmoja anayemwabudu; tafsiri hii haiongezi ufafanuzi wa kimadhehebu.
- issue: Nguvu ya וַאֲבָרֲכֵם baada ya ombi
  choice: nami nitawabariki
  alternative: ili niwabariki
  rationale: Kitenzi kinaweza kueleweka kama hatua inayokusudiwa kufuata ombi. Kauli ya wakati ujao ni ya kawaida, huku tanbihi ikihifadhi uwezekano wa kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa kisimulizi umetumia “aka-”; mazungumzo yamewekwa kwa lugha ya kawaida bila kupunguza uzito wa baraka ya baba.
