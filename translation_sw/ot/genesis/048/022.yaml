  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: sw
  text: Nami mwenyewe ninakupa sehemu moja zaidi ya ndugu zako[a], ambayo niliitwaa kutoka mkononi mwa Mwamori kwa upanga wangu na kwa upinde wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שְׁכֶם (shekhem) linaweza kumaanisha “sehemu,” lakini pia “bega” au “mwinuko,” na huenda likawa mwangwi wa jina la mahali Shekemu. Huenda mstari huu unakusudia kudokeza kwa pamoja fungu la ziada na eneo ambalo baadaye lilihusishwa na Yosefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Nami mwenyewe
  rationale: Kiwakilishi huru kinaongeza msisitizo kwa msemaji; “Nami mwenyewe” kinaonyesha msisitizo huo kwa Kiswahili cha kawaida bila kubadili uhusiano wa sentensi.
- source_word: נָתַתִּי
  choice: ninakupa
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umbo timilifu, hapa kinaweza kuwa tamko la utoaji linalotekeleza kitendo wakati wa baraka; wakati wa sasa unafaa katika Kiswahili.
- source_word: שְׁכֶם אַחַד
  choice: sehemu moja
  rationale: Katika muktadha wa urithi, “sehemu moja” ndiyo maana inayoeleweka zaidi, huku maana nyingine za שְׁכֶם na mwangwi wa jina Shekemu vikihifadhiwa katika tanbihi.
- source_word: עַל אַחֶיךָ
  choice: zaidi ya ndugu zako
  rationale: עַל inaonyesha nyongeza au faida hapa; usemi huu unaeleza wazi kwamba Yosefu anapokea fungu la ziada.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: ambayo niliitwaa
  rationale: “Niliitwaa” linawasilisha moja kwa moja kitendo cha kuchukua, bila kueleza zaidi namna ya upatikanaji kuliko chanzo kinavyosema.
- source_word: מִיַּד הָאֱמֹרִי
  choice: kutoka mkononi mwa Mwamori
  rationale: Usemi wa Kiebrania “kutoka mkononi mwa” umehifadhiwa kwa maana ya kutoka katika mamlaka au milki ya mtu; umoja wa “Mwamori” pia umehifadhiwa.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: kwa upanga wangu na kwa upinde wangu
  rationale: Silaha zote mbili zimetafsiriwa moja kwa moja, na kurudiwa kwa “kwa” kunaakisi muundo wa Kiebrania na kudumisha taswira ya kivita.
theological_decisions:
- issue: Maana ya שְׁכֶם na uhusiano wake na jina la mahali Shekemu pamoja na fungu la ziada la Yosefu
  choice: Kutumia “sehemu moja” katika matini kuu na kuhifadhi maana nyingine pamoja na mwangwi wa Shekemu katika tanbihi.
  alternative: “bega/mwinuko mmoja” au “Shekemu, sehemu moja”
  rationale: Muktadha unaunga mkono maana ya fungu la urithi, lakini neno la Kiebrania linaweza pia kumaanisha bega, ubavu au mwinuko na linafanana kabisa na jina Shekemu. Tanbihi huhifadhi utata na mchezo wa maneno bila kulazimisha tafsiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nami mwenyewe” huhifadhi msisitizo wa kiwakilishi, huku “ninakupa” likitoa tamko hai la utoaji. Nahau ya “kutoka mkononi mwa” imehifadhiwa kwa kuwa inaeleweka na inafuata taswira ya chanzo.
