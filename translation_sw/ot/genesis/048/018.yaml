base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: sw
  text: Yosefu akamwambia baba yake, “Sivyo, baba yangu, kwa maana huyu ndiye mzaliwa wa kwanza. Weka mkono wako wa kuume juu ya kichwa chake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wenye waw-consecutive unaendeleza tukio; ‘akamwambia’ ni wa kawaida na wa asili katika masimulizi ya Kiswahili.
- source_word: אֶל אָבִיו
  choice: baba yake
  rationale: Inaonyesha kwa kawaida kuwa Yosefu alisema maneno hayo kwa baba yake; kitenzi ‘akamwambia’ tayari hubeba maana ya kuelekeza usemi kwa mtu.
- source_word: לֹא כֵן
  choice: Sivyo
  rationale: Ni kauli fupi ya kusahihisha inayohifadhi upinzani wa moja kwa moja bila kuwa kali kupita kiasi.
- source_word: אָבִי
  choice: baba yangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kimetafsiriwa wazi, na usemi huo unahifadhi heshima ya Yosefu kwa baba yake.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hilo linaanzisha sababu ya Yosefu kusahihisha uwekaji wa mkono.
- source_word: זֶה
  choice: huyu
  rationale: Kiwakilishi hiki cha kuonyesha kinadumisha hali ya Yosefu kumwonyesha mwana aliyekuwa mbele yao.
- source_word: הַבְּכֹר
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi maana ya mpangilio wa kuzaliwa pamoja na hadhi ya kifamilia inayohusika katika baraka.
- source_word: שִׂים
  choice: Weka
  rationale: Ni amri ya moja kwa moja, ya kawaida, na ya asili katika Kiswahili cha sasa.
- source_word: יְמִינְךָ
  choice: mkono wako wa kuume
  rationale: Muktadha unahusu mkono wa kuume katika tendo la kubariki; kutaja ‘mkono’ huondoa utata.
- source_word: עַל רֹאשׁוֹ
  choice: juu ya kichwa chake
  rationale: Ni tafsiri ya kawaida na wazi ya mahali mkono ulipotakiwa kuwekwa.
theological_decisions:
- issue: Neno la hadhi katika muktadha wa baraka
  choice: mzaliwa wa kwanza
  alternative: mkubwa
  rationale: '‘Mzaliwa wa kwanza’ huhifadhi zaidi ya tofauti ya umri: linaonyesha mpangilio wa kuzaliwa na hadhi ya kifamilia inayohusiana na baraka, bila kuongeza ufafanuzi wa kimadhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na hadhi inayofaa maandiko. ‘Sivyo, baba yangu’ hudumisha protesti yenye heshima; ‘mkono wa kuume’ ni wazi na inafahamika kwa wasomaji wa kawaida.
