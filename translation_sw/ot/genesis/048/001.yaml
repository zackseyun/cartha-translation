base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: sw
  text: Baada ya mambo hayo, mtu fulani akamwambia Yosefu, “Tazama, baba yako ni mgonjwa.” Basi Yosefu akawachukua wanawe wawili pamoja naye, Manase na Efraimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo hayo
  rationale: Kifungu hiki kinaunganisha tukio jipya na simulizi lililotangulia. Kiswahili hakihitaji kutafsiri וַיְהִי kwa fomula tofauti; mwanzo huu ni wa asili na huhifadhi uhusiano wa wakati bila kuongeza neno lisilokuwapo kama ‘sasa’.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: mtu fulani akamwambia Yosefu
  rationale: Kitenzi cha nafsi ya tatu umoja hakimtaji msemaji. ‘Mtu fulani’ huhifadhi kutotajwa kwake kwa njia ya wazi na ya kawaida katika Kiswahili, bila kubuni utambulisho.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta usikivu wa msikilizaji. ‘Tazama’ ni usemi mfupi, wenye heshima na unaofaa katika simulizi la Biblia.
- source_word: אָבִיךָ חֹלֶה
  choice: baba yako ni mgonjwa
  rationale: Hutoa hali ya sasa ya baba ya Yosefu kwa Kiswahili sanifu na cha moja kwa moja.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: Basi Yosefu akawachukua wanawe wawili pamoja naye
  rationale: ‘Basi’ na kiambishi cha mfululizo ‘aka-’ vinaendeleza simulizi. Jina ‘Yosefu’ limetumiwa badala ya kiwakilishi pekee ili kurejelea mtendaji kwa uwazi baada ya msemaji asiyejulikana.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Manase na Efraimu
  rationale: Haya ndiyo maumbo ya majina yaliyozoeleka katika Biblia za Kiswahili na yanawatambulisha wana wawili waliotajwa.
theological_decisions:
- issue: Utambulisho wa aliyemjulisha Yosefu
  choice: 'msemaji ameachwa bila kutambulishwa: ‘mtu fulani’'
  alternative: kutaja mjumbe au kusema tu ‘akaambiwa’
  rationale: Kiebrania hakimtaji msemaji; tafsiri haipaswi kubuni utambulisho wake. Usemi tendaji huhifadhi muundo wa chanzo na kutokujulikana kwake.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetiririka kwa ‘aka-’; majina yametolewa kwa maumbo yaliyozoeleka: Yosefu, Manase, na Efraimu.'
