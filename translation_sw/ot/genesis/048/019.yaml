  text: וַ/יְמָאֵ֣ן אָבִ֗י/ו וַ/יֹּ֨אמֶר֙ יָדַ֤עְתִּֽי בְנִ/י֙ יָדַ֔עְתִּי גַּם ה֥וּא יִֽהְיֶה לְּ/עָ֖ם וְ/גַם ה֣וּא יִגְדָּ֑ל וְ/אוּלָ֗ם אָחִ֤י/ו הַ/קָּטֹן֙ יִגְדַּ֣ל מִמֶּ֔/נּוּ וְ/זַרְע֖/וֹ יִהְיֶ֥ה מְלֹֽא הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: sw
  text: Lakini baba yake akakataa, akasema, “Najua, mwanangu, najua. Yeye pia atakuwa taifa, naye pia atakuwa mkuu. Hata hivyo, ndugu yake mdogo atakuwa mkuu kuliko yeye, na uzao wake utakuwa utimilifu wa mataifa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umati wa mataifa.” Kiebrania kwa maana ya karibu zaidi ni “utimilifu wa mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: akakataa
  rationale: Kitenzi מאן kinaonyesha kukataa kwa makusudi, si kusita tu; hapa Yakobo anakataa jaribio la Yosefu la kubadili mikono yake.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: Najua, mwanangu, najua
  rationale: Marudio ya Kiebrania yanadumishwa ili kuhifadhi msisitizo, na usemi huu ni wa kawaida katika Kiswahili.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: Yeye pia atakuwa taifa
  rationale: עָם ni kundi la watu lenye utambulisho wa pamoja; katika muktadha wa uzao wa kikabila, “taifa” ni Kiswahili cha asili na kinachoeleweka zaidi kuliko “watu” katika umoja.
- source_word: וְגַם הוּא יִגְדָּל
  choice: naye pia atakuwa mkuu
  rationale: גדל hapa inaeleza ukuu au umaarufu wa baadaye, wala si kukua kimwili tu.
- source_word: וְאוּלָם
  choice: Hata hivyo
  rationale: Kiunganishi hiki kinaweka tofauti yenye nguvu kati ya ukuu wa Manase na ukuu mkubwa zaidi wa Efraimu.
- source_word: אָחִיו הַקָּטֹן
  choice: ndugu yake mdogo
  rationale: הקטן hapa inahusu mdogo kwa kuzaliwa, hivyo “ndugu yake mdogo” ni tafsiri ya kawaida.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: atakuwa mkuu kuliko yeye
  rationale: מן ya ulinganisho inaonyesha kwamba ndugu mdogo atampita Manase kwa ukuu.
- source_word: וְזַרְעוֹ
  choice: na uzao wake
  rationale: “Uzao” huhifadhi maana ya pamoja ya זרע na ni neno la heshima linalofaa katika Kiswahili cha Biblia.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: utakuwa utimilifu wa mataifa
  rationale: Tafsiri hii huhifadhi neno מְלֹא, “utimilifu/ujazo,” badala ya kulifafanua moja kwa moja kuwa wingi, hivyo inadumisha utata wa asili.
theological_decisions:
- issue: Maana ya מְלֹא הַגּוֹיִם
  choice: utimilifu wa mataifa
  alternative: umati wa mataifa
  rationale: Kirai cha Kiebrania kinaweza kueleweka kama wingi mkubwa wa mataifa, lakini kina maana halisi ya “utimilifu wa mataifa.” Matini kuu huhifadhi mvutano huo na tanbihi hutoa maana mbadala bila kuamua mapema mwangwi wake wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya msisitizo yamehifadhiwa, na kirai kisicho cha kawaida “utimilifu wa mataifa” kimeachwa katika matini kwa uaminifu kwa Kiebrania huku tanbihi ikisaidia ufafanuzi.
