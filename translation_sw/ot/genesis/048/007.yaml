base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: sw
  text: Nami, nilipokuwa nikitoka Padani[a], Raheli alikufa nikiwa naye[b] katika nchi ya Kanaani, njiani, kukiwako bado na umbali fulani[c] kabla ya kufika Efrata. Nikamzika huko njiani kuelekea Efrata, yaani Bethlehemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “Padani” tu; vifungu vingine vina jina kamili “Padani-Aramu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “alikufa juu yangu.” Usemi huu unaweza kumaanisha kwamba Raheli alikufa Yakobo akiwa karibu naye, au unaweza kusisitiza uzito binafsi wa kifo chake kwa Yakobo.
    reason: lexical_alternative
  - marker: c
    text: Usemi wa Kiebrania unaonyesha sehemu fulani ya safari iliyokuwa imebaki; umbali kamili haujulikani.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiwakilishi huru pamoja na kiunganishi kinaonyesha mgeuko wa mada na msisitizo wa kumbukumbu binafsi ya Yakobo; “Lakini mimi” ni ya kawaida na hudokeza utofautishaji huo.
- source_word: בְּבֹאִי מִפַּדָּן
  choice: nilipokuwa nikitoka Padani
  rationale: Ingawa kitenzi kinaweza kutafsiriwa kwa namna ya moja kwa moja kuwa “nilipokuja kutoka,” katika muktadha Yakobo anakumbuka safari yake kutoka Padani; muundo huu ni wa asili katika Kiswahili na hauongezi “Aramu,” ambalo halipo hapa.
- source_word: מֵתָה עָלַי
  choice: alikufa nikiwa naye
  rationale: Kirai hicho kwa karibu ni “alikufa juu yangu” na kinaweza kuonyesha ukaribu wa Yakobo wakati wa kifo pamoja na uzito wake binafsi. Tafsiri hii huhifadhi upande wa uwepo bila kuamua kwamba maana ni huzuni pekee.
- source_word: בְּאֶרֶץ כְּנַעַן בַּדֶּרֶךְ
  choice: katika nchi ya Kanaani, njiani
  rationale: Huhifadhi maelezo kamili ya kijiografia na maana ya kawaida ya דרך katika safari.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: kukiwa bado na umbali fulani kufika Efrata
  rationale: כברת ארץ ni usemi wa kipimo kisicho bayana cha sehemu ya safari iliyobaki; “umbali fulani” huepuka kutoa kipimo bandia.
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: Nikamzika huko
  rationale: Muundo wa simulizi unaonyesha kitendo kilichofuata; “nikamzika” ni fasaha na huhifadhi nafsi ya kwanza.
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: njiani kuelekea Efrata
  rationale: Hutoa kwa uwazi mahali pa maziko kuhusiana na njia ya kwenda Efrata.
- source_word: הִוא בֵּית לָחֶם
  choice: yaani Bethlehemu
  rationale: Kirai hiki ni ufafanuzi wa utambulisho wa Efrata; “yaani” ni njia ya kawaida ya Kiswahili ya kuwasilisha ufafanuzi huo.
theological_decisions:
- issue: Maana ya מֵתָה עָלַי
  choice: alikufa nikiwa naye
  alternative: alikufa kwa huzuni yangu; alikufa karibu nami
  rationale: Kiebrania kina utata wa kweli kati ya ukaribu/uwepo na uzito binafsi wa kifo hicho. Maandishi makuu hayafanyi maana ya kihisia kuwa ndiyo pekee, na tanbihi inaeleza uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza mwendelezo wa simulizi. Majina yametolewa kama Padani, Kanaani, Efrata, na Bethlehemu.
