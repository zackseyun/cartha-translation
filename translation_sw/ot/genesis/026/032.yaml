base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: sw
  text: Ikawa siku hiyo, watumishi wa Isaka wakaja wakamweleza kuhusu kisima walichochimba, wakamwambia, “Tumepata maji.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Kirai cha wakati kinataja siku ileile ya matukio yaliyotangulia. Katika Kiswahili cha simulizi, “Siku hiyo” ni cha asili na kinabeba maana bila kulazimika kutafsiri fomula וַיְהִי kwa maneno tofauti.
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi בוא hapa kinaeleza mwendo wa kuja kwa Isaka; “wakaja” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עַבְדֵי יִצְחָק
  choice: watumishi wa Isaka
  rationale: עבד inaweza kumaanisha mtumwa au mtumishi, lakini muktadha huu unawaonyesha wafanyakazi wa nyumba ya Isaka bila kusisitiza hadhi yao ya kijamii; “watumishi” ni pana, sahihi, na yenye heshima.
- source_word: וַיַּגִּדוּ לוֹ
  choice: na kumweleza
  rationale: Hifili ya נגד humaanisha kutoa habari au taarifa. “Kumweleza” inaonyesha kuwa walimpa taarifa kuhusu kisima kwa Kiswahili cha asili.
- source_word: עַל אֹדוֹת הַבְּאֵר
  choice: kuhusu kisima
  rationale: Kirai עַל אֹדוֹת kina maana ya “kuhusu” au “juu ya”; “kuhusu kisima” ni wazi na cha kawaida.
- source_word: אֲשֶׁר חָפָרוּ
  choice: walichokuwa wamechimba
  rationale: Kishazi hiki kinakitambulisha kisima na kuonyesha kuwa uchimbaji ulitangulia taarifa yao. Muundo huu wa Kiswahili unaweka wazi mfuatano huo.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: wakamwambia
  rationale: Inahifadhi utangulizi wa usemi wa moja kwa moja uliopo katika Kiebrania kwa njia fupi na ya kawaida katika simulizi la Kiswahili.
- source_word: מָצָאנוּ מָיִם
  choice: Tumepata maji
  rationale: “Tumepata” linaonyesha ugunduzi wenye matokeo yanayoendelea kuwa muhimu wakati wa kutoa taarifa; “maji” haliongezi wazo la kiasi ambalo halipo katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi ya simulizi. Muundo wa vitenzi mfululizo “wakaja… wakamwambia” unafuatisha kwa ufasaha mwendo wa masimulizi ya Kiebrania bila kutumia lugha ya kizamani. Hakuna tanbihi iliyohitajika kwa kuwa tofauti za kileksika hazibadili maana kuu ya mstari.
