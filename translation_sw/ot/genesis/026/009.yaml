revisions:
- from: Basi Abimeleki akamwita Isaka, akamwambia, “Hakika, yeye ni mke wako! Basi, uliwezaje kusema, ‘Yeye ni dada yangu’?” Isaka akamjibu, “Kwa sababu nilifikiri, ‘Nisije nikafa kwa sababu yake.’”[a]
  to: Abimeleki akamwita Isaka, akamwambia, “Hakika, yeye ni mke wako! Na uliwezaje kusema, ‘Yeye ni dada yangu’?” Isaka akamwambia, “Kwa sababu nilisema, ‘Nisije nikafa[a] kwa sababu yake.’”
  rationale: The revision restores the explicit Hebrew speech verb in Isaac’s explanation and makes the footnote’s fuller contextual sense clearly alternative. It otherwise preserves the draft’s accurate, natural rendering of the emphatic declaration and reproachful question.
