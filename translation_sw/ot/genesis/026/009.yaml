base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: sw
  text: Abimeleki akamwita Isaka, akamwambia, “Hakika, yeye ni mke wako! Na uliwezaje kusema, ‘Yeye ni dada yangu’?” Isaka akamwambia, “Kwa sababu nilisema, ‘Nisije nikafa[a] kwa sababu yake.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nisije nikauawa kwa sababu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: akamwita Isaka
  rationale: קרא pamoja na לְ kwa mtu humaanisha kumwita au kumwagiza aje; “akamwita” ni ya kawaida, wazi, na inadumisha urahisi wa simulizi.
- source_word: אַךְ הִנֵּה
  choice: Hakika
  rationale: Muungano huu unasisitiza ugunduzi wa Abimeleki. “Hakika” huonyesha tamko lenye msisitizo bila kugeuza maneno hayo kuwa swali; הִנֵּה imewakilishwa katika nguvu ya mshangao wa sentensi nzima.
- source_word: אִשְׁתְּךָ הִוא
  choice: yeye ni mke wako
  rationale: Hii ndiyo maana ya moja kwa moja ya kishazi, na kiwakilishi “yeye” kinadumisha msisitizo uliopo katika mpangilio wa Kiebrania.
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: Basi, uliwezaje kusema
  rationale: וְ pamoja na אֵיךְ huanzisha swali la kukemea lenye mshangao. “Basi, uliwezaje” ni Kiswahili cha asili kinachobeba uhusiano na tamko lililotangulia.
- source_word: אֲחֹתִי הִוא
  choice: Yeye ni dada yangu
  rationale: אחות maana yake ya kawaida ni “dada”; hakuna sababu ya kupanua hapa kuwa jamaa wa kike.
- source_word: כִּי אָמַרְתִּי
  choice: Kwa sababu nilifikiri
  rationale: כִּי huanzisha sababu ya Isaka. Katika muktadha huu אמרתי ni kauli ya ndani moyoni, hivyo “nilifikiri” ni Kiswahili cha kawaida kuliko tafsiri halisi “nilisema,” bila kubadili hoja yake.
- source_word: פֶּן אָמוּת
  choice: Nisije nikafa
  rationale: פֶּן pamoja na kitenzi kisichotimilika huonyesha matokeo yanayohofiwa; “nisije nikafa” ni muundo wa kawaida wa Kiswahili unaohifadhi wazo hilo.
- source_word: עָלֶיהָ
  choice: kwa sababu yake
  rationale: 'עַל katika msemo huu huonyesha chanzo au sababu: Isaka alihofia kufa kwa sababu ya Rebeka.'
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka ya Kiswahili: Abimeleki na Isaka. Tamko la אַךְ הִנֵּה limehifadhiwa kama tamko lenye msisitizo, si swali.'
