base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: sw
  text: Kisha Isaka akachimba tena visima vya maji vilivyokuwa vimechimbwa wakati wa Abrahamu, baba yake[a], ambavyo Wafilisti walikuwa wameviziba baada ya kifo cha Abrahamu, akaviita kwa majina yale yale ambayo baba yake alikuwa ameviita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi, “Isaka akarudi akachimba.” Kitenzi cha Kiebrania kinaweza kumaanisha kurudi, lakini hapa huenda kimetumiwa kuonyesha kwamba tendo lilifanywa tena: “akachimba tena.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: akachimba tena
  rationale: Muundo wa kitenzi שוב kikifuatwa na kitenzi kingine huonyesha kurudia au kuanza tena tendo. Kiswahili ‘akachimba tena’ huwasilisha maana hiyo kwa kawaida bila kudokeza isivyohitajika kwamba Isaka alirudi kutoka safari.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: visima vya maji
  rationale: Huhifadhi usemi wa Kiebrania na ni lugha ya kawaida ya Kiswahili inayosisitiza kwamba vilikuwa vyanzo vya maji.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: vilivyokuwa vimechimbwa katika siku za Abrahamu baba yake
  rationale: Kitenzi cha wingi kina mtendaji asiyetajwa; muundo wa kutendwa ni wa kawaida na mwaminifu. ‘Katika siku za’ huhifadhi nahau ya wakati ya Kiebrania.
- source_word: וַיְסַתְּמוּם
  choice: walikuwa wameviziba
  rationale: סתם humaanisha kuziba au kufunga. ‘Kuviziba’ linafaa kwa visima bila kutaja nyenzo iliyotumiwa.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili katika Kiswahili cha Biblia.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: baada ya kifo cha Abrahamu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya uhusiano wa wakati.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת
  choice: Akaviita kwa majina
  rationale: Hufuatilia kwa karibu kitenzi קרא, ‘kuita,’ huku ikionyesha kuwa majina yalipewa visima.
- source_word: כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: kwa majina ambayo baba yake alikuwa amevipa
  rationale: Kiambishi כ kinaonyesha ulinganifu na majina ya awali. Muktadha unaweka wazi kwamba Isaka alitumia majina ambayo baba yake alikuwa amevipa visima hivyo.
