source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: sw
  text: Nami nitauzidisha uzao wako kama nyota za mbinguni, nami nitaupa uzao wako nchi hizi zote; na katika uzao wako mataifa yote ya dunia yatabarikiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mataifa yote ya dunia yatajibariki kwa uzao wako.” Kitenzi cha Kiebrania kinaweza kueleweka kwa maana ya kujirejelea, ingawa maana ya kutendwa inafaa vizuri katika muktadha wa ahadi ya agano.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Nami nitauzidisha
  rationale: Kauli ya Hifili ya רבה inaonyesha Mungu akisababisha ongezeko kubwa. “Nitauzidisha” ni ya moja kwa moja na inafaa katika ahadi ya agano.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: זֶרַע ni nomino ya umoja yenye maana ya jumla, inayoweza kurejelea kizazi au wazao. “Uzao” huhifadhi maana hiyo ya kijumla na pia mwangwi wake katika ahadi ya agano.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: kama nyota za mbinguni
  rationale: “Kama” huonyesha wazi tashbihi ya כ, na “mbinguni” ni usemi wa Kiswahili wa asili unaohifadhi mtindo ulioinuliwa wa Kiebrania.
- source_word: וְנָתַתִּי
  choice: nami nitaupa
  rationale: נתן kimsingi ni “kutoa.” Muundo “nitaupa uzao wako” ni wa kawaida katika Kiswahili na huhifadhi Mungu kama mtendaji wa ahadi.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: nchi hizi zote
  rationale: Katika muktadha wa ahadi ya eneo, אֲרָצוֹת humaanisha nchi au maeneo; “nchi hizi zote” ni ya kawaida na huhifadhi maana elekezi ya הָאֵל, “hizi.”
- source_word: וְהִתְבָּרֲכוּ
  choice: yatabarikiwa
  rationale: Usomaji wa hali ya kutendwa unafaa vizuri katika muktadha wa ahadi ya agano, lakini uwezekano wa maana ya kujirejelea umehifadhiwa katika tanbihi.
- source_word: בְזַרְעֲךָ
  choice: katika uzao wako
  rationale: “Katika” huhifadhi kwa ukaribu kihusishi בְּ bila kukifafanua kimadhehebu kuwa lazima ni “kupitia” au “kwa njia ya,” hivyo mvutano wa kimaana unabaki.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: mataifa yote ya dunia
  rationale: גּוֹיִם hurejelea makundi ya watu au mataifa; “mataifa” ndilo chaguo la kawaida na linalofaa katika ahadi hii ya ulimwengu mzima.
theological_decisions:
- issue: Maana ya kauli וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  choice: katika uzao wako mataifa yote ya dunia yatabarikiwa
  alternative: mataifa yote ya dunia yatajibariki kwa uzao wako
  rationale: Hali ya kutendwa inaendana vizuri na ahadi ya baraka katika muktadha wa agano. Hata hivyo, umbo la kitenzi cha Kiebrania linaweza kueleweka kwa maana ya kujirejelea; kwa hiyo usomaji huo haujaondolewa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uzao” limetumiwa mara zote tatu ili kuhifadhi urudiaji wa זֶרַע na maana yake ya kijumla. Alama ya tanbihi imewekwa baada ya kauli ya baraka inayohusika nayo.
