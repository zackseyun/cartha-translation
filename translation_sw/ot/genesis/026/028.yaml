base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: sw
  text: Nao wakasema, “Tumeona waziwazi kwamba Yahweh amekuwa pamoja nawe. Kwa hiyo tukasema, ‘Tafadhali, kuwe na kiapo[a] kati yetu, kati yetu na wewe[b], nasi tufanye agano nawe.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “kiapo chenye laana,” kwa kuwa neno la Kiebrania linaweza kumaanisha kiapo kinachoambatana na laana inayotamkwa dhidi ya atakayekivunja.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania hurudia kwa msisitizo: “kati yetu, kati yetu na wewe.”'
    reason: source_texture
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakasema
  rationale: Inaendeleza mtiririko wa masimulizi unaoonyeshwa na waw-consecutive bila kuongeza mpangilio mkali wa wakati.
- source_word: רָאוֹ רָאִינוּ
  choice: Tumeona waziwazi
  rationale: Urudiaji wa infinitive absolute pamoja na kitenzi kilichokamilika unasisitiza dai; ‘waziwazi’ huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: kwamba Yahweh amekuwa pamoja nawe
  rationale: Kauli timilifu ya Kiebrania inaeleza hali ya wakati uliopita yenye umuhimu wa sasa; ‘amekuwa pamoja nawe’ inadumisha maana hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja katika chanzo, kwa hiyo linanakiliwa badala ya kubadilishwa kuwa cheo.
- source_word: וַנֹּאמֶר
  choice: Kwa hiyo tukasema
  rationale: ‘Kwa hiyo’ huonyesha kwa kawaida kwamba pendekezo lao lilitokana na walichokuwa wameona.
- source_word: תְּהִי נָא
  choice: Tafadhali na pawe na
  rationale: Huhifadhi ombi la heshima linaloonyeshwa na hali ya jussive pamoja na chembe נָא.
- source_word: אָלָה
  choice: kiapo
  rationale: Katika muktadha wa mapatano, ‘kiapo’ ndiyo tafsiri wazi zaidi; uwezekano wa maana ya laana inayoambatana na kiapo umehifadhiwa katika tanbihi.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: kati yetu, kati yako na sisi
  rationale: Inahifadhi urudiaji rasmi wa Kiebrania kwa mpangilio unaoeleweka katika Kiswahili.
- source_word: וְנִכְרְתָה בְרִית
  choice: nasi tufanye agano
  rationale: ‘Kufanya agano’ ni usemi wa asili wa Kiswahili unaowasilisha nahau ya Kiebrania ambayo kihalisi ni ‘kukata agano’.
- source_word: עִמָּךְ
  choice: nawe
  rationale: Inawasilisha kwa ufupi na kwa usahihi kihusishi kinachomwelekea Isaka katika umoja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi; ‘Yahweh’ hulihifadhi kwa unukuzi bila kulibadilisha kuwa cheo.
- issue: Nguvu ya neno אָלָה
  choice: kiapo katika matini, pamoja na tanbihi kuhusu kiapo chenye laana
  alternative: kiapo cha laana katika matini
  rationale: Neno linaweza kumaanisha kiapo kinachoambatana na laana inayomwangukia anayekivunja, lakini muktadha haudai maana hiyo kali iwekwe wazi katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa Kiebrania umehifadhiwa kwa kiasi bila kufanya sentensi iwe nzito; ‘pamoja nawe,’ ‘kati yako na sisi,’ na ‘agano nawe’ ni maumbo ya kawaida na yanayoeleweka.
