  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: sw
  text: Basi Isaka akaondoka huko, akapiga kambi katika Bonde la Gerari[a], akakaa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika njia ya mkondo wa maji wa msimu ya Gerari.” Neno la Kiebrania linaweza kumaanisha njia ya mkondo wa maji wa msimu, korongo, au bonde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: akaondoka huko
  rationale: Muunganiko huu unaonyesha Isaka aliondoka mahali alikokuwa awali; ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: וַיִּחַן
  choice: akapiga kambi
  rationale: Kitenzi חנה humaanisha kusimamisha au kuweka kambi. ‘Akapiga kambi’ ni Kiswahili cha sasa, cha kawaida na kinachoeleweka.
- source_word: בְּנַחַל גְּרָר
  choice: katika Bonde la Gerari
  rationale: נחל linaweza kumaanisha bonde, korongo, au njia ya maji ya msimu. ‘Bonde’ linaeleweka kwa urahisi, huku tanbihi ikihifadhi upana wa maana ya neno la Kiebrania.
- source_word: וַיֵּשֶׁב שָׁם
  choice: akakaa huko
  rationale: ישב linaweza kumaanisha kukaa, kuishi, au kufanya makao. ‘Akakaa huko’ huhifadhi kutokubainika kwa muda au kudumu kwa makao kuliko ‘akafanya makao’.
