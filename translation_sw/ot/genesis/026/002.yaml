base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: sw
  text: Ndipo Yahwe akamtokea, akamwambia, “Usishuke kwenda Misri. Kaa katika nchi nitakayokuambia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kwa karibu zaidi, “Kaa katika nchi nitakayosema kwako,” yaani, nitakayokuambia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: akamtokea
  rationale: Nifali ya ראה hapa inaonyesha kujidhihirisha au kuonekana kwa mtu. “Akamtokea” ni Kiswahili cha kawaida kinachofaa kwa kujidhihirisha kwa Mungu bila kubainisha jinsi alivyotokea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: וַיֹּאמֶר
  choice: na kumwambia
  rationale: Kitenzi אמר pamoja na kiwakilishi cha yambwa “kwake” kinatafsiriwa kwa Kiswahili cha kawaida kuwa “kumwambia,” badala ya “kusema kwake.”
- source_word: אַל תֵּרֵד
  choice: Usishuke
  rationale: אַל pamoja na kitenzi kisichotimilika huleta amri ya kukataza. “Usishuke” pia huhifadhi namna ya Kiebrania ya kusema kuhusu safari ya kuelekea Misri.
- source_word: מִצְרָיְמָה
  choice: kwenda Misri
  rationale: Kiishio cha mwelekeo kinaonyesha mwendo kuelekea Misri. “Kwenda Misri” kinaweka mwelekeo huo wazi na ni cha kawaida katika Kiswahili.
- source_word: שְׁכֹן
  choice: Kaa
  rationale: Amri ya שכן inamaanisha kukaa au kuishi mahali. “Kaa” ni ya asili na inaweza kuonyesha kubaki na kuishi katika eneo hilo bila kuongeza wazo la kujenga makazi ya kudumu.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ hapa ni nchi au eneo ambamo Isaka anapaswa kukaa, si dunia kwa ujumla.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: nitakayokuambia
  rationale: Kiebrania kwa karibu zaidi ni “ambayo nitakuambia/nisemayo kwako.” Katika muktadha, “nitakayokuambia” ni Kiswahili cha asili kinachoonyesha mwongozo ambao Mungu atatoa, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi na Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Jinsi Mungu alivyomtokea Isaka
  choice: akamtokea
  alternative: akajifunua kwake
  rationale: “Akamtokea” huhifadhi dai la maandishi kwamba Yahwe alionekana au alijidhihirisha, lakini halielezi namna ya tukio hilo kuliko Kiebrania kinavyofanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida; “Usishuke” huhifadhi nahau ya kijiografia ya Kiebrania, na tanbihi huhifadhi ugumu halisi wa אֲשֶׁר אֹמַר אֵלֶיךָ.
