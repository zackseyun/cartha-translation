  yaml_path: translation/ot/genesis/026/014.yaml
  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: sw
  text: Alikuwa na makundi ya kondoo na mbuzi, makundi ya ng’ombe, na watumishi wengi[a]; nao Wafilisti wakamwonea wivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “na huduma/kazi nyingi”; huenda kirai hiki kinamaanisha watumishi au wafanyakazi wengi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Alikuwa na
  rationale: Muundo wa Kiebrania היה + ל unaonyesha umiliki; ‘alikuwa na’ ni Kiswahili cha kawaida na sahihi.
- source_word: מִקְנֵה צֹאן
  choice: makundi ya kondoo na mbuzi
  rationale: צֹאן humaanisha mifugo midogo, hasa kondoo na mbuzi; kutaja zote mbili ni wazi zaidi kuliko ‘kondoo’ peke yake.
- source_word: וּמִקְנֵה בָקָר
  choice: makundi ya ng’ombe
  rationale: בָקָר ni ng’ombe kama mifugo, na ‘makundi’ hudumisha maana ya mali nyingi za mifugo.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: watumishi wengi
  rationale: Katika muktadha wa utajiri wa mifugo, kirai hiki kinaelekea kumaanisha kundi kubwa la watu waliotoa huduma au kufanya kazi, ingawa Kiebrania kinaweza pia kueleweka kuwa kazi au huduma nyingi.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: wakamwonea wivu
  rationale: קנא hapa inaonyesha wivu ulioelekezwa kwa Isaka kwa sababu ya mafanikio yake; huu ni usemi wa asili katika Kiswahili.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
