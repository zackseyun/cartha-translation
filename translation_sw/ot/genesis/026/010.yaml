base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: sw
  text: Abimeleki akasema, “Ni nini hiki ulichotutendea? Mmoja wa watu angeweza kwa urahisi[a] kulala na mke wako, nawe ungekuwa umetuletea hatia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “karibu”: “Mmoja wa watu angekuwa karibu kulala na mke wako.”'
    reason: Neno la Kiebrania כִּמְעַט linaweza kueleza jambo lililokaribia kutokea moja kwa moja, badala ya uwezekano mkubwa tu.
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Ni nini hiki ulichotutendea?
  rationale: Inahifadhi mshangao na lawama katika muundo wa Kiebrania, pamoja na maana ya tendo lililowahusu watu wote, kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: כִּמְעַט
  choice: angeweza kwa urahisi
  rationale: Katika muktadha huu neno linaonyesha kwamba jambo hilo lingeweza kutokea kwa urahisi au lilikaribia kutokea. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi maana mbadala ya moja kwa moja, ‘alikuwa karibu.’
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: kulala na mke wako
  rationale: ‘Kulala na’ ni nahau ya Kiswahili iliyo wazi lakini yenye staha kwa mahusiano ya kingono, sawasawa na matumizi ya nahau ya Kiebrania.
- source_word: אַחַד הָעָם
  choice: mmoja wa watu
  rationale: Inadumisha umoja usiotajwa kwa jina pamoja na nomino ya jumla ‘watu,’ bila kuibadili waziwazi kuwa ‘mmoja wa wanaume.’
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: nawe ungekuwa umetuletea hatia
  rationale: ‘Hatia’ inaonyesha uwajibikaji halisi wa kimaadili uliowapata watu, si kulaumiwa kijamii tu. Muundo wa hali timilifu unaonyesha matokeo ambayo yangekuwa yametokea.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: Abimeleki akasema
  rationale: Muundo huu ni wa kawaida na wa asili kwa kuendeleza masimulizi ya Kiswahili bila kuongeza ufafanuzi wa wakati usiokuwamo katika chanzo.
theological_decisions:
- issue: Maana ya אָשָׁם katika muktadha huu
  choice: hatia
  alternative: lawama; kosa
  rationale: Muktadha unahusu uwajibikaji wa kimaadili ambao ungewapata Abimeleki na watu wake kwa tendo hilo, wala si sifa mbaya au lawama ya kijamii pekee. ‘Hatia’ inadumisha uzito huo bila kuingiza hapa maana maalumu ya sadaka ya hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. ‘Kulala na’ inadumisha nahau ya chanzo bila kuwa ya kitabibu au ya mtaani.
