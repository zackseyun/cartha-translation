base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: sw
  text: Na visima vyote ambavyo watumishi[a] wa baba yake walikuwa wamechimba wakati wa Abrahamu, baba yake, Wafilisti waliviziba na kuvijaza udongo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa.” Neno la Kiebrania עֶבֶד linaweza kumaanisha mtumishi au mtumwa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania עָפָר linaweza pia kutafsiriwa “mavumbi” au “ardhi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: Na visima vyote
  rationale: “Na” linawakilisha kiunganishi וְ, huku “visima vyote” likihifadhi maana ya jumla ya כָל na nomino בְּאֵרֹת.
- source_word: אֲשֶׁר חָפְרוּ
  choice: ambavyo ... walikuwa wamechimba
  rationale: Kishazi hiki kinavieleza visima; wakati timilifu unaonyesha kwamba kuchimba kulitokea kabla ya kitendo cha Wafilisti.
- source_word: עַבְדֵי אָבִיו
  choice: watumishi wa baba yake
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Muktadha huu haulazimishi kusisitiza hali ya utumwa, hivyo “watumishi” ni ya kawaida na yenye hadhi, huku uwezekano mwingine ukibainishwa katika tanbihi.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: wakati wa Abrahamu, baba yake
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida usemi wa Kiebrania “katika siku za,” na inadumisha utambulisho unaorudiwa kwamba Abrahamu alikuwa baba yake.
- source_word: סִתְּמוּם
  choice: waliviziba
  rationale: Kitenzi hiki humaanisha kuziba au kufunga kisima; kiambishi “-vi-” kinaonyesha wazi kuwa visima ndivyo vilivyozibwa.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina sanifu la Kiswahili la kundi hili la watu.
- source_word: וַיְמַלְאוּם עָפָר
  choice: na kuvijaza udongo
  rationale: Kiambishi cha yambwa katika Kiebrania kinarejelea visima na kimewakilishwa kwa “-vi-.” “Udongo” ni tafsiri ya kawaida na inayofaa muktadha ya עָפָר.
