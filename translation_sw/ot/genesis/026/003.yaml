  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: sw
  text: Kaa katika nchi hii kama mgeni[a], nami nitakuwa pamoja nawe na kukubariki, kwa maana nitawapa wewe na uzao wako[b] nchi hizi zote, nami nitalithibitisha[c] lile kiapo nilichomwapia Abrahamu baba yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ishi kwa muda katika nchi hii.” Kitenzi cha Kiebrania kinaweza kumaanisha kukaa kama mkazi wa muda au mgeni.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mbegu”; hapa neno hilo lina maana ya pamoja, yaani uzao.
    reason: lexical_alternative
  - marker: c
    text: Au, “nitalisimamisha” au “nitalitimiza” lile kiapo.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: Kaa kama mgeni
  rationale: Kitenzi kina maana ya kukaa mahali kama mkazi wa muda au mgeni; tafsiri hii inahifadhi wazo hilo kwa Kiswahili cha kawaida.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: katika nchi hii
  rationale: Katika muktadha huu אֶרֶץ ni eneo la kijiografia linalohusishwa na ahadi.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: nami nitakuwa pamoja nawe
  rationale: Inahifadhi kauli ya uwepo wa Mungu bila kuongeza maelezo ya kiufafanuzi.
- source_word: וַאֲבָרְכֶךָ
  choice: na kukubariki
  rationale: Inaendeleza kwa njia ya asili mfululizo wa ahadi unaoanza na ‘nitakuwa pamoja nawe.’
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa msingi wa agizo na ahadi inayotangulia.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: wewe na uzao wako
  rationale: זֶרַע ni nomino ya mkusanyiko; ‘uzao’ huhifadhi taswira ya mbegu na pia maana ya watu watakaotokana na Isaka.
- source_word: אֶתֵּן
  choice: nitakupa
  rationale: Ni ahadi ya moja kwa moja ya kutoa; muundo huu pia unaonyesha wazi kwamba mpokeaji ni Isaka pamoja na uzao wake.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: nchi hizi zote
  rationale: Wingi wa אֶרֶץ unaelekeza kwenye maeneo mbalimbali; ‘nchi’ ni neno la asili na lenye heshima katika Kiswahili.
- source_word: וַהֲקִמֹתִי
  choice: nitalithibitisha
  rationale: Hifili ya קום hapa ina maana ya kukifanya kiapo kisimame kwa uthabiti, yaani kukithibitisha au kukitimiza; ‘kuthibitisha’ huepuka kudai kwamba kitendo hicho ni utimilifu wa mwisho.
- source_word: הַשְּׁבֻעָה
  choice: lile kiapo
  rationale: ‘Kiapo’ ni sahihi kuliko ‘ahadi’ kwa kuwa neno la Kiebrania linataja jambo lililoapwa kwa uzito.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: nilichomwapia
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba Mungu alimwapia Abrahamu.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: Abrahamu baba yako
  rationale: Inatambulisha kwa uwazi Abrahamu kuwa baba ya Isaka na kuhifadhi mwendelezo wa ahadi.
theological_decisions:
- issue: Lugha ya kuimarisha kiapo cha Mungu
  choice: nitalithibitisha lile kiapo nilichomwapia Abrahamu baba yako
  alternative: nitalitimiza lile kiapo; nitalisimamisha lile kiapo
  rationale: ‘Kuthibitisha’ huhifadhi maana ya kuimarisha au kufanya kiapo kiwe thabiti bila kuingiza istilahi ya kiteolojia ambayo haipo wazi katika mstari.
- issue: Maana ya pamoja ya זֶרַע
  choice: uzao wako
  alternative: mbegu yako; wazao wako
  rationale: ‘Uzao’ unaweza kutaja kwa pamoja wale watakaotokana na Isaka huku ukihifadhi uhusiano wa kileksia na taswira ya mbegu; hauamui kimya kimya masuala mapana ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kaa kama mgeni’ huweka wazi hali ya ukaaji wa muda; ‘uzao’ na ‘kiapo’ huhifadhi uzito wa lugha ya ahadi bila kutumia msamiati wa kimadhehebu.
