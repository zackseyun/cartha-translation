base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: sw
  text: Ikawa, baada ya Isaka kukaa huko kwa muda mrefu, Abimeleki, mfalme wa Wafilisti, akatazama kupitia dirishani, akaona, na kumbe Isaka alikuwa akicheza na Rebeka, mke wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akicheka pamoja na,” “akicheza kimahaba na,” au “akimbembeleza.” Kitenzi cha Kiebrania kinahusiana na jina Isaka na kinaweza kuonyesha mchezo au ukaribu wa kimahaba; katika muktadha huu mwenendo huo ulimwonyesha Abimeleki kwamba Rebeka alikuwa mke wa Isaka.
    reason: Kitenzi מְצַחֵק kina maana pana na kina mchezo wa maneno unaohusiana na jina la Isaka. Tanbihi huhifadhi uwezekano wa ukaribu unaodokezwa na muktadha bila kuufanya uwe maana pekee ya matini kuu.
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ikawa, ... alipokuwa
  rationale: Muundo huu unaendeleza simulizi na kuonyesha mazingira ya wakati kwa Kiswahili cha kawaida bila kutumia kauli ya kizamani.
- source_word: אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: Isaka alipokuwa amekaa huko kwa muda mrefu
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kwamba kukaa kwake huko kulirefuka; tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: akatazama nje kupitia dirishani
  rationale: Kitenzi kinaonyesha kutazama kutoka mahali fulani kupitia au nje ya dirisha; usemi huu unaepuka kuongeza wazo la kuchungulia kwa siri.
- source_word: וַיַּרְא וְהִנֵּה
  choice: akaona, na kumbe
  rationale: ‘Kumbe’ huwasilisha ugunduzi wa ghafla unaoonyeshwa na הִנֵּה kwa namna ya asili katika simulizi la Kiswahili.
- source_word: מְצַחֵק
  choice: alikuwa akicheza kimahaba
  rationale: Kitenzi kinaweza kumaanisha kucheka, kucheza, au kufanya tendo la ukaribu. Katika muktadha huu, mwenendo huo ulimwezesha Abimeleki kutambua kuwa Rebeka alikuwa mke wa Isaka; ‘akicheza kimahaba’ huhifadhi hali ya mchezo na dokezo la ukaribu bila kutaja tendo mahususi lisilosemwa wazi.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: na Rebeka mke wake
  rationale: Ingawa אֵת kwa kawaida ni alama ya yambwa, kitenzi katika matumizi haya kinahitaji uhusiano unaowasilishwa kwa kawaida kwa ‘na’ katika Kiswahili; ‘mke wake’ ni ufafanuzi wa Rebeka uliomo katika maandishi.
