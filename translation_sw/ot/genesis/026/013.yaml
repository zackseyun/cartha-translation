  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: sw
  text: Mtu yule akazidi kuwa mkuu; akaendelea kustawi, hata akawa mkuu sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: akawa mkuu
  rationale: Kitenzi גדל kinaweza kumaanisha kukua au kuwa mkuu kwa hadhi na mafanikio. Hapa tafsiri hii inadumisha urudiaji wa mzizi uleule katika mstari na haifupishi maana kuwa utajiri pekee.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: איש humrejelea Isaka kama mwanamume aliyetajwa katika muktadha. 'Yule mtu' ni usemi wa kawaida wa Kiswahili unaodumisha urejeleo huo bila ulazima wa kurudia jina lake.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: akaendelea kuzidi kuwa mkuu
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina na umbo endelevu unaonyesha ongezeko linaloendelea. Kiswahili 'akaendelea kuzidi' huwasilisha mwendo huo kwa ufasaha bila kutumia tafsiri isiyo ya kawaida ya 'kwenda na kukua'.
- source_word: עַד כִּי
  choice: hata
  rationale: Katika muktadha huu kifungu kinaonyesha kilele au matokeo ya ongezeko endelevu; 'hata' ni kiunganishi cha asili cha Kiswahili kwa maendeleo yanayofikia kiwango fulani.
- source_word: גָדַל מְאֹד
  choice: akawa mkuu sana
  rationale: '''Mkuu sana'' huhifadhi urudiaji wa גדל pamoja na nguvu ya מאוד, bila kuifanya maana iwe utajiri tu ingawa mali imo katika muktadha.'
