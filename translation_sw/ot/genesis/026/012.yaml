  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: sw
  text: Isaka alipanda mbegu katika nchi ile, na mwaka huo akapata mavuno mara mia[a]; naye Yahwe akambariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akapata vipimo mia.” Kiebrania kihalisi kinasema “akapata שְׁעָרִים mia,” nahau inayomaanisha mavuno mengi sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: alipanda mbegu
  rationale: Katika muktadha wa kilimo, זרע humaanisha kupanda mbegu; usemi huu ni wa kawaida na unaweka wazi tendo lenyewe.
- source_word: בָּאָרֶץ הַהִוא
  choice: katika nchi ile
  rationale: אֶרֶץ hapa hurejelea eneo alilokuwamo Isaka; “nchi ile” ni tafsiri ya moja kwa moja na ya asili kwa Kiswahili.
- source_word: וַיִּמְצָא
  choice: akapata mavuno
  rationale: Maana ya msingi ya מצא ni “kupata/kuona,” lakini hapa inahusu matokeo ya kilimo. “Akapata mavuno” huhifadhi kitenzi cha kupata huku ikifafanua muktadha.
- source_word: בַּשָּׁנָה הַהִוא
  choice: mwaka huo
  rationale: Ni usemi wa kawaida wa wakati unaolingana kwa karibu na Kiebrania.
- source_word: מֵאָה שְׁעָרִים
  choice: mara mia
  rationale: Ni nahau ya mavuno mengi sana, kwa kawaida ikieleweka kuwa mavuno yalikuwa mara mia ya kiasi kilichopandwa; tanbihi huhifadhi uwezekano wa “vipimo mia.”
- source_word: וַיְבָרֲכֵהוּ
  choice: akambariki
  rationale: ברך ni kitenzi cha kawaida cha “kubariki”; kinahifadhi kauli ya kitheolojia kwamba mafanikio ya Isaka yalitokana na baraka ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; “Yahwe” hulihifadhi kwa umbo linalotumika katika Kiswahili.
- issue: Namna ya kueleza matokeo ya kilimo ya Isaka
  choice: akapata mavuno mara mia
  alternative: akavuna mara mia; akapata vipimo mia
  rationale: Uteuzi huu unahifadhi maana ya msingi ya kitenzi “kupata” na wakati huohuo unaonyesha wazi kuwa yanayozungumziwa ni mavuno, bila kulazimisha maana moja ya שְׁעָרִים.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Alipanda mbegu” ni wazi zaidi kuliko “alipanda” peke yake, na “mavuno mara mia” ni usemi wa kawaida unaoeleweka kwa wasomaji wengi.
