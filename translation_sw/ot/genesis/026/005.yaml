base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: sw
  text: kwa sababu Abrahamu aliisikiliza sauti yangu na kuyashika maagizo yangu[a], amri zangu, sheria zangu, na mafundisho yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wajibu wangu.” Neno la Kiebrania humaanisha jambo au jukumu ambalo mtu anapaswa kulishika.
    reason: lexical_alternative
  - marker: b
    text: Au, “maagizo yangu” au “sheria zangu.” Neno la Kiebrania torah linaweza kumaanisha fundisho, agizo, au sheria kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: kwa sababu
  rationale: Katika muktadha huu neno hili linaonyesha sababu ya baraka iliyotajwa katika sentensi inayozunguka aya hii.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: aliisikiliza sauti yangu
  rationale: Huhifadhi taswira ya Kiebrania ya kuisikiliza sauti huku katika muktadha ikimaanisha kusikiliza kwa kuitii.
- source_word: וַיִּשְׁמֹר
  choice: na kuyashika
  rationale: Kitenzi שׁמר kina maana ya kushika, kutunza, au kuzingatia; 'kuyashika' ni usemi wa kawaida kwa wajibu na masharti ya Mungu.
- source_word: מִשְׁמַרְתִּי
  choice: maagizo niliyompa
  rationale: Neno hili hueleza jambo au wajibu uliokabidhiwa mtu alishike. Kauli hii ni ya asili kwa Kiswahili na inalitofautisha na 'amri' inayofuata.
- source_word: מִצְוֺתַי
  choice: amri zangu
  rationale: Hili ndilo neno la kawaida na lililo wazi kwa מִצְוָה katika muktadha wa wajibu wa agano.
- source_word: חֻקּוֹתַי
  choice: sheria zangu
  rationale: Huwasilisha masharti yaliyowekwa kwa mamlaka huku ikibaki tofauti na 'amri' na 'mafundisho' katika orodha.
- source_word: וְתוֹרֹתָי
  choice: na mafundisho yangu
  rationale: תוֹרָה linaweza kumaanisha fundisho, maagizo, au sheria. 'Mafundisho' huhifadhi upana wake bila kurudia 'sheria zangu' iliyotumiwa kwa חֻקּוֹתַי.
theological_decisions:
- issue: Mkusanyiko wa istilahi za kisheria na kiagano kabla ya Sinai
  choice: 'Kudumisha orodha ya istilahi tofauti: maagizo, amri, sheria, na mafundisho.'
  alternative: Kufupisha orodha kuwa kauli moja kama 'matakwa na sheria zangu,' au kufanya istilahi zote zifanane.
  rationale: Kiebrania kinakusanya maneno yenye maana zinazokaribiana ili kusisitiza utiifu mpana wa Abrahamu. Tafsiri haiamui kimafundisho jinsi istilahi hizi za kabla ya Sinai zinavyohusiana na Torati ya baadaye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unadumisha msisitizo wa orodha ya Kiebrania bila kutumia istilahi nzito zisizo za kawaida kwa msomaji wa kawaida.
