  footnotes:
  - marker: a
    text: Au, “ikiwa utatutendea mabaya.” Neno la Kiebrania אִם kwa kawaida humaanisha “ikiwa,” lakini hapa yaelekea linaingiza yaliyomo katika kiapo wanachomwomba Isaka.
    reason: lexical_alternative
  - marker: b
    text: Neno “kugusa” linaweza pia kuwa na maana ya “kudhuru” katika muktadha huu.
    reason: lexical_alternative
  - marker: c
    text: Au, “na tumekuacha uende kwa amani.”
    reason: previous_rendering
lexical_decisions:
- source_word: אִם
  choice: kwamba
  rationale: Katika muktadha huu neno hilo linaingiza yaliyomo katika kiapo kinachoombwa katika mstari uliotangulia. ‘Kwamba’ ni Kiswahili cha kawaida hapa, huku maana halisi ya ‘ikiwa’ ikihifadhiwa katika tanbihi.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: hutatutendea mabaya
  rationale: Kirai hiki kinamaanisha kutenda jambo baya au lenye kudhuru. ‘Hutatutendea mabaya’ kinafaa katika muktadha wa agano la kutodhuru na kinasikika kwa kawaida kwa Kiswahili.
- source_word: נְגַעֲנוּךָ
  choice: hatukukugusa
  rationale: Kitenzi נגע kimsingi humaanisha ‘gusa,’ ingawa katika muktadha huu kinaweza kudokeza kudhuru. Tafsiri kuu inadumisha picha halisi, na maana ya kudhuru inaelezwa katika tanbihi.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: tulivyokutendea mema tu
  rationale: ‘Mema tu’ inadumisha msisitizo wa רַק טוֹב, yaani kwamba wanadai hawakumtendea chochote isipokuwa mema.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: na kukuacha uende kwa amani
  rationale: Katika muktadha wa kuondoka kwa Isaka, ‘kukuacha uende’ ni Kiswahili cha kawaida kinachowasilisha wazo la kumruhusu au kumpeleka aondoke, bila kupoteza dai lao kwamba aliondoka kwa amani.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: ‘Kwa amani’ inadumisha maana ya mahusiano yasiyo na uhasama na kuondoka salama, pamoja na uzito wa neno שָׁלוֹם.
- source_word: בְּרוּךְ יְהוָה
  choice: umebarikiwa na Yahwe
  rationale: בָּרוּךְ ni hali ya kubarikiwa, na יְהוָה imetolewa kama jina la agano ‘Yahwe.’
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni, jina la agano la Mungu. ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Dai la watu kwamba walimtendea Isaka mema tu
  choice: Dai lao limewasilishwa bila kulainishwa au kuthibitishwa na msimulizi
  alternative: Kulifafanua kama dai la kinafiki au kama ukweli usio na shaka
  rationale: Mstari unanukuu maneno yao. Tafsiri inadumisha mvutano kati ya dai lao na simulizi la awali bila kuingiza hukumu ya kimadhehebu au ya mfasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaendelea moja kwa moja kutoka ombi la agano katika mstari uliotangulia; kwa hiyo unaanza na ‘kwamba.’ ‘Mema tu’ huhifadhi msisitizo wa Kiebrania, na ‘kwa amani’ huhifadhi maana pana ya שָׁלוֹם.
