translation:
  language: sw
  text: kwamba hutatutendea mabaya[a], kama vile sisi hatukukugusa[b], na kama vile tulivyokutendea mema tu na tulikuacha uende kwa amani[c]. Wewe sasa umebarikiwa na Yahwe.”
