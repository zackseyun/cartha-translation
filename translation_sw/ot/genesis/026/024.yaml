  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: sw
  text: Yahwe akamtokea usiku ule, akamwambia, “Mimi ni Mungu wa Abrahamu, baba yako. Usiogope,[a] kwa maana mimi niko pamoja nawe. Nitakubariki na kuuzidisha uzao wako[b] kwa ajili ya Abrahamu, mtumishi wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiwe na hofu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “mbegu yako”; hapa neno la Kiebrania linamaanisha uzao kwa maana ya pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili, badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: וַיֵּרָא אֵלָיו
  choice: akamtokea
  rationale: Kitenzi hiki kinaeleza kujidhihirisha au kuonekana kwa Mungu kwake; ‘akamtokea’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku ule
  rationale: Huhifadhi nguvu ya kiashiria cha Kiebrania na ni usemi wa asili katika Kiswahili.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Mimi ni Mungu wa Abrahamu, baba yako
  rationale: Huhifadhi utambulisho wa Mungu kwa Abrahamu na pia uhusiano wa Abrahamu na Isaka bila kufanya tungo iwe nzito.
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja, la kawaida na lenye heshima; ‘usiwe na hofu’ pia linawezekana.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: kwa maana mimi niko pamoja nawe
  rationale: ‘Kwa maana’ huonyesha kuwa uwepo wa Mungu ndio msingi wa agizo la kutokuogopa.
- source_word: וּבֵרַכְתִּיךָ
  choice: Nitakubariki
  rationale: Katika muktadha huu, umbo la Kiebrania lina nguvu ya ahadi ya wakati ujao.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: na kuuzidisha uzao wako
  rationale: Huwasilisha maana ya kufanya uzao uwe mwingi huku likihifadhi wazo la pamoja lililo katika neno la Kiebrania.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: ‘Uzao’ ni wa asili katika Kiswahili na unaweza kumaanisha watoto na vizazi vinavyotokana na mtu; pia huhifadhi umoja wa pamoja wa neno la Kiebrania.
- source_word: בַּעֲבוּר
  choice: kwa ajili ya
  rationale: Hueleza msingi unaomhusu Abrahamu bila kuongeza maelezo yasiyomo katika matini.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika muktadha wa uhusiano wa agano na utume, ‘mtumishi’ linafaa zaidi kuliko neno linalosisitiza hali ya utumwa wa kijamii.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ina jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Msingi wa ahadi katika בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: kwa ajili ya Abrahamu, mtumishi wangu
  alternative: kwa sababu ya Abrahamu, mtumishi wangu
  rationale: Tafsiri hii huhifadhi uhusiano kati ya ahadi kwa Isaka na Abrahamu bila kuamua kwa undani zaidi aina ya msingi wa kitheolojia unaokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa usomaji wa hadhara, huku ‘uzao’ ukihifadhi maana pana ya neno la Kiebrania. Alama za tanbihi zimewekwa baada ya maneno yanayohusika, badala ya kufuata nafasi zisizolingana katika safu ya Kiingereza.
