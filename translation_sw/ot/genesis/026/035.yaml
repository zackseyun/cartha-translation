  text: Nao wakawa machungu ya moyo kwa Isaka na Rebeka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “Nao wakawa uchungu wa roho kwa Isaka na Rebeka.” Nahau hii ya Kiebrania inaeleza masumbuko au huzuni kubwa.
