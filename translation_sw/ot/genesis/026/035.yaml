lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: Nao wakawa
  rationale: Qal wayyiqtol nafsi ya tatu wingi wa kike ya היה inaendeleza simulizi na kurejelea wake wa Esau katika mstari uliotangulia. “Wakawa” huweza kueleza hali iliyotokea bila kulazimisha tofauti kali kati ya ‘walikuwa’ na ‘wakawa.’
- source_word: מֹרַת רוּחַ
  choice: sababu ya uchungu wa rohoni
  rationale: Kirai cha Kiebrania kwa maana halisi ni ‘uchungu wa roho.’ Kiswahili cha kawaida huhitaji ‘sababu ya’ ili kuonyesha kwamba wanawake hao waliwaletea Isaka na Rebeka huzuni au masumbuko makubwa, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: kwa Isaka na Rebeka
  rationale: ל huonyesha watu walioathiriwa. “Kwa Isaka na Rebeka” ni Kiswahili cha kawaida; si lazima kurudia “kwa” mbele ya Rebeka.
