base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: sw
  text: Wachungaji wa Gerari wakagombana na wachungaji wa Isaka, wakisema, “Maji ni yetu.” Ndipo Isaka akakiita kisima hicho Esek[a], kwa sababu walizozana naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Esek linahusiana na neno la Kiebrania linalomaanisha “mzozo” au “ubishi.”
    reason: Mchezo wa maneno kati ya jina עֵשֶׂק na kitenzi הִתְעַשְּׂקוּ hauwezi kuhifadhiwa kikamilifu katika tafsiri ya kawaida ya Kiswahili.
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: wakagombana
  rationale: Kitenzi ריב huonyesha ugomvi au mabishano. “Wakagombana” ni Kiswahili cha kawaida na kinafaa kwa mzozo kuhusu kisima.
- source_word: רֹעֵי גְרָר
  choice: wachungaji wa Gerari
  rationale: רֹעִים ni watu wanaochunga mifugo; “wachungaji” ni neno la kawaida na linalodumisha muktadha wa maisha ya mababu.
- source_word: עִם רֹעֵי יִצְחָק
  choice: na wachungaji wa Isaka
  rationale: Tafsiri hii inadumisha ulinganifu wa kishazi cha Kiebrania na kumtaja Isaka wazi.
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: wakisema, “Maji haya ni yetu.”
  rationale: Kauli ya Kiebrania ni fupi, kihalisi “maji ni yetu.” Neno “haya” linaonyesha kwa kawaida maji yaliyokuwa yakibishaniwa bila kubadili dai la umiliki.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: Ndipo Isaka akakiita kisima hicho
  rationale: “Kukiita jina la” ni nahau ya Kiebrania inayotafsiriwa kwa Kiswahili asilia kama “kukiita.” Jina “Isaka” linaweka wazi mhusika anayerejelewa na kitenzi cha umoja.
- source_word: עֵשֶׂק
  choice: Eseki
  rationale: Jina la kisima limetoholewa kwa tahajia inayosomeka kwa Waswahili, huku maana na mchezo wa maneno vikielezwa katika tanbihi.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: kwa sababu walizozana naye
  rationale: Kitenzi hiki ni cha mzizi unaohusiana na jina עֵשֶׂק. “Walizozana” huwasilisha wazo la kushindana au kubishana, na “naye” hudumisha rejeo la umoja kwa Isaka.
