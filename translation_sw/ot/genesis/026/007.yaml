base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: sw
  text: Wanaume wa mahali pale walipomuuliza kuhusu mke wake, alisema, “Huyu ni dada yangu,” kwa maana aliogopa kusema, “Huyu ni mke wangu,” wasije wanaume wa mahali pale wakaniua kwa sababu ya Rebeka, kwa kuwa alikuwa na sura nzuri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: walipomuuliza
  rationale: Qal wayyiqtol ya שׁאל inaonyesha kuuliza moja kwa moja; muundo huu ni wa kawaida katika Kiswahili na unaunganisha tendo hilo na jibu lililofuata.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: watu wa mahali pale
  rationale: Ingawa אַנְשֵׁי inaweza kumaanisha wanaume, katika muktadha huu inaweza pia kurejelea wenyeji kwa ujumla; 'watu wa mahali pale' ni ya asili bila kulazimisha jinsia ambayo huenda si kiini cha habari.
- source_word: לְאִשְׁתּוֹ
  choice: kuhusu mke wake
  rationale: ל baada ya שׁאל hapa huonyesha jambo lililoulizwa; 'kuhusu' ni sawa na ya kawaida katika Kiswahili.
- source_word: אֲחֹתִי הִוא
  choice: Huyu ni dada yangu
  rationale: Huhifadhi utambulisho wa kauli ya moja kwa moja katika mpangilio wa kawaida wa Kiswahili.
- source_word: כִּי יָרֵא
  choice: kwa sababu aliogopa
  rationale: כִּי inatoa sababu ya kauli yake, na יָרֵא inaelezwa kwa Kiswahili cha kawaida kuwa 'aliogopa.'
- source_word: לֵאמֹר
  choice: kusema
  rationale: Kitenzi-jina hiki kinaonyesha jambo aliloogopa kulisema.
- source_word: אִשְׁתִּי
  choice: Huyu ni mke wangu
  rationale: Kiswahili hujaza kishazi cha utambulisho kwa kawaida; 'Huyu ni' linaeleweka kutokana na muktadha wa Kiebrania.
- source_word: פֶּן
  choice: wanaweza kuniua
  rationale: פֶּן huanzisha matokeo yanayohofiwa. Muundo wa wazo la ndani unaonyesha hofu hiyo kwa Kiswahili cha sasa bila kutumia kiunganishi kizito.
- source_word: יַהַרְגֻנִי
  choice: kuniua
  rationale: הרג ni kitenzi cha kawaida cha kuua; hakiongezi dhana maalumu ya kisheria kama 'kunihukumu' au 'kuninyonga.'
- source_word: עַל רִבְקָה
  choice: kwa sababu ya Rebeka
  rationale: עַל hapa inaonyesha sababu au tukio linaloweza kusababisha kuuawa kwake.
- source_word: טוֹבַת מַרְאֶה
  choice: mzuri wa sura
  rationale: Kirai hiki humaanisha mwenye mwonekano mzuri; 'mzuri wa sura' ni cha asili, chenye heshima, na kinaeleweka kwa wasomaji wa Kiswahili.
- source_word: רִבְקָה
  choice: Rebeka
  rationale: Hili ndilo umbo la jina linalotumika sana katika tafsiri za Biblia za Kiswahili na linaakisi jina la Kiebrania.
theological_decisions:
- issue: Mabadiliko kutoka nafsi ya tatu kwenda nafsi ya kwanza katika פֶּן יַהַרְגֻנִי
  choice: Aliwaza, “Watu wa mahali hapa wanaweza kuniua...”
  alternative: kwa kuogopa kwamba watu wa mahali pale wangemuua
  rationale: Kiebrania kina 'kuniua,' hivyo kutaja wazo la ndani huhifadhi nafsi ya kwanza na pia kufanya sentensi iwe ya asili katika Kiswahili bila kutatua kimya kimya badiliko la mtazamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa kwa kiasi ili kudumisha uwazi, huku kauli ya ndani ikihifadhi mabadiliko halisi ya Kiebrania kwenda nafsi ya kwanza.
