  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: sw
  text: Ndipo Abimeleki akamwambia Isaka, “Ondoka kwetu, kwa maana umekuwa na nguvu nyingi kuliko sisi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umekuwa mwenye nguvu sana ukilinganishwa nasi.”
    reason: Njia nyingine ya kuonyesha maana ya עָצַם pamoja na ulinganisho wa מִן na msisitizo wa מְאֹד.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na pia unaonyesha kwamba maneno hayo yalimwelekea Isaka.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: יִצְחָק
  choice: Isaka
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalotumiwa kwa kawaida.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: Ondoka kwetu
  rationale: Kauli hii ya amri inaeleza wazi kujitenga na mahali au jamii yao; ni ya asili zaidi kwa Kiswahili kuliko tafsiri ya neno kwa neno ya ‘nenda kutoka pamoja nasi.’
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya amri ya Abimeleki kwa lugha iliyo wazi na yenye hadhi.
- source_word: עָצַמְתָּ מִמֶּנּוּ מְאֹד
  choice: umekuwa na nguvu nyingi kuliko sisi
  rationale: עָצַם ina maana ya kuwa hodari, mwenye nguvu, au mwenye uwezo mkubwa; מִן inatumiwa kwa ulinganisho, na מְאֹד inasisitiza kiwango. Tafsiri hii inahifadhi ulinganisho bila kudokeza lazima ushindi wa kijeshi au mamlaka ya kisiasa.
