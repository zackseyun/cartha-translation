  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu mwendelezo wa simulizi ("Ndipo"), usemi wa Abimeleki kwa Isaka, amri ya kujiondoa ("Ondoka kwetu"), sababu yake, na ulinganisho uliosisitizwa: Isaka amekuwa na nguvu nyingi kuliko wao. Haiongezi maana ya utawala wa kisiasa, ushindi wa kijeshi, au tishio lisilosemwa katika Kiebrania.'
