base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: sw
  text: Isaka akawaambia[a], “Kwa nini mmekuja kwangu, ilhali mlinichukia na kunifukuza kutoka kwenu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na ninyi mlinichukia na kunifukuza kutoka kwenu.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa moja kwa moja zaidi kuwa “na,” lakini hapa huenda kinaonyesha hali inayokinzana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: Isaka akawaambia
  rationale: Muundo wa kawaida wa simulizi la Kiebrania umetafsiriwa kwa Kiswahili cha masimulizi; kiambishi -wa- kinaonyesha wazi kuwa aliwaambia wao.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Hili ndilo swali la sababu lililo la kawaida na la asili katika Kiswahili cha sasa.
- source_word: בָּאתֶם אֵלַי
  choice: mmekuja kwangu
  rationale: 'Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yapo sasa: watu hao wamefika mbele ya Isaka.'
- source_word: וְאַתֶּם
  choice: ilhali
  rationale: Kiunganishi ו kinaweza kuwa cha kawaida (‘na’) au kuwa na maana ya hali inayokinzana. ‘Ilhali’ huonyesha mshangao wa Isaka kwa kuja kwao baada ya kumtendea kwa uadui, huku tanbihi ikihifadhi tafsiri ya moja kwa moja zaidi.
- source_word: שְׂנֵאתֶם אֹתִי
  choice: mlinichukia
  rationale: שנא ina maana yenye nguvu ya kuchukia; haijapunguzwa kuwa kutompendelea au kuwa na uhasama tu.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: na kunifukuza
  rationale: Katika muktadha wa Isaka kuamriwa aondoke (mst. 16), ‘kunifukuza’ huwasilisha kwa asili kumwondoa na kumtuma aende zake. ‘Kunipeleka mbali’ lingekuwa dhaifu na lisilo la kawaida hapa.
- source_word: מֵאִתְּכֶם
  choice: kutoka kwenu
  rationale: Huhifadhi wazo la kutengwa na mahali au uwepo wao bila kuongeza kwa lazima dhana ya kundi inayoweza kudokezwa na ‘kutoka miongoni mwenu.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ilhali’ ni neno linaloeleweka katika lugha rasmi na linafaa kuonyesha ukinzani wa sentensi. Alama ya tanbihi [a] imewekwa baada ya utangulizi wa usemi ili kuhifadhi uwezekano halisi wa kiunganishi cha Kiebrania.
