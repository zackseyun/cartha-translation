  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֣ק מִ/שָּׁ֗ם וַ/יַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְ/לֹ֥א רָב֖וּ עָלֶ֑י/הָ וַ/יִּקְרָ֤א שְׁמָ/הּ֙ רְחֹב֔וֹת וַ/יֹּ֗אמֶר כִּֽי עַתָּ֞ה הִרְחִ֧יב יְהוָ֛ה לָ֖/נוּ וּ/פָרִ֥ינוּ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: sw
  text: Akaondoka huko, akachimba kisima kingine, wala hawakugombania kisima hicho. Akakiita Rehoboth[a], akasema, “Kwa maana sasa Yahweh ametupatia nafasi, nasi tutazaa matunda katika nchi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Rehoboth linasikika kama neno la Kiebrania linalomaanisha “maeneo mapana” au “nafasi pana.” Maelezo ya Isaka, “Yahweh ametupatia nafasi,” yanatumia mchezo huo wa maneno.
    reason: Maana na mchezo wa maneno wa jina la Kiebrania haviwezi kuonekana wazi katika jina lililonakiliwa.
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: Akaondoka huko
  rationale: Kitenzi עתק katika muktadha huu kinaonyesha Isaka kuhama kutoka mahali pale na kwenda pengine. ‘Akaondoka huko’ ni Kiswahili cha kawaida na hakiongezi maelezo yasiyokuwapo katika chanzo.
- source_word: בְּאֵר אַחֶרֶת
  choice: kisima kingine
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kirai hicho katika Kiswahili.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: wala hawakugombania
  rationale: ריב humaanisha kugombana au kushindania. Kiambishi cha Kiswahili kinaeleweka kumrejelea kisima kilichotajwa mara moja kabla.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: Akakiita Rehoboth
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi tendo la kukipa kisima jina, huku jina la mahali רְחֹבוֹת likinakiliwa badala ya kutafsiriwa katika matini kuu.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: Kwa maana sasa Yahweh ametupatia nafasi
  rationale: Hifili ya רחב hapa ina maana ya kupanua au kutengenezea nafasi. ‘Ametupatia nafasi’ ni ya kawaida na inaendeleza mchezo wa maneno unaohusiana na Rehoboth.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linanakiliwa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: nasi tutazaa matunda katika nchi
  rationale: פרה humaanisha kuzaa matunda au kuwa na ongezeko. Tafsiri hii inadumisha taswira ya chanzo na mwangwi unaowezekana wa lugha ya baraka, bila kuifupisha kuwa ustawi wa mali pekee.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina la agano moja kwa moja; kulinakili kama ‘Yahweh’ kunalitofautisha na cheo ‘Bwana’.
- issue: Maana ya וּפָרִינוּ
  choice: tutazaa matunda
  alternative: tutaongezeka au tutastawi
  rationale: Usemi wa chanzo unaweza kuhusisha ongezeko la uzao na mafanikio mapana. Taswira ya ‘kuzaa matunda’ huhifadhi upana huo na mwangwi wa baraka bila kuamua kimya-kimya kuwa inamaanisha mali au idadi ya watu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. Viunganishi vya mfululizo ‘aka-’ vinadumisha mwendo wa simulizi la Kiebrania. Jina Rehoboth limeachwa kama jina maalumu, na maana yake imefafanuliwa katika tanbihi.
