lexical_decisions:
- source_word: וַ/אֲבִימֶלֶךְ
  choice: Kisha Abimeleki
  rationale: Waw ya usimulizi imetafsiriwa kwa ‘Kisha’ ili kuendeleza simulizi kwa Kiswahili cha kawaida; jina limetoholewa kwa namna inayosomeka kwa Kiswahili.
- source_word: הָלַךְ אֵלָי/ו
  choice: akaenda kwake
  rationale: ‘Akaenda’ huhifadhi mtazamo wa msimulizi wa kitenzi הלך, na ‘kwake’ huhifadhi kiwakilishi cha Kiebrania bila kutaja Isaka moja kwa moja.
- source_word: מִ/גְּרָר
  choice: kutoka Gerari
  rationale: Kihusishi מן kina maana ya ‘kutoka’; jina la mahali limetoholewa kuwa Gerari kwa matamshi ya Kiswahili.
- source_word: וַ/אֲחֻזַּת מֵֽרֵעֵ/הוּ
  choice: pamoja na Ahuzathi rafiki yake
  rationale: ‘Pamoja na’ huonyesha kwa kawaida kwamba Ahuzathi aliandamana na Abimeleki. מֵרֵעֵהוּ kimsingi humaanisha rafiki, mwenzi, au mshirika; ‘rafiki yake’ huhifadhi maana ya moja kwa moja bila kuamua kwamba alikuwa mshauri rasmi.
- source_word: וּ/פִיכֹל
  choice: na Pikoli
  rationale: Jina limetoholewa kwa tahajia inayolingana na mfumo wa sauti wa Kiswahili.
- source_word: שַׂר צְבָא/וֹ
  choice: mkuu wa jeshi lake
  rationale: שַׂר humaanisha mkuu au kamanda, na צבא hapa ni jeshi; usemi huu ni wa kawaida, wazi, na wenye hadhi katika Kiswahili.
