  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: sw
  text: Wakaamka asubuhi na mapema, wakaapa, kila mtu kwa ndugu yake[a]. Kisha Isaka akawaaga, nao wakaondoka kwake kwa amani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mtu kwa ndugu yake”; hapa ni nahau inayoonyesha kwamba waliapiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Wakaamka asubuhi na mapema
  rationale: Kitenzi שׁכם kinaonyesha kuamka mapema; pamoja na בַבֹּקֶר, usemi huu wa Kiswahili unaonyesha wazi kuwa ilikuwa mapema asubuhi.
- source_word: וַיִּשָּׁבְעוּ
  choice: wakaapa
  rationale: Nifali ya שׁבע humaanisha kuapa au kula kiapo. ‘Wakaapa’ ni ya asili katika Kiswahili na inadumisha uzito rasmi wa tendo hilo.
- source_word: אִישׁ לְאָחִיו
  choice: kila mtu kwa ndugu yake
  rationale: Huhifadhi taswira halisi ya Kiebrania, ‘mtu kwa ndugu yake,’ huku ‘kila mtu’ ikiweka wazi kuwa kuapa kulikuwa kwa pande zote.
- source_word: וַיְשַׁלְּחֵם
  choice: Isaka akawaaga
  rationale: Katika muktadha wa wageni kuondoka baada ya mapatano, ‘akawaaga’ ni usemi wa kawaida wa Kiswahili unaowasilisha kuwa Isaka aliwaruhusu waondoke na akawapeleka zao bila kudokeza kuwafukuza.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: wakaondoka kwake
  rationale: Huonyesha moja kwa moja mwendo wao wa kutoka mahali alipokuwa Isaka.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Huhifadhi maana ya kuondoka salama na katika uhusiano wa amani baada ya mapatano.
