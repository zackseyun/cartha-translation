  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: sw
  text: Kisha Abimeleki akawaamuru watu wote, akisema, “Yeyote atakayemgusa mwanamume huyu au mke wake[a] hakika atauawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “anayemgusa mwanamume huyu au mke wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kauli ya piel ya צוה inaonyesha kutoa amri yenye mamlaka; “akawaamuru” ni ya kawaida na inahifadhi uzito huo.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: עם hapa inawahusu watu wote walio chini ya mamlaka ya Abimeleki, si lazima taifa kwa maana ya kikabila.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kutambulisha maneno yaliyomo katika amri.
- source_word: הַנֹּגֵעַ
  choice: yeyote atakayemgusa
  rationale: Kivumishi-tendo chenye kiambishi cha uainishaji kinatumika kwa maana ya jumla, “anayegusa/yeyote atakayegusa.” “Kumgusa” huhifadhi maana ya kawaida ya נגע bila kuiongeza kuwa kumdhuru.
- source_word: בָּאִישׁ הַזֶּה
  choice: mwanamume huyu
  rationale: Baada ya kitenzi “kumgusa,” kiambishi cha yambwa humrejelea mtu, na “mwanamume huyu” huwasilisha wazi אִישׁ הַזֶּה.
- source_word: וּבְאִשְׁתּוֹ
  choice: au mke wake
  rationale: Katika muktadha huu אשה yenye kiambishi cha umilikaji ni “mke wake”; “au” huonyesha kwamba marufuku inamhusu kila mmoja wao.
- source_word: מוֹת יוּמָת
  choice: hakika atauawa
  rationale: Muundo wa kitenzi-jina kisicho na ukomo pamoja na hophal unaimarisha uhakika wa adhabu, huku “atauawa” ikihifadhi hali ya kutendwa na maana ya hukumu ya kifo.
