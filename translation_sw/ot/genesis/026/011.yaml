translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Jina “Abimeleki” limeandikwa kwa umbo lililozoeleka katika tafsiri za Kiswahili. Alama ya tanbihi imewekwa baada ya kishazi inachokifafanua.
