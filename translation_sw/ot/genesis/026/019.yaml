  verdict: revise
  source_fidelity: The narrative sequence, Isaac’s servants, digging, finding, and the well of “living water” are accurately represented. However, “bonde la mto” over-specifies נחל as the valley of a river; in this setting the term more naturally denotes a wadi/seasonal watercourse and need not imply a perennial river.
  naturalness: The prose is clear, idiomatic Standard East African Swahili. “Kisha … wakachimba … wakapata” gives a natural narrative flow. “Maji yaliyo hai” is a deliberately literal and grammatically natural rendering, with its idiomatic sense appropriately explained.
  terminology: “Watumishi wa Isaka,” “kisima,” and “maji yaliyo hai” are suitable and retain the source’s register and semantic range. Revising the geographical expression and its footnote avoids the misleading implication of a regular river.
  issues:
  - severity: medium
    issue: “katika bonde la mto” is too specific for בַּנָּחַל.
    rationale: A נחל can be a wadi, ravine, or seasonal watercourse. Calling it a river valley may suggest a permanent river, which the Hebrew does not require.
  - severity: low
    issue: Footnote a lists “bondeni” as an alternative although the main rendering already uses “katika bonde la mto,” and “katika kijito” is too narrow.
    rationale: The note should clarify the seasonal-watercourse sense and offer a meaningful alternative without equating נחל simply with a small stream.
