  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: sw
  text: Kisha watumishi wa Isaka wakachimba katika bonde[a], nao wakapata humo kisima chenye maji yaliyo hai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mkondo wa maji wa msimu”; neno la Kiebrania mara nyingi hurejelea bonde au mkondo wa maji wa msimu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “maji yaliyo hai,” yaani maji mapya au yanayotiririka kutoka chemchemi, si maji yaliyotuama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: wakachimba
  rationale: Kitenzi hiki cha kawaida kinaonyesha hatua inayofuata katika simulizi; “wakachimba” ni Kiswahili cha asili na cha moja kwa moja.
- source_word: עַבְדֵי יִצְחָק
  choice: watumishi wa Isaka
  rationale: Kirai hiki kinawataja watu waliokuwa katika utumishi wa Isaka; “watumishi” kinafaa katika muktadha bila kuamua zaidi hali yao ya kijamii.
- source_word: בַּנָּחַל
  choice: katika bonde la mto
  rationale: נחל mara nyingi ni bonde lenye mkondo wa maji, hasa mkondo wa msimu. “Bonde la mto” ni usemi unaoeleweka kwa wasomaji wa Afrika Mashariki, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: nao wakapata humo
  rationale: “Humo” huhifadhi msisitizo wa mahali wa שָׁם na kurejelea bonde walimochimba.
- source_word: בְּאֵר
  choice: kisima
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa shimo lililochimbwa ili kupata maji; kirai kinachofuata kinaeleza aina ya maji.
- source_word: מַיִם חַיִּים
  choice: maji yaliyo hai
  rationale: Tafsiri ya karibu huhifadhi taswira halisi na mwangwi mpana wa kibiblia wa nahau ya Kiebrania; tanbihi inaeleza kuwa hapa ni maji mapya au yanayotiririka kutoka chemchemi.
