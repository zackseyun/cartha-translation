  yaml_path: translation/ot/genesis/026/033.yaml
  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: sw
  text: Akakiita Shiba[a]; kwa hiyo jina la mji huo ni Beer-sheba mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Shiba linasikika kama neno la Kiebrania linalomaanisha “saba,” nalo linahusiana na mchezo wa maneno katika jina Beer-sheba, linaloweza kueleweka kuwa “Kisima cha Saba” au “Kisima cha Kiapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Akakiita
  rationale: Katika muktadha wa kutoa jina, קרא pamoja na yambwa humaanisha ‘kuita/kupa jina.’ ‘Akakiita’ ni ya kawaida na inahifadhi mtindo wa Kiebrania.
- source_word: אֹתָהּ
  choice: -ki- katika “Akakiita”
  rationale: Kiwakilishi cha Kiebrania kinarejelea kisima kilichotajwa katika muktadha; ngeli ya Kiswahili ya ‘kisima’ hudai kiwakilishi ‘ki-’.
- source_word: שִׁבְעָה
  choice: Shiba
  rationale: Hili limetolewa kama jina la kisima badala ya kutafsiriwa, ili kutofuta mchezo wa maneno unaohusiana na ‘saba’ na ‘kiapo.’
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Kirai hiki kinaonyesha hitimisho linaloeleza uhusiano kati ya jina la kisima na jina la mji.
- source_word: שֵׁם הָעִיר
  choice: jina la mji huo
  rationale: Tafsiri ya kawaida ya muundo wa Kiebrania; ‘huo’ huifanya rejeo kwa mji unaozungumziwa iwe wazi na ya asili katika Kiswahili.
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-sheba
  rationale: Jina la mahali limenukuliwa badala ya kutafsiriwa. Umbo lenye kistari huonyesha vipashio vya jina na kudumisha uhusiano wake na ‘Shiba.’
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni tafsiri ya kawaida na ya asili ya usemi wa wakati wa Kiebrania.
