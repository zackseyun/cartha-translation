  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: sw
  text: Kisha wakachimba kisima kingine, nao wakagombana juu yake pia; naye akakiita Sitna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Sitna linahusishwa na neno la Kiebrania linalomaanisha uhasama au upinzani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: wakachimba
  rationale: Kitenzi חפר katika Qal kinamaanisha kuchimba; “wakachimba” ni Kiswahili cha kawaida na kinaendeleza mfuatano wa simulizi.
- source_word: בְּאֵר אַחֶרֶת
  choice: kisima kingine
  rationale: בְּאֵר ni “kisima,” na אַחֶרֶת ni “kingine”; usemi huu ni wa kawaida na unaonyesha kisima tofauti na kile kilichotangulia.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: wakakigombania hicho pia
  rationale: ריב inaeleza kugombana au kushindana kwa mabishano. “Wakakigombania” huonyesha kwa kawaida kuwa kisima ndicho kilichokuwa chanzo cha mgogoro; “pia” linawakilisha גַּם.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: akakiita
  rationale: Ingawa Kiebrania kinasema kihalisi “akaliita jina lake,” “akakiita” ni Kiswahili cha sasa na cha asili kinachohifadhi tendo la kukipa kisima jina.
- source_word: שִׂטְנָה
  choice: Sitna
  rationale: Hili ni jina la kisima, kwa hiyo limetoholewa badala ya kutafsiriwa. Uhusiano wake na uhasama au upinzani umeelezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “wakakigombania” ni wa kawaida kuliko tafsiri ya neno kwa neno, huku ukihifadhi maana ya mgogoro kuhusu kisima. Alama ya tanbihi imewekwa baada ya “Sitna,” ambako maelezo ya asili ya jina yanahusika moja kwa moja.
