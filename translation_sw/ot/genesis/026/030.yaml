  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: sw
  text: Akawaandalia karamu[a], nao wakala na wakanywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhifa”; neno la Kiebrania linaweza kumaanisha karamu ambayo unywaji ni sehemu muhimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akawaandalia
  rationale: Katika muundo huu, עשה pamoja na מִשְׁתֶּה humaanisha kuandaa tukio la karamu; ‘akawaandalia’ ni Kiswahili cha kawaida na pia hujumuisha לָהֶם, yaani walengwa wa maandalizi hayo.
- source_word: לָהֶם
  choice: -wa- katika ‘akawaandalia’
  rationale: Kiambishi cha yambwa ‘-wa-’ pamoja na kauli tumizi ‘-andalia’ kinaonyesha kwa kawaida kwamba karamu iliandaliwa kwa ajili yao.
- source_word: מִשְׁתֶּה
  choice: karamu
  rationale: ‘Karamu’ huonyesha mlo mkubwa wa pamoja unaoweza kuhusisha unywaji; tendo la kunywa linatajwa wazi baadaye katika mstari.
- source_word: וַיֹּאכְלוּ
  choice: nao wakala
  rationale: Huwakilisha mfuatano wa simulizi na kitendo cha kula, huku ‘nao’ ikibainisha kurudi kwa wahusika waliotajwa kama ‘wao’.
- source_word: וַיִּשְׁתּוּ
  choice: na kunywa
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kitendo cha kunywa katika mfululizo mmoja na ‘wakala’.
