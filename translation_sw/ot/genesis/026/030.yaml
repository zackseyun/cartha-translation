translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kisimulizi; ‘akawaandalia’ huepuka tafsiri ngumu ya neno kwa neno ya ‘alifanya karamu’.
