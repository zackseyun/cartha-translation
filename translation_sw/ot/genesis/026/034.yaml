  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: sw
  text: Esau alipokuwa na umri wa miaka arobaini, aliwaoa[a] Yudithi binti Beeri, Mhiti, na Basemathi binti Eloni, Mhiti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi, “alimchukua mke: Yudithi ... na Basemathi ...” Kiebrania kinatumia umoja “mke/mwanamke” kabla ya kuwataja wanawake wawili.'
