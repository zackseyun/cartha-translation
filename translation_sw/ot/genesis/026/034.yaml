lexical_decisions:
- source_word: וַיְהִי
  choice: alipokuwa
  rationale: Muundo huu unaweka mazingira ya wakati kwa Kiswahili cha kawaida na kuendeleza simulizi bila tafsiri ngumu ya neno kwa neno kama “ikawa kwamba.”
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: na umri wa miaka arobaini
  rationale: Hii ndiyo namna ya kawaida na wazi ya kueleza umri katika Kiswahili cha sasa.
- source_word: וַיִּקַּח אִשָּׁה
  choice: aliwaoa
  rationale: Kitenzi kinaonyesha kuwachukua wanawake katika ndoa. Wingi umetumiwa kwa sababu maandishi yanawataja wanawake wawili; umoja wa Kiebrania umeelezwa katika tanbihi ili kutohifadhiwa kwa Kiswahili kisicho cha kawaida.
- source_word: יְהוּדִית
  choice: Yudithi
  rationale: Jina limetoholewa kwa mwandiko na matamshi yanayofaa Kiswahili.
- source_word: בַּת
  choice: binti
  rationale: “Binti” huonyesha kwa ufupi na kawaida uhusiano wa ukoo katika utambulisho wa majina.
- source_word: בְּאֵרִי
  choice: Beeri
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania huku likibaki rahisi kusomeka kwa Kiswahili.
- source_word: הַחִתִּי
  choice: Mhiti
  rationale: Nomino ya kabila yenye umoja imetafsiriwa kwa namna ya kawaida ya Kiswahili kumtambulisha Beeri na Eloni.
- source_word: בָּשְׂמַת
  choice: Basemathi
  rationale: Jina limetoholewa kwa mwandiko unaofaa matamshi ya Kiswahili.
- source_word: אֵילֹן
  choice: Eloni
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
