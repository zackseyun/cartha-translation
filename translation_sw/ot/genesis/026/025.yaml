  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: sw
  text: Basi akajenga madhabahu huko, akaliitia jina la Yahweh[a], na akapiga hema lake huko. Watumishi wa Isaka wakachimba kisima huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akalitangaza jina la Yahweh.” Usemi wa Kiebrania unaweza kumaanisha kumwomba Mungu kwa kulitaja jina lake au kulitangaza; hapa muktadha wa madhabahu unaunga mkono zaidi maana ya kumwomba.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akajenga
  rationale: Kitenzi 'kujenga' ndicho kisawe cha kawaida na cha asili katika simulizi kwa בנה.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Neno la kawaida la Kiswahili kwa mahali au jengo la kutolea dhabihu.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: akaliitia jina la Yahweh
  rationale: Muundo 'kuliitia jina la' huhifadhi maana ya kumwomba au kumwabudu Yahweh bila kuufanya usemi kuwa mahubiri pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: וַיֶּט ... אָהֳלוֹ
  choice: akapiga hema lake
  rationale: '''Kupiga hema'' ni usemi wa asili wa Kiswahili unaolingana na maana ya kusimamisha hema.'
- source_word: וַיִּכְרוּ
  choice: wakachimba
  rationale: Kitenzi hiki hutumika kwa kawaida kuhusu kuchimba kisima.
- source_word: עַבְדֵי יִצְחָק
  choice: Watumishi wa Isaka
  rationale: Katika muktadha huu neno linawataja wafanyakazi wa nyumba ya Isaka; hali yao ya kisheria haijaainishwa.
- source_word: בְּאֵר
  choice: kisima
  rationale: Kisawe cha kawaida katika masimulizi ya mababu.
- source_word: שָׁם
  choice: huko
  rationale: Kurudiwa kwake kumehifadhiwa ili kuonyesha msisitizo wa Kiebrania kuhusu mahali.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Huhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: akaliitia jina la Yahweh
  alternative: akalitangaza jina la Yahweh
  rationale: Usemi unaweza kuhusisha kuitangaza, lakini katika muktadha wa kujenga madhabahu unaelekea zaidi kumaanisha kumwomba au kumwabudu Yahweh; tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya maandiko. Viambishi vya mfululizo '-ka-' vinawakilisha matendo yanayofuatana; neno 'huko' limerudiwa kama katika chanzo.
