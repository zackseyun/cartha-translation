base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: sw
  text: Kulikuwa na njaa katika nchi, zaidi ya ile njaa ya kwanza iliyotokea siku za Ibrahimu. Basi Isaka akaenda kwa Abimeleki, mfalme wa Wafilisti, huko Gerari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaenda Gerari.” Umbo la Kiebrania la “Gerari” lina kiishio kinachoweza kuonyesha wazi mwendo kuelekea Gerari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: Kulikuwa na njaa katika nchi
  rationale: Muundo huu unaweka mazingira mapya ya simulizi kwa Kiswahili cha kawaida; ‘nchi’ hapa ni eneo husika, si dunia yote.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: tofauti na njaa ya kwanza
  rationale: מִלְּבַד hutofautisha njaa hii na ile ya awali; ‘njaa ya kwanza’ huhifadhi maana ya mpangilio ya רִאשׁוֹן.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: iliyokuwako siku za Abrahamu
  rationale: Kishazi hiki kinaitambulisha njaa ya kwanza kwa kuihusisha na kipindi cha maisha ya Abrahamu.
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: Basi Isaka akaenda
  rationale: ‘Basi’ na umbo la ‘akaenda’ huendeleza mfululizo wa simulizi kwa njia ya asili bila kusisitiza mno kwamba njaa ndiyo sababu ya safari.
- source_word: אֶל אֲבִימֶּלֶךְ
  choice: kwa Abimeleki
  rationale: ‘Kwa’ ni matumizi ya kawaida ya Kiswahili yanapoeleza kwenda kwa mtu.
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: mfalme wa Wafilisti
  rationale: Huhifadhi wazi uhusiano wa muundo wa Kiebrania unaomaanisha mfalme wa watu hao.
- source_word: גְּרָרָה
  choice: huko Gerari
  rationale: Jina lina kiishio cha Kiebrania kinachoelekeza mwendo kuelekea Gerari; katika sentensi hii ‘huko Gerari’ hutaja mahali alikokuwa Abimeleki huku safari ikibaki wazi.
theological_decisions:
- issue: Utambulisho wa kihistoria/kikabila פְּלִשְׁתִּים
  choice: Wafilisti
  alternative: watu wa Kifilisti
  rationale: Hili ni jina la kawaida la kihistoria na kisiasa la watu, si cheo cha kiteolojia; ‘Wafilisti’ ndilo umbo lililo wazi na la kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia. Alama ya tanbihi [a] imewekwa baada ya ‘Gerari’ kwa sababu tanbihi inahusu maana elekezi ya jina hilo.
