revisions:
- from: Kulikuwa na njaa katika nchi, tofauti na njaa ya kwanza iliyokuwako siku za Abrahamu. Basi Isaka akaenda kwa Abimeleki, mfalme wa Wafilisti, huko Gerari.[a]
  to: Kulikuwa na njaa katika nchi, zaidi ya ile njaa ya kwanza iliyotokea siku za Ibrahimu. Basi Isaka akaenda kwa Abimeleki, mfalme wa Wafilisti, huko Gerari.[a]
  rationale: The revision replaces a misleading comparative expression with one that reflects מִלְּבַד, adopts established Swahili biblical name usage, improves the relative clause's idiom, and clarifies the directional-place-name footnote without treating the directional ending as mandatory.
