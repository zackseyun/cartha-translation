  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kiebrania: mhusika anawauliza wanaume wa eneo hilo, anaulizia qĕdēšâ aliyekuwa Enaimu kando ya njia, nao wanakana kuwapo kwake huko. "Enaimu" limehifadhiwa ipasavyo kama jina la mahali, na "Hapa hapakuwa" hutafsiri kwa kawaida bāzeh katika jibu la wenyeji.'
