base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: sw
  text: Akawauliza wanaume wa mahali pale, akisema, “Yuko wapi kahaba wa ibada[a] aliyekuwa Enaimu[b] kando ya njia?” Nao wakasema, “Hapa hapakuwa na kahaba wa ibada.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kahaba wa hekaluni.” Neno la Kiebrania linamtaja kahaba aliyehusishwa na desturi za ibada; “kahaba wa ibada” halidai kwamba shughuli hiyo ilifanyika katika jengo maalumu la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Enaimu ni jina la mahali. Umbo lake la Kiebrania linahusiana na neno linalomaanisha “macho,” na huenda pia likahusiana na “chemchemi.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Akawauliza
  rationale: Kitenzi cha masimulizi kinaendeleza mfululizo wa matukio; kiambishi -wa- kinaonyesha kwamba aliwauliza watu wengi.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: wanaume wa mahali pale
  rationale: “Wanaume” huhifadhi maana ya אַנְשֵׁי, nayo “wa mahali pale” ni Kiswahili cha kawaida kinachoeleza wenyeji wa eneo linalozungumziwa bila kulazimisha rejeo la kiambishi cha kike cha Kiebrania.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi muundo wa Kiebrania unaoingiza maneno ya moja kwa moja, ingawa “akiwauliza” pia lingewezekana katika Kiswahili laini zaidi.
- source_word: הַקְּדֵשָׁה
  choice: kahaba wa ibada
  rationale: Neno hili ni tofauti na זֹנָה lililotumiwa kwingine katika sura na linadokeza ukahaba uliohusishwa na desturi za ibada. Tafsiri hii haidai kwamba kulikuwa na jengo maalumu la hekalu.
- source_word: בָעֵינַיִם
  choice: Enaimu
  rationale: Katika muktadha huu neno linafanya kazi kama jina la mahali, hivyo limetoholewa badala ya kutafsiriwa kihalisi kuwa “macho” au “chemchemi.”
- source_word: עַל הַדָּרֶךְ
  choice: kando ya njia
  rationale: Hueleza kwa Kiswahili cha kawaida mahali palipo karibu na njia, kama muktadha unavyodai.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: Hapa hapakuwa na kahaba wa ibada
  rationale: Hutoa kwa kawaida jibu la wenyeji linalokana kuwapo kwa mwanamke wa aina hiyo mahali hapo, bila kuongeza neno “kamwe” lisilo wazi katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa heshima lakini unaoeleweka kwa urahisi. “Kahaba wa ibada” limetumiwa kwa uthabiti katika swali na jibu, na alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
