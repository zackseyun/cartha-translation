base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: sw
  text: Lakini Onani alijua kwamba uzao huo usingekuwa wake[a]; kila mara alipolala na mke wa ndugu yake, alimwaga shahawa zake chini[b], ili asimpatie ndugu yake uzao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbegu” katika sehemu zote mbili; hapa maana yake ni uzao au mrithi katika muktadha wa wajibu wa kumpatia ndugu aliyekufa mtoto.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “aliiharibu [hiyo] hadi ardhini.” Muktadha unaeleza tendo la Onani la kuzuia kutungwa mimba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: alijua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ידע katika simulizi.
- source_word: הַזָּרַע / זֶרַע
  choice: mzao
  rationale: Katika muktadha wa wajibu wa kumpatia ndugu aliyekufa mrithi, neno hili linamaanisha mtoto au uzao; umoja “mzao” unaendana na umbo la Kiebrania na muktadha.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: huyo mzao hangekuwa wake
  rationale: Inaonyesha kwamba mtoto ambaye angezaliwa angehesabiwa kuwa wa ndugu aliyekufa, si wa Onani.
- source_word: וְהָיָה אִם־בָּא
  choice: kila mara alipolala
  rationale: Muundo huu unaonyesha tendo lililorudiwa; Kiswahili hiki ni cha asili na huweka wazi maana ya kimuktadha.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: alipolala na mke wa ndugu yake
  rationale: “Kulala na” ni tasfida ya kawaida ya Kiswahili kwa kujamiiana, inayowasilisha maana bila lugha chafu.
- source_word: וְשִׁחֵת אַרְצָה
  choice: alimwaga chini
  rationale: Kitenzi שחת kihalisi kina wazo la kuharibu au kufanya kitu kipotee; katika muktadha, “alimwaga chini” huonyesha tendo la kuzuia mimba bila kuongeza nomino ambayo haikutajwa wazi katika Kiebrania.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: ili asimpatie ndugu yake mzao
  rationale: Huhifadhi kishazi cha kusudi na maana ya kumpatia ndugu aliyekufa mtoto wa kuendeleza ukoo wake.
theological_decisions:
- issue: Maana ya זרע na asili ya tendo la Onani
  choice: Kutafsiri זרע kama “mzao” katika vifungu vya kifamilia, huku “alimwaga chini” ikieleza tendo la kuzuia mimba.
  alternative: Kutumia “mbegu” kote, au kusema wazi “alimwaga shahawa zake chini.”
  rationale: Mstari unatofautisha mzao ambaye angehesabiwa kuwa wa ndugu na tendo la kimwili la Onani. Tafsiri hii huwasilisha tofauti hiyo bila kuingiza ufafanuzi wa kimadhehebu au kuwa wazi zaidi kuliko Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Kulala na” ni tasfida ya kisasa na ya kawaida; “mzao” huhifadhi umoja na muktadha wa mrithi.
