  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: sw
  text: 'Ikawa alipourudisha mkono wake, tazama, ndugu yake akatoka. Akasema, “Umejifanyia ufa ulioje!”[a] Kwa hiyo akamwita Peresi.


    [a] Kwa karibu, Kiebrania: “Umejifanyia ufa ulioje!” Kauli hii inarudia mzizi פרץ, unaohusiana na jina Peresi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu, Kiebrania: “Umejifanyia ufa ulioje!” Kauli hii inarudia mzizi פרץ, unaohusiana na jina Peresi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: alipokuwa akiurudisha mkono wake
  rationale: Muundo huu unaonyesha kitendo kilichokuwa kikiendelea cha kuurudisha mkono nyuma, bila kuongeza wazi kwamba aliurudisha ndani.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linahifadhi mshangao na uhai wa simulizi unaoletwa na הִנֵּה.
- source_word: יָצָא אָחִיו
  choice: ndugu yake akatoka
  rationale: Katika muktadha wa kuzaliwa, akatoka ni usemi wa kawaida na wa moja kwa moja; ndugu yake huhifadhi uhusiano unaotajwa na Kiebrania.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: Umejipenyezea njia kwa nguvu iliyoje!
  rationale: Kauli ya mshangao inaonyesha mtoto kujifungulia njia kwa nguvu. Kiambishi ji- pamoja na umbo -penyezea kinaakisi wazo gumu la עָלֶיךָ, yaani kujifanyia njia, huku tanbihi ikihifadhi urudiaji wa mzizi פרץ.
- source_word: פָּרֶץ
  choice: Peresi
  rationale: Peresi ni umbo la jina hili lililozoeleka katika Kiswahili na linatambulika kwa urahisi, ingawa mchezo wa maneno wa Kiebrania unahitaji kufafanuliwa katika tanbihi.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: Kwa hiyo akaitwa Peresi
  rationale: Kauli tendwa ya Kiswahili ni ya kawaida katika utoaji wa jina na huepuka kumtaja mtoa jina ambaye hajasemwa wazi katika mstari.
theological_decisions:
- issue: Mtendaji wa kauli וַיִּקְרָא katika kumpa mtoto jina
  choice: akaitwa Peresi
  alternative: akamwita Peresi
  rationale: Kiebrania hakimtaji wazi anayetoa jina katika mstari huu. Kauli tendwa huhifadhi kutotajwa huko badala ya kuingiza mtendaji fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi ya Biblia lakini kinachoeleweka kwa wasomaji wa sasa. Neno “tazama” limedumishwa kwa uhai wa simulizi; sentensi ya mshangao imetolewa kwa Kiswahili cha asili zaidi, na mchezo wa maneno wa Kiebrania umeelezwa katika tanbihi.
