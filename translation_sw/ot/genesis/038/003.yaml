lexical_decisions:
- source_word: וַתַּהַר
  choice: Akachukua mimba
  rationale: Kitenzi הרה humaanisha kupata au kuchukua mimba. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili sanifu.
- source_word: וַתֵּלֶד
  choice: akazaa
  rationale: Kitenzi ילד katika Qal hapa humaanisha kuzaa. Muundo wa mfululizo wenye ‘aka-’ unahifadhi mwendo wa simulizi la Kiebrania.
- source_word: בֵּן
  choice: mwana
  rationale: בן hapa ni mtoto wa kiume katika uhusiano wa kifamilia; ‘mwana’ ni neno la kawaida na lenye hadhi katika simulizi la Biblia.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: naye Yuda akampa jina
  rationale: Kitenzi cha Kiebrania kina nafsi ya tatu, umoja, jinsia ya kiume. Kwa kuwa Kiswahili hakionyeshi jinsia katika ‘akamwita/akampa,’ jina ‘Yuda’ limewekwa wazi ili kuhifadhi badiliko kutoka kwa mama kwenda kwa mhusika wa kiume bila kudokeza kimakosa kwamba mama ndiye aliyempa jina.
- source_word: עֵר
  choice: Eri
  rationale: 'Jina la Kiebrania עֵר limetoholewa kwa umbo linalotamkika kwa urahisi na lililozoeleka katika Kiswahili: ‘Eri.’'
theological_decisions:
- issue: Mhusika wa וַיִּקְרָא (‘akaita/akampa jina’)
  choice: Yuda ametajwa wazi kuwa ndiye aliyempa mtoto jina.
  alternative: Kuacha mhusika bila kutajwa (‘akamwita Eri’) au kumfanya mama kuwa mhusika.
  rationale: Kitenzi cha Kiebrania ni cha kiume umoja, tofauti na vitenzi viwili vilivyotangulia ambavyo ni vya kike umoja. Mhusika wa kiume anayeeleweka kwa kawaida katika muktadha ni Yuda. Kumtaja huepusha utata unaotokana na mfumo wa vitenzi vya Kiswahili, ambao hauonyeshi jinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘aka-’ umetumiwa kuonyesha mfululizo wa matukio; ‘akampa jina’ ni wa asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ‘akaliita jina lake.’
