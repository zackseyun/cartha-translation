base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: sw
  text: Ndipo Yuda akamwambia Onani, “Ingia kwa mke wa ndugu yako, utekeleze wajibu wako kwake kama ndugu wa mume[a], na umwinulie ndugu yako uzao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa istilahi ya kiufundi, tekeleza wajibu wa ndugu wa mume kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa masimulizi unaendeleza tukio linalofuata; ‘Ndipo’ na kitenzi cha mfululizo vinaonyesha mtiririko huo kwa Kiswahili cha kawaida.
- source_word: יְהוּדָה ... לְאוֹנָן
  choice: Yuda ... Onani
  rationale: Haya ni maumbo ya majina yanayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֹּא אֶל
  choice: Uingie kwa
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha kujamiana katika muktadha huu bila kuigeuza kuwa maelezo ya wazi kupita kiasi.
- source_word: אֵשֶׁת אָחִיךָ
  choice: mke wa ndugu yako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: וְיַבֵּם אֹתָהּ
  choice: umtimizie wajibu wa ndugu wa mume
  rationale: Kitenzi hiki ni istilahi ya wajibu wa ndugu wa marehemu kwa mjane wake. Tafsiri hii inaeleweka bila kutumia istilahi ngumu ya kitaalamu wala kuufupisha wajibu huo kuwa tendo la ndoa pekee.
- source_word: וְהָקֵם
  choice: umwinulie
  rationale: Huhifadhi taswira ya kitenzi קום katika nahau ya kuendeleza ukoo wa ndugu aliyekufa.
- source_word: זֶרַע
  choice: uzao
  rationale: ‘Uzao’ huwasilisha maana ya mtoto au mwendelezo wa kizazi katika muktadha huu, huku ikihifadhi upana wa neno la Kiebrania.
- source_word: לְאָחִיךָ
  choice: ndugu yako
  rationale: Kiambishi cha Kiswahili katika ‘umwinulie’ kinaonyesha kwamba uzao huo ni kwa ajili ya ndugu yake.
theological_decisions:
- issue: Kutafsiri wajibu wa ndugu wa marehemu bila kuingiza ufafanuzi wa baadaye wa kisheria au kimadhehebu
  choice: umtimizie wajibu wa ndugu wa mume
  alternative: umwoe kama ndugu wa mume aliyekufa
  rationale: Tafsiri iliyochaguliwa huhifadhi wajibu wa kifamilia unaodokezwa na kitenzi יִבֵּם bila kuufanya kuwa ndoa tu au kujamiiana tu. Tanbihi inaeleza istilahi hiyo kwa msomaji wa kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Nahau ‘uingie kwa’ imehifadhiwa kwa sababu inaakisi usemi wa Kiebrania; tanbihi inafafanua wajibu maalumu wa kindugu.
