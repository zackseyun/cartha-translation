  text: Akapata mimba tena, akazaa mwana, akamwita Onani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: Akapata mimba
  rationale: Kitenzi הרה hapa kinaonyesha kupata mimba; usemi huu ni wa kawaida na unaeleweka wazi katika Kiswahili cha Afrika Mashariki.
- source_word: עוֹד
  choice: tena
  rationale: Katika mfululizo huu wa uzazi, neno hili linaonyesha kurudiwa kwa tukio.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: Hii ni tafsiri fupi na ya kawaida ya nahau ya Kiebrania inayosema alizaa mtoto wa kiume.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: akamwita
  rationale: Nahau ya Kiebrania, kihalisi 'akaliita jina lake,' hutolewa kwa Kiswahili cha asili kama 'akamwita' mtu jina fulani.
- source_word: אוֹנָן
  choice: Onani
  rationale: Jina la mtu limetoholewa kwa tahajia inayolingana na matumizi ya kawaida ya Kiswahili.
