  text: 'Tamari akaambiwa hivi: “Tazama, baba mkwe wako anapanda kuelekea Timna ili kunyoa kondoo wake.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: Tamari akaambiwa
  rationale: Kauli ya kutendwa ya Kiebrania inaonyesha kwamba taarifa ilifikishwa kwa Tamari bila kumtaja mtoa taarifa; Kiswahili huweka mpokeaji kama kiima kwa kawaida.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Fomula ya kutanguliza maneno ya moja kwa moja imewasilishwa kwa usemi wa kawaida wa Kiswahili pamoja na nukta mbili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira za msikilizaji kuelekea taarifa inayofuata; “Tazama” linahifadhi nguvu hiyo kwa lugha yenye heshima.
- source_word: חָמִיךְ
  choice: baba mkwe wako
  rationale: Linahifadhi wazi uhusiano wa kindugu na kiambishi cha nafsi ya pili umoja kinachomrejelea Tamari.
- source_word: עֹלֶה
  choice: anapanda kwenda
  rationale: Kitenzi cha hali endelevu kinaonyesha mwendo unaoendelea au ulio karibu kuanza, na “anapanda” linahifadhi maana ya kuelekea juu bila kuamua kama ni kuja au kwenda kwa mtazamo wa msemaji.
- source_word: תִמְנָתָה
  choice: Timna
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili; mwelekeo unaonyeshwa na “kwenda.”
- source_word: לָגֹז
  choice: ili kuwanyoa
  rationale: Infinitivu yenye ל inaonyesha kusudi; “ili” linaweka wazi uhusiano huo, na “kuwanyoa” ni usemi wa kawaida wa kukata manyoya ya kondoo.
- source_word: צֹאנוֹ
  choice: kondoo wake
  rationale: Katika muktadha wa kunyoa, צאן inaelekea hasa kwa kondoo kuliko kundi la mifugo midogo kwa ujumla.
