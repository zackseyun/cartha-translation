  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: sw
  text: Basi, akarudi kwa Yuda, akasema, “Sikumpata; na pia wanaume wa mahali hapo walisema, ‘Hapa hapakuwa na mwanamke wa ibada[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania qĕdēšâ, “mwanamke aliyewekwa wakfu” au mwanamke wa ibada. Kimapokeo pia hutafsiriwa “kahaba wa ibada” au “kahaba wa hekaluni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Basi akarudi
  rationale: Kitenzi cha masimulizi kinaendeleza mfuatano wa matukio; “Basi” na “akarudi” vinatoa mtiririko wa kawaida wa Kiswahili bila kupoteza maana ya kufuatana.
- source_word: אֶל יְהוּדָה
  choice: kwa Yuda
  rationale: Kihusishi kinaonyesha kurudi kwa mtu aitwaye Yuda; “kwa Yuda” ni usemi wa kawaida wa Kiswahili kwa kuelekea au kufika aliko mtu.
- source_word: וַיֹּאמֶר
  choice: na kusema
  rationale: Huanzisha maneno ya moja kwa moja katika simulizi; muundo huu unaunganika kwa kawaida na “akarudi” bila kulazimika kurudia kiwakilishi cha mtendaji.
- source_word: לֹא מְצָאתִיהָ
  choice: Sikumpata
  rationale: Hutoa kwa ufupi na kwa kawaida taarifa ya tendo lililokamilika la kutomwona au kutomfikia mtu aliyekuwa akitafutwa.
- source_word: וְגַם
  choice: Tena
  rationale: Inaonyesha hoja ya pili inayoongezwa katika taarifa yake; “Tena” ni ya asili na yenye hadhi katika Kiswahili cha masimulizi.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: wanaume wa mahali pale
  rationale: Inahifadhi maana mahsusi ya nomino ya Kiebrania ya wingi wa kiume pamoja na uhusiano wao na eneo hilo.
- source_word: לֹא הָיְתָה בָזֶה
  choice: Hapa hapakuwa na
  rationale: Muundo wa kuwepo uliokanushwa unatafsiriwa kwa Kiswahili cha kawaida huku “hapa” ikiwakilisha maana ya mahali ya בָזֶה.
- source_word: קְדֵשָׁה
  choice: kahaba wa ibada
  rationale: Neno hili linamtaja mwanamke aliyehusishwa na ukahaba katika mazingira ya kiibada. Tafsiri hii inahifadhi uhusiano wa kiibada bila kudai kwa uhakika kwamba huduma hiyo ilifanyika ndani ya hekalu rasmi.
theological_decisions:
- issue: Maana ya קְדֵשָׁה na uhusiano wake na ibada
  choice: kahaba wa ibada
  alternative: kahaba wa hekaluni; mwanamke aliyewekwa wakfu
  rationale: Muktadha unatofautisha neno hili na זֹנָה, neno la kawaida la kahaba, lakini ushahidi wa neno lenyewe hauhitaji kuamua kwamba alikuwa akihudumu katika hekalu rasmi. Kwa hiyo “wa ibada” huhifadhi tofauti na pia tahadhari ya kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Sentensi imegawanywa ndani ya usemi wa moja kwa moja ili taarifa mbili zisomeke kwa urahisi. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya neno linaloelezwa.
