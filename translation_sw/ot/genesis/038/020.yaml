lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo ... akapeleka
  rationale: Waw ya mfululizo inaendeleza simulizi; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: גְּדִי הָעִזִּים
  choice: mwana-mbuzi
  rationale: Kirai hiki humaanisha mbuzi mchanga; “mwana-mbuzi” ni neno la kawaida na linaunganisha mnyama huyu na yule aliyeahidiwa awali.
- source_word: בְּיַד
  choice: kupitia kwa
  rationale: Nahau ya Kiebrania “kwa mkono wa” huonyesha wakala; Kiswahili cha asili hutumia “kupitia kwa” katika muktadha huu.
- source_word: רֵעֵהוּ
  choice: rafiki yake
  rationale: Neno hili humaanisha rafiki au mwandamani; “rafiki yake” ni wazi na la kawaida katika simulizi.
- source_word: הָעֲדֻלָּמִי
  choice: Mwadulamu
  rationale: Ni jina la kumtambulisha mtu anayetoka Adulamu; umbo la Kiswahili “Mwadulamu” linasomeka kwa urahisi.
- source_word: לָקַחַת
  choice: ili kuichukua tena
  rationale: Kitenzi-jina kinaonyesha kusudi, na muktadha unaonyesha kurudishiwa kile kilichoachwa kama dhamana.
- source_word: הָעֵרָבוֹן
  choice: dhamana
  rationale: Neno hili ni kitu kilichotolewa kama hakikisho au rehani; “dhamana” ni neno la sasa, pana, na linalofaa muktadha.
- source_word: מִיַּד הָאִשָּׁה
  choice: kutoka mkononi mwa yule mwanamke
  rationale: Hifadhi ya “mkono” inadumisha taswira halisi ya Kiebrania huku kirai hiki kikibaki cha asili katika Kiswahili.
- source_word: וְלֹא מְצָאָהּ
  choice: lakini hakumpata
  rationale: “Lakini” huonyesha wazi tofauti kati ya kusudi la safari na kushindwa kwake, huku kiwakilishi kikimtaja yule mwanamke.
