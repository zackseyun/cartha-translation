translation:
  language: sw
  text: Ndipo Yuda akapeleka mwana-mbuzi kupitia kwa[a] rafiki yake Mwadulamu, ili kuichukua tena ile dhamana[b] kutoka mkononi mwa yule mwanamke[c], lakini hakumpata.
