base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: sw
  text: Basi akamwendea pale kando ya njia, akasema[a], “Tafadhali, naomba niingie kwako,” kwa maana hakujua kwamba alikuwa binti-mkwe wake. Naye akasema, “Utanipa nini[b] ili uingie kwangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia usemi “niingie kwako/uingie kwangu,” lugha ya staha inayomaanisha kufanya tendo la ngono.
    reason: lexical_alternative
  - marker: b
    text: Au “Utanilipa nini ili uingie kwangu?” Kiebrania husema kwa maana halisi, “Utanipa nini?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: akamgeukia kando ya njia
  rationale: Kauli hii inaonyesha Yuda akiacha mwelekeo wake na kumwendea Tamari mahali alipokuwa kando ya njia. Kiswahili hiki ni cha kawaida na kinadumisha mwendo wa simulizi.
- source_word: הָבָה־נָּא
  choice: Tafadhali, niruhusu
  rationale: Muungano huu unaonyesha ombi au msisitizo wa upole. Tafsiri hii ni ya asili katika Kiswahili cha sasa.
- source_word: אָבוֹא אֵלַיִךְ
  choice: niingie kwako
  rationale: Kitenzi בוא pamoja na אֶל ni lugha ya staha inayomaanisha kufanya ngono katika muktadha huu. 'Niingie kwako' inadumisha lugha hiyo bila kuifanya wazi zaidi kuliko Kiebrania.
- source_word: כִּי לֹא יָדַע
  choice: kwa maana hakujua
  rationale: כִּי hapa inaanzisha maelezo ya sababu ya kitendo cha Yuda.
- source_word: כִּי כַלָּתוֹ הִוא
  choice: kwamba alikuwa mkwewe
  rationale: '''Mkwewe'' ni neno la kawaida la Kiswahili linaloweza kumaanisha binti-mkwe wake katika muktadha huu; muktadha wa simulizi unamtambulisha Tamari kwa usahihi.'
- source_word: מַה תִּתֶּן לִּי
  choice: Utanipa nini
  rationale: Hii inafuata kwa karibu maana halisi ya 'utanipa nini?' huku muktadha ukidokeza malipo.
- source_word: כִּי תָבוֹא אֵלָי
  choice: ili uingie kwangu
  rationale: Tafsiri hii inadumisha muundo wa kusudi na lugha ileile ya staha ya Kiebrania.
