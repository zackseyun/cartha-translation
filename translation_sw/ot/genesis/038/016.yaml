- from: Basi akamgeukia kando ya njia, akasema[a], “Tafadhali, niruhusu niingie kwako,” kwa maana hakujua kwamba alikuwa mkwewe. Naye akasema, “Utanipa nini[b] ili uingie kwangu?”
  to: Basi akamwendea pale kando ya njia, akasema[a], “Tafadhali, naomba niingie kwako,” kwa maana hakujua kwamba alikuwa binti-mkwe wake. Naye akasema, “Utanipa nini[b] ili uingie kwangu?”
  rationale: Marekebisho yanabainisha uhusiano wa Tamari na Yuda kuwa binti-mkwe wake, yanaboresha mtiririko wa Kiswahili, na yanarekebisha tanbihi ili ilingane na maandishi makuu. Usemi wa staha kuhusu tendo la ngono na utata wa kitenzi “kutoa” katika swali la Tamari vimehifadhiwa.
