base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: sw
  text: Baada ya siku nyingi kupita[a], binti ya Shua[b], mke wa Yuda, akafa. Yuda alipokwisha kufarijiwa[c], alipanda kwenda Timna kwa wakata manyoya wa kondoo wake, yeye pamoja na rafiki yake Hira, Mwadulamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya muda mrefu.” Kihalisi, “siku zikawa nyingi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “binti ya Shua”; baadhi hulichukua hili kuwa jina la mtu, “Bath-shua.”
    reason: alternative_reading
  - marker: c
    text: Au, “Baada ya Yuda kufarijiwa” au “Yuda akafarijiwa.” Kitenzi cha Kiebrania hapa kinamaanisha kufarijiwa baada ya kuomboleza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: Baada ya siku nyingi kupita
  rationale: Nahau hiyo husema kihalisi kwamba siku zilikuwa nyingi; tafsiri hii ya kawaida ya Kiswahili inahifadhi maana ya muda mrefu uliopita.
- source_word: וַתָּמָת
  choice: akafa
  rationale: Hii ndiyo maana ya kawaida ya מות katika simulizi.
- source_word: בַּת שׁוּעַ
  choice: binti ya Shua
  rationale: Kirai cha Kiebrania kinaonyesha wazi uhusiano wa kifamilia; hakilazimishi kukichukulia kuwa jina la mtu Bath-shua.
- source_word: אֵשֶׁת יְהוּדָה
  choice: mke wa Yuda
  rationale: Muundo wa kawaida na wa asili wa umilikaji katika Kiswahili.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: Yuda alipokwisha kufarijiwa
  rationale: Nifali ya נחם hapa inaonyesha kufarijiwa baada ya maombolezo, si kutubu; muundo wa wakati unaunganisha hali hiyo na hatua iliyofuata.
- source_word: וַיַּעַל
  choice: alipanda kwenda
  rationale: Inahifadhi wazo la kuelekea juu katika עלה huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: kwa wakata-manyoya wa kondoo wake
  rationale: Kirai kinaelekeza kwa watu waliokuwa wakikata manyoya ya kundi lake, si lazima kwamba Yuda mwenyewe alienda kufanya kazi hiyo.
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: yeye pamoja na rafiki yake Hira
  rationale: Huwasilisha kwa kawaida kwamba Hira aliandamana na Yuda na kwamba alikuwa rafiki yake.
- source_word: הָעֲדֻלָּמִי
  choice: Mwadulamu
  rationale: Kivumishi cha asili kinaonyesha mtu kutoka Adulamu; umbo la Kiswahili linatambulisha mahali alikotoka.
- source_word: תִּמְנָתָה
  choice: kwenda Timna
  rationale: He ya mwelekeo kwenye jina la mahali inaonyesha mwendo kuelekea Timna.
