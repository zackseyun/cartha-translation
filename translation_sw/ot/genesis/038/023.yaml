  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: sw
  text: Yuda akasema[a], “Mwache avichukue, tusije tukawa kitu cha kudharauliwa. Tazama, nilituma mwana-mbuzi huyu, lakini wewe hukukumpata huyo mwanamke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tusije tukaaibika,” au “tusije tukadhihakiwa.” Usemi wa Kiebrania unamaanisha kuwa kitu cha kudharauliwa au kufanyiwa kejeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: Mwache avichukue
  rationale: 'Muundo huu una maana ya kuruhusu au kukubali: Yuda anakubali mwanamke abaki na vitu vilivyowekwa rehani. Kiambishi cha wingi “vi-” kinaelekeza kwa vitu hivyo vinavyofahamika kutokana na muktadha.'
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: tusije tukawa kitu cha kudharauliwa
  rationale: בּוּז huhusu dharau, aibu ya kijamii, au kufanywa kitu cha kejeli. Tafsiri hii huhifadhi upana wa maana bila kuamua kwamba ni kuchekwa tu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa kauli inayofuata; “Tazama” ni la heshima na linaeleweka katika usomaji wa Biblia wa Kiswahili.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: nilituma mwana-mbuzi huyu
  rationale: גְּדִי ni mbuzi mchanga. “Mwana-mbuzi” ni wazi na huhifadhi kiashiria “huyu” kilichopo katika Kiebrania.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: lakini wewe hukumwona huyo mwanamke
  rationale: 'וְ inaonyesha utofautishaji hapa: Yuda alimtuma mwana-mbuzi, lakini mwenzake hakumpata mwanamke. “Hukumwona” ni usemi wa kawaida wa Kiswahili kwa kutofanikiwa kumpata mtu aliyekuwa akitafutwa; “huyo mwanamke” huweka wazi rejeo la kiambishi cha kike.'
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
