base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: sw
  text: Ikawa alipokuwa akijifungua, mtoto mmoja akatoa mkono,[a] naye mkunga akachukua uzi mwekundu na kuufunga kwenye mkono wake, akisema, “Huyu ndiye aliyetoka kwanza.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkono ukatokea.” Kiebrania kinasema kihalisi, “akatoa mkono,” usemi unaoeleza mkono wa mtoto kujitokeza wakati wa kuzaliwa.
    reason: lexical_alternative
  - marker: b
    text: Uzi mwekundu ulifungwa ili iwe rahisi kutambua ni pacha yupi aliyejitokeza kwanza.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: alipokuwa akijifungua
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi ya tatu kike unaonyesha wakati unaoendelea; usemi huu ni wa asili katika Kiswahili na unaweka wazi mazingira ya kujifungua.
- source_word: וַיִּתֶּן יָד
  choice: mtoto mmoja akatoa mkono
  rationale: Kirai hiki kwa maana halisi ni ‘akatoa/akaweka mkono’ na katika muktadha kinaeleza mkono wa mmoja wa mapacha kujitokeza. ‘Mtoto mmoja’ hudumisha kutotajwa ni yupi bila kuifanya sentensi kuwa tata.
- source_word: הַמְיַלֶּדֶת
  choice: mkunga
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mwanamke anayesaidia wakati wa kujifungua.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: akachukua uzi mwekundu na kuufunga kwenye mkono wake
  rationale: שָׁנִי ni kitu chenye rangi nyekundu-angavu, hapa uzi wa kutambulisha mtoto. Kutaja ‘uzi’ huifanya picha ieleweke kwa kawaida bila kuongeza uzito usiokuwamo katika chanzo.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: Huyu ndiye aliyetoka kwanza
  rationale: Tafsiri hii hutambulisha mtoto aliyedhaniwa kujitokeza kwanza na huepuka kuingiza hadhi ya ‘mzaliwa wa kwanza,’ ambayo haikutajwa wazi katika mstari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi wa Biblia. ‘Mkunga’ na ‘uzi mwekundu’ ni maneno yanayoeleweka kwa urahisi; mpangilio wa sentensi umefanywa wa asili huku ukihifadhi mlolongo wa matendo katika Kiebrania.
