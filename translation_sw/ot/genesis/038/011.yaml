base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: sw
  text: Ndipo Yuda akamwambia Tamari, binti-mkwe wake, “Kaa mjane nyumbani kwa baba yako mpaka mwanangu Shela atakapokua,” kwa maana alisema[a], “Asije naye akafa kama ndugu zake.” Basi Tamari akaenda kukaa nyumbani kwa baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaza.” Kitenzi cha Kiebrania kinachomaanisha “alisema” kinaweza pia kutambulisha mawazo ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלָּתוֹ
  choice: binti-mkwe wake
  rationale: Hutaja kwa uwazi uhusiano wa Tamari na Yuda; ni sahihi zaidi hapa kuliko neno pana ‘mkwewe’.
- source_word: שְׁבִי אַלְמָנָה
  choice: Kaa mjane
  rationale: Amri hii inaonyesha kuendelea kuishi katika hali ya ujane, bila kuongeza wazo lisilomo katika Kiebrania.
- source_word: בֵית אָבִיךְ
  choice: nyumbani kwa baba yako
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha makao katika nyumba au kaya ya baba.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: mpaka mwanangu Shela atakapokua
  rationale: ‘Atakapokua’ huhifadhi maana ya kufikia ukomavu bila kufafanua zaidi ya matini.
- source_word: כִּי אָמַר
  choice: kwa maana alisema
  rationale: Huhifadhi kitenzi halisi ‘alisema’ huku muktadha ukiruhusu kiwe usemi wa ndani.
- source_word: פֶּן יָמוּת גַּם הוּא
  choice: Asije naye akafa
  rationale: Muundo huu wa Kiswahili unaonyesha hofu ya jambo linaloweza kutokea, kama פֶּן.
- source_word: וַתֵּשֶׁב
  choice: akaenda kukaa
  rationale: Katika mfululizo wa masimulizi, ‘kukaa’ huonyesha kwamba Tamari aliishi huko kwa muda, na pia huhifadhi uhusiano na mzizi uliotumiwa katika amri ya awali.
theological_decisions:
- issue: Sababu ya Yuda kumrudisha Tamari nyumbani kwa baba yake
  choice: Kauli ya hofu imehifadhiwa kama sababu ya Yuda bila kuhalalisha au kuhukumu kitendo chake ndani ya mstari huu.
  alternative: Kufafanua kwamba Yuda alimlaumu Tamari au kwamba hakukusudia kumpa Shela.
  rationale: Mawazo hayo yanaweza kudokezwa na muktadha mpana, lakini hayajasemwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Usemi ‘Asije naye akafa’ unadumisha uzito wa hofu ya Yuda bila kutumia mtindo wa kizamani kupita kiasi.
