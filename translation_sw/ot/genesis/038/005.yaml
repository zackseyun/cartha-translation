- from: Akazaa tena mwana, akamwita jina lake Shela. Naye[a] alikuwa Kezibu[b] alipomzaa.
  to: Akazaa tena mwana, akamwita Shela. Naye[a] alikuwa huko Kezibu[b] alipomzaa.
  rationale: The revision removes an unnatural naming calque, improves the locative phrasing, and sharpens the place-name footnote. It retains the source-text ambiguity of the masculine singular verb through the gender-neutral Swahili “Naye,” with the competing feminine understanding explained in the footnote.
  reviewer_model: gpt-5.6-terra
