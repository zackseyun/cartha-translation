base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: sw
  text: Akazaa tena mwana, akamwita Shela. Naye[a] alikuwa huko Kezibu[b] alipomzaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kitenzi cha umoja wa kiume, yaani, “yeye [mwanamume] alikuwa.” Hata hivyo, baadhi ya mashahidi wa kale na wafasiri huelewa maana kuwa, “Naye [mwanamke] alikuwa huko Kezibu alipomzaa.” Anayerejelewa hapa amebishaniwa.
    reason: alternative_reading
  - marker: b
    text: Jina hili la mahali pia huandikwa Kezib au Chezib katika baadhi ya maandiko; maumbo hayo hurejelea mahali pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: Akazaa tena mwana
  rationale: Muundo יסף + עוד unaonyesha tendo lililorudiwa; pamoja na ותלד בן, Kiswahili cha asili na kilicho karibu na Kiebrania ni “akazaa tena mwana.” Kiebrania hakitaji wazi kupata mimba katika mstari huu.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: akamwita jina lake Shela
  rationale: Huhifadhi kwa namna ya kawaida ya Kiswahili muundo wa Kiebrania wa “kuliita jina lake,” huku jina שֵׁלָה likinakiliwa kuwa “Shela.”
- source_word: וְהָיָה
  choice: Naye alikuwa
  rationale: Kitenzi cha Kiebrania kiko katika umoja wa kiume, lakini kiwakilishi cha Kiswahili “naye” hakilazimishi jinsia na hivyo hakisuluhishi kimya-kimya utata wa anayerejelewa; tanbihi inaeleza ushahidi huo.
- source_word: בִכְזִיב
  choice: Kezibu
  rationale: Jina la mahali כזיב limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili. Umbo mbadala linaelezwa katika tanbihi.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: alipomzaa
  rationale: Kiambishi ב pamoja na kitenzi-jina kina maana ya wakati, “alipomzaa”; umbo hili ni fupi, la kawaida, na linaonyesha kwamba mama ndiye aliyemzaa huyo mwana.
theological_decisions:
- issue: Anayerejelewa na וְהָיָה (“alikuwa”)
  choice: Kutumia “Naye” katika matini na kueleza utata katika tanbihi
  alternative: “Yuda alikuwa” au “Naye mwanamke alikuwa”
  rationale: Matini ya Kiebrania ina umbo la kiume, lakini anayerejelewa amebishaniwa na baadhi ya mashahidi wa kale huelekeza kwa mama. Kutaja Yuda au mama moja kwa moja kungeondoa utata uliopo katika ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa urahisi. “Akazaa tena mwana” ni cha moja kwa moja zaidi kutoka Kiebrania kuliko kuongeza wazo lisilotajwa wazi la kupata mimba. “Naye” huhifadhi kwa kawaida utata wa kiwakilishi bila kufanya sentensi kuwa nzito.
