    text: Kiebrania kina kitenzi cha umoja wa kiume, yaani, “yeye [mwanamume] alikuwa.” Hata hivyo, baadhi ya mashahidi wa kale na wafasiri huelewa maana kuwa, “Naye [mwanamke] alikuwa huko Kezibu alipomzaa.” Anayerejelewa hapa amebishaniwa.
    reason: alternative_reading
  - marker: b
    text: Jina hili la mahali pia huandikwa Kezib au Chezib katika baadhi ya maandiko; maumbo hayo hurejelea mahali pamoja.
    reason: lexical_alternative
  revision_rationale: The revision removes an unnatural naming calque, improves the locative phrasing, and sharpens the place-name footnote. It retains the source-text ambiguity of the masculine singular verb through the gender-neutral Swahili “Naye,” with the competing feminine understanding explained in the footnote.
