base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: sw
  text: Ndipo Yuda akavitambua, akasema, “Yeye ana haki kuliko mimi,[a] kwa sababu sikumpa mwanangu Shela awe mume wake.” Wala hakumjua tena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye ndiye mwenye haki zaidi kuliko mimi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “hakumjua tena,” ni lugha ya staha inayomaanisha mahusiano ya kingono.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: akavitambua
  rationale: Kitenzi נכר kinarejelea vitu vya dhamana vilivyoletwa kwa Yuda katika mstari wa 25. Kiambishi cha ngeli ya vitu, -vi-, kinaweka wazi kitu kinachotambuliwa kutokana na muktadha.
- source_word: צָדְקָה מִמֶּנִּי
  choice: Yeye ametenda kwa haki kuliko mimi
  rationale: Muundo wa kulinganisha wenye מן unaonyesha kwamba Tamari alikuwa na haki zaidi ya Yuda katika jambo hili. Kauli hii ya Kiswahili huhifadhi uzito wa kimaadili wa צדק bila kudokeza kwamba Tamari hakuwa na dhambi kabisa.
- source_word: כִּי עַל כֵּן
  choice: kwa sababu
  rationale: Katika muktadha huu, kifungu hiki kinaanzisha sababu ya kukiri kwa Yuda; ‘kwa sababu’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: sikumpa mwanangu Shela awe mume wake
  rationale: Kiebrania kinasema kihalisi ‘sikumpa Shela mwanangu,’ huku ndoa ikidokezwa na muktadha. Kiswahili kinaeleza uhusiano huo ili kuepuka maana isiyo wazi ya ‘kumpa’ pekee.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: Wala hakulala naye tena
  rationale: ידע ni lugha ya staha ya Kiebrania kuhusu mahusiano ya kingono. ‘Kulala naye’ ni lugha ya staha ya Kiswahili iliyo wazi na ya kawaida, nayo ‘tena’ huonyesha kwamba Yuda hakurudia tendo hilo.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: שֵׁלָה
  choice: Shela
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Tathmini ya kimaadili katika kukiri kwa Yuda
  choice: Yuda anakiri kwamba Tamari ametenda kwa haki kuliko yeye katika jambo hili.
  alternative: Yuda anasema tu kwamba Tamari alikuwa na hoja yenye nguvu zaidi, au kwamba Tamari hakuwa na hatia yoyote kabisa.
  rationale: Kauli ya Kiebrania ni ya kulinganisha na inahusu hali hii maalumu. Tafsiri inadumisha uzito wake wa kimaadili bila kuifanya kuwa tamko la kutokuwa na dhambi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya staha imetumiwa kwa mahusiano ya kingono, huku tanbihi ikihifadhi nahau halisi ya Kiebrania.
