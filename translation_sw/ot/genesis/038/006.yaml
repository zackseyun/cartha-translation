  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukulia
  rationale: Kitenzi לָקַח kwa kawaida humaanisha ‘chukua’; pamoja na kiambishi cha kunufaika לְ, ‘akamchukulia ... mke’ kinaonyesha kwamba Yuda alimpatia Eri mke bila kufafanua zaidi utaratibu wa ndoa.
- source_word: אִשָּׁה
  choice: mke
  rationale: Katika muktadha huu neno אִשָּׁה lina maana mahususi ya mwenzi wa ndoa, si ‘mwanamke’ kwa ujumla.
- source_word: לְעֵר
  choice: Eri
  rationale: Muundo ‘akamchukulia Eri’ unawasilisha לְ kama kiashiria cha mtu aliyefanyiwa au kunufaishwa na tendo hilo.
- source_word: בְּכוֹרוֹ
  choice: mzaliwa wake wa kwanza
  rationale: Tafsiri hii inafuata kwa karibu maana ya בְּכוֹר na kuhifadhi dhana ya kuzaliwa kwanza badala ya kusema tu ‘mwanawe mkubwa.’
- source_word: וּשְׁמָהּ
  choice: aliyeitwa
  rationale: Ingawa Kiebrania kinasema kihalisi ‘na jina lake [lilikuwa],’ ‘mke aliyeitwa’ ni Kiswahili cha kawaida na huunganisha sentensi kwa ufasaha bila kubadili maana.
- source_word: תָּמָר
  choice: Tamari
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika mapokeo ya Biblia ya Kiswahili.
