  text: וַ/תָּ֣קָם וַ/תֵּ֔לֶךְ וַ/תָּ֥סַר צְעִיפָ֖/הּ מֵ/עָלֶ֑י/הָ וַ/תִּלְבַּ֖שׁ בִּגְדֵ֥י אַלְמְנוּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: sw
  text: Kisha akainuka, akaenda zake, akaondoa utaji wake, akavaa mavazi yake ya ujane.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: akainuka
  rationale: Qal wayyiqtol ya קום inaendeleza mfululizo wa matendo katika simulizi; “akainuka” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: וַתֵּלֶךְ
  choice: akaenda zake
  rationale: הלך baada ya “akainuka” inaonyesha kuondoka mahali hapo; “akaenda zake” huwasilisha kuondoka kwa lugha ya asili bila kuongeza mahali anakoenda.
- source_word: וַתָּסַר צְעִיפָהּ מֵעָלֶיהָ
  choice: akaondoa utaji wake
  rationale: Hiphil ya סור pamoja na מֵעָלֶיהָ inaonyesha kwamba aliuondoa utaji uliokuwa juu yake. Kiswahili “akaondoa utaji wake” kinatoa maana yote kwa njia ya kawaida bila uradidi usio wa lazima.
- source_word: צְעִיפָהּ
  choice: utaji wake
  rationale: צָעִיף ni kifuniko kinachovaliwa kichwani au usoni; “utaji” linafaa katika muktadha wa Tamari kujisitiri.
- source_word: וַתִּלְבַּשׁ
  choice: akavaa tena
  rationale: לבש humaanisha kuvaa au kujivika. “Tena” linaeleweka kutokana na muktadha wa kurudia mavazi yake ya awali na hufanya Kiswahili kiwe cha kawaida.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: mavazi yake ya ujane
  rationale: Muundo huu unataja mavazi yanayohusishwa na hali yake ya kuwa mjane; “mavazi yake ya ujane” huhifadhi uhusiano huo na mwangwi wa Mwanzo 38:14.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya “aka-” unaakisi wayyiqtol za Kiebrania kwa mtiririko wa kawaida wa simulizi. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti za Kiingereza kuhusu “from upon her” hazileti utata wa maana unaopaswa kuhifadhiwa katika Kiswahili.
