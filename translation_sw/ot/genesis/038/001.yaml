lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Kauli hii ya kisimulizi inaanzisha tukio jipya na kuweka wakati wake kwa Kiswahili cha kawaida; maana rasmi zaidi imehifadhiwa katika tanbihi.
- source_word: וַיֵּרֶד ... מֵאֵת אֶחָיו
  choice: alishuka, akawaacha ndugu zake
  rationale: “Alishuka” huhifadhi maana ya mwelekeo ya ירד, na “akawaacha” huonyesha kwa kawaida kwamba Yuda alijitenga na ndugu zake.
- source_word: וַיֵּט עַד
  choice: akaenda kwa
  rationale: Katika muktadha huu, kitenzi pamoja na kihusishi kinaonyesha kugeuka au kuelekea kwa mtu; “akaenda kwa” ni wazi na ya asili bila kulazimisha picha halisi ya kujinyoosha.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: mtu fulani wa Adulamu
  rationale: Huhifadhi utambulisho wa mtu mahususi kwa mahali alikotoka, huku tanbihi ikionyesha uwezekano wa tafsiri isiyosisitiza “fulani.”
- source_word: וּשְׁמוֹ חִירָה
  choice: jina lake Hira
  rationale: Ni mtindo wa kawaida na wenye hadhi wa Kiswahili wa kutambulisha jina, huku ukifuata kwa karibu muundo wa Kiebrania.
- source_word: חִירָה
  choice: Hira
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
