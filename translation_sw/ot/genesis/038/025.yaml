revisions:
- from: Alipokuwa akitolewa nje[a], alituma ujumbe kwa baba mkwe wake, akisema, “Nina mimba ya mtu mwenye vitu hivi.” Kisha akasema, “Tafadhali tambua pete hii ya muhuri, kamba hizi na fimbo hii ni vya nani.”
  to: Alipokuwa akipelekwa nje[a], alituma ujumbe kwa baba-mkwe wake, akisema, “Nina mimba ya mtu ambaye vitu hivi ni vyake.” Kisha akasema, “Tambua, tafadhali, muhuri huu, kamba hizi, na fimbo hii ni vya nani?”
  rationale: The revision removes the unsupported identification of the seal as a ring, makes the plurality of the cords explicit, improves the possessive clause, and refines the footnote while preserving the Hebrew's progressive passive action and the pointed request for identification.
