translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji wa ‘akasema’ wa Kiebrania kwa kutumia ‘Kisha akasema,’ na lugha ya Tamari imeachwa kuwa ya moja kwa moja na yenye uzito wa ushahidi.
