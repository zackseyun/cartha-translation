base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: sw
  text: Alipokuwa akipelekwa nje[a], alituma ujumbe kwa baba-mkwe wake, akisema, “Nina mimba ya mtu ambaye vitu hivi ni vyake.” Kisha akasema, “Tambua, tafadhali, muhuri huu, kamba hizi, na fimbo hii ni vya nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alipokuwa akitolewa nje.” Hiki ni kitenzi kishirikishi cha kauli tendwa katika Kiebrania, kinachoonyesha tendo lililokuwa likiendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: alipokuwa akitolewa nje
  rationale: Kauli tendwa ya hali endelevu inaonyesha tendo lililokuwa likiendelea; tafsiri hii ni ya kawaida katika Kiswahili na haiongezi wazi mahali au adhabu ambayo haikutajwa katika mstari.
- source_word: שָׁלְחָה
  choice: alituma ujumbe
  rationale: Katika muktadha huu kitenzi cha ‘kutuma’ kinahusu kupeleka taarifa pamoja na vitu vya utambulisho; ‘alituma ujumbe’ huwasilisha maana hiyo kwa ufasaha.
- source_word: חָמִיהָ
  choice: baba mkwe wake
  rationale: Ni istilahi ya moja kwa moja ya uhusiano wa kifamilia katika Kiswahili Sanifu.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ
  choice: ya mtu mwenye vitu hivi
  rationale: Muundo huu wa asili na mfupi unaonyesha kwamba ujauzito umetokana na mwanaume anayemiliki vitu hivyo.
- source_word: הָרָה
  choice: nina mimba
  rationale: Ni usemi wa sasa, wazi na wa kawaida wa Kiswahili kwa hali ya kuwa mjamzito.
- source_word: הַכֶּר נָא
  choice: Tafadhali tambua
  rationale: ‘Tambua’ huhifadhi maana ya kutambua au kubainisha, huku ‘tafadhali’ ikiakisi chembe ya ombi נָא na nguvu ya ushahidi katika muktadha.
- source_word: חֹתֶמֶת
  choice: pete ya muhuri
  rationale: Kifaa hiki ni muhuri binafsi wa utambulisho; ‘pete ya muhuri’ ni wazi kwa msomaji wa kisasa, ingawa neno la Kiebrania lenyewe halilazimishi umbo la pete.
- source_word: פְּתִילִים
  choice: kamba
  rationale: Nomino ya wingi inarejelea kamba zinazohusiana na muhuri; Kiswahili huonyesha wingi wake kupitia kiashiria ‘hizi’.
- source_word: מַטֶּה
  choice: fimbo
  rationale: ‘Fimbo’ ni neno la kawaida na linalofaa kwa kifaa hiki katika simulizi la wahenga.
- source_word: לְמִי ... הָאֵלֶּה
  choice: ni vya nani
  rationale: Huu ni muundo wa asili wa Kiswahili wa kuuliza mwenye vitu vilivyoonyeshwa, na upatanisho wa ‘vya’ unarejelea mkusanyiko wa vitu.
