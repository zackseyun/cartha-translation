    text: Au “alipokuwa akitolewa nje.” Hiki ni kitenzi kishirikishi cha kauli tendwa katika Kiebrania, kinachoonyesha tendo lililokuwa likiendelea.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported identification of the seal as a ring, makes the plurality of the cords explicit, improves the possessive clause, and refines the footnote while preserving the Hebrew's progressive passive action and the pointed request for identification.
