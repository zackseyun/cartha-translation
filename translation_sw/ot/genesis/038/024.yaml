base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: sw
  text: Ikawa baada ya karibu miezi mitatu, Yuda akaambiwa, “Tamari, binti-mkwe wako, amefanya ukahaba[a]; na tazama, pia ana mimba kwa ukahaba[b].” Ndipo Yuda akasema, “Mtoeni nje, naye achomwe moto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amejiendesha kama kahaba”; kwa maana pana zaidi, “amefanya uasherati.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ana mimba kutokana na ukahaba” au “kwa matendo ya ukahaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: Ikawa baada ya karibu miezi mitatu
  rationale: “Ikawa” hudumisha mwendelezo wa usimulizi wa Kiebrania, na “karibu” huhifadhi maana ya ukadiriaji inayotolewa na כְּ.
- source_word: וַיֻּגַּד לִיהוּדָה
  choice: Yuda akaambiwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kiebrania na ni usemi wa kawaida katika Kiswahili cha masimulizi.
- source_word: זָנְתָה
  choice: amefanya ukahaba
  rationale: Huhifadhi taswira mahususi ya ukahaba katika mzizi זנה badala ya kuipanua kimya kimya kuwa uasherati wa aina yoyote.
- source_word: כַּלָּתֶךָ
  choice: mke wa mwanao
  rationale: Hutoa maana mahususi ya uhusiano huu wa kifamilia na kuepuka utata wa neno la Kiswahili “mkwe.”
- source_word: וְגַם הִנֵּה
  choice: tena, tazama
  rationale: “Tena” huonyesha nyongeza yenye msisitizo, na “tazama” huhifadhi mshangao na uelekezaji wa הִנֵּה.
- source_word: הָרָה לִזְנוּנִים
  choice: ana mimba kutokana na ukahaba huo
  rationale: Hueleza kwa Kiswahili cha kawaida uhusiano wa kisababishi huku ikidumisha uhusiano wa kileksika na “amefanya ukahaba.”
- source_word: הוֹצִיאוּהָ
  choice: Mtoeni nje
  rationale: Ni amri ya wingi yenye kiambishi cha nafsi ya tatu ya kike, iliyotafsiriwa moja kwa moja na kwa kawaida.
- source_word: וְתִשָּׂרֵף
  choice: naye achomwe moto
  rationale: Huhifadhi hali ya kutendwa na nguvu ya amri au tamko la hukumu bila kutaja ni nani atakayetekeleza adhabu hiyo.
theological_decisions:
- issue: Istilahi ya dhambi ya kingono katika shtaka dhidi ya Tamari
  choice: amefanya ukahaba / kutokana na ukahaba huo
  alternative: amefanya uasherati / amepata mimba kwa uasherati
  rationale: Kiebrania kinatumia maneno yenye mzizi mmoja, זנה/זנונים, yenye taswira ya ukahaba. Tafsiri inadumisha shtaka hilo mahususi bila kulilegeza kuwa neno la jumla zaidi.
- issue: Nguvu na namna ya hukumu ya Yuda
  choice: Mtoeni nje, naye achomwe moto
  alternative: Mtoeni nje ili achomwe moto / Mtoeni nje mkamchome moto
  rationale: Muundo huu huhifadhi agizo la mara moja na hali ya kutendwa ya kitenzi cha Kiebrania, bila kubainisha mtendaji wa adhabu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Ikawa” na “tazama” hudumisha ladha ya usimulizi wa Biblia bila kutumia lugha nzito kupita kiasi. “Mke wa mwanao” imetumiwa badala ya “mkwe wako” ili kuonyesha wazi kwamba Tamari ni binti-mkwe wa Yuda.
