  text: Alichofanya kilikuwa kibaya machoni pa Yahweh, kwa hiyo Yahweh akamwua yeye pia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: yalikuwa maovu
  rationale: Kitenzi cha Kiebrania kinaeleza tathmini ya kimaadili kwamba tendo hilo lilikuwa baya au ovu; “maovu” hudumisha uzito huo kuliko usemi laini wa kutopendeza.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huu ni msemo wa Kiebrania unaoonyesha tathmini ya Mungu. Kiswahili “machoni pa” huhifadhi taswira ya asili na kinaeleweka kwa kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi “Yahweh,” bila kulibadili kuwa cheo.
- source_word: אֲשֶׁר עָשָׂה
  choice: Yale aliyofanya
  rationale: Kishazi hiki kinarejelea matendo ya Onani katika muktadha uliotangulia. “Yale aliyofanya” ni Kiswahili cha kawaida na hudumisha rejeo la jumla la Kiebrania.
- source_word: וַיָּמֶת
  choice: Yahweh akamwua
  rationale: Hifili ya מות ina maana ya kusababisha mtu afe. Kumtaja Yahweh tena huondoa utata wa kiwakilishi katika Kiswahili na kuhifadhi wazi uwakala wa hukumu ya Mungu.
- source_word: גַּם אֹתוֹ
  choice: yeye pia
  rationale: “Pia” huunganisha kifo cha Onani na kile cha Eri katika mstari uliotangulia; “yeye” hudumisha mkazo uliopo katika אֹתוֹ.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uwakala wa Mungu katika וַיָּמֶת
  choice: Yahweh akamwua yeye pia
  alternative: akamfanya afe pia; naye akafa pia
  rationale: Muundo wa kisababishi unahusisha kifo cha Onani moja kwa moja na tendo la Yahweh. Tafsiri hailegezi hukumu hiyo kuwa kifo kisicho na mtendaji aliyebainishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku msemo wa Kiebrania “machoni pa” na uzito wa hukumu ya Mungu vikihifadhiwa.
