  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: sw
  text: 'Akasema, “Nikupe dhamana gani?” Naye akasema, “Muhuri wako[a], kamba yako, na fimbo yako iliyo mkononi mwako.” Basi akampa vitu hivyo, akaingia kwake[b], naye akachukua mimba kwake.


    [a] Au, “muhuri wako wa kutia alama.” Kiebrania hakibainishi muhuri huo ulikuwa wa umbo gani.


    [b] “Akaingia kwake” ni msemo wa Kiebrania unaomaanisha kufanya naye ngono.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muhuri wako wa kutia alama.” Kiebrania hakibainishi muhuri huo ulikuwa wa umbo gani.
    reason: lexical_alternative
  - marker: b
    text: “Akaingia kwake” ni msemo wa Kiebrania unaomaanisha kufanya naye ngono.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: dhamana
  rationale: Ni kitu kinachotolewa kama hakikisho hadi malipo yatakapotimizwa; “dhamana” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: חֹתָמְךָ
  choice: muhuri wako
  rationale: Neno hili linaashiria muhuri wa kuthibitisha utambulisho au umiliki bila kusema kwamba lazima ulikuwa pete.
- source_word: פְתִילֶךָ
  choice: kamba yako
  rationale: “Kamba” ni tafsiri ya moja kwa moja na haiongezi dhana isiyotajwa kwamba ilikuwa mkufu.
- source_word: מַטְּךָ
  choice: fimbo yako
  rationale: “Fimbo” ni Kiswahili cha kawaida kwa kitu binafsi kinachobebwa mkononi.
- source_word: אֲשֶׁר בְּיָדֶךָ
  choice: iliyo mkononi mwako
  rationale: Inahifadhi taswira halisi ya Kiebrania na kwa kawaida inahusishwa na fimbo.
- source_word: וַיִּתֶּן לָּהּ
  choice: akampa vitu hivyo
  rationale: Kitenzi cha Kiebrania hakitaji kiwakilishi cha vitu, lakini muktadha unaonyesha kwamba alimpa vitu vitatu vilivyoombwa; Kiswahili huhitaji kivumishi hiki kwa uwazi wa kawaida.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: akaingia kwake
  rationale: Inahifadhi tasfida ya Kiebrania kwa kujamiiana; tanbihi inaeleza maana yake ili msomaji asiikose.
- source_word: וַתַּהַר לוֹ
  choice: akapata mimba kutokana naye
  rationale: Inatoa kwa Kiswahili cha sasa maana ya kutungwa kwa mimba na uhusiano unaoonyeshwa na לוֹ, bila kuleta utata wa “mimba yake.”
