  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kahaba’ limetumiwa badala ya maneno ya kizamani au istilahi za kisasa zenye maana za kijamii zisizopatikana wazi katika matini ya Kiebrania.
