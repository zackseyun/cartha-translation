  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: sw
  text: Yuda alipomwona, alidhani kwamba alikuwa kahaba,[a] kwa sababu alikuwa amefunika uso wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimchukulia kuwa kahaba.”
