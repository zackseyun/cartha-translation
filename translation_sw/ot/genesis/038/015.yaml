lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: Yuda alipomwona
  rationale: Kitenzi ראה humaanisha ‘kuona.’ Muundo wa ‘alipomwona’ unaonyesha kwa Kiswahili cha kawaida mfuatano na uhusiano wa wakati kati ya kumwona na kufanya uamuzi unaofuata.
- source_word: וַיַּחְשְׁבֶהָ
  choice: alidhani kwamba alikuwa
  rationale: חשב hapa inaeleza uamuzi wa Yuda akilini kuhusu utambulisho wa Tamari. ‘Alidhani kwamba alikuwa’ ni ya asili na hudumisha kwamba mtazamo wake ulikuwa hitimisho, si jambo lililothibitishwa.
- source_word: לְזוֹנָה
  choice: kahaba
  rationale: זונה humaanisha mwanamke anayefanya ukahaba. ‘Kahaba’ ni neno wazi, la sasa, na linaloeleweka kwa urahisi bila kuingiza istilahi za kisasa za kijamii zisizokuwamo katika Kiebrania.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי inaleta sababu iliyomfanya Yuda afikie hitimisho hilo; ‘kwa sababu’ huonyesha uhusiano huo wa kisababishi moja kwa moja.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: alikuwa amefunika uso wake
  rationale: Kitenzi timilifu כִסְּתָה kinaeleza hali iliyotangulia na iliyosababisha hitimisho la Yuda. ‘Alikuwa amefunika’ hudhihirisha vizuri utangulizi huo katika Kiswahili.
