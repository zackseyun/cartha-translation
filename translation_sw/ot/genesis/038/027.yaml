  text: Wakati wake wa kujifungua ulipofika, tazama, mapacha walikuwa tumboni mwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ulipofika
  rationale: Katika mtiririko wa simulizi, muundo huu unaingiza tukio linalofuata; umeunganishwa na בְּעֵת kuwa kishazi cha wakati cha Kiswahili bila kutumia kauli ya kizamani kama ‘ikawa kwamba’.
- source_word: בְּעֵת
  choice: Wakati
  rationale: Kihusishi pamoja na עֵת huweka mazingira ya wakati; ‘Wakati ulipofika’ ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: לִדְתָּהּ
  choice: wa yeye kujifungua
  rationale: Jina-kitenzi kutoka ילד lenye kiambishi cha nafsi ya tatu umoja wa kike humaanisha wakati wake wa kuzaa; ‘kujifungua’ ni usemi wa sasa na wa heshima, huku ‘yeye’ ikihifadhi rejeo la kiambishi hicho kwa uwazi.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: ‘Tazama’ huhifadhi nguvu ya הִנֵּה ya kuelekeza uangalifu kwenye jambo la kushangaza au muhimu katika simulizi.
- source_word: תְאוֹמִים
  choice: mapacha
  rationale: Nomino hii ya wingi humaanisha watoto wawili waliozaliwa pamoja; ‘mapacha’ ndiyo neno la kawaida na sahihi la Kiswahili.
- source_word: בְּבִטְנָהּ
  choice: tumboni mwake
  rationale: Katika muktadha wa ujauzito na kujifungua, ‘tumboni mwake’ ni tafsiri ya kawaida ya Kiswahili inayowasilisha maana ya mahali watoto walikuwamo.
