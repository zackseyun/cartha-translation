lexical_decisions:
- source_word: וַיַּרְא
  choice: alimwona
  rationale: Kitenzi ראה katika masimulizi humaanisha moja kwa moja ‘kuona’; ‘alikutana naye’ kingeongeza maana isiyotajwa.
- source_word: שָׁם
  choice: Huko
  rationale: Kielezi hiki cha mahali kinarejelea eneo lililotajwa katika muktadha uliotangulia.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: binti ya mtu Mkanaani
  rationale: 'Huhifadhi wazi uhusiano wa Kiebrania: alikuwa binti ya mwanamume ambaye alikuwa Mkanaani.'
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: ambaye jina lake lilikuwa Shua
  rationale: Kiwakilishi cha kiume katika Kiebrania kinaonyesha kuwa Shua ni jina la yule mtu Mkanaani, si la binti yake.
- source_word: וַיִּקָּחֶהָ
  choice: akamchukua
  rationale: Huhifadhi maana ya msingi ya לקח bila kuifanya moja kwa moja kuwa ‘akamwoa,’ ingawa katika muktadha inaweza kudokeza kumchukua kuwa mke.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: akaingia kwake
  rationale: Huhifadhi nahau ya Kiebrania na mtindo wa masimulizi; tanbihi inaeleza kwamba hapa inamaanisha kujamiiana naye.
