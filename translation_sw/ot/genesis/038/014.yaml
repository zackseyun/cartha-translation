base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: sw
  text: Basi akavua mavazi yake ya ujane, akajifunika kwa utaji, akajifunika kabisa, kisha akaketi penye lango la Enaimu[a], kando ya njia ya kwenda Timna. Kwa maana aliona kwamba Shela alikuwa amekua, lakini hakuwa amepewa Shela kuwa mke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kwenye Petah-enayimu.” Maneno ya Kiebrania yanaweza kueleweka kama jina la mahali au kama “penye lango la Enaimu.”'
    reason: Kifungu בְּפֶתַח עֵינַיִם kina utata wa kweli kuhusu iwapo ni jina kamili la mahali au פתח (“lango/ingilio”) ina maana yake ya kawaida.
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: mavazi yake ya ujane
  rationale: Hutafsiri moja kwa moja mavazi yaliyotambulisha hali yake kama mjane, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: akajifunika kwa utaji na kujisitiri
  rationale: 'Huhifadhi vitendo viwili vya Kiebrania: kujifunika kwa utaji na kujisitiri zaidi, bila kuongeza wazi kwamba alijifanya kahaba.'
- source_word: בְּפֶתַח עֵינַיִם
  choice: mahali pa kuingilia Enaimu
  rationale: Huchukulia Enaimu kama jina la mahali huku ikidumisha maana ya פתח kama sehemu ya kuingilia; tanbihi huhifadhi uwezekano mwingine wa kisarufi.
- source_word: תִּמְנָתָה
  choice: kwenda Timna
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea Timna.
- source_word: לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: yeye hakuwa amepewa awe mke wake
  rationale: Huhifadhi muundo wa kutendwa na mkazo unaowezekana juu ya Tamari, kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Nia ya Tamari katika kujifunika
  choice: Maandishi yanasema alijifunika na kujisitiri bila kumwita kahaba katika mstari huu.
  alternative: Kutafsiri kwamba alijifanya kahaba.
  rationale: Utambulisho huo unatokana na muktadha unaofuata, lakini haujasemwa moja kwa moja katika maneno ya mstari huu; kutouongeza huhifadhi mwendo na mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa asili, majina yametoholewa kwa urahisi wa matamshi, na tofauti kati ya kujifunika kwa utaji na kujisitiri imehifadhiwa.
