  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: sw
  text: Eri, mzaliwa wa kwanza wa Yuda, alikuwa mwovu machoni pa Yahwe, naye Yahwe akamwua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri rasmi zaidi, “naye Yahwe akamsababisha afe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: alikuwa
  rationale: Muundo huu unaendeleza simulizi na hapa unafanya kazi pamoja na kivumishi רַע kama kishirikishi cha hali; Kiswahili hakihitaji kiunganishi cha ziada kama “basi” au “sasa”.
- source_word: עֵר
  choice: Eri
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בְּכוֹר יְהוּדָה
  choice: mzaliwa wa kwanza wa Yuda
  rationale: Huhifadhi uhusiano wa kifamilia na mpangilio wa kuzaliwa kwa lugha ya kawaida na wazi.
- source_word: רַע
  choice: mwovu
  rationale: Katika tathmini ya kimaadili mbele za Yahwe, neno hili humwelezea mtu mwenye uovu, si kitu kibaya tu.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi kwa njia ya asili nahau ya Kiebrania inayoonyesha tathmini kwa mtazamo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: וַיְמִתֵהוּ
  choice: akamwua
  rationale: Hifili ya מות inaonyesha usababishaji wa kifo. “Akamwua” ni ya moja kwa moja na ya kawaida katika Kiswahili, huku tanbihi ikihifadhi tafsiri rasmi zaidi “akamsababisha afe”.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni; kutaja “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Utendaji wa Mungu katika kifo cha Eri
  choice: naye Yahwe akamwua
  alternative: naye Yahwe akamsababisha afe
  rationale: Kitenzi cha Kiebrania kinahusisha Yahwe moja kwa moja na kusababisha kifo cha Eri. Tafsiri haisitiri utendaji huo wala kuongeza maelezo kuhusu namna ulivyotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo mfupi na mzito wa hukumu katika chanzo umehifadhiwa.
