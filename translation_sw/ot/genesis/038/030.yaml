  text: Baadaye ndugu yake akatoka, akiwa na uzi mwekundu mkononi mwake, akapewa jina la Zera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Baadaye
  rationale: Inaonyesha tendo lililofuata kwa mpangilio wa wakati na ni Kiswahili cha kawaida na chenye hadhi.
- source_word: יָצָא
  choice: akatoka
  rationale: Katika muktadha wa kuzaliwa, kitenzi hiki kinaeleweka kwa kawaida kuwa mtoto alitoka tumboni.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Ni uhamisho wa moja kwa moja wa neno la undugu linalomrejelea pacha mwingine.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: akiwa na uzi mwekundu mkononi mwake
  rationale: Kirai hiki kinamtambulisha kwa alama iliyofungwa mkononi katika mstari wa 28; 'uzi' imetolewa wazi huko na hivyo si lazima kuweka tanbihi hapa.
- source_word: הַשָּׁנִי
  choice: uzi mwekundu
  rationale: Neno lenyewe humaanisha rangi au kitu chekundu sana; katika muktadha wa karibu ni uzi uliotajwa katika mstari wa 28.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: naye akamwita jina lake
  rationale: Inahifadhi kwa karibu nahau ya Kiebrania 'aliita jina lake' bila kuamua wazi mhusika wa kitendo ambaye maandishi hayamtaji kwa jina.
- source_word: זָרַח
  choice: Zera
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Mhusika aliyempa mtoto jina
  choice: naye akamwita jina lake
  alternative: akapewa jina Zera
  rationale: Kitenzi cha Kiebrania ni umoja wa kiume, lakini rejeleo lake halitajwi wazi. Tafsiri inadumisha muundo huo bila kumtambulisha mhusika kuwa mkunga, Yuda, au mtu mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye viambishi vya mfululizo umetumiwa. Hakuna alama za tanbihi kwa kuwa taarifa ya 'uzi' iko wazi katika muktadha wa karibu na hakuna tanbihi inayohitajika katika rasimu hii.
