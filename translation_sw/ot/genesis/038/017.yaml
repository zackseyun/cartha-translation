  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: sw
  text: Akasema, “Nitakutumia mwana-mbuzi kutoka kundini.” Naye akasema, “Ikiwa utanipa dhamana[a] mpaka utakapomtuma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘rehani’ au ‘hakikisho.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: mwana-mbuzi
  rationale: Kirai hiki humaanisha mbuzi mchanga. ‘Mwana-mbuzi’ ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: מִן הַצֹּאן
  choice: kutoka kundini
  rationale: צֹאן ni kundi la mifugo midogo, hasa kondoo na mbuzi. Kwa kuwa mnyama ametajwa tayari kuwa mwana-mbuzi, ‘kutoka kundini’ ni ya asili na huepuka urudiaji usio wa lazima.
- source_word: עֵרָבוֹן
  choice: dhamana
  rationale: Neno hili humaanisha kitu kinachotolewa kama hakikisho la kwamba ahadi itatimizwa baadaye. ‘Dhamana’ ni neno la sasa, linaloeleweka kwa urahisi, na linafaa katika muktadha huu.
- source_word: עַד שָׁלְחֶךָ
  choice: mpaka utakapomtuma
  rationale: Muundo wa Kiebrania humrejelea Yuda kama mtendaji wa kutuma. Kiambishi ‘-m-’ kinamweka wazi mwana-mbuzi anayeeleweka kutokana na muktadha bila kubadili maana.
- source_word: אִם תִּתֵּן
  choice: Ikiwa utanipa
  rationale: Huhifadhi sharti analoweka Tamari katika mazungumzo ya moja kwa moja; yambwa ‘-ni-’ inaeleweka kutokana na uhusiano wa kitenzi ‘kutoa’ katika muktadha.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: Nitakutumia
  rationale: Huwasilisha ahadi ya Yuda ya kumtumia Tamari mwana-mbuzi. Kiwakilishi huru אָנֹכִי kinaweza kuwa na mkazo, lakini Kiswahili huonyesha nafsi ndani ya kitenzi na hakihitaji ‘mimi’ hapa.
