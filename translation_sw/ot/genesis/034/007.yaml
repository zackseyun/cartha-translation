base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: sw
  text: Wana wa Yakobo walikuja kutoka shambani waliposikia habari hiyo; nao wakahuzunika na kukasirika sana, kwa sababu Shekemu alikuwa ametenda tendo la fedheha katika Israeli kwa kulala na binti ya Yakobo; jambo kama hilo halipaswi kufanywa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׁמְעָם
  choice: walipata habari hiyo
  rationale: Inaonyesha kuwa kurudi kwao kulitokea waliposikia habari ya tukio, kwa Kiswahili cha kawaida na bila kuongeza maelezo yasiyokuwapo.
- source_word: וַיִּתְעַצְּבוּ
  choice: wakahuzunika
  rationale: Kitenzi hiki huonyesha kuumia au kuhuzunika moyoni; ‘wakahuzunika’ ni cha asili na kinatunza uzito wa hisia.
- source_word: נְבָלָה
  choice: jambo la aibu kubwa
  rationale: Neno hilo humaanisha tendo la kipumbavu, ovu na la fedheha linalovunja maadili ya jamii; uchaguzi huu unaonyesha uzito wake bila kulifanya kuwa istilahi ya dhehebu.
- source_word: לִשְׁכַּב אֶת
  choice: kwa kulala na
  rationale: Ni usemi wa kawaida wa Biblia unaorejelea tendo la ngono; tafsiri hii inadumisha staha na maana ya chanzo.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: jambo kama hilo halipaswi kufanywa
  rationale: Inawasilisha kauli ya kimaadili yenye nguvu bila kuigeuza kuwa madai kwamba tendo hilo haliwezi kutokea.
theological_decisions:
- issue: Kauli ‘katika Israeli’ kabla ya taifa la Israeli kuundwa rasmi
  choice: katika Israeli
  alternative: miongoni mwa familia ya Yakobo
  rationale: Jina ‘Israeli’ lipo wazi katika maandishi ya Kiebrania na linaweza kuwa mtazamo wa msimulizi; tafsiri hailainishi mvutano huo wa kihistoria-kisimulizi.
- issue: Nguvu ya marufuku katika kishazi cha mwisho
  choice: halipaswi kufanywa
  alternative: halifanywi
  rationale: Muundo wa Kiebrania unaonyesha kwamba tendo hili halikubaliki kimaadili, si kwamba haliwezi au halijawahi kutokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo umegawanywa katika sentensi mbili kwa mtiririko wa kawaida, huku urudiaji wa ‘wana’ na ‘wanaume hao’ ukihifadhi tofauti kati ya taarifa ya kwanza na mwitikio wao.
