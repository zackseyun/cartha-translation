revisions:
- from: Wana wa Yakobo walipata habari hiyo walirudi kutoka shambani. Wanaume hao wakahuzunika na kukasirika sana, kwa sababu Shekemu alikuwa ametenda jambo la aibu kubwa katika Israeli kwa kulala na binti ya Yakobo; jambo kama hilo halipaswi kufanywa.
  to: Wana wa Yakobo walikuja kutoka shambani waliposikia habari hiyo; nao wakahuzunika na kukasirika sana, kwa sababu Shekemu alikuwa ametenda tendo la fedheha katika Israeli kwa kulala na binti ya Yakobo; jambo kama hilo halipaswi kufanywa.
