base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: sw
  text: Mnaweza kuishi pamoja nasi, nayo nchi itapatikana kwenu[a]. Kaeni humo, fanyeni biashara humo, na mpate milki humo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “nchi itakuwa mbele yenu”; yaani, itapatikana kwa ajili yenu.
    reason: lexical_alternative
  - marker: b
    text: Au “mchukue umiliki humo” au “muwe na haki ya kumiliki humo.” Huenda Kiebrania kinarejelea kupata holding ya mali isiyohamishika au haki ya umiliki katika nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: Mnaweza kuishi pamoja nasi
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kukaa, kuishi, au kufanya makao. Katika mwaliko huu, “mnaweza” huwasilisha ruhusa na mwaliko badala ya unabii mkali wa wakati ujao.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: nayo nchi itakuwa wazi kwenu
  rationale: Usemi wa Kiebrania wa kitu kuwa “mbele ya” mtu unaweza kuonyesha kuwa kinapatikana na kinaweza kutumiwa. “Itakuwa wazi kwenu” ni Kiswahili cha kawaida kinachowasilisha maana hiyo, huku tanbihi ikihifadhi taswira halisi.
- source_word: שְׁבוּ
  choice: Kaeni humo
  rationale: Hii ni amri nyingine kutoka יָשַׁב. “Kaeni humo” ni fupi, ya kawaida, na katika muktadha huu ina maana ya kufanya makao katika nchi hiyo.
- source_word: וּסְחָרוּהָ
  choice: fanyeni biashara humo
  rationale: Mzizi סחר unahusu shughuli za biashara. “Fanyeni biashara humo” ni wazi na wa kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: na mjipatie mali humo
  rationale: Muundo huu wa אָחַז hapa unaelekea kumaanisha kupata umiliki au haki ya kushikilia mali katika nchi. “Mjipatie mali humo” huwasilisha maana ya kijamii na kisheria bila kudai kwamba ni kutwaa nchi yote.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia lugha ya mwaliko katika kishazi cha kwanza, imetoa maana ya nahau “mbele yenu” katika matini huku ikiihifadhi katika tanbihi, na imeepuka kufanya neno la mwisho limaanishe kutwaa nchi yote.
