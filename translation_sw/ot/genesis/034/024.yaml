  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: sw
  text: Watu wote waliotoka langoni mwa mji wake[a] wakawasikiliza Hamori na Shekemu mwanawe[b]. Kila mwanamume miongoni mwa wote waliotoka langoni mwa mji wake akatahiriwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “wote waliotoka katika lango la mji wake.” Huu ni msemo unaowarejelea watu wa mji walioshiriki katika shughuli za umma.
    reason: cultural_note
  - marker: b
    text: Au “wakawatii Hamori na Shekemu mwanawe.” Neno la Kiebrania linaweza kumaanisha si kusikia tu, bali pia kuitikia pendekezo lao kwa kukubali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: wakawasikiliza
  rationale: Muundo huu humaanisha kumsikiliza mtu kwa namna ya kuitikia anachosema. “Wakawasikiliza” huhifadhi maana hiyo bila kuitafsiri kwa nguvu zaidi kuwa walitii.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: watu wote waliotoka kupitia lango la mji wake
  rationale: Tafsiri inadumisha picha halisi ya kutoka kupitia lango la mji na kurudiwa kwake katika aya. Katika mazingira ya kale, msemo huu uliwarejelea watu wa mji walioshiriki katika shughuli za umma.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Hili ni bainisho la moja kwa moja la uhusiano wa Shekemu na Hamori; “Shekemu mwanawe” ni mpangilio wa kawaida na wazi katika Kiswahili.
- source_word: וַיִּמֹּלוּ
  choice: akatahiriwa
  rationale: Nifali ya מול ina maana ya kutendewa au ya kujitendea. Kwa kuwa kirai kinachofuata ni cha umoja wa mgawanyo, כָּל זָכָר, kitenzi cha umoja “akatahiriwa” ni cha kawaida katika Kiswahili huku kikieleza kwamba tendo lilimpata kila mmoja.
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: זָכָר humaanisha kiumbe wa jinsia ya kiume. Katika muktadha wa wakazi wa mji, “kila mwanamume” ni ya asili zaidi kuliko “kila wa kiume” na inadumisha umoja wa mgawanyo wa Kiebrania.
- source_word: שַׁעַר עִירוֹ
  choice: lango la mji wake
  rationale: Tafsiri inadumisha neno halisi la lango, ambalo lilikuwa pia mahali pa shughuli na maamuzi ya umma, badala ya kulibadili kimafafanuzi kuwa “raia” au “viongozi.”
