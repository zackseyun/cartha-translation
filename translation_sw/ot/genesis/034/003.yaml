base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: sw
  text: Nafsi yake ikashikamana na Dina[a], binti ya Yakobo, akampenda msichana huyo, akazungumza naye kwa maneno ya upole[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utu wake wa ndani ukafungamana na Dina.” Kiebrania kinasema kihalisi, “Nafsi yake ikashikamana na Dina.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “akasema na moyo wa msichana huyo.” Hii ni nahau inayoweza kumaanisha kusema naye kwa upole, kwa wema, kwa kumtuliza, au kwa kumtia moyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: Nafsi yake ikashikamana
  rationale: Huhifadhi taswira ya Kiebrania ya nafsi kushikamana kwa karibu, badala ya kuipunguza kuwa tu ‘alimpenda’.
- source_word: בְּדִינָה
  choice: na Dina
  rationale: Kitenzi cha Kiswahili ‘shikamana’ kwa kawaida huandamana na ‘na’ na kwa ufasaha huonyesha kufungamana na mtu.
- source_word: בַּת יַעֲקֹב
  choice: binti ya Yakobo
  rationale: Ni muundo wa kawaida wa Kiswahili unaobaki karibu na kiambatisho cha Kiebrania.
- source_word: וַיֶּאֱהַב
  choice: akampenda
  rationale: אהב ni kitenzi cha kawaida cha kupenda; tafsiri hii hairomantishi wala kuingiza hukumu isiyotajwa katika mstari.
- source_word: הַנַּעֲרָ
  choice: huyo mwanamke kijana
  rationale: Huonyesha mwanamke wa umri mdogo kwa lugha ya sasa yenye heshima, huku kiwakilishi ‘huyo’ kikirejelea Dina aliyetajwa.
- source_word: וַיְדַבֵּר עַל לֵב
  choice: akasema na moyo wa
  rationale: Huhifadhi kwa kiasi kikubwa nahau halisi ya Kiebrania na kutoruhusu maana zake zinazowezekana—kusema kwa upole, kwa wema, au kwa kutia moyo—zifungwe katika tafsiri kuu.
theological_decisions:
- issue: Lugha ya hisia baada ya tendo la ukatili katika muktadha
  choice: Kudumisha maelezo ya mstari kuhusu kushikamana na kupenda bila kuyafanya kuwa ya kimahaba wala kuyawekea hukumu ya ziada ndani ya tafsiri.
  alternative: Kutumia maneno hasi ili kusisitiza kosa, au maneno ya kimahaba ili kulainisha simulizi.
  rationale: Kiebrania kinaripoti hisia na usemi wa Shekemu moja kwa moja. Tafsiri haipaswi kuhalalisha alichofanya wala kuongeza tathmini ambayo mstari huu wenyewe hautoi.
- issue: Nahau ya kusema kwa moyo
  choice: Kuhifadhi nahau katika matini na kueleza wigo wake katika tanbihi.
  alternative: Kutafsiri moja kwa moja kuwa ‘akasema naye kwa upole’ au ‘akamfariji.’
  rationale: Nahau דבר על־לב inaweza kuelekea usemi wa upole, wema, faraja, au ushawishi. Matini kuu yenye sura ya nahau pamoja na tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nafsi’ na ‘moyo’ zimehifadhiwa kwa sababu ni taswira muhimu za Kiebrania; tanbihi zinafafanua maana zake bila kufuta utata wa asili.
