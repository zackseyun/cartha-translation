translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja, na utata wa בֶּטַח umehifadhiwa katika tanbihi.
