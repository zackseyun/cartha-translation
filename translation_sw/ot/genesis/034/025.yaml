source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיוֹתָ֣/ם כֹּֽאֲבִ֗ים וַ/יִּקְח֣וּ שְׁנֵֽי בְנֵי יַ֠עֲקֹב שִׁמְע֨וֹן וְ/לֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔/וֹ וַ/יָּבֹ֥אוּ עַל הָ/עִ֖יר בֶּ֑טַח וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: sw
  text: Siku ya tatu,[a] walipokuwa na maumivu, wana wawili wa Yakobo, Simeoni na Lawi, ndugu wa Dina, kila mmoja akachukua upanga wake, wakauvamia mji ukiwa salama,[b] wakaua kila mtu wa kiume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikawa siku ya tatu, walipokuwa na maumivu, kwamba ...”
    reason: Huonyesha muundo wa moja kwa moja zaidi wa וַיְהִי, ambao tafsiri kuu imeutoa kwa mtiririko wa kawaida wa Kiswahili.
  - marker: b
    text: Au, “wakauvamia mji kwa ujasiri/wakiwa salama.” Neno la Kiebrania בֶּטַח linaweza kueleza namna washambuliaji walivyokuja au hali ya mji uliokuwa salama na usiotazamia shambulio.
    reason: Huhifadhi utata halisi wa uhusiano wa kielezi katika Kiebrania.
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: Siku ya tatu
  rationale: Hutanguliza wakati kwa mtiririko wa kawaida wa simulizi la Kiswahili; וַיְהִי inaendeleza simulizi na si lazima itafsiriwe kwa kishazi tofauti.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: walipokuwa na maumivu
  rationale: Huonyesha hali iliyoendelea wakati huo bila kutaja wazi chanzo cha maumivu, kama ilivyo katika Kiebrania.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: wana wawili wa Yakobo
  rationale: Huwatambulisha wawili miongoni mwa wana wa Yakobo kwa Kiswahili cha kawaida.
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: Simeoni na Lawi
  rationale: Majina haya yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili.
- source_word: אֲחֵי דִינָה
  choice: ndugu zake Dina
  rationale: Neno la Kiebrania ni la wingi wa kiume na hapa linawataja Simeoni na Lawi kuwa ndugu wa Dina.
- source_word: אִישׁ חַרְבּוֹ
  choice: kila mmoja akachukua upanga wake
  rationale: אִישׁ imetumika kwa maana ya ugawaji, yaani kila mmoja akiwa na upanga wake mwenyewe.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: wakauvaa mji
  rationale: Kitenzi pamoja na עַל huonyesha kuujia mji kwa nia ya uhasama; 'kuuvaa mji' ni usemi wa kawaida wa Kiswahili unaodokeza shambulio.
- source_word: בֶּטַח
  choice: ukiwa salama bila tahadhari
  rationale: Inachukuliwa kueleza hali ya mji uliokuwa na usalama na haukutazamia shambulio; tanbihi huhifadhi uwezekano wa kuhusisha kielezi hiki na namna washambuliaji walivyokuja.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: wakaua kila mwanamume
  rationale: הרג ni 'kuua,' na כָּל זָכָר kwa maana halisi ni kila mtu wa jinsia ya kiume; 'kila mwanamume' ni usemi wa asili katika muktadha huu.
