  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: sw
  text: basi tutawapa binti zetu, nasi tutajichukulia binti zenu; tutaishi pamoja nanyi na kuwa watu wamoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na tutakuwa watu wamoja.” Kihalisi, Kiebrania kina “na tutakuwa kwa watu mmoja”; muundo huo unaweza kueleza ama hali inayotokea, “kuwa watu wamoja,” ama hali yenyewe, “tutakuwa watu wamoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: basi tutawapa
  rationale: Waw pamoja na kitenzi timilifu cha nafsi ya kwanza wingi, katika pendekezo lenye sharti, kinaonyesha matokeo ya sharti lililotangulia; “basi tutawapa” ni Kiswahili cha kawaida chenye maana ya wakati ujao na matokeo.
- source_word: אֶת־בְּנֹתֵינוּ לָכֶם
  choice: binti zetu
  rationale: “Binti zetu” huhifadhi neno halisi la kifamilia. Kiambishi cha yambwa katika “tutawapa” tayari kinaonyesha wapokeaji (“ninyi”), hivyo hakihitaji kurudiwa.
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ
  choice: nasi tutajichukulia binti zenu
  rationale: Muundo huu huhifadhi maana ya msingi ya לקח, “kuchukua,” huku kiambishi jirejezi na kitendea kikitoa kwa kawaida wazo la לָנוּ, “kwa ajili yetu.” Muktadha unaonyesha kuwa ni kuwachukua katika ndoa bila kulazimisha ufafanuzi huo ndani ya kitenzi.
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: tutaishi pamoja nanyi
  rationale: ישׁב hapa ni kuishi au kukaa miongoni mwa watu; “kuishi pamoja nanyi” ni usemi wa sasa, wa kawaida na unaoonyesha wazi ushirika wa makazi.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: na kuwa watu wamoja
  rationale: “Watu wamoja” hueleza kundi moja la watu bila kuingiza wazo la dola ya kisasa ambalo “taifa” linaweza kudokeza. “Kuwa” baada ya mfululizo wa vitenzi vya wakati ujao huweza kueleweka kama hali inayotokea kutokana na kuishi na kuoana pamoja.
