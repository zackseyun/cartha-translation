review_pass:
  verdict: revise
  source_fidelity: The draft largely follows the Hebrew. However, “nchi hii” adds a demonstrative not present in הָאָרֶץ, and “yaani Wakanaani na Waperizi” makes the two peoples an exhaustive explanation of all inhabitants rather than retaining the Hebrew’s coordinate phrasing. “Kunishambulia” is somewhat broader than וְהִכּוּנִי (“strike me”); “wanipige” is closer while remaining natural.
  naturalness: The Swahili is generally clear and suitably dignified. “Mimi ni wachache kwa idadi” is a natural way to preserve Jacob’s first-person singular expression while conveying the idiom that his group is small. “Miongoni mwa Wakanaani na Waperizi” is both more natural and more precise than using “yaani.”
  terminology: Yakobo, Simeoni, Lawi, Wakanaani, and Waperizi are appropriate standard forms. “Ninuke vibaya” faithfully retains the Hebrew’s vivid metaphor, with the idiomatic sense properly supplied in the footnote. “Nyumba yangu” can denote Jacob’s household in this context and is retained.
  issues:
  - severity: medium
    issue: “nchi hii” adds “this.”
    rationale: The Hebrew has “the land,” not an explicit demonstrative. The addition is unnecessary and should be removed for closer fidelity.
  - severity: medium
    issue: “yaani Wakanaani na Waperizi” overstates the relationship of the ethnic names to “inhabitants of the land.”
    rationale: The Hebrew says “among the inhabitants of the land, among the Canaanites and the Perizzites.” “Yaani” can imply that these groups exhaustively define all inhabitants. Repeating “miongoni mwa” preserves the coordinate construction.
  - severity: low
    issue: “kunishambulia” is less specific than the Hebrew verb for striking.
    rationale: In this hostile context, “wanipige” preserves the direct object and violent action of וְהִכּוּנִי without adding an interpretive outcome.
  revised_text: Ndipo Yakobo akawaambia Simeoni na Lawi, “Mmeniletea taabu kwa kunifanya ninuke vibaya[a] miongoni mwa wakaaji wa nchi, miongoni mwa Wakanaani na Waperizi. Kwa kuwa mimi ni wachache kwa idadi, watakusanyika dhidi yangu na wanipige, nami nitaangamizwa, mimi pamoja na nyumba yangu.”
  revised_footnotes:
  - marker: a
    text: Au, kwa maana ya nahau, “kwa kunifanya nichukiwe” au “kwa kunifanya niwe chukizo.” Kiebrania kinasema kihalisi, “kwa kunifanya ninuke vibaya.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported demonstrative, replaces the potentially exhaustive “yaani” with wording that mirrors the Hebrew’s twofold “among,” and renders the threatened action as “wanipige” to reflect the source verb more closely. The literal odor metaphor and its idiomatic explanation are retained.
