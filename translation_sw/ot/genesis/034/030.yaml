base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: sw
  text: Ndipo Yakobo akawaambia Simeoni na Lawi, “Mmeniletea taabu kwa kunifanya ninuke vibaya[a] miongoni mwa wakaaji wa nchi, miongoni mwa Wakanaani na Waperizi. Kwa kuwa mimi ni wachache kwa idadi, watakusanyika dhidi yangu na wanipige, nami nitaangamizwa, mimi pamoja na nyumba yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya nahau, “kwa kunifanya nichukiwe” au “kwa kunifanya niwe chukizo.” Kiebrania kinasema kihalisi, “kwa kunifanya ninuke vibaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם
  choice: Mmeniletea taabu
  rationale: Kauli hii ya kawaida inaonyesha tendo la kumletea mtu taabu au maafa, huku ikiendeleza moja kwa moja shtaka la Yakobo.
- source_word: לְהַבְאִישֵׁנִי
  choice: kwa kunifanya ninuke vibaya
  rationale: Inahifadhi taswira halisi na yenye nguvu ya Kiebrania ya ‘kunifanya ninuke,’ inayotumiwa hapa kwa maana ya kuharibu sifa na kufanya mtu achukiwe.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: miongoni mwa wakaaji wa nchi hii
  rationale: Nomino-tendo ya umoja ina maana ya kijumla ya watu wanaokaa katika nchi; ‘wakaaji’ ni Kiswahili cha kawaida na sahihi.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: yaani Wakanaani na Waperizi
  rationale: Makundi haya yanafafanua wakaaji wa nchi wanaotajwa; ‘yaani’ huonyesha uhusiano huo kwa uwazi wa kawaida bila kubadili maana.
- source_word: מְתֵי מִסְפָּר
  choice: watu wangu ni wachache
  rationale: Nahau ya Kiebrania inaonyesha udogo wa idadi. Kuongeza ‘watu wangu’ kunafanya rejeo la kijamii la Yakobo lieleweke katika Kiswahili.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: watakusanyika dhidi yangu
  rationale: Inaonyesha makundi kujikusanya kwa kusudi la uhasama; kitenzi cha Kiswahili tayari hubeba wazo la kuja pamoja.
- source_word: וְהִכּוּנִי
  choice: kunishambulia
  rationale: Katika muktadha wa tishio la pamoja, maana ni kumvamia au kumpiga Yakobo na watu wake. ‘Kunishambulia’ ni wazi na ya asili, bila kulazimisha kwamba pigo lenyewe lazima liue.
- source_word: וְנִשְׁמַדְתִּי
  choice: nitaangamizwa
  rationale: Kitenzi hiki kina nguvu ya kuharibiwa kabisa; ‘kuangamizwa’ ni cha kawaida, chenye uzito, na kinafaa katika sajili ya kibiblia.
- source_word: בֵּיתִי
  choice: nyumba yangu
  rationale: ‘Nyumba’ katika Kiswahili, kama בַּיִת hapa, inaweza kutaja jamaa na wote walio chini ya kaya ya Yakobo, si jengo tu; neno halisi huhifadhi upana huo.
theological_decisions:
- issue: Upeo wa ‘mimi’ katika tishio la kushambuliwa
  choice: watakusanyika dhidi yangu na kunishambulia
  alternative: watakusanyika dhidi yetu na kutushambulia
  rationale: Kiebrania hutumia nafsi ya kwanza umoja hata ingawa baadaye Yakobo anataja nyumba yake. Umoja umehifadhiwa ili kutopanua kimya kimya usemi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Taswira kali ya Kiebrania imehifadhiwa katika matini, huku maana yake ya kinahau ikielezwa katika tanbihi. Sentensi imeundwa kwa mtiririko wa kawaida bila kuondoa msisitizo wa Yakobo juu ya udogo wa kundi lake na hatari ya kuangamizwa kwa kaya yake.
