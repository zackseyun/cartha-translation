  to: Watu hawa wana amani pamoja nasi.[a] Waache wakae katika nchi na wafanye biashara humo,[b] kwa maana, tazama, nchi ina nafasi ya kutosha kwao.[c] Tutawachukua binti zao wawe wake zetu, nasi tutawapa binti zetu kwao.
