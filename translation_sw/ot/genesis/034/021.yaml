base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: sw
  text: Watu hawa wana amani pamoja nasi.[a] Waache wakae katika nchi na wafanye biashara humo,[b] kwa maana, tazama, nchi ina nafasi ya kutosha kwao.[c] Tutawachukua binti zao wawe wake zetu, nasi tutawapa binti zetu kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana uhusiano mwema nasi” au “wanaelewana nasi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na kufanya biashara kupitia nchi hii.” Kiebrania kinaweza kurejelea biashara ndani ya nchi au kupitia eneo lake.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “nchi—tazama—ni pana ya mikono mbele yao,” nahau inayomaanisha kwamba nchi ni kubwa au ina nafasi tele kwao.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: wana amani nasi
  rationale: Kirai hiki kinahifadhi maana ya uhusiano wa amani au maelewano bila kudokeza urafiki wa karibu kuliko Kiebrania kinavyosema.
- source_word: וְיֵשְׁבוּ
  choice: Waache wakae
  rationale: 'Ingawa umbo ni la wakati usiotimilika, katika hotuba hii lina nguvu ya pendekezo au ruhusa: wenyeji wanahimizwa kuwaruhusu watu hao wakae nchini.'
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: na kufanya biashara humo
  rationale: Kitenzi kinahusu shughuli za biashara, na kiwakilishi cha kike kinarejelea nchi kama eneo la biashara; hata hivyo, uwezekano wa maana ya kufanya biashara kupitia nchi umehifadhiwa katika tanbihi.
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili linavuta fikira kwenye sababu inayofuata. “Tazama” ni la heshima, linaeleweka, na huhifadhi dhima yake katika usemi.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: ina nafasi ya kutosha kwao
  rationale: Hii ni nahau inayosema kihalisi kwamba nchi ni “pana ya mikono mbele yao,” yaani ni kubwa na wazi kiasi cha kuwapa nafasi.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: Tutawachukua binti zao wawe wake zetu
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania ya kuwachukua wanawake kuwa wake pamoja na maana ya לָנוּ, “kwa ajili yetu,” inayowakilishwa na “wake zetu.”
- source_word: נִתֵּן לָהֶם
  choice: tutawapa binti zetu wawe wake zao
  rationale: Hii inaonyesha mpango wa ndoa wa pande mbili unaolingana na kishazi kilichotangulia; maneno “wawe wake zao” yanaweka wazi kusudi linaloeleweka katika muktadha.
