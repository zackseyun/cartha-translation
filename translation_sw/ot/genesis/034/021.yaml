translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kisasa. “Waache wakae” ni pendekezo la kuruhusu makazi, “tazama” huhifadhi msisitizo wa usemi, na nahau ya upana imetolewa kwa Kiswahili cha kawaida huku umbo lake halisi likielezwa katika tanbihi.
