lexical_decisions:
- source_word: וְ/אִם לֹא
  choice: Lakini msipo-
  rationale: Kiunganishi kinaanzisha sharti linalotofautiana na pendekezo lililotangulia; “Lakini” pamoja na umbo la masharti “msipo-” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: msipotusikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל humaanisha kusikiliza au kutii/kuzingatia. “Kutusikiliza” hudumisha picha ya msingi bila kuifanya iwe “kututii,” ambayo ni kali zaidi.
- source_word: לְ/הִמּוֹל
  choice: na kutahiriwa
  rationale: Jina-kitenzi la Kiebrania linaeleza tendo linalotakiwa katika kuwasikiliza. Uunganishaji huu ni wa kawaida katika Kiswahili na unadumisha hali ya kutendwa ya kitenzi.
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: tutamchukua binti yetu
  rationale: Mfuatano wa kitenzi una maana ya wakati ujao katika sehemu ya matokeo ya sharti; “binti yetu” ndiyo maana ya moja kwa moja na katika muktadha humrejelea Dina.
- source_word: וְ/הָלָכְנוּ
  choice: na kuondoka
  rationale: Katika muktadha huu הלך humaanisha kwenda zao. “Kuondoka” huwasilisha wazi maana hiyo kwa Kiswahili cha asili.
