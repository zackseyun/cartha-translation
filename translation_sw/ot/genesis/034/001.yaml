  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo wa simulizi wa Kiebrania: Dina anatambulishwa kama binti ya Lea, Lea anaelezwa kuwa alimzaa kwa Yakobo, na Dina anatoka kwa kusudi la kuwaona wanawake/binti wa nchi. “Wanawake wa nchi hiyo” ni ufafanuzi wa kisasa unaokubalika wa nahau בנות הארץ, huku tanbihi ikihifadhi usemi halisi.'
