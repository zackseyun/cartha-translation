  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: sw
  text: Dina, binti ya Lea, ambaye Lea alikuwa amemzalia Yakobo, alitoka kwenda kuwaona wanawake wa nchi hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno kwa neno, “binti za nchi.” Inaweza pia kumaanisha “kwenda kuwatembelea wanawake wa nchi hiyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: alitoka kwenda
  rationale: Kitenzi יצא katika usimulizi kina maana ya kutoka au kwenda nje. “Alitoka kwenda” ni Kiswahili cha kawaida kinachoonyesha mwendo huo bila kuongeza mahali alipotoka.
- source_word: דִינָה
  choice: Dina
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: בַּת לֵאָה
  choice: binti ya Lea
  rationale: Kirai cha uhusiano kinamtambulisha Dina kwa upande wa mama yake; “binti ya Lea” ni wazi na cha asili katika Kiswahili sanifu.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: ambaye Lea alikuwa amemzalia Yakobo
  rationale: Kumtaja Lea tena kunaondoa utata wa kiwakilishi katika Kiswahili. Wakati timilifu “alikuwa amemzalia” unaonyesha tukio la awali lililowekwa kama maelezo ya usuli.
- source_word: לִרְאוֹת
  choice: kwenda kuwaona
  rationale: ראה kimsingi ni “kuona.” Muundo “kwenda kuwaona” unasomeka kwa kawaida baada ya “alitoka” huku ukihifadhi maana ya msingi, bila kuamua moja kwa moja kwamba ilikuwa ziara ya kijamii.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: wanawake wa nchi hiyo
  rationale: Neno kwa neno ni “binti za nchi,” lakini hapa ni nahau inayowarejelea wanawake wa eneo hilo. “Wanawake wa nchi hiyo” ni wazi kwa msomaji wa sasa; tafsiri halisi imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaweka wazi kuwa Lea ndiye aliyemzaa Dina ili kuepuka utata wa kiwakilishi. Kiashiria cha tanbihi kimewekwa baada ya kirai kinachofafanuliwa.
