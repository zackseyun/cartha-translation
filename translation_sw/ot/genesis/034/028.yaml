base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: sw
  text: Walichukua makundi yao ya kondoo na mbuzi, ng’ombe wao, punda wao, na vitu vyote vilivyokuwa mjini, pamoja na vile vilivyokuwa mashambani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: makundi yao ya kondoo na mbuzi
  rationale: צֹאן ni nomino ya jumla inayomaanisha mifugo midogo, hasa kondoo na mbuzi. Kutaja aina hizo mbili huwasilisha maana yake wazi kwa Kiswahili cha kawaida.
- source_word: בְּקָרָם
  choice: ng’ombe wao
  rationale: בָּקָר humaanisha ng’ombe kama kundi la mifugo; “ng’ombe wao” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: חֲמֹרֵיהֶם
  choice: punda wao
  rationale: Neno hili linamaanisha punda kwa wingi, na “punda wao” ni Kiswahili cha sasa na cha kawaida.
- source_word: אֲשֶׁר בָּעִיר
  choice: kila kitu kilichokuwa mjini
  rationale: Muundo wa Kiebrania unaonyesha vitu vilivyochukuliwa ndani ya mji. “Kila kitu kilichokuwa mjini” huonyesha vizuri upana wa vitu vilivyotekwa.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: mashambani
  rationale: שָׂדֶה inaweza kumaanisha shamba au maeneo ya wazi ya mashambani. Wingi wa Kiswahili “mashambani” unaleta maana ya eneo kwa ujumla bila kulazimisha shamba moja maalumu.
- source_word: לָקָחוּ
  choice: Walichukua
  rationale: לָקַח ni kitenzi cha kawaida cha “kuchukua.” Muktadha unaonyesha uporaji, lakini “walichukua” hubaki karibu na Kiebrania bila kuongeza tafsiri ya namna kitendo kilivyofanywa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Makundi yao ya kondoo na mbuzi” linafafanua nomino ya jumla ya Kiebrania, na “mashambani” linasikika kwa kawaida zaidi linapotaja mali iliyokuwa nje ya mji.
