translation:
  language: sw
  text: Ndipo Hamori, baba ya Shekemu, akatoka kwenda kwa Yakobo ili azungumze naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka kwenda
  rationale: Kitenzi יצא katika mfuatano wa masimulizi kinaeleza tendo lililofuata na huhifadhi wazo la kutoka kuelekea mahali fulani. Kiswahili cha kawaida kinahitaji ‘akatoka kwenda’ ili mwelekeo kuelekea kwa Yakobo uwe wazi.
- source_word: חֲמוֹר
  choice: Hamori
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili huku likibaki karibu na jina la Kiebrania.
- source_word: אֲבִי שְׁכֶם
  choice: baba yake Shekemu
  rationale: 'Muundo huu unaonyesha uhusiano wa moja kwa moja: Hamori alikuwa baba ya Shekemu. ‘Baba yake Shekemu’ ni usemi wa kawaida na ulio wazi katika Kiswahili.'
- source_word: אֶל יַעֲקֹב
  choice: kwa Yakobo
  rationale: אֶל huonyesha mwendo kuelekea kwa mtu; ‘kwa Yakobo’ ni namna ya kawaida ya Kiswahili ya kuonyesha kwamba Hamori alimwendea Yakobo.
- source_word: לְדַבֵּר אִתּוֹ
  choice: ili azungumze naye
  rationale: לְ pamoja na kitenzi-jina huonyesha kusudi, nalo אִתּוֹ huonyesha mazungumzo pamoja na mtu. Kiwakilishi ‘naye’ kwa kawaida kinamrejelea Yakobo, aliyetajwa mara moja kabla yake.
- source_word: וַ
  choice: Ndipo
  rationale: Kiunganishi hiki kinaendeleza mfululizo wa masimulizi. ‘Ndipo’ kinaonyesha tendo linalofuata kwa lugha ya Kiswahili iliyo ya asili na yenye hadhi.
