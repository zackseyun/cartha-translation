translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya kisasa, yenye hadhi na rahisi kueleweka. Muundo unadumisha mfuatano wa simulizi, uhusiano wa kifamilia, mwelekeo wa mwendo, na kusudi la Hamori bila kuongeza ufafanuzi usio katika maandishi.
