  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: sw
  text: Lakini wakasema[a], “Je, amtendee dada yetu kama kahaba?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, amfanye dada yetu kama kahaba?” Kitenzi cha Kiebrania kwa maana halisi ni “kufanya,” lakini katika muktadha huu yaelekea kina maana ya “kumtendea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lakini wakasema
  rationale: Waw pamoja na wayyiqtol ya אמר inaendeleza simulizi na kuanzisha jibu la ndugu hao. Katika muktadha huu, “Lakini” linaonyesha kwa kawaida upinzani wao dhidi ya karipio la Yakobo.
- source_word: הַכְזוֹנָה
  choice: kama kahaba
  rationale: Kiambishi cha swali ה, kihusishi כ (“kama”), na nomino זונה (“kahaba”) vinaunda ulinganisho wa swali. “Kahaba” ni neno la sasa, la kawaida, na linaloeleweka katika Kiswahili Sanifu.
- source_word: יַעֲשֶׂה
  choice: angemfanyia
  rationale: עשה lina maana pana ya “kufanya,” na hapa linachukua mtu kama yambwa. “Angemfanyia ... kama” ni Kiswahili cha kawaida kinachohifadhi upana wa kitenzi na wazo la kumtendea mtu kwa namna fulani, bila kufafanua zaidi ya Kiebrania.
- source_word: אֶת
  choice: —
  rationale: Hiki ni kiashiria cha yambwa bainifu na hakitafsiriwi kwa neno maalumu katika Kiswahili; kazi yake inaonekana katika umbo la kiyambwa “-m-” na kirai “dada yetu.”
- source_word: אֲחוֹתֵנוּ
  choice: dada yetu
  rationale: Hili linatafsiri moja kwa moja nomino yenye kiambishi cha nafsi ya kwanza wingi, huku likihifadhi msisitizo wa uhusiano wa kifamilia.
