lexical_decisions:
- source_word: וְהִֽתְחַתְּנ֖וּ אֹתָ֑נוּ
  choice: Oana nasi kwa ndoa
  rationale: Kitenzi cha Kiebrania katika hitpael kinaeleza kuingia pande zote katika uhusiano wa kuoana. Kauli hii ni ya asili katika Kiswahili na inahifadhi maana ya ushirikiano wa pande mbili.
- source_word: בְּנֹֽתֵיכֶם֙
  choice: binti zenu
  rationale: Ni nomino ya wingi yenye kiambishi cha nafsi ya pili wingi; tafsiri ya moja kwa moja na ya kawaida ni “binti zenu.”
- source_word: תִּתְּנוּ לָ֔נוּ
  choice: tupeni ... wawe wake zetu
  rationale: Katika muktadha huu, “kutoa” binti ni kuwatoa waolewe. Nyongeza ya “wawe wake zetu” huifanya maana ya ndoa iwe wazi katika Kiswahili cha sasa bila kubadili dhamira ya kifungu.
- source_word: וְאֶת בְּנֹתֵ֖ינוּ תִּקְח֥וּ לָכֶֽם
  choice: nanyi mchukue binti zetu wawe wake zenu
  rationale: Kitenzi “kuchukua” pamoja na “binti” katika muktadha huu kinamaanisha kuwachukua katika ndoa. Muundo huu unahifadhi ulinganifu wa pande mbili huku ukiondoa utata usio wa lazima katika Kiswahili.
