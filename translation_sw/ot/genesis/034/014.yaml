  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipashio vya Kiebrania: usemi unaelekezwa kwa wingi, dai la kutoweza, “jambo hili,” kumpa dada yao mwanamume, usemi halisi “ambaye ana govi,” na sababu ya kuwa ni aibu/fedheha kwao. Haimwingizii maana ya ‘mume’ au ‘ndoa’ ambayo haijaelezwa wazi katika mstari.'
