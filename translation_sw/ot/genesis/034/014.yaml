  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: sw
  text: Wakawaambia, “Hatuwezi kufanya jambo hili—kumpa dada yetu mwanamume ambaye ana govi[a]—kwa maana hilo ni aibu kwetu.”
  philosophy: optimal-equivalence
