lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: Wakawaambia
  rationale: Muundo huu wa kawaida wa masimulizi unaendeleza tukio linalofuata la kusema; kiambishi -wa- kinahifadhi yambwa ya wingi, ‘wao.’
- source_word: לֹא נוּכַל
  choice: Hatuwezi
  rationale: Kitenzi יכל kinaeleza uwezo; ‘hatuwezi’ ni Kiswahili cha sasa na cha asili kinachohifadhi dai la kutoweza.
- source_word: לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: kufanya jambo hili
  rationale: Tafsiri hii inahifadhi nomino דָּבָר huku ikitumia msemo wa kawaida na unaoeleweka wa Kiswahili.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: kumpa dada yetu
  rationale: נתן ina maana ya msingi ya ‘kutoa/kumpa.’ Muktadha unaonyesha ndoa, kwa hiyo tafsiri haiongezi waziwazi ‘aolewe’ au ‘katika ndoa.’
- source_word: לְאִישׁ
  choice: mwanamume
  rationale: אִישׁ hapa ni ‘mwanamume’; uchaguzi huu huepuka kuingiza maana ya ‘mume’ ambayo, ingawa inawezekana kimuktadha, haijasemwa moja kwa moja.
- source_word: אֲשֶׁר לוֹ עָרְלָה
  choice: ambaye ana govi
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania, ‘ambaye ana govi,’ badala ya kuubadilisha moja kwa moja kuwa kivumishi ‘asiye tahiriwa.’
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: kwa maana hilo ni aibu kwetu
  rationale: חֶרְפָּה hueleza aibu, fedheha, au shutuma ya kijamii; ‘aibu’ ni neno la kawaida, lenye heshima, na linalofikisha uzito wa kijamii wa kauli hiyo.
