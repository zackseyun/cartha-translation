  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: sw
  text: Ndipo Shekemu akawaambia baba yake na ndugu zake, “Naomba nipate kibali machoni penu, na chochote mtakachoniambia nitatoa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” pamoja na kitenzi cha usimulizi “akamwambia” ni Kiswahili cha kawaida kinachohifadhi mfuatano.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: akamwambia baba yake na ndugu zake
  rationale: Kirai kinawataja baba yake Dina na ndugu zake wa kiume. Kiswahili hakihitaji kurudia kihusishi ili kuonyesha walengwa wote.
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: Naomba nipate kibali machoni penu
  rationale: Hii inahifadhi sitiari ya Kiebrania ya ‘kupata kibali machoni’ huku “Naomba” ikionyesha nguvu ya ombi la kauli hiyo.
- source_word: וַאֲשֶׁר תֹּאמְרוּ אֵלַי
  choice: na chochote mtakachoniambia
  rationale: Tafsiri hii huhifadhi maana pana ya ‘chochote mtakachosema kwangu’ bila kuibana kuwa ombi la malipo pekee.
- source_word: אֶתֵּן
  choice: nitatoa
  rationale: נָתַן maana yake ya msingi ni ‘kutoa.’ “Nitatoa” ni ya asili katika muktadha huu na haibani maana kuwa ‘nitalipa.’
