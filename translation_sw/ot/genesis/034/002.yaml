base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: sw
  text: Shekemu mwana wa Hamori, Mhivi, mkuu wa nchi, alipomwona, alimchukua, akalala naye, akamdhalilisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamtesa” au “akamkiuka kingono.” Kitenzi cha Kiebrania kinaweza kumaanisha kutesa, kudhalilisha, au kumkiuka; katika muktadha huu kinarejelea ukiukaji wa kingono. Tafsiri nyingi husema wazi zaidi “akambaka” ili kuonyesha nguvu ya kulazimisha katika usemi mzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: alipomwona
  rationale: Hutoa maana ya kawaida ya ראה katika mtiririko wa simulizi na kuunganisha sentensi kwa Kiswahili cha asili.
- source_word: שְׁכֶם בֶּן חֲמוֹר הַחִוִּי
  choice: Shekemu mwana wa Hamori, Mhivi
  rationale: Majina yameandikwa kwa umbo linalotumika katika Kiswahili cha Biblia, na jina la kabila limewasilishwa kwa ufupi na kwa kawaida.
- source_word: נְשִׂיא הָאָרֶץ
  choice: mkuu wa nchi
  rationale: נָשִׂיא humaanisha kiongozi, mkuu, au mwana wa kifalme; “mkuu” huhifadhi hadhi ya kisiasa bila kudokeza kwa lazima kwamba alikuwa mfalme.
- source_word: וַיִּקַּח אֹתָהּ
  choice: alimchukua
  rationale: Huhifadhi maana ya msingi ya לקח na mfuatano wa Kiebrania; shuruti na ubaya wa tendo hujitokeza wazi zaidi katika kishazi cha mwisho.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: akalala naye
  rationale: Ni nahau ya Kiswahili inayoeleweka kwa tendo la ngono na huhifadhi mtindo mzito wa simulizi.
- source_word: וַיְעַנֶּהָ
  choice: akamnajisi
  rationale: Katika muktadha huu wa kingono, piel ya ענה inaonyesha kumtesa, kumdhalilisha, au kumkiuka kingono. “Akamnajisi” huonyesha wazi ukiukaji na fedheha ya kingono bila kuficha uzito wa tendo.
theological_decisions:
- issue: Kuwasilisha ukatili wa kingono kwa uaminifu bila kutumia tafsida wala kufafanua kupita kiwango cha neno la Kiebrania
  choice: alimchukua, akalala naye, akamnajisi
  alternative: alimkamata na kumbaka; alimchukua, akalala naye, akamdhalilisha
  rationale: Mfuatano ויקח... וישכב... ויענה unaonyesha tendo la kingono la kulazimisha na la kumvunjia heshima. Tafsiri huhifadhi hatua za simulizi huku “akamnajisi” ikionyesha wazi ukiukaji wa kingono; tanbihi inadumisha upana wa kimaana wa ענה na kutaja tafsiri iliyo wazi zaidi ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. Muundo wa simulizi ni wa kawaida, huku uzito wa ukatili wa kingono ukielezwa wazi bila kuongeza maelezo yasiyokuwamo katika chanzo.
