translation:
  language: sw
  text: Pia wakawaua Hamori na mwanawe Shekemu kwa upanga[a], wakamchukua Dina kutoka katika nyumba ya Shekemu, kisha wakatoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa kinywa cha upanga,” nahau inayomaanisha kuua kwa upanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: Pia wakamuua Hamori na mwanawe Shekemu
  rationale: Kiunganishi kinaendeleza na kuongeza waliouawa baada ya mstari uliotangulia. Mpangilio huu ni wa asili katika Kiswahili na unaweka wazi kwamba Shekemu alikuwa mwana wa Hamori.
- source_word: הָרְגוּ
  choice: wakamuua
  rationale: Kitenzi הרג humaanisha kuua; tafsiri hii ni ya moja kwa moja, ya sasa, na inafaa kwa masimulizi.
- source_word: לְפִי חָרֶב
  choice: kwa upanga
  rationale: Hii ni nahau ya Kiebrania ambayo kihalisi ni ‘kwa kinywa cha upanga’ na humaanisha kuua kwa kutumia upanga. ‘Kwa upanga’ ni Kiswahili cha kawaida huku usemi halisi ukihifadhiwa katika tanbihi.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: wakamchukua Dina
  rationale: לקח kwa kawaida ni ‘chukua’; hakuna haja ya kuongeza maana kali ya ‘kunyakua’ ambayo haijaamuliwa na neno lenyewe.
- source_word: מִבֵּית שְׁכֶם
  choice: kutoka katika nyumba ya Shekemu
  rationale: בית hapa inaeleweka kwa kawaida kuwa nyumba au makao halisi. Muundo huu unahifadhi uhusiano wa umiliki bila kuufasiri kuwa ‘jamaa ya nyumbani.’
- source_word: וַיֵּצֵאוּ
  choice: kisha wakaondoka
  rationale: יצא ni kutoka au kuondoka. Katika muktadha huu, ‘wakaondoka’ hueleza kwa asili mwendo wao kutoka mahali hapo; ‘kisha’ huendeleza mfuatano wa masimulizi.
