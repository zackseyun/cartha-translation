lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: Nitakieni ... kubwa sana
  rationale: Kauli ya kuamuru kwa wingi ina maana ya kuwawekea au kuwataka walipishe kiasi kikubwa; Kiswahili hiki ni cha kawaida na kinahifadhi mkazo wa מְאֹד.
- source_word: מֹהַר
  choice: mahari
  rationale: Katika muktadha huu ni malipo yanayotolewa na bwana arusi au familia yake kwa familia ya bibi arusi. Neno 'mahari' ndilo linalotumika kwa kawaida katika Kiswahili, huku tanbihi ikifafanua maana yake mahususi hapa.
- source_word: וּמַתָּן
  choice: na zawadi
  rationale: Neno hili linamaanisha zawadi ya ziada inayoambatana na malipo ya ndoa.
- source_word: וְאֶתְּנָה
  choice: nami nitatoa
  rationale: Umbo la Kiebrania linaonyesha azimio au utayari wa msemaji; wakati ujao wa Kiswahili unawasilisha hilo kwa ufasaha.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: chochote mtakachoniambia
  rationale: Huhifadhi hali ya kukubali kiasi au masharti yoyote watakayoyataja.
- source_word: וּתְנוּ לִי
  choice: ila nipeni
  rationale: Kiunganishi kinaendeleza ombi kuu baada ya ahadi ya malipo; 'ila' huonyesha kwamba hili ndilo jambo analolitaka kuliko yote bila kulifanya kuwa sharti lisilokuwamo.
- source_word: הַנַּעֲרָ
  choice: huyo mwanamke kijana
  rationale: Hurejelea mwanamke wa umri wa kuolewa; tafsiri hii inaeleweka na haidokezi kwa lazima kwamba ni mtoto.
- source_word: לְאִשָּׁה
  choice: awe mke wangu
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza ombi la kumpewa mwanamke huyo katika ndoa; kiwakilishi 'wangu' kinaeleweka kutokana na 'nipeni'.
