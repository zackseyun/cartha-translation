lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Ni kwa sharti hili tu
  rationale: אַךְ inaweka ukomo wa makubaliano, na בְּזֹאת inatanguliza sharti linalofuata. Usemi huu ni wa kawaida na wazi katika Kiswahili cha mazungumzo ya mapatano.
- source_word: נֵאוֹת לָכֶם
  choice: tutakubali kupatana nanyi
  rationale: Kitenzi cha Kiebrania katika Niphal kinaeleza kuwa tayari au kukubali. ‘Kupatana nanyi’ huonyesha kwa kawaida upande wanaokubaliana nao bila kuifanya לָכֶם kuwa tafsiri ya neno kwa neno.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: ikiwa mtakuwa kama sisi
  rationale: Muundo wa sharti umehifadhiwa, na ‘mtakuwa’ huacha wazi wazo la kuingia katika hali ya kufanana nao kutokana na tendo linalotajwa.
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: kwa kila mwanamume miongoni mwenu kutahiriwa
  rationale: Tafsiri hii huhifadhi hali tendwa ya infinitivu ya Kiebrania na maana ya ugawaji ya כָּל זָכָר, huku לָכֶם ikionyesha wanaume walio katika kundi lao.
