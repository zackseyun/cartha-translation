  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: sw
  text: Kijana huyo hakukawia kufanya jambo hilo[a], kwa sababu alipendezwa sana na binti ya Yakobo[b], naye ndiye aliyeheshimiwa kuliko wote katika nyumba ya baba yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakusita kufanya jambo hilo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alimtamani binti ya Yakobo,” au “alifurahishwa na binti ya Yakobo.”
    reason: lexical_alternative
  - marker: c
    text: Au, “naye alikuwa ndiye mwenye kuheshimiwa zaidi katika nyumba yote ya baba yake.”
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: hakukawia
  rationale: Kitenzi hiki kimsingi humaanisha kuchelewa au kukawia. Katika muktadha huu kinaonyesha kwamba kijana huyo alitenda bila kuchelewa.
- source_word: הַנַּעַר
  choice: Kijana huyo
  rationale: Neno linamtaja Shekemu; “kijana huyo” ni la kawaida, wazi, na linafaa katika simulizi.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: kufanya jambo hilo
  rationale: Hurejelea tendo lililotakiwa katika mistari iliyotangulia, huku likihifadhi kwa njia ya kawaida nahau ya Kiebrania.
- source_word: חָפֵץ
  choice: alipendezwa sana na
  rationale: Kitenzi hiki huonyesha kupendezwa, kufurahia, au kutamani kwa nguvu. Tafsiri hii inadumisha maana ya hisia chanya bila kuifanya iwe tamaa ya kingono pekee.
- source_word: נִכְבָּד
  choice: aliyeheshimiwa
  rationale: Kauli ya Niphal ya כבד hapa ina maana ya kuwa mwenye heshima au kuthaminiwa.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: kuliko wote katika nyumba ya baba yake
  rationale: Muundo huu unaonyesha ulinganisho wenye maana ya kiwango cha juu. “Nyumba ya baba yake” inaweza kumaanisha watu wa nyumba au ukoo wa baba yake.
