base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: sw
  text: Yakobo akasikia kwamba Dina, binti yake, alikuwa ametiwa unajisi[a]. Lakini wanawe walikuwa kondeni pamoja na mifugo yake, hivyo Yakobo akanyamaza mpaka walipokuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dina, binti yake, alikuwa amevunjiwa heshima kingono.” Kitenzi cha Kiebrania humaanisha kihalisi “kutia unajisi” au “kufanya kuwa najisi”; katika muktadha huu kinarejelea kuvunjiwa kwa Dina heshima kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: akasikia
  rationale: Kitenzi hiki kinaeleza Yakobo kupokea habari; “akasikia” ni cha moja kwa moja na kinafaa katika masimulizi.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha maudhui ya habari aliyosikia Yakobo.
- source_word: טִמֵּא
  choice: alikuwa amemtia unajisi
  rationale: Kauli hii huhifadhi maana ya msingi ya kumfanya mtu kuwa najisi, huku wakati timilifu ukionyesha kwamba tendo lilikuwa limetokea kabla Yakobo hajasikia habari hiyo.
- source_word: בִתּוֹ
  choice: Dina, binti yake
  rationale: Hii inatafsiri wazi uhusiano wa kifamilia na kuweka jina pamoja na maelezo yake kwa Kiswahili cha kawaida.
- source_word: וּבָנָיו
  choice: Lakini wanawe
  rationale: '“Lakini” huonyesha tofauti ya kimazingira: Yakobo alikuwa amesikia, lakini wanawe hawakuwapo pamoja naye.'
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: walikuwa kondeni pamoja na mifugo yake
  rationale: Tafsiri hii inadumisha maelezo ya mahali na kuwa kwao pamoja na mifugo, bila kuongeza kwamba walikuwa wakiichunga.
- source_word: מִקְנֵהוּ
  choice: mifugo yake
  rationale: Neno hili linahusu kwa upana wanyama wanaofugwa, si ng’ombe peke yao.
- source_word: וְהֶחֱרִשׁ
  choice: hivyo Yakobo akanyamaza
  rationale: “Akanyamaza” linaeleza kwamba Yakobo hakusema wala kuchukua hatua kwa maneno kwa wakati huo; “hivyo” huweka wazi uhusiano wa kimantiki na kutokuwapo kwa wanawe.
- source_word: עַד בֹּאָם
  choice: mpaka walipokuja
  rationale: Hii inafuata maana halisi ya kuja kwao bila kuongeza wazo la kurudi, ingawa kurudi kunaeleweka kutokana na muktadha.
theological_decisions:
- issue: Mhusika aliyemtia Dina unajisi hatajwi kwa jina katika mstari huu
  choice: alikuwa amemtia unajisi
  alternative: Shekemu alikuwa amemtia unajisi
  rationale: Kiebrania kina kitenzi chenye mhusika wa nafsi ya tatu bila kutaja jina hapa. Kiswahili kinaweza kuhifadhi utegemezi huo kwa muktadha, badala ya kuongeza jina la Shekemu kutoka mstari uliotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kondeni” linafaa kwa eneo la wazi ambako mifugo ilikuwapo, na sentensi huepuka kuongeza kwamba wana walikuwa wakiichunga. Alama ya tanbihi imewekwa mara tu baada ya kirai “binti yake,” kinachokamilisha taarifa ya tendo dhidi ya Dina.
