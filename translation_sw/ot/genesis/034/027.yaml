  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: sw
  text: Wana wa Yakobo wakawafikia waliouawa[a], wakateka nyara mji kwa sababu dada yao alikuwa amenajisiwa humo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawajia waliouawa.” Kiebrania kinaweza kueleza mwendo wa kuwajia au kuwaendea wale waliokuwa tayari wameuawa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi kina kishazi kilichobanwa: “mji ambao walikuwa wamemnajisi dada yao.” Pia kinaweza kutafsiriwa, “wakateka nyara mji ambamo dada yao alikuwa amenajisiwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: Wana wa Yakobo
  rationale: Muundo wa nomino tegemezi umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida, huku ukisisitiza kwamba wahusika ni wana wa Yakobo kama kundi.
- source_word: בָּאוּ עַל
  choice: wakawafikia
  rationale: Kitenzi pamoja na עַל huonyesha kuwajia au kuwafikia watu hao. Chaguo hili linaonyesha mwendo kuelekea mahali walipokuwa waliouawa bila kudai kwamba walishambuliwa tena.
- source_word: הַחֲלָלִים
  choice: waliouawa
  rationale: Neno hili kwa kawaida humaanisha watu waliouawa kwa nguvu, si wafu kwa ujumla wala waliojeruhiwa tu.
- source_word: וַיָּבֹזּוּ
  choice: wakateka nyara
  rationale: בזז humaanisha kuchukua mali kama nyara baada ya ushindi au mauaji. ‘Kuteka nyara’ ni usemi wa sasa, wazi na wenye hadhi.
- source_word: הָעִיר
  choice: mji
  rationale: עִיר ni neno la kawaida kwa mji; ‘mji’ linafaa kwa mazingira haya bila kudokeza ukubwa usiotajwa.
- source_word: אֲשֶׁר
  choice: kwa sababu … humo
  rationale: Kishazi cha Kiebrania kimebanwa na kinaweza kueleweka kama cha uhusiano au cha sababu. Tafsiri kuu inaonyesha maana ya sababu na kuhusianisha unajisi na mji bila kuwafanya wana wa Yakobo waonekane kuwa watendaji wa unajisi.
- source_word: טִמְּאוּ
  choice: alikuwa amenajisiwa
  rationale: Piel ya טמא hapa huonyesha kunajisi kwa maana ya kingono, kimaadili na kijamii. Kauli ya kutendwa huepusha utata wa kiwakilishi katika Kiswahili huku ikihifadhi tendo lenyewe.
- source_word: אֲחוֹתָם
  choice: dada yao
  rationale: Hii ni tafsiri ya kawaida ya umilikaji na inadumisha uzito wa kosa lililofanywa dhidi ya mtu wa familia yao.
theological_decisions:
- issue: Utambulisho wa waliomnajisi dada yao
  choice: 'Kauli ya kutendwa: ‘dada yao alikuwa amenajisiwa humo’'
  alternative: ‘walikuwa wamemnajisi dada yao’
  rationale: Kauli tendaji yenye ‘wao’ ingeweza kueleweka kimakosa kuwa wana wa Yakobo ndio waliomnajisi dada yao. Kauli ya kutendwa haimtaji mtendaji ambaye Kiebrania humwacha atambulike kutokana na muktadha, lakini inaunganisha tendo na mji kwa ‘humo’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi wenye ‘waka-’ unafaa kwa simulizi. ‘Kuteka nyara’ limetumiwa kwa uporaji wa mali, na kauli ya kutendwa katika kishazi cha mwisho imezuia utata hatari wa kiwakilishi bila kuingiza jina la mtendaji lisilopo wazi katika mstari.
