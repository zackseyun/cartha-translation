  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: sw
  text: Walitwaa mali yao yote, wakawachukua mateka watoto wao wote wadogo[a] na wake zao; wakapora kila kitu kilichokuwa katika nyumba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wao wote”; neno la Kiebrania linaweza kumaanisha hasa watoto wadogo au wategemezi wa kaya.
    reason: lexical_alternative
  - marker: b
    text: Au “kila kitu kilichokuwa katika kaya”; neno la Kiebrania linalomaanisha “nyumba” wakati mwingine linaweza kuwakilisha kaya pamoja na mali yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: mali zao zote
  rationale: Katika muktadha huu חֵילָם humaanisha mali au rasilimali zao, si jeshi; “mali” ni pana na ya kawaida katika Kiswahili.
- source_word: טַפָּם
  choice: watoto wao wote wadogo
  rationale: טַף kwa kawaida huonyesha watoto wadogo au wategemezi wa kaya; tafsiri hii inadumisha msisitizo wa udogo wao.
- source_word: נְשֵׁיהֶם
  choice: wake zao
  rationale: Ingawa אִשָּׁה inaweza kumaanisha mwanamke au mke, kiambishi cha umilikaji na orodha ya watu wa kaya vinaunga mkono maana ya “wake zao.”
- source_word: שָׁבוּ
  choice: waliteka
  rationale: שָׁבָה ni kuwachukua watu mateka. Katika sentensi hii, “waliteka” pia inaweza kuhusisha mali iliyotwaliwa kama nyara bila kuvunja mpangilio wa Kiebrania.
- source_word: וַיָּבֹזּוּ
  choice: wakapora
  rationale: בזז huonyesha uporaji wa mali kwa nguvu; “wakapora” ni ya asili na inadumisha uzito wa kitendo hicho.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: kila kitu kilichokuwa nyumbani
  rationale: Tafsiri hii inafuata umoja wa בַּבָּיִת na ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana pana ya kaya.
