translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Mpangilio wa vitu vilivyotekwa umehifadhiwa kadiri iwezekanavyo, na alama ya nuktamkato inasaidia kutofautisha kuteka na kupora bila kuondoa mvutano wa kisintaksia wa Kiebrania.
