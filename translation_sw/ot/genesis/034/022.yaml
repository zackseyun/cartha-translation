base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: sw
  text: 'Ila kwa sharti hili tu wanaume hawa watakubali kuishi nasi na kuwa jamii moja: kila mwanamume miongoni mwetu atahiriwe, kama wao walivyotahiriwa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Lakini ... kwa sharti hili tu
  rationale: אַךְ ina nguvu ya kuweka mpaka au sharti, huku בְּזֹאת ikitambulisha sharti hilo. Muundo huu ni wa kawaida katika Kiswahili na pia huhifadhi mpito wa hoja katika muktadha.
- source_word: יֵאֹתוּ לָנוּ
  choice: watakubali
  rationale: Nifali ya אוה hapa huonyesha kukubali au kuwa tayari katika mazungumzo. 'Watakubali' ni wazi na ya asili, bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: הָאֲנָשִׁים
  choice: watu hawa
  rationale: Nomino inaelekeza kwa wanaume wanaozungumziwa katika muktadha. Kiswahili mara nyingi hutumia 'watu hawa' kwa kundi hilo; sharti linalofuata linaweka wazi kuwa tohara inamhusu kila mwanamume.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: kuishi nasi
  rationale: ישב hapa ni kukaa au kuishi pamoja. 'Kuishi nasi' ni Kiswahili cha sasa na cha kawaida.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: kuwa taifa moja nasi
  rationale: עַם אֶחָד hueleza jamii iliyoungana. 'Taifa moja' ni usemi wa kawaida wa kibiblia katika Kiswahili; 'nasi' huonyesha wazi ushirika unaokusudiwa na muktadha.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: kila mwanamume miongoni mwetu atahiriwe
  rationale: Infinitivu yenye בְּ inaweka sharti. זָכָר humaanisha mtu wa jinsia ya kiume; hapa 'kila mwanamume' inasomeka kwa kawaida katika muktadha wa hotuba, huku 'miongoni mwetu' ikiwakilisha לָנוּ.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: kama wao walivyotahiriwa
  rationale: Kishazi kinatoa ulinganisho na hali ya kundi jingine. Wakati uliokamilika wa Kiswahili unaeleza kwa kawaida hali yao iliyotokana na tendo la tohara.
