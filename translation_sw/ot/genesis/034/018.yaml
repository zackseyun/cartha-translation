  text: Their words seemed good to Hamor and to Shechem son of Hamor[a].
translation:
  language: sw
  text: Maneno yao yalionekana kuwa mazuri kwa Hamori na kwa Shekemu mwana wa Hamori.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maneno yao yaliwapendeza Hamori na Shekemu mwana wa Hamori.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: yalionekana kuwa mazuri
  rationale: Kitenzi יטב pamoja na nahau בְּעֵינֵי kinaonyesha kwamba maneno hayo yalionwa kuwa mema, yenye kupendeza, au yenye kukubalika. Usemi huu wa Kiswahili ni wa kawaida na unadumisha maana ya tathmini iliyomo katika Kiebrania.
- source_word: דִבְרֵיהֶם
  choice: maneno yao
  rationale: Hili ndilo linalolingana moja kwa moja na wingi wa דָּבָר wenye kiambishi cha nafsi ya tatu wingi. ‘Pendekezo lao’ lingekuwa finyu na la kufasiri zaidi.
- source_word: בְּעֵינֵי
  choice: kwa
  rationale: Nahau ya Kiebrania ina maana halisi ya ‘machoni pa’ lakini hapa huonyesha maoni au ukubali. Baada ya ‘yalionekana kuwa mazuri,’ ‘kwa’ hutoa Kiswahili cha asili bila kupoteza maana hiyo.
- source_word: חֲמוֹר
  choice: Hamori
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: בֶּן חֲמוֹר
  choice: mwana wa Hamori
  rationale: Huhifadhi uhusiano wa kifamilia na mpangilio wa kawaida wa usemi wa Kiebrania kwa Kiswahili chenye hadhi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. Tafsiri inadumisha ‘maneno yao’ badala ya kufasiri kwa ufinyu kuwa ‘pendekezo lao,’ na tanbihi inaonyesha maana mbadala ya kupendeza au kukubalika.
