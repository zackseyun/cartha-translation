lexical_decisions:
- source_word: וַיְדַבֵּר ... אִתָּם
  choice: akazungumza nao
  rationale: ‘Kuzungumza nao’ huakisi maana ya Hamori kuwaelekea katika mazungumzo, huku kishazi kinachofuata ‘akisema’ kikihifadhi muundo wa simulizi wa Kiebrania.
- source_word: שְׁכֶם בְּנִי
  choice: Mwanangu Shekemu
  rationale: Mpangilio huu ni wa kawaida na wenye hadhi katika Kiswahili, na unahifadhi uhusiano wa kiambatisho kati ya ‘mwanangu’ na jina Shekemu.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: amempenda sana
  rationale: Nahau hiyo kwa maana halisi huhusisha nafsi yake kushikamana au kumtamani; ‘amempenda sana’ huwasilisha mvuto mkubwa wa kihisia kwa Kiswahili cha kawaida bila kuamua ikiwa ni upendo au tamaa pekee.
- source_word: בְּבִתְּכֶם
  choice: binti yenu
  rationale: Nomino ni umoja na inamrejelea Dina, ingawa kiambishi cha ‘yenu’ kinawaelekea watu wengi wa familia.
- source_word: תְּנוּ נָא
  choice: Tafadhali mpeni
  rationale: Amri pamoja na נָא ni ombi la adabu; ‘tafadhali’ huhifadhi nguvu hiyo ya kusihi.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kumpa mwanamke katika ndoa, na inaweka wazi kuwa anapaswa kuwa mke wa Shekemu.
