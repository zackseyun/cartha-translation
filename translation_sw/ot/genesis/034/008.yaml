  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: sw
  text: Hamori akazungumza nao, akisema, “Mwanangu Shekemu anamtamani sana binti yenu.[a] Tafadhali mpeni awe mke wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yake imeshikamana sana na binti yenu”; au, “ana hamu kubwa ya binti yenu.”
