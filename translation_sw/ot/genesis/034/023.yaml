id: GEN.34.23
reference: Genesis 34:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: sw
  text: Je, mifugo yao, mali yao, na wanyama wao wote hawatakuwa wetu? Tukubaliane nao tu, nao wataishi pamoja nasi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: mifugo yao
  rationale: Neno hili kwa kawaida humaanisha wanyama wanaofugwa kama mali; “mifugo” ni pana, ya kawaida, na inafaa katika muktadha wa kiuchumi.
- source_word: קִנְיָנָם
  choice: mali yao
  rationale: Linamaanisha mali au vitu vilivyopatikana na kumilikiwa; “mali” huhifadhi maana pana ya kiuchumi bila kuibana kwa aina moja ya vitu.
- source_word: וְכָל בְּהֶמְתָּם
  choice: na wanyama wao wote
  rationale: בְּהֵמָה ni neno pana kwa wanyama, hasa wa kufugwa. “Wanyama” huepuka kurudia “mifugo” huku “wote” ikihifadhi ukamilifu wa כָל.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: Je, ... hawatakuwa wetu?
  rationale: הֲלוֹא huanzisha swali la balagha linalotarajia jibu la kukubali; muundo huu wa Kiswahili unahifadhi nguvu ya ushawishi na mwelekeo wa wakati ujao katika muktadha.
- source_word: אַךְ
  choice: tu
  rationale: 'Hapa אַךְ huweka sharti au kikomo: wanachotakiwa kufanya ni kukubaliana nao. Kuweka “tu” baada ya kitenzi ni Kiswahili cha asili.'
- source_word: נֵאֹותָה לָהֶם
  choice: tukubaliane nao
  rationale: Umbo hili lina maana ya kukubali, kuwa tayari, au kuridhia. “Tukubaliane nao” huwasilisha mwito wa pamoja kwa lugha ya kawaida na kuhifadhi uhusiano unaoonyeshwa na לָהֶם.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: nao wataishi pamoja nasi
  rationale: יָשַׁב inaweza kumaanisha kuishi, kukaa, au kufanya makao. “Wataishi pamoja nasi” ni ya asili na huonyesha wazi kuishi kwa jamii moja kunakopendekezwa hapa.
theological_decisions: []
