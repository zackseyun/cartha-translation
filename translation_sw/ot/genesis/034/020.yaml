translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisimulizi wenye ‘waka-’ umetumiwa kuonyesha mfululizo wa matendo. Alama ya koloni baada ya ‘wakisema’ inaonyesha kwamba maneno yenyewe yanafuata katika mstari unaofuata.
