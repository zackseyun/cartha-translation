  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: Hamori na mwanawe Shekemu wanaelekea langoni mwa mji wao na kuzungumza na wanaume wa mji wao, ikitanguliza maneno yatakayofuata. “Wakaenda” ni chaguo linalokubalika kwa וַיָּבֹא katika mtazamo huu wa kisimulizi, ingawa “wakaja” pia lingewezekana.'
  naturalness: Kiswahili ni sanifu, cha kisasa, na mtiririko wa “waka-” unafaa simulizi. “Kwenye lango la mji wao” na “wakazungumza na” ni matumizi ya kawaida na yanaeleweka.
