  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: sw
  text: 'Basi Hamori na mwanawe Shekemu wakaenda kwenye lango la mji wao, wakazungumza na wanaume wa mji wao[a], wakisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wanaume wa mji waliokuwa wamekusanyika langoni kwa mashauri ya umma.
