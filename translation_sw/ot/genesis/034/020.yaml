lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakaenda
  rationale: Kitenzi בוא katika mfululizo wa kisimulizi kinaweza kumaanisha ‘kuja’ au ‘kwenda’ kulingana na mtazamo. Kwa kuwa msimulizi hawaonyeshi wakija kwake, ‘wakaenda’ ni ya kawaida zaidi katika Kiswahili.
- source_word: חֲמוֹר
  choice: Hamori
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: na mwanawe Shekemu
  rationale: Huhifadhi wazi uhusiano wa kifamilia huku ikitumia mpangilio wa maneno ulio wa kawaida katika Kiswahili.
- source_word: אֶל שַׁעַר עִירָם
  choice: kwenye lango la mji wao
  rationale: Huhifadhi maana halisi ya ‘lango la mji wao’; katika mazingira haya lango pia lilikuwa mahali pa shughuli na mashauri ya umma.
- source_word: וַיְדַבְּרוּ
  choice: wakazungumza na
  rationale: דבר pamoja na אֶל humaanisha kusema au kuzungumza na mtu; ‘wakazungumza na’ inafaa hotuba ya hadhara bila kuongeza rasmi isiyosemwa wazi.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: wanaume wa mji wao
  rationale: אַנְשֵׁי ni ‘wanaume wa’; muktadha wa mashauri langoni unaunga mkono kurejelea wanaume wa mji waliokusanyika kufanya uamuzi.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida wa maneno yanayofuata; ‘wakisema’ huendeleza kwa asili sentensi inayovuka mpaka wa mstari.
