base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: sw
  text: Wana wa Yakobo wakawajibu Shekemu na Hamori, baba yake, kwa hila[a], wakasema kwa sababu Shekemu alikuwa amemtia unajisi[b] Dina, dada yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa udanganyifu.” Kiebrania kinatumia nomino yenye maana ya “kwa hila/udanganyifu” kama kielezi.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa amemnajisi”; katika muktadha huu pia inaweza kueleweka kuwa “alikuwa amemdhulumu kingono.” Kiebrania kinasema kihalisi kwamba alikuwa “amemtia unajisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: wakawajibu
  rationale: Kitenzi ענה hapa kinaanzisha jibu kwa pendekezo lililotangulia; umbo lenye kiambishi cha watendwa wengi linawahusu Shekemu na Hamori.
- source_word: בְנֵי יַעֲקֹב
  choice: Wana wa Yakobo
  rationale: Hili ni tamko la kawaida na lenye hadhi kwa muundo wa Kiebrania 'wana wa Yakobo'.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: Shekemu na Hamori baba yake
  rationale: Linadumisha mpangilio wa Kiebrania na kuonyesha kuwa 'baba yake' anamfafanua Hamori kama baba ya Shekemu.
- source_word: בְּמִרְמָה
  choice: kwa hila
  rationale: Nomino מִרְמָה yenye kihusishi ina nguvu ya kielezi; 'kwa hila' ni Kiswahili cha kawaida kinachohifadhi wazo la udanganyifu.
- source_word: וַיְדַבֵּרוּ
  choice: wakasema hivyo
  rationale: דבר hapa inaendeleza kitendo cha kujibu. 'Wakasema hivyo' huepuka urudiaji usio wa kawaida wa 'wakajibu ... wakanena' huku ikihifadhi kitenzi tofauti.
- source_word: אֲשֶׁר
  choice: kwa sababu
  rationale: Katika muktadha huu chembe hiyo inaeleza sababu ya jibu lao la hila.
- source_word: טִמֵּא
  choice: alikuwa amemtia unajisi
  rationale: Huhifadhi uwanja wa maana wa טמא, yaani kufanya najisi au kunajisi, pamoja na uzito wake wa kimaadili katika muktadha huu.
- source_word: אֲחֹתָם
  choice: dada yao
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa kifamilia.
theological_decisions:
- issue: Maana ya טִמֵּא katika simulizi la ukatili wa kingono
  choice: alikuwa amemtia unajisi
  alternative: alikuwa amemnajisi / alikuwa amemdhulumu kingono
  rationale: Chaguo hili linahifadhi lugha ya chanzo kuhusu unajisi bila kuipunguza kuwa fedheha tu wala kubadilisha neno la Kiebrania kuwa ufafanuzi mpana zaidi. Tanbihi inaonyesha mbadala unaoweka wazi zaidi ukiukaji huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Wana wa Yakobo' lina ladha ya simulizi la kibiblia lakini linaeleweka kwa urahisi. Jina Shekemu limerudiwa katika kishazi cha sababu ili kuondoa utata wa kiwakilishi cha nafsi ya kiume ambacho Kiswahili hakionyeshi moja kwa moja.
