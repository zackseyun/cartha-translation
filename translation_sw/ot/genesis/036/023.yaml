  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Shobali: Alvani[a], Manahathi, Ebali, Shefo[b], na Onamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kina Alvani; nasaba sambamba katika 1 Mambo ya Nyakati 1:40 ina Aliani.
