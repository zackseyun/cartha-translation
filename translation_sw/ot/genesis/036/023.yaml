lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Hawa ndio
  rationale: Muundo huu unatambulisha orodha inayofuata kwa Kiswahili cha kawaida; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa “na” katika fomula hii ya nasaba.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika muktadha huu neno hilo linataja watoto wa kiume wa Shobali moja kwa moja, hivyo “wana wa” ni sahihi kuliko “watoto” au “wazao.”
- source_word: שׁוֹבָל
  choice: Shobali
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: עַלְוָן
  choice: Alvani
  rationale: Jina limetoholewa kutoka umbo la Kiebrania katika WLC; tofauti ya umbo katika 1 Mambo ya Nyakati 1:40 imehifadhiwa katika tanbihi.
- source_word: וּ/מָנַחַת
  choice: Manahathi
  rationale: Jina la mtu limetoholewa kutoka Kiebrania; viunganishi vya orodha vimewakilishwa kwa uakifishaji wa kawaida wa Kiswahili.
- source_word: וְ/עֵיבָל
  choice: Ebali
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka umbo la Kiebrania.
- source_word: שְׁפוֹ
  choice: Shefo
  rationale: Jina limetoholewa kutoka umbo la Kiebrania la aya hii; umbo tofauti katika nasaba sambamba limeonyeshwa katika tanbihi.
- source_word: וְ/אוֹנָם
  choice: na Onamu
  rationale: Jina limetoholewa kutoka Kiebrania, na kiunganishi kimehifadhiwa kabla ya jina la mwisho kwa mtindo wa kawaida wa orodha ya Kiswahili.
