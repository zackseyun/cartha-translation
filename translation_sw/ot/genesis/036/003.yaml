- source_word: אֲחוֹת
  choice: dada ya
  rationale: Neno hili linamtambulisha Basemathi waziwazi kuwa ndugu wa kike wa Nebayothi, bila kuondoa taarifa ya jinsia iliyomo katika Kiebrania.
- source_word: נְבָיוֹת
  choice: Nebayothi
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka umbo la Kiebrania kwa tahajia inayofaa Kiswahili.
