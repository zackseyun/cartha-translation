  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: sw
  text: Kwa maana mali zao zilikuwa nyingi mno hata wasiweze kukaa pamoja, na nchi ya ukaaji wao wa muda haikuweza kuwategemeza[a] kwa sababu ya mifugo yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, haikuweza kuwatosheleza; kwa neno halisi, “kuwabeba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya Esau kujitenga na Yakobo katika muktadha uliotangulia.
- source_word: רְכוּשָׁם
  choice: mali zao
  rationale: Neno hili linahusu mali au vitu vilivyomilikiwa, likijumuisha zaidi ya mifugo peke yake.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: zilikuwa nyingi mno hata wasiweze kukaa pamoja
  rationale: Muundo wa Kiebrania unaonyesha wingi uliopita kiwango kilichowaruhusu kuishi mahali pamoja; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: nchi ya ukaaji wao wa muda
  rationale: Inahifadhi wazo la kuishi ugenini kwa muda bila kutumia tamko lisilo la kawaida kwa wasomaji wengi.
- source_word: לָשֵׂאת אֹתָם
  choice: haikuweza kuwastahimili
  rationale: Kitenzi נשׂא kimsingi ni kubeba; kwa nchi kama mtendaji, 'kuwastahimili' huhifadhi sitiari huku kikieleza kutokuwa na uwezo wa kuwategemeza.
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: kwa sababu ya mifugo yao
  rationale: מִפְּנֵי inaonyesha sababu hapa, na מִקְנֶה ni neno pana kwa wanyama wanaofugwa.
