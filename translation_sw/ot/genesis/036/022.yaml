  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: sw
  text: Wana wa Lotani walikuwa Hori na Hemamu,[a] na dada yake Lotani alikuwa Timna.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Hemamu”; orodha inayolingana katika 1 Mambo ya Nyakati 1:39 ina “Homamu.”'
    reason: textual_variant
  - marker: b
    text: Jina la Kiebrania hapa ni “Timna”; katika baadhi ya tahajia za Kiingereza huandikwa “Timnah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika orodha hii ya ukoo, kitenzi היה kinaunganisha Lotani na wanawe kwa maana ya kawaida ya ‘walikuwa,’ si ‘wakawa.’
- source_word: בְנֵי
  choice: wana wa
  rationale: Katika muktadha huu wa ukoo, neno hili linataja wana wa kiume; ‘wana wa’ ni usemi wa kawaida na wa heshima katika Kiswahili.
- source_word: לוֹטָן
  choice: Lotani
  rationale: Jina limetoholewa kwa muundo unaotamkika kwa urahisi katika Kiswahili huku likihifadhi umbo la Kiebrania.
- source_word: חֹרִי
  choice: Hori
  rationale: Ni jina la mtu, kwa hiyo limetoholewa badala ya kutafsiriwa.
- source_word: הֵימָם
  choice: Hemamu
  rationale: Usomaji wa maandishi ya Kiebrania katika mstari huu unaunga mkono Hemamu; irabu ya mwisho imeongezwa kulingana na matamshi ya kawaida ya Kiswahili.
- source_word: וַאֲחוֹת
  choice: na dada yake ... alikuwa
  rationale: אחות maana yake ni ‘dada.’ Kitenzi ‘alikuwa’ kimewekwa wazi katika Kiswahili ili sentensi ya ukoo iwe ya asili na yenye kueleweka.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Ni jina la mtu na umbo hili linaakisi matamshi ya Kiebrania ya hapa bila kuongeza konsonanti ya mwisho.
