lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Haya ndiyo majina ya
  rationale: Muundo huu wa Kiswahili unawasilisha orodha kwa njia ya asili huku ukihifadhi nguvu ya utambulisho ya Kiebrania.
- source_word: בְּנֵי עֵשָׂו
  choice: wana wa Esau
  rationale: בְּנֵי hapa humaanisha wana wa kiume; “wana” ni sahihi na ya kawaida katika mtindo wa nasaba.
- source_word: אֱלִיפַז
  choice: Elifazi
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: בֶּן עָדָה
  choice: mwana wa Ada
  rationale: בֶּן huonyesha uhusiano wa moja kwa moja wa mwana na mzazi; Kiswahili hakihitaji kibainishi kama Kiingereza.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mke wa Esau
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa umilikaji; kirai kimerudiwa mara zote mbili kama katika Kiebrania.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Jina limetoholewa kutoka umbo la Kiebrania kwa namna inayosomeka kwa Kiswahili.
- source_word: בֶּן בָּשְׂמַת
  choice: mwana wa Basemathi
  rationale: Muundo huo umetafsiriwa kwa uthabiti sawa na “mwana wa Ada.”
- source_word: בָּשְׂמַת
  choice: Basemathi
  rationale: Jina limetoholewa kwa umbo linalofaa fonolojia na tahajia ya kawaida ya Kiswahili.
