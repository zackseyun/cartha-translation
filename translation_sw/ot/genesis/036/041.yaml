  yaml_path: translation/ot/genesis/036/041.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: sw
  text: Mkuu Oholibama[a], mkuu Ela, mkuu Pinoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuu wa ukoo” kwa neno אַלּוּף.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika orodha ya viongozi wa Edomu katika Mwanzo 36, neno hili humaanisha kiongozi wa ukoo au kundi la kikabila. “Mkuu” ni fupi, ya kawaida, na huhifadhi mtindo wa orodha unaorudia cheo.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili inayoakisi konsonanti za Kiebrania bila kuongeza maana ya ufafanuzi.
- source_word: אֵלָה
  choice: Ela
  rationale: Hapa neno hili ni jina la mtu katika orodha, si nomino ya kawaida; limetoholewa moja kwa moja kwa tahajia ya Kiswahili.
- source_word: פִּינֹן
  choice: Pinoni
  rationale: Jina limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili huku likibaki karibu na matamshi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni fupi na yenye hadhi, ikihifadhi urudiaji wa orodha ya Kiebrania. Alama ya tanbihi imewekwa baada ya jina la kwanza ili kueleza cheo kinachorudiwa katika mstari wote.
