  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: sw
  text: 'Na hawa ni wana wa Reueli: Nahathi, Zera, Shama na Miza. Hawa walikuwa wana wa Basemathi[a], mke wa Esau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana pana ya nasaba, “wana” hapa yaweza kujumuisha wazao; Reueli alikuwa mwana wa Basemathi (Mwa. 36:10).
    reason: Huhifadhi neno la msingi la Kiebrania, “wana,” bila kuunda mkanganyiko wa nasaba katika Kiswahili au kulazimisha “wajukuu,” neno lisilotajwa katika mstari.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Na hawa
  rationale: Inahifadhi kiunganishi cha Kiebrania na kuendeleza orodha ya nasaba kwa Kiswahili cha kawaida.
- source_word: בְּנֵי רְעוּאֵל
  choice: wana wa Reueli
  rationale: Hapa majina yanayotajwa ni watoto wa kiume wa Reueli, kwa hiyo “wana” ni sahihi na wazi.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: נַחַת
  choice: Nahathi
  rationale: Jina limetoholewa kwa kufuata matamshi na desturi ya Kiswahili.
- source_word: זֶרַח
  choice: Zera
  rationale: Jina limetoholewa kwa umbo la Kiswahili linaloeleweka.
- source_word: שַׁמָּה
  choice: Shama
  rationale: Jina limetoholewa kwa umbo la Kiswahili linaloeleweka.
- source_word: מִזָּה
  choice: Miza
  rationale: Jina limetoholewa kwa umbo la Kiswahili linaloeleweka.
- source_word: אֵלֶּה הָיוּ
  choice: Hawa walikuwa
  rationale: Inawakilisha kwa kawaida muundo wa Kiebrania wa kutambulisha watu katika simulizi la wakati uliopita.
- source_word: בְּנֵי בָשְׂמַת
  choice: wazao wa Basemathi
  rationale: Neno בְּנֵי linaweza kutaja wana au wazao kwa upana. Kwa kuwa waliotajwa ni wana wa Reueli na, kulingana na muktadha, wajukuu wa Basemathi, “wazao” huhifadhi upana wa neno la Kiebrania bila kuleta mkanganyiko wa nasaba wala kuongeza kizazi kisichotajwa wazi katika mstari huu.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mke wa Esau
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa uhusiano unaoelezwa na muundo wa Kiebrania.
