  text: Nao wana wa Elifazi walikuwa Temani, Omari, Sefo[a], Gatamu na Kenazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri za Kiingereza huandika “Zepo” badala ya “Zepho.” Maandishi ya Kiebrania ya Kimasora hapa yanaweka irabu za jina hili kama Ṣəfô.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika orodha ya ukoo, kitenzi היה chenye waw hutumika kama kiunganishi cha kutaja watu; “walikuwa” ni Kiswahili cha kawaida na hakidokezi mabadiliko kama “wakawa.”
- source_word: בְּנֵי
  choice: wana wa
  rationale: Neno la Kiebrania ni wingi wa kiume katika muundo wa umilikaji. “Wana wa” huhifadhi maana ya ukoo wa kiume kwa lugha ya heshima na ya kibiblia inayoeleweka.
- source_word: אֱלִיפָז
  choice: Elifazi
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa Kiswahili.
- source_word: תֵּימָן
  choice: Temani
  rationale: Hapa ni jina la mtu katika orodha ya ukoo, hivyo limetoholewa badala ya kutafsiriwa kwa maana inayoweza kuhusishwa na mahali.
- source_word: אוֹמָר
  choice: Omari
  rationale: Jina limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: צְפוֹ
  choice: Sefo
  rationale: Uwekaji wa irabu wa Kimasora unaonyesha jina Ṣəfô; “Sefo” ni utohozi wa Kiswahili unaosomeka kwa urahisi na unaolingana na umbo hilo.
- source_word: גַעְתָּם
  choice: Gatamu
  rationale: Jina limetoholewa kwa muundo unaotamkika kwa kawaida katika Kiswahili.
- source_word: קְנַז
  choice: Kenazi
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa Kiswahili; umbo kali zaidi la kifonetiki lingekuwa “Qenazi,” lakini si la kawaida kwa msomaji wa Kiswahili.
