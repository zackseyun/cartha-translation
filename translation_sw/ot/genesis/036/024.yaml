base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Sibeoni: Aya na Ana. Huyu ndiye Ana aliyepata yemimu[a] nyikani alipokuwa akichunga punda kwa ajili ya Sibeoni, baba yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno la Kiebrania yemim haijulikani kwa uhakika. Wengine wamelielewa kuwa “chemchemi za maji moto,” na katika baadhi ya tafsiri za kale na za baadaye kuwa “nyumbu.” Matini kuu imehifadhi neno hilo la Kiebrania kwa sababu ushahidi wa maana yake hautoshi kutoa uamuzi wa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: wana wa
  rationale: Katika nasaba hii neno hilo linamaanisha watoto wa kiume; “wana wa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: צִבְעוֹן
  choice: Sibeoni
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: אַיָּה
  choice: Aya
  rationale: Jina la mtu limetoholewa kwa Kiswahili kutoka umbo la Kiebrania.
- source_word: עֲנָה
  choice: Ana
  rationale: Jina la mtu limetoholewa kwa Kiswahili na kutumiwa kwa uthabiti katika mstari.
- source_word: הוּא עֲנָה
  choice: Huyu ndiye Ana
  rationale: Muundo huu unamtambulisha Ana huyu mahususi katika nasaba; tafsiri hii huonyesha wazi nguvu hiyo ya utambulisho.
- source_word: מָצָא
  choice: aliyepata
  rationale: Kitenzi kwa kawaida humaanisha kupata au kuona kitu kilichokuwa hakijulikani; “aliyepata” ni cha kawaida na hakiongezi maana isiyothibitishwa.
- source_word: הַיֵּמִם
  choice: yemimu
  rationale: Maana ya neno hili adimu la Kiebrania haijulikani kwa uhakika. Umbo lililotoholewa limehifadhiwa katika matini, huku maelezo ya chini yakitaja tafsiri kuu zinazowezekana.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: “Nyikani” huwasilisha eneo lisilokaliwa au la malisho ya porini bila kulifanya lazima kuwa jangwa kame.
- source_word: בִּרְעֹתוֹ
  choice: alipokuwa akichunga
  rationale: Muundo unaonyesha tendo lililoendelea wakati wa tukio kuu; “akichunga” ni wa kawaida kwa kutunza wanyama wanaokula malishoni.
- source_word: הַחֲמֹרִים
  choice: punda
  rationale: Hili ndilo neno la sasa na la kawaida la Kiswahili kwa wanyama wanaotajwa.
- source_word: לְצִבְעוֹן אָבִיו
  choice: wa Sibeoni baba yake
  rationale: Hueleza kwamba punda walikuwa wa baba yake, Sibeoni, kwa mpangilio wa asili wa Kiswahili.
