  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: sw
  text: Basi Esau akaishi katika nchi ya vilima ya Seiri[a]; Esau ndiye Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika milima ya Seiri” au “katika Mlima Seiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: Kitenzi ישׁב katika umbo la masimulizi hapa humaanisha kukaa au kuishi mahali. “Akaishi” ni Kiswahili cha kawaida na cha heshima, nacho hakiongezi kwa lazima wazo la kuanzisha makazi ambalo halijaelezwa wazi katika neno lenyewe.
- source_word: בְּהַר
  choice: katika nchi ya milima ya
  rationale: הַר inaweza kutaja mlima mmoja au eneo la milima. Kwa kuwa Seiri hapa ni eneo, “katika nchi ya milima ya” huwasilisha maana ya kijiografia kwa Kiswahili cha kawaida bila kuifanya iwe lazima kuwa kilele kimoja.
- source_word: שֵׂעִיר
  choice: Seiri
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: הוּא אֱדוֹם
  choice: Esau ndiye Edomu
  rationale: Kirai kisicho na kitenzi kinamtambulisha Esau kuwa Edomu. “Ndiye” hudumisha utambulisho huo moja kwa moja na kwa Kiswahili asilia.
theological_decisions:
- issue: Utambulisho wa Esau na Edomu
  choice: Esau ndiye Edomu
  alternative: yaani, Edomu
  rationale: Tafsiri ya moja kwa moja inadumisha uzito wa kauli ya utambulisho bila kuibadili kuwa maelezo ya ufafanuzi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi, wa sasa na wenye heshima. “Nchi ya milima” huonyesha eneo la milima, huku tanbihi ikihifadhi uwezekano wa kuelewa הַר kuwa milima kwa ujumla au Mlima Seiri.
