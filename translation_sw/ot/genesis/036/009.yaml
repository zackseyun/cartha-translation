base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: sw
  text: Na hivi ndivyo vizazi vya Esau, baba wa Edomu, katika nchi ya milima ya Seiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya Mlima Seiri” au “katika milima ya Seiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Na hivi ndivyo
  rationale: Inahifadhi kiunganishi cha simulizi וְ na kuwasilisha kwa Kiswahili cha kawaida fomula ya utangulizi אֵלֶּה.
- source_word: תֹּלְדוֹת
  choice: vizazi
  rationale: Neno hili ni fomula ya kimuundo inayojirudia katika Mwanzo. ‘Vizazi’ huhifadhi uhusiano wake na nasaba bila kulifanya kuwa ‘historia’ au ‘wazao’ pekee.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina la mtu limetolewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֲבִי
  choice: baba wa
  rationale: Ni tafsiri ya moja kwa moja ya hali ya uundaji, ikionyesha kwamba Esau ndiye progenita wa Edomu; ‘babu wa ukoo wa’ lingeongeza ufafanuzi usio wa lazima.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Jina hili linamtambulisha hapa mtu au taifa lililotokana na Esau, na limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: בְּ/הַר
  choice: katika nchi ya milima ya
  rationale: הַר katika usemi huu wa kijiografia inaweza kutaja eneo la milima, si lazima kilele kimoja. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi maana ya mahali.
- source_word: שֵׂעִיר
  choice: Seiri
  rationale: Jina la mahali limetolewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
