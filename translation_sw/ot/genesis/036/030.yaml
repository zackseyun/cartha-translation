  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: sw
  text: Mkuu Dishoni, mkuu Ezeri, mkuu Dishani—hawa ndio waliokuwa wakuu wa Wahori, kulingana na koo zao[a], katika nchi ya Seiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa wakuu wao.” Kiebrania kinaweza kumaanisha uainishaji kwa wakuu, au kwa koo/vigawanyo vinavyoongozwa nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika orodha hii neno hili humaanisha kiongozi wa kikabila au wa ukoo; “mkuu” ni la kawaida, lenye heshima, na huhifadhi urudiaji wa Kiebrania.
- source_word: דִּשֹׁן
  choice: Dishoni
  rationale: Jina limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili, huku likitofautishwa na Dishani.
- source_word: אֵצֶר
  choice: Ezeri
  rationale: Jina limetoholewa badala ya kutafsiriwa.
- source_word: דִּישָׁן
  choice: Dishani
  rationale: Jina limetoholewa kwa Kiswahili na kutofautishwa na Dishoni kama ilivyo katika Kiebrania.
- source_word: אֵלֶּה
  choice: hao ndio waliokuwa
  rationale: Kishazi cha Kiebrania hakina kitenzi; wakati uliopita unafaa kwa muhtasari huu wa nasaba.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: wakuu wa Wahori
  rationale: הַחֹרִי hapa hutaja jamii ya Wahori; umbo la wingi ni la asili katika Kiswahili.
- source_word: לְאַלֻּפֵיהֶם
  choice: kulingana na koo zao
  rationale: Kiambishi לְ kinaonyesha uainishaji, na אַלֻּפֵיהֶם inaweza kurejelea migawanyiko au koo zilizo chini ya wakuu. Tafsiri hii huepuka urudiaji usioeleweka wa “wakuu kulingana na wakuu wao” bila kufuta maana ya uainishaji.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: katika nchi ya Seiri
  rationale: Huhifadhi usemi rasmi wa kijiografia wa Kiebrania kwa Kiswahili cha kawaida.
