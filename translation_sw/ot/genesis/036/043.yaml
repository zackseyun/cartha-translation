base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: sw
  text: Mkuu Magdieli[a], mkuu Iramu. Hawa ndio wakuu wa Edomu kulingana na makazi yao katika nchi waliyomiliki[b]. Huyo ndiye Esau[c], baba wa Edomu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakuu wa koo.” Neno la Kiebrania linaweza kumaanisha viongozi wa makabila au koo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “katika nchi ya milki yao.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “Yeye ndiye Esau.”
    reason: translation_alternative
  - marker: d
    text: Yaani, Esau alikuwa babu wa asili wa Waedomu.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika muktadha wa Mwanzo 36, neno hili linataja viongozi wa makabila au koo za Edomu. “Mkuu” ni cheo cha kawaida, chenye heshima, na kinaepuka neno la kizamani au cheo cha mfumo maalumu wa kisiasa.
- source_word: מַגְדִּיאֵל
  choice: Magdieli
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: עִירָם
  choice: Iramu
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili.
- source_word: אֵלֶּה אַלּוּפֵי אֱדֹם
  choice: Hao ndio wakuu wa Edomu
  rationale: “Hao” hurejelea viongozi waliotajwa katika orodha, na “wakuu” hudumisha ulinganifu na cheo cha umoja kilichotangulia.
- source_word: לְמֹשְׁבֹתָם
  choice: kulingana na makazi yao
  rationale: Kiambishi לְ hapa kinaonyesha upangaji au uainishaji kwa makazi, si mwendo kuelekea mahali.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: katika nchi waliyomiliki
  rationale: אֲחֻזָּה humaanisha milki au eneo linaloshikiliwa. Kauli hii ni ya asili katika Kiswahili na inabaki karibu na maana ya umiliki wa ardhi.
- source_word: הוּא עֵשָׂו
  choice: Huyo ndiye Esau
  rationale: Kauli hii inadumisha utambulisho wenye mkazo wa Kiebrania huku “huyo” ikifanya kazi ya hitimisho linalorejelea maelezo yaliyotangulia.
- source_word: אֲבִי אֱדֹם
  choice: baba wa Edomu
  rationale: “Baba” huhifadhi nahau ya ukoo ya Kiebrania; hapa humaanisha babu wa asili au mwanzilishi wa watu wa Edomu, si lazima baba wa moja kwa moja.
theological_decisions:
- issue: Cheo cha Esau kama chanzo cha ukoo wa Edomu
  choice: baba wa Edomu
  alternative: babu wa watu wa Edomu
  rationale: Tafsiri iliyochaguliwa inahifadhi nahau ya Kiebrania na kutambulisha nafasi ya Esau katika ukoo bila kuongeza dai la kitheolojia lisilokuwamo katika matini.
- issue: Utambulisho katika הוּא עֵשָׂו
  choice: Huyo ndiye Esau
  alternative: Yeye ndiye Esau
  rationale: “Huyo” linaonyesha hitimisho la orodha, lakini tanbihi inadumisha uwezekano wa kulitafsiri kiwakilishi hicho kwa namna ya moja kwa moja zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa orodha ya ukoo ulio rasmi lakini unaoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa umbo linalotumika kwa urahisi katika Kiswahili; sentensi zimewekwa fupi ili kuhifadhi muundo wa orodha na hitimisho la matini ya Kiebrania.
