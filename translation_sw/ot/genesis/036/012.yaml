id: GEN.36.12
reference: Genesis 36:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: sw
  text: Timna alikuwa suria wa Elifazi, mwana wa Esau, naye akamzalia Elifazi Amaleki. Hawa ndio wazao wa Ada,[a] mke wa Esau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “wana wa Ada.” Neno la Kiebrania linaweza pia kumaanisha wazao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִמְנַע
  choice: Timna
  rationale: Jina la mtu limetoholewa kwa namna inayofaa katika Kiswahili; kiunganishi cha mwanzo kinawakilishwa kwa mtiririko wa kawaida wa sentensi.
- source_word: הָיְתָה
  choice: alikuwa
  rationale: Kitenzi hapa ni kishirikishi kinachoeleza hali au uhusiano wa Timna, si lazima mabadiliko ya hali.
- source_word: פִילֶגֶשׁ
  choice: suria
  rationale: Neno hili linaonyesha mwanamke katika uhusiano wa kindoa uliotambuliwa lakini wa hadhi ya chini kuliko mke mkuu; “suria” huhifadhi tofauti hiyo kwa ufupi.
- source_word: לֶאֱלִיפַז
  choice: wa Elifazi
  rationale: Baada ya “suria,” kihusishi cha Kiebrania kinaelezwa kwa uhusiano wa kawaida wa Kiswahili.
- source_word: בֶּן עֵשָׂו
  choice: mwana wa Esau
  rationale: Muundo huu wa nasaba umetafsiriwa moja kwa moja na kwa kawaida katika Kiswahili.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: naye akamzalia Elifazi Amaleki
  rationale: “Akamzalia” huwasilisha kitendo cha kuzaa pamoja na uhusiano wa baba unaoonyeshwa na kihusishi ל, kwa Kiswahili cha kawaida cha nasaba.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: Hawa ndio wazao wa Ada
  rationale: בֵּן katika orodha za nasaba inaweza kujumuisha vizazi vya baadaye. Muktadha unawahesabu wana wa Elifazi kama wazao wa Ada; “wazao” huepuka kudai kimakosa kwamba wote ni wanawe wa moja kwa moja, huku tanbihi ikihifadhi usemi halisi.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mke wa Esau
  rationale: Muundo wa Kiebrania wa umilikaji umetafsiriwa kwa namna ya kawaida na iliyo wazi katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa nasaba katika בְּנֵי עָדָה
  choice: wazao wa Ada
  alternative: wana wa Ada
  rationale: Mistari inayozunguka inaonyesha kwamba wanaotajwa ni wana wa Elifazi na hivyo ni wajukuu au wazao wa Ada. Kwa kuwa בֵּן linaweza kuwa na maana pana ya mzao, “wazao” huhifadhi usahihi wa nasaba bila kubana maana kuwa “wajukuu” pekee.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa simulizi la nasaba lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Elifazi, Amaleki, na Ada.'
