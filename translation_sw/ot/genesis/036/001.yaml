base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: sw
  text: Hivi ndivyo vizazi vya Esau (yaani Edomu)[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na hivi ndivyo vizazi vya Esau; yeye ndiye Edomu.”
    reason: Mbadala huu huhifadhi kiunganishi וְ na kutafsiri הוּא kwa kishazi huru na cha moja kwa moja zaidi.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hivi ndivyo
  rationale: Hutambulisha sehemu mpya kwa Kiswahili cha kawaida bila kuongeza wazo la wakati lisilokuwamo wazi katika Kiebrania. Kiunganishi וְ kinaweza pia kutafsiriwa ‘Na,’ kama ilivyoonyeshwa katika tanbihi.
- source_word: תֹּלְדֹת
  choice: vizazi vya
  rationale: Neno hili ni kichwa muhimu kinachojirudia katika Mwanzo. ‘Vizazi vya’ huhifadhi uhusiano huo wa kimuundo na pia upana wa maana, bila kulibana kuwa simulizi tu au orodha ya wazao pekee.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina la mtu limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: הוּא
  choice: yaani
  rationale: Katika muktadha huu kiwakilishi kinamtambulisha Esau kuwa Edomu. ‘Yaani’ ni njia ya kawaida ya Kiswahili ya kutoa utambulisho huo wa ufafanuzi, huku tafsiri halisi zaidi ‘yeye ndiye’ ikihifadhiwa katika tanbihi.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Jina maalumu limetoholewa kwa tahajia ya kawaida ya Kiswahili; hapa linamtambulisha Esau kwa jina Edomu.
theological_decisions:
- issue: Tafsiri ya neno la kichwa תֹּלְדֹת katika Mwanzo
  choice: vizazi vya
  alternative: habari za; wazao wa
  rationale: Huu hasa ni uamuzi wa kimuundo na kifasihi. ‘Vizazi vya’ huhifadhi fomula inayojirudia katika Mwanzo na haipunguzi maana kuwa simulizi pekee au wazao wa kibayolojia pekee.
- issue: Uhusiano wa Esau na Edomu katika הוּא אֱדוֹם
  choice: yaani, Edomu
  alternative: yeye ndiye Edomu
  rationale: Tafsiri kuu inaonyesha utambulisho wa ufafanuzi kwa Kiswahili cha asili. Tanbihi huhifadhi uwezekano wa kusoma kishazi hicho kwa namna ya moja kwa moja zaidi, bila kufuta mvutano mdogo wa kisintaksia wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Hivi ndivyo vizazi vya’ umetumiwa ili kudumisha fomula ya kifasihi ya Mwanzo; ‘yaani’ hufanya utambulisho wa Esau na Edomu usomeke kwa kawaida.
