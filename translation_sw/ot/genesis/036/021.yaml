  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: sw
  text: na Dishoni, na Eseri, na Dishani. Hao ndio machifu[a] wa Wahori, wana wa Seiri, katika nchi ya Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viongozi wa koo”; neno la Kiebrania linamaanisha wakuu wa makundi ya kijamii na kisiasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִשׁוֹן
  choice: Dishoni
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: אֵצֶר
  choice: Ezeri
  rationale: Jina la mtu limetoholewa kwa namna inayoeleweka katika Kiswahili.
- source_word: דִישָׁן
  choice: Dishani
  rationale: Jina la mtu limetoholewa na kutofautishwa na Dishoni kama ilivyo katika maandishi ya Kiebrania.
- source_word: אֵלֶּה
  choice: Hao ndio
  rationale: Kiashiria cha wingi kinawatambulisha watu waliotajwa; 'Hao ndio' ni usemi wa kawaida wa Kiswahili katika fomula hii.
- source_word: אַלּוּפֵי
  choice: machifu
  rationale: Neno hili hapa linamaanisha viongozi wakuu wa makundi ya ukoo au makabila; 'machifu' huhifadhi maana ya uongozi wa kijamii na kisiasa.
- source_word: הַחֹרִי
  choice: Wahori
  rationale: Ingawa umbo la Kiebrania ni la umoja wa kijumla, hapa linataja jamii kwa pamoja; Kiswahili hutumia jina la watu katika wingi.
- source_word: בְּנֵי שֵׂעִיר
  choice: wana wa Seiri
  rationale: Huhifadhi usemi rasmi wa nasaba na uwezekano wake wa kumaanisha wana au wazao bila kuubadili kimya kimya kuwa 'wazao'.
- source_word: בְּאֶרֶץ אֱדֹום
  choice: katika nchi ya Edomu
  rationale: Huhifadhi neno 'nchi' lililo wazi katika Kiebrania na kutaja eneo kwa ukamilifu.
