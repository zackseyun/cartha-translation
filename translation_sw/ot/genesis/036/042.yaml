lexical_decisions:
- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika orodha ya viongozi wa Edomu katika Mwanzo 36, neno hili humaanisha kiongozi wa ukoo au kundi la kikabila. “Mkuu” ni la kawaida, lenye heshima, na linafaa katika muundo huu wa orodha bila kuongeza waziwazi neno “ukoo” ambalo halimo katika kila tukio la Kiebrania.
- source_word: קְנַז
  choice: Kenazi
  rationale: Ni jina la mtu au ukoo; limetoholewa kwa namna iliyozoeleka katika Kiswahili bila kutafsiri maana yake.
- source_word: תֵּימָן
  choice: Temani
  rationale: Hapa ni jina katika orodha ya wakuu wa Edomu, si neno la kawaida lenye maana ya “kusini”; kwa hiyo limetoholewa kama jina.
- source_word: מִבְצָר
  choice: Mibsari
  rationale: Ni jina la mtu au ukoo na limetoholewa badala ya kutafsiriwa. Herufi צ inawakilishwa kwa “s” katika umbo la Kiswahili lililozoeleka, huku kiishio “-i” kikifanya jina lisomeke kwa urahisi katika Kiswahili.
