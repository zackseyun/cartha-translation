  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: sw
  text: Kisha Samla akafa, na Shauli kutoka Rehobothi kando ya Mto akatawala badala yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Rehobothi ya Mto”; huenda ikimaanisha Rehobothi iliyokuwa kando ya mto mashuhuri.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kisha ... akafa
  rationale: Muundo wa wayyiqtol unaendeleza mfuatano wa simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida bila kuongeza sababu.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Jina limetoholewa kwa namna inayokaribia umbo la Kiebrania na inayosomeka kwa urahisi katika Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Kitenzi מלך katika taarifa hii ya urithi wa kifalme kinamaanisha kutawala akiwa mfalme; “akatawala” ni cha asili na chenye hadhi katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa mfuatano wa watawala, usemi huu unaonyesha kwamba Shauli alichukua nafasi ya Samla.
- source_word: שָׁאוּל
  choice: Shauli
  rationale: “Shauli” ni umbo la jina linalotambulika katika mapokeo ya Biblia ya Kiswahili na linaakisi jina la Kiebrania שָׁאוּל.
- source_word: מֵרְחֹבוֹת
  choice: kutoka Rehobothi
  rationale: Kiambishi מִן kinaonyesha mahali alikotoka au alikohusishwa nako; Rehobothi limetazamwa kama jina la mahali.
- source_word: הַנָּהָר
  choice: kwenye Mto
  rationale: Kirai hiki kinaitambulisha Rehobothi kwa uhusiano wake na mto maalumu unaojulikana; herufi kubwa katika “Mto” inadumisha matumizi ya Kiebrania yenye kibainishi bila kubainisha mto ambao chanzo hakijautaja kwa jina.
