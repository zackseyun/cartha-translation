  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya 'kwa ... zao/yao' yamehifadhi muundo wa orodha ya Kiebrania, na cheo 'Chifu' kimerudiwa kwa kila jina.
