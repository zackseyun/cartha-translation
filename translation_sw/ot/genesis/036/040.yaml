base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: sw
  text: 'Na haya ndiyo majina ya machifu wa Esau, kwa koo zao, kwa maeneo yao, kwa majina yao: Chifu Timna[a], Chifu Alva[b], na Chifu Yethethi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Timna pia inaweza kuandikwa “Timnah.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hapa kina “Alva”; linganisha umbo linalohusiana “Alia” katika 1 Mambo ya Nyakati 1:51.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na haya ndiyo
  rationale: Huhifadhi kiunganishi cha simulizi ו pamoja na kazi ya demonstrativi ya kutambulisha orodha inayofuata.
- source_word: שְׁמוֹת אַלּוּפֵי עֵשָׂו
  choice: majina ya machifu wa Esau
  rationale: Muundo wa hali ya kutegemeana unaonyesha 'majina ya'; אַלּוּף hapa ni kiongozi wa kikoo au kikabila wa Edomu, hivyo 'machifu' ni neno la sasa na linalofaa kuliko cheo cha kifalme cha kigeni.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה katika muktadha huu wa nasaba na makabila humaanisha koo kuliko familia za nyumbani; ל ni ya uainishaji.
- source_word: לִמְקֹמֹתָם
  choice: kwa maeneo yao
  rationale: מָקוֹם maana yake ya msingi ni mahali; 'maeneo yao' ni Kiswahili cha kawaida kinachodokeza mgawanyo wa kieneo bila kufasiri kupita kiasi kuwa makazi.
- source_word: בִּשְׁמֹתָם
  choice: kwa majina yao
  rationale: Huhifadhi namna ya Kiebrania ya kuainisha au kuorodhesha viongozi hao kwa majina.
- source_word: אַלּוּף
  choice: Chifu
  rationale: Cheo kimerudiwa kabla ya kila jina kama katika Kiebrania; 'Chifu' ni wazi kwa msomaji wa Afrika Mashariki na hakileti dhana ya cheo cha Ulaya.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Uhawilishaji wa moja kwa moja wa umbo la Kimasora; alama ya tanbihi inaonyesha umbo jingine linalotumiwa.
- source_word: עַלְוָה
  choice: Alva
  rationale: Huakisi עַלְוָה katika WLC kwa tahajia inayosomeka kwa Kiswahili; tanbihi inataja umbo linalohusiana katika 1 Mambo ya Nyakati 1:51.
- source_word: יְתֵת
  choice: Yethethi
  rationale: Uhawilishaji wa jina la Kiebrania unaofuata matamshi ya Kiswahili bila kulisawazisha na majina mengine yanayofanana.
theological_decisions: []
