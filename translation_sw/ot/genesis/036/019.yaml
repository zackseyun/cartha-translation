base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: sw
  text: Hawa ndio wana wa Esau, na hawa ndio wakuu wao.[a] Yeye ndiye Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viongozi wao wa koo.” Neno la Kiebrania אַלּוּפִים linamaanisha wakuu wa koo au makabila katika Edomu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida kishazi cha utambulisho kisicho na kitenzi katika Kiebrania na kuhifadhi maana ya kuonyesha watu waliotajwa.
- source_word: בְנֵי
  choice: wana wa
  rationale: Katika nasaba hii neno linamaanisha watoto wa kiume; “wana wa” ni sahihi na yenye hadhi kuliko neno pana “watoto wa.”
- source_word: עֵשָׂו
  choice: Esau
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וְאֵלֶּה
  choice: na hawa ndio
  rationale: Marudio haya yanahifadhi usambamba wa vifungu viwili vya Kiebrania kwa Kiswahili cha asili.
- source_word: אַלּוּפֵיהֶם
  choice: wakuu wao
  rationale: Katika Mwanzo 36 neno hili linataja viongozi au wakuu wa koo za Edomu; “wakuu” ni neno wazi, fupi, na lisilofungamanishwa na cheo maalumu cha kisasa.
- source_word: הוּא
  choice: Yeye ndiye
  rationale: Kiwakilishi hiki kinamrejelea Esau na kumtambulisha moja kwa moja kuwa Edomu.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina Edom, hapa likimtambulisha Esau kama babu mwenye jina la taifa hilo.
