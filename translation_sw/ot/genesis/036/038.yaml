  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: sw
  text: Shauli akafa, na Baal-Hanani mwana wa Akbori akatawala mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi cha kawaida cha simulizi kwa kifo; tafsiri ya moja kwa moja bila kutumia lugha ya kupunguza ukali.
- source_word: שָׁאוּל
  choice: Shauli
  rationale: Umbo la jina lililozoeleka katika Kiswahili cha Biblia na linalokaribia matamshi ya Kiebrania.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya urithi wa kifalme, neno hili linaonyesha kutawala kama mfalme; 'akatawala' ni la asili na fupi katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Huwasilisha kwa usahihi wazo la mrithi kuchukua nafasi ya mtawala aliyekufa.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanani
  rationale: Unukuzi uliorekebishwa kwa mfumo wa sauti wa Kiswahili huku ukihifadhi sehemu mbili za jina la Kiebrania.
- source_word: בֶּן
  choice: mwana wa
  rationale: Tafsiri ya kawaida ya uhusiano wa moja kwa moja wa mwana na baba.
- source_word: עַכְבּוֹר
  choice: Akbori
  rationale: Unukuzi unaokaribia umbo la Kiebrania na kuongeza irabu ya mwisho kwa matamshi ya kawaida ya Kiswahili.
