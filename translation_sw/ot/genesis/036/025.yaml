  text: 'And these were the sons of Anah: Dishon and Oholibamah daughter of Anah.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Ana: Dishoni na Oholibama, binti ya Ana.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: wana
  rationale: Neno la Kiebrania kwa kawaida humaanisha “wana.” Ingawa orodha hii inamtaja pia Oholibama kuwa binti, tafsiri inadumisha muundo wa maandishi ya chanzo badala ya kuubadili kuwa “watoto.”
- source_word: דִּשֹׁן
  choice: Dishoni
  rationale: Jina limeandikwa kwa namna inayofuata matamshi ya Kiebrania na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Jina limetoholewa kwa kufuata kwa karibu matamshi ya Kiebrania.
- source_word: בַּת
  choice: binti
  rationale: Hutafsiri kwa uwazi uhusiano wa kike uliotajwa moja kwa moja katika maandishi ya Kiebrania.
theological_decisions:
- issue: Kutolingana kwa kijinsia kati ya “wana” na kutajwa kwa Oholibama kama “binti”
  choice: Kuhifadhi “wana” katika kishazi cha utangulizi na “binti” katika utambulisho wa Oholibama
  alternative: “watoto wa Ana”
  rationale: Maandishi ya Kiebrania yana בְנֵי (“wana wa”) na baadaye בַּת (“binti”). Tafsiri inahifadhi mvutano huu wa kimaandishi bila kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa asili kwa orodha ya nasaba; hakuna alama za tanbihi zinazohitajika.
