lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika orodha hii ya wafalme, kitenzi מלך kinaonyesha kutawala kama mfalme. “Akatawala” ni Kiswahili cha kawaida na chenye hadhi, bila kuongeza neno lisilokuwamo wazi katika kifungu.
- source_word: בֶּאֱדוֹם
  choice: huko Edomu
  rationale: Kihusishi ב kimsingi kinaonyesha mahali. “Huko Edomu” huhifadhi maana ya mahali na kusomeka kwa kawaida; uwezekano wa kuelewa Edomu kama eneo lililotawaliwa umewekwa katika tanbihi.
- source_word: בֶּלַע
  choice: Bela
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: בֶּן בְּעוֹר
  choice: mwana wa Beori
  rationale: Huu ni muundo wa kawaida wa nasaba; “mwana wa” huhifadhi uhusiano uliotajwa moja kwa moja katika Kiebrania.
- source_word: וְשֵׁם
  choice: na jina la
  rationale: Huhifadhi kiunganishi na muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: עִירוֹ
  choice: mji wake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume katika Kiebrania kimewakilishwa wazi kwa “wake.”
- source_word: דִּנְהָבָה
  choice: Dinhaba
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa.
