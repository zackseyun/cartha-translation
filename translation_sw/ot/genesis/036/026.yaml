  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: sw
  text: 'Na hawa ndio wana wa Dishani: Hemdani, Eshbani, Ithrani, na Kerani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Na hawa ndio
  rationale: Kiunganishi na kiwakilishi vinaanzisha orodha ya ukoo. Kiswahili hutumia kwa kawaida “Na hawa ndio” katika utambulisho wa majina bila kulazimika kuongeza kitenzi cha wakati uliopita.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Hii ndiyo maana ya moja kwa moja ya umbo la Kiebrania, na hapa majina yanayotajwa ni ya watoto wa kiume wa Dishani.
- source_word: דִישָׁן
  choice: Dishani
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili, huku umbo la Kiebrania katika mstari huu likihifadhiwa.
- source_word: חֶמְדָּן
  choice: Hemdani
  rationale: Jina la mtu limetoholewa kutoka Kiebrania kwa mfumo unaosomeka kwa kawaida katika Kiswahili.
- source_word: וְ/אֶשְׁבָּן
  choice: Eshbani
  rationale: Jina limetoholewa moja kwa moja; kiunganishi cha Kiebrania kinawakilishwa na mpangilio wa orodha na “na” kabla ya jina la mwisho.
- source_word: וְ/יִתְרָן
  choice: Ithirani
  rationale: Utohozi huu unafuata matamshi ya Kiebrania kwa namna inayoeleweka katika Kiswahili bila kuingiza umbo la jadi la lugha nyingine.
- source_word: וּ/כְרָן
  choice: na Kerani
  rationale: Kiunganishi kimetafsiriwa wazi kabla ya jina la mwisho. “Kerani” linaonyesha konsonanti kaf ya Kiebrania kwa herufi k.
theological_decisions: []
translation_notes:
  register: Lugha ni ya sasa, yenye heshima, na ya kawaida kwa orodha ya ukoo. Majina yametoholewa kwa kuongeza vokali ya mwisho ili yasomeke kwa urahisi katika Kiswahili. Dokezo la Kiingereza kuhusu tofauti ya “Keran/Cheran” halikuhitajika, kwa kuwa tahajia ya Kiswahili “Kerani” inaakisi wazi kaf ya Kiebrania.
