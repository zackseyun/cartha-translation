base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: sw
  text: Baali-Hanani mwana wa Akbori akafa, naye Hadari[a] akatawala mahali pake. Jina la mji wake lilikuwa Pau[b], na jina la mke wake lilikuwa Mehetabeli, binti wa Matredi, binti wa Me-Zahabu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mapokeo ya maandishi na 1 Mambo ya Nyakati 1:50 yanasoma “Hadadi” badala ya “Hadari.”
    reason: textual_variant
  - marker: b
    text: Katika 1 Mambo ya Nyakati 1:50 jina hili linasomeka “Pai.”
    reason: textual_variant
  - marker: c
    text: 'Kiebrania hurudia kihalisi “binti wa”: “binti wa Matredi, binti wa Me-Zahabu.” Huenda sehemu ya mwisho ikaonyesha kuwa Matredi alikuwa binti wa Me-Zahabu, au ikatumia “binti” kwa maana pana ya ukoo.'
    reason: ambiguity
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות kinamaanisha kufa moja kwa moja; “akafa” ni Kiswahili cha kawaida na hakitumii lugha ya kuficha maana.
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: Baali-Hanani mwana wa Akbori
  rationale: Majina yametoholewa kwa matamshi yanayofaa Kiswahili, na muundo wa nasaba בן umetafsiriwa kwa “mwana wa”.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: Kauli hii inaonyesha kuwa Hadari alichukua nafasi ya mtangulizi wake akiwa mfalme; “akatawala mahali pake” ni ya asili na huhifadhi wazo la urithi wa utawala.
- source_word: הֲדַר
  choice: Hadari
  rationale: Maandishi ya Kimasora ya mstari huu yanasoma Hadar; umbo la Kiswahili ni Hadari. Tofauti ya Hadadi imewekwa katika tanbihi.
- source_word: וְשֵׁם עִירוֹ פָּעוּ
  choice: Jina la mji wake lilikuwa Pau
  rationale: Muundo wa Kiebrania umetolewa wazi na kwa Kiswahili cha kawaida; Pau hufuata usomaji wa WLC.
- source_word: וְשֵׁם אִשְׁתּוֹ
  choice: na jina la mke wake lilikuwa
  rationale: Tafsiri hii huhifadhi mtindo wa kurudia wa simulizi la Kiebrania huku ikiwa ya asili katika Kiswahili.
- source_word: מְהֵיטַבְאֵל בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: Mehetabeli, binti ya Matredi, binti ya Me-Zahabu
  rationale: Majina yametoholewa, na kurudiwa kwa בת kumehifadhiwa bila kulazimisha iwapo kifungu cha mwisho kinamtambulisha Matredi au kinaeleza ukoo wa Mehetabeli kwa upana.
