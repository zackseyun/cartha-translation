base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: sw
  text: 'Esau alijitwalia wake kutoka miongoni mwa binti za Kanaani: Ada, binti ya Eloni, Mhiti; na Oholibama, binti ya Ana, binti ya Sibeoni, Mhivi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Mhivi.” Baadhi ya wafasiri hupatanisha jambo hili na orodha nyingine za ukoo zinazohusiana na huelewa ukoo huo kwa namna tofauti, kutia ndani “Mhori.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: alioa
  rationale: Kitenzi hiki kwa msingi humaanisha ‘alichukua,’ lakini kinapotumiwa kuhusu wake katika muhtasari huu wa ukoo, Kiswahili cha asili na wazi hutumia ‘alioa.’
- source_word: נָשָׁיו
  choice: wake zake
  rationale: Katika muktadha huu, neno hilo linamaanisha wake wa Esau, na kiambishi cha umilikaji kimehifadhiwa.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: kutoka miongoni mwa binti za Kanaani
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania ‘binti za Kanaani,’ huku ‘miongoni mwa’ ikifanya maana yake iwe ya kawaida katika Kiswahili.
- source_word: בַּת
  choice: binti
  rationale: Hutaja uhusiano wa moja kwa moja wa ukoo na imetafsiriwa kwa namna ileile katika majina yote.
- source_word: הַחִתִּי
  choice: Mhiti
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mtu wa taifa la Wahiti.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Unukuzi huu wa jina unafuata kwa karibu umbo la Kiebrania na unatambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: הַחִוִּי
  choice: Mhivi
  rationale: Maandishi ya Kimasoreti hapa yanasoma ‘Mhivi’; tafsiri haibadilishi utambulisho huo kimya-kimya ili kuupatanisha na taarifa nyingine za ukoo.
theological_decisions:
- issue: Utambulisho wa kikabila katika kishazi cha mwisho
  choice: 'Kufuata Maandishi ya Kimasoreti: “Mhivi.”'
  alternative: Baadhi hufasiri ukoo huu kwa namna tofauti ili kuupatanisha na taarifa zinazohusiana, kutia ndani “Mhori” kwa kuzingatia Mwanzo 36:20.
  rationale: Ingawa si suala kuu la kimafundisho, kuna mvutano halisi wa kiuandishi na kiukoo. Maandishi ya Kiebrania yaliyopokewa yanafuatwa katika mstari mkuu, huku tafsiri nyingine ikitajwa katika tanbihi bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Alioa’ limetumiwa badala ya tafsiri ya neno kwa neno ‘alichukua’ kwa sababu ndilo tamko la kawaida la Kiswahili katika muktadha wa ndoa. Muundo ‘binti za Kanaani’ umehifadhiwa ili kudumisha nahau na mtindo wa kiukoo wa maandishi ya Kiebrania.
