  text: Yobabu akafa, naye Hushamu kutoka nchi ya Watemani[a] akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yamkini, “kutoka nchi ya Temani” au “kutoka nchi ya Mtemani.” Umbo la Kiebrania linaweza kurejelea eneo linalohusishwa na Temani au mtu wa Temani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi hiki katika mfuatano wa masimulizi kinaeleza tukio rahisi lililokamilika; “akafa” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יוֹבָב
  choice: Yobabu
  rationale: Jina la mtu limetoholewa kwa mfumo wa kawaida wa sauti na tahajia ya Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa hii ya urithi wa kifalme, kitenzi מלך humaanisha kutawala akiwa mfalme; “akatawala” ni kifupi, cha asili, na hakiongezi maelezo yasiyosemwa wazi.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Kirai hiki kinaonyesha kwamba Hushamu alimrithi Yobabu katika cheo au utawala.
- source_word: חֻשָׁם
  choice: Hushamu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: מֵאֶרֶץ
  choice: kutoka nchi ya
  rationale: Muundo מן pamoja na אֶרֶץ unaonyesha asili ya kijiografia; “kutoka nchi ya” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַתֵּימָנִי
  choice: Watemani
  rationale: Umbo la Kiebrania ni jina la uhusiano na Temani na linaweza kueleweka kwa kurejelea watu au eneo lao. “Nchi ya Watemani” ni usemi wa asili zaidi katika Kiswahili huku tanbihi ikihifadhi uwezekano mwingine.
