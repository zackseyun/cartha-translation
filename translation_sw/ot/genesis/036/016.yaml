  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: sw
  text: Mkuu Kora, mkuu Gatamu, mkuu Amaleki—hao ndio wakuu wa Elifazi katika nchi ya Edomu; hao ndio wana wa Ada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף (ʾallūf)
  choice: mkuu
  rationale: Katika orodha hii neno hilo humaanisha kiongozi wa ukoo au kikundi cha Edomu; “mkuu” ni la kawaida na lenye hadhi, bila kulazimisha cheo cha kisasa.
- source_word: גַּעְתָּם (Gaʿtām)
  choice: Gaatamu
  rationale: Jina limeandikwa kwa kufuata kwa karibu konsonanti na irabu za Kiebrania huku likirekebishwa kwa muundo wa matamshi ya Kiswahili.
- source_word: בְּנֵי (bənê)
  choice: wana
  rationale: Katika nasaba, “wana” huhifadhi usemi wa moja kwa moja wa Kiebrania na inaweza kurejelea wazao wa Ada katika muktadha huu.
theological_decisions:
- issue: Uhusiano wa “wana wa Ada” na orodha ya wakuu
  choice: hao ndio wana wa Ada
  alternative: hao ndio wazao wa Ada
  rationale: Tafsiri ya moja kwa moja huhifadhi namna pana ya matumizi ya neno la Kiebrania “wana,” bila kuondoa uwezekano wa maana ya kizazi au ukoo unaotokana na Ada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa nasaba ulio wazi, mfupi na wenye hadhi. Majina yamewasilishishwa kama Kora, Gaatamu, Amaleki, Elifazi, Edomu, na Ada.
