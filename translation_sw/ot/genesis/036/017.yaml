  text: וְ/אֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן עֵשָׂ֔ו אַלּ֥וּף נַ֨חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: sw
  text: 'Nao hawa ndio wana wa Reueli, mwana wa Esau: mkuu[a] Nahathi, mkuu Zera, mkuu Shama na mkuu Miza. Hawa ndio wakuu wa Reueli katika nchi ya Edomu. Hawa ndio wana wa Basemathi, mke wa Esau.


    [a] Au, “mkuu wa ukoo”; neno hili la Kiebrania humaanisha kiongozi wa kabila au ukoo wa Edomu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wa ukoo”; neno hili la Kiebrania humaanisha kiongozi wa kabila au ukoo wa Edomu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Nao hawa ndio
  rationale: Huhifadhi kiunganishi cha simulizi na mtindo wa kawaida wa kuanzisha orodha ya nasaba kwa Kiswahili cha asili.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Orodha inataja watoto wa kiume; “wana” ni tafsiri ya moja kwa moja, huku maana pana ya nasaba ikibaki kama ilivyo katika Kiebrania.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: Reueli, mwana wa Esau
  rationale: Huwasilisha utambulisho wa kinasaba kwa uwazi na kwa mpangilio wa karibu na Kiebrania.
- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika muktadha wa Edomu neno hili humtaja kiongozi wa kikabila au wa ukoo. “Mkuu” ni neno fupi, la sasa, na lisilo la kizamani; maana mahususi zaidi imeonyeshwa katika tanbihi.
- source_word: נַחַת
  choice: Nahathi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: זֶרַח
  choice: Zera
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na desturi ya Kiswahili.
- source_word: שַׁמָּה
  choice: Shama
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili bila kuonyesha marudio ya konsonanti yasiyo ya lazima katika tahajia ya Kiswahili.
- source_word: מִזָּה
  choice: Miza
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: Hawa ndio wakuu wa Reueli
  rationale: Huhifadhi muhtasari unaorudia orodha iliyotangulia bila kuongeza kwa lazima neno “ukoo” katika matini kuu.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: katika nchi ya Edomu
  rationale: Neno la Kiebrania linalomaanisha “nchi” limehifadhiwa wazi.
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: Basemathi, mke wa Esau
  rationale: Hutambulisha upande wa mama kwa Kiswahili cha kawaida huku ikihifadhi muundo wa maelezo ya Kiebrania.
theological_decisions:
- issue: Matumizi ya “wana” kwa wajukuu wa Basemathi
  choice: Hawa ndio wana wa Basemathi
  alternative: Hawa ndio wazao wa Basemathi
  rationale: Kiebrania kinatumia בְּנֵי, “wana wa,” katika maana ya kinasaba. Tafsiri imehifadhi usemi huo na mvutano wake wa kinasaba badala ya kuufafanua kimya kuwa “wazao.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Majina yametoholewa kwa mfumo unaosomeka kwa Kiswahili; sentensi fupi na marudio ya kinasaba ya Kiebrania yamehifadhiwa.
