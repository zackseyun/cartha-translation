lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Ni kauli ya kuwasilisha orodha ya nasaba; ‘Hawa ndio’ ni Kiswahili cha kawaida na huhifadhi msisitizo wa kiashiria cha Kiebrania.
- source_word: בְנֵי
  choice: wana wa
  rationale: Muktadha unataja wanaume kwa majina katika orodha ya nasaba, hivyo ‘wana wa’ huhifadhi maana ya msingi bila kuipanua kuwa ‘wazao.’
- source_word: שֵׂעִיר
  choice: Seiri
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: הַחֹרִי
  choice: Mhori
  rationale: Ni jina la kikabila linalomtambulisha Seiri; umoja ‘Mhori’ unalingana na Seiri.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: waliokuwa wenyeji wa nchi
  rationale: Kirai hiki kinawataja watu waliokaa kwa kudumu katika nchi; ‘wenyeji wa nchi’ ni Kiswahili cha asili, na ‘waliokuwa’ hufanya uhusiano wake na wana waliotajwa uwe wazi bila kubadili maana.
- source_word: לוֹטָן
  choice: Lotani
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: שׁוֹבָל
  choice: Shobali
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: צִבְעוֹן
  choice: Sibeoni
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: עֲנָה
  choice: Ana
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili.
