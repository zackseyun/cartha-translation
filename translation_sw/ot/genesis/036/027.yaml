lexical_decisions:
- source_word: אֵצֶר
  choice: Eseri
  rationale: Unukuzi wa jina la Kiebrania ‘Etser kwa muundo unaosomeka kwa kawaida katika Kiswahili.
- source_word: בִּלְהָן
  choice: Bilhani
