- source_word: זַעֲוָן
  choice: Zaawani
  rationale: Unukuzi unaowakilisha konsonanti na mpangilio wa vokali wa jina la Kiebrania Za‘awan kwa namna ya Kiswahili.
- source_word: עֲקָן
  choice: Akani
  rationale: Unukuzi wa jina ‘Aqan kwa tahajia ya Kiswahili, bila kujaribu kuwakilisha konsonanti ya koo isiyopo katika tahajia ya kawaida.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Tafsiri ya moja kwa moja na ya asili ya uhusiano wa ukoo unaoonyeshwa na neno la Kiebrania.
