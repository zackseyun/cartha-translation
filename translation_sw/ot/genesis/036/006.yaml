  source_fidelity: Maana ya orodha ya watu, mifugo, wanyama, na mali imehifadhiwa vizuri, na “kwa sababu ya Yakobo ndugu yake” huwakilisha ipasavyo maana ya kisababishi inayowezekana ya מִפְּנֵי katika muktadha. Hata hivyo, “nchi fulani” huashiria nchi mahususi isiyotajwa, ilhali Kiebrania kina usemi usio na kibainishi, “kwenda katika nchi.”
  naturalness: Kiswahili ni cha asili na cha heshima kwa ujumla. “Akachukua” ni bora kuliko “akawachukua,” kwa kuwa kitenzi kinatawala si watu pekee bali pia mifugo, wanyama, na mali.
  terminology: Majina Esau, Yakobo, na Kanaani yanafaa. “Wake zake,” “wanawe wa kiume,” “binti zake,” “mifugo,” na “mali” yanaendana na matumizi ya Kiswahili Sanifu na kudumisha utofauti wa msamiati wa Kiebrania.
