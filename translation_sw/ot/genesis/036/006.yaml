  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: sw
  text: Esau akachukua wake zake, wanawe wa kiume, binti zake, na watu wote wa nyumbani mwake, pamoja na mifugo yake, wanyama wake wote, na mali yake yote aliyokuwa amejipatia katika nchi ya Kanaani. Kisha akaenda katika nchi[a] kwa sababu ya Yakobo ndugu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwenda katika nchi.” Baadhi ya hati na tafsiri za kale zinaunga mkono “kwenda katika nchi ya Seiri”; tafsiri nyingi hutoa maana ya kimuktadha, “kwenda katika nchi nyingine.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: Kitenzi לקח humaanisha ‘kuchukua’; katika muktadha huu kinaonyesha kuwa Esau aliwachukua watu hawa pamoja naye alipohama.
- source_word: נָשָׁיו
  choice: wake zake
  rationale: Wingi wa אִשָּׁה hapa unawahusu wake wa Esau, si wanawake kwa ujumla.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: wanawe wa kiume, binti zake
  rationale: Kiebrania kinataja wana wa kiume na mabinti kando; tafsiri inadumisha utofautishaji huo.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: watu wote wa nyumbani mwake
  rationale: Katika nahau hii נֶפֶשׁ humaanisha watu wa jamaa au kaya, si ‘roho’ kwa maana ya kiteolojia.
- source_word: מִקְנֵהוּ
  choice: mifugo yake
  rationale: מִקְנֶה humaanisha mifugo au mali inayojumuisha wanyama; ‘mifugo’ ni neno la kawaida na wazi.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: wanyama wake wote
  rationale: בְּהֵמָה ni neno pana kwa wanyama; uchaguzi huu pia unadumisha tofauti yake na מִקְנֶה iliyotangulia.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: mali yake yote aliyokuwa amejipatia
  rationale: קִנְיָן ni mali iliyomilikiwa, na רכשׁ hukazia kuipata au kujipatia; muundo huu ni wa asili katika Kiswahili.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Inadumisha usemi kamili wa kijiografia wa Kiebrania.
- source_word: אֶל אֶרֶץ
  choice: katika nchi fulani
  rationale: Maandishi ya Kimasora yanasema kwa namna isiyobainisha ‘kwenda kwenye nchi’; ‘nchi fulani’ hudumisha hali hiyo bila kuongeza ‘nyingine’ au jina la nchi.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: kwa sababu ya Yakobo ndugu yake
  rationale: מִפְּנֵי inaweza kueleza sababu au kuondoka mbele ya mtu. Muktadha wa mstari unaofuata unaunga mkono maana ya kisababishi, huku tafsiri hii ikiwa ya kawaida kwa Kiswahili.
