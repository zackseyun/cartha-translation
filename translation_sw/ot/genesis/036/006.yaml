translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida lakini wenye heshima. ‘Wanawe wa kiume’ na ‘binti zake’ zinadumisha mgawanyo wa maandishi asilia; ‘watu wote wa nyumbani mwake’ huepuka tafsiri ngumu ya neno kwa neno ya נֶפֶשׁ.
