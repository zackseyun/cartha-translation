  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: akamzalia / akamzaa
  rationale: Vitenzi vyote vinatokana na ילד, ‘kuzaa.’ Kwa kishazi cha kwanza, ‘akamzalia Esau’ kinaonyesha kwa kawaida kwamba Esau ndiye baba; katika cha pili, ‘akamzaa Reueli’ ni Kiswahili cha asili na kifupi, kwa kuwa baba tayari anaeleweka katika muktadha.
- source_word: לְעֵשָׂו
  choice: Esau
  rationale: Kihusishi ל kinamtaja baba katika taarifa hii ya ukoo. Kiambishi cha mtendewa -m- katika ‘akamzalia’ kinawakilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֶת
  choice: '[hakijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa moja kwa moja katika Kiebrania; kazi yake inaonyeshwa na mpangilio na viambishi vya Kiswahili.
- source_word: אֱלִיפָז
  choice: Elifazi
  rationale: Jina limetoholewa kwa umbo linalotambulika na linalofaa mfumo wa sauti wa Kiswahili.
- source_word: בָשְׂמַת
  choice: Basemathi
  rationale: Jina limetoholewa kutoka umbo la Kiebrania kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Jina limetoholewa kwa kufuata kwa karibu konsonanti na vokali za maandishi ya Kimasoreti huku likifanywa lisomeke kwa Kiswahili.
- source_word: וּ
  choice: naye
  rationale: Kiunganishi kinaunganisha taarifa mbili za kuzaliwa; ‘naye’ huendeleza simulizi kwa ufasaha na kumtambulisha Basemathi kama kiima cha pili.
