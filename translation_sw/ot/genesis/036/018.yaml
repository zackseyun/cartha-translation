base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Oholibama, mke wa Esau: mkuu Yeushi, mkuu Yalamu, na mkuu Kora. Hawa ndio wakuu wa Oholibama, binti ya Ana, mke wa Esau.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Nomino ya Kiebrania ni wingi wa kiume na hapa inawataja watoto wa kiume kwa majina; “wana wa” ni sahihi na ya asili katika taarifa ya ukoo.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mke wa Esau
  rationale: Muundo huu wa umilikaji unatafsiriwa kwa Kiswahili cha kawaida kama “mke wa Esau” na umerudiwa vivyo hivyo mara zote mbili.
- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika Mwanzo 36 neno hili humaanisha kiongozi wa kundi au ukoo wa Edomu. “Mkuu” ni neno fupi, la sasa, na lenye hadhi; maelezo marefu zaidi hayajaingizwa katika matini.
- source_word: יְעוּשׁ
  choice: Yeushi
  rationale: Utohozi wa jina la Kiebrania unaofaa muundo wa sauti na tahajia ya Kiswahili.
- source_word: יַעְלָם
  choice: Yalamu
  rationale: Utohozi wa jina la Kiebrania unaosomeka kwa kawaida katika Kiswahili.
- source_word: קֹרַח
  choice: Kora
  rationale: Utohozi wa kawaida wa jina hili la Kiebrania katika Kiswahili.
- source_word: אֵלֶּה אַלּוּפֵי
  choice: Hawa ndio wakuu wa
  rationale: Huhifadhi muundo wa muhtasari wa Kiebrania bila kuongeza wazo lisilotajwa wazi la “waliotokana na.”
- source_word: בַּת עֲנָה
  choice: binti ya Ana
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa ukoo katika Kiswahili.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: Hawa ndio ... Hawa ndio
  rationale: Kurudiwa kwa kiashiria kunadumisha mpangilio rasmi wa taarifa ya ukoo. Kiunganishi cha mwanzo hakihitajiki katika Kiswahili ili kuendeleza maana kwa ufasaha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa taarifa ya ukoo na urudiaji wa Kiebrania umehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu. Hakuna alama ya tanbihi katika matini kwa sababu hakuna tanbihi iliyohitajika; maana ya ukoo inayowezekana ya אַלּוּף imeelezwa katika maamuzi ya kileksika badala ya kuweka alama kimakosa kwenye jina Oholibama.
