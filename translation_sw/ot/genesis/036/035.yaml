base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: sw
  text: Hushamu akafa, naye Hadadi mwana wa Bedadi akatawala mahali pake—aliyepiga Midiani[a] katika uwanda wa Moabu[b]; na jina la mji wake lilikuwa Avithi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeishinda Midiani.” Mshiriki wa Kiebrania humaanisha kihalisi, “yule aliyepiga Midiani.”
    reason: lexical_alternative
  - marker: b
    text: “Uwanda wa Moabu” pia unaweza kueleweka kwa maana pana kuwa “nchi ya Moabu” au “eneo la Moabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות kinamaanisha kufa moja kwa moja; “akafa” ni tafsiri ya kawaida na isiyo ya euphemism katika Kiswahili.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: מלך huonyesha kutawala kama mfalme, na תחתיו huonyesha urithi wa nafasi; usemi huu unaweka wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadadi mwana wa Bedadi
  rationale: Majina yametoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili, na בן limetafsiriwa “mwana wa.”
- source_word: הַמַּכֶּה
  choice: ndiye aliyeipiga
  rationale: Kauli ya Hiphil ya נכה humtambulisha Hadadi kwa tendo la kupiga. “Aliyeipiga” hudumisha upana wa maana ya Kiebrania bila kuamua kimya kimya kwamba lazima iwe “aliyeishinda.”
- source_word: אֶת מִדְיָן
  choice: Midiani
  rationale: Neno la asili ni jina maalumu Midiani; tafsiri haijalipanua kuwa “Wamidiani,” ingawa katika muktadha linaweza kuwakilisha watu au dola hiyo.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: katika uwanda wa Moabu
  rationale: שׂדה yaweza kumaanisha shamba, sehemu ya wazi, nchi, au eneo. “Uwanda” ni wa kiasili katika taarifa ya kijiografia na unabaki karibu na taswira ya neno la asili.
- source_word: וְשֵׁם עִירוֹ
  choice: na jina la mji wake lilikuwa
  rationale: Huu ni usemi wa kawaida wa Kiebrania wa kutaja jina la mji; tafsiri hii ni rasmi lakini ya asili katika Kiswahili.
- source_word: עֲוִית
  choice: Avithi
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili inayowakilisha konsonanti za jina la Kiebrania.
