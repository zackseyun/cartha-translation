  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: sw
  text: Hawa ndio wafalme waliotawala katika nchi ya Edomu kabla mfalme hajatawala juu ya wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kabla mfalme hajatawala juu ya Waisraeli.” Kiebrania kinasema kihalisi, “kabla mfalme hajatawala kwa/juu ya wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Hutambulisha orodha mpya kwa Kiswahili cha kawaida; kiunganishi וְ hakihitaji kutafsiriwa kwa “na” hapa.
- source_word: הַמְּלָכִים
  choice: wafalme
  rationale: Nomino hii ni wazi na ya kawaida; muundo “Hawa ndio wafalme” unaonyesha urejeleaji maalumu wa Kiebrania kwa njia ya asili katika Kiswahili.
- source_word: אֲשֶׁר מָלְכוּ
  choice: waliotawala
  rationale: Kitenzi מלך hapa kinamaanisha kutumia mamlaka ya kifalme; “kutawala” ni fasaha na cha kawaida katika Kiswahili.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: katika nchi ya Edomu
  rationale: Hudumisha nomino אֶרֶץ na maana yake ya eneo, badala ya kufupisha kuwa “Edomu.”
- source_word: לִפְנֵי
  choice: kabla
  rationale: Maana yake ya wakati iko wazi katika muktadha huu.
- source_word: מְלָךְ מֶלֶךְ
  choice: mfalme hajatawala
  rationale: Hudumisha umoja wa “mfalme” katika Kiebrania na kueleza kwa Kiswahili kwa kawaida kwamba tukio hilo halikuwa limetokea kufikia wakati unaotajwa.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: juu ya wana wa Israeli
  rationale: “Wana wa Israeli” hudumisha umbo halisi la msemo wa Kiebrania, na “juu ya” huonyesha uhusiano wa mamlaka unaodokezwa na kutawala.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Msemo wa Kiebrania ni halisi “wana wa Israeli.” Tafsiri hii hudumisha umbo la chanzo bila kuficha kwamba katika muktadha ni jina la watu wote.
- issue: Maana ya לְ pamoja na מָלַךְ
  choice: kutawala juu ya
  alternative: kutawala kwa ajili ya
  rationale: Muktadha wa ufalme unaunga mkono uhusiano wa mamlaka, lakini tanbihi inahifadhi upana wa kihusishi cha Kiebrania badala ya kuufanya uamuzi huo kuwa usio na mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Waliotawala” na “hajatawala” ni vya kawaida zaidi kuliko msamiati mzito wa kifalme, huku “wana wa Israeli” ikihifadhi umbo la chanzo.
