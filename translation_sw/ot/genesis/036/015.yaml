base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: sw
  text: 'Hawa ndio wakuu[a] wa wana wa Esau: wana wa Elifazi, mzaliwa wa kwanza wa Esau: mkuu Temani, mkuu Omari, mkuu Sefu na mkuu Kenazi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wa koo.” Neno la Kiebrania linamaanisha kiongozi wa ukoo au kabila katika orodha hizi za Waedomu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: wakuu / mkuu
  rationale: Katika orodha za ukoo za Waedomu, neno hili ni cheo cha kiongozi wa ukoo au kabila. “Mkuu” ni la kawaida na lenye hadhi katika Kiswahili cha sasa, bila kuligeuza jina la mtu kuwa jina la ukoo moja kwa moja.
- source_word: בְנֵי
  choice: wana wa
  rationale: Huhifadhi maana ya msingi ya uhusiano wa kizazi; katika muktadha mpana inaweza kujumuisha wazao, lakini hapa orodha inawataja wana wa Elifazi.
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Hutoa kwa usahihi nafasi ya kuzaliwa na maana inayoweza kuambatana na hadhi ya mzaliwa wa kwanza.
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Ni utangulizi wa kawaida na wa asili kwa orodha ya watu katika Kiswahili.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Tahajia inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: אֱלִיפַז
  choice: Elifazi
  rationale: Unukuzi wa jina unaolingana na kaida iliyozoeleka katika Biblia za Kiswahili.
- source_word: תֵּימָן
  choice: Temani
  rationale: Unukuzi wa jina la Kiebrania kwa muundo wa majina uliozoeleka katika Kiswahili.
- source_word: אוֹמָר
  choice: Omari
  rationale: Unukuzi wa jina kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: צְפוֹ
  choice: Sefo
  rationale: Unukuzi unaokaribia matamshi ya Kiebrania na unaofaa mfumo wa sauti wa Kiswahili.
- source_word: קְנַז
  choice: Kenazi
  rationale: Unukuzi wa jina kwa muundo uliozoeleka katika matumizi ya Biblia ya Kiswahili.
