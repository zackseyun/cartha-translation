base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: sw
  text: 'Na hawa walikuwa wana wa Oholibama, binti ya Ana, binti ya Sibeoni, mke wa Esau: alimzalia Esau Yeushi, Yalamu, na Kora.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: Na hawa ndio waliokuwa
  rationale: Kauli hii huhifadhi kiunganishi cha simulizi וְ, nguvu ya kuonyesha ya אֵלֶּה, na muundo wa wakati uliopita wa הָיוּ kwa Kiswahili cha kawaida.
- source_word: בְּנֵי
  choice: wana
  rationale: Majina yanayofuata ni ya wana wa kiume; 'wana' ni sahihi na yenye hadhi katika taarifa ya ukoo.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Jina limetoholewa kwa mfumo unaofaa matamshi ya Kiswahili.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: binti ya Ana, binti ya Sibeoni
  rationale: Kurudiwa kwa בַת kumehifadhiwa badala ya kufafanuliwa kuwa 'mjukuu,' hivyo muundo na uwezekano wa maana ya nasaba katika Kiebrania unabaki wazi.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mke wa Esau
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa uhusiano wa hali ya umilikaji katika Kiswahili.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: alimzalia Esau
  rationale: Kitenzi 'alimzalia' kinawasilisha kwa asili ילד pamoja na לְ, yaani kuzaa watoto kwa ajili ya au kwa mume, bila kuongeza maneno yasiyo katika chanzo.
- source_word: יעיש
  choice: Yeushi
  rationale: Jina limetoholewa kwa kuzingatia sauti ya mwanzo ya Kiebrania na muundo wa matamshi ya Kiswahili.
- source_word: יַעְלָם
  choice: Yalamu
  rationale: Jina limetoholewa kutoka Kiebrania kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina limetoholewa kwa namna ya kawaida na inayotamkika katika Kiswahili.
