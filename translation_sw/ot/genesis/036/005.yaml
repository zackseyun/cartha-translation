  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: sw
  text: Oholibama akawazaa Yeushi, Yaalamu na Kora. Hao ndio wana wa Esau waliozaliwa kwake katika nchi ya Kanaani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Jina la mtu limenukuliwa kwa tahajia inayosikika kwa kawaida katika Kiswahili, bila kulitafsiri maana yake.
- source_word: יָלְדָה
  choice: akawazaa
  rationale: Kitenzi hiki kinahifadhi Oholibama kama mhusika wa kike na kinafaa katika mtindo mfupi wa nasaba; kiambishi -wa- kinawarejelea wana watatu.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: '[viashiria vya yambwa vimeachwa]'
  rationale: Kiashiria cha yambwa dhahiri cha Kiebrania hakina neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: יעיש
  choice: Yeushi
  rationale: Jina limenukuliwa kwa kuzingatia matamshi ya Kiebrania na mfumo wa sauti wa Kiswahili.
- source_word: יַעְלָם
  choice: Yaalamu
  rationale: Jina limenukuliwa kwa namna inayohifadhi irabu ndefu ya mwanzo kwa tahajia rahisi ya Kiswahili.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina limenukuliwa kwa namna ya asili na iliyo rahisi kutamkwa katika Kiswahili.
- source_word: אֵלֶּה
  choice: Hao ndio
  rationale: Kauli hii ya kuonyesha inarejelea wana waliotajwa na kuingiza muhtasari wa nasaba kwa Kiswahili cha kawaida.
- source_word: בְּנֵי
  choice: wana
  rationale: Hapa neno linamaanisha watoto wa kiume waliotajwa kwa majina; 'wana' linaendeleza usahihi huo katika Kiswahili.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Tahajia hii ya jina imezoeleka katika Biblia za Kiswahili.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: waliozaliwa kwake
  rationale: Inahifadhi ujenzi wa kutendwa wa Kiebrania na uhusiano wao na Esau bila kuongeza wazi kwamba mama ndiye aliyemzalia.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Inahifadhi nomino ya wazi 'nchi' na mtindo wenye hadhi wa taarifa ya nasaba.
