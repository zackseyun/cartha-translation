  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kurudiwa kwa “mkuu” kunahifadhi muundo na mkazo wa Kiebrania; “na” kabla ya jina la mwisho huifanya orodha isomeke kwa kawaida bila kubadili maana.
