base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: sw
  text: 'Hawa ndio wakuu wa Wahori: mkuu Lotani[a], mkuu Shobali, mkuu Sibeoni, na mkuu Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viongozi wa koo” au “wakuu wa makabila”; neno la Kiebrania linaweza kumaanisha kiongozi wa ukoo au kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kiwakilishi cha wingi kinaanzisha orodha; Kiswahili cha kawaida hutumia “Hawa ndio” kwa watu wanaotajwa.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: wakuu / mkuu
  rationale: Katika muktadha huu neno hilo humaanisha viongozi wa koo au makabila. “Wakuu” ni la sasa na lenye hadhi, na umoja umerudiwa kabla ya kila jina kama katika Kiebrania.
- source_word: הַחֹרִי
  choice: Wahori
  rationale: Ingawa umbo la Kiebrania ni jina la kikundi katika umoja, hapa linataja jamii kwa ujumla; Kiswahili hutumia wingi “Wahori.”
- source_word: לוֹטָן
  choice: Lotani
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: שׁוֹבָל
  choice: Shobali
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili huku likihifadhi umbo la asili.
- source_word: צִבְעוֹן
  choice: Sibeoni
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: עֲנָה
  choice: Ana
  rationale: Jina la mtu limetoholewa kwa Kiswahili bila kuongeza konsonanti isiyotamkwa.
theological_decisions: []
