  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: sw
  text: Ninyi mlinikusudia mabaya, lakini Mungu aliyakusudia kwa mema, ili kuleta hali ilivyo leo[a]—kuwahifadhi watu wengi hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama ilivyo leo.” Nahau ya Kiebrania inaelekeza kwenye matokeo ya sasa yanayoonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם ... חֲשָׁבָהּ
  choice: mlinikusudia ... aliyakusudia
  rationale: Mzizi uleule wa Kiswahili umetumiwa pande zote mbili ili kuhifadhi ulinganifu wa makusudi ya ndugu na kusudi la Mungu katika Kiebrania.
- source_word: עָלַי רָעָה
  choice: mlinikusudia mabaya
  rationale: Usemi huu wa kawaida unaonyesha kwamba nia yao mbaya ilielekezwa dhidi ya Yosefu, huku ‘mabaya’ yakihifadhi uzito wa kimaadili wa רָעָה.
- source_word: לְטֹבָה
  choice: kuwa mema
  rationale: Huhifadhi tofauti ya moja kwa moja kati ya mabaya na mema kwa Kiswahili cha kawaida.
- source_word: לְמַעַן עֲשֹׂה
  choice: ili kuleta
  rationale: ‘Ili’ huonyesha kusudi, na ‘kuleta’ huwasilisha maana ya kutokeza matokeo ya kihistoria badala ya ‘kufanya’ isiyoeleza kitu kilichofanywa.
- source_word: כַּיּוֹם הַזֶּה
  choice: hali ilivyo leo
  rationale: Usemi huu unaelekeza kwenye matokeo ya sasa yanayoonekana; tafsiri hii ni ya asili na inaepuka usemi mgumu ‘kama siku hii.’
- source_word: לְהַחֲיֹת עַם רָב
  choice: kuwahifadhi watu wengi hai
  rationale: Hiphil ya חיה ina maana ya kudumisha au kuhifadhi uhai; עַם רָב hapa inaonyesha idadi kubwa ya watu.
theological_decisions:
- issue: Uongozi wa Mungu na uovu wa wanadamu katika matumizi sambamba ya חשב
  choice: Kutumia kitenzi kilekile ‘kusudia’ kwa ndugu na kwa Mungu
  alternative: Kutumia ‘kusudia’ kwa ndugu lakini ‘kugeuza’ kwa Mungu
  rationale: Kiebrania kinaweka makusudi hayo sambamba bila kufuta hatia ya ndugu wala kusudi jema la Mungu. ‘Kugeuza’ kungeondoa ulinganifu huo na kuingiza wazo lisilotajwa wazi katika kitenzi.
- issue: Maana ya kimaadili ya רָעָה
  choice: mabaya
  alternative: madhara
  rationale: ‘Mabaya’ yanahifadhi hatia ya kimaadili ya tendo la ndugu; ‘madhara’ yangelainisha maana hiyo na kuifanya ionekane kuwa matokeo mabaya tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida, huku ulinganifu wa ‘kusudia’ na mvutano kati ya uovu wa wanadamu na kusudi jema la Mungu vikihifadhiwa.
