base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: sw
  text: Baba yangu aliniapisha, akisema, ‘Tazama, ninakufa. Katika kaburi langu nililojichimbia katika nchi ya Kanaani, unizike huko.’ Basi sasa, tafadhali niruhusu niende nikamzike baba yangu, kisha nitarudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: aliniapisha
  rationale: 'Huwakilisha kwa usahihi kausativi ya kitenzi: alimfanya Yosefu aape.'
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi cha kuvuta fikira katika usemi wa moja kwa moja; ni cha heshima na kinachoeleweka katika Kiswahili cha Biblia.
- source_word: אָנֹכִי מֵת
  choice: ninakaribia kufa
  rationale: Kauli ya Kiebrania inaeleza kifo kinachokaribia, si kwamba msemaji tayari amekufa.
- source_word: כָּרִיתִי לִי
  choice: nililojichimbia
  rationale: Maana ya msingi ni ‘nililojichimbia/nililochonga kwa ajili yangu’; umbo hili huhifadhi wazo la kaburi alilojiandalia mwenyewe.
- source_word: אֶעֱלֶה נָּא
  choice: tafadhali niruhusu niende
  rationale: נָא huonyesha ombi la adabu; ‘niende’ ni Kiswahili cha kawaida katika muktadha huu, ingawa kitenzi cha Kiebrania kihalisi ni ‘nipande’.
- source_word: וְאָשׁוּבָה
  choice: kisha nitarudi
  rationale: Huhifadhi ahadi ya Yosefu ya kurudi baada ya mazishi.
