review_pass:
  verdict: revise
  source_fidelity: The draft conveys that Jacob's sons acted in conformity with his prior command. However, 'Basi' renders a narrative/consequential connective rather than Hebrew כֵּן ('so/thus/in that way'), and its manner force should be retained explicitly.
  naturalness: '''Wanawe wakamfanyia'' is understandable but is less idiomatic and slightly vague in this context. ''Wanawe wakafanya hivyo kwake'' is natural, concise Standard East African Swahili and keeps the Hebrew''s broad verb without artificially specifying the burial action.'
  terminology: '''Wanawe'' accurately represents the masculine plural ''his sons'' in the immediate context. ''Aliyowaamuru'' appropriately renders the command verb and preserves the antecedent action.'
  issues:
  - severity: medium
    issue: The rendering 'Basi' for כֵּן does not directly express the Hebrew adverb of manner.
    rationale: כֵּן means 'so/thus' and modifies what the sons did; 'Basi' primarily advances or concludes narration in Swahili. Adding 'hivyo' preserves the source relation clearly.
  - severity: low
    issue: The combined form 'wakamfanyia' is semantically broad and can sound incomplete without an expressed object.
    rationale: Although it can be understood as doing something for him, 'wakafanya hivyo kwake' is more transparent and idiomatic while retaining the dative sense of לוֹ.
  revised_text: Wanawe wakafanya hivyo kwake, kama alivyowaamuru.
