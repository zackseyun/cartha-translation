  text: So his sons did for him as he had commanded them.
translation:
  language: sw
  text: Wanawe wakafanya hivyo kwake, kama alivyowaamuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakamfanyia
  rationale: Kitenzi עשה ni kipana, ‘kufanya/kutenda.’ Pamoja na לוֹ, ‘wakamfanyia’ kinaeleza kwa njia ya asili kwamba wanawe walitekeleza jambo hilo kwa ajili yake.
- source_word: בָנָיו
  choice: wanawe
  rationale: Kiebrania kinataja hasa wana wa kiume; ‘wanawe’ ni tafsiri fupi na sahihi katika muktadha wa wana wa Yakobo.
- source_word: לוֹ
  choice: -m-...-ia
  rationale: Kiambishi cha yambwa pamoja na kauli ya kutendea katika ‘wakamfanyia’ kinawakilisha ל na kuonyesha kwamba tendo lilifanywa kwa ajili yake.
- source_word: כֵּן
  choice: basi
  rationale: Katika sentensi hii כֵּן inahitimisha kwa kuonyesha kwamba walifanya hivyo kulingana na agizo lililotangulia. ‘Basi’ huunganisha simulizi kwa Kiswahili cha asili, huku wazo la namna likibainishwa na ‘kama.’
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: ‘Kama’ linaonyesha kwamba tendo lao lililingana na agizo lake.
- source_word: צִוָּם
  choice: alivyowaamuru
  rationale: צוה humaanisha ‘kuamuru.’ Muundo ‘alivyowaamuru’ unaonyesha kwa kawaida kwamba agizo lilitangulia utekelezaji wao.
