  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אֶחָ֔י/ו אָנֹכִ֖י מֵ֑ת וֵֽ/אלֹהִ֞ים פָּקֹ֧ד יִפְקֹ֣ד אֶתְ/כֶ֗ם וְ/הֶעֱלָ֤ה אֶתְ/כֶם֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את אֶל הָ/אָ֕רֶץ אֲשֶׁ֥ר נִשְׁבַּ֛ע לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: sw
  text: Yosefu akawaambia ndugu zake, “Mimi ninakaribia kufa, lakini Mungu hakika atawajilia[a] na kuwapandisha kutoka nchi hii kwenda katika nchi aliyowaapia Abrahamu, Isaka na Yakobo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawakumbuka kwa hakika.” Nahau ya Kiebrania inaweza kumaanisha kwamba Mungu atawaelekezea watu wake uangalifu wa makusudi na kuingilia hali yao kwa ajili yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu nomino ya Kiebrania ya wingi wa kiume inawahusu hasa ndugu wa kiume wa Yosefu; ‘ndugu zake’ ni usemi wa kawaida wa Kiswahili na muktadha unaweka wazi maana hiyo.
- source_word: אָנֹכִי מֵת
  choice: Mimi ninakaribia kufa
  rationale: Muundo wa Kiebrania unaonyesha kifo cha Yosefu kilicho karibu. Tafsiri hii ni ya kawaida zaidi katika Kiswahili kuliko ‘ninakufa’ na haimaanishi kwamba tayari amekufa.
- source_word: פָּקֹד יִפְקֹד
  choice: hakika atawajilia
  rationale: Kitenzi kilichorudiwa kwa muundo wa infinitivu kamili pamoja na kitenzi kisichokamilika kinasisitiza uhakika. ‘Atawajilia’ huhifadhi wazo pana la Mungu kuwaelekea watu wake kwa uangalifu na kutenda kwa ajili yao bila kubainisha kupita kiasi namna ya tendo hilo.
- source_word: וֵאלֹהִים
  choice: lakini Mungu
  rationale: Ingawa kiunganishi cha Kiebrania kwa msingi kinaweza kuwa ‘na’, hapa kinaonyesha tofauti kati ya kifo cha Yosefu na tendo la Mungu litakaloendelea.
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: na kuwapandisha
  rationale: Huhifadhi taswira ya mwelekeo ya kitenzi עלה katika kausativi—kuwafanya waende juu—badala ya kuibadili tu kuwa ‘kuwatoa’.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: kutoka nchi hii
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; nchi inayorejelewa ni Misri.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: kwenda katika nchi aliyowaapia
  rationale: Huhifadhi kitenzi ‘aliapa’ bila kuongeza wazi ‘kuwapa’, ambalo linaeleweka katika muktadha lakini halipo katika maneno ya Kiebrania.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abrahamu, Isaka na Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili. Kiambishi cha yambwa katika ‘aliyowaapia’ kinatumika kwa wote watatu kwa njia ya kawaida ya Kiswahili.
theological_decisions:
- issue: Maana ya tendo la Mungu katika פָּקֹד יִפְקֹד
  choice: Mungu hakika atawajilia, yaani atawaelekea kwa uangalifu wa makusudi na kutenda kwa ajili yao.
  alternative: Mungu hakika atawakumbuka / atawaangalia / atawatembelea.
  rationale: Muundo wa Kiebrania unasisitiza uhakika wa tendo la Mungu, nalo katika muktadha wa agano ni zaidi ya ziara ya kawaida. ‘Atawajilia’ linaacha upana wa maana hiyo bila kuamua kimadhehebu jinsi Mungu atakavyotenda.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Atawajilia’ limetumiwa kwa maana pana ya kiagano na limefafanuliwa katika tanbihi; ‘kuwapandisha’ huhifadhi taswira ya mwelekeo ya Kiebrania.
