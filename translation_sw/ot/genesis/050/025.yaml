  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: sw
  text: Kisha Yosefu akawaapisha wana wa Israeli, akisema, “Mungu hakika atawajilia, nanyi mtazipandisha mifupa yangu kutoka hapa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת
  choice: akawaapisha
  rationale: Muundo wa Kiebrania humaanisha kumfanya mtu aape; kitenzi hiki cha Kiswahili kinawasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: פָּקֹד יִפְקֹד
  choice: Hakika ... atawakumbuka
  rationale: Kitenzi kilichorudiwa kwa hali ya kusisitiza kinaonyesha uhakika. Hapa 'kuwakumbuka' si kukumbuka kiakili tu, bali kuwajali na kuchukua hatua kwa ajili yao; chaguo hili pia huhifadhi mwangwi wa Mwanzo 50:24.
- source_word: וְהַעֲלִתֶם
  choice: nanyi mtaipandisha
  rationale: Umbo la Kiebrania ni kauli ya pili wingi yenye maana ya kupandisha/kupeleka juu. Kauli ya wakati ujao katika muktadha wa kiapo hubeba wajibu bila kulazimisha neno la amri lisilo wazi katika umbo lenyewe.
- source_word: עַצְמֹתַי
  choice: mifupa yangu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya rejeleo la mabaki ya Yosefu.
theological_decisions:
- issue: Maana ya פָּקֹד יִפְקֹד kuhusu tendo la Mungu
  choice: Hakika Mungu atawakumbuka
  alternative: Mungu hakika atawajilia / atawashughulikia
  rationale: Neno hili linaweza kuhusisha Mungu kuwajali, kuwajilia, na kutenda kwa niaba yao. 'Atawakumbuka' huhifadhi istilahi pana ya kibiblia bila kufunga maana katika namna moja tu ya tendo.
- issue: Nguvu ya וְהַעֲלִתֶם baada ya kiapo
  choice: nanyi mtaipandisha
  alternative: nanyi lazima muipandishe
  rationale: Wajibu unatokana na kiapo, lakini umbo la Kiebrania lenyewe ni kauli ya wakati ujao. Tafsiri iliyochaguliwa huhifadhi mvutano huo bila kuongeza kisaidizi cha lazima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. 'Wana wa Israeli' limehifadhiwa kama jina la pamoja la agano, na 'mtaipandisha ... kutoka hapa' hudumisha taswira ya Kiebrania ya kuondoka Misri kuelekea nchi ya ahadi.
