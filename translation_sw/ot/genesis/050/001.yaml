  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: sw
  text: Ndipo Yosefu akaanguka juu ya uso wa baba yake, akamlilia na kumbusu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajiangusha juu ya uso wa baba yake,” ili kusisitiza zaidi picha hai ya Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: akaanguka
  rationale: Kitenzi נפל katika mfululizo wa masimulizi kinaeleza tendo lililokamilika. ‘Akaanguka’ ni tafsiri ya moja kwa moja na inadumisha mwendo wa kimwili bila kuongeza nguvu ya hisia isiyosemwa wazi.
- source_word: עַל פְּנֵי אָבִיו
  choice: juu ya uso wa baba yake
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania, ingawa katika muktadha inaweza kumaanisha Yosefu alijiinamisha au kujiangusha juu ya uso wa mwili wa baba yake.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: akamlilia
  rationale: בכה humaanisha kulia. Muundo ‘akamlilia’ ni wa kawaida katika Kiswahili na unaonyesha kilio cha maombolezo kwa ajili yake bila kulazimisha maana ya machozi kuangukia mwilini.
- source_word: וַיִּשַּׁק לוֹ
  choice: na kumbusu
  rationale: נשק katika Qal humaanisha kubusu; kiwakilishi cha Kiswahili kinaonyesha moja kwa moja kwamba Yosefu alimbusu baba yake.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
