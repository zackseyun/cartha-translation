base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: sw
  text: Kisha ndugu zake pia wakaja, wakaanguka kifudifudi mbele yake, wakasema, “Hapa tupo, sisi ni watumwa wako[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wako.” Neno la Kiebrania עֲבָדִים linaweza kumaanisha watumishi au watumwa; hapa “watumwa” linaonyesha nguvu ya kujisalimisha kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: wakaja
  rationale: Ingawa הלך kwa msingi humaanisha ‘kwenda’ au ‘kutembea,’ hapa ndugu wanamkaribia Yosefu; ‘wakaja’ ni ya kawaida katika usimulizi wa Kiswahili kwa mtazamo wa tukio.
- source_word: גַּם אֶחָיו
  choice: ndugu zake pia
  rationale: גַּם huonyesha kuwa baada ya ujumbe wa awali, ndugu zake wenyewe walifika; ‘pia’ huhifadhi wazo hilo la nyongeza bila kulitia mkazo usio lazima.
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: wakaanguka kifudifudi mbele yake
  rationale: Muundo נפל + לפני unaonyesha kujiangusha mbele ya mtu kwa unyenyekevu na kujisalimisha. ‘Kifudifudi’ hufanya tendo hilo la mwili lieleweke wazi kwa Kiswahili cha kawaida.
- source_word: הִנֶּנּוּ
  choice: Hapa tupo
  rationale: Ni usemi wa kujitokeza au kujitoa wenye maana ya ‘tazama, sisi hapa’; ‘Hapa tupo’ ni wa sasa na wa asili bila kutumia tamko la kizamani.
- source_word: לְךָ לַעֲבָדִים
  choice: sisi ni watumwa wako
  rationale: Kirai hiki kinawaweka ndugu chini ya mamlaka ya Yosefu. Umilikishi ‘wako’ ni wa kawaida kwa Kiswahili na huhifadhi maana ya kujitoa wawe chini yake.
- source_word: עֲבָדִים
  choice: watumwa
  rationale: Neno linaweza kumaanisha watumishi au watumwa. Katika muktadha huu, kujitolea kwao kwa unyenyekevu mkali na chini ya mamlaka ya Yosefu kunaelezwa kwa nguvu zaidi na ‘watumwa,’ huku maana nyingine ikiwekwa katika tanbihi.
theological_decisions:
- issue: Maana ya עֲבָדִים katika tamko la kujisalimisha
  choice: watumwa
  alternative: watumishi
  rationale: 'Muktadha unaonyesha zaidi ya ahadi ya kutoa huduma tu: ndugu wanajisalimisha kabisa chini ya mamlaka ya Yosefu. ‘Watumwa’ huhifadhi uzito huo bila kuamua jambo la kimadhehebu; tanbihi inadumisha upana halisi wa neno la Kiebrania.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida lakini wa heshima. ‘Wakaanguka kifudifudi’ linaweka wazi tendo la kujiangusha kwa unyenyekevu, na ‘Hapa tupo’ ni usemi wa kisasa unaowasilisha הִנֶּנּוּ kwa urahisi.
