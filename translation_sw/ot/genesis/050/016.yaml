  text: Basi wakatuma ujumbe kwa Yosefu[a], wakisema, “Baba yako aliamuru kabla ya kifo chake, akisema,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “wakamuamuru Yosefu.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kuamuru,” lakini hapa yaelekea kinamaanisha kumpelekea Yosefu ujumbe.
