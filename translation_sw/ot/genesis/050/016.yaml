lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: wakatuma ujumbe
  rationale: Ingawa kitenzi צוה kwa kawaida humaanisha ‘kuamuru,’ katika muktadha huu kinaelekea kueleza kutumwa kwa ujumbe kwa Yosefu, si ndugu zake kumpa amri.
- source_word: אֶל יוֹסֵף
  choice: kwa Yosefu
  rationale: Kihusishi kinaonyesha Yosefu ndiye mpokeaji wa ujumbe; jina limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Hutambulisha maneno yaliyoripotiwa na kuhifadhi mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: אָבִיךָ
  choice: Baba yako
  rationale: Huhifadhi nafsi ya pili ya umoja katika maneno yanayoelekezwa kwa Yosefu.
- source_word: צִוָּה
  choice: aliamuru
  rationale: Huhifadhi maana ya kawaida na nguvu ya kitenzi צוה, huku yaliyomo katika amri yakifuata katika mstari unaofuata.
- source_word: לִפְנֵי מוֹתוֹ
  choice: kabla ya kifo chake
  rationale: Hapa לִפְנֵי ina maana ya wakati, yaani kabla hajafa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Utambulisho wa pili wa usemi umehifadhiwa kwa sababu unaandaa nukuu ya amri ya baba katika mstari unaofuata.
