  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kiambishi simulizi “aka-” kinaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida bila kuongeza maana isiyokuwapo.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mtawala wa Misri.
- source_word: עֲלֵה
  choice: Panda
  rationale: Kitenzi kinahifadhi maana ya kwenda juu kutoka Misri kuelekea Kanaani, badala ya kuifanya kuwa “nenda” tu.
- source_word: וּקְבֹר אֶת אָבִיךָ
  choice: ukamzike baba yako
  rationale: “Zika” ni neno la kawaida na lenye heshima; muundo wa “uka-” unaunganisha kusafiri na kusudi la kumzika baba yake kwa Kiswahili cha asili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: “Kama” linaonyesha namna au kulingana na kiapo kilichotangulia kwa ufupi na kwa kawaida.
- source_word: הִשְׁבִּיעֶךָ
  choice: alivyokuapisha
  rationale: Muundo wa kisababishi unahifadhi kwamba baba yake alimfanya aape, si kwamba aliapa kwa hiari yake tu.
