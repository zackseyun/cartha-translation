base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: sw
  text: Siku za maombolezo yake zilipokwisha[a], Yosefu akasema na watu wa nyumba ya Farao, “Ikiwa nimepata kibali machoni penu, tafadhali semeni masikioni mwa Farao mkisema:[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “siku za kumlilia zilipokwisha.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “masikioni mwa Farao”; ni nahau yenye maana ya kusema ili Farao asikie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: zilipokwisha
  rationale: Kitenzi עבר hapa kinaeleza kipindi cha wakati kufikia mwisho wake; muundo huu pia unaonyesha kuwa maombolezo yalikwisha kabla Yosefu hajazungumza.
- source_word: יְמֵי בְכִיתוֹ
  choice: Siku za kumwombolezea
  rationale: בכי kimsingi ni kulia, lakini katika muktadha wa mazishi inamaanisha maombolezo kwa ajili ya Yakobo. Kiswahili hiki ni cha kawaida na kinaweka wazi kuwa maombolezo yalikuwa kwa ajili yake.
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: דבר ni kusema au kuzungumza. ‘Akasema na’ ni usemi wa kawaida unaofaa kabla ya kunukuu ombi lake.
- source_word: אֶל־בֵּית פַּרְעֹה
  choice: na watu wa nyumba ya Farao
  rationale: בית hapa inarejelea watu wa nyumba au watumishi wa kifalme, si jengo pekee. Kuongeza ‘watu wa’ kunafanya maana hiyo ieleweke bila kuibadili kuwa istilahi pana zaidi ya ‘baraza.’
- source_word: אִם־נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: Ikiwa nimepata kibali machoni penu
  rationale: Huhifadhi namna ya sharti na tamathali ya Kiebrania ya kupata kibali machoni pa mtu. Sauti ya unyenyekevu ya נָא inaendelezwa kwa ‘tafadhali’ katika ombi linalofuata.
- source_word: דַּבְּרוּ־נָא
  choice: tafadhali semeni
  rationale: Amri ni ya wingi na נָא huonyesha ombi la heshima; ‘tafadhali semeni’ huwasilisha yote mawili kwa Kiswahili cha kawaida.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: masikioni mwa Farao
  rationale: Huhifadhi tamathali halisi ya Kiebrania ya kusema jambo mahali mtu anapolisikia; tanbihi inafafanua maana ya nahau hiyo.
- source_word: לֵאמֹר
  choice: kwamba
  rationale: Hutambulisha maneno ambayo Yosefu anataka yafikishwe kwa Farao; ujumbe wenyewe unaendelea katika mstari unaofuata.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Tamathali zilizo wazi, kama ‘kibali machoni penu,’ zimehifadhiwa. Sentensi imeachwa ikiendelea kwa sababu usemi wa Yosefu unaingia katika mstari unaofuata.
