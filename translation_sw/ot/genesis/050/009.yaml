translation:
  language: sw
  text: Magari ya vita[a] na wapanda farasi pia walikwenda pamoja naye, nao msafara huo ulikuwa mkubwa sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno “gari la vita” katika umoja, lakini limetumiwa kwa maana ya jumla ya magari ya vita.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kambi ilikuwa nzito sana,” yaani, kubwa sana au ya kuvutia sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: walikwenda
  rationale: Katika simulizi la safari, עלה huweza kueleza kwenda au kusafiri kuelekea mahali. ‘Walikwenda’ ni ya kawaida katika Kiswahili na haidokezi bila sababu kwamba walipanda mlima.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Hutoa kwa uwazi maana ya kuandamana na Yosefu katika muktadha.
- source_word: גַּם ... גַּם
  choice: na ... pia
  rationale: Muundo huu unaunganisha magari ya vita na wapanda farasi kama makundi yaliyoongezwa kwa waliokuwa wakisafiri pamoja na Yosefu.
- source_word: רֶכֶב
  choice: magari ya vita
  rationale: Nomino ya Kiebrania iko katika umoja lakini imetumiwa kwa maana ya jumla ya kikosi cha magari; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: פָּרָשִׁים
  choice: wapanda farasi
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya askari au watu waliopanda farasi, bila kuingiza istilahi ya kisasa zaidi ya kijeshi.
- source_word: הַמַּחֲנֶה
  choice: msafara huo
  rationale: Ingawa neno hilo kwa kawaida humaanisha ‘kambi,’ hapa linarejelea kundi lote lililokuwa safarini kwenda mazishini; ‘msafara’ huepuka picha ya kambi iliyosimama.
- source_word: כָּבֵד מְאֹד
  choice: ulikuwa mkubwa sana
  rationale: Maana ya neno kwa neno ni ‘ulikuwa mzito sana,’ lakini linapotumiwa kuhusu kundi linaonyesha ukubwa, wingi, au uzito wa hadhi. ‘Mkubwa sana’ huwasilisha maana ya kawaida katika Kiswahili.
