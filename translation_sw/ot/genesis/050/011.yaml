base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: sw
  text: Wakaaji wa nchi, yaani Wakanaani,[c] walipoona maombolezo kwenye uwanja wa kupuria wa Atadi, wakasema, “Haya ni maombolezo mazito ya Wamisri.” Kwa hiyo mahali hapo pakaitwa Abel-Misraimu,[a] palipo ng’ambo ya Yordani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, jina Abel-Misraimu linasikika kama “maombolezo ya Misri,” likirejelea jinsi Wakanaani walivyoyaeleza maombolezo hayo.
    reason: lexical_alternative
  - marker: b
    text: Au “upande mwingine wa Yordani”; maana ya kirai hiki hutegemea mahali anapotazamia msemaji au msimuliaji.
    reason: lexical_alternative
  - marker: c
    text: Au “Wakanaani waliokaa katika nchi.” Kiebrania kina usemi wa kiambatisho unaoweza kutafsiriwa kwa njia zote mbili.
    reason: previous_rendering
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: Wakaaji wa nchi, yaani Wakanaani
  rationale: Neno la umoja יוֹשֵׁב limetumiwa kwa maana ya kundi, na הַכְּנַעֲנִי inawatambulisha wakaaji hao kwa ufafanuzi wa kiambatisho. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi vipengele vyote viwili.
- source_word: הָאֵבֶל
  choice: maombolezo
  rationale: אֵבֶל hapa ni kuomboleza kunakohusiana na kifo, pamoja na desturi zake; “maombolezo” linafaa katika muktadha huu na linawezesha mchezo wa maneno katika jina Abel-Misraimu kuelezwa katika tanbihi.
- source_word: בְּגֹרֶן הָאָטָד
  choice: kwenye uwanja wa kupuria wa Atadi
  rationale: גֹּרֶן ni uwanja wa kupuria nafaka, na בְּ inaonyesha mahali. “Kwenye” ni ya asili katika Kiswahili cha sasa.
- source_word: אֵבֶל כָּבֵד
  choice: maombolezo mazito
  rationale: כָּבֵד kimsingi ni “nzito” na hapa inaonyesha ukubwa au ukali wa maombolezo. “Maombolezo mazito” ni usemi wa kawaida unaohifadhi taswira ya Kiebrania.
- source_word: לְמִצְרָיִם
  choice: kwa Wamisri
  rationale: Ingawa מִצְרָיִם ni jina la Misri, muktadha unalihusisha tukio na kundi la Wamisri waliokuwa wakiomboleza; “kwa Wamisri” huwasilisha maana hiyo kwa uwazi.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha kawaida kinachoonyesha kwamba jina lililotolewa linatokana na maelezo yaliyotangulia.
- source_word: קָרָא שְׁמָהּ
  choice: mahali hapo pakaitwa
  rationale: Muundo wa Kiebrania ni kauli ya kutaja jina bila kumtaja wazi mtendaji. Kiswahili cha kutendwa kinahifadhi kutotajwa huko, huku “mahali hapo” kikifanya rejeo la kiambishi cha kike lieleweke kwa kawaida.
- source_word: אָבֵל מִצְרַיִם
  choice: Abel-Misraimu
  rationale: Jina limetoholewa badala ya kutafsiriwa ndani ya matini; maana na mchezo wake wa maneno na אֵבֶל, “maombolezo,” vinaelezwa katika tanbihi.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Kirai kinaonyesha upande mwingine wa Mto Yordani kwa mtazamo wa msimuliaji. “Ng’ambo ya Yordani” ni kifupi na cha kawaida, huku utegemezi wa mtazamo ukibainishwa katika tanbihi.
