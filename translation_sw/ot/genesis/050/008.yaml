base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: sw
  text: na watu wote wa nyumba ya Yosefu[a], na ndugu zake, na watu wa nyumba ya baba yake; waliacha tu katika nchi ya Gosheni watoto wao wadogo[b], makundi yao ya kondoo na mbuzi, na ng’ombe wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba ya Yosefu” hapa inamaanisha familia au kaya yake, si jengo tu.
    reason: lexical_alternative
  - marker: b
    text: “Watoto wadogo” ni watoto wenye umri mdogo.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: na watu wote wa nyumba ya Yosefu
  rationale: Muundo huu unaendeleza orodha ya mstari uliotangulia, unahifadhi maana ya ukamilifu ya כֹּל, na unaonyesha kwamba בֵּית ni watu wa familia au kaya, si jengo pekee.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Katika muktadha huu neno la Kiebrania linawahusu ndugu wa kiume wa Yosefu; “ndugu zake” ndiyo kauli ya kawaida na ya asili katika Kiswahili.
- source_word: וּבֵית אָבִיו
  choice: na watu wa nyumba ya baba yake
  rationale: Kirai hiki kinamaanisha familia au kaya inayohusishwa na baba yake, wala si jengo.
- source_word: רַק
  choice: hawa tu
  rationale: Kauli hii inaonyesha wazi kwamba waliotajwa baadaye ndio pekee walioachwa Gosheni, huku ikitoa Kiswahili chenye mpangilio wa kawaida.
- source_word: טַפָּם
  choice: watoto wao wadogo
  rationale: טַף huonyesha watoto wadogo, si watoto wa umri wowote wala wategemezi wote kwa ujumla.
- source_word: וְצֹאנָם
  choice: kondoo na mbuzi wao
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; kutaja aina hizo huwasilisha maana kwa uwazi katika Kiswahili.
- source_word: וּבְקָרָם
  choice: na ng’ombe wao
  rationale: בָּקָר hurejelea ng’ombe au mifugo mikubwa; “ng’ombe” ni tafsiri ya kawaida na dhahiri hapa.
- source_word: עָזְבוּ
  choice: waliacha
  rationale: Kitenzi hiki kina maana ya kuacha au kuacha nyuma; “waliacha” hakidokezi kuwa waliwatelekeza.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: katika nchi ya Gosheni
  rationale: Tafsiri hii inahifadhi neno אֶרֶץ na kutaja eneo hilo kikamilifu.
theological_decisions: []
