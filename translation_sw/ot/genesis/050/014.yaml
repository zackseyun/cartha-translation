  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: sw
  text: Kisha Yosefu akarudi Misri, yeye pamoja na ndugu zake na wote waliopanda pamoja naye[a] kwenda kumzika baba yake, baada ya kumzika baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wote waliopanda pamoja naye.” Katika Biblia, “kupanda” hutumiwa kwa kawaida kuhusu safari kutoka Misri kwenda Kanaani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב kinaeleza kurudi mahali palipoachwa awali; ‘akarudi’ ni simulizi la kawaida na wazi katika muktadha huu.
- source_word: מִצְרַיְמָה
  choice: Misri
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda Misri; baada ya ‘akarudi,’ Kiswahili hakihitaji kihusishi cha ziada.
- source_word: הוּא וְאֶחָיו
  choice: yeye pamoja na ndugu zake
  rationale: ‘Yeye’ linahifadhi msisitizo wa kiwakilishi cha Kiebrania, huku ‘pamoja na ndugu zake’ likitoa Kiswahili cha kawaida.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: na wote waliopanda pamoja naye
  rationale: Uundaji huu unahifadhi taswira ya Kiebrania ya ‘kupanda,’ inayotumiwa kwa safari kutoka Misri kwenda Kanaani, na tanbihi inaifafanua kwa msomaji wa sasa.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: kwenda kumzika baba yake
  rationale: Muundo wenye ל unaonyesha kusudi; ‘kwenda kumzika’ unaeleza kusudi hilo kwa Kiswahili cha asili.
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: baada ya kumzika baba yake
  rationale: ‘Baada ya’ linaonyesha mfuatano wa wakati, na kurudiwa kwa ‘baba yake’ kunafuata urudiaji wa wazi katika Kiebrania bila kuondoa mkazo wake.
