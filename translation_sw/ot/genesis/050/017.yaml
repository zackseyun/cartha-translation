base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: sw
  text: 'Mwambieni Yosefu hivi: ‘Tafadhali, samehe kosa la ndugu zako na dhambi yao, kwa sababu walikutendea mabaya. Na sasa, tafadhali samehe kosa la watumishi wa Mungu wa baba yako.’ Yosefu akalia waliposema naye.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: tafadhali, samehe
  rationale: Kitenzi hicho kwa maana ya msingi ni ‘inua/chukua’, lakini katika muktadha huu ni ombi la kuondoa au kusamehe kosa; ‘tafadhali’ huwasilisha chembe ya kusihi נָא.
- source_word: פֶּשַׁע
  choice: kosa
  rationale: Huwasilisha tendo la kuvunja uaminifu au kuasi bila kulazimisha istilahi nzito zaidi; linatofautishwa kwa kiasi na חַטָּאתָם, ‘dhambi yao’.
- source_word: חַטָּאתָם
  choice: dhambi yao
  rationale: Neno la kawaida na lenye hadhi kwa dhambi; umoja wa Kiebrania wenye kiambishi cha wingi umehifadhiwa kama ‘yao’.
- source_word: רָעָה גְמָלוּךָ
  choice: walikutendea mabaya
  rationale: Nahau ya Kiebrania ina maana ya kumtendea mtu uovu au mabaya; tafsiri hii ni ya asili katika Kiswahili na haiongezi wazo lisilo lazima la ‘kulipa’.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Mungu wa baba yako
  rationale: Huhifadhi umoja na uhusiano wa agano unaoelezwa na maneno ya chanzo.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: waliposema naye
  rationale: Huhifadhi kwa kawaida maana ya ‘waliponena naye’; kiwakilishi cha wingi hakibainishi wazi kama ni ndugu wenyewe au wajumbe.
theological_decisions:
- issue: Uhusiano kati ya ‘ndugu zako’ na ‘watumishi wa Mungu wa baba yako’
  choice: Vikundi vyote viwili vimeachwa kama vinavyoelezwa katika chanzo, bila kutamka kuwa ni kundi moja au makundi tofauti.
  alternative: ‘Sisi watumishi wa Mungu wa baba yako’
  rationale: Kiebrania hakina kiwakilishi dhahiri cha nafsi ya kwanza hapa; kuingiza ‘sisi’ kungeondoa utata uliopo.
- issue: Sababu ya ombi la msamaha
  choice: ‘kwa sababu walikutendea mabaya’
  alternative: ‘ingawa walikutendea mabaya’
  rationale: כִּי kwa kawaida huonyesha sababu hapa; tafsiri haibadili mvutano wa kauli kwa kuifanya iwe ya kukubali kinyume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi umerudiwa ili kuhifadhi msisitizo wa Kiebrania; hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
