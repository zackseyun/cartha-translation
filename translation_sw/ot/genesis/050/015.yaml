  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: sw
  text: Ndugu zake Yosefu walipoona kwamba baba yao amekufa, wakasema, “Huenda Yosefu akatuchukia na kutulipiza kisasi kabisa kwa mabaya yote tuliyomtendea.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ל֥וּ יִשְׂטְמֵ֖נוּ
  choice: Itakuwaje ikiwa Yosefu anatuchukia
  rationale: Neno לוּ hapa linaonyesha hofu kuhusu jambo linaloweza kutokea, na שׂטם humaanisha kuweka chuki au uadui dhidi ya mtu. Kiswahili hiki cha asili huhifadhi hali hiyo ya wasiwasi.
- source_word: וְהָשֵׁב יָשִׁיב
  choice: na kutulipiza kikamilifu
  rationale: Muundo wa kitenzi kisoukomo pamoja na kitenzi kilichogeuzwa hutia mkazo tendo la kulipa; “kikamilifu” huwasilisha msisitizo huo bila kuongeza wazo jipya.
- source_word: כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: mabaya yote tuliyomtendea
  rationale: גמל pamoja na רעה hapa hueleza mabaya waliyomtendea Yosefu. Usemi huu ni wa kawaida na wenye hadhi katika Kiswahili cha Afrika Mashariki.
theological_decisions:
- issue: Je, kauli inaeleza chuki ya Yosefu kuwa hakika au hofu ya ndugu zake?
  choice: 'Imeandikwa kama uwezekano unaowaogopesha: “Itakuwaje ikiwa...”'
  alternative: “Huenda Yosefu atatuchukia...”
  rationale: Muktadha na לוּ huhifadhi hofu yao bila kuthibitisha kwamba Yosefu kweli alikuwa na chuki.
- issue: Nguvu ya muundo וְהָשֵׁב יָשִׁיב
  choice: “kutulipiza kikamilifu”
  alternative: “hakika atatulipiza”
  rationale: Chaguo hili huhifadhi msisitizo wa Kiebrania huku likiunganika vizuri na muundo wa uwezekano wa sentensi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Itakuwaje ikiwa” ni usemi wa kawaida wa kuonyesha hofu kuhusu uwezekano; “kutulipiza kikamilifu” huhifadhi msisitizo wa maandishi ya Kiebrania.
