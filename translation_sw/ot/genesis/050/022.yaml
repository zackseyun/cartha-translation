  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: sw
  text: Yosefu alibaki Misri, yeye pamoja na watu wa nyumba ya baba yake; naye akaishi miaka mia moja na kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yosefu alikaa Misri, yeye pamoja na watu wa nyumba ya baba yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akaendelea kukaa
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa, kuishi, au kubaki. Katika muhtasari huu wa simulizi, “akaendelea kukaa” huonyesha kwamba Yosefu aliendelea kuwa Misri baada ya kifo cha Yakobo, huku kikitofautishwa na וַיְחִי inayotaja urefu wa maisha yake.
- source_word: בְּמִצְרַיִם
  choice: Misri
  rationale: Kirai hiki kinaonyesha mahali Yosefu alipoendelea kukaa; katika Kiswahili sanifu jina “Misri” kwa kawaida halihitaji kihusishi “katika” katika matumizi haya.
- source_word: הוּא וּבֵית אָבִיו
  choice: yeye pamoja na watu wa nyumba ya baba yake
  rationale: בֵּית hapa haimaanishi jengo tu bali jamaa na watu wa kaya ya baba yake. “Watu wa nyumba ya baba yake” huhifadhi taswira ya Kiebrania na kuonyesha kundi pana kuliko familia ya karibu pekee.
- source_word: וַיְחִי
  choice: akaishi
  rationale: חיה hapa hutumiwa katika taarifa ya urefu wa maisha; “akaishi” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: miaka 110
  rationale: Huhifadhi idadi kamili kwa namna fupi na inayoeleweka kwa wasomaji wa kisasa.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
