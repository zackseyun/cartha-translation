  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: sw
  text: Basi Yosefu akafa akiwa na umri wa miaka mia moja na kumi. Wakampaka dawa za kumhifadhi[a], wakamweka katika jeneza huko Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakamfanya mumia.” Kitenzi cha Kiebrania humaanisha kutia dawa mwilini ili kuhifadhi mwili wa maiti, hasa katika mazingira ya Misri.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות kinamaanisha kufa moja kwa moja; “akafa” ni tafsiri ya kawaida na isiyo ya kificho.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: akiwa na umri wa miaka mia moja na kumi
  rationale: Nahau ya Kiebrania hutumia kihalisi “mwana wa” kueleza umri; Kiswahili cha asili hutumia “akiwa na umri wa.”
- source_word: וַיַּחַנְטוּ
  choice: wakamuhifadhi mwili kwa dawa
  rationale: Kitenzi חנט kinahusu kuuhifadhi mwili wa maiti, hasa katika mazingira ya Misri. Usemi huu unaeleweka kwa wasomaji wa kawaida bila kulazimisha maana maalumu zaidi ya “kumumisha.”
- source_word: וַיִּישֶׂם
  choice: wakamweka
  rationale: Kitenzi שׂים humaanisha kuweka; “wakamweka” ni cha asili na kinafaa katika mtiririko wa simulizi.
- source_word: בָּאָרוֹן
  choice: katika jeneza
  rationale: Ingawa אָרוֹן inaweza kumaanisha sanduku, safina, au jeneza, muktadha wa kuhifadhi maiti unaonyesha maana ya jeneza.
- source_word: בְּמִצְרָיִם
  choice: huko Misri
  rationale: “Huko Misri” hutafsiri mahali kwa ufasaha na kuonyesha kwamba tendo hilo lilifanyika Misri.
- source_word: וַ
  choice: Basi
  rationale: Waw ya mwanzo inaendeleza simulizi na hapa pia ina ladha ya hitimisho; “Basi” huakisi mtiririko huo wa mwisho wa kitabu.
