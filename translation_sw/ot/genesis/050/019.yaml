  text: Yosefu akawaambia, “Msiogope, kwa maana je, mimi niko mahali pa Mungu?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mimi niko chini ya Mungu?” Kifungu cha Kiebrania ni nahau; hapa yaelekea zaidi kumaanisha, “Je, mimi niko mahali pa Mungu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: akawaambia
  rationale: Muundo wa kawaida wa masimulizi wenye אמר pamoja na אֶל na kiambishi cha nafsi unaelezwa kwa Kiswahili cha asili kwa kitenzi kimoja, “akawaambia,” kinachotaja kitendo na wanaoambiwa.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina limetolewa kwa umbo la Kiswahili lililozoeleka katika tafsiri za Biblia.
- source_word: אַל תִּירָאוּ
  choice: Msiogope
  rationale: Katazo la wingi limehifadhiwa moja kwa moja na kwa lugha ya sasa inayowaelekea ndugu zake Yosefu.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha sababu ya maneno ya Yosefu ya kuwatuliza; “kwa maana” huhifadhi uhusiano huo wa ufafanuzi.
- source_word: הֲתַחַת אֱלֹהִים אָֽנִי
  choice: je, mimi niko mahali pa Mungu?
  rationale: Swali la balagha na msisitizo wa kiwakilishi אָֽנִי vimehifadhiwa. “Mahali pa Mungu” huwasilisha maana ya kimuktadha ya kuchukua nafasi au mamlaka ya Mungu bila kuondoa kabisa ugumu wa nahau ya Kiebrania.
theological_decisions:
- issue: Nguvu ya swali la Yosefu kuhusu nafasi au mamlaka ya Mungu
  choice: Yosefu anakataa kuwa katika nafasi ya Mungu ya kutoa hukumu au kulipiza kisasi.
  alternative: Yosefu anauliza kama yeye yuko chini ya Mungu.
  rationale: Katika muktadha wa hofu ya ndugu zake kwamba atalipiza kisasi, תַּחַת אֱלֹהִים inaelekea zaidi kumaanisha kuwa “mahali pa Mungu.” Tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi na umbo la neno bila kuifanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Msiogope” ni fupi na ya kawaida; swali limeachwa la balagha ili kuhifadhi mvutano wa maandishi ya Kiebrania.
