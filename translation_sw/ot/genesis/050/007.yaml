base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: sw
  text: Basi Yosefu akapanda kwenda kumzika baba yake[a]; na watumishi wote wa Farao wakapanda pamoja naye, wazee wa nyumba yake, na wazee wote wa nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “akapanda” linafuata desturi ya kueleza safari kutoka Misri kwenda Kanaani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: Kitenzi עָלָה kina maana ya kupanda au kwenda juu. Kauli hii inahifadhi namna ya Kiebrania ya kueleza safari kutoka Misri kwenda Kanaani huku ikiwa ya kawaida katika Kiswahili.
- source_word: לִקְבֹּר
  choice: kumzika
  rationale: Kitenzi קָבַר humaanisha kuzika; kiambishi -m- kinamrejelea baba anayetajwa wazi katika sentensi.
- source_word: אָבִיו
  choice: baba yake
  rationale: Hii inawakilisha kiambishi cha umilikaji bila kuongeza mkazo usiokuwapo katika Kiebrania.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: wakapanda pamoja naye
  rationale: Inahifadhi marudio ya kitenzi עָלָה na maana ya kuandamana na Yosefu.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: watumishi wote wa Farao
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Katika muktadha wa ikulu, 'watumishi' ni pana na haibainishi vyeo ambavyo matini haivitaji.
- source_word: זִקְנֵי בֵיתוֹ
  choice: wazee wa nyumba yake
  rationale: '''Wazee'' inahifadhi זִקְנֵי, na ''nyumba yake'' inahifadhi בֵיתוֹ huku ikiruhusu maana ya jamaa ya kifalme au ikulu bila kuifungia katika tafsiri moja.'
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: na wazee wote wa nchi ya Misri
  rationale: Inahifadhi vipengele vya Kiebrania vya 'wazee,' 'wote,' na 'nchi ya Misri,' ikionyesha uongozi mpana zaidi ya nyumba ya Farao.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya 'akapanda/wakapanda' yamehifadhiwa ili kuonyesha mdundo wa simulizi na nahau ya kijiografia ya Kiebrania.
