base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: sw
  text: Siku arobaini zikatimia kwa ajili yake, kwa maana ndivyo siku za kutia maiti dawa zinavyotimia[b]. Watu wa Misri[a] wakamlilia kwa siku sabini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “Misri,” likimaanisha watu wa Misri kwa pamoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “siku za kutia maiti dawa hukamilishwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: Siku arobaini zikatimia kwa ajili yake
  rationale: Kitenzi מלא kinaonyesha kwamba kipindi kilichowekwa kilifikia mwisho. Kauli hii ya Kiswahili inaweka mkazo kwa muda uliotimia bila kutaja watendaji wasiotajwa katika Kiebrania.
- source_word: כִּי כֵּן
  choice: kwa maana ndivyo
  rationale: Hifadhi nguvu ya maelezo ya kishazi hiki kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: siku za kutia maiti dawa zinavyotimia
  rationale: Muktadha wa mstari uliotangulia unaonyesha mchakato wa kuhifadhi maiti. 'Kutia maiti dawa' ni usemi wa Kiswahili unaoeleweka na hauongezi dhana ya madhehebu.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: wakamlilia
  rationale: בכה humaanisha kulia; 'wakamlilia' ni Kiswahili asilia kinachohifadhi hisia bila kuifanya moja kwa moja kuwa ibada rasmi ya maombolezo.
- source_word: מִצְרַיִם
  choice: Watu wa Misri
  rationale: Jina la nchi limetumiwa kwa maana ya pamoja likiwakilisha watu wake. Kiswahili huhitaji usemi huu wa wazi ili upatanisho wa kisarufi uwe wa kawaida.
- source_word: שִׁבְעִים יוֹם
  choice: kwa siku sabini
  rationale: Hutoa muda wa kulia kwa mpangilio wa kawaida wa Kiswahili.
