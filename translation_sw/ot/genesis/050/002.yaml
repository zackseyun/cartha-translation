  text: וַ/יְצַ֨ו יוֹסֵ֤ף אֶת עֲבָדָי/ו֙ אֶת הָ/רֹ֣פְאִ֔ים לַ/חֲנֹ֖ט אֶת אָבִ֑י/ו וַ/יַּחַנְט֥וּ הָ/רֹפְאִ֖ים אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: sw
  text: Kisha Yosefu akawaamuru watumishi wake[a], madaktari, wampake baba yake dawa za kuhifadhi maiti; nao madaktari wakampaka Israeli[b] dawa za kuhifadhi maiti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumwa wake”; neno la Kiebrania linaweza kumaanisha watumishi au watumwa kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Israeli,” yaani Yakobo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kinaonyesha agizo linalotolewa kwa mamlaka; “akawaamuru” kinahifadhi uzito huo na kufaa katika mtiririko wa simulizi.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עבד inaweza kumaanisha mtumishi au mtumwa kulingana na muktadha. Hapa kazi yao katika nyumba au utawala wa Yosefu ndiyo inayosisitizwa, huku uwezekano wa maana ya “watumwa” ukihifadhiwa katika tanbihi.
- source_word: הָרֹפְאִים
  choice: waganga
  rationale: Neno hili linawataja watu wenye kazi ya kutibu. “Waganga” ni neno la kawaida na lenye hadhi katika Kiswahili, na hapa muktadha unaonyesha waganga wa ikulu, si waganga wa jadi kwa maana finyu.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: wautie … dawa ili usioze / wakautia … dawa ili usioze
  rationale: Katika muktadha wa Misri, חנט ni kuhifadhi maiti kwa kuitia dawa. Kauli hii inaeleweka kwa urahisi kuliko neno la kitaalamu, na marudio ya kitenzi katika Kiebrania yamehifadhiwa.
- source_word: אָבִיו
  choice: baba yake
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Andiko la Kiebrania linatumia jina Israeli, si Yakobo; jina hilo limehifadhiwa bila kulisawazisha kimya kimya.
theological_decisions:
- issue: Maana ya עבד katika mazingira ya watumishi wa nyumba
  choice: watumishi
  alternative: watumwa
  rationale: Mstari unalenga agizo la Yosefu kwa watu wa nyumbani mwake waliokuwa waganga, wala hausisitizi hadhi yao ya kisheria. “Watumishi” inafaa zaidi katika muktadha, huku “watumwa” ikitajwa kama uwezekano wa kileksika.
- issue: Kutofautisha majina Yakobo na Israeli
  choice: Israeli katika sehemu ya mwisho
  alternative: Yakobo
  rationale: Kwa kuwa Kiebrania kinabadilika kutoka “baba yake” hadi “Israeli,” tafsiri inahifadhi uchaguzi huo wa jina na kueleza utambulisho wake katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye hadhi. Kauli “kutia mwili dawa ili usioze” inaeleza kwa lugha ya kawaida tendo la kuhifadhi maiti lililofanywa Misri, na muundo unaorudia tendo hilo unaakisi marudio ya Kiebrania.
