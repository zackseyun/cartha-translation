base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: sw
  text: Wanawe walimbeba mpaka nchi ya Kanaani, wakamzika katika pango la shamba la Makpela, shamba ambalo Abrahamu alikuwa amenunua kutoka kwa Efroni, Mhiti, kuwa milki ya mahali pa kuzikia, mbele ya Mamre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikielekea Mamre.” Kifungu cha Kiebrania kinaonyesha mahali kwa kulinganisha na Mamre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ בָנָיו
  choice: Wanawe walimbeba
  rationale: Neno בָנָיו linamaanisha wazi “wanawe,” na נשׂא katika muktadha huu ni kuubeba au kuusafirisha mwili wa Yakobo.
- source_word: אַרְצָה כְּנַעַן
  choice: mpaka nchi ya Kanaani
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda Kanaani; “mpaka nchi ya Kanaani” ni Kiswahili cha kawaida kinachohifadhi wazo la mwendo na neno “nchi.”
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: katika pango la shamba la Makpela
  rationale: Tafsiri hii inahifadhi mfuatano wa nomino wa Kiebrania—pango, shamba, Makpela—bila kuufanya usemi kuwa mzito isivyohitajika.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: Abrahamu alikuwa amenunua shamba hilo
  rationale: Kiebrania kinatumia kishazi rejeshi chenye nomino ya yambwa iliyorudiwa. Sentensi mpya yenye “shamba hilo” inaonyesha kwa uwazi kwamba shamba ndilo lililonunuliwa, na huepuka kudokeza kwamba shamba lilikuwa njia ya malipo.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: ili liwe milki ya kuzikia
  rationale: אֲחֻזָּה ni milki au mali inayoshikiliwa, huku קֶבֶר ikibainisha matumizi yake kwa maziko. Usemi huu unahifadhi umiliki na kusudi la eneo hilo.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: kutoka kwa Efroni Mhiti
  rationale: Hii inataja muuzaji na utambulisho wake wa kikabila kwa lugha fupi na ya kawaida ya Kiswahili.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: mbele ya Mamre
  rationale: Usemi huu wa mahali unaweza kumaanisha mbele ya au kukabiliana na alama fulani ya mahali. “Mbele ya Mamre” hudumisha picha hiyo bila kuipunguza kuwa ukaribu tu.
