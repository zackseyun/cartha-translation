translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Basi sasa’ ni kiunganishi cha kawaida; ‘mimi mwenyewe’ huhifadhi msisitizo; na nahau ya mwisho imetafsiriwa kwa maana yake ya kawaida huku tafsiri halisi ikitolewa katika tanbihi.
