  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: sw
  text: “Basi sasa, msiogope. Mimi mwenyewe nitawatunza ninyi na watoto wenu wadogo.” Hivyo akawafariji, akasema nao kwa kuwatia moyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasema nao kwa upole” au “akawapa hakikisho”; kwa maana halisi ya nahau ya Kiebrania, “alisema juu ya mioyo yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huendeleza hitimisho la maneno ya Yusufu kwa kiunganishi cha kawaida, huku ikihifadhi wazo la ‘na/basi sasa.’
- source_word: אַל תִּירָאוּ
  choice: msiogope
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kutoa hakikisho kwa watu wengi.
- source_word: אָנֹכִי
  choice: Mimi mwenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi huru, yaani ahadi binafsi ya Yusufu.
- source_word: אֲכַלְכֵּל
  choice: nitawatunza
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwapatia mahitaji na kuwaendeleza, hasa kwa chakula; ‘kuwatunza’ ni cha asili na kinajumuisha utunzaji huo wa kudumu.
- source_word: טַפְּכֶם
  choice: watoto wenu wadogo
  rationale: Huhifadhi maana ya watoto wadogo badala ya kuitanua moja kwa moja kuwa wategemezi wote.
- source_word: וַיְנַחֵם אֹתָם
  choice: akawafariji
  rationale: Hutoa maana ya kuwapa faraja na hakikisho katika hofu yao.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: kusema nao kwa kuwatia moyo
  rationale: Huwasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania inayomaanisha kusema kwa upole na kwa kutia moyo, huku taswira halisi ikihifadhiwa katika tanbihi.
