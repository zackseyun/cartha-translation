translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Matini imetumia ‘wazao’ katika kishazi cha kwanza ili kueleza vizazi kwa kawaida, lakini ‘watoto’ katika kishazi cha pili ili kuhifadhi muundo wa ukoo. Nahau ya magoti imeachwa katika umbo lake halisi na kufafanuliwa katika tanbihi.
