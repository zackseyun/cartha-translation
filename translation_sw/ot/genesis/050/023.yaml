  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: sw
  text: Yosefu aliwaona wazao wa Efraimu hadi kizazi cha tatu.[a] Pia, watoto wa Makiri, mwana wa Manase, walizaliwa magotini mwa Yosefu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yosefu aliishi hadi akawaona wazao wa Efraimu hadi kizazi cha tatu.” Kiebrania kinasema kihalisi, “Yosefu aliona.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “walizaliwa magotini mwa Yosefu” ni nahau ya Kiebrania ambayo huenda ikadokeza kuwatambua kuwa wa familia, kuwapokea, au kuwakubali kwa namna ya pekee.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: aliwaona
  rationale: Huhifadhi maana ya moja kwa moja ya kitenzi ‘aliona’; katika muktadha huu pia hudokeza kwamba Yosefu aliishi muda wa kuwaona wazao hao.
- source_word: לְאֶפְרַיִם בְּנֵי שִׁלֵּשִׁים
  choice: wazao wa Efraimu hadi kizazi cha tatu
  rationale: ‘Wazao’ huwasilisha uhusiano wa ukoo kwa kawaida katika Kiswahili, na ‘hadi kizazi cha tatu’ huhifadhi upeo wa vizazi bila kubainisha uhusiano mahsusi kuliko Kiebrania.
- source_word: גַּם
  choice: Pia
  rationale: Huonyesha taarifa ya nyongeza iliyo sambamba na kishazi cha kwanza kwa lugha rahisi na ya kawaida.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: watoto wa Makiri mwana wa Manase
  rationale: ‘Watoto’ linaweza kuwakilisha maana pana ya בְּנֵי hapa, huku ‘mwana wa Manase’ ikimtambulisha Makiri.
- source_word: יֻלְּדוּ
  choice: walizaliwa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya umbo tendwa la ילד.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: juu ya magoti ya Yosefu
  rationale: Huhifadhi taswira halisi na utata wa nahau ya Kiebrania badala ya kuifasiri moja kwa moja katika matini kuu.
