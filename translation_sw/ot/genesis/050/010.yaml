id: GEN.50.10
reference: Genesis 50:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: sw
  text: Walipofika kwenye uwanja wa kupuria nafaka wa Atadi[a], ulioko ng’ambo ya Yordani[b], wakaomboleza huko kwa maombolezo makubwa na mazito sana[c]. Naye akafanya maombolezo kwa ajili ya baba yake kwa siku saba.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Atadi huenda linahusiana na neno linalomaanisha “kichaka cha miiba,” lakini hapa linatumika kama jina la mahali.
    reason: lexical_alternative
  - marker: b
    text: Au “upande wa pili wa Yordani.” Kirai cha Kiebrania hakisemi wazi ni upande gani unaokusudiwa.
    reason: alternative_reading
  - marker: c
    text: 'Kiebrania: “maombolezo makubwa na mazito sana”; usemi huu unaonyesha maombolezo makali mno.'
    reason: cultural_note
  - marker: d
    text: Kitenzi cha Kiebrania ni cha umoja, “akafanya maombolezo,” na huenda kinamrejelea Yosefu hasa. Tafsiri nyingine hutumia wingi, “wakafanya maombolezo.”
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן
  choice: uwanja wa kupuria nafaka
  rationale: Neno hili linamaanisha mahali pa kilimo palipotumiwa kupuria nafaka. Tafsiri hii ni wazi na ya kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: הָאָטָד
  choice: Atadi
  rationale: Katika kirai hiki neno hilo linafanya kazi kama jina la mahali. Limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili, huku maana yake ya kileksika ikielezwa katika tanbihi.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Huhifadhi mtazamo wa Kiebrania wa upande wa pili bila kuamua kimya kimya ni upande gani wa mto unaokusudiwa.
- source_word: וַיִּסְפְּדוּ
  choice: wakaomboleza
  rationale: Kitenzi hiki huonyesha maombolezo ya hadharani kwa ajili ya aliyekufa; ‘wakaomboleza’ ni cha asili na chenye hadhi katika muktadha huu.
- source_word: מִסְפֵּד גָּדוֹל וְכָבֵד מְאֹד
  choice: kwa maombolezo makubwa na mazito sana
  rationale: Tafsiri hii inadumisha urudiaji wa mzizi wa Kiebrania na taswira ya uzito, huku ikionyesha ukali mkubwa wa maombolezo.
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: akafanya maombolezo
  rationale: Muungano huu wa maneno humaanisha kuendesha au kushika kipindi cha maombolezo. ‘Akafanya maombolezo’ huhifadhi muundo wa kishazi bila kuwa mgumu kueleweka.
- source_word: לְאָבִיו
  choice: kwa ajili ya baba yake
  rationale: Huhifadhi kiambishi cha nafsi ya kiume umoja na uhusiano wake na mhusika anayetajwa kwa kitenzi cha umoja.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Hueleza kwa kawaida muda ambao maombolezo yalifanywa.
theological_decisions:
- issue: Mhusika wa kitenzi cha umoja וַיַּעַשׂ baada ya vitenzi vya wingi
  choice: Naye akafanya maombolezo kwa ajili ya baba yake
  alternative: Nao wakafanya maombolezo kwa ajili ya baba yao
  rationale: Maandishi ya Kimasora yanabadilika kutoka vitenzi vya wingi kwenda kitenzi cha kiume umoja. Tafsiri inadumisha umoja huo, ambao huenda unamrejelea Yosefu, bila kuingiza jina lake moja kwa moja mahali ambapo Kiebrania halijarudii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi wa ‘waka-’ na ‘aka-’ umetumiwa kudumisha mfuatano wa matendo na mabadiliko ya Kiebrania kutoka wingi kwenda umoja.
