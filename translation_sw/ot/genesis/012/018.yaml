  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: sw
  text: Ndipo Farao akamwita Abramu, akasema, “Ni nini hiki ulichonitendea? Kwa nini hukuniambia kwamba yeye ni mke wako?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: קרא ikifuatwa na לְ pamoja na mtu humaanisha kumwita au kumwagiza aje. “Akamwita” ni ya asili katika simulizi na haiongezi uzito wa “akamwagiza aitwe.”
- source_word: פַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha kifalme cha Misri.
- source_word: לְאַבְרָם
  choice: Abramu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: na kusema
  rationale: אמר ni kitenzi cha kawaida cha kusema. Muundo huu unaunganisha kwa ufasaha tendo la kumwita na maneno yanayofuata bila kubadili kitenzi kuwa “akauliza.”
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: Ni nini hiki ulichonitendea?
  rationale: Tafsiri hii inadumisha nguvu ya מַה זֹּאת (“ni nini hiki”) na malalamiko binafsi yaliyo katika לִּי (“uliyonitendea”).
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hili ndilo neno la kawaida na wazi la kuuliza sababu.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: hukuniambia
  rationale: Hiphil ya נגד hapa humaanisha kumwambia au kumjulisha mtu jambo; “hukuniambia” ni fupi, ya kawaida, na inadumisha yule anayepokea taarifa.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי hapa inaanzisha maudhui ya jambo ambalo Abramu hakumwambia Farao.
- source_word: אִשְׁתְּךָ הִוא
  choice: yeye ni mke wako
  rationale: Kishazi nomino cha Kiebrania kina kiwakilishi chenye msisitizo; “yeye ni mke wako” kinadumisha msisitizo huo kwa Kiswahili cha asili.
- source_word: וַ
  choice: Ndipo
  rationale: Waw ya kisimulizi inaendeleza mfuatano wa matukio; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha sasa.
