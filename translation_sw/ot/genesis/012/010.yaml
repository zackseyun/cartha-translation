  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Marudio ya “katika nchi” na taswira ya “akashuka” yamehifadhiwa kutoka Kiebrania; maana ya ukaaji wa muda kama mgeni imeelezwa kwa lugha inayoeleweka kwa wasomaji wa sasa.
