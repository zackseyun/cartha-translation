  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: sw
  text: Kulikuwa na njaa katika nchi, naye Abramu akashuka kwenda Misri kuishi huko kama mgeni[a], kwa sababu njaa ilikuwa kali katika nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akae huko kama mgeni.” Kitenzi cha Kiebrania kinaweza kumaanisha kuishi mahali ambapo mtu si mwenyeji, mara nyingi kwa muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Kulikuwa na
  rationale: Muundo huu unatambulisha tukio jipya katika simulizi. “Kulikuwa na” ni wa kawaida katika Kiswahili na hauongezi kiashiria cha wakati kisichokuwapo wazi katika Kiebrania.
- source_word: רָעָב
  choice: njaa
  rationale: Neno hili linamaanisha upungufu mkubwa wa chakula katika eneo, si hisia ya mtu binafsi ya kuwa na njaa.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Hapa אֶרֶץ ni nchi au eneo ambako Abramu alikuwa akiishi, si dunia yote. Marudio yake mwishoni mwa mstari yamehifadhiwa.
- source_word: וַיֵּרֶד
  choice: akashuka kwenda
  rationale: Kitenzi ירד humaanisha “kushuka.” Usemi huu umehifadhiwa kwa sababu unaeleza safari ya kwenda Misri na ni wa kawaida pia katika Kiswahili.
- source_word: מִצְרַיְמָה
  choice: kwenda Misri
  rationale: Kiambishi cha mwelekeo kinaonyesha mwendo kuelekea Misri; “kwenda Misri” ni Kiswahili cha asili.
- source_word: לָגוּר
  choice: ili aishi huko kwa muda kama mgeni
  rationale: גור humaanisha kuishi mahali kama mtu asiye mwenyeji, mara nyingi kwa muda. Tafsiri hii inaweka wazi vipengele vya ukaaji wa muda na hali ya ugeni bila kutumia neno la kizamani.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea Misri kwa njia ya kawaida katika Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatoa sababu ya Abramu kwenda Misri.
- source_word: כָבֵד
  choice: kali
  rationale: Ingawa maana ya msingi ni “nzito,” hapa neno hilo linaonyesha ukali wa njaa. “Kali” ni usemi wa kawaida na sahihi katika Kiswahili.
