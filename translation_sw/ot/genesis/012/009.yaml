  language: sw
  text: Abramu akaendelea na safari, akielekea Negebu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akielekea kusini.” Neno la Kiebrania linaweza kumaanisha eneo la kusini linaloitwa Negebu au mwelekeo wa kusini; hapa huenda linamaanisha eneo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: akaendelea na safari
  rationale: Kitenzi נסע hapa kinaonyesha kuvunja kambi na kusafiri kuendelea mbele. Kauli hii ya Kiswahili ni ya kawaida na inahifadhi mwendelezo wa simulizi bila kuongeza maelezo ya kambi.
- source_word: אַבְרָם
  choice: Abramu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: akaendelea na safari
  rationale: Muundo wa vitenzi unaonyesha mwendo unaoendelea. Maana hiyo imeunganishwa kwa kawaida katika kishazi kikuu, badala ya tafsiri ya neno kwa neno yenye uradidi usio wa kawaida katika Kiswahili.
- source_word: הַנֶּגְבָּה
  choice: akielekea Negebu
  rationale: Nomino נֶגֶב pamoja na kiambishi cha mwelekeo inaelekea kutaja eneo la kusini liitwalo Negebu, huku ikibeba wazo la kuelekea upande huo.
