  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: sw
  text: Lakini Yahweh akawapiga Farao na watu wa nyumba yake kwa mapigo makubwa[a] kwa sababu ya Sarai, mke wa Abramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamletea Farao na watu wa nyumba yake mateso makubwa.” Kiebrania kinatumia kitenzi chenye maana ya “kupiga/kutesa” pamoja na nomino inayoweza kumaanisha “mapigo,” “mateso,” au “tauni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: akampiga
  rationale: Kitenzi נגע katika muundo huu wa kisababishi, pamoja na nomino נְגָעִים, kinaonyesha kwamba Yahweh alimletea Farao madhara; “akampiga” huhifadhi taswira ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limeandikwa kwa matamshi “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: נְגָעִים גְּדֹלִים
  choice: mapigo makubwa
  rationale: “Mapigo” huhifadhi maana ya pigo, dhiki, au tauni, huku “makubwa” ikifuata kivumishi cha Kiebrania bila kuficha uzito wake.
- source_word: וְאֶת־בֵּיתוֹ
  choice: na watu wa nyumba yake
  rationale: Katika muktadha huu בַּיִת inarejelea jamaa na watumishi wa nyumbani kwa Farao, si jengo pekee; “watu wa nyumba yake” ni wazi na bado iko karibu na taswira ya chanzo.
- source_word: עַל־דְּבַר
  choice: kwa sababu ya
  rationale: Kirai hiki kinaonyesha sababu ya mapigo katika muktadha huu.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, mke wa Abramu
  rationale: Muundo wa maelezo unaomtambulisha Sarai kama mke wa Abramu umehifadhiwa kwa matumizi ya koma.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Kutumia “Yahweh” huhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Sababu ya mapigo na nafasi ya Sarai
  choice: kwa sababu ya Sarai, mke wa Abramu
  alternative: kwa ajili ya jambo la Sarai, mke wa Abramu
  rationale: עַל־דְּבַר hapa ina nguvu ya kisababishi. Tafsiri haiongezi dai kwamba Sarai alikuwa na hatia; inasema tu kuwa mapigo yalihusiana na hali iliyomhusu yeye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Watu wa nyumba yake” limetumiwa ili kuonyesha kaya ya Farao bila kulazimisha maana ya jengo, na uradidi wa Kiebrania wa kitenzi na nomino umehifadhiwa kwa namna inayoeleweka.
