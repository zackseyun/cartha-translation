lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi hiki kwa kawaida humaanisha kuamuru au kutoa maagizo; ‘akawaamuru’ ni cha kawaida na chenye nguvu inayofaa katika Kiswahili.
- source_word: עָלָיו
  choice: kuhusu Abramu
  rationale: Kihusishi hapa kinaonyesha kwamba maagizo yalitolewa kuhusiana naye. Jina ‘Abramu’ limetumiwa badala ya kiwakilishi ili sentensi iwe wazi.
- source_word: אֲנָשִׁים
  choice: watu wake
  rationale: Kiebrania kinasema kihalisi ‘watu/wanaume’; katika muktadha hawa ni watu wa Farao waliotekeleza agizo. ‘Watu wake’ ni Kiswahili cha kawaida bila kubainisha cheo chao.
- source_word: וַיְשַׁלְּחוּ
  choice: wakamsafirisha
  rationale: Katika muktadha huu, שלח ina maana ya kumwondoa au kumsindikiza aende. ‘Wakamsafirisha’ linaonyesha kuwa watu wa Farao walihakikisha anaondoka, bila kudai kwa uhakika kuwa walimsindikiza mpaka mahali fulani.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Hii ndiyo maana ya kawaida ya neno hili lenye kiambishi cha umilikaji katika muktadha wa ndoa.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: kila kitu alichokuwa nacho
  rationale: Kauli hii inajumuisha mali yote ya Abramu na inatafsiriwa kwa Kiswahili cha kawaida na wazi.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mtawala wa Misri.
