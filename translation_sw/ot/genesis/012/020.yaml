translation:
  language: sw
  text: Kisha Farao akawaagiza watu[a] kuhusu Abramu, nao wakamtuma aende pamoja na mke wake na kila alichokuwa nacho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wanaume”; nafasi au wajibu wao haujatajwa wazi.'
