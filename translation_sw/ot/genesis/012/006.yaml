base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: sw
  text: Abramu akapita katika nchi mpaka mahali pa Shekemu, hadi kwenye mti mkubwa wa More[a]. Wakati huo Wakanaani walikuwa katika nchi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linamaanisha mti mkubwa, lakini aina yake hasa haijulikani; wengine hutafsiri ‘mwaloni wa More’ au ‘mterebinthi wa More.’
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, ‘Mkanaani alikuwa wakati huo katika nchi.’ Kiebrania kinatumia jina la kabila katika umoja, ambalo hapa linaweza kuwakilisha Wakanaani kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: akapita katika
  rationale: Kitenzi hiki kinaeleza mwendo wa Abramu kupitia nchi bila kubainisha njia au namna ya safari.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Kirai chenye kibainishi kinarejelea nchi inayozungumziwa, yaani Kanaani; ‘katika nchi’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: עַד מְקוֹם שְׁכֶם
  choice: mpaka mahali pa Shekemu
  rationale: ‘Mpaka’ huhifadhi maana ya kufikia ukomo fulani, na ‘mahali pa Shekemu’ halidhanii kwamba mji wa baadaye ulikuwa tayari umestawi kikamilifu.
- source_word: אֵלוֹן מוֹרֶה
  choice: mti mkubwa wa More
  rationale: Aina kamili ya mti unaotajwa na אֵלוֹן haina uhakika. Tafsiri pana ‘mti mkubwa’ huepuka kuamua kimyakimya kati ya mwaloni na mterebinthi.
- source_word: מוֹרֶה
  choice: More
  rationale: Limetolewa kama jina la mahali badala ya kutafsiriwa kwa maana inayoweza kuwa ‘mwalimu’ au ‘mwaguzi,’ ambayo si hakika hapa.
- source_word: וְהַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa Kiebrania kina jina la kabila katika umoja wa kijumla, wingi ndio njia ya kawaida na isiyopotosha katika Kiswahili ya kurejelea jamii yote.
- source_word: אָז
  choice: wakati huo
  rationale: Huonyesha hali ya kihistoria iliyokuwapo wakati wa safari ya Abramu.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Marudio yamehifadhiwa ili kudumisha msisitizo na mshikamano wa simulizi.
theological_decisions:
- issue: Idadi ya jina la kabila katika וְהַכְּנַעֲנִי
  choice: 'Wingi wa kijumla: ‘Wakanaani walikuwa katika nchi’'
  alternative: 'Umoja unaofuata umbo la Kiebrania: ‘Mkanaani alikuwa katika nchi’'
  rationale: Umoja wa Kiebrania unaweza kuwakilisha jamii nzima. Katika Kiswahili, umoja ungeeleweka kwa urahisi kuwa mtu mmoja, hivyo wingi unawasilisha maana ya kijumla bila kuficha umbo la asili, ambalo limeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi. ‘Hadi kwenye’ katika sehemu ya pili huzuia marudio mazito ya ‘mpaka’ huku ikihifadhi matumizi mawili ya עַד. Majina ‘Abramu,’ ‘Shekemu,’ na ‘More’ yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
