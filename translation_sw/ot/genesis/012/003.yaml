  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: sw
  text: Nitawabariki wale wanaokubariki, na yule anayekudharau nitamlaani[a]; na ndani yako familia zote za dunia zitabarikiwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule anayekulaani.” Kitenzi cha Kiebrania hapa (קלל) kinaweza kumaanisha kumdharau, kutomheshimu, au kumlaani mtu, na ni dhaifu kuliko kitenzi kinachofuata, “nitamlaani” (ארר).
    reason: lexical_alternative
  - marker: b
    text: Au, “ndani yako familia zote za dunia zitataja jina lako zinapojibariki,” au “kupitia kwako familia zote za dunia zitabarikiwa.” Umbo la Kiebrania linaweza kueleweka kwa maana ya kutendwa au ya kujirejelea/ya kati, na kihusishi kinaweza pia kuonyesha njia inayotumiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: Nitawabariki
  rationale: Kitenzi cha nafsi ya kwanza umoja kinaonyesha ahadi ya Mungu ya wakati ujao; umbo la Kiswahili pia linapatana na watendewa walio wengi katika kishazi kinachofuata.
- source_word: מְבָרְכֶיךָ
  choice: wale wanaokubariki
  rationale: Kivumishi-tendo cha wingi kimetumiwa kama nomino; tafsiri hii ni ya kawaida na inadumisha wingi wa Kiebrania.
- source_word: וּמְקַלֶּלְךָ
  choice: yule anayekudharau
  rationale: קלל inaweza kumaanisha kumfanya mtu kuwa hafifu, kutomheshimu, au kumlaani. ‘Anayekudharau’ inadumisha tofauti ya uzito kati ya tendo hili la mwanadamu na אָאֹר, neno lenye nguvu zaidi linalotaja laana ya Mungu; ‘yule’ pia inadumisha umoja wa Kiebrania.
- source_word: אָאֹר
  choice: nitamlaani
  rationale: ארר ni kitenzi chenye nguvu na cha moja kwa moja cha kuweka chini ya laana; ‘nitamlaani’ ni Kiswahili wazi na cha asili.
- source_word: וְנִבְרְכוּ
  choice: zitabarikiwa
  rationale: Nifali ya ברך imetafsiriwa kwa maana ya kutendwa, ambayo ndiyo usomaji wa moja kwa moja hapa. Maana ya kujirejelea imehifadhiwa katika tanbihi kwa sababu umbo hilo linaweza kujadiliwa kwa njia zote mbili.
- source_word: בְּךָ
  choice: katika wewe
  rationale: Tafsiri hii inadumisha maana ya msingi ya kihusishi ב bila kuamua kimya kimya ikiwa maana yake hasa ni hali/mahali pa baraka au njia inayotumiwa; ‘kupitia kwako’ imewekwa kama uwezekano katika tanbihi.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: jamaa zote za dunia
  rationale: מִשְׁפְּחֹת hurejelea vikundi vya kifamilia au koo, na ‘jamaa’ ni neno linaloeleweka na lenye upana huo. ‘Dunia’ linaonyesha upeo wa jumla wa הָאֲדָמָה katika ahadi hii.
theological_decisions:
- issue: Maana ya kauli ya ahadi וְנִבְרְכוּ בְךָ
  choice: 'Maana ya kutendwa: ‘katika wewe ... zitabarikiwa’'
  alternative: 'Maana ya kujirejelea: ‘kwa wewe ... zitajibariki’; au maana ya njia: ‘kupitia kwako ... zitabarikiwa’'
  rationale: Nifali inaweza kueleweka kama kutendwa au kujirejelea/ya kati, na kihusishi ב kinaweza kuonyesha hali au njia. Matini kuu inatumia usomaji wa moja kwa moja wa kutendwa, huku tanbihi ikihifadhi uwezekano mwingine bila kulazimisha hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa wasomaji wa kawaida, huku umoja na wingi wa Kiebrania, tofauti kati ya kudharau na kulaani, na utata wa kauli ya mwisho vikidumishwa.
