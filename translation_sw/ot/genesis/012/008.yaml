  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: sw
  text: Kutoka huko alihamia katika nchi ya vilima mashariki mwa Betheli, akapiga hema lake, Betheli ikiwa upande wa magharibi na Ai upande wa mashariki. Huko akajenga madhabahu kwa ajili ya Yahwe[b], akaliitia jina la Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akalitangaza jina la Yahwe.” Usemi wa Kiebrania unaweza kumaanisha kumwita Yahwe katika ibada au kulitangaza jina lake hadharani.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: alihamia
  rationale: Kitenzi hiki kinaonyesha kuondoka mahali pamoja na kuhamia pengine; “alihamia” ni Kiswahili cha kawaida kinachohifadhi mwendo wa simulizi.
- source_word: הָהָרָה
  choice: katika nchi ya vilima
  rationale: Kiambishi cha mwelekeo kinaonyesha kwenda kwenye eneo la milima; katika muktadha huu si lazima kiwe kilima au mlima mmoja tu.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: mashariki mwa Betheli
  rationale: קֶדֶם hapa ni maelezo ya kijiografia yanayoonyesha eneo lililokuwa upande wa mashariki wa Betheli.
- source_word: וַיֵּט אָהֳלֹה
  choice: akapiga hema lake
  rationale: “Kupiga hema” ni nahau ya kawaida ya Kiswahili kwa kusimamisha au kutandaza hema.
- source_word: מִיָּם
  choice: upande wa magharibi
  rationale: Ingawa יָם humaanisha pia “bahari,” hapa ni neno la mwelekeo linalomaanisha magharibi.
- source_word: וְהָעַי מִקֶּדֶם
  choice: na Ai upande wa mashariki
  rationale: Tafsiri hii inaonyesha kwa uwazi kwamba kambi ilikuwa kati ya Betheli na Ai.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali au jengo la kutolea dhabihu katika ibada.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo “BWANA.” Umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: akaliitia jina la Yahwe
  rationale: Nahau hii ya Kiswahili inadokeza kumwita Yahwe katika ibada na haifuti kabisa uwezekano wa kutangaza jina lake.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi kama jina, huku tanbihi ikieleza desturi ya kulitafsiri kwa cheo.
- issue: Maana ya וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: akaliitia jina la Yahwe
  alternative: akalitangaza jina la Yahwe
  rationale: Katika muktadha wa kujenga madhabahu, kumwita Yahwe katika ibada ndiyo maana inayojitokeza zaidi; hata hivyo, Kiebrania kinaweza pia kumaanisha kutangaza jina lake, kwa hiyo maana hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa lakini wa heshima. Majina ya mahali yametolewa kama Betheli na Ai; “nchi ya vilima” linaonyesha eneo pana, na “akapiga hema” ni usemi wa kawaida unaoeleweka kwa wasomaji wengi.
