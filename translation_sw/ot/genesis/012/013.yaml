  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: sw
  text: Tafadhali sema kwamba wewe ni dada yangu, ili mambo yaniendee vyema kwa sababu yako[a], nami nibaki hai[b] kwa ajili yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misemo miwili ya Kiebrania iliyotafsiriwa “kwa sababu yako” na “kwa ajili yako” inakaribiana sana kimaana. Yote miwili inasisitiza kwamba Abramu alitarajia usalama na hali njema kutokana na uhusiano ambao Sarai angedai kuwa nao kwake.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “na nafsi yangu iishi.” Hapa “nafsi” (nephesh) ni nahau inayomaanisha maisha ya Abramu au Abramu mwenyewe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Tafadhali sema
  rationale: Kitenzi cha amri cha kike katika umoja pamoja na נָא huwasilisha ombi la kusisitiza kwa upole; “Tafadhali sema” ni Kiswahili cha kawaida na cha heshima.
- source_word: אֲחֹתִי אָתְּ
  choice: kwamba wewe ni dada yangu
  rationale: Hutambulisha Sarai kuwa dada ya Abramu; “kwamba” huongezwa kwa mtiririko wa kawaida wa Kiswahili baada ya kitenzi “sema.”
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa; “ili” huhifadhi maana hiyo kwa ufupi na kwa kawaida.
- source_word: יִיטַב לִי
  choice: mambo yaniendee vyema
  rationale: Nahau hii ina maana pana ya hali kuwa njema kwa Abramu. Tafsiri hii ni ya kawaida katika Kiswahili na haibainishi kupita kiasi namna ambayo angenufaika.
- source_word: בַּעֲבוּרֵךְ
  choice: kwa sababu yako
  rationale: 'Huonyesha sababu au kisababishi: Abramu anatarajia hali yake kuwa njema kutokana na uhusiano ambao Sarai atadai kuwa nao kwake.'
- source_word: וְחָיְתָה נַפְשִׁי
  choice: nami nibaki hai
  rationale: Ingawa נֶפֶשׁ kwa neno halisi ni “nafsi,” hapa humaanisha maisha au mtu mwenyewe. “Nibaki hai” huwasilisha nahau hiyo kwa Kiswahili cha kawaida.
- source_word: בִּגְלָלֵךְ
  choice: kwa ajili yako
  rationale: Ni usemi wa pili wa kisababishi, unaokaribiana na בַּעֲבוּרֵךְ. Tafsiri hii huhifadhi urudiaji wa maana bila kurudia maneno yaleyale.
