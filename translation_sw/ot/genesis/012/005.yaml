  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: sw
  text: Abramu akamchukua Sarai, mke wake, na Loti, mwana wa ndugu yake, pamoja na mali zao zote walizokuwa wamejipatia, na watu waliowapata[a] huko Harani. Wakaondoka kwenda katika nchi ya Kanaani, wakafika katika nchi ya Kanaani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu waliowakusanya”; kihalisi, “nafsi walizozifanya.” Inaelekea usemi huu wa Kiebrania unamaanisha watu wa nyumba waliowapata au waliowakusanya huko Harani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukua ... pamoja na
  rationale: Kitenzi לקח katika simulizi kina maana ya kuchukua; muundo wa Kiswahili unaweka wazi kwamba Abramu aliwachukua waandamane naye.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Katika muktadha wa ndoa, אשה yenye kiambishi cha umilikaji humaanisha wazi ‘mke wake.’
- source_word: בֶּן אָחִיו
  choice: mwana wa ndugu yake
  rationale: Huhifadhi kwa uwazi usemi halisi wa Kiebrania kuliko neno pana ‘mpwa wake.’
- source_word: כָּל רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: mali zao zote walizokuwa wamejipatia
  rationale: רכוש ni mali au vitu vinavyomilikiwa, na רכש ni kuvipata; ‘walizokuwa wamejipatia’ ni Kiswahili cha kawaida kinachoonyesha tendo lililotangulia safari.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: watu waliokuwa wamewapata
  rationale: נפש hapa humaanisha watu, si nafsi zisizo na mwili; עשה katika usemi huu inaelekea kumaanisha kupata au kujikusanyia watu wa nyumba, ingawa usemi huo una utata unaohifadhiwa katika tanbihi.
- source_word: בְחָרָן
  choice: huko Harani
  rationale: ‘Huko’ ni alama ya mahali ya kawaida katika Kiswahili, na Harani ni umbo la jina linalotumika katika mapokeo ya Kiswahili.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: wakaondoka kwenda
  rationale: Huwasilisha kwa Kiswahili cha kawaida kuondoka kwa kusudi la kwenda mahali fulani.
- source_word: אַרְצָה כְּנַעַן
  choice: katika nchi ya Kanaani
  rationale: Kiishio elekezi cha ארצה kinaonyesha mwendo kuelekea nchi ya Kanaani; baada ya ‘kwenda,’ ‘katika nchi ya’ ni muundo wa kawaida wa Kiswahili.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: nao wakafika katika nchi ya Kanaani
  rationale: Huhifadhi marudio ya mahali walikokusudia na walikofika, kama yalivyo katika Kiebrania.
theological_decisions:
- issue: Maana ya הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: watu waliokuwa wamewapata
  alternative: watu waliokuwa wamewakusanya; kihalisi, nafsi walizokuwa wamefanya
  rationale: Tafsiri haifanyi usemi huo kuwa fundisho la kuumba nafsi wala haitaji kwa uhakika hadhi ya watu hao kuwa watumwa; inatumia maana pana na kuacha ugumu wa nahau uonekane katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘nchi ya Kanaani’ yamehifadhiwa kwa sababu yapo katika matini ya Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya usemi unaohitaji ufafanuzi.
