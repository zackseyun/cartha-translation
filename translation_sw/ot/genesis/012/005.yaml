  source_fidelity: 'Tafsiri kwa jumla inafuata vizuri mpangilio na marudio ya matini ya Kiebrania: Sarai, Loti, mali, watu wa Harani, kuondoka kuelekea Kanaani, na kufika Kanaani. Hata hivyo, “watu waliokuwa wamewapata” si usemi ulio wazi sana katika Kiswahili na unaweza kusikika kana kwamba ‘watu’ ndio waliopata wengine; muundo wa moja kwa moja wa uhusiano unafaa zaidi. Maana ya nahau הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ ibaki pana, bila kubainisha hadhi ya watu hao.'
