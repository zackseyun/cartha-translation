base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: sw
  text: Basi Abramu akaenda kama Yahweh alivyomwambia, naye Loti akaenda pamoja naye. Abramu alikuwa na umri wa miaka sabini na mitano alipoondoka kutoka Harani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Wayyiqtol ya הלך inaendeleza simulizi kwa kitendo rahisi cha kwenda; “akaenda” ni ya kawaida na ya asili katika masimulizi ya Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Inaonyesha kwamba tendo la Abramu lililingana na yale Yahweh aliyomwambia, bila kuongeza maelezo ya kiufafanuzi.
- source_word: דִּבֶּר אֵלָיו
  choice: alivyokuwa amemwambia
  rationale: Muundo huu unaonyesha kuwa kusema kulitangulia kwenda kwa Abramu; “amemwambia” ni wa asili zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ya “amesema naye.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Tetragramatoni limeandikwa kwa unukuzi ili kuhifadhi matumizi ya jina binafsi badala ya kulibadili kuwa cheo.
- source_word: אִתּוֹ
  choice: pamoja naye
  rationale: Ni tafsiri ya kawaida na wazi ya kihusishi chenye kiambishi cha nafsi.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: alikuwa na umri wa miaka sabini na mitano
  rationale: Huu ni usemi wa sasa na wa kawaida wa Kiswahili wa kutaja umri, ukiwasilisha maana ya nahau ya Kiebrania bila ugumu wa muundo wake halisi.
- source_word: בְּצֵאתוֹ
  choice: alipoondoka
  rationale: Infinitivu yenye ב inaonyesha wakati wa kuondoka; “alipoondoka” ni fupi, sahihi, na ya asili.
- source_word: מֵחָרָן
  choice: Harani
  rationale: Katika Kiswahili, kitenzi “kuondoka” kinaweza kutaja mahali moja kwa moja bila “kutoka”; jina la mahali limewasilishwa kwa umbo la Kiswahili “Harani.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Andiko la Kiebrania linatumia jina יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi la Mungu na halibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Mtindo wa simulizi umetumia mfululizo wa “akaenda,” huku sentensi ya umri ikitolewa kwa namna rahisi kueleweka. Hakuna tanbihi zinazohitajika.
