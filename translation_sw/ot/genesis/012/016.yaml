base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: sw
  text: Naye akamtendea Abramu mema kwa sababu ya Sarai[a], naye Abramu akaja kuwa na kondoo na ng’ombe, punda wa kiume, watumwa wa kiume na wa kike, punda wa kike, na ngamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya Sarai.” Usemi wa Kiebrania unaweza kutafsiriwa kwa namna yoyote kati ya hizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: akamtendea Abramu mema
  rationale: Hifili ya יטב hapa ina maana ya kumfanyia mtu mema au kumtendea vizuri; usemi huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: בַּעֲבוּרָהּ
  choice: kwa sababu yake
  rationale: Kirai hiki kinaonyesha sababu au kilichosababisha tendo, bila kulazimisha maana ya kwamba lilifanywa kwa faida yake.
- source_word: וַיְהִי לוֹ
  choice: Abramu akapata
  rationale: Nahau hii inaonyesha matokeo ya kupata au kuja kumiliki vitu hivyo; kurudia jina Abramu huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: צֹאן
  choice: kondoo
  rationale: Neno hili ni la mkusanyiko wa mifugo midogo; hapa ‘kondoo’ ni tafsiri ya kawaida inayofaa orodha hii, ingawa neno la Kiebrania linaweza kuwajumuisha pia mbuzi.
- source_word: בָקָר
  choice: ng’ombe
  rationale: Ni neno la mkusanyiko linalotaja mifugo ya jamii ya bovini; ‘ng’ombe’ ndiyo sawa ya kawaida ya Kiswahili.
- source_word: חֲמֹרִים
  choice: punda wa kiume
  rationale: Wingi wa kiume unadumisha tofauti na אֲתֹנֹת, punda wa kike, inayotajwa baadaye.
- source_word: עֲבָדִים
  choice: watumwa wa kiume
  rationale: Katika orodha ya mali, hadhi ya utumwa ni muhimu; ‘watumwa’ ni sahihi zaidi kijamii na kihistoria kuliko ‘watumishi,’ na jinsia imetajwa ili kudumisha ulinganifu na neno linalofuata.
- source_word: שְׁפָחֹת
  choice: watumwa wa kike
  rationale: Neno hili hutaja wanawake waliokuwa watumwa; tafsiri hii inaonyesha jinsia na hali yao ya kijamii bila kuipunguza kuwa utumishi wa kawaida.
- source_word: אֲתֹנֹת
  choice: punda wa kike
  rationale: Neno hili linataja hasa punda jike, hivyo tofauti ya jinsia imehifadhiwa.
- source_word: גְמַלִּים
  choice: ngamia
  rationale: Hii ndiyo tafsiri ya kawaida ya nomino hii ya wingi katika Kiswahili.
theological_decisions: []
