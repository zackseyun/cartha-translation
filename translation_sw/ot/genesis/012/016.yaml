  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wa kawaida kwa wasomaji wa leo, huku tofauti za jinsia za punda na watumwa pamoja na maana ya kupata mali zikihifadhiwa.
