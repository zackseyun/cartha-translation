  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: sw
  text: Abramu alipoingia Misri, Wamisri wakaona kwamba mwanamke huyo[a] alikuwa mrembo sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mke.” Neno la Kiebrania אִשָּׁה linaweza kumaanisha “mwanamke” au “mke”; hapa tafsiri imehifadhi usemi mpana zaidi wa kifungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: alipoingia
  rationale: Muundo huu unaanzisha tukio linalofuata na hali ya wakati. Katika Kiswahili, ‘alipoingia’ ni ya asili na inawasilisha maana ya ‘wakati Abramu alipoingia’ bila kutumia kauli nzito isiyo ya lazima.
- source_word: מִצְרָיְמָה
  choice: Misri
  rationale: He ya mwelekeo inaonyesha mwendo kuelekea Misri; katika Kiswahili maana hiyo imejumuishwa kwa kawaida katika kitenzi ‘kuingia’.
- source_word: וַיִּרְאוּ
  choice: walimwona
  rationale: Kitenzi ראה hapa kina maana ya moja kwa moja ya kuona. ‘Walimwona’ hudumisha maana hiyo bila kuongeza wazo la kumtazama kwa makusudi au kumtambua ghafla.
- source_word: הַמִּצְרִים
  choice: Wamisri
  rationale: Ni jina la watu la wingi lenye uainisho; ‘Wamisri’ ndilo neno la kawaida la Kiswahili.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: אִשָּׁה inaweza kumaanisha ‘mwanamke’ au ‘mke.’ Hapa ‘yule mwanamke’ huhifadhi usemi mpana wa kifungu na kurejelea Sarai anayejulikana katika muktadha.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי hapa inaanzisha maudhui ya walichokiona; ‘kwamba’ inadumisha muundo huo waziwazi katika Kiswahili.
- source_word: יָפָה
  choice: mrembo
  rationale: Kivumishi hiki kinaonyesha uzuri wa sura. ‘Mrembo’ ni neno la sasa, la kawaida na lenye heshima katika Kiswahili.
- source_word: הִוא
  choice: alikuwa
  rationale: Kiwakilishi huru cha Kiebrania kinawakilishwa kwa kawaida katika Kiswahili na upatanisho wa nafsi katika ‘alikuwa,’ bila kulazimika kurudia ‘yeye.’
- source_word: מְאֹד
  choice: sana
  rationale: Kielezi hiki kinatilia nguvu kivumishi; ‘sana’ ndiyo tafsiri ya kawaida na ya asili.
