  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: sw
  text: Ikawa alipokaribia kuingia Misri, akamwambia Sarai mke wake, “Tazama sasa,[a] najua kwamba wewe ni mwanamke mwenye sura nzuri.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama, tafadhali.”
    reason: הִנֵּה נָא ni mwito wa kuvuta fikira wenye chembe ya kusihi au kulainisha kauli; “Tazama sasa” ni ya asili zaidi katika muktadha huu.
  - marker: b
    text: Au, “mzuri wa kuonekana.”
    reason: יְפַת מַרְאֶה hueleza uzuri wa mwonekano; tafsiri hii mbadala hufuata muundo wa Kiebrania kwa ukaribu zaidi.
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya usimulizi inayoendeleza tukio linalofuata; “Ikawa” huhifadhi kazi hiyo bila kutumia lugha nzito au ya kizamani kupita kiasi.
- source_word: כַּאֲשֶׁר
  choice: alipo-
  rationale: Kiunganishi hiki kina maana ya wakati hapa; muundo wa Kiswahili “alipokaribia” unaunganisha hali ya wakati kwa kawaida.
- source_word: הִקְרִיב לָבוֹא
  choice: alipokaribia kuingia
  rationale: Hifili ya קרב pamoja na kitenzi-jina בוא huonyesha kusogea karibu kwa kusudi la kuingia; tafsiri hii huhifadhi ukaribu na tendo lililokuwa karibu kutokea.
- source_word: מִצְרָיְמָה
  choice: Misri
  rationale: Kiishio cha kuelekea mahali kinaeleweka katika kitenzi “kuingia,” hivyo jina la mahali linatafsiriwa kwa namna ya kawaida ya Kiswahili.
- source_word: וַיֹּאמֶר אֶל
  choice: akamwambia
  rationale: Huu ni utangulizi wa kawaida wa usemi; “akamwambia” huonyesha mwendelezo wa simulizi na mtu aliyeelekezewa maneno.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: Sarai mke wake
  rationale: Huhifadhi mpangilio wa Kiebrania, ambapo “mke wake” inamtambulisha Sarai.
- source_word: הִנֵּה נָא
  choice: Tazama, tafadhali
  rationale: “Tazama” ni ishara ya kuvuta fikira, na “tafadhali” huhifadhi nguvu ya chembe נָא ya kusihi au kulainisha kauli. Muundo huo pia huhifadhi mkazo wa mazungumzo.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kauli timilifu ya ידע hapa inaeleza hali ya sasa ya kuwa na maarifa; “najua” ni ya kawaida na sahihi.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha maudhui ya jambo ambalo Abramu analijua.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: Hapa neno humweleza Sarai kama mwanamke, si hasa katika nafasi yake ya kuwa mke, ambayo tayari imetajwa.
- source_word: יְפַת מַרְאֶה
  choice: mwenye sura nzuri
  rationale: Kirai hiki huonyesha uzuri unaoonekana. “Mwenye sura nzuri” ni cha asili katika Kiswahili na hubaki karibu na maana ya chanzo.
- source_word: אָתְּ
  choice: wewe ni
  rationale: Kiwakilishi huru cha nafsi ya pili ya kike kinasisitiza mhusika; “wewe ni” huhifadhi uwazi na kiwango fulani cha mkazo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. “Ikawa” huhifadhi fomula ya usimulizi, huku “alipokaribia kuingia” na “akamwambia” vikifanya sentensi itiririke kwa kawaida. Alama zote za tanbihi zimewekwa mahali panapohusika katika matini.
