base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: sw
  text: Ndipo Yahweh akamtokea Abramu, akamwambia, “Nitaupa uzao wako[a] nchi hii.” Huko akajenga madhabahu kwa Yahweh, aliyemtokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbegu yako.” Neno la Kiebrania liko katika umbo la umoja na linaweza kutumiwa kwa maana ya kijumla, likirejelea uzao kama kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa kunukuu matamshi yake badala ya kulibadilisha na cheo kama ‘BWANA’.
- source_word: וַיֵּרָא
  choice: akamtokea
  rationale: Niphal ya ראה hapa inaeleza Yahwe kujidhihirisha kwa Abramu; ‘akamtokea’ ni lugha ya kawaida na sahihi katika simulizi.
- source_word: לְזַרְעֲךָ
  choice: uzao wako
  rationale: זֶרַע iko katika umbo la umoja lakini inaweza kuwa na maana ya kijumla. ‘Uzao wako’ huhifadhi maana hiyo bila kuamua kimya kimya kuwa ni mtu mmoja tu au wazao wengi tu.
- source_word: אֶתֵּן
  choice: Nitaupa
  rationale: Kauli hii ina nguvu ya ahadi ya wakati ujao. Kiambishi cha yambwa ‘-u-’ kinarejelea ‘uzao wako’ kama mpokeaji.
- source_word: הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: Katika muktadha huu אֶרֶץ ni eneo la nchi lililoahidiwa, si dunia yote wala dola ya kisiasa.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Basi akamjengea ... madhabahu huko
  rationale: Muundo huu unaendeleza mfuatano wa simulizi, unahifadhi mahali ‘huko,’ na kitenzi cha kutendea kinaonyesha madhabahu ilijengwa kwa ajili ya Yahwe.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: yeye aliyekuwa amemtokea
  rationale: Kirai cha Kiebrania kinamtambulisha Yahwe kuwa ndiye aliyemtokea Abramu kabla ya ujenzi wa madhabahu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ina jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Maana ya kijumla ya זֶרַע katika ahadi
  choice: uzao wako
  alternative: mbegu yako; wazao wako
  rationale: ‘Uzao’ hufaa kwa umbo la umoja lenye maana inayoweza kuwa ya kijumla, hivyo haiifungi ahadi mapema kwa mhusika mmoja wala kwa kundi tu.
- issue: Uhusiano wa madhabahu na Yahwe katika לַיהוָה
  choice: akamjengea Yahwe madhabahu
  alternative: akamjenga Yahwe madhabahu; akajenga madhabahu kwa ajili ya Yahwe
  rationale: Kitenzi cha kutendea kinaonyesha kwa kawaida kwamba madhabahu iliwekwa wakfu kwa Yahwe, bila kuongeza maelezo ya kiibada yasiyomo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘akamjengea Yahwe madhabahu’ ni wa kawaida katika lugha ya kibiblia lakini bado unaeleweka kwa wasomaji wa leo. Alama ya tanbihi imewekwa moja kwa moja baada ya ‘uzao wako,’ neno linalofafanuliwa.
