  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu mfuatano wa Kiebrania: hali inayotarajiwa Wamisri watakapomwona Sarai, kauli yao ya kumtambua kuwa mke wa Abramu, tishio la kumuua Abramu, na tofauti ya kumwacha Sarai hai. “Watakuacha hai” ni uwasilishaji sahihi wa Hifili ya חיה katika muktadha huu.'
