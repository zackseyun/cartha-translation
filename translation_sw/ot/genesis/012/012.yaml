  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: sw
  text: Na itatokea kwamba Wamisri watakapokuona, watasema, “Huyu ni mke wake.” Kisha wataniua, lakini wewe watakuacha hai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na itatokea kwamba ... watakapokuona
  rationale: Muundo huu unaendeleza simulizi na kuhifadhi maana ya kutazamia jambo litakalotokea; kiambishi cha wakati katika “watakapokuona” kinawakilisha vizuri matumizi ya כִּי katika muktadha huu.
- source_word: יִרְאוּ אֹתָךְ
  choice: watakapokuona
  rationale: ראה hapa ni kuona kwa maana ya kawaida; umbo la wakati linaonyesha hali Abramu anayoitarajia.
- source_word: הַמִּצְרִים
  choice: Wamisri
  rationale: Hili ndilo jina la kawaida la watu wa Misri katika Kiswahili Sanifu.
- source_word: וְאָמְרוּ
  choice: watasema
  rationale: Tafsiri ya moja kwa moja ya kitenzi cha kusema katika mfuatano wa wakati ujao.
- source_word: אִשְׁתּוֹ זֹאת
  choice: Huyu ni mke wake
  rationale: Inahifadhi nguvu ya kiashiria זאת na kutoa utambulisho huo kwa Kiswahili cha kawaida.
- source_word: וְהָרְגוּ אֹתִי
  choice: wataniua
  rationale: הרג humaanisha kuua; “wataniua” ni tafsiri ya moja kwa moja bila kuongeza wazo la mauaji ya jinai ambalo halijaelezwa wazi na neno lenyewe.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: lakini wewe watakuacha hai
  rationale: Hifili ya חיה ina maana ya kumwacha au kumweka mtu hai. “Lakini” inaonyesha utofautishaji uliodokezwa kati ya kumuua Abramu na kumwacha Sarai hai, huku “wewe” ikihifadhi msisitizo wa אֹתָךְ.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha hali ya Abramu ya kutazamia kitakachotokea na tofauti kati ya kuuawa kwake na Sarai kuachwa hai. Hakuna tanbihi iliyohitajika; tanbihi za safu ya mashauriano ya Kiingereza zilionekana kuhusishwa na viashiria visivyolingana na sehemu husika za sentensi.
