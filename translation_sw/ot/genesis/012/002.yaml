  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: sw
  text: Nitakufanya kuwa taifa kubwa, nitakubariki, na nitalikuza jina lako; nawe uwe baraka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nawe utakuwa baraka.” Ingawa umbo la Kiebrania ni amri (“uwe”), wengine hulielewa kuwa linaonyesha matokeo ya ahadi za Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ
  choice: Nitakufanya kuwa
  rationale: Kitenzi עשה pamoja na kiambishi cha yambwa hapa kina maana ya kumfanya Abramu awe kitu fulani; ‘nitakufanya kuwa’ huunganika kwa kawaida na ‘taifa kubwa’ katika Kiswahili.
- source_word: לְגוֹי גָּדוֹל
  choice: taifa kubwa
  rationale: גוי humaanisha taifa au jamii ya watu. ‘Taifa’ linafaa katika muktadha wa ahadi kwa mababu, na ‘kuwa’ linawakilisha kazi ya kihusishi ל baada ya ‘nitakufanya.’
- source_word: וַאֲבָרֶכְךָ
  choice: nitakubariki
  rationale: ברך katika piel humaanisha ‘bariki’; kiambishi ‘-ku-’ kinadumisha kwamba ahadi hii inaelekezwa kwa Abramu binafsi.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: nitalikuza jina lako
  rationale: גדל hapa ni kufanya kuwa kubwa au kuu. ‘Kulikuza jina’ ni usemi wa kawaida wa Kiswahili unaodumisha neno ‘jina’ na pia wazo la kuongeza hadhi au sifa.
- source_word: וֶהְיֵה
  choice: nawe uwe
  rationale: Hii ni hali ya kuamuru, nafsi ya pili umoja wa kiume, ya היה. ‘Uwe’ inadumisha nguvu ya amri, huku ‘nawe’ ikiwakilisha kiunganishi na kuonyesha mgeuko kutoka ahadi za Mungu kwenda wito wa Abramu.
- source_word: בְּרָכָה
  choice: baraka
  rationale: Nomino hii humaanisha ‘baraka.’ Katika Kiswahili, ‘uwe baraka’ ni usemi wa asili na hauhitaji kibainishi kisichokuwapo katika lugha.
theological_decisions:
- issue: Nguvu ya וֶהְיֵה בְּרָכָה
  choice: 'amri: ‘nawe uwe baraka’'
  alternative: 'matokeo au utabiri: ‘nawe utakuwa baraka’'
  rationale: Umbo la Kiebrania ni amri, kwa hiyo matini kuu inadumisha mgeuko huo badala ya kuugeuza kimya kuwa utabiri. Hata hivyo, kwa kuwa kifungu hiki kinafuata mfululizo wa ahadi za Mungu, tafsiri ya kimatokeo imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unabaki wazi kwa wasomaji wa kawaida; semikoloni inaonyesha mgeuko wa balagha kutoka ahadi za Mungu kwenda amri kwa Abramu bila kuvunja kiunganishi cha Kiebrania.
