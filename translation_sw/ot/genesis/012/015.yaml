  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: sw
  text: Maofisa wa Farao walipomwona, wakamsifu kwa Farao[a], naye yule mwanamke akachukuliwa hadi nyumba ya Farao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimsemea mema kwa Farao.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “nyumba” linaweza pia kumaanisha makao au kaya ya kifalme ya Farao, si jengo tu.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: Maofisa wa Farao
  rationale: Katika muktadha wa ikulu, שָׂרִים humaanisha watawala, wakuu au maofisa. “Maofisa” ni Kiswahili cha sasa kinachoonyesha cheo chao bila kudokeza kwamba walikuwa wana wa kifalme.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: walimsifu mbele ya Farao
  rationale: Piel ya הלל hapa ina maana ya kusifu au kusema mema juu ya mtu. “Walimsifu mbele ya Farao” ni ya asili katika Kiswahili na inaonyesha kwamba walimweleza Farao habari zake kwa sifa.
- source_word: וַתֻּקַּח
  choice: akachukuliwa na kuingizwa
  rationale: Kauli ya kutendwa imehifadhiwa ili kutomtaja mhusika ambaye Kiebrania hakumtaji. Nyongeza ya “na kuingizwa” huwasilisha kwa kawaida mwelekeo unaodokezwa na בֵּית, bila kuondoa hali ya mwanamke kutendewa.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Kiebrania kinasema moja kwa moja “mwanamke.” “Yule” humrejelea Sarai kwa kawaida katika simulizi bila kuingiza neno “mke,” ambalo halipo hapa.
- source_word: בֵּית פַּרְעֹה
  choice: katika nyumba ya Farao
  rationale: בַּיִת inaweza kumaanisha nyumba, makao au kaya ya kifalme. “Nyumba ya Farao” huhifadhi upana huo kuliko “ikulu,” ambalo lingekuwa fasiri mahsusi zaidi.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: walipomwona
  rationale: ראה ni kitenzi cha kawaida cha kuona. Muundo huu unaunganisha kwa kawaida tukio la kwanza na lililofuata katika Kiswahili.
