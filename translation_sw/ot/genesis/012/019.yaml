  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: sw
  text: Kwa nini ulisema, ‘Yeye ni dada yangu,’ na nikamchukua kuwa mke wangu?[a] Sasa basi, huyu hapa mke wako. Mchukue, uende.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikamchukua kwa ajili yangu awe mke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja kuhusu sababu ya Abramu kusema hivyo; huu ndio usemi wa kawaida na wa asili katika Kiswahili.
- source_word: אֲחֹתִי הִוא
  choice: Yeye ni dada yangu
  rationale: Inahifadhi kauli iliyonukuliwa na wakati wa sasa wa kishazi cha Kiebrania kisicho na kitenzi.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: hata nikamchukua awe mke wangu
  rationale: “Hata” inaonyesha matokeo ya kauli ya Abramu bila kuifanya waw iwe kiunganishi cha kusudi; “nikamchukua” huhifadhi mfuatano wa simulizi, na “awe mke wangu” ni Kiswahili cha asili kwa kumchukua mtu kuwa mke.
- source_word: וְעַתָּה
  choice: Sasa basi
  rationale: Inaashiria mpito kutoka lawama kwenda agizo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: הִנֵּה אִשְׁתְּךָ
  choice: huyu hapa mke wako
  rationale: “Huyu hapa” huhifadhi nguvu ya kuelekeza fikira ya הִנֵּה na pia humtambulisha Sarai kwa uwazi kuwa mke wa Abramu.
- source_word: קַח וָלֵךְ
  choice: Mchukue, uende
  rationale: Vitenzi viwili vya amri vinadumishwa kwa mpangilio wake; kiambishi cha yambwa katika “mchukue” kinarejelea Sarai kwa kawaida.
