review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Pharaoh’s question, Sarai’s status as Abram’s wife, and the two concluding imperatives. However, “hata nikamchukua” can carry concessive or intensified-result nuance in contemporary Swahili that is not required by the Hebrew waw-consecutive. The more direct “na nikamchukua” preserves the source syntax and the contextual implication without specifying the relation too strongly.
  naturalness: The register is clear, modern Standard East African Swahili. “Huyu hapa mke wako” appropriately represents the attention-directing force of הִנֵּה, and “Mchukue, uende” is idiomatic and suitably firm. Replacing “hata” with “na” also improves the flow of the question.
  terminology: “Dada yangu,” “mke wangu,” and “mke wako” are accurate and natural. “Kumchukua kuwa mke” is an appropriate Swahili expression for taking someone as a wife, without introducing doctrinal or interpretive language.
  issues:
  - severity: low
    issue: “Hata nikamchukua” adds an unnecessary discourse nuance.
    rationale: While it may be intended to mark consequence, “hata” may suggest an emphatic, climactic, or concessive outcome. The Hebrew וָאֶקַּח is most safely represented here by the unmarked narrative connector “na nikamchukua,” as supported by the English audit trail’s direct rendering.
