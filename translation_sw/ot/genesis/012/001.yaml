base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: sw
  text: Yahwe akamwambia Abramu, “Ondoka katika nchi yako, kutoka kwa jamaa zako na kutoka katika nyumba ya baba yako, uende katika nchi nitakayokuonyesha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatamka jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo kama ‘BWANA’.
- source_word: לֶךְ־לְךָ
  choice: Ondoka
  rationale: Katika muktadha huu tamko hili linamwagiza Abramu aondoke mahali alipo; ‘ondoka’ ni la kawaida na lenye nguvu ya amri katika Kiswahili.
- source_word: מִמּוֹלַדְתְּךָ
  choice: kutoka kwa jamaa zako
  rationale: Neno linaweza kuhusisha ukoo, ndugu au mazingira ya kuzaliwa; ‘jamaa zako’ linawasilisha uhusiano wa ukoo kwa lugha ya kawaida bila kulibana kuwa mahali pekee.
- source_word: מִבֵּית אָבִיךָ
  choice: kutoka katika nyumba ya baba yako
  rationale: Linahifadhi taswira ya Kiebrania ya ‘nyumba ya baba,’ ambayo inaweza kumaanisha kaya au ukoo wa baba.
- source_word: אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  choice: uende mpaka nchi nitakayokuonyesha
  rationale: Kirai ‘uende’ kinakamilisha kwa kawaida amri ya kuondoka na kueleza wazi mwelekeo unaokusudiwa, huku ‘nitakayokuonyesha’ kikihifadhi ahadi ya baadaye.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia wazi tetragramatoni; kutumia jina kunahifadhi tofauti kati ya jina hilo na vyeo vya Mungu.
- issue: Maana ya ‘nyumba ya baba’
  choice: Kuhifadhi usemi halisi ‘nyumba ya baba yako’
  alternative: ukoo wa baba yako
  rationale: Usemi wa chanzo una upana unaoweza kutaja kaya pamoja na ukoo; tafsiri halisi huhifadhi wigo huo bila kuamua maana moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘akamwambia’ unaunganisha aya na simulizi iliyotangulia bila kuongeza neno la wakati kama ‘sasa.’
