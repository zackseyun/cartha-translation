lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַרְנָה לֹו
  choice: wakamjibu
  rationale: Kitenzi cha Kiswahili ‘jibu’ pamoja na kiambishi cha mtendewa ‘-m-’ huwasilisha kwa kawaida kwamba walijibu na kusema kwake; hakuhitaji kurudia ‘wakasema kwake’ kwa namna nzito.
- source_word: רָחֵל וְלֵאָה
  choice: Raheli na Lea
  rationale: Majina yametoholewa kwa tahajia zinazotambulika katika Kiswahili cha Biblia.
- source_word: הַעוֹד
  choice: bado
  rationale: ‘Bado’ huhifadhi maana ya swali kuhusu kama haki au mali yoyote imeendelea kuwapo.
- source_word: לָנוּ
  choice: tuna
  rationale: Muundo wa umilikaji wa Kiswahili ‘tuna’ unawasilisha kwa kawaida dative ya Kiebrania yenye maana ya ‘kwa ajili yetu/kwetu’.
- source_word: חֵלֶק
  choice: sehemu
  rationale: ‘Sehemu’ ni neno la kawaida na lenye hadhi kwa fungu au mgao katika mali ya familia; pia linaacha uhusiano wake na ‘urithi’ wazi.
- source_word: וְנַחֲלָה
  choice: au urithi
  rationale: Ingawa וְ kwa kawaida ni ‘na’, katika jozi hii ‘au’ huonyesha kwa Kiswahili cha kawaida vipengele viwili vinavyokaribiana vya swali moja bila kudai kwamba ni mali mbili tofauti. ‘Urithi’ hufaa kwa mali au haki inayorithiwa.
- source_word: בְּבֵית אָבִינוּ
  choice: katika nyumba ya baba yetu
  rationale: Tafsiri hii iliyo karibu na Kiebrania huhifadhi upana wa ‘nyumba’, ambao unaweza kumaanisha kaya, familia, au mali ya ukoo, si jengo pekee.
