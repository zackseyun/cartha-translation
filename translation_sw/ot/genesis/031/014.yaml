  text: Ndipo Raheli na Lea wakamjibu wakasema, “Je, bado tuna sehemu na urithi katika nyumba ya baba yetu?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba ya baba yetu” inaweza kumaanisha si jengo pekee, bali kaya au familia, na pia mali ya familia.
