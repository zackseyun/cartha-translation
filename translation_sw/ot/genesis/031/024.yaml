  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: sw
  text: Lakini Mungu akamjia Labani, Mwaramu, katika ndoto ya usiku, akamwambia, “Jihadhari usizungumze na Yakobo kwa jema wala kwa baya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kutoka jema hadi baya”; ni nahau yenye maana ya kutosema jambo lolote, liwe la kupendeza au lisilopendeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akamjia
  rationale: Kitenzi בוא hapa kinaeleza Mungu kuja kwa Labani katika ndoto; “akamjia” ni cha kawaida katika simulizi la Kiswahili na hakiongezi wazo la kuonekana ambalo halijaelezwa wazi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja na muktadha wa simulizi vinaonyesha kuwa neno hili linamtaja Mungu mmoja.
- source_word: לָבָן הָאֲרַמִּי
  choice: Labani, Mwaramu
  rationale: אֲרַמִּי ni jina la kabila, yaani Mwaramu; “Msiria” ni istilahi ya kimapokeo inayotumia jiografia ya baadaye.
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: katika ndoto usiku
  rationale: Tafsiri hii inaweka wazi kwamba mawasiliano yalitokea katika ndoto wakati wa usiku, huku ikibaki ya kawaida katika Kiswahili.
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Kauli hii ya onyo ina maana ya kujilinda au kuwa mwangalifu; “Jihadhari” ni fupi, yenye hadhi, na ina nguvu ya amri.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: usiseme na Yakobo
  rationale: פֶּן baada ya onyo huzuia tendo, na דבר עם kwa kawaida ni “kusema/kuzungumza na.” Kiswahili hiki kinahifadhi uwezekano wa hotuba au mawasiliano na Yakobo.
- source_word: מִטּוֹב עַד רָע
  choice: neno lolote, jema wala baya
  rationale: Kihalisi ni “kutoka jema hadi baya,” lakini ni nahau inayokataza kusema jambo lolote katika wigo huo. Kuongeza “neno lolote” hufanya maana iwe wazi na ya kawaida bila kufuta taswira ya mema na mabaya.
theological_decisions:
- issue: Utambulisho wa אֱלֹהִים
  choice: Mungu mmoja alimjia Labani katika ndoto
  alternative: mungu fulani au miungu
  rationale: Maumbo ya kitenzi cha umoja na muktadha yanamtambulisha Mungu kama mhusika mmoja; hakuna msingi wa kisarufi wa kutafsiri kwa wingi au kwa namna isiyo maalumu.
- issue: Upeo wa onyo “מִטּוֹב עַד רָע”
  choice: kutosema na Yakobo neno lolote, liwe jema au baya
  alternative: kutotishia Yakobo tu au kutosema mabaya tu
  rationale: Nahau inataja ncha zote mbili za wigo na hivyo inaonya dhidi ya mawasiliano ya aina yoyote; tafsiri haipaswi kupunguza onyo hilo kuwa maneno mabaya pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwaramu” linahifadhi jina la kabila la Kiebrania badala ya istilahi ya kimapokeo “Msiria.” Muundo “neno lolote, jema wala baya” unatoa maana ya nahau kwa uwazi huku tanbihi ikihifadhi umbo lake halisi.
