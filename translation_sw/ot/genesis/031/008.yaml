  text: אִם כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן נְקֻדִּ֑ים וְ/אִם כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן עֲקֻדִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: sw
  text: Kama alisema hivi, ‘Wenye madoadoa watakuwa ujira wako,’ basi wanyama wote wa kundi wakazaa watoto wenye madoadoa; na kama alisema hivi, ‘Wenye milia watakuwa ujira wako,’ basi wanyama wote wa kundi wakazaa watoto wenye milia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: wenye madoadoa
  rationale: Neno hili linaeleza wanyama wenye alama za madoa; ‘wenye madoadoa’ ni Kiswahili cha kawaida na hutofautisha wazi alama hizi na milia.
- source_word: עֲקֻדִּים
  choice: wenye milia
  rationale: Katika muktadha wa rangi za mifugo, neno hili linaeleza wanyama wenye alama kama mikanda au milia; ‘wenye milia’ ni tafsiri ya asili na inayoeleweka.
- source_word: שְׂכָרֶךָ
  choice: ujira wako
  rationale: ‘Ujira’ hudumisha maana ya malipo ya kazi, inayofaa katika makubaliano ya Yakobo na Labani.
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: basi kundi lote lilizaa wana
  rationale: Muundo huu unaonyesha matokeo yaliyofuata sharti lililotajwa. ‘Wana’ huweka wazi kuwa kilichozaliwa ni watoto wa mifugo bila kuongeza aina isiyotajwa katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya ‘kama alisema hivi’ yamehifadhiwa ili kufuata usambamba wa Kiebrania; usemi wa moja kwa moja umetolewa kwa uwazi bila kufafanua zaidi sababu ya matokeo hayo.
