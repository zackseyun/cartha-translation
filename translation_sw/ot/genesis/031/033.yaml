base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: sw
  text: Basi Labani akaingia katika hema la Yakobo, na katika hema la Lea, na katika hema la watumwa wawili wa kike, lakini hakupata[a]. Kisha akatoka katika hema la Lea, akaingia katika hema la Raheli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hakupata”; yambwa haikutajwa katika aya hii, lakini muktadha unaonyesha miungu ya nyumbani ambayo Labani alikuwa akiitafuta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaingia
  rationale: Kitenzi בוא pamoja na kihusishi בְּ kinaonyesha mwendo wa kuingia mahali. “Akaingia” ni Kiswahili cha kawaida na huhifadhi mfuatano wa simulizi.
- source_word: אֹהֶל
  choice: hema
  rationale: Maana ya kawaida ya אֹהֶל ni hema; neno halijapanuliwa kuwa “makao,” ili kuhifadhi mazingira halisi ya simulizi.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: watumishi wale wawili wa kike
  rationale: אָמָה humaanisha mtumishi wa kike au mwanamke aliye katika hali ya utumwa. Tafsiri hii ni ya sasa na inayoeleweka, huku ikionyesha jinsia na nafasi yao katika nyumba bila kutumia neno la kale “vijakazi” au kuamua kwa ukali zaidi ya muktadha huu.
- source_word: וְלֹא מָצָא
  choice: lakini hakuvipata[a]
  rationale: Kiebrania hakitaji yambwa, lakini muktadha unaelekeza kwa sanamu za nyumbani alizokuwa akizitafuta Labani. Kiambishi “-vi-” kinafanya sentensi iwe ya kawaida kwa Kiswahili, na tanbihi inaweka wazi kwamba yambwa halikutajwa katika chanzo.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: Kisha akatoka katika hema la Lea
  rationale: יצא ni kutoka mahali. “Kisha” huwasilisha vizuri mfuatano wa matendo unaoonyeshwa na waw ya kisimulizi.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: akaingia katika hema la Raheli
  rationale: Tafsiri hiyo inarudia kwa uthabiti mwendo uleule wa kuingia unaotajwa mwanzoni mwa aya.
- source_word: וַיָּבֹא ... וּבְאֹהֶל ... וּבְאֹהֶל
  choice: akaingia katika ... na katika ... na katika
  rationale: Kurudiwa kwa “katika” kunahifadhi hatua za upekuzi wa hema moja baada ya jingine.
