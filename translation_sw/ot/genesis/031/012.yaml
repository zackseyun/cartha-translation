base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: sw
  text: 'Akasema, “Tafadhali inua macho yako uone: madume yote ya mbuzi yanayopanda kundi[a] yana milia[b], madoadoa, na mabaka, kwa maana nimeona yote ambayo Labani anakutendea.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yanayojamiiana na kundi.” Usemi wa Kiebrania ni nahau ya uzalishaji wa wanyama.
    reason: lexical_alternative
  - marker: b
    text: Tafsiri za jadi mara nyingi hutafsiri עֲקֻדִּים kuwa “yenye mistari kama pete.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Tafadhali inua macho yako
  rationale: Nahau ya Kiebrania ina maana ya kuinua macho au kutazama juu; “tafadhali” linaakisi chembe ya ombi נָא.
- source_word: וּרְאֵה
  choice: uone
  rationale: Linadumisha amri ya kuona na msisitizo wa jambo analoonyeshwa Yakobo katika ndoto.
- source_word: הָעַתֻּדִים
  choice: madume yote ya mbuzi
  rationale: עתודים hapa inaelekea kumaanisha mbuzi wa kiume, si kondoo dume; usemi huu ni wazi kwa wasomaji wa sasa.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: yanayopanda wanyama wa kundi
  rationale: עלה על ni nahau ya uzalishaji wa wanyama inayomaanisha madume kuwapanda wanyama wengine ili kujamiiana; “kupanda” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: עֲקֻדִּים
  choice: yana milia
  rationale: Neno hilo linaeleza alama zenye mistari au mikanda; “milia” ni la kawaida na linaeleweka.
- source_word: נְקֻדִּים
  choice: madoadoa
  rationale: Neno hili huonyesha alama ndogo ndogo; “madoadoa” ni tafsiri ya kawaida na nyepesi.
- source_word: וּבְרֻדִּים
  choice: mabaka
  rationale: “Mabaka” linaonyesha rangi zilizochanganyika au alama pana zaidi, hivyo linasaidia kulitofautisha na נְקֻדִּים.
- source_word: כִּי רָאִיתִי
  choice: kwa maana nimeona
  rationale: “Kwa maana” linahifadhi nguvu ya kisababishi ya כִּי, na “nimeona” linaonyesha tendo lililotimia lenye umuhimu wa sasa.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: yote ambayo Labani anakutendea
  rationale: Kitenzi shiriki עֹשֶׂה kinaonyesha tendo linaloendelea; “anakutendea” pia linaonyesha kwamba matendo ya Labani yanamwathiri Yakobo.
