  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: sw
  text: “Mimi ndiye Mungu wa Betheli[a], ambako ulipaka mafuta nguzo ya jiwe, na ambako uliweka nadhiri kwangu[b]. Sasa inuka, utoke katika nchi hii, urudi katika nchi ya kuzaliwa kwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina “Betheli” linamaanisha “nyumba ya Mungu”; hapa ni jina la mahali.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania hutumia kitenzi na nomino zenye mzizi mmoja: kwa maana halisi, “uliweka nadhiri,” kwa msisitizo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי הָאֵל
  choice: Mimi ndiye Mungu
  rationale: Kiwakilishi אָנֹכִי kinasisitiza utambulisho wa msemaji, na הָאֵל yenye kibainishi humtambulisha kuwa Mungu, si mungu fulani asiyejulikana. ‘Mimi ndiye Mungu’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hili ni jina la mahali. Umbo ‘Betheli’ linafuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili badala ya kutafsiri jina hilo kama ‘nyumba ya Mungu’ ndani ya matini.
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: ambako uliipaka mafuta nguzo ya jiwe
  rationale: מָשַׁחְתָּ huonyesha kitendo cha kupaka mafuta, na מַצֵּבָה ni jiwe lililosimamishwa kama nguzo. Tafsiri hii inahifadhi kitendo halisi kinachokumbukwa kutoka Mwanzo 28:18 bila kuongeza maana ya kiibada isiyotajwa wazi hapa.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: ambako uliniwekea nadhiri
  rationale: Kiswahili cha kawaida husema ‘kuweka nadhiri.’ Kiambishi ‘-ni-’ kinahifadhi maana ya kwamba nadhiri hiyo iliwekwa kwa Mungu; tanbihi inaeleza msisitizo wa muundo wa Kiebrania wa kitenzi na nomino ya mzizi mmoja.
- source_word: עַתָּה קוּם צֵא
  choice: Sasa inuka, utoke
  rationale: ‘Sasa’ inaonyesha badiliko kutoka ukumbusho kwenda kwenye agizo. ‘Inuka’ na ‘utoke’ zinahifadhi maagizo mawili tofauti huku zikisomeka kwa kawaida katika mfululizo wa maagizo ya Kiswahili.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: katika nchi hii
  rationale: אֶרֶץ hapa ni eneo au nchi ambako Yakobo alikuwa akiishi, wala si dunia nzima. ‘Kutoka katika nchi hii’ ni usemi wa asili katika Kiswahili.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: urudi katika nchi ya kuzaliwa kwako
  rationale: שׁוּב ni kurudi mahali pa awali, na אֶרֶץ מוֹלַדְתֶּךָ huonyesha nchi ya asili au ya kuzaliwa. Tafsiri haibani maana hiyo kuwa jamaa peke yao.
theological_decisions:
- issue: Msemaji kujitambulisha kuwa ‘Mungu wa Betheli’
  choice: Mimi ndiye Mungu wa Betheli
  alternative: Mimi ni Mungu huko Betheli
  rationale: Muundo huu unamhusianisha msemaji na tukio la awali la Yakobo huko Betheli, bila kumfanya Mungu aonekane kuwa mungu wa eneo moja tu au mmoja kati ya miungu mingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Nguzo ya jiwe’ inaweka wazi kwamba מַצֵּבָה ni jiwe lililosimamishwa, na ‘uliipaka mafuta’ inaonyesha tendo halisi badala ya kutumia istilahi ya kidini inayoweza kuficha picha hiyo. Alama za tanbihi zimewekwa karibu na maneno yanayoelezwa.
