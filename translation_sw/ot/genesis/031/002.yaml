  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: sw
  text: Yakobo akauona uso wa Labani, na tazama, uso wa Labani kwake haukuwa kama hapo awali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “uso wa Labani haukuwa pamoja naye kama jana na juzi”; hii ni nahau inayoonyesha kwamba mtazamo wa Labani kwa Yakobo ulikuwa umebadilika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: akauona
  rationale: Kitenzi cha kawaida cha kusimulia kinachomaanisha ‘akaona’; hakiongezi wazo la kukisia lisilosemwa wazi.
- source_word: פְּנֵי לָבָן
  choice: uso wa Labani
  rationale: Inahifadhi taswira halisi ya Kiebrania ya ‘uso,’ ambayo katika muktadha huu pia huonyesha hali au mtazamo wa mtu.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Inahifadhi mwito wa kuelekeza fikira na uhai wa simulizi unaoletwa na הִנֵּה.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: Labani hakuwa tena upande wake
  rationale: Nahau hii inaonyesha kwamba Labani hakuwa tena akimwelekea Yakobo kwa hali ileile ya awali. Kutaja Labani na kusema ‘upande wake’ huepuka utata wa viwakilishi huku kukidumisha wazo la uhusiano.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: kama hapo awali
  rationale: Usemi huu, ambao kihalisi hutaja ‘jana na juzi,’ ni nahau yenye maana ya zamani au hapo awali.
