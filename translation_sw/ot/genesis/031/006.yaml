  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: sw
  text: Nanyi wenyewe mnajua kwamba nimemtumikia baba yenu kwa nguvu zangu zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimefanya kazi kwa ajili ya baba yenu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutumikia” au “kufanya kazi”; maana zote mbili zinafaa kwa miaka ambayo Yakobo alifanya kazi chini ya Labani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  choice: Nanyi wenyewe
  rationale: Kiunganishi וְ kinaendelezwa kwa “na,” huku kiwakilishi huru cha nafsi ya pili wingi wa kike kikihifadhiwa kwa msisitizo kupitia “wenyewe,” kwa kuwa Yakobo anawahutubia Raheli na Lea.
- source_word: יְדַעְתֶּן
  choice: mnajua
  rationale: Kitenzi cha Qal timilifu cha nafsi ya pili wingi wa kike kinaeleza hali ya sasa inayotokana na maarifa yaliyopatikana; “mnajua” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי kinaanzisha maudhui ya jambo wanalolijua, kwa hiyo “kwamba” kinaonyesha uhusiano wa kishazi kwa uwazi.
- source_word: בְּ/כָל כֹּחִי
  choice: kwa nguvu zangu zote
  rationale: כֹּחַ inaweza kumaanisha nguvu, uwezo, au uweza. Katika muktadha wa kazi nzito, “kwa nguvu zangu zote” huwasilisha kujituma kikamilifu kwa lugha ya asili.
- source_word: עָבַדְתִּי
  choice: nimemtumikia
  rationale: עבד huweza kumaanisha kutumikia au kufanya kazi. Kwa kuwa yambwa ni mtu, “nimemtumikia” huhifadhi maana ya uhusiano wa utumishi pamoja na wazo la kufanya kazi.
- source_word: אֶת אֲבִיכֶן
  choice: baba yenu
  rationale: Alama ya yambwa אֶת haitafsiriwi moja kwa moja; kiambishi “-m-” katika “nimemtumikia” na kirai “baba yenu” huonyesha yambwa kwa njia ya kawaida ya Kiswahili.
