base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: sw
  text: Akawaambia, “Ninaona kwamba uso wa baba yenu hauelekei kwangu kama zamani[a], lakini Mungu wa baba yangu amekuwa pamoja nami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya moja kwa moja, “kama jana na juzi,” nahau ya Kiebrania inayomaanisha “kama zamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: Akawaambia
  rationale: Muundo huu wa simulizi unaonyesha mwendelezo wa matukio, na kiambishi -wa- kinarejelea Raheli na Lea kwa kawaida katika Kiswahili.
- source_word: רֹאֶה אָנֹכִי
  choice: Ninaona
  rationale: Hali ya kuendelea pamoja na kiwakilishi huru inaonyesha jambo ambalo Yakobo analitambua wakati huo; wakati wa sasa wa Kiswahili unafaa.
- source_word: אֶת פְּנֵי אֲבִיכֶן
  choice: uso wa baba yenu
  rationale: Neno la Kiebrania ‘uso’ linaweza kueleza mwelekeo au mtazamo wa mtu. Kulihifadhi kunadumisha taswira halisi ya Kiebrania bila kufanya maana kuwa isiyoeleweka.
- source_word: כִּי אֵינֶנּוּ אֵלַי
  choice: hauelekei kwangu
  rationale: Maneno haya yanadumisha taswira ya uso kuelekea kwa Yakobo na yanaashiria kuwa mtazamo wa Labani kwake umebadilika bila kuufafanua zaidi ya maandishi.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: kama zamani
  rationale: Hii ni nahau ya Kiebrania inayomaanisha ‘kama hapo awali.’ Tafsiri hii ni ya kawaida katika Kiswahili, huku maana ya moja kwa moja ikitolewa katika tanbihi.
- source_word: וֵאלֹהֵי אָבִי
  choice: lakini Mungu wa baba yangu
  rationale: 'Kiunganishi kimetafsiriwa kwa maana ya ulinganisho unaopingana: mtazamo wa Labani umebadilika, lakini Mungu amekuwa pamoja na Yakobo. ‘Mungu wa baba yangu’ linafuata kwa karibu muundo wa Kiebrania.'
- source_word: הָיָה עִמָּדִי
  choice: amekuwa pamoja nami
  rationale: Wakati timilifu unaonyesha uwepo na msaada wa Mungu ulioendelea hadi wakati wa kusema; ‘amekuwa’ linawasilisha umuhimu huo unaoendelea.
theological_decisions:
- issue: Jinsi ya kutafsiri rejeo la Mungu אֱלֹהֵי אָבִי
  choice: Mungu wa baba yangu
  alternative: Mungu wa babangu
  rationale: Chaguo hili linafuata kwa karibu muundo wa Kiebrania na kuhifadhi sauti ya uhusiano wa kifamilia bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko na kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ‘uso kuelekea’ imehifadhiwa ili kuakisi Kiebrania, ingawa ni ya kimtindo zaidi kuliko usemi wa mazungumzo ya kila siku.
