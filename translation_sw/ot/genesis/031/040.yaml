translation:
  language: sw
  text: 'Hivi ndivyo nilivyokuwa: mchana joto kali liliniteketeza, na usiku baridi kali; usingizi wangu ukanitoka machoni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: Hali yangu ilikuwa hivi
  rationale: Kitenzi hiki kinaanzisha maelezo ya Yakobo kuhusu hali aliyokuwa nayo. Kiswahili hiki kinaweka wazi nguvu ya ‘nilikuwa’ bila kuleta muundo usio wa kawaida.
- source_word: בַיּוֹם
  choice: mchana
  rationale: Huonyesha wakati wa mchana na kudumisha ulinganifu na ‘usiku’.
- source_word: אֲכָלַנִי
  choice: liliniteketeza
  rationale: Kitenzi אכל, kihalisi ‘lilinila,’ kimetumiwa kisitiari kuonyesha kuumizwa au kuchoshwa sana na hali ngumu. ‘Liliniteketeza’ huhifadhi ukali wa taswira hiyo kwa Kiswahili cha kawaida.
- source_word: חֹרֶב
  choice: joto kali
  rationale: Katika muktadha wa kukabiliwa na baridi kali usiku, neno hili linamaanisha joto kavu, kali la mchana.
- source_word: וְקֶרַח
  choice: na ... baridi kali
  rationale: קֶרַח kwa kawaida ni barafu au sakitu; katika maelezo ya hali ya usiku, ‘baridi kali’ ni ya asili zaidi na huhifadhi maana ya hali yenye kugandisha.
- source_word: בַּלָּיְלָה
  choice: usiku
  rationale: Ni kinyume cha wakati wa ‘mchana’ na hudumisha ulinganifu wa sentensi.
- source_word: וַתִּדַּד
  choice: ukayakimbia
  rationale: Kitenzi hiki adimu huonyesha kuondoka au kukimbia. ‘Usingizi ... ukayakimbia macho’ huhifadhi uhuishaji wa usingizi kama kitu kinachokimbia.
- source_word: שְׁנָתִי
  choice: usingizi wangu
  rationale: Hurejelea hali ya kulala; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: מֵעֵינָי
  choice: macho yangu
  rationale: Huhifadhi taswira ya Kiebrania ya usingizi kuondoka machoni, inayoweza kueleweka kwa Kiswahili.
