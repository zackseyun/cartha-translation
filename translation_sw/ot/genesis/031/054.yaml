  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: sw
  text: Kisha Yakobo akatoa dhabihu mlimani, akawaita ndugu zake ili wale chakula[a]. Wakala chakula, wakalala mlimani usiku huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zake”; neno la Kiebrania linalotafsiriwa “ndugu” hapa linaweza pia kumaanisha jamaa wa kiume au washirika, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: akatoa dhabihu
  rationale: Muundo wa Kiebrania unatumia kitenzi na nomino zenye mzizi mmoja kwa tendo la kutoa dhabihu. Kiswahili cha kawaida ‘akatoa dhabihu’ huhifadhi maana ya ibada bila marudio yasiyo ya asili.
- source_word: בָּהָר
  choice: mlimani
  rationale: הַר inaweza kumaanisha mlima au eneo la milima; katika simulizi hili umbo bainifu na kutajwa kwake tena vinafaa kutafsiriwa ‘mlimani.’
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: קרא kimsingi ni kuita; katika muktadha mwito huo pia ni mwaliko wa kula, lakini ‘akawaita’ huhifadhi usemi wa chanzo.
- source_word: לְאֶחָיו
  choice: ndugu zake
  rationale: אָח inaweza kumaanisha kaka au ndugu wa kiume, lakini pia jamaa au washirika kwa upana. ‘Ndugu zake’ ni ya asili katika Kiswahili na huhifadhi istilahi ya kifamilia pamoja na uwezekano wa maana pana.
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  choice: wale chakula / Wakala chakula
  rationale: Kiebrania husema kihalisi ‘kula mkate,’ lakini huo ni usemi wa kawaida unaomaanisha kula chakula. ‘Chakula’ huwasilisha maana ya nahau kwa Kiswahili cha sasa na kuhifadhi marudio ya tendo.
- source_word: וַיָּלִינוּ
  choice: wakalala ... usiku huo
  rationale: לון humaanisha kukaa au kulala mahali usiku. ‘Wakalala ... usiku huo’ ni usemi wa kawaida unaoonyesha wazi kukaa kwao mlimani usiku.
theological_decisions:
- issue: Maana ya לְאֶחָיו katika mazingira ya agano
  choice: ndugu zake
  alternative: jamaa zake; watu wake wa karibu
  rationale: Neno la Kiebrania linaweza kutumiwa kwa ndugu wa kuzaliwa au kwa jamaa na washirika kwa upana. Matini kuu inadumisha neno la kifamilia bila kuamua kwamba walikuwa kaka zake halisi; tanbihi inaonyesha upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nahau ya Kiebrania ‘kula mkate’ imetafsiriwa kwa maana yake ya kawaida ‘kula chakula,’ huku marudio ya sentensi yakihifadhiwa. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
