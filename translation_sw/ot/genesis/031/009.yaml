  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: sw
  text: Kwa hiyo Mungu alimwondolea baba yenu mifugo yake, akaipa mimi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaipokonya” au “akaiokoa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuondoa kitu kutoka upande mmoja na kukihamishia upande mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: akamwondolea
  rationale: Hifili ya נצל hapa inaonyesha Mungu akiondoa mali kutoka kwa Labani na kuihamishia kwa Yakobo. ‘Akamwondolea’ huhifadhi wazo la kuondolewa kutoka kwa upande mmoja bila kulazimisha maana ya kuokolewa kutoka hatarini.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa Mungu anayetenda kwa niaba ya Yakobo.
- source_word: מִקְנֵה
  choice: mifugo
  rationale: Katika muktadha huu wa ufugaji, מִקְנֶה inarejelea wanyama wa kufugwa; ‘mifugo’ ni sahihi na pana kuliko ‘ng’ombe’.
- source_word: אֲבִיכֶם
  choice: baba yenu
  rationale: 'Nomino ni umoja ikiwa na kiambishi cha nafsi ya pili wingi: Yakobo anawaambia Raheli na Lea kuhusu baba yao mmoja, Labani.'
- source_word: וַיִּתֶּן לִי
  choice: akanipa mimi
  rationale: Kitenzi נתן pamoja na לִי kinaonyesha uhamisho kwenda kwa Yakobo. Kiswahili kinaweza kuacha yambwa kwa kuwa ‘mifugo’ imetajwa katika kishazi kilichotangulia; ‘mimi’ inasisitiza mpokeaji kama ilivyo katika muktadha wa uhamisho.
theological_decisions:
- issue: Utendaji wa Mungu katika kufanikiwa kwa Yakobo
  choice: Mstari unasema moja kwa moja kwamba Mungu alimwondolea Labani mifugo na kumpa Yakobo.
  alternative: Kutumia kauli laini inayosema tu kwamba Mungu alimbariki Yakobo bila kueleza uhamisho.
  rationale: Kiebrania kinamhusisha Mungu moja kwa moja na uhamisho huo kupitia וַיַּצֵּל ... וַיִּתֶּן; tafsiri haipunguzi jambo hilo kuwa baraka ya jumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘akamwondolea ... akanipa’ ni wa kawaida na unaonyesha wazi pande mbili za uhamisho; ‘Kwa hiyo’ huunganisha hitimisho hili na maelezo yaliyotangulia.
