  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: sw
  text: Wala hukuniruhusu niwabusu wana wangu wa kiume na mabinti zangu.[a] Sasa umetenda kipumbavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa ukaribu zaidi: “Hukuniacha niwabusu wana wangu wa kiume na mabinti zangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: hukuniacha
  rationale: Ingawa kitenzi hiki kwa kawaida humaanisha ‘kuacha’ au ‘kutelekeza,’ hapa kikiwa na kitenzi-jina ‘kubusu’ kina maana ya kutompa mtu nafasi au ruhusa ya kufanya jambo. ‘Hukuniacha’ ni Kiswahili cha kawaida na huhifadhi pia umbo la msingi la Kiebrania.
- source_word: לְנַשֵּׁק
  choice: niwabusu
  rationale: Chanzo kinasema tu ‘kubusu.’ Muktadha unaonyesha kuwa ni busu la kuagana, lakini wazo la kuagana halijaelezwa wazi, hivyo halijaongezwa katika matini kuu.
- source_word: לְבָנַי וְלִבְנֹתָי
  choice: wana wangu wa kiume na wa kike
  rationale: Kiebrania kinataja wana wa kiume na mabinti kwa maneno tofauti. Kwa kuwa wanaoitwa ‘wana’ hapa ni wajukuu wa Labani, usemi huu huhifadhi jinsia zote bila kuwalazimisha wasomaji kuwaelewa kama watoto wake wa moja kwa moja.
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha wakati na cha hatua katika mazungumzo, kinachoanzisha hukumu ya Labani kuhusu kitendo cha Yakobo.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: umetenda kipumbavu
  rationale: Muundo huu una maana ya kufanya au kutenda kwa upumbavu. ‘Umetenda kipumbavu’ ni wa asili, wenye hadhi, na wa karibu na nguvu ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wala’ huendeleza malalamiko kutoka muktadha uliotangulia. Matini kuu imetumia ‘wana wangu wa kiume na wa kike’ ili kuonyesha kwa kawaida kwamba Labani anawahesabu wajukuu zake kuwa wake, huku tanbihi ikihifadhi kwa ukaribu zaidi jozi ya Kiebrania ‘wana ... na mabinti.’
