base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: sw
  text: Kwa nini ulijificha ili ukimbie, ukaondoka kwangu kisiri[a] bila kuniambia? Nami ningekuaga kwa furaha na kwa nyimbo, kwa tari na kinubi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “ukaniiba.” Hii ni nahau ya Kiebrania yenye maana ya kuondoka kwa siri bila mtu kujua.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Ni swali la kawaida la kutaka sababu, na linafaa kwa sauti ya lawama ya Labani.
- source_word: נַחְבֵּאתָ
  choice: ulijificha
  rationale: Nifali ya חבא ina maana ya kujificha; umbo la kujirejelea limehifadhiwa wazi.
- source_word: לִבְרֹחַ
  choice: ili ukimbie
  rationale: Kitenzi ברח humaanisha kukimbia au kutoroka; hapa “ukimbie” ni cha kawaida na kinahifadhi nguvu ya shtaka.
- source_word: וַתִּגְנֹב אֹתִי
  choice: ukaondoka kwangu kisiri
  rationale: Kifungu hiki, kihalisi “ukaniiba,” ni nahau ya kuondoka bila mtu kujua. Tafsiri hii inawasilisha maana yake kwa Kiswahili cha kawaida bila kudai udanganyifu usiotajwa wazi.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: bila kuniambia
  rationale: Hutoa kwa kawaida maana ya נגד katika hifili na kuunganisha sababu ya malalamiko kwa mtiririko mzuri.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: Ningekuaga
  rationale: 'Waw hapa inaeleweka kuwa ya matokeo katika hali ambayo haikutimia: kama Yakobo angesema, Labani angemuaga. “Kuaga” ni asili katika mazingira ya safari ya kuondoka.'
- source_word: בְּשִׂמְחָה
  choice: kwa furaha
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya שִׂמְחָה katika sherehe ya kuaga.
- source_word: וּבְשִׁרִים
  choice: kwa nyimbo
  rationale: Nomino ya wingi ina maana ya nyimbo; tafsiri hii inapatana na kutajwa kwa ala zinazofuata.
- source_word: בְּתֹף
  choice: kwa matari
  rationale: תֹף ni ngoma ndogo ya mkononi; “matari” ni neno la sasa la Kiswahili linalofaa zaidi kuliko istilahi za kizamani.
- source_word: וּבְכִנּוֹר
  choice: na kinubi
  rationale: כִּנּוֹר ni ala ya nyuzi ya aina ya lyre. “Kinubi” ni istilahi ya Kiswahili inayotambulika na iliyo sahihi kuliko jina pana lisilo maalumu.
