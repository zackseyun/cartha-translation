base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: sw
  text: Kwa maana utajiri wote ambao Mungu ameuchukua[a] kutoka kwa baba yetu ni wetu na wa watoto wetu. Basi, fanya yote ambayo Mungu amekuambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameuokoa” au “ameukomboa.” Kitenzi cha Kiebrania mara nyingi huwa na maana ya kuokoa au kukomboa, lakini hapa kinahusu Mungu kuondoa utajiri kutoka kwa Labani na kuupa nyumba ya Yakobo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaanzisha sababu inayotolewa na Raheli na Lea ya kukubaliana na Yakobo; “Kwa maana” huonyesha uhusiano huo wa ufafanuzi kwa Kiswahili cha kawaida.
- source_word: כָל הָעֹשֶׁר
  choice: utajiri wote
  rationale: עֹשֶׁר humaanisha utajiri au mali nyingi; “utajiri wote” ni usemi wa kawaida unaoweza kujumuisha mifugo na mali nyingine katika muktadha huu.
- source_word: הִצִּיל
  choice: ameuchukua
  rationale: Ingawa kitenzi hiki mara nyingi humaanisha kuokoa au kukomboa, hapa kitu chake ni utajiri ulioondolewa kwa Labani na kuja katika nyumba ya Yakobo. “Ameuchukua” huonyesha uhamisho huo bila kudokeza uporaji wa nguvu.
- source_word: מֵאָבִינוּ
  choice: kutoka kwa baba yetu
  rationale: 'Kihusishi מן huonyesha chanzo: utajiri ulitoka kwa baba yao.'
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: ni wetu na wa watoto wetu
  rationale: Kauli ya Kiebrania huonyesha umiliki au haki ya kuumiliki; muundo huu ni mfupi na wa kawaida kwa Kiswahili.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito kutoka katika sababu iliyotolewa kwenda katika himizo linalotokana nayo.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: yote ambayo Mungu amekuambia
  rationale: Huhifadhi wazo la ujumla wa kila jambo ambalo Mungu alimwambia Yakobo, kwa muundo wa asili wa Kiswahili.
- source_word: עֲשֵׂה
  choice: fanya
  rationale: Huhifadhi ufupi na nguvu ya amri ya Kiebrania; jambo la kufanywa limetajwa katika kishazi kilichotangulia.
theological_decisions:
- issue: Tendo la Mungu kuhusiana na utajiri wa Labani
  choice: ameuchukua kutoka kwa baba yetu
  alternative: ameuokoa / ameukomboa kutoka kwa baba yetu
  rationale: Katika mstari huu, utajiri uliokuwa kwa Labani sasa unatambuliwa kuwa wa familia ya Yakobo. Tafsiri kuu inaonyesha kuondolewa na kuhamishwa kwa utajiri huo, huku tanbihi ikihifadhi maana ya kawaida ya kitenzi ya kuokoa au kukomboa. Hii haikusudii kutoa hukumu ya kimadhehebu kuhusu tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo mfupi wa amri umehifadhiwa, na tanbihi imewekwa mara baada ya kitenzi kinachohusika.
