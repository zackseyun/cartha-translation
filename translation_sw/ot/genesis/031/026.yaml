  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: sw
  text: Ndipo Labani akamwambia Yakobo, “Umefanya nini? Umenidanganya[a] na kuwaondoa binti zangu kama wanawake waliotekwa vitani[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “umeiba moyo wangu,” yaani, umenidanganya au umetenda kwa siri bila kunijulisha.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama mateka wa upanga,” yaani, kama wanawake waliotekwa vitani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Umefanya nini?
  rationale: Hili ni swali la lawama kuhusu tendo lililokamilika ambalo matokeo yake bado yanaonekana; muundo huu ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: Umenidanganya
  rationale: Kirai cha Kiebrania, kwa maana halisi ‘umeiba moyo wangu,’ hapa ni nahau ya kutenda kwa siri au kumdanganya mtu. ‘Umeniibia moyo’ katika Kiswahili kingeweza kueleweka kimapenzi na hivyo kupotosha lawama ya Labani; picha halisi imehifadhiwa katika tanbihi.
- source_word: לְבָבִי
  choice: -ni katika ‘umenidanganya’
  rationale: Ingawa לְבָבִי kwa maana halisi ni ‘moyo wangu,’ katika nahau hii hairejelei hisia za kimapenzi bali ufahamu wa Labani ambao Yakobo aliupita kwa siri.
- source_word: וַתְּנַהֵג
  choice: kuwaondoa
  rationale: Kitenzi נהג kinaweza kumaanisha kuongoza au kuswaga. ‘Kuwaondoa’ kinaonyesha kwamba walipelekwa kutoka nyumbani kwa Labani bila kudai wazi kwamba walilazimishwa, huku tashbihi inayofuata ikibeba picha ya nguvu.
- source_word: בְּנֹתַי
  choice: binti zangu
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi yenye umilikaji, ikihifadhi madai ya kifamilia katika maneno ya Labani.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: kama wanawake waliotekwa vitani
  rationale: Umbo la Kiebrania ni la kike na linarejelea wanawake waliotekwa kwa nguvu za vita. Kiswahili hiki kinafikisha maana wazi na kwa kawaida; picha halisi ya ‘upanga’ imeelezwa katika tanbihi.
