  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: sw
  text: Basi akakimbia, yeye na vyote alivyokuwa navyo. Akainuka, akavuka ule mto, akaelekeza uso wake kuelekea eneo la milima la Gileadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akavuka mto Frati.” Kiebrania kinasema tu “ule mto,” huenda kikimaanisha Frati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: akakimbia
  rationale: Kitenzi ברח humaanisha kukimbia au kutoroka. “Akakimbia” ni cha kawaida katika Kiswahili na kinadumisha maana ya kuondoka kwa siri na haraka bila kuongeza maelezo yasiyomo.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: yeye na vyote alivyokuwa navyo
  rationale: Usemi huu unajumuisha mali na watu wote waliokuwa chini ya Yakobo bila kuufanya urejelee vitu pekee.
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Tafsiri hii inadumisha hatua tofauti ya simulizi iliyo katika קום, badala ya kuifasiri moja kwa moja kuwa alianza safari.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: akavuka ule Mto
  rationale: עבר ni kuvuka. Kielezi “ule” na herufi kubwa katika “Mto” vinaonyesha kuwa ni mto maalumu unaojulikana katika muktadha, huku jina lake likielezwa katika tanbihi.
- source_word: הַנָּהָר
  choice: ule Mto
  rationale: Kiebrania kinasema kihalisi “ule Mto,” usemi ambao huenda ukarejelea Eufrate. Maandishi makuu yanahifadhi namna hiyo ya kutaja badala ya kuingiza jina mahsusi.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: akaelekeza uso wake kuelekea
  rationale: Huu ni usemi wa Kiebrania unaoonyesha mwelekeo wa makusudi. Kiswahili hiki kinahifadhi picha ya asili kwa namna inayoeleweka.
- source_word: הַר הַגִּלְעָד
  choice: nchi ya milima ya Gileadi
  rationale: הַר hapa inaweza kumaanisha eneo la milima badala ya kilele kimoja. “Nchi ya milima” inafaa kwa jiografia na haibani maana kuwa mlima mmoja.
