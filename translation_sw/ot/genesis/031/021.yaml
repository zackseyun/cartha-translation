  source_fidelity: 'Tafsiri inafuata kwa ujumla mlolongo wa Kiebrania: Yakobo alikimbia pamoja na vyote vilivyokuwa vyake, akainuka, akavuka mto ule, na kuelekeza uso wake kwenye eneo lenye milima la Gileadi. Hata hivyo, herufi kubwa katika “Mto” si desturi ya Kiswahili na si lazima ili kuwasilisha kibainishi cha Kiebrania.'
  naturalness: Muundo wa simulizi unahitaji kusawazishwa kidogo. “Na akaelekeza” baada ya mfululizo wa vitenzi vya ka- unasikika wenye uradidi wa kiunganishi; “akaelekeza” peke yake ni laini zaidi. “Eneo la milima” ni usemi wa kawaida zaidi kuliko “nchi ya milima” katika muktadha huu wa kijiografia.
  terminology: “Gileadi” ni umbo linalofaa. Kwa tanbihi, “mto Frati” hulingana na matumizi ya Biblia ya Kiswahili kwa Euphrates. Nahau “akaelekeza uso wake” yahifadhiwa bila kuiongezea maana ya kiteolojia au ya kihisia.
