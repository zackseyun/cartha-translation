translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa hatua mfululizo na nahau ya “kuelekeza uso” vimehifadhi ladha ya Kiebrania bila kufanya sentensi kuwa ngumu.
