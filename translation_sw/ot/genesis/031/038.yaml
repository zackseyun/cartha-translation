    text: Au, “hawakupoteza watoto wao.” Kitenzi cha Kiebrania kinaweza kumaanisha kupokonywa watoto; katika muktadha huu wa ufugaji kinarejelea kuharibika mimba au kupoteza watoto.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: Kwa miaka hii ishirini
  rationale: Muundo huu wa Kiswahili unaonyesha kipindi chote cha miaka ishirini hadi wakati wa kusema, huku ukihifadhi nguvu ya kiashiria זֶה.
- source_word: אָנֹכִי עִמָּךְ
  choice: nimekuwa pamoja nawe
  rationale: Ingawa Kiebrania hakina kitenzi dhahiri hapa, muktadha unaeleza hali iliyoendelea kwa miaka ishirini; wakati timilifu wa Kiswahili unafaa kwa kipindi hicho kinachofikia wakati wa kusema.
- source_word: רְחֵלֶיךָ
  choice: kondoo wako wa kike
  rationale: Neno la Kiebrania linataja hasa kondoo wa kike; usemi huu ni wazi kwa wasomaji wa kawaida kuliko istilahi adimu.
- source_word: וְעִזֶּיךָ
  choice: mbuzi wako wa kike
  rationale: Umbo la Kiebrania linarejelea mbuzi wa kike, na tafsiri hii inahifadhi ubainifu huo kwa Kiswahili cha kawaida.
- source_word: לֹא שִׁכֵּלוּ
  choice: hawakuharibu mimba
  rationale: Katika muktadha wa mifugo, kitenzi kinaweza kumaanisha kupoteza watoto au kuharibika kwa mimba; usemi huu unaeleza maana kuu kwa ufupi bila kuficha mbadala wa kileksika.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: kondoo dume wa kundi lako
  rationale: אֵילִים ni kondoo dume waliokomaa; tafsiri inahifadhi aina ya mnyama na uhusiano wake na kundi la Labani.
- source_word: לֹא אָכָלְתִּי
  choice: sijawala
  rationale: Wakati timilifu hasi unaonyesha mwenendo wa Yakobo katika kipindi chote alichokitaja, na kiambishi cha ngeli kinarejelea kondoo dume.
