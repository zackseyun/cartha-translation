  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: sw
  text: Kwa miaka hii ishirini nimekuwa nawe. Kondoo wako wa kike na mbuzi wako wa kike hawakuharibika mimba[a], wala sikula kondoo dume wa kundi lako.
  philosophy: optimal-equivalence
  footnotes:
