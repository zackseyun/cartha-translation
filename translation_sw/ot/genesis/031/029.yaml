base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: sw
  text: Nina uwezo wa kuwadhuru, lakini Mungu wa baba yenu aliniambia usiku uliopita, ‘Jihadhari, usiseme na Yakobo jambo lolote, liwe jema au baya[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka jema hadi baya,” nahau inayomaanisha jambo lolote—liwe la kufaa au lisilofaa.'
    reason: Nahau ya asili inaonyesha wigo mzima wa usemi; tanbihi imewekwa kwenye tafsiri ya nahau hiyo.
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: Nina uwezo
  rationale: Nahau ya Kiebrania inaeleza kuwa jambo liko ndani ya uwezo wa msemaji; Kiswahili hiki ni cha kawaida na kinahifadhi maana hiyo.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: wa kuwadhuru
  rationale: רָע hapa inamaanisha tendo lenye kuleta madhara kwa wanaoambiwa, si uovu wa kinadharia tu.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: lakini Mungu wa baba yenu
  rationale: Kiunganishi kinaonyesha tofauti kati ya uwezo wa Labani na zuio la Mungu. Umbo la 'yenu' linahifadhi kiambishi cha wingi katika maandishi ya Kiebrania badala ya kukisawazisha kimya kimya.
- source_word: אֶמֶשׁ
  choice: usiku uliopita
  rationale: Neno hilo katika muktadha huu linarejelea usiku uliotangulia.
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Amri hii ina nguvu ya onyo la moja kwa moja na ni ya asili katika Kiswahili sanifu.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: usiseme na Yakobo
  rationale: Muundo wa הִשָּׁמֶר pamoja na מִן unaonyesha katazo; tafsiri hii inatoa katazo hilo kwa uwazi.
- source_word: מִטּוֹב עַד רָע
  choice: lolote, jema wala baya
  rationale: Kauli hii ya ncha mbili inahusu wigo mzima wa usemi. 'Lolote' huonyesha maana yake ya nahau, huku 'jema wala baya' ikihifadhi picha ya Kiebrania.
theological_decisions:
- issue: Tafsiri ya אֱלֹהִים katika kauli kuhusu Mungu aliyemwonya Labani
  choice: Mungu wa baba yenu
  alternative: Mungu wa baba yako
  rationale: Tafsiri inahifadhi kiambishi cha wingi cha אֲבִיכֶם kama kilivyo katika maandishi ya WLC, bila kuamua kimya kimya kwamba lazima kielekezwe kwa Yakobo peke yake. Rejeo kwa Mungu linabaki la kibinafsi na la kimuktadha bila kuingiza fundisho la baadaye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Kuwadhuru' na 'Jihadhari' ni maneno ya kawaida lakini yenye uzito unaofaa simulizi. Kauli 'lolote, jema wala baya' inasomeka kwa urahisi na kuhifadhi mvutano wa nahau ya Kiebrania.
