  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: sw
  text: Labani akasema, “Rundo hili ni shahidi kati yangu na wewe leo.” Kwa hiyo akaliita Galeedi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Galeedi hufanana kwa sauti na maneno ya Kiebrania yenye maana “rundo la shahidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa simulizi wa waw-consecutive unaendeleza tukio; “akasema” ni wa kawaida na wa asili katika simulizi la Kiswahili.
- source_word: לָבָן
  choice: Labani
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: הַגַּל הַזֶּה
  choice: rundo hili
  rationale: גַּל hapa ni rundo la mawe; “rundo” linaeleweka kwa urahisi na linaacha muktadha ubainishe kwamba ni la mawe.
- source_word: עֵד
  choice: shahidi
  rationale: Rundo linatajwa kama shahidi wa makubaliano kati ya wahusika; “shahidi” huhifadhi taswira ya kisheria na ya agano.
- source_word: בֵּינִי וּבֵינְךָ
  choice: kati yangu na wewe
  rationale: Huhifadhi usemi wa moja kwa moja wa Kiebrania unaowataja pande zote mbili katika umoja.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya kawaida na ya sasa ya kielezi hiki cha wakati.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Huonyesha wazi uhusiano wa sababu unaotanguliza maelezo ya jina.
- source_word: קָרָא שְׁמוֹ
  choice: akaliita jina lake
  rationale: Kitenzi cha umoja kinaweza kumrejelea Labani; muundo huu unafuata nahau ya Kiebrania ya kutoa jina huku ukiendelea kueleweka katika Kiswahili.
- source_word: גַּלְעֵד
  choice: Galeedi
  rationale: Jina limetoholewa badala ya kutafsiriwa katika matini kuu; mchezo wake wa maneno unaelezwa katika tanbihi.
