  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: sw
  text: Kama Mungu wa baba yangu, Mungu wa Abrahamu, na Hofu ya Isaka[a], asingekuwa pamoja nami, hakika kufikia sasa ungenifukuza nikiwa mikono mitupu. Mungu aliona mateso yangu na juhudi ya mikono yangu, naye akahukumu jana usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule ambaye Isaka anamwogopa.” Kiebrania kinasema moja kwa moja “Hofu ya Isaka,” jina la pekee linalotumiwa kumrejelea Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: Kama ... asingekuwa
  rationale: Muundo huu wa Kiswahili unaonyesha sharti lisilotimia katika wakati uliopita, kama ilivyo katika Kiebrania.
- source_word: אֱלֹהֵי אָבִי
  choice: Mungu wa baba yangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mnyororo wa umilikaji, ikihifadhi uhusiano wa Yakobo na Mungu wa baba yake.
- source_word: וּפַחַד יִצְחָק
  choice: na Hofu ya Isaka
  rationale: Inahifadhi jina la pekee la Mungu lililo katika Kiebrania badala ya kulifafanua kimyakimya; maana inayowezekana imeelezwa katika tanbihi.
- source_word: הָיָה לִי
  choice: asingekuwa pamoja nami
  rationale: Katika muktadha huu, usemi huo unaonyesha kuwapo kwa Mungu upande wa Yakobo na kumsaidia.
- source_word: רֵיקָם
  choice: mikono mitupu
  rationale: Ni nahau ya asili ya Kiswahili kwa kuondoka bila mali, ujira, au chochote alichostahili.
- source_word: עָנְיִי
  choice: mateso yangu
  rationale: Neno hili linaonyesha hali ya kudhulumiwa na kutaabika kwa Yakobo, si umaskini wa mali peke yake.
- source_word: יְגִיעַ כַּפַּי
  choice: taabu ya mikono yangu
  rationale: Inahifadhi taswira ya Kiebrania ya kazi ngumu iliyofanywa kwa mikono huku ikieleweka kwa urahisi.
- source_word: וַיּוֹכַח
  choice: naye akahukumu
  rationale: Kitenzi kinaweza kumaanisha kuhukumu, kuamua mgogoro, au kukemea. Tafsiri hii inahifadhi wazo la uamuzi wa Mungu bila kuongeza mtendewa ambaye hatajwi wazi katika Kiebrania.
- source_word: אָמֶשׁ
  choice: jana usiku
  rationale: Ni usemi wa kawaida wa Kiswahili unaolingana na ‘usiku uliopita’ katika muktadha wa simulizi.
theological_decisions:
- issue: Jina la Mungu וּפַחַד יִצְחָק
  choice: Hofu ya Isaka
  alternative: Yule ambaye Isaka anamwogopa
  rationale: Kiebrania kinatumia jina lisilo la kawaida na lenye uzito wa kitheolojia. Kulihifadhi katika matini kuu huepuka kuamua mapema ikiwa maana ni Mungu anayeogopwa na Isaka au dhana pana zaidi ya hofu inayohusishwa naye.
- issue: Maana ya וַיּוֹכַח katika muktadha
  choice: akahukumu
  alternative: akakemea; akaamua kati yetu
  rationale: Muktadha unahusisha onyo la Mungu kwa Labani, lakini kitenzi chenyewe kina maana za kimahakama na za kukemea. ‘Akahukumu’ huhifadhi upana huo na haiongezi yambwa lisilotajwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Nahau “mikono mitupu” imetumiwa kwa uwazi wa kawaida, huku “Hofu ya Isaka” ikihifadhi upekee na mvutano wa matini ya Kiebrania.
