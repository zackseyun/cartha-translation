  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: sw
  text: Sikukuletea mnyama aliyeraruliwa na wanyama wa mwitu; mimi mwenyewe nilifidia hasara yake.[a] Ulikidai kutoka mkononi mwangu kile kilichoibwa mchana na kile kilichoibwa usiku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mimi mwenyewe nilibeba wajibu wa hasara yake.” Kitenzi cha Kiebrania hapa kinaweza kumaanisha kubeba dhima ya hasara hiyo au kuifidia.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri isiyo ya kinahau sana: “Ulikidai kutoka kwangu kile kilichoibwa mchana na kile kilichoibwa usiku.”'
    reason: source_idiom
lexical_decisions:
- source_word: טְרֵפָה
  choice: mnyama aliyeraruliwa na wanyama wa mwitu
  rationale: Katika muktadha wa ufugaji, neno hili linamaanisha mnyama wa mifugo aliyeraruliwa na wanyama wawindaji. Tafsiri hii inaweka wazi picha halisi bila kuifanya iwe ya jumla kupita kiasi.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: sikukuletea
  rationale: Kitenzi pamoja na אֶל huonyesha kuleta kitu kwa mtu. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi msisitizo wa Yakobo kwamba hakumpelekea Labani mnyama wa aina hiyo.
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: mimi mwenyewe nilifidia hasara yake
  rationale: Kiwakilishi huru אָנֹכִי kinaongeza msisitizo, kwa hiyo kimetafsiriwa 'mimi mwenyewe.' Katika muktadha huu, umbo la חטא lina maana ya kubeba wajibu wa hasara au kuifidia.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: Ulinidai
  rationale: Nahau ya Kiebrania inaonyesha kudai kitu kutoka kwa mtu anayewajibika. 'Ulinidai' ni Kiswahili cha kawaida kinachowasilisha madai na uwajibikaji bila kulazimisha picha ya 'kutoka mkononi mwangu.'
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: kile kilichoibwa mchana na kile kilichoibwa usiku
  rationale: Kiunganishi וּ ni cha kujumlisha, si cha kutenganisha. Kurudia 'kile kilichoibwa' kunahifadhi usambamba wa Kiebrania na kuonyesha makundi yote mawili ya hasara ambayo Yakobo alidaiwa.
