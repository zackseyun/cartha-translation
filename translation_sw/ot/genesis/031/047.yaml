  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni mfupi, wa kisimulizi na wenye hadhi. Majina Labani na Yakobo yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili, na majina mawili ya rundo yamehifadhiwa ili tofauti ya lugha kati ya Kiaramu na Kiebrania ibaki wazi.
