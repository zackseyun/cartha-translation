  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: sw
  text: Labani akaliita Yegar-Sahadutha[a], lakini Yakobo akaliita Galedi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yegar-Sahadutha ni jina la Kiaramu linalomaanisha “rundo la ushuhuda.”
    reason: lexical_alternative
  - marker: b
    text: Galedi ni jina la Kiebrania linalomaanisha “rundo la ushuhuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לּוֹ
  choice: akaliita
  rationale: Kitenzi קרא katika muktadha wa kutoa jina kimetafsiriwa ‘kuita’; kiambishi ‘-li-’ kinarejelea rundo la mawe lililotajwa katika muktadha, na ‘aka-’ kinaendeleza mtiririko wa simulizi.
- source_word: לָבָן
  choice: Labani
  rationale: Hili ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: Yegar-Sahadutha
  rationale: Jina la Kiaramu limenukuliwa kwa sauti badala ya kutafsiriwa katika matini kuu, ili kuhifadhi tendo la kulipa rundo jina; maana yake imewekwa katika tanbihi.
- source_word: וְיַעֲקֹב
  choice: lakini Yakobo
  rationale: Ingawa וְ kwa msingi humaanisha ‘na’, hapa inaonyesha tofauti kati ya jina la Kiaramu alilotumia Labani na jina la Kiebrania alilotumia Yakobo; ‘lakini’ huonyesha ulinganisho huo kwa Kiswahili cha kawaida.
- source_word: קָרָא לּוֹ
  choice: akaliita
  rationale: Muundo uleule wa kutoa jina umerudiwa kwa uthabiti; kiambishi cha yambwa kinarejelea rundo la mawe.
- source_word: גַּלְעֵד
  choice: Galedi
  rationale: Jina la Kiebrania limenukuliwa kwa umbo linalosomeka kwa urahisi katika Kiswahili, huku maana yake ikielezwa katika tanbihi.
theological_decisions: []
