  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyumbani mwako,’ ‘nilikutumikia,’ na ‘ujira’ ni maneno yanayoeleweka kwa urahisi huku yakihifadhi uzito wa malalamiko ya Yakobo. Alama ya nukta mkato imetumiwa kutenganisha muda wa huduma na hitimisho la shtaka.
