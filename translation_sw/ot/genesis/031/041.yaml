base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: sw
  text: Miaka hii ishirini nimekuwa nyumbani mwako:[a] nilikutumikia miaka kumi na minne kwa ajili ya binti zako wawili, na miaka sita kwa ajili ya kundi lako; nawe ukabadilisha ujira wangu mara kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa miaka hii ishirini nimekuwa nyumbani mwako.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: Miaka hii ishirini
  rationale: Kauli hii ya muda huhitimisha kipindi ambalo Yakobo ametoka kulieleza. Mpangilio huu ni wa kawaida katika Kiswahili na unadumisha nguvu ya kiashiria זֶה pamoja na wazo la kipindi kilichomhusu msemaji.
- source_word: בְּבֵיתֶךָ
  choice: nyumbani mwako
  rationale: בַּיִת ni ‘nyumba’ na inaweza pia kumaanisha kaya. ‘Nyumbani mwako’ ni Kiswahili cha kawaida kinachohifadhi maana ya mahali bila kuibana kwa jengo peke yake.
- source_word: עֲבַדְתִּיךָ
  choice: Nilikutumikia
  rationale: Kitenzi עבד hapa kinamaanisha kazi au huduma aliyomfanyia Labani. ‘Nilikutumikia’ huhifadhi maana zote mbili za uhusiano na kazi kuliko ‘nilikufanyia kazi’ pekee.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: miaka kumi na minne kwa ajili ya binti zako wawili
  rationale: Kihusishi בְּ huonyesha hapa kile ambacho huduma ilitolewa ili kipatikane. ‘Kwa ajili ya’ kinaeleza mpango wa huduma ya mahari bila kuongeza ufafanuzi usio katika mstari.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: na miaka sita kwa ajili ya mifugo yako
  rationale: צֹאן ni kundi la wanyama wadogo wa kufugwa, hasa kondoo na mbuzi. ‘Mifugo’ ni pana vya kutosha kutoifanya iwe kondoo tu, ingawa ni pana kidogo kuliko neno la Kiebrania.
- source_word: וַתַּחֲלֵף
  choice: nawe ukabadilisha
  rationale: Hifili ya חלף humaanisha kubadilisha au kuweka kitu kingine badala yake. Muundo huu rahisi unaendana na muhtasari wa malalamiko ya Yakobo; urudiaji unaonyeshwa na ‘mara kumi.’
- source_word: מַשְׂכֻּרְתִּי
  choice: ujira wangu
  rationale: מַשְׂכֹּרֶת humaanisha mshahara au malipo ya kazi. ‘Ujira wangu’ ni neno la heshima na lililo wazi katika muktadha wa kazi.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: mara kumi
  rationale: Huu ni usemi wa Kiebrania unaomaanisha mabadiliko ya kurudiwa. Tafsiri halisi kama ‘hesabu kumi’ ingekuwa ngumu kueleweka na isingewasilisha maana ya usemi huo.
