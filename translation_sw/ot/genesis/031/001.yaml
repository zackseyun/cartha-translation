base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: sw
  text: Yakobo akasikia maneno ya wana wa Labani, wakisema, “Yakobo amechukua kila kitu kilichokuwa cha baba yetu, na kutokana na mali ya baba yetu amejipatia utajiri wote huu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utukufu huu wote.” Neno la Kiebrania linaweza kumaanisha heshima, utukufu, au utajiri wa mali; hapa linarejelea ustawi wa Yakobo ulioonekana wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Yakobo akasikia
  rationale: Kitenzi cha mfululizo wa masimulizi kinaendeleza simulizi. Jina ‘Yakobo’ limetajwa wazi kwa kuwa ndiye mhusika anayerejelewa katika muktadha, na kufanya sentensi ya Kiswahili ieleweke kwa urahisi.
- source_word: דִּבְרֵי בְנֵי לָבָן
  choice: maneno ya wana wa Labani
  rationale: Huhifadhi usemi halisi ‘maneno’ na kutafsiri muundo wa umilikaji kwa Kiswahili cha kawaida.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida wa Kiebrania kwa maneno yanayonukuliwa moja kwa moja; ‘wakisema’ ni wa asili na wazi katika Kiswahili.
- source_word: לָקַח
  choice: amechukua
  rationale: Huwasilisha shtaka lao kuhusu tendo lililokamilika lenye matokeo ya sasa bila kuongeza maana kali ya kunyakua kwa nguvu.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: kila kitu kilichokuwa cha baba yetu
  rationale: Muundo wenye לְ unaonyesha umilikaji; tafsiri hii ni ya kawaida na inahifadhi wazo la vitu vyote vilivyokuwa mali ya baba yao.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: na kutokana na mali ya baba yetu
  rationale: מִן inaonyesha chanzo. ‘Mali’ hufanya maana ya umilikaji iwe wazi huku marudio ya ‘baba yetu’ yakihifadhi msisitizo wa Kiebrania.
- source_word: עָשָׂה
  choice: amejipatia
  rationale: Ingawa maana ya msingi ni ‘amefanya/ametengeneza,’ pamoja na utajiri kama shamirisho kitenzi kinaonyesha kupata au kujikusanyia mali. ‘Amejipatia’ ni Kiswahili cha asili na kinaonyesha kwamba utajiri ulikuwa faida yake.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: utajiri huu wote
  rationale: כָּבוֹד mara nyingi humaanisha heshima au utukufu, lakini hapa inarejelea wazi ustawi na mali nyingi za Yakobo. ‘Utajiri’ inafaa zaidi katika muktadha; maana mbadala imehifadhiwa katika tanbihi.
