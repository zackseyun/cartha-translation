  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: sw
  text: Kwa kuwa umepekua mali zangu zote, umepata nini miongoni mwa mali zote za nyumba yako? Kiweke hapa mbele ya ndugu zangu na ndugu zako[a], nao wahukumu kati yetu sisi wawili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “ndugu” linaweza pia kumaanisha jamaa.
    reason: lexical_alternative
  - marker: b
    text: Au “waamue” au “wasuluhishe” kati yetu sisi wawili. Kitenzi cha Kiebrania kinaweza kuwa na maana ya kimahakama au ya usuluhishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: umepekua
  rationale: Kitenzi hiki kimsingi huhusisha kugusa au kupapasa wakati wa kutafuta. Katika muktadha wa kuchunguza mali kwa makini, “umepekua” ni Kiswahili cha kawaida kinachohifadhi wazo la utafutaji wa kina.
- source_word: כָּל כֵּלַי / מִכֹּל כְּלֵי בֵיתֶךָ
  choice: vitu vyangu vyote / miongoni mwa vitu vyote vya nyumba yako
  rationale: כְּלִי hapa ni neno pana kwa vitu au mali inayohamishika, si vyombo pekee. Kurudia “vitu” kunahifadhi urudiaji wa neno la Kiebrania, na “miongoni mwa” huonyesha maana ya sehemu ya jumla ya מִן.
- source_word: מַה מָּצָאתָ
  choice: umepata nini
  rationale: Hili ni swali la moja kwa moja kuhusu matokeo ya upekuzi uliokamilika; Kiswahili hutumia kauli hii kwa ufasaha.
- source_word: שִׂים כֹּה
  choice: Kiweke hapa
  rationale: Amri inataka kitu chochote kinachodaiwa kupatikana kiwekwe wazi mbele ya mashahidi. Kiambishi cha umoja “ki-” kinarejelea “nini,” yaani kitu chochote kilichopatikana.
- source_word: נֶגֶד
  choice: mbele ya
  rationale: Neno hili linaonyesha kuweka kitu wazi katika uwepo na mbele ya watu wanaoshuhudia.
- source_word: אַחַי וְאַחֶיךָ
  choice: ndugu zangu na ndugu zako
  rationale: “Ndugu” huhifadhi neno la kawaida la kifamilia huku Kiswahili pia likiruhusu maana pana ya jamaa kulingana na muktadha.
- source_word: וְיוֹכִיחוּ
  choice: nao wahukumu
  rationale: Katika muktadha huu, Hifili ya יכח ina maana ya kimahakama ya kuhukumu, kuamua, au kusuluhisha mgogoro. “Wahukumu” huhifadhi uzito huo bila kuamua zaidi ya chanzo.
- source_word: בֵּין שְׁנֵינוּ
  choice: kati yetu sisi wawili
  rationale: Tafsiri hii inahifadhi wazi msisitizo wa Kiebrania kwamba mgogoro ni kati ya watu hao wawili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Umepekua” ni cha kawaida na chenye nguvu ya kimuktadha; “wahukumu” hudumisha uzito wa mwito wa hadharani wa kuamua mgogoro.
