base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: sw
  text: Kama utawatendea vibaya binti zangu, au ukioa wake wengine pamoja na binti zangu—ingawa hakuna mtu pamoja nasi[a]—tazama, Mungu ni shahidi kati yangu na wewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna mtu pamoja nasi”; maana yake ni kwamba hakuna shahidi wa kibinadamu aliyepo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: utawatendea vibaya
  rationale: Kitenzi cha Kiebrania katika muktadha huu kinaonyesha kuwasababishia binti za Labani mateso au kuwatendea isivyofaa katika ndoa. Kauli hii ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: בְּנֹתַי
  choice: binti zangu
  rationale: Huhifadhi umilikishi wa nafsi ya kwanza na wingi, na imerudiwa mara mbili kama ilivyo katika Kiebrania.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: ukioa wake wengine zaidi ya binti zangu
  rationale: Kirai hiki kinamaanisha kuoa wanawake wa nyongeza pamoja na binti zake Labani, si kuwaacha na kuwaoa wengine badala yao.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: ingawa hakuna mtu pamoja nasi
  rationale: “Mtu” ni tafsiri ya asili ya אִישׁ hapa, kwa kuwa hoja ni kutokuwapo kwa shahidi yeyote wa kibinadamu. “Ingawa” huonyesha nguvu ya kimuktadha ya kauli hiyo bila kuifanya kuwa sehemu ya sharti.
- source_word: רְאֵה
  choice: tazama
  rationale: Amri hii inaelekeza fikra kwa uzito kwenye tamko linalofuata na kuhifadhi udhahiri wa Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika agano hili neno linamtaja Mungu mmoja anayeitwa kuwa shahidi.
- source_word: עֵד
  choice: shahidi
  rationale: Huhifadhi lugha rasmi ya ushahidi katika agano.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: kati yangu na wewe
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha uwajibikaji wa pande hizi mbili mbele ya Mungu.
theological_decisions:
- issue: Maana ya אִישׁ katika kauli kuhusu kutokuwapo kwa shahidi wa kibinadamu
  choice: hakuna mtu pamoja nasi
  alternative: hakuna mwanamume pamoja nasi
  rationale: Katika muktadha, jambo linalosisitizwa si jinsia ya mtu ambaye hayupo bali kutokuwapo kwa shahidi wa kibinadamu. “Mtu” huwasilisha maana hiyo kwa usahihi na kwa Kiswahili cha kawaida bila kuongeza dai lisilo lazima.
- issue: Uhusiano wa אֵין אִישׁ עִמָּנוּ na masharti yaliyotangulia
  choice: ingawa hakuna mtu pamoja nasi
  alternative: hakuna mtu pamoja nasi
  rationale: Kauli inaweza kusomwa moja kwa moja kama taarifa, lakini kimuktadha ina nguvu ya kukubali kwamba hakuna shahidi wa kibinadamu huku Mungu akiwa shahidi. “Ingawa” huleta uhusiano huo wazi, na tafsiri ya moja kwa moja imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sharti, onyo la ndoa za nyongeza, na tamko rasmi la Mungu kuwa shahidi vimehifadhiwa.
