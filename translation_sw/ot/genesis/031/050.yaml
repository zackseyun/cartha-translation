  terminology: “utawatendea vibaya,” “binti zangu,” “Mungu,” and “shahidi” are appropriate. “wake wengine pamoja na binti zangu” clearly expresses the Hebrew idiom’s sense of taking additional wives while retaining the daughters as wives.
