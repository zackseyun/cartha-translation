translation:
  language: sw
  text: Ndipo Yakobo akamjibu Labani, “Kwa sababu niliogopa, maana nilisema[a], ‘Usije ukawanyakua binti zako kutoka kwangu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maana nilijiambia” au “maana nilifikiri.” Kitenzi cha Kiebrania ni “nilisema,” lakini hapa kinaweza kumaanisha usemi wa moyoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akamjibu
  rationale: Katika Kiswahili, kitenzi ‘akamjibu’ kwa kawaida kinatosha kuwasilisha kauli ya Kiebrania ‘akajibu akasema’ bila uradidi usio wa kawaida, huku maana ya mazungumzo ikihifadhiwa.
- source_word: כִּי יָרֵאתִי
  choice: Ni kwa sababu niliogopa
  rationale: כִּי ya kwanza inatoa sababu ya kitendo cha Yakobo; ‘Ni kwa sababu’ huonyesha jibu hilo wazi na kwa Kiswahili cha kawaida.
- source_word: כִּי אָמַרְתִּי
  choice: maana nilisema
  rationale: Tafsiri hii inadumisha kitenzi cha Kiebrania אמר (‘kusema’) na kuacha wazi ikiwa Yakobo alisema kwa sauti au moyoni; dokezo linaeleza uwezekano wa usemi wa ndani.
- source_word: פֶּן
  choice: Usije uka-
  rationale: Muundo huu wa Kiswahili huonyesha hofu ya jambo linaloweza kutokea, sawasawa na nguvu ya tahadhari ya פֶּן.
- source_word: תִּגְזֹל
  choice: ukawanyakua
  rationale: גזל humaanisha kunyakua au kuchukua isivyo halali, mara nyingi kwa nguvu. ‘Kuwanyakua’ huhifadhi nguvu hiyo kuliko ‘kuwachukua’ pekee.
- source_word: בְּנוֹתֶיךָ מֵעִמִּי
  choice: binti zako kutoka kwangu
  rationale: Huhifadhi uhusiano wa Labani na binti zake pamoja na wazo la kuwatenganisha na Yakobo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida. ‘Kuwanyakua’ ni neno lenye nguvu linaloakisi kuchukuliwa kwa nguvu au isivyo halali; uradidi wa Kiebrania ‘akajibu akasema’ umefupishwa kwa kawaida kuwa ‘akamjibu.’
