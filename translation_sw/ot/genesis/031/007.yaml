  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: sw
  text: Lakini baba yenu amenidanganya[a] na amebadili ujira wangu mara kumi[b], lakini Mungu hakumruhusu kunidhuru[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amenitendea kwa dhihaka” au “amenihadaa.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtendea mtu kwa udanganyifu au kwa dhihaka.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mara kumi,” usemi unaoweza kumaanisha mara nyingi, si lazima hesabu kamili ya mabadiliko.
    reason: cultural_note
  - marker: c
    text: Kihalisi, “Mungu hakumpa ruhusa ya kunidhuru,” yaani Mungu hakumruhusu kunidhuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: amenidanganya
  rationale: Katika Hiphil, kitenzi hiki kinaweza kueleza kumtendea mtu kwa udanganyifu au kwa dhihaka. Katika muktadha wa Labani kubadili ujira wa Yakobo, “amenidanganya” huonyesha kwa uwazi kutokuwa mwaminifu bila kuondoa uwezekano wa kutendewa kwa dharau, unaotajwa katika tanbihi.
- source_word: וְהֶחֱלִיף
  choice: na kubadili
  rationale: Hapa kitenzi kinamaanisha kugeuza mara kwa mara masharti ya malipo yaliyokubaliwa. “Kubadili” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: מַשְׂכֻּרְתִּי
  choice: ujira wangu
  rationale: Nomino hii humaanisha malipo yanayotolewa kwa kazi. “Ujira wangu” ni usemi wa heshima, unaoeleweka, na unaofaa mazingira ya ajira.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: mara kumi
  rationale: Usemi huu wa Kiebrania huonyesha kurudiwa kwa tendo mara nyingi, ingawa huenda si hesabu kamili. Tafsiri ya moja kwa moja “mara kumi” inadumisha taswira ya chanzo.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: Hata hivyo, Mungu hakumruhusu
  rationale: Kihalisi ni “Mungu hakumpa,” lakini katika muundo huu maana ni kwamba Mungu hakumpa nafasi au ruhusa ya kutenda madhara. “Hakumruhusu” huwasilisha nahau hiyo kwa Kiswahili cha kawaida.
- source_word: לְהָרַע עִמָּדִי
  choice: kunidhuru
  rationale: Muundo huu humaanisha kumtendea mtu vibaya au kumletea madhara. “Kunidhuru” ni mfupi, wa asili, na mwaminifu kwa maana.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika usemi wa Yakobo, neno hili linamtaja Mungu, hivyo “Mungu” ndiyo tafsiri inayofaa.
theological_decisions:
- issue: Kuzuia kwa Mungu kunakoelezwa na nahau “Mungu hakumpa”
  choice: Mungu hakumruhusu Labani kumdhuru Yakobo
  alternative: Mungu hakumtia Yakobo mikononi mwa Labani; au Mungu hakumwacha Labani afanikiwe kumdhuru Yakobo
  rationale: Kiebrania kinamwonyesha Mungu akizuia madhara ya Labani, lakini hakielezi kwa undani namna ya kuzuia huko. “Hakumruhusu” huhifadhi utawala na ulinzi wa Mungu bila kuongeza maelezo yasiyokuwapo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ujira” hudumisha muktadha wa malipo ya kazi; “amenidanganya” ni wazi kwa msomaji wa kawaida. Viunganishi “Lakini” na “Hata hivyo” vinaonyesha tofauti mbili za hoja bila kufanya sentensi kuwa nzito.
