  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: sw
  text: Akawaswaga mifugo yake yote, akachukua mali yake yote aliyokuwa amejipatia—mifugo aliyokuwa amejipatia huko Padan-Aramu—ili aende kwa Isaka baba yake katika nchi ya Kanaani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili aende kwa Isaka baba yake, katika nchi ya Kanaani.” Kiebrania hutumia umbo la mwelekeo, linaloweza kusisitiza kwenda kuelekea nchi ya Kanaani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: Akawaswaga
  rationale: Kitenzi נהג katika muktadha wa kichungaji humaanisha kuwafanya wanyama waende mbele; “kuwaswaga” ni neno la kawaida na mahususi kwa kuendesha mifugo.
- source_word: מִקְנֵהוּ
  choice: mifugo yake yote
  rationale: מִקְנֶה ni jina la jumla kwa wanyama wanaofugwa; “mifugo” halifungii maana kwenye ng’ombe pekee.
- source_word: רְכֻשׁוֹ
  choice: mali yake yote
  rationale: רְכוּשׁ hurejelea mali au vitu vilivyomilikiwa; “mali” ni pana, la asili, na linaeleweka kwa urahisi.
- source_word: רָכָשׁ
  choice: aliyokuwa amejipatia
  rationale: Kitenzi hiki kinasisitiza kupata mali. “Kujipatia” huhifadhi maana hiyo na kurudiwa kwake katika mstari.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: mifugo aliyokuwa amejipatia
  rationale: Kirai hiki kinarudia na kusisitiza upatikanaji wa mifugo. Tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi urudiaji wa Kiebrania.
- source_word: בְּפַדַּן אֲרָם
  choice: huko Padan-Aramu
  rationale: Jina la mahali limetoholewa kwa tahajia inayoeleweka katika Kiswahili; “huko” linaonyesha mahali pa mbali ambako mali ilipatikana.
- source_word: לָבוֹא
  choice: akaenda
  rationale: Infinitivu inaonyesha kusudi la safari. Katika mtiririko wa simulizi wa Kiswahili, “akaenda” huwasilisha kwa kawaida hatua iliyolengwa bila kubadili maana.
- source_word: אַרְצָה כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Muundo wa Kiebrania una kiambishi cha mwelekeo kinachoonyesha kuelekea Kanaani. “Katika nchi ya Kanaani” ni Kiswahili cha asili kwa mahali alikokuwa Isaka, huku tanbihi ikihifadhi wazi maana mbadala ya mwelekeo.
