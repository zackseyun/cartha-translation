base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: sw
  text: Akamwambia baba yake, “Bwana wangu, usinikasirikie kwa kuwa siwezi kusimama mbele yako, maana nimepatwa na hali ya kawaida ya wanawake.”[a] Basi akatafuta, lakini hakuzipata sanamu za ibada za nyumbani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, alikuwa katika hedhi.
    reason: ufafanuzi_wa_nahau
  - marker: b
    text: 'Kiebrania: terafimu; vitu au sanamu zilizotumiwa katika ibada ya nyumbani.'
    reason: mbadala_wa_kileksia
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אָבִיהָ
  choice: Akamwambia baba yake
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida na kutaja wazi kuwa anayesemeshwa ni baba yake.
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: Bwana wangu asikasirike
  rationale: Hii ni nahau ya Kiebrania ya kuomba mtu asikasirike au asichukizwe. Tafsiri hii ni ya heshima na ya asili katika Kiswahili; “bwana wangu” hapa ni namna ya kumheshimu baba yake, si jina la Mungu.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: kwa sababu siwezi kusimama mbele yako
  rationale: Inahifadhi maana ya kimwili ya קום na wazo la kuwa mbele ya mtu mwenye kuheshimiwa.
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: maana nimepatwa na hali ya kawaida ya wanawake
  rationale: Kirai cha Kiebrania ni lugha ya staha inayorejelea hedhi. Tafsiri inadumisha staha hiyo huku tanbihi ikifafanua maana.
- source_word: וַיְחַפֵּשׂ וְלֹא מָצָא
  choice: Basi akatafuta, lakini hakuzipata
  rationale: “Basi” huendeleza matukio kwa ufasaha, na “lakini” huonyesha matokeo yaliyokwenda kinyume na lengo la utafutaji.
- source_word: הַתְּרָפִים
  choice: sanamu za ibada za nyumbani
  rationale: תְּרָפִים ni vitu au sanamu za kidini zilizotumiwa katika ibada ya nyumbani. Tafsiri hii inaeleza matumizi yake bila kuacha neno la kitaalamu lisiloeleweka kwa wasomaji wengi.
theological_decisions:
- issue: Maana ya תְּרָפִים
  choice: sanamu za ibada za nyumbani
  alternative: terafimu; miungu ya nyumbani
  rationale: Neno hilo hurejelea vitu vya ibada vya nyumbani, huenda sanamu. “Sanamu za ibada za nyumbani” hudhihirisha tabia yake ya kidini bila kudai kwa undani zaidi umbo au matumizi yake.
- issue: Lugha ya דֶרֶךְ נָשִׁים
  choice: hali ya kawaida ya wanawake
  alternative: niko katika hedhi; desturi ya wanawake imenipata
  rationale: Chanzo kinatumia lugha ya staha badala ya neno la moja kwa moja. Tafsiri inahifadhi mtindo huo, na tanbihi inaondoa uwezekano wa kutokueleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi wa Raheli kwa baba yake umehifadhi unyenyekevu wa chanzo, na lugha ya staha kuhusu hedhi imeachwa bila kuwa ya kitabibu kupita kiasi.
