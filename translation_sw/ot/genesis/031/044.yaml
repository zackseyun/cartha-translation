base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: sw
  text: Sasa basi, njoo, tufanye agano, mimi na wewe, nalo liwe shahidi kati yangu na wewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huendeleza mazungumzo kwa kuonyesha hatua inayofuata, huku ikihifadhi kiunganishi na wazo la wakati.
- source_word: לְכָה
  choice: njoo
  rationale: Ingawa limetokana na kitenzi cha kwenda au kutembea, hapa ni mwaliko wa kawaida wa kuanza tendo pamoja.
- source_word: נִכְרְתָה בְרִית
  choice: tufanye agano
  rationale: Kauli ya Kiebrania kwa neno ni ‘tukate agano,’ lakini maana yake ya kawaida ni kufanya au kuanzisha agano; Kiswahili cha kawaida hutumia ‘kufanya agano.’
- source_word: בְרִית
  choice: agano
  rationale: ‘Agano’ huhifadhi uzito wa makubaliano rasmi yenye kuwafunga wahusika, tofauti na ‘makubaliano’ ya kawaida.
- source_word: אֲנִי וָאָתָּה
  choice: mimi na wewe
  rationale: Huwataja wazi wahusika wote wawili na kufuata mpangilio wa Kiebrania.
- source_word: וְהָיָה לְעֵד
  choice: nalo liwe shahidi
  rationale: Umbo la ‘liwe’ hudumisha maana ya hiari au pendekezo inayofuatana na ‘tufanye’; ‘nalo’ hurejelea agano kwa upatanisho wa kisarufi wa Kiswahili.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: kati yangu na wewe
  rationale: Huhifadhi urejeo wa wazi kwa pande zote mbili badala ya kuufupisha kuwa ‘kati yetu.’
theological_decisions:
- issue: Kirejewa cha ‘liwe shahidi’
  choice: Kiwakilishi ‘nalo’ kinarejelea agano lililotajwa moja kwa moja.
  alternative: Kuelewa ushahidi kuwa jiwe au nguzo itakayotajwa baadaye.
  rationale: Katika mstari huu, nomino iliyo karibu na yenye kufaa kisarufi ni ‘agano’; tafsiri haiongezi kirejewa cha baadaye ambacho hakijatajwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Basi sasa’ ni mpito wa kawaida wa mazungumzo; ‘njoo’ ni mwaliko wa moja kwa moja; ‘agano’ hudumisha istilahi yenye uzito wa kibiblia bila kuwa ya dhehebu.
