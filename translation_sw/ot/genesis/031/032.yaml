base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: sw
  text: Yeyote utakayemkuta akiwa na miungu yako hataishi.[a] Mbele ya ndugu zetu,[b] tambua ni kitu gani chako kilicho kwangu, kisha ukichukue.” Yakobo hakujua kwamba Raheli alikuwa ameiba miungu hiyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo wa karibu zaidi na Kiebrania: “Mtu ambaye utampata akiwa na miungu yako.”'
    reason: lexical_alternative
  - marker: b
    text: Neno “ndugu” hapa linaweza kumaanisha kwa upana zaidi jamaa wa kiume au watu wa ukoo waliokuwapo, si lazima ndugu wa kuzaliwa tu.
    reason: cultural_note
  - marker: c
    text: Yaani, Raheli alikuwa ameiba miungu ya nyumbani ya Labani.
    reason: contextual_note
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: Yeyote ambaye utampata akiwa na
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi wazi kitenzi cha Kiebrania cha nafsi ya pili, ‘utampata,’ pamoja na wazo la mtu ambaye vitu vitapatikana kwake.
- source_word: אֱלֹהֶיךָ
  choice: miungu yako
  rationale: Hili ndilo neno la moja kwa moja katika kifungu hiki. Muktadha unaonyesha kuwa ni sanamu za nyumbani, lakini kifungu chenyewe kinasema ‘miungu yako.’
- source_word: לֹא יִחְיֶה
  choice: hataishi
  rationale: Kauli hii fupi inahifadhi nguvu ya hukumu au laana ya kifo bila kuamua zaidi ikiwa ni tamko la kisheria, matakwa, au utabiri.
- source_word: נֶגֶד אַחֵינוּ
  choice: Mbele ya ndugu zetu
  rationale: ‘Mbele ya’ huwasilisha maana ya uwepo wa mashahidi; ‘ndugu’ huhifadhi neno la chanzo ingawa linaweza kujumuisha jamaa wa kiume kwa upana.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: tambua kitu chako kilicho kwangu
  rationale: Kiebrania kina usemi uliofupishwa. ‘Kitu chako’ huweka wazi kwa Kiswahili kwamba Yakobo anamwambia Labani atambue mali yake miongoni mwa vitu vilivyo kwa Yakobo.
- source_word: וְקַח לָךְ
  choice: ukichukue
  rationale: Muundo huu unaunganisha amri ya pili kwa kawaida katika Kiswahili na kiambishi ‘-ki-’ kinarejelea kitu kitakachotambuliwa.
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: Yakobo hakujua
  rationale: Hii ni taarifa ya msimulizi inayotafsiriwa moja kwa moja na kwa ufasaha bila kulazimika kuanza na kiunganishi.
- source_word: כִּי רָחֵל גְּנָבָתַם
  choice: kwamba Raheli alikuwa ameiba miungu hiyo
  rationale: Wakati wa ‘alikuwa ameiba’ unaonyesha kuwa wizi ulitangulia kutokujua kwa Yakobo; kurudia ‘miungu hiyo’ ni wazi na kwa kawaida zaidi kuliko kiwakilishi cha wingi kisicho na rejeleo dhahiri katika Kiswahili.
theological_decisions:
- issue: Hali ya kauli לֹא יִחְיֶה
  choice: hataishi
  alternative: asiishi / atauawa
  rationale: ‘Hataishi’ huhifadhi mvutano wa chanzo kati ya laana, hukumu, na tamko lenye nguvu, bila kuongeza wazi mtendaji wa mauaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio unafuata chanzo kwa ukaribu huku ukitumia miundo ya kawaida ya Kiswahili; utata wa kauli ya kifo umehifadhiwa.
