  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Yakobo, “Rudi katika nchi ya baba zako na kwa jamaa zako[a], nami nitakuwa pamoja nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pako pa asili.” Neno la Kiebrania linaweza kumaanisha jamaa au mahali mtu alikozaliwa na alikotoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa usimulizi wenye waw-consecutive unaendeleza mfululizo wa matukio; “Ndipo” pamoja na kitenzi cha -ka- huleta mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: שׁוּב
  choice: Rudi
  rationale: Amri hii ina maana ya kurejea mahali alikotoka; “Rudi” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: katika nchi ya baba zako
  rationale: Kauli hii inahifadhi uhusiano wa nchi hiyo na mababu wa kiume wa Yakobo, kwa kufuata kwa karibu muundo wa Kiebrania.
- source_word: מוֹלַדְתֶּךָ
  choice: kwa jamaa zako
  rationale: Neno hilo linaweza kuelekeza kwa ukoo au mahali pa asili. Katika muktadha huu, baada ya kutajwa nchi, “jamaa zako” huwasilisha vizuri maana ya watu wa ukoo huku tanbihi ikihifadhi uwezekano wa maana ya kijiografia.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: nami nitakuwa pamoja nawe
  rationale: Hii ni ahadi ya moja kwa moja ya kuwapo kwa Mungu; usemi huu ni wa asili, wenye heshima, na unaweka wazi nafsi ya kwanza.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa simulizi umetolewa kwa “Ndipo ... aka-”; “pamoja nawe” hudumisha uzito wa ahadi ya kuwapo kwa Mungu.
