lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת לֵב
  choice: akamdanganya
  rationale: Kirai cha Kiebrania kwa maana halisi ni ‘akaiba moyo wa,’ lakini hapa ni nahau ya kutenda kwa siri na hivyo kumdanganya au kumshtukiza mtu. ‘Akamdanganya’ hutoa maana hiyo kwa Kiswahili cha kawaida bila kuleta wazo lisilokusudiwa la mapenzi.
- source_word: הָאֲרַמִּי
  choice: Mwaramu
  rationale: Hili ndilo jina la kikabila na kijiografia linalolingana moja kwa moja na ‘Aramean,’ badala ya ‘Msiria.’
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: kwa kutomwambia
  rationale: Muundo huu unaonyesha njia ambayo Yakobo alimdanganya Labani; tafsiri hii ni ya asili na huhifadhi nguvu ya kimatumizi ya kifungu.
- source_word: כִּי בֹרֵחַ הוּא
  choice: kwamba alikuwa anakimbia
  rationale: Muundo wa kitenzi kishirikishi unaonyesha tendo lililokuwa likiendelea au hali ya wakati huo; ‘alikuwa anakimbia’ huhifadhi hali hiyo bila kuligeuza kuwa nia tu.
