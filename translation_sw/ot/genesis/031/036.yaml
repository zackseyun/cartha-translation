base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: sw
  text: Ndipo Yakobo akakasirika, akabishana na Labani. Yakobo akajibu, akamwambia Labani, “Kosa langu ni nini? Dhambi yangu ni nini, hata ukanifuatilia[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kinaweza kudokeza kufuatilia kwa ukali; yaani, “ukaniandama kwa ukali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: Yakobo akakasirika
  rationale: Nahau hii ya Kiebrania inaonyesha hasira iliyowaka ndani ya mtu. ‘Akakasirika’ ni Kiswahili cha kawaida na chenye heshima kinachohifadhi mwanzo wa hali hiyo bila kulazimisha picha ya moto.
- source_word: וַיָּרֶב בְּלָבָן
  choice: na kubishana na Labani
  rationale: Kitenzi ריב hapa kina maana ya kushindana kwa maneno au kuingia katika mabishano. ‘Kubishana na’ ni cha asili katika Kiswahili na hakiongezi wazo maalumu la hukumu au karipio.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu, akamwambia
  rationale: Maneno haya yanahifadhi vitenzi vyote viwili vya simulizi ya Kiebrania huku yakisomeka kwa ufasaha katika Kiswahili.
- source_word: מַה פִּשְׁעִי
  choice: Kosa langu ni nini?
  rationale: פשע huonyesha kosa au uvunjaji wa wajibu, mara nyingi wa makusudi. ‘Kosa’ ni neno linaloeleweka kwa urahisi na linafaa katika dai la Yakobo la kujitetea bila kulazimisha maana nyembamba ya uasi.
- source_word: מַה חַטָּאתִי
  choice: Dhambi yangu ni nini?
  rationale: חטאת humaanisha dhambi au kosa. ‘Dhambi’ ni tafsiri ya moja kwa moja na inadumisha ulinganifu wa balagha na ‘kosa langu.’
- source_word: כִּי
  choice: hata
  rationale: Katika swali hili כִּי inaunganisha kosa linalodaiwa na hatua ya Labani ya kumfuatilia Yakobo. ‘Hata’ huleta kwa kawaida katika Kiswahili maana ya ‘kiasi kwamba’ bila kuamua zaidi uhusiano huo.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: ukanifuatilia hivi
  rationale: דלק katika muktadha huu ni kufuatilia au kuandama, huku mzizi wake ukiweza kudokeza ufuatiliaji mkali au wenye shauku. Matini kuu inatumia Kiswahili cha asili kisichopanua maana; kidokezo hicho kinaelezwa katika tanbihi.
