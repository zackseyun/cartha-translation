  text: וְ/רָחֵ֞ל לָקְחָ֣ה אֶת הַ/תְּרָפִ֗ים וַ/תְּשִׂמֵ֛/ם בְּ/כַ֥ר הַ/גָּמָ֖ל וַ/תֵּ֣שֶׁב עֲלֵי/הֶ֑ם וַ/יְמַשֵּׁ֥שׁ לָבָ֛ן אֶת כָּל הָ/אֹ֖הֶל וְ/לֹ֥א מָצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: sw
  text: Raheli alikuwa amezichukua sanamu za nyumbani[a], akaziweka ndani ya mto wa tandiko la ngamia[b], kisha akaketi juu yao. Labani akapapasa hema lote, lakini hakuzipata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “terafimu,” au “miungu ya nyumbani.” Neno la Kiebrania linamaanisha vitu vya ibada vya nyumbani.
    reason: lexical_alternative
  - marker: b
    text: Au “ndani ya tandiko la ngamia,” au “ndani ya vifaa vya tandiko la kubebea mizigo la ngamia.” Huenda neno la Kiebrania linamaanisha sehemu yenye ujazo laini ya vifaa vya kupandia ngamia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: sanamu za nyumbani
  rationale: Neno תְּרָפִים linamaanisha vitu vya ibada au miungu iliyohusishwa na kaya. “Sanamu za nyumbani” linaeleweka kwa urahisi na linadumisha wazo la vitu halisi vya ibada.
- source_word: בְּכַר הַגָּמָל
  choice: ndani ya mto wa tandiko la ngamia
  rationale: כַּר kwa kawaida ni mto au sehemu yenye ujazo laini; katika muktadha huu ni sehemu ya vifaa vya kupandia ngamia. Tafsiri hii inadumisha picha halisi bila kulifanya neno kuwa tandiko lote.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: kisha akaketi juu yake
  rationale: Kiswahili hutumia umoja kurejelea fungu lililofichwa ndani ya mto; usemi huu unaonyesha kitendo cha Raheli cha kuficha vitu hivyo kwa kuvikalia.
- source_word: וַיְמַשֵּׁשׁ
  choice: akapapasa
  rationale: Kitenzi מששׁ kinasisitiza kutafuta kwa kugusa, si kutafuta kwa ujumla tu. “Akapapasa” linahifadhi maana hiyo ya kutumia mikono.
- source_word: כָּל הָאֹהֶל
  choice: hema lote
  rationale: Hii ni tafsiri ya kawaida na ya asili ya כָּל pamoja na nomino yenye uamilifu wa dhahiri.
- source_word: וְלֹא מָצָא
  choice: lakini hakuzipata
  rationale: Kiwakilishi cha vitu kinaongezwa kwa uwazi, kikirejelea sanamu; “lakini” kinaonyesha matokeo yaliyokuwa kinyume na lengo la utafutaji.
- source_word: וְרָחֵל
  choice: Raheli
  rationale: Waw ya mwanzo inaendeleza masimulizi, lakini Kiswahili hakihitaji kiunganishi cha wazi hapa; kuanza na “Raheli” ni kwa asili na hakuongezi alama ya wakati isiyokuwapo katika chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo wa wakati timilifu “alikuwa amezichukua” unaonyesha kitendo kilichotangulia utafutaji wa Labani; vitenzi vinavyofuata vinaendeleza mlolongo huo kwa ulaini. Alama zote za tanbihi zimewekwa katika matini kuu.
