  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: sw
  text: Na sasa, umeondoka kabisa kwa sababu umeitamani sana nyumba ya baba yako; kwa nini umeiba miungu yangu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miungu ya nyumbani kwangu.” Kiebrania hapa kinasema tu “miungu yangu,” lakini katika muktadha kinarejelea sanamu za nyumbani za Labani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi ו pamoja na kielezi cha wakati, huku ikianzisha hoja inayofuata ya Labani kwa Kiswahili cha kawaida.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: umeondoka kabisa
  rationale: Muundo wa kitenzi-jina halisi pamoja na kitenzi kilichokamilika unasisitiza kuondoka; “kabisa” huwasilisha msisitizo huo kwa njia ya asili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hutambulisha sababu ambayo Labani anakubali kuwa ilimfanya Yakobo aondoke.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: umeitamani sana
  rationale: Urudiaji wa mzizi kwa kitenzi-jina halisi na kitenzi unaonyesha hamu kubwa; “sana” huhifadhi nguvu hiyo bila kuongeza wazo la kutamani kurudi nyumbani lisiloelezwa moja kwa moja.
- source_word: לְבֵית אָבִיךָ
  choice: nyumba ya baba yako
  rationale: Huhifadhi usemi wa Kiebrania na maana yake ya kifamilia au kaya bila kuubadili kuwa “nchi ya baba zako.”
- source_word: לָמָּה
  choice: kwa nini
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili.
- source_word: גָנַבְתָּ
  choice: umeiba
  rationale: Wakati timilifu wa Kiswahili unafaa kwa swali kuhusu tendo lililokamilika ambalo matokeo yake bado yanahusika.
- source_word: אֶת אֱלֹהָי
  choice: miungu yangu
  rationale: Hufuata moja kwa moja nomino ya wingi yenye kiambishi cha nafsi ya kwanza umoja, bila kuingiza neno “sanamu” ambalo halipo katika aya hii.
theological_decisions:
- issue: Jinsi ya kutafsiri אֱלֹהָי katika maneno ya Labani
  choice: miungu yangu
  alternative: miungu ya nyumbani kwangu
  rationale: Kiebrania kinasema moja kwa moja “miungu yangu.” Muktadha unaonyesha kwamba inarejelea miungu au sanamu za nyumbani za Labani, lakini ufafanuzi huo unawekwa katika tanbihi ili maandishi makuu yaseme kile kilicho katika chanzo bila kukipunguza au kukifasiri zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha msisitizo wa miundo miwili ya Kiebrania kwa kutumia “kabisa” na “sana,” huku “nyumba ya baba yako” ikihifadhi upana wa maana ya kaya ya kifamilia.
