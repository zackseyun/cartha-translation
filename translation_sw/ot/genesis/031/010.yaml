base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: sw
  text: Ikawa, wakati kundi lilipokuwa likipandana, niliinua macho yangu, nikaona katika ndoto, na tazama, madume ya mbuzi yaliyokuwa yakilipanda kundi yalikuwa na milia,[a] madoadoa, na mabakamabaka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikanda.” Neno la Kiebrania linamaanisha alama za mikanda au mistari kwenye wanyama.
    reason: lexical_alternative
  - marker: b
    text: Au, “rangi zilizochanganyika.” Maneno haya matatu ya Kiebrania huenda yanaeleza mifumo tofauti ya manyoya ya wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi mtiririko wa simulizi wa Kiebrania kwa Kiswahili cha kibiblia kinachoeleweka bila kuwa cha kizamani kupita kiasi.
- source_word: בְּעֵת יַחֵם הַצֹּאן
  choice: wakati kundi lilipokuwa likipandana
  rationale: יחם katika muktadha wa uzalishaji wa wanyama huelekeza kwenye joto la kupandana; tafsiri hii ni ya kawaida na haidai matokeo ya kutungwa mimba.
- source_word: וָאֶשָּׂא עֵינַי
  choice: niliinua macho yangu
  rationale: Huhifadhi nahau ya Kiebrania ya kuelekeza macho huku ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: nikaona katika ndoto
  rationale: Huonyesha ndoto kuwa njia ambayo maono yalipokelewa bila kuongeza ubainifu usiokuwamo katika chanzo.
- source_word: וְהִנֵּה
  choice: kwamba
  rationale: Katika Kiswahili, muundo wa kuona kwamba unawasilisha yaliyotokea katika maono kwa ufasaha; mshangao wa הִנֵּה unaeleweka katika ufunuo unaofuata bila kutumia 'tazama' isiyo ya kawaida ndani ya sentensi hii.
- source_word: הָעַתֻּדִים
  choice: madume ya mbuzi
  rationale: Hutaja kwa wazi mbuzi wa kiume wanaotumika kupandisha.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: yaliyokuwa yakilipanda kundi
  rationale: Huhifadhi picha halisi ya עלה על katika muktadha wa kupandana badala ya kuifanya kuwa kauli ya jumla kuhusu kuzaliana.
- source_word: עֲקֻדִּים
  choice: yenye milia
  rationale: Neno linaeleza alama za mikanda au mistari; 'milia' ni wazi na la kawaida katika Kiswahili.
- source_word: נְקֻדִּים
  choice: madoadoa
  rationale: Huwasilisha alama ndogondogo zilizoenea na kutofautisha muundo huu na milia.
- source_word: וּבְרֻדִּים
  choice: rangi zilizochanganyika
  rationale: Huwasilisha rangi zenye mchanganyiko au mabaka yasiyo sawasawa huku ikitofautishwa na madoadoa; maana kamili ya istilahi ya Kiebrania si hakika kabisa.
