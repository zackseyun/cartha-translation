base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: sw
  text: Kisha Labani akamwambia Yakobo, “Tazama rundo hili la mawe[a], na tazama nguzo hii ya jiwe[b] niliyoisimamisha kati yangu na wewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “lundo hili.” Neno la Kiebrania hapa linamaanisha rundo la mawe lililowekwa kuwa shahidi kati ya Labani na Yakobo.
    reason: lexical_alternative
  - marker: b
    text: Au “jiwe hili lililosimamishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio; “Kisha” pamoja na kitenzi cha -ka- huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Chembe hii inavuta fikira kwa kitu kilicho mbele ya wasemaji; “Tazama” ni ya sasa, yenye hadhi, na huhifadhi msisitizo wa Kiebrania.
- source_word: הַגַּל הַזֶּה
  choice: rundo hili la mawe
  rationale: Katika muktadha גַּל ni rundo la mawe lililowekwa kuwa shahidi. Kutaja “la mawe” huleta maana hiyo wazi bila kubadili taswira.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Kurudia “tazama” kunahifadhi usambamba na msisitizo wa matini chanzo.
- source_word: הַמַּצֵּבָה
  choice: nguzo hii ya jiwe
  rationale: מַצֵּבָה ni jiwe lililosimamishwa kama alama; “nguzo ya jiwe” ni wazi na ya kawaida katika Kiswahili.
- source_word: יָרִיתִי
  choice: niliyoisimamisha
  rationale: Kwa kuwa kinachorejelewa ni nguzo ya jiwe, “kuisimamisha” huwasilisha kitendo cha kuiweka wima kwa usahihi na kwa lugha asilia.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: kati yangu na wewe
  rationale: Huhifadhi moja kwa moja uhusiano wa pande mbili ulio katika Kiebrania.
