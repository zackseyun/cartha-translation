lexical_decisions:
- source_word: הֲלֹוא
  choice: Je, ... hatuoni ...?
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukubali; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: נָכְרִיּוֹת
  choice: wageni
  rationale: Neno hilo linawaonyesha kama watu walio nje ya familia; “wageni” ni la asili na linahifadhi malalamiko ya mabinti kwamba baba yao hawatendei kama watu wa nyumbani.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: yeye hatuoni sisi kuwa
  rationale: Kitenzi cha Kiebrania katika Niphal humaanisha kuhesabiwa au kuonwa kuwa. Muundo tendaji wenye mhusika “yeye” ni wa kawaida zaidi katika Kiswahili huku ukihifadhi mtazamo wake kwao.
- source_word: כִּי
  choice: Kwa maana
  rationale: Hapa kinaanzisha sababu inayothibitisha swali la balagha.
- source_word: מְכָרָנוּ
  choice: alituuza
  rationale: Huwasilisha kwa uwazi tendo lililokamilika la baba yao la kuwauza.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: kisha akazitumia kabisa
  rationale: Kitenzi pamoja na jina-kitenzi la kusisitiza huonyesha matumizi kamili. “Akazitumia kabisa” ni Kiswahili cha kawaida kwa fedha, ingawa sitiari halisi ya kula imewekwa katika tanbihi.
- source_word: אֶת כַּסְפֵּנוּ
  choice: fedha zetu
  rationale: כֶּסֶף yaweza kuwa “fedha” kwa maana ya pesa au madini ya fedha; katika muktadha huu “fedha zetu” huwasilisha malalamiko ya kiuchumi bila kulazimisha maana moja kupita kiasi.
