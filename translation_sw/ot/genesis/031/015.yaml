  text: Je, kwake hatuhesabiwi kuwa wageni? Kwa maana alituuza, na amezitumia kabisa fedha zetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amezila kabisa fedha zetu.” Kiebrania kinatumia nahau ya “kula,” pamoja na muundo wa kusisitiza, kuonyesha kwamba alizimaliza kabisa.
