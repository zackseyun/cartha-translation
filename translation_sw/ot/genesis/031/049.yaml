  text: Na Mispa[a], kwa sababu alisema, “Yahwe na aangalie kati yangu na wewe wakati hatuonani[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Mispa linahusiana na neno la Kiebrania linalomaanisha “mnara wa ulinzi” au “mahali pa kuangalizia,” na hivyo linaunganisha jina hilo na maneno “Yahwe na aangalie.”
    reason: lexical_alternative
