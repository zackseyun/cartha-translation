lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: Na Mispa
  rationale: Neno hili linafanya kazi kama jina la mahali katika muktadha huu. Limenakiliwa kama “Mispa,” huku tanbihi ikihifadhi mchezo wa maneno unaolihusianisha na tendo la kuangalia.
- source_word: אֲשֶׁר אָמַר
  choice: kwa sababu alisema
  rationale: Kishazi hiki kinaeleza sababu ya jina lililotangulia. Tafsiri hii haiongezi kitenzi “aliita,” ambacho hakijaandikwa wazi katika Kiebrania.
- source_word: יִצֶף
  choice: na aangalie
  rationale: Hii ni kauli ya kutakia au kuomba kutoka mzizi wenye maana ya kuangalia au kuchunga. Muundo “na aangalie” ni wa kawaida katika Kiswahili na unahifadhi nguvu ya ombi hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetolewa kama jina binafsi “Yahwe,” si kwa kubadilishwa kuwa cheo.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: kati yangu na wewe
  rationale: Inafuata mpangilio na maana ya kirai cha Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: כִּי
  choice: wakati
  rationale: Hapa neno hili linaanzisha hali au wakati ambapo kutazamana hakuwezekani, badala ya kutoa sababu nyingine.
- source_word: נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: tukiwa mbali na macho ya kila mmoja
  rationale: Kiebrania kinasema kwa msingi kuwa kila mmoja amefichika kwa mwenzake. Kauli hii ya Kiswahili inawasilisha kwa kawaida hali ya kutoweza kuonana bila kudai kwamba walijificha kwa makusudi; tanbihi inahifadhi tafsiri iliyo karibu zaidi na umbo la asili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Na aangalie” huhifadhi ombi la Kiebrania, na “mbali na macho ya kila mmoja” huepuka Kiswahili kisicho cha kawaida pamoja na wazo lisilo lazima la kujificha kwa makusudi.
