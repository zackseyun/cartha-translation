base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: sw
  text: Rundo hili ni shahidi[a], na nguzo hii ni shahidi, kwamba mimi sitavuka rundo hili kuelekea kwako, na kwamba wewe hutavuka rundo hili na nguzo hii kuelekea kwangu kwa nia ya kudhuru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Rundo hili ni shahidi, na nguzo hii ni ushahidi.” Kiebrania kinarudia kwa usambamba wazo la ushahidi kuhusu alama zote mbili za mpaka.
    reason: lexical_alternative
  - marker: b
    text: “Kwa nia ya kudhuru” maana yake ni kuvuka kwa kusudi baya au la uhasama, si kuvuka mpaka tu.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד
  choice: shahidi
  rationale: Nomino ya kiarifu inaeleza kazi ya rundo kama ushahidi wa agano; “shahidi” ni ya kawaida na hudumisha taswira ya kitu kinachoshuhudia.
- source_word: גַּל
  choice: rundo
  rationale: Katika muktadha huu ni rundo la mawe lililowekwa kuwa alama ya mpaka; “rundo” ni fupi, wazi, na haliongezi neno “mawe” ambalo halipo moja kwa moja katika mstari huu.
- source_word: וְעֵדָה
  choice: na nguzo hii ni shahidi
  rationale: Umbo hili linaendeleza wazo la ushahidi kwa sambamba na עֵד; kirai kamili cha Kiswahili kinaweka wazi kwamba nguzo pia inafanya kazi ya shahidi.
- source_word: מַצֵּבָה
  choice: nguzo
  rationale: Neno linamaanisha jiwe lililosimamishwa kama alama; “nguzo” ni tafsiri ya kawaida na inayoeleweka katika Kiswahili cha Biblia.
- source_word: אִם
  choice: kwamba
  rationale: Katika kauli ya kiapo au agano hapa linaanzisha masharti yanayoshuhudiwa, si sharti la kawaida la “ikiwa”; “kwamba” huwasilisha kazi hiyo kwa Kiswahili cha asili.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: sitavuka / hutavuka
  rationale: Kitenzi kinahusu kuvuka alama ya mpaka; “kuvuka” kinaeleza wazi mwendo wa kupita upande mwingine wa mpaka.
- source_word: אֵלֶיךָ / אֵלַי
  choice: kuja kwako / kuja kwangu
  rationale: Vihusishi vinaonyesha mwelekeo kwa mhusika mwingine. “Kuja kwako/kwangu” ni Kiswahili cha kawaida na hakibebi chenyewe maana ya uhasama.
- source_word: לְרָעָה
  choice: kwa nia ya kunidhuru
  rationale: Kirai kinaonyesha kusudi baya au la uhasama, si marufuku ya kuvuka mpaka kwa sababu yoyote; tafsiri hii huweka wazi nia ya kuleta madhara.
theological_decisions:
- issue: Upeo wa katazo la kuvuka mpaka
  choice: Katazo linaelezwa kuwa kuvuka kwa nia ya kumdhuru mwingine.
  alternative: Kukataza kabisa kuvuka mpaka kwa sababu yoyote.
  rationale: לְרָעָה hurekebisha masharti ya kuvuka na kuonyesha kusudi la uhasama; hivyo mstari haupaswi kutafsiriwa kana kwamba unakataza kila aina ya kuvuka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usambamba wa Kiebrania umehifadhiwa, huku “kuja kwako/kwangu” na “kwa nia ya kunidhuru” vikitoa mwelekeo na kusudi kwa lugha ya kawaida.
