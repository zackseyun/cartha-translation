base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: sw
  text: Ndipo Labani akamjibu Yakobo, akasema, “Binti hawa ni binti zangu, wana hawa ni wana wangu, na kundi hili ni kundi langu. Kila unachokiona ni changu. Lakini leo nitawafanyia nini binti hawa wangu, au watoto wao[a] waliowazaa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wao,” ikiwa בְּנֵיהֶן linaeleweka kwa maana nyembamba ya watoto wa kiume badala ya watoto kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: Ndipo Labani akamjibu Yakobo, akasema
  rationale: Inahifadhi vitenzi vyote viwili vya simulizi, ‘akajibu’ na ‘akasema,’ kwa mtiririko wa kawaida wa Kiswahili.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: Binti hawa ni binti zangu
  rationale: Inadumisha urudiaji wenye mkazo na dai la Labani la uhusiano na umiliki, huku ‘hawa’ ikifanya usemi uwe wa kawaida katika Kiswahili.
- source_word: וְהַבָּנִים בָּנַי
  choice: wana hawa ni wana wangu
  rationale: ‘Wana’ hapa hudumisha maana ya watoto wa kiume na ulinganifu wake na ‘binti,’ bila kuipanua kuwa watoto wote.
- source_word: וְהַצֹּאן צֹאנִי
  choice: na kundi hili ni kundi langu
  rationale: ‘Kundi’ linawakilisha jina la mkusanyiko wa mifugo midogo na kuhifadhi urudiaji wa Kiebrania.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: Kila unachokiona ni changu
  rationale: Ni dai fupi na la moja kwa moja la umiliki linalolingana na muundo na mkazo wa chanzo.
- source_word: מָה אֶעֱשֶׂה ... לִבְנֹתַי
  choice: nitawafanyia nini binti hawa wangu
  rationale: Muundo wa Kiswahili ‘nitawafanyia nini’ unaacha wazi kama tendo linalowaziwa ni kwa manufaa yao au dhidi yao, hivyo unahifadhi mvutano wa kiimaana wa לְ.
- source_word: הַיּוֹם
  choice: leo
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili cha sasa kwa kielezi hiki cha wakati.
- source_word: אוֹ לִבְנֵיהֶן
  choice: au watoto wao[a]
  rationale: Katika muktadha huu בְּנֵיהֶן yaweza kumaanisha wazao kwa ujumla; ‘watoto wao’ ni ya kawaida, huku maana nyembamba ya wana wa kiume ikihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר יָלָדוּ
  choice: waliowazaa
  rationale: Inaonyesha wazi kwamba hao binti ndio waliowazaa watoto wanaorejelewa.
theological_decisions:
- issue: Mwelekeo wa kitendo katika לִבְנֹתַי ... לִבְנֵיהֶן
  choice: nitawafanyia nini ... au watoto wao
  alternative: ninaweza kuwafanyia nini kwa ajili ya ...
  rationale: Kiebrania kinaweza kueleweka kama kuwafanyia jambo, liwe la kuwadhuru au la kuwasaidia. Kiswahili kilichochaguliwa hakilazimishi upande mmoja na hivyo hakipunguzi mvutano wa kauli ya Labani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. Urudiaji wa madai ya Labani umehifadhiwa kwa sababu una mkazo wa kimakusudi; ‘hawa/hili’ husaidia urudiaji huo usikike kwa kawaida.
