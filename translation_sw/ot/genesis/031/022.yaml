  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: sw
  text: Siku ya tatu, Labani akaambiwa[a] kwamba Yakobo alikuwa amekimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “habari zikamfikia Labani kwamba Yakobo alikuwa amekimbia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: akaambiwa
  rationale: Kitenzi hiki kiko katika kauli ya kutendwa na kinaonyesha kwamba habari ilifikishwa kwa Labani bila kumtaja aliyeifikisha. “Akaambiwa” ni Kiswahili cha kawaida kinachohifadhi kauli hiyo na mwendelezo wa simulizi.
- source_word: לְלָבָן
  choice: Labani
  rationale: Kihusishi לְ kinamtambulisha Labani kuwa mpokeaji wa habari. Katika Kiswahili, maana hiyo inaelezwa kiasili kwa kumfanya Labani kuwa mtendwa wa “akaambiwa.” Jina limetoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Siku ya tatu
  rationale: Tafsiri hii inahifadhi kirai cha wakati bila kuongeza maneno kama “baada ya hayo,” ambayo hayajaelezwa wazi katika Kiebrania.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inatanguliza yaliyomo katika taarifa, si sababu; kwa hiyo “kwamba” ndiyo kiunganishi cha kawaida na sahihi katika Kiswahili.
- source_word: בָרַח
  choice: alikuwa amekimbia
  rationale: Kitenzi ברח humaanisha kukimbia au kutoroka. Muundo “alikuwa amekimbia” unaonyesha kwamba kukimbia kwa Yakobo kulitokea kabla Labani hajapewa habari.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
