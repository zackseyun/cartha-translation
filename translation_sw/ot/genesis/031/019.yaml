base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: sw
  text: Labani alikuwa ameenda kukata manyoya ya mifugo yake, naye Raheli akaiba sanamu za miungu ya nyumbani[a] zilizokuwa za baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: terafimu; pia huweza kutafsiriwa “miungu ya nyumbani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: alikuwa ameenda
  rationale: Kauli timilifu hapa hutoa taarifa ya usuli inayoonyesha kwamba Labani alikuwa hayupo Raheli alipoiba; muundo huu wa Kiswahili unaonyesha vizuri tendo lililotangulia.
- source_word: לִגְזֹז
  choice: kunyoa
  rationale: Kitenzi hiki hutumiwa kwa kuondoa manyoya ya kondoo au wanyama wengine wa kundi, na ‘kunyoa’ ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: צֹאנוֹ
  choice: mifugo yake
  rationale: Neno צֹאן hurejelea kwa ujumla mifugo midogo, hasa kondoo na mbuzi. ‘Mifugo yake’ huepuka kulibana kuwa kondoo pekee, ingawa muktadha unahusu unyoaji.
- source_word: וַתִּגְנֹב
  choice: akaiba
  rationale: Mzizi גנב unamaanisha kuiba; tafsiri hii inadumisha uzito wa kimaadili wa tendo hilo badala ya kulainisha kuwa kuchukua kwa siri.
- source_word: הַתְּרָפִים
  choice: sanamu za miungu ya nyumbani
  rationale: תְּרָפִים ni vitu vya ibada vilivyohusishwa na nyumba au familia. Usemi huu unaonyesha kwamba vilikuwa sanamu halisi za kidini, si mapambo ya nyumbani.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: zilizokuwa za baba yake
  rationale: Kirai hiki kinaonyesha umiliki; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְ
  choice: naye
  rationale: Kiunganishi kinaendeleza simulizi na kuunganisha taarifa ya usuli kuhusu Labani na tendo kuu la Raheli bila kuongeza neno la wakati lisilomo katika chanzo.
theological_decisions:
- issue: Tafsiri ya תְּרָפִים katika muktadha wa vitu vya ibada vya nyumbani
  choice: sanamu za miungu ya nyumbani
  alternative: terafimu; miungu ya nyumbani
  rationale: Tafsiri iliyochaguliwa inabainisha asili yake kama sanamu za ibada huku ikitumia lugha inayoeleweka kwa wasomaji wa sasa. Neno la Kiebrania limehifadhiwa katika tanbihi kwa uwazi wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wa heshima, na unaoeleweka. Alama ya tanbihi imewekwa baada ya kirai kinachotafsiri תְּרָפִים.
