  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: sw
  text: Akawachukua jamaa zake pamoja naye[a], akamfuatilia Yakobo kwa safari ya siku saba, akamfikia katika eneo la milima la Gileadi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu zake”; neno la Kiebrania linaweza kumaanisha ndugu wa kiume hasa au jamaa kwa maana pana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye Mlima Gileadi”; Kiebrania kinaweza kurejelea mlima mmoja au eneo la milima la Gileadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: jamaa zake
  rationale: Ingawa neno hilo linaweza kumaanisha ndugu wa kiume, hapa linaelekea kurejelea watu wa ukoo mpana wa Labani; “jamaa zake” hudumisha uhusiano wa kifamilia bila kuufanya kuwa wa ndugu wa tumbo tu.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: akamfuatilia Yakobo
  rationale: Kitenzi pamoja na kihusishi chake kina maana ya kumwandama au kumfuatilia mtu. Kutaja Yakobo huondoa utata wa viwakilishi vya Kiswahili katika mfululizo huu bila kuongeza mhusika mpya.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: kwa mwendo wa siku saba
  rationale: “Mwendo” huhifadhi wazo la דֶּרֶךְ kama safari au umbali uliosafiriwa, badala ya kusema tu kwamba ufuatiliaji ulidumu siku saba.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: akamfikia
  rationale: Katika muktadha wa kumfuatilia mtu, דבק hapa humaanisha kumkaribia na kumfikia, si kushikamana naye. “Akamfikia” ni ya kawaida na haidai kwa lazima kwamba alimpita.
- source_word: בְּהַר הַגִּלְעָד
  choice: katika eneo la milima la Gileadi
  rationale: הַר inaweza kumaanisha mlima mmoja au eneo la vilima/milima. Muktadha unaunga mkono maana ya kieneo, huku tanbihi ikihifadhi uwezekano wa mlima mmoja.
