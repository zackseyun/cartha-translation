translation:
  language: sw
  text: Ndipo Yakobo akainuka, akawapandisha wanawe na wake zake juu ya ngamia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika wayyiqtol kinaendeleza simulizi na kuonyesha Yakobo aliinuka ili achukue hatua; “akainuka” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: וַיִּשָּׂא
  choice: akawapandisha
  rationale: Ingawa נשׂא kimsingi inaweza kumaanisha kuinua au kubeba, pamoja na עַל הַגְּמַלִּים hapa inaeleza kuwafanya watu wapande ngamia; “akawapandisha” huwasilisha tendo hilo kwa Kiswahili cha asili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: בנים ni wingi wa kiume na hapa inarejelea wana wa Yakobo; “wanawe” ni sahihi na ya kawaida.
- source_word: נָשָׁיו
  choice: wake zake
  rationale: Wingi wa אִשָּׁה ukiwa na Yakobo kama mmilikaji unarejelea wake zake; tafsiri hii ni wazi na sahihi kimuktadha.
- source_word: עַל הַגְּמַלִּים
  choice: juu ya ngamia
  rationale: עַל huonyesha mahali walipowekwa baada ya kupandishwa. “Juu ya ngamia” huhifadhi picha ya Kiebrania bila kulazimisha tofauti isiyo ya lazima kati ya “on” na “onto,” kwa kuwa mwendo tayari umeonyeshwa na “akawapandisha.”
