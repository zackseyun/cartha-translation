base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: sw
  text: Kisha Yakobo akawaambia ndugu zake[a], “Kusanyeni mawe.” Basi wakachukua mawe, wakafanya lundo, wakala pale kando ya lundo hilo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa huenda likawahusu kwa upana zaidi jamaa wa kiume au watu waliokuwa pamoja na Yakobo, si lazima ndugu zake wa tumbo moja tu.
    reason: cultural_note
  - marker: b
    text: Au “wakala pale juu ya lundo hilo.” Kihusishi cha Kiebrania kinaweza kutafsiriwa moja kwa moja kuwa “juu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: ndugu zake
  rationale: Neno אָח kwa msingi humaanisha ndugu wa kiume, lakini linaweza pia kumaanisha jamaa wa kiume au watu wa karibu. “Ndugu zake” ni la kawaida, lenye heshima, na linalobaki karibu na Kiebrania; upana wa maana umeelezwa katika tanbihi.
- source_word: לִקְטוּ
  choice: Kusanyeni
  rationale: Amri hii inahusu kuokota na kukusanya mawe. “Kusanyeni” ni Kiswahili cha kawaida na kinafaa kwa tendo linaloelezwa.
- source_word: אֲבָנִים
  choice: mawe
  rationale: Hii ndiyo maana ya kawaida ya אֶבֶן na inafaa kwa mawe yanayokusanywa kuwa lundo.
- source_word: וַיַּעֲשׂוּ גָל
  choice: wakafanya lundo
  rationale: גַּל hapa ni lundo la mawe. “Lundo” ni neno wazi na linaloeleweka kwa urahisi kuliko istilahi maalumu.
- source_word: וַיֹּאכְלוּ שָׁם עַל הַגָּל
  choice: wakala pale kando ya lundo hilo
  rationale: Kihusishi עַל kinaweza kumaanisha “juu ya” au, kulingana na muktadha, “kando ya/karibu na.” “Kando ya” kinaonyesha vizuri mazingira yanayowezekana ya kula karibu na lundo, huku tafsiri ya moja kwa moja zaidi ikihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetumia viambishi vya mfululizo (“akawaambia,” “wakachukua,” “wakafanya,” “wakala”) ili kutoa mtiririko wa kawaida. Alama za tanbihi zimewekwa mara tu baada ya sehemu zinazohusika.
