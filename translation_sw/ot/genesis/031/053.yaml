base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: sw
  text: Mungu wa Abrahamu na mungu wa Nahori[a], mungu wa baba yao[c], wahukumu kati yetu. Naye Yakobo akaapa kwa Hofu ya baba yake Isaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa Abrahamu na Mungu wa Nahori, Mungu wa baba yao, awahukumu kati yetu.” Kiebrania kinaweza kueleweka kuwa kinamtaja Mungu yuleyule katika sehemu zote; tafsiri kuu inadumisha utata huo.
    reason: alternative_reading
  - marker: b
    text: “Hofu ya baba yake Isaka” ni jina lisilo la kawaida la Mungu; kihalisi, nomino inayomaanisha “hofu” au “kitisho” imetumiwa kama jina la Mungu.
    reason: lexical_alternative
  - marker: c
    text: 'Au, kirai “mungu wa baba yao” kinaweza kuwekwa kama maelezo ya pembeni: “—mungu wa baba yao—.”'
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: Mungu wa Abrahamu
  rationale: Ingawa אֱלֹהֵי ina umbo la wingi, hapa humrejelea Mungu anayehusishwa na Abrahamu; matumizi ya “Mungu” yenye herufi kubwa yanafaa kwa muktadha huu.
- source_word: וֵאלֹהֵי נָחוֹר
  choice: na mungu wa Nahori
  rationale: Herufi ndogo katika “mungu” inadumisha uwezekano wa tofauti kati ya Mungu wa Abrahamu na mungu anayehusishwa na Nahori, bila kuamua kimya-kimya kwamba marejeo yote yanamtaja Mungu yuleyule.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: mungu wa baba yao
  rationale: Kirai hiki kinaweza kuwa maelezo ya ziada kuhusu waliotajwa kabla yake. Herufi ndogo inadumisha utata wa kama ni Mungu mmoja wa pamoja wa ukoo au mwito mpana zaidi kwa miungu ya mababu.
- source_word: יִשְׁפְּטוּ
  choice: na wahukumu
  rationale: Muundo huu unaonyesha ombi au tamko la kiapo, “na ... wahukumu.” Upatanisho wa wingi “wahukumu” unaakisi kitenzi cha Kiebrania cha wingi na viima vilivyounganishwa.
- source_word: בֵינֵינוּ
  choice: kati yetu
  rationale: Huu ni usemi wa kawaida na wa moja kwa moja unaofaa katika muktadha wa agano kati ya pande mbili.
- source_word: וַיִּשָּׁבַע
  choice: Naye Yakobo akaapa
  rationale: “Akaapa” huendeleza simulizi kwa njia ya kawaida ya Kiswahili, huku “naye” ikiweka wazi badiliko kutoka kwa maneno ya Labani hadi tendo la Yakobo.
- source_word: בְּפַחַד
  choice: kwa Hofu
  rationale: פַחַד humaanisha kihalisi “hofu” au “kitisho,” lakini hapa imetumiwa kama jina la pekee la Mungu katika kiapo. Herufi kubwa inadumisha upekee wa jina hilo bila kulifafanua kupita kiasi.
- source_word: אָבִיו יִצְחָק
  choice: ya baba yake Isaka
  rationale: Kirai hiki kinamtambulisha Isaka kuwa baba anayehusishwa na jina “Hofu,” kwa mtiririko wa asili wa Kiswahili.
theological_decisions:
- issue: Kama Mungu wa Abrahamu na mungu wa Nahori watambulishwe wazi kuwa Mungu yuleyule
  choice: Kutumia “Mungu wa Abrahamu” lakini “mungu wa Nahori, mungu wa baba yao”
  alternative: “Mungu wa Abrahamu na Mungu wa Nahori, Mungu wa baba yao”
  rationale: Kiebrania kinarudia אֱלֹהֵי na kutumia kitenzi cha wingi. Tofauti ya herufi kubwa na ndogo inadumisha mvutano uliopo katika mwito wa Labani badala ya kuoanisha marejeo yote na ungamo la Yakobo.
- issue: Jinsi ya kutafsiri jina lisilo la kawaida בְּפַחַד אָבִיו יִצְחָק
  choice: kwa Hofu ya baba yake Isaka
  alternative: kwa Mungu aliyeogopwa na baba yake Isaka
  rationale: Tafsiri ya karibu ya nomino “Hofu” inadumisha jina hili la pekee la Mungu na uzito wake wa kiteolojia bila kulainisha maana kwa maelezo ya kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Abrahamu, Nahori, Yakobo, na Isaka. Tofauti ya “Mungu/mungu” na jina “Hofu” imetumiwa kwa makusudi kuhifadhi utata na upekee wa Kiebrania.
