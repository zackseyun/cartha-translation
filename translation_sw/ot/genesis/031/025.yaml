base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: sw
  text: Labani akamfikia Yakobo.[a] Yakobo alikuwa amepiga hema lake katika eneo la milima,[b] naye Labani akapiga kambi pamoja na jamaa zake[c] katika eneo la milima la Gileadi.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwandama hadi akampata Yakobo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya mlima.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “ndugu zake”; hapa huenda ni watu wa ukoo wake au wa kundi lake la kifamilia.
    reason: lexical_alternative
  - marker: d
    text: Au, “juu ya Mlima Gileadi,” au “katika milima ya Gileadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: akamfikia
  rationale: Katika muktadha wa kumfu追追? baada ya kumwandama, kitenzi hiki humaanisha kumfikia mtu aliyekuwa mbele. ‘Akamfikia’ ni Kiswahili cha kawaida na hakidokezi kwamba alimkamata.
- source_word: תָּקַע ... אָהֳלוֹ
  choice: alikuwa amepiga hema lake
  rationale: Muundo huu ni nahau ya kusimamisha hema. Wakati uliotangulia unaonyesha kwamba Yakobo alikuwa tayari amepiga hema Labani alipomfikia.
- source_word: בָּהָר
  choice: katika eneo la milima
  rationale: הַר inaweza kumaanisha mlima mmoja au eneo la milima. Muktadha wa eneo pana la Gileadi unaunga mkono tafsiri ya kikanda huku tanbihi ikihifadhi uwezekano wa mlima mmoja.
- source_word: תָּקַע אֶת אֶחָיו
  choice: akapiga kambi pamoja na jamaa zake
  rationale: 'Kifungu cha Kiebrania ni cha mkato: kwa neno neno, Labani ‘alipiga’ pamoja na ndugu zake. ‘Akapiga kambi’ huwasilisha kitendo kinachodokezwa na ulinganifu wa sentensi bila kuongeza wazi mahema mengi.'
- source_word: אֶחָיו
  choice: jamaa zake
  rationale: Neno hilo kwa msingi ni ‘ndugu zake,’ lakini linaweza kuwahusu watu wa ukoo au kundi la kifamilia. Katika simulizi hili ‘jamaa zake’ linafaa zaidi kuliko kudokeza kaka au ndugu wa tumbo moja pekee.
- source_word: בְּהַר הַגִּלְעָד
  choice: katika eneo la milima la Gileadi
  rationale: Muundo unaweza kueleweka kuwa mlima wa Gileadi au eneo lenye milima la Gileadi. Tafsiri kuu inatumia maana ya kikanda, na tanbihi inadumisha utata wa kijiografia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi wa Biblia. ‘Kupiga hema’ na ‘kupiga kambi’ ni misemo ya kawaida; tofauti hiyo pia inahifadhi hema la Yakobo lililotajwa wazi na tendo la Labani lililoelezwa kwa mkato. Alama zote za tanbihi zimewekwa baada ya vipashio vinavyohusika.
