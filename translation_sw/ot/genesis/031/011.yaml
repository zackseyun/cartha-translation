  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: sw
  text: Kisha malaika wa Mungu akaniambia katika ndoto ile[a], “Yakobo!” Nami nikasema, “Mimi hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika ndoto.” Kiebrania kinasema, “katika ndoto ile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akaniambia
  rationale: Wayyiqtol inaendeleza masimulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, huku kiambishi “-ni-” kikitoa maana ya אֵלַי, “kwangu.”
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaika wa Mungu
  rationale: Katika muktadha huu מַלְאָךְ humaanisha kiumbe wa mbinguni; “malaika wa Mungu” ni tafsiri ya kawaida na haiongezi dai kuhusu utambulisho wake.
- source_word: בַּחֲלוֹם
  choice: katika ile ndoto
  rationale: Kiebrania kina kibainishi, yaani “katika ndoto ile.” Kiswahili “katika ile ndoto” hudumisha ubainifu huo kwa usemi wa asili.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: וָאֹמַר
  choice: Nami nikasema
  rationale: Hutoa mwitikio wa moja kwa moja wa simulizi na kuunganisha sentensi kwa Kiswahili fasaha.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kujitokeza au kuitikia mwito, unaohifadhi nguvu ya fomula ya Kiebrania.
theological_decisions:
- issue: Tafsiri ya מַלְאַךְ הָאֱלֹהִים katika muktadha unaoweza kuzua swali la uhusiano wake na Mungu
  choice: malaika wa Mungu
  alternative: mjumbe wa Mungu
  rationale: Aya yenyewe humwita mhusika “malaika wa Mungu” bila kutatua maswali mapana ya kitheolojia kuhusu utambulisho wake; tafsiri hii inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Mimi hapa” ni mwitikio wa asili kuliko tafsiri halisi kama “Tazama mimi.”
