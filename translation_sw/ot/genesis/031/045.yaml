  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: sw
  text: Ndipo Yakobo akachukua jiwe na kulisimamisha kuwa nguzo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jiwe lililosimamishwa” au “jiwe la ukumbusho.” Neno la Kiebrania מַצֵּבָה humaanisha jiwe lililosimamishwa kuwa alama au nguzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi cha masimulizi kutoka לקח kina maana ya kawaida ya ‘kuchukua’; ‘akachukua’ ni cha asili katika mfululizo wa simulizi la Kiswahili.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אָבֶן
  choice: jiwe
  rationale: Nomino ya umoja inataja jiwe moja; Kiswahili hakihitaji kibainishi kisicho dhahiri kama ‘a’ ya Kiingereza.
- source_word: וַיְרִימֶהָ
  choice: kulisimamisha
  rationale: Kiwakilishi cha yambwa kinarejelea jiwe. Katika muktadha huu, ‘kulisimamisha’ huonyesha kwa kawaida tendo la kuliweka jiwe wima.
- source_word: מַצֵּבָה
  choice: kuwa nguzo
  rationale: מַצֵּבָה ni jiwe lililosimamishwa kama alama au nguzo. ‘Kuwa nguzo’ huhifadhi matumizi yake ya kiarifu bila kudai wazi kwamba lilikuwa ukumbusho au kitu cha ibada.
theological_decisions:
- issue: Tafsiri ya מַצֵּבָה, ambayo inaweza kuwa na matumizi ya ukumbusho au ya ibada
  choice: nguzo
  alternative: jiwe lililosimamishwa; jiwe la ukumbusho
  rationale: Aya yenyewe inaeleza tendo la kulisimamisha jiwe, lakini haitaji moja kwa moja kusudi lake la kidini au la ukumbusho. ‘Nguzo’ huhifadhi maana ya msingi bila kuongeza ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘Ndipo ... aka-’ unafaa kwa mfululizo wa simulizi; ‘nguzo’ ni rahisi kueleweka, huku tanbihi ikihifadhi maana mbadala za neno la Kiebrania.
