source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: sw
  text: Salu, Amoki, Hilkia, Yedaya—hao ndio waliokuwa viongozi wa makuhani[a] na ndugu zao[b] katika siku za Yeshua.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “vichwa vya makuhani”; yaani, viongozi wao.
    reason: lexical_alternative
  - marker: b
    text: Au “jamaa zao” au “makuhani wenzao.” Kiebrania kinasema “ndugu zao.”
    reason: lexical_alternative
  - marker: c
    text: Yeshua ni umbo la jina lililotumiwa baada ya uhamisho na linahusiana pia na jina “Yoshua.”
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ
  choice: Salu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: עָמוֹק
  choice: Amoki
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Umbo hili la jina limetoholewa kwa kufuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: יְדַעְיָה
  choice: Yedaya
  rationale: Jina limetoholewa badala ya kutafsiriwa, huku sauti yake ya Kiebrania ikihifadhiwa kwa kiasi kinachowezekana.
- source_word: אֵלֶּה
  choice: hao ndio
  rationale: Kiwakilishi hiki kinawarejelea watu waliotajwa; ‘hao ndio’ ni kauli ya kawaida ya Kiswahili katika utambulisho wa aina hii.
- source_word: רָאשֵׁי
  choice: viongozi wa
  rationale: Nomino ‘vichwa’ imetumiwa kwa maana ya watu wenye nafasi ya uongozi; ‘viongozi’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudokeza cheo maalumu cha baadaye.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi yenye uhusiano wa wazi katika kirai.
- source_word: וַאֲחֵיהֶם
  choice: na ndugu zao
  rationale: Inahifadhi neno halisi la kifamilia ‘ndugu,’ ingawa katika muktadha linaweza kumaanisha jamaa zao au makuhani wenzao.
- source_word: בִּימֵי
  choice: katika siku za
  rationale: Inahifadhi nahau ya muda ya Kiebrania kwa usemi unaoeleweka na wenye hadhi katika Kiswahili.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Jina la kipindi cha baada ya uhamisho limetoholewa kama Yeshua, likitofautishwa na umbo refu linalotolewa kwa kawaida kama Yoshua.
theological_decisions:
- issue: Maana ya אֲחֵיהֶם katika muktadha wa vikundi vya kikuhani
  choice: ndugu zao
  alternative: jamaa zao; makuhani wenzao
  rationale: Kiebrania kinasema kihalisi ‘ndugu zao.’ Muktadha unaweza kupanua maana kwa washirika wa ukoo au kundi la kikuhani, lakini tafsiri haifungi kimya kimya uwezekano huo.
- issue: Maana ya רָאשֵׁי kama neno la uongozi
  choice: viongozi wa makuhani
  alternative: wakuu wa makuhani; vichwa vya makuhani
  rationale: Kirai kinaonyesha watu waliokuwa na uongozi miongoni mwa makuhani, si lazima cheo maalumu cha ‘makuhani wakuu’ cha kipindi cha baadaye. ‘Viongozi’ ni cha asili katika Kiswahili, na taswira halisi imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Majina yametoholewa kwa mtindo wa Kiswahili, na alama zote za tanbihi zimewekwa mara moja mahali zinapohusika katika maandishi.
