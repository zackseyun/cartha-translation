reference: Nehemiah 12:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הַ/לְוִיִּם֩ בִּ/ימֵ֨י אֶלְיָשִׁ֜יב יוֹיָדָ֤ע וְ/יוֹחָנָן֙ וְ/יַדּ֔וּעַ כְּתוּבִ֖ים רָאשֵׁ֣י אָב֑וֹת וְ/הַ/כֹּ֣הֲנִ֔ים עַל מַלְכ֖וּת דָּרְיָ֥וֶשׁ הַ/פָּֽרְסִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: sw
  text: Katika siku za Eliashibu, Yoyada, Yohanani[a] na Yadua, Walawi waliandikishwa[b] kuwa wakuu wa jamaa za ukoo[c]; makuhani pia waliandikishwa wakati wa utawala wa Dario Mwajemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina Yohanani; baadhi ya mapokeo ya tafsiri yana Yonathani.
    reason: alternative_reading
  - marker: b
    text: Au, “waliandikwa katika kumbukumbu.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “wakuu wa nyumba za baba”; huu ni usemi unaotaja viongozi wa jamaa au nyumba za ukoo.
    reason: cultural_note
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida na linaloeleweka kwa watu wa kabila la Lawi.
- source_word: בִּימֵי
  choice: Katika siku za
  rationale: Linahifadhi nahau ya wakati ya Kiebrania huku likibaki la kawaida katika Kiswahili cha Biblia.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: Eliashibu, Yoyada, Yohanani na Yadua
  rationale: Majina yameandikwa kwa maumbo yanayosomeka kiasili katika Kiswahili; maandishi ya Kiebrania yana Yohanani, si Yonathani.
- source_word: כְּתוּבִים
  choice: waliandikishwa
  rationale: Kauli hii ya kutendwa kutoka כתב inaonyesha kuingizwa katika kumbukumbu rasmi au orodha; 'waliandikishwa' inafaa muktadha wa nasaba na utawala.
- source_word: רָאשֵׁי אָבוֹת
  choice: wakuu wa jamaa za ukoo
  rationale: Ni usemi wa kiutawala na kinasaba unaowataja viongozi wa vikundi vya kifamilia vilivyotokana na babu mmoja; tafsiri hii ni wazi kuliko uhamishaji wa neno kwa neno.
- source_word: וְהַכֹּהֲנִים
  choice: makuhani pia waliandikishwa
  rationale: Kiebrania kina kishazi cha mkato; kitenzi kimerejeshwa katika Kiswahili ili maana kwamba makuhani nao waliandikishwa iwe wazi.
- source_word: עַל מַלְכוּת
  choice: wakati wa utawala wa
  rationale: Katika taarifa hii ya mpangilio wa nyakati, usemi huu unaeleweka kwa kawaida kuwa unahusisha kurekodiwa huko na kipindi cha utawala.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: Dario Mwajemi
  rationale: Kivumishi cha asili ya mtu kimetafsiriwa kwa umbo la kawaida la Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Kishazi cha mkato kuhusu makuhani kimekamilishwa kwa kurudia kitenzi ili sentensi iwe wazi bila kuongeza dai jipya.
