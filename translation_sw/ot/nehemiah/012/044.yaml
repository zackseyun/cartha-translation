source:
  edition: WLC
  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: sw
  text: Siku hiyo wanaume waliwekwa kuwa wasimamizi wa vyumba vya kuhifadhia hazina, matoleo[a], malimbuko, na zaka, ili wakusanye humo, kutoka mashambani mwa miji, mafungu yaliyoagizwa na Sheria[b] kwa ajili ya makuhani na Walawi; kwa maana watu wa Yuda waliwafurahia makuhani na Walawi waliokuwa wakihudumu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyumba kwa ajili ya hazina, matoleo, malimbuko, na zaka.” Neno la Kiebrania linaweza kumaanisha vyumba au vyumba vya ndani; katika muktadha huu vilitumiwa kuhifadhi vitu hivyo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mafungu ya Sheria,” yaani, sehemu ambazo Torati iliwawekea makuhani na Walawi.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “waliokuwa wamesimama.” Katika muktadha wa Hekalu, usemi huo unamaanisha kusimama katika huduma, yaani, kuhudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: waliwekwa kuwa wasimamizi
  rationale: Kitenzi katika muktadha huu kinaonyesha kuteuliwa na kukabidhiwa wajibu wa usimamizi; usemi huu ni wa kawaida na unaweka wazi jukumu lao.
- source_word: אֲנָשִׁים
  choice: wanaume
  rationale: Neno la Kiebrania linataja wanaume kwa wazi, hivyo jinsia ya rejeo imehifadhiwa.
- source_word: הַנְּשָׁכוֹת לָאוֹצָרוֹת
  choice: vyumba vya kuhifadhia
  rationale: הַנְּשָׁכוֹת ni vyumba, na לָאוֹצָרוֹת hapa inaeleza matumizi yake kama mahali pa kuhifadhi mali au mazao; tafsiri hii haiongezi hazina tofauti ambazo maandishi hayazitaji kwa lazima.
- source_word: לַתְּרוּמוֹת
  choice: matoleo
  rationale: Neno linamaanisha vitu vilivyotengwa na kutolewa kwa matumizi matakatifu; ‘matoleo’ ni neno la kawaida la Kiswahili na linafaa katika muktadha huu.
- source_word: לָרֵאשִׁית
  choice: malimbuko
  rationale: Hili ni neno la kidini kwa sehemu ya kwanza ya mazao inayotolewa; ‘malimbuko’ ni istilahi ya Kiswahili iliyo wazi na iliyozoeleka.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: na zaka
  rationale: ‘Zaka’ ni istilahi ya kawaida ya Kiswahili kwa sehemu ya kumi inayotolewa.
- source_word: לִכְנוֹס בָּהֶם
  choice: kukusanya humo
  rationale: Usemi huu huhifadhi maana ya kukusanya vitu ndani ya vyumba hivyo bila kuongeza maelezo ya namna ya usafirishaji.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: kutoka katika mashamba ya miji
  rationale: Tafsiri hii inafuata muundo wa chanzo na inaelekea kumaanisha mashamba yaliyohusishwa na miji au maeneo yake.
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: mafungu yaliyoamriwa na Sheria
  rationale: Haya ni mafungu au sehemu zilizowekwa na Torati; ‘yaliyoamriwa na Sheria’ hufanya uhusiano huo uwe wazi kwa Kiswahili cha kawaida.
- source_word: כִּי שִׂמְחַת יְהוּדָה
  choice: kwa sababu watu wa Yuda waliwafurahia
  rationale: ‘Yuda’ hapa ni jumuiya ya watu, si mtu mmoja; kitenzi cha Kiswahili kinaonyesha furaha yao kwa makuhani na Walawi bila kubadili uhusiano wa kisababishi.
- source_word: הָעֹמְדִים
  choice: waliokuwa wakihudumu
  rationale: Ingawa maana ya moja kwa moja ni ‘waliosimama,’ katika mazingira ya Hekalu kusimama mbele au katika nafasi fulani ni kuhudumu.
theological_decisions:
- issue: Maana ya הָעֹמְדִים katika huduma ya Hekalu
  choice: waliokuwa wakihudumu
  alternative: waliokuwa wamesimama
  rationale: Muktadha wa makuhani na Walawi unaonyesha kusimama katika utumishi rasmi; tafsiri ya kidhima ni ya asili zaidi, huku maana halisi ikihifadhiwa katika tanbihi.
- issue: Rejeo la יְהוּדָה
  choice: watu wa Yuda
  alternative: Yuda
  rationale: Katika muktadha huu ‘Yuda’ huwakilisha jumuiya ya Wayudea. Kuliweka wazi hilo huepusha msomaji kudhani kuwa ni mtu mmoja bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ndefu ya Kiebrania imegawanywa ili isomeke kwa urahisi. ‘Sheria’ imeandikwa kwa herufi kubwa kwa kuwa hapa inarejelea Torati. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
