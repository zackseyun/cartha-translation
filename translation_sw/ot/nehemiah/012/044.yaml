revisions:
- from: Siku hiyo, wanaume waliwekwa kuwa wasimamizi wa vyumba vya kuhifadhia matoleo[a], malimbuko na zaka. Walipaswa kukusanya humo, kutoka katika mashamba ya miji, mafungu yaliyoamriwa na Sheria kwa ajili ya makuhani na Walawi[b]. Walifanya hivyo kwa sababu watu wa Yuda waliwafurahia makuhani na Walawi waliokuwa wakihudumu[c].
  to: Siku hiyo wanaume waliwekwa kuwa wasimamizi wa vyumba vya kuhifadhia hazina, matoleo[a], malimbuko, na zaka, ili wakusanye humo, kutoka mashambani mwa miji, mafungu yaliyoagizwa na Sheria[b] kwa ajili ya makuhani na Walawi; kwa maana watu wa Yuda waliwafurahia makuhani na Walawi waliokuwa wakihudumu[c].
  rationale: Marekebisho yanarudisha ‘hazina/akiba,’ ambayo rasimu ilikuwa imeiacha, na yanahifadhi muundo wa kusudi wa Kiebrania kwa ‘ili wakusanye.’ Sentensi ya sababu imerekebishwa ili iwasilishe furaha ya jumuiya ya Yuda juu ya makuhani na Walawi, bila kuifunga isivyostahili na tendo moja lililotangulia. Tanbihi zimepangiliwa upya na alama zimewekwa kwenye marejeo yanayohusika.
