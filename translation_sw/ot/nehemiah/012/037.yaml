    text: Au “Lango la Chanzo cha Maji.” Neno la Kiebrania linaweza kumaanisha chemchemi au chanzo cha maji.
    reason: lexical_alternative
  - marker: b
    text: Au “miinuko.” Neno la Kiebrania linaweza kumaanisha ngazi zilizojengwa au, kwa maana pana zaidi, njia za kupandia.
    reason: lexical_alternative
  revision_rationale: The revision avoids supplying an unstated verb for the route past the house of David and clarifies that the ascent is toward the wall rather than necessarily on it. It retains the source’s topographical compactness, the draft’s natural Standard East African Swahili register, and both correctly anchored lexical footnotes.
