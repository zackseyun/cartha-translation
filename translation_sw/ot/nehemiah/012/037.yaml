  text: וְ/עַל֩ שַׁ֨עַר הָ/עַ֜יִן וְ/נֶגְדָּ֗/ם עָלוּ֙ עַֽל מַעֲלוֹת֙ עִ֣יר דָּוִ֔יד בַּֽ/מַּעֲלֶ֖ה לַ/חוֹמָ֑ה מֵ/עַל֙ לְ/בֵ֣ית דָּוִ֔יד וְ/עַ֛ד שַׁ֥עַר הַ/מַּ֖יִם מִזְרָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: sw
  text: Na kwenye Lango la Chemchemi[a], mbele yao, walipanda ngazi[b] za Mji wa Daudi, kwenye njia ya kupandia kuelekea ukutani, juu ya nyumba ya Daudi, hadi Lango la Maji upande wa mashariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Lango la Chanzo cha Maji.” Neno la Kiebrania linaweza kumaanisha chemchemi au chanzo cha maji.
    reason: lexical_alternative
  - marker: b
    text: Au “miinuko.” Neno la Kiebrania linaweza kumaanisha ngazi zilizojengwa au, kwa maana pana zaidi, njia za kupandia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Lango la Chemchemi
  rationale: עַיִן hapa humaanisha chemchemi au chanzo cha maji. “Lango la Chemchemi” ni jina la mahali lililo wazi na la kawaida katika Kiswahili.
- source_word: וְנֶגְדָּם
  choice: mbele yao
  rationale: נֶגֶד pamoja na kiambishi cha wingi humaanisha “mbele yao,” “mkabala nao,” au “kuelekeana nao.” Tafsiri hii inahifadhi uhusiano wa kimahali bila kuufafanua kupita kiasi.
- source_word: עָלוּ
  choice: walipanda
  rationale: עלה katika qal humaanisha kwenda juu au kupanda; “walipanda” ni ya moja kwa moja na ya kawaida.
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: kwa ngazi za Mji wa Daudi
  rationale: מַעֲלוֹת inaweza kumaanisha ngazi au miinuko. Mazingira ya mjini yanaunga mkono “ngazi,” huku tanbihi ikihifadhi maana mbadala.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: kwenye njia ya kupandia ukutani
  rationale: מַעֲלֶה ni mwinuko au njia ya kupandia, na לַחוֹמָה inaonyesha uelekeo kuelekea ukutani. Kauli hii ni ya asili katika Kiswahili na inahifadhi maelezo ya njia.
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: juu ya nyumba ya Daudi
  rationale: מֵעַל huonyesha nafasi ya juu kuhusiana na alama nyingine ya mahali; hapa inaeleza njia iliyopita kwenye sehemu ya juu kuliko nyumba ya Daudi.
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: Lango la Maji upande wa mashariki
  rationale: מִזְרָח huonyesha mashariki au kuelekea mashariki. “Upande wa mashariki” ni wazi na ya kawaida katika maelezo ya mahali.
- source_word: וְעַל
  choice: Na kwenye
  rationale: עַל hapa ina matumizi ya kimahali karibu na lango. “Kwenye” ni ya kawaida kuliko tafsiri halisi ya “juu ya” katika muktadha huu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Majina ya maeneo yameandikwa kwa herufi kubwa. Alama ya tanbihi [b] imewekwa baada ya “ngazi,” ambako utata wa neno מַעֲלוֹת unatokea.
