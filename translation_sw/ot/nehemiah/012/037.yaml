revisions:
- from: Na kwenye Lango la Chemchemi[a], mbele yao, walipanda kwa ngazi[b] za Mji wa Daudi, kwenye njia ya kupandia ukutani, wakapita juu ya nyumba ya Daudi hadi Lango la Maji upande wa mashariki.
  to: Na kwenye Lango la Chemchemi[a], mbele yao, walipanda ngazi[b] za Mji wa Daudi, kwenye njia ya kupandia kuelekea ukutani, juu ya nyumba ya Daudi, hadi Lango la Maji upande wa mashariki.
  rationale: The revision avoids supplying an unstated verb for the route past the house of David and clarifies that the ascent is toward the wall rather than necessarily on it. It retains the source’s topographical compactness, the draft’s natural Standard East African Swahili register, and both correctly anchored lexical footnotes.
