base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: sw
  text: Kisha nikawapandisha viongozi wa Yuda juu ya ukuta, nikapanga makundi mawili makubwa ya kutoa shukrani, yakifanya maandamano[a]. Kundi moja likaenda upande wa kulia juu ya ukuta, kuelekea Lango la Samadi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “shukrani mbili kubwa na maandamano.” Katika muktadha huu, huenda maneno hayo yanarejelea makundi yaliyopangwa kutoa shukrani, labda kwa kuimba, huku yakiandamana.
    reason: lexical_alternative
  - marker: b
    text: Au, “hadi Lango la Samadi.” Kihusishi cha Kiebrania kinaweza kuonyesha kuelekea mahali au kufika huko katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: nikawapandisha
  rationale: Hifili ya עלה ina maana ya kusababisha wapande au kuwaleta juu; “nikawapandisha” ni ya asili katika Kiswahili na inadumisha maana hiyo ya kisababishi.
- source_word: שָׂרֵי יְהוּדָה
  choice: viongozi wa Yuda
  rationale: שָׂרִים inaweza kumaanisha wakuu, maafisa, au viongozi. “Viongozi” inaeleweka kwa urahisi na haidokezi bila sababu kwamba walikuwa wana wa kifalme.
- source_word: מֵעַל לַחוֹמָה
  choice: juu ya ukuta
  rationale: Kirai kinaonyesha kupanda hadi sehemu ya juu ya ukuta ambako maandamano yangeweza kupita.
- source_word: וָאַעֲמִידָה
  choice: nikapanga
  rationale: Hifili ya עמד ni kuweka au kusimamisha mahali. Katika tukio hili la ibada, “nikapanga” huonyesha kuwa Nehemia aliyaweka makundi kwa utaratibu bila kudai tu kwamba yalisimama.
- source_word: תֹודֹת גְּדֹלֹת
  choice: makundi mawili makubwa ya waimbaji wa shukrani
  rationale: Kwa maana ya msingi ni “shukrani mbili kubwa,” lakini katika muktadha huu תוֹדוֹת inatumika kimetonimia kwa makundi yaliyotoa shukrani, huenda kwa kuimba. Tafsiri hii huwasilisha kazi ya makundi na kudumisha wazo la shukrani.
- source_word: וְתַהֲלֻכֹת
  choice: katika maandamano
  rationale: Nomino inayotokana na הלך hueleza kwenda au mwendo wa maandamano. Kiswahili hiki huunganisha kwa kawaida makundi ya shukrani na mwendo wao juu ya ukuta.
- source_word: לַיָּמִין
  choice: upande wa kulia
  rationale: Hii ndiyo maana ya moja kwa moja ya kirai. Ingawa mwelekeo wa kusini unaweza kudhaniwa kutokana na jiografia, haujaelezwa wazi katika maandishi.
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: kuelekea Lango la Samadi
  rationale: אַשְׁפֹּת hurejelea kinyesi, samadi, au takataka. “Lango la Samadi” ni jina wazi na lenye staha kwa Kiswahili cha sasa; “kuelekea” huonyesha mwelekeo wa ל katika muktadha huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi mbili zimetumiwa ili kuonyesha wazi kwamba kundi moja kati ya yale mawili ndilo lililoelekea upande wa kulia. Lugha inadumisha picha halisi ya kupanda na kutembea juu ya ukuta, huku tanbihi ikihifadhi usemi wa Kiebrania usio wa kawaida kuhusu “shukrani” na uwezekano wa tafsiri ya kihusishi cha mwisho.
