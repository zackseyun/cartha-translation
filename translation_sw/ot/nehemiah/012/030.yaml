  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: sw
  text: Nao makuhani na Walawi walijitakasa[a], kisha wakatakasa watu, malango, na ukuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “walijisafisha ... wakasafisha watu, malango, na ukuta.” Kiebrania hutumia mzizi uleule kwa matendo yote mawili: kwanza kwa hali ya kujirejelea, kisha kwa tendo linalofanywa kwa vitu vingine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: walijitakasa
  rationale: Muundo wa hitpael una maana ya kujirejelea; ‘walijitakasa’ ni Kiswahili cha kawaida kinachobeba dhana ya utakaso wa kiibada.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wahudumu hawa katika muktadha wa ibada.
- source_word: וְהַלְוִיִּם
  choice: na Walawi
  rationale: ‘Walawi’ ni jina lililozoeleka la watu wa kabila la Lawi na wahudumu wa Hekalu.
- source_word: וַיְטַהֲרוּ
  choice: wakawatakasa
  rationale: Muundo wa piel ni elekezi kwa kitu kingine; uchaguzi huu unadumisha mzizi mmoja wa maana uliotumiwa pia katika ‘walijitakasa’ huku ukionyesha kuwa watu ndio waliotakaswa.
- source_word: הָעָם
  choice: watu
  rationale: Maana ya kawaida hapa ni watu kwa ujumla, si lazima kusanyiko rasmi.
- source_word: הַשְּׁעָרִים
  choice: malango
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika muktadha wa ukuta wa mji.
- source_word: הַחוֹמָה
  choice: ukuta
  rationale: Umoja wa Kiebrania unarejelea ukuta wa Yerusalemu; muktadha unafanya rejeo hilo lieleweke bila kuongeza ‘wa mji.’
theological_decisions:
- issue: Asili ya lugha ya utakaso
  choice: utakaso wa kiibada
  alternative: usafishaji wa kawaida au utakaso wa jumla wa kisherehe
  rationale: Katika muktadha wa kuwekwa wakfu kwa ukuta na huduma ya Hekalu, mzizi טהר unaashiria utakaso wa kiibada, si usafi wa kimwili tu wala maadili pekee. ‘Kutakasa’ hudumisha maana hiyo bila kubainisha ibada ambayo maandishi hayaitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao’ huendeleza simulizi, na ‘kisha’ huonyesha mfuatano wa matendo bila kuongeza maelezo ya ibada yasiyotajwa katika chanzo.
