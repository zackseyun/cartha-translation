base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: sw
  text: Viongozi wa Walawi walikuwa Hashabia, Sherebia, na Yeshua mwana wa Kadmieli, pamoja na ndugu zao waliokuwa mkabala nao,[a] ili kusifu na kushukuru kwa amri ya Daudi, mtu wa Mungu, zamu ikilingana na zamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa mbele yao” au “waliolingana nao.” Inaelekea kirai hiki kinaeleza vikundi vya Walawi vilivyokuwa mkabala au vilivyolingana katika ibada.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “zamu ikilingana na zamu.” Huenda maneno haya yanarejelea vikundi vya huduma vilivyopangwa kwa ulinganifu au vituo vya ibada vilivyobadilishana.'
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: Viongozi wa Walawi
  rationale: Neno רָאשֵׁי ni wingi tegemezi unaomaanisha walio katika nafasi za uongozi; ‘viongozi’ ni Kiswahili cha kawaida na chenye heshima kuliko tafsiri ya moja kwa moja ‘vichwa.’
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: Hashabia, Sherebia, na Yeshua mwana wa Kadmieli
  rationale: Majina yametoholewa kwa kufuata umbo la Kiebrania, na uhusiano wa mwana na baba umehifadhiwa wazi.
- source_word: וַאֲחֵיהֶם
  choice: pamoja na ndugu zao
  rationale: ‘Ndugu zao’ huhifadhi istilahi ya kiume ya Kiebrania na hapa inawahusu Walawi wenzao wanaume katika huduma.
- source_word: לְנֶגְדָּם
  choice: waliokuwa wakikabiliana nao
  rationale: Kirai kinaonyesha kuwa kundi moja lilikuwa mbele ya, au sambamba kwa ulinganifu na, kundi jingine; tanbihi huhifadhi uwezekano huo wa pili.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: ili kusifu na kushukuru
  rationale: Vitenzi viwili vya kiliturujia vimehifadhiwa tofauti bila kuvichanganya kuwa tendo moja.
- source_word: בְּמִצְוַת דָּוִיד אִישׁ הָאֱלֹהִים
  choice: kulingana na agizo la Daudi, mtu wa Mungu
  rationale: בְּ hapa huonyesha kufuata amri au agizo; cheo cha kibiblia ‘mtu wa Mungu’ kimehifadhiwa bila ufafanuzi wa ziada.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: kikundi cha zamu kikikabiliana na kikundi kingine cha zamu
  rationale: מִשְׁמָר katika muktadha huu inaelekea kumaanisha zamu au kikundi cha huduma. Tafsiri huhifadhi urudiaji na ulinganifu wa kishazi huku ikiepuka ‘ulinzi,’ ambalo lingeweza kupotosha katika mazingira ya ibada.
theological_decisions:
- issue: Istilahi ya undugu yenye jinsia אֲחֵיהֶם
  choice: ndugu zao
  alternative: Walawi wenzao
  rationale: Kiebrania ni wingi wa kiume na muktadha unawahusu wanaume Walawi katika huduma; istilahi ya undugu imehifadhiwa badala ya kuigeuza kuwa ya kijumla.
- issue: Kishazi kifupi cha huduma מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: kikundi cha zamu kikikabiliana na kikundi kingine cha zamu
  alternative: zamu moja ikilingana na zamu nyingine
  rationale: Andiko linaonyesha mpangilio wa vikundi vya huduma lakini halisemi wazi kama vilibadilishana kuimba au kutenda kwa namna nyingine. Tafsiri na tanbihi huhifadhi mvutano huo bila kuingiza maelezo yasiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya maandiko. ‘Viongozi’ na ‘vikundi vya zamu’ vinaeleweka kwa wasomaji wa kawaida; muundo wenye utata wa mwisho umehifadhiwa na kufafanuliwa kwa kiasi katika tanbihi.
