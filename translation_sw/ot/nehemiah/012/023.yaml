base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: sw
  text: Wana wa Lawi, waliokuwa wakuu wa jamaa za ukoo, waliandikwa katika kitabu cha kumbukumbu za matukio[a] hadi siku za Yohanani mwana wa Eliashibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kitabu cha kumbukumbu za matukio” humaanisha rekodi rasmi ya kihistoria au rejesta; si lazima kirejelee vitabu vya Biblia viitwavyo Mambo ya Nyakati.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: Wana wa Lawi
  rationale: Huhifadhi muundo halisi wa Kiebrania badala ya kuufupisha kuwa “Walawi,” na hivyo kudumisha uhusiano wake na maelezo yanayofuata kuhusu wakuu wao.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa jamaa za ukoo
  rationale: Nahau hii humaanisha viongozi wa vikundi vya kifamilia vinavyotokana na mababu. Tafsiri hii ni ya kawaida katika Kiswahili na inaepuka usemi usio wa asili “wakuu wa nyumba za baba.”
- source_word: כְּתוּבִים
  choice: waliandikwa
  rationale: Huwasilisha hali ya majina ya watu hawa kuwekwa rasmi katika kumbukumbu, bila kuongeza neno “majina” ambalo halipo wazi katika matini.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: katika kitabu cha kumbukumbu za matukio
  rationale: Kihusishi “katika” ni cha kawaida kwa habari iliyo ndani ya kitabu. “Kumbukumbu za matukio” huonyesha rejesta au historia rasmi bila kudokeza kwa lazima vitabu vya Biblia vya Mambo ya Nyakati.
- source_word: וְעַד יְמֵי
  choice: hadi siku za
  rationale: Huweka mpaka wa wakati wa kumbukumbu kwa namna fupi na ya asili katika Kiswahili.
- source_word: יוֹחָנָן
  choice: Yohanani
  rationale: Ni uhawilishaji wa kawaida wa jina hili la Kiebrania katika Kiswahili cha Biblia.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: mwana wa Eliashibu
  rationale: Huwasilisha moja kwa moja uhusiano wa nasaba unaoonyeshwa na muundo wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “wana wa Lawi” umehifadhiwa kwa uaminifu kwa matini, huku nahau ya ukoo ikitolewa kwa lugha ya kawaida. Tanbihi ya Kiingereza kuhusu namna mbili za kuandika Yohanan haikuhamishwa, kwa kuwa tofauti hiyo ni mahsusi kwa tahajia ya Kiingereza na si mbadala wa maana katika Kiswahili.
