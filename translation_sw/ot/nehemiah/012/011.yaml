  yaml_path: translation/ot/nehemiah/012/011.yaml
  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: sw
  text: Naye Yoyada akamzaa Yonathani[a], na Yonathani akamzaa Yadua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na tafsiri zina “Yohanani” badala ya “Yonathani.” Maandishi ya Kiebrania yaliyotumiwa hapa yana “Yonathani.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza orodha ya ukoo kutoka mstari uliotangulia; “Naye” ni cha kawaida na cha asili katika simulizi la ukoo la Kiswahili.
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Jina la mtu limetoholewa kwa kufuata umbo la Kiebrania na matumizi yanayoeleweka katika Kiswahili.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika muktadha wa ukoo, kausativi ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya asili, na huhifadhi maana ya ukoo wa baba.
- source_word: אֶת
  choice: '[halijatafsiriwa moja kwa moja]'
  rationale: Hiki ni kiashiria cha yambwa mahususi katika Kiebrania; kazi yake inaonyeshwa na mpangilio wa maneno katika Kiswahili.
- source_word: יוֹנָתָן
  choice: Yonathani
  rationale: Maandishi ya WLC yana יוֹנָתָן, yaani Yonathani; tofauti ya “Yohanani” imehifadhiwa katika tanbihi badala ya kubadilisha matini kuu.
- source_word: וְ
  choice: na
  rationale: Kiunganishi cha pili kinaendeleza mfuatano rahisi wa ukoo.
- source_word: יַדּוּעַ
  choice: Yadua
  rationale: Jina la mtu limetoholewa kutoka katika umbo la Kiebrania kwa tahajia ya asili ya Kiswahili.
