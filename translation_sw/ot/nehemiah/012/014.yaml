  rationale: Kama katika kishazi cha kwanza, ל inaeleweka kuwa alama ya uwakilishi katika orodha hii. Jina שְׁבַנְיָה limetoholewa kuwa ‘Shebania.’
- source_word: יוֹסֵֽף
