  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: sw
  text: 'Hawa ndio makuhani na Walawi waliopanda pamoja na Zerubabeli mwana wa Shealtieli na Yeshua[a]: Seraya, Yeremia na Ezra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yeshua”; pia “Yoshua” ikiwa jina linasawazishwa badala ya kufuatwa umbo la Kiebrania.'
