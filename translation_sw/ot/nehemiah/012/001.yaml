lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Hutambulisha orodha mpya kwa Kiswahili cha kawaida; kiunganishi וְ kina nguvu ya kuendeleza maelezo, lakini hakihitaji kutafsiriwa kwa neno la ziada hapa.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: makuhani na Walawi
  rationale: Haya ndiyo majina ya kawaida na yaliyo wazi kwa makundi haya mawili katika muktadha wa orodha.
- source_word: אֲשֶׁר עָלוּ
  choice: waliopanda
  rationale: Kitenzi עלה kinaashiria kupanda kuelekea Yuda/Yerusalemu katika muktadha wa kurudi kutoka uhamishoni; tafsiri hii inadumisha taswira hiyo.
- source_word: עִם
  choice: pamoja na
  rationale: Huonyesha kuandamana kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Zerubabeli mwana wa Shealtieli
  rationale: Majina yamewasilishwa kwa maumbo yaliyozoeleka katika Kiswahili, na uhusiano wa mwana umeonyeshwa moja kwa moja.
- source_word: וְיֵשׁוּעַ
  choice: na Yeshua[a]
  rationale: Yeshua linahifadhi umbo maalumu la jina la Kiebrania יֵשׁוּעַ badala ya kulisawazisha kuwa Yoshua; tanbihi inaonyesha uwezekano huo.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: Seraya, Yeremia na Ezra
  rationale: Majina haya yanaanza orodha inayofuata utangulizi na yametolewa kwa maumbo ya Kiswahili yanayotambulika.
