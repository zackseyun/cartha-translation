base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/042.yaml
  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: sw
  text: na Maaseya, Shemaya, Eleazari, Uzi, Yehohanani, Malkiya, Elamu na Ezeri. Nao waimbaji wakafanya sauti zao zisikike[a], pamoja na Yizrahia, msimamizi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “wakaimba kwa sauti kubwa.” Kitenzi cha Kiebrania kiko katika muundo wa kusababisha: “wakafanya isikike.”'
    reason: lexical_alternative
  - marker: b
    text: Au “mwangalizi” au “afisa.” Muundo wa Kiebrania unaunganisha Yizrahia na cheo hiki bila kufafanua zaidi uhusiano wake na waimbaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa kawaida katika Kiswahili huku likihifadhi umbo la Kiebrania.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina limetoholewa badala ya kutafsiriwa.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Utohozi mfupi na wa moja kwa moja wa jina la Kiebrania.
- source_word: יְהוֹחָנָן
  choice: Yehohanani
  rationale: Huhifadhi umbo kamili la jina la Kiebrania na kulitengeneza lisomeke kwa Kiswahili.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Utohozi wa jina unaohifadhi konsonanti na mwisho wa jina la Kiebrania.
- source_word: עֵילָם
  choice: Elamu
  rationale: Hapa ni jina la mtu; limetoholewa bila kulitafsiri kama eneo.
- source_word: עָזֶר
  choice: Ezeri
  rationale: Jina la mtu limetoholewa kwa muundo wa Kiswahili.
- source_word: וַיַּשְׁמִיעוּ
  choice: wakaimba kwa sauti kubwa
  rationale: Hifili ya שמע ina maana ya kusababisha kusikika; katika muktadha wa waimbaji, usemi huu wa asili unaonyesha kwamba uimbaji wao ulisikika wazi na kwa nguvu.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya nomino inayotokana na שׁיר katika muktadha wa ibada.
- source_word: יִזְרַחְיָה
  choice: Yizrahia
  rationale: Jina la mtu limetoholewa kwa kufuata umbo la Kiebrania.
- source_word: הַפָּקִיד
  choice: msimamizi
  rationale: Neno linaashiria mtu aliyeteuliwa kuwa juu ya wengine kwa jukumu la usimamizi; 'msimamizi' ni la kawaida na haliongezi cheo kisichotajwa.
theological_decisions:
- issue: Uhusiano wa Yizrahia na waimbaji
  choice: wakiongozwa na Yizrahia, msimamizi
  alternative: na Yizrahia, msimamizi
  rationale: Kiebrania kinaunganisha jina na cheo baada ya taarifa kuhusu waimbaji. Tafsiri hii inaeleza uhusiano unaodokezwa na cheo, huku tanbihi ikihifadhi uwezekano wa muundo usiofafanua moja kwa moja namna ya uhusiano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha ya majina imehifadhiwa kwa utohozi unaosomeka; sentensi ya pili imetolewa kwa lugha ya kawaida bila kupoteza maana sababishi ya kitenzi cha Kiebrania.
