  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Salai, Kalai; kwa Amoki, Eberi.” Kihusishi cha Kiebrania לְ katika orodha hii huonyesha uhusiano na nyumba ya kikuhani iliyotajwa; kinaweza kutafsiriwa “wa,” “kwa,” au “wa nyumba ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/סַלַּי
  choice: kwa ajili ya Salai
  rationale: Katika orodha hii, kiambishi לְ kinaonyesha uhusiano na jamaa au nyumba ya kikuhani iliyotajwa. Kiswahili “kwa ajili ya” kinadumisha muundo wa kichwa cha orodha, ingawa “wa” pia yawezekana.
- source_word: קַלָּי
  choice: Kalai
  rationale: Jina limetoholewa kwa kufuata sauti za Kiebrania; konsonanti iliyodhoofishwa mara mbili haihitaji kuandikwa mara mbili katika tahajia ya kawaida ya Kiswahili.
- source_word: לְ/עָמוֹק
  choice: kwa ajili ya Amoki
  rationale: Kama katika kishazi cha kwanza, לְ linaonyesha uhusiano na nyumba ya kikuhani; jina עָמוֹק limetoholewa kuwa “Amoki” kwa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa umbo linalopatana na matamshi na tahajia ya Kiswahili.
theological_decisions: []
translation_notes:
