  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hutumia kihusishi ל (‘kwa,’ ‘wa,’ au ‘kwa ajili ya’) kabla ya majina ya koo katika orodha hii. Hapa ‘kwa’ linaonyesha uwakilishi: Zekaria alikuwa mwakilishi wa Adaia, na Meshulamu wa Ginethoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/עדיא
  choice: kwa Adaia
  rationale: Nakala ya Kiebrania inasoma ‘Adaia,’ si ‘Ido.’ Kiambishi ל katika orodha hii kinaonyesha uhusiano wa uwakilishi, hivyo kimetafsiriwa kwa ‘kwa.’
- source_word: זְכַרְיָה
  choice: Zekaria
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: לְ/גִנְּתוֹן
  choice: kwa Ginethoni
  rationale: Kama katika kishazi cha kwanza, ל linaonyesha ukoo au nyumba iliyowakilishwa na mtu anayetajwa baada yake.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili.
