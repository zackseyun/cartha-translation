id: NEH.12.28
reference: Nehemiah 12:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: sw
  text: Nao wana wa waimbaji wakakusanyika kutoka eneo lililoizunguka Yerusalemu[a], na kutoka vijiji vya Wanetofathi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwanda unaoizunguka Yerusalemu.” Neno la Kiebrania כִּכָּר linaweza kumaanisha uwanda, duara, au eneo kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “makazi ya Wanetofathi.” Neno la Kiebrania חַצְרֵי mara nyingi humaanisha makazi madogo au vijiji visivyozungushiwa ukuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Nifali ya kitenzi אסף inaweza kuwa na maana ya kutendwa au kujirejelea. Kiswahili cha 'wakakusanyika' ni cha kawaida na hakiamui kimabavu kama waliitwa na mtu au walijikusanya wenyewe.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: wana wa waimbaji
  rationale: Huhifadhi muundo wa Kiebrania 'wana wa' na neno mahususi la waimbaji; katika muktadha linaweza kutaja ukoo au kundi lao la kikazi.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: eneo lililoizunguka Yerusalemu
  rationale: כִּכָּר inaweza kumaanisha uwanda, duara, au eneo. Muktadha wa סְבִיבוֹת unaelekeza kwa sehemu zinazozunguka Yerusalemu, hivyo 'eneo' ni wazi na la asili bila kulazimisha topografia ya uwanda.
- source_word: חַצְרֵי
  choice: vijiji
  rationale: Katika muktadha wa kijiografia, חָצֵר mara nyingi ni kijiji au makazi madogo yasiyozungushiwa ukuta, si ua wa nyumba.
- source_word: נְטֹפָתִי
  choice: Wanetofathi
  rationale: Umbo hili ni la jina la watu wanaohusishwa na Netofa; 'Wanetofathi' huhifadhi maana hiyo badala ya kulifanya kuwa jina la mahali pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo 'wana wa waimbaji' umehifadhiwa kwa ulinganifu wa kimtindo na Kiebrania, huku tanbihi zikihifadhi uwezekano wa maana za maneno ya kijiografia.
