  text: וּ/מִ/בְּנֵ֥י הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְר֑וֹת זְכַרְיָ֨ה בֶן יֽוֹנָתָ֜ן בֶּן שְׁמַֽעְיָ֗ה בֶּן מַתַּנְיָה֙ בֶּן מִ֣יכָיָ֔ה בֶּן זַכּ֖וּר בֶּן אָסָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: sw
  text: 'na baadhi ya wana wa makuhani[a], wakiwa na tarumbeta: Zakaria mwana wa Yonathani, mwana wa Shemaya, mwana wa Matania, mwana wa Mikaya, mwana wa Zakuri, mwana wa Asafu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kutoka miongoni mwa wana wa makuhani, wakiwa na tarumbeta.” Usemi wa Kiebrania unaonyesha kwamba hawa walikuwa sehemu ya kundi la wana wa makuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: na baadhi ya wana wa
  rationale: Muundo wa מִן pamoja na בְּנֵי una maana ya sehemu ya kundi. Kiswahili cha kawaida ‘baadhi ya wana wa’ huwasilisha maana hiyo kwa uwazi bila kudai kwamba wana wote wa makuhani walitajwa hapa.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כהנים katika muktadha wa ibada na maandamano.
- source_word: בַּחֲצֹצְרוֹת
  choice: wakiwa na tarumbeta
  rationale: Kiambishi בְּ־ hapa kinaonyesha chombo walichokuwa nacho au walichotumia. ‘Wakiwa na tarumbeta’ ni cha asili katika Kiswahili na kinaendana na muktadha wa maandamano.
- source_word: זְכַרְיָה
  choice: Zakaria
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: בֶן
  choice: mwana wa
  rationale: Limedumishwa katika kila hatua ili kuhifadhi muundo wa nasaba wa Kiebrania.
- source_word: יוֹנָתָן
  choice: Yonathani
  rationale: Tahajia ya kawaida ya Kibiblia katika Kiswahili.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Unukuzi unaoeleweka na unaolingana na matumizi ya majina ya Kibiblia katika Kiswahili.
- source_word: מַתַּנְיָה
  choice: Matania
  rationale: Unukuzi wa kawaida na unaosomeka kwa urahisi katika Kiswahili.
- source_word: מִיכָיָה
  choice: Mikaya
  rationale: Huhifadhi jina kama lilivyo tofauti na umbo fupi Mika.
- source_word: זַכּוּר
  choice: Zakuri
  rationale: Unukuzi wa kawaida unaofuata mfumo wa sauti wa Kiswahili.
- source_word: אָסָף
  choice: Asafu
  rationale: Umbo lililozoeleka katika Kiswahili kwa jina hili la Kibiblia.
theological_decisions:
- issue: Uhusiano wa nasaba na Asafu
  choice: Kurudia ‘mwana wa’ kama ilivyo katika Kiebrania bila kuongeza ufafanuzi kuhusu ukoo, chama cha waimbaji, au uandishi.
  alternative: Kutafsiri ‘mwana wa Asafu’ kwa maana pana kuwa ‘mzao wa Asafu.’
  rationale: Kifungu chenyewe kinatumia בֶן mara kwa mara. Tafsiri inahifadhi namna hiyo ya nasaba na haibainishi ikiwa kila uhusiano ni wa kizazi cha moja kwa moja au ni wa ukoo mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Kifungu kimeachwa kianze kwa ‘na’ kwa sababu kinaendeleza orodha kutoka mstari uliotangulia. Majina yametolewa kwa maumbo ya Kiswahili yanayotumika kwa kawaida.
