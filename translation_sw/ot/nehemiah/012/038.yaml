base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: sw
  text: Na kundi la pili la kutoa shukrani likaenda upande wa kushoto[a]. Mimi nikafuata nyuma yake, pamoja na nusu ya watu, juu ya ukuta, kuanzia juu ya Mnara wa Tanuri hadi Ukuta Mpana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kundi la pili la waimbaji wa shukrani” au “kundi la pili la maandamano ya shukrani.” Neno la Kiebrania linaweza kumaanisha kundi la shukrani katika maandamano ya sherehe, wala si kuimba pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: kundi la pili la kutoa shukrani
  rationale: Katika muktadha wa makundi mawili ya sherehe yaliyotembea juu ya ukuta, neno hili linamaanisha kundi la shukrani katika maandamano, bila kulazimisha maana kuwa waimbaji pekee.
- source_word: הַשֵּׁנִית
  choice: la pili
  rationale: Ni namba ya mpangilio inayolirejelea kundi la shukrani.
- source_word: הַהוֹלֶכֶת
  choice: likaenda
  rationale: Huwasilisha mwendo wa kundi katika simulizi kwa Kiswahili cha kawaida; muktadha unaonyesha maandamano yaliyokuwa yakiendelea.
- source_word: לְמוֹאל
  choice: upande wa kushoto
  rationale: Hii ndiyo maana ya kawaida ya mwelekeo huu, huku kundi jingine likienda upande mwingine.
- source_word: אַחֲרֶיהָ
  choice: nyuma yake
  rationale: Kiambishi cha kike kinarejelea kundi hilo, na maana hapa ni kufuata kwa nafasi katika maandamano.
- source_word: חֲצִי הָעָם
  choice: nusu ya watu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki.
- source_word: מֵעַל לְהַחוֹמָה
  choice: juu ya ukuta
  rationale: Muktadha unaonyesha watu wakitembea juu ya ukuta wa jiji.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Mnara wa Tanuri
  rationale: Huhifadhi muundo wa jina la mahali na maana ya tanuri za kuokea au kuchomea.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: Ukuta Mpana
  rationale: Inaonekana kuwa jina maalumu la sehemu inayojulikana ya ukuta wa Yerusalemu.
