  text: וַ/יִּזְבְּח֣וּ בַ/יּוֹם הַ֠/הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַ/יִּשְׂמָ֗חוּ כִּ֤י הָ/אֱלֹהִים֙ שִׂמְּחָ/ם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְ/גַ֧ם הַ/נָּשִׁ֛ים וְ/הַ/יְלָדִ֖ים שָׂמֵ֑חוּ וַ/תִּשָּׁמַ֛ע שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵ/רָחֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: sw
  text: Siku hiyo walitoa dhabihu kubwa, wakafurahi, kwa sababu Mungu alikuwa amewafurahisha kwa furaha kubwa. Wanawake na watoto pia walifurahi,[a] nayo furaha ya Yerusalemu ikasikika kutoka mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wake na watoto pia walifurahi,” kwa kuwa neno la Kiebrania linaweza kumaanisha “wanawake” au “wake,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים גְּדוֹלִים
  choice: walitoa dhabihu kubwa
  rationale: Katika muktadha wa ibada, kitenzi זבח pamoja na nomino זְבָחִים hueleza kutoa dhabihu. Kiswahili ‘walitoa dhabihu’ ni cha kawaida na huepuka urudiaji usio wa lazima, huku ‘kubwa’ kikihifadhi upana wa גְּדוֹלִים bila kuibana kuwa ‘nyingi’ pekee.
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: wakafurahi / walifurahi
  rationale: ‘Kufurahi’ huwasilisha maana ya mzizi שׂמח na kudumisha mshikamano wa msamiati unaorudiwa katika aya.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: alikuwa amewafurahisha kwa furaha kubwa
  rationale: Muundo huu unahifadhi nguvu ya kisababishi ya kitenzi cha Kiebrania na pia urudiaji wenye mkazo wa mzizi wa ‘furaha’.
- source_word: הַנָּשִׁים וְהַיְלָדִים
  choice: wanawake na watoto
  rationale: נָשִׁים inaweza kumaanisha wanawake au wake; bila kiashirio cha umilikaji, ‘wanawake’ ndiyo tafsiri pana na salama zaidi. יְלָדִים hapa ni ‘watoto’.
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: nayo furaha ya Yerusalemu ikasikika kutoka mbali
  rationale: ‘Ikasikika’ huhifadhi hali ya kutendwa ya וַתִּשָּׁמַע, na ‘furaha ya Yerusalemu’ huacha wazi ikiwa ni furaha ya mji au ya watu wake.
theological_decisions:
- issue: Mungu kuwa chanzo cha furaha
  choice: Mungu alikuwa amewafurahisha kwa furaha kubwa
  alternative: Mungu alikuwa amewapa furaha kubwa
  rationale: 'Kitenzi שִׂמְּחָם kina nguvu ya kisababishi: Mungu ndiye aliyewafanya wafurahi. Tafsiri iliyochaguliwa huhifadhi uwakala huo waziwazi.'
- issue: Upeo wa jamii iliyofurahi
  choice: Wanawake na watoto pia walifurahi
  alternative: Wake na watoto pia walifurahi
  rationale: Aya inataja wazi makundi haya katika sherehe ya jumuiya. ‘Wanawake’ huhifadhi maana pana ya neno la Kiebrania bila kulifanya kwa lazima limaanishe ‘wake’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni wa asili kwa Kiswahili huku ukihifadhi urudiaji wa ‘furaha’ na mkazo wa kwamba Mungu aliwasababisha wafurahi.
