base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
translation:
  language: sw
  text: Basi makundi mawili ya kutoa shukrani[a] yakasimama katika nyumba ya Mungu; nami pamoja na nusu ya maofisa waliokuwa nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “shukrani mbili.” Katika muktadha huu, usemi huo unarejelea makundi mawili ya kutoa shukrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: yakasimama
  rationale: Kitenzi hiki ni wayyiqtol, nafsi ya tatu wingi wa kike, kikirejelea makundi mawili; “yakasimama” ni lugha ya kawaida na huonyesha kwamba yalichukua nafasi zao katika ibada.
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: yale makundi mawili ya kutoa shukrani
  rationale: Kwa neno moja moja ni “shukrani mbili,” lakini katika muktadha linamaanisha makundi mawili yaliyopangwa kwa ajili ya shukrani. “Makundi” huepuka kubainisha bila lazima kwamba yalikuwa kwaya pekee, huku maelezo ya chini yakihifadhi usemi halisi.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: katika nyumba ya Mungu
  rationale: Huhifadhi nahau ya Kiebrania “nyumba ya Mungu” na maana ya mahali inayotolewa na kihusishi בְּ.
- source_word: וַאֲנִי
  choice: nami nikasimama
  rationale: Kiebrania kinasema kihalisi “na mimi,” huku kitenzi cha kusimama kikieleweka kutoka kishazi kilichotangulia. Kukirudia kwa Kiswahili huunda sentensi kamili na ya kawaida bila kubadili maana.
- source_word: וַחֲצִי הַסְּגָנִים
  choice: pamoja na nusu ya maofisa
  rationale: סְגָנִים ni watawala au wasimamizi wa ngazi fulani; “maofisa” ni neno pana, la sasa, na linalofaa katika muktadha wa utawala.
- source_word: עִמִּי
  choice: waliokuwa pamoja nami
  rationale: Hutoa wazi uhusiano wa kuandamana unaomaanishwa na עִמִּי, huku ukipunguza utata wa mpangilio wa sentensi ya Kiswahili.
