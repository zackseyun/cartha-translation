translation:
  language: sw
  text: 'na makuhani: Eliakimu, Maaseya, Miniamini, Mikaya, Elioenai, Zekaria na Hanania, wakiwa na tarumbeta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na tarumbeta.” Kiebrania kinaweza kuonyesha tu kwamba makuhani hawa waliandamana na tarumbeta au walipewa jukumu linalohusiana nazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: na makuhani
  rationale: Kiunganishi וְ kinaendeleza orodha ya maandamano kutoka mstari uliotangulia, na הַכֹּהֲנִים ni neno la kawaida linalomaanisha “makuhani.”
- source_word: אֶלְיָקִים מַעֲשֵׂיָה מִנְיָמִין מִיכָיָה אֶלְיוֹעֵינַי זְכַרְיָה חֲנַנְיָה
  choice: Eliakimu, Maaseya, Miniamini, Mikaya, Elioenai, Zekaria na Hanania
  rationale: Majina yametoholewa kwa tahajia za Kiswahili zinazoakisi maumbo ya Kiebrania huku yakibaki rahisi kusoma na kutamka.
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: wakiwa na tarumbeta
  rationale: בְּ hapa yaelekea kuonyesha uandamani au kifaa walichokuwa nacho makuhani. “Wakiwa na tarumbeta” ni Kiswahili cha kawaida na hakidai wazi zaidi ya chanzo kwamba walikuwa wakizipiga.
