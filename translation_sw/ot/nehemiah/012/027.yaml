  source_fidelity: 'Maana kuu imehifadhiwa vizuri: Walawi walitafutwa kutoka mahali walipokuwa, wakaletwa Yerusalemu kwa ajili ya sherehe ya kuwekwa wakfu yenye furaha, shukrani, uimbaji, na ala zilizotajwa. Hata hivyo, muundo wa kusudi katika rasimu, “ili wawalete Yerusalemu wafanye,” unaunganisha vitenzi bila kiunganishi cha kutosha na unaweza kutatanisha ni nani anayefanya sherehe. Muundo wa nomino “kuwekwa wakfu kwa ukuta” pia huakisi kwa karibu zaidi חנכת חומת kuliko “kuuweka wakfu ukuta.”'
  naturalness: 'Marekebisho yanatumia Kiswahili Sanifu cha sasa na chenye mtiririko wa kawaida: “Wakati wa kuwekwa wakfu kwa ukuta wa Yerusalemu” na “ili wawalet[e] Yerusalemu kufanya sherehe...” Ala na orodha ya vipengele vya sherehe vimeachwa katika mpangilio wa asili.'
