base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: sw
  text: Wakati wa kuwekwa wakfu kwa ukuta wa Yerusalemu, waliwatafuta[a] Walawi kutoka kila mahali walipokuwa, ili wawalet[e] Yerusalemu kufanya sherehe ya kuwekwa wakfu[b] kwa furaha, kwa shukrani, na kwa kuimba, wakitumia matoazi, vinanda, na vinubi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliwaita Walawi.” Katika muktadha huu kitenzi hiki kinaweza kudokeza kuwakusanya au kuwaita, lakini kimsingi humaanisha “kutafuta.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “kufanya kuwekwa wakfu.”
    reason: lexical_alternative
  - marker: c
    text: Haijulikani kwa uhakika ala za kale zilizoitwa hapa “vinanda” na “vinubi” zilikuwa na maumbo gani. Kiebrania kinataja aina mbili tofauti za ala za nyuzi.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: Wakati wa kuuweka wakfu ukuta wa Yerusalemu
  rationale: Kifungu hiki kinaweka wakati wa tukio. Muundo wa Kiswahili wenye kitenzi-jina unaeleweka kwa urahisi na unahifadhi maana ya kuuweka ukuta wakfu.
- source_word: בִּקְשׁוּ
  choice: waliwatafuta
  rationale: Kitenzi cha Kiebrania kimsingi humaanisha kutafuta. Tafsiri hii haiingizi kwa lazima wazo mahususi zaidi la kuwaita au kuwatuma wajumbe.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: kutoka kila mahali walipokuwa
  rationale: Hii ni Kiswahili cha kawaida kinachoeleza ‘kutoka sehemu zao zote’ bila kudai kwamba sehemu hizo zilikuwa makazi rasmi.
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: ili wawalete Yerusalemu
  rationale: Hifadhi ya kausativi ya kitenzi cha Kiebrania inaonyeshwa kwa ‘wawalete,’ badala ya kusema tu kwamba waje.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: wafanye sherehe ya kuwekwa wakfu
  rationale: Kiebrania ni ‘kufanya kuwekwa wakfu.’ Muundo huu ni wa kawaida zaidi katika Kiswahili na bado unahifadhi tendo la sherehe ya kuweka wakfu.
- source_word: וְשִׂמְחָה וּבְתוֹדוֹת וּבְשִׁיר
  choice: kwa furaha, kwa shukrani na kwa kuimba
  rationale: Mfululizo huu unahifadhi furaha, utoaji wa shukrani, na uimbaji kama vipengele tofauti vya sherehe.
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: matoazi, vinanda na vinubi
  rationale: ‘Matoazi’ ni neno la kawaida kwa cymbals; ‘vinanda’ na ‘vinubi’ yanatofautisha ala mbili tofauti za nyuzi, huku tanbihi ikikiri kutokuwa na uhakika kuhusu ulinganifu wake kamili.
