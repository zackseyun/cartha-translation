    issue: Muundo wa kusudi “ili wawalete Yerusalemu wafanye sherehe” hauna kiunganishi wazi kati ya “wawalete” na “wafanye.”
    rationale: Unaweza kusomwa kwa shida na haufafanui kwa uwazi uhusiano wa kuwaleta Walawi na kufanya sherehe. “Ili wawalet[e] Yerusalemu kufanya sherehe” ni wa kawaida na huhifadhi kusudi la Kiebrania.
  - severity: low
    issue: “Wakati wa kuuweka wakfu ukuta” ni muundo usio laini ukilinganishwa na usemi wa nomino.
    rationale: “Wakati wa kuwekwa wakfu kwa ukuta wa Yerusalemu” ni Kiswahili cha asili zaidi na hudumisha maana ya חנכה, ‘dedication.’
  - severity: low
    issue: Tanbihi a inarudia na kupanua “kutafuta” kwa “waliwaendea kuwatafuta,” ambayo si mbadala wa karibu wa kitenzi cha Kiebrania.
    rationale: Tanbihi inapaswa kutaja mbadala wa maana unaowezekana katika muktadha—“waliwaita”—huku ikieleza kwamba maana ya msingi ni ‘kutafuta.’
