base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: sw
  text: na juu ya Lango la Efraimu, na juu ya Lango la Kale, na juu ya Lango la Samaki, na Mnara wa Hananeli, na Mnara wa Mia, mpaka Lango la Kondoo; nao wakasimama[a] kwenye Lango la Walinzi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakasimama hapo” au “wakatua.” Kitenzi cha Kiebrania kinaweza kumaanisha kusimama au, katika muktadha huu, kuacha kwenda mbele.
    reason: lexical_alternative
  - marker: b
    text: Au, “Lango la Gereza” au “Lango la Zamu ya Ulinzi.” Maana kamili ya jina hili la Kiebrania haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעַל / וְעַל
  choice: na juu ya
  rationale: Kirai hiki huhifadhi maana ya mahali ya ‘juu ya’ katika maelezo ya njia ya msafara uliokuwa ukipita ukutani, huku marudio ya Kiebrania yakidumishwa.
- source_word: לְשַׁעַר אֶפְרַיִם
  choice: Lango la Efraimu
  rationale: Muundo wa kawaida wa Kiswahili kwa jina la lango, huku jina Efraimu likifuata matumizi yaliyozoeleka ya Kibiblia.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: Lango la Kale
  rationale: Hutoa maana ya moja kwa moja ya kivumishi ‘la kale’ bila kukipanua kuwa lango la mji wa kale au kukifanya jina lisilotafsiriwa.
- source_word: שַׁעַר הַדָּגִים
  choice: Lango la Samaki
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya muundo ‘lango la samaki.’
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: Mnara wa Hananeli
  rationale: ‘Mnara’ hutafsiri מִגְדָּל, na ‘Hananeli’ ni umbo la jina linalosikika kwa kawaida katika Kiswahili cha Kibiblia.
- source_word: מִגְדַּל הַמֵּאָה
  choice: Mnara wa Mia
  rationale: Huhifadhi usemi halisi ‘mnara wa mia’ kwa kuwa kile kinachorejelewa na ‘mia’ hakijulikani kwa uhakika.
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: mpaka Lango la Kondoo
  rationale: ‘Mpaka’ huonyesha kikomo cha njia, na ‘Lango la Kondoo’ hutafsiri jina la mahali moja kwa moja.
- source_word: וְעָמְדוּ
  choice: nao wakasimama
  rationale: ‘Wakasimama’ hufuata maana ya msingi ya kitenzi עמד; katika muktadha wa msafara kinaweza pia kumaanisha kwamba walisimama hapo, yaani waliishia au walitua hapo.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: kwenye Lango la Walinzi
  rationale: ‘Walinzi’ huhifadhi wazo la ulinzi au zamu ya ulinzi bila kuamua kwa lazima kwamba mahali hapo palikuwa gereza.
theological_decisions: []
