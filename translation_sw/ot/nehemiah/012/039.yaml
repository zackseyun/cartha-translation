  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya malango yameandikwa kwa mtindo wa majina rasmi. Marudio ya ‘juu ya’ yamehifadhiwa ili kuonyesha njia ya msafara juu ya ukuta; alama za tanbihi zimewekwa moja kwa moja kwenye maneno yanayohusika.
