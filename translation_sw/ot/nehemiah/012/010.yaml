base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/010.yaml
  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: sw
  text: Yeshua akamzaa Yoyakimu[a], Yoyakimu akamzaa Eliashibu, naye Eliashibu akamzaa Yoyada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia kauli ya nasaba ambayo kihalisi ni “Yeshua alisababisha Yoyakimu azaliwe.” Hapa “akamzaa” inatoa maana yake ya kawaida.
    reason: lexical_alternative
  - marker: b
    text: Majina Yoyakimu na Yoyada pia huandikwa Yehoyakimu na Yehoyada katika baadhi ya mapokeo ya majina ya Biblia.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania; umbo hili pia humtofautisha na Yoshua mwana wa Nuni.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hiphil ya ילד humaanisha ‘kusababisha azaliwe,’ yaani baba kumzaa mtoto. ‘Akamzaa’ ni usemi wa kawaida, mfupi, na unaodumisha maana ya nasaba ya upande wa baba.
- source_word: אֶת
  choice: halijatafsiriwa kwa neno maalumu
  rationale: Ni alama ya yambwa mahsusi katika Kiebrania, isiyo na maana huru ya kileksia; dhima yake inaonyeshwa na mpangilio wa Kiswahili.
- source_word: יוֹיָקִים
  choice: Yoyakimu
  rationale: Jina limetoholewa kutoka umbo la Kiebrania lililo katika aya hii, huku mwisho wa konsonanti ukisaidiwa na irabu kwa matamshi ya kawaida ya Kiswahili.
- source_word: אֶלְיָשִׁיב
  choice: Eliashibu
  rationale: Jina limetoholewa kwa kufuata sauti za Kiebrania na muundo unaotamkika kwa urahisi katika Kiswahili.
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Jina limetoholewa kutoka umbo la Kiebrania la aya hii; linadumisha pia ulinganifu wa sehemu ya mwanzo Yo- pamoja na Yoyakimu.
theological_decisions: []
