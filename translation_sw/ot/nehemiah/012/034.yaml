  footnotes:
  - marker: a
    text: Au, katika muktadha mwingine יְהוּדָה lingeweza kumaanisha “Yudea”; hapa jina “Yuda” linafaa zaidi katika orodha hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Katika orodha hii neno hilo linafaa kueleweka kama jina la mtu au kabila, si jina la eneo; limetolewa kwa umbo la kawaida la jina hilo katika Kiswahili.
- source_word: בִנְיָמִן
  choice: Benyamini
  rationale: Ni jina maalumu katika orodha; umbo la kibiblia linalotambulika katika Kiswahili limetumiwa.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Ni jina la mtu; limetoholewa kwa Kiswahili kwa namna inayokaribia umbo la Kiebrania na kubaki rahisi kusomeka.
- source_word: יִרְמְיָה
  choice: Yeremia
  rationale: Ni jina la mtu; umbo la kawaida na linalotambulika katika Kiswahili limetumiwa.
- source_word: וְ / וּ
  choice: na
  rationale: Viunganishi vinavyorudiwa katika Kiebrania vinaunganisha majina katika orodha; Kiswahili cha kawaida hutumia koma na kuweka “na” kabla ya jina la mwisho.
