  rationale: Ni jina la mtu; limetoholewa kwa tahajia ya Kiswahili.
- source_word: לִֽ/ידַֽעְיָה
  choice: kwa Yedaya
  rationale: Kihusishi לְ kinaonyesha uhusiano wa mwakilishi na jamaa ya kikuhani inayotajwa katika orodha.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Ni jina la mtu; limetoholewa kwa tahajia ya Kiswahili.
