  rationale: Kiambishi ל־ kinaonyesha uhusiano katika orodha. Kiebrania hakitaji mwakilishi baada ya jina hili, kwa hiyo ufupi huo umehifadhiwa.
- source_word: לְ/מוֹעַדְיָה
  choice: kwa Moadia
  rationale: Umbo la konsonanti katika WLC linaunga mkono jina Moadia; ni jina la mtu linalohusishwa na zamu au jamaa yake.
- source_word: פִּלְטָי
  choice: Piltai
  rationale: Ni jina la mtu; katika muundo wa orodha, Piltai ndiye anayehusishwa na Moadia.
