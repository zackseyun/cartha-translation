  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֩ בִּ/ימֵ֨י זְרֻבָּבֶ֜ל וּ/בִ/ימֵ֣י נְחֶמְיָ֗ה נֹֽתְנִ֛ים מְנָי֛וֹת הַ/מְשֹׁרְרִ֥ים וְ/הַ/שֹּׁעֲרִ֖ים דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ וּ/מַקְדִּשִׁים֙ לַ/לְוִיִּ֔ם וְ/הַ/לְוִיִּ֔ם מַקְדִּשִׁ֖ים לִ/בְנֵ֥י אַהֲרֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: sw
  text: Nao Waisraeli wote, katika siku za Zerubabeli na katika siku za Nehemia, walitoa mafungu[a] kwa ajili ya waimbaji na walinda malango, kama ilivyohitajika kila siku.[b] Waliweka wakfu mafungu kwa ajili ya Walawi, nao Walawi waliweka wakfu mafungu kwa ajili ya wana wa Haruni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “migao iliyotengwa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “jambo la siku katika siku yake,” yaani, kadiri ya mahitaji ya kila siku.
    reason: lexical_alternative
  - marker: c
    text: Yaani, makuhani wa ukoo wa Haruni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Nao Waisraeli wote
  rationale: Huwasilisha usemi wa kijumla unaomaanisha taifa lote kwa Kiswahili cha kawaida na kinachoeleweka, bila kupunguza maana yake ya agano.
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: katika siku za Zerubabeli na katika siku za Nehemia
  rationale: Yahifadhi urudiaji wa kihistoria wa kirai cha Kiebrania na mtindo wake rasmi kwa namna ya asili katika Kiswahili.
- source_word: נֹתְנִים
  choice: walitoa
  rationale: Ingawa umbo la Kiebrania ni participio lenye wazo la tendo linaloendelea au la kawaida, wakati uliopita unafaa katika muhtasari huu wa kihistoria; muktadha unaonyesha utoaji wa kawaida.
- source_word: מְנָיוֹת
  choice: mafungu
  rationale: Neno hili linamaanisha sehemu au mgao wa mahitaji uliotengewa wahudumu wa Hekalu. “Mafungu” ni fupi, asili, na sahihi katika muktadha.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: waimbaji na walinda malango
  rationale: Haya ni majukumu yaliyotambulika katika huduma ya Hekalu; “walinda malango” ni wazi na ya kawaida kuliko nomino iliyobuniwa.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: kama ilivyohitajika kila siku
  rationale: Hufikisha maana ya nahau kwamba mahitaji au mgao wa kila siku ulitolewa kwa wakati wake, bila kubeba muundo mgumu wa Kiebrania moja kwa moja.
- source_word: וּמַקְדִּשִׁים לַלְוִיִּם
  choice: Walitenga mafungu yaliyowekwa wakfu kwa ajili ya Walawi
  rationale: Huhifadhi maana ya msingi ya קדשׁ ya kutenga kuwa takatifu. “Mafungu” limerudiwa kama kitu kinachoeleweka kutokana na muktadha na ulinganifu wa sentensi, ili Kiswahili kiwe wazi.
- source_word: וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן
  choice: nao Walawi wakatenga mafungu yaliyowekwa wakfu kwa ajili ya wana wa Haruni
  rationale: Yahifadhi ulinganifu wa matendo mawili na maana ya utakatifu wa mafungu, huku “wana wa Haruni” ikibaki karibu na usemi wa Kiebrania.
theological_decisions:
- issue: Maana ya מַקְדִּשִׁים katika muktadha wa mahitaji ya huduma ya Hekalu
  choice: Kutenga mafungu yaliyowekwa wakfu kwa ajili ya Walawi na kisha wana wa Haruni
  alternative: Kutoa au kuchangia tu kwa ajili ya Walawi na makuhani
  rationale: Mzizi קדשׁ una wazo la utakatifu au kuweka wakfu, na mazingira ya ibada yanaunga mkono kulihifadhi. Tafsiri haifanyi tendo hili kuwa utoaji wa kawaida tu, lakini inataja “mafungu” kama kitu kinachodokezwa na muktadha ili sentensi iwe ya asili.
- issue: Utambulisho wa בְנֵי אַהֲרֹן
  choice: wana wa Haruni
  alternative: makuhani wa ukoo wa Haruni
  rationale: Usemi rasmi unaacha wazi lugha ya nasaba ya Kiebrania; muktadha unaonyesha kuwa ni ukoo wa kikuhani, jambo linalofafanuliwa katika tanbihi bila kulibadilisha kimya kimya katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Majina “Zerubabeli” na “Nehemia” yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili. Urudiaji wa “katika siku za” na ulinganifu wa mafungu mawili umehifadhiwa kwa sababu ni sehemu ya msisitizo wa chanzo.
