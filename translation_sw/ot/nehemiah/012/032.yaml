translation:
  language: sw
  text: Hoshaya na nusu ya maofisa wa Yuda wakaenda nyuma yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada yao.” Kiebrania kinaweza kumaanisha kufuata kwa mpangilio; “nyuma yao” hufanya taswira ya maandamano iwe wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: wakaenda
  rationale: Kitenzi cha Kiebrania kinaendeleza simulizi la mwendo uliopita. “Wakaenda” ni Kiswahili cha kawaida kinachofaa katika muktadha wa maandamano.
- source_word: אַחֲרֵיהֶם
  choice: nyuma yao
  rationale: Kirai hiki huonyesha nafasi au mwendo wa kuwafuata wengine; “nyuma yao” kinaweka wazi mpangilio wa kimwili wa maandamano huku “baada yao” kikibaki mbadala halali.
- source_word: הוֹשַׁעְיָה
  choice: Hosaya
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili badala ya kutafsiriwa.
- source_word: וַחֲצִי
  choice: na nusu ya
  rationale: Nomino חֲצִי humaanisha “nusu,” na kiunganishi huunganisha Hosaya na kundi lingine.
- source_word: שָׂרֵי
  choice: maofisa
  rationale: שַׂר inaweza kumaanisha mtawala, mkuu, kiongozi, au ofisa. Katika muktadha huu wa kiutawala na wa sherehe, “maofisa” huepuka dhana isiyokusudiwa ya wana wa kifalme.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali na kabila.
