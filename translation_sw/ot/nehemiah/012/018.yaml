base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/018.yaml
  text: for Bilgah[a], Shammua; for Shemaiah[b], Jehonathan.
translation:
  language: sw
  text: kwa Bilga[a], Shamua; kwa Shemaya, Yehonathani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa Bilga ... wa Shemaya.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kwa namna rasmi zaidi katika orodha za nasaba au za wawakilishi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina umbo kamili la jina, “Yehonathani”; tafsiri nyingine hutumia umbo fupi, “Yonathani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: kwa Bilga
  rationale: Katika orodha hii ya makuhani, kiambishi לְ kinaonyesha uhusiano wa Shamua na ukoo au zamu ya Bilga. “Kwa” ni kifupi na cha kawaida katika muundo wa orodha, huku “wa Bilga” likibaki chaguo halali la tafsiri.
- source_word: שַׁמּוּעַ
  choice: Shamua
  rationale: Ni jina la mwakilishi anayehusishwa na Bilga; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: לִֽ/שְׁמַעְיָה
  choice: kwa Shemaya
  rationale: Kama katika kishazi cha kwanza, לְ inaonyesha uhusiano katika orodha kati ya Shemaya na mwakilishi anayefuata. Jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: יְהוֹנָתָן
  choice: Yehonathani
  rationale: Tahajia hii inadumisha umbo kamili la jina la Kiebrania יְהוֹנָתָן badala ya kulifupisha kuwa Yonathani, na pia inafuata muundo wa kawaida wa majina ya kibiblia katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni mfupi na wenye hadhi, unaofaa orodha ya majina. Majina yametoholewa kwa tahajia inayosomeka kwa wasomaji wa Kiswahili, na alama zote za tanbihi zimewekwa katika matini kuu.
