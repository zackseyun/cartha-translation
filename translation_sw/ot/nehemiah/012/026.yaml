base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: sw
  text: Hawa walikuwako katika siku za Yoyakimu mwana wa Yeshua, mwana wa Yosadaki, na katika siku za Nehemia, gavana, na Ezra, kuhani na mwandishi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Ezra, kuhani-mwandishi.” Kiebrania kinampa Ezra vyeo viwili vilivyowekwa sambamba: “kuhani” na “mwandishi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa waliishi
  rationale: Kiwakilishi hiki cha wingi kinawarejelea watu waliotajwa kabla. Kitenzi “waliishi” kinaongezwa ili kuifanya sentensi isiyo na kitenzi katika Kiebrania iwe ya kawaida kwa Kiswahili bila kubadili rejeo lake la kihistoria.
- source_word: בִּימֵי
  choice: katika siku za
  rationale: Huhifadhi nahau ya Kiebrania inayoweka watu katika kipindi fulani cha kihistoria na inaeleweka katika Kiswahili cha kibiblia.
- source_word: יוֹיָקִים
  choice: Yoyakimu
  rationale: Jina limetoholewa kwa kufuata sauti za Kiebrania na kumtofautisha mhusika huyu wa kikuhani na mfalme Yehoyakimu.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: mwana wa Yeshua, mwana wa Yosadaki
  rationale: בֶּן hapa ina maana yake ya kawaida ya uhusiano wa mwana katika taarifa ya nasaba; hakuna sababu ya kuipanua kuwa “mzao wa.”
- source_word: וּבִימֵי
  choice: na katika siku za
  rationale: Kirai cha wakati kilichorudiwa katika Kiebrania kimehifadhiwa ili kuonyesha rejeo la pili la kipindi.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: Nehemia, mtawala
  rationale: פֶּחָה humaanisha mtawala wa jimbo chini ya utawala wa kifalme; “mtawala” ni neno wazi na la kawaida katika Kiswahili.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: na Ezra, kuhani na mwandishi
  rationale: Vyeo viwili vya Ezra vimehifadhiwa. Kiunganishi “na” ni cha kawaida zaidi katika Kiswahili, huku tanbihi ikieleza uwezekano wa kuvielewa kama vyeo viwili vilivyowekwa sambamba.
