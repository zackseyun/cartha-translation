  text: וּ/מִ/בֵּית֙ הַגִּלְגָּ֔ל וּ/מִ/שְּׂד֥וֹת גֶּ֖בַע וְ/עַזְמָ֑וֶת כִּ֣י חֲצֵרִ֗ים בָּנ֤וּ לָ/הֶם֙ הַ/מְשֹׁ֣רֲרִ֔ים סְבִיב֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: sw
  text: na kutoka Beth-gilgali, na kutoka mashamba ya Geba na Azmawethi, kwa maana waimbaji walikuwa wamejijengea vijiji[a] kuzunguka Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makazi”; neno la Kiebrania linaweza kumaanisha maeneo ya makazi yaliyozingirwa, na hapa linarejelea sehemu walizoishi waimbaji kuzunguka Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: na kutoka Beth-gilgali
  rationale: Muundo huu una kiunganishi na kihusishi ‘na kutoka’; Beth-gilgali limetumiwa kama jina la mahali, si ‘nyumba ya Gilgali.’
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: na kutoka mashamba ya Geba na Azmawethi
  rationale: שְּׂדוֹת ni wingi wa ‘shamba’ na hapa huelekeza kwenye maeneo ya mashambani yanayohusishwa na miji hiyo.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linaanzisha maelezo ya sababu ya waimbaji kupatikana katika maeneo hayo.
- source_word: חֲצֵרִים
  choice: vijiji
  rationale: Ingawa neno linaweza kumaanisha nyua au maeneo yaliyozingirwa, katika muktadha huu linamaanisha makazi madogo ambako waimbaji waliishi.
- source_word: בָּנוּ לָהֶם
  choice: walikuwa wamejijengea
  rationale: Kitenzi humaanisha ‘kujenga’; muundo huu unaonyesha tendo lililokuwa limekamilika na pia maana ya ‘kwa ajili yao wenyewe.’
- source_word: הַמְשֹׁרֲרִים
  choice: waimbaji
  rationale: Umbo hili kutoka mzizi wa ‘kuimba’ linawataja waimbaji, hasa katika muktadha wa ibada ya hekaluni.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: kuzunguka Yerusalemu
  rationale: Usemi huu unaonyesha maeneo yaliyokuwa kandokando ya jiji la Yerusalemu.
