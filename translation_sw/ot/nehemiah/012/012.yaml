  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: sw
  text: 'Katika siku za Yoyakimu, makuhani waliokuwa wakuu wa koo walikuwa hawa: wa ukoo wa Seraya alikuwa Meraya; wa ukoo wa Yeremia alikuwa Hanania.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Kirai hiki kinawataja viongozi wa vikundi vya kifamilia au koo, si ‘baba’ mmoja mmoja; tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: לִשְׂרָיָה ... לְיִרְמְיָה
  choice: kwa Seraya ... kwa Yeremia
  rationale: Herufi ya uhusiano לְ inaonyesha kila nyumba au ukoo wa kikuhani ambao kiongozi wake anatajwa; ‘kwa’ huhifadhi muundo mfupi wa orodha bila kuufafanua kupita kiasi.
- source_word: כֹהֲנִים
  choice: makuhani
  rationale: Ni neno la kawaida la Kiswahili kwa wahudumu wa kikuhani wa Israeli.
