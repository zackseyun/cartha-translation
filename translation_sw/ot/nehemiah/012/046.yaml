lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa mstari huu unatoa msingi au maelezo ya kauli iliyotangulia.
- source_word: בִימֵי דָוִיד וְאָסָף
  choice: katika siku za Daudi na Asafu
  rationale: Inahifadhi nahau ya wakati ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מִקֶּדֶם
  choice: hapo zamani
  rationale: Inaeleza wakati wa kale au wa zamani na inasomeka kwa urahisi katika Kiswahili cha sasa bila kulazimisha uhusiano wake wa kisarufi.
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: viongozi wa waimbaji
  rationale: Ingawa רֹאשׁ ni umbo la umoja, hapa linaeleweka kwa maana ya uongozi wa waimbaji; 'viongozi' ni ya asili zaidi kuliko tafsiri halisi 'kichwa'.
- source_word: וְשִׁיר תְּהִלָּה וְהֹדוֹת
  choice: na nyimbo za sifa na shukrani
  rationale: שִׁיר ni umoja kwa umbo lakini inaweza kutumiwa kwa maana ya jumla; wingi wa Kiswahili huwasilisha kwa kawaida nyimbo au uimbaji wa sifa na shukrani.
- source_word: לֵאלֹהִים
  choice: kwa Mungu
  rationale: Kihusishi kinaonyesha Mungu kuwa mlengwa wa sifa na shukrani; 'kwa Mungu' ni wazi na ya kawaida katika Kiswahili.
