  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: sw
  text: Nao Walawi walikuwa Yeshua, Binui, Kadmieli, Sherebia, Yuda na Matania; Matania pamoja na ndugu zake alikuwa msimamizi wa nyimbo za shukrani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wao pamoja na ndugu zao walikuwa wasimamizi wa nyimbo za shukrani.” Kiebrania kinaweza kueleweka kwa maana ya kijumla zaidi, ingawa kiwakilishi cha umoja kwa kawaida humrejelea Matania.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “nyimbo za shukrani” linaweza pia kumaanisha shukrani au sifa zilizotolewa katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Nao Walawi walikuwa
  rationale: Kiunganishi kinaendeleza orodha, na kitenzi ‘walikuwa’ kinaongezwa kwa mtindo wa kawaida wa Kiswahili katika kishazi cha Kiebrania kisicho na kitenzi.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: Yeshua, Binui, Kadmieli, Sherebia, Yuda na Matania
  rationale: Majina ya watu yametoholewa kwa tahajia inayoeleweka katika Kiswahili badala ya kutafsiriwa.
- source_word: עַל
  choice: alikuwa msimamizi wa
  rationale: Katika muktadha huu kihusishi kinaonyesha wajibu au usimamizi; usemi huu ni wa asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno.
- source_word: הֻיְּדוֹת
  choice: nyimbo za shukrani
  rationale: Wingi huu unahusu matendo au maneno ya kumshukuru Mungu katika ibada; katika muktadha wa huduma ya Walawi, ‘nyimbo za shukrani’ huonyesha kwa uwazi maana inayowezekana zaidi.
- source_word: הוּא וְאֶחָיו
  choice: Matania pamoja na ndugu zake
  rationale: Kiwakilishi cha umoja kinaelekea zaidi kumrejelea Matania, jina la mwisho katika orodha, huku ndugu zake wakishirikiana naye katika jukumu hilo.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi cha umoja הוּא baada ya orodha ya Walawi
  choice: Kumtaja Matania wazi kuwa yeye pamoja na ndugu zake alikuwa na jukumu hilo
  alternative: Kuelewa kauli hiyo kwa maana ya kijumla kuwa watu wote waliotajwa pamoja na ndugu zao ndio waliokuwa wasimamizi
  rationale: Sarufi ya Kiebrania ina kiwakilishi cha umoja, ambacho kwa kawaida humrejelea Matania, jina lililo karibu zaidi. Hata hivyo, uwezekano wa maana ya kijumla umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo umerudiwa kwa jina ‘Matania’ ili kuepuka mkanganyiko wa ‘ambaye’ baada ya orodha ndefu. Alama zote za tanbihi zimewekwa katika matini kuu.
