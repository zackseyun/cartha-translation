id: NEH.12.36
reference: Nehemiah 12:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְֽ/אֶחָ֡י/ו שְֽׁמַעְיָ֡ה וַ/עֲזַרְאֵ֡ל מִֽלֲלַ֡י גִּֽלֲלַ֡י מָעַ֞י נְתַנְאֵ֤ל וִֽ/יהוּדָה֙ חֲנָ֔נִי בִּ/כְלֵי שִׁ֥יר דָּוִ֖יד אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/עֶזְרָ֥א הַ/סּוֹפֵ֖ר לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: sw
  text: na ndugu zake—Shemaya, Azareli, Milalai, Gilalai, Maai, Nethaneli, Yuda na Hanani—wakiwa na vyombo vya muziki[a] vya Daudi, mtu wa Mungu, na Ezra mwandishi mbele yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, vyombo vya nyimbo.
    reason: Kirai בִּכְלֵי שִׁיר kinaweza kutafsiriwa kwa ukaribu zaidi na muundo wake kuwa ‘vyombo vya nyimbo,’ ingawa ‘vyombo vya muziki’ ni cha kawaida zaidi katika Kiswahili.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Neno אֶחָיו kwa maana yake ya msingi ni ‘ndugu zake’; katika orodha hii linaweza pia kumaanisha watu wa kundi lilelile, lakini tafsiri ya moja kwa moja inahifadhi usemi wa Kiebrania.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: Shemaya, Azareli, Milalai, Gilalai, Maai, Nethaneli, Yuda na Hanani
  rationale: Majina ya watu yametoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili, badala ya kutafsiriwa maana zake.
- source_word: בִּכְלֵי שִׁיר
  choice: wakiwa na vyombo vya muziki[a]
  rationale: Kirai hiki kihalisi ni ‘kwa/na vyombo vya wimbo’; ‘vyombo vya muziki’ ni Kiswahili cha kawaida kinachowasilisha maana yake katika muktadha wa maandamano.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: vya Daudi, mtu wa Mungu
  rationale: Muundo wa Kiebrania unavihusisha vyombo hivyo na Daudi na kisha unamtaja kwa heshima kuwa ‘mtu wa Mungu.’
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: Ezra mwandishi
  rationale: הַסּוֹפֵר humtambulisha Ezra kwa cheo au kazi yake; ‘mwandishi’ ni neno la kawaida la kibiblia na linalofaa hapa.
- source_word: לִפְנֵיהֶם
  choice: alikuwa mbele yao
  rationale: Kirai hiki kinaonyesha kwamba Ezra alikuwa mbele ya kundi katika maandamano; kitenzi ‘alikuwa’ kimeongezwa kwa ulaini wa Kiswahili bila kubadili maana.
theological_decisions:
- issue: Tafsiri ya cheo אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  alternative: mtumishi wa Mungu
  rationale: ‘Mtu wa Mungu’ huhifadhi kwa karibu cheo cha Kiebrania na mwangwi wake wa kibiblia; ‘mtumishi’ lingeongeza ufafanuzi ambao hauko wazi katika neno אִישׁ.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. Muundo umegawanywa katika sentensi mbili ili orodha ndefu isomeke kwa urahisi. Alama ya tanbihi imewekwa baada ya kirai inachokihusu.
