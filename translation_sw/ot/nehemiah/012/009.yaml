  yaml_path: translation/ot/nehemiah/012/009.yaml
  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: sw
  text: Bakbukia na Unno, pamoja na ndugu zao, walikuwa mkabala nao katika zamu za utumishi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: Naye Bakbukia
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili; kiunganishi וּ kimetafsiriwa kwa “Naye” ili kuendeleza orodha.
- source_word: ו/ענו
  choice: na Uno
  rationale: Limechukuliwa kuwa jina la mtu kwa kuzingatia muundo wa orodha ya Walawi katika muktadha. Hata hivyo, konsonanti zake zinaweza pia kueleweka kama kitenzi, hivyo usomaji huo umehifadhiwa katika tanbihi.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Huhifadhi maana ya msingi ya neno la Kiebrania na linafaa kwa uhusiano wa kifamilia au wa kundi la huduma unaodokezwa hapa.
- source_word: לְנֶגְדָּם
  choice: walikuwa mkabala nao
  rationale: Kirai kina maana ya kuwa upande wa pili, mbele ya, au sambamba nao. Kitenzi “walikuwa” kimeongezwa kwa Kiswahili cha asili bila kudai kitendo kisichotajwa wazi katika Kiebrania.
- source_word: לְמִשְׁמָרוֹת
  choice: katika zamu za utumishi
  rationale: מִשְׁמָרוֹת inaweza kumaanisha zamu, migawanyo, au majukumu yaliyopangwa. “Zamu za utumishi” huwasilisha kwa uwazi mpangilio wa huduma ya Hekalu.
theological_decisions:
- issue: Iwapo ו/ענו ni jina au kitenzi
  choice: Imetafsiriwa kama jina “Uno” katika andiko kuu.
  alternative: “na ndugu zao waliwajibu kwa zamu”
  rationale: Usomaji wa jina unafaa zaidi katika orodha hii ya majina, lakini maandishi ya konsonanti yanaruhusu uwezekano wa kulisoma kama kitenzi; utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Zamu za utumishi” limetumiwa badala ya istilahi finyu kama “lindo” ili kuonyesha mpangilio wa huduma ya Hekalu.
