  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wa Ezra ... wa Amaria.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kwa karibu zaidi, lakini katika orodha hii huenda kinaonyesha mwakilishi anayehusishwa na kila nyumba ya kikuhani.
    reason: lexical_alternative
  - marker: b
    text: Jina hili pia huandikwa “Yohanani” katika baadhi ya tafsiri; “Yehohanani” linaakisi kwa karibu zaidi umbo kamili la jina la Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶזְרָא
  choice: Kwa ukoo wa Ezra
  rationale: Katika orodha hii, kiambishi לְ kinaonyesha uhusiano au uwakilishi wa jamaa ya kikuhani. Kutaja “ukoo” kunafanya maana hiyo ieleweke kwa Kiswahili cha kawaida bila kubadili mpangilio mfupi wa orodha.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Ni jina la mtu; limenakiliwa kwa namna inayokaribia umbo la Kiebrania na kufuata tahajia ya kawaida ya Kiswahili.
- source_word: לַ/אֲמַרְיָה
  choice: kwa ukoo wa Amaria
  rationale: Kama katika kishazi kilichotangulia, לַ inaonyesha nyumba au ukoo wa kikuhani ambao Yehohanani aliuwakilisha.
- source_word: יְהוֹחָנָן
  choice: Yehohanani
  rationale: Tahajia hii inadumisha umbo kamili la jina la Kiebrania, hasa sehemu ya mwanzo יְהוֹ-, huku ikiwa rahisi kutamkwa kwa Kiswahili.
