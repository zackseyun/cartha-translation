  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: sw
  text: Nao walitimiza wajibu wao kwa Mungu wao na wajibu wa utakaso[a]; waimbaji na walinda malango pia walitimiza wajibu wao[b], kulingana na agizo la Daudi na Sulemani mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wajibu wa usafi wa kiibada” au “wajibu wa kusafisha.”
    reason: lexical_alternative
  - marker: b
    text: Kishazi cha Kiebrania kuhusu “waimbaji na walinda malango” hakina kitenzi wazi; huenda maana yake ni kwamba makundi hayo pia yalitimiza majukumu yaliyokabidhiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: wakatimiza wajibu waliokabidhiwa
  rationale: Muungano wa kitenzi שׁמר na nomino מִשְׁמֶרֶת hapa ni nahau ya kutekeleza jukumu rasmi. Kiswahili hiki ni cha asili na kinadumisha wazo la wajibu uliokabidhiwa.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Kiambishi cha umilikaji katika Kiebrania kimehifadhiwa wazi.
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: na wajibu wa utakaso
  rationale: הַטָּהֳרָה katika muktadha wa huduma ya hekalu huhusu utakaso au hali ya kuwa safi kiibada. 'Utakaso' huwasilisha tendo la kutakasa bila kulifanya kuwa fundisho maalumu la kimadhehebu.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: waimbaji na walinda malango pia walitimiza wajibu wao
  rationale: Kishazi cha Kiebrania hakina kitenzi wazi. Kukamilisha maana kwa 'pia walitimiza wajibu wao' huonyesha kwa kawaida kuwa makundi haya nayo yalitekeleza majukumu yao, huku tanbihi ikihifadhi ufupi na utata wa muundo wa asili.
- source_word: שֹׁעֲרִים
  choice: walinda malango
  rationale: Hili ni neno la kawaida na sahihi kwa maofisa waliokuwa na jukumu la kulinda malango ya hekalu.
- source_word: כְּמִצְוַת
  choice: kulingana na agizo
  rationale: מִצְוָה hapa ni elekezo lenye mamlaka kuhusu huduma ya hekalu; 'agizo' ni wazi na lenye hadhi katika Kiswahili cha kisasa.
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: Daudi na Sulemani mwanawe
  rationale: Mpangilio huu unafuata kwa karibu mfuatano wa Kiebrania na unaonyesha kuwa Sulemani alikuwa mwana wa Daudi.
theological_decisions:
- issue: Maana ya הַטָּהֳרָה katika muktadha wa huduma ya hekalu
  choice: utakaso
  alternative: usafi; kusafisha
  rationale: Muktadha unahusu majukumu ya Walawi na ibada, hivyo neno lina maana ya kiibada badala ya usafi wa kawaida au uadilifu wa jumla. Tanbihi inahifadhi uwezekano wa kulitafsiri kwa 'usafi wa kiibada'.
- issue: Uhusiano wa waimbaji na walinda malango na kitenzi cha sentensi
  choice: pia walitimiza wajibu wao
  alternative: na waimbaji na walinda malango
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kwa zaidi ya namna moja kisintaksia. Kukamilisha kitenzi hufanya Kiswahili kieleweke, bila kudai kwamba maandishi ya asili yalilitaja tena wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. 'Wajibu waliokabidhiwa' huepuka tafsiri ngumu ya neno kwa neno ya מִשְׁמֶרֶת, huku 'walinda malango' ikiwa wazi kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika maandishi.
