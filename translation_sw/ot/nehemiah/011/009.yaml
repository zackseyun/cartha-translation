base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: sw
  text: Naye Yoeli mwana wa Zikri alikuwa msimamizi wao, na Yuda mwana wa Hasenua alikuwa wa pili katika uongozi wa mji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa naibu wa mji,” au “alikuwa mtu wa pili kwa mamlaka katika mji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקִיד
  choice: msimamizi
  rationale: Neno hili humaanisha mtu aliyewekwa kusimamia au kuongoza shughuli fulani. “Msimamizi” ni Kiswahili cha kawaida kinachohifadhi maana ya kiutawala bila kudokeza cheo mahususi cha kijeshi au kifalme.
- source_word: עֲלֵיהֶם
  choice: wao
  rationale: Kirai hiki kinaonyesha mamlaka au usimamizi juu ya watu waliotajwa. Katika Kiswahili, “msimamizi wao” ni usemi wa asili unaowasilisha uhusiano huo kwa uwazi.
- source_word: מִשְׁנֶה
  choice: wa pili
  rationale: Neno hili humaanisha mtu wa daraja la pili au naibu. “Wa pili” huhifadhi ufupi na kutokubainika kikamilifu kwa cheo hicho katika Kiebrania.
- source_word: עַל הָעִיר
  choice: katika uongozi wa mji
  rationale: Kirai hiki kinaonyesha mamlaka au wajibu unaohusu mji. Tafsiri hii ni ya asili katika Kiswahili na, pamoja na “wa pili,” inaonyesha nafasi ya chini ya kiongozi mkuu bila kuainisha ofisi isiyotajwa.
- source_word: הַסְּנוּאָה
  choice: Hasenua
  rationale: Hili ni jina la mtu au ukoo, kwa hiyo limetoholewa badala ya kutafsiriwa; “Hasenua” linaakisi umbo la Kiebrania lenye kibainishi kilichounganishwa na jina.
- source_word: וְ
  choice: Naye … na
  rationale: Viunganishi vimehifadhiwa ili kuonyesha mwendelezo wa orodha na uhusiano kati ya watu wawili wanaotajwa.
theological_decisions: []
