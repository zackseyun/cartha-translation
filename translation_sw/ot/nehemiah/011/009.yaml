  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo “wa pili katika uongozi wa mji” umechaguliwa ili uwe wa asili huku ukihifadhi uwezekano wa kuelewa מִשְׁנֶה kama naibu au mtu wa pili kwa mamlaka.
