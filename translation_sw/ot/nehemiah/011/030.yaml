  text: זָנֹ֤חַ עֲדֻלָּם֙ וְ/חַצְרֵי/הֶ֔ם לָכִישׁ֙ וּ/שְׂדֹתֶ֔י/הָ עֲזֵקָ֖ה וּ/בְנֹתֶ֑י/הָ וַ/יַּחֲנ֥וּ מִ/בְּאֵֽר שֶׁ֖בַע עַד גֵּֽיא הִנֹּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: sw
  text: Zanoa, Adulamu na vijiji vyao; Lakishi na mashamba yake; Azeka na miji yake iliyoitegemea[a]. Nao wakapiga kambi[b] kuanzia Beer-sheba mpaka Bonde la Hinomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “binti zake”; yaani, vijiji au miji midogo iliyoitegemea Azeka.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi hiki kinaweza pia kueleweka katika muktadha huu kuwa “wakafanya makao” au “wakaishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: Zanoa
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: עֲדֻלָּם
  choice: Adulamu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa.
- source_word: חַצְרֵיהֶם
  choice: vijiji vyao
  rationale: Katika orodha za makazi, חָצֵר humaanisha vijiji au makazi madogo yaliyohusishwa na miji mikubwa; kiambishi cha wingi kinarejelea Zanoa na Adulamu.
- source_word: לָכִישׁ
  choice: Lakishi
  rationale: Jina la mahali limetoholewa kwa fonolojia ya Kiswahili.
- source_word: שְׂדֹתֶיהָ
  choice: mashamba yake
  rationale: Huhifadhi maana halisi ya maeneo ya kilimo yaliyouzunguka na kuuhusu mji.
- source_word: עֲזֵקָה
  choice: Azeka
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa.
- source_word: בְנֹתֶיהָ
  choice: miji yake iliyoitegemea
  rationale: Nahau ya Kiebrania, kihalisi ‘binti zake,’ humaanisha miji au vijiji vidogo vilivyo chini ya mji mkuu; tafsiri hii ni wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Huhifadhi maana ya msingi ya kitenzi חנה, ‘kupiga kambi,’ bila kukifasiri moja kwa moja kuwa makazi ya kudumu; uwezekano wa maana ya muktadha umewekwa katika tanbihi.
- source_word: מִבְּאֵר שֶׁבַע
  choice: kuanzia Beer-sheba
  rationale: Kiambishi מִן kinaonyesha mwanzo wa eneo linalotajwa; jina la mahali limetoholewa.
- source_word: עַד
  choice: mpaka
  rationale: Huonyesha kikomo cha eneo kwa Kiswahili cha kawaida.
- source_word: גֵּיא הִנֹּם
  choice: Bonde la Hinomu
  rationale: Tafsiri ya wazi ya muundo wa Kiebrania unaolitaja bonde hilo kwa jina.
