translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa urahisi. Alama za mkato nusu zinatenganisha vikundi vya majina na maeneo yanayovitegemea. Tafsiri inadumisha maana ya msingi ya kitenzi cha Kiebrania huku tanbihi ikihifadhi uwezekano wa maana ya kukaa au kufanya makao.
