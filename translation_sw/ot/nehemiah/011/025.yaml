language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: sw
  text: Kuhusu vijiji vilivyo katika mashamba yao, baadhi ya wana wa Yuda waliishi katika Kiriath-arba[a] na vijiji vyake, katika Diboni na vijiji vyake[b], na katika Yekabzeeli[c] na makazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiriath-arba ni jina la zamani la Hebroni; linganisha Yoshua 14:15.
    reason: cross_reference
  - marker: b
    text: Kiebrania, “binti zake,” nahau inayomaanisha vijiji vinavyoutegemea au vinavyouzunguka mji.
    reason: lexical_alternative
  - marker: c
    text: Katika baadhi ya mapokeo na vifungu vinavyohusiana, Yekabzeeli pia huitwa “Kabzeeli.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: Kuhusu vijiji vilivyokuwa mashambani mwao
  rationale: וְאֶל hapa inahamisha mada katika orodha, si kueleza mwendo kwa maana ya moja kwa moja. חֲצֵרִים katika muktadha huu ni vijiji vidogo vya mashambani, na שְׂדֹתָם ni mashamba au maeneo yao ya kilimo.
- source_word: מִבְּנֵי יְהוּדָה
  choice: baadhi ya wana wa Yuda
  rationale: מִן ina maana ya sehemu ya kundi, hivyo 'baadhi ya' imewekwa wazi; 'wana wa Yuda' inadumisha usemi wa kikabila wa Kiebrania.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Kitenzi kinaonyesha kukaa au kuishi mahali; 'waliishi' ni Kiswahili cha kawaida bila kudokeza lazima tendo la kuanzisha makazi.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: Kiriath-arba
  rationale: Jina la mahali limetoholewa kwa kuzingatia umbo la Kiebrania; utambulisho wake kama Hebroni umewekwa katika tanbihi.
- source_word: וּבְנֹתֶיהָ
  choice: na vijiji vyake
  rationale: Kihalisi ni 'binti zake,' lakini ni nahau ya mji kwa vijiji vinavyoutegemea au vinavyouzunguka. 'Vijiji vyake' ni ya kawaida na wazi kwa msomaji wa Kiswahili.
- source_word: וּבְדִיבוֹן
  choice: Diboni
  rationale: Jina la mahali limetoholewa kwa mtindo wa kawaida wa Kiswahili.
- source_word: וּבִיקַּבְצְאֵל
  choice: Yekabzeeli
  rationale: Umbo la konsonanti katika mstari huu linaunga mkono Yekabzeeli; umbo Kabzeeli katika mapokeo au vifungu vinavyohusiana limehifadhiwa katika tanbihi.
- source_word: וַחֲצֵרֶיהָ
  choice: na makazi yake
  rationale: Hapa חֲצֵרִים inaonyesha makazi madogo yanayohusiana na mji; 'makazi' pia hudumisha tofauti ya kimtindo na בְּנוֹתֶיהָ iliyotafsiriwa 'vijiji vyake.'
theological_decisions:
- issue: Usemi wa kikabila wenye jinsia katika מִבְּנֵי יְהוּדָה
  choice: baadhi ya wana wa Yuda
  alternative: baadhi ya watu wa Yuda
  rationale: Usemi wa Kiebrania umehifadhiwa kama jina la kikabila. Katika muktadha huu si lazima uwe dai kwamba wakazi wote waliotajwa walikuwa wanaume, lakini kuubadilisha kuwa 'watu' kungeficha umbo halisi la chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa, lakini sintaksia imefanywa ya kawaida kwa Kiswahili. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya matini.
