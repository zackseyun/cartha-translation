  text: Lodi na Ono, Bonde la Mafundi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Bonde la Mafundi Stadi”; neno la Kiebrania linaweza pia kumaanisha hasa mafundi kama vile wahunzi.
