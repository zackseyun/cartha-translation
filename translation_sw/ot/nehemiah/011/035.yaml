lexical_decisions:
- source_word: לֹד
  choice: Lodi
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְ/אוֹנוֹ
  choice: na Ono
  rationale: Kiunganishi וְ kimetafsiriwa moja kwa moja kuwa “na,” huku jina la mahali likitoholewa kuwa Ono.
- source_word: גֵּי
  choice: Bonde la
  rationale: Hili ni umbo la kutegemea la nomino “bonde”; “Bonde la” linaonyesha kwa Kiswahili uhusiano wake na nomino inayofuata.
- source_word: הַחֲרָשִׁים
  choice: Mafundi
  rationale: Neno hili linaweza kumaanisha mafundi kwa ujumla, wakiwemo mafundi stadi au wahunzi. “Mafundi” linahifadhi maana pana na linafaa katika jina la mahali.
