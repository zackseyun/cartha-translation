  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה בֶּן בּוּנִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: sw
  text: 'Na miongoni mwa Walawi: Shemaya mwana wa Hashubu[a], mwana wa Azrikamu, mwana wa Hashabia, mwana wa Buni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha za nasaba, neno la Kiebrania linalotafsiriwa “mwana wa” wakati mwingine linaweza kumaanisha mzao wa baadaye zaidi, si lazima mwana wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Na miongoni mwa
  rationale: Kiunganishi וּ kinaendeleza orodha iliyotangulia, na מִן hapa huonyesha mmoja kutoka katika kundi; “Na miongoni mwa” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Neno hili linawataja watu wa kabila la Lawi kama kundi linalotambulika; “Walawi” ndilo neno la kawaida katika Kiswahili cha Biblia.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina limetoholewa kwa namna inayofuata sauti za Kiebrania na tahajia inayosomeka kwa Waswahili.
- source_word: בֶן
  choice: mwana wa
  rationale: Katika nasaba, בֶן kwa kawaida hutafsiriwa “mwana wa,” ingawa wakati mwingine inaweza kumaanisha mzao wa baadaye zaidi; muundo wa Kiebrania umehifadhiwa.
- source_word: חַשּׁוּב
  choice: Hashubu
  rationale: Jina limetoholewa kutoka Kiebrania kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: עַזְרִיקָם
  choice: Azrikamu
  rationale: Jina limetoholewa kwa kufuata kwa karibu umbo la Kiebrania huku likiwa rahisi kutamkwa katika Kiswahili.
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Jina limetoholewa kutoka Kiebrania kwa umbo linaloeleweka na kutamkika kwa Kiswahili.
- source_word: בּוּנִּי
  choice: Buni
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania; konsonanti iliyokaziwa katika Kiebrania haihitaji kuandikwa mara mbili katika tahajia ya kawaida ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo mfupi wa orodha ya nasaba umehifadhiwa, na majina yametoholewa kwa kanuni za sauti na tahajia za Kiswahili.
