lexical_decisions:
- source_word: כָּל
  choice: wote
  rationale: Kihesabishi hiki kinajumuisha kundi zima na kutambulisha jumla yao; “wote” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kibiblia kwa watu wa kabila na huduma ya Lawi.
- source_word: בְּעִיר הַקֹּדֶשׁ
  choice: katika mji mtakatifu
  rationale: בְּ inaonyesha mahali, nayo miundo ya nomino עִיר הַקֹּדֶשׁ inaelezwa kwa Kiswahili cha kawaida kuwa “mji mtakatifu,” huku maana ya kidini ya קֹדֶשׁ ikihifadhiwa.
- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: mia mbili themanini na wanne
  rationale: Maneno ya Kiebrania yanatoa jumla ya 284; kuandika idadi kwa maneno kunafaa mtindo wa maandiko, na “wanne” inapatanishwa na watu wanaohesabiwa.
