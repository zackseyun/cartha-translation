lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Na baada yake
  rationale: Kirai hiki kwa kawaida humaanisha “na baada yake.” Katika orodha hii kinaonyesha mfuatano wa watu au makundi yaliyotajwa, bila kuongeza kitenzi kisichokuwapo wazi katika Kiebrania.
- source_word: גַּבַּי
  choice: Gabai
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: סַלָּי
  choice: Salai
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: watu mia tisa ishirini na wanane
  rationale: Namba ya Kiebrania ni 928. Neno “watu” limeongezwa kwa uwazi wa kawaida wa Kiswahili kwa kuwa muktadha unahesabu wakazi, ingawa halijatajwa moja kwa moja katika mstari huu.
