  text: וַ/יֵּשְׁב֥וּ שָׂרֵֽי הָ/עָ֖ם בִּ/ירוּשָׁלִָ֑ם וּ/שְׁאָ֣ר הָ֠/עָם הִפִּ֨ילוּ גוֹרָל֜וֹת לְ/הָבִ֣יא אֶחָ֣ד מִן הָ/עֲשָׂרָ֗ה לָ/שֶׁ֨בֶת֙ בִּֽ/ירוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ וְ/תֵ֥שַׁע הַ/יָּד֖וֹת בֶּ/עָרִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: sw
  text: Viongozi wa watu waliishi Yerusalemu, nao watu wengine walipiga kura ili kumleta mtu mmoja kati ya kila watu kumi kuishi Yerusalemu, mji mtakatifu, huku sehemu tisa[a] zikibaki katika miji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja kutoka Kiebrania, “na mikono tisa katika miji.” Hii ni nahau inayomaanisha kwamba sehemu tisa zilizobaki kati ya kumi zilibaki katika miji.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: Viongozi wa watu
  rationale: שָׂרִים humaanisha watawala, wakuu, au maofisa. “Viongozi” ni neno la kawaida, lenye heshima, na linafaa katika muktadha huu wa usimamizi bila kudokeza kwamba walikuwa wana wa kifalme.
- source_word: וַיֵּשְׁבוּ
  choice: waliishi
  rationale: Kitenzi ישׁב hapa kinaeleza kukaa mahali kama wakazi, si tendo la kuketi.
- source_word: וּשְׁאָר הָעָם
  choice: nao watu wengine
  rationale: שְׁאָר ni sehemu iliyobaki. Usemi huu wa Kiswahili ni wa kawaida na unaonyesha watu waliobaki baada ya viongozi waliotajwa.
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: walipiga kura
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa kuchagua kwa kura, unaolingana na nahau ya Kiebrania ya kuangusha kura.
- source_word: לְהָבִיא
  choice: ili kumleta
  rationale: Hifili ya בוא ina maana ya kusababisha mtu aje; “kumleta” inadumisha maana hiyo ya kisababishi.
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: mtu mmoja kati ya kila watu kumi
  rationale: Tafsiri hii inaeleza kwa kawaida uwiano wa mmoja kwa kumi unaokusudiwa na kifungu cha Kiebrania.
- source_word: לָשֶׁבֶת
  choice: kuishi
  rationale: ישׁב hapa inamaanisha kufanya makao au kuishi mahali, si kuketi.
- source_word: עִיר הַקֹּדֶשׁ
  choice: mji mtakatifu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: huku sehemu tisa zikibaki
  rationale: Kiebrania kwa neno moja moja ni “na mikono tisa,” lakini “mikono” hapa ni nahau ya sehemu au mafungu. “Sehemu tisa” huhifadhi taswira ya mgawanyo bila kutumia usemi usioeleweka kwa msomaji wa kisasa.
- source_word: בֶּעָרִים
  choice: katika miji mingine
  rationale: עָרִים inaweza kumaanisha miji mikubwa au midogo. “Miji mingine” inaonyesha tofauti kati ya Yerusalemu na makao mengine ya Yuda bila kulazimisha ukubwa wake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku nahau isiyo ya kawaida ya Kiebrania ikihifadhiwa katika tanbihi. Kiunganishi וַ־ hakijatafsiriwa kwa kuongeza neno la wakati kama “basi” au “sasa,” kwa kuwa chanzo hakina neno la wazi lenye maana hiyo.
