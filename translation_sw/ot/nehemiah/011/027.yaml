lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: na katika Hasar-Shuali
  rationale: Viambishi vya Kiebrania וּבַ־ vimetafsiriwa kwa maana ya “na katika,” nayo חֲצַר שׁוּעָל imenukuliwa kama jina la mahali badala ya kutafsiriwa kietimolojia kuwa “Kijiji cha Mbweha.”
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: na katika Beer-Sheba
  rationale: Jina hili la mahali limenukuliwa kwa umbo linalotambulika katika Kiswahili; maana zake zinazowezekana kietimolojia, “Kisima cha Saba” au “Kisima cha Kiapo,” hazijaingizwa katika matini.
- source_word: וּ/בְנֹתֶיהָ
  choice: na vijiji vyake
  rationale: Ingawa בְּנוֹתֶיהָ humaanisha kihalisi “na binti zake,” hapa ni nahau ya kijiografia inayorejelea vijiji au makazi yaliyo chini ya mji mkuu. Kiambishi cha nafsi ya tatu kike umoja kinarejelea Beer-Sheba.
