  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: sw
  text: 'Na hawa ndio wana wa Benyamini: Salu mwana wa Meshulamu, mwana wa Yoedi[a], mwana wa Pedaya, mwana wa Kolaya, mwana wa Maaseya, mwana wa Ithieli, mwana wa Yeshaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa Andiko la Kimasora lina jina “Yoedi.” Nasaba inayofanana katika 1 Mambo ya Nyakati 9:7 ina jina “Hodavia.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na hawa ndio
  rationale: Kauli hii inaendeleza orodha na kuitambulisha sehemu inayofuata kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Inahifadhi muundo wa Kiebrania na msisitizo wa ukoo; katika muktadha huu inaweza pia kumaanisha wazao au watu wa kabila la Benyamini.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida na wazi katika mfuatano wa nasaba, ingawa neno la Kiebrania wakati mwingine linaweza kumaanisha mzao.
- source_word: סַלֻּא
  choice: Salu
  rationale: Unukuzi wa jina unaolingana na matamshi ya Kiebrania na desturi ya Kiswahili.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Unukuzi wa jina la Kiebrania unaofaa kwa mfumo wa sauti wa Kiswahili.
- source_word: יוֹעֵד
  choice: Yoedi
  rationale: Inafuata jina lililo katika Andiko la Kimasora hapa, bila kulinganisha kimyakimya na nasaba sambamba.
- source_word: פְּדָיָה
  choice: Pedaya
  rationale: Unukuzi wa kawaida wa Kiswahili unaoakisi umbo la Kiebrania.
- source_word: קוֹלָיָה
  choice: Kolaya
  rationale: Unukuzi unaohifadhi kwa uwazi silabi za jina la Kiebrania.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Unukuzi wa Kiswahili unaokaribia irabu za jina la Kiebrania.
- source_word: אִיתִיאֵל
  choice: Ithieli
  rationale: Unukuzi unaohifadhi vipengele vikuu vya jina la Kiebrania kwa matamshi ya Kiswahili.
- source_word: יְשַׁעְיָה
  choice: Yeshaya
  rationale: Unukuzi wa karibu wa jina la Kiebrania; unahifadhi jina hilo bila kulazimisha umbo jingine la kimapokeo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wazi, na wa kinasaba. Muundo unaorudiwa wa “mwana wa” umehifadhiwa ili kuonyesha mfuatano wa ukoo. Maelezo kuhusu maana pana ya “wana wa Benyamini” yamewakilishwa katika uamuzi wa kileksika, si tanbihi, kwa kuwa alama ya tanbihi katika matini imewekwa tu pale tofauti halisi ya usomaji inahitaji kuonyeshwa.
