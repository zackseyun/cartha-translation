base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: sw
  text: Nao Shabetai na Yozabadi, waliokuwa miongoni mwa viongozi wa Walawi, walisimamia kazi ya nje[a] ya nyumba ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kazi ya nje kwa ajili ya nyumba ya Mungu.” Kirai cha Kiebrania kinaweza kumaanisha kazi iliyofanywa nje ya jengo lenyewe la hekalu, tofauti na majukumu ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: Nao Shabethai na Yozabadi
  rationale: Majina yametoholewa kwa namna inayosomeka kwa Kiswahili, na kiunganishi cha mwanzo kimehifadhiwa ili kuendeleza muundo wa orodha.
- source_word: עַל
  choice: walisimamia
  rationale: Katika muktadha wa kiutawala, neno hili huonyesha kuwa na wajibu wa kuongoza au kusimamia kazi fulani.
- source_word: הַמְּלָאכָה הַחִיצֹנָה
  choice: kazi za nje
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi maana pana ya kazi iliyofanywa nje, bila kuibainisha kupita ushahidi wa Kiebrania.
- source_word: לְבֵית הָאֱלֹהִים
  choice: za nyumba ya Mungu
  rationale: Kirai hiki kinaunganisha kazi hizo na nyumba ya Mungu; 'za' huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: waliokuwa miongoni mwa viongozi wa Walawi
  rationale: Huhifadhi maana ya מן, kwamba watu hawa walitoka au walikuwa miongoni mwa wakuu wa Walawi, huku 'viongozi' ikiwa ya asili zaidi kuliko tafsiri ya moja kwa moja 'vichwa'.
