translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili huku uhusiano wa kiutawala na utata wa mahali au aina ya kazi ukihifadhiwa.
