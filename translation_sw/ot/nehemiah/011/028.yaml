lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַג
  choice: na katika Siklagi
  rationale: Kiunganishi וּ na kihusishi בְ vinaonyeshwa kwa “na katika.” Jina la mahali צִקְלַג limetoholewa kwa umbo la Kiswahili “Siklagi,” linalosomeka kwa kawaida.
- source_word: וּ/בִ/מְכֹנָה
  choice: na katika Mekona
  rationale: Kiunganishi na kihusishi vinatafsiriwa “na katika”; מְכֹנָה ni jina la mahali na limetoholewa kuwa “Mekona.”
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: pamoja na vijiji vyake vya kandokando
  rationale: Neno בְּנוֹתֶיהָ, kihalisi “binti zake,” ni nahau ya Kiebrania kwa makazi madogo yaliyotegemea mji mkuu. “Vijiji vyake vya kandokando” huwasilisha maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi sitiari ya asili.
