  text: וַ/אֲחֵי/הֶם֙ גִּבּ֣וֹרֵי חַ֔יִל מֵאָ֖ה עֶשְׂרִ֣ים וּ/שְׁמֹנָ֑ה וּ/פָקִ֣יד עֲלֵי/הֶ֔ם זַבְדִּיאֵ֖ל בֶּן הַ/גְּדוֹלִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: sw
  text: Nao ndugu zao, mashujaa hodari, walikuwa mia moja ishirini na wanane; naye msimamizi wao alikuwa Zabdieli mwana wa Hagedolimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wa watu wakuu” au “mwana wa wakuu.” Kiebrania kinaweza kuwa kirai cha maelezo badala ya jina maalumu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Nao ndugu zao
  rationale: Neno אֲחֵיהֶם kihalisi ni ‘ndugu zao’; katika orodha hii linawaonyesha wanaume wengine wa kundi hilo bila kufafanua zaidi uhusiano wao.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Kirai hiki huonyesha wanaume wenye nguvu, ujasiri, au uwezo wa kivita. ‘Mashujaa hodari’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kulifanya cheo maalumu cha kijeshi.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: mia moja ishirini na wanane
  rationale: Hii ndiyo idadi 128, iliyotolewa kwa mtindo wa kawaida wa Kiswahili.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: naye msimamizi wao alikuwa
  rationale: פָקִיד ni mtu aliyewekwa juu ya wengine kwa jukumu la usimamizi au uongozi; ‘msimamizi’ huepuka kudai kwamba lazima lilikuwa cheo cha kijeshi.
- source_word: זַבְדִּיאֵל
  choice: Zabdieli
  rationale: Jina la mtu limetoholewa kwa mfumo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: בֶּן הַגְּדוֹלִים
  choice: mwana wa Hagedolimu
  rationale: הַגְּדוֹלִים huenda ni jina la ukoo au jina maalumu, kwa hiyo limetoholewa katika matini kuu; uwezekano wa kuwa maelezo badala ya jina umehifadhiwa katika tanbihi.
