base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/013.yaml
  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: sw
  text: na ndugu zake, viongozi wa jamaa za ukoo,[a] watu 242; na Amashsai mwana wa Azareli, mwana wa Ahzai, mwana wa Meshilemothi,[b] mwana wa Imeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wa koo za mababu” au “viongozi wa familia.” Kiebrania kinarejelea viongozi wa jamaa zilizopangwa kwa nasaba za mababu.
    reason: lexical_alternative
  - marker: b
    text: Jina “Meshilemothi” pia linaweza kunukuliwa “Meshilemithi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Neno אָח katika wingi hapa linaweza kumaanisha ndugu wa kiume au watu wa ukoo/kundi moja. “Ndugu zake” ni tafsiri ya moja kwa moja na ya kawaida, huku muktadha wa orodha ukionyesha kundi la ukoo au kikuhani.
- source_word: רָאשִׁים לְאָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Kirai hiki kinawataja wakuu wa vitengo vya kijamii vinavyotokana na mababu. “Jamaa za ukoo” ni Kiswahili cha asili kinachoeleweka kuliko tafsiri sisisi ya “nyumba za baba,” bila kupoteza wazo la nasaba.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: watu 242
  rationale: Idadi ya Kiebrania ni mia mbili arobaini na mbili. Neno “watu” linawekwa wazi kwa mtiririko wa kawaida wa Kiswahili katika orodha ya sensa.
- source_word: וַעֲמַשְׁסַי
  choice: na Amashsai
  rationale: Jina limenukuliwa kwa kufuata umbo maalumu la Kimasoreti katika aya hii, bila kulisawazisha na Amasai.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika mlolongo huu wa nasaba, בֶּן kwa kawaida humaanisha “mwana wa”; hakuna sababu ya kuupanua kimyakimya kuwa “mzao wa.”
- source_word: עֲזַרְאֵל
  choice: Azareli
  rationale: Unukuzi wa jina la Kiebrania uliorekebishwa kulingana na matamshi na tahajia ya kawaida ya Kiswahili.
- source_word: אַחְזַי
  choice: Ahzai
  rationale: Unukuzi wa karibu wa umbo la Kiebrania, huku mkusanyiko wa konsonanti ukihifadhiwa kwa sababu ni jina maalumu.
- source_word: מְשִׁלֵּמוֹת
  choice: Meshilemothi
  rationale: Unukuzi unaofuata vokali za Kimasoreti na kuongeza vokali ya mwisho inayorahisisha matamshi ya Kiswahili bila kubadili utambulisho wa jina.
- source_word: אִמֵּר
  choice: Imeri
  rationale: Unukuzi wa jina la Kiebrania kwa muundo unaotamkika kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Lugha ni ya kawaida, yenye heshima, na inafaa orodha ya nasaba na sensa. “Jamaa za ukoo” huepuka Kiswahili kisicho cha asili cha “nyumba za baba” huku kikihifadhi muundo wa kijamii wa Kiebrania. Nambari imeandikwa kwa tarakimu kwa usomaji rahisi.
