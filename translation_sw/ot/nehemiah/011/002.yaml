base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/002.yaml
  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: sw
  text: Nao watu wakawabariki wanaume wote waliojitolea kwa hiari kuishi Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliojitolea kuishi Yerusalemu.”
    reason: Tofauti hii fupi inaonyesha kuwa הַמִּתְנַדְּבִים inaweza kutafsiriwa moja kwa moja kwa ‘waliojitolea,’ huku wazo la hiari likiwa tayari ndani ya kitenzi.
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: wakawabariki
  rationale: Kitenzi ברך katika piel kwa kawaida humaanisha ‘kubariki.’ Hapa watu ndio wanaobarikiwa; tafsiri hii inadumisha maana ya msingi na wazo la kutamka baraka au kuonyesha kukubali kwao.
- source_word: הָעָם
  choice: watu
  rationale: עם ni neno la kawaida la kutaja jamii kwa ujumla; ‘watu’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: לְכֹל הָאֲנָשִׁים
  choice: wanaume wote
  rationale: אֲנָשִׁים hapa ni nomino ya kiume inayomaanisha ‘wanaume’; tafsiri hii inadumisha rejeleo la kijinsia la Kiebrania badala ya kulifanya la jumla.
- source_word: הַמִּתְנַדְּבִים
  choice: waliojitolea kwa hiari
  rationale: Hitpael ya נדב huonyesha kujitoa kwa hiari. ‘Waliojitolea kwa hiari’ inadumisha maana ya kujitoa wenyewe na hiari yao kwa lugha ya sasa iliyo wazi.
- source_word: לָשֶׁבֶת
  choice: kuishi
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kufanya makao. Katika muktadha wa kwenda kufanya makao Yerusalemu, ‘kuishi’ ni ya asili na sahihi.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali; kihusishi cha Kiebrania kinawakilishwa kiasili bila kuongeza ‘katika’ baada ya kitenzi ‘kuishi.’
theological_decisions:
- issue: Uwasilishaji wa kijinsia wa הָאֲנָשִׁים
  choice: wanaume wote
  alternative: watu wote / kila mtu
  rationale: Kiebrania kimetumia nomino ya kiume אֲנָשִׁים badala ya nomino ya jumla. ‘Wanaume wote’ inadumisha rejeleo hilo bila kulipanua kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nao’ linaendeleza mtiririko wa simulizi, na ‘wakawabariki’ linahifadhi mfuatano wa kitenzi cha Kiebrania. Alama ya tanbihi [a] imewekwa katika matini kuu.
