  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: sw
  text: 'Hawa ndio wakuu wa mkoa walioishi Yerusalemu. Lakini katika miji ya Yuda, kila mtu aliishi katika ardhi yake mwenyewe, katika miji yao: Israeli[a], makuhani, Walawi, watumishi wa hekalu[b], na wazao wa watumishi wa Sulemani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema tu “Israeli,” huenda likiwa jina la pamoja kwa kundi hili katika orodha.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania ni “Wanethini,” jina la kundi lililowekwa kufanya huduma ya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: wakuu wa mkoa
  rationale: רָאשֵׁי ni nahau inayomaanisha viongozi au wakuu, na הַמְּדִינָה katika mazingira ya utawala wa Uajemi ni mkoa wa kiutawala, si taifa la kisasa.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: walioishi Yerusalemu
  rationale: יָשַׁב hapa inaeleza makao ya kudumu; “walioishi” ni Kiswahili cha kawaida na cha sasa.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: Lakini katika miji ya Yuda ... aliishi
  rationale: Kiunganishi וּ kinaonyesha uhamisho wenye utofautishaji kutoka Yerusalemu kwenda miji mingine ya Yuda; “Lakini” huonyesha tofauti hiyo kwa uwazi.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Umoja huu umetumiwa kwa maana ya mgawanyo, yaani kila mmoja binafsi; “kila mtu” ni ya asili zaidi katika Kiswahili bila kupoteza maana.
- source_word: בַּאֲחֻזָּתוֹ
  choice: katika milki yake
  rationale: אֲחֻזָּה ni mali au eneo linalomilikiwa, mara nyingi ardhi ya ukoo. “Milki yake” inadumisha wazo la umiliki bila kulibana kuwa urithi pekee.
- source_word: בְּעָרֵיהֶם
  choice: katika miji yao
  rationale: Tafsiri hii inadumisha kirai cha pili cha mahali kilicho katika Kiebrania, hata kama kinarudia wazo lililotangulia.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Nomino iliyo wazi katika Kiebrania imedumishwa kama jina la pamoja, badala ya kuifasiri moja kwa moja kuwa “Waisraeli”; tanbihi inaonyesha uwezekano huo.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi la makuhani.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa wazao wa Lawi wenye huduma maalumu.
- source_word: הַנְּתִינִים
  choice: watumishi wa hekalu
  rationale: נְתִינִים ni kundi maalumu lililowekwa kwa huduma ya hekalu. Kutafsiri jukumu lao kunaeleweka zaidi kuliko kunukuu jina la Kiebrania.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: wazao wa watumishi wa Sulemani
  rationale: בְּנֵי katika orodha ya kijamii au ya ukoo inaweza kumaanisha wazao kwa upana, si wana wa moja kwa moja tu.
theological_decisions:
- issue: Maana ya יִשְׂרָאֵל katika orodha
  choice: Israeli
  alternative: Waisraeli
  rationale: Kiebrania kina jina “Israeli” bila nomino ya wazi ya watu. Kulidumisha huhifadhi umbile na uwezekano wa maana ya pamoja, huku tanbihi ikitoa tafsiri ya “Waisraeli” bila kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “katika miji” yamedumishwa kwa sababu yapo katika muundo wa Kiebrania. “Milki” ni rasmi kiasi, lakini hapa inafaa kwa maana ya eneo au mali inayomilikiwa.
