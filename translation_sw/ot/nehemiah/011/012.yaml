base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: sw
  text: Nao ndugu zao[a], waliofanya kazi kwa ajili ya nyumba, walikuwa mia nane na ishirini na wawili; na Adaya mwana wa Yerohamu, mwana wa Pelalia, mwana wa Amzi, mwana wa Zekaria, mwana wa Pashuri, mwana wa Malkia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafanyakazi wa hekalu.” Kiebrania kinasema kwa maana halisi, “waliofanya kazi kwa ajili ya nyumba”; katika muktadha huu “nyumba” ni hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Nao ndugu zao
  rationale: Neno la Kiebrania kwa maana halisi ni ‘ndugu zao.’ Katika muktadha huu linaweza kumaanisha washirika wa kundi lilelile la kikuhani, lakini tafsiri inadumisha istilahi ya undugu bila kuongeza ‘makuhani’ ambayo haijasemwa wazi katika mstari huu.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: waliofanya kazi
  rationale: Muundo wa kivumishi-tendaji unaelezwa kwa Kiswahili cha kawaida na wazi, huku maana ya kuwa watendaji wa kazi ikidumishwa.
- source_word: לַבַּיִת
  choice: kwa ajili ya nyumba
  rationale: בַּיִת ni ‘nyumba’ kwa maana halisi; hapa muktadha unaelekeza kwenye hekalu. ‘Kwa ajili ya nyumba’ inadumisha usemi wa chanzo, huku tanbihi ikifafanua rejeo la hekalu.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: mia nane ishirini na wawili
  rationale: Hii ni namna ya kawaida na inayoeleweka ya kuandika idadi 822 kwa Kiswahili.
- source_word: וַעֲדָיָה
  choice: na Adaya
  rationale: Kiunganishi kinaendeleza orodha, na jina limetoholewa kwa umbo linalofaa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Fomula ya nasaba imedumishwa kwa tafsiri ya kawaida ‘mwana wa’; haijapanuliwa kuwa ‘mzao wa’ bila ulazima wa kimuktadha.
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: Yerohamu / Pelalia / Amzi / Zekaria / Pashuri / Malkia
  rationale: Majina yametoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili sanifu cha Afrika Mashariki.
