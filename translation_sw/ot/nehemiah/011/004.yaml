base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: sw
  text: Na katika Yerusalemu waliishi baadhi ya wazao wa Yuda na baadhi ya wazao wa Benyamini.[a] Miongoni mwa wazao wa Yuda alikuwa Ataya, mwana wa Uzia, mwana wa Zekaria, mwana wa Amaria, mwana wa Shefatia, mwana wa Mahalaleli, wa wazao wa Peresi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wazao wa Yuda” na “wazao wa Benyamini” hapa humaanisha watu wa makundi hayo ya kikabila.
    reason: cultural_note
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: Na Yerusalemu
  rationale: Kiunganishi וּ pamoja na kihusishi בִּ kinaendeleza orodha ya simulizi; “Na Yerusalemu” ni ya asili na inahifadhi mwendelezo huo.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Kitenzi ישׁב hapa kina maana ya kukaa au kuishi mahali; “waliishi” ni Kiswahili cha sasa na cha kawaida katika muktadha wa wakazi.
- source_word: מִבְּנֵי יְהוּדָה / וּמִבְּנֵי בִנְיָמִן
  choice: baadhi ya wazao wa Yuda / baadhi ya wazao wa Benyamini
  rationale: מִן inaonyesha sehemu ya kundi, huku בְּנֵי katika muktadha huu ikimaanisha wanaukoo au wazao, si lazima wana wa moja kwa moja.
- source_word: עֲתָיָה
  choice: Ataya
  rationale: Unukuzi wa jina la Kiebrania kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huhifadhi muundo wa nasaba ulio wazi katika Kiebrania, bila kuamua kama kila kiungo ni kizazi cha moja kwa moja.
- source_word: עֻזִּיָּה / זְכַרְיָה / אֲמַרְיָה / שְׁפַטְיָה / מַהֲלַלְאֵל / פָּרֶץ
  choice: Uzia / Zekaria / Amaria / Shefatia / Mahalaleli / Peresi
  rationale: Majina yamenukuliwa kwa maumbo ya kibiblia yanayotambulika na yanayolingana na matamshi na tahajia ya Kiswahili.
