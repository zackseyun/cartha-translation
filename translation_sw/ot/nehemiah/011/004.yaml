  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha ya nasaba umehifadhiwa; “wazao” limetumiwa badala ya “wana” katika majina ya makundi ya kikabila ili kuzuia maana potovu ya wana wa moja kwa moja, lakini “mwana wa” limehifadhiwa katika mnyororo wa nasaba.
