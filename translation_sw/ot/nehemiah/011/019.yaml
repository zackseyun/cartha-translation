  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: sw
  text: 'Nao walinzi wa malango: Akubu, Talmoni, na ndugu zao[a], waliokuwa wakilinda malangoni; jumla yao ilikuwa mia moja sabini na wawili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamaa zao”; neno la Kiebrania linalomaanisha “ndugu zao” linaweza pia kutaja jamaa wa karibu wa kiume au washiriki wenzao wa kundi moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: walinzi wa malango
  rationale: Neno hili linataja watu waliowekwa rasmi kuhudumia na kulinda malango; tafsiri hii ni ya kawaida na inaonyesha wajibu wao wazi.
- source_word: עַקּוּב
  choice: Akubu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: טַלְמוֹן
  choice: Talmoni
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וַאֲחֵיהֶם
  choice: na ndugu zao[a]
  rationale: “Ndugu zao” huhifadhi maana ya msingi ya neno la Kiebrania, huku tanbihi ikionyesha kuwa katika orodha ya kikundi linaweza kumaanisha jamaa zao wa kiume au washiriki wenzao.
- source_word: הַשֹּׁמְרִים
  choice: waliokuwa wakilinda
  rationale: Kauli hii huonyesha jukumu lao la kuendelea kukesha na kulinda, kama inavyodokezwa na umbo la kitenzi cha Kiebrania.
- source_word: בַּשְּׁעָרִים
  choice: malangoni
  rationale: Usemi wa mahali unaonyesha kwamba walitekeleza wajibu wao kwenye malango.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: mia moja sabini na wawili
  rationale: Hii ni hesabu ya jumla ya watu; “wawili” inafuata upatanisho wa kisarufi unaofaa watu katika Kiswahili.
