  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/פְקִ֤יד הַ/לְוִיִּם֙ בִּ/יר֣וּשָׁלִַ֔ם עֻזִּ֤י בֶן בָּנִי֙ בֶּן חֲשַׁבְיָ֔ה בֶּן מַתַּנְיָ֖ה בֶּן מִיכָ֑א מִ/בְּנֵ֤י אָסָף֙ הַ/מְשֹׁ֣רְרִ֔ים לְ/נֶ֖גֶד מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: sw
  text: Na msimamizi wa Walawi huko Yerusalemu alikuwa Uzi mwana wa Bani, mwana wa Hashabia, mwana wa Matania, mwana wa Mika. Alikuwa miongoni mwa wana wa Asafu, waimbaji, naye alisimamia kazi ya nyumba ya Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa na jukumu kuhusu kazi ya nyumba ya Mungu.” Kirai cha Kiebrania chenye לְנֶגֶד kinaweza kuonyesha usimamizi au wajibu kuhusiana na kazi ya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: msimamizi wa Walawi
  rationale: Neno פְקִיד humaanisha mtu aliyewekwa katika nafasi ya usimamizi au utawala; ‘msimamizi’ linaeleza wajibu huo kwa Kiswahili cha kawaida bila kuongeza maana ya kijeshi.
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Kihusishi בְּ kinaonyesha mahali. ‘Huko Yerusalemu’ ni usemi wa asili unaohusisha nafasi hii na mahali hapo.
- source_word: עֻזִּי בֶן־בָּנִי בֶן־חֲשַׁבְיָה בֶּן־מַתַּנְיָה בֶן־מִיכָא
  choice: Uzi mwana wa Bani, mwana wa Hashabia, mwana wa Matania, mwana wa Mika
  rationale: Majina yametoholewa kwa namna inayofaa Kiswahili, na kurudiwa kwa בֶן kumehifadhiwa ili ukoo uonekane wazi.
- source_word: מִבְּנֵי אָסָף
  choice: miongoni mwa wana wa Asafu
  rationale: Huhifadhi picha ya Kiebrania ya ‘wana wa Asafu’ huku ‘miongoni mwa’ ikionyesha kuwa Uzi alitoka katika kundi hilo la ukoo na huduma.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Umbo hili linawatambulisha wana wa Asafu kwa kazi yao ya kuimba; ‘waimbaji’ ni sahihi zaidi kuliko neno pana kama ‘wanamuziki’.
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: alisimamia kazi
  rationale: Katika muktadha huu wa kiutawala, לְנֶגֶד huelekea kuonyesha usimamizi au wajibu kuhusiana na kazi. Kitenzi ‘alisimamia’ kinaeleza uhusiano huo kwa Kiswahili cha asili.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hili ndilo fumbo la moja kwa moja la Kiebrania, na linaeleweka kwa Kiswahili huku likihifadhi namna chanzo kinavyolitaja hekalu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye heshima na unaosomeka kwa urahisi. Sentensi ndefu ya Kiebrania imegawanywa mara mbili ili ukoo na wajibu wa Uzi vieleweke bila kupoteza taarifa za chanzo.
