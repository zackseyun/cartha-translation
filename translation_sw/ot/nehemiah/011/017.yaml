source:
  edition: WLC
  text: וּ/מַתַּנְיָ֣ה בֶן מִ֠יכָה בֶּן זַבְדִּ֨י בֶן אָסָ֜ף רֹ֗אשׁ הַ/תְּחִלָּה֙ יְהוֹדֶ֣ה לַ/תְּפִלָּ֔ה וּ/בַקְבֻּקְיָ֖ה מִשְׁנֶ֣ה מֵ/אֶחָ֑י/ו וְ/עַבְדָּא֙ בֶּן שַׁמּ֔וּעַ בֶּן גָּלָ֖ל בֶּן ידיתון־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: sw
  text: Naye Matania mwana wa Mika, mwana wa Zabdi, mwana wa Asafu, alikuwa kiongozi aliyeanzisha shukrani katika sala; Bakbukia alikuwa wa pili miongoni mwa ndugu zake; naye Abda alikuwa mwana wa Shamua, mwana wa Galali, mwana wa Yeduthuni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹאשׁ
  choice: kiongozi
  rationale: Katika orodha hii ya wahudumu, neno hilo linaonyesha cheo cha uongozi; “kiongozi” ni la kawaida na wazi katika Kiswahili.
- source_word: הַתְּחִלָּה
  choice: aliyeanzisha
  rationale: Nomino ya Kiebrania “mwanzo” inahusishwa na cheo na tendo linalofuata; muundo wa kitenzi unaeleza kwa Kiswahili kwamba Matania ndiye aliyeanzisha tendo hilo.
- source_word: יְהוֹדֶה
  choice: shukrani
  rationale: Katika muktadha huu wa ibada, Hifili ya ידה ina maana ya kushukuru au kusifu; “shukrani” inafaa kwa tendo la kiliturujia bila kuingiza maana ya kuungama.
- source_word: לַתְּפִלָּה
  choice: katika sala
  rationale: Huwakilisha kwa njia ya kawaida uhusiano wa shukrani na sala katika muktadha wa ibada.
- source_word: מִשְׁנֶה
  choice: wa pili
  rationale: Neno linaonyesha nafasi ya pili au cheo kinachofuata; tafsiri hii ni fupi na haibainishi zaidi ya Kiebrania.
- source_word: מֵאֶחָיו
  choice: miongoni mwa ndugu zake
  rationale: Huhifadhi lugha ya kifamilia ya Kiebrania bila kuipanua kimafafanuzi kuwa Walawi wenzake.
- source_word: יְדִיתוּן
  choice: Yeduthuni
  rationale: Hili ni umbo la jina linalosomeka kwa kawaida katika tahajia na matamshi ya Kiswahili.
theological_decisions:
- issue: Maana ya ידה katika muktadha wa ibada
  choice: shukrani
  alternative: kuungama au sifa
  rationale: Muktadha wa huduma ya hekalu na ukoo wa Asafu unaelekeza kwenye kushukuru au kusifu. “Shukrani” huhifadhi maana inayowezekana zaidi bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa nasaba umehifadhiwa, huku kishazi kigumu cha Kiebrania רֹאשׁ הַתְּחִלָּה יְהוֹדֶה לַתְּפִלָּה kikitolewa kwa ufasaha kama “kiongozi aliyeanzisha shukrani katika sala.”
