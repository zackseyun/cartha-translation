translation_notes:
  register: Lugha ni fupi na yenye hadhi, kama inavyofaa kwa orodha ya majina ya mahali. Majina yametoholewa kwa tahajia inayosomeka kwa Waswahili, huku tanbihi zikihifadhi tofauti halali za utohoaji. Muundo wa orodha usio na kiunganishi umehifadhiwa.
