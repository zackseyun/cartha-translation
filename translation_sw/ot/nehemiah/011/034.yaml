  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Zeboimu.” Tahajia za jina la Kiebrania צְבֹעִים hutofautiana kidogo zinapotoholewa.
    reason: lexical_alternative
  - marker: b
    text: Au “Neballati.” Umbo la Kiebrania נְבַלָּט lina konsonanti l iliyokazwa, ambayo inaweza kuonyeshwa kwa kuandika l mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדִיד
  choice: Hadidi
  rationale: Ni jina la mahali katika orodha ya makazi. Limeandikwa kwa namna inayolingana na matamshi na tahajia ya kawaida ya Kiswahili, bila kutafsiri maana inayodhaniwa ya jina.
- source_word: צְבֹעִים
  choice: Seboimu
  rationale: Ni jina la mahali. Tahajia hii inalitohoa kwa mfumo wa sauti wa Kiswahili na inawakilisha umbo la Kiebrania kwa njia inayosomeka kwa urahisi.
- source_word: נְבַלָּט
  choice: Nebalati
  rationale: Ni jina la mahali. Tahajia ya Kiswahili inaongeza irabu ya mwisho ili jina litamkike kwa kawaida; kutorudia herufi l hakufuti tofauti yoyote ya kimaana.
