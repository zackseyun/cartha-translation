translation:
  language: sw
  text: Nao wana wa Benyamini walikaa Geba, Mikmashi, Aya[a], Betheli na vijiji vyake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ai” badala ya “Aya.” Umbo la Kiebrania hapa ni עַיָּה; huenda likawa jina la eneo lilelile au jina la mahali linalohusiana kwa karibu katika mapokeo ya tafsiri.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: Nao wana wa Benyamini
  rationale: Muundo huu unahifadhi kwa uwazi usemi wa Kiebrania ‘wana wa Benyamini,’ ambao katika orodha hii unamaanisha watu au wazao wa kabila la Benyamini.
- source_word: מִגָּבַע
  choice: walikaa kuanzia Geba
  rationale: Kihusishi מִן kinaonyesha mwanzo wa mfululizo wa maeneo. Kitenzi ‘walikaa’ kimeongezwa kutokana na muktadha wa orodha ya makazi ili sentensi iwe ya kawaida na wazi kwa Kiswahili.
- source_word: מִכְמָשׂ
  choice: Mikmashi
  rationale: Jina la mahali limetoholewa kwa tahajia inayofuata kwa karibu matamshi ya Kiebrania na inayosomeka kwa urahisi katika Kiswahili.
- source_word: וְעַיָּה
  choice: Aya
  rationale: Jina hili linawakilisha umbo la Kiebrania עַיָּה kwa Kiswahili. Uwezekano wa kulihusianisha na Ai umehifadhiwa katika tanbihi.
- source_word: וּבֵית אֵל
  choice: Betheli
  rationale: Tahajia hii ya Kiswahili inawakilisha jina la mahali בית־אל kwa namna ya kawaida na inayotamkika kwa urahisi.
- source_word: וּבְנֹתֶיהָ
  choice: na vijiji vyake
  rationale: Ingawa maana ya neno kwa neno ni ‘binti zake,’ hapa ni nahau inayotaja vijiji au makazi madogo yaliyotegemea mji mkuu.
