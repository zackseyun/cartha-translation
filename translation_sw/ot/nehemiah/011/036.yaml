  text: And from the Levites[a], divisions in Judah belonged to Benjamin.
translation:
  language: sw
  text: Na kutoka kwa Walawi,[a] vikundi vilivyokuwa katika Yuda vilikuwa vya Benyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na kutoka kwa Walawi, vikundi vya Yuda vilikuwa vya Benyamini.” Kiebrania kimebanwa sana, na uhusiano kamili kati ya “Yuda” na “Benyamini” haujaelezwa wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: Na baadhi ya
  rationale: Kiunganishi וּ pamoja na kihusishi מִן huendeleza taarifa iliyotangulia na hapa kinaeleweka kwa maana ya sehemu ya kundi; Kiswahili cha kawaida huhitaji kutaja ‘baadhi ya’ ili kuonyesha maana hiyo bila kudai kwamba ni Walawi wote.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Nomino hii inawataja moja kwa moja Walawi; ‘Walawi’ ni istilahi ya kawaida, sahihi, na yenye hadhi katika Kiswahili cha Biblia.
- source_word: מַחְלְקוֹת
  choice: vikundi
  rationale: Neno linaweza kumaanisha migawanyo au makundi yaliyopangwa. ‘Vikundi’ ni la asili katika Kiswahili na linafaa kwa mpangilio wa watu, bila kuongeza wazo lisilo wazi la kiutawala.
- source_word: יְהוּדָה
  choice: vilivyokuwa katika Yuda
  rationale: Kiebrania kimebanwa sana na hakitaji wazi uhusiano. Usemi huu unatoa uelewa wa mahali unaowezekana katika muktadha, huku tanbihi ikihifadhi uwezekano wa kutafsiri ‘vikundi vya Yuda.’
- source_word: לְבִנְיָמִין
  choice: vilihesabiwa kuwa vya Benyamini
  rationale: Kihusishi לְ kinaonyesha uhusiano au mgawo. ‘Vilihesabiwa kuwa vya’ kinaeleza uhusiano huo kwa Kiswahili cha kawaida bila kuamua kwa nguvu kama ulikuwa umiliki rasmi au mgawo wa kiutawala.
