  yaml_path: translation/ot/nehemiah/011/006.yaml
  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: sw
  text: Wazao wote wa Peresi walioishi Yerusalemu walikuwa wanaume mashujaa[a] mia nne sitini na wanane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaume wenye uwezo.” Kauli ya Kiebrania inaweza kumaanisha wanaume waliotambulika kwa nguvu, uwezo, au ushujaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: wote
  rationale: Inaonyesha jumla kamili ya kundi linalohesabiwa.
- source_word: בְּנֵי פֶרֶץ
  choice: wazao wa Peresi
  rationale: Ingawa kihalisi ni ‘wana wa Peresi,’ katika orodha ya ukoo kauli hii inamaanisha wazao wake; ‘wazao’ ni ya asili na wazi kwa Kiswahili cha sasa.
- source_word: הַיֹּשְׁבִים
  choice: walioishi
  rationale: Kitenzi ישב katika muktadha wa makazi humaanisha kuishi au kukaa mahali fulani.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Jina la mahali limetumiwa pamoja na maana ya kiambishi cha mahali iliyomo katika muundo wa Kiswahili ‘walioishi Yerusalemu.’
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: mia nne sitini na wanane
  rationale: Idadi ya Kiebrania imeandikwa kwa maneno kwa mtindo wa kawaida wa Kiswahili.
- source_word: אַנְשֵׁי חָיִל
  choice: wanaume mashujaa
  rationale: Kauli hiyo inaweza kueleza nguvu, uwezo, au ushujaa. ‘Wanaume mashujaa’ huhifadhi jinsia ya neno na sifa yake ya heshima, huku tanbihi ikihifadhi upana wa maana.
