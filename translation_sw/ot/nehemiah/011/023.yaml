base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: sw
  text: Kwa maana amri ya mfalme ilikuwa juu yao[a], na kulikuwa na utaratibu uliowekwa kwa ajili ya waimbaji[b], kila siku, kama ilivyohitajika siku hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliwahusu.” Kirai cha Kiebrania kinaweza kuonyesha mamlaka au wajibu uliowekwa juu yao.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “utaratibu uliowekwa” linaweza pia kumaanisha mgao uliowekwa au wajibu uliothibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaanzisha maelezo yanayofafanua kauli iliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: amri ya mfalme
  rationale: Kirai hiki kinamaanisha agizo lenye mamlaka kutoka kwa mfalme; “amri” ni neno la kawaida na lenye nguvu inayofaa.
- source_word: עֲלֵיהֶם
  choice: ilikuwa juu yao
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya wajibu uliowekwa juu yao bila kuondoa uwezekano wa maana ya mamlaka au wajibu.
- source_word: וַאֲמָנָה
  choice: mpango thabiti
  rationale: Katika muktadha wa kiutawala, neno hili linaweza kumaanisha mpango uliothibitishwa, mgao uliowekwa, au wajibu maalumu; chaguo hili linahifadhi upana huo.
- source_word: עַל הַמְשֹׁרְרִים
  choice: kwa ajili ya waimbaji
  rationale: Katika muktadha huu עַל linaonyesha wale ambao mpango uliwahusu; Kiswahili hiki ni wazi na cha kawaida.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: mahitaji ya kila siku kwa siku yake
  rationale: Nahau hii ya Kiebrania inaonyesha jambo, hitaji, au mgao uliopangwa siku kwa siku. Tafsiri inaweka wazi maana ya kiutawala huku ikihifadhi urudiaji wa chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ilikuwa juu yao” umehifadhiwa kwa makusudi ili kuonyesha taswira na utata wa chanzo, huku sehemu ya mwisho ikitolewa kwa lugha inayoeleweka ya mahitaji ya siku kwa siku.
