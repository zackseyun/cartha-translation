id: NEH.11.11
reference: Nehemiah 11:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: sw
  text: Seraya mwana wa Hilkia, mwana wa Meshulamu, mwana wa Sadoki, mwana wa Merayothi, mwana wa Ahitubu, kiongozi[a] wa nyumba ya Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuu” au “msimamizi.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kutafsiriwa.
- source_word: בֶן
  choice: mwana wa
  rationale: Mfumo huu wa nasaba una maana ya moja kwa moja ya ‘mwana wa.’ Ingawa katika nasaba za Kiebrania neno hilo wakati mwingine linaweza kumaanisha mzao, muktadha huu haulazimishi maana hiyo pana.
- source_word: נְגִיד
  choice: kiongozi
  rationale: Neno hili humaanisha mtu aliyewekwa kusimamia au kuongoza. ‘Kiongozi’ ni la kawaida na linalofaa katika muktadha huu bila kuingiza dhana ya kifalme iliyomo katika ‘mtawala.’
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii ndiyo maana halisi ya kirai cha Kiebrania. Ingawa kinarejelea hekalu, usemi ‘nyumba ya Mungu’ ni wa asili katika Kiswahili na unadumisha taswira ya maandishi ya chanzo.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika kirai hiki אֱלֹהִים humrejelea Mungu wa Israeli; kwa hiyo umoja ‘Mungu’ unafaa.
theological_decisions:
- issue: Iwapo בֵּית הָאֱלֹהִים itafsiriwe moja kwa moja kuwa ‘hekalu’
  choice: Kudumisha ‘nyumba ya Mungu’ katika matini kuu
  alternative: hekalu la Mungu
  rationale: Usemi wa chanzo unaeleweka kwa Kiswahili, huku tanbihi ikifafanua kwamba mahali panaporejelewa ni hekalu bila kufuta taswira ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Majina yametoholewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
