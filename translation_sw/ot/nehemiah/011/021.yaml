  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: sw
  text: Watumishi wa Hekalu[a] waliishi Ofeli, nao Ziha na Gishpa walikuwa wasimamizi wa watumishi wa Hekalu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Nethinim, istilahi maalumu kwa kundi lililopewa huduma ya Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: watumishi wa Hekalu
  rationale: Neno hili ni istilahi ya kipindi cha baada ya uhamisho kwa kundi lililotengwa kwa ajili ya huduma ya Hekalu. Tafsiri ya kazi yao inaeleweka kwa urahisi kuliko kunukuu tu jina la Kiebrania.
- source_word: יֹשְׁבִים
  choice: walikuwa wakiishi
  rationale: Umbo la participio linaonyesha makao yaliyoendelea; usemi huu wa kawaida wa Kiswahili unadumisha maana hiyo.
- source_word: בָּעֹפֶל
  choice: Ofeli
  rationale: Ofeli ni jina au istilahi ya eneo la mwinuko lenye ngome. Katika Kiswahili, kihusishi cha mahali kinaweza kuachwa kabla ya jina hili baada ya kitenzi 'kuishi' bila kupoteza maana.
- source_word: צִיחָא
  choice: Siha
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili, huku sauti ya konsonanti ya kwanza ikiwakilishwa kwa 'S'.
- source_word: גִשְׁפָּא
  choice: Gishpa
  rationale: Jina la mtu limetoholewa kwa tahajia inayokaribia umbo la Kiebrania.
- source_word: עַל
  choice: walikuwa wasimamizi wa
  rationale: Katika muktadha huu wa utawala, neno linaonyesha mamlaka au uangalizi. 'Wasimamizi wa' ni Kiswahili cha kawaida na wazi.
