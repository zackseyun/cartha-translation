base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: sw
  text: Naye Pethahia mwana wa Meshezabeli, wa wazao wa Zera mwana wa Yuda, alikuwa kando ya mfalme[a] katika kila jambo lililohusu watu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alikuwa mwakilishi wa mfalme” au “alikuwa katika huduma ya mfalme.” Kiebrania kinasema kihalisi “alikuwa kwenye mkono wa mfalme,” nahau inayoweza kumaanisha ukaribu na mfalme au huduma rasmi chini ya mamlaka yake.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya watu.” Kiebrania kinaweza kumaanisha mambo yaliyowahusu watu au mambo yaliyoshughulikiwa kwa niaba yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: Naye Pethahia
  rationale: Kiunganishi וּ־ kinadumisha mwendelezo wa orodha; “Naye” ni ya kawaida na yenye hadhi katika Kiswahili, huku jina likinakiliwa kifonetiki.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: mwana wa Meshezabeli
  rationale: Muundo wa kawaida wa nasaba umehifadhiwa wazi.
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: wa wazao wa Zera mwana wa Yuda
  rationale: בְּנֵי katika muktadha wa nasaba hueleweka kwa Kiswahili cha kawaida kama “wazao”; mnyororo wa nasaba wa Zera hadi Yuda umehifadhiwa.
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: alikuwa mwakilishi wa mfalme
  rationale: Nahau hiyo, kihalisi “kwenye mkono wa mfalme,” inaashiria cheo cha huduma au uwakilishi chini ya mamlaka ya mfalme. Tafsiri kuu inaeleza kazi hiyo kwa Kiswahili cha kawaida, na uwezekano wa kuwa karibu na mfalme umehifadhiwa katika tanbihi.
- source_word: לְ/כָל דָּבָר
  choice: katika kila jambo
  rationale: דָּבָר hapa ni jambo au shughuli ya kiutawala, si neno lililosemwa.
- source_word: לָ/עָם
  choice: lililohusu watu
  rationale: Tafsiri hii inaonyesha uhusiano wa mambo hayo na watu bila kuamua kwamba yote yalifanywa kwa manufaa yao; maana ya “kwa ajili ya watu” imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wazao” hutumiwa badala ya “wana” ili nasaba ieleweke kwa urahisi; tanbihi zinahifadhi utata halisi wa nahau ya kifalme na wa kihusishi לָעָם.
