base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: sw
  text: Nao Waisraeli wengine, makuhani na Walawi walikuwa katika miji yote ya Yuda, kila mmoja katika urithi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kila mtu katika urithi wake”; muundo wa umoja umetumiwa kwa maana ya kila mmoja kivyake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: Nao Waisraeli wengine
  rationale: שְׁאָר humaanisha waliobaki au wengine baada ya wale waliotajwa; muundo huu ni wa asili katika Kiswahili na unaonyesha tofauti na waliokaa Yerusalemu.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa tabaka la kikuhani.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Jina la kawaida la Kiswahili kwa watu wa ukoo wa Lawi.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: katika miji yote ya Yuda
  rationale: בְּ hapa ina maana ya mahali; tafsiri hii ni ya moja kwa moja na ya asili.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Ingawa neno lenyewe ni umoja wa kiume, hapa limetumiwa kwa maana ya kugawa kundi kwa watu mmoja mmoja. 'Kila mmoja' huwasilisha kazi hiyo kwa Kiswahili cha sasa.
- source_word: בְּנַחֲלָתוֹ
  choice: katika urithi wake
  rationale: נַחֲלָה ni milki iliyorithiwa au sehemu ya ardhi iliyogawiwa; 'urithi' huhifadhi maana ya ardhi ya agano kuliko 'mali'.
theological_decisions:
- issue: Lugha ya umoja wa kiume yenye maana ya kugawa kundi
  choice: kila mmoja katika urithi wake
  alternative: kila mtu katika urithi wake
  rationale: Muundo wa Kiebrania אִישׁ ... נַחֲלָתוֹ ni wa umoja na una maana ya kila mtu katika kundi kivyake. 'Kila mmoja ... wake' huhifadhi umoja huo bila kulazimisha neno 'mwanaume' ambapo kazi kuu ya אִישׁ ni ya ugawaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na iliyo wazi. 'Nao' huunganisha mstari na orodha iliyotangulia, na 'Waisraeli wengine' ni ya asili zaidi kuliko 'mabaki ya Israeli' katika muktadha huu.
