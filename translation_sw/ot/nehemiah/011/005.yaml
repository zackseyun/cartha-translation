base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: sw
  text: na Maasaya mwana wa Baruku, mwana wa Kol-Hoze, mwana wa Hazaya, mwana wa Adaya, mwana wa Yoyaribu, mwana wa Zekaria, mwana wa Mshiloni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msheloni.” Neno la Kiebrania linaweza kumaanisha mtu aliyehusishwa na Shilo, au mtu wa ukoo wa Shela/Shiloni katika mapokeo ya nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: na Maasaya
  rationale: Kiunganishi וּ kimetafsiriwa “na” kwa kuwa mstari huu unaendeleza orodha ya mstari uliotangulia; jina limetoholewa kwa namna inayofaa Kiswahili.
- source_word: בֶן
  choice: mwana wa
  rationale: Neno hili la nasaba limetafsiriwa kwa uthabiti kama “mwana wa,” huku muundo unaorudiwa wa asili ukihifadhiwa.
- source_word: בָּרוּךְ
  choice: Baruku
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: כָּל חֹזֶה
  choice: Kol-Hoze
  rationale: Umbo hili linachukuliwa kuwa jina la mtu, si kirai cha kutafsiriwa kwa maana yake ya moja kwa moja.
- source_word: חֲזָיָה
  choice: Hazaya
  rationale: Jina la mtu limetoholewa kwa mfumo unaosomeka kwa urahisi katika Kiswahili.
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: יוֹיָרִיב
  choice: Yoyaribu
  rationale: Toleo hili linafuata kwa karibu umbo la Kiebrania lililo katika mstari huu na fonolojia ya Kiswahili.
- source_word: זְכַרְיָה
  choice: Zekaria
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הַ/שִּׁלֹנִי
  choice: Mshiloni
  rationale: Nomino ya Kiswahili yenye kiambishi M- inaonyesha mtu anayehusishwa na mahali au ukoo, na hivyo kuhifadhi upana wa neno la Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa orodha ya nasaba umehifadhiwa kwa kurudia “mwana wa.” Majina yametoholewa kwa namna ya kawaida na yenye kusomeka, huku utata wa Mshiloni ukielezwa katika tanbihi.
