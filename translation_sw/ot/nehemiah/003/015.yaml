translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi na wenye heshima. “Makomeo” na “mataruma” yanatofautisha vifaa viwili vya kufungia lango, na msisitizo wa הוּא umehifadhiwa kwa “Yeye mwenyewe.”
