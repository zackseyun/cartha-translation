  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: sw
  text: Shalumu mwana wa Kol-Hoze, mkuu wa wilaya ya Mizpa, alilitengeneza Lango la Chemchemi. Yeye alilijenga upya, akaliezeka, na kuweka milango yake, makomeo yake na mataruma yake. Pia aliutengeneza ukuta wa Bwawa la Shela[a], karibu na bustani ya mfalme, mpaka kwenye ngazi zinazoshuka kutoka Mji wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Bwawa la Siloa” (kwa mapokeo hutambuliwa kuwa Bwawa la Siloamu). Jina la mahali katika Kiebrania hapa ni Shela.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Lango la Chemchemi
  rationale: עַיִן hapa humaanisha chemchemi kama chanzo cha maji. “Lango la Chemchemi” ni Kiswahili cha kawaida na kinafaa katika muktadha wa mfumo wa maji wa Yerusalemu.
- source_word: הֶחֱזִיק
  choice: alilitengeneza
  rationale: Katika Nehemia 3 kitenzi hiki hutumiwa kwa kazi ya kukarabati au kurekebisha sehemu ya ukuta au lango; “alilitengeneza” ni ya asili na inaeleweka kwa urahisi.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: mkuu wa wilaya ya Mizpa
  rationale: שַׂר ni mkuu au afisa mwenye mamlaka, na פֶּלֶךְ ni eneo la kiutawala. “Mkuu wa wilaya” huwasilisha wajibu huo bila kumfanya kwa lazima kuwa gavana.
- source_word: הוּא יִבְנֶנּוּ
  choice: Yeye mwenyewe alilijenga upya
  rationale: Kiwakilishi הוּא kinasisitiza kwamba Shalumu ndiye aliyefanya kazi hiyo; katika muktadha wa urejeshaji, “alilijenga upya” ni sahihi kuliko “alilijenga” pekee.
- source_word: וִיטַלְלֶנּוּ
  choice: akaliezeka
  rationale: Kitenzi kinarejelea kulifunika jengo la lango kwa paa. “Akaliezeka” ni usemi mfupi na wa kawaida wa Kiswahili kwa kuweka paa.
- source_word: ויעמידו דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: na kuweka milango yake, makomeo yake na mataruma yake
  rationale: Orodha inaeleza kufungwa kwa sehemu zinazotumika za lango. מַנְעֻלִים ni vifaa vya kukomea, na בְּרִיחִים ni mataruma au mapingo ya kuvuka lango.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: ukuta wa Bwawa la Shela
  rationale: בְּרֵכָה ni bwawa, na הַשֶּׁלַח ni jina la mahali linalohusishwa na mfumo wa maji uliojulikana baadaye kama Siloa. “Shela” linahifadhi kwa karibu umbo la jina lililo katika maandishi ya Kiebrania.
- source_word: לְגַן הַמֶּלֶךְ
  choice: karibu na bustani ya mfalme
  rationale: Katika maelezo ya mahali, לְ inaweza kuonyesha uhusiano wa eneo au uelekeo. “Karibu na” huonyesha kwa kawaida kwamba ukuta ulikuwa kandokando ya bustani.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדֹות
  choice: mpaka kwenye ngazi zinazoshuka
  rationale: מַעֲלוֹת inaweza kumaanisha vipandio au ngazi, huku kishirikishi הַיּוֹרְדֹות kikibainisha kwamba ngazi hizo zinashuka.
- source_word: מֵעִיר דָּוִיד
  choice: kutoka Mji wa Daudi
  rationale: Kihusishi מִן huonyesha mahali pa kuanzia; “kutoka Mji wa Daudi” huhifadhi kwa uwazi maelezo hayo ya kijiografia.
