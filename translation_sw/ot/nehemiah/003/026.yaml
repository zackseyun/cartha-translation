base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/026.yaml
  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: sw
  text: Watumishi wa Hekalu[a] walikuwa wakiishi kwenye Ofeli, hadi mkabala na Lango la Maji upande wa mashariki, na hadi mnara unaotokeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Netinimu, jina la kundi maalumu la watumishi wa Hekalu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: Watumishi wa Hekalu
  rationale: Neno hili linataja kundi maalumu la watumishi waliopewa kazi za huduma za Hekalu. Kutafsiri wajibu wao kunawapa wasomaji wa sasa maana iliyo wazi, huku tanbihi ikihifadhi jina la Kiebrania.
- source_word: הָיוּ יֹשְׁבִים
  choice: walikuwa wakiishi
  rationale: Muundo wa kitenzi היה pamoja na participle unaonyesha hali ya kuendelea au makazi ya kudumu; ‘walikuwa wakiishi’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo.
- source_word: בָּעֹפֶל
  choice: kwenye Ofeli
  rationale: Ofeli ni jina la eneo lililoinuka la Yerusalemu. Jina limetoholewa, na ‘kwenye’ linaonyesha mahali bila kuongeza maelezo yasiyosemwa wazi na maandishi.
- source_word: עַד נֶגֶד
  choice: hadi mkabala na
  rationale: ‘Hadi’ huhifadhi wazo la mpaka wa eneo, na ‘mkabala na’ huonyesha kwamba mahali hapo palikabili alama iliyotajwa.
- source_word: שַׁעַר הַמַּיִם
  choice: Lango la Maji
  rationale: Huu ni mfuatano wa nomino unaotaja lango la mji; ‘Lango la Maji’ ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: לַמִּזְרָח
  choice: kuelekea mashariki
  rationale: Kirai hiki kinaonyesha upande au mwelekeo wa mashariki. Ufasiri huu unaacha wazi uhusiano wake wa kisintaksia na alama za mahali zinazolizunguka.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: mnara uliojitokeza nje
  rationale: Katika muktadha wa ujenzi, participle יֹצֵא inaeleza mnara uliochomoza au kuenea nje kutoka kwenye ukuta; usemi huu unahifadhi taswira hiyo kwa Kiswahili cha kawaida.
