lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Baada yake
  rationale: Muundo huu una maana halisi ya ‘na baada yake’; katika orodha hii ya kazi, ‘Baada yake’ ni ya asili katika Kiswahili na inadumisha mfuatano.
- source_word: הֶחֱזִיקוּ
  choice: wakafanya matengenezo
  rationale: Katika Nehemia 3, kitenzi hiki kinatumika kwa namna ya kiidioma kuhusu kushiriki katika ukarabati wa ukuta; tafsiri hii inaeleza kazi hiyo kwa uwazi.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye uainisho.
- source_word: אַנְשֵׁי
  choice: watu wa
  rationale: Ingawa maana ya msingi ni ‘wanaume wa,’ katika muundo wa kutaja watu wanaotoka mahali fulani, ‘watu wa’ ni Kiswahili cha kawaida na hakibadili dai kuu la maandishi.
- source_word: הַכִּכָּר
  choice: Uwanda
  rationale: Neno hili linaweza kumaanisha eneo tambarare au wilaya yenye umbo la duara. ‘Uwanda’ inadumisha maana ya kijiografia bila kulazimisha utambulisho mahususi usio na uhakika hapa.
