id: NEH.3.16
reference: Nehemiah 3:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: sw
  text: Baada yake, Nehemia mwana wa Azbuki, mtawala wa nusu ya wilaya ya Beth-suri, alifanya matengenezo mpaka mahali panapokabiliana na makaburi ya Daudi, mpaka kwenye bwawa lililotengenezwa, na mpaka kwenye nyumba ya mashujaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba ya wapiganaji.” Huenda maneno ya Kiebrania yanamaanisha jengo la kijeshi, lakini utambulisho wake kamili haujulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha ya wajenzi katika Nehemia 3, kirai hiki kwa kawaida huonyesha mfuatano wa watu au sehemu zilizotengenezwa; tafsiri hii pia inadumisha uwezekano wa uhusiano wa karibu na sehemu iliyotangulia.
- source_word: הֶחֱזִיק
  choice: alifanya matengenezo
  rationale: Hifili ya חזק katika Nehemia 3 ni usemi wa kawaida unaomaanisha kutengeneza au kurejesha sehemu ya ukuta, si kuifanya tu iwe imara.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: mtawala wa nusu ya wilaya
  rationale: שַׂר humaanisha kiongozi au afisa mwenye mamlaka, na פֶּלֶךְ hapa ni eneo la utawala la kipindi cha Uajemi; 'wilaya' inaonyesha kiwango hicho bila kukikuza kuwa mkoa mkubwa.
- source_word: בֵּית צוּר
  choice: Beth-suri
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: mpaka mahali panapokabiliana na makaburi ya Daudi
  rationale: נֶגֶד huonyesha eneo lililo mkabala au mbele ya mahali pengine; tafsiri hii haisemi kwamba matengenezo yaliingia katika eneo la makaburi.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: bwawa lililotengenezwa
  rationale: Huhifadhi maana ya hali ya kutendwa katika Kiebrania bila kuamua kwa undani aina ya ujenzi au usanifu wa bwawa hilo.
- source_word: בֵּית הַגִּבֹּרִים
  choice: nyumba ya mashujaa
  rationale: גִּבֹּרִים inaweza kumaanisha watu mashuhuri kwa nguvu au wapiganaji; 'mashujaa' huhifadhi upana huo kuliko tafsiri ya moja kwa moja ya jengo kuwa kambi ya askari.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mara tatu wa עַד umehifadhiwa kwa kurudia “mpaka,” huku sentensi ikibaki ya asili katika Kiswahili.
