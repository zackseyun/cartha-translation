  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Nehemia anafuata mfanyakazi/sehemu iliyotangulia, anafanya matengenezo, na mipaka mitatu ya sehemu yake inaonyeshwa kwa kurudia “mpaka.” “Makaburi ya Daudi,” “bwawa lililotengenezwa,” na “nyumba ya mashujaa” zinahifadhi maana bila kuongeza utambulisho wa kihistoria usio hakika.'
  naturalness: Kiswahili ni sanifu, wazi, na cha hadhi inayofaa kwa orodha ya ujenzi. “Mpaka mahali panapokabiliana na” ni sahihi na kinaeleweka, ingawa “mpaka mkabala wa” kingekuwa kifupi zaidi; si lazima kurekebisha.
  terminology: “Mtawala wa nusu ya wilaya,” “Beth-suri,” “Daudi,” na “nyumba ya mashujaa” vinafaa. Tanbihi imewekwa kwenye “nyumba ya mashujaa” na inaeleza kwa usahihi mbadala wa “wapiganaji” pamoja na kutokuwa hakika kwa utambulisho wa jengo.
