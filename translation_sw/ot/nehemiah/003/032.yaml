  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: sw
  text: Na kati ya chumba cha juu cha kona[a] na Lango la Kondoo, mafundi wa dhahabu na wafanyabiashara walifanya matengenezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kipandio kwenye kona” au “chumba cha juu cha kona.” Neno la Kiebrania עֲלִיָּה linaweza kumaanisha chumba cha juu au kipandio, na haijulikani kwa uhakika ni kipengele kipi cha jengo kinachokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: Na kati ya
  rationale: Inahifadhi kiunganishi na maana ya mahali, huku ikiendeleza maelezo ya sehemu ya mwisho ya ukuta.
- source_word: עֲלִיַּת
  choice: chumba cha juu
  rationale: Neno linaweza kumaanisha chumba au jengo la juu, na pia huenda likamaanisha sehemu ya kupandia; tafsiri hii ni ya kawaida bila kuficha utata huo, ambao umeelezwa katika tanbihi.
- source_word: הַפִּנָּה
  choice: pembe
  rationale: Ni tafsiri ya moja kwa moja ya jina la kawaida lenye kibainishi, likirejelea pembe fulani inayojulikana ya ukuta.
- source_word: לְשַׁעַר הַצֹּאן
  choice: na Lango la Kondoo
  rationale: Katika muundo wa 'kati ya ... na ...', kiambishi cha Kiebrania kinaonyeshwa kwa 'na'; 'Lango la Kondoo' ni jina wazi na la kawaida la lango hilo.
- source_word: הֶחֱזִיקוּ
  choice: walifanya matengenezo
  rationale: Katika Nehemia 3, kitenzi hiki hutumiwa kwa kazi ya kutengeneza sehemu za ukuta na malango, si tu kuziimarisha.
- source_word: הַצֹּרְפִים
  choice: mafundi wa dhahabu
  rationale: Neno linawataja wasafishaji au mafundi wa metali za thamani; katika muktadha huu, 'mafundi wa dhahabu' ni wazi na linaeleweka kwa urahisi.
- source_word: וְהָרֹכְלִים
  choice: na wafanyabiashara
  rationale: Neno linamaanisha wauzaji au wafanyabiashara; chaguo hili ni la kawaida na lina upana unaofaa.
