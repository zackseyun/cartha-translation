base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: sw
  text: Yoyada mwana wa Pasea na Meshulamu mwana wa Besodeya waliikarabati Lango la Kale.[a] Wao waliweka mihimili yake, wakaweka mahali pake milango yake, makomeo yake na mapingo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “Lango la Yeshana,” ikiwa neno la pili linachukuliwa kuwa jina la mahali badala ya kivumishi chenye maana ya “kale.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: wakaitengeneza
  rationale: Katika orodha ya kazi ya Nehemia 3, kitenzi hiki kinaeleza kukarabati au kurejesha sehemu ya ukuta au lango; ‘wakaitengeneza’ ni Kiswahili cha kawaida na kinachofaa katika muktadha huu.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: Lango la Kale
  rationale: Kirai hiki kwa kawaida hueleweka kama jina la lango lenye maana ya ‘Lango la Kale.’ Uwezekano wa kulichukua neno la pili kama jina la mahali umehifadhiwa katika tanbihi.
- source_word: קֵרֻהוּ
  choice: Waliweka mihimili yake
  rationale: Kitenzi kinahusu kufunika au kuezeka kwa mihimili. Katika jengo la lango, usemi huu unaeleza kazi ya ujenzi kwa usahihi bila kudokeza paa kamili la nyumba.
- source_word: וַיַּעֲמִידוּ
  choice: wakasimamisha
  rationale: Maana ya msingi ni kusababisha kitu kisimame au kukiweka mahali pake; ‘wakasimamisha’ ni ya asili kwa kuweka sehemu za lango.
- source_word: דַּלְתֹתָיו
  choice: milango yake
  rationale: Wingi unarejelea pande au mabawa ya lango; ‘milango yake’ ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: מַנְעֻלָיו
  choice: makomeo yake
  rationale: Neno hili linataja vifaa vya kufungia lango. ‘Makomeo’ linafaa kwa vifaa vya jadi vya kulifunga na halidokezi kufuli ya kisasa.
- source_word: בְרִיחָיו
  choice: mapingo yake
  rationale: Neno hili linarejelea fito au vipingo vya kuzuia milango isifunguke; ‘mapingo’ linaitofautisha sehemu hii na makomeo yaliyotajwa kabla.
- source_word: הֵמָּה
  choice: Waliweka
  rationale: Kiwakilishi chenye msisitizo kinawarejelea mafundi waliotajwa. Kiswahili hakihitaji kukirudia kama ‘wao wenyewe’ isipokuwa msisitizo huo ulazimishwe; mtendaji anaendelea kueleweka katika kitenzi.
- source_word: יוֹיָדָע ... וּמְשֻׁלָּם
  choice: Yoyada ... na Meshulamu
  rationale: Majina ya watu yamenukuliwa kwa tahajia inayosomeka kwa Waswahili na inayokaribia maumbo ya Kiebrania.
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: Pasea / Besodeya
  rationale: Majina ya baba yamenukuliwa badala ya kutafsiriwa, kwa tahajia ya kawaida na inayotamkika kwa Kiswahili.
theological_decisions: []
