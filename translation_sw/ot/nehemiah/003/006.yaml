  to: Yoyada mwana wa Pasea na Meshulamu mwana wa Besodeya waliikarabati Lango la Kale.[a] Wao waliweka mihimili yake, wakaweka mahali pake milango yake, makomeo yake na mapingo yake.
  rationale: The revision corrects the singular connective, makes the repaired object explicit, and uses an idiomatic Swahili expression for setting the gate components in place. It preserves the source sequence, the explicit resumptive emphasis (“Wao”), the established technical terms, and the alternative reading in the footnote.
