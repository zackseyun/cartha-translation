  text: פָּלָ֣ל בֶּן אוּזַי֮ מִ/נֶּ֣גֶד הַ/מִּקְצוֹעַ֒ וְ/הַ/מִּגְדָּ֗ל הַ/יּוֹצֵא֙ מִ/בֵּ֤ית הַ/מֶּ֨לֶךְ֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר לַ/חֲצַ֣ר הַ/מַּטָּרָ֑ה אַחֲרָ֖י/ו פְּדָיָ֥ה בֶן פַּרְעֹֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: sw
  text: Palali mwana wa Uzai alifanya matengenezo mkabala na pembe[a] na mnara uliojitokeza kutoka kwenye nyumba ya juu ya mfalme[b], iliyo karibu na ua wa walinzi[c]. Baada yake, Pedaya mwana wa Paroshi alifanya matengenezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya ukuta inayogeuka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ikulu ya juu.” Kiebrania ni, “nyumba ya juu ya mfalme.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ua wa gereza.” Huenda neno hili linamaanisha ua uliolindwa ambako wafungwa walizuiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: mkabala na
  rationale: Katika orodha ya matengenezo, kirai hiki kinaonyesha sehemu iliyoelekeana na alama fulani ya mahali; “mkabala na” ni cha kawaida na huhifadhi maana ya mahali bila kuainisha umbali.
- source_word: הַמִּקְצוֹעַ
  choice: pembe
  rationale: Nomino hii inaonyesha pembe au sehemu ya ukuta inayogeuka. “Pembe” ni neno la kawaida la usanifu katika Kiswahili na haliongezi wazo la mnara wa pembeni.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: mnara uliojitokeza
  rationale: Kauli ya Kiebrania inaeleza mnara ulioenea au uliochomoza kuelekea nje; “uliojitokeza” ni ya asili na huhifadhi taswira hiyo ya usanifu.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: kutoka kwenye nyumba ya juu ya mfalme
  rationale: Tafsiri hii inafuata kwa karibu mpangilio wa Kiebrania na kuhifadhi בית kama “nyumba,” ambalo hapa linaweza kumaanisha jengo la kifalme au sehemu ya ikulu, bila kulazimisha maana finyu.
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: iliyo karibu na ua wa walinzi
  rationale: Kirai hiki kinaonyesha eneo la jengo la kifalme lililotangulia. מטרה hapa huashiria ulinzi, huenda pia eneo la kizuizini; “ua wa walinzi” huhifadhi maana kuu bila kuzidisha wazo la gereza.
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Hii ndiyo fomula ya orodha inayomtambulisha mfanyakazi au sehemu inayofuata.
- source_word: פָּלָל
  choice: Palali
  rationale: Jina limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: אוּזַי
  choice: Uzai
  rationale: Jina la mtu limenukuliwa kwa kufuata umbo la Kiebrania.
- source_word: פְּדָיָה
  choice: Pedaya
  rationale: Jina la mtu limenukuliwa kwa tahajia ya Kiswahili inayokaribia matamshi ya Kiebrania.
- source_word: פַּרְעֹשׁ
  choice: Paroshi
  rationale: Jina la mtu limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: '[ellipsis of verb with פְּדָיָה בֶן פַּרְעֹשׁ]'
  choice: alifanya matengenezo
  rationale: Kitenzi hakijaandikwa katika kishazi cha pili cha Kiebrania, lakini kinaeleweka kutokana na muundo unaorudiwa katika Nehemia 3; kukiongeza kunafanya sentensi iwe kamili na wazi kwa Kiswahili.
