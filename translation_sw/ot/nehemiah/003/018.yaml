base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: sw
  text: 'Baada yake, ndugu zao walifanya matengenezo: Bavai mwana wa Henadadi,[a] mtawala wa nusu ya wilaya ya Keila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mapokeo ya maandishi yanasoma jina hili kuwa “Binui” badala ya “Bavai.”
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Huhifadhi kiashirio cha mfuatano wa sehemu za ukuta katika orodha; ‘Kando yake’ lingewezekana kimuktadha, lakini si tafsiri ya moja kwa moja sawa.
- source_word: הֶחֱזִיקוּ
  choice: walifanya matengenezo
  rationale: Katika Nehemia 3 kitenzi hiki, ambacho kwa msingi humaanisha ‘kutia nguvu,’ kinatumika kwa kazi ya kurekebisha ukuta.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Hufuata maana ya moja kwa moja ya Kiebrania huku ikiacha wazi ikiwa ni ndugu wa damu au wenzao wa kundi.
- source_word: בַּוַּי
  choice: Bavai
  rationale: Jina limetoholewa kwa kufuata matamshi ya maandishi ya WLC; mapokeo mengine yana jina tofauti.
- source_word: בֶּן חֵנָדָד
  choice: mwana wa Henadadi
  rationale: Ni muundo wa kawaida wa Kiebrania wa kutaja nasaba; majina yametoholewa kwa umbo linalosomeka kwa Kiswahili.
- source_word: שַׂר
  choice: mtawala
  rationale: Katika muktadha huu wa utawala wa eneo, neno linaonyesha mwenye mamlaka ya kiutawala, si lazima kamanda wa kijeshi.
- source_word: חֲצִי פֶּלֶךְ
  choice: nusu ya wilaya
  rationale: Kirai kinaonyesha nusu ya kitengo cha kiutawala; ‘wilaya’ ni sawa ya kisasa iliyo wazi bila kudokeza eneo kubwa mno.
- source_word: קְעִילָה
  choice: Keila
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida na inayosomeka katika Kiswahili.
