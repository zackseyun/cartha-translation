  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/תְּקֹעִ֖ים מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֜גֶד הַ/מִּגְדָּ֤ל הַ/גָּדוֹל֙ הַ/יּוֹצֵ֔א וְ/עַ֖ד חוֹמַ֥ת הָ/עֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: sw
  text: Baada yake, watu wa Tekoa walitengeneza sehemu nyingine[a], mkabala na mnara mkubwa unaojitokeza, mpaka ukuta wa Ofeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya pili.” Kirai cha Kiebrania kinaweza kusisitiza kwamba watu wa Tekoa walitengeneza sehemu nyingine zaidi ya ile waliyopewa hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha ya kazi ya Nehemia 3, kirai hiki kinaonyesha mfuatano wa sehemu au vikundi vya kazi. Tafsiri hii pia inahifadhi kiambishi cha nafsi ya tatu umoja cha Kiebrania.
- source_word: הֶחֱזִיקוּ
  choice: walitengeneza
  rationale: Ingawa kitenzi hiki kimsingi kina maana ya kufanya imara, katika muktadha wa Nehemia 3 kinatumika kwa kazi ya kutengeneza au kujenga upya ukuta. ‘Walitengeneza’ ni ya kawaida na wazi katika Kiswahili.
- source_word: הַתְּקֹעִים
  choice: watu wa Tekoa
  rationale: Hili ni jina la wakazi wa Tekoa. ‘Watu wa Tekoa’ ni namna ya asili na inayoeleweka kwa urahisi katika Kiswahili.
- source_word: מִדָּה שֵׁנִית
  choice: sehemu nyingine
  rationale: Kirai hiki kinaonyesha sehemu ya ziada waliyopewa watu wale wale baada ya kazi yao iliyotajwa awali. Tanbihi inadumisha tafsiri halisi zaidi, ‘sehemu ya pili.’
- source_word: מִנֶּגֶד
  choice: mkabala na
  rationale: Neno hili linaonyesha mahali panapokabiliana na alama fulani ya eneo; ‘mkabala na’ ni tafsiri fupi na ya kawaida.
- source_word: הַמִּגְדָּל הַגָּדוֹל
  choice: mnara mkubwa
  rationale: Inawasilisha moja kwa moja nomino na kivumishi vya Kiebrania kwa Kiswahili cha kawaida.
- source_word: הַיּוֹצֵא
  choice: unaojitokeza
  rationale: Kishiriki hiki, ambacho kihalisi ni ‘unaotoka,’ katika maelezo ya jengo kinaonyesha mnara unaochomoza au kujitokeza nje ya mstari wa ukuta.
- source_word: וְעַד
  choice: mpaka
  rationale: Inaonyesha mwisho wa sehemu iliyotengenezwa. Kiswahili hakihitaji kutafsiri kiunganishi וְ kwa neno tofauti hapa.
- source_word: חוֹמַת הָעֹפֶל
  choice: ukuta wa Ofeli
  rationale: Muundo wa uhusiano wa Kiebrania umetafsiriwa moja kwa moja, huku jina la mahali עֹפֶל likinakiliwa kama ‘Ofeli.’
theological_decisions: []
