base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: sw
  text: Kando yake, Ezeri mwana wa Yeshua, mkuu wa Mispa, alitengeneza sehemu nyingine[a] mkabala na njia ya kupandia kwenye ghala la silaha[b], penye pembe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu ya pili.” Kirai cha Kiebrania kinaweza kusisitiza kwamba Ezeri alitengeneza kipande cha ziada cha ukuta.
    reason: lexical_alternative
  - marker: b
    text: Au “silaha.” Huenda neno la Kiebrania hapa linataja mahali pa kuhifadhi silaha, yaani ghala la silaha.
    reason: lexical_alternative
  - marker: c
    text: Au “kwenye kona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: alitengeneza
  rationale: Katika muktadha wa Nehemia 3, kitenzi hiki kinamaanisha kufanya kazi ya kukarabati au kujenga upya ukuta; “alitengeneza” ni Kiswahili cha kawaida kinachofaa katika orodha hii ya ujenzi.
- source_word: עַל יָדוֹ
  choice: Kando yake
  rationale: Kirai hiki kinataja ukaribu wa sehemu za kazi katika mpangilio wa wajenzi, si maana halisi ya “juu ya mkono wake.”
- source_word: שַׂר הַמִּצְפָּה
  choice: mkuu wa Mispa
  rationale: שַׂר humaanisha kiongozi au afisa mwenye mamlaka. “Mkuu” huonyesha wajibu wa utawala bila kudokeza ufalme.
- source_word: מִדָּה שֵׁנִית
  choice: sehemu nyingine
  rationale: Katika sura hii kirai hiki huonyesha kipande cha ziada cha ukuta kilichotengenezwa. Tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi, “sehemu ya pili.”
- source_word: מִנֶּגֶד
  choice: mkabala na
  rationale: Neno hili linaonyesha mahali panapokabiliana na alama fulani ya eneo.
- source_word: עֲלֹת
  choice: njia ya kupandia
  rationale: Nomino-kitenzi hii inaeleza sehemu au njia ya kupanda kuelekea mahali palipo juu.
- source_word: הַנֶּשֶׁק
  choice: ghala la silaha
  rationale: Ingawa neno lenyewe linaweza kumaanisha silaha, katika maelezo haya ya mahali huenda linataja mahali zilipohifadhiwa.
- source_word: הַמִּקְצֹעַ
  choice: pembe
  rationale: Neno hili linataja kona au sehemu ambako ukuta unageuka; “pembe” huhifadhi wazo la umbo na mahali.
