base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: sw
  text: 'Baada yake, Baruku mwana wa Zabai[a] alikarabati kwa bidii kubwa[b] sehemu ya pili, kuanzia penye kona mpaka kwenye mlango wa nyumba ya Eliashibu, kuhani mkuu.


    [a] Au: “Baruku mwana wa Zakai,” kufuatana na mapokeo mengine ya jina hili yanayoonekana katika baadhi ya tafsiri za kale.


    [b] Maneno ya Kiebrania yaliyotafsiriwa “alikarabati kwa bidii kubwa” yana muundo usio wa kawaida, na huenda yanakazia ari au juhudi zake za pekee katika kazi hiyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Baruku mwana wa Zakai,” kufuatana na mapokeo mengine ya jina hili yanayoonekana katika baadhi ya tafsiri za kale.'
    reason: alternative_reading
  - marker: b
    text: Maneno ya Kiebrania yaliyotafsiriwa “alikarabati kwa bidii kubwa” yana muundo usio wa kawaida, na huenda yanakazia ari au juhudi zake za pekee katika kazi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha ya wajenzi, usemi huu huonyesha mfuatano wa kazi na pia mahali pa sehemu inayofuata kando ya ile iliyotangulia.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: alikarabati kwa bidii kubwa
  rationale: הֶחֱזִיק katika sura hii humaanisha kukarabati au kuimarisha. הֶחֱרָה iliyo mbele yake ni ya pekee na inaongeza wazo la ari au juhudi kubwa; tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi upekee wa Kiebrania.
- source_word: בָּרוּךְ בֶּן זבי
  choice: Baruku mwana wa Zabai
  rationale: Majina yametoholewa kwa kuzingatia umbo la konsonanti za Kiebrania; mapokeo mbadala ya jina Zakai yamehifadhiwa katika tanbihi.
- source_word: מִדָּה שֵׁנִית
  choice: sehemu ya pili
  rationale: Katika Nehemia 3, usemi huu unaonyesha kipande kingine cha ukuta alichogawiwa mtu huyo, si kipimo halisi.
- source_word: מִן הַמִּקְצוֹעַ
  choice: kuanzia penye kona
  rationale: Nomino hii hurejelea kona au mahali ukuta unapogeuka; “penye kona” ni Kiswahili cha kawaida na sahihi katika maelezo ya jengo.
- source_word: עַד פֶּתַח בֵּית
  choice: mpaka kwenye mlango wa nyumba ya
  rationale: פֶּתַח ni mlango au nafasi ya kuingilia. Muktadha unaelekea kumaanisha jengo au makao ya Eliashibu.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: Eliashibu, kuhani mkuu
  rationale: “Kuhani mkuu” ndiyo tafsiri sanifu ya cheo הַכֹּהֵן הַגָּדוֹל katika Kiswahili.
