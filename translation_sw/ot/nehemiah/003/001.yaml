  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: sw
  text: Kisha Eliashibu, kuhani mkuu, akainuka pamoja na ndugu zake, makuhani, nao wakajenga Lango la Kondoo. Wao wenyewe wakaliweka wakfu[a] na wakaweka milango yake mahali pake. Wakaliweka wakfu mpaka Mnara wa Mia, mpaka Mnara wa Hananeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakalitakasa.” Kitenzi cha Kiebrania kinaweza kumaanisha kutenga kitu kuwa kitakatifu au kukiweka kwa matumizi maalumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Huhifadhi taswira ya kitenzi קום inayotanguliza kuanza kwa tendo, huku ikisomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: kuhani mkuu
  rationale: Hili ndilo jina la cheo linalokubalika katika Kiswahili kwa kuhani mwenye wadhifa wa juu zaidi.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: pamoja na ndugu zake, makuhani
  rationale: Huhifadhi neno la kifamilia 'ndugu' na pia ufafanuzi wa kwamba ndugu hao walikuwa makuhani.
- source_word: שַׁעַר הַצֹּאן
  choice: Lango la Kondoo
  rationale: Ni tafsiri wazi ya jina la lango la mji na huhifadhi nomino halisi 'kondoo'.
- source_word: הֵמָּה
  choice: Wao wenyewe
  rationale: Huwakilisha msisitizo wa kiwakilishi huru cha Kiebrania kwamba makuhani hao ndio waliofanya tendo hilo.
- source_word: קִדְּשׁוּהוּ
  choice: wakaliweka wakfu
  rationale: Huhifadhi maana ya kidini ya kutenga kwa matumizi matakatifu au kwa kusudi maalumu, bila kuamua kupita kiasi kati ya 'kutakasa' na 'kuweka wakfu'.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: kusimamisha milango yake
  rationale: Hutoa maana ya kuweka milango mahali pake bila kuongeza maelezo yasiyomo kuhusu namna ilivyofungwa.
- source_word: מִגְדַּל הַמֵּאָה
  choice: Mnara wa Mia
  rationale: Hufuata muundo wa Kiebrania wa jina la mahali kwa Kiswahili cha kawaida.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: Mnara wa Hananeli
  rationale: Hutafsiri jina la kitu 'mnara' na kunukuu jina la pekee kwa umbo linalofaa matamshi ya Kiswahili.
- source_word: וְעַד ... עַד
  choice: mpaka ... na kuendelea mpaka
  rationale: Hueleza mipaka miwili iliyotajwa na kurudia wazo la עַד kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Maana ya kidini ya קדשׁ kuhusu lango
  choice: kuweka wakfu
  alternative: kutakasa
  rationale: ‘Kuweka wakfu’ huhifadhi tendo la kutenga kitu kwa kusudi takatifu, lakini huepuka kudokeza kwamba lango lilikuwa na uchafu wa kimaadili uliopaswa kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. Majina ya maeneo yametolewa kama majina maalumu, na msisitizo wa הֵמָּה umehifadhiwa kwa ‘Wao wenyewe’.
