base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: sw
  text: Naye akasema mbele ya ndugu zake na jeshi la Samaria, “Wayahudi hawa dhaifu wanafanya nini? Je, watajenga upya kwa ajili yao wenyewe?[a] Je, watatoa dhabihu? Je, watamaliza kwa siku moja? Je, watahuisha mawe kutoka katika marundo ya mavumbi, ingawa yameungua kwa moto?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania ni kigumu. Tafsiri nyingine zinazowezekana ni “Je, watajenga upya wao wenyewe?” au, kwa maana ya moja kwa moja zaidi, “Je, wataliacha kwa ajili yao wenyewe?”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: mbele ya ndugu zake
  rationale: לִפְנֵי huonyesha kusema katika uwepo wa watu fulani, na אֶחָיו kwa maana ya moja kwa moja ni ‘ndugu zake.’ Katika muktadha huu huenda ni washirika au maafisa wenzake, lakini ‘ndugu zake’ ni ya asili katika Kiswahili na inadumisha usemi wa Kiebrania.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: na jeshi la Samaria
  rationale: חֵיל hapa ni jeshi au kikosi cha kijeshi; ‘jeshi’ ni neno la kawaida na linalofaa muktadha.
- source_word: הָאֲמֵלָלִים
  choice: wanyonge
  rationale: Neno hili ni la dharau na linawasilisha udhaifu na hali ya kusikitisha. ‘Wanyonge’ linadumisha kejeli bila kuifanya iwe maelezo ya hisia tu.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: Je, watajenga upya kwa uwezo wao wenyewe?
  rationale: Kirai hiki ni kigumu; עזב kwa kawaida humaanisha ‘kuacha,’ lakini katika muktadha wa kuwakejeli wanaojenga ukuta, swali linaelekea kuuliza kama wataweza kuujenga upya wenyewe. Tanbihi inadumisha utata wa kimsamiati.
- source_word: הֲיִזְבָּחוּ
  choice: Je, watatoa dhabihu?
  rationale: זבח humaanisha kutoa dhabihu. Usemi huu ni wa kawaida katika Kiswahili na unadumisha mfululizo mfupi wa maswali ya kejeli.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: Je, watamaliza kwa siku moja?
  rationale: כלה katika muundo huu humaanisha kukamilisha au kumaliza; tafsiri inadumisha swali la moja kwa moja.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: Je, watahuisha mawe
  rationale: חיה hapa ni ‘kufanya yawe hai’ au ‘kuhuisha.’ ‘Watahuisha mawe’ linahifadhi taswira hai inayoyafanya mawe yaonekane kana kwamba yanaweza kurudishwa kwenye uhai.
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: kutoka katika marundo ya mavumbi
  rationale: עֲרֵמוֹת ni marundo na עָפָר ni mavumbi au udongo laini. Tafsiri ya moja kwa moja inadumisha picha ya magofu bila kuibadili kimyakimya kuwa ‘vifusi.’
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: ingawa yameungua kwa moto
  rationale: Kishazi kinaeleza hali ya mawe yaliyoharibiwa na moto. ‘Ingawa’ huonyesha vizuri nguvu ya kipingamizi iliyo ndani ya kejeli hiyo.
