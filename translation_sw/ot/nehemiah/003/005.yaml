  edition: WLC
  text: וְ/עַל יָדָ֖/ם הֶחֱזִ֣יקוּ הַ/תְּקוֹעִ֑ים וְ/אַדִּֽירֵי/הֶם֙ לֹא הֵבִ֣יאוּ צַוָּרָ֔/ם בַּ/עֲבֹדַ֖ת אֲדֹנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: sw
  text: Na karibu nao watu wa Tekoa wakafanya matengenezo, lakini wakuu wao[a] hawakukubali kutia shingo zao katika kazi ya mabwana wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waheshimiwa wao” au “viongozi wao.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “hawakuleta shingo yao katika kazi ya mabwana wao”; hii ni nahau inayoonyesha kukataa kujitiisha au kushiriki katika kazi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: Na karibu nao
  rationale: Nahau hii katika orodha ya ujenzi ya Nehemia huonyesha sehemu inayofuata kando ya iliyotangulia; “karibu nao” ni ya kawaida na huhifadhi maana ya mahali.
- source_word: הֶחֱזִיקוּ
  choice: wakafanya matengenezo
  rationale: Katika Nehemia 3 kitenzi hiki hutumiwa kwa kushughulikia ukarabati wa ukuta; tafsiri hii ni wazi bila kupoteza wazo la kuimarisha sehemu iliyoharibika.
- source_word: הַתְּקוֹעִים
  choice: watu wa Tekoa
  rationale: Ni jina la wakazi wa Tekoa; muundo huu ni wa asili na unaoeleweka katika Kiswahili.
- source_word: וְאַדִּירֵיהֶם
  choice: wakuu wao
  rationale: Neno linaweza kutaja watu mashuhuri, wenye nguvu, au wenye cheo. “Wakuu wao” linafaa kwa viongozi wa eneo hilo huku tanbihi ikihifadhi uwezekano wa “waheshimiwa wao.”
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: hawakukubali kutia shingo zao
  rationale: Huhifadhi picha halisi ya shingo na pia huonyesha kukataa kwa makusudi kujitia chini ya jukumu au kubeba kazi.
- source_word: בַּעֲבֹדַת
  choice: katika kazi
  rationale: Muktadha ni kazi halisi ya kujenga upya, ingawa neno linaweza pia kumaanisha utumishi.
- source_word: אֲדֹנֵיהֶם
  choice: mabwana wao
  rationale: Huhifadhi wingi na uhusiano wa mamlaka katika Kiebrania bila kuugeuza kuwa rejeo la umoja kwa Mungu.
theological_decisions:
- issue: Rejeo la אֲדֹנֵיהֶם (“mabwana wao”)
  choice: Mabwana wao, yaani mamlaka au wasimamizi wa kibinadamu wanaohusiana na kazi hiyo
  alternative: Kuisawazisha kuwa “kazi ya Bwana,” kana kwamba inamrejelea Mungu kwa umoja
  rationale: Kiebrania kina wingi wenye kiambishi cha “wao.” Tafsiri inahifadhi muundo huo na haibadilishi kimyakimya kuwa cheo cha Mungu.
- issue: Picha ya “kutia shingo”
  choice: Kuhifadhi nahau ya shingo katika maandishi na kuifafanua katika tanbihi
  alternative: Kuitafsiri moja kwa moja kuwa “hawakujitia katika kazi” au “hawakutaka kufanya kazi”
  rationale: Picha ya Kiebrania huleta wazo la kukubali nira, mamlaka, au mzigo wa kazi; kuihifadhi hudumisha nguvu na mvutano wa usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umehifadhi mtiririko wa orodha ya ujenzi, na nahau ya Kiebrania imebakizwa kwa lugha ya asili kadiri inavyowezekana huku tanbihi ikiifafanua.
