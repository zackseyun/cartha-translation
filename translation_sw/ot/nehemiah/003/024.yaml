  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Mpindo’ na ‘pembe’ zimetumiwa kudumisha tofauti ya maneno mawili ya usanifu katika Kiebrania, na alama zote za tanbihi zimewekwa katika matini kuu.
