base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: sw
  text: Baada yake, Binui mwana wa Henadadi akafanya ukarabati wa sehemu nyingine[a], kutoka nyumba ya Azaria hadi mahali ukuta unapogeukia, na hadi penye pembe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya pili.” Kirai cha Kiebrania kinaweza kumaanisha sehemu ya ziada aliyofanyia ukarabati Binui, au kipande cha pili kilichopimwa.
    reason: lexical_alternative
  - marker: b
    text: Maneno mawili ya Kiebrania yaliyotafsiriwa “mahali ukuta unapogeukia” na “pembe” yana maana zinazokaribiana lakini si sawa kabisa; huenda yanatofautisha alama mbili za ukuta zilizokuwa karibu.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha ya kazi za Nehemia 3, kirai hiki kinaonyesha mfuatano wa taarifa za ukarabati bila kulazimisha maana ya kuwa mahali palipogusana moja kwa moja.
- source_word: הֶחֱזִיק
  choice: akatengeneza
  rationale: Ingawa kitenzi hiki kimsingi huhusu kutia nguvu au kuimarisha, katika muktadha wa Nehemia 3 kinamaanisha kufanya kazi ya kutengeneza ukuta. ‘Akatengeneza’ ni Kiswahili cha kawaida na wazi katika muktadha huu.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: Binui mwana wa Henadadi
  rationale: Majina yamenukuliwa kwa maumbo yanayofaa Kiswahili, na uhusiano wa patronimia umeonyeshwa kwa ‘mwana wa.’
- source_word: מִדָּה שֵׁנִית
  choice: sehemu nyingine
  rationale: Kirai hiki kinaweza kumaanisha sehemu ya ziada aliyotengeneza Binui au kipande cha pili kilichopimwa. ‘Sehemu nyingine’ ni ya asili katika Kiswahili na inafaa mfuatano wa habari, huku tanbihi ikihifadhi uwezekano wa ‘sehemu ya pili.’
- source_word: מִבֵּית עֲזַרְיָה
  choice: kuanzia nyumba ya Azaria
  rationale: Muundo huu unaonyesha mwanzo wa eneo lililotengenezwa. ‘Kuanzia’ huwasilisha kwa kawaida mfuatano wa mipaka unaoendelea kwa ‘mpaka.’
- source_word: עַד הַמִּקְצוֹעַ
  choice: mpaka kwenye mpindo
  rationale: Nomino hii hurejelea mahali ukuta unapogeuka au kufanya pembe. ‘Mpindo’ huitofautisha na neno linalofuata, ambalo limetafsiriwa ‘pembe.’
- source_word: וְעַד הַפִּנָּה
  choice: na mpaka kwenye pembe
  rationale: פִּנָּה kwa kawaida humaanisha pembe au sehemu ya jengo iliyo pembezoni. Kurudia ‘mpaka’ kunahifadhi hatua za maelezo ya eneo katika Kiebrania.
