base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: sw
  text: Sanbalati aliposikia kwamba tulikuwa tukijenga upya ukuta, alikasirika, akaghadhibika sana, na kuwadhihaki Wayahudi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yuda.” Neno la Kiebrania linaweza kumaanisha watu wa Yuda kwa maana ya eneo, na pia Wayahudi kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: alipo-
  rationale: Muundo huu wa wakati unaanzisha tukio linalofuata; kiambishi cha Kiswahili “alipo-” huwasilisha maana hiyo kwa kawaida bila kuongeza neno lisilokuwamo la ‘sasa’.
- source_word: שָׁמַע
  choice: alisikia
  rationale: Kitenzi hiki kwa kawaida humaanisha kusikia; hapa kinahusu kupata habari, na “alisikia” ni sahihi na cha kawaida.
- source_word: סַנְבַלַּט
  choice: Sanbalati
  rationale: Jina limeandikwa kwa namna iliyozoeleka katika Kiswahili.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: kwamba tulikuwa tunaijenga upya
  rationale: Hali ya kushiriki huonyesha tendo linaloendelea; muktadha ni kurejesha ukuta wa Yerusalemu uliobomoka, hivyo “tunaijenga upya” huwasilisha tendo hilo wazi.
- source_word: הַחוֹמָה
  choice: ukuta
  rationale: Neno linamaanisha ukuta, na katika muktadha huu ni ukuta wa ulinzi wa Yerusalemu.
- source_word: וַיִּחַר לוֹ
  choice: alikasirika
  rationale: Nahau ya Kiebrania inaeleza hasira inayowaka; “alikasirika” hutoa maana yake kwa Kiswahili cha kawaida.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: akaghadhibika sana
  rationale: Kitenzi cha pili cha hasira pamoja na “sana” huongeza uzito wa kile cha kwanza; “akaghadhibika sana” huhifadhi mfululizo huo bila kurudia tu “akasirika sana.”
- source_word: וַיַּלְעֵג
  choice: kuwadhihaki
  rationale: Kitenzi kinaonyesha dharau inayotolewa kwa maneno; “kuwadhihaki” ni cha kawaida na chenye nguvu inayofaa.
- source_word: עַל הַיְּהוּדִים
  choice: Wayahudi
  rationale: Neno la Kiebrania linaweza kumaanisha Wayahudi kwa upana au watu wa Yuda kwa maana ya eneo. “Wayahudi” linaeleweka zaidi hapa, huku maana ya eneo ikihifadhiwa katika tanbihi.
