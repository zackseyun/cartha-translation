base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/003.yaml
  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: sw
  text: Wana wa Has-senaa[a] walijenga Lango la Samaki; wao wenyewe waliliezeka[b] na wakaweka milango yake, makomeo yake, na mapingo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wana wa” hapa yaweza kumaanisha watu wa familia au ukoo, yaani, “wazao wa Has-senaa.”
    reason: lexical_alternative
  - marker: b
    text: Au “walilifunika” au “waliweka boriti zake.” Kitenzi cha Kiebrania hurejelea kufunika muundo katika muktadha wa ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: Lango la Samaki
  rationale: Ni muundo wa umilikaji unaotaja lango maalumu la mji lililohusishwa na samaki; huu ndio mtindo wa kawaida na wa asili wa kutaja malango kwa Kiswahili.
- source_word: בָּנוּ
  choice: walijenga
  rationale: Kitenzi בנה kwa kawaida humaanisha kujenga. Ingawa muktadha unahusu kurejesha ukuta, mstari huu hautumii kitenzi mahususi cha kukarabati.
- source_word: בְּנֵי הַסְּנָאָה
  choice: Wana wa Senaa
  rationale: בני inaweza kumaanisha wana halisi au wazao wa ukoo. 'Wana wa' huhifadhi muundo wa Kiebrania, huku tanbihi ikionyesha uwezekano wa maana ya ukoo.
- source_word: הֵמָּה
  choice: wao ndio
  rationale: Kiwakilishi huru kinaweza kuleta msisitizo; 'wao ndio' huuwakilisha kwa Kiswahili cha kawaida bila kuongeza wazo jipya.
- source_word: קֵרוּהוּ
  choice: walioliwekea paa
  rationale: Katika ujenzi, קרה hurejelea kufunika jengo au kuweka boriti zake. 'Kuliwekea paa' ni wazi na ya asili, huku tanbihi ikihifadhi maana mbadala.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: kusimamisha vibao vyake vya mlango
  rationale: Kirai hicho kihalisi ni kufanya milango isimame, yaani kuiweka mahali pake. 'Vibao vya mlango' hutofautisha sehemu zinazofunguka na Lango lenyewe.
- source_word: מַנְעוּלָיו
  choice: makomeo yake
  rationale: Neno hili hutaja vifaa vya kufungia katika muktadha wa malango. 'Makomeo' linafaa pamoja na mapingo bila kulifanya limaanishe kufuli za kisasa.
- source_word: וּבְרִיחָיו
  choice: na mapingo yake
  rationale: בריח ni fito au vyuma vinavyowekwa kwa kuvuka ili kuzuia mlango usifunguke; 'mapingo' ni neno la kawaida la Kiswahili katika muktadha huu.
