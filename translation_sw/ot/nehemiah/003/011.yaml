base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: sw
  text: Malkiya mwana wa Harimu na Hashubu mwana wa Pahath-Moabu walitengeneza sehemu nyingine[a], pamoja na Mnara wa Matanuru[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu ya pili.” Kirai cha Kiebrania kinaweza kutafsiriwa hivyo moja kwa moja; hapa huenda kinamaanisha sehemu nyingine ya ukuta waliyokabidhiwa kuitengeneza.
    reason: lexical_alternative
  - marker: b
    text: Au “Mnara wa Tanuu.” Neno la Kiebrania linaweza kumaanisha tanuu au matanuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: sehemu nyingine
  rationale: Katika orodha ya matengenezo ya Nehemia 3, kirai hiki hurejelea sehemu ya ziada ya ukuta. Kiswahili hiki ni cha kawaida na huhifadhi wazo la sehemu tofauti bila kulazimisha maana ya mpangilio.
- source_word: הֶחֱזִיק
  choice: walitengeneza
  rationale: Katika muktadha wa kujenga upya ukuta, kitenzi hiki humaanisha kutengeneza au kuimarisha. Wingi umetumiwa kwa sababu watendaji wawili wanatajwa.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Jina limetoholewa kwa namna inayosomeka kwa Kiswahili huku likifuata kwa karibu umbo la Kiebrania.
- source_word: בֶן חָרִם
  choice: mwana wa Harimu
  rationale: Muundo wa uhusiano wa kifamilia umetafsiriwa wazi; jina Harimu limetoholewa.
- source_word: וְחַשּׁוּב
  choice: na Hashubu
  rationale: Kiunganishi na jina la mtu vimehifadhiwa; jina limetoholewa kwa matamshi ya Kiswahili.
- source_word: בֶן פַּחַת מוֹאָב
  choice: mwana wa Pahath-Moabu
  rationale: Jina ambatani la ukoo limehifadhiwa kwa utohozi badala ya kutafsiriwa kama cheo au sentensi.
- source_word: וְאֵת
  choice: pamoja na
  rationale: Hutambulisha kitu kingine kilichotengenezwa baada ya sehemu ya ukuta; ‘pamoja na’ huonyesha nyongeza hiyo kwa Kiswahili cha kawaida.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Mnara wa Tanuru
  rationale: ‘Mnara’ huwakilisha מִגְדָּל, na ‘tanuru’ huhifadhi upana wa תַּנּוּרִים, ambayo inaweza kumaanisha majiko makubwa au matanuru. Umbo hilo pia linafaa kama jina la mahali.
