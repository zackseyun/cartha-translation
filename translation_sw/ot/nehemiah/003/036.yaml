base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: sw
  text: Ee Mungu wetu, sikia, kwa maana tumekuwa kitu cha kudharauliwa.[a] Warudishie dhihaka yao juu ya vichwa vyao wenyewe, na uwafanye kuwa nyara[b] katika nchi ya utekwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa maana halisi: “tumekuwa dharau”; pia yaweza kutafsiriwa, “tunadharauliwa.”'
    reason: lexical_alternative
  - marker: b
    text: Au “uwatoe kama nyara.”
    reason: lexical_alternative
  - marker: c
    text: Au “katika nchi fulani ya utekwa.” Kiebrania hakina kibainishi, hivyo usemi unaweza kueleweka kwa maana isiyo maalumu au kwa kurejelea nchi ya utekwa inayojulikana katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: sikia
  rationale: Ni amri ya moja kwa moja kwa Mungu. “Sikia” ni kawaida katika lugha ya sala na haiongezi yambwa lisilotajwa wazi.
- source_word: אֱלֹהֵינוּ
  choice: Ee Mungu wetu
  rationale: Kiambishi kinaonyesha “wetu,” na “Ee” huweka wazi mwito wa sala kwa Kiswahili cha asili bila kubadili maana.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya ombi na kuunganisha sentensi kwa mtindo wa sala ulio wazi.
- source_word: הָיִינוּ בוּזָה
  choice: tumekuwa kitu cha kudharauliwa
  rationale: Huhifadhi hali iliyotokea ya kitenzi timilifu pamoja na nomino “dharau,” badala ya kuifanya tu kuwa sifa ya hali ya sasa.
- source_word: וְהָשֵׁב
  choice: warudishie
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi; katika muktadha huu dhihaka inawarudia waliyoitoa.
- source_word: חֶרְפָּתָם
  choice: dhihaka yao
  rationale: “Dhihaka” huwasilisha fedheha, kejeli, au shutuma yenye kuaibisha inayokusudiwa na חֶרְפָּה.
- source_word: אֶל רֹאשָׁם
  choice: juu ya vichwa vyao wenyewe
  rationale: Huhifadhi taswira ya Kiebrania na wazo la malipo yanayowarudia wenyewe.
- source_word: וּתְנֵם
  choice: uwafanye kuwa
  rationale: Pamoja na לְבִזָּה, muundo huu huonyesha kuwatoa au kuwafanya wawe nyara kwa lugha ya kawaida ya Kiswahili.
- source_word: לְבִזָּה
  choice: nyara
  rationale: “Nyara” ni nomino ya kawaida kwa mali au watu wanaotekwa vitani na inafaa katika kauli ya kuwatoa wawe nyara.
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: katika nchi ya utekwa
  rationale: Hufuata kwa karibu “katika nchi ya utekwa,” huku ikiacha wazi kama ni nchi fulani au nchi yoyote ya hali hiyo.
theological_decisions:
- issue: Ombi la hukumu dhidi ya maadui
  choice: Kudumisha ombi la moja kwa moja la Mungu kuwarudishia dhihaka na kuwafanya nyara
  alternative: Kulainisha kuwa ombi la jumla la haki au kulichukulia kama sitiari tu
  rationale: Kiebrania kinaomba wazi hukumu ya kulipiza; tafsiri haipaswi kupunguza mvutano wa kitheolojia au nguvu ya sala hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka katika sala. Taswira ya “juu ya vichwa vyao” imehifadhiwa kwa sababu ni wazi kwa Kiswahili na hubeba wazo la malipo kuwarudia wenyewe.
