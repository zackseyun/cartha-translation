base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: sw
  text: Kando yake, Shalumu mwana wa Haloheshi, mkuu wa nusu ya wilaya ya Yerusalemu, alifanya matengenezo, yeye pamoja na binti zake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Kando yake
  rationale: Nahau hii katika Nehemia 3 inaonyesha sehemu iliyokuwa karibu na sehemu ya mfanyakazi aliyetajwa kabla; tafsiri hii ni ya kawaida na huhifadhi mpangilio wa maeneo ukutani.
- source_word: הֶחֱזִיק
  choice: alifanya matengenezo
  rationale: Katika muktadha wa sura hii, hifili ya חזק hueleza kushiriki katika kutengeneza upya ukuta; usemi huu unaeleza maana hiyo kwa Kiswahili cha kawaida bila kudokeza kuimarisha tu.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na mazoea ya Kiswahili.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: mwana wa Haloheshi
  rationale: Ni jina la baba, hivyo limetoholewa badala ya kutafsiriwa.
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: mkuu wa nusu ya wilaya ya Yerusalemu
  rationale: שַׂר ni mkuu au mtawala, na פֶּלֶךְ hapa ni kitengo cha kiutawala; “wilaya” huepuka kupanua kiwango chake kuwa jimbo.
- source_word: הוּא וּבְנֹתָיו
  choice: yeye pamoja na binti zake
  rationale: Huhifadhi msisitizo wa kiwakilishi na kutaja wazi kwamba binti zake pia walishiriki katika kazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mkuu” na “wilaya” ni istilahi zinazoeleweka kwa urahisi katika muktadha wa utawala; sentensi huhifadhi kutajwa kwa namna ya pekee kwa binti za Shalumu.
