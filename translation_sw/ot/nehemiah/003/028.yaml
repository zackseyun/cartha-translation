  yaml_path: translation/ot/nehemiah/003/028.yaml
  text: Above the Horse Gate[a], the priests made repairs, each one opposite his own house.
translation:
  language: sw
  text: Juu ya Lango la Farasi[a], makuhani walifanya matengenezo, kila mmoja mkabala na nyumba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lango la farasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל
  choice: Juu ya
  rationale: Kihusishi hiki kinaonyesha mahali palipo juu ya sehemu iliyotangulia katika orodha ya ujenzi.
- source_word: שַׁעַר הַסּוּסִים
  choice: Lango la Farasi
  rationale: Muundo huu wa Kiebrania unaweza kutumiwa kama jina la mahali; tafsiri hii ni ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: הֶחֱזִיקוּ
  choice: walifanya matengenezo
  rationale: Katika Nehemia 3, kitenzi hiki hutaja kazi ya kukarabati ukuta au malango, si kuimarisha tu.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino hii.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Nomino ya umoja ina maana ya mgawanyo hapa, ikimtaja kila kuhani mmoja mmoja.
- source_word: לְנֶגֶד
  choice: kuelekea
  rationale: Neno hili linaonyesha sehemu iliyo mbele ya kitu au inayokabiliana nacho; 'kuelekea' ni ya asili katika maelezo ya sehemu ya ukuta iliyokuwa upande wa nyumba.
- source_word: בֵּיתוֹ
  choice: nyumba yake mwenyewe
  rationale: 'Kiwakilishi cha umoja kinafuata maana ya mgawanyo ya אִישׁ: kila mmoja alifanya kazi kuelekea nyumba yake.'
