translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina “Hanuni” na “Zanoa” yamewasilishwa kwa maumbo yanayosomeka kwa urahisi. “Makomeo” na “mapingo” yametumiwa kutofautisha aina mbili za vifaa vya kufungia lango. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika maandishi makuu karibu na maneno yanayohusika.
