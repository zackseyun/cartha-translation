base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: sw
  text: Hanuni na wakazi wa Zanoa walilitengeneza Lango la Bondeni.[a] Wao walilijenga na wakaweka milango yake, makomeo yake na mapingo yake. Pia walitengeneza dhiraa elfu moja za ukuta,[b] hadi Lango la Takataka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliliimarisha” Lango la Bondeni; kitenzi cha Kiebrania kinaweza kumaanisha kuimarisha au kutengeneza, hasa katika muktadha huu wa kujenga upya.
    reason: lexical_alternative
  - marker: b
    text: Dhiraa elfu moja ni takriban mita 457.
    reason: cultural_note
  - marker: c
    text: Au “Lango la Mavi”; jina la Kiebrania linaweza kumaanisha lango lililohusishwa na kinyesi au takataka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: walilitengeneza
  rationale: Katika muktadha wa ujenzi upya wa Nehemia 3, kitenzi hiki huonyesha kuimarisha au kutengeneza sehemu iliyoharibika. “Walilitengeneza” ni Kiswahili cha kawaida kinachofaa muktadha huku tanbihi ikihifadhi maana ya kuimarisha.
- source_word: שַׁעַר הַגַּיְא
  choice: Lango la Bondeni
  rationale: Hili ni jina la lango lililoundwa kwa muundo wa nomino tegemezi. “Lango la Bondeni” linasikika kama jina la mahali katika Kiswahili na linaonyesha uhusiano wake na bonde.
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: wakazi wa Zanoa
  rationale: Umbo la kitenzi-partisipio linamaanisha watu waliokaa katika mji huo. “Wakazi wa Zanoa” ni tafsiri fupi, ya sasa na ya kawaida.
- source_word: הֵמָּה בָנוּהוּ
  choice: Wao walilijenga
  rationale: Kiebrania kinasisitiza kiwakilishi “wao” na kusema moja kwa moja kuwa walilijenga. Tafsiri inadumisha msisitizo huo bila kubadili kitenzi kuwa “kujenga upya,” ingawa huo ndio muktadha mpana.
- source_word: וַיַּעֲמִידוּ
  choice: kusimamisha
  rationale: Kitenzi kina maana ya kufanya kitu kisimame au kukiweka mahali pake. Kwa milango, “kusimamisha” ni tafsiri ya asili na iliyo karibu na Kiebrania.
- source_word: דַּלְתֹתָיו
  choice: milango yake
  rationale: Wingi huu unarejelea mabawa au vipande vya lango. “Milango yake” ni lugha wazi na ya kawaida.
- source_word: מַנְעֻלָיו
  choice: makomeo yake
  rationale: Katika ujenzi wa malango, neno hili hurejelea vifaa vya kufungia. “Makomeo” linafaa zaidi kwa lango la kale kuliko “kufuli,” ambalo linaweza kudokeza kifaa cha kisasa.
- source_word: בְרִיחָיו
  choice: mapingo yake
  rationale: Neno hili linamaanisha fito nzito zilizowekwa kuvuka lango ili kulifunga. “Mapingo” hutofautisha vifaa hivi na makomeo.
- source_word: אֶלֶף אַמָּה
  choice: dhiraa elfu moja
  rationale: Tafsiri inadumisha kipimo cha kale badala ya kukibadili katika maandishi; makadirio ya kisasa yanaelezwa katika tanbihi.
- source_word: בַּחוֹמָה
  choice: ukuta wenye urefu wa
  rationale: Kirai cha Kiebrania kinaonyesha sehemu au umbali katika ukuta. Kiswahili hiki kinaweka wazi kuwa dhiraa elfu moja ni urefu wa sehemu ya ukuta iliyotengenezwa, bila kudai upana au kimo.
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: Lango la Takataka
  rationale: Jina linaelekea kuhusiana na kinyesi au uchafu uliotupwa nje ya mji. “Takataka” ni neno la kawaida, lenye staha na pana linalofaa kama jina la lango; maana ya moja kwa moja zaidi imehifadhiwa katika tanbihi.
