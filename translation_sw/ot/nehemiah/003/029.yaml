base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: sw
  text: Baada yake, Sadoki mwana wa Imeri alifanya matengenezo mkabala na nyumba yake.[a] Na baada yake, Shemaya mwana wa Shekania, mlinzi wa Lango la Mashariki,[b] alifanya matengenezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya nyumba yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mtunzaji wa Lango la Mashariki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha ya Nehemia 3, msemo huu huonyesha mfuatano wa wafanyakazi au sehemu za ukuta; tafsiri hii ni ya asili na inahifadhi muundo wa Kiebrania.
- source_word: הֶחֱזִיק
  choice: alifanya matengenezo
  rationale: Ingawa maana ya msingi ni ‘alitia nguvu,’ katika muktadha huu kitenzi hiki kinamaanisha kufanya kazi ya kurekebisha ukuta au malango.
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: Sadoki mwana wa Imeri
  rationale: Majina yametoholewa kwa namna inayofaa Kiswahili, huku usemi wa ukoo ‘mwana wa’ ukihifadhiwa.
- source_word: נֶגֶד בֵּיתוֹ
  choice: mkabala na nyumba yake
  rationale: Nֶגֶד humaanisha ‘mbele ya’ au ‘mkabala na’; ‘mkabala na’ inaeleza kwa ufupi mahali pa kazi kuhusiana na nyumba yake.
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: Shemaya mwana wa Shekania
  rationale: Majina yametoholewa kwa matamshi yanayoeleweka katika Kiswahili, na uhusiano wa ukoo umehifadhiwa.
- source_word: שֹׁמֵר
  choice: mlinzi
  rationale: Kirai hiki cha Kiebrania kinaonyesha jukumu au cheo cha Shemaya; ‘mlinzi’ ni neno la kawaida na linalofaa kwa mtu mwenye wajibu katika lango.
- source_word: שַׁעַר הַמִּזְרָח
  choice: Lango la Mashariki
  rationale: Hili linaonekana kuwa jina maalumu la lango, hivyo herufi kubwa zimetumika na mwelekeo umeelezwa kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Alifanya matengenezo’ limetumiwa badala ya tafsiri sisisi ‘alitia nguvu’ ili kuwasilisha maana ya kazi ya kurekebisha katika sura hii. Alama zote za tanbihi zilizoorodheshwa zimewekwa katika maandishi.
