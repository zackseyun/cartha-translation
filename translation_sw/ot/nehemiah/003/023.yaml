source:
  edition: WLC
  text: אַחֲרָ֨י/ו הֶחֱזִ֧יק בִּנְיָמִ֛ן וְ/חַשּׁ֖וּב נֶ֣גֶד בֵּיתָ֑/ם אַחֲרָ֣י/ו הֶחֱזִ֗יק עֲזַרְיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן עֲנָֽנְיָ֖ה אֵ֥צֶל בֵּיתֽ/וֹס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: sw
  text: Baada yake, Benyamini na Hashubu walifanya matengenezo mbele ya nyumba yao. Baada yake, Azaria mwana wa Maaseya, mwana wa Anania, alifanya matengenezo kando ya nyumba yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha hii, kirai hiki kinaonyesha mfuatano wa sehemu za ukuta na wafanyakazi; tafsiri hii inadumisha muundo unaorudiwa wa Kiebrania.
- source_word: הֶחֱזִיק
  choice: alifanya/walifanya matengenezo
  rationale: Hifili ya חזק katika Nehemia 3 ni istilahi ya kazi ya kurekebisha ukuta; usemi huu ni wazi na wa kawaida kwa Kiswahili cha sasa kuliko tafsiri sisisi ya 'aliimarisha'.
- source_word: בִּנְיָמִן
  choice: Benyamini
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: חַשּׁוּב
  choice: Hashubu
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa kufuata matamshi na maumbo ya majina yanayoeleweka katika Kiswahili.
- source_word: נֶגֶד
  choice: mbele ya
  rationale: Katika muktadha huu wa mahali, neno linaonyesha eneo linalokabiliana na nyumba; 'mbele ya' ni la asili na halidokezi lazima kuwa upande wa pili wa njia.
- source_word: בֵּיתָם
  choice: nyumba yao
  rationale: Umoja wa nomino pamoja na kiambishi cha wingi umehifadhiwa, huenda ukimaanisha nyumba au kaya waliyoshiriki.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: בֶן מַעֲשֵׂיָה בֶּן עֲנָנְיָה
  choice: mwana wa Maaseya, mwana wa Anania
  rationale: Muundo wa nasaba wa Kiebrania umehifadhiwa bila kufupishwa au kufafanuliwa kupita kiasi.
- source_word: אֵצֶל
  choice: kando ya
  rationale: Neno linaonyesha ukaribu wa mahali; 'kando ya' ni la kawaida na linatofautisha mahali hapa na kirai cha mfuatano 'baada yake'.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: Tafsiri ya moja kwa moja inadumisha rejeo halisi la mahali katika orodha ya ukarabati.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi na marudio ya Kiebrania yamehifadhiwa pale yanapobeba mfuatano wa orodha. Tanbihi ya Kiingereza kuhusu 'Hashub' haijaingizwa kwa sababu ni tofauti ya utohoaji wa Kiingereza, si tofauti ya matini ya Kiebrania, na alama yake baada ya 'Maaseiah' haipatani na neno linalohusika.
