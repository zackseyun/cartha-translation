translation:
  language: sw
  text: Kando yake wanaume wa Yeriko walijenga, na kando yao[a] Zakuri mwana wa Imri alijenga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kando yake,” kama ilivyo katika kishazi cha kwanza; “kando yao” huonyesha wazi kuwa Zakuri alijenga karibu na kundi lililotangulia, yaani wanaume wa Yeriko.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Kando yake
  rationale: Nahau עַל יָד yenye kiambishi cha nafsi huonyesha ujirani katika mfululizo wa wajenzi; “kando yake” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya mahali.
- source_word: בָנוּ
  choice: walijenga
  rationale: Kitenzi בנה humaanisha “kujenga.” Ingawa muktadha mpana unahusu kuujenga upya ukuta, mstari huu wenyewe hautumii kitenzi chenye maana ya wazi ya urejeshaji.
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: watu wa Yeriko
  rationale: Muundo huu hutaja kundi linalohusishwa na Yeriko. “Watu wa Yeriko” ni usemi wa asili na unaoeleweka katika Kiswahili bila kudai kwamba walikuwa wakazi wa kudumu au walitoka huko wakati huo.
- source_word: וְעַל יָדוֹ
  choice: na kando yao
  rationale: Kiebrania kinasema kihalisi “kando yake” kwa kiambishi cha umoja, lakini katika mfululizo wa Kiswahili rejeo la kawaida ni kundi lililotangulia, yaani watu wa Yeriko. Tanbihi inalinda umbo halisi la chanzo.
- source_word: בָנָה
  choice: alijenga
  rationale: Qal timilifu ya בנה imetafsiriwa kwa kitenzi cha kawaida “alijenga,” sambamba na matumizi yake katika kishazi cha kwanza.
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: Zakuri mwana wa Imri
  rationale: Majina yametoholewa kwa namna inayofaa matamshi ya Kiswahili, na muundo wa nasaba בֶּן umehifadhiwa kwa “mwana wa.”
