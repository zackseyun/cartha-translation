base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: sw
  text: 'Baada yake, Walawi walifanya matengenezo: Rehumu mwana wa Bani.[a] Pembeni yake, Hashabia, mtawala wa nusu ya wilaya ya Keila, alifanya matengenezo kwa ajili ya wilaya yake.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kueleweka kuwa Walawi—Rehumu mwana wa Bani—walifanya matengenezo; umbo la sentensi halielezi wazi uhusiano kamili kati ya kundi hilo na Rehumu.
    reason: textual_ambiguity
  - marker: b
    text: Au “kwa ajili ya sehemu yake.” Kiebrania kinaweza kumaanisha wilaya iliyokuwa chini ya mamlaka ya Hashabia au sehemu ya ukuta aliyogawiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha ya ujenzi wa ukuta, kirai hiki huonyesha mfuatano na huenda pia ukaribu wa eneo la kazi; “Baada yake” ni Kiswahili cha kawaida kinachohifadhi mfuatano huo.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: walifanya matengenezo / alifanya matengenezo
  rationale: Hifili ya חזק katika Nehemia 3 ni usemi wa kufanya kazi ya kukarabati ukuta, si tu kuutia nguvu kwa maana pana.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila na huduma ya Lawi.
- source_word: רְחוּם בֶּן־בָּנִי
  choice: Rehumu mwana wa Bani
  rationale: Majina yamenukuliwa kwa mwandiko unaofaa Kiswahili, huku uhusiano wa ukoo wa בֶּן ukihifadhiwa.
- source_word: עַל יָדוֹ
  choice: Pembeni yake
  rationale: Ingawa maana halisi ni “mkono wake,” katika sura hii ni nahau inayoonyesha eneo la kazi lililopakana na la mtu aliyetangulia.
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Jina limenukuliwa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: mtawala wa nusu ya wilaya ya Keila
  rationale: שַׂר humaanisha mwenye mamlaka ya utawala, na פֶלֶךְ hapa ni eneo la kiutawala; muundo wa Kiebrania unaonyesha nusu ya wilaya inayohusishwa na Keila.
- source_word: לְפִלְכּוֹ
  choice: kwa ajili ya wilaya yake
  rationale: Kiambishi לְ kinaweza kuonyesha uwakilishi, wajibu, au eneo linalomhusu; tafsiri hii inahifadhi maana ya kiutawala bila kuamua kupita kiasi ikiwa ni wilaya au sehemu ya kazi.
