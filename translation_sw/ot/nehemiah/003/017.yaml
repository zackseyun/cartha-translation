translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walifanya matengenezo” ni usemi wa kawaida unaoeleza kazi ya ukuta; majina Rehumu, Hashabia, Bani na Keila yameandikwa kwa mtindo unaosomeka kwa wasemaji wa Kiswahili. Alama zote za tanbihi zimewekwa katika matini.
