  text: וְ/עַל יָדָ֤/ם הֶחֱזִיק֙ רְפָיָ֣ה בֶן ח֔וּר שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/009.yaml
  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
translation:
  language: sw
  text: Kando yao, Refaya mwana wa Huri, mtawala wa nusu ya wilaya ya Yerusalemu, alifanya matengenezo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliimarisha.” Kitenzi cha Kiebrania kihalisi humaanisha “alifanya kuwa imara,” lakini katika sura hii kinatumika kwa kazi ya kutengeneza ukuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: Kando yao
  rationale: Nahau hii katika Nehemia 3 huonyesha kikundi kinachofuata kilichofanya kazi katika sehemu iliyo karibu; “Kando yao” ni Kiswahili cha kawaida na huhifadhi mtiririko wa orodha.
- source_word: הֶחֱזִיק
  choice: alifanya matengenezo
  rationale: Ingawa kitenzi hiki kihalisi kina maana ya ‘alitia nguvu’ au ‘aliimarisha,’ katika muktadha wa Nehemia 3 kinatumika kinahau kwa kazi ya kutengeneza ukuta.
- source_word: רְפָיָה
  choice: Refaya
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בֶן־חוּר
  choice: mwana wa Huri
  rationale: Huu ni usemi wa kawaida wa nasaba unaomtambulisha Refaya kwa jina la baba yake.
- source_word: שַׂר
  choice: mtawala
  rationale: Neno hili humaanisha kiongozi au afisa mwenye mamlaka; “mtawala” linafaa katika muktadha huu wa utawala wa eneo.
- source_word: חֲצִי פֶּלֶךְ
  choice: nusu ya wilaya
  rationale: פֶּלֶךְ hapa ni eneo la kiutawala; “wilaya” ni neno la kawaida la Kiswahili kwa mgawanyo kama huo, na “nusu ya wilaya” huakisi muundo wa Kiebrania.
- source_word: יְרוּשָׁלִָם
  choice: ya Yerusalemu
  rationale: Jina la mahali limetolewa katika umbo lake la kawaida la Kiswahili, huku uhusiano wa eneo ukionyeshwa kwa “ya.”
