base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: sw
  text: Malkiya mwana wa Rekabu, mkuu wa wilaya ya Beth-Hakeremu, alilitengeneza Lango la Takataka.[a] Yeye alilijenga na kuweka milango yake, makomeo yake na mapingo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lango la Samadi.” Jina la Kiebrania hurejelea takataka au samadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: alilitengeneza
  rationale: Katika orodha ya ujenzi ya Nehemia 3, kitenzi hiki humaanisha kuchukua jukumu la kukarabati au kutengeneza sehemu fulani; “alilitengeneza” ni Kiswahili cha kawaida kinachofaa muktadha.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: Lango la Samadi
  rationale: אַשְׁפּוֹת hurejelea samadi au takataka. “Lango la Samadi” huhifadhi maana halisi ya jina la lango, huku tanbihi ikitaja tafsiri nyingine inayowezekana.
- source_word: שַׂר פֶּלֶךְ
  choice: mkuu wa wilaya
  rationale: שַׂר ni kiongozi au mkuu, na פֶּלֶךְ ni eneo la kiutawala; “mkuu wa wilaya” ni usemi wa asili na unaoeleweka katika Kiswahili.
- source_word: בֵּית הַכָּרֶם
  choice: Beth-Hakeremu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa, kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: הוּא יִבְנֶנּוּ
  choice: Yeye alilijenga
  rationale: Kitenzi בנה kimetafsiriwa moja kwa moja kuwa “alilijenga” bila kuongeza dhana ya ‘tena’; “Yeye” inahifadhi msisitizo wa kiwakilishi הוּא.
- source_word: וְיַעֲמִיד
  choice: na kuweka
  rationale: Hifili ya עמד hapa ina maana ya kuweka au kusimamisha vifaa vya lango mahali pake; “kuweka” ni ya kawaida na wazi.
- source_word: דַּלְתֹתָיו
  choice: milango yake
  rationale: Wingi huu unarejelea milango au mabawa ya lango; “milango yake” ni wazi kwa msomaji wa kawaida.
- source_word: מַנְעֻלָיו
  choice: makomeo yake
  rationale: Neno hili hurejelea vifaa vya kufungia; “makomeo” linafaa kwa vifaa vya kufungia lango na linatofautiana na mapingo.
- source_word: וּבְרִיחָיו
  choice: mapingo yake
  rationale: בְּרִיחַ ni upau wa kuzuia au kufungia mlango; “mapingo” ni neno la kawaida la Kiswahili katika muktadha huu.
