    rationale: Hii yaweza kudokeza kutokuwa na uhakika wa kile kinachorejelewa. Ni bora kueleza kuwa neno hilo hurejelea takataka au samadi, na kutaja “Samadi” kama tafsiri mbadala ya jina la lango.
