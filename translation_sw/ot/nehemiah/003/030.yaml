base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: sw
  text: Baada yake[a], Hanania mwana wa Shelemia, na Hanuni, mwana wa sita wa Salafu, walifanya matengenezo katika sehemu nyingine[b]. Baada yake, Meshulamu mwana wa Berekia alifanya matengenezo mkabala na chumba chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, umbo la kwanza la Kiebrania linaweza kusomeka “baada yangu”; hata hivyo, muktadha na usemi unaorudiwa katika sura hii unaunga mkono “baada yake.”
    reason: textual_variant
  - marker: b
    text: Kihalisi, “kipimo cha pili”; katika Nehemia 3 usemi huu humaanisha sehemu nyingine iliyotengewa kufanyiwa matengenezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha ya wajenzi wa ukuta, huu ni usemi unaorudiwa unaoonyesha mfuatano au eneo linalofuata. Ingawa umbo la kwanza katika mapokeo ya maandishi linaweza kusomeka kihalisi ‘baada yangu,’ muktadha unaunga mkono ‘baada yake’; utata huo umeelezwa katika tanbihi.
- source_word: הֶחֱזִיק
  choice: alitengeneza / walitengeneza
  rationale: Katika Nehemia 3 kitenzi hiki humaanisha kufanya kazi ya kurekebisha au kujenga upya ukuta; ‘kutengeneza’ ni Kiswahili cha kawaida na kinachofaa katika muktadha huu.
- source_word: הַשִּׁשִּׁי
  choice: mwana wa sita
  rationale: Neno la kupanga ‘wa sita’ linaeleweka kwa kawaida kuwa linamtambulisha Hanuni kama mwana wa sita wa Salafu; ‘mwana’ imeongezwa ili sentensi iwe wazi katika Kiswahili.
- source_word: מִדָּה שֵׁנִי
  choice: sehemu nyingine
  rationale: Kihalisi ni ‘kipimo/sehemu ya pili,’ lakini katika sura hii usemi huo hurejelea kipande kingine cha ukuta kilichotengewa kazi ya matengenezo.
- source_word: נֶגֶד
  choice: mkabala na
  rationale: Huonyesha mahali palipo mbele ya au panapokabiliana moja kwa moja na kitu kingine.
- source_word: נִשְׁכָּתוֹ
  choice: chumba chake
  rationale: Nomino hii hurejelea chumba, mara nyingi katika jengo la makazi au la kazi; ‘chumba’ ni neno la kawaida lisilobainisha matumizi yake kupita ushahidi wa maandishi.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: Hanania / Shelemia / Hanuni / Salafu / Meshulamu / Berekia
  rationale: Majina yamenukuliwa kwa maumbo yaliyozoeleka na yanayosomeka kwa urahisi katika Kiswahili.
