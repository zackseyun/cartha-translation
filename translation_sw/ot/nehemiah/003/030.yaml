  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Muundo unaorudiwa ‘Baada yake’ umehifadhiwa ili kuonyesha mfuatano wa orodha. Kiima cha pamoja Hanania na Hanuni kimetafsiriwa kwa wingi ‘walitengeneza.’
