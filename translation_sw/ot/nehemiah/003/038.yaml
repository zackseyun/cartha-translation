  yaml_path: translation/ot/nehemiah/003/038.yaml
  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: sw
  text: Basi tukajenga ukuta, na ukuta wote ukaunganishwa mpaka nusu ya kimo chake, kwa maana watu walikuwa na moyo wa kufanya kazi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “watu walikuwa na moyo wa kufanya.” Usemi huo unamaanisha kwamba walikuwa wameazimia kwa ndani na walikuwa tayari kufanya kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: Basi tukaujenga upya
  rationale: Kitenzi cha Qal wayyiqtol katika nafsi ya kwanza wingi kinaendeleza simulizi. ‘Kujenga upya’ kinafaa katika muktadha wa kurekebisha ukuta wa Yerusalemu uliokuwapo, na ‘Basi’ linaonyesha mwendelezo wenye matokeo.
- source_word: הַחוֹמָה
  choice: ukuta
  rationale: Neno חוֹמָה hapa linamaanisha ukuta wa mji unaojulikana katika muktadha.
- source_word: וַתִּקָּשֵׁר
  choice: ukaunganishwa
  rationale: Niphal ya קשר inaonyesha kuwa sehemu za ukuta ziliunganishwa na kuwa kitu kimoja; umbo la kutendwa linahifadhi nguvu ya Kiebrania.
- source_word: כָּל הַחוֹמָה
  choice: ukuta wote
  rationale: כָּל pamoja na nomino yenye kibainishi huonyesha ukamilifu; ‘ukuta wote’ ni Kiswahili cha kawaida na wazi.
- source_word: עַד חֶצְיָהּ
  choice: hadi kufikia nusu ya kimo chake
  rationale: Kiebrania ni ‘hadi nusu yake.’ Katika muktadha wa ujenzi, nusu inaeleweka kuwa nusu ya kimo cha ukuta; ufafanuzi huu mdogo huepusha utata usio wa lazima.
- source_word: וַיְהִי לֵב לָעָם
  choice: kwa maana watu walikuwa na moyo
  rationale: Nahau ya Kiebrania, kihalisi ‘watu walikuwa na moyo,’ huonyesha azimio na utayari wa ndani. ‘Kwa maana’ huwasilisha uhusiano wa sababu na maendeleo ya ujenzi huku sitiari ya moyo ikihifadhiwa.
- source_word: לַעֲשׂוֹת
  choice: wa kufanya kazi
  rationale: Ingawa עשה kwa msingi ni ‘kufanya,’ muktadha wa ujenzi unaonyesha kufanya kazi iliyokuwa mbele yao.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa Maandiko. Nahau ya ‘moyo’ imehifadhiwa, huku tanbihi ikieleza maana yake. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
