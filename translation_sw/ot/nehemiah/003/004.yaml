base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: sw
  text: Na kando yao, Meremothi mwana wa Uria, mwana wa Hakosi, alifanya matengenezo[a]. Na kando yao, Meshulamu mwana wa Berekia, mwana wa Meshezabeli, alifanya matengenezo. Na kando yao, Sadoki mwana wa Baana alifanya matengenezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikarabati,” au kwa maana ya karibu zaidi, “aliimarisha.” Katika sura hii, kitenzi cha Kiebrania hutumiwa mara kwa mara kumaanisha kufanya kazi ya kukarabati sehemu ya ukuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Na kando yao
  rationale: Kirai hiki cha Kiebrania, kwa maana halisi ‘na karibu na mkono wao,’ ni nahau inayoonyesha sehemu inayopakana na sehemu ya watu waliotangulia; ‘kando yao’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya mahali.
- source_word: הֶחֱזִיק
  choice: alifanya matengenezo
  rationale: Katika orodha ya Nehemia 3, kitenzi hiki kinatumika kama kauli ya kawaida kuhusu kuimarisha au kukarabati sehemu ya ukuta. ‘Alifanya matengenezo’ kinaeleza kazi hiyo kwa kawaida bila kuongeza kitu kisichotajwa wazi katika mstari.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika taarifa hizi za nasaba, maana ya moja kwa moja ya uhusiano wa baba na mwana ndiyo inayofaa zaidi.
- source_word: מְרֵמוֹת
  choice: Meremothi
  rationale: Jina limetoholewa kwa tahajia inayoweza kutamkwa kwa kawaida katika Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: אוּרִיָּה
  choice: Uria
  rationale: Umbo la jina linalotumika kwa kawaida katika Kiswahili.
- source_word: הַקּוֹץ
  choice: Hakosi
  rationale: Jina limetoholewa kutoka Kiebrania, huku kiambishi ha- kilicho katika umbo lililoandikwa kikihifadhiwa.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Jina limetoholewa kwa matamshi ya kawaida ya Kiswahili.
- source_word: בֶּרֶכְיָה
  choice: Berekia
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili na kubaki karibu na Kiebrania.
- source_word: מְשֵׁיזַבְאֵל
  choice: Meshezabeli
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili huku sehemu zake kuu za Kiebrania zikihifadhiwa.
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina limetoholewa kwa namna inayoeleweka na kutamkika kwa kawaida katika Kiswahili.
- source_word: בַּעֲנָא
  choice: Baana
  rationale: Tahajia hii inafuata kwa karibu umbo la Kiebrania na inatamkika kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wazi na wa kisasa. Marudio ya ‘kando yao’ na ‘alifanya matengenezo’ yamehifadhiwa kwa sababu yanaakisi muundo wa kimakusudi wa orodha ya Kiebrania. Majina yametoholewa ili yatamkike kwa kawaida katika Kiswahili bila kutafsiri maana zake.
