base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: sw
  text: Baada yake, Meremothu mwana wa Uria, mwana wa Hakozi, alifanya matengenezo ya sehemu nyingine[a], kuanzia mlango wa nyumba ya Eliashibu mpaka mwisho wa nyumba ya Eliashibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya pili.” Kirai cha Kiebrania kinaweza kumaanisha sehemu nyingine aliyokabidhiwa Meremothu au, kwa tafsiri ya moja kwa moja zaidi, “kipimo cha pili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Katika orodha ya kazi za Nehemia 3, kirai hiki kinaonyesha mfuatano wa sehemu zilizofanyiwa kazi; tafsiri hii inadumisha mfuatano huo bila kuufanya kuwa ujirani wa mahali pekee.
- source_word: הֶחֱזִיק
  choice: alitengeneza
  rationale: Ingawa kitenzi kimsingi huhusiana na kutia nguvu, katika muktadha wa Nehemia 3 kinamaanisha kufanya kazi ya ukarabati; ‘alitengeneza’ ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: Meremothi mwana wa Uria, mwana wa Hakosi
  rationale: Majina yamenukuliwa kwa tahajia inayofaa Kiswahili, na mlolongo wa nasaba umehifadhiwa kwa utambulisho wazi.
- source_word: מִדָּה שֵׁנִית
  choice: sehemu nyingine
  rationale: Kirai kinaweza kumaanisha sehemu ya nyongeza aliyokabidhiwa Meremothi, ambaye ametajwa pia katika mstari wa 4; tafsiri hii ni ya kawaida huku tanbihi ikihifadhi uwezekano wa maana halisi zaidi ya ‘sehemu ya pili.’
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: kuanzia mlango wa nyumba ya Eliashibu
  rationale: פֶּתַח humaanisha uwazi, lango, au mlango wa kuingilia. ‘Mlango’ ni wa kawaida na unafaa maelezo ya jengo.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: mpaka mwisho wa nyumba ya Eliashibu
  rationale: תַּכְלִית hapa inaonyesha ukomo au ncha ya mahali, si ukamilishaji wa jambo; ‘mwisho’ hudumisha maana hiyo ya kijiografia.
