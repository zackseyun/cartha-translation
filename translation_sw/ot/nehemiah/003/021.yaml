translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imedumisha muundo wa orodha ya ujenzi, huku ‘sehemu nyingine’ ikitoa usemi wa kawaida na tanbihi ikihifadhi utata wa מִדָּה שֵׁנִית.
