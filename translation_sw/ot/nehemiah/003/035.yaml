base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: sw
  text: Naye Tobia Mwamoni alikuwa kando yake, akasema, “Hata kile wanachojenga—mbweha akipanda juu yake, atauvunja ukuta wao wa mawe!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataubomoa” au “atautoboa ukuta wao wa mawe.” Kitenzi cha Kiebrania kinaweza kumaanisha kuvunja, kubomoa, au kutoboa; maneno haya ni sehemu ya dhihaka ya Tobia kuhusu udhaifu wa ukuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: alikuwa kando yake
  rationale: Kirai hiki huonyesha ukaribu wa mahali; ‘alikuwa kando yake’ ni Kiswahili cha kawaida na hudokeza kwamba Tobia alikuwa pamoja na Sanbalati.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: Hata huo wanaoujenga
  rationale: גַּם hapa huongeza mkazo wa dhihaka. Kiwakilishi ‘huo’ kinarejelea ukuta unaojengwa na kufanya sentensi iwe ya asili kwa Kiswahili.
- source_word: אִם יַעֲלֶה שׁוּעָל
  choice: mbweha akipanda juu yake
  rationale: אִם huanzisha sharti, ambalo Kiswahili hulieleza kwa umbo la ‘aki-’. שׁוּעָל kwa kawaida ni ‘mbweha’; ‘juu yake’ huweka wazi rejeo linalodokezwa katika Kiebrania.
- source_word: וּפָרַץ
  choice: ataubomoa
  rationale: פרץ inaweza kumaanisha kutoboa, kuvunja, au kubomoa ngome. Katika dhihaka hii ‘ataubomoa’ hutoa kwa kawaida wazo la ukuta dhaifu unaoweza kuvunjwa na mnyama mdogo.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: ukuta wao wa mawe
  rationale: Hili linawakilisha kwa uwazi muundo wa Kiebrania ‘ukuta wa mawe yao’ kwa Kiswahili cha kawaida.
