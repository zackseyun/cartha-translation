base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: sw
  text: Baada yake, Malkiya mwana wa mfua dhahabu alikarabati mpaka kwenye nyumba ya watumishi wa Hekalu na wafanyabiashara, mkabala na Lango la Ukaguzi, na mpaka kwenye chumba cha juu kilichoko kwenye pembe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּרְפִי
  choice: mfua dhahabu
  rationale: Neno hili humaanisha fundi anayesafisha au kutengeneza kwa madini ya thamani; katika muktadha huu tafsiri ya jadi na inayoeleweka ni “mfua dhahabu.”
- source_word: הַנְּתִינִים
  choice: watumishi wa Hekalu
  rationale: Hili ni jina la kundi la watumishi waliopewa kazi za huduma ya Hekalu; tafsiri ya kiutendaji inaeleweka zaidi kuliko kunukuu jina la Kiebrania.
- source_word: הָרֹכְלִים
  choice: wafanyabiashara
  rationale: Neno linaashiria wachuuzi au wafanyabiashara; neno pana “wafanyabiashara” linafaa katika muktadha.
- source_word: שַׁעַר הַמִּפְקָד
  choice: Lango la Ukaguzi
  rationale: מִפְקָד inaweza kuhusisha ukaguzi, kuhesabu, au kukusanya; “Ukaguzi” huhifadhi maana inayowezekana huku ikifanya kazi kama jina la lango.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: chumba cha juu kilichokuwa pembeni
  rationale: עֲלִיָּה ni chumba au sehemu ya juu, na הַפִּנָּה ni pembe; muundo huu wa Kiswahili ni wa kawaida na huepuka kauli ngumu ya moja kwa moja “chumba cha juu cha pembe.”
theological_decisions: []
