base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: sw
  text: Kando yake, Uzieli mwana wa Harhaya, mmoja wa mafundi wa dhahabu, alifanya matengenezo; na kando yake, Hanania mwana wa watengenezaji wa manukato, alifanya matengenezo. Nao wakaikarabati[a] Yerusalemu mpaka Ukuta Mpana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliiacha Yerusalemu mpaka Ukuta Mpana.” Kwa kawaida kitenzi cha Kiebrania humaanisha “kuacha,” lakini katika muktadha huu wa kujenga upya hueleweka pia kuwa “kukarabati” au “kurudisha katika hali nzuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: Kando yake
  rationale: Nahau hii katika Nehemia 3 inaonyesha nafasi inayofuata katika mfululizo wa kazi za ukutani; “Kando yake” ni Kiswahili cha kawaida kinachohifadhi maana ya ukaribu.
- source_word: הֶחֱזִיק
  choice: alifanya matengenezo
  rationale: Katika sura hii kitenzi hiki kinatumika kwa kushiriki katika kuimarisha au kutengeneza ukuta; usemi huu unaeleweka kwa urahisi katika muktadha wa ujenzi.
- source_word: צֹרְפִים
  choice: mmoja wa mafundi wa dhahabu
  rationale: Wingi wa Kiebrania unaonyesha kundi la ufundi ambalo Uzieli alikuwa mshiriki wake; tafsiri hii inaweka wazi kazi yake bila kutumia istilahi isiyozoeleka.
- source_word: הָרַקָּחִים
  choice: mmoja wa watengenezaji wa manukato
  rationale: Neno linawahusu watengenezaji wa manukato au marhamu; tafsiri hii ni ya sasa na inaepuka neno linaloweza kudokeza taaluma ya kisasa ya famasia.
- source_word: וַיַּעַזְבוּ
  choice: Nao waliiacha
  rationale: Maana ya kawaida ya mzizi ni “kuacha.” Kwa kuwa ushahidi wa kileksika hapa hauna uhakika na muktadha unaweza kupendekeza ukarabati, maana ya msingi imehifadhiwa katika matini na uwezekano wa kimuktadha umeelezwa katika tanbihi.
- source_word: יְרוּשָׁלַםִ
  choice: Yerusalemu
  rationale: Matini inataja mji wenyewe; haiongezi neno “ukuta,” ingawa huenda jina la mji linawakilisha ngome zake.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: mpaka kwenye Ukuta Mpana
  rationale: Inaelekea kuwa jina la sehemu maalumu ya ngome za Yerusalemu; herufi kubwa zinaonyesha jina hilo huku maana ya kivumishi cha Kiebrania ikihifadhiwa.
