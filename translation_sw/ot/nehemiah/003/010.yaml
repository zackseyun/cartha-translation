  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַל יָדָ֧/ם הֶחֱזִ֛יק יְדָיָ֥ה בֶן חֲרוּמַ֖ף וְ/נֶ֣גֶד בֵּית֑/וֹ וְ/עַל יָד֣/וֹ הֶחֱזִ֔יק חַטּ֖וּשׁ בֶּן חֲשַׁבְנְיָֽה־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/010.yaml
  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: sw
  text: Kando yao, Yedaya mwana wa Harumafu alifanya matengenezo mkabala na nyumba yake[a], na kando yake, Hatushi mwana wa Hashabneya alifanya matengenezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya nyumba yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Kando yao
  rationale: Nahau עַל יָד pamoja na kiambishi cha nafsi huonyesha ukaribu wa mahali katika orodha ya kazi za Nehemia 3; “kando yao” ni Kiswahili cha kawaida kinachodumisha mpangilio wa maeneo.
- source_word: הֶחֱזִיק
  choice: alifanya matengenezo
  rationale: Katika Nehemia 3, Hiphil ya חזק hutumiwa kama usemi wa kazi ya kujenga upya au kukarabati ukuta; “alifanya matengenezo” huwasilisha maana hiyo kwa uwazi.
- source_word: יְדָיָה
  choice: Yedaya
  rationale: Jina limenakiliwa kwa tahajia ya Kiswahili inayokaribia umbo la Kiebrania.
- source_word: בֶן חֲרוּמַף
  choice: mwana wa Harumafu
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja, na jina limenakiliwa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: mkabala na nyumba yake
  rationale: נֶגֶד huonyesha eneo lililo mbele ya au linalokabiliana na kitu; “mkabala na” huhifadhi uhusiano huu wa kimahali bila kuufanya uwe mahususi kupita chanzo.
- source_word: וְעַל יָדוֹ
  choice: na kando yake
  rationale: Nahau ileile ya ukaribu imedumishwa, sasa ikiwa na kiambishi cha umoja kinachomrejelea Yedaya.
- source_word: חַטּוּשׁ
  choice: Hatushi
  rationale: Jina limenakiliwa kwa tahajia ya Kiswahili inayokaribia matamshi ya Kiebrania.
- source_word: בֶן חֲשַׁבְנְיָה
  choice: mwana wa Hashabneya
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja, huku jina likinakiliwa kwa namna inayoakisi Kiebrania na kusomeka kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kawaida. Marudio ya “alifanya matengenezo” na muundo wa “kando” yamedumishwa ili kuhifadhi mtiririko wa orodha ya ujenzi.
