  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: sw
  text: Wala usifunike hatia yao[a], wala dhambi yao isifutwe mbele zako; kwa maana wamechochea hasira mbele ya wajenzi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usiwasamehe uovu wao.” Taswira halisi ya Kiebrania ni “usifunike hatia yao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana wamekukasirisha mbele ya wajenzi.” Kiebrania hakimtaji wazi aliyekasirishwa; maneno hayo yanaonyesha kwamba walichochea hasira hadharani mbele ya waliokuwa wakijenga.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: usifunike hatia yao
  rationale: Kitenzi כסה pamoja na עַל kina taswira ya kufunika, na katika muktadha huu kinaweza kumaanisha kutosamehe au kutopuuzia kosa. “Usifunike hatia yao” huhifadhi taswira hiyo ya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: עֲוֺנָם
  choice: hatia yao
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu inayotokana na hatia. “Hatia” hapa hutofautisha neno hili na “dhambi” katika mstari unaofuata huku ikihifadhi uzito wake wa kimaadili.
- source_word: חַטָּאתָם
  choice: dhambi yao
  rationale: חַטָּאת kwa kawaida humaanisha dhambi; tafsiri hii ya moja kwa moja inafaa katika ulinganifu wa kishairi.
- source_word: מִלְּפָנֶיךָ
  choice: mbele zako
  rationale: Kirai hiki hudokeza uso au uwepo wa Mungu. “Mbele zako” ni Kiswahili cha kawaida kinachohifadhi taswira ya mahali na uhusiano.
- source_word: תִּמָּחֶה
  choice: isifutwe
  rationale: מחה humaanisha kufuta au kuondoa kabisa, hasa katika mazingira ya kumbukumbu au maandishi. “Isifutwe” huwasilisha kwa ufupi ombi la dhambi kutoondolewa mbele za Mungu.
- source_word: הִכְעִיסוּ
  choice: wamechochea hasira
  rationale: Hifili ya כעס humaanisha kusababisha au kuchochea hasira. Kiebrania hakitaji wazi mwenye kukasirishwa, hivyo usemi huu hauongezi yambwa lisilotajwa.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: mbele ya wajenzi
  rationale: לְנֶגֶד kwa kawaida humaanisha mbele ya au katika uwepo wa. “Mbele ya wajenzi” ni fupi, ya moja kwa moja, na inafaa kwa muktadha wa dhihaka ya hadharani.
theological_decisions:
- issue: Lugha ya sala ya kuomba adhabu kuhusu dhambi ya maadui
  choice: Ombi la moja kwa moja kwamba Mungu asifunike hatia yao wala kufuta dhambi yao limehifadhiwa bila kulainishwa.
  alternative: Kutafsiri kwa upole zaidi, kama “usipuuze makosa yao.”
  rationale: Kiebrania kina ombi kali la wazi. Kuhifadhi ukali wake kunadumisha mvutano wa kitheolojia wa matini bila kuingiza msimamo wa kimadhehebu.
- issue: Yambwa lisilotajwa la הִכְעִיסוּ
  choice: “Wamechochea hasira” bila kutaja wazi aliyekasirishwa.
  alternative: “Wamekukasirisha” au “wamekuchochea ukasirike.”
  rationale: Muktadha unaweza kuelekeza hasira kwa Mungu, lakini Kiebrania hakitaji yambwa wazi. Tafsiri kuu inalinda utata huo, huku tanbihi ikieleza uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wala” linaendeleza sala, “mbele zako” huhifadhi taswira ya Kiebrania, na muundo wa sentensi unabaki mkali na wa moja kwa moja kama chanzo.
