  text: וְ/עַל יָדָ֨/ם הֶחֱזִ֜יק מְלַטְיָ֣ה הַ/גִּבְעֹנִ֗י וְ/יָדוֹן֙ הַ/מֵּרֹ֣נֹתִ֔י אַנְשֵׁ֥י גִבְע֖וֹן וְ/הַ/מִּצְפָּ֑ה לְ/כִסֵּ֕א פַּחַ֖ת עֵ֥בֶר הַ/נָּהָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: sw
  text: Pembeni yao, Melatia Mgibeoni na Yadoni Mmeronothi walifanya matengenezo, pamoja na watu wa Gibeoni na Mispa, kwa kiti cha gavana wa Ng’ambo ya Mto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kwa kiti cha gavana wa Ng’ambo ya Mto.” Usemi huo unaweza kurejelea kiti au makao rasmi ya gavana, au, ingawa inaelekea si hivyo, mamlaka yake ya kiutawala katika eneo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Pembeni yao
  rationale: Nahau hii katika orodha ya ujenzi ya Nehemia 3 inaonyesha ukaribu wa sehemu za kazi; “Pembeni yao” ni ya asili na inadumisha maana hiyo ya mahali.
- source_word: הֶחֱזִיק
  choice: walifanya matengenezo
  rationale: Katika muktadha huu kitenzi hiki kinamaanisha kushiriki katika kukarabati au kujenga upya ukuta; usemi huu ni wazi katika Kiswahili cha sasa.
- source_word: מְלַטְיָה הַגִּבְעֹנִי
  choice: Melatia Mgibeoni
  rationale: Jina limetoholewa, na jina la utambulisho wa mahali limetafsiriwa kwa umbo la kawaida la Kiswahili.
- source_word: וְיָדוֹן הַמֵּרֹנֹתִי
  choice: na Yadoni Mmeronothi
  rationale: Jina limetoholewa, huku kivumishi cha asili ya mahali kikihifadhiwa kama jina la utambulisho.
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: pamoja na watu wa Gibeoni na Mispa
  rationale: אַנְשֵׁי inaweza kumaanisha watu au wanaume wa maeneo hayo; “watu” hapa ni ya kawaida na haiingizi msisitizo wa kijinsia usio wa lazima, na “pamoja na” huonyesha ushiriki wao katika kazi.
- source_word: לְכִסֵּא
  choice: kwa ajili ya makao ya
  rationale: כִּסֵּא kwa msingi ni “kiti” au “kiti cha enzi,” lakini katika muktadha wa utawala inaweza kutaja makao rasmi ya gavana. Kiambishi לְ־ hakilazimishi maana ya mpaka wa mahali, kwa hiyo “kwa ajili ya” huepuka kuongeza “hadi” isiyo wazi katika Kiebrania.
- source_word: פַּחַת
  choice: gavana wa
  rationale: Hili ni cheo cha kiutawala cha kipindi cha Uajemi; “gavana” ndilo neno la Kiswahili linaloeleweka zaidi.
- source_word: עֵבֶר הַנָּהָר
  choice: Ng’ambo ya Mto
  rationale: Hili ni jina rasmi la eneo la utawala wa Uajemi lililokuwa magharibi mwa Eufrate; herufi kubwa zinaonyesha matumizi yake kama jina la eneo.
