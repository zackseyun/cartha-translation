base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: sw
  text: Kulikuwa na wengine waliosema, “Tunaweka mashamba yetu, mashamba yetu ya mizabibu, na nyumba zetu rehani[a] ili tupate nafaka wakati wa njaa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tunatoa mashamba yetu, mashamba yetu ya mizabibu, na nyumba zetu kuwa dhamana.” Kitenzi cha Kiebrania kinamaanisha kutoa mali kuwa dhamana ya deni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Kisha kulikuwa na wengine waliosema
  rationale: Nahau hii inaleta kundi jingine katika mfululizo wa malalamiko. ‘Kulikuwa na wengine waliosema’ ni Kiswahili cha kawaida kinachohifadhi kazi hiyo ya kimuktadha; ‘Kisha’ huunganisha kauli hii na simulizi linalotangulia.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: mashamba yetu, mashamba yetu ya mizabibu, na nyumba zetu
  rationale: Maneno haya yanataja mali kwa namna halisi. Kurudia ‘mashamba yetu’ katika ‘mashamba yetu ya mizabibu’ kunafanya maana ya כרמים ieleweke wazi kwa wasomaji wa kawaida.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: Tunaweka rehani
  rationale: Katika muktadha huu, kitenzi ערב kinamaanisha kutoa mali iwe dhamana ya deni. ‘Kuweka rehani’ ni usemi wa sasa na wa kawaida wa Kiswahili unaowasilisha wazi tendo hilo la kiuchumi.
- source_word: וְנִקְחָה
  choice: ili tupate
  rationale: Umbo hili linaonyesha kusudi la kuweka mali rehani. ‘Ili tupate’ ni la asili katika Kiswahili na haliongezi wazo lisilotajwa wazi kwamba nafaka ilinunuliwa.
- source_word: דָגָן
  choice: nafaka
  rationale: דָגָן humaanisha mazao ya nafaka kwa ujumla; ‘nafaka’ ni neno sahihi na linaloeleweka katika Kiswahili sanifu.
- source_word: בָּרָעָב
  choice: wakati wa njaa
  rationale: Kirai hiki kinaonyesha mazingira ya upatikanaji wa nafaka. ‘Wakati wa njaa’ huhifadhi maana hiyo bila kulazimisha uhusiano mahsusi zaidi wa kisababishi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kuweka rehani’ limetumiwa badala ya maelezo marefu ya kisheria kwa sababu linaeleza kwa usahihi mali inayotolewa kuwa dhamana ya deni.
