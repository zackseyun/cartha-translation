base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: sw
  text: Lakini watawala waliokuwa kabla yangu waliwatwika watu mizigo mizito, wakachukua kutoka kwao mkate na divai, zaidi ya shekeli arobaini za fedha.[a] Hata watumishi wao waliwatawala watu.[b] Lakini mimi sikufanya hivyo kwa sababu ya kumcha Mungu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na shekeli arobaini za fedha.” Kifungu cha Kiebrania huenda kinaonyesha kwamba mkate na divai vilichukuliwa juu ya ushuru huo wa fedha.
    reason: lexical_alternative
  - marker: b
    text: Au, “wasaidizi wao” au “vijana wao.” Neno la Kiebrania linaweza kumaanisha watu wa chini waliokuwa katika huduma ya watawala.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa sababu ya hofu ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת
  choice: watawala
  rationale: Katika utawala wa Uajemi, neno hili humaanisha magavana au watawala wa majimbo; “watawala” ni la kawaida na linafaa katika Kiswahili cha kisasa.
- source_word: הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: waliotangulia kabla yangu
  rationale: Huwatambulisha waliokuwa na wadhifa huo kabla ya Nehemia, huku likihifadhi wazo la chanzo.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: waliwatwika watu mizigo mizito
  rationale: Huhifadhi sitiari ya Kiebrania ya kufanya mzigo uwe mzito na kuonyesha madai yaliyowaelemea watu.
- source_word: וַיִּקְחוּ מֵהֶם
  choice: wakachukua kutoka kwao
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kawaida “kuchukua,” bila kuongeza kwa lazima maana ya kutoza.
- source_word: בְּלֶחֶם וָיַיִן
  choice: mkate na divai
  rationale: Huhifadhi vitu viwili vilivyotajwa wazi katika Kiebrania badala ya kufanya “mkate” kuwa chakula kwa ujumla.
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: pamoja na shekeli arobaini za fedha
  rationale: Katika muktadha huu, kifungu kinaeleweka zaidi kuwa nyongeza ya ushuru wa fedha; tanbihi inadumisha sintofahamu ya muundo wa Kiebrania.
- source_word: נַעֲרֵיהֶם
  choice: watumishi wao
  rationale: Ingawa neno linaweza kumaanisha vijana, katika mazingira ya kiutawala linaweza kutaja wasaidizi au maafisa wa chini.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: waliwatawala watu
  rationale: Hutoa maana ya kutumia mamlaka juu ya watu bila kuongeza kwa lazima hukumu kali zaidi kama “waliwaonea.”
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: Lakini mimi sikufanya hivyo
  rationale: Ni tofauti ya moja kwa moja kati ya mwenendo wa Nehemia na ule wa watawala waliomtangulia.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: kwa sababu ya kumcha Mungu
  rationale: Ni Kiswahili cha kawaida kinachohifadhi nahau ya kibiblia ya hofu ya Mungu na wazo la heshima yenye uwajibikaji mbele zake.
theological_decisions:
- issue: Maana ya יִרְאַת אֱלֹהִים
  choice: kwa sababu ya kumcha Mungu
  alternative: kwa sababu ya heshima yangu kwa Mungu
  rationale: “Kumcha Mungu” huhifadhi uzito wa nahau ya kibiblia na motisha ya Nehemia ya kuwajibika mbele za Mungu, bila kuipunguza iwe heshima ya kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mtiririko wa Kiebrania kwa kiasi kinachobaki cha kawaida katika Kiswahili; “kumcha Mungu” huhifadhi nahau ya kibiblia.
