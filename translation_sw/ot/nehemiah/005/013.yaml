  text: גַּם חָצְנִ֣/י נָעַ֗רְתִּי וָֽ/אֹמְרָ֡/ה כָּ֣כָה יְנַעֵ֪ר הָֽ/אֱלֹהִ֟ים אֶת כָּל הָ/אִישׁ֩ אֲשֶׁ֨ר לֹֽא יָקִ֜ים אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה מִ/בֵּית/וֹ֙ וּ/מִ֣/יגִיע֔/וֹ וְ/כָ֛כָה יִהְיֶ֥ה נָע֖וּר וָ/רֵ֑ק וַ/יֹּאמְר֨וּ כָֽל הַ/קָּהָ֜ל אָמֵ֗ן וַֽ/יְהַלְלוּ֙ אֶת יְהוָ֔ה וַ/יַּ֥עַשׂ הָ/עָ֖ם כַּ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: sw
  text: Pia nilikung’uta ukunjo wa vazi langu[a] nikasema, “Mungu amkung’ute kila mtu asiyetimiza ahadi hii[b] kutoka katika nyumba yake na katika matunda ya kazi yake[c]; hivyo yeye akung’utwe, abaki mtupu.” Kusanyiko lote likasema, “Amina,” nalo likamsifu Yahwe. Kisha watu wakafanya kulingana na ahadi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu ya mbele iliyokunjwa ya vazi langu.” Sehemu hiyo ya vazi ingeweza kutumiwa kubebea vitu; kuikung’uta kulionyesha kuondolewa na kunyang’anywa mali.
    reason: lexical_alternative
  - marker: b
    text: Au “asiyetekeleza jambo hili” au “asiyetimiza neno hili.” Usemi wa Kiebrania unamaanisha kutekeleza au kuthibitisha jambo lililoahidiwa.
    reason: lexical_alternative
  - marker: c
    text: Au “katika kazi yake.” Neno la Kiebrania linaweza kumaanisha kazi yenyewe au kile kilichopatikana kwa kazi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָצְנִי
  choice: pindo la vazi langu
  rationale: Neno hili linamaanisha sehemu ya vazi iliyokunjwa ambayo ingeweza kubeba vitu. ‘Pindo la vazi langu’ linaifanya ishara ya Nehemia ionekane wazi katika Kiswahili cha kawaida.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: nilikung’uta / na amkung’ute / na akung’utwe
  rationale: 'Kurudia ‘kung’uta’ kunahifadhi picha na mchezo wa maneno wa Kiebrania: Nehemia anakung’uta vazi lake, naye anatangaza kwamba mvunja-ahadi atakung’utwa vivyo hivyo.'
- source_word: כָּכָה
  choice: Vivyo hivyo ... na
  rationale: Katika kiapo hiki kinachoambatana na ishara, muundo huu unaonyesha laana inayotakiwa itendeke kwa namna ileile ya ishara ya Nehemia.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hilo linamtaja Mungu wa Israeli kwa njia ya kawaida; ‘Mungu’ ni usemi wa asili katika Kiswahili.
- source_word: כָּל הָאִישׁ
  choice: kila mtu
  rationale: Ingawa Kiebrania kina umbo la kiume la umoja, usemi huo una maana wakilishi ya kila mtu anayevunja ahadi. ‘Kila mtu’ ni tafsiri ya kawaida na isiyo na jinsia maalumu katika Kiswahili.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: hatatimiza ahadi hii
  rationale: Katika muktadha wa kiapo, usemi huu unamaanisha kutekeleza au kuthibitisha jambo lililoahidiwa. ‘Kutimiza ahadi hii’ huwasilisha maana hiyo wazi.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: katika nyumba yake na katika matunda ya kazi yake
  rationale: יְגִיעַ inaweza kumaanisha kazi ngumu au kile kinachopatikana kwa kazi hiyo. Katika laana ya kunyang’anywa vitu, ‘matunda ya kazi yake’ ni ya kawaida, huku tanbihi ikihifadhi maana nyingine.
- source_word: וָרֵק
  choice: kuachwa bila kitu
  rationale: Hili linawasilisha hali ya kuwa tupu au kunyang’anywa kila kitu, sambamba na picha ya kitu kilichokung’utwa kutoka katika pindo la vazi.
- source_word: הַקָּהָל
  choice: kusanyiko lote
  rationale: קָהָל ni jamii iliyokusanyika. ‘Kusanyiko’ ni neno la kawaida lisiloingiza maana maalumu ya kidhehebu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: כַדָּבָר הַזֶּה
  choice: kulingana na ahadi hiyo
  rationale: Usemi huo unarejelea wajibu walioapa kuutekeleza; ‘ahadi hiyo’ hutambulisha rejeo lake kwa uwazi katika muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Umbo wakilishi כָּל הָאִישׁ
  choice: kila mtu
  alternative: kila mwanamume
  rationale: Katika muktadha huu umbo la kiume la Kiebrania lina nguvu ya uwakilishi. Kiswahili ‘mtu’ hakibainishi jinsia, kwa hiyo ‘kila mtu’ huhifadhi maana bila kudai kwamba laana inawahusu wanaume peke yao.
- issue: Nguvu ya laana ya kiapo
  choice: Vivyo hivyo Mungu na amkung’ute ... na akung’utwe
  alternative: Mungu atamkung’uta
  rationale: Muundo wa ombi unahifadhi hali ya laana inayotamkwa kwa ishara, badala ya kuibadili kuwa taarifa rahisi ya jambo la baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Lugha ya kiapo imehifadhiwa, pamoja na marudio ya picha ya ‘kung’uta.’ ‘Kuachwa bila kitu’ ni ya kueleweka kwa wasomaji wa kawaida, na tanbihi zinahifadhi maeneo muhimu ya utata wa Kiebrania.
