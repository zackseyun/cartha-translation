  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י לְ/טוֹבָ֑ה כֹּ֥ל אֲשֶׁר עָשִׂ֖יתִי עַל הָ/עָ֥ם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: sw
  text: Ee Mungu wangu, unikumbuke kwa wema[a], kwa ajili ya yote niliyowatendea watu hawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unikumbuke kwa kibali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: unikumbuke
  rationale: Ombi hili la sala kutoka mzizi זכר pamoja na kiwakilishi cha nafsi linaelezwa kwa Kiswahili cha kawaida kama “unikumbuke,” huku hali yake ya ombi ikihifadhiwa.
- source_word: אֱלֹהַי
  choice: Ee Mungu wangu
  rationale: Umbo lenye kiambishi cha nafsi ya kwanza linaonyesha uhusiano wa “Mungu wangu” na hapa linatumika kama mwito wa moja kwa moja; “Ee” hufanya mwito huo uwe wazi na wa heshima katika Kiswahili.
- source_word: לְטוֹבָה
  choice: kwa wema
  rationale: Kirai hiki kinaweza kumaanisha kukumbuka kwa nia au matokeo mema. “Kwa wema” huhifadhi nahau na kutokuweka wazi kupita kiasi kama ni kibali, thawabu, au faida.
- source_word: כֹּל אֲשֶׁר
  choice: yote
  rationale: Huwakilisha kwa ufupi na kwa kawaida maana ya “yote ambayo/kila nilichofanya” katika muktadha huu.
- source_word: עָשִׂיתִי עַל
  choice: niliyowatendea
  rationale: Kitenzi עשה pamoja na עַל hapa kinaonyesha matendo yaliyofanywa kwa ajili au kwa manufaa ya watu; “niliyowatendea” ni Kiswahili asilia kinachobeba uelekeo huo.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa Kiebrania kina nomino ya mkusanyiko katika umoja, Kiswahili cha kawaida hutumia “watu hawa,” kikihifadhi rejeo la kundi na nguvu ya kiashiria.
theological_decisions:
- issue: Asili ya ombi la Nehemia akumbukwe na Mungu
  choice: Ombi Mungu amkumbuke Nehemia kwa wema kwa sababu ya matendo yake kwa watu
  alternative: Ombi la kuthibitishwa hadharani au dai la kustahili thawabu mbele za Mungu
  rationale: Maneno yanaunganisha ombi la kukumbukwa kwa wema na yale Nehemia aliyowatendea watu, lakini hayafafanui ikiwa hilo ni dai la ustahili, kutetewa, kibali, au thawabu. Tafsiri inahifadhi mvutano huo bila kuamua fundisho lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mwito “Ee Mungu wangu” unaweka wazi kuwa ni sala; “kwa wema” huhifadhi upana wa לְטוֹבָה, na tanbihi hutoa uwezekano wa maana ya kukumbukwa kwa kibali.
