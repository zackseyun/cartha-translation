  text: וָ/אֹמְרָ֣/ה לָ/הֶ֗ם אֲנַ֣חְנוּ קָ֠נִינוּ אֶת אַחֵ֨י/נוּ הַ/יְּהוּדִ֜ים הַ/נִּמְכָּרִ֤ים לַ/גּוֹיִם֙ כְּ/דֵ֣י בָ֔/נוּ וְ/גַם אַתֶּ֛ם תִּמְכְּר֥וּ אֶת אֲחֵי/כֶ֖ם וְ/נִמְכְּרוּ לָ֑/נוּ וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹ֥א מָצְא֖וּ דָּבָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: sw
  text: Nikawaambia, “Sisi tumewanunua tena ndugu zetu Wayahudi waliouzwa kwa mataifa, kwa kadiri tulivyoweza. Lakini hata ninyi wenyewe mnawauza ndugu zenu—nao wauzwe kwetu?[a]” Wakanyamaza, wala hawakupata la kusema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nao wauzwe kwetu!” Kifungu cha Kiebrania ni kifupi; kinaweza kusomwa kama swali la balagha au kama kauli ya matokeo kwamba ndugu zao wanaishia kuuzwa tena kwa watu wao wenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: tumewanunua tena
  rationale: Kitenzi kina maana ya kununua au kupata. Katika muktadha huu, Wayahudi wenzao walinunuliwa kutoka utumwani kwa wageni; “kununua tena” linaonyesha tendo hilo bila kuongeza istilahi nzito ya kitheolojia.
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: ndugu zetu Wayahudi
  rationale: Huhifadhi neno la ukoo la kiume na utambulisho wa Wayahudi, huku likisikika kwa kawaida katika Kiswahili.
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: waliokuwa wameuzwa kwa mataifa
  rationale: “Mataifa” ni tafsiri ya moja kwa moja ya גּוֹיִם hapa; kauli tendwa huhifadhi muundo wa Kiebrania.
- source_word: כְּדֵי בָנוּ
  choice: kwa kadiri tulivyoweza
  rationale: Huwasilisha nahau inayoonyesha kiwango cha uwezo au rasilimali walizokuwa nazo.
- source_word: וְגַם אַתֶּם
  choice: Lakini hata ninyi wenyewe
  rationale: “Hata” na “wenyewe” huhifadhi mkazo wa lawama na utofautishaji uliomo katika kifungu.
- source_word: תִּמְכְּרוּ
  choice: mnawauza
  rationale: Wakati wa sasa unaoendelea unafaa kwa lawama kuhusu mwenendo wao wa wakati huo.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: nao wauzwe kwetu!
  rationale: Huhifadhi ufupi na nguvu ya matokeo ya kejeli katika Kiebrania bila kulazimisha kwa hakika ikiwa kifungu ni taarifa au swali la balagha.
- source_word: וַיַּחֲרִישׁוּ
  choice: Wakanyamaza
  rationale: Ni tafsiri fupi, ya kawaida, na ya moja kwa moja ya tendo la kukaa kimya.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: wasipate la kusema
  rationale: Ni nahau ya asili ya Kiswahili inayowasilisha maana ya kutokuwa na jibu.
theological_decisions:
- issue: Neno la ukoo la kiume אַחֵינוּ / אַחֵיכֶם
  choice: ndugu zetu / ndugu zenu
  alternative: Wayahudi wenzetu / Wayahudi wenzenu
  rationale: “Ndugu” huhifadhi lugha ya ukoo na mshikamano wa jumuiya bila kupanua wazi jinsia ya neno la Kiebrania.
- issue: Maana ya וְנִמְכְּרוּ לָנוּ
  choice: nao wauzwe kwetu!
  alternative: je, wauzwe kwetu?
  rationale: Kifungu cha Kiebrania ni kifupi na kinaweza kueleweka kama tokeo la kejeli au swali la balagha. Tafsiri kuu huhifadhi mshtuko wa lawama, na uwezekano wa swali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo wa lawama umehifadhiwa kwa mkazo wa “hata ninyi wenyewe,” huku utata halisi wa kifungu cha mwisho ukielezwa katika tanbihi.
