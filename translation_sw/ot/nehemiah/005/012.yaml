base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: sw
  text: Nao wakasema, “Tutarejesha vitu hivyo, wala hatutadai chochote kutoka kwao. Tutafanya kama unavyosema.” Ndipo nikawaita makuhani, nikawaapisha[b] watekeleze neno hili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo hili” au “ahadi hii.” Neno la Kiebrania דָּבָר linaweza kumaanisha neno, jambo, au, katika muktadha huu, ahadi iliyotolewa.
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi “wa-” katika “nikawaapisha” kinaweza kueleweka kuwa kinawarejelea makuhani waliotajwa karibuni, au wale viongozi waliotoa ahadi katika muktadha uliotangulia.
    reason: referential_ambiguity
lexical_decisions:
- source_word: נָשִׁיב
  choice: Tutayarudisha
  rationale: Hifili ya שׁוב hapa ina maana ya kurudisha vitu vilivyochukuliwa au kudaiwa. Kiambishi cha ngeli “-ya-” kinarejelea mali zilizotajwa katika muktadha uliotangulia bila kuzitaja upya.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: wala hatutadai chochote kutoka kwao
  rationale: Katika muktadha huu wa kiuchumi na kisheria, בקש ina nguvu ya kudai malipo au deni, si kutafuta tu.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: Tutafanya kama unavyosema
  rationale: Tafsiri hii ya kawaida hudumisha uthibitisho wa kwamba watatekeleza agizo la Nehemia.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: Ndipo nikawaita makuhani
  rationale: קרא pamoja na yambwa ina maana ya kuita au kuwaita waje; “ndipo” huonyesha mfuatano wa simulizi.
- source_word: וָאַשְׁבִּיעֵם
  choice: nikawaapisha
  rationale: Hifili ya שבע humaanisha kumsababisha mtu aape, yaani kumweka chini ya kiapo. Kiwakilishi kimeachwa kama kilivyo katika Kiebrania badala ya kuongeza jina lisilotajwa tena.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: wafanye kulingana na neno hili
  rationale: “Neno hili” linafuata דָּבָר kwa ukaribu huku tanbihi ikihifadhi maana mbadala ya jambo au ahadi katika muktadha wa kiapo.
theological_decisions:
- issue: Wanaorejelewa na kiambishi katika וָאַשְׁבִּיעֵם
  choice: Kudumisha kiwakilishi katika “nikawaapisha” bila kutaja kundi kwa jina
  alternative: “nikawaapisha wakuu na maafisa hao” au kuelewa kuwa makuhani ndio walioapishwa
  rationale: Kisintaksia makuhani ndio jina la karibu, lakini muktadha unaelekea kwa wale waliotoa ahadi, huku makuhani wakiwa wameitwa kwa ajili ya kiapo. Kutotaja kundi moja waziwazi kunahifadhi kiasi cha utata wa rejeo katika Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nao” na “ndipo” hudumisha mtiririko wa simulizi; sentensi za moja kwa moja na msamiati wa kawaida huepuka lugha nzito ya kisheria.
