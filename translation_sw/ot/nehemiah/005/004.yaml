base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/004.yaml
  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: sw
  text: Na wengine walikuwa wakisema, “Tumekopa fedha ili kulipa kodi ya mfalme inayotozwa juu ya mashamba yetu na mashamba yetu ya mizabibu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Na wengine walikuwa wakisema
  rationale: Muundo huu unatambulisha kundi jingine miongoni mwa walalamikaji, na hali ya kuendelea ya kitenzi cha Kiebrania inaelezwa kwa kawaida kwa ‘walikuwa wakisema’ katika simulizi.
- source_word: לָוִינוּ
  choice: Tumekopa
  rationale: Kitenzi kinamaanisha kukopa au kuchukua mkopo; wakati timilifu unaonyesha tendo lililokwisha kutokea lenye matokeo yanayoendelea.
- source_word: כֶסֶף
  choice: fedha
  rationale: Ingawa neno hilo pia humaanisha ‘fedha’ kama metali, katika muktadha huu wa uchumi linamaanisha pesa; ‘fedha’ ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: ili kulipa kodi ya mfalme
  rationale: Kirai hiki kinarejelea malipo yaliyokadiriwa na kudaiwa na mfalme. ‘Kodi ya mfalme’ huwasilisha maana hiyo wazi katika Kiswahili cha sasa.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: inayotozwa mashamba yetu na mashamba yetu ya mizabibu
  rationale: Nomino za mwisho zinaeleweka kuwa mali ambazo kodi ilikadiriwa juu yake. ‘Inayotozwa’ huweka uhusiano huo wazi bila kudokeza kwamba ardhi yenyewe iliwekwa dhamana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya kawaida na yenye hadhi. ‘Mashamba ya mizabibu’ imetumiwa badala ya ‘mizabibu’ pekee ili kubainisha kuwa מדובר maeneo ya ardhi yaliyotozwa kodi.
