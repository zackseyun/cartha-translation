  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: sw
  text: Tafadhali, warudishieni leo hii mashamba yao, mashamba yao ya mizabibu, mashamba yao ya mizeituni, na nyumba zao; pamoja na sehemu ya mia moja[a] ya fedha, nafaka, divai mpya, na mafuta ambayo mmekuwa mkiwatoza kutoka kwao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asilimia moja” ya fedha, nafaka, divai mpya, na mafuta; inaelekea Kiebrania kinarejelea sehemu iliyokuwa ikitozwa kutoka kwao.
    reason: lexical_alternative
  - marker: b
    text: Au “ambazo mmekuwa mkiwadai” au “ambazo mmekuwa mkiwakopesha kwa riba.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ
  choice: warudishieni
  rationale: Amri ya wingi katika maana ya kusababisha vitu virudi kwa wenyewe; “warudishieni” ni ya asili na inafaa kwa mali na malipo yaliyotozwa.
- source_word: נָא
  choice: Tafadhali
  rationale: Huonyesha ombi la kusisitiza huku ikilainisha amri.
- source_word: כְּהַיּוֹם
  choice: leo hii
  rationale: Huhifadhi msisitizo wa uharaka na utekelezaji siku iyo hiyo.
- source_word: שְׂדֹתֵיהֶם
  choice: mashamba yao
  rationale: Ni istilahi ya kawaida kwa ardhi ya kilimo.
- source_word: כַּרְמֵיהֶם
  choice: mashamba yao ya mizabibu
  rationale: Hueleza wazi mashamba yaliyopandwa mizabibu kama mali ya kilimo.
- source_word: זֵיתֵיהֶם
  choice: mashamba yao ya mizeituni
  rationale: Katika orodha ya mali za ardhi, neno hili linaelekea kumaanisha maeneo yaliyolimwa mizeituni, si miti mmoja mmoja tu.
- source_word: וּבָתֵּיהֶם
  choice: na nyumba zao
  rationale: Tafsiri ya moja kwa moja inayokamilisha orodha ya mali.
- source_word: וּמְאַת
  choice: sehemu ya mia
  rationale: Huhifadhi usemi halisi wa sehemu moja kati ya mia bila kuamua zaidi utaratibu maalumu wa kifedha.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: Katika muktadha huu neno lina kazi ya kiuchumi na linaweza kutafsiriwa kwa kawaida kuwa fedha.
- source_word: הַדָּגָן
  choice: nafaka
  rationale: Ni neno la kawaida la Kiswahili kwa mazao ya jamii ya nafaka.
- source_word: הַתִּירוֹשׁ
  choice: divai mpya
  rationale: Huhifadhi utofauti wa kileksika wa תירוש, ambacho kwa kawaida ni divai mpya au changa.
- source_word: הַיִּצְהָר
  choice: mafuta
  rationale: Kwa kawaida hurejelea mafuta mapya, hasa ya zeituni; muktadha wa kilimo unatosha bila kuongeza ufafanuzi katika matini.
- source_word: נֹשִׁים
  choice: mnawatoza
  rationale: Huwasilisha tendo la wadai bila kulifungia kwenye maana finyu ya riba pekee.
theological_decisions:
- issue: Maana ya kifedha ya נֹשִׁים katika muktadha wa dhuluma kwa wadaiwa
  choice: mnawatoza
  alternative: mnawatoza riba; mnawakopesha kwa riba
  rationale: Kitenzi kinaweza kueleza kwa upana tendo la wadai. Tafsiri hii inadumisha nguvu ya kukemea unyonyaji bila kuamua kimya kimya kwamba kinachozungumziwa ni riba tu.
- issue: Uhusiano wa וּמְאַת na orodha inayofuata
  choice: pamoja na sehemu ya mia ya fedha, nafaka, divai mpya na mafuta
  alternative: mashamba yao ... na sehemu ya mia moja; au asilimia moja ya vitu hivyo
  rationale: Muundo wa Kiebrania una ugumu fulani, lakini unaelekea kuhusisha “sehemu ya mia” na vitu vilivyokuwa vikitozwa. Matini inahifadhi uhusiano huo na tanbihi inaonyesha mbadala wa kimaana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Leo hii” huleta uharaka; “mashamba ya mizeituni” ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi adimu. Alama zote za tanbihi zimewekwa katika matini.
