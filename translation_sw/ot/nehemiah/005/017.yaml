  text: וְ/הַ/יְּהוּדִ֨ים וְ/הַ/סְּגָנִ֜ים מֵאָ֧ה וַ/חֲמִשִּׁ֣ים אִ֗ישׁ וְ/הַ/בָּאִ֥ים אֵלֵ֛י/נוּ מִן הַ/גּוֹיִ֥ם אֲשֶׁר סְבִיבֹתֵ֖י/נוּ עַל שֻׁלְחָנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: sw
  text: Wayahudi na maafisa[a], jumla ya wanaume mia moja na hamsini, pamoja na wale waliotujia kutoka kwa mataifa yaliyotuzunguka, walikula mezani pangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yuda.”
    reason: lexical_alternative
  - marker: b
    text: Kula “mezani pangu” kunamaanisha kwamba Nehemia aliwapa chakula kama sehemu ya ukarimu wake na utawala wake.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: Wayahudi
  rationale: Neno hili linaweza kumaanisha Wayahudi kwa ujumla au watu wa Yuda; katika muktadha huu, “Wayahudi” ni tafsiri ya kawaida na ya asili zaidi.
- source_word: וְהַסְּגָנִים
  choice: maafisa
  rationale: Linarejelea viongozi au wasimamizi wa kiraia walio chini ya mamlaka nyingine; “maafisa” linaeleza wajibu wao bila kubainisha cheo cha Kiajemi kupita kiasi.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: jumla ya wanaume mia moja na hamsini
  rationale: Idadi hiyo inaeleza ukubwa wa kundi la Wayahudi na maafisa. “Wanaume” huhifadhi maana ya אִישׁ, huku “jumla ya” ikifanya uhusiano wa kisarufi uwe wazi kwa Kiswahili.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: pamoja na wale waliotujia
  rationale: Kirai cha Kiebrania ni cha kitenzi-jina, kihalisi ‘wale wanaokuja kwetu’; wakati uliopita unasomeka kwa kawaida katika simulizi hili la kukumbuka yaliyotendeka.
- source_word: מִן הַגּוֹיִם
  choice: kutoka kwa mataifa
  rationale: “Mataifa” ni tafsiri pana na iliyo karibu na chanzo, bila kuongeza uzito wa kiteolojia wa neno kama “Mataifa mengine” au “Watu wa Mataifa.”
- source_word: אֲשֶׁר סְבִיבֹתֵינוּ
  choice: yaliyotuzunguka
  rationale: Huhifadhi maana ya kijiografia ya jamii za mataifa jirani.
- source_word: עַל שֻׁלְחָנִי
  choice: walikula mezani pangu
  rationale: Kihalisi ni ‘juu/kwenye meza yangu,’ lakini katika muktadha huu ni nahau ya kula kwa chakula alichotoa Nehemia. Kiswahili cha kawaida huhitaji kitenzi wazi ili kuwasilisha maana hiyo vizuri.
