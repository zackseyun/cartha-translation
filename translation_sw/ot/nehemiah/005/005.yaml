  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: sw
  text: Na sasa, miili yetu ni kama miili ya ndugu zetu, na watoto wetu ni kama watoto wao.[a] Hata hivyo, tazama, tunawatia wana wetu na binti zetu utumwani, na baadhi ya binti zetu tayari wametiwa utumwani. Hatuna uwezo,[b] kwa kuwa mashamba yetu na mizabibu yetu ni mali ya wengine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mwili wetu ni kama mwili wa ndugu zetu, na watoto wetu kama watoto wao.” Taswira ya mwili inasisitiza ubinadamu na undugu wao wa pamoja.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hakuna nguvu mkononi mwetu.” Nahau hii inaonyesha kwamba hawana uwezo wala njia, hasa kwa kuwa mashamba na mizabibu yao ni mali ya wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: sisi ni wa mwili mmoja na ndugu zetu
  rationale: Kiebrania kinatumia taswira halisi ya ‘mwili/nyama’ kuonyesha ubinadamu na undugu unaoshirikiwa. Kiswahili ‘wa mwili mmoja’ huhifadhi taswira hiyo kwa lugha ya kawaida bila kutumia ‘nyama,’ ambayo ingeweza kueleweka kama nyama ya chakula.
- source_word: אַחֵינוּ
  choice: ndugu zetu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili kwa jamaa au wanajumuiya wenzao; hapa linaonyesha Wayahudi wenzao bila kuongeza utambulisho usiotajwa moja kwa moja.
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: watoto wetu ni kama watoto wao
  rationale: בנים inaweza kumaanisha wana wa kiume au watoto kwa ujumla. Katika ulinganisho huu wa familia nzima, ‘watoto’ linafaa, huku sehemu inayofuata ikitaja wana na binti kwa kutofautisha.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: tunawatia ... utumwani
  rationale: Kitenzi כבשׁ pamoja na לַעֲבָדִים kinaonyesha kuwatiisha watu mpaka wawe watumwa. ‘Kuwatia utumwani’ ni kauli wazi na yenye uzito unaofaa kwa hali ya utumwa wa deni.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: baadhi ya binti zetu tayari wametiwa utumwani
  rationale: Kauli tendwa ya Kiebrania inaonyesha kwamba baadhi yao tayari wako katika hali hiyo. ‘Tayari wametiwa utumwani’ huhifadhi hali ya kutendwa na uzito wa jambo lililokwisha kutokea.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: hatuna uwezo wa kufanya lolote kuhusu hali hii
  rationale: Nahau hiyo, kihalisi ‘hakuna nguvu mkononi mwetu,’ inaonyesha kukosa uwezo au njia za kuchukua hatua. Tafsiri hii ni ya kawaida katika Kiswahili na haielekezi kimakosa אֵל kwa Mungu katika muktadha huu.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: kwa kuwa mashamba yetu na mizabibu yetu ni mali ya wengine
  rationale: Kishazi kisicho na kitenzi kinaonyesha kuwa mali yao yenye kuzaa imekwenda kwa wengine, jambo linaloeleza kwa nini hawana uwezo wa kujinasua. ‘Ni mali ya wengine’ huwasilisha uhusiano huo wazi.
theological_decisions:
- issue: Lugha ya undugu katika malalamiko kuhusu haki ya kijamii
  choice: Kutumia ‘ndugu zetu’ na ‘watoto wetu,’ kisha ‘wana wetu na binti zetu’ mahali Kiebrania kinapotofautisha jinsia
  alternative: Kutumia ‘jamaa zetu’ kila mahali, au ‘wana wetu’ kila mahali
  rationale: Uamuzi huu huhifadhi lugha ya undugu na pia maana jumuishi ya בנים katika ulinganisho wa familia, bila kufuta kutajwa wazi kwa wana na binti katika sehemu inayofuata.
- issue: Uzito wa lugha ya utumwa
  choice: utumwani / wametiwa utumwani
  alternative: utumishi / wamefanywa watumishi
  rationale: Muktadha ni utumwa wa deni unaowachukua watoto kwa lazima. ‘Utumwa’ huepuka kupunguza ukali wa hali hiyo kwa kuiita tu huduma au utumishi.
- issue: Maana ya אֵל katika וְאֵין לְאֵל יָדֵנוּ
  choice: uwezo au nguvu
  alternative: jina au cheo cha Mungu
  rationale: Muundo huu ni nahau ya kukosa nguvu au njia; kuifanya אֵל kuwa rejeo kwa Mungu kungetokeza maana isiyoungwa mkono na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wa mwili mmoja’ huhifadhi taswira ya Kiebrania kwa namna ya asili; ‘tazama’ huhifadhi msisitizo wa וְהִנֵּה; na ‘kutia utumwani’ hutaja hali hiyo kwa uwazi bila kuipunguza.
