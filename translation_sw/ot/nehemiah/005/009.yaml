  text: ו/יאמר לֹא ט֥וֹב הַ/דָּבָ֖ר אֲשֶׁר אַתֶּ֣ם עֹשִׂ֑ים הֲ/ל֞וֹא בְּ/יִרְאַ֤ת אֱלֹהֵ֨י/נוּ֙ תֵּלֵ֔כוּ מֵ/חֶרְפַּ֖ת הַ/גּוֹיִ֥ם אוֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: sw
  text: Kisha nikasema, “Jambo mnalofanya si jema. Je, hampaswi kuenenda kwa kumcha Mungu wetu kwa sababu ya dhihaka za mataifa, adui zetu?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kuepuka dhihaka za mataifa, adui zetu.” Kihusishi cha Kiebrania kinaweza kueleweka kuwa kinaonyesha sababu ya kutenda hivyo au kusudi la kuepuka dhihaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha nikasema
  rationale: Kiunganishi pamoja na umbo la kitenzi huendeleza simulizi. ‘Kisha nikasema’ ni Kiswahili cha kawaida kinachoonyesha mfuatano wa matukio.
- source_word: לֹא טוֹב
  choice: si jema
  rationale: Huhifadhi tathmini ya moja kwa moja ya Kiebrania bila kuipanua kuwa hukumu maalumu zaidi kama ‘si sawa’.
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Mnalofanya
  rationale: Ni njia ya kawaida na fupi ya Kiswahili ya kueleza ‘jambo ambalo mnafanya’ huku ikirejelea mwenendo wao wa sasa.
- source_word: הֲלוֹא
  choice: Je, hampaswi
  rationale: Huonyesha swali la balagha lenye nguvu ya maonyo na wajibu wa kimaadili.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: kwa kumcha Mungu wetu
  rationale: ‘Kumcha’ huhifadhi wazo la hofu yenye heshima na utiifu kwa Mungu kwa lugha ya kawaida ya kibiblia ya Kiswahili.
- source_word: תֵּלֵכוּ
  choice: kuenenda
  rationale: Huhifadhi sitiari ya Kiebrania ya kutembea kama mwenendo wa maisha; ‘kuenenda’ ni ya heshima na inaeleweka katika muktadha huu.
- source_word: מֵחֶרְפַּת
  choice: kwa sababu ya fedheha kutoka kwa
  rationale: ‘Fedheha’ huwasilisha חרפה kama aibu au dharau inayoletwa na maadui. ‘Kwa sababu ya’ hutoa maana ya kisababishi, huku uwezekano wa kusudi la kuepuka ukihifadhiwa katika tanbihi.
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: mataifa, adui zetu
  rationale: ‘Mataifa’ yanafaa kwa watu wa kigeni waliowazunguka, na kirai ‘adui zetu’ kimehifadhiwa kama ufafanuzi wa jina hilo.
theological_decisions:
- issue: Sitiari ya kimaadili ya הלך katika muktadha wa agano
  choice: Kuhifadhi ‘kuenenda’ badala ya kuibadili moja kwa moja kuwa ‘kuishi’
  alternative: kuishi; kujiendesha
  rationale: Sitiari hiyo inaonyesha mwenendo mzima wa maisha mbele za Mungu na huhifadhi ladha ya lugha ya kibiblia bila kulazimisha fundisho la dhehebu.
- issue: Maana ya יִרְאָה kuhusu uhusiano na Mungu
  choice: kumcha Mungu wetu
  alternative: kumheshimu Mungu wetu; kuishi kwa hofu yenye heshima kwa Mungu wetu
  rationale: ‘Kumcha’ huhifadhi kwa pamoja uzito wa hofu, heshima na utiifu bila kupunguza mvutano wa maana ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa; ‘kuenenda’ limetumiwa kudumisha sitiari ya kimaadili ya Kiebrania, huku sentensi nyingine zikiwa katika lugha ya kawaida inayoeleweka.
