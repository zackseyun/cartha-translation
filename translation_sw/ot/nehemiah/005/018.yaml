source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: sw
  text: Kila siku waliandaa ng'ombe mmoja, kondoo sita walio bora, na pia waliandaa ndege kwa ajili yangu. Kila baada ya siku kumi, waliandaa divai ya kila aina kwa wingi. Hata hivyo, sikudai posho ya chakula ya mtawala[a], kwa sababu mzigo wa kazi ulikuwa mzito kwa watu hawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “mkate wa mtawala”; yaani chakula, mahitaji ya chakula, au posho rasmi iliyohusiana na cheo cha mtawala.'
    reason: lexical_alternative
  - marker: b
    text: Au “utumishi ulikuwa mzito kwa watu hawa,” au “kazi ilikuwa nzito kwa watu hawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: Kila siku waliandaa
  rationale: Katika muktadha wa maandalizi ya chakula, kauli tendwa ya עשה ina maana ya kuandaa. לְיוֹם אֶחָד hapa huonyesha kiwango kilichoandaliwa kwa kila siku; Kiswahili cha kawaida hutumia kauli tendaji yenye mtendaji asiyeainishwa.
- source_word: שׁוֹר אֶחָד
  choice: fahali mmoja
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng'ombe na mara nyingi ng'ombe dume; 'fahali' ni neno wazi na la kawaida katika orodha ya wanyama wa chakula.
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: kondoo sita walio bora
  rationale: צֹאן ni kundi la mifugo midogo, na hapa idadi pamoja na muktadha wa chakula huunga mkono 'kondoo.' בְּרֻרוֹת huonyesha waliochaguliwa au walio bora.
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: na ndege kwa ajili yangu
  rationale: צִפֳּרִים ni neno pana la ndege. Kitenzi 'waliandaa' kilichotangulia kinatawala orodha yote, hivyo hakihitaji kurudiwa katika Kiswahili.
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: Kila baada ya siku kumi
  rationale: Kirai hiki huonyesha kipindi kinachojirudia cha siku kumi, si muda usio maalumu ulio katikati ya siku.
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: divai nyingi za kila aina
  rationale: Tafsiri hii huhifadhi wingi unaoonyeshwa na לְהַרְבֵּה na upana wa בְּכָל kwa Kiswahili cha asili.
- source_word: לֶחֶם הַפֶּחָה
  choice: posho ya chakula ya mtawala
  rationale: Maana halisi ni 'mkate wa mtawala,' lakini לֶחֶם inaweza kuwakilisha chakula au mahitaji ya chakula kwa ujumla. Katika muktadha huu ni mgao rasmi ulioambatana na cheo cha mtawala.
- source_word: לֹא בִקַּשְׁתִּי
  choice: sikudai
  rationale: בקשׁ inaweza kumaanisha kuomba au kutafuta, lakini hapa Nehemia anakataa kudai haki ya cheo, si kusema tu kwamba hakuiomba kwa kawaida.
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: kwa sababu kazi ilikuwa mzigo mzito kwa watu hawa
  rationale: כבד huleta taswira ya uzito, na עֲבֹדָה inaweza kuwa kazi, utumishi, au kazi ya kulazimishwa. Usemi huu huhifadhi uzito huo bila kuamua kwa uhakika aina ya kazi.
theological_decisions:
- issue: Maana ya Nehemia kutotumia mahitaji rasmi ya mtawala
  choice: Nehemia hakudai posho ya chakula iliyohusiana na cheo chake kwa sababu watu walikuwa wamelemewa
  alternative: Nehemia hakuomba tu mkate wa mtawala, au alikataa ushuru mahususi wa cheo
  rationale: Muktadha unaonyesha kwamba aliacha kutumia haki au mgao rasmi ili asiongeze mzigo wa watu. Tafsiri haipanui kauli hiyo kuwa fundisho la jumla kuhusu malipo ya viongozi.
- issue: Aina ya mzigo uliokuwa juu ya watu
  choice: kazi ilikuwa mzigo mzito kwa watu
  alternative: utumishi ulikuwa mzito, au kazi ya kulazimishwa ilikuwa kali
  rationale: עֲבֹדָה lina upana wa maana. Tafsiri kuu huhifadhi mvutano huo, huku tanbihi ikitaja uwezekano wa 'utumishi' au 'kazi ya kulazimishwa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimepangwa upya kidogo ili orodha na vipindi vya utoaji visomeke kwa urahisi. Alama zote za tanbihi zimewekwa katika matini kuu.
