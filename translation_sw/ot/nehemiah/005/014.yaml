base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: sw
  text: Pia, tangu siku aliyoniteua niwe gavana wao katika nchi ya Yuda, kuanzia mwaka wa ishirini hadi mwaka wa thelathini na mbili wa Mfalme Artashasta—miaka kumi na miwili—mimi na ndugu zangu hatukula chakula cha gavana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “mkate wa gavana,” yaani, chakula au posho ambayo kwa kawaida gavana alistahili kupewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Pia
  rationale: Linaendeleza hoja ya Nehemia kwa kuongeza jambo jingine katika utetezi wake.
- source_word: מִיּוֹם אֲשֶׁר
  choice: tangu siku
  rationale: Linaonyesha mwanzo wa kipindi kilichoendelea kwa muda uliotajwa.
- source_word: צִוָּה אֹתִי
  choice: aliponiweka
  rationale: Katika muktadha huu wa utawala, kitenzi kinaeleza uteuzi rasmi wa Nehemia kuwa gavana, si amri ya kawaida tu.
- source_word: לִהְיוֹת פֶּחָם
  choice: kuwa gavana wao
  rationale: פֶּחָה ni cheo cha mtawala wa jimbo katika utawala wa Uajemi; kiambishi cha wingi katika umbo פֶּחָם kimehifadhiwa kwa ‘wao.’
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: katika nchi ya Yuda
  rationale: Tafsiri hii huhifadhi neno la kijiografia ‘nchi’ bila kulifasiri moja kwa moja kuwa ‘jimbo.’
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: kuanzia mwaka wa ishirini hadi mwaka wa thelathini na mbili wa Mfalme Artashasta
  rationale: Huhifadhi kwa uwazi mfumo wa kuhesabu miaka ya utawala wa mfalme.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: miaka kumi na miwili
  rationale: Ni muhtasari wa muda uliotangulia na umewekwa kati ya vistari virefu kwa usomaji wazi.
- source_word: אֲנִי וְאַחַי
  choice: mimi na ndugu zangu
  rationale: Huhifadhi maana ya moja kwa moja ya אַחַי bila kuamua kama inawahusu jamaa au washirika kwa maana pana.
- source_word: לֶחֶם הַפֶּחָה
  choice: posho ya chakula ya gavana
  rationale: Ingawa לֶחֶם kwa msingi ni ‘mkate,’ hapa inaelekea kumaanisha chakula au mahitaji yaliyotolewa rasmi kwa gavana.
- source_word: לֹא אָכַלְתִּי
  choice: hatukula
  rationale: Kitenzi halisi cha kula kimehifadhiwa, huku kiima cha pamoja ‘mimi na ndugu zangu’ kikionyeshwa kwa upatanisho wa Kiswahili.
theological_decisions:
- issue: Maana pana inayowezekana ya אַחַי
  choice: ndugu zangu
  alternative: wenzangu; Wayahudi wenzangu
  rationale: Neno la Kiebrania linasema ‘ndugu zangu’; tafsiri hiyo huhifadhi uhusiano uliotajwa bila kuupanua kimakusudi.
- issue: Iwapo לֶחֶם הַפֶּחָה itafsiriwe kihalisi au kimuktadha
  choice: posho ya chakula ya gavana
  alternative: mkate wa gavana; mahitaji ya gavana
  rationale: Muktadha wa mzigo wa kiuchumi unaonyesha chakula au mahitaji rasmi ya gavana, lakini tanbihi huhifadhi taswira halisi ya ‘mkate.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Jina Artashasta linafuata umbo linalotumika kwa kawaida katika Biblia za Kiswahili; sentensi ndefu ya kihistoria imehifadhiwa kwa vistari virefu ili kuonyesha maelezo ya muda.
