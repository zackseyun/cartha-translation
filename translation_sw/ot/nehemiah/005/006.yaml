  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: sw
  text: Nilikasirika sana niliposikia kilio chao na maneno hayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mambo hayo.” Neno la Kiebrania linaweza kumaanisha maneno yaliyosemwa au mambo yaliyokuwa yakiripotiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: Nilikasirika
  rationale: Nahau ya Kiebrania חרה + ל inaeleza hasira inayowaka ndani ya mtu. “Nilikasirika” ni Kiswahili cha kawaida na cha asili kinachohifadhi nguvu ya hisia bila kutafsiri nahau hiyo neno kwa neno.
- source_word: מְאֹד
  choice: sana
  rationale: Neno hili linatilia mkazo kiwango cha hasira; “sana” ni wazi na la kawaida katika Kiswahili cha sasa.
- source_word: כַּאֲשֶׁר
  choice: nilipo-
  rationale: Katika muktadha huu kiunganishi kinaonyesha wakati au hali iliyochochea hasira ya Nehemia. Muundo “niliposikia” unatoa maana hiyo kwa Kiswahili cha asili.
- source_word: שָׁמַעְתִּי
  choice: niliposikia
  rationale: Kitenzi שמע hapa kinamaanisha kusikia kilio na yale yaliyosemwa; “kusikia” ndilo chaguo la moja kwa moja na linalofaa muktadha.
- source_word: זַעֲקָתָם
  choice: kilio chao
  rationale: זעקה ni kilio cha dhiki au cha kupinga dhuluma. “Kilio chao” kinahifadhi uzito wa kihisia na kinaeleweka kwa urahisi katika Kiswahili sanifu.
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: na maneno hayo
  rationale: דברים linaweza kumaanisha maneno au mambo. Kwa kuwa Nehemia anasimulia aliyosikia watu wakisema, “maneno hayo” ni tafsiri ya moja kwa moja, huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kupunguza nguvu ya malalamiko ya watu au hasira ya Nehemia.
