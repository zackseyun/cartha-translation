  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: sw
  text: Nami pia nilijishughulisha na kazi ya ukuta huu[a], na hatukununua shamba lolote; na watumishi wangu wote[b] walikuwa wamekusanyika huko kwa kazi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niliishika kazi ya ukuta huu,” yaani, “mimi mwenyewe nilijitia katika kuifanya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vijana wangu” au “wasaidizi wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Pia
  rationale: Linahifadhi wazo la kuongeza jambo hili kwa yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: kufanya kazi ya ukuta huu
  rationale: Ni usemi wa asili unaowasilisha kushiriki katika kazi ya ukuta huu bila kuongeza kwamba ni ukuta wa mji.
- source_word: הֶחֱזַקְתִּי
  choice: nilijitolea
  rationale: Hiphil ya חזק hapa ina maana ya kushika kazi kwa bidii au kujitia katika kazi; ‘nilijitolea’ huonyesha ushiriki binafsi bila kudokeza tu kuutia ukuta nguvu.
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: wala hatukununua shamba lolote
  rationale: Inahifadhi nafsi ya kwanza wingi ya kitenzi na kuwasilisha nomino ya umoja kwa maana isiyobainishwa kwa Kiswahili cha kawaida.
- source_word: נְעָרַי
  choice: watumishi wangu
  rationale: Katika muktadha huu neno linarejelea watu wa Nehemia waliokuwa chini yake na kushiriki katika kazi; ‘watumishi’ ni la kawaida, huku uwezekano wa ‘vijana’ ukihifadhiwa katika tanbihi.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: walikuwa wamekusanyika huko kwa ajili ya kazi hiyo
  rationale: Linahifadhi hali ya kuwa wamekusanywa, kielezi ‘huko,’ na kusudi la mkusanyiko wao.
