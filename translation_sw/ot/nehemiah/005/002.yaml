translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa familia umehifadhiwa kwa ukaribu kwa sababu אֲנַחְנוּ (‘sisi’) imo wazi katika chanzo, huku sentensi nyingine zikitafsiriwa kwa mtiririko wa kawaida.
