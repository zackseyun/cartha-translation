base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/002.yaml
  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
translation:
  language: sw
  text: Na baadhi yao wakasema, “Sisi, wana wetu, na binti zetu, ni wengi. Tujipatie nafaka, ili tule na tuishi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Na baadhi yao wakasema
  rationale: Nahau hii inatambulisha kundi moja miongoni mwa walalamikaji. ‘Baadhi yao’ ni Kiswahili cha kawaida kinachohifadhi wazo la kundi dogo bila kufanya tungo kuwa nzito.
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: Sisi pamoja na wana wetu na binti zetu ni wengi
  rationale: Muundo huu unahifadhi אֲנַחְנוּ (‘sisi’) waziwazi na pia msisitizo wa familia nzima uliomo katika mpangilio wa Kiebrania, badala ya kuufupisha kuwa ‘tuna watoto wengi.’
- source_word: וְנִקְחָה
  choice: Basi na tupate
  rationale: Kitenzi cha kohotativi cha nafsi ya kwanza wingi kinaonyesha ombi au azimio. ‘Na tupate’ ni cha asili na kinaonyesha haja ya kujipatia nafaka katika dhiki; ‘basi’ huunganisha azimio hilo na hali yao.
- source_word: דָגָן
  choice: nafaka
  rationale: Neno hili linamaanisha mazao ya nafaka hasa, si chakula kwa ujumla. ‘Nafaka’ ndilo neno sahihi na linaloeleweka katika Kiswahili sanifu.
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: ili tule na kuendelea kuishi
  rationale: 'Mfululizo huu unaonyesha kusudi la kupata nafaka: kula na kubaki hai. ‘Kuendelea kuishi’ huwasilisha kwa kawaida uzito wa kuokoka bila kuondoa vitenzi viwili vya chanzo.'
