  yaml_path: translation/ot/nehemiah/005/001.yaml
  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: sw
  text: Kikatokea kilio kikubwa miongoni mwa watu na wake zao dhidi ya ndugu zao Wayahudi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu zao Wayudea.” Neno la Kiebrania linaweza kumaanisha Wayahudi au Wayudea, kutegemea kama msisitizo ni wa kikabila au wa kikanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Kukatokea
  rationale: Wayyiqtol ya היה inaanzisha tukio jipya katika simulizi; “kukatokea” ni Kiswahili cha kawaida kinachoonyesha kuibuka kwa hali bila kuongeza kiashiria cha wakati kisichotajwa wazi.
- source_word: צַעֲקַת
  choice: kilio
  rationale: Neno hilo linaonyesha kilio cha dhiki au malalamiko yenye nguvu. “Kilio” ni cha asili na chenye hadhi katika Kiswahili, na muktadha unaonyesha kuwa ni kilio cha kupinga dhuluma.
- source_word: הָעָם
  choice: watu
  rationale: Tafsiri ya moja kwa moja inayorejelea jamii kwa ujumla bila kuwabainisha kupita kiasi kuwa tabaka fulani.
- source_word: וּנְשֵׁיהֶם
  choice: na wake zao
  rationale: Katika muundo huu wa wingi wenye kiambishi cha umilikaji, אשה kwa kawaida humaanisha wake; tafsiri inadumisha kutajwa kwa wanawake walioshiriki katika kilio hicho.
- source_word: גְּדוֹלָה
  choice: kikubwa
  rationale: Kivumishi kinaonyesha ukubwa au uzito wa kilio; “kikubwa” huhifadhi msisitizo wa Kiebrania kwa njia ya kawaida.
- source_word: אֶל
  choice: dhidi ya
  rationale: Ingawa msingi wake ni “kwa/kuelekea,” katika muktadha wa malalamiko linaonyesha walengwa wa upinzani; “dhidi ya” huwasilisha maana hiyo wazi.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Huhifadhi taswira halisi ya undugu na mshikamano wa jamii iliyopo katika Kiebrania, bila kuibadili kuwa neno pana zaidi.
- source_word: הַיְּהוּדִים
  choice: Wayahudi
  rationale: “Wayahudi” ni istilahi ya kawaida ya kisasa kwa utambulisho wa kikabila na kijamii; uwezekano wa maana ya kikanda “Wayudea” umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya istilahi ya utambulisho יְהוּדִים
  choice: Wayahudi
  alternative: Wayudea
  rationale: Katika muktadha huu, “Wayahudi” huonyesha kwa kawaida kuwa malalamiko yalikuwa ndani ya jamii moja, huku “Wayudea” ikiwezekana ikiwa msisitizo ni utambulisho wa kikanda. Tofauti hiyo halisi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kisimulizi; “kilio kikubwa” huhifadhi uzito wa malalamiko ya hadharani, na alama ya tanbihi [a] imewekwa moja kwa moja baada ya neno linalohusika.
