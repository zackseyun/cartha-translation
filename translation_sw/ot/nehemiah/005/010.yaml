base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: sw
  text: Mimi pia, ndugu zangu na watumishi wangu[a], tunawakopesha fedha na nafaka[b]. Tafadhali, na tuache mzigo huu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vijana wangu” au “wasaidizi wangu.”
    reason: lexical_alternative
  - marker: b
    text: Au “tunawadai” au “sisi ni wadai wao”; kitenzi cha Kiebrania kinaweza kumaanisha kutenda kama mdai, wala si kukopesha tu bila upande wa madai.
    reason: lexical_alternative
  - marker: c
    text: Au “madai haya” au “deni hili.” Kiebrania kinasema kihalisi “mzigo huu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Mimi pia
  rationale: Inahifadhi nguvu ya nyongeza na msisitizo wa וְגַם, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: אַחַי
  choice: ndugu zangu
  rationale: Inahifadhi neno la kifamilia na mshikamano wa kijamii unaodokezwa na Kiebrania.
- source_word: וּנְעָרַי
  choice: watumishi wangu
  rationale: Katika muktadha wa Nehemia, נְעָרִים inaelekea kumaanisha watu wa nyumba au wasaidizi wake; ‘watumishi’ ni ya kawaida zaidi kuliko ‘vijana wangu,’ huku maana nyingine ikiwekwa katika tanbihi.
- source_word: נֹשִׁים בָּהֶם
  choice: tunawakopesha
  rationale: Kitenzi נשׁה humaanisha kutoa mkopo au kuwa mdai. ‘Tunawakopesha’ ni wazi, lakini wazo la kudai linaendelezwa katika ombi linalofuata.
- source_word: כֶּסֶף וְדָגָן
  choice: fedha na nafaka
  rationale: ‘Fedha’ huwasilisha maana ya kiuchumi ya כֶּסֶף katika muktadha wa mikopo; ‘nafaka’ ni neno pana na la kawaida kwa דָגָן.
- source_word: נַעַזְבָה נָּא
  choice: Tafadhali, na tuache
  rationale: Muundo wa cohortative pamoja na נָא ni ombi lenye kusihi; ‘na tuache’ huhifadhi himizo la pamoja.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: kuwadai mzigo huu
  rationale: מַשָּׁא kimsingi ni ‘mzigo,’ lakini hapa inaweza kumaanisha deni au madai ya mkopo. Muundo huu huhifadhi sitiari na pia kuonyesha tendo la kiuchumi linalokusudiwa.
