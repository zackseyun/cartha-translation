base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: sw
  text: Ndipo nikatafakari moyoni mwangu, nikawashitaki wakuu na maofisa. Nikawaambia, “Kila mmoja wenu anamdai ndugu yake riba.” Kisha nikaitisha kusanyiko kubwa dhidi yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nikakusanya mkutano mkubwa ili kuwakabili.” Kiebrania husema kwa halisi, “nikaweka dhidi yao kusanyiko kubwa,” yaani kuitisha upinzani wa hadhara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: nikatafakari moyoni mwangu
  rationale: Kirai hiki kinaeleza kujadiliana au kufikiri ndani ya nafsi kabla ya kuchukua hatua; Kiswahili hiki ni cha asili na hakirudii hasira iliyotajwa katika mstari uliotangulia.
- source_word: וָאָרִיבָה
  choice: nikawaletea mashtaka
  rationale: Kitenzi ריב kinaweza kumaanisha kushindana au kuwasilisha hoja ya mashtaka; hapa muktadha wa kukabili viongozi hadharani unaipa kauli nguvu ya kisheria.
- source_word: הַחֹרִים
  choice: wakuu
  rationale: Neno hilo linataja watu wa tabaka la juu katika jamii ya Yuda; “wakuu” ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: הַסְּגָנִים
  choice: maofisa
  rationale: Neno hilo linawahusu watawala au wasimamizi wa chini; “maofisa” halibainishi kupita kiasi cheo chao halisi.
- source_word: מַשָּׁא ... נשאים
  choice: anamdai ... riba
  rationale: Katika muktadha huu maneno haya yanaeleza kutoza au kudai riba; muundo wa Kiswahili unaendeleza sauti ya shtaka na unaeleweka kwa urahisi.
- source_word: אִישׁ בְּאָחִיו
  choice: Kila mmoja wenu ... ndugu yake
  rationale: Muundo huu huhifadhi maana ya usambazaji ya אִישׁ na lugha ya kindugu, inayosisitiza kuwa Waisraeli walikuwa wakiwatoza wenzao.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: nikaitisha kusanyiko kubwa dhidi yao
  rationale: Ingawa נתן kwa kawaida ni “kutoa/kuweka,” hapa kirai ni nahau ya kuitisha mkutano mkubwa wa hadhara ili kuwakabili.
