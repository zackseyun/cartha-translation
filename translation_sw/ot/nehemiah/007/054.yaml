  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya koo, neno hili hutambulisha wazao au jamaa ya mtu aliyetajwa. “Wana wa” ni tafsiri ya kawaida, wazi, na yenye kufuata muundo wa Kiebrania.
- source_word: בַצְלִית
  choice: Baslithi
  rationale: Ni jina maalumu; limenukuliwa kwa tahajia inayosomeka kwa Kiswahili, huku sauti ya צ ikiwakilishwa kwa “s” na ת ya mwisho kwa “thi”.
- source_word: מְחִידָא
  choice: Mehida
  rationale: Ni jina maalumu; limenukuliwa kwa namna ya kawaida katika Kiswahili, na ח imewakilishwa kwa “h” bila kulipa jina maana ya kileksika.
- source_word: חַרְשָׁא
  choice: Harsha
  rationale: Ni jina maalumu; limenukuliwa badala ya kutafsiriwa, na “sh” inawakilisha שׁ kwa uwazi katika tahajia ya Kiswahili.
