  text: 'Wazao wa Ateri wa Hezekia: tisini na wanane.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha ya ukoo na sensa, wingi huu wa neno 'mwana' mara nyingi humaanisha wazao au watu wa ukoo, si wana wa moja kwa moja tu. 'Wazao wa' ni Kiswahili cha sasa kilicho wazi na kinachofaa muktadha huu.
- source_word: אָטֵר
  choice: Ateri
  rationale: Ni jina la mtu au ukoo; limeandikwa kwa namna inayofuata matamshi ya Kiebrania na muundo wa kawaida wa majina katika Kiswahili.
- source_word: לְחִזְקִיָּה
  choice: wa ukoo wa Hezekia
  rationale: Kiambishi לְ hapa kinaelekea kuonyesha uhusiano au tawi ndani ya jamaa ya Ateri. Tafsiri hii inaonyesha uhusiano huo bila kuamua kwa uhakika kama Hezekia ni babu wa tawi hilo au namna nyingine ya utambulisho.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: tisini na wanane
  rationale: Ni namna ya kawaida ya kutaja idadi 98 kwa Kiswahili; umbo 'wanane' linapatana na watu wanaohesabiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya sensa. Neno 'wazao' limetumiwa badala ya 'wana' ili maana ya ukoo ieleweke kwa msomaji wa sasa; tanbihi inahifadhi uwezekano wa kisarufi wa uhusiano kati ya Ateri na Hezekia.
