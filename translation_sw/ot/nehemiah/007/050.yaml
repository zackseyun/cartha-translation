- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni umbo la wingi katika hali ya kutegemea la בֵּן. Katika orodha hii linaweza kumaanisha wana halisi, wazao, au watu wa jamaa; “wana wa” huhifadhi muundo wa Kiebrania bila kufunga maana hiyo.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na tahajia ya kawaida ya Kiswahili.
- source_word: רְצִין
  choice: Resini
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili, huku sauti ya Kiebrania ikihifadhiwa kwa kadiri inayowezekana.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania bila kutafsiriwa.
