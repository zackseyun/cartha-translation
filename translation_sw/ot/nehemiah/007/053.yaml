base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/053.yaml
  text: the sons of Bakbuk[a], the sons of Hakupha, the sons of Harhur—
translation:
  language: sw
  text: wazao wa Bakbuki[a], wazao wa Hakufa, na wazao wa Harhuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha hii ya nasaba, neno la Kiebrania linalotafsiriwa “wazao wa” linaweza kumaanisha pia wana au watu wa ukoo fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha hii ya koo za waliorejea, neno hili linaonyesha watu wa ukoo au kundi la vizazi, si lazima wana wa moja kwa moja. “Wazao wa” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kuifanya kuwa finyu.
- source_word: בַקְבּוּק
  choice: Bakbuki
  rationale: Ni jina la mtu au ukoo; limetoholewa kwa mwandiko unaosomeka kwa kawaida katika Kiswahili.
- source_word: חֲקוּפָא
  choice: Hakufa
  rationale: Ni jina la mtu au ukoo; “Hakufa” linawakilisha konsonanti za Kiebrania kwa tahajia ya kawaida ya Kiswahili.
- source_word: חַרְחוּר
  choice: Harhuri
  rationale: Ni jina la mtu au ukoo lenye maana ya kileksika isiyo hakika au isiyohusika moja kwa moja hapa; kwa hiyo limetoholewa badala ya kutafsiriwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi wa orodha. “Wazao wa” limetumiwa kwa maana pana ya kin genealogia; kiunganishi “na” kabla ya kundi la mwisho kinafanya orodha isomeke kwa kawaida. Alama ya mwisho imewekwa kama sentensi kamili kwa kuwa kifungu kimewasilishwa peke yake.
