translation:
  language: sw
  text: Wana wa Besai[a], wana wa Meunimu[b], wana wa Nefushesimu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Bessai.” Tahajia za Kiingereza hutofautiana kwa sababu ya kanuni tofauti za kunukuu majina na kulinganisha mapokeo sambamba ya maandishi.
    reason: lexical_alternative
  - marker: b
    text: Au “Wameuni,” ikiwa neno hili linaeleweka kuwa jina la kabila au kundi badala ya jina la ukoo lililonukuliwa.
    reason: lexical_alternative
  - marker: c
    text: Au “Nefusimu” katika baadhi ya mapokeo ya Kiingereza; “Nefushesimu” linawakilisha kwa karibu zaidi tahajia ya Kiebrania iliyo hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya koo za waliorejea, neno hili linaanzisha ukoo au jamaa. “Wana wa” linahifadhi muundo unaorudiwa wa Kiebrania bila kulifafanua kupita kiasi kuwa “wazao wa” au “watu wa jamaa ya.”
- source_word: בֵסַי
  choice: Besai
  rationale: Hili ni jina la ukoo; limenukuliwa kwa herufi za Kiswahili kwa namna inayokaribia umbo la Kiebrania.
- source_word: מְעוּנִים
  choice: Meunimu
  rationale: Ingawa umbo hili linaweza kumaanisha kundi la watu, hapa linatumika kama jina katika muundo wa orodha ya koo. Unukuzi “Meunimu” unahifadhi hali hiyo bila kulazimisha tafsiri ya kikabila.
- source_word: נפושסים
  choice: Nefushesimu
  rationale: Hili ni jina la ukoo au kundi. “Nefushesimu” linafuata konsonanti za maandishi ya Kiebrania na kulitohoa kwa matamshi ya kawaida ya Kiswahili.
