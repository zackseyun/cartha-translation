base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: sw
  text: Ukuta ulipokwisha kujengwa[b], nami nilipokwisha kuweka milango, walinzi wa malango, waimbaji, na Walawi waliteuliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walipangiwa” au “waliandikishwa”; kitenzi cha Kiebrania kinaweza kuwa na maana pana ya kiutawala kuliko uteuzi rasmi pekee.
    reason: lexical_alternative
  - marker: b
    text: Au “ulipojengwa.” Muundo wa Kiswahili “ulipokwisha kujengwa” unaonyesha kwamba kujengwa kwa ukuta kulitangulia uteuzi uliofuata katika simulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Baada ya
  rationale: Kifungu hiki kinaanzisha hali ya wakati katika simulizi. “Baada ya” kinaonyesha kwa Kiswahili cha kawaida kwamba matendo ya kukamilisha ukuta na kuweka milango yalitangulia upangaji wa watumishi.
- source_word: נִבְנְתָה הַחוֹמָה
  choice: ukuta kujengwa
  rationale: Niphal ya בנה ni ya kutendwa. “Ukuta” linabaki bila kuongeza “wa mji,” kwa kuwa maelezo hayo hayajasemwa wazi katika Kiebrania.
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: na mimi kuweka milango mahali pake
  rationale: Hiphil ya עמד hapa ina maana ya kusimamisha au kuweka mahali pake. Usemi huu unaeleza kufungwa/kusimikwa kwa milango bila kutumia “kufunga,” ambalo kwa Kiswahili lingeweza kueleweka kuwa kuifunga isiwe wazi.
- source_word: וַיִּפָּקְדוּ
  choice: walipewa majukumu yao
  rationale: Niphal ya פקד inaweza kumaanisha kuteuliwa, kupangiwa, au kuandikishwa. “Walipewa majukumu yao” ni usemi wa kawaida unaohifadhi maana pana ya upangaji wa kiutawala bila kudai kwa lazima uteuzi rasmi.
- source_word: הַשּׁוֹעֲרִים
  choice: walinzi wa malango
  rationale: Neno hili linawataja watu waliokuwa na jukumu la kulinda au kuhudumia malango; “walinzi wa malango” ni wazi na la kawaida katika muktadha huu.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Neno linalotokana na שׁיר linamaanisha waimbaji, mara nyingi wa ibada. “Waimbaji” ndilo neno la moja kwa moja na linaloeleweka.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la kikabila na kidini.
