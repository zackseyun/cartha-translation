base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: sw
  text: Naye mkuu wa mkoa akawaambia kwamba wasile katika vitu vitakatifu sana[b] mpaka atakaposimama kuhani mwenye Urimu na Thumimu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urimu na Thumimu ni istilahi za kikuhani zinazohusiana na kutafuta uamuzi kutoka kwa Mungu.
    reason: cultural_note
  - marker: b
    text: Yaani mafungu ya sadaka yaliyohesabiwa kuwa matakatifu sana na yaliyotengewa makuhani; si chumba cha ndani cha hekalu kinachoitwa Patakatifu pa Patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: mkuu wa mkoa
  rationale: Ni cheo cha utawala cha Kiajemi, si jina la mtu. Kutafsiri cheo kunatoa maana yake kwa Kiswahili cha sasa; umbo la asili linaelezwa katika tanbihi.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: kwamba wasile
  rationale: Kifungu hiki kinatoa yaliyomo katika agizo la mkuu wa mkoa; 'wasile' ni katazo la kawaida na la moja kwa moja katika Kiswahili.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: sehemu za vitu vitakatifu sana
  rationale: Katika muktadha huu, msemo huo unahusu mafungu ya sadaka takatifu yaliyotengewa makuhani, si chumba cha Patakatifu pa Patakatifu. 'Vitu vitakatifu sana' huhifadhi nguvu ya msemo wa Kiebrania, huku 'sehemu za' ikifafanua kile kinacholiwa.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: mpaka atakapotokea kuhani
  rationale: Muundo unaonyesha kikomo cha wakati cha baadaye. Nomino yenye kibainishi inaweza kutumiwa kwa maana ya jumla hapa, kwa hiyo 'kuhani' haimtambulishi lazima mtu fulani aliyetajwa awali.
- source_word: לְאוּרִים וְתוּמִּים
  choice: mwenye Urimu na Thumimu
  rationale: Majina ya vifaa hivi vya kikuhani yanahawirishwa kwa namna iliyozoeleka. 'Mwenye' huonyesha kuhani aliye navyo na mwenye uwezo wa kuvitumia bila kulazimisha maana finyu ya kihusishi.
theological_decisions:
- issue: Kinachorejelewa na קֹדֶשׁ הַקֳּדָשִׁים
  choice: mafungu ya sadaka takatifu sana yaliyoliwa na makuhani
  alternative: Patakatifu pa Patakatifu, yaani chumba cha ndani cha hekalu
  rationale: Muktadha unahusu watu ambao ukoo wao wa kikuhani haukuthibitishwa na haki yao ya kula chakula cha kikuhani. Kwa hiyo maneno hayo yanahusu chakula kitakatifu, si ruhusa ya kuingia katika patakatifu.
- issue: Cheo cha Kiajemi הַתִּרְשָׁתָא
  choice: mkuu wa mkoa
  alternative: Tirshatha
  rationale: Kutafsiri cheo kunawasilisha kazi ya mwenye cheo kwa uwazi; umbo la asili linahifadhiwa katika tanbihi kama mbadala halali.
- issue: Utambulisho wa kuhani wa baadaye
  choice: kuhani, kwa maana ya mhudumu wa cheo hicho bila kumtaja mtu mahususi
  alternative: yule kuhani, kama mtu maalumu anayejulikana
  rationale: Kibainishi cha Kiebrania kinaweza kuwa cha kijumla katika muktadha huu. Tafsiri haipaswi kumtambulisha mtu maalumu ambaye kifungu hakimtaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Mkuu wa mkoa' ni tafsiri ya kiutendaji ya cheo cha Kiajemi. Mpangilio wa viashiria umehakikisha kila tanbihi ina alama katika matini kuu.
