  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סוֹטַ֥י בְּנֵי סוֹפֶ֖רֶת בְּנֵ֥י פְרִידָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: sw
  text: 'Wazao wa watumishi wa Sulemani: wazao wa Sotai, wazao wa Soferethi, na wazao wa Perida.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha za ukoo na za waliorejea, neno hili mara nyingi humaanisha watu wa ukoo au familia fulani, si wana wa moja kwa moja tu. “Wazao wa” huwasilisha maana hiyo kwa Kiswahili cha kawaida huku ikidumisha muundo unaorudiwa wa Kiebrania.
- source_word: עַבְדֵי
  choice: watumishi wa
  rationale: Katika kirai hiki neno hilo ni jina la kundi la kurithi, yaani “watumishi wa Sulemani.” “Watumishi” ni la asili na halikazii utumwa kuliko muktadha unavyothibitisha.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: סוֹטַי
  choice: Sotai
  rationale: Jina la mtu au ukoo limetoholewa kulingana na matamshi ya maandishi ya Kiebrania.
- source_word: סוֹפֶרֶת
  choice: Soferethi
  rationale: Katika muktadha huu ni jina la ukoo, si nomino ya kawaida inayopaswa kutafsiriwa. Umbo “Soferethi” linafuata matamshi ya Kiebrania kwa tahajia inayosomeka kwa Kiswahili.
- source_word: פְרִידָא
  choice: Perida
  rationale: Jina limetoholewa moja kwa moja; irabu ya mwisho imehifadhiwa kwa umbo linalosomeka kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Wazao” limetumiwa badala ya “wana” ili kuonyesha kwamba orodha hii inahusu familia au koo pana. Kiunganishi “na” kabla ya kundi la mwisho kinaifanya orodha isomeke kwa kawaida bila kubadili maana.
