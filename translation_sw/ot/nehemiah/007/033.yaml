  text: the men of the other Nebo[a], fifty-two.
translation:
  language: sw
  text: Watu wa Nebo nyingine[a], hamsini na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nebo ile nyingine.” Kivumishi cha Kiebrania kinaweza kumaanisha “nyingine” au “ile nyingine”; hapa huenda kinatofautisha mahali hapa na Nebo iliyotajwa kwingine katika orodha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: Watu wa
  rationale: Katika orodha hii ya waliorejea, neno hili linataja watu au wawakilishi wa kaya waliotoka katika mahali fulani. “Watu wa” ni Kiswahili cha kawaida na cha asili zaidi kuliko “wanaume wa,” bila kulazimisha maana ya jinsia mahali ambapo orodha inasisitiza kundi la mahali.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Ni jina la mahali; limeandikwa kwa herufi za Kiswahili bila kutafsiriwa.
- source_word: אַחֵר
  choice: nyingine
  rationale: Kivumishi hiki kinaweza kumaanisha “nyingine” au “ile nyingine.” Hapa kinaonekana kutofautisha mahali hapa paitwapo Nebo na Nebo iliyotajwa kwingine katika orodha.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: hamsini na wawili
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kutaja idadi 52, ikipatana kisarufi na “watu.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo mfupi unaofaa orodha ya sensa. Uambatano “Watu wa” umetumiwa kwa lugha ya kawaida na yenye hadhi; utata wa אַחֵר umehifadhiwa katika tanbihi.
