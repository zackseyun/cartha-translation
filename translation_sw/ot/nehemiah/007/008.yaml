lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בֵּן katika hali ya kuunganisha majina, na hapa hutambulisha jamaa au ukoo katika orodha. “Wana wa” hudumisha muundo wa Kiebrania na kwa Kiswahili inaweza kueleweka kwa maana pana ya watu wa ukoo, si lazima watoto wa kiume waliozaliwa moja kwa moja.
- source_word: פַרְעֹשׁ
  choice: Paroshi
  rationale: Ni jina la mtu au babu wa ukoo; limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili badala ya kutafsiriwa.
- source_word: אַלְפַּיִם מֵאָה וְשִׁבְעִים וּשְׁנָיִם
  choice: 2,172
  rationale: Mfuatano wa namba za Kiebrania una jumla ya 2,172. Tarakimu zinafaa kwa uwazi na usomaji rahisi katika orodha ya sensa.
theological_decisions: []
translation_notes:
  register: Lugha ni fupi, yenye hadhi, na inafaa mtindo wa orodha ya sensa. “Wana wa” huhifadhi usemi wa chanzo, huku tanbihi ikifafanua maana yake ya ukoo.
