lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Huhifadhi muundo wa nasaba wa Kiebrania; katika orodha hii usemi huo unaweza pia kumaanisha wazao au watu wanaohusishwa na maeneo yaliyotajwa.
- source_word: לֹד
  choice: Lodi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: חָדִיד
  choice: Hadidi
  rationale: Jina la mahali limetoholewa moja kwa moja kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: וְאוֹנוֹ
  choice: na Ono
  rationale: Kiunganishi וְ kimetafsiriwa kuwa “na,” huku jina la mahali likitoholewa kuwa Ono.
- source_word: שְׁבַע מֵאוֹת וְעֶשְׂרִים וְאֶחָד
  choice: mia saba ishirini na mmoja
  rationale: Idadi 721 imeandikwa kwa maneno kwa mtindo wa orodha, kwa Kiswahili cha kawaida na kinachoeleweka.
