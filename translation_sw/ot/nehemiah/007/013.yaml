- source_word: זַתּוּא
  choice: Zatu
  rationale: Jina hili limetoholewa kwa mfumo wa kawaida wa Kiswahili; konsonanti maradufu ya unukuzi wa Kiingereza si lazima katika tahajia ya Kiswahili.
- source_word: שְׁמֹנֶה מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: mia nane arobaini na watano
  rationale: Mfuatano wa namba wa Kiebrania una thamani kamili ya 845. Muundo huu ni wa kawaida na unaoeleweka katika Kiswahili, huku upatanisho wa “watano” ukirejelea watu wanaohesabiwa.
