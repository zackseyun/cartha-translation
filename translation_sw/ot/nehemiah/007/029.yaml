translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kifupi na chenye hadhi inayofaa orodha ya sensa. “Watu wa” ni ya asili zaidi kuliko “wanaume wa” bila kubadili kazi ya kifungu katika orodha. Majina ya mahali yametoholewa badala ya kutafsiriwa.
