  text: 'the men of Kiriath-jearim[a], Kephirah, and Beeroth: 743'
translation:
  language: sw
  text: 'Watu wa Kiriath-yearimu, Kefira na Beerothi: 743.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: watu wa
  rationale: Katika orodha hii ya sensa, neno hili linawatambulisha watu wanaohusishwa na miji iliyotajwa. Kiswahili cha kawaida hutumia “watu wa”; “wanaume wa” kingekuwa cha moja kwa moja zaidi kijinsia lakini si cha asili katika muktadha huu.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-yearimu
  rationale: Jina la mahali limetoholewa kwa kufuata kwa karibu matamshi ya Kiebrania, huku sehemu ya pili ikibadilishwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: כְּפִירָה
  choice: Kefira
  rationale: Jina la mahali limetoholewa kutoka Kiebrania kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וּבְאֵרוֹת
  choice: na Beerothi
  rationale: Kiunganishi וּ kimetafsiriwa “na,” na jina la mahali limetoholewa kwa umbo linalosomeka kwa Kiswahili huku likihifadhi konsonanti zake kuu.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: '743'
  rationale: Nambari ya Kiebrania ni mia saba arobaini na tatu; tarakimu zinafaa kwa uwazi katika orodha ya sensa.
