id: NEH.7.72
reference: Nehemiah 7:72
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: sw
  text: Basi makuhani, Walawi, walinzi wa malango, waimbaji, baadhi ya watu, watumishi wa Hekalu[a], na Israeli wote wakaishi katika miji yao. Na mwezi wa saba ulipofika, wana wa Israeli[b] walikuwa katika miji yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wanethini,” jina la kimapokeo la kundi hili la watumishi wa Hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: wakaishi
  rationale: Kitenzi ישׁב hapa kinaeleza kukaa au kuishi mahali; “wakaishi” ni Kiswahili cha kawaida kinachofaa muktadha wa watu kurudi na kukaa katika miji yao.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa kundi la makuhani.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Jina hili la kikabila na la wahudumu wa ibada limezoeleka katika Kiswahili cha Biblia.
- source_word: הַשּׁוֹעֲרִים
  choice: walinzi wa malango
  rationale: Neno hilo linawataja waliopewa jukumu la kulinda malango; tafsiri hii inaeleweka wazi kuliko neno linaloweza kumaanisha wabeba mizigo.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Umbo hili linawataja watu walioimba, hasa katika huduma ya Hekalu.
- source_word: וּמִן הָעָם
  choice: baadhi ya watu
  rationale: Kirai hiki kwa maana halisi ni “na kutoka miongoni mwa watu,” kikionyesha sehemu ya watu tofauti na makundi ya wahudumu yaliyotajwa.
- source_word: הַנְּתִינִים
  choice: watumishi wa Hekalu
  rationale: Hili lilikuwa kundi maalumu lililohudumu Hekaluni. Kutaja kazi yao kunawasaidia wasomaji wa sasa, huku jina la kimapokeo likihifadhiwa katika tanbihi.
- source_word: וְכָל יִשְׂרָאֵל
  choice: na Israeli wote
  rationale: Inahifadhi jina la pamoja “Israeli” na maana ya watu wote wa agano katika muktadha huu.
- source_word: בְּעָרֵיהֶם
  choice: katika miji yao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali walipoishi.
- source_word: וַיִּגַּע הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: na mwezi wa saba ulipofika
  rationale: Ingawa נגע kimsingi huhusu kufikia au kugusa, ikitumiwa kuhusu wakati humaanisha mwezi ulifika. Muundo huu ni wa asili katika Kiswahili na unahifadhi kiunganishi cha Kiebrania.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inafuata kwa karibu kirai cha Kiebrania “wana wa Israeli,” ambacho hapa kinatumika kama jina la pamoja la watu wa Israeli.
theological_decisions:
- issue: Kirai cha pamoja chenye umbo la kiume בני ישראל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Kiebrania kinasema kwa karibu “wana wa Israeli,” lakini katika muktadha huu kirai kinawahusu watu wa Israeli kwa pamoja. Tafsiri kuu inahifadhi umbo la chanzo, na tanbihi inaonyesha maana yake ya kimuktadha.
- issue: Jina la kundi נתינים
  choice: watumishi wa Hekalu
  alternative: Wanethini
  rationale: Kutafsiri kazi ya kundi hili kunatoa maana kwa msomaji wa kawaida bila kulifanya kuwa kundi tofauti kwa msingi wa mafundisho; jina la kimapokeo linawekwa katika tanbihi kwa ajili ya ulinganisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Orodha imehifadhiwa kwa uwazi, maneno ya kitaasisi yamefafanuliwa kwa kazi yake, na urudiaji wa “katika miji yao” umeachwa kwa kuwa upo katika chanzo.
