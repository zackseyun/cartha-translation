lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo na sensa, neno hili kwa maana halisi ni “wana wa” na pia hutaja kundi la kifamilia; tafsiri hii inahifadhi muundo wa Kiebrania na inaeleweka kwa Kiswahili.
- source_word: עָדִין
  choice: Adini
  rationale: Ni jina la mtu au familia; limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: שֵׁשׁ מֵאוֹת
  choice: mia sita
  rationale: Huu ni muundo wa kawaida wa namba ya Kiebrania na umetafsiriwa moja kwa moja kwa Kiswahili sanifu.
- source_word: חֲמִשִּׁים וַחֲמִשָּׁה
  choice: hamsini na watano
  rationale: Kiebrania kinasema “hamsini na watano”; Kiswahili hutumia muundo huohuo kwa kawaida, na hivyo idadi kamili ya 655 imehifadhiwa.
