  text: 'Wana wa Pahath-Moabu[a], wa wana wa Yeshua na Yoabu: 2,818.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa Pahath-Moabu ... wazao wa Yeshua na Yoabu.” Neno la Kiebrania linalomaanisha “wana wa” mara nyingi hurejelea ukoo mpana, si watoto wa moja kwa moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo na sensa, neno hili linataja kundi la kifamilia au ukoo. “Wana wa” linahifadhi nahau ya Kiebrania, huku maana pana ya wazao ikifafanuliwa katika tanbihi.
- source_word: פַחַת מוֹאָב
  choice: Pahath-Moabu
  rationale: Ni jina maalumu, kwa hiyo limetoholewa badala ya kutafsiriwa. Umbo “Moabu” linafuata matumizi ya kawaida ya Kiswahili kwa jina מוֹאָב.
- source_word: לִבְנֵי
  choice: kutoka kwa wana wa
  rationale: Kiambishi ל־ hapa kinaonyesha mgawanyo au uhusiano wa ukoo ndani ya kundi la Pahath-Moabu. “Kutoka kwa” huonyesha kwamba watu hao walitokana na matawi ya Yeshua na Yoabu bila kulazimisha ufafanuzi wa ziada.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Jina limetoholewa kulingana na umbo la Kiebrania la baada ya uhamisho, badala ya kulibadili kuwa Yoshua, ambalo huwakilisha umbo refu tofauti.
- source_word: וְיוֹאָב
  choice: na Yoabu
  rationale: Kiunganishi וְ kimetafsiriwa “na,” na jina יוֹאָב limetoholewa katika umbo la kawaida la Kiswahili, “Yoabu.”
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: 2,818
  rationale: Idadi ya Kiebrania ni elfu mbili, mia nane na kumi na nane. Tarakimu hurahisisha usomaji katika orodha ya sensa na kuhifadhi idadi kamili.
