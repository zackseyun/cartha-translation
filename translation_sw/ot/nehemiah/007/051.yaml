lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha ya nasaba au sensa, wingi huu wa בֵּן unaweza kumaanisha wana, wazao, au watu wa ukoo fulani. “Wana wa” hudumisha muundo wa Kiebrania na ni lugha ya kawaida katika orodha za kibiblia za Kiswahili.
- source_word: גַזָּם
  choice: Gazamu
  rationale: Jina la mtu au babu wa ukoo; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: עֻזָּא
  choice: Uza
  rationale: Jina maalumu limetoholewa moja kwa moja kutoka Kiebrania kwa mfumo wa sauti unaofaa Kiswahili.
- source_word: פָסֵחַ
  choice: Pasea
  rationale: Jina maalumu limetoholewa kwa namna inayokaribia matamshi ya Kiebrania na iliyo rahisi kusomwa kwa Kiswahili.
