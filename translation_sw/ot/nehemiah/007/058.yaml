- source_word: גִדֵּל
  choice: Gideli
  rationale: Ni jina la mtu lililotoholewa kutoka Kiebrania; konsonanti mbili ya kati ya uandishi wa Kilatini haikuhitajika katika tahajia ya kawaida ya Kiswahili.
