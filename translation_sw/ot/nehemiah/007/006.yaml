base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: sw
  text: 'Hawa ndio watu wa jimbo waliopanda kutoka katika uteka wa watu waliohamishwa[a], ambao Nebukadneza, mfalme wa Babeli, alikuwa amewapeleka uhamishoni. Nao wakarudi[b] Yerusalemu na Yuda, kila mmoja akaenda mji wake[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa ulaini zaidi, “kutoka uhamishoni.” Kiebrania kina nomino mbili zinazohusiana, kwa maana halisi zaidi, “kutoka katika uteka wa waliohamishwa.”
    reason: lexical_alternative
  - marker: b
    text: 'Inaweza pia kuunganishwa na sentensi iliyotangulia: “na ambao walirudi.”'
    reason: syntactic_alternative
  - marker: c
    text: Kwa Kiebrania, “kila mwanamume kwenda mji wake.” Ni usemi wa kugawa unaowarejelea warudi pamoja na kaya au jamaa zao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: watu wa jimbo
  rationale: Ingawa muundo wa Kiebrania ni kihalisi ‘wana wa jimbo,’ hapa ni nahau inayowatambulisha watu waliokuwa wa jimbo hilo. ‘Watu wa jimbo’ ni Kiswahili cha kawaida na chenye hadhi bila kudokeza kwamba wote walikuwa wana wa kiume.
- source_word: הָעֹלִים
  choice: waliopanda
  rationale: Kitenzi עלה huhifadhi taswira ya kupanda kuelekea nchi na Yerusalemu; ‘waliopanda’ ni ya asili katika muktadha huu.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: kutoka katika uteka wa watu waliohamishwa
  rationale: Tafsiri hii inahifadhi nomino zote mbili zinazohusiana—uteka na kuhamishwa—badala ya kuzifupisha zote kuwa ‘uhamishoni.’
- source_word: אֲשֶׁר הֶגְלָה
  choice: ambao ... alikuwa amewapeleka uhamishoni
  rationale: Hifil ya גלה inaonyesha kuondolewa kwa nguvu na kupelekwa uhamishoni; wakati timilifu ‘alikuwa amewapeleka’ unaonyesha tendo lililotangulia kurudi kwao.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nebukadneza
  rationale: Hili ndilo umbo la jina linalotambulika na kutumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וַיָּשׁוּבוּ
  choice: Nao wakarudi
  rationale: Kitenzi שׁוב maana yake ya msingi hapa ni kurudi. Muundo huu unaendeleza simulizi la Kiebrania kwa Kiswahili cha kawaida.
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: Yerusalemu na Yuda
  rationale: Yuda hapa ni eneo pana zaidi, na Yerusalemu ni mahali palipotajwa kando yake; marudio ya kihusishi cha Kiebrania hayahitaji kurudiwa katika Kiswahili.
- source_word: אִישׁ לְעִירוֹ
  choice: kila mtu katika mji wake
  rationale: Huu ni usemi wa kugawa unaoonyesha kwamba kila mmoja alirudi katika mji wake. ‘Kila mtu’ ni Kiswahili cha asili, huku tanbihi ikieleza umbo la kiume la Kiebrania.
theological_decisions:
- issue: Lugha wakilishi ya kiume katika אִישׁ
  choice: kila mtu katika mji wake
  alternative: kila mwanamume katika mji wake
  rationale: Katika muktadha huu אִישׁ inafanya kazi kwa maana ya kugawa miongoni mwa warudi, yaani watu na kaya zao, si kwa kusisitiza jinsia. ‘Kila mtu’ huwasilisha kazi hiyo bila kuondoa umbo halisi, ambalo limewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi na orodha ya kihistoria. Sentensi imegawanywa baada ya kifungu kuhusu Nebukadneza ili iwe wazi na isomeke kwa urahisi, huku kiunganishi ‘Nao’ kikihifadhi mwendelezo wa Kiebrania.
