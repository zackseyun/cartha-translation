base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: sw
  text: 'Waliokuja pamoja na Zerubabeli walikuwa: Yeshua, Nehemia, Azaria, Raamia[a], Nahamani, Mordekai, Bilshani, Misperethi, Bigwai, Nehumu[b], na Baana. Idadi ya wanaume wa watu wa Israeli:[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha sambamba ya Ezra 2:2, jina hili linaonekana kama Reelaia.
    reason: alternative_reading
  - marker: b
    text: Katika orodha sambamba ya Ezra 2:2, jina hili linaonekana kama Rehumu.
    reason: alternative_reading
  - marker: c
    text: Kirai hiki kinaanzisha orodha ya hesabu, ambayo inaendelea katika aya inayofuata.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים עִם
  choice: waliokuja pamoja na
  rationale: Kirai cha Kiswahili kinaonyesha kundi maalumu lililokuja likifuatana na Zerubabeli; “pamoja na” ni usemi wa kawaida wa kuonyesha uandamani.
- source_word: זְרֻבָּבֶל
  choice: Zerubabeli
  rationale: Jina limetoholewa kwa umbo linalotambulika na linalotamkika kwa kawaida katika Kiswahili.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Unukuzi huu unaakisi jina la Kiebrania na humtofautisha mhusika huyu na wale wanaojulikana kwa kawaida kwa jina Yoshua katika Kiswahili.
- source_word: רַעַמְיָה
  choice: Raamia
  rationale: Maandishi makuu yanafuata umbo la jina katika WLC ya Nehemia; tofauti ya orodha sambamba imehifadhiwa katika tanbihi.
- source_word: נַחֲמָנִי
  choice: Nahamani
  rationale: Jina limenukuliwa kulingana na matamshi yaliyoonyeshwa katika maandishi ya Kiebrania.
- source_word: מִסְפֶּרֶת
  choice: Misperethi
  rationale: Ni jina maalumu; umbo hili la Kiswahili linahifadhi kwa karibu konsonanti za jina la Kiebrania huku likiwezesha kutamkwa kwa kawaida.
- source_word: נְחוּם
  choice: Nehumu
  rationale: Maandishi makuu yanafuata jina lililo katika Nehemia 7:7 badala ya kulipatanisha kimya kimya na Rehumu la Ezra 2:2.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Idadi ya wanaume wa watu wa Israeli
  rationale: Tafsiri inahifadhi neno la kiume אַנְשֵׁי, pamoja na kirai עַם יִשְׂרָאֵל, bila kulifanya kuwa neno la jumla lisiloonyesha jinsia.
theological_decisions:
- issue: Lugha yenye jinsia katika אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: wanaume wa watu wa Israeli
  alternative: watu wa Israeli; wanaume wa Israeli
  rationale: Kiebrania kinatumia wazi wingi wa kiume “wanaume wa” kabla ya “watu wa Israeli.” Tafsiri inalinda maelezo hayo ya chanzo bila kuyafanya madai mapana ya kiteolojia.
- issue: Tofauti za majina katika orodha sambamba ya Ezra 2:2
  choice: Kufuata majina ya maandishi ya Nehemia katika sehemu kuu
  alternative: Kuyapatanisha na Reelaia na Rehumu katika Ezra 2:2
  rationale: Kipaumbele kimetolewa kwa maandishi ya Kiebrania ya aya inayotafsiriwa; tofauti muhimu za orodha sambamba zimeonyeshwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina yametoholewa kwa uangalifu ili yabaki karibu na Kiebrania na pia yatamkike kwa kawaida katika Kiswahili. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno au kirai kinachohusika.
