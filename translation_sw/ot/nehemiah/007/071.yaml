id: NEH.7.71
reference: Nehemiah 7:71
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: sw
  text: Na kile ambacho watu waliosalia walitoa kilikuwa dariki elfu ishirini za dhahabu[a], mina elfu mbili za fedha[b], na kanzu sitini na saba za makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dariki ilikuwa sarafu ya dhahabu ya Uajemi.
    reason: cultural_note
  - marker: b
    text: Mina ilikuwa kipimo cha kale cha uzito, na pia kitengo cha thamani ya fedha.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: Na kile ambacho ... walitoa kilikuwa
  rationale: Muundo huu unahifadhi kishazi rejeshi cha Kiebrania kinachoanzisha sehemu nyingine ya orodha, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: שְׁאֵרִית הָעָם
  choice: watu wengine
  rationale: Katika orodha hii ya michango, kifungu kinamaanisha sehemu iliyobaki ya watu baada ya watoaji waliotajwa awali, si lazima 'mabaki' kwa maana ya kitheolojia.
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: dariki ... za dhahabu
  rationale: Neno mahususi la sarafu ya dhahabu ya Uajemi limehifadhiwa kwa usahihi wa kihistoria badala ya kutumia neno la jumla 'sarafu'.
- source_word: שְׁתֵּי רִבּוֹא
  choice: elfu ishirini
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kutaja idadi ambayo kwa Kiebrania ni 'makumi elfu mawili'.
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: mina elfu mbili za fedha
  rationale: Kipimo cha kale מָנִים kimetoholewa kama 'mina' bila kukibadilisha kuwa kipimo cha kisasa kisicho sawa kabisa.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: kanzu ... za makuhani
  rationale: Kanzu ni neno la asili na linaloeleweka kwa vazi refu la aina ya כָּתְנֹת; uhusiano na makuhani umeachwa bila kuongeza dai kwamba yalikuwa mavazi maalumu ya ibada.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: sitini na saba
  rationale: Hii ni namna ya kawaida ya Kiswahili cha sasa ya kutaja idadi hiyo.
theological_decisions:
- issue: Maana ya שְׁאֵרִית katika muktadha huu
  choice: watu wengine
  alternative: mabaki ya watu
  rationale: Muktadha wa orodha unatofautisha kundi hili na watoaji waliotangulia. Tafsiri 'mabaki' ingeweza kudokeza dhana ya kitheolojia ya mabaki waaminifu ambayo mstari wenyewe hailazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Istilahi za kale 'dariki' na 'mina' zimehifadhiwa na kufafanuliwa katika tanbihi; sentensi imeundwa kwa urahisi bila kupoteza muundo wa orodha.
