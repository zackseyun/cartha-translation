id: NEH.7.64
reference: Nehemiah 7:64
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: sw
  text: Hawa walitafuta hati yao katika orodha ya nasaba[a], lakini haikupatikana; kwa hiyo waliondolewa katika ukuhani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hati yao ya nasaba.” Kiebrania kinazungumzia hati iliyoandikwa iliyotumiwa kuthibitisha ukoo.
    reason: lexical_alternative
  - marker: b
    text: Au, “walikataliwa kuwa makuhani.” Kitenzi cha Kiebrania hapa kinaonyesha kwamba hawakukubaliwa kuwa na hadhi ya kikuhani kwa sababu ukoo wao haukuweza kuthibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa
  rationale: Kiwakilishi cha kuonyesha cha wingi kinawarejelea watu waliotajwa katika mistari iliyotangulia bila kuongeza nomino ambayo haipo katika Kiebrania.
- source_word: בִּקְשׁוּ
  choice: walitafuta
  rationale: Kitenzi בקשׁ hapa kina maana ya kutafuta hati iliyohitajika ili kuthibitisha ukoo wao.
- source_word: כְתָבָם
  choice: hati yao
  rationale: כְּתָב ni maandishi au hati iliyoandikwa; katika muktadha huu ni hati rasmi ya kuthibitisha ukoo. ‘Hati’ ni ya kawaida na haibainishi mno aina yake.
- source_word: הַמִּתְיַחְשִׂים
  choice: katika orodha ya nasaba
  rationale: Kishirikishi cha hitpaeli cha יחס kinahusu kuandikishwa au kuthibitishwa kwa kufuata ukoo. Tafsiri hii inawasilisha kwa uwazi muktadha wa kiutawala na wa nasaba, huku tanbihi ikihifadhi uwezekano wa kuunganisha kifungu hiki moja kwa moja na ‘hati yao.’
- source_word: וְלֹא נִמְצָא
  choice: lakini haikupatikana
  rationale: Kitenzi cha umoja cha hali ya kutendwa kinarejelea kwa kawaida hati iliyotafutwa, si watu wenyewe.
- source_word: וַיְגֹאֲלוּ
  choice: waliondolewa
  rationale: Katika muktadha huu, kitenzi kinamaanisha kutambuliwa kuwa hawafai au kunyimwa hadhi ya kikuhani kwa sababu ukoo wao haukuthibitishwa. ‘Waliondolewa’ linaeleza matokeo bila kulazimisha maana ya unajisi wa kiibada.
- source_word: מִן הַכְּהֻנָּה
  choice: katika ukuhani
  rationale: כְּהֻנָּה ni ukuhani au cheo cha kikuhani; muundo ‘waliondolewa katika ukuhani’ ni wa asili katika Kiswahili na huhifadhi maana ya kitaasisi.
theological_decisions:
- issue: Maana ya וַיְגֹאֲלוּ kuhusu hadhi yao ya kikuhani
  choice: waliondolewa katika ukuhani
  alternative: walihesabiwa kuwa najisi kwa ukuhani / walikataliwa kuwa makuhani
  rationale: Muktadha unaonyesha kwamba kutothibitishwa kwa nasaba kuliwazuia kutambuliwa au kutumika kama makuhani. Tafsiri kuu inaeleza matokeo hayo bila kudai kwamba watu hao walikuwa najisi kimaadili au kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye staha. ‘Hati,’ ‘orodha ya nasaba,’ na ‘ukuhani’ ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi mazingira rasmi ya kifungu.
source_grounding:
  english_pob_role: consult_only
