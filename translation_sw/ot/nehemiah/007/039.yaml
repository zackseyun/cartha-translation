translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo mfupi wa orodha ya sensa. Lugha ni ya sasa na yenye heshima; “jamaa” limetumiwa kuonyesha nyumba au mstari wa familia bila kuifanya iwe jengo halisi.
