  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: sw
  text: 'Makuhani: wana wa Yedaya[a], wa ukoo wa Yeshua[b], mia tisa sabini na watatu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “wana wa” linaweza kumaanisha wazao au watu wa ukoo, si wana wa moja kwa moja tu.
    reason: lexical_alternative
  - marker: b
    text: Jina “Yeshua” pia linaweza kutolewa kama “Yoshua,” lakini “Yeshua” linaakisi kwa karibu zaidi umbo la Kiebrania linalotumika katika muktadha huu wa baada ya uhamisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Makuhani
  rationale: Nomino ya wingi yenye kibainishi inaanzisha kundi katika orodha ya sensa; muundo wa orodha hauhitaji kuongeza kitenzi.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika muktadha wa nasaba na sensa, neno hili linaweza kumaanisha wazao au watu wa ukoo, huku “wana wa” likihifadhi muundo wa Kiebrania.
- source_word: יְדַעְיָה
  choice: Yedaya
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na kanuni za tahajia ya Kiswahili.
- source_word: לְבֵית יֵשׁוּעַ
  choice: wa jamaa ya Yeshua
  rationale: בַּיִת pamoja na jina la mtu hapa huonyesha nyumba, ukoo, au mstari wa familia; “jamaa” ni ya asili katika Kiswahili cha orodha ya nasaba.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Utohozi huu unaakisi umbo maalumu la jina la Kiebrania יֵשׁוּעַ katika mazingira ya baada ya uhamisho.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: mia tisa sabini na watatu
  rationale: Mfuatano wa namba una jumla ya 973; umbo hili ni la kawaida na wazi katika Kiswahili.
