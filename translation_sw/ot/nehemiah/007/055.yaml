  text: the sons of Barkos[a], the sons of Sisera, the sons of Temah.
translation:
  language: sw
  text: wana wa Barkosi, wana wa Sisera, wana wa Tema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni hali ya wingi ya muundo tegemezi ya בֵּן. Katika orodha ya ukoo inaweza kumaanisha wana, wazao, au watu wa jamaa fulani; “wana wa” huhifadhi kwa uwazi muundo wa Kiebrania bila kufasiri zaidi.
- source_word: בַרְקוֹס
  choice: Barkosi
  rationale: Jina la ukoo au la mtu limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Jina maalumu limetoholewa kwa umbo lililozoeleka katika Kiswahili; hapa linataja kundi la kifamilia katika orodha.
- source_word: תָמַח
  choice: Tema
  rationale: Jina maalumu limetoholewa kwa kuzingatia matamshi ya maandishi ya Kiebrania ya WLC. Tofauti ya Kiingereza “Tamah” haiwakilishi tofauti muhimu katika maandishi ya Kiebrania na haihitaji tanbihi ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Mtindo mfupi na wenye hadhi wa orodha umehifadhiwa. Kirai “wana wa” kimerudiwa kama katika Kiebrania, ingawa kwa muktadha kinaweza kuhusisha wazao au jamaa, si lazima wana wa moja kwa moja.
