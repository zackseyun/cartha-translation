base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: sw
  text: 'Kisha Mungu wangu akaweka moyoni mwangu kuwakusanya wakuu, maafisa, na watu ili waandikishwe kulingana na nasaba zao.[a] Nami nikapata kitabu cha nasaba cha wale waliopanda mwanzoni,[b] nami nikakuta imeandikwa ndani yake:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili wajisajili kwa nasaba.” Kiebrania kinahusu kuandikishwa rasmi kulingana na ukoo wa familia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kumbukumbu ya nasaba ya wale waliopanda hapo mwanzo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: Kisha Mungu wangu akaweka moyoni mwangu
  rationale: Hii ni nahau ya Kiebrania inayosema kihalisi kwamba Mungu ‘alitoa kwa moyo wangu.’ Tafsiri hii ni ya kawaida katika Kiswahili, inadumisha uanzilishi wa Mungu na msukumo wa ndani, bila kuufafanua kama ufunuo rasmi.
- source_word: וָאֶקְבְּצָה
  choice: kuwakusanya
  rationale: Umbo hili linaeleza jambo ambalo Mungu alimchochea Nehemia kulifanya. Kitenzi ‘kuwakusanya’ kinaunganika kwa kawaida na nahau iliyotangulia na kudumisha wazo la kusudi.
- source_word: הַחֹרִים
  choice: wakuu
  rationale: Katika muktadha wa Nehemia, neno hili linawahusu watu wenye hadhi na uongozi katika jamii, si watu huru kwa ujumla. ‘Wakuu’ ni neno la sasa na lenye heshima.
- source_word: הַסְּגָנִים
  choice: maafisa
  rationale: Neno hili linamaanisha watawala wa ngazi ya chini au watendaji wa kiutawala. ‘Maafisa’ linaeleweka kwa urahisi na linafaa katika muktadha wa utawala wa mji.
- source_word: הָעָם
  choice: watu
  rationale: Hii ndiyo tafsiri ya kawaida katika muktadha huu na inatofautisha jamii kwa ujumla na wakuu pamoja na maafisa.
- source_word: לְהִתְיַחֵשׂ
  choice: ili waandikishwe kulingana na nasaba zao
  rationale: Hitpaeli ya יחס inaeleza kuthibitishwa au kuandikishwa rasmi kwa msingi wa ukoo. Kauli hii inaonyesha mchakato wa usajili na msingi wake wa kifamilia.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: kitabu cha nasaba
  rationale: Hiki ni kitabu halisi cha kumbukumbu za ukoo. Tafsiri hii ni fupi, rasmi kiasi, na inabaki karibu na muundo wa Kiebrania.
- source_word: הָעוֹלִים
  choice: wale waliopanda
  rationale: Kirai hiki kinawahusu waliorudi kutoka uhamishoni kwenda Yuda na Yerusalemu. ‘Waliopanda’ inadumisha picha ya Kiebrania ya kupanda kwenda katika nchi au mji bila kuibadili moja kwa moja kuwa ‘waliorudi.’
- source_word: בָּרִאשׁוֹנָה
  choice: kwanza
  rationale: Katika muktadha huu kinaonyesha kundi la kwanza la waliopanda. ‘Kwanza’ ni cha kawaida na kifupi.
- source_word: וָאֶמְצָא כָּתוּב בּוֹ
  choice: 'nami nikakuta imeandikwa ndani yake:'
  rationale: Kauli hii inatanguliza yaliyomo katika hati yanayofuata. Kurudia ‘nami’ kunadumisha mfuatano wa Kiebrania na koloni linaonyesha kwamba orodha inafuata.
theological_decisions:
- issue: Lugha ya msukumo wa Mungu katika uongozi wa Nehemia
  choice: Mungu wangu akaweka moyoni mwangu
  alternative: Mungu wangu akanipa moyoni mwangu; Mungu akaniongoza kwa ufunuo
  rationale: Kiebrania kinaonyesha tendo la Mungu kama msukumo wa ndani lakini hakitaji namna ya ufunuo. Tafsiri iliyochaguliwa inadumisha mvutano huo bila kudai ufunuo rasmi wala kuufanya kuwa wazo la Nehemia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Wakuu’ na ‘maafisa’ yanafaa kwa mazingira ya kiraia na kiutawala; ‘nasaba’ ni neno lililozoeleka katika matini za Biblia na linafafanuliwa kwa ‘ukoo wa familia’ katika tanbihi.
