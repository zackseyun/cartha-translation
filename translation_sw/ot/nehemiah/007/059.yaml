lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha ya nasaba na koo, wingi wa בֵּן mara nyingi humaanisha watu wa ukoo au kizazi fulani, wala si wana wa moja kwa moja tu. “Wazao wa” ni Kiswahili cha kawaida na sahihi kwa maana hiyo.
- source_word: שְׁפַטְיָה
  choice: Shefatia
  rationale: Jina limetoholewa kwa kufuata sauti za Kiebrania na mazoea ya majina ya Biblia katika Kiswahili.
- source_word: חַטִּיל
  choice: Hatili
  rationale: Jina la mtu au ukoo limetoholewa badala ya kutafsiriwa.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Pokereth-hasebaimu
  rationale: Kirai kimehifadhiwa kama jina la ukoo lenye sehemu mbili; kistari kinaonyesha uhusiano wa karibu wa sehemu hizo huku utata wa muundo wake ukihifadhiwa.
- source_word: אָמֽוֹן
  choice: Amoni
  rationale: Jina la ukoo limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili, bila kulichukulia kama nomino ya kawaida.
