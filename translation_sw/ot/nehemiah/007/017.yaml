lexical_decisions:
- source_word: בְּנֵי
  choice: Wazao wa
  rationale: Katika orodha hii ya ukoo na sensa, neno hili linamaanisha watu wa ukoo au jamaa ya mtu aliyetajwa, si lazima wana wake wa moja kwa moja. “Wazao wa” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: עַזְגָּד
  choice: Azgadi
  rationale: Jina hili limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku sauti kuu za jina la Kiebrania zikihifadhiwa.
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 2,322
  rationale: Mfuatano wa namba wa Kiebrania unatoa jumla ya elfu mbili mia tatu ishirini na mbili; tarakimu zinaonyesha idadi ya sensa kwa uwazi na ufupi.
