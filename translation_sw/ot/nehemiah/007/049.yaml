  text: the sons of Hanan[a], the sons of Giddel, the sons of Gahar—
translation:
  language: sw
  text: wana wa Hanan[a], wana wa Gideli, wana wa Gahari—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wa,” katika kila marudio ya “wana wa”; kauli hii ya Kiebrania ya kutaja ukoo inaweza kumaanisha familia au nasaba, si watoto wa kiume wa moja kwa moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo, wingi wa neno בֵּן katika hali ya kuunganisha hutaja watu wa familia, ukoo, au wazao wa mtu aliyetajwa. “Wana wa” huhifadhi muundo unaorudiwa wa Kiebrania, huku tanbihi ikifafanua maana yake pana.
- source_word: חָנָן
  choice: Hanani
  rationale: Jina la mtu au ukoo limetoholewa kwa tahajia ya kawaida ya Kiswahili; umbo “Hanani” husaidia kuonyesha silabi ya mwisho ya Kiebrania חָנָן bila kulichanganya na jina tofauti.
- source_word: גִדֵּל
  choice: Gideli
  rationale: Jina limetoholewa kwa mfumo wa sauti unaosomeka kwa urahisi katika Kiswahili, likihifadhi konsonanti na vokali kuu za Kiebrania.
- source_word: גָחַר
  choice: Gahari
  rationale: Jina limetoholewa kwa Kiswahili kwa kuhifadhi mpangilio wa konsonanti za Kiebrania na kuongeza vokali ya mwisho ili liweze kutamkwa kwa kawaida.
