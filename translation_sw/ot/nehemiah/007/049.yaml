translation_notes:
  register: Lugha ni rasmi lakini ya kawaida kwa orodha ya majina. Marudio ya “wana wa” yamehifadhiwa ili kufuata muundo wa Kiebrania, na majina yametoholewa kwa tahajia inayotamkika katika Kiswahili sanifu cha Afrika Mashariki.
