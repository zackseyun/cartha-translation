  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: sw
  text: Jumla ya watumishi wa Hekalu[a] na wana wa watumishi wa Sulemani ilikuwa mia tatu tisini na mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wanethini,” istilahi ya jadi inayohamisha kwa herufi za Kiswahili jina la Kiebrania la kundi la watumishi wa Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: wote
  rationale: Neno hili linatanguliza jumla ya makundi yaliyotajwa; “wote” ni tafsiri fupi na ya kawaida katika orodha ya sensa.
- source_word: הַנְּתִינִים
  choice: watumishi wa Hekalu
  rationale: Neno hili linataja kundi maalumu lililohudumu katika Hekalu. Tafsiri ya kazi yao inaeleweka kwa urahisi kuliko kulinakili tu kwa herufi za Kiswahili; jina la jadi limehifadhiwa katika tanbihi.
- source_word: וּבְנֵי
  choice: na wana wa
  rationale: Tafsiri hii inahifadhi muundo halisi wa Kiebrania na huenda pia ilikuwa jina rasmi la kundi katika orodha hii.
- source_word: עַבְדֵי
  choice: watumishi
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Hapa ni sehemu ya jina la kundi la kijamii na kiutawala, hivyo “watumishi” ni ya kawaida na haiongezi msisitizo usiokuwamo juu ya hali ya utumwa.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: mia tatu tisini na wawili
  rationale: Idadi ya Kiebrania imetolewa kwa maneno kwa mtindo wa kawaida wa maandishi ya Biblia; upatanisho wa “wawili” unarejelea watu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hekalu” limeandikwa kwa herufi kubwa kwa kuwa linarejelea Hekalu la Yerusalemu. Muundo “wana wa” umehifadhiwa badala ya kuufafanua kuwa “wazao wa,” ili kutodhoofisha uwezekano kwamba hili ni jina rasmi la kundi.
