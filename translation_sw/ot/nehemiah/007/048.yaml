translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo mfupi wa orodha umehifadhiwa. “Wazao wa” limetumiwa badala ya “wana wa” ili kuwasilisha maana pana ya fomula ya ukoo kwa lugha ya kawaida, huku tafsiri halisi ikitajwa katika tanbihi.
