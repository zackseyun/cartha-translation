  text: wazao wa Lebana[a], wazao wa Hagaba, wazao wa Shalmai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wana wa,” katika kila tukio la usemi huu katika mstari; katika orodha za ukoo usemi huo unaweza kumaanisha wazao au watu wa ukoo fulani.
    reason: lexical_alternative
  - marker: b
    text: Katika orodha inayolingana, jina hili huandikwa “Salmai.” Hapa maandishi ya Kiebrania ya Nehemia yana “Shalmai.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha hii ya ukoo, neno hili linaweza kumaanisha watu wa familia au ukoo, si lazima wana wa kiume wa moja kwa moja. “Wazao wa” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania; he ya mwisho inaonyesha hasa irabu ya mwisho na haihitaji kuandikwa kama konsonanti katika tahajia ya Kiswahili.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Jina limetoholewa moja kwa moja kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: שַׁלְמָי
  choice: Shalmai
  rationale: Tahajia hii huhifadhi sauti ya שׁ kama “sh” na irabu za mapokeo ya Kimasora.
