source:
  edition: WLC
  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: sw
  text: 'Na kutoka kwa makuhani: wazao wa Hobaya, wazao wa Hakosi, na wazao wa Barzilai, aliyemwoa mmoja wa binti za Barzilai Mgileadi, akaitwa kwa jina lao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaitwa kwa jina la familia yao.”
    reason: Kiwakilishi cha wingi katika Kiebrania kinaelekeza kwa familia ya binti za Barzilai; namna ya kueleza uhusiano huo inaweza kutafsiriwa kwa uwazi zaidi kama jina la familia yao.
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: Na kutoka kwa makuhani
  rationale: Inahifadhi maana ya sehemu ya kundi inayotolewa na מִן na kuanzisha familia za kikuhani katika orodha.
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha ya nasaba, בְּנֵי huonyesha ukoo au familia, si lazima wana wa moja kwa moja; “wazao wa” ni wazi na ya kawaida kwa Kiswahili.
- source_word: חֳבַיָּה
  choice: Hobaya
  rationale: Unukuzi wa jina la Kiebrania unaolingana na mfumo wa sauti wa Kiswahili.
- source_word: הַקּוֹץ
  choice: Hakosi
  rationale: Unukuzi wa jina la ukoo wa kikuhani, huku herufi ya makala ikihifadhiwa kama sehemu ya jina lililozoeleka.
- source_word: בַרְזִלַּי
  choice: Barzilai
  rationale: Jina limenukuliwa kwa namna ileile katika kutaja ukoo na Barzilai wa Gileadi.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: aliyemwoa mmoja wa binti za
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya nahau ya Kiebrania ya kumchukua mwanamke kuwa mke, bila kupoteza kwamba alikuwa mmoja wa binti wa familia hiyo.
- source_word: הַגִּלְעָדִי
  choice: Mgileadi
  rationale: Kivumishi cha asili kinamtambulisha Barzilai kuwa mtu wa Gileadi; “Mgileadi” ni kifupi na cha asili katika Kiswahili.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: akaitwa kwa jina lao
  rationale: Inahifadhi hali tendwa ya קרא na wingi wa kiwakilishi, bila kufafanua kupita kiasi namna hasa jina hilo lilivyorithiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya orodha ya nasaba lakini kinachoeleweka kwa wasomaji wa sasa. “Wazao” limetumiwa badala ya “wana” ili kuonyesha familia au koo za vizazi mbalimbali. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
