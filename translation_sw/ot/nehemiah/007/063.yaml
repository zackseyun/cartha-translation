  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa orodha ya Kiebrania: kundi la kikuhani, koo tatu, na kishazi elezi kinachomhusu Barzilai. “Wazao wa” hutoa maana inayofaa ya בני katika muktadha wa ukoo, na “aliyemwoa mmoja wa binti za Barzilai Mgileadi” hueleza kwa usahihi idiomu ya kumchukua mwanamke kuwa mke. “Akaitwa kwa jina lao” huhifadhi hali tendwa na kiwakilishi cha wingi bila kuondoa utata wa marejeo zaidi ya ulivyo katika chanzo.'
