  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: sw
  text: Nikawaambia, “Malango ya Yerusalemu yasifunguliwe mpaka jua liwe kali[a]. Wakiwa bado wamesimama kwenye zamu, waifunge milango na waifunge imara[b]. Wateue walinzi[c] kutoka miongoni mwa wakazi wa Yerusalemu, kila mmoja kwenye zamu yake na kila mmoja mbele ya nyumba yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka jua lipate joto,” yaani si mara tu baada ya kuchomoza, bali baadaye asubuhi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “wazishike”; katika muktadha huu maana yake ni kuifunga milango imara baada ya kuifunga.
    reason: lexical_alternative
  - marker: c
    text: Au “waweke zamu za ulinzi kutoka miongoni mwa wakazi wa Yerusalemu.” Neno la Kiebrania linaweza kumaanisha walinzi au zamu za ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּתְחוּ
  choice: yasifunguliwe
  rationale: Kauli ya kutendwa ya Kiswahili inalingana na Niphal ya Kiebrania, na umbo la kukataza linaonyesha agizo lenye nguvu.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: Malango ya Yerusalemu
  rationale: Muundo huu wa kawaida unaonyesha wazi malango ya mji.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: mpaka jua liwe kali
  rationale: Huhifadhi taswira halisi ya joto la jua na kuashiria wakati wa baadaye asubuhi, si mara tu jua linapochomoza.
- source_word: וְעַד הֵם עֹמְדִים
  choice: Wakiwa bado wamesimama kwenye zamu
  rationale: Neno עמד ni ‘kusimama,’ lakini katika muktadha wa ulinzi linahusu kuwa kazini au kwenye zamu; tafsiri hii huhifadhi picha hiyo na kuufanya muktadha uwe wazi.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: wafunge milango
  rationale: הגיף humaanisha kufunga, hasa milango; Kiswahili hiki ni cha kawaida na kinafaa kwa agizo.
- source_word: וֶאֱחֹזוּ
  choice: na kuiweka imara
  rationale: Kitenzi אחז kimsingi ni kushika; hapa, baada ya kufunga milango, maana yake ni kuhakikisha imefungwa kwa uthabiti bila kutaja kifaa fulani kisichotajwa katika Kiebrania.
- source_word: וְהַעֲמֵיד
  choice: Wateue
  rationale: Hiphil ya עמד ina maana ya kuweka au kusimamisha; pamoja na משמרות, hapa ni kuwapa wakazi jukumu la ulinzi.
- source_word: מִשְׁמְרוֹת
  choice: walinzi
  rationale: Neno linaweza kumaanisha walinzi au zamu za ulinzi. ‘Walinzi’ ni ya asili hapa, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: kutoka miongoni mwa wakazi wa Yerusalemu
  rationale: 'Huonyesha maana ya sehemu ya kundi: walinzi wachaguliwe miongoni mwa wakazi wa mji.'
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  choice: kila mmoja kwenye zamu yake
  rationale: איש imetumiwa kwa maana ya kugawa mmoja mmoja, na משמר hapa ni zamu au jukumu la ulinzi.
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: na kila mmoja mbele ya nyumba yake
  rationale: נגד inaweza kumaanisha mbele ya au mkabala na; ‘mbele ya’ ni Kiswahili cha kawaida na hakiondoi uhusiano wa mahali na nyumba yake.
