  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. ‘Jua liwe kali’ ni nahau ya kawaida inayohifadhi taswira ya Kiebrania. ‘Kwenye zamu’ hufafanua muktadha wa ulinzi bila kuongeza cheo au utaratibu usiotajwa.
