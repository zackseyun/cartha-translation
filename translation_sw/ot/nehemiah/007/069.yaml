base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: sw
  text: Na baadhi ya viongozi wa koo walitoa kwa ajili ya kazi hiyo. Gavana[a] alitoa kwa hazina dariki za dhahabu elfu moja[b], mabakuli hamsini, na kanzu za makuhani mia tano thelathini na tano.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tirshatha,” cheo cha kiutawala cha Kiajemi.
    reason: lexical_alternative
  - marker: b
    text: Dariki ilikuwa sarafu ya dhahabu ya Kiajemi.
    reason: cultural_note
  - marker: c
    text: Kiebrania hapa kinasema “kanzu za makuhani mia tano thelathini na tano.” Sehemu inayolingana katika Ezra 2:69 inasema “kanzu za makuhani mia moja.”
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: Na baadhi ya viongozi wa koo
  rationale: Huwasilisha maana ya sehemu ya kundi pamoja na cheo cha viongozi wa jamaa za ukoo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לַמְּלָאכָה
  choice: kwa ajili ya kazi hiyo
  rationale: Katika muktadha huu מְלָאכָה ni kazi au mradi uliokuwa ukiendelezwa; kiwakilishi “hiyo” hufanya usemi uwe wa asili bila kuufafanua kupita chanzo.
- source_word: הַתִּרְשָׁתָא
  choice: Gavana
  rationale: Hii ni cheo cha kiutawala cha Kiajemi; “Gavana” huwasilisha kazi ya cheo hicho wazi, huku umbo la asili likihifadhiwa katika tanbihi.
- source_word: לָאוֹצָר
  choice: kwenye hazina
  rationale: אוֹצָר hapa ni mahali pa kuhifadhi mali zilizotolewa, hivyo “hazina” inafaa katika orodha ya vitu vya thamani.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: dariki elfu moja za dhahabu
  rationale: “Dariki” ni jina mahususi la sarafu ya dhahabu ya Kiajemi na huhifadhi usahihi wa kihistoria.
- source_word: מִזְרָקוֹת
  choice: mabakuli
  rationale: Neno hili hutaja vyombo vya aina ya bakuli vilivyotumiwa katika ibada; “mabakuli” ni wazi na haliongezi matumizi maalumu yasiyotajwa katika mstari.
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: kanzu ... za makuhani
  rationale: כָּתְנוֹת ni mavazi marefu yanayofanana na kanzu; tafsiri hii ni mahususi zaidi kuliko neno pana “mavazi.”
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: mia tano na thelathini
  rationale: Muundo wa Kiebrania ni “thelathini na mamia matano,” yaani 530, si 535. Tafsiri inafuata maandishi ya WLC yaliyotolewa.
