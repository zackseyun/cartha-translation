  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia sentensi wazi na istilahi zinazoeleweka kwa wasomaji wa kawaida, huku ikihifadhi cheo cha Kiajemi na tofauti ya maandishi katika tanbihi. Idadi 530 imetafsiriwa moja kwa moja kutoka Kiebrania, kwa kuwa taarifa ya Kiingereza ya 535 haitokani na maandishi yaliyotolewa.
