lexical_decisions:
- source_word: אַנְשֵׁי
  choice: watu wa
  rationale: Katika fomula hii ya orodha, umbo la wingi wa אִישׁ linaonyesha watu wanaohusishwa na mahali fulani. Kiswahili cha kawaida hutumia “watu wa” kwa maana hii; “wanaume wa” kingesikika kama kusisitiza jinsia kuliko inavyohitajika katika orodha hii.
- source_word: הָרָמָה
  choice: Rama
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וָגָבַע
  choice: na Geba
  rationale: Maandishi ya Kiebrania yana גבע, yaani Geba, si גבעה, yaani Gibea; kwa hiyo usomaji wa maandishi yaliyopo umehifadhiwa.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: mia sita ishirini na mmoja
  rationale: Idadi 621 imetolewa kwa maneno katika muundo wa kawaida na unaosomeka wa Kiswahili.
