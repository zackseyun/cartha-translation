  text: 'the sons of Delaiah, the sons of Tobiah, the sons of Nekoda: six hundred forty-two.'
translation:
  language: sw
  text: 'wana wa Delaya, wana wa Tobia, wana wa Nekoda: mia sita arobaini na wawili.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo na sensa, neno hili linataja watu wa kundi la kifamilia linalohusishwa na babu au kiongozi aliyetajwa. “Wana wa” hudumisha muundo unaorudiwa wa Kiebrania na ni usemi wa kawaida katika Kiswahili cha Biblia.
- source_word: דְלָיָה
  choice: Delaya
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: טוֹבִיָּה
  choice: Tobia
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na iliyo wazi katika Kiswahili.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: שֵׁשׁ מֵאוֹת וְאַרְבָּעִים וּשְׁנָיִם
  choice: mia sita arobaini na wawili
  rationale: Hii ndiyo jumla ya watu katika makundi yaliyotajwa. “Wawili” inapatana na watu wanaohesabiwa, huku muundo wa namba ukiwa wa asili na wazi katika Kiswahili.
