  yaml_path: translation/ot/nehemiah/007/046.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[b], the sons of Tabbaoth.'
translation:
  language: sw
  text: 'Watumishi wa hekalu[a]: wana wa Siha, wana wa Hasufa, wana wa Tabaoti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, Nethinim; ni istilahi ya kiufundi ya kundi lililowekwa kwa ajili ya huduma ya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: Watumishi wa hekalu
  rationale: Hili ni jina la kitaalamu la kundi lililowekwa kwa ajili ya huduma ya hekalu katika maandiko ya baada ya uhamisho. Tafsiri hii inaeleza kazi yao kwa Kiswahili cha kawaida bila kupoteza maana ya muktadha.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii neno hili linatambulisha vikundi vya ukoo. “Wana wa” huhifadhi muundo unaorudiwa wa Kiebrania na pia linaweza kueleweka kuwa vizazi au watu wa ukoo fulani.
- source_word: צִחָא
  choice: Siha
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: חֲשֻׂפָא
  choice: Hasufa
  rationale: Jina limetoholewa kutoka Kiebrania; herufi שׂ hapa ina sauti ya /s/, hivyo “Hasufa” linaifuata kwa karibu kuliko “Hashufa.”
- source_word: טַבָּעוֹת
  choice: Tabaoti
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili kutoka umbo la Kiebrania, bila kufuata tahajia ya Kiingereza yenye “th,” ambayo haimo katika chanzo.
