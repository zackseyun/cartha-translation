base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/045.yaml
  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
translation:
  language: sw
  text: 'Walinda malango: wazao wa Shalumu[a], wazao wa Ateri, wazao wa Talmoni, wazao wa Akubu, wazao wa Hatita, na wazao wa Shobai, jumla yao 138.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “wazao wa” linaweza kumaanisha wana wa moja kwa moja, ukoo mpana, au kundi la kifamilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: Walinda malango
  rationale: Neno hili linawataja watu waliokuwa na jukumu la kulinda na kusimamia malango; tafsiri hii ni ya kawaida, wazi, na inafaa katika orodha ya wahudumu.
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha za ukoo na sensa za baada ya uhamisho, neno hili linaweza kumaanisha wana wa moja kwa moja au kundi pana la ukoo. ‘Wazao wa’ ni Kiswahili cha asili kinachobeba upana huo bila kulazimisha maana ya watoto wa kiume wa moja kwa moja.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: אָטֵר
  choice: Ateri
  rationale: Jina limetoholewa kwa mfumo wa sauti unaofaa Kiswahili.
- source_word: טַלְמֹן
  choice: Talmoni
  rationale: Jina limetoholewa kwa mfumo wa sauti unaofaa Kiswahili.
- source_word: עַקּוּב
  choice: Akubu
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia ya Kiswahili.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Jina limetoholewa kutoka Kiebrania; umbo hili linaakisi sauti ya mwisho ya jina hilo.
- source_word: שֹׁבָי
  choice: Shobai
  rationale: Jina limetoholewa kwa kuhifadhi sauti ya mwisho ya Kiebrania.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: '138'
  rationale: Mfuatano wa namba za Kiebrania una jumla ya 138; tarakimu ni wazi na zinafaa katika orodha ya sensa.
