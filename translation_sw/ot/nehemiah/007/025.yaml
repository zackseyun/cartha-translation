- source_word: גִבְעוֹן
  choice: Gibeoni
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: tisini na watano
  rationale: Ni idadi 95; umbo hili ni la kawaida na la asili katika Kiswahili.
