  text: The city was wide and large[a], but the people within it were few, and no houses had been built.
translation:
  language: sw
  text: Mji ulikuwa mpana na mkubwa[a], lakini watu ndani yake walikuwa wachache, na hapakuwa na nyumba zilizojengwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na mji ulikuwa mpana na mkubwa, na watu ndani yake walikuwa wachache, na hapakuwa na nyumba zilizojengwa.” Kiebrania huunganisha vifungu hivi kwa “na”; maandishi makuu yanaonyesha kwa “lakini” tofauti kati ya ukubwa wa mji na uchache wa watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִיר
  choice: Mji
  rationale: Nomino yenye kibainishi inamaanisha “mji.” Kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti hapa, kwa kuwa Kiswahili huanza maelezo haya kwa kawaida bila “na” ya mwanzo.
- source_word: רַחֲבַת יָדַיִם
  choice: ulikuwa mpana
  rationale: Nahau hii, kwa maana halisi “mpana wa mikono,” inaeleza upana au nafasi kubwa ya mji. “Mpana” ni tafsiri ya asili na iliyo wazi katika Kiswahili.
- source_word: וּגְדוֹלָה
  choice: na mkubwa
  rationale: גדול hapa inaeleza ukubwa wa mji, si hadhi au umaarufu wake; “mkubwa” huhifadhi maana hiyo.
- source_word: וְהָעָם מְעַט
  choice: lakini watu ... walikuwa wachache
  rationale: מְעַט inaonyesha uchache wa idadi. “Lakini” huonyesha kwa kawaida tofauti iliyopo kati ya ukubwa wa mji na uchache wa wakazi, ingawa Kiebrania kina kiunganishi cha kawaida וְ.
- source_word: בְּתוֹכָהּ
  choice: waliokuwa ndani yake
  rationale: Kirai hiki kina maana ya “katikati yake/ndani yake.” Muundo huu unaonyesha wazi kwamba watu hao walikuwa wakazi waliomo mjini.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: na hakuna nyumba zilizokuwa zimejengwa
  rationale: אֵין huonyesha kutokuwapo, na בְּנוּיִם ni kauli-tendwa “zilizojengwa.” Tafsiri haiongezi wazo la “kujengwa upya,” ambalo halijaonyeshwa wazi na neno la Kiebrania.
