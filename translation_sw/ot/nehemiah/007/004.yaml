translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia mtindo wa ulinganifu bora, ikihifadhi maelezo ya ukubwa wa mji na tofauti yake na uchache wa wakazi bila kuingiza dhana isiyotajwa wazi ya kujengwa upya.
