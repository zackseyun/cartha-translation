lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: Waimbaji
  rationale: Neno hili ni umbo la kushirikisha la kitenzi שׁיר, linalomaanisha watu wanaoimba. Katika orodha hii ya sensa, “waimbaji” ni tafsiri ya asili na sahihi kuliko neno pana zaidi “wanamuziki”.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika majina ya ukoo na makundi, בְּנֵי humaanisha kihalisi “wana wa,” lakini pia inaweza kuwahusu wazao au washiriki wa kundi la kifamilia. “Wana wa” huhifadhi usemi wa Kiebrania na utata wake halisi.
- source_word: אָסָף
  choice: Asafu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: mia moja arobaini na wanane
  rationale: Hii inawakilisha kwa uwazi jumla ya watu 148; umbo “wanane” linapatana na watu wanaohesabiwa.
