base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/067.yaml
  text: besides their male and female servants[a], of whom there were 7,337; and they had 245 male and female singers.
translation:
  language: sw
  text: Mbali na watumwa wao wa kiume na wa kike[a], ambao walikuwa 7,337; nao walikuwa na waimbaji wa kiume na wa kike 245.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wao wa kiume na wa kike.” Maneno ya Kiebrania yanaweza kutafsiriwa kwa maana ya jumla zaidi, lakini katika muktadha huu wa sensa huenda yanamaanisha watumwa wa kiume na wa kike waliokuwa katika kaya hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Mbali na
  rationale: Kifungu hiki kinaonyesha watu walioongezwa kando ya jumla iliyotangulia; ‘mbali na’ ni cha kawaida na wazi katika Kiswahili.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: watumwa wao wa kiume na wa kike
  rationale: Maneno hayo yanaweza kumaanisha watumishi, lakini katika orodha hii ya kaya yanadokeza watu waliokuwa katika hali ya utumwa; tofauti ya jinsia iliyomo katika Kiebrania imehifadhiwa.
- source_word: אֵלֶּה
  choice: ambao walikuwa
  rationale: Kihalisi ni ‘hawa’; hapa kinaelekeza kwenye idadi inayofuata, hivyo muundo huu unasikika kwa kawaida katika Kiswahili bila kubadili maana.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7,337
  rationale: Tarakimu zinafaa kwa orodha ya sensa na zinahifadhi idadi kamili.
- source_word: וְלָהֶם
  choice: nao walikuwa na
  rationale: Muundo wa Kiebrania wa kuonyesha umilikaji umetafsiriwa kwa Kiswahili cha kawaida.
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: waimbaji wa kiume na wa kike
  rationale: Maumbo ya Kiebrania yanataja wazi waimbaji wanaume na wanawake; tafsiri hii inahifadhi tofauti hiyo.
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: Tarakimu ni wazi na zinafaa katika muktadha wa orodha ya idadi.
