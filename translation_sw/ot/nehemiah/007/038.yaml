- source_word: שְׁלֹשֶׁת אֲלָפִים תְּשַׁע מֵאוֹת וּשְׁלֹשִׁים
  choice: elfu tatu mia tisa thelathini
  rationale: Mpangilio wa namba wa Kiebrania umetafsiriwa kwa maneno katika Kiswahili cha kawaida na kinachosomeka kwa urahisi, huku thamani kamili ya 3,930 ikihifadhiwa.
