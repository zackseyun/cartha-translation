base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: sw
  text: 'Baadhi ya wakuu wa jamaa walitoa kwa hazina kwa ajili ya kazi hiyo: dariki elfu ishirini za dhahabu[a], na mina elfu mbili na mia mbili za fedha[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dariki ilikuwa sarafu ya dhahabu ya Uajemi.
    reason: cultural_note
  - marker: b
    text: Mina ilikuwa kipimo cha kale cha uzito, na pia kilitumiwa kuonyesha thamani ya kifedha.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Baadhi ya wakuu wa koo za baba
  rationale: Kiambishi מִן kinaonyesha sehemu ya kundi, hivyo ‘baadhi ya’ ni Kiswahili cha kawaida. ‘Wakuu wa koo za baba’ kinahifadhi muundo wa kijamii na kiukoo wa Kiebrania bila kuufupisha kuwa familia tu.
- source_word: נָתְנוּ
  choice: walitoa
  rationale: Kitenzi hiki kinawasilisha tendo rahisi la kutoa bila kuongeza wazo lisilotajwa wazi la kuchanga au kutoa sadaka.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: kwa hazina kwa ajili ya kazi hiyo
  rationale: אוֹצָר ni hazina au mahali pa kuhifadhi vitu vya thamani; הַמְּלָאכָה inaonyesha kazi au mradi uliokuwa ukigharimiwa.
- source_word: דַּרְכְּמוֹנִים
  choice: dariki
  rationale: Hili ni jina mahususi la sarafu ya dhahabu ya Uajemi; limedumishwa badala ya kutumia jina la jumla ‘sarafu’.
- source_word: שְׁתֵּי רִבּוֹת
  choice: elfu ishirini
  rationale: Kirai hiki ni ‘makumi ya maelfu mawili’ kihalisi, ambacho katika Kiswahili cha kawaida ni elfu ishirini.
- source_word: מָנִים
  choice: mina
  rationale: Jina la kipimo cha kale cha uzito na pia thamani ya fedha limehifadhiwa kwa usahihi wa kihistoria.
- source_word: אַלְפַּיִם וּמָאתָיִם
  choice: elfu mbili na mia mbili
  rationale: Hii ni namna ya kawaida na wazi ya kutaja jumla hiyo kwa Kiswahili.
