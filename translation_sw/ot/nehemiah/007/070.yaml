  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Istilahi za kihistoria ‘dariki’ na ‘mina’ zimehifadhiwa na kufafanuliwa katika tanbihi.
