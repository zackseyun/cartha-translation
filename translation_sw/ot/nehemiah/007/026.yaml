translation:
  language: sw
  text: Watu wa Bethlehemu na Netofa[a], mia moja themanini na wanane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaume wa Bethlehemu na Netofa.” Kiebrania kinasema kihalisi “wanaume wa,” usemi wa kawaida katika orodha za sensa na za watu waliorudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: Watu wa
  rationale: Ingawa neno la Kiebrania ni wingi wa אִישׁ, katika orodha ya wakazi wanaohusishwa na mahali fulani Kiswahili cha kawaida hutumia “watu wa.” Tafsiri “wanaume wa” ingeweza kueleweka kuwa inasisitiza jinsia kwa namna isiyo ya lazima katika mtindo huu wa orodha.
- source_word: בֵית לֶחֶם
  choice: Bethlehemu
  rationale: Jina la mahali limetoholewa kwa umbo lililozoeleka katika Biblia za Kiswahili badala ya kutafsiriwa kihalisi.
- source_word: וּנְטֹפָה
  choice: na Netofa
  rationale: Kiunganishi וּ kimetafsiriwa “na,” huku jina la mahali likitoholewa kama “Netofa.” Maeneo hayo mawili yana jumla moja ya watu.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: mia moja themanini na wanane
  rationale: Mfuatano wa tarakimu za Kiebrania una jumla ya 188; umewasilishwa kwa mtindo wa kawaida na unaoeleweka wa Kiswahili.
