translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi wa orodha umehifadhiwa. “Watu wa” ni wa asili zaidi katika muktadha huu, huku tanbihi ikihifadhi umbo la kiume la Kiebrania.
