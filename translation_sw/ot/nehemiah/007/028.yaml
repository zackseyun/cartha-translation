lexical_decisions:
- source_word: אַנְשֵׁי
  choice: watu wa
  rationale: Ingawa neno la Kiebrania ni wingi wa אִישׁ, katika orodha hii ya sensa linaonyesha wakazi au watu wanaohusishwa na mahali fulani. “Watu wa” ni Kiswahili cha kawaida na hakilazimishi kuelewa kwamba wanaume pekee ndio waliohesabiwa.
- source_word: בֵית עַזְמָוֶת
  choice: Beth-azmawethi
  rationale: Katika muktadha huu kirai hiki kinafanya kazi kama jina la mahali. Jina limetoholewa kwa tahajia inayoweza kusomeka kwa Kiswahili huku sehemu ya Beth ikihifadhiwa; alama ya kistari inaonyesha muundo wa jina ambatani.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: arobaini na wawili
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa idadi 42 na unaendana na mtindo wa orodha ya sensa.
