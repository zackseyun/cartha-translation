  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: sw
  text: Kisha nikawaweka ndugu yangu Hanani na Hanania, mkuu wa ngome, kuwa wasimamizi wa Yerusalemu, kwa sababu yeye[b] alikuwa mtu mwaminifu[a] na alimcha Mungu kuliko wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wa kweli” au “mtu anayetegemeka.”
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi cha umoja “yeye” kwa kawaida humrejelea Hanania, aliyetajwa karibu zaidi, ingawa wengine huyaelewa maelezo haya kuwa yanaunga mkono uteuzi huo kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: nikawaweka ... kuwa wasimamizi
  rationale: Katika muktadha huu wa kiutawala, kitenzi kinaonyesha kuwapa watu waliotajwa wajibu au mamlaka, si kutoa amri tu.
- source_word: חֲנָנִי אָחִי
  choice: Hanani ndugu yangu
  rationale: Inadumisha utambulisho wa Hanani kama ndugu ya Nehemia kwa mpangilio wa maneno ulio wa kawaida katika Kiswahili.
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: שַׂר הַבִּירָה
  choice: mkuu wa ngome
  rationale: שַׂר ni mkuu au afisa mwenye mamlaka, na בִּירָה ni jengo au eneo lenye ngome; tafsiri hii ni wazi na ya kawaida.
- source_word: עַל יְרוּשָׁלָ͏ִם
  choice: kuwa wasimamizi wa Yerusalemu
  rationale: Baada ya kitenzi cha kuwapa wajibu, עַל huonyesha mamlaka au usimamizi juu ya mahali.
- source_word: כִּי הוּא
  choice: kwa sababu yeye
  rationale: כִּי inatoa sababu ya uteuzi, huku kiwakilishi cha umoja kikihifadhiwa kama katika Kiebrania.
- source_word: כְּאִישׁ אֱמֶת
  choice: mtu mwaminifu
  rationale: אֱמֶת hapa ina maana ya uaminifu au kutegemeka kwa mtu anayekabidhiwa madaraka; tanbihi inahifadhi maana mbadala ya karibu zaidi na muundo wa Kiebrania.
- source_word: וְיָרֵא אֶת הָאֱלֹהִים
  choice: na alimcha Mungu
  rationale: Inadumisha usemi wa moja kwa moja unaoonyesha hofu yenye heshima kwa Mungu.
- source_word: מֵרַבִּים
  choice: kuliko wengi
  rationale: Huhifadhi ulinganisho wa moja kwa moja wa Kiebrania bila kuubana kuwa ‘kuliko watu wengi zaidi’ au ‘kuliko walio wengi.’
theological_decisions:
- issue: Anayerejelewa na kiwakilishi cha umoja katika maelezo ya sifa
  choice: Kiwakilishi ‘yeye’ kimeachwa katika umoja na kwa kawaida humrejelea Hanania, aliyetajwa karibu zaidi.
  alternative: Wengine huyaelewa maelezo hayo kuwa yanaunga mkono uteuzi wa wanaume wote wawili kwa jumla.
  rationale: Kiwakilishi na maelezo ya Kiebrania yako katika umoja. Tafsiri haibadili kuwa ‘wao,’ hivyo inadumisha mvutano uliopo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kuwa wasimamizi wa Yerusalemu’ unaeleweka kwa urahisi na unaonyesha wajibu wa kiutawala; umoja wa ‘yeye’ na ulinganisho ‘kuliko wengi’ vimehifadhiwa ili kutoondoa utata wa matini chanzo.
