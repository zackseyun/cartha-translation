  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: sw
  text: Na hawa ndio waliopanda kutoka Tel-Mela, Tel-Harsha, Kerubu, Adoni[a] na Imeri, lakini hawakuweza kueleza koo za baba zao[b] wala uzao wao, kama walikuwa wa Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ezra 2:59 ina jina “Adani” badala ya “Adoni” lililo hapa katika Nehemia.
    reason: textual_variant
  - marker: b
    text: Kwa tafsiri ya karibu, “nyumba ya baba zao”; hii ni nahau inayomaanisha koo au familia za upande wa baba.
    reason: lexical_alternative
  - marker: c
    text: Au, “iwapo walikuwa Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: Na hawa ndio waliopanda
  rationale: Hutambulisha kundi jingine katika orodha. ‘Waliopanda’ huhifadhi taswira ya kitenzi עלה katika muktadha wa kurudi kutoka uhamishoni bila kukifafanua kupita kiasi kuwa ‘waliorudi.’
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: kutoka Tel-Mela, Tel-Harsha, Kerubi, Adoni na Imeri
  rationale: Majina haya yamenukuliwa kifonetiki kwa tahajia inayosomeka kwa urahisi katika Kiswahili. ‘Adoni’ hufuata maandishi ya Kiebrania ya Nehemia hapa.
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: lakini hawakuweza kueleza
  rationale: ‘Lakini’ huonyesha utofautishaji uliomo katika muktadha, na ‘kueleza’ huwakilisha maana ya kufanya jambo lijulikane bila kuongeza dhana mahususi ya uthibitisho wa kisheria.
- source_word: בֵּית אֲבוֹתָם
  choice: koo za baba zao
  rationale: Hii ni nahau ya ukoo inayorejelea vikundi vya kifamilia vya upande wa baba. ‘Koo za baba zao’ ni ya asili katika Kiswahili kuliko tafsiri sisisi ‘nyumba za baba zao,’ ambayo imehifadhiwa katika tanbihi.
- source_word: וְזַרְעָם
  choice: uzao wao
  rationale: ‘Uzao’ huhifadhi maana ya kizazi au wazao ya זֶרַע na inafaa katika muktadha wa nasaba.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: iwapo walitokana na Israeli
  rationale: ‘Iwapo’ huonyesha kutokuwa na uhakika kuhusu asili yao, huku ‘walitokana na Israeli’ ikifuata kwa karibu muundo wa Kiebrania bila kuufupisha moja kwa moja kuwa ‘walikuwa Waisraeli.’
