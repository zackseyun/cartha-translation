  - marker: a
    text: Au, “Elamu yule mwingine.” Neno la Kiebrania linaweza kumaanisha “mwingine” au “yule mwingine”; hapa linatofautisha Elamu huyu na Elamu aliyetajwa mapema katika sura hii.
