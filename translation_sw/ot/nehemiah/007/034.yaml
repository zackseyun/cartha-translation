lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno ‘mwana’ katika hali ya kutegemea jina linalofuata, ukitambulisha ukoo au kundi la familia. ‘Wana wa’ huhifadhi muundo wa Kiebrania na inafaa katika orodha hii ya koo.
- source_word: עֵילָם
  choice: Elamu
  rationale: Ni jina maalumu la mtu au ukoo, hivyo limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kutafsiriwa.
- source_word: אַחֵר
  choice: mwingine
  rationale: Neno hili linaweza kumaanisha ‘mwingine’ au ‘yule mwingine.’ Katika muktadha huu linatofautisha Elamu huyu na Elamu aliyetajwa mapema, lakini tafsiri ‘mwingine’ huhifadhi kwa urahisi hali ya kutokuwa na kibainishi katika Kiebrania.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254
  rationale: Mfuatano wa namba unamaanisha elfu moja, mia mbili, hamsini na nne. Tarakimu zinafaa kwa usomaji rahisi katika orodha ya sensa huku zikihifadhi idadi kamili.
