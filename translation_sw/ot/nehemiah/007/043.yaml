base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
translation:
  language: sw
  text: 'Walawi: wana wa Yeshua, wa Kadmieli, wa wana wa Hodva[a], sabini na wanne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa wazao wa Hodva.” Kiebrania kinasema kihalisi “wana wa Hodva,” usemi wa nasaba ambao unaweza kumaanisha ukoo mpana zaidi, si wana wa moja kwa moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Nomino ya wingi yenye kiambishi cha uainishaji inaanzisha kundi katika orodha ya sensa; muundo usio na kitenzi unahifadhi mtindo wa orodha.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika muktadha wa nasaba na sensa, neno hili linaweza kumaanisha wana wa moja kwa moja au watu wa ukoo; tafsiri ya kimofolojia ‘wana wa’ inadumisha muundo na uwezekano huo.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa namna inayoeleweka katika Kiswahili na kulitofautisha na umbo refu Yoshua.
- source_word: לְקַדְמִיאֵל
  choice: wa Kadmieli
  rationale: Kiambishi לְ hapa kinaonyesha uhusiano wa ukoo katika orodha; ‘wa’ ni muundo wa asili wa Kiswahili.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: wa wana wa Hodva
  rationale: Marudio ya לְ pamoja na muundo wa nasaba yamehifadhiwa bila kusawazisha tabaka la uhusiano wa kifamilia.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: sabini na wanne
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kutaja jumla ya watu sabini na nne, ikiwa na upatanisho wa ngeli ya watu.
