lexical_decisions:
- source_word: אַנְשֵׁי
  choice: watu wa
  rationale: Ingawa kwa umbo halisi ni wingi wa אִישׁ (‘wanaume wa’), katika orodha hii neno linataja kundi linalohusishwa na miji hiyo. ‘Watu wa’ ni Kiswahili cha kawaida na cha asili; tanbihi inahifadhi maana halisi ya umbo la Kiebrania.
- source_word: בֵית אֵל
  choice: Betheli
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili, badala ya kutafsiriwa kuwa ‘nyumba ya Mungu.’
- source_word: וְהָעָי
  choice: na Ai
  rationale: Kiunganishi וְ kimetafsiriwa ‘na’; kibainishi cha Kiebrania hakihitajiki mbele ya jina hili la mahali katika Kiswahili.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: mia moja ishirini na watatu
  rationale: Idadi imewasilishwa kwa maneno kwa mpangilio wa kawaida wa Kiswahili, huku upatanisho wa ‘watatu’ ukirejelea watu.
