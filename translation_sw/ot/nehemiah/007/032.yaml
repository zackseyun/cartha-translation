  text: wanaume wa Betheli na Ai,[a] mia moja ishirini na watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Betheli na Ai.” Kiebrania kinasema kihalisi “wanaume wa Betheli na Ai.”
