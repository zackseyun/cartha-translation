  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבוֹא
  choice: Basi nikafika
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi, na kitenzi בוא hapa kinaeleza kufika mahali palipolengwa. “Basi nikafika” ni Kiswahili cha kawaida kinachohifadhi mtiririko huo.
- source_word: אֶל־יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Baada ya kitenzi cha kufika, Kiswahili hakihitaji kihusishi kinacholingana moja kwa moja na אֶל; “nikafika Yerusalemu” huonyesha wazi mahali palipolengwa. Jina limetolewa kwa umbo lake la kawaida la Kiswahili.
- source_word: וָאֱהִי שָׁם
  choice: nikakaa huko
  rationale: Ingawa היה kimsingi ni “kuwa,” pamoja na שָׁם na muda fulani hapa humaanisha kuwa au kukaa mahali. “Nikakaa huko” ni ya asili katika Kiswahili na hudumisha maana ya muktadha.
- source_word: יָמִים שְׁלֹשָׁה
  choice: kwa siku tatu
  rationale: Kirai hiki kinaonyesha muda aliokaa. “Kwa siku tatu” huwasilisha wazi maana hiyo ya muda katika Kiswahili.
