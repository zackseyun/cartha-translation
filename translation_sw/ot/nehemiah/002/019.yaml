source:
  edition: WLC
  text: וַ/יִּשְׁמַע֩ סַנְבַלַּ֨ט הַ/חֹרֹנִ֜י וְ/טֹבִיָּ֣ה הָ/עֶ֣בֶד הָֽ/עַמּוֹנִ֗י וְ/גֶ֨שֶׁם֙ הָֽ/עַרְבִ֔י וַ/יַּלְעִ֣גוּ לָ֔/נוּ וַ/יִּבְז֖וּ עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים הַ/עַ֥ל הַ/מֶּ֖לֶךְ אַתֶּ֥ם מֹרְדִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: sw
  text: Lakini Sanbalati Mhoroni, Tobia mtumishi[a] Mwamoni, na Geshemu Mwarabu waliposikia, walitudhihaki na kutudharau. Wakasema, “Ni jambo gani hili mnalofanya? Je, mnamwasi mfalme?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumwa”; wengine huliona kama cheo cha afisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: waliposikia
  rationale: Muundo wa wakati unaunganisha kusikia kwao na mwitikio wao wa uadui kwa Kiswahili cha kawaida; “Lakini” huonyesha tofauti na maendeleo yaliyotangulia.
- source_word: הַחֹרֹנִי
  choice: Mhoroni
  rationale: Jina hili la utambulisho wa kijiografia au kikabila limehifadhiwa kwa namna fupi na ya kawaida katika Kiswahili.
- source_word: הָעֶבֶד
  choice: mtumishi
  rationale: Neno la Kiebrania linaweza kumaanisha mtumishi au mtumwa na hapa ni sehemu ya utambulisho wa Tobia. “Mtumishi” linafaa zaidi katika muktadha huu bila kulazimisha hali yake ya kisheria; maana nyingine imehifadhiwa katika tanbihi.
- source_word: הָעַמּוֹנִי
  choice: Mwamoni
  rationale: Hili ni jina la utambulisho wa kikabila, limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: הָעַרְבִי
  choice: Mwarabu
  rationale: Hili ni jina la utambulisho wa kikabila au kikanda na limetafsiriwa moja kwa moja.
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: walitudhihaki
  rationale: Kitenzi kinaonyesha kejeli yenye dharau; “walitudhihaki” ni cha asili na chenye nguvu inayofaa.
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: kutudharau
  rationale: Kitenzi kinaonyesha kuwadharau au kuwafanya wengine kuwa kitu kisicho na thamani, na kinadumisha ulinganifu na “walitudhihaki.”
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Ni jambo gani hili mnalofanya?
  rationale: Tafsiri hii inahifadhi swali la dharau na muundo wa msingi wa Kiebrania huku ikiwa ya kawaida katika Kiswahili.
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: Je, mnamwasi mfalme?
  rationale: Muundo huu unatoa swali la shtaka kwa uwazi; kitenzi cha wakati wa sasa kinaonyesha tendo linalodaiwa kuwa linaendelea.
theological_decisions:
- issue: Maana ya עֶבֶד katika utambulisho wa Tobia
  choice: mtumishi
  alternative: mtumwa; au cheo cha ofisa wa utawala
  rationale: Muktadha hautoi uhakika kama neno linaeleza hali ya utumwa au huduma rasmi. Maandishi makuu yanatumia neno la kawaida lisilobana maana, na tanbihi inahifadhi uwezekano mwingine bila kuamua zaidi ya ushahidi wa chanzo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina ya utambulisho yametolewa kwa maumbo ya Kiswahili: Mhoroni, Mwamoni, na Mwarabu. Sentensi imegawanywa baada ya vitendo vya dharau ili isomeke kwa urahisi bila kupoteza mfululizo wa simulizi.'
