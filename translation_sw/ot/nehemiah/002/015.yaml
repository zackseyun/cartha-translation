translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. ‘Korongo’ linaeleweka kwa urahisi kuliko mkopo ‘wadi,’ na tanbihi inahifadhi upeo wa maana ya istilahi ya Kiebrania. Muundo ‘huku nikiuchunguza’ unaonyesha kuwa uchunguzi ulifanyika wakati wa kupanda kwake.
