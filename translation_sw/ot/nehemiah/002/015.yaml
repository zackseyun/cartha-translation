base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: sw
  text: Basi usiku nikapanda kando ya korongo[a], huku nikiuchunguza ukuta[b]. Kisha nikageuka, nikaingia kupitia Lango la Bondeni, nikarudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha korongo au njia ya maji inayotiririka kwa msimu; wengine hulitafsiri “bonde” au “kijito.”
    reason: cultural_note
  - marker: b
    text: Au “nikiukagua” au “nikiutazama kwa uchunguzi.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kuvunja,” lakini hapa kinaeleweka kuwa kinataja uchunguzi wa ukuta ulioharibika.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלֶה
  choice: nikapanda
  rationale: Kitenzi עלה kinaonyesha kwenda juu. Muundo wake pamoja na היה ni wa kitendo kinachoendelea katika simulizi, lakini wakati uliopita rahisi unasikika kwa kawaida zaidi katika Kiswahili.
- source_word: בַנַּחַל
  choice: kando ya korongo
  rationale: נחל mara nyingi ni korongo lenye mkondo wa maji wa msimu, si lazima bonde pana wala kijito chenye maji daima. Kihusishi ב katika maelezo ya njia hakilazimishi maana ya kuwa ndani ya korongo.
- source_word: לַיְלָה
  choice: usiku
  rationale: Hii ni namna ya kawaida na ya moja kwa moja ya kutaja wakati wa tukio.
- source_word: שֹׂבֵר
  choice: nikiuchunguza
  rationale: Ingawa שבר kwa kawaida humaanisha kuvunja, katika muktadha huu Nehemia anakagua ukuta ulioharibika; ‘kuchunguza’ hutoa maana inayodokezwa na muktadha bila kudai kwamba alikuwa akiubomoa.
- source_word: בַּחוֹמָה
  choice: ukuta
  rationale: Umoja wenye kibainishi umehifadhiwa; muktadha unaonyesha kuwa ni ukuta wa mji.
- source_word: וָאָשׁוּב
  choice: nikageuka
  rationale: Katika matumizi ya kwanza, שוב inaeleza kubadili mwelekeo kabla ya kurudi kupitia lango.
- source_word: וָאָבֹוא בְּשַׁעַר הַגַּיְא
  choice: nikaingia kupitia Lango la Bondeni
  rationale: בוא pamoja na lango inaonyesha kuingia kupitia lango. שער הגיא ni jina la lango, kwa hiyo limetolewa kama ‘Lango la Bondeni.’
- source_word: וָאָשׁוּב
  choice: nikarudi
  rationale: Katika matumizi ya mwisho, neno hili linahitimisha safari ya ukaguzi kwa kueleza kurudi kwake.
