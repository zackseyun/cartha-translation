base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: sw
  text: Kisha nikaendelea hadi Lango la Chemchemi[a] na Bwawa la Mfalme, lakini hapakuwa na nafasi ya mnyama niliyempanda kupita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lango la Chanzo cha Maji.” Neno la Kiebrania linaweza kumaanisha chemchemi au chanzo cha maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: nikaendelea
  rationale: Kitenzi עבר hapa kinaonyesha kuendelea na safari ya ukaguzi kutoka mahali pamoja hadi pengine; “nikaendelea” ni Kiswahili cha kawaida kisichodokeza bila sababu kuvuka mpaka au maji.
- source_word: שַׁעַר הָעַיִן
  choice: Lango la Chemchemi
  rationale: Katika muktadha huu wa kijiografia, עַיִן humaanisha chanzo cha maji, yaani chemchemi, si jicho. “Lango la Chemchemi” ni jina la mahali lililo wazi na la kawaida.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: Bwawa la Mfalme
  rationale: בְּרֵכָה ni bwawa au hifadhi ya maji; muundo wa umilikaji wa Kiebrania unawakilishwa moja kwa moja kwa “la Mfalme.”
- source_word: וְאֵין מָקוֹם
  choice: lakini hapakuwa na nafasi
  rationale: Ingawa וְ inaweza kuwa “na,” hapa inaonyesha kizuizi kilichopingana na kuendelea kwa safari; “lakini” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: לַבְּהֵמָה
  choice: ya mnyama
  rationale: בְּהֵמָה ni neno la jumla kwa mnyama. Aina yake haitajwi, hivyo tafsiri haibainishi farasi, punda, au nyumbu.
- source_word: לַעֲבֹר
  choice: kupita
  rationale: Hili linahifadhi maana ya msingi ya עבר katika hali ya kusonga kupitia sehemu iliyozibwa.
- source_word: תַּחְתָּי
  choice: aliyekuwa chini yangu
  rationale: Huhifadhi kwa uwazi taswira halisi ya Kiebrania, huku ikionyesha kwamba Nehemia alikuwa amempanda mnyama huyo bila kubainisha aina yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. Muundo “mnyama aliyekuwa chini yangu” umehifadhi usemi wa Kiebrania na maana yake ya mnyama aliyepandwa, bila kuongeza aina ya mnyama ambayo chanzo hakitaji.
