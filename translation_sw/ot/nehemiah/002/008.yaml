  - severity: low
    issue: “nyumba nitakayoishi”
    rationale: Kwa Kiswahili cha kawaida, “kuishi” hapa kwa kawaida huhitaji “ndani yake” au kielezi kingine. “Nyumba nitakayokaa” ni kamili, asilia, na huwasilisha matumizi ya makazi yanayodokezwa na muktadha.
  - severity: low
