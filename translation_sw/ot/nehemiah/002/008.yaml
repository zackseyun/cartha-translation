  naturalness: Matini iliyorekebishwa ni Kiswahili sanifu na cha sasa. “Nyumba nitakayokaa” ni ya kawaida zaidi kuliko “nyumba nitakayoishi,” ambayo hukosa kiambajengo cha mahali katika matumizi ya kawaida.
  terminology: “Msimamizi wa msitu wa mfalme,” “mbao,” “ngome ya hekalu,” na “mkono mwema wa Mungu wangu” zinafaa. “Mbao za kutengeneza boriti za malango” hufanya kusudi la mbao lieleweke kwa Kiswahili huku ikidumisha taswira ya קָרָה.
