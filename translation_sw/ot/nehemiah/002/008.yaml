source:
  edition: WLC
  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: sw
  text: Pia barua kwa Asafu, msimamizi wa msitu wa mfalme,[a] ili anipe mbao za kutengeneza boriti za malango ya ngome ya hekalu,[b] na kwa ajili ya ukuta wa jiji na nyumba nitakayokaa.[c] Mfalme akanipa, kwa kadiri ya mkono mwema wa Mungu wangu juu yangu.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bustani ya mfalme” au “hifadhi ya miti ya mfalme.” Neno la Kiebrania linamaanisha eneo la kifalme lenye miti lililotunzwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ngome iliyo ya nyumba.” Huenda “nyumba” hapa ni hekalu; pia “ngome” yaweza kutafsiriwa “citadeli.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “nyumba nitakayoingia.” Muktadha unaonyesha nyumba ambayo Nehemia angekaa.
    reason: cultural_note
  - marker: d
    text: “Mkono mwema wa Mungu ... juu yangu” ni usemi unaoonyesha fadhili na msaada wa Mungu katika matukio.
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: barua
  rationale: Neno hili humaanisha barua au hati rasmi; “barua” ni la kawaida na linafaa katika mfululizo wa maombi ya Nehemia kwa mfalme.
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: msimamizi wa msitu wa mfalme
  rationale: פַּרְדֵּס ni eneo la kifalme lenye miti lililotunzwa, ambalo laweza kuwa bustani, hifadhi, au msitu; kwa kuwa mbao za ujenzi zinahitajika, “msitu” linaeleza kazi yake katika muktadha huu.
- source_word: יִתֶּן לִי עֵצִים
  choice: anipe mbao
  rationale: Ingawa עֵצִים laweza kumaanisha miti au kuni, hapa ni miti iliyokusudiwa kwa ujenzi, hivyo “mbao” ni tafsiri ya kawaida ya Kiswahili.
- source_word: לְקָרוֹת
  choice: za kuweka boriti
  rationale: Kitenzi kinahusu kuweka boriti au kuezeka kwa boriti; usemi huu unaonyesha matumizi ya mbao bila kuufanya uwe finyu kwa paa pekee.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבַּיִת
  choice: malango ya ngome ya hekalu
  rationale: בִּירָה ni ngome au jengo lenye ulinzi, na “nyumba” katika uhusiano huu inaelekea kuwa hekalu. Muundo “ngome ya hekalu” ni wa kawaida huku tanbihi ikihifadhi uwezekano wa tafsiri halisi zaidi.
- source_word: חוֹמַת הָעִיר
  choice: ukuta wa jiji
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: nyumba nitakayoishi
  rationale: Kihalisi ni nyumba ambayo Nehemia ‘ataingia ndani yake’; katika muktadha huo ni makao yake, hivyo “nitakayoishi” huwasilisha maana kwa Kiswahili cha kawaida.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: Mfalme akanipa nilivyoomba
  rationale: Kiebrania hakitaji kitu alichopewa, lakini hukirejelea kutokana na maombi yaliyotangulia. Kiswahili cha kawaida huhitaji kukamilisha wazo hilo; “nilivyoomba” hakiongezi kitu kipya bali huonyesha rejeo lililodokezwa.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלַי
  choice: kwa kuwa mkono mwema wa Mungu wangu ulikuwa juu yangu
  rationale: Usemi huu huhifadhi taswira ya ‘mkono’ na kueleza fadhili na msaada wa Mungu katika matukio hayo kwa lugha inayoeleweka.
theological_decisions:
- issue: Uongozi wa Mungu unaoelezwa kwa mfano wa mkono wake mwema
  choice: Kuhifadhi usemi “mkono mwema wa Mungu wangu ulikuwa juu yangu”
  alternative: kwa kuwa Mungu wangu alinifadhili / alinisaidia
  rationale: Taswira ya mkono ni muhimu katika Ezra–Nehemia kwa kuonyesha utendaji wa Mungu katika mazingira halisi. Kuihifadhi huepuka kuifanya kauli hiyo kuwa dhana tupu au kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeanza kwa “pia” kwa sababu aya hii inaendeleza orodha ya maombi kutoka aya iliyotangulia. Msamiati wa ujenzi umewekwa wazi kwa wasomaji wa kawaida, huku tanbihi zikihifadhi maana halisi na uwezekano wa tafsiri nyingine.
