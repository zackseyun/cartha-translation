  text: וָ/אָשִׁ֨יב אוֹתָ֜/ם דָּבָ֗ר וָ/אוֹמַ֤ר לָ/הֶם֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם ה֚וּא יַצְלִ֣יחַֽ לָ֔/נוּ וַ/אֲנַ֥חְנוּ עֲבָדָ֖י/ו נָק֣וּם וּ/בָנִ֑ינוּ וְ/לָ/כֶ֗ם אֵֽין חֵ֧לֶק וּ/צְדָקָ֛ה וְ/זִכָּר֖וֹן בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: sw
  text: Ndipo nikawajibu na kuwaambia, “Mungu wa mbinguni ndiye atakayetufanikisha. Nasi, watumishi wake, tutainuka na kujenga. Lakini ninyi hamna sehemu, wala haki[a], wala kumbukumbu[b] katika Yerusalemu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dai halali.”
    reason: lexical_alternative
  - marker: b
    text: Au “ukumbusho”; yaani, nafasi ya kutambuliwa au kukumbukwa huko.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: Ndipo nikawajibu na kuwaambia
  rationale: Nahau ya Kiebrania שׁוּב + דָּבָר humaanisha kutoa jibu. Kiswahili cha simulizi ‘nikawajibu na kuwaambia’ kinahifadhi mwitikio na mwendelezo wa kauli.
- source_word: אֱלֹהֵי הַשָּׁמַיִם הוּא
  choice: Mungu wa mbinguni ndiye
  rationale: ‘Mungu wa mbinguni’ ni jina la heshima linaloeleweka kwa kawaida, na ‘ndiye’ linaonyesha mkazo wa kiwakilishi הוּא.
- source_word: יַצְלִיחַ לָנוּ
  choice: atakayetufanikisha
  rationale: Hifili ya צלח ina maana ya kusababisha au kuwezesha mafanikio. ‘Atakayetufanikisha’ ni ya asili katika Kiswahili na inadumisha maana hiyo ya kisababishi.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha huu neno linaonyesha huduma na utiifu kwa Mungu, si hasa hali ya utumwa wa kijamii.
- source_word: נָקוּם וּבָנִינוּ
  choice: tutainuka na kujenga
  rationale: Maneno haya yanaonyesha azimio la kuanza kazi. ‘Kujenga’ linafuata kitenzi rahisi cha Kiebrania bila kuongeza kwa lazima wazo la ‘kujenga upya,’ ingawa hilo linaeleweka katika muktadha.
- source_word: אֵין חֵלֶק
  choice: hamna sehemu
  rationale: חֵלֶק ni fungu au sehemu inayomilikiwa; ‘hamna sehemu’ ni wazi na ya kawaida katika Kiswahili.
- source_word: וּצְדָקָה
  choice: wala haki
  rationale: Hapa צְדָקָה linaonyesha msingi halali au haki ya kuhusika na Yerusalemu, si uadilifu wa kimaadili. Tanbihi inahifadhi uwezekano wa ‘dai halali.’
- source_word: וְזִכָּרוֹן
  choice: wala kumbukumbu
  rationale: ‘Kumbukumbu’ inadumisha kwa ukaribu wazo la זִכָּרוֹן kuhusu kukumbukwa, kutambuliwa, au kuwa na ukumbusho rasmi, bila kulifafanua kupita kiasi.
- source_word: בִּירוּשָׁלִָם
  choice: katika Yerusalemu
  rationale: Huu ni uwasilishaji wa kawaida wa kihusishi cha mahali.
theological_decisions:
- issue: Cheo cha watu wa Mungu kama עֲבָדָיו
  choice: watumishi wake
  alternative: watumwa wake
  rationale: Hoja ya mstari ni utiifu wao na mamlaka yao ya kumtumikia Mungu katika kazi ya ujenzi. ‘Watumishi’ linafaa katika muktadha huu bila kuingiza mkazo usio wa lazima juu ya utumwa wa kijamii.
- issue: Maana ya צְדָקָה katika kauli ya kuwatenga wapinzani
  choice: haki
  alternative: dai halali; uadilifu
  rationale: Muktadha unakanusha kuwa wapinzani wana uhalali au nafasi katika Yerusalemu. ‘Uadilifu’ ungehamisha maana kwenda sifa ya kimaadili, ilhali ‘haki’ inadumisha maana ya uhalali; ‘dai halali’ limetolewa katika tanbihi.
- issue: Maana ya זִכָּרוֹן katika Yerusalemu
  choice: kumbukumbu
  alternative: ukumbusho; haki ya kukumbukwa
  rationale: Neno la chanzo linaweza kuhusisha kukumbukwa au kutambuliwa rasmi. ‘Kumbukumbu’ linahifadhi upana huo badala ya kuamua kwa uhakika aina ya hadhi inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa usomaji wa Biblia lakini kinachoeleweka kwa wasomaji wa sasa. Muundo ‘ndiye atakayetufanikisha’ unadumisha mkazo wa Kiebrania, na orodha ‘sehemu, haki, kumbukumbu’ imeachwa kama kauli yenye vipengele vitatu.
