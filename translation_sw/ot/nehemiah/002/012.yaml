base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: sw
  text: Basi niliinuka usiku, mimi pamoja na watu wachache waliokuwa nami. Sikuwa nimemwambia mtu yeyote[a] kile ambacho Mungu wangu alikuwa akiweka moyoni mwangu[b] ili nifanye kwa ajili ya Yerusalemu. Wala sikuwa na mnyama yeyote pamoja nami isipokuwa yule mnyama[c] niliyempanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kiebrania husema, “sikuwa nimemwambia mwanadamu.” Maana yake hapa ni kwamba hakuwa amemwambia mtu yeyote.
    reason: lexical_alternative
  - marker: b
    text: Au, “kile ambacho Mungu wangu alikuwa ameweka moyoni mwangu.” Nahau hii inaweza kuonyesha kusudi au msukumo wa ndani unaotoka kwa Mungu.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinatumia neno la jumla linalomaanisha mnyama; hapa ni mnyama wa kupandwa, lakini aina yake haitajwi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: Basi nikaondoka usiku
  rationale: Kitenzi קום katika muktadha huu wa safari ya ukaguzi kinaweza kuonyesha kuinuka na kuanza kwenda. “Nikaondoka usiku” ni Kiswahili cha kawaida kinachofikisha mwendo wa simulizi bila kutumia “nikaamka,” ambalo lingeweza kudokeza kuamka usingizini.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: mimi pamoja na watu wachache waliokuwa nami
  rationale: Neno אֲנָשִׁים hapa linarejelea kundi dogo la watu walioandamana na Nehemia. Muundo huu unahifadhi msisitizo wa kiwakilishi אֲנִי na unasikika kwa kawaida katika Kiswahili.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: Sikuwa nimemwambia mtu yeyote
  rationale: הגיד ni kusema au kujulisha, na לְאָדָם katika matumizi haya ya jumla humaanisha mtu yeyote. Tafsiri hii ni sahihi na ya kawaida kuliko “mwanadamu yeyote.”
- source_word: מָה אֱלֹהַי נֹתֵן אֶל־לִבִּי
  choice: kile ambacho Mungu wangu alikuwa akiweka moyoni mwangu
  rationale: Kirai cha wakati unaoendelea “alikuwa akiweka” kinaonyesha hali ya kitenzi kishirikishi נֹתֵן, huku “moyoni mwangu” kikihifadhi nahau ya Kiebrania kuhusu fikira, kusudi na azimio la ndani.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: ili nifanyie Yerusalemu
  rationale: Kiebrania hakitaji hapa kazi yenyewe. “Nifanyie Yerusalemu” kinahifadhi upana huo badala ya kutanguliza wazi wazo la kujenga upya ambalo litaelezwa na muktadha.
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם הַבְּהֵמָה
  choice: Wala sikuwa na mnyama yeyote pamoja nami isipokuwa yule mnyama
  rationale: בְּהֵמָה ni neno la jumla kwa mnyama, hapa akiwa wa kupandwa. Tafsiri haibashiri aina maalumu kama punda, farasi au nyumbu.
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: niliyempanda
  rationale: Hii ni njia fupi na ya kawaida ya Kiswahili ya kuonyesha mnyama ambaye Nehemia alikuwa amempanda katika tukio hilo.
theological_decisions:
- issue: Msukumo wa Mungu katika kusudi la ndani la Nehemia
  choice: Mungu wangu alikuwa akiweka moyoni mwangu
  alternative: Mungu wangu alikuwa amenitia moyo kufanya
  rationale: Tafsiri iliyochaguliwa inahusisha kusudi hilo na utendaji wa Mungu lakini hailifafanui kama ufunuo wa maneno wala kulifanya kuwa hisia tu. Hivyo inadumisha mvutano kati ya msukumo wa Mungu na hatua ya Nehemia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi zimegawanywa ili kuzuia msongamano, huku uhusiano wa mawazo ya Kiebrania na ukaribu wa simulizi la nafsi ya kwanza vikihifadhiwa.
