base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: sw
  text: 'Kisha nikawaambia, “Mnaiona taabu tuliyo nayo: Yerusalemu ni magofu, na malango yake yameteketezwa kwa moto. Njooni, tuujenge upya ukuta wa Yerusalemu, ili tusiwe tena kitu cha kudharauliwa.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili tusidharauliwe tena,” au “ili tusiwe tena fedheha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: taabu tuliyo nayo
  rationale: Katika muktadha huu רָעָה ni hali ya msiba na dhiki, si uovu wa kimaadili. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha hali ambayo jamii inaikabili.
- source_word: חֲרֵבָה
  choice: imebaki magofu
  rationale: Neno linaeleza Yerusalemu iliyoharibiwa na kuwa ukiwa; 'imebaki magofu' linaonyesha kwa wazi hali halisi ya mji.
- source_word: נִצְּתוּ בָאֵשׁ
  choice: yameteketezwa kwa moto
  rationale: Kauli tendwa na kirai 'kwa moto' vimehifadhiwa, pamoja na mkazo wa Kiebrania juu ya namna malango yalivyoharibiwa.
- source_word: לְכוּ וְנִבְנֶה
  choice: Njooni, tuujenge upya
  rationale: לְכוּ hapa ni mwito wa pamoja wa kuchukua hatua, nao cohortative וְנִבְנֶה unaonyesha azimio la pamoja. 'Upya' linafaa kwa kuwa ukuta uliokuwapo ulikuwa umeharibiwa.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: ukuta wa Yerusalemu
  rationale: Muundo huu wa kawaida unahifadhi uhusiano wa moja kwa moja wa construct ya Kiebrania.
- source_word: חֶרְפָּה
  choice: kitu cha kudharauliwa
  rationale: Neno linahusu aibu ya hadharani na kuwa shabaha ya dharau. Chaguo hili linaonyesha kwamba jamii yenyewe ilikuwa kitu cha kudharauliwa, wala si kwamba ilihisi aibu tu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Njooni, tuujenge upya' ni mwito wa asili wa kushiriki katika hatua ya pamoja; 'kitu cha kudharauliwa' huhifadhi wazo la fedheha ya jamii mbele ya wengine.
