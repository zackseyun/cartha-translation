  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ וְ/הַ/שֵּׁגַ֣ל יוֹשֶׁ֣בֶת אֶצְל֗/וֹ עַד מָתַ֛י יִהְיֶ֥ה מַֽהֲלָכֲ/ךָ֖ וּ/מָתַ֣י תָּשׁ֑וּב וַ/יִּיטַ֤ב לִ/פְנֵֽי הַ/מֶּ֨לֶךְ֙ וַ/יִּשְׁלָחֵ֔/נִי וָֽ/אֶתְּנָ֥/ה ל֖/וֹ זְמָֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: sw
  text: Ndipo mfalme akaniambia, huku malkia[a] akiwa ameketi kando yake, “Safari yako itachukua muda gani, nawe utarudi lini?” Jambo hilo likampendeza mfalme, naye akanituma, nami nikamwekea muda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenza wa mfalme” au “mke wa mfalme.” Neno la Kiebrania linamtaja mwenza wa kifalme wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Ni tafsiri ya kawaida ya מֶלֶךְ na inafaa kwa mtawala wa kifalme katika simulizi hili.
- source_word: הַשֵּׁגַל
  choice: malkia
  rationale: Neno hili adimu linamtaja mwenzi wa kifalme wa mfalme; “malkia” ni neno la kawaida na la asili katika Kiswahili, huku maana maalumu zaidi ikihifadhiwa katika tanbihi.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: akiwa ameketi kando yake
  rationale: Muundo wa kitenzi endelevu na kirai cha mahali unaweka mazingira ya tukio na unaonyesha kuwa alikuwa ameketi karibu na mfalme.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: Safari yako itachukua muda gani
  rationale: Huu ni usemi wa asili wa Kiswahili unaowasilisha swali kuhusu muda wa safari bila kung’ang’ania muundo wa Kiebrania “mpaka lini.”
- source_word: וּמָתַי תָּשׁוּב
  choice: nawe utarudi lini
  rationale: שׁוּב hapa humaanisha kurudi; tafsiri hii ni wazi na inatunza swali la pili tofauti na muda wa safari.
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ
  choice: Mfalme akaona ni vema
  rationale: Ni uwasilishaji wa kawaida wa nahau ya Kiebrania inayomaanisha kwamba jambo hilo lilikubaliwa na mfalme.
- source_word: וַיִּשְׁלָחֵנִי
  choice: kuniruhusu niende
  rationale: Katika muktadha wa ombi la Nehemia, “kutuma” kunahusisha idhini ya mfalme ya kumwacha aende; usemi huu unasikika kwa kawaida bila kupoteza wazo la kuagizwa kuondoka.
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: nami nikampa muda maalumu
  rationale: זְמָן ni muda uliowekwa au kipindi maalumu. “Muda maalumu” huonyesha kwamba Nehemia alimweleza mfalme kipindi kilichokadiriwa bila kuongeza urefu wake.
