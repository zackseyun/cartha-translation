  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: sw
  text: Mfalme akaniambia, “Kwa nini uso wako unaonekana wa huzuni[a], ingawa wewe si mgonjwa? Hili si lolote ila huzuni ya moyo[b].” Ndipo nikaogopa sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “uso wako ni mbaya”—msemo unaomaanisha sura yenye huzuni au mahangaiko.
    reason: lexical_alternative
  - marker: b
    text: Au “huzuni ya ndani” au “mahangaiko ya moyo”; Kiebrania kihalisi, “ubaya wa moyo,” lakini hapa inaelekea kumaanisha dhiki ya ndani badala ya uovu wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja linalouliza sababu; ‘Kwa nini’ ni Kiswahili cha kawaida na sahihi.
- source_word: פָּנֶיךָ רָעִים
  choice: uso wako una huzuni
  rationale: Kiebrania halisi husema uso ni ‘mbaya,’ lakini huu ni msemo unaoeleza sura yenye huzuni au mahangaiko. Tafsiri hii inaleta maana ya msemo kwa Kiswahili cha kawaida bila kuondoa taswira ya uso.
- source_word: חוֹלֶה
  choice: mgonjwa
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa mtu aliye na ugonjwa.
- source_word: אֵין זֶה כִּי אִם
  choice: Hii si kitu kingine bali ni
  rationale: Muundo huu unaondoa maelezo mengine na kusisitiza hitimisho la mfalme; Kiswahili hiki kinahifadhi upekee huo kwa njia ya kawaida.
- source_word: רֹעַ לֵב
  choice: huzuni ya moyo
  rationale: Kihalisi ni ‘ubaya wa moyo,’ lakini hapa unalinganishwa na ugonjwa wa mwili na unaelekea kumaanisha dhiki au huzuni ya ndani, si uovu wa kimaadili.
- source_word: וָאִירָא
  choice: Ndipo nikaogopa
  rationale: Kitenzi kinaendeleza mfululizo wa simulizi; ‘Ndipo’ huonyesha wazi hatua inayofuata.
- source_word: הַרְבֵּה מְאֹד
  choice: sana
  rationale: Maneno haya mawili yanasisitiza ukubwa wa hofu. ‘Sana’ ni njia ya kawaida ya Kiswahili ya kutoa msisitizo huo bila usemi mzito usio wa kawaida.
theological_decisions:
- issue: Maana ya רֹעַ לֵב
  choice: huzuni ya moyo
  alternative: uovu wa moyo
  rationale: Muktadha unatofautisha ugonjwa wa mwili na hali ya ndani inayoonekana usoni. ‘Uovu wa moyo’ ungeingiza hukumu ya kimaadili ambayo muktadha haulazimishi, lakini tanbihi inahifadhi upana wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Taswira ya ‘uso’ na ‘moyo’ imehifadhiwa, huku misemo ya Kiebrania ikitolewa kwa Kiswahili cha kawaida.
