base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: sw
  text: Nikamwambia mfalme, “Mfalme na aishi milele! Kwa nini uso wangu usiwe na huzuni, wakati mji, mahali pa makaburi ya mababu zangu[a], umekuwa magofu, na malango yake yameteketezwa kwa moto?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “nyumba ya makaburi ya mababu zangu,” yaani mahali panapohusishwa na maziko ya mababu zangu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לַמֶּלֶךְ
  choice: Nikamwambia mfalme
  rationale: Wayyiqtol ya אמר inaendeleza simulizi; “nikamwambia” ni usemi wa kawaida na wa asili unaobeba pia mtiririko wa matukio.
- source_word: הַמֶּלֶךְ לְעוֹלָם יִחְיֶה
  choice: Mfalme na aishi milele!
  rationale: Hii ni kauli ya heshima na ya kumtakia mfalme maisha marefu; muundo huu unadumisha hadhi ya usemi wa mbele ya mfalme.
- source_word: מַדּוּעַ לֹא יֵרְעוּ פָנַי
  choice: Kwa nini uso wangu usiwe na huzuni
  rationale: Kiebrania kinatumia nahau ya uso kuonyesha huzuni au taabu. Tafsiri inadumisha taswira ya uso kwa lugha inayoeleweka.
- source_word: הָעִיר בֵּית קִבְרוֹת אֲבֹתַי
  choice: mji, mahali yalipo makaburi ya mababu zangu
  rationale: בֵּית hapa ina maana pana ya mahali panapohusishwa na makaburi ya mababu. “Mababu” huwasilisha אֲבֹתַי kama waliotangulia katika ukoo, bila kuifanya ihusu baba wa karibu pekee.
- source_word: חֲרֵבָה
  choice: umebaki magofu
  rationale: Kivumishi hiki kinaeleza hali ya kuharibiwa na kuachwa ukiwa; “umebaki magofu” ni Kiswahili cha asili chenye picha wazi ya uharibifu.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: na malango yake yameteketezwa kwa moto
  rationale: אכל katika kauli tendwa hutumiwa kwa moto unaoharibu kabisa. “Yameteketezwa kwa moto” huwasilisha uharibifu huo kwa uwazi na kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa mazungumzo ya mbele ya mfalme lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya Kiebrania kuhusu uso imehifadhiwa, huku nahau isiyo wazi ya “nyumba ya makaburi” ikitolewa kwa ulinganifu bora na kufafanuliwa katika tanbihi.
