base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: sw
  text: Basi nilifika kwa watawala wa Ng’ambo ya Mto[a], nikawapa barua za mfalme. Mfalme alikuwa ametuma maofisa wa jeshi na wapanda farasi pamoja nami[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ng’ambo ya Mto” huenda ni jina la eneo la utawala wa Uajemi lililokuwa magharibi mwa Mto Eufrate, ambalo pia huitwa Ng’ambo ya Eufrate.
    reason: cultural_note
  - marker: b
    text: Au “maofisa wa kijeshi na kikosi cha wapanda farasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: watawala
  rationale: Neno hili linamaanisha maofisa wa utawala wa Uajemi waliotawala maeneo mbalimbali; “watawala” ni Kiswahili cha kawaida na kinachoeleweka kuliko istilahi ya kiufundi.
- source_word: עֵבֶר הַנָּהָר
  choice: eneo la Ng’ambo ya Mto
  rationale: Hili ni jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi ya Mto Eufrate. “Ng’ambo ya Mto” linahifadhi umbo la Kiebrania, huku “eneo la” likiweka wazi matumizi yake hapa.
- source_word: אִגְּרוֹת
  choice: barua
  rationale: Neno linamaanisha mawasiliano yaliyoandikwa; katika muktadha huu ni barua rasmi za mfalme za kumpa Nehemia mamlaka na ruhusa.
- source_word: שָׂרֵי חַיִל
  choice: maofisa wa jeshi
  rationale: Kirai hiki kinataja viongozi wa kijeshi; “maofisa wa jeshi” ni sahihi, kifupi, na cha kawaida katika Kiswahili cha sasa.
- source_word: פָרָשִׁים
  choice: wapanda farasi
  rationale: Hili ni tafsiri ya moja kwa moja ya wapiganaji au wasafiri waliopanda farasi, bila kulifanya kwa lazima kuwa jina la kikosi cha wapanda farasi.
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: Mfalme alikuwa ametuma pamoja nami
  rationale: Wakati uliotangulia unaonyesha kwamba sentensi hii inaeleza msafara ambao mfalme alikuwa tayari amempa Nehemia kabla ya kufika huko.
- source_word: וָאָבוֹא
  choice: Basi, nilifika
  rationale: “Basi” linaendeleza mtiririko wa simulizi kwa Kiswahili cha asili, na “nilifika” linafaa zaidi kwa tendo la kufika kwa watawala hao.
