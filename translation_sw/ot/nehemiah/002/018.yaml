revisions:
- from: Basi nikawaeleza jinsi mkono wa Mungu wangu ulivyokuwa mwema juu yangu[a], na pia maneno ambayo mfalme alikuwa ameniambia. Nao wakasema, “Na tuinuke, tujenge.”[b] Basi wakaitia mikono yao nguvu kwa ajili ya jambo hilo jema.[c]
  to: Basi nikawaambia kwamba mkono wa Mungu wangu ulikuwa mwema juu yangu[a], na pia maneno ambayo mfalme alikuwa ameniambia. Nao wakasema, “Tuinuke, tujenge.”[b] Basi wakaitia mikono yao nguvu kwa ajili ya kazi hiyo njema.[c]
