base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: sw
  text: Basi nikawaambia kwamba mkono wa Mungu wangu ulikuwa mwema juu yangu[a], na pia maneno ambayo mfalme alikuwa ameniambia. Nao wakasema, “Tuinuke, tujenge.”[b] Basi wakaitia mikono yao nguvu kwa ajili ya kazi hiyo njema.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulikuwa umenifadhili” au “ulikuwa na neema kwangu.” Kiebrania kinasema kihalisi, “ulikuwa mwema juu yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Twendeni tukajenge.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kihalisi, “wakaitia mikono yao nguvu kwa ajili ya mema.” Maana yake yaweza kuwa walijipa moyo na kujiandaa kufanya kazi hiyo njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  choice: Basi nikawaeleza
  rationale: Waw-consecutive inaendeleza simulizi kwa matokeo ya yaliyotangulia. ‘Nikawaeleza’ ni Kiswahili cha kawaida kinachofaa kwa tendo la Nehemia la kuwaarifu watu.
- source_word: יַד אֱלֹהַי
  choice: mkono wa Mungu wangu
  rationale: Taswira ya Kiebrania ya utendaji, nguvu, au fadhili za Mungu imehifadhiwa badala ya kufasiriwa tu kuwa ‘fadhili’.
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: ulivyokuwa mwema juu yangu
  rationale: Huhifadhi kwa ukaribu nahau ya Kiebrania ‘ulikuwa mwema juu yangu,’ ingawa tanbihi inatoa kauli ya kawaida zaidi ya Kiswahili.
- source_word: וְאַף
  choice: na pia
  rationale: 'Huongeza jambo la pili alilowaeleza: si mkono wa Mungu tu, bali pia maneno ya mfalme.'
- source_word: דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: maneno ambayo mfalme alikuwa ameniambia
  rationale: Huhifadhi nomino ‘maneno’ na kishazi rejeshi; wakati uliotumika unaonyesha kwamba mfalme alisema kabla Nehemia hajawaeleza watu.
- source_word: נָקוּם וּבָנִינוּ
  choice: Na tuinuke, tujenge
  rationale: Maumbo ya nafsi ya kwanza wingi hapa yana nguvu ya kuhamasishana na kuonyesha azimio la pamoja.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: Basi wakaitia mikono yao nguvu
  rationale: Nahau halisi ya kuipa mikono nguvu imehifadhiwa ili taswira ya kujiandaa kwa tendo ibaki wazi.
- source_word: לַטּוֹבָה
  choice: kwa ajili ya jambo hilo jema
  rationale: Kiebrania kinasema kwa ufupi ‘kwa mema/jema.’ ‘Jambo hilo jema’ linaelekeza kwa kazi ya ujenzi bila kuitaja moja kwa moja kama ilivyo katika chanzo.
theological_decisions:
- issue: 'Nahau ya utendaji wa Mungu: ‘mkono wa Mungu wangu ulikuwa mwema juu yangu’'
  choice: Kuhifadhi taswira ya mkono wa Mungu
  alternative: Mungu wangu alikuwa amenifadhili / fadhili za Mungu wangu zilikuwa pamoja nami
  rationale: Taswira hiyo inahusisha utendaji na fadhili za Mungu bila kuamua kwa kupita kiasi namna hasa alivyotenda. Pia inadumisha mvutano kati ya msaada wa Mungu na maneno ya mfalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida, huku taswira kuu za Kiebrania—‘mkono wa Mungu’ na ‘kuitia mikono nguvu’—zikihifadhiwa. ‘Na tuinuke, tujenge’ linaonyesha mwito na azimio la pamoja bila kuwa la kizamani kupita kiasi.
