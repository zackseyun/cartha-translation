base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: sw
  text: Kisha nikamwambia mfalme, “Ikiwa mfalme anaona ni vyema, na ikiwa mtumishi wako amepata kibali mbele yako, unitume kwenda Yuda, katika mji wa makaburi ya mababu zangu,[a] ili niujenge upya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “katika mji wa makaburi ya baba zangu.” Neno “baba” hapa linamaanisha mababu au wahenga.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania ni “kujenga”; “kujenga upya” huweka wazi muktadha kwamba mji ulikuwa umeharibika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Kisha nikamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Ikiwa mfalme anaona ni vyema
  rationale: Ni nahau ya heshima ya kuomba idhini au ridhaa ya mfalme; tafsiri hii inadumisha mtindo wa staha bila kuwa ngumu.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: na ikiwa mtumishi wako amepata kibali mbele yako
  rationale: Nahau hii inaeleza kukubaliwa au kuwa na hadhi nzuri mbele ya mfalme; “amepata kibali” ni ya asili na inadumisha taswira ya Kiebrania.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika hotuba kwa mfalme ni namna ya kawaida ya kujitaja kwa unyenyekevu, si lazima dai la hali ya utumwa.
- source_word: תִּשְׁלָחֵנִי
  choice: unitume
  rationale: Huwasilisha ombi la Nehemia kwa ufupi na kwa staha, likitegemea vishazi vya masharti vinavyotangulia.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapo katika Biblia za Kiswahili.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: katika mji wenye makaburi ya mababu zangu
  rationale: Muundo wa Kiebrania ni kihalisi “mji wa makaburi ya baba zangu.” “Mababu” huonyesha kwamba אבות hapa inahusu wahenga, na “mji wenye” ni Kiswahili cha asili kisichopoteza uhusiano huo.
- source_word: וְאֶבְנֶנָּה
  choice: ili niujenge upya
  rationale: Umbo la kitenzi linaonyesha kusudi, na kiambishi cha kike kinarejelea mji. Mzizi unasema “kujenga,” lakini “upya” huweka wazi muktadha wa mji uliobomolewa.
