base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: sw
  text: Sanbalati, Mhoroni, na Tobia, mtumwa Mwamoni, waliposikia hayo[a], waliudhika sana[b] kwa sababu mtu alikuwa amekuja kutafuta ustawi wa wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kitenzi cha umoja, “akasikia”; Kiswahili hutumia wingi kwa kuwa Sanbalati na Tobia wametajwa pamoja. “Hayo” yanaeleweka kutokana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Au: “jambo hilo likawa baya sana kwao.” Kiebrania hurudia maneno ya mzizi wa “ubaya/uovu” ili kusisitiza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: waliposikia habari hiyo
  rationale: Kitenzi chenyewe ni ‘kusikia’; ‘habari hiyo’ imetolewa katika muktadha ili sentensi iwe ya kawaida katika Kiswahili, bila kubadili kinachorejelewa.
- source_word: הַחֹרֹנִי
  choice: Mhoroni
  rationale: Ni jina la kumtambulisha Sanbalati kwa asili yake ya Horoni; umbo la Kiswahili la jina la watu limetumiwa.
- source_word: הָעֶבֶד
  choice: mtumishi
  rationale: Neno linaweza kumaanisha mtumishi au mtumwa. Hapa ni cheo au utambulisho wa kijamii wa Tobia, na ‘mtumishi’ hudumisha upana wa maana bila kudai kwa uhakika hali ya utumwa.
- source_word: הָעַמֹּנִי
  choice: Mwamoni
  rationale: Ni jina la utaifa au kabila la Tobia, na ‘Mwamoni’ ni umbo la kawaida la Kiswahili.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: walichukizwa sana
  rationale: Kauli hii ya kawaida ya Kiswahili inaonyesha nguvu ya kutoridhika kwao; tanbihi huhifadhi urudiaji wa mzizi wa Kiebrania wa ‘ubaya/uovu.’
- source_word: אָדָם
  choice: mtu mmoja
  rationale: Neno humaanisha mwanadamu au mtu. ‘Mtu mmoja’ huonyesha kwamba ni mtu binafsi, yaani Nehemia katika muktadha, bila kuongeza neno mahsusi zaidi la jinsia kuliko lilivyo katika Kiebrania.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: kutafuta ustawi
  rationale: Katika muktadha huu, kishazi kinamaanisha kutafuta hali njema au manufaa ya wengine; ‘ustawi’ ni Kiswahili cha kawaida na sahihi.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wa wana wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi jina la taifa lenye asili ya kifamilia na la agano, huku likiwa la kawaida katika lugha ya Biblia ya Kiswahili.
theological_decisions:
- issue: Maana ya אָדָם
  choice: mtu mmoja
  alternative: mwanamume mmoja
  rationale: Ingawa anayerejelewa ni Nehemia, neno la Kiebrania ni אָדָם, ‘mtu/mwanadamu,’ si neno mahsusi zaidi la ‘mwanamume.’ Kiswahili ‘mtu mmoja’ huhifadhi maana hiyo na umahususi wa mtu binafsi.
- issue: Hadhi ya Tobia katika הָעֶבֶד
  choice: mtumishi
  alternative: mtumwa
  rationale: Kiebrania kinaweza kumaanisha mtumishi au mtumwa, na mstari huu hautoshi kuamua kwa uhakika hali yake ya kisheria. ‘Mtumishi’ huepuka kutatua kimyakimya utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina ya watu yametolewa kama Sanbalati na Tobia; majina ya asili yametolewa kwa maumbo Mhoroni na Mwamoni. Sentensi inadumisha nguvu ya hisia za wapinzani bila kuwa ngumu kupita kiasi.
