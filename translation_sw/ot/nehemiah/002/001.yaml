base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: sw
  text: Ikawa katika mwezi wa Nisani, katika mwaka wa ishirini wa utawala wa Mfalme Artashasta, divai ilipokuwa mbele yake, nikaichukua divai na kumpa mfalme. Nami sikuwa mwenye huzuni mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Nami sikuwa mbaya mbele yake.” Neno “mbaya” hapa ni nahau inayomaanisha kuonekana mwenye huzuni au mwenye uso wa masikitiko mbele ya mfalme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni utangulizi wa kawaida wa mfululizo wa simulizi; “Ikawa” huhifadhi nguvu yake bila kutumia lugha nzito isiyo ya kawaida.
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: katika mwezi wa Nisani
  rationale: Huhifadhi muundo rasmi wa tarehe na kuandika jina la mwezi kwa namna inayofaa Kiswahili.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: mwaka wa ishirini wa utawala wa Mfalme Artashasta
  rationale: Kirai hiki kinaonyesha mwaka wa kutawala kwa mfalme; kuongeza “wa utawala” huweka maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: יַיִן לְפָנָיו
  choice: divai ilipokuwa mbele yake
  rationale: Huhifadhi taswira ya mazingira ya kifalme na wakati huohuo huunda kishazi cha Kiswahili kinachosomika kwa kawaida.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: niliichukua divai
  rationale: Kitenzi נשא hapa kinahusu kuchukua divai ili kumhudumia mfalme. Tafsiri haiongezi “kikombe,” ambacho hakitajwi moja kwa moja katika Kiebrania.
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: na kumpa mfalme
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya נתן, huku kitu kilichotolewa kikieleweka kuwa divai.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: Kabla ya hapo sikuwa nimewahi kuonekana mwenye huzuni mbele yake
  rationale: Neno רַע maana yake ya msingi ni “mbaya,” lakini katika muktadha huu linaeleza sura au hali ya huzuni mbele ya mfalme. “Kabla ya hapo” huwasilisha uhusiano wa wakati unaodokezwa na simulizi, na “kuonekana” huonyesha kuwa suala ni hali iliyoonekana usoni.
