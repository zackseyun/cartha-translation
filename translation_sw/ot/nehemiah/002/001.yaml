translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Jina נִיסָן limetolewa kama “Nisani,” na אַרְתַּחְשַׁסְתְּא kama “Artashasta,” kwa kufuata maumbo yaliyozoeleka katika Kiswahili cha Biblia.
