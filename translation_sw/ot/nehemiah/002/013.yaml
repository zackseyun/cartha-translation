  text: וָ/אֵצְאָ֨/ה בְ/שַֽׁעַר הַ/גַּ֜יא לַ֗יְלָה וְ/אֶל פְּנֵי֙ עֵ֣ין הַתַּנִּ֔ין וְ/אֶל שַׁ֖עַר הָ/אַשְׁפֹּ֑ת וָ/אֱהִ֨י שֹׂבֵ֜ר בְּ/חוֹמֹ֤ת יְרוּשָׁלִַ֨ם֙ אֲשֶׁר ה/מפרוצים וּ/שְׁעָרֶ֖י/הָ אֻכְּל֥וּ בָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: sw
  text: Basi nilitoka usiku kupitia Lango la Bondeni, kuelekea Chemchemi ya Joka[a] na kuelekea Lango la Takataka; nikiendelea kukagua[b] kuta za Yerusalemu zilizobomolewa na malango yake yaliyoteketezwa kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Chemchemi ya Nyoka”; neno la Kiebrania tannin linaweza kumaanisha joka, nyoka, au kiumbe kingine cha aina hiyo.
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania unaotafsiriwa “nikiendelea kukagua” ni mgumu kihalisia; katika muktadha huu unaeleweka kuwa uchunguzi wa kuta zilizoharibiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: Basi nilitoka
  rationale: Waw pamoja na kitenzi cha nafsi ya kwanza huendeleza simulizi; “Basi” linaonyesha mfuatano kwa Kiswahili cha kawaida bila kuongeza uhusiano wa sababu.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: kupitia Lango la Bondeni
  rationale: Katika muktadha wa mwendo, בְּ ina maana ya kupitia; גַּיְא ni bonde au korongo, na “Lango la Bondeni” ni jina la mahali linaloeleweka.
- source_word: לַיְלָה
  choice: usiku
  rationale: Nomino hii imetumiwa kama kielezi cha wakati; “usiku” ni tafsiri fupi na ya asili.
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: kuelekea Chemchemi ya Joka[a]
  rationale: עֵין hapa ni chemchemi, na אֶל־פְּנֵי katika maelezo ya njia inaonyesha upande au mwelekeo. “Joka” huhifadhi maana kuu ya תַּנִּין bila kuficha uwezekano wa “nyoka” au kiumbe kingine cha aina hiyo.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: Lango la Samadi
  rationale: אַשְׁפֹּת humaanisha samadi au rundo la taka. “Lango la Samadi” ni jina fupi, wazi, na linalolingana na matumizi ya kibiblia ya Kiswahili.
- source_word: וָאֱהִי שֹׂבֵר
  choice: nami nikawa nikikagua
  rationale: Muundo wa היה pamoja na umbo la kushiriki unaonyesha tendo linaloendelea. Ingawa שבר kwa kawaida ni “vunja,” hapa muktadha wa uchunguzi wa usiku unaunga mkono maana ya kukagua; muundo wa Kiswahili unahifadhi hali ya kuendelea.
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ
  choice: kuta za Yerusalemu
  rationale: Hiki ndicho kitu kinachokaguliwa; Kiswahili cha asili hutumia muundo wa umilikaji “kuta za Yerusalemu.”
- source_word: אֲשֶׁר הַמְּפֹרָצִים
  choice: zilizokuwa zimebomolewa
  rationale: Umbo la kupokea tendo kutoka פרץ linaonyesha kuta zilizovunjwa na kuachwa na mianya. “Zimebomolewa” ni wazi na linafaa kwa kuta za mji.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: na malango yake yaliyokuwa yameteketezwa kwa moto
  rationale: אכל katika kauli ya kutendwa pamoja na moto ni tamathali ya kuteketezwa au kuunguzwa kabisa. “Yameteketezwa kwa moto” huwasilisha ukamilifu wa uharibifu kwa Kiswahili cha asili.
