base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: sw
  text: Kisha nikamwambia mfalme, “Ikiwa mfalme anaona ni vema, nipewe barua kwa ajili ya watawala wa Ng’ambo ya Mto[a], ili waniruhusu nipite mpaka nitakapofika Yuda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ng’ambo ya Mto” ilikuwa jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi mwa Mto Frati.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: Kisha nikamwambia
  rationale: Waw-consecutive inaendeleza simulizi; ‘Kisha’ huonyesha mfuatano kwa Kiswahili cha kawaida, huku kiambishi cha yambwa kikionyesha kuwa alisema kwa mfalme.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Ikiwa mfalme anaona ni vema
  rationale: Hii ni kauli ya heshima ya kifalme. Tafsiri hii ni ya asili na yenye staha, na haiifanyi sentensi kuwa kauli ya moja kwa moja kuhusu hisia za mfalme.
- source_word: אִגְּרוֹת
  choice: barua
  rationale: Neno linamaanisha mawasiliano yaliyoandikwa; muktadha wa ombi kwa mfalme unaonyesha kwamba ni barua rasmi bila kulazimika kuongeza ‘rasmi’ katika matini.
- source_word: יִתְּנוּ לִי
  choice: na nipewe
  rationale: Kauli tendwa ya ombi la heshima huakisi vizuri maana ya kitenzi cha wingi kinachotumiwa kiidioma katika ombi lililoelekezwa kwa mfalme.
- source_word: פַּחֲוֹת
  choice: watawala
  rationale: Neno linawahusu maafisa waliotawala maeneo katika utawala wa Uajemi; ‘watawala’ ni sawa la kawaida na linaloeleweka katika Kiswahili.
- source_word: עֵבֶר הַנָּהָר
  choice: Ng’ambo ya Mto
  rationale: Hili ni jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi mwa Frati. Herufi kubwa zinaonyesha kuwa ni jina la eneo, si maelezo ya mwelekeo tu.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: ili waniruhusu nipite
  rationale: Katika muktadha huu Hiphil ya עבר inaeleza kuruhusu au kuwezesha mtu kupita katika maeneo ya watawala; ‘waniruhusu nipite’ huwasilisha maana hiyo kwa uwazi.
- source_word: עַד אֲשֶׁר אָבוֹא
  choice: mpaka nitakapofika
  rationale: Hiki ni kishazi cha muda kinachoeleza mwisho wa safari; ‘nitakapofika’ ni Kiswahili cha asili na sahihi.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la mahali limetolewa kwa umbo la kawaida la Kiswahili; kuongeza ‘jimbo’ kungeweka taarifa isiyotajwa wazi katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Kauli ya heshima ya ikulu imehifadhiwa bila kuwa ngumu, na jina rasmi la eneo limefafanuliwa kwa tanbihi.
