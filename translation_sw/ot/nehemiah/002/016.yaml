reference: Nehemiah 2:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/סְּגָנִ֗ים לֹ֤א יָדְעוּ֙ אָ֣נָה הָלַ֔כְתִּי וּ/מָ֖ה אֲנִ֣י עֹשֶׂ֑ה וְ/לַ/יְּהוּדִ֨ים וְ/לַ/כֹּהֲנִ֜ים וְ/לַ/חֹרִ֣ים וְ/לַ/סְּגָנִ֗ים וּ/לְ/יֶ֨תֶר֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה עַד כֵּ֖ן לֹ֥א הִגַּֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: sw
  text: Lakini maofisa hawakujua nilikokuwa nimekwenda wala nilichokuwa nikifanya. Mpaka wakati huo sikuwa nimewaambia Wayahudi[a], makuhani, wakuu, maofisa, wala wale wengine waliokuwa wakifanya kazi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wayudea.” Neno la Kiebrania יְהוּדִים linaweza kumaanisha watu wa eneo la Yuda au jamii ya Wayahudi kwa upana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: maofisa
  rationale: Neno hili humaanisha watawala au maafisa wa ngazi ya chini. “Maofisa” ni neno la sasa na halibainishi kupita kiasi cheo maalumu cha utawala wa Uajemi.
- source_word: יָדְעוּ
  choice: hawakujua
  rationale: Maana ya kawaida ya ידע katika qal ni “kujua”; hapa umbo la wakati uliopita linafaa simulizi.
- source_word: אָנָה הָלַכְתִּי
  choice: nilikokuwa nimekwenda
  rationale: אָנָה huonyesha mahali pa kuelekea, na kauli hii ya Kiswahili huonyesha kwamba safari ilikuwa imetangulia kutokujua kwa maofisa.
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: wala nilichokuwa nikifanya
  rationale: Kitenzi-jina עֹשֶׂה huonyesha tendo linaloendelea. “Wala” ni kiunganishi cha kawaida baada ya kauli hasi bila kubadili maana ya waw.
- source_word: לַיְּהוּדִים
  choice: Wayahudi
  rationale: יְהוּדִים linaweza kumaanisha jamii ya Wayahudi kwa upana au watu wa Yuda; “Wayahudi” ndilo neno linaloeleweka zaidi, huku tanbihi ikihifadhi maana mbadala.
- source_word: לַכֹּהֲנִים
  choice: makuhani
  rationale: Ni tafsiri ya moja kwa moja ya כֹּהֲנִים.
- source_word: לַחֹרִים
  choice: wakuu
  rationale: Katika muktadha huu wa kijamii na kiutawala, חֹרִים ni watu wenye hadhi au viongozi. “Wakuu” ni la kawaida na lenye staha katika Kiswahili.
- source_word: וּלְיֶתֶר
  choice: wale wengine
  rationale: יֶתֶר humaanisha waliosalia; “wale wengine” ni Kiswahili cha kawaida katika orodha ya makundi.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: waliokuwa wakifanya kazi hiyo
  rationale: Kitenzi-jina cha umoja kimetumiwa kwa maana ya kundi. Tafsiri hii huhifadhi wazo la kushiriki katika kazi badala ya kulifupisha kuwa jina “wafanyakazi.”
- source_word: עַד כֵּן
  choice: Mpaka wakati huo
  rationale: Kauli hii huweka mpaka wa wakati ambapo Nehemia alikuwa bado hajawaambia makundi yaliyotajwa.
- source_word: הִגַּדְתִּי
  choice: sikuwa nimewaambia
  rationale: Hiphil ya נגד humaanisha kusema, kutangaza, au kujulisha. “Kuwaambia” ni ya kawaida na inaonyesha wazi walengwa waliotajwa.
