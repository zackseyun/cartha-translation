lexical_decisions:
- source_word: מְבַקֵּשׁ
  choice: unaomba
  rationale: Katika muktadha wa mfalme kumtaka Nehemia aeleze ombi lake, kitenzi hiki kina maana ya kuomba au kutaka jambo; “unaomba” ni ya kawaida na inafaa kwa mazungumzo haya.
- source_word: וָאֶתְפַּלֵּל
  choice: nikasali
  rationale: Hutafsiri moja kwa moja tendo la kumwelekea Mungu katika sala, huku kiunganishi cha simulizi kikionyeshwa kwa “Basi” na “nika-”.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Mungu wa mbinguni
  rationale: Huhifadhi jina la heshima la Kiebrania kwa namna ya asili na iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Aina au urefu wa sala ya Nehemia
  choice: nikasali kwa Mungu wa mbinguni
  alternative: nikamwomba Mungu wa mbinguni kimoyomoyo
  rationale: Chanzo kinasema tu kwamba Nehemia alisali; hakisemi wazi kuwa sala ilikuwa ya kimoyomoyo, ingawa muktadha unaweza kudokeza sala fupi. Tafsiri haiongezi maelezo hayo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja, ikihifadhi mwendo wa simulizi na swali la mfalme.
