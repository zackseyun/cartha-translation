lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: na kwamba
  rationale: Huendeleza orodha ya masharti yaliyowekwa kwa kiapo, huku ikihifadhi nguvu ya kiunganishi na utegemezi wa kishazi.
- source_word: לֹא נִתֵּן בְּנֹתֵינוּ
  choice: hatutawapa binti zetu
  rationale: Wakati ujao unaonyesha ahadi ya jumuiya, na kitenzi “kutoa/kupa” kinahifadhi ulinganifu wa Kiebrania na “kuchukua.”
- source_word: לְעַמֵּי הָאָרֶץ
  choice: jamii za nchi
  rationale: “Jamii” huwakilisha wingi wa עַמֵּי bila kuongeza maana ya “wapagani” au “wageni”; “za nchi” huhifadhi msemo wa chanzo.
- source_word: וְאֶת בְּנֹתֵיהֶם לֹא נִקַּח
  choice: wala hatutawachukua binti zao
  rationale: “Wala” huonyesha ukanushi sambamba; “kuchukua” huhifadhi kitenzi cha chanzo, ambacho katika muktadha huu kinahusu ndoa.
- source_word: לְבָנֵינוּ
  choice: kwa ajili ya wana wetu
  rationale: Huhifadhi rejeo mahsusi kwa wana wa kiume na kueleza uhusiano wa kishazi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kuwasilisha katazo la kuoana bila kuingiza itikadi ya kikabila au kirangi
  choice: Kutumia “jamii za nchi” na lugha ya pande mbili ya kutoa na kuchukua binti bila nyongeza ya ufafanuzi katika matini kuu.
  alternative: “mataifa ya kipagani ya nchi,” “wageni wa nchi,” au “wenyeji wa nchi”
  rationale: Mstari wenyewe hautumii vivumishi vinavyomaanisha “wapagani” au “wageni.” Tafsiri iliyochaguliwa huhifadhi wingi na mvutano wa kijamii wa agano bila kuufasiri kupita maneno ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ahadi ya pamoja umehifadhiwa, pamoja na ulinganifu wa “kuwapa” na “kuwachukua.”
