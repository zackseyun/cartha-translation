  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: sw
  text: Nasi, makuhani, Walawi, na watu, tulipiga kura kuhusu sadaka ya kuni[a], ili kuleta kuni hizo katika nyumba ya Mungu wetu, kulingana na koo za baba zetu, kwa nyakati zilizowekwa, mwaka baada ya mwaka, ili ziwashwe moto juu ya madhabahu ya Yahweh Mungu wetu, kama ilivyoandikwa katika Torati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya sadaka ya kuni.” Kihusishi cha Kiebrania kinaweza kueleweka kwa namna zote mbili; maana ya jumla ni kwamba kura zilipigwa ili kugawa wajibu wa kuleta kuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: Nasi tukapiga kura
  rationale: Hii ni nahau ya Kiebrania ya kupiga kura ili kufanya uamuzi au kugawa wajibu; Kiswahili cha sasa hutumia kwa kawaida ‘kupiga kura’.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: kuhusu sadaka ya kuni
  rationale: עַל inatambulisha jambo lililoamuliwa kwa kura, na קֻרְבַּן הָעֵצִים ni sadaka yenye kuni kwa matumizi ya madhabahuni.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: makuhani, Walawi, na watu
  rationale: Orodha ya makundi yote matatu imehifadhiwa wazi bila kuyafupisha.
- source_word: לְהָבִיא
  choice: ili kuileta
  rationale: Kitenzi-jina kinaonyesha kusudi la kupiga kura; kiwakilishi ‘-i-’ kinarejelea sadaka ya kuni.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: katika nyumba ya Mungu wetu
  rationale: ‘Nyumba ya Mungu wetu’ huhifadhi tamathali ya Kiebrania huku ikieleweka kama hekalu katika muktadha huu.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: kwa kufuata jamaa za baba zetu
  rationale: Usemi huu unahusu mpangilio wa ukoo au familia za mababu; ‘jamaa’ ni wazi kwa msomaji wa sasa kuliko tafsiri sisisi ya ‘nyumba za baba’.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: kwa nyakati zilizowekwa
  rationale: Hurejelea vipindi maalumu vilivyopangwa mapema.
- source_word: שָׁנָה בְשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Huhifadhi maana ya tendo linalorudiwa kila mwaka pamoja na mkazo wa usemi wa asili.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: ili zichomwe juu ya madhabahu
  rationale: Kiwakilishi cha wingi kinarejelea kuni, na kitenzi cha kutendwa huonyesha kusudi lao bila kumtaja mtendaji ambaye maandishi hayamtaji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa na cheo.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: kama ilivyoandikwa katika Torati
  rationale: Hii ni kauli ya kurejelea agizo la Maandiko; ‘Torati’ hutaja mwili wa mafundisho unaokusudiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa makuhani na ‘sadaka ya kuni’ katika sintaksia
  choice: Makuhani, Walawi, na watu ni makundi yaliyoshiriki kupiga kura kuhusu sadaka
  alternative: Kuisoma לַכֹּהֲנִים kwa maana ‘kwa ajili ya sadaka ya kuni ya makuhani’
  rationale: Konsonanti za maandishi na mgawanyo wa sentensi huunga mkono orodha ya makundi matatu, lakini uwezekano wa kuelewa kihusishi kwa namna nyingine umetajwa katika tanbihi ili kutofuta utata wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. ‘Jamaa za baba zetu’ linafafanua muundo wa ukoo bila kutumia usemi mgumu wa kisisi. Alama ya tanbihi [a] imewekwa baada ya ‘makuhani’ kufuatana na mahali pa utata wa kisintaksia.
