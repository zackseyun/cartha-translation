  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/כֹּהֵ֧ן בֶּֽן אַהֲרֹ֛ן עִם הַ/לְוִיִּ֖ם בַּ/עְשֵׂ֣ר הַ/לְוִיִּ֑ם וְ/הַ/לְוִיִּ֞ם יַעֲל֨וּ אֶת מַעֲשַׂ֤ר הַֽ/מַּעֲשֵׂר֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ אֶל הַ/לְּשָׁכ֖וֹת לְ/בֵ֥ית הָ/אוֹצָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: sw
  text: Kuhani, mwana wa Haruni, atakuwa pamoja na Walawi wakati Walawi wanapokusanya zaka. Nao Walawi wataleta zaka ya zaka[a] katika nyumba ya Mungu wetu, kwenye vyumba vya ghala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu ya kumi ya zaka.” Kiebrania kinasema kihalisi “zaka ya zaka,” yaani sehemu ambayo Walawi wenyewe hutoa kutoka katika zaka wanayopokea.
    reason: lexical_alternative
  - marker: b
    text: Au “hazina.” Hapa inaelekea kuwa eneo la kuhifadhi zaka na matoleo, si lazima hazina ya fedha pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: atakuwa
  rationale: Katika muktadha huu wa masharti ya agano, kitenzi kinaeleza jambo linalopaswa kutendeka baadaye, si simulizi la wakati uliopita.
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: Kuhani, mwana wa Haruni
  rationale: Huhifadhi kwa uwazi namna ya Kiebrania ya kumtambulisha kuhani kuwa wa ukoo wa Haruni bila kutumia istilahi nzito ya kitaalamu.
- source_word: עִם
  choice: pamoja na
  rationale: Huonyesha kwamba kuhani anapaswa kuwapo pamoja na Walawi wakati wa ukusanyaji wa zaka.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: wakati Walawi wanapokusanya zaka
  rationale: Kitenzi-jina hapa kinaeleza tendo la kupokea au kukusanya zaka; muundo wa wakati ni wa kawaida na wazi katika Kiswahili.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la kikabila na kihuduma.
- source_word: יַעֲלוּ
  choice: wataleta
  rationale: Ingawa kitenzi cha Kiebrania kinaweza kudokeza kupeleka juu kuelekea patakatifu, ‘wataleta’ ni cha asili zaidi katika Kiswahili na kinawasilisha tendo kuu bila kuongeza picha isiyo wazi.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: zaka ya zaka
  rationale: Huhifadhi istilahi ya Kiebrania na kutaja sehemu ambayo Walawi wenyewe hutoa kutoka katika zaka wanayopokea.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: katika nyumba ya Mungu wetu
  rationale: Huhifadhi usemi wa agano unaolitaja hekalu kuwa nyumba ya Mungu wetu.
- source_word: הַלְּשָׁכוֹת
  choice: vyumba
  rationale: Neno linarejelea vyumba vya hekalu vilivyotumiwa kuhifadhi zaka na matoleo.
- source_word: לְבֵית הָאוֹצָר
  choice: vya ghala
  rationale: ‘Ghala’ linafaa kwa mahali pa kuhifadhi mazao na zaka, na huepuka wazo finyu la hazina ya fedha pekee.
theological_decisions:
- issue: Istilahi ya eneo la kuhifadhi vitu hekaluni
  choice: ghala
  alternative: hazina
  rationale: Muktadha unahusu zaka, hasa mazao na matoleo yanayohifadhiwa, si fedha pekee; ‘ghala’ linaonyesha kazi ya eneo hilo bila kuingiza maana ya kifedha isiyolazimu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria wa agano umehifadhiwa bila kufanya sentensi kuwa nzito, na istilahi ‘zaka ya zaka’ imebaki katika matini huku tanbihi ikiifafanua.
