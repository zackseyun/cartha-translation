  text: 'the heads of the people: Parosh[a], Pahath-moab, Elam, Zattu, Bani.'
translation:
  language: sw
  text: 'viongozi wa watu: Paroshi, Pahath-Moabu, Elamu, Zatu, Bani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי
  choice: viongozi wa
  rationale: Nomino hii ya wingi katika hali ya kuunganishwa hutumiwa kiistiari kwa watu wenye nafasi ya uongozi. Kiswahili cha kawaida hakitumii kwa urahisi sitiari ya moja kwa moja ‘vichwa vya watu’ katika orodha kama hii, hivyo ‘viongozi wa’ huwasilisha maana kwa uwazi na kwa lugha ya asili.
- source_word: הָעָם
  choice: watu
  rationale: Hapa neno hili linamaanisha jumuiya inayowakilishwa katika orodha ya agano; ‘watu’ ni tafsiri ya kawaida na ya asili katika muktadha huu.
- source_word: פַּרְעֹשׁ
  choice: Paroshi
  rationale: Jina la mtu au ukoo limetoholewa kwa kufuata mfumo wa sauti na tahajia ya Kiswahili.
- source_word: פַּחַת מוֹאָב
  choice: Pahath-Moabu
  rationale: Jina ambatani limehifadhiwa kama jina moja lenye kistari; ‘Moabu’ linafuata umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: עֵילָם
  choice: Elamu
  rationale: Katika orodha hii ni jina la mtu au ukoo, si rejeo la lazima kwa eneo; limetoholewa kama jina.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Jina limetoholewa kwa tahajia rahisi ya Kiswahili bila kuingiza konsonanti isiyoonyeshwa na matini hii.
- source_word: בָּנִי
  choice: Bani
  rationale: Umbo la konsonanti katika mstari huu linaunga mkono ‘Bani’; halijapatanishwa na majina yanayofanana katika sehemu nyingine.
theological_decisions: []
translation_notes:
  register: Lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. ‘Viongozi wa watu’ ni ya asili zaidi katika Kiswahili kuliko tafsiri sisisi ‘vichwa vya watu,’ huku ikihifadhi kazi ya kiutawala ya רָאשֵׁי. Majina yametoholewa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili.
