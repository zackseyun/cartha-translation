base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: sw
  text: Wanajiunga na ndugu zao, wakuu wao[a], na kuingia katika laana na kiapo[b], ili waenende katika Sheria ya Mungu, iliyotolewa kwa mkono wa Musa[c], mtumishi wa Mungu, na kushika na kutenda amri zote za Yahwe Bwana wetu, hukumu zake na sheria zake[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanajifungamanisha na ndugu zao, wakuu wao.” Nahau ya Kiebrania inaonyesha kushikamana nao kwa uthabiti katika umoja wa agano.
    reason: lexical_alternative
  - marker: b
    text: '“Laana na kiapo” ni ahadi nzito ya agano: waliapa kutii na kukubali adhabu za agano iwapo wangelivunja.'
    reason: cultural_note
  - marker: c
    text: Au, “iliyotolewa kupitia Musa.” Kiebrania kinasema kihalisi, “iliyotolewa kwa mkono wa Musa.”
    reason: lexical_alternative
  - marker: d
    text: “Hukumu” pia inaweza kutafsiriwa “maamuzi ya kisheria” au “kanuni”; “sheria” pia zinaweza kutafsiriwa “maagizo yaliyowekwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: wanajiunga na
  rationale: Katika muktadha huu wa agano, nahau hii inaonyesha kushikamana au kuungana kwa dhati na wengine, si kuwapa nguvu kimwili.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Huhifadhi neno la undugu la kiume lililo katika Kiebrania bila kuligeuza kimyakimya kuwa neno lisiloonyesha jinsia.
- source_word: אַדִּירֵיהֶם
  choice: watu wao mashuhuri
  rationale: Neno hili linarejelea watu wenye hadhi na ushawishi katika jumuiya; tafsiri hii ni ya kawaida zaidi katika Kiswahili cha sasa kuliko 'wakuu wao' katika muktadha huu.
- source_word: וּבָאִים בְּאָלָה וּבִשְׁבוּעָה
  choice: kujisifunga kwa laana na kiapo
  rationale: Huwasilisha hatua ya kuingia katika wajibu wa agano unaothibitishwa kwa kiapo na kukubali laana iwapo agano litavunjwa.
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: kuenenda katika Sheria ya Mungu
  rationale: Huhifadhi sitiari ya Kiebrania ya mwenendo wa maisha huku 'Sheria' ikifaa kwa muktadha huu wa kisheria na wa agano.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: iliyotolewa kwa mkono wa Musa
  rationale: Huhifadhi nahau ya chanzo inayoonyesha kwamba Musa alikuwa mpatanishi wa kutolewa kwa Sheria.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: mtumishi wa Mungu
  rationale: Hapa עֶבֶד ni cheo cha heshima cha Musa; 'mtumishi' ni sahihi na ya kawaida kuliko 'mtumwa' katika muktadha huu.
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: kuzishika na kuzitekeleza
  rationale: 'Huhifadhi vitenzi viwili vya fomula ya agano: kutunza au kuzingatia, na kutenda kwa vitendo.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hutaja jina binafsi la Mungu lililoandikwa kwa herufi nne YHWH badala ya kulibadilisha kuwa cheo.
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  choice: hukumu zake na masharti yake
  rationale: Hutofautisha aina mbili za maagizo ya kisheria, huku ikitumia maneno yanayoeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano YHWH moja kwa moja; 'Yahwe' hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Neno la undugu אֲחֵיהֶם
  choice: ndugu zao
  alternative: jamaa zao au Waisraeli wenzao
  rationale: Chanzo kina nomino ya kiume ya wingi. Tafsiri hii hudumisha umbo hilo bila kudai kwamba muktadha mpana hauwezi kuhusisha jumuiya yote.
- issue: Maana ya עֶבֶד katika cheo cha Musa
  choice: mtumishi wa Mungu
  alternative: mtumwa wa Mungu
  rationale: Ingawa neno linaweza kumaanisha mtumwa, hapa ni cheo cha heshima kinachoeleza uhusiano na huduma ya Musa kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa agano na sitiari ya 'kuenenda' zimehifadhiwa, lakini sentensi imetungwa kwa mtiririko wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa mahali panapohusika katika matini.
