lexical_decisions:
- source_word: וְעַל
  choice: Na kwenye
  rationale: Muunganiko huu unaendeleza habari na kuonyesha mahali majina yalipo katika hati; ‘kwenye’ ni Kiswahili cha kawaida na cha asili katika muktadha huu wa kiutawala.
- source_word: הַחֲתוּמִים
  choice: hati iliyotiwa muhuri
  rationale: Kwa umbo halisi ni wingi wenye maana ya ‘vitu/wale waliotiwa muhuri,’ lakini katika muktadha huu unarejelea kwa mkato hati ya agano iliyotiwa muhuri. Neno ‘hati’ limewekwa wazi ili sentensi ieleweke kwa kawaida, huku tanbihi ikihifadhi utata wa Kiebrania.
- source_word: נְחֶמְיָה
  choice: Nehemia
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: הַתִּרְשָׁתָא
  choice: gavana
  rationale: Hili ni cheo cha kiutawala cha kipindi cha Uajemi. ‘Gavana’ huwasilisha kwa uwazi kazi ya mwenye cheo hicho kwa msomaji wa sasa; jina la cheo la Kiebrania limehifadhiwa katika tanbihi.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hii ndiyo tafsiri ya kawaida na sahihi ya kiashiria cha nasaba.
- source_word: חֲכַלְיָה
  choice: Hakalia
  rationale: Jina limetoholewa kwa namna ya kawaida na rahisi kutamkwa katika Kiswahili.
- source_word: וְצִדְקִיָּה
  choice: na Sedekia
  rationale: Kiunganishi kinaunganisha jina la pili katika orodha; jina limetoholewa kwa tahajia ya Kiswahili iliyozoeleka.
