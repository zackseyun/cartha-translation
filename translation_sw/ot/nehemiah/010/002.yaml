    text: Kwa maana ya karibu zaidi, “vitu vilivyotiwa muhuri” au “waliotiwa muhuri.” Katika muktadha huu, Kiebrania huenda kinarejelea hati za agano zilizotiwa muhuri ambazo majina haya yaliandikwa juu yake.
