    issue: “Pia” hufanya kifungu cha mwaka wa saba kionekane kama nyongeza huru.
    rationale: Kiebrania huunganisha masharti yote katika tamko moja la agano. Kiunganishi “na” pamoja na alama ya nusu-koloni hudumisha uhusiano huo kwa karibu zaidi.
  - severity: low
    issue: Tafsiri ya neno kwa neno katika tanbihi ina “mzigo/tozo ya kila mkono.”
    rationale: Katika Kiswahili, kiunganishi cha uhusiano kinacholingana na “mzigo” au “tozo” ni “wa,” si “ya.”
