  text: וְ/עַמֵּ֣י הָ/אָ֡רֶץ הַֽ/מְבִיאִים֩ אֶת הַ/מַּקָּח֨וֹת וְ/כָל שֶׁ֜בֶר בְּ/י֤וֹם הַ/שַּׁבָּת֙ לִ/מְכּ֔וֹר לֹא נִקַּ֥ח מֵ/הֶ֛ם בַּ/שַּׁבָּ֖ת וּ/בְ/י֣וֹם קֹ֑דֶשׁ וְ/נִטֹּ֛שׁ אֶת הַ/שָּׁנָ֥ה הַ/שְּׁבִיעִ֖ית וּ/מַשָּׁ֥א כָל יָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: sw
  text: Kuhusu watu wa nchi wanaoleta bidhaa na nafaka yoyote siku ya Sabato ili kuuza, hatutanunua kutoka kwao siku ya Sabato wala siku takatifu; na katika mwaka wa saba tutaiacha ardhi ipumzike, na tutasamehe kila deni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tutaachilia kila dai” au “tutaondoa kila tozo.” Kiebrania, neno kwa neno, ni “mzigo/tozo wa kila mkono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: watu wa nchi
  rationale: Usemi huu wa kawaida unarejelea watu wa mataifa au wakazi wasio Wayahudi waliowazunguka; Kiswahili hiki ni cha asili na hakilazimishi maana ya kisiasa ya kisasa.
- source_word: הַמַּקָּחוֹת
  choice: bidhaa
  rationale: Neno hilo linamaanisha vitu vinavyouzwa au bidhaa za biashara; ‘bidhaa’ ni neno la kawaida na pana.
- source_word: שֶׁבֶר
  choice: nafaka
  rationale: Katika muktadha wa biashara, neno hili kwa kawaida humaanisha nafaka kama bidhaa kuu ya chakula.
- source_word: לֹא נִקַּח מֵהֶם
  choice: hatutanunua kwao
  rationale: Ingawa kitenzi kimsingi ni ‘chukua’, muktadha wa bidhaa zilizoletwa kuuzwa unaonyesha wazi maana ya kununua.
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: wala siku takatifu
  rationale: Baada ya kauli hasi, ‘wala’ huendeleza marufuku kwa Kiswahili cha kawaida huku ‘siku takatifu’ ikihifadhi maana ya moja kwa moja.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: katika mwaka wa saba tutaiacha ardhi ipumzike
  rationale: Kitenzi ‘kuacha’ pamoja na ‘mwaka wa saba’ kinadokeza agizo la kutoilima ardhi; kutaja ardhi kwa uwazi kunatoa Kiswahili kinachoeleweka bila kubadili wajibu unaokusudiwa.
- source_word: מַשָּׁא כָל יָד
  choice: tutasamehe kila deni
  rationale: Nahau hii fupi na ngumu inaelekea kumaanisha kuondoa madai ya kifedha katika mwaka wa saba; maana nyingine halali imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Wajibu wa mwaka wa saba na maana ya מַשָּׁא כָל יָד
  choice: Kuiacha ardhi ipumzike na kusamehe kila deni
  alternative: Kuacha mwaka wa saba na kila dai au kila tozo
  rationale: Muktadha unaakisi sheria za mwaka wa sabato, zinazohusisha pumziko la ardhi na kuachilia madai ya kifedha. Kwa kuwa nahau ya mwisho ni yenye utata halisi, tafsiri mbadala imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi. ‘Sabato’ na ‘siku takatifu’ huhifadhi istilahi za chanzo bila kuongeza ufafanuzi wa kimadhehebu.
