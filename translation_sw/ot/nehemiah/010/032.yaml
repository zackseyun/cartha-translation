revisions:
- from: Na watu wa nchi wanaoleta bidhaa na nafaka yoyote siku ya Sabato ili kuuza, hatutanunua kwao siku ya Sabato wala siku takatifu. Pia, katika mwaka wa saba tutaiacha ardhi ipumzike na tutasamehe kila deni.[a]
  to: Kuhusu watu wa nchi wanaoleta bidhaa na nafaka yoyote siku ya Sabato ili kuuza, hatutanunua kutoka kwao siku ya Sabato wala siku takatifu; na katika mwaka wa saba tutaiacha ardhi ipumzike, na tutasamehe kila deni.[a]
  rationale: Marekebisho yanaimarisha muundo wa sentensi na kusahihisha sarufi ya tanbihi bila kubadili maana. “Ardhi ipumzike” hueleza kwa Kiswahili kitendo kinachodokezwa na kuacha mwaka wa saba, huku “kila deni” na tanbihi vikidumisha maana inayowezekana ya kifungu kigumu מַשָּׂא כָּל־יָד.
