translation_notes:
  register: Mtindo ni wa sasa, wenye heshima, na mfupi kama inavyofaa orodha ya waliotia muhuri agano. Majina yametoholewa kwa tahajia inayosomeka kwa wasemaji wa Kiswahili cha Afrika Mashariki.
