  text: 'and their brothers: Shebaniah, Hodiah, Kelita, Pelaiah, Hanan.'
translation:
  language: sw
  text: 'na ndugu zao: Shebania, Hodia, Kelita, Pelaya, Hanan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחֵי/הֶם
  choice: na ndugu zao
  rationale: Muundo huu unawakilisha kiunganishi ו, nomino אֲחֵי, na kiambishi cha nafsi ya tatu wingi wa kiume. Katika orodha hii ya wanaume, “ndugu zao” ni ya asili katika Kiswahili na haihitaji ufafanuzi mpana zaidi kama “jamaa zao.”
- source_word: שְׁבַנְיָה
  choice: Shebania
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata kwa karibu umbo la Kiebrania.
- source_word: הוֹדִיָּה
  choice: Hodia
  rationale: Jina la mtu limetoholewa moja kwa moja kwa tahajia ya Kiswahili.
- source_word: קְלִיטָא
  choice: Kelita
  rationale: Jina la mtu limetoholewa kwa namna inayohifadhi sauti kuu za Kiebrania na kusomeka kawaida katika Kiswahili.
- source_word: פְּלָאיָה
  choice: Pelaya
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili; “-ya” huwakilisha sehemu ya mwisho ya jina kwa njia iliyo wazi bila kuiga tahajia ya Kiingereza.
- source_word: חָנָן
  choice: Hanani
  rationale: Jina hili limewasilishwa kwa umbo la “Hanani,” lililozoeleka katika Biblia za Kiswahili kwa jina hili la Kiebrania na linalotofautisha usomaji wake wa mwisho waziwazi.
