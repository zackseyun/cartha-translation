  naturalness: The Swahili is clear, modern, and appropriately formal. Fronting the recipients is natural. 'Sehemu ya kwanza ya unga wetu uliokandwa' and 'zaka ya mazao ya ardhi yetu' are understandable and fit the agricultural-offering context.
  terminology: '''Matoleo,'' ''divai mpya,'' ''mafuta,'' ''zaka,'' ''Walawi,'' and ''makuhani'' are suitable Standard East African Swahili terms. The footnotes responsibly retain the lexical and contextual alternatives without imposing a doctrinal reading.'
