source:
  edition: WLC
  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: sw
  text: Nasi tutaleta kwa makuhani, katika vyumba[b] vya nyumba ya Mungu wetu, sehemu ya kwanza ya unga wetu uliokandwa[a], matoleo yetu, matunda ya kila mti, divai mpya na mafuta. Pia tutawapa Walawi zaka ya mazao ya ardhi yetu; na hao Walawi ndio wanaokusanya zaka katika miji yote tunakofanya kazi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu ya kwanza ya madonge yetu ya unga.” Neno la Kiebrania linamaanisha unga uliokandwa au donge la unga ambalo sehemu yake ya kwanza ilitengwa kuwa toleo.
    reason: lexical_alternative
  - marker: b
    text: Au “maghala.” Neno la Kiebrania linamaanisha vyumba katika eneo la hekalu, ambavyo mara nyingi vilitumika kuhifadhi vitu.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kwa tafsiri ya karibu ni “katika miji yote ya kazi yetu” au “ya utumishi wetu.” Huenda kinarejelea miji iliyohusiana na shughuli za watu za kilimo.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: sehemu ya kwanza ya unga wetu uliokandwa
  rationale: רֵאשִׁית ni sehemu ya kwanza iliyotengwa, na עֲרִיסָה hapa ni donge au unga uliokandwa. Tafsiri hii inahifadhi picha halisi ya toleo hilo bila kutumia neno pana lisiloonyesha kinachotolewa.
- source_word: תְּרוּמֹתֵינוּ
  choice: matoleo yetu
  rationale: תְּרוּמָה ni kitu kilichotengwa na kutolewa kwa matumizi matakatifu. “Matoleo” ni Kiswahili cha sasa, cha kawaida na chenye heshima, bila kuingiza istilahi ya kidhehebu.
- source_word: פְּרִי כָל עֵץ
  choice: matunda ya kila mti
  rationale: Muundo huu una maana ya kugawa kwa kila mti; “matunda ya kila mti” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: תִּירוֹשׁ
  choice: divai mpya
  rationale: תִּירוֹשׁ kwa kawaida ni divai mpya au mazao mapya ya zabibu yaliyokusudiwa kuwa divai. “Divai mpya” huhifadhi umahususi wa orodha ya mazao.
- source_word: יִצְהָר
  choice: mafuta
  rationale: Katika orodha za mazao, neno hili humaanisha mafuta, kwa kawaida mafuta ya zeituni. “Mafuta” huepuka kuongeza umahususi ambao haujaelezwa wazi katika neno lenyewe.
- source_word: נָבִיא
  choice: tutaleta
  rationale: Hifili ya בוא katika nafsi ya kwanza wingi inaeleza ahadi ya jumuiya ya kuleta vitu hivi. “Tutaleta” ni ya kawaida na hudumisha nguvu ya ahadi.
- source_word: לִשְׁכוֹת
  choice: vyumba
  rationale: לִשְׁכּוֹת ni vyumba katika jengo au eneo la hekalu. “Vyumba” hudumisha maana ya kimuundo; tanbihi inaeleza kwamba huenda vilitumika kama maghala.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: zaka ya mazao ya ardhi yetu
  rationale: Kiebrania kwa kifupi kinasema “zaka ya ardhi yetu,” lakini katika muktadha zaka inatokana na mazao yake. Kuongeza “mazao ya” huleta maana hiyo kwa Kiswahili cha kawaida bila kubadili kinachorejelewa.
- source_word: הַמְעַשְּׂרִים
  choice: wanaokusanya zaka
  rationale: Kitenzi עשר katika muktadha huu kinaeleza kuchukua au kukusanya sehemu ya kumi. “Wanaokusanya zaka” huonyesha wazi jukumu la Walawi.
- source_word: בְּכֹל עָרֵי עֲבֹדָתֵנוּ
  choice: katika miji yote tunakofanya kazi
  rationale: עֲבֹדָה inaweza kuwa kazi, utumishi au shughuli ya kulima. Tafsiri hii inahifadhi wazo pana la kazi na kuacha tanbihi ieleze uwezekano wa maana nyingine.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili orodha ndefu isomeke kwa urahisi. Mpangilio wa vipashio umerekebishwa kwa sintaksia ya kawaida ya Kiswahili huku walengwa wa matoleo na zaka wakibaki wazi. “Zaka” imetumiwa kwa sababu ni neno la kawaida la Kiswahili kwa sehemu ya kumi.
