  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: sw
  text: Kwa sababu ya hayo yote,[a] tunafanya makubaliano thabiti na kuyaandika; na juu ya hati iliyotiwa muhuri[b] yamo majina ya viongozi wetu, Walawi wetu, na makuhani wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na katika hayo yote.” Kiebrania kinaweza kuonyesha sababu ya makubaliano haya au mazingira ambamo yanafanywa.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “na juu ya kilichotiwa muhuri wako viongozi wetu, Walawi wetu, na makuhani wetu.” Inaelekea kifungu hiki kinarejelea hati rasmi yenye mihuri; “majina ya” hufafanua maana inayodokezwa.
    reason: clarification
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: Kwa sababu ya hayo yote
  rationale: Katika muktadha huu בְּ inarejelea maungamo na matukio yaliyotangulia kwa maana ya kisababishi. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha rejeo la nyuma.
- source_word: כֹּרְתִים
  choice: tunaweka
  rationale: כרת pamoja na אֲמָנָה ni nahau ya kufanya au kuweka makubaliano. Kiswahili hakitumii kwa kawaida tafsiri ya moja kwa moja 'kukata' katika muktadha huu.
- source_word: אֲמָנָה
  choice: ahadi yenye nguvu
  rationale: Nomino hii hueleza wajibu thabiti na wa kutegemewa. 'Ahadi yenye nguvu' inaeleweka kwa urahisi na inadumisha uzito wake bila kuilazimisha kuwa istilahi maalumu ya agano.
- source_word: וְכֹתְבִים
  choice: kwa maandishi
  rationale: Kirai hiki kinaonyesha kwamba ahadi inaandikwa rasmi; 'kwa maandishi' ni Kiswahili cha kawaida na kifupi.
- source_word: וְעַל הֶחָתוּם
  choice: na juu ya hati iliyotiwa muhuri
  rationale: Kifungu hiki kinaelekea kurejelea chombo rasmi kilichoandikwa na kutiwa muhuri. 'Hati' ni neno la kawaida linalofaa muktadha wa kisheria na kiutawala.
- source_word: שָׂרֵינוּ
  choice: viongozi wetu
  rationale: שׂרים hapa ni viongozi wa kiraia au wenye madaraka. 'Viongozi' ni pana na ya asili bila kudokeza ufalme.
- source_word: לְוִיֵּינוּ
  choice: Walawi wetu
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la kikabila na la huduma ya ibada.
- source_word: כֹּהֲנֵינוּ
  choice: makuhani wetu
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya kundi la kikuhani.
theological_decisions:
- issue: Iwapo אֲמָנָה itafsiriwe kama 'agano' au 'ahadi yenye nguvu'
  choice: ahadi yenye nguvu
  alternative: agano thabiti
  rationale: Neno linaweza kuhusiana na lugha ya kufanya agano, lakini lenyewe linasisitiza uthabiti au uaminifu wa wajibu. Tafsiri iliyochaguliwa inahifadhi tofauti hiyo bila kuingiza istilahi nzito kuliko maandishi yanavyolazimu.
- issue: Maana ya majina kuwa 'juu ya hati iliyotiwa muhuri'
  choice: yamo majina ya viongozi wetu, Walawi wetu, na makuhani wetu
  alternative: wako viongozi wetu, Walawi wetu, na makuhani wetu
  rationale: Kwa kawaida watu wenyewe hawakai juu ya hati; kinachokusudiwa ni majina au alama zao za uthibitisho. 'Yamo majina' hufanya maana ya kitendo rasmi iwe wazi, huku tanbihi ikihifadhi muundo wa karibu zaidi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa wasomaji wa kawaida, huku tanbihi zikihifadhi uwezekano wa kisababishi au kimazingira katika וּבְכָל זֹאת na ufupi wa Kiebrania katika וְעַל הֶחָתוּם.
