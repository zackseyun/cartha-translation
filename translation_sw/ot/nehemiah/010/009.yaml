lexical_decisions:
- source_word: מַֽעַזְיָה
  choice: Maazia
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kutafsiri maana yake.
- source_word: בִלְגַּי
  choice: Bilgai
  rationale: Jina la mtu limenukuliwa kwa tahajia inayokaribia umbo la Kiebrania na iliyo rahisi kusomeka kwa Kiswahili.
- source_word: שְׁמַֽעְיָה
  choice: Shemaia
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika Kiswahili, huku sehemu ya mwisho ya jina ikiwakilishwa kwa '-ia'.
- source_word: אֵ֖לֶּה
  choice: hao
  rationale: Kiwakilishi cha kuonyesha cha wingi kinawarejelea watu waliotajwa; 'hao' ni cha asili na wazi katika Kiswahili.
- source_word: הַ/כֹּהֲנִֽים
  choice: makuhani
  rationale: Nomino ya wingi yenye kibainishi katika Kiebrania; Kiswahili hakihitaji kibainishi tofauti hapa kwa sababu 'hao ndio' tayari linabainisha kundi.
