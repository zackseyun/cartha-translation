base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: sw
  text: na wazaliwa wa kwanza wa wana wetu na wa mifugo yetu[a], kama ilivyoandikwa katika Torati, na wazaliwa wa kwanza wa ng’ombe wetu na wa kondoo na mbuzi wetu[b], kuwapeleka katika nyumba ya Mungu wetu kwa makuhani wanaohudumu katika nyumba ya Mungu wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kwa kufuata maagizo ya Torati kuhusu wazaliwa wa kwanza wa watu na wa wanyama.
    reason: cross_reference
  - marker: b
    text: Au, “wazaliwa wa kwanza wa makundi yetu ya ng’ombe na ya kondoo na mbuzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: wazaliwa wa kwanza wa wana wetu
  rationale: Hutaja wazaliwa wa kwanza miongoni mwa wana wao bila kuongeza hapa masharti ya kuwakomboa ambayo hayajaelezwa moja kwa moja katika mstari huu.
- source_word: וּבְהֶמְתֵּינוּ
  choice: na wa mifugo yetu
  rationale: בְּהֵמָה hapa ni neno la jumla kwa wanyama wanaofugwa; ‘mifugo’ ni Kiswahili cha kawaida na chenye upana unaofaa.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: kama ilivyoandikwa katika Torati
  rationale: Kauli hii inarejelea maagizo ya Torah yaliyoandikwa; ‘Torati’ hutambulisha rejeleo hilo maalumu kwa uwazi.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: wazaliwa wa kwanza wa ng’ombe wetu na wa kondoo na mbuzi wetu
  rationale: בָּקָר ni hasa ng’ombe, na צֹאן ni mifugo midogo inayojumuisha kondoo na mbuzi. Kutaja aina hizi kunaleta maana kamili kwa Kiswahili cha sasa bila kuifanya צֹאן kuwa kondoo peke yao.
- source_word: לְהָבִיא
  choice: kuwaleta
  rationale: Kitenzi-jina kinaendeleza kusudi la wajibu ulioorodheshwa; kiambishi ‘-wa-’ kinafaa kwa wazaliwa wa kwanza wa watu na wanyama wanaotajwa.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: katika nyumba ya Mungu wetu
  rationale: ‘Nyumba ya Mungu wetu’ huhifadhi usemi halisi wa Kiebrania; ‘katika’ ni Kiswahili cha kawaida kwa mwendo wa kuingia au kufika mahali hapa.
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: kwa makuhani wanaohudumu
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha huduma yao inayoendelea; ‘wanaohudumu’ ni wazi na huhifadhi maana ya huduma ya kikuhani.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: katika nyumba ya Mungu wetu
  rationale: Kurudia kirai hiki kunafuata msisitizo wa Kiebrania na kuweka wazi mahali ambapo makuhani wanahudumu.
theological_decisions:
- issue: Kutafsiri בֵּית אֱלֹהֵינוּ kuwa ‘nyumba ya Mungu wetu’ au ‘hekalu la Mungu wetu’
  choice: nyumba ya Mungu wetu
  alternative: hekalu la Mungu wetu
  rationale: Ingawa kinachorejelewa ni hekalu, Kiebrania chenyewe kinasema ‘nyumba ya Mungu wetu.’ Tafsiri hiyo huhifadhi tamathali ya chanzo bila kuongeza ufafanuzi usio wa lazima.
- issue: Kueleza wazi kama wazaliwa wa kwanza walipaswa kutolewa dhabihu au kukombolewa
  choice: kuacha neno pana ‘wazaliwa wa kwanza’ bila maelezo hayo katika andiko kuu
  alternative: wazaliwa wa kwanza wa kukombolewa / matoleo ya wazaliwa wa kwanza
  rationale: Mstari unarejelea maagizo ya Torati lakini hautofautishi hapa kati ya ukombozi na dhabihu. Tafsiri haipaswi kutatua kimya-kimya jambo ambalo mstari huu haujalifafanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Torati’ na ‘nyumba ya Mungu wetu’ hudumisha sauti ya agano na urudiaji wa chanzo; ‘kondoo na mbuzi’ hufafanua upana wa צֹאן bila kuleta istilahi nzito.
