  text: וּ/שְׁאָ֣ר הָ/עָ֡ם הַ/כֹּהֲנִ֣ים הַ֠/לְוִיִּם הַ/שּׁוֹעֲרִ֨ים הַ/מְשֹׁרְרִ֜ים הַ/נְּתִינִ֗ים וְֽ/כָל הַ/נִּבְדָּ֞ל מֵ/עַמֵּ֤י הָ/אֲרָצוֹת֙ אֶל תּוֹרַ֣ת הָ/אֱלֹהִ֔ים נְשֵׁי/הֶ֖ם בְּנֵי/הֶ֣ם וּ/בְנֹתֵי/הֶ֑ם כֹּ֖ל יוֹדֵ֥עַ מֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: sw
  text: na watu waliosalia—makuhani, Walawi, walinzi wa malango, waimbaji, watumishi wa Hekalu[a], na wote waliojitenga na mataifa ya nchi ili waifuate Sheria ya Mungu—wake zao, wana wao, na binti zao, kila aliyejua na kuelewa[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanethini,” jina la jadi lililonakiliwa kwa kundi la watumishi wa Hekalu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinatumia maumbo ya umoja wa kiume yenye maana ya kijumla: “kila aliyejitenga … kila aliyejua na kuelewa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: na watu wengine
  rationale: Hutoa maana ya sehemu iliyobaki ya jumuiya kwa Kiswahili cha kawaida, bila kuifanya עָם kuwa ‘taifa’.
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: makuhani, Walawi, walinzi wa malango, waimbaji
  rationale: Haya ni majina ya kawaida na yaliyo wazi ya makundi ya wahudumu; ‘waimbaji’ huhifadhi maana mahsusi ya mzizi שׁיר kuliko ‘wanamuziki’.
- source_word: הַנְּתִינִים
  choice: watumishi wa Hekalu
  rationale: Neno la maana linaeleweka zaidi kuliko kulinakili jina la jadi; muktadha unawaonyesha kuwa kundi lililowekwa kwa huduma ya Hekalu.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: na wote waliokuwa wamejitenga na mataifa ya nchi ili waifuate Sheria ya Mungu
  rationale: ‘Waliojitenga na’ huhifadhi kujitenga kwa hiari, ‘mataifa ya nchi’ huhifadhi wingi wa Kiebrania, na ‘ili waifuate’ huwasilisha kwa Kiswahili cha asili mwelekeo wa kujitenga kwao kuelekea Torati ya Mungu.
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: wake zao, wana wao na binti zao
  rationale: Huhifadhi makundi yote matatu yaliyotajwa wazi katika Kiebrania badala ya kuyafupisha kuwa ‘familia zao’.
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: kila mwenye maarifa na ufahamu
  rationale: Huhifadhi jozi ya dhana za kujua na kuelewa, huku ikisomeka kwa kawaida kama sifa ya kila mshiriki mwenye uwezo wa kuingia katika agano kwa uelewa.
theological_decisions:
- issue: Umoja wa kiume wenye maana ya mkusanyiko katika הַנִּבְדָּל na יוֹדֵעַ מֵבִין
  choice: Kutumia wingi wa kawaida ‘wote waliokuwa wamejitenga’ na usemi wa kijumla ‘kila mwenye maarifa na ufahamu,’ kisha kueleza umbo la Kiebrania katika tanbihi.
  alternative: Kila aliyejitenga mwenyewe … kila aliyejua na kuelewa.
  rationale: Kiswahili hakina kiwakilishi cha kurejelea nafsi chenye jinsia kama ‘himself’; wingi na ‘kila mwenye’ huonyesha kwa uaminifu nguvu ya kijumla bila kudai kwamba kundi lilikuwa la wanaume pekee, hasa kwa kuwa wake, wana na binti wametajwa wazi.
- issue: Maana ya אֶל baada ya ‘kujitenga’
  choice: ili waifuate Sheria ya Mungu
  alternative: kwenda kwenye Sheria ya Mungu; kushikamana na Sheria ya Mungu
  rationale: Usemi huo unaonyesha mwelekeo na kusudi la kujiweka upande wa Torati bila kutumia Kiswahili kisicho cha kawaida wala kuongeza dhana mahsusi ya kidhehebu.
- issue: Utambulisho wa הַנְּתִינִים
  choice: watumishi wa Hekalu
  alternative: Wanethini
  rationale: Tafsiri ya jukumu lao huwafahamisha wasomaji wa sasa; tanbihi inadumisha jina la jadi bila kulifanya kuwa tafsiri kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Vistari virefu vinahifadhi muundo wa orodha na sentensi isiyokamilika inayoendelea katika mstari unaofuata. ‘Sheria’ imeandikwa kwa herufi kubwa kwa kuwa hapa inarejelea Torati ya Mungu.
