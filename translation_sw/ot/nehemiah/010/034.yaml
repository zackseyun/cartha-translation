base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: sw
  text: kwa ajili ya mikate iliyopangwa[a], sadaka ya nafaka ya daima[b], na sadaka ya kuteketezwa ya daima[b], kwa ajili ya Sabato, miandamo ya mwezi, nyakati zilizowekwa[c], vitu vitakatifu[d], na sadaka za dhambi[e], ili kufanya upatanisho kwa ajili ya Israeli, na kwa ajili ya kazi yote ya nyumba ya Mungu wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikate ya onyesho,” au “mikate iliyowekwa mbele.”
    reason: lexical_alternative
  - marker: b
    text: “Ya daima” hapa inaweza pia kutafsiriwa “ya kawaida”; yaani, iliyotolewa mara kwa mara kwa utaratibu uliowekwa.
    reason: lexical_alternative
  - marker: c
    text: “Nyakati zilizowekwa” zinaweza kujumuisha sikukuu zilizowekwa.
    reason: lexical_alternative
  - marker: d
    text: Au, “sadaka takatifu,” au “vitu vilivyowekwa wakfu.”
    reason: lexical_alternative
  - marker: e
    text: “Sadaka za dhambi” pia zinaweza kueleweka katika muktadha huu kuwa “sadaka za utakaso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: mikate iliyopangwa
  rationale: Kirai hiki kihalisi kinamaanisha mikate iliyowekwa kwa mpangilio mbele za Mungu. Tafsiri hii ni wazi kwa msomaji wa sasa bila kutumia istilahi ya kale, na wingi wa Kiswahili unafaa kwa mikate husika.
- source_word: מִנְחַת הַתָּמִיד
  choice: sadaka ya nafaka ya kawaida
  rationale: Katika muktadha wa ibada מִנְחָה ni sadaka ya nafaka, na תָּמִיד huonyesha kutolewa kwake mara kwa mara kama ilivyoamriwa.
- source_word: עֹלַת הַתָּמִיד
  choice: sadaka ya kuteketezwa ya kawaida
  rationale: עֹלָה ni sadaka iliyoteketezwa, huku תָּמִיד ikidokeza utaratibu wake wa kudumu au wa mara kwa mara.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: Sabato, miandamo ya mwezi, nyakati zilizowekwa
  rationale: Orodha ya nyakati za ibada imehifadhiwa bila kuifanya מוֹעֲדִים kuwa sikukuu pekee; neno hilo linaweza kujumuisha sikukuu na mikusanyiko mingine iliyowekwa.
- source_word: וְלַקֳּדָשִׁים
  choice: vitu vitakatifu
  rationale: Wingi huu ni mpana na unaweza kumaanisha vitu au matoleo yaliyowekwa wakfu. 'Vitu vitakatifu' huhifadhi upana huo.
- source_word: וְלַחַטָּאוֹת
  choice: sadaka za dhambi
  rationale: Katika muktadha wa dhabihu חַטָּאת kwa kawaida hutaja sadaka ya dhambi, ingawa pia inaweza kueleweka kwa msisitizo wa utakaso.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: za kufanya upatanisho kwa ajili ya Israeli
  rationale: Kauli hii huhifadhi maana ya kiibada ya כפר bila kufafanua zaidi namna au nadharia ya upatanisho.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: na kwa ajili ya kazi yote ya nyumba ya Mungu wetu
  rationale: מְלָאכָה ni neno pana la kazi; hivyo tafsiri haipunguzi maana yake kuwa huduma za ibada pekee.
theological_decisions:
- issue: Uwasilishaji wa istilahi za dhabihu bila kuzifasiri kupita kiasi
  choice: Kutumia 'sadaka ya nafaka,' 'sadaka ya kuteketezwa,' 'sadaka za dhambi,' na 'kufanya upatanisho.'
  alternative: Kutumia 'sadaka ya utakaso' au maelezo mapana zaidi ya athari za dhabihu.
  rationale: Istilahi hizi zinahifadhi makundi ya kiibada ya Kiebrania huku zikiepuka kuingiza nadharia mahususi ya kitheolojia.
- issue: Upana wa קֳּדָשִׁים
  choice: vitu vitakatifu
  alternative: sadaka takatifu; vitu vilivyowekwa wakfu
  rationale: Kiebrania hakibainishi hapa kuwa kinamaanisha sadaka pekee, hivyo tafsiri pana huhifadhi utata halisi.
- issue: Uhusiano wa Sabato, miandamo ya mwezi, na nyakati zilizowekwa na orodha ya sadaka
  choice: Kuziorodhesha kama nyakati zinazohitaji mahitaji hayo, bila kuzifunga kisintaksia kwa sadaka moja pekee.
  alternative: Kuzifanya zieleze moja kwa moja 'sadaka ya kuteketezwa ya kawaida.'
  rationale: Muundo wa Kiebrania ni mfululizo mfupi wenye viunganishi vichache; tafsiri hii hudumisha mtiririko na kuepuka kutatua kabisa uhusiano wa kila kipengele.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha umehifadhiwa; istilahi za ibada zimeelezwa kwa lugha inayoeleweka bila kuondoa utata wa Kiebrania.
