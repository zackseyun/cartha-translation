base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: sw
  text: 'na Walawi: Yeshua mwana wa Azania, Binui wa wana wa Henadadi, na Kadmieli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: na Walawi
  rationale: Kiunganishi וְ kinaendeleza orodha ya waliotangulia, na nomino yenye kifungu maalumu imetafsiriwa kwa wingi kama “Walawi.” Hakuna kitenzi katika Kiebrania, kwa hiyo hakuna kilichoongezwa.
- source_word: וְיֵשׁוּעַ
  choice: Yeshua
  rationale: Jina limenukuliwa kwa namna inayokaribia umbo la Kiebrania. Kiunganishi chake hakijarudiwa kwa sababu “na Walawi:” tayari kinaingiza orodha hiyo kwa kawaida katika Kiswahili.
- source_word: בֶּן אֲזַנְיָה
  choice: mwana wa Azania
  rationale: Muundo wa nasaba בן umeonyeshwa moja kwa moja kama “mwana wa.” Majina yamenukuliwa kwa tahajia inayofaa Kiswahili.
- source_word: בִּנּוּי
  choice: Binui
  rationale: Jina binafsi limenukuliwa kwa kufuata matamshi ya Kiebrania na mfumo wa tahajia ya Kiswahili.
- source_word: מִבְּנֵי חֵנָדָד
  choice: wa wana wa Henadadi
  rationale: Katika muktadha wa orodha ya koo, מן pamoja na בני huonyesha kuwa Binui alitoka au alihesabiwa katika ukoo wa Henadadi. “Wa wana wa” huhifadhi kwa kiasi kikubwa umbo la chanzo huku likieleweka kama utambulisho wa ukoo.
- source_word: קַדְמִיאֵל
  choice: Kadmieli
  rationale: Jina limenukuliwa kwa tahajia ya Kiswahili, likihifadhi konsonanti kuu za umbo la Kiebrania.
theological_decisions: []
translation_notes:
  register: Lugha ni ya orodha rasmi, fupi na yenye heshima. Koloni linaonyesha kwamba majina yanayofuata ni ya kundi la Walawi. Hakuna tanbihi iliyowekwa kwa kuwa data ya Kiingereza inaonekana kuhamisha alama ya kwanza kwenye sehemu isiyolingana na maelezo yake, na tanbihi ya pili haisemi tofauti halisi ya tahajia; matini ya Kiebrania yenyewe iko wazi.
