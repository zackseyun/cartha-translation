  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: sw
  text: na kuleta malimbuko ya ardhi yetu na malimbuko ya matunda yote ya kila mti[a], mwaka baada ya mwaka, katika nyumba ya Yahwe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mazao ya kwanza ya kila aina ya tunda la kila mti.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: na kuleta
  rationale: Kiunganishi pamoja na kitenzi-jina kinaendeleza orodha ya wajibu wa agano; “kuleta” ni ya kawaida na sahihi kwa sadaka zinazoletwa hekaluni.
- source_word: בִּכּוּרֵי
  choice: malimbuko
  rationale: Neno hili humaanisha mazao ya kwanza yanayotolewa kwa Mungu; “malimbuko” huhifadhi maana ya kiibada.
- source_word: אַדְמָתֵנוּ
  choice: ardhi yetu
  rationale: אַדמה inaweza kumaanisha ardhi, udongo, au shamba; “ardhi yetu” ni ya asili katika Kiswahili na inafaa katika muktadha wa kilimo bila kuifanya iwe ya eneo la kisiasa.
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: na malimbuko ya kila tunda la kila mti
  rationale: Muundo huu unaakisi msisitizo mpana wa Kiebrania huku ukiendelea kueleweka kwa Kiswahili.
- source_word: פְּרִי
  choice: tunda
  rationale: Katika kirai kinachohusu miti, “tunda” ni mahususi zaidi kuliko “mazao.”
- source_word: כָל עֵץ
  choice: kila mti
  rationale: “Kila mti” huhifadhi maana gawanyaji ya כָל katika muundo huu.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Nahau hii huonyesha kurudiwa kila mwaka; tafsiri hii ni ya kawaida na huhifadhi msisitizo wa mfululizo.
- source_word: לְ/בֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi picha halisi ya בֵּית, na “Yahwe” huwakilisha jina la agano יהוה badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kina Tetragramatoni yenyewe. “Yahwe” huhifadhi jina hilo la agano badala ya kutumia cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Maana ya “nyumba ya Yahwe”
  choice: Kudumisha “nyumba” katika matini
  alternative: hekalu la Yahwe
  rationale: “Nyumba” ndiyo tafsiri ya karibu ya בֵּית na hudumisha lugha ya chanzo; tanbihi hufafanua kwamba hapa inamaanisha hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Malimbuko” limetumiwa kama istilahi ya kawaida ya kibiblia na kiibada; alama zote za tanbihi zimewekwa katika matini.
