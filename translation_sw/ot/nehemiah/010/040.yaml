source:
  edition: WLC
  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: sw
  text: Kwa maana watu wa Israeli na Walawi[a] wataleta vyumbani mchango wa nafaka, divai mpya na mafuta. Humo mna vyombo vya mahali patakatifu, makuhani wanaohudumu, walinzi wa malango na waimbaji. Nasi hatutaitelekeza nyumba ya Mungu wetu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, Kiebrania husema, “wana wa Israeli na wana wa Lawi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hatutaipuuza nyumba ya Mungu wetu.”
    reason: alternative_reading
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: vyumbani
  rationale: Neno hili linataja vyumba vya pembeni vya hekalu, vilivyotumiwa pia kwa kuhifadhi vitu. “Vyumbani” ni la kawaida na halibani maana kuwa maghala pekee.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: watu wa Israeli na Walawi
  rationale: Ingawa Kiebrania kwa neno moja moja ni “wana wa Israeli na wana wa Lawi,” Kiswahili hiki kinataja makundi hayo kwa njia ya asili na inayofahamika, huku tanbihi ikihifadhi umbo la asili.
- source_word: תְּרוּמַת
  choice: mchango
  rationale: Ni sehemu ya mazao iliyotengwa na kutolewa kwa matumizi matakatifu. “Mchango” huwasilisha maana hiyo bila kutumia istilahi finyu ya kidini.
- source_word: הַדָּגָן
  choice: nafaka
  rationale: Ni jina la jumla la mazao ya nafaka.
- source_word: הַתִּירוֹשׁ
  choice: divai mpya
  rationale: Hutaja divai ya mazao mapya au divai changa; “divai mpya” huhifadhi dokezo hilo la kilimo.
- source_word: הַיִּצְהָר
  choice: mafuta
  rationale: Katika orodha hii ya mazao, kinachokusudiwa ni mafuta ya zeituni; “mafuta” ni tafsiri fupi na ya kawaida katika muktadha huu.
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: vyombo vya mahali patakatifu
  rationale: Hutaja vifaa na vyombo vinavyotumiwa katika sehemu takatifu ya hekalu.
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: makuhani wanaohudumu
  rationale: Huhifadhi maana ya makuhani waliokuwa wakifanya huduma yao.
- source_word: הַשּׁוֹעֲרִים
  choice: walinzi wa malango
  rationale: Hawa ni watumishi waliolinda na kusimamia malango ya hekalu.
- source_word: לֹא נַעֲזֹב
  choice: hatutaitelekeza
  rationale: Kitenzi kinaweza kumaanisha kuacha, kutelekeza, au kutotunza. “Hatutaitelekeza” huhifadhi upana wa ahadi ya kutoliacha hekalu wala kupuuza mahitaji yake.
theological_decisions:
- issue: Majina ya makundi ya agano yenye umbo la kifamilia
  choice: watu wa Israeli na Walawi
  alternative: wana wa Israeli na wana wa Lawi
  rationale: Tafsiri kuu inatumia Kiswahili cha kawaida bila kupoteza utambulisho wa makundi; tanbihi inaonyesha ulinganifu wa kifamilia uliopo katika Kiebrania.
- issue: Maana ya kutokuiacha nyumba ya Mungu
  choice: hatutaitelekeza nyumba ya Mungu wetu
  alternative: hatutaipuuza nyumba ya Mungu wetu
  rationale: Kiebrania kina upana unaojumuisha kuacha na kutotunza. “Kutelekeza” hakufungi kauli kwenye msaada wa mali pekee, ingawa muktadha unahusu kuendeleza huduma ya hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi ya Kiebrania imegawanywa kwa mtiririko wa asili wa Kiswahili; “Humo mna” huhifadhi wazo la kwamba vyombo na watumishi hao wanapatikana katika vyumba vilivyotajwa.
