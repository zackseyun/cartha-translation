base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: sw
  text: Pia tulijiwekea wajibu wa kutoa kila mwaka theluthi moja ya shekeli kwa ajili ya huduma ya nyumba ya Mungu wetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pia tulijiwekea masharti ya kutoa kila mwaka theluthi moja ya shekeli.”
    reason: Mִצְוֺת inaweza kueleweka kwa maana ya mkusanyiko au wingi, ‘masharti,’ badala ya wajibu mmoja.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ עָלֵינוּ
  choice: Pia tulijiwekea
  rationale: Hifili ya עמד pamoja na עָלֵינוּ inaonyesha kwamba jumuiya ilijiwekea sharti lenyewe. ‘Tulijiwekea’ ni Kiswahili cha kawaida na huhifadhi hali ya kujifunga kwa hiari.
- source_word: מִצְוֺת
  choice: wajibu
  rationale: Nomino hii, ingawa umbo lake linaweza kuonekana la wingi au la mkusanyiko, hapa inatanguliza sharti moja maalumu la kutoa mchango. ‘Wajibu’ huonyesha nguvu yake ya lazima bila kuifanya amri ya moja kwa moja kutoka kwa Mungu.
- source_word: לָתֵת
  choice: kutoa
  rationale: Hii ndiyo maana ya moja kwa moja ya נתן katika muktadha wa mchango; ‘kulipa’ ingeongeza wazo la deni au ada.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: theluthi moja ya shekeli
  rationale: Huwakilisha kwa usahihi sehemu ya tatu ya kipimo cha fedha kilichotajwa katika Kiebrania.
- source_word: בַּשָּׁנָה
  choice: kila mwaka
  rationale: Kirai hiki hapa kinaonyesha mchango unaorudiwa mwaka baada ya mwaka.
- source_word: לַעֲבֹדַת
  choice: kwa ajili ya huduma
  rationale: Katika muktadha wa nyumba ya Mungu, עֲבֹדָה ni shughuli za ibada na kazi zinazohusiana nazo; ‘huduma’ ni pana na ya asili bila kuwa ya kiufundi kupita kiasi.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: nyumba ya Mungu wetu
  rationale: Huhifadhi tamathali ya Kiebrania na sauti yake ya agano; ‘hekalu’ ni sahihi kimuktadha lakini si tafsiri ya moja kwa moja.
theological_decisions:
- issue: Asili ya wajibu katika מִצְוֺת
  choice: wajibu ambao jumuiya ilijiwekea
  alternative: amri; wajibu mbalimbali
  rationale: Sentensi inaonyesha jumuiya ikijifunga kwa mchango maalumu wa kila mwaka. ‘Wajibu’ huhifadhi uzito wa sharti hilo huku ikiepuka kudai wazi kwamba hapa Mungu ndiye aliyetoa amri hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Shekeli’ imehifadhiwa kama jina la kipimo cha fedha cha kale; sentensi imeundwa kwa urahisi wa kusomeka bila kufuta hali ya jumuiya kujifunga yenyewe.
