translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa kuendelea kutoka mstari uliotangulia umehifadhiwa kwa ‘na kwamba,’ na sentensi ya tangazo imewasilishwa kwa mtiririko wa kawaida.
