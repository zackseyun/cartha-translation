base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: sw
  text: na kwamba watangaze na kueneza taarifa katika miji yao yote na Yerusalemu, wakisema, “Nendeni milimani, mkalete majani ya mizeituni, ya mti wa mafuta[a], ya mihadasi, ya mitende, na ya miti yenye majani mengi, ili kutengeneza vibanda, kama ilivyoandikwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mzeituni wa mwituni” au “oleasta” kwa “mti wa mafuta” (Kiebrania: עֵץ שֶׁמֶן). Utambulisho kamili wa aina ya mti huu hauna uhakika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: na kwamba
  rationale: Inaendeleza yaliyopatikana yameandikwa katika Sheria katika mstari uliotangulia, huku ikihifadhi kiunganishi na kishazi cha maudhui.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: watangaze na kueneza habari
  rationale: Kauli hizi zinaeleza kutangaza hadharani na kusambaza ujumbe kwa mapana; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: katika miji yao yote na Yerusalemu
  rationale: Inahifadhi upeo wa tangazo katika makazi yao yote pamoja na Yerusalemu.
- source_word: צְאוּ הָהָר
  choice: Nendeni milimani
  rationale: הָהָר hapa inaelekea kumaanisha eneo la vilima au milima ambako matawi yangepatikana, si lazima mlima mmoja maalumu.
- source_word: עֲלֵי
  choice: matawi
  rationale: Ingawa neno hilo kihalisi ni ‘majani ya,’ muktadha wa kukusanya vifaa vya kujenga vibanda unaelezwa kwa kawaida zaidi kwa ‘matawi,’ yaani matawi yenye majani.
- source_word: עֵץ שֶׁמֶן
  choice: miti ya mafuta
  rationale: Hii inafuata kwa karibu jina la Kiebrania bila kudai kwa uhakika aina ya mti ambayo utambulisho wake unabishaniwa.
- source_word: הֲדַס
  choice: mihadasi
  rationale: Hili ni jina la kawaida la mmea huu katika Kiswahili cha kibiblia na linafaa katika orodha ya miti.
- source_word: תְמָרִים
  choice: mitende
  rationale: Wingi wa neno la Kiebrania umehifadhiwa, na katika muktadha unamaanisha matawi ya mitende.
- source_word: עֵץ עָבֹת
  choice: miti mingine yenye majani mengi
  rationale: עָבֹת huonyesha unene au wingi wa majani; ‘mingine’ huifanya orodha isomeke kwa kawaida kama kundi la ziada baada ya miti iliyotajwa.
- source_word: לַעֲשׂוֹת סֻכּוֹת
  choice: ili kujenga vibanda
  rationale: ‘Vibanda’ huonyesha makao ya muda ya sikukuu, na ‘kujenga’ ni kitenzi cha kawaida kwa kutumia matawi hayo.
