  text: וַ/יֹּ֣אמֶר לָ/הֶ֡ם לְכוּ֩ אִכְל֨וּ מַשְׁמַנִּ֜ים וּ/שְׁת֣וּ מַֽמְתַקִּ֗ים וְ/שִׁלְח֤וּ מָנוֹת֙ לְ/אֵ֣ין נָכ֣וֹן ל֔/וֹ כִּֽי קָד֥וֹשׁ הַ/יּ֖וֹם לַ/אֲדֹנֵ֑י/נוּ וְ/אַל תֵּ֣עָצֵ֔בוּ כִּֽי חֶדְוַ֥ת יְהוָ֖ה הִ֥יא מָֽעֻזְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: sw
  text: Kisha akawaambia, “Nendeni, mle vyakula vinono na kunyweni vinywaji vitamu, na pelekeni sehemu za chakula kwa wale ambao hawana chochote kilichoandaliwa, kwa maana siku hii ni takatifu kwa Bwana wetu. Wala msihuzunike, kwa maana furaha ya Yahweh[a] ndiyo ngome yenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “furaha katika Yahweh.” Kiebrania kina “furaha ya Yahweh,” ambako uhusiano huo unaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: vyakula vinono
  rationale: Neno hilo linamaanisha kihalisi vitu vyenye mafuta au vinono, na katika muktadha wa sherehe humaanisha vyakula bora na vya kushibisha; “vyakula vinono” huhifadhi picha hiyo kwa Kiswahili cha kawaida.
- source_word: מַמְתַקִּים
  choice: vinywaji vitamu
  rationale: Kwa kuwa neno hili linafuata kitenzi “kunywa,” linarejelea vitu vitamu vya kunywa bila kulibana kuwa divai pekee.
- source_word: מָנוֹת
  choice: sehemu za chakula
  rationale: Katika muktadha wa karamu, neno hili linamaanisha mafungu ya chakula yanayotumwa kwa wengine; ufafanuzi “za chakula” huifanya maana iwe wazi kwa msomaji wa kawaida.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: wale ambao hawakuandaliwa chochote
  rationale: נָכוֹן hapa ni kilichoandaliwa au kuwekwa tayari. Wingi wa kimuktadha “wale” ni wa asili katika Kiswahili na unahifadhi maana ya mtu yeyote asiye na maandalizi ya karamu.
- source_word: קָדוֹשׁ
  choice: takatifu
  rationale: “Takatifu” ni tafsiri ya kawaida na yenye uzito unaofaa kwa siku iliyowekwa wakfu kwa Mungu.
- source_word: לַאֲדֹנֵינוּ
  choice: kwa Bwana wetu
  rationale: אדון hapa ni cheo cha heshima kinachomrejelea Mungu; “Bwana wetu” ni tafsiri ya kawaida na ya asili.
- source_word: תֵּעָצֵבוּ
  choice: msihuzunike
  rationale: Kitenzi kinaeleza kuwa na huzuni au kuumia moyoni; “msihuzunike” ni cha asili na huhifadhi nguvu ya agizo.
- source_word: חֶדְוַת יְהוָה
  choice: furaha ya Yahweh
  rationale: Muundo huu wa Kiebrania unaweza kueleweka kwa njia zaidi ya moja. “Furaha ya Yahweh” huhifadhi uhusiano wa asili bila kuamua kimya kimya ikiwa ni furaha inayotoka kwake, furaha yake mwenyewe, au furaha ndani yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetolewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: מָעֻזְּכֶם
  choice: ngome yenu
  rationale: Neno hilo linaweza kumaanisha mahali au chanzo cha nguvu, hasa ngome. “Ngome yenu” huhifadhi sitiari halisi kuliko “nguvu yenu.”
theological_decisions:
- issue: Maana ya חֶדְוַת יְהוָה
  choice: furaha ya Yahweh
  alternative: furaha katika Yahweh; furaha ya Yahweh mwenyewe
  rationale: Tafsiri kuu huhifadhi mvutano na utata wa muundo wa Kiebrania badala ya kuchagua kwa lazima maana ya kiima au ya yambwa.
- issue: Utoaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: “Yahweh” huhifadhi jina binafsi lililo katika maandishi ya Kiebrania, huku “Bwana” katika sehemu ya awali ikitafsiri אֲדֹנֵינוּ, ambalo ni cheo tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi sauti ya sherehe na sitiari ya ngome bila kuwa ya kale kupita kiasi.
