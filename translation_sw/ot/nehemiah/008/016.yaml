base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: sw
  text: Basi watu wakatoka, wakaleta, wakajitengenezea vibanda[a], kila mmoja juu ya paa lake na katika nyua zao, na katika nyua za nyumba ya Mungu, na katika uwanja[b] wa Lango la Maji, na katika uwanja wa Lango la Efraimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makao ya muda.” Neno la Kiebrania סֻכּוֹת linamaanisha vibanda au makao ya muda yaliyotumiwa katika Sikukuu ya Vibanda.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania רְחוֹב linamaanisha eneo wazi la umma karibu na lango; kwa desturi pia limetafsiriwa “mahali pana.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: watu wakaenda
  rationale: Kitenzi יצא kinaeleza kutoka au kwenda nje ili kukusanya vifaa; “wakaenda” ni cha kawaida na kinafuata mtiririko wa simulizi bila kuongeza mahali walipotoka.
- source_word: וַיָּבִיאוּ
  choice: wakaleta
  rationale: Hiphili ya בוא humaanisha “kuleta.” Kiebrania hakitaji yambwa hapa; vitu vilivyoletwa vinaeleweka kutokana na matawi na majani yaliyotajwa katika mstari uliotangulia, kwa hiyo yambwa limeachwa wazi pia katika Kiswahili.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: wakajitengenezea vibanda
  rationale: “Kujitengenezea” huonyesha לָהֶם, yaani walivitengeneza kwa ajili yao wenyewe. “Vibanda” huhifadhi uhusiano wa neno סֻכּוֹת na Sikukuu ya Vibanda.
- source_word: אִישׁ עַל גַּגּוֹ
  choice: kila mmoja juu ya paa lake
  rationale: אִישׁ limetumiwa kwa maana ya mgawanyo, “kila mmoja,” na kiambishi cha umilikaji cha umoja katika גַּגּוֹ kinaakisiwa na “paa lake.”
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: na katika nyua zao
  rationale: חָצֵר ni ua uliozungushiwa au eneo la ndani la makazi; “nyua” ni neno la kawaida na sahihi katika Kiswahili cha kisasa.
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: na katika nyua za nyumba ya Mungu
  rationale: Tafsiri hii inaakisi muundo wa Kiebrania na kurejelea maeneo ya ua ya hekalu bila kubadili “nyumba ya Mungu” kuwa istilahi ya kifafanuzi zaidi.
- source_word: וּבִרְחוֹב
  choice: na katika uwanja
  rationale: רְחוֹב humaanisha eneo la wazi la umma, mara nyingi karibu na lango; “uwanja” ni tafsiri ya asili na inayoeleweka katika Kiswahili.
- source_word: שַׁעַר הַמַּיִם
  choice: Lango la Maji
  rationale: Ni jina la mahali; herufi kubwa zinaonyesha kuwa ni lango maalumu la mji.
- source_word: שַׁעַר אֶפְרָיִם
  choice: Lango la Efraimu
  rationale: Tafsiri hii huhifadhi muundo wa umilikaji wa Kiebrania na kulitambulisha kama jina la lango maalumu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya malango yameandikwa kwa herufi kubwa kama majina maalumu; “nyumba ya Mungu” imehifadhiwa badala ya kufafanuliwa moja kwa moja kuwa hekalu.
