translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yameandikwa kwa maumbo yanayotamkika kwa kawaida katika Kiswahili. Mgawanyo wa waliokuwa kulia na kushoto umehifadhiwa wazi.
