base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: sw
  text: Ezra mwandishi alisimama juu ya jukwaa la mbao[a] walilokuwa wametengeneza kwa kusudi hilo. Pembeni yake walisimama Matithia, Shema, Anaya, Uria, Hilkia na Maaseya upande wake wa kulia; na Pedaya, Mishaeli, Malkiya, Hashumu, Hashbadana, Zekaria na Meshulamu upande wake wa kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mnara wa mbao”; yaani, jengo au mahali pa kusimamia palipoinuliwa na kutengenezwa kwa mbao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: jukwaa la mbao
  rationale: Ingawa maana ya moja kwa moja ni ‘mnara wa mbao,’ muktadha wa usomaji wa hadhara unaonyesha jengo lililoinuliwa ambalo Ezra alisimama juu yake. ‘Jukwaa la mbao’ ni Kiswahili cha kawaida kinachoeleza kazi yake bila kupotosha kuwa mnara.
- source_word: לַדָּבָר
  choice: kwa kusudi hilo
  rationale: דָּבָר hapa inaweza kumaanisha jambo, shughuli au kusudi. ‘Kwa kusudi hilo’ ni ya asili na inadumisha rejeo la jumla bila kulifafanua kupita kiasi.
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: סֹפֵר humtaja mwandishi mwenye ustadi katika maandiko au sheria. ‘Mwandishi’ ni neno la kawaida na lenye heshima katika Kiswahili cha Biblia.
- source_word: אֶצְלוֹ
  choice: pembeni yake
  rationale: Kirai hiki kinaonyesha ukaribu wa mahali; ‘pembeni yake’ kinafaa kwa watu waliopangwa pande mbili za Ezra.
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: upande wake wa kulia / upande wake wa kushoto
  rationale: Hii inawasilisha wazi mielekeo miwili na kudumisha ulinganifu wa sentensi kwa Kiswahili cha kawaida.
- source_word: וַיַּעֲמֹד
  choice: alisimama / walisimama
  rationale: Kitenzi עמד kinaripoti hali au tendo la kusimama. Umoja umetumika kwa Ezra na wingi kwa orodha ya watu waliokuwa pembeni yake.
