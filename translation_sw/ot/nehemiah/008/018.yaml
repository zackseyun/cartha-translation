base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: sw
  text: Naye akasoma kutoka katika kitabu cha Sheria ya Mungu[a] siku baada ya siku, tangu siku ya kwanza mpaka siku ya mwisho. Wakaadhimisha sikukuu hiyo kwa siku saba[b], na siku ya nane kukawa na kusanyiko la kufunga sikukuu[c], kwa mujibu wa agizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hati-kunjo ya Sheria ya Mungu.” Neno la Kiebrania linaweza kumaanisha hati iliyoandikwa, kutia ndani hati-kunjo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wakaifanya sikukuu kwa siku saba”; maana yake ni kwamba waliiadhimisha kwa siku saba.
    reason: idiom_clarification
  - marker: c
    text: Au, “kusanyiko maalumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akasoma
  rationale: Kitenzi קרא pamoja na rejeo la maandishi hapa kinamaanisha kusoma, yaelekea kwa sauti. Umbo la nafsi ya tatu umoja limehifadhiwa bila kumtaja Ezra moja kwa moja.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: katika Kitabu cha Sheria ya Mungu
  rationale: Neno סֵפֶר linaweza kumaanisha kitabu au hati-kunjo. 'Kitabu' ni neno la kawaida na linaendeleza mnyororo wa maneno wa Kiebrania bila kubainisha umbo la hati.
- source_word: יוֹם בְּיוֹם
  choice: siku baada ya siku
  rationale: Nahau hii inaonyesha tendo lililorudiwa kila siku na inahifadhi msisitizo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: tangu siku ya kwanza mpaka siku ya mwisho
  rationale: Hii inaonyesha wazi muda wote kuanzia siku ya kwanza hadi ya mwisho.
- source_word: וַיַּעֲשׂוּ חָג
  choice: wakaadhimisha sikukuu hiyo
  rationale: Muungano wa עשה na חג hapa humaanisha kuiadhimisha au kuishika sikukuu. 'Sikukuu hiyo' ni rejeo la kawaida la Kiswahili kwa sikukuu inayozungumziwa katika muktadha.
- source_word: עֲצֶרֶת
  choice: kusanyiko maalumu
  rationale: Neno hili linataja mkusanyiko maalumu uliowekwa mwishoni mwa sikukuu. Tafsiri hii huhifadhi uzito wa tukio bila kuongeza maelezo ya kidhehebu.
- source_word: כַּמִּשְׁפָּט
  choice: kwa mujibu wa agizo
  rationale: מִשְׁפָּט hapa ni sharti au utaratibu ulioamriwa, si desturi ya hiari.
theological_decisions:
- issue: Mtendaji mmoja anayesoma dhidi ya jumuiya inayoadhimisha
  choice: Kuhifadhi umoja katika 'akasoma' na wingi katika 'wakaadhimisha'
  alternative: Kutumia wingi 'wakasoma' ili kuifanya sentensi iwe laini zaidi
  rationale: Maumbo ya Kiebrania yanatofautisha msomaji mmoja na jumuiya nzima; tofauti hiyo ni sehemu ya simulizi na haipaswi kusawazishwa.
- issue: Maana ya neno la ibada עֲצֶרֶת
  choice: kusanyiko maalumu
  alternative: kusanyiko takatifu; kusanyiko la kufunga sikukuu
  rationale: Neno linaashiria mkusanyiko uliowekwa kwa siku ya mwisho ya sikukuu. 'Maalumu' ni wazi na ya kawaida, huku tanbihi ikihifadhi uwezekano wa kusisitiza kwamba ulikuwa mkusanyiko wa kuhitimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi wenye viambishi vya mfululizo umehifadhiwa kwa 'akasoma' na 'wakaadhimisha'; maneno ya kale yasiyoeleweka kwa urahisi kama 'mkutano wa makini' yameepukwa.
