  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: sw
  text: Akaisoma mbele ya uwanja uliokuwa mbele ya Lango la Maji, tangu mapambazuko[a] mpaka adhuhuri, mbele ya wanaume, wanawake, na wale walioweza kuelewa[b]. Watu wote walikuwa wakisikiliza kwa makini Kitabu cha Sheria[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “tangu mwanga”; yaani, tangu alfajiri.
    reason: lexical_alternative
  - marker: b
    text: Au “wenye ufahamu”; huenda ni wote waliokuwa na umri wa kutosha kufahamu usomaji.
    reason: lexical_alternative
  - marker: c
    text: “Kitabu” pia kinaweza kutafsiriwa “gombo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: Akaisoma
  rationale: Katika muktadha wa maandishi yaliyokuwa yakisomwa hadharani, קרא pamoja na בּוֹ humaanisha kusoma yaliyomo ndani yake. Kiswahili ‘akaisoma’ ni cha kawaida na hudokeza kitu kilichotajwa hapo awali.
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: mbele ya uwanja uliokuwa mbele ya Lango la Maji
  rationale: רְחוֹב ni eneo wazi la umma au uwanja. Muundo wa Kiebrania una ‘mbele ya’ mara mbili; umetunzwa kwa sababu ya mahali aliposimama msomaji kuhusiana na uwanja na mahali uwanja ulipokuwa kuhusiana na lango.
- source_word: מִן הָאוֹר
  choice: tangu mapambazuko
  rationale: Kihalisi ni ‘tangu mwanga,’ lakini hapa ni usemi wa wakati unaomaanisha mwanzo wa mwanga wa siku.
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: mpaka adhuhuri
  rationale: Usemi huu unamaanisha katikati ya siku; ‘adhuhuri’ ni Kiswahili cha kawaida na sahihi.
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: mbele ya wanaume, wanawake, na wale walioweza kuelewa
  rationale: נֶגֶד hapa huonyesha hadhira iliyokuwapo mbele yake. Makundi yaliyotajwa wazi—wanaume, wanawake, na wenye uwezo wa kuelewa—yamehifadhiwa.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: Masikio ya watu wote yalielekezwa kwenye
  rationale: Tafsiri inadumisha taswira halisi ya Kiebrania ya masikio kuelekea maandishi, huku ikitumia muundo unaoeleweka kwa Kiswahili.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Kitabu cha Sheria
  rationale: סֵפֶר inaweza kuwa kitabu, hati, au gombo; ‘Kitabu’ ni neno linaloeleweka kwa upana. תּוֹרָה hapa ni maandishi yenye mamlaka ya agano yanayosomwa hadharani, hivyo ‘Sheria’ inafaa katika muktadha huu.
theological_decisions:
- issue: Maana ya תּוֹרָה katika usomaji wa hadhara wa agano
  choice: Sheria
  alternative: mafundisho; Torati
  rationale: Ingawa תּוֹרָה inaweza kumaanisha mafundisho, hapa inarejelea maandishi rasmi yenye mamlaka ya agano. ‘Sheria’ huwasilisha muktadha huo bila kuzuia maana pana ya mafundisho ya Mungu.
- issue: Utambulisho wa וְהַמְּבִינִים
  choice: wale walioweza kuelewa
  alternative: wenye ufahamu
  rationale: Kirai kinaweza kueleza wote waliokuwa na uwezo wa kufahamu, huenda pamoja na watoto waliokuwa wakubwa vya kutosha. Tafsiri haibainishi umri wala kundi zaidi ya inavyosema Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ‘masikio’ imehifadhiwa kwa uaminifu kwa chanzo; majina ‘Lango la Maji’ na ‘Kitabu cha Sheria’ yameandikwa kwa herufi kubwa kama majina maalumu ya kimuktadha.
