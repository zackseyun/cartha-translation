- from: Akaisoma mbele ya uwanja uliokuwa mbele ya Lango la Maji, tangu mapambazuko[a] mpaka adhuhuri, mbele ya wanaume, wanawake, na wale walioweza kuelewa[b]. Masikio ya watu wote yalielekezwa kwenye Kitabu cha Sheria[c].
  to: Akaisoma mbele ya uwanja uliokuwa mbele ya Lango la Maji, tangu mapambazuko[a] mpaka adhuhuri, mbele ya wanaume, wanawake, na wale walioweza kuelewa[b]. Watu wote walikuwa wakisikiliza kwa makini Kitabu cha Sheria[c].
  rationale: The revision replaces the overly literal final idiom with natural Swahili, “walikuwa wakisikiliza kwa makini,” which faithfully communicates that all the people’s attention was directed to the Book of the Law. All other wording and all footnote anchors are retained because they accurately represent the Hebrew and are natural in the target variant.
