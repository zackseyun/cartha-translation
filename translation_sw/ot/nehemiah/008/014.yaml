  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: sw
  text: Nao wakakuta imeandikwa katika Sheria kwamba Yahwe alikuwa ameamuru kupitia Musa kwamba wana wa Israeli[a] wakae katika vibanda wakati wa sikukuu, katika mwezi wa saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli” au “watoto wa Israeli”; Kiebrania ni “wana wa Israeli.”
    reason: Njia mbadala za kutafsiri usemi wa kijumuiya בְנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: wakakuta imeandikwa
  rationale: Muundo huu unahifadhi mfuatano wa kisimulizi na kishiriki cha hali ya kutendwa cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: בַּתּוֹרָה
  choice: katika Sheria
  rationale: Katika muktadha huu neno hilo linarejelea mkusanyo wa maagizo ya Musa; “Sheria” ni wazi na limezoeleka katika Kiswahili cha Biblia.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Nahau ya Kiebrania, kihalisi “kwa mkono wa Musa,” inaonyesha Musa kuwa mpatanishi wa agizo; “kupitia Musa” ni ya asili katika Kiswahili.
- source_word: יֵשְׁבוּ
  choice: wakae
  rationale: Katika muktadha wa sikukuu, kitenzi kinamaanisha kukaa kwa muda katika makao yaliyotajwa, wala si kuketi tu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inahifadhi kwa karibu usemi halisi wa Kiebrania na maana yake ya kijumuiya; njia mbadala za asili zaidi zimeonyeshwa katika tanbihi.
- source_word: בַּסֻּכּוֹת
  choice: katika vibanda
  rationale: Neno hilo linamaanisha makao madogo ya muda yaliyotumiwa wakati wa sikukuu; “vibanda” ni neno halisi, wazi na lisilo la kizamani.
- source_word: בֶּחָג
  choice: wakati wa sikukuu
  rationale: Kifungu hiki kinaonyesha muda wa kukaa katika vibanda na kinarejelea sikukuu inayojulikana katika muktadha.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: katika mwezi wa saba
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha wakati.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano YHWH moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umefuata Kiebrania kwa kiasi kinachofaa bila kuwa mgumu; “vibanda” limechaguliwa badala ya istilahi ya kizamani au yenye maana pana zaidi.
