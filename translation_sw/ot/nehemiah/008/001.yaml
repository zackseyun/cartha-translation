  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: sw
  text: Watu wote wakakusanyika kama mtu mmoja[a] katika uwanja uliokuwa mbele ya Lango la Maji. Wakamwambia Ezra mwandishi alete Kitabu cha Torati ya Musa—Torati ambayo Yahwe alikuwa amewaamuru Waisraeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kama mtu mmoja,” nahau yenye maana ya “kwa umoja” au “kwa nia moja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Nifali ya אסף inaeleza watu kuja pamoja; “wakakusanyika” ni Kiswahili cha kawaida na huhifadhi tendo la pamoja.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Huwakilisha jamii yote iliyokusanyika kwa njia ya kawaida katika Kiswahili.
- source_word: כְּאִישׁ אֶחָד
  choice: kama mtu mmoja
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania huku tanbihi ikifafanua maana yake ya kutenda kwa umoja.
- source_word: הָרְחוֹב
  choice: uwanja
  rationale: Neno hili hapa linamaanisha eneo la wazi la umma mjini, si barabara kwa maana ya sasa.
- source_word: לִפְנֵי שַׁעַר הַמָּיִם
  choice: mbele ya Lango la Maji
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya mahali palipotajwa.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא
  choice: wakamwambia Ezra
  rationale: Kitenzi ni “wakasema kwa,” lakini pamoja na agizo linalofuata, “wakamwambia” ni cha kawaida bila kuongeza wazo la kuomba.
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: Ni cheo cha kawaida cha mtu aliyekuwa mnakili na mtaalamu wa maandiko; “mwandishi” huhifadhi cheo bila kuongeza maelezo yasiyotajwa.
- source_word: לְהָבִיא
  choice: alete
  rationale: Hifili ya בוא humaanisha kusababisha kitu kije, yaani kukileta.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: Kitabu cha Torati ya Musa
  rationale: סֵפֶר yaweza kuwa kitabu au hati-kunjo; “Kitabu” ni wazi na cha kawaida, na “Torati ya Musa” huhifadhi muundo wa Kiebrania.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  choice: ambayo Yahwe alikuwa amewaamuru Israeli
  rationale: Huhifadhi Israeli kama waliopokea amri na uhusiano wa kishazi na Torati bila kuongeza kitendo kama “waifuate,” ambacho hakijaandikwa wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu linalowakilishwa na tetragramatoni badala ya kulibadili kuwa cheo.
theological_decisions:
- issue: Nahau כְּאִישׁ אֶחָד
  choice: kama mtu mmoja
  alternative: kwa umoja / kwa nia moja
  rationale: Tafsiri kuu huhifadhi taswira ya Kiebrania na mvutano wake wa kisarufi; tanbihi hutoa maana ya kinahau bila kuibadilisha kimya kimya.
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; “Yahwe” hulitafsiri kwa uhawilishaji wa sauti badala ya kulibadilisha kuwa cheo.
- issue: Kile ambacho Yahwe aliwaamuru Israeli
  choice: Torati ndiyo inayorejelewa na kishazi “ambayo Yahwe alikuwa amewaamuru Israeli”
  alternative: ambayo Yahwe alikuwa amewaamuru Israeli waifuate
  rationale: Nyongeza “waifuate” ingefafanua maana vizuri lakini ingeweka wazi jambo ambalo muundo mfupi wa Kiebrania huliacha bila kitenzi cha ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Uwanja” limetumiwa kwa eneo la wazi la umma, na “Torati” kuhifadhi istilahi ya kibiblia inayojulikana.
