  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: sw
  text: Wakasoma katika kitabu, katika Torati ya Mungu, kwa uwazi[a]; wakatoa maelezo ili watu waelewe usomaji huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa dhahiri” au “kwa namna iliyo wazi.” Neno la Kiebrania linaweza kumaanisha kusoma kwa uwazi, kufanya maandishi yaeleweke kwa kuyafafanua, au labda kuyatafsiri kwa ajili ya wasikilizaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Wakasoma
  rationale: Kitenzi קרא pamoja na kitabu kama yambwa humaanisha kusoma; muktadha ni usomaji wa hadharani.
- source_word: בַסֵּפֶר בְּתוֹרַת הָאֱלֹהִים
  choice: katika kitabu, yaani, katika Torati ya Mungu
  rationale: Viambishi ב vimehifadhiwa kwa ‘katika’; kirai cha pili kinafafanua kitabu kinachotajwa. ‘Torati’ huonyesha maandiko maalumu ya agano katika muktadha huu.
- source_word: מְפֹרָשׁ
  choice: kwa uwazi
  rationale: Neno linaweza kuashiria kusoma kwa namna iliyo wazi au kufanya yaliyoandikwa yawe wazi; tafsiri hii hailazimishi wazo mahususi la kutafsiri lugha au kufafanua.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: wakaeleza maana
  rationale: Nahau ya Kiebrania, kihalisi ‘kuweka ufahamu,’ inaeleza kuwasaidia wasikilizaji kupata maana ya maandishi.
- source_word: וַיָּבִינוּ
  choice: ili watu waelewe
  rationale: Muktadha unaonyesha matokeo au kusudi la kusoma na kueleza; ‘watu’ huwekwa wazi kwa Kiswahili kutokana na mkutano unaotajwa katika muktadha.
- source_word: בַמִּקְרָא
  choice: yaliyosomwa
  rationale: מִקְרָא inaweza kumaanisha tendo au yaliyomo katika usomaji wa sauti; ‘yaliyosomwa’ ni Kiswahili cha kawaida na wazi katika sentensi hii.
