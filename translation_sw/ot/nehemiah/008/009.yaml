base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: sw
  text: Ndipo Nehemia, mtawala[a], Ezra kuhani na mwandishi, pamoja na Walawi waliokuwa wakiwafundisha watu, wakawaambia watu wote, “Siku hii ni takatifu kwa Yahwe, Mungu wenu. Msiomboleze wala msilie.” Kwa maana watu wote walikuwa wakilia waliposikia maneno ya Sheria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tirshatha,” cheo cha utawala cha Kiajemi.
    reason: lexical_alternative
  - marker: b
    text: Au “maneno ya Torati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: mtawala
  rationale: Hiki ni cheo rasmi cha kipindi cha utawala wa Kiajemi. “Mtawala” kinaeleza kazi yake kwa Kiswahili kinachoeleweka, huku umbo la cheo lenyewe likihifadhiwa katika tanbihi.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: kuhani na mwandishi
  rationale: Majina yote mawili ni vyeo vya Ezra; tafsiri hii inahifadhi majukumu yote bila kuyafanya kuwa cheo kimoja.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: Walawi waliokuwa wakiwaelimisha watu
  rationale: Kauli ya kisababishi ya kitenzi בין hapa inaonyesha kuwasaidia watu kuelewa au kuwapa mafundisho. “Wakiwaelimisha” ni ya kawaida na inafaa kwa kazi yao katika usomaji huu.
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: Siku hii ni takatifu
  rationale: Inahifadhi tamko la moja kwa moja kwamba siku hiyo imetengwa kwa kusudi la kidini.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha kwamba siku hiyo imetengwa kwa Yahwe; “kwa” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: תִּתְאַבְּלוּ
  choice: msihuzunike
  rationale: Kitenzi kinaashiria kuomboleza au kuwa katika huzuni. “Msihuzunike” ni cha asili kwa Kiswahili na kinatofautishwa na amri inayofuata ya kutolia.
- source_word: תִּבְכּוּ / בוֹכִים
  choice: msilie / walikuwa wakilia
  rationale: Maneno haya yanahifadhi tendo halisi la kutoa machozi na hali yake iliyoendelea.
- source_word: כְּשָׁמְעָם
  choice: waliposikia
  rationale: Hueleza mwitikio uliotokea wakati wa kusikia maneno yaliyosomwa; “waliposikia” ni ya kawaida bila kubadili uhusiano huo wa wakati.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: maneno ya Sheria
  rationale: Katika muktadha wa kusoma agano hadharani, “Sheria” ni tafsiri iliyo wazi kwa wasomaji wengi. “Torati” imewekwa kama mbadala katika tanbihi ili kuhifadhi maana ya istilahi ya Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo kama “Bwana.”
- issue: Maana ya תּוֹרָה katika mazingira ya usomaji wa agano
  choice: Sheria
  alternative: Torati
  rationale: “Sheria” inaeleweka kwa urahisi na inafaa katika muktadha huu, huku “Torati” ikiwa mbadala halali unaohifadhi istilahi ya Kiebrania bila kuamua kwa lazima upeo wake kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa wingi “wakawaambia” umetumiwa kwa kawaida ya Kiswahili kwa sababu Nehemia, Ezra na Walawi wote ndio wanaosema, ingawa kitenzi cha Kiebrania kina umbo la umoja.
