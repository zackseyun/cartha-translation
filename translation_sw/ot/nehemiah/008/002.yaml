base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: sw
  text: Ndipo Ezra, kuhani, akaileta Sheria mbele ya kusanyiko, wanaume na wanawake[a], na wote walioweza kuelewa walichosikia[b], siku ya kwanza ya mwezi wa saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “kutoka mwanamume mpaka mwanamke,” msemo unaoonyesha wigo mzima wa kusanyiko.
    reason: lexical_alternative
  - marker: b
    text: Au, “wote walioweza kuelewa kwa kusikia,” yaani, wote walioweza kufahamu yale yaliyosomwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: Ndipo ... akaileta
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na kuhifadhi wazo la hatua iliyofuata.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni cheo cha Ezra kilichotajwa wazi katika Kiebrania; kimehifadhiwa bila nyongeza.
- source_word: הַתּוֹרָה
  choice: Sheria
  rationale: Katika muktadha huu neno linarejelea Torati ya Musa iliyosomwa hadharani. “Sheria” ni neno wazi na lililozoeleka kwa wasomaji wa Kiswahili, huku herufi kubwa ikionyesha maandiko hayo mahususi.
- source_word: לִפְנֵי הַקָּהָל
  choice: mbele ya kusanyiko
  rationale: Huhifadhi mazingira ya hadhara na rasmi bila kulifanya kusanyiko hilo lionekane lazima kuwa taasisi ya kidini ya baadaye.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: wanaume na wanawake
  rationale: Huwasilisha kwa Kiswahili cha asili wigo kamili unaoonyeshwa na msemo halisi wa Kiebrania, “kutoka mwanamume mpaka mwanamke.”
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: pamoja na wote walioweza kuelewa walichosikia
  rationale: Msemo unahusu uwezo wa kufahamu usomaji, si kusikia sauti tu. Kauli hii ni ya kawaida katika Kiswahili na inadumisha uhusiano kati ya kusikia na kuelewa.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: siku ya kwanza ya mwezi wa saba
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kutaja tarehe hiyo ya Kiebrania.
theological_decisions:
- issue: Maelezo ya kijinsia kuhusu waliohudhuria
  choice: wanaume na wanawake
  alternative: kutoka mwanamume mpaka mwanamke
  rationale: Kiebrania kinataja jinsia zote mbili ili kuonyesha upana wa kusanyiko. Tafsiri kuu inatoa maana hiyo kwa Kiswahili cha asili, na tanbihi inahifadhi muundo halisi.
- issue: Tafsiri ya תּוֹרָה
  choice: Sheria
  alternative: Torati; Mafundisho
  rationale: Katika muktadha wa usomaji wa hadhara, neno linaelekea kwenye maandiko ya Musa. “Sheria” huhifadhi uzito wake wa agano na kueleweka kwa urahisi bila kulazimisha ufafanuzi mpana au mwembamba kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa kwa usomaji wa Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari mirefu imetenganishwa kwa vistari ili kuweka wazi ni nani waliounda kusanyiko bila kuongeza maelezo yasiyomo katika chanzo.
