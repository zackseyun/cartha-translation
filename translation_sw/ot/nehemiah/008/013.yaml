base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: sw
  text: Na siku ya pili, viongozi wa koo za watu wote[a], makuhani na Walawi walikusanyika kwa Ezra, mwandishi, ili kupata ufahamu wa maneno ya Sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, Kiebrania husema, “wakuu wa nyumba za baba,” yaani viongozi wa koo au familia pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: Siku ya pili
  rationale: Hutoa maana ya moja kwa moja ya wakati; kiunganishi waw hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili kwa kuwa mwendelezo wa simulizi unaeleweka kiasili.
- source_word: נֶאֶסְפוּ
  choice: walikusanyika
  rationale: Niphal ya wingi imetumiwa kwa maana isiyo ya kutendwa hapa; ‘walikusanyika’ ni Kiswahili cha kawaida kinachoonyesha tendo la pamoja.
- source_word: רָאשֵׁי הָאָבוֹת לְכָל הָעָם
  choice: viongozi wa koo za watu wote
  rationale: Kirai hiki kinawataja viongozi wa koo au familia pana kutoka kwa watu wote. Tafsiri hii ni ya asili kwa Kiswahili huku maelezo halisi zaidi yakihifadhiwa katika tanbihi.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: makuhani na Walawi
  rationale: Huyahifadhi makundi hayo mawili tofauti katika orodha ya waliokusanyika.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: kwa Ezra, mwandishi
  rationale: אֶל inaonyesha kuelekea kwa Ezra, na ‘mwandishi’ huhifadhi cheo cha סֹפֵר bila kuingiza ufafanuzi wa kimadhehebu.
- source_word: וּלְהַשְׂכִּיל
  choice: ili kupata ufahamu
  rationale: Hiphil infinitive inaonyesha kusudi la kupata utambuzi au ufahamu, si kujua habari kwa juu juu tu.
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: wa maneno ya Sheria
  rationale: Huhifadhi mkazo wa maandishi katika ‘maneno’ ya Torati na mwelekeo wa jitihada zao za kuelewa.
