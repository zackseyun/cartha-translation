  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: sw
  text: Ezra akamhimidi Yahwe, Mungu mkuu, nao watu wote wakajibu, “Amina! Amina!”[a] huku wakiinua mikono yao. Kisha wakainama na kumwabudu Yahwe, nyuso zao zikielekea ardhini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarudia, “Amina, Amina,” kama jibu la pamoja la kukubali na kuthibitisha.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: akamhimidi
  rationale: Kitenzi ברך katika piel, Mungu akiwa ndiye anayelengwa, humaanisha kumbariki kwa kutamka sifa. ‘Akamhimidi’ ni Kiswahili cha kawaida na chenye heshima kinachoonyesha sifa hiyo bila kudokeza kwamba Ezra alimpa Mungu baraka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: Mungu mkuu
  rationale: Muundo huu unamtambulisha Yahwe kwa maelezo ya ziada kuwa Mungu mkuu; tafsiri hii ni ya asili katika Kiswahili na inadumisha msisitizo wa גָּדוֹל.
- source_word: וַיַּעֲנוּ
  choice: wakajibu
  rationale: ענה hapa inaanzisha jibu la watu lililotamkwa kwa sauti.
- source_word: אָמֵן אָמֵן
  choice: Amina! Amina!
  rationale: Neno la kiliturujia limetoholewa kwa namna iliyozoeleka katika Kiswahili, na kurudiwa kwake kumehifadhiwa ili kuonyesha ukubali wenye msisitizo.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: huku wakiinua mikono yao
  rationale: Kirai hiki kinaonyesha tendo lililoambatana na jibu lao; muundo huu ni wa kawaida na unaweka wazi ishara ya mikono.
- source_word: וַיִּקְּדוּ
  choice: wakainama
  rationale: קדד huonyesha kuinama chini. Chaguo hili linadumisha tendo hilo bila kulichanganya na tendo linalofuata la kuabudu.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: kumwabudu
  rationale: Kitenzi hiki huonyesha kusujudu kama tendo la ibada. ‘Kumwabudu’ kinadumisha maana ya ibada, huku mkao wa mwili ukifafanuliwa na vishazi vinavyozunguka.
- source_word: אַפַּיִם אָרְצָה
  choice: nyuso zao zikielekea ardhini
  rationale: Nahau hii, kihalisi ‘nyuso kuelekea ardhini,’ inaonyesha kusujudu kabisa; tafsiri hii inawasilisha mkao huo wazi bila kuongeza kwamba nyuso ziligusa ardhi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la pekee יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kidhehebu.
- issue: Maana ya kumbariki Mungu katika וַיְבָרֶךְ
  choice: akamhimidi
  alternative: akambariki
  rationale: Mungu akiwa ndiye anayelengwa na ברך, maana ni kutamka sifa au baraka kumhusu. ‘Akamhimidi’ huwasilisha maana hiyo kwa Kiswahili cha sasa na huepuka dhana isiyokusudiwa kwamba mwanadamu anamjalia Mungu baraka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mfuatano wa matendo katika Kiebrania, huku ikitumia miundo ya kawaida ya Kiswahili. Alama ya tanbihi imewekwa baada ya maneno ‘Amina! Amina!’ kwa kuwa tanbihi inayafafanua maneno hayo.
