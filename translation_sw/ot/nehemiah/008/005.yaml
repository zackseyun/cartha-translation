base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: sw
  text: Ezra akakifungua kitabu machoni pa watu wote[a], kwa maana alikuwa juu ya watu wote; naye alipokifungua, watu wote wakasimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “gombo.” Neno la Kiebrania סֵפֶר linaweza kumaanisha hati iliyoandikwa katika umbo la gombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: akakifungua
  rationale: Kitenzi פתח humaanisha ‘kufungua.’ Tafsiri hii inafuata kitenzi cha kawaida cha Kiebrania bila kuongeza wazo la ‘kukunjua.’
- source_word: הַסֵּפֶר
  choice: kitabu
  rationale: סֵפֶר inaweza kumaanisha kitabu, hati, au gombo lenye maandishi. ‘Kitabu’ ni neno la kawaida na pana katika Kiswahili; umbo la kale linalowezekana limeelezwa katika tanbihi.
- source_word: לְעֵינֵי
  choice: mbele ya macho ya
  rationale: Hii inahifadhi picha halisi ya Kiebrania, ‘machoni pa,’ na kusisitiza kwamba tendo hilo lilionekana waziwazi na watu wote.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: עָם hapa ni umati uliokusanyika. ‘Watu wote’ ni tafsiri ya moja kwa moja na huhifadhi urudiaji wa msisitizo katika aya.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: kwa maana alikuwa amesimama mahali palipoinuka kuliko watu wote
  rationale: מֵעַל hapa inaonyesha mahali pa juu kimwili, si cheo au ubora wa kijamii. Kuongeza ‘amesimama mahali palipoinuka’ kunafanya maana hiyo iwe wazi na ya asili kwa Kiswahili.
- source_word: וּכְפִתְחוֹ
  choice: alipokifungua
  rationale: Kiambishi כְּ kina maana ya wakati, ‘alipo-/wakati.’ Kiambishi ‘-ki-’ kinarejelea kitabu kwa kawaida katika Kiswahili.
- source_word: עָמְדוּ
  choice: wakasimama
  rationale: עמד maana yake ni ‘kusimama.’ Tafsiri hii ni ya moja kwa moja na haiongezi kwa uhakika kwamba hapo kabla walikuwa wameketi.
