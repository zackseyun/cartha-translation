base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: sw
  text: Ndipo watu wote wakaenda zao kula na kunywa, kupeleka mafungu ya chakula[a], na kusherehekea kwa furaha kubwa, kwa sababu walikuwa wameelewa maneno yaliyowekwa wazi kwao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutuma mafungu”; yaani, mafungu ya chakula kwa wengine kama sehemu ya sherehe.
    reason: lexical_alternative
  - marker: b
    text: Au, “mambo waliyofahamishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל־הָעָם
  choice: Ndipo watu wote wakaenda zao
  rationale: Muundo wa masimulizi unaendeleza tukio, huku ‘wakaenda zao’ ukionyesha kwamba watu waliondoka kwenye kusanyiko.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: kula na kunywa
  rationale: Hizi ni ka infinitivi za kusudi, na tafsiri ya moja kwa moja ni ya kawaida na wazi katika Kiswahili.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: kuwapelekea wengine sehemu za chakula
  rationale: מָנוֹת ni sehemu zilizogawiwa, hasa chakula cha sherehe; muktadha wa mstari uliotangulia unaonyesha kuwa zilipelekwa kwa wengine.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: kusherehekea kwa furaha kubwa
  rationale: Hii ni tafsiri ya kiasili ya usemi halisi ‘kufanya furaha kubwa,’ ikihifadhi uzito wa גְדוֹלָה.
- source_word: כִּי הֵבִינוּ
  choice: kwa sababu walikuwa wameelewa
  rationale: כִּי inaonyesha sababu ya furaha yao, na kitenzi timilifu kinaeleza ufahamu uliotangulia matendo hayo.
- source_word: בַּדְּבָרִים
  choice: maneno
  rationale: דְּבָרִים inaweza kumaanisha ‘maneno’ au ‘mambo’; katika muktadha wa kusoma na kufafanua sheria, ‘maneno’ huhifadhi vizuri maudhui ya ujumbe.
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: waliyoelezwa
  rationale: Hifili ya ידע humaanisha kufanya jambo lijulikane; ‘waliyoelezwa’ ni ya asili katika Kiswahili na inafaa muktadha wa kufundishwa bila kutaja kwa lazima namna mahususi ya maelezo.
theological_decisions:
- issue: Msingi wa furaha ya watu baada ya kusikia sheria
  choice: Furaha yao inahusishwa moja kwa moja na kuelewa maneno waliyoelezwa.
  alternative: Kuifafanua furaha hasa kuwa toba iliyogeuka sherehe au kuwa tendo rasmi la kufanya upya agano.
  rationale: Mstari wenyewe unasema walifurahi kwa sababu walielewa; tafsiri haiongezi hitimisho pana la kiteolojia lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakaenda zao’ ni usemi wa kawaida unaoonyesha kuondoka; ‘kuwapelekea wengine sehemu za chakula’ huweka wazi maana inayodokezwa na muktadha bila kupoteza mbadala katika tanbihi.
