id: NEH.8.11
reference: Nehemiah 8:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם מַחְשִׁ֤ים לְ/כָל הָ/עָם֙ לֵ/אמֹ֣ר הַ֔סּוּ כִּ֥י הַ/יּ֖וֹם קָדֹ֑שׁ וְ/אַל תֵּעָצֵֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: sw
  text: Nao Walawi walikuwa wakiwanyamazisha watu wote, wakisema, “Nyamazeni,[a] kwa maana siku hii ni takatifu; wala msihuzunike.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tulieni” au “Kaeni kimya.”
    reason: lexical_alternative
  - marker: b
    text: Au “msiomboleze” au “msiwe na huzuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Nao Walawi
  rationale: “Walawi” ndilo jina la kawaida la Kiswahili kwa kundi hili la huduma ya kidini; “Nao” linaendeleza simulizi kwa kawaida.
- source_word: מַחְשִׁים
  choice: walikuwa wakiwanyamazisha
  rationale: 'Umbo la kushiriki linaonyesha tendo lililokuwa likiendelea: Walawi walikuwa wakijaribu kuwatuliza au kuwafanya watu wakae kimya.'
- source_word: לְכָל הָעָם
  choice: watu wote
  rationale: Hurejelea kusanyiko lote la watu na huhifadhi maana ya כָל kwa Kiswahili cha kawaida.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida wa maneno yaliyonukuliwa na unaunganisha tendo hili na tendo la kuwanyamazisha watu.
- source_word: הַסּוּ
  choice: Nyamazeni
  rationale: Amri hii inawataka watu waache kelele au kilio na wakae kimya; “Nyamazeni” ni wazi, ya moja kwa moja, na inafaa katika mazingira haya.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: kwa maana siku hii ni takatifu
  rationale: כִּי hutoa sababu ya amri, na הַיּוֹם katika muktadha huu hueleweka kwa kawaida kama “siku hii” au “leo.” “Takatifu” huhifadhi uzito wa קָדֹשׁ.
- source_word: וְאַל תֵּעָצֵבוּ
  choice: wala msihuzunike
  rationale: Kitenzi kinaeleza kuwa na huzuni au maumivu moyoni bila kulazimisha maana maalumu ya maombolezo ya kidesturi.
theological_decisions:
- issue: Maana ya קָדֹשׁ kuhusu siku ya kusanyiko
  choice: takatifu
  alternative: iliyowekwa wakfu
  rationale: “Takatifu” huhifadhi moja kwa moja uzito wa kitheolojia wa siku kuwa ya Mungu, bila kuifafanua kupita kiasi.
- issue: Upeo wa תֵּעָצֵבוּ
  choice: msihuzunike
  alternative: msiomboleze
  rationale: Muktadha unahusu watu waliokuwa wakilia, lakini neno lenyewe linaweza kumaanisha kuhuzunika kwa upana; tafsiri haipaswi kulibana kuwa maombolezo rasmi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “walikuwa wakiwanyamazisha” umehifadhi hali endelevu ya tendo, huku usemi wa moja kwa moja ukiwa rahisi kueleweka katika usomaji wa hadhara.
