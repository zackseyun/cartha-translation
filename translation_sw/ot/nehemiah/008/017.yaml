  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: sw
  text: Kusanyiko lote la wale waliorudi kutoka uhamishoni walifanya vibanda, wakaishi katika vibanda hivyo. Kwa kuwa tangu siku za Yeshua mwana wa Nuni[a] mpaka siku hiyo, wana wa Israeli hawakuwa wamefanya hivyo. Kukawa na furaha kubwa sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeshua mwana wa Nuni, yaani, Yoshua mwana wa Nuni.
    reason: Jina la Kiebrania katika mstari huu lina umbo Yeshua, huku mtu huyu akijulikana kwa kawaida kama Yoshua.
lexical_decisions:
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: Neno hili linaonyesha jumuiya iliyokusanyika; “kusanyiko” ni la kawaida na halina maana finyu ya kidini.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: wale waliorudi kutoka uhamishoni
  rationale: Usemi huu unaitambulisha jumuiya iliyorudi baada ya kuhamishwa; “uhamishoni” ni Kiswahili cha kawaida na huwasilisha hali ya kuwa mbali na nchi yao kwa kulazimishwa.
- source_word: סֻכּוֹת
  choice: vibanda
  rationale: Hivi ni vibanda vya muda vilivyotumiwa katika sikukuu; “vibanda” ni wazi na huepuka kuchanganywa na Maskani takatifu.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: na kukaa ndani yake
  rationale: Katika muktadha huu יָשַׁב humaanisha kukaa au kuishi ndani ya vibanda, si kuketi tu.
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: hawakuwa wamefanya hivyo
  rationale: “Hivyo” hurejelea kujenga vibanda na kukaa ndani yake bila kudai kwamba sikukuu hiyo haikuwahi kuadhimishwa kwa namna yoyote.
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: tangu siku za Yeshua mwana wa Nuni
  rationale: “Yeshua” huakisi umbo יֵשׁוּעַ lililo katika mstari huu; jina linalojulikana zaidi, “Yoshua,” linawekwa katika tanbihi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linahifadhi muundo wa kiume wa Kiebrania na jina la kimkataba la jamii bila kuligeuza kuwa usemi mwingine.
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: Kukawa na furaha kubwa sana
  rationale: Tafsiri hii ni ya kawaida, yenye hadhi, na inaakisi nguvu ya גְּדוֹלָה מְאֹד.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Muundo wa asili ni wa kiume na unatumiwa kama jina la kimkataba; “wana wa Israeli” huhifadhi sifa hiyo huku ukieleweka katika Kiswahili cha Biblia.
- issue: Utambulisho wa יֵשׁוּעַ בִּן נוּן
  choice: Yeshua mwana wa Nuni
  alternative: Yoshua mwana wa Nuni
  rationale: Maandishi ya mstari yana umbo יֵשׁוּעַ. Tanbihi inaunganisha umbo hilo na jina “Yoshua” linalotambulika zaidi bila kufuta tofauti ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili, huku urudiaji na uhusiano wa kimantiki wa Kiebrania vikihifadhiwa. “Kusanyiko” na “vibanda” ni maneno yanayoeleweka kwa wasomaji wa kawaida; “wana wa Israeli” huhifadhi usemi wa asili wa kimkataba.
