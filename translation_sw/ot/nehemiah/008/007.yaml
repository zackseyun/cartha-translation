base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: sw
  text: Nao Yeshua, Bani, Sherebia, Yamini, Akubu, Shabethai, Hodia, Maaseya, Kelita, Azaria, Yozabadi, Hanani, Pelaya, pamoja na Walawi, waliwasaidia watu kuielewa Sheria[a], huku watu wakibaki mahali pao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “waliwafafanulia watu Sheria.” Kitenzi cha Kiebrania kina maana ya kisababishi: Walawi waliifanya Sheria ieleweke.'
    reason: lexical_alternative
  - marker: b
    text: Au, “huku watu wakiwa wamesimama mahali pao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁוּעַ ... פְּלָאיָה
  choice: Yeshua, Bani, Sherebia, Yamini, Akubu, Shabethai, Hodia, Maaseya, Kelita, Azaria, Yozabadi, Hanani, Pelaya
  rationale: Majina yametoholewa kwa tahajia inayosomeka kwa Kiswahili huku yakifuata kwa karibu maumbo ya Kiebrania.
- source_word: וְהַלְוִיִּם
  choice: pamoja na Walawi
  rationale: Muundo huu unahifadhi kutajwa kwa Walawi bila kuamua kimya kimya kama majina yaliyotangulia ni kundi lote la Walawi au sehemu yake.
- source_word: מְבִינִים
  choice: waliwasaidia watu kuielewa
  rationale: Hili ni umbo la kisababishi la kitenzi בין, hivyo tafsiri inaonyesha kwamba waliwafanya watu waelewe; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לַתּוֹרָה
  choice: Sheria
  rationale: Katika muktadha wa usomaji wa agano hadharani, neno hili linaelekea kwenye Sheria/Torati; “Sheria” linaeleweka kwa urahisi kwa wasomaji wa kawaida.
- source_word: וְהָעָם עַל עָמְדָם
  choice: huku watu wakibaki mahali pao
  rationale: Hii inawasilisha maana ya watu kuendelea kuwa katika sehemu zao, huku tanbihi ikihifadhi uwezekano wa kutafsiri kwamba walikuwa wamesimama.
