base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: sw
  text: Pia katika siku hizo niliwaona Wayahudi[a] waliooa[b] wanawake wa Ashdodi, wa Amoni, na wa Moabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayudea.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “waliokuwa wamewaweka wanawake wakae”; hapa usemi wa Kiebrania unamaanisha kwamba walikuwa wameoa wanawake hao au wamewachukua kuwa wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Tena
  rationale: Hutoa wazo la nyongeza katika taarifa ya matengenezo ya Nehemia; “Tena” ni ya kawaida na huhifadhi maana ya kuongeza jambo jingine.
- source_word: בַּיָּמִים הָהֵם
  choice: katika siku hizo
  rationale: Ni usemi wa kawaida wa wakati unaorejelea kipindi kinachozungumziwa.
- source_word: רָאִיתִי
  choice: niliwaona
  rationale: Huhifadhi maana ya moja kwa moja ya kuona na sauti ya Nehemia kama shahidi; kiambishi “-wa-” kinarejelea Wayahudi.
- source_word: אֶת הַיְּהוּדִים
  choice: Wayahudi
  rationale: Katika muktadha wa Ezra–Nehemia, neno hili linarejelea jumuiya ya Kiyahudi baada ya uhamisho; “Wayahudi” ndilo neno la kawaida na linaloeleweka zaidi, huku “Wayudea” likibaki uwezekano wa kijiografia.
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: waliokuwa wameoa wanawake
  rationale: Ingawa kitenzi kwa umbo lake kina maana ya kusababisha wakae au kuwaweka, pamoja na “wanawake” hapa ni usemi unaomaanisha kuwachukua kuwa wake; “wameoa wanawake” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: אשדודיות
  choice: wanawake wa Ashdodi
  rationale: Jina hili la nasaba linamaanisha wanawake waliotoka Ashdodi; muundo huu ni wazi na wa kawaida kwa msomaji wa Kiswahili.
- source_word: עמוניות
  choice: Waamoni
  rationale: Huhifadhi jina la watu wa Amoni kwa namna ya kawaida katika Kiswahili, huku neno “wanawake” lililotangulia likitawala orodha nzima.
- source_word: מוֹאֲבִיּוֹת
  choice: Wamoabu
  rationale: Huhifadhi jina la watu wa Moabu kwa namna ya kawaida katika Kiswahili, huku neno “wanawake” lililotangulia likitawala orodha nzima.
theological_decisions:
- issue: Maana ya kikabila au kijiografia ya הַיְּהוּדִים
  choice: Wayahudi
  alternative: Wayudea
  rationale: Muktadha unahusu utambulisho wa jumuiya ya agano baada ya uhamisho, si mahali pa makazi pekee. “Wayahudi” huwasilisha rejeleo hilo vizuri, na tanbihi huhifadhi uwezekano wa “Wayudea.”
- issue: Nguvu ya kiidioma ya הֹשִׁיבוּ נָשִׁים
  choice: waliokuwa wameoa wanawake
  alternative: waliokuwa wamewaweka wanawake wakae / walikuwa wamewachukua kuwa wake
  rationale: Tafsiri ya kiidioma inaeleza wazi kuwa jambo linalozungumziwa ni ndoa, bila kuongeza hukumu ya kitheolojia isiyosemwa katika kifungu chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi sauti ya ushuhuda wa Nehemia na mpangilio wa makundi matatu bila kutumia istilahi nzito zisizo za kawaida.
