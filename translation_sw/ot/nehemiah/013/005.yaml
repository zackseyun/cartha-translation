source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: sw
  text: Akamwandalia chumba kikubwa[a], ambamo hapo zamani waliweka sadaka ya nafaka, ubani, vyombo, na zaka ya nafaka, divai mpya na mafuta—fungu lililoamriwa kwa ajili ya Walawi, waimbaji na walinda malango[b]—pamoja na mchango kwa ajili ya makuhani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ghala kubwa.” Neno la Kiebrania linaweza kumaanisha chumba kilichotumiwa kuhifadhia vitu katika eneo la hekalu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa karibu zaidi: “amri ya Walawi, waimbaji na walinda malango”; maana yake inaelekea kuwa fungu lililoamriwa kwa ajili yao.'
    reason: lexical_alternative
  - marker: c
    text: Au “sadaka iliyoinuliwa kwa ajili ya makuhani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: Akamwandalia
  rationale: Katika muktadha huu עשה + ל inaweza kumaanisha kumtengenezea au kumwandalia. “Akamwandalia” ni ya asili katika Kiswahili na haibainishi bila lazima kama chumba kilijengwa upya au kilitayarishwa kwa matumizi yake.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: chumba kikubwa
  rationale: לשכה ni chumba katika eneo la hekalu, mara nyingi cha kuhifadhia vitu. “Chumba kikubwa” ni wazi na huhifadhi maana ya msingi; uwezekano wa “ghala kubwa” umewekwa katika tanbihi.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: ambamo hapo zamani waliweka
  rationale: היה pamoja na kitenzi-shirikishi huonyesha desturi ya wakati uliopita, na לפנים humaanisha hapo zamani. Muundo huu unaeleza kwa kawaida mahali walipokuwa na desturi ya kuweka vitu hivyo.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa ibada ya hekalu, מנחה hapa ni sadaka ya nafaka, si sadaka kwa ujumla.
- source_word: הַלְּבוֹנָה
  choice: ubani
  rationale: לבונה humaanisha frankincense; “ubani” ndiyo istilahi ya kawaida na inayoeleweka katika Kiswahili cha kibiblia.
- source_word: הַכֵּלִים
  choice: vyombo
  rationale: כלים katika muktadha wa hekalu ni vyombo au vifaa vya huduma. “Vyombo” ni neno fupi, la kawaida na lenye heshima.
- source_word: מַעְשַׂר
  choice: zaka
  rationale: מעשר ni sehemu ya kumi iliyotengwa kwa mujibu wa sheria; “zaka” ni istilahi ya Kiswahili inayotambulika kwa dhana hii.
- source_word: הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: nafaka, divai mpya na mafuta
  rationale: 'Hutafsiri orodha ya kawaida ya mazao: דגן nafaka, תירוש divai mpya, na יצהר mafuta, kwa kawaida ya zeituni.'
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: fungu lililoamriwa kwa ajili ya Walawi, waimbaji na walinda malango
  rationale: Kiebrania kina maana iliyofupishwa ya kile kilichoamriwa kwa makundi hayo. “Fungu lililoamriwa” huifanya maana ya orodha ya mahitaji yaliyohifadhiwa ieleweke bila kuondoa hali ya kifungu cha asili.
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: mchango kwa ajili ya makuhani
  rationale: תרומה ni kitu kilichotengwa na kutolewa kama mchango au sadaka. “Mchango” ni wazi kwa msomaji wa kisasa, huku tanbihi ikihifadhi uwezekano wa “sadaka iliyoinuliwa.”
theological_decisions:
- issue: Maana ya מִצְוַת katika orodha ya vyakula vilivyohifadhiwa
  choice: fungu lililoamriwa kwa ajili ya Walawi, waimbaji na walinda malango
  alternative: amri kuhusu Walawi, waimbaji na walinda malango
  rationale: Muktadha wa zaka na vitu vilivyowekwa ghalani unaelekea kwenye fungu walilopaswa kupewa, lakini tanbihi inahifadhi umbo halisi zaidi la Kiebrania bila kulifanya kuwa fundisho la kimadhehebu.
- issue: Maana ya תְרוּמַת הַכֹּהֲנִים
  choice: mchango kwa ajili ya makuhani
  alternative: sadaka iliyoinuliwa kwa ajili ya makuhani
  rationale: “Mchango” huwasilisha kitu kilichotengwa kwa makuhani kwa lugha inayoeleweka; istilahi ya kitamaduni ya kiibada imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Sentensi imehifadhi orodha ndefu ya Kiebrania lakini imetumia vistari kuonyesha kuwa fungu lililoamriwa linahusiana na zaka ya mazao. “Walinda malango” limetumiwa badala ya neno linaloweza kudokeza walinzi wa kawaida tu, kwa kuwa hawa ni watumishi wa malango ya hekalu.
