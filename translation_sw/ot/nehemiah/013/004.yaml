base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: sw
  text: Kabla ya hayo[a], kuhani Eliashibu, ambaye alikuwa amewekwa kusimamia chumba cha nyumba ya Mungu wetu, alikuwa na uhusiano wa karibu na Tobia—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa mshirika wa Tobia.” Usemi wa Kiebrania unaweza kumaanisha uhusiano wa karibu, iwe wa kifamilia au wa kijamii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: Kabla ya hayo
  rationale: Ni kishazi cha wakati kinachoelekeza kwenye hali iliyokuwapo kabla ya matukio yaliyotangulia; kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti katika mtiririko wa kawaida wa Kiswahili.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: kuhani Eliashibu
  rationale: Jina limetoholewa kwa mtindo wa majina ya Biblia katika Kiswahili, na cheo הַכֹּהֵן kimetafsiriwa kwa njia ya kawaida na yenye kueleweka.
- source_word: נָתוּן בְּלִשְׁכַּת
  choice: alikuwa amewekwa kusimamia chumba
  rationale: Umbo tendwa נָתוּן linaonyesha kuwa Eliashibu alikuwa amepewa jukumu linalohusiana na chumba hicho; ‘kusimamia’ linaeleza wajibu huo bila kumaanisha kwamba alikuwa amewekwa humo kimwili tu.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: nyumba ya Mungu wetu
  rationale: Tafsiri ya moja kwa moja inayohifadhi usemi wa jamii ya mwandishi, ‘Mungu wetu,’ na maana ya hekalu kama nyumba ya Mungu.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: alikuwa na uhusiano na Tobia
  rationale: Usemi unaweza kumaanisha undugu au ukaribu wa kijamii. ‘Alikuwa na uhusiano’ huhifadhi upana huo bila kuamua kimya-kimya aina ya uhusiano.
theological_decisions:
- issue: Aina ya uhusiano kati ya Eliashibu na Tobia
  choice: alikuwa na uhusiano na Tobia
  alternative: alikuwa jamaa ya Tobia; alikuwa mshirika wa Tobia
  rationale: Kiebrania קָרוֹב לְ kinaweza kueleza uhusiano wa kifamilia au wa kijamii. Muktadha hauamui kwa uhakika aina yake, kwa hiyo tafsiri kuu imeacha utata huo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imeachwa na alama ya mkato mwishoni kwa sababu wazo linaendelea katika mstari unaofuata.
