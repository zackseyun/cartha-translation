  text: וַ/יְהִ֖י כְּ/שָׁמְעָ֣/ם אֶת הַ/תּוֹרָ֑ה וַ/יַּבְדִּ֥ילוּ כָל עֵ֖רֶב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: sw
  text: Waliposikia Sheria, walilitenga na Israeli kundi lote lililochanganyika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wote wenye asili mchanganyiko,” au “kundi lote mchanganyiko.” Neno la Kiebrania עֵרֶב ni nomino ya mkusanyo inayomaanisha kundi mchanganyiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Waliposikia
  rationale: Muundo huu unaanzisha tukio linalofuata na kishazi cha wakati. ‘Waliposikia’ ni Kiswahili cha kawaida na cha moja kwa moja; hakuna haja ya kutafsiri וַיְהִי kando kwa namna nzito kama ‘ikawa kwamba.’
- source_word: הַתּוֹרָה
  choice: Sheria
  rationale: Katika muktadha huu wa agano baada ya uhamisho, neno hilo linamaanisha Sheria yenye mamlaka iliyokuwa ikisomwa kwa watu. Herufi kubwa inasaidia kuonyesha matumizi yake kama jina la maandiko hayo bila kutumia neno lisiloeleweka kwa urahisi kama ‘Torati.’
- source_word: וַיַּבְדִּילוּ
  choice: wakawatenga
  rationale: Kitenzi בדל humaanisha kutenganisha au kuweka kando. Kiambishi cha yambwa ‘-wa-’ kinarejelea watu wanaofuata, na ‘tenga’ huhifadhi tendo bila kulifafanua kupita kiasi kuwa kufukuza.
- source_word: כָל עֵרֶב
  choice: watu wote wa jamii mchanganyiko
  rationale: עֵרֶב ni nomino ya mkusanyo inayotaja kundi lenye mchanganyiko. Tafsiri hii ni ya asili kwa Kiswahili na huhifadhi kutobainika kama mchanganyiko huo ni wa asili, taifa, au ushirika, badala ya kuamua kimya kimya.
- source_word: מִיִּשְׂרָאֵל
  choice: na Israeli
  rationale: Baada ya kitenzi ‘tenga,’ Kiswahili hutumia ‘na’ kuonyesha kutenganishwa kutoka kwa jumuiya fulani. ‘Israeli’ limehifadhiwa kama jina la jumuiya ya agano, si kubadilishwa kuwa ‘Waisraeli.’
theological_decisions:
- issue: Maana ya ‘Israeli’ katika muktadha wa usafi wa jumuiya baada ya uhamisho
  choice: Kuhifadhi ‘Israeli’ kama jina la jumuiya ya agano
  alternative: kuwatenga na Waisraeli; kuwatenga na kusanyiko la Israeli
  rationale: Kiebrania kinatumia jina יִשְׂרָאֵל. Kulihifadhi hudumisha lugha ya utambulisho wa pamoja na wa agano bila kuingiza hitimisho la baadaye la kitheolojia.
- issue: Utambulisho wa עֵרֶב
  choice: Kutumia kauli pana ‘watu ... wa jamii mchanganyiko’ na kutoa maelezo ya chini
  alternative: watu wote wenye asili mchanganyiko; kundi lote mchanganyiko
  rationale: Neno la Kiebrania ni la mkusanyo na halielezi wazi aina ya mchanganyiko. Tafsiri haipaswi kulifanya limaanishe nasaba pekee bila ushahidi wa kutosha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa fupi kwa mtiririko wa simulizi. Alama ya tanbihi [a] imewekwa mara moja baada ya kirai kinachohusika.
