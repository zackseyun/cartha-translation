base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: sw
  text: Je, basi, tuwasikilize ninyi na tufanye uovu huu mkubwa wote, na kumkosea Mungu wetu uaminifu kwa kuwaoa wanawake wageni?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa kuwafanya wanawake wageni wakae”; katika muktadha huu, usemi huo unamaanisha kuwaoa na kuwaingiza nyumbani kama wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע ... וְלָכֶם
  choice: Je, basi, tutawasikiliza ninyi
  rationale: Muundo wa Kinifali wa שׁמע pamoja na לָכֶם unauliza kwa balagha kama watu wawatii au wafuate mfano wao. “Tutawasikiliza ninyi” huhifadhi maana ya msingi ya kusikia/kusikiliza na pia uwezekano wa kutii bila kuubana kabisa.
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: na kufanya uovu huu wote mkubwa
  rationale: “Kufanya” hufuata maana ya kawaida ya עשה, huku “uovu huu wote mkubwa” ikihifadhi כָּל, uzito wa הַגְּדוֹלָה, na rejeo la הַזֹּאת.
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: tukitenda kwa kukosa uaminifu dhidi ya Mungu wetu
  rationale: מעל huonyesha kuvunja uaminifu au kutenda kwa hiana, mara nyingi katika uhusiano wa agano. Tafsiri hii ni wazi kwa msomaji wa kawaida na inadumisha uzito wa kosa dhidi ya Mungu.
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: kwa kuwaoa wanawake wageni
  rationale: Kitenzi לְהֹשִׁיב kwa maana halisi ni “kuwafanya wakae,” lakini katika muktadha huu kinamaanisha kuwaingiza wanawake hao nyumbani kama wake. “Kuwaoa” hutoa maana ya kimuktadha kwa Kiswahili cha kawaida; tanbihi huhifadhi usemi halisi.
theological_decisions:
- issue: Asili ya kosa katika לִמְעֹל בֵּאלֹהֵינוּ
  choice: kukosa uaminifu dhidi ya Mungu katika uhusiano wa agano
  alternative: kutenda kosa la jumla au kosa la kiibada dhidi ya Mungu
  rationale: מעל mara nyingi hudokeza usaliti au uvunjaji wa uaminifu. Tafsiri haifanyi kosa hili kuwa la kiibada pekee, wala haipunguzi uzito wake hadi uovu wa jumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Swali la balagha limehifadhiwa, pamoja na msisitizo wa uovu mkubwa na kutokuwa mwaminifu kwa Mungu.
