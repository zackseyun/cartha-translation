base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: sw
  text: Nikagundua kwamba mafungu ya Walawi[a] hayakuwa yametolewa. Kwa hiyo, Walawi na waimbaji waliokuwa wakifanya kazi wakakimbia, kila mmoja kwenda shambani kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafungu yaliyowekwa kwa ajili ya Walawi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “kila mtu kwenda shambani kwake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: Nikagundua
  rationale: Katika muktadha huu, kitenzi kinaeleza Nehemia kupata habari au kutambua hali iliyokuwapo, si kujua tu kwa hali tuli.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: mafungu ya Walawi
  rationale: Neno מְנָיוֹת linamaanisha mafungu au sehemu za mahitaji walizopaswa kupewa Walawi. Usemi huu ni mfupi, wa kawaida, na unabaki karibu na muundo wa Kiebrania.
- source_word: לֹא נִתָּנָה
  choice: hayakuwa yametolewa
  rationale: Huhifadhi hali ya kutendwa ya נתן na huonyesha kuwa mafungu hayo hayakuwa yamewafikia kabla ya Nehemia kugundua hali hiyo.
- source_word: וַיִּבְרְחוּ אִישׁ לְשָׂדֵהוּ
  choice: walikuwa wamekimbia, kila mmoja kwenda shambani kwake
  rationale: 'Kitenzi ברח kina maana ya kukimbia, na אִישׁ לְשָׂדֵהוּ huonyesha mgawanyo: kila mtu alirudi kwenye shamba lake ili kujipatia riziki.'
- source_word: וְהַמְשֹׁרְרִים
  choice: na waimbaji
  rationale: Hili ni neno la kawaida kwa waimbaji wa huduma ya hekalu; muktadha unatosha bila kuongeza neno “hekalu” lisilotajwa wazi hapa.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: waliofanya kazi
  rationale: Huhifadhi kishazi cha kivumishi kinachowahusu Walawi na waimbaji bila kufafanua zaidi aina ya kazi kuliko chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nikagundua” ni cha kawaida na sahihi kwa simulizi la Nehemia; “shambani kwake” linaeleza kwa kawaida kurudi kwenye ardhi ya kilimo bila kuongeza maelezo yasiyomo katika chanzo.
