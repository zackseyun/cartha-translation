base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: sw
  text: Basi nikawaonya na kuwaambia, “Kwa nini mnakaa mbele ya ukuta usiku? Mkirudia kufanya hivyo, nitawainulia mkono[a].” Tangu wakati huo hawakuja tena siku ya Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitawatumia nguvu.” Nahau ya Kiebrania, kwa tafsiri ya neno kwa neno, ni “nitatuma mkono dhidi yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה
  choice: nikawaonya
  rationale: Hifili ya עוד hapa ina maana ya kutoa onyo zito dhidi ya mwenendo wao; “nikawaonya” ni ya asili na inaeleweka wazi katika Kiswahili cha sasa.
- source_word: וָאֹמְרָה אֲלֵיהֶם
  choice: na kuwaambia
  rationale: Huhifadhi mfuatano wa kawaida wa simulizi bila kurudia kiwakilishi cha nafsi kisichohitajika katika Kiswahili.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kuuliza sababu.
- source_word: לֵנִים
  choice: mnalala usiku
  rationale: Kitenzi kina maana ya kukaa au kulala mahali usiku; kauli hii ni wazi kwa wasomaji wa kawaida.
- source_word: נֶגֶד הַחוֹמָה
  choice: mbele ya ukuta
  rationale: נֶגֶד hapa huonyesha mahali palipo mbele ya au mkabala na ukuta. “Mbele ya ukuta” huhifadhi maana hiyo bila kuongeza kwa ufafanuzi kwamba walikuwa nje ya mji.
- source_word: אִם תִּשְׁנוּ
  choice: Mkirudia kufanya hivyo
  rationale: שנה ina maana ya kurudia tendo; “kufanya hivyo” hurejelea wazi kulala kwao pale usiku.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: nitawatia mikono
  rationale: Kauli hii huhifadhi taswira ya mkono katika nahau ya Kiebrania na, katika muktadha wa tishio, hueleweka kuwa Nehemia angewachukulia hatua kwa nguvu. Tanbihi inatoa maana hiyo kwa uwazi zaidi.
- source_word: מִן הָעֵת הַהִיא
  choice: Tangu wakati huo
  rationale: Ni mpito wa kawaida wa wakati unaoonyesha matokeo yaliyoendelea baada ya onyo.
- source_word: לֹא בָאוּ
  choice: hawakuja tena
  rationale: “Tena” huwasilisha kwa Kiswahili matokeo ya kuacha kuja kuanzia wakati uliotajwa, bila kubadili kiini cha ukanushi.
- source_word: בַּשַּׁבָּת
  choice: siku ya Sabato
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya שַׁבָּת katika Kiswahili.
