  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: sw
  text: Je, si kwa sababu ya mambo haya Sulemani, mfalme wa Israeli, alitenda dhambi? Na miongoni mwa mataifa mengi hakukuwa na mfalme kama yeye. Mungu wake alimpenda, naye Mungu akamweka kuwa mfalme juu ya Israeli yote. Hata yeye, wanawake wa kigeni[a] walimsababisha kutenda dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wake wa kigeni.” Kiebrania kinasema “wanawake wa kigeni”; “wake” inaungwa mkono na muktadha wa simulizi la Sulemani, lakini haijasemwa wazi katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: Je, si kwa sababu ya mambo haya
  rationale: הֲלוֹא huanzisha swali la balagha linalotarajia jibu la kukubali; עַל אֵלֶּה hapa huonyesha sababu au tukio lililopelekea dhambi. “Mambo haya” ni Kiswahili cha kawaida na hakiongezi maelezo yasiyo katika kifungu.
- source_word: חָטָא
  choice: alitenda dhambi
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya חטא katika muktadha wa maadili na uhusiano na Mungu.
- source_word: שְׁלֹמֹה מֶלֶךְ יִשְׂרָאֵל
  choice: Sulemani, mfalme wa Israeli
  rationale: Jina na cheo vimetafsiriwa moja kwa moja; koma zinaifanya sentensi isomeke kwa kawaida katika Kiswahili.
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: Miongoni mwa mataifa mengi hakukuwa na mfalme kama yeye
  rationale: Inahifadhi ulinganisho mpana wa Kiebrania bila kuongeza kiunganishi chenye maana ya kitheolojia.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: Mungu wake alimpenda
  rationale: Muundo tendaji ni wa asili zaidi katika Kiswahili na unawasilisha kwa usahihi hali ya kuwa mpendwa wa Mungu wake.
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ עַל כָּל יִשְׂרָאֵל
  choice: naye Mungu akamweka kuwa mfalme juu ya Israeli yote
  rationale: נתן pamoja na cheo hapa ina maana ya kumweka au kumteua mtu katika mamlaka; “juu ya Israeli yote” huhifadhi upeo wa utawala.
- source_word: גַּם אוֹתוֹ הֶחֱטִיאוּ
  choice: Hata yeye ... walimsababisha kutenda dhambi
  rationale: “Hata yeye” huhifadhi msisitizo wa kiwakilishi kilichotangulizwa, na “walimsababisha kutenda dhambi” huonyesha wazi umbo la kusababisha la kitenzi.
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: wanawake wa kigeni
  rationale: Tafsiri ya moja kwa moja ya nomino na kivumishi; “wake” inawezekana kutokana na simulizi la Sulemani, lakini haijasemwa wazi katika mstari huu.
theological_decisions:
- issue: Sababu ya dhambi ya Sulemani
  choice: Wanawake wa kigeni walimsababisha Sulemani kutenda dhambi
  alternative: Wanawake hao walimjaribu; ndoa zake ziliathiri uaminifu wake kwa Mungu
  rationale: Kitenzi cha Kiebrania kinaonyesha usababishaji, lakini kifungu hakielezi namna jambo hilo lilivyotokea; tafsiri haiongezi maelezo kutoka 1 Wafalme 11.
- issue: Tafsiri ya אֱלֹהִים
  choice: Mungu
  alternative: BWANA
  rationale: Neno lililotumiwa ni אֱלֹהִים, si jina la agano יהוה; kwa hiyo “BWANA” halingekuwa na msingi katika maandishi haya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa kwa “Je, si...?”; sentensi zimepangwa kwa urahisi wa kusoma bila kupunguza msisitizo wa Kiebrania.
