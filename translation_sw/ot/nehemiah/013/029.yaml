base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: sw
  text: Ee Mungu wangu, uwakumbuke, kwa kuwa wameunajisi ukuhani na agano la ukuhani na la Walawi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Ee Mungu wangu, uwakumbuke kwa habari ya wale waliounajisi ukuhani na agano la ukuhani na la Walawi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לָהֶם
  choice: uwakumbuke
  rationale: Ombi la moja kwa moja kwa Mungu, linalolingana na sala nyingine za Nehemia. Muktadha unaonyesha kuwa kukumbuka huku ni kwa ajili ya hukumu, ingawa kitenzi chenyewe hakiongezewi maana hiyo waziwazi.
- source_word: אֱלֹהָי
  choice: Ee Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinatoa maana ya 'Mungu wangu'; 'Ee' linaonyesha kwa kawaida kwamba ni mwito wa sala.
- source_word: עַל
  choice: kwa kuwa
  rationale: 'Katika muktadha huu neno linaonyesha sababu ya ombi: Mungu awakumbuke kwa sababu ya kosa lao.'
- source_word: גָּאֳלֵי
  choice: wameutia unajisi
  rationale: Hii ni kauli ya kushiriki kutoka mzizi wenye maana ya kunajisi au kuchafua, si mzizi tofauti wenye maana ya kukomboa. Muundo wa kitenzi ni wa kawaida na wazi katika Kiswahili.
- source_word: הַכְּהֻנָּה
  choice: ukuhani
  rationale: Nomino dhahania inarejelea hadhi au taasisi ya ukuhani, si makuhani mmoja mmoja.
- source_word: וּבְרִית הַכְּהֻנָּה וְהַלְוִיִּם
  choice: na agano la ukuhani na la Walawi
  rationale: Urudiaji wa 'la' unaonyesha kwa Kiswahili kuwa Walawi wanahusishwa na agano, huku uhusiano kamili wa kisarufi ukiachwa bila kufafanuliwa kupita kiasi.
theological_decisions:
- issue: Iwapo Mungu anaombwa awakumbuke wahalifu kwa wema au kwa hukumu
  choice: Kuwakumbuka kwa hukumu kwa sababu ya kunajisi kwao
  alternative: Kuwakumbuka kwa namna isiyoelezwa kuwa nzuri au mbaya
  rationale: Shtaka linalofuata linaipa sala mwelekeo wa hukumu. Tafsiri inadumisha kitenzi rahisi 'uwakumbuke' na kuonyesha mwelekeo huo kupitia kishazi cha sababu.
- issue: Upeo wa maneno 'agano la ukuhani na Walawi'
  choice: Agano linalohusiana na ukuhani na Walawi
  alternative: Agano la ukuhani, kisha Walawi wakiwa kitu tofauti kilichonajisiwa; au agano lililofanywa moja kwa moja na makuhani na Walawi
  rationale: Sintaksia ya Kiebrania imebanwa na inaweza kueleweka kwa zaidi ya njia moja. Matini kuu inawahusisha Walawi na agano bila kubainisha kupita kiasi aina kamili ya uhusiano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa urahisi. 'Kutia unajisi' linahifadhi uzito wa kidini wa kosa; 'ukuhani' ni sahihi kuliko kutaja makuhani mmoja mmoja.
