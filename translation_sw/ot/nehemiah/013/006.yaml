base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: sw
  text: Lakini wakati wa hayo yote sikuwa Yerusalemu, kwa maana katika mwaka wa thelathini na mbili wa Artashasta, mfalme wa Babeli[a], nilikwenda kwa mfalme; na baada ya muda fulani[b], nikaomba ruhusa kwa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mfalme wa Babeli.” Tafsiri inafuata maandishi kama yalivyo badala ya kuyapatanisha na mazingira mapana ya Milki ya Uajemi.'
    reason: textual_variant
  - marker: b
    text: Au “mwishoni mwa siku kadhaa” / “baada ya kipindi fulani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: Lakini wakati wa hayo yote
  rationale: Kirai hiki kinaunganisha simulizi na pia kinaonyesha kipindi ambacho matukio yaliyotangulia yalitokea huku Nehemia akiwa hayupo; ‘lakini wakati wa’ ni Kiswahili cha asili kinachobeba kazi hizo mbili.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: sikuwa Yerusalemu
  rationale: Kauli rahisi ya wakati uliopita inaeleza moja kwa moja kutokuwapo kwake mjini Yerusalemu.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu au maelezo ya kutokuwapo kwa Nehemia.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם
  choice: katika mwaka wa thelathini na mbili
  rationale: Hii ni namna ya kawaida na iliyo wazi ya kutaja mwaka wa utawala kwa Kiswahili.
- source_word: לְאַרְתַּחְשַׁסְתְּא
  choice: wa Artashasta
  rationale: Jina limeandikwa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Tafsiri inafuata moja kwa moja maandishi ya Kiebrania badala ya kuyapatanisha kimyakimya na mazingira mapana ya Milki ya Uajemi.
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: nilikwenda kwa mfalme
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kwenda kulingana na mtazamo; hapa ‘nilikwenda’ ni ya asili katika simulizi la Nehemia kutoka Yerusalemu kwenda kwa mfalme.
- source_word: וּלְקֵץ יָמִים
  choice: baada ya muda fulani
  rationale: Ingawa maana ya neno kwa neno ni ‘mwishoni mwa siku,’ kirai hiki hutaja muda usioainishwa; ‘baada ya muda fulani’ kinatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: nikaomba ruhusa kwa mfalme
  rationale: Katika muktadha huu umbo la kitenzi linahusu kuomba ruhusa ya kuondoka; tafsiri haiongezi dai la kwamba ruhusa hiyo ilitolewa.
