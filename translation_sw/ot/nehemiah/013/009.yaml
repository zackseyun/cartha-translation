  text: וָ/אֹ֣מְרָ֔/ה וַֽ/יְטַהֲר֖וּ הַ/לְּשָׁכ֑וֹת וָ/אָשִׁ֣יבָ/ה שָּׁ֗ם כְּלֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים אֶת הַ/מִּנְחָ֖ה וְ/הַ/לְּבוֹנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: sw
  text: Kisha nikaamuru[a], nao wakavitakasa vyumba; nami nikavirudisha humo vyombo vya nyumba ya Mungu, pamoja na sadaka ya nafaka na ubani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kisha nikasema” au “Kisha nikatoa agizo.” Kitenzi cha Kiebrania kwa msingi wake ni “nikasema,” lakini hapa kinaanzisha agizo lililotekelezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Kisha nikaamuru
  rationale: Kitenzi kwa msingi wake ni ‘nikasema,’ lakini katika muktadha huu kauli hiyo ni agizo lililotekelezwa. ‘Nikaamuru’ huonyesha nguvu ya kauli kwa Kiswahili cha kawaida, huku ‘Kisha’ ikiwakilisha mfuatano wa simulizi.
- source_word: וַיְטַהֲרוּ
  choice: nao wakavitakasa
  rationale: טהר linaweza kumaanisha kusafisha au kutakasa, hasa katika muktadha wa kiibada. ‘Wakavitakasa’ huhifadhi maana ya kuondoa unajisi, si kufanya usafi wa kawaida tu.
- source_word: הַלְּשָׁכוֹת
  choice: vyumba
  rationale: לשכה humaanisha chumba katika eneo la hekalu. ‘Vyumba’ ni ya asili na yenye kueleweka kwa wasomaji wa sasa; ‘ghala’ ingekuwa mahsusi zaidi kuliko nomino ya Kiebrania yenyewe.
- source_word: וָאָשִׁיבָה שָּׁם
  choice: nami nikavirudisha humo
  rationale: Hapa שוב lina maana sababishi ya kurudisha vitu vilivyoondolewa. ‘Humo’ hurejelea moja kwa moja vyumba vilivyotajwa.
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: vyombo vya nyumba ya Mungu
  rationale: כְּלִי ni neno pana kwa vyombo, vifaa, au vitu vya matumizi. ‘Vyombo’ linafaa katika muktadha wa ibada, na ‘nyumba ya Mungu’ huhifadhi usemi wa Kiebrania badala ya kuubadili kuwa ‘hekalu.’
- source_word: אֶת הַמִּנְחָה
  choice: pamoja na sadaka ya nafaka
  rationale: Katika muktadha wa ibada, מִנְחָה ni sadaka ya nafaka. ‘Pamoja na’ huonyesha kwamba sadaka hiyo ilirudishwa sambamba na vyombo.
- source_word: וְהַלְּבוֹנָה
  choice: na ubani
  rationale: לְבוֹנָה humaanisha ubani mahsusi. ‘Ubani’ ni neno la kawaida na sahihi katika Kiswahili kwa dutu hiyo ya kunukia iliyotumiwa katika ibada.
theological_decisions:
- issue: Aina ya utakaso wa vyumba
  choice: wakavitakasa
  alternative: wakavisafisha
  rationale: Muktadha wa nyumba ya Mungu unaruhusu maana ya kiibada pamoja na usafishaji wa kimwili. ‘Kutakasa’ huhifadhi wigo huo bila kuamua kwa uhakika kwamba tendo lilikuwa la kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Muundo umewekwa wazi na wa kawaida bila kupoteza msamiati wa kiibada. Alama ya tanbihi [a] imewekwa katika matini kuu.
