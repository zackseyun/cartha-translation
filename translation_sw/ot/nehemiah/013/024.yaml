base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: sw
  text: Na nusu ya watoto wao walizungumza lugha ya Ashdodi[a]; hawakuweza kuzungumza lugha ya Yuda, bali walizungumza kulingana na lugha ya kila taifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na nusu ya watoto wao walizungumza lugha ya Ashdodi, nao hawakujua jinsi ya kuzungumza lugha ya Yuda, bali walizungumza kulingana na lugha ya kila taifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: watoto wao
  rationale: Ingawa בנים inaweza kumaanisha wana wa kiume, hapa inarejelea watoto wa familia hizi kwa ujumla; “watoto wao” ni Kiswahili cha kawaida kisichowabani kuwa wa kiume pekee.
- source_word: חֲצִי
  choice: nusu ya
  rationale: Neno hili linaonyesha kwamba ni sehemu moja tu ya watoto iliyozungumziwa; muundo “nusu ya watoto wao” unaeleweka kwa urahisi.
- source_word: מְדַבֵּר
  choice: walizungumza
  rationale: Kishirikishi kinaeleza hali au mazoea yao ya lugha katika simulizi; wakati uliopita huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אַשְׁדּוֹדִית
  choice: lugha ya Ashdodi
  rationale: Hili ni jina la lugha inayohusishwa na Ashdodi. Muundo huu ni wazi na huepuka kuunda jina la lugha lisilo la kawaida katika Kiswahili.
- source_word: וְאֵינָם מַכִּירִים
  choice: hawakuweza
  rationale: מכיר pamoja na kitenzi-jina hapa huonyesha kutokuwa na ujuzi au uwezo wa kufanya jambo, si kutotambua tu; “hawakuweza” linaeleza kutokuwa na uwezo wa kuizungumza.
- source_word: לְדַבֵּר יְהוּדִית
  choice: kuzungumza lugha ya Yuda
  rationale: יְהוּדִית ni lugha ya Yuda au ya Wayuda. “Lugha ya Yuda” huhifadhi uhusiano huo bila kuitambulisha moja kwa moja kuwa Kiebrania, jambo ambalo andiko halisemi wazi.
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: bali lugha ya watu hawa au wale
  rationale: Kirai hiki ni cha mgawanyo, yaani lugha ya kila jamii husika. “Watu hawa au wale” huwasilisha tofauti za lugha za mataifa mbalimbali kwa Kiswahili kinachoeleweka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Lugha ya Ashdodi” na “lugha ya Yuda” zimetumiwa badala ya majina ya lugha yanayoweza kudokeza utambulisho wa kisasa au uhakika usiomo katika Kiebrania. Alama [a] ipo katika matini kuu na inaonyesha uwezekano mwingine wa kuelewa muundo wa sentensi.
