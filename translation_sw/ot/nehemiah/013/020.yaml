  text: וַ/יָּלִ֨ינוּ הָ/רֹכְלִ֜ים וּ/מֹכְרֵ֧י כָל מִמְכָּ֛ר מִ/ח֥וּץ לִ/ירוּשָׁלִָ֖ם פַּ֥עַם וּ/שְׁתָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: sw
  text: Basi wafanyabiashara na wauzaji wa bidhaa za kila aina wakalala nje ya Yerusalemu mara moja au mbili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mara moja na mbili,” yaani, “mara moja au mbili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: wakalala
  rationale: Kitenzi לון humaanisha kukaa au kulala mahali usiku. “Wakalala” ni lugha ya kawaida na huhifadhi maana ya kupitisha usiku bila kudokeza makazi ya kudumu.
- source_word: הָרֹכְלִים
  choice: wafanyabiashara
  rationale: רֹכֵל humaanisha mfanyabiashara au mchuuzi. “Wafanyabiashara” linafaa katika muktadha huu wa biashara na ni neno la kawaida katika Kiswahili sanifu.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: na wauzaji wa bidhaa za kila aina
  rationale: Kirai hiki kinajumuisha wauzaji wa kila kitu kinachouzwa. Tafsiri hii ni ya asili na huhifadhi upana wa כָל מִמְכָּר.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: nje ya Yerusalemu
  rationale: מִחוּץ huonyesha mahali palipo nje ya mji; “nje ya Yerusalemu” ni tafsiri wazi na ya kawaida.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: mara moja au mbili
  rationale: Kwa neno moja moja, Kiebrania kinasema “mara moja na mbili,” lakini hiki ni kirai kinachomaanisha tukio lilitokea mara moja au mbili, si mara nyingi.
theological_decisions: []
