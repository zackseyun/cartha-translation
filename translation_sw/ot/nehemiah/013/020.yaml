  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “bidhaa za kila aina” huepuka lugha nzito ya kibiashara.
