  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: sw
  text: Jambo hilo liliniudhi sana, nami nikatupa vitu vyote vya Tobia nje ya chumba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chumba” hapa ni chumba katika eneo la hekalu.
