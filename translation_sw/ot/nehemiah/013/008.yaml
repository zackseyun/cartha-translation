lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: Jambo hilo halikunipendeza hata kidogo
  rationale: Muundo wa Kiebrania unaonyesha jambo kuwa baya au kutompendeza msemaji sana. Tafsiri hii ni ya kawaida katika Kiswahili na haibainishi kwa lazima kama hisia ilikuwa hasira, huzuni, au chukizo.
- source_word: וָאַשְׁלִיכָה
  choice: nikatupa
  rationale: Kitenzi cha Kiebrania katika hali ya Hiphil kina maana ya kutupa au kurusha. “Nikatupa” ni wazi, cha sasa, na kinadumisha nguvu ya tendo.
- source_word: כָּל
  choice: zote
  rationale: Neno hili lina maana jumuishi; “zote” linapatana kiasili na nomino “mali.”
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: mali zote za nyumbani za Tobia
  rationale: כְּלִי linaweza kumaanisha vitu, vyombo, vifaa, samani, au mali. Katika muktadha huu ni vitu vya Tobia vilivyokuwa vimewekwa katika chumba cha hekalu; “mali za nyumbani” linafikisha maana pana bila kudokeza kimakosa kwamba vilikuwa vyombo vya ibada.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: nje ya chumba
  rationale: Maneno haya yanaonyesha kuhamishwa kutoka ndani ya chumba kuelekea nje. “Nje ya chumba” ni usemi wa kawaida na ulio wazi katika Kiswahili.
