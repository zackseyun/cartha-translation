  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: sw
  text: Watu wote wa Yuda wakaleta zaka ya nafaka, divai mpya, na mafuta katika maghala[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyumba vya kuhifadhia” au “hazina.” Neno la Kiebrania linaweza kumaanisha vyumba vya kuhifadhi vitu au hazina; hapa muktadha wa nafaka, divai, na mafuta unaunga mkono “maghala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: Ndipo Yuda yote
  rationale: כָּל pamoja na jina יְהוּדָה inaonyesha jumuiya nzima ya Yuda. Kiswahili hutumia upatanisho wa ngeli ya mahali kwa jina hili la eneo linalowakilisha watu wake.
- source_word: הֵבִיאוּ
  choice: ikaleta
  rationale: Hifili ya בוא ina maana ya kuleta au kuingiza. 'Ikaleta' ni ya kawaida na inaendeleza simulizi; mahali pa kuingiza vinaelezwa na kirai cha mwisho.
- source_word: מַעְשַׂר
  choice: zaka
  rationale: מַעְשַׂר ni sehemu ya kumi iliyotolewa kwa wajibu. 'Zaka' ni neno la kawaida katika Kiswahili cha Biblia kwa dhana hii na hapa lina maana ya pamoja.
- source_word: הַ/דָּגָן
  choice: nafaka
  rationale: דָּגָן ni jina pana la mazao ya nafaka; 'nafaka' ni sawia, wazi, na halimaanishi aina moja tu.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: divai mpya
  rationale: תִּירוֹשׁ kwa kawaida ni divai mpya au ya karibuni, tofauti na neno la jumla יַיִן. Tafsiri hii inadumisha utofauti huo wa kileksika.
- source_word: וְ/הַ/יִּצְהָר
  choice: mafuta
  rationale: יִצְהָר hurejelea mafuta mapya, kwa kawaida ya zeituni, katika orodha za mazao. 'Mafuta' ni ya asili na haiongezi ufafanuzi usiosemwa moja kwa moja.
- source_word: לָ/אוֹצָרוֹת
  choice: katika ghala
  rationale: אוֹצָרוֹת ni vyumba au mahali pa kuhifadhi akiba. Kwa muktadha wa nafaka, divai, na mafuta, 'ghala' linafaa kuliko 'hazina,' ambalo lingeweza kudokeza fedha au vitu vya thamani.
