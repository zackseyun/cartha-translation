  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: ombi la kumkumbuka mwombaji, rejeleo la jambo lililotangulia, ombi la kutofuta, matendo ya חֶסֶד aliyotenda Nehemia, na uhusiano wake na nyumba ya Mungu na mishmarot yake vyote vimehifadhiwa. “Kwa ajili ya” ni ufafanuzi halali wa בְ katika muktadha huu wa huduma ya hekalu.'
