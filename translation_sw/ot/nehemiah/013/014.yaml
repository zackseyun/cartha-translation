id: NEH.13.14
reference: Nehemiah 13:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י עַל זֹ֑את וְ/אַל תֶּ֣מַח חֲסָדַ֗/י אֲשֶׁ֥ר עָשִׂ֛יתִי בְּ/בֵ֥ית אֱלֹהַ֖/י וּ/בְ/מִשְׁמָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: sw
  text: Mungu wangu, unikumbuke kwa jambo hili, wala usiyafute matendo yangu ya uaminifu[a] niliyoyatenda kwa ajili ya nyumba ya Mungu wangu na huduma zake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fadhili zangu” au “matendo yangu ya upendo mwaminifu.” Neno la Kiebrania linaweza kuonyesha fadhili, uaminifu, au upendo wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “wajibu wake” au “majukumu yake,” yaani mambo yaliyopaswa kutekelezwa kuhusiana na nyumba ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: unikumbuke
  rationale: Ombi hili la moja kwa moja kwa Mungu linaelezwa kwa Kiswahili cha kawaida kwa ‘unikumbuke’; kiambishi cha nafsi katika kitenzi kinawakilisha mtu anayepaswa kukumbukwa.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinahifadhiwa katika namna ya moja kwa moja ya sala.
- source_word: עַל זֹאת
  choice: kwa jambo hili
  rationale: Kirai hiki kinarejelea jambo lililotangulia na kinaweza kuwa na maana ya ‘kuhusu hili’ au ‘kwa sababu ya hili’; ‘kwa jambo hili’ kinahifadhi upana huo kwa Kiswahili cha kawaida.
- source_word: וְאַל תֶּמַח
  choice: wala usiyafute
  rationale: Kitenzi מחה hubeba picha ya kufuta au kuondoa katika kumbukumbu; ‘usiyafute’ kinahifadhi sitiari hiyo kwa ufupi.
- source_word: חֲסָדַי
  choice: matendo yangu ya uaminifu
  rationale: Katika muktadha huu wingi wa חֶסֶד unaelekea kwenye matendo yanayoonyesha uaminifu, fadhili, au upendo mwaminifu. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi upana wa neno hilo.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: niliyoyatenda
  rationale: Kishazi rejeshi kinayahusisha moja kwa moja matendo yaliyotajwa na yale ambayo Nehemia mwenyewe alitenda.
- source_word: בְּבֵית אֱלֹהַי
  choice: kwa ajili ya nyumba ya Mungu wangu
  rationale: Ingawa בְ inaweza kumaanisha ‘katika,’ hapa inaeleza matendo yaliyofanywa kwa manufaa ya nyumba ya Mungu au kuhusiana nayo; ‘kwa ajili ya’ ni wazi na ya asili katika muktadha huu.
- source_word: וּבְמִשְׁמָרָיו
  choice: na huduma zake
  rationale: מִשְׁמָר inaweza kumaanisha huduma, wajibu, jukumu, au jambo lililowekwa chini ya uangalizi. ‘Huduma zake’ inafaa muktadha wa nyumba ya Mungu bila kubana maana kuwa ibada pekee.
theological_decisions:
- issue: Maana ya חֲסָדַי katika sala ya nafsi ya kwanza
  choice: matendo yangu ya uaminifu
  alternative: fadhili zangu; matendo yangu ya upendo mwaminifu
  rationale: Tafsiri inaonyesha kuwa Nehemia anarejelea matendo yake ya uaminifu kuhusiana na nyumba ya Mungu, bila kugeuza mstari kuwa dai lililo wazi la kupata wokovu kwa matendo. Upana wa חֶסֶד umeonyeshwa katika tanbihi.
- issue: Sauti inayoweza kueleweka kama madai ya kustahili thawabu
  choice: Ombi la moja kwa moja la Nehemia likumbukwe bila kulainishwa
  alternative: Kulifafanua kwa maneno yanayopunguza kujirejelea kwa Nehemia
  rationale: Kiebrania kinamhusisha Nehemia moja kwa moja akiomba Mungu amkumbuke na asiyafute matendo yake; mvutano huo wa kiteolojia unapaswa kubaki badala ya kutatuliwa kwa ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; sitiari ya kufuta imehifadhiwa, na tanbihi zinaeleza maneno ya Kiebrania yenye upana wa maana.
