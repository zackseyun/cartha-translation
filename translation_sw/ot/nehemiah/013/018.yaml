base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: sw
  text: Je, baba zenu hawakufanya vivyo hivyo, hata Mungu wetu akaleta maafa haya yote juu yetu na juu ya mji huu? Lakini ninyi mnaongeza ghadhabu dhidi ya Israeli kwa kuinajisi Sabato.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא כֹה עָשׂוּ
  choice: Je, ... hawakufanya vivyo hivyo
  rationale: Muundo huu ni swali la balagha linalotarajia jibu la kukubali; “vivyo hivyo” hurejelea tendo la kuvunja Sabato lililotangulia.
- source_word: אֲבֹתֵיכֶם
  choice: baba zenu
  rationale: Hudumisha neno la ukoo la kiume lililo katika Kiebrania; katika muktadha linamaanisha vizazi vyao vilivyotangulia.
- source_word: וַיָּבֵא אֱלֹהֵינוּ
  choice: hata Mungu wetu akaleta
  rationale: Hifili ya בוא ina maana ya kusababisha jambo lije, yaani kulileta; “hata” huonyesha matokeo katika mwendelezo wa swali.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: maafa haya yote
  rationale: Katika muktadha wa hukumu ya Mungu, רָעָה humaanisha maafa au msiba, si kwamba Mungu alitenda uovu wa kimaadili.
- source_word: וְאַתֶּם מוֹסִיפִים
  choice: Lakini ninyi mnaongeza
  rationale: Kiunganishi kina nguvu ya ukinzani hapa, na hali ya kushiriki inaonyesha tendo linaloendelea.
- source_word: חָרוֹן
  choice: ghadhabu
  rationale: Neno hili huonyesha hasira kali ya hukumu; “ghadhabu” ni la heshima na lenye uzito wa kutosha katika Kiswahili cha Biblia.
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: kwa kuinajisi Sabato
  rationale: חלל katika kausativi humaanisha kulifanya jambo takatifu kuwa najisi au kulivunjia utakatifu; “kuinajisi” hudumisha dhana hiyo.
theological_decisions:
- issue: Maana ya רָעָה kama jambo ambalo Mungu alileta
  choice: maafa
  alternative: uovu
  rationale: Muktadha unazungumzia hukumu ya kihistoria iliyowapata watu na mji. “Maafa” huonyesha athari ya hukumu bila kudokeza kwamba Mungu alitenda uovu wa kimaadili.
- issue: Uzito wa חָרוֹן katika hukumu dhidi ya Israeli
  choice: ghadhabu
  alternative: hasira kali
  rationale: “Ghadhabu” huhifadhi uzito wa hasira ya hukumu ya Mungu bila kuipunguza kuwa hisia ya kawaida.
- issue: Kisababishi katika לְחַלֵּל אֶת הַשַּׁבָּת
  choice: kwa kuinajisi Sabato
  alternative: kwa kuivunja Sabato
  rationale: Chanzo kinasisitiza kuvunjia Sabato utakatifu, si kuvunja amri kwa ujumla tu; “kuinajisi” huhifadhi mvutano huo wa kiibada na kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi swali la balagha, uwajibikaji wa vizazi, na lugha ya moja kwa moja ya hukumu ya Mungu bila kuingiza ufafanuzi wa kimadhehebu.
