base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: sw
  text: Basi nikawakemea wakuu wa Yuda na kuwaambia, “Ni jambo gani hili ovu mnalofanya, huku mkiinajisi siku ya Sabato[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkiikiuka siku ya Sabato” au “mkiivunjia siku ya Sabato utakatifu.” Kitenzi cha Kiebrania kina maana ya kukitendea kilicho kitakatifu kana kwamba ni cha kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: nikawakabili
  rationale: Kitenzi ריב hapa kinaonyesha upinzani mkali, hoja, au karipio. “Nikawakabili” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi uzito huo bila kudokeza lazima kesi rasmi au ugomvi wa maneno.
- source_word: חֹרֵי יְהוּדָה
  choice: wakuu wa Yuda
  rationale: חֹרִים ni watu mashuhuri au wenye mamlaka katika jamii. “Wakuu” ni neno la asili katika Kiswahili linalofaa kwa viongozi hawa, bila kuwalazimisha kuwa maafisa wa cheo maalumu.
- source_word: וָאֹמְרָה לָהֶם
  choice: na kuwaambia
  rationale: Huu ni mwendelezo wa moja kwa moja wa simulizi; kiambishi cha nafsi katika “kuwaambia” kinaweka wazi kwamba Nehemia ndiye anayesema nao.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: Ni jambo gani hili ovu
  rationale: דבר hapa ni “jambo,” na רָע ina hukumu ya kimaadili. “Ovu” huhifadhi uzito wa shutuma kuliko “baya” peke yake.
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: mnalofanya
  rationale: Umbo la wakati wa sasa linaonyesha tendo linaloendelea na kuunganika kiasili na “jambo.”
- source_word: וּמְחַלְּלִים
  choice: huku mkiinajisi
  rationale: חלל katika kausativi humaanisha kukifanya kilicho kitakatifu kuwa cha kawaida au kukivunjia utakatifu. “Kuinajisi” huhifadhi uzito wa kidini wa tendo hilo; “huku” huonyesha kwamba kunajisiwa kwa Sabato ndiko kunakofafanua jambo ovu walilokuwa wakifanya.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: siku ya Sabato
  rationale: Tafsiri hii huhifadhi yote mawili, יוֹם na שַׁבָּת, kwa usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Lugha ya kukiuka utakatifu wa Sabato
  choice: mkiinajisi siku ya Sabato
  alternative: mkiikiuka siku ya Sabato
  rationale: Kitenzi cha Kiebrania hakionyeshi kuvunja amri tu, bali kukitendea kilicho kitakatifu kana kwamba ni cha kawaida. “Kuinajisi” huhifadhi uzito huu wa utakatifu wa Sabato bila kuongeza fundisho la dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nikawakabili” huepuka “nikagombana,” ambalo linaweza kusikika la mazungumzo mno, na “wakuu” linaeleweka kwa wasomaji wa kawaida kuliko istilahi ya kitabaka kama “maheshimiwa.” Alama ya tanbihi imewekwa baada ya kirai inacholifafanua.
