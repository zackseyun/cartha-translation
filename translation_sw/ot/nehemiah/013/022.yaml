  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: sw
  text: Niliwaambia Walawi wajitakase, kisha waje kulinda malango ili kuitakasa siku ya Sabato. Ee Mungu wangu, unikumbuke pia kwa jambo hili[a], na unihurumie kwa kadiri ya wingi wa upendo wako thabiti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ulikumbuke jambo hili pia kwa faida yangu.” Nahau ya Kiebrania inaweza kuelekeza ukumbusho kwa Nehemia mwenyewe au kwa tendo alilolitaja.
    reason: lexical_alternative
  - marker: b
    text: “Upendo thabiti” hutafsiri neno la Kiebrania hesed, ambalo mara nyingi huonyesha upendo mwaminifu wa Mungu, fadhili, na rehema zake za kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: Niliwaambia Walawi
  rationale: Kitenzi אמר hapa kinaeleza agizo la Nehemia kwa Walawi. ‘Niliwaambia’ ni Kiswahili cha kawaida na hakiongezi nguvu ya ‘niliwaamuru’ isiyosemwa wazi na kitenzi chenyewe.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: wajitakase
  rationale: Muundo wenye kitenzi cha hali pamoja na participle unaonyesha tendo lililotarajiwa; Hitpael ya טהר ina maana ya kujitakasa.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: kisha waje kulinda malango
  rationale: Tafsiri hii huhifadhi mfuatano wa kuja na kulinda, huku ‘kisha’ ikiufanya mtiririko uwe wa kawaida katika Kiswahili bila kubadili maana.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: ili kuitakasa siku ya Sabato
  rationale: קדשׁ humaanisha kutenga kuwa takatifu. ‘Kuitakasa’ huhifadhi maana hiyo na kusudi la kulinda malango.
- source_word: זָכְרָה לִּי
  choice: unikumbuke pia kwa jambo hili
  rationale: Nahau hii ni ombi Mungu amkumbuke Nehemia kwa wema kutokana na tendo hilo. Kiswahili hiki ni cha kawaida, huku tanbihi ikihifadhi uwezekano wa kuhusisha ukumbusho moja kwa moja na tendo.
- source_word: וְחוּסָה עָלַי
  choice: na unihurumie
  rationale: חוס inaweza kumaanisha kusaza, kuonea huruma, au kuwa na rehema. Katika sala hii ‘unihurumie’ huwasilisha ombi la huruma kwa lugha ya sasa na yenye heshima.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: kwa kadiri ya wingi wa upendo wako thabiti
  rationale: רב huonyesha wingi, na חסד hujumuisha upendo mwaminifu, rehema, na uaminifu wa kudumu. ‘Upendo wako thabiti’ huhifadhi uzito huu bila kuufupisha kuwa hisia pekee.
theological_decisions:
- issue: Maana ya חסד katika ombi la huruma
  choice: upendo wako thabiti
  alternative: fadhili zako; rehema zako; upendo wako wa agano
  rationale: Neno hili linaunganisha upendo, uaminifu, na rehema za Mungu. Chaguo hili ni pana na halilazimishi neno ‘agano’ ambalo halimo wazi katika mstari.
- issue: Mhusika wa nahau זָכְרָה לִּי
  choice: unikumbuke pia kwa jambo hili
  alternative: ulikumbuke jambo hili pia kwa faida yangu
  rationale: Kiebrania kinaweza kueleweka kama ombi Mungu amkumbuke Nehemia kwa tendo hilo au alikumbuke tendo hilo kwa manufaa yake. Tafsiri kuu ni ya kawaida katika Kiswahili, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, huku istilahi za Sabato, utakaso, huruma, na upendo thabiti zikihifadhi uzito wa matini ya Kiebrania.
