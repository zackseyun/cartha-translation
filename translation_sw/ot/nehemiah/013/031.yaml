base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: sw
  text: Na kwa ajili ya sadaka ya kuni kwa nyakati zilizowekwa[a], na kwa ajili ya malimbuko—unikumbuke, Mungu wangu, kwa mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utoaji wa kuni.” Kiebrania kinarejelea ugavi wa kuni uliopangwa kwa matumizi ya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻרְבַּן
  choice: sadaka
  rationale: Neno hili humaanisha kitu kinacholetwa mbele ya Mungu kama sadaka; “sadaka” ni neno la kawaida na linalofaa katika muktadha wa ibada.
- source_word: הָעֵצִים
  choice: kuni
  rationale: Katika muktadha huu ni kuni zilizotolewa kwa matumizi ya hekalu, hasa madhabahuni; “kuni” ni wazi zaidi kuliko “mbao.”
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: kwa nyakati zilizowekwa
  rationale: Kauli hii inaonyesha nyakati maalumu zilizopangwa rasmi, bila kufafanua ratiba zaidi ya ilivyo katika Kiebrania.
- source_word: בִּכּוּרִים
  choice: malimbuko
  rationale: “Malimbuko” ni istilahi ya Kiswahili inayotambulika kwa mazao ya kwanza yanayotolewa kwa Mungu.
- source_word: זָכְרָה לִּי
  choice: unikumbuke
  rationale: Hii inadumisha ombi la moja kwa moja la Nehemia kwa Mungu na mtindo wa sala unaojirudia katika kitabu.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Huhifadhi umilikishi na namna ya moja kwa moja ya kumwambia Mungu.
- source_word: לְטוֹבָה
  choice: kwa mema
  rationale: Huhifadhi ufupi na upana wa usemi wa Kiebrania bila kuamua kama maana hasa ni kibali, baraka, au manufaa.
theological_decisions:
- issue: Kirai cha kiibada קֻרְבַּן הָעֵצִים
  choice: sadaka ya kuni
  alternative: utoaji wa kuni
  rationale: Tafsiri hii inadumisha dhana ya sadaka na wakati huohuo inaonyesha kuwa ni kuni kwa matumizi ya hekalu, si zawadi ya kawaida ya mbao.
- issue: Ombi la mwisho לְטוֹבָה
  choice: kwa mema
  alternative: kwa kibali / kwa faida yangu
  rationale: “Kwa mema” hudumisha kutokubainishwa kwa Kiebrania kuhusu kama Nehemia anaomba kibali, baraka, au matokeo yenye manufaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sala umehifadhiwa kwa ufupi; “malimbuko” ni istilahi ya kibiblia inayotambulika, na “kuni” ni ya kawaida na sahihi katika muktadha huu.
