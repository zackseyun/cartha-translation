source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: sw
  text: Siku hiyo, Kitabu cha Musa[a] kilisomwa watu wakisikia, na ikakutwa imeandikwa humo kwamba Mwamoni wala Mmoabu asiingie kamwe[c] katika kusanyiko la Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hati-kunjo ya Musa.” Neno la Kiebrania linaweza kumaanisha hati-kunjo au kitabu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mkutano wa Mungu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, “milele” au “kwa wakati wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Hutaja siku maalumu inayozungumziwa na ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: נִקְרָא
  choice: kilisomwa
  rationale: Kauli ya kutendwa inadumisha muundo wa Kiebrania; muktadha wa watu kusikia unaonyesha kuwa usomaji ulikuwa wa hadharani.
- source_word: בְּסֵפֶר מֹשֶׁה
  choice: Kitabu cha Musa
  rationale: סֵפֶר inaweza kuwa kitabu au hati-kunjo; “Kitabu cha Musa” ni wazi na haisisitizi umbo la kifaa kuliko chanzo.
- source_word: בְּאָזְנֵי הָעָם
  choice: watu wakisikia
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania, kihalisi “masikioni mwa watu,” bila kuleta ukakasi.
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: na ikakutwa imeandikwa humo
  rationale: Inahifadhi wazo la kugundua maandishi yaliyokuwamo kitabuni na kadiri iwezekanavyo mtindo wa kutendwa wa chanzo.
- source_word: אֲשֶׁר לֹא יָבוֹא
  choice: kwamba ... asiingie
  rationale: Kauli tegemezi ya kukanusha inafaa kwa kuripoti katazo lililoandikwa.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: Mwamoni wala Mmoabu
  rationale: “Wala” huonyesha kwa kawaida kwamba katazo linamhusu kila mmoja wa makundi hayo mawili.
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: katika kusanyiko la Mungu
  rationale: “Kusanyiko” huonyesha jumuiya iliyokusanyika bila kuingiza istilahi ya baadaye inayoweza kumaanisha dhehebu au jengo.
- source_word: עַד עוֹלָם
  choice: kamwe
  rationale: Katika katazo, “kamwe” huwasilisha kwa Kiswahili cha asili nguvu ya kutoruhusiwa wakati wowote; tanbihi inataja maana ya kudumu iliyo katika Kiebrania.
theological_decisions:
- issue: Maana ya בִּקְהַל הָאֱלֹהִים
  choice: kusanyiko la Mungu
  alternative: mkutano wa Mungu; jumuiya ya Mungu
  rationale: Chaguo hili linadumisha uhusiano wa moja kwa moja na Mungu na wazo la jamii iliyokusanyika, bila kulifanya moja kwa moja kuwa kanisa kwa maana ya baadaye.
- issue: Nguvu ya עַד עוֹלָם katika kanuni ya kuwatenga
  choice: asiingie kamwe
  alternative: asiingie milele; asiingie hata wakati wowote
  rationale: “Kamwe” ni katazo la kudumu kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi wazi uwezekano wa kulitaja kama “milele” au “kwa wakati wote.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “watu wakisikia” unatoa maana ya nahau ya Kiebrania bila tafsiri gumu ya neno kwa neno; “kusanyiko” huepuka maana za kidhehebu.
