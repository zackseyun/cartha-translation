base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: sw
  text: Basi nikakabiliana na maofisa, nikasema, “Kwa nini nyumba ya Mungu imepuuzwa?[a]” Kisha nikawakusanya na nikawaweka mahali pao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imeachwa” au “imetelekezwa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuachwa au kutelekezwa; hapa muktadha unaonyesha kwamba huduma na mahitaji ya nyumba ya Mungu hayakuwa yakitunzwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwasimamisha mahali pao.” Usemi huu unahusu kuwarejesha katika mahali au majukumu yao yaliyowekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: nikakabiliana na
  rationale: Kitenzi ריב kinaonyesha kuingia katika mzozo au mabishano. ‘Nikakabiliana na’ kinahifadhi uzito wa upinzani bila kudai kwamba tendo hilo lilikuwa kukemea tu.
- source_word: הַסְּגָנִים
  choice: maofisa
  rationale: סְגָנִים ni viongozi wa ngazi ya chini au maafisa wa utawala. ‘Maofisa’ ni neno la sasa na linaloeleweka katika muktadha huu.
- source_word: וָאֹמְרָה
  choice: nikawauliza
  rationale: Kiebrania kinasema kihalisi ‘nikasema,’ lakini kinachofuata ni swali la moja kwa moja; ‘nikawauliza’ ni Kiswahili cha kawaida kinachohifadhi tendo la kusema kwao.
- source_word: נֶעֱזַב
  choice: imepuuzwa
  rationale: Hii ni kauli tendwa ya עזב, yenye maana ya kuachwa au kutelekezwa. Katika muktadha, huduma na mahitaji ya nyumba ya Mungu hayakudumishwa, hivyo ‘imepuuzwa’ huwasilisha maana inayolengwa huku uwezekano wa ‘imeachwa’ ukihifadhiwa katika tanbihi.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Tafsiri hii inafuata usemi wa Kiebrania kwa karibu na kuhifadhi uzito wake wa kidini bila kuufafanua moja kwa moja kuwa ‘hekalu.’
- source_word: וָאֶקְבְּצֵם
  choice: nikawakusanya
  rationale: קבץ humaanisha kukusanya au kuwaleta watu pamoja; ‘nikawakusanya’ ni ya moja kwa moja na ya kawaida.
- source_word: וָאַעֲמִדֵם עַל עָמְדָם
  choice: kuwaweka katika nafasi zao
  rationale: Usemi huu unaonyesha kuwarejesha watu katika nafasi au majukumu yao yaliyowekwa. Tafsiri hii ni ya asili katika Kiswahili na haiingizi maelezo yasiyosemwa wazi katika mstari.
theological_decisions:
- issue: Wanaorejelewa na kiwakilishi katika ‘nikawakusanya’
  choice: Kiwakilishi kimeachwa bila kutajwa jina, kama katika Kiebrania.
  alternative: Kuwataja wazi kuwa Walawi na wahudumu wa hekalu.
  rationale: Muktadha wa mstari uliotangulia unaelekeza kwa Walawi na waimbaji, lakini mstari huu wenyewe unasema tu ‘wao.’ Kutotaja jina kunahifadhi mshikamano na pia utata wa kisarufi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa sasa. ‘Maofisa’ limetumiwa badala ya istilahi za kale au za kiufundi zaidi; ‘nikakabiliana na’ linaonyesha mzozo kwa lugha yenye hadhi bila sauti ya ugomvi wa kawaida.
