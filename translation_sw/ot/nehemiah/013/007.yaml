  text: וָ/אָב֖וֹא לִֽ/ירוּשָׁלִָ֑ם וָ/אָבִ֣ינָ/ה בָ/רָעָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה אֶלְיָשִׁיב֙ לְ/ט֣וֹבִיָּ֔ה לַ/עֲשׂ֥וֹת ל/וֹ֙ נִשְׁכָּ֔ה בְּ/חַצְרֵ֖י בֵּ֥ית הָ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: sw
  text: Nilipofika Yerusalemu, nikatambua uovu ambao Eliashibu alikuwa amefanya kwa ajili ya Tobia, kwa kumtengenezea chumba[a] katika nyua za nyumba ya Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chumba cha ndani”; neno la Kiebrania linaweza kumaanisha chumba katika eneo la hekalu.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Mungu” hapa ni hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: Nilipofika Yerusalemu
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba kufika kwa Nehemia kulitangulia kutambua kwake, huku ukiendeleza mfuatano wa simulizi.
- source_word: וָאָבִינָה
  choice: nikatambua
  rationale: Kitenzi בין hapa kina maana ya kuelewa au kutambua. “Nikatambua” ni cha kawaida katika simulizi na kinahifadhi maana ya utambuzi wa Nehemia baada ya kufika.
- source_word: בָרָעָה
  choice: uovu
  rationale: Neno רָעָה hapa linatoa hukumu ya kimaadili kuhusu tendo hilo; “uovu” linahifadhi uzito huo bila kuupunguza kuwa kosa la kawaida tu.
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: ambao Eliashibu alikuwa amefanya kwa ajili ya Tobia
  rationale: Wakati uliotangulia unaonyesha kwamba tendo la Eliashibu lilikuwa limetokea kabla Nehemia hajalitambua. “Kwa ajili ya Tobia” linaonyesha kwamba Tobia ndiye aliyenufaika.
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: kwa kumtengenezea chumba
  rationale: Kirai hiki kinaeleza tendo lililokuwa uovu huo. “Chumba” ni neno la sasa na linaloeleweka, bila kukibainisha kupita kiasi kuwa ghala.
- source_word: בְּחַצְרֵי
  choice: katika nyua
  rationale: Wingi wa חָצֵר unarejelea nyua za eneo la hekalu; “nyua” ni tafsiri ya asili na ya kawaida katika Kiswahili.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii inadumisha tamathali halisi ya Kiebrania, huku muktadha ukionyesha kuwa ni hekalu.
theological_decisions:
- issue: Jinsi ya kueleza tathmini ya kimaadili ya tendo la Eliashibu
  choice: uovu
  alternative: kosa; jambo baya
  rationale: Kiebrania רָעָה kina uzito wa kimaadili katika muktadha huu. “Uovu” linahifadhi hukumu hiyo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Nilipofika … nikatambua” ni wa asili katika simulizi; majina yametoholewa kwa mazoea ya Kiswahili.
