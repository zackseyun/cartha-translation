  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: sw
  text: Basi nikawatakasa kutokana na kila kilicho kigeni, nikaweka zamu za huduma[a] kwa ajili ya makuhani na Walawi, kila mmoja katika kazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, zamu za ulinzi, vikundi vya huduma, au migawo ya huduma.
    reason: Neno מִשְׁמָרוֹת lina maana kadhaa zinazohusiana na zamu na mpangilio wa majukumu ya huduma.
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Basi nikawatakasa
  rationale: Kitenzi טהר katika piel humaanisha kutakasa au kusafisha. “Nikawatakasa” kinafaa katika muktadha wa marekebisho ya kiagano, huku “basi” kikionyesha mtiririko wa matokeo kutoka matendo yaliyotangulia.
- source_word: מִכָּל נֵכָר
  choice: kutokana na kila kilicho kigeni
  rationale: נֵכָר hurejelea kilicho kigeni au kisicho cha kwao. Kauli hii inadumisha upana wa Kiebrania bila kuibana maana iwe watu wa kigeni pekee.
- source_word: וָאַעֲמִידָה
  choice: nikaweka
  rationale: Hiphil ya עמד hapa ina maana ya kiutawala ya kuweka au kupanga jambo liwe mahali pake. “Nikaweka” inaendana kwa kawaida na zamu za huduma.
- source_word: מִשְׁמָרוֹת
  choice: zamu za huduma
  rationale: Neno hili linaweza kumaanisha zamu, ulinzi, vikundi vya huduma, au majukumu yaliyopangwa. “Zamu za huduma” linaeleza mpangilio wa kazi za kikuhani na Kilawi huku likidumisha wazo la huduma kwa zamu.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: kwa ajili ya makuhani na Walawi
  rationale: Makundi yote mawili yametajwa wazi kama katika Kiebrania; muundo huu unaonyesha kwamba zamu hizo ziliwekwa kwa ajili yao.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: אִישׁ limetumiwa kwa maana ya kugawanya, yaani kila mtu katika makundi yaliyotajwa. “Kila mmoja” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: בִּמְלַאכְתּוֹ
  choice: katika kazi yake
  rationale: מְלָאכָה linaweza kumaanisha kazi, jukumu, au huduma. Tafsiri hii ni ya karibu na maandishi na inaonyesha eneo la kazi alilopangiwa kila mmoja.
theological_decisions:
- issue: Wigo wa kiwakilishi “wa-” katika “nikawatakasa” na wa “kila kilicho kigeni”
  choice: Kuwaeleza waliokuwa wakitakaswa kutokana na kila jambo au athari ya kigeni bila kuibana maana kuwa ya kabila pekee
  alternative: Nikawatakasa kutokana na wageni wote
  rationale: Kiebrania hakisemi wazi kwamba נֵכָר hapa ni watu pekee. Ingawa muktadha unahusu ndoa za mchanganyiko na kuvunjwa kwa uaminifu wa agano, tafsiri haipaswi kuongeza ufafanuzi mwembamba kuliko maandishi.
- issue: Maana ya kugawanya ya אִישׁ
  choice: kila mmoja katika kazi yake
  alternative: kila mwanamume katika kazi yake
  rationale: Katika sentensi hii אִישׁ halisisitizi jinsia ya mtu bali linagawa wajibu kwa kila mshiriki wa makundi ya makuhani na Walawi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo unabaki karibu na Kiebrania lakini una mtiririko wa kawaida wa Kiswahili.
