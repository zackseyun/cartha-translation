  text: וָ/אוֹצְרָ֣/ה עַל א֠וֹצָרוֹת שֶׁלֶמְיָ֨ה הַ/כֹּהֵ֜ן וְ/צָד֣וֹק הַ/סּוֹפֵ֗ר וּ/פְדָיָה֙ מִן הַ/לְוִיִּ֔ם וְ/עַל יָדָ֔/ם חָנָ֥ן בֶּן זַכּ֖וּר בֶּן מַתַּנְיָ֑ה כִּ֤י נֶאֱמָנִים֙ נֶחְשָׁ֔בוּ וַ/עֲלֵי/הֶ֖ם לַ/חֲלֹ֥ק לַ/אֲחֵי/הֶֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: sw
  text: 'Niliwaweka wasimamie vyumba vya hazina: Shelemia, kuhani; Sadoki, mwandishi; Pedaya, mmoja wa Walawi; na Hanan mwana wa Zakuri, mwana wa Matania, pamoja nao.[a] Kwa maana walihesabiwa kuwa waaminifu,[b] na jukumu lao lilikuwa kuwagawia ndugu zao.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya uongozi wao.” Nahau ya Kiebrania inaweza kuonyesha ushirika wa karibu au huduma iliyo chini ya mamlaka yao.
    reason: lexical_alternative
  - marker: b
    text: Au, “walionwa kuwa watu wa kutegemewa.”
    reason: lexical_alternative
  - marker: c
    text: “Ndugu” hapa ni tafsiri ya neno la Kiebrania lenye umbo la kiume; katika muktadha huu linawahusu wenzao katika jumuiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹצְרָה עַל אֹצָרוֹת
  choice: Niliwaweka kusimamia vyumba vya hazina
  rationale: Kitenzi kinaonyesha kuwateua watu wawe na mamlaka au wajibu juu ya hazina. Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha wazi kazi yao ya usimamizi; “vyumba vya hazina” inafaa muktadha wa mahali pa kuhifadhi zaka na mahitaji.
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: Shelemia kuhani
  rationale: Jina limetoholewa kwa namna ya kawaida ya Kiswahili, na cheo הַכֹּהֵן kimetafsiriwa moja kwa moja.
- source_word: צָדוֹק הַסֹּפֵר
  choice: Sadoki mwandishi
  rationale: סֹפֵר inaweza kumaanisha mwandishi au afisa katibu. “Mwandishi” huhifadhi upana wa cheo bila kubainisha zaidi ya maandishi ya Kiebrania.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: na Pedaya, mmoja wa Walawi
  rationale: Kiebrania kinasema kihalisi “kutoka kwa Walawi.” Kiswahili cha kawaida huonyesha uanachama huo kwa “mmoja wa Walawi.”
- source_word: וְעַל יָדָם
  choice: awe pamoja nao
  rationale: Nahau hii inaweza kuonyesha kuwa kando yao, akishirikiana nao, au chini ya uongozi wao. “Pamoja nao” huhifadhi wazo la ushirika wa karibu bila kulazimisha daraja la mamlaka.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: Kwa maana walihesabiwa kuwa waaminifu
  rationale: נֶאֱמָנִים inaonyesha uaminifu au kutegemeka, huku נֶחְשָׁבוּ ikionyesha tathmini kwamba walionwa hivyo. “Walihesabiwa kuwa waaminifu” huhifadhi vipengele vyote viwili.
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: nao walikuwa na jukumu la kuwagawia
  rationale: וַעֲלֵיהֶם inaweka wajibu juu yao, na לַחֲלֹק katika muktadha huu ni kugawa mafungu ya mahitaji. Kauli hii ni ya asili na wazi katika Kiswahili.
- source_word: לַאֲחֵיהֶם
  choice: ndugu zao
  rationale: Neno la Kiebrania ni la kiume kwa umbo na kihalisi humaanisha “ndugu zao.” Tafsiri haifungi maana kwa Walawi peke yao, kwa kuwa mstari wenyewe haubainishi hivyo.
theological_decisions:
- issue: Kiwakilishi cha kundi katika לַאֲחֵיהֶם
  choice: ndugu zao
  alternative: wenzao / Waisraeli wenzao
  rationale: “Ndugu zao” hudumisha taswira ya undugu iliyopo katika Kiebrania na haiongezi utambulisho maalumu ambao mstari hauutaji wazi.
- issue: Uhusiano wa Hanani na wasimamizi wengine katika וְעַל יָדָם
  choice: awe pamoja nao
  alternative: awe chini ya uongozi wao
  rationale: Nahau ya Kiebrania inaweza kumaanisha ushirika wa karibu au huduma iliyo chini ya mamlaka. Tafsiri kuu haichagui kwa lazima upande mmoja wa uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sentensi umefanywa wa kawaida kwa Kiswahili huku ukihifadhi mfuatano wa uteuzi, sababu ya uteuzi, na wajibu wa kugawa mahitaji. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na vifungu vinavyohusika.
