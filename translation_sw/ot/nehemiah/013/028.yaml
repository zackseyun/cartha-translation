  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: sw
  text: Na mmoja wa wana wa Yoyada, mwana wa Eliashibu, kuhani mkuu, alikuwa mkwe wa Sanbalati Mhoroni[a]; basi nikamfukuza mbali nami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana pana zaidi, “alikuwa na uhusiano wa ndoa na Sanbalati.” Neno la Kiebrania huweza kumaanisha uhusiano wa ndoa; katika muktadha huu “mkwe” ndilo tafsiri la kawaida zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “nikamkimbiza mbali” au “nikamwondoa.” Kitenzi cha Kiebrania kinakazia kuondolewa kwa nguvu, lakini hakitaji aina hususa ya hatua rasmi iliyochukuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Na mmoja wa wana wa
  rationale: 'Muundo huu una maana ya sehemu ya kundi: mmoja miongoni mwa wana; tafsiri hii ni ya asili katika Kiswahili.'
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa majina ya Biblia katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: mwana wa Eliashibu
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja ili kudumisha uwazi.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa cheo cha kuhani wa juu kabisa katika Israeli.
- source_word: חָתָן לְסַנְבַלַּט
  choice: alikuwa mkwe wa Sanbalati
  rationale: Neno חָתָן linaonyesha uhusiano wa ndoa. 'Mkwe' ni la kawaida na lenye hadhi, lakini linaweza kuwa pana katika Kiswahili; tanbihi inabainisha maana mahususi inayowezekana hapa.
- source_word: הַחֹרֹנִי
  choice: Mhoroni
  rationale: Kiashiria cha asili au mahali kimetoholewa katika umbo la kawaida la Kiswahili.
- source_word: וָאַבְרִיחֵהוּ
  choice: basi nikamfukuza
  rationale: Hifili ya ברח inaonyesha kumsababisha mtu akimbie au aondoke kwa nguvu; 'kumfukuza' huhifadhi uzito huo bila kudai hatua rasmi ya kisheria.
- source_word: מֵעָלָי
  choice: kutoka kwangu
  rationale: Nahau hii inaonyesha kuondolewa mbele ya Nehemia au katika eneo lake la mamlaka; 'kutoka kwangu' huihifadhi kwa ufupi.
