reference: Nehemiah 13:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: sw
  text: Malango ya Yerusalemu yalipoanza kufunikwa na giza[a] kabla ya Sabato, niliamuru milango ya malango hayo ifungwe, na nikaagiza isifunguliwe mpaka Sabato ilipokwisha. Niliwaweka baadhi ya watumishi wangu[b] kwenye malango ili mzigo wowote[c] usiletwe ndani siku ya Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vivuli vya jioni vilipoanza kuangukia malango ya Yerusalemu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “baadhi ya wahudumu wangu.” Neno hili linaweza kumaanisha watu wa msafara binafsi wa Nehemia.
    reason: lexical_alternative
  - marker: c
    text: Huenda mzigo huu ulihusisha bidhaa zilizoletwa kwa ajili ya biashara, kwa kuwa muktadha unaozunguka mstari huu unahusu biashara ya Sabato.
    reason: cultural_note
lexical_decisions:
- source_word: צָלֲלוּ
  choice: yalipoanza kutiwa giza
  rationale: Kitenzi kinaonyesha malango kuingia gizani au kufunikwa na vivuli jioni. Usemi huu unaeleweka kwa Kiswahili na unahifadhi taswira ya malango bila kuamua kabisa ikiwa ni giza au vivuli vinavyotajwa.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: malango ya Yerusalemu
  rationale: Huu ni uhamisho wa moja kwa moja na wa kawaida wa muundo wa Kiebrania.
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: kabla ya Sabato
  rationale: Kirai kinaonyesha wakati mfupi kabla ya kuanza kwa Sabato.
- source_word: וָאֹמְרָה
  choice: niliamuru / nikaagiza
  rationale: Ingawa maana ya msingi ni ‘nilisema,’ katika muktadha huu kauli za Nehemia ni maagizo ya kiutawala. Vitenzi hivi vinafikisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: milango yake ifungwe
  rationale: Neno דְּלָתוֹת linarejelea milango inayofunga malango ya jiji; ‘yake’ inaonyesha uhusiano huo na kuepuka usemi mzito.
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  choice: isifunguliwe
  rationale: Kauli tendwa inadumisha mkazo juu ya milango na haiongezi mtendaji ambaye hajatajwa.
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: mpaka Sabato ilipokwisha
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba milango ingebaki imefungwa hadi baada ya Sabato.
- source_word: וּמִנְּעָרַי
  choice: baadhi ya watumishi wangu
  rationale: Katika mazingira ya msafara wa gavana, נְעָרִים inaweza kumaanisha watumishi au wahudumu, si lazima vijana kwa umri.
- source_word: הֶעֱמַדְתִּי
  choice: niliwaweka
  rationale: Katika muktadha huu maana ni kuwaweka watu mahali maalumu kwa zamu au ulinzi.
- source_word: עַל הַשְּׁעָרִים
  choice: kwenye malango
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza mahali walipopangiwa.
- source_word: לֹא יָבֹא מַשָּׂא
  choice: ili mzigo wowote usiletwe ndani
  rationale: Kitenzi cha kuingia pamoja na muktadha wa malango kinaonyesha mzigo kuingizwa mjini. Kauli tendwa haibadili mhusika kuwa bidhaa tu.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: siku ya Sabato
  rationale: Inahifadhi kutajwa wazi kwa ‘siku’ katika Kiebrania na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya שַׁבָּת
  choice: Sabato
  alternative: siku ya pumziko
  rationale: Neno hili linataja hasa Sabato ya kila juma katika sheria na desturi ya Israeli, si siku yoyote tu ya kupumzika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimewekwa wazi kwa wasomaji wa kawaida huku taswira ya jioni, nguvu ya maagizo ya Nehemia, na upana wa neno ‘mzigo’ vikihifadhiwa.
