base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: sw
  text: kwa sababu hawakuwalaki wana wa Israeli kwa mkate na maji, na alimwajiri Balaamu dhidi yake ili amlaani[a], lakini Mungu wetu aligeuza laana hiyo kuwa baraka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kitenzi cha umoja, “alimwajiri,” pamoja na viwakilishi vya umoja, “dhidi yake ili amlaani.” Hapa Israeli hutazamwa kama jumuiya moja.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: קִדְּמוּ
  choice: hawakuwalaki
  rationale: Katika muktadha huu kitenzi קדמ kina maana ya kwenda kuwapokea wanaowasili; “kuwalaki” huhifadhi tendo hilo la wazi bila kulipanua kuwa kuwapatia mahitaji.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa Kiebrania wa uhusiano wa kifamilia kwa lugha ya Kiswahili yenye hadhi na inayoeleweka.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: kwa mkate na maji
  rationale: Hutaja mahitaji yale yale mahsusi yaliyomo katika Kiebrania na kuhifadhi mwangwi wa Kumbukumbu la Torati 23:4.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת בִּלְעָם
  choice: walimwajiri Balaamu dhidi yake
  rationale: Kitenzi cha Kiebrania ni umoja, lakini mtendaji wake hajasemwi wazi na kauli yote inarejelea makundi yaliyotajwa katika mstari uliotangulia. Kiswahili hutumia wingi unaoeleweka kimuktadha bila kumwingiza Balaki kwa jina; kiwakilishi cha umoja “yake” huhifadhi Israeli kama jumuiya moja.
- source_word: לְקַלְלוֹ
  choice: ili amlaani
  rationale: Kiambishi cha Kiebrania ni cha umoja na humchukulia Israeli kama jumuiya moja; Kiswahili kinaweza kuhifadhi umoja huo kwa kawaida.
- source_word: וַיַּהֲפֹךְ
  choice: aligeuza
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mabadiliko kutoka laana kuwa baraka.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Huhifadhi wazi kiambishi-milikishi cha nafsi ya kwanza wingi.
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: laana hiyo kuwa baraka
  rationale: Hutoa kwa Kiswahili cha kawaida muundo wa Kiebrania unaoonyesha kugeuzwa kwa kitu kimoja kuwa kingine.
theological_decisions:
- issue: Jina la agano lenye umbo la kifamilia
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Kiebrania kinasema kihalisi “wana wa Israeli.” Kiswahili kinaweza kuhifadhi umbo hilo bila kuwa kizito au kisichoeleweka.
- issue: Israeli kama jumuiya ya umoja katika kishazi cha laana
  choice: dhidi yake ili amlaani
  alternative: dhidi yao ili awalaani
  rationale: Viambishi vya Kiebrania ni vya umoja na vinamtazama Israeli kama jumuiya moja. Kwa kuwa muundo huo ni wa kawaida na unaeleweka katika Kiswahili, umehifadhiwa badala ya kuugeuza kuwa wingi.
- issue: Mtendaji wa kitendo cha kumwajiri Balaamu
  choice: walimwajiri
  alternative: alimwajiri
  rationale: Kitenzi cha Kiebrania ni umoja, huenda kikimdokeza Balaki kutokana na simulizi la awali, lakini mstari huu haumtajii wazi. Wingi wa Kiswahili huunganisha kitendo na Waamoni na Wamoabu waliotajwa kimuktadha bila kulazimisha utambulisho usiosemwa katika mstari huu; tanbihi inaweka wazi umbo la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuwalaki” ni neno fasaha linalofaa kwa tendo la kwenda kuwapokea wageni; sentensi imehifadhi istilahi mahsusi “mkate na maji” na umoja wa kijumuiya wa Israeli.
