base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: sw
  text: Siku hizo niliona katika Yuda watu wakikanyaga mashinikizo ya divai siku ya Sabato, wakileta marundo ya nafaka na kuyapakia juu ya punda, pamoja na divai, zabibu, tini, na kila aina ya mizigo, na kuvileta Yerusalemu siku ya Sabato. Nami nikawaonya siku walipouza chakula.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: wakikanyaga zabibu katika mashinikizo
  rationale: Kirai cha Kiebrania kwa kawaida humaanisha kukanyaga mashinikizo ya divai; kutaja zabibu kwa uwazi kunafanya tendo lieleweke katika Kiswahili bila kubadili maana.
- source_word: הָעֲרֵמוֹת
  choice: marundo ya nafaka
  rationale: Neno lenyewe ni 'marundo'; muktadha wa shughuli za mavuno na upakiaji unaunga mkono nafaka, kama ilivyo katika safu ya mashahidi wa tafsiri.
- source_word: וָאָעִיד
  choice: nikawaonya
  rationale: Hifil ya עוּד hapa ina maana ya kutoa onyo au ushuhuda mzito dhidi ya tendo hilo; 'nikawaonya' ni ya kawaida na yenye uzito unaofaa.
- source_word: צָיִד
  choice: vyakula
  rationale: Neno linaweza kumaanisha chakula au mahitaji ya chakula; katika muktadha wa kuuza mazao, 'vyakula' ni tafsiri pana na ya asili.
theological_decisions:
- issue: Uzito wa katazo la Sabato
  choice: Kueleza matendo na onyo la Nehemia bila kuongeza hukumu ya kiteolojia isiyotajwa moja kwa moja katika mstari
  alternative: Kuongeza kwamba walikuwa 'wakinajisi' au 'wakivunja' Sabato
  rationale: Chanzo kinataja kazi, usafirishaji, uuzaji na onyo; tafsiri inahifadhi nguvu hiyo bila kuingiza istilahi ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa ili kuepuka msururu mzito huku urudiaji wa 'siku ya Sabato' ukihifadhiwa kwa msisitizo wa chanzo.
