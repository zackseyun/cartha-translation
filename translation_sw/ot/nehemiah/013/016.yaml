translation:
  language: sw
  text: Pia watu wa Tiro waliishi humo, wakileta samaki na kila aina ya bidhaa, na kuwauzia wana wa Yuda siku ya Sabato, huko Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: Pia Watiro
  rationale: Nomino hii inawataja watu wa Tiro; “pia” inaendeleza orodha ya ukiukaji wa Sabato katika muktadha.
- source_word: יָשְׁבוּ בָהּ
  choice: waliishi humo
  rationale: Kitenzi ישׁב hapa kina maana ya kukaa au kuishi, na kiambishi cha kike kinarejelea jiji la Yerusalemu.
- source_word: מְבִיאִים
  choice: walileta
  rationale: Hiphil ya בוא inaonyesha kuingiza bidhaa jijini; muundo huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: דָּאג
  choice: samaki
  rationale: Nomino hii humaanisha samaki katika muktadha wa biashara.
- source_word: וְכָל מֶכֶר
  choice: na kila aina ya bidhaa
  rationale: מֶכֶר ni bidhaa au vitu vya kuuzwa; usemi huu unawasilisha maana ya jumla kwa Kiswahili cha sasa.
- source_word: וּמֹכְרִים
  choice: na kuwauzia
  rationale: Hali ya kuendelea ya participle imeunganishwa kwa kawaida na tendo la kuleta; kiambishi “-wa-” kinawataja wana wa Yuda kama wanunuzi.
- source_word: בַּשַּׁבָּת
  choice: siku ya Sabato
  rationale: Huhifadhi wakati maalumu wa biashara uliokatazwa huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: לִבְנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania “wana wa Yuda,” ambao katika muktadha unamaanisha watu wa Yuda.
- source_word: וּבִירוּשָׁלִָם
  choice: naam, humo Yerusalemu
  rationale: '“Naam” huwasilisha uwezekano wa msisitizo wa kishazi cha mwisho bila kuondoa wazo la mahali: biashara hiyo ilifanyika Yerusalemu penyewe.'
