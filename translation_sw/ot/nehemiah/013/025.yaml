source:
  edition: WLC
  text: וָ/אָרִ֤יב עִמָּ/ם֙ וָ/אֲקַֽלְלֵ֔/ם וָ/אַכֶּ֥ה מֵ/הֶ֛ם אֲנָשִׁ֖ים וָֽ/אֶמְרְטֵ֑/ם וָ/אַשְׁבִּיעֵ֣/ם בֵּֽ/אלֹהִ֗ים אִם תִּתְּנ֤וּ בְנֹֽתֵי/כֶם֙ לִ/בְנֵי/הֶ֔ם וְ/אִם תִּשְׂאוּ֙ מִ/בְּנֹ֣תֵי/הֶ֔ם לִ/בְנֵי/כֶ֖ם וְ/לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: sw
  text: 'Basi nikabishana nao, nikawalaani[a], nikawapiga baadhi ya wanaume, na nikawang''oa nywele. Kisha nikawaapisha kwa Mungu: “Msiwape binti zenu wana wao, wala msiwachukue binti zao kuwa wake, ama kwa wana wenu ama kwa ajili yenu wenyewe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikawatukana.”
    reason: קלל inaweza katika baadhi ya miktadha kumaanisha kutukana au kusema kwa dharau, ingawa ‘kuwalaani’ ndiyo maana inayofaa zaidi hapa.
lexical_decisions:
- source_word: וָאָרִיב עִמָּם
  choice: nikashindana nao
  rationale: Kitenzi ריב kinaonyesha mgogoro wa moja kwa moja, kushindana au kuwashtaki. ‘Nikashindana nao’ huhifadhi ukali wa makabiliano bila kukifanya kuwa kukemea kwa maneno tu.
- source_word: וָאֲקַלְלֵם
  choice: nikawalaani
  rationale: קלל hapa kwa kawaida humaanisha kutamka laana dhidi yao. ‘Nikawalaani’ ni tafsiri ya moja kwa moja; uwezekano wa maana ya kuwatukana umeonyeshwa katika tanbihi.
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: nikawapiga baadhi ya wanaume
  rationale: Muundo wenye מִן unaonyesha sehemu ya kundi, yaani baadhi ya wanaume miongoni mwao. ‘Nikawapiga’ huonyesha tendo la kimwili bila kuongeza kiwango cha ukatili kisichotajwa.
- source_word: וָאֶמְרְטֵם
  choice: kuwang’oa nywele
  rationale: מרט humaanisha kung’oa au kuchomoa nywele. Kiswahili kinahitaji kutaja wazi ‘nywele,’ ambacho kimeachwa kudokezwa katika Kiebrania.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: nikawaapisha kwa Mungu
  rationale: Hifili ya שבע humaanisha kumfanya mtu aape au kumweka chini ya kiapo. ‘Kwa Mungu’ huwasilisha kwa kawaida chombo au shahidi wa kiapo.
- source_word: אִם תִּתְּנוּ
  choice: Msiwape
  rationale: Baada ya kuwaapisha, אִם huanzisha maneno ya kiapo yenye nguvu ya katazo. Katazo la Kiswahili ‘Msiwape’ linawasilisha kazi hiyo kwa uwazi.
- source_word: בְּנֹתֵיכֶם לִבְנֵיהֶם
  choice: wana wao binti zenu wawe wake zao
  rationale: Hii ni kauli ya kuwatoa binti katika ndoa. Kuongeza ‘wawe wake zao’ huweka wazi maana ya ndoa ambayo iko katika muktadha bila kubadili wahusika au mwelekeo wa tendo.
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: wala msiwachukue binti wao wawe wake
  rationale: נשא katika muktadha huu humaanisha kumchukua mwanamke kuwa mke. Tafsiri inaweka wazi maana ya ndoa kwa Kiswahili cha kawaida.
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: za wana wenu au wake zenu wenyewe
  rationale: Kifungu kinakataza kuwachukulia wana wao wake na pia wanaume wenyewe kuwaoa. ‘Au’ huonyesha kwa kawaida mgawanyo wa katazo katika Kiswahili.
theological_decisions:
- issue: Kusimulia hatua kali za kinidhamu za Nehemia bila kuzipunguza au kuziongeza
  choice: Kutaja wazi kulaani, kupiga, na kung’oa nywele
  alternative: Kulainisha simulizi kuwa kukemea kwa maneno tu, au kuliongeza kuwa kipigo kikali zaidi ya maandishi
  rationale: Kiebrania kinasimulia moja kwa moja vitendo hivi. Tafsiri haipaswi kuficha ukali wake wala kuongeza hukumu ya kimaadili au kiwango cha vurugu ambacho maandishi hayajasema.
- issue: Nguvu ya אִם katika maneno ya kiapo
  choice: 'Kutafsiri kama katazo: ‘Msiwape ... wala msiwachukue’'
  alternative: Kuhifadhi muundo wa masharti, ‘Ikiwa mtawapa ... na ikiwa mtawachukua’
  rationale: Katika muktadha wa kiapo, אִם huweza kuanzisha kwa ufupi jambo lililokatazwa chini ya kiapo. Katazo huwasilisha maana hiyo kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida. Maana ya ndoa imewekwa wazi kwa ‘wawe wake,’ huku ukali wa matendo ya Nehemia na muundo wa kiapo ukihifadhiwa bila maelezo ya kimadhehebu.
