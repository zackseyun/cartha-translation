  text: וַ/יָּבֹ֨א חֲנָ֜נִי אֶחָ֧ד מֵ/אַחַ֛/י ה֥וּא וַ/אֲנָשִׁ֖ים מִֽ/יהוּדָ֑ה וָ/אֶשְׁאָלֵ֞/ם עַל הַ/יְּהוּדִ֧ים הַ/פְּלֵיטָ֛ה אֲשֶֽׁר נִשְׁאֲר֥וּ מִן הַ/שֶּׁ֖בִי וְ/עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: sw
  text: Hanani, mmoja wa ndugu zangu, akaja pamoja na watu kadhaa kutoka Yuda. Nikawauliza habari za Wayahudi[a] walionusurika[b], waliobaki kutoka utekwani[c], na za Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wayuda.” Neno la Kiebrania linaweza kumaanisha watu wa Yuda au Wayahudi kwa maana pana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au “waliookoka” au “mabaki.”
    reason: lexical_alternative
  - marker: c
    text: Au “kutoka uhamishoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kauli ya masimulizi inaonyesha tukio rahisi lililopita; “akaja” ni ya kawaida na hudumisha mtazamo wa msimulizi.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: mmoja wa ndugu zangu
  rationale: Hudumisha neno la kifamilia la Kiebrania bila kulipanua kuwa jamaa kwa ujumla.
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: pamoja na watu kadhaa kutoka Yuda
  rationale: Hueleza kwa Kiswahili cha asili kwamba Hanani aliandamana na idadi isiyotajwa ya watu waliotoka Yuda.
- source_word: וָאֶשְׁאָלֵם עַל
  choice: Nikawauliza habari za
  rationale: Katika muktadha huu, kitenzi na kihusishi vinaonyesha kuuliza kuhusu hali ya watu na mahali; usemi huu ni wazi na wa kawaida.
- source_word: הַיְּהוּדִים
  choice: Wayahudi
  rationale: Katika kipindi cha Uajemi neno linaweza kumaanisha watu wa Yuda au Wayahudi kwa maana pana; “Wayahudi” ni chaguo la kawaida huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: הַפְּלֵיטָה
  choice: walionusurika
  rationale: Nomino ya Kiebrania inaeleza kundi lililoponyoka au kuokoka; kishazi hiki ni cha asili katika Kiswahili na kinaunganishwa vizuri na “Wayahudi.”
- source_word: אֲשֶׁר נִשְׁאֲרוּ
  choice: waliobaki
  rationale: Hudumisha maana ya watu waliosalia baada ya tukio lililotangulia.
- source_word: מִן הַשֶּׁבִי
  choice: kutoka utekwani
  rationale: “Utekwa” huakisi kwa karibu hali ya kuwa mateka; tanbihi inahifadhi tafsiri inayowezekana ya uhamisho.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: na habari za Yerusalemu
  rationale: 'Hudumisha muundo sambamba wa mada mbili za swali: watu na Yerusalemu.'
