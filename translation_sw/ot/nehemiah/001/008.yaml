  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: sw
  text: “Tafadhali, kumbuka neno ulilomwamuru Musa mtumishi wako, ukisema, ‘Ninyi mkikosa uaminifu[a], mimi nitawatawanya miongoni mwa mataifa[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkivunja uaminifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “miongoni mwa jamii za watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Tafadhali, kumbuka
  rationale: Kitenzi cha amri זְכָר kinamaanisha ‘kumbuka,’ na נָא huonyesha ombi la heshima. Mpangilio huu ni wa kawaida na unaonyesha unyenyekevu wa ombi la Nehemia.
- source_word: הַדָּבָר
  choice: neno
  rationale: דָּבָר hapa ni tamko maalumu ambalo Mungu alimpa Musa. ‘Neno’ huhifadhi maana pana ya neno la Kiebrania bila kulifanya kuwa ‘ahadi’ pekee.
- source_word: צִוִּיתָ
  choice: ulilomwamuru
  rationale: צוה humaanisha kuamuru. Umbo hili pia linaonyesha kwamba ‘neno’ ndilo lililoamuriwa kwa Musa.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: עבד inaweza kumaanisha mtumwa au mtumishi, lakini kwa Musa katika huduma yake kwa Mungu, ‘mtumishi wako’ ndiyo maana inayofaa na ya kawaida.
- source_word: לֵאמֹר
  choice: ukisema
  rationale: Hiki ni kianzishi cha maneno yanayonukuliwa, na ‘ukisema’ huwasilisha kazi hiyo kwa Kiswahili cha kawaida.
- source_word: תִּמְעָלוּ
  choice: mkikosa uaminifu
  rationale: מעל huonyesha kutenda kwa kukiuka uaminifu, hasa katika uhusiano wa agano. ‘Mkikosa uaminifu’ huhifadhi maana hiyo bila kuiwekea aina maalumu ya kosa.
- source_word: אָפִיץ
  choice: nitawatawanya
  rationale: Hifili ya פוץ humaanisha kusababisha watu watawanyike; ‘nitawatawanya’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בָּעַמִּים
  choice: miongoni mwa mataifa
  rationale: עַמִּים ni wingi unaoweza kumaanisha makundi ya watu au mataifa. Katika muktadha wa kutawanywa, ‘miongoni mwa mataifa’ ni Kiswahili cha asili na huonyesha kutawanywa kwa Israeli kati ya watu wengine.
theological_decisions:
- issue: Maana ya ukiukaji wa agano katika מעל
  choice: mkikosa uaminifu
  alternative: mkivunja uaminifu
  rationale: Kauli hiyo inakumbusha adhabu za agano kupitia Musa. ‘Mkikosa uaminifu’ huonyesha kuvunjika kwa uaminifu wa uhusiano bila kufafanua zaidi ya maandishi aina ya kosa hilo.
- issue: Hali ya sentensi ya תִּמְעָלוּ
  choice: mkikosa uaminifu
  alternative: mtakosa uaminifu
  rationale: Ingawa Kiebrania hakina kiunganishi cha wazi kinacholingana na ‘ikiwa,’ muundo huu katika muktadha unaanzisha sharti linalofuatwa na matokeo. Kiambishi ‘mki-’ huwasilisha sharti hilo kwa Kiswahili bila kulifanya kuwa dai kwamba kosa hilo lazima litokee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na rahisi kueleweka. ‘Tafadhali, kumbuka’ huhifadhi sauti ya ombi; ‘mtumishi’ ni ya heshima katika muktadha wa Musa; na viambishi vya nafsi ya wingi katika ‘mkikosa’ na ‘nitawatawanya’ vinahifadhi mabadiliko ya Kiebrania kutoka ‘ninyi’ kwenda ‘ninyi’ kama watendewa.
