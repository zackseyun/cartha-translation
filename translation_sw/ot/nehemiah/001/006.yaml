  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: sw
  text: Tafadhali, sikio lako na liwe sikivu, na macho yako yawe wazi, ili uisikie sala ya mtumishi wako ninayokuomba sasa mbele zako mchana na usiku kwa ajili ya wana wa Israeli,[a] watumishi wako, huku nikiziungama dhambi za wana wa Israeli tulizotenda dhidi yako. Mimi na nyumba ya baba yangu tumetenda dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Israeli” au “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli,” usemi wa kifamilia unaohusiana na agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי נָא
  choice: Tafadhali, ... na lisikilize ... yawe
  rationale: Kauli ya ombi pamoja na נָא inaonyesha dua ya heshima; “tafadhali” na miundo ya kusihi huhifadhi sauti hiyo kwa Kiswahili cha kawaida.
- source_word: אָזְנְךָ קַשֶּׁבֶת
  choice: sikio lako na lisikilize kwa makini
  rationale: Huhifadhi taswira ya kisikio iliyo katika Kiebrania na maana ya kuwa makini, kwa usemi unaoeleweka katika Kiswahili.
- source_word: וְעֵינֶיךָ פְתֻוּחוֹת
  choice: na macho yako yawe wazi
  rationale: Huhifadhi wingi wa “macho,” hali ya kuwa wazi, na usambamba wa kisanaa na “sikio.”
- source_word: לִשְׁמֹעַ אֶל
  choice: ili kusikia
  rationale: Kitenzi שׁמע kimetafsiriwa moja kwa moja, huku ל ikionyesha kusudi.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: sala ya mtumishi wako
  rationale: “Mtumishi” inafaa kwa lugha ya kujinyenyekeza mbele za Mungu na haileti msisitizo usiokusudiwa wa hali ya utumwa.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ
  choice: ninayoomba sasa mbele zako
  rationale: Umbo la participle linaonyesha tendo linaloendelea; “sasa” huonyesha mazingira ya wakati wa sala, na “mbele zako” huhifadhi לְפָנֶיךָ.
- source_word: הַיּוֹם יוֹמָם וָלַיְלָה
  choice: sasa ... mchana na usiku
  rationale: הַיּוֹם inaonyeshwa kwa “sasa” katika muktadha wa ombi la wakati huu, na יוֹמָם וָלַיְלָה kwa nahau ya Kiswahili “mchana na usiku,” inayodokeza mwendelezo.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: kwa ajili ya wana wa Israeli, watumishi wako
  rationale: עַל hapa ni sala kwa niaba yao; “wana wa Israeli” huhifadhi usemi wa kifamilia wa agano, na “watumishi wako” ni maelezo ya ziada yanayowatambulisha.
- source_word: וּמִתְוַדֶּה
  choice: huku nikiziungama
  rationale: Participle ya pili inaonyesha tendo linaloendelea kwa wakati mmoja na kuomba; “huku” huonyesha uambatano huo kwa kawaida.
- source_word: חַטֹּאות
  choice: dhambi
  rationale: Hili ndilo neno la kawaida na lenye uzito ufaao katika muktadha wa maungamo.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: ambazo tumekutendea
  rationale: Huhifadhi dhambi kama kosa lililoelekezwa dhidi ya Mungu kwa Kiswahili sanifu na cha kawaida.
- source_word: וַאֲנִי וּבֵית אָבִי
  choice: Mimi na jamaa ya baba yangu
  rationale: בֵית אָבִי ni nyumba/jamaa ya ukoo wa baba, si jengo tu; “jamaa ya baba yangu” hutoa maana hiyo kwa ufasaha bila kuongeza msisitizo usio wazi katika וַאֲנִי.
theological_decisions:
- issue: Lugha ya kibinadamu kumhusu Mungu (“sikio,” “macho”)
  choice: Taswira ya moja kwa moja imehifadhiwa
  alternative: Kufafanua tu kuwa Mungu asikilize au aangalie kwa makini bila kutaja viungo vya mwili
  rationale: Sala ya Kiebrania inatumia kwa makusudi taswira ya viungo vya mwili kuomba uangalifu wa Mungu; kuibakiza huhifadhi nguvu ya usemi bila kuamua kimafundisho kwamba Mungu ana mwili.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watu wa Israeli; Waisraeli
  rationale: “Wana wa Israeli” huhifadhi kwa uwazi usemi wa kifamilia wa Kiebrania na muktadha wake wa agano, huku tanbihi ikitoa visawe vya kawaida.
- issue: Ushiriki binafsi wa Nehemia katika hatia
  choice: Mimi na jamaa ya baba yangu tumetenda dhambi
  alternative: Hata mimi na jamaa ya baba yangu tumetenda dhambi
  rationale: וַאֲנִי inaweza kuendeleza na kubainisha maungamo bila lazima ya kuongeza msisitizo wa “hata”; tafsiri haimpunguzi Nehemia kutoka katika “tumetenda.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kishairi wa sikio na macho umehifadhiwa; sentensi imepangwa kwa viunganishi vya kawaida vya Kiswahili bila kufuta mwendelezo wa vitendo vya kuomba na kuungama.
