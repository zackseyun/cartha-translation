  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: sw
  text: Nikasema, “Tafadhali, Ee Yahweh, Mungu wa mbinguni, Mungu mkuu mwenye kutia kicho[a], unayeshika agano na upendo wa kudumu[b] kwa wale wanaokupenda na kuzishika amri zako,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa kuogofya.”
    reason: lexical_alternative
  - marker: b
    text: Au “uaminifu wa agano” au “fadhili za kudumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Nikasema
  rationale: Muundo wa simulizi unaendeleza mfuatano wa matukio na kuanzisha sala ya Nehemia kwa Kiswahili cha kawaida.
- source_word: אָנָּא
  choice: Tafadhali
  rationale: Ni chembe ya kusihi katika sala; “Tafadhali” inadumisha sauti ya ombi kwa lugha ya sasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limenukuliwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Mungu wa mbinguni
  rationale: Huu ni usemi wa kawaida na wa asili katika Kiswahili kwa muundo huu wa Kiebrania.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: Mungu mkuu na wa kuogofya
  rationale: “Mkuu” huhifadhi maana ya msingi ya ukubwa, na “wa kuogofya” huonyesha kwamba Mungu huamsha hofu yenye staha bila kupunguza neno kuwa sifa ya kawaida.
- source_word: שֹׁמֵר הַבְּרִית
  choice: unayeshika agano
  rationale: Kitenzi cha hali endelevu kinaonyesha uaminifu wa Mungu katika kulitimiza na kulidumisha agano.
- source_word: וָחֶסֶד
  choice: na kudumisha upendo thabiti
  rationale: Katika muktadha wa agano, חֶסֶד ni upendo wa kudumu na mwaminifu; kitenzi “kudumisha” hufanya uratibu wa Kiswahili uwe wa asili.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: kwa wale wanaokupenda na kuzishika amri zako
  rationale: Huhifadhi ulinganifu wa vishazi viwili na kurejelea Mungu moja kwa moja kama anavyoombwa katika sala.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahweh” huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya חֶסֶד katika muktadha wa agano
  choice: upendo thabiti
  alternative: fadhili za agano / rehema
  rationale: “Upendo thabiti” hudumisha pamoja wazo la upendo na uaminifu wa kudumu, bila kulifungia neno katika maana moja finyu.
- issue: Maana ya הַנּוֹרָא
  choice: wa kuogofya
  alternative: mwenye kutia kicho
  rationale: Neno linaonyesha Mungu anayesababisha hofu yenye staha. “Wa kuogofya” ni tafsiri ya moja kwa moja, huku tanbihi ikihifadhi uwezekano wa msisitizo wa kicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa sasa. “Ee” hudumisha mwito wa moja kwa moja; “kuzishika amri” ni usemi wa kawaida wa kibiblia usio wa kizamani.
