base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: sw
  text: Niliposikia maneno haya[a], niliketi chini, nikalia na kuomboleza kwa siku kadhaa; nami nilikuwa nikifunga na kuomba[b] mbele za Mungu wa mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo haya.” Neno la Kiebrania דְּבָרִים linaweza kumaanisha “maneno,” “mambo,” au “taarifa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Nilifunga na kuomba.” Muundo wa Kiebrania unaonyesha kwamba kufunga na kuomba kulikuwa matendo yaliyoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: Niliposikia
  rationale: Muundo huu wa simulizi huanzisha wakati wa tendo linalofuata; Kiswahili cha asili hutumia ‘niliposikia’ bila kutafsiri וַיְהִי kwa namna nzito kama ‘ikawa.’
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: דְּבָרִים inaweza kumaanisha maneno, mambo, au taarifa. ‘Maneno haya’ huhifadhi maana ya karibu ya kifungu huku yakirejelea yaliyokuwa yameripotiwa.
- source_word: יָשַׁבְתִּי
  choice: niliketi chini
  rationale: ישׁב hapa inaeleza mwitikio wa kimwili wa kuketi; ‘niliketi chini’ ni ya kawaida na wazi katika Kiswahili.
- source_word: וָאֶבְכֶּה
  choice: nikalia
  rationale: בכה ni kulia kwa huzuni; ‘nikalia’ ni neno la kawaida, lenye heshima, na sahihi katika muktadha huu.
- source_word: וָאֶתְאַבְּלָה
  choice: na kuomboleza
  rationale: אבל huonyesha maombolezo au huzuni ya kudumu. ‘Kuomboleza’ hutofautisha tendo hili na kulia na kuhifadhi uzito wake.
- source_word: יָמִים
  choice: kwa siku kadhaa
  rationale: Wingi usioainishwa יָמִים unaonyesha muda wa siku fulani bila kutaja idadi; ‘kwa siku kadhaa’ ni Kiswahili cha asili.
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: Niliendelea kufunga na kuomba
  rationale: היה pamoja na vivumishi-tendaji huonyesha matendo yaliyodumu. ‘Niliendelea kufunga na kuomba’ huwasilisha hali hiyo kwa uwazi.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: לִפְנֵי humaanisha mbele ya au katika uwepo wa. ‘Mbele za’ ni usemi wa kawaida wa Kiswahili katika muktadha wa sala.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Mungu wa mbinguni
  rationale: Hiki ni cheo cha Mungu katika Ezra–Nehemia. ‘Mungu wa mbinguni’ ni tafsiri ya kawaida na haiongezi jina la agano lisilopatikana hapa.
theological_decisions:
- issue: Tafsiri ya cheo אֱלֹהֵי הַשָּׁמָיִם
  choice: Mungu wa mbinguni
  alternative: Mungu wa mbingu
  rationale: הַשָּׁמָיִם ni umbo la Kiebrania linalotafsiriwa kwa kawaida kama ‘mbinguni’ katika cheo hiki. Tafsiri inalihifadhi kama cheo cha Mungu bila kulibadili kuwa jina YHWH.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida; uratibu na mwendelezo wa matendo ya Kiebrania umehifadhiwa. Alama zote za tanbihi zimewekwa katika maandishi makuu.
