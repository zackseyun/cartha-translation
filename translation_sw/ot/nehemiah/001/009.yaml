source:
  edition: WLC
  text: וְ/שַׁבְתֶּ֣ם אֵלַ֔/י וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אִם יִהְיֶ֨ה נִֽדַּחֲ/כֶ֜ם בִּ/קְצֵ֤ה הַ/שָּׁמַ֨יִם֙ מִ/שָּׁ֣ם אֲקַבְּצֵ֔/ם ו/הבואתי/ם אֶל הַ/מָּק֔וֹם אֲשֶׁ֣ר בָּחַ֔רְתִּי לְ/שַׁכֵּ֥ן אֶת שְׁמִ֖/י שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: sw
  text: lakini mkirudi kwangu, mkazishika amri zangu na kuzitekeleza, hata kama watu wenu waliofukuzwa[a] watakuwa katika mwisho wa mbingu[b], nitawakusanya kutoka huko na kuwaleta mahali nilipochagua, ili kulifanya jina langu likae huko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wenu waliohamishwa” au “watu wenu waliotawanywa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “katika mwisho wa mbingu,” nahau inayomaanisha umbali wa mbali zaidi unaowezekana.'
    reason: cultural_note
  - marker: c
    text: Au “ili niliweke jina langu huko.” Kiebrania huhifadhi taswira ya jina la Mungu likikaa mahali alipochagua.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: lakini mkirudi kwangu
  rationale: Kitenzi שׁוּב pamoja na אֶל humaanisha kurudi au kumgeukia mtu. Muundo wa sharti unaendelea kutoka mstari uliotangulia; “lakini” huonyesha tofauti ya muktadha, na “mkirudi” huwasilisha sharti kwa Kiswahili cha kawaida.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי
  choice: mkazishika amri zangu
  rationale: שׁמר inapotumiwa kuhusu amri hubeba maana ya kuzitii na kuzihifadhi; “kuzishika amri” ni usemi wa kawaida wa agano na pia hutofautishwa na kuzitekeleza.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: na kuzitekeleza
  rationale: Kiebrania kinataja kwa uwazi kuzishika na kuzifanya. “Kuzitekeleza” hudumisha wazo la kutenda bila kurudia kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: נִדַּחֲכֶם
  choice: waliofukuzwa miongoni mwenu
  rationale: Mzizi נדח hueleza watu walioondolewa, waliofukuzwa au waliotawanywa. “Waliofukuzwa miongoni mwenu” ni wazi na ya asili, huku ikihifadhi hali ya kufanyiwa tendo.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: kwenye mwisho wa mbingu
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania kuhusu umbali wa mwisho kabisa. Tanbihi inaeleza matumizi yake kama nahau.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: nitawakusanya kutoka huko
  rationale: קבץ ni kitenzi cha kawaida cha kuwakusanya tena watu waliotawanywa; “nitawakusanya” ni ya kawaida na huhifadhi dhamira ya urejesho.
- source_word: וַהֲבֹאתִים
  choice: na kuwaleta
  rationale: Hifili ya בוא ni ya kusababisha kuja; Kiswahili cha kawaida huiwasilisha kwa “kuwaleta.”
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: mahali nilipopachagua
  rationale: בחר hueleza uchaguzi wa Mungu wa mahali pa patakatifu. Muundo huu wa Kiswahili ni wa asili na unaonyesha kwamba mahali hapo palikuwa pamechaguliwa tayari.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: ili nilikalishe jina langu huko
  rationale: Muundo wa kusababisha wa שכן pamoja na “jina langu” umehifadhiwa kwa “nilikalishe,” badala ya kuufanya usemi huu kuwa kumbukumbu tu au kudokeza kwamba Mungu amefungiwa mahali hapo.
theological_decisions:
- issue: Usemi wa uwepo wa Mungu katika mahali patakatifu
  choice: ili nilikalishe jina langu huko
  alternative: ili niliweke jina langu huko
  rationale: 'Kiebrania hutumia usemi wa agano kuhusu jina la Mungu kukaa mahali alipochagua. “Nilikalishe jina langu” huhifadhi taswira na mvutano wa kitheolojia: Mungu anapahusianisha mahali hapo na jina lake bila kusema kwamba nafsi yake imefungiwa humo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeendeleza sharti kutoka mstari uliotangulia, imehifadhi urudiaji wa kuzishika na kuzitenda amri kwa namna ya asili, na imeacha taswira ya “mwisho wa mbingu” na jina la Mungu kukaa mahali pake ikiwa hai.
