base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: sw
  text: Tumetenda kwa uovu mkubwa sana dhidi yako[a], na hatukuzishika amri, sheria, na hukumu[b] ambazo ulimwamuru Musa, mtumishi wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tumekutendea kwa uovu mkubwa sana.” Kiebrania hutumia kitenzi kisicho na kikomo pamoja na kitenzi cha mzizi huohuo ili kusisitiza tendo.
    reason: lexical_alternative
  - marker: b
    text: “Hukumu” pia inaweza kutafsiriwa “kanuni” au “maamuzi ya kisheria”; neno la Kiebrania linaweza kurejelea maamuzi ya mahakama au sheria zinazohusu kesi mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: Tumetenda maovu makubwa sana
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kamili unasisitiza ukubwa wa tendo. Kiswahili hiki kinaonyesha msisitizo huo kwa njia ya kawaida bila kurudia kitenzi kihalisi.
- source_word: לָךְ
  choice: dhidi yako
  rationale: Katika maungamo haya, kihusishi kinaonyesha kwamba kosa lilielekezwa kwa Mungu; “dhidi yako” linaweka wazi uvunjaji huo wa uhusiano.
- source_word: שָׁמַרְנוּ
  choice: hatukuzishika
  rationale: Kitenzi hiki kinapotumiwa kuhusu sheria humaanisha kuzitii au kuzifuata. “Kuzishika” ni usemi wa kawaida katika muktadha wa agano na sheria.
- source_word: הַמִּצְוֺת
  choice: amri
  rationale: Neno hili linamaanisha maagizo yenye mamlaka na linahifadhi uzito wa kisheria wa kifungu.
- source_word: הַחֻקִּים
  choice: masharti
  rationale: Neno la Kiebrania hurejelea maagizo au matakwa yaliyowekwa. “Masharti” linatofautisha kundi hili na amri na hukumu.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: Neno linaweza kumaanisha maamuzi ya kisheria, sheria za kesi, au kanuni. “Hukumu” linahifadhi mwelekeo wake wa kimahakama na tofauti yake na masharti.
- source_word: צִוִּיתָ
  choice: ulizomwamuru
  rationale: Kitenzi kina maana ya kuamuru. Tafsiri hii inadumisha uhusiano wa moja kwa moja na mamlaka ya Mungu.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Kwa Musa katika uhusiano wake na Mungu, “mtumishi” ni cheo cha asili na kinachofaa, kinachoonyesha huduma aliyopewa.
theological_decisions:
- issue: Kutofautisha maneno matatu ya Torati
  choice: amri, masharti, na hukumu
  alternative: amri, sheria, na kanuni
  rationale: Kiebrania kinatumia maneno matatu tofauti ya kisheria. Tafsiri imehifadhi tofauti hiyo bila kuyafanya kuwa neno moja wala kuyapa maana finyu ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala ya maungamo lakini kinachoeleweka kwa wasomaji wa kawaida. “Ufisadi” umeepukwa kwa sababu katika matumizi ya sasa mara nyingi humaanisha rushwa ya kisiasa au kifedha.
