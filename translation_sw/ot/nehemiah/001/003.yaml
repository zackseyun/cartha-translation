translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku utata halisi wa שְׁבִי ukihifadhiwa katika tanbihi. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
