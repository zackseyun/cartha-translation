base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: sw
  text: Nao wakaniambia, “Wale waliosalia huko katika jimbo, yaani wale waliobaki kutoka utekwani[a], wako katika shida kubwa na fedheha[b]. Ukuta wa Yerusalemu umebomolewa, na malango yake yamechomwa moto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uhamishoni.” Kirai cha Kiebrania kinaweza kueleweka kuwa “kutoka utekwani” au “kutoka uhamishoni.”
    reason: lexical_alternative
  - marker: b
    text: Au “dhiki kubwa na aibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: Nao wakaniambia
  rationale: Huwasilisha mwendelezo wa simulizi wa wayyiqtol kwa Kiswahili cha kawaida bila kuongeza maana isiyokuwamo.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ
  choice: Wale waliosalia ... waliookoka
  rationale: Mzizi שׁאר umerudiwa ili kusisitiza watu waliobaki baada ya janga. Kiswahili hiki kinadumisha wazo la kusalia na kunusurika bila marudio mazito yasiyo ya kawaida.
- source_word: מִן הַשְּׁבִי
  choice: kutoka utekwani
  rationale: שְׁבִי inaweza kutaja hali ya kuwa mateka au uhamisho uliotokana na kutekwa. ‘Utekwani’ inafuata umbo la nomino na muktadha, huku tanbihi ikihifadhi uwezekano wa ‘uhamishoni.’
- source_word: בַּמְּדִינָה
  choice: katika jimbo
  rationale: Katika utawala wa kipindi cha Uajemi, מְדִינָה ni eneo rasmi la kiutawala; ‘jimbo’ ni neno la kawaida na linaloeleweka kwa maana hiyo.
- source_word: בְּרָעָה גְדֹלָה
  choice: katika shida kubwa
  rationale: רָעָה hapa haimaanishi uovu wa kimaadili bali hali mbaya sana au taabu. ‘Shida kubwa’ ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: וּבְחֶרְפָּה
  choice: na fedheha
  rationale: חֶרְפָּה huhusu aibu ya hadharani, shutuma, au kuvunjiwa heshima; ‘fedheha’ huwasilisha hali hiyo ya kijamii kwa usahihi.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: Ukuta wa Yerusalemu
  rationale: Umoja wa Kiebrania unarejelea kwa ujumla ngome ya ukuta unaouzunguka mji.
- source_word: מְפֹרָצֶת
  choice: umebomolewa
  rationale: Kauli hii ya kutendwa kutoka פרץ huonyesha ukuta uliovunjwa na kuachwa wazi. ‘Umebomolewa’ hueleza uharibifu huo na hali yake inayoendelea.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: na malango yake yameteketezwa kwa moto
  rationale: Huhifadhi wazi tendo la kuharibiwa kwa kuchomwa moto na matokeo yake yanayoonekana wakati wa taarifa.
