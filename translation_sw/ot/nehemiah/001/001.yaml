base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: sw
  text: Maneno ya Nehemia mwana wa Hakalia[a]. Ikawa katika mwezi wa Kislevu, mwaka wa ishirini[b], nilipokuwa katika Susa, ngome ya kifalme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Simulizi la Nehemia mwana wa Hakalia.” Kichwa cha Kiebrania “Maneno ya” kinaweza kutambulisha simulizi au kumbukumbu iliyoandikwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mwaka wa ishirini.” Mstari huu hausemi wazi ni mwaka wa ishirini wa utawala wa nani, ingawa muktadha wa baadaye unamtaja Artashasta.
    reason: cultural_note
  - marker: c
    text: Au, “Susa, ngome.” Neno la Kiebrania humaanisha eneo la kifalme lililoimarishwa kwa ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Maneno ya
  rationale: Huhifadhi mtindo wa kichwa cha Kiebrania, ambacho kinaweza kutambulisha maneno, matendo, au simulizi la mtu; maana mbadala imeonyeshwa katika tanbihi.
- source_word: נְחֶמְיָה בֶּן חֲכַלְיָה
  choice: Nehemia mwana wa Hakalia
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili, huku בֶּן ikitafsiriwa kwa uhusiano wa kawaida wa ukoo, ‘mwana wa’.
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya Kiebrania ya kuanzisha au kuendeleza simulizi; ‘Ikawa’ ni fupi, yenye hadhi, na inaakisi kazi hiyo ya kisimulizi.
- source_word: כִּסְלֵו
  choice: Kislevu
  rationale: Jina la mwezi limetoholewa badala ya kubadilishwa kuwa mwezi wa kalenda ya kisasa.
- source_word: שְׁנַת עֶשְׂרִים
  choice: mwaka wa ishirini
  rationale: Hufuata fomula ya tarehe ya Kiebrania bila kuongeza kwamba ni mwaka wa utawala wa mfalme fulani, jambo ambalo halijasemwa wazi katika mstari huu.
- source_word: וַאֲנִי הָיִיתִי
  choice: nilipokuwa
  rationale: Huwasilisha kwa Kiswahili cha kawaida hali ya msimuliaji wakati tukio lilipotokea.
- source_word: בְּשׁוּשַׁן
  choice: Susa
  rationale: Limetumika jina la kisasa linalotambulika la mahali palipoitwa Shushani katika Kiebrania.
- source_word: הַבִּירָה
  choice: ngome ya kifalme
  rationale: Neno hili humaanisha eneo lenye ulinzi lenye makao au majengo ya kifalme; tafsiri hii huepuka kulifanya limaanishe tu ‘mji mkuu’.
