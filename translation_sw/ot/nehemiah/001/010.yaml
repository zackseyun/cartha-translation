id: NEH.1.10
reference: Nehemiah 1:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵ֥ם עֲבָדֶ֖י/ךָ וְ/עַמֶּ֑/ךָ אֲשֶׁ֤ר פָּדִ֨יתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּד֔וֹל וּ/בְ/יָדְ/ךָ֖ הַ/חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: sw
  text: Nao ni watumishi wako na watu wako, uliowakomboa[a] kwa nguvu zako kuu na kwa mkono wako wenye nguvu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uliowaokoa” au “uliowaweka huru”; kitenzi cha Kiebrania kina maana ya kupata uhuru kwa tendo la ukombozi.
    reason: lexical_alternative
  - marker: b
    text: Au “mkono wako hodari”; “mkono wenye nguvu” ni usemi wa kawaida unaoeleza tendo la Mungu lenye uwezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Nao
  rationale: Kiunganishi kinaendeleza sala huku kikiwarejelea watu waliotajwa; “Nao” ni ya kawaida na haiongezi utofauti mkali kuliko uliomo katika Kiebrania.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Neno עבד linaweza kumaanisha mtumwa au mtumishi, lakini hapa linasisitiza uhusiano wa watu na Mungu katika agano; “watumishi” linafaa zaidi katika muktadha huu.
- source_word: וְעַמֶּךָ
  choice: na watu wako
  rationale: עם hapa ni jumuiya ya watu wa Mungu; umilikaji uliomo katika Kiebrania umeonyeshwa wazi.
- source_word: פָּדִיתָ
  choice: uliowakomboa
  rationale: פדה hudokeza kuwaweka huru kwa tendo la ukombozi. “Kukomboa” huhifadhi uzito wa lugha ya agano na mwangwi wa kutoka Misri bila kuongeza mafundisho yasiyotajwa moja kwa moja.
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: kwa nguvu zako kuu
  rationale: כח ni nguvu au uwezo, na בְּ inaonyesha njia iliyotumiwa. Kiswahili kwa kawaida hutumia “nguvu” katika wingi wa kisarufi katika usemi huu.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: na kwa mkono wako wenye nguvu
  rationale: Tafsiri hii inaweka wazi taswira ya Kiebrania ya יד na sifa חזק, huku ikitumia usemi wa kawaida wa Kiswahili kuhusu tendo la Mungu lenye uwezo.
theological_decisions:
- issue: Lugha ya ukombozi katika sala ya Nehemia
  choice: uliowakomboa
  alternative: uliowaokoa / uliowaweka huru
  rationale: Mstari unakumbusha tendo la Mungu la kihistoria la kuwaokoa watu wake, yaelekea ukiakisi lugha ya kutoka Misri. “Kukomboa” huhifadhi maana hiyo pana ya agano bila kuiwekea maana mahususi ya kimadhehebu.
- issue: Taswira ya mkono wa Mungu
  choice: mkono wako wenye nguvu
  alternative: mkono wako hodari
  rationale: Taswira ya kimwili imehifadhiwa kama sitiari ya utendaji wa Mungu wenye uwezo; haipaswi kufafanuliwa kuwa Mungu ana mwili wala kubadilishwa kuwa kauli isiyo na taswira.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wazi kwa msomaji wa kawaida, huku marudio ya “wako” na taswira ya “mkono” yakihifadhiwa kwa uaminifu kwa chanzo.
