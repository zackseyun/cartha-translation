  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: sw
  text: “Ee Bwana, nakusihi, sikio lako na liwe sikivu kwa sala ya mtumishi wako na kwa sala ya watumishi wako wanaopenda kulihofu jina lako[a]. Tafadhali, mfanikishe mtumishi wako leo, na umfanye apate huruma mbele ya mtu huyu[b][c]. Nami nilikuwa mnyweshaji wa mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaotamani kulistahi jina lako,” au “wanaofurahia kuwa na kicho kwa jina lako.”
    reason: lexical_alternative
  - marker: b
    text: Au “umjalie kibali mbele ya mtu huyu.” Nahau ya Kiebrania husema kihalisi ‘umpe kwa huruma,’ ikimaanisha kumfanya atendwe kwa huruma.
    reason: lexical_alternative
  - marker: c
    text: “Mtu huyu” ni mfalme, ambaye Nehemia anamtaja katika sentensi inayofuata kuwa ndiye aliyemtumikia kama mnyweshaji.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא אֲדֹנָי
  choice: Ee Bwana, nakusihi
  rationale: אָנָּא ni neno la kusihi kwa dhati, na אֲדֹנָי hapa ni cheo cha Mungu katika maombi. “Ee Bwana, nakusihi” ni Kiswahili cha kawaida, chenye heshima na uzito wa ombi.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: sikio lako na lisikilize kwa makini
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya sikio la Mungu huku ikionyesha maana ya kusikiliza kwa uangalifu na kwa kukubali ombi.
- source_word: תְּפִלַּת עַבְדְּךָ ... תְּפִלַּת עֲבָדֶיךָ
  choice: sala ya mtumishi wako ... sala ya watumishi wako
  rationale: “Mtumishi” linafaa kwa kujinyenyekeza mbele za Mungu hapa bila kusisitiza hadhi ya kisheria ya utumwa; umoja na wingi vimedumishwa.
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: wanaopenda kulihofu jina lako
  rationale: הַחֲפֵצִים huonyesha kupenda, kufurahia, au kutamani; “kulihofu jina lako” inadumisha uzito wa ירא na nahau ya kibiblia ya jina la Mungu.
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: Tafadhali, mfanikishe mtumishi wako leo
  rationale: Kitenzi cha Hifili cha צלח kinaomba Mungu asababishe mafanikio. “Mfanikishe” linaweka wazi kwamba Mungu ndiye anayetoa matokeo yenye kufaa.
- source_word: וּתְנֵהוּ לְרַחֲמִים לִפְנֵי הָאִישׁ הַזֶּה
  choice: umjalie kupata huruma mbele ya mtu huyu
  rationale: Nahau ya Kiebrania, kihalisi ‘mpe kwa ajili ya huruma,’ inaomba Nehemia atendwe kwa huruma. “Kupata huruma mbele ya” huhifadhi wazo la huruma na pia taswira ya kuwa mbele ya mtu huyo.
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: Nami nilikuwa mnyweshaji wa mfalme
  rationale: Hii ni taarifa ya kisimulizi kuhusu wadhifa wa Nehemia. “Mnyweshaji wa mfalme” ni tafsiri iliyo wazi ya afisa aliyehudumia kinywaji cha mfalme.
theological_decisions:
- issue: Maana ya עבד katika lugha ya maombi
  choice: mtumishi
  alternative: mtumwa
  rationale: Katika muktadha huu neno ni namna ya unyenyekevu na kujitoa kwa Mungu, si msisitizo wa hali ya kisheria ya kuwa mtumwa.
- issue: Maana ya ירא kuhusiana na jina la Mungu
  choice: kulihofu jina lako
  alternative: kulistahi jina lako; kulicha jina lako
  rationale: Kiebrania kinabeba hofu pamoja na staha ya kidini. “Kulihofu” hakupunguzi mvutano huo kuwa staha pekee, huku tanbihi ikionyesha uwezekano wa kueleza maana ya uchaji.
- issue: Huruma mbele ya mtu huyu
  choice: umjalie kupata huruma mbele ya mtu huyu
  alternative: umjalie kibali mbele ya mtu huyu
  rationale: רַחֲמִים inalenga huruma, lakini katika nahau hii inaweza kutokeza wazo la kutendewa kwa kibali. Maandishi makuu yanahifadhi huruma; tanbihi inadokeza uwezekano wa “kibali.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maombi umehifadhi taswira za Kiebrania bila kuwa mgumu kupita kiasi. “Nakusihi” na “tafadhali” zinaonyesha marudio ya chembe ya ombi נָא/אָנָּא, na “mnyweshaji” linatumika kama jina la wadhifa wa kifalme.
