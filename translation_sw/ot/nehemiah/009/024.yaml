base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: sw
  text: Basi wana[a] wakaingia na kuimiliki nchi. Nawe ukawatiisha mbele yao wakaaji wa nchi, Wakanaani; ukawatia mikononi mwao,[b] pamoja na wafalme wao na mataifa ya nchi, ili wawatendee walivyotaka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto”; kwa maana ya kimuktadha, “Waisraeli.” Kiebrania kihalisi ni “wana.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, ukawatia chini ya mamlaka yao.
    reason: lexical_alternative
  - marker: c
    text: Au “ili wafanye nao kama walivyopenda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: wana
  rationale: Neno hili linahifadhi lugha ya kifamilia na ya kizazi katika Kiebrania, huku tanbihi ikifafanua kwamba kimuktadha linawarejelea wazao wa Israeli walioingia Kanaani.
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: kuimiliki nchi
  rationale: Katika muktadha wa nchi, ירשׁ humaanisha kuitwaa na kuwa na milki yake; ‘kuimiliki’ ni ya kawaida na inaweka wazi maana ya umiliki.
- source_word: וַתַּכְנַע
  choice: ukawatiisha
  rationale: Kitenzi hiki kinaonyesha Mungu akiwafanya wakaaji wa Kanaani wawe chini ya mamlaka ya Israeli; ‘ukawatiisha’ kinahifadhi nguvu ya lugha ya kijeshi na kisiasa.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: wakaaji wa nchi
  rationale: Hii ni tafsiri ya moja kwa moja, ya asili na inayoeleweka kwa Kiswahili cha sasa.
- source_word: הַכְּנַעֲנִים
  choice: Wakanaani
  rationale: Jina la kabila limehifadhiwa moja kwa moja.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: ukawatia mikononi mwao
  rationale: Nahau ya Kiebrania kuhusu kuwaweka chini ya uwezo wa mtu imehifadhiwa kwa usemi wa Kiswahili unaoeleweka, huku tanbihi ikitoa maana yake wazi.
- source_word: מַלְכֵיהֶם
  choice: wafalme wao
  rationale: Kiwakilishi kinabaki kikirejelea wakaaji wa nchi, yaani Wakanaani, bila kuongeza ufafanuzi usiokuwamo katika matini.
- source_word: עַמְמֵי הָאָרֶץ
  choice: mataifa ya nchi
  rationale: ‘Mataifa’ kinawakilisha wingi wa עַמְמֵי na kudumisha wazo la makundi mbalimbali ya watu katika nchi hiyo.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: ili wawatendee walivyotaka
  rationale: Usemi huu ni wa asili katika Kiswahili na unahifadhi maana ya kutenda kulingana na mapenzi au matakwa yao bila kuficha ukali wa muktadha.
theological_decisions:
- issue: Kirejeleo cha ‘wana’
  choice: Lugha ya kifamilia ‘wana’ imehifadhiwa, ikimaanisha wazao wa Israeli walioingia Kanaani.
  alternative: ‘Watoto’ au tafsiri ya kimuktadha ‘Waisraeli.’
  rationale: Kiebrania kinatumia lugha ya kifamilia inayounganisha kizazi hiki na mababu waliotajwa awali; kutafsiri moja kwa moja ‘Waisraeli’ kungeondoa kiungo hicho.
- issue: Nguvu ya lugha kuhusu kuiteka nchi
  choice: Maneno yenye nguvu ‘ukawatiisha’ na ‘ukawatia mikononi mwao’ yamehifadhiwa.
  alternative: Usemi laini kama ‘ukawawezesha kuwashinda.’
  rationale: Aya inahusisha ushindi huo moja kwa moja na tendo la Mungu; tafsiri haipaswi kupunguza nguvu ya lugha ya Kiebrania wala kutatua mvutano wake wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sala unaomhutubia Mungu umehifadhiwa, pamoja na lugha thabiti ya ushindi iliyo katika chanzo.
