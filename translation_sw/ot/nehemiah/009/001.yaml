base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: sw
  text: Siku ya ishirini na nne ya mwezi huu, wana wa Israeli[a] walikusanyika huku wakifunga, wakiwa wamevaa nguo za magunia, na udongo juu yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli”; kwa desturi, “watoto wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “udongo juu yao.” Walijiwekea udongo kama ishara ya maombolezo na toba.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: Siku ya ishirini na nne
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kutaja tarehe; kiunganishi cha Kiebrania hakihitaji neno la ziada kama “basi” katika muktadha huu.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: ya mwezi huu
  rationale: Hutambulisha mwezi unaozungumziwa kwa lugha ya kawaida na iliyo wazi.
- source_word: נֶאֶסְפוּ
  choice: walikusanyika
  rationale: Niphal hapa inaeleza watu kuja pamoja kama kusanyiko. Kitenzi cha Kiswahili “walikusanyika” huwasilisha maana hiyo kwa kawaida bila kudai kwamba mtu mwingine aliwakusanya.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania, huku katika muktadha ikimaanisha jumuiya ya Waisraeli.
- source_word: בְּצוֹם
  choice: huku wakifunga
  rationale: Huonyesha kwamba kufunga kuliambatana na kukusanyika kwao, si kwamba walikuwa mahali panapoitwa ‘katika mfungo.’
- source_word: וּבְשַׂקִּים
  choice: wakiwa wamevaa mavazi ya magunia
  rationale: Hufanya wazi kwa msomaji wa sasa kwamba magunia yalivaliwa kama mavazi, bila kupanua maana zaidi ya tendo linalodokezwa na kishazi.
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: na udongo ukiwa juu yao
  rationale: “Udongo” ni maana ya kawaida ya אֲדָמָה, na “juu yao” huhifadhi kutotajwa kwa sehemu maalumu ya mwili kama vile vichwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kusomeka kwa sauti, huku ukihifadhi lugha ya kifamilia ya “wana wa Israeli” na usemi usiotaja sehemu maalumu ya mwili kuhusu udongo.
