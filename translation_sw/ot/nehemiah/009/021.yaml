  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: sw
  text: Kwa miaka arobaini uliwategemeza jangwani; hawakupungukiwa na kitu. Mavazi yao hayakuchakaa, wala miguu yao haikuvimba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: uliwapatia mahitaji yao
  rationale: Kitenzi kinaeleza kuwategemeza kwa kuendelea na kuwapa walichohitaji; usemi huu ni wa kawaida na hauishii kumaanisha chakula pekee.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Neno hili humaanisha eneo la nyika au jangwa; “jangwani” linafaa kwa muktadha wa safari ya Israeli.
- source_word: לֹא חָסֵרוּ
  choice: hawakupungukiwa na kitu
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha kwamba mahitaji yao yote yalitoshelezwa.
- source_word: שַׂלְמֹתֵיהֶם
  choice: mavazi yao
  rationale: “Mavazi” ni neno la sasa, lenye heshima, linalowakilisha nguo kwa maana ya jumla.
- source_word: לֹא בָלוּ
  choice: hayakuchakaa
  rationale: “Kuchakaa” hueleza kwa kawaida mavazi kuharibika au kuzeeka kutokana na matumizi.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: wala miguu yao haikuvimba
  rationale: Kitenzi hapa kinamaanisha kuvimba; “wala” linaunganisha kwa kawaida kauli mbili hasi.
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: Kwa miaka arobaini
  rationale: Muundo huu unaendeleza muktadha wa simulizi kwa Kiswahili cha kawaida bila kulazimisha kiunganishi cha Kiebrania kutafsiriwa kwa neno tofauti.
