id: NEH.9.17
reference: Nehemiah 9:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: sw
  text: Lakini walikataa kusikiliza, wala hawakuyakumbuka maajabu yako uliyofanya kati yao. Wakafanya shingo zao kuwa ngumu, na katika uasi wao wakamweka kiongozi ili warudi utumwani mwao. Lakini wewe ni Mungu mwenye kusamehe[a], mwenye neema na huruma, si mwepesi wa hasira, na mwingi wa upendo wa kudumu; nawe hukuwaacha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “Mungu wa misamaha.” Wingi huo unasisitiza kwamba Mungu husamehe kwa wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: walikataa kusikiliza
  rationale: Huhifadhi maana ya kukataa au kutokuwa tayari kusikia, huku wazo la kutotii likibaki kudokezwa na muktadha.
- source_word: נִפְלְאֹתֶיךָ
  choice: maajabu yako
  rationale: Ni usemi wa kawaida wa Kiswahili kwa matendo ya ajabu yanayoamsha mshangao.
- source_word: עָשִׂיתָ עִמָּהֶם
  choice: uliyofanya kati yao
  rationale: Neno עִם linaweza kumaanisha pamoja na au kati ya; hapa linaonyesha matendo ya Mungu yaliyotendeka katikati ya jumuiya.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: walifanya shingo zao kuwa ngumu
  rationale: Huhifadhi taswira ya Kiebrania ya ukaidi kwa lugha inayoeleweka, bila kuibadili moja kwa moja kuwa tafsiri ya tabia.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: wakamweka kiongozi
  rationale: Usemi halisi wa ‘kuweka kichwa’ hapa ni nahau ya kumteua au kumweka mtu aongoze.
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: ili warudi utumwani mwao
  rationale: עַבְדוּת humaanisha hali ya utumwa; ‘utumwani mwao’ ni ya asili na wazi katika muktadha wa kutoka Misri.
- source_word: בְּמִרְיָם
  choice: katika uasi wao
  rationale: Kirai hiki kinaonyesha mazingira ya kitendo cha kumweka kiongozi na kinawekwa karibu na kitendo hicho.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: Mungu mwenye kusamehe
  rationale: Wingi wa nomino dhahania unasisitiza wingi au ukamilifu wa msamaha; Kiswahili cha kawaida huonyesha sifa hiyo kwa ‘mwenye kusamehe,’ huku umbo la chanzo likielezwa katika tanbihi.
- source_word: חַנּוּן וְרַחוּם
  choice: mwenye neema na huruma
  rationale: Hutofautisha fadhili inayotolewa kwa neema na huruma yenye kuguswa na hali ya mwingine.
- source_word: אֶרֶךְ אַפַּיִם
  choice: si mwepesi wa hasira
  rationale: Ni tafsiri ya maana ya nahau ya Kiebrania, yenye kueleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: רַב־חֶסֶד
  choice: umejaa upendo thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, na ushikamanifu wa agano; ‘upendo thabiti’ huhifadhi uzito huo bila kuufungamanisha na istilahi ya dhehebu.
- source_word: וְלֹא עֲזַבְתָּם
  choice: nawe hukuwaacha
  rationale: Hutoa maana ya kutowaacha au kutowatelekeza kwa Kiswahili cha kawaida na chenye nguvu ya kimahusiano.
theological_decisions:
- issue: Maelezo ya tabia ya Mungu na wingi wa סְלִיחוֹת
  choice: Mungu mwenye kusamehe[a], mwenye neema na huruma, si mwepesi wa hasira, na umejaa upendo thabiti
  alternative: Mungu wa misamaha, mwenye fadhili na rehema, mwenye kukawia hasira na mwingi wa fadhili za agano
  rationale: Chaguo kuu ni la asili kwa Kiswahili na huhifadhi mlolongo wa sifa za Mungu. Tanbihi inatunza wingi wa msisitizo katika סְלִיחוֹת, na ‘upendo thabiti’ huacha upana wa חֶסֶד bila kuubana kuwa fundisho maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Taswira ya shingo ngumu imehifadhiwa kwa sababu inaeleweka kimuktadha; nahau isiyo wazi ya ‘kuweka kichwa’ imetafsiriwa kwa maana yake.
