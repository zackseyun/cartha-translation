base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: sw
  text: Uliwapa falme na mataifa, ukawagawia kwa sehemu mbalimbali.[a] Basi wakaimiliki nchi ya Sihoni, yaani, nchi ya mfalme wa Heshboni, na nchi ya Ogu, mfalme wa Bashani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “kwa upande” au “kwa ukingo.” Maana kamili ya kirai cha Kiebrania hapa si hakika; yaweza kumaanisha kugawa kwa sehemu au kwa maeneo ya pembezoni.'
    reason: Huhifadhi utata wa לְפֵאָה bila kudai ushahidi wa mapokeo ya kale ambao haujaainishwa.
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: falme na mataifa
  rationale: Huwakilisha kwa kawaida na kwa heshima 'kingdoms and peoples'; katika muktadha huu 'mataifa' linafaa kwa jumuiya za watu zilizotawaliwa.
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: ukawagawia kila upande
  rationale: Kitenzi kinaeleza kugawa au kuwatengea, huku לְפֵאָה ikiwa na wazo la upande/eneo la pembezoni. Tafsiri hii huhifadhi taswira ya mgawanyo wa kieneo bila kuifanya iwe sahihi kupita ushahidi wa Kiebrania.
- source_word: וַיִּירְשׁוּ
  choice: wakaimiliki
  rationale: Katika simulizi la kupewa nchi, neno hili lina maana ya kuingia na kuitwaa kama milki; 'wakaimiliki' ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: אֶרֶץ
  choice: nchi
  rationale: Ni tafsiri ya kawaida katika muktadha wa maeneo yaliyotawaliwa na wafalme waliotajwa.
theological_decisions:
- issue: Uhusiano kati ya 'nchi ya Sihoni' na 'nchi ya mfalme wa Heshboni'
  choice: yaani, nchi ya mfalme wa Heshboni
  alternative: na nchi ya mfalme wa Heshboni
  rationale: Masora ya WLC yana וְאֶת kabla ya kirai cha pili, lakini muktadha na ulinganisho wa Sihoni na Ogu huunga mkono kuelewa kirai hiki kama ufafanuzi wa nchi ya Sihoni. Alama ya tanbihi huhifadhi tofauti halisi ya kimaandishi/kisintaksia.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Majina yametolewa kwa maumbo yanayotambulika kwa wasomaji wa Biblia ya Kiswahili: Sihoni, Heshboni, Ogu, Bashani.'
