  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: sw
  text: Uliiona taabu ya baba zetu huko Misri, na ukasikia kilio chao kando ya Bahari ya Shamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Bahari ya Matete.” Kwa kawaida hutafsiriwa “Bahari ya Shamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Uliiona
  rationale: Muundo wa moja kwa moja unaendeleza usemi kwa Mungu katika nafsi ya pili na unaashiria kwamba aliitambua hali yao.
- source_word: עֳנִי
  choice: taabu
  rationale: Neno hili la kawaida na lenye uzito linaeleza mateso na hali ngumu bila kubainisha kupita kiasi chanzo chake.
- source_word: אֲבֹתֵינוּ
  choice: baba zetu
  rationale: Huhifadhi umbo la kiume la Kiebrania na rejeo kwa mababu wa jumuiya; katika muktadha huu ni usemi wa kibiblia unaoeleweka.
- source_word: בְּמִצְרָיִם
  choice: huko Misri
  rationale: Hutoa mahali pa taabu kwa Kiswahili cha asili; 'huko' linafaa kwa mahali panaporejelewa katika simulizi la zamani.
- source_word: זַעֲקָתָם
  choice: kilio chao
  rationale: Huonyesha sauti ya kuomba msaada iliyotokana na dhiki kwa lugha ya kawaida na yenye hadhi.
- source_word: שָׁמַעְתָּ
  choice: ukasikia
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi wazo la Mungu kusikia ombi lao bila kuongeza kwa wazi tendo la kuitikia.
- source_word: עַל
  choice: kando ya
  rationale: Katika uhusiano na mahali, kihusishi hiki kinaweza kumaanisha kuwa karibu na au pembeni mwa bahari.
- source_word: יַם סוּף
  choice: Bahari ya Shamu
  rationale: Hili ndilo jina la jadi na linalotambulika sana katika Kiswahili kwa eneo hili; maana ya vipashio vya Kiebrania imewekwa katika tanbihi.
