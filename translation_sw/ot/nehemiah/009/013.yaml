source:
  edition: WLC
  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: sw
  text: Ulishuka kwenye Mlima Sinai, ukasema nao kutoka mbinguni[a], ukawapa hukumu za haki[b], sheria za kweli[c], kanuni nzuri na amri nzuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukawaambia kutoka mbinguni.” Kiebrania kina “ukasema nao,” ingawa kwa Kiswahili “ukawaambia” pia linaweza kutumika.
    reason: lexical_alternative
  - marker: b
    text: Au, “hukumu zilizo nyofu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “maagizo ya kweli” au “sheria za ukweli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: Ulishuka juu ya Mlima Sinai
  rationale: ‘Ulishuka’ ni tafsiri ya kawaida na yenye uhai ya ירד katika maombi yanayomwelekea Mungu. ‘Juu ya Mlima Sinai’ huhifadhi mahali panapotajwa na עַל bila kufanya Kiswahili kuwa kigumu.
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: ukasema nao kutoka mbinguni
  rationale: ‘Ukasema nao’ huhifadhi maana ya kitenzi דבר pamoja na kihusishi עִם (‘pamoja na/nao’), huku ‘kutoka mbinguni’ ikitafsiri מִשָּׁמָיִם kwa uwazi.
- source_word: וַתִּתֵּן לָהֶם
  choice: ukawapa
  rationale: Ni tafsiri fupi na ya kawaida ya נתן pamoja na ל, na inaendeleza nafsi ya pili ya sala.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: hukumu za haki
  rationale: ‘Hukumu’ huhifadhi maana ya kisheria ya מִשְׁפָּטִים. Katika Kiswahili cha sasa, ‘za haki’ hueleza kwa kawaida kwamba hukumu hizo ni sawa na adilifu, maana inayolingana na יְשָׁרִים.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: sheria za kweli
  rationale: Wingi תוֹרוֹת katika orodha hii ya kisheria unaweza kumaanisha sheria au maagizo. ‘Sheria za kweli’ ni ya asili katika Kiswahili na huhifadhi sifa ya ukweli na utegemevu iliyo katika אֱמֶת.
- source_word: חֻקִּים
  choice: masharti
  rationale: ‘Masharti’ yanafaa kwa kanuni zilizowekwa na yanatofautisha חֻקִּים na hukumu, sheria, na amri nyingine katika orodha.
- source_word: וּמִצְוֺת
  choice: amri
  rationale: ‘Amri’ ni neno la kawaida na lenye uzito unaofaa kwa מִצְוֺת katika muktadha wa agano.
- source_word: טוֹבִים
  choice: mazuri ... nzuri
  rationale: Kivumishi hiki kinaeleweka kuhusiana na ‘masharti’ na ‘amri.’ Kimerudiwa kwa upatanisho sahihi wa kisarufi wa Kiswahili na ili kuonyesha wazi kuwa makundi yote mawili ni mema.
theological_decisions:
- issue: Kutofautisha istilahi nne za sheria katika orodha
  choice: hukumu, sheria, masharti, na amri
  alternative: Kufupisha orodha kuwa ‘sheria na amri,’ au kutafsiri תוֹרוֹת kuwa ‘maagizo’
  rationale: Kiebrania kinakusanya nomino kadhaa za kisheria ili kusisitiza utajiri na uaminifu wa ufunuo wa Mungu huko Sinai. Kuzitofautisha kunahifadhi muundo huo bila kuingiza mfumo maalumu wa kimadhehebu.
- issue: Uhusiano wa Mungu na watu katika וְדַבֵּר עִמָּהֶם
  choice: ukasema nao
  alternative: ukawaambia
  rationale: Kihusishi עִם kwa msingi wake ni ‘na/pamoja na.’ ‘Ukasema nao’ huhifadhi namna hiyo ya usemi na uwezekano wa wazo la kuwasiliana nao, bila kukataa tafsiri ya kawaida ya ‘ukawaambia.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sala na hadhi inayofaa maandiko. Msamiati wa kisheria umetofautishwa bila kutumia maneno ya kitaalamu yasiyoeleweka kwa msomaji wa kawaida.
