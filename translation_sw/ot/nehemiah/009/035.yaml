  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: sw
  text: Hata katika ufalme wao, na katika wema wako mwingi uliowapa, na katika nchi pana na yenye rutuba uliyoweka mbele yao,[a] hawakukutumikia[b] wala hawakuacha matendo yao maovu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “nchi pana na nono”; “nono” hapa ni nahau inayomaanisha nchi yenye rutuba.
    reason: cultural_note
  - marker: b
    text: Au, “hawakukuabudu.” Kitenzi cha Kiebrania kinaweza kuhusisha huduma na ibada.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “wala hawakugeuka kutoka katika matendo yao maovu”; yaweza pia kutafsiriwa, “wala hawakutubu na kuacha matendo yao maovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: walipokuwa katika ufalme wao
  rationale: Neno מַלְכוּת linaweza kumaanisha ufalme, utawala, au enzi. Hapa linaonyesha hali yao ya kuishi katika ufalme wao; muundo huu ni wa kawaida katika Kiswahili na huhifadhi maana ya kihistoria.
- source_word: וּבְטוּבְךָ הָרָב
  choice: wakifurahia wema wako mwingi
  rationale: טוּב hujumuisha wema na ukarimu unaoleta ustawi. 'Wakifurahia' huonyesha kwamba waliishi katikati ya wema huo bila kuufanya kuwa sifa ya kimaadili pekee.
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: uliowapa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo la Mungu kuwapa wema au neema zake.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: nchi pana na yenye rutuba
  rationale: רְחָבָה ni 'pana,' na שְׁמֵנָה ni 'nenepa' kihalisi lakini ni nahau ya ardhi yenye rutuba na utajiri wa mazao.
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: uliyoweka mbele yao
  rationale: Huhifadhi taswira ya לִפְנֵיהֶם, 'mbele yao,' huku ikieleza kwa Kiswahili cha kawaida kuwa Mungu aliwakabidhi nchi hiyo.
- source_word: לֹא עֲבָדוּךָ
  choice: hawakukutumikia
  rationale: עבד kuhusu Mungu hujumuisha ibada, utiifu, na huduma ya agano. 'Kukutumikia' huhifadhi upana huo kuliko 'kukuabudu' pekee.
- source_word: וְלֹא שָׁבוּ
  choice: wala hawakuacha
  rationale: שׁוב pamoja na מן humaanisha kugeuka au kuacha jambo. 'Hawakuacha' ni Kiswahili cha asili kinachoeleza kugeuka kutoka katika mwenendo mbaya bila kutumia istilahi ya kitheolojia pekee.
- source_word: מִמַּעַלְלֵיהֶם הָרָעִים
  choice: matendo yao maovu
  rationale: מַעֲלָלִים ni matendo au mienendo; 'matendo yao maovu' ni wazi, ya kawaida, na huhifadhi hukumu ya kimaadili ya maandishi.
theological_decisions:
- issue: Maana ya עבד inapomhusu Mungu
  choice: hawakukutumikia
  alternative: hawakukuabudu
  rationale: Kitenzi hiki kinahusisha ibada pamoja na utiifu na huduma kwa Mungu. 'Kukutumikia' hakipunguzi maana kuwa ibada ya kidini pekee.
- issue: Maana ya שׁוב מן katika muktadha wa maadili
  choice: hawakuacha matendo yao maovu
  alternative: hawakutubu matendo yao maovu / hawakugeuka kutoka katika matendo yao maovu
  rationale: Maandishi yanaeleza kugeuka kutoka katika matendo maovu. 'Hawakuacha' ni ya asili katika Kiswahili, huku tanbihi ikihifadhi taswira halisi ya kugeuka na maana inayoweza kueleweka kuwa kutubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa kuwa wa asili kwa kutumia 'wakifurahia,' huku urudiaji wa mazingira ya baraka na lawama kuu ya mstari ukihifadhiwa.
