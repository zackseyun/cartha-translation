  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: sw
  text: Lakini kwa wingi wa rehema zako, hukuwaangamiza kabisa wala hukuwaacha[a], kwa maana wewe ni Mungu mwenye neema na huruma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukuwakomesha wala hukuwatelekeza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: Lakini kwa wingi wa rehema zako
  rationale: Kiunganishi cha mwanzo kina nguvu ya utofautishaji katika muktadha. רַחֲמִים pamoja na הָרַבִּים huonyesha rehema nyingi au tele; usemi huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: hukuwaangamiza kabisa
  rationale: Nahau עשה כלה humaanisha kuwafikisha mwisho au kuwaangamiza. Tafsiri hii inaeleza kwa uwazi nguvu ya nahau, huku 'kabisa' ikihifadhi wazo la ukamilifu.
- source_word: וְלֹא עֲזַבְתָּם
  choice: wala hukuwaacha
  rationale: עזב humaanisha kuacha au kutelekeza. 'Hukuwaacha' ni ya asili katika Kiswahili na, katika muktadha huu, ina maana ya kutowatelekeza.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linaanzisha sababu ya Mungu kutowaangamiza wala kuwaacha.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa אֵל ni jina la kawaida la kumtaja Mungu; hakuna ulazima wa kuongeza wazo la uweza.
- source_word: חַנּוּן
  choice: mwenye neema
  rationale: Huhifadhi wazo la kutoa fadhili kwa neema na kulitofautisha na רַחוּם linalofuata.
- source_word: וְרַחוּם
  choice: na huruma
  rationale: Usemi 'mwenye neema na huruma' ni wa asili, unaeleweka, na unadumisha kwa kadiri inayowezekana tofauti kati ya sifa hizi mbili.
- source_word: אָתָּה
  choice: wewe ni
  rationale: Kiwakilishi huru kina mkazo. Kuweka 'wewe' wazi kabla ya 'ni' kunahifadhi mkazo huo katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya kauli kuhusu tabia ya Mungu חַנּוּן וְרַחוּם
  choice: Mungu mwenye neema na huruma
  alternative: Mungu mwenye fadhili na rehema
  rationale: Uteuzi huu unahifadhi tofauti ya kimsamiati kati ya sifa hizo mbili bila kuongeza fundisho la dhehebu. Pia huepuka kurudia tu neno 'rehema' lililotumika mwanzoni.
- issue: Nguvu ya waw ya mwanzo
  choice: Lakini
  alternative: Na
  rationale: Katika mtiririko wa sala, sentensi hii inatofautisha uasi wa watu na rehema ya Mungu, hivyo 'Lakini' huonyesha wazi kazi ya kiunganishi katika muktadha.
- issue: Nguvu ya nahau עשה כלה
  choice: hukuwaangamiza kabisa
  alternative: hukuwakomesha
  rationale: Nahau inaweza kueleza kuwafikisha mwisho au kuwaangamiza. 'Kuwaangamiza kabisa' ni wazi kwa msomaji wa leo bila kubainisha njia ya maangamizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kusomeka kwa watu wa kawaida, huku ukihifadhi utofautishaji wa muktadha, ukamilifu wa nahau, na kauli ya tabia ya Mungu.
