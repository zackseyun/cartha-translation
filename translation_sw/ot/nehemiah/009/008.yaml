id: NEH.9.8
reference: Nehemiah 9:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: sw
  text: Uliuona moyo wake kuwa mwaminifu mbele zako, ukafanya naye agano la kutoa nchi ya Wakanaani, Wahiti, Waamori, Waperizi, Wayebusi na Wagirgashi, na kuipa uzao wake[a]. Ukayatimiza maneno yako[b], kwa maana wewe ni mwenye haki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wake.” Neno la Kiebrania linalomaanisha “uzao” liko katika umoja lakini linaweza kutaja wazao kwa pamoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “ukayathibitisha maneno yako” au “ukayafanya maneno yako yasimame.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wewe ni mwadilifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: Uliuona moyo wake kuwa mwaminifu mbele zako
  rationale: Ingawa מָצָא kwa kawaida ni ‘kupata’, hapa muundo huo unaeleza Mungu kutambua hali ya ndani ya Abrahamu. ‘Uliuona ... kuwa’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuifanya kuwa ugunduzi usiotarajiwa. ‘Moyo’ huhifadhi taswira ya Kiebrania ya nafsi ya ndani, na ‘mwaminifu’ huonyesha uaminifu na utegemekaji wa נֶאֱמָן.
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: ukafanya naye agano
  rationale: כרת ברית ni nahau ya Kiebrania yenye maana ya kufanya agano. Tafsiri ya neno kwa neno ‘kukata agano’ si Kiswahili cha kawaida.
- source_word: לָתֵת אֶת־אֶרֶץ ... לָתֵת לְזַרְעוֹ
  choice: la kutoa nchi ... na kuipa uzao wake
  rationale: Kiebrania hurudia לָתֵת baada ya orodha ndefu ya mataifa. Kiswahili hiki kinadumisha dhana ya kutoa na marudio yake kwa mtiririko unaoeleweka, huku kikionyesha wazi kwamba nchi ndiyo inayopewa uzao wake.
- source_word: הַכְּנַעֲנִי ... הַגִּרְגָּשִׁי
  choice: Wakanaani, Wahiti, Waamori, Waperizi, Wayebusi na Wagirgashi
  rationale: Majina ya Kiebrania yako katika umoja wa kijumla, lakini Kiswahili cha kawaida hutaja makabila au mataifa haya kwa wingi.
- source_word: לְזַרְעוֹ
  choice: uzao wake
  rationale: זֶרַע ni nomino ya kijumla inayoweza kumaanisha uzao au wazao. ‘Uzao wake’ huhifadhi umbo la kijumla na upana wa maana.
- source_word: וַתָּקֶם אֶת־דְּבָרֶיךָ
  choice: Ukayatimiza maneno yako
  rationale: Katika muktadha huu, קום pamoja na ‘maneno’ humaanisha kuyafanya yatimie. ‘Maneno yako’ huhifadhi wingi wa Kiebrania badala ya kufasiri moja kwa moja kuwa ‘ahadi zako’.
- source_word: כִּי צַדִּיק אָתָּה
  choice: kwa maana wewe ni mwenye haki
  rationale: כִּי inaeleza sababu, na צַדִּיק hapa inasifu uadilifu mpana wa Mungu katika kutimiza agano. ‘Mwenye haki’ ni ya kawaida, yenye heshima, na pana kuliko maana ya kimahakama pekee.
theological_decisions:
- issue: Maana ya צַדִּיק inaposemwa kuhusu Mungu
  choice: mwenye haki
  alternative: mwadilifu
  rationale: Maneno yote mawili yanawezekana. ‘Mwenye haki’ huhifadhi maana pana ya uadilifu wa kimaadili na uaminifu wa kiagano; ‘mwadilifu’ inaweza kusisitiza zaidi utekelezaji wa haki. Tanbihi inadumisha uwezekano huo bila kuubana mstari katika maana ya kimahakama tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Majina ya mataifa yametolewa kwa wingi wa kijumla unaotumiwa kwa kawaida katika Kiswahili. Muundo wa sentensi unahifadhi mfuatano wa Kiebrania—kutambua uaminifu, kufanya agano, kutoa nchi, na kutimiza maneno—bila kuleta istilahi za dhehebu.
