language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: sw
  text: Lakini wewe, kwa rehema zako nyingi[a], hukuwaacha nyikani. Nguzo ya wingu haikuondoka kutoka juu yao wakati wa mchana ili kuwaongoza njiani, wala nguzo ya moto haikuondoka wakati wa usiku ili kuwapa mwanga na kuangaza njia ambayo wangepitia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa huruma yako kuu.” Kiebrania kinatumia nomino ya wingi, yaani kihalisi “kwa rehema zako nyingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: kwa rehema zako nyingi
  rationale: Neno רַחֲמִים liko katika wingi na hueleza rehema au huruma; “rehema zako nyingi” huhifadhi wingi na kivumishi הָרַבִּים huku ikibaki Kiswahili cha kawaida.
- source_word: עֲזַבְתָּם
  choice: hukuwaacha
  rationale: Kitenzi עזב kinaweza kumaanisha kuacha au kutelekeza. “Hukuwaacha” ni cha asili katika muktadha huu na kinaeleza kwamba Mungu hakuwatupa jangwani.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר ni eneo la nyika au jangwa. “Nyikani” linafaa kwa mazingira ya safari ya Israeli bila kudokeza lazima jangwa la mchanga tu.
- source_word: עַמּוּד הֶעָנָן
  choice: nguzo ya wingu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya muundo huu, inayohifadhi picha inayotoka katika simulizi la Kutoka.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: haikuondoka juu yao
  rationale: סוּר humaanisha kuondoka au kugeuka kando, na מֵעֲלֵיהֶם huhifadhi mahali pake “juu yao.”
- source_word: בְּיוֹמָם
  choice: wakati wa mchana
  rationale: Usemi wa kawaida wa Kiswahili unaotofautishwa kwa wazi na “wakati wa usiku.”
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: ili kuwaongoza njiani
  rationale: נחה katika Hiphil humaanisha kuongoza; “njiani” huwasilisha בְּהַדֶּרֶךְ kwa Kiswahili cha asili.
- source_word: עַמּוּד הָאֵשׁ
  choice: nguzo ya moto
  rationale: Tafsiri ya kawaida na ya uwazi, sambamba na “nguzo ya wingu.”
- source_word: בַּלַּיְלָה
  choice: wakati wa usiku
  rationale: Usemi huu hudumisha usambamba wa mchana na usiku.
- source_word: לְהָאִיר לָהֶם וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: ili kuwaangazia njia ambayo wangepitia
  rationale: Muundo wa Kiebrania unaunganisha kuwapa mwanga na njia watakayoiendea. Kiswahili “kuwaangazia njia” huwasilisha maana hiyo kwa asili bila kudai kwamba “njia” ilikuwa kitu tofauti walichopewa.
theological_decisions:
- issue: Lugha kuhusu rehema za Mungu
  choice: rehema zako nyingi
  alternative: huruma yako kuu
  rationale: Wingi wa Kiebrania רַחֲמִים umehifadhiwa ili kuonyesha wingi wa matendo ya Mungu yenye rehema, bila kuubadili kuwa nomino ya umoja.
- issue: Uhusiano wa mwanga na njia katika kishazi cha mwisho
  choice: kuwaangazia njia ambayo wangepitia
  alternative: kuwapa mwanga wao pamoja na njia ambayo wangepitia
  rationale: Kiebrania kina muundo mgumu wenye לָהֶם na אֶת הַדֶּרֶךְ. Tafsiri iliyochaguliwa huhifadhi kwamba mwanga uliwasaidia katika njia yao, bila kuingiza wazo la kitheolojia lisilokuwamo au kufanya njia ionekane kama kitu tofauti walichopewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi hudumisha usambamba wa nguzo ya wingu mchana na nguzo ya moto usiku; kitenzi katika sehemu ya pili kinaeleweka kwa udondoshaji wa kawaida baada ya “wala.”
