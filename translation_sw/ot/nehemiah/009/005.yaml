base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: sw
  text: Kisha Walawi—Yeshua, Kadmieli, Bani, Hashabneya, Sherebia, Hodia, Shebania na Pethahia—wakasema, “Simameni, mmbariki Yahweh Mungu wenu tangu milele hata milele. Nao wabariki[a] jina lako tukufu, lililotukuka juu ya baraka na sifa zote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kitenzi cha Kiebrania ni cha nafsi ya tatu wingi na kina maana ya hiari au ombi: “Nao na wabariki jina lako tukufu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ הַלְוִיִּם
  choice: Kisha Walawi ... wakasema
  rationale: Waw inayosogeza simulizi mbele imetafsiriwa kwa ‘Kisha’; ‘Walawi’ ni istilahi ya kawaida ya Kiswahili, na wingi umehifadhiwa katika kitenzi.
- source_word: קוּמוּ בָּרֲכוּ
  choice: Simameni, mmbariki
  rationale: Vitenzi vyote ni amri za wingi. ‘Simameni’ na ‘mmbariki’ ni Kiswahili cha sasa kinachofaa wito wa hadharani wa ibada.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh Mungu wenu
  rationale: Jina la agano יְהוָה limetoholewa kama ‘Yahweh’, na kiambishi cha nafsi ya pili wingi katika אֱלֹהֵיכֶם kimehifadhiwa kwa ‘wenu’.
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: tangu milele hata milele
  rationale: Nahau hii inaonyesha muda usio na mpaka; usemi huu ni wa asili na wenye hadhi katika Kiswahili cha ibada.
- source_word: וִיבָרְכוּ
  choice: Na walibariki
  rationale: Umbo la Kiebrania ni nafsi ya tatu wingi lenye maana ya hiari au ombi. Kiswahili hakina umbo sambamba lisilo na utata; ‘walibariki’ huhifadhi mhusika wa wingi, huku tanbihi ikionyesha maana ya hiari ‘na walibariki’.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: jina lako tukufu
  rationale: Hii ni tafsiri ya asili ya muundo halisi ‘jina la utukufu wako’, bila kupoteza wazo la utukufu wa jina.
- source_word: וּמְרוֹמַם עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: lililotukuka kuliko baraka na sifa zote
  rationale: Kauli ya jina kuwa juu ya kila baraka na sifa imewasilishwa kwa Kiswahili kinachoeleweka na chenye hadhi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Mhusika na hali ya וִיבָרְכוּ
  choice: Na walibariki ... pamoja na tanbihi ya maana ya hiari
  alternative: Jina lako tukufu libarikiwe
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu wingi, si umoja wa kutendwa. Tafsiri maarufu ya ‘libarikiwe’ husawazisha sentensi lakini hubadili sarufi na kuficha mvutano wa matini; tanbihi huhifadhi uwezekano wa hiari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya ibada. Majina yametoholewa kwa maumbo yanayotamkika kwa Kiswahili; sentensi imehifadhi mabadiliko ya mhusika katika Kiebrania badala ya kuyageuza kuwa kauli ya umoja ya kutendwa.
