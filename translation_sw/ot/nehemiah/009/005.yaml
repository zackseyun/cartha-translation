    reason: alternative_reading
  revision_rationale: 'The text is revised only where necessary: the Hebrew plural volitive is represented by the Swahili third-person plural subjunctive “wabariki,” with “Nao” retaining the connective progression. The footnote now anchors the relevant verb and explains its volitive force. “Juu ya” closely reflects the Hebrew preposition while preserving natural liturgical register.'
