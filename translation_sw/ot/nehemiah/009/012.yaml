  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: sw
  text: Kwa nguzo ya wingu uliwaongoza mchana, na kwa nguzo ya moto usiku ili kuwaangazia njia ambayo walipaswa kuifuata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/עַמּוּד עָנָן
  choice: Kwa nguzo ya wingu
  rationale: ‘Kwa’ linaonyesha njia au chombo ambacho Mungu alitumia kuwaongoza, bila kulazimisha maana ya mahali pekee.
- source_word: הִנְחִיתָם
  choice: uliwaongoza
  rationale: Hifili ya נחה hapa ina maana ya kuongoza; ‘uliwaongoza’ ni ya kawaida na inafaa muktadha wa safari jangwani.
- source_word: יוֹמָם
  choice: mchana
  rationale: Ni usemi wa wakati unaolingana kwa uwazi na ‘usiku’ katika kishazi sambamba.
- source_word: וּ/בְ/עַמּוּד אֵשׁ
  choice: na kwa nguzo ya moto
  rationale: Muundo huu unadumisha usambamba na ‘kwa nguzo ya wingu’ na maana ya chombo cha uongozi.
- source_word: לַיְלָה
  choice: usiku
  rationale: Ni tafsiri ya kawaida ya usemi wa wakati na ni kinyume sambamba cha ‘mchana’.
- source_word: לְהָאִיר לָהֶם אֶת הַדֶּרֶךְ
  choice: ili kuwaangazia njia
  rationale: Muundo wa Kiebrania unaonyesha kusudi na unaifanya ‘njia’ kuwa kitu kinachoangaziwa; Kiswahili hiki ni cha asili na kinahifadhi uhusiano huo bila kuhitaji tanbihi.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: ambayo walipaswa kuifuata
  rationale: Kitenzi הלך kimsingi ni kwenda au kutembea, lakini kwa ‘njia’ Kiswahili cha asili husema ‘kuifuata’; ‘walipaswa’ linaonyesha njia iliyokusudiwa kwao.
theological_decisions:
- issue: Taswira ya uongozi wa Mungu katika mapokeo ya jangwani
  choice: Kutafsiri moja kwa moja tendo la kihistoria la Mungu la kuwaongoza Israeli kwa nguzo ya wingu na nguzo ya moto.
  alternative: Kufafanua nguzo hizo hasa kama udhihirisho wa uwepo wa Mungu au kuingiza maana ya kiishara.
  rationale: Matini inasisitiza kuongoza na kuangazia njia. Tafsiri haiongezi ufafanuzi wa kitipolojia au wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa ‘kwa nguzo ya wingu ... na kwa nguzo ya moto’ umehifadhiwa; sentensi ni wazi kwa msomaji wa kawaida.
