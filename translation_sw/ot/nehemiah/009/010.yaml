base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: sw
  text: Ukatenda ishara na maajabu dhidi ya Farao, dhidi ya watumishi wake wote, na dhidi ya watu wote wa nchi yake, kwa maana ulijua kwamba walitenda kwa kiburi dhidi yao[a]. Hivyo ukajifanyia jina, kama ilivyo leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walitenda kwa majivuno dhidi yao.” Kitenzi cha Kiebrania kinaweza kumaanisha kutenda kwa kiburi, kwa majivuno, au kwa ufidhuli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Ukatenda
  rationale: Ingawa kitenzi hiki kimsingi ni ‘kutoa’ au ‘kuweka,’ pamoja na ‘ishara na maajabu’ kinamaanisha Mungu alivitenda au kuvionyesha.
- source_word: אֹתֹת וּמֹפְתִים
  choice: ishara na maajabu
  rationale: Huhifadhi jozi ya maneno inayotaja matendo ya ajabu ya Mungu yenye kuwa ishara na pia kushangaza.
- source_word: בְּפַרְעֹה ... וּבְכָל עֲבָדָיו ... וּבְכָל עַם אַרְצוֹ
  choice: dhidi ya Farao ... dhidi ya watumishi wake wote ... dhidi ya watu wote wa nchi yake
  rationale: Kihusishi בְּ hapa kinaonyesha wale waliopatwa na hukumu kupitia ishara hizo; ‘dhidi ya’ huonyesha maana hiyo ya upinzani kwa uwazi.
- source_word: הֵזִידוּ עֲלֵיהֶם
  choice: waliwatendea kwa kiburi
  rationale: Kitenzi הֵזִידוּ kinaonyesha kutenda kwa kiburi, majivuno, au ukaidi; ‘waliwatendea kwa kiburi’ ni Kiswahili cha kawaida na huhifadhi pia kishamirisho cha wingi ‘wao.’
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: ukajipatia jina mashuhuri
  rationale: Nahau hii inamaanisha kujipatia umaarufu au sifa inayojulikana; ‘jina mashuhuri’ huhifadhi taswira ya ‘jina’ huku ikieleza maana yake kwa Kiswahili cha sasa.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: ambalo linadumu mpaka leo
  rationale: Kirai hiki kinaonyesha kwamba matokeo hayo yanaendelea kuwapo hadi wakati wa msemaji.
theological_decisions:
- issue: Wanaorejelewa na ‘wao’ katika עֲלֵיהֶם
  choice: Kiwakilishi ‘wa-’ kimeachwa bila kubadilishwa kuwa jina maalumu; kwa muktadha kinaelekea kuwarejelea Waisraeli waliotendewa kwa kiburi.
  alternative: Kutaja wazi ‘watu wako’ au kuelewa kiburi hicho kuwa kilielekezwa kwa Mungu kwa ujumla.
  rationale: Muktadha wa Kutoka unaunga mkono kurejelewa kwa Israeli, lakini maandishi ya Kiebrania yenyewe yanatumia kiwakilishi tu; tafsiri hailazimishi ufafanuzi zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mfuatano wa ‘dhidi ya’ umerudiwa ili kuhifadhi msisitizo wa Kiebrania; alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
