id: NEH.9.28
reference: Nehemiah 9:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: sw
  text: Lakini walipopata utulivu, walifanya tena maovu mbele zako; kwa hiyo ukawaacha katika mamlaka ya adui zao[a], nao wakawatawala. Kisha wakakurudia na kukulilia, nawe ukasikia kutoka mbinguni na kuwaokoa mara nyingi kwa kadiri ya rehema zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “mkononi mwa adui zao,” nahau yenye maana ya kuwa chini ya mamlaka au udhibiti wa adui zao.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: Lakini walipopata utulivu
  rationale: Muundo huu unaonyesha hali ya wakati ambapo walirudia kutenda maovu, bila kuongeza wazo lisilokuwapo la kwamba walifanya hivyo mara tu baada ya kupata utulivu.
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: walifanya tena maovu
  rationale: Kitenzi cha kurudi pamoja na kitenzi-jina hapa kina maana ya kurudia tendo; Kiswahili hiki ni cha asili na hutofautisha matumizi haya na kurudi kwao kwa Mungu baadaye.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Hudumisha picha ya kuwa mbele ya Mungu na uzito wa uhusiano, bila kuifasiri moja kwa moja kuwa 'dhidi yako'.
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: ukawaacha katika mamlaka ya adui zao
  rationale: ‘Ukawaacha’ haidokezi lazima kuachwa kabisa milele, na ‘katika mamlaka’ huwasilisha maana ya nahau ya Kiebrania ‘katika mkono.’
- source_word: וַיִּרְדּוּ בָהֶם
  choice: nao wakawatawala
  rationale: Kitenzi kinaeleza kutumia mamlaka juu yao; ‘wakawatawala’ hudumisha maana ya msingi bila kuongeza moja kwa moja dhana ya kuwatesa.
- source_word: וַיָּשׁוּבוּ
  choice: wakakurudia
  rationale: Hapa kurudi kunaelekezwa kwa Mungu kulingana na mwendelezo wa sentensi; kiwakilishi cha yambwa huifanya maana hiyo iwe ya asili katika Kiswahili.
- source_word: וַיִּזְעָקוּךָ
  choice: na kukulilia
  rationale: Huwasilisha kilio cha dharura kilichoelekezwa kwa Mungu bila kuongeza maneno ya maelezo yasiyomo katika maandishi.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: ukasikia kutoka mbinguni
  rationale: Hudumisha mahali chanzo palipotangulizwa katika Kiebrania kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וְתַצִּילֵם
  choice: na kuwaokoa
  rationale: Katika muktadha huu ni kuwaokoa kutoka kwa adui; neno hili ni la kawaida na haliongezi maana ya kiteolojia iliyo nje ya muktadha.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: mara nyingi kwa kadiri ya rehema zako
  rationale: ‘Nyingi’ inaambatana na ‘mara,’ si ‘rehema’; tafsiri hii huhifadhi uhusiano sahihi wa kisarufi na kutaja rehema za Mungu kuwa msingi wa ukombozi.
theological_decisions:
- issue: Lugha ya Mungu kuwaacha
  choice: ukawaacha katika mamlaka ya adui zao
  alternative: ukawatelekeza mikononi mwa adui zao
  rationale: Chaguo hili hudumisha ukali wa hukumu ya agano lakini halidai kuachwa kabisa na Mungu, kwa kuwa muktadha huendelea na kusikia na kuokoa kwake.
- issue: Maana ya tendo lililorudiwa katika kifungu cha mwisho
  choice: ukasikia kutoka mbinguni na kuwaokoa mara nyingi
  alternative: ulikuwa ukisikia kutoka mbinguni na kuwaokoa mara nyingi
  rationale: Vitenzi vya Kiebrania vinaweza kufupisha matendo ya zamani yaliyorudiwa; wakati uliopita pamoja na ‘mara nyingi’ huwasilisha maana hiyo kwa Kiswahili wazi na kwa ufupi.
- issue: Kirekebishi רַבּוֹת kinaambatana na neno gani
  choice: mara nyingi kwa kadiri ya rehema zako
  alternative: kwa kadiri ya rehema zako nyingi
  rationale: Kisarufi, רַבּוֹת inaafikiana na עִתִּים, ‘mara/nyakati,’ wala si רַחֲמֶיךָ, ‘rehema zako’; kwa hiyo wingi unaeleza idadi ya ukombozi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Utulivu,’ ‘mamlaka,’ na ‘rehema’ ni maneno ya sasa na ya kawaida; muundo umetofautisha kurudia maovu na kuwakurudia Mungu.
