base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: sw
  text: Uliwafanya watoto wao[a] kuwa wengi kama nyota za mbinguni,[b] ukawaingiza katika nchi ambayo ulikuwa umewaambia baba zao waingie na kuimiliki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana wao wa kiume” au “wazao wao.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “kama nyota za mbinguni” yanakumbusha ahadi ya Mungu kwa mababu.
    reason: cross_reference
  - marker: c
    text: Au “waichukue kuwa milki yao”; katika miktadha mingine kitenzi hiki kinaweza kutafsiriwa “kuirithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: wana wao
  rationale: בנים inaweza kumaanisha wana wa kiume, watoto, au wazao. Katika muktadha wa kuongezeka kwa taifa, “wana wao” ni lugha ya kawaida inayodumisha uhusiano wa kifamilia bila kuwalenga wanaume pekee.
- source_word: הִרְבִּיתָ
  choice: uliwafanya ... kuwa wengi
  rationale: Hifili ya רבה inaonyesha kusababisha waongezeke kwa idadi. Kauli hii ni ya asili katika Kiswahili na inaweka wazi kwamba Mungu ndiye aliyesababisha ongezeko hilo.
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: kama nyota za mbinguni
  rationale: Tafsiri hii inafuata picha ya Kiebrania na kudumisha mwangwi wa ahadi kwa mababu huku ikiwa wazi kwa msomaji wa Kiswahili.
- source_word: וַתְּבִיאֵם
  choice: ukawaingiza
  rationale: Hifili ya בוא hapa ni kuleta au kusababisha waingie. “Ukawaingiza” linaonyesha kwa ufupi mwendo wa kuingia nchini na tendo la Mungu.
- source_word: אֶל הָאָרֶץ
  choice: katika nchi
  rationale: Baada ya kitenzi cha kuingiza, “katika nchi” linaonyesha kuingia ndani ya nchi, si kufika karibu nayo tu.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: ambayo ulikuwa umewaambia baba zao
  rationale: Kauli hii inadumisha rejeo la nchi na neno la Mungu lililotangulia kwa mababu. “Baba zao” huhifadhi lugha ya kifamilia ya maandishi.
- source_word: לָבוֹא
  choice: waingie
  rationale: Infinitivi ya בוא inaeleza jambo ambalo Mungu alikuwa amewaambia kuhusu nchi; “waingie” ni wazi na ya kawaida katika Kiswahili.
- source_word: לָרָשֶׁת
  choice: na kuimiliki
  rationale: ירשׁ inaweza kumaanisha kumiliki, kutwaa milki, au kurithi kulingana na muktadha. Hapa “kuimiliki” linaonyesha kuchukua na kushikilia nchi bila kulazimisha maana ya “kurithi.”
theological_decisions:
- issue: Mwangwi wa ahadi kwa mababu
  choice: Kudumisha maneno “kama nyota za mbinguni” na “baba zao”
  alternative: Kutumia maneno laini zaidi kama “kama nyota za angani” na “mababu zao”
  rationale: Lugha ya mstari huu inakumbusha ahadi ya Mungu kwa mababu. Tafsiri inadumisha uhusiano huo bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya ירשׁ katika kuipokea nchi
  choice: kuimiliki
  alternative: kuirithi au kuitwaa iwe milki yao
  rationale: Muktadha unasisitiza kuingia katika nchi na kuichukua kuwa milki. “Kuimiliki” huhifadhi maana hiyo, huku tanbihi ikitaja uwezekano halisi wa “kurithi.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa usomaji wa hadhara; “nyota za mbinguni” na “baba zao” zimedumishwa ili kuhifadhi mwangwi wa lugha ya ahadi.
