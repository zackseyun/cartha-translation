reference: Nehemiah 9:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: sw
  text: Wewe peke yako ndiwe Yahwe. Ulifanya mbingu, mbingu zilizo juu kabisa[a], pamoja na jeshi lake lote; dunia na vyote vilivyo juu yake; bahari na vyote vilivyomo ndani yake. Wewe unavihifadhi vyote hai[b], na jeshi la mbinguni linakusujudia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mbingu za mbingu,” usemi wenye maana ya mbingu zilizo juu kabisa.
    reason: lexical_alternative
  - marker: b
    text: Au “unavipa vyote uhai” au “unaviweka vyote hai.”
    reason: alternative_reading
  - marker: c
    text: Au “linakuabudu.” “Jeshi la mbinguni” linaweza kumaanisha viumbe vya mbinguni au vitu vya angani.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limetoholewa kama jina la Mungu badala ya kubadilishwa kwa cheo, kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אַתָּה הוּא ... לְבַדֶּךָ
  choice: Wewe peke yako ndiwe
  rationale: Muundo huu wa asili una mkazo na upekee; Kiswahili hiki ni cha kawaida na kinahifadhi msisitizo huo.
- source_word: עָשִׂיתָ
  choice: ulifanya
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi עשה; haibadilishwi kuwa kitenzi mahsusi zaidi cha ‘kuumba,’ ingawa muktadha ni wa uumbaji.
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: ‘Mbingu’ linafaa kwa muktadha mpana wa ulimwengu na ni la kawaida katika Kiswahili.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: mbingu zilizo juu kabisa
  rationale: Hutoa maana ya usemi halisi ‘mbingu za mbingu’ kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi umbo lake.
- source_word: צְבָאָם
  choice: jeshi lake lote
  rationale: Neno צבא linaweza kuhusisha vitu vya angani na/au viumbe vya mbinguni; ‘jeshi’ halifungii maana kwenye nyota pekee. Kiwakilishi cha umoja ‘lake’ kinakubaliana na ‘mbingu’ kama nomino ya ngeli ya 9 katika Kiswahili.
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: dunia na vyote vilivyo juu yake
  rationale: Katika orodha ya uumbaji, ארץ ni dunia kwa ujumla, wala si nchi fulani.
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: bahari na vyote vilivyomo ndani yake
  rationale: ‘Bahari’ ni tafsiri ya kawaida ya wingi wa Kiebrania na hapa hutumiwa kwa maana ya jumla.
- source_word: מְחַיֶּה אֶת כֻּלָּם
  choice: unavipa vyote uhai
  rationale: Kitenzi kinaweza kumaanisha kutoa uhai au kuendeleza uhai. Usemi huu ni wa asili katika Kiswahili na unahifadhi upana huo kwa kiasi kikubwa.
- source_word: וּצְבָא הַשָּׁמַיִם ... מִשְׁתַּחֲוִים
  choice: na jeshi la mbinguni linakuabudu
  rationale: ‘Jeshi la mbinguni’ linahifadhi upana wa צבא, na ‘linakuabudu’ linaonyesha kusujudu kwa heshima ya ibada katika muktadha huu.
theological_decisions:
- issue: Upekee wa Yahwe
  choice: Wewe peke yako ndiwe Yahwe
  alternative: Wewe ndiwe Yahwe, wewe peke yako
  rationale: Chaguo linadumisha mkazo wa Kiebrania kwamba Yahwe peke yake ndiye anayezungumziwa, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya tendo endelevu la מְחַיֶּה kwa viumbe vyote
  choice: unavipa vyote uhai
  alternative: unavihifadhi vyote hai
  rationale: Kiebrania kinaweza kumaanisha kutoa uhai au kudumisha uhai. Matini kuu inatumia usemi mpana na tanbihi inaweka wazi uwezekano wa maana ya kudumisha uhai.
- issue: Utambulisho wa צְבָא הַשָּׁמַיִם
  choice: jeshi la mbinguni
  alternative: viumbe vya mbinguni / nyota za mbinguni
  rationale: Neno hilo linaweza kuhusisha viumbe vya mbinguni au mpangilio wa vitu vya angani. Tafsiri pana huepuka kulifungia kwa kundi moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa kwa alama za mkato ili orodha ndefu isomeke kwa urahisi. Jina ‘Yahwe’ limehifadhiwa, na misemo yenye uwezekano zaidi ya mmoja imewekewa tanbihi.
