  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: sw
  text: Kwa hiyo ukawatia mikononi mwa adui zao, nao wakawadhulumu. Lakini wakati wa dhiki yao walikulilia, nawe ukasikia kutoka mbinguni. Kwa rehema zako nyingi, ukawapa waokozi[a], nao wakawaokoa kutoka mikononi mwa adui zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waokoaji.” Neno la Kiebrania linatokana na kitenzi “kuokoa” na hapa linamaanisha watu ambao Mungu aliwainua ili kuwaokoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: ukawatia mikononi mwa
  rationale: Muktadha unaonyesha kuwa Mungu aliwaweka chini ya mamlaka ya adui zao. Kiswahili ‘mikononi mwa’ kinahifadhi picha ya nahau ya Kiebrania huku kikieleweka kwa urahisi.
- source_word: צָרֵיהֶם
  choice: adui zao
  rationale: Neno hili humaanisha maadui au wapinzani wenye uhasama. ‘Adui zao’ ni la kawaida, wazi, na linaweza kurudiwa mwishoni kama katika Kiebrania.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: nao wakawadhulumu
  rationale: Kitenzi kina wazo la kuwabana, kuwaletea dhiki, au kuwaonea. ‘Wakawadhulumu’ linaonyesha ukandamizaji bila kulichanganya na nomino ‘dhiki’ inayofuata.
- source_word: וּבְעֵת צָרָתָם
  choice: Lakini wakati wa dhiki yao
  rationale: ‘Wakati wa dhiki yao’ linaonyesha wazi mazingira ya muda; ‘Lakini’ linaonyesha tofauti ya kimawazo kati ya kudhulumiwa na kumlilia Mungu.
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: walikulilia
  rationale: Kitenzi kinaonyesha kilio cha haraka kinachotokana na taabu, si mwito wa kawaida tu.
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: ukasikia kutoka mbinguni
  rationale: Tafsiri hii inadumisha mahali ambako kusikia kunatoka kulingana na muundo wa Kiebrania, na wakati uliopita unafaa simulizi la matendo ya Mungu katika historia.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: Kwa kadiri ya rehema zako nyingi
  rationale: ‘Rehema zako nyingi’ inadumisha wingi wa רַחֲמִים na kivumishi ‘nyingi,’ huku ‘kwa kadiri ya’ kikionyesha kuwa tendo la Mungu liliendana na rehema zake.
- source_word: מֹשִׁיעִים
  choice: waokozi
  rationale: Nomino hii ya kishiriki inatokana na mzizi wa ‘kuokoa’ na hapa inawataja wanadamu waliotumiwa na Mungu kuleta wokovu au uokozi.
- source_word: וְיוֹשִׁיעוּם
  choice: nao wakawaokoa
  rationale: Kurudia mzizi ‘okoa’ katika ‘waokozi’ na ‘wakawaokoa’ kunadumisha uhusiano wa moja kwa moja wa maneno ya Kiebrania.
- source_word: מִיַּד צָרֵיהֶם
  choice: kutoka mikononi mwa adui zao
  rationale: Tafsiri hii inarudia kwa uthabiti picha na msamiati wa sehemu ya kwanza ya mstari.
theological_decisions:
- issue: Jinsi ya kutafsiri wanadamu wanaoitwa מֹשִׁיעִים
  choice: waokozi
  alternative: wakombozi
  rationale: Neno la Kiebrania linawahusu watu ambao Mungu aliwapa jukumu la kuwaokoa wengine. ‘Waokozi’ linadumisha uhusiano wake na kitenzi ‘wakawaokoa’; tanbihi inaeleza wazi kuwa hawa ni mawakala wa kibinadamu waliotolewa na Mungu, bila kuwachanganya na Mungu kama Mwokozi mkuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ‘mikononi mwa’ imehifadhiwa kwa kuwa ni ya kawaida katika Kiswahili. Alama ya tanbihi imewekwa baada ya ‘waokozi,’ ambako neno linalofafanuliwa linatokea.
