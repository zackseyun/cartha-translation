  text: וַ/יִּבָּֽדְלוּ֙ זֶ֣רַע יִשְׂרָאֵ֔ל מִ/כֹּ֖ל בְּנֵ֣י נֵכָ֑ר וַ/יַּעַמְד֗וּ וַ/יִּתְוַדּוּ֙ עַל חַטֹּ֣אתֵי/הֶ֔ם וַ/עֲוֺנ֖וֹת אֲבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: sw
  text: Ndipo wazao wa Israeli wakajitenga na watu wote wa kigeni, wakasimama na kuungama dhambi zao na maovu ya baba zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hatia za baba zao.” Neno la Kiebrania linaweza kumaanisha maovu au hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: wakajitenga
  rationale: Nifali ya בדל hapa inaeleweka kwa maana ya kujitenga kwa hiari; “wakajitenga” ni ya kawaida na huhifadhi maana hiyo.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: wazao wa Israeli
  rationale: זֶרַע kwa maana ya ukoo wa pamoja ni “wazao”; tafsiri hii ni ya asili kuliko “mbegu” na huhifadhi wazo la nasaba.
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: na wageni wote
  rationale: בְּנֵי נֵכָר ni nahau inayowataja watu wa asili ya kigeni, si wana wa kiume tu. Kitenzi cha Kiswahili “kujitenga na” kinahitaji kiunganishi “na” badala ya kufuata kihalisi מִן.
- source_word: וַיַּעַמְדוּ
  choice: wakasimama
  rationale: Huhifadhi moja kwa moja tendo au mkao wa kusimama uliotajwa na עמד.
- source_word: וַיִּתְוַדּוּ
  choice: na kuungama
  rationale: Hitpaeli ya ידה katika muktadha huu ni kuungama; muundo huu unaunganisha kwa ufasaha tendo hilo na “wakasimama” bila kuongeza namna isiyotajwa.
- source_word: חַטֹּאתֵיהֶם
  choice: dhambi zao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wingi wa חַטָּאת.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: maovu ya baba zao
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu. “Maovu” hapa huhifadhi tofauti na “dhambi” iliyo katika kishazi sambamba, huku ikielekeza kwa matendo mabaya yanayoungamwa.
theological_decisions:
- issue: Kuungama kwa pamoja maovu ya mababu
  choice: Watu waliungama dhambi zao wenyewe pamoja na maovu ya baba zao.
  alternative: Walitambua tu matokeo ya hatia ya baba zao, au walitoa taarifa ya kihistoria bila kuyaungama.
  rationale: Sintaksia inaweka “dhambi zao” na “maovu ya baba zao” chini ya kitenzi kilekile cha kuungama. Tafsiri haiongezi fundisho la kwamba kila mtu hurithi binafsi hatia ya mababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wazao” hutoa maana ya nasaba kwa lugha ya kawaida; “wageni” huepuka tafsiri ya kijinsia ya nahau ya Kiebrania. Kiashirio cha tanbihi [a] kimewekwa baada ya kishazi kinachohusika.
