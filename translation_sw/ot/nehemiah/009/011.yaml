base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: sw
  text: Uliipasua bahari mbele yao[a], nao wakapita katikati ya bahari kwenye nchi kavu; na waliowawafukuza ukawatupa vilindini kama jiwe katika maji makuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uliigawa bahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: uliipasua
  rationale: Kitenzi hiki huonyesha kupasua au kugawa kitu; “uliipasua” ni cha moja kwa moja na kinahifadhi picha halisi ya bahari kufunguliwa.
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Hiki ndicho kiswahili cha kawaida na sahihi kwa maana ya jambo kufanyika mbele yao.
- source_word: וַיַּעַבְרוּ
  choice: wakapita
  rationale: “Wakapita” huonyesha kuvuka kupitia eneo lililotajwa na huungana kwa kawaida na “katikati ya bahari.”
- source_word: בְתוֹךְ הַיָּם
  choice: katikati ya bahari
  rationale: Tafsiri hii inadumisha wazo la sehemu ya ndani au kati ya bahari badala ya kulifupisha kuwa kuvuka bahari tu.
- source_word: בַּיַּבָּשָׁה
  choice: kwenye nchi kavu
  rationale: Usemi huu unaeleza wazi kwamba mahali walipopitia palikuwa pakavu, huku ukibaki wa kawaida katika Kiswahili.
- source_word: רֹדְפֵיהֶם
  choice: waliowafuatilia
  rationale: Neno hili linamaanisha watu waliokuwa wakiwafukuza; “waliowafuatilia” ni wazi kwa msomaji wa kawaida bila kuingiza maana ya mateso.
- source_word: הִשְׁלַכְתָּ
  choice: ukawatupa
  rationale: Hifil ya kitenzi hiki ina maana ya kutupa; chaguo hili ni la moja kwa moja na haliongezi nguvu isiyotajwa.
- source_word: בִמְצוֹלֹת
  choice: vilindini
  rationale: “Vilindini” hurejelea sehemu za kina sana za maji na kudumisha taswira ya kuzama.
- source_word: כְּמוֹ אֶבֶן
  choice: kama jiwe
  rationale: Hii inadumisha tashbihi rahisi na yenye nguvu ya Kiebrania.
- source_word: בְּמַיִם עַזִּים
  choice: katika maji makuu
  rationale: “Maji makuu” huhifadhi maana ya maji yenye nguvu au ukuu katika mtindo wenye hadhi bila kuongeza dhana mahususi ya kuchafuka.
theological_decisions:
- issue: Tendo la Mungu katika ukumbusho wa kutoka Misri
  choice: 'Kudumisha usemi wa nafsi ya pili: “Uliipasua ... ukawatupa.”'
  alternative: Kutumia usemi usio wa moja kwa moja unaoficha kwamba sala inamwambia Mungu.
  rationale: Aya ni sehemu ya sala ya jumuiya inayosimulia matendo ya Mungu. Nafsi ya pili inadumisha nguvu ya ungamo na sifa bila kuongeza ufafanuzi wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala ya hadhara. Muundo unabaki karibu na ushairi wa Kiebrania lakini unasomeka kwa kawaida. Kiunganishi “lakini” kinawakilisha וְ yenye thamani ya utofautishaji kati ya kuokolewa kwa Israeli na kuangamizwa kwa waliowafuatilia.
