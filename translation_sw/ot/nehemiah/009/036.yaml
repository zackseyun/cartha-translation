  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: sw
  text: Tazama, leo sisi ni watumwa; na katika nchi uliyowapa baba zetu ili wale matunda yake na mema yake, tazama, sisi ni watumwa humo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “watumwa juu yake,” yaani, katika nchi ileile ambayo Mungu aliwapa baba zetu.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Chembe hii inavuta fikira na kusisitiza maombolezo; “Tazama” ni ya kawaida, yenye hadhi, na imehifadhiwa katika sehemu zote mbili.
- source_word: הַיּוֹם
  choice: leo
  rationale: Inaonyesha hali yao ya sasa ikilinganishwa na zawadi ya nchi hapo awali.
- source_word: עֲבָדִים
  choice: watumwa
  rationale: Katika muktadha huu neno linasisitiza kutiishwa na kukosa uhuru chini ya utawala wa kigeni, si huduma ya hiari.
- source_word: וְהָאָרֶץ
  choice: na katika nchi
  rationale: Kiebrania kina muundo wa mkato; maana ya mahali imewekwa wazi kwa “katika” ili sentensi iwe ya asili kwa Kiswahili.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: uliyowapa baba zetu
  rationale: Inadumisha usemi wa moja kwa moja kwa Mungu na rejeo la kiume la Kiebrania kwa mababa waliotangulia.
- source_word: לֶאֱכֹל
  choice: ili wale
  rationale: Inawasilisha kusudi la kuitoa nchi, huku mtendaji aliyedhamiriwa akiwa mababa waliopewa nchi.
- source_word: פִּרְיָהּ
  choice: matunda yake
  rationale: Inahifadhi taswira halisi ya mazao ya nchi na lugha ya baraka ya nchi.
- source_word: טוּבָהּ
  choice: mema yake
  rationale: Inahifadhi upana wa maana ya wema na vitu vizuri vya nchi bila kuifupisha kuwa mazao pekee.
- source_word: עָלֶיהָ
  choice: humo
  rationale: Kiswahili cha asili hutumia “humo” kwa kuwa watumwa ndani ya nchi; tanbihi inaeleza umbo halisi la Kiebrania na kinaya chake.
theological_decisions:
- issue: Maana ya עֲבָדִים katika maombolezo ya agano
  choice: watumwa
  alternative: watumishi
  rationale: Hali inayolalamikiwa ni kutiishwa kisiasa katika nchi waliyopewa; “watumwa” huonyesha kupoteza uhuru kwa nguvu kuliko “watumishi”.
- issue: Rejeo la לַאֲבֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu / waliotutangulia
  rationale: Kiebrania kinasema wazi “baba zetu”; tafsiri hii inadumisha neno la kifamilia na kiagano bila kulifanya lisilo na jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudiwa kwa “Tazama” umehifadhiwa kwa msisitizo wa maombolezo. “Watumwa” limetumiwa badala ya “watumishi” kwa sababu muktadha unahusu kutiishwa chini ya utawala wa kigeni.
