base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: sw
  text: Nao wakasimama mahali pao[a], wakasoma katika Kitabu cha Torati ya Yahweh, Mungu wao, kwa robo ya siku[b]; na kwa robo nyingine waliungama na kumsujudia Yahweh, Mungu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali waliposimama,” au labda “juu ya jukwaa lao.” Usemi wa Kiebrania umefupishwa na unaweza kueleweka kwa njia hizi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “robo ya siku ... na robo.” Yaani, walitumia robo moja ya siku kusoma, na robo nyingine kuungama na kusujudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: wakasimama mahali pao
  rationale: Kitenzi קום kinaonyesha kusimama, na usemi mfupi עַל עָמְדָם unaeleweka kwa kawaida kama mahali waliposimama bila kudai kwamba palikuwa jukwaa.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: wakasoma katika Kitabu cha Torati
  rationale: Pamoja na סֵפֶר, קרא humaanisha kusoma maandishi; 'katika Kitabu' ni Kiswahili cha kawaida na kinadumisha picha ya maandishi yaliyokuwa yakisomwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne linatolewa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: רְבִעִית הַיּוֹם ... וּרְבִעִית
  choice: kwa robo ya siku ... na kwa robo nyingine
  rationale: Huhifadhi vipindi viwili vinavyolingana, kila kimoja kikiwa robo ya siku, huku 'nyingine' ikifafanua udondoshaji wa maneno katika kifungu cha pili.
- source_word: מִתְוַדִּים
  choice: waliungama
  rationale: Kauli ya kujirejelea ya ידה hapa inaonyesha kuungama, ikiwasilisha tendo lililoendelea katika kipindi kilichotajwa.
- source_word: וּמִשְׁתַּחֲוִים
  choice: na kumsujudia
  rationale: '''Kusujudu'' huhifadhi tendo halisi la kuinama chini katika ibada badala ya kuligeuza moja kwa moja kuwa dhana ya jumla ya kuabudu.'
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu; 'Yahweh' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Iwapo מִשְׁתַּחֲוִים itafsiriwe kwa dhana ya jumla ya ibada au tendo la mwili
  choice: kumsujudia
  alternative: kumwabudu
  rationale: Kitenzi cha Kiebrania kinabeba picha ya kuinama au kujitupa chini; 'kumsujudia' huhifadhi picha hiyo huku muktadha ukionyesha wazi kuwa ni ibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa masimulizi ya kibiblia lakini unaeleweka kwa msomaji wa kawaida; 'Torati' na 'kusujudu' ni maneno yaliyozoeleka na yenye usahihi wa kimuktadha.
