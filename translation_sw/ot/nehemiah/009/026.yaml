base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: sw
  text: Lakini walikaidi na kukuasi[a]. Wakatupa sheria yako nyuma ya migongo yao. Waliwaua manabii wako, waliowaonya[b] ili kuwarudisha kwako, nao wakafanya matendo makubwa ya dharau dhidi yako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawakutii na kukuasi”; kitenzi cha kwanza cha Kiebrania kinaonyesha ukaidi na upinzani wa makusudi.
    reason: lexical_alternative
  - marker: b
    text: Au “waliotoa ushahidi dhidi yao”; Kiebrania kinaweza kumaanisha kuwaonya kwa uzito au kutoa ushahidi dhidi yao.
    reason: lexical_alternative
  - marker: c
    text: Au “makufuru makubwa,” “matusi makubwa,” au “matendo makubwa ya uchokozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: walikaidi
  rationale: Kitenzi מרה kinaonyesha ukaidi wa makusudi na upinzani. “Walikaidi” ni Kiswahili cha kawaida kinachokitofautisha na kitenzi kinachofuata cha uasi.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: kukuasi
  rationale: מרד ni neno la wazi la kuasi; umbo “kukuasi” linahifadhi kwamba uasi wao ulimwelekea Mungu binafsi.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: Wakatupa ... nyuma ya migongo yao
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania ya kukitupa kitu nyuma ya mgongo kama ishara ya kukikataa kwa dharau.
- source_word: תּוֹרָתְךָ
  choice: sheria yako
  rationale: Katika ungamo hili la historia ya agano, “sheria” ni tafsiri ya kawaida na inayotambulika, ingawa תּוֹרָה pia inaweza kumaanisha mafundisho.
- source_word: נְבִיאֶיךָ
  choice: manabii wako
  rationale: Hii ndiyo tafsiri ya kawaida na sahihi ya neno hili katika muktadha.
- source_word: הֵעִידוּ בָם
  choice: waliowaonya
  rationale: Hifili ya עוּד inaweza kumaanisha kutoa ushahidi dhidi ya mtu au kumwonya kwa uzito. Kusudi linalofuata la kuwarudisha kwa Mungu linaifanya “waliowaonya” kuwa ya asili katika Kiswahili.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: ili kuwarudisha kwako
  rationale: 'Hifili ya שׁוב ni kisababishi hapa: maonyo ya manabii yalilenga kuwafanya watu wamrudie Mungu.'
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: matendo makubwa ya kukudharau
  rationale: Nomino hii inaashiria matendo ya dharau au matusi dhidi ya Mungu. Tafsiri hii inaonyesha upana wake kuliko kuiwekea maana ya maneno ya kufuru pekee.
theological_decisions:
- issue: Kutafsiri jozi וַיַּמְרוּ / וַיִּמְרְדוּ
  choice: Kutofautisha kama “walikaidi na kukuasi”
  alternative: “hawakutii na kukuasi” au “walikuchokoza na kukuasi”
  rationale: Kiebrania kimetumia vitenzi viwili tofauti vinavyozidisha uzito wa kosa. Tafsiri hii inahifadhi mfuatano wa ukaidi kisha uasi bila kuvifanya kuwa wazo moja.
- issue: Maana ya נֶאָצוֹת
  choice: “matendo makubwa ya kukudharau”
  alternative: “makufuru makubwa,” “matusi makubwa,” au “machokozi makubwa”
  rationale: Neno la Kiebrania ni pana na linaweza kuhusisha matendo ya kumdharau Mungu, si usemi wa kufuru tu. Tafsiri kuu inahifadhi upana huo na pia mwelekeo wake kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi fupi zinahifadhi mfululizo wa mashtaka ya Kiebrania; picha ya “nyuma ya migongo yao” imeachwa wazi badala ya kufafanuliwa kuwa kupuuza.
