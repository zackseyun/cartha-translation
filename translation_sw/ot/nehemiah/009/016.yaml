base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: sw
  text: Lakini wao, baba zetu, walitenda kwa kiburi[a], wakakaza shingo zao[b], wala hawakuzisikiliza[c] amri zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walitenda kwa majivuno” au “walitenda kwa kimbelembele.”
    reason: lexical_alternative
  - marker: b
    text: 'Nahau ya Kiebrania: “wakakaza shingo zao,” yaani, wakawa wakaidi au waasi.'
    reason: cultural_note
  - marker: c
    text: Au, “hawakuzingatia” au, kwa maana ya kimuktadha, “hawakutii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Lakini wao
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na matendo ya neema ya Mungu yaliyotangulia; “Lakini wao” huleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַאֲבֹתֵינוּ
  choice: baba zetu
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania na kuhifadhi kujitambulisha kwa jamii ya sasa na vizazi vilivyotangulia.
- source_word: הֵזִידוּ
  choice: walitenda kwa kiburi
  rationale: Kitenzi hiki huonyesha tendo la kujivuna, kujiendea kwa kimbelembele, au kutenda kwa kiburi; tafsiri hii ni ya asili na inaweka mkazo kwenye mwenendo.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: wakafanya shingo zao kuwa ngumu
  rationale: Tafsiri hii huhifadhi picha ya nahau ya Kiebrania huku ikiwa wazi kwa msomaji wa Kiswahili; maana yake ni kuwa wakaidi au waasi.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: wala hawakutii
  rationale: Ingawa maana ya msingi ni kutosikiliza, ikiwa na amri kama kitu chake usemi huu unamaanisha kutosikia kwa kuitikia au kutokutii; “hawakutii” ni Kiswahili cha kawaida na chenye maana sahihi katika muktadha.
- source_word: מִצְוֺתֶיךָ
  choice: amri zako
  rationale: “Amri” ni neno la kawaida na lenye hadhi linalohifadhi maana ya maagizo yenye mamlaka katika muktadha wa agano.
theological_decisions:
- issue: Kujitambulisha kwa pamoja na vizazi vya zamani vilivyotenda dhambi
  choice: Kuhifadhi “baba zetu” katika matini kuu
  alternative: mababu zetu
  rationale: Sala inawaunganisha wazi watu wa wakati huo na vizazi vilivyotangulia. “Baba zetu” huhifadhi usemi wa chanzo na mshikamano huo wa kihistoria bila kuongeza dai la kimadhehebu.
- issue: Uhusiano kati ya kusikia na kutii
  choice: hawakutii katika matini kuu, huku maana halisi ikiwekwa katika tanbihi
  alternative: hawakusikiliza
  rationale: Kiebrania kinaweza kubeba maana ya kusikiliza, kuzingatia, au kutii. Kwa kuwa kitu chake ni amri za Mungu, “hawakutii” huwasilisha matokeo yanayokusudiwa bila kuficha upana wa neno, ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja kwa usomaji wa kawaida; sitiari ya shingo imehifadhiwa na kufafanuliwa kwa tanbihi. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
