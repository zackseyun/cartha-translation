reference: Nehemiah 9:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: sw
  text: Na sasa, Ee Mungu wetu—Mungu mkuu, mwenye nguvu na wa kuogofya,[a] unayelishika agano na kuudumisha upendo wa uaminifu—usione kuwa taabu yote iliyotupata sisi, wafalme wetu, wakuu wetu, makuhani wetu, manabii wetu, baba zetu,[b] na watu wako wote, ni jambo dogo mbele zako, tangu siku za wafalme wa Ashuru hadi leo hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye kutia hofu.” Neno la Kiebrania linaonyesha kwamba Mungu huamsha hofu yenye uchaji.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mababu au watangulizi wao wa kale. Kiebrania kinasema kihalisi “baba zetu.”
    reason: lexical_clarification
lexical_decisions:
- source_word: הָאֵל
  choice: Mungu
  rationale: Neno hili linamfafanua “Mungu wetu” na linafuatwa na sifa zake; “Mungu” ni la kawaida na lenye nguvu ya mwito katika Kiswahili bila marudio yasiyo ya lazima.
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: mkuu, mwenye nguvu na wa kuogofya
  rationale: Huhifadhi mfululizo wa sifa za Mungu. “Wa kuogofya” hapa huonyesha kwamba Mungu huamsha hofu yenye uchaji, si kwamba yeye ni wa kutisha kwa maana nyepesi au ya kawaida.
- source_word: שׁוֹמֵר
  choice: unayelishika
  rationale: Kauli ya wakati unaoendelea humweleza Mungu kuwa mwaminifu daima kwa agano lake; “kulishika agano” ni Kiswahili cha kawaida na cha heshima.
- source_word: הַבְּרִית וְהַחֶסֶד
  choice: agano na kudumisha upendo
  rationale: 'Muundo wa Kiswahili umeweka kitenzi kinachofaa kwa kila nomino: Mungu hulishika agano na hudumisha upendo. חסד ina maana ya upendo mwaminifu na thabiti katika muktadha wa agano; “kudumisha upendo” huwasilisha uaminifu huo kwa lugha ya kawaida.'
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: usione kuwa ni jambo dogo
  rationale: Hii huwasilisha nahau ya Kiebrania ya kutokuichukulia taabu kuwa ndogo mbele za Mungu, kwa Kiswahili wazi na cha asili.
- source_word: כָּל הַתְּלָאָה
  choice: taabu yote
  rationale: תלאה humaanisha taabu, shida au mateso yaliyovumiliwa; “taabu yote” linafaa kwa jumla ya mateso ya kihistoria yanayotajwa.
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: iliyotupata sisi
  rationale: Kiebrania husema kihalisi “iliyotupata/iliyotukuta”; “iliyotupata” ni nahau ya kawaida ya Kiswahili kwa jambo baya lililowajia watu.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: wafalme wetu, wakuu wetu, makuhani wetu, manabii wetu, baba zetu
  rationale: Kiambishi ל־ kinataja wote waliopatwa na taabu. “Wakuu” linafaa kwa שׂרים kama viongozi au maafisa wenye mamlaka, na “baba zetu” huhifadhi umbo la kiume la אבותינו.
- source_word: וּלְכָל עַמֶּךָ
  choice: na watu wako wote
  rationale: Huongeza jumuiya yote ya agano baada ya viongozi na mababu waliotajwa.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר
  choice: tangu siku za wafalme wa Ashuru
  rationale: Huonyesha mwanzo wa kipindi cha taabu na huhifadhi muundo wa moja kwa moja wa Kiebrania.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hadi leo hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi kinachoendelea mpaka wakati wa wasemaji.
theological_decisions:
- issue: Sifa ya Mungu katika נוֹרָא
  choice: wa kuogofya
  alternative: wa kutisha; mwenye kutia hofu
  rationale: “Wa kuogofya” huhifadhi maana ya Mungu kuamsha hofu yenye uchaji bila kupunguza uzito wa sifa hii wala kuifanya iwe lugha ya mazungumzo mepesi.
- issue: Maana ya חסד katika muktadha wa agano
  choice: kudumisha upendo
  alternative: rehema; upendo thabiti; fadhili
  rationale: Uchaguzi huu unaonyesha upendo wa Mungu unaoendelea kwa uaminifu pamoja na agano, bila kulazimisha neno moja la kimadhehebu. Tendo la “kudumisha” hufanya uthabiti wa חסד ueleweke.
- issue: Uwasilishaji wa אֲבֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu; wazee wetu wa kale
  rationale: Kiebrania ni cha kiume na kinawarejelea watangulizi wa Israeli; “baba zetu” huhifadhi umbo hilo, huku tanbihi ikifafanua maana yake pana ya kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtindo wa sala na mfululizo wa walioathiriwa, huku nahau nzito ya Kiebrania ikitolewa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
