id: NEH.9.34
reference: Nehemiah 9:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: sw
  text: Nao wafalme wetu, wakuu wetu, makuhani wetu na mababu zetu[a] hawakuishika sheria yako[b], wala hawakuzisikiliza amri zako na shuhuda zako[c] ambazo ulizitumia kuwaonya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “baba zetu”; hapa maana yake ni vizazi vilivyotutangulia.
    reason: lexical_alternative
  - marker: b
    text: Au “mafundisho yako.” Neno la Kiebrania ni Torah, yaani sheria au mafundisho ya Mungu.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza pia kutafsiriwa “maonyo yako”; kimsingi linamaanisha shuhuda za agano. Maneno ya mwisho yanaweza pia kutafsiriwa, “shuhuda zako ambazo ulizoshuhudia dhidi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Nao
  rationale: Katika mfululizo wa ungamo, kiunganishi hiki kinaongeza kundi jingine kwa msisitizo wa kiasi. “Nao” ni Kiswahili cha kawaida kinachodumisha uhusiano huo bila kuiga alama ya yambwa ya Kiebrania isivyo kawaida katika Kiswahili.
- source_word: מְלָכֵינוּ
  choice: wafalme wetu
  rationale: Ni wingi wenye kiambishi cha nafsi ya kwanza wingi; tafsiri hii ni ya moja kwa moja.
- source_word: שָׂרֵינוּ
  choice: wakuu wetu
  rationale: שָׂרִים hapa ni watawala au viongozi wenye mamlaka. “Wakuu” ni neno la sasa na lenye hadhi, bila kulifanya kuwa “wana wa kifalme.”
- source_word: כֹּהֲנֵינוּ
  choice: makuhani wetu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada ya Israeli.
- source_word: וַאֲבֹתֵינוּ
  choice: na mababu zetu
  rationale: Ingawa maana ya neno kwa neno ni “baba zetu,” hapa linarejelea vizazi vilivyotangulia. “Mababu zetu” huwasilisha maana hiyo kwa Kiswahili cha kawaida; tanbihi inahifadhi umbo la moja kwa moja.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: hawakuishika sheria yako
  rationale: עשה pamoja na תּוֹרָה ni nahau ya kutekeleza au kuzingatia sheria, si kufanya kitu tu. “Kuishika sheria” ni usemi wa asili wa Kiswahili unaofaa muktadha wa agano.
- source_word: הִקְשִׁיבוּ
  choice: hawakuzisikiliza
  rationale: Hiphil ya קשׁב ina maana ya kusikiliza kwa makini au kutii. “Kusikiliza” huhifadhi taswira ya Kiebrania na katika muktadha huu inadokeza kutii.
- source_word: מִצְוֺתֶיךָ
  choice: amri zako
  rationale: Hili ni neno la kawaida kwa maagizo yenye mamlaka ya Mungu na linatofautishwa na sheria kwa ujumla.
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: na maonyo yako
  rationale: עֵדוֹת kimsingi yana wazo la ushuhuda wa agano, lakini pamoja na הַעִידֹתָ hapa yanatumika kama maonyo mazito ya Mungu. “Maonyo” huleta maana hiyo kwa Kiswahili cha kawaida; tanbihi inaonyesha maana ya ushuhuda.
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: uliyowaonya
  rationale: Hiphil ya עוד katika muktadha huu ni kutoa onyo zito kwa ushuhuda wa agano. Kitenzi hiki pia kinaunganika kiasili na “maonyo yako” katika Kiswahili.
theological_decisions:
- issue: Maana ya תּוֹרָה
  choice: sheria yako
  alternative: mafundisho yako
  rationale: Katika ungamo hili la kitaifa kuhusu agano, neno linarejelea sheria ya Mungu iliyopaswa kushikwa, si mafundisho ya jumla tu.
- issue: Maana ya אָבוֹת
  choice: mababu zetu
  alternative: baba zetu
  rationale: Muktadha unahusu vizazi vya zamani vya Israeli. “Mababu” ni sahihi kwa rejeo hilo katika Kiswahili, huku maana halisi ya “baba” ikitolewa katika tanbihi.
- issue: Uhusiano kati ya עֵדוֹת na הַעִידֹתָ
  choice: maonyo yako uliyowaonya
  alternative: shuhuda zako ulizoshuhudia dhidi yao
  rationale: Tafsiri iliyochaguliwa huwasilisha kazi ya shuhuda hizo kama maonyo mazito bila kuondoa msingi wake wa kiagano, ambao umeelezwa katika tanbihi. Njia mbadala ni ya karibu zaidi na umbo la Kiebrania lakini si ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida. “Nao” huunganisha aya na ungamo linalotangulia; “wakuu” huepuka neno la kizamani au lenye maana finyu la wana wa kifalme; na “hawakuzisikiliza” huhifadhi sitiari ya kusikia inayobeba pia wazo la kutii.
