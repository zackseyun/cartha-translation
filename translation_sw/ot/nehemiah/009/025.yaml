id: NEH.9.25
reference: Nehemiah 9:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: sw
  text: Waliteka miji yenye ngome na nchi yenye rutuba[a], wakamiliki nyumba zilizojaa kila kitu kizuri, visima vya kuhifadhia maji vilivyochongwa, mashamba ya mizabibu, mizeituni, na miti ya matunda kwa wingi. Wakala, wakashiba[b], wakanenepa, na wakajistarehesha katika wema wako mkuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa herufi, “nchi nono.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakatosheka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: Waliteka
  rationale: לכד katika muktadha wa miji humaanisha kuiteka kwa nguvu; “waliteka” ni wazi na ya kawaida.
- source_word: עָרִים בְּצֻרוֹת
  choice: miji yenye ngome
  rationale: בצר huonyesha miji iliyoimarishwa kwa ulinzi; usemi huu ni wa asili katika Kiswahili sanifu.
- source_word: אֲדָמָה שְׁמֵנָה
  choice: nchi yenye rutuba
  rationale: Kwa herufi ni “nchi nono,” lakini ni nahau ya ardhi yenye uzalishaji mwingi; “yenye rutuba” huwasilisha maana yake kwa kawaida.
- source_word: וַיִּירְשׁוּ
  choice: wakamiliki
  rationale: ירשׁ hapa ni kuingia katika umiliki wa vitu walivyopewa baada ya ushindi, si urithi wa kifamilia tu.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: nyumba zilizojaa kila kitu kizuri
  rationale: Huhifadhi upana wa כָּל טוּב na kusomeka kwa kawaida.
- source_word: בֹּרוֹת חֲצוּבִים
  choice: visima vya kuhifadhia maji vilivyochongwa
  rationale: בּוֹר hapa ni shimo la kuhifadhi maji, si kisima chenye chemchemi; ufafanuzi huu huzuia maana potovu huku חצוב ikibaki “vilivyochongwa.”
- source_word: כְּרָמִים
  choice: mashamba ya mizabibu
  rationale: Ni kisawe cha kawaida na wazi cha כרמים.
- source_word: זֵיתִים
  choice: mizeituni
  rationale: Katika orodha ya mazao ya kudumu, neno linaonyesha miti ya mizeituni.
- source_word: עֵץ מַאֲכָל לָרֹב
  choice: miti mingi ya matunda
  rationale: עֵץ מַאֲכָל ni miti itoayo chakula, na לָרֹב huonyesha wingi; tafsiri hii ni fupi na ya asili.
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: Wakala, wakashiba
  rationale: שׂבע ni kula mpaka kutosheka; “wakashiba” huhifadhi picha halisi na maana ya kuridhika.
- source_word: וַיַּשְׁמִינוּ
  choice: wakanenepa
  rationale: Huhifadhi picha wazi ya Kiebrania ya kunenepa kwa sababu ya wingi bila kuibadili moja kwa moja kuwa hukumu ya kimaadili.
- source_word: וַיִּתְעַדְּנוּ
  choice: wakajifurahisha
  rationale: התעדן hapa ni kujistarehesha au kujifurahisha kwa anasa kutokana na wingi; “wakajifurahisha” ni ya heshima na rahisi kueleweka.
theological_decisions:
- issue: Maana ya בְּטוּבְךָ הַגָּדוֹל
  choice: kwa wema wako mkuu
  alternative: katika wingi mkuu wa mema yako
  rationale: “Wema” huhifadhi upana wa טוּב kuwa tabia njema na ukarimu wa Mungu, huku “kwa” ikiruhusu uhusiano wa sababu au mazingira bila kuubana kupita kiasi.
- issue: Iwapo וַיַּשְׁמִינוּ ina hukumu ya kimaadili
  choice: wakanenepa
  alternative: wakafanikiwa
  rationale: Chanzo kinatumia picha halisi ya kunenepa. Tafsiri haiingizi hukumu wala kuiondoa kwa kuibadili kuwa ustawi pekee; muktadha mpana unaweza kutoa mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya simulizi umehifadhiwa kwa miundo ya “waka-”. “Visima vya kuhifadhia maji” hutofautisha birika zilizochongwa na visima vya maji ya ardhini.
