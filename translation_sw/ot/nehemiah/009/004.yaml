id: NEH.9.4
reference: Nehemiah 9:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: sw
  text: Ndipo Yeshua, Bani, Kadmieli, Shebania, Buni, Sherebia, Bani na Kenani wakasimama kwenye mwinuko wa Walawi[a], wakamlilia Yahwe Mungu wao kwa sauti kuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwinuko/ngazi za Walawi”; maneno hayo yanaweza kumaanisha mahali palipoinuka au ngazi zilizohusishwa na Walawi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: wakasimama
  rationale: Kitenzi קום hapa kinaonyesha kuchukua nafasi ya kusimama; wingi wa Kiswahili unapatana kwa kawaida na orodha ya watu inayofuata.
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: juu ya mahali palipoinuka pa Walawi
  rationale: מַעֲלֵה inaweza kumaanisha mwinuko, ngazi, au mahali pa kupandia. Tafsiri hii inaonyesha uwezekano wa sehemu iliyoinuka bila kuamua bila msingi kuwa ilikuwa jukwaa.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: Yeshua, Bani, Kadmieli, Shebania, Buni, Sherebia, Bani na Kenani
  rationale: Majina yamenukuliwa kwa maumbo yanayosomeka kwa Kiswahili; jina Bani limedumishwa mara mbili kama lilivyo katika maandishi ya Kiebrania.
- source_word: וַיִּזְעֲקוּ
  choice: wakamlilia
  rationale: זעק huonyesha kilio chenye nguvu, mara nyingi cha kumwomba Mungu; 'wakamlilia' huhifadhi nguvu na mwelekeo wa kilio hicho.
- source_word: בְּקוֹל גָּדוֹל
  choice: kwa sauti kuu
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa nahau ya Kiebrania, unaodumisha uzito wa usemi.
- source_word: אֶל יְהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetolewa kama jina binafsi, Yahwe, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Kiambishi cha umilikaji kimehifadhiwa moja kwa moja na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi; 'Yahwe' hulihifadhi kama jina na kuepuka kulibadilisha kuwa cheo.
- issue: Nguvu na mwelekeo wa זעק
  choice: wakamlilia Yahwe
  alternative: wakamwita Yahwe au wakampazia Yahwe sauti
  rationale: Muundo huu unaonyesha kilio chenye nguvu kilichoelekezwa kwa Mungu bila kuamua kama kilikuwa sala ya kuomba msaada au tangazo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Mahali palipoinuka' limetumiwa badala ya 'jukwaa' ili kuhifadhi kutokuwa na uhakika kwa מַעֲלֵה; alama ya tanbihi [a] ipo katika matini kuu.
