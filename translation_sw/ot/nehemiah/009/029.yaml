reference: Nehemiah 9:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: sw
  text: Uliwaonya ili kuwarudisha kwenye sheria yako,[a] lakini walitenda kwa jeuri na hawakuzisikiliza amri zako. Walitenda dhambi kwa kuzikiuka hukumu zako, ambazo mtu akizitenda ataishi kwa hizo. Walitoa bega la ukaidi,[b] wakafanya shingo zao kuwa ngumu, wala hawakutaka kusikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kuwarudisha kwenye mafundisho yako.” Neno la Kiebrania linaweza kumaanisha sheria au mafundisho.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “walitoa bega la ukaidi.” Hii ni sitiari ya ukaidi na kukataa kuitikia.
    reason: idiom
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: Uliwaonya
  rationale: Hifili ya עוד hapa ina maana ya kuwaonya kwa uzito au kuwashuhudia dhidi yao. “Uliwaonya” ni Kiswahili cha kawaida kinachobakiza kusudi la wito wa Mungu wa kuwataka wageuke.
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: ili kuwarudisha kwenye sheria yako
  rationale: Hifili ya שׁוב inaonyesha kusababisha warudi, na תּוֹרָה katika muktadha huu wa agano inafaa kutafsiriwa “sheria.”
- source_word: הֵזִידוּ
  choice: walitenda kwa kiburi
  rationale: זיד inaonyesha tendo la ukaidi na majivuno, si hisia ya ndani tu; kauli hii ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: hawakuzisikiliza amri zako
  rationale: שׁמע pamoja na לְ hubeba wazo la kusikiliza kwa utii. Tafsiri hii inadumisha taswira ya kusikia bila kupunguza maana ya kutotii.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: Walitenda dhambi dhidi ya hukumu zako
  rationale: מִשְׁפָּטִים ni hukumu au masharti ya kisheria ya Mungu; “dhidi ya” inawakilisha nguvu ya בָם kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: ambazo mtu akizitenda ataishi kwa hizo
  rationale: Kauli inahifadhi muundo na nahau ya Kiebrania inayorejelea Mambo ya Walawi 18:5. אָדָם hapa ni binadamu yeyote, hivyo “mtu” ni sahihi na ya kawaida kwa Kiswahili.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: Waligeuza bega lao kwa ukaidi
  rationale: Tafsiri hii inadumisha taswira ya bega linalokataa kubeba wajibu huku ikitoa Kiswahili kinachoeleweka kuliko tafsiri sisisi “walitoa bega.”
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: wakakaza shingo zao
  rationale: Hii inadumisha sitiari ya Kiebrania ya ukaidi kwa usemi mfupi na wa asili katika Kiswahili.
- source_word: וְלֹא שָׁמֵעוּ
  choice: wala hawakutaka kusikiliza
  rationale: Kauli ya mwisho inasisitiza kukataa kwa makusudi na kwa kuendelea; “hawakutaka” huonyesha nguvu hiyo bila kubadili wazo la kusikiliza.
theological_decisions:
- issue: Maana ya kuishi kwa kuzitenda hukumu za Mungu
  choice: ambazo mtu akizitenda ataishi kwa hizo
  alternative: ambazo mtu anapaswa kuzitenda ili aishi
  rationale: Muundo uliochaguliwa huhifadhi mwangwi wa Mambo ya Walawi 18:5 na mvutano wa kauli ya chanzo bila kuamua kimadhehebu aina au upeo wa ‘uzima’ unaokusudiwa.
- issue: Upeo wa אָדָם
  choice: mtu
  alternative: mwanadamu
  rationale: Katika kifungu hiki אָדָם ni nomino ya umoja yenye maana ya jumla kwa binadamu yeyote. “Mtu” hutoa maana hiyo moja kwa moja bila kuifanya iwe ya jinsia moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari za bega na shingo zimehifadhiwa kwa namna ya asili, na istilahi za agano “sheria,” “amri,” na “hukumu” zimetofautishwa.
