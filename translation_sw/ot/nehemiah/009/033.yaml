id: NEH.9.33
reference: Nehemiah 9:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: sw
  text: Hata hivyo, wewe ni mwenye haki katika yote yaliyotupata,[a] kwa maana umetenda kwa uaminifu, lakini sisi tumetenda kwa uovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhusiana na yote yaliyotupata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Hata hivyo, wewe
  rationale: Kiunganishi pamoja na kiwakilishi kinatokeza utofautishaji kati ya haki ya Mungu na hatia ya Israeli; “Hata hivyo” ni ya asili katika Kiswahili na hudumisha msisitizo wa kumwelekea Mungu moja kwa moja.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Neno hili linaeleza unyoofu wa kimaadili wa Mungu kuhusiana na yaliyowapata watu. “Mwenye haki” hudumisha uzito wa agano na teolojia kuliko usemi mwembamba zaidi wa kisheria.
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: katika yote yaliyotupata
  rationale: Kirai kinaonyesha jambo ambalo ndani yake au kuhusiana nalo Mungu anakiriwa kuwa mwenye haki. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi maelezo ya adhabu yasiyotajwa wazi.
- source_word: כִּי
  choice: kwa maana
  rationale: 'Hutambulisha msingi wa kauli iliyotangulia: Mungu ni mwenye haki kwa sababu ametenda kwa uaminifu, tofauti na watu.'
- source_word: אֱמֶת
  choice: kwa uaminifu
  rationale: Ingawa maana ya msingi inaweza kuwa “kweli/ukweli,” katika muungano wake na עשה hapa inaeleza kutenda kwa uthabiti na uaminifu.
- source_word: עָשִׂיתָ
  choice: umetenda
  rationale: Pamoja na אֱמֶת, kitenzi kinaeleza mwenendo wa Mungu kwa watu; “umetenda” ni sahihi na ya asili.
- source_word: וַ/אֲנַחְנוּ
  choice: lakini sisi
  rationale: Kiunganishi kina nguvu ya utofautishaji katika muktadha, kikilinganisha mwenendo wa watu na uaminifu wa Mungu.
- source_word: הִרְשָׁעְנוּ
  choice: tumetenda kwa uovu
  rationale: Muundo wa Hiphil unaeleza kutenda kwa uovu au kufanya mabaya. Usemi huu hudumisha nguvu ya kitenzi na usambamba na “umetenda kwa uaminifu.”
theological_decisions:
- issue: Tabia ya Mungu kuhusiana na hukumu iliyowapata Israeli
  choice: Mungu anakiriwa kuwa mwenye haki katika yote yaliyowapata watu.
  alternative: Wewe una haki kwa kutuadhibu katika yote yaliyotokea.
  rationale: Kiebrania kinathibitisha haki ya Mungu kuhusiana na misiba iliyowapata watu, lakini hakifafanui moja kwa moja kila tukio kwa kutumia kitenzi “kuadhibu.” Tafsiri hudumisha mvutano wa kitheolojia na wajibu wa watu bila kuongeza utaratibu wa adhabu kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi hudumisha utofautishaji kati ya uaminifu wa Mungu na uovu wa watu. Alama ya tanbihi [a] imewekwa katika matini kuu.
