  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: sw
  text: Mazao yake mengi[a] yanakwenda kwa wafalme ambao umewaweka juu yetu kwa sababu ya dhambi zetu. Wao hutawala miili yetu[b] na mifugo yetu wapendavyo, nasi tumo katika dhiki kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mavuno yake”; kiambishi “yake” kinarejelea nchi iliyotajwa katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au “nafsi zetu”; kwa Kiebrania, “miili yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ
  choice: Mazao yake
  rationale: תְּבוּאָה ni mazao au mavuno ya ardhi; kiambishi cha nafsi ya tatu ya kike kinarejelea nchi iliyotajwa katika mstari uliotangulia.
- source_word: מַרְבָּה
  choice: mengi
  rationale: Neno hili linaonyesha wingi au kuongezeka; “mengi” linaeleza kwa kawaida wingi wa mazao bila kupoteza maana ya msingi.
- source_word: לַמְּלָכִים
  choice: yanakwenda kwa wafalme
  rationale: לַ inaonyesha yanakoelekezwa mazao au wanaonufaika nayo; usemi huu unaonyesha kwamba mavuno yanawafikia watawala hao.
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: ambao umewaweka juu yetu
  rationale: נתן pamoja na עַל hapa humaanisha kuwaweka au kuwapa mamlaka juu ya wengine, huku ikihifadhi wazi tendo la Mungu.
- source_word: בְּחַטֹּאותֵינוּ
  choice: kwa sababu ya dhambi zetu
  rationale: בְּ lina maana ya kisababishi katika muktadha huu na linaeleza sababu ya kutiishwa kwao.
- source_word: גְּוִיֹּתֵינוּ
  choice: miili yetu
  rationale: גְּוִיָּה hapa linamaanisha miili au nafsi zao zilizo chini ya mamlaka ya watawala, wala si maiti.
- source_word: מֹשְׁלִים
  choice: hutawala
  rationale: Kauli endelevu ya Kiebrania inaonyesha utawala unaoendelea; “hutawala” ni ya moja kwa moja na ya kawaida.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: na mifugo yetu
  rationale: בְּהֵמָה kwa pamoja hurejelea wanyama wa kufugwa; “mifugo” ni pana na ya kawaida katika Kiswahili.
- source_word: כִּרְצוֹנָם
  choice: wapendavyo
  rationale: Usemi huu unaonyesha kwamba watawala wanatumia mamlaka kulingana na mapenzi yao wenyewe.
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: nasi tumo katika dhiki kubwa
  rationale: צָרָה ni dhiki au taabu; “dhiki kubwa” inadumisha uzito wa maombolezo ya jumuiya.
theological_decisions:
- issue: Tendo la Mungu katika kutawaliwa na wafalme wa kigeni
  choice: Mstari unasema Mungu aliwaweka wafalme hao juu ya watu kwa sababu ya dhambi zao.
  alternative: Mungu aliruhusu tu wafalme hao watawale, au aliidhinisha kila jambo walilofanya.
  rationale: Maneno נָתַתָּה עָלֵינוּ yanahusisha moja kwa moja kutiishwa kwao na tendo la hukumu la Mungu. Tafsiri inadumisha maana hiyo bila kudai kwamba Mungu aliidhinisha ukandamizaji wote wa wafalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo wa sentensi unahifadhi maombolezo ya pamoja na tendo la Mungu bila kuongeza tafsiri ya kimadhehebu.
