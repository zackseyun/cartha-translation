base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: sw
  text: Wewe ndiye Yahwe Mungu, uliyemchagua Abramu, ukamtoa katika Uru ya Wakaldayo, ukampa jina Abrahamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Wewe ndiye
  rationale: Muundo huu wa Kiebrania una msisitizo wa kumtambulisha Mungu moja kwa moja; “Wewe ndiye” ni wa asili na huhifadhi msisitizo huo katika Kiswahili.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Yahwe Mungu
  rationale: Huhifadhi jina la Mungu YHWH pamoja na utambulisho “Mungu,” kwa mtiririko wa kawaida wa Kiswahili.
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: uliyemchagua Abramu
  rationale: Kitenzi בחר kinamaanisha kuchagua; kihusishi cha Kiebrania hapa humtambulisha Abramu kama yule aliyechaguliwa na hakihitaji kutafsiriwa kando katika Kiswahili.
- source_word: וְהוֹצֵאתוֹ
  choice: ukamtoa
  rationale: Hifili ya יצא ina maana ya kumtoa au kumleta nje; “ukamtoa” ni fupi, ya asili, na huhifadhi tendo la Mungu.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: Uru ya Wakaldayo
  rationale: Ni jina la kijiografia linalomaanisha Uru inayohusishwa na Wakaldayo; umbo hili linaeleweka katika Kiswahili cha Biblia.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: ukampa jina Abrahamu
  rationale: Ingawa kwa neno moja moja ni “ukaweka jina lake,” Kiswahili cha kawaida hutumia “kumpa jina” kwa tendo la kubadili au kumwekea mtu jina.
theological_decisions:
- issue: Kutafsiri jina la Mungu YHWH
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina binafsi יְהוָה, si cheo pekee. “Yahwe” hulihifadhi kama jina bila kulibadili kuwa cheo; “Yehova” ni umbo jingine la kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Majina “Abramu” na “Abrahamu” yametofautishwa ili kuhifadhi mabadiliko ya jina katika maandishi.
