base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: sw
  text: Hata walipojitengenezea sanamu ya ndama wa kusubu[a] na kusema, “Huyu ndiye mungu wako aliyekutoa Misri,” walitenda makufuru makubwa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu ya ndama ya metali iliyomiminwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “uchokozi mkubwa” au “matendo makubwa ya dharau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Hata walipo-
  rationale: Muundo huu unaonyesha kwamba uasi wao ulitokea licha ya rehema za Mungu, huku ukiendelea kwa kawaida na sentensi pana ya sala.
- source_word: עָשׂוּ לָהֶם
  choice: walipojitengenezea
  rationale: Kiambishi cha kujitendea kinaonyesha kwamba walitengeneza sanamu hiyo kwa ajili yao wenyewe; “walipojitengenezea” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: עֵגֶל מַסֵּכָה
  choice: sanamu ya ndama ya metali iliyoyeyushwa
  rationale: מַסֵּכָה ni kitu kilichotengenezwa kwa kumimina metali iliyoyeyushwa. Neno “sanamu” linaweka wazi kwamba ndama huyo alikuwa mfano wa kuabudiwa, bila kupoteza umbo la ndama wala nyenzo yake.
- source_word: זֶה אֱלֹהֶיךָ
  choice: Huyu ndiye mungu wako
  rationale: Kiwakilishi זֶה na kiambishi cha umoja vinaunga mkono tafsiri ya umoja. “Huyu” linapatana na kiumbe anachowakilisha ndama, na “mungu” kwa herufi ndogo linaonyesha kuwa anayetajwa ni sanamu.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: aliyekutoa Misri
  rationale: Hii ndiyo njia ya kawaida na ya kueleweka ya kueleza kwa Kiswahili fomula ya Kutoka ya Kiebrania, ingawa kitenzi cha Kiebrania kihalisi kina wazo la “kupandisha kutoka.”
- source_word: וַיַּעֲשׂוּ
  choice: walitenda
  rationale: “Kutenda” huungana kwa kawaida na “makufuru” na huhifadhi maana ya kufanya matendo hayo.
- source_word: נֶאָצוֹת גְּדֹלוֹת
  choice: makufuru makubwa
  rationale: Kirai hiki kinaeleza dharau nzito dhidi ya Mungu. “Makufuru” huonyesha uzito na mwelekeo wake kwa Mungu, huku tanbihi ikihifadhi maana pana ya uchokozi au matendo ya dharau.
theological_decisions:
- issue: Maana ya אֱלֹהֶיךָ inayorejelea sanamu
  choice: mungu wako
  alternative: Mungu wako
  rationale: Anayerejelewa ni ndama wa metali, kwa hiyo herufi ndogo huepuka kumpa sanamu uhalali au kumtambulisha moja kwa moja kuwa BWANA, huku ikihifadhi dai la watu.
- issue: Nguvu ya נֶאָצוֹת kama kosa dhidi ya Mungu
  choice: makufuru makubwa
  alternative: uchokozi mkubwa; matendo makubwa ya dharau
  rationale: Katika muktadha wa ibada ya sanamu, neno hili linaonyesha kumvunjia Mungu heshima. Tafsiri kuu inaonyesha uzito huo, na tanbihi inahifadhi upana wa maana ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeachwa ikiishia kwa koma kwa sababu mstari huu ni kishazi kinachoendelea katika muundo mpana wa sala. Viashiria vya tanbihi [a] na [b] vimewekwa moja kwa moja baada ya maneno yanayohusika.
